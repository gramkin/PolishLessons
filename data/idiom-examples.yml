      source:
        kind: authored
    - pl: – Pamiętasz mnie? – No chyba!
      ru: — Ты меня помнишь? — Конечно!
      source:
        kind: authored
- key: ależ tak!
  examples:
    - pl: – Mogę wejść? – Ależ tak, proszę!
      ru: — Можно войти? — Ну конечно, проходите!
      source:
        kind: authored
    - pl: – Naprawdę mi pomożesz? – Ależ tak!
      ru: — Ты правда мне поможешь? — Ну да, конечно!
      source:
        kind: authored
    - pl: – Czy to miejsce jest wolne? – Ależ tak, proszę siadać.
      ru: — Это место свободно? — Да, конечно, садитесь.
      source:
        kind: authored
- key: kiedy indziej
