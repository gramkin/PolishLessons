        kind: translated
        id: 7681575
    - pl: W dzisiejszych czasach ceny są stabilne.
      ru: В наше время цены стабильны.
      source:
        kind: translated
        id: 10770563
    - pl: W dzisiejszych czasach życie bez prądu jest niewyobrażalne.
      ru: В наше время невозможно себе представить жизнь без электричества.
      source:
        kind: tatoeba
        id: 5138620
- key: ciąg dalszy
  examples:
    - pl: Ciąg dalszy nastąpi.
      ru: Продолжение следует.
      source:
        kind: translated
        id: 6308790
    - pl: Czekam na ciąg dalszy.
      ru: Я жду продолжения.
      source:
        kind: authored
    - pl: Ciąg dalszy tej historii poznamy jutro.
      ru: Продолжение этой истории мы узнаем завтра.
      source:
        kind: authored
- key: no chyba!
  examples:
    - pl: – Idziesz z nami? – No chyba!
      ru: — Идёшь с нами? — Ещё бы!
      source:
        kind: authored
    - pl: – Smakowało ci? – No chyba! Było pyszne.
