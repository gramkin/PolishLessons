# review
# Three examples per published idiom (keyed by the frequency file pl); see shared/idioms.ts.
- key: naprawdę?
  examples:
    - pl: Naprawdę?
      ru: Серьёзно?!
      source:
        kind: tatoeba
        id: 457404
