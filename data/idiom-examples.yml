      ru: Мне ещё нужно уладить одно дело в городе.
      source:
        kind: authored
- key: w toku
  examples:
    - pl: Śledztwo jest wciąż w toku.
      ru: Следствие всё ещё идёт.
      source:
        kind: authored
    - pl: W toku rozmowy wyszło na jaw, że kłamał.
      ru: В ходе разговора выяснилось, что он лгал.
      source:
        kind: authored
    - pl: W toku studiów zmienił kierunek.
      ru: В ходе учёбы он сменил специальность.
      source:
        kind: authored
- key: co nieco
  examples:
    - pl: Wiem co nieco o historii Polski.
      ru: Я кое-что знаю об истории Польши.
      source:
        kind: authored
    - pl: Zjedz co nieco przed wyjściem.
      ru: Съешь немножко перед выходом.
      source:
        kind: authored
    - pl: Mówię co nieco po polsku.
      ru: Я немножко говорю по-польски.
      source:
        kind: authored
- key: drobiazg!
  examples:
    - pl: Nie dziękuj, to drobiazg.
      ru: Не благодари, это пустяк.
      source:
        kind: authored
    - pl: To drobiazg.
      ru: Это пустяк.
      source:
        kind: authored
    - pl: – Dziękuję za pomoc! – Drobiazg!
      ru: — Спасибо за помощь! — Пустяки!
      source:
        kind: authored
- key: ależ skąd!
  examples:
    - pl: – Przeszkadzam? – Ależ skąd! Wejdź.
      ru: — Я не помешал? — Да что ты, нисколько! Заходи.
      source:
        kind: authored
    - pl: – Jesteś na mnie zły? – Ależ skąd!
      ru: — Ты на меня злишься? — Да что ты, вовсе нет!
      source:
        kind: authored
    - pl: – Czy to dla pana problem? – Ależ skąd, chętnie pomogę.
      ru: — Это для вас проблема? — Да что вы, охотно помогу.
      source:
        kind: authored
- key: gruba ryba
  examples:
    - pl: Policja złapała wreszcie grubą rybę.
      ru: Полиция наконец поймала крупную рыбу.
      source:
        kind: authored
    - pl: Jego ojciec to gruba ryba w ministerstwie.
      ru: Его отец — важная персона в министерстве.
      source:
        kind: authored
    - pl: Na przyjęciu było kilka grubych ryb z branży.
      ru: На приёме было несколько больших шишек из отрасли.
      source:
        kind: authored
- key: w dzisiejszych czasach
  examples:
    - pl: Kto pisze listy w dzisiejszych czasach?
