    - pl: Wrócili z gór cali i zdrowi.
      ru: Они вернулись с гор целыми и невредимыми.
      source:
        kind: authored
    - pl: Dojechałeś cały i zdrowy, to najważniejsze.
      ru: Ты доехал цел и невредим, это главное.
      source:
        kind: authored
    - pl: Wszyscy zakładnicy są cali i zdrowi.
      ru: Все заложники целы и здоровы.
      source:
        kind: authored
- key: załatwić sprawę
  examples:
    - pl: On załatwił sprawę.
      ru: Он уладил дело.
      source:
        kind: authored
    - pl: Zadzwonię do urzędu i załatwię sprawę.
      ru: Я позвоню в учреждение и улажу дело.
      source:
        kind: authored
