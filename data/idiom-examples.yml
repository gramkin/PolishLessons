    - pl: Nie mam nic wspólnego z tą zbrodnią.
      ru: Я не имею с этим преступлением ничего общего.
      source:
        kind: translated
        id: 4768983
    - pl: Te plotki nie miały nic wspólnego z rzeczywistością.
      ru: Эти сплетни не имели ничего общего с действительностью.
      source:
        kind: tatoeba
        id: 12574244
    - pl: Nie miał nic wspólnego ze zdarzeniem.
      ru: Он не имел ничего общего с происшествием.
      source:
        kind: authored
- key: z całym szacunkiem
  examples:
    - pl: Z całym szacunkiem.
      ru: При всём уважении.
      source:
        kind: translated
        id: 348663
    - pl: Z całym szacunkiem, ale nie ma pan racji.
      ru: При всём уважении, вы не правы.
      source:
        kind: authored
    - pl: Z całym szacunkiem, to nie twoja sprawa.
      ru: При всём уважении, это не твоё дело.
      source:
        kind: authored
- key: z miejsca
  examples:
    - pl: Z miejsca się zgodził.
      ru: Он сразу согласился.
      source:
        kind: authored
    - pl: Polubiłam ją z miejsca.
      ru: Она мне сразу понравилась.
      source:
        kind: authored
    - pl: Dostał tę pracę z miejsca.
      ru: Он получил эту работу с ходу.
      source:
        kind: authored
- key: jestem ciekaw
  examples:
    - pl: Jestem ciekaw, co on powie.
      ru: Мне интересно, что он скажет.
      source:
        kind: authored
    - pl: Jestem ciekaw twojej opinii.
      ru: Мне интересно твоё мнение.
      source:
        kind: authored
    - pl: Jestem ciekaw, jak to się skończy.
      ru: Мне любопытно, чем это кончится.
      source:
        kind: authored
- key: załóżmy, że...
  examples:
    - pl: Załóżmy, że to prawda.
      ru: Предположим, что это правда.
      source:
        kind: translated
        id: 10783507
    - pl: Załóżmy, że masz rację.
      ru: Предположим, что ты прав.
      source:
        kind: authored
    - pl: Załóżmy, że ona tu jest.
      ru: Предположим, что она здесь.
      source:
        kind: translated
        id: 826698
- key: tak czy inaczej
  examples:
    - pl: Tak czy inaczej, trzeba iść.
      ru: Так или иначе, надо идти.
      source:
        kind: authored
    - pl: Tak czy inaczej, nie zgadzam się z twoim poglądem.
      ru: Так или иначе, я не согласен с твоим мнением.
      source:
        kind: translated
        id: 817884
    - pl: Tak czy inaczej, musimy to skończyć dzisiaj.
      ru: Так или иначе, нам нужно закончить это сегодня.
      source:
        kind: authored
- key: zbieg okoliczności
  examples:
    - pl: Co za zbieg okoliczności!
      ru: Какое совпадение!
      source:
        kind: translated
        id: 357617
    - pl: Myślę, że to zbieg okoliczności.
      ru: Я думаю, это совпадение.
      source:
        kind: translated
        id: 2342749
    - pl: To był zwykły zbieg okoliczności.
      ru: Это было обычное стечение обстоятельств.
      source:
        kind: authored
- key: ach tak
  examples:
    - pl: Ach tak!
      ru: Ах так!
      source:
        kind: translated
        id: 8676295
    - pl: Ach tak.
      ru: Ах, вот как.
      source:
        kind: translated
        id: 8750928
    - pl: – Jutro nie przyjdę. – Ach tak? A dlaczego?
      ru: — Завтра я не приду. — Ах так? А почему?
      source:
        kind: authored
- key: w tygodniu
  examples:
    - pl: Miewacie gości w tygodniu?
      ru: У вас бывают гости в будни?
      source:
        kind: authored
    - pl: W tygodniu wstaję o szóstej.
      ru: В будни я встаю в шесть.
      source:
        kind: authored
    - pl: W tygodniu pracuję, a w weekend odpoczywam.
      ru: В будни я работаю, а в выходные отдыхаю.
      source:
        kind: authored
- key: nic dziwnego
  examples:
    - pl: Nic dziwnego!
      ru: Ничего удивительного!
      source:
        kind: translated
        id: 8755768
    - pl: Jest zmęczony, nic dziwnego, pracował całą noc.
      ru: Он устал — ничего удивительного, он работал всю ночь.
      source:
        kind: authored
    - pl: Nic dziwnego, że jesteś głodny.
      ru: Неудивительно, что ты голоден.
      source:
        kind: authored
- key: wstydź się!
  examples:
    - pl: Wstydź się!
      ru: Стыдись!
      source:
        kind: authored
    - pl: Wstydźcie się!
      ru: Стыдитесь!
      source:
        kind: authored
    - pl: Wstydź się, tak się nie mówi do mamy!
      ru: Как тебе не стыдно, так с мамой не разговаривают!
      source:
        kind: authored
- key: co dalej?
  examples:
    - pl: I co dalej?
      ru: И что дальше?
      source:
        kind: tatoeba
        id: 6320380
    - pl: Jutro postanowimy, co dalej.
      ru: Завтра мы решим, что дальше.
      source:
        kind: authored
    - pl: – Skończyliśmy. – Dobrze, co dalej?
      ru: — Мы закончили. — Хорошо, что дальше?
      source:
        kind: authored
- key: gówno prawda
  examples:
    - pl: Gówno prawda.
      ru: Ни фига подобного.
      source:
        kind: translated
        id: 6160557
    - pl: – Mówi, że był chory. – Gówno prawda.
      ru: — Он говорит, что болел. — Враньё.
      source:
        kind: authored
    - pl: Gówno prawda, nikt ci nie uwierzy.
      ru: Чушь собачья, тебе никто не поверит.
      source:
        kind: authored
- key: pod wrażeniem
  examples:
    - pl: Jestem pod wrażeniem.
      ru: Я под впечатлением.
      source:
        kind: translated
        id: 352188
    - pl: Byłem pod wrażeniem jego opowieści.
      ru: Я был под впечатлением от его рассказа.
      source:
        kind: translated
        id: 367622
    - pl: Wszyscy byliśmy pod wrażeniem jego opowieści o przygodach.
      ru: Мы все были под впечатлением его рассказов о приключениях.
      source:
        kind: translated
        id: 361703
- key: skąd pochodzisz?
  examples:
    - pl: Skąd pochodzisz?
      ru: Откуда ты родом?
      source:
        kind: translated
        id: 349084
    - pl: Skąd pochodzicie?
      ru: Откуда вы родом?
      source:
        kind: translated
        id: 5150737
    - pl: – Skąd pochodzisz? – Z Krakowa.
      ru: — Откуда ты родом? — Из Кракова.
      source:
        kind: authored
- key: w przypadku
  examples:
    - pl: W przypadku jakichkolwiek problemów daj mi znać.
      ru: В случае каких-либо проблем дай мне знать.
      source:
        kind: translated
        id: 365205
    - pl: W przypadku deszczu koncert się nie odbędzie.
      ru: В случае дождя концерт не состоится.
      source:
        kind: authored
    - pl: W przypadku pożaru nie używaj windy.
      ru: В случае пожара не пользуйся лифтом.
      source:
        kind: authored
- key: równie dobrze
  examples:
    - pl: Równie dobrze możemy poczekać.
      ru: С тем же успехом можем и подождать.
      source:
        kind: translated
        id: 10572538
    - pl: Równie dobrze mogłeś zostać w domu.
      ru: С тем же успехом ты мог остаться дома.
      source:
        kind: authored
    - pl: Równie dobrze możesz zapytać jego.
      ru: С тем же успехом можешь спросить у него.
      source:
        kind: authored
- key: brać udział
  examples:
    - pl: Brali udział w zawodach.
      ru: Они участвовали в соревнованиях.
      source:
        kind: authored
    - pl: Biorę udział w konkursie.
      ru: Я участвую в конкурсе.
      source:
        kind: authored
    - pl: Bierzesz udział w spotkaniu?
      ru: Ты участвуешь во встрече?
      source:
        kind: authored
- key: zbierać się
  examples:
    - pl: No, na mnie już czas, zbieram się.
      ru: Ну, мне пора, я пошёл.
      source:
        kind: authored
    - pl: Późno już, zbierajmy się.
      ru: Уже поздно, давайте закругляться.
      source:
        kind: authored
    - pl: Zbieraj się, bo spóźnimy się na autobus.
      ru: Собирайся, а то опоздаем на автобус.
      source:
        kind: authored
- key: w zamian za
  examples:
    - pl: W zamian za pomoc dostał mieszkanie.
      ru: В обмен на помощь он получил квартиру.
      source:
        kind: authored
    - pl: Przysłała mi prezent w zamian za moją radę.
      ru: Она прислала мне подарок в благодарность за совет.
      source:
        kind: translated
        id: 540072
    - pl: Pomogę ci w zamian za obiad.
      ru: Я помогу тебе в обмен на обед.
      source:
        kind: authored
- key: u diabła
  examples:
    - pl: Co tu, u diabła, robisz?
      ru: Какого чёрта ты здесь делаешь?
      source:
        kind: tatoeba
        id: 1002588
    - pl: Jak u diabła miałabym to zrobić?
      ru: Как, чёрт возьми, я должна это сделать?
      source:
        kind: translated
        id: 7362694
    - pl: Gdzie, u diabła, są moje klucze?
      ru: Где, чёрт возьми, мои ключи?
      source:
        kind: authored
- key: trzymać się z dala
  examples:
    - pl: Trzymaj się z dala ode mnie.
      ru: Держись от меня подальше.
      source:
        kind: translated
        id: 563617
    - pl: Trzymaj się z dala od tego durnia.
      ru: Держись от этого дурака подальше.
      source:
        kind: tatoeba
        id: 13784950
    - pl: Trzymaj się z dala od złego towarzystwa.
      ru: Держись подальше от дурной компании.
      source:
        kind: translated
        id: 639708
- key: skoro tak
  examples:
    - pl: – Nie mam czasu. – Skoro tak, pójdę sam.
      ru: — У меня нет времени. — Раз так, пойду один.
      source:
        kind: authored
    - pl: Skoro tak, nie ma o czym mówić.
      ru: Раз так, говорить не о чем.
      source:
        kind: authored
    - pl: – Pada deszcz. – Skoro tak, zostańmy w domu.
      ru: — Идёт дождь. — Раз так, давай останемся дома.
      source:
        kind: authored
- key: po to, żeby
  examples:
    - pl: Osoby odpowiedzialne są właśnie po to, żeby brać na siebie odpowiedzialność.
      ru: Ответственные лица на то и существуют, чтобы брать на себя ответственность.
      source:
        kind: translated
        id: 2154705
    - pl: Przyszedłem po to, żeby ci pomóc.
      ru: Я пришёл для того, чтобы тебе помочь.
      source:
        kind: authored
    - pl: Uczę się polskiego po to, żeby pracować w Polsce.
      ru: Я учу польский для того, чтобы работать в Польше.
      source:
        kind: authored
- key: panna młoda
  examples:
    - pl: A oto i panna młoda!
      ru: А вот и невеста!
      source:
        kind: translated
        id: 362831
    - pl: To ojciec panny młodej.
      ru: Это отец невесты.
      source:
        kind: translated
        id: 521317
    - pl: Suknia panny młodej była biała.
      ru: Платье невесты было белым.
      source:
        kind: authored
- key: zastanawiam się, czy...
  examples:
    - pl: Zastanawiam się, czy on przyjdzie.
      ru: Интересно, придёт ли он.
      source:
        kind: translated
        id: 746204
    - pl: Zastanawiam się, czy Tom nauczyłby mnie francuskiego.
      ru: Интересно, научил бы меня Том французскому.
      source:
        kind: translated
        id: 5882637
    - pl: Zastanawiam się, czy kiedykolwiek ci na mnie zależało.
      ru: Интересно, было ли тебе когда-нибудь до меня дело.
      source:
        kind: translated
        id: 972868
- key: wielkie dzięki
  examples:
    - pl: Wielkie dzięki za pomoc!
      ru: Большое спасибо за помощь!
      source:
        kind: authored
    - pl: – Proszę, twoja kawa. – Wielkie dzięki!
      ru: — Вот твой кофе. — Огромное спасибо!
      source:
        kind: authored
    - pl: Wielkie dzięki, uratowałeś mi życie!
      ru: Огромное спасибо, ты меня спас!
      source:
        kind: authored
- key: w międzyczasie
  examples:
    - pl: W międzyczasie zdążył napisać dwa listy.
      ru: Тем временем он успел написать два письма.
      source:
        kind: authored
    - pl: Woda się gotuje, a w międzyczasie pokrój warzywa.
      ru: Вода закипает, а ты тем временем нарежь овощи.
      source:
        kind: authored
    - pl: Zadzwonię później, a ty w międzyczasie przeczytaj umowę.
      ru: Я позвоню позже, а ты тем временем прочитай договор.
      source:
        kind: authored
- key: niech to szlag
  examples:
    - pl: Niech to szlag!
      ru: Чёрт побери!
      source:
        kind: translated
        id: 8676399
    - pl: Niech to szlag jasny trafi!
      ru: Чтоб его совсем разорвало!
      source:
        kind: translated
        id: 1042192
    - pl: Niech to szlag, znowu się zepsuło.
      ru: Чёрт побери, опять сломалось.
      source:
        kind: authored
- key: w rzeczywistości
  examples:
    - pl: W rzeczywistości to złudzenie.
      ru: На самом деле это иллюзия.
      source:
        kind: translated
        id: 8662746
    - pl: W rzeczywistości on był przestępcą.
      ru: На самом деле он был преступником.
      source:
        kind: translated
        id: 956831
    - pl: W rzeczywistości interesuje ich tylko władza.
      ru: На самом деле их интересует только власть.
      source:
        kind: translated
        id: 365343
- key: na litość boską!
  examples:
    - pl: Na litość boską, ścisz tę muzykę!
      ru: Ради бога, сделай эту музыку тише!
      source:
        kind: translated
        id: 13654161
    - pl: Na litość boską, nie wziąłem twojego cholernego samochodu.
      ru: Ради всего святого, я не брал твою чёртову машину.
      source:
        kind: translated
        id: 1259118
    - pl: Na litość boską, przestań krzyczeć!
      ru: Ради бога, перестань кричать!
      source:
        kind: authored
- key: jakim cudem?
  examples:
    - pl: Jakim cudem ty tego nie wiesz?
      ru: Как так вышло, что ты этого не знаешь?
      source:
        kind: translated
        id: 521251
    - pl: Jakim cudem zdążyłeś na czas?
      ru: Как ты умудрился успеть вовремя?
      source:
        kind: authored
    - pl: Jakim cudem to się stało?
      ru: Как так вышло?
      source:
        kind: authored
- key: robić swoje
  examples:
    - pl: Olej te plotki i rób swoje.
      ru: Забей на эти сплетни и делай своё.
      source:
        kind: authored
    - pl: "Moja filozofia jest prosta: rób swoje."
      ru: "Моя философия проста: делай своё дело."
      source:
        kind: authored
    - pl: Rozkazywałam dzieciom, a one i tak robiły swoje.
      ru: Я командовала детьми, а они всё равно делали своё.
      source:
        kind: authored
- key: podjąć decyzję
  examples:
    - pl: Muszę podjąć decyzję.
      ru: Мне нужно принять решение.
      source:
        kind: translated
        id: 3416284
    - pl: W końcu podjęli decyzję.
      ru: В конце концов они приняли решение.
      source:
        kind: translated
        id: 629876
    - pl: To ty podejmiesz decyzję.
      ru: Решение примешь ты.
      source:
        kind: translated
        id: 3750176
- key: póki co
  examples:
    - pl: Póki co nic nie wiadomo.
      ru: Пока что ничего не известно.
      source:
        kind: authored
    - pl: Póki co zastanów się, co powiesz rodzicom.
      ru: Ты пока думай, что родителям скажешь.
      source:
        kind: tatoeba
        id: 13547058
    - pl: Póki co wszystko idzie dobrze.
      ru: Пока что всё идёт хорошо.
      source:
        kind: authored
- key: z chęcią
  examples:
    - pl: Z chęcią bym się trochę przespał.
      ru: Я бы с удовольствием немного поспал.
      source:
        kind: translated
        id: 6554136
    - pl: Tom z chęcią przyjął to zlecenie.
      ru: Том охотно принял этот заказ.
      source:
        kind: translated
        id: 13560408
    - pl: – Pójdziesz z nami do kina? – Z chęcią!
      ru: — Пойдёшь с нами в кино? — Охотно!
      source:
        kind: authored
- key: według mnie
  examples:
    - pl: Według mnie masz rację.
      ru: По-моему, ты прав.
      source:
        kind: authored
    - pl: Według mnie to nie ma sensu.
      ru: По-моему, это не имеет смысла.
      source:
        kind: tatoeba
        id: 5373165
    - pl: Nie jest to według mnie zbyt dobry pomysł.
      ru: По-моему, это не очень хорошая идея.
      source:
        kind: tatoeba
        id: 1772606
- key: bez wątpienia
  examples:
    - pl: Bez wątpienia.
      ru: Без сомнения.
      source:
        kind: translated
        id: 8705104
    - pl: Tom bez wątpienia skłamał.
      ru: Том, без сомнения, солгал.
      source:
        kind: translated
        id: 6441651
    - pl: Bez wątpienia działo się coś niespodziewanego.
      ru: Без сомнения, происходило что-то неожиданное.
      source:
        kind: translated
        id: 11344668
- key: tym bardziej
  examples:
    - pl: Nie mówi po angielsku, a tym bardziej po francusku.
      ru: Он не говорит по-английски, а тем более по-французски.
      source:
        kind: tatoeba
        id: 355436
    - pl: Jeśli mówi się nam, żebyśmy nie przychodzili, to tym bardziej chcemy iść.
      ru: Если нам говорят не приходить, тем сильнее хочется пойти.
      source:
        kind: translated
        id: 11691136
    - pl: Jesteś chory, tym bardziej powinieneś zostać w domu.
      ru: Ты болен, тем более тебе стоит остаться дома.
      source:
        kind: authored
- key: ile masz lat?
  examples:
    - pl: Zgadnę, ile masz lat.
      ru: Я угадаю, сколько тебе лет.
      source:
        kind: authored
    - pl: – Ile masz lat? – Dwadzieścia pięć.
      ru: — Сколько тебе лет? — Двадцать пять.
      source:
        kind: authored
    - pl: Ile masz lat, jeśli można spytać?
      ru: Сколько тебе лет, если не секрет?
      source:
        kind: authored
- key: poczekaj chwilę
  examples:
    - pl: Kochana, poczekaj chwilę.
      ru: Дорогая, подожди минутку.
      source:
        kind: authored
    - pl: Już nadchodzę, poczekaj chwilę.
      ru: Я уже иду, подожди минутку.
      source:
        kind: authored
    - pl: Poczekaj chwilę, zaraz wracam.
      ru: Подожди минутку, я сейчас вернусь.
      source:
        kind: authored
- key: w czym problem?
  examples:
    - pl: W czym problem?
      ru: В чем проблема?
      source:
        kind: tatoeba
        id: 901414
    - pl: Nie rozumiem, w czym problem.
      ru: Я не понимаю, в чём проблема.
      source:
        kind: tatoeba
        id: 12564880
    - pl: – Nie mogę przyjść. – A w czym problem?
      ru: — Я не могу прийти. — А в чём дело?
      source:
        kind: authored
- key: na osobności
  examples:
    - pl: Porozmawiajmy na osobności.
      ru: Поговорим наедине.
      source:
        kind: authored
