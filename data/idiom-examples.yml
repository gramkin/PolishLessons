      ru: — Я выхожу замуж. — Серьёзно? Поздравляю!
      source:
        kind: authored
    - pl: – Jutro nie ma lekcji. – Naprawdę?
      ru: — Завтра нет уроков. — Серьёзно?
      source:
        kind: authored
