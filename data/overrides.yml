# Manual fixes applied by `pnpm dict:rank`. Reviewed by the owner before each batch.
forms:
  taka: taki
  jaka: jaki
add:
  - { lemma: siebie, pos: pron, forms: [siebie, sobie, sobą] }
exclude:
  # имя собственное: все кандидаты — личное имя (Peter kocha Jane,
  # Czy to ty, Peter?), косвенные формы почти пусты
  - peter
  # имя собственное: все кандидаты — личное имя (Ben, pozmywaj naczynia;
  # Ben wlozyl rece do kieszeni) либо Big Ben
  - ben
  # аббревиатура без единого кандидата в корпусе
  - fbi
  # не самостоятельное слово: все кандидаты до единого — Nowy Jork
  # (Nowy Jork to duze miasto, Ona mieszka w Nowym Jorku); Jork отдельно
  # не встречается ни разу
  - jork
  # междометие без единого кандидата в корпусе: ни одного примера на
  # единственную форму, тот же класс, что oh и rany
  - uh
  # имя собственное: единственная форма — личное имя (Joe wygladal wczoraj
  # na smutnego, To pan White dal Joe'mu ten bilet)
  - joe
  # имя собственное: все кандидаты — личное имя (Nazywam sie James, Jim to
  # skrocona wersja imienia James), косвенные формы пусты
  - james
  # имя собственное: David Beckham jest Anglikiem, David jest bardzo aktywny;
  # кроме именительного кандидатов нет вообще
  - david
  # "si" is Spanish text in the corpus, not a Polish word: its only example is
  # "Si me preguntas, es un poco rara"
  - si
  # "miał" ranks high only as the past tense of "mieć"; the noun (coal dust) has
  # no examples of its own
  - miał
  - miąć
  - dosycić
  - mamić
  - taka
  - jaka
  # the foreign spelling of the interjection; its only corpus line is a bare "Oh."
  # (Polish "och" is kept and gets its own card)
  - oh
  # English title, not a Polish word: its one example is a translated line of
  # English dialogue, and PoliMorf invents a paradigm for it (sira, sirowie, sirów)
  - sir
  # the bare letter / language name; its only example is "C# jest podobny do Javy."
  - c
  # not the noun: every candidate is the -ego genitive of a foreign surname
  # ("Kennedy'ego", "Billy'ego"), matched by suffix
  - ego
  # an English given name, not Polish vocabulary: every corpus line uses John as a
  # Tatoeba placeholder character beside Tom and Mary, and PoliMorf invents a Polish
  # paradigm for it (Johnowie, Johnach, Johnów)
  - john
  # not a lemma but the feminine slice of "twój": the form "twoja" already belongs to
  # the twoj card, the draft paradigm is just twoja/twoje/twojej/twoją/twoich/twoim,
  # and it is mis-tagged as a noun — the same defect as "taka" and "jaka" above
  - twoja
  # the dative of "ja": the form already belongs to the ja card, and it ranks on its
  # own only because the frequency list counts surface forms — same defect as "twoja"
  - mi
  # the feminine of "mój": Wiktionary itself glosses it "lp ż od: mój", and the moj card
  # already owns the form — same defect as "twoja"
  - moja
  # the pre-consonantal variant of the preposition "w" (we Francji, we dwóch); Wiktionary
  # glosses it literally "zob. w" and the w card already owns it
  - we
  # ranks as a noun ("bywsza"), but every occurrence is the past tense of być: "to była
  # schadzka", "Była noc" — the byc card owns the form
  - byla
  # an English title, not Polish vocabulary: its lines are "miss Stapleton" — same as "sir"
  - miss
  # the detective, not Polish vocabulary: both lines are "Sherlocka Holmesa" — the same
  # case as holmes, watson, baskerville and stapleton
  - sherlock
  # not a lemma but a slice of the adjective "własny": every candidate is agreement
  # (na własne oczy, własnego życia, własnym uszom) and the wlasny card owns the forms
  - wlasne
  # not a lemma: the candidates are three different words — the plural of "droga"
  # (na drogach, dróg), the adjective "drogi" (Krawat jest zbyt drogi) and the
  # vocative "mój drogi". The droga card already owns the noun forms.
  - drogi
  # an English given name used as a Tatoeba placeholder character, not Polish
  # vocabulary; PoliMorf invents a paradigm for it (Jacka, Jackiem) — same as john
  - jack
  # "nick" here is the English given name Nick, not the Polish borrowing for an
  # online handle: all five lines under the base form are "Nick jest mi winny
  # dziesiec dolarow", "Nick narzekal mi na wysokie ceny w Tokio" and the like, the
  # only other attested form is "Gardzisz Nickiem" -- capitalised throughout -- and
  # 8 of the 10 forms have no corpus at all. Same class as john, jack and sir.
  - nick
  # not a lemma but a misspelling of "cie", the clitic accusative of "ty": every
  # candidate drops the diacritic -- "Ide cie zabic", "Trudno cie rozpoznac",
  # "Nikt cie nie uslyszy" -- where correct Polish is "cie" with the ogonek. The
  # forms belong to the carded ty paradigm, same class as the excluded twoja.
  - cie
  # a female given name (Wiktionary: "imie zenskie"), capitalised in the lemma
  # itself, and every candidate is the name -- "Julia spiewa", "Romeo ozenil sie
  # z Julia", "Nos Julii jest piekny". Same class as anna, charlie and michael.
  - julia
  # an English given name used as a Tatoeba placeholder, like the already-excluded
  # john, jack, michael, charlie and julia. The lemma is capitalised (Jimmy), all
  # five candidates are the name, 9 of the 10 forms have no corpus, and PoliMorf
  # invents apostrophe forms for it (Jimmy'ego, Jimmy'emu).
  - jimmy
  # not a lemma but the genitive singular of "dno" (bottom): the whole paradigm
  # listed under it is dno's -- den, dna, dnie, dno, dny -- and every candidate is
  # "do dna", "bez dna", "na dnie jeziora", "dno morza". The homograph "dna" (gout)
  # has no corpus support here at all. Same class as cie and twoja.
  - dna
  # a given name with no corpus support whatsoever: zero candidates, and all ten
  # forms empty. PoliMorf invents a full Polish paradigm for it (Maksa, Maksowie,
  # Maksow) from the capitalised lemma "Max". Same class as john, jack, michael,
  # charlie, anna, julia and jimmy, but with even less evidence than those.
  - max
  # not a lemma but a slice of the carded swoj paradigm: its six forms (swoich,
  # swoim, swoimi, swoje, swojego, swojemu) all belong to swoj, and swoj.yml
  # already exemplifies the form swoje with "Bil swoje dzieci", "Kocham swoje
  # miasto" and "Kazdy ma swoje wady". Same class as twoja, cie and dna.
  - swoje
  # tagged adj, but it is not a lemma: the candidates split three ways — the noun
  # "rana" (Czas leczy rany, od rana), the verb "ranić" (Odrzucenie rani) and the
  # interjection "o rany". The rana card will own the noun forms.
  - rany
  # a spelling variant of "patrzeć", which is already carded at rank 306. The two
  # paradigms overlap on 24 forms outright (patrzę, patrzysz, patrzy, patrzą, patrz,
  # patrząc and every participle) and diverge only in the past stem: patrzał- on the
  # patrzec card, patrzył- here. Carding it separately would put one verb on two
  # pages. NOTE: the patrzył- past is therefore covered nowhere yet — folding those
  # forms into the patrzec card is the open question.
  - patrzyć
  # not a lemma but the neuter form of "możliwy", which is ranked separately at
  # 1456: the draft paradigm here is truncated to six forms (możliwe, możliwego,
  # możliwemu, możliwych, możliwym, możliwymi) with no feminine and no virile, and
  # every candidate is predicative — Całkiem możliwe, Jak to możliwe? Carding it
  # would put one adjective on two pages, as patrzyć would have.
  - możliwe
  # a stray single letter from the corpus, tagged part; the same junk class
  # as the excluded "c". Its candidates are list markers and initials.
  - d
  # an English given name used as a Tatoeba placeholder character, like the
  # already-excluded john and jack; its candidates are all "Michael ..." lines
  - michael
  # not a Polish word: every candidate matches the English conjunction inside
  # untranslated fragments (Chuck's Bar and Grill, Stars and Stripes) or the
  # unrelated names Ando and Andy. Same junk class as john and jack.
  - anda
  # three candidates across ten forms, and two are the given name Frank. The
  # currency sense is too thinly attested here to card honestly.
  - frank
  # not a lemma but the vocative of Jezus, which is ranked separately at 1395.
  # All seven candidates are the exclamation (Jezu!, O Jezu!, Jezu Chryste!).
  # Same shape as the excluded rany, whose lemma is rana.
  - jezu
  # not a lemma but the past tense of miec: every candidate is a verb form
  # (Tom mial racje, Mialem slownik, Nie mialy szans). The noun mial "coal
  # dust" has no attestation here at all. Same class as the excluded d.
  - mial
  # the neuter of mozliwy, which is carded separately at 1456 -- the inflected
  # form outranking its own lemma is a lemmatizer artifact, not a second word.
  - mozliwe
  # an English given name used as a Tatoeba placeholder, like the already-
  # excluded john, jack and michael. The lemma is even capitalised (Charlie),
  # and the candidates are Charlie Chaplin plus an apostrophe artifact.
  - charlie
  # the English spelling of okej, which is carded at 712. Zero candidates in
  # the corpus -- not a second word, just a second way of writing the first;
  # okej.yml already documents the okej / OK / ok variants.
  - okay
  # a given name, like the already-excluded charlie, john, jack and michael.
  # Every candidate is the name, the paradigm is contaminated with the English
  # forms Ann and Annie, the harvested idioms are all swieta Anna weather
  # proverbs, and the harvested etymology belongs to an asteroid named Anna.
  - anna
  # not a lemma but the past tense of musiec, exactly like the excluded mial
  # (past tense of miec). The registry capitalises it as the surname Musial,
  # but every candidate across every form is the verb: Tom musial to zrobic,
  # Musialem isc, Musiala odpoczac.
  - musial
  # an English given name, like the already-excluded charlie, john, jack,
  # michael and anna. Every candidate is the name, and the paradigm is built
  # from apostrophe forms (George'a, George'em) with zero attestation.
  - george
  # имя собственное: лемма henr (единица индуктивности) не встречается ни разу,
  # все кандидаты — английское имя Henry (Henry James był rodowitym Amerykaninem,
  # Mój kolega Henry wczoraj nie przyszedł na zajęcia)
  - henr
  # парадигма целиком заимствована у umrzeć (карточка есть, ранг 311): все формы
  # самого zemrzeć (zemrę, zemrze, zemrzeć, zemrzyj) пусты, а заполнены только
  # zmarł, zmarła, zmarli, zmarło — прошедшее время umrzeć
  - zemrzeć
  # та же лемма, что карточка tata (ранг 184): весь набор форм совпадает
  # (tacie, tatą, tatę, tato, taty), а у карточки tata уже есть отдельное
  # значение "vocative: папа! (обращение — форма tato)". Ранжировщик посчитал
  # звательный падеж отдельным словом
  - tato
  # имя собственное: Wiktionary даёт "imię żeńskie", лемма с заглавной буквы,
  # и все 30 кандидатов до единого — переводы Tatoeba про Toma и Mary
  # (Maria jest wróżką, Tom pocałował Marię w policzek). Тот же класс,
  # что julia, jimmy, max, anna
  - maria
  # не лемма, а срез парадигмы карточки gosc (ранг 660): из одиннадцати форм
  # семь уже разобраны там примерами (gość, gościa, gości, goście, gościom,
  # gościu, gościach) и ни одна не помечена пропуском. Тот же класс, что
  # moja, swoje, cie, tato
  - goscia
  # имя собственное: Wiktionary не даёт ни одного значения и ни одного русского
  # перевода, лемма с заглавной буквы, семь форм из одиннадцати пусты. Все
  # кандидаты — личное имя (Paul ma suche włosy, Jestem Paul, twój współlokator,
  # Ośmiornica Paul miała rację), а форма Paula занята женским именем Paula
  # (Paula jutro ma zamiar myć samochód), а не родительным падежом от Paul
  - paul
  # имя собственное: ни одного значения и ни одного русского перевода в
  # Wiktionary, лемма с заглавной буквы, семь форм из девяти пусты, всего
  # четыре кандидата — и все личное имя (Harry jest amerykańskim aktorem,
  # Nie udało mu się obudzić Harry'ego, książka o Harrym Potterze). Парадигма
  # вдобавок содержит выдуманные формы с апострофом: Harry'ego, Harry'emu
  - harry
  # имя собственное: ни одного значения в Wiktionary, лемма с заглавной буквы,
  # шесть форм из десяти пусты, все кандидаты — личное имя (Jim, zamknij okno;
  # Napisałem list do Jima; Mianowali Jima kierownikiem). Тот же класс, что
  # уже исключённый jimmy, а также paul, harry, maria, peter, ben, joe
  - jim
  # не лемма, а форма 3-го лица глагола podobać się (карточка podobac, ранг 365,
  # формат 2) — она уже разобрана там примером. Ранжировщик принял глагольную
  # форму за существительное «podobizna»: из одиннадцати «именных» форм десять
  # пусты, а единственная заполненная (podoba) содержит только глагол
  # (Podoba mi się twój samochód, Nic mi się nie podoba, Podoba ci się ktoś?)
  - podoba
  # ни одного кандидата в корпусе: все 63 формы пусты до единой, примеров нет
  # вообще. Карточка была бы целиком выдуманной, без единого корпусного
  # предложения. Тот же класс, что fbi и uh
  - wyprawiac
  # имя собственное: ни одного значения и ни одного русского перевода в
  # Wiktionary, лемма с заглавной буквы, девять форм из десяти пусты, и всего
  # один кандидат на всё слово — личное имя (Ray był gotów potwierdzić wersję
  # Gary'ego). Тот же класс, что paul, harry, jim, maria, peter, ben, joe
  - ray
  # парадигма занята прилагательным wart «стоящий» (карточка wart): формы wart,
  # warta, wartą, warty уже разобраны там примерами. Почти все кандидаты — это
  # прилагательное (Gra nie jest warta świeczki, Twoja propozycja jest warta
  # uwagi) либо предикатив warto «стоит». На существительное warta «караул»
  # приходится всего два примера: Rotmistrz nie stoi na warcie и Kto ma wartę?
  - warta
  # в корпусе нет ни одного примера самой леммы: восемь форм из десяти пусты,
  # а все три кандидата — вообще другие слова. Два раза это японская фамилия
  # Ito (Czy p. Ito uczy historii?, Taro Ito został uznany za winnego), один
  # раз — английское it внутри англоязычной фразы. Значения в Wiktionary нет
  - ita
  # единственное число уже карточкованной леммы rodzice «родители» (ранг 517):
  # формы rodzice, rodziców, rodzicom, rodzicami, rodzicach разобраны там
  # примерами. Сами формы единственного числа пусты до единой: rodzic,
  # rodzicem, rodzicowi, rodzicu. Тот же класс, что tato при карточке tata
  - rodzic
  # призрачная лемма: архаичный вариант того же глагола, что obiecywać (ранг
  # 1297). Обе леммы заполнены одними и теми же девятью формами и буквально
  # одними и теми же примерами (obiecuj 363109, obiecuję 5396634, obiecujemy
  # 354068 и т. д.) — ранжировщик посчитал одни и те же вхождения дважды.
  # При этом у obiecować нет ни значения, ни вида в Wiktionary, а формы
  # obiecywał и obiecywano, различающие основу -ywa-, есть только у obiecywać
  - obiecowac
  # лемма существует как польское слово (mary «носилки для покойника,
  # катафалк», множественное от mara), но в корпусе нет ни одного примера
  # именно этого слова: все тридцать кандидатов — английское имя Mary
  # (Mary umie pływać, On zna Mary, Tom pocałuje Mary), а форма mar — тоже
  # имя (Mar zraniła się w łokieć). Частотность целиком наведена именем.
  # Тот же класс, что maria и anna
  - mary
  # имя собственное: ни значения, ни русского перевода в Wiktionary, девять форм
  # из десяти пусты, и единственный кандидат — даже не человек, а название
  # авиакомпании (Timuçin poleciał z Yozgatu do Warszawy liniami Ryan Air).
  # Тот же класс, что ray, paul, harry, jim, maria
  - ryan
  # имя собственное: единственное значение в Wiktionary — «gw. (Górny Śląsk)
  # imię męskie Ryszard», то есть силезская форма личного имени. Девять форм
  # из десяти пусты, все шесть кандидатов — английское имя (Od kiedy Richard
  # jest żonaty?, Will i Richard zazwyczaj pracują w nocy)
  - richard
pos:
  # Wiktionary lists these lemmas under a different part of speech than the one
  # that makes them frequent: "do" as the solmization syllable, "no" as a noun.
  do: prep
  no: part
  i: conj
  # "jak" is listed as the animal (yak); the frequent word is the conjunction
  jak: conj
  a: conj
  # "bez" is listed as the noun (lilac); the frequent word is the preposition
  bez: prep
  # "dzięki" is listed as the archaic plural noun; the frequent word is the
  # preposition "благодаря" and the colloquial "спасибо"
  dzieki: prep
  # "niż" is listed as the noun (weather low, lowland); the frequent word is
  # the comparative conjunction "than"
  niz: conj
  # "zbyt" is listed as the noun (sales); the frequent word is the adverb "too"
  zbyt: adv
  # "dzisiaj" is listed as a noun; it is an adverb, like its short form "dziś"
  dzisiaj: adv
  # "mimo" is listed as the archaic adverb "obok, mijając"; the frequent word is
  # the preposition "несмотря на", which governs the genitive (mimo ulewy) and
  # heads the fixed mimo to / mimo tego / mimo że. All eight corpus candidates
  # are the preposition; none is the archaic adverb.
  mimo: prep
  # "ktokolwiek" is tagged as a noun; it is kto + -kolwiek, a pronoun, and it
  # declines like kto (kogokolwiek, komukolwiek, kimkolwiek)
  ktokolwiek: pron
  # tagged as a noun, but every candidate is the telephone interjection
  # (Halo!, Halo?, Halo, jesteś jeszcze?) and the paradigm has a single form
  halo: interj
  # tagged as a noun, but every candidate is the ordinal numeral: rozdzial
  # trzeci, trzeciego kwietnia, na trzecim miejscu, plus the fraction dwie trzecie
  trzeci: num
