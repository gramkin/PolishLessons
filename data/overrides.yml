# Manual fixes applied by `pnpm dict:rank`. Reviewed by the owner before each batch.
forms:
  taka: taki
  jaka: jaki
add:
  - { lemma: siebie, pos: pron, forms: [siebie, sobie, sobą] }
exclude:
  - miąć
  - dosycić
  - mamić
  - taka
  - jaka
pos:
  # Wiktionary lists these lemmas under a different part of speech than the one
  # that makes them frequent: "do" as the solmization syllable, "no" as a noun.
  do: prep
  no: part
  i: conj
  # "jak" is listed as the animal (yak); the frequent word is the conjunction
  jak: conj
  a: conj
  # "bez" is listed as the noun (lilac); the frequent word is the preposition
  bez: prep
  # "dzięki" is listed as the archaic plural noun; the frequent word is the
  # preposition "благодаря" and the colloquial "спасибо"
  dzieki: prep
  # "niż" is listed as the noun (weather low, lowland); the frequent word is
  # the comparative conjunction "than"
  niz: conj
