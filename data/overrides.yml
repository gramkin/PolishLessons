  # реестре, так что для половины со страной правильного места нет. Wiktionary
  # вдобавок толкует niemiec как «немецкий язык» и «лютеранин» — значения,
  # которых нет ни в одном примере
  - niemiec
pos:
  # Wiktionary lists these lemmas under a different part of speech than the one
  # that makes them frequent: "do" as the solmization syllable, "no" as a noun.
  do: prep
  no: part
  i: conj
  # "jak" is listed as the animal (yak); the frequent word is the conjunction
  jak: conj
  a: conj
  # "bez" is listed as the noun (lilac); the frequent word is the preposition
  bez: prep
  # "dzięki" is listed as the archaic plural noun; the frequent word is the
  # preposition "благодаря" and the colloquial "спасибо"
  dzieki: prep
  # "niż" is listed as the noun (weather low, lowland); the frequent word is
  # the comparative conjunction "than"
  niz: conj
  # "zbyt" is listed as the noun (sales); the frequent word is the adverb "too"
  zbyt: adv
  # "dzisiaj" is listed as a noun; it is an adverb, like its short form "dziś"
  dzisiaj: adv
  # "mimo" is listed as the archaic adverb "obok, mijając"; the frequent word is
  # the preposition "несмотря на", which governs the genitive (mimo ulewy) and
  # heads the fixed mimo to / mimo tego / mimo że. All eight corpus candidates
  # are the preposition; none is the archaic adverb.
  mimo: prep
  # "ktokolwiek" is tagged as a noun; it is kto + -kolwiek, a pronoun, and it
  # declines like kto (kogokolwiek, komukolwiek, kimkolwiek)
  ktokolwiek: pron
  # tagged as a noun, but every candidate is the telephone interjection
  # (Halo!, Halo?, Halo, jesteś jeszcze?) and the paradigm has a single form
  halo: interj
  # tagged as a noun, but every candidate is the ordinal numeral: rozdzial
  # trzeci, trzeciego kwietnia, na trzecim miejscu, plus the fraction dwie trzecie
  trzeci: num
  # "czyj" is tagged as an adjective; it is the possessive interrogative
  # pronoun "чей". It declines like an adjective (czyja, czyje, czyim) but
  # heads questions about the owner (Czyj to rower?), the same class as
  # ktokolwiek
  czyj: pron
  # "piaty" is tagged as an adjective; it is the ordinal numeral "пятый",
  # exactly like trzeci above. It declines like an adjective, and the feminine
  # piata doubles as the hour (o piatej "в пять") and as the fraction
  # (jedna piata "одна пятая")
  piaty: num
  # "lada" is listed as the noun "прилавок", but that word has a single corpus
  # candidate across ten forms. The rank belongs to the particle: lada chwila,
  # lada moment "вот-вот", plus the phrase nie lada "незаурядный". Three of the
  # four hits on the form lady are the English Lady (Lady Gaga), not Polish
  lada: part
  # "narzeczony" is tagged as an adjective; it declines like one but works as
  # a noun, "жених" (mój narzeczony), with the feminine narzeczona "невеста"
  # carrying most of the corpus. Same shape as ukochany
  narzeczony: noun
