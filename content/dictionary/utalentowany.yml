notes:
  - { kind: false-friend, text: "Русскому «талантливый» по-польски соответствуют два слова. UTALENTOWANY — «одарённый талантом», сильное слово. ZDOLNY — «способный», мягче и чаще о школьниках: ZDOLNY UCZEŃ. Слова TALENTLIWY в польском нет, хотя его так и хочется сказать. По форме UTALENTOWANY похоже на причастие: «наделённый талантом»." }
  - { kind: usage, text: "Сравнивается описательно: BARDZIEJ UTALENTOWANY, NAJBARDZIEJ UTALENTOWANY. Все одиннадцать форм живые, и форма для мужчин-людей UTALENTOWANI — одна из самых частых: UTALENTOWANI MŁODZI LUDZIE, UTALENTOWANI ARTYŚCI. Обратите внимание на чередование: UTALENTOWANY, но UTALENTOWANI." }
  - { kind: government, text: "Талантливый в какой-то области — UTALENTOWANY + наречие: UTALENTOWANY MUZYCZNIE, PLASTYCZNIE, JĘZYKOWO. Или W + местный: UTALENTOWANY W SPORCIE. Русское «талантлив к чему» с дательным здесь не работает." }
  - { kind: pronunciation, text: "Читается «уталэнто́ваны», пять слогов, ударение на предпоследнем. LE даёт твёрдое «лэ», TO — чёткое «то». В середине нет мягкости: «у-та-лэн-то-ва-ны»." }
  - { kind: register, text: "Нейтральное слово, но с оттенком похвалы и с налётом журналистики: UTALENTOWANY MŁODY REŻYSER. В разговоре поляк скорее скажет ZDOLNY или MA TALENT, «у него талант». В рецензиях и рекомендательных письмах UTALENTOWANY — стандарт." }
collocations:
  - { pl: "utalentowany muzyk", ru: "талантливый музыкант" }
  - { pl: "utalentowany muzycznie", ru: "музыкально одарённый" }
  - { pl: "utalentowana młodzież", ru: "одарённая молодёжь" }
family:
  - { pl: "talent", ru: "талант", relation: root, id: talent }
  - { pl: "zdolny", ru: "способный", relation: root, id: zdolny }
  - { pl: "beztalencie", ru: "бездарь, бесталанный человек", relation: derived }
etymology: "От TALENT, а то через латынь из греческого tálanton, «весы, мера веса и денег». Переносный смысл «дарование» пришёл из евангельской притчи о талантах, где хозяин раздал слугам деньги, а один закопал свой талант в землю. Польский образовал из существительного прилагательное причастного вида: U-TALENT-OWANY, «наделённый талантом»."
memory: "Utalentowany — талантливый, одарённый: utalentowany muzyk. Слова talentliwy нет. Помягче — zdolny, способный. Читается «уталэнто́ваны»."
idioms:
  - { pl: "zakopać talent w ziemi", ru: "зарыть талант в землю" }
