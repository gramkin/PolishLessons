# review
id: przebic
format: 2
lemma: "przebić"
rank: 3050
pos: verb
pron: { cyr: "пшэ́биць" }
senses:
  - id: pierce
    ru: "пробить, проколоть"
    examples:
      - pl: "Gwóźdź przebił oponę na wylot."
        ru: "Гвоздь пробил шину насквозь."
        source: { kind: authored }
      - pl: "Przebił ścianę, żeby przeciągnąć kabel."
        ru: "Он пробил стену, чтобы протянуть кабель."
        source: { kind: authored }
      - pl: "Przebiła sobie ucho u jubilera."
        ru: "Она проколола себе ухо у ювелира."
        source: { kind: authored }
  - id: outbid
    ru: "перебить, превзойти (цену, предложение)"
    examples:
      - pl: "Przebili naszą ofertę o tysiąc złotych."
        ru: "Они перебили наше предложение на тысячу злотых."
        source: { kind: authored }
      - pl: "Nikt nie przebił tego rekordu od lat."
        ru: "Никто не побил этот рекорд годами."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Корень BIĆ русскому прозрачен — это «бить», — но делёж смыслов между приставками другой. Польское PRZEBIĆ покрывает сразу и русское «пробить» (PRZEBIĆ ŚCIANĘ), и русское «проколоть» (PRZEBIĆ OPONĘ, PRZEBIĆ UCHO): для поляка это одно действие — пройти насквозь. Русский же делит их по орудию: пробивают чем-то тупым и сильным, прокалывают острым. Так что PRZEBITA OPONA по-русски «проколотая шина», а PRZEBITA ŚCIANA — «пробитая стена», и переводчику приходится выбирать там, где поляк не выбирает." }
  - { kind: usage, text: "Второе значение целиком про торг и состязание: PRZEBIĆ OFERTĘ — «перебить предложение», PRZEBIĆ CENĘ, PRZEBIĆ REKORD — «побить рекорд». Русский тут тоже берёт «перебить» и «побить», так что совпадение почти полное. Возвратное PRZEBIĆ SIĘ значит «пробиться»: PRZEBIĆ SIĘ PRZEZ TŁUM, PRZEBIĆ SIĘ DO PIERWSZEJ LIGI — и это, пожалуй, самое частое употребление в живой речи." }
  - { kind: pronunciation, text: "Основа на -IĆ с настоящим на -IJ-: PRZEBIĆ даёт PRZEBIJĘ, PRZEBIJESZ, PRZEBIJE, PRZEBIJĄ — как сам BIĆ даёт BIJĘ. Повелительное PRZEBIJ тоже с -IJ, и это ровно тот случай, который разбирался в карточке KARMIĆ: отбросив -e у PRZEBIJE, получим PRZEBIJ, где J уже есть в основе, так что никакой вставки не требуется." }
  - { kind: government, text: "Что — винительный: PRZEBIĆ OPONĘ, ŚCIANĘ, OFERTĘ. Насквозь — наречный оборот NA WYLOT: PRZEBIĆ NA WYLOT. Чем — творительный без предлога: PRZEBIĆ GWOŹDZIEM, IGŁĄ, WIERTŁEM. На сколько превзойти — предлог O с винительным: PRZEBIĆ OFERTĘ O TYSIĄC ZŁOTYCH, как русское «перебить на тысячу». Возвратное берёт PRZEZ с винительным: PRZEBIĆ SIĘ PRZEZ TŁUM." }
collocations:
  - { pl: "przebić oponę", ru: "проколоть шину" }
  - { pl: "przebić ofertę", ru: "перебить предложение" }
  - { pl: "przebić się przez tłum", ru: "пробиться через толпу" }
family:
  - { pl: "przebijać", ru: "пробивать, прокалывать", relation: aspect }
  - { pl: "bić", ru: "бить", relation: root, id: bic }
  - { pl: "odbić", ru: "отбить, отразить", relation: root, id: odbic }
etymology: "Приставка prze- «про-, пере-» и BIĆ, из праславянского *biti «бить» — то же слово, что русское «бить», с тем же корнем, что в «бой», «битва», «забить». Польское гнездо устроено так же: BÓJ «бой», BITWA «битва», ODBIĆ «отбить», ZABIĆ «убить». Приставка prze- несёт оба смысла сразу, «про-» и «пере-», и отсюда два значения глагола: пробить насквозь и перебить чужую цену. Русский развёл эти смыслы по двум приставкам, польский оставил при одной, так что выбирать приходится по дополнению."
memory: "bić — «бить», а przebić покрывает и «пробить», и «проколоть»: для поляка это одно — пройти насквозь. А przebić ofertę — «перебить предложение»."
idioms:
  - { pl: "przebić się przez tłum", ru: "пробиться через толпу" }
  - { pl: "przebić rekord", ru: "побить рекорд" }
