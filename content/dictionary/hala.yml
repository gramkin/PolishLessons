# review
id: hala
format: 2
lemma: "hala"
rank: 1269
pos: noun
pron: { cyr: "ха́ля" }
senses:
  - id: hall
    ru: "зал, большое крытое помещение"
    examples:
      - pl: "Ta hala pomieści 2 tys. osób."
        ru: "Этот зал вмещает две тысячи человек."
        source: { kind: translated, id: 731903 }
      - pl: "Hala koncertowa była pełna fanów."
        ru: "Концертный зал был полон поклонников."
        source: { kind: translated, id: 958949 }
      - pl: "Nowa hala jest dwa razy większa od starej."
        ru: "Новый зал в два раза больше старого."
        source: { kind: translated, id: 2145298 }
  - id: venue
    ru: "спортзал, крытый рынок, производственный цех"
    examples:
      - pl: "Mecz odbędzie się w hali sportowej."
        ru: "Матч пройдёт в спортивном зале."
        source: { kind: authored }
      - pl: "Pracuje w hali produkcyjnej."
        ru: "Он работает в производственном цехе."
        source: { kind: authored }
      - pl: "Kupiliśmy warzywa w hali targowej."
        ru: "Мы купили овощи на крытом рынке."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Hala — большое крытое помещение: hala sportowa «спортзал», hala targowa «крытый рынок», hala produkcyjna «производственный цех»." }
  - { kind: false-friend, text: "Форма halo в корпусе — это всегда междометие halo «алло» (карточка есть), а не звательный падеж от hala." }
  - { kind: usage, text: "В горах hala значит ещё и «горное пастбище» — отсюда название Hala Gąsienicowa в Татрах." }
  - { kind: pronunciation, text: "h звучит как русское «х», а l перед a мягкое: ха́ля." }
collocations:
  - { pl: "hala sportowa", ru: "спортивный зал" }
  - { pl: "hala targowa", ru: "крытый рынок" }
  - { pl: "hala produkcyjna", ru: "производственный цех" }
etymology: "Из немецкого Halle «зал». Русское «зал» пришло из того же немецкого источника, но другим словом — Saal."
memory: "hala — большое крытое помещение: hala sportowa «спортзал», hala targowa «крытый рынок». В горах — ещё и «пастбище». Осторожно: halo в текстах это междометие «алло», а не форма этого слова."
idioms:
