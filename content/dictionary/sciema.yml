# review
id: sciema
format: 2
lemma: "ściema"
rank: 6016
pos: noun
pron: { cyr: "сьце́ма" }
senses:
  - id: lie
    ru: "враньё, брехня (сленг)"
    examples:
      - pl: "To nie jest ściema."
        ru: "Это не враньё."
        source: { kind: translated, id: 13422625 }
      - pl: "Nie wierz mu, to jedna wielka ściema."
        ru: "Не верь ему, это сплошное враньё."
        source: { kind: authored }
      - pl: "Przestań walić ściemę i powiedz prawdę."
        ru: "Хватит заливать, скажи правду."
        source: { kind: authored }
  - id: scam
    ru: "развод, туфта, показуха (сленг)"
    examples:
      - pl: "Ta promocja to zwykła ściema."
        ru: "Эта акция — обычный развод."
        source: { kind: authored }
      - pl: "Całe to szkolenie było ściemą."
        ru: "Весь этот тренинг был туфтой."
        source: { kind: authored }
notes:
  - { kind: register, text: "Молодёжный сленг, в разговоре очень частый. В нейтральной речи — KŁAMSTWO «ложь», BZDURA «чушь», OSZUSTWO «обман»." }
  - { kind: usage, text: "Образ тот же, что в русском «темнить»: ŚCIEMA — от ŚCIEMNIAĆ «темнить, врать». Кто врёт, тот ŚCIEMNIA, а его враньё — ŚCIEMA." }
  - { kind: government, text: "Врать, заливать — WALIĆ ŚCIEMĘ; впаривать кому-то враньё — WCISKAĆ KOMUŚ ŚCIEMĘ (дательный + винительный)." }
  - { kind: pronunciation, text: "Читается «сьце́ма»: ŚCI — мягкое «сьц». Ударение на первом слоге." }
collocations:
  - { pl: "walić ściemę", ru: "заливать, врать" }
  - { pl: "wciskać komuś ściemę", ru: "впаривать кому-то враньё" }
  - { pl: "totalna ściema", ru: "полное враньё" }
  - { pl: "to jakaś ściema", ru: "это какой-то развод" }
family:
  - { pl: "ściemniać", ru: "темнить, врать", relation: root }
  - { pl: "ściemniacz", ru: "враль, трепло", relation: derived }
  - { pl: "ciemny", ru: "тёмный", relation: root, id: ciemny }
synonyms: ["kłamstwo", "bzdura", "blaga", "kit"]
etymology: "От разговорного ŚCIEMNIAĆ «темнить, врать», а тот — от CIEMNY «тёмный»."
memory: "Ściema — от «темнить» (ściemniać): кто напускает темноты, тот врёт. Walić ściemę — заливать."
idioms:
  - { pl: "walić ściemę", ru: "заливать, вешать лапшу на уши" }
  - { pl: "wciskać komuś ściemę", ru: "впаривать кому-то враньё" }
formExamplesSkip:
  - { form: "ściemo", reason: "звательный от слова «враньё» не употребляется" }
