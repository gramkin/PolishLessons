# review
id: dazyc
format: 2
lemma: "dążyć"
rank: 6026
pos: verb
aspect: imperf
pron: { cyr: "до́у̃жыць" }
senses:
  - id: strive
    ru: "стремиться (к чему-то), добиваться"
    examples:
      - pl: "Rząd dąży do obniżenia podatków."
        ru: "Правительство стремится снизить налоги."
        source: { kind: authored }
      - pl: "Obie strony dążą do porozumienia."
        ru: "Обе стороны стремятся к соглашению."
        source: { kind: authored }
      - pl: "Dążę do tego, żeby mówić płynnie."
        ru: "Я стремлюсь к тому, чтобы говорить бегло."
        source: { kind: authored }
  - id: head
    ru: "направляться, держать путь (книжн.)"
    examples:
      - pl: "Pielgrzymi dążyli do Częstochowy."
        ru: "Паломники держали путь в Ченстохову."
        source: { kind: authored }
      - pl: "Statek dążył do portu przez sztorm."
        ru: "Корабль шёл к порту сквозь шторм."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "DĄŻYĆ звучит как русское «дожить», но значит «стремиться»: DĄŻĘ DO CELU «я стремлюсь к цели». «Дожить» по-польски — DOŻYĆ." }
  - { kind: government, text: "К чему — DO с родительным, а не дательный, как в русском «к цели»: DĄŻYĆ DO CELU, DO ZWYCIĘSTWA. С придаточным — DO TEGO, ŻEBY: DĄŻĘ DO TEGO, ŻEBY WYGRAĆ." }
  - { kind: register, text: "Слово книжное и деловое: политика, наука, цели жизни. В быту чаще говорят CHCIEĆ или STARAĆ SIĘ. Существительное DĄŻENIE «стремление» очень частотно: DĄŻENIA NARODU «чаяния народа»." }
  - { kind: pronunciation, text: "Читается «до́у̃жыць»: Ą перед Ż — носовое «оу̃», Ż — твёрдое «ж», поэтому ŻY — «жы». Ударение на первом слоге: DĄŻY — «до́у̃жы»." }
collocations:
  - { pl: "dążyć do celu", ru: "стремиться к цели" }
  - { pl: "dążyć do porozumienia", ru: "стремиться к соглашению" }
  - { pl: "dążyć do perfekcji", ru: "стремиться к совершенству" }
  - { pl: "uparcie dążyć", ru: "упорно добиваться" }
family:
  - { pl: "dążenie", ru: "стремление", relation: derived }
  - { pl: "podążać", ru: "следовать, направляться", relation: derived, id: podazac }
  - { pl: "zdążyć", ru: "успеть", relation: root, id: zdazyc }
  - { pl: "dążność", ru: "тенденция, стремление", relation: derived }
synonyms: ["zmierzać", "starać się", "kierować się"]
etymology: "Вероятно, от праславянского *dǫg- «сила», того же корня, что русское «дюжий»: исходно — «напрягать силы, рваться». От DĄŻYĆ образовано ZDĄŻYĆ «успеть»."
memory: "Dążyć — не «дожить», а «стремиться»: dążę do celu. А кто стремится, тот успевает — zdążyć."
idioms:
  - { pl: "dążyć do celu po trupach", ru: "идти к цели по головам" }
