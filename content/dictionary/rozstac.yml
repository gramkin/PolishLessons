etymology: "Приставка ROZ- «раз-, в разные стороны» и глагол STAĆ «стоять», из праславянского *stati. Буквально это «встать по разные стороны», и русское «расстаться» собрано ровно так же, из рас- и стать — редкий случай полного совпадения и по частям, и по значению, и по управлению. Корень STAĆ дал в польском целое гнездо, которому в русском отвечает такое же: ZOSTAĆ «остаться» и «стать», PRZESTAĆ «перестать», WSTAĆ «встать», POWSTAĆ «возникнуть», STAĆ SIĘ «стать». Приставка ROZ- в польском соответствует русскому рас- и раз- без исключений: ROZEJŚĆ SIĘ «разойтись», ROZDAĆ «раздать», ROZMOWA «разговор». Поэтому слово можно не запоминать, а собрать, и собранное окажется верным — что для этого словаря скорее исключение, чем правило."
memory: "Собирается из частей и выходит точно: roz- плюс stać это рас- плюс стать, «расстаться». Только с się: rozstać się z kimś, творительный с z, как в русском. Единственная ловушка формальная: rozstanie — это и «расставание» (существительное), и «расстанется» (будущее время); различать по się, если się есть — глагол. Совершенный вид, несовершенный rozstawać się. Klub rozstał się z trenerem — вежливое «уволил»."
