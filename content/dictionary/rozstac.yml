notes:
  - { kind: government, text: "Глагол употребляется только с SIĘ: ROZSTAĆ SIĘ, и без него формы просто нет — нельзя сказать ROZSTAŁ KOGOŚ. С кем расстаются — предлог Z с творительным: ROZSTAĆ SIĘ Z ŻONĄ, ROZSTAĆ SIĘ Z KLUBEM, и это в точности русское «расстаться с кем-то», падеж совпадает. Так же и о вещах: ROZSTAĆ SIĘ Z MIESZKANIEM, ROZSTAĆ SIĘ Z PIENIĘDZMI. Как расстаются — наречие или предлог W с местным: ROZSTAĆ SIĘ W ZGODZIE «расстаться мирно». Совершенный вид, несовершенный — ROZSTAWAĆ SIĘ, поэтому ROZSTANĘ SIĘ значит «расстанусь», а не «расстаюсь»." }
  - { kind: false-friend, text: "Со значением всё просто: ROZSTAĆ SIĘ это «расстаться», и собрано слово из тех же частей, ROZ- и STAĆ против рас- и стать. Ловушка здесь не смысловая, а формальная, и она в одной форме. ROZSTANIE это сразу две вещи: третье лицо единственного числа будущего времени, ON SIĘ ROZSTANIE «он расстанется», и существительное среднего рода ROZSTANIE «расставание». Различать их просто и надёжно по SIĘ: если рядом стоит SIĘ, перед вами глагол, если нет — существительное. ROZSTANIE Z ŻONĄ BYŁO TRUDNE это «расставание было трудным», а ROZSTANIE SIĘ Z ŻONĄ это «он расстанется с женой»." }
  - { kind: pronunciation, text: "Читается «ро́зстаць», ударение на предпоследнем слоге. Приставка ROZ- перед глухим S оглушается не полностью: в беглой речи слышно «рос-», и это обычное для польского уподобление на стыке приставки с корнем. Конечное -Ć мягкое, «ць». В повелительном ROZSTAŃ конечное Ń это мягкое «нь»: «ро́зстань». В формах прошедшего времени Ł даёт «у»: ROZSTAŁ звучит «ро́зстау». В существительном ROZSTANIE сочетание NIE читается «не» одним слогом: «розста́не», и ударение переходит на предпоследний слог, который теперь второй." }
  - { kind: usage, text: "Слово обиходное и применяется шире русского «расстаться» в одном отношении: по-польски так говорят и о работе, и о клубе, и о привычке — ROZSTAĆ SIĘ Z PRACĄ, ROZSTAĆ SIĘ Z NAWYKIEM, и в спортивных новостях KLUB ROZSTAŁ SIĘ Z TRENEREM значит, что тренера уволили. Это вежливый оборот, которым заменяют прямое ZWOLNIĆ. Отглагольное существительное ROZSTANIE книжнее глагола и чаще встречается в текстах о чувствах. В гнезде корня STAĆ стоят ZOSTAĆ «остаться, стать», PRZESTAĆ «перестать», WSTAĆ «встать», STAĆ SIĘ «стать» — и все четыре отвечают русским словам того же корня." }
