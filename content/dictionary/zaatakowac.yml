# review
id: zaatakowac
format: 2
lemma: "zaatakować"
rank: 1059
pos: verb
aspect: perf
pron: { cyr: "заатако́ваць" }
senses:
  - id: attack
    ru: "напасть, атаковать (совершенный вид)"
    examples:
      - pl: "Wróg zaatakował miasto."
        ru: "Враг атаковал город."
        source: { kind: translated, id: 5823746 }
      - pl: "Zaatakowali wroga."
        ru: "Они атаковали врага."
        source: { kind: translated, id: 529740 }
      - pl: "Ktoś mnie zaatakował."
        ru: "Кто-то на меня напал."
        source: { kind: translated, id: 5298525 }
  - id: passive
    ru: "zostać zaatakowanym — подвергнуться нападению"
    examples:
      - pl: "Zostałem zaatakowany przez niedźwiedzia."
        ru: "На меня напал медведь."
        source: { kind: translated, id: 6671564 }
      - pl: "Zostaliśmy zaatakowani od tyłu."
        ru: "На нас напали сзади."
        source: { kind: translated, id: 4658239 }
  - id: disease
    ru: "поразить (о болезни, вредителе)"
    examples:
      - pl: "Dziwna choroba zaatakowała miasto."
        ru: "Странная болезнь поразила город."
        source: { kind: translated, id: 541573 }
      - pl: "Choroba zaatakowała płuca."
        ru: "Болезнь поразила лёгкие."
        source: { kind: authored }
notes:
  - { kind: government, text: "zaatakować kogoś «напасть на кого-то» — винительный падеж без предлога, тогда как русское «напасть» требует предлога «на»: Ktoś mnie zaatakował «Кто-то на меня напал»." }
  - { kind: usage, text: "Совершенный вид к atakować. Приставка za- здесь только завершает действие и значения не добавляет." }
  - { kind: usage, text: "Страдательный оборот строится через zostać: został zaatakowany «был атакован», zostaliśmy zaatakowani «на нас напали»." }
  - { kind: usage, text: "Безличное zaatakowano «напали» — частая форма газетного языка: Zaatakowano posterunek «Напали на пост»." }
collocations:
  - { pl: "zaatakować wroga", ru: "атаковать врага" }
  - { pl: "zostać zaatakowanym", ru: "подвергнуться нападению" }
  - { pl: "zaatakować z zaskoczenia", ru: "напасть внезапно" }
family:
  - { pl: "atakować", ru: "атаковать (несовершенный вид)", relation: aspect }
  - { pl: "atak", ru: "атака; приступ", relation: root }
  - { pl: "napastnik", ru: "нападающий", relation: derived }
etymology: "Приставка za- плюс atakować, заимствованное через немецкое attackieren из французского attaquer. Русское «атаковать» пришло тем же путём."
memory: "zaatakować — «напасть, атаковать», совершенный вид к atakować. Главное отличие от русского: дополнение идёт без предлога, в винительном падеже — zaatakować kogoś, а по-русски «напасть на кого-то»."
idioms:
  - { pl: "zostać zaatakowanym", ru: "подвергнуться нападению" }
  - { pl: "zaatakować z zaskoczenia", ru: "напасть внезапно" }
formExamplesSkip:
  - { form: "zaatakowawszy", reason: "книжное деепричастие прошедшего времени; в живой речи не употребляется" }
