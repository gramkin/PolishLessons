notes:
  - { kind: false-friend, text: "Русский взял на это место латинское слово, «фактор». Поляк построил своё, от CZYNIĆ «делать»: CZYNNIK это «то, что делает». А в том же гнезде сидит настоящая ловушка: польское CZYN значит «поступок, деяние», как в CZYN ZBROJNY, тогда как русский «чин» — это звание. Слова выглядят одинаково, а общего в значении у них нет. Запомните заодно CZYNNY: SKLEP CZYNNY значит «магазин открыт»." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Основа не меняется, беглых гласных нет, зато в ней двойное N, и выговаривать надо оба звука. Существительное CZYNNOŚĆ значит «действие», а прилагательное CZYNNY — «действующий, открытый», и в этом последнем смысле оно висит на дверях каждого магазина." }
  - { kind: government, text: "Фактор риска — CZYNNIK RYZYKA, родительный без предлога. Принять во внимание факторы — WZIĄĆ POD UWAGĘ CZYNNIKI, винительный множественного. Опираться на фактор — OPIERAĆ SIĘ NA CZYNNIKU, местный падеж после NA. Под фактором понимается — POD CZYNNIKIEM ROZUMIE SIĘ, творительный после POD." }
  - { kind: pronunciation, text: "Читается «чы́нник», два слога, ударение на первом. Сочетание CZ даёт «ч», а Y — «ы», поэтому первый слог это «чы». Двойное NN произносится протяжно, как в русском «длинный». Конец слова звучит «ник», с мягким «н» перед I." }
  - { kind: register, text: "Слово научное и газетное: CZYNNIK LUDZKI, CZYNNIK DECYDUJĄCY, CZYNNIKI ZEWNĘTRZNE. В медицине — CZYNNIK RYZYKA, в экономике — CZYNNIKI PRODUKCJI. Зато родственное CZYNNY совершенно обиходно и нужно каждый день: CZYNNY OD DZIEWIĄTEJ значит «открыто с девяти», и так написано на любой вывеске." }
collocations:
