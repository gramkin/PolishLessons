  - { pl: "czyn", ru: "поступок, деяние", relation: root, id: czyn }
  - { pl: "czynność", ru: "действие", relation: derived }
etymology: "От глагола CZYNIĆ «делать», праславянского и того же, что русское «чинить» в старом смысле «делать, устраивать». От того же корня идёт и русский «чин», но у нас он значил сперва «порядок, устроение», а потом стал званием, тогда как польское CZYN осталось при поступке. Так два слова одного корня разошлись начисто: у поляка деяние, у нас звание. А CZYNNIK, «то, что делает», занял место, которое русский отдал латинскому «фактору»."
memory: "Фактор, но слово своё: czynnik от czynic «делать», то есть «то, что делает», а русский взял латинское «фактор». В гнезде ловушка: польское czyn это «поступок», а наш «чин» — звание, при общем корне. Читается «чы́нник», с двойным н. Главное сочетание — czynnik ludzki. И запомните czynny: sklep czynny значит «магазин открыт»."
idioms:
  - { pl: "czynnik ludzki", ru: "человеческий фактор" }
