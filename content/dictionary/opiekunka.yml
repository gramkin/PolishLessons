etymology: "От OPIEKA, а то — от праславянского корня со значением «печься, заботиться», того же, что в русских «печься о кому-то», «попечение» и «опека». Родство полное, и в русском «попечении» он слышен даже лучше, чем в «опеке». Разошлись языки в широте: у нас корень сузился до права и присмотра над несовершеннолетними, а в польском остался при всякой заботе, от детской до врачебной."
memory: "Няня или сиделка, а не опекунша по суду: та называется opiekun prawny. Корень наш, тот же, что в «попечении» и «печься о ком-то», но польская opieka гораздо шире: opieka zdrowotna это здравоохранение. Читается «опеку́нка», где pie даёт «пе». Уход за кем-то — opieka nad kims, с творительным, как и у нас. Няня для детей — opiekunka do dzieci, с предлогом do."
idioms:
