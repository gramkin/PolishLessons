notes:
  - { kind: false-friend, text: "Русская «опека» почти всегда юридическая: опекун, опекунский совет. Польская OPIEKA куда шире и значит всякую заботу и уход: OPIEKA ZDROWOTNA это здравоохранение, OPIEKA NAD DZIECKIEM — уход за ребёнком, POD OPIEKĄ LEKARZA — под наблюдением врача. Поэтому OPIEKUNKA это няня или сиделка, а вовсе не опекунша по суду: та называется OPIEKUN PRAWNY." }
  - { kind: usage, text: "Десять форм, женский род. В дательном и местном падежах K переходит в C: OPIEKUNKA, но OPIEKUNCE. В родительном множественного появляется беглое E: OPIEKUNEK. Мужская пара к слову — OPIEKUN, и она тоже значит прежде всего того, кто заботится, а юридического опекуна называют полностью, OPIEKUN PRAWNY." }
  - { kind: government, text: "Уход за кем-то — OPIEKA NAD KIMŚ, предлог NAD с творительным, и русский здесь скажет «за», тоже с творительным. Под присмотром — POD OPIEKĄ, творительный. Няня для детей — OPIEKUNKA DO DZIECI, предлог DO с родительным, где русский скажет «для детей». Искать няню — SZUKAĆ OPIEKUNKI, родительный, потому что SZUKAĆ его требует." }
  - { kind: pronunciation, text: "Читается «опеку́нка», четыре слога, ударение на предпоследнем. Сочетание PIE даёт «пе»: буква I здесь не читается отдельно, а смягчает P. Дальше идёт «ку» и «нка», без всяких трудностей. В форме OPIEKUNCE сочетание NC даёт «нц»: «опеку́нце»." }
  - { kind: register, text: "Слово обиходное, из объявлений о работе и из разговора о семье. OPIEKUNKA DO DZIECI это самая частая формула в объявлениях, OPIEKUNKA OSOBY STARSZEJ — сиделка. OPIEKUNKA SPOŁECZNA это должность в социальной службе. А в школе OPIEKUN KLASY значит классного руководителя, и слово это звучит мягче нашего «воспитателя»." }
