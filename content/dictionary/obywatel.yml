notes:
  - { kind: false-friend, text: "ОДНО ИЗ САМЫХ КОВАРНЫХ СЛОВ ДЛЯ РУССКОГО УХА, ПРИЧЁМ НАОБОРОТ. Польское obywatel — это «ГРАЖДАНИН», слово уважительное и официальное: obywatel polski, prawa obywatela, społeczeństwo obywatelskie «гражданское общество». Русский «обыватель» звучит ровно противоположно — это упрёк, «мещанин, человек без кругозора». Слова одного происхождения, оба от «пребывать», и когда-то оба значили «житель», но польское поднялось, а русское сползло в насмешку. Переводить obywatel как «обыватель» нельзя ни в одном контексте." }
  - { kind: usage, text: "Именительный множественного — obywatele, с окончанием -e. Так ведут себя мужские существительные на -el и -ciel: nauczyciel даёт nauczyciele, przyjaciel — przyjaciele. Родительный множественного при этом obywateli. Звательный obywatelu жив в официальной речи и в обращении милиционера на улице." }
  - { kind: pronunciation, text: "Четыре слога, ударение на предпоследнем: o-by-WA-tel, «обыва́тэль». y звучит как ы, e как э, а конечное l заметно мягче русского «л»." }
collocations:
  - { pl: "obywatel polski", ru: "польский гражданин" }
  - { pl: "prawa obywatela", ru: "права гражданина" }
  - { pl: "zostać obywatelem", ru: "стать гражданином" }
family:
  - { pl: "obywatelka", ru: "гражданка", relation: derived }
  - { pl: "obywatelstwo", ru: "гражданство", relation: derived }
  - { pl: "obywatelski", ru: "гражданский", relation: derived }
  - { pl: "być", ru: "быть", relation: root, id: byc }
etymology: "От obywać się «пребывать, обходиться», в конечном счёте от być «быть»: буквально «тот, кто пребывает в стране». Русский «обыватель» собран из тех же частей и когда-то значил ровно то же — «житель», «городской обыватель», — но сполз в насмешку, тогда как польское слово поднялось до «гражданина». Отсюда obywatelka, obywatelstwo «гражданство», obywatelski."
memory: "obywatel — «гражданин», и это прямая противоположность русскому «обывателю»: там упрёк, здесь уважение, хотя слово одно и то же. Множественное число с окончанием -e: obywatele, как nauczyciele и przyjaciele."
idioms:
