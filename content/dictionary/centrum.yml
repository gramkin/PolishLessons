etymology: "Из латинского centrum «середина» — тем же путём, что и русский «центр». Но польский оставил слово несклоняемым в единственном числе."
memory: "centrum — «центр», и главная особенность не значение, а склонение: в единственном числе слово не меняется совсем. W centrum, do centrum, z centrum — форма одна и та же."
