# review
id: wycieczka
format: 2
lemma: "wycieczka"
rank: 1574
pos: noun
pron: { cyr: "выце́чка" }
senses:
  - id: trip
    ru: "экскурсия, поездка"
    examples:
      - pl: "Wycieczka potrwa co najmniej osiem godzin."
        ru: "Экскурсия продлится не менее восьми часов."
        source: { kind: tatoeba, id: 351530 }
      - pl: "Jak tam wycieczka?"
        ru: "Как экскурсия?"
        source: { kind: translated, id: 6328139 }
      - pl: "Czy twoja wycieczka się udała?"
        ru: "Твоя поездка удалась?"
        source: { kind: translated, id: 6157592 }
  - id: go-on-trip
    ru: "поехать, пойти на экскурсию"
    examples:
      - pl: "Pójdę na wycieczkę."
        ru: "Я поеду в путешествие."
        source: { kind: tatoeba, id: 1349207 }
      - pl: "Jedziemy na wycieczkę w góry."
        ru: "Мы едем на экскурсию в горы."
        source: { kind: translated, id: 437955 }
      - pl: "Lepiej odwołajmy wycieczkę."
        ru: "Давай лучше отменим поездку."
        source: { kind: translated, id: 710458 }
notes:
  - { kind: government, text: "Направление — na wycieczkę (винительный): iść na wycieczkę «пойти на экскурсию». Место — na wycieczce (предложный): na wycieczce było przyjemnie." }
  - { kind: usage, text: "wycieczka szkolna — «школьная экскурсия», piesza wycieczka — «пеший поход»." }
  - { kind: usage, text: "Второе, переносное значение — «колкость, выпад»: wycieczka osobista «личный выпад»." }
  - { kind: false-friend, text: "Отличайте от podróż «путешествие» (дольше и дальше) и wakacje «каникулы»." }
collocations:
  - { pl: "iść na wycieczkę", ru: "пойти на экскурсию" }
  - { pl: "wycieczka szkolna", ru: "школьная экскурсия" }
  - { pl: "na wycieczce", ru: "на экскурсии" }
etymology: "От wyciekać «вытекать, выходить наружу» — буквально «вылазка», отсюда и старое военное значение «вылазка отряда». Русское «вылазка» построено ровно так же."
memory: "wycieczka = «экскурсия, поездка». Падежи те же, что у plaża: idę na wycieczkę «иду на экскурсию» (винительный), jestem na wycieczce «я на экскурсии» (предложный)."
idioms:
  - { pl: "iść na wycieczkę", ru: "пойти на экскурсию" }
  - { pl: "wycieczka szkolna", ru: "школьная экскурсия" }
  - { pl: "wycieczka osobista", ru: "личный выпад" }
