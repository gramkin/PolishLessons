# review
id: durny
format: 2
lemma: "durny"
rank: 4310
pos: adj
pron: { cyr: "ду́рны" }
senses:
  - id: stupid
    ru: "разг. дурацкий, глупый, тупой"
    examples:
      - pl: "To był durny pomysł."
        ru: "Это была дурацкая идея."
        source: { kind: authored }
      - pl: "Nie bądź taki durny!"
        ru: "Не будь таким дураком!"
        source: { kind: authored }
      - pl: "To najdurniejszy film, jaki widziałem."
        ru: "Это самый дурацкий фильм, какой я видел."
        source: { kind: authored }
  - id: silly-annoying
    ru: "разг. дурацкий, нелепый (о вещи, ситуации)"
    examples:
      - pl: "Ten durny telefon znowu się zawiesił."
        ru: "Этот дурацкий телефон опять завис."
        source: { kind: authored }
      - pl: "Co za durna sytuacja!"
        ru: "Какая дурацкая ситуация!"
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Русское «дурной» значит «плохой»: «дурная привычка», «дурной вкус». Польское DURNY — только «дурацкий, глупый», грубовато: DURNY POMYSŁ, DURNE PYTANIE. «Дурная привычка» по-польски — ZŁY NAWYK. Существительное — DUREŃ, «дурак»." }
  - { kind: usage, text: "Полная парадигма: DURNY, DURNIEJSZY, NAJDURNIEJSZY. Степени живые в разговоре: CORAZ DURNIEJSZE POMYSŁY. Мужское-личное: DURNI, DURNIEJSI, NAJDURNIEJSI." }
  - { kind: government, text: "Ставится перед существительным: DURNY ŻART, DURNA GRA. Как обращение — грубо: TY DURNIU! — это уже существительное DUREŃ в звательном. Наречие DURNIE — «по-дурацки»." }
  - { kind: pronunciation, text: "Читается «ду́рны», два слога, ударение на первом. RN — без гласной. В DURNIEJSZY: «дурне́йшы»." }
  - { kind: register, text: "Разговорное и грубоватое слово. Синонимы: GŁUPI (нейтральное), GŁUPAWY (мягче), IDIOTYCZNY (резче). При начальстве и детях лучше GŁUPI." }
collocations:
  - { pl: "durny pomysł", ru: "дурацкая идея" }
  - { pl: "durne pytanie", ru: "дурацкий вопрос" }
  - { pl: "durny żart", ru: "дурацкая шутка" }
family:
  - { pl: "dureń", ru: "дурак", relation: root, id: duren }
  - { pl: "głupi", ru: "глупый", relation: root, id: glupi }
  - { pl: "durnota", ru: "глупость, дурость", relation: derived }
etymology: "Общеславянский корень *dur-, того же, что русское «дурак», «дурной», «дурь». Польский сохранил значение «глупый», а русское «дурной» сдвинулось к «плохой». Отсюда ложная дружба: «дурной» и DURNY выглядят одинаково, а значат разное."
memory: "Durny — дурацкий, глупый (разг.): durny pomysł, durne pytanie. Не «дурной» (плохой)! Дурная привычка — zły nawyk. Dureń — дурак. Читается «ду́рны»."
idioms:
  - { pl: "durne pytanie", ru: "дурацкий вопрос" }
