  - { pl: "bystrzak", ru: "смышлёный малый", relation: derived }
  - { pl: "tępy", ru: "тупой", relation: antonym }
etymology: "Из праславянского *bystrъ — то же слово, что русское «быстрый». Исходный смысл был о стремительном движении, и русский его сохранил целиком. Польский же перенёс слово на быстроту соображения и оставил старое значение лишь при воде, где оно живёт до сих пор. Для скорости в обычном смысле польский взял другое слово — szybki."
memory: "bystry — это «смышлёный», а «быстрый» будет szybki. Старое значение уцелело только у воды: bystry potok."
