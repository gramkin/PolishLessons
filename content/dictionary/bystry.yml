senses:
  - id: sharp
    ru: "смышлёный, сообразительный"
    examples:
      - pl: "To bystry chłopak, w lot wszystko łapie."
        ru: "Это смышлёный парень, всё схватывает на лету."
        source: { kind: authored }
      - pl: "Bystrzy uczniowie nudzą się najszybciej."
        ru: "Смышлёные ученики скучают быстрее всех."
        source: { kind: authored }
      - pl: "To najbystrzejszy uczeń w klasie."
        ru: "Это самый смышлёный ученик в классе."
        source: { kind: authored }
  - id: swift
    ru: "быстрый (о воде)"
    examples:
      - pl: "Bystry potok przecina dolinę."
        ru: "Быстрый поток пересекает долину."
        source: { kind: authored }
      - pl: "Przepłynęli bystrą rzekę wpław."
        ru: "Они переплыли быструю реку вплавь."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "BYSTRY — это «смышлёный», «сообразительный», а не «быстрый». Быстрый по-польски SZYBKI: szybki samochód, szybki krok. Слова всё же родня, оба из праславянского *bystrъ, и первоначальное значение было о стремительности. Польский перенёс его на ум и там закрепил, оставив прежний смысл только за водой: bystry potok, bystry nurt, bystra rzeka — ровно как наша «быстрая река»." }
  - { kind: pronunciation, text: "Здесь видно, что мена r на rz шире, чем предложный падеж. Она срабатывает и в мужской личной форме множественного — BYSTRZY, и во всей сравнительной степени — BYSTRZEJSZY, NAJBYSTRZEJSZY. Смягчает r не какое-то одно окончание, а всякое переднее -i или -e, которое за ним встаёт, будь то падежное окончание или суффикс степени." }
collocations:
  - { pl: "bystry chłopak", ru: "смышлёный парень" }
  - { pl: "bystre oko", ru: "острый глаз" }
  - { pl: "bystry potok", ru: "быстрый поток" }
family:
