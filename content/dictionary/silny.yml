# review
id: silny
format: 2
lemma: "silny"
rank: 619
pos: adj
pron: { cyr: "си́льны" }
senses:
  - id: strong
    ru: "сильный (о человеке, животном)"
    note: "Мужское личное мн. — silni, всё остальное — silne."
    examples:
      - pl: "Lew jest silny."
        ru: "Лев сильный."
        source: { kind: tatoeba, id: 1604663 }
      - pl: "Jesteś naprawdę silna."
        ru: "Ты правда сильная."
        source: { kind: translated, id: 7880385 }
      - pl: "Są równie silni jak my."
        ru: "Они такие же сильные, как мы."
        source: { kind: translated, id: 498265 }
  - id: intense
    ru: "сильный (о явлении): silny wiatr, silna burza, silny ból"
    note: "silny akcent «сильный акцент», silna wola «сильная воля»."
    examples:
      - pl: "Wiatr był silny."
        ru: "Ветер был сильный."
        source: { kind: tatoeba, id: 1604664 }
      - pl: "Miał silny ból głowy."
        ru: "У него сильно болела голова."
        source: { kind: tatoeba, id: 364513 }
      - pl: "Po silnej burzy na brzegach Morza Bałtyckiego można zbierać bursztyny."
        ru: "После сильной бури на берегах Балтийского моря можно собирать янтарь."
        source: { kind: tatoeba, id: 12470265 }
  - id: stronger
    ru: "silniejszy — сильнее"
    note: "«Сильнее чего-то» — od с родительным или niż с именительным."
    examples:
      - pl: "Jesteś dwa razy silniejszy ode mnie."
        ru: "Ты в два раза сильнее меня."
        source: { kind: tatoeba, id: 919582 }
      - pl: "Miłość jest silniejsza od śmierci."
        ru: "Любовь сильнее смерти."
        source: { kind: translated, id: 4769702 }
      - pl: "Na ogół mężczyźni są silniejsi od kobiet."
        ru: "Как правило, мужчины сильнее женщин."
        source: { kind: tatoeba, id: 1119370 }
notes:
  - { kind: usage, text: "Мужское личное множественное — silni (о мужчинах), всё остальное — silne. Разница слышна прямо в приказе: Bądźcie silni! мужчинам, Bądźcie silne! женщинам." }
  - { kind: government, text: "«Сильнее чего-то» строится двумя способами: silniejszy OD czegoś с родительным и silniejszy NIŻ coś с именительным. Miłość jest silniejsza od śmierci = Miłość jest silniejsza niż śmierć." }
  - { kind: usage, text: "Степени правильные: silny — silniejszy — najsilniejszy." }
  - { kind: false-friend, text: "Не всё «сильное» по-русски будет silny по-польски: крепкий кофе и крепкий чай — mocna kawa, mocna herbata, а не silna. silny берут для людей, ветра, боли и воли." }
collocations:
  - { pl: "silna wola", ru: "сильная воля" }
  - { pl: "silny wiatr", ru: "сильный ветер" }
  - { pl: "silny ból", ru: "сильная боль" }
  - { pl: "silne i słabe strony", ru: "сильные и слабые стороны" }
family:
  - { pl: "siła", ru: "сила", relation: root }
  - { pl: "silnie", ru: "сильно", relation: derived }
  - { pl: "wzmocnić", ru: "усилить", relation: derived }
etymology: "От siła «сила», праславянское *sila — то же слово, что русское «сила». silny и «сильный» построены на одном корне и одним суффиксом."
memory: "silny — «сильный», и корень тот же, что в русском: siła «сила». Запомните две вещи. Первая: мужское личное множественное — silni, всё прочее — silne, и разница слышна прямо в приказе — Bądźcie silni! мужчинам, Bądźcie silne! женщинам. Вторая: «сильнее чего-то» говорят двояко — silniejszy od śmierci с родительным или silniejszy niż śmierć с именительным. А вот кофе и чай у поляков не silne, а mocne."
idioms:
