# review
id: wart
format: 2
lemma: "wart"
rank: 817
pos: adj
pron: { cyr: "варт" }
senses:
  - id: worth
    ru: "стоящий (какой-то суммы), ценой в"
    examples:
      - pl: "Ile wart jest ten pierścionek?"
        ru: "Сколько стоит это кольцо?"
        source: { kind: translated, id: 3495448 }
      - pl: "Prawdziwa przyjaźń jest więcej warta niż pieniądze."
        ru: "Настоящая дружба дороже денег."
        source: { kind: tatoeba, id: 644048 }
      - pl: "Ile to jest warte?"
        ru: "Сколько это стоит?"
        source: { kind: translated, id: 8654407 }
  - id: worth-doing
    ru: "wart zrobienia — стоит того, чтобы сделать"
    examples:
      - pl: "Tamten film jest wart zobaczenia."
        ru: "Тот фильм стоит посмотреть."
        source: { kind: translated, id: 1790665 }
      - pl: "To muzeum jest warte odwiedzenia."
        ru: "Этот музей стоит посетить."
        source: { kind: translated, id: 3871996 }
      - pl: "W Kioto jest wiele miejsc wartych obejrzenia."
        ru: "В Киото много мест, которые стоит посмотреть."
        source: { kind: translated, id: 355910 }
  - id: deserving
    ru: "достойный чего-то"
    examples:
      - pl: "To jest warte uwagi."
        ru: "Это достойно внимания."
        source: { kind: translated, id: 2502490 }
      - pl: "Jest człowiekiem wartym zaufania."
        ru: "Он человек, достойный доверия."
        source: { kind: authored }
notes:
  - { kind: government, text: "Главное в этом слове — управление: wart требует родительного падежа. Wart uwagi «достоин внимания», wart obejrzenia «стоит посмотреть». По-русски здесь был бы инфинитив («стоит посмотреть»), а по-польски отглагольное существительное." }
  - { kind: usage, text: "У слова две формы: краткая wart, warta, warte, warci и полная warty, warta, warte. Краткая идёт после jest, полная склоняется как обычное прилагательное." }
  - { kind: usage, text: "Родственное наречие warto значит «стоит» и строится с инфинитивом: Warto zobaczyć «Стоит посмотреть» — вот здесь польский совпадает с русским." }
  - { kind: false-friend, text: "nic nie wart значит «ничего не стоит, никудышный», а не «бесплатный». Бесплатный — darmowy." }
collocations:
  - { pl: "wart uwagi", ru: "достойный внимания" }
  - { pl: "wart zobaczenia", ru: "стоит посмотреть" }
  - { pl: "nic nie wart", ru: "ничего не стоит" }
  - { pl: "więcej wart", ru: "ценнее" }
family:
  - { pl: "wartość", ru: "ценность, стоимость", relation: root }
  - { pl: "warto", ru: "стоит (сделать)", relation: derived }
  - { pl: "wartościowy", ru: "ценный", relation: derived }
etymology: "Из немецкого wert «ценный, стоящий» — того же корня, что английское worth. В русском на этом месте своё слово, «стоящий», от «стоить»."
memory: "wart — «стоящий, достойный», и главное тут падеж: wart чего-то, родительный. Wart uwagi «достоин внимания», wart obejrzenia «стоит посмотреть» — по-русски здесь инфинитив, а по-польски существительное. С инфинитивом строится родственное warto."
idioms:
  - { pl: "gra nie warta świeczki", ru: "игра не стоит свеч" }
  - { pl: "wart zachodu", ru: "стоящий хлопот" }
  - { pl: "nic nie wart", ru: "ничего не стоит" }
