# review
id: lapa
format: 2
lemma: "łapa"
rank: 1957
pos: noun
pron: { cyr: "уа́па" }
senses:
  - id: paw
    ru: "лапа (животного)"
    examples:
      - pl: "Ten pies nie chce się ruszać, bo boli go łapa."
        ru: "Эта собака не хочет двигаться, потому что у неё болит лапа."
        source: { kind: translated, id: 11008390 }
      - pl: "Pies ma cztery łapy."
        ru: "У собаки четыре лапы."
        source: { kind: translated, id: 4278487 }
      - pl: "Kot dotykał łapą myszy."
        ru: "Кот трогал мышь лапой."
        source: { kind: translated, id: 11387227 }
      - pl: "Pies zawył, kiedy nadepnąłem mu na łapę."
        ru: "Собака взвыла, когда я наступил ей на лапу."
        source: { kind: translated, id: 837106 }
      - pl: "Podaj łapę."
        ru: "Дай лапу."
        source: { kind: translated, id: 13662570 }
      - pl: "Kot schował łapy pod siebie."
        ru: "Кот подобрал лапы под себя."
        source: { kind: authored }
  - id: hands-rude
    ru: "лапы (грубо о руках человека)"
    examples:
      - pl: "Zabieraj łapę."
        ru: "Убери лапу."
        source: { kind: translated, id: 12062296 }
      - pl: "Łapy przy sobie."
        ru: "Руки при себе."
        source: { kind: translated, id: 6554161 }
      - pl: "Burmistrz ponoć wziął w łapę."
        ru: "Мэр, говорят, взял на лапу."
        source: { kind: translated, id: 364630 }
notes:
  - { kind: usage, text: "О человеке łapa звучит грубовато: Zabieraj łapy «Убери лапы». Нейтральное слово — ręka, у него своя карточка." }
  - { kind: usage, text: "Оборот dać w łapę значит «дать взятку», wziąć w łapę — «взять на лапу», ровно как в русском." }
  - { kind: usage, text: "Не путайте с глаголом łapać «ловить»: формы łapie и łap принадлежат ему, а не существительному. On łapie przeziębienia значит «он легко простужается»." }
collocations:
  - { pl: "podaj łapę", ru: "дай лапу" }
  - { pl: "dać w łapę", ru: "дать взятку" }
  - { pl: "zabieraj łapy", ru: "убери лапы" }
etymology: "Праславянское *lapa. Русская «лапа» — то же самое слово, только польское ł читается как «у» краткое: łapa звучит почти как «уапа»."
memory: "łapa — «лапа», а о человеке — грубоватое «лапы»: Zabieraj łapy. Нейтральная рука — ręka. И dać w łapę значит «дать взятку»."
idioms:
  - { pl: "podaj łapę", ru: "дай лапу" }
  - { pl: "dać w łapę", ru: "дать взятку" }
  - { pl: "zabieraj łapy", ru: "убери лапы" }
formExamplesSkip:
  - { form: "łap", reason: "в корпусе все примеры на эту форму принадлежат глаголу łapać «ловить, подхватывать», а не существительному" }
  - { form: "łapie", reason: "в корпусе все примеры на эту форму принадлежат глаголу łapać «ловить, подхватывать», а не существительному" }
  - { form: "łapo", reason: "звательная форма, в корпусе примеров нет" }
