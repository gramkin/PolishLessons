notes:
  - { kind: false-friend, text: "Слово удобно тем, что показывает одно из самых больших и самых регулярных соответствий между языками. Там, где русский произносит Е, польский часто даёт IA или IE — и причина не в прихоти, а в праславянском звуке ѣ, который в русском дал Е, а в польском перед твёрдой согласной IA, перед мягкой IE. Отсюда целый ряд: PIASEK и «песок», BIAŁY и «белый», MIASTO и «место», LATO и «лето», WIARA и «вера», ŚMIAĆ SIĘ и «смеяться». Запомнив это правило на одном слове, учащийся узнаёт десятки других, и PIASEK для этого удобнее всего, потому что значение совпадает полностью." }
  - { kind: usage, text: "Беглая гласная E выпадает во всех косвенных падежах: PIASEK, но PIASKU, PIASKIEM, PIASKI. Из-за этого ударение переезжает, оставаясь предпоследним: «пя́сэк», но «пя́ску». Родительный и местный падеж единственного числа совпадают в одной форме PIASKU, поэтому в таблице девять форм, а не десять: BEZ PIASKU «без песка» и NA PIASKU «на песке» выглядят одинаково. Это пятый такой случай в словаре, после WYSIŁEK, POŚPIECH, DYSK и BLOK." }
  - { kind: pronunciation, text: "Читается «пя́сэк», ударение на первом слоге. Сочетание PIA даёт «пя», в один слог: буква I здесь не гласная, а знак мягкости для P. Это важно, потому что русское ухо склонно слышать два слога, «пи-а». Конечное -EK звучит «эк», с твёрдым э. В формах без беглой гласной слово остаётся двусложным: PIASKU «пя́ску», PIASKIEM «пя́скем»." }
  - { kind: government, text: "Мужской род, неодушевлённое. Винительный равен именительному: PRZYWIEŹLI PIASEK. Родительный на -U: BEZ PIASKU, и при отрицании винительный уходит туда же: NIE PRZYWIEŹLI PIASKU. Вещество в количестве требует родительного: WOREK PIASKU «мешок песка», TONA PIASKU. Предлог NA с местным для поверхности: NA PIASKU «на песке», а W с местным — для погружения: W PIASKU «в песке». Множественное число PIASKI значит не «много песка», а песчаные места, пески как местность." }
