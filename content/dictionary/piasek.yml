etymology: "Из праславянского *pěsъkъ, уменьшительного от *pěsъ «песок». Русское «песок» есть то же самое уменьшительное, и потому слова совпадают по строению полностью: корень плюс тот же суффикс. Разошлись они только в гласной, и разошлись закономерно: праславянское ѣ дало в русском Е, а в польском IA перед твёрдым согласным. Поэтому PIASEK и «песок» — не похожие слова, а одно слово в двух закономерных обличьях, и это соответствие работает по всему словарю. Дальше корень связан с латинским PISTUS «толчёный», от PINSERE «толочь»: песок есть то, что истолчено, растёрто в крупинки, и тот же образ лежит за словом «пестик»."
memory: "Правило, которое открывает десятки слов: праславянское ѣ дало русское Е и польское IA или IE. Piasek и «песок», biały и «белый», miasto и «место», lato и «лето», wiara и «вера». Беглое e выпадает: piasku, piaskiem. Родительный и местный совпадают в piasku — девять форм, как у wysiłek и blok. Pia читается «пя», одним слогом."
idioms:
