id: zywnosc
format: 2
lemma: "żywność"
rank: 2349
pos: noun
pron: { cyr: "жы́вносьць" }
senses:
  - id: food
    ru: "продовольствие, продукты питания"
    examples:
      - pl: "Importujemy dużo żywności."
        ru: "Мы ввозим много продовольствия."
        source: { kind: translated, id: 360443 }
      - pl: "Żywność podrożała."
        ru: "Продукты подорожали."
        source: { kind: translated, id: 3660548 }
      - pl: "Wkrótce zużyli zakupione zapasy żywności."
        ru: "Вскоре они израсходовали купленные запасы продовольствия."
        source: { kind: translated, id: 904506 }
  - id: supplies
    ru: "провизия, съестное"
    examples:
      - pl: "Dostarczali żywności ofiarom wojny."
        ru: "Они доставляли продовольствие жертвам войны."
        source: { kind: translated, id: 356883 }
      - pl: "Zapewnił głodującym żywność."
        ru: "Он обеспечил голодающих продовольствием."
        source: { kind: translated, id: 952155 }
notes:
  - { kind: government, text: "Женский род на -ość: ta żywność, tej żywności. Существительное неисчисляемое — множественного числа у него нет." }
  - { kind: false-friend, text: "От żywy «живой» и żyć «жить», которые уже есть в словаре: буквально «то, чем живут». Русское «живность» звучит почти так же, но значит «мелкий домашний скот и птица» — ловушка." }
  - { kind: usage, text: "Обычная еда на тарелке — jedzenie; żywność — это продукты как товар и запас: sklep z żywnością «продуктовый магазин»." }
  - { kind: usage, text: "Частые сочетания: zdrowa żywność «здоровое питание», przetwórstwo żywności «переработка продуктов»." }
collocations:
  - { pl: "zdrowa żywność", ru: "здоровое питание" }
  - { pl: "zapasy żywności", ru: "запасы продовольствия" }
etymology: "От żywy «живой», żyć «жить» — буквально «то, чем живут»."
memory: "żywność — «продовольствие, продукты», женского рода на -ość. Не путайте с русской «живностью»: это не скот, а еда. Еда на тарелке — jedzenie."
idioms:
  - { pl: "zdrowa żywność", ru: "здоровое питание" }
