# review
id: obojetny
format: 2
lemma: "obojętny"
rank: 2375
pos: adj
pron: { cyr: "обое́нтны" }
senses:
  - id: indifferent-to
    ru: "безразличный, равнодушный (к чему-л.)"
    examples:
      - pl: "Wiadomość jest mi dość obojętna."
        ru: "Новость мне довольно безразлична."
        source: { kind: translated, id: 2155949 }
      - pl: "Beth wydaje się być jednak obojętna na smutek Chrisa."
        ru: "Бет, однако, кажется равнодушной к печали Криса."
        source: { kind: translated, id: 2575648 }
      - pl: "Wygląda na dość obojętną w stosunku do piłki nożnej."
        ru: "Она выглядит довольно равнодушной к футболу."
        source: { kind: translated, id: 1354009 }
  - id: all-the-same
    ru: "всё равно (в обороте jest mi obojętne)"
    examples:
      - pl: "Jest mi to obojętne."
        ru: "Мне это безразлично."
        source: { kind: translated, id: 7847244 }
      - pl: "Jest mi obojętne, czy pojedziesz, czy nie."
        ru: "Мне всё равно, поедешь ты или нет."
        source: { kind: translated, id: 575780 }
notes:
  - { kind: government, text: "ГЛАВНОЕ: безразличный К чему-л. — obojętny NA coś, с винительным падежом после na. Русское «к» с дательным здесь не работает: obojętny na politykę «равнодушный к политике»." }
  - { kind: usage, text: "Конструкция jest mi obojętne «мне безразлично» ставит лицо в ДАТЕЛЬНЫЙ падеж, а само прилагательное — в средний род: Tomkowi jest to obojętne." }
  - { kind: false-friend, text: "От oboje «оба»: безразличный — тот, для кого обе стороны равны. Русское «безразличный» построено от «различия», образ другой, но итог тот же." }
  - { kind: usage, text: "Наречие — obojętnie; существительное — obojętność «равнодушие». В химии gaz obojętny «инертный газ»." }
collocations:
  - { pl: "obojętny na coś", ru: "равнодушный к чему-л." }
  - { pl: "jest mi obojętne", ru: "мне всё равно" }
etymology: "От oboje «оба»: тот, для кого обе стороны равны."
memory: "obojętny — «равнодушный», но управление другое: obojętny NA coś, с винительным, а не «к» с дательным. И оборот jest mi obojętne «мне всё равно», с дательным лица."
idioms:
  - { pl: "obojętny na coś", ru: "равнодушный к чему-л." }
  - { pl: "jest mi obojętne", ru: "мне всё равно" }
