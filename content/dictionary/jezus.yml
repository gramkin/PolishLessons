# review
id: jezus
format: 2
lemma: "Jezus"
rank: 1425
pos: noun
pron: { cyr: "е́зус" }
senses:
  - id: jesus
    ru: "Иисус"
    examples:
      - pl: "Co by zrobił Jezus?"
        ru: "Что бы сделал Иисус?"
        source: { kind: tatoeba, id: 12712228 }
      - pl: "Jezus przemienił wodę w wino."
        ru: "Иисус превратил воду в вино."
        source: { kind: tatoeba, id: 2734087 }
      - pl: "Wierzę w Jezusa Chrystusa."
        ru: "Я верю в Иисуса Христа."
        source: { kind: translated, id: 2244758 }
  - id: interjection
    ru: "в восклицаниях — Господи!, Боже мой!"
    examples:
      - pl: "Jezus Maria, co się stało?"
        ru: "Господи, что случилось?"
        source: { kind: authored }
      - pl: "Jezus Maria, ale mnie wystraszyłeś!"
        ru: "Господи, как ты меня напугал!"
        source: { kind: authored }
notes:
  - { kind: usage, text: "Формы множественного числа (Jezusi, Jezusowie, Jezusów, Jezusom, Jezusami, Jezusach) оставлены без примеров: имя единственного носителя во множественном не употребляется. Изредка так говорят искусствоведы об изображениях — Jezusy w malarstwie gotyckim, — но косвенных падежей такого множественного в речи нет. Форма Jezusu тоже не нормативна: звательный падеж — Jezu (реже Jezusie), родительный — Jezusa." }
  - { kind: usage, text: "Имя собственное, пишется с прописной буквы и склоняется как обычное существительное мужского рода: Jezusa, Jezusowi, Jezusem." }
  - { kind: usage, text: "Для изучающего язык важнее всего восклицания: Jezus Maria! и O Jezu! — повседневные возгласы удивления или испуга, по силе примерно равные русскому «Господи!» или «Боже мой!»." }
  - { kind: usage, text: "В восклицании звательная форма — краткое Jezu, которое стоит особняком: в обычную парадигму слова оно не входит (словари форм дают Jezusie и Jezusu). Именно поэтому O Jezu! стоит запоминать целиком, как готовый возглас." }
  - { kind: register, text: "Как возглас слово звучит нейтрально-разговорно и встречается очень часто, но в разговоре с верующим собеседником частое Jezus Maria! может показаться небрежностью." }
collocations:
  - { pl: "Jezus Chrystus", ru: "Иисус Христос" }
  - { pl: "Jezus Maria!", ru: "Господи!" }
  - { pl: "Pan Jezus", ru: "Господь Иисус" }
etymology: "Через латинское Iesus из греческого Ἰησοῦς, восходящего к еврейскому Yeshua. Русское «Иисус» пришло тем же путём, но напрямую через греческий, поэтому звучит иначе."
memory: "Jezus — «Иисус», но для изучающего язык важнее другое: Jezus Maria! и O Jezu! это обычные разговорные восклицания, польский эквивалент русского «Господи!». Звательная форма в них — краткое Jezu, стоящее вне обычной парадигмы."
idioms:
  - { pl: "Jezus Maria!", ru: "Господи!, Боже мой!" }
  - { pl: "Panie Jezusie, zmiłuj się", ru: "Господи Иисусе, помилуй" }
  - { pl: "bodaj cię Pan Jezus kochał", ru: "да Бог с тобой" }
