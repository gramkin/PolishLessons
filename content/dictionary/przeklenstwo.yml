notes:
  - { kind: false-friend, text: "Главное значение — не «проклятие», а «ругательство, бранное слово»: UŻYWAĆ PRZEKLEŃSTW — «ругаться, материться». Проклятие как наложенное заклятие чаще называют KLĄTWA. «Проклятием» PRZEKLEŃSTWO бывает в переносном смысле — о беде, от которой не избавиться: PRZEKLEŃSTWO NASZYCH CZASÓW." }
  - { kind: government, text: "Ругательствами «сыплют» и «осыпают» с творительным: SYPAĆ PRZEKLEŃSTWAMI, OBRZUCIĆ KOGOŚ PRZEKLEŃSTWAMI. «Быть для кого-то проклятием» — BYĆ DLA KOGOŚ PRZEKLEŃSTWEM, тоже творительный." }
  - { kind: usage, text: "Средний род на -O, склоняется как KRÓLESTWO: в предложном PRZEKLEŃSTWIE, в родительном множественного — PRZEKLEŃSTW без окончания. Глагол — PRZEKLINAĆ «ругаться; проклинать», совершенный вид PRZEKLĄĆ." }
  - { kind: pronunciation, text: "Читается «пшэкле́ньстфо»: Ń перед согласной — мягкое «нь», E здесь обычное, не носовое. W после глухой T оглушается: «стфо». Ударение на предпоследнем слоге." }
