id: pudlo
format: 2
lemma: "pudło"
rank: 2254
pos: noun
pron: { cyr: "пу́дуо" }
senses:
  - id: box
    ru: "коробка, ящик"
    examples:
      - pl: "Książki leżą w pudle na strychu."
        ru: "Книги лежат в коробке на чердаке."
        source: { kind: authored }
      - pl: "Przynieś puste pudło z piwnicy."
        ru: "Принеси пустую коробку из подвала."
