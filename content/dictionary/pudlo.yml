  - id: miss
    ru: "промах"
    examples:
      - pl: "Strzelił i pudło."
        ru: "Он выстрелил — и промах."
        source: { kind: authored }
      - pl: "Trzy rzuty i trzy pudła."
        ru: "Три броска и три промаха."
        source: { kind: authored }
  - id: jail
    ru: "тюрьма (прост.)"
    examples:
      - pl: "Siedział w pudle dwa lata."
        ru: "Он отсидел два года."
        source: { kind: authored }
notes:
  - { kind: pronunciation, text: "ДВА ЧЕРЕДОВАНИЯ В ОДНОМ КОРОТКОМ СЛОВЕ. Предложный падеж смягчает ł в l: w pudle — тот же переход, что в kawał — o kawale. А родительный множественного ВСТАВЛЯЕТ беглое e: pudeł, как paczka — paczek и marynarka — marynarek. Польское ł читается как у краткое, поэтому pudło звучит «пу́дуо», а pudle — уже «пу́дле»." }
  - { kind: false-friend, text: "НИ ОДНОГО РУССКОГО РОДСТВЕННИКА. На «пудель» слово не похоже по смыслу, на «пудрить» — лишь по звуку; русского соответствия у него просто нет. Происхождение неясно и самим этимологам. Опираться приходится на внутрипольское гнездо: pudło «коробка», pudełko «коробочка», spudłować «промахнуться»." }
  - { kind: usage, text: "Самая частая форма — уменьшительное pudełko «коробочка»: pudełko zapałek, pudełko czekoladek. Большое pudło это картонная коробка при переезде или ящик. Второе значение, «промах», живёт в возгласе pudło! при неудачном броске и в глаголе spudłować. Третье, «тюрьма», — грубоватый разговор." }
  - { kind: register, text: "Значение «тюрьма» просторечное, примерно как русское «тюряга»; в официальной речи — więzienie или zakład karny. Значение «промах» разговорное, но вполне обычное в спорте и в игре. Только «коробка» нейтральна во всех регистрах." }
collocations:
  - { pl: "pudło zapałek", ru: "коробок спичек" }
  - { pl: "kartonowe pudło", ru: "картонная коробка" }
  - { pl: "strzelić pudło", ru: "промахнуться" }
family:
  - { pl: "pudełko", ru: "коробочка", relation: derived, id: pudelko }
  - { pl: "spudłować", ru: "промахнуться", relation: derived }
  - { pl: "skrzynia", ru: "ящик, сундук", relation: root }
etymology: "Происхождение тёмное: этимологи спорят, звукоподражание это или давнее заимствование, и надёжного ответа нет. Ясно лишь, что русского соответствия у слова не было никогда. Внутри польского гнездо прозрачно: pudło, pudełko, pudłowaty и spudłować «промахнуться» — последнее, по-видимому, от образа удара, ушедшего в пустой ящик."
memory: "pudło — «коробка», и русской родни у него нет совсем; запоминать приходится как есть, опираясь на уменьшительное pudełko. Зато два чередования разом: предложный смягчает ł в l (w pudle), а родительный множественного вставляет беглое e (pudeł)."
idioms:
