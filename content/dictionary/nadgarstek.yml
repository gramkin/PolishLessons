notes:
  - { kind: false-friend, text: "NADGARSTEK — «запястье», буквально «над горстью»: GARŚĆ по-польски — «горсть, пригоршня», как в русском. Русское «запястье» построено иначе: «за пястью»." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Беглое E: NADGARSTEK, но NADGARSTKA, NADGARSTKI. Творительный — NADGARSTKIEM: K перед I смягчается." }
  - { kind: government, text: "Часы на запястье — ZEGAREK NA NADGARSTKU, NA с местным. Сломать запястье — ZŁAMAĆ NADGARSTEK, винительный. Повязка на запястье — OPASKA NA NADGARSTEK." }
  - { kind: pronunciation, text: "Читается «надга́рстэк», ударение на предпоследнем слоге. D перед G звонкое, TE — твёрдое «тэ»." }
collocations:
  - { pl: "złamany nadgarstek", ru: "сломанное запястье" }
  - { pl: "zegarek na nadgarstku", ru: "часы на запястье" }
  - { pl: "ból nadgarstka", ru: "боль в запястье" }
family:
  - { pl: "garść", ru: "горсть, пригоршня", relation: root, id: garsc }
  - { pl: "garstka", ru: "горстка", relation: root, id: garstka }
  - { pl: "nadgarstkowy", ru: "запястный", relation: derived }
etymology: "NAD «над» + GARŚĆ «горсть, ладонь» с уменьшительным суффиксом: то, что над ладонью. GARŚĆ — родня русского «горсть»: польское AR на месте русского «ор»."
memory: "Nadgarstek — запястье, «над горстью» (garść). Читается «надга́рстэк». Zegarek na nadgarstku — часы на запястье. Mieć coś w garści — держать в кулаке."
idioms:
  - { pl: "mieć kogoś w garści", ru: "держать кого-то в кулаке" }
