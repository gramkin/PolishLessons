# review
id: myc
format: 2
lemma: "myć"
rank: 3389
pos: verb
aspect: imperf
pron: { cyr: "мыць" }
senses:
  - id: wash
    ru: "мыть"
    examples:
      - pl: "Myję ręce."
        ru: "Я мою руки."
        source: { kind: tatoeba, id: 1014379 }
      - pl: "Myje samochód."
        ru: "Он моет машину."
        source: { kind: tatoeba, id: 12700134 }
      - pl: "Myję ręce przed obiadem."
        ru: "Я мою руки перед ланчем."
        source: { kind: tatoeba, id: 792330 }
  - id: wash-oneself
    ru: "мыться, умываться (myć się)"
    examples:
      - pl: "Myj się!"
        ru: "Мойся!"
        source: { kind: translated, id: 10585265 }
      - pl: "Myjemy się mydłem."
        ru: "Мы моемся мылом."
        source: { kind: translated, id: 3677192 }
notes:
  - { kind: government, text: "Винительный падеж: myć ręce «мыть руки». С się — «мыться»: myję się. Чем — творительный: myć się mydłem." }
  - { kind: false-friend, text: "Русское «мыть» и польское myć — одно слово. Совпадает и пословица: Ręka rękę myje «Рука руку моет»." }
  - { kind: usage, text: "Совершенный вид — umyć: umyj ręce «вымой руки». В корпусе есть пара myłeś / umyłeś, прямо показывающая разницу." }
  - { kind: usage, text: "Осторожно: myli — это и форма от myć «мыли», и форма от mylić się «ошибаться». Ona się myli значит «она ошибается», а не «она моется»." }
collocations:
  - { pl: "myć ręce", ru: "мыть руки" }
  - { pl: "ręka rękę myje", ru: "рука руку моет" }
etymology: "Праславянское *myti; русское «мыть» — то же слово, и пословица Ręka rękę myje совпадает."
memory: "myć — «мыть», с się «мыться». Совершенный вид — umyć. Осторожно: myli может быть и от myć, и от mylić się «ошибаться»."
idioms:
  - { pl: "myć ręce", ru: "мыть руки" }
  - { pl: "ręka rękę myje", ru: "рука руку моет" }
formExamplesSkip:
  - { form: "myliście", reason: "единственный кандидат дублирует myłeś; отдельного примера нет" }
  - { form: "mył", reason: "единственный кандидат — длинное условное предложение, отвергнуто по качеству" }
