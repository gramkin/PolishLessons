    ru: "Машину моют каждую неделю."
    source: { kind: authored }
  - form: "myty"
    pl: "Ten garnek nie był myty."
    ru: "Эта кастрюля не была вымыта."
    source: { kind: authored }
  - form: "myty"
    pl: "Pies bywa myty raz w miesiącu."
    ru: "Пса моют раз в месяц."
    source: { kind: authored }
  - form: "mytych"
    pl: "Nie ma tu mytych naczyń."
    ru: "Здесь нет вымытой посуды."
    source: { kind: authored }
  - form: "mytych"
    pl: "Wśród mytych kubków stał jeden brudny."
    ru: "Среди вымытых кружек стояла одна грязная."
    source: { kind: authored }
  - form: "mytych"
    pl: "Od mytych rąk zaczyna się zdrowie."
    ru: "С вымытых рук начинается здоровье."
    source: { kind: authored }
  - form: "mytym"
    pl: "W mytym kubku nie ma osadu."
    ru: "В вымытой кружке нет налёта."
    source: { kind: authored }
  - form: "mytym"
    pl: "Mytym naczyniom nie grozi pleśń."
    ru: "Вымытой посуде не грозит плесень."
    source: { kind: authored }
  - form: "mytym"
    pl: "Z mytym psem przyjemniej."
    ru: "С вымытым псом приятнее."
    source: { kind: authored }
  - form: "mytymi"
    pl: "Między brudnymi a mytymi naczyniami jest różnica."
    ru: "Между грязной и вымытой посудой есть разница."
    source: { kind: authored }
  - form: "mytymi"
    pl: "Zajmuje się mytymi butelkami."
    ru: "Он занимается вымытыми бутылками."
    source: { kind: authored }
  - form: "mytymi"
    pl: "Wróciła z mytymi włosami."
    ru: "Она вернулась с вымытыми волосами."
    source: { kind: authored }
  - form: "będę myć"
    pl: "Będę myć naczynia po kolacji."
    ru: "Я буду мыть посуду после ужина."
    source: { kind: authored }
  - form: "będę myć"
