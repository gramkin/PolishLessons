# review
id: zalozenie
format: 2
lemma: "założenie"
rank: 5995
pos: noun
pron: { cyr: "зауожэ́нье" }
senses:
  - id: premise
    ru: "предположение, допущение, исходная посылка; мн. ч. — принципы, основные положения"
    examples:
      - pl: "Twoje założenie wydaje mi się rozsądne."
        ru: "Твоё предположение кажется мне разумным."
        source: { kind: authored }
      - pl: "To niebezpieczne założenie dla całego projektu."
        ru: "Это опасное допущение для всего проекта."
        source: { kind: authored }
      - pl: "Twój argument opiera się na błędnym założeniu."
        ru: "Твой аргумент основан на ошибочной посылке."
        source: { kind: authored }
  - id: founding
    ru: "основание, создание (фирмы, города, семьи)"
    examples:
      - pl: "Założenie uniwersytetu było jej wielkim marzeniem."
        ru: "Основание университета было её большой мечтой."
        source: { kind: translated, id: 695716 }
      - pl: "Tom i Mary myślą o założeniu rodziny."
        ru: "Том и Мэри думают о том, чтобы создать семью."
        source: { kind: translated, id: 6995391 }
      - pl: "Dlaczego odwlekasz założenie rodziny?"
        ru: "Почему ты откладываешь создание семьи?"
        source: { kind: translated, id: 12586563 }
  - id: putting-on
    ru: "надевание (одежды, очков); установка"
    examples:
      - pl: "Wyprać przed pierwszym założeniem."
        ru: "Постирать перед первой ноской."
        source: { kind: translated, id: 10545329 }
      - pl: "Po założeniu okularów widział wszystko wyraźnie."
        ru: "Надев очки, он видел всё чётко."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Отглагольное существительное от ZAŁOŻYĆ и наследует все его значения: «основать» (ZAŁOŻENIE FIRMY — открытие фирмы), «надеть» (PO ZAŁOŻENIU KASKU), «предположить» (MOJE ZAŁOŻENIE — моё допущение). Значение подсказывает контекст." }
  - { kind: false-friend, text: "Не «заложение» и не «залог»: залог по-польски — ZASTAW, KAUCJA. Русское «заложить» обычно не совпадает с ZAŁOŻYĆ, которое чаще значит «основать» или «надеть»." }
  - { kind: government, text: "Устойчиво: WYCHODZIĆ Z ZAŁOŻENIA, ŻE… — «исходить из того, что…»; Z ZAŁOŻENIA — «по определению, изначально»; W ZAŁOŻENIU — «по замыслу, в теории»." }
  - { kind: pronunciation, text: "Читается «зауожэ́нье»: Ł — «у», Ż — «ж». Родительный множественного — ZAŁOŻEŃ «зауо́жэнь»." }
collocations:
  - { pl: "wychodzić z założenia, że…", ru: "исходить из того, что…" }
  - { pl: "podstawowe założenia", ru: "основные принципы" }
  - { pl: "założenie firmy", ru: "открытие фирмы" }
  - { pl: "z założenia", ru: "по определению, изначально" }
family:
  - { pl: "założyć", ru: "основать; надеть; предположить", relation: root, id: zalozyc }
  - { pl: "zakładać", ru: "основывать; надевать; предполагать", relation: root, id: zakladac }
  - { pl: "założyciel", ru: "основатель", relation: derived }
  - { pl: "zakład", ru: "предприятие; пари", relation: root, id: zaklad }
etymology: "Отглагольное существительное от ZAŁOŻYĆ (ZA- + ŁOŻYĆ «класть»); тот же корень, что в русских «заложить», «положение»."
memory: "Założenie — всё, что можно założyć: фирму (основание), очки (надевание), мысль в основу рассуждения (допущение)."
idioms:
  - { pl: "wychodzić z założenia, że…", ru: "исходить из того, что…" }
  - { pl: "w założeniu", ru: "по замыслу, теоретически" }
