# review
id: odbierac
format: 2
lemma: "odbierać"
rank: 1369
pos: verb
aspect: imperf
aspectPair: odebrac
pron: { cyr: "одбе́раць" }
senses:
  - id: answer-phone
    ru: "брать трубку, отвечать на звонок"
    examples:
      - pl: "Nie odbiera telefonu."
        ru: "Он не берёт трубку."
        source: { kind: translated, id: 5105335 }
      - pl: "Tom, nie odbierasz ode mnie telefonów."
        ru: "Том, ты не отвечаешь на мои звонки."
        source: { kind: translated, id: 6157226 }
  - id: collect
    ru: "забирать, получать (посылку, ребёнка из школы)"
    examples:
      - pl: "Śmieci odbierane są trzy razy w tygodniu."
        ru: "Мусор вывозят три раза в неделю."
        source: { kind: translated, id: 3764954 }
      - pl: "Odbieram dzieci ze szkoły."
        ru: "Я забираю детей из школы."
        source: { kind: authored }
  - id: take-away
    ru: "отнимать, лишать"
    examples:
      - pl: "Czy zawsze złym jest odbierać ludzkie życie?"
        ru: "Всегда ли дурно отнимать человеческую жизнь?"
        source: { kind: translated, id: 1014373 }
      - pl: "Blask twoich oczu odbiera mi rozum!"
        ru: "Блеск твоих глаз лишает меня рассудка!"
        source: { kind: translated, id: 11111170 }
notes:
  - { kind: usage, text: "Несовершенный вид к odebrać. Самое частое употребление — odbierać telefon «брать трубку, отвечать на звонок»." }
  - { kind: government, text: "odbierać co (винительный) i od kogo: odbierać dzieci ze szkoły «забирать детей из школы». В значении «отнять у кого-то» лицо стоит в дательном: odebrać komuś prawo jazdy." }
  - { kind: usage, text: "Третье значение — «воспринимать»: odbierać coś jako obrazę «воспринимать что-то как оскорбление»." }
  - { kind: false-friend, text: "odbierać — это не «выбирать». «Выбирать» по-польски wybierać, разница в приставке od-/wy-, и корень у них общий, так что перепутать легко." }
collocations:
  - { pl: "odbierać telefon", ru: "брать трубку" }
  - { pl: "odbierać dzieci ze szkoły", ru: "забирать детей из школы" }
  - { pl: "odbierać paczkę", ru: "получать посылку" }
etymology: "Приставка od- «от» и -bierać, многократная основа от brać «брать» (праславянское *bьrati). Русское «отбирать» собрано из тех же частей."
memory: "odbierać — «забирать, отнимать», но чаще всего «брать трубку»: Nie odbiera telefonu «Он не берёт трубку». Совершенный вид — odebrać. И осторожнее с приставкой: «выбирать» — это wybierać."
idioms:
  - { pl: "odbierać telefon", ru: "брать трубку" }
  - { pl: "odbierać komuś mowę", ru: "лишать дара речи" }
  - { pl: "odbierać sobie życie", ru: "лишать себя жизни" }
