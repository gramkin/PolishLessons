etymology: "От ROSNĄĆ «расти», из праславянского *orsti, и это тот же корень, что в русских «расти», «растение», «рост», «урожай». Польское RO- отвечает здесь русскому РА-: ROSNĄĆ и «расти», ROSA и «роса», ROZWÓJ и «развитие». Суффикс -INA в польском образует названия единичных предметов из собирательного или отвлечённого понятия, как в SŁOMA и SŁOMINA, и в ROŚLINA он выделяет отдельный организм из общего роста. Русский для той же задачи взял отглагольное -ЕНИЕ и получил «растение». Так два языка от одного глагола пришли к одному понятию разными суффиксами, и единственное, что надо переучивать, — род: польское слово женское, русское среднее."
memory: "Устроено как русское «растение», только суффикс другой: roślina от rosnąć «расти», с -ina вместо -ение. Поэтому род меняется: ta roślina, женский, против среднего «растения». Родительный множественного roślin без окончания; дательный и местный совпадают в roślinie. Сочетание śl читается «сьль», два мягких подряд. Прилагательное roślinny — «растительный», собирательное roślinność — «растительность»."
