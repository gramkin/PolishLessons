notes:
  - { kind: false-friend, text: "Значение то же, что у русского «растения», и устроены два слова почти одинаково: ROŚLINA от ROSNĄĆ «расти», как «растение» от «расти». Корень общий, праславянское *orsti, и польское RO- стоит на месте русского РА-, как в ROBOTA и «работе». Расходятся слова только суффиксом: польский взял -INA, русский — -ЕНИЕ. Поэтому угадать смысл легко, а форму нет: «растение» среднего рода, ROŚLINA женского, и TA ROŚLINA требует женского согласования. Прилагательное ROŚLINNY значит «растительный»: TŁUSZCZ ROŚLINNY «растительный жир»." }
  - { kind: government, text: "Женский род на -A. Винительный на -Ę: POSADZIĆ ROŚLINĘ. Родительный, дательный и местный единственного ROŚLINY, ROŚLINIE, ROŚLINIE — родительный на -Y, а дательный и местный совпадают в ROŚLINIE. Родительный множественного ROŚLIN, без окончания. Чего растение — родительный: ROŚLINA DONICZKOWA это уже прилагательное, а вот ROŚLINA Z NASION «растение из семян» идёт с предлогом Z. Где растёт — предлог W или NA с местным: ROŚLINA W DONICZCE, ROŚLINA NA PARAPECIE." }
  - { kind: pronunciation, text: "Читается «росьли́на», ударение на предпоследнем слоге из трёх. Буква Ś даёт «сь», и сочетание ŚL звучит «сьль» — два мягких согласных подряд, для русского непривычных. Буква L мягкая, как всегда. В дательном и местном ROŚLINIE буква N смягчается перед -IE: «росьли́не», и слогов становится четыре. В родительном множественного ROŚLIN два слога: «ро́сьлин», и ударение остаётся на предпоследнем, то есть на первом." }
  - { kind: usage, text: "Частотные сочетания: ROŚLINA DONICZKOWA «комнатное растение», ROŚLINA LECZNICZA «лекарственное растение», ROŚLINA OZDOBNA «декоративное растение», ROŚLINY UPRAWNE «культурные растения», TŁUSZCZ ROŚLINNY. Собирательное ROŚLINNOŚĆ означает растительность в целом, и суффикс -OŚĆ там тот же, что в POSIADŁOŚĆ. Глагол ROSNĄĆ значит и «расти» о растении, и «увеличиваться» о числах, как русское «расти»: CENY ROSNĄ «цены растут»." }
