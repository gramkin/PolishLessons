pos: noun
pron: { cyr: "выкопали́ска" }
senses:
  - id: excavations
    ru: "раскопки"
    examples:
      - pl: "Polscy archeolodzy prowadzą wykopaliska w Sudanie."
        ru: "Польские археологи ведут раскопки в Судане."
        source: { kind: translated, id: 880241 }
      - pl: "Wykopaliska trwają od maja."
        ru: "Раскопки идут с мая."
        source: { kind: authored }
      - pl: "Na wykopaliskach znaleziono monety."
        ru: "На раскопках нашли монеты."
        source: { kind: authored }
  - id: finds
    ru: "находки, откопанное"
    examples:
      - pl: "Wykopaliska trafiły do muzeum."
        ru: "Находки попали в музей."
        source: { kind: authored }
      - pl: "To cenne wykopaliska rzymskie."
        ru: "Это ценные римские находки."
        source: { kind: authored }
notes:
  - { kind: government, text: "Слово существует только во множественном числе — как wakacje «каникулы» или drzwi «дверь». Единственного числа у него в этом значении нет." }
  - { kind: usage, text: "prowadzić wykopaliska «вести раскопки» — стандартный оборот археологов." }
  - { kind: false-friend, text: "Русские «раскопки» тоже обычно во множественном, так что здесь языки ведут себя одинаково." }
  - { kind: usage, text: "Корень kopać «копать» — ср. русское «копать», «раскопки»." }
collocations:
  - { pl: "prowadzić wykopaliska", ru: "вести раскопки" }
  - { pl: "na wykopaliskach", ru: "на раскопках" }
etymology: "От wykopać «выкопать», от kopać «копать»; русское «раскопки» образовано от того же корня."
memory: "wykopaliska — «раскопки», и слово существует только во множественном числе, как wakacje «каникулы». Корень kopać «копать»."
