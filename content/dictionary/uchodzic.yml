formExamples:
  - form: "uchodzi"
    pl: "Uchodzi za studenta."
    ru: "Он слывёт студентом."
    source: { kind: translated, id: 919807 }
  - form: "uchodzi"
    pl: "On w naszym społeczeństwie uchodzi za uczonego."
    ru: "В нашем обществе он слывёт учёным."
    source: { kind: translated, id: 739267 }
  - form: "uchodzi"
    pl: "On wygląda młodo jak na swój wiek, więc uchodzi za studenta."
    ru: "Он выглядит молодо для своих лет, поэтому слывёт студентом."
    source: { kind: translated, id: 2629532 }
  - form: "uchodzić"
    pl: "Nie powinny uchodzić mu na sucho takie rzeczy jak oszukiwanie ludzi."
    ru: "Такие вещи, как обман людей, не должны сходить ему с рук."
    source: { kind: translated, id: 415355 }
  - form: "uchodzić"
    pl: "Nie chce uchodzić za naiwnego."
    ru: "Он не хочет слыть наивным."
    source: { kind: authored }
  - form: "uchodzić"
    pl: "Zaczęło uchodzić powietrze."
    ru: "Воздух начал выходить."
    source: { kind: authored }
  - form: "uchodził"
    pl: "Uchodził za znawcę."
    ru: "Он слыл знатоком."
    source: { kind: authored }
  - form: "uchodził"
    pl: "Długo uchodził za zaginionego."
    ru: "Он долго считался пропавшим."
    source: { kind: authored }
  - form: "uchodził"
    pl: "Gaz uchodził przez szczelinę."
    ru: "Газ выходил через щель."
    source: { kind: authored }
  - form: "uchodziło"
    pl: "Jeszcze w średniowieczu mleko uchodziło za lek."
    ru: "Ещё в средние века молоко считалось лекарством."
    source: { kind: translated, id: 746136 }
  - form: "uchodziło"
    pl: "Balon powoli opadał, w miarę jak uchodziło z niego powietrze."
    ru: "Шар медленно опускался по мере того, как из него выходил воздух."
    source: { kind: translated, id: 361185 }
  - form: "uchodziło"
    pl: "Dawniej uchodziło to za nieprzyzwoite."
    ru: "Прежде это считалось неприличным."
    source: { kind: authored }
