# review
id: uchodzic
format: 2
lemma: "uchodzić"
rank: 2409
pos: verb
aspect: imperf
pron: { cyr: "ухо́дзиць" }
senses:
  - id: pass-for
    ru: "слыть, считаться (кем-л.)"
    examples:
      - pl: "Uchodzi za studenta."
        ru: "Он слывёт студентом."
        source: { kind: translated, id: 919807 }
      - pl: "On w naszym społeczeństwie uchodzi za uczonego."
        ru: "В нашем обществе он слывёт учёным."
        source: { kind: translated, id: 739267 }
      - pl: "Jeszcze w średniowieczu mleko uchodziło za lek."
        ru: "Ещё в средние века молоко считалось лекарством."
        source: { kind: translated, id: 746136 }
  - id: escape-leak
    ru: "выходить, улетучиваться; сходить с рук"
    examples:
      - pl: "Balon powoli opadał, w miarę jak uchodziło z niego powietrze."
        ru: "Шар медленно опускался по мере того, как из него выходил воздух."
        source: { kind: translated, id: 361185 }
      - pl: "Nie powinny uchodzić mu na sucho takie rzeczy jak oszukiwanie ludzi."
        ru: "Такие вещи, как обман людей, не должны сходить ему с рук."
        source: { kind: translated, id: 415355 }
notes:
  - { kind: government, text: "Слыть кем-л. — uchodzić ZA kogoś, с предлогом za и ВИНИТЕЛЬНЫМ падежом. Русское «слыть» берёт творительный без предлога, так что конструкция расходится полностью." }
  - { kind: false-friend, text: "u- + chodzić «ходить». Русское «уходить» — то же слово, но польское uchodzić в этом прямом смысле почти не употребляется: «уходить» — wychodzić или odchodzić." }
  - { kind: usage, text: "Оборот ujść na sucho «сойти с рук» — буквально «выйти сухим». Uchodzić komuś na sucho «сходить кому-л. с рук»." }
  - { kind: usage, text: "Отсюда uchodźca «беженец» — тот, кто уходит. Совершенный вид — ujść." }
  - { kind: government, text: "Глагол непереходный, поэтому страдательных причастий у него нет: формы вида uchodzony образованы генератором по ошибке." }
collocations:
  - { pl: "uchodzić za kogoś", ru: "слыть кем-л." }
  - { pl: "ujść na sucho", ru: "сойти с рук" }
etymology: "u- + chodzić «ходить». Отсюда uchodźca «беженец». Русское «уходить» — то же слово, но смысл разошёлся."
memory: "uchodzić — «слыть», и конструкция своя: uchodzić ZA kogoś, с винительным, а не с творительным как в русском. Ujść na sucho — «сойти с рук»."
idioms:
  - { pl: "uchodzić za kogoś", ru: "слыть кем-л." }
  - { pl: "ujść na sucho", ru: "сойти с рук" }
