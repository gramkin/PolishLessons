  - { pl: "poważać", ru: "уважать, почитать", relation: root }
etymology: "От WAGA «вес», слова, пришедшего из средневерхненемецкого WAGE и давшего в русском областную «вагу» и, через неё, «важный». Метафора в обоих языках одна: серьёзное это весомое, тяжёлое, а несерьёзное легковесно. Польский от этого корня произвёл POWAGA, POWAŻNY и POWAŻAĆ «уважать», русский — «важный», «отважный» и «уважать». Так что всё гнездо узнаётся, если держаться за вес."
memory: "Держитесь за вес: powaga идёт от waga «вес», и серьёзность здесь это весомость, точно как русское «важный» от «ваги». Поэтому poważny это «серьёзный», а poważać значит «уважать», как и наше слово. Второе значение о человеке: być powagą значит «быть авторитетом». В дательном и местном g переходит в dz: w powadze. Читается «пова́га», оба o отчётливо."
idioms:
  - { pl: "z całą powagą", ru: "со всей серьёзностью" }
