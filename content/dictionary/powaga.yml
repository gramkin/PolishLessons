notes:
  - { kind: false-friend, text: "Образ в основе тот же, что в русском, только слово другое. POWAGA идёт от WAGA «вес»: серьёзность это весомость. Русский построил «важный» точно так же, от «ваги», и говорит «веские слова», «весомый довод». Так что POWAGA и «важность» это одна и та же метафора, выраженная двумя разными словами. Второе значение, об авторитетном человеке, русский передаёт словом «авторитет» или «величина»." }
  - { kind: usage, text: "Десять форм, женский род. В дательном и местном падеже единственного числа G переходит в DZ: POWAGA, но W POWADZE. Это то же чередование, что в NOGA — NODZE и POTĘGA — POTĘDZE. Второе значение, о человеке, работает почти всегда во множественном: POWAGI NAUKOWE, и такое употребление прилагательного к человеку для польского обычно." }
  - { kind: government, text: "Со всей серьёзностью — Z CAŁĄ POWAGĄ, предлог Z с творительным, и русский строит оборот так же. Сохранять серьёзность — ZACHOWAĆ POWAGĘ, винительный без предлога. Быть авторитетом — BYĆ POWAGĄ, творительный после BYĆ, как и в русском «быть авторитетом». Дело большой важности — SPRAWA WIELKIEJ POWAGI, родительный без предлога." }
  - { kind: pronunciation, text: "Читается «пова́га», три слога, ударение на втором. Все звуки простые, оба O произносятся отчётливо, без редукции в «а». В дательном и местном падеже POWADZE сочетание DZ даёт слитное «дз», и слышно «пова́дзе». В прилагательном POWAŻNY буква Ż даёт «ж»: «пова́жны», и это слово русский узнаёт сразу по «важному»." }
  - { kind: register, text: "Слово нейтральное, частое в официальной и газетной речи: POWAGA SYTUACJI, POWAGA URZĘDU «авторитет учреждения», SPRAWA WIELKIEJ POWAGI. Оборот Z CAŁĄ POWAGĄ произносят, когда хотят, чтобы слова прозвучали весомо. Выражение ZACHOWAĆ POWAGĘ значит не рассмеяться там, где смеяться нельзя, и в этом смысле оно совершенно разговорное." }
