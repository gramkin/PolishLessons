notes:
  - { kind: usage, text: "Десять форм, женский род. В дательном и местном падежах K переходит в C: W BECZCE, NA BECZCE. В родительном множественного появляется беглое E: BECZEK. Пиво из бочки, PIWO Z BECZKI, — это просто разливное пиво." }
  - { kind: government, text: "В бочке — W BECZCE, местный падеж. Из бочки — Z BECZKI, родительный. Сидеть на пороховой бочке — SIEDZIEĆ NA BECZCE PROCHU: местный после NA, а «пороховая» передаётся родительным PROCHU, «бочка пороха»." }
  - { kind: pronunciation, text: "Читается «бэ́чка», два слога, ударение на первом. E после B звучит твёрдо, «э», а CZ даёт «ч». В форме BECZCE подряд идут CZ и C, и выговаривать надо оба звука, «ч» и «ц»." }
  - { kind: register, text: "Слово бытовое. Устойчивые обороты понятны русскому: BECZKA BEZ DNA — «бездонная бочка», о деле, которое поглощает деньги. А BECZKA ŚMIECHU — не бочка, а море смеха: TO BYŁA BECZKA ŚMIECHU — «вот уж обхохотались». Разговорно BECZKĄ грубовато называют толстяка." }
collocations:
  - { pl: "beczka piwa", ru: "бочка пива" }
  - { pl: "beczka wina", ru: "бочка вина" }
  - { pl: "piwo z beczki", ru: "разливное пиво" }
family:
  - { pl: "beczułka", ru: "бочонок", relation: derived }
  - { pl: "beczkowy", ru: "бочковой", relation: derived }
  - { pl: "beczkowóz", ru: "бочка-цистерна, водовоз", relation: derived }
etymology: "Слово праславянское, общее с русским «бочка». Польское E на месте русского О — след древнего краткого гласного, который в двух языках прояснился по-разному, как в SEN и «сон». Отсюда и уменьшительное BECZUŁKA, наш «бочонок»."
memory: "Beczka — «бочка»: польское e на месте русского о, как sen и «сон». Читается «бэ́чка», в местном падеже w beczce. Piwo z beczki — разливное пиво. Beczka bez dna — бездонная бочка, а beczka śmiechu — обхохочешься."
idioms:
  - { pl: "beczka bez dna", ru: "бездонная бочка" }
  - { pl: "beczka śmiechu", ru: "море смеха, обхохочешься" }
  - { pl: "siedzieć na beczce prochu", ru: "сидеть на пороховой бочке" }
