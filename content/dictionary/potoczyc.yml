# review
id: potoczyc
format: 2
lemma: "potoczyć"
rank: 4871
pos: verb
pron: { cyr: "пото́чыць" }
senses:
  - id: roll
    ru: "покатить (что-то); с SIĘ — покатиться"
    examples:
      - pl: "Potoczył beczkę pod ścianę."
        ru: "Он покатил бочку к стене."
        source: { kind: authored }
      - pl: "Piłka potoczyła się pod samochód."
        ru: "Мяч покатился под машину."
        source: { kind: authored }
      - pl: "Moneta potoczyła się po podłodze."
        ru: "Монета покатилась по полу."
        source: { kind: authored }
  - id: unfold
    ru: "с SIĘ — пойти, сложиться (о событиях)"
    examples:
      - pl: "Wszystko potoczyło się inaczej, niż planowaliśmy."
        ru: "Всё пошло не так, как мы планировали."
        source: { kind: authored }
      - pl: "Rozmowa potoczyła się w złym kierunku."
        ru: "Разговор пошёл в плохом направлении."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "POTOCZYĆ — «покатить», а не «поточить». «Наточить нож» по-польски — NAOSTRZYĆ NÓŻ. А TOCZYĆ без приставки значит ещё «вести»: TOCZYĆ WOJNĘ, TOCZYĆ ROZMOWĘ, но POTOCZYĆ с ними не сочетается." }
  - { kind: usage, text: "Пятьдесят две формы: страдательное POTOCZONY — о бочках и камнях; форма для мужчин-людей POTOCZENI в карточку не включена. Чаще всего глагол встречается с SIĘ: SPRAWY POTOCZYŁY SIĘ SZYBKO — «дела пошли быстро». Несовершенный вид — TOCZYĆ." }
  - { kind: government, text: "Что — винительный: POTOCZYĆ KAMIEŃ. Куда — POD, DO, NA с винительным: POTOCZYĆ SIĘ POD STÓŁ. По чему — PO с предложным: PO PODŁODZE. POTOCZYĆ WZROKIEM — творительный: «обвести взглядом»." }
  - { kind: pronunciation, text: "Читается «пото́чыць»: CZY — твёрдое «чы», ударение на предпоследнем слоге. POTOCZĘ — «пото́чэ»." }
  - { kind: register, text: "В прямом смысле — нейтральное. JAK SIĘ SPRAWY POTOCZĄ — частая разговорная формула «как пойдут дела». POTOCZYĆ WZROKIEM — книжное, из прозы." }
collocations:
  - { pl: "potoczyć się pod stół", ru: "закатиться под стол" }
  - { pl: "sprawy potoczyły się szybko", ru: "события развивались быстро" }
  - { pl: "potoczyć beczkę", ru: "покатить бочку" }
family:
  - { pl: "toczyć", ru: "катить; вести (войну, спор)", relation: root, id: toczyc }
  - { pl: "potoczny", ru: "разговорный, обиходный", relation: derived }
  - { pl: "toczyć się", ru: "катиться; идти, вестись", relation: derived }
etymology: "Приставка PO- плюс TOCZYĆ «катить», праславянское *točiti «катить, лить», родственное «течь». Русское «точить» и «поток» из того же гнезда, но значение «катить» сохранилось только в польском."
memory: "Potoczyć — покатить: piłka potoczyła się pod auto. Sprawy potoczyły się inaczej — всё пошло иначе. Читается «пото́чыць»."
idioms:
  - { pl: "potoczyć wzrokiem", ru: "обвести взглядом" }
formExamplesSkip:
  - { form: "potoczeni", reason: "людей не катят: формы для мужчин-людей нет" }
