# review
id: sprawdzic
format: 2
lemma: "sprawdzić"
rank: 269
pos: verb
aspect: perf
pron: { cyr: "спра́вдзиць" }
senses:
  - id: check
    ru: "проверить"
    examples:
      - pl: "Trzeba nam będzie to sprawdzić."
        ru: "Нам надо будет это проверить."
        source: { kind: tatoeba, id: 6313943 }
      - pl: "Nie mogę sprawdzić poczty, bo serwer padł."
        ru: "Не могу проверить почту, потому что сервер упал."
        source: { kind: tatoeba, id: 357389 }
      - pl: "Przepraszam, ale proszę jeszcze raz sprawdzić zapięcie pasów."
        ru: "Извините за беспокойство, но проверьте ещё раз, застёгнуты ли ремни."
        source: { kind: tatoeba, id: 355453 }
  - id: come-true
    ru: "sprawdzić się — оправдаться, сбыться"
    note: "Przewidywania się sprawdziły — «Предсказания сбылись»."
    examples:
      - pl: "Sprawdźcie u Tomka."
        ru: "Проверьте у Тома."
        source: { kind: tatoeba, id: 3460730 }
      - pl: "Nie wierzysz - możesz sprawdzić w Google'u."
        ru: "Не веришь - можешь погуглить."
        source: { kind: tatoeba, id: 12574279 }
      - pl: "To zdanie wymaga sprawdzenia przez rodowitego użytkownika."
        ru: "Это предложение нуждается в проверке носителем языка."
        source: { kind: tatoeba, id: 2060236 }
notes:
  - { kind: usage, text: "Внутри слова спрятана prawda: sprawdzić значит «установить правду». Русское «справить» — другого корня." }
  - { kind: usage, text: "Возвратное sprawdzić się значит «оправдаться, сбыться»: Jego przewidywania się sprawdziły." }
  - { kind: usage, text: "Несовершенный вид — sprawdzać: Sprawdzam pocztę co rano." }
  - { kind: usage, text: "sprawdzić coś w słowniku — «посмотреть что-то в словаре»; sprawdzian — «контрольная работа»." }
collocations:
  - { pl: "sprawdzić pocztę", ru: "проверить почту" }
  - { pl: "sprawdzić w słowniku", ru: "посмотреть в словаре" }
  - { pl: "sprawdź to", ru: "проверь это" }
  - { pl: "sprawdzić się", ru: "оправдать себя, оказаться удачным; сбыться" }
etymology: "Из s- + prawdzić, от prawda «правда»: проверить — значит установить правду. Тот же корень, что в русских «правда», «правильный»."
memory: "sprawdzić — «проверить», и внутри спрятана prawda: проверить значит установить правду. А sprawdzić się — «оправдаться, сбыться»."
idioms:
  - { pl: "sprawdzić w słowniku", ru: "посмотреть в словаре" }
  - { pl: "sprawdzić się", ru: "оправдать себя, оказаться удачным; сбыться" }
  - { pl: "sprawdzić pocztę", ru: "проверить почту" }
