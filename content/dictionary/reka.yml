# review
id: reka
format: 2
lemma: "ręka"
rank: 209
pos: noun
pron: { cyr: "рэ́нка" }
senses:
  - id: hand
    ru: "рука, кисть"
    examples:
      - pl: "Myję ręce."
        ru: "Я мою руки."
        source: { kind: tatoeba, id: 1014379 }
      - pl: "Daj mi rękę."
        ru: "Дай мне руку."
        source: { kind: tatoeba, id: 4872975 }
      - pl: "Wymyłaś ręce?"
        ru: "Ты помыла руки?"
        source: { kind: tatoeba, id: 1350501 }
  - id: hands
    ru: "руки (в оборотах и при действиях)"
    examples:
      - pl: "Umył ręce."
        ru: "Он умыл руки."
        source: { kind: tatoeba, id: 2145972 }
      - pl: "Jem rękami."
        ru: "Я ем руками."
        source: { kind: tatoeba, id: 6315426 }
      - pl: "Myliśmy ręce."
        ru: "Мы мыли руки."
        source: { kind: tatoeba, id: 12478508 }
notes:
  - { kind: usage, text: "У слова есть застывшая форма w ręku «в руке» — она отличается от обычного местного падежа w ręce." }
  - { kind: usage, text: "Творительный множественного бывает двойной: rękami (обычный) и rękoma (архаичный, живёт в устойчивых оборотах)." }
  - { kind: usage, text: "ręka обозначает и всю руку, и кисть; плечо и предплечье — ramię." }
collocations:
  - { pl: "pod ręką", ru: "под рукой" }
  - { pl: "w ręku", ru: "в руке" }
  - { pl: "dać rękę", ru: "дать руку" }
  - { pl: "ręka w rękę", ru: "рука об руку" }
etymology: "Праславянское *rǫka — то же слово, что русское «рука»; носовой звук сохранился в польском ę."
memory: "Две особенности: застывшее w ręku «в руке» и двойной творительный множественного — rękami и rękoma. А mieć coś pod ręką — «иметь под рукой»."
idioms:
  - { pl: "ręka rękę myje", ru: "рука руку моет" }
  - { pl: "brać w swoje ręce", ru: "брать в свои руки" }
  - { pl: "być na rękę", ru: "быть на руку" }
formExamplesSkip:
  - { form: "ręko", reason: "звательный падеж от этого существительного встречается только в поэзии" }
