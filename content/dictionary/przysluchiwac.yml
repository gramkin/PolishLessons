# review
id: przysluchiwac
format: 2
lemma: "przysłuchiwać"
rank: 5841
pos: verb
aspect: imperf
pron: { cyr: "пшысуухи́ваць" }
senses:
  - id: listen-in
    ru: "прислушиваться, слушать (со стороны)"
    note: "Только с się и дательным падежом: przysłuchiwać się komuś, czemuś."
    examples:
      - pl: "Przysłuchiwaliśmy się jej przez jakiś czas."
        ru: "Мы какое-то время прислушивались к ней."
        source: { kind: translated, id: 608334 }
      - pl: "Dziecko przysłuchiwało się rozmowie dorosłych."
        ru: "Ребёнок прислушивался к разговору взрослых."
        source: { kind: authored }
      - pl: "Kot przysłuchuje się szelestom w ogrodzie."
        ru: "Кот прислушивается к шорохам в саду."
        source: { kind: authored }
  - id: attend
    ru: "присутствовать в качестве слушателя, наблюдать"
    examples:
      - pl: "Dziennikarze przysłuchiwali się obradom sejmu."
        ru: "Журналисты присутствовали на заседании сейма."
        source: { kind: authored }
      - pl: "Na rozprawie przysłuchuje się kilku studentów prawa."
        ru: "На слушании присутствуют несколько студентов-юристов."
        source: { kind: authored }
      - pl: "Rodzice mogą przysłuchiwać się lekcji."
        ru: "Родители могут присутствовать на уроке."
        source: { kind: authored }
notes:
  - { kind: government, text: "Только с SIĘ и дательным падежом без предлога: PRZYSŁUCHIWAĆ SIĘ ROZMOWIE «прислушиваться к разговору». Русское «к» по-польски не нужно: не *DO ROZMOWY, а ROZMOWIE." }
  - { kind: usage, text: "Несовершенный вид; совершенный — PRZYSŁUCHAĆ SIĘ «прислушаться». Спряжение с чередованием -IWA- / -U-: PRZYSŁUCHIWAĆ — PRZYSŁUCHUJĘ, PRZYSŁUCHUJESZ, PRZYSŁUCHUJĄ. Страдательных причастий у возвратного глагола нет." }
  - { kind: false-friend, text: "Значит не только «прислушиваться», но и «слушать со стороны, присутствовать, не участвуя»: PRZYSŁUCHIWAĆ SIĘ OBRADOM — «присутствовать на заседании». Для «прислушаться к совету» поляк скажет POSŁUCHAĆ RADY или WZIĄĆ POD UWAGĘ." }
  - { kind: pronunciation, text: "Читается «пшысуухи́ваць»: PRZ — «пш», Ł перед U — «у», ударение на предпоследнем слоге, на HI." }
collocations:
  - { pl: "przysłuchiwać się rozmowie", ru: "прислушиваться к разговору" }
  - { pl: "przysłuchiwać się obradom", ru: "присутствовать на заседании" }
  - { pl: "przysłuchiwać się w milczeniu", ru: "молча слушать" }
family:
  - { pl: "przysłuchać się", ru: "прислушаться", relation: aspect }
  - { pl: "słuchać", ru: "слушать", relation: root, id: sluchac }
  - { pl: "słuch", ru: "слух", relation: root, id: sluch }
  - { pl: "przysłuchiwanie się", ru: "прислушивание, присутствие слушателем", relation: derived }
etymology: "Приставка PRZY- плюс SŁUCHAĆ «слушать», с суффиксом несовершенного вида -IWA-; ровно как русское «при-слуш-ивать-ся»."
memory: "Przysłuchiwać się = прислушиваться: та же приставка, тот же корень. Только без «к»: przysłuchuję się rozmowie."
idioms:
