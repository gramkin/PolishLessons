# review
id: czesc-noun
format: 2
lemma: "część"
rank: 344
pos: noun
pron: { cyr: "чэнщць" }
senses:
  - id: part
    ru: "часть"
    examples:
      - pl: "Nie lubię tej części miasta."
        ru: "Мне не нравится эта часть города."
        source: { kind: tatoeba, id: 7114679 }
      - pl: "Większą część dnia spędziła w szpitalu."
        ru: "Большую часть дня она провела в больнице."
        source: { kind: tatoeba, id: 3756828 }
      - pl: "Wychowałem się we wschodniej części Bostonu."
        ru: "Я вырос в восточной части Бостона."
        source: { kind: tatoeba, id: 970515 }
  - id: portion
    ru: "часть (доля, в составе целого)"
    examples:
      - pl: "Rosja jest częścią Europy czy Azji?"
        ru: "Россия - это часть Европы или Азии?"
        source: { kind: tatoeba, id: 5993163 }
      - pl: "Część posłów oskarżyła prezydenta o masowe mordy."
        ru: "Часть парламентариев обвинила президента в массовых убийствах."
        source: { kind: tatoeba, id: 3243624 }
      - pl: "Małpy spędzają znaczną część swojego czasu skacząc z gałęzi na gałąź."
        ru: "Обезьяны проводят значительную часть своего времени, прыгая с ветки на ветку."
        source: { kind: tatoeba, id: 6313989 }
notes:
  - { kind: false-friend, text: "Не путайте część «часть» и cześć «привет, честь». Различает только носовой: część с ę, cześć с e." }
  - { kind: usage, text: "po części — «отчасти», w części — «частично», większa część — «большая часть»." }
  - { kind: usage, text: "część zamienna — «запчасть»; części mowy — «части речи»." }
collocations:
  - { pl: "część miasta", ru: "часть города" }
  - { pl: "większa część", ru: "большая часть" }
  - { pl: "po części", ru: "отчасти" }
  - { pl: "część zamienna", ru: "запчасть" }
etymology: "Праславянское *čęstь — то же слово, что русское «часть»; носовой ę и отличает его от cześć «привет, честь»."
memory: "część — «часть», а cześć — «привет». Различает только носовой: część с ę, cześć с e."
idioms:
  - { pl: "lwia część", ru: "львиная доля" }
  - { pl: "po części", ru: "отчасти" }
  - { pl: "części mowy", ru: "части речи" }
