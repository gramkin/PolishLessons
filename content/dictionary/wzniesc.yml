# review
id: wzniesc
format: 2
lemma: "wznieść"
rank: 4517
pos: verb
pron: { cyr: "взнесьць" }
senses:
  - id: raise
    ru: "поднять (руки, бокал); WZNIEŚĆ TOAST — поднять тост"
    examples:
      - pl: "Wzniósł toast za przyjaciół."
        ru: "Он поднял тост за друзей."
        source: { kind: authored }
      - pl: "Wznieśmy kieliszki!"
        ru: "Поднимем бокалы!"
        source: { kind: authored }
      - pl: "Kibice wznieśli okrzyk radości."
        ru: "Болельщики издали радостный крик."
        source: { kind: authored }
  - id: erect
    ru: "воздвигнуть, построить"
    examples:
      - pl: "Miasto wzniosło pomnik ofiarom."
        ru: "Город воздвиг памятник жертвам."
        source: { kind: authored }
      - pl: "Katedra została wzniesiona w średniowieczu."
        ru: "Собор был построен в Средние века."
        source: { kind: authored }
  - id: ascend
    ru: "с SIĘ — подняться, взлететь"
    examples:
      - pl: "Samolot wzniósł się w powietrze."
        ru: "Самолёт поднялся в воздух."
        source: { kind: authored }
      - pl: "Ptaki wzniosły się w niebo."
        ru: "Птицы взмыли в небо."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "WZNIEŚĆ — «поднять, воздвигнуть», а не «внести» (WNIEŚĆ). WZNIEŚĆ TOAST — «поднять тост», WZNIEŚĆ POMNIK — «воздвигнуть памятник». WZNIESIENIE — ещё и «возвышенность, холм»." }
  - { kind: usage, text: "Прошедшее мужского рода — WZNIÓSŁ, с Ó, и так же условное WZNIÓSŁBY; WZNIOSŁA, WZNIOSŁEM, WZNIEŚLI — с O или IE. Будущее: WZNIOSĘ, WZNIESIESZ, повелительное WZNIEŚ. Деепричастие — WZNIÓSŁSZY. Несовершенный вид — WZNOSIĆ." }
  - { kind: government, text: "Что — винительный: WZNIEŚĆ KIELISZEK, POMNIK. За кого — ZA с винительным: WZNIEŚĆ TOAST ZA MŁODĄ PARĘ. С SIĘ — куда: W POWIETRZE, PONAD CHMURY." }
  - { kind: pronunciation, text: "WZNIEŚĆ — один слог, «взнесьць». WZNIOSĘ — «взнё́сэ», WZNIÓSŁ — «взнюсу»." }
  - { kind: register, text: "Книжное и торжественное слово. В быту говорят PODNIEŚĆ, ZBUDOWAĆ. WZNIEŚĆ SIĘ PONAD COŚ — образное «подняться над чем-то»." }
collocations:
  - { pl: "wznieść toast", ru: "поднять тост" }
  - { pl: "wznieść pomnik", ru: "воздвигнуть памятник" }
  - { pl: "wznieść się w powietrze", ru: "подняться в воздух" }
family:
  - { pl: "nieść", ru: "нести", relation: root, id: niesc }
  - { pl: "podnieść", ru: "поднять", relation: derived, id: podniesc }
  - { pl: "wznosić", ru: "поднимать; воздвигать", relation: aspect }
etymology: "Приставка WZ- «вз-» плюс NIEŚĆ «нести», праславянское *nesti. Русское «вознести», «вознесение» — то же строение."
memory: "Wznieść toast — поднять тост. Wznieść pomnik — воздвигнуть памятник. Wzniósł się — поднялся. Читается «взнесьць»."
idioms:
  - { pl: "wznieść się na wyżyny", ru: "подняться на высоту, превзойти себя" }
formExamplesSkip:
  - { form: "wzniesieni", reason: "формы для мужчин-людей нет" }
