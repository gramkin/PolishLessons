# review
id: poszczescic
format: 2
lemma: "poszczęścić"
rank: 4940
pos: verb
pron: { cyr: "пошчэ́ньсьциць" }
senses:
  - id: be-lucky
    ru: "посчастливиться, повезти"
    examples:
      - pl: "Poszczęściło mi się na egzaminie."
        ru: "Мне повезло на экзамене."
        source: { kind: authored }
      - pl: "Może tym razem nam się poszczęści."
        ru: "Может, на этот раз нам повезёт."
        source: { kind: authored }
      - pl: "Nie każdemu może się tak poszczęścić."
        ru: "Не каждому может так посчастливиться."
        source: { kind: authored }
  - id: succeed
    ru: "повезти в чём-то (в делах, в жизни)"
    examples:
      - pl: "Poszczęściło mu się w interesach, choć nikt w to nie wierzył."
        ru: "Ему повезло в делах, хотя никто в это не верил."
        source: { kind: authored }
      - pl: "Jeśli się poszczęści, wrócimy przed zmrokiem."
        ru: "Если повезёт, вернёмся до темноты."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "POSZCZĘŚCIĆ SIĘ — «посчастливиться», «повезти». Русское «счастье» и польское SZCZĘŚCIE — одно слово, но польское значит прежде всего «удача, везение»: MIEĆ SZCZĘŚCIE «везти». Повседневный синоним — UDAĆ SIĘ или разговорное MIEĆ FARTA." }
  - { kind: usage, text: "Безличный глагол, всегда с SIĘ: POSZCZĘŚCIŁO SIĘ, POSZCZĘŚCI SIĘ, POSZCZĘŚCIŁOBY SIĘ. Живых форм четыре; личные формы в словарях есть, но в речи не встречаются и в карточку не включены. Несовершенный вид — SZCZĘŚCIĆ SIĘ, почти исключительно в приветствии SZCZĘŚĆ BOŻE." }
  - { kind: government, text: "Кому повезло — дательный: POSZCZĘŚCIŁO MI SIĘ. В чём — W с предложным: POSZCZĘŚCIŁO MU SIĘ W ŻYCIU. С чем — Z с творительным: POSZCZĘŚCIŁO MI SIĘ Z POGODĄ «мне повезло с погодой»." }
  - { kind: pronunciation, text: "Читается «пошчэ́ньсьциць»: SZCZ — «шч», Ę перед Ś — носовое «энь», ŚĆ — «сьць». Ударение на предпоследнем слоге. POSZCZĘŚCIŁO — «пошчэньсьци́уо»." }
  - { kind: register, text: "Нейтральное, чуть книжное слово. В разговоре чаще MIEĆ SZCZĘŚCIE: MIAŁEM SZCZĘŚCIE «мне повезло»." }
collocations:
  - { pl: "poszczęściło mi się", ru: "мне повезло" }
  - { pl: "jeśli się poszczęści", ru: "если повезёт" }
  - { pl: "poszczęściło się w życiu", ru: "повезло в жизни" }
family:
  - { pl: "szczęście", ru: "удача, счастье", relation: root, id: szczescie }
  - { pl: "szczęśliwy", ru: "счастливый", relation: derived, id: szczesliwy }
  - { pl: "pech", ru: "невезение", relation: antonym, id: pech }
etymology: "Приставка PO- плюс SZCZĘŚCIĆ «даровать удачу», от SZCZĘŚCIE, праславянское *sъčęstьje «доля, удел». Русское «посчастливиться» построено так же."
memory: "Poszczęścić się — посчастливиться: poszczęściło mi się. Кому — дательный, как в русском. Szczęście — прежде всего удача."
idioms:
  - { pl: "szczęść Boże", ru: "бог в помощь (традиционное приветствие)" }
