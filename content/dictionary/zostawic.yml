# review
id: zostawic
format: 2
lemma: "zostawić"
rank: 183
pos: verb
aspect: perf
pron: { cyr: "зоста́виць" }
senses:
  - id: leave-behind
    ru: "оставить (что-либо где-либо)"
    examples:
      - pl: "Zostaw jedzenie na stole."
        ru: "Оставь еду на столе."
        source: { kind: tatoeba, id: 3616557 }
      - pl: "Musiałem zostawić je na biurku."
        ru: "Я, наверное, оставил их у себя на письменном столе."
        source: { kind: tatoeba, id: 10115280 }
      - pl: "Zostaw miejsce pomiędzy liniami."
        ru: "Оставь место между линиями."
        source: { kind: tatoeba, id: 1353789 }
  - id: leave-alone
    ru: "оставить в покое; бросить (кого-либо)"
    examples:
      - pl: "Zostaw mnie w spokoju!"
        ru: "Оставь меня в покое!"
        source: { kind: tatoeba, id: 691979 }
      - pl: "Zostawcie borsuki w spokoju."
        ru: "Оставьте барсуков в покое."
        source: { kind: tatoeba, id: 6155758 }
      - pl: "Zostaw przeszłość za sobą."
        ru: "Оставь прошлое позади."
        source: { kind: tatoeba, id: 6154828 }
notes:
  - { kind: usage, text: "Не путайте zostawić и zostać: zostawić coś «оставить что-то» (переходный), zostać «остаться» (непереходный). Zostawiłem klucze «Я оставил ключи» — Zostałem w domu «Я остался дома»." }
  - { kind: usage, text: "Несовершенный вид — zostawiać: Zostawiam klucze pod wycieraczką «Оставляю ключи под ковриком»." }
  - { kind: usage, text: "zostawić w spokoju — «оставить в покое»: Zostaw mnie w spokoju!" }
collocations:
  - { pl: "zostawić w spokoju", ru: "оставить в покое" }
  - { pl: "zostawić wiadomość", ru: "оставить сообщение" }
  - { pl: "zostawić klucze", ru: "оставить ключи" }
  - { pl: "zostaw to", ru: "оставь это" }
etymology: "Приставка zo- + stawić «ставить»; ср. русское «оставить». Отсюда и несовершенный вид zostawiać."
memory: "Не путайте zostawić «оставить что-то» и zostać «остаться»: Zostawiłem klucze «Я оставил ключи», но Zostałem w domu «Я остался дома»."
idioms:
  - { pl: "zostawić w spokoju", ru: "оставить в покое" }
  - { pl: "zostawić na lodzie", ru: "бросить в беде" }
  - { pl: "nie zostawić suchej nitki", ru: "раскритиковать в пух и прах" }
