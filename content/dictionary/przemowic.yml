# review
id: przemowic
format: 2
lemma: "przemówić"
rank: 2742
pos: verb
pron: { cyr: "пшэму́виць" }
senses:
  - id: speak-up
    ru: "заговорить, выступить"
    examples:
      - pl: "Musiał przemówić pierwszy."
        ru: "Ему пришлось заговорить первым."
        source: { kind: authored }
      - pl: "Przemówił dopiero pod koniec zebrania."
        ru: "Он заговорил только к концу собрания."
        source: { kind: authored }
      - pl: "Dyrektor przemówi po obiedzie."
        ru: "Директор выступит после обеда."
        source: { kind: authored }
  - id: speech
    ru: "речь, выступление"
    examples:
      - pl: "Przemówienie trwało dwadzieścia minut."
        ru: "Речь длилась двадцать минут."
        source: { kind: authored }
      - pl: "Po przemówieniu zapadła cisza."
        ru: "После речи наступила тишина."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Форм сорок две, а не пятьдесят три, и не хватает ровно страдательного причастия — тех же одиннадцати форм, которых нет у troszczyć и odzywać. Причина та же: говорить можно, но «быть заговорённым» нельзя, объекта глагол не берёт. Важно, что przemówić совершенного вида, а те два несовершенного: значит разряд держится на переходности, а не на виде. Пара к нему — PRZEMAWIAĆ." }
  - { kind: pronunciation, text: "Буква ó стоит во всех формах: PRZEMÓW, przemówi, przemówię, przemówienie. Это ó корневое, из mówić, у которого оно есть всегда. Сравните pozdrowić: там POZDRÓW с ó, но pozdrowi с обычным o, потому что ó возникло от закрытия слога. Один знак, два разных источника, и различить их можно только по однокоренным словам." }
  - { kind: usage, text: "Корень MÓWIĆ отвечает русскому «молвить», и это стоит заметить: то, что у нас осталось высоким и устарелым, в польском служит повседневным словом для «говорить». Отглагольное существительное PRZEMÓWIENIE — обычное название речи, выступления: wygłosić przemówienie значит «произнести речь». Оборот PRZEMÓWIĆ KOMUŚ DO ROZSĄDKU означает «образумить кого-то»." }
collocations:
  - { pl: "przemówić do kogoś", ru: "обратиться к кому-то" }
  - { pl: "przemówić komuś do rozsądku", ru: "образумить кого-то" }
  - { pl: "wygłosić przemówienie", ru: "произнести речь" }
family:
  - { pl: "przemawiać", ru: "выступать", relation: aspect }
  - { pl: "przemówienie", ru: "речь", relation: derived }
  - { pl: "mówić", ru: "говорить", relation: root, id: mowic }
etymology: "Приставка prze- и глагол MÓWIĆ, из праславянского *mъlviti — то же слово, что русское «молвить». Русский отодвинул его в книжную речь и взял для повседневного «говорить» другой корень, а польский оставил mówić основным словом. Отсюда и przemówić «заговорить, выступить», и przemówienie «речь», буквально «проговаривание»."
memory: "Сорок две формы: страдательного причастия нет, потому что глагол непереходный. И ó здесь корневое, из mówić, поэтому стоит везде — не как в pozdrów/pozdrowi."
idioms:
  - { pl: "przemówić komuś do rozsądku", ru: "образумить кого-то" }
  - { pl: "przemówić ludzkim głosem", ru: "заговорить человеческим голосом" }
