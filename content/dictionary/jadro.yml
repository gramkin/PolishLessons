etymology: "Общеславянское слово, родственное русскому «ядро». Польское Ą на месте русского Я: JĄDRO — «ядро», как MIĘSO — «мясо»."
memory: "Jądro — ядро: jądro atomu, jądro Ziemi. Jądra в анатомии — яички. Energia jądrowa — атомная энергия. Читается «йо́ндро»."
