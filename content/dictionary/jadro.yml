notes:
  - { kind: false-friend, text: "JĄDRO — «ядро» в науке и в переносном смысле, но в анатомии JĄDRA — «яички». Пушечное ядро — KULA ARMATNIA, а не JĄDRO. Атомный — JĄDROWY: ENERGIA JĄDROWA, «атомная энергия»." }
  - { kind: usage, text: "Девять форм, средний род. Родительный множественного — JĄDER, с беглым E. В местном R переходит в RZ: W JĄDRZE." }
  - { kind: government, text: "Ядро чего — родительный: JĄDRO ATOMU. В ядре — W JĄDRZE, местный. Суть проблемы — JĄDRO PROBLEMU." }
  - { kind: pronunciation, text: "Читается «йо́ндро»: J — «й», Ą перед D — «он». Ударение на первом слоге. JĄDRZE — «йо́ндже»." }
collocations:
