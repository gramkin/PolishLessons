# review
id: kapitan
format: 2
lemma: "kapitan"
rank: 379
pos: noun
pron: { cyr: "капи́тан" }
senses:
  - id: captain
    ru: "капитан (судна, команды)"
    examples:
      - pl: "Jestem kapitanem tego statku."
        ru: "Я капитан этого судна."
        source: { kind: tatoeba, id: 13785281 }
      - pl: "Jest kapitanem drużyny."
        ru: "Он капитан команды."
        source: { kind: translated, id: 416260 }
      - pl: "To jest kapitan."
        ru: "Это капитан."
        source: { kind: translated, id: 4837527 }
  - id: rank
    ru: "капитан (звание, обращение)"
    examples:
      - pl: "Panie kapitanie, czy jak już wylądujecie, czy ja mogę się spytać?"
        ru: "Господин капитан, когда Вы уже приземлитесь, могу ли я спросить?"
        source: { kind: tatoeba, id: 1735714 }
      - pl: "Musiałem powierzyć życie kapitanowi statku."
        ru: "Мне пришлось доверить жизнь капитану судна."
        source: { kind: translated, id: 1603732 }
      - pl: "Wybrali go na kapitana."
        ru: "Его выбрали капитаном."
        source: { kind: translated, id: 915190 }
notes:
  - { kind: usage, text: "Звание и должность в сказуемом ставятся в творительном падеже: Jestem kapitanem tego statku «Я капитан этого судна»." }
  - { kind: usage, text: "Обращение идёт в звательном падеже: Panie kapitanie! «Господин капитан!»" }
  - { kind: usage, text: "Множественное число мужско-личное — kapitanowie, с окончанием -owie, как panowie или profesorowie." }
  - { kind: usage, text: "Слово латинское: capitaneus от caput «голова», пришло через немецкий. Русское «капитан» — то же самое заимствование." }
collocations:
  - { pl: "kapitan statku", ru: "капитан судна" }
  - { pl: "kapitan drużyny", ru: "капитан команды" }
  - { pl: "panie kapitanie", ru: "господин капитан" }
etymology: "Из латинского capitaneus, от caput «голова», через немецкий. Русское «капитан» — то же самое заимствование, так что слово узнаётся сразу."
memory: "kapitan — «капитан», слово в обоих языках одно и то же латинское заимствование. Учить надо две вещи: творительный в сказуемом (jestem kapitanem) и множественное на -owie: kapitanowie."
idioms:
  - { pl: "kapitan statku", ru: "капитан судна" }
  - { pl: "panie kapitanie", ru: "господин капитан" }
  - { pl: "kapitan drużyny", ru: "капитан команды" }
