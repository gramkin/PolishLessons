# review
id: ladnie
format: 2
lemma: "ładnie"
rank: 1309
pos: adv
pron: { cyr: "уа́дне" }
senses:
  - id: nicely
    ru: "красиво, хорошо, приятно"
    examples:
      - pl: "Ładnie piszesz."
        ru: "Ты красиво пишешь."
        source: { kind: translated, id: 1479250 }
      - pl: "Ona ładnie pisze."
        ru: "Она красиво пишет."
        source: { kind: translated, id: 361028 }
      - pl: "Pod mikroskopem niektóre wirusy wygladają bardzo ładnie."
        ru: "Под микроскопом некоторые вирусы выглядят очень красиво."
        source: { kind: tatoeba, id: 2008939 }
  - id: smell-weather
    ru: "о запахе и погоде: приятно, хорошо"
    examples:
      - pl: "Ładnie pachnie."
        ru: "Приятно пахнет."
        source: { kind: translated, id: 1169893 }
      - pl: "Ładnie pachniesz."
        ru: "От тебя приятно пахнет."
        source: { kind: translated, id: 11587842 }
      - pl: "Ładnie dziś, prawda?"
        ru: "Сегодня хорошая погода, правда?"
        source: { kind: translated, id: 357348 }
notes:
  - { kind: usage, text: "Наречие от ładny «красивый». О погоде значит «ясно, хорошо»: Ładnie dziś «Сегодня хорошая погода»." }
  - { kind: usage, text: "Сравнительная степень — ładniej «красивее», превосходная — najładniej «красивее всего»." }
  - { kind: register, text: "Ładnie — обиходная похвала, мягче торжественного pięknie «прекрасно». Ироничное Ładnie! значит «Ну и дела!»." }
  - { kind: pronunciation, text: "ł звучит как «у»: уа́дне. Ударение на первый слог." }
collocations:
  - { pl: "ładnie wyglądać", ru: "хорошо выглядеть" }
  - { pl: "ładnie pachnieć", ru: "приятно пахнуть" }
  - { pl: "ładnie dziś", ru: "сегодня хорошая погода" }
etymology: "От ładny «красивый», а тот от ład «порядок, лад». Русское «ладный» — то же слово, и в говорах оно тоже значит «красивый, хороший»."
memory: "ładnie — «красиво, приятно», наречие от ładny. О погоде значит «хорошо»: Ładnie dziś. Корень тот же, что в русских «лад» и «ладный». Степени: ładniej, najładniej."
idioms:
