lemma: "gorycz"
rank: 2401
pos: noun
pron: { cyr: "го́рыч" }
senses:
  - id: bitterness-taste
    ru: "горечь (вкус)"
    examples:
      - pl: "Gorycz piwa nie wszystkim odpowiada."
        ru: "Горечь пива нравится не всем."
        source: { kind: authored }
      - pl: "W ustach została gorycz."
        ru: "Во рту осталась горечь."
        source: { kind: authored }
      - pl: "Gorycz ziół jest wyczuwalna."
        ru: "Горечь трав ощутима."
        source: { kind: authored }
  - id: bitterness-feeling
    ru: "горечь (чувство)"
    examples:
      - pl: "Pożegnała się z uśmiechem na twarzy, wszelako jej serce było pełne goryczy."
        ru: "Она попрощалась с улыбкой на лице, однако сердце её было полно горечи."
        source: { kind: translated, id: 970794 }
      - pl: "Ostatnia kropla przelewa czarę goryczy."
        ru: "Последняя капля переполняет чашу терпения."
        source: { kind: translated, id: 13662007 }
notes:
  - { kind: usage, text: "Оборот przelać czarę goryczy «переполнить чашу терпения» буквально значит «перелить чашу горечи» — русский говорит о терпении, поляк о горечи." }
  - { kind: false-friend, text: "От gorzki «горький», корень тот же, что в русском «горький», «горечь». Связан с gorący «горячий»: то, что жжёт." }
  - { kind: government, text: "Женский род на -ycz: ta gorycz, tej goryczy. Множественного числа практически нет." }
  - { kind: usage, text: "Переносно — о разочаровании: gorycz porażki «горечь поражения»." }
collocations:
  - { pl: "przelać czarę goryczy", ru: "переполнить чашу терпения" }
  - { pl: "gorycz porażki", ru: "горечь поражения" }
etymology: "От gorzki «горький», родня русским «горький», «горечь», и связано с gorący «горячий»."
