# review
id: sprzet
format: 2
lemma: "sprzęt"
rank: 1547
pos: noun
pron: { cyr: "спшэнт" }
senses:
  - id: equipment
    ru: "оборудование, снаряжение, техника"
    examples:
      - pl: "Producent dał gwarancję na ten nowy sprzęt na pięć lat."
        ru: "Производитель дал гарантию на это новое оборудование на пять лет."
        source: { kind: translated, id: 3257458 }
      - pl: "Wspinaczka bez odpowiedniego sprzętu jest bardzo niebezpieczna."
        ru: "Восхождение без подходящего снаряжения очень опасно."
        source: { kind: translated, id: 3451914 }
      - pl: "Oprogramowanie staje się wolniejsze szybciej niż sprzęt staje się szybszy."
        ru: "Программы замедляются быстрее, чем техника ускоряется."
        source: { kind: translated, id: 6304061 }
  - id: appliances
    ru: "приборы, утварь"
    examples:
      - pl: "Elektroniczne sprzęty ułatwiły prace domowe."
        ru: "Электронные приборы облегчили домашнюю работу."
        source: { kind: translated, id: 4834160 }
      - pl: "Musimy kupić nowy sprzęt biurowy, nasz jest dosyć wysłużony."
        ru: "Нам нужно купить новую офисную технику, наша порядком изношена."
        source: { kind: translated, id: 1634474 }
notes:
  - { kind: usage, text: "Слово собирательное и чаще стоит в единственном числе, даже когда предметов много: sprzęt biurowy «офисная техника»." }
  - { kind: false-friend, text: "В компьютерном языке sprzęt значит «железо, аппаратная часть» — противоположность oprogramowanie «программному обеспечению»." }
  - { kind: usage, text: "Ходовые сочетания: sprzęt sportowy «спортивный инвентарь», sprzęt AGD «бытовая техника», sprzęt ratunkowy «спасательное снаряжение»." }
  - { kind: usage, text: "Множественное sprzęty значит скорее «утварь, предметы обстановки»." }
collocations:
  - { pl: "sprzęt sportowy", ru: "спортивный инвентарь" }
  - { pl: "sprzęt komputerowy", ru: "компьютерное железо" }
  - { pl: "sprzęt biurowy", ru: "офисная техника" }
etymology: "От sprzątać «убирать», в основе корень со значением «собирать вместе». Русское «снаряжение» собрано иначе, так что опоры на родство здесь нет."
memory: "sprzęt — «оборудование, снаряжение, техника», слово собирательное и чаще в единственном числе. В компьютерном смысле это «железо», противоположность oprogramowanie. А sprzęty во множественном — «утварь»."
idioms:
  - { pl: "sprzęt sportowy", ru: "спортивный инвентарь" }
  - { pl: "sprzęt AGD", ru: "бытовая техника" }
  - { pl: "sprzęt komputerowy", ru: "компьютерное железо" }
