notes:
  - { kind: government, text: "На животе — na brzuchu (предложный падеж): śpi na brzuchu «он спит на животе». Боль живота — ból brzucha (родительный)." }
  - { kind: usage, text: "mieć motyle w brzuchu — «бабочки в животе», о влюблённости: образ тот же, что в русском." }
  - { kind: usage, text: "Слово нейтральное; «пузо» по-русски грубее, польское brzuch годится и в разговоре с врачом." }
  - { kind: false-friend, text: "Русское «брюхо» — то же слово, но по-русски оно грубое или про животных, а польское brzuch нейтрально для человека." }
collocations:
  - { pl: "ból brzucha", ru: "боль в животе" }
  - { pl: "na brzuchu", ru: "на животе" }
  - { pl: "boli mnie brzuch", ru: "у меня болит живот" }
family:
  - { pl: "brzuszek", ru: "животик", relation: root }
  - { pl: "brzuszny", ru: "брюшной", relation: root }
etymology: "Праславянское *brjuxo — то же слово, что русское «брюхо». В польском оно осталось нейтральным, а в русском огрубело."
memory: "brzuch — «живот», слово нейтральное, в отличие от русского «брюхо». На животе — na brzuchu, боль в животе — ból brzucha."
