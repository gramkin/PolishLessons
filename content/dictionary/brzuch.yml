senses:
  - id: belly
    ru: "живот"
    examples:
      - pl: "Brzuch mnie boli."
        ru: "У меня болит живот."
        source: { kind: tatoeba, id: 6327922 }
      - pl: "Boli mnie brzuch."
        ru: "У меня болит живот."
