# review
id: wizerunek
format: 2
lemma: "wizerunek"
rank: 4547
pos: noun
pron: { cyr: "визэру́нэк" }
senses:
  - id: image
    ru: "имидж, образ (в глазах других)"
    examples:
      - pl: "Firma dba o swój wizerunek."
        ru: "Фирма заботится о своём имидже."
        source: { kind: authored }
      - pl: "Ma wizerunek poważnego polityka."
        ru: "У него имидж серьёзного политика."
        source: { kind: authored }
      - pl: "Ta reklama poprawiła wizerunek marki."
        ru: "Эта реклама улучшила имидж бренда."
        source: { kind: authored }
  - id: depiction
    ru: "изображение, образ (на картине, монете)"
    examples:
      - pl: "W kościele wisi wizerunek Matki Boskiej."
        ru: "В церкви висит образ Богоматери."
        source: { kind: authored }
      - pl: "Na znaczku jest wizerunek orła."
        ru: "На марке изображён орёл."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "WIZERUNEK — и «имидж», и «изображение»: WIZERUNEK FIRMY — «имидж фирмы», WIZERUNEK KRÓLA NA MONECIE — «изображение короля на монете». Заимствованное IMIDŻ в польском есть, но звучит разговорно, а в серьёзной речи говорят WIZERUNEK." }
  - { kind: usage, text: "Девять форм, мужской род, неодушевлённое, без звательного. Беглое E: WIZERUNEK, но WIZERUNKU, WIZERUNKI. Родительный и местный совпадают: WIZERUNKU." }
  - { kind: government, text: "Заботиться об имидже — DBAĆ O WIZERUNEK, O с винительным, а не с предложным, как в русском. Работать над имиджем — PRACOWAĆ NAD WIZERUNKIEM, NAD с творительным. Навредить имиджу — ZASZKODZIĆ WIZERUNKOWI." }
  - { kind: pronunciation, text: "Читается «визэру́нэк», ударение на предпоследнем слоге. ZE и NE твёрдые: «зэ», «нэ». В форме WIZERUNKU: «визэру́нку»." }
  - { kind: register, text: "В первом значении — язык PR, бизнеса и политики: KRYZYS WIZERUNKOWY, STRATY WIZERUNKOWE. Во втором — церковный и искусствоведческий: CUDOWNY WIZERUNEK, «чудотворный образ»." }
collocations:
  - { pl: "dbać o wizerunek", ru: "заботиться об имидже" }
  - { pl: "wizerunek firmy", ru: "имидж фирмы" }
  - { pl: "wizerunek publiczny", ru: "публичный образ" }
family:
  - { pl: "wizerunkowy", ru: "имиджевый", relation: derived }
  - { pl: "wizerunkowo", ru: "с точки зрения имиджа", relation: derived }
  - { pl: "kreowanie wizerunku", ru: "создание имиджа", relation: derived }
etymology: "Из немецкого слова со значением «рисунок, набросок», восходящего к латинскому глаголу «смотреть, видеть». Через латынь родственно польским WIZJA и WIZYTA. Исходное значение — изображение, а «имидж» — новое, переносное."
memory: "Wizerunek — имидж и изображение. Читается «визэру́нэк». Dbać o wizerunek — заботиться об имидже (o + винительный). Wizerunek na monecie — изображение на монете."
idioms:
  - { pl: "stracić twarz", ru: "потерять лицо" }
