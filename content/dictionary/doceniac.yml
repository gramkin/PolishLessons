formExamples:
  - form: "docenia"
    pl: "Tomasz nie docenia Marii."
    ru: "Томаш недооценивает Марию."
    source: { kind: translated, id: 2238961 }
  - form: "docenia"
    pl: "Tom docenia wszystko, co Mary dla niego zrobiła."
    ru: "Том ценит всё, что Мэри для него сделала."
    source: { kind: translated, id: 2983820 }
  - form: "docenia"
    pl: "Ona codziennie dla niego gotuje, ale on tego nie docenia."
    ru: "Она каждый день ему готовит, а он этого не ценит."
    source: { kind: translated, id: 3034166 }
  - form: "doceniać"
    pl: "Nie wydajesz się doceniać tego, co dla ciebie zrobiliśmy."
    ru: "Ты, похоже, не ценишь того, что мы для тебя сделали."
    source: { kind: translated, id: 6305512 }
  - form: "doceniać"
    pl: "Bardzo często zdarza się nam, że najpierw musimy kogoś utracić, by móc zacząć go doceniać."
    ru: "Очень часто бывает так, что сначала нужно кого-то потерять, чтобы начать его ценить."
    source: { kind: translated, id: 1356515 }
  - form: "doceniać"
    pl: "Trzeba doceniać drobiazgi."
    ru: "Нужно ценить мелочи."
    source: { kind: authored }
  - form: "doceniają"
    pl: "Ludzie doceniają klarowność."
    ru: "Люди ценят ясность."
    source: { kind: translated, id: 530580 }
  - form: "doceniają"
    pl: "Ci, którzy go znają, doceniają go."
    ru: "Те, кто его знает, ценят его."
    source: { kind: translated, id: 11533920 }
  - form: "doceniają"
    pl: "Starsi ludzie doceniają, że o nich pamiętamy."
    ru: "Пожилые люди ценят, что мы о них помним."
    source: { kind: translated, id: 13026345 }
  - form: "docenialiśmy"
    pl: "Wszyscy docenialiśmy powagę sytuacji."
    ru: "Мы все понимали серьёзность положения."
    source: { kind: translated, id: 914931 }
  - form: "docenialiśmy"
    pl: "Docenialiśmy jego wysiłek."
