# review
id: doceniac
format: 2
lemma: "doceniać"
rank: 1179
pos: verb
aspect: imperf
pron: { cyr: "доце́няць" }
senses:
  - id: appreciate
    ru: "ценить, по достоинству оценивать"
    examples:
      - pl: "Doceniam to."
        ru: "Я это ценю."
        source: { kind: translated, id: 1844984 }
      - pl: "Ja to bardzo doceniam."
        ru: "Я очень это ценю."
        source: { kind: tatoeba, id: 3660720 }
      - pl: "Doceniam Twoją pomoc."
        ru: "Я ценю твою помощь."
        source: { kind: translated, id: 1589336 }
  - id: underestimate
    ru: "nie doceniać — недооценивать"
    examples:
      - pl: "Nie doceniasz go."
        ru: "Ты его недооцениваешь."
        source: { kind: translated, id: 2397168 }
      - pl: "Nie doceniałem siły przeciwnika."
        ru: "Я недооценивал силу противника."
        source: { kind: translated, id: 521279 }
  - id: appreciated
    ru: "doceniany — оценённый по достоинству"
    examples:
      - pl: "Twoja uprzejmość jest doceniana."
        ru: "Твою любезность ценят."
        source: { kind: translated, id: 3865364 }
      - pl: "Ludzie doceniają klarowność."
        ru: "Люди ценят ясность."
        source: { kind: translated, id: 530580 }
notes:
  - { kind: government, text: "doceniać kogoś, coś — винительный падеж без предлога, как русское «ценить кого-то, что-то»." }
  - { kind: false-friend, text: "Отрицание меняет смысл сильнее, чем кажется: nie doceniać значит не «не ценить», а именно «недооценивать». Nie doceniasz mnie — «Ты меня недооцениваешь»." }
  - { kind: usage, text: "Несовершенный вид; совершенный — docenić. Корень — cenić «ценить», от cena «цена»." }
  - { kind: usage, text: "Doceniam to — очень частая вежливая формула, примерно как русское «Я это ценю, спасибо»." }
collocations:
  - { pl: "doceniać czyjąś pomoc", ru: "ценить чью-то помощь" }
  - { pl: "nie doceniać", ru: "недооценивать" }
  - { pl: "doceniam to", ru: "я это ценю" }
family:
  - { pl: "docenić", ru: "оценить по достоинству", relation: aspect }
  - { pl: "cenić", ru: "ценить", relation: root }
  - { pl: "cena", ru: "цена", relation: root, id: cena }
etymology: "Приставка do- плюс cenić «ценить», от cena «цена» — буквально «доценить, оценить до конца». Русское «ценить» — то же слово без приставки."
memory: "doceniać — «ценить по достоинству». Главная тонкость в отрицании: nie doceniać значит «недооценивать», а не «не ценить». Doceniam to — частая вежливая формула, «я это ценю»."
idioms:
  - { pl: "nie doceniać", ru: "недооценивать" }
  - { pl: "doceniam to", ru: "я это ценю" }
