  - { pl: "kręcić", ru: "крутить, вертеть", relation: root, id: krecic }
  - { pl: "zakręt", ru: "поворот", relation: derived }
etymology: "Приставка s- и KRĘCIĆ «крутить», из праславянского *krętiti — того же корня, что русские «крутить», «круто», «крут». Из гнезда вышли KRĄG «круг», OKRĄG «округ», ZAKRĘT «поворот», KRĘTY «извилистый», SKRĘT «поворот, самокрутка», KRĘGOSŁUP «позвоночник», буквально «круговой столб». Соответствие с русским полное, включая оба смысла приставочного глагола — «свернуть в сторону» и «скрутить»."
memory: "kręcić — это «крутить», и skręcić значит то же, что русское «свернуть»: и в сторону, и сигарету. Но по-польски «направо» будет W PRAWO, с предлогом."
idioms:
