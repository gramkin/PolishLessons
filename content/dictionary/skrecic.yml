pron: { cyr: "скрэ́нциць" }
senses:
  - id: turn
    ru: "повернуть, свернуть"
    examples:
      - pl: "Skręć w prawo za kościołem."
        ru: "Поверни направо за костёлом."
        source: { kind: authored }
      - pl: "Skręcili w pierwszą ulicę po lewej."
        ru: "Они свернули в первую улицу налево."
