        source: { kind: authored }
  - id: twist
    ru: "скрутить, свернуть"
    examples:
      - pl: "Skręcił papierosa jedną ręką."
        ru: "Он скрутил сигарету одной рукой."
        source: { kind: authored }
      - pl: "Uważaj, skręcisz sobie kark."
        ru: "Осторожно, свернёшь себе шею."
        source: { kind: authored }
notes:
  - { kind: pronunciation, text: "Основа кончается мягким ц, и это третий случай в словаре, когда один согласный пишется тремя способами — после PRZERAZIĆ и PRZENOSIĆ. Перед окончаниями -ę и -ą стоит c: SKRĘCĘ, SKRĘCĄ. Перед i — ci: SKRĘCI, SKRĘCISZ, SKRĘCIŁ. А на конце слова — ć, откуда повелительное SKRĘĆ, SKRĘĆMY, SKRĘĆCIE. Звук один и тот же, меняется только написание, и правило о мене касается его целиком." }
  - { kind: usage, text: "Корень русскому знаком: KRĘCIĆ — это «крутить, вертеть», из того же праславянского корня, что «крутить» и «круг». Отсюда KRĄG «круг», ZAKRĘT «поворот дороги», KRĘTY «извилистый», SKRĘT «поворот, а также самокрутка». Приставка s- дала здесь два смысла: «свернуть в сторону» о движении и «скрутить» о предмете. Русский делит это так же: «свернуть направо» и «скрутить сигарету» — то же слово в обоих случаях." }
  - { kind: government, text: "В значении поворота берёт предлог W с винительным: SKRĘCIĆ W PRAWO, W LEWO, W PIERWSZĄ ULICĘ. Русский берёт здесь то же «в» с винительным для улицы, но наречие без предлога — «повернуть направо», тогда как польский говорит W PRAWO с предлогом. Эту мелочь стоит заметить отдельно. В значении скручивания берёт прямое дополнение в винительном: SKRĘCIĆ PAPIEROSA, SKRĘCIĆ KARK, SKRĘCIĆ KOSTKĘ «подвернуть ногу». Несовершенная пара — SKRĘCAĆ." }
  - { kind: usage, text: "Пятьдесят три формы — совершенный переходный: сорок одна основная, одиннадцать страдательных причастий и деепричастие SKRĘCIWSZY. Страдательное причастие SKRĘCONY значит и «скрученный», и «вывихнутый» о ноге: SKRĘCONA KOSTKA — «подвёрнутая нога». Мужская личная форма множественного — SKRĘCENI с e при SKRĘCONY с o, по правилу причастий на -ony из карточки KARMIĆ." }
collocations:
