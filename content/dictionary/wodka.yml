notes:
  - { kind: false-friend, text: "Слово совпадает с русским по значению и по происхождению: и польская WÓDKA, и русская «водка» — уменьшительные от слова «вода», буквально «водичка». Польское WODA даёт WÓDKA, русское «вода» даёт «водку», и метафора в обоих языках одна. Различается только написание корневого гласного: в закрытом слоге польский пишет Ó и читает его как «у», отсюда «ву́тка», а не «во́дка». Это то же правило, что в STÓŁ при STOŁU и в PROTOKÓŁ при PROTOKOŁU, только здесь Ó держится во всех формах, потому что слог остаётся закрытым: WÓDKI, WÓDCE, WÓDEK." }
  - { kind: usage, text: "В дательном и местном падеже единственного числа K переходит в C: WÓDCE, как MATKA даёт MATCE. В родительном множественного появляется беглая гласная E: WÓDEK, разбивающая скопление DK. Оба хода те же, что у TKANKA с TKANCE и TKANEK, и это удобно: две совершенно разные по смыслу основы склоняются одинаково, потому что кончаются на -KA. Множественное число употребляется, когда речь о сортах или о порциях: DWIE WÓDKI значит «две рюмки водки». Уменьшительное WÓDECZKA звучит добродушно и в живой речи частотно." }
  - { kind: government, text: "Женский род. Из чего водка — предлог Z с родительного: WÓDKA Z ŻYTA «водка из ржи», WÓDKA Z ZIEMNIAKÓW. Какая — прилагательное: WÓDKA CZYSTA «чистая водка», WÓDKA ŻYTNIA, WÓDKA WYBOROWA. Частотные глаголы: NALAĆ WÓDKI «налить водки» — с родительным, потому что количество неопределённое; WYPIĆ WÓDKĘ «выпить водку», с винительным, когда порция определена. Эта разница падежей работает в польском со всеми напитками и едой. Устойчивое NA WÓDKĘ значит «на рюмочку»: ZAPROSIŁ NAS NA WÓDKĘ." }
  - { kind: pronunciation, text: "Читается «ву́тка», два слога, ударение на первом. Буква Ó даёт «у», а не «о», поэтому первый слог звучит «ву». Буква D перед глухим K оглушается до «т», так что в середине слышно «тк», а не «дк»: «вутка». На письме при этом остаются и Ó, и D. В родительном множественного WÓDEK появляется гласная, и озвончение возвращается: «ву́дэк». В дательном WÓDCE снова оглушение: «ву́тце»." }
