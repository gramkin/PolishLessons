etymology: "Уменьшительное от WODA, из праславянского *voda, того же слова, что русская «вода». Название напитка возникло как калька средневекового латинского AQUA VITAE «вода жизни», и оба языка пришли к уменьшительной форме независимо, но одинаково: «водка» и WÓDKA буквально значат «водичка». Польский при этом подчинил корневой гласный своему правилу: старое долгое o в закрытом слоге дало Ó, которое читается как «у», поэтому написание расходится с русским, а смысл нет. Из того же гнезда идут WODNY «водный», WODOCIĄG «водопровод» и NAWODNIĆ «оросить». Уменьшительный суффикс -KA здесь тот же, что в русском, и работает так же."
memory: "То же слово и та же метафора: wódka и «водка» — уменьшительные от «воды», буквально «водичка», калька с латинского aqua vitae. Расходится только огласовка: в закрытом слоге польский пишет ó и читает «у», отсюда «ву́тка», и d перед k оглушается в «т». Дательный и местный wódce с k→c, родительный множественного wódek с беглой e — тот же набор, что у tkanka. Nalać wódki с родительным, wypić wódkę с винительным."
