formExamples:
  - form: "zakłada"
    pl: "Kto się zakłada?"
    ru: "Кто спорит?"
    source: { kind: translated, id: 5717253 }
  - form: "zakłada"
    pl: "Zakłada nową firmę."
    ru: "Он основывает новую фирму."
    source: { kind: authored }
  - form: "zakłada"
    pl: "Zawsze zakłada ten sam płaszcz."
    ru: "Он всегда надевает одно и то же пальто."
    source: { kind: authored }
  - form: "zakładać"
    pl: "Tom zaczął zakładać buty."
    ru: "Том начал надевать ботинки."
    source: { kind: translated, id: 5718609 }
  - form: "zakładać"
    pl: "Powinieneś zakładać, że twój telefon jest podsłuchiwany."
    ru: "Ты должен исходить из того, что твой телефон прослушивают."
    source: { kind: translated, id: 8182264 }
  - form: "zakładać"
    pl: "Przytrzymam ci torbę, gdy ty będziesz zakładać swój płaszcz."
    ru: "Я подержу тебе сумку, пока ты будешь надевать пальто."
    source: { kind: translated, id: 528949 }
  - form: "zakładaj"
    pl: "Nigdy więcej nie zakładaj tego krawatu."
    ru: "Больше никогда не надевай этот галстук."
    source: { kind: translated, id: 3881856 }
  - form: "zakładaj"
    pl: "Zakładaj, że każdy problem w twoim życiu jest lekcją, która cię wzmocni. Wtedy nigdy nie będziesz czuć się ofiarą."
    ru: "Исходи из того, что каждая трудность в твоей жизни — урок, который тебя укрепит."
    source: { kind: translated, id: 11715931 }
  - form: "zakładaj"
    pl: "Nie zakładaj z góry najgorszego."
    ru: "Не предполагай заранее худшего."
    source: { kind: authored }
  - form: "zakładają"
    pl: "Ludzie zawsze zakładają najgorsze."
    ru: "Люди всегда предполагают худшее."
    source: { kind: translated, id: 12040427 }
  - form: "zakładają"
    pl: "Mary i Alice często zakładają te same rzeczy."
    ru: "Мэри и Алиса часто надевают одно и то же."
    source: { kind: translated, id: 4184041 }
  - form: "zakładają"
    pl: "Skowronki chętnie zakładają swoje gniazda pod rynną dachu."
    ru: "Жаворонки охотно вьют гнёзда под водостоком."
    source: { kind: translated, id: 2607017 }
  - form: "zakładając"
    pl: "Zakładając, że to, co mówisz, jest prawdą, to co ja mam zrobić?"
    ru: "Допустим, то, что ты говоришь, правда, — и что же мне делать?"
    source: { kind: translated, id: 697495 }
  - form: "zakładając"
    pl: "Wyszedł, zakładając płaszcz w biegu."
    ru: "Он вышел, надевая пальто на ходу."
    source: { kind: authored }
  - form: "zakładając"
    pl: "Zakładając najgorsze, trzeba się przygotować."
    ru: "Предполагая худшее, нужно подготовиться."
    source: { kind: authored }
  - form: "zakładam"
    pl: "Zakładam, że znasz Toma."
    ru: "Полагаю, ты знаешь Тома."
    source: { kind: translated, id: 3141073 }
  - form: "zakładam"
    pl: "Zakładam, że masz paszport."
    ru: "Полагаю, у тебя есть паспорт."
    source: { kind: translated, id: 3880047 }
  - form: "zakładam"
    pl: "Zakładam, że ludzie są uczciwi."
    ru: "Я исхожу из того, что люди честны."
    source: { kind: translated, id: 356475 }
  - form: "zakładam"
    pl: "Nigdy się nie zakładam."
    ru: "Я никогда не спорю на деньги."
    source: { kind: translated, id: 8773490 }
  - form: "zakładasz"
    pl: "Jakie buty zakładasz?"
    ru: "Какие ботинки ты надеваешь?"
    source: { kind: translated, id: 880334 }
  - form: "zakładasz"
    pl: "Jakie ubrania zazwyczaj zakładasz do szkoły?"
    ru: "Какую одежду ты обычно надеваешь в школу?"
    source: { kind: translated, id: 4142533 }
  - form: "zakładasz"
    pl: "Zakładasz, że się zgodzę?"
    ru: "Ты полагаешь, что я соглашусь?"
    source: { kind: authored }
