# review
id: zakladac
format: 2
lemma: "zakładać"
rank: 1266
pos: verb
aspect: imperf
aspectPair: zalozyc
pron: { cyr: "закуа́даць" }
senses:
  - id: assume
    ru: "предполагать, исходить из того, что…"
    examples:
      - pl: "Zakładam, że znasz Toma."
        ru: "Полагаю, ты знаешь Тома."
        source: { kind: translated, id: 3141073 }
      - pl: "Zakładam, że ludzie są uczciwi."
        ru: "Я исхожу из того, что люди честны."
        source: { kind: translated, id: 356475 }
      - pl: "Ludzie zawsze zakładają najgorsze."
        ru: "Люди всегда предполагают худшее."
        source: { kind: translated, id: 12040427 }
  - id: put-on
    ru: "надевать (одежду, обувь)"
    examples:
      - pl: "Tom zaczął zakładać buty."
        ru: "Том начал надевать ботинки."
        source: { kind: translated, id: 5718609 }
      - pl: "Jakie buty zakładasz?"
        ru: "Какие ботинки ты надеваешь?"
        source: { kind: translated, id: 880334 }
      - pl: "Nigdy więcej nie zakładaj tego krawatu."
        ru: "Больше никогда не надевай этот галстук."
        source: { kind: translated, id: 3881856 }
  - id: found-bet
    ru: "основывать (фирму, гнездо); zakładać się — спорить, держать пари"
    examples:
      - pl: "Skowronki chętnie zakładają swoje gniazda pod rynną dachu."
        ru: "Жаворонки охотно вьют гнёзда под водостоком."
        source: { kind: translated, id: 2607017 }
      - pl: "Kto się zakłada?"
        ru: "Кто спорит?"
        source: { kind: translated, id: 5717253 }
      - pl: "Zakładam się, że wygra."
        ru: "Спорю, что он выиграет."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Четыре разных значения сразу: «предполагать» (zakładam, że…), «надевать» (zakładać buty), «основывать» (zakładać firmę) и возвратное zakładać się «спорить, держать пари»." }
  - { kind: government, text: "zakładać, że… «предполагать, что…» — с придаточным. А zakładać coś «надевать что-то» требует винительного." }
  - { kind: usage, text: "Самое частое в живой речи — вводное Zakładam, że… «Полагаю, что…»." }
  - { kind: usage, text: "Вид несовершенный; совершенный — założyć, карточка уже есть." }
collocations:
  - { pl: "zakładam, że", ru: "полагаю, что" }
  - { pl: "zakładać buty", ru: "надевать обувь" }
  - { pl: "zakładać firmę", ru: "основывать фирму" }
etymology: "Приставка za- и kłaść «класть», из праславянского *kolsti. Русское «закладывать» собрано ровно так же, и значение «основывать» у него то же: закладывать фундамент."
memory: "zakładać — четыре значения сразу: «предполагать» (Zakładam, że…), «надевать» (zakładać buty), «основывать» (zakładać firmę) и «спорить» (zakładać się). Совершенный вид — założyć."
idioms:
  - { pl: "zakładam, że", ru: "полагаю, что" }
  - { pl: "zakładać się o coś", ru: "спорить на что-то" }
  - { pl: "zakładać firmę", ru: "основывать фирму" }
