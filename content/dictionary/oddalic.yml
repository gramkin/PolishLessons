# review
id: oddalic
format: 2
lemma: "oddalić"
rank: 4579
pos: verb
pron: { cyr: "одда́лиць" }
senses:
  - id: move-away
    ru: "с SIĘ — удалиться, отойти; отдалить"
    examples:
      - pl: "Oddaliła się od grupy i zgubiła."
        ru: "Она отошла от группы и заблудилась."
        source: { kind: authored }
      - pl: "Z czasem oddalili się od siebie."
        ru: "Со временем они отдалились друг от друга."
        source: { kind: authored }
      - pl: "Kariera oddaliła ją od rodziny."
        ru: "Карьера отдалила её от семьи."
        source: { kind: authored }
  - id: dismiss
    ru: "юр. отклонить (иск, жалобу)"
    examples:
      - pl: "Sąd oddalił pozew."
        ru: "Суд отклонил иск."
        source: { kind: authored }
      - pl: "Sędziowie oddalili apelację."
        ru: "Судьи отклонили апелляцию."
        source: { kind: authored }
  - id: dispel
    ru: "отвести, отогнать (подозрения, угрозу)"
    examples:
      - pl: "Oddalił od siebie wszelkie podejrzenia."
        ru: "Он отвёл от себя все подозрения."
        source: { kind: authored }
      - pl: "Oddal od siebie złe myśli."
        ru: "Отгони от себя дурные мысли."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ODDALIĆ — «отдалить», ODDALIĆ SIĘ — «удалиться». Но в суде ODDALIĆ POZEW — «отклонить иск». Не путать с ODDAĆ — «отдать». ODDALONY — «отдалённый»: ODDALONY O PIĘĆ KILOMETRÓW «в пяти километрах»." }
  - { kind: usage, text: "Пятьдесят три формы, включая ODDALENI — «отдалившиеся»: ODDALENI OD SIEBIE. Будущее: ODDALĘ, ODDALISZ, повелительное ODDAL. Несовершенный вид — ODDALAĆ." }
  - { kind: government, text: "От чего — OD с родительным: ODDALIĆ SIĘ OD GRUPY. На сколько — O с винительным: ODDALONY O KILOMETR. В суде — что: ODDALIĆ WNIOSEK, SKARGĘ." }
  - { kind: pronunciation, text: "Читается «одда́лиць»: двойное DD, ударение на предпоследнем слоге. ODDALĘ — «одда́лэ», ODDAL — «о́ддаль»." }
  - { kind: register, text: "ODDALIĆ SIĘ — книжное и нейтральное «удалиться»; в разговоре чаще ODEJŚĆ. ODDALIĆ POZEW — юридический термин. ODDAL SIĘ! — строгое «удались!»." }
collocations:
  - { pl: "oddalić się od grupy", ru: "отойти от группы" }
  - { pl: "oddalić pozew", ru: "отклонить иск" }
  - { pl: "oddalić podejrzenia", ru: "отвести подозрения" }
family:
  - { pl: "daleko", ru: "далеко", relation: root, id: daleko }
  - { pl: "daleki", ru: "далёкий", relation: root, id: daleki }
  - { pl: "zbliżyć", ru: "приблизить", relation: antonym, id: zblizyc }
etymology: "Приставка OD- «от-» плюс корень DAL- «даль», праславянское *daľь. Русское «отдалить», «даль», «удалиться» — то же гнездо."
memory: "Oddalić się — удалиться: oddaliła się od grupy. Sąd oddalił pozew — суд отклонил иск. Oddalony — отдалённый. Читается «одда́лиць»."
idioms:
  - { pl: "oddalić od siebie podejrzenia", ru: "отвести от себя подозрения" }
