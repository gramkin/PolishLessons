# review
id: rezygnowac
format: 2
lemma: "rezygnować"
rank: 3746
pos: verb
pron: { cyr: "рэзыгно́ваць" }
senses:
  - id: give-up
    ru: "отказываться (от чего-то)"
    examples:
      - pl: "Nie rezygnuj ze swoich marzeń."
        ru: "Не отказывайся от своей мечты."
        source: { kind: authored }
      - pl: "Coraz więcej ludzi rezygnuje z samochodu."
        ru: "Всё больше людей отказывается от машины."
        source: { kind: authored }
      - pl: "Rezygnuję z deseru, jestem na diecie."
        ru: "Я откажусь от десерта, я на диете."
        source: { kind: authored }
  - id: resign
    ru: "уходить (с должности), выходить из игры"
    examples:
      - pl: "Prezes rezygnuje ze stanowiska."
        ru: "Председатель уходит с должности."
        source: { kind: authored }
      - pl: "Zawodnicy rezygnowali jeden po drugim."
        ru: "Участники выбывали один за другим."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "REZYGNOWAĆ — «отказываться», а не «смиряться» и не «резигнировать». Русское «резигнация» — книжное «смирение»; польское REZYGNACJA — прежде всего «отказ» и «отставка»: ZŁOŻYĆ REZYGNACJĘ «подать в отставку»." }
  - { kind: usage, text: "Несовершенный вид; совершенный — ZREZYGNOWAĆ. Спряжение на -UJĘ: REZYGNUJĘ, REZYGNUJESZ, REZYGNUJĄ. Частое NIE REZYGNUJ! — «не сдавайся!»." }
  - { kind: government, text: "От чего — Z с родительным: REZYGNOWAĆ Z PRACY, Z PLANÓW, ZE STUDIÓW. По-русски — «от» с родительным, по-польски — Z. Без дополнения — «сдаваться, выходить из борьбы»." }
  - { kind: pronunciation, text: "Читается «рэзыгно́ваць»: Z — звонкое «з», Y — «ы», GN — без вставного гласного. Ударение на предпоследнем слоге. REZYGNUJĘ — «рэзыгну́е»." }
  - { kind: register, text: "Нейтральное слово, частое и в быту, и в деловой речи. В разговоре синоним — ODPUŚCIĆ «махнуть рукой»." }
collocations:
  - { pl: "rezygnować z pracy", ru: "уходить с работы" }
  - { pl: "nie rezygnuj", ru: "не сдавайся" }
  - { pl: "rezygnować ze stanowiska", ru: "уходить с должности" }
family:
  - { pl: "zrezygnować", ru: "отказаться", relation: aspect, id: zrezygnowac }
  - { pl: "rezygnacja", ru: "отказ, отставка", relation: derived, id: rezygnacja }
  - { pl: "zrezygnowany", ru: "смирившийся, подавленный", relation: derived }
etymology: "Из латинского RESIGNARE «распечатывать, отказываться от права» через французское и немецкое. Русское «резигнация» — то же слово, но в польском значение «отказ» стало главным."
memory: "Rezygnować z czegoś — отказываться от чего-то: rezygnuję z deseru. Z + родительный! Nie rezygnuj — не сдавайся."
idioms:
  - { pl: "nie rezygnuj z marzeń", ru: "не отказывайся от мечты" }
