lemma: "wianek"
rank: 5870
pos: noun
pron: { cyr: "вя́нэк" }
senses:
  - id: wreath
    ru: "венок (из цветов, на голову)"
    examples:
      - { pl: "Upletła wianek z rumianku i chabrów.", ru: "Она сплела венок из ромашки и васильков.", source: { kind: authored } }
      - { pl: "W noc świętojańską puszcza się wianki na wodę.", ru: "В Иванову ночь венки пускают по воде.", source: { kind: authored } }
      - { pl: "Dziewczynka założyła wianek na głowę.", ru: "Девочка надела венок на голову.", source: { kind: authored } }
  - id: string
    ru: "связка, вязка (лука, чеснока, грибов)"
    examples:
      - { pl: "Na ścianie w kuchni wisiał wianek czosnku.", ru: "На стене в кухне висела связка чеснока.", source: { kind: authored } }
      - { pl: "Kupiła na targu wianek suszonych grzybów.", ru: "Она купила на рынке связку сушёных грибов.", source: { kind: authored } }
  - id: virginity
    ru: "девичья честь, невинность"
    note: "устар."
    examples:
      - { pl: "W dawnych pieśniach dziewczyna płacze po straconym wianku.", ru: "В старинных песнях девушка плачет о потерянном венке.", source: { kind: authored } }
notes:
  - { kind: usage, text: "Мужской род, неодушевлённое, с беглым E: WIANEK — WIANKA — WIANKI. Родительный на -A, а не на -U, как у многих неодушевлённых: Z WIANKA, BEZ WIANKA." }
  - { kind: usage, text: "WIANKI — летний праздник Ивановой ночи: девушки плетут венки и пускают их по реке; в Кракове так называется большой праздник на Висле." }
  - { kind: pronunciation, text: "WIA читается «вя»: I только смягчает W. Ударение на первом слоге: «вя́нэк»." }
collocations:
  - { pl: "pleść wianek", ru: "плести венок" }
  - { pl: "wianek z kwiatów", ru: "венок из цветов" }
  - { pl: "puszczać wianki na wodę", ru: "пускать венки по воде" }
  - { pl: "wianek czosnku", ru: "связка чеснока" }
family:
  - { pl: "wieniec", ru: "венец, венок (большой)", relation: root }
  - { pl: "wianuszek", ru: "веночек", relation: derived }
  - { pl: "kwiat", ru: "цветок", relation: root, id: kwiat }
etymology: "Уменьшительное от WIENIEC «венец, венок»; тот же корень, что в русском «венок»."
memory: "Wianek — «венок», wieniec — «венец». Pleść wianek — плести венок."
idioms:
  - { pl: "stracić wianek", ru: "потерять невинность (устар.)" }
