notes:
  - { kind: false-friend, text: "Возвратное WPROWADZAĆ SIĘ значит «въезжать в квартиру, вселяться», и это значение русскому не подсказывает ничего: у нас тут глагол движения, «въезжать», а у поляка — «вводить себя». WPROWADZAMY SIĘ W SOBOTĘ переводится «мы въезжаем в субботу». Обратное действие — WYPROWADZAĆ SIĘ «съезжать». Зато оборот WPROWADZAĆ W BŁĄD совпадает с русским «вводить в заблуждение» слово в слово, включая предлог, и запоминать его не надо вовсе." }
  - { kind: government, text: "Прямое дополнение в винительном: WPROWADZAĆ ZMIANY, WPROWADZAĆ NOWE ZASADY. Если вводят кого-то в помещение, направление идёт через DO с родительным: WPROWADZAĆ GOŚCI DO SALONU. Если вводят в состояние, работает предлог W с винительным: WPROWADZAĆ W BŁĄD «вводить в заблуждение», WPROWADZAĆ W ZAKŁOPOTANIE «приводить в смущение». Разница между DO и W здесь та же, что везде: DO о месте, W о состоянии. Русский в первом случае берёт «в» с винительным, так что предлог приходится менять." }
  - { kind: usage, text: "Шестьдесят три формы — подпись переходного глагола несовершенного вида, с действительным причастием на -ĄCY. Видовой партнёр — WPROWADZIĆ, и у него пятьдесят три формы. Чередование DZ и DŹ в этой паре закономерно: WPROWADZAĆ, но WPROWADZIĆ. Приставка W- отвечает русской В-, а корень тот же, что в PROWADZIĆ «вести», так что WPROWADZAĆ раскладывается ровно как «вводить». В канцелярском языке глагол незаменим: WPROWADZAĆ W ŻYCIE «вводить в жизнь, претворять»." }
  - { kind: pronunciation, text: "Читается «фпрова́дзачь», три слога, ударение на предпоследнем. Начальное W перед глухим P оглушается и звучит как «ф», поэтому слово начинается с «фпро»; то же правило работало в WCISNĄĆ и WPAKOWAĆ. Сочетание DZ даёт слитный звонкий звук, средний между «д» и «з», а не два отдельных. Конечное Ć мягкое, «чь». В формах настоящего времени звучит «фпрова́дзам», «фпрова́дзаш»." }
  - { kind: register, text: "Слово нейтральное, но тяготеет к деловому и официальному языку: WPROWADZAĆ ZMIANY, WPROWADZAĆ PRZEPISY, WPROWADZAĆ PRODUKT NA RYNEK. Существительное WPROWADZENIE значит «введение» и в книге, и в смысле внедрения. В быту живее всего возвратное употребление про переезд и устойчивое WPROWADZAĆ W BŁĄD, которое звучит и в суде, и в разговоре. Рядом стоят WPROWADZENIE SIĘ «вселение», PRZEPROWADZKA «переезд» и WYPROWADZAĆ SIĘ «съезжать»." }
