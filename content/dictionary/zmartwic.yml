etymology: "От MARTWY «мёртвый», из праславянского *mьrtvъ, того же корня, что русские «мёртвый», «смерть», «замертво». Глагол MARTWIĆ образован прямо от прилагательного и буквально значит «делать мёртвым»; от этого буквального смысла польский ушёл в сторону душевной тягости, и сегодня MARTWIĆ значит «огорчать», а MARTWIĆ SIĘ — «беспокоиться». Приставка Z- даёт совершенный вид и однократность: ZMARTWIĆ «огорчить разом». Русский с тем же корнем пошёл другим путём: «умертвить» и «мертвить» остались при смерти, а тревогу выразили через «беспокоить» от «покоя». Тот же корень виден в польском ZMARTWYCHWSTANIE «воскресение», где он лежит открыто: Z MARTWYCH WSTANIE, «восстание из мёртвых». Так одно гнездо дало и слово о смерти, и слово о тревоге, и слово о её преодолении."
memory: "Корень — martwy «мёртвый»: польский выразил «огорчить» через «мертвить». Отсюда martwić się «беспокоиться» — самое частое слово гнезда, и nie martw się «не беспокойся». Отрицательный приказ требует несовершенного вида: nie martw się, никогда nie zmartw się. Открыто корень лежит в zmartwychwstanie «воскресение» — «восстание из мёртвых»."
idioms:
