notes:
  - { kind: false-friend, text: "Корень здесь тот же, что в MARTWY «мёртвый», и это самое неожиданное в слове: польский выразил «огорчить» через «мертвить». MARTWIĆ KOGOŚ буквально «умертвлять кого-то», а значит — «огорчать, тревожить». Русское «мертвить» так не употребляется, и догадаться по корню нельзя: пришлось бы думать, что речь о смерти. Ещё важнее возвратная форма: MARTWIĆ SIĘ значит «беспокоиться, волноваться» и это одно из самых частых польских слов, тогда как ZMARTWIĆ SIĘ — однократное «расстроиться» от конкретной новости. Так один корень дал в польском целое поле тревоги, а в русском остался только при смерти." }
  - { kind: government, text: "Переходный, совершенного вида: ZMARTWIĆ KOGO (винительный) CZYM (творительный) — ZMARTWIŁ MATKĘ MILCZENIEM «огорчил мать молчанием». Возвратная форма ZMARTWIĆ SIĘ присоединяет причину творительным или союзом ŻE: ZMARTWIŁA SIĘ WYNIKIEM, ZMARTWIŁ SIĘ, ŻE NIE ZADZWONIŁ. Пара по виду: MARTWIĆ несовершенный, ZMARTWIĆ совершенный. Отглагольное существительное ZMARTWIENIE «огорчение» склоняется как обычное слово на -IE. Страдательное причастие ZMARTWIONY работает и как прилагательное: ZMARTWIONY OJCIEC «огорчённый отец»." }
  - { kind: usage, text: "Запретительное повеление требует несовершенного вида: NIE MARTW SIĘ «не беспокойся», и это именно MARTW, а не ZMARTW — отрицательный приказ с совершенным видом по-польски не строится. Так же NIE MARTWCIE SIĘ, NIE MARTW MATKI. Зато утвердительное повеление от совершенного вида обычно: ZMARTW SIĘ DOPIERO WTEDY, GDY WYNIKI BĘDĄ PEWNE. Русский в этом месте ведёт себя так же — «не беспокойся», а не «не побеспокойся», — так что правило переносится из родного языка без усилий, если про него вспомнить." }
  - { kind: pronunciation, text: "Читается «зма́ртвиць», ударение на предпоследнем слоге из двух. Начальное ZM звучит слитно, без гласной между з и м. Конечное Ć это «ць», мягкое и короткое. В причастии ZMARTWIONY сочетание IO даёт «ё»: «змартвё́ны», четыре слога. В существительном ZMARTWIENIE слышно «змартвене», с мягким в перед е. В форме ZMARTWIWSZY сочетание WSZ произносится «вш»: «змартви́вшы»." }
