notes:
  - { kind: usage, text: "Существительное среднего рода: mleko, mleka, mleku. Множественное mleka значит «сорта молока»." }
  - { kind: government, text: "«Стакан молока» — szklanka mleka, родительный падеж, как и в русском." }
  - { kind: usage, text: "Прилагательное — mleczny: produkty mleczne «молочные продукты», Droga Mleczna «Млечный Путь»." }
  - { kind: usage, text: "Устойчиво: kraj mlekiem i miodem płynący «страна, текущая молоком и мёдом», krew z mlekiem «кровь с молоком»." }
collocations:
  - { pl: "szklanka mleka", ru: "стакан молока" }
  - { pl: "kawa z mlekiem", ru: "кофе с молоком" }
  - { pl: "produkty mleczne", ru: "молочные продукты" }
etymology: "Праславянское *melko — то же слово, что русское «молоко». Различие закономерное: польскому mle- отвечает русское полногласие «моло-», как в głowa «голова», droga «дорога»."
memory: "mleko = «молоко», и различие регулярное: польское mle- против русского «моло-». То же чередование в głowa «голова» и krowa «корова». Прилагательное — mleczny, отсюда Droga Mleczna «Млечный Путь»."
idioms:
