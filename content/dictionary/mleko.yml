  - { pl: "kawa z mlekiem", ru: "кофе с молоком" }
  - { pl: "produkty mleczne", ru: "молочные продукты" }
etymology: "Праславянское *melko — то же слово, что русское «молоко». Различие закономерное: польскому mle- отвечает русское полногласие «моло-», как в głowa «голова», droga «дорога»."
memory: "mleko = «молоко», и различие регулярное: польское mle- против русского «моло-». То же чередование в głowa «голова» и krowa «корова». Прилагательное — mleczny, отсюда Droga Mleczna «Млечный Путь»."
