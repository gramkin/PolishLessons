notes:
  - { kind: usage, text: "Существительное среднего рода: mleko, mleka, mleku. Множественное mleka значит «сорта молока»." }
  - { kind: government, text: "«Стакан молока» — szklanka mleka, родительный падеж, как и в русском." }
  - { kind: usage, text: "Прилагательное — mleczny: produkty mleczne «молочные продукты», Droga Mleczna «Млечный Путь»." }
  - { kind: usage, text: "Устойчиво: kraj mlekiem i miodem płynący «страна, текущая молоком и мёдом», krew z mlekiem «кровь с молоком»." }
collocations:
