# review
id: schody
format: 2
lemma: "schody"
rank: 1676
pos: noun
pron: { cyr: "схо́ды" }
senses:
  - id: stairs
    ru: "лестница, ступеньки"
    examples:
      - pl: "Są schody."
        ru: "Есть лестница."
        source: { kind: translated, id: 12213552 }
      - pl: "Ależ wąskie schody!"
        ru: "Какая узкая лестница!"
        source: { kind: translated, id: 935210 }
      - pl: "Uwaga na nogi, schody są strome."
        ru: "Осторожно с ногами, лестница крутая."
        source: { kind: translated, id: 930265 }
  - id: on-stairs
    ru: "по лестнице, с лестницы"
    examples:
      - pl: "Wejdź po schodach."
        ru: "Поднимись по лестнице."
        source: { kind: translated, id: 5240094 }
      - pl: "Zeszła po schodach."
        ru: "Она спустилась по лестнице."
        source: { kind: translated, id: 404509 }
      - pl: "Spadł ze schodów."
        ru: "Он упал с лестницы."
        source: { kind: translated, id: 442979 }
notes:
  - { kind: usage, text: "Слово только множественного числа (plurale tantum), как русские «сани» или «брюки»: единственного числа у него нет вовсе." }
  - { kind: government, text: "«По лестнице» — po schodach (предложный), «с лестницы» — ze schodów (родительный): spadł ze schodów «он упал с лестницы»." }
  - { kind: usage, text: "Идиома zaczynają się schody значит «вот тут-то и начинаются трудности», буквально «начинаются ступеньки»." }
  - { kind: usage, text: "Отдельная ступенька — stopień; лестничная клетка — klatka schodowa." }
collocations:
  - { pl: "po schodach", ru: "по лестнице" }
  - { pl: "ze schodów", ru: "с лестницы" }
  - { pl: "zaczynają się schody", ru: "вот тут и начинаются трудности" }
etymology: "От schodzić «сходить, спускаться» (s- + chodzić «ходить»). Русская «лестница» построена от «лезть» — другая метафора, но обе о движении вверх и вниз."
memory: "schody = «лестница», и слово только множественного числа, как русские «сани». Падежи: po schodach «по лестнице», ze schodów «с лестницы». Идиома zaczynają się schody — «вот тут и начинаются трудности»."
idioms:
