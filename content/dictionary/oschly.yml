etymology: "Образовано от OSCHNĄĆ «обсохнуть», то есть O- и SCHNĄĆ «сохнуть», с тем же корнем, что SUCHY «сухой». Переносное «чёрствый, холодный» развилось из «засохший», как и в русском «сухой человек»."
memory: "SCHNĄĆ — «сохнуть», OSCHŁY — «обсохший», то есть сухой человек, сухой тон. Читайте «осхуы», не «ошлы». Говорят только о людях и словах; сухой хлеб — SUCHY CHLEB."
idioms:
