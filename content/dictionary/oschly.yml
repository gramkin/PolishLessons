      - pl: "Ta kobieta wydaje się oschła, ale ma dobre serce."
        ru: "Эта женщина кажется сухой, но у неё доброе сердце."
        source: { kind: authored }
  - id: curt
    ru: "сухой, холодный, неприветливый (о тоне, ответе, письме)"
    examples:
      - pl: "Jej odpowiedź była krótka i oschła."
        ru: "Её ответ был коротким и сухим."
        source: { kind: authored }
      - pl: "Na moje pytanie odpowiedział oschłym tonem."
        ru: "На мой вопрос он ответил сухим тоном."
        source: { kind: authored }
      - pl: "Jego listy były zawsze oschłe."
        ru: "Его письма всегда были сухими."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Слово родственно SUCHY «сухой» и буквально значит «засохший», но говорят его только о людях и манере: OSCHŁY CZŁOWIEK «сухой человек», OSCHŁY TON «сухой тон», OSCHŁA ODPOWIEDŹ «сухой ответ». О хлебе, погоде, дереве или коже OSCHŁY не скажут: там SUCHY, а для чёрствого хлеба — CZERSTWY. Русское «сухой человек» переносится точно, а «сухой хлеб» — нет." }
  - { kind: pronunciation, text: "Читается «о́схуы»: SCH здесь не немецкое «ш», а два звука, S и CH — «сх», как в слове SCHNĄĆ «сохнуть». Ł звучит как «у», ударение на первом слоге. В формах OSCHLI и OSCHLEJSZY Ł чередуется с L: «о́схли», «осхле́йшы»." }
  - { kind: usage, text: "Степени регулярные: OSCHŁY, OSCHLEJSZY, NAJOSCHLEJSZY; перед -EJSZY Ł переходит в L, как в MIŁY — MILSZY. Мужско-личное множественное тоже с L: OSCHLI LUDZIE «сухие люди». Наречие — OSCHLE: ODPOWIEDZIAŁ OSCHLE «ответил сухо». Существительное OSCHŁOŚĆ — «сухость, холодность»." }
collocations:
