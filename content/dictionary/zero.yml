notes:
  - { kind: usage, text: "Существительное среднего рода и оно склоняется: zero, zera, zeru, zerze — в отличие от русского «ноль» мужского рода." }
  - { kind: usage, text: "od zera значит «с нуля»: zaczynać od zera «начинать с нуля». Русская конструкция совпадает." }
  - { kind: usage, text: "poniżej zera — «ниже нуля» (о температуре); zero absolutne — «абсолютный ноль»." }
  - { kind: usage, text: "О человеке zero значит «ничтожество, пустое место»: Ten facet jest zerem «Этот тип — ноль»." }
collocations:
  - { pl: "od zera", ru: "с нуля" }
  - { pl: "poniżej zera", ru: "ниже нуля" }
  - { pl: "zero absolutne", ru: "абсолютный ноль" }
etymology: "Из итальянского zero, которое через арабское sifr «пустой» восходит к тому же источнику, что и «цифра». Русское «ноль» пришло из латинского nullus через немецкий, так что слова разного происхождения, хотя значат одно."
memory: "zero = «ноль», но в польском это средний род и слово склоняется: od zera «с нуля», poniżej zera «ниже нуля». Переносное значение тоже живое: Jestem zerem «Я ноль, пустое место»."
idioms:
  - { pl: "od zera", ru: "с нуля" }
  - { pl: "poniżej zera", ru: "ниже нуля" }
  - { pl: "zero absolutne", ru: "абсолютный ноль" }
  - { pl: "ogolony na zero", ru: "обритый наголо" }
