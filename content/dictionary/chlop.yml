etymology: "Из праславянского *xolpъ — того же слова, что русский «холоп». Исходно оно значило просто «работник, зависимый человек», а дальше языки развели его в разные стороны: русский к рабству и презрению, польский к крестьянству и мужицкой основательности. Отсюда chłopak «парень», chłopiec «мальчик», chłopski и chłopstwo «крестьянство»."
memory: "chłop — «крестьянин, мужик», и это русский «холоп», только с обратным знаком: там презрение, здесь уважение. Запомните заодно дательный падеж: chłopu, а не «chłopowi», по короткому списку вместе с panu, bratu и psu."
idioms:
  - { pl: "chłop na schwał", ru: "мужик хоть куда" }
  - { pl: "kawał chłopa", ru: "здоровенный мужик" }
