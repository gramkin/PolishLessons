notes:
  - { kind: false-friend, text: "ОДНО СЛОВО, ДВЕ ПРОТИВОПОЛОЖНЫЕ ОЦЕНКИ. Польское chłop и русский «холоп» — одно праславянское слово. Но русский увёл его в брань: холоп это раб, прислужник, человек без достоинства. В польском вышло наоборот: chłop значит «крестьянин» нейтрально и «мужик» одобрительно — równy chłop «свой парень», chłop na schwał «мужик хоть куда». Переводить chłop как «холоп» нельзя ни в одном контексте." }
  - { kind: usage, text: "ДАТЕЛЬНЫЙ НА -U, А НЕ НА -OWI. Chłop даёт chłopu, и это небольшой закрытый список мужских существительных с дательным на -u: pan → panu, brat → bratu, ojciec → ojcu, pies → psu, Bóg → Bogu, chłopiec → chłopcu, ksiądz → księdzu, kot → kotu, diabeł → diabłu. Все прочие берут -owi. Список короткий, и выучить его стоит целиком." }
  - { kind: pronunciation, text: "ch звучит как х, ł как короткое у: «хуоп». В предложном и звательном падеже p смягчается: chłopie. Именительный множественного chłopi — мужско-личный, с мягким окончанием, а винительный множественного совпадает с родительным: widzę chłopów." }
