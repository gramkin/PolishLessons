# review
id: wymyslic
format: 2
lemma: "wymyślić"
rank: 896
pos: verb
aspect: perf
pron: { cyr: "вымы́сьлиць" }
senses:
  - id: think-up
    ru: "придумать"
    examples:
      - pl: "Musimy coś wymyślić."
        ru: "Нам надо что-то придумать."
        source: { kind: translated, id: 10558519 }
      - pl: "Musimy wymyślić plan."
        ru: "Нам надо придумать план."
        source: { kind: translated, id: 7705638 }
      - pl: "Wymyślę coś."
        ru: "Я что-нибудь придумаю."
        source: { kind: translated, id: 7705628 }
  - id: invent
    ru: "изобрести"
    examples:
      - pl: "Jestem ciekaw kto to wymyślił."
        ru: "Интересно, кто это изобрёл."
        source: { kind: translated, id: 1352177 }
      - pl: "Oni wymyślili komputer nowej generacji."
        ru: "Они изобрели компьютер нового поколения."
        source: { kind: translated, id: 5933096 }
      - pl: "Yona Wallach była postmodernistką na 20 lat zanim wymyślono termin „postmodernizm”."
        ru: "Йона Валлах была постмодернисткой за двадцать лет до того, как придумали термин «постмодернизм»."
        source: { kind: translated, id: 643805 }
  - id: made-up
    ru: "wymyślony — выдуманный, вымышленный"
    examples:
      - pl: "Jeśli nawet to nie prawda, to dobrze wymyślone."
        ru: "Если это и неправда, то хорошо придумано."
        source: { kind: translated, id: 349154 }
      - pl: "Wszystkie wydarzenia opisane w tej historii są wymyślone."
        ru: "Все события, описанные в этой истории, вымышлены."
        source: { kind: translated, id: 529690 }
      - pl: "Kronum to nowy sport drużynowy, wymyślony w 2008 roku."
        ru: "Кронум — новый командный вид спорта, придуманный в 2008 году."
        source: { kind: translated, id: 3704087 }
notes:
  - { kind: usage, text: "Разбирается прозрачно: wy- + myśleć «думать». Русское «выдумать» собрано по той же модели, так что слово запоминается сразу." }
  - { kind: usage, text: "Coś wymyślę — «Я что-нибудь придумаю», одна из самых частых разговорных реплик. Так же Musimy coś wymyślić «Нам надо что-то придумать»." }
  - { kind: usage, text: "Причастие wymyślony значит «вымышленный»: postacie wymyślone «вымышленные персонажи», wymyślona historia «выдуманная история»." }
  - { kind: false-friend, text: "Осторожно с несовершенным видом: wymyślać komuś значит не «придумывать кому-то», а «ругать кого-то, обзывать». Значение совсем другое." }
collocations:
  - { pl: "coś wymyślę", ru: "я что-нибудь придумаю" }
  - { pl: "wymyślić plan", ru: "придумать план" }
  - { pl: "dobrze wymyślone", ru: "хорошо придумано" }
  - { pl: "wymyślona historia", ru: "выдуманная история" }
family:
  - { pl: "myśleć", ru: "думать", relation: root, id: myslec }
  - { pl: "wymyślać", ru: "придумывать", relation: aspect }
  - { pl: "pomysł", ru: "идея, задумка", relation: derived }
etymology: "Приставка wy- + myśleć «думать». Русское «выдумать» собрано ровно так же, морфема в морфему, а «мысль» — прямая родня польскому myśl."
memory: "wymyślić — «придумать», буквально «выдумать»: wy- + myśleć. Coś wymyślę «Я что-нибудь придумаю» — частая реплика. Но осторожно: несовершенное wymyślać komuś значит «ругать кого-то», а не «придумывать»."
idioms:
  - { pl: "prochu nie wymyśli", ru: "пороха не выдумает" }
  - { pl: "dobrze wymyślone", ru: "хорошо придумано" }
  - { pl: "coś wymyślę", ru: "я что-нибудь придумаю" }
