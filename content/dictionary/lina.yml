id: lina
format: 2
lemma: "lina"
rank: 1847
pos: noun
pron: { cyr: "ли́на" }
senses:
  - id: rope
    ru: "верёвка, канат, трос"
    examples:
      - pl: "Trzymaj linę."
        ru: "Держи верёвку."
        source: { kind: translated, id: 10596028 }
      - pl: "Trzymaj mocno linę."
        ru: "Держи верёвку крепко."
        source: { kind: translated, id: 751835 }
      - pl: "Ktoś przeciął linę."
        ru: "Кто-то перерезал верёвку."
        source: { kind: translated, id: 3868105 }
  - id: rope-hold
    ru: "верёвка (держаться, отрезать, метры верёвки)"
    examples:
      - pl: "Chwyciłem linę aby nie upaść."
        ru: "Я схватился за верёвку, чтобы не упасть."
        source: { kind: translated, id: 8745884 }
      - pl: "Odciął dwa metry liny."
        ru: "Он отрезал два метра верёвки."
        source: { kind: translated, id: 526933 }
      - pl: "Mam tylko pięćdziesiąt metrów liny."
        ru: "У меня всего пятьдесят метров верёвки."
        source: { kind: translated, id: 3297252 }
notes:
  - { kind: false-friend, text: "Форма linie в таблице ниже принадлежит другому слову — linia «линия»: narysowali dwie linie значит «они начертили две линии», а не что-либо про верёвку." }
  - { kind: government, text: "Держаться за верёвку — trzymać się liny (родительный падеж); схватить верёвку — chwycić linę (винительный)." }
  - { kind: usage, text: "przeciąganie liny — «перетягивание каната», и в прямом смысле, и переносно о споре." }
  - { kind: usage, text: "Более тонкая верёвка — sznur или sznurek; lina это канат, трос, что-то толстое и прочное." }
collocations:
  - { pl: "trzymać linę", ru: "держать верёвку" }
