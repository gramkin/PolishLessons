etymology: "Праславянское *lina — родственно русскому «линь», названию троса. Русский «канат» пришёл из греческого, поэтому слова не совпадают."
memory: "lina — «верёвка, канат, трос»: trzymać linę, metr liny. Осторожно: форма linie принадлежит другому слову, linia «линия»."
