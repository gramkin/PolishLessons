notes:
  - { kind: false-friend, text: "KORZYŚĆ и русская «корысть» — это одно и то же праславянское слово, разошедшееся в оценке. Польское korzyść нейтрально и означает «польза, выгода»: korzyść z inwestycji, na korzyść klienta, так говорят в суде и в бухгалтерии. Русская «корысть» осуждает, это своекорыстие. Если нужно именно оно, по-польски будет INTERESOWNOŚĆ или CHCIWOŚĆ, но никак не korzyść." }
  - { kind: pronunciation, text: "Форм всего шесть, и одна из них делает почти всю работу: KORZYŚCI — это родительный, дательный и предложный единственного, а заодно именительный, винительный и родительный множественного, шесть падежей в одной форме. Так устроены женские слова на -ść: część, kość, miłość. Запоминать поэтому нужно не падежи, а три оставшихся окончания: -ą, -om, -ami, -ach." }
collocations:
  - { pl: "na korzyść kogoś", ru: "в пользу кого-то" }
  - { pl: "odnieść korzyść", ru: "извлечь выгоду" }
  - { pl: "korzyść obopólna", ru: "обоюдная выгода" }
family:
  - { pl: "korzystny", ru: "выгодный", relation: derived }
  - { pl: "korzystać", ru: "пользоваться", relation: root, id: korzystac }
  - { pl: "strata", ru: "убыток", relation: antonym, id: strata }
etymology: "Из праславянского *koristь — ровно то слово, от которого пошла русская «корысть». Общее исходное значение было «добыча, прибыток», без осуждения. Польский оставил его нейтральным и построил на нём korzystny «выгодный» и korzystać «пользоваться», а русский сдвинул в сторону упрёка, и «корысть» стала пороком. Одно слово, две разные судьбы."
memory: "korzyść — это «польза», а не «корысть»: слово нейтральное. И форма korzyści одна на шесть падежей."
