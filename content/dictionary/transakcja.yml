# review
id: transakcja
format: 2
lemma: "transakcja"
rank: 3821
pos: noun
pron: { cyr: "транса́кцья" }
senses:
  - id: transaction
    ru: "сделка; транзакция"
    examples:
      - pl: "Transakcja została zawarta u notariusza."
        ru: "Сделку заключили у нотариуса."
        source: { kind: authored }
      - pl: "Bank odrzucił transakcję kartą."
        ru: "Банк отклонил операцию по карте."
        source: { kind: authored }
      - pl: "To była najlepsza transakcja w jego życiu."
        ru: "Это была лучшая сделка в его жизни."
        source: { kind: authored }
      - pl: "Każda transakcja jest zapisana w systemie."
        ru: "Каждая транзакция записана в системе."
        source: { kind: authored }
      - pl: "Transakcja na giełdzie trwała kilka sekund."
        ru: "Сделка на бирже заняла несколько секунд."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "TRANSAKCJA — и «сделка» купли-продажи, и банковская «транзакция»: TRANSAKCJA KARTĄ, «оплата картой». В разговоре о сделке чаще говорят INTERES или UMOWA: ZROBILIŚMY DOBRY INTERES, «мы провернули выгодное дело»." }
  - { kind: usage, text: "Восемь живых форм, женский род на -CJA. Родительный, дательный и местный — TRANSAKCJI. Архаичная форма TRANSAKCYJ и звательный не даются." }
  - { kind: government, text: "Заключить сделку — ZAWRZEĆ TRANSAKCJĘ, винительный. Оплата картой — TRANSAKCJA KARTĄ, творительный без предлога. Сделка купли-продажи — TRANSAKCJA KUPNA-SPRZEDAŻY." }
  - { kind: pronunciation, text: "Читается «транса́кцья», ударение на предпоследнем слоге. CJA — «цья»." }
collocations:
  - { pl: "zawrzeć transakcję", ru: "заключить сделку" }
  - { pl: "transakcja kartą", ru: "оплата картой" }
  - { pl: "transakcja kupna-sprzedaży", ru: "сделка купли-продажи" }
family:
  - { pl: "transakcyjny", ru: "транзакционный", relation: derived }
  - { pl: "zawrzeć transakcję", ru: "заключить сделку", relation: derived }
  - { pl: "transakcja kartą", ru: "оплата картой", relation: derived }
etymology: "Из латинского слова со значением «завершение, улаживание дела». Русская «транзакция» — то же слово, но в польском оно шире и значит любую сделку."
memory: "Transakcja — сделка и транзакция. Читается «транса́кцья». Zawrzeć transakcję — заключить сделку. Dobić targu — ударить по рукам."
idioms:
  - { pl: "dobić targu", ru: "ударить по рукам, сторговаться" }
formExamplesSkip:
  - { form: "transakcyj", reason: "архаичная форма родительного множественного; сейчас говорят TRANSAKCJI" }
  - { form: "transakcjo", reason: "звательный падеж у этого слова не употребляется" }
