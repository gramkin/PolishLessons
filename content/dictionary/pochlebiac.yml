      - pl: "Pochlebiał jej, żeby coś zyskać."
        ru: "Он льстил ей, чтобы чего-то добиться."
        source: { kind: authored }
      - pl: "Przestań mi pochlebiać."
        ru: "Перестань мне льстить."
        source: { kind: authored }
notes:
  - { kind: government, text: "Дательный падеж: pochlebiać komuś «льстить кому-л.» — точно как в русском." }
  - { kind: usage, text: "Совершенный вид — pochlebić. Возвратное pochlebiać sobie значит «тешить себя, льстить себе»." }
  - { kind: false-friend, text: "Созвучие с chleb «хлеб» случайно: слово родственно chlubić się «хвалиться», chluba «хвала»." }
  - { kind: usage, text: "Рядом стоят pochlebstwo «лесть» и pochlebny «лестный»." }
collocations:
  - { pl: "pochlebiać komuś", ru: "льстить кому-л." }
  - { pl: "pochlebiać sobie", ru: "тешить себя" }
etymology: "Родственно chlubić się «хвалиться» и chluba «хвала». С chleb «хлеб» связи нет."
memory: "pochlebiać komuś — «льстить кому-л.», с дательным, как в русском. Существительное pochlebstwo «лесть», прилагательное pochlebny «лестный»."
idioms:
