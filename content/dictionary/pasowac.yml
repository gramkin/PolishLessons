# review
id: pasowac
format: 2
lemma: "pasować"
rank: 607
pos: verb
aspect: imperf
pron: { cyr: "пасо́ваць" }
senses:
  - id: suit-time
    ru: "подходить, быть удобным (кому-л. — дательный)"
    note: "Pasuje mi dowolny dzień «Мне подходит любой день»."
    examples:
      - pl: "Pasuje mi dowolny dzień."
        ru: "Мне подходит любой день."
        source: { kind: tatoeba, id: 1480694 }
      - pl: "O ósmej trzydzieści Ci pasuje?"
        ru: "Полдевятого тебя бы устроило?"
        source: { kind: tatoeba, id: 13785276 }
      - pl: "Czy trzecia będzie ci pasować?"
        ru: "Три часа тебе подойдут?"
        source: { kind: translated, id: 930113 }
  - id: match
    ru: "подходить, сочетаться (do czegoś — родительный)"
    note: "pasować DO czegoś: pasuje do sukienki, pasuje do mięsa."
    examples:
      - pl: "Czerwone wino dobrze pasuje do mięsa."
        ru: "Красное вино хорошо сочетается с мясом."
        source: { kind: tatoeba, id: 6160239 }
      - pl: "Wybrała kapelusz, który pasował do jej sukienki."
        ru: "Она выбрала шляпу, подходившую к её платью."
        source: { kind: translated, id: 7875597 }
      - pl: "Wybrał skarpetki pasujące do garnituru."
        ru: "Он выбрал носки, подходящие к костюму."
        source: { kind: translated, id: 450188 }
  - id: fit
    ru: "быть впору (об одежде, обуви)"
    note: "pasują jak ulał «сидят как влитые»."
    examples:
      - pl: "Te buty nie pasują."
        ru: "Эти ботинки не подходят."
        source: { kind: translated, id: 6046641 }
      - pl: "Pasują jak ulał."
        ru: "Сидят как влитые."
        source: { kind: translated, id: 6328207 }
      - pl: "Pasują ci te okulary."
        ru: "Тебе идут эти очки."
        source: { kind: translated, id: 6160273 }
  - id: belong
    ru: "вписываться, быть на своём месте"
    note: "Nie pasuję do ciebie «Я тебе не пара»."
    examples:
      - pl: "Nie pasuję do ciebie."
        ru: "Я тебе не пара."
        source: { kind: translated, id: 3744085 }
      - pl: "Czułem, że naprawdę tam pasuję."
        ru: "Я чувствовал, что мне там действительно место."
        source: { kind: translated, id: 12058123 }
      - pl: "Tylko dlatego, że pasujesz, nie znaczy, że jesteś we właściwym miejscu."
        ru: "То, что ты вписываешься, ещё не значит, что ты на своём месте."
        source: { kind: translated, id: 13787881 }
notes:
  - { kind: government, text: "Два управления, и держать их надо врозь. Кому подходит — дательный: pasuje mi, czy pasuje ci trzecia? К чему подходит — предлог do с родительным: pasuje do sukienki, pasuje do mięsa." }
  - { kind: usage, text: "Это главный польский глагол для согласования времени и встреч: Czy pasuje ci o piątej? «Тебе удобно в пять?» Русский здесь скажет «удобно» или «устроит», а не «подходит»." }
  - { kind: false-friend, text: "Русское «пасовать» в смысле «сдаваться, отступать» по-польски spasować или poddać się. Обиходное pasować значит совсем другое — «подходить»." }
  - { kind: usage, text: "Будущее время описательное: będzie pasować или będzie pasowało — Wpadnij, kiedy ci będzie pasować." }
  - { kind: usage, text: "Формы на pasowan- принадлежат отдельному, историческому значению «посвящать в рыцари»: pasowany na rycerza «посвящённый в рыцари», pasowanie na rycerza «посвящение в рыцари»." }
collocations:
  - { pl: "pasuje mi", ru: "мне подходит" }
  - { pl: "pasować do czegoś", ru: "подходить к чему-либо" }
  - { pl: "pasować jak ulał", ru: "сидеть как влитое" }
  - { pl: "Czy ci pasuje?", ru: "Тебе удобно?" }
family:
  - { pl: "spasować", ru: "спасовать", relation: derived }
  - { pl: "pasujący", ru: "подходящий", relation: derived }
  - { pl: "dopasować", ru: "подогнать", relation: derived }
etymology: "Из немецкого passen «подходить» — то же заимствование, что и русское «пасовать», только значения разошлись: русский взял карточное «пас», поляк — бытовое «подходить»."
memory: "pasować — «подходить», и это один из самых нужных глаголов для договорённостей: Pasuje mi dowolny dzień, Czy pasuje ci o piątej? Держите врозь два управления: кому подходит — дательный (pasuje mi), а к чему подходит — do с родительным (pasuje do sukienki). Не путайте с русским «пасовать» в смысле «сдаваться» — это spasować. А формы на pasowan- принадлежат отдельному, рыцарскому значению: pasowany na rycerza."
idioms:
  - { pl: "pasuje mi", ru: "мне подходит" }
  - { pl: "pasować jak ulał", ru: "сидеть как влитое" }
  - { pl: "pasować jak pięść do nosa", ru: "идти как корове седло" }
  - { pl: "pasowanie na rycerza", ru: "посвящение в рыцари" }
