# review
id: wyprawiac
format: 2
lemma: "wyprawiać"
rank: 1278
pos: verb
pron: { cyr: "выпра́вяць" }
senses:
  - id: throw-party
    ru: "устраивать (приём, свадьбу)"
    examples:
      - pl: "Wyprawiali córce wesele na sto osób."
        ru: "Они устраивали дочери свадьбу на сто человек."
        source: { kind: authored }
      - pl: "Co roku wyprawia babci urodziny."
        ru: "Каждый год он устраивает бабушке день рождения."
        source: { kind: authored }
  - id: get-up-to
    ru: "вытворять, выделывать"
    examples:
      - pl: "Co ty wyprawiasz?"
        ru: "Что ты вытворяешь?"
        source: { kind: authored }
      - pl: "Dzieci wyprawiały takie rzeczy, że sąsiedzi się skarżyli."
        ru: "Дети вытворяли такое, что соседи жаловались."
        source: { kind: authored }
  - id: send-off
    ru: "отправлять, снаряжать (в путь)"
    examples:
      - pl: "Matka wyprawiała go w drogę od świtu."
        ru: "Мать снаряжала его в путь с рассвета."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "WYPRAWIAĆ — ЭТО НЕ «ВЫПРАВЛЯТЬ». Русское «выправлять» значит «распрямлять, исправлять», и по-польски это PROSTOWAĆ или KORYGOWAĆ. Польское wyprawiać живёт в трёх других смыслах: «устраивать» (wyprawiać wesele), «вытворять» (co ty wyprawiasz?) и «снаряжать в путь» (wyprawiać kogoś w drogę). Ни одного из них у русского глагола нет." }
  - { kind: usage, text: "CO TY WYPRAWIASZ? — «что ты вытворяешь?» — самая частая встреча с этим словом. Оборот всегда с оттенком неодобрения или изумления и годится и для ребёнка, и для взрослого. В прошедшем времени то же самое: co ty wyprawiałeś wczoraj?" }
  - { kind: usage, text: "Первое значение русскому всё-таки знакомо, только через другой глагол: WYPRAWIAĆ WESELE — это наше «СПРАВИТЬ свадьбу», и корень там один и тот же, праславянское *prav-. Так что «справить» и wyprawiać — ближайшая пара, а «выправлять» лишь похоже внешне." }
collocations:
  - { pl: "wyprawiać wesele", ru: "устраивать свадьбу" }
  - { pl: "co ty wyprawiasz?", ru: "что ты вытворяешь?" }
  - { pl: "wyprawiać kogoś w drogę", ru: "снаряжать кого-л. в путь" }
family:
  - { pl: "wyprawić", ru: "устроить, отправить (сов.)", relation: aspect }
  - { pl: "wyprawa", ru: "поход, экспедиция", relation: root }
  - { pl: "poprawiać", ru: "исправлять", relation: root }
etymology: "Приставка wy- и prawić, из праславянского *praviti «направлять, делать правильным», от *pravъ «прямой, правый». Русское «справить» (свадьбу) выросло из того же гнезда и значит ровно то же, что wyprawiać wesele. Сюда же польская wyprawa «поход, экспедиция» — буквально «снаряжение в путь», и наше «отправить»."
memory: "wyprawiać — это не «выправлять», а «устраивать», «вытворять» и «снаряжать в путь». Опора для первого значения — русское «справить свадьбу»: wyprawiać wesele, тот же корень. А «выправлять» по-польски prostować."
idioms:
  - { pl: "co ty wyprawiasz?", ru: "что ты вытворяешь?" }
  - { pl: "wyprawiać harce", ru: "резвиться, выкидывать номера" }
