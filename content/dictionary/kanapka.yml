# review
id: kanapka
format: 2
lemma: "kanapka"
rank: 2019
pos: noun
pron: { cyr: "кана́пка" }
senses:
  - id: sandwich
    ru: "бутерброд, сэндвич"
    examples:
      - pl: "Kanapka z serem jest na stole."
        ru: "Бутерброд с сыром на столе."
        source: { kind: authored }
      - pl: "Zjedz kanapkę."
        ru: "Съешь бутерброд."
        source: { kind: authored }
      - pl: "Zrobiłam kanapki na drogę."
        ru: "Я сделала бутерброды в дорогу."
        source: { kind: authored }
  - id: canape
    ru: "канапе, маленький бутерброд на закуску"
    examples:
      - pl: "Na przyjęciu podawano kanapki z łososiem."
        ru: "На приёме подавали канапе с лососем."
        source: { kind: authored }
      - pl: "Kanapki na jeden kęs zniknęły pierwsze."
        ru: "Канапе на один укус исчезли первыми."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Главная ловушка слова. Польское kanapka — это ОБЫЧНЫЙ бутерброд, то, что по-русски «сэндвич» или «бутерброд»: хлеб с сыром, который берут на работу. Русское «канапе» значит совсем другое — крошечную закуску на шпажке для приёма. Так что kanapka z serem это не «канапе с сыром», а просто бутерброд." }
  - { kind: usage, text: "Буквально слово значит «диванчик»: kanapka — уменьшительное от kanapa «диван». Дательный и предложный совпадают: kanapce (na kanapce leży ogórek). Родительный множественного — kanapek." }
  - { kind: government, text: "Начинка идёт с предлогом z и творительным падежом: kanapka z serem, kanapka z szynką, ровно как русское «бутерброд с сыром». Внимание: kanapa (без -ka) значит «диван», а не «канапе»." }
  - { kind: pronunciation, text: "Звательный падеж у неодушевлённых существительных формально есть, но в живой речи почти не встречается: его берегут для стихов, песен и шутливого обращения к вещи. Примеры в этом слоте именно такие — запоминать их как образец повседневной речи не нужно." }
collocations:
  - { pl: "kanapka z serem", ru: "бутерброд с сыром" }
  - { pl: "zrobić kanapki", ru: "сделать бутерброды" }
  - { pl: "kanapka z szynką", ru: "бутерброд с ветчиной" }
family:
  - { pl: "kanapa", ru: "диван", relation: root }
  - { pl: "kanapkowy", ru: "бутербродный", relation: derived }
etymology: "Уменьшительное от kanapa «диван», а kanapa — из французского canapé, которое через латинское conopeum идёт к греческому κωνώπιον «ложе с сеткой от комаров» (от κώνωψ «комар»). Бутерброд назван «диванчиком» потому, что ломтик хлеба служит ложем для начинки. Русское «канапе» — то же французское слово, но взятое прямо и в узком смысле закуски."
memory: "kanapka буквально «диванчик», от kanapa «диван»: хлеб — ложе для начинки. И помните главное: это обычный бутерброд, а не русское «канапе»."
idioms:
  - { pl: "człowiek-kanapka", ru: "человек-сэндвич (с рекламными щитами)" }
  - { pl: "kanapka z niczym", ru: "бутерброд с пустотой, пустой бутерброд" }
