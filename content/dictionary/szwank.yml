# review
id: szwank
format: 2
lemma: "szwank"
rank: 2118
pos: noun
pron: { cyr: "шванк" }
senses:
  - id: unharmed
    ru: "вред, ущерб (в обороте bez szwanku «невредимым»)"
    examples:
      - pl: "Udało mi się ujść bez szwanku."
        ru: "Мне удалось уйти невредимым."
        source: { kind: translated, id: 359363 }
      - pl: "Ze stu żołnierzy dziesięciu wróciło bez szwanku, reszta zginęła."
        ru: "Из ста солдат десять вернулись невредимыми, остальные погибли."
        source: { kind: translated, id: 960837 }
      - pl: "Wyszedł z wypadku bez szwanku."
        ru: "Он вышел из аварии невредимым."
        source: { kind: authored }
  - id: jeopardy
    ru: "урон (narazić na szwank «поставить под удар»)"
    examples:
      - pl: "Naraził na szwank swoją reputację."
        ru: "Он поставил под удар свою репутацию."
        source: { kind: authored }
      - pl: "To naraziło na szwank całą sprawę."
        ru: "Это поставило под удар всё дело."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Слово-ископаемое: вне двух оборотов практически не встречается. bez szwanku «невредимым» и narazić coś na szwank «поставить что-л. под удар»." }
  - { kind: government, text: "В первом обороте — родительный после bez; во втором — винительный после na." }
  - { kind: false-friend, text: "Не «шванк» и не «шлак». Из немецкого Schwank «выходка, неприятность»." }
  - { kind: usage, text: "Обе формы в корпусе — szwanku, то есть слово живёт почти только в родительном падеже." }
collocations:
  - { pl: "bez szwanku", ru: "невредимым" }
  - { pl: "narazić na szwank", ru: "поставить под удар" }
etymology: "Из немецкого Schwank «выходка, неприятный случай»."
