# review
id: kwestia
format: 2
lemma: "kwestia"
rank: 1163
pos: noun
pron: { cyr: "кве́стья" }
senses:
  - id: issue
    ru: "вопрос, проблема"
    examples:
      - pl: "Kwestia opinii."
        ru: "Вопрос мнения."
        source: { kind: translated, id: 8748428 }
      - pl: "To kwestia gustu."
        ru: "Это дело вкуса."
        source: { kind: translated, id: 2372612 }
      - pl: "Omówiliśmy tę kwestię."
        ru: "Мы обсудили этот вопрос."
        source: { kind: translated, id: 410699 }
  - id: matter-of
    ru: "kwestia czegoś — вопрос чего-то, дело чего-то"
    examples:
      - pl: "To kwestia zasad."
        ru: "Это вопрос принципа."
        source: { kind: translated, id: 1060669 }
      - pl: "Ona jest zdania, że wszystko jest kwestią pieniędzy."
        ru: "Она считает, что всё упирается в деньги."
        source: { kind: translated, id: 348963 }
  - id: line
    ru: "реплика (актёрская)"
    examples:
      - pl: "Aktorzy muszą zapamiętać kwestie."
        ru: "Актёры должны запомнить реплики."
        source: { kind: translated, id: 13561893 }
      - pl: "To jest MOJA kwestia!"
        ru: "Это МОЯ реплика!"
        source: { kind: translated, id: 532864 }
notes:
  - { kind: usage, text: "Женский род на -ia: kwestia, kwestii, kwestię. Родительный, дательный и предложный совпадают — kwestii." }
  - { kind: usage, text: "kwestia czegoś значит «вопрос, дело чего-то»: kwestia gustu «дело вкуса», kwestia czasu «вопрос времени», kwestia pieniędzy «вопрос денег»." }
  - { kind: false-friend, text: "В театре kwestia — это реплика актёра, а не «вопрос». To moja kwestia «Это моя реплика»." }
  - { kind: usage, text: "w kwestii czegoś значит «по вопросу чего-то, насчёт»: wybredny w kwestii jedzenia «привередливый в еде»." }
collocations:
  - { pl: "kwestia gustu", ru: "дело вкуса" }
  - { pl: "kwestia czasu", ru: "вопрос времени" }
  - { pl: "w tej kwestii", ru: "по этому вопросу" }
  - { pl: "omówić kwestię", ru: "обсудить вопрос" }
family:
  - { pl: "kwestionować", ru: "подвергать сомнению", relation: derived }
  - { pl: "kwestionariusz", ru: "анкета, опросник", relation: derived }
etymology: "Из латинского quaestio «вопрос, расследование», от quaerere «искать, спрашивать». Русское «вопрос» — своё слово, но книжное «квестия» в старых текстах встречалось."
memory: "kwestia — «вопрос, проблема», женский род. Оборот kwestia czegoś значит «дело чего-то»: kwestia gustu «дело вкуса», kwestia czasu «вопрос времени». А в театре kwestia — это реплика актёра."
idioms:
  - { pl: "kwestia gustu", ru: "дело вкуса" }
  - { pl: "kwestia czasu", ru: "вопрос времени" }
formExamplesSkip:
  - { form: "kwestio", reason: "звательный падеж у этого слова в живой речи не употребляется" }
  - { form: "kwestyj", reason: "устаревший вариант родительного падежа множественного числа; нормой является kwestii" }
