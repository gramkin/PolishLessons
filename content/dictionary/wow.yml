# review
id: wow
format: 2
lemma: "wow"
rank: 1231
pos: interj
pron: { cyr: "уа́у" }
senses:
  - id: amazement
    ru: "вау, ого (восхищение, удивление)"
    examples:
      - pl: "Wow, to jest śnieg!"
        ru: "Вау, это снег!"
        source: { kind: translated, id: 5336480 }
      - pl: "Wow, to jest takie duże."
        ru: "Вау, какое большое."
        source: { kind: translated, id: 5336347 }
      - pl: "Oh wow, szybki jesteś."
        ru: "Ого, ты быстрый."
        source: { kind: translated, id: 3744097 }
  - id: admiration
    ru: "вау (одобрение, восторг)"
    examples:
      - pl: "Wow, ale widok!"
        ru: "Вау, какой вид!"
        source: { kind: authored }
      - pl: "Wow, świetnie to zrobiłeś."
        ru: "Вау, ты отлично это сделал."
        source: { kind: authored }
notes:
  - { kind: register, text: "Заимствование из английского, разговорное и довольно молодёжное. В официальной речи и на письме его не употребляют." }
  - { kind: usage, text: "Не склоняется и не изменяется — как и русское «вау», пришедшее из того же источника." }
  - { kind: usage, text: "Родные польские междометия того же круга — och «ох», ach «ах», o rany «о боже». У них своя, гораздо более длинная история в языке." }
  - { kind: pronunciation, text: "Читается «уау», по английскому образцу, а не побуквенно." }
collocations:
  - { pl: "wow, ale widok", ru: "вау, какой вид" }
  - { pl: "efekt wow", ru: "вау-эффект" }
family:
  - { pl: "och", ru: "ох", relation: derived, id: och }
  - { pl: "ach", ru: "ах", relation: derived, id: ach }
etymology: "Из английского wow. Русское «вау» — то же заимствование и примерно той же свежести: оба языка взяли его из английского в конце XX века."
memory: "wow — «вау», разговорное междометие из английского, не склоняется. Родные польские соседи того же круга — och «ох» и ach «ах», у них своя карточка."
idioms:
