rank: 1402
pos: noun
pron: { cyr: "товажы́стфо" }
senses:
  - id: company
    ru: "общество, компания (чьё-либо присутствие)"
    examples:
      - pl: "Lepiej być samemu niż w złym towarzystwie."
        ru: "Лучше быть одному, чем в плохой компании."
        source: { kind: tatoeba, id: 1589548 }
      - pl: "Bardzo lubię twoje towarzystwo."
        ru: "Мне очень нравится твоё общество."
        source: { kind: translated, id: 626230 }
      - pl: "Z przyjemnością dotrzymam panu towarzystwa."
        ru: "С удовольствием составлю вам компанию."
        source: { kind: translated, id: 3718060 }
  - id: association
    ru: "общество, товарищество (организация)"
    examples:
      - pl: "Towarzystwa ubezpieczeniowe chętnie zatrudniają młodych absolwentów."
        ru: "Страховые общества охотно нанимают молодых выпускников."
        source: { kind: translated, id: 367757 }
      - pl: "Należy do towarzystwa naukowego."
        ru: "Он состоит в научном обществе."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Средний род. Основное значение — «компания, общество» в смысле присутствия рядом: w twoim towarzystwie «в твоём обществе»." }
  - { kind: government, text: "dotrzymać komuś towarzystwa — «составить кому-то компанию», с дательным лица и родительным самого слова." }
  - { kind: usage, text: "Второе значение — организация: towarzystwo ubezpieczeniowe «страховое общество», towarzystwo naukowe «научное общество»." }
  - { kind: false-friend, text: "Не путайте towarzystwo с społeczeństwo. Społeczeństwo — «общество» как социум, народ страны; towarzystwo — круг людей рядом с вами." }
collocations:
  - { pl: "dotrzymać towarzystwa", ru: "составить компанию" }
  - { pl: "w towarzystwie", ru: "в обществе" }
  - { pl: "złe towarzystwo", ru: "дурная компания" }
etymology: "От towarzysz «товарищ», а то — от towar «товар»: изначально «тот, с кем вместе везут товар». Русский «товарищ» — то же самое слово."
memory: "towarzystwo — «компания, общество» в смысле присутствия рядом: Lubię twoje towarzystwo. Запомните оборот dotrzymać komuś towarzystwa «составить компанию». И не путайте со społeczeństwo — это «общество» как социум."
