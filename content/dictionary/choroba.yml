# review
id: choroba
format: 2
lemma: "choroba"
rank: 1033
pos: noun
pron: { cyr: "хоро́ба" }
senses:
  - id: illness
    ru: "болезнь"
    examples:
      - pl: "Życie - śmiertelna choroba przenoszona drogą płciową."
        ru: "Жизнь — смертельная болезнь, передающаяся половым путём."
        source: { kind: translated, id: 566301 }
      - pl: "Ta choroba jest nieuleczalna."
        ru: "Эта болезнь неизлечима."
        source: { kind: translated, id: 4516040 }
      - pl: "Epilepsja to straszna choroba."
        ru: "Эпилепсия — страшная болезнь."
        source: { kind: translated, id: 3745231 }
  - id: named
    ru: "конкретные болезни: choroba morska, choroba serca"
    examples:
      - pl: "Mam chorobę morską."
        ru: "У меня морская болезнь."
        source: { kind: translated, id: 728598 }
      - pl: "Ona ma chorobę serca."
        ru: "У неё болезнь сердца."
        source: { kind: translated, id: 3741161 }
      - pl: "Świnka jest chorobą zakaźną."
        ru: "Свинка — заразная болезнь."
        source: { kind: translated, id: 404527 }
  - id: prevent
    ru: "zapobiegać chorobom — предотвращать болезни"
    note: "Глагол требует дательного падежа, а не винительного, как в русском."
    examples:
      - pl: "Możemy zapobiegać chorobom?"
        ru: "Можно ли предотвращать болезни?"
        source: { kind: translated, id: 3041433 }
      - pl: "Szczepienia pomagają zapobiegać chorobom u dzieci."
        ru: "Прививки помогают предотвращать болезни у детей."
        source: { kind: translated, id: 732916 }
      - pl: "Można się zaszczepić przeciwko wielu chorobom."
        ru: "От многих болезней можно привиться."
        source: { kind: translated, id: 9673315 }
notes:
  - { kind: government, text: "zapobiegać chorobie, zapobiegać chorobom — «предотвращать болезнь, болезни», но с дательным падежом. Русский тут требует винительного, и это частая ошибка." }
  - { kind: government, text: "cierpieć NA chorobę — «страдать болезнью»: предлог na с винительным. Русский использует творительный без предлога, так что конструкцию надо запоминать целиком." }
  - { kind: usage, text: "walczyć z chorobą «бороться с болезнью» — творительный падеж, как и в русском. Zmarł po długiej chorobie «Он умер после долгой болезни»." }
  - { kind: register, text: "В разговорной речи Choroba! — мягкое ругательство вроде «Чёрт!», того же ряда, что cholera. А choroba wie значит «чёрт знает»." }
collocations:
  - { pl: "choroba morska", ru: "морская болезнь" }
  - { pl: "choroba serca", ru: "болезнь сердца" }
  - { pl: "walczyć z chorobą", ru: "бороться с болезнью" }
  - { pl: "po długiej chorobie", ru: "после долгой болезни" }
family:
  - { pl: "chory", ru: "больной", relation: root, id: chory }
  - { pl: "chorować", ru: "болеть", relation: root }
  - { pl: "zdrowie", ru: "здоровье", relation: antonym, id: zdrowie }
etymology: "Праславянское *chvoroba, от *chvorъ «больной» — то же, что русское «хворь, хворый». Русское «болезнь» построено от другого корня, но «хворать» сохранило родство."
memory: "choroba — «болезнь», родня русской «хвори». Главное — падежи: zapobiegać chorobom «предотвращать болезни» требует дательного, а cierpieć NA chorobę «страдать болезнью» — предлога na с винительным."
idioms:
  - { pl: "choroba wie", ru: "чёрт знает" }
  - { pl: "choroba morska", ru: "морская болезнь" }
  - { pl: "każda choroba ma swoje lekarstwo", ru: "на всякую болезнь найдётся лекарство" }
formExamplesSkip:
  - { form: "chorobo", reason: "звательный падеж: к болезни не обращаются, форма не употребляется" }
  - { form: "choroby", cell: "Звательный", reason: "звательный падеж: к предмету или понятию не обращаются" }
