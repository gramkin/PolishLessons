# review
id: pozostawac
format: 2
lemma: "pozostawać"
rank: 2345
pos: verb
aspect: imperf
aspectPair: pozostac
pron: { cyr: "позоста́ваць" }
senses:
  - id: remain
    ru: "оставаться (в каком-л. состоянии)"
    examples:
      - pl: "Podejrzany pozostaje na wolności."
        ru: "Подозреваемый остаётся на свободе."
        source: { kind: tatoeba, id: 3677187 }
      - pl: "Problem pozostaje nierozwiązany."
        ru: "Проблема остаётся нерешённой."
        source: { kind: translated, id: 3522593 }
      - pl: "Drzwi pozostają zamknięte."
        ru: "Двери остаются закрытыми."
        source: { kind: translated, id: 4413332 }
  - id: be-left
    ru: "оставаться (о том, что ещё предстоит)"
    examples:
      - pl: "Pozostaje mi tylko czekać."
        ru: "Мне остаётся только ждать."
        source: { kind: tatoeba, id: 12564133 }
      - pl: "Pozostaje tylko płakać."
        ru: "Остаётся только плакать."
        source: { kind: translated, id: 349191 }
notes:
  - { kind: usage, text: "Конструкция pozostaje mi tylko… «мне остаётся только…» требует ДАТЕЛЬНОГО падежа лица: pozostaje mi czekać." }
  - { kind: government, text: "Оставаться кем-л./каким-л. — с ТВОРИТЕЛЬНЫМ падежом: pozostawać dzieckiem «оставаться ребёнком», pozostawać spokojnym «сохранять спокойствие»." }
  - { kind: false-friend, text: "po- + zostawać от zostać «остаться», которое уже есть в словаре. Разница тонкая: zostać — «остаться» однократно, pozostawać — «пребывать, продолжать оставаться»." }
  - { kind: usage, text: "Совершенный вид — pozostać. Поговорка Powiedziane ulatuje, napisane pozostaje «Сказанное улетает, написанное остаётся» — польский вариант латинского verba volant." }
collocations:
  - { pl: "pozostawać w kontakcie", ru: "оставаться на связи" }
  - { pl: "pozostaje mi tylko…", ru: "мне остаётся только…" }
etymology: "po- + zostawać от zostać «остаться». zostać — однократно, pozostawać — «продолжать оставаться»."
memory: "pozostawać — «оставаться», с творительным падежом: pozostawać spokojnym. И запомните pozostaje mi tylko czekać «мне остаётся только ждать», с дательным. Совершенный вид — pozostać."
idioms:
  - { pl: "pozostawać w kontakcie", ru: "оставаться на связи" }
