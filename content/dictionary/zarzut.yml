# review
id: zarzut
format: 2
lemma: "zarzut"
rank: 1527
pos: noun
pron: { cyr: "за́жут" }
senses:
  - id: reproach
    ru: "упрёк, претензия"
    examples:
      - pl: "Jeden z moich głównych zarzutów wobec iPhone'a to ten, że nie obsługuje Flasha."
        ru: "Одна из моих главных претензий к айфону — та, что он не поддерживает Флеш."
        source: { kind: translated, id: 997708 }
      - pl: "Nie mam wobec niego żadnych zarzutów."
        ru: "У меня к нему нет никаких претензий."
        source: { kind: authored }
  - id: accusation
    ru: "обвинение (юридическое)"
    examples:
      - pl: "Te zarzuty są śmieszne."
        ru: "Эти обвинения смешны."
        source: { kind: tatoeba, id: 2570954 }
      - pl: "Ten mężczyzna został aresztowany pod zarzutem szpiegostwa."
        ru: "Этого человека арестовали по обвинению в шпионаже."
        source: { kind: translated, id: 1896361 }
      - pl: "Młodociany sprawca usłyszał zarzuty kradzieży roweru."
        ru: "Несовершеннолетнему правонарушителю предъявили обвинение в краже велосипеда."
        source: { kind: translated, id: 749156 }
  - id: flawless
    ru: "bez zarzutu — безупречно, безупречный"
    examples:
      - pl: "Twój angielski jest bez zarzutu."
        ru: "Твой английский безупречен."
        source: { kind: tatoeba, id: 5969987 }
      - pl: "Jest człowiekiem bez zarzutu."
        ru: "Это безупречный человек."
        source: { kind: translated, id: 832547 }
      - pl: "Jego zachowanie jest bez zarzutu."
        ru: "Его поведение безупречно."
        source: { kind: translated, id: 369722 }
notes:
  - { kind: usage, text: "Устойчивое bez zarzutu значит «безупречный, безупречно»: Jego zachowanie jest bez zarzutu «Его поведение безупречно»." }
  - { kind: usage, text: "Юридический набор: stawiać zarzuty «предъявлять обвинения», usłyszeć zarzuty «услышать обвинения», oczyścić z zarzutów «снять обвинения»." }
  - { kind: usage, text: "Базовая форма zarzut в корпусе не встречается ни разу — слово живёт в косвенных падежах, прежде всего в обороте bez zarzutu." }
  - { kind: usage, text: "Образовано от глагола zarzucić «набросить; упрекнуть»: zarzucić komuś kłamstwo «упрекнуть кого-то во лжи»." }
collocations:
  - { pl: "bez zarzutu", ru: "безупречно" }
  - { pl: "stawiać zarzuty", ru: "предъявлять обвинения" }
  - { pl: "pod zarzutem", ru: "по обвинению" }
etymology: "От zarzucić «набросить, забросить» (za- + rzucić «бросить») — буквально «то, что брошено в упрёк». Русское «попрёк» и оборот «бросить обвинение» держатся той же метафоры броска."
memory: "zarzut = «упрёк» и «обвинение». Самое частое — bez zarzutu «безупречно»: Twój angielski jest bez zarzutu. В суде — stawiać zarzuty «предъявлять обвинения», pod zarzutem «по обвинению». Базовой формы в корпусе нет вовсе."
idioms:
