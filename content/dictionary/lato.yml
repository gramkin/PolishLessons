        source: { kind: tatoeba, id: 821037 }
  - id: years
    ru: "годы (во множественном числе lata — счётная форма к rok)"
    note: "Множественное число lata заменяет «годы»: dwa lata «два года», dziesięć lat «десять лет»."
    examples:
      - pl: "Wojna trwała cztery lata."
        ru: "Война продолжалась четыре года."
        source: { kind: tatoeba, id: 3373931 }
      - pl: "Minęło trzydzieści lat."
        ru: "Прошло тридцать лет."
        source: { kind: tatoeba, id: 10608661 }
      - pl: "On ma dwadzieścia cztery lata."
        ru: "Ему двадцать четыре года."
        source: { kind: tatoeba, id: 4716826 }
notes:
  - { kind: usage, text: "Самое важное: множественное число lata служит счётной формой к rok «год». «Два года» — dwa lata, «десять лет» — dziesięć lat, «сколько тебе лет» — ile masz lat." }
  - { kind: usage, text: "Средний род: to lato, gorące lato. Локатив двойной: w lecie и latem оба значат «летом», latem чаще." }
  - { kind: usage, text: "babie lato — «бабье лето», оборот совпадает с русским дословно." }
  - { kind: usage, text: "Праславянское *lěto дало и польское lato «лето», и русское «лето», и «год» в счёте (ср. «сто лет»). Русское «лет» в «десять лет» — та же основа, что польское lat." }
collocations:
  - { pl: "babie lato", ru: "бабье лето" }
  - { pl: "latem", ru: "летом" }
  - { pl: "dziesięć lat", ru: "десять лет" }
  - { pl: "ile masz lat", ru: "сколько тебе лет" }
family:
  - { pl: "letni", ru: "летний", relation: derived }
  - { pl: "rok", ru: "год", relation: derived, id: rok }
etymology: "Праславянское *lěto — то же слово, что русское «лето». В счёте оно же дало «лет»: dziesięć lat «десять лет», ровно как русское «сто лет» вместо «сто годов»."
memory: "lato — «лето», средний род: to lato. Но главное в этом слове не время года, а счёт: множественное lata служит формой к rok «год». Dwa lata «два года», dziesięć lat «десять лет», Ile masz lat? «Сколько тебе лет?» — точно как русское «лет» вместо «годов». «Летом» будет latem или w lecie, чаще latem. И babie lato — «бабье лето», слово в слово."
idioms:
  - { pl: "babie lato", ru: "бабье лето" }
  - { pl: "ile masz lat?", ru: "сколько тебе лет?" }
  - { pl: "z biegiem lat", ru: "с течением лет" }
