# review
id: przyzwyczajenie
format: 2
lemma: "przyzwyczajenie"
rank: 6028
pos: noun
pron: { cyr: "пшызвычае́не" }
senses:
  - id: habit
    ru: "привычка"
    examples:
      - pl: "Pojadać między posiłkami to złe przyzwyczajenie."
        ru: "Перекусывать между едой — плохая привычка."
        source: { kind: translated, id: 610030 }
      - pl: "Człowiek jest niewolnikiem przyzwyczajeń."
        ru: "Человек — раб привычек."
        source: { kind: translated, id: 8750105 }
      - pl: "Robię to już z przyzwyczajenia."
        ru: "Я делаю это уже по привычке."
        source: { kind: authored }
  - id: getting-used
    ru: "привыкание (с się: к чему-то)"
    examples:
      - pl: "Przyzwyczajenie się do hałasu zajęło mi sporo czasu."
        ru: "Чтобы привыкнуть к шуму, мне понадобилось немало времени."
        source: { kind: translated, id: 1463222 }
      - pl: "Z początku miał problem z przyzwyczajeniem się do swojego nowego domu."
        ru: "Поначалу ему было трудно привыкнуть к своему новому дому."
        source: { kind: translated, id: 593077 }
notes:
  - { kind: usage, text: "«По привычке» — Z PRZYZWYCZAJENIA (Z + родительный), а не «PO». Так же Z NUDÓW «от скуки», Z CIEKAWOŚCI «из любопытства»." }
  - { kind: government, text: "Привыкание к чему-то — PRZYZWYCZAJENIE SIĘ DO + родительный: PRZYZWYCZAJENIE SIĘ DO KLIMATU. Без SIĘ слово значит саму привычку." }
  - { kind: usage, text: "ZWYCZAJ — не «привычка», а «обычай» (общий, народный); личная привычка — PRZYZWYCZAJENIE или NAWYK." }
  - { kind: pronunciation, text: "Читается «пшызвычае́не»: PRZY — «пшы», CZ — «ч». Ударение на предпоследнем слоге, на JE." }
collocations:
  - { pl: "z przyzwyczajenia", ru: "по привычке" }
  - { pl: "siła przyzwyczajenia", ru: "сила привычки" }
  - { pl: "złe przyzwyczajenie", ru: "дурная привычка" }
  - { pl: "zmienić przyzwyczajenia", ru: "изменить привычки" }
family:
  - { pl: "przyzwyczaić", ru: "приучить; przyzwyczaić się — привыкнуть", relation: root, id: przyzwyczaic }
  - { pl: "przyzwyczajony", ru: "привыкший", relation: derived }
  - { pl: "zwyczaj", ru: "обычай", relation: root, id: zwyczaj }
synonyms: ["nawyk", "nałóg"]
etymology: "Отглагольное существительное от PRZYZWYCZAIĆ (SIĘ) «приучить(ся)». В основе ZWYCZAJ «обычай», того же корня, что русские «обычай» и «привыкнуть»."
memory: "Przyzwyczajenie — при-звыч-ка: внутри тот же корень, что в «привычке». Z przyzwyczajenia — по привычке."
idioms:
  - { pl: "siła przyzwyczajenia", ru: "сила привычки" }
  - { pl: "przyzwyczajenie jest drugą naturą człowieka", ru: "привычка — вторая натура" }
