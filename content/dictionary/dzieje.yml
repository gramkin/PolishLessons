# review
id: dzieje
format: 2
lemma: "dzieje"
rank: 354
pos: noun
pron: { cyr: "дзе́е" }
senses:
  - id: history
    ru: "история, деяния (о прошлом народа, города)"
    note: "Существительное только множественного числа; единственного нет."
    examples:
      - pl: "Dzieje Polski są burzliwe."
        ru: "История Польши бурная."
        source: { kind: authored }
      - pl: "Dzieje tego miasta sięgają średniowiecza."
        ru: "История этого города восходит к средневековью."
        source: { kind: authored }
      - pl: "Uczymy się dziejów Europy."
        ru: "Мы изучаем историю Европы."
        source: { kind: authored }
  - id: in-history
    ru: "история (в оборотах)"
    examples:
      - pl: "To największy śpiewak w dziejach."
        ru: "Это величайший певец в истории."
        source: { kind: translated, id: 668695 }
      - pl: "Przeszłość jest bezpowrotnie wyryta w skale dziejów, może ją jedynie pokryć kurz czasu."
        ru: "Прошлое безвозвратно высечено в скале истории."
        source: { kind: translated, id: 12476408 }
      - pl: "W dziejach ludzkości było wiele wojen."
        ru: "В истории человечества было много войн."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Осторожно: dzieje — это и существительное «история», и форма глагола dziać się. Co się dzieje? «Что происходит?» — глагол, а w dziejach «в истории» — существительное." }
  - { kind: usage, text: "Слово существует только во множественном числе: dzieje, dziejów, dziejom. Единственного числа у него нет." }
  - { kind: usage, text: "Обычное, нейтральное слово для истории — historia; dzieje звучит книжно и торжественно: Dzieje Polski." }
collocations:
  - { pl: "dzieje Polski", ru: "история Польши" }
  - { pl: "w dziejach", ru: "в истории" }
  - { pl: "dzieje świata", ru: "история мира" }
  - { pl: "na przestrzeni dziejów", ru: "на протяжении истории" }
etymology: "От dziać «деять, совершать», праславянское *děti; то же гнездо, что русские «деяния», «деть», «дело»."
memory: "dzieje — «история, деяния», всегда во множественном числе. И осторожно: dzieje — ещё и форма глагола dziać się: Co się dzieje?"
idioms:
