# review
id: pograzac
format: 2
lemma: "pogrążać"
rank: 5943
pos: verb
aspect: imperf
pron: { cyr: "погро́у̃жаць" }
senses:
  - id: plunge
    ru: "погружать (в темноту, сон, горе); pogrążać się — погружаться"
    examples:
      - pl: "Awaria prądu pogrąża miasto w ciemności."
        ru: "Авария электросети погружает город во тьму."
        source: { kind: authored }
      - pl: "Wieczorami pogrążam się w lekturze."
        ru: "По вечерам я погружаюсь в чтение."
        source: { kind: authored }
      - pl: "Dziadek często pogrążał się w myślach."
        ru: "Дедушка часто погружался в свои мысли."
        source: { kind: authored }
  - id: ruin
    ru: "топить, губить (обвиняемого, репутацию, дело)"
    examples:
      - pl: "Każde nowe zeznanie pogrąża oskarżonego."
        ru: "Каждое новое показание топит обвиняемого."
        source: { kind: authored }
      - pl: "Swoimi kłamstwami tylko się pogrążasz."
        ru: "Своим враньём ты только себя топишь."
        source: { kind: authored }
  - id: sink
    ru: "погружаться, увязать (в кризисе, долгах, хаосе)"
    note: "с się"
    examples:
      - pl: "Kraj coraz głębiej pogrąża się w kryzysie."
        ru: "Страна всё глубже погружается в кризис."
        source: { kind: authored }
      - pl: "Firma pogrążała się w długach."
        ru: "Фирма увязала в долгах."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Несовершенный вид; совершенный — POGRĄŻYĆ. Очень частое причастие совершенного вида — POGRĄŻONY: POGRĄŻONY W ŻAŁOBIE «в трауре», POGRĄŻONY W MYŚLACH «погружённый в мысли»." }
  - { kind: government, text: "Кого/что — винительный, во что — W + предложный: POGRĄŻAĆ MIASTO W CIEMNOŚCI, POGRĄŻAĆ SIĘ W LEKTURZE. Не W + винительный, как в русском «погружать во тьму»." }
  - { kind: false-friend, text: "Это родственник русского «погружать», «грузить»: польское Ą соответствует русскому У. Но значение «грузить (товар)» по-польски — ŁADOWAĆ, а POGRĄŻAĆ без SIĘ часто значит «топить, губить»: ZEZNANIA POGRĄŻAJĄ OSKARŻONEGO." }
  - { kind: pronunciation, text: "Ą перед Ż читается как носовое «оу̃»: «погро́у̃жаць», без отдельного «н». POGRĄŻAM — «погро́у̃жам»." }
collocations:
  - { pl: "pogrążać się w myślach", ru: "погружаться в мысли" }
  - { pl: "pogrążać w ciemności", ru: "погружать во тьму" }
  - { pl: "pogrążać się w długach", ru: "увязать в долгах" }
  - { pl: "pogrążać oskarżonego", ru: "топить обвиняемого" }
family:
  - { pl: "pogrążyć", ru: "погрузить; потопить", relation: aspect }
  - { pl: "pogrążenie", ru: "погружение; крах", relation: derived }
  - { pl: "pogrążony", ru: "погружённый", relation: derived }
  - { pl: "żałoba", ru: "траур", relation: root, id: zaloba }
etymology: "Приставка PO- плюс старое GRĄŻYĆ «погружать», праславянское *grǫziti; тот же корень, что в русском «грузить», «погружать»."
memory: "Pogrążać — это «погружать»: ą на месте русского у, po-grąż- = по-груж-."
idioms:
