# review
id: gadac
format: 2
lemma: "gadać"
rank: 472
pos: verb
aspect: imperf
pron: { cyr: "га́даць" }
senses:
  - id: chatter
    ru: "болтать, трепаться (разговорное)"
    examples:
      - pl: "No to gadaj!"
        ru: "Рассказывай!"
        source: { kind: tatoeba, id: 13782632 }
      - pl: "Gada tyle co zwykle."
        ru: "Болтает как обычно."
        source: { kind: translated, id: 751556 }
      - pl: "Co ty gadasz?"
        ru: "Что ты несёшь?"
        source: { kind: translated, id: 560202 }
  - id: talk
    ru: "говорить, разговаривать (фамильярно)"
    examples:
      - pl: "Tom gada jak najęty."
        ru: "У Тома язык как помело."
        source: { kind: tatoeba, id: 13784392 }
      - pl: "Gadaliśmy do drugiej w nocy."
        ru: "Мы проболтали до двух ночи."
        source: { kind: translated, id: 922416 }
      - pl: "Tom gadał całą noc."
        ru: "Том болтал всю ночь."
        source: { kind: translated, id: 3034154 }
notes:
  - { kind: false-friend, text: "Русское «гадать» — то же праславянское слово, но значения разошлись: у поляков осталось «говорить», а у нас ушло в «предсказывать». Co ty gadasz? значит «Что ты несёшь?», а не «Что ты гадаешь?»" }
  - { kind: usage, text: "gadać — разговорный, чуть пренебрежительный двойник глагола mówić. В официальной речи его не употребляют." }
  - { kind: usage, text: "mieć gadane — «иметь язык подвешенный»: On ma gadane." }
  - { kind: usage, text: "Существительное gadanie значит «болтовня»: Mniej gadania, więcej roboty «Меньше болтовни, больше дела»." }
collocations:
  - { pl: "co ty gadasz?", ru: "что ты несёшь?" }
  - { pl: "mieć gadane", ru: "иметь язык подвешенный" }
  - { pl: "mniej gadania", ru: "меньше болтовни" }
  - { pl: "gadać bez przerwy", ru: "болтать без умолку" }
etymology: "Праславянское *gadati; русское «гадать» — то же самое слово, но значения разошлись: у поляков осталось «говорить», а у нас ушло к предсказаниям."
memory: "gadać — «болтать, трепаться», разговорный двойник глагола mówić. Русское «гадать» того же корня, но значит другое: Co ty gadasz? это «Что ты несёшь?». И запомните On ma gadane — «у него язык подвешен»."
idioms:
  - { pl: "gadać jak najęty", ru: "болтать без умолку" }
  - { pl: "mieć gadane", ru: "иметь язык подвешенный" }
  - { pl: "gadać od rzeczy", ru: "нести чушь" }
