# review
id: szczekac
format: 2
lemma: "szczekać"
rank: 2317
pos: verb
aspect: imperf
pron: { cyr: "шчэ́каць" }
senses:
  - id: bark
    ru: "лаять"
    examples:
      - pl: "Pies szczeka na obcych."
        ru: "Собака лает на незнакомцев."
        source: { kind: tatoeba, id: 360494 }
      - pl: "Pies, który szczeka, nie gryzie."
        ru: "Собака, которая лает, не кусается."
        source: { kind: tatoeba, id: 366998 }
      - pl: "Twój pies zawsze na mnie szczeka."
        ru: "Твоя собака всегда на меня лает."
        source: { kind: tatoeba, id: 11764965 }
  - id: bark-at
    ru: "лаять (на кого-л.); огрызаться"
    examples:
      - pl: "Pies szczekał i gryzł."
        ru: "Собака лаяла и кусалась."
        source: { kind: tatoeba, id: 2279782 }
      - pl: "Psy szczekały całą noc."
        ru: "Собаки лаяли всю ночь."
        source: { kind: tatoeba, id: 10698013 }
notes:
  - { kind: government, text: "Лаять НА кого-л. — szczekać NA kogoś, с винительным падежом, ровно как в русском." }
  - { kind: usage, text: "Пословица Pies, który szczeka, nie gryzie «Собака, которая лает, не кусает» совпадает с русской дословно. Есть и вариант во множественном: Psy szczekają, karawana idzie dalej." }
  - { kind: false-friend, text: "Звукоподражание, родственное szczęka «челюсть». Русское «щёкот» о птичьем стрекоте — та же звуковая семья." }
  - { kind: usage, text: "Отглагольное имя szczekanie «лай». О человеке szczekać значит «грубо огрызаться»." }
collocations:
  - { pl: "szczekać na kogoś", ru: "лаять на кого-л." }
  - { pl: "pies, który szczeka, nie gryzie", ru: "собака, которая лает, не кусает" }
etymology: "Звукоподражание, родня szczęka «челюсть»."
memory: "szczekać — «лаять», на кого-л. с винительным: szczekać na kogoś. Пословица Pies, który szczeka, nie gryzie совпадает с русской слово в слово."
