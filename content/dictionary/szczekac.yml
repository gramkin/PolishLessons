  - form: "szczeka"
    pl: "Twój pies zawsze na mnie szczeka."
    ru: "Твоя собака всегда на меня лает."
    source: { kind: tatoeba, id: 11764965 }
  - form: "szczekać"
    pl: "Pies przestał szczekać."
    ru: "Собака перестала лаять."
    source: { kind: translated, id: 13684058 }
  - form: "szczekać"
    pl: "Psy zaczęły szczekać, jakby zobaczyły niedźwiedzia."
    ru: "Собаки начали лаять, будто увидели медведя."
    source: { kind: translated, id: 2251595 }
  - form: "szczekać"
    pl: "Co mogę zrobić, żeby mój pies przestał ciągle szczekać?"
    ru: "Что мне сделать, чтобы моя собака перестала постоянно лаять?"
    source: { kind: translated, id: 12478532 }
  - form: "szczekaj"
    pl: "Nie szczekaj!"
    ru: "Не лай!"
    source: { kind: translated, id: 8608661 }
  - form: "szczekaj"
    pl: "Nie szczekaj na gości."
    ru: "Не лай на гостей."
    source: { kind: authored }
  - form: "szczekaj"
    pl: "Cicho, nie szczekaj."
    ru: "Тихо, не лай."
    source: { kind: authored }
  - form: "szczekają"
    pl: "Psy, które szczekają, nie gryzą."
    ru: "Собаки, которые лают, не кусаются."
    source: { kind: tatoeba, id: 1170352 }
  - form: "szczekają"
    pl: "Psy szczekają."
    ru: "Собаки лают."
    source: { kind: translated, id: 555559 }
  - form: "szczekają"
    pl: "Powiadają: Psy szczekają, karawana idzie dalej"
    ru: "Говорят: собаки лают, а караван идёт дальше."
    source: { kind: translated, id: 2493573 }
  - form: "szczekające"
    pl: "Szczekające psy nie gryzą."
    ru: "Лающие собаки не кусают."
    source: { kind: translated, id: 1170355 }
  - form: "szczekające"
    pl: "Nasi sąsiedzi mają szczekające psy."
    ru: "У наших соседей лающие собаки."
    source: { kind: translated, id: 4434496 }
  - form: "szczekające"
    pl: "Szczekające psy biegły za wozem."
    ru: "Лающие собаки бежали за телегой."
    source: { kind: authored }
  - form: "szczekającego"
    pl: "Słyszę psa szczekającego w lesie."
    ru: "Я слышу лающую в лесу собаку."
    source: { kind: translated, id: 4289284 }
  - form: "szczekającego"
    pl: "Widziałem psa szczekającego na kota."
    ru: "Я видел собаку, лающую на кота."
    source: { kind: authored }
  - form: "szczekającego"
    pl: "Nie znoszę psa szczekającego nocą."
    ru: "Терпеть не могу собаку, лающую ночью."
    source: { kind: authored }
  - form: "szczekał"
    pl: "Pies szczekał i gryzł."
    ru: "Собака лаяла и кусалась."
    source: { kind: tatoeba, id: 2279782 }
  - form: "szczekał"
    pl: "Pies szczekał na listonosza."
    ru: "Собака лаяла на почтальона."
    source: { kind: translated, id: 765676 }
  - form: "szczekał"
    pl: "Pies ciągle na mnie szczekał przy bramie i nie pozwalał mi wejść."
    ru: "Собака всё лаяла на меня у ворот и не давала мне войти."
    source: { kind: translated, id: 10931191 }
  - form: "szczekały"
    pl: "Psy szczekały całą noc."
    ru: "Собаки лаяли всю ночь."
    source: { kind: tatoeba, id: 10698013 }
  - form: "szczekały"
    pl: "Psy szczekały na każdego przechodnia."
    ru: "Собаки лаяли на каждого прохожего."
    source: { kind: authored }
  - form: "szczekały"
    pl: "Gdzieś daleko szczekały psy."
    ru: "Где-то далеко лаяли собаки."
    source: { kind: authored }
  - form: "szczekanie"
    pl: "Dla szlachetnego konia nie jest ważne szczekanie psa."
    ru: "Благородному коню не важен собачий лай."
    source: { kind: translated, id: 2675528 }
  - form: "szczekanie"
    pl: "Nie mógł spać przez ruch uliczny i szczekanie psów."
    ru: "Он не мог спать из-за уличного движения и собачьего лая."
    source: { kind: translated, id: 510057 }
  - form: "szczekanie"
    pl: "Szczekanie obudziło całą wieś."
    ru: "Лай разбудил всю деревню."
    source: { kind: authored }
