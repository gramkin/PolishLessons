# review
id: rzucic
format: 2
lemma: "rzucić"
rank: 554
pos: verb
aspect: perf
pron: { cyr: "жу́циць" }
senses:
  - id: throw
    ru: "бросить, кинуть (предмет)"
    note: "rzucić coś — винительный; rzucić czymś — творительный, когда бросают чем-то: Rzucił piłką."
    examples:
      - pl: "Rzuć piłkę."
        ru: "Брось мяч."
        source: { kind: translated, id: 363665 }
      - pl: "Tom rzucił piłkę."
        ru: "Том бросил мяч."
        source: { kind: translated, id: 3662190 }
      - pl: "Rzucił piłką."
        ru: "Он бросил мячом."
        source: { kind: translated, id: 731871 }
  - id: quit
    ru: "бросить (привычку, работу, учёбу)"
    note: "Самое частое значение в живой речи: rzucić palenie, rzucić pracę."
    examples:
      - pl: "Rzuciłem palenie."
        ru: "Я бросил курить."
        source: { kind: tatoeba, id: 351947 }
      - pl: "Rzuciła palenie."
        ru: "Она бросила курить."
        source: { kind: translated, id: 711057 }
      - pl: "Rzuciła szkołę."
        ru: "Она бросила школу."
        source: { kind: translated, id: 502923 }
notes:
  - { kind: government, text: "Два управления с разным оттенком: rzucić coś «бросить что-то» (винительный) и rzucić czymś «бросить чем-то» (творительный). Rzucił kamień «бросил камень», но Rzucił kamieniem w psa «бросил камнем в собаку»." }
  - { kind: usage, text: "Формы rzucę, rzucisz, rzuci — БУДУЩЕЕ время: глагол совершенного вида. Несовершенный вид — rzucać: Rzucam palenie «Я бросаю курить»." }
  - { kind: usage, text: "Очень частый оборот rzucić okiem «взглянуть, глянуть»: Rzuć okiem na to «Глянь на это». Буквально «бросить глазом»." }
  - { kind: usage, text: "Значение «бросить привычку» вытеснило в разговоре все прочие: rzucić palenie «бросить курить», rzucić pracę «уйти с работы», rzucić szkołę «бросить школу»." }
collocations:
  - { pl: "rzucić palenie", ru: "бросить курить" }
  - { pl: "rzucić okiem", ru: "взглянуть" }
  - { pl: "rzucić pracę", ru: "бросить работу" }
  - { pl: "rzucić piłkę", ru: "бросить мяч" }
family:
  - { pl: "rzucać", ru: "бросать", relation: derived }
  - { pl: "rzut", ru: "бросок", relation: derived }
  - { pl: "wyrzucić", ru: "выбросить", relation: derived }
etymology: "Праславянское *rjutiti «бросить, метнуть» — той же основы, что русские «ринуть» и «ринуться». Отсюда же rzut «бросок» и wyrzucić «выбросить»."
memory: "rzucić — «бросить», совершенный вид от rzucać. Два управления с разным оттенком: rzucić coś «бросить что-то» (винительный) и rzucić czymś «бросить чем-то» (творительный): Rzucił kamień, но Rzucił kamieniem w psa. В живой речи чаще всего слышится переносное значение — rzucić palenie «бросить курить», rzucić pracę «уйти с работы», rzucić szkołę. И запомните оборот rzucić okiem «взглянуть»: Rzuć okiem na to. Формы rzucę, rzucisz — будущее время."
idioms:
  - { pl: "rzucić okiem", ru: "взглянуть" }
  - { pl: "rzucić palenie", ru: "бросить курить" }
  - { pl: "kości zostały rzucone", ru: "жребий брошен" }
