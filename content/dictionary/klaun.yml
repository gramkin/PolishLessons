pos: noun
pron: { cyr: "кла́ун" }
senses:
  - id: clown
    ru: "клоун (в цирке)"
    examples:
      - pl: "Klaun rozśmieszył wszystkie dzieci."
        ru: "Клоун рассмешил всех детей."
        source: { kind: authored }
      - pl: "W cyrku występował znany klaun."
        ru: "В цирке выступал известный клоун."
        source: { kind: authored }
      - pl: "Na urodziny zaprosili klauna."
        ru: "На день рождения они пригласили клоуна."
        source: { kind: authored }
  - id: fool
    ru: "шут, клоун (о человеке)"
    examples:
      - pl: "Przestań robić z siebie klauna."
        ru: "Перестань строить из себя клоуна."
        source: { kind: authored }
      - pl: "W klasie był klaunem i wszystkich bawił."
        ru: "В классе он был клоуном и всех веселил."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "KLAUN — «клоун», но через AU, а не O: русское «клоун» и польское KLAUN пришли из английского CLOWN разными путями. Синонимы: BŁAZEN — «шут», чаще о человеке, ведущем себя глупо." }
  - { kind: usage, text: "Десять форм, мужской род, одушевлённый, лицо. Множественное — KLAUNI, с мужско-личным окончанием; винительный множественного совпадает с родительным: WIDZIAŁEM KLAUNÓW." }
  - { kind: government, text: "Строить из себя клоуна — ROBIĆ Z SIEBIE KLAUNA, винительный. Быть клоуном — BYĆ KLAUNEM, творительный." }
  - { kind: pronunciation, text: "Читается «кла́ун», один слог: AU — дифтонг, как в AUTO, U звучит кратко, почти как «ў». Во множественном KLAUNI ударение падает на тот же слог: «кла́уни»." }
collocations:
  - { pl: "klaun w cyrku", ru: "клоун в цирке" }
  - { pl: "nos klauna", ru: "клоунский нос" }
  - { pl: "robić z siebie klauna", ru: "строить из себя клоуна" }
family:
  - { pl: "cyrk", ru: "цирк", relation: root, id: cyrk }
  - { pl: "błazen", ru: "шут", relation: root }
  - { pl: "klaunada", ru: "клоунада", relation: derived }
etymology: "Из английского CLOWN «деревенщина, шут». Польское написание передаёт английское произношение через AU; русское «клоун» — через «оу»."
memory: "Klaun — клоун, через au: кла́ун. W cyrku występuje klaun. Robić z siebie klauna — строить из себя клоуна. Klauni — клоуны."
idioms:
  - { pl: "robić z siebie klauna", ru: "выставлять себя посмешищем" }
