formExamples:
  - form: "modlącego"
    pl: "Funkcja modlitwy to nie wpłynięcie na Boga, a raczej zmiana natury modlącego się."
    ru: "Задача молитвы не в том, чтобы повлиять на Бога, а скорее в том, чтобы изменить природу молящегося."
    source: { kind: translated, id: 11767293 }
