# review
id: modlic
format: 2
lemma: "modlić"
rank: 1474
pos: verb
aspect: imperf
pron: { cyr: "мо́длиць" }
senses:
  - id: pray
    ru: "молиться"
    examples:
      - pl: "Modlę się."
        ru: "Я молюсь."
        source: { kind: translated, id: 11261896 }
      - pl: "Modlę się o deszcz."
        ru: "Я молюсь о дожде."
        source: { kind: tatoeba, id: 6855099 }
      - pl: "Tom się modli."
        ru: "Том молится."
        source: { kind: translated, id: 8753468 }
      - pl: "Tom modlił się."
        ru: "Том молился."
        source: { kind: translated, id: 5630026 }
      - pl: "Wszyscy się modlili."
        ru: "Все молились."
        source: { kind: translated, id: 8617295 }
      - pl: "Tom modlił się do Boga o pomoc."
        ru: "Том молился Богу о помощи."
        source: { kind: translated, id: 3991038 }
  - id: pray-for
    ru: "молиться о чём-либо, за кого-либо"
    examples:
      - pl: "Modlę się o lepszą przyszłość."
        ru: "Я молюсь о лучшем будущем."
        source: { kind: translated, id: 10618940 }
      - pl: "Modliła się o powrót syna."
        ru: "Она молилась о возвращении сына."
        source: { kind: translated, id: 1352108 }
      - pl: "Módl się za mnie."
        ru: "Помолись за меня."
        source: { kind: translated, id: 10780869 }
notes:
  - { kind: usage, text: "Глагол не употребляется без się: говорят только modlić się. В корпусе нет ни одного примера без этой частицы — это тот же класс, что bać się и uczyć się." }
  - { kind: government, text: "Молиться о чём-либо — modlić się o coś с винительным: modlę się o deszcz «молюсь о дожде». Молиться кому-либо — modlić się do kogoś: modlił się do Boga." }
  - { kind: pronunciation, text: "В повелительном наклонении пишется ó: módl się, módlcie się — не modl. Это чередование o и ó в корне." }
  - { kind: usage, text: "Существительное того же корня — modlitwa «молитва»." }
  - { kind: government, text: "В настоящем времени корень с o — modlę się, modlisz się, modlimy się, — а в повелительном наклонении появляется ó: módl się, módlmy się, módlcie się. Чередование то же, что в mógł и mogła, только в неожиданном месте." }
  - { kind: usage, text: "Обиходное существительное здесь — modlitwa «молитва»: odmówić modlitwę. Правильная отглагольная форма modlenie возможна, но встречается редко." }
collocations:
  - { pl: "modlić się do Boga", ru: "молиться Богу" }
  - { pl: "modlić się o coś", ru: "молиться о чём-либо" }
  - { pl: "módl się za mnie", ru: "помолись за меня" }
etymology: "От modła «мольба», праславянское *modliti. Русское «молить» и «молиться» — то же самое слово; польское сохранило -dl-, где русский дал -л-."
memory: "modlić się — «молиться», и только с się: без него глагол не употребляется. В повелительном наклонении корень меняется на ó: módl się «молись»."
idioms:
  - { pl: "modlić się do Boga", ru: "молиться Богу" }
  - { pl: "módl się za mnie", ru: "помолись за меня" }
  - { pl: "módl się i pracuj", ru: "молись и работай" }
