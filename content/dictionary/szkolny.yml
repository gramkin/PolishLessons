senses:
  - id: school
    ru: "школьный"
    examples:
      - pl: "Szkolna biblioteka jest zamknięta."
        ru: "Школьная библиотека закрыта."
        source: { kind: authored }
      - pl: "Kupili dzieciom plecaki szkolne."
        ru: "Они купили детям школьные рюкзаки."
        source: { kind: authored }
  - id: academic-year
    ru: "rok szkolny — учебный год"
    examples:
      - pl: "Rok szkolny kończy się w czerwcu."
        ru: "Учебный год кончается в июне."
        source: { kind: authored }
      - pl: "W nowym roku szkolnym zmieniają program."
        ru: "В новом учебном году меняют программу."
        source: { kind: authored }
  - id: schoolish
    ru: "ученический, по-школьному простой"
    examples:
      - pl: "To rozwiązanie jest trochę zbyt szkolne."
        ru: "Это решение немного слишком ученическое."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Слово совпадает с русским «школьный» до буквы, и путать нечего — кроме одного оборота. Rok szkolny по-русски будет не «школьный год», а «УЧЕБНЫЙ год». Русское прилагательное здесь меняется, польское нет: szkolny покрывает и школьное вообще, и учебное применительно к школе." }
  - { kind: usage, text: "Прилагательное относительное, степеней сравнения нет, отсюда одиннадцать форм — как у kosmiczny и przeciwny. В разговорной речи, правда, встречается переносное «ученический, наивный»: zbyt szkolne rozwiązanie, и тогда степени иногда слышны, но на письме их избегают." }
  - { kind: pronunciation, text: "Три слога, ударение на предпоследнем: SZKOL-ny, «шко́льны». sz звучит как ш, а l перед n заметно мягче русского твёрдого «л»." }
collocations:
  - { pl: "rok szkolny", ru: "учебный год" }
  - { pl: "biblioteka szkolna", ru: "школьная библиотека" }
  - { pl: "wycieczka szkolna", ru: "школьная экскурсия" }
family:
  - { pl: "szkoła", ru: "школа", relation: root, id: szkola }
  - { pl: "szkolić", ru: "обучать", relation: derived }
  - { pl: "szkolenie", ru: "обучение", relation: derived }
  - { pl: "przedszkole", ru: "детский сад", relation: derived }
etymology: "От szkoła, из латинского schola и дальше из греческого schole, что изначально значило «досуг»: учение считалось занятием свободного времени. В русский «школа» пришла тем же путём. Отсюда szkolić «обучать», szkolenie «обучение» и przedszkole «детский сад», буквально «предшколье»."
memory: "szkolny — «школьный», совпадение полное. Запомнить надо один оборот: rok szkolny это «учебный год», а не «школьный». И что форм одиннадцать: относительные прилагательные не сравниваются."
idioms:
