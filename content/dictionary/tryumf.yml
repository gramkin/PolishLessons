pos: noun
pron: { cyr: "тры́умф" }
senses:
  - id: triumph
    ru: "триумф, торжество"
    examples:
      - pl: "Nowy projekt był wielkim tryumfem."
        ru: "Новый проект был большим триумфом."
        source: { kind: translated, id: 358054 }
      - pl: "Tryumf był całkowity."
        ru: "Триумф был полным."
        source: { kind: authored }
      - pl: "Święcili tryumf po zwycięstwie."
        ru: "Они праздновали триумф после победы."
        source: { kind: authored }
  - id: exultation
    ru: "торжество, ликование"
    examples:
      - pl: "W jego głosie brzmiał tryumf."
        ru: "В его голосе звучало торжество."
        source: { kind: authored }
      - pl: "Patrzył na nas z tryumfem."
        ru: "Он смотрел на нас с торжеством."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Слово пишется и через y, и через i: tryumf и triumf — оба варианта нормативны, первый чаще." }
  - { kind: false-friend, text: "Латинское triumphus, как и русский «триумф». Значение совпадает полностью, отличается только написание." }
  - { kind: government, text: "Мужской неодушевлённый; родительный — tryumfu. Праздновать триумф — święcić tryumf, винительный." }
  - { kind: usage, text: "Глагол tryumfować «торжествовать», прилагательное tryumfalny «триумфальный»." }
collocations:
  - { pl: "święcić tryumf", ru: "праздновать триумф" }
  - { pl: "z tryumfem", ru: "с торжеством" }
etymology: "Из латинского triumphus, как и русское «триумф»."
memory: "tryumf — «триумф»; пишется и tryumf, и triumf, оба верны. Глагол — tryumfować «торжествовать»."
idioms:
  - { pl: "święcić tryumf", ru: "праздновать триумф" }
