notes:
  - { kind: usage, text: "Анатомический термин запоминай готовым: UKŁAD NERWOWY — «нервная система». Układ, а не system, хотя слово system в польском тоже есть. Клетки — komórki nerwowe, а «нервы» как состояние — nerwy: mieć mocne nerwy «иметь крепкие нервы», działać komuś na nerwy «действовать кому-то на нервы»." }
  - { kind: false-friend, text: "Прилагательное совпадает с русским, но глагол расходится. NERWOWAĆ SIĘ по-польски не говорят; нервничать — это DENERWOWAĆ SIĘ, с приставкой de-. А DENERWOWAĆ kogoś без się значит «раздражать кого-то». Приставка тут не отрицание, хотя выглядит именно так." }
  - { kind: pronunciation, text: "Четыре слога, ударение на предпоследнем: ner-WO-wy. Польское e открытое, как русское э, r твёрдое: «нэрво́вы». Женская форма nerwowa звучит «нэрво́ва»." }
collocations:
  - { pl: "układ nerwowy", ru: "нервная система" }
  - { pl: "nerwowa atmosfera", ru: "нервная атмосфера" }
  - { pl: "komórka nerwowa", ru: "нервная клетка" }
family:
  - { pl: "nerw", ru: "нерв", relation: root }
  - { pl: "denerwować", ru: "раздражать, нервировать", relation: derived, id: denerwowac }
  - { pl: "spokojny", ru: "спокойный", relation: antonym, id: spokojny }
etymology: "От nerw «нерв», из латинского nervus «жила, сухожилие, нерв». То же слово дало русское «нерв» и немецкое Nerv. Латинское nervus родственно греческому neuron, откуда «неврология» и «нейрон»."
memory: "nerwowy — «нервный», от nerw «нерв». Система по-польски układ nerwowy, через układ, а не system. И запомни глагол: нервничать это DENERWOWAĆ SIĘ, а не nerwować się."
idioms:
  - { pl: "działać na nerwy", ru: "действовать на нервы" }
  - { pl: "mieć mocne nerwy", ru: "иметь крепкие нервы" }
