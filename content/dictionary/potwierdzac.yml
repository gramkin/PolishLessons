    ru: "удостоверять, свидетельствовать"
    examples:
      - pl: "Świadek potwierdzał jego wersję."
        ru: "Свидетель подтверждал его версию."
        source: { kind: authored }
      - pl: "Dokumenty potwierdzające staż leżą w teczce."
        ru: "Документы, подтверждающие стаж, лежат в папке."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Основа у этого глагола одна на все шестьдесят три формы: POTWIERDZAM, POTWIERDZA, POTWIERDZAJĄ, POTWIERDZAŁ, POTWIERDZANY, POTWIERDZAJĄCY. Это противоположный конец той шкалы, на другом краю которой стоит ZŁOŚCIĆ со своим двоением ść и szcz. Правило после проверки восемнадцати глаголов звучит так: основа двоится только у тех глаголов на -IĆ, чья основа кончается на ś, ź, ść или źdź, и твердеет она в sz, ż, szcz, żdż перед окончаниями -ę и -ą. У глаголов на -AĆ двоения не бывает никогда." }
  - { kind: usage, text: "Шестьдесят три формы — несовершенный переходный, полный набор с двумя причастиями. Повелительное POTWIERDZAJ получается из третьего лица POTWIERDZA прибавлением -j, как и у всех глаголов с основой на гласную, и это двадцать седьмое подтверждение правила из карточки KARMIĆ. Совершенная пара POTWIERDZIĆ попадает в клетку с пятьюдесятью тремя формами, и у неё, кстати, основа уже двоится: potwierdzę при potwierdzi." }
  - { kind: usage, text: "Корень русскому знаком до конца, только не сразу. TWIERDZIĆ значит «утверждать», а корень тот же, что в TWARDY «твёрдый», из праславянского *tvrd-. Отсюда и русское «твердить», и «утверждать», и «подтверждать» — всё о том, чтобы сделать сказанное твёрдым. Особенно хорошо видно родство в существительном TWIERDZA «крепость», которое есть в точности русская «твердыня». Так что potwierdzać запоминается через «подтверждать» без всяких поправок." }
  - { kind: government, text: "Управление простое и совпадает с русским: POTWIERDZAĆ COŚ в винительном — potwierdzać informację, potwierdzać rezerwację, potwierdzać odbiór. Можно и с союзом: POTWIERDZAM, ŻE WSZYSTKO SIĘ ZGADZA. В деловой переписке форма первого лица POTWIERDZAM стоит сама по себе как готовая реплика, ровно как русское «подтверждаю». И запомните поговорку WYJĄTEK POTWIERDZA REGUŁĘ — «исключение подтверждает правило», совпадающую дословно." }
collocations:
  - { pl: "potwierdzać informację", ru: "подтверждать информацию" }
  - { pl: "potwierdzać rezerwację", ru: "подтверждать бронь" }
  - { pl: "potwierdzać odbiór", ru: "подтверждать получение" }
family:
  - { pl: "twierdzić", ru: "утверждать", relation: root, id: twierdzic }
  - { pl: "twierdza", ru: "крепость", relation: derived }
  - { pl: "potwierdzenie", ru: "подтверждение", relation: derived }
etymology: "Приставки po- и TWIERDZIĆ «утверждать», от TWARDY «твёрдый», из праславянского *tvrdъ — того же корня, что русские «твёрдый», «твердить», «утверждать» и «твердыня». Подтвердить значит сделать сказанное твёрдым, надёжным. Соответствие с русским полное на всём гнезде, включая существительное TWIERDZA «крепость», которое и есть «твердыня», так что догадываться тут ни о чём не приходится."
memory: "Основа одна во всех шестидесяти трёх формах — не как у złościć. Корень тот же, что в «твёрдом» и «твердить», а twierdza значит «крепость»."
idioms:
