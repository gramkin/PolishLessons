# review
id: cicho
format: 2
lemma: "cicho"
rank: 1315
pos: adv
pron: { cyr: "ци́хо" }
senses:
  - id: quietly
    ru: "тихо, бесшумно"
    examples:
      - pl: "W lesie znów zrobiło się cicho."
        ru: "В лесу снова стало тихо."
        source: { kind: tatoeba, id: 3446241 }
      - pl: "Szeptał cicho."
        ru: "Он тихо шептал."
        source: { kind: translated, id: 675488 }
      - pl: "Siedziała cicho."
        ru: "Она сидела тихо."
        source: { kind: translated, id: 440587 }
  - id: be-quiet
    ru: "cicho! — тихо!, замолчи!"
    examples:
      - pl: "Cicho!"
        ru: "Тихо!"
        source: { kind: translated, id: 5630089 }
      - pl: "Bądźże cicho!"
        ru: "Да замолчи же!"
        source: { kind: translated, id: 363584 }
      - pl: "Tom kazał mi być cicho."
        ru: "Том сказал мне, чтобы я сидел тихо."
        source: { kind: tatoeba, id: 10115718 }
  - id: quieter
    ru: "ciszej — тише (сравнительная степень)"
    examples:
      - pl: "Mów ciszej."
        ru: "Говори тихо."
        source: { kind: tatoeba, id: 2063351 }
      - pl: "Ciszej!"
        ru: "Тише!"
        source: { kind: translated, id: 5366896 }
      - pl: "Trochę ciszej, proszę."
        ru: "Немного тише, пожалуйста."
        source: { kind: translated, id: 457418 }
notes:
  - { kind: usage, text: "Cicho! как отдельная реплика значит «Тихо!», «Замолчи!». Мягче звучит Ciszej! «Тише!»." }
  - { kind: usage, text: "Być cicho значит «молчать, вести себя тихо»: Tom kazał mi być cicho «Том велел мне сидеть тихо»." }
  - { kind: usage, text: "Сравнительная степень образуется от другой основы: ciszej «тише», najciszej «тише всего»." }
  - { kind: usage, text: "Прилагательное — cichy «тихий», карточка уже есть. Существительное — cisza «тишина»." }
collocations:
  - { pl: "bądź cicho", ru: "замолчи" }
  - { pl: "mów ciszej", ru: "говори тише" }
  - { pl: "siedzieć cicho", ru: "сидеть тихо" }
etymology: "От cichy «тихий», из праславянского *tichъ. Русское «тихо» — то же самое слово."
memory: "cicho — «тихо». Отдельной репликой Cicho! значит «Замолчи!», мягче — Ciszej! «Тише!». Сравнительная степень идёт от другой основы: ciszej, najciszej. Прилагательное — cichy."
idioms:
  - { pl: "bądź cicho", ru: "замолчи" }
  - { pl: "siedzieć cicho", ru: "сидеть тихо" }
  - { pl: "cicho jak w grobie", ru: "тихо как в могиле" }
formExamplesSkip:
  - { form: "najciszej", reason: "формы сравнительной и превосходной степени: в корпусе нет примеров" }
