# review
id: wspomniec
format: 2
lemma: "wspomnieć"
rank: 909
pos: verb
aspect: perf
pron: { cyr: "вспо́мнець" }
senses:
  - id: mention
    ru: "упомянуть (о чём-л.) — o + предложный"
    note: "Основное значение: сказать вскользь, назвать."
    examples:
      - pl: "Wspomniał o tym."
        ru: "Он об этом упомянул."
        source: { kind: translated, id: 977276 }
      - pl: "Czy wspomniał o wypadku?"
        ru: "Он упомянул об аварии?"
        source: { kind: translated, id: 352270 }
      - pl: "Nie wspomniała o tym."
        ru: "Она об этом не упомянула."
        source: { kind: translated, id: 416493 }
  - id: recall
    ru: "вспомнить, помянуть (кого-л.)"
    examples:
      - pl: "Wspomnij mnie od czasu do czasu."
        ru: "Вспоминай меня время от времени."
        source: { kind: translated, id: 527585 }
      - pl: "Poradzę sobie. Wspomnisz moje słowa."
        ru: "Я справлюсь. Помянешь моё слово."
        source: { kind: translated, id: 12040193 }
      - pl: "Wspomnę mu to."
        ru: "Я ему об этом напомню."
        source: { kind: translated, id: 10573465 }
  - id: noun
    ru: "wspomnienie — воспоминание"
    examples:
      - pl: "Jedyne co teraz mam to wspomnienia."
        ru: "Всё, что у меня теперь есть, — это воспоминания."
        source: { kind: translated, id: 3492061 }
      - pl: "Ta wycieczka będzie miłym wspomnieniem."
        ru: "Эта поездка останется приятным воспоминанием."
        source: { kind: translated, id: 641236 }
      - pl: "Co za wspomnienie!"
        ru: "Вот это воспоминание!"
        source: { kind: translated, id: 6320827 }
notes:
  - { kind: government, text: "wspomnieć O czymś «упомянуть о чём-то» — предлог o и предложный падеж: wspomniał o wypadku. А wspomnieć kogoś без предлога значит «помянуть, вспомнить кого-то»: Wspomnij mnie." }
  - { kind: usage, text: "Несовершенный вид — wspominać. Существительное wspomnienie «воспоминание» очень частое, особенно во множественном: wspomnienia z dzieciństwa «воспоминания детства»." }
  - { kind: usage, text: "Различайте три глагола: pamiętać «помнить» (состояние), przypominać sobie «припоминать» (усилие), wspomnieć «упомянуть» (сказать вслух). Русское «вспомнить» покрывает второй и третий разом." }
  - { kind: usage, text: "Оборот wspomnisz moje słowa значит «помянешь моё слово» — предупреждение о том, что говорящий окажется прав." }
collocations:
  - { pl: "wspomnieć o czymś", ru: "упомянуть о чём-то" }
  - { pl: "nie wspomniał o tym", ru: "он об этом не упомянул" }
  - { pl: "wspomnienia z dzieciństwa", ru: "воспоминания детства" }
  - { pl: "wspomnisz moje słowa", ru: "помянешь моё слово" }
family:
  - { pl: "wspominać", ru: "упоминать, вспоминать", relation: aspect }
  - { pl: "wspomnienie", ru: "воспоминание", relation: derived }
  - { pl: "pamiętać", ru: "помнить", relation: root, id: pamietac }
etymology: "Из w- + spomnieć, того же корня, что pamięć «память» и pomnieć «помнить». Русское «вспомнить» собрано ровно так же."
memory: "wspomnieć — прежде всего «упомянуть»: wspomnieć O czymś, с предлогом o и предложным падежом. Без предлога значит «помянуть, вспомнить кого-то»: Wspomnij mnie. Различайте pamiętać «помнить», przypominać sobie «припоминать» и wspomnieć «упомянуть вслух»."
idioms:
  - { pl: "wspomnieć o czymś", ru: "упомянуть о чём-то" }
  - { pl: "wspomnienia z dzieciństwa", ru: "воспоминания детства" }
  - { pl: "wspomnisz moje słowa", ru: "помянешь моё слово" }
