  - id: root
    ru: "корень (математический)"
    examples:
      - pl: "Pierwiastek kwadratowy z dziewięciu to trzy."
        ru: "Квадратный корень из девяти — три."
        source: { kind: translated, id: 11562744 }
      - pl: "Ile wynosi pierwiastek kwadratowy z dziewięciu?"
        ru: "Чему равен квадратный корень из девяти?"
        source: { kind: translated, id: 13607082 }
notes:
  - { kind: usage, text: "Два разных школьных предмета в одном слове: химический элемент и математический корень. pierwiastek kwadratowy «квадратный корень»." }
  - { kind: false-friend, text: "Русский тут разводит два слова — «элемент» и «корень», а польский держит одно. Дословно «первоначало», от pierwszy «первый»." }
  - { kind: government, text: "Мужской неодушевлённый; беглое e: pierwiastek, но pierwiastka." }
  - { kind: usage, text: "Есть и переносное «начало, зачаток»: pierwiastek dobra «зачаток добра»." }
collocations:
  - { pl: "pierwiastek chemiczny", ru: "химический элемент" }
  - { pl: "pierwiastek kwadratowy", ru: "квадратный корень" }
etymology: "От pierwszy «первый»: буквально «первоначало». Русский разводит значения на «элемент» и «корень», польский держит одно слово."
memory: "pierwiastek — и «химический элемент», и «квадратный корень». Одно польское слово на два русских, от pierwszy «первый»."
