notes:
  - { kind: usage, text: "Два разных школьных предмета в одном слове: химический элемент и математический корень. pierwiastek kwadratowy «квадратный корень»." }
  - { kind: false-friend, text: "Русский тут разводит два слова — «элемент» и «корень», а польский держит одно. Дословно «первоначало», от pierwszy «первый»." }
  - { kind: government, text: "Мужской неодушевлённый; беглое e: pierwiastek, но pierwiastka." }
  - { kind: usage, text: "Есть и переносное «начало, зачаток»: pierwiastek dobra «зачаток добра»." }
