# review
id: szczedzic
format: 2
lemma: "szczędzić"
rank: 2459
pos: verb
aspect: imperf
pron: { cyr: "шчэ́ндзиць" }
senses:
  - id: spare
    ru: "жалеть, скупиться (на что-л.)"
    examples:
      - pl: "Nie szczędził sił, by mi pomóc."
        ru: "Он не жалел сил, чтобы мне помочь."
        source: { kind: translated, id: 567087 }
      - pl: "Mary nie szczędziła mu wyzwisk."
        ru: "Мэри не жалела для него ругательств."
        source: { kind: translated, id: 360307 }
      - pl: "Nie szczędź jej pochwał."
        ru: "Не жалей для неё похвал."
        source: { kind: translated, id: 12470470 }
  - id: stint
    ru: "щадить, беречь"
    examples:
      - pl: "Nie szczędzi pieniędzy na książki."
        ru: "Он не жалеет денег на книги."
        source: { kind: authored }
      - pl: "Nie szczędzili starań."
        ru: "Они не жалели стараний."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Почти всегда с отрицанием: nie szczędzić czegoś «не жалеть чего-л.». Утвердительное szczędzić встречается редко." }
  - { kind: government, text: "Дополнение в РОДИТЕЛЬНОМ падеже — и это как раз тот случай, когда русское «не жалеть сил» совпадает: nie szczędzić sił." }
  - { kind: false-friend, text: "Родственно oszczędzać «экономить» и oszczędności «сбережения». Корень тот же, что в русском «щадить», «пощада»." }
  - { kind: usage, text: "Совершенный вид — poszczędzić, но он почти не употребляется; в ходу именно несовершенный с отрицанием." }
collocations:
  - { pl: "nie szczędzić sił", ru: "не жалеть сил" }
  - { pl: "nie szczędzić pochwał", ru: "не жалеть похвал" }
etymology: "Тот же корень, что в русском «щадить», «пощада»; родственно oszczędzać «экономить»."
memory: "szczędzić — «жалеть, скупиться», и живёт оно почти только с отрицанием: nie szczędzić sił «не жалеть сил», с родительным падежом. Родня — oszczędzać «экономить»."
idioms:
  - { pl: "nie szczędzić sił", ru: "не жалеть сил" }
