# review
id: uczciwy
format: 2
lemma: "uczciwy"
rank: 2068
pos: adj
pron: { cyr: "учци́вы" }
senses:
  - id: honest
    ru: "честный (о человеке)"
    examples:
      - pl: "To uczciwy człowiek, można mu wierzyć."
        ru: "Это честный человек, ему можно верить."
        source: { kind: authored }
      - pl: "Uczciwi ludzie też popełniają błędy."
        ru: "Честные люди тоже ошибаются."
        source: { kind: authored }
      - pl: "Był najuczciwszym urzędnikiem w całym mieście."
        ru: "Он был самым честным чиновником во всём городе."
        source: { kind: authored }
  - id: fair
    ru: "честный, справедливый (о деле, заработке, цене)"
    examples:
      - pl: "Uczciwa praca nikogo nie hańbi."
        ru: "Честный труд никого не позорит."
        source: { kind: authored }
      - pl: "To uczciwa cena za taki dom."
        ru: "Это честная цена за такой дом."
        source: { kind: authored }
  - id: decent
    ru: "порядочный, добросовестный"
    examples:
      - pl: "Uczciwe podejście do klienta popłaca."
        ru: "Добросовестное отношение к клиенту окупается."
        source: { kind: authored }
      - pl: "Szukają uczciwego wykonawcy."
        ru: "Они ищут добросовестного подрядчика."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "КОРЕНЬ ВЫ УЗНАЕТЕ СРАЗУ: uczciwy идёт от cześć «ЧЕСТЬ», и польское cz отвечает русскому «ч». Отсюда uczciwość — «честность», uczciwie — «честно». Заодно запомните, что то же слово cześć служит приветствием «привет!» — одно написание, две совершенно разные роли." }
  - { kind: usage, text: "Рядом стоит szczery «искренний», и путать их не стоит: uczciwy — о порядочности, о том, что человек не обманет; szczery — о прямоте, о том, что говорит что думает. Można być szczerym, ale nieuczciwym — можно быть искренним, но нечестным." }
  - { kind: pronunciation, text: "Тридцать три формы — полный набор трёх степеней: uczciwy, uczciwszy, najuczciwszy. Произношение непростое из-за стечения согласных: ucz-ci-wy читается «учци́вы», ударение на предпоследнем слоге. В мужско-личной форме множественного — uczciwi, с мягким окончанием." }
  - { kind: register, text: "Наречие uczciwie значит «честно» и в прямом смысле, и как вводное: uczciwie mówiąc — «честно говоря». Существительное uczciwość — «честность, порядочность», слово вполне обиходное." }
collocations:
  - { pl: "uczciwa praca", ru: "честный труд" }
  - { pl: "uczciwie mówiąc", ru: "честно говоря" }
  - { pl: "uczciwa cena", ru: "честная цена" }
family:
  - { pl: "cześć", ru: "честь; привет", relation: root, id: czesc }
  - { pl: "uczciwość", ru: "честность", relation: derived }
  - { pl: "nieuczciwy", ru: "нечестный", relation: antonym }
etymology: "От cześć «честь» — того же слова, что русская «честь», с обычным соответствием польского cz русскому «ч». Приставка u- и суффикс -iwy дают «такой, у кого есть честь». Отсюда uczciwość «честность», uczciwie «честно» и отрицательное nieuczciwy «нечестный»."
memory: "uczciwy — «честный», от cześć «честь» (польское cz равно русскому «ч»). Не путайте с szczery «искренний»: uczciwy о порядочности, szczery о прямоте. И cześć — это ещё и «привет!»."
idioms:
