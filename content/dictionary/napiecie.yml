# review
id: napiecie
format: 2
lemma: "napięcie"
rank: 2561
pos: noun
pron: { cyr: "напье́ньцье" }
senses:
  - id: tension
    ru: "напряжение, напряжённость (о состоянии)"
    examples:
      - pl: "Napięcie w pokoju rosło z każdą minutą."
        ru: "Напряжение в комнате росло с каждой минутой."
        source: { kind: authored }
      - pl: "Czuł napięcie przed egzaminem."
        ru: "Он чувствовал напряжение перед экзаменом."
        source: { kind: authored }
      - pl: "Napięcie wreszcie opadło."
        ru: "Напряжение наконец спало."
        source: { kind: authored }
  - id: voltage
    ru: "напряжение (электрическое)"
    examples:
      - pl: "Napięcie w sieci wynosi dwieście trzydzieści woltów."
        ru: "Напряжение в сети — двести тридцать вольт."
        source: { kind: authored }
      - pl: "Uwaga, wysokie napięcie!"
        ru: "Осторожно, высокое напряжение!"
        source: { kind: authored }
  - id: social-tensions
    ru: "напряжённость в обществе, в отношениях (обычно во множественном)"
    examples:
      - pl: "Napięcia społeczne narastały od miesięcy."
        ru: "Социальная напряжённость нарастала месяцами."
        source: { kind: authored }
      - pl: "Napięcia między oboma krajami wreszcie zmalały."
        ru: "Напряжённость между обеими странами наконец уменьшилась."
        source: { kind: authored }
notes:
  - { kind: government, text: "Средний род: napięcie, napięcia, napięciu. Отглагольное существительное от napiąć «натянуть»." }
  - { kind: usage, text: "Как и русское «напряжение», слово покрывает и чувство, и физику: napięcie przed egzaminem и napięcie w sieci." }
  - { kind: usage, text: "Множественное число обычно и значит «напряжённость» в обществе или в отношениях: napięcia społeczne, napięcia międzynarodowe." }
  - { kind: false-friend, text: "В значении «натянутость троса» тоже napięcie, но «напряжённый» о человеке — zdenerwowany или spięty, а не napięty." }
collocations:
  - { pl: "wysokie napięcie", ru: "высокое напряжение" }
  - { pl: "napięcie opada", ru: "напряжение спадает" }
  - { pl: "napięcia społeczne", ru: "социальная напряжённость" }
family:
  - { pl: "napiąć", ru: "натянуть, напрячь", relation: root }
  - { pl: "napięty", ru: "натянутый, напряжённый", relation: derived }
etymology: "Отглагольное существительное от napiąć «натянуть», с приставкой na- и корнем, родственным русскому «пялить, пяльцы». Русское «напряжение» образовано от другого корня, но прошло тот же путь от физического натяжения к чувству."
memory: "napięcie — и «напряжение» в душе, и напряжение в сети, как в русском. Во множественном числе napięcia это «напряжённость»: napięcia społeczne."
idioms:
  - { pl: "wysokie napięcie", ru: "высокое напряжение" }
  - { pl: "napięcie opada", ru: "напряжение спадает" }
