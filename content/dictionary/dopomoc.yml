# review
id: dopomoc
format: 2
lemma: "dopomóc"
rank: 2026
pos: verb
aspect: perf
pron: { cyr: "допо́муц" }
senses:
  - id: help
    ru: "помочь, пособить (книжное)"
    examples:
      - pl: "Niech Bóg nam dopomoże."
        ru: "Да поможет нам Бог."
        source: { kind: translated, id: 6549428 }
      - pl: "Mogę ci dopomóc."
        ru: "Я могу тебе помочь."
        source: { kind: translated, id: 8721035 }
      - pl: "Dopomóż mi w tej sprawie."
        ru: "Помоги мне в этом деле."
        source: { kind: authored }
      - pl: "Sąsiedzi dopomogli nam w przeprowadzce."
        ru: "Соседи помогли нам с переездом."
        source: { kind: authored }
      - pl: "Nikt mu nie dopomógł."
        ru: "Никто ему не помог."
        source: { kind: authored }
notes:
  - { kind: government, text: "Дательный падеж: dopomóc komuś «помочь кому-л.» — как в русском." }
  - { kind: usage, text: "Книжный и слегка торжественный вариант pomóc. Чаще всего звучит в присяге: tak mi dopomóż Bóg «да поможет мне Бог»." }
  - { kind: usage, text: "Несовершенный вид — dopomagać." }
  - { kind: false-friend, text: "Корень тот же, что в русском «помочь»: do- + po- + móc «мочь»." }
collocations:
  - { pl: "dopomóc komuś", ru: "помочь кому-л." }
  - { pl: "tak mi dopomóż Bóg", ru: "да поможет мне Бог" }
etymology: "do- + pomóc, от móc «мочь»; русское «помочь» и «подмога» — тот же корень."
memory: "dopomóc — книжное «помочь», с дательным падежом, как в русском. Запомните формулу присяги: tak mi dopomóż Bóg «да поможет мне Бог»."
idioms:
