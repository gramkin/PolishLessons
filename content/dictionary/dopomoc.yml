# review
id: dopomoc
format: 2
lemma: "dopomóc"
rank: 5413
pos: verb
aspect: perf
pron: { cyr: "допо́муц" }
senses:
  - id: help
    ru: "помочь, пособить (книжное)"
    examples:
      - pl: "Niech Bóg nam dopomoże."
        ru: "Да поможет нам Бог."
        source: { kind: translated, id: 6549428 }
      - pl: "Mogę ci dopomóc."
        ru: "Я могу тебе помочь."
        source: { kind: translated, id: 8721035 }
      - pl: "Dopomóż mi w tej sprawie."
        ru: "Помоги мне в этом деле."
        source: { kind: authored }
      - pl: "Sąsiedzi dopomogli nam w przeprowadzce."
        ru: "Соседи помогли нам с переездом."
        source: { kind: authored }
      - pl: "Nikt mu nie dopomógł."
        ru: "Никто ему не помог."
        source: { kind: authored }
notes:
  - { kind: government, text: "Дательный падеж: dopomóc komuś «помочь кому-л.» — как в русском." }
  - { kind: usage, text: "Книжный и слегка торжественный вариант pomóc. Чаще всего звучит в присяге: tak mi dopomóż Bóg «да поможет мне Бог»." }
  - { kind: usage, text: "Несовершенный вид — dopomagać." }
  - { kind: false-friend, text: "Корень тот же, что в русском «помочь»: do- + po- + móc «мочь»." }
  - { kind: government, text: "В мужском роде прошедшего времени корень с ó: dopomógł. Перед гласной ó возвращается к o: dopomogła, dopomogło, dopomogli, dopomogły. Точно так же ведёт себя mógł и mogła." }
collocations:
  - { pl: "dopomóc komuś", ru: "помочь кому-л." }
  - { pl: "tak mi dopomóż Bóg", ru: "да поможет мне Бог" }
etymology: "do- + pomóc, от móc «мочь»; русское «помочь» и «подмога» — тот же корень."
memory: "dopomóc — книжное «помочь», с дательным падежом, как в русском. Запомните формулу присяги: tak mi dopomóż Bóg «да поможет мне Бог»."
idioms:
  - { pl: "tak mi dopomóż Bóg", ru: "да поможет мне Бог" }
formExamplesSkip:
  - { form: "dopomogł", reason: "мужская форма прошедшего времени здесь с ó: dopomógł, как mógł. Без ó слово существует только в женском и среднем роде и во множественном — dopomogła, dopomogło, dopomogli, — где за корнем идёт гласная" }
  - { form: "dopomogłby", reason: "написание без ó: мужской род прошедшего времени — dopomógł, поэтому и условное наклонение будет dopomógłby, dopomógłbym, dopomógłbyś" }
  - { form: "dopomogłbym", reason: "написание без ó: мужской род прошедшего времени — dopomógł, поэтому и условное наклонение будет dopomógłby, dopomógłbym, dopomógłbyś" }
  - { form: "dopomogłbyś", reason: "написание без ó: мужской род прошедшего времени — dopomógł, поэтому и условное наклонение будет dopomógłby, dopomógłbym, dopomógłbyś" }
