etymology: "От PISAĆ «писать», из праславянского *pьsati, которое исходно значило «царапать, рисовать» — тот же корень в русском «писать» и в «пёстрый», где сохранилось старое значение узора. Суффикс -ARZ образует названия занятий и восходит к латинскому -ARIUS, пришедшему через немецкое -ER: отсюда же LEKARZ, MALARZ, PIEKARZ. Русский суффикс «-арь» в «писарь», «пекарь» — того же происхождения и той же модели. То есть PISARZ и «писарь» — буквально одно слово, собранное из одних частей; разошлись они не формой, а положением в обществе: польское поднялось до автора книг, русское осталось при канцелярии."
memory: "PISARZ — это писатель, а не «писарь»: слово уважительное. Русскому «писарю» отвечает pisarz sądowy или kancelista. Конечное rz оглушается: «пи́саш», но «писа́жа». Родительный множественного — pisarzy (реже pisarzów), женская форма — pisarka."
