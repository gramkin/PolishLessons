notes:
  - { kind: false-friend, text: "Ловушка редкой чистоты: одно слово, два языка, разные общественные ранги. Польское PISARZ — это писатель, автор книг, и слово это уважительное: NOBEL DLA POLSKIEGO PISARZA. Русское «писарь» — наоборот, низший канцелярский служащий, переписчик бумаг, и звучит почти пренебрежительно. Так что «он писарь» и ON JEST PISARZEM — это совсем разные сообщения. Русскому «писателю» отвечает PISARZ, а русскому «писарю» — PISARZ SĄDOWY, KANCELISTA или URZĘDNIK. Историческое значение у польского слова тоже есть, но оно уже книжное." }
  - { kind: usage, text: "Существительное мужского рода одушевлённое, мужско-личное, поэтому именительный множественного — PISARZE, а винительный множественного совпадает с родительным: ZNAM TYCH PISARZY. Женская форма — PISARKA, и она совершенно обычна: POLSKA PISARKA, а не PISARZ KOBIETA. Это важно, потому что в русском «писательница» тоже есть, но в польском женские формы профессий употребляются шире и спокойнее, чем кажется русскому уху." }
  - { kind: pronunciation, text: "Читается «пи́саш», в два слога, с ударением на первом. Сочетание rz даёт «ж», но на конце слова оно оглушается в «ш», поэтому PISARZ звучит «пи́саш», а не «пи́саж». Как только добавляется окончание, звонкость возвращается: PISARZA — «писа́жа», PISARZEM — «писа́жэм». Это общее правило польского оглушения на конце слова, то же, что в LEW «лэф» и GDYŻ «гдыш»." }
  - { kind: government, text: "Родительный падеж множественного числа имеет два варианта: литературный PISARZY и более старый PISARZÓW. Оба правильны, но в современных текстах преобладает PISARZY, и его стоит выбирать по умолчанию. Остальное склонение обычное для мужско-личных существительных на -rz: дательный PISARZOWI, звательный PISARZU, местный тоже PISARZU. Звательная форма употребляется редко, разве что в обращении на письме." }
