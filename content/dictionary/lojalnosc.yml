notes:
  - { kind: false-friend, text: "Форма слова совпадает с русской полностью, потому что совпадает суффикс: польское -OŚĆ и русское -ОСТЬ — один и тот же суффикс, и соответствие работает без исключений. LOJALNOŚĆ и «лояльность», WIERNOŚĆ и «верность», WIECZNOŚĆ и «вечность». Но смысл разошёлся, и разница тонкая. Польское LOJALNOŚĆ это прежде всего верность — человеку, фирме, стране, слову: LOJALNOŚĆ WOBEC ZESPOŁU «верность команде». Русская «лояльность» это тоже верность, но нередко и благожелательная терпимость, снисходительность: «лояльное отношение» по-польски будет не LOJALNOŚĆ, а WYROZUMIAŁOŚĆ или POBŁAŻLIWOŚĆ. Поэтому переводить надо по контексту, а при сомнении брать WIERNOŚĆ." }
  - { kind: government, text: "Женский род. К кому или чему верность — предлог WOBEC с родительным: LOJALNOŚĆ WOBEC FIRMY, WOBEC PRZYJACIÓŁ, WOBEC PAŃSTWA. Можно и через DO с родительным, но WOBEC употребительнее и звучит нейтральнее. Частотные глаголы: DOCHOWAĆ LOJALNOŚCI «сохранить верность» — требует родительного, а не винительного; ZACHOWAĆ LOJALNOŚĆ; OKAZAĆ LOJALNOŚĆ «проявить верность»; ZŁAMAĆ LOJALNOŚĆ. Прилагательное LOJALNY «верный, лояльный», наречие LOJALNIE. Устойчивое PODWÓJNA LOJALNOŚĆ «двойная лояльность»." }
  - { kind: usage, text: "Существительные на -OŚĆ имеют в польском всего шесть форм, и это одна из самых выгодных закономерностей для учащегося. Форма LOJALNOŚCI покрывает пять позиций сразу: родительный, дательный и местный единственного, а также именительный, винительный и родительный множественного. Остаются LOJALNOŚĆ для именительного и винительного единственного, LOJALNOŚCIĄ для творительного единственного, и три формы множественного — LOJALNOŚCIOM, LOJALNOŚCIACH, LOJALNOŚCIAMI. Так весь набор запоминается разом и переносится на любое слово этого типа: WOLNOŚĆ, MIŁOŚĆ, WIECZNOŚĆ, POSIADŁOŚĆ склоняются точно так же." }
  - { kind: pronunciation, text: "Читается «лоя́льносьць», три слога, ударение на предпоследнем. Сочетание OJ даёт «ой», а следующее за ним A — «я», поэтому начало слова звучит «лоя». Буква L перед гласной мягче русского «л», но не «ль»; здесь она стоит перед Ą-подобным сочетанием и звучит ближе к «ль». Конечное -ŚĆ это два мягких согласных подряд, «сьць», и произносить их надо слитно и коротко, не вставляя гласной. В форме LOJALNOŚCI конечное -I смягчает предшествующее: «лоя́льносьци»." }
