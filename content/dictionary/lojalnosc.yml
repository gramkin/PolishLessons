etymology: "От LOJALNY, заимствованного через французское LOYAL из старофранцузского LOIAL, а то — из латинского LEGALIS «законный», от LEX «закон». То есть исходно верность означала законопослушность, следование закону, и лишь потом стала верностью человеку. Русский взял слово тем же путём и в то же время, в девятнадцатом веке, поэтому «лояльный» и LOJALNY — не родственники по славянскому корню, а два независимых заимствования из одного источника. Суффикс же, которым оба языка сделали из прилагательного существительное, общий и праславянский: -OŚĆ и -ОСТЬ восходят к *-ostь. Так слово составлено из французского корня и славянского суффикса, причём в обоих языках одинаково. От латинского LEX в польском есть и прямые потомки учёного происхождения: LEGALNY «законный», LEGISLACJA."
memory: "Суффикс -ość равен русскому -ость без исключений: lojalność, wierność, wieczność. Шесть форм на всё слово, и lojalności покрывает пять позиций — родительный, дательный, местный единственного и именительный, винительный, родительный множественного. Смысл чуть сдвинут: польское lojalność — это верность, а русская «лояльность» часто ещё и терпимость, которая по-польски wyrozumiałość. Кому верность — предлог wobec с родительным."
