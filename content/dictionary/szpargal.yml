      - { pl: "Grzebał w szpargałach przez całe popołudnie.", ru: "Он копался в старых бумагах весь день.", source: { kind: authored } }
notes:
  - { kind: false-friend, text: "SZPARGAŁ — не «шпаргалка». Это старая ненужная бумага, хлам: SZPARGAŁY — «бумажки, бумажный хлам». Шпаргалка по-польски ŚCIĄGA. При этом русское слово, по-видимому, происходит именно отсюда." }
  - { kind: usage, text: "Обычно во множественном: SZPARGAŁY, STOS SZPARGAŁÓW. В предложном Ł чередуется с L: W SZPARGALE — как STÓŁ, NA STOLE." }
  - { kind: register, text: "Разговорное, слегка пренебрежительное: так называют старые бумаги, которые жалко выбросить, — свои или чужие." }
  - { kind: pronunciation, text: "Ł читается как «у»: «шпа́ргау». Ударение на первом слоге." }
collocations:
  - { pl: "stos szpargałów", ru: "груда старых бумаг" }
  - { pl: "grzebać w szpargałach", ru: "копаться в старых бумагах" }
  - { pl: "stare szpargały", ru: "старый бумажный хлам" }
family:
  - { pl: "szpargałek", ru: "бумажонка", relation: derived }
synonyms: ["makulatura", "rupiecie", "papierzyska"]
etymology: "По-видимому, через позднелатинское SPARGANUM из греческого SPÁRGANON «пелёнка, лоскут». Из польского слово, вероятно, перешло в русский и дало «шпаргалку»."
memory: "Szpargał — не шпаргалка, а бумажный хлам. Но шпаргалка — его потомок: тоже бумажка."
idioms:
  - { pl: "grzebać w szpargałach", ru: "копаться в старых бумагах" }
