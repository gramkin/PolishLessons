pos: noun
pron: { cyr: "шпа́ргау" }
senses:
  - id: old-papers
    ru: "старая бумажка, бумажный хлам (обычно мн.: szpargały — старые бумаги)"
    examples:
      - { pl: "Na strychu leżały stosy szpargałów.", ru: "На чердаке лежали груды старых бумаг.", source: { kind: authored } }
      - { pl: "Wyrzuć wreszcie te szpargały!", ru: "Выброси наконец этот хлам!", source: { kind: authored } }
      - { pl: "W szpargałach dziadka znalazłem stare listy.", ru: "В бумагах деда я нашёл старые письма.", source: { kind: authored } }
