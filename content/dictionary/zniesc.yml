# review
id: zniesc
format: 2
lemma: "znieść"
rank: 1371
pos: verb
aspect: perf
pron: { cyr: "зне́сьць" }
senses:
  - id: endure
    ru: "вынести, стерпеть"
    examples:
      - pl: "Nie mogę go znieść."
        ru: "Я его не выношу."
        source: { kind: translated, id: 364741 }
      - pl: "Ten hałas jest nie do zniesienia."
        ru: "Этот шум невыносим."
        source: { kind: tatoeba, id: 2147273 }
      - pl: "Dłużej tego nie zniosę!"
        ru: "Я больше этого не вынесу!"
        source: { kind: translated, id: 1176736 }
  - id: abolish
    ru: "отменить (закон, налог, наказание)"
    examples:
      - pl: "Prezydent zniósł niewolnictwo."
        ru: "Президент отменил рабство."
        source: { kind: translated, id: 525311 }
      - pl: "W ubiegłym roku zniesiono karę śmierci."
        ru: "В прошлом году отменили смертную казнь."
        source: { kind: translated, id: 745424 }
  - id: carry-down
    ru: "снести (вниз, течением); снести (яйцо)"
    examples:
      - pl: "Kura zniosła jajko."
        ru: "Курица снесла яйцо."
        source: { kind: translated, id: 2757121 }
      - pl: "Powódź zniosła most."
        ru: "Наводнение снесло мост."
        source: { kind: translated, id: 908090 }
notes:
  - { kind: usage, text: "Совершенный вид к znosić. Глагол очень многозначный: «вынести (стерпеть)», «отменить», «снести (вниз, водой)», «снести (яйцо)»." }
  - { kind: usage, text: "nie do zniesienia — «невыносимый», самый частый оборот: Ten hałas jest nie do zniesienia." }
  - { kind: government, text: "znieść coś, винительный: znieść karę śmierci «отменить смертную казнь», nie znieść hałasu «не выносить шума»." }
  - { kind: false-friend, text: "Значение «отменить закон или налог» русскому «снести» не свойственно — там нужно именно «отменить». А znieść jajko «снести яйцо» совпадает." }
collocations:
  - { pl: "nie do zniesienia", ru: "невыносимый" }
  - { pl: "znieść karę śmierci", ru: "отменить смертную казнь" }
  - { pl: "nie móc znieść", ru: "не выносить" }
etymology: "Приставка z- и nieść «нести» (праславянское *nesti). Русское «снести» — то же самое слово, и часть значений совпадает."
memory: "znieść — «вынести, стерпеть», но ещё и «отменить»: znieść karę śmierci «отменить смертную казнь». Запомните оборот nie do zniesienia «невыносимый». Совершенный вид к znosić."
idioms:
  - { pl: "nie do zniesienia", ru: "невыносимый" }
  - { pl: "znieść karę śmierci", ru: "отменить смертную казнь" }
  - { pl: "znieść jajko", ru: "снести яйцо" }
