  - { pl: "kielich", ru: "бокал, чаша", relation: root }
  - { pl: "chleb", ru: "хлеб", relation: root, id: chleb }
etymology: "Из английского TOAST, а то — из старофранцузского TOSTER «поджаривать», от латинского TORRERE «сушить, жарить». Застольное значение появилось в Англии восемнадцатого века и имеет вполне материальное объяснение: в бокал с вином опускали ломтик поджаренного хлеба с пряностями, и выпить за чьё-то здоровье значило выпить этот бокал вместе с хлебом. Так одно слово стало называть и ломтик, и речь. Русский «тост» пришёл тем же путём и с тем же раздвоением, поэтому в обоих языках слово делает одну и ту же двойную работу."
memory: "Два слога, «то-аст», а не один, как в русском: польский сохранил обе гласные английского toast. Местный падеж toaście, со смягчением st в ść — как miasto и w mieście, list и w liście. Оба значения совпадают с русскими: и речь, и поджаренный хлеб, и объяснение историческое — в бокал опускали ломтик хлеба."
idioms:
