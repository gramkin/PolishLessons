notes:
  - { kind: pronunciation, text: "Читается «тоаст», и это главное в карточке: сочетание OA произносится в два слога, TO-AST, а не сливается в один звук, как в английском источнике. Ударение падает на первый слог. Но самое неожиданное — местный падеж TOAŚCIE: там сочетание ST перед окончанием -IE смягчается целиком, S переходит в Ś, и форма звучит «тоа́сьце». Это чередование ST и ŚC встречается и в других словах: MIASTO и W MIEŚCIE, LIST и W LIŚCIE, и запоминать его стоит сразу тройкой." }
  - { kind: usage, text: "Два значения различает только контекст, и оба частотны. Застольное: WZNIEŚĆ TOAST «поднять тост», WYGŁOSIĆ TOAST «произнести тост», TOAST ZA ZDROWIE «тост за здоровье». Кухонное: TOAST Z SEREM, TOSTER «тостер», CHLEB TOSTOWY «хлеб для тостов». В кухонном значении множественное число TOASTY обычнее единственного, а в застольном наоборот. Путаницы почти не возникает, потому что речь поднимают, а хлеб едят, но стоит знать, что одно слово покрывает оба." }
  - { kind: government, text: "Мужской род, неодушевлённое. Винительный равен именительному: WZNIEŚLI TOAST. Родительный на -U: BEZ TOASTU. Местный на -IE со смягчением: PO TOAŚCIE. За кого или за что пьют — предлог ZA с винительным: TOAST ZA MŁODĄ PARĘ, TOAST ZA ZDROWIE, и русский строит это так же. При отрицании винительный уходит в родительный: NIE WZNIEŚLI TOASTU. В кухонном значении начинка вводится предлогом Z с творительным: TOAST Z SEREM." }
  - { kind: false-friend, text: "Значение полностью совпадает с русским «тостом», включая оба смысла, и это редкий случай, когда заимствование разошлось одинаково в двух языках. Отметить стоит только произношение: русский говорит «тост», одним слогом, а польский TOAST — двумя, «то-аст», потому что сохранил обе гласные английского TOAST. Поэтому на слух слово кажется длиннее и незнакомее, чем на письме, и русскоязычный склонен произнести его по-русски. Проговорить стоит пару: русское «тост» и польское «то-аст»." }
collocations:
  - { pl: "wznieść toast", ru: "поднять тост" }
  - { pl: "toast za zdrowie", ru: "тост за здоровье" }
