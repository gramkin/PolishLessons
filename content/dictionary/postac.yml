# review
id: postac
format: 2
lemma: "postać"
rank: 1582
pos: noun
pron: { cyr: "по́стаць" }
senses:
  - id: character
    ru: "персонаж, фигура (человек)"
    examples:
      - pl: "To moja ulubiona postać."
        ru: "Это мой любимый персонаж."
        source: { kind: translated, id: 2202109 }
      - pl: "Abraham Lincoln to sławna postać."
        ru: "Авраам Линкольн — знаменитая фигура."
        source: { kind: translated, id: 526493 }
      - pl: "Zobaczyłem postać w ciemności."
        ru: "Я увидел фигуру в темноте."
        source: { kind: translated, id: 11573488 }
  - id: form
    ru: "форма, вид, облик"
    examples:
      - pl: "Motyl to dorosła postać gąsienicy."
        ru: "Бабочка - это зрелая гусеница."
        source: { kind: tatoeba, id: 367825 }
      - pl: "Na szczycie góry stała tajemnicza postać."
        ru: "На вершине горы стояла таинственная фигура."
        source: { kind: tatoeba, id: 12471287 }
      - pl: "To zmienia zupełnie postać rzeczy."
        ru: "Это полностью меняет вид дела."
        source: { kind: translated, id: 13465766 }
notes:
  - { kind: false-friend, text: "Омонимы: существительное postać «фигура, персонаж, форма» и совершенный глагол postać «постоять». Частотно именно существительное — все примеры к этой форме в корпусе относятся к нему. Формы вроде postoję «постою» принадлежат глаголу и в этой карточке пропущены." }
  - { kind: usage, text: "Существительное склоняется как женское на мягкую основу: postać, postaci, postacią, postacie — но в частотном списке представлена только базовая форма." }
  - { kind: usage, text: "w postaci значит «в виде»: lód to woda w postaci stałej «лёд — это вода в твёрдом виде»." }
  - { kind: usage, text: "Историческая или литературная фигура — тоже postać: sławna postać «знаменитая фигура», ulubiona postać «любимый персонаж»." }
collocations:
  - { pl: "ulubiona postać", ru: "любимый персонаж" }
  - { pl: "w postaci", ru: "в виде" }
  - { pl: "sławna postać", ru: "знаменитая фигура" }
etymology: "Отглагольное существительное от stać «стоять» с приставкой po- — буквально «то, как что-то стоит, облик». Русское «стать» в значении «осанка, облик» («статный») идёт от того же корня."
memory: "postać = «фигура, персонаж, облик»: ulubiona postać «любимый персонаж», w postaci «в виде». Осторожно: есть омонимичный глагол postać «постоять» — совпадает только эта форма, значения разные."
idioms:
  - { pl: "ulubiona postać", ru: "любимый персонаж" }
  - { pl: "w postaci", ru: "в виде" }
  - { pl: "sławna postać", ru: "знаменитая фигура" }
