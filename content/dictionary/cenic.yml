# review
id: cenic
format: 2
lemma: "cenić"
rank: 4402
pos: verb
pron: { cyr: "цэ́ниць" }
senses:
  - id: value
    ru: "ценить"
    examples:
      - pl: "Cenię szczerość ponad wszystko."
        ru: "Я ценю честность превыше всего."
        source: { kind: authored }
      - pl: "Szef ceni go za dokładność."
        ru: "Начальник ценит его за аккуратность."
        source: { kind: authored }
      - pl: "Ludzie cenią spokój."
        ru: "Люди ценят покой."
        source: { kind: authored }
  - id: rate-high
    ru: "CENIĆ SIĘ — знать себе цену; дорого брать"
    examples:
      - pl: "Ten fotograf wysoko się ceni."
        ru: "Этот фотограф дорого берёт."
        source: { kind: authored }
      - pl: "Ceń się, nie pracuj za darmo."
        ru: "Знай себе цену, не работай бесплатно."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "CENIĆ — «ценить», совпадение полное. Но CENIĆ SIĘ значит «знать себе цену» или «дорого брать», а не «цениться другими». Цена — CENA, ценный — CENNY, высоко ценимый — CENIONY: CENIONY LEKARZ «уважаемый врач»." }
  - { kind: usage, text: "Несовершенный вид; совершенный — DOCENIĆ «оценить по достоинству». Спряжение: CENIĘ, CENISZ, CENIĄ. Повелительное — CEŃ. Отглагольное существительное CENIENIE в карточку не включено: говорят SZACUNEK «уважение»." }
  - { kind: government, text: "Кого, что — винительный: CENIĆ PRZYJAŹŃ. За что — ZA с винительным: ZA UCZCIWOŚĆ. Как — наречие: WYSOKO, BARDZO. Больше чего — PONAD с винительным: PONAD WSZYSTKO." }
  - { kind: pronunciation, text: "Читается «цэ́ниць»: C — «ц», NI — мягкое «нь». Ударение на первом слоге. CENIĘ — «цэ́не»." }
  - { kind: register, text: "Нейтральное слово. CENIONY SPECJALISTA — частое в объявлениях и прессе." }
collocations:
  - { pl: "cenić kogoś za coś", ru: "ценить кого-то за что-то" }
  - { pl: "wysoko cenić", ru: "высоко ценить" }
  - { pl: "cenić sobie spokój", ru: "дорожить покоем" }
family:
  - { pl: "docenić", ru: "оценить по достоинству", relation: aspect, id: docenic }
  - { pl: "cena", ru: "цена", relation: root, id: cena }
  - { pl: "szanować", ru: "уважать", relation: root, id: szanowac }
etymology: "От CENA «цена», праславянское *cěna, как русское «цена», «ценить». Буквально «назначать цену», затем «считать ценным»."
memory: "Cenić — ценить: cenię szczerość. Cenić się — знать себе цену или дорого брать."
idioms:
  - { pl: "cenić sobie coś", ru: "дорожить чем-то" }
