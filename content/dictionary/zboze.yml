      - pl: "Za następnym budynkiem znajdował się magazyn na zboże."
        ru: "За следующим зданием находился склад для зерна."
        source: { kind: translated, id: 6320373 }
notes:
  - { kind: usage, text: "ZBOŻE — собирательное слово: и то, что растёт на поле (пшеница, рожь, ячмень, овёс), и собранное зерно как товар. Отдельное зёрнышко — ZIARNO. Множественное ZBOŻA значит «виды зерновых»: ZBOŻA OZIME — озимые." }
  - { kind: pronunciation, text: "Ż читается как «ж», конечное E — как «э»: «збо́жэ». В родительном множественного O переходит в Ó: ZBÓŻ (читается «збуж»), как DROGA → DRÓG." }
  - { kind: usage, text: "Русского «збожье» нет, и слово легко не узнать. Его родня — BÓG в старом смысле «доля, богатство» (ср. русское «богатый», «убогий»): зерно было главным достатком крестьянина." }
collocations:
  - { pl: "zebrać zboże", ru: "собрать урожай зерна" }
  - { pl: "pole zboża", ru: "хлебное поле" }
  - { pl: "zboża ozime", ru: "озимые" }
  - { pl: "skup zboża", ru: "закупка зерна" }
family:
  - { pl: "zbożowy", ru: "зерновой, хлебный", relation: derived }
  - { pl: "ziarno", ru: "зерно, зёрнышко", relation: root, id: ziarno }
  - { pl: "mąka", ru: "мука", relation: root, id: maka }
  - { pl: "chleb", ru: "хлеб", relation: root, id: chleb }
etymology: "Из праславянского *sъbožьje — того же корня, что BÓG в древнем значении «доля, достаток». Значение развивалось так: «удачная доля» → «достаток, имущество» → «зерно»."
memory: "Zboże — хлеба на поле и зерно в амбаре: «с богом» — с достатком. Zebrać zboże — собрать урожай. Gen. pl. zbóż."
idioms:
