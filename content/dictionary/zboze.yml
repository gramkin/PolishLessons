  - id: grain
    ru: "зерно (как продукт, товар)"
    examples:
      - pl: "Importujemy zboże z Ameryki."
        ru: "Мы импортируем зерно из Америки."
        source: { kind: translated, id: 2186036 }
      - pl: "Rolnicy ze wschodniej części kraju eksportują głównie zboże."
        ru: "Фермеры с востока страны экспортируют в основном зерно."
