formExamples:
  - form: "ciążą"
    pl: "Długi ciążą na firmie."
    ru: "Долги лежат на фирме."
    source: { kind: authored }
  - form: "ciążą"
    pl: "Obowiązki ciążą mu coraz bardziej."
    ru: "Обязанности тяготят его всё больше."
    source: { kind: authored }
  - form: "ciążą"
    pl: "Regiony ciążą gospodarczo ku stolicy."
    ru: "Регионы экономически тяготеют к столице."
    source: { kind: authored }
  - form: "ciążąc"
    pl: "Ciążąc na rodzinie, dług rósł z roku na rok."
    ru: "Ложась на семью бременем, долг рос год от года."
    source: { kind: authored }
  - form: "ciążąc"
    pl: "Ciążąc mu na sumieniu, sprawa nie dawała spać."
    ru: "Лёжа на совести, дело не давало ему спать."
    source: { kind: authored }
  - form: "ciążąc"
    pl: "Ciążąc ku sobie, ciała krążą po orbitach."
    ru: "Притягиваясь друг к другу, тела движутся по орбитам."
    source: { kind: authored }
  - form: "ciążąca"
    pl: "Ciążąca na nim odpowiedzialność była ogromna."
    ru: "Лежавшая на нём ответственность была огромной."
    source: { kind: authored }
  - form: "ciążąca"
    pl: "Ta ciążąca nad miastem chmura zapowiadała burzę."
    ru: "Эта висевшая над городом туча предвещала бурю."
    source: { kind: authored }
  - form: "ciążąca"
    pl: "Ciążąca rodzinie hipoteka wreszcie wygasła."
    ru: "Тяготившая семью ипотека наконец кончилась."
    source: { kind: authored }
  - form: "ciążącą"
    pl: "Widzę odpowiedzialność ciążącą na nim."
    ru: "Я вижу ответственность, лежащую на нём."
    source: { kind: authored }
  - form: "ciążącą"
    pl: "Znam winę ciążącą na rodzinie."
    ru: "Я знаю вину, лежащую на семье."
    source: { kind: authored }
  - form: "ciążącą"
    pl: "Uznano opłatę za ciążącą na właścicielu."
    ru: "Плату сочли лежащей на владельце."
    source: { kind: authored }
  - form: "ciążące"
    pl: "Ciążące na firmie długi rosły."
    ru: "Лежавшие на фирме долги росли."
    source: { kind: authored }
  - form: "ciążące"
    pl: "To obowiązki ciążące na każdym urzędniku."
    ru: "Это обязанности, лежащие на каждом чиновнике."
    source: { kind: authored }
  - form: "ciążące"
    pl: "Ciążące nad doliną chmury nie przechodziły."
    ru: "Висевшие над долиной тучи не уходили."
    source: { kind: authored }
  - form: "ciążącego"
    pl: "Dotyczy to długu ciążącego na rodzinie."
    ru: "Это касается долга, лежащего на семье."
    source: { kind: authored }
  - form: "ciążącego"
    pl: "Nie ma tu nic ciążącego na twoim sumieniu."
    ru: "Здесь нет ничего, что лежало бы на твоей совести."
    source: { kind: authored }
  - form: "ciążącego"
    pl: "Ciężar podejrzenia ciążącego na nim był widoczny."
    ru: "Тяжесть лежавшего на нём подозрения была заметна."
    source: { kind: authored }
  - form: "ciążącej"
    pl: "Dotyczy to hipoteki ciążącej na domu."
    ru: "Это касается ипотеки, лежащей на доме."
    source: { kind: authored }
  - form: "ciążącej"
    pl: "Brakuje tu odpowiedzialności ciążącej na zarządzie."
    ru: "Здесь не хватает ответственности, лежащей на правлении."
    source: { kind: authored }
  - form: "ciążącej"
    pl: "Dzięki chmurze ciążącej nad doliną było chłodniej."
    ru: "Благодаря туче, висевшей над долиной, было прохладнее."
    source: { kind: authored }
  - form: "ciążącemu"
    pl: "Przyjrzyj się długowi ciążącemu na rodzinie."
    ru: "Присмотрись к долгу, лежащему на семье."
    source: { kind: authored }
  - form: "ciążącemu"
    pl: "Podejrzeniu ciążącemu na nim nikt nie dał wiary."
    ru: "Подозрению, лежавшему на нём, никто не поверил."
    source: { kind: authored }
  - form: "ciążącemu"
    pl: "Dzięki obowiązkowi ciążącemu na gminie droga powstała."
    ru: "Благодаря обязанности, лежащей на общине, дорога появилась."
    source: { kind: authored }
  - form: "ciążący"
    pl: "Dług ciążący na rodzinie wreszcie spłacono."
    ru: "Долг, лежавший на семье, наконец выплатили."
    source: { kind: authored }
  - form: "ciążący"
    pl: "Ten ciążący na nim wyrok zmienił wszystko."
    ru: "Этот лежавший на нём приговор изменил всё."
    source: { kind: authored }
  - form: "ciążący"
    pl: "Ciążący nad miastem smog nie ustępował."
    ru: "Висевший над городом смог не отступал."
    source: { kind: authored }
  - form: "ciążących"
    pl: "Brakuje danych o długach ciążących na gminie."
    ru: "Не хватает данных о долгах, лежащих на общине."
    source: { kind: authored }
  - form: "ciążących"
    pl: "Wśród obowiązków ciążących na zarządzie ten był najtrudniejszy."
    ru: "Среди обязанностей правления эта была самой трудной."
    source: { kind: authored }
  - form: "ciążących"
    pl: "Nie widać końca podejrzeń ciążących na nim."
    ru: "Не видно конца подозрениям, лежащим на нём."
    source: { kind: authored }
  - form: "ciążącym"
    pl: "W długu ciążącym na rodzinie nie było już nadziei."
