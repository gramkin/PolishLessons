# review
id: ciazyc
format: 2
lemma: "ciążyć"
rank: 2136
pos: verb
aspect: imperf
pron: { cyr: "цё́нжыць" }
senses:
  - id: weigh-on
    ru: "тяготить, давить, лежать бременем"
    examples:
      - pl: "Ciąży mi ta odpowiedzialność."
        ru: "Эта ответственность меня тяготит."
        source: { kind: authored }
      - pl: "Na rodzinie ciążył dług."
        ru: "На семье лежал долг."
        source: { kind: authored }
      - pl: "Ciążyło na nim podejrzenie."
        ru: "На нём лежало подозрение."
        source: { kind: authored }
  - id: gravitate
    ru: "тяготеть, притягиваться"
    examples:
      - pl: "Ciała ciążą ku sobie."
        ru: "Тела тяготеют друг к другу."
        source: { kind: authored }
      - pl: "Region ciąży gospodarczo ku stolicy."
        ru: "Регион экономически тяготеет к столице."
        source: { kind: authored }
notes:
  - { kind: government, text: "Будущее время дано только в третьем лице: подлежащее у ciążyć — груз, долг, обязанность, подозрение или физическое тело, но не человек (ciąży mi ta odpowiedzialność). Форм ciążę, ciążysz у глагола нет, а совпадения в корпусе принадлежат существительному ciąża «беременность» (jestem w ciąży). Мужско-личной формы będą ciążyli тоже не бывает." }
  - { kind: government, text: "Тяготит кому — дательный падеж: ciąży mi «меня тяготит». Лежит на ком — na с предложным: ciąży na nim odpowiedzialność." }
  - { kind: false-friend, text: "Ловушка в формах: ciąży и ciążę совпадают с формами существительного ciąża «беременность». W ciąży значит «беременна», а не «тяготит»; в корпусе почти все совпадения именно такие." }
  - { kind: usage, text: "Отглагольное существительное ciążenie значит «тяготение»: prawo powszechnego ciążenia «закон всемирного тяготения»." }
  - { kind: usage, text: "Корень ciężar «тяжесть», ciężki «тяжёлый» — ср. русское «тяжесть», «тяготить»." }
collocations:
  - { pl: "prawo ciążenia", ru: "закон тяготения" }
  - { pl: "ciąży na nim", ru: "на нём лежит" }
etymology: "От ciężar «тяжесть», ciężki «тяжёлый», праславянское *tęgъkъ; ср. русское «тяжесть», «тяготить»."
memory: "ciążyć — «тяготить, лежать бременем»: ciąży mi «меня тяготит». Осторожно: формы ciąży и ciążę совпадают с существительным ciąża «беременность» — w ciąży значит «беременна»."
idioms:
  - { pl: "prawo ciążenia", ru: "закон тяготения" }
