formExamples:
  - form: "ciążenia"
    pl: "Nauczyliśmy się, że Newton odkrył powszechne prawo ciążenia."
    ru: "Мы узнали, что Ньютон открыл всеобщий закон тяготения."
    source: { kind: translated, id: 495039 }
  - form: "ciążenia"
    pl: "Prawo ciążenia działa wszędzie."
