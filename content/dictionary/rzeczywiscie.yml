# review
id: rzeczywiscie
format: 2
lemma: "rzeczywiście"
rank: 1474
pos: adv
pron: { cyr: "жэчыви́сьце" }
senses:
  - id: indeed
    ru: "действительно, в самом деле"
    examples:
      - pl: "On jest bardzo dobrym nauczycielem, więc jego dzieci rzeczywiście go słuchają."
        ru: "Он очень хороший учитель, так что его дети его действительно слушают."
        source: { kind: tatoeba, id: 2211942 }
      - pl: "Rzeczywiście."
        ru: "Действительно."
        source: { kind: translated, id: 13640122 }
      - pl: "To rzeczywiście działa."
        ru: "Это действительно работает."
        source: { kind: translated, id: 10609216 }
  - id: in-fact
    ru: "на самом деле, фактически"
    examples:
      - pl: "Wiosna rzeczywiście się zaczęła."
        ru: "Весна действительно началась."
        source: { kind: translated, id: 6733917 }
      - pl: "To rzeczywiście atrakcyjna koncepcja."
        ru: "Это действительно привлекательная мысль."
        source: { kind: translated, id: 365365 }
notes:
  - { kind: usage, text: "Наречие от rzeczywisty «действительный»; существительное rzeczywistość уже есть отдельной карточкой." }
  - { kind: usage, text: "Rzeczywiście. отдельной репликой значит «Действительно, и правда» — согласие с собеседником." }
  - { kind: false-friend, text: "Ряд синонимов разной силы: naprawdę «правда, по-настоящему», rzeczywiście «действительно, в самом деле», faktycznie «фактически». Rzeczywiście чаще подтверждает чужие слова." }
  - { kind: usage, text: "Корень — rzecz «вещь», а не «речь», хотя слово этимологически то же, что русская «речь». Та же ловушка, что на карточке rzeczywistosc." }
collocations:
  - { pl: "czy rzeczywiście?", ru: "в самом деле?" }
  - { pl: "rzeczywiście tak jest", ru: "это действительно так" }
  - { pl: "rzeczywiście działa", ru: "действительно работает" }
etymology: "От rzeczywisty «действительный», в основе rzecz «вещь» (праславянское *rěčь, то же слово, что русская «речь»). Русское «действительно» собрано от «действовать», поэтому образ другой."
memory: "rzeczywiście — «действительно, в самом деле», и чаще всего им подтверждают чужие слова: Rzeczywiście. «И правда». Корень — rzecz «вещь», а не «речь», хотя слово этимологически то же самое."
