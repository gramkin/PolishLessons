        ru: "У этой шкатулки есть тайник."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Уменьшительное от kufer «сундук, кофр». Обычно о небольшом деревянном или металлическом ящичке с крышкой." }
  - { kind: false-friend, text: "Не «кофе». Слово от немецкого Koffer «чемодан» — оттуда же русское «кофр»." }
  - { kind: government, text: "Мужской неодушевлённый; беглое e в косвенных падежах: kuferek, kuferka." }
