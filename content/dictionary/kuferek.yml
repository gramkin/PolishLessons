etymology: "Уменьшительное от kufer «сундук», из немецкого Koffer; русское «кофр» — то же слово."
memory: "kuferek — «сундучок, шкатулка», уменьшительное от kufer. Немецкое Koffer дало и русское «кофр». Беглое e: kuferek, но kuferka."
