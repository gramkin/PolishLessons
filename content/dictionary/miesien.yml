etymology: "От MIĘSO «мясо», из праславянского *męso — того же слова, что русское «мясо», с суффиксом -ień. Мышца понята как мясистая часть тела. Русское «мышца» и латинское musculus «мышонок» названы от мыши: мускул, перебегающий под кожей, напомнил зверька. Так что в этом слове польский и русский разошлись не по звуку, а по образу, и узнать одно через другое нельзя."
memory: "Один звук ś, два написания: mięSIeń перед гласной, mięŚnia перед согласной. Плюс беглое e, как «день — дня». И корень здесь «мясо», а не «мышь»."
