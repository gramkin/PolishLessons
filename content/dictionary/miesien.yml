notes:
  - { kind: pronunciation, text: "Слово показывает одно из самых полезных правил польского письма. Согласный в основе один и тот же — мягкое ś, — но пишется он двумя способами: перед гласной как SI, перед согласным как Ś. Отсюда MIĘSIEŃ, где за ś идёт гласная e, и MIĘŚNIA, где за ś идёт согласная ń. Звук не меняется, меняется только запись. Правило касается всех пяти мягких: ś и si (śnieg, siostra), ź и zi (źle, ziemia), ć и ci (ćma, ciebie), dź и dzi (dźwig, dziecko), ń и ni (koń, niebo). Поняв это один раз, вы перестанете видеть чередование там, где его нет." }
  - { kind: usage, text: "В именительном есть беглое e, которое исчезает во всех остальных формах: MIĘSIEŃ, но MIĘŚNIA, MIĘŚNIU, MIĘŚNIE. Так же ведут себя PIES — PSA, OGIEŃ — OGNIA, DZIEŃ — DNIA. Русский делает то же самое в «день — дня» и «огонь — огня», так что здесь чутьё работает: если в именительном перед последним согласным стоит e, проверьте, не выпадет ли оно дальше." }
  - { kind: usage, text: "Название мышцы построено от MIĘSO «мясо» — мышца как мясистая часть тела. Русский назвал её иначе: «мышца» идёт от «мыши», потому что мускул под кожей шевелится, как мышь в норе. И латынь сделала ровно так же — MUSCULUS значит «мышонок», откуда английское muscle. Получается, что русский с латынью согласны, а польский пошёл своей дорогой, и из трёх языков именно польский здесь исключение." }
