# review
id: radio
format: 2
lemma: "radio"
rank: 1469
pos: noun
pron: { cyr: "ра́дьо" }
senses:
  - id: radio
    ru: "радио, радиоприёмник"
    examples:
      - pl: "Radio jest zepsute."
        ru: "Радио сломалось."
        source: { kind: tatoeba, id: 745255 }
      - pl: "Włącz radio."
        ru: "Включи радио."
        source: { kind: translated, id: 551870 }
      - pl: "Marconi wynalazł radio."
        ru: "Маркони изобрёл радио."
        source: { kind: tatoeba, id: 610639 }
  - id: on-the-radio
    ru: "w radiu — по радио"
    examples:
      - pl: "Słyszałem to w radiu."
        ru: "Я слышал это по радио."
        source: { kind: translated, id: 10797362 }
      - pl: "Słuchałem wiadomości w radiu."
        ru: "Я слушал новости по радио."
        source: { kind: translated, id: 529545 }
notes:
  - { kind: false-friend, text: "Главное отличие от русского: польское radio склоняется. Русское «радио» несклоняемое, а здесь słucham radia, w radiu, dwa radia." }
  - { kind: government, text: "słuchać radia — с родительным падежом, как и всякое słuchać czegoś." }
  - { kind: usage, text: "w radiu — «по радио»: Słyszałem to w radiu. Русский говорит «по», польский — «в»." }
  - { kind: usage, text: "Множественное radia значит «радиоприёмники»: On sprzedaje radia." }
collocations:
  - { pl: "w radiu", ru: "по радио" }
  - { pl: "słuchać radia", ru: "слушать радио" }
  - { pl: "włączyć radio", ru: "включить радио" }
etymology: "Международное заимствование из латинского radius «луч» через английский. В русский слово пришло тем же путём, но осталось несклоняемым."
memory: "radio — «радио», но, в отличие от русского, оно склоняется: słucham radia, słyszałem w radiu, sprzedaje radia. И предлог другой: w radiu, а по-русски «по радио»."
idioms:
