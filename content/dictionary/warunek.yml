lemma: "warunek"
rank: 1420
pos: noun
pron: { cyr: "вару́нэк" }
senses:
  - id: condition
    ru: "условие, требование"
    examples:
      - pl: "Zrobię to pod jednym warunkiem."
        ru: "Я сделаю это при одном условии."
        source: { kind: translated, id: 3806047 }
      - pl: "Jakie są wasze warunki?"
        ru: "Каковы ваши условия?"
