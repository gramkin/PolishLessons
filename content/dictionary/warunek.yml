        source: { kind: translated, id: 2250880 }
  - id: circumstances
    ru: "во множественном числе — условия, обстоятельства"
    examples:
      - pl: "Pracować w takich warunkach było wyjątkowo trudno."
        ru: "Вести работу в таких условиях было крайне трудно."
        source: { kind: tatoeba, id: 5909158 }
      - pl: "Nie chcę pracować w tych warunkach."
        ru: "Я не хочу работать в этих условиях."
        source: { kind: translated, id: 2439066 }
notes:
  - { kind: usage, text: "Беглое e: warunek, но warunku, warunki, warunkiem. Так же ведут себя dzwonek и koniec." }
  - { kind: government, text: "pod warunkiem, że… — «при условии, что…», самый частый оборот: Pójdę, pod warunkiem że pogoda będzie ładna." }
  - { kind: usage, text: "Во множественном числе warunki значит «условия, обстоятельства»: warunki pracy «условия труда», warunki pogodowe «погодные условия»." }
  - { kind: usage, text: "О человеке warunki значит «данные»: ma dobre warunki «у него хорошие физические данные»." }
collocations:
  - { pl: "pod warunkiem", ru: "при условии" }
  - { pl: "warunki pracy", ru: "условия труда" }
  - { pl: "postawić warunek", ru: "поставить условие" }
etymology: "От warować «оговаривать, обеспечивать» — германское заимствование; буквально «то, что оговорено». Русское «условие» собрано от «уславливаться», образ похожий, но корень другой."
memory: "warunek — «условие», с беглым e: warunek, но warunku, warunki. Главный оборот — pod warunkiem, że… «при условии, что…». А множественное warunki чаще значит «условия, обстоятельства»: warunki pracy."
idioms:
