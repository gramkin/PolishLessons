# review
id: znalezc
format: 2
lemma: "znaleźć"
rank: 84
pos: verb
aspect: perf
pron: { cyr: "зна́лещць" }
senses:
  - id: find
    ru: "найти, отыскать"
    examples:
      - pl: "Toma nietrudno znaleźć."
        ru: "Тома несложно найти."
        source: { kind: tatoeba, id: 4953188 }
      - pl: "Znalazłem klucz."
        ru: "Я нашёл ключ."
        source: { kind: tatoeba, id: 6696774 }
      - pl: "Tom znalazł twoje klucze."
        ru: "Том нашёл твои ключи."
        source: { kind: tatoeba, id: 6934110 }
  - id: find-oneself
    ru: "znaleźć się — оказаться, найтись"
    examples:
      - pl: "W ten sposób znalazł się na ulicy."
        ru: "Так он оказался на улице."
        source: { kind: tatoeba, id: 13084371 }
      - pl: "Kto szuka, ten znajdzie."
        ru: "Кто ищет, тот найдет."
        source: { kind: tatoeba, id: 526728 }
notes:
  - { kind: usage, text: "Возвратное znaleźć się значит «оказаться где-то»: Znalazł się na ulicy «Он оказался на улице»." }
  - { kind: usage, text: "Видовая пара: znajdować «находить» — znaleźć «найти»." }
collocations:
  - { pl: "znaleźć pracę", ru: "найти работу" }
  - { pl: "znaleźć wspólny język", ru: "найти общий язык" }
  - { pl: "biuro rzeczy znalezionych", ru: "бюро находок" }
etymology: "Приставочное от старого leźć «лезть, идти» с приставкой zna- (из *zna-lězti): буквально «набрести на что-то»."
memory: "Видовая пара: znajdować «находить» — znaleźć «найти». Обратите внимание на возвратное znaleźć się «оказаться»: Znalazł się na ulicy. И на устойчивое biuro rzeczy znalezionych «бюро находок»."
idioms:
  - { pl: "znaleźć wspólny język", ru: "найти общий язык" }
  - { pl: "kto szuka, ten znajdzie", ru: "кто ищет, тот найдёт" }
  - { pl: "znalezione nie kradzione", ru: "найденное — не краденое" }
formExamplesSkip:
  - { form: "znaleź", reason: "Нестандартная форма повелительного наклонения: живые формы — znajdź, znajdźcie, znajdźmy, и в корпусе znaleź- не встречается." }
  - { form: "znaleźcie", reason: "Нестандартная форма повелительного наклонения: живые формы — znajdź, znajdźcie, znajdźmy, и в корпусе znaleź- не встречается." }
  - { form: "znaleźmy", reason: "Нестандартная форма повелительного наклонения: живые формы — znajdź, znajdźcie, znajdźmy, и в корпусе znaleź- не встречается." }
formExamples:
  - form: "znajdą"
    pl: "Chłopaki, nie warto otwierać tego tematu. Jesteście młodzi, żartobliwi, dla was wszystko jest łatwe. To nie jest. To nie jest Czikatiło i nawet nie archiwa służb specjalnych. Tutaj lepiej nie włazić. Poważnie, każdy z was będzie żałować. Najlepiej zamknijcie temat i zapomnijcie, co się tu pisało. Całkiem rozumiem, że tą wiadomością wywołam dodatkowe zainteresowanie, ale chcę od razu ostrzec dociekliwych - stop. Pozostałych po prostu nie znajdą."
    ru: "Ребята, не стоит вскрывать эту тему. Вы молодые, шутливые, вам все легко. Это не то. Это не Чикатило и даже не архивы спецслужб. Сюда лучше не лезть. Серьезно, любой из вас будет жалеть. Лучше закройте тему и забудьте, что тут писалось. Я вполне понимаю, что данным сообщением вызову дополнительный интерес, но хочу сразу предостеречь пытливых – стоп. Остальных просто не найдут."
    source: { kind: tatoeba, id: 3542164 }
