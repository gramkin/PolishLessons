notes:
  - { kind: false-friend, text: "CYKL — «цикл», через Y: CYKL. Велосипед по-польски ROWER, а слово CYKLISTA, «велосипедист», устарело. Цикличный — CYKLICZNY: IMPREZA CYKLICZNA, «регулярное мероприятие»." }
  - { kind: usage, text: "Мужской род, неодушевлённое. Родительный — CYKLU. Множественное — CYKLE, родительный — CYKLI; вариант CYKLÓW не учим." }
  - { kind: government, text: "Цикл чего — родительный: CYKL WYKŁADÓW. В цикле — W CYKLU, местный. Цикл из — CYKL Z и родительный: CYKL Z PIĘCIU CZĘŚCI." }
  - { kind: pronunciation, text: "Читается «цыкль», один слог: CY — твёрдое «цы», конечное L — мягкое. CYKLU — «цы́клю»." }
collocations:
  - { pl: "cykl życia", ru: "жизненный цикл" }
  - { pl: "cykl wykładów", ru: "цикл лекций" }
