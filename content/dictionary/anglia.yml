  - { form: "Anglij", reason: "Англия одна: множественного числа у названия страны нет" }
  - { form: "Anglio", reason: "звательная форма, в корпусе примеров нет" }
  - { form: "Angliom", reason: "Англия одна: множественного числа у названия страны нет" }
