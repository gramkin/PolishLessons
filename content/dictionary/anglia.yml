# review
id: anglia
format: 2
lemma: "Anglia"
rank: 1773
pos: noun
pron: { cyr: "а́нглья" }
senses:
  - id: england
    ru: "Англия"
    examples:
      - pl: "Co jest większe, Japonia czy Anglia?"
        ru: "Что больше, Япония или Англия?"
        source: { kind: tatoeba, id: 1976991 }
      - pl: "Anglia to kraj, w którym policjanci nie noszą broni."
        ru: "Англия - это страна, в которой полицейские не носят бронежилеты."
        source: { kind: tatoeba, id: 956708 }
      - pl: "Anglia jest dumna ze swych poetów."
        ru: "Англия гордится своими поэтами."
        source: { kind: translated, id: 566298 }
  - id: england-to-from
    ru: "Англия (в, из, в Англию)"
    examples:
      - pl: "Pojechał do Anglii."
        ru: "Он поехал в Англию."
        source: { kind: translated, id: 827400 }
      - pl: "On był w Anglii dwa razy."
        ru: "Он дважды был в Англии."
        source: { kind: tatoeba, id: 745258 }
      - pl: "Londyn jest stolicą Anglii."
        ru: "Лондон - столица Англии."
        source: { kind: tatoeba, id: 529281 }
notes:
  - { kind: usage, text: "Формы множественного числа (Anglie, Anglij, Angliom, Angliami, Angliach) оставлены без примеров: Англия одна, и во множественном её не склоняют. Anglij вдобавок устаревший родительный множественного. Сравните Ameryka: там множественное живое — obie Ameryki, потому что Америк действительно две. Живые формы здесь: w Anglii, do Anglii, nad Anglią." }
  - { kind: government, text: "Куда — do Anglii (родительный падеж), где — w Anglii (предложный), откуда — z Anglii (родительный). Винительный do Anglii, но Anglię при глаголах вроде opuścić «покинуть»." }
  - { kind: usage, text: "Строго говоря Anglia — только часть Великобритании: Zjednoczone Królestwo składa się z Anglii, Szkocji, Walii i Irlandii Północnej. Но в разговоре так называют и всю страну, как и по-русски." }
  - { kind: usage, text: "Прилагательное — angielski «английский», житель — Anglik, Angielka." }
  - { kind: false-friend, text: "Пишется с прописной буквы, как все названия стран. Язык при этом со строчной: język angielski." }
collocations:
  - { pl: "do Anglii", ru: "в Англию" }
  - { pl: "w Anglii", ru: "в Англии" }
  - { pl: "królowa Anglii", ru: "королева Англии" }
family:
  - { pl: "angielski", ru: "английский", relation: root }
  - { pl: "Anglik", ru: "англичанин", relation: root }
  - { pl: "Ameryka", ru: "Америка", relation: root, id: ameryka }
etymology: "От названия племени англов, как и русское «Англия». Слово пришло через латинское Anglia и совпадает почти буква в букву."
memory: "Anglia — «Англия». Куда — do Anglii, где — w Anglii. Строго говоря это лишь часть Великобритании, но в разговоре так зовут всю страну, как и по-русски."
idioms:
  - { pl: "do Anglii", ru: "в Англию" }
  - { pl: "w Anglii", ru: "в Англии" }
  - { pl: "królowa Anglii", ru: "королева Англии" }
