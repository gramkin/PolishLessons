senses:
  - id: for-sale
    ru: "продажа; na sprzedaż — продаётся"
    examples:
      - pl: "Na sprzedaż."
        ru: "Продаётся."
        source: { kind: translated, id: 6160723 }
      - pl: "Ten dom jest na sprzedaż."
        ru: "Этот дом продаётся."
        source: { kind: translated, id: 1002732 }
      - pl: "Czy to jest na sprzedaż?"
        ru: "Это продаётся?"
        source: { kind: translated, id: 8970676 }
  - id: sales
    ru: "продажи, сбыт"
    examples:
      - pl: "Sprzedaż spadła."
        ru: "Продажи упали."
        source: { kind: translated, id: 12184217 }
      - pl: "Pracuję w dziale sprzedaży."
        ru: "Я работаю в отделе продаж."
        source: { kind: translated, id: 645926 }
      - pl: "Tej książki nie ma w sprzedaży."
        ru: "Этой книги нет в продаже."
        source: { kind: tatoeba, id: 3482192 }
notes:
  - { kind: usage, text: "na sprzedaż — «на продажу, продаётся»: Ten dom jest na sprzedaż «Этот дом продаётся»." }
  - { kind: usage, text: "w sprzedaży — «в продаже»: Nie mamy tej książki w sprzedaży «У нас нет этой книги в продаже»." }
  - { kind: usage, text: "Существительное женского рода на -ż, в родительном и предложном — sprzedaży." }
  - { kind: usage, text: "Глаголы — sprzedać (совершенный) и sprzedawać (несовершенный); dział sprzedaży — «отдел продаж»." }
collocations:
  - { pl: "na sprzedaż", ru: "на продажу" }
  - { pl: "w sprzedaży", ru: "в продаже" }
  - { pl: "dział sprzedaży", ru: "отдел продаж" }
etymology: "От sprzedać «продать» (s- + przedać, от dać «дать»). Русское «продажа» построено от «про-дать» — та же схема, только приставка другая."
memory: "sprzedaż = «продажа». Два оборота надо знать наизусть: na sprzedaż «продаётся» и w sprzedaży «в продаже». Глаголы — sprzedać и sprzedawać."
idioms:
  - { pl: "na sprzedaż", ru: "на продажу" }
  - { pl: "w sprzedaży", ru: "в продаже" }
  - { pl: "dział sprzedaży", ru: "отдел продаж" }
formExamplesSkip:
