pos: verb
pron: { cyr: "у́мыць" }
senses:
  - id: wash
    ru: "вымыть, помыть"
    examples:
      - pl: "Trzeba umyć okna przed świętami."
        ru: "Надо вымыть окна перед праздниками."
        source: { kind: authored }
      - pl: "Umył ręce i usiadł do stołu."
        ru: "Он вымыл руки и сел за стол."
        source: { kind: authored }
      - pl: "Jutro umyję samochód."
        ru: "Завтра я помою машину."
        source: { kind: authored }
  - id: teeth
    ru: "почистить (зубы)"
    examples:
      - pl: "Umyj zęby i do łóżka."
        ru: "Почисти зубы и в кровать."
        source: { kind: authored }
      - pl: "Dzieci umyły zęby bez przypominania."
        ru: "Дети почистили зубы без напоминания."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Глагол совершенного вида, пара к несовершенному MYĆ. Отсюда главное: формы вида umyję, umyjesz, umyje выглядят как настоящее время, но означают будущее — «вымою», «вымоешь». Настоящего времени у совершенного вида в польском нет вовсе, ровно как и в русском. Чтобы сказать «мою» прямо сейчас, нужен другой глагол: myję." }
  - { kind: false-friend, text: "Русское «умыть» относится только к лицу, а польское UMYĆ моет что угодно: umyć ręce, umyć naczynia, umyć okna, umyć samochód. Самая заметная разница — зубы. По-польски их моют: UMYĆ ZĘBY, а по-русски чистят. «Почистить зубы» дословно дало бы oczyścić zęby, и так не говорят." }
  - { kind: pronunciation, text: "Буква y читается как русское «ы», поэтому umyć звучит «у́мыць», а конечное ć мягкое, с призвуком «ць». В будущем времени в основе появляется j: umyj-ę, umyj-esz, umyj-e. Он же стоит в повелительном наклонении umyj, так что одна буква связывает две разные части парадигмы." }
collocations:
  - { pl: "umyć ręce", ru: "вымыть руки" }
  - { pl: "umyć zęby", ru: "почистить зубы" }
  - { pl: "umyć naczynia", ru: "вымыть посуду" }
family:
  - { pl: "myć", ru: "мыть", relation: aspect, id: myc }
  - { pl: "umywalka", ru: "раковина", relation: derived }
  - { pl: "zmyć", ru: "смыть", relation: root }
etymology: "От MYĆ, из праславянского *myti — то же слово, что русское «мыть». Приставка u- делает глагол совершенным ровно так же, как русское у- в «умыть», поэтому пара myć/umyć устроена в точности как «мыть/умыть». От того же корня umywalka «раковина», mycie «мытьё» и наше «умывальник»."
memory: "umyję — это будущее «вымою», а не настоящее: у совершенного вида настоящего нет. И зубы по-польски моют, а не чистят: umyć zęby."
idioms:
  - { pl: "umyć ręce", ru: "умыть руки, снять с себя ответственность" }
  - { pl: "umyć komuś głowę", ru: "намылить кому-то голову, отчитать" }
