# review
id: kolnierz
format: 2
lemma: "kołnierz"
rank: 2337
pos: noun
pron: { cyr: "ко́унеш" }
senses:
  - id: collar
    ru: "воротник"
    examples:
      - pl: "Twój kołnierz jest brudny."
        ru: "У тебя грязный воротник."
        source: { kind: translated, id: 11581741 }
      - pl: "Kołnierz prasuj najpierw od środka, potem na zewnątrz."
        ru: "Воротник гладь сначала с изнанки, потом снаружи."
        source: { kind: translated, id: 935749 }
      - pl: "Złapałem go za kołnierz."
        ru: "Я схватил его за воротник."
        source: { kind: translated, id: 838936 }
  - id: grab-by-collar
    ru: "шиворот (в обороте złapać za kołnierz)"
    examples:
      - pl: "Pijany mężczyzna chwycił mój kołnierz i klął na mnie."
        ru: "Пьяный схватил меня за шиворот и выругался."
        source: { kind: translated, id: 2429814 }
      - pl: "Tom miał na sobie kołnierz ortopedyczny."
        ru: "На Томе был ортопедический воротник."
        source: { kind: translated, id: 4874829 }
notes:
  - { kind: government, text: "Схватить за шиворот — złapać za kołnierz, с винительным падежом после za." }
  - { kind: false-friend, text: "От kołnierz восходит к корню «коло, круг» — то, что обходит шею кругом. Русское «ошейник» построено от «шеи», польское — от круга. Слово szyja «шея» уже есть в словаре." }
  - { kind: usage, text: "Мужской неодушевлённый; родительный — kołnierza. Уменьшительное kołnierzyk чаще говорят о рубашечном воротничке." }
  - { kind: usage, text: "Медицинское kołnierz ortopedyczny «ортопедический воротник»." }
collocations:
  - { pl: "złapać za kołnierz", ru: "схватить за шиворот" }
  - { pl: "kołnierz koszuli", ru: "воротник рубашки" }
etymology: "Восходит к корню «коло, круг»: то, что охватывает шею кругом."
memory: "kołnierz — «воротник», а złapać za kołnierz значит «схватить за шиворот». Корень — «круг», а не «шея», в отличие от русского «ошейник»."
