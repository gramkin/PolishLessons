notes:
  - { kind: false-friend, text: "ZAJĘCIE — «занятие, дело» в единственном. Но ZAJĘCIA во множественном — отдельное слово: «занятия, уроки». В юридическом языке ZAJĘCIE — «арест имущества»: ZAJĘCIE KOMORNICZE. Занятый — ZAJĘTY." }
  - { kind: usage, text: "Средний род, отглагольное от ZAJĄĆ. Учим единственное: ZAJĘCIE, ZAJĘCIU, ZAJĘCIEM. Формы ZAJĘCIA, ZAJĘĆ совпадают со словом ZAJĘCIA «занятия» и разобраны там." }
  - { kind: government, text: "Найти себе занятие — ZNALEŹĆ SOBIE ZAJĘCIE, винительный. Арест счёта — ZAJĘCIE KONTA, родительный. После взятия — PO ZAJĘCIU." }
  - { kind: pronunciation, text: "Читается «зайэ́нце»: J — «й», Ę перед Ć — «эн». Ударение на предпоследнем слоге." }
