# review
id: odeprzec
format: 2
lemma: "odeprzeć"
rank: 5633
pos: verb
aspect: perf
pron: { cyr: "одэ́пшець" }
senses:
  - id: repel
    ru: "отразить, отбить (атаку)"
    examples:
      - pl: "Tom nie mógł odeprzeć chęci zadania Mary tego pytania."
        ru: "Том не мог побороть желание задать Мэри этот вопрос."
        source: { kind: translated, id: 3856179 }
      - pl: "Wojsko odparło atak."
        ru: "Войско отразило атаку."
        source: { kind: authored }
      - pl: "Odparli wszystkie zarzuty."
        ru: "Они отвели все обвинения."
        source: { kind: authored }
  - id: retort
    ru: "возразить, ответить (в повествовании)"
    examples:
      - pl: "Odparła, że nigdy nie wcześniej nie widziała człowieka."
        ru: "Она возразила, что никогда раньше не видела этого человека."
        source: { kind: translated, id: 1352114 }
      - pl: "Miłość jest nie do odparcia."
        ru: "Любовь неотразима."
        source: { kind: translated, id: 12342314 }
notes:
  - { kind: usage, text: "Второе значение — повествовательное «возразил, ответил»: — Nieprawda — odparł. В живом разговоре так не говорят, это язык прозы." }
  - { kind: usage, text: "Оборот nie do odparcia значит «неотразимый, неопровержимый»: argument nie do odparcia «неопровержимый довод»." }
  - { kind: false-friend, text: "od- + przeć «напирать», как в «упереться», «напор». Русское «отпереть» — о замке и к этому корню отношения не имеет." }
  - { kind: government, text: "Винительный падеж: odeprzeć atak, odeprzeć zarzuty. Несовершенный вид — odpierać." }
collocations:
  - { pl: "odeprzeć atak", ru: "отразить атаку" }
  - { pl: "nie do odparcia", ru: "неотразимый, неопровержимый" }
etymology: "od- + przeć «напирать»; ср. «упереться», «напор». К русскому «отпереть» отношения не имеет."
memory: "odeprzeć — «отразить» атаку и «возразить» в повествовании (odparł «ответил он»). Запомните nie do odparcia «неотразимый». Несовершенный вид — odpierać."
idioms:
  - { pl: "odeprzeć atak", ru: "отразить атаку" }
  - { pl: "nie do odparcia", ru: "неотразимый" }
