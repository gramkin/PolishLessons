# review
id: potwierdzic
format: 2
lemma: "potwierdzić"
rank: 1379
pos: verb
aspect: perf
pron: { cyr: "потфе́рдзиць" }
senses:
  - id: confirm
    ru: "подтвердить (правдивость, факт)"
    examples:
      - pl: "Eksperyment potwierdził jego teorię."
        ru: "Эксперимент подтвердил его теорию."
        source: { kind: tatoeba, id: 745262 }
      - pl: "Nie mogę tego potwierdzić."
        ru: "Я не могу это подтвердить."
        source: { kind: translated, id: 1920875 }
      - pl: "Potwierdzili to."
        ru: "Они это подтвердили."
        source: { kind: translated, id: 12191508 }
  - id: acknowledge
    ru: "подтвердить получение, бронь, договорённость"
    examples:
      - pl: "Proszę potwierdzić odbiór!"
        ru: "Просьба подтвердить получение!"
        source: { kind: translated, id: 8778930 }
      - pl: "Zajmiemy się potwierdzeniem pańskiej rezerwacji."
        ru: "Мы займёмся подтверждением вашей брони."
        source: { kind: translated, id: 498396 }
notes:
  - { kind: usage, text: "Совершенный вид к potwierdzać." }
  - { kind: government, text: "potwierdzić co, винительный: potwierdzić rezerwację, odbiór, termin. Proszę potwierdzić odbiór «прошу подтвердить получение» — готовая формула деловой переписки." }
  - { kind: usage, text: "Отглагольное существительное potwierdzenie значит и действие «подтверждение», и саму бумагу — квитанцию или письмо-подтверждение." }
  - { kind: false-friend, text: "Не путайте potwierdzić «подтвердить» с twierdzić «утверждать»: приставка po- превращает утверждение в подтверждение." }
collocations:
  - { pl: "potwierdzić odbiór", ru: "подтвердить получение" }
  - { pl: "potwierdzić rezerwację", ru: "подтвердить бронь" }
  - { pl: "potwierdzić termin", ru: "подтвердить дату" }
etymology: "Приставка po- и twierdzić «утверждать», от twardy «твёрдый». Русское «подтвердить» собрано из тех же частей — в основе обоих лежит «твёрдый»."
memory: "potwierdzić — «подтвердить», от twierdzić «утверждать» и глубже от twardy «твёрдый», ровно как русское «подтвердить» от «твёрдый». Запомните деловую формулу: proszę potwierdzić odbiór «прошу подтвердить получение»."
idioms:
  - { pl: "potwierdzić odbiór", ru: "подтвердить получение" }
  - { pl: "potwierdzić rezerwację", ru: "подтвердить бронь" }
  - { pl: "wyjątek potwierdza regułę", ru: "исключение подтверждает правило" }
