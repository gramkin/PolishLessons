notes:
  - { kind: usage, text: "ПО-ПОЛЬСКИ КЛЮЧИ ОТ МАШИНЫ — ВСЕГДА УМЕНЬШИТЕЛЬНОЕ. Говорят KLUCZYKI DO SAMOCHODU, а не klucze, хотя предмет не маленький. Русский в этом месте берёт обычное слово — «ключи от машины». А простое klucze по-польски — это ключи от дома или гаечные ключи." }
  - { kind: false-friend, text: "Уменьшительные на -IK и -YK, в отличие от -EK, гласную не теряют. Kluczyk даёт KLUCZYKA, stolik даёт stolika — суффикс остаётся целым. А вот -ek беглое e выбрасывает: dodatek, но dodatku; wózek, но wózka. Сравнивать эти два типа надо постоянно." }
  - { kind: pronunciation, text: "Три слога, ударение на предпоследнем: klu-CZYK, точнее KLU-czyk. Cz читается как ч, y как ы: «клю́чык». Форма kluczykiem звучит «клю́чыкем»." }
collocations:
  - { pl: "kluczyki do samochodu", ru: "ключи от машины" }
  - { pl: "kluczyk od szkatułki", ru: "ключик от шкатулки" }
  - { pl: "przekręcić kluczyk", ru: "повернуть ключ" }
family:
  - { pl: "klucz", ru: "ключ", relation: root, id: klucz }
  - { pl: "zamek", ru: "замок", relation: root, id: zamek }
  - { pl: "stacyjka", ru: "замок зажигания", relation: root }
etymology: "Уменьшительное от klucz «ключ», из праславянского *ključь, того же, что русское «ключ». Исходно корень значил «крюк, загнутая палка», откуда и kluczyć «петлять». Суффикс -yk тот же, что в stolik и nożyk."
memory: "kluczyk — «ключик», но по-польски это и обычное слово для ключей от машины: kluczyki do samochodu. И запомни: суффикс -yk гласную не теряет, kluczyka, в отличие от -ek, который её выбрасывает: dodatku."
idioms:
