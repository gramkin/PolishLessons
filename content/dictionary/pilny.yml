notes:
  - { kind: usage, text: "Одно польское слово покрывает два русских, и связь между ними стоит увидеть. PILNA SPRAWA — это срочное дело, PILNY UCZEŃ — старательный ученик. Общая мысль — пристальное внимание: срочное его требует, старательный его отдаёт. Корень тот же, что в PILNOWAĆ «присматривать, караулить», и там он виден прямо. Русский развёл эти значения по разным словам, так что выбирать перевод приходится по существительному." }
  - { kind: usage, text: "Форм здесь тридцать четыре, на одну больше, чем у любого другого прилагательного в словаре. Лишняя — PILEN, старая форма мужского именительного единственного. Она принадлежит к тому же разряду, что PEŁEN и PEWIEN, то есть к обычным вариантам именительного, а не к кратким сказуемостным ŚWIADOM, ZDRÓW, GOTÓW и WINIEN: словари помечают формы pilny только как прилагательное и наречие, краткого разряда у него нет. Сегодня pilen звучит книжно и встречается почти только в старых текстах." }
collocations:
  - { pl: "pilna sprawa", ru: "срочное дело" }
  - { pl: "pilny uczeń", ru: "старательный ученик" }
  - { pl: "pilne wezwanie", ru: "срочный вызов" }
family:
  - { pl: "pilnować", ru: "присматривать, караулить", relation: root, id: pilnowac }
  - { pl: "pilnie", ru: "срочно; усердно", relation: derived }
  - { pl: "pilność", ru: "усердие", relation: derived }
etymology: "Из праславянского *pilьnъ, от того же корня, что PILNOWAĆ «присматривать». Исходно слово было о пристальности, о неотрывном внимании, и из этого выросли оба нынешних значения: то, что требует внимания немедленно, и тот, кто внимателен к делу. Русский для этих двух смыслов взял разные слова, «срочный» и «старательный», и прямого соответствия польскому не оставил."
memory: "Два значения в одном слове: pilna sprawa — срочная, pilny uczeń — старательный. А лишняя тридцать четвёртая форма — старое pilen, как pełen и pewien."
idioms:
