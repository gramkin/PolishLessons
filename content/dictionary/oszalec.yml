# review
id: oszalec
format: 2
lemma: "oszaleć"
rank: 1360
pos: verb
aspect: perf
pron: { cyr: "оша́лець" }
senses:
  - id: go-mad
    ru: "сойти с ума, обезуметь"
    examples:
      - pl: "On oszalał."
        ru: "Он сошёл с ума."
        source: { kind: translated, id: 1165163 }
      - pl: "Oszalałeś."
        ru: "Ты сошёл с ума."
        source: { kind: tatoeba, id: 12586576 }
      - pl: "Czy świat oszalał?"
        ru: "Мир сошёл с ума?"
        source: { kind: translated, id: 722142 }
  - id: overwhelmed
    ru: "обезуметь от чувства"
    examples:
      - pl: "Oszalała ze strachu."
        ru: "Она обезумела от страха."
        source: { kind: translated, id: 919566 }
      - pl: "Chyba oszaleję."
        ru: "Я, кажется, с ума сойду."
        source: { kind: translated, id: 969002 }
notes:
  - { kind: usage, text: "Совершенный вид: «сойти с ума». Несовершенная пара szaleć значит «безумствовать, бушевать»." }
  - { kind: government, text: "oszaleć z czegoś — «обезуметь от чего-то», с родительным: oszaleć ze strachu, oszaleć z radości." }
  - { kind: register, text: "Oszalałeś? — обычный разговорный упрёк «Ты с ума сошёл?», а не медицинский диагноз." }
  - { kind: usage, text: "oszaleć na punkcie czegoś — «помешаться на чём-то»: Prasa oszaleje na punkcie tej historii." }
collocations:
  - { pl: "oszaleć ze strachu", ru: "обезуметь от страха" }
  - { pl: "można oszaleć", ru: "с ума сойти можно" }
  - { pl: "oszaleć na punkcie czegoś", ru: "помешаться на чём-либо" }
etymology: "Приставка o- и szaleć «безумствовать», от szał «безумие, ярость». Русские «шальной» и «шалеть» того же корня."
memory: "oszaleć — «сойти с ума, обезуметь». Oszalałeś? это обычное разговорное «Ты с ума сошёл?». Управление с родительным: oszaleć ze strachu. Корень тот же, что в русском «шальной»."
idioms:
  - { pl: "oszaleć ze strachu", ru: "обезуметь от страха" }
  - { pl: "można oszaleć", ru: "с ума сойти можно" }
  - { pl: "oszaleć na punkcie czegoś", ru: "помешаться на чём-либо" }
