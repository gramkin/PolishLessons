# review
id: zazdrosc
format: 2
lemma: "zazdrość"
rank: 5916
pos: noun
pron: { cyr: "за́здросьць" }
senses:
  - id: envy
    ru: "зависть"
    examples:
      - pl: "Nie patrz na nią z taką zazdrością."
        ru: "Не смотри на неё с такой завистью."
        source: { kind: translated, id: 827736 }
      - pl: "Czuła zazdrość, gdy koleżanka dostała awans."
        ru: "Она чувствовала зависть, когда подруга получила повышение."
        source: { kind: authored }
      - pl: "Sąsiedzi patrzyli z zazdrością na nasz nowy dom."
        ru: "Соседи с завистью смотрели на наш новый дом."
        source: { kind: authored }
  - id: jealousy
    ru: "ревность"
    examples:
      - pl: "Robił jej sceny zazdrości o każdego kolegę."
        ru: "Он устраивал ей сцены ревности из-за каждого коллеги."
        source: { kind: authored }
      - pl: "Ślepa zazdrość zniszczyła ich małżeństwo."
        ru: "Слепая ревность разрушила их брак."
        source: { kind: authored }
      - pl: "Monikę gnębiła zazdrość o męża."
        ru: "Монику мучила ревность к мужу."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Одно польское слово — два русских: «зависть» и «ревность». Решает контекст и управление: ZAZDROŚĆ O MĘŻA — ревность к мужу, ZAZDROŚĆ Z POWODU CZYJEGOŚ SUKCESU — зависть. Злая, недоброжелательная зависть — ZAWIŚĆ." }
  - { kind: government, text: "Ревнуют и завидуют «о» + винительный: ZAZDROŚĆ O ŻONĘ, O PIENIĄDZE. «От зависти, из ревности» — Z ZAZDROŚCI (родительный): ZROBIŁ TO Z ZAZDROŚCI. «С завистью» — Z ZAZDROŚCIĄ (творительный): PATRZEĆ Z ZAZDROŚCIĄ." }
  - { kind: usage, text: "ZAZDROŚCI — это и падеж существительного (Z ZAZDROŚCI, BEZ ZAZDROŚCI), и форма глагола ZAZDROŚCIĆ: ON MI ZAZDROŚCI — он мне завидует. Женский род, множественного числа в обычной речи нет." }
  - { kind: pronunciation, text: "ŚĆ на конце читается мягко, «сьць»: «за́здросьць». Ударение, как обычно, на предпоследнем слоге, поэтому в длинных формах оно сдвигается: ZAZDROŚCI — «заздро́сьци»." }
collocations:
  - { pl: "z zazdrości", ru: "от зависти, из ревности" }
  - { pl: "patrzeć z zazdrością", ru: "смотреть с завистью" }
  - { pl: "scena zazdrości", ru: "сцена ревности" }
  - { pl: "zazdrość o męża", ru: "ревность к мужу" }
family:
  - { pl: "zazdrościć", ru: "завидовать", relation: derived, id: zazdroscic }
  - { pl: "zazdrosny", ru: "завистливый, ревнивый", relation: derived, id: zazdrosny }
  - { pl: "pozazdrościć", ru: "позавидовать", relation: derived }
  - { pl: "zazdrośnik", ru: "ревнивец, завистник", relation: derived }
synonyms: ["zawiść"]
etymology: "Старопольское ZAZROŚĆ, от глагола ZAŹRZEĆ «заглянуть, бросить взгляд». Тот же корень, что в русском «зазрение» («без зазрения совести»)."
memory: "Zazdrość — и зависть, и ревность. Z zazdrości — от зависти; zazdrość o męża — ревность к мужу. Читается «за́здросьць»."
idioms:
  - { pl: "zzielenieć z zazdrości", ru: "позеленеть от зависти" }
  - { pl: "pękać z zazdrości", ru: "лопаться от зависти" }
