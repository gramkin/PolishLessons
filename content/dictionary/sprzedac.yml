# review
id: sprzedac
format: 2
lemma: "sprzedać"
rank: 672
pos: verb
aspect: perf
pron: { cyr: "спшэ́даць" }
senses:
  - id: sell
    ru: "продать"
    examples:
      - pl: "Mógłbyś to sprzedać."
        ru: "Ты мог бы это продать."
        source: { kind: tatoeba, id: 6017440 }
      - pl: "Musisz to sprzedać."
        ru: "Ты должен это продать."
        source: { kind: translated, id: 3051125 }
      - pl: "Sprzedałem książkę."
        ru: "Я продал книгу."
        source: { kind: translated, id: 8539938 }
  - id: sell-out
    ru: "sprzedać się — распродаться"
    note: "С się глагол значит «разойтись, быть распроданным»."
    examples:
      - pl: "Sprzedało się wszystko."
        ru: "Всё распродалось."
        source: { kind: translated, id: 364776 }
      - pl: "Bilety sprzedały się w tydzień."
        ru: "Билеты разошлись за неделю."
        source: { kind: translated, id: 415316 }
      - pl: "Tygodniki się sprzedały."
        ru: "Еженедельники разошлись."
        source: { kind: translated, id: 567100 }
  - id: betray
    ru: "sprzedać kogoś — продать, предать"
    examples:
      - pl: "Sprzedał nas."
        ru: "Он нас продал."
        source: { kind: translated, id: 3414426 }
      - pl: "Sprzedał nas za grosze."
        ru: "Он продал нас за гроши."
        source: { kind: authored }
      - pl: "Nie sprzedam przyjaciela."
        ru: "Я не продам друга."
        source: { kind: authored }
  - id: sold
    ru: "sprzedany — проданный"
    examples:
      - pl: "Dom został sprzedany."
        ru: "Дом был продан."
        source: { kind: tatoeba, id: 8762751 }
      - pl: "Dom jest sprzedany."
        ru: "Дом продан."
        source: { kind: translated, id: 9677603 }
      - pl: "Sprzedane!"
        ru: "Продано!"
        source: { kind: translated, id: 11261783 }
notes:
  - { kind: usage, text: "С się глагол меняет смысл на «разойтись, быть распроданным»: Bilety sprzedały się w tydzień «Билеты разошлись за неделю», Sprzedało się wszystko «Всё распродалось»." }
  - { kind: government, text: "Кому продать — дательный: sprzedać coś komuś. За сколько — za с винительным: sprzedać za 600 euro. Русское управление совпадает." }
  - { kind: usage, text: "Переносное значение то же, что у русского «продать»: sprzedać kogoś «предать». Отсюда drogo sprzedać swoją skórę «дорого продать свою шкуру»." }
  - { kind: usage, text: "Несовершенный вид — sprzedawać. Существительные: sprzedaż «продажа», sprzedawca «продавец»." }
collocations:
  - { pl: "sprzedać dom", ru: "продать дом" }
  - { pl: "sprzedać się", ru: "продаться; распродаться" }
  - { pl: "sprzedać komuś coś", ru: "продать кому-либо что-либо" }
  - { pl: "drogo sprzedać skórę", ru: "дорого продать шкуру" }
family:
  - { pl: "sprzedawać", ru: "продавать", relation: aspect }
  - { pl: "sprzedaż", ru: "продажа", relation: derived }
  - { pl: "sprzedawca", ru: "продавец", relation: derived }
  - { pl: "dać", ru: "дать", relation: root }
etymology: "Приставка s- плюс przedać, от dać «дать» — та же сборка, что русское «про-дать» от «дать»."
memory: "sprzedać — «продать», и собрано слово от dać «дать», как русское «про-дать». Главное добавление — się: Bilety sprzedały się w tydzień значит «Билеты разошлись за неделю». Переносное значение совпадает с русским: sprzedać kogoś — «предать», отсюда drogo sprzedać swoją skórę. Несовершенный вид — sprzedawać."
idioms:
  - { pl: "sprzedać się", ru: "продаться; распродаться" }
  - { pl: "drogo sprzedać swoją skórę", ru: "дорого продать свою шкуру" }
  - { pl: "sprzedać spod lady", ru: "продать из-под прилавка" }
