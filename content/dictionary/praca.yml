# review
id: praca
format: 2
lemma: "praca"
rank: 139
pos: noun
pron: { cyr: "пра́ца" }
senses:
  - id: job
    ru: "работа (место работы, занятость)"
    examples:
      - pl: "Idę do pracy."
        ru: "Я иду на работу."
        source: { kind: tatoeba, id: 5489240 }
      - pl: "Nie mam pracy."
        ru: "У меня нет работы."
        source: { kind: tatoeba, id: 6603157 }
      - pl: "Straciłem pracę."
        ru: "Я потерял работу."
        source: { kind: tatoeba, id: 8683482 }
  - id: labour
    ru: "работа, труд; произведение, сочинение"
    examples:
      - pl: "To moja praca."
        ru: "Это моя работа."
        source: { kind: tatoeba, id: 557441 }
      - pl: "To jest nasza praca."
        ru: "Это наша работа."
        source: { kind: tatoeba, id: 2252236 }
      - pl: "To jego praca dyplomowa."
        ru: "Это его дипломная работа."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Предлоги другие, чем в русском: iść do pracy «идти на работу», być w pracy «быть на работе», wracać z pracy «возвращаться с работы»." }
  - { kind: usage, text: "praca domowa — «домашнее задание»; praca magisterska — «дипломная работа»." }
collocations:
  - { pl: "iść do pracy", ru: "идти на работу" }
  - { pl: "w pracy", ru: "на работе" }
  - { pl: "szukać pracy", ru: "искать работу" }
  - { pl: "praca domowa", ru: "домашнее задание" }
etymology: "Заимствование из старочешского prácě (праславянское *porťa); ожидаемая польская форма *proca сохранилась только в старом глаголе procować. Русское «работа» — от другого корня."
memory: "Предлоги не совпадают с русскими: iść do pracy «идти на работу», być w pracy «быть на работе». И praca — это и работа, и труд, и научное сочинение."
idioms:
  - { pl: "bez pracy nie ma kołaczy", ru: "без труда не выловишь и рыбку" }
  - { pl: "syzyfowa praca", ru: "сизифов труд" }
  - { pl: "mrówcza praca", ru: "кропотливый труд" }
formExamplesSkip:
  - { form: "praco", reason: "звательный падеж от отвлечённого существительного в живой речи не встречается" }
