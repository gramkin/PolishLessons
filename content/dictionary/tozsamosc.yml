# review
id: tozsamosc
format: 2
lemma: "tożsamość"
rank: 1885
pos: noun
pron: { cyr: "тожса́мосьць" }
senses:
  - id: identity-person
    ru: "личность (кто человек такой)"
    examples:
      - pl: "Podajcie swoją tożsamość!"
        ru: "Назовите себя!"
        source: { kind: translated, id: 8617500 }
      - pl: "Przestępca musiał ukryć swoją tożsamość."
        ru: "Преступнику пришлось скрыть свою личность."
        source: { kind: translated, id: 3871970 }
      - pl: "Tożsamość zaginionego dziecka została potwierdzona przez ubrania."
        ru: "Личность пропавшего ребёнка установили по одежде."
        source: { kind: translated, id: 12341514 }
      - pl: "Przygotuj dowód tożsamości."
        ru: "Приготовьте удостоверение личности."
        source: { kind: translated, id: 10695819 }
      - pl: "Czy masz jakiś dowód tożsamości?"
        ru: "У тебя есть какое-нибудь удостоверение личности?"
        source: { kind: translated, id: 10542836 }
      - pl: "Przykro mi, ale bez dowodu tożsamości nie może Pan otrzymać przelewu."
        ru: "Мне жаль, но без удостоверения личности вы не можете получить перевод."
        source: { kind: translated, id: 1045412 }
  - id: identity-belonging
    ru: "идентичность, самосознание"
    examples:
      - pl: "Zatoka Perska to dla Irańczyków element tożsamości historycznej."
        ru: "Персидский залив для иранцев — часть исторической идентичности."
        source: { kind: translated, id: 1592112 }
      - pl: "Język jest ważną częścią tożsamości narodowej."
        ru: "Язык — важная часть национальной идентичности."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "dowód tożsamości — это «удостоверение личности», а не «доказательство тождества»: dowód здесь значит «документ»." }
  - { kind: usage, text: "Существительное женского рода на -ość и склоняется как miłość, wolność: tożsamość, tożsamości, tożsamością." }
  - { kind: usage, text: "Второе значение — «идентичность»: tożsamość narodowa «национальная идентичность», kradzież tożsamości «кража личных данных»." }
collocations:
  - { pl: "dowód tożsamości", ru: "удостоверение личности" }
  - { pl: "tożsamość narodowa", ru: "национальная идентичность" }
  - { pl: "ustalić tożsamość", ru: "установить личность" }
etymology: "От tożsamy «тождественный», а то — от toż samo «то же самое». Русское «тождество» построено буквально так же, из «то же»."
memory: "tożsamość выросло из toż samo «то же самое» — как русское «тождество». Но в быту это «личность»: dowód tożsamości «удостоверение личности»."
idioms:
