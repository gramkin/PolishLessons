notes:
  - { kind: false-friend, text: "Русское «юридический» и «правовой» распределены в польском между двумя прилагательными, и путать их не стоит. PRAWNY значит «правовой, законный», то есть относящийся к праву как к явлению: STAN PRAWNY «правовое состояние», PODSTAWA PRAWNA «правовое основание», PRAWNY WŁAŚCICIEL «законный владелец». PRAWNICZY значит «относящийся к юристам как к сословию и профессии»: STUDIA PRAWNICZE «юридическое образование», ŻARGON PRAWNICZY «юридический жаргон», KANCELARIA PRAWNICZA. Поэтому WYDZIAŁ PRAWNICZY есть юридический факультет, а WYDZIAŁ PRAWNY звучало бы как «отдел по правовым вопросам»." }
  - { kind: usage, text: "Относительное прилагательное: степеней сравнения не имеет и иметь не может, потому что основание не бывает «более правовым». Отсюда одиннадцать форм, та же картина, что у TELEFONICZNY и HANDLOWY. Самые частые сочетания стоит выучить блоком, они постоянны в документах: OSOBA PRAWNA «юридическое лицо», в отличие от OSOBA FIZYCZNA «физическое лицо», POMOC PRAWNA «юридическая помощь», OBSŁUGA PRAWNA, ŚRODKI PRAWNE «правовые средства», STAN PRAWNY." }
  - { kind: pronunciation, text: "Читается «пра́вны», ударение на первом слоге из двух. Сочетание WN произносится слитно, без гласной между В и Н. Конечное Y даёт «ы». Мужско-личная форма множественного PRAWNI звучит «пра́вни», с мягким n. Слово короткое и для русского лёгкое: трудность не в звучании, а в выборе между PRAWNY и PRAWNICZY, разобранном выше." }
  - { kind: government, text: "Прилагательное согласуется с существительным и ничем не управляет. В юридических оборотах оно почти всегда стоит после существительного, в отличие от обиходной речи: OSOBA PRAWNA, PODSTAWA PRAWNA, SKUTKI PRAWNE, и такой порядок в терминах закреплён. Существительное от того же корня — PRAWO, которое значит и «право», и «закон», и, во множественном числе PRAWA, «права». Наречие PRAWNIE значит «юридически, с правовой точки зрения»." }
