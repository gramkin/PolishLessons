etymology: "От PRAWO «право, закон», из праславянского *pravъ «прямой, правильный». Тот же корень в русских «право», «правый», «правильный», «правда», и исходный образ один: прямизна, отсутствие кривизны. Отсюда и переход к праву как к тому, что выпрямляет и выправляет. Польский держит всё гнездо вместе и прозрачно: PRAWO, PRAWY «правый», PRAWDA «правда», PRAWNY, PRAWNIK, PRAWIDŁO «правило». Разница с русским только в распределении производных: там, где русский берёт «юридический» из латыни, польский обходится своим PRAWNY и PRAWNICZY, и потому юридическая терминология в польском на вид проще и прозрачнее."
memory: "Не путать с prawniczy: prawny — относящийся к праву (podstawa prawna, osoba prawna), prawniczy — относящийся к юристам (studia prawnicze, kancelaria prawnicza). Относительное, степеней нет, одиннадцать форм, как telefoniczny. Корень тот же, что в русских «право» и «правда», от *pravъ «прямой»."
