# review
id: oplacic
format: 2
lemma: "opłacić"
rank: 3990
pos: verb
pron: { cyr: "опуа́циць" }
senses:
  - id: pay
    ru: "оплатить"
    examples:
      - pl: "Muszę opłacić rachunki do piątku."
        ru: "Мне надо оплатить счета до пятницы."
        source: { kind: authored }
      - pl: "Opłaciła synowi kurs prawa jazdy."
        ru: "Она оплатила сыну курсы вождения."
        source: { kind: authored }
      - pl: "Opłać parking, bo dostaniesz mandat."
        ru: "Оплати парковку, а то получишь штраф."
        source: { kind: authored }
  - id: bribe
    ru: "подкупить, нанять за деньги"
    examples:
      - pl: "Opłacił świadka, żeby kłamał."
        ru: "Он подкупил свидетеля, чтобы тот лгал."
        source: { kind: authored }
      - pl: "Opłacili płatnego zabójcę."
        ru: "Они наняли наёмного убийцу."
        source: { kind: authored }
  - id: pay-off
    ru: "с SIĘ — окупиться, стоить того"
    examples:
      - pl: "Opłaciło się czekać."
        ru: "Стоило подождать."
        source: { kind: authored }
      - pl: "Ta decyzja opłaciła się po latach."
        ru: "Это решение окупилось спустя годы."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "OPŁACIĆ — «оплатить», без предлога: OPŁACIĆ CZYNSZ, а не «za czynsz». Заплатить человеку — ZAPŁACIĆ: ZAPŁACIĆ KELNEROWI. OPŁACIĆ KOGOŚ — «подкупить, нанять». OPŁACIĆ SIĘ — «окупиться», русское «оплатиться» так не употребляется." }
  - { kind: usage, text: "Пятьдесят три формы, включая OPŁACENI — «подкупленные»: OPŁACENI ŚWIADKOWIE. Будущее: OPŁACĘ, OPŁACISZ, повелительное OPŁAĆ. Несовершенный вид — OPŁACAĆ: TO SIĘ NIE OPŁACA «это невыгодно»." }
  - { kind: government, text: "Что — винительный без предлога: OPŁACIĆ RACHUNEK. Кому — дательный: OPŁACIĆ KOMUŚ STUDIA. Чем — творительный: OPŁACIĆ KARTĄ, PRZELEWEM. С SIĘ — кому: OPŁACIŁO MU SIĘ." }
  - { kind: pronunciation, text: "Читается «опуа́циць»: Ł — «у», CI — «ци», ударение на предпоследнем слоге. OPŁACĘ — «опуа́цэ», OPŁAĆ — «о́пуаць»." }
  - { kind: register, text: "Нейтральное, частое в официальных текстах: OPŁACIĆ SKŁADKĘ, ABONAMENT, CZESNE. OPŁACIĆ SIĘ — нейтральное и разговорное. OPŁACIĆ KOGOŚ — с оттенком подкупа." }
collocations:
  - { pl: "opłacić rachunki", ru: "оплатить счета" }
  - { pl: "opłacić czynsz", ru: "оплатить квартплату" }
  - { pl: "opłaciło się", ru: "оно того стоило" }
family:
  - { pl: "płacić", ru: "платить", relation: root, id: placic }
  - { pl: "zapłacić", ru: "заплатить", relation: derived, id: zaplacic }
  - { pl: "opłata", ru: "плата, сбор", relation: derived, id: oplata }
etymology: "Приставка O- плюс PŁACIĆ «платить», от праславянского *platiti, родственного *platъ «кусок ткани»: ткань когда-то служила платёжным средством. Русское «оплатить» — то же строение."
memory: "Opłacić — оплатить: opłacić rachunki, без «za». Opłacić kogoś — подкупить. Opłaciło się — оно того стоило. Читается «опуа́циць»."
idioms:
  - { pl: "opłacić coś zdrowiem", ru: "поплатиться за что-то здоровьем" }
