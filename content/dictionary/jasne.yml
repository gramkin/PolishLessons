# review
id: jasne
format: 2
lemma: "jasne"
rank: 436
pos: adj
pron: { cyr: "я́снэ" }
senses:
  - id: sure
    ru: "ясно, понятно; конечно (разговорная реплика)"
    examples:
      - pl: "Jasne!"
        ru: "Конечно!"
        source: { kind: translated, id: 6160315 }
      - pl: "Wszystko jasne?"
        ru: "Всё понятно?"
        source: { kind: tatoeba, id: 13785906 }
      - pl: "Było dla mnie jasne, że doznaliśmy druzgocącej klęski."
        ru: "Мне было ясно, что мы потерпели сокрушительную неудачу."
        source: { kind: tatoeba, id: 13546975 }
  - id: bright
    ru: "ясный, светлый (формы прилагательного jasny)"
    examples:
      - pl: "Ona udekorowała swój pokój w jasnych kolorach."
        ru: "Она украсила свою комнату в светлых тонах."
        source: { kind: translated, id: 1348594 }
      - pl: "Świecą jasnym światłem."
        ru: "Они светят ярким светом."
        source: { kind: translated, id: 6156493 }
      - pl: "To było jak grom z jasnego nieba."
        ru: "Это было как гром среди ясного неба."
        source: { kind: tatoeba, id: 353886 }
notes:
  - { kind: usage, text: "Jasne! — готовая разговорная реплика «Ясно!», «Конечно!», «Само собой». Это самое частое употребление слова." }
  - { kind: usage, text: "Wszystko jasne? — «Всё понятно?», а To jasne — «Это ясно»." }
  - { kind: false-friend, text: "Прилагательное jasny значит и «ясный» (о небе, о мысли), и «светлый» (о цвете, о волосах). Русское «ясный» покрывает только первое: jasne włosy — это «светлые волосы», а не «ясные»." }
  - { kind: usage, text: "Поговорка grom z jasnego nieba совпадает с русской «гром среди ясного неба»." }
collocations:
  - { pl: "jasne!", ru: "конечно!" }
  - { pl: "wszystko jasne", ru: "всё понятно" }
  - { pl: "jasne włosy", ru: "светлые волосы" }
  - { pl: "jasna sprawa", ru: "ясное дело" }
etymology: "Праславянское *jasnъ; русское «ясный» — то же слово. Но польское значение шире: оно захватило ещё и «светлый»."
memory: "jasne — прежде всего реплика «Ясно!, Конечно!». Остальные формы принадлежат прилагательному jasny, а оно значит и «ясный», и — в отличие от русского — «светлый»: jasne włosy это «светлые волосы»."
idioms:
  - { pl: "jasne!", ru: "конечно!, ясное дело!" }
  - { pl: "grom z jasnego nieba", ru: "гром среди ясного неба" }
  - { pl: "jasna sprawa", ru: "ясное дело" }
