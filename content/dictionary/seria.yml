etymology: "Через французское série из латинского series «ряд, вереница, последовательность» — тот же источник, что у русского «серия»."
memory: "seria — «серия, ряд, партия», женский род. Главная ловушка: serio это не падеж слова seria, а отдельное наречие «серьёзно» (Mówisz serio?). И отдельная серия сериала — не seria, а odcinek."
