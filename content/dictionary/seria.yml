# review
id: seria
format: 2
lemma: "seria"
rank: 1057
pos: noun
pron: { cyr: "се́рья" }
senses:
  - id: series
    ru: "серия, ряд (следующих друг за другом)"
    examples:
      - pl: "Seria wybuchów obróciła pracownię w ruinę."
        ru: "Серия взрывов превратила мастерскую в руины."
        source: { kind: translated, id: 349026 }
      - pl: "Miałem potem całą serię nieszczęść."
        ru: "Потом со мной случилась целая серия несчастий."
        source: { kind: translated, id: 768801 }
      - pl: "Przeprowadzili serię eksperymentów w nieważkości."
        ru: "Они провели серию экспериментов в невесомости."
        source: { kind: translated, id: 765875 }
  - id: batch
    ru: "серия, партия (одинаковых изделий)"
    examples:
      - pl: "Monety z borsukiem są osiemnastym zestawem z serii z zagrożonymi gatunkami zwierząt."
        ru: "Монеты с барсуком — восемнадцатый набор из серии о видах животных под угрозой."
        source: { kind: translated, id: 6155759 }
      - pl: "Numer serii jest na opakowaniu."
        ru: "Номер серии указан на упаковке."
        source: { kind: authored }
      - pl: "Wypuścili nową serię monet."
        ru: "Выпустили новую серию монет."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Женский род на -ia: seria, serii, serię. Родительный, дательный и предложный совпадают — serii, с одним i." }
  - { kind: false-friend, text: "Не путайте seria «серия» с serio «серьёзно, всерьёз». Это разные слова, а не падежи одного: Mówisz serio? «Ты серьёзно?»." }
  - { kind: usage, text: "Отдельная серия сериала по-польски — odcinek. Слово seria значит «сезон» целиком либо «партия изделий»." }
  - { kind: usage, text: "Ещё одно значение — «очередь» при стрельбе: seria z karabinu «очередь из винтовки»." }
collocations:
  - { pl: "seria wydarzeń", ru: "серия событий" }
  - { pl: "numer serii", ru: "номер серии" }
  - { pl: "cała seria", ru: "целая серия" }
family:
