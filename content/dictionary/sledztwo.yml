# review
id: sledztwo
format: 2
lemma: "śledztwo"
rank: 1264
pos: noun
pron: { cyr: "сьле́цтво" }
senses:
  - id: investigation
    ru: "следствие, расследование"
    examples:
      - pl: "Policja prowadzi śledztwo."
        ru: "Полиция ведёт следствие."
        source: { kind: translated, id: 365647 }
      - pl: "Policja wszczęła śledztwo w tej sprawie."
        ru: "Полиция начала следствие по этому делу."
        source: { kind: translated, id: 977239 }
      - pl: "Śledztwo zostało rozpoczęte."
        ru: "Следствие начато."
        source: { kind: translated, id: 13563208 }
  - id: progress
    ru: "ход следствия"
    examples:
      - pl: "Śledztwo utknęło w martwym punkcie."
        ru: "Следствие зашло в тупик."
        source: { kind: translated, id: 9686628 }
      - pl: "Policja chciała przeprowadzić gruntowne śledztwo."
        ru: "Полиция хотела провести тщательное расследование."
        source: { kind: translated, id: 735422 }
      - pl: "Nie było śledztwa."
        ru: "Следствия не было."
        source: { kind: translated, id: 4439442 }
notes:
  - { kind: government, text: "prowadzić śledztwo «вести следствие», wszcząć śledztwo «возбудить следствие», umorzyć śledztwo «прекратить следствие» — всё с винительным падежом." }
  - { kind: usage, text: "Śledztwo — следствие по уголовному делу. Более широкое «расследование» (журналистское, внутреннее) будет dochodzenie или badanie." }
  - { kind: usage, text: "Рядом стоит всё гнездо: śledzić «следить, отслеживать», ślad «след», śledczy «следователь»." }
  - { kind: pronunciation, text: "Сочетание dz перед tw оглушается, слово звучит «сьле́цтво»." }
collocations:
  - { pl: "prowadzić śledztwo", ru: "вести следствие" }
  - { pl: "wszcząć śledztwo", ru: "возбудить следствие" }
  - { pl: "śledztwo w sprawie", ru: "следствие по делу" }
etymology: "От śledzić «следить», из праславянского *slědъ «след». Русское «следствие» собрано из того же корня «след»."
memory: "śledztwo — «следствие», от śledzić «следить» и ślad «след», ровно как русское «следствие» от «след». Ключевые глаголы: prowadzić śledztwo «вести следствие» и wszcząć śledztwo «возбудить»."
idioms:
  - { pl: "prowadzić śledztwo", ru: "вести следствие" }
  - { pl: "wszcząć śledztwo", ru: "возбудить следствие" }
  - { pl: "śledztwo w sprawie", ru: "следствие по делу" }
