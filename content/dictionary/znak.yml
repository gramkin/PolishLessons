# review
id: znak
format: 2
lemma: "znak"
rank: 915
pos: noun
pron: { cyr: "знак" }
senses:
  - id: sign
    ru: "знак, примета"
    examples:
      - pl: "Zazwyczaj to dobry znak."
        ru: "Обычно это хороший знак."
        source: { kind: tatoeba, id: 4716912 }
      - pl: "To jest zły znak."
        ru: "Это дурной знак."
        source: { kind: translated, id: 3926361 }
      - pl: "To musi być znak."
        ru: "Это, должно быть, знак."
        source: { kind: translated, id: 10577057 }
  - id: road-sign
    ru: "дорожный знак, табличка"
    examples:
      - pl: "Nie widzisz tam znaku wyjścia?"
        ru: "Ты не видишь там знака выхода?"
        source: { kind: translated, id: 12097181 }
      - pl: "Co jest napisane na tym znaku?"
        ru: "Что написано на этом знаке?"
        source: { kind: translated, id: 360222 }
      - pl: "Większość znaków jest po angielsku."
        ru: "Большинство знаков на английском."
        source: { kind: translated, id: 403201 }
  - id: character
    ru: "знак письма, символ; знак зодиака"
    examples:
      - pl: "Uwaga: nieobsługiwane znaki są wyświetlane w postaci: '_'."
        ru: "Внимание! Вместо неподдерживаемых символов отображается знак подчеркивания (_)."
        source: { kind: tatoeba, id: 715319 }
      - pl: "Skorpion to jeden ze znaków zodiaku."
        ru: "Скорпион — один из знаков зодиака."
        source: { kind: translated, id: 5653019 }
      - pl: "Tomek należy do znaku zodiaku Byk."
        ru: "Томек по знаку зодиака Телец."
        source: { kind: translated, id: 12295922 }
notes:
  - { kind: usage, text: "Слово покрывает и «знак» как примету (dobry znak «добрый знак»), и дорожный знак, и типографский символ: 140 znaków «140 символов»." }
  - { kind: usage, text: "znak zodiaku — «знак зодиака», znak handlowy — «товарный знак», znak krzyża — «крестное знамение»." }
  - { kind: usage, text: "Идиома dawać się we znaki значит «давать себя знать, досаждать»: Upał daje się we znaki «Жара даёт себя знать»." }
  - { kind: usage, text: "Корень тот же, что в znać «знать» и znaczyć «значить»: знак — то, по чему узнают. Русское «знак» и «знать» связаны так же." }
collocations:
  - { pl: "dobry znak", ru: "добрый знак" }
  - { pl: "znak zodiaku", ru: "знак зодиака" }
  - { pl: "znak drogowy", ru: "дорожный знак" }
  - { pl: "dawać się we znaki", ru: "давать себя знать" }
family:
  - { pl: "znaczyć", ru: "значить", relation: root, id: znaczyc }
  - { pl: "oznaka", ru: "признак", relation: derived }
  - { pl: "znaczek", ru: "марка, значок", relation: derived }
etymology: "Праславянское *znakъ от *znati «знать» — то, по чему узнают. Русское «знак» — то же слово, и связь со «знать» видна в обоих языках."
memory: "znak — «знак», и слово совпадает с русским полностью, включая связь со znać «знать». Покрывает и примету (dobry znak), и дорожный знак, и символ письма: 140 znaków. Запомните идиому dawać się we znaki «давать себя знать, досаждать»."
idioms:
  - { pl: "dobry znak", ru: "добрый знак" }
  - { pl: "znak zodiaku", ru: "знак зодиака" }
  - { pl: "dawać się we znaki", ru: "давать себя знать" }
