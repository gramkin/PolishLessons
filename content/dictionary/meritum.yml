# review
id: meritum
format: 2
lemma: "meritum"
rank: 6064
pos: noun
pron: { cyr: "мэри́тум" }
senses:
  - id: substance
    ru: "суть, существо дела"
    examples:
      - pl: "Przejdźmy do meritum."
        ru: "Перейдём к сути."
        source: { kind: authored }
      - pl: "Meritum sprawy jest zupełnie inne."
        ru: "Суть дела совсем в другом."
        source: { kind: authored }
      - pl: "Nie zgadzam się z formą, ale co do meritum masz rację."
        ru: "Я не согласен с формой, но по существу ты прав."
        source: { kind: authored }
  - id: merits-legal
    ru: "юр. существо (дела, спора): rozpatrzyć sprawę co do meritum — «рассмотреть дело по существу»"
    examples:
      - pl: "Sąd nie rozpatrzył sprawy co do meritum."
        ru: "Суд не рассмотрел дело по существу."
        source: { kind: authored }
      - pl: "Skarga została oddalona bez badania meritum."
        ru: "Жалобу отклонили, не рассматривая существа дела."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Латинское слово, в единственном числе не склоняется: meritum, do meritum, o meritum. Устойчиво: PRZEJŚĆ DO MERITUM, «перейти к сути»; CO DO MERITUM, «по существу». Множественное MERITA словари дают, но в речи его нет." }
  - { kind: false-friend, text: "Русскому слышится «мерит», «заслуга» (английское merit), но польское MERITUM — «суть, существо дела», а не заслуга. Заслуги — ZASŁUGI." }
  - { kind: pronunciation, text: "Читается «мэри́тум», ударение на предпоследнем слоге; книжно встречается и латинское «мэ́ритум». UM читается как «ум», без носового звука." }
  - { kind: register, text: "Книжное, деловое и юридическое: на собрании, в суде, в рецензии. В разговоре проще SEDNO: sedno sprawy, «суть дела»." }
collocations:
  - { pl: "przejść do meritum", ru: "перейти к сути" }
  - { pl: "meritum sprawy", ru: "суть дела" }
  - { pl: "co do meritum", ru: "по существу" }
family:
  - { pl: "merytoryczny", ru: "содержательный, по существу", relation: derived }
  - { pl: "merytorycznie", ru: "по существу", relation: derived }
etymology: "Из латинского MERITUM, «заслуга; то, что заслужено», причастия от MERĒRE, «заслуживать». В юридической латыни de merito causae — «по существу дела»: от «того, чего дело заслуживает» значение сдвинулось к «самой сути». Тот же корень в английском merit."
memory: "Meritum — суть, а не «заслуга»: przejdźmy do meritum, «к сути». Не склоняется. Прилагательное — merytoryczny, «по существу». Попроще — sedno."
idioms:
