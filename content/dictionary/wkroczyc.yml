# review
id: wkroczyc
format: 2
lemma: "wkroczyć"
rank: 5189
pos: verb
pron: { cyr: "фкро́чыць" }
senses:
  - id: march-in
    ru: "вступить, войти (торжественно, с силой)"
    examples:
      - pl: "Wojska wkroczyły do miasta."
        ru: "Войска вступили в город."
        source: { kind: authored }
      - pl: "Wkroczył do sali z dumną miną."
        ru: "Он вошёл в зал с гордым видом."
        source: { kind: authored }
      - pl: "Policja wkroczyła do akcji."
        ru: "Полиция вмешалась."
        source: { kind: authored }
  - id: enter-phase
    ru: "вступить (в новый период)"
    examples:
      - pl: "Wkroczyliśmy w nowy etap życia."
        ru: "Мы вступили в новый этап жизни."
        source: { kind: authored }
      - pl: "Kraj wkroczył w okres kryzysu."
        ru: "Страна вступила в период кризиса."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "WKROCZYĆ — «вступить», от KROK, «шаг». Это не просто «войти» (WEJŚĆ), а войти решительно, торжественно или с силой: WOJSKO WKROCZYŁO, «войско вступило». WKROCZYĆ DO AKCJI — «вмешаться», о полиции и спасателях. WKROCZYĆ W DOROSŁOŚĆ — «вступить во взрослую жизнь»." }
  - { kind: usage, text: "Сорок две формы: глагол совершенного вида и непереходный, страдательного причастия нет; есть деепричастие WKROCZYWSZY и безличное WKROCZONO. Видовой партнёр — WKRACZAĆ: WKRACZAMY W NOWĄ ERĘ." }
  - { kind: government, text: "Куда — DO с родительным о месте: WKROCZYĆ DO MIASTA, DO POKOJU. W с винительным о периоде или области: WKROCZYĆ W NOWY ROK, W DOROSŁOŚĆ. В чужое — NA: WKROCZYĆ NA CUDZY TEREN." }
  - { kind: pronunciation, text: "Читается «фкро́чыць», два слога, ударение на первом. W перед K оглушается в «ф». CZ твёрдое — «чы». Конечное Ć — «ць»." }
  - { kind: register, text: "Книжное и торжественное слово: хроники, история, журналистика. В быту говорят WEJŚĆ. WKROCZYĆ NA CZYJEŚ TERYTORIUM — «вторгнуться на чужую территорию», и в переносном смысле." }
collocations:
  - { pl: "wkroczyć do miasta", ru: "вступить в город" }
  - { pl: "wkroczyć do akcji", ru: "вмешаться, начать действовать" }
  - { pl: "wkroczyć w dorosłość", ru: "вступить во взрослую жизнь" }
family:
  - { pl: "wkraczać", ru: "вступать", relation: aspect }
  - { pl: "krok", ru: "шаг", relation: root, id: krok }
  - { pl: "kroczyć", ru: "шагать, ступать", relation: root }
etymology: "Приставка W- «в-» плюс KROCZYĆ «шагать», от KROK «шаг». Русского родственника в живом языке нет; по смыслу ему отвечает «шаг»."
memory: "Wkroczyć — вступить: wojska wkroczyły do miasta. Wkroczyć do akcji — вмешаться. Wkroczyć w dorosłość. От krok — шаг. Читается «фкро́чыць»."
idioms:
