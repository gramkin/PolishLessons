# review
id: stopa
format: 2
lemma: "stopa"
rank: 1058
pos: noun
pron: { cyr: "сто́па" }
senses:
  - id: foot
    ru: "стопа, ступня"
    examples:
      - pl: "Boli mnie stopa."
        ru: "У меня болит стопа."
        source: { kind: translated, id: 8501847 }
      - pl: "Bolą mnie stopy."
        ru: "У меня болят ступни."
        source: { kind: translated, id: 8504656 }
      - pl: "Zraniłem się w stopę."
        ru: "Я поранил себе ступню."
        source: { kind: translated, id: 8509036 }
  - id: rate
    ru: "ставка, уровень, норма"
    note: "Второе большое значение слова, из экономики."
    examples:
      - pl: "Stopa inflacji spada."
        ru: "Уровень инфляции падает."
        source: { kind: translated, id: 366789 }
      - pl: "Stopa procentowa wzrosła."
        ru: "Процентная ставка выросла."
        source: { kind: authored }
  - id: unit
    ru: "фут (мера длины)"
    examples:
      - pl: "Samolot wzniósł się na wysokość czterech tysięcy stóp."
        ru: "Самолёт поднялся до высоты четыре тысячи футов."
        source: { kind: tatoeba, id: 13783079 }
      - pl: "On ma pięć stóp wzrostu."
        ru: "В нём пять футов роста."
        source: { kind: translated, id: 908767 }
notes:
  - { kind: false-friend, text: "stopa — это именно «ступня», от пятки до пальцев, а не вся нога. Вся нога — noga. Русское «стопа» и польское stopa совпадают точно." }
  - { kind: usage, text: "Второе значение — «ставка, уровень»: stopa procentowa «процентная ставка», stopa bezrobocia «уровень безработицы», stopa inflacji «уровень инфляции»." }
  - { kind: usage, text: "Третье значение — «фут»: pięć stóp «пять футов». Родительный множественного пишется с ó — stóp, а не stop." }
  - { kind: usage, text: "od stóp do głów «с головы до ног» — в польском порядок обратный русскому: сначала ноги, потом голова." }
collocations:
  - { pl: "stopa procentowa", ru: "процентная ставка" }
  - { pl: "stopa bezrobocia", ru: "уровень безработицы" }
  - { pl: "od stóp do głów", ru: "с головы до ног" }
  - { pl: "na dobrej stopie", ru: "в хороших отношениях" }
family:
  - { pl: "stopka", ru: "ножка, подставка; нижний колонтитул", relation: derived }
  - { pl: "stopień", ru: "ступень, степень", relation: root }
etymology: "Праславянское *stopa — то же слово, что русская «стопа». Значение «фут» появилось потому, что эта мера длины изначально равнялась длине ступни; английское foot получило второе значение тем же путём."
memory: "stopa — «ступня», а не вся нога: нога это noga. Дальше два неочевидных значения: «ставка, уровень» (stopa procentowa, stopa bezrobocia) и «фут». Родительный множественного — stóp с ó: od stóp do głów «с головы до ног», только наоборот."
idioms:
  - { pl: "od stóp do głów", ru: "с головы до ног" }
  - { pl: "na dobrej stopie", ru: "в хороших отношениях" }
  - { pl: "żyć na wysokiej stopie", ru: "жить на широкую ногу" }
