notes:
  - { kind: false-friend, text: "ГЛАВНАЯ ЛОВУШКА НЕ В ЭТОМ СЛОВЕ, А В СОСЕДНЕМ. Польский MILIARD равен русскому «миллиарду», это 10⁹, тут всё совпадает. Но польский BILION — это 10¹², то есть русский «триллион», а вовсе не английский billion. Поэтому цифры из английских текстов нельзя переносить напрямую: англ. billion = польск. miliard." }
  - { kind: usage, text: "После miliard существительное идёт в РОДИТЕЛЬНОМ множественного: miliard ludzi, miliard złotych. А сказуемое при нём среднего рода единственного числа: miliard ludzi MIESZKA, не mieszkają. Русский строит так же: «миллиард людей живёт»." }
  - { kind: pronunciation, text: "Два слога, ударение на первом: MI-liard. Mi звучит мягко, li тоже, а конечное d оглушается до т: «мі́льярт». Предложный — miliardzie, с d→dzi: «мільярдзе»." }
collocations:
  - { pl: "miliard złotych", ru: "миллиард злотых" }
  - { pl: "osiem miliardów", ru: "восемь миллиардов" }
  - { pl: "miliardy lat", ru: "миллиарды лет" }
family:
