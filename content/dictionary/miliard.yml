  - { pl: "tysiąc", ru: "тысяча", relation: root, id: tysiac }
etymology: "Из французского milliard, от million с увеличительным суффиксом -ard. Million же из итальянского milione, увеличительного от mille «тысяча». Русский «миллиард» пришёл тем же французским путём, поэтому слова совпали и по форме, и по значению."
memory: "miliard — «миллиард», 10⁹, как по-русски. Но помни: польский BILION это 10¹², то есть «триллион», а не английский billion. Предложный — w miliardzie, с d→dzi."
