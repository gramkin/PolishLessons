notes:
  - { kind: false-friend, text: "TABLICA — ЭТО ДОСКА, А НЕ «ТАБЛИЦА». Школьная доска, на которой пишут мелом, доска объявлений, мемориальная доска, номерной знак — всё это tablica. Русская «таблица» со строками и столбцами будет по-польски TABELA. Ошибка частая и заметная: wypełnij tabelę «заполни таблицу» против pisz na tablicy «пиши на доске»." }
  - { kind: pronunciation, text: "Родительный, дательный и предложный единственного совпадают в одной форме TABLICY, а именительный множественного — TABLICE, с другим гласным на конце. Родительный множественного — TABLIC, с нулевым окончанием. Основа на -ca смягчения не требует, поэтому набор форм здесь спокойный." }
collocations:
  - { pl: "tablica rejestracyjna", ru: "номерной знак" }
  - { pl: "tablica ogłoszeń", ru: "доска объявлений" }
  - { pl: "pisać na tablicy", ru: "писать на доске" }
family:
  - { pl: "tabela", ru: "таблица", relation: root }
  - { pl: "tabliczka", ru: "табличка", relation: derived }
  - { pl: "tablet", ru: "планшет", relation: root }
etymology: "Из латинского tabula «доска, дощечка», через которую пришли и наша «таблица», и польская tablica, и даже «табель». Исходный смысл был именно доска: на ней писали. Русский увёл слово к расчерченному листу, польский оставил при доске, а для расчерченного завёл отдельное tabela из того же корня."
memory: "tablica — это доска: школьная, мемориальная, номерной знак. А «таблица» со строками и столбцами будет tabela. Одно слово, два разных предмета."
idioms:
  - { pl: "tablica rejestracyjna", ru: "номерной знак" }
  - { pl: "tabliczka mnożenia", ru: "таблица умножения" }
