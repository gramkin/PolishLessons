  - id: scandal
    ru: "скандал, неприятный осадок (разг.)"
    examples:
      - pl: "Z tej sprawy zrobił się wielki smród."
        ru: "Из этого дела вышел большой скандал."
        source: { kind: authored }
      - pl: "Po jego odejściu został smród."
        ru: "После его ухода остался неприятный осадок."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "SMRÓD — обычная «вонь», а не книжный «смрад», хотя это одно слово. Русскому оно знакомо и по «смородине»: куст назван по резкому запаху листьев. Вежливо говорят NIEPRZYJEMNY ZAPACH, официально — ODÓR." }
  - { kind: usage, text: "Одиннадцать живых форм, мужской род. Ó в начальной форме, O в остальных: SMRÓD, SMRODU. В разговорных оборотах есть родительный SMRODA: NIE RÓB SMRODA. Личная форма SMRODOWIE — ошибка генератора, не даётся." }
  - { kind: government, text: "Вонь чего — родительный: SMRÓD SPALENIZNY, «запах гари». Чувствовать вонь — CZUĆ SMRÓD, винительный. Наделать шуму — NAROBIĆ SMRODU, родительный." }
  - { kind: pronunciation, text: "Читается «смрут», один слог. Ó — «у», конечное D оглушается в «т». В форме SMRODU: «смро́ду»." }
  - { kind: register, text: "Слово разговорное и грубоватое, но не бранное. В переносном смысле — о скандале и дурном послевкусии, тоже разговорное." }
collocations:
  - { pl: "okropny smród", ru: "жуткая вонь" }
  - { pl: "smród spalenizny", ru: "вонь гари" }
  - { pl: "narobić smrodu", ru: "наделать шуму" }
family:
  - { pl: "śmierdzieć", ru: "вонять", relation: root, id: smierdziec }
  - { pl: "śmierdzący", ru: "вонючий", relation: root }
  - { pl: "smrodliwy", ru: "зловонный", relation: derived }
etymology: "Общеславянское слово: русские «смрад» (церковнославянская форма) и «смородина» — его родня. Польское RÓ на месте русских «ра» и «оро» — то же соответствие, что GRÓD «город». Тот же корень с другой огласовкой — в ŚMIERDZIEĆ «вонять»."
memory: "Smród — вонь, «смрад»; śmierdzieć — вонять. Читается «смрут». Ale tu smród! — ну и вонь! Narobić smrodu — наделать шуму. Смородина пахнет так же: тот же корень."
idioms:
  - { pl: "narobić smrodu", ru: "наделать шуму, устроить скандал" }
