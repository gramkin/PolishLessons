# review
id: smrod
format: 2
lemma: "smród"
rank: 4708
pos: noun
pron: { cyr: "смрут" }
senses:
  - id: stench
    ru: "вонь"
    examples:
      - pl: "Ale tu smród!"
        ru: "Ну и вонь здесь!"
        source: { kind: authored }
      - pl: "Smród zgniłych jaj wypełnił pokój."
        ru: "Вонь тухлых яиц заполнила комнату."
        source: { kind: authored }
      - pl: "Czuję smród dymu."
        ru: "Я чувствую вонь дыма."
