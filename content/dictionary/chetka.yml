# review
id: chetka
format: 2
lemma: "chętka"
rank: 2114
pos: noun
pron: { cyr: "хэ́нтка" }
senses:
  - id: whim
    ru: "охота, желание (лёгкое, мимолётное)"
    examples:
      - pl: "Miałem chętkę na lody."
        ru: "Мне захотелось мороженого."
        source: { kind: authored }
      - pl: "Naszła go chętka na spacer."
        ru: "Ему захотелось прогуляться."
        source: { kind: authored }
      - pl: "To tylko chwilowa chętka."
        ru: "Это лишь мимолётная прихоть."
        source: { kind: authored }
  - id: craving
    ru: "прихоть, охотка"
    examples:
      - pl: "Chętka minęła po chwili."
        ru: "Охота прошла через минуту."
        source: { kind: authored }
      - pl: "Mam chętkę coś zmienić."
        ru: "Мне хочется что-то изменить."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Уменьшительное от chęć «желание», поэтому обозначает не серьёзное намерение, а лёгкую охоту: mieć chętkę na coś «иметь охоту на что-л.»." }
  - { kind: government, text: "Чего именно хочется — через na с винительным: chętka na lody «охота на мороженое»." }
  - { kind: false-friend, text: "Не «хатка» и не «щётка». Корень chcieć «хотеть» — ср. русское «хотеть», «охота»." }
  - { kind: usage, text: "В корпусе слово не встречается, поэтому все примеры составлены вручную." }
collocations:
  - { pl: "mieć chętkę na coś", ru: "иметь охоту на что-л." }
etymology: "Уменьшительное от chęć «желание», от chcieć «хотеть»; ср. русское «хотеть», «охота»."
memory: "chętka — лёгкая «охота, прихоть», уменьшительное от chęć. Конструкция mieć chętkę na coś, с na и винительным."
idioms:
