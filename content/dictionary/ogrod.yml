etymology: "Приставка o- плюс корень grod-, тот же, что в grodzić «огораживать» и gród «град, крепость». Буквально «огороженное место» — и русский «огород» собран из тех же частей тем же способом, просто закрепился за грядками. Отсюда ogrodzenie «ограда», ogrodnik «садовник», ogródek и сам gród."
memory: "ogród — «огород» по составу, но «сад» по смыслу. Тройка, которую стоит заучить целиком: ogród = сад, ogród warzywny = огород, sad = фруктовый сад. А идиома совпадает дословно: kamyczek do czyjegoś ogródka — «камешек в чей-то огород»."
idioms:
  - { pl: "kamyczek do czyjegoś ogródka", ru: "камешек в чей-то огород" }
  - { pl: "ogród zoologiczny", ru: "зоопарк" }
