notes:
  - { kind: false-friend, text: "ТРЁХСТОРОННЯЯ ПУТАНИЦА, И РАЗОБРАТЬ ЕЁ НАДО СРАЗУ. Ogród — это буквально русский «огород», слово в слово: o- плюс корень «город-», как в grodzić «огораживать». Но значения разошлись натрое. Польское ogród — это русский САД, любой: ogród przy domu, ogród botaniczny. Русский «огород» по-польски будет ogród warzywny или ogródek. А польское sad — это не «сад» вообще, а именно ФРУКТОВЫЙ сад. Держите в голове тройку: ogród = сад, ogród warzywny = огород, sad = фруктовый сад." }
  - { kind: pronunciation, text: "ó держится только в закрытом слоге: ogród, но ogrodu, ogrody, ogrodzie. Правило уже знакомо по głód/głodu и rósł/rosła. Конечное d при этом оглушается, и слово звучит «о́грут». А в предложном падеже d смягчается в dzi: w ogrodzie — ровно так же, как lud даёт w ludzie." }
  - { kind: usage, text: "Названия учреждений строятся прилагательным: ogród zoologiczny «зоопарк», ogród botaniczny «ботанический сад», ogród działkowy «садовый участок». Уменьшительное ogródek работает сразу в трёх смыслах: «садик», «огородик» и ещё «летняя веранда кафе» — ogródek piwny, letni ogródek." }
