# review
id: wyreczyc
format: 2
lemma: "wyręczyć"
rank: 2182
pos: verb
aspect: perf
pron: { cyr: "выре́нчиць" }
senses:
  - id: relieve
    ru: "сделать за кого-либо, подменить"
    examples:
      - pl: "Wyręczył mnie w pracy."
        ru: "Он сделал работу за меня."
        source: { kind: authored }
      - pl: "Nikt nie może mnie wyręczyć."
        ru: "Никто не может сделать это за меня."
        source: { kind: authored }
      - pl: "Może cię ktoś wyręczy."
        ru: "Может, кто-то тебя подменит."
        source: { kind: authored }
  - id: do-instead
    ru: "избавить от необходимости делать"
    examples:
      - pl: "Maszyna wyręczy człowieka."
        ru: "Машина сделает работу за человека."
        source: { kind: authored }
      - pl: "Wyręczyła matkę w gotowaniu."
        ru: "Она сготовила вместо матери."
        source: { kind: authored }
notes:
  - { kind: government, text: "Кого подменяют — винительный, в чём — предлог w с предложным: wyręczyć kogoś w czymś «сделать за кого-л. что-л.»." }
  - { kind: false-friend, text: "Корень ręka «рука»: буквально «снять с чужих рук». Русское «выручить» звучит похоже, но значит «помочь в беде», а не «сделать вместо»." }
  - { kind: usage, text: "Несовершенный вид — wyręczać. Осторожно: формы вроде wyręczaj принадлежат уже ему, а не этому глаголу." }
  - { kind: usage, text: "В корпусе слово не встречается, поэтому все примеры составлены вручную." }
collocations:
  - { pl: "wyręczyć kogoś w czymś", ru: "сделать за кого-л. что-л." }
etymology: "wy- + ręka «рука»: снять дело с чужих рук."
memory: "wyręczyć — «сделать за кого-либо, подменить». Похоже на русское «выручить», но смысл другой: выручают в беде, а wyręczyć — берут на себя чужую работу."
idioms:
  - { pl: "wyręczyć kogoś w czymś", ru: "сделать за кого-л. что-л." }
