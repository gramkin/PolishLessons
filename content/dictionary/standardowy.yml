# review
id: standardowy
format: 2
lemma: "standardowy"
rank: 4794
pos: adj
pron: { cyr: "стандардо́вы" }
senses:
  - id: standard
    ru: "стандартный, обычный (по стандарту)"
    examples:
      - pl: "To standardowa procedura, proszę się nie martwić."
        ru: "Это стандартная процедура, не волнуйтесь."
        source: { kind: authored }
      - pl: "Pokój standardowy kosztuje dwieście złotych za noc."
        ru: "Стандартный номер стоит двести злотых за ночь."
        source: { kind: authored }
      - pl: "Odpowiedź była standardowa i nic nie wyjaśniała."
        ru: "Ответ был стандартным и ничего не объяснял."
        source: { kind: authored }
  - id: typical
    ru: "типичный, шаблонный"
    examples:
      - pl: "Usłyszałem standardową wymówkę."
        ru: "Я услышал стандартную отговорку."
        source: { kind: authored }
      - pl: "To standardowy błąd początkujących."
        ru: "Это типичная ошибка новичков."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Значение то же, что у русского «стандартный», но польское слово сильнее тянется к «обычному, базовому»: WERSJA STANDARDOWA — «базовая комплектация», POKÓJ STANDARDOWY — «номер стандартной категории». Русское «нестандартный» по-польски NIESTANDARDOWY: NIESTANDARDOWE ROZWIĄZANIE, «нестандартное решение»." }
  - { kind: usage, text: "Сравнивается редко, описательно: BARDZIEJ STANDARDOWY. Формы для мужчин-людей STANDARDOWI в карточке нет: стандартными бывают процедуры и номера, а не люди. Остальные десять форм живые. Наречие STANDARDOWO, «как обычно, по умолчанию»: STANDARDOWO WŁĄCZONE, «включено по умолчанию»." }
  - { kind: government, text: "Может стоять и до, и после существительного: STANDARDOWA PROCEDURA и PROCEDURA STANDARDOWA. После — чаще в каталогах и прайсах: WYPOSAŻENIE STANDARDOWE. Падежных требований нет." }
  - { kind: pronunciation, text: "Читается «стандардо́вы», четыре слога, ударение на предпоследнем. В середине D перед гласной звонкое, хотя в STANDARD «ста́ндарт» конечное D оглушается. DO — чёткое «до»." }
  - { kind: register, text: "Нейтральное слово, особенно частое в торговле, гостиницах и технике. В разговоре его часто заменяют на ZWYKŁY или NORMALNY: ZWYKŁY POKÓJ, NORMALNA PROCEDURA. STANDARDOWY звучит чуть деловитее." }
collocations:
  - { pl: "standardowa procedura", ru: "стандартная процедура" }
  - { pl: "wyposażenie standardowe", ru: "базовая комплектация" }
  - { pl: "standardowy rozmiar", ru: "стандартный размер" }
family:
  - { pl: "standard", ru: "стандарт", relation: root, id: standard }
  - { pl: "standardowo", ru: "стандартно, по умолчанию", relation: derived }
  - { pl: "typowy", ru: "типичный", relation: root, id: typowy }
etymology: "От STANDARD, из английского standard, а то от старофранцузского estandart, «знамя, штандарт». Знамя было образцом, к которому сходились, и отсюда «образец, норма». Польское SZTANDAR, «знамя, штандарт», — то же слово, пришедшее раньше через немецкий и оставшееся военным знаменем."
memory: "Standardowy — стандартный, обычный: standardowa procedura, pokój standardowy. Нестандартный — niestandardowy. Читается «стандардо́вы»."
idioms:
  - { pl: "standardowa wymówka", ru: "дежурная отговорка" }
formExamplesSkip:
