# review
id: cholera
format: 2
lemma: "cholera"
rank: 206
pos: noun
pron: { cyr: "холе́ра" }
senses:
  - id: damn
    ru: "чёрт!, чёрт возьми! (ругательство)"
    note: "Грубовато, но мягче русского мата; в официальной обстановке недопустимо."
    examples:
      - pl: "Cholera."
        ru: "Чёрт."
        source: { kind: translated, id: 931156 }
      - pl: "\"Ej, zrobiłeś zadaniem z matematyki?\" - \"A, cholera, zupełnie zapomniałem\""
        ru: "\"Эй, ты сделал домашку по математике?\" - \"А, чёрт, совсем забыл\"."
        source: { kind: tatoeba, id: 10747404 }
      - pl: "Cholera, znowu pada."
        ru: "Чёрт, опять дождь."
        source: { kind: authored }
  - id: disease
    ru: "холера (болезнь) — исходное значение"
    examples:
      - pl: "Cholera to groźna choroba."
        ru: "Холера — опасная болезнь."
        source: { kind: authored }
      - pl: "W XIX wieku wybuchła epidemia cholery."
        ru: "В девятнадцатом веке вспыхнула эпидемия холеры."
        source: { kind: authored }
      - pl: "Szczepionka chroni przed cholerą."
        ru: "Прививка защищает от холеры."
        source: { kind: authored }
notes:
  - { kind: register, text: "В живой речи это ругательство уровня русского «чёрт». Друзьям — нормально, начальнику или незнакомому — нет." }
  - { kind: usage, text: "do cholery — «чёрт возьми»; cholera wie — «чёрт знает»; za cholerę nie… — «хоть убей, не…»." }
  - { kind: usage, text: "Исходное значение — болезнь холера; ругательное употребление выросло из названия болезни." }
collocations:
  - { pl: "do cholery", ru: "чёрт возьми" }
  - { pl: "cholera wie", ru: "чёрт знает" }
  - { pl: "cholera jasna", ru: "чёрт побери" }
  - { pl: "za cholerę", ru: "хоть убей" }
etymology: "Из греческого χολέρα «желчная болезнь» через латынь; то же слово, что русское «холера». Ругательное употребление выросло из названия болезни."
memory: "Исходно болезнь, но в живой речи — ругательство уровня «чёрт»: Cholera! «Чёрт!», do cholery «чёрт возьми». С начальником так лучше не говорить."
idioms:
  - { pl: "cholera jasna", ru: "чёрт побери" }
  - { pl: "cholera wie", ru: "чёрт знает" }
  - { pl: "do jasnej cholery", ru: "чёрт возьми, какого чёрта" }
