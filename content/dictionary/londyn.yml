# review
id: londyn
format: 2
lemma: "Londyn"
rank: 1316
pos: noun
pron: { cyr: "ло́ндын" }
senses:
  - id: london
    ru: "Лондон"
    examples:
      - pl: "Londyn jest stolicą Anglii."
        ru: "Лондон - столица Англии."
        source: { kind: tatoeba, id: 529281 }
      - pl: "Londyn jest stolicą Wielkiej Brytanii."
        ru: "Лондон - столица Великобритании."
        source: { kind: tatoeba, id: 814594 }
      - pl: "Stolicą Zjednoczonego Królestwa jest Londyn."
        ru: "Столица Соединённого Королевства - Лондон."
        source: { kind: tatoeba, id: 7430376 }
  - id: in-london
    ru: "w Londynie — в Лондоне (предложный)"
    examples:
      - pl: "Jestem w Londynie."
        ru: "Я в Лондоне."
        source: { kind: translated, id: 355842 }
      - pl: "Mieszka w Londynie."
        ru: "Он живёт в Лондоне."
        source: { kind: translated, id: 1307222 }
      - pl: "Byłem w Londynie dwukrotnie."
        ru: "Я был в Лондоне дважды."
        source: { kind: translated, id: 929185 }
  - id: to-london
    ru: "do Londynu — в Лондон (родительный)"
    examples:
      - pl: "On wyjechał do Londynu na początku lipca."
        ru: "Он уехал в Лондон в начале июля."
        source: { kind: tatoeba, id: 3659334 }
      - pl: "Czy to prawda, że jedziesz studiować do Londynu?"
        ru: "Это правда, что ты собираешься учиться в Лондоне?"
        source: { kind: tatoeba, id: 359255 }
      - pl: "Pojechaliśmy do Londynu."
        ru: "Мы поехали в Лондон."
        source: { kind: translated, id: 2671599 }
notes:
  - { kind: government, text: "Направление и местоположение различаются падежом: do Londynu «в Лондон» (родительный), но w Londynie «в Лондоне» (предложный)." }
  - { kind: usage, text: "Название склоняется как обычное существительное мужского рода: Londyn, Londynu, Londynem, w Londynie." }
  - { kind: usage, text: "Второе значение метонимическое — «правительство Великобритании»: Londyn ogłosił «Лондон объявил»." }
  - { kind: pronunciation, text: "Ударение на первый слог, а y читается как «ы»: ло́ндын." }
collocations:
  - { pl: "w Londynie", ru: "в Лондоне" }
  - { pl: "do Londynu", ru: "в Лондон" }
  - { pl: "stolica Anglii", ru: "столица Англии" }
etymology: "Через латинское Londinium из кельтского названия. Русский «Лондон» пришёл другим путём, оттого и гласная во втором слоге другая."
memory: "Londyn — «Лондон», и склоняется как обычное существительное: do Londynu «в Лондон» (родительный), w Londynie «в Лондоне» (предложный). Ударение на первый слог, y звучит как «ы»."
