  - { pl: "willa", ru: "вилла", relation: root, id: willa }
  - { pl: "pałac", ru: "дворец", relation: root, id: palac }
  - { pl: "posiadłość", ru: "поместье", relation: root, id: posiadlosc }
etymology: "Из средневековой латыни RESIDENTIA, от RESIDERE «пребывать, сидеть». Русское «резиденция» — то же слово."
memory: "Rezydencja — резиденция и особняк. Rezydencja z basenem — особняк с бассейном. Читается «рэзыдэ́нцья»."
idioms:
