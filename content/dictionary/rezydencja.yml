        source: { kind: authored }
  - id: mansion
    ru: "особняк, роскошный дом"
    examples:
      - pl: "Kupił rezydencję nad morzem."
        ru: "Он купил особняк у моря."
        source: { kind: authored }
      - pl: "Gwiazda mieszka w rezydencji z basenem."
        ru: "Звезда живёт в особняке с бассейном."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "REZYDENCJA — «резиденция», но в быту и «роскошный особняк»: REZYDENCJA Z BASENEM. Обычный дом — DOM, вилла — WILLA, дворец — PAŁAC. Резидент — REZYDENT, и это ещё «ординатор» в медицине." }
  - { kind: usage, text: "Женский род. Родительный, дательный и местный — REZYDENCJI. Множественное — REZYDENCJE. Звательный и архаичное REZYDENCYJ не используем." }
  - { kind: government, text: "В резиденции — W REZYDENCJI, местный. Резиденция кого — родительный: REZYDENCJA PREZYDENTA. Особняк с чем — REZYDENCJA Z и творительный." }
  - { kind: pronunciation, text: "Читается «рэзыдэ́нцья»: RE — «рэ», ZY — «зы», DE — «дэ», CJA — «цья». Ударение на предпоследнем слоге." }
collocations:
  - { pl: "rezydencja prezydenta", ru: "резиденция президента" }
  - { pl: "luksusowa rezydencja", ru: "роскошный особняк" }
  - { pl: "letnia rezydencja", ru: "летняя резиденция" }
