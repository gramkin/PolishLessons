senses:
  - id: residence
    ru: "резиденция (официальная)"
    examples:
      - pl: "Prezydent przyjął gości w swojej rezydencji."
        ru: "Президент принял гостей в своей резиденции."
        source: { kind: authored }
      - pl: "Rezydencja ambasadora stoi w parku."
