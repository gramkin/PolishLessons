# review
id: odebrac
format: 2
lemma: "odebrać"
rank: 580
pos: verb
aspect: perf
pron: { cyr: "одэ́браць" }
senses:
  - id: pick-up
    ru: "забрать, встретить (кого-л., что-л.)"
    note: "Odbiorę cię po pracy «Я заберу тебя после работы»."
    examples:
      - pl: "Idziemy odebrać Toma."
        ru: "Мы идём забрать Тома."
        source: { kind: translated, id: 7880398 }
      - pl: "Odbiorę cię po pracy."
        ru: "Я заберу тебя после работы."
        source: { kind: translated, id: 5988851 }
      - pl: "Chciałbym odebrać swoje kosztowności."
        ru: "Я хотел бы забрать свои ценности."
        source: { kind: translated, id: 349088 }
  - id: answer-phone
    ru: "odebrać telefon — ответить на звонок"
    note: "Буквально «снять трубку»."
    examples:
      - pl: "Odbierz telefon."
        ru: "Ответь на звонок."
        source: { kind: translated, id: 395341 }
      - pl: "Tom odebrał telefon."
        ru: "Том ответил на звонок."
        source: { kind: translated, id: 3863300 }
      - pl: "Odebrałem telefon."
        ru: "Я ответил на звонок."
        source: { kind: translated, id: 498419 }
  - id: take-away
    ru: "odebrać komuś coś — отнять у кого-л. что-л."
    note: "Человек в дательном, предмет в винительном."
    examples:
      - pl: "Odebrał nam wolność."
        ru: "Он отнял у нас свободу."
        source: { kind: translated, id: 728453 }
      - pl: "Ludziom odebrano ich prawa polityczne."
        ru: "У людей отняли их политические права."
        source: { kind: translated, id: 12470020 }
      - pl: "Ze wzruszenia odebrało mi mowę."
        ru: "От волнения у меня отнялась речь."
        source: { kind: translated, id: 914998 }
notes:
  - { kind: usage, text: "Основа будущего времени меняется: odbiorę, odbierzesz, odbierze, odbiorą — то же чередование -bior-/-bierz-, что в brać «брать»." }
  - { kind: government, text: "odebrać komuś coś «отнять у кого-то что-то» ставит человека в дательный падеж: odebrał nam wolność. Русский здесь требует «у кого-то» с родительным." }
  - { kind: usage, text: "Несовершенный вид — odbierać. Оборот odebrać telefon значит «ответить на звонок»." }
  - { kind: usage, text: "Ещё два живых значения: odebrać wykształcenie «получить образование» и odebrać coś jako groźbę «воспринять что-то как угрозу»." }
collocations:
  - { pl: "odebrać telefon", ru: "ответить на звонок" }
  - { pl: "odebrać kogoś", ru: "забрать кого-либо" }
  - { pl: "odebrać komuś coś", ru: "отнять у кого-либо что-либо" }
  - { pl: "odebrać wykształcenie", ru: "получить образование" }
family:
  - { pl: "brać", ru: "брать", relation: root }
  - { pl: "odbierać", ru: "забирать", relation: derived }
  - { pl: "odbiór", ru: "приём, получение", relation: derived }
etymology: "Приставка od- плюс brać «брать», от праславянского *bьrati — то же слово, что русское «отобрать»; чередование -bior-/-bierz- то же, что в brać/biorę."
memory: "odebrać — «забрать, отнять, получить», а заодно и «ответить на звонок»: Odbierz telefon. Основа в будущем времени скачет: odbiorę, odbierzesz, odbiorą — ровно то же чередование, что в brać/biorę. И запомните управление: odebrać KOMUŚ coś значит «отнять У кого-то что-то», человек стоит в дательном — odebrał nam wolność. Несовершенный вид — odbierać."
idioms:
  - { pl: "odebrać telefon", ru: "ответить на звонок" }
  - { pl: "odebrało mi mowę", ru: "у меня отнялась речь" }
  - { pl: "odebrać komuś wolność", ru: "лишить кого-либо свободы" }
