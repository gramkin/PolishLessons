# review
id: idea
format: 2
lemma: "idea"
rank: 3935
pos: noun
pron: { cyr: "идэ́а" }
senses:
  - id: idea
    ru: "идея, принцип, замысел"
    examples:
      - pl: "Idea wolności łączyła cały naród."
        ru: "Идея свободы объединяла весь народ."
        source: { kind: authored }
      - pl: "Wierzy w ideę zjednoczonej Europy."
        ru: "Он верит в идею единой Европы."
        source: { kind: authored }
      - pl: "Ta idea zmieniła świat."
        ru: "Эта идея изменила мир."
        source: { kind: authored }
      - pl: "Główną ideą projektu jest prostota."
        ru: "Главная идея проекта — простота."
        source: { kind: authored }
      - pl: "Za tą ideą stoją miliony ludzi."
        ru: "За этой идеей стоят миллионы людей."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "IDEA — «идея» в высоком смысле: принцип, идеал, замысел. Бытовая «идея, мысль» — POMYSŁ: MAM POMYSŁ!, «у меня есть идея!». Сказать MAM IDEĘ так нельзя." }
  - { kind: usage, text: "Восемь живых форм, женский род. Родительный, дательный и местный — IDEI. Во множественном — IDEE. Архаичная форма IDEJ и звательный не даются." }
  - { kind: government, text: "Идея чего — родительный: IDEA WOLNOŚCI. Верить в идею — WIERZYĆ W IDEĘ, W с винительным. Отказаться от идеи — PORZUCIĆ IDEĘ, винительный, где в русском «от» с родительным." }
  - { kind: pronunciation, text: "Читается «идэ́а», три слога, ударение на предпоследнем. E и A произносятся раздельно." }
collocations:
  - { pl: "idea wolności", ru: "идея свободы" }
  - { pl: "wierzyć w ideę", ru: "верить в идею" }
  - { pl: "główna idea", ru: "главная идея" }
family:
  - { pl: "ideał", ru: "идеал", relation: root, id: ideal }
  - { pl: "ideowy", ru: "идейный", relation: derived }
  - { pl: "ideologia", ru: "идеология", relation: root }
etymology: "Из греческого слова со значением «вид, образ». Русская «идея» — то же слово, но в польском бытовую «идею» занял POMYSŁ."
memory: "Idea — идея-принцип; pomysł — идея-мысль: mam pomysł. Читается «идэ́а». Idea wolności — идея свободы."
idioms:
  - { pl: "wpaść na pomysł", ru: "прийти к идее, додуматься" }
formExamplesSkip:
  - { form: "idej", reason: "архаичная форма родительного множественного; сейчас говорят IDEI" }
  - { form: "ideo", reason: "звательный падеж встречается только в поэзии" }
