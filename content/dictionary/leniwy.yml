# review
id: leniwy
format: 2
lemma: "leniwy"
rank: 5118
pos: adj
pron: { cyr: "лени́вы" }
senses:
  - id: lazy
    ru: "ленивый"
    examples:
      - pl: "Mój kot jest strasznie leniwy."
        ru: "Мой кот ужасно ленивый."
        source: { kind: authored }
      - pl: "Nie bądź leniwy, posprzątaj pokój."
        ru: "Не ленись, убери комнату."
        source: { kind: authored }
      - pl: "To najleniwszy uczeń w klasie."
        ru: "Это самый ленивый ученик в классе."
        source: { kind: authored }
  - id: sluggish
    ru: "вялый, медленный, неторопливый (о движении, времени)"
    examples:
      - pl: "Spędziliśmy leniwy dzień na plaży."
        ru: "Мы провели ленивый день на пляже."
        source: { kind: authored }
      - pl: "Rzeka płynie leniwym nurtem."
        ru: "Река течёт медленным потоком."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Совпадение с русским «ленивый» полное, и корень тот же: LEŃ, «лень». Польская особенность — LENIWE PIEROGI, «ленивые вареники», то же, что русские «ленивые вареники»: блюдо из творога без начинки. А LENIWA NIEDZIELA — «ленивое воскресенье», с удовольствием, без упрёка." }
  - { kind: usage, text: "Полная парадигма с простыми степенями: LENIWY, LENIWSZY, NAJLENIWSZY. Мужское-личное: LENIWI, LENIWSI, NAJLENIWSI. Существительное — LEŃ, «лень», и LENIUCH, «лентяй»." }
  - { kind: government, text: "Ленив в чём-то — LENIWY W + местный: LENIWY W NAUCE. Ленив до работы — LENIWY DO PRACY, DO с родительным. Наречие LENIWIE — «лениво»." }
  - { kind: pronunciation, text: "Читается «лени́вы», три слога, ударение на предпоследнем. LE — мягкое «ле», NI — «ни». В LENIWSZY: «лени́вшы», W оглушается." }
  - { kind: register, text: "Нейтральное слово. О человеке — упрёк, но лёгкий. О дне, воскресенье, коте — тёплое и уютное: LENIWE POPOŁUDNIE, «ленивый вечер»." }
collocations:
  - { pl: "leniwe pierogi", ru: "ленивые вареники" }
  - { pl: "leniwy dzień", ru: "ленивый день" }
  - { pl: "leniwy jak kot", ru: "ленивый как кот" }
family:
  - { pl: "leń", ru: "лень", relation: root }
  - { pl: "leniuch", ru: "лентяй", relation: derived }
  - { pl: "lenistwo", ru: "леность, лень", relation: derived }
etymology: "Общеславянское *lěnivъ, от *lěnь, «лень», того же, что русское «лень» и «ленивый». Польское E на месте русского «е» здесь без изменений. Слово одно из самых устойчивых в славянских языках."
memory: "Leniwy — ленивый: leniwy kot, leniwy dzień, leniwe pierogi (ленивые вареники). Leniwszy, najleniwszy. Leń — лень, leniuch — лентяй. Читается «лени́вы»."
idioms:
  - { pl: "leniwy jak kot", ru: "ленивый как кот" }
