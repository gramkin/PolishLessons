notes:
  - { kind: false-friend, text: "Русская «мышь» и польское mysz — одно слово, и род тоже женский. Компьютерная мышь называется так же, как и в русском." }
  - { kind: government, text: "Женский род на согласную: ta mysz, tej myszy. Такие слова склоняются как noc, rzecz." }
  - { kind: usage, text: "Cicho jak mysz pod miotłą «тише воды, ниже травы», буквально «тихо как мышь под метлой»." }
  - { kind: usage, text: "Летучая мышь — nietoperz, отдельное слово." }
collocations:
  - { pl: "cicho jak mysz", ru: "тихо как мышь" }
  - { pl: "mysz komputerowa", ru: "компьютерная мышь" }
etymology: "Праславянское *myšь; русская «мышь» — то же слово, и род совпадает."
memory: "mysz — «мышь», женского рода на согласную, как noc и rzecz. Летучая мышь — nietoperz. Оборот cicho jak mysz pod miotłą."
