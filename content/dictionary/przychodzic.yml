# review
id: przychodzic
format: 2
lemma: "przychodzić"
rank: 590
pos: verb
aspect: imperf
pron: { cyr: "пшыхо́дзиць" }
senses:
  - id: come
    ru: "приходить"
    note: "przychodzić do kogoś «приходить к кому-то» — с do и родительным."
    examples:
      - pl: "On przychodzi tu raz w miesiącu."
        ru: "Он приходит один раз в месяц."
        source: { kind: tatoeba, id: 359247 }
      - pl: "Tom już nie przychodzi."
        ru: "Том больше не приходит."
        source: { kind: tatoeba, id: 12470269 }
      - pl: "Dlaczego przychodzisz do nas tak późno w nocy?"
        ru: "Почему ты приходишь к нам так поздно ночью?"
        source: { kind: tatoeba, id: 511511 }
  - id: arrive
    ru: "приходить (о письмах, боли, деньгах)"
    note: "О неодушевлённом: listy przychodziły «письма приходили»."
    examples:
      - pl: "Ból przychodzi i odchodzi."
        ru: "Боль приходит и уходит."
        source: { kind: tatoeba, id: 10696215 }
      - pl: "Pieniądze przychodzą i odchodzą."
        ru: "Деньги приходят и уходят."
        source: { kind: translated, id: 959711 }
      - pl: "Listy od Fiony przychodziły stopniowo coraz rzadziej."
        ru: "Письма от Фионы приходили всё реже."
        source: { kind: translated, id: 1480689 }
  - id: dont-come
    ru: "nie przychodź — не приходи"
    note: "Отрицательный императив очень частый."
    examples:
      - pl: "Nie przychodź."
        ru: "Не приходи."
        source: { kind: translated, id: 6729683 }
      - pl: "Nie przychodź więcej."
        ru: "Не приходи больше."
        source: { kind: translated, id: 1689649 }
      - pl: "Przecież mówiłem wam, żebyście nie przychodzili!"
        ru: "Я же сказал вам не приходить!"
        source: { kind: tatoeba, id: 13547159 }
notes:
  - { kind: government, text: "«Приходить к кому-то» строится с do и родительным: przychodzić do nas «приходить к нам». Дательного здесь нет." }
  - { kind: usage, text: "Совершенный вид — przyjść: przyszedł wczoraj «он пришёл вчера»." }
  - { kind: usage, text: "Оборот przychodzi mi do głowy значит «мне приходит в голову» — устроен как русский." }
  - { kind: usage, text: "Глагол употребляется и о неодушевлённом: ból przychodzi i odchodzi «боль приходит и уходит», listy przychodzą «письма приходят»." }
collocations:
  - { pl: "przychodzić do kogoś", ru: "приходить к кому-либо" }
  - { pl: "nie przychodź", ru: "не приходи" }
  - { pl: "przychodzi mi do głowy", ru: "мне приходит в голову" }
  - { pl: "przychodzić na czas", ru: "приходить вовремя" }
family:
  - { pl: "chodzić", ru: "ходить", relation: root }
  - { pl: "przyjść", ru: "прийти", relation: derived }
  - { pl: "przyjście", ru: "приход", relation: derived }
etymology: "Приставка przy- плюс chodzić «ходить», от праславянского *choditi — то же слово, что русское «приходить»."
memory: "przychodzić — «приходить», и главное отличие в управлении: «приходить к кому-то» строится с do и родительным — przychodzić do nas, do lekarza, — никакого дательного. Совершенный вид — przyjść. Глагол свободно идёт и о неодушевлённом: ból przychodzi i odchodzi «боль приходит и уходит», listy przychodzą «письма приходят». А оборот przychodzi mi do głowy устроен ровно как русский «приходит мне в голову»."
idioms:
  - { pl: "przychodzić do kogoś", ru: "приходить к кому-либо" }
  - { pl: "przychodzi mi do głowy", ru: "мне приходит в голову" }
  - { pl: "nie przychodź", ru: "не приходи" }
