# review
id: stroj
format: 2
lemma: "strój"
rank: 2045
pos: noun
pron: { cyr: "струй" }
senses:
  - id: outfit
    ru: "наряд, костюм (для случая)"
    examples:
      - pl: "Ładny strój."
        ru: "Красивый наряд."
        source: { kind: translated, id: 1112420 }
      - pl: "Jaki wspaniały strój!"
        ru: "Какой прекрасный наряд!"
        source: { kind: translated, id: 2657945 }
      - pl: "Ten strój mi odpowiada."
        ru: "Этот наряд мне подходит."
        source: { kind: translated, id: 2127403 }
      - pl: "Do twarzy ci w nowym stroju."
        ru: "Тебе идёт новый наряд."
        source: { kind: translated, id: 924596 }
      - pl: "Laura zwraca wielką uwagę na stroje."
        ru: "Лаура придаёт большое значение нарядам."
        source: { kind: translated, id: 945856 }
      - pl: "Twoje buty nie pasują do tego stroju."
        ru: "Твои туфли не подходят к этому наряду."
        source: { kind: translated, id: 2657948 }
  - id: special
    ru: "специальный костюм, форма"
    examples:
      - pl: "Przynieś swój strój kąpielowy."
        ru: "Принеси свой купальник."
        source: { kind: tatoeba, id: 9532608 }
      - pl: "Mój strój kąpielowy jest za ciasny."
        ru: "Мой купальник слишком тесный."
        source: { kind: translated, id: 4328124 }
notes:
  - { kind: false-friend, text: "Польское strój — это «наряд, костюм», а не русское «строй». Военный или шахматный «строй» по-польски szyk либо szereg." }
  - { kind: usage, text: "Отличие от ubranie: ubranie — одежда вообще, strój — наряд для определённого случая: strój kąpielowy «купальник», strój ludowy «народный костюм», strój wieczorowy «вечерний наряд»." }
  - { kind: usage, text: "Есть и музыкальное значение «строй, настройка инструмента» — от глагола stroić «настраивать»." }
collocations:
  - { pl: "strój kąpielowy", ru: "купальник" }
  - { pl: "strój ludowy", ru: "народный костюм" }
  - { pl: "strój sportowy", ru: "спортивная форма" }
etymology: "От глагола stroić «наряжать; настраивать» — того же корня, что русские «строить» и «настроить». Русское «наряд» и польское strój пришли к одному значению разными путями."
memory: "strój — это «наряд»: strój kąpielowy «купальник», strój ludowy «народный костюм». Русский «строй» тут ни при чём, он по-польски szyk."
idioms:
  - { pl: "strój kąpielowy", ru: "купальник" }
  - { pl: "strój ludowy", ru: "народный костюм" }
  - { pl: "strój wieczorowy", ru: "вечерний наряд" }
