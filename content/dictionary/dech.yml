# review
id: dech
format: 2
lemma: "dech"
rank: 2057
pos: noun
pron: { cyr: "дэх" }
senses:
  - id: breath
    ru: "дыхание, дух"
    examples:
      - pl: "Zapierasz mi dech w piersiach."
        ru: "У меня от тебя дух захватывает."
        source: { kind: translated, id: 13659498 }
      - pl: "Widok zaparł mu dech w piersiach."
        ru: "От этого вида у него захватило дух."
        source: { kind: translated, id: 744133 }
      - pl: "Nie mogli złapać tchu."
        ru: "Они не могли отдышаться."
        source: { kind: translated, id: 3743629 }
  - id: bated
    ru: "дыхание в оборотах: затаив дыхание, без сил"
    examples:
      - pl: "Wpatrywał się w krajobraz z zapartym tchem."
        ru: "Он всматривался в пейзаж, затаив дыхание."
        source: { kind: translated, id: 2585305 }
      - pl: "Przybiegł na dworzec bez tchu."
        ru: "Он прибежал на вокзал, запыхавшись."
        source: { kind: translated, id: 359856 }
notes:
  - { kind: government, text: "Склонение неправильное: именительный dech, но косвенные падежи от основы tch- — tchu (родительный), tchem (творительный). Гласная выпадает, d переходит в t." }
  - { kind: usage, text: "Слово живёт почти только в устойчивых оборотах: zapierać dech w piersiach «захватывать дух», z zapartym tchem «затаив дыхание», bez tchu «запыхавшись»." }
  - { kind: false-friend, text: "Обычное, нейтральное слово для дыхания — oddech. dech осталось в идиомах." }
  - { kind: usage, text: "Праславянский корень тот же, что в русском «дух»: и там, и тут «дух захватывает»." }
collocations:
  - { pl: "zapierać dech w piersiach", ru: "захватывать дух" }
  - { pl: "z zapartym tchem", ru: "затаив дыхание" }
  - { pl: "bez tchu", ru: "запыхавшись" }
etymology: "Праславянское *dъxъ; ср. русское «дух», «вздох», «дышать»."
memory: "dech — «дыхание» в идиомах: zapiera dech w piersiach «дух захватывает», z zapartym tchem «затаив дыхание». Склонение неправильное: dech, но tchu, tchem. Обычное слово — oddech."
