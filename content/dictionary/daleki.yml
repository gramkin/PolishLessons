etymology: "Праславянское *dalekъ, от *dalь «даль». Русское «далёкий» — то же слово, и вся семья совпадает: даль, далеко, дальний."
memory: "daleki — «далёкий», слово родное и прозрачное. Но сравнительная степень супплетивная: не «daleczejszy», а dalszy — и у неё выросло своё значение «дальнейший»: ciąg dalszy «продолжение», w dalszym ciągu «по-прежнему». Управление: daleki OD czegoś."
