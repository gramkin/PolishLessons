senses:
  - id: far
    ru: "далёкий, дальний"
    examples:
      - pl: "Kiedy jesteś na zjeździe dalekich krewnych, nie czujesz się jak w domu."
        ru: "Когда ты на встрече дальних родственников, дома себя не чувствуешь."
        source: { kind: translated, id: 8736957 }
      - pl: "Spotkaliśmy go w dalekim mieście."
        ru: "Мы встретили его в далёком городе."
        source: { kind: translated, id: 933367 }
      - pl: "Podróżowanie do dalekich krajów i rozmawianie z różnymi ludźmi wyrabia w ludziach mądrość."
        ru: "Поездки в дальние страны и разговоры с разными людьми делают людей мудрее."
        source: { kind: translated, id: 859645 }
  - id: far-from
    ru: "daleki OD czegoś — далёкий от чего-л."
    note: "Устойчивая конструкция с предлогом od."
    examples:
      - pl: "Był daleki od satysfakcji."
        ru: "Он был далёк от удовлетворения."
        source: { kind: translated, id: 722108 }
      - pl: "Ten program jest daleki od doskonałości."
        ru: "Эта программа далека от совершенства."
        source: { kind: translated, id: 713514 }
      - pl: "To, co powiedział, dalekie było od prawdy."
        ru: "То, что он сказал, было далеко от правды."
        source: { kind: translated, id: 551563 }
  - id: further
    ru: "dalszy — дальнейший, следующий"
    note: "Сравнительная степень получила собственное значение."
    examples:
      - pl: "Ciąg dalszy nastąpi."
        ru: "Продолжение следует."
        source: { kind: translated, id: 6308790 }
      - pl: "Dalsza dyskusja zaprowadzi nas donikąd."
        ru: "Дальнейшее обсуждение ни к чему нас не приведёт."
        source: { kind: translated, id: 363140 }
      - pl: "W dalszym ciągu mi się to nie podoba."
        ru: "Мне это по-прежнему не нравится."
        source: { kind: translated, id: 6162989 }
notes:
  - { kind: usage, text: "Сравнительная степень супплетивная: daleki — dalszy, а не «daleczejszy». И у неё выросло собственное значение «дальнейший, следующий»: dalszy ciąg «продолжение», w dalszym ciągu «по-прежнему, всё ещё»." }
  - { kind: government, text: "daleki OD czegoś — «далёкий от чего-то», с предлогом od и родительным: daleki od doskonałości «далёк от совершенства». Русский строит фразу так же." }
  - { kind: usage, text: "Наречие — daleko «далеко», и от него z daleka «издалека», trzymać się z daleka «держаться в стороне». Противоположность — bliski «близкий»." }
  - { kind: usage, text: "Daleki Wschód — «Дальний Восток», пишется с прописной. Превосходная степень najdalszy в живой речи почти не встречается." }
collocations:
