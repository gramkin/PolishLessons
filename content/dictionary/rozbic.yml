# review
id: rozbic
format: 2
lemma: "rozbić"
rank: 1964
pos: verb
pron: { cyr: "ро́збиць" }
senses:
  - id: smash
    ru: "разбить (стекло, чашку, нос)"
    examples:
      - pl: "Rozbił szklankę o podłogę."
        ru: "Он разбил стакан об пол."
        source: { kind: authored }
      - pl: "Rozbili szybę piłką."
        ru: "Они разбили стекло мячом."
        source: { kind: authored }
      - pl: "Rozbita filiżanka leżała w zlewie."
        ru: "Разбитая чашка лежала в раковине."
        source: { kind: authored }
  - id: defeat
    ru: "разбить, разгромить (противника)"
    examples:
      - pl: "Wojsko rozbiło nieprzyjaciela pod miastem."
        ru: "Войско разбило неприятеля под городом."
        source: { kind: authored }
      - pl: "Rozbito całą szajkę w jedną noc."
        ru: "Всю шайку разгромили за одну ночь."
        source: { kind: authored }
  - id: pitch
    ru: "rozbić namiot/obóz — разбить палатку, лагерь"
    examples:
      - pl: "Rozbili namiot nad jeziorem."
        ru: "Они разбили палатку у озера."
        source: { kind: authored }
      - pl: "Obóz rozbito na skraju lasu."
        ru: "Лагерь разбили на опушке леса."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Слово разбирается на русские части без остатка: roz- это «раз-», bić — «бить», и вместе выходит ровно «разбить». Приставка roz-/раз- работает сквозно — rozmowa «разговор», rozdzielić «разделить», rozwalić «развалить». Даже обороты совпадают: rozbić namiot — «разбить палатку», rozbić wroga — «разбить врага»." }
  - { kind: pronunciation, text: "ПРИЧАСТИЕ ПОДТВЕРЖДАЕТ ПРАВИЛО И ДОПОЛНЯЕТ ЕГО. Страдательное причастие здесь rozbity, а не «rozbijony»: односложные глаголы на -ić вроде bić, pić, myć берут окончание -ty, как и глаголы на -nąć (dorośnięty, zamknięty). Полная картина такая: -ać даёт -any, -ić и -yć даёт -ony, а bić, myć, pić и все -nąć дают -ty." }
  - { kind: government, text: "Разбивают ЧТО — винительный: rozbić szklankę, namiot, wroga. Обо что — o с винительным: rozbić coś o podłogę. Возвратное rozbić się значит «разбиться»: samolot się rozbił «самолёт разбился», rozbić się o skały «разбиться о скалы»." }
  - { kind: usage, text: "Вид совершенный, несовершенная пара — rozbijać: rozbijali obóz przez godzinę «они разбивали лагерь час», но rozbili go w kwadrans «разбили за четверть часа». Причастие rozbity живёт самостоятельно: rozbite szkło, rozbity nos, rozbita rodzina «распавшаяся семья»." }
collocations:
  - { pl: "rozbić namiot", ru: "разбить палатку" }
  - { pl: "rozbić się o skały", ru: "разбиться о скалы" }
  - { pl: "rozbita rodzina", ru: "распавшаяся семья" }
family:
  - { pl: "bić", ru: "бить", relation: root, id: bic }
  - { pl: "rozbijać", ru: "разбивать", relation: aspect }
  - { pl: "rozwalić", ru: "развалить", relation: derived, id: rozwalic }
etymology: "Приставка roz- плюс bić «бить» — те же две части, что в русском «раз-бить», и тот же общеславянский корень. Соответствие приставок roz-/раз- не знает исключений: rozmowa «разговор», rozstanie «расставание», rozbiór «разбор». Отсюда же rozbitek «потерпевший кораблекрушение»."
memory: "rozbić — «разбить», буквально по частям: roz- это «раз-», bić — «бить». Даже обороты те же: rozbić namiot «разбить палатку». Причастие запоминайте отдельно: rozbity, по образцу bity, myty, pity."
idioms:
  - { pl: "rozbić namiot", ru: "разбить палатку" }
  - { pl: "rozbita rodzina", ru: "распавшаяся семья" }
