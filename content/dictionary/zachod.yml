notes:
  - { kind: usage, text: "Три значения в одном слове: «запад» (сторона света), «закат» (zachód słońca) и «хлопоты, труд» (szkoda zachodu «не стоит хлопот»)." }
  - { kind: usage, text: "Zachód с прописной означает Запад как цивилизацию: między Wschodem a Zachodem «между Востоком и Западом». Пара — wschód «восток, восход»." }
  - { kind: government, text: "Направление — na zachód с винительным: idziemy na zachód «идём на запад». Местоположение — na zachodzie с предложным: na zachodzie Europy «на западе Европы»." }
  - { kind: usage, text: "ó в основе чередуется с o: zachód, но zachodu, zachodem, zachodzie." }
collocations:
  - { pl: "zachód słońca", ru: "закат солнца" }
  - { pl: "na zachodzie", ru: "на западе" }
  - { pl: "szkoda zachodu", ru: "не стоит хлопот" }
etymology: "От zachodzić «заходить» (za- + chodzić «ходить») — «место, где солнце заходит». Русское «запад» построено ровно так же, от «западать», то есть «заходить»: смысловая логика совпадает полностью."
memory: "zachód — и «запад», и «закат» (zachód słońca), и «хлопоты» (szkoda zachodu «не стоит хлопот»). Логика та же, что в русском: запад — там, где солнце западает. Пара — wschód «восток, восход». При склонении ó переходит в o: zachód, но zachodu."
idioms:
  - { pl: "zachód słońca", ru: "закат солнца" }
  - { pl: "szkoda zachodu", ru: "не стоит хлопот" }
  - { pl: "Dziki Zachód", ru: "Дикий Запад" }
  - { pl: "nie chwal dnia przed zachodem słońca", ru: "не хвали день до заката" }
formExamplesSkip:
