# review
id: sugerowac
format: 2
lemma: "sugerować"
rank: 1551
pos: verb
aspect: imperf
pron: { cyr: "сугэро́ваць" }
senses:
  - id: suggest
    ru: "предлагать, советовать"
    examples:
      - pl: "Sugeruję, byś zrobiła to dziś."
        ru: "Предлагаю тебе сделать это сегодня."
        source: { kind: translated, id: 11433016 }
      - pl: "Sugeruję, abyśmy skorzystali ze schodów."
        ru: "Предлагаю воспользоваться лестницей."
        source: { kind: translated, id: 1268600 }
      - pl: "Sugeruję ci nie mówić tak głośno."
        ru: "Советую тебе не говорить так громко."
        source: { kind: translated, id: 3416286 }
  - id: imply
    ru: "намекать, наводить на мысль"
    examples:
      - pl: "Cisza sugeruje zgodę."
        ru: "Молчание означает согласие."
        source: { kind: translated, id: 12232722 }
      - pl: "Co sugerują jego słowa?"
        ru: "На что намекают его слова?"
        source: { kind: translated, id: 739118 }
      - pl: "Wyniki autopsji sugerują, że zmarła z powodu problemów z sercem."
        ru: "Результаты вскрытия наводят на мысль, что она умерла из-за проблем с сердцем."
        source: { kind: translated, id: 12044197 }
notes:
  - { kind: usage, text: "Два значения: «предлагать, советовать» (Sugeruję, żebyś odpoczął) и «намекать, наводить на мысль» (Co sugerujesz? «На что ты намекаешь?»)." }
  - { kind: government, text: "После sugerować обычно идёт придаточное с żeby или aby: Sugeruję, żebyś odpoczął «Советую тебе отдохнуть»." }
  - { kind: usage, text: "Совершенный вид — zasugerować. Существительное sugestia значит «предложение, намёк»." }
  - { kind: false-friend, text: "Польское sugerować мягче русского «внушать»: это «подсказывать, намекать», без нажима. «Внушать» — wmawiać или narzucać." }
collocations:
  - { pl: "sugeruję, żeby", ru: "предлагаю, чтобы" }
  - { pl: "co sugerujesz?", ru: "на что ты намекаешь?" }
  - { pl: "sugerować rozwiązanie", ru: "предлагать решение" }
etymology: "Из латинского suggerere «подносить, подсказывать» (sub- «под» + gerere «нести») через европейские языки. Русские «суггестия» и «суггестивный» — из того же корня."
memory: "sugerować = и «предлагать, советовать», и «намекать»: Sugeruję, żebyś odpoczął «Советую отдохнуть», но Co sugerujesz? «На что ты намекаешь?». Совершенный вид — zasugerować, существительное — sugestia."
idioms:
  - { pl: "co sugerujesz?", ru: "на что ты намекаешь?" }
  - { pl: "sugeruję, żeby", ru: "предлагаю, чтобы" }
  - { pl: "cisza sugeruje zgodę", ru: "молчание — знак согласия" }
