notes:
  - { kind: false-friend, text: "Совпадение с русским «ключевой» почти полное: KLUCZOWA ROLA, KLUCZOWE PYTANIE. Разница в частоте: польское слово очень любят журналисты и менеджеры, оно встречается чаще русского и заменяет «главный», «решающий», «важнейший». Музыкальный «скрипичный ключ» — KLUCZ WIOLINOWY, прилагательного KLUCZOWY там нет." }
  - { kind: usage, text: "Степеней сравнения нет, хотя в разговоре встречается NAJBARDZIEJ KLUCZOWY. Все одиннадцать форм живые. Форма для мужчин-людей KLUCZOWI частая: KLUCZOWI GRACZE, KLUCZOWI ŚWIADKOWIE, KLUCZOWI PRACOWNICY — люди, от которых всё зависит." }
  - { kind: government, text: "В переносном значении прилагательное стоит перед существительным: KLUCZOWY MOMENT, KLUCZOWA ROLA. Ключевой для чего-то — KLUCZOWY DLA CZEGOŚ, DLA с родительным: KLUCZOWY DLA SPRAWY. Русское «ключевой в чём-то» тоже возможно: KLUCZOWY W TEJ SPRAWIE." }
  - { kind: pronunciation, text: "Читается «ключо́вы», три слога, ударение на предпоследнем. KLU даёт «клю», CZO — твёрдое «чо». Конечная Y — «ы». В сравнении с KLUCZ «ключ» ничего не меняется, кроме ударения." }
  - { kind: register, text: "Нейтральное слово с деловым оттенком. В бизнесе и политике оно на каждом шагу: KLUCZOWY KLIENT, KLUCZOWE STANOWISKO, KLUCZOWY PROJEKT. В быту чаще скажут NAJWAŻNIEJSZY, «самый важный»." }
