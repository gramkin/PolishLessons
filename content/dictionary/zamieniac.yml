# review
id: zamieniac
format: 2
lemma: "zamieniać"
rank: 3796
pos: verb
pron: { cyr: "замэ́няць" }
senses:
  - id: swap
    ru: "менять, обменивать (что-то на что-то)"
    examples:
      - pl: "Zamieniam stary telefon na nowy."
        ru: "Я меняю старый телефон на новый."
        source: { kind: authored }
      - pl: "Dzieci zamieniają się naklejkami."
        ru: "Дети меняются наклейками."
        source: { kind: authored }
      - pl: "Zamieniamy się miejscami?"
        ru: "Поменяемся местами?"
        source: { kind: authored }
  - id: turn-into
    ru: "превращать (ZAMIENIAĆ W)"
    examples:
      - pl: "Mróz zamienia wodę w lód."
        ru: "Мороз превращает воду в лёд."
        source: { kind: authored }
      - pl: "Czarownica zamienia księcia w żabę."
        ru: "Колдунья превращает принца в лягушку."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ZAMIENIAĆ — «менять, обменивать» и «превращать», а не «заменять» в смысле «замещать» (ZASTĘPOWAĆ). ZAMIENIAĆ COŚ NA COŚ — «менять одно на другое», ZAMIENIAĆ COŚ W COŚ — «превращать». ZAMIENIAĆ SIĘ — «меняться» друг с другом. ZAMIENIĆ KILKA SŁÓW — «перекинуться парой слов»." }
  - { kind: usage, text: "Несовершенный вид; совершенный — ZAMIENIĆ. Спряжение на -AM: ZAMIENIAM, ZAMIENIASZ, ZAMIENIAJĄ. Соседи по значению: ZMIENIAĆ «изменять», WYMIENIAĆ «обменивать, заменять (деталь)»." }
  - { kind: government, text: "Что на что — винительный и NA с винительным: ZAMIENIAĆ ZŁOTE NA EURO. Во что — W с винительным: ZAMIENIAĆ MARZENIA W RZECZYWISTOŚĆ. Чем меняться с кем — творительный и Z: ZAMIENIAĆ SIĘ Z KIMŚ KSIĄŻKAMI." }
  - { kind: pronunciation, text: "Читается «замэ́няць»: IE — «е», NIA — «ня». Ударение на предпоследнем слоге. ZAMIENIAM — «замэ́ням»." }
  - { kind: register, text: "Нейтральное бытовое слово. ZAMIENIĆ SIĘ W SŁUCH — книжное «обратиться в слух»." }
collocations:
  - { pl: "zamieniać coś na coś", ru: "менять одно на другое" }
  - { pl: "zamieniać się miejscami", ru: "меняться местами" }
  - { pl: "zamieniać marzenia w rzeczywistość", ru: "воплощать мечты в жизнь" }
family:
  - { pl: "zamienić", ru: "поменять, превратить", relation: aspect, id: zamienic }
  - { pl: "zamiana", ru: "обмен, замена", relation: derived, id: zamiana }
  - { pl: "zmieniać", ru: "изменять", relation: root, id: zmieniac }
etymology: "Приставка ZA- плюс MIENIAĆ, от праславянского *měna «обмен», того же корня, что русское «менять», «мена»."
memory: "Zamieniać — менять, превращать: zamieniam telefon na nowy; mróz zamienia wodę w lód. Na — на что, w — во что."
idioms:
  - { pl: "zamieniać się w słuch", ru: "обращаться в слух" }
