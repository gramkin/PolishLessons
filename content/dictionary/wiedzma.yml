notes:
  - { kind: false-friend, text: "Это прямое соответствие русской «ведьме», в отличие от CZAROWNICA, разобранной в отдельной карточке. WIEDŹMA и «ведьма» — одно и то же слово, от одного корня *věd- «ведать, знать»: та, которая знает. Поэтому для русского оно узнаётся сразу, и в этом его опасность: в польском WIEDŹMA заметно книжнее и реже, чем русская «ведьма». В сказках, в брани и в обиходной речи поляк скажет CZAROWNICA, а WIEDŹMA оставит для исторических текстов, фэнтези и торжественного тона. То есть слово понятнее, но употребляется уже." }
  - { kind: usage, text: "Разделение с CZAROWNICA работает по стилю, а не по смыслу, и запомнить его стоит парой. CZAROWNICA — обиходное слово: сказочный персонаж, историческая обвиняемая, бранное обращение. WIEDŹMA — слово книжное и слегка торжественное, частое в фэнтези и в переводах: WIEDŹMIN, герой известного цикла, образован именно от него, мужским суффиксом -IN. В брани WIEDŹMA тоже возможна и тогда звучит сильнее и старомоднее CZAROWNICY, примерно как русское «ведьма» рядом с «злой бабой»." }
  - { kind: pronunciation, text: "Читается «ве́дзьма», ударение на первом слоге из двух. Сочетание DŹ даёт «дзь», один мягкий звук, а не «д» плюс «з»: это та же буква, что в DZIEŃ и DZIĘKUJĘ. Поэтому слово звучит «ве-дзьма», и русское «ведьма» с твёрдым «д» и мягким «ь» ему не равно: в польском мягкость лежит на самом D. В дательном и местном падеже WIEDŹMIE буква M смягчается: «ве́дзьме»." }
  - { kind: government, text: "Женский род на -A, склонение правильное. Винительный на -Ę: SPOTKAŁ WIEDŹMĘ. При глаголе NAZWAĆ требуется творительный: NAZWAŁ JĄ WIEDŹMĄ «он назвал её ведьмой», и это общая польская модель для называния, та же, что в NAZWAĆ KOGOŚ CZAROWNICĄ. Родительный множественного WIEDŹM без окончания. При отрицании винительный уходит в родительный: NIE SPOTKAŁ WIEDŹMY." }
