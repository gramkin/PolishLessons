etymology: "От праславянского *vědьma, от корня *věd- «ведать, знать» — того же, что в польском WIEDZIEĆ «знать», WIEDZA «знание» и в русских «ведать», «ведьма», «весть». Буквально это «знающая, сведущая», и образ за словом тот же, что за русским: тайное знание, а не колдовское действие. Именно этим WIEDŹMA отличается от CZAROWNICA, названной от CZARY, то есть по действию — и две карточки стоит читать вместе, потому что в них видно, как один язык назвал одно существо двумя способами и развёл слова по стилю. От WIEDŹMA образован и WIEDŹMIN, мужская форма с суффиксом -IN, известная далеко за пределами польского."
memory: "Прямое соответствие русской «ведьме», от того же корня *věd- «ведать»: та, которая знает. Но в польском слово книжное и редкое — в сказках и в брани говорят czarownica, названная от czary, то есть по действию. Читается «ве́дзьма», где dź один мягкий звук. От него образован wiedźmin."
idioms:
