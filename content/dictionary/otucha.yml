# review
id: otucha
format: 2
lemma: "otucha"
rank: 2150
pos: noun
pron: { cyr: "оту́ха" }
senses:
  - id: comfort
    ru: "бодрость духа, утешение"
    examples:
      - pl: "Dobre wiadomości dodały mu otuchy."
        ru: "Добрые вести придали ему бодрости."
        source: { kind: translated, id: 983379 }
      - pl: "Twoje słowa dodały mu otuchy."
        ru: "Твои слова придали ему бодрости."
        source: { kind: translated, id: 1589315 }
      - pl: "Dodała mi otuchy, kiedy byłem przygnębiony."
        ru: "Она приободрила меня, когда я был подавлен."
        source: { kind: translated, id: 450217 }
  - id: cheer
    ru: "надежда, душевные силы"
    examples:
      - pl: "Nie tracił otuchy mimo wszystko."
        ru: "Он не терял бодрости духа несмотря ни на что."
        source: { kind: authored }
      - pl: "Szukał otuchy u przyjaciół."
        ru: "Он искал поддержки у друзей."
        source: { kind: authored }
notes:
  - { kind: government, text: "Живёт почти только в обороте dodać komuś otuchy «приободрить кого-л.» — дательный лица плюс РОДИТЕЛЬНЫЙ падеж самого слова." }
  - { kind: usage, text: "Все три корпусных примера — один и тот же оборот, что само по себе говорит об употреблении слова." }
  - { kind: usage, text: "Противоположный оборот — tracić otuchę «падать духом», уже с винительным падежом." }
  - { kind: false-friend, text: "Не «отуманить» и не «тухнуть». Слово связано со старым tuszyć «надеяться, ожидать доброго»." }
collocations:
  - { pl: "dodać otuchy", ru: "приободрить" }
  - { pl: "nie tracić otuchy", ru: "не падать духом" }
etymology: "Связано со старым tuszyć «надеяться, ожидать доброго»."
memory: "otucha живёт в одном обороте: dodać komuś otuchy «приободрить кого-л.», с родительным падежом. Обратный оборот — tracić otuchę «падать духом»."
