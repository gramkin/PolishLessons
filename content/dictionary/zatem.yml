etymology: "za + tem, старая форма от to — буквально «за тем». Русское «затем» собрано так же, но значение разошлось: там это «потом»."
memory: "zatem — «итак, следовательно», и это книжная связка: в разговоре скажут więc или czyli. Собрано оно как za + tem, буквально «за тем», ровно как русское «затем» — но значения разошлись: русское «затем» значит «потом», а польское zatem — «стало быть». Часто идёт в паре: a zatem."
