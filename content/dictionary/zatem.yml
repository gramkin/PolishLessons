# review
id: zatem
format: 2
lemma: "zatem"
rank: 821
pos: conj
pron: { cyr: "за́тэм" }
senses:
  - id: therefore
    ru: "итак, следовательно, стало быть"
    examples:
      - pl: "Czego zatem chcesz?"
        ru: "Чего же ты хочешь?"
        source: { kind: translated, id: 5952848 }
      - pl: "Zatem co to znaczy?"
        ru: "Так что же это значит?"
        source: { kind: translated, id: 7880432 }
      - pl: "Mogę zatem dostać klucz?"
        ru: "Могу я тогда получить ключ?"
        source: { kind: translated, id: 880331 }
  - id: conclusion
    ru: "в выводе: a zatem — итак"
    examples:
      - pl: "A zatem wracamy do punktu wyjścia."
        ru: "Итак, мы возвращаемся к исходной точке."
        source: { kind: authored }
      - pl: "Zatem sprawa jest zamknięta."
        ru: "Стало быть, дело закрыто."
        source: { kind: authored }
      - pl: "Zatem zgadzamy się co do jednego."
        ru: "Итак, в одном мы сходимся."
        source: { kind: authored }
  - id: register
    ru: "zatem книжнее, чем więc"
    note: "В разговоре берут więc или czyli."
    examples:
      - pl: "Zatem przejdźmy do rzeczy."
        ru: "Итак, перейдём к делу."
        source: { kind: authored }
      - pl: "Nie ma dowodów, zatem sprawa upada."
        ru: "Доказательств нет, следовательно, дело закрывается."
        source: { kind: authored }
      - pl: "Zatem co proponujesz?"
        ru: "Так что же ты предлагаешь?"
        source: { kind: authored }
  - id: question
    ru: "в вопросе: и что же тогда?"
    examples:
      - pl: "Co zatem zrobimy?"
        ru: "Что же мы тогда сделаем?"
        source: { kind: authored }
      - pl: "Kto zatem jest winny?"
        ru: "Кто же тогда виноват?"
        source: { kind: authored }
      - pl: "Gdzie zatem go szukać?"
        ru: "Где же его тогда искать?"
        source: { kind: authored }
notes:
  - { kind: usage, text: "Разводите три связки по регистру: więc — нейтральное «значит, итак», czyli — «то есть», а zatem заметно книжнее и живёт в рассуждении и в официальном тексте." }
  - { kind: usage, text: "Часто идёт в связке a zatem «итак, стало быть», особенно когда подводят итог." }
  - { kind: usage, text: "В вопросе добавляет оттенок «же»: Co zatem zrobimy? «Что же мы тогда сделаем?»." }
  - { kind: usage, text: "Слово разбирается как za + tem (старая форма от to), буквально «за тем» — та же логика, что в русском «затем», хотя значение разошлось: русское «затем» значит «потом»." }
