family:
  - { pl: "lamac", ru: "ломать", relation: root, id: lamac }
  - { pl: "zlamanie", ru: "перелом (кости)", relation: derived }
  - { pl: "przelamac", ru: "переломить, преодолеть", relation: root }
etymology: "От глагола PRZEŁAMAĆ, от приставки PRZE- и ŁAMAĆ «ломать», слова праславянского и того же, что русское «ломать». Русский «перелом» собран буквально из тех же частей, пере и лом, но дальше языки разошлись в применении: мы отдали слово костям, а поляк — повороту событий и ущелью, где река переломила горы. Для костей у него осталось ZŁAMANIE, с другой приставкой."
memory: "Не сломанная кость, а переломный момент: кость по-польски zlamanie. Второе значение географическое — ущелье, которое река пробила в горах, как Przelom Dunajca. Читается «пшэ́уом», где prz даёт «пш», а l со штрихом — «у». Самый частый оборот — na przelomie wiekow, «на рубеже веков», с местным падежом."
idioms:
  - { pl: "przełom wieków", ru: "рубеж веков" }
