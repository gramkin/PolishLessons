notes:
  - { kind: false-friend, text: "Русский «перелом» это прежде всего сломанная кость. Польское PRZEŁOM так почти никогда не значит: перелом ноги по-польски ZŁAMANIE NOGI. PRZEŁOM это переломный момент, поворот дела, как в PRZEŁOM W ŚLEDZTWIE, и ещё, в географии, ущелье, которое река пробила в горах: PRZEŁOM DUNAJCA. Слово собрано из тех же частей, что у нас, пере и лом, но языки отдали его разным вещам." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Основа не меняется, беглых гласных нет. Самое частое употребление — оборот NA PRZEŁOMIE с двумя датами: NA PRZEŁOMIE XIX I XX WIEKU значит «на рубеже девятнадцатого и двадцатого веков». Для сломанной кости держите наготове другое слово, ZŁAMANIE." }
  - { kind: government, text: "На рубеже — NA PRZEŁOMIE, местный падеж после NA. Перелом в чём-то — PRZEŁOM W CZYMŚ, тоже местный: PRZEŁOM W LECZENIU, PRZEŁOM W BADANIACH. Дойти до перелома — DOJŚĆ DO PRZEŁOMU, предлог DO с родительным. Обратите внимание, что оба главных оборота требуют местного падежа, а не винительного." }
  - { kind: pronunciation, text: "Читается «пшэ́уом», два слога, ударение на первом. Сочетание PRZ даёт «пш», и никакого «р» в нём не слышно. Буква Ł даёт «у», поэтому второй слог это «уом», без всякого «л». Для русского уха слово почти неузнаваемо на слух, хотя на письме родство с «переломом» видно сразу." }
  - { kind: register, text: "Слово газетное и книжное. В новостях это PRZEŁOM W NEGOCJACJACH и PRZEŁOM W LECZENIU. В истории — NA PRZEŁOMIE WIEKÓW, и оборот этот стоит в каждом учебнике. В географии PRZEŁOM значит ущелье, и PRZEŁOM DUNAJCA в Пенинах — одно из самых известных мест в Польше, куда ходят сплавом на плотах." }
collocations:
  - { pl: "przełom w leczeniu", ru: "прорыв в лечении" }
  - { pl: "na przełomie wieków", ru: "на рубеже веков" }
