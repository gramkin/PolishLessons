# review
id: przydzielic
format: 2
lemma: "przydzielić"
rank: 4842
pos: verb
pron: { cyr: "пшыдзе́лиць" }
senses:
  - id: assign
    ru: "выделить, назначить, распределить"
    examples:
      - pl: "Szef przydzielił mi nowe zadanie."
        ru: "Шеф поручил мне новое задание."
        source: { kind: authored }
      - pl: "Przydzielono nam pokój na drugim piętrze."
        ru: "Нам выделили комнату на втором этаже."
        source: { kind: authored }
      - pl: "Nauczyciel przydzielił uczniów do grup."
        ru: "Учитель распределил учеников по группам."
        source: { kind: authored }
  - id: allot
    ru: "выделить (средства, жильё, пособие)"
    examples:
      - pl: "Gmina przydzieliła rodzinie mieszkanie."
        ru: "Гмина выделила семье квартиру."
        source: { kind: authored }
      - pl: "Rząd przydzielił pieniądze na szpitale."
        ru: "Правительство выделило деньги на больницы."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "PRZYDZIELIĆ — не просто «поделить»: это «выделить, назначить» сверху — задание, комнату, деньги, человека: PRZYDZIELIĆ OBROŃCĘ, PRZYDZIELIĆ ZADANIE. PRZYDZIAŁ — «распределение, выделенная доля»: PRZYDZIAŁ MIESZKANIA." }
  - { kind: usage, text: "Пятьдесят три формы — подпись переходного глагола совершенного вида: страдательное PRZYDZIELONY и деепричастие PRZYDZIELIWSZY. Повелительное PRZYDZIEL. Видовой партнёр — PRZYDZIELAĆ. Слово официальное: в учреждениях, армии, школе." }
  - { kind: government, text: "Что кому — винительный и дательный: PRZYDZIELIĆ KOMUŚ ZADANIE. Кого куда — DO с родительным: PRZYDZIELIĆ DO GRUPY, DO JEDNOSTKI. На что — NA с винительным: PRZYDZIELIĆ ŚRODKI NA REMONT." }
  - { kind: pronunciation, text: "Читается «пшыдзе́лиць», четыре слога, ударение на предпоследнем. PRZY — «пшы», DZIE — мягкое «дзе», LI — «ли». Конечное Ć — «ць»." }
  - { kind: register, text: "Канцелярское и деловое слово. В быту о работе дома говорят PODZIELIĆ SIĘ OBOWIĄZKAMI. PRZYDZIAŁOWY — «выдаваемый по норме»: PRZYDZIAŁOWE MLEKO, советский оттенок." }
collocations:
  - { pl: "przydzielić zadanie", ru: "поручить задание" }
  - { pl: "przydzielić mieszkanie", ru: "выделить квартиру" }
  - { pl: "przydzielić do grupy", ru: "распределить в группу" }
family:
  - { pl: "przydzielać", ru: "выделять, распределять", relation: aspect }
  - { pl: "dzielić", ru: "делить", relation: root, id: dzielic }
  - { pl: "przydział", ru: "распределение, доля", relation: derived }
etymology: "Приставка PRZY- «при-» плюс DZIELIĆ «делить», праславянское *děliti, то же, что русское «делить». Буквально «приделить», выделить кому-то его часть."
memory: "Przydzielić — выделить, назначить: przydzielić zadanie, pokój, pieniądze. Do grupy — распределить в группу. Przydział — распределение. Читается «пшыдзе́лиць»."
idioms:
  - { pl: "przydzielić komuś rolę", ru: "отвести кому-то роль" }
