notes:
  - { kind: false-friend, text: "КОРЕНЬ ТОТ ЖЕ, ЧТО В РУССКОМ «ПЕРСТЕНЬ» — И ОБА ОТ «ПАЛЬЦА». Pierścień восходит к palec, как русский «перстень» к «персту». Разошлось употребление: по-русски «перстень» звучит старинно и означает массивное кольцо с камнем, а польское pierścionek — обычное повседневное слово для кольца-украшения. Обручальное кольцо супругов — obrączka, а техническое кольцо — pierścień." }
  - { kind: pronunciation, text: "БЕГЛОЕ E ВЫПАДАЕТ ВО ВСЕХ КОСВЕННЫХ ПАДЕЖАХ: PIERŚCIONEK, НО PIERŚCIONKA. Так ведёт себя весь суффикс -ek: dodatek — dodatku, domek — domku, worek — worka. Начало слова мягкое: pier-ście- звучит как «перщче-», с ś как щ и ci как ць." }
  - { kind: usage, text: "Три слова о кольцах стоит развести сразу. Pierścionek — кольцо-украшение, обычно женское; obrączka — гладкое обручальное кольцо, которое носят супруги; pierścień — кольцо вообще, в том числе техническое и литературное. Pierścionek zaręczynowy дарят при помолвке, obrączki меняют на свадьбе." }
collocations:
  - { pl: "pierścionek zaręczynowy", ru: "помолвочное кольцо" }
  - { pl: "pierścionek z brylantem", ru: "кольцо с бриллиантом" }
  - { pl: "nosić pierścionek", ru: "носить кольцо" }
family:
  - { pl: "pierścień", ru: "кольцо", relation: root }
  - { pl: "obrączka", ru: "обручальное кольцо", relation: derived }
  - { pl: "palec", ru: "палец", relation: root, id: palec }
etymology: "Уменьшительное от pierścień, а то — от того же корня, что palec «палец»: кольцо названо по месту, где его носят. Русский «перстень» сделан точно так же от «перста». Праславянское *prьstenь, от *prьstъ «палец». Отсюда pierścionek, pierścieniowy и obrączka."
memory: "pierścionek — «колечко», от pierścień, а тот от palec «палец», в точности как русский «перстень» от «перста». Беглое e выпадает: pierścionka. И не путать с obrączka — так называют свадебное кольцо супругов."
idioms:
