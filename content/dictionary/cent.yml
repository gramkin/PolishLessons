notes:
  - { kind: usage, text: "РОДИТЕЛЬНЫЙ ЕДИНСТВЕННОГО — CENTA, С ОКОНЧАНИЕМ -A. Это полезный контраст к soku и aresztu из прошлых карточек: у неодушевлённых мужского рода выбор между -a и -u не случаен хотя бы отчасти. Считаемые предметы и единицы — монеты, меры, названия приборов — склоняются к -a, а вещества и отвлечённые понятия к -u. Ani centa, ale ani soku." }
  - { kind: pronunciation, text: "Предложный падеж — CENCIE, с переходом t в c, как в procent — procencie, areszt — areszcie, student — studencie. Чередование настолько regularne, что по форме предложного можно угадать основу, и наоборот." }
  - { kind: usage, text: "После числительных от пяти форма родительного множественного — CENTÓW: pięć centów, dziewięćdziesiąt centów. Этим cent отличается от procent, где родительный множественного нулевой: pięć procent. Два похожих заимствования, две разные модели, и запоминать их приходится порознь." }
collocations:
  - { pl: "ani centa", ru: "ни цента" }
  - { pl: "co do centa", ru: "до последнего цента" }
  - { pl: "pięćdziesiąt centów", ru: "пятьдесят центов" }
family:
  - { pl: "centowy", ru: "центовый", relation: derived }
  - { pl: "grosz", ru: "грош", relation: root }
  - { pl: "dolar", ru: "доллар", relation: root, id: dolar }
etymology: "Из латинского centum «сто», через английское cent — сотая часть доллара. Русский «цент» пришёл той же дорогой и в том же значении. Из того же латинского корня польские procent, centymetr, stulecie по кальке, и наши «процент», «сантиметр», «центнер»."
memory: "Родительный — CENTA, с -a, в отличие от soku и aresztu с -u: считаемые единицы берут -a. А предложный мягкий: o cencie, как o procencie."
idioms:
  - { pl: "co do centa", ru: "до последнего цента" }
  - { pl: "nie wart ani centa", ru: "гроша ломаного не стоит" }
formExamplesSkip:
