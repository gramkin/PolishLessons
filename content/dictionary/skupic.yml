# review
id: skupic
format: 2
lemma: "skupić"
rank: 1274
pos: verb
aspect: perf
pron: { cyr: "ску́пиць" }
senses:
  - id: concentrate
    ru: "skupić się — сосредоточиться"
    examples:
      - pl: "Muszę się skupić."
        ru: "Я должен сосредоточиться."
        source: { kind: tatoeba, id: 3794010 }
      - pl: "Nie mogę się skupić."
        ru: "Я не могу сосредоточиться."
        source: { kind: translated, id: 13561597 }
      - pl: "Nie mogę się skupić przez ten hałas."
        ru: "Я не могу сосредоточиться из-за этого шума."
        source: { kind: translated, id: 5536944 }
  - id: focus-on
    ru: "skupić się na czymś — сосредоточиться на чём-то"
    examples:
      - pl: "Skup się."
        ru: "Сосредоточься."
        source: { kind: translated, id: 5652479 }
      - pl: "Skup się na drodze."
        ru: "Следи за дорогой."
        source: { kind: translated, id: 7351904 }
      - pl: "Powinieneś skupić się na własnej pracy."
        ru: "Тебе следует сосредоточиться на своей работе."
        source: { kind: translated, id: 5105327 }
  - id: gather
    ru: "собрать, сосредоточить (внимание, взгляд)"
    examples:
      - pl: "Prestidigitator skupił zainteresowanie maluchów."
        ru: "Фокусник привлёк внимание малышей."
        source: { kind: translated, id: 999363 }
      - pl: "Uwaga skupiła się na śpiewaku."
        ru: "Внимание сосредоточилось на певце."
        source: { kind: translated, id: 355865 }
      - pl: "Nauczycielka skupiła wzrok na mnie, bo podejrzewała mnie o ściąganie na egzaminie."
        ru: "Учительница устремила взгляд на меня, потому что подозревала меня в списывании."
        source: { kind: translated, id: 2240484 }
notes:
  - { kind: government, text: "skupić się na czymś «сосредоточиться на чём-то» — предлог na с предложным падежом: skupić się na pracy, na drodze." }
  - { kind: usage, text: "Почти всегда возвратное: skupić się. Без się значит «собрать, сосредоточить» что-то внешнее: skupić uwagę «привлечь внимание»." }
  - { kind: usage, text: "Повелительное Skup się! «Сосредоточься!» — очень частая форма в живой речи." }
  - { kind: usage, text: "Существительное skupienie значит «сосредоточенность»: w skupieniu «сосредоточенно»." }
collocations:
  - { pl: "skupić się na czymś", ru: "сосредоточиться на чём-то" }
  - { pl: "skup się", ru: "сосредоточься" }
  - { pl: "skupić uwagę", ru: "привлечь внимание" }
etymology: "Приставка s- и kupić в исходном значении «собирать в кучу», от kupa «куча». Значение «покупать» у kupić развилось отдельно, а здесь сохранилось старое «собирать вместе»."
memory: "skupić się na czymś — «сосредоточиться на чём-то», с предлогом na и предложным падежом. Почти всегда с się. Повелительное Skup się! А существительное skupienie значит «сосредоточенность»."
idioms:
  - { pl: "skup się", ru: "сосредоточься" }
  - { pl: "skupić się na czymś", ru: "сосредоточиться на чём-то" }
  - { pl: "w skupieniu", ru: "сосредоточенно" }
formExamplesSkip:
  - { form: "skupiwszy", reason: "книжное деепричастие прошедшего времени: в корпусе нет примеров" }
