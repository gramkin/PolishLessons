    pl: "Nauczycielka skupiła wzrok na mnie, bo podejrzewała mnie o ściąganie na egzaminie."
    ru: "Учительница устремила взгляд на меня, потому что подозревала меня в списывании."
    source: { kind: translated, id: 2240484 }
  - form: "skupiły"
    pl: "Media skupiły się na kongresie."
    ru: "СМИ сосредоточились на съезде."
    source: { kind: translated, id: 2265104 }
  - form: "skupiły"
    pl: "Dzieci skupiły wzrok na tablicy."
    ru: "Дети сосредоточили взгляд на доске."
    source: { kind: authored }
  - form: "skupiły"
    pl: "Firmy skupiły siły na jednym projekcie."
    ru: "Фирмы сосредоточили силы на одном проекте."
    source: { kind: authored }
  - form: "skupisz"
    pl: "Jeśli skupisz całą swoją siłę na nauce angielskiego, opanujesz ten język."
    ru: "Если ты сосредоточишь все свои силы на изучении английского, ты овладеешь этим языком."
    source: { kind: translated, id: 3898835 }
  - form: "skupisz"
    pl: "Skupisz się wreszcie?"
    ru: "Ты наконец сосредоточишься?"
    source: { kind: authored }
  - form: "skupisz"
    pl: "Jeśli się skupisz, zrozumiesz."
    ru: "Если сосредоточишься, поймёшь."
    source: { kind: authored }
