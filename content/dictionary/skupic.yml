    pl: "Skup się na jednej rzeczy i naucz się jej najlepiej."
    ru: "Сосредоточься на одном деле и научись ему лучше всех."
    source: { kind: translated, id: 362464 }
  - form: "skupić"
    pl: "Muszę się skupić."
