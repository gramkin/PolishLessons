  - form: "skupił"
    pl: "Tom skupił się."
    ru: "Том сосредоточился."
    source: { kind: translated, id: 10596427 }
  - form: "skupił"
    pl: "Skupił się na studiach."
    ru: "Он сосредоточился на учёбе."
    source: { kind: translated, id: 351991 }
  - form: "skupił"
    pl: "Prestidigitator skupił zainteresowanie maluchów."
    ru: "Фокусник привлёк внимание малышей."
    source: { kind: translated, id: 999363 }
  - form: "skupił"
    pl: "Wykład skupił się na kilku autorach, których dzieła dotyczą ekologii."
    ru: "Лекция сосредоточилась на нескольких авторах, чьи работы касаются экологии."
    source: { kind: translated, id: 2260490 }
  - form: "skupiła"
    pl: "Skupiła się na swojej pracy."
    ru: "Она сосредоточилась на своей работе."
    source: { kind: translated, id: 3440939 }
  - form: "skupiła"
    pl: "Uwaga skupiła się na śpiewaku."
    ru: "Внимание сосредоточилось на певце."
    source: { kind: translated, id: 355865 }
