# review
id: piekny
format: 2
lemma: "piękny"
rank: 310
pos: adj
pron: { cyr: "пе́нкны" }
senses:
  - id: beautiful
    ru: "красивый, прекрасный"
    examples:
      - pl: "Jesteś piękna."
        ru: "Ты красивая."
        source: { kind: tatoeba, id: 633709 }
      - pl: "Piękny samochód."
        ru: "Красивая машина."
        source: { kind: tatoeba, id: 10768436 }
      - pl: "Masz piękne włosy."
        ru: "У тебя красивые волосы."
        source: { kind: tatoeba, id: 3656147 }
  - id: wonderful
    ru: "прекрасный (о жизни, погоде, впечатлении)"
    examples:
      - pl: "Życie jest piękne."
        ru: "Жизнь прекрасна."
        source: { kind: tatoeba, id: 350044 }
      - pl: "Jaka ty piękna!"
        ru: "Какая ты красивая!"
        source: { kind: tatoeba, id: 13783081 }
      - pl: "Jesteście piękni."
        ru: "Вы красивые."
        source: { kind: tatoeba, id: 5491778 }
notes:
  - { kind: usage, text: "piękny сильнее, чем ładny «милый, хорошенький»: ładna sukienka «симпатичное платье», piękna sukienka «прекрасное платье»." }
  - { kind: usage, text: "Степени: piękny — piękniejszy — najpiękniejszy." }
  - { kind: usage, text: "płeć piękna — «прекрасный пол»; sztuki piękne — «изящные искусства»." }
collocations:
  - { pl: "piękna kobieta", ru: "красивая женщина" }
  - { pl: "piękny dzień", ru: "прекрасный день" }
  - { pl: "piękne włosy", ru: "красивые волосы" }
  - { pl: "sztuki piękne", ru: "изящные искусства" }
etymology: "Праславянское *pěknъ «красивый»; в русском сохранилось родственное «пегий» по корню, но обычное соответствие — «прекрасный»."
memory: "piękny — «красивый, прекрасный», сильнее чем ładny «хорошенький». Степени правильные: piękny — piękniejszy — najpiękniejszy."
idioms:
  - { pl: "płeć piękna", ru: "прекрасный пол" }
  - { pl: "sztuki piękne", ru: "изящные искусства" }
  - { pl: "piękny jak sen", ru: "прекрасный как сон" }
