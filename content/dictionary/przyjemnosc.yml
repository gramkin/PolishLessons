notes:
  - { kind: usage, text: "z przyjemnością — «с удовольствием», самый частый ответ на просьбу или приглашение. Творительный падеж, как и в русском." }
  - { kind: usage, text: "Z kim mam przyjemność? — вежливое «С кем имею честь?» при знакомстве. Ответная формула — Cała przyjemność po mojej stronie «Мне это только в радость»." }
  - { kind: usage, text: "Прилагательное — przyjemny «приятный», наречие — przyjemnie «приятно»: Było bardzo przyjemnie." }
  - { kind: usage, text: "Разговорное średnia przyjemność значит «удовольствие ниже среднего», то есть «так себе»." }
collocations:
  - { pl: "z przyjemnością", ru: "с удовольствием" }
  - { pl: "sprawiać przyjemność", ru: "доставлять удовольствие" }
  - { pl: "cała przyjemność po mojej stronie", ru: "мне было очень приятно (ответ на благодарность или «приятно познакомиться»)" }
  - { pl: "dla przyjemności", ru: "для удовольствия" }
family:
  - { pl: "przyjemny", ru: "приятный", relation: root }
  - { pl: "przyjemnie", ru: "приятно", relation: derived }
etymology: "От przyjemny «приятный», от przyjąć «принять» — буквально «то, что принимается охотно». Русское «приятный» того же корня, от «приять»."
memory: "przyjemność — «удовольствие». Главное запомнить формулу z przyjemnością «с удовольствием» и вежливое Z kim mam przyjemność? «С кем имею честь?». Прилагательное przyjemny и наречие przyjemnie родственны русскому «приятный»."
idioms:
  - { pl: "z przyjemnością", ru: "с удовольствием" }
  - { pl: "cała przyjemność po mojej stronie", ru: "мне было очень приятно (ответ на благодарность или «приятно познакомиться»)" }
  - { pl: "średnia przyjemność", ru: "удовольствие так себе" }
