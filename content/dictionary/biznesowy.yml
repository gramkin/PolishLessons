etymology: "От BIZNES, из английского business, «занятость, дело», от busy «занятой». Слово вошло в польский после 1989 года, вместе с рыночной экономикой, и сразу получило польскую запись и суффикс -OWY. Русский взял тот же англицизм, но предпочёл приставочную модель: «бизнес-план», «бизнес-класс»."
memory: "Biznesowy — деловой, бизнес-: spotkanie biznesowe, klasa biznesowa, partner biznesowy. Деловитый — rzeczowy. Читается «бизнэсо́вы»."
idioms:
