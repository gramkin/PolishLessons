notes:
  - { kind: false-friend, text: "Русскому «деловой» по-польски соответствуют два слова. BIZNESOWY — о бизнесе в современном смысле: SPOTKANIE BIZNESOWE, PLAN BIZNESOWY, KLASA BIZNESOWA. RZECZOWY — о деловитости, о том, что «по существу»: RZECZOWA ROZMOWA. А «деловой человек» в смысле «предприимчивый» — PRZEDSIĘBIORCZY, и BIZNESOWY здесь не подойдёт." }
  - { kind: usage, text: "Относительное прилагательное, степеней сравнения нет. Все одиннадцать форм живые. Форма для мужчин-людей BIZNESOWI встречается: PARTNERZY BIZNESOWI, KONTRAHENCI BIZNESOWI — деловые партнёры. Русское «бизнес-» с дефисом польский почти всегда передаёт этим прилагательным." }
  - { kind: government, text: "Обычно стоит после существительного: SPOTKANIE BIZNESOWE, PARTNER BIZNESOWY, PLAN BIZNESOWY. Перед существительным — реже, в разговоре: BIZNESOWY LUNCH. Падежных требований нет." }
  - { kind: pronunciation, text: "Читается «бизнэсо́вы», четыре слога, ударение на предпоследнем. BI — мягкое «би», NE — твёрдое «нэ», как в BIZNES «би́знэс». S перед гласной глухое «с»." }
  - { kind: register, text: "Слово современное, из языка офисов и рекламы, появилось после девяностых. Старшее поколение предпочитает HANDLOWY или SŁUŻBOWY: PODRÓŻ SŁUŻBOWA, «командировка». В молодёжной речи часто вместо него просто английское BUSINESS: BUSINESS LUNCH." }
