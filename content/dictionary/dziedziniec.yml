# review
id: dziedziniec
format: 2
lemma: "dziedziniec"
rank: 2105
pos: noun
pron: { cyr: "дзедзи́нец" }
senses:
  - id: courtyard
    ru: "двор (внутренний), дворик"
    examples:
      - pl: "Zamiotłem dziedziniec."
        ru: "Я подмёл двор."
        source: { kind: translated, id: 12060424 }
      - pl: "Na dziedzińcu stał kram."
        ru: "Во дворе стоял ларёк."
        source: { kind: translated, id: 3744846 }
      - pl: "Dziedziniec zamku jest ogromny."
        ru: "Двор замка огромный."
        source: { kind: authored }
  - id: yard
    ru: "внутренний двор (здания, школы)"
    examples:
      - pl: "Dzieci bawią się na dziedzińcu."
        ru: "Дети играют во дворе."
        source: { kind: authored }
      - pl: "Wjechali na dziedziniec."
        ru: "Они въехали во двор."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Именно внутренний двор — замка, костёла, университета. Обычный двор у дома это podwórko." }
  - { kind: false-friend, text: "Корень тот же, что у dziedzic «наследник» и dziedzina «область, вотчина»: изначально «отчий, дедовский участок»." }
  - { kind: government, text: "Мужской неодушевлённый; предложный падеж — na dziedzińcu, с чередованием n/ń." }
  - { kind: usage, text: "Ср. русское «детинец» — исторически то же слово, о внутренней части крепости." }
collocations:
  - { pl: "dziedziniec zamku", ru: "двор замка" }
  - { pl: "na dziedzińcu", ru: "во дворе" }
etymology: "От dziedzina «вотчина, область», от dziad «дед» — тот же корень, что у dziedzic «наследник»; ср. русское «детинец»."
memory: "dziedziniec — внутренний двор замка или костёла. Двор у жилого дома — podwórko. Корень тот же, что у dziedzic «наследник», и у русского «детинец»."
