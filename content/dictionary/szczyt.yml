# review
id: szczyt
format: 2
lemma: "szczyt"
rank: 1757
pos: noun
pron: { cyr: "шчыт" }
senses:
  - id: peak
    ru: "вершина, пик (горы)"
    examples:
      - pl: "Rozbili namiot na szczycie góry."
        ru: "Они разбили палатку на вершине горы."
        source: { kind: tatoeba, id: 498320 }
      - pl: "Dotarliśmy na szczyt góry."
        ru: "Мы добрались до вершины горы."
        source: { kind: translated, id: 525209 }
      - pl: "Wspięliśmy się na sam szczyt."
        ru: "Мы взобрались на самую вершину."
        source: { kind: tatoeba, id: 6305501 }
  - id: top-max
    ru: "верх, предел, высшая точка"
    examples:
      - pl: "To jest szczyt luksusu."
        ru: "Это верх роскоши."
        source: { kind: translated, id: 7727847 }
      - pl: "Aktor zmarł u szczytu swojej popularności."
        ru: "Актёр умер на пике своей популярности."
        source: { kind: translated, id: 3872004 }
  - id: rush-head
    ru: "час пик; во главе стола"
    examples:
      - pl: "Jest godzina szczytu."
        ru: "Сейчас час пик."
        source: { kind: tatoeba, id: 8493116 }
      - pl: "Zajął miejsce u szczytu stołu."
        ru: "Он занял место во главе стола."
        source: { kind: translated, id: 657374 }
notes:
  - { kind: usage, text: "godzina szczytu — «час пик», w godzinach szczytu «в часы пик»." }
  - { kind: usage, text: "u szczytu stołu — «во главе стола», буквально «у вершины стола»." }
  - { kind: usage, text: "szczyt значит и «саммит»: szczyt NATO «саммит НАТО»." }
  - { kind: false-friend, text: "szczyt wszystkiego — это не «вершина всего», а возмущённое «предел всему», «это уже слишком»." }
collocations:
  - { pl: "szczyt góry", ru: "вершина горы" }
  - { pl: "godzina szczytu", ru: "час пик" }
  - { pl: "u szczytu stołu", ru: "во главе стола" }
family:
  - { pl: "szczytowy", ru: "вершинный, пиковый", relation: root }
  - { pl: "góra", ru: "гора", relation: root, id: gora }
etymology: "Праславянское *ščitъ — то же слово, что русское «щит»; значение сместилось от «щит» к «конёк крыши» и дальше к «вершина»."
memory: "szczyt — «вершина, пик»: szczyt góry. Но ещё и «час пик» (godzina szczytu), «саммит» (szczyt NATO) и «во главе стола» (u szczytu stołu). Родственно русскому «щит»."
idioms:
  - { pl: "godzina szczytu", ru: "час пик" }
  - { pl: "szczyt wszystkiego", ru: "предел всему" }
  - { pl: "u szczytu stołu", ru: "во главе стола" }
formExamplesSkip:
  - { form: "szczycie", cell: "Звательный", reason: "звательный падеж: для неодушевлённого существительного он практически не употребляется" }
