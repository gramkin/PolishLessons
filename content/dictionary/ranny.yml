# review
id: ranny
format: 2
lemma: "ranny"
rank: 1249
pos: adj
pron: { cyr: "ра́нны" }
senses:
  - id: wounded
    ru: "раненый (от rana «рана»)"
    examples:
      - pl: "Jest ranny."
        ru: "Он ранен."
        source: { kind: translated, id: 12061798 }
      - pl: "Została ranna w wypadku."
        ru: "Она была ранена в аварии."
        source: { kind: translated, id: 884790 }
      - pl: "Mamy nadzieję, że nikt nie zostanie ranny."
        ru: "Надеемся, что никто не будет ранен."
        source: { kind: tatoeba, id: 10169054 }
  - id: wounded-noun
    ru: "раненый как существительное: ranni «раненые»"
    examples:
      - pl: "Rannego zaniesiono do szpitala."
        ru: "Раненого отнесли в больницу."
        source: { kind: translated, id: 704096 }
      - pl: "Ranni przybyli ambulansem."
        ru: "Раненые прибыли на скорой."
        source: { kind: translated, id: 10599130 }
      - pl: "W wypadku rannych zostało 10 osób."
        ru: "В аварии было ранено десять человек."
        source: { kind: translated, id: 968951 }
  - id: morning
    ru: "утренний, ранний (от rano «утро»)"
    examples:
      - pl: "Pracuję na rannej zmianie."
        ru: "Я работаю в утреннюю смену."
        source: { kind: tatoeba, id: 3461132 }
      - pl: "Jestem rannym ptaszkiem."
        ru: "Я ранняя пташка."
        source: { kind: tatoeba, id: 8706254 }
      - pl: "On ćwiczy ranne wstawanie."
        ru: "Он приучает себя рано вставать."
        source: { kind: translated, id: 919792 }
notes:
  - { kind: usage, text: "Форма ranniejsi оставлена без примеров: ranny не градуируется ни в значении «раненый», ни в значении «утренний» — нельзя быть «более раненым» или «более утренним»." }
  - { kind: false-friend, text: "Два разных слова слились в одно: ranny «раненый» (от rana «рана») и ranny «утренний» (от rano «утро»). Различает только контекст: ranny żołnierz «раненый солдат», но ranna zmiana «утренняя смена»." }
  - { kind: usage, text: "В значении «раненый» прилагательное легко становится существительным: ranni «раненые», rannych «раненых», rannego «раненого»." }
  - { kind: usage, text: "Ranny ptaszek — «ранняя пташка», о том, кто рано встаёт. Здесь ranny значит именно «утренний»." }
  - { kind: government, text: "Оборот zostać rannym «получить ранение» ставит прилагательное в творительный, но в живой речи обычнее именительный: Została ranna w wypadku." }
collocations:
  - { pl: "ranny żołnierz", ru: "раненый солдат" }
  - { pl: "ranny ptaszek", ru: "ранняя пташка" }
  - { pl: "ranna zmiana", ru: "утренняя смена" }
  - { pl: "ciężko ranny", ru: "тяжело раненный" }
etymology: "Два омонима в одной форме: одно слово от rana «рана», другое от rano «утро». Русские «раненый» и «ранний» тоже близки по звучанию, но в русском они не совпали полностью."
memory: "ranny — ловушка: это и «раненый» (от rana), и «утренний» (от rano). Ranny żołnierz «раненый солдат», но ranna zmiana «утренняя смена» и ranny ptaszek «ранняя пташка». Решает только контекст."
idioms:
  - { pl: "ranny ptaszek", ru: "ранняя пташка" }
  - { pl: "ciężko ranny", ru: "тяжело раненный" }
  - { pl: "ranna zmiana", ru: "утренняя смена" }
