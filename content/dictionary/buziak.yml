# review
id: buziak
format: 2
lemma: "buziak"
rank: 4718
pos: noun
pron: { cyr: "бу́зяк" }
senses:
  - id: kiss
    ru: "поцелуй, чмок"
    examples:
      - pl: "Dała mi buziaka na pożegnanie."
        ru: "Она чмокнула меня на прощание."
        source: { kind: authored }
      - pl: "Za każdą piątkę dostaje buziaka od mamy."
        ru: "За каждую пятёрку он получает поцелуй от мамы."
        source: { kind: authored }
      - pl: "Buziak w czoło uspokoił dziecko."
        ru: "Поцелуй в лоб успокоил ребёнка."
        source: { kind: authored }
  - id: sign-off
    ru: "целую (в конце письма, сообщения)"
    examples:
      - pl: "Buziaki, do jutra!"
        ru: "Целую, до завтра!"
        source: { kind: authored }
      - pl: "Kończę już list. Buziaki!"
        ru: "Заканчиваю письмо. Целую!"
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "BUZIAK — «чмок, поцелуйчик», от BUZIA «мордашка, ротик». С русским «бузить» ничего общего. Обычное нейтральное слово — POCAŁUNEK, а BUZIAK — ласковое и разговорное. В сообщениях BUZIAKI! — «целую!»." }
  - { kind: usage, text: "Десять форм, мужской род. В винительном единственного форма как у одушевлённых: DAĆ BUZIAKA, а не DAĆ BUZIAK, как и DAĆ CAŁUSA. Во множественном — BUZIAKI, как у неодушевлённых." }
  - { kind: government, text: "Чмокнуть кого-то — DAĆ KOMUŚ BUZIAKA: дательный для того, кого целуют, и форма родительного для поцелуя. Поцелуй в щёку — BUZIAK W POLICZEK, W с винительным." }
  - { kind: pronunciation, text: "Читается «бу́зяк», два слога, ударение на первом. ZI перед гласным — мягкое «зь»: ZIA — «зя», как в BUZIA «бу́зя»." }
  - { kind: register, text: "Разговорное и ласковое слово: семья, дети, друзья, SMS. В официальном письме не годится. Синоним того же уровня — CAŁUS." }
collocations:
  - { pl: "dać buziaka", ru: "чмокнуть, поцеловать" }
  - { pl: "buziak w policzek", ru: "поцелуй в щёку" }
  - { pl: "buziaki dla wszystkich", ru: "целую всех" }
family:
  - { pl: "buzia", ru: "мордашка, ротик", relation: root, id: buzia }
  - { pl: "buźka", ru: "личико; смайлик", relation: root }
  - { pl: "buziaczek", ru: "поцелуйчик", relation: derived }
etymology: "От BUZIA «мордашка, ротик» — слова из детской речи. Суффикс -AK делает из рта «действие ртом»: поцелуй. BUŹKA, ещё одно уменьшительное от BUZIA, в интернете значит «смайлик»."
memory: "Buziak — чмок, поцелуйчик: от buzia «ротик». Читается «бу́зяк». Daj buziaka! — поцелуй! Buziaki! — целую! (в конце сообщения)."
idioms:
