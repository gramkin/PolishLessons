etymology: "От strzelać «стрелять», от strzała «стрела», из праславянского *strěla — того же, что русские «стрела», «стрелять» и «стрелец». Суффикс -ec образует названия лиц по занятию. Русский закрепил «стрельца» за историей, польский оставил слово в живом употреблении."
memory: "strzelec — «стрелок», слово живое, в отличие от русского исторического «стрельца». Беглое e выпадает: strzelca, strzelcem. Звательный смягчает c в cz: strzelcze, как chłopcze."
