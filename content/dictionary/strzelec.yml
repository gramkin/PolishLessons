notes:
  - { kind: usage, text: "ЗВАТЕЛЬНЫЙ ПАДЕЖ ЗДЕСЬ СМЯГЧАЕТ c В cz. Форма — STRZELCZE: strzelcze, nie pudłuj. Такое же чередование видно в chłopiec → chłopcze и ojciec → ojcze. Рядом с k→c и r→rz это ещё один тип, который надо просто узнавать." }
  - { kind: usage, text: "Беглое e выпадает: strzelec, но STRZELCA, strzelcowi, strzelcem. Так же ведут себя chłopiec и ojciec, то есть весь класс на -ec. Мужско-личный именительный множественного — STRZELCY, с k→c по тому же правилу, что Polak → Polacy." }
  - { kind: false-friend, text: "Русское «стрелец» и польское strzelec — одно слово, но значения разошлись. По-польски strzelec это живой, обычный «стрелок»: и спортсмен, и солдат, и бомбардир в футболе. Русский «стрелец» ушёл в историю и в название созвездия. Зодиакальный Strzelec, впрочем, совпадает." }
