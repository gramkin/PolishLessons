# review
id: upewnic
format: 2
lemma: "upewnić"
rank: 1105
pos: verb
aspect: perf
pron: { cyr: "упэ́вниць" }
senses:
  - id: make-sure
    ru: "upewnić się — убедиться, удостовериться"
    examples:
      - pl: "Chcę się upewnić, że Tom tu był."
        ru: "Я хочу убедиться, что Том здесь был."
        source: { kind: translated, id: 6184537 }
      - pl: "Upewnij się, że zrobisz to sam."
        ru: "Убедись, что сделаешь это сам."
        source: { kind: translated, id: 10542081 }
      - pl: "Proszę się koniecznie upewnić, że drzwi są zamknięte."
        ru: "Обязательно убедитесь, что дверь закрыта."
        source: { kind: translated, id: 440536 }
  - id: assure
    ru: "убедить, заверить кого-то (без się)"
    examples:
      - pl: "Upewnił mnie, że wszystko gra."
        ru: "Он заверил меня, что всё в порядке."
        source: { kind: authored }
      - pl: "Upewniła go w tym przekonaniu."
        ru: "Она укрепила его в этом убеждении."
        source: { kind: authored }
notes:
  - { kind: government, text: "Оборот upewnić się, że значит «убедиться, что» — с союзом że; upewnić się co do czegoś «удостовериться насчёт чего-то» — оборот co do с родительным." }
  - { kind: usage, text: "Почти всегда идёт с się. Без się глагол значит «убедить, заверить кого-то» и встречается заметно реже." }
  - { kind: usage, text: "Несовершенный вид — upewniać się. Корень — pewny «уверенный, надёжный»." }
  - { kind: usage, text: "Upewnij się, że — стандартная формула инструкций и предупреждений, вроде русского «Убедитесь, что»." }
collocations:
  - { pl: "upewnić się", ru: "удостовериться" }
  - { pl: "upewnij się, że", ru: "убедись, что" }
  - { pl: "upewnić się co do czegoś", ru: "удостовериться насчёт чего-то" }
family:
  - { pl: "upewniać", ru: "убеждать (несовершенный вид)", relation: aspect }
  - { pl: "pewny", ru: "уверенный, надёжный", relation: root }
  - { pl: "pewność", ru: "уверенность", relation: derived }
etymology: "Приставка u- плюс pewny «уверенный, надёжный». Русское «удостовериться» собрано от «вера» — разные корни, одна логика."
memory: "upewnić się — «убедиться, удостовериться», почти всегда с się. Формула инструкций — Upewnij się, że «Убедись, что». А без się глагол значит «заверить, убедить кого-то»."
idioms:
  - { pl: "upewnić się", ru: "удостовериться" }
  - { pl: "upewnij się, że", ru: "убедись, что" }
