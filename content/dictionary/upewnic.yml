formExamples:
  - form: "upewnić"
    pl: "Chcę się upewnić, że Tom tu był."
    ru: "Я хочу убедиться, что Том здесь был."
    source: { kind: translated, id: 6184537 }
  - form: "upewnić"
    pl: "Chciałbym się upewnić co do tego."
    ru: "Я хотел бы в этом убедиться."
    source: { kind: translated, id: 362891 }
  - form: "upewnić"
    pl: "Proszę się koniecznie upewnić, że drzwi są zamknięte."
    ru: "Обязательно убедитесь, что дверь закрыта."
    source: { kind: translated, id: 440536 }
  - form: "upewnię"
    pl: "Upewnię się, że nic się nie dzieje z Tomem."
    ru: "Я удостоверюсь, что с Томом всё в порядке."
    source: { kind: translated, id: 4815335 }
  - form: "upewnię"
    pl: "Upewnię się jeszcze raz."
    ru: "Я ещё раз удостоверюсь."
    source: { kind: authored }
  - form: "upewnię"
    pl: "Zanim wyjdę, upewnię się."
    ru: "Прежде чем уйти, я удостоверюсь."
    source: { kind: authored }
  - form: "upewnij"
    pl: "Upewnij się, że zrobisz to sam."
    ru: "Убедись, что сделаешь это сам."
    source: { kind: translated, id: 10542081 }
  - form: "upewnij"
    pl: "Upewnij się, że wziąłeś paragon."
    ru: "Убедись, что взял чек."
    source: { kind: translated, id: 3239739 }
  - form: "upewnij"
    pl: "Upewnij się, że zagasiłeś ogień zanim wyjdziesz."
    ru: "Убедись, что погасил огонь перед уходом."
    source: { kind: translated, id: 591959 }
  - form: "upewnijmy"
    pl: "A więc upewnijmy się."
    ru: "Так давайте удостоверимся."
    source: { kind: translated, id: 709337 }
  - form: "upewnijmy"
    pl: "Upewnijmy się, że wszyscy wiedzą."
    ru: "Давайте удостоверимся, что все знают."
    source: { kind: authored }
  - form: "upewnijmy"
    pl: "Upewnijmy się co do terminu."
    ru: "Давайте удостоверимся насчёт срока."
    source: { kind: authored }
  - form: "upewniła"
    pl: "Upewniła się, że zapewnił im transport."
    ru: "Она удостоверилась, что он обеспечил им транспорт."
    source: { kind: translated, id: 13424586 }
  - form: "upewniła"
    pl: "Upewniła się, że drzwi są zamknięte."
    ru: "Она убедилась, что дверь закрыта."
    source: { kind: authored }
  - form: "upewniła"
    pl: "Upewniła go w tym przekonaniu."
    ru: "Она укрепила его в этом убеждении."
    source: { kind: authored }
  - form: "upewniłeś"
    pl: "Czy upewniłeś się, że drzwi są zamknięte?"
    ru: "Ты убедился, что дверь закрыта?"
    source: { kind: translated, id: 1452296 }
  - form: "upewniłeś"
    pl: "Upewniłeś się co do adresu?"
    ru: "Ты удостоверился насчёт адреса?"
    source: { kind: authored }
  - form: "upewniłeś"
    pl: "Nie upewniłeś się przed wyjściem."
    ru: "Ты не удостоверился перед уходом."
    source: { kind: authored }
  - form: "upewnimy"
    pl: "Upewnimy się, że Tom wie, co ma zrobić."
    ru: "Мы удостоверимся, что Том знает, что делать."
    source: { kind: translated, id: 3313324 }
  - form: "upewnimy"
    pl: "Upewnimy się, że nic nie zginie."
    ru: "Мы удостоверимся, что ничего не пропадёт."
    source: { kind: authored }
  - form: "upewnimy"
    pl: "Najpierw upewnimy się co do faktów."
    ru: "Сначала мы удостоверимся насчёт фактов."
    source: { kind: authored }
