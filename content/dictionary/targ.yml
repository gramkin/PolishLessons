notes:
  - { kind: false-friend, text: "Слово прямо отвечает русскому «торг», и корень общий: TARGOWAĆ SIĘ значит «торговаться», TARGOWISKO — «базарная площадь», TARGI — «ярмарка, выставка». Но распределение значений разное. Русский «торг» сегодня значит прежде всего процесс торговли ценой, а место называется «рынок» или «базар». Польский TARG — это в первую очередь само место, рынок под открытым небом, и лишь во вторую очередь торг как процесс. А множественное TARGI значит «выставка, ярмарка» в современном смысле: TARGI KSIĄŻKI «книжная выставка», TARGI PRACY «ярмарка вакансий». Поэтому форму множественного числа нельзя переводить как «рынки» механически." }
  - { kind: usage, text: "Девять форм: мужской род, неодушевлённое. Местный падеж единственного — NA TARGU, с окончанием -U, потому что основа кончается на заднеязычный G: это то же правило, что в WYROKU и ZASIĘGU. Дательный — TARGOWI. Родительный множественного TARGÓW с ударным -ÓW. Множественное TARGI живёт отдельной жизнью и означает выставку: в этом значении слово употребляется почти всегда во множественном, как русские «переговоры». Отсюда и производные: TARGOWY «рыночный», TARGOWISKO «торжище, базарная площадь»." }
  - { kind: pronunciation, text: "Читается «тарк», один слог. Конечное G оглушается в «к» — это обязательное правило польского для звонких согласных на конце слова, то же, что в CHLEB «хлеп» и NÓG «нук». Но в косвенных падежах звонкость возвращается, потому что согласный уже не конечный: TARGU звучит «та́ргу», TARGIEM — «та́ргем». Это различие стоит проговорить, потому что русскоязычные склонны произносить «тарг» со звонким G по аналогии с русским «торг», где оглушение тоже есть, но слабее заметно." }
  - { kind: stress, text: "В единственном числе слово односложное, и вопрос ударения не встаёт. Но в косвенных формах оно подчиняется общему польскому правилу предпоследнего слога: TARGU — «та́ргу», TARGIEM — «та́ргем», TARGOWI — «тарго́ви», TARGAMI — «тарга́ми», TARGACH — «тарга́х». Форма родительного множественного TARGÓW тоже двусложная с ударением на первом: «та́ргуф», где конечное W оглушается в «ф», а Ó читается как «у». Русское «торгов» ударение держит на окончании, и это расхождение слышно сразу." }
