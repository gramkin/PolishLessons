etymology: "Из праславянского *tъrgъ, того же слова, что русский «торг» и «торговля». Корень очень старый и, по распространённому мнению, заимствован в праславянский из иранского или дославянского субстрата вместе с самой практикой рыночной торговли; он дал названия городов по всей Европе — от Торгау в Германии до Турку в Финляндии, который по-шведски Åbo, а по-фински назван именно по торгу. Польский сохранил за словом значение места, русский перенёс основной вес на процесс и для места взял «рынок» из немецкого RING через польский же RYNEK. Получилось перекрёстное распределение: польское TARG это русский «рынок», а польское RYNEK — чаще «площадь» в центре города. Множественное TARGI в значении «выставка» — новое, двадцатого века, по образцу немецкого MESSE."
memory: "Прямой родственник русского «торга», и targować się — «торговаться». Но значения разошлись: польское targ это прежде всего место, то есть русский «рынок», а polskie rynek чаще значит «площадь». Множественное targi — «выставка, ярмарка»: targi książki, targi pracy, и переводить его как «рынки» нельзя. Местный падеж на -u: na targu, как na wyroku. И звук: конечное g оглушается, «тарк», но в targu звонкость возвращается."
