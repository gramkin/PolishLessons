# review
id: dowiedziec
format: 2
lemma: "dowiedzieć"
rank: 266
pos: verb
aspect: perf
pron: { cyr: "дове́дзець" }
senses:
  - id: find-out
    ru: "узнать (о чём-либо)"
    note: "Всегда с się: формы без него не существует."
    examples:
      - pl: "Kiedy się o tym dowiedziałeś?"
        ru: "Когда ты об этом узнал?"
        source: { kind: tatoeba, id: 6313732 }
      - pl: "Muszę się dowiedzieć, kim on jest."
        ru: "Я должен узнать, кто он такой."
        source: { kind: tatoeba, id: 3502511 }
      - pl: "Czytam, by się czegoś dowiedzieć."
        ru: "Я читаю, чтобы что-нибудь узнать."
        source: { kind: tatoeba, id: 951307 }
  - id: will-find-out
    ru: "узнать (о будущем, в оборотах)"
    examples:
      - pl: "Możemy nigdy się nie dowiedzieć."
        ru: "Мы можем никогда не узнать."
        source: { kind: tatoeba, id: 3844180 }
      - pl: "Dowiedziałem się więcej, niż chciałem."
        ru: "Я узнал больше, чем хотел."
        source: { kind: tatoeba, id: 12476621 }
      - pl: "Będziesz miał problemy, gdy twoja przyjaciółka dowie się prawdy."
        ru: "У тебя будут проблемы, когда твоя подруга узнает правду."
        source: { kind: tatoeba, id: 611663 }
notes:
  - { kind: usage, text: "Глагол употребляется только с się: dowiedzieć się «узнать». Формы без się нет." }
  - { kind: usage, text: "Два управления: dowiedzieć się o czymś «узнать о чём-то» и dowiedzieć się czegoś — с родительным: dowiedzieć się prawdy «узнать правду»." }
  - { kind: usage, text: "Несовершенный вид — dowiadywać się: Dowiaduję się o godzinach otwarcia." }
  - { kind: usage, text: "Корень wiedzieć «знать» родствен русскому «ведать», а приставка do- работает как в «дознаться», «доведаться»." }
collocations:
  - { pl: "dowiedzieć się prawdy", ru: "узнать правду" }
  - { pl: "dowiedz się", ru: "узнай" }
  - { pl: "dowiedzieć się o czymś", ru: "узнать о чём-то" }
  - { pl: "wkrótce się dowiemy", ru: "скоро узнаем" }
etymology: "Из do- + wiedzieć «знать», праславянское *věděti; тот же корень, что в русских «ведать», «весть», а приставка — как в «дознаться», «доведаться»."
memory: "dowiedzieć się — «узнать», и się обязательно: без него глагола просто нет. Корень wiedzieć родня русскому «ведать», приставка do- — как в «дознаться»."
idioms:
  - { pl: "dowiedzieć się prawdy", ru: "узнать правду" }
  - { pl: "dowiedz się", ru: "узнай" }
  - { pl: "prędzej czy później się dowiedzą", ru: "рано или поздно узнают" }
