# review
id: lac
format: 2
lemma: "lać"
rank: 1749
pos: verb
aspect: imperf
pron: { cyr: "ляць" }
senses:
  - id: pour-rain
    ru: "лить (о дожде): leje «льёт», lało «лило»"
    examples:
      - pl: "Leje."
        ru: "Льёт."
        source: { kind: translated, id: 702951 }
      - pl: "Leje jak z cebra."
        ru: "Льёт как из ведра."
        source: { kind: tatoeba, id: 623560 }
      - pl: "Zaczęło lać."
        ru: "Начался ливень."
        source: { kind: translated, id: 1603597 }
  - id: pour
    ru: "лить, наливать"
    examples:
      - pl: "Lejesz keczup na jajka?"
        ru: "Ты льёшь кетчуп на яйца?"
        source: { kind: translated, id: 12700238 }
      - pl: "Deszcz lał się strumieniami."
        ru: "Дождь лил ручьями."
        source: { kind: translated, id: 3238459 }
      - pl: "W trakcie imprezy alkohol lał się jak woda."
        ru: "На вечеринке алкоголь лился рекой."
        source: { kind: translated, id: 12045124 }
notes:
  - { kind: usage, text: "Прошедшее время строится на lał: lał, lała, lało, lali, lały. Формы leli не бывает, поэтому она оставлена без примеров. И обратите внимание на lanie: это не только «литьё», но и обиходное «трёпка» — dostać lanie «получить взбучку»." }
  - { kind: usage, text: "Про дождь это основное слово: Leje «Льёт», Zaczęło lać «Полило». Безличная форма lało значит «лило», без подлежащего." }
  - { kind: usage, text: "lać jak z cebra — «лить как из ведра», буквально «как из ушата»; русский образ ведра, польский — ушата." }
  - { kind: government, text: "Лить что-то куда-то — lać coś na coś (винительный): lejesz keczup na jajka." }
  - { kind: usage, text: "Разговорно lać значит ещё и «бить», а lać wodę — «лить воду», говорить впустую — тот же образ, что в русском." }
collocations:
  - { pl: "leje jak z cebra", ru: "льёт как из ведра" }
  - { pl: "zaczęło lać", ru: "полило" }
  - { pl: "lać wodę", ru: "лить воду, говорить пусто" }
family:
  - { pl: "lany", ru: "литой", relation: root }
  - { pl: "polać", ru: "полить", relation: root }
  - { pl: "deszcz", ru: "дождь", relation: root, id: deszcz }
etymology: "Праславянское *lьjati — то же слово, что русское «лить». Формы leje и «льёт» восходят к одному корню."
memory: "lać — «лить», и прежде всего про дождь: Leje «Льёт», Zaczęło lać «Полило», leje jak z cebra «льёт как из ведра». Безличное lało — «лило»."
idioms:
  - { pl: "leje jak z cebra", ru: "льёт как из ведра" }
  - { pl: "lać wodę", ru: "лить воду, говорить пусто" }
  - { pl: "lać łzy", ru: "лить слёзы" }
formExamplesSkip:
  - { form: "leli", reason: "такой формы нет: мужско-личное прошедшее от lać — lali" }
