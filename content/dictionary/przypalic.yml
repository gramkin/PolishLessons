# review
id: przypalic
format: 2
lemma: "przypalić"
rank: 2083
pos: verb
aspect: perf
pron: { cyr: "пшыпа́лиць" }
senses:
  - id: burn-food
    ru: "пригореть, подпалить (еду)"
    examples:
      - pl: "Tom przypalił ciastka."
        ru: "Том сжёг печенье."
        source: { kind: translated, id: 11271390 }
      - pl: "Musisz uważać aby nie przypalić ciasta."
        ru: "Надо следить, чтобы не сжечь пирог."
        source: { kind: translated, id: 3128316 }
      - pl: "Nie przypal tosta."
        ru: "Не сожги тост."
        source: { kind: translated, id: 14034484 }
  - id: burnt
    ru: "пригорелый, подгоревший (причастие)"
    examples:
      - pl: "Ta kawa ma przypalony smak."
        ru: "У этого кофе пригорелый вкус."
        source: { kind: translated, id: 3363131 }
      - pl: "Ta kawa trochę smakuje przypaleniem."
        ru: "Этот кофе немного отдаёт гарью."
        source: { kind: translated, id: 790840 }
notes:
  - { kind: usage, text: "Прежде всего о еде: przypalić mleko «сжечь молоко», przypalić ciasto «сжечь пирог». Несовершенный вид — przypalać." }
  - { kind: government, text: "Винительный падеж. Возвратное przypalić się значит, что пригорело само: mleko się przypaliło." }
  - { kind: false-friend, text: "Корень palić «жечь, курить» — ср. русское «палить». Но przypalić не «спалить дотла», а именно «подпалить, пригореть»." }
  - { kind: usage, text: "Существительное przypalenie значит «запах гари»: smakuje przypaleniem «отдаёт гарью»." }
  - { kind: government, text: "Подгорает еда или ткань: przypalić mleko, przypalić koszulę. Об обожжённом человеке говорят poparzony, поэтому мужско-личной формы причастия у этого глагола нет." }
collocations:
  - { pl: "przypalić mleko", ru: "сжечь молоко" }
  - { pl: "przypalony smak", ru: "пригорелый вкус" }
etymology: "przy- + palić «жечь»; ср. русское «палить», «подпалить»."
memory: "przypalić — «пригореть, подпалить», почти всегда о еде: przypalić mleko. Возвратное mleko się przypaliło значит, что пригорело само."
