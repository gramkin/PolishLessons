etymology: "От прилагательного GOTOWY, от праславянского *gotovъ, то есть от того же слова, что русское «готовый», и значение здесь не сдвинулось ни на шаг. Суффикс -OŚĆ отвечает русскому -ОСТЬ, так что GOTOWOŚĆ и «готовность» собраны из одинаковых частей. Разошлись языки только в глаголе: польский сузил GOTOWAĆ до варки и стряпни, а для подготовки завёл приставочное PRZYGOTOWAĆ; русский оставил «готовить» широким и добавил отдельное «варить». Из того же гнезда GOTÓWKA «наличные», буквально «готовые деньги»."
memory: "Существительное и прилагательное совпадают с русскими полностью: gotowy это «готовый», gotowość это «готовность». А глагол сузился: gotować значит «варить», gotować wodę, а «подготовить» будет przygotować, и gotować dokumenty сказать нельзя. Управление поправить: gotowość DO rozmów с родительным, где русский ставит «к» с дательным. Знать gotówka «наличные», от тех же «готовых» денег. Читается «гото́восьчь»."
