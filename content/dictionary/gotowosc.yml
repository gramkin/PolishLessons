notes:
  - { kind: false-friend, text: "Прилагательное GOTOWY совпадает с русским «готовый» полностью, а вот глагол разошёлся, и это важная бытовая поправка. GOTOWAĆ значит «варить»: GOTOWAĆ WODĘ «кипятить воду», GOTOWAĆ ZUPĘ «варить суп», GOTOWAĆ OBIAD «готовить обед», то есть всегда о еде и об огне. Русское «готовить» в смысле «подготовить» будет PRZYGOTOWAĆ: PRZYGOTOWAĆ DOKUMENTY «подготовить документы». Сказать GOTOWAĆ DOKUMENTY нельзя, это прозвучит так, будто бумаги варят в кастрюле." }
  - { kind: government, text: "Готовность к чему — предлог DO с родительным: GOTOWOŚĆ DO ROZMÓW «готовность к переговорам», GOTOWOŚĆ DO POMOCY. Русский ставит здесь «к» с дательным, так что и предлог, и падеж приходится менять. Состояние — готовый оборот W STANIE GOTOWOŚCI, с местным падежом и родительным. Прилагательное GOTOWY управляет тем же предлогом DO: GOTOWY DO DROGI «готовый к дороге», а в значении «согласен» берёт инфинитив: GOTOWY POMÓC." }
  - { kind: usage, text: "Шесть форм, разряд женских существительных на -OŚĆ, суффикс отвечает русскому -ОСТЬ. Отвлечённое существительное, поэтому множественное число почти не нужно и годится разве что в канцелярском перечислении. Основа идёт от GOTOWY, и у неё есть ещё одно употребительное производное: GOTÓWKA значит «наличные деньги», от идеи готовых, наличных средств, а PŁACIĆ GOTÓWKĄ — «платить наличными»." }
  - { kind: pronunciation, text: "Читается «гото́восьчь», три слога, ударение на втором. Все гласные чистые, носовых здесь нет вовсе. Буква W перед O звучит как «в». Конец слова, -ŚĆ, это два мягких звука подряд, «сьчь», и произносятся они слитно, без гласной между ними. В слове GOTÓWKA появляется Ó, которая читается как «у»: «готу́фка», причём W перед K оглушается." }
  - { kind: register, text: "Слово нейтральное, с уклоном в официальное. Частые обороты: GOTOWOŚĆ BOJOWA «боевая готовность», W STANIE GOTOWOŚCI «в состоянии готовности», WYRAZIĆ GOTOWOŚĆ «выразить готовность», GOTOWOŚĆ DO WSPÓŁPRACY «готовность к сотрудничеству». В живой речи вместо существительного почти всегда скажут прилагательным: JESTEM GOTOWY «я готов», и это самая частая форма всего гнезда." }
