        ru: "Он пользуется репутацией честного человека."
        source: { kind: authored }
  - id: standing
    ru: "слава, молва (о ком-л.)"
    examples:
      - pl: "Wyprzedzała go reputacja surowego nauczyciela."
        ru: "Его опережала слава строгого учителя."
        source: { kind: authored }
      - pl: "Ma reputację człowieka, który dotrzymuje słowa."
        ru: "У него репутация человека, который держит слово."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Ещё одно существительное на -ja с двойным родительным множественного: REPUTACJI и книжное REPUTACYJ. Тот же ряд, что konferencja, komisja, obsesja. В единственном числе REPUTACJI покрывает сразу родительный, дательный и предложный, и падеж подсказывает только предлог: bez reputacji, ku reputacji, o reputacji." }
  - { kind: government, text: "CIESZYĆ SIĘ REPUTACJĄ — творительный падеж, как и в русском «пользоваться репутацией». А вот MIEĆ REPUTACJĘ идёт с винительным: ma reputację skąpca. Оба оборота живые, различаются только оттенком: cieszyć się звучит благожелательнее, mieć нейтрально и годится и для дурной славы." }
  - { kind: false-friend, text: "Со словом «репутация» совпадение полное, но осторожнее с соседом: польское RENOMA тоже значит «репутация», однако только хорошая, и чаще о фирме, чем о человеке. Сказать zła renoma нельзя, а zła reputacja — вполне." }
collocations:
  - { pl: "stracić reputację", ru: "потерять репутацию" }
  - { pl: "cieszyć się reputacją", ru: "пользоваться репутацией" }
  - { pl: "nadszarpnąć reputację", ru: "подпортить репутацию" }
family:
  - { pl: "reputacyjny", ru: "репутационный", relation: derived }
  - { pl: "renoma", ru: "доброе имя, реноме", relation: root }
  - { pl: "opinia", ru: "мнение, репутация", relation: root, id: opinia }
etymology: "Из латинского reputatio «обдумывание, подсчёт», от reputare «обдумывать, взвешивать». И русский, и польский взяли слово через канцелярскую латынь, поэтому они совпадают целиком; разошлось только окончание — латинское -tio дало польское -cja и русское -ция, как в konferencja и «конференция»."
memory: "Родительный множественного двойной: современное REPUTACJI и старое REPUTACYJ. И запомни падежи при глаголах: cieszyć się reputacjĄ, творительный, но mieć reputacjĘ, винительный."
idioms:
  - { pl: "cieszyć się dobrą reputacją", ru: "пользоваться доброй репутацией" }
  - { pl: "nadszarpnąć czyjąś reputację", ru: "подпортить чью-л. репутацию" }
