# review
id: znienacka
format: 2
lemma: "znienacka"
rank: 2288
pos: adv
pron: { cyr: "зьнена́цка" }
senses:
  - id: suddenly
    ru: "внезапно, неожиданно"
    examples:
      - pl: "Pan Jordan przebudził się znienacka."
        ru: "Господин Джордан внезапно проснулся."
        source: { kind: translated, id: 6313562 }
      - pl: "Musimy wpaść na niego znienacka."
        ru: "Мы должны застать его врасплох."
        source: { kind: authored }
      - pl: "Deszcz spadł znienacka."
        ru: "Дождь пошёл внезапно."
        source: { kind: authored }
  - id: by-surprise
    ru: "врасплох"
    examples:
      - pl: "Zaatakowali znienacka."
        ru: "Они напали врасплох."
        source: { kind: authored }
      - pl: "Pytanie padło znienacka."
        ru: "Вопрос прозвучал неожиданно."
        source: { kind: authored }
      - pl: "Zaskoczył nas znienacka."
        ru: "Он застал нас врасплох."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Этимология прозрачная и красивая: из z + nie + nadzieja, буквально «из не-надежды», то есть «когда не ждали»." }
  - { kind: usage, text: "Родственники есть в соседних языках: украинское «зненацька» и белорусское «знянацку» — то же слово." }
  - { kind: usage, text: "Синонимы: nagle, raptem, nieoczekiwanie, ni stąd ni zowąd." }
  - { kind: usage, text: "Часто с глаголами нападения и появления: zaatakować znienacka, wpaść znienacka, zaskoczyć znienacka." }
collocations:
  - { pl: "zaatakować znienacka", ru: "напасть врасплох" }
  - { pl: "wpaść znienacka", ru: "нагрянуть неожиданно" }
  - { pl: "ni stąd ni zowąd", ru: "ни с того ни с сего" }
etymology: "Из z + nie + nadzieja, праславянское *jьznenaďьka — буквально «из не-надежды», то есть тогда, когда не ждали. Украинское «зненацька» и белорусское «знянацку» — то же слово."
memory: "znienacka — «внезапно, врасплох», и внутри слова спрятана nadzieja «надежда»: z + nie + nadzieja, то есть «когда не ждали». Украинское «зненацька» — ровно то же слово. Ходит с глаголами внезапного действия: zaatakować znienacka, wpaść znienacka."
