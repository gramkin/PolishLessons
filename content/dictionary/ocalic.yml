# review
id: ocalic
format: 2
lemma: "ocalić"
rank: 1017
pos: verb
aspect: perf
pron: { cyr: "оца́лиць" }
senses:
  - id: save
    ru: "спасти"
    examples:
      - pl: "Przybył by mnie ocalić."
        ru: "Он пришёл, чтобы меня спасти."
        source: { kind: translated, id: 2587612 }
      - pl: "Ryzykował życiem, by mnie ocalić."
        ru: "Он рисковал жизнью, чтобы меня спасти."
        source: { kind: translated, id: 737225 }
      - pl: "Kosztem swojego życia ocalił dziecko."
        ru: "Ценой своей жизни он спас ребёнка."
        source: { kind: translated, id: 689881 }
  - id: rescue
    ru: "ocalenie — спасение"
    examples:
      - pl: "Dziękuję za ocalenie mi życia."
        ru: "Спасибо, что спас мне жизнь."
        source: { kind: translated, id: 2209836 }
      - pl: "On domagał się ocalenia koni."
        ru: "Он требовал спасения лошадей."
        source: { kind: translated, id: 12954420 }
  - id: survivor
    ru: "ocalony — спасшийся, уцелевший"
    examples:
      - pl: "Jestem jedynym ocalonym."
        ru: "Я единственный уцелевший."
        source: { kind: translated, id: 12450212 }
      - pl: "Jedynym ocalonym z wypadku było dziecko."
        ru: "Единственным уцелевшим в аварии был ребёнок."
        source: { kind: translated, id: 12450215 }
notes:
  - { kind: government, text: "ocalić kogoś — винительный падеж без предлога, как русское «спасти кого-то». А ocalić coś przed czymś значит «уберечь что-то от чего-то»." }
  - { kind: usage, text: "Совершенный вид; несовершенный — ocalać. Корень — cały «целый», так что буквально это «сохранить целым»." }
  - { kind: usage, text: "Рядом стоит uratować с тем же значением «спасти»; ocalić чуть книжнее и чаще о жизни и памяти." }
  - { kind: usage, text: "Причастие ocalony работает как существительное: ocalony «уцелевший, выживший», ocaleni «выжившие»." }
collocations:
  - { pl: "ocalić życie", ru: "спасти жизнь" }
  - { pl: "ocalić od zapomnienia", ru: "спасти от забвения" }
  - { pl: "jedyny ocalony", ru: "единственный выживший" }
family:
  - { pl: "ocalać", ru: "спасать (несовершенный вид)", relation: aspect }
  - { pl: "cały", ru: "целый", relation: root, id: caly }
  - { pl: "ocalenie", ru: "спасение", relation: derived }
etymology: "Приставка o- плюс cały «целый» — буквально «сделать целым, сохранить целым». Русское «спасти» собрано от другого корня, но логика «уберечь» та же."
memory: "ocalić — «спасти», совершенный вид к ocalać. Корень тот же, что в cały «целый». Рядом стоит uratować с тем же значением, а ocalony значит «уцелевший, выживший»."
idioms:
  - { pl: "ocalić życie", ru: "спасти жизнь" }
  - { pl: "ocalić od zapomnienia", ru: "спасти от забвения" }
formExamplesSkip:
  - { form: "ocaliwszy", reason: "книжное деепричастие прошедшего времени; в живой речи не употребляется" }
