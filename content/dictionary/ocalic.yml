    pl: "Nie możemy wszystkich ocalić."
    ru: "Мы не можем спасти всех."
    source: { kind: translated, id: 2725503 }
  - form: "ocalić"
    pl: "Ryzykował życiem, by mnie ocalić."
    ru: "Он рисковал жизнью, чтобы меня спасти."
    source: { kind: translated, id: 737225 }
  - form: "ocalił"
    pl: "Kosztem swojego życia ocalił dziecko."
    ru: "Ценой своей жизни он спас ребёнка."
    source: { kind: translated, id: 689881 }
  - form: "ocalił"
    pl: "Ocalił cały dobytek."
    ru: "Он спас всё имущество."
    source: { kind: authored }
  - form: "ocalił"
    pl: "Lekarz ocalił mu życie."
    ru: "Врач спас ему жизнь."
    source: { kind: authored }
  - form: "ocaliła"
    pl: "Ocaliła nas wszystkich."
    ru: "Она спасла нас всех."
    source: { kind: translated, id: 2587228 }
  - form: "ocaliła"
    pl: "Ocaliła psa z rzeki."
    ru: "Она спасла собаку из реки."
    source: { kind: authored }
  - form: "ocaliła"
    pl: "Ta decyzja ocaliła firmę."
    ru: "Это решение спасло фирму."
    source: { kind: authored }
