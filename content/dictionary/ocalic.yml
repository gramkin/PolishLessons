formExamples:
  - form: "ocaleni"
    pl: "Myślisz, że będziemy ocaleni?"
    ru: "Думаешь, мы будем спасены?"
    source: { kind: translated, id: 3972654 }
  - form: "ocaleni"
    pl: "Ocaleni czekali na pomoc."
    ru: "Выжившие ждали помощи."
    source: { kind: authored }
  - form: "ocaleni"
    pl: "Zostali ocaleni przez rybaków."
    ru: "Их спасли рыбаки."
    source: { kind: authored }
  - form: "ocalenia"
    pl: "On domagał się ocalenia koni."
    ru: "Он требовал спасения лошадей."
    source: { kind: translated, id: 12954420 }
  - form: "ocalenia"
    pl: "Nie było już szans na ocalenia tej wsi."
    ru: "Шансов на спасение этой деревни уже не было."
    source: { kind: authored }
  - form: "ocalenia"
    pl: "Walczyli o ocalenia resztek lasu."
    ru: "Они боролись за спасение остатков леса."
    source: { kind: authored }
  - form: "ocalenie"
    pl: "Dziękuję za ocalenie mi życia."
    ru: "Спасибо, что спас мне жизнь."
    source: { kind: translated, id: 2209836 }
  - form: "ocalenie"
    pl: "Ocalenie było cudem."
    ru: "Спасение было чудом."
    source: { kind: authored }
  - form: "ocalenie"
    pl: "Liczyli na ocalenie."
    ru: "Они надеялись на спасение."
    source: { kind: authored }
  - form: "ocalić"
    pl: "Przybył by mnie ocalić."
    ru: "Он пришёл, чтобы меня спасти."
    source: { kind: translated, id: 2587612 }
