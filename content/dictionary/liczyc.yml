# review
id: liczyc
format: 2
lemma: "liczyć"
rank: 526
pos: verb
aspect: imperf
pron: { cyr: "ли́чыць" }
senses:
  - id: count
    ru: "считать, подсчитывать"
    note: "liczyć do stu «считать до ста»; komitet liczy 15 członków «комитет насчитывает 15 человек»."
    examples:
      - pl: "On szybko liczy."
        ru: "Он быстро считает."
        source: { kind: tatoeba, id: 732912 }
      - pl: "Ma dopiero dwa lata, a już umie liczyć do stu."
        ru: "Ей всего два года, а она уже умеет считать до ста."
        source: { kind: tatoeba, id: 416426 }
      - pl: "Komitet liczy 15 członków."
        ru: "Комитет насчитывает пятнадцать человек."
        source: { kind: translated, id: 592356 }
  - id: count-on
    ru: "liczyć na kogoś — рассчитывать на кого-л."
    note: "С предлогом na и винительным, как в русском."
    examples:
      - pl: "Możesz zawsze na mnie liczyć."
        ru: "Ты всегда можешь на меня рассчитывать."
        source: { kind: tatoeba, id: 817167 }
      - pl: "Liczymy na twoją pomoc."
        ru: "Мы рассчитываем на твою помощь."
        source: { kind: tatoeba, id: 3657569 }
      - pl: "Liczę na ciebie."
        ru: "Я на тебя рассчитываю."
        source: { kind: translated, id: 368093 }
  - id: matter
    ru: "liczyć się — иметь значение, считаться"
    note: "Liczy się szybkość «Важна скорость»; liczyć się z czymś «считаться с чем-либо»."
    examples:
      - pl: "Liczy się szybkość."
        ru: "Важна скорость."
        source: { kind: translated, id: 6406239 }
      - pl: "Liczyła się każda minuta."
        ru: "Была дорога каждая минута."
        source: { kind: translated, id: 7972314 }
      - pl: "Licz się z faktami!"
        ru: "Считайся с фактами!"
        source: { kind: translated, id: 8617189 }
notes:
  - { kind: government, text: "liczyć na kogoś/coś — с предлогом na и винительным, ровно как русское «рассчитывать на кого-то»: możesz na mnie liczyć «можешь на меня рассчитывать»." }
  - { kind: usage, text: "liczyć się значит «иметь значение»: liczy się szybkość «важна скорость». А liczyć się z czymś — «считаться с чем-либо»: licz się z faktami." }
  - { kind: usage, text: "В значении «насчитывать» подлежащее — само множество: komitet liczy 15 członków, rozprawa liczyła dziesięć tysięcy słów." }
  - { kind: usage, text: "Совершенный вид зависит от значения: policzyć «посчитать», ale doliczyć się «досчитаться». Деепричастие licząc живёт в обороте nie licząc «не считая»." }
collocations:
  - { pl: "liczyć na kogoś", ru: "рассчитывать на кого-либо" }
  - { pl: "liczy się", ru: "имеет значение" }
  - { pl: "nie licząc", ru: "не считая" }
  - { pl: "liczyć do stu", ru: "считать до ста" }
family:
  - { pl: "policzyć", ru: "посчитать", relation: derived }
  - { pl: "liczba", ru: "число", relation: derived }
  - { pl: "rachunek", ru: "счёт", relation: root }
etymology: "От liczba «число», праславянское *likъ «счёт, число» — родственно русским «отличить» и «личный счёт»."
memory: "liczyć — «считать», и у него три хода. Прямой: liczyć do stu «считать до ста», komitet liczy 15 członków «комитет насчитывает пятнадцать человек». С предлогом: liczyć na kogoś «рассчитывать на кого-то», na плюс винительный — ровно как в русском, możesz na mnie liczyć. И с się: liczy się szybkość «важна скорость», а liczyć się z czymś — «считаться с чем-либо». Деепричастие живёт в обороте nie licząc «не считая»."
idioms:
  - { pl: "liczyć na kogoś", ru: "рассчитывать на кого-либо" }
  - { pl: "liczy się", ru: "имеет значение" }
  - { pl: "nie licząc", ru: "не считая" }
