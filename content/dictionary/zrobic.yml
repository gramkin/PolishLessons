# review
id: zrobic
lemma: zrobić
rank: 32
pos: verb
aspect: perf
aspectPair: robic
pron: { cyr: "зро́биць" }
senses:
  - id: do
    ru: "сделать, выполнить"
    examples:
      - pl: "Zrobię to."
        ru: "Я сделаю это."
        source: { kind: tatoeba, id: 544544 }
      - pl: "Co ty zrobiłeś?"
        ru: "Что ты сделал?"
        source: { kind: tatoeba, id: 4837721 }
      - pl: "Niech on to zrobi."
        ru: "Пусть он это сделает."
        source: { kind: tatoeba, id: 6308665 }
  - id: make
    ru: "сделать, приготовить, изготовить"
    examples:
      - pl: "Zrób kawy."
        ru: "Сделай кофе."
        source: { kind: tatoeba, id: 348937 }
      - pl: "Zrobiłaś obiad?"
        ru: "Ты обед приготовила?"
        source: { kind: tatoeba, id: 12470517 }
  - id: become
    ru: "zrobić się: стать (о состоянии, погоде)"
    examples:
      - pl: "W lesie znów zrobiło się cicho."
        ru: "В лесу снова стало тихо."
        source: { kind: tatoeba, id: 3446241 }
notes:
  - kind: usage
    text: "Совершенный вид: результат. Форма настоящего времени означает будущее, как в русском: zrobię — «сделаю». Сложного будущего (będę zrobić) не бывает."
  - kind: government
    text: "С количеством вещества дополнение может стоять в родительном падеже: Zrób kawy — «сделай (немного) кофе»."
collocations:
  - { pl: "zrobić zakupy", ru: "сделать покупки" }
  - { pl: "zrobić zdjęcie", ru: "сфотографировать" }
  - { pl: "zrobić przerwę", ru: "сделать перерыв" }
family:
  - { pl: "robić", ru: "делать", relation: aspect, id: robic }
  - { pl: "zrobienie", ru: "выполнение, изготовление", relation: derived }
etymology: "Приставочный совершенный вид от robić. Глагол robić восходит к праславянскому *orbiti «работать, трудиться», производному от *orbъ «раб, работник» — того же корня, что русские «раб», «работа» и «ребёнок». Приставка z- (из *sъ-) даёт значение завершённости, как русское с- в «сделать»."
memory: "z- работает как русское с-: robić → zrobić = делать → сделать. Отсюда главное следствие: формы «настоящего времени» у zrobić означают будущее (zrobię — «сделаю»), а сложного будущего będę zrobić не бывает — так же, как по-русски нельзя сказать «буду сделать». Корень тот же, что в русском «работа», только без -та: ro-b- → раб-от-а."
idioms:
  - { pl: "zrobić wielkie oczy", ru: "сделать большие глаза, сильно удивиться" }
  - { pl: "zrobić się na bóstwo", ru: "разодеться в пух и прах, привести себя в идеальный вид" }
  - { pl: "zrobić na szaro", ru: "обвести вокруг пальца, обмануть" }
  - { pl: "i w Paryżu nie zrobią z owsa ryżu", ru: "букв. «и в Париже из овса риса не сделают» — что не дано, того не переделать" }
