etymology: "Из иврита, где MATZAH означает пресный, неквашеный хлеб, через идиш MATSE. Русское «маца» пришло тем же путём и в то же время, через идиш восточноевропейских общин, поэтому слова совпадают полностью, вплоть до рода и склонения. Польская форма сохранила открытое A в обоих слогах. Любопытно, что в польском заимствование совпало по звучанию с формой глагола MACAĆ «щупать», слова славянского и совершенно другого происхождения: MACAĆ восходит к праславянскому *matati, родственному русскому «мотать» в старом значении «махать, двигать». Так совпали в одной форме семитский корень и славянский, и омонимия эта чисто случайная."
memory: "Как русская «маца», из иврита через идиш, совпадение полное. Ловушка внутри польского: maca — это ещё и «он щупает», от macać; различает только грамматика, maca jest świeża «маца свежая» против maca ścianę «он ощупывает стену». Склонение экономное: macy сразу на родительный, дательный и местный единственного, как pracy у praca. Родительный множественного mac без окончания."
