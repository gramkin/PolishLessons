notes:
  - { kind: government, text: "Женский род на -A после твёрдого C, и склонение здесь экономное: форма MACY покрывает сразу родительный, дательный и местный единственного. BEZ MACY, DZIĘKI MACY, O MACY — всё одна форма. Тот же тип, что у PRACA с его PRACY, и у всех существительных на -CA. Винительный на -Ę: KUPIĆ MACĘ. Творительный на -Ą: Z MACĄ. Родительный множественного MAC, без окончания. Из чего испечена — предлог Z с родительным: MACA Z MĄKI PSZENNEJ. Без чего — BEZ с родительным: PIECZONA BEZ DROŻDŻY." }
  - { kind: false-friend, text: "Со русским словом «маца» совпадение полное: оба пришли из иврита и означают одно и то же. Ловушка в польском языке, а не между языками: MACA это ещё и форма глагола MACAĆ «щупать, ощупывать», третье лицо единственного числа. ON MACA значит «он щупает», и омонимия полная, различает только грамматика — существительное требует определения и падежа, глагол стоит при подлежащем. Поэтому фраза MACA JEST ŚWIEŻA это «маца свежая», а MACA ŚCIANĘ — «он ощупывает стену». В письменном тексте путаница редка, в речи решает порядок слов." }
  - { kind: pronunciation, text: "Читается «ма́ца», ударение на предпоследнем слоге из двух. Буква C перед A даёт «ц», твёрдое, без смягчения — в отличие от C перед I и E, где оно мягкое или даёт «ц» перед гласной переднего ряда. В форме MACY слышно «ма́цы», с «ы» на конце. В винительном MACĘ конечное -Ę на конце слова теряет носовой призвук и звучит просто «э»: «ма́цэ». В родительном множественного MAC один слог: «мац»." }
  - { kind: usage, text: "Частотные сочетания: MACA NA PASCHĘ, PIEC MACĘ «печь мацу», MACA Z MĄKI PSZENNEJ, OPŁATEK I MACA в сопоставлениях обрядов. Слово принадлежит религиозной и бытовой лексике и в общих текстах встречается редко, зато в литературе о еврейской Польше постоянно. Прилагательное MACOWY употребляется в сочетании MĄKA MACOWA «мацовая мука». Не путать с MACIERZ «матрица» и MACICA «матка» — слова совсем другого корня, несмотря на внешнее сходство начала." }
