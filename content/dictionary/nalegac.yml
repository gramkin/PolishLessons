notes:
  - { kind: government, text: "NALEGAĆ NA COŚ — ВИНИТЕЛЬНЫЙ, А НЕ ПРЕДЛОЖНЫЙ. Предлог тот же, что по-русски, и именно поэтому ошибка почти неизбежна: «настаивать НА встречЕ» ставит предложный, а польское nalegać na spotkanIE — винительный. Проверяй по окончанию: na spotkanie, na zwrot, na wyjaśnienia. Второй оборот — NALEGAĆ, ŻEBY с придаточным: nalegała, żeby został." }
  - { kind: usage, text: "Страдательного причастия нет: глагол непереходный, дополнение всегда идёт через предлог. Отсюда 52 формы вместо 63 — тот же случай, что współczuć, zajrzeć, wpadać, patrzeć, występować, lądować и zaopiekować się. Безличное NALEGANO при этом есть и управляет так же: nalegano na zmianę terminu." }
  - { kind: false-friend, text: "Русское «налегать» существует и собрано из тех же частей — na- и корень *leg- «лежать», — но значит «наваливаться, нажимать»: налегать на вёсла. Польское nalegać ушло в сторону настойчивой просьбы. Так что разбор слова русскому понятен, а смысл подсказывает неверно. Из того же гнезда polegać «полагаться», zalegać «залегать», przylegać «прилегать»." }
collocations:
  - { pl: "nalegać na spotkanie", ru: "настаивать на встрече" }
  - { pl: "na czyjeś naleganie", ru: "по чьему-л. настоянию" }
  - { pl: "nalegać, żeby", ru: "настаивать, чтобы" }
family:
  - { pl: "polegać", ru: "полагаться", relation: root, id: polegac }
  - { pl: "zalegać", ru: "залегать; иметь задолженность", relation: root }
  - { pl: "leżeć", ru: "лежать", relation: root, id: lezec }
etymology: "Приставка na- и корень *leg-/*lež- «лежать», тот же, что в leżeć и в русских «лежать», «налегать», «полагаться». Образ исходно телесный: налечь на что-то всем весом. Русский удержал буквальный смысл — налегать на вёсла, — а польский перевёл его в разговор: настаивать значит давить словом, а не плечом."
memory: "Предлог тот же, падеж другой: nalegać NA spotkanie, винительный, а не «на встрече». И не доверяй сходству с «налегать»: по-польски это «настаивать», а не «наваливаться»."
idioms:
  - { pl: "na czyjeś naleganie", ru: "по чьему-л. настоянию" }
  - { pl: "nalegać do skutku", ru: "настаивать до победного" }
