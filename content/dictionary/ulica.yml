# review
id: ulica
format: 2
lemma: "ulica"
rank: 569
pos: noun
pron: { cyr: "ули́ца" }
senses:
  - id: street
    ru: "улица"
    note: "na ulicy «на улице» — предложный; przez ulicę «через улицу» — винительный."
    examples:
      - pl: "Jak się nazywa ta ulica?"
        ru: "Как называется эта улица?"
        source: { kind: tatoeba, id: 351944 }
      - pl: "Mieszkam na cichej ulicy."
        ru: "Я живу на тихой улице."
        source: { kind: tatoeba, id: 5975479 }
      - pl: "Na ulicy pada śnieg."
        ru: "На улице идет снег."
        source: { kind: tatoeba, id: 4748329 }
  - id: cross
    ru: "przejść przez ulicę — перейти улицу"
    note: "С предлогом przez и винительным."
    examples:
      - pl: "Przeszedł przez ulicę."
        ru: "Он перешёл улицу."
        source: { kind: tatoeba, id: 827754 }
      - pl: "Staruszka przechodzi przez ulicę."
        ru: "Старушка переходит дорогу."
        source: { kind: tatoeba, id: 2962770 }
      - pl: "To niebezpieczne, aby tu przechodzić przez ulicę."
        ru: "Опасно переходить улицу здесь."
        source: { kind: tatoeba, id: 13785418 }
  - id: along
    ru: "iść ulicą — идти по улице"
    note: "Творительный падеж без предлога — там, где русский ставит «по»."
    examples:
      - pl: "Idźcie prosto tą ulicą."
        ru: "Идите прямо по этой улице."
        source: { kind: tatoeba, id: 348638 }
      - pl: "Naszą ulicą kursowały tramwaje."
        ru: "По нашей улице ходили трамваи."
        source: { kind: tatoeba, id: 10138183 }
      - pl: "Maszerowaliśmy ulicą - tup, tup, tup..."
        ru: "Мы маршировали по улице - топ, топ, топ."
        source: { kind: tatoeba, id: 2238636 }
notes:
  - { kind: government, text: "«Идти ПО улице» по-польски строится творительным без предлога: iść ulicą, idźcie prosto tą ulicą. Это главное отличие от русского." }
  - { kind: government, text: "«На улице» — na ulicy с предложным; «перейти улицу» — przejść przez ulicę с przez и винительным." }
  - { kind: usage, text: "В адресах употребляется сокращение ul.: ul. Długa 5 «ул. Длугая, 5»." }
  - { kind: usage, text: "Прилагательное — uliczny «уличный»: uliczny muzyk «уличный музыкант»." }
collocations:
  - { pl: "na ulicy", ru: "на улице" }
  - { pl: "przez ulicę", ru: "через улицу" }
  - { pl: "tą ulicą", ru: "по этой улице" }
  - { pl: "na rogu ulicy", ru: "на углу улицы" }
family:
  - { pl: "uliczny", ru: "уличный", relation: derived }
  - { pl: "uliczka", ru: "улочка", relation: derived }
  - { pl: "zaułek", ru: "переулок", relation: derived }
etymology: "От праславянского *ulica — то же слово, что русское «улица»; корень тот же, что в ul «улей», первоначально «полость, проход»."
memory: "ulica — «улица», и главное отличие в том, как сказать «идти по улице»: по-польски это творительный падеж без всякого предлога — iść ulicą, idźcie prosto tą ulicą. «На улице» будет na ulicy с предложным, а «перейти улицу» — przejść przez ulicę с przez и винительным. В адресах пишут сокращённо: ul. Długa 5."
idioms:
  - { pl: "na ulicy", ru: "на улице" }
  - { pl: "przejść przez ulicę", ru: "перейти улицу" }
  - { pl: "iść tą ulicą", ru: "идти по этой улице" }
