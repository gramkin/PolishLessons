notes:
  - { kind: false-friend, text: "Корень тот же, что в русском «тугом»: POTĘGA идёт от TĘGI «крепкий, тугой», и носовое Ę отвечает русскому У, как в WĘZEŁ и «узле». Отсюда и образ: могущество это крепость, натянутость. Русское «натуга» и «туго» того же гнезда. Третье значение, математическое, русскому неожиданно: PODNIEŚĆ DO POTĘGI значит «возвести в степень», а не «в мощь»." }
  - { kind: usage, text: "Десять форм, женский род. В дательном и местном падеже единственного числа G переходит в DZ: POTĘGA, но W POTĘDZE. Это то же чередование, что в NOGA — NODZE и в русском «нога — ноге», только польский меняет согласный сильнее. Множественное POTĘGI работает в двух смыслах сразу: о великих державах и о математических степенях, и различает их только контекст." }
  - { kind: government, text: "Возвести в степень — PODNIEŚĆ DO POTĘGI, предлог DO с родительным, тогда как русский говорит «в степень», с винительным. Это расхождение стоит запомнить, потому что оборот встречается в каждом учебнике. Переносно DO POTĘGI значит «в высшей степени»: GŁUPOTA DO POTĘGI это «глупость в квадрате». Стать державой — STAĆ SIĘ POTĘGĄ, творительный после STAĆ SIĘ." }
  - { kind: pronunciation, text: "Читается «поте́нга», три слога, ударение на втором. Носовое Ę перед G даёт «эн», как и в RĘKA «рэнка» и KRĘGOSŁUP «крэнго́суп». В дательном и местном падеже POTĘDZE сочетание DZ даёт слитное «дз», и слышно «поте́ндзе». В прилагательном POTĘŻNY носовое остаётся, а Ż даёт «ж»: «поте́нжны»." }
  - { kind: register, text: "Слово книжное и газетное: POTĘGA GOSPODARCZA «экономическая держава», POTĘGA MILITARNA, POTĘGA SŁOWA «сила слова». В школьном языке оно техническое и ежедневное: DRUGA POTĘGA «вторая степень», PODNIEŚĆ DO KWADRATU. Разговорный оборот DO POTĘGI усиливает любое слово и звучит с иронией: BAŁAGAN DO POTĘGI значит «бардак в квадрате»." }
collocations:
  - { pl: "potęga gospodarcza", ru: "экономическая держава" }
  - { pl: "podnieść do potęgi", ru: "возвести в степень" }
