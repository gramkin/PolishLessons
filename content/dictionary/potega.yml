etymology: "От TĘGI «крепкий, тугой», от праславянского корня TĘG-, давшего русские «тугой», «туго», «натуга» и «тяга». Образ прозрачен: могущество это натянутая, напряжённая сила. Носовое Ę польского отвечает русскому У, и та же пара видна в WĘZEŁ и «узле». Математическое значение калькировано с латинского POTENTIA в эпоху, когда учёные писали по-латыни, и русский взял для него другое слово, «степень»."
memory: "Корень тот же, что в русском «тугом» и «натуге»: potęga от tęgi «крепкий», и носовое ę отвечает русскому у, как в węzeł и «узле». Могущество увидено как натянутая сила. Неожиданное третье значение математическое: podnieść do potęgi это «возвести в степень», причём с предлогом do и родительным, где русский берёт винительный. Читается «поте́нга», а в местном падеже w potędze."
idioms:
  - { pl: "do potęgi", ru: "в степени; в высшей степени, в квадрате" }
