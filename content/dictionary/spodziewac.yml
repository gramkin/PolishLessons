# review
id: spodziewac
format: 2
lemma: "spodziewać"
rank: 793
pos: verb
aspect: imperf
pron: { cyr: "сподзе́ваць" }
senses:
  - id: expect
    ru: "ожидать, ждать (чего-л.)"
    note: "Требует родительного падежа: spodziewam się listu «жду письма»."
    examples:
      - pl: "Spodziewam się kogoś."
        ru: "Я кое-кого жду."
        source: { kind: translated, id: 6324460 }
      - pl: "Nie spodziewaliśmy się tego."
        ru: "Мы этого не ожидали."
        source: { kind: translated, id: 13453525 }
      - pl: "Musimy spodziewać się najgorszego."
        ru: "Мы должны ожидать худшего."
        source: { kind: translated, id: 531056 }
  - id: expect-baby
    ru: "spodziewać się dziecka — ждать ребёнка"
    note: "Устойчивый оборот, точно как русское «ждать ребёнка»."
    examples:
      - pl: "Layla spodziewa się dziecka."
        ru: "Лейла ждёт ребёнка."
        source: { kind: translated, id: 6441623 }
      - pl: "Spodziewała się dziecka na wiosnę."
        ru: "Она ждала ребёнка весной."
        source: { kind: authored }
      - pl: "Rodzice spodziewają się drugiego dziecka."
        ru: "Родители ждут второго ребёнка."
        source: { kind: authored }
  - id: expected
    ru: "spodziewany — ожидаемый"
    note: "Причастие в роли прилагательного: spodziewany wzrost cen."
    examples:
      - pl: "Spodziewany jest wzrost temperatury."
        ru: "Ожидается повышение температуры."
        source: { kind: translated, id: 3887835 }
      - pl: "Wzrost PKB w drugim kwartale był wyższy od spodziewanego."
        ru: "Рост ВВП во втором квартале был выше ожидаемого."
        source: { kind: translated, id: 749131 }
      - pl: "Pożyczył dużą sumę pieniędzy na konto spodziewanego zysku."
        ru: "Он занял крупную сумму в счёт ожидаемой прибыли."
        source: { kind: translated, id: 365224 }
notes:
  - { kind: government, text: "spodziewać się требует родительного падежа: spodziewam się listu «жду письма», spodziewali się deszczu «ждали дождя». Русский управляет так же." }
  - { kind: usage, text: "Глагол всегда употребляется с się — формы без неё не существует. Частица свободно ходит по предложению: Czego się spodziewasz? и Spodziewasz się czegoś?" }
  - { kind: usage, text: "Устойчивое spodziewać się dziecka значит «ждать ребёнка»; kobieta spodziewająca się dziecka — «беременная женщина»." }
  - { kind: usage, text: "Причастие spodziewany значит «ожидаемый»: spodziewany wzrost cen. Безличное spodziewano się — «ожидали»." }
collocations:
  - { pl: "spodziewać się dziecka", ru: "ждать ребёнка" }
  - { pl: "spodziewać się najgorszego", ru: "ожидать худшего" }
  - { pl: "spodziewam się, że...", ru: "я ожидаю, что..." }
  - { pl: "czego się spodziewasz?", ru: "чего ты ждёшь?" }
family:
  - { pl: "nadzieja", ru: "надежда", relation: root }
  - { pl: "spodziewany", ru: "ожидаемый", relation: derived }
  - { pl: "niespodzianka", ru: "сюрприз", relation: derived }
etymology: "Приставка s- плюс podziewać, от праславянского *děti «деть, класть» — тот же корень, что в nadzieja «надежда» и niespodzianka «сюрприз». «Ожидать» выросло из «возлагать надежду»."
memory: "spodziewać się — всегда с się и всегда с родительным падежом: spodziewam się listu, spodziewali się deszczu — ровно как русское «жду письма». Устойчивое spodziewać się dziecka значит «ждать ребёнка», а kobieta spodziewająca się dziecka — «беременная женщина». Причастие spodziewany — «ожидаемый»: spodziewany wzrost cen. Корень тот же, что в nadzieja «надежда»."
idioms:
  - { pl: "spodziewać się dziecka", ru: "ждать ребёнка" }
  - { pl: "spodziewać się najgorszego", ru: "ожидать худшего" }
  - { pl: "nikt się tego nie spodziewał", ru: "никто этого не ожидал" }
