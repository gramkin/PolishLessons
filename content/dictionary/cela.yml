etymology: "Из латинского CELLA «малая комната, кладовая», от глагола CELARE «скрывать, прятать», то есть исходно это место, где что-то спрятано. От того же латинского слова идут английское CELL, итальянское CELLA и, через греческое KELLION, русская «келья» — так что польское CELA и русская «келья» это одно и то же слово, пришедшее двумя разными дорогами, западной и восточной. Русская «камера» другого происхождения, из латинского CAMERA «сводчатое помещение», через немецкое посредство. Корень CELARE родственен и слову «целла» в описаниях античных храмов, где так называли внутреннее, скрытое помещение."
memory: "Одно слово на два русских: cela więzienna — «камера», cela zakonna — «келья». С русской «кельей» это буквально одно слово, пришедшее с запада, тогда как «камера» — из другого латинского корня. Читать C перед E как «ц»: «цэ́ля». Родительный и местный единственного совпадают, celi; родительный множественного cel — и он совпадает с формами слова cel «цель», так что o celach двусмысленно. Биологическая клетка — не cela, а komórka."
idioms:
  - { pl: "cela więzienna", ru: "тюремная камера" }
  - { pl: "osadzić w celi", ru: "поместить в камеру" }
