notes:
  - { kind: false-friend, text: "Один польский CELA отвечает двум русским словам. Тюремное помещение по-русски «камера», монашеское — «келья», и выбирать приходится по контексту: CELA WIĘZIENNA это «камера», CELA ZAKONNA это «келья». Любопытно, что русские слова тоже латинские, только взяты из разных: «камера» из CAMERA «сводчатая комната», «келья» из того же CELLA, что и польское слово, но через греческое посредство. Вторая ловушка в родительном множественного: CEL совпадает с формами слова CEL «цель», и предложение O CELACH можно прочесть и как «о камерах», и как «о целях». Различает только контекст, и это один из немногих случаев, где польский сам допускает двусмысленность." }
  - { kind: government, text: "Женский род на -A после мягкой L. Родительный единственного CELI совпадает с местным: BEZ CELI и W CELI. Винительный на -Ę: ZAMKNĘLI CELĘ. Родительный множественного CEL, без окончания. Где находится — предлог W с местным: W CELI, W CELACH. Куда ведут — предлог DO с родительным: WPROWADZONO GO DO CELI. Откуда выводят — Z с родительным: WYPROWADZALI GO Z CELI. Притяжательное определение ставится после существительного: CELA NUMER SIEDEM." }
  - { kind: pronunciation, text: "Читается «цэ́ля», ударение на предпоследнем слоге из двух. Буква C перед E даёт «ц», а не «к» и не «с»: это общее правило польского и главное отличие от латинского написания, которое русский может помнить по слову «целла». Буква L мягкая всегда, отсюда «ля», а не «ла». В родительном и местном CELI звучит «цэ́ли». В родительном множественного CEL один слог: «цэль», с мягким л на конце." }
  - { kind: usage, text: "Устойчивые сочетания стоит держать парами, потому что именно они снимают двусмысленность: CELA WIĘZIENNA «тюремная камера», CELA ZAKONNA «монашеская келья», CELA POJEDYNCZA «одиночная камера», OSADZIĆ W CELI «поместить в камеру». Производных у слова почти нет; биологическая клетка это не CELA, а KOMÓRKA, и в этом польский расходится с английским CELL. Для пчелиной соты тоже своё слово, KOMÓRKA PLASTRA. Так что CELA осталась при двух значениях, тюремном и монастырском, и за их пределы не выходит." }
