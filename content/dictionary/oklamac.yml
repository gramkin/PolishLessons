# review
id: oklamac
format: 2
lemma: "okłamać"
rank: 1897
pos: verb
aspect: perf
pron: { cyr: "окуа́маць" }
senses:
  - id: lie-to
    ru: "обмануть, солгать кому-либо"
    examples:
      - pl: "Okłamał mnie."
        ru: "Он меня обманул."
        source: { kind: translated, id: 352666 }
      - pl: "Okłamał nas."
        ru: "Он нас обманул."
        source: { kind: translated, id: 564060 }
      - pl: "Okłamałeś mnie."
        ru: "Ты меня обманул."
        source: { kind: translated, id: 2587242 }
      - pl: "Okłamała mnie."
        ru: "Она меня обманула."
        source: { kind: translated, id: 3875549 }
      - pl: "Okłamałem cię."
        ru: "Я тебя обманул."
        source: { kind: translated, id: 5879292 }
      - pl: "Mój ojciec mnie okłamał."
        ru: "Мой отец меня обманул."
        source: { kind: translated, id: 12905444 }
  - id: regret
    ru: "в извинениях и обещаниях"
    examples:
      - pl: "Bardzo cię przepraszam, że cię okłamałem."
        ru: "Прости меня, пожалуйста, за то, что я тебя обманул."
        source: { kind: translated, id: 3686888 }
      - pl: "Przysięgam, że nigdy więcej cię nie okłamię."
        ru: "Клянусь, что больше никогда тебя не обману."
        source: { kind: translated, id: 13521391 }
      - pl: "Nigdy Cię nie okłamałem."
        ru: "Я никогда тебя не обманывал."
        source: { kind: translated, id: 10542380 }
notes:
  - { kind: government, text: "Требует винительного падежа лица: okłamać kogoś «обмануть кого-то», а не «кому-то». Okłamał mnie «Он меня обманул»." }
  - { kind: usage, text: "Совершенный вид к okłamywać. Рядом стоит kłamać «лгать», но оно непереходное: kłamie «он лжёт», без дополнения." }
  - { kind: usage, text: "Разница с карточкой kłamstwo: kłamstwo — «ложь» как вещь, okłamać — действие, направленное на человека." }
  - { kind: government, text: "Обманывают в польском винительным падежом: okłamać kogoś, okłamał mnie. Русское «солгать кому-то» с дательным сюда не переносится — сказать okłamał mi нельзя." }
collocations:
  - { pl: "okłamać kogoś", ru: "обмануть кого-либо" }
  - { pl: "okłamał mnie", ru: "он меня обманул" }
  - { pl: "nie okłamię cię", ru: "я тебя не обману" }
etymology: "o- + kłamać «лгать», от kłam «ложь». Приставка o- здесь означает «охватить действием», как в русском «обмануть» от «манить». Русское «клевета» — того же праславянского гнезда, что kłamać."
memory: "okłamać kogoś — «обмануть кого-то», обязательно с винительным падежом: Okłamał mnie «Он меня обманул». Само по себе kłamać значит просто «лгать», без дополнения."
idioms:
