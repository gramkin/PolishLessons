# review
id: istota
format: 2
lemma: "istota"
rank: 1610
pos: noun
pron: { cyr: "исто́та" }
senses:
  - id: being
    ru: "существо (живое)"
    examples:
      - pl: "Człowiek to istota świadoma."
        ru: "Человек — существо сознательное."
        source: { kind: translated, id: 639803 }
      - pl: "Każda istota ma instynkt samozachowawczy."
        ru: "У каждого существа есть инстинкт самосохранения."
        source: { kind: translated, id: 349311 }
      - pl: "Istnieją, według ciebie, istoty pozaziemskie?"
        ru: "По-твоему, существуют внеземные существа?"
        source: { kind: translated, id: 4717737 }
  - id: essence
    ru: "суть, сущность"
    examples:
      - pl: "Wolność osobista to istota demokracji."
        ru: "Свобода личности — душа демократии."
        source: { kind: tatoeba, id: 357274 }
      - pl: "W tym właśnie istota rzeczy."
        ru: "В этом и суть дела."
        source: { kind: translated, id: 730504 }
      - pl: "Istotą matematyki jest wolność."
        ru: "Суть математики — свобода."
        source: { kind: translated, id: 351331 }
  - id: in-fact
    ru: "w istocie — на самом деле, в сущности"
    examples:
      - pl: "W istocie."
        ru: "В сущности, да."
        source: { kind: translated, id: 12567730 }
      - pl: "W istocie nie jesteś głupi."
        ru: "На самом деле ты не глупый."
        source: { kind: translated, id: 366575 }
      - pl: "Myśli, że jest kimś, ale w istocie jest nikim."
        ru: "Он думает, что он кто-то, но на самом деле он никто."
        source: { kind: translated, id: 365600 }
notes:
  - { kind: usage, text: "Два основных значения: «живое существо» (istota ludzka «человеческое существо») и «суть» (istota rzeczy «суть дела»). Различает контекст." }
  - { kind: usage, text: "w istocie — застывшее наречие «на самом деле, в сущности». Все примеры этой формы в корпусе — именно оно." }
  - { kind: usage, text: "Образовано от istnieć «существовать» — отсюда оба значения: и «то, что существует», и «то, что составляет существо дела»." }
  - { kind: usage, text: "Прилагательное — istotny «существенный, важный»." }
collocations:
  - { pl: "istota ludzka", ru: "человеческое существо" }
  - { pl: "istota rzeczy", ru: "суть дела" }
  - { pl: "w istocie", ru: "на самом деле" }
etymology: "От istnieć «существовать», праславянское *jьst- «тот самый, подлинный». Русские «существо» и «сущность» построены от «есть, суть» — та же логика: назвать через бытие."
memory: "istota — и «существо» (istota ludzka «человеческое существо»), и «суть» (istota rzeczy «суть дела»). А w istocie — застывшее «на самом деле». Корень от istnieć «существовать»."
idioms:
  - { pl: "w istocie", ru: "на самом деле" }
  - { pl: "istota rzeczy", ru: "суть дела" }
  - { pl: "istota ludzka", ru: "человеческое существо" }
