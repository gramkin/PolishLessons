# review
id: praktycznie
format: 2
lemma: "praktycznie"
rank: 2414
pos: adv
pron: { cyr: "практы́чне" }
senses:
  - id: practically
    ru: "практически, почти"
    examples:
      - pl: "Praktycznie nikt tego nie czyta."
        ru: "Практически никто это не читает."
        source: { kind: authored }
      - pl: "To rozwiązanie jest praktycznie darmowe."
        ru: "Это решение практически бесплатное."
        source: { kind: authored }
  - id: in-a-practical-way
    ru: "практично, по-деловому"
    examples:
      - pl: "Myśl praktycznie, nie teoretycznie."
        ru: "Думай практично, а не теоретически."
        source: { kind: authored }
      - pl: "Urządzili mieszkanie praktyczniej niż my."
        ru: "Они обставили квартиру практичнее нас."
        source: { kind: authored }
  - id: in-practice
    ru: "на практике, на деле"
    examples:
      - pl: "Teoretycznie wolno, praktycznie nie."
        ru: "Теоретически можно, на практике нет."
        source: { kind: authored }
notes:
  - { kind: usage, text: "У ЭТОГО НАРЕЧИЯ ДВА ЗНАЧЕНИЯ, И СТЕПЕНИ СРАВНЕНИЯ ЕСТЬ ТОЛЬКО У ОДНОГО. В смысле «почти» (praktycznie nikt) сравнить нельзя: нельзя быть «почти-ее». А в смысле «практично, удобно» можно: praktyczniej, najpraktyczniej. Поэтому формы praktyczniej всегда о способе действия, а не о степени приближения." }
  - { kind: false-friend, text: "Русское «практически» в значении «почти» звучит слегка разговорно, а польское praktycznie в этом смысле совершенно нейтрально и очень частотно: praktycznie gotowe, praktycznie za darmo. Переводить его лучше словом «почти», а не «практически», иначе фраза выйдет тяжелее оригинала." }
  - { kind: pronunciation, text: "Три слога, ударение на предпоследнем: prak-TY-cznie. Cz читается как ч, ni как нь: «практы́чне». В сравнительной praktyczniej ударение тоже на предпоследнем: prak-tycz-NIEJ, точнее prak-TYCZ-niej." }
collocations:
  - { pl: "praktycznie nikt", ru: "практически никто" }
  - { pl: "praktycznie gotowe", ru: "практически готово" }
  - { pl: "praktycznie za darmo", ru: "практически бесплатно" }
family:
  - { pl: "praktyczny", ru: "практичный", relation: root }
  - { pl: "praktyka", ru: "практика", relation: root }
  - { pl: "teoretycznie", ru: "теоретически", relation: antonym }
etymology: "От praktyczny, из греческого praktikos «деятельный», от prassein «делать». Через латынь practicus слово попало во все европейские языки, дав и русское «практический». Польское наречие на -ie отвечает русскому на -и."
memory: "praktycznie чаще всего значит не «практически», а просто «почти»: praktycznie nikt «почти никто». Степени сравнения praktyczniej и najpraktyczniej относятся только ко второму смыслу — «удобнее, практичнее»."
idioms:
  - { pl: "praktycznie rzecz biorąc", ru: "практически говоря" }
  - { pl: "praktycznie za darmo", ru: "почти даром" }
