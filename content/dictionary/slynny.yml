notes:
  - { kind: false-friend, text: "Русскому SŁYNNY не подсказывает «знаменитый», а корень знаком: SŁYNĄĆ — «славиться», родня русского «слыть» и «слух». SŁYNNY — «тот, о ком идёт слух». Синоним SŁAWNY, «прославленный», звучит чуть торжественнее. ZNANY — просто «известный», без оттенка славы." }
  - { kind: usage, text: "Полная парадигма: SŁYNNY, SŁYNNIEJSZY, NAJSŁYNNIEJSZY. Превосходная степень особенно частотна: NAJSŁYNNIEJSZY POLAK, NAJSŁYNNIEJSZE DZIEŁO. Форма для мужчин-людей: SŁYNNI, SŁYNNIEJSI, NAJSŁYNNIEJSI." }
  - { kind: government, text: "Знаменитый чем-то — SŁYNNY Z + родительный: SŁYNNY Z URODY, «знаменитый своей красотой». Тот же Z у глагола: SŁYNĄĆ Z CZEGOŚ, «славиться чем-то». Русское «славится чем» с творительным здесь не работает." }
  - { kind: pronunciation, text: "Читается «суы́нны», два слога, ударение на первом. Ł — «у», Y — «ы», и выходит «суы». Двойное NN тянется. В SŁYNNIEJSZY: «суынне́йшы»." }
  - { kind: register, text: "Нейтральное слово, частое в путеводителях и журналистике: SŁYNNY ZAMEK, SŁYNNA KATEDRA. С иронией — «пресловутый»: TEN TWÓJ SŁYNNY PRZYJACIEL, «этот твой пресловутый друг»." }
