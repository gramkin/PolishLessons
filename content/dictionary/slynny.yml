etymology: "От SŁYNĄĆ «славиться», общеславянского *slynǫti, родственного русскому «слыть», «слух», «слава». Знаменитый — тот, о ком слышно. Польское Ł на месте русского «л» перед Y — то же соответствие, что в SŁYSZEĆ, «слышать»."
memory: "Słynny — знаменитый: słynny aktor, najsłynniejszy Polak. Słynny z czegoś — с родительным. От słynąć — славиться, родня «слыть». Читается «суы́нны»."
