notes:
  - { kind: false-friend, text: "РОДСТВЕННИК ЕСТЬ, ПРОСТО В РУССКОМ ОН ОТСТУПИЛ НА ОКРАИНУ. Польское chować отвечает русскому «ховать», которое уцелело в говорах и в украинском «ховати». Один польский глагол покрывает сразу три русских — «прятать», «растить» и «хоронить», — и какое из них имеется в виду, подсказывает только дополнение: chować klucze, chować dzieci, chować zmarłych." }
  - { kind: usage, text: "ЛОВУШКА СПРЯЖЕНИЯ, И ОНА СЕРЬЁЗНАЯ. Глагол кончается на -ować, но по правилу -ować НЕ спрягается: не «chowuję», а chowam, chowasz, chowa. Дело в том, что -owa- здесь часть корня, а не суффикс. Сравните pracować → pracuję, zaplanować → zaplanuję, oszukiwać → oszukuję, где суффикс настоящий, с chować → chowam. Правило -ować даёт -uj- почти всегда, но chować и schować из него выпадают." }
  - { kind: government, text: "Прячут ЧТО — винительный: chować klucze, pieniądze, dokumenty. ГДЕ — w с предложным (chować w szufladzie) или pod с творительным (chować pod łóżkiem). ОТ КОГО — przed с творительным: chować coś przed matką. Вот здесь русский расходится: по-русски «прятать ОТ матери», с родительным, а по-польски przed matką, с творительным. Калька с «от» невозможна." }
  - { kind: pronunciation, text: "ch читается как х, w как в: «хо́ваць». Ударение на предпоследнем слоге во всех формах, и при удлинении слова оно послушно едет вправо: chowaliśmy — «хова́лишмы», chowalibyśmy — «ховали́бышмы»." }
