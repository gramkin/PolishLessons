etymology: "Из праславянского *xovati «беречь, прятать». В русском корень отступил в говоры («ховать») и литературного продолжения не получил. Польский же удержал целое поле разом: прятать, беречь, растить и погребать. Русское «хоронить», при всей близости смысла, восходит к ДРУГОМУ корню, *xorniti, — тому самому, что дал польское chronić «защищать» и русское «хранить». Отсюда schować, schowek «тайник», wychować «воспитать», pochówek «погребение»."
memory: "chować — один глагол на три русских: «прятать», «растить» и «хоронить». Родня у него диалектное «ховать»; а похожее по смыслу «хоронить» — на самом деле другой корень, тот, что в chronić и «хранить». И не попадитесь на спряжении: несмотря на -ować, здесь chowam, а не «chowuję»."
idioms:
