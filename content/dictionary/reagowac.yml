etymology: "Из латинского RE-AGERE «действовать в ответ», через немецкое REAGIEREN, которым и польский, и русский воспользовались в девятнадцатом веке как языком науки. Но оформили заимствование по-разному. Польский присоединил свой продуктивный суффикс -OWAĆ, тот же, что в PRACOWAĆ и KUPOWAĆ, и получил REAGOWAĆ. Русский взял немецкое -IEREN вместе с глаголом и превратил его в -ИРОВАТЬ, получив «реагировать» на слог длиннее. Отсюда главное практическое следствие: польская форма всегда короче русской на этот слог, и REAGIROWAĆ сказать нельзя. Существительное REAKCJA пришло тем же путём от латинского REACTIO, и в нём польское -CJA отвечает русскому -ЦИЯ так же регулярно: REAKCJA и «реакция», LEKCJA и «лекция»."
memory: "Класс на -owaĆ: инфинитив reagować, но основа настоящего времени на -uj-: reaguję, reagujesz, reaguje. Русский делает то же самое («реагировать», но «реагирую»), так что правило уже знакомо. Польское -owaĆ отвечает русскому -ИРОВАТЬ: organizować, kontrolować, planować. Отсюда главная ошибка, которой надо избегать: польская форма на слог короче, reagirować не существует. Управление совпадает с русским полностью: reagować na coś, а в химии reagować z czymś."
