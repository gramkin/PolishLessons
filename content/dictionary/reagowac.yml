notes:
  - { kind: usage, text: "Глагол относится к классу на -OWAĆ, и у этого класса в настоящем времени меняется основа: инфинитив REAGOWAĆ, но REAGUJĘ, REAGUJESZ, REAGUJE. Суффикс -OWA- уходит, на его место приходит -UJ-. Русскому это знакомо: «реагировать», но «реагирую», «реагируешь» — тоже смена основы, тоже перед личными окончаниями. Поэтому форму REAGUJĘ не нужно заучивать как исключение, достаточно знать правило: все глаголы на -OWAĆ спрягаются так, и их в польском несколько тысяч. Так же ведут себя ORGANIZOWAĆ и ORGANIZUJĘ, KONTROLOWAĆ и KONTROLUJĘ, PRACOWAĆ и PRACUJĘ." }
  - { kind: government, text: "На что реагировать — предлог NA с винительным: REAGOWAĆ NA PYTANIE, NA HAŁAS, NA ZMIANY. Это в точности русское управление, «реагировать на что», и здесь ошибиться трудно. В химии другое управление: реагировать с чем-то — предлог Z с творительным, REAGOWAĆ Z WODĄ, и русское «реагировать с водой» опять совпадает. Прямого дополнения глагол не имеет вовсе, поэтому страдательного причастия у него нет, и в наборе его действительно нет: формы REAGOWANY не существует. Наречия ставятся перед глаголом: SZYBKO REAGOWAĆ «быстро реагировать», OSTRO REAGOWAĆ «резко реагировать»." }
  - { kind: pronunciation, text: "Читается «рэаго́ваць», четыре слога, ударение на предпоследнем, то есть на GO. Буква E в первом слоге это всегда «э», без смягчения предыдущего согласного: «рэ», а не «ре». Два гласных подряд в REA- произносятся раздельно, «рэ-а», без звука «й» между ними. Конечное -AĆ это «аць» с мягким Ć. В формах настоящего времени основа другая: REAGUJĘ звучит «рэагу́е» с лёгким носовым на конце, REAGUJESZ — «рэагу́еш»." }
  - { kind: false-friend, text: "Польское -OWAĆ в заимствованиях отвечает русскому -ИРОВАТЬ, и это соответствие работает на сотнях слов: REAGOWAĆ и «реагировать», ORGANIZOWAĆ и «организовать», KONTROLOWAĆ и «контролировать», PLANOWAĆ и «планировать», RYZYKOWAĆ и «рисковать». Польский берёт латинскую основу и добавляет свой -OWAĆ там, где русский вставляет немецкое по происхождению -ИРОВАТЬ. Зная правило, русскоязычный учащийся образует польский глагол от знакомого корня сам, и ошибка будет только одна, но типичная: сказать REAGIROWAĆ, перенеся лишний слог из русского. Такого слога в польском нет." }
