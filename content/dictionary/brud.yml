pos: noun
pron: { cyr: "брут" }
senses:
  - id: dirt
    ru: "грязь (на вещах)"
    examples:
      - pl: "Pod paznokciami miał brud."
        ru: "Под ногтями у него была грязь."
        source: { kind: authored }
      - pl: "W kuchni był straszny brud."
        ru: "На кухне была ужасная грязь."
        source: { kind: authored }
      - pl: "Ten proszek usuwa każdy brud."
        ru: "Этот порошок удаляет любую грязь."
        source: { kind: authored }
  - id: laundry
    ru: "грязное бельё (BRUDY, мн.)"
    examples:
      - pl: "Wrzuć brudy do pralki."
        ru: "Закинь грязное бельё в стиральную машину."
        source: { kind: authored }
      - pl: "Kosz na brudy stoi w łazience."
        ru: "Корзина для грязного белья стоит в ванной."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "BRUD — «грязь» на вещах, руках, в доме. Грязь на дороге, слякоть — BŁOTO. Во множественном BRUDY — «грязное бельё», и в переносном смысле: PRAĆ BRUDY PUBLICZNIE, «выносить сор из избы»." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Родительный — BRUDU, в местном D переходит в DZ: W BRUDZIE." }
  - { kind: government, text: "В грязи — W BRUDZIE, местный. Отмыть от грязи — DOMYĆ Z BRUDU. Корзина для белья — KOSZ NA BRUDY, NA с винительным." }
  - { kind: pronunciation, text: "Читается «брут», один слог. Конечное D оглушается в «т»." }
collocations:
  - { pl: "kosz na brudy", ru: "корзина для грязного белья" }
  - { pl: "usunąć brud", ru: "удалить грязь" }
  - { pl: "żyć w brudzie", ru: "жить в грязи" }
family:
  - { pl: "brudny", ru: "грязный", relation: derived, id: brudny }
  - { pl: "brudzić", ru: "пачкать", relation: derived }
  - { pl: "ubrudzić", ru: "испачкать", relation: derived }
etymology: "Старое западнославянское слово для грязи; в русском на его месте «грязь». От него BRUDNY «грязный» и BRUDZIĆ «пачкать»."
memory: "Brud — грязь на вещах; błoto — грязь на дороге. Brudy — грязное бельё. Читается «брут». Prać brudy publicznie — выносить сор из избы."
idioms:
  - { pl: "prać brudy publicznie", ru: "выносить сор из избы" }
formExamplesSkip:
  - { form: "brudzie", cell: "Звательный", reason: "звательный падеж: для неодушевлённого существительного он практически не употребляется" }
