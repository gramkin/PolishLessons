# review
id: wspolny
format: 2
lemma: "wspólny"
rank: 550
pos: adj
pron: { cyr: "фспу́льны" }
senses:
  - id: common
    ru: "общий, совместный"
    note: "wspólny język «общий язык», wspólna kuchnia «общая кухня»."
    examples:
      - pl: "Muzyka to wspólny język ludzkości."
        ru: "Музыка - общий язык для всего человечества."
        source: { kind: tatoeba, id: 525580 }
      - pl: "Od razu znaleźliśmy wspólny język."
        ru: "Мы сразу нашли общий язык."
        source: { kind: translated, id: 13655521 }
      - pl: "W akademiku jest wspólna kuchnia."
        ru: "В общежитии общая кухня."
        source: { kind: translated, id: 3762235 }
  - id: nothing-common
    ru: "nie mieć nic wspólnego — не иметь ничего общего"
    note: "mieć coś wspólnego z czymś «иметь отношение к чему-либо»."
    examples:
      - pl: "Nie mamy ze sobą nic wspólnego."
        ru: "У нас нет ничего общего."
        source: { kind: tatoeba, id: 827819 }
      - pl: "Zaprzeczył, by miał coś wspólnego z tym wypadkiem."
        ru: "Он отрицал, что имел отношение к этому происшествию."
        source: { kind: tatoeba, id: 448873 }
      - pl: "Te plotki nie miały nic wspólnego z rzeczywistością."
        ru: "Эти сплетни не имели ничего общего с действительностью."
        source: { kind: tatoeba, id: 12574244 }
  - id: joint
    ru: "wspólnymi siłami — общими силами"
    note: "О совместном действии."
    examples:
      - pl: "Wspólnymi siłami pokonaliśmy problemy."
        ru: "Общими силами мы одолели трудности."
        source: { kind: translated, id: 818763 }
      - pl: "Skończyli obraz wspólnymi siłami."
        ru: "Они закончили картину общими усилиями."
        source: { kind: translated, id: 999254 }
      - pl: "Podjęli wspólną decyzję o rozwodzie."
        ru: "Они приняли совместное решение о разводе."
        source: { kind: translated, id: 1632581 }
notes:
  - { kind: usage, text: "Степеней сравнения у слова нет: сказать *wspólniejszy нельзя. Усиливают наречием — zupełnie wspólny, całkowicie wspólny." }
  - { kind: government, text: "mieć coś wspólnego z czymś — «иметь отношение к чему-либо», с z и творительным: nie ma nic wspólnego z tym wypadkiem." }
  - { kind: usage, text: "Оборот znaleźć wspólny język совпадает с русским «найти общий язык» дословно." }
  - { kind: usage, text: "Частые сочетания: wspólne interesy «общие интересы», wspólna granica «общая граница», wspólnymi siłami «общими силами»." }
collocations:
  - { pl: "wspólny język", ru: "общий язык" }
  - { pl: "nic wspólnego", ru: "ничего общего" }
  - { pl: "wspólnymi siłami", ru: "общими силами" }
  - { pl: "wspólna granica", ru: "общая граница" }
family:
  - { pl: "społem", ru: "вместе", relation: root }
  - { pl: "społeczeństwo", ru: "общество", relation: derived }
  - { pl: "wspólnota", ru: "сообщество", relation: derived }
etymology: "От старого spólny, связанного со społem «вместе» — тот же корень, что в русском «сообща»; отсюда же społeczeństwo «общество» и wspólnota «сообщество»."
memory: "wspólny — «общий, совместный», и степеней сравнения у него нет: *wspólniejszy сказать нельзя. Два оборота стоит запомнить дословно: znaleźć wspólny język «найти общий язык» — совпадает с русским слово в слово — и nie mieć nic wspólnego z czymś «не иметь ничего общего с чем-то», с z и творительным. Ещё одно: wspólnymi siłami «общими силами»."
idioms:
  - { pl: "wspólny język", ru: "общий язык" }
  - { pl: "nie mieć nic wspólnego", ru: "не иметь ничего общего" }
  - { pl: "wspólnymi siłami", ru: "общими силами" }
