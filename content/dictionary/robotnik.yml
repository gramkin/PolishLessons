# review
id: robotnik
format: 2
lemma: "robotnik"
rank: 4830
pos: noun
pron: { cyr: "робо́тник" }
senses:
  - id: worker
    ru: "рабочий"
    examples:
      - pl: "Robotnicy budują nowy most."
        ru: "Рабочие строят новый мост."
        source: { kind: authored }
      - pl: "Pracuje jako robotnik w fabryce."
        ru: "Он работает рабочим на заводе."
        source: { kind: authored }
      - pl: "Robotnik w kasku nosił cegły."
        ru: "Рабочий в каске носил кирпичи."
        source: { kind: authored }
      - pl: "Szukamy robotników do pracy przy zbiorach."
        ru: "Мы ищем рабочих на сбор урожая."
        source: { kind: authored }
      - pl: "Ojciec był robotnikiem całe życie."
        ru: "Отец всю жизнь был рабочим."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ROBOTNIK — «рабочий», человек физического труда, а не любой «работник». Сотрудник, работник фирмы — PRACOWNIK. Сама работа по-польски обычно PRACA, а ROBOTA — разговорное: MAM DUŻO ROBOTY, «у меня куча работы»." }
  - { kind: usage, text: "Десять форм, мужской род, лицо. Во множественном K переходит в C: ROBOTNICY. Винительный множественного равен родительному: ZATRUDNIĆ ROBOTNIKÓW. Работница — ROBOTNICA, это слово значит и «рабочая пчела»." }
  - { kind: government, text: "Работать рабочим — PRACOWAĆ JAKO ROBOTNIK, после JAKO именительный, или BYĆ ROBOTNIKIEM, творительный. Нанять рабочих — ZATRUDNIĆ ROBOTNIKÓW, родительный в роли винительного." }
  - { kind: pronunciation, text: "Читается «робо́тник», ударение на предпоследнем слоге. Все O — чистое «о», без русского аканья: не «рабо́тник»." }
  - { kind: register, text: "Слово нейтральное, с историческим и политическим оттенком: KLASA ROBOTNICZA — «рабочий класс», ROBOTNICY STOCZNI GDAŃSKIEJ — рабочие Гданьской верфи, с которых началась «Солидарность»." }
collocations:
  - { pl: "robotnik budowlany", ru: "строительный рабочий" }
  - { pl: "robotnik sezonowy", ru: "сезонный рабочий" }
  - { pl: "klasa robotnicza", ru: "рабочий класс" }
family:
  - { pl: "robota", ru: "работа (разг.)", relation: root, id: robota }
  - { pl: "robić", ru: "делать", relation: root, id: robic }
  - { pl: "robotniczy", ru: "рабочий (прил.)", relation: derived }
etymology: "От ROBOTA «работа». Польскому RO- отвечает русское «ра-»: ROBOTA — «работа». Старое значение — подневольный труд, барщина. Из чешского родственника этого слова взято и «робот»."
memory: "Robotnik — рабочий: robota «работа», robić «делать». Читается «робо́тник». Pracownik — сотрудник. Robotnicy — рабочие. Klasa robotnicza — рабочий класс."
idioms:
  - { pl: "robota pali się w rękach", ru: "работа спорится" }
