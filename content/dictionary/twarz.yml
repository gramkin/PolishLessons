notes:
  - { kind: false-friend, text: "twarz — «лицо». Слово того же праславянского корня *tvarь «творение, облик» (от tworzyć «творить»), что и русская «тварь», но значения разошлись до неузнаваемости." }
  - { kind: usage, text: "stracić twarz — «потерять лицо», zachować twarz — «сохранить лицо», powiedzieć w twarz — «сказать в лицо»." }
  - { kind: usage, text: "rysy twarzy — «черты лица»; zmienić się na twarzy — «измениться в лице»." }
collocations:
  - { pl: "okrągła twarz", ru: "круглое лицо" }
  - { pl: "stracić twarz", ru: "потерять лицо" }
  - { pl: "w twarz", ru: "в лицо" }
  - { pl: "rysy twarzy", ru: "черты лица" }
etymology: "Праславянское *tvarь «творение, облик», от tworzyć «творить»; русское «тварь» — то же слово, но значения разошлись полностью."
memory: "twarz — «лицо», того же корня, что русская «тварь» (от «творить»), только значения разошлись. Stracić twarz значит «потерять лицо»."
idioms:
