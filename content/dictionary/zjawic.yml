# review
id: zjawic
format: 2
lemma: "zjawić"
rank: 1955
pos: verb
pron: { cyr: "зья́виць" }
senses:
  - id: turn-up
    ru: "явиться, появиться (часто неожиданно)"
    examples:
      - pl: "Zjawił się bez zapowiedzi."
        ru: "Он явился без предупреждения."
        source: { kind: authored }
      - pl: "Zjawiła się w samą porę."
        ru: "Она явилась как раз вовремя."
        source: { kind: authored }
      - pl: "Zjaw się o ósmej."
        ru: "Явись к восьми."
        source: { kind: authored }
  - id: show-up
    ru: "прийти, явиться куда-л. (по обязанности)"
    examples:
      - pl: "Musisz się zjawić w sądzie."
        ru: "Ты должен явиться в суд."
        source: { kind: authored }
      - pl: "Nikt się nie zjawił na rozprawie."
        ru: "Никто не явился на заседание."
        source: { kind: authored }
  - id: arrival
    ru: "zjawienie — появление, явление"
    examples:
      - pl: "Jego zjawienie się wszystkich zaskoczyło."
        ru: "Его появление всех застало врасплох."
        source: { kind: authored }
      - pl: "Po zjawieniu się policji tłum się rozszedł."
        ru: "После появления полиции толпа разошлась."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "КОРЕНЬ, КОТОРЫЙ У ВАС УЖЕ ЕСТЬ. Польское jaw- — это русское яв-. Jawa значит «явь», na jawie — «наяву», zjawisko — «явление», objaw — «симптом, проявление», jawny — «явный». Отсюда и оба глагола появления: pojawić się «появиться» и zjawić się «явиться»." }
  - { kind: usage, text: "В современном языке глагол употребляется ТОЛЬКО возвратно: zjawić się. Переходное zjawić «явить» вышло из употребления и осталось в книжных и церковных текстах, поэтому страдательных форм вроде zjawiony на карточке нет — они принадлежат той устаревшей разновидности. Несовершенная пара — zjawiać się." }
  - { kind: register, text: "Разница с pojawić się та же, что между русскими «появиться» и «явиться». Pojawił się na zebraniu — просто пришёл. Zjawił się na zebraniu — пришёл внезапно, незваным или с опозданием, и говорящий это подчёркивает. Zjaw się o ósmej звучит как требование, а не приглашение." }
  - { kind: government, text: "Место — предлог w или na с ПРЕДЛОЖНЫМ падежом: zjawić się w sądzie, na rozprawie, w drzwiach. К людям — u: zjawił się u nas po północy. Совпадает с русским «явиться в суд», только польский ставит предложный там, где русский винительный." }
collocations:
  - { pl: "zjawić się bez zapowiedzi", ru: "явиться без предупреждения" }
  - { pl: "zjawić się w samą porę", ru: "явиться как раз вовремя" }
  - { pl: "zjawić się w sądzie", ru: "явиться в суд" }
family:
  - { pl: "pojawiać", ru: "появляться", relation: root, id: pojawiac }
  - { pl: "zjawisko", ru: "явление", relation: derived }
  - { pl: "zjawa", ru: "призрак, видение", relation: derived }
etymology: "Приставка z- плюс jawić от jawa «явь» — тот же корень, что в русских «явь», «явиться», «наяву». Русское «явиться» и польское zjawić się построены из одного материала, и даже оттенок внезапности у них общий. Отсюда же zjawisko «явление» и zjawa «призрак»."
memory: "zjawić się — «явиться», и это буквально русское слово: корень jaw- равен яв-. Оттенок тоже русский — являются внезапно или по обязанности, а просто приходят через pojawić się. Глагол живёт только с się."
idioms:
  - { pl: "zjawić się jak duch", ru: "явиться как призрак" }
  - { pl: "zjawić się w samą porę", ru: "явиться как раз вовремя" }
