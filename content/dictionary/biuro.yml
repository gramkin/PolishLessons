  - id: bureau
    ru: "бюро, учреждение"
    examples:
      - pl: "Przychody biur turystycznych gwałtownie wzrosły."
        ru: "Доходы туристических бюро резко выросли."
        source: { kind: translated, id: 945830 }
      - pl: "Mój dom jest jednocześnie moim biurem."
        ru: "Мой дом одновременно и мой офис."
