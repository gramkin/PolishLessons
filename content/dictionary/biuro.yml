notes:
  - { kind: false-friend, text: "biuro — это прежде всего «офис, контора», а не только «бюро». w biurze значит «на работе, в офисе», do biura — «в офис»." }
  - { kind: usage, text: "biuro podróży — «турагентство», biuro rzeczy znalezionych — «бюро находок»." }
  - { kind: usage, text: "Слово французское (bureau, изначально «сукно на столе»). Русское «бюро» — то же заимствование, только у поляков оно повседневное." }
  - { kind: usage, text: "Средний род: to biuro, tego biura, w tym biurze." }
collocations:
  - { pl: "w biurze", ru: "в офисе" }
  - { pl: "do biura", ru: "в офис" }
  - { pl: "biuro podróży", ru: "турагентство" }
  - { pl: "biuro rzeczy znalezionych", ru: "бюро находок" }
etymology: "Из французского bureau «канцелярия», а изначально — «сукно, которым накрывали стол». Русское «бюро» — то же самое заимствование."
memory: "biuro — «офис, контора», а не только «бюро». Слово французское, и русское «бюро» это то же заимствование, но у поляков оно повседневное: w biurze значит «на работе»."
idioms:
