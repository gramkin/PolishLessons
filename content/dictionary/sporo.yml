# review
id: sporo
format: 2
lemma: "sporo"
rank: 2420
pos: adv
pron: { cyr: "спо́ро" }
senses:
  - id: quite-a-lot
    ru: "немало, порядочно, довольно много"
    examples:
      - pl: "Zostało sporo czasu."
        ru: "Осталось немало времени."
        source: { kind: authored }
      - pl: "Sporo ludzi czekało przed wejściem."
        ru: "Немало людей ждало перед входом."
        source: { kind: authored }
  - id: a-fair-amount
    ru: "изрядно, прилично (о количестве)"
    examples:
      - pl: "Kosztowało to sporo."
        ru: "Стоило это прилично."
        source: { kind: authored }
      - pl: "Przeszli sporo kilometrów."
        ru: "Они прошли изрядно километров."
        source: { kind: authored }
  - id: considerably
    ru: "значительно, заметно"
    examples:
      - pl: "Zrobiło się sporo cieplej."
        ru: "Стало значительно теплее."
        source: { kind: authored }
notes:
  - { kind: government, text: "КАК ВСЕ СЛОВА КОЛИЧЕСТВА, SPORO ТРЕБУЕТ РОДИТЕЛЬНОГО: sporo czasu, sporo ludzi, sporo pieniędzy — ровно как dużo и mało. И подлежащее при нём среднего рода единственного числа: sporo ludzi CZEKAŁO, а не czekali. Русский строит так же: «немало людей ждало»." }
  - { kind: register, text: "Sporo мягче и разговорнее, чем dużo: оно значит «немало, порядочно», с оттенком «больше, чем ждали». Там, где русский скажет «довольно много» или «изрядно», поляк скажет sporo. Степени sporzej и najsporzej существуют, но звучат старомодно и в городской речи почти не встречаются." }
  - { kind: pronunciation, text: "Два слога, ударение на первом: SPO-ro. Читается почти как русское «споро»: «спо́ро». Совпадение не случайно — это одно и то же слово." }
collocations:
  - { pl: "sporo czasu", ru: "немало времени" }
  - { pl: "sporo ludzi", ru: "немало людей" }
  - { pl: "sporo kosztować", ru: "стоить прилично" }
family:
  - { pl: "spory", ru: "изрядный, немалый", relation: root, id: spory }
  - { pl: "dużo", ru: "много", relation: root, id: duzo }
  - { pl: "mało", ru: "мало", relation: antonym, id: malo }
etymology: "От spory «изрядный, обильный», из праславянского *sporъ «обильный, спорый». Тот же корень в русском «спорый» и «спориться»: работа спорится значит идёт обильно и успешно. Дальше он восходит к тому же индоевропейскому корню, что латинское prosperus «процветающий»."
memory: "sporo — «немало, порядочно», мягче, чем dużo, и требует родительного: sporo czasu. Русское «споро» — то же самое слово: вспомни «работа спорится», то есть идёт обильно."
idioms:
  - { pl: "sporo wody upłynęło", ru: "немало воды утекло" }
  - { pl: "mieć sporo do powiedzenia", ru: "иметь немало что сказать" }
