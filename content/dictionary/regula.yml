notes:
  - { kind: false-friend, text: "Русское «правило» покрывает сразу несколько польских слов, и выбрать нужное — главная трудность. REGUŁA — это правило внутри системы: правило грамматики, правило игры, монашеский устав. ZASADA — принцип, основа, то, чем человек руководствуется: CZŁOWIEK Z ZASADAMI «человек с принципами». PRZEPIS — предписание, норма закона, а ещё рецепт блюда: PRZEPIS NA SZARLOTKĘ. PRAWIDŁO — слово редкое и в современном языке означает скорее колодку для обуви. Поэтому «правила дорожного движения» будут PRZEPISY RUCHU DROGOWEGO, а не REGUŁY." }
  - { kind: pronunciation, text: "Читается «рэгу́уа», ударение на предпоследнем слоге. Буква Ł даёт «у», а не «л», поэтому не «регула», а «рэгу́уа» — и это та же ловушка, что в WYSIŁEK «выси́уэк». В местном и дательном падеже REGULE буква Ł исчезает вовсе: перед окончанием -E она переходит в L, и форма звучит «рэгу́ле», мягко. Чередование Ł и L перед -E сквозное: SZKOŁA и SZKOLE, STOŁEK и STOLE." }
  - { kind: usage, text: "Оборот Z REGUŁY значит «как правило, обычно» и стоит того, чтобы выучить его отдельно от существительного: он частотнее самого слова и в разговоре, и в письме. Другие устойчивые сочетания: REGUŁY GRY «правила игры», в том числе переносно, REGUŁA ZAKONNA «монашеский устав», BEZ REGUŁ «без правил». Прилагательное — REGULARNY «регулярный», и глагол REGULOWAĆ «регулировать»: оба заимствованы от того же латинского корня и в русском существуют в том же виде." }
  - { kind: government, text: "Женский род на -A, склоняется правильно. Винительный на -Ę: ZNAM TĘ REGUŁĘ. При отрицании винительный уходит в родительный: NIE ZNAM TEJ REGUŁY. Исключение вводится предлогом OD с родительным: WYJĄTEK OD REGUŁY «исключение из правила» — обратите внимание, русский говорит «из правила», польский «от правила», и предлог придётся переучить. Соответствие чему-то — предлог ZGODNIE Z с творительным: ZGODNIE Z REGUŁĄ «согласно правилу»." }
collocations:
  - { pl: "z reguły", ru: "как правило, обычно" }
  - { pl: "reguły gry", ru: "правила игры" }
  - { pl: "wyjątek od reguły", ru: "исключение из правила" }
family:
  - { pl: "zasada", ru: "принцип, основа", relation: root, id: zasada }
  - { pl: "przepis", ru: "предписание; рецепт", relation: root, id: przepis }
  - { pl: "regularny", ru: "регулярный", relation: derived }
etymology: "Из латинского REGULA «прямая палка, линейка, мерило», от REGERE «направлять, править» — того же корня, что REX «царь» и польское REGULOWAĆ, REGULARNY, а также русские «регулировать» и «регулярный». Образ здесь предметный: правило — это линейка, по которой выравнивают. Русский в этом месте пошёл другим путём и построил своё слово от «правый, правильный», то есть калькой того же смысла, но из своего материала: «правило» — то, что делает прямым. Так что польское и русское слова значат одно, но собраны из разного: польское взято у Рима целиком, русское переведено по частям."
memory: "Правило внутри системы: грамматики, игры, монашеский устав. Принцип — zasada, норма закона и рецепт — przepis. Оборот z reguły «как правило» частотнее самого слова. Исключение — wyjątek OD reguły, не «из». Читается «рэгу́уа», ł даёт «у», а в regule переходит в мягкое l."
idioms:
  - { pl: "z reguły", ru: "как правило, обычно" }
  - { pl: "wyjątek od reguły", ru: "исключение из правила" }
