# review
id: automatyczny
format: 2
lemma: "automatyczny"
rank: 5280
pos: adj
pron: { cyr: "аутоматы́чны" }
senses:
  - id: automatic
    ru: "автоматический (работающий сам)"
    examples:
      - pl: "Drzwi automatyczne otworzyły się same."
        ru: "Автоматические двери открылись сами."
        source: { kind: authored }
      - pl: "Ma samochód z automatyczną skrzynią biegów."
        ru: "У него машина с автоматической коробкой передач."
        source: { kind: authored }
      - pl: "System wysyła automatyczne powiadomienia."
        ru: "Система рассылает автоматические уведомления."
        source: { kind: authored }
  - id: reflexive
    ru: "машинальный, непроизвольный"
    examples:
      - pl: "To była automatyczna reakcja, nie myślałem."
        ru: "Это была машинальная реакция, я не думал."
        source: { kind: authored }
      - pl: "Jego uśmiech był automatyczny i pusty."
        ru: "Его улыбка была машинальной и пустой."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Значение совпадает с русским «автоматический», но звучит иначе: польское AU — это дифтонг «ау», а не русское «ав». Русское «автомат» — AUTOMAT, «автобус» — AUTOBUS, «автор» — AUTOR. Автоматическое оружие — BROŃ AUTOMATYCZNA, а сам автомат — AUTOMAT или KARABIN AUTOMATYCZNY." }
  - { kind: usage, text: "Относительное прилагательное, степеней сравнения нет. Формы для мужчин-людей AUTOMATYCZNI в карточке нет: автоматическими бывают машины и реакции, а не люди. Остальные десять форм живые. Наречие AUTOMATYCZNIE — «автоматически, машинально»." }
  - { kind: government, text: "Обычно стоит после существительного в технических названиях: SKRZYNIA AUTOMATYCZNA, PRALKA AUTOMATYCZNA, SEKRETARKA AUTOMATYCZNA. Перед существительным — в описаниях: AUTOMATYCZNA ODPOWIEDŹ, AUTOMATYCZNE DRZWI. Падежных требований нет." }
  - { kind: pronunciation, text: "Читается «аутоматы́чны», пять слогов, ударение на предпоследнем. AU — дифтонг «ау», одним слогом, без русского «ав». TY — твёрдое «ты», CZ — «ч». Сравните с AUTOMAT «ауто́мат»." }
  - { kind: register, text: "Нейтральное техническое слово. В разговоре коробку-автомат называют просто AUTOMAT: JEŹDZI AUTOMATEM. SEKRETARKA AUTOMATYCZNA, «автоответчик», сейчас звучит старомодно, как и сам автоответчик." }
collocations:
  - { pl: "skrzynia automatyczna", ru: "автоматическая коробка передач" }
  - { pl: "sekretarka automatyczna", ru: "автоответчик" }
  - { pl: "automatyczna odpowiedź", ru: "автоматический ответ" }
family:
  - { pl: "automat", ru: "автомат", relation: root, id: automat }
  - { pl: "automatycznie", ru: "автоматически, машинально", relation: derived }
  - { pl: "automatyzacja", ru: "автоматизация", relation: derived }
etymology: "Из греческого autómatos, «действующий сам по себе»: autós «сам» и корень со значением «стремиться, двигаться». Тот же autós — в AUTO, AUTOGRAF, AUTOBIOGRAFIA. Польский сохранил греческое AU как дифтонг, а русский превратил его в «ав» через позднегреческое произношение."
memory: "Automatyczny — автоматический: drzwi automatyczne, skrzynia automatyczna. И машинальный: automatyczna reakcja. Au — «ау», не «ав»: аутоматы́чны."
idioms:
  - { pl: "działać na automacie", ru: "действовать на автомате" }
formExamplesSkip:
  - { form: "automatyczni", reason: "форма для мужчин-людей: людей так не описывают" }
