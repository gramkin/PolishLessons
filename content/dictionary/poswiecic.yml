# review
id: poswiecic
format: 2
lemma: "poświęcić"
rank: 1560
pos: verb
aspect: perf
pron: { cyr: "посьве́нциць" }
senses:
  - id: devote
    ru: "посвятить (жизнь, время); уделить"
    examples:
      - pl: "Poświęcił swoje życie nauce."
        ru: "Он посвятил свою жизнь науке."
        source: { kind: translated, id: 676857 }
      - pl: "Poświęciła życie nauce."
        ru: "Она посвятила жизнь науке."
        source: { kind: tatoeba, id: 967603 }
      - pl: "Czy możesz poświęcić mi kilka minut?"
        ru: "Можешь уделить мне несколько минут?"
        source: { kind: tatoeba, id: 1361823 }
  - id: sacrifice
    ru: "пожертвовать"
    examples:
      - pl: "Tom poświęcił dla was wszystko."
        ru: "Том всем ради вас пожертвовал."
        source: { kind: tatoeba, id: 10747477 }
      - pl: "Ten żołnierz poświęcił własne życie by ratować przyjaciela."
        ru: "Солдат пожертвовал собственной жизнью, чтобы спасти друга."
        source: { kind: tatoeba, id: 608822 }
      - pl: "Poświęciła się dla swojej chorej matki."
        ru: "Она пожертвовала собой ради своей больной матери."
        source: { kind: translated, id: 1110337 }
notes:
  - { kind: government, text: "Посвятить что чему — poświęcić coś czemuś: винительный плюс дательный. Poświęcił życie nauce «Он посвятил жизнь науке» — совпадает с русским." }
  - { kind: usage, text: "С się глагол значит «посвятить себя, отдаться чему-то»: poświęcić się badaniom «посвятить себя исследованиям»." }
  - { kind: usage, text: "Второе значение — «пожертвовать»: poświęcić życie «пожертвовать жизнью». Существительное poświęcenie значит и «посвящение», и «жертва, самоотверженность»." }
  - { kind: usage, text: "Несовершенный вид — poświęcać. Причастие poświęcony значит «посвящённый» и «уделённый»: dziękuję za poświęcony czas «спасибо за уделённое время»." }
collocations:
  - { pl: "poświęcić życie", ru: "посвятить жизнь" }
  - { pl: "poświęcić czas", ru: "уделить время" }
  - { pl: "poświęcić się", ru: "посвятить себя" }
etymology: "Приставка po- + święcić «святить», от święty «святой» — буквально «освятить, отдать святому делу». Русское «посвятить» собрано ровно так же, от «свят», и сохранило оба значения."
memory: "poświęcić = «посвятить» и «пожертвовать», и собрано слово как русское: po- + święty «святой». Poświęcił życie nauce «посвятил жизнь науке», но poświęcić życie значит и «пожертвовать жизнью». Уделить время — poświęcić czas."
idioms:
  - { pl: "poświęcić życie", ru: "посвятить жизнь" }
  - { pl: "poświęcić czas", ru: "уделить время" }
  - { pl: "poświęcić się dla kogoś", ru: "пожертвовать собой ради кого-то" }
formExamplesSkip:
  - { form: "poświęciwszy", reason: "книжное деепричастие, в корпусе примеров нет" }
