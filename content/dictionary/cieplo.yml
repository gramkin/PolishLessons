etymology: "Общеславянский корень, тот же, что в русском «тёплый», «тепло». Польское CIE на месте русского ТЕ: CIEPŁO — «тепло»."
memory: "Ciepło — тепло, и существительное, и наречие. W cieple — в тепле. Ciepło domowe — домашний уют. Читается «це́пуо»."
