        ru: "Дом держит тепло всю ночь."
        source: { kind: authored }
  - id: affection
    ru: "теплота, сердечность"
    examples:
      - pl: "W jej głosie było dużo ciepła."
        ru: "В её голосе было много теплоты."
        source: { kind: authored }
      - pl: "Dzieci potrzebują ciepła i uwagi."
        ru: "Детям нужны тепло и внимание."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "CIEPŁO — и существительное «тепло», и наречие: JEST CIEPŁO, «тепло». Как существительное склоняется: BRAK CIEPŁA, «нехватка тепла». Тёплый — CIEPŁY. Жара — UPAŁ, а не CIEPŁO." }
  - { kind: usage, text: "Средний род. Учим единственное: CIEPŁO, CIEPŁA, CIEPŁU, CIEPŁEM, CIEPLE. В местном Ł переходит в L: W CIEPLE, «в тепле»." }
  - { kind: government, text: "В тепле — W CIEPLE, местный: TRZYMAĆ W CIEPLE, «держать в тепле». Нехватка тепла — BRAK CIEPŁA, родительный. Отдавать тепло — ODDAWAĆ CIEPŁO." }
  - { kind: pronunciation, text: "Читается «це́пуо»: CIE — мягкое «це», Ł — «у». Ударение на первом слоге. CIEPLE — «це́пле»." }
collocations:
  - { pl: "ciepło domowe", ru: "домашний уют" }
  - { pl: "w cieple", ru: "в тепле" }
  - { pl: "ciepło ludzkie", ru: "человеческое тепло" }
