# review
id: rozszerzac
format: 2
lemma: "rozszerzać"
rank: 5886
pos: verb
aspect: imperf
pron: { cyr: "росшэ́жаць" }
senses:
  - id: widen
    ru: "расширять, делать шире"
    examples:
      - pl: "Ciepło rozszerza większość rzeczy."
        ru: "Тепло расширяет большинство тел."
        source: { kind: translated, id: 12239940 }
      - pl: "Drogowcy rozszerzają ulicę o jeden pas."
        ru: "Дорожники расширяют улицу на одну полосу."
        source: { kind: authored }
  - id: extend
    ru: "расширять (охват, круг, ассортимент)"
    examples:
      - pl: "Firma rozszerza ofertę o nowe usługi."
        ru: "Фирма расширяет предложение за счёт новых услуг."
        source: { kind: authored }
      - pl: "Sieć tramwajowa jest rozszerzana."
        ru: "Трамвайную сеть расширяют."
        source: { kind: translated, id: 12229080 }
  - id: expand
    ru: "rozszerzać się — расширяться"
    examples:
      - pl: "Nasz wszechświat rozszerza się."
        ru: "Наша Вселенная расширяется."
        source: { kind: tatoeba, id: 12239972 }
      - pl: "Woda rozszerza się podczas zamarzania."
        ru: "Вода расширяется при замерзании."
        source: { kind: translated, id: 10546226 }
      - pl: "W ciemności źrenice się rozszerzają."
        ru: "В темноте зрачки расширяются."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Несовершенный вид; совершенный — ROZSZERZYĆ. Спряжение на -AM: ROZSZERZAM, ROZSZERZASZ, ROZSZERZAJĄ. С SIĘ — «расширяться»: WSZECHŚWIAT SIĘ ROZSZERZA. Мужско-личное страдательное ROZSZERZANI в карточку не включено: расширяют дороги, программы и границы, а не людей." }
  - { kind: government, text: "Что расширяют — винительный: ROZSZERZAĆ OFERTĘ. На что, за счёт чего — O + винительный: ROZSZERZAĆ UNIĘ O NOWE KRAJE «расширять союз за счёт новых стран». Вот этого O русский язык не подсказывает." }
  - { kind: usage, text: "Близкий синоним — POSZERZAĆ; он чаще о кругозоре и знаниях: POSZERZAĆ WIEDZĘ. ROZSZERZAĆ шире по охвату: о дорогах, физике, бизнесе, программах. В школе ROZSZERZONY — «углублённый»: MATEMATYKA ROZSZERZONA «профильная математика»." }
  - { kind: pronunciation, text: "Читается «росшэ́жаць»: Z перед SZ оглушается и сливается с ним в долгое «ш». RZ после гласной — звонкое «ж»." }
collocations:
  - { pl: "rozszerzać ofertę", ru: "расширять ассортимент" }
  - { pl: "rozszerzać działalność", ru: "расширять деятельность" }
  - { pl: "rozszerzać się pod wpływem ciepła", ru: "расширяться от тепла" }
family:
  - { pl: "rozszerzyć", ru: "расширить", relation: aspect }
  - { pl: "szeroki", ru: "широкий", relation: root, id: szeroki }
  - { pl: "rozszerzenie", ru: "расширение", relation: derived }
  - { pl: "poszerzać", ru: "расширять, раздвигать", relation: root }
  - { pl: "zwężać", ru: "сужать", relation: antonym }
etymology: "Приставка ROZ- «раз-» плюс корень SZER- из SZEROKI «широкий»; буквально «раз-ширять», как русское «расширять»."
memory: "Rozszerzać — «раз-ширять»: szeroki «широкий», и русское «расширять» строится так же."
idioms:
  - { pl: "rozszerzać horyzonty", ru: "расширять кругозор" }
  - { pl: "jak gospodarz gościnny, to i ściany się rozszerzają", ru: "в тесноте, да не в обиде (досл. «у гостеприимного хозяина и стены раздвигаются»)" }
formExamplesSkip:
  - { form: "rozszerzani", reason: "мужско-личная форма страдательного причастия: расширяют дороги, программы и границы, а не людей" }
