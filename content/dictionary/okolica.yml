# review
id: okolica
format: 2
lemma: "okolica"
rank: 1146
pos: noun
pron: { cyr: "околи́ца" }
senses:
  - id: area
    ru: "окрестность, местность, район"
    examples:
      - pl: "Mieszkam w tej okolicy."
        ru: "Я живу в этой местности."
        source: { kind: translated, id: 929145 }
      - pl: "Ta okolica obfituje w atrakcje."
        ru: "Эта местность богата достопримечательностями."
        source: { kind: translated, id: 925841 }
      - pl: "Pokażę panu okolicę."
        ru: "Я покажу вам окрестности."
        source: { kind: translated, id: 555383 }
  - id: vicinity
    ru: "w okolicy — поблизости, в округе"
    examples:
      - pl: "W okolicy nie ma nikogo."
        ru: "В окрестностях никого нет."
        source: { kind: translated, id: 712454 }
      - pl: "Jest kilka domów w okolicy."
        ru: "Поблизости есть несколько домов."
        source: { kind: translated, id: 911568 }
  - id: approx
    ru: "w okolicach + время — около, примерно"
    examples:
      - pl: "Zasypiam w okolicach północy."
        ru: "Я засыпаю около полуночи."
        source: { kind: translated, id: 3191196 }
      - pl: "Padało w okolicach Chicago."
        ru: "В окрестностях Чикаго шёл дождь."
        source: { kind: translated, id: 3191198 }
notes:
  - { kind: usage, text: "Женский род: ta okolica, tej okolicy. Родительный, дательный и предложный совпадают — okolicy." }
  - { kind: usage, text: "w okolicy значит «поблизости, тут неподалёку»: Nie ma nikogo w okolicy «Поблизости никого нет»." }
  - { kind: usage, text: "w okolicach с указанием времени значит «около, примерно»: w okolicach północy «около полуночи». У русской «окрестности» такого употребления нет." }
  - { kind: usage, text: "Родственное okoliczność значит «обстоятельство» — буквально «то, что вокруг»." }
collocations:
  - { pl: "w okolicy", ru: "поблизости" }
  - { pl: "w okolicach", ru: "около, примерно" }
  - { pl: "cała okolica", ru: "вся округа" }
  - { pl: "okolice miasta", ru: "окрестности города" }
family:
  - { pl: "około", ru: "около", relation: root }
  - { pl: "okoliczność", ru: "обстоятельство", relation: derived }
  - { pl: "okoliczny", ru: "окрестный", relation: derived }
etymology: "От około «около, вокруг» — ровно как русская «окрестность» от «окрест». Слова собраны по одной модели и значат одно и то же."
memory: "okolica — «окрестность, местность, район». Оборот w okolicy значит «поблизости», а w okolicach с указанием времени — «около»: w okolicach północy «около полуночи»."
idioms:
