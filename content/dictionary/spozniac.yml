notes:
  - { kind: false-friend, text: "SPÓŹNIAĆ SIĘ — «опаздывать», корень PÓŹNO «поздно». Без SIĘ глагол почти не встречается. Часы по-польски тоже SPÓŹNIAJĄ SIĘ — «отстают», а «спешат» — ŚPIESZĄ SIĘ." }
  - { kind: usage, text: "Несовершенный вид; совершенный — SPÓŹNIĆ SIĘ «опоздать». Спряжение на -AM: SPÓŹNIAM SIĘ, SPÓŹNIASZ SIĘ, SPÓŹNIAJĄ SIĘ. Безличное SPÓŹNIANO в карточку не включено. Отглагольное SPÓŹNIANIE SIĘ — «опоздания» как привычка." }
  - { kind: government, text: "Куда — NA с винительным: SPÓŹNIAĆ SIĘ NA LEKCJĘ, NA POCIĄG. По-русски «опаздывать на урок» — так же. С чем — Z с творительным: SPÓŹNIAĆ SIĘ Z PŁATNOŚCIĄ. На сколько — O с винительным: O GODZINĘ." }
  - { kind: pronunciation, text: "Читается «спу́зьняць»: Ó — «у», Ź — «зь», NI — мягкое «нь». Ударение на первом слоге. SPÓŹNIAM SIĘ — «спу́зьням сен»." }
  - { kind: register, text: "Нейтральное бытовое слово. Вежливое извинение: PRZEPRASZAM ZA SPÓŹNIENIE «простите за опоздание»." }
collocations:
  - { pl: "spóźniać się na pociąg", ru: "опаздывать на поезд" }
  - { pl: "spóźniać się do pracy", ru: "опаздывать на работу" }
  - { pl: "zegarek się spóźnia", ru: "часы отстают" }
family:
  - { pl: "spóźnić", ru: "опоздать (SPÓŹNIĆ SIĘ)", relation: aspect, id: spoznic }
  - { pl: "spóźnienie", ru: "опоздание", relation: derived }
  - { pl: "późno", ru: "поздно", relation: root }
etymology: "От PÓŹNY «поздний» с приставкой S- и суффиксом -IAĆ: буквально «делаться поздним». Корень тот же, что в русском «поздно», «опоздать»."
memory: "Spóźniać się — опаздывать: zawsze się spóźniasz! Na co — na + винительный, как в русском. Часы отстают — zegarek się spóźnia."
