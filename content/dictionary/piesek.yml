notes:
  - { kind: usage, text: "В именительном падеже есть беглое e, которое исчезает во всех остальных формах: PIESEK, но PIESKA, PIESKU, PIESKIEM, PIESKI. Интересно здесь то, что гласных в слове две и ведут они себя по-разному. Исходное PIES тоже имеет беглое e и теряет его: pies — PSA. А в уменьшительном piesek первое ie уже закрепилось и не уходит, зато уходит e суффикса -ek. Так что одно и то же слово роняет разные гласные в зависимости от того, сколько у него слогов." }
  - { kind: usage, text: "Суффикс -EK — главный уменьшительный суффикс польского языка и работает без устали: pies — piesek, dom — domek, kot — kotek, chleb — chlebek, syn — synek. И всюду он приносит с собой беглое e: domek — domku, kotek — kotka. Русское -ик и -ок делают то же дело («пёсик», «домик», «котик»), только без выпадения гласной, так что это место приходится переучивать." }
  - { kind: usage, text: "Род у слова мужской одушевлённый второго разряда — тот, что для животных. Поэтому винительный падеж совпадает с родительным: WIDZĘ PIESKA «я вижу собачку», а не widzę piesek. Русский поступает точно так же со всеми одушевлёнными, поэтому ошибиться трудно. А вот мужская личная форма множественного этому разряду не положена: собачки будут PIESKI, не pieskowie, потому что эта форма существует только для людей." }
collocations:
  - { pl: "mały piesek", ru: "маленькая собачка" }
  - { pl: "wyprowadzić pieska", ru: "вывести собачку" }
  - { pl: "piesek pokojowy", ru: "комнатная собачка" }
family:
  - { pl: "pies", ru: "пёс, собака", relation: root, id: pies }
  - { pl: "psi", ru: "собачий", relation: derived }
etymology: "Уменьшительное от PIES, из праславянского *pьsъ — того же слова, что русский «пёс», с суффиксом -ek. Русское «пёсик» построено точно так же, только суффиксом -ик, и смысл у обоих один: небольшая или милая собака. Разница лишь в поведении гласных: польское слово роняет e суффикса во всех косвенных формах, русское не роняет ничего."
memory: "Беглое e из суффикса: piesek, но pieska, piesku. Одушевлённое, поэтому widzę pieska. И множественное pieski, а не pieskowie — та форма только для людей."
