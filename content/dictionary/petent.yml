# review
id: petent
format: 2
lemma: "petent"
rank: 5806
pos: noun
pron: { cyr: "пэ́тэнт" }
senses:
  - id: visitor
    ru: "посетитель (учреждения), заявитель, проситель"
    examples:
      - pl: "Petent złożył podanie o nowy dowód osobisty."
        ru: "Заявитель подал заявление на новое удостоверение личности."
        source: { kind: authored }
      - pl: "Urząd zamyka drzwi dla petentów o piętnastej."
        ru: "Учреждение закрывает двери для посетителей в пятнадцать часов."
        source: { kind: authored }
      - pl: "Obsługa petentów trwa do szesnastej."
        ru: "Приём граждан длится до шестнадцати часов."
        source: { kind: authored }
      - pl: "Kierownik przyjmuje petentów we wtorki."
        ru: "Начальник принимает посетителей по вторникам."
        source: { kind: authored }
      - pl: "Grzeczny petent szybciej załatwi sprawę."
        ru: "Вежливый посетитель быстрее решит своё дело."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "PETENT — не «патент» и не «претендент», а посетитель учреждения, тот, кто пришёл с просьбой или заявлением: OBSŁUGA PETENTÓW «приём граждан». Женщина — PETENTKA." }
  - { kind: usage, text: "Одушевлённое мужского рода: винительный PETENTA. Перед E и I согласная смягчается: PETENCI, местный и звательный PETENCIE." }
  - { kind: register, text: "Слово казённое, из языка учреждений. В быту чаще говорят KLIENT или INTERESANT." }
collocations:
  - { pl: "obsługa petentów", ru: "приём граждан" }
  - { pl: "przyjmować petentów", ru: "вести приём посетителей" }
  - { pl: "godziny przyjęć petentów", ru: "часы приёма граждан" }
family:
  - { pl: "petentka", ru: "посетительница, заявительница", relation: derived }
  - { pl: "klient", ru: "клиент", relation: root, id: klient }
  - { pl: "urząd", ru: "учреждение", relation: root, id: urzad }
etymology: "Из латинского PETENS, PETENTIS «просящий», от PETERE «просить, требовать»."
memory: "Petent просит (лат. PETERE): тот, кто стоит у окошка с заявлением."
