notes:
  - { kind: usage, text: "Самое полезное здесь — не слово, а приём. Там, где русский складывает слова с «кино-», польский ставит прилагательное после существительного: FESTIWAL FILMOWY — «кинофестиваль», GWIAZDA FILMOWA — «кинозвезда», MUZYKA FILMOWA — «киномузыка», PRZEMYSŁ FILMOWY — «киноиндустрия», SZKOŁA FILMOWA — «киношкола». Соединять по-русски нельзя: KINOFESTIWAL не существует. Запоминать стоит сам приём, потому что он работает и с другими прилагательными: STACJA KOLEJOWA «железнодорожная станция», SKLEP SPOŻYWCZY «продуктовый магазин»." }
  - { kind: pronunciation, text: "Читается «филмо́вы», с ударением на предпоследнем слоге. Буква l твёрдая, как всегда в польском, но перед m она звучит ближе к «ль», и оба чтения считаются приемлемыми в передаче. Буква y на конце — это «ы», поэтому не «фильмовый», а «филмо́вы». Мужско-личная форма множественного числа FILMOWI звучит «филмо́ви», с мягким wi, и употребляется в сочетании LUDZIE FILMOWI «кинематографисты»." }
  - { kind: government, text: "Прилагательное относительное: степеней сравнения у него нет, и одиннадцать форм — это полная картина, как у MIĘDZYNARODOWY, SERYJNY и OPERACYJNY. Своего управления нет, оно согласуется с существительным. Важен лишь порядок слов: в терминах прилагательное почти всегда идёт после существительного, FESTIWAL FILMOWY, а не FILMOWY FESTIWAL. В переносном значении, «как в кино», порядок свободнее и прилагательное часто стоит впереди: FILMOWE POŻEGNANIE." }
  - { kind: false-friend, text: "Русского «фильмовый» не существует, так что прямой пары нет и опереться на знакомое не получится. Зато стоит отделить FILMOWY от KINOWY. FILMOWY относится к фильму как к произведению: MUZYKA FILMOWA, SZTUKA FILMOWA. KINOWY относится к кинотеатру как к помещению: SALA KINOWA «кинозал», BILET KINOWY «билет в кино». По-русски и то, и другое чаще передают через «кино-», поэтому различие приходится держать в голове отдельно." }
