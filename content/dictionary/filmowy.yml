etymology: "От FILM, заимствованного из английского в начале двадцатого века, где FILM значило «плёнка, тонкий слой»: сначала так называли саму ленту, потом то, что на ней записано. Суффикс -OWY — исконный польский, образующий относительные прилагательные от существительных, и он же в MIĘDZYNARODOWY и KOLEJOWY. Русский в этой роли предпочёл сложение с «кино-», сокращённым от «кинематограф», и потому получил слитные слова там, где польский обходится двумя. Разница не в запасе слов, а в способе их соединять."
memory: "Там, где русский складывает с «кино-», польский ставит прилагательное после существительного: festiwal filmowy «кинофестиваль», gwiazda filmowa «кинозвезда». Степеней сравнения нет, 11 форм — это всё. И не путать с kinowy: sala kinowa — кинозал, muzyka filmowa — киномузыка."
