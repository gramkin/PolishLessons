# review
id: hotel
format: 2
lemma: "hotel"
rank: 741
pos: noun
pron: { cyr: "хо́тэль" }
senses:
  - id: hotel
    ru: "гостиница, отель"
    examples:
      - pl: "To jest hotel."
        ru: "Это гостиница."
        source: { kind: tatoeba, id: 935257 }
      - pl: "Tam jest hotel."
        ru: "Там есть отель."
        source: { kind: tatoeba, id: 5917016 }
      - pl: "To nie jest hotel."
        ru: "Это не отель."
        source: { kind: tatoeba, id: 13788366 }
  - id: to-hotel
    ru: "do hotelu — в гостиницу"
    examples:
      - pl: "Weź taksówkę do hotelu."
        ru: "Возьми такси до отеля."
        source: { kind: tatoeba, id: 382581 }
      - pl: "Nie wolno chodzić gołym po hotelu."
        ru: "Нельзя ходить по гостинице голым."
        source: { kind: tatoeba, id: 3460174 }
      - pl: "Idę do hotelu."
        ru: "Я иду в гостиницу."
        source: { kind: translated, id: 13206468 }
  - id: hotels
    ru: "hotele — гостиницы"
    examples:
      - pl: "W pewien weekend wszystkie hotele w mieście były pełne."
        ru: "В одни выходные все гостиницы в городе были заполнены."
        source: { kind: translated, id: 951353 }
      - pl: "Istnieją specjalne hotele dla psów, w których można zostawić psa na czas wakacji."
        ru: "Существуют особые гостиницы для собак, где можно оставить пса на время отпуска."
        source: { kind: translated, id: 12044169 }
      - pl: "W sezonie turystycznym wiele hoteli podnosi ceny."
        ru: "В туристический сезон многие гостиницы поднимают цены."
        source: { kind: translated, id: 2979595 }
  - id: at-hotel
    ru: "w hotelach — в гостиницах"
    examples:
      - pl: "Poza sezonem miejsca w hotelach są tańsze."
        ru: "Вне сезона места в гостиницах дешевле."
        source: { kind: translated, id: 1352180 }
      - pl: "Latem wielu młodych ludzi będzie pracować w tutejszych hotelach."
        ru: "Летом много молодёжи будет работать в здешних гостиницах."
        source: { kind: translated, id: 11523649 }
      - pl: "Czy jest autobus między hotelem a lotniskiem?"
        ru: "Есть ли автобус между гостиницей и аэропортом?"
        source: { kind: translated, id: 670321 }
notes:
  - { kind: usage, text: "У слова неожиданная родня. Французское hôtel восходит к латинскому hospes «гость», а от того же корня идут польские gość «гость», gospoda «трактир», gospodarz «хозяин» и даже szpital «больница». Гостиница и больница оказываются двоюродными." }
  - { kind: government, text: "do hotelu «в гостиницу» — родительный падеж; w hotelu «в гостинице» — предложный; przed hotelem «перед гостиницей» — творительный." }
  - { kind: usage, text: "Ходовое: zarezerwować hotel «забронировать гостиницу», recepcja «стойка регистрации», hotel pracowniczy «общежитие»." }
  - { kind: pronunciation, text: "Ударение, как всегда, на предпоследний слог: HO-tel. Конечное l мягкое, слово звучит «хо́тэль»." }
collocations:
  - { pl: "do hotelu", ru: "в гостиницу" }
  - { pl: "w hotelu", ru: "в гостинице" }
  - { pl: "zarezerwować hotel", ru: "забронировать гостиницу" }
  - { pl: "przed hotelem", ru: "перед гостиницей" }
family:
  - { pl: "gość", ru: "гость", relation: root }
  - { pl: "gospoda", ru: "трактир", relation: root }
  - { pl: "gospodarz", ru: "хозяин", relation: root }
  - { pl: "szpital", ru: "больница", relation: root }
etymology: "Французское hôtel из позднелатинского hospitale, от hospes «гость» — из того же праиндоевропейского корня, что gość, gospoda, gospodarz и szpital."
memory: "hotel — слово международное, но родня у него неожиданная: французское hôtel идёт от латинского hospes «гость», а от того же корня польские gość, gospoda, gospodarz и даже szpital. Гостиница и больница оказываются двоюродными. Управление обычное: do hotelu, w hotelu, przed hotelem."
idioms:
  - { pl: "zarezerwować hotel", ru: "забронировать гостиницу" }
  - { pl: "w hotelu", ru: "в гостинице" }
  - { pl: "do hotelu", ru: "в гостиницу" }
