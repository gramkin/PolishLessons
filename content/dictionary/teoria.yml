# review
id: teoria
format: 2
lemma: "teoria"
rank: 1377
pos: noun
pron: { cyr: "тэо́рья" }
senses:
  - id: theory
    ru: "теория (научная)"
    examples:
      - pl: "Eksperyment potwierdził jego teorię."
        ru: "Эксперимент подтвердил его теорию."
        source: { kind: tatoeba, id: 745262 }
      - pl: "Teoria bez praktyki jest bezużyteczna."
        ru: "Теория без практики бесполезна."
        source: { kind: translated, id: 2921151 }
      - pl: "Einsteina kojarzymy z teorią względności."
        ru: "Эйнштейна мы связываем с теорией относительности."
        source: { kind: translated, id: 1350680 }
  - id: guess
    ru: "предположение, догадка; умозрительное рассуждение"
    examples:
      - pl: "Mam teorię."
        ru: "У меня есть теория."
        source: { kind: translated, id: 2842002 }
      - pl: "W teorii jest to możliwe."
        ru: "В теории это возможно."
        source: { kind: translated, id: 13873630 }
notes:
  - { kind: usage, text: "Женский род на -ia, как magia и historia: родительный, дательный и предложный — teorii. W teorii значит «в теории, теоретически»." }
  - { kind: usage, text: "Творительный — teorią: z teorią względności «с теорией относительности»." }
  - { kind: false-friend, text: "В научном языке teoria — проверенная система знаний, а не «догадка». Для догадки точнее hipoteza или przypuszczenie, хотя в разговоре teoria годится и для неё." }
collocations:
  - { pl: "w teorii", ru: "в теории" }
  - { pl: "teoria względności", ru: "теория относительности" }
  - { pl: "teoria i praktyka", ru: "теория и практика" }
etymology: "Из греческого θεωρία «наблюдение, рассмотрение», через латынь. В русский «теория» пришла тем же книжным путём, поэтому слова совпадают почти буквально."
memory: "teoria — «теория», слово международное, и запоминать в нём надо только склонение на -ia: w teorii «в теории», z teorią «с теорией» — те же окончания, что у magia и historia."
idioms:
  - { pl: "w teorii", ru: "в теории, теоретически" }
  - { pl: "teoria względności", ru: "теория относительности" }
  - { pl: "teoria spiskowa", ru: "теория заговора" }
formExamplesSkip:
  - { form: "teoryj", reason: "дореформенный родительный падеж множественного числа: до 1936 года на месте нынешнего -ii писали -yj после c, s, z и -ij после g, k, l. Нормой сегодня остаётся teorii, а teoryj встречается только в старых текстах. По этому же основанию отказано формам terapij, technologij, reakcyj, racyj и seryj" }
