notes:
  - { kind: false-friend, text: "Русскому NIEZBĘDNY ничего не подсказывает, а слово частое: «необходимый, незаменимый». Собрано из NIE и ZBĘDNY, «лишний»: необходимое — то, что «не лишнее». Синоним KONIECZNY — «обязательный, неизбежный»: KONIECZNA ZMIANA. NIEZBĘDNY — о вещах и людях, без которых не обойтись. Русская поговорка «незаменимых людей нет» по-польски — NIE MA LUDZI NIEZASTĄPIONYCH." }
  - { kind: usage, text: "Полная парадигма: NIEZBĘDNY, NIEZBĘDNIEJSZY, NAJNIEZBĘDNIEJSZY. Степени редки, чаще в шутку. Мужское-личное: NIEZBĘDNI, NIEZBĘDNIEJSI, NAJNIEZBĘDNIEJSI — о незаменимых работниках." }
  - { kind: government, text: "Необходимый для чего-то — NIEZBĘDNY DO + родительный: NIEZBĘDNY DO ŻYCIA, DO PRACY. Необходимый кому-то — NIEZBĘDNY DLA KOGOŚ или KOMUŚ. Абсолютный минимум — NIEZBĘDNE MINIMUM." }
  - { kind: pronunciation, text: "Читается «незбэ́ндны», три слога, ударение на предпоследнем. ZB — звонкое, Ę перед D — «эн». В NIEZBĘDNIEJSZY: «незбэндне́йшы»." }
  - { kind: register, text: "Нейтральное слово, частое в инструкциях, науке и деловой речи: NIEZBĘDNE DOKUMENTY, NIEZBĘDNE WARUNKI. В разговоре — WAŻNY, POTRZEBNY." }
collocations:
  - { pl: "niezbędne minimum", ru: "необходимый минимум" }
  - { pl: "niezbędne dokumenty", ru: "необходимые документы" }
  - { pl: "niezbędny do życia", ru: "необходимый для жизни" }
family:
  - { pl: "zbędny", ru: "лишний", relation: root, id: zbedny }
  - { pl: "konieczny", ru: "необходимый, обязательный", relation: root, id: konieczny }
  - { pl: "niezbędnie", ru: "необходимо", relation: derived }
etymology: "Отрицание от ZBĘDNY «лишний», а то от ZBYĆ «избавиться». Необходимое — то, от чего нельзя «отделаться». Русское «необходимый» собрано по похожей логике: то, что «не обойти»."
memory: "Niezbędny — необходимый, незаменимый: niezbędny do życia, niezbędne rzeczy. Nie + zbędny (лишний). Niezbędne minimum — необходимый минимум. Читается «незбэ́ндны»."
idioms:
  - { pl: "niezbędne minimum", ru: "необходимый минимум" }
