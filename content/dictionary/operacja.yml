# review
id: operacja
format: 2
lemma: "operacja"
rank: 713
pos: noun
pron: { cyr: "опэра́цья" }
senses:
  - id: surgery
    ru: "операция (хирургическая)"
    examples:
      - pl: "Czeka pana operacja."
        ru: "Вас ждёт операция."
        source: { kind: translated, id: 363646 }
      - pl: "Potrzebuję operacji."
        ru: "Мне нужна операция."
        source: { kind: translated, id: 5961887 }
      - pl: "Twój brat doszedł do siebie po operacji."
        ru: "Твой брат оправился после операции."
        source: { kind: translated, id: 12044099 }
  - id: undergo
    ru: "mieć / przejść operację — перенести операцию"
    examples:
      - pl: "Miał operację."
        ru: "Ему сделали операцию."
        source: { kind: translated, id: 5961885 }
      - pl: "Przeszedł skomplikowaną operację."
        ru: "Он перенёс сложную операцию."
        source: { kind: authored }
      - pl: "Musi przejść operację serca."
        ru: "Ему предстоит операция на сердце."
        source: { kind: authored }
  - id: military
    ru: "операция (военная, полицейская)"
    examples:
      - pl: "Operacja wojskowa trwała trzy dni."
        ru: "Военная операция длилась три дня."
        source: { kind: authored }
      - pl: "Policja przeprowadziła operację o świcie."
        ru: "Полиция провела операцию на рассвете."
        source: { kind: authored }
      - pl: "To była operacja ratunkowa."
        ru: "Это была спасательная операция."
        source: { kind: authored }
  - id: technical
    ru: "операция (банковская, вычислительная)"
    examples:
      - pl: "Operacja bankowa nie doszła do skutku."
        ru: "Банковская операция не состоялась."
        source: { kind: authored }
      - pl: "Każda operacja jest zapisywana."
        ru: "Каждая операция записывается."
        source: { kind: authored }
      - pl: "To prosta operacja matematyczna."
        ru: "Это простая математическая операция."
        source: { kind: authored }
notes:
  - { kind: pronunciation, text: "Ударение, как всегда в польском, на предпоследнем слоге: opera-cja, «опэра́цья». Сочетание -cja читается слитно, одним слогом." }
  - { kind: government, text: "potrzebować требует родительного: Potrzebuję operacji «Мне нужна операция». Так же после bez i po: bez operacji, po operacji." }
  - { kind: usage, text: "Родительный множественного совпадает с родительным единственного — operacji. Устаревший вариант operacyj сегодня не употребляется." }
  - { kind: usage, text: "Готовые сочетания: mieć operację и przejść operację «перенести операцию», przeprowadzić operację «провести операцию»." }
collocations:
  - { pl: "przejść operację", ru: "перенести операцию" }
  - { pl: "przeprowadzić operację", ru: "провести операцию" }
  - { pl: "po operacji", ru: "после операции" }
  - { pl: "bez operacji", ru: "без операции" }
family:
  - { pl: "operować", ru: "оперировать", relation: root }
  - { pl: "operacyjny", ru: "операционный", relation: derived }
  - { pl: "pooperacyjny", ru: "послеоперационный", relation: derived }
etymology: "Через латинское operatio «работа, действие» от opus «труд» — то же заимствование, что русская «операция»."
memory: "operacja — «операция», и на ней держится целое правило: латинское -tio даёт в польском -cja там, где русский даёт -ция. Отсюда stacja, lekcja, informacja, operacja — все женского рода, все с родительным на -cji: operacji. Ударение на предпоследнем слоге: опэра́цья."
idioms:
  - { pl: "przejść operację", ru: "перенести операцию" }
  - { pl: "przeprowadzić operację", ru: "провести операцию" }
  - { pl: "operacja się udała, ale pacjent zmarł", ru: "операция прошла успешно, но пациент умер" }
formExamplesSkip:
  - { form: "operacjo", reason: "звательный падеж у неодушевлённого отвлечённого существительного не употребляется" }
  - { form: "operacyj", reason: "устаревший вариант родительного множественного; сегодня говорят operacji" }
