# review
id: przykrecic
format: 2
lemma: "przykręcić"
rank: 2094
pos: verb
aspect: perf
pron: { cyr: "пшыкрэ́ньциць" }
senses:
  - id: turn-down
    ru: "прикрутить, убавить (кран, отопление)"
    examples:
      - pl: "Przykręć trochę ogrzewanie."
        ru: "Прикрути немного отопление."
        source: { kind: translated, id: 13031754 }
      - pl: "Rosja chce przykręcić kurek z ropą dla Europy."
        ru: "Россия хочет прикрутить нефтяной кран для Европы."
        source: { kind: translated, id: 6156019 }
      - pl: "Przykręć gaz pod garnkiem."
        ru: "Прикрути газ под кастрюлей."
        source: { kind: authored }
  - id: cut-off
    ru: "перекрыть (деньги, поддержку) — переносное"
    examples:
      - pl: "Ojciec przykręcił mu kurek z pieniędzmi."
        ru: "Отец перекрыл ему денежный кран."
        source: { kind: translated, id: 6406240 }
      - pl: "Już drugi sponsor przykręcił kurek z pieniędzmi."
        ru: "Уже второй спонсор перекрыл денежный кран."
        source: { kind: translated, id: 6156021 }
notes:
  - { kind: usage, text: "Переносный оборот przykręcić kurek «перекрыть кран» — про деньги, газ, нефть — в корпусе встречается чаще буквального значения." }
  - { kind: government, text: "Винительный падеж: przykręcić śrubę «закрутить винт», przykręcić ogrzewanie «убавить отопление»." }
  - { kind: usage, text: "Несовершенный вид — przykręcać." }
  - { kind: false-friend, text: "Корень kręcić «крутить, вертеть» — ср. русское «крутить». Приставка przy- даёт «при-», как в «прикрутить»." }
  - { kind: government, text: "Страдательное причастие говорится о вещи: półka przykręcona do ściany, kran przykręcony do końca. Человек в обороте przykręcić komuś kurek стоит в дательном, поэтому формы przykręceni нет." }
collocations:
  - { pl: "przykręcić kurek", ru: "перекрыть кран" }
  - { pl: "przykręcić śrubę", ru: "закрутить винт" }
etymology: "przy- + kręcić «крутить», праславянское *krǫtiti; ср. русское «крутить», «прикрутить»."
memory: "przykręcić — «прикрутить, убавить». Чаще всего переносно: przykręcić kurek «перекрыть кран» про деньги или газ. Несовершенный вид — przykręcać."
idioms:
  - { pl: "przykręcić kurek", ru: "перекрыть кран" }
formExamplesSkip:
  - { form: "przykręceni", reason: "винительное дополнение у глагола — вещь: przykręcić śrubę, przykręcić ogrzewanie. В переносном обороте przykręcić komuś kurek человек стоит в дательном падеже, а не в винительном, поэтому мужско-личного страдательного причастия przykręceni язык не образует" }
