etymology: "Постройка слова неожиданная и стоит того, чтобы её разобрать. MAŁŻONEK идёт от старопольского MAŁŻONA, а это сложение: взятое из германского MAHAL «договор, сходка» плюс ŻONA «жена». То есть MAŁŻONKA это дословно «жена по договору», взятая по уговору перед людьми. Русское «супруга» построено совсем иначе, от «съпрягать», то есть «запряжённая вместе». Один и тот же союз два языка увидели по-разному: у поляков договор, у нас общая упряжь."
memory: "Брачный, супружеский. Заучите целиком zawrzec zwiazek malzenski «заключить брак» — так это и стоит в документах. Читается «мауже́ньски», где l со штрихом даёт «у», отсюда «мау», а окончание -nski звучит «ньски». Супругов называют malzonkowie, а не прилагательным. В этимологии подарок: malzonka это дословно «жена по договору», от германского mahal «уговор» плюс zona."
idioms:
