notes:
  - { kind: false-friend, text: "Запомните главное сочетание целиком: заключить брак — ZAWRZEĆ ZWIĄZEK MAŁŻEŃSKI, дословно «заключить брачный союз». И обратите внимание на существительное: MAŁŻEŃSTWO значит и «брак» как установление, и «супружеская пара» как двое людей, тогда как русский на это держит два разных слова. Супругов называют MAŁŻONKOWIE, и именно так, а не прилагательным." }
  - { kind: usage, text: "В таблице одиннадцать форм, но живых десять. Одиннадцатая — MAŁŻEŃSCY, именительный множественного для мужчин-людей, и её не употребляют: прилагательное относительное, оно описывает союз, присягу или обязанности, а не человека. Супругов называют MAŁŻONKOWIE, существительным. Примеров к этой форме в карточке поэтому нет." }
  - { kind: government, text: "Заключить брак — ZAWRZEĆ ZWIĄZEK MAŁŻEŃSKI, винительный без предлога. В браке — W STANIE MAŁŻEŃSKIM или W ZWIĄZKU MAŁŻEŃSKIM, местный падеж. По брачным делам — W SPRAWACH MAŁŻEŃSKICH, местный множественного. Прилагательное всегда стоит после существительного: ZWIĄZEK MAŁŻEŃSKI, PARA MAŁŻEŃSKA, ŁOŻE MAŁŻEŃSKIE." }
  - { kind: pronunciation, text: "Читается «мауже́ньски», четыре слога, ударение на предпоследнем. Буква Ł даёт «у», поэтому начало это «мау», а не «мал». Так же записано и однокоренное MAŁŻEŃSTWO — «мауже́ньстфо». Сочетание Ń перед S даёт «ньс», и окончание -ŃSKI звучит «ньски», как в POLSKI «по́льски» и JAPOŃSKI «япо́ньски»." }
  - { kind: register, text: "Слово официальное, из языка загса, суда и кодекса. ZWIĄZEK MAŁŻEŃSKI и STAN MAŁŻEŃSKI стоят в документах, SPRAWY MAŁŻEŃSKIE — в делах суда. В обиходе поляки чаще говорят просто MAŁŻEŃSTWO или называют людей MAŁŻONKOWIE, а о паре — PARA. Выражение ŁOŻE MAŁŻEŃSKIE книжное и слегка торжественное." }
