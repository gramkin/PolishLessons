# review
id: kontrolowac
format: 2
lemma: "kontrolować"
rank: 1425
pos: verb
aspect: imperf
pron: { cyr: "контроло́ваць" }
senses:
  - id: control
    ru: "контролировать, держать под контролем"
    examples:
      - pl: "Musisz się kontrolować."
        ru: "Ты должен держать себя в руках."
        source: { kind: tatoeba, id: 582107 }
      - pl: "Nie możemy kontrolować pogody."
        ru: "Мы не можем контролировать погоду."
        source: { kind: translated, id: 10616771 }
      - pl: "Duzi gracze kontrolują rynek."
        ru: "Крупные игроки контролируют рынок."
        source: { kind: translated, id: 366280 }
  - id: check
    ru: "проверять, досматривать"
    examples:
      - pl: "Nie lubię być kontrolowany."
        ru: "Я не люблю, когда меня контролируют."
        source: { kind: translated, id: 3898959 }
      - pl: "Celnik kontroluje bagaż."
        ru: "Таможенник проверяет багаж."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Первое значение польского слова — «проверять», а не «управлять»: kontrolować bilety «проверять билеты», kontrola biletów «проверка билетов». Значение «держать под контролем» тоже есть, но проверочное сильнее, чем в русском." }
  - { kind: usage, text: "Только несовершенный вид. Спрягается по образцу на -ować: kontroluję, kontrolujesz, kontroluje." }
  - { kind: usage, text: "kontrolować się — «держать себя в руках»: Musisz się kontrolować." }
  - { kind: usage, text: "Существительное — kontrola «проверка, контроль», уже есть отдельной карточкой." }
collocations:
  - { pl: "kontrolować się", ru: "держать себя в руках" }
  - { pl: "kontrolować sytuację", ru: "контролировать ситуацию" }
  - { pl: "kontrolować bilety", ru: "проверять билеты" }
etymology: "Из французского contrôler через немецкий; в русский «контролировать» пришло тем же путём, поэтому слова совпадают по форме, но не вполне по главному значению."
memory: "kontrolować — «контролировать», но первое значение у поляков «проверять»: kontrolować bilety «проверять билеты». А kontrolować się значит «держать себя в руках». Спряжение как у всех на -ować: kontroluję."
idioms:
  - { pl: "kontrolować się", ru: "держать себя в руках" }
  - { pl: "kontrolować sytuację", ru: "контролировать ситуацию" }
  - { pl: "stracić kontrolę", ru: "потерять контроль" }
