# review
id: zasada
format: 2
lemma: "zasada"
rank: 511
pos: noun
pron: { cyr: "заса́да" }
senses:
  - id: rule
    ru: "правило, принцип"
    examples:
      - pl: "Takie są zasady."
        ru: "Таковы правила."
        source: { kind: tatoeba, id: 3764986 }
      - pl: "Wyjaśniłem im zasady gry."
        ru: "Я объяснил им правила игры."
        source: { kind: tatoeba, id: 546118 }
      - pl: "Ta zasada dotyczy również ciebie."
        ru: "Это правило и тебя касается."
        source: { kind: tatoeba, id: 930070 }
  - id: principles
    ru: "принципы (моральные); в химии — щёлочь"
    examples:
      - pl: "On jest człowiek bez zasad."
        ru: "Он беспринципный человек."
        source: { kind: tatoeba, id: 1817858 }
      - pl: "To jest niezgodne z moimi zasadami."
        ru: "Это противоречит моим принципам."
        source: { kind: translated, id: 362915 }
      - pl: "Zasada to przeciwieństwo kwasu."
        ru: "Щёлочь — противоположность кислоты."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Пишется и звучит как русская «засада», но значит совсем другое: zasada — это «правило, принцип». Русская «засада» по-польски zasadzka." }
  - { kind: usage, text: "Очень частый оборот w zasadzie — «в принципе, в сущности»: To jest w zasadzie to samo «Это в принципе одно и то же»." }
  - { kind: usage, text: "О людях: mieć zasady «иметь принципы», człowiek z zasadami «принципиальный человек», człowiek bez zasad «беспринципный человек»." }
  - { kind: usage, text: "На уроке химии zasada — это «щёлочь, основание», противоположность kwas «кислоты»." }
collocations:
  - { pl: "w zasadzie", ru: "в принципе" }
  - { pl: "zasady gry", ru: "правила игры" }
  - { pl: "człowiek z zasadami", ru: "принципиальный человек" }
  - { pl: "złamać zasadę", ru: "нарушить правило" }
etymology: "От za- + sadzić «сажать», праславянское *saditi: буквально «то, что заложено в основу». Русское «основание» построено по тому же принципу от «основать»."
memory: "zasada — «правило, принцип», буквально «то, что посажено в основу», от sadzić «сажать». И это настоящий ложный друг: по-русски «засада» — это совсем другое, а польская засада называется zasadzka. Запомните частый оборот w zasadzie «в принципе». А на уроке химии zasada — это «щёлочь»."
idioms:
  - { pl: "w zasadzie", ru: "в принципе" }
  - { pl: "człowiek z zasadami", ru: "принципиальный человек" }
  - { pl: "zasady gry", ru: "правила игры" }
