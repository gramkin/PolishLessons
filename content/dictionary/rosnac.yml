notes:
  - { kind: false-friend, text: "ЗВУКОВОЙ ЗАКОН: польское начальное ro- отвечает русскому ра-. Rosnąć — «расти», równy — «ровный», robota — «работа». Причина общая: праславянское начальное *or- в польском дало ro-, а в русском ра-. Увидев польское слово на ro-, попробуйте русское на ра-." }
  - { kind: pronunciation, text: "ЧЕРТА НАД O ПОЯВЛЯЕТСЯ В ЗАКРЫТОМ СЛОГЕ. Мужская форма прошедшего времени — rósł, потому что слог закрыт: róst. Но стоит добавить окончание, открывающее слог, и черта уходит: rosła, rosło, rosłem, rosłeś. В условном наклонении слог остаётся закрытым, значит черта СОХРАНЯЕТСЯ: rósłby, rósłbym, rósłbyś. Формы rosł и rosłby неправильны — их в языке нет." }
  - { kind: usage, text: "В парадигме два неопределённых: обычное rosnąć и устаревшее róść, которое встречается в поэзии и присказках. Глагол непереходный, поэтому страдательного причастия у него нет вовсе — расти можно только самому, а «вырастить» будет уже hodować или wychowywać." }
  - { kind: government, text: "Чаще всего без дополнения: trawa rośnie. Устойчиво rosnąć W coś с винительным: rosnąć w siłę «набирать силу», rosnąć w pychę «впадать в гордыню». Русское «расти в» так не употребляется, это сочетание придётся запомнить." }
collocations:
  - { pl: "rosnąć w siłę", ru: "набирать силу" }
  - { pl: "rosnące ceny", ru: "растущие цены" }
  - { pl: "rosnąć w oczach", ru: "расти на глазах" }
family:
  - { pl: "urosnąć", ru: "вырасти", relation: aspect }
  - { pl: "dorosnąć", ru: "вырасти, повзрослеть", relation: derived }
  - { pl: "roślina", ru: "растение", relation: root }
  - { pl: "wzrost", ru: "рост", relation: root }
etymology: "Прямой родственник русского «расти», и расхождение объясняется законом: праславянское начальное *or- дало в польском ro-, а в русском ра-. Отсюда же пары równy — «ровный» и robota — «работа». Из того же корня roślina «растение» и wzrost «рост»."
memory: "rosnąć — «расти», и начальное ro- отвечает русскому ра-: rosnąć/расти, równy/ровный, robota/работа. Главная ловушка в правописании: rósł с чертой, но rosła и rosłem без неё — черта держится только в закрытом слоге."
idioms:
  - { pl: "rosnąć jak grzyby po deszczu", ru: "расти как грибы после дождя" }
  - { pl: "rosnąć w siłę", ru: "набирать силу" }
formExamplesSkip:
  - { form: "rosł", reason: "Такой формы в языке нет. Мужская форма прошедшего времени — rósł, с чертой, потому что слог закрыт. Простое o появляется лишь тогда, когда следующий слог открывает предыдущий: rosła, rosło, rosłem." }
  - { form: "rosłby", reason: "Правильно rósłby: частица by не открывает слога, поэтому черта над o сохраняется, как и в самостоятельном rósł. Форма с простым o — ошибка автоматического построения парадигмы." }
  - { form: "rosłbym", reason: "Правильно rósłbym, по той же причине, что и rósłby: слог остаётся закрытым и черта над o не исчезает." }
  - { form: "rosłbyś", reason: "Правильно rósłbyś: перед by слог закрыт, значит пишется ó, как в rósł." }
