# review
id: niedorzeczny
format: 2
lemma: "niedorzeczny"
rank: 2380
pos: adj
pron: { cyr: "недоже́чны" }
senses:
  - id: absurd
    ru: "нелепый, вздорный"
    examples:
      - pl: "Ale niedorzeczne!"
        ru: "Какая нелепость!"
        source: { kind: translated, id: 8617283 }
      - pl: "To niedorzeczny pomysł."
        ru: "Это нелепая затея."
        source: { kind: authored }
      - pl: "Jego tłumaczenie było niedorzeczne."
        ru: "Его объяснение было нелепым."
        source: { kind: authored }
  - id: preposterous
    ru: "несуразный, бессмысленный"
    examples:
      - pl: "Niedorzeczne zarzuty odrzucono."
        ru: "Несуразные обвинения отвергли."
        source: { kind: authored }
      - pl: "Cała ta historia jest niedorzeczna."
        ru: "Вся эта история несуразна."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Разбирается прозрачно: nie + do + rzecz «вещь, дело», то есть «не к делу». Русское «нелепый» от «лепить» — образ другой, а смысл тот же. Слово rzecz уже есть в словаре." }
  - { kind: government, text: "Обычное прилагательное. Наречие — niedorzecznie «нелепо», существительное — niedorzeczność «нелепость»; оба образуются от него, но формами его не являются." }
  - { kind: usage, text: "Отрицание nie- пишется слитно, как и у всех прилагательных: niedorzeczny, niemożliwy, nietknięty." }
  - { kind: usage, text: "Положительная пара dorzeczny «толковый, дельный» существует, но встречается гораздо реже." }
collocations:
  - { pl: "niedorzeczny pomysł", ru: "нелепая затея" }
etymology: "nie + do + rzecz «вещь, дело» — буквально «не к делу». Русское «нелепый» — от «лепить»."
memory: "niedorzeczny — «нелепый», и разбирается прозрачно: nie + do + rzecz, «не к делу». Отрицание nie- пишется слитно."
