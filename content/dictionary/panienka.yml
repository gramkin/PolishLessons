# review
id: panienka
format: 2
lemma: "panienka"
rank: 1481
pos: noun
pron: { cyr: "пане́нка" }
senses:
  - id: young-lady
    ru: "барышня, юная девушка"
    examples:
      - pl: "Przyprawia panienki o żywsze bicie serca."
        ru: "Он заставляет девушек сильнее биться сердцем."
        source: { kind: translated, id: 367021 }
      - pl: "Panienka czeka na ojca."
        ru: "Барышня ждёт отца."
        source: { kind: authored }
      - pl: "To młoda panienka z dobrego domu."
        ru: "Это молодая барышня из хорошей семьи."
        source: { kind: authored }
  - id: address
    ru: "обращение к девушке (устаревающее)"
    examples:
      - pl: "Czego panienka sobie życzy?"
        ru: "Что барышня желает?"
        source: { kind: authored }
      - pl: "Panienko, upuściła pani rękawiczkę."
        ru: "Барышня, вы уронили перчатку."
        source: { kind: authored }
notes:
  - { kind: register, text: "Уменьшительное от panna «девушка». Слово устаревающее и стилистически окрашенное: в нейтральной современной речи говорят dziewczyna или młoda kobieta." }
  - { kind: usage, text: "Как обращение panienko звучит старомодно, а порой снисходительно. В магазине или на улице уместнее proszę pani." }
  - { kind: false-friend, text: "У слова есть и разговорное значение «проститутка», поэтому с ним стоит обращаться осторожно и по умолчанию выбирать dziewczyna." }
  - { kind: usage, text: "Гнездо обращений: pan «господин», pani «госпожа», panna «девушка», panienka «барышня»." }
collocations:
  - { pl: "młoda panienka", ru: "молодая барышня" }
  - { pl: "panienka z dobrego domu", ru: "барышня из хорошей семьи" }
  - { pl: "czego panienka sobie życzy?", ru: "что барышня желает?" }
etymology: "Двойное уменьшительное: pan «господин» дало panna «девушка», а то — panienka. Русская «барышня» от «боярыни» устроена похоже, но корень другой."
memory: "panienka — «барышня», уменьшительное от panna. Слово устаревшее и осторожное: в нейтральной речи лучше dziewczyna, потому что у panienka есть и разговорное значение «проститутка»."
idioms:
  - { pl: "młoda panienka", ru: "молодая барышня" }
  - { pl: "panienka z dobrego domu", ru: "барышня из хорошей семьи" }
  - { pl: "czego panienka sobie życzy?", ru: "что барышня желает?" }
