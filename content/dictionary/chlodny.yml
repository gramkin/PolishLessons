# review
id: chlodny
format: 2
lemma: "chłodny"
rank: 4329
pos: adj
pron: { cyr: "хуо́дны" }
senses:
  - id: cool
    ru: "прохладный, холодноватый"
    examples:
      - pl: "Był chłodny wieczór."
        ru: "Был прохладный вечер."
        source: { kind: authored }
      - pl: "Wypij coś chłodnego."
        ru: "Выпей чего-нибудь прохладного."
        source: { kind: authored }
      - pl: "Najchłodniejszy dzień tygodnia to czwartek."
        ru: "Самый прохладный день недели — четверг."
        source: { kind: authored }
  - id: cold-manner
    ru: "холодный, сдержанный (о человеке, приёме)"
    examples:
      - pl: "Przywitał nas chłodnym spojrzeniem."
        ru: "Он встретил нас холодным взглядом."
        source: { kind: authored }
      - pl: "Jest chłodna wobec obcych."
        ru: "Она холодна с чужими."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Русское «холодный» по-польски бывает ZIMNY и CHŁODNY. ZIMNY — «холодный» по-настоящему: ZIMNA WODA, ZIMNA ZIMA. CHŁODNY — «прохладный», мягче: CHŁODNY WIECZÓR, CHŁODNE PIWO. О человеке CHŁODNY — «сдержанный, отстранённый», а ZIMNY — «бессердечный». Русское «хладный» — книжная родня CHŁODNY." }
  - { kind: usage, text: "Полная парадигма: CHŁODNY, CHŁODNIEJSZY, NAJCHŁODNIEJSZY. Все степени очень частотны в прогнозах погоды: NAJCHŁODNIEJSZY DZIEŃ, CHŁODNIEJSZA NOC. Форма для мужчин-людей: CHŁODNI, CHŁODNIEJSI, NAJCHŁODNIEJSI." }
  - { kind: government, text: "Холоден к кому-то — CHŁODNY WOBEC KOGOŚ, WOBEC с родительным. Прохладно — CHŁODNO, наречием: JEST CHŁODNO, ROBI SIĘ CHŁODNO." }
  - { kind: pronunciation, text: "Читается «хуо́дны», два слога, ударение на первом. CH — «х», Ł — «у», и выходит «хуо». В CHŁODNIEJSZY: «хуодне́йшы»." }
  - { kind: register, text: "Нейтральное слово. В прогнозах погоды — основное: CHŁODNY DZIEŃ, CHŁODNE NOCE. О человеке — нейтральное описание без осуждения. CHŁODNA KALKULACJA, «холодный расчёт», — устойчивое." }
collocations:
  - { pl: "chłodny wieczór", ru: "прохладный вечер" }
  - { pl: "chłodne piwo", ru: "прохладное пиво" }
  - { pl: "chłodna kalkulacja", ru: "холодный расчёт" }
family:
  - { pl: "chłód", ru: "прохлада, холод", relation: root }
  - { pl: "chłodno", ru: "прохладно", relation: derived }
  - { pl: "zimny", ru: "холодный", relation: root, id: zimny }
etymology: "От CHŁÓD «прохлада», общеславянского *xoldъ, того же, что русское «холод» и книжное «хлад». Польское ŁO на месте русского «оло» — обычное соответствие: CHŁÓD — «холод», GŁOWA — «голова», MŁODY — «молодой»."
memory: "Chłodny — прохладный; и сдержанный о человеке: chłodny wieczór, chłodne spojrzenie. Холодный — zimny. Chłodniejszy, najchłodniejszy. Читается «хуо́дны»."
idioms:
  - { pl: "chłodna kalkulacja", ru: "холодный расчёт" }
