notes:
  - { kind: usage, text: "Это двойное уменьшительное: от CÓRKA «дочь» уже само образовано от старого CÓRA, а CÓRECZKA добавляет вторую ступень ласки через -ECZKA. По-русски ряд такой же трёхступенчатый: «дочь», «дочка», «доченька». Выбор формы говорит не о возрасте ребёнка, а об отношении говорящего: CÓRKA нейтрально и годится для документа, CÓRECZKA звучит тепло и в официальном тексте неуместно. Суффикс -ECZKA продуктивен и делает то же самое с другими словами: KSIĄŻKA и KSIĄŻECZKA, ŁYŻKA и ŁYŻECZKA «чайная ложка», PACZKA и PACZECZKA. Десять форм — обычный набор существительного женского рода на -A." }
  - { kind: pronunciation, text: "Читается «цурэ́чка», три слога, ударение на предпоследнем. Начальное C это «ц», и это общее правило: польское C перед гласным всегда «ц», никогда «к». Буква Ó читается как «у», и пишется она так по историческим причинам, а звучит ровно как U: CÓRECZKA это «цурэчка», а не «цорэчка». Сочетание CZ даёт твёрдое «ч». Буква E это «э». В форме CÓRECZKĄ последнее Ą звучит как «он»: «цурэ́чкон». В звательной форме CÓRECZKO ударение остаётся на том же слоге." }
  - { kind: stress, text: "Слово показывает, как работает польское чередование K и C при склонении. В дательном и местном падежах заднеязычное K не может стоять перед окончанием -E и переходит в C: CÓRECZKA, но CÓRECZCE. Это та же замена, что в DAWKA и DAWCE, TROSKA и TROSCE, WÓDKA и WÓDCE, и она обязательна, без исключений. В родительном множественного появляется беглое E, которого нет в основе: CÓRECZEK, а не CÓRECZK — польский не терпит скопления согласных на конце слова. Русский в «дочек» делает то же самое и по той же причине." }
  - { kind: register, text: "Форма ласковая, и у неё есть вторая жизнь — ироническая. Сказанное взрослому человеку CÓRECZKA TATY «папенькина дочка» означает избалованность и звучит колко, ровно как русское выражение. В остальном слово обычное домашнее: так родители зовут дочь в любом возрасте, и так бабушка может обратиться к внучке. В официальной речи, в заявлении или в медицинской карте пишут CÓRKA. Обращение CÓRECZKO уместно только от старшего к младшему и только в близких отношениях; от незнакомого человека оно прозвучит фамильярно." }
