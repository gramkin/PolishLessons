etymology: "От CÓRKA, а та от старого CÓRA, из праславянского *dъkti — того же слова, что русское «дочь». Путь был неожиданный: в праславянском начальное сочетание было *dъk-, и польский утратил начальный D, оставив CÓRA, тогда как русский сохранил его в «дочери». Поэтому пара CÓRKA и «дочка» выглядит непохожей, хотя это одно слово: соответствие тут не звуковое, а историческое, и запоминать его приходится отдельно. Зато дальше всё регулярно: польское Ó здесь на месте старого долгого О, читается как У, а суффиксы -KA и -ECZKA отвечают русским -КА и -ЕЧКА один в один, как в «дочка» и «доченька». Индоевропейский корень тот же, что в литовском DUKTĖ и немецком TOCHTER."
memory: "Три ступени, как в русском: córka «дочь» — córeczka «дочка, доченька». Общее слово с русским «дочь», но польский потерял начальный d- (праслав. *dъkti дало córa), поэтому родство на слух не слышно. Ó читается как «у»: «цурэчка». Два правила склонения на одном слове: k→c в дательном и местном (córeczce, как dawce и wódce) и беглое e в родительном множественного (córeczek, как русское «дочек»). Córeczka taty — «папенькина дочка», и звучит так же колко."
idioms:
  - { pl: "córeczka taty", ru: "папенькина дочка — об избалованной" }
