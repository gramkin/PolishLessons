# review
id: przewod
format: 2
lemma: "przewód"
rank: 4115
pos: noun
pron: { cyr: "пшэ́вут" }
senses:
  - id: cable
    ru: "провод, кабель"
    examples:
      - pl: "Przewód od ładowarki jest za krótki."
        ru: "Провод от зарядки слишком короткий."
        source: { kind: authored }
      - pl: "Elektryk wymienił stare przewody."
        ru: "Электрик заменил старые провода."
        source: { kind: authored }
      - pl: "Nie dotykaj tego przewodu!"
        ru: "Не трогай этот провод!"
        source: { kind: authored }
  - id: duct
    ru: "канал, тракт; процедура"
    examples:
      - pl: "Przewód pokarmowy ma kilka metrów długości."
        ru: "Пищеварительный тракт длиной несколько метров."
        source: { kind: authored }
      - pl: "Rozpoczął przewód doktorski w zeszłym roku."
        ru: "В прошлом году он начал процедуру защиты докторской."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "PRZEWÓD — «провод», но и «канал, тракт»: PRZEWÓD POKARMOWY, «пищеварительный тракт». PRZEWÓD DOKTORSKI — процедура присвоения учёной степени. «Проводник», гид — PRZEWODNIK." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Ó в начальной форме, O в остальных: PRZEWÓD, PRZEWODU. В местном падеже D переходит в DZ: W PRZEWODZIE." }
  - { kind: government, text: "Провод от чего — OD, и родительный: PRZEWÓD OD ŁADOWARKI. Под напряжением — POD NAPIĘCIEM. Провод чего — родительный: PRZEWÓD ZASILAJĄCY, «кабель питания»." }
  - { kind: pronunciation, text: "Читается «пшэ́вут», ударение на первом слоге. PRZ — «пш», Ó — «у», конечное D оглушается в «т»." }
collocations:
  - { pl: "przewód elektryczny", ru: "электрический провод" }
  - { pl: "przewód pokarmowy", ru: "пищеварительный тракт" }
  - { pl: "przewód doktorski", ru: "защита докторской" }
family:
  - { pl: "przewodnik", ru: "гид; проводник", relation: root, id: przewodnik }
  - { pl: "przewodzić", ru: "проводить (ток); руководить", relation: root }
  - { pl: "wodzić", ru: "водить", relation: root, id: wodzic }
etymology: "PRZE- «про-» и WÓD- от WODZIĆ «водить»: то, что проводит ток или пищу. Русское «провод» построено так же: «про» + «вод»."
memory: "Przewód — провод и тракт: przewód pokarmowy. Читается «пшэ́вут». Przewodnik — гид. W przewodzie — d→dz."
idioms:
  - { pl: "być pod napięciem", ru: "быть на взводе" }
