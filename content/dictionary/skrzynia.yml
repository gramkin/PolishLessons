etymology: "Из латинского SCRINIUM «футляр, ящик для свитков», через германское посредство, и тот же источник дал немецкое SCHREIN. Исходно это был книжный, канцелярский предмет: ящик, в котором хранили свитки и документы, и лишь затем слово перешло на всякий большой деревянный ящик. В русском латинский корень тоже оставил след, в областном «скрыня» и в книжном «скриния», но обиходным словом стал турецкий «сундук», поэтому для русскоязычного связь не очевидна. Уменьшительное SKRZYNKA образовано обычным суффиксом -KA и разошлось по значению со своим большим родителем, как это часто бывает: уменьшительное закрепилось за отдельным предметом, почтовым ящиком."
memory: "Главное сочетание — skrzynia biegów «коробка передач». Размер различает слова: skrzynia большая, а skrzynka маленькая, и почтовый ящик только skrzynka pocztowa. Родительный и местный единственного совпадают: skrzyni, как kopalni; родительный множественного skrzyń. Из латинского scrinium, откуда и немецкое Schrein; русский «сундук» турецкий."
