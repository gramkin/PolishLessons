notes:
  - { kind: usage, text: "Самое нужное сочетание — SKRZYNIA BIEGÓW «коробка передач», и без него в разговоре об автомобиле не обойтись: SKRZYNIA AUTOMATYCZNA, SKRZYNIA MANUALNA. Буквально это «ящик передач», и образ тот же, что в русском «коробке». Второе важное различение — размер: SKRZYNIA большая, сундук или грузовой ящик, а SKRZYNKA маленькая, и именно SKRZYNKA POCZTOWA значит «почтовый ящик», SKRZYNKA NARZĘDZIOWA «ящик с инструментами». Спутать их легко, а разница существенная: никто не скажет SKRZYNIA POCZTOWA." }
  - { kind: pronunciation, text: "Читается «скшы́ня», ударение на предпоследнем слоге. Сочетание SKRZ даёт «скш»: R после K оглушается в «ш», и получается стечение трёх согласных, непривычное для русского. Гласная Y звучит как «ы». Конечное -NIA читается «ня», одним слогом, поэтому слово трёхсложное: SKRZY-NIA — точнее двусложное, SKRZY-NIA. В родительном множественного SKRZYŃ остаётся один слог с мягким н на конце: «скшынь»." }
  - { kind: government, text: "Женский род на -A после мягкой согласной, и родительный единственного совпадает с местным: SKRZYNI. BEZ SKRZYNI «без сундука» и W SKRZYNI «в сундуке» дают одну форму, как у KOPALNIA и KOPALNI. Родительный множественного SKRZYŃ, с конечным Ń и без гласной, по тому же правилу, что KOPALŃ и KSIĘGARŃ. Винительный на -Ę: OTWÓRZ SKRZYNIĘ. Содержимое вводится предлогом Z с творительным: SKRZYNIA Z OWOCAMI." }
  - { kind: false-friend, text: "Русский «сундук» пришёл из турецкого и к польскому слову отношения не имеет, так что угадать SKRZYNIA нельзя. Зато слово латинское по происхождению и родственно знакомым: латинское SCRINIUM «футляр для свитков» дало польское SKRZYNIA и, через германское посредство, немецкое SCHREIN «шкафчик, рака». В русском тот же корень сохранился в областном «скрыня» и в слове «скриния» церковных текстов, но в обиходной речи его нет. Поэтому связь есть, однако на неё опереться нельзя." }
