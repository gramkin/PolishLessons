notes:
  - { kind: false-friend, text: "STRUMIEŃ — прежде всего ручей, небольшая речка: GÓRSKI STRUMIEŃ. «Струя» — тоже STRUMIEŃ: STRUMIEŃ WODY Z KRANU. А в переносном смысле это наш «поток»: STRUMIEŃ LUDZI, STRUMIEŃ DANYCH. Русскому «струя» оно родственно." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Конечное Ń перед гласной пишется как NI: STRUMIENIA, STRUMIENIEM. Родительный множественного — STRUMIENI, без -ÓW. Ручеёк — STRUMYK." }
  - { kind: government, text: "Из ручья — ZE STRUMIENIA, родительный; перед STR предлог Z получает E. Литься ручьями — LAĆ SIĘ STRUMIENIAMI, творительный. Поток чего-то — STRUMIEŃ CZEGOŚ: STRUMIEŃ ŚWIATŁA." }
  - { kind: pronunciation, text: "Читается «стру́мень», два слога, ударение на первом, как KAMIEŃ «ка́мень». В косвенных формах ударение сдвигается: STRUMIENIA — «струме́ня»." }
  - { kind: register, text: "STRUMIEŃ ŚWIADOMOŚCI — литературный термин, «поток сознания». LAĆ SIĘ STRUMIENIAMI говорят о слезах, дожде, вине: ŁZY LAŁY SIĘ STRUMIENIAMI." }
collocations:
  - { pl: "górski strumień", ru: "горный ручей" }
  - { pl: "strumień wody", ru: "струя воды" }
  - { pl: "strumień danych", ru: "поток данных" }
family:
  - { pl: "strumyk", ru: "ручеёк", relation: derived }
  - { pl: "strumieniowy", ru: "поточный; реактивный (о двигателе)", relation: derived }
  - { pl: "strumyczek", ru: "ручеёк (ласк.)", relation: derived }
etymology: "Слово праславянское, от корня со значением «течь», того же, что в русских «струя» и «остров», то есть «то, что обтекает вода». В польском главным стало значение «ручей»."
memory: "Strumień — ручей и струя: górski strumień, strumień wody. Читается «стру́мень». Родня русской «струи». Lać się strumieniami — литься ручьями. Strumyk — ручеёк."
idioms:
  - { pl: "lać się strumieniami", ru: "литься ручьями" }
  - { pl: "strumień świadomości", ru: "поток сознания" }
