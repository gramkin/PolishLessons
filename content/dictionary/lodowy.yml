etymology: "От LÓD, слова праславянского и того же, что русский «лёд». А сочетание GÓRA LODOWA повторяет историю PIŁKA NOŻNA: это перевод по частям, на этот раз немецкого EISBERG, где EIS стало LODOWA, а BERG — GÓRA. Русский в этом месте взял слово целиком и получил «айсберг». Так дважды выходит одно и то же: поляк переводит составное слово по частям, русский берёт его как есть, и родство перестаёт быть слышным."
memory: "От lod «лёд». Главное сочетание — gora lodowa, то есть айсберг: поляк перевёл немецкое Eisberg по частям, как и football в pilka nozna, а русский взял слово целиком. Две ловушки в гнезде: lody это «мороженое», а lodowka — «холодильник». И держите границу с lodowaty: lodowy это «сделанный из льда», lodowaty — «ледяной на ощупь», о воде и о взгляде."
idioms:
  - { pl: "góra lodowa", ru: "айсберг" }
formExamplesSkip:
