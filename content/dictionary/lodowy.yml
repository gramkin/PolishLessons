notes:
  - { kind: false-friend, text: "Корень тот же, что в русском «лёд», но гнездо устроено иначе и ловушек в нём две. LODY, по виду обычное множественное от LÓD, значит «мороженое», и только так: за мороженым идут PO LODY. А LODÓWKA это холодильник. И не путайте LODOWY с LODOWATY: первое значит «сделанный из льда, ледовый», второе — «ледяной на ощупь», о воде, о ветре, о взгляде. Русское «ледяной» покрывает оба смысла сразу." }
  - { kind: usage, text: "В таблице одиннадцать форм, но живых десять. Одиннадцатая — LODOWI, именительный множественного для мужчин-людей, и её не употребляют: прилагательное относительное, оно описывает предмет, а не человека. Примеров к этой форме в карточке поэтому нет. В закреплённых названиях прилагательное стоит после существительного: GÓRA LODOWA, EPOKA LODOWA, TAFLA LODOWA." }
  - { kind: government, text: "Запомните порядок слов в двух главных сочетаниях: GÓRA LODOWA «айсберг» и EPOKA LODOWA «ледниковый период». Переставить нельзя. В ледниковую эпоху — W EPOCE LODOWEJ, местный падеж, и обратите внимание на чередование: EPOKA даёт EPOCE, с K в C. К айсбергу — DO GÓRY LODOWEJ, предлог DO с родительным, где русский скажет «к айсбергу», с дательным." }
  - { kind: pronunciation, text: "Читается «лодо́вы», три слога, ударение на предпоследнем. Конечная Y даёт «ы», поэтому слово кончается на «вы», а не на «вый». В женском роде LODOWA это «лодо́ва», в среднем LODOWE — «лодо́вэ», с «э» на конце. Форма LODOWĄ звучит «лодо́вон», потому что конечный носовой Ą даёт «он»." }
  - { kind: register, text: "Слово нейтральное. В географии и в новостях это GÓRA LODOWA и EPOKA LODOWA, в спорте — TOR LODOWY «ледовая дорожка» и TAFLA LODOWA о катке. В кондитерской это DESER LODOWY и TORT LODOWY, то есть из мороженого. А вот про холодную воду или про холодный взгляд говорят LODOWATY, не LODOWY, и эту границу стоит держать в голове." }
