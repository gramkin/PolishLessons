# review
id: mocno
format: 2
lemma: "mocno"
rank: 1283
pos: adv
pron: { cyr: "мо́цно" }
senses:
  - id: strongly
    ru: "сильно, крепко"
    examples:
      - pl: "Jego oczy mocno spuchły."
        ru: "Его глаза сильно распухли."
        source: { kind: tatoeba, id: 2145995 }
      - pl: "Mocno wieje."
        ru: "Сильно дует."
        source: { kind: translated, id: 12450039 }
      - pl: "Mocno padało."
        ru: "Сильно шёл дождь."
        source: { kind: translated, id: 12449373 }
  - id: comparative
    ru: "mocniej — сильнее"
    examples:
      - pl: "Mocniej!"
        ru: "Сильнее!"
        source: { kind: translated, id: 12359668 }
      - pl: "Ciągnij mocniej."
        ru: "Тяни сильнее."
        source: { kind: translated, id: 12360177 }
      - pl: "Kocham go mocniej niż jakiegokolwiek innego mężczyznę."
        ru: "Я люблю его сильнее, чем любого другого мужчину."
        source: { kind: translated, id: 899496 }
notes:
  - { kind: usage, text: "Наречие от mocny «сильный, крепкий». Покрывает русские «сильно», «крепко» и «здорово» в значении степени." }
  - { kind: usage, text: "С причастиями значит «сильно»: mocno przeziębiony «сильно простуженный», mocno zbudowany «крепко сложённый»." }
  - { kind: usage, text: "Сравнительная степень — mocniej, превосходная — najmocniej. Отсюда спортивный девиз Szybciej, wyżej, mocniej." }
  - { kind: pronunciation, text: "c звучит как «ц»: мо́цно. Ударение на первый слог." }
collocations:
  - { pl: "mocno wierzyć", ru: "твёрдо верить" }
  - { pl: "mocno przeziębiony", ru: "сильно простуженный" }
  - { pl: "trzymaj się mocno", ru: "держись крепче" }
etymology: "От mocny «сильный», а тот от moc «сила, мощь», из праславянского *moktь. Русские «мощь» и «мочь» — то же гнездо."
memory: "mocno — «сильно, крепко», наречие от mocny. С причастиями даёт mocno przeziębiony «сильно простуженный». Степени: mocniej, najmocniej. Корень тот же, что в русских «мощь» и «мочь»."
idioms:
  - { pl: "trzymaj się mocno", ru: "держись крепче" }
  - { pl: "mocno wierzyć", ru: "твёрдо верить" }
  - { pl: "szybciej, wyżej, mocniej", ru: "быстрее, выше, сильнее" }
formExamplesSkip:
