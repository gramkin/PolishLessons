# review
id: notatka
format: 2
lemma: "notatka"
rank: 2585
pos: noun
pron: { cyr: "нота́тка" }
senses:
  - id: note
    ru: "записка, заметка"
    examples:
      - pl: "Zostawił notatkę na lodówce."
        ru: "Он оставил записку на холодильнике."
        source: { kind: authored }
      - pl: "Notatka leżała na biurku od rana."
        ru: "Записка лежала на столе с утра."
        source: { kind: authored }
      - pl: "W notatce brakowało daty."
        ru: "В записке не хватало даты."
        source: { kind: authored }
  - id: notes
    ru: "конспект, записи"
    examples:
      - pl: "Robi notatki na każdym wykładzie."
        ru: "Он делает записи на каждой лекции."
        source: { kind: authored }
      - pl: "Bez notatek nie zdam tego egzaminu."
        ru: "Без конспектов я не сдам этот экзамен."
        source: { kind: authored }
notes:
  - { kind: pronunciation, text: "Дательный и предложный — NOTATCE, с переходом k в c. Правило общее для основ на -ka: matka — matce, ręka — ręce, przykrywka — przykrywce. Русское «записке» никакого чередования не знает, так что форму надо брать готовой." }
  - { kind: usage, text: "Родительный множественного — NOTATEK, с беглым e, которого в основе нет. Так же matka — matek и miasteczko — miasteczek: вставная гласная появляется там, где окончание исчезло и согласные столкнулись. Во множественном числе слово обычно значит не «записки», а «конспект»: robić notatki «конспектировать»." }
collocations:
  - { pl: "robić notatki", ru: "делать записи, конспектировать" }
  - { pl: "notatka służbowa", ru: "служебная записка" }
  - { pl: "notatka prasowa", ru: "пресс-релиз" }
family:
  - { pl: "notować", ru: "записывать, отмечать", relation: root }
  - { pl: "notes", ru: "блокнот", relation: root }
  - { pl: "zapisek", ru: "запись, заметка", relation: root }
etymology: "От notować «записывать», из латинского notare «отмечать», от nota «знак, помета». Русская «нота» и «нотариус» — из того же гнезда, но «записку» мы построили от своего корня. Польское NOTES «блокнот» при этом ложный друг для англоговорящих, а для нас — просто ещё одно слово того же ряда."
memory: "Дательный и предложный с мягким c: w notatce, как w matce. А во множественном числе notatki чаще значит «конспект»: robić notatki — «конспектировать»."
idioms:
  - { pl: "robić notatki", ru: "делать записи, конспектировать" }
  - { pl: "notatka na marginesie", ru: "заметка на полях" }
