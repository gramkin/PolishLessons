notes:
  - { kind: false-friend, text: "POEZJA — «поэзия», а во множественном POEZJE — «стихотворения» как собрание: POEZJE WYBRANE, «избранные стихотворения». Одно стихотворение — WIERSZ, поэт — POETA, поэтесса — POETKA." }
  - { kind: usage, text: "Восемь живых форм, женский род на -JA. Родительный, дательный и местный — POEZJI. Архаичная форма POEZYJ и звательный не даются." }
  - { kind: government, text: "Сборник стихов — TOMIK POEZJI, родительный. В поэзии — W POEZJI, местный. Увлекаться поэзией — INTERESOWAĆ SIĘ POEZJĄ, творительный." }
  - { kind: pronunciation, text: "Читается «поэ́зья», ударение на предпоследнем слоге. O и E — два отдельных слога, ZJA — «зья»." }
collocations:
  - { pl: "tomik poezji", ru: "сборник стихов" }
  - { pl: "poezja współczesna", ru: "современная поэзия" }
  - { pl: "wieczór poezji", ru: "поэтический вечер" }
family:
  - { pl: "poeta", ru: "поэт", relation: root, id: poeta }
  - { pl: "poetka", ru: "поэтесса", relation: derived }
  - { pl: "poetycki", ru: "поэтический", relation: derived }
etymology: "Из греческого слова со значением «творение, сочинительство». Русская «поэзия» — то же слово."
memory: "Poezja — поэзия; poezje — стихотворения (сборник). Читается «поэ́зья». Tomik poezji — сборник стихов. Wiersz — стихотворение."
idioms:
  - { pl: "proza życia", ru: "проза жизни" }
