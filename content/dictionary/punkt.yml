senses:
  - id: point
    ru: "точка, пункт"
    note: "punkt widzenia «точка зрения», z punktu A do punktu B."
    examples:
      - pl: "Centrum wszechświata znajduje się w każdym punkcie wszechświata."
        ru: "Центр Вселенной находится в каждой точке Вселенной."
        source: { kind: tatoeba, id: 11404660 }
      - pl: "Ile czasu potrzeba aby dotrzeć z punktu A do punktu B?"
        ru: "Сколько времени требуется, чтобы добраться из пункта А в пункт Б?"
        source: { kind: tatoeba, id: 6109628 }
      - pl: "Z mojego punktu widzenia Tokio i Osaka jako metropolie praktycznie niczym się nie różnią"
        ru: "С моей точки зрения, как мегаполисы Токио и Осака практически ничем не отличаются."
        source: { kind: tatoeba, id: 5053957 }
  - id: score
    ru: "балл, очко"
    note: "dostać 85 punktów «получить 85 баллов»."
    examples:
      - pl: "Na egzaminie dostał 85 punktów."
        ru: "На экзамене он получил 85 баллов."
        source: { kind: translated, id: 415419 }
      - pl: "Kto miał najwięcej punktów?"
        ru: "У кого было больше всего очков?"
        source: { kind: translated, id: 3610612 }
      - pl: "Nasz zespół osiągnął przewagę pięciu punktów."
        ru: "Наша команда добилась преимущества в пять очков."
        source: { kind: translated, id: 3107108 }
  - id: obsessed
    ru: "mieć bzika na punkcie czegoś — быть помешанным на чём-л."
    note: "Устойчивый оборот с na punkcie и родительным."
    examples:
      - pl: "Mam bzika na punkcie golfa."
        ru: "Я помешан на гольфе."
        source: { kind: translated, id: 749194 }
      - pl: "Ona szaleje na punkcie muzyki."
        ru: "Она без ума от музыки."
        source: { kind: translated, id: 792165 }
      - pl: "Szaleje na punkcie piłki nożnej."
        ru: "Он помешан на футболе."
        source: { kind: translated, id: 1354233 }
notes:
  - { kind: government, text: "Оборот na punkcie czegoś «на чём-либо» требует родительного: szaleje na punkcie muzyki «она без ума от музыки», mieć bzika na punkcie golfa." }
  - { kind: usage, text: "punkt widzenia — «точка зрения»: z mojego punktu widzenia «с моей точки зрения»." }
  - { kind: usage, text: "Перед часом значит «ровно»: jest punkt dziesiąta «ровно десять»." }
  - { kind: usage, text: "Во множественном — «баллы, очки»: dostać punkty «получить баллы», zbierać punkty «собирать баллы»." }
collocations:
  - { pl: "punkt widzenia", ru: "точка зрения" }
  - { pl: "na punkcie czegoś", ru: "на чём-либо (помешан)" }
  - { pl: "punkt dziesiąta", ru: "ровно десять" }
  - { pl: "zdobyć punkty", ru: "набрать очки" }
family:
  - { pl: "punktualny", ru: "пунктуальный", relation: derived }
  - { pl: "punktacja", ru: "система баллов", relation: derived }
  - { pl: "punkcik", ru: "точечка", relation: derived }
etymology: "Из латинского punctum «укол, точка» через немецкое Punkt — то же слово, что русский «пункт» и «пунктир»."
memory: "punkt — «точка» и «пункт», но у него есть ходы, которых русский не ждёт. Перед часом оно значит «ровно»: jest punkt dziesiąta «ровно десять». Во множественном это «баллы, очки»: dostał 85 punktów. А оборот na punkcie czegoś требует родительного и значит «помешан на чём-то»: mieć bzika na punkcie golfa, szaleć na punkcie muzyki. Ну и punkt widzenia — «точка зрения»."
idioms:
  - { pl: "punkt widzenia", ru: "точка зрения" }
  - { pl: "mieć bzika na punkcie czegoś", ru: "быть помешанным на чём-либо" }
  - { pl: "punkt dziesiąta", ru: "ровно десять" }
formExamplesSkip:
