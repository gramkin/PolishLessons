notes:
  - { kind: usage, text: "ОДНО СЛОВО, ТРИ ЗНАКОМЫХ ПРАВИЛА СРАЗУ. Первое: беглое e выпадает, minister, но MINISTRA, ministrowi. Второе: в предложном и звательном r переходит в rz — o ministrze, panie ministrze. Третье: именительный множественного — MINISTROWIE, на -owie, как у всех званий и титулов: profesorowie, gubernatorowie." }
  - { kind: register, text: "Обращение к министру — PANIE MINISTRZE, и это обязательная формула в официальной речи. Само министерство называется ministerstwo, а подразделение внутри него — departament. Женской формы в законе нет: о женщине пишут pani minister, не склоняя слово." }
  - { kind: pronunciation, text: "Три слога, ударение на предпоследнем: mi-NI-ster. Mi звучит мягко, как «мі», e открытое: «міні́стэр». В форме ministrze слышно «міні́стшэ», с оглушением rz после t." }
collocations:
  - { pl: "minister zdrowia", ru: "министр здравоохранения" }
  - { pl: "panie ministrze", ru: "господин министр" }
  - { pl: "rada ministrów", ru: "совет министров" }
family:
  - { pl: "ministerstwo", ru: "министерство", relation: derived }
  - { pl: "premier", ru: "премьер-министр", relation: root }
  - { pl: "rząd", ru: "правительство", relation: root, id: rzad }
etymology: "Из латинского minister «слуга, помощник», от minus «меньше» — тот, кто ниже господина. Через французское ministre слово попало во все европейские языки, дав и русское «министр». Корень min- виден в minus и mniejszy «меньший»."
memory: "minister — «министр», и на нём три правила разом: беглое e выпадает (ministra), r переходит в rz в предложном (o ministrze), а множественное идёт на -owie (ministrowie). Обращение — panie ministrze."
idioms:
  - { pl: "panie ministrze", ru: "господин министр" }
  - { pl: "rada ministrów", ru: "совет министров" }
