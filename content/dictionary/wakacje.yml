# review
id: wakacje
format: 2
lemma: "wakacje"
rank: 1502
pos: noun
pron: { cyr: "вака́цье" }
senses:
  - id: holidays
    ru: "каникулы"
    examples:
      - pl: "Wakacje zaczynają się w lipcu."
        ru: "Каникулы начинаются в июле."
        source: { kind: tatoeba, id: 12564132 }
      - pl: "Jak tam wakacje?"
        ru: "Как каникулы?"
        source: { kind: tatoeba, id: 6315381 }
      - pl: "Jestem na wakacjach."
        ru: "Я на каникулах."
        source: { kind: translated, id: 12299334 }
  - id: vacation
    ru: "отдых, отпускное время"
    examples:
      - pl: "Potrzebuję wakacji!"
        ru: "Мне нужны каникулы!"
        source: { kind: translated, id: 3152130 }
      - pl: "Byłem na wakacjach za granicą."
        ru: "Я был на каникулах за границей."
        source: { kind: tatoeba, id: 349613 }
notes:
  - { kind: usage, text: "Форма wakacyj — устаревший родительный множественного; современная норма wakacji (nie ma wakacji «нет каникул»), поэтому wakacyj оставлена без примеров. Так у всех слов на -ja: lekcja — lekcji, stacja — stacji." }
  - { kind: usage, text: "Слово существует только во множественном числе, как русские «каникулы»: Wakacje zaczynają się w lipcu. Единственного числа нет." }
  - { kind: false-friend, text: "wakacje — это школьные или студенческие каникулы, обычно летние. Отпуск работника — urlop, совсем другое слово." }
  - { kind: government, text: "na wakacjach «на каникулах» и na wakacje «на каникулы»: jadę na wakacje, jestem na wakacjach." }
  - { kind: usage, text: "Miłych wakacji! — «Хороших каникул!», стандартное пожелание." }
collocations:
  - { pl: "letnie wakacje", ru: "летние каникулы" }
  - { pl: "na wakacjach", ru: "на каникулах" }
  - { pl: "miłych wakacji", ru: "хороших каникул" }
etymology: "Из латинского vacatio «освобождение от дел» через европейские языки. Русские «каникулы» идут от латинского canicula «собачка» — по названию звезды, так что слова не родственны."
memory: "wakacje — «каникулы», только множественное число, как в русском. Но осторожно: это школьные каникулы, а отпуск работника — urlop. Na wakacjach «на каникулах»."
idioms:
  - { pl: "letnie wakacje", ru: "летние каникулы" }
  - { pl: "na wakacjach", ru: "на каникулах" }
  - { pl: "miłych wakacji", ru: "хороших каникул" }
formExamplesSkip:
