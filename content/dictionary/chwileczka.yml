notes:
  - { kind: usage, text: "Двойное уменьшительное: chwila «минута» даёт chwilka, а chwilka даёт chwileczka. Каждая ступень звучит мягче предыдущей." }
  - { kind: usage, text: "В живой речи слово встречается почти только в винительном падеже: Chwileczkę! «Минуточку!». Остальные формы теоретически есть, но их не употребляют." }
  - { kind: usage, text: "Это вежливая просьба подождать, мягче чем Czekaj! «Подожди!». Ею же останавливают собеседника: Chwileczkę, nie tak szybko." }
  - { kind: usage, text: "Русское «минуточку» устроено так же: уменьшительное от «минуты», застывшее в винительном падеже." }
