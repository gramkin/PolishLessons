# review
id: strzal
format: 2
lemma: "strzał"
rank: 1399
pos: noun
pron: { cyr: "стшау" }
senses:
  - id: shot
    ru: "выстрел"
    examples:
      - pl: "Policjant oddał strzał ostrzegawczy."
        ru: "Полицейский сделал предупредительный выстрел."
        source: { kind: translated, id: 8948262 }
      - pl: "Tomowi wydawało się, że usłyszał strzał."
        ru: "Тому показалось, что он услышал выстрел."
        source: { kind: translated, id: 7165605 }
      - pl: "Oddała strzał."
        ru: "Она сделала выстрел."
        source: { kind: translated, id: 11611536 }
  - id: shots
    ru: "strzały — выстрелы; а также стрелы"
    examples:
      - pl: "Słyszałem strzały."
        ru: "Я слышал выстрелы."
        source: { kind: translated, id: 2838347 }
      - pl: "W oddali usłyszałem strzały."
        ru: "Вдали я услышал выстрелы."
        source: { kind: translated, id: 1605854 }
      - pl: "Strzały nie mogą przebić łusek smoka."
        ru: "Стрелы не могут пробить чешую дракона."
        source: { kind: tatoeba, id: 10999951 }
  - id: attempt
    ru: "попытка, удар; strzał w ciemno «наугад»"
    examples:
      - pl: "Niezły strzał!"
        ru: "Неплохой удар!"
        source: { kind: translated, id: 8617247 }
      - pl: "To był strzał w ciemno."
        ru: "Это был выстрел наугад."
        source: { kind: translated, id: 13654093 }
      - pl: "Masz jeden strzał."
        ru: "У тебя одна попытка."
        source: { kind: translated, id: 8182265 }
notes:
  - { kind: usage, text: "Strzał — и «выстрел», и «удар» в спорте: niezły strzał «неплохой удар». В переносном смысле — «попытка»." }
  - { kind: usage, text: "Strzał w ciemno — «выстрел наугад», а strzał w dziesiątkę — «попадание в десятку», то есть точное решение." }
  - { kind: false-friend, text: "Множественное strzały значит и «выстрелы», и «стрелы» — форма совпадает с множественным от strzała «стрела». Различает контекст." }
  - { kind: pronunciation, text: "Сочетание rz звучит как «ш» после глухого t, а конечное ł как «у»: стшау." }
collocations:
  - { pl: "oddać strzał", ru: "произвести выстрел" }
  - { pl: "strzał w ciemno", ru: "выстрел наугад" }
  - { pl: "strzał w dziesiątkę", ru: "попадание в десятку" }
etymology: "От strzelać «стрелять», из праславянского *strěla «стрела». Русские «стрела» и «стрелять» — то же гнездо."
memory: "strzał — «выстрел», а в спорте «удар»: niezły strzał. Переносно значит «попытка»: strzał w ciemno «наугад», strzał w dziesiątkę «в точку». Конечное ł звучит как «у»: стшау."
idioms:
  - { pl: "strzał w ciemno", ru: "выстрел наугад" }
  - { pl: "strzał w dziesiątkę", ru: "попадание в десятку" }
  - { pl: "oddać strzał", ru: "произвести выстрел" }
