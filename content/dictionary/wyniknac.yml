# review
id: wyniknac
format: 2
lemma: "wyniknąć"
rank: 2016
pos: verb
aspect: perf
aspectPair: wynikac
pron: { cyr: "выни́кнонць" }
senses:
  - id: result
    ru: "произойти, выйти, получиться (из чего-л.)"
    examples:
      - pl: "Niewykluczone, że porażka wynikła z jego bezczynności."
        ru: "Не исключено, что поражение произошло из-за его бездействия."
        source: { kind: translated, id: 365313 }
      - pl: "Zapomnienie parasola w pociągu wynikło z twojej nieuwagi."
        ru: "То, что зонт забыли в поезде, вышло из твоей невнимательности."
        source: { kind: translated, id: 830348 }
      - pl: "Z tego wynikł spór."
        ru: "Из этого вышел спор."
        source: { kind: authored }
      - pl: "Wynikły poważne problemy."
        ru: "Возникли серьёзные проблемы."
        source: { kind: authored }
      - pl: "Co z tego wynikło?"
        ru: "Что из этого вышло?"
        source: { kind: authored }
notes:
  - { kind: government, text: "Будущее время дано только в третьем лице: подлежащее у wyniknąć — то, что получается, а не человек (z tego wyniknie spór). Форм wyniknę, wynikniesz язык не знает — карточка их и так пропускает." }
  - { kind: usage, text: "Совершенный вид к wynikać: там процесс, здесь результат." }
  - { kind: government, text: "Всегда с предлогом z и родительным падежом: wyniknąć z czegoś «выйти, произойти из чего-л.»." }
  - { kind: usage, text: "Чаще всего встречается в прошедшем времени: z tego wynikł spór «из этого вышел спор»." }
  - { kind: false-friend, text: "Не «вынырнуть». Корень -niknąć тот же, что в przeniknąć «проникнуть» и wniknąć «вникнуть»." }
  - { kind: usage, text: "Прошедшее время у глагола двойное, и обе формы правильны: wynikł и wyniknął, wynikły и wyniknęły — как zniknął рядом с znikł. Это общая черта глаголов на -nąć." }
collocations:
  - { pl: "wyniknąć z czegoś", ru: "произойти из чего-л." }
etymology: "wy- + -niknąć, тот же корень, что в przeniknąć «проникнуть»; ср. русское «проникнуть», «вникнуть»."
memory: "wyniknąć — совершенный вид к wynikać: «выйти, произойти из чего-л.». Всегда с z: z tego wynikł spór «из этого вышел спор»."
idioms:
  - { pl: "co z tego wynikło?", ru: "что из этого вышло?" }
