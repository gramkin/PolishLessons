  - id: glance
    ru: "взгляд (в оборотах rzucić okiem, mieć na oku)"
    examples:
      - pl: "Tom rzucił okiem na zegarek."
        ru: "Том бросил взгляд на часы."
        source: { kind: tatoeba, id: 8666087 }
