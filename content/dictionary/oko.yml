        ru: "Я вижу это в твоих глазах."
        source: { kind: tatoeba, id: 2630869 }
notes:
  - { kind: usage, text: "Множественное число — oczy; творительный имеет два варианта: oczami и книжное oczyma." }
  - { kind: false-friend, text: "Русское «око» — прямой родственник, но в польском это обычное, а не высокое слово: oko значит просто «глаз»." }
collocations:
  - { pl: "na oko", ru: "на глаз" }
  - { pl: "rzucić okiem", ru: "взглянуть" }
  - { pl: "mieć na oku", ru: "присматривать" }
etymology: "Праславянское *oko — то же слово, что русское «око». В русском его вытеснило «глаз», а в польском оно осталось нейтральным названием органа зрения."
memory: "oko = «глаз» (русское «око» — тот же корень, но в польском без книжного оттенка). Множественное oczy, а в творительном две формы: обычная oczami и книжная oczyma."
idioms:
  - { pl: "oko za oko", ru: "око за око" }
  - { pl: "mieć kogoś na oku", ru: "присматривать за кем-то" }
  - { pl: "rzucić okiem", ru: "взглянуть" }
  - { pl: "w cztery oczy", ru: "с глазу на глаз" }
formExamplesSkip:
  - { form: "ok", reason: "в список форм попало английское OK: это артефакт выгрузки, к слову oko он отношения не имеет. У технического множественного oka («ячейки сети», «кружки жира») родительный падеж в живом языке берётся от уменьшительного oczko — oczek: sieć o drobnych oczkach, sieć bez oczek" }
  - { form: "ócz", reason: "Устаревшая форма родительного падежа множественного числа; в современном языке употребляется oczu." }
