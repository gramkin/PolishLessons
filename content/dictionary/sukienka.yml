# review
id: sukienka
format: 2
lemma: "sukienka"
rank: 1539
pos: noun
pron: { cyr: "суке́нка" }
senses:
  - id: dress
    ru: "платье"
    examples:
      - pl: "Ładna sukienka."
        ru: "Красивое платье."
        source: { kind: translated, id: 1353171 }
      - pl: "Ta sukienka jest dla mnie za duża."
        ru: "Это платье мне велико."
        source: { kind: tatoeba, id: 6154740 }
      - pl: "Ile kosztuje ta sukienka?"
        ru: "Сколько стоит это платье?"
        source: { kind: translated, id: 609875 }
  - id: wearing
    ru: "платье (надетое, о внешнем виде)"
    examples:
      - pl: "Wyglądasz pięknie w tej sukience."
        ru: "Ты прекрасно выглядишь в этом платье."
        source: { kind: translated, id: 4820975 }
      - pl: "Ślicznie wyglądała w różowej sukience."
        ru: "Она чудесно выглядела в розовом платье."
        source: { kind: translated, id: 925907 }
      - pl: "Tom poprosił Mary, żeby włożyła niebieską sukienkę."
        ru: "Том попросил Мэри, чтобы она надела голубое платье."
        source: { kind: tatoeba, id: 6159933 }
notes:
  - { kind: usage, text: "sukienka — уменьшительное от suknia «платье». В обиходе почти всегда sukienka, а suknia — про бальное или свадебное: suknia ślubna «свадебное платье»." }
  - { kind: government, text: "«В платье» — w sukience, предложный падеж: w różowej sukience «в розовом платье». «Надеть платье» — włożyć sukienkę, винительный." }
  - { kind: false-friend, text: "Не путайте с ubranie «одежда вообще» и garnitur «костюм»." }
  - { kind: usage, text: "Звательная форма sukienko в корпусе не встречается — у неодушевлённых существительных она почти не употребляется." }
collocations:
  - { pl: "ładna sukienka", ru: "красивое платье" }
  - { pl: "w sukience", ru: "в платье" }
  - { pl: "włożyć sukienkę", ru: "надеть платье" }
etymology: "Уменьшительное от suknia, а то — от sukno «сукно»: ткань дала название одежде. Русское «сукно» — то же слово, но платье от него в русском не назвали."
memory: "sukienka = «платье», уменьшительное от suknia. Нарядное или свадебное — suknia (suknia ślubna), повседневное — sukienka. Падежи: w sukience «в платье», włożyć sukienkę «надеть платье»."
idioms:
  - { pl: "suknia ślubna", ru: "свадебное платье" }
  - { pl: "w sukience", ru: "в платье" }
  - { pl: "letnia sukienka", ru: "летнее платье" }
formExamplesSkip:
  - { form: "sukienko", reason: "звательный падеж у неодушевлённых существительных в современном языке остался только в поэтическом обращении: в обычной речи вместо sukienko говорят sukienka" }
