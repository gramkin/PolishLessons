notes:
  - { kind: false-friend, text: "Важное отличие от русского: student — это только учащийся вуза. Школьник — uczeń, у него своя карточка. По-русски «студент» тоже про вуз, но «ученик» и «студент» в польском разделены строже." }
  - { kind: usage, text: "Именительный множественного для лиц — studenci, с чередованием t → c. Остальные падежи от основы student-: studentów, studentom." }
  - { kind: usage, text: "Женский род — studentka. Оборот wieczny student значит «вечный студент»." }
collocations:
  - { pl: "jestem studentem", ru: "я студент" }
  - { pl: "studenci uniwersytetu", ru: "студенты университета" }
  - { pl: "wieczny student", ru: "вечный студент" }
etymology: "Из латинского studens «усердствующий, занимающийся», от studere «стараться, учиться». Русское «студент» — то же заимствование, пришедшее через немецкий."
memory: "student — только учащийся вуза; школьник по-польски uczeń. Во множественном для лиц: studenci, с чередованием t на c."
idioms:
