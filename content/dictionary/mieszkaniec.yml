        ru: "Число жителей деревни падает."
        source: { kind: authored }
  - id: resident
    ru: "проживающий, жилец (о доме, квартале)"
    examples:
      - pl: "Mieszkańcom kamienicy wymieniono okna."
        ru: "Жильцам дома поменяли окна."
        source: { kind: authored }
      - pl: "Rozmawiał z mieszkańcem trzeciego piętra."
        ru: "Он говорил с жильцом третьего этажа."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "КОРЕНЬ РОДНОЙ, НО СМЫСЛ РАЗОШЁЛСЯ, и это стоит знать. Mieszkać значит «жить, проживать», а русское «МЕШКАТЬ» — то же слово — значит «медлить, задерживаться». Общее у них исходное «оставаться на месте»: польский вывел отсюда «жить где-то», русский — «застрять, тянуть время». Поэтому mieszkaniec это «житель», а никак не «медлительный человек»." }
  - { kind: usage, text: "Mieszkaniec говорит только о месте жительства и ничего о гражданстве: для этого есть obywatel «гражданин». Поэтому mieszkaniec Warszawy — всякий, кто живёт в Варшаве, а obywatel Polski — гражданин Польши. О жильцах дома скажут и lokator." }
  - { kind: pronunciation, text: "Беглое e и мягкость: mieszkaniec, но mieszkańca, mieszkańcowi, mieszkańcy — e из последнего слога выпадает, а n становится ń. Так же ведут себя chłopiec/chłopca и ojciec/ojca. Звательная форма mieszkańcze встречается почти только в торжественных обращениях." }
collocations:
  - { pl: "mieszkaniec miasta", ru: "житель города" }
  - { pl: "liczba mieszkańców", ru: "число жителей" }
  - { pl: "mieszkańcy wsi", ru: "сельские жители" }
family:
  - { pl: "mieszkać", ru: "жить, проживать", relation: root, id: mieszkac }
  - { pl: "mieszkanie", ru: "квартира", relation: root }
  - { pl: "obywatel", ru: "гражданин", relation: derived }
etymology: "От mieszkać «жить, проживать» с суффиксом -ec, обозначающим действующее лицо, как в pracownik или wygnaniec. Корень тот же, что в русском «мешкать», и исходный смысл был «оставаться, задерживаться на месте»: польский развил его до «жить где-то», русский — до «медлить». Отсюда же mieszkanie «квартира»."
memory: "mieszkaniec — «житель», от mieszkać «жить». Русское «мешкать» — тот же корень с разошедшимся смыслом: оставаться на месте стало по-польски «жить», а по-русски «медлить». И следите за беглым e: mieszkaniec, но mieszkańca."
idioms:
  - { pl: "mieszkaniec z dziada pradziada", ru: "житель в нескольких поколениях" }
  - { pl: "rdzenny mieszkaniec", ru: "коренной житель" }
