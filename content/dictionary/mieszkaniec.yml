rank: 1872
pos: noun
pron: { cyr: "мешка́ньец" }
senses:
  - id: inhabitant
    ru: "житель, обитатель"
    examples:
      - pl: "Mieszkańcy miasta wyszli na ulice."
        ru: "Жители города вышли на улицы."
        source: { kind: authored }
      - pl: "Każdy mieszkaniec dostał zawiadomienie."
        ru: "Каждый житель получил извещение."
        source: { kind: authored }
