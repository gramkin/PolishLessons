notes:
  - { kind: false-friend, text: "Полное совпадение с русским «проспать», причём в ОБОИХ значениях: и «провести во сне какое-то время» (przespać noc — «проспать ночь»), и «пропустить, прозевав» (przespać budzik — «проспать будильник»). Приставки те же: prze- отвечает русскому «про-», а корень spać это «спать». Запоминать тут нечего, кроме формы настоящего времени." }
  - { kind: usage, text: "В настоящем времени s переходит в ś: przespać, но prześpię, prześpisz, prześpi, prześpimy, prześpicie, prześpią. Это чередование охватывает всю настоящую основу и повелительное наклонение (prześpij), а прошедшее время и причастия сохраняют s: przespał, przespany." }
  - { kind: government, text: "Проспать ЧТО — винительный: przespać noc, przespać wykład, przespać budzik. Как и в русском, объектом бывает либо отрезок времени, либо пропущенное событие. Возвратное przespać się значит «выспаться, вздремнуть», а przespać się z czymś — «обдумать на свежую голову», ровно как русское «утро вечера мудренее»." }
collocations:
  - { pl: "przespać noc", ru: "проспать ночь" }
  - { pl: "przespać budzik", ru: "проспать будильник" }
  - { pl: "przespać się z decyzją", ru: "обдумать решение на свежую голову" }
family:
  - { pl: "spać", ru: "спать", relation: root, id: spac }
  - { pl: "wyspać się", ru: "выспаться", relation: derived }
  - { pl: "przesypiać", ru: "просыпать (время)", relation: aspect }
etymology: "Приставка prze- плюс spać, праславянское *spati «спать». Русское «проспать» собрано из тех же частей: «про-» отвечает польскому prze-, корень общий. Из того же гнезда польские sen «сон», senny «сонный», zasnąć «заснуть» — и все они прозрачны для русского уха."
memory: "przespać — «проспать», и в смысле провести во сне, и в смысле пропустить. Prze- это «про-», spać это «спать». Единственная трудность — s переходит в ś в настоящем: prześpię, prześpisz."
idioms:
  - { pl: "przespać się z czymś", ru: "обдумать что-л. на свежую голову" }
  - { pl: "przespać okazję", ru: "проспать возможность" }
formExamplesSkip:
  - { form: "przespani", reason: "Мужско-личная форма страдательного причастия. Глагол przespać берёт дополнением только отрезок времени (przespać noc) или пропущенное событие (przespać budzik, przespać wykład), но никогда человека. Винительного дополнения-лица у него нет, поэтому подлежащего для такого оборота не существует: людей не «просыпают». Формы przespana noc и dobrze przespane noce при этом совершенно правильны." }
