# review
id: wyobrazic
format: 2
lemma: "wyobrazić"
rank: 1118
pos: verb
aspect: perf
pron: { cyr: "выобра́зиць" }
senses:
  - id: imagine
    ru: "wyobrazić sobie — представить себе"
    examples:
      - pl: "Możesz sobie to wyobrazić?"
        ru: "Можешь себе это представить?"
        source: { kind: translated, id: 3997744 }
      - pl: "Nie mogę sobie wyobrazić życia bez ciebie."
        ru: "Я не могу представить себе жизнь без тебя."
        source: { kind: translated, id: 352121 }
      - pl: "Trudno wyobrazić sobie życie bez telewizji i internetu."
        ru: "Трудно представить себе жизнь без телевизора и Интернета."
        source: { kind: tatoeba, id: 6671610 }
  - id: imperative
    ru: "wyobraź sobie — представь себе"
    examples:
      - pl: "Wyobraź sobie, że masz wehikuł czasu."
        ru: "Представь, что у тебя есть машина времени."
        source: { kind: tatoeba, id: 660330 }
      - pl: "Wyobraź sobie, jaki byłby świat bez internetu."
        ru: "Представь, каким был бы мир без интернета."
        source: { kind: translated, id: 5956186 }
  - id: notion
    ru: "wyobrażenie — представление, образ"
    examples:
      - pl: "Masz dziwne wyobrażenie o szczęściu."
        ru: "У тебя странное представление о счастье."
        source: { kind: tatoeba, id: 6304064 }
      - pl: "Każdy z nas ma swoje osobiste wyobrażenie miłości."
        ru: "У каждого из нас своё представление о любви."
        source: { kind: translated, id: 6304069 }
notes:
  - { kind: government, text: "sobie тут обязательно: wyobrazić SOBIE «представить себе». Без sobie глагол значит «изобразить». По-русски «себе» часто опускают, по-польски нет." }
  - { kind: usage, text: "Несовершенный вид — wyobrażać. Корень — obraz «образ, картина»." }
  - { kind: usage, text: "Wyobraź sobie! работает как вводное «Представь себе!, Вообрази!» — с него часто начинают рассказ." }
  - { kind: usage, text: "Два производных легко спутать: wyobraźnia «воображение» и wyobrażenie «представление, образ»." }
collocations:
  - { pl: "wyobrazić sobie", ru: "представить себе" }
  - { pl: "wyobraź sobie", ru: "представь себе" }
  - { pl: "nie do wyobrażenia", ru: "невообразимо" }
  - { pl: "mieć wyobrażenie", ru: "иметь представление" }
family:
  - { pl: "wyobrażać", ru: "представлять (несовершенный вид)", relation: aspect }
  - { pl: "wyobraźnia", ru: "воображение", relation: derived }
  - { pl: "obraz", ru: "образ, картина", relation: root }
etymology: "Приставка wy- плюс obraz «образ, картина» — буквально «вы-образить». Русское «вообразить» собрано от того же «образа», только с другой приставкой."
memory: "wyobrazić sobie — «представить себе», и sobie тут обязательно: без него глагол значит «изобразить». Отсюда wyobraźnia «воображение» и wyobrażenie «представление»."
idioms:
  - { pl: "wyobraź sobie", ru: "представь себе" }
  - { pl: "nie do wyobrażenia", ru: "невообразимо" }
formExamplesSkip:
  - { form: "wyobraziwszy", reason: "книжное деепричастие прошедшего времени; в живой речи не употребляется" }
