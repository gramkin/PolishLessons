# review
id: pokrecic
format: 2
lemma: "pokręcić"
rank: 4896
pos: verb
pron: { cyr: "покрэ́нциць" }
senses:
  - id: turn
    ru: "покрутить (ручку, руль); с SIĘ — покрутиться, повертеться"
    examples:
      - pl: "Pokręcił gałką radia i złapał stację."
        ru: "Он покрутил ручку радио и поймал станцию."
        source: { kind: authored }
      - pl: "Dziecko pokręciło się na karuzeli."
        ru: "Ребёнок покатался на карусели."
        source: { kind: authored }
      - pl: "Pokręcę się trochę po mieście."
        ru: "Я немного пошатаюсь по городу."
        source: { kind: authored }
  - id: shake-head
    ru: "покачать (головой)"
    examples:
      - pl: "Pokręciła głową z niedowierzaniem."
        ru: "Она недоверчиво покачала головой."
        source: { kind: authored }
      - pl: "Ojciec tylko pokręcił głową."
        ru: "Отец только покачал головой."
        source: { kind: authored }
  - id: mix-up
    ru: "разг. перепутать, напутать"
    examples:
      - pl: "Coś pokręciłem z datami."
        ru: "Я что-то напутал с датами."
        source: { kind: authored }
      - pl: "Pokręciłaś nazwiska na liście."
        ru: "Ты перепутала фамилии в списке."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "POKRĘCIĆ GŁOWĄ — «покачать головой» в знак несогласия или удивления, а не «покрутить головой» по сторонам. Оглядеться — ROZEJRZEĆ SIĘ. Жест «покрутить пальцем у виска» — POPUKAĆ SIĘ W CZOŁO." }
  - { kind: usage, text: "Пятьдесят три формы. Страдательное POKRĘCONY живёт как прилагательное «запутанный, странный, чокнутый»: POKRĘCONA HISTORIA, POKRĘCENI LUDZIE. Несовершенный вид — KRĘCIĆ. С SIĘ — «повертеться, пошататься где-то»." }
  - { kind: government, text: "Чем — творительный: POKRĘCIĆ GŁOWĄ, POKRĘCIĆ KIEROWNICĄ. Что — винительный: POKRĘCIĆ GAŁKĘ, хотя с ручками и кранами чаще творительный. В разговорном «напутать» — что: POKRĘCIĆ DATY, или Z чем: POKRĘCIĆ Z ADRESEM." }
  - { kind: pronunciation, text: "Читается «покрэ́нциць»: Ę перед C — носовое «эн», CI — «ци». Ударение на предпоследнем слоге. POKRĘĆ — «по́крэнць»." }
  - { kind: register, text: "В значении «покрутить» — нейтральное. «Напутать» и POKRĘCONY «чокнутый» — разговорные. POKRĘCIĆ SIĘ PO MIEŚCIE — непринуждённое «пошататься по городу»." }
collocations:
  - { pl: "pokręcić głową", ru: "покачать головой" }
  - { pl: "pokręcić się po mieście", ru: "пошататься по городу" }
  - { pl: "pokręcona historia", ru: "запутанная история" }
family:
  - { pl: "kręcić", ru: "крутить, вертеть", relation: root, id: krecic }
  - { pl: "zakręcić", ru: "закрутить, завернуть", relation: derived }
  - { pl: "pokrętło", ru: "ручка-регулятор", relation: derived }
etymology: "Приставка PO- плюс KRĘCIĆ «крутить», праславянское *krǫtiti; польское Ę соответствует русскому «у»: KRĘCIĆ — «крутить»."
memory: "Pokręcić — покрутить: pokręcił gałką. Pokręcić głową — покачать головой. Pokręcony — запутанный, чокнутый. Читается «покрэ́нциць»."
idioms:
  - { pl: "pokręcić nosem", ru: "поморщиться, выразить недовольство" }
