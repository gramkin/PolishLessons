pron: { cyr: "ко́пнонць" }
senses:
  - id: kick
    ru: "пнуть, ударить ногой"
    examples:
      - pl: "Kopnął piłkę do bramki."
        ru: "Он пнул мяч в ворота."
        source: { kind: authored }
      - pl: "Koń kopnął stajennego."
