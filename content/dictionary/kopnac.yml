        source: { kind: authored }
  - id: zap
    ru: "ударить током (разг.)"
    examples:
      - pl: "Kopnął mnie prąd."
        ru: "Меня ударило током."
        source: { kind: authored }
      - pl: "Uważaj, ten kabel może kopnąć."
        ru: "Осторожно, этот провод может ударить током."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "KOPNĄĆ — не «копнуть»: «копать» по-польски KOPAĆ, а однократное KOPNĄĆ — «пнуть». Польское KOPAĆ значит и «копать», и «пинать», а KOPNĄĆ — почти только «пнуть». Разговорное KOPNIĘTY — «чокнутый»: JESTEŚ KOPNIĘTY!" }
  - { kind: usage, text: "Пятьдесят три формы — подпись переходного глагола совершенного вида: страдательное KOPNIĘTY и деепричастие KOPNĄWSZY. Суффикс -NĄĆ — однократное действие, как русское -нуть: KOPAĆ — KOPNĄĆ, «пинать — пнуть». Чередование: KOPNĄŁ, но KOPNĘŁA, KOPNĘLI." }
  - { kind: government, text: "Кого или что — винительный: KOPNĄĆ PIŁKĘ, KOPNĄĆ PSA. Куда — W с винительным: KOPNĄĆ KOGOŚ W KOLANO, W TYŁEK. Ток бьёт без предлога: KOPNĄŁ GO PRĄD. Возвратное KOPNĄĆ SIĘ — «сгонять, сбегать» (разг.): KOPNĘ SIĘ DO SKLEPU." }
  - { kind: pronunciation, text: "Читается «ко́пнонць», два слога, ударение на первом. Ą перед Ć — носовое «он», конечное Ć — «ць». KOPNĘŁA — «копнэ́уа», Ę перед Ł звучит как простое «э»." }
  - { kind: register, text: "Нейтральное бытовое и спортивное слово. KOPNĄĆ W KALENDARZ — шутливое «отбросить коньки, умереть». KOPNĄĆ SIĘ DOKĄDŚ — разговорное «смотаться куда-то». KOPNIĘTY — фамильярное «чокнутый»." }
collocations:
  - { pl: "kopnąć piłkę", ru: "пнуть мяч" }
  - { pl: "kopnąć w kalendarz", ru: "отбросить коньки" }
  - { pl: "kopnął go prąd", ru: "его ударило током" }
family:
  - { pl: "kopać", ru: "копать; пинать", relation: aspect, id: kopac }
  - { pl: "kopniak", ru: "пинок", relation: derived }
  - { pl: "kopnięty", ru: "чокнутый (разг.)", relation: derived }
etymology: "Однократный глагол от KOPAĆ «копать; бить ногой», праславянское *kopati, то же, что русское «копать». В польском у глагола развилось второе значение — «бить ногой», как у копыта: KOPYTO и KOPAĆ — одного корня."
memory: "Kopnąć — пнуть: kopnąć piłkę. Kopnął mnie prąd — ударило током. Kopnąć w kalendarz — отбросить коньки. Kopnięty — чокнутый. Читается «ко́пнонць»."
idioms:
  - { pl: "kopnąć w kalendarz", ru: "отбросить коньки" }
