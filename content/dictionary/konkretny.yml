notes:
  - { kind: false-friend, text: "ВТОРОЕ ЗНАЧЕНИЕ ЛИТЕРАТУРНОМУ РУССКОМУ НЕЗНАКОМО. Кроме «конкретный» в смысле «определённый», польское KONKRETNY в разговорной речи значит «дельный, основательный, что надо»: konkretny facet «мужик что надо», konkretna robota «работа на совесть», konkretny posiłek «плотный обед». Это похвала, а не указание на точность. Русское «конкретный» так не работает, разве что в жаргоне." }
  - { kind: usage, text: "Мужско-личное множественное — KONKRETNI, без всяких чередований: основа на -n просто получает -i. Это проще, чем у suchy — susi или przeciwnik — przeciwnicy, где заднеязычные смягчаются. Стоит заметить разницу: чередование запускает не окончание само по себе, а согласный перед ним." }
  - { kind: usage, text: "Степени сравнения живые, в отличие от szczególny: KONKRETNIEJSZY и NAJKONKRETNIEJSZY употребляют свободно, потому что «определённость» градуируется легко. Można być konkretniejszym w odpowiedzi — «можно быть конкретнее в ответе». Наречие от того же корня — KONKRETNIE «конкретно»." }
collocations:
  - { pl: "konkretny przykład", ru: "конкретный пример" }
  - { pl: "konkretna propozycja", ru: "конкретное предложение" }
  - { pl: "konkretny facet", ru: "дельный мужик" }
family:
  - { pl: "konkret", ru: "конкретика, конкретный факт", relation: root }
  - { pl: "konkretnie", ru: "конкретно", relation: derived }
  - { pl: "ogólny", ru: "общий", relation: antonym }
etymology: "Из латинского concretus «сросшийся, сгущённый», причастия от concrescere «срастаться». И русский, и польский взяли слово из научной латыни в одном и том же значении «предметный, осязаемый». Разговорное польское «дельный» выросло уже на месте: то, что осязаемо и плотно, стало синонимом надёжного."
memory: "Два значения: «конкретный» как у нас и разговорное «дельный, основательный» — konkretny facet это похвала. А множественное мужско-личное простое: konkretni, без чередования."
idioms:
  - { pl: "konkretny facet", ru: "дельный мужик, мужик что надо" }
  - { pl: "przejść do konkretów", ru: "перейти к конкретике" }
