etymology: "От AKTOR, из латинского ACTOR «исполнитель, тот, кто действует», от AGERE «действовать, вести». Женская форма образована польским суффиксом -KA, восходящим к праславянскому *-ъka, и это принципиальное отличие от русского пути: русский в восемнадцатом веке взял французское ACTRICE вместе с его собственным женским суффиксом -ICE и получил «актрису», тогда как польский обошёлся своим средством. Из того же латинского AGERE идут AKCJA «действие», AKT, AKTYWNY и REAKCJA; корень действия в них лежит открыто. Суффикс -KA в польском настолько продуктивен, что женскую форму можно образовать почти от любого названия профессии, и современная норма это поощряет."
memory: "Значение как в русском, образование другое: польский сделал aktorka от aktor своим суффиксом -ka, а русский заимствовал готовую французскую «актрису». Поэтому «акторка» по-русски нет, а aktrysa по-польски не говорят. Так же pisarka, malarka, lekarka. Дательный и местный aktorce с k→c, родительный множественного aktorek с беглой e — как matka/matce/matek."
