notes:
  - { kind: false-friend, text: "Значение то же, что у русской «актрисы», а способ образования совсем другой, и это стоит заметить. Польский взял AKTOR и прибавил свой суффикс -KA: AKTORKA. Русский взял французское ACTRICE и получил «актрису», то есть заимствовал женскую форму целиком. Поэтому «акторка» по-русски не существует, а AKTRYSA по-польски звучало бы странно. Это общее различие в стратегии: польский предпочитает образовать женское название своим суффиксом, русский — заимствовать готовое. Так же PISARKA «писательница», MALARKA «художница», LEKARKA «врач-женщина», и ни в одном случае русский не пользуется тем же приёмом так свободно." }
  - { kind: usage, text: "Склонение обычное для женских слов на -KA, с двумя стандартными ходами. Перед окончанием -E заднее K смягчается в C, отсюда дательный и местный AKTORCE, как MATKA даёт MATCE и PUSZKA даёт PUSZCE. В родительном множественного появляется беглая гласная E, разбивающая скопление RK: AKTOREK, а не «aktork» — так же, как MATEK и CÓREK. Форма AKTORKI покрывает родительный единственного вместе с именительным и винительным множественного. Звательный AKTORKO употребляется редко, в основном в обращении со сцены или в письме." }
  - { kind: government, text: "Женский род. Чья актриса или какая — прилагательное либо родительный: AKTORKA TEATRALNA «театральная актриса», AKTORKA FILMOWA, AKTORKA TEGO TEATRU. Кем стала — творительный при ZOSTAĆ и BYĆ: ZOSTAŁA AKTORKĄ, JEST AKTORKĄ. Частотные глаголы: ZAANGAŻOWAĆ AKTORKĘ «пригласить актрису», OBSADZIĆ AKTORKĘ W ROLI «дать актрисе роль» — с предлогом W и местным. Мужское соответствие AKTOR, собирательное AKTORSTWO «актёрское искусство», прилагательное AKTORSKI." }
  - { kind: pronunciation, text: "Читается «акто́рка», три слога, ударение на предпоследнем. Оба A произносятся полно, как «а». Буква R одиночная и раскатистая, O в середине звучит «о» без редукции. В дательном и местном AKTORCE сочетание RC даёт «рц»: «акто́рце». В родительном множественного AKTOREK вставная E читается «э»: «акто́рэк». Ударение во всех формах остаётся на предпоследнем слоге и перемещается само." }
