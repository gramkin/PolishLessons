etymology: "Из праславянского *čarъ, того же слова, что русские «чары», «чародей» и «очарование». Корень связан с идеей действия, совершаемого словом, и родствен древнеиндийскому KRTYA «колдовство»; та же основа дала литовское KERETI «колдовать». Оба языка сохранили корень полностью, но распорядились числом по-разному: русский закрепил за колдовством множественное и лишил единственное самостоятельной жизни, а польский оставил единственное в ходу и отдал ему переносное значение обаяния. Поэтому CZAR и «чары» — одно слово, расписанное по разным числам. Производное CZARODZIEJ построено как русский «чародей», с тем же вторым корнем *dě- «делать»: буквально тот, кто делает чары."
memory: "Одно слово с русскими «чарами», но число решает всё: единственное czar значит «обаяние, очарование», множественное czary — колдовство, и тут языки совпадают, ведь русские «чары» тоже только во множественном. Местный czarze показывает главное правило: польское rz это чаще всего смягчённое r, как towar и towarze. Производные узнаются сразу: czarować, czarodziej — ровно как «чародей», тот, кто делает чары."
idioms:
  - { pl: "prysnął czar", ru: "чары рассеялись" }
