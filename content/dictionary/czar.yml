notes:
  - { kind: false-friend, text: "Слово родственно русским «чарам», и корень тот же, но объём значений разный, и зависит он от числа. В единственном числе CZAR означает обаяние, прелесть, очарование: CZAR STAREGO MIASTA. Русский в этом значении скажет «очарование», потому что «чар» в единственном числе он почти не употребляет. Во множественном CZARY означает колдовство, и здесь языки сходятся полностью: русские «чары» тоже существуют только во множественном. Таким образом одно польское слово покрывает два русских: единственное отвечает «очарованию», множественное — «чарам»." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Местный единственного — CZARZE, где конечное R основы переходит в RZ перед окончанием -E: это обязательная мена, та же, что в TOWARZE от TOWAR и SERZE от SER. Так проще всего увидеть правило: буква RZ в польском чаще всего и есть смягчённое R. Родительный единственного — CZARU. Именительный и винительный множественного — CZARY, и в значении колдовства употребляется только эта форма и дальнейшие формы множественного. Винительный единственного равен именительному." }
  - { kind: pronunciation, text: "Читается «чар», один слог. Буквосочетание CZ даёт твёрдое «ч», а конечное R раскатистое. В форме CZARZE сочетание RZ звучит «ж», и слово читается «ча́же» — то есть на слух местный падеж совсем не похож на именительный, хотя на письме разница в одну букву. В форме CZARY слышно «ча́ры», с обычным «р». В форме CZARÓW буква Ó даёт «у», а конечное W оглушается: «ча́руф»." }
  - { kind: register, text: "В значении обаяния слово слегка книжное и всегда одобрительное: PEŁEN CZARU «полный обаяния», CZAR OSOBISTY «личное обаяние», ULEC CZAROWI «поддаться обаянию». Устойчивое PRYSNĄŁ CZAR значит «чары рассеялись», о внезапном разочаровании, и употребляется очень часто. В значении колдовства слово сказочное: CZARY, ZAKLĘCIA, CZARNOKSIĘŻNIK. Детское восклицание CZARY MARY отвечает русскому «абракадабра». Производные: CZAROWAĆ «колдовать; очаровывать», CZARUJĄCY «очаровательный», CZARODZIEJ «волшебник»." }
