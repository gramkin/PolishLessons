notes:
  - { kind: false-friend, text: "ДВА ЯЗЫКА ВЫБРАЛИ ИЗ ОДНОЙ ПАРЫ РАЗНЫЕ СЛОВА. У польского есть и греческое HELIKOPTER, и своё ŚMIGŁOWIEC, от śmigło «винт». В быту говорят helikopter, а śmigłowiec держится в военном и официальном языке. Русский поступил наоборот: прижилось своё «вертолёт», а «геликоптер» звучит архаично." }
  - { kind: usage, text: "Предложный — w HELIKOPTERZE, с переходом r→rz: тот же тип, что aktor → aktorze и rozmiar → rozmiarze. Родительный единственного — helikoptera, с окончанием -a, хотя предмет неодушевлённый: так же ведут себя plus, szampan и kij." }
  - { kind: pronunciation, text: "Четыре слога, ударение на предпоследнем: he-li-ko-PTER, точнее he-li-KO-pter. Польское h читается как х, e открытое: «хэліко́птэр». В предложном слышно «хэліко́птэже»." }
collocations:
  - { pl: "helikopter ratunkowy", ru: "спасательный вертолёт" }
  - { pl: "lecieć helikopterem", ru: "лететь вертолётом" }
  - { pl: "lądowisko dla helikopterów", ru: "вертолётная площадка" }
family:
  - { pl: "śmigłowiec", ru: "вертолёт (офиц.)", relation: root }
  - { pl: "samolot", ru: "самолёт", relation: root, id: samolot }
  - { pl: "pilot", ru: "пилот", relation: root, id: pilot }
etymology: "Из французского hélicoptère, сложения греческих helix «винт, спираль» и pteron «крыло». То же слово дало русское «геликоптер», которое вытеснил свой «вертолёт». Польское śmigłowiec — такая же своя калька, от śmigło «винт», только она осталась официальной."
memory: "helikopter — «вертолёт», и это обиходное слово; своё śmigłowiec звучит официально. У русского наоборот: «вертолёт» в быту, «геликоптер» устарело. Предложный — w helikopterze, с r→rz."
