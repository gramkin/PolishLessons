notes:
  - { kind: usage, text: "Слово от CZOŁO «лоб», и русскому уху сначала слышится «лобовой». Это значение есть: ZDERZENIE CZOŁOWE «лобовое столкновение», KOŚĆ CZOŁOWA «лобная кость». Но в газетах и новостях CZOŁOWY почти всегда значит «ведущий, передовой»: CZOŁOWY POLITYK «ведущий политик», CZOŁOWE MIEJSCE «одно из первых мест». Образ тот же, что в русском «во главе»: кто впереди, тот на самом «лбу» колонны." }
  - { kind: pronunciation, text: "Читается «чоуо́вы». Обе буквы Ł звучат как «у», а не как «л», и это главная ловушка: не «чоло́вы». Ударение на предпоследнем слоге. Мужско-личное множественное число CZOŁOWI звучит «чоуо́ви»: CZOŁOWI ZAWODNICY «ведущие спортсмены»." }
  - { kind: usage, text: "Степеней сравнения у слова нет: «ведущий» уже означает место впереди, поэтому форм одиннадцать. Сравнивают через существительное CZOŁÓWKA «верхушка, лидеры»: BYĆ W CZOŁÓWCE «быть среди лидеров». Слово часто стоит перед существительным и почти не бывает сказуемым." }
