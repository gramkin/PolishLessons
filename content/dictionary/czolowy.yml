synonyms: ["wiodący", "przodujący", "główny"]
etymology: "Образовано от CZOŁO «лоб», которое соответствует русскому книжному «чело». Значение «ведущий» идёт от образа того, кто стоит впереди, во главе."
memory: "Czoło — «лоб», «чело»; czołowy — тот, кто впереди, «во главе»: czołowy polityk «ведущий политик». Лобовое столкновение — zderzenie czołowe. Читать «чоуо́вы»: оба Ł — «у»."
idioms:
  - { pl: "zderzenie czołowe", ru: "лобовое столкновение (и в переносном смысле: открытое противостояние)" }
