pron: { cyr: "здэспэро́ваны" }
senses:
  - id: desperate
    ru: "отчаявшийся, доведённый до отчаяния"
    examples:
      - pl: "Zdesperowany ojciec zaczepiał przechodniów, szukając syna."
        ru: "Отчаявшийся отец останавливал прохожих в поисках сына."
        source: { kind: authored }
      - pl: "Była tak zdesperowana, że sprzedała obrączkę."
        ru: "Она была в таком отчаянии, что продала обручальное кольцо."
        source: { kind: authored }
      - pl: "Zdesperowani mieszkańcy zablokowali drogę."
        ru: "Доведённые до отчаяния жители перекрыли дорогу."
        source: { kind: authored }
  - id: desperate-act
    ru: "отчаянный (о поступке)"
    examples:
      - pl: "To był zdesperowany krok człowieka bez wyjścia."
        ru: "Это был отчаянный шаг человека без выхода."
        source: { kind: authored }
      - pl: "Jego zdesperowane wołanie o pomoc zostało bez odpowiedzi."
        ru: "Его отчаянный зов о помощи остался без ответа."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Русское «отчаянный» двусмысленно: это и «отчаявшийся», и «смелый до безрассудства», «отчаянный парень». Польское ZDESPEROWANY — только первое: человек, у которого опустились руки и который готов на всё. Безрассудно смелого назовут BRAWUROWY или ODWAŻNY. Человек в отчаянии как существительное — DESPERAT." }
  - { kind: usage, text: "Сравнивается описательно: BARDZIEJ ZDESPEROWANY. Все одиннадцать форм живые. Форма для мужчин-людей ZDESPEROWANI частая в новостях: ZDESPEROWANI ROLNICY, ZDESPEROWANI RODZICE. Слово похоже на причастие от несуществующего глагола ZDESPEROWAĆ, и именно поэтому склоняется как прилагательное." }
  - { kind: government, text: "Доведённый до отчаяния чем-то — ZDESPEROWANY + творительный или Z POWODU с родительным: ZDESPEROWANY BRAKIEM PIENIĘDZY, ZDESPEROWANY Z POWODU DŁUGÓW. Готов на всё — GOTÓW NA WSZYSTKO, частая пара к этому слову." }
  - { kind: pronunciation, text: "Читается «здэспэро́ваны», пять слогов, ударение на предпоследнем. В начале скопление ZD, без гласной: «здэ». Оба E твёрдые: «дэ» и «пэ»." }
  - { kind: register, text: "Нейтральное слово, частое в журналистике и в разговоре. В разговоре о себе поляк скажет JESTEM ZDESPEROWANY, и это звучит сильно, без иронии. Более лёгкий оттенок — ZAŁAMANY, «сломленный», или MAM DOŚĆ, «с меня хватит»." }
collocations:
  - { pl: "zdesperowany krok", ru: "отчаянный шаг" }
  - { pl: "zdesperowani rodzice", ru: "отчаявшиеся родители" }
  - { pl: "zdesperowany i gotów na wszystko", ru: "отчаявшийся и готовый на всё" }
family:
  - { pl: "desperacja", ru: "отчаяние", relation: root }
  - { pl: "desperat", ru: "отчаявшийся человек, сорвиголова", relation: derived }
  - { pl: "rozpacz", ru: "отчаяние, горе", relation: root, id: rozpacz }
etymology: "Из латинского desperare, «терять надежду»: de- «прочь» и sperare «надеяться». Польский взял латинский корень, приделал к нему славянскую приставку Z- и причастный суффикс -OWANY, хотя самого глагола ZDESPEROWAĆ в языке нет. Получилось гибридное слово, как DESPERACJA и DESPERAT, которых нет в русском."
memory: "Zdesperowany — отчаявшийся, доведённый до отчаяния: zdesperowany ojciec. Не «отчаянный храбрец», а тот, у кого опустились руки. Desperacja — отчаяние. Читается «здэспэро́ваны»."
idioms:
  - { pl: "z desperacji", ru: "от отчаяния" }
