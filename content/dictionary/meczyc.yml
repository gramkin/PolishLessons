        ru: "Он мучился над этим текстом до ночи."
        source: { kind: authored }
notes:
  - { kind: government, text: "męczyć kogoś, coś — ВИНИТЕЛЬНЫЙ падеж: męczyć psa, męczyć dzieci nauką. Дополнением почти всегда бывает живое существо, поэтому мужсколичное męczeni совершенно обычно: męczeni upałem robotnicy. Возвратное męczyć się nad czymś — «мучиться над чем-л.»." }
  - { kind: false-friend, text: "Корень тот же, что в русском «мучить», и соответствие точное. Обратите внимание на регулярное чередование: польское ę отвечает русскому у в целой серии слов — męczyć и «мучить», męka и «мука», mąż и «муж». Это следы праславянских носовых, которые русский утратил, а польский сохранил." }
  - { kind: usage, text: "Несовершенный вид; совершенные приставочные — zmęczyć «утомить», zamęczyć «замучить». Действительное причастие męczący давно стало прилагательным «утомительный»: męcząca podróż, męczący upał." }
  - { kind: usage, text: "Из того же корня męczennik «мученик» и męka «мука, мучение» — оба слова прямо отвечают русским. Выражение męki tantala «танталовы муки» тоже есть в обоих языках." }
collocations:
  - { pl: "męczyć zwierzęta", ru: "мучить животных" }
  - { pl: "męczyć się nad czymś", ru: "мучиться над чем-л." }
  - { pl: "męcząca podróż", ru: "утомительная поездка" }
family:
  - { pl: "zmęczyć", ru: "утомить", relation: aspect }
  - { pl: "męka", ru: "мука, мучение", relation: derived }
  - { pl: "męczennik", ru: "мученик", relation: derived }
etymology: "Праславянское *mǫčiti, от *mǫka «мучение». Русское «мучить» — прямой родственник, и носовой ǫ, который польский сохранил как ę, в русском дал у: отсюда пары męczyć/«мучить», męka/«мука», mąż/«муж». Из того же гнезда męczennik «мученик»."
memory: "męczyć — русское «мучить», и чередование регулярное: польское ę отвечает русскому у, как в męka/«мука» и mąż/«муж». Возвратное męczyć się значит «уставать, мучиться», а męczący — просто «утомительный»."
idioms:
  - { pl: "męczyć się jak w piekle", ru: "мучиться как в аду" }
  - { pl: "męcząca cisza", ru: "тягостная тишина" }
