etymology: "От SZLACHTA «дворянство», заимствованного из древневерхненемецкого slahta, «род, порода»; современное немецкое Geschlecht. Благородный — «хорошего рода». Русское «благородный» собрано по той же логике, только своими словами: «благой род»."
memory: "Szlachetny — благородный: szlachetny gest, szlachetne serce. И драгоценный: kamień szlachetny, metale szlachetne. От szlachta — дворянство. Читается «шляхэ́тны»."
