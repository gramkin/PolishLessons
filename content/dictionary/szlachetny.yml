notes:
  - { kind: false-friend, text: "Русскому SZLACHETNY не подсказывает, а корень знаком по истории: SZLACHTA, польское дворянство. Благородный когда-то значило «дворянский», как и русское «благородие». Сейчас SZLACHETNY — о душе и поступках: SZLACHETNY CZYN, SZLACHETNE SERCE. В химии METALE SZLACHETNE и GAZY SZLACHETNE — «благородные металлы» и «инертные газы», и это точные термины." }
  - { kind: usage, text: "Полная парадигма: SZLACHETNY, SZLACHETNIEJSZY, NAJSZLACHETNIEJSZY. Простые степени живые, особенно превосходная: NAJSZLACHETNIEJSZY CZŁOWIEK. Форма для мужчин-людей во всех трёх: SZLACHETNI, SZLACHETNIEJSI, NAJSZLACHETNIEJSI." }
  - { kind: government, text: "Благородно по отношению к кому-то — SZLACHETNY WOBEC KOGOŚ, WOBEC с родительным. С CEL «цель»: SZLACHETNY CEL, «благородная цель», NA SZLACHETNY CEL — «на благое дело». Падежных требований само слово не имеет." }
  - { kind: pronunciation, text: "Читается «шляхэ́тны», три слога, ударение на предпоследнем. SZLA — «шля», CH — «х», CHE — твёрдое «хэ». В SZLACHETNIEJSZY: «шляхэтне́йшы»." }
  - { kind: register, text: "Книжное и торжественное слово с высоким тоном: в разговоре о хорошем поступке скорее скажут PIĘKNY GEST или PORZĄDNY CZŁOWIEK. С иронией SZLACHETNY звучит как «уж больно благородный»: TAKI SZLACHETNY, A PIENIĄDZE BIERZE." }
