etymology: "Через французское APPARTEMENT из итальянского APPARTAMENTO, от APPARTARE «отделять», а то — от латинского AD PARTEM «в сторону, отдельно». Исходный смысл — отделённая часть дома, обособленное помещение; из него и выросло значение больших покоев. Оба языка взяли слово в восемнадцатом или девятнадцатом веке и оба упростили двойное P итальянского написания по-своему: польский оставил одно P и одно M, APARTAMENT, а русский сохранил двойное П в «апартаментах». Это общее правило: польский почти никогда не удваивает согласные в заимствованиях, тогда как русский часто сохраняет удвоение источника, и пара APARTAMENT и «апартамент» показывает это наглядно, как и KOLEKCJA рядом с «коллекцией» или ADRES рядом с «адресом»."
memory: "Значение то же, но польский говорит в единственном и нейтрально: apartament na piątym piętrze. Обычная квартира — mieszkanie, а apartament всегда большой или гостиничный. Одно p и одно m: польский не удваивает согласные в заимствованиях, как adres против «адреса». В местном t→c: w apartamencie, как namiot/namiocie и krawat/krawacie."
