notes:
  - { kind: false-friend, text: "Разница с русским не в значении, а в числе и оттенке. Польский свободно употребляет APARTAMENT в единственном: APARTAMENT NA PIĄTYM PIĘTRZE «апартамент на пятом этаже», WYNAJĄĆ APARTAMENT. Русские «апартаменты» обычно звучат во множественном и нередко с иронией или с оттенком роскоши. Второе: обычная квартира по-польски MIESZKANIE, и это нейтральное слово на каждый день, тогда как APARTAMENT всегда означает что-то большое или гостиничное. Поэтому «я снял квартиру» это WYNAJĄŁEM MIESZKANIE, а не APARTAMENT. Не путайте и с APARTAMENTOWIEC — так называют жилой дом повышенного класса, целое здание, а не помещение в нём." }
  - { kind: usage, text: "В местном падеже единственного числа конечное T переходит в C: APARTAMENCIE, а не «apartamentie». Это одно из самых полезных чередований в польском, потому что срабатывает у всех основ на T: NAMIOT даёт NAMIOCIE, KRAWAT даёт KRAWACIE, ŚWIT даёт ŚWICIE, ZAPŁATA даёт ZAPŁACIE. Русскому это чередование незнакомо, и ошибка в нём слышна сразу. Остальное склонение обычное для мужского неодушевлённого: родительный единственного APARTAMENTU на -U, родительный множественного APARTAMENTÓW, именительный множественного APARTAMENTY." }
  - { kind: government, text: "Мужской род, неодушевлённое. «В апартаменте» — предлог W с местным: W APARTAMENCIE. «В апартамент» о движении — W с винительным или DO с родительным: DO APARTAMENTU. Частотные глаголы: WYNAJĄĆ APARTAMENT «снять апартамент», WYNAJMOWAĆ APARTAMENTY «сдавать апартаменты», ZAREZERWOWAĆ APARTAMENT «забронировать номер». Прилагательные: APARTAMENT HOTELOWY, APARTAMENT DWUPOZIOMOWY «двухуровневый». Хозяин или управляющий — ZARZĄDCA, а не «apartamentowy»." }
  - { kind: pronunciation, text: "Читается «апарта́мэнт», четыре слога, ударение на предпоследнем, то есть на TA. Оба A в начале произносятся полно, как «а», без редукции. Буква E даёт «э» и не смягчает предшествующего согласного, поэтому MEN звучит «мэн», а не «мен». В местном падеже APARTAMENCIE сочетание CIE даёт мягкое «це»: «апартаме́нце», пять слогов, и ударение снова уходит на предпоследний. Конечное T глухое и ясное." }
