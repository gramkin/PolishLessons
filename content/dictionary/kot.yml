notes:
  - { kind: usage, text: "Форма kotowie оставлена без примеров: множественное от kot — koty. Окончание -owie берут только мужско-личные существительные, то есть слова о людях: pan — panowie, syn — synowie, profesor — profesorowie. Кот одушевлённый, но не лицо, поэтому это окончание ему не положено." }
  - { kind: pronunciation, text: "Слово звучит в точности как kod «код» — там конечное d оглушается. Различают их только написание и контекст." }
  - { kind: usage, text: "Русское «кошка» и «кот» покрываются одним kot; для самки есть отдельное kotka, а котёнок — kotek или kociak." }
  - { kind: usage, text: "Разговорное mieć kota значит «быть с приветом, спятить», а не «иметь кота» — контекст решает." }
  - { kind: usage, text: "Идиомы те же, что в русском: bawić się jak kot z myszą «играть как кошка с мышью», żyć jak pies z kotem «жить как кошка с собакой»." }
collocations:
  - { pl: "mieć kota", ru: "иметь кота" }
  - { pl: "czarny kot", ru: "чёрный кот" }
  - { pl: "jak pies z kotem", ru: "как кошка с собакой" }
etymology: "Праславянское *kotъ, а оно из латинского cattus. Русские «кот» и «кошка» — то же заимствование, пришедшее тем же путём."
memory: "kot — «кот» и «кошка» сразу; самка отдельно kotka, котёнок — kotek. Звучит в точности как kod «код»: там d оглушается. И осторожно: mieć kota в разговоре значит «быть с приветом»."
idioms:
  - { pl: "jak pies z kotem", ru: "как кошка с собакой" }
  - { pl: "bawić się jak kot z myszą", ru: "играть как кошка с мышью" }
  - { pl: "czarny kot", ru: "чёрный кот" }
formExamplesSkip:
