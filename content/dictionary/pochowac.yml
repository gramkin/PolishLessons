etymology: "Приставка po- и CHOWAĆ, из праславянского *xovati «прятать, оберегать» — тот же корень, что русские «хоронить», «схоронить», «хранить». В древности корень означал именно «прятать, укрывать», и русское «хоронить» получило нынешний узкий смысл позже, через «укрыть в земле». Польский обоих смыслов не терял: CHOWAĆ до сих пор значит и «прятать», и «хранить», и «воспитывать» — последнее через «оберегать, растить», откуда WYCHOWANIE «воспитание». Приставка po- добавляет множественность: не одну вещь в одно место, а все по своим местам."
memory: "Русское «хоронить» когда-то значило «прятать» — отсюда «схорониться». Польский хранит оба смысла: pochować это и «похоронить», и «попрятать всё по местам». И внимание: pochowam, не pochowuję."
idioms:
  - { pl: "pochować się po kątach", ru: "спрятаться по углам" }
  - { pl: "pochować kogoś z honorami", ru: "похоронить кого-то с почестями" }
