notes:
  - { kind: pronunciation, text: "Ловушка в самом конце слова. POCHOWAĆ оканчивается на -OWAĆ, но настоящее время у него на -AM, а не на -UJĘ: POCHOWAM, POCHOWASZ, POCHOWA. Правило из предыдущей карточки SPAKOWAĆ тут не работает, и вот почему: у SPAKOWAĆ -OWA- это суффикс, приставленный к корню PAK-, а у POCHOWAĆ основа сама оканчивается на -CHOW-, и -AĆ просто к ней прибавляется. Буквы те же, устройство разное. Проверять надо не по концу слова, а по корню: есть ли там -ow- без него. PAKOWAĆ без суффикса даёт PAK (тюк), CHOWAĆ без -ow- не даёт ничего." }
  - { kind: usage, text: "Приставка po- тут значит не «по-» в смысле начала, а «всё по порядку, одно за другим», и это второй её смысл, который русскому знаком по «попрятать», «поубирать». POCHOWAĆ ZABAWKI — убрать все игрушки, каждую на своё место, а не одну. То же в POCHOWAĆ SIĘ: дети спрятались все и в разных местах, PO KĄTACH. От глагола SCHOWAĆ, который прячет одну вещь в одно место, он отличается именно множественностью." }
  - { kind: false-friend, text: "Два значения этого слова русскому кажутся несвязанными, но связаны они как раз через русский. «Хоронить» в старом языке и значило «прятать, хранить, оберегать» — отсюда «схорониться» (спрятаться) и «хранить». Польский сохранил оба смысла в одном корне открыто: CHOWAĆ — это и «прятать», и «хранить», и «растить, воспитывать» (DOBRZE WYCHOWANY — «хорошо воспитанный»), а с приставкой po- ещё и «похоронить». Так что путаницы тут нет: похоронить значит укрыть, спрятать в землю." }
  - { kind: government, text: "Кого — винительный, где — предлог NA с местным: POCHOWAĆ KOGOŚ NA CMENTARZU. Рядом с кем — OBOK с родительным: OBOK BABCI. В значении «спрятать»: что — винительный, куда — DO с родительным (DO PUDEŁKA, DO SZUFLADY) или POD с творительным (POD ŁÓŻKIEM). А возвратное POCHOWAĆ SIĘ берёт PO с местным множественного: POCHOWAĆ SIĘ PO KĄTACH — «спрятаться по углам», и русский строит так же." }
