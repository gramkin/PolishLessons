notes:
  - { kind: false-friend, text: "Одна гласная отделяет это слово от предмета на кухне. CZAJNIK, через A, значит «чайник». CZUJNIK, через U, значит «датчик». Слова не родственны ничем: CZAJNIK от CZAJ, старого названия чая, а CZUJNIK от CZUĆ «чуять, чувствовать». Поэтому WSTAW CZAJNIK это «поставь чайник», а WYMIEŃ CZUJNIK — «замени датчик», и перепутать их значит сказать нелепость. Проверять проще всего по смыслу корня: если речь о чувствовании, значит U." }
  - { kind: pronunciation, text: "Читается «чу́йник», два слога, ударение на первом. Сочетание CZ даёт твёрдое «ч», буква U — «у», буква J — «й». Получается слово, которое русскому уху кажется знакомым, хотя значит совсем другое. В родительном CZUJNIKA слышно «чу́йника», ударение остаётся на первом слоге, потому что оно всегда на предпоследнем, а слогов становится три: «чуй-ни-ка». В глаголе CZUĆ слышно «чучь», с мягким конечным Ć." }
  - { kind: government, text: "Что именно измеряет датчик, указывается родительным падежом без предлога: CZUJNIK DYMU «датчик дыма», CZUJNIK RUCHU «датчик движения», CZUJNIK TEMPERATURY «датчик температуры». Русский строит это так же, через родительный, так что переносить ничего не нужно. Место установки идёт предлогом W с местным: CZUJNIK W KORYTARZU. А глагол CZUĆ управляет винительным прямо: CZUJĘ GAZ «я чувствую запах газа», и здесь польский обходится одним словом там, где русский добавляет «запах»." }
  - { kind: usage, text: "Существительное мужского рода неодушевлённое, десять падежных форм. Образовано суффиксом -NIK, который в польском делает названия приборов и орудий, и это целый разряд, который стоит запомнить вместе: CZUJNIK «датчик», LICZNIK «счётчик», GŁOŚNIK «громкоговоритель», GRZEJNIK «радиатор», ZLEWNIK и ZEGARMISTRZ уже другое дело. Русский в этих случаях пользуется суффиксами -ЧИК, -ТЕЛЬ и -НИК, и соответствие LICZNIK со «счётчиком» видно прямо." }
  - { kind: register, text: "Слово техническое, но совершенно бытовое: датчики дыма висят в каждой новой квартире, датчики движения на лестницах, датчики в машине. Частые обороты: CZUJNIK DYMU, CZUJNIK RUCHU, CZUJNIK TEMPERATURY, WYMIENIĆ BATERIĘ W CZUJNIKU «заменить батарейку в датчике». Прилагательное CZUJNY того же корня значит «бдительный, чуткий»: CZUJNY STRÓŻ «бдительный сторож», а CZUJNOŚĆ — «бдительность»." }
