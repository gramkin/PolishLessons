etymology: "От глагола CZUĆ «чувствовать, чуять», от праславянского корня, давшего русские «чуять», «чувство», «чуткий». Прибор назван по тому, что он делает: он чует. Русский для того же прибора пошёл от другого глагола и назвал его «датчиком», то есть тем, что даёт показание, так что два языка описали одну вещь с противоположных сторон, со стороны восприятия и со стороны выдачи. Суффикс -NIK здесь тот же, что в LICZNIK «счётчик» и GŁOŚNIK, и отвечает русским -ЧИК и -ТЕЛЬ в названиях приборов. Из того же гнезда CZUJNY «бдительный» и CZUWAĆ «бодрствовать, дежурить»."
memory: "Главная ловушка одна и стоит целого слова: czajnik через a это «чайник», а czujnik через u это «датчик». Корни разные, czujnik от czuć «чуять». Отсюда и образ: поляк назвал прибор по тому, что он чует, а русский по тому, что он даёт показание. Суффикс -nik делает названия приборов, licznik «счётчик», głośnik, grzejnik. Управление как в русском, родительным: czujnik dymu, czujnik ruchu. Читается «чу́йник», ударение на первом слоге."
