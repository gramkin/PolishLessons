# review
id: niedziela
format: 2
lemma: "niedziela"
rank: 2063
pos: noun
pron: { cyr: "недзе́ля" }
senses:
  - id: sunday
    ru: "воскресенье"
    examples:
      - pl: "Wczoraj była niedziela."
        ru: "Вчера было воскресенье."
        source: { kind: tatoeba, id: 354019 }
      - pl: "Jutro będzie niedziela."
        ru: "Завтра воскресенье."
        source: { kind: tatoeba, id: 4451410 }
