pron: { cyr: "недзе́ля" }
senses:
  - id: sunday
    ru: "воскресенье"
    examples:
      - pl: "Wczoraj była niedziela."
        ru: "Вчера было воскресенье."
        source: { kind: tatoeba, id: 354019 }
      - pl: "Jutro będzie niedziela."
        ru: "Завтра воскресенье."
        source: { kind: tatoeba, id: 4451410 }
      - pl: "Niedziela to ostatni dzień tygodnia."
        ru: "Воскресенье - последний день недели."
        source: { kind: tatoeba, id: 356536 }
  - id: on-sunday
    ru: "в воскресенье, по воскресеньям"
    examples:
      - pl: "Gramy w niedzielę."
        ru: "Мы играем в воскресенье."
        source: { kind: tatoeba, id: 6031120 }
      - pl: "Pracuję w niedziele."
        ru: "Я работаю по воскресеньям."
        source: { kind: tatoeba, id: 5699790 }
      - pl: "Nie pracujemy w niedziele."
        ru: "Мы не работаем по воскресеньям."
        source: { kind: tatoeba, id: 412922 }
notes:
  - { kind: government, text: "Когда — w niedzielę (винительный падеж): gramy w niedzielę. По воскресеньям — w niedziele, тоже винительный, но множественное число: pracuję w niedziele." }
  - { kind: false-friend, text: "Главная ловушка: польское niedziela значит «воскресенье», а русское «неделя» — это tydzień. Слова похожи, а означают разное." }
  - { kind: usage, text: "Само слово от nie dzielić «не делать»: воскресенье — день, когда не работают. Русское «неделя» имело то же значение, а потом стало обозначать семь дней." }
  - { kind: usage, text: "Дни недели пишутся со строчной буквы: niedziela, poniedziałek. И poniedziałek буквально значит «после воскресенья»." }
collocations:
  - { pl: "w niedzielę", ru: "в воскресенье" }
  - { pl: "w niedziele", ru: "по воскресеньям" }
  - { pl: "co niedziela", ru: "каждое воскресенье" }
family:
  - { pl: "poniedziałek", ru: "понедельник", relation: root }
  - { pl: "sobota", ru: "суббота", relation: root, id: sobota }
  - { pl: "tydzień", ru: "неделя", relation: root, id: tydzien }
etymology: "От nie dzielić «не делать, не работать»: день, когда не трудятся. Русское «неделя» значило то же самое, но потом стало названием семи дней — отсюда и ловушка."
memory: "niedziela — «воскресенье», а не «неделя»: неделя по-польски tydzień. В воскресенье — w niedzielę, по воскресеньям — w niedziele."
idioms:
