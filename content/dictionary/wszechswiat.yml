# review
id: wszechswiat
format: 2
lemma: "wszechświat"
rank: 1705
pos: noun
pron: { cyr: "фшэ́хсьвят" }
senses:
  - id: universe
    ru: "вселенная"
    examples:
      - pl: "Jak powstał wszechświat?"
        ru: "Как возникла Вселенная?"
        source: { kind: tatoeba, id: 12240078 }
      - pl: "Bóg stworzył wszechświat."
        ru: "Бог создал вселенную."
        source: { kind: tatoeba, id: 361314 }
      - pl: "Wszechświat nie ma granic."
        ru: "Вселенная не имеет границ."
        source: { kind: tatoeba, id: 8096828 }
  - id: in-universe
    ru: "во вселенной; центр вселенной"
    examples:
      - pl: "We wszechświecie są miliardy gwiazd."
        ru: "Во Вселенной миллиарды звёзд."
        source: { kind: tatoeba, id: 3629651 }
      - pl: "Jest wiele galaktyk we wszechświecie."
        ru: "Во Вселенной есть много галактик."
        source: { kind: tatoeba, id: 527584 }
      - pl: "On uważa się za środek wszechświata."
        ru: "Он считает себя центром мироздания."
        source: { kind: tatoeba, id: 2671571 }
notes:
  - { kind: usage, text: "Пишется и со строчной, и с прописной буквы: wszechświat или Wszechświat — как русское «вселенная» и «Вселенная»." }
  - { kind: government, text: "Предлог w перед стечением согласных удлиняется до we: we wszechświecie «во вселенной»." }
  - { kind: usage, text: "Приставка wszech- значит «все-»: wszechświat «весь свет», wszechmocny «всемогущий», wszechstronny «всесторонний»." }
  - { kind: false-friend, text: "Слово kosmos в польском тоже есть, но wszechświat шире: это всё сущее, а не только космическое пространство." }
collocations:
  - { pl: "centrum wszechświata", ru: "центр вселенной" }
  - { pl: "we wszechświecie", ru: "во вселенной" }
  - { pl: "powstanie wszechświata", ru: "возникновение вселенной" }
family:
  - { pl: "świat", ru: "мир, свет", relation: root, id: swiat }
  - { pl: "wszechmocny", ru: "всемогущий", relation: root }
  - { pl: "wszechstronny", ru: "всесторонний", relation: root }
etymology: "Сложение wszech- «все-» и świat «свет, мир»: буквально «весь свет». Русское «вселенная» построено от «вселять» — другой образ при том же смысле."
memory: "wszechświat — «вселенная», буквально «весь свет»: wszech- «все-» плюс świat «мир». Предлог перед ним удлиняется: we wszechświecie."
