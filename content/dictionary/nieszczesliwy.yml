notes:
  - { kind: usage, text: "Два значения слова объясняются одним свойством корня: польское SZCZĘŚCIE означает и счастье, и удачу, без всякого различения. Поэтому NIESZCZĘŚLIWY покрывает сразу и «несчастный» о человеке, и «неудачный, злополучный» о событии: NIESZCZĘŚLIWY CZŁOWIEK и NIESZCZĘŚLIWY WYPADEK «несчастный случай». Русский в первом значении скажет «несчастный», во втором — «несчастный случай» как термин, а в прочих — «неудачный». Отдельно живёт существительное NIESZCZĘŚCIE «несчастье, беда», и его множественное NIESZCZĘŚCIA значит именно беды." }
  - { kind: false-friend, text: "Слово пишется слитно и целиком, со всеми тремя частями: NIE- плюс SZCZĘŚĆ- плюс -LIWY. Русское «несчастливый» устроено так же, и правило слитного написания в обоих языках одинаково, так что переносить его не надо. Ловушка в другом: русское «несчастный» в значении «вызывающий жалость» ближе к польскому BIEDNY или NIESZCZĘSNY — второе слово отдельное, книжное, и значит «злополучный, горемычный». То есть NIESZCZĘŚLIWY и NIESZCZĘSNY — разные прилагательные от одного корня, и путать их не стоит: первое про состояние, второе про печальную судьбу." }
  - { kind: pronunciation, text: "Читается «нешчэ́нсьливы», и это одно из самых трудных слов для русского языка в словаре. Разберём по частям: NIE даёт «не», SZCZ — «шч», то есть ш и ч подряд, ĘŚ — носовое «энсь», LI — «ли», WY — «вы». Ударение на предпоследнем слоге, то есть на -LI-. Сочетание SZCZ требует произнести ш и ч подряд, без гласной между ними, и внутри слова русский такого сочетания не знает: «счастье» звучит «щастье», одним звуком, а не двумя. Поэтому SZCZ приходится отрабатывать отдельно. Проговорить стоит медленно и по слогам: NIE-SZCZĘ-ŚLI-WY." }
  - { kind: government, text: "Прилагательное согласуется с существительным. Чем или в чём несчастен — предлог W с местным: NIESZCZĘŚLIWY W MAŁŻEŃSTWIE «несчастен в браке», NIESZCZĘŚLIWY W MIŁOŚCI. Причина вводится предлогом Z POWODU с родительным или просто творительным: NIESZCZĘŚLIWY Z POWODU STRATY. Степени сравнения правильные, суффиксом: NIESZCZĘŚLIWSZY, NAJNIESZCZĘŚLIWSZY, хотя в живой речи предпочитают описательное BARDZIEJ NIESZCZĘŚLIWY, потому что форма длинна. Наречие — NIESZCZĘŚLIWIE, и оно значит «несчастливо, неудачно»." }
