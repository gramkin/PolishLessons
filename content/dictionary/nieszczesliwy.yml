etymology: "Отрицание NIE- плюс SZCZĘŚLIWY, от SZCZĘŚCIE, из праславянского *sъčęstьje. Разбор его стоит знать, потому что он объясняет сразу и польское, и русское слово: приставка *sъ- «с, хороший» и корень *čęstь «часть, доля». То есть счастье есть «хорошая доля», доброе участие в разделе — и русское «счастье» собрано из тех же двух частей тем же способом, от «съ» и «часть». Поэтому польское CZĘŚĆ «часть» и SZCZĘŚCIE «счастье» родственны напрямую, как «часть» и «счастье» в русском, и это родство большинство носителей обоих языков не замечает. Суффикс -LIWY, как и в WRAŻLIWY, обозначает склонность, так что NIESZCZĘŚLIWY буквально «тот, кому не досталось доброй доли»."
memory: "Польское szczęście значит и счастье, и удачу, поэтому nieszczęśliwy покрывает два русских слова: «несчастный» о человеке и «неудачный» о событии — nieszczęśliwy wypadek «несчастный случай». Корень тот же, что в русском «счастье»: *sъ-čęstь «хорошая доля», и потому część «часть» ему родня. Читается «нешчэ́нсьливы», ударение на -li-."
