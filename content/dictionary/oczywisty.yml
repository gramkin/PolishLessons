# review
id: oczywisty
format: 2
lemma: "oczywisty"
rank: 1768
pos: adj
pron: { cyr: "очиви́сты" }
senses:
  - id: obvious
    ru: "очевидный, явный"
    examples:
      - pl: "To oczywiste."
        ru: "Это очевидно."
        source: { kind: translated, id: 587301 }
      - pl: "Odpowiedź jest oczywista."
        ru: "Ответ очевиден."
        source: { kind: translated, id: 12562247 }
      - pl: "Powód jest oczywisty."
        ru: "Причина очевидна."
        source: { kind: translated, id: 4881779 }
  - id: obvious-that
    ru: "очевидно, что…"
    examples:
      - pl: "To oczywiste, że kłamał."
        ru: "Очевидно, что он лгал."
        source: { kind: translated, id: 625126 }
      - pl: "To oczywiste, że skłamałeś."
        ru: "Очевидно, что ты солгал."
        source: { kind: translated, id: 3041452 }
      - pl: "Nie wiem, jak to udowodnić, to zbyt oczywiste."
        ru: "Я не знаю, как показать это, поскольку это и так вполне ясно."
        source: { kind: tatoeba, id: 349057 }
notes:
  - { kind: usage, text: "Простая сравнительная степень oczywistszy образуется, но слово длинное, и обычно говорят bardziej oczywisty. Мужско-личная форма oczywiści при этом совершенно обычна: oczywiści faworyci «очевидные фавориты»." }
  - { kind: usage, text: "Средний род oczywiste работает как безличное «очевидно»: To oczywiste, że kłamał «Очевидно, что он лгал»." }
  - { kind: usage, text: "Наречие — oczywiście «конечно, разумеется», одно из самых частых слов в разговоре." }
  - { kind: government, text: "Считать что-то само собой разумеющимся — uważać coś za oczywiste (винительный с za)." }
  - { kind: false-friend, text: "Корень тот же, что в русском «очевидный»: oko «око, глаз» плюс widzieć «видеть» — то, что видно глазом." }
collocations:
  - { pl: "to oczywiste", ru: "это очевидно" }
  - { pl: "oczywisty powód", ru: "очевидная причина" }
  - { pl: "rzecz oczywista", ru: "само собой разумеющееся" }
family:
  - { pl: "oczywiście", ru: "конечно, разумеется", relation: root }
  - { pl: "jasny", ru: "ясный", relation: root, id: jasny }
  - { pl: "pewny", ru: "уверенный, верный", relation: root, id: pewny }
etymology: "Сложение oko «око» и widzieć «видеть»: то, что видно глазом. Русское «очевидный» собрано из тех же двух частей."
memory: "oczywisty — «очевидный». Средний род работает безлично: To oczywiste, że… «Очевидно, что…». А наречие oczywiście значит «конечно»."
idioms:
  - { pl: "to oczywiste", ru: "это очевидно" }
  - { pl: "rzecz oczywista", ru: "само собой разумеющееся" }
  - { pl: "z oczywistych powodów", ru: "по очевидным причинам" }
