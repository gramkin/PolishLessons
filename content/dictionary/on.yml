senses:
  - id: he
    ru: "он (о лице или предмете мужского рода)"
    examples:
      - pl: "On tyje."
        ru: "Он толстеет."
        source: { kind: tatoeba, id: 527538 }
      - pl: "Rozumiem jego złość."
        ru: "Я понимаю его гнев."
        source: { kind: tatoeba, id: 418321 }
  - id: oblique
    ru: "в косвенных падежах: его, ему, им, нём"
    examples:
      - pl: "Rozzłościłem go."
        ru: "Я разозлил его."
        source: { kind: tatoeba, id: 524981 }
      - pl: "Dała mu zegarek."
        ru: "Она дала ему часы."
        source: { kind: tatoeba, id: 356049 }
      - pl: "Zadzwonię do niego później."
        ru: "Я ему позже позвоню."
        source: { kind: tatoeba, id: 360445 }
      - pl: "Polegam na nim."
        ru: "Я на него полагаюсь."
        source: { kind: tatoeba, id: 8675043 }
notes:
  - kind: usage
    text: "В родительном, дательном и винительном падежах есть полные и краткие формы: jego / go, jemu / mu. Краткие — обычные, безударные; полные — под логическим ударением или в начале фразы."
  - kind: pronunciation
    text: "После предлогов используются формы с n-: do niego, na nim, z nią — как русское «к нему», «с ней»."
  - kind: usage
    text: "Во множественном числе два слова: oni (есть мужчины) и one (мужчин нет)."
collocations:
  - { pl: "do niego", ru: "к нему" }
  - { pl: "bez niego", ru: "без него" }
  - { pl: "o nim", ru: "о нём" }
etymology: "Праславянское указательное *onъ «тот» — то же слово, что русское «он» и устаревшее «оный». Косвенные падежи идут от другого праславянского местоимения *jь: отсюда jego, jemu, ją, je — ср. русские «его», «ему», «их»."
memory: "У местоимения есть долгие и краткие формы: jego/go, jemu/mu, как русские ударное «его» и безударное «-го». Долгая форма стоит под логическим ударением и после предлога, краткая — в обычном порядке слов: Znam go, но Jego znam. После предлога добавляется n-: o nim, z nią, dla niego. И две ловушки для чтения: je — это и «их» (средний род), и «ест» от jeść; nie в роли местоимения устарело, в современном тексте это отрицание."
idioms:
  - { pl: "daj mu spokój", ru: "оставь его в покое" }
  - { pl: "co mu jest?", ru: "что с ним?" }
  - { pl: "niech mu będzie", ru: "пусть его, ладно уж" }
  - { pl: "jak mu tam?", ru: "как его там? (о забытом имени)" }
formExamplesSkip:
  - { form: "ń", reason: "Встречается только слитно с предлогом: nań, weń, doń, zeń — отдельным словом эта форма не употребляется." }
  - { form: "nie", reason: "Местоименное nie (винительный падеж) вышло из употребления; в современных текстах nie — это отрицание, поэтому примеров на эту форму нет." }
