# review
id: litosc
format: 2
lemma: "litość"
rank: 1648
pos: noun
pron: { cyr: "ли́тосьць" }
senses:
  - id: mercy
    ru: "жалость, милосердие, пощада"
    examples:
      - pl: "Litości!"
        ru: "Пощадите!"
        source: { kind: tatoeba, id: 11261690 }
      - pl: "Miej litość!"
        ru: "Пощадите!"
        source: { kind: tatoeba, id: 6160743 }
      - pl: "Nie miej litości."
        ru: "Не щади."
        source: { kind: translated, id: 8617363 }
  - id: no-mercy
    ru: "жалость (в отрицании и в мольбе)"
    examples:
      - pl: "Nie mam litości dla owadów."
        ru: "У меня нет жалости к насекомым."
        source: { kind: translated, id: 13041823 }
      - pl: "Litość leży niedaleko od miłości."
        ru: "Жалость лежит недалеко от любви."
        source: { kind: translated, id: 744243 }
  - id: for-gods-sake
    ru: "na litość boską — ради бога"
    examples:
      - pl: "Na litość boską, ścisz tę muzykę!"
        ru: "Ради бога, сделай эту музыку тише!"
        source: { kind: translated, id: 13654161 }
      - pl: "Na litość boską, nie wziąłem twojego cholernego samochodu."
        ru: "Ради бога, я не брал твою проклятую машину."
        source: { kind: translated, id: 1259118 }
notes:
  - { kind: usage, text: "Litości! и Miej litość! — «Пощадите!, Смилуйся!», самостоятельные восклицания." }
  - { kind: usage, text: "na litość boską — «ради бога», выражение досады или мольбы: Na litość boską, ścisz tę muzykę!" }
  - { kind: government, text: "«Жалость к кому-то» — litość dla kogoś: nie mam litości dla owadów «у меня нет жалости к насекомым»." }
  - { kind: usage, text: "Существительное женского рода на -ść, как radość и obecność: litość, litości, litością." }
collocations:
  - { pl: "mieć litość", ru: "иметь жалость" }
  - { pl: "na litość boską", ru: "ради бога" }
  - { pl: "bez litości", ru: "без жалости" }
etymology: "От litować się «жалеть», праславянское *lutъ «суровый, жестокий» — значение перевернулось на сочувствие к тому, кто страдает. Русское «лютый» сохранило исходный смысл, а «жалость» построено от другого корня."
memory: "litość = «жалость, милосердие». Как восклицание — Litości! «Пощадите!». И запомните na litość boską «ради бога». Родственное русское слово — «лютый», но значение там прямо противоположное."
idioms:
  - { pl: "mieć litość", ru: "сжалиться" }
  - { pl: "na litość boską", ru: "ради бога" }
  - { pl: "bez litości", ru: "без жалости" }
