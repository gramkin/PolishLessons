# review
id: spotykac
format: 2
lemma: "spotykać"
rank: 813
pos: verb
aspect: imperf
aspectPair: spotkac
pron: { cyr: "споты́каць" }
senses:
  - id: meet
    ru: "встречать, встречаться"
    examples:
      - pl: "Czasami spotykam ją w salonie piękności."
        ru: "Я иногда встречаю её в салоне красоты."
        source: { kind: tatoeba, id: 5975451 }
      - pl: "Często go spotykam."
        ru: "Я часто его встречаю."
        source: { kind: translated, id: 531722 }
      - pl: "Często go spotykasz?"
        ru: "Часто его встречаешь?"
        source: { kind: translated, id: 524625 }
  - id: meet-regularly
    ru: "spotykać się raz w tygodniu — встречаться раз в неделю"
    examples:
      - pl: "Spotykają się raz w tygodniu."
        ru: "Они встречаются раз в неделю."
        source: { kind: translated, id: 364076 }
      - pl: "Spotykajmy się tu raz w tygodniu."
        ru: "Будем встречаться здесь раз в неделю."
        source: { kind: translated, id: 751602 }
      - pl: "Gdzie się spotykamy?"
        ru: "Где мы встречаемся?"
        source: { kind: translated, id: 792390 }
  - id: dating
    ru: "spotykać się Z kimś — встречаться с кем-л. (быть в отношениях)"
    note: "Значение то же, что у русского «встречаться с кем-то»."
    examples:
      - pl: "Chcesz się spotykać z Tomem?"
        ru: "Хочешь встречаться с Томом?"
        source: { kind: translated, id: 3942185 }
      - pl: "Nie chcę, żebyś spotykała się z Tomem."
        ru: "Я не хочу, чтобы ты встречалась с Томом."
        source: { kind: translated, id: 8949269 }
      - pl: "Sami spotykał się z tą dziewczyną."
        ru: "Сами встречался с той девушкой."
        source: { kind: translated, id: 7164870 }
  - id: encountered
    ru: "spotykany — встречающийся, распространённый"
    examples:
      - pl: "To najczęściej spotykany błąd."
        ru: "Это наиболее часто встречающаяся ошибка."
        source: { kind: tatoeba, id: 13084409 }
      - pl: "Historie w rodzaju tej o Calineczce spotykane są w Chinach, Japonii i w każdym innym kraju."
        ru: "Истории вроде «Дюймовочки» встречаются в Китае, Японии и в любой другой стране."
        source: { kind: translated, id: 366935 }
      - pl: "Spotykanie ludzi na szlaku to przyjemność wędrowca."
        ru: "Встречать людей на тропе — радость путника."
        source: { kind: translated, id: 822170 }
notes:
  - { kind: usage, text: "spotykać się z kimś значит не только «видеться», но и «встречаться» в смысле отношений — ровно как по-русски: Chcesz się spotykać z Tomem? «Хочешь встречаться с Томом?»." }
  - { kind: government, text: "Кого встречать — винительный: spotykam ją. С кем встречаться — z с творительным: spotykać się z kimś. Где — w или na с предложным." }
  - { kind: usage, text: "Совершенный вид — spotkać: Spotykam ją często «Я часто её встречаю», но Spotkałem ją wczoraj «Я встретил её вчера»." }
  - { kind: usage, text: "Причастие spotykany значит «встречающийся, распространённый»: najczęściej spotykany błąd «наиболее часто встречающаяся ошибка». Существительное — spotkanie «встреча»." }
collocations:
  - { pl: "spotykać się z kimś", ru: "встречаться с кем-либо" }
  - { pl: "często spotykać", ru: "часто встречать" }
  - { pl: "spotykać się raz w tygodniu", ru: "встречаться раз в неделю" }
  - { pl: "spotkanie", ru: "встреча" }
family:
  - { pl: "spotkać", ru: "встретить", relation: aspect }
  - { pl: "spotkanie", ru: "встреча", relation: derived }
  - { pl: "napotkać", ru: "натолкнуться", relation: root }
etymology: "z- + po- + tykać «касаться» — буквально «сходиться, соприкасаться»."
memory: "spotykać — «встречать, встречаться», и одно значение совпадает с русским до мелочей: spotykać się z kimś значит не только «видеться», но и «встречаться» в смысле отношений — Chcesz się spotykać z Tomem? Совершенный вид — spotkać: Spotykam ją często, но Spotkałem ją wczoraj. А причастие spotykany значит «встречающийся»: najczęściej spotykany błąd."
idioms:
