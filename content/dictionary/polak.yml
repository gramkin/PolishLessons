# review
id: polak
format: 2
lemma: "Polak"
rank: 5836
pos: noun
pron: { cyr: "По́ляк" }
senses:
  - id: pole
    ru: "поляк (по национальности или гражданству)"
    examples:
      - pl: "Polacy pracują w Afryce."
        ru: "Поляки работают в Африке."
        source: { kind: tatoeba, id: 880235 }
      - pl: "Łazarz Zamenhof jest Polakiem."
        ru: "Лазарь Заменгоф — поляк."
        source: { kind: tatoeba, id: 510608 }
      - pl: "Moja matka jest Żydówką, a mój ojciec Polakiem."
        ru: "Моя мать еврейка, а мой отец поляк."
        source: { kind: translated, id: 13902373 }
  - id: typical
    ru: "поляк как собирательный образ, «типичный поляк»"
    examples:
      - pl: "Mądry Polak po szkodzie."
        ru: "Поляк умён задним числом."
        source: { kind: translated, id: 516421 }
      - pl: "Statystyczny Polak czyta mniej niż jedną książkę rocznie."
        ru: "Среднестатистический поляк читает меньше одной книги в год."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Названия народов по-польски пишутся с большой буквы: POLAK, POLKA, ROSJANIN. Прилагательное — с маленькой: POLSKI, ROSYJSKI. Женский род — POLKA «полька (женщина)»; со строчной буквы POLKA — это танец, а PÓŁKA — «полка»." }
  - { kind: usage, text: "Во множественном числе K чередуется с C: POLAK — POLACY; в русском «поляк — поляки» такого чередования нет. Рядом есть торжественная форма POLAKOWIE, она звучит в речах, стихах и обращениях: WIELCY POLAKOWIE «великие поляки». Звательный единственного POLAKU совпадает с местным: O POLAKU." }
  - { kind: government, text: "«Я поляк» по-польски строится с творительным: JESTEM POLAKIEM, ON JEST POLAKIEM. Именительный здесь возможен только после TO: TO POLAK «это поляк»." }
  - { kind: pronunciation, text: "Читается «по́ляк»: ударение на первом слоге, L перед гласной мягкое, как в русском «поляк». Во множественном числе «поля́цы» — ударение по общему правилу переходит на предпоследний слог." }
collocations:
  - { pl: "rodowity Polak", ru: "коренной поляк" }
  - { pl: "Polak z pochodzenia", ru: "поляк по происхождению" }
  - { pl: "Polacy za granicą", ru: "поляки за рубежом" }
family:
  - { pl: "Polska", ru: "Польша", relation: root, id: polska }
  - { pl: "polski", ru: "польский", relation: derived, id: polski }
  - { pl: "Polka", ru: "полька (женщина)", relation: derived }
  - { pl: "polszczyzna", ru: "польский язык", relation: derived }
etymology: "Название восходит к имени племени POLANIE «поляне», то есть «жители поля»; корень тот же, что в слове POLE «поле» и в названии страны POLSKA."
memory: "Polak, Polka, Polska — все с большой буквы. Jestem Polakiem — «я поляк», с творительным. Во множественном K → C: Polacy."
idioms:
  - { pl: "Mądry Polak po szkodzie", ru: "поляк умён задним числом (крепок задним умом)" }
  - { pl: "Polak potrafi", ru: "поляк всё сумеет (о смекалке, часто с иронией)" }
  - { pl: "rozmawiać jak Polak z Polakiem", ru: "говорить начистоту, по-свойски" }
