# review
id: lot
format: 2
lemma: "lot"
rank: 1230
pos: noun
pron: { cyr: "лот" }
senses:
  - id: flight-trip
    ru: "рейс (самолёта)"
    examples:
      - pl: "Odwołali lot."
        ru: "Они отменили рейс."
        source: { kind: translated, id: 6547845 }
      - pl: "Twój lot został odwołany."
        ru: "Твой рейс отменён."
        source: { kind: translated, id: 8511822 }
      - pl: "Najbliższy lot jest o 10:00."
        ru: "Ближайший рейс в десять."
        source: { kind: translated, id: 635412 }
  - id: flying
    ru: "полёт"
    examples:
      - pl: "Załoga przygotowywała się do lotu w kosmos."
        ru: "Экипаж готовился к полёту в космос."
        source: { kind: translated, id: 999452 }
      - pl: "Miłego lotu!"
        ru: "Приятного полёта!"
        source: { kind: translated, id: 1188035 }
      - pl: "Zmienił tor lotu piłki zagraniem piętą."
        ru: "Он изменил траекторию полёта мяча ударом пяткой."
        source: { kind: translated, id: 13339624 }
  - id: in-flight
    ru: "w locie — на лету, в полёте"
    examples:
      - pl: "Złapał piłkę w locie."
        ru: "Он поймал мяч на лету."
        source: { kind: authored }
      - pl: "Uczy się wszystkiego w locie."
        ru: "Он всё схватывает на лету."
        source: { kind: authored }
      - pl: "Plotka rozniosła się po szkole lotem błyskawicy."
        ru: "Слух разнёсся по школе с молниеносной быстротой."
        source: { kind: translated, id: 13655517 }
notes:
  - { kind: usage, text: "Lot — и «полёт», и «рейс»: Lot został odwołany «Рейс отменён», numer lotu «номер рейса»." }
  - { kind: usage, text: "Miłego lotu! «Приятного полёта!» — стандартное пожелание, устроенное как Miłego dnia!" }
  - { kind: usage, text: "Два устойчивых оборота: z lotu ptaka «с высоты птичьего полёта» и lotem błyskawicy «с молниеносной быстротой»." }
  - { kind: pronunciation, text: "Слово односложное, конечное t глухое: лот. В косвенных падежах ударение остаётся на основе: lo-tu." }
collocations:
  - { pl: "numer lotu", ru: "номер рейса" }
  - { pl: "miłego lotu", ru: "приятного полёта" }
  - { pl: "odwołać lot", ru: "отменить рейс" }
  - { pl: "z lotu ptaka", ru: "с высоты птичьего полёта" }
etymology: "От lecieć «лететь», из праславянского *letěti. Русские «лёт», «полёт» и «лететь» — то же гнездо."
memory: "lot — и «полёт», и «рейс»: numer lotu «номер рейса», Miłego lotu! «Приятного полёта!». От lecieć «лететь», как русский «лёт» от «лететь». И два оборота: z lotu ptaka и lotem błyskawicy."
idioms:
  - { pl: "z lotu ptaka", ru: "с высоты птичьего полёта" }
  - { pl: "lotem błyskawicy", ru: "с молниеносной быстротой" }
  - { pl: "miłego lotu", ru: "приятного полёта" }
