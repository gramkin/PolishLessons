notes:
  - { kind: false-friend, text: "РЕДКИЙ СЛУЧАЙ ПОЛНОГО СОВПАДЕНИЯ СРАЗУ В ТРЁХ ЗНАЧЕНИЯХ. Польская partia, как и русская «партия», значит и политическую партию, и партию товара, и партию в шахматах. Все три смысла пришли из одного латинского корня и разошлись одинаково в обоих языках, так что переводить можно не задумываясь." }
  - { kind: usage, text: "ОРФОГРАФИЧЕСКАЯ ЛОВУШКА: у существительных на -ia после согласной родительный, дательный и предложный пишутся через ДВА i — PARTII, historii, lekcji по тому же правилу. Одного i мало, и это одна из самых частых ошибок. Родительный множественного тоже partii, а старая книжная форма — PARTYJ." }
  - { kind: pronunciation, text: "Два слога, ударение на первом: PAR-tia. Ti перед гласной звучит как «ть» с проскальзывающим и: «па́ртя». Форма partii читается «па́ртіі», с двумя слышимыми и." }
