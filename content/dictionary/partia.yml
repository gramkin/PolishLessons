etymology: "Из латинского pars, partis «часть», через немецкое Partei и французское partie. Все три значения выросли из идеи части: часть общества, часть товара, часть игры. Русская «партия» пришла тем же путём, поэтому и смыслы совпали."
memory: "partia — «партия» во всех трёх смыслах сразу: политическая, товара и шахматная. Главное тут орфография: родительный и предложный пишутся через два i — PARTII, как historii и lekcji."
