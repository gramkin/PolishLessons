# review
id: cichy
format: 2
lemma: "cichy"
rank: 957
pos: adj
pron: { cyr: "ци́хы" }
senses:
  - id: quiet
    ru: "тихий"
    examples:
      - pl: "Jestem cichy."
        ru: "Я тихий."
        source: { kind: translated, id: 3127269 }
      - pl: "To miejsce było ciche."
        ru: "Это место было тихим."
        source: { kind: translated, id: 563477 }
      - pl: "Dlaczego jesteś taki cichy?"
        ru: "Почему ты такой тихий?"
        source: { kind: translated, id: 10577058 }
  - id: quiet-person
    ru: "о человеке: молчаливый, неразговорчивый"
    examples:
      - pl: "Mary była bardzo cichą, małomówną osobą."
        ru: "Мэри была очень тихим, молчаливым человеком."
        source: { kind: translated, id: 7682115 }
      - pl: "Tom jest cichym mężczyzną."
        ru: "Том — тихий мужчина."
        source: { kind: translated, id: 5437705 }
      - pl: "Tom zawsze był cichym dzieckiem."
        ru: "Том всегда был тихим ребёнком."
        source: { kind: translated, id: 3969922 }
  - id: quiet-place
    ru: "cicha ulica, ciche miejsce — тихая улица, тихое место"
    examples:
      - pl: "Mieszkam na cichej ulicy."
        ru: "Я живу на тихой улице."
        source: { kind: translated, id: 5975479 }
      - pl: "Chodźmy do jakiegoś cichego miejsca."
        ru: "Пойдём куда-нибудь в тихое место."
        source: { kind: translated, id: 13786170 }
      - pl: "To była kiedyś bardzo cicha okolica."
        ru: "Когда-то это был очень тихий район."
        source: { kind: translated, id: 9686388 }
notes:
  - { kind: usage, text: "Степени сравнения образуются с чередованием: cichy — cichszy — najcichszy, звук ch переходит в cisz-." }
  - { kind: usage, text: "Мужско-личная форма множественного числа — cisi, тоже с чередованием: Błogosławieni cisi «Блаженны кроткие»." }
  - { kind: usage, text: "О человеке слово значит «молчаливый, неразговорчивый», а не только «негромкий»: Tom jest dzisiaj cichy «Том сегодня какой-то тихий»." }
  - { kind: usage, text: "Cicha woda brzegi rwie — «в тихом омуте черти водятся», буквально «тихая вода берега рвёт»." }
collocations:
  - { pl: "cicha ulica", ru: "тихая улица" }
  - { pl: "ciche miejsce", ru: "тихое место" }
  - { pl: "cichy głos", ru: "тихий голос" }
  - { pl: "bądź cicho", ru: "тише, помолчи" }
family:
  - { pl: "cisza", ru: "тишина", relation: root }
  - { pl: "cicho", ru: "тихо", relation: derived }
  - { pl: "uciszyć", ru: "утихомирить", relation: derived }
etymology: "Праславянское *tichъ — то же слово, что русское «тихий», с тем же значением. Начальное ти- дало в польском ci-."
memory: "cichy — «тихий», и о человеке тоже: «молчаливый». Степени идут с чередованием: cichy — cichszy — najcichszy, а мужско-личное множественное — cisi. И запомните Cicha woda brzegi rwie."
idioms:
  - { pl: "cicha woda brzegi rwie", ru: "в тихом омуте черти водятся" }
  - { pl: "cicha noc", ru: "тихая ночь" }
  - { pl: "bądź cicho", ru: "помолчи" }
