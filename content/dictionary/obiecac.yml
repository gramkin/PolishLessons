# review
id: obiecac
format: 2
lemma: "obiecać"
rank: 683
pos: verb
aspect: perf
pron: { cyr: "обе́цаць" }
senses:
  - id: promise
    ru: "обещать, пообещать (кому-л. — дательный)"
    examples:
      - pl: "Tom obiecał."
        ru: "Том обещал."
        source: { kind: tatoeba, id: 5636926 }
      - pl: "Obiecał, że dostarczy informacji."
        ru: "Он обещал предоставить информацию."
        source: { kind: tatoeba, id: 359370 }
      - pl: "Obiecała do mnie zadzwonić."
        ru: "Она обещала мне позвонить."
        source: { kind: translated, id: 980975 }
  - id: promise-that
    ru: "obiecać, że… — пообещать, что…"
    examples:
      - pl: "Obiecaj mi, że nie będziesz się śmiać."
        ru: "Обещай мне, что не будешь смеяться."
        source: { kind: tatoeba, id: 4716897 }
      - pl: "Obiecaj, że nikomu nie powiesz."
        ru: "Обещай, что никому не скажешь."
        source: { kind: translated, id: 4289987 }
      - pl: "Obiecała że poczeka."
        ru: "Она обещала, что подождёт."
        source: { kind: translated, id: 8129440 }
  - id: cant-promise
    ru: "nie móc nic obiecać — ничего не мочь обещать"
    examples:
      - pl: "Nie możemy niczego obiecać."
        ru: "Мы ничего не можем обещать."
        source: { kind: tatoeba, id: 4328621 }
      - pl: "Nie mogę nic obiecać."
        ru: "Я ничего не могу обещать."
        source: { kind: translated, id: 3838832 }
      - pl: "To wszystko, co mogę obiecać."
        ru: "Это всё, что я могу обещать."
        source: { kind: translated, id: 3607106 }
  - id: promised
    ru: "obiecany — обещанный"
    examples:
      - pl: "Owieczka została obiecana Bogu."
        ru: "Овечка была обещана Богу."
        source: { kind: translated, id: 2607617 }
      - pl: "Pieniądze, które mu obiecano, nie były, według niego, wystarczającym wynagrodzeniem za taką posługę."
        ru: "Обещанные ему деньги были, по его мнению, недостаточным вознаграждением."
        source: { kind: translated, id: 3314217 }
      - pl: "Obiecany remont nie ruszył."
        ru: "Обещанный ремонт не начался."
        source: { kind: authored }
notes:
  - { kind: government, text: "obiecać KOMUŚ coś — дательный лица плюс винительный вещи: obiecał mi pomoc. Совпадает с русским." }
  - { kind: usage, text: "Очень частая конструкция с придаточным: obiecaj, że… «обещай, что…». Obiecaj mi, że nie będziesz się śmiać." }
  - { kind: usage, text: "Несовершенный вид — obiecywać: obiecywał złote góry «обещал золотые горы»." }
  - { kind: usage, text: "Страдательное obiecany живёт в устойчивом Ziemia obiecana «Земля обетованная» — заглавии романа Реймонта. Корень тот же, что в русском «обет»." }
collocations:
  - { pl: "obiecać komuś coś", ru: "обещать кому-либо что-либо" }
  - { pl: "Obiecaj, że…", ru: "Обещай, что…" }
  - { pl: "nic nie obiecuję", ru: "ничего не обещаю" }
  - { pl: "Ziemia obiecana", ru: "Земля обетованная" }
family:
  - { pl: "obiecywać", ru: "обещать", relation: aspect }
  - { pl: "obietnica", ru: "обещание", relation: derived }
  - { pl: "przyrzec", ru: "пообещать", relation: root }
etymology: "Приставка ob- плюс старое wiecać «говорить, вещать», праславянское *vět- — то же гнездо, что русские «вещать», «совет» и «обет»."
memory: "obiecać — «обещать», и управление совпадает с русским: obiecać KOMUŚ coś, дательный плюс винительный. Очень частая конструкция с придаточным: Obiecaj, że nie będziesz się śmiać. Несовершенный вид — obiecywać. А страдательное obiecany живёт в заглавии Ziemia obiecana «Земля обетованная»: корень тот же, что в русском «обет»."
idioms:
  - { pl: "obiecać komuś coś", ru: "обещать кому-либо что-либо" }
  - { pl: "Obiecaj, że…", ru: "Обещай, что…" }
  - { pl: "Ziemia obiecana", ru: "Земля обетованная" }
