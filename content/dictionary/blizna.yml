etymology: "Слово исконно славянское, из праславянского *blizna «рубец, след от раны». Русский в этом значении своего слова не удержал и пользуется заимствованным «шрамом» из немецкого Schramme да исконным «рубцом», так что узнать blizna по русскому созвучию не получится. Зато производное ZABLIŹNIĆ SIĘ «зарубцеваться» прозрачно по смыслу и показывает ту же мену z в ź перед гласной переднего ряда."
memory: "Восемь форм с твёрдым z и одна с мягким: bliźnie, дательный и местный. Мена привязана к окончанию -e, и больше ни к чему."
idioms:
