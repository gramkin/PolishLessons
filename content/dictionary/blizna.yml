notes:
  - { kind: pronunciation, text: "Слово даёт самое чистое доказательство правила о смягчении перед -e, какое можно пожелать. Согласный z остаётся твёрдым в восьми формах из десяти — blizny, bliznę, blizną, blizn, bliznom, bliznami, bliznach, blizno, — и смягчается в ź ровно там, где окончание -e: BLIŹNIE, дательный и местный. Один и тот же согласный, одно и то же слово, и мена привязана не к падежу, не к числу и не к смыслу, а к одной гласной в окончании." }
  - { kind: usage, text: "Этот z дополняет таблицу смягчений, которую словарь собирал по частям и которая в карточке ZESTAW была перечислена не до конца. Полный ряд устроен так: t даёт ć, d даёт dź, s даёт ś, z даёт ź, r даёт rz, k даёт c, g даёт dz, ch даёт sz, n даёт ń, m даёт mi, b даёт bi, p даёт pi, f даёт fi, w даёт wi, ł даёт l. Примеры на последние пять: szyba — SZYBIE из этой же партии, mapa — MAPIE, szafa — SZAFIE, zestaw — ZESTAWIE, szkoła — SZKOLE. Правило общее: перед -e твёрдых согласных не остаётся." }
  - { kind: usage, text: "Родительный множественного — BLIZN, голая основа без окончания и без вставной гласной. Русский здесь обходится заимствованием: «шрам» пришёл из немецкого Schramme, тогда как польское blizna своё, славянское. Второе русское слово, «рубец», по-польски будет BLIZNA в медицинском смысле тоже, так что одно польское слово покрывает оба русских. Производный глагол ZABLIŹNIĆ SIĘ значит «зарубцеваться», и в нём то же ź перед гласной переднего ряда." }
collocations:
