# review
id: jedyny
format: 2
lemma: "jedyny"
rank: 280
pos: adj
pron: { cyr: "еды́ны" }
senses:
  - id: only
    ru: "единственный"
    examples:
      - pl: "Księżyc to jedyny satelita Ziemi."
        ru: "Луна - единственный спутник Земли."
        source: { kind: tatoeba, id: 368180 }
      - pl: "On jest jedynym przyjacielem, któremu ufam."
        ru: "Он единственный друг, которому я доверяю."
        source: { kind: tatoeba, id: 1046128 }
      - pl: "Jego jedyny syn zginął w wypadku samochodowym."
        ru: "Его единственный сын погиб в автокатастрофе."
        source: { kind: tatoeba, id: 1350352 }
  - id: only-choice
    ru: "единственный (о выборе, в оборотах)"
    examples:
      - pl: "Ona była jej jedyną córką."
        ru: "Она была её единственной дочерью."
        source: { kind: tatoeba, id: 13731634 }
      - pl: "Francuski nie jest jedynym językiem, którego się uczę."
        ru: "Французский не единственный язык, который я учу."
        source: { kind: tatoeba, id: 12569606 }
      - pl: "Jedyna przyprawa, którą Tom dodaje do mięsa, to pieprz."
        ru: "Единственная приправа, которую Том добавляет в мясо - это перец."
        source: { kind: tatoeba, id: 4101601 }
notes:
  - { kind: usage, text: "jedyny образовано от jeden «один» — «единственный»." }
  - { kind: false-friend, text: "Не путайте прилагательное jedyny «единственный» и наречие jedynie «лишь, только»: To jedyny sposób «Это единственный способ», но Jedynie ty wiesz «Только ты знаешь»." }
  - { kind: usage, text: "jedynak — «единственный сын», jedynaczka — «единственная дочь»; jedyny w swoim rodzaju — «единственный в своём роде»." }
collocations:
  - { pl: "jedyny raz", ru: "единственный раз" }
  - { pl: "jedyna szansa", ru: "единственный шанс" }
  - { pl: "jedyny sposób", ru: "единственный способ" }
  - { pl: "jedyny w swoim rodzaju", ru: "единственный в своём роде" }
etymology: "От jeden «один», праславянское *edinъ; то же гнездо, что русские «один», «единый», «единственный»."
memory: "jedyny — «единственный», от jeden «один». Не путайте с наречием jedynie «лишь, только»."
idioms:
