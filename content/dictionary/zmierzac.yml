    source: { kind: translated, id: 448828 }
  - form: "zmierzać"
    pl: "Należy zawsze zmierzać do sedna rzeczy, niezależnie, czym ono jest."
    ru: "Всегда следует двигаться к сути дела, какой бы она ни была."
    source: { kind: translated, id: 930240 }
  - form: "zmierzać"
    pl: "Dokąd chce zmierzać ludzkość, jeśli nie potrafi uwolnić się od urazy i zła?"
    ru: "Куда хочет двигаться человечество, если не умеет освободиться от обиды и зла?"
    source: { kind: translated, id: 13017902 }
  - form: "zmierzać"
    pl: "Trudno zmierzać do celu bez planu."
    ru: "Трудно двигаться к цели без плана."
    source: { kind: authored }
  - form: "zmierzają"
    pl: "W jakim kierunku oni zmierzają?"
    ru: "В каком направлении они движутся?"
    source: { kind: translated, id: 1067123 }
  - form: "zmierzają"
    pl: "Nie zmierzają w dobrym kierunku."
    ru: "Они движутся не в том направлении."
    source: { kind: translated, id: 6320672 }
  - form: "zmierzają"
    pl: "Zmiany nie zmierzają w dobrym kierunku."
    ru: "Перемены идут не в том направлении."
    source: { kind: translated, id: 6320673 }
  - form: "zmierzające"
    pl: "Podejmują wysiłki zmierzające do budowy pokoju na świecie."
    ru: "Они предпринимают усилия, направленные на установление мира во всём мире."
    source: { kind: translated, id: 919236 }
  - form: "zmierzające"
    pl: "To działania zmierzające do zmiany."
    ru: "Это действия, направленные на перемены."
    source: { kind: authored }
  - form: "zmierzające"
    pl: "Kroki zmierzające do porozumienia."
    ru: "Шаги, направленные к соглашению."
    source: { kind: authored }
  - form: "zmierzali"
    pl: "Zmierzali w stronę rzeki."
    ru: "Они направлялись к реке."
    source: { kind: authored }
  - form: "zmierzali"
    pl: "Zmierzali do celu powoli."
