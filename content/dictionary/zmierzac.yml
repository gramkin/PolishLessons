# review
id: zmierzac
format: 2
lemma: "zmierzać"
rank: 1498
pos: verb
aspect: imperf
pron: { cyr: "зме́жаць" }
senses:
  - id: head-for
    ru: "направляться, двигаться к"
    examples:
      - pl: "Ten pociąg zmierza do Tokyo."
        ru: "Этот поезд следует в Токио."
        source: { kind: translated, id: 8989742 }
      - pl: "Dokąd zmierzasz?"
        ru: "Куда ты направляешься?"
        source: { kind: translated, id: 9240047 }
      - pl: "Dokąd zmierzamy?"
        ru: "Куда мы движемся?"
        source: { kind: translated, id: 2211641 }
  - id: drive-at
    ru: "клонить к чему-либо"
    examples:
      - pl: "Do czego on zmierza?"
        ru: "К чему он клонит?"
        source: { kind: translated, id: 448828 }
      - pl: "Do czego zmierzasz?"
        ru: "К чему ты клонишь?"
        source: { kind: translated, id: 2397169 }
notes:
  - { kind: government, text: "zmierzać do czegoś — «двигаться к чему-то», с do и родительным: zmierzać do celu." }
  - { kind: usage, text: "Do czego zmierzasz? — «К чему ты клонишь?», очень частый разговорный оборот." }
  - { kind: usage, text: "Причастие zmierzający значит «направленный на»: działania zmierzające do zmiany." }
  - { kind: false-friend, text: "Не путайте zmierzać «направляться» с mierzyć «мерить» и zmierzyć «измерить»: корень выглядит одинаково, а значения разные." }
collocations:
  - { pl: "dokąd zmierzasz", ru: "куда ты идёшь" }
  - { pl: "zmierzać do celu", ru: "двигаться к цели" }
  - { pl: "do czego zmierzasz", ru: "к чему ты клонишь" }
etymology: "Приставка z- и mierzać, от mierzyć «мерить»: изначально «примеряться, брать направление». Русское «мерить» того же корня, но значение «двигаться» развилось только в польском."
memory: "zmierzać — «направляться, двигаться к»: Dokąd zmierzasz? «Куда ты идёшь?». А Do czego zmierzasz? значит «К чему ты клонишь?». Не путайте с mierzyć «мерить»."
idioms:
  - { pl: "dokąd zmierzasz", ru: "куда ты идёшь" }
  - { pl: "do czego zmierzasz", ru: "к чему ты клонишь" }
  - { pl: "zmierzać do celu", ru: "двигаться к цели" }
formExamplesSkip:
