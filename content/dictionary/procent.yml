  - { pl: "procentować", ru: "приносить проценты, окупаться", relation: derived }
etymology: "Из латинского pro centum «на сотню», через немецкий и итальянский счетоводный язык. Русский «процент» пришёл той же дорогой и в то же время, поэтому слова совпадают целиком. Польское PROCENTOWAĆ значит ещё и «окупаться, приносить плоды»: nauka procentuje — «учёба окупается»."
memory: "После пяти и больше — pięć procent, без окончания; при двух, трёх, четырёх — dwa procenty. И предложный мягкий: o procencie, как o studencie."
idioms:
