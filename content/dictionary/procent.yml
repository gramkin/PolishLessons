notes:
  - { kind: usage, text: "ПОСЛЕ ЧИСЛИТЕЛЬНОГО ОТ ПЯТИ ФОРМА — PROCENT, БЕЗ ОКОНЧАНИЯ. Pięć procent, dziesięć procent, sto procent — это родительный множественного, который совпал с именительным единственного. А при двух, трёх и четырёх будет PROCENTY: dwa procenty, trzy procenty. Русский ведёт себя так же («пять процентов», «два процента»), но польская нулевая форма сбивает с толку, потому что выглядит как исходное слово." }
  - { kind: usage, text: "У родительного единственного две формы: PROCENTA и PROCENTU. Первая живёт при долях и дробях — pół procenta, ćwierć procenta, — вторая при банковском смысле: od procentu, wysokość procentu. То же раздвоение у model (modela / modelu) и sport (sporta / sportu), и выбор каждый раз подсказывает значение, а не грамматика." }
  - { kind: pronunciation, text: "Предложный падеж — PROCENCIE, с переходом t в c. То же в student — studencie, brat — bracie, kot — kocie. Русское «проценте» основу не трогает, так что мягкую форму надо запомнить отдельно." }
collocations:
  - { pl: "sto procent", ru: "сто процентов" }
  - { pl: "na procent", ru: "под проценты" }
  - { pl: "w stu procentach", ru: "на сто процентов" }
family:
