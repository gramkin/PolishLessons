pron: { cyr: "пи́як" }
senses:
  - id: drunkard
    ru: "пьяница, алкоголик"
    examples:
      - pl: "Jej ojciec był pijakiem."
        ru: "Её отец был пьяницей."
        source: { kind: authored }
