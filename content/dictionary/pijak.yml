notes:
  - { kind: false-friend, text: "PIJAK — «пьяница», а не «пиявка» и не «пьяный» как прилагательное. Пьяный — PIJANY: ON JEST PIJANY, «он пьян». PIJAK — существительное о человеке, который пьёт постоянно." }
  - { kind: usage, text: "Десять форм, мужской род, лицо. Во множественном K переходит в C: PIJACY. Слово грубоватое; нейтрально — ALKOHOLIK, а в шутку — MOCZYMORDA." }
  - { kind: government, text: "Быть пьяницей — BYĆ PIJAKIEM, творительный. Выйти замуж за пьяницу — WYJŚĆ ZA PIJAKA, ZA с винительным, который у одушевлённых совпадает с родительным." }
  - { kind: pronunciation, text: "Читается «пи́як», два слога: I и A не сливаются, между ними слышен лёгкий «й». Во множественном PIJACY — «пия́цы»." }
collocations:
  - { pl: "nałogowy pijak", ru: "запойный пьяница" }
  - { pl: "pijak za kierownicą", ru: "пьяный водитель" }
  - { pl: "stary pijak", ru: "старый пропойца" }
family:
  - { pl: "pić", ru: "пить", relation: root, id: pic }
  - { pl: "pijany", ru: "пьяный", relation: derived, id: pijany }
  - { pl: "pijaństwo", ru: "пьянство", relation: derived }
etymology: "От PIĆ «пить» с суффиксом -AK, как PROSTAK от PROSTY: тот, кто много пьёт. Русское «пьяница» построено от того же корня."
memory: "Pijak — пьяница: od pić — пить. Pijany — пьяный. Читается «пи́як». Pijacy — пьяницы."
idioms:
  - { pl: "pijany jak bela", ru: "пьяный в стельку" }
