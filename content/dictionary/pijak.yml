    examples:
      - pl: "Pijak zasnął na ławce w parku."
        ru: "Пьяный уснул на скамейке в парке."
        source: { kind: authored }
      - pl: "Policja zatrzymała pijaka za kierownicą."
        ru: "Полиция задержала пьяного за рулём."
