family:
  - { pl: "doświadczać", ru: "испытывать", relation: aspect }
  - { pl: "doświadczenie", ru: "опыт; эксперимент", relation: derived, id: doswiadczenie }
  - { pl: "świadczyć", ru: "свидетельствовать; оказывать", relation: root, id: swiadczyc }
etymology: "Приставка do- плюс świadczyć «свидетельствовать», от świadek «свидетель», праславянское *sъvědъ — того же корня, что русские «сведать», «сведения», «свидетель». Логика слова: испытать на себе значит стать свидетелем чего-то изнутри. Отсюда и doświadczenie «опыт» — буквально «засвидетельствованное собой»."
memory: "doświadczyć — «испытать», от świadczyć «свидетельствовать»: испытать значит стать свидетелем изнутри. Запомните падеж: только РОДИТЕЛЬНЫЙ, doświadczyć bólu, а не ból. И doświadczony значит просто «опытный»."
idioms:
  - { pl: "doświadczyć czegoś na własnej skórze", ru: "испытать что-л. на собственной шкуре" }
  - { pl: "mieć duże doświadczenie", ru: "иметь большой опыт" }
