notes:
  - { kind: government, text: "ГЛАВНОЕ о этом глаголе. Он требует РОДИТЕЛЬНОГО падежа: doświadczyć bólu, doświadczyć straty, doświadczyć czegoś. По-русски «испытать» берёт винительный («испытать боль»), поэтому doświadczyć ból — ошибка, которую русскоязычный делает почти наверняка. Правильно только doświadczyć bólu." }
  - { kind: false-friend, text: "Существительное doświadczenie покрывает сразу два русских слова: «опыт» как житейская мудрость (ma duże doświadczenie «у него большой опыт») и «опыт, эксперимент» как научное действие (doświadczenie w laboratorium). Контекст различает их легко, но помнить о двойственности стоит." }
  - { kind: usage, text: "Причастие doświadczony живёт и самостоятельной жизнью — как обычное прилагательное «опытный»: doświadczony przewodnik, doświadczona położna. В этом значении оно даже образует степени сравнения (bardziej doświadczony). Несовершенная пара — doświadczać." }
  - { kind: pronunciation, text: "Страдательное причастие даёт -ony почти везде, но в мужско-личном множественном o переходит в e: doświadczony — doświadczeni, porzucony — porzuceni. Та же мена у zatrudniony — zatrudnieni и podzielony — podzieleni; выучив её один раз, вы узнаете её у всех таких причастий." }
collocations:
  - { pl: "doświadczyć straty", ru: "испытать потерю" }
  - { pl: "doświadczony lekarz", ru: "опытный врач" }
