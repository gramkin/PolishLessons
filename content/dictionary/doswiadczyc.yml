  - id: experienced
    ru: "doświadczony — опытный"
    examples:
      - pl: "To doświadczony lekarz."
        ru: "Это опытный врач."
        source: { kind: authored }
      - pl: "Doświadczeni pracownicy zostali."
        ru: "Опытные работники остались."
