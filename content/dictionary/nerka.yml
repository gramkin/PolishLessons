etymology: "Слово старое и его происхождение спорно. Чаще всего его возводят к праславянскому *nerka или *nyrъka и связывают с корнем *nyr- «нырять, погружаться», тем же, что в польском NUREK «водолаз» и NURZAĆ «погружать», а в русском — в «нырять» и «нора»: орган назван по положению, глубоко внутри тела. Другое объяснение сближает слово с греческим NEPHROS и немецким NIERE, возводя их всех к общему индоевропейскому корню со значением «почка, орган», и именно это объяснение делает понятным международное NEFRO- в словах «нефролог» и «нефрит». Русская «почка» пошла совершенно иным путём: она названа по сходству с почкой растения, то есть по внешнему виду, и потому в русском два разных предмета носят одно имя."
memory: "Опереться на русскую «почку» нельзя — ничего общего. Опора другая: nerka стоит в одном ряду с греческим nephros, откуда русские «нефролог» и «нефрит», и с немецким Niere. Почка растения — это pąk, то есть польский не смешивает эти два значения, как русский. Падежи: nerce с меной k→c, как kaczce и wódce; родительный множественного nerek с беглым e. И два бытовых значения: nerki как блюдо и nerka как поясная сумка."
idioms:
