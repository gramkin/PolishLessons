notes:
  - { kind: false-friend, text: "Общего с русской «почкой» у слова нет ничего: ни корня, ни звучания, и опереться не на что. Зато есть опора с другой стороны — международное NEFRO-, которое русскому знакомо по словам «нефрит», «нефролог», «нефропатия»: польское NERKA и греческое NEPHROS восходят к одному древнему корню. Вторая опора — немецкое NIERE и английское анатомическое RENAL, стоящие в том же ряду. Русская «почка» в этом смысле одинока: она названа по сходству с почкой растения, то есть по форме, и потому в русском одно слово покрывает орган и побег, чего в польском нет: почка растения — PĄK." }
  - { kind: usage, text: "Десять форм, женский род. Дательный и местный единственного — NERCE, где заднеязычное K перед окончанием -E переходит в C: это та же обязательная мена, что в KACZCE, CÓRECZCE и WÓDCE. Родительный единственного и именительный множественного — одна форма NERKI. Родительный множественного — NEREK, с беглым E между K и R: иначе слово кончалось бы на RK. В медицинском и кулинарном употреблении слово чаще всего стоит во множественном: BÓL NEREK «боль в почках», NIEWYDOLNOŚĆ NEREK «почечная недостаточность», где русский предпочитает прилагательное, а польский — родительный падеж существительного." }
  - { kind: pronunciation, text: "Читается «не́рка», два слога, ударение на первом. Начальное NE звучит твёрдо, без смягчения, в отличие от русского «не». Буква R раскатистая. В форме NERCE сочетание RC произносится «рц»: «не́рце». В форме NEREK беглое E слышно отчётливо, и слово звучит «не́рэк». В форме NERKĄ последнее Ą даёт «он»: «не́ркон». В форме NERKĘ конечное Ę читается как чистое «э»: «не́ркэ»." }
  - { kind: register, text: "В анатомическом значении слово нейтральное и обиходное — его употребляют и врачи, и пациенты, отдельного «научного» синонима нет. В кулинарии NERKI означает блюдо из почек, и форма там всегда множественная. Разговорное DOSTAĆ PO NERKACH значит «получить по почкам» и употребляется и буквально, о драке, и переносно — о внезапном ударе по чьим-то интересам, например о налоге или штрафе. Слово NERKA называет ещё и поясную сумку, по форме, и это значение в молодёжной речи очень живое. Звательная форма NERKO встречается только в шутке." }
