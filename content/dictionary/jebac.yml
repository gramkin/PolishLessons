# review
id: jebac
format: 2
lemma: "jebać"
rank: 1106
pos: verb
aspect: imperf
pron: { cyr: "ебачь" }
senses:
  - id: to-hell-with
    ru: "к чёрту, да пошло оно"
    examples:
      - pl: "Jebać to !"
        ru: "Да пошло оно!"
        source: { kind: translated, id: 13781288 }
      - pl: "Jebać granice."
        ru: "К чёрту границы."
        source: { kind: translated, id: 12055007 }
      - pl: "Jebać wszystko."
        ru: "К чёрту всё."
        source: { kind: translated, id: 11266471 }
  - id: participle
    ru: "jebany — гребаный (ругательное определение)"
    examples:
      - pl: "Zamknij jebane drzwi!"
        ru: "Закрой гребаные двери!"
        source: { kind: translated, id: 1353618 }
      - pl: "Jebany dupek!"
        ru: "Гребаный мудак!"
        source: { kind: translated, id: 676757 }
      - pl: "Ta jebana maszyna znowu stanęła."
        ru: "Эта гребаная машина опять встала."
        source: { kind: authored }
notes:
  - { kind: register, text: "Один из самых грубых глаголов польского языка, прямой аналог русского мата. В приличной речи невозможен; в словаре нужен для понимания." }
  - { kind: usage, text: "Jebać coś значит «к чёрту что-то, да пошло оно»: Jebać to! Употребляется почти всегда в инфинитиве." }
  - { kind: usage, text: "Причастия jebany, jebana, jebane работают как ругательное определение — «гребаный»: jebane drzwi." }
  - { kind: usage, text: "Рядом стоит pierdolić — примерно та же сила и те же употребления." }
collocations:
  - { pl: "jebać to", ru: "да пошло оно" }
  - { pl: "jebany", ru: "гребаный" }
  - { pl: "jebać wszystko", ru: "к чёрту всё" }
etymology: "Праславянское *jebati. Русское матерное соответствие — то же самое слово, с тем же значением и той же грубостью."
memory: "jebać — крайне грубый глагол. Jebać to! «Да пошло оно!», а причастие jebany значит «гребаный»."
idioms:
