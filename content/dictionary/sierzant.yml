lemma: "sierżant"
rank: 1071
pos: noun
pron: { cyr: "сержа́нт" }
senses:
  - id: rank
    ru: "сержант (воинское звание)"
    examples:
      - pl: "Ojciec spotkał tego sierżanta w zeszłym roku."
        ru: "Отец встретил этого сержанта в прошлом году."
        source: { kind: translated, id: 830494 }
      - pl: "Sierżant wydał rozkaz."
        ru: "Сержант отдал приказ."
        source: { kind: authored }
      - pl: "Awansowali go na sierżanta."
        ru: "Его повысили до сержанта."
        source: { kind: authored }
  - id: address
    ru: "panie sierżancie — обращение «господин сержант»"
    examples:
      - pl: "Tak jest, panie sierżancie!"
        ru: "Так точно, господин сержант!"
        source: { kind: authored }
      - pl: "Panie sierżancie, melduję wykonanie rozkazu."
        ru: "Господин сержант, докладываю о выполнении приказа."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Мужской одушевлённый: винительный совпадает с родительным — widzę sierżanta «вижу сержанта»." }
  - { kind: pronunciation, text: "Пишется через rz, читается как ж: sierżant звучит «сержант», точно как русское слово." }
  - { kind: usage, text: "Обращение — звательный падеж: panie sierżancie! По-русски здесь именительный: «господин сержант»." }
  - { kind: usage, text: "В польской армии это подофицерское звание, выше kapral «ефрейтор, капрал» и ниже chorąży «прапорщик»." }
collocations:
  - { pl: "panie sierżancie", ru: "господин сержант" }
  - { pl: "awansować na sierżanta", ru: "получить звание сержанта" }
  - { pl: "sierżant sztabowy", ru: "штаб-сержант" }
family:
  - { pl: "sierżancki", ru: "сержантский", relation: derived }
etymology: "Через французское sergent из латинского serviens «служащий». Русский «сержант» — то же заимствование и тем же путём, через французский."
memory: "sierżant — «сержант», мужской одушевлённый: widzę sierżanta. Пишется через rz, а читается «ж». Обращение — panie sierżancie, звательный падеж, которого в русском уже нет."
idioms:
