# review
id: wynocha
format: 2
lemma: "wynocha"
rank: 1699
pos: interj
pron: { cyr: "выно́ха" }
senses:
  - id: out
    ru: "вон!, убирайся!, пошёл вон!"
    examples:
      - pl: "Wynocha!"
        ru: "Вон отсюда!"
        source: { kind: translated, id: 516439 }
      - pl: "Wynocha z mego życia!"
        ru: "Вон из моей жизни!"
        source: { kind: tatoeba, id: 363783 }
      - pl: "Wynocha z mojego auta!"
        ru: "Вон из моей машины!"
        source: { kind: tatoeba, id: 13785995 }
  - id: shoo
    ru: "прочь!, вон! (запрет, прогоняя)"
    examples:
      - pl: "Wynocha z mojego domu!"
        ru: "Вон из моего дома!"
        source: { kind: translated, id: 1571161 }
      - pl: "Wynocha! Nie graj tutaj!"
        ru: "Вон! Не играй здесь!"
        source: { kind: translated, id: 2784608 }
notes:
  - { kind: register, text: "Слово резкое, на грани грубости: так прогоняют, а не просят. В вежливой речи не употребляется — соответствует русскому «вон!», «убирайся!»." }
  - { kind: government, text: "Чаще всего с предлогом z и родительным падежом: wynocha z mojego domu «вон из моего дома», wynocha z mego życia «вон из моей жизни»." }
  - { kind: usage, text: "Это междометие: оно не склоняется и не спрягается, форма всегда одна." }
  - { kind: usage, text: "Более мягкие способы сказать то же — idź stąd «уйди отсюда» или proszę wyjść «прошу выйти»." }
collocations:
  - { pl: "wynocha stąd", ru: "вон отсюда" }
  - { pl: "wynocha z domu", ru: "вон из дома" }
  - { pl: "wynocha z mojego auta", ru: "вон из моей машины" }
etymology: "От wynosić się «убираться, выметаться» — тот же образ, что в русском «выметайся»: вынести себя прочь."
memory: "wynocha! — «вон!», «убирайся!». Слово резкое, почти грубое. Часто с z: wynocha z mojego domu «вон из моего дома»."
idioms:
