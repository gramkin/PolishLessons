# review
id: nos
format: 2
lemma: "nos"
rank: 1055
pos: noun
pron: { cyr: "нос" }
senses:
  - id: nose
    ru: "нос"
    examples:
      - pl: "Mam duży nos."
        ru: "У меня большой нос."
        source: { kind: translated, id: 8631927 }
      - pl: "Słoń ma długi nos."
        ru: "У слона длинный нос."
        source: { kind: translated, id: 611635 }
      - pl: "Nos Julii jest piękny."
        ru: "У Юлии красивый нос."
        source: { kind: translated, id: 3660678 }
  - id: lead-by-nose
    ru: "wodzić za nos — водить за нос"
    examples:
      - pl: "Starczy wodzenia mnie za nos!"
        ru: "Хватит водить меня за нос!"
        source: { kind: translated, id: 2493645 }
      - pl: "On zadziera nosa."
        ru: "Он задирает нос."
        source: { kind: translated, id: 352243 }
      - pl: "Nie zadzieraj nosa."
        ru: "Не задирай нос."
        source: { kind: translated, id: 733049 }
  - id: idioms
    ru: "mieć muchy w nosie — быть не в духе"
    note: "Буквально «иметь мух в носу»; русского аналога нет."
    examples:
      - pl: "Ma muchy w nosie."
        ru: "Он не в духе."
        source: { kind: translated, id: 6406236 }
      - pl: "Mój sąsiad ciągle dłubie sobie w nosie."
        ru: "Мой сосед постоянно ковыряется в носу."
        source: { kind: translated, id: 12469861 }
      - pl: "Śpiewasz pod nosem."
        ru: "Ты поёшь себе под нос."
        source: { kind: translated, id: 5665237 }
notes:
  - { kind: usage, text: "Большинство идиом совпадает с русскими дословно: wodzić kogoś za nos «водить за нос», pod nosem «под носом», kręcić nosem «воротить нос»." }
  - { kind: government, text: "zadzierać nosa «задирать нос» — с родительным падежом, не с винительным. Русский тут берёт винительный, и это частая ошибка." }
  - { kind: usage, text: "mieć muchy w nosie — буквально «иметь мух в носу», значит «быть не в духе, капризничать». Прямого русского соответствия нет." }
  - { kind: usage, text: "Предложный падеж — w nosie «в носу», как и в русском: dłubać w nosie «ковыряться в носу»." }
collocations:
  - { pl: "wodzić za nos", ru: "водить за нос" }
  - { pl: "zadzierać nosa", ru: "задирать нос" }
  - { pl: "pod nosem", ru: "под носом" }
  - { pl: "mieć muchy w nosie", ru: "быть не в духе" }
family:
  - { pl: "nosowy", ru: "носовой", relation: derived }
  - { pl: "nosek", ru: "носик", relation: derived }
etymology: "Праславянское *nosъ — то же слово, что русский «нос», без всяких расхождений. Совпадают и почти все идиомы."
memory: "nos — «нос», и большинство выражений переводится дословно: wodzić za nos, pod nosem. Но zadzierać NOSA требует родительного падежа, а mieć muchy w nosie «иметь мух в носу» значит «быть не в духе»."
idioms:
