# review
id: przetestowac
format: 2
lemma: "przetestować"
rank: 5760
pos: verb
pron: { cyr: "пшетестова́ць" }
senses:
  - id: test
    ru: "протестировать, испытать"
    examples:
      - pl: "Trzeba przetestować to w praktyce."
        ru: "Надо протестировать это на практике."
        source: { kind: authored }
      - pl: "Inżynier przetestował układ dwa razy."
        ru: "Инженер протестировал схему дважды."
        source: { kind: authored }
      - pl: "Lek przetestowano na ochotnikach."
        ru: "Лекарство протестировали на добровольцах."
        source: { kind: authored }
  - id: try-out
    ru: "опробовать, проверить на деле"
    examples:
      - pl: "Przetestuj to zanim kupisz."
        ru: "Протестируй это, прежде чем покупать."
        source: { kind: authored }
      - pl: "Przetestował rower przed wyścigiem."
        ru: "Он проверил велосипед перед гонкой."
        source: { kind: authored }
notes:
  - { kind: government, text: "przetestować coś, kogoś — ВИНИТЕЛЬНЫЙ падеж, прямое дополнение без предлога: przetestować program, przetestować kandydatów. Отсюда полный набор страдательных причастий, включая мужское лицо przetestowani «протестированные»: кандидатов, спортсменов, работников действительно тестируют, так что эта форма вполне обычна." }
  - { kind: usage, text: "Совершенный вид; несовершенный — testować. Приставка prze- означает здесь «насквозь, до конца» и работает точно так же, как русское про-: testować → przetestować, как «тестировать» → «протестировать»." }
  - { kind: usage, text: "Не путайте два похожих польских глагола: przetestować «протестировать» и protestować «протестовать». В русском они тоже различаются одной буквой — «протестировать» и «протестовать», — так что ошибиться легко в обе стороны." }
  - { kind: pronunciation, text: "Начальное prz читается как [пш]: przetestować — [пшетестова́ць]. Звонкого [пж] здесь нет, потому что rz после глухого p оглушается." }
collocations:
  - { pl: "przetestować program", ru: "протестировать программу" }
  - { pl: "przetestować w praktyce", ru: "проверить на практике" }
  - { pl: "dobrze przetestowany", ru: "хорошо протестированный" }
family:
  - { pl: "test", ru: "тест, испытание", relation: root, id: test }
  - { pl: "testować", ru: "тестировать", relation: aspect }
  - { pl: "przetestowanie", ru: "тестирование", relation: derived }
etymology: "Приставка prze- и глагол testować, образованный от существительного test. Само слово test пришло в польский из английского, а в английский — из латинского testum «глиняный сосуд», которым пользовались при пробе металлов: проба в сосуде и дала значение «испытание». Русский построил свой глагол ровно так же и из того же материала: про- + тест + -ировать, где про- и польское prze- — один и тот же праславянский префикс со значением «насквозь»."
memory: "przetestować = prze- + testować, в точности как русское «протестировать» = про- + тестировать: приставки родственные, значение «до конца, насквозь». Главное — не спутать с protestować «протестовать»."
idioms:
  - { pl: "przetestowany w boju", ru: "испытанный в деле, проверенный в бою" }
  - { pl: "przetestować coś na sobie", ru: "испытать что-л. на себе" }
