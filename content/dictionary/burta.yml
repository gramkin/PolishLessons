notes:
  - { kind: false-friend, text: "BURTA — «борт» судна как его бок, стенка. Но «на борту» в смысле «внутри судна, самолёта» — NA POKŁADZIE: WITAMY NA POKŁADZIE! BURTA — только стенка: ZA BURTĘ, «за борт»." }
  - { kind: usage, text: "Девять форм, женский род. В местном T переходит в C: NA BURCIE. Родительный множественного — BURT. Звательный BURTO не употребляется." }
  - { kind: government, text: "За борт — ZA BURTĘ, винительный (куда). За бортом — ZA BURTĄ, творительный (где). О борт — O BURTĘ, винительный." }
  - { kind: pronunciation, text: "Читается «бу́рта», ударение на первом слоге. BURCIE — «бу́рце»." }
collocations:
  - { pl: "wypaść za burtę", ru: "выпасть за борт" }
  - { pl: "lewa burta", ru: "левый борт" }
  - { pl: "za burtą", ru: "за бортом" }
family:
  - { pl: "statek", ru: "корабль", relation: root, id: statek }
  - { pl: "pokład", ru: "палуба, борт", relation: root, id: poklad }
  - { pl: "łódź", ru: "лодка", relation: root, id: lodz }
etymology: "Из немецкого BORD «край, доска», через морской жаргон. Русское «борт» — то же слово, но мужского рода."
memory: "Burta — борт как бок судна; «на борту» — na pokładzie. Za burtę — за борт. Читается «бу́рта»."
idioms:
  - { pl: "wyrzucić za burtę", ru: "выбросить за борт, отказаться" }
