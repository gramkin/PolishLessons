notes:
  - { kind: false-friend, text: "Русский «лебедь» и польское łabędź — одно слово, но выглядит оно неузнаваемо: ł читается как у, ę как эн, dź как мягкое дзь. Выходит «уа́бэндзь»." }
  - { kind: government, text: "Мужской ЖИВОТНЫЙ род: винительный как родительный — widzę łabędzia. Родительный мн. — łabędzi." }
  - { kind: usage, text: "Łabędzi śpiew «лебединая песня» — оборот тот же, что в русском." }
  - { kind: usage, text: "В русском «лебедь» бывает и женского рода в поэзии; в польском род всегда мужской." }
collocations:
  - { pl: "łabędzi śpiew", ru: "лебединая песня" }
  - { pl: "białe łabędzie", ru: "белые лебеди" }
etymology: "Праславянское *elbedь; русский «лебедь» — то же слово, но польская форма звучит неузнаваемо."
memory: "łabędź — «лебедь», читается «уа́бэндзь»: ł даёт у, ę — эн, dź — мягкое дзь. Род животный: widzę łabędzia."
idioms:
  - { pl: "łabędzi śpiew", ru: "лебединая песня" }
