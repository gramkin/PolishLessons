notes:
  - { kind: government, text: "Управление почти совпадает с русским, но предлог другой, и это легко упустить. WYLECZYĆ KOGOŚ Z CZEGOŚ — предлог Z с родительным: WYLECZYLI GO Z ZAPALENIA PŁUC. Русский берёт здесь «от» с тем же родительным — «вылечили от воспаления лёгких». То есть падеж тот же, предлог другой, и подставлять русское «от» нельзя. Возвратное WYLECZYĆ SIĘ Z CZEGOŚ значит «выздороветь от чего-то», с тем же Z." }
  - { kind: register, text: "Корень общий с русским: LECZYĆ — это «лечить», из праславянского *lěčiti. Но одно слово из гнезда расходится по стилю, и сильно. LEKARZ по-польски — нейтральное, единственное обычное слово для врача: IDĘ DO LEKARZA. Русский же «лекарь» звучит устарело и чуть насмешливо, а нейтральное слово — «врач». Так что LEKARZ надо переводить «врач», и ни в коем случае не «лекарь». Рядом LEK и LEKARSTWO — «лекарство», LECZENIE — «лечение», LECZNICA — «лечебница»." }
  - { kind: pronunciation, text: "Повелительное WYLECZ выходит из третьего лица WYLECZY отбрасыванием -y, и основа на -cz польское слово закончить может, поэтому никакого -ij не вставляется — тот же случай, что UKOŃCZ и WYKOŃCZ. Стоит заодно вспомнить ловушку из карточки LECZYĆ: форма LECZ это и повелительное «лечи», и очень частый союз «но, а». NIE JESTEM LEKARZEM, LECZ NAUCZYCIELEM — «я не врач, а учитель». В живом тексте союз встречается чаще." }
  - { kind: usage, text: "Пятьдесят три формы — совершенный переходный: сорок одна основная, одиннадцать страдательных причастий и деепричастие WYLECZYWSZY. Несовершенная пара — LECZYĆ, и разница между ними ровно как в русском: LECZYĆ значит лечить, то есть вести лечение, а WYLECZYĆ — вылечить, довести до здоровья. Поэтому LECZYŁ GO ROK, ALE NIE WYLECZYŁ — «лечил его год, но не вылечил», и фраза эта работает в двух языках одинаково." }
collocations:
  - { pl: "wyleczyć kogoś z choroby", ru: "вылечить кого-либо от болезни" }
  - { pl: "wyleczyć się", ru: "выздороветь" }
  - { pl: "iść do lekarza", ru: "идти к врачу" }
