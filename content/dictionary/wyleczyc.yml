  - { pl: "lekarz", ru: "врач", relation: derived, id: lekarz }
  - { pl: "leczenie", ru: "лечение", relation: derived }
etymology: "Приставка wy- и LECZYĆ «лечить», из праславянского *lěčiti — то же слово, что русское «лечить». Приставка wy- даёт здесь результат, доведение до здоровья, как в русском «вылечить». Гнездо русскому понятно почти целиком: LECZENIE «лечение», LECZNICA «лечебница», LEK и LEKARSTWO «лекарство», NIEULECZALNY «неизлечимый». Расходится только LEKARZ: по-польски это нейтральный «врач», а русский «лекарь» ушёл в устарелое и насмешливое."
memory: "Корень как в «лечить», но предлог другой: wyleczyć Z choroby, а не «от». И lekarz — это нейтральный «врач», не «лекарь»."
idioms:
