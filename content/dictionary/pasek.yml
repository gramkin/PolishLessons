notes:
  - { kind: false-friend, text: "PASEK — уменьшительное от PAS, и в русском ему отвечает сразу несколько слов, что и создаёт трудность. Это ремень для брюк, ремешок для часов, лямка сумки и, отдельно, полоска: W PASKI значит «в полоску», о ткани. Русский «пояс» как часть одежды и как талия — это PAS без уменьшительного, и PAS BEZPIECZEŃSTWA «ремень безопасности» тоже без. Отдельный пласт значений дала техника: PASEK NARZĘDZI «панель инструментов», PASEK POSTĘPU «индикатор выполнения», PASEK PRZEWIJANIA «полоса прокрутки», и в разговоре о компьютере слово означает именно их." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Беглое E исчезает во всех косвенных формах: PASEK, но PASKA, PASKOWI, PASKIEM, PASKU — та же картина, что в OŚRODEK и DOMEK. Местный единственного — PASKU, с окончанием -U, потому что основа кончается на заднеязычный K; форма на -E для таких основ невозможна. Родительный множественного — PASKÓW. Винительный равен именительному. Принадлежность вещи выражается предлогом DO или OD: PASEK DO ZEGARKA и PASEK OD ZEGARKA одинаково правильны, и оба отвечают русскому «ремешок от часов»." }
  - { kind: pronunciation, text: "Читается «па́сэк», два слога, ударение на первом. Буква E даёт чистое «э», без смягчения предыдущего согласного, — по-русски в этом месте слышалось бы «се», и это типичная ошибка. Конечное K твёрдое и глухое. В косвенных формах беглое E пропадает, и слово становится односложным в основе: PASKA звучит «па́ска», PASKIEM — «па́скем», PASKU — «па́ску». В форме PASKÓW буква Ó даёт «у», а конечное W оглушается: «па́скуф»." }
  - { kind: register, text: "Слово нейтральное и бытовое. Устойчивые сочетания: PASEK DO SPODNI, PASEK DO ZEGARKA, SUKIENKA W PASKI «платье в полоску», ZACISNĄĆ PASEK «затянуть ремень», в том числе переносно — о вынужденной экономии, ровно как по-русски. В компьютерном обиходе слово обязательно и нейтрально. Есть и разговорное выражение DOSTAĆ PASEM, о наказании ремнём, но оно употребляет форму PAS, а не уменьшительное. Звательная форма PASKU в живой речи не встречается." }
