etymology: "Уменьшительное от PAS с суффиксом -EK, а PAS — из праславянского *pojasъ, того же слова, что русский «пояс». Польский стянул его, потеряв первый слог: *pojasъ дало PAS, тогда как русский сохранил полную форму. Такое стяжение в польском обычно и видно ещё в паре PAN против старого «пан» и в WZIĄĆ против «взять». Исходный корень связан с глаголом *pojasati «опоясывать», и русское «опоясать» сохраняет его прямо. Суффикс -EK с беглым E — самый частый уменьшительный суффикс польского мужского рода, и он же объясняет всю парадигму: гласный появляется только там, где иначе слово кончалось бы на две согласные."
memory: "Уменьшительное от pas, а pas это русский «пояс», только стянутый: праслав. *pojasъ потерял первый слог. Отвечает сразу нескольким русским словам: ремень, ремешок, лямка и полоска — w paski значит «в полоску». В компьютере pasek narzędzi это панель инструментов. Беглое e пропадает: pasek, но paska; местный pasku на -u, потому что основа на k. Zacisnąć pasek значит то же, что русское «затянуть пояс»."
idioms:
  - { pl: "w paski", ru: "в полоску" }
