notes:
  - { kind: false-friend, text: "Русское «стреха» — нижний край крыши, свес. Польское STRZECHA — вся крыша из соломы или камыша, а поэтически и сам крестьянский дом." }
  - { kind: usage, text: "Женский род. В дательном и предложном CH переходит в SZ: NA STRZESZE. Родительный множественного — STRZECH. Звательный STRZECHO не употребляется." }
  - { kind: pronunciation, text: "TRZ читается «тш»: RZ после глухого T оглушается, поэтому «стшэ́ха»." }
  - { kind: usage, text: "TRAFIĆ POD STRZECHY — дойти до простого народа. Выражение из эпилога «Пана Тадеуша» Мицкевича: ŻEBY TE KSIĘGI ZBŁĄDZIŁY POD STRZECHY." }
collocations:
