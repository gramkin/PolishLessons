notes:
  - { kind: false-friend, text: "Значение то же, что у русского «гранта», и расхождений в смысле нет — слово пришло в оба языка из английского и в одно время. Разница только в грамматике, и она в двух местах. Первое: польское слово склоняется полностью, десять форм, тогда как русское тоже склоняется, так что здесь языки сходятся. Второе и настоящее: в местном падеже T переходит в C, и получается W GRANCIE, что на слух совсем не похоже на GRANT. Это то же чередование, что в NAMIOT и NAMIOCIE, ŚWIT и ŚWICIE, KRAWAT и KRAWACIE, и для заимствованного слова оно работает так же, как для своего." }
  - { kind: government, text: "Мужской род, неодушевлённое. Винительный равен именительному: OTRZYMAĆ GRANT. Родительный на -U: BEZ GRANTU. Местный GRANCIE, с чередованием T в C перед -IE. На что грант — предлог NA с винительный: GRANT NA BADANIA. Кому дают — дательный: PRZYZNAĆ KOMUŚ GRANT. Из каких средств — предлог Z с родительным: GRANT ZE ŚRODKÓW UNIJNYCH. Родительный множественного GRANTÓW. Глагол, с которым слово ходит чаще всего, — PRZYZNAĆ «предоставить, присудить»." }
  - { kind: pronunciation, text: "Читается «грант», один слог, ударять нечего. Начальное GR твёрдое, конечное T ясное, без оглушения. В родительном GRANTU два слога и ударение на первом: «гра́нту». В местном GRANCIE буква T переходит в C и читается «ць»: «гра́нце», два слога, ударение на первом. В родительном множественного GRANTÓW буква Ó даёт «у», конечное W оглушается: «гра́нтуф». Слово фонетически простое, и всё внимание уходит на форму GRANCIE." }
  - { kind: usage, text: "Частотные сочетания: PRZYZNAĆ GRANT «предоставить грант», OTRZYMAĆ GRANT, STARAĆ SIĘ O GRANT «добиваться гранта», GRANT BADAWCZY «исследовательский грант», GRANT NA BADANIA. Слово принадлежит языку науки и управления и там же набирает частотность. Производное GRANTOBIORCA «грантополучатель» встречается в документах. Прилагательное GRANTOWY употребляется в сочетании KONKURS GRANTOWY «конкурс грантов». Не путать с DOTACJA «дотация» и STYPENDIUM «стипендия»: первое идёт учреждению, второе человеку на учёбу." }
