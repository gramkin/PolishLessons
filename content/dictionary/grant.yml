etymology: "Из английского GRANT «пожалование, предоставление», от глагола TO GRANT, а тот — из старофранцузского GREANTER, искажённого CREANTER «обещать, ручаться», и далее от латинского CREDERE «верить, доверять». То есть исходно грант это нечто доверенное, вверенное на условии. Русский «грант» взят из того же английского источника и в те же годы, конец двадцатого века, поэтому слова совпадают полностью. Корень CREDERE знаком по словам KREDYT и «кредит», KREDO и «кредо», и связь эта не случайна: и кредит, и грант описывают средства, переданные под доверие. Чередование T в C в местном падеже к происхождению отношения не имеет — это славянское правило, которое польский прилагает к заимствованиям наравне со своими словами."
memory: "Как русский «грант», подвох только в одной форме: местный — w grancie, с t→c, и на слух это не похоже на grant. То же чередование, что namiot — namiocie и krawat — krawacie, и для заимствования оно работает так же. Przyznać grant «предоставить грант», grant na badania. Из английского grant, а до того латинское credere «доверять» — отсюда же kredyt."
