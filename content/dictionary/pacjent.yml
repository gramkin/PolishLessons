# review
id: pacjent
format: 2
lemma: "pacjent"
rank: 788
pos: noun
pron: { cyr: "па́цьент" }
senses:
  - id: patient
    ru: "пациент"
    examples:
      - pl: "Pacjent stracił dużo krwi."
        ru: "Пациент потерял много крови."
        source: { kind: tatoeba, id: 6692580 }
      - pl: "Tom to mój pacjent."
        ru: "Том — мой пациент."
        source: { kind: translated, id: 3996308 }
      - pl: "Pacjent nie ma pulsu."
        ru: "У пациента нет пульса."
        source: { kind: translated, id: 4837766 }
  - id: be-patient
    ru: "być pacjentem — быть пациентом (творительный)"
    examples:
      - pl: "Jesteś pacjentem."
        ru: "Ты пациент."
        source: { kind: translated, id: 5665529 }
      - pl: "Jestem pacjentem."
        ru: "Я пациент."
        source: { kind: translated, id: 10651471 }
      - pl: "Tom jest moim pacjentem."
        ru: "Том — мой пациент."
        source: { kind: translated, id: 4999021 }
  - id: to-patient
    ru: "podać pacjentowi — дать пациенту (дательный)"
    examples:
      - pl: "Współczuję pacjentowi, któremu zabrano rybę."
        ru: "Сочувствую пациенту, у которого забрали рыбу."
        source: { kind: tatoeba, id: 12696081 }
      - pl: "Pacjentowi pozwolono wstać."
        ru: "Пациенту разрешили встать."
        source: { kind: translated, id: 402697 }
      - pl: "Lekarz podał pacjentowi lek."
        ru: "Врач дал пациенту лекарство."
        source: { kind: translated, id: 8761397 }
  - id: patients
    ru: "pacjenci — пациенты"
    examples:
      - pl: "Wszyscy pacjenci ostatecznie zmarli."
        ru: "Все пациенты в конце концов умерли."
        source: { kind: tatoeba, id: 13203444 }
      - pl: "Pacjenci ciągle narzekają na tę pielęgniarkę."
        ru: "Пациенты постоянно жалуются на эту медсестру."
        source: { kind: translated, id: 12044162 }
      - pl: "Pacjenci stoją w kolejce do lekarza specjalisty."
        ru: "Пациенты стоят в очереди к врачу-специалисту."
        source: { kind: translated, id: 3746672 }
notes:
  - { kind: usage, text: "Этимология говорящая: латинское patiens значит «страдающий, терпящий», так что пациент — буквально «тот, кто терпит». Та же идея, что в польском cierpieć «страдать», только корень другой." }
  - { kind: government, text: "leczyć pacjenta «лечить пациента» — винительный; podać pacjentowi lek «дать пациенту лекарство» — дательный; kontakt z pacjentami — творительный." }
  - { kind: usage, text: "Звательный pacjencie живой, как у всех слов о людях: Panie pacjencie, proszę usiąść." }
  - { kind: usage, text: "Родня по теме: pacjentka «пациентка», lekarz «врач», szpital «больница», przychodnia «поликлиника»." }
collocations:
  - { pl: "leczyć pacjenta", ru: "лечить пациента" }
  - { pl: "być pacjentem", ru: "быть пациентом" }
  - { pl: "podać pacjentowi lek", ru: "дать пациенту лекарство" }
  - { pl: "przyjąć pacjenta", ru: "принять пациента" }
family:
  - { pl: "pacjentka", ru: "пациентка", relation: derived }
  - { pl: "lekarz", ru: "врач", relation: root }
  - { pl: "szpital", ru: "больница", relation: root }
  - { pl: "przychodnia", ru: "поликлиника", relation: root }
etymology: "Через немецкое Patient из латинского patiens «страдающий, терпящий» — то же заимствование, что русский «пациент»."
memory: "pacjent — «пациент», и этимология у слова говорящая: латинское patiens значит «страдающий, терпящий», так что пациент буквально «тот, кто терпит». Та же идея, что в польском cierpieć, только корень другой. Управление привычное: leczyć pacjenta (винительный), но podać pacjentowi lek (дательный)."
idioms:
  - { pl: "leczyć pacjenta", ru: "лечить пациента" }
  - { pl: "być pacjentem", ru: "быть пациентом" }
  - { pl: "przyjąć pacjenta", ru: "принять пациента" }
