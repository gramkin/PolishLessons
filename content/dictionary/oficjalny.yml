# review
id: oficjalny
format: 2
lemma: "oficjalny"
rank: 2477
pos: adj
pron: { cyr: "офіця́лны" }
senses:
  - id: official
    ru: "официальный"
    examples:
      - pl: "Oficjalny komunikat ukazał się w południe."
        ru: "Официальное сообщение вышло в полдень."
        source: { kind: authored }
