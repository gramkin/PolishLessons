        ru: "Это официальная версия событий."
        source: { kind: authored }
  - id: formal-stiff
    ru: "официальный, сухой, натянутый"
    examples:
      - pl: "Miał oficjalny ton, który ranił."
        ru: "У него был официальный тон, который ранил."
        source: { kind: authored }
      - pl: "Powitanie było zbyt oficjalne."
        ru: "Приветствие было слишком официальным."
        source: { kind: authored }
  - id: formal-wear
    ru: "официальный (о наряде, обстановке)"
    examples:
      - pl: "Strój oficjalny obowiązuje na gali."
        ru: "На гала-вечере обязателен официальный наряд."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ВТОРОЕ ЗНАЧЕНИЕ РУССКОМУ ПОЧТИ ЧУЖДО. Oficjalny значит не только «официальный», но и «сухой, холодный, без тепла»: oficjalny ton, oficjalne powitanie — это упрёк в отчуждённости. Русское «официальный» такого осуждения обычно не несёт, и этот оттенок легко пропустить." }
  - { kind: usage, text: "Наречие от него — oficjalnie, и у него те же два значения. Противоположность в первом смысле — NIEOFICJALNY «неофициальный», а во втором — serdeczny «радушный». Мужско-личная форма множественного — OFICJALNI: oficjalni przedstawiciele." }
  - { kind: pronunciation, text: "Четыре слога, ударение на предпоследнем: o-fi-CJAL-ny. Cj звучит как «ць» с проскальзывающим й, l твёрдое: «офіця́лны». Женская форма oficjalna — «офіця́лна»." }
collocations:
  - { pl: "oficjalny komunikat", ru: "официальное сообщение" }
  - { pl: "wersja oficjalna", ru: "официальная версия" }
  - { pl: "strój oficjalny", ru: "официальный наряд" }
family:
  - { pl: "oficjalnie", ru: "официально", relation: derived, id: oficjalnie }
  - { pl: "urzędowy", ru: "ведомственный, официальный", relation: root }
  - { pl: "serdeczny", ru: "радушный, сердечный", relation: antonym }
etymology: "Из латинского officialis «служебный», от officium «служба, долг», сращения opus «дело» и facere «делать». То же слово дало русское «официальный» и французское officiel. Отсюда же oficjalnie и oficer «офицер»."
memory: "oficjalny — «официальный», но помни второй смысл: «сухой, натянутый». Oficjalny ton это укор в холодности, и противоположность тут serdeczny «радушный», а не nieoficjalny. Мужско-личная форма — oficjalni."
idioms:
