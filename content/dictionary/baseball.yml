notes:
  - { kind: false-friend, text: "Ловушка в написании и чтении. Польский сохранил английскую запись BASEBALL, но читает по-своему: «бэ́йзболь», с Z. Встречается и польская запись BEJSBOL, но реже. Бейсбольная бита — KIJ BASEBALLOWY, и в польских новостях она чаще фигурирует как оружие хулиганов, чем как спортивный снаряд." }
  - { kind: usage, text: "Мужской род, неодушевлённое, как название игры почти без множественного числа: в карточке только единственное. Играть в бейсбол — GRAĆ W BASEBALLA: в винительном, как у многих игр, форма родительного на -A. Обычный родительный — BASEBALLU: ZASADY BASEBALLU." }
  - { kind: government, text: "Играть в бейсбол — GRAĆ W BASEBALLA, W с винительным. Правила бейсбола — ZASADY BASEBALLU, родительный. Пойти на матч — IŚĆ NA BASEBALL, NA с винительным." }
  - { kind: pronunciation, text: "Читается «бэ́йзболь», два слога, ударение на первом. BASE — «бэйз», с звонким Z, хотя пишется S. BALL — «боль», с мягкой конечной L. Русское «бейсбол» звучит иначе, с глухим «с»." }
  - { kind: register, text: "Нейтральное слово, но экзотическое для Польши: этот спорт почти не играют, и знают его по американскому кино. KIJ BASEBALLOWY — частый персонаж криминальной хроники. Польская игра, похожая на бейсбол, — PALANT, старинная дворовая лапта." }
