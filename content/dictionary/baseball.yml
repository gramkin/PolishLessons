etymology: "Из английского baseball: base «база» и ball «мяч». Игра сложилась в США в девятнадцатом веке из английских игр с битой и мячом. В польский слово пришло в двадцатом веке через кино и сохранило английскую запись, а русский переписал его кириллицей по звучанию."
memory: "Baseball — бейсбол, читается «бэ́йзболь». Grać w baseballa — играть в бейсбол. Kij baseballowy — бита. Zasady baseballu."
idioms:
