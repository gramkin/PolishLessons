# review
id: wstac
format: 2
lemma: "wstać"
rank: 1293
pos: verb
aspect: perf
aspectPair: wstawac
pron: { cyr: "встаць" }
senses:
  - id: get-up
    ru: "встать, подняться"
    examples:
      - pl: "Wstał."
        ru: "Он встал."
        source: { kind: tatoeba, id: 922471 }
      - pl: "Pora wstać!"
        ru: "Пора вставать!"
        source: { kind: translated, id: 8607337 }
      - pl: "Proszę wstać!"
        ru: "Прошу встать!"
        source: { kind: translated, id: 1313719 }
  - id: wake-up
    ru: "встать с постели, проснуться"
    examples:
      - pl: "Właśnie wstałem."
        ru: "Я только что встал."
        source: { kind: tatoeba, id: 1355008 }
      - pl: "Wstałem o piątej rano."
        ru: "Я встал в пять утра."
        source: { kind: tatoeba, id: 12662417 }
      - pl: "Dziś rano wstałem o siódmej."
        ru: "Сегодня утром я встал с постели в семь часов."
        source: { kind: tatoeba, id: 826554 }
  - id: imperative
    ru: "wstań! — встань!"
    examples:
      - pl: "Wstań!"
        ru: "Встань!"
        source: { kind: translated, id: 1313723 }
      - pl: "Wstań i ukłoń się."
        ru: "Встань и поклонись."
        source: { kind: tatoeba, id: 4113098 }
      - pl: "Wstań jutro o siódmej rano."
        ru: "Встань завтра в семь утра."
        source: { kind: tatoeba, id: 776508 }
notes:
  - { kind: usage, text: "Два значения сразу: «подняться со стула» и «встать с постели». Wstałem o siódmej «Я встал в семь» — почти всегда о пробуждении." }
  - { kind: usage, text: "Идиома wstać lewą nogą «встать с левой ноги» отвечает русскому «встать не с той ноги»." }
  - { kind: usage, text: "Вид совершенный; несовершенный — wstawać, карточка уже есть. Основа чередуется: wstać и wstał, но wstanę, wstaniesz в будущем." }
  - { kind: false-friend, text: "Осторожно: сочетание w stanie «в состоянии» иногда пишут слитно как wstanie, и тогда это не форма глагола: Był w stanie mówić «Он был в состоянии говорить»." }
collocations:
  - { pl: "wstać wcześnie", ru: "встать рано" }
  - { pl: "wstać z łóżka", ru: "встать с постели" }
  - { pl: "wstać lewą nogą", ru: "встать не с той ноги" }
etymology: "Приставка w- и stać «стоять», из праславянского *stati. Русское «встать» собрано ровно теми же частями."
memory: "wstać — и «подняться», и «встать с постели»: Wstałem o siódmej почти всегда о пробуждении. Несовершенный вид — wstawać. Основа чередуется: wstać и wstał, но wstanę, wstaniesz."
idioms:
  - { pl: "wstać wcześnie", ru: "встать рано" }
  - { pl: "wstać lewą nogą", ru: "встать не с той ноги" }
  - { pl: "wstać z łóżka", ru: "встать с постели" }
