# review
id: legenda
format: 2
lemma: "legenda"
rank: 2137
pos: noun
pron: { cyr: "леге́нда" }
senses:
  - id: legend
    ru: "легенда, предание"
    examples:
      - pl: "Po Bałkanach krążą legendy o wampirach."
        ru: "По Балканам ходят легенды о вампирах."
        source: { kind: translated, id: 701605 }
      - pl: "Jest wiele starych indyjskich legend."
        ru: "Есть много старых индийских легенд."
        source: { kind: translated, id: 2939627 }
      - pl: "Ta piosenka wzięła się z pewnej legendy."
        ru: "Эта песня родилась из одной легенды."
        source: { kind: translated, id: 929190 }
  - id: famous-person
    ru: "легенда (о человеке)"
    examples:
      - pl: "Ten człowiek to legenda."
        ru: "Этот человек — легенда."
        source: { kind: translated, id: 2212199 }
      - pl: "Bill jest legendą tej firmy."
        ru: "Билл — легенда этой фирмы."
        source: { kind: translated, id: 735623 }
notes:
  - { kind: usage, text: "Третье значение, которого нет в примерах: legenda mapy «легенда карты», то есть условные обозначения. Русское слово работает так же." }
  - { kind: false-friend, text: "Ловушки нет: оба слова из латинского legenda «то, что следует прочесть»." }
  - { kind: government, text: "Женский род: ta legenda, tej legendy." }
  - { kind: usage, text: "miejska legenda «городская легенда» — калька английского urban legend, как и в русском." }
collocations:
  - { pl: "miejska legenda", ru: "городская легенда" }
  - { pl: "legenda głosi", ru: "легенда гласит" }
etymology: "Из латинского legenda «то, что следует прочесть», от legere «читать»; русское «легенда» — то же слово."
memory: "legenda — «легенда» во всех смыслах: предание, знаменитый человек и условные обозначения на карте. Слово общее с русским, из латыни."
idioms:
  - { pl: "miejska legenda", ru: "городская легенда" }
  - { pl: "legenda głosi", ru: "легенда гласит" }
formExamplesSkip:
  - { form: "legendo", reason: "звательная форма, а legenda — это предание или молва. Обращаться к легенде некому, поэтому форма остаётся только в таблице склонения" }
