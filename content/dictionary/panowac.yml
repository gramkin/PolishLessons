# review
id: panowac
format: 2
lemma: "panować"
rank: 2039
pos: verb
pron: { cyr: "пано́ваць" }
senses:
  - id: prevail
    ru: "царить, стоять (о тишине, порядке, настроении)"
    examples:
      - pl: "W sali panowała cisza."
        ru: "В зале царила тишина."
        source: { kind: authored }
      - pl: "Panuje tu wzorowy porządek."
        ru: "Здесь царит образцовый порядок."
        source: { kind: authored }
      - pl: "Panowało napięcie, którego nikt nie nazywał."
        ru: "Царило напряжение, которого никто не называл."
        source: { kind: authored }
  - id: reign
    ru: "царствовать, править"
    examples:
      - pl: "Panował przez czterdzieści lat."
        ru: "Он правил сорок лет."
        source: { kind: authored }
      - pl: "Za panowania jego ojca było inaczej."
        ru: "В царствование его отца было иначе."
        source: { kind: authored }
  - id: master
    ru: "владеть, управлять — panować nad czymś"
    examples:
      - pl: "Nie panował nad sobą."
        ru: "Он не владел собой."
        source: { kind: authored }
      - pl: "Kierowca nie panował nad autem."
        ru: "Водитель не справлялся с машиной."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Корень тот же, что в слове pan, и русское «пан» как раз из польского и пришло. Но в живом польском pan — это прежде всего вежливое обращение, «господин» и само «вы»: czy pan wie? значит «вы знаете?». Глагол panować от того же корня и значит «господствовать, царить»." }
  - { kind: government, text: "Владеют ЧЕМ — предлог nad с ТВОРИТЕЛЬНЫМ, как по-русски: panować nad sobą, nad sytuacją, nad tłumem. Совпадение полное, включая главный оборот: panować nad sobą — «владеть собой». В значении «царить» глагол идёт без дополнения: panowała cisza." }
  - { kind: usage, text: "Настоящее время по правилу -ować: panuję, panujesz, panuje. Глагол непереходный, поэтому страдательного причастия нет — есть только отглагольное panowanie «царствование, господство» и безличное panowano. Устойчиво za panowania kogoś — «в царствование кого-то»." }
  - { kind: register, text: "Безличное panowało годится для любой обстановки: panowała cisza, panował bałagan, panowało przekonanie, że… Это самый обычный способ сказать по-польски «царило», и звучит он нейтрально, а не возвышенно." }
collocations:
  - { pl: "panować nad sobą", ru: "владеть собой" }
  - { pl: "panowała cisza", ru: "царила тишина" }
  - { pl: "za panowania", ru: "в царствование" }
family:
  - { pl: "pan", ru: "господин; вы", relation: root, id: pan }
  - { pl: "panowanie", ru: "царствование, господство", relation: derived }
  - { pl: "opanować", ru: "овладеть, освоить", relation: derived }
etymology: "От pan «господин», слова праславянского происхождения, которое русский как раз заимствовал из польского в виде «пан». Глагол panować значит «быть паном, господствовать». Отсюда panowanie «царствование», opanować «овладеть» и panujący «правящий, господствующий»."
memory: "panować — «царить, господствовать», от pan «господин». Управление родное: panować NAD czymś, творительный. Запомните два оборота целиком: panować nad sobą «владеть собой» и panowała cisza «царила тишина»."
idioms:
  - { pl: "panować nad sobą", ru: "владеть собой" }
  - { pl: "panowała cisza", ru: "царила тишина" }
