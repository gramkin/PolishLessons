lemma: "omacek"
rank: 2247
pos: noun
pron: { cyr: "о́мацэк" }
senses:
  - id: groping
    ru: "ощупь (в обороте po omacku «на ощупь»)"
    examples:
      - pl: "Dalej posuwali się po omacku."
        ru: "Дальше они продвигались на ощупь."
        source: { kind: translated, id: 813728 }
      - pl: "Poruszał się w ciemności po omacku."
        ru: "Он двигался в темноте на ощупь."
        source: { kind: translated, id: 730405 }
      - pl: "W pokoju było tak ciemno, że musieliśmy przesuwać się do drzwi po omacku."
        ru: "В комнате было так темно, что нам пришлось двигаться к двери на ощупь."
        source: { kind: translated, id: 415243 }
  - id: blindly
    ru: "вслепую, наугад (переносно)"
    examples:
      - pl: "Szukamy rozwiązania po omacku."
        ru: "Мы ищем решение вслепую."
        source: { kind: authored }
      - pl: "Działali po omacku, bez planu."
        ru: "Они действовали наугад, без плана."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Слово-ископаемое: существует практически только в обороте po omacku «на ощупь». Самостоятельно не употребляется, и все три корпусных примера — именно этот оборот." }
  - { kind: false-friend, text: "Корень macać «щупать, ощупывать»; ср. русское «макать»? Нет — ближе «щупать». Русское «на ощупь» передаёт смысл точно." }
  - { kind: government, text: "Оборот неизменен: po omacku, с предложным падежом." }
  - { kind: usage, text: "Переносно значит «вслепую, без плана» — как русское «наугад». В этом ряду стоят szwank (bez szwanku) и dech (z zapartym tchem) — такие же окаменевшие слова." }
collocations:
  - { pl: "po omacku", ru: "на ощупь" }
  - { pl: "szukać po omacku", ru: "искать на ощупь" }
etymology: "От macać «щупать, ощупывать»; оборот сохранил старую падежную форму."
memory: "omacek живёт только в обороте po omacku «на ощупь», буквально и переносно. Тот же тип окаменелости, что szwank в bez szwanku и dech в z zapartym tchem."
