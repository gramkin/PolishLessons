id: cialo
format: 2
lemma: "ciało"
rank: 293
pos: noun
pron: { cyr: "ця́уо" }
senses:
  - id: body
    ru: "тело"
    examples:
      - pl: "Boli mnie całe ciało."
        ru: "У меня болит всё тело."
        source: { kind: tatoeba, id: 1188563 }
      - pl: "Niedźwiedź nie tknie martwego ciała."
        ru: "Медведь не тронет мёртвое тело."
        source: { kind: tatoeba, id: 827797 }
      - pl: "Ciało to ogród, którego ogrodnikiem nasza wola."
        ru: "Тело - это сад, садовник которому - наша воля."
        source: { kind: tatoeba, id: 1627359 }
  - id: physical-body
    ru: "тело (физическое); орган, коллегия"
    examples:
      - pl: "Ciało stałe nie zmienia kształtu."
        ru: "Твёрдое тело не меняет формы."
        source: { kind: authored }
      - pl: "Ciało pedagogiczne zebrało się w auli."
        ru: "Педагогический коллектив собрался в актовом зале."
        source: { kind: authored }
      - pl: "W ciele człowieka jest dużo wody."
        ru: "В теле человека много воды."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Праславянское *tělo дало русское «тело» и польское ciało: t перед ě перешло в ć." }
  - { kind: usage, text: "ciało stałe — «твёрдое тело»; martwe ciało — «мёртвое тело, труп»." }
  - { kind: usage, text: "Переносно ciało значит «орган, коллегия»: ciało decyzyjne «решающий орган», ciało pedagogiczne «педагогический коллектив»." }
  - { kind: register, text: "Разговорное dać ciała значит «облажаться, провалить дело» — к телу отношения не имеет." }
collocations:
  - { pl: "całe ciało", ru: "всё тело" }
  - { pl: "ciało stałe", ru: "твёрдое тело" }
  - { pl: "martwe ciało", ru: "мёртвое тело" }
  - { pl: "w ciele", ru: "в теле" }
etymology: "Праславянское *tělo — то же слово, что русское «тело»; польское ć возникло из t перед ě."
memory: "ciało — «тело»: праславянское *tělo дало и русское «тело», и польское ciało. А разговорное dać ciała значит «облажаться»."
idioms:
  - { pl: "ciało stałe", ru: "твёрдое тело" }
  - { pl: "dać ciała", ru: "облажаться" }
  - { pl: "w zdrowym ciele zdrowy duch", ru: "в здоровом теле здоровый дух" }
