  - id: entail
    ru: "влечь за собой, несть (последствия)"
    examples:
      - pl: "Każda zmiana niesie ze sobą ryzyko."
        ru: "Каждое изменение влечёт за собой риск."
        source: { kind: authored }
      - pl: "Ta decyzja niosła poważne skutki."
        ru: "Это решение несло серьёзные последствия."
