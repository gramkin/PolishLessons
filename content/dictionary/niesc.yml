  - id: bring-aid
    ru: "оказывать (помощь, поддержку)"
    examples:
      - pl: "Niosą pomoc poszkodowanym od tygodnia."
        ru: "Они оказывают помощь пострадавшим уже неделю."
        source: { kind: authored }
      - pl: "Niesie pocieszenie tym, którzy je potrzebują."
        ru: "Он несёт утешение тем, кто в нём нуждается."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Главное, что надо знать об этом глаголе, — что он половина пары, и русский устроен точно так же. NIEŚĆ описывает одну ходку в одну сторону, сейчас: NIOSĘ TORBĘ DO DOMU. NOSIĆ описывает привычку или движение туда-сюда: NOSZĘ TORBĘ DO PRACY CODZIENNIE, NOSIĆ OKULARY «носить очки». Русская пара «нести/носить» делит смысл ровно по той же границе, так что переносить ничего не надо — надо лишь не забывать, что польский эту разницу соблюдает так же строго." }
  - { kind: pronunciation, text: "Основа играет тремя огласовками, и подробно это разобрано в карточке PONIEŚĆ из партии про понести: -ie- перед мягким (NIESIESZ, NIESIE, NIEŚLI), -io- перед твёрдым (NIOSĘ, NIOSĄ, NIOSŁA), -ió- в закрытом слоге перед Ł (NIÓSŁ). Сам инфинитив NIEŚĆ читается «нещць» — ść как мягкое щць, одним движением, без гласной между согласными." }
  - { kind: government, text: "Что — винительный: NIEŚĆ TORBĘ, WALIZKĘ, POMOC. Куда — DO с родительным или NA с винительным: DO DOMU, NA GÓRĘ. Кому — дательный: NIEŚĆ KOMUŚ POMOC. В значении последствий устойчив оборот NIEŚĆ ZE SOBĄ: ZMIANA NIESIE ZE SOBĄ RYZYKO — «изменение влечёт за собой риск», и русский тут тоже вставляет «за собой»." }
collocations:
  - { pl: "nieść pomoc", ru: "оказывать помощь" }
  - { pl: "nieść ze sobą ryzyko", ru: "влечь за собой риск" }
  - { pl: "nieść torbę", ru: "нести сумку" }
family:
  - { pl: "nosić", ru: "носить", relation: root, id: nosic }
  - { pl: "ponieść", ru: "понести, потерпеть", relation: root, id: poniesc }
  - { pl: "przynieść", ru: "принести", relation: root, id: przyniesc }
etymology: "Праславянское *nesti — то же слово, что русское «нести», с тем же чередованием в основе и тем же набором приставок. Корень дал в обоих языках целое хозяйство: польские NOSIĆ «носить», NOSZE «носилки», DONIESIENIE «донесение», ZNOSIĆ «сносить», и русские «носить», «носилки», «донесение». Переносные значения тоже общие и старые: и польский, и русский говорят о решении, которое «несёт» последствия, и о помощи, которую «несут» людям, — метафора ноши работает в обоих языках без перевода."
memory: "nieść/nosić делятся как русские «нести/носить»: nieść — одна ходка сейчас, nosić — привычка. А nieść ze sobą — «влечь за собой»."
idioms:
  - { pl: "nieść pomoc", ru: "оказывать помощь" }
  - { pl: "nieść ze sobą", ru: "влечь за собой, иметь следствием" }
