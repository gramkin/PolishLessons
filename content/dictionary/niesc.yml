id: niesc
format: 2
lemma: "nieść"
rank: 3039
pos: verb
pron: { cyr: "нещць" }
senses:
  - id: carry
    ru: "нести"
    examples:
      - pl: "Niosła torbę w obu rękach."
        ru: "Она несла сумку в обеих руках."
