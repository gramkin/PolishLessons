        ru: "Я поеду следующим автобусом."
        source: { kind: tatoeba, id: 5377714 }
  - id: next-time
    ru: "следующий (о времени)"
    examples:
      - pl: "Następnego dnia przyjechał Tom."
        ru: "На следующий день приехал Том."
        source: { kind: tatoeba, id: 11264108 }
      - pl: "To się wydarzyło następnego dnia."
        ru: "Это случилось на следующий день."
        source: { kind: tatoeba, id: 6305700 }
      - pl: "W następnym tygodniu będę w Australii."
        ru: "На следующей неделе я буду в Австралии."
        source: { kind: tatoeba, id: 8664049 }
notes:
  - { kind: usage, text: "następnego dnia — «на следующий день», w następnym tygodniu — «на следующей неделе», następnym razem — «в следующий раз»." }
  - { kind: usage, text: "В очереди кричат Następny! «Следующий!»" }
  - { kind: usage, text: "Близкое kolejny значит «очередной» — о том, что идёт чередой: kolejna próba «очередная попытка»." }
collocations:
  - { pl: "następnego dnia", ru: "на следующий день" }
  - { pl: "następnym razem", ru: "в следующий раз" }
  - { pl: "następna stacja", ru: "следующая станция" }
  - { pl: "kto następny?", ru: "кто следующий?" }
etymology: "От następować «следовать», из na- + stąpić «ступить»; буквально «наступающий следом»."
memory: "następny — «следующий», от następować «следовать». Następnego dnia «на следующий день», а в очереди кричат Następny!"
idioms:
