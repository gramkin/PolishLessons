# review
id: jechac
format: 2
lemma: "jechać"
rank: 193
pos: verb
aspect: imperf
pron: { cyr: "е́хаць" }
senses:
  - id: travel
    ru: "ехать (на транспорте, в определённом направлении)"
    note: "Средство передвижения стоит в творительном падеже: jadę autobusem."
    examples:
      - pl: "Jutro jadę do USA."
        ru: "Завтра я еду в США."
        source: { kind: tatoeba, id: 3460274 }
      - pl: "Po co jedziesz do Tokio?"
        ru: "Зачем ты едешь в Токио?"
        source: { kind: tatoeba, id: 629941 }
      - pl: "Muszę jechać do Stambułu."
        ru: "Я должен ехать в Стамбул."
        source: { kind: tatoeba, id: 3656616 }
  - id: go
    ru: "ехать, отправляться (о человеке и о транспорте)"
    examples:
      - pl: "Tom jedzie."
        ru: "Том едет."
        source: { kind: tatoeba, id: 10133960 }
      - pl: "On nie jedzie."
        ru: "Он не едет."
        source: { kind: tatoeba, id: 366619 }
      - pl: "Powinniście jechać."
        ru: "Вам лучше поехать."
        source: { kind: tatoeba, id: 10747486 }
notes:
  - { kind: usage, text: "Как в русском, есть пара: jechać «ехать» (на транспорте) и iść «идти» (пешком). Не говорят «idę do Warszawy» о поездке." }
  - { kind: government, text: "Транспорт ставится в творительный падеж без предлога: jechać autobusem, jechać samochodem, jechać pociągiem." }
  - { kind: usage, text: "jechać — однонаправленное движение, jeździć — регулярное: Jadę do pracy «Еду на работу» — Jeżdżę do pracy autobusem «Езжу на работу автобусом»." }
collocations:
  - { pl: "jechać samochodem", ru: "ехать на машине" }
  - { pl: "jechać do domu", ru: "ехать домой" }
  - { pl: "jechać pociągiem", ru: "ехать поездом" }
  - { pl: "jedź ostrożnie", ru: "езжай осторожно" }
etymology: "Праславянское *jěxati — то же слово, что русское «ехать»; отсюда же jazda «езда»."
memory: "Пара как в русском: jechać «ехать» (транспортом) — iść «идти» (пешком), jechać — jeździć как «ехать — ездить». Но транспорт ставится в творительный: jadę autobusem."
idioms:
  - { pl: "jechać na jednym wózku", ru: "быть в одной лодке" }
  - { pl: "jechać po kimś", ru: "наезжать на кого-то" }
  - { pl: "jedź ostrożnie", ru: "езжай осторожно" }
formExamplesSkip:
  - { form: "jechania", reason: "отглагольное существительное не употребляется: в этом значении говорят jazda" }
  - { form: "jechanie", reason: "отглагольное существительное не употребляется: в этом значении говорят jazda" }
  - { form: "jechaniem", reason: "отглагольное существительное не употребляется: в этом значении говорят jazda" }
  - { form: "jechaniu", reason: "отглагольное существительное не употребляется: в этом значении говорят jazda" }
