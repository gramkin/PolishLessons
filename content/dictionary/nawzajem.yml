# review
id: nawzajem
format: 2
lemma: "nawzajem"
rank: 1983
pos: adv
pron: { cyr: "навза́ем" }
senses:
  - id: each-other
    ru: "друг друга, взаимно"
    examples:
      - pl: "Pomagamy sobie nawzajem."
        ru: "Мы помогаем друг другу."
        source: { kind: translated, id: 4952959 }
      - pl: "Ufaliśmy sobie nawzajem."
        ru: "Мы доверяли друг другу."
        source: { kind: translated, id: 11586365 }
      - pl: "Chcę żyć w świecie, gdzie ludzie kochają się nawzajem."
        ru: "Я хочу жить в мире, где люди любят друг друга."
        source: { kind: tatoeba, id: 3656747 }
  - id: same-to-you
    ru: "взаимно! (ответ на пожелание)"
    examples:
      - pl: "Nawzajem."
        ru: "Взаимно."
        source: { kind: translated, id: 6160609 }
      - pl: "Nawzajem!"
        ru: "Взаимно!"
        source: { kind: translated, id: 12232585 }
      - pl: "Patrzą na siebie nawzajem."
        ru: "Они смотрят друг на друга."
        source: { kind: translated, id: 3026121 }
notes:
  - { kind: usage, text: "Само по себе Nawzajem! — стандартный ответ на пожелание: «И вам того же», «Взаимно». На Wesołych Świąt! отвечают Nawzajem!" }
  - { kind: usage, text: "В остальных случаях стоит рядом с sobie или siebie и значит «друг друга»: pomagamy sobie nawzajem «мы помогаем друг другу»." }
  - { kind: false-friend, text: "Русское «взаимно» и польское nawzajem — одного корня, но польское гораздо чаще работает как готовая реплика." }
  - { kind: usage, text: "Более книжный синоним — wzajemnie; в живой речи он встречается реже." }
collocations:
  - { pl: "nawzajem!", ru: "взаимно!" }
  - { pl: "pomagać sobie nawzajem", ru: "помогать друг другу" }
  - { pl: "kochać się nawzajem", ru: "любить друг друга" }
family:
  - { pl: "wzajemny", ru: "взаимный", relation: root }
  - { pl: "wzajemnie", ru: "взаимно", relation: root }
etymology: "Из na плюс wzajem «взаимно», того же корня, что русское «взаимно» через «вз-» и «имать». Слова прямо родственны."
memory: "nawzajem — «друг друга» при sobie: pomagamy sobie nawzajem. А само по себе Nawzajem! — это ответ «И вам того же, взаимно»."
idioms:
