# review
id: rozpoczynac
format: 2
lemma: "rozpoczynać"
rank: 4119
pos: verb
pron: { cyr: "розпочы́наць" }
senses:
  - id: begin
    ru: "начинать (книжно)"
    examples:
      - pl: "Rozpoczynamy spotkanie o dziewiątej."
        ru: "Мы начинаем встречу в девять."
        source: { kind: authored }
      - pl: "Każdy dzień rozpoczynam od kawy."
        ru: "Каждый день я начинаю с кофе."
