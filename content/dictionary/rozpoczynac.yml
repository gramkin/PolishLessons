      - pl: "Rząd rozpoczyna reformę szkolnictwa."
        ru: "Правительство начинает реформу образования."
        source: { kind: authored }
  - id: start
    ru: "начинаться (ROZPOCZYNAĆ SIĘ)"
    examples:
      - pl: "Lekcje rozpoczynają się we wrześniu."
        ru: "Уроки начинаются в сентябре."
        source: { kind: authored }
      - pl: "Film rozpoczyna się za pięć minut."
        ru: "Фильм начинается через пять минут."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ROZPOCZYNAĆ — книжный синоним ZACZYNAĆ «начинать». Русское «распочинать» не существует; ближе «приступать». В объявлениях и новостях: ROZPOCZYNA SIĘ SEZON «начинается сезон». С SIĘ — «начинаться»." }
  - { kind: usage, text: "Несовершенный вид; совершенный — ROZPOCZĄĆ. Спряжение на -AM: ROZPOCZYNAM, ROZPOCZYNASZ, ROZPOCZYNAJĄ. Мужско-личное страдательное ROZPOCZYNANI в карточку не включено: начинают дела, а не людей." }
  - { kind: government, text: "Что — винительный: ROZPOCZYNAĆ PRACĘ. С чего — OD с родительным: ROZPOCZYNAĆ OD ŚNIADANIA. Чем — творительный: ROZPOCZYNAĆ PRZEMÓWIENIE ŻARTEM." }
  - { kind: pronunciation, text: "Читается «розпочы́наць»: CZ — твёрдое «ч», ударение на предпоследнем слоге. ROZPOCZYNAM — «розпочы́нам». В беглой речи Z перед P звучит глуше." }
  - { kind: register, text: "Книжно-официальное слово. В разговоре — ZACZYNAĆ." }
collocations:
  - { pl: "rozpoczynać pracę", ru: "приступать к работе" }
  - { pl: "rozpoczynać się", ru: "начинаться" }
  - { pl: "rozpoczynać od nowa", ru: "начинать заново" }
family:
  - { pl: "rozpocząć", ru: "начать", relation: aspect, id: rozpoczac }
  - { pl: "zaczynać", ru: "начинать", relation: root, id: zaczynac }
  - { pl: "kończyć", ru: "заканчивать", relation: antonym, id: konczyc }
etymology: "Приставка ROZ- плюс POCZYNAĆ, от праславянского *počęti «начать», как русское «почин», «начать». Тот же корень в POCZĄTEK «начало»."
memory: "Rozpoczynać — начинать (книжно): rozpoczynamy spotkanie. В разговоре — zaczynać. Z SIĘ — начинаться."
idioms:
  - { pl: "rozpoczynać od zera", ru: "начинать с нуля" }
formExamplesSkip:
