# review
id: znajomy
format: 2
lemma: "znajomy"
rank: 868
pos: adj
pron: { cyr: "знайо́мы" }
senses:
  - id: acquaintance
    ru: "знакомый (человек)"
    note: "Прилагательное, ставшее существительным, — ровно как русское «знакомый»."
    examples:
      - pl: "Spotkałam starego znajomego."
        ru: "Я встретил старого знакомого."
        source: { kind: tatoeba, id: 4412570 }
      - pl: "Tom to znajomy ze szkoły."
        ru: "Том — знакомый по школе."
        source: { kind: translated, id: 12040994 }
      - pl: "Mój znajomy jest grabarzem."
        ru: "Мой знакомый — могильщик."
        source: { kind: translated, id: 3745177 }
  - id: female
    ru: "znajoma — знакомая"
    examples:
      - pl: "Moja znajoma nie wychodzi z domu bez papierosów."
        ru: "Моя знакомая не выходит из дома без сигарет."
        source: { kind: translated, id: 1453374 }
      - pl: "To raczej znajoma niż przyjaciółka."
        ru: "Это скорее знакомая, чем подруга."
        source: { kind: translated, id: 352739 }
      - pl: "Jesteś moją najlepszą znajomą."
        ru: "Ты моя лучшая знакомая."
        source: { kind: translated, id: 13582151 }
  - id: familiar
    ru: "знакомый, привычный (о голосе, лице)"
    examples:
      - pl: "Ten głos jest mi znajomy."
        ru: "Этот голос мне знаком."
        source: { kind: authored }
      - pl: "Znajoma twarz mignęła w tłumie."
        ru: "Знакомое лицо мелькнуло в толпе."
        source: { kind: authored }
      - pl: "Jego twarz wydała mi się znajoma."
        ru: "Его лицо показалось мне знакомым."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Слово живёт двойной жизнью: как прилагательное значит «знакомый, привычный» (znajomy głos), как существительное — «знакомый человек» (Mój znajomy jest grabarzem). Склоняется при этом всегда по-прилагательному, как и русское «знакомый»." }
  - { kind: false-friend, text: "Различайте три ступени близости: znajomy «знакомый», kolega «приятель, товарищ по работе или учёбе», przyjaciel «друг». Польское przyjaciel гораздо сильнее русского «приятель» — это настоящий друг." }
  - { kind: usage, text: "Женский род — znajoma, множественное мужского лица — znajomi, прочее — znajome: Moi znajomi nie są młodzi." }
  - { kind: usage, text: "Наречие znajomo употребляется в обороте brzmi znajomo «звучит знакомо», а существительное znajomość значит «знакомство»; во множественном znajomości — «связи»." }
collocations:
  - { pl: "mój znajomy", ru: "мой знакомый" }
  - { pl: "znajomy głos", ru: "знакомый голос" }
  - { pl: "przez znajomości", ru: "по знакомству" }
  - { pl: "stary znajomy", ru: "старый знакомый" }
family:
  - { pl: "znać", ru: "знать", relation: root, id: znac }
  - { pl: "znajomość", ru: "знакомство", relation: derived }
  - { pl: "zapoznać", ru: "познакомить", relation: derived }
etymology: "От znać «знать» — буквально «тот, кого знают», ровно как русское «знакомый» от «знать». Слово и в польском, и в русском одинаково легко переходит из прилагательного в существительное."
memory: "znajomy — и прилагательное «знакомый, привычный» (znajomy głos), и существительное «знакомый человек», причём склоняется всегда по-прилагательному, как в русском. Держите в голове лестницу близости: znajomy «знакомый» — kolega «приятель» — przyjaciel «друг». Последнее сильнее русского «приятеля»."
idioms:
