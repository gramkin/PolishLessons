  - { pl: "stołowy", ru: "столовый", relation: derived }
etymology: "Уменьшительное от stół «стол», из праславянского *stolъ — того же слова, что русское «стол», а исходно «нечто расстеленное, подставка», от корня «стлать». Суффикс -ik тот же, что в русском «столик». Отсюда stołek «табурет», stołowy и stolica «столица» — буквально «престольный город»."
memory: "stolik — «столик», от stół «стол». Два изменения разом: ó переходит в o, потому что слог открылся, а ł смягчается в l перед i. И суффикс -ik гласного не роняет: stolika, не «stolka» — в отличие от domek, domku."
