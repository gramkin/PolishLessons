notes:
  - { kind: pronunciation, text: "ДВА ЧЕРЕДОВАНИЯ В ОДНОМ СЛОВЕ. Исходное stół пишется через ó и ł, но в уменьшительном оба меняются: stolik — с o и с мягким l. Ó уступает место o, потому что слог открывается, как в ogród/ogrodu; а ł смягчается в l перед i. Та же пара видна в stół — stoły — stolik." }
  - { kind: usage, text: "СУФФИКС -IK НЕ РОНЯЕТ ГЛАСНОГО, В ОТЛИЧИЕ ОТ -EK. Stolik склоняется без выпадения: stolika, stolikowi, stoliku. А уменьшительные на -ek теряют e: domek — domku, worek — worka. Стоит запомнить пару: stolik — stolika, но domek — domku." }
  - { kind: false-friend, text: "Слово прозрачно: «столик», от stół «стол». Но стоит помнить, что в кафе и ресторане поляки говорят именно stolik, а не stół: zarezerwować stolik, stolik dla dwojga, wolny stolik. Русский в этой же ситуации говорит «столик», так что совпадение полное." }
