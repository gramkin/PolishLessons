notes:
  - { kind: usage, text: "Это не обычное прилагательное, а действительное причастие настоящего времени, ставшее прилагательным. Суффикс -ĄCY точно отвечает русскому -ЮЩИЙ: EKSCYTUJĄCY и «волнующий», INTERESUJĄCY и «интересующий», PASUJĄCY и «подходящий». Образуется он от третьего лица множественного числа: EKSCYTUJĄ даёт EKSCYTUJĄCY, и это правило работает для любого польского глагола несовершенного вида. Форм получается десять, а не одиннадцать, потому что мужской личный именительный множественного совпадает с мужским именительным единственного: и там и там EKSCYTUJĄCY. Такое совпадение обычно для всех причастий на -ĄCY и для прилагательных с основой на мягкий согласный." }
  - { kind: false-friend, text: "Переводить это слово нужно по контексту, а не по звучанию. EKSCYTUJĄCY значит «волнующий, захватывающий, увлекательный», а русского «эксцитирующего» не существует. Глагол EKSCYTOWAĆ SIĘ CZYMŚ означает «восторгаться, увлекаться чем-то»: EKSCYTUJE SIĘ PIŁKĄ NOŻNĄ «он увлечён футболом». Будьте осторожны с русским «возбуждающий»: оно годится лишь иногда, а чаще уводит в сторону, потому что по-польски для этого есть POBUDZAJĄCY и PODNIECAJĄCY, причём последнее в современном языке почти всегда о чувственном возбуждении. Нейтральные замены — PASJONUJĄCY «увлекательный» и PORYWAJĄCY «захватывающий»." }
  - { kind: government, text: "Согласуется с существительным в роде, числе и падеже, как всякое прилагательное. Причастное происхождение видно в управлении исходного глагола: EKSCYTOWAĆ SIĘ требует творительного падежа — EKSCYTOWAĆ SIĘ WYNIKIEM «восторгаться результатом». Само прилагательное дополнения не требует. Степени сравнения строятся описательно, через BARDZIEJ: BARDZIEJ EKSCYTUJĄCY, NAJBARDZIEJ EKSCYTUJĄCY, потому что причастия на -ĄCY синтетических степеней не образуют. Наречие — EKSCYTUJĄCO." }
  - { kind: pronunciation, text: "Читается «эксцытуйо́нцы», пять слогов, ударение на предпоследнем. Начальное E даёт «э». Сочетание KS произносится раздельно, оба согласных. Буква C перед Y даёт «ц», а сам Y — «ы», поэтому второй слог звучит «сцы». Носовое Ą перед C даёт «он», отсюда «йонц». Конечное -Y снова «ы». Слово длинное, и в беглой речи поляки произносят его слитно, без пауз между слогами." }
