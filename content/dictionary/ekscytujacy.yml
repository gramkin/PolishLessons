etymology: "От EKSCYTOWAĆ, через французское EXCITER или прямо из латинского EXCITARE «возбуждать, пробуждать», сложенного из EX- «из» и CIERE «приводить в движение». Буквально — «вызывать движение», и из этого образа выросли все современные значения, от волнения до увлечённости. Русский взял из того же латинского корня другие слова: «эксцитация» осталась термином, а для бытового смысла язык обошёлся своими «волновать» и «захватывать». Суффикс -ĄCY, которым образовано причастие, восходит к праславянскому причастному *-ǫt-, и русское -УЩИЙ с -ЮЩИЙ идут оттуда же, поэтому соответствие между польскими и русскими формами на -ĄCY и -ЮЩИЙ почти механическое. Из того же латинского CIERE происходят и CYTOWAĆ «цитировать», и RECYTOWAĆ, где корень виден прямо."
memory: "Это причастие на -ący, а -ący точно равно русскому -ющий: ekscytujący «волнующий», interesujący «интересующий». Образуется от третьего лица множественного: ekscytują → ekscytujący. Форм десять, не одиннадцать: мужской личный множественного совпадает с единственным. Степени только описательные, через bardziej. Глагол требует творительного: ekscytować się wynikiem."
