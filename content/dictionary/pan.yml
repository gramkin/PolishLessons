# review
id: pan
format: 2
depth: deep
lemma: "pan"
rank: 28
pos: noun
pron: { cyr: "пан" }
senses:
  - id: polite
    ru: "Вы (вежливое обращение к мужчине)"
    examples:
      - pl: "Wysiada pan?"
        ru: "Вы выходите?"
        source: { kind: tatoeba, id: 450786 }
      - pl: "Co pan czyta?"
        ru: "Что вы читаете?"
        source: { kind: tatoeba, id: 722395 }
      - pl: "Wypiszę panu receptę."
        ru: "Я выпишу вам рецепт."
        source: { kind: tatoeba, id: 2809337 }
  - id: gentleman
    ru: "господин, мужчина; хозяин"
    examples:
      - pl: "Pies zamerdał ogonem i poszedł za swoim panem."
        ru: "Пёс завилял хвостом и пошёл за хозяином."
        source: { kind: tatoeba, id: 983742 }
      - pl: "Ten pan czeka na ciebie."
        ru: "Этот господин ждёт тебя."
        source: { kind: authored }
  - id: title
    ru: "пан, господин (перед именем, фамилией или должностью)"
    examples:
      - pl: "Pan Kowalski już przyszedł."
        ru: "Пан Ковальский уже пришёл."
        source: { kind: authored }
      - pl: "Proszę pana doktora."
        ru: "Пожалуйста, доктор."
        source: { kind: authored }
      - pl: "To pan Nowak, nasz sąsiad."
        ru: "Это пан Новак, наш сосед."
        source: { kind: authored }
notes:
  - { kind: usage, text: "После pan глагол стоит в третьем лице: Czy pan wie? «Вы знаете?». Множественное: panowie «господа», panie «дамы», państwo «дамы и господа»." }
  - { kind: usage, text: "В обращении обязателен звательный падеж: panie doktorze «доктор», panie Kowalski «пан Ковальский»." }
  - { kind: false-friend, text: "Вежливое «вы» к одному мужчине — это pan с глаголом в третьем лице, а не wy: Czy pan mówi po polsku? Обращение на wy к одному человеку по-польски звучит грубо или по-деревенски." }
  - { kind: usage, text: "Перед фамилией и должностью pan обязателен там, где русский обходится без него: pan Kowalski «Ковальский», pan doktor «доктор». Опустить его — невежливо." }
collocations:
  - { pl: "proszę pana", ru: "простите (обращение к мужчине; букв. «прошу пана»)" }
  - { pl: "pan młody", ru: "жених" }
  - { pl: "szanowni państwo", ru: "уважаемые дамы и господа" }
etymology: "Праславянское *gъpanъ «властитель»; отсюда же чешское pán. Русского прямого соответствия нет — «пан» заимствовано из польского."
memory: "pan — это и «Вы» к мужчине, и «господин». Глагол после него идёт в третьем лице: Czy pan mówi po polsku? И различайте омонимы: panie может быть звательным от pan («господин!») и множественным от pani («дамы»)."
idioms:
  - { pl: "pan młody", ru: "жених" }
  - { pl: "proszę pana", ru: "простите (обращение к мужчине; букв. «прошу пана»)" }
  - { pl: "jak pan Bóg przykazał", ru: "как Бог велел" }
