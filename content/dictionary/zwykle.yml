# review
id: zwykle
format: 2
lemma: "zwykle"
rank: 956
pos: adv
pron: { cyr: "зву́кле" }
senses:
  - id: usually
    ru: "обычно, как правило"
    examples:
      - pl: "Ojciec zwykle wychodzi z domu, kiedy śpię."
        ru: "Отец обычно выходит из дома, когда я сплю."
        source: { kind: tatoeba, id: 13787759 }
      - pl: "Zwykle nosi dżinsy."
        ru: "Обычно он носит джинсы."
        source: { kind: translated, id: 366207 }
      - pl: "Zwykle wstaję o siódmej."
        ru: "Обычно я встаю в семь."
        source: { kind: authored }
  - id: as-usual
    ru: "jak zwykle — как обычно"
    note: "Готовый оборот, очень частый в разговоре."
    examples:
      - pl: "A ty jak zwykle robisz z muchy słonia."
        ru: "А ты, как обычно, делаешь из мухи слона."
        source: { kind: tatoeba, id: 8617779 }
      - pl: "Spóźnił się, jak zwykle."
        ru: "Он опоздал, как обычно."
        source: { kind: authored }
      - pl: "Jak zwykle wszystko zostawił na ostatnią chwilę."
        ru: "Как обычно, он всё оставил на последнюю минуту."
        source: { kind: authored }
notes:
  - { kind: usage, text: "jak zwykle — «как обычно», самый частый оборот со словом: Spóźnił się, jak zwykle." }
  - { kind: usage, text: "Синоним — zazwyczaj, значение то же, но звучит чуть книжнее. Оба отвечают русскому «обычно»." }
  - { kind: false-friend, text: "Не путайте наречия zwykle «обычно» и zwyczajnie «просто, обыкновенно». Первое говорит о частоте, второе — о способе: Zwyczajnie się bał «Он просто боялся»." }
  - { kind: usage, text: "Оборот najzwyklej w świecie значит «самым обыкновенным образом, проще простого»: Zrobił to najzwyklej w świecie." }
collocations:
  - { pl: "jak zwykle", ru: "как обычно" }
  - { pl: "zwykle wstaję", ru: "обычно я встаю" }
  - { pl: "zazwyczaj", ru: "обычно" }
  - { pl: "najzwyklej w świecie", ru: "проще простого" }
family:
  - { pl: "zwykły", ru: "обычный", relation: root, id: zwykly }
  - { pl: "zwyczaj", ru: "обычай", relation: root }
etymology: "Наречие от zwykły «обычный», от zwyczaj «обычай». Русское «обычно» собрано так же — от «обычая»."
memory: "zwykle — «обычно», слово на каждый день. Запомните оборот jak zwykle «как обычно» и синоним zazwyczaj. И не путайте с zwyczajnie: zwykle говорит о частоте («обычно делаю»), а zwyczajnie о способе («просто, без затей»)."
idioms:
