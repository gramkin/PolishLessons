# review
id: przewrocic
format: 2
lemma: "przewrócić"
rank: 4856
pos: verb
pron: { cyr: "пшэвру́циць" }
senses:
  - id: knock-over
    ru: "опрокинуть, перевернуть, повалить"
    examples:
      - pl: "Kot przewrócił wazon."
        ru: "Кот опрокинул вазу."
        source: { kind: authored }
      - pl: "Wiatr przewrócił drzewo na drogę."
        ru: "Ветер повалил дерево на дорогу."
        source: { kind: authored }
      - pl: "Przewróć naleśnik na drugą stronę."
        ru: "Переверни блин на другую сторону."
        source: { kind: authored }
  - id: fall
    ru: "упасть, перевернуться (przewrócić się)"
    examples:
      - pl: "Przewróciłem się na lodzie."
        ru: "Я упал на льду."
        source: { kind: authored }
      - pl: "Łódka przewróciła się do góry dnem."
        ru: "Лодка перевернулась вверх дном."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "PRZEWRÓCIĆ — не «превратить»: превратить — ZAMIENIĆ, PRZEMIENIĆ. PRZEWRÓCIĆ — «опрокинуть, перевернуть»: PRZEWRÓCIĆ KRZESŁO, PRZEWRÓCIĆ STRONĘ. Возвратное PRZEWRÓCIĆ SIĘ — обычное «упасть» о человеке: PRZEWRÓCIŁ SIĘ NA ROWERZE. Переворот в политике — PRZEWRÓT." }
  - { kind: usage, text: "Пятьдесят три формы — подпись переходного глагола совершенного вида: страдательное PRZEWRÓCONY, «опрокинутый», и деепричастие PRZEWRÓCIWSZY. Повелительное PRZEWRÓĆ. Видовой партнёр — PRZEWRACAĆ: PRZEWRACAĆ OCZAMI, «закатывать глаза». Ó → A в несовершенном." }
  - { kind: government, text: "Что — винительный: PRZEWRÓCIĆ KUBEK. На что — NA с винительным: NA BOK, NA PLECY, NA DRUGĄ STRONĘ. Упасть обо что — PRZEWRÓCIĆ SIĘ O с винительным: O KRAWĘŻNIK, O KAMIEŃ." }
  - { kind: pronunciation, text: "Читается «пшэвру́циць», три слога, ударение на предпоследнем. PRZE — «пшэ», Ó — «у»: «вру», CI — «ци», конечное Ć — «ць». PRZEWRÓĆ — «пшэ́вруць»." }
  - { kind: register, text: "Нейтральный бытовой глагол. Устойчивые: PRZEWRÓCIĆ COŚ DO GÓRY NOGAMI, «перевернуть вверх дном», PRZEWRÓCIĆ KOMUŚ W GŁOWIE, «вскружить голову», PRZEWRÓCIĆ OCZAMI, «закатить глаза»." }
collocations:
  - { pl: "przewrócić się na lodzie", ru: "упасть на льду" }
  - { pl: "przewrócić do góry nogami", ru: "перевернуть вверх дном" }
  - { pl: "przewrócić stronę", ru: "перевернуть страницу" }
family:
  - { pl: "przewracać", ru: "опрокидывать, переворачивать", relation: aspect }
  - { pl: "wrócić", ru: "вернуться", relation: root, id: wrocic }
  - { pl: "przewrót", ru: "переворот", relation: derived }
etymology: "Приставка PRZE- «пере-» плюс WRÓCIĆ, от праславянского *vortiti «вертеть, поворачивать», того же корня, что русское «воротить», «переворот», «превратный». Буквально «переворотить»."
memory: "Przewrócić — опрокинуть: kot przewrócił wazon. Przewrócić się — упасть: przewróciłem się na lodzie. Не «превратить»! Do góry nogami — вверх дном. Читается «пшэвру́циць»."
idioms:
  - { pl: "przewrócić coś do góry nogami", ru: "перевернуть что-то вверх дном" }
