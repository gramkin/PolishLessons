# review
id: tragiczny
format: 2
lemma: "tragiczny"
rank: 4199
pos: adj
pron: { cyr: "траги́чны" }
senses:
  - id: tragic
    ru: "трагический, трагичный"
    examples:
      - pl: "Zginął w tragicznym wypadku."
        ru: "Он погиб в трагической аварии."
        source: { kind: authored }
      - pl: "To tragiczna historia miłosna."
        ru: "Это трагическая история любви."
        source: { kind: authored }
      - pl: "To był najtragiczniejszy dzień w historii miasta."
        ru: "Это был самый трагический день в истории города."
        source: { kind: authored }
  - id: terrible
    ru: "разг. ужасный, кошмарный (о качестве)"
    examples:
      - pl: "Ten film jest tragiczny, wyszedłem w połowie."
        ru: "Этот фильм ужасный, я ушёл на середине."
        source: { kind: authored }
      - pl: "Moja znajomość niemieckiego jest tragiczna."
        ru: "Мой немецкий просто ужасен."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "В прямом значении польское TRAGICZNY совпадает с русским «трагический». Но в разговоре поляк употребляет его как «ужасный, никуда не годный»: TRAGICZNA POGODA, TRAGICZNY OBIAD, ON GRA TRAGICZNIE. Русский о плохом обеде «трагический» не скажет, а польское слово тут обычное и почти не драматичное." }
  - { kind: usage, text: "Полная парадигма: TRAGICZNY, TRAGICZNIEJSZY, NAJTRAGICZNIEJSZY. Простые степени живые: TRAGICZNIEJSZE SKUTKI, NAJTRAGICZNIEJSZY DZIEŃ. Форма для мужчин-людей: TRAGICZNI, TRAGICZNIEJSI, NAJTRAGICZNIEJSI — о героях, игроках, исполнителях." }
  - { kind: government, text: "Трагический для кого-то — TRAGICZNY DLA KOGOŚ, DLA с родительным. В сравнении — NIŻ или OD с родительным. Само прилагательное падежа не требует." }
  - { kind: pronunciation, text: "Читается «траги́чны», три слога, ударение на предпоследнем. GI — мягкое «ги», CZ — «ч». В TRAGICZNIEJSZY: «трагичне́йшы»." }
  - { kind: register, text: "В прямом значении — книжное и газетное: TRAGICZNY WYPADEK — стандарт новостей. В разговорном «ужасный» — очень частое и чуть ироничное: JAK BYŁO NA EGZAMINIE? TRAGICZNIE!" }
collocations:
  - { pl: "tragiczny wypadek", ru: "трагическая авария" }
  - { pl: "tragiczna śmierć", ru: "трагическая смерть" }
  - { pl: "tragiczne skutki", ru: "трагические последствия" }
family:
  - { pl: "tragedia", ru: "трагедия", relation: root, id: tragedia }
  - { pl: "tragicznie", ru: "трагически; ужасно", relation: derived }
  - { pl: "dramatyczny", ru: "драматический", relation: root }
etymology: "Из греческого tragikós, от tragōidía, «трагедия», буквально «песнь козлов», по обряду с козлиной шкурой. Польское -ICZNY на месте русского -ическ-, как обычно. Разговорное «ужасный» польский развил сам, как и русское «кошмарный» из «кошмар»."
memory: "Tragiczny — трагический: tragiczny wypadek. И разг. «ужасный»: tragiczny film, moja niemiecka jest tragiczna. Tragiczniejszy, najtragiczniejszy. Читается «траги́чны»."
idioms:
  - { pl: "nic tragicznego", ru: "ничего страшного" }
