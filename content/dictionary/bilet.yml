# review
id: bilet
format: 2
lemma: "bilet"
rank: 1144
pos: noun
pron: { cyr: "би́лет" }
senses:
  - id: ticket
    ru: "билет"
    examples:
      - pl: "Dostałem bilet za darmo."
        ru: "Билет достался мне бесплатно."
        source: { kind: tatoeba, id: 416252 }
      - pl: "Kupiłem bilet tam i z powrotem."
        ru: "Я купил билет туда-обратно."
        source: { kind: tatoeba, id: 999356 }
      - pl: "Mam twoje bilety."
        ru: "Твои билеты у меня."
        source: { kind: tatoeba, id: 5528890 }
  - id: price
    ru: "цена билета"
    examples:
      - pl: "Jaka jest cena biletu?"
        ru: "Какая цена билета?"
        source: { kind: translated, id: 3954752 }
      - pl: "Ile kosztowały bilety?"
        ru: "Сколько стоили билеты?"
        source: { kind: tatoeba, id: 3630972 }
  - id: none
    ru: "без билета, билетов нет"
    examples:
      - pl: "Już nie ma biletów."
        ru: "Билетов больше нет."
        source: { kind: translated, id: 7180333 }
      - pl: "Nie mam biletu."
        ru: "У меня нет билета."
        source: { kind: translated, id: 353181 }
notes:
  - { kind: usage, text: "Мужской род неодушевлённый: ten bilet, tego biletu, te bilety." }
  - { kind: usage, text: "bilet w jedną stronę «билет в один конец», bilet powrotny «обратный билет», bilet ulgowy «льготный билет»." }
  - { kind: usage, text: "Ехать без билета — jechać na gapę, буквально «ехать зевакой». Слова вроде русского «зайцем» тут нет." }
  - { kind: usage, text: "wilczy bilet «волчий билет» — о документе, закрывающем дорогу к работе или учёбе; оборот совпадает с русским." }
collocations:
  - { pl: "kupić bilet", ru: "купить билет" }
  - { pl: "bilet powrotny", ru: "обратный билет" }
  - { pl: "bilet w jedną stronę", ru: "билет в один конец" }
  - { pl: "cena biletu", ru: "цена билета" }
family:
  - { pl: "biletowy", ru: "билетный", relation: derived }
  - { pl: "bileter", ru: "билетёр", relation: derived }
etymology: "Через французское billet «записка, билет» из средневекового латинского bulletta. Русский «билет» — то же заимствование."
memory: "bilet — «билет», мужской род. Обратный билет — bilet powrotny, в один конец — w jedną stronę. А ехать без билета будет jechać na gapę, буквально «ехать зевакой»."
idioms:
