# review
id: naboj
format: 2
lemma: "nabój"
rank: 4208
pos: noun
pron: { cyr: "на́буй" }
senses:
  - id: cartridge
    ru: "патрон"
    examples:
      - pl: "Załadował nabój do strzelby."
        ru: "Он зарядил патрон в ружьё."
        source: { kind: authored }
      - pl: "Zostały mu tylko dwa naboje."
        ru: "У него осталось всего два патрона."
        source: { kind: authored }
      - pl: "Zgubiony nabój leżał na ziemi."
        ru: "Потерянный патрон лежал на земле."
        source: { kind: authored }
  - id: refill
    ru: "картридж, баллончик (для ручки, сифона)"
    examples:
      - pl: "Wymień nabój w piórze."
        ru: "Поменяй картридж в перьевой ручке."
        source: { kind: authored }
      - pl: "Kup naboje do syfonu."
        ru: "Купи баллончики для сифона."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "NABÓJ — «патрон», а не «набой» и не «набег». Пуля — KULA или POCISK, гильза — ŁUSKA. Картридж для перьевой ручки — тоже NABÓJ, а для принтера — TUSZ или KARTRIDŻ." }
  - { kind: usage, text: "Мужской род, неодушевлённое. Ó чередуется с O: NABÓJ, но NABOJU, NABOJE. Родительный множественного — NABOI; вариант NABOJÓW встречается реже." }
  - { kind: government, text: "Зарядить патрон — ZAŁADOWAĆ NABÓJ, винительный. Без патронов — BEZ NABOI, родительный. Пачка патронов — PACZKA NABOI." }
  - { kind: pronunciation, text: "Читается «на́буй»: Ó — «у», J на конце — «й». Ударение на первом слоге. NABOJU — «набо́ю»." }
collocations:
  - { pl: "ostry nabój", ru: "боевой патрон" }
  - { pl: "ślepy nabój", ru: "холостой патрон" }
  - { pl: "nabój do pióra", ru: "картридж для ручки" }
family:
  - { pl: "kula", ru: "пуля", relation: root, id: kula }
  - { pl: "amunicja", ru: "боеприпасы", relation: root, id: amunicja }
  - { pl: "pistolet", ru: "пистолет", relation: root, id: pistolet }
etymology: "От NABIJAĆ «набивать, заряжать», корень BIĆ «бить», как в русском «набивать», «бой»."
memory: "Nabój — патрон и картридж для ручки. Ślepy nabój — холостой патрон. Bez naboi — без патронов. Читается «на́буй»."
idioms:
  - { pl: "ślepy nabój", ru: "холостой выстрел, пустая угроза" }
formExamplesSkip:
  - { form: "nabojów", reason: "вариант родительного множественного, учим NABOI" }
  - { form: "naboju", cell: "Звательный", reason: "звательный падеж: для неодушевлённого существительного он практически не употребляется" }
