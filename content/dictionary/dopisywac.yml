# review
id: dopisywac
format: 2
lemma: "dopisywać"
rank: 2370
pos: verb
aspect: imperf
pron: { cyr: "дописы́ваць" }
senses:
  - id: add-in-writing
    ru: "дописывать, приписывать"
    examples:
      - pl: "Dopisywał uwagi na marginesie."
        ru: "Он дописывал замечания на полях."
        source: { kind: authored }
      - pl: "Nie dopisuj nic od siebie."
        ru: "Не приписывай ничего от себя."
        source: { kind: authored }
      - pl: "Dopisywała nazwiska do listy."
        ru: "Она дописывала фамилии в список."
        source: { kind: authored }
  - id: hold-up
    ru: "быть в порядке (о здоровье, погоде, удаче)"
    examples:
      - pl: "Zdrowie mi dopisuje."
        ru: "Здоровье у меня в порядке."
        source: { kind: authored }
      - pl: "Pogoda nie dopisywała."
        ru: "Погода не задалась."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Второе значение неожиданное и очень частое: dopisuje значит «не подводит». Zdrowie dopisuje «здоровье не подводит», humor dopisuje «настроение хорошее», szczęście nie dopisało «удача не улыбнулась»." }
  - { kind: government, text: "В этом обороте подлежащее — то, что не подводит, а человек стоит в ДАТЕЛЬНОМ: zdrowie MI dopisuje." }
  - { kind: false-friend, text: "do- + pisywać от pisać «писать», которое уже есть в словаре. Первое значение прозрачно, второе — идиоматическое." }
  - { kind: usage, text: "Совершенный вид — dopisać. В корпусе глагол не встречается, поэтому все примеры составлены вручную." }
collocations:
  - { pl: "zdrowie dopisuje", ru: "здоровье не подводит" }
  - { pl: "pogoda dopisała", ru: "погода задалась" }
etymology: "do- + pisywać от pisać «писать»."
memory: "dopisywać — «дописывать», но запомните идиому: zdrowie dopisuje «здоровье не подводит», pogoda dopisała «погода задалась». Человек в ней стоит в дательном."
idioms:
  - { pl: "zdrowie dopisuje", ru: "здоровье не подводит" }
