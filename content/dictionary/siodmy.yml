etymology: "От SIEDEM «семь», из праславянского *sedmь, и порядковое *sedmъjь дало польское SIÓDMY. Гласная ó на месте ожидаемого e объясняется старым удлинением перед сочетанием согласных с последующим слогом: *sedm- дало siódm-, где долгое o затем перешло в ó и стало читаться как «у». Русское «седьмой» того же корня и той же модели, но удлинения не получило, поэтому сохранило е. Отсюда и вся разница: один корень, одно числительное, а гласные в нём разошлись по звуковым законам каждого языка. Тот же сдвиг виден в паре SIEDEM и SIÓDMY внутри самого польского."
memory: "Порядковое к siedem, склоняется как прилагательное. Читается «сю́дмы»: si — мягкое «сь», ó — это «у». Дата в родительном: siódmego marca. И на седьмом небе по-польски W siódmym niebie, с предлогом w."
idioms:
