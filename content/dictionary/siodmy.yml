notes:
  - { kind: usage, text: "Порядковое числительное, и склоняется оно как обычное прилагательное: SIÓDMY DZIEŃ, SIÓDMEGO DNIA, SIÓDMEMU. Главное, что стоит запомнить, — дата. По-польски число месяца ставится в родительном падеже: SIÓDMEGO MARCA «седьмого марта», и так же в ответе на вопрос KTÓREGO? Русский поступает точно так же, «седьмого марта», поэтому перенос прямой и ошибок тут почти не бывает. Женская форма SIÓDMA отдельно нужна для часов: GODZINA SIÓDMA, O SIÓDMEJ «в семь», и для дробей, JEDNA SIÓDMA «одна седьмая»." }
  - { kind: pronunciation, text: "Читается «сю́дмы», в два слога, ударение на первом. Сочетание si перед гласной — это мягкое «сь», которое сливается с гласной: SIÓ звучит как «сю», а не «сио». Буква ó даёт «у», как всегда в польском, поэтому не «сёдмы» и не «сиодмы», а именно «сю́дмы». В форме SIÓDMEGO — «сю́дмэго», ударение остаётся на первом слоге, потому что слогов стало три и предпоследний это DME." }
  - { kind: false-friend, text: "Ложным другом слово не назовёшь, но написание сбивает. Русское «седьмой» имеет в корне е и мягкий знак, польское SIÓDMY — ó и никакого мягкого знака: мягкость передана самой буквой i в сочетании SI. То есть русское «сь» в «седьмой» и польское SI в SIÓDMY — это одно и то же решение, записанное разными средствами. Сравните SIEDEM «семь» и «семь»: там польский пишет IE, где русский ставит е." }
  - { kind: government, text: "Числительное согласуется с существительным в роде, числе и падеже, как прилагательное, и своего управления не имеет. Устойчивые сочетания с ним стоит заучивать целиком, потому что падеж в них неочевиден: NA SIÓDMYM PIĘTRZE «на седьмом этаже» с предложным, SIÓDMEGO MARCA «седьмого марта» с родительным, W SIÓDMYM NIEBIE «на седьмом небе» — заметьте, по-польски предлог W, а по-русски «на»." }
