notes:
  - { kind: usage, text: "Слово собрано из польских частей и разбирается насквозь: NASTO- взято из числительных на -NAŚCIE, то есть от JEDENAŚCIE до DZIEWIĘTNAŚCIE, плюс корень LAT- «год». Буквально это «тот, кому лет на -надцать», и способ счёта здесь ровно тот же, что в английском TEENAGER. Русский построил своё слово иначе, от «подрасти»: «подросток» есть тот, кто подрос, то есть измеряет не годы, а рост. Поэтому польское слово точнее по возрасту: NASTOLATEK — это строго от одиннадцати до девятнадцати, а «подросток» растягивается шире. Женская форма — NASTOLATKA." }
  - { kind: government, text: "Существительное мужского рода одушевлённое, мужско-личного разряда. Винительный единственного равен родительному: WIDZĘ NASTOLATKA. Именительный множественного — NASTOLATKOWIE, с окончанием -OWIE, которое в польском обычно у названий родства и уважаемых лиц: OJCOWIE, PROFESOROWIE. Форма NASTOLATKI для людей неправильна. Адресат вводится предлогом DLA с родительным: DLA NASTOLATKÓW «для подростков», или DO с родительным, когда речь о направленности: PROGRAM DO NASTOLATKÓW звучит хуже, чем ADRESOWANY DO NASTOLATKÓW." }
  - { kind: pronunciation, text: "Читается «настола́тэк», ударение на предпоследнем слоге. Беглая гласная E выпадает во всех косвенных падежах: NASTOLATEK, но NASTOLATKA, NASTOLATKOWI, NASTOLATKIEM. Из-за этого ударение переезжает на другой слог, оставаясь предпоследним: «настола́тэк», но «настола́тка». Это та же механика, что в WYSIŁEK и WYSIŁKU. Сочетание KIE в NASTOLATKIEM даёт мягкое «ке»." }
  - { kind: register, text: "Слово нейтральное и современное, вошло в язык во второй половине двадцатого века как калька английского. В официальных документах предпочитают MŁODZIEŻ «молодёжь» или OSOBA NIEPEŁNOLETNIA «несовершеннолетний», а NASTOLATEK живёт в прессе, в разговоре и в педагогической литературе. Разговорные синонимы — MŁODY, а с оттенком пренебрежения MAŁOLAT, буквально «малолеток», и вот это слово уже обидное, в отличие от NASTOLATEK." }
