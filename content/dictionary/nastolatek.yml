etymology: "Слово молодое, двадцатого века, и построено как калька английского TEENAGER, но целиком из польского материала. Основа NASTO- вычленена из числительных на -NAŚCIE, которые сами происходят из сочетания NA DZIESIĄTE «на десятом», то есть «один на десять», «два на десять» — та же конструкция, что в русских «одиннадцать», «двенадцать», где «-надцать» есть «на десять». Вторая часть — LATO в старом значении «год», откуда LATA «годы» и русские «лет», «летний» в смысле возраста. Так что буквально NASTOLATEK — «надцатилетний», и русский мог бы построить такое же слово, но предпочёл «подростка» от «подрасти». Образы разные: польский считает годы, русский измеряет рост."
memory: "nasto- из числительных на -naście плюс lat: буквально «надцатилетний», как английское teenager. Русский «подросток» измеряет рост, а не годы, и потому растяжимее: nastolatek — строго от одиннадцати до девятнадцати. Множественное nastolatkowie, не nastolatki. Беглое e выпадает: nastolatka, nastolatkiem."
