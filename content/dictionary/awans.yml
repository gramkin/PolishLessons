etymology: "Из французского AVANCE «продвижение вперёд», от AVANCER, а то от позднелатинского ABANTIARE, из AB ANTE «вперёд». Русский «аванс» взят из того же французского слова и в то же время, но языки выбрали разные стороны его значения: польский — продвижение человека по службе, русский — продвижение денег, выплату вперёд. Французское AVANCE покрывает оба смысла, так что ни один язык не ошибся, просто каждый взял своё. Для денежного значения польский построил ZALICZKA, от ZALICZYĆ «зачесть», и образ там другой: не выданное вперёд, а зачтённое в счёт будущего. Корень AB ANTE виден и в словах AWANGARDA и «авангард», буквально «передовая стража»."
memory: "Повышение в должности, а не «аванс»: русский аванс по-польски zaliczka. Оба от французского avance «продвижение вперёд», но польский взял продвижение человека, русский — продвижение денег. Ударение тоже расходится: а́ванс на первом слоге против русского ава́нс. Местный awansie. В спорте означает выход в следующий этап: awans do finału. Глагол awansować спрягается на -uj-: awansuję."
