notes:
  - { kind: false-friend, text: "Один из самых опасных ложных друзей в деловом языке. Польское AWANS значит «повышение в должности», и только это; русский «аванс» — предварительная выплата, часть денег вперёд. По-польски предварительная выплата называется ZALICZKA, а часть зарплаты вперёд — ZALICZKA NA WYNAGRODZENIE. Поэтому DOSTAŁ AWANS это «он получил повышение», а не «он получил аванс», и ошибка в рабочем разговоре выйдет дорого. Оба слова идут от французского AVANCE «продвижение вперёд», и разошлись уже внутри каждого языка: польский взял продвижение по службе, русский — продвижение денег." }
  - { kind: government, text: "Мужской род, неодушевлённое. Винительный равен именительному: DOSTAĆ AWANS. Родительный на -U: BEZ AWANSU. Местный AWANSIE, где S смягчается перед -IE. Куда повышают — предлог NA с винительным: AWANS NA STANOWISKO DYREKTORA. Куда переходят в спорте — предлог DO с родительным: AWANS DO FINAŁU, AWANS DO PIERWSZEJ LIGI. Родительный множественного AWANSÓW. Глагол того же корня, AWANSOWAĆ, принадлежит классу на -OWAĆ и спрягается с основой на -UJ-: AWANSUJĘ." }
  - { kind: pronunciation, text: "Читается «а́ванс», ударение на предпоследнем слоге из двух, то есть на первом — и здесь польский расходится с русским «аванс», где ударение на втором. Буква W даёт «в». Конечное S звучит ясно, без озвончения. В местном падеже AWANSIE сочетание SIE даёт мягкое «се»: «ава́нсе», три слога, и ударение переходит на предпоследний. В родительном множественного AWANSÓW буква Ó даёт «у», конечное W оглушается: «ава́нсуф»." }
  - { kind: usage, text: "Частотные сочетания: DOSTAĆ AWANS, AWANS NA STANOWISKO, SZANSA NA AWANS «шанс на повышение», AWANS SPOŁECZNY «социальное продвижение», AWANS DO FINAŁU. В спортивных текстах слово встречается постоянно и означает выход в следующий этап. Глагол AWANSOWAĆ переходен и непереходен сразу: AWANSOWAŁ NA KIEROWNIKA «он получил повышение до руководителя» и AWANSOWANO GO «его повысили». Прилагательное AWANSOWY употребляется редко; для «авансовый платёж» по-польски говорят PŁATNOŚĆ ZALICZKOWA." }
