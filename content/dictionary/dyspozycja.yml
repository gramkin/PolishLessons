# review
id: dyspozycja
format: 2
lemma: "dyspozycja"
rank: 5387
pos: noun
pron: { cyr: "дыспозы́цья" }
senses:
  - id: disposal
    ru: "распоряжение (DO DYSPOZYCJI — в распоряжении)"
    examples:
      - pl: "Jestem do twojej dyspozycji."
        ru: "Я в твоём распоряжении."
        source: { kind: authored }
      - pl: "Mamy do dyspozycji trzy samochody."
        ru: "В нашем распоряжении три машины."
        source: { kind: authored }
      - pl: "Pokój jest do dyspozycji gości."
        ru: "Комната в распоряжении гостей."
        source: { kind: authored }
  - id: instruction
    ru: "распоряжение, указание (банк., офиц.); форма (спорт.)"
    examples:
      - pl: "Bank wykonał dyspozycję przelewu."
        ru: "Банк выполнил поручение на перевод."
        source: { kind: authored }
      - pl: "Zawodnik jest w dobrej dyspozycji."
        ru: "Спортсмен в хорошей форме."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "DYSPOZYCJA — главное выражение DO DYSPOZYCJI, «в распоряжении». В банке — «поручение», в спорте — «форма»: DYSPOZYCJA DNIA, «форма в день соревнований». Расположение войск, «диспозиция» — тоже DYSPOZYCJA, но редко." }
  - { kind: usage, text: "Женский род. Родительный, дательный и местный — DYSPOZYCJI. Множественное — DYSPOZYCJE. Звательный и архаичное DYSPOZYCYJ не используем." }
  - { kind: government, text: "В распоряжении кого — DO DYSPOZYCJI и родительный. Отдать в распоряжение — ODDAĆ DO DYSPOZYCJI. Поручение на что — DYSPOZYCJA и родительный: DYSPOZYCJA PRZELEWU." }
  - { kind: pronunciation, text: "Читается «дыспозы́цья»: DY — «ды», ZY — «зы», CJA — «цья». Ударение на предпоследнем слоге." }
collocations:
  - { pl: "do dyspozycji", ru: "в распоряжении" }
  - { pl: "dyspozycja przelewu", ru: "поручение на перевод" }
  - { pl: "dyspozycja dnia", ru: "форма в данный день" }
family:
  - { pl: "dysponować", ru: "располагать, распоряжаться", relation: derived }
  - { pl: "polecenie", ru: "поручение", relation: root, id: polecenie }
  - { pl: "forma", ru: "форма", relation: root, id: forma }
etymology: "Из латинского DISPOSITIO «расположение, распоряжение», от DISPONERE «располагать». Русское «диспозиция» — то же слово."
memory: "Dyspozycja — do dyspozycji: в распоряжении; в банке — поручение, в спорте — форма. Читается «дыспозы́цья»."
idioms:
