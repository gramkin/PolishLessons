family:
  - { pl: "miły", ru: "милый, приятный", relation: root }
  - { pl: "miło", ru: "мило, приятно", relation: derived }
etymology: "Безличный оборот с наречием miło «мило, приятно» от miły «милый» — праславянского слова, совпадающего с русским «милый», — и дательным падежом лица. Русское «мне приятно» устроено точно так же."
memory: "miło mi — «мне приятно», а не «я милый»: лицо стоит в дательном (mi, nam), а miło — наречие. При знакомстве это готовая формула, как русское «очень приятно»."
idioms:
  - { pl: "miło mi", ru: "очень приятно" }
