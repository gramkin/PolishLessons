notes:
  - { kind: usage, text: "Готовая формула знакомства — ответная реплика на представление. Полный вариант: miło mi pana poznać." }
  - { kind: usage, text: "Буквально «мне мило»: безличный оборот, в котором человек стоит в дательном падеже, а не в именительном." }
  - { kind: government, text: "Дательный падеж лица: miło mi, miło nam, miło jej. Сказать jestem miły в этом смысле нельзя — выйдет «я милый»." }
  - { kind: false-friend, text: "miły значит «милый, приятный», но miło mi — именно «мне приятно», а не «я мил»." }
collocations:
  - { pl: "miło mi", ru: "очень приятно" }
