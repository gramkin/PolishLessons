# review
id: przesluchac
format: 2
lemma: "przesłuchać"
rank: 1880
pos: verb
aspect: perf
pron: { cyr: "пшэсуу́хаць" }
senses:
  - id: interrogate
    ru: "допросить"
    examples:
      - pl: "Policja przesłuchała Toma."
        ru: "Полиция допросила Тома."
        source: { kind: translated, id: 8428330 }
      - pl: "Sami został przesłuchany przez policję."
        ru: "Сами был допрошен полицией."
        source: { kind: translated, id: 6669518 }
      - pl: "Chcą przesłuchać świadka."
        ru: "Они хотят допросить свидетеля."
        source: { kind: authored }
  - id: listen-through
    ru: "прослушать (запись, пластинку)"
    examples:
      - pl: "Przesłuchaj płytę jeszcze raz, a potem powiedz, czy ci się podobała."
        ru: "Прослушай пластинку ещё раз, а потом скажи, понравилась ли она тебе."
        source: { kind: translated, id: 5914418 }
      - pl: "Muszę przesłuchać całe nagranie."
        ru: "Мне нужно прослушать всю запись."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Два значения, которые русский разводит: przesłuchać kogoś «допросить кого-то» и przesłuchać coś «прослушать что-то» целиком. Решает падеж и контекст." }
  - { kind: government, text: "Допросить кого-то — przesłuchać kogoś (винительный падеж): policja przesłuchała Toma." }
  - { kind: usage, text: "Существительное przesłuchanie значит и «допрос», и «прослушивание, кастинг»: zatrzymany na przesłuchanie «задержан для допроса»." }
  - { kind: usage, text: "Совершенный вид; несовершенный — przesłuchiwać. Корпус даёт слово скупо, поэтому часть примеров составлена." }
collocations:
  - { pl: "przesłuchać świadka", ru: "допросить свидетеля" }
  - { pl: "przesłuchanie na policji", ru: "допрос в полиции" }
  - { pl: "przesłuchać nagranie", ru: "прослушать запись" }
family:
  - { pl: "słuchać", ru: "слушать", relation: root, id: sluchac }
  - { pl: "przesłuchanie", ru: "допрос, прослушивание", relation: root }
  - { pl: "policja", ru: "полиция", relation: root, id: policja }
etymology: "Приставка prze- «пере-, про-» плюс słuchać «слушать»: прослушать насквозь. Значение «допросить» развилось из «выслушать показания»."
memory: "przesłuchać — и «допросить» (policja przesłuchała Toma), и «прослушать» целиком (przesłuchaj płytę). Существительное przesłuchanie значит и допрос, и кастинг."
idioms:
