notes:
  - { kind: false-friend, text: "В ПОЛЬШЕ ГУБЕРНАТОРОВ НЕТ — И ЭТО ГЛАВНОЕ. Слово употребляют о чужих странах: gubernator stanu Teksas, gubernator kolonii. Польский воевода, глава региона, называется WOJEWODA, и переводить его словом «губернатор» неверно. В русском языке губернатор свой, поэтому перенести слово напрямую не выходит." }
  - { kind: pronunciation, text: "ДВА СМЯГЧЕНИЯ R НА RZ, И ОБА В ОДНОМ СЛОВЕ. Предложный даёт gubernatorze, а мужско-личное множественное — gubernatorzy. Это восьмой случай перехода r в rz в словаре, после aktorze, rozmiarze, spacerze, garniturze, telewizorze, emeryturze и temperaturze. Rz читается как ж." }
  - { kind: usage, text: "Винительный как у всех мужско-личных совпадает с родительным: wybrali gubernatora, znają gubernatorów. Прилагательное gubernatorski, область — gubernia, слово историческое и в современной Польше не употребляемое. Женская форма gubernator или gubernatorka, в зависимости от издания." }
collocations:
  - { pl: "gubernator stanu", ru: "губернатор штата" }
  - { pl: "gubernator kolonii", ru: "губернатор колонии" }
  - { pl: "wybory na gubernatora", ru: "выборы губернатора" }
family:
  - { pl: "wojewoda", ru: "воевода (глава воеводства)", relation: antonym }
  - { pl: "gubernia", ru: "губерния", relation: derived }
  - { pl: "rządzić", ru: "править", relation: root, id: rzadzic }
etymology: "Из латинского gubernator «кормчий, правитель», от gubernare «править рулём», а то — из греческого kybernan, от которого и «кибернетика». Правитель назван рулевым государства. В русский и в польский слово пришло через западные языки, но прижилось по-разному: в России это своя должность, в Польше — чужая."
memory: "gubernator — «губернатор», но только ЧУЖОЙ: в Польше глава региона это wojewoda. Слово латинское и значит «кормчий». Два смягчения r в rz: w gubernatorze и gubernatorzy."
