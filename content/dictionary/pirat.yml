notes:
  - { kind: false-friend, text: "Значение совпадает с русским «пиратом» полностью, оба языка взяли слово из греческого через латынь. Запомнить стоит два переносных сочетания, которых русский так не строит. PIRAT DROGOWY — это лихач, водитель, грубо нарушающий правила; по-русски «дорожный пират» тоже говорят, но реже, и чаще скажут «лихач». PIRAT KOMPUTEROWY — тот, кто ворует программы и записи, и здесь русский обходится словом «пират» без уточнения. В обоих случаях польский держит прилагательное обязательно, и без него слово понимается только в морском смысле." }
  - { kind: usage, text: "Десять форм, мужской род, одушевлённое лицо. Именительный множественного — PIRACI, где конечное T основы переходит в мягкое CI: это обязательное смягчение для названий лиц, то же, что в STUDENCI и в SPECJALIŚCI. Местный и звательный единственного — PIRACIE, с тем же переходом T в C. Винительный единственного равен родительному, PIRATA, как у всех одушевлённых. Родительный множественного — PIRATÓW. Рядом с соседними карточками видно весь набор: PIRACI смягчает T, LIDERZY меняет R на RZ, PORYWACZE берёт -E после шипящего." }
  - { kind: pronunciation, text: "Читается «пи́рат», два слога, ударение на первом — в отличие от русского «пира́т». Буква I в первом слоге даёт «и» и смягчает P. Конечное T глухое и твёрдое. В форме PIRATA слышно «пира́та», с ударением на втором слоге. В форме PIRACIE сочетание CIE даёт мягкое «це»: «пира́це». В форме PIRACI слышно «пира́ци». В форме PIRATÓW буква Ó читается как «у», а конечное W оглушается: «пира́туф»." }
  - { kind: register, text: "Слово нейтральное, частое в детской литературе и в газетном языке. Устойчивые сочетания: PIRAT DROGOWY, PIRAT KOMPUTEROWY, FLAGA PIRACKA «пиратский флаг», STATEK PIRACKI. Прилагательное PIRACKI употребляется и о копиях: PIRACKA PŁYTA, PIRACKIE OPROGRAMOWANIE. В детской игре BAWIĆ SIĘ W PIRATÓW — такая же формула, как BAWIĆ SIĘ W KOWBOJÓW из предыдущей карточки. Пиратство как явление называется PIRACTWO, и это слово нейтрально в обоих значениях, морском и авторском." }
