etymology: "Из греческого PEIRATES «нападающий, пытающий счастья», от глагола PEIRAN «пробовать, предпринимать», через латинское PIRATA. Исходный смысл был шире нынешнего: так называли всякого, кто искал удачи с оружием в руках на море. Оба языка получили слово через латынь книжную и морскую, поэтому совпадение полное, и расходится только ударение, которое польский по общему правилу перенёс на предпоследний слог. От того же греческого корня идёт и слово «эксперимент», через латинское EXPERIRI «испытывать»: пират и эксперимент оказываются дальней роднёй, оба от идеи пробы."
memory: "Полное совпадение с русским «пиратом», от греческого peiratēs «пытающий счастья», от peiran «пробовать» — дальний родственник слова «эксперимент». Ударение польское, на первом слоге. Главное в парадигме: именительный множественного piraci со смягчением t, и местный piracie с тем же переходом. Переносные значения требуют прилагательного: pirat drogowy это лихач, pirat komputerowy — пират авторский."
idioms:
  - { pl: "bawić się w piratów", ru: "играть в пиратов" }
