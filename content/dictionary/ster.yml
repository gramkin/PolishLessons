pos: noun
pron: { cyr: "стэр" }
senses:
  - id: helm
    ru: "руль (судна, самолёта)"
    examples:
      - pl: "Kapitan stanął przy sterze."
        ru: "Капитан встал у руля."
        source: { kind: authored }
      - pl: "Ster jachtu się zaciął."
        ru: "Руль яхты заело."
