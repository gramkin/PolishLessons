      - pl: "Od roku jest u steru partii."
        ru: "Уже год он у руля партии."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Польский STER — руль, но только у судна и самолёта. Руль автомобиля и велосипеда — KIEROWNICA. От STER идут STEROWAĆ «управлять» и STERNIK «рулевой», и неожиданное STEROWIEC — не «рулевой», а дирижабль, то есть «управляемый» аэростат." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. В местном падеже R переходит в RZ: PRZY STERZE, NA STERZE. Родительный — STERU." }
  - { kind: government, text: "У руля — U STERU, родительный после U, и в прямом, и в переносном смысле. У штурвала корабля — PRZY STERZE, местный. Взять руководство — PRZEJĄĆ STER, винительный." }
  - { kind: pronunciation, text: "Читается «стэр», один слог. E после T звучит твёрдо, «э». В местном падеже STERZE сочетание RZ даёт «ж»: «стэ́жэ»." }
  - { kind: register, text: "В переносном смысле слово книжное и газетное: BYĆ U STERU WŁADZY — «стоять у руля власти». В быту о машине так не говорят, там KIEROWNICA." }
collocations:
  - { pl: "ster jachtu", ru: "руль яхты" }
  - { pl: "ster kierunku", ru: "руль направления" }
  - { pl: "trzymać ster", ru: "держать руль" }
family:
  - { pl: "sterowac", ru: "управлять", relation: derived }
  - { pl: "sternik", ru: "рулевой", relation: derived }
  - { pl: "sterowiec", ru: "дирижабль", relation: derived }
etymology: "Из немецкого или нидерландского слова со значением «руль», того же германского корня, что английское STEER «править». В русский это слово не попало, поэтому польский STER русскому не подсказка, зато его легко запомнить через английский."
memory: "Ster — руль корабля или самолёта; руль машины — kierownica. Читается «стэр», в местном падеже przy sterze. Być u steru — быть у руля. Sterowiec — дирижабль, sternik — рулевой."
idioms:
  - { pl: "być u steru", ru: "быть у руля" }
  - { pl: "ująć ster w swoje ręce", ru: "взять руль в свои руки" }
