        ru: "Рулевой твёрдо держал руль."
        source: { kind: authored }
  - id: leadership
    ru: "руководство, власть (перен.)"
    examples:
      - pl: "Nowy prezes przejął ster firmy."
        ru: "Новый председатель взял руководство фирмой."
