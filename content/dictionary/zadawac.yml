# review
id: zadawac
format: 2
lemma: "zadawać"
rank: 1428
pos: verb
aspect: imperf
aspectPair: zadac
pron: { cyr: "зада́ваць" }
senses:
  - id: ask
    ru: "задавать (вопрос)"
    examples:
      - pl: "Nie bój się zadawać pytań."
        ru: "Не бойся задавать вопросы."
        source: { kind: tatoeba, id: 3801645 }
      - pl: "Zadajesz mnóstwo pytań."
        ru: "Ты задаёшь массу вопросов."
        source: { kind: translated, id: 3051502 }
      - pl: "On wiecznie zadaje głupie pytania."
        ru: "Он вечно задаёт глупые вопросы."
        source: { kind: tatoeba, id: 773291 }
  - id: associate
    ru: "zadawać się z kimś — водиться, знаться с кем-либо"
    examples:
      - pl: "Nie zadawaj się z nimi."
        ru: "Не водись с ними."
        source: { kind: translated, id: 358928 }
      - pl: "Nie powinieneś zadawać się z takimi ludźmi."
        ru: "Тебе не следует водиться с такими людьми."
        source: { kind: translated, id: 2212181 }
notes:
  - { kind: usage, text: "Мужско-личной формы zadawani не бывает: задают вопросы, уроки и удары, а не людей, поэтому она оставлена без примеров. Причастие живёт при вещах: zadawane pytania «задаваемые вопросы», ciosy zadawane z boku." }
  - { kind: government, text: "Задавать вопрос кому-то — zadawać pytanie komuś (дательный падеж): zadawał mu pytania." }
  - { kind: usage, text: "Возвратное zadawać się z kimś значит «водиться, знаться с кем-то» и почти всегда звучит неодобрительно: nie zadawaj się z nimi." }
  - { kind: usage, text: "Совершенный вид — zadać. Кроме вопросов задают ещё боль и удары: zadawać ból «причинять боль», zadawać cios «наносить удар»." }
  - { kind: false-friend, text: "Школьное «задавать на дом» — zadawać pracę domową; само домашнее задание называется zadanie domowe." }
collocations:
  - { pl: "zadawać pytania", ru: "задавать вопросы" }
  - { pl: "zadawać się z kimś", ru: "водиться с кем-либо" }
  - { pl: "zadawać ból", ru: "причинять боль" }
family:
  - { pl: "zadać", ru: "задать", relation: aspect, id: zadac }
  - { pl: "zadanie", ru: "задание, задача", relation: root }
  - { pl: "pytanie", ru: "вопрос", relation: root, id: pytanie }
etymology: "Приставка za- + dawać «давать» — ровно как русское «за-давать». Слова совпадают и по составу, и по значению."
memory: "zadawać — «задавать»: zadawać pytania, совершенный вид zadać. Но zadawać się z kimś — это «водиться с кем-то», обычно с неодобрением."
idioms:
  - { pl: "zadawać pytania", ru: "задавать вопросы" }
  - { pl: "nie zadawaj się z nimi", ru: "не водись с ними" }
  - { pl: "zadawać ból", ru: "причинять боль" }
formExamplesSkip:
  - { form: "zadawani", reason: "мужско-личной формы не бывает: задают вопросы, уроки и удары, а не людей" }
  - { form: "zadawania", reason: "формы отглагольного существительного, в статье глагола примеры не приводятся" }
  - { form: "zadawanie", reason: "формы отглагольного существительного, в статье глагола примеры не приводятся" }
  - { form: "zadawaniem", reason: "формы отглагольного существительного, в статье глагола примеры не приводятся" }
  - { form: "zadawaniu", reason: "формы отглагольного существительного, в статье глагола примеры не приводятся" }
