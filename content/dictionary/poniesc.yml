notes:
  - { kind: pronunciation, text: "Основа играет тремя огласовками, и все три надо держать в голове: PONIOSĘ и PONIOSĄ с -io-, PONIESIESZ и PONIESIE с -ie-, PONIEŚLI снова с -ie-, а мужское прошедшее PONIÓSŁ с -ió-. Правило простое: -ie- перед мягким согласным, -io- перед твёрдым, а -ió- в закрытом слоге перед Ł. Русский делает то же самое в «нести — несу — нёс»: там тоже е, е и ё по тем же местам, только обозначено иначе." }
  - { kind: usage, text: "Корень прямой: NIEŚĆ — «нести», и приставки совпадают почти везде: PRZYNIEŚĆ «принести», WYNIEŚĆ «вынести», ZNIEŚĆ «снести», ODNIEŚĆ «отнести», DONIEŚĆ «донести». У PONIEŚĆ же главное значение не пространственное, а то же, что у русского «понести» в «понести потери»: PONIEŚĆ KLĘSKĘ «потерпеть поражение», PONIEŚĆ KOSZTY «понести расходы», PONIEŚĆ KONSEKWENCJE «понести последствия», PONIEŚĆ ŚMIERĆ «погибнуть». Это самые частые употребления, и все они берутся из русского без переделки." }
  - { kind: government, text: "Что — винительный: PONIEŚĆ KLĘSKĘ, KOSZTY, STRATY, ODPOWIEDZIALNOŚĆ. В пространственном значении куда — предлог DO с родительным или NA с винительным: PONIEŚĆ WALIZKĘ DO SAMOCHODU, NA GÓRĘ. Отдельно стоит возвратное PONIEŚĆ SIĘ — «разнестись» о звуке: GŁOS PONIÓSŁ SIĘ PO DOLINIE." }
  - { kind: usage, text: "Свободная форма мужского рода — PONIÓSŁ. Основа poniosł- без ó живёт только в связке с окончанием (PONIOSŁEM, PONIOSŁEŚ), отдельным словом её не бывает. В условном наклонении мужского рода ó держится: PONIÓSŁBY, PONIÓSŁBYM, PONIÓSŁBYŚ — в закрытом слоге перед ŁBY так же, как перед одиночным Ł. Отметим ещё деепричастие: оно здесь PONIÓSŁSZY, с -SZY, а не -WSZY, потому что основа оканчивается на согласный." }
collocations:
