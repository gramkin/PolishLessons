etymology: "Приставка po- и NIEŚĆ, из праславянского *nesti — то же слово, что русское «нести», с тем же чередованием в основе. Соответствие полное и по корню, и по приставкам, так что всё гнездо читается напрямую: PRZYNIEŚĆ «принести», WYNIEŚĆ «вынести», ODNIEŚĆ «отнести», ZNIEŚĆ «снести». Переносное значение «потерпеть, претерпеть» тоже общее: русское «понести потери» и польское PONIEŚĆ STRATY построены из одних и тех же частей и значат одно и то же — взять на себя то, что досталось."
memory: "nieść — «нести», и приставки свои. А ponieść чаще всего не про ношу: ponieść klęskę «потерпеть поражение», ponieść koszty «понести расходы» — ровно как по-русски."
idioms:
