notes:
  - { kind: false-friend, text: "Слово тянет на себя неожиданно много. BRAMKA это уменьшительное от BRAMA «ворота», и значит сразу: калитку в саду, турникет в метро и аэропорту, футбольные ворота и сам забитый гол. По-русски на всё это четыре разных слова. И BRAMKARZ тоже двойной: это и вратарь, и охранник на входе в клуб. По-украински «брама» значит те же ворота, и родство здесь слышно." }
  - { kind: usage, text: "Десять форм, женский род. В дательном и местном падежах K переходит в C: BRAMKA, но W BRAMCE. В родительном множественного появляется беглое E: BRAMEK, и именно в этой форме считают голы: STRZELIŁ TRZY BRAMKI, PADŁO PIĘĆ BRAMEK. Так что одно и то же слово означает и ворота, и счёт." }
  - { kind: government, text: "Забить гол — STRZELIĆ BRAMKĘ, винительный без предлога, буквально «выстрелить ворота». В воротах — W BRAMCE, местный падеж. А вот «стоять в воротах» как обязанность вратаря — PILNOWAĆ BRAMKI, и здесь родительный падеж, потому что глагол PILNOWAĆ его требует: не BRAMKĘ, а BRAMKI. Эту пару стоит запомнить отдельно." }
  - { kind: pronunciation, text: "Читается «бра́мка», два слога, ударение на первом. Сочетание BR произносится слитно. Буква M перед K звучит обычным «м», без призвука. В форме BRAMCE сочетание MC даёт «мц»: «бра́мце». Слово читается ровно так, как пишется, и трудных мест в нём нет." }
  - { kind: register, text: "Слово нейтральное и очень частое. В быту это BRAMKA OGRODOWA «садовая калитка» и BRAMKA WEJŚCIOWA — турникет на входе, с картой или билетом. В спорте — вся футбольная речь: STRZELIĆ BRAMKĘ, PADŁA BRAMKA «забит гол», BRAMKARZ «вратарь». В клубе BRAMKARZ стоит у двери и решает, кого пустить." }
collocations:
  - { pl: "bramka wejściowa", ru: "входной турникет" }
  - { pl: "pilnować bramki", ru: "стоять в воротах" }
  - { pl: "bramka ogrodowa", ru: "садовая калитка" }
family:
  - { pl: "brama", ru: "ворота", relation: root, id: brama }
  - { pl: "bramkarz", ru: "вратарь; охранник на входе", relation: derived }
  - { pl: "bramkowy", ru: "воротный", relation: derived }
etymology: "Уменьшительное от BRAMA «ворота», слова, пришедшего в польский из немецкого. По-украински оно звучит «брама» и значит то же самое, так что через украинский родство видно сразу. Русский на это место поставил свои «ворота», от «ворота», то есть от поворота створки. А футбольное значение пришло позже всех: ворота на поле назвали уменьшительным от городских, и от них же пошёл счёт голов."
memory: "Уменьшительное от brama «ворота», и значит сразу четыре вещи: садовую калитку, турникет, футбольные ворота и забитый гол. Bramkarz тоже двойной — вратарь и охранник у входа в клуб. Читается «бра́мка». Забить гол — strzelic bramke, винительный. А «стоять в воротах» — pilnowac bramki, и здесь родительный, потому что так требует глагол pilnowac."
idioms:
  - { pl: "strzelić bramkę", ru: "забить гол" }
