etymology: "Приставка WY- плюс STARCZAĆ, от основы STARCZ-, которая в польском живёт только с приставками: STARCZYĆ, WYSTARCZYĆ, DOSTARCZYĆ. Прямого русского соответствия у корня нет, и это стоит знать заранее, потому что искать знакомое слово здесь бесполезно. Русский для того же понятия взял корень «хват-», от образа схватывания: хватает значит столько, сколько можно ухватить. Польский пошёл от идеи достаточной меры, доведения до нужного количества, и тот же образ работает в DOSTARCZAĆ, где мера доводится до места. Два языка назвали достаточность по-разному: русский через руку, польский через меру."
memory: "Главное — одна форма: wystarczy значит «хватит, достаточно», и это самое частое слово гнезда. Именно оно отвечает русскому «хватит», а не chwycić, с которым русскоязычный путает его по корню. Управление совпадает с русским: wystarczy mi czasu, дательный на лицо и родительный на то, чего хватает. Корень starcz- русского родственника не имеет: наше «хватать» от руки, польское от меры. Тот же корень в dostarczać «доставлять»."
idioms:
  - { pl: "wystarczy na dziś", ru: "на сегодня хватит" }
