        source: { kind: authored }
notes:
  - { kind: usage, text: "Этот глагол стоит знать прежде всего в одной форме. WYSTARCZY — «хватит, достаточно» — слышится в Польше постоянно: WYSTARCZY, DZIĘKUJĘ «достаточно, спасибо», JUŻ WYSTARCZY «уже хватит». Именно он отвечает русскому «хватит», а не глагол CHWYCIĆ, с которым русскоязычный его путает по созвучию корней. Пятьдесят две формы — подпись непереходного глагола несовершенного вида: есть действительное причастие на -ĄCY, а страдательного нет вовсе, потому что хватать можно чему-то, но нельзя «быть хватанным»." }
  - { kind: government, text: "Схема совпадает с русской до падежа, и это приятная редкость. Тот, кому хватает, идёт в дательный, а то, чего хватает, в родительный: WYSTARCZY MI CZASU — «мне хватит времени». При отрицании родительный остаётся: NIE WYSTARCZAŁO PIENIĘDZY «не хватало денег». Цель выражается предлогом NA с винительным: WYSTARCZY NA TYDZIEŃ «хватит на неделю». Есть и безличный оборот с союзом: WYSTARCZY, ŻE ZADZWONISZ «достаточно, чтобы ты позвонил»." }
  - { kind: false-friend, text: "Корень STARCZ- не имеет русского родственника, и опереться на знакомое слово не получится: русское «хватать» построено на образе схватывания рукой, а польское WYSTARCZAĆ — на образе достаточной меры. Этот же корень уже встречался в DOSTARCZAĆ «доставлять». Осторожнее с прилагательным WYSTARCZAJĄCY: оно значит «достаточный», и это причастие, ставшее прилагательным, а вовсе не «старающийся», с которым его тянет связать русское ухо." }
  - { kind: pronunciation, text: "Читается «выстарча́чь», четыре слога, ударение на предпоследнем. Первая Y звучит как «ы», поэтому начало слова «выс», а не «вис». Сочетание CZ даёт твёрдое «ч», а конечное Ć мягкое, «чь», так что в конце слышны два разных «ч». Буква R твёрдая и раскатистая. В самой нужной форме WYSTARCZY слышно «выста́рчы», с ударением на TAR и твёрдым «ы» на конце." }
  - { kind: register, text: "Слово нейтральное и очень частотное. Формула WYSTARCZY работает и как вежливый отказ в гостях, и как окрик. Частые обороты: WYSTARCZY NA DZIŚ «на сегодня хватит», TO MI WYSTARCZY «мне этого хватит», NIE WYSTARCZA MI CZASU «мне не хватает времени». Прилагательное WYSTARCZAJĄCY книжнее и живёт в документах: WYSTARCZAJĄCE ŚRODKI «достаточные средства». Видовой партнёр — WYSTARCZYĆ, и в будущем времени употребляется почти только он." }
