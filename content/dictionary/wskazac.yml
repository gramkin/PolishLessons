notes:
  - { kind: false-friend, text: "Корень KAZ- даёт по-польски целое гнездо ложных друзей, и путаница тут дорогая. KAZAĆ значит не «казать», а «ВЕЛЕТЬ, ПРИКАЗАТЬ»: KAZAŁ MI CZEKAĆ «он велел мне ждать». SKAZAĆ значит не «сказать», а «ПРИГОВОРИТЬ»: SKAZANO GO NA TRZY LATA. «Сказать» по-польски POWIEDZIEĆ, и ничего общего с этим корнем не имеет. А вот WSKAZAĆ ложится на русское «указать» точно, и POKAZAĆ — на «показать». То есть из четырёх приставочных слов два совпадают с русскими, а два значат совсем иное." }
  - { kind: pronunciation, text: "В личных формах z переходит в ż: WSKAZAĆ, но WSKAŻĘ, WSKAŻESZ, WSKAŻE, WSKAŻĄ. Это обычная мена для глаголов с основой на -z-, и она же в POKAZAĆ — POKAŻĘ. Повелительное WSKAŻ оканчивается на ż и читается «фскаш», с оглушением на конце. Начальное WS перед глухим тоже оглушается: всё слово звучит «фска́заць»." }
  - { kind: government, text: "На что или на кого — предлог NA с винительным: WSKAZAĆ NA DRZWI, NA SPRAWCĘ, NA USTERKĘ. Но при прямом дополнении предлога нет: WSKAZAĆ DROGĘ, WSKAZAĆ SPRAWCĘ, WSKAZAĆ TERMIN — и это две разные конструкции с близким смыслом, как и в русском «указать на дверь» против «указать дорогу». Кому — дательный: WSKAŻ MI DROGĘ. Чем — творительный: WSKAZAĆ PALCEM, RĘKĄ, GŁOWĄ." }
  - { kind: usage, text: "Несовершенная пара — WSKAZYWAĆ, и она нужна для показаний приборов и для общих выводов: TERMOMETR WSKAZUJE TRZYDZIEŚCI STOPNI, WSZYSTKO WSKAZUJE NA TO, ŻE… — «всё указывает на то, что…». Отсюда же существительное WSKAZÓWKA, у которого два значения: «стрелка» (часов или прибора) и «указание, подсказка». Второе встречается в инструкциях: WSKAZÓWKI DLA AUTORÓW." }
collocations:
  - { pl: "wskazać drogę", ru: "указать дорогу" }
  - { pl: "wskazać palcem", ru: "указать пальцем" }
  - { pl: "wszystko wskazuje na to, że", ru: "всё указывает на то, что" }
family:
  - { pl: "wskazywać", ru: "указывать", relation: aspect, id: wskazywac }
  - { pl: "pokazać", ru: "показать", relation: root, id: pokazac }
  - { pl: "wskazówka", ru: "стрелка; указание", relation: derived, id: wskazowka }
etymology: "Приставка w- и SKAZAĆ, от KAZAĆ, из праславянского *kazati «показывать, являть» — того же корня, что русские «казать», «показать», «указать», «образ». Исходное значение у корня именно «являть взгляду», и оба языка его сохранили в приставочных словах: POKAZAĆ «показать», WSKAZAĆ «указать». Разошлись бесприставочные: русское «казать» ушло в просторечие и живёт лишь в «кажется», а польское KAZAĆ получило значение «велеть» — через «указать кому-то, что делать». Тем же путём SKAZAĆ пришло к «приговорить»: указать человеку его участь."
memory: "Из этого гнезда совпадают только два: wskazać «указать» и pokazać «показать». А kazać значит «велеть», skazać — «приговорить», и «сказать» это powiedzieć."
idioms:
  - { pl: "wszystko wskazuje na to, że", ru: "всё указывает на то, что" }
  - { pl: "wskazać palcem", ru: "указать пальцем, прямо обвинить" }
