notes:
  - { kind: false-friend, text: "За этим прилагательным стоит одна из главных ловушек польского для русскоязычного. CZAS значит «время», а не «час»: NIE MAM CZASU — «у меня нет времени». Час как единица называется GODZINA: DWIE GODZINY «два часа». Слова CZAS и «час» действительно родственны и восходят к одному праславянскому слову, но языки поделили его по-разному: русский сузил до шестидесяти минут и взял для общего смысла «время», а польский оставил широкое значение. Отсюда STREFA CZASOWA — «часовой пояс», хотя буквально это «временная зона»." }
  - { kind: usage, text: "Одиннадцать форм. Прилагательное покрывает два русских слова сразу: «временной», то есть относящийся ко времени, и «временный», то есть недолгий. Контекст различает их надёжно: STREFA CZASOWA и RÓŻNICA CZASOWA о первом, POBYT CZASOWY и PRACA CZASOWA о втором. Рядом стоят два синонима со своими оттенками: CHWILOWY значит «сиюминутный, краткий», а TYMCZASOWY — «временный» в смысле предварительный, до окончательного решения." }
  - { kind: government, text: "Прилагательное только согласуется. Полезнее запомнить обороты с самим существительным: NA CZAS OKREŚLONY «на определённый срок», это стандартная формула трудового договора, и NA CZAS NIEOKREŚLONY «на неопределённый срок». Оба с винительным. Отдельно: W CZASIE CZEGOŚ значит «во время чего-то», предлог W с местным падежом и родительный после, а OD CZASU DO CZASU — «время от времени»." }
  - { kind: pronunciation, text: "Читается «часо́вы», три слога, ударение на втором. Сочетание CZ даёт твёрдое «ч», поэтому слово звучит почти как русское «часовой», и это сходство обманчиво: значение у него шире. Конечное Y — это «ы». В существительном CZAS слышно «час», совсем как по-русски, и именно поэтому ошибка так устойчива. В GODZINA слышно «годзи́на», с мягким «дзь»." }
  - { kind: register, text: "Слово нейтральное, частое в документах и в разговорах о поездках. Частые обороты: STREFA CZASOWA «часовой пояс», RÓŻNICA CZASOWA «разница во времени», POBYT CZASOWY «временное пребывание», MELDUNEK CZASOWY «временная регистрация», UMOWA NA CZAS OKREŚLONY «срочный договор». Для русскоязычного в Польше особенно важно второе значение: ZAMELDOWANIE CZASOWE — это именно временная прописка, и слово стоит в каждом формуляре." }
