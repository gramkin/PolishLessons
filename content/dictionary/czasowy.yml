etymology: "От CZAS «время», от праславянского *časъ, то есть от того же слова, что русский «час». Это один из самых поучительных случаев расхождения: праславянское слово означало отрезок времени вообще, и польский сохранил это широкое значение, а русский сузил его до шестидесяти минут, взяв для общего понятия слово «время», родственное «вертеть». Поэтому польское CZAS отвечает русскому «времени», а русскому «часу» отвечает польское GODZINA, слово того же корня, что «год» и «година». Два языка переставили местами целую пару понятий."
memory: "Главная ловушка в корне: czas значит «время», а не «час», а час это godzina. Слова czas и «час» родственны, но языки поделили их по-разному: польский оставил широкое значение, русский сузил до единицы времени. Прилагательное покрывает оба русских, и «временной», strefa czasowa, и «временный», pobyt czasowy. Для жизни в Польше важнее второе: zameldowanie czasowe это временная прописка. Читается «часо́вы», почти как русское «часовой»."
