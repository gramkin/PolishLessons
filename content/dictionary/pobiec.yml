# review
id: pobiec
format: 2
lemma: "pobiec"
rank: 4096
pos: verb
pron: { cyr: "по́бец" }
senses:
  - id: run
    ru: "побежать, сбегать (куда-то, за чем-то)"
    examples:
      - pl: "Pobiegł po pomoc."
        ru: "Он побежал за помощью."
        source: { kind: authored }
      - pl: "Pies pobiegł za kotem."
        ru: "Собака побежала за кошкой."
        source: { kind: authored }
      - pl: "Pobiegnij po chleb, proszę."
        ru: "Сбегай за хлебом, пожалуйста."
        source: { kind: authored }
  - id: run-race
    ru: "пробежать (дистанцию, забег)"
    examples:
      - pl: "Jutro pobiegnę maraton."
        ru: "Завтра я побегу марафон."
        source: { kind: authored }
      - pl: "W zeszłym roku pobiegłem półmaraton."
        ru: "В прошлом году я пробежал полумарафон."
        source: { kind: authored }
  - id: drift
    ru: "перен. устремиться (о взгляде, мыслях)"
    examples:
      - pl: "Jej wzrok pobiegł w stronę drzwi."
        ru: "Её взгляд метнулся к двери."
        source: { kind: authored }
      - pl: "Myśli pobiegły ku domowi."
        ru: "Мысли унеслись к дому."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "POBIEC — «побежать», как в русском. Но «сбежать» — UCIEC, «пробежать мимо» — PRZEBIEC. POBIEC PO CHLEB — «сбегать за хлебом»: PO здесь «за». POBIEC NA POMOC — «броситься на помощь»." }
  - { kind: usage, text: "Тридцать семь форм: вариант инфинитива «pobiegnąć», безличная форма и отглагольное существительное практически не употребляются. Будущее с -N-: POBIEGNĘ, POBIEGNIESZ, повелительное POBIEGNIJ; прошедшее — POBIEGŁ, POBIEGLI; деепричастие — POBIEGŁSZY." }
  - { kind: government, text: "Куда — DO, NA, W: DO SKLEPU, NA PRZYSTANEK, W STRONĘ LASU. За чем — PO с винительным: PO CHLEB, PO LEKARZA. За кем — ZA с творительным: ZA PSEM. Дистанцию — винительный: POBIEC MARATON." }
  - { kind: pronunciation, text: "Читается «по́бец», ударение на первом слоге. POBIEGNĘ — «побе́гнэ», POBIEGŁ — «по́бегу»." }
  - { kind: register, text: "Нейтральное слово. WZROK POBIEGŁ, MYŚLI POBIEGŁY — книжное. POBIEC NA ZŁAMANIE KARKU — разговорное «бежать сломя голову»." }
collocations:
  - { pl: "pobiec po pomoc", ru: "побежать за помощью" }
  - { pl: "pobiec maraton", ru: "пробежать марафон" }
  - { pl: "pobiec za kimś", ru: "побежать за кем-то" }
family:
  - { pl: "biec", ru: "бежать", relation: root, id: biec }
  - { pl: "dobiec", ru: "добежать", relation: derived, id: dobiec }
  - { pl: "uciec", ru: "убежать, сбежать", relation: derived, id: uciec }
etymology: "Приставка PO- плюс BIEC «бежать», праславянское *běgti. Русское «побежать» — то же слово."
memory: "Pobiec po chleb — сбегать за хлебом. Pobiec maraton — пробежать марафон. Pobiegnij! — сбегай! Читается «по́бец»."
idioms:
  - { pl: "pobiec na złamanie karku", ru: "бежать сломя голову" }
