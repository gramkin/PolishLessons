# review
id: zachowanie
format: 2
lemma: "zachowanie"
rank: 2091
pos: noun
pron: { cyr: "захова́не" }
senses:
  - id: behaviour
    ru: "поведение"
    examples:
      - pl: "Jego zachowanie było dziwne i niepokojące."
        ru: "Его поведение было странным и беспокойным."
        source: { kind: tatoeba, id: 3744913 }
      - pl: "Jego zachowanie mnie zdumiało."
        ru: "Его поведение меня поразило."
        source: { kind: translated, id: 361771 }
      - pl: "Musisz poprawić swoje zachowanie."
        ru: "Тебе надо исправить своё поведение."
        source: { kind: translated, id: 366240 }
  - id: conduct
    ru: "поступок, манера держаться"
    examples:
      - pl: "Syn wstydzi się swego zachowania."
        ru: "Сын стыдится своего поведения."
        source: { kind: translated, id: 734296 }
      - pl: "Byliśmy zdziwieni jego zachowaniem."
        ru: "Мы были удивлены его поведением."
        source: { kind: translated, id: 356992 }
notes:
  - { kind: usage, text: "Отглагольное существительное от zachować się «повести себя», поэтому значит именно «поведение», а не «сохранение»." }
  - { kind: false-friend, text: "Ловушка в глаголе: zachować значит и «сохранить», и «повести себя» (zachować się). Существительное zachowanie закрепилось за вторым значением." }
  - { kind: government, text: "Средний род: to zachowanie, tego zachowania." }
  - { kind: usage, text: "Во множественном числе zachowania — «модели поведения», термин психологии и социологии." }
collocations:
  - { pl: "dobre zachowanie", ru: "хорошее поведение" }
  - { pl: "poprawić zachowanie", ru: "исправить поведение" }
etymology: "От zachować się «повести себя», от chować «хранить, прятать»; ср. русское «хоронить», «сохранять»."
memory: "zachowanie — «поведение», от zachować się «повести себя». Глагол zachować значит ещё и «сохранить», но существительное закрепилось за поведением."
idioms:
  - { pl: "dobre zachowanie", ru: "хорошее поведение" }
