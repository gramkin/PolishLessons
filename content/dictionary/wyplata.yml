notes:
  - { kind: false-friend, text: "Русское «выплата» означает только действие — выдачу денег. Польское WYPŁATA значит и это, и сами полученные деньги, то есть зарплату за месяц: DZIEŃ WYPŁATY «день зарплаты», DOSTAŁ WYPŁATĘ «получил зарплату», PO WYPŁACIE «после получки». Во втором значении русский скажет «зарплата» или «получка», но не «выплата». Обратно: регулярная зарплата как ставка по договору — это WYNAGRODZENIE или PENSJA, а PENSJA в польском значит именно оклад, а не пенсию: пенсия это EMERYTURA. Три слова легко перепутать, и ошибка меняет смысл разговора о деньгах." }
  - { kind: usage, text: "Десять форм, женский род. Главное правило — дательный и местный единственного WYPŁACIE, где T перед окончанием -E переходит в C. Это та же мена, что в AKCENCIE, KONFLIKCIE и APARTAMENCIE, только здесь она попадает в самую частую форму: PO WYPŁACIE, PRZY WYPŁACIE слышно каждый месяц. Родительный множественного — WYPŁAT, с нулевым окончанием и без беглого гласного, потому что группа ŁT произносится легко. Винительный единственного WYPŁATĘ, творительный WYPŁATĄ. Управление: WYPŁATA CZEGO (родительный) — WYPŁATA ODSZKODOWANIA, WYPŁATA ZALICZKI." }
  - { kind: pronunciation, text: "Читается «выпуа́та», три слога, ударение на втором. Главная ловушка для русскоязычного — буква Ł: это «у» неслоговое, а не «л», поэтому PŁA звучит «пуа». Та же ловушка в PŁOMIEŃ, PŁACIĆ и WPŁYWAĆ. Начальное Y даёт «ы». В форме WYPŁACIE сочетание CIE читается «це» с мягким Ц: «выпуа́це». В форме WYPŁATĄ последнее Ą даёт «он»: «выпуа́тон». В форме WYPŁAT конечное T твёрдое." }
  - { kind: register, text: "Слово нейтральное, одинаково уместное в бухгалтерии и на кухне. В значении «зарплата» оно разговорное, но вполне приличное; в документах стоит WYNAGRODZENIE. Устойчивые выражения: DZIEŃ WYPŁATY, LISTA WYPŁAT «ведомость», WYPŁATA GOTÓWKĄ «выплата наличными», а в банкомате кнопка подписана WYPŁATA, то есть «снять деньги», что для приезжего неожиданно. Звательная форма WYPŁATO в живой речи не встречается и возможна лишь в шутливом или песенном обращении." }
