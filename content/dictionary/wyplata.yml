etymology: "Отглагольное существительное от WYPŁACIĆ, то есть приставка WY- «вы-» плюс PŁACIĆ «платить». Корень праславянский *plat- и означал кусок ткани: платом расплачивались до монеты, и от этого же корня идут русские «платить», «плата», «платок» и «платье». Соответствие с русским полное и приставка та же, поэтому слово читается насквозь: вы-плат-а. Чередование Ł на месте русского Л закономерно для старого твёрдого L, как в PŁACIĆ и «платить», PŁYNĄĆ и «плыть». Расхождение возникло не в форме, а в значении: польский добавил к действию результат, то есть полученные за месяц деньги, и это второе значение стало в разговоре главным."
memory: "Разбирается насквозь: wy- + płacić, корень тот же, что в «платить» (праслав. *plat- «кусок ткани», отсюда и «платок»). Но значение шире русского: не только выплата как действие, а и сами деньги за месяц — dzień wypłaty «день зарплаты», po wypłacie «после получки». Падежная ловушка: t→c в wypłacie, как akcencie, konflikcie. Звук: ł это «у», «выпуа́та». И не путать: pensja это оклад, пенсия — emerytura."
