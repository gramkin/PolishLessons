etymology: "Из латинского CONCURRENTIA «сбегание вместе, столкновение», от CONCURRERE — из CON- «вместе» и CURRERE «бежать». Исходно это бег навстречу, сходка, и отсюда оба польских значения разом: соперничество как встречный бег и спортивная дисциплина как сам забег. Русский взял слово из того же латинского источника через западноевропейское посредство, но оставил только переносное значение, соперничество, а для спортивного вида программы построил «дисциплину» из другого латинского слова. Корень CURRERE знаком по словам KURS и «курс», KURIER и «курьер», EKSKURSJA и «экскурсия» — всюду бег и движение. Польское -CJA на месте латинского -TIA это то же регулярное соответствие русскому -ЦИЯ, что в DEPRESJA и FANTAZJA."
memory: "Два значения, и второго в русском нет: konkurencja — и «конкуренция», и спортивная «дисциплина» — startować w konkurencji. Собирательно означает и самих соперников: konkurencja nie śpi — «конкуренты не спят». Класс -cja, как depresja и fantazja: konkurencji сразу на три падежа единственного и на родительный множественного, старая форма konkurencyj в книгах до середины двадцатого века. Прилагательное konkurencyjny значит «конкурентоспособный»."
idioms:
