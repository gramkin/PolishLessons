notes:
  - { kind: false-friend, text: "В первом значении слово совпадает с русской «конкуренцией», а второго в русском нет. По-польски KONKURENCJA означает ещё и отдельный вид спортивной программы: KONKURENCJA OLIMPIJSKA, KONKURENCJE BIEGOWE, WYGRAĆ SWOJĄ KONKURENCJĘ. По-русски здесь нужна «дисциплина» или «вид программы», и буквальный перевод через конкуренцию будет непонятен. Добавим третий оттенок: KONKURENCJA часто означает самих соперников, собирательно — KONKURENCJA NIE ŚPI «конкуренты не спят», где русский скажет именно «конкуренты», во множественном. И написание: одна N и одна C, тогда как русский пишет «конкуренция» без удвоений тоже, так что здесь языки сходятся." }
  - { kind: government, text: "Женский род на -JA, тот же класс, что DEPRESJA и FANTAZJA. Родительный, дательный и местный единственного совпадают в KONKURENCJI, и эта же форма служит родительным множественного; старая форма родительного множественного KONKURENCYJ встречается в текстах до середины двадцатого века. Винительный на -Ę: WYGRAĆ KONKURENCJĘ. С кем конкурируют — предлог Z с творительным: KONKURENCJA Z ZAGRANICZNYMI FIRMAMI. В чём — предлог W с местным: KONKURENCJA W TEJ BRANŻY. В спортивном значении употребляется предлог W с местным: STARTOWAĆ W KONKURENCJI." }
  - { kind: pronunciation, text: "Читается «конкуре́нцья», ударение на предпоследнем слоге из четырёх. Сочетание CJ даёт «ць» с последующим «я», то есть «цья», и буква J здесь полноценный согласный, как в DEPRESJA и KOLEKCJA. Буква E в третьем слоге звучит полным «э», без редукции, в отличие от русского безударного. В родительном KONKURENCJI конечное -JI читается «цьи»: «конкуре́нцьи». В старой форме KONKURENCYJ слышно «конкуре́нцый»." }
  - { kind: usage, text: "Частотные сочетания: OSTRA KONKURENCJA «жёсткая конкуренция», KONKURENCJA CENOWA, NIEUCZCIWA KONKURENCJA «недобросовестная конкуренция» — юридический термин, WYTRZYMAĆ KONKURENCJĘ, KONKURENCJA NIE ŚPI. В спорте: KONKURENCJE BIEGOWE, KONKURENCJE TECHNICZNE, STARTOWAĆ W DWÓCH KONKURENCJACH. Прилагательное KONKURENCYJNY значит «конкурентоспособный», а не «конкурентный»: CENA KONKURENCYJNA «конкурентоспособная цена». Существительное KONKURENT означает отдельного соперника, в отличие от собирательной KONKURENCJA." }
