  - { pl: "mijać", ru: "проходить, миновать", relation: root }
etymology: "Приставка o- «вокруг, об-» и MINĄĆ, из праславянского *minǫti «пройти, миновать» — тот же корень, что русское «минуть», «мимо», «миновать». Приставка o- делает то же, что русская «об-»: обводит движение вокруг препятствия, откуда OMINĄĆ «обойти». Любопытно, что русский закрепил этот корень за наречием «мимо», которое живёт и сейчас, а сам глагол «минуть» отправил в книжный язык; польский же сохранил глагол в полной силе и построил на нём и MIJAĆ, и OMIJAĆ, и NIEUCHRONNY конец — NIE MINIE CIĘ."
memory: "minąć — обиходное «пройти мимо», а не книжное, как русское «минуть»: minęła godzina «прошёл час». А ominąć — «обойти»: ominąć korek, ominąć przepisy, burza nas ominęła."
idioms:
  - { pl: "ominąć przepisy", ru: "обойти правила, уклониться от требований" }
  - { pl: "nie ominie cię kara", ru: "наказание тебя не минует" }
