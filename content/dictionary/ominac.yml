notes:
  - { kind: false-friend, text: "Корень здесь родственный, но пользоваться им по русскому образцу нельзя. Польское MINĄĆ — обиходное слово со значением «пройти мимо, миновать»: MINĄŁEM GO NA SCHODACH «я прошёл мимо него на лестнице», MINĘŁA GODZINA «прошёл час». Русское «минуть» того же происхождения, но оно книжное и редкое, так что по чутью его не подставишь: там, где поляк скажет MINĄĆ, русский скажет «пройти», «проехать» или «пройти мимо». А приставочное OMINĄĆ отвечает уже русскому «обойти»." }
  - { kind: government, text: "Что или кого — винительный без предлога: OMINĄĆ KOREK, KAŁUŻĘ, PRZEPISY, KOGOŚ. Русский тут совпадает: «обойти пробку». Чем или как — творительный или предлог: OMINĘLIŚMY KOREK BOCZNĄ DROGĄ. В третьем значении подлежащее и дополнение меняются местами по сравнению с русским привычным порядком: не человек минует беду, а беда минует человека — BURZA NAS OMINĘŁA, AWANS GO OMINĄŁ, как русское «гроза нас миновала»." }
  - { kind: pronunciation, text: "Глагол класса на -ĄĆ, и мена ą/ę идёт по роду: OMINĄŁ с ą только в мужском единственном прошедшего и в его условной форме OMINĄŁBY, а дальше всюду ę — OMINĘŁA, OMINĘŁO, OMINĘLI, OMINĘŁY. Так же ведут себя ZACZĄĆ, WZIĄĆ и WPŁYNĄĆ из партии про влияние. Повелительное OMIŃ оканчивается на мягкий ń, читается «оминь»." }
  - { kind: usage, text: "Несовершенная пара — OMIJAĆ, и она нужна для правил и расписаний: POCIĄG OMIJA TĘ STACJĘ, OMIJAĆ PRZEPISY. Отдельно стоит выучить оборот с человеком в дательном: NIE OMINIE CIĘ KARA — «наказание тебя не минует». И существительное OMINIĘCIE, которое в юридическом языке значит «обход» в смысле уклонения: OMINIĘCIE PRZEPISÓW." }
collocations:
  - { pl: "ominąć korek", ru: "объехать пробку" }
  - { pl: "ominąć przepisy", ru: "обойти правила" }
