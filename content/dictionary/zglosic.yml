# review
id: zglosic
format: 2
lemma: "zgłosić"
rank: 1031
pos: verb
aspect: perf
pron: { cyr: "згуо́сиць" }
senses:
  - id: volunteer
    ru: "zgłosić się — вызваться, явиться"
    examples:
      - pl: "Kto zgłosił się na ochotnika?"
        ru: "Кто вызвался добровольцем?"
        source: { kind: translated, id: 10542037 }
      - pl: "Zgłosiłem się na ochotnika."
        ru: "Я вызвался добровольцем."
        source: { kind: translated, id: 8502266 }
      - pl: "Tom się zgłosił."
        ru: "Том вызвался."
        source: { kind: translated, id: 5629827 }
  - id: report
    ru: "заявить, сообщить (в полицию, официально)"
    examples:
      - pl: "Dzwonię, żeby zgłosić zgubiony portfel."
        ru: "Я звоню, чтобы заявить о потерянном кошельке."
        source: { kind: translated, id: 9817461 }
      - pl: "Zgłosiłeś kradzież na policję?"
        ru: "Ты заявил о краже в полицию?"
        source: { kind: translated, id: 3581998 }
      - pl: "Czy zgłosiłeś wypadek?"
        ru: "Ты сообщил об аварии?"
        source: { kind: translated, id: 12470099 }
  - id: application
    ru: "zgłoszenie — заявка, заявление"
    examples:
      - pl: "Wymagane jest zgłoszenie celne."
        ru: "Требуется таможенная декларация."
        source: { kind: translated, id: 528489 }
      - pl: "Z przykrością informujemy, że pańskie zgłoszenie zostało odrzucone."
        ru: "С сожалением сообщаем, что ваша заявка отклонена."
        source: { kind: translated, id: 366598 }
      - pl: "W Japonii obowiązuje zasada „pierwszeństwa zgłoszenia”."
        ru: "В Японии действует принцип «первенства заявки»."
        source: { kind: translated, id: 765783 }
notes:
  - { kind: usage, text: "Возвратное zgłosić się значит «вызваться, явиться»: zgłosić się na ochotnika «вызваться добровольцем», zgłosić się do pracy «подать заявку на работу»." }
  - { kind: government, text: "zgłosić coś NA policję — «заявить о чём-то в полицию», предлог na с винительным. Русский берёт «в» с винительным, так что предлог надо запоминать." }
  - { kind: usage, text: "Отглагольное существительное zgłoszenie значит «заявка, заявление, декларация»: zgłoszenie celne «таможенная декларация»." }
  - { kind: usage, text: "Несовершенный вид — zgłaszać. А zgłosić sprzeciw значит «заявить протест, возразить»." }
collocations:
  - { pl: "zgłosić się na ochotnika", ru: "вызваться добровольцем" }
  - { pl: "zgłosić na policję", ru: "заявить в полицию" }
  - { pl: "zgłosić sprzeciw", ru: "заявить протест" }
  - { pl: "zgłoszenie celne", ru: "таможенная декларация" }
family:
  - { pl: "zgłaszać", ru: "заявлять", relation: aspect }
  - { pl: "głos", ru: "голос", relation: root }
  - { pl: "zgłoszenie", ru: "заявка", relation: derived }
etymology: "Приставка z- + głosić «возглашать», от głos «голос». Русское «огласить» и «голос» — тот же корень, но значение «подать заявку» развил именно польский."
memory: "zgłosić — «заявить, сообщить»: zgłosić kradzież NA policję. А возвратное zgłosić się значит «вызваться, явиться»: zgłosić się na ochotnika «вызваться добровольцем»."
idioms:
  - { pl: "zgłosić się na ochotnika", ru: "вызваться добровольцем" }
  - { pl: "zgłosić na policję", ru: "заявить в полицию" }
  - { pl: "zgłosić sprzeciw", ru: "заявить протест" }
