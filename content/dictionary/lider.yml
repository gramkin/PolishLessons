notes:
  - { kind: false-friend, text: "Значение совпадает с русским «лидером», и оба языка взяли слово из английского. Расходится распределение с родными словами. Польское PRZYWÓDCA — это вождь, глава движения или народа, слово весомое и слегка торжественное; LIDER легче и современнее, его место в спорте, в музыке и в деловой речи. Начальник на работе — SZEF или KIEROWNIK, и назвать его LIDER нельзя. Написание тоже стоит запомнить: польский переписал английское LEADER по своему чтению, как сделал с KOWBOJ и DŻINSY, и потому в слове одна буква I." }
  - { kind: usage, text: "Десять форм, мужской род, одушевлённое лицо. Именительный множественного — LIDERZY, где конечное R основы переходит в RZ: та же мена, что в INŻYNIERZY, и ровно та же, что даёт местный LIDERZE. Винительный единственного равен родительному, LIDERA. Родительный множественного — LIDERÓW. Управление: LIDER CZEGOŚ в родительном — LIDER RANKINGU, LIDER ZESPOŁU, LIDER PARTII. В спортивном языке о лидере говорят ещё OBJĄĆ PROWADZENIE, то есть «возглавить гонку», и это оборот, а не существительное." }
  - { kind: pronunciation, text: "Читается «ли́дэр», два слога, ударение на первом — в отличие от русского «ли́дер», где ударение там же, но второй гласный мягче. Польское E всегда даёт «э», поэтому второй слог звучит «дэр», а не «дер». Конечное R раскатистое. В форме LIDERA слышно «лиде́ра». В форме LIDERZE буквосочетание RZ даёт «ж»: «лиде́же». В форме LIDERZY слышно «лиде́жы», с твёрдым «ы» в конце." }
  - { kind: register, text: "Слово нейтральное и современное, принадлежит языку газет, спорта и бизнеса. Устойчивые сочетания: LIDER RANKINGU, LIDER SONDAŻY «лидер опросов», LIDER RYNKU, LIDER ZESPOŁU. Производное LIDEROWAĆ значит «лидировать» и употребляется в спортивном репортаже. Прилагательное от слова не образуется, и вместо него берут родительный: POZYCJA LIDERA. В политическом языке слово LIDER постепенно вытесняет PRZYWÓDCA, и старшее поколение считает это обеднением речи." }
