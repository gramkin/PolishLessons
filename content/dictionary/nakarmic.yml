notes:
  - { kind: false-friend, text: "Корень тот же, что в русском «корме» и «кормить», и расхождений в прямом значении нет: KARMIĆ это «кормить», NAKARMIĆ — «накормить», KARMA — «корм». Осторожность нужна в двух местах. Польское KARMA значит только корм для животных, тогда как русское «карма» в смысле судьбы по-польски тоже KARMA, но это другое слово, пришедшее из санскрита; совпадение чистая случайность. И KARMIĆ PIERSIĄ значит «кормить грудью», а не «кормить грудью чего-то»: PIERSIĄ тут творительный падеж орудия." }
  - { kind: government, text: "Схема совпадает с русской: NAKARMIĆ KOGOŚ CZYMŚ — винительный на того, кого кормят, и творительный без предлога на то, чем кормят. NAKARMIONO NAS ZUPĄ значит «нас накормили супом». Переносное употребление работает так же: KARMIĆ KOGOŚ OBIETNICAMI «кормить кого-то обещаниями», и это один из тех оборотов, где два языка совпадают до падежа. Возвратное NAKARMIĆ SIĘ редко и книжно; обычно говорят NAJEŚĆ SIĘ «наесться»." }
  - { kind: usage, text: "Приставка NA- придаёт действию полноту, ровно как русская «на-» в «накормить»: не просто дать еды, а насытить. Несовершенный партнёр — KARMIĆ. Пятьдесят три формы — подпись переходного глагола совершенного вида. В повелительном наклонении основа не меняется: NAKARM, NAKARMMY, NAKARMCIE, причём в NAKARMMY сходятся два M, и это не опечатка, а обычное для польского стечение на стыке основы и окончания." }
  - { kind: pronunciation, text: "Читается «нака́рмиць», три слога, ударение на предпоследнем. Буква R твёрдая и раскатистая, как в русском, и перед M никак не смягчается. Конечное Ć мягкое, «ць». В страдательном причастии NAKARMIONY группа IO даёт «ё»: «накармё́ны». В форме NAKARMMY слышны два M подряд, и проговаривать их надо раздельно, иначе слово сливается с NAKARMY, которого нет." }
  - { kind: register, text: "Слово нейтральное и бытовое. Частые сочетания: NAKARMIĆ DZIECI, NAKARMIĆ PSA, NAKARMIĆ KOTA. Отглагольное существительное KARMIENIE значит «кормление», в том числе грудное: KARMIENIE PIERSIĄ. Родственные слова в ходу: KARMA «корм», KARMNIK «кормушка», DOKARMIAĆ «подкармливать». Переносное KARMIĆ OBIETNICAMI принадлежит публицистике и звучит с упрёком, как и русский двойник." }
