etymology: "Приставка NA- плюс KARMIĆ, от праславянского *kъrmiti и существительного *kъrma «корм, пища». Русский сохранил и глагол, и существительное почти без изменений: «кормить», «корм», «кормушка», «кормилец». Польское KARMIĆ отличается только гласной в корне: древний сверхкраткий звук, который в русском дал О, в польском дал A, и то же соответствие видно в парах GARDŁO и «горло», TARG и «торг», MARTWY и «мёртвый». Узнав это правило, читатель начинает угадывать польские слова по русским. Слово KARMA в значении судьбы к этому гнезду не принадлежит вовсе и пришло из санскрита в двадцатом веке."
memory: "Корень тот же, что в «корме»: karmić «кормить», nakarmić «накормить», karma «корм». Управление совпадает полностью: nakarmić kogoś czymś, винительный и творительный, как «накормить кого-то чем-то». Полезное правило из этимологии: польское AR на месте русского ОР — karmić и «кормить», gardło и «горло», targ и «торг», martwy и «мёртвый». И помнить karmić obietnicami «кормить обещаниями»."
idioms:
  - { pl: "karmić kogoś obietnicami", ru: "кормить кого-то обещаниями" }
