notes:
  - { kind: usage, text: "Это образцовое слово для правила о букве Ó. В польском Ó стоит только в закрытом слоге, то есть там, где за гласной нет другой гласной; как только появляется окончание, Ó переходит в O. Отсюда именительный PROTOKÓŁ, но родительный PROTOKOŁU, местный PROTOKOLE, множественное PROTOKOŁY. Так же ведут себя STÓŁ и STOŁU, DÓŁ и DOŁU, WÓZ и WOZU, RÓG и ROGU, MÓJ и MOJEGO. Правило механическое и охватывает десятки слов, поэтому выучить его стоит один раз. В старых текстах и в словарных базах встречается написание PROTOKÓŁU и PROTOKÓŁACH, с Ó в открытом слоге; современной норме оно не отвечает, и эти формы на карточке отмечены как устаревшие." }
  - { kind: false-friend, text: "Значение совпадает с русским: PROTOKÓŁ это «протокол» и в смысле записи заседания, и в смысле свода правил поведения. Расходятся написание и ударение. Там, где русский пишет О и Л, польский пишет Ó и Ł: PROTOKÓŁ против «протокола». А ударение в польском, как всегда, на предпоследнем слоге, то есть на TO, тогда как русское «протоко́л» ударяется на последнем. Поэтому слово, которое кажется совсем знакомым, звучит заметно иначе: «прото́куу». Производные: PROTOKOLARNY «протокольный», PROTOKOLANT «протоколист, секретарь заседания», PROTOKOŁOWAĆ «протоколировать»." }
  - { kind: government, text: "Мужской род, неодушевлённое. Чего протокол — предлог Z с родительным: PROTOKÓŁ Z ZEBRANIA «протокол собрания», PROTOKÓŁ Z POSIEDZENIA. Обратите внимание, что по-русски здесь достаточно родительного без предлога, а по-польски предлог Z нужен. «Внести в протокол» — DO PROTOKOŁU с родительным: WPISAĆ DO PROTOKOŁU. «В протоколе» — W с местным: W PROTOKOLE. Частотные сочетания: SPORZĄDZIĆ PROTOKÓŁ «составить протокол», PODPISAĆ PROTOKÓŁ, PROTOKÓŁ DYPLOMATYCZNY, PROTOKÓŁ ZDAWCZO-ODBIORCZY «акт приёма-передачи»." }
  - { kind: pronunciation, text: "Читается «прото́куу», три слога, ударение на предпоследнем. Буква Ó произносится как «у», а Ł — как неслоговое «у», поэтому конец слова звучит сдвоенным «уу», без всякого «л». Это та же буква Ł, что в ŁADNY и MAŁY, и передавать её русским «л» — самая частая ошибка. В родительном PROTOKOŁU уже обычное O, и слышно «протоко́уу». В местном PROTOKOLE буква L обычная, не Ł, поэтому звучит «протоко́ле», ближе всего к русскому слову." }
