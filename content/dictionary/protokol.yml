etymology: "Из греческого ΠΡΩΤΌΚΟΛΛΟΝ, сложенного из ΠΡΩΤΟΣ «первый» и ΚΌΛΛΑ «клей»: так назывался первый лист, подклеенный к свитку, на котором писали дату и имя писца. Из этого значения выросли оба современных: сначала официальная запись, потом свод правил, которыми такая запись обставлена. Оба наших языка взяли слово через латынь и западноевропейские языки, поэтому значения совпадают полностью. Польская форма отличается двумя буквами, и обе объясняются историей звуков: Ł передаёт старое твёрдое l, а Ó — старое долгое o, которое в закрытом слоге удлинилось и затем перешло в «у». Именно поэтому Ó исчезает, как только слог открывается: PROTOKÓŁ, но PROTOKOŁU. Русский ни удлинения, ни перехода не знал и сохранил О во всех формах."
memory: "Образец правила о Ó: оно стоит только в закрытом слоге, а с появлением окончания переходит в O. Protokół, но protokołu, protokole, protokoły — как stół/stołu, dół/dołu, wóz/wozu, róg/rogu. Читается «прото́куу»: ó это «у», ł это неслоговое «у», никакого «л». Ударение на предпоследнем слоге, в отличие от русского «протоко́л». И предлог: протокол собрания — protokół Z zebrania, с предлогом."
