notes:
  - { kind: government, text: "Главное расхождение здесь падежное. Куда вскакивать — предлог DO с родительным: WSKAKIWAĆ DO TRAMWAJU, DO WODY, DO AUTOBUSU, тогда как русский говорит «вскакивать В трамвай» с винительным. Это та же разница, что в WPŁYWAĆ DO PORTU и «впадать в море». На что вскочить — предлог NA с винительным: WSKAKIWAĆ NA KRZESŁO, NA STÓŁ, NA ROWER, и здесь русское управление совпадает. К кому заскочить — DO с родительным о человеке: WSKAKIWAĆ DO NAS, DO SĄSIADKI. Прямого дополнения глагол не принимает вовсе, он непереходный, поэтому страдательного причастия у него нет." }
  - { kind: false-friend, text: "Корень SKAK- это русское «скак»: SKAKAĆ «скакать, прыгать», SKOK «прыжок, скачок», SKOCZYĆ «прыгнуть». Приставка W- отвечает русскому «в-», так что WSKAKIWAĆ разбирается буквально как «вскакивать». Но объём значений шире русского: по-польски это и «впрыгивать» физически, и «заскакивать, забегать» на минуту, причём второе значение очень частое в разговоре: WSKOCZĘ DO CIEBIE WIECZOREM «забегу к тебе вечером». Русское «вскакивать» этого оттенка не имеет — там нужно «заскочить», «забежать». Второе: WSKAKIWAĆ не значит «вскакивать с постели» — это ZRYWAĆ SIĘ или WSTAWAĆ GWAŁTOWNIE." }
  - { kind: usage, text: "Несовершенный вид, непереходный, пятьдесят две формы: сорок две от глагола и десять от действительного причастия WSKAKUJĄCY. Страдательного причастия нет, потому что нет винительного дополнения: вскакивают куда-то, а не что-то. Совершенная пара — WSKOCZYĆ, и основы различаются сильно: WSKAKIWA- в несовершенном, WSKOCZ- в совершенном, сравните WSKAKUJĘ и WSKOCZĘ. В настоящем времени у несовершенного вида основа на -UJ-: WSKAKUJĘ, WSKAKUJESZ, как у всего класса на -IWAĆ. В разговорном значении «забежать» употребляется почти всегда совершенный вид: WSKOCZĘ NA CHWILĘ." }
  - { kind: pronunciation, text: "Читается «фскаки́ваць», четыре слога, ударение на предпоследнем. Начальное W перед глухим S оглушается в «ф», поэтому слово начинается с «фск» — три согласных подряд, и вставлять между ними гласный нельзя. Буква I после K смягчает его: «ки», не «кы». Конечное Ć — мягкое «ць». В формах настоящего времени основа другая: WSKAKUJĘ звучит «фскаку́е» с лёгким носовым на конце. В совершенном виде WSKOCZYĆ три слога: «фско́чыць»." }
