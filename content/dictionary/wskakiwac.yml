etymology: "Из приставки W- и корня *skakati «скакать», того же, что русские «скакать», «скок», «скачок». Соответствие полное и в приставке, и в корне, так что WSKAKIWAĆ — это буквально «вскакивать», собранное по тому же чертежу. Гнездо в польском широкое и прозрачное: SKAKAĆ, SKOCZYĆ, SKOK, WYSKAKIWAĆ «выскакивать», PRZESKAKIWAĆ «перескакивать», ODSKOCZYĆ «отскочить». Суффикс -IWAĆ образует несовершенный вид многократного действия, и ему в русском отвечает -ИВАТЬ: WSKAKIWAĆ и «вскакивать», PRZESKAKIWAĆ и «перескакивать». Разошлись языки только в переносном значении: польский развил у этого глагола смысл короткого визита, «заскочить», чего русское «вскакивать» не умеет, и для той же идеи русский берёт «заскочить» с другой приставкой."
memory: "Собирается буквально: w- = «в-», skakać = «скакать», отсюда wskakiwać = «вскакивать». Суффикс -iwaĆ отвечает русскому -ИВАТЬ. Но два отличия. Падеж: wskakiwać DO tramwaju с родительным, тогда как русский говорит «в трамвай» с винительным; на что — na + винительный, как в русском. И значение: по-польски это ещё «заскочить на минутку» (wskoczę do ciebie wieczorem), чего русское «вскакивать» не значит. Непереходный, 52 формы, страдательного причастия нет. Звук: начальное W перед S даёт «ф»."
