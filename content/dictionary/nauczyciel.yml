# review
id: nauczyciel
format: 2
lemma: "nauczyciel"
rank: 1337
pos: noun
pron: { cyr: "научы́цель" }
senses:
  - id: teacher
    ru: "учитель, преподаватель"
    examples:
      - pl: "Nauczyciel zadał mi trudne pytanie."
        ru: "Учитель задал мне сложный вопрос."
        source: { kind: tatoeba, id: 720178 }
      - pl: "Ten nauczyciel prowadzi ciekawe zajęcia."
        ru: "Этот учитель проводит интересные занятия."
        source: { kind: tatoeba, id: 12564135 }
      - pl: "Nasz nauczyciel angielskiego jest zawsze punktualny."
        ru: "Наш учитель английского всегда пунктуален."
        source: { kind: tatoeba, id: 360946 }
  - id: be-teacher
    ru: "być nauczycielem — быть учителем (творительный)"
    examples:
      - pl: "On jest nauczycielem?"
        ru: "Он учитель?"
        source: { kind: tatoeba, id: 4933394 }
      - pl: "Chciałbym zostać nauczycielem."
        ru: "Я хотел бы стать учителем."
        source: { kind: tatoeba, id: 597664 }
      - pl: "Pan Brown jest naszym nauczycielem angielskiego."
        ru: "Мистер Браун - наш учитель английского."
        source: { kind: tatoeba, id: 4387720 }
  - id: to-teacher
    ru: "nauczycielowi — учителю (дательный)"
    examples:
      - pl: "Pokazał nauczycielowi język."
        ru: "Он показал учителю язык."
        source: { kind: tatoeba, id: 3704157 }
      - pl: "Wręczyłem nauczycielowi swój arkusz."
        ru: "Я вручил учителю свой листок."
        source: { kind: translated, id: 2517005 }
      - pl: "Zadajemy pytania naszemu nauczycielowi."
        ru: "Мы задаём вопросы нашему учителю."
        source: { kind: translated, id: 3602755 }
notes:
  - { kind: government, text: "«Быть учителем» требует творительного падежа: jestem nauczycielem, chcę zostać nauczycielem." }
  - { kind: usage, text: "Nauczyciel angielskiego — «учитель английского», с родительным падежом предмета." }
  - { kind: usage, text: "Женская форма — nauczycielka. Мужско-личное множественное — nauczyciele, родительный — nauczycieli." }
  - { kind: usage, text: "Образовано от nauczać «обучать», рядом стоят uczyć «учить» и nauczyć «научить» — обе карточки уже есть." }
collocations:
  - { pl: "nauczyciel angielskiego", ru: "учитель английского" }
  - { pl: "zostać nauczycielem", ru: "стать учителем" }
  - { pl: "nauczycielka", ru: "учительница" }
etymology: "От nauczać «обучать», из na- и uczyć «учить», праславянское *učiti. Русское «учитель» — от того же корня «учить»."
memory: "nauczyciel — «учитель». Быть им — творительный падеж: jestem nauczycielem. Предмет ставится в родительный: nauczyciel angielskiego. Женская форма — nauczycielka, множественное — nauczyciele."
idioms:
  - { pl: "nauczyciel angielskiego", ru: "учитель английского" }
  - { pl: "zostać nauczycielem", ru: "стать учителем" }
  - { pl: "nauczyciel akademicki", ru: "преподаватель вуза" }
formExamplesSkip:
  - { form: "nauczycielu", reason: "звательный падеж: для неодушевлённого существительного он практически не употребляется" }
