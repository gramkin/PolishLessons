notes:
  - { kind: false-friend, text: "ВТОРОЕ ЗНАЧЕНИЕ РУССКОМУ НЕЗНАКОМО. Płyta — это «плита», как и ожидаешь: płyta betonowa, płyta chodnikowa. Но то же самое слово значит «ПЛАСТИНКА» и «диск»: płyta winylowa, płyta CD, и главное — nowa płyta zespołu, то есть «новый альбом группы». Русская «плита» так не работает никогда, там нужны «пластинка», «диск» или «альбом». Третий случай — płyta kuchenna, это варочная панель." }
  - { kind: pronunciation, text: "ł звучит как короткое у, y как ы: «пуы́та». В дательном и предложном падеже t смягчается в ci: na płycie — «на пуы́це». Это то же чередование, что kobieta → o kobiecie, и русскому оно незнакомо: «на плите» сохраняет т без изменений." }
  - { kind: usage, text: "Родительный множественного — голая основа płyt, без окончания, как reklam, fabryk и wież. Уменьшительное płytka работает в двух далёких смыслах: «плитка» в смысле кафеля и «печатная плата» в технике." }
collocations:
