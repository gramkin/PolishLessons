  - { pl: "płytowy", ru: "плиточный, плитный", relation: derived }
etymology: "Русская «плита» и польская płyta восходят к одному источнику, связанному с греческим platys «плоский». Основное значение у обоих осталось прежним — плоский каменный или бетонный элемент. Но польский пошёл дальше и назвал тем же словом плоский круглый предмет, грампластинку, а оттуда и компакт-диск с целым альбомом. Отсюда płytka «плитка» и płytowy."
memory: "płyta — это «плита», но ещё и «пластинка»: nowa płyta zespołu значит «новый альбом группы». Запомните заодно предложный падеж: na płycie, с переходом t в ci — ровно как kobieta даёт o kobiecie. И идиома та же, что в русском: jak zdarta płyta — «как заезженная пластинка»."
idioms:
  - { pl: "jak zdarta płyta", ru: "как заезженная пластинка" }
  - { pl: "płyta kuchenna", ru: "варочная панель" }
