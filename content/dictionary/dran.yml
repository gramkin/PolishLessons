# review
id: dran
format: 2
lemma: "drań"
rank: 1272
pos: noun
pron: { cyr: "дрань" }
senses:
  - id: scoundrel
    ru: "подлец, негодяй, гад"
    examples:
      - pl: "Od takiego drania nie wziąłbym nawet kiełbasy."
        ru: "От такого гада мне даже колбасы не надо."
        source: { kind: tatoeba, id: 1354277 }
      - pl: "Ten drań mnie oszukał."
        ru: "Этот подлец меня обманул."
        source: { kind: authored }
      - pl: "Drań!"
        ru: "Подлец!"
        source: { kind: translated, id: 6160308 }
  - id: vocative
    ru: "как обращение и восклицание: ty draniu! «ах ты негодяй!»"
    examples:
      - pl: "Dranie!"
        ru: "Подлецы!"
        source: { kind: translated, id: 12359620 }
      - pl: "Ty draniu!"
        ru: "Ах ты негодяй!"
        source: { kind: authored }
      - pl: "Zostaw ją, draniu!"
        ru: "Оставь её, негодяй!"
        source: { kind: authored }
notes:
  - { kind: register, text: "Слово ругательное, но не матерное — примерно как русские «подлец», «негодяй», «гад». В официальной речи не употребляется." }
  - { kind: usage, text: "Звательный падеж draniu — самая живая форма, потому что слово обычно бросают в лицо: Ty draniu!" }
  - { kind: government, text: "Существительное мужского рода одушевлённое, поэтому винительный совпадает с родительным: widzę drania «вижу подлеца»." }
  - { kind: false-friend, text: "Пришло из русского «дрянь», но род и значение изменились: польское drań — это мужчина-подлец, а не «дрянная вещь»." }
collocations:
  - { pl: "kawał drania", ru: "редкостный негодяй" }
  - { pl: "zimny drań", ru: "хладнокровный подлец" }
  - { pl: "ty draniu", ru: "ах ты негодяй" }
etymology: "Заимствование из русского «дрянь». В польском слово сменило род на мужской и стало обозначать человека — подлеца, негодяя."
memory: "drań — «подлец, негодяй»: ругательство, но не матерное. Пришло из русского «дрянь», только в польском это мужчина. Чаще всего звучит в звательном падеже: Ty draniu!"
idioms:
  - { pl: "kawał drania", ru: "редкостный негодяй" }
  - { pl: "zimny drań", ru: "хладнокровный подлец" }
  - { pl: "ty draniu", ru: "ах ты негодяй" }
