# review
id: rozejsc
format: 2
lemma: "rozejść"
rank: 4572
pos: verb
pron: { cyr: "ро́зэйсьць" }
senses:
  - id: disperse
    ru: "с SIĘ — разойтись (о толпе, людях)"
    examples:
      - pl: "Po koncercie ludzie rozeszli się do domów."
        ru: "После концерта люди разошлись по домам."
        source: { kind: authored }
      - pl: "Rozejdźcie się, nie ma na co patrzeć!"
        ru: "Расходитесь, смотреть не на что!"
        source: { kind: authored }
      - pl: "Tłum szybko się rozszedł."
        ru: "Толпа быстро разошлась."
        source: { kind: authored }
  - id: split-up
    ru: "с SIĘ — расстаться, развестись"
    examples:
      - pl: "Rozeszli się po dziesięciu latach małżeństwa."
        ru: "Они разошлись после десяти лет брака."
        source: { kind: authored }
      - pl: "Nasze drogi się rozeszły."
        ru: "Наши пути разошлись."
        source: { kind: authored }
  - id: spread
    ru: "с SIĘ — разнестись (о слухах); разойтись (о товаре, обуви)"
    examples:
      - pl: "Wieść szybko się rozeszła."
        ru: "Новость быстро разнеслась."
        source: { kind: authored }
      - pl: "Cały nakład rozszedł się w tydzień."
        ru: "Весь тираж разошёлся за неделю."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ROZEJŚĆ SIĘ — как русское «разойтись», включая «расстаться»: ROZESZLI SIĘ. Но «развестись» официально — ROZWIEŚĆ SIĘ. «Разойтись во мнениях» — RÓŻNIĆ SIĘ ZDANIAMI. Почти всегда с SIĘ." }
  - { kind: usage, text: "Сорок одна форма; глагол непереходный, почти всегда с SIĘ. Будущее: ROZEJDĘ SIĘ, ROZEJDZIESZ SIĘ, повелительное ROZEJDŹ. Прошедшее с E-вставкой: ROZSZEDŁ, но ROZESZŁA, ROZESZLI. Несовершенный вид — ROZCHODZIĆ SIĘ." }
  - { kind: government, text: "Куда — DO или PO: ROZEJŚĆ SIĘ DO DOMÓW, PO MIEŚCIE. С кем — Z с творительным: ROZEJŚĆ SIĘ Z MĘŻEM. О слухах — PO с предложным: PO CAŁEJ WSI." }
  - { kind: pronunciation, text: "Читается «ро́зэйсьць»: JŚĆ — «йсьць», ударение на первом слоге. ROZEJDĘ — «розэ́йдэ», ROZSZEDŁ — «ро́зшэду»." }
  - { kind: register, text: "Нейтральное слово. ROZEJDŹCIE SIĘ! — команда полиции «разойдись!». NASZE DROGI SIĘ ROZESZŁY — книжное «наши пути разошлись»." }
collocations:
  - { pl: "rozejść się do domów", ru: "разойтись по домам" }
  - { pl: "rozejść się z mężem", ru: "расстаться с мужем" }
  - { pl: "wieść się rozeszła", ru: "слух разнёсся" }
family:
  - { pl: "iść", ru: "идти", relation: root, id: isc }
  - { pl: "odejść", ru: "уйти", relation: derived, id: odejsc }
  - { pl: "rozchodzić", ru: "расходиться", relation: aspect }
etymology: "Приставка ROZ- «раз-» плюс IŚĆ «идти», праславянское *jьti. Русское «разойтись» — то же строение и почти те же значения."
memory: "Rozejść się — разойтись: tłum się rozszedł. Rozeszli się — расстались. Wieść się rozeszła — новость разнеслась. Читается «ро́зэйсьць»."
idioms:
  - { pl: "nasze drogi się rozeszły", ru: "наши пути разошлись" }
