etymology: "Из французского CONNAISSEUR, «знаток», от CONNAÎTRE, «знать», из латинского COGNOSCERE. Индоевропейский корень *ǵneh₃- («знать») тот же, что в польском ZNAĆ и русском «знать», так что KONESER — дальний родственник слова «знаток»."
memory: "Koneser — от французского connaisseur, «тот, кто знает»: знаток. Koneser wina — знаток вина, но и шутливо: koneser tanich win."
idioms:
