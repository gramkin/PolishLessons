# review
id: koneser
format: 2
lemma: "koneser"
rank: 6078
pos: noun
pron: { cyr: "конэ́сэр" }
senses:
  - id: connoisseur
    ru: "знаток, ценитель (вина, еды, искусства) — тот, кто разбирается и умеет оценить"
    examples:
      - pl: "Jest prawdziwym koneserem wina."
        ru: "Он настоящий знаток вина."
        source: { kind: authored }
      - pl: "Ta wystawa zachwyci każdego konesera sztuki."
        ru: "Эта выставка восхитит любого ценителя искусства."
        source: { kind: authored }
      - pl: "Nie jestem koneserem, ale ta kawa jest świetna."
        ru: "Я не знаток, но этот кофе отличный."
        source: { kind: authored }
  - id: ironic
    ru: "(шутл., ирон.) «большой знаток» — о любителе чего-то простого или сомнительного"
    examples:
      - pl: "Mój szwagier to koneser tanich win."
        ru: "Мой шурин — большой знаток дешёвых вин."
        source: { kind: authored }
      - pl: "Jako koneser fast foodów polecam ten bar."
        ru: "Как ценитель фастфуда рекомендую эту забегаловку."
        source: { kind: authored }
      - pl: "Ech, ty koneserze!"
        ru: "Эх ты, ценитель!"
        source: { kind: authored }
notes:
  - { kind: usage, text: "KONESER — «знаток и ценитель» в одном слове: он не только разбирается, но и получает удовольствие. Обычно с родительным: koneser wina, koneser sztuki, koneser jazzu. Просто «специалист» — ZNAWCA (znawca tematu, «знаток темы»), а тот, кто любит вкусно поесть, — SMAKOSZ («гурман»). KONESER звучит немного торжественно, поэтому охотно употребляется с иронией: koneser piwa z puszki." }
  - { kind: government, text: "Кого или чего — родительный: koneser wina, koneser dobrej kuchni. Женский род — KONESERKA: koneserka herbaty. Прилагательное — KONESERSKI: koneserski gust, «вкус знатока»; z koneserską miną, «с видом знатока»." }
  - { kind: usage, text: "Мужское-личное существительное: во множественном числе KONESERZY (-r → -rzy, как aktor → aktorzy), винительный множественного совпадает с родительным: znam wielu koneserów. Местный и звательный единственного — KONESERZE: o koneserze, ty koneserze!" }
  - { kind: pronunciation, text: "«конэ́сэр», ударение на предпоследнем слоге, -ne-. Оба E — открытые «э», N и S перед ними не смягчаются. Во множественном KONESERZY — «конэсэ́жы»: RZ звучит как «ж»." }
