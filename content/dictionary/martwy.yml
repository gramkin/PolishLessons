# review
id: martwy
format: 2
lemma: "martwy"
rank: 503
pos: adj
pron: { cyr: "ма́ртвы" }
senses:
  - id: dead
    ru: "мёртвый"
    examples:
      - pl: "Pies jest martwy."
        ru: "Пёс мёртв."
        source: { kind: tatoeba, id: 694384 }
      - pl: "Ptak jest martwy."
        ru: "Птица мертва."
        source: { kind: tatoeba, id: 10616784 }
      - pl: "Myślisz, że jest martwy?"
        ru: "Думаешь, он мёртв?"
        source: { kind: tatoeba, id: 2994934 }
  - id: inactive
    ru: "мёртвый в переносном смысле: недействующий, замерший"
    examples:
      - pl: "Łacina jest językiem martwym."
        ru: "Латынь — мёртвый язык."
        source: { kind: translated, id: 7300007 }
      - pl: "To martwy przepis."
        ru: "Это недействующая норма."
        source: { kind: authored }
      - pl: "Mamy teraz martwy sezon."
        ru: "У нас сейчас мёртвый сезон."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Рядом лежит ловушка: глагол martwić się значит не «умирать», а «беспокоиться». Nie martw się! — «Не волнуйся!»" }
  - { kind: usage, text: "martwa natura — это «натюрморт», а не «мёртвая природа»." }
  - { kind: usage, text: "powstać z martwych — «воскреснуть из мёртвых»; форма martwych здесь работает как существительное, точно как в русском." }
  - { kind: usage, text: "Переносных употреблений много: martwy punkt «тупик», martwy sezon «мёртвый сезон», język martwy «мёртвый язык»." }
collocations:
  - { pl: "martwy język", ru: "мёртвый язык" }
  - { pl: "martwa natura", ru: "натюрморт" }
  - { pl: "martwy punkt", ru: "мёртвая точка; тупик" }
  - { pl: "powstać z martwych", ru: "воскреснуть из мёртвых" }
etymology: "Праславянское *mьrtvъ; русское «мёртвый» — то же самое слово, от корня *merti «умирать»."
memory: "martwy — «мёртвый», слово прозрачное. Ловушка лежит рядом: martwić się значит не «умирать», а «беспокоиться» — Nie martw się! «Не волнуйся!» И запомните два оборота: martwa natura — это «натюрморт», а powstać z martwych — «воскреснуть из мёртвых»."
idioms:
  - { pl: "martwy sezon", ru: "мёртвый сезон" }
  - { pl: "powstać z martwych", ru: "воскреснуть из мёртвых" }
  - { pl: "martwy punkt", ru: "мёртвая точка; тупик" }
