# review
id: przodek
format: 2
lemma: "przodek"
rank: 3884
pos: noun
pron: { cyr: "пшо́дэк" }
senses:
  - id: ancestor
    ru: "предок"
    examples:
      - pl: "Skąd są twoi przodkowie?"
        ru: "Откуда твои предки?"
        source: { kind: tatoeba, id: 12564834 }
      - pl: "Jego przodkowie pochodzą z Irlandii."
        ru: "Его предки родом из Ирландии."
        source: { kind: translated, id: 984347 }
      - pl: "Nie ten jest Tatarem kto ma tatarskich przodków a ten którego potomni są Tatarami!"
        ru: "Не тот татарин, у кого предки татары, а тот, у кого потомки татары!"
        source: { kind: tatoeba, id: 4651856 }
  - id: forerunner
    ru: "предшественник, прародитель (о вещах)"
    examples:
      - pl: "Dyskietka to przodek dysku."
        ru: "Дискета - предок диска."
        source: { kind: tatoeba, id: 749226 }
      - pl: "To plemię czci swoich przodków."
        ru: "Это племя чтит своих предков."
        source: { kind: translated, id: 3865287 }
notes:
  - { kind: government, text: "Мужской ЛИЧНЫЙ род: именительный мн. — przodkowie, а не przodki. Это окончание -owie берут названия людей: ojcowie, panowie, przodkowie." }
  - { kind: false-friend, text: "От przód «перёд», которое уже есть в словаре: предок — тот, кто впереди рода. Русское «предок» собрано тем же способом, от «пред»." }
  - { kind: usage, text: "Противоположность — potomek «потомок», мн. potomkowie." }
  - { kind: usage, text: "О вещах przodek значит «предшественник, ранняя разновидность»: Dyskietka to przodek dysku." }
  - { kind: government, text: "Множественное число — przodkowie: przodki формы не ma, потому что это существительное мужского личного рода." }
collocations:
  - { pl: "nasi przodkowie", ru: "наши предки" }
  - { pl: "czcić przodków", ru: "чтить предков" }
etymology: "От przód «перёд»: предок — тот, кто впереди рода. Русское «предок» от «пред» устроено так же."
memory: "przodek — «предок», от przód «перёд». Главное — множественное число przodkowie на -owie, как у ojcowie и panowie: так делают названия людей. Противоположность — potomek."
idioms:
  - { pl: "nasi przodkowie", ru: "наши предки" }
  - { pl: "czcić przodków", ru: "чтить предков" }
formExamplesSkip:
  - { form: "przodki", reason: "форма образована генератором по ошибке, и примечание к карточке говорит об этом прямо: именительный множественного — przodkowie, а не przodki. Окончание -owie берут названия людей: ojcowie, panowie, przodkowie" }
