lemma: "króliczek"
rank: 5240
pos: noun
pron: { cyr: "крули́чэк" }
senses:
  - id: bunny
    ru: "крольчонок, зайчик"
    examples:
      - pl: "Dzieci karmiły króliczka marchewką."
        ru: "Дети кормили крольчонка морковкой."
        source: { kind: authored }
      - pl: "Na Wielkanoc dostała czekoladowego króliczka."
        ru: "На Пасху ей подарили шоколадного зайчика."
        source: { kind: authored }
      - pl: "Króliczek schował się pod krzakiem."
        ru: "Крольчонок спрятался под кустом."
        source: { kind: authored }
  - id: sweetie
    ru: "зайчик (ласк. обращение)"
    examples:
      - pl: "Mój króliczku, czas spać."
        ru: "Мой зайчик, пора спать."
        source: { kind: authored }
      - pl: "Ale z ciebie słodki króliczek!"
        ru: "Какой же ты сладкий зайчик!"
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "KRÓLICZEK — «крольчонок», уменьшительное от KRÓLIK. Но в обращении — как русский «зайчик»: KRÓLICZKU! Заяц — ZAJĄC, пасхальный зайчик — ZAJĄCZEK WIELKANOCNY, хотя и KRÓLICZEK тоже говорят." }
  - { kind: usage, text: "Мужской род, одушевлённый: винительный KRÓLICZKA. E беглое: KRÓLICZEK, но KRÓLICZKA. Множественное — KRÓLICZKI." }
  - { kind: government, text: "Кормить крольчонка — KARMIĆ KRÓLICZKA, винительный. Заботиться о крольчонке — OPIEKOWAĆ SIĘ KRÓLICZKIEM." }
  - { kind: pronunciation, text: "Читается «крули́чэк»: Ó — «у», CZ — «ч». Ударение на предпоследнем слоге." }
collocations:
  - { pl: "czekoladowy króliczek", ru: "шоколадный зайчик" }
  - { pl: "puszysty króliczek", ru: "пушистый крольчонок" }
  - { pl: "mój króliczku", ru: "мой зайчик" }
