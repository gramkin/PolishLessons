# review
id: podly
format: 2
lemma: "podły"
rank: 3851
pos: adj
pron: { cyr: "по́дуы" }
senses:
  - id: mean
    ru: "подлый, низкий (о человеке, поступке)"
    examples:
      - pl: "To był podły czyn."
        ru: "Это был подлый поступок."
        source: { kind: authored }
      - pl: "Jest podłym kłamcą."
        ru: "Он подлый лжец."
        source: { kind: authored }
      - pl: "Nie znam człowieka podlejszego od niego."
        ru: "Я не знаю человека подлее его."
        source: { kind: authored }
  - id: lousy
    ru: "разг. скверный, паршивый (о качестве, погоде)"
    examples:
      - pl: "Mieliśmy podłą pogodę przez cały tydzień."
        ru: "Всю неделю у нас была паршивая погода."
        source: { kind: authored }
      - pl: "W barze podawali podłe wino."
        ru: "В баре подавали скверное вино."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Русское «подлый» и польское PODŁY совпадают в главном: о низком, бесчестном человеке. Но польское слово шире: о вещах оно значит «паршивый, скверный»: PODŁA KAWA, PODŁY HOTEL, PODŁY NASTRÓJ. Русский о кофе «подлый» не скажет, а поляк скажет запросто." }
  - { kind: usage, text: "Полная парадигма с простыми степенями: PODŁY, PODLEJSZY, NAJPODLEJSZY. Обратите внимание: Ł в сравнительной степени чередуется с L: PODŁY, но PODLEJSZY. Форма для мужчин-людей: PODLI, PODLEJSI, NAJPODLEJSI, тоже с L." }
  - { kind: government, text: "Подлый по отношению к кому-то — PODŁY WOBEC KOGOŚ, WOBEC с родительным. В сравнении — NIŻ или OD с родительным. Само прилагательное падежа не требует." }
  - { kind: pronunciation, text: "Читается «по́дуы», два слога, ударение на первом. Ł — «у», конечная Y — «ы». В PODLEJSZY Ł становится L: «подле́йшы»." }
  - { kind: register, text: "В значении «подлый» — нейтральное, но резкое осуждение. В значении «паршивый» — разговорное: PODŁY HUMOR, «паршивое настроение», PODŁA KNAJPA, «дрянной кабак»." }
collocations:
  - { pl: "podły czyn", ru: "подлый поступок" }
  - { pl: "podła pogoda", ru: "паршивая погода" }
  - { pl: "podły nastrój", ru: "паршивое настроение" }
family:
  - { pl: "podłość", ru: "подлость", relation: derived }
  - { pl: "podle", ru: "подло; паршиво", relation: derived }
  - { pl: "nikczemny", ru: "низкий, гнусный", relation: root }
etymology: "Общеславянское *podlъ, «низкий, нижний», от предлога «под». Подлый — тот, кто стоит внизу. Сначала слово значило «простонародный», без осуждения; потом и в русском, и в польском оно стало моральной оценкой. Польский пошёл дальше и применил его к плохим вещам."
memory: "Podły — подлый: podły czyn. И паршивый: podła pogoda, podłe wino. Podlejszy — ł→l. Читается «по́дуы»."
idioms:
  - { pl: "podły nastrój", ru: "паршивое настроение" }
