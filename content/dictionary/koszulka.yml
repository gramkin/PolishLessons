notes:
  - { kind: false-friend, text: "ИСХОДНОЕ СЛОВО ВАЖНЕЕ УМЕНЬШИТЕЛЬНОГО: KOSZULA ЗНАЧИТ «РУБАШКА». Русского «кошуля» в живом языке нет, так что опереться не на что. А уменьшительное koszulka ушло в самостоятельное значение — это не «рубашечка», а ФУТБОЛКА. Так же разошлись spodnie «брюки» и spodenki «шорты»." }
  - { kind: pronunciation, text: "Четыре слога, ударение на предпоследнем: ko-SZUL-ka. Sz читается как ш: «кошу́лка». Чередования те же, что у walizka и paczka: дательный и предложный дают koszulce с c, родительный множественного — koszulek с беглым e." }
  - { kind: usage, text: "Koszulka это футболка на каждый день и спортивная майка разом: koszulka z krótkim rękawem, koszulka reprezentacji, koszulka lidera. Рубашка с воротником и пуговицами — koszula; блузка — bluzka; толстовка — bluza. Четыре слова, которые легко перепутать между собой." }
collocations:
  - { pl: "koszulka z nadrukiem", ru: "футболка с принтом" }
  - { pl: "koszulka lidera", ru: "майка лидера" }
  - { pl: "koszulka z krótkim rękawem", ru: "футболка с коротким рукавом" }
family:
  - { pl: "koszula", ru: "рубашка", relation: root, id: koszula }
  - { pl: "bluzka", ru: "блузка", relation: derived }
  - { pl: "podkoszulek", ru: "нижняя майка", relation: derived }
etymology: "Уменьшительное от koszula «рубашка», а то — из латинского casula «плащик, покрывальце», пришедшего через германское посредство в раннем Средневековье вместе с самой одеждой. Русский взял для этого предмета другое слово, «рубашка», от «руб» — кусок ткани. Отсюда koszulka, podkoszulek и koszulowy."
memory: "koszulka — «футболка», а не «рубашечка»: исходное koszula значит «рубашка», но уменьшительное ушло в свой смысл. Русской родни нет. Склонение как у paczka и walizka: koszulce с c, koszulek с беглым e."
idioms:
