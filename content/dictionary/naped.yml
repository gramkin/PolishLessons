# review
id: naped
format: 2
lemma: "napęd"
rank: 4597
pos: noun
pron: { cyr: "на́пэнт" }
senses:
  - id: drive
    ru: "привод"
    examples:
      - pl: "Samochód ma napęd na cztery koła."
        ru: "У машины полный привод."
        source: { kind: authored }
      - pl: "Wybrałem model z napędem elektrycznym."
        ru: "Я выбрал модель с электроприводом."
        source: { kind: authored }
      - pl: "Napęd przenosi moc z silnika na koła."
        ru: "Привод передаёт мощность от двигателя на колёса."
        source: { kind: authored }
  - id: driving-force
    ru: "движущая сила, двигатель (перен.)"
    examples:
      - pl: "Turystyka jest napędem gospodarki regionu."
        ru: "Туризм — двигатель экономики региона."
        source: { kind: authored }
      - pl: "Ciekawość to napęd każdej nauki."
        ru: "Любопытство — движущая сила любой науки."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "NAPĘD — «привод», а не «напев». Корень — PĘD «стремительное движение»: NAPĘDZAĆ значит «приводить в движение». Полный привод — NAPĘD NA CZTERY KOŁA. В компьютере NAPĘD — «дисковод»: NAPĘD DVD." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. В местном падеже D перед IE переходит в DZ: W NAPĘDZIE. Родительный — NAPĘDU." }
  - { kind: government, text: "Привод на какие колёса — NA с винительным: NAPĘD NA PRZEDNIE KOŁA. С каким приводом — Z и творительный: Z NAPĘDEM HYBRYDOWYM. Двигатель чего в переносном смысле — родительный: NAPĘD GOSPODARKI." }
  - { kind: pronunciation, text: "Читается «на́пэнт», ударение на первом слоге. Ę перед D звучит «эн», конечное D оглушается в «т». В форме NAPĘDU: «напэ́нду»." }
  - { kind: register, text: "Слово техническое, но обиходное у автомобилистов. Переносное значение, «движущая сила», встречается в газетах. Прилагательное — NAPĘDOWY: SIŁA NAPĘDOWA." }
collocations:
  - { pl: "napęd na cztery koła", ru: "полный привод" }
  - { pl: "napęd elektryczny", ru: "электропривод" }
  - { pl: "napęd hybrydowy", ru: "гибридный привод" }
family:
  - { pl: "pęd", ru: "стремительное движение, порыв", relation: root }
  - { pl: "pędzić", ru: "мчаться; гнать", relation: root, id: pedzic }
  - { pl: "napędzać", ru: "приводить в движение", relation: derived, id: napedzac }
etymology: "От NAPĘDZAĆ, NAPĘDZIĆ «пригнать; привести в движение», от PĘDZIĆ «гнать, мчаться». Привод — то, что «гонит» машину вперёд. D чередуется с DZ: NAPĘD, NAPĘDZIE, PĘDZIĆ."
memory: "Napęd — привод: то, что pędzi, гонит машину. Читается «на́пэнт». Napęd na cztery koła — полный привод. Siła napędowa — движущая сила."
idioms:
  - { pl: "siła napędowa", ru: "движущая сила" }
  - { pl: "nabrać pędu", ru: "набрать обороты" }
