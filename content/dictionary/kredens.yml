# review
id: kredens
format: 2
lemma: "kredens"
rank: 5908
pos: noun
pron: { cyr: "крэ́дэнс" }
senses:
  - id: cupboard
    ru: "буфет, кухонный шкаф для посуды"
    examples:
      - pl: "Włóż to do kredensu."
        ru: "Положи это в буфет."
        source: { kind: translated, id: 12268610 }
      - pl: "Tom znalazł coś schowanego za kredensem."
        ru: "Том нашёл что-то спрятанное за буфетом."
        source: { kind: translated, id: 3886347 }
      - pl: "Co jest w tamtym kredensie?"
        ru: "Что лежит вон в том буфете?"
        source: { kind: translated, id: 12268609 }
      - pl: "Babcia trzymała w kredensie odświętną zastawę."
        ru: "Бабушка хранила в буфете праздничный сервиз."
        source: { kind: authored }
      - pl: "Stary dębowy kredens zajmował pół kuchni."
        ru: "Старый дубовый буфет занимал пол-кухни."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "KREDENS — это мебель: высокий кухонный шкаф-буфет, обычно из двух частей, внизу дверцы, вверху застеклённые полки для посуды. К «кредиту» отношения не имеет. Буфет как место, где продают еду, по-польски BUFET, а не KREDENS." }
  - { kind: usage, text: "Мужской род, неодушевлённый: винительный совпадает с именительным (KUPIĆ KREDENS). Родительный на -U: DO KREDENSU, Z KREDENSU. В местном S смягчается: W KREDENSIE." }
  - { kind: register, text: "Слово немного старомодное, «бабушкино»: в современной кухне чаще говорят SZAFKA KUCHENNA. KREDENS вызывает образ деревянного буфета с резными дверцами и сервизом за стеклом." }
collocations:
  - { pl: "stary kredens", ru: "старый буфет" }
  - { pl: "schować do kredensu", ru: "убрать в буфет" }
  - { pl: "kredens kuchenny", ru: "кухонный буфет" }
family:
  - { pl: "kredensik", ru: "буфетик, маленький буфет", relation: derived }
  - { pl: "szafa", ru: "шкаф", relation: root, id: szafa }
  - { pl: "szuflada", ru: "ящик (выдвижной)", relation: root, id: szuflada }
  - { pl: "naczynie", ru: "посуда, сосуд", relation: root, id: naczynie }
synonyms: ["szafka kuchenna", "bufet"]
etymology: "Из французского CRÉDENCE, которое восходит к итальянскому CREDENZA — так назывался столик или шкаф, где ставили посуду и блюда к столу."
memory: "Kredens — бабушкин буфет с посудой. W kredensie stoją talerze. Не путать с кредитом и с буфетом-столовой (bufet)."
idioms:
  - { pl: "mieć kredens", ru: "иметь кредит, пользоваться доверием (устар.)" }
