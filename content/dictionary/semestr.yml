etymology: "Из латинского слова со значением «шестимесячный»: от «шесть» и «месяц». Русское «семестр» — то же слово."
memory: "Semestr — семестр: zimowy и letni, а не осенний и весенний. Читается «сэ́мэстр». W semestrze — в семестре. Sesja — сессия."
