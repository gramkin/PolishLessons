notes:
  - { kind: false-friend, text: "SEMESTR — «семестр», перевод прямой. Польский учебный год делится на SEMESTR ZIMOWY и SEMESTR LETNI — «зимний» и «летний», а не «осенний» и «весенний». Экзаменационная сессия — SESJA." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Родительный — SEMESTRU. В местном падеже R переходит в RZ: W SEMESTRZE." }
