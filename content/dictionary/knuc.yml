# review
id: knuc
format: 2
lemma: "knuć"
rank: 2267
pos: verb
aspect: imperf
pron: { cyr: "кнуць" }
senses:
  - id: plot
    ru: "замышлять, затевать"
    examples:
      - pl: "Co ty knujesz?"
        ru: "Что ты затеваешь?"
        source: { kind: tatoeba, id: 6406164 }
      - pl: "Co on knuje?"
        ru: "Что он замышляет?"
        source: { kind: translated, id: 2576120 }
      - pl: "Tom coś knuje."
        ru: "Том что-то замышляет."
        source: { kind: translated, id: 10667446 }
  - id: scheme
    ru: "строить козни"
    examples:
      - pl: "Tom na pewno coś knuje."
        ru: "Том наверняка что-то замышляет."
        source: { kind: translated, id: 2786825 }
      - pl: "Knuli przeciwko królowi."
        ru: "Они строили козни против короля."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Почти всегда с неопределённым дополнением: coś knuje «что-то замышляет». Со словом spisek даёт knuć spisek «плести заговор»." }
  - { kind: government, text: "Винительный падеж; против кого — przeciwko с дательным." }
  - { kind: false-friend, text: "Исходно «резать, вырезать по дереву»; значение «замышлять» развилось из образа тайной работы. С русским «кнут» не связано." }
  - { kind: usage, text: "Совершенный вид — uknuć: uknuć spisek «составить заговор»." }
collocations:
  - { pl: "coś knuje", ru: "что-то замышляет" }
  - { pl: "knuć spisek", ru: "плести заговор" }
etymology: "Исходно «резать, вырезать»; значение «замышлять» выросло из образа тайной работы."
memory: "knuć — «замышлять, затевать», почти всегда с coś: coś knuje. Совершенный вид — uknuć, отсюда uknuć spisek «составить заговор»."
idioms:
  - { pl: "coś knuje", ru: "что-то замышляет" }
  - { pl: "knuć spisek", ru: "плести заговор" }
formExamplesSkip:
  - { form: "knuci", reason: "страдательное причастие мужского лица, а замышляют заговор, интригу или месть: примечание к карточке даёт knuć spisek. Человека не замышляют, поэтому формы нет" }
