# review
id: planowac
format: 2
lemma: "planować"
rank: 1129
pos: verb
aspect: imperf
pron: { cyr: "плано́ваць" }
senses:
  - id: plan
    ru: "планировать"
    examples:
      - pl: "Tom planuje wrócić."
        ru: "Том планирует вернуться."
        source: { kind: translated, id: 6949310 }
      - pl: "Planuję tam pojechać."
        ru: "Я планирую туда поехать."
        source: { kind: translated, id: 539729 }
      - pl: "Co planujesz robić?"
        ru: "Что ты планируешь делать?"
        source: { kind: translated, id: 3011883 }
  - id: intend
    ru: "собираться что-то сделать"
    examples:
      - pl: "Planowałem iść, ale zapomniałem."
        ru: "Я планировал пойти, но забыл."
        source: { kind: translated, id: 4917189 }
      - pl: "Tom i Mary planują to zrobić."
        ru: "Том и Мэри планируют это сделать."
        source: { kind: translated, id: 12061947 }
  - id: scheduled
    ru: "planowany — планируемый, запланированный"
    examples:
      - pl: "Konferencja jest planowana w Tokio."
        ru: "Конференция планируется в Токио."
        source: { kind: translated, id: 359763 }
      - pl: "Planowane jest wydanie nowego słownika."
        ru: "Планируется издание нового словаря."
        source: { kind: translated, id: 363514 }
notes:
  - { kind: usage, text: "В польском это слово гораздо разговорнее русского: Planuję pojechać do Krakowa значит просто «Я собираюсь поехать в Краков», без всякой официальности." }
  - { kind: government, text: "planować coś — винительный падеж, и planować + инфинитив: Planuję zostać tydzień «Я собираюсь остаться на неделю»." }
  - { kind: usage, text: "Совершенный вид — zaplanować. Отглагольное planowanie значит «планирование»: dział planowania «отдел планирования»." }
  - { kind: usage, text: "Причастие planowany работает как прилагательное: planowana wizyta «запланированный визит»." }
collocations:
  - { pl: "planować wyjazd", ru: "планировать поездку" }
  - { pl: "planuję pojechać", ru: "я собираюсь поехать" }
  - { pl: "dział planowania", ru: "отдел планирования" }
  - { pl: "zgodnie z planem", ru: "по плану" }
family:
  - { pl: "zaplanować", ru: "запланировать", relation: aspect }
  - { pl: "plan", ru: "план", relation: root, id: plan }
  - { pl: "planowany", ru: "планируемый", relation: derived }
etymology: "От plan, пришедшего через немецкое Plan из французского plan «чертёж, замысел». Русское «планировать» — то же заимствование."
memory: "planować — «планировать», но по-польски это ещё и обычное разговорное «собираться»: Planuję pojechać do Krakowa «Я собираюсь поехать в Краков». Совершенный вид — zaplanować."
idioms:
