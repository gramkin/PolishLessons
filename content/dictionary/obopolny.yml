lemma: "obopólny"
rank: 2165
pos: adj
pron: { cyr: "обопу́льны" }
senses:
  - id: mutual
    ru: "обоюдный, взаимный"
    examples:
      - pl: "To była obopólna zgoda."
        ru: "Это было обоюдное согласие."
        source: { kind: authored }
      - pl: "Decyzja zapadła za obopólną zgodą."
        ru: "Решение принято по обоюдному согласию."
        source: { kind: authored }
      - pl: "Korzyść jest obopólna."
        ru: "Выгода обоюдная."
        source: { kind: authored }
  - id: reciprocal
    ru: "двусторонний (о согласии, интересе)"
    examples:
      - pl: "Umowa daje obopólne korzyści."
        ru: "Договор даёт обоюдные выгоды."
        source: { kind: authored }
      - pl: "Panowała obopólna sympatia."
        ru: "Царила обоюдная симпатия."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Живёт прежде всего в юридической формуле za obopólną zgodą «по обоюдному согласию»." }
  - { kind: false-friend, text: "Собрано из oba «оба» и pół «половина»: буквально «с обеих половин». Русское «обоюдный» построено точно так же — «оба» + «уд» (часть)." }
  - { kind: government, text: "Обычное прилагательное; наречие — obopólnie." }
  - { kind: usage, text: "В корпусе слово не встречается, поэтому все примеры составлены вручную. Синоним — wzajemny «взаимный»." }
collocations:
  - { pl: "za obopólną zgodą", ru: "по обоюдному согласию" }
  - { pl: "obopólna korzyść", ru: "обоюдная выгода" }
etymology: "oba «оба» + pół «половина»: буквально «с обеих сторон». Русское «обоюдный» собрано тем же способом."
memory: "obopólny — «обоюдный», из oba + pół. Главная формула — za obopólną zgodą «по обоюдному согласию»."
idioms:
  - { pl: "za obopólną zgodą", ru: "по обоюдному согласию" }
formExamplesSkip:
  - { form: "obopólni", reason: "мужско-личная форма множественного числа, а obopólny говорится о том, что идёт с обеих сторон: obopólna zgoda, obopólne korzyści, obopólne zobowiązania. Людей этим словом не описывают, поэтому формы obopólni в текстах нет" }
