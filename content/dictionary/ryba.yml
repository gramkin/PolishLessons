pos: noun
pron: { cyr: "ры́ба" }
senses:
  - id: fish
    ru: "рыба"
    examples:
      - pl: "To jest ryba."
        ru: "Это рыба."
        source: { kind: translated, id: 3048297 }
      - pl: "Ryby żyją w morzu."
