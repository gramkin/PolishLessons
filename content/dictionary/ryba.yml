        ru: "Рыбы спят?"
        source: { kind: translated, id: 12470079 }
  - id: eat-catch
    ru: "jeść ryby, łowić ryby — есть рыбу, ловить рыбу"
    examples:
      - pl: "Jedzenie ryb jest dobre dla twego zdrowia."
        ru: "Есть рыбу полезно для здоровья."
        source: { kind: translated, id: 1353358 }
      - pl: "On lubi łowić ryby."
        ru: "Он любит ловить рыбу."
        source: { kind: translated, id: 563388 }
      - pl: "Złowił trzy ryby."
        ru: "Он поймал три рыбы."
        source: { kind: translated, id: 933329 }
  - id: fishing
    ru: "na rybach — на рыбалке"
    note: "Буквально «на рыбах»; русское «на рыбалке» устроено иначе."
    examples:
      - pl: "Jak było na rybach?"
        ru: "Как было на рыбалке?"
        source: { kind: translated, id: 4124398 }
      - pl: "Kiedy ostatnio byłeś na rybach?"
        ru: "Когда ты последний раз был на рыбалке?"
        source: { kind: translated, id: 6729237 }
      - pl: "W tym tygodniu byłem na rybach."
        ru: "На этой неделе я был на рыбалке."
        source: { kind: translated, id: 7938263 }
notes:
  - { kind: usage, text: "iść na ryby «идти на рыбалку», być na rybach «быть на рыбалке» — буквально «на рыбы, на рыбах». Русский берёт отдельное слово «рыбалка», польский обходится самой рыбой." }
  - { kind: usage, text: "Ryba psuje się od głowy — «рыба гниёт с головы», совпадает с русским дословно." }
  - { kind: usage, text: "gruba ryba — «большая шишка», о важном человеке. Буквально «толстая рыба»." }
  - { kind: usage, text: "czuć się jak ryba w wodzie — «чувствовать себя как рыба в воде», тоже полное совпадение." }
collocations:
  - { pl: "łowić ryby", ru: "ловить рыбу" }
  - { pl: "iść na ryby", ru: "идти на рыбалку" }
  - { pl: "gruba ryba", ru: "большая шишка" }
  - { pl: "ryba morska", ru: "морская рыба" }
family:
  - { pl: "rybak", ru: "рыбак", relation: derived }
  - { pl: "rybny", ru: "рыбный", relation: derived }
  - { pl: "łowić", ru: "ловить", relation: derived }
etymology: "Праславянское *ryba — то же слово, что русская «рыба», и в большинстве славянских языков оно звучит почти одинаково."
memory: "ryba — «рыба», без подвохов. Но «рыбалка» по-польски обходится самой рыбой: iść na ryby «идти на рыбалку», być na rybach «быть на рыбалке». И gruba ryba — это «большая шишка»."
idioms:
  - { pl: "gruba ryba", ru: "большая шишка" }
  - { pl: "czuć się jak ryba w wodzie", ru: "чувствовать себя как рыба в воде" }
  - { pl: "ryba psuje się od głowy", ru: "рыба гниёт с головы" }
  - { pl: "iść na ryby", ru: "идти на рыбалку" }
formExamplesSkip:
