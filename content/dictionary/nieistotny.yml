notes:
  - { kind: false-friend, text: "Русскому NIEISTOTNY кажется связанным с «истиной» или «истошным», но это не так. ISTOTNY значит «существенный», от ISTOTA, «сущность, существо». NIEISTOTNY — «несущественный». Русское «неистовый», «бешеный», здесь ни при чём, хотя звучит похоже: по-польски это SZALONY или ZAPAMIĘTAŁY." }
  - { kind: usage, text: "Сравнивается описательно: MNIEJ ISTOTNY, «менее существенный», а не NIEISTOTNIEJSZY. Формы для мужчин-людей NIEISTOTNI в карточке нет: несущественными бывают детали и вопросы. Остальные десять форм живые. Очень частое безличное TO NIEISTOTNE, «это неважно»." }
  - { kind: government, text: "Неважно для кого-то — NIEISTOTNY DLA KOGOŚ, DLA с родительным. Неважно, кто, что — NIEISTOTNE, KTO, NIEISTOTNE, CO: это сказуемое в среднем роде без связки или с JEST." }
  - { kind: pronunciation, text: "Читается «неисто́тны», четыре слога, ударение на предпоследнем. NIE и I стоят рядом, но не сливаются: «не-и». TO — чёткое «то», TNY — плотное «тны». Сравните с ISTOTNY «исто́тны»." }
  - { kind: register, text: "Нейтральное слово, с книжным оттенком, частое в спорах, на совещаниях и в научных текстах: STATYSTYCZNIE NIEISTOTNY, «статистически незначимый». В быту чаще скажут NIEWAŻNE или TO BEZ ZNACZENIA." }
collocations:
  - { pl: "nieistotny szczegół", ru: "несущественная деталь" }
  - { pl: "to nieistotne", ru: "это неважно" }
  - { pl: "statystycznie nieistotny", ru: "статистически незначимый" }
family:
  - { pl: "istotny", ru: "существенный", relation: root, id: istotny }
  - { pl: "istota", ru: "сущность; существо", relation: root, id: istota }
  - { pl: "ważny", ru: "важный", relation: root, id: wazny }
etymology: "От ISTOTNY «существенный», а то от ISTOTA «сущность, существо», общеславянского корня *istъ «тот самый, истинный». Русское «истинный», «истый» — родня: ISTOTA когда-то значила «подлинное бытие». Отрицание NIE- даёт «то, что не касается сути»."
memory: "Nieistotny — несущественный, неважный: nieistotny szczegół, to nieistotne. Не «неистовый»! От istota — сущность. Читается «неисто́тны»."
idioms:
  - { pl: "to nieistotne", ru: "это неважно, это к делу не относится" }
formExamplesSkip:
  - { form: "nieistotni", reason: "форма для мужчин-людей: людей так не описывают" }
