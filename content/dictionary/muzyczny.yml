etymology: "Через латинское MUSICA из греческого, где слово значило «искусство муз». Тем же путём пришло и русское «музыка», так что корень общий и узнаётся сразу. Разошлись языки в суффиксах: польский взял латинское -ICUS и получил MUZYCZNY для предметов, а для людей построил отдельное MUZYKALNY на суффиксе -ALNY. Русский обоими смыслами нагрузил одно слово «музыкальный», и отсюда вся путаница."
memory: "Относится только к музыке как к делу: szkola muzyczna, instrument muzyczny, sluch muzyczny. А человек со слухом — muzykalny, и это главное, что надо запомнить, потому что русское «музыкальный» покрывает оба смысла. Отсюда и отсутствие формы muzyczni: людей это слово не описывает. Читается «музы́чны», с «ы» и в середине, и на конце. Суффикс -iczny равен русскому «-ический»."
idioms:
  - { pl: "słuch muzyczny", ru: "музыкальный слух" }
formExamplesSkip:
