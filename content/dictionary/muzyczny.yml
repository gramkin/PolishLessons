notes:
  - { kind: false-friend, text: "Русское «музыкальный» покрывает два смысла: музыкальная школа и музыкальный мальчик. Польский их разделил. MUZYCZNY относится только к музыке как к делу: SZKOŁA MUZYCZNA, INSTRUMENT MUZYCZNY, TEATR MUZYCZNY. А человек со слухом — MUZYKALNY, и только так. Сказать MUZYCZNY CHŁOPIEC нельзя, это звучит как «мальчик, относящийся к музыке». Поэтому и формы для мужчин-людей у слова нет." }
  - { kind: usage, text: "В таблице одиннадцать форм, но живых десять. Одиннадцатая — MUZYCZNI, именительный множественного для мужчин-людей, и её не употребляют, потому что прилагательное относительное: людей оно не описывает. Про людей говорят MUZYKALNI. Примеров к этой форме в карточке поэтому нет. Суффикс -ICZNY прямо отвечает русскому «-ический», и это правило работает на сотнях слов." }
  - { kind: government, text: "В устойчивых названиях прилагательное стоит после существительного, и порядок закреплён: SZKOŁA MUZYCZNA, TEATR MUZYCZNY, SŁUCH MUZYCZNY, OPRAWA MUZYCZNA. В музыкальной школе — W SZKOLE MUZYCZNEJ, местный падеж. В музыкальную школу — DO SZKOŁY MUZYCZNEJ, предлог DO с родительным, тогда как русский скажет «в школу», с винительным. Это обычная польская особенность: DO там, где у нас «в»." }
  - { kind: pronunciation, text: "Читается «музы́чны», три слога, ударение на предпоследнем. Буква Y даёт «ы» и в середине, и на конце, поэтому слово и начинается с «музы», и кончается на «ны», а не на «ный». Сочетание CZ даёт «ч». В женском роде MUZYCZNA это «музы́чна», в среднем MUZYCZNE — «музы́чнэ», с «э» на конце." }
  - { kind: register, text: "Слово нейтральное, из обычного языка школы, театра и радио. Самые частые сочетания — SZKOŁA MUZYCZNA, SŁUCH MUZYCZNY, AUDYCJA MUZYCZNA «музыкальная передача», OPRAWA MUZYCZNA «музыкальное оформление». В разговоре о человеке его не употребляют вовсе: там работает MUZYKALNY, и путаница этих двух слов — самая частая ошибка русскоязычных." }
