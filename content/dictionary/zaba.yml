        source: { kind: tatoeba, id: 12678620 }
  - id: toad-contrast
    ru: "лягушка (в противопоставлении жабе)"
    examples:
      - pl: "Nie umiem odróżnić żaby od ropuchy."
        ru: "Я не могу отличить лягушку от жабы."
        source: { kind: tatoeba, id: 596511 }
      - pl: "Nie potrafię odróżnić żaby od ropuchy."
        ru: "Я не могу отличить жабу от лягушки."
        source: { kind: tatoeba, id: 600335 }
notes:
  - { kind: false-friend, text: "ГЛАВНОЕ: żaba — это ЛЯГУШКА, а русская «жаба» по-польски ropucha. Слова одного корня, но обозначают разных животных — корпус прямо это подчёркивает: Żaba to nie to samo, co ropucha." }
  - { kind: government, text: "Женский род: ta żaba, tej żaby. Родительный мн. — żab." }
  - { kind: usage, text: "Mieć żabę w gardle — «ком в горле», буквально «лягушка в горле». Русский оборот про жабу («жаба душит») значит совсем другое." }
  - { kind: usage, text: "Головастик — kijanka; из них и развиваются żaby." }
collocations:
  - { pl: "mieć żabę w gardle", ru: "ком в горле" }
etymology: "Праславянское *žaba; русская «жаба» — то же слово, но в польском оно значит лягушку."
memory: "żaba — это ЛЯГУШКА, а жаба по-польски ropucha. Оборот mieć żabę w gardle значит «ком в горле»."
idioms:
  - { pl: "mieć żabę w gardle", ru: "ком в горле" }
