pos: noun
pron: { cyr: "жа́ба" }
senses:
  - id: frog
    ru: "лягушка"
    examples:
      - pl: "Żaba zdawała się martwą."
        ru: "Лягушка казалась мёртвой."
        source: { kind: tatoeba, id: 12759323 }
      - pl: "Żaby jedzą owady."
        ru: "Лягушки едят насекомых."
        source: { kind: tatoeba, id: 6305678 }
      - pl: "Żaba to nie to samo, co ropucha."
