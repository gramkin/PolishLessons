# review
id: utrzymac
format: 2
lemma: "utrzymać"
rank: 1241
pos: verb
aspect: perf
pron: { cyr: "утшы́маць" }
senses:
  - id: support
    ru: "содержать (семью), прокормить"
    examples:
      - pl: "Pracowałem ciężko aby utrzymać moją rodzinę."
        ru: "Я тяжело работал, чтобы содержать семью."
        source: { kind: translated, id: 372458 }
      - pl: "Jego pensja jest zbyt mała, by utrzymać rodzinę."
        ru: "Его зарплаты слишком мало, чтобы содержать семью."
        source: { kind: translated, id: 354074 }
      - pl: "Zarabia za mało, by się utrzymać."
        ru: "Он зарабатывает слишком мало, чтобы прожить."
        source: { kind: translated, id: 749250 }
  - id: maintain
    ru: "удержать, сохранить (форму, равновесие, погоду)"
    examples:
      - pl: "Ćwiczę, żeby utrzymać formę."
        ru: "Я тренируюсь, чтобы поддерживать форму."
        source: { kind: translated, id: 4439007 }
      - pl: "Utrzymał równowagę."
        ru: "Он удержал равновесие."
        source: { kind: translated, id: 2571066 }
      - pl: "Dobra pogoda się utrzyma."
        ru: "Хорошая погода удержится."
        source: { kind: translated, id: 357643 }
  - id: upkeep
    ru: "utrzymanie — содержание, расходы на жизнь"
    examples:
      - pl: "Koszty utrzymania rosną."
        ru: "Расходы на жизнь растут."
        source: { kind: translated, id: 8760728 }
      - pl: "Utrzymanie tego domu sporo kosztuje."
        ru: "Содержание этого дома стоит немало."
        source: { kind: translated, id: 735686 }
      - pl: "Mam rodzinę na utrzymaniu."
        ru: "У меня семья на содержании."
        source: { kind: translated, id: 7868685 }
notes:
  - { kind: government, text: "utrzymać kogoś «содержать кого-то» — винительный. Возвратное utrzymać się значит «прокормиться, продержаться»: Zarabia za mało, by się utrzymać." }
  - { kind: usage, text: "Отглагольное существительное utrzymanie очень частотно: koszty utrzymania «стоимость жизни», mieć kogoś na utrzymaniu «содержать кого-то»." }
  - { kind: usage, text: "О погоде и тенденциях значит «удержаться, сохраниться»: Dobra pogoda się utrzyma «Хорошая погода удержится»." }
  - { kind: usage, text: "Вид совершенный; несовершенный — utrzymywać. Корень — trzymać «держать»." }
collocations:
  - { pl: "utrzymać rodzinę", ru: "содержать семью" }
  - { pl: "koszty utrzymania", ru: "стоимость жизни" }
  - { pl: "utrzymać się", ru: "продержаться, прокормиться" }
etymology: "Приставка u- и trzymać «держать». Буквально «удержать» — отсюда и «содержать семью», и «сохранить форму»."
memory: "utrzymać — от trzymać «держать»: «удержать, сохранить» и «содержать»: utrzymać rodzinę «содержать семью». Существительное utrzymanie значит «содержание»: koszty utrzymania «стоимость жизни». Несовершенный вид — utrzymywać."
idioms:
  - { pl: "koszty utrzymania", ru: "стоимость жизни" }
  - { pl: "utrzymać rodzinę", ru: "содержать семью" }
  - { pl: "utrzymać się na powierzchni", ru: "удержаться на плаву" }
