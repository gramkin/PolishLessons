# review
id: samotny
format: 2
lemma: "samotny"
rank: 1111
pos: adj
pron: { cyr: "само́тны" }
senses:
  - id: lonely
    ru: "одинокий (о человеке, о чувстве)"
    examples:
      - pl: "Jestem samotny."
        ru: "Я одинок."
        source: { kind: translated, id: 8432598 }
      - pl: "Ona była samotna."
        ru: "Она была одинока."
        source: { kind: translated, id: 13069410 }
      - pl: "Czuję się samotny."
        ru: "Я чувствую себя одиноким."
        source: { kind: translated, id: 2148531 }
  - id: alone
    ru: "одиночный, в одиночку (о действии)"
    examples:
      - pl: "Ona lubi samotne spacery."
        ru: "Она любит одинокие прогулки."
        source: { kind: translated, id: 958920 }
      - pl: "Nie znoszę samotnego życia."
        ru: "Я не выношу одинокой жизни."
        source: { kind: translated, id: 903412 }
  - id: solitary
    ru: "уединённый, стоящий особняком"
    examples:
      - pl: "Ciotka mieszka w samotnym domu na wsi."
        ru: "Тётя живёт в уединённом доме в деревне."
        source: { kind: translated, id: 923177 }
      - pl: "W akwarium pływał samotny błazenek."
        ru: "В аквариуме плавала одинокая рыба-клоун."
        source: { kind: tatoeba, id: 6406076 }
notes:
  - { kind: false-friend, text: "Различайте sam и samotny: sam значит «сам, один» как факт (Jestem sam «Я один дома»), а samotny — «одинокий» как состояние и чувство (Jestem samotny «Мне одиноко»)." }
  - { kind: usage, text: "samotna matka «мать-одиночка», samotny ojciec «отец-одиночка» — стандартные термины, не эмоциональная оценка." }
  - { kind: usage, text: "Склоняется как обычное прилагательное: samotny, samotna, samotne, samotnego, samotnym." }
  - { kind: usage, text: "samotny wilk «одинокий волк» и samotny jak palec «одинокий как перст» — обороты совпадают с русскими." }
collocations:
  - { pl: "samotna matka", ru: "мать-одиночка" }
  - { pl: "czuć się samotnym", ru: "чувствовать себя одиноким" }
  - { pl: "samotny wilk", ru: "одинокий волк" }
  - { pl: "samotne życie", ru: "одинокая жизнь" }
family:
  - { pl: "sam", ru: "сам, один", relation: root }
  - { pl: "samotność", ru: "одиночество", relation: derived }
  - { pl: "samotnie", ru: "одиноко, в одиночку", relation: derived }
etymology: "От sam «сам, один» плюс суффикс -otny. Русское «одинокий» собрано от «один» — ровно та же модель."
memory: "samotny — «одинокий». Корень тот же, что в sam «сам, один», но sam говорит о факте, а samotny о чувстве: Jestem sam «Я один» против Jestem samotny «Мне одиноко»."
idioms:
  - { pl: "samotny jak palec", ru: "одинокий как перст" }
  - { pl: "samotny wilk", ru: "одинокий волк" }
  - { pl: "samotna matka", ru: "мать-одиночка" }
