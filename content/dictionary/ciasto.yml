  - { kind: usage, text: "ciasto francuskie — «слоёное тесто», ciasto drożdżowe — «дрожжевое тесто»." }
  - { kind: government, text: "Угощаться пирогом — częstować się ciastem (творительный падеж); кусок пирога — kawałek ciasta (родительный)." }
  - { kind: usage, text: "Торт как отдельное праздничное изделие — tort; ciasto скорее домашняя выпечка, пирог." }
