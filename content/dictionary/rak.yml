id: rak
format: 2
lemma: "rak"
rank: 1545
pos: noun
pron: { cyr: "рак" }
senses:
  - id: disease
    ru: "рак (болезнь)"
    examples:
      - pl: "Rak jest okropną chorobą."
        ru: "Рак — ужасная болезнь."
        source: { kind: translated, id: 5956214 }
      - pl: "Mój brat umarł na raka."
        ru: "Мой брат умер от рака."
        source: { kind: tatoeba, id: 6895466 }
      - pl: "Czy rak jest dziedziczny?"
        ru: "Рак наследственный?"
        source: { kind: translated, id: 3744835 }
  - id: animal
    ru: "рак (речной)"
    examples:
      - pl: "Kraby, homary, raki i krewetki to skorupiaki."
        ru: "Крабы, омары, раки и креветки — ракообразные."
        source: { kind: translated, id: 10468203 }
      - pl: "W czystej rzece żyją raki."
        ru: "В чистой реке живут раки."
        source: { kind: authored }
  - id: metaphor
    ru: "рак (о разрушительном явлении)"
    examples:
      - pl: "Przemoc to rak naszego społeczeństwa."
        ru: "Насилие — рак нашего общества."
        source: { kind: translated, id: 362074 }
      - pl: "Narkotyki to rak współczesnego społeczeństwa."
        ru: "Наркотики — рак современного общества."
        source: { kind: translated, id: 983408 }
notes:
  - { kind: usage, text: "Одно слово покрывает и болезнь, и животное — как в русском. Различает контекст: umrzeć na raka «умереть от рака», но łowić raki «ловить раков»." }
  - { kind: government, text: "«Умереть от рака» — umrzeć na raka, винительный падеж с предлогом na, а не родительный." }
  - { kind: usage, text: "Переносное значение живое: Narkotyki to rak współczesnego społeczeństwa «Наркотики — рак современного общества»." }
  - { kind: usage, text: "Отсюда же raki «кошки» — альпинистские шипы на ботинки, и chodzić rakiem «пятиться задом»." }
collocations:
  - { pl: "umrzeć na raka", ru: "умереть от рака" }
  - { pl: "rak płuc", ru: "рак лёгких" }
  - { pl: "badania nad rakiem", ru: "исследования рака" }
etymology: "Праславянское *rakъ — то же слово, что русское «рак». Значение «болезнь» — калька с латинского cancer, которое тоже значило и животное, и опухоль; русский и польский переняли эту метафору одинаково."
memory: "rak — и «рак» (болезнь), и «рак» (животное), точно как в русском. Запомните управление: umrzeć na raka «умереть от рака» — винительный с предлогом na. И переносное: rak społeczeństwa «рак общества»."
