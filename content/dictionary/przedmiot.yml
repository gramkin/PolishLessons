notes:
  - { kind: false-friend, text: "ОБА ЯЗЫКА ПЕРЕВЕЛИ ОДНО ЛАТИНСКОЕ СЛОВО ОДИНАКОВО. Латинское obiectum значит «брошенное перед», из ob- «перед» и iacere «бросать». Польский перевёл его как przed plus miot от miotać «метать», русский — как «пред» плюс «мет». Два языка, не сговариваясь, собрали одно и то же слово из своих частей, и все три значения у них совпадают." }
  - { kind: pronunciation, text: "ПРЕДЛОЖНЫЙ ПАДЕЖ СМЯГЧАЕТ T В CI: W PRZEDMIOCIE. Тот же переход, что в ekspert — ekspercie и eksperyment — eksperymencie. Группа prz звучит как «пш», mio — как «мё»: «пшэ́дмёт»." }
  - { kind: usage, text: "В школьном значении предлог особый: ocena Z przedmiotu, egzamin Z matematyki — с родительным, как русское «по». Прилагательное przedmiotowy значит «предметный», а nauczyciel przedmiotowy — учитель-предметник. Юридический оборот: przedmiot umowy «предмет договора»." }
collocations:
  - { pl: "przedmiot szkolny", ru: "школьный предмет" }
  - { pl: "przedmiot umowy", ru: "предмет договора" }
  - { pl: "przedmiot sporu", ru: "предмет спора" }
family:
  - { pl: "rzecz", ru: "вещь", relation: root, id: rzecz }
  - { pl: "miotać", ru: "метать", relation: root }
  - { pl: "przedmiotowy", ru: "предметный", relation: derived }
etymology: "Калька латинского obiectum «брошенное перед»: przed отвечает латинскому ob-, а miot — корню iacere «бросать», тому же, что в miotać «метать». Русское «предмет» сделано по той же мерке из «пред» и «мет». Обе кальки появились в учёном языке примерно в одно время, поэтому и значения разошлись одинаково мало."
memory: "przedmiot — «предмет» во всех смыслах: вещь, школьный предмет, тема. Слово собрано как русское: przed плюс miot от miotać «метать», калька латинского obiectum. Предложный смягчает t: w przedmiocie."
idioms:
