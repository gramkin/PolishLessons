synonyms: ["kałuża", "sadzawka"]
etymology: "Заимствовано из украинского БАЮРА «яма с водой, лужа»."
memory: "Bajoro — грязная лужа, болотце. W bajorze — в луже (R → RZ). Перен.: polityczne bajoro — политическое болото."
