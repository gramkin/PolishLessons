id: bajoro
format: 2
lemma: "bajoro"
rank: 5915
pos: noun
pron: { cyr: "баё́ро" }
senses:
  - id: puddle
    ru: "грязная лужа, топкая яма с водой, болотце"
    examples:
      - pl: "Za stodołą było błotniste bajoro."
        ru: "За амбаром была грязная лужа."
        source: { kind: authored }
      - pl: "Samochód utknął w głębokim bajorze."
        ru: "Машина застряла в глубокой луже."
        source: { kind: authored }
      - pl: "Po ulewie droga zamieniła się w bajoro."
        ru: "После ливня дорога превратилась в болото."
        source: { kind: authored }
      - pl: "Kaczki pływały po zielonym bajorze."
        ru: "Утки плавали по зелёному болотцу."
        source: { kind: authored }
  - id: mire
    ru: "болото, трясина (перен.: о грязной среде)"
    examples:
      - pl: "Nie chcę się mieszać w to polityczne bajoro."
        ru: "Не хочу ввязываться в это политическое болото."
        source: { kind: authored }
      - pl: "Wciągnęli go w bajoro plotek i intryg."
        ru: "Его втянули в болото сплетен и интриг."
        source: { kind: authored }
notes:
  - { kind: usage, text: "BAJORO — это не пруд (STAW) и не озеро, а мутная стоячая вода с грязью: большая лужа на дороге, заросшая яма у сарая. Слово всегда с оттенком «грязно, неприятно». Обычная лужа после дождя — KAŁUŻA." }
  - { kind: usage, text: "Средний род на -O. В местном R переходит в RZ: W BAJORZE. Родительный множественного без окончания: BAJOR." }
  - { kind: register, text: "В переносном смысле — «болото, грязь» о среде, где всё нечисто: POLITYCZNE BAJORO, BAJORO PLOTEK. Оценка резко отрицательная, как у русского «болото» в том же значении." }
collocations:
  - { pl: "błotniste bajoro", ru: "грязная лужа, болотце" }
  - { pl: "wpaść do bajora", ru: "упасть в лужу" }
  - { pl: "polityczne bajoro", ru: "политическое болото" }
family:
