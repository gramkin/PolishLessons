# review
id: zemdlec
format: 2
lemma: "zemdleć"
rank: 3993
pos: verb
pron: { cyr: "зэ́мдлець" }
senses:
  - id: faint
    ru: "упасть в обморок, потерять сознание"
    examples:
      - pl: "Zemdlał z gorąca w autobusie."
        ru: "В автобусе он упал в обморок от жары."
        source: { kind: authored }
      - pl: "Zemdlała na koncercie."
        ru: "Она потеряла сознание на концерте."
        source: { kind: authored }
      - pl: "Tylko nie zemdlej!"
        ru: "Только не падай в обморок!"
        source: { kind: authored }
  - id: nearly-faint
    ru: "перен. чуть не упасть в обморок (от удивления)"
    examples:
      - pl: "Prawie zemdlała z wrażenia."
        ru: "Она чуть не упала в обморок от впечатления."
        source: { kind: authored }
      - pl: "Zemdlejesz, jak zobaczysz cenę."
        ru: "Упадёшь в обморок, когда увидишь цену."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ZEMDLEĆ — «упасть в обморок», а не «замедлить»: «замедлить» — ZWOLNIĆ. Обморок — OMDLENIE. Родственное MDŁY — «пресный, тошнотворный»." }
  - { kind: usage, text: "Сорок одна форма: безличная ZEMDLANO не употребляется. Спряжение: ZEMDLEJĘ, ZEMDLEJESZ; повелительное ZEMDLEJ — обычно с отрицанием: NIE ZEMDLEJ! Прошедшее: ZEMDLAŁ, но ZEMDLELI. Несовершенный вид — MDLEĆ." }
  - { kind: government, text: "От чего — Z с родительным: ZEMDLEĆ Z GŁODU, Z GORĄCA. При виде чего — NA WIDOK с родительным: NA WIDOK KRWI." }
  - { kind: pronunciation, text: "Читается «зэ́мдлець»: MDL — три согласных подряд, ударение на первом слоге. ZEMDLEJĘ — «зэмдле́е»." }
  - { kind: register, text: "Нейтральное слово. O MAŁO NIE ZEMDLAŁEM — разговорное «чуть в обморок не упал». В медицине — STRACIĆ PRZYTOMNOŚĆ." }
collocations:
  - { pl: "zemdleć z gorąca", ru: "упасть в обморок от жары" }
  - { pl: "zemdleć na widok krwi", ru: "упасть в обморок при виде крови" }
  - { pl: "o mało nie zemdleć", ru: "чуть не упасть в обморок" }
family:
  - { pl: "mdły", ru: "пресный; тошнотворный", relation: root }
  - { pl: "omdlenie", ru: "обморок", relation: derived }
  - { pl: "mdleć", ru: "слабеть, терять сознание", relation: aspect }
etymology: "Приставка Z- плюс MDLEĆ «слабеть», от MDŁY «вялый, пресный», праславянское *mьdlъ. Русское «медлить», «медленный» — родственные слова: общий смысл «вялость, слабость»."
memory: "Zemdleć — упасть в обморок: zemdlał z gorąca. Omdlenie — обморок. Nie zemdlej! — не падай в обморок! Читается «зэ́мдлець»."
idioms:
  - { pl: "o mało nie zemdleć z wrażenia", ru: "чуть не упасть в обморок от впечатления" }
formExamplesSkip:
  - { form: "zemdlano", reason: "безличная форма неупотребительна" }
