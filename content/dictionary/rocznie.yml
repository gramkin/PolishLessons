# review
id: rocznie
format: 2
lemma: "rocznie"
rank: 4817
pos: adv
pron: { cyr: "ро́чне" }
senses:
  - id: per-year
    ru: "в год"
    examples:
      - pl: "Ile zarabiasz rocznie?"
        ru: "Сколько ты зарабатываешь в год?"
        source: { kind: authored }
      - pl: "Muzeum odwiedza rocznie pół miliona turystów."
        ru: "Музей посещают полмиллиона туристов в год."
        source: { kind: authored }
      - pl: "Opłata wynosi sto złotych rocznie."
        ru: "Сбор составляет сто злотых в год."
        source: { kind: authored }
  - id: yearly
    ru: "ежегодно, раз в год"
    examples:
      - pl: "Przegląd techniczny robi się raz rocznie."
        ru: "Техосмотр проходят раз в год."
        source: { kind: authored }
      - pl: "Rocznie produkujemy dziesięć tysięcy rowerów."
        ru: "Ежегодно мы выпускаем десять тысяч велосипедов."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ROCZNIE — «в год», от ROK «год». Русское «рок» значит «судьба», а польское ROK — обычный календарный год. ROCZNY — «годовой» и «годовалый»: ROCZNY RAPORT, ROCZNE DZIECKO." }
  - { kind: usage, text: "Наречие, одна форма, без степеней. Обычно при числах и суммах: MILION ROCZNIE, DWA RAZY ROCZNIE. Синонимы — NA ROK, W SKALI ROKU, разговорное W ROKU." }
  - { kind: government, text: "Наречие ничем не управляет. По той же модели: DZIENNIE «в день», TYGODNIOWO «в неделю», MIESIĘCZNIE «в месяц»." }
  - { kind: pronunciation, text: "Читается «ро́чне», ударение на первом слоге. CZNIE — «чне»." }
collocations:
  - { pl: "zarabiać rocznie", ru: "зарабатывать в год" }
  - { pl: "dwa razy rocznie", ru: "два раза в год" }
  - { pl: "milion rocznie", ru: "миллион в год" }
family:
  - { pl: "rok", ru: "год", relation: root, id: rok }
  - { pl: "roczny", ru: "годовой; годовалый", relation: root }
  - { pl: "rocznica", ru: "годовщина", relation: root, id: rocznica }
etymology: "От ROCZNY «годовой», а то — от ROK «год». Исходное славянское значение — «назначенный срок»: отсюда и русские «рок», «срок», «урок». Польский сделал из «срока» обычный год."
memory: "Rocznie — в год: milion rocznie. Читается «ро́чне». Rok — год, а не «рок». Dziennie — в день, miesięcznie — в месяц."
idioms:
  - { pl: "z roku na rok", ru: "из года в год" }
