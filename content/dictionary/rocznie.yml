  - form: "rocznie"
    pl: "Odwiedzam rodziców dwa razy rocznie."
    ru: "Я навещаю родителей два раза в год."
    source: { kind: authored }
  - form: "rocznie"
    pl: "Rocznie ginie tu tysiące ptaków."
    ru: "Ежегодно здесь гибнут тысячи птиц."
    source: { kind: authored }
