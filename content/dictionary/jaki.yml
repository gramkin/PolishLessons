# review
id: jaki
format: 2
lemma: "jaki"
rank: 122
pos: adj
pron: { cyr: "я́ки" }
senses:
  - id: what-kind
    ru: "какой? (вопрос о свойстве)"
    examples:
      - pl: "Jaka pogoda?"
        ru: "Как погода?"
        source: { kind: tatoeba, id: 348794 }
      - pl: "Jaki mam wybór?"
        ru: "Какой у меня выбор?"
        source: { kind: tatoeba, id: 6602822 }
      - pl: "Jaka jest różnica?"
        ru: "В чём разница?"
        source: { kind: tatoeba, id: 7783274 }
  - id: exclamation
    ru: "какой! (восклицание)"
    examples:
      - pl: "Jaka ty piękna!"
        ru: "Какая ты красивая!"
        source: { kind: tatoeba, id: 13783081 }
      - pl: "Jaka wysoka góra!"
        ru: "Какая высокая гора!"
        source: { kind: tatoeba, id: 5369920 }
      - pl: "Jaka duża książka!"
        ru: "Какая большая книга!"
        source: { kind: tatoeba, id: 3479807 }
notes:
  - { kind: usage, text: "jaki спрашивает о свойстве, a który — о выборе из известного ряда: Jaki samochód? «Какая машина?» — Który samochód? «Которая из них?». Русское «какой» покрывает оба." }
  - { kind: usage, text: "В восклицании перед прилагательным: Jaka ładna! «Какая красивая!», Jaki duży! «Какой большой!»" }
collocations:
  - { pl: "jaki jest?", ru: "какой он?" }
  - { pl: "po jakiemu", ru: "на каком языке" }
  - { pl: "jaki taki", ru: "кое-какой, так себе" }
etymology: "Праславянское *jakъ, от того же местоименного корня, что и русское «какой»; в польском с XV века."
memory: "jaki — о свойстве («какой?»), który — о выборе («который?»). Русское «какой» отвечает обоим, поэтому проверяйте себя вопросом: спрашиваю о качестве или выбираю из ряда?"
idioms:
  - { pl: "jaki pan, taki kram", ru: "каков поп, таков и приход" }
  - { pl: "jaki taki", ru: "кое-какой, так себе" }
  - { pl: "nie wiadomo jaki", ru: "бог знает какой" }
