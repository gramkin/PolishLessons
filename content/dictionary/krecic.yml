# review
id: krecic
format: 2
lemma: "kręcić"
rank: 1002
pos: verb
aspect: imperf
pron: { cyr: "крэ́нциць" }
senses:
  - id: turn
    ru: "крутить, вертеть; вращаться"
    examples:
      - pl: "Kręci mi się w głowie."
        ru: "У меня кружится голова."
        source: { kind: translated, id: 822164 }
      - pl: "Kopernik pokazał, że Ziemia kręci się dokoła Słońca."
        ru: "Коперник показал, что Земля вращается вокруг Солнца."
        source: { kind: translated, id: 1222308 }
      - pl: "Koła kręcą się na osiach."
        ru: "Колёса крутятся на осях."
        source: { kind: translated, id: 498388 }
  - id: curly
    ru: "kręcone włosy — вьющиеся волосы"
    examples:
      - pl: "Tom ma kręcone włosy."
        ru: "У Тома вьющиеся волосы."
        source: { kind: translated, id: 11111772 }
      - pl: "Włosy Meg kręcą się naturalnie."
        ru: "У Мег волосы вьются от природы."
        source: { kind: translated, id: 1572762 }
  - id: film
    ru: "kręcić film — снимать фильм"
    examples:
      - pl: "Kręcę film."
        ru: "Я снимаю фильм."
        source: { kind: translated, id: 8766320 }
      - pl: "Jak tylko znajdę przyzwoitą kamerę, zaczynam kręcić filmy do internetu."
        ru: "Как только найду приличную камеру, начну снимать фильмы для интернета."
        source: { kind: translated, id: 959166 }
  - id: lurk
    ru: "kręcić się — крутиться, слоняться"
    examples:
      - pl: "Łyżwiarz kręcił się na lodzie."
        ru: "Фигурист крутился на льду."
        source: { kind: translated, id: 498413 }
      - pl: "Wszyscy kręcili się dookoła gwiazdy filmowej."
        ru: "Все крутились вокруг кинозвезды."
        source: { kind: translated, id: 3125610 }
notes:
  - { kind: usage, text: "kręci mi się w głowie «у меня кружится голова» — безличная конструкция с дательным падежом, без подлежащего." }
  - { kind: usage, text: "kręcić film значит «снимать фильм». Значение пришло от кручения ручки старой кинокамеры, и у русского «крутить» его нет." }
  - { kind: usage, text: "kręcone włosy — «вьющиеся волосы», а kręcić się — «крутиться, слоняться без дела»." }
  - { kind: usage, text: "В разговоре kręcić значит ещё «вилять, юлить»: Nie kręć! «Не виляй, говори прямо!»." }
collocations:
  - { pl: "kręci mi się w głowie", ru: "у меня кружится голова" }
  - { pl: "kręcić film", ru: "снимать фильм" }
  - { pl: "kręcone włosy", ru: "вьющиеся волосы" }
  - { pl: "kręcić się", ru: "крутиться" }
family:
  - { pl: "kręcony", ru: "вьющийся", relation: derived }
  - { pl: "krąg", ru: "круг", relation: root }
  - { pl: "zakręt", ru: "поворот", relation: derived }
etymology: "Праславянское *kretiti, родственное русским «крутить» и «крутой». Значение «снимать фильм» пришло от кручения ручки старой кинокамеры."
memory: "kręcić — «крутить, вертеть», но с тремя неочевидными оборотами: kręci mi się w głowie «у меня кружится голова», kręcić film «снимать фильм» и Nie kręć! «Не виляй!»."
idioms:
  - { pl: "kręci mi się w głowie", ru: "у меня кружится голова" }
  - { pl: "kręcić nosem", ru: "воротить нос" }
  - { pl: "kręcić film", ru: "снимать фильм" }
