# review
id: zdenerwowac
format: 2
lemma: "zdenerwować"
rank: 1792
pos: verb
aspect: perf
pron: { cyr: "здэнэрво́ваць" }
senses:
  - id: annoy
    ru: "разозлить, вывести из себя"
    examples:
      - pl: "Nie chcę ich zdenerwować."
        ru: "Я не хочу, чтобы они расстраивались."
        source: { kind: tatoeba, id: 12680490 }
      - pl: "Tom mnie zdenerwował."
        ru: "Том меня разозлил."
        source: { kind: translated, id: 4151821 }
      - pl: "Jego uwaga zdenerwowała mnie."
        ru: "Его замечание меня разозлило."
        source: { kind: translated, id: 362501 }
  - id: get-upset
    ru: "zdenerwować się — разнервничаться, разозлиться"
    examples:
      - pl: "Zdenerwował się."
        ru: "Он разнервничался."
        source: { kind: translated, id: 1632576 }
      - pl: "Zdenerwowała się."
        ru: "Она разнервничалась."
        source: { kind: translated, id: 8762679 }
      - pl: "Czemu się tak zdenerwowałeś?"
        ru: "Почему ты так разнервничался?"
        source: { kind: translated, id: 3064031 }
notes:
  - { kind: usage, text: "Совершенный вид; несовершенный — denerwować. Возвратное zdenerwować się значит «разнервничаться, выйти из себя»." }
  - { kind: government, text: "Разозлиться на кого-то — zdenerwować się na kogoś (винительный с na): zdenerwowała się na niegrzecznego chłopca." }
  - { kind: usage, text: "Причастие zdenerwowany значит и «раздражённый», и «взволнованный, на нервах»: jestem zdenerwowany «я нервничаю»." }
  - { kind: false-friend, text: "Слово от nerw «нерв», то есть «довести до нервов». Русское «разнервничаться» построено из того же корня." }
collocations:
  - { pl: "zdenerwować się", ru: "разнервничаться" }
  - { pl: "jestem zdenerwowany", ru: "я нервничаю" }
  - { pl: "zdenerwować kogoś", ru: "разозлить кого-либо" }
family:
  - { pl: "denerwować", ru: "нервировать", relation: root, id: denerwowac }
  - { pl: "nerwowy", ru: "нервный", relation: root }
  - { pl: "zły", ru: "злой", relation: root, id: zly }
etymology: "Приставка z- плюс denerwować, от nerw «нерв»: буквально «довести до нервов». Русское «разнервничаться» собрано из того же корня."
memory: "zdenerwować — «разозлить»; возвратное zdenerwować się — «разнервничаться». На кого — na kogoś. Причастие zdenerwowany значит «на нервах»."
idioms:
  - { pl: "zdenerwować się", ru: "разнервничаться" }
  - { pl: "jestem zdenerwowany", ru: "я нервничаю" }
  - { pl: "zdenerwować kogoś", ru: "разозлить кого-либо" }
