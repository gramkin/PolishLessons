# review
id: powstac
format: 2
lemma: "powstać"
rank: 1819
pos: verb
aspect: perf
pron: { cyr: "по́фстаць" }
senses:
  - id: come-into-being
    ru: "возникнуть, появиться, образоваться"
    examples:
      - pl: "Jak powstał wszechświat?"
        ru: "Как возникла Вселенная?"
        source: { kind: tatoeba, id: 12240078 }
      - pl: "Kiedy świat powstał?"
        ru: "Когда возник мир?"
        source: { kind: translated, id: 540081 }
      - pl: "Jak powstała Ziemia?"
        ru: "Как возникла Земля?"
        source: { kind: translated, id: 12240075 }
  - id: stand-up-rise
    ru: "встать; восстать"
    examples:
      - pl: "Linda powstała aby zaśpiewać."
        ru: "Линда встала, чтобы спеть."
        source: { kind: tatoeba, id: 590551 }
      - pl: "Lud powstał przeciwko tyranii."
        ru: "Народ восстал против тирании."
        source: { kind: translated, id: 7905751 }
      - pl: "Natychmiast powstał i odszedł."
        ru: "Он немедленно встал и ушёл."
        source: { kind: translated, id: 13335355 }
notes:
  - { kind: usage, text: "Основное значение в корпусе — «возникнуть, появиться»: kiedy powstał świat «когда возник мир», fundacja powstała w celu pomocy sierotom." }
  - { kind: usage, text: "Второе значение — «встать» (высоким стилем) и «восстать»: lud powstał przeciwko tyranii. Обычное «встать» — wstać." }
  - { kind: government, text: "Восстать против кого-то — powstać przeciwko komuś (дательный после przeciwko)." }
  - { kind: usage, text: "Совершенный вид; несовершенный — powstawać. Существительное powstanie значит и «возникновение», и «восстание»." }
collocations:
  - { pl: "powstać z martwych", ru: "воскреснуть" }
  - { pl: "powstać przeciwko", ru: "восстать против" }
  - { pl: "kiedy powstał", ru: "когда возник" }
family:
  - { pl: "powstawać", ru: "возникать", relation: root }
  - { pl: "wstać", ru: "встать", relation: root, id: wstac }
  - { pl: "powstanie", ru: "возникновение; восстание", relation: root }
etymology: "Приставка po- плюс wstać «встать» — то же, что русское «повстать, восстать». Значение «возникнуть» выросло из «подняться, явиться»."
memory: "powstać — прежде всего «возникнуть»: kiedy powstał świat. А ещё «встать» высоким стилем и «восстать»: lud powstał przeciwko tyranii. Обычное «встать» — wstać."
