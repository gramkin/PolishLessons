# review
id: przeprowadzka
format: 2
lemma: "przeprowadzka"
rank: 4902
pos: noun
pron: { cyr: "пшэпрова́цка" }
senses:
  - id: move
    ru: "переезд (на новое место жительства)"
    examples:
      - pl: "Przeprowadzka do nowego mieszkania trwała tydzień."
        ru: "Переезд в новую квартиру занял неделю."
        source: { kind: authored }
      - pl: "Po przeprowadzce wszystko było w kartonach."
        ru: "После переезда всё было в коробках."
        source: { kind: authored }
      - pl: "Szykujemy się do przeprowadzki."
        ru: "Мы готовимся к переезду."
        source: { kind: authored }
  - id: removal
    ru: "перевозка вещей при переезде (услуга)"
    examples:
      - pl: "Firma zajmuje się przeprowadzkami."
        ru: "Фирма занимается перевозкой вещей при переездах."
        source: { kind: authored }
      - pl: "Zamówiliśmy przeprowadzkę na sobotę."
        ru: "Мы заказали перевозку вещей на субботу."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "PRZEPROWADZKA — «переезд» на новое место жительства. Глагол PRZEPROWADZIĆ SIĘ значит «переехать», а без SIĘ PRZEPROWADZIĆ — «провести»: PRZEPROWADZIĆ BADANIE — провести исследование. Поездка же — JAZDA или PODRÓŻ, а не PRZEPROWADZKA." }
  - { kind: usage, text: "Десять форм в таблице, женский род. В дательном и местном падежах K переходит в C: PO PRZEPROWADZCE. В родительном множественного беглое E: PRZEPROWADZEK. Звательная форма не нужна." }
  - { kind: government, text: "Переезд куда-то — PRZEPROWADZKA DO CZEGOŚ, DO с родительным: PRZEPROWADZKA DO WARSZAWY. После переезда — PO PRZEPROWADZCE, местный. Помочь с переездом — POMÓC PRZY PRZEPROWADZCE, местный." }
  - { kind: pronunciation, text: "Читается «пшэпрова́цка», четыре слога, ударение на третьем. PRZ даёт «пш». DZ перед K оглушается и сливается в «ц». В форме PRZEPROWADZCE: «пшэпрова́цце»." }
  - { kind: register, text: "TRZY PRZEPROWADZKI TO JAK JEDEN POŻAR — «три переезда как один пожар»: при каждом переезде что-то теряется или бьётся. Слово бытовое и очень частое." }
collocations:
  - { pl: "firma przeprowadzkowa", ru: "фирма по перевозке вещей" }
  - { pl: "przeprowadzka do innego miasta", ru: "переезд в другой город" }
  - { pl: "pomóc przy przeprowadzce", ru: "помочь с переездом" }
family:
  - { pl: "prowadzic", ru: "вести", relation: root, id: prowadzic }
  - { pl: "przeprowadzic", ru: "переехать (przeprowadzić się); провести", relation: derived, id: przeprowadzic }
  - { pl: "przeprowadzkowy", ru: "связанный с переездом", relation: derived }
etymology: "От PRZEPROWADZIĆ SIĘ «переехать», буквально «перевести себя»: приставка PRZE- и PROWADZIĆ «вести», того же корня, что русское «водить». Суффикс -KA сделал из глагола название события, как PRZEJAŻDŻKA из PRZEJEŻDŻAĆ."
memory: "Przeprowadzka — переезд, от przeprowadzić się — переехать. Читается «пшэпрова́цка». Po przeprowadzce — после переезда. Trzy przeprowadzki to jak jeden pożar."
idioms:
  - { pl: "trzy przeprowadzki to jak jeden pożar", ru: "три переезда — как один пожар" }
  - { pl: "być w trakcie przeprowadzki", ru: "быть в разгаре переезда" }
formExamplesSkip:
  - { form: "przeprowadzko", reason: "звательная форма; к переезду не обращаются" }
