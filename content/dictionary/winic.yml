        source: { kind: authored }
  - id: blamed
    ru: "winiony — обвиняемый, тот, кого винят"
    examples:
      - pl: "Winiony przez wszystkich dyrektor podał się do dymisji."
        ru: "Обвиняемый всеми директор подал в отставку."
        source: { kind: authored }
      - pl: "Winieni kierowcy odwołali się od decyzji."
        ru: "Обвинённые водители обжаловали решение."
        source: { kind: authored }
  - id: blaming
    ru: "winienie — обвинение (как действие)"
    examples:
      - pl: "Winienie innych niczego nie naprawi."
        ru: "Обвинять других ничего не исправит."
        source: { kind: authored }
      - pl: "Po latach winienia siebie wreszcie odpuścił."
        ru: "После лет самообвинений он наконец отпустил."
