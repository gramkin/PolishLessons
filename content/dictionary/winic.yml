notes:
  - { kind: false-friend, text: "КОРЕНЬ РОДНОЙ: wina — это русская «ВИНА», winić — «винить», niewinny — «невиновный». Но осторожно с прилагательным winny: оно значит И «виновный», И «ДОЛЖНЫЙ» — jestem ci winien sto złotych значит «я должен тебе сто злотых». Русское «винный» (от вина-напитка) тут ни при чём: по-польски это winny в третьем значении, от wino." }
  - { kind: government, text: "ДВЕ МОДЕЛИ, И ОДНА РАСХОДИТСЯ С РУССКОЙ. Винят кого ЗА что — za с винительным, как по-русски: winić kogoś za błąd, za spóźnienie. Но «обвинять В чём-то» строится через O с ВИНИТЕЛЬНЫМ: winić kogoś O kradzież, где русский берёт предложный падеж. Эту вторую модель и нужно запомнить отдельно." }
  - { kind: usage, text: "Вид несовершенный; совершенного у него по сути нет — для однократного обвинения берут obwinić или oskarżyć. Страдательное причастие по правилу для -ić: winiony, winieni. Возвратное winić się значит «винить себя»." }
  - { kind: register, text: "Устойчивое sam sobie winien значит «сам виноват» и звучит ровно так же сухо, как русское. А słowo wina годится и для юридической вины, и для бытовой: to nie moja wina — «это не моя вина»." }
collocations:
  - { pl: "winić kogoś za coś", ru: "винить кого-л. за что-л." }
  - { pl: "sam sobie winien", ru: "сам виноват" }
  - { pl: "to nie moja wina", ru: "это не моя вина" }
family:
  - { pl: "wina", ru: "вина", relation: root, id: wina }
  - { pl: "winny", ru: "виновный; должный", relation: derived, id: winny }
  - { pl: "niewinny", ru: "невиновный", relation: antonym, id: niewinny }
etymology: "От wina «вина» — того же общеславянского слова, что русская «вина». Отсюда winny «виновный», niewinny «невиновный», obwiniać «обвинять» и przewinienie «проступок». Значение «должный» у winny выросло из той же идеи: должник перед кем-то виноват."
memory: "winić — «винить», от wina «вина», слово в слово. Падеж совпадает: winić kogoś ZA coś. Но помните двусмысленность winny: это и «виновный», и «должный» — jestem ci winien «я тебе должен»."
idioms:
  - { pl: "sam sobie winien", ru: "сам виноват" }
  - { pl: "winić los", ru: "винить судьбу" }
