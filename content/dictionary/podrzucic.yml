notes:
  - { kind: usage, text: "РЕДКИЙ СЛУЧАЙ ПОЛНОГО СОВПАДЕНИЯ: ВСЕ ЗНАЧЕНИЯ ЛОЖАТСЯ НА РУССКОЕ «ПОДБРОСИТЬ». Подбросить монету вверх — podrzucić monetę. Подбросить до дома — podrzucić do domu, и это так же разговорно, как у нас. Подбросить улики — podrzucić dowody. Подкинуть ребёнка — podrzucić dziecko, отсюда PODRZUTEK «подкидыш». Четыре смысла, и ни один не требует другого глагола." }
  - { kind: pronunciation, text: "Основа меняет мягкость по формам: инфинитив PODRZUCIĆ и повелительное PODRZUĆ идут с мягким ć, а будущее PODRZUCĘ, PODRZUCI и причастие PODRZUCONY — с твёрдым c. Та же тройка, что у poprowadzić и wysadzić, только там чередовалось dz. Сочетание drz в начале читается слитно, примерно как «дж»." }
  - { kind: usage, text: "Вид совершенный: podrzucę значит «подброшу», а не «подбрасываю». Несовершенная пара — PODRZUCAĆ. Корень rzucić «бросить» в русском не сохранился: у нас на этом месте «бросить» и «кидать». Зато всё польское гнездо строится на нём ровно: rzut «бросок», rzucać, wyrzucić, zarzucić." }
collocations:
  - { pl: "podrzucić kogoś do domu", ru: "подбросить кого-л. до дома" }
  - { pl: "podrzucić dowody", ru: "подбросить улики" }
  - { pl: "podrzucić monetę", ru: "подбросить монету" }
family:
  - { pl: "podrzucać", ru: "подбрасывать (несов.)", relation: aspect }
  - { pl: "rzucić", ru: "бросить", relation: root, id: rzucic }
  - { pl: "podrzutek", ru: "подкидыш", relation: root }
etymology: "Приставки pod- и rzucić, из праславянского *rutiti «бросать». Приставка наша знакомая — «под-», а вот корень русский потерял: на его месте встали «бросить» и «кидать». В польском он живёт широко: rzut «бросок», rzucać, wyrzucić «выбросить», zarzucić «забросить». Так что podrzucić разбирается как «под-бросить» морфема в морфему, только корень придётся выучить новый."
memory: "Четыре значения и все совпадают с русским «подбросить»: монету вверх, человека до дома, улики в машину, ребёнка под дверь. Запоминать надо не смысл, а чередование: podrzucić и podrzuć с мягким ć, но podrzucę и podrzucony с твёрдым c."
idioms:
  - { pl: "podrzucić komuś pomysł", ru: "подкинуть кому-л. идею" }
  - { pl: "podrzucić kogoś pod dom", ru: "подбросить кого-л. до дома" }
