# review
id: fan
format: 2
lemma: "fan"
rank: 1634
pos: noun
pron: { cyr: "фан" }
senses:
  - id: fan
    ru: "фанат, поклонник"
    examples:
      - pl: "Tomasz ma wielu fanów."
        ru: "У Тома много фанатов."
        source: { kind: tatoeba, id: 12955514 }
      - pl: "Ten gwiazdor ma wielu fanów."
        ru: "У этой звезды много фанатов."
        source: { kind: translated, id: 935363 }
      - pl: "Hala koncertowa była pełna fanów."
        ru: "Концертный зал был полон фанатов."
        source: { kind: translated, id: 958949 }
  - id: be-a-fan
    ru: "być fanem — быть поклонником чего-либо"
    examples:
      - pl: "Jesteś fanem?"
        ru: "Ты фанат?"
        source: { kind: translated, id: 11586319 }
      - pl: "Jestem fanem Pepsi."
        ru: "Я фанат «Пепси»."
        source: { kind: translated, id: 12722151 }
      - pl: "Nie jestem fanem krewetek."
        ru: "Я не фанат креветок."
        source: { kind: translated, id: 10468197 }
notes:
  - { kind: government, text: "«Быть фанатом чего-то» — być fanem czegoś, творительный плюс родительный: jestem fanem Coca-Coli." }
  - { kind: usage, text: "Разговорное nie jestem fanem czegoś значит мягкое «я это не очень люблю» — как и русское «я не фанат»." }
  - { kind: usage, text: "Базовая форма fan в корпусе не встречается: слово живёт в творительном (fanem) и родительном множественного (fanów)." }
  - { kind: usage, text: "Соседние слова: kibic «болельщик» (о спорте), wielbiciel «поклонник» (книжное)." }
collocations:
  - { pl: "być fanem", ru: "быть фанатом" }
  - { pl: "wielu fanów", ru: "много фанатов" }
  - { pl: "nie jestem fanem", ru: "я не фанат" }
etymology: "Из английского fan, сокращения от fanatic. Русское «фанат» и «фан» пришли из того же источника, так что слова совпадают и по форме, и по значению."
memory: "fan = «фанат, поклонник»: być fanem czegoś «быть фанатом чего-то», творительный плюс родительный. Базовая форма в корпусе не встречается — слово живёт в fanem и fanów."
idioms:
  - { pl: "być fanem", ru: "быть фанатом" }
  - { pl: "wielu fanów", ru: "много фанатов" }
  - { pl: "nie jestem fanem", ru: "я не фанат" }
