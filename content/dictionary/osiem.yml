# review
id: osiem
format: 2
lemma: "osiem"
rank: 1247
pos: num
pron: { cyr: "о́сем" }
senses:
  - id: eight
    ru: "восемь"
    examples:
      - pl: "Mój syn ma osiem lat."
        ru: "Моему сыну восемь лет."
        source: { kind: tatoeba, id: 2196515 }
      - pl: "Pięć plus trzy daje osiem."
        ru: "Пять плюс три получится восемь."
        source: { kind: tatoeba, id: 3659276 }
      - pl: "Ten chłopiec przespał osiem godzin."
        ru: "Этот мальчик проспал восемь часов."
        source: { kind: tatoeba, id: 3460743 }
  - id: oblique
    ru: "ośmiu — восьми (косвенные падежи и мужско-личная форма)"
    examples:
      - pl: "Mam ośmiu braci."
        ru: "У меня восемь братьев."
        source: { kind: translated, id: 3418111 }
      - pl: "Od ośmiu lat jestem żonaty."
        ru: "Я женат уже восемь лет."
        source: { kind: translated, id: 2257160 }
      - pl: "Komitet składa się z ośmiu członków."
        ru: "Комитет состоит из восьми членов."
        source: { kind: translated, id: 952148 }
  - id: collective
    ru: "ośmioro — собирательное (дети, смешанные группы, парные предметы)"
    examples:
      - pl: "Mam ośmioro rodzeństwa."
        ru: "У меня восемь братьев и сестёр."
        source: { kind: translated, id: 2196548 }
      - pl: "Pająki mają ośmioro oczu."
        ru: "У пауков восемь глаз."
        source: { kind: translated, id: 10168291 }
      - pl: "Mam ośmioro braci i sióstr."
        ru: "У меня восемь братьев и сестёр."
        source: { kind: translated, id: 2196545 }
notes:
  - { kind: government, text: "Как все числительные от пяти и выше, osiem требует родительного падежа множественного числа: osiem godzin «восемь часов», osiem lat «восемь лет»." }
  - { kind: usage, text: "Мужско-личная форма — ośmiu: ośmiu braci «восемь братьев», ośmiu członków «восемь членов»." }
  - { kind: usage, text: "Собирательная форма ośmioro используется для смешанных групп, детей и парных предметов: ośmioro dzieci, ośmioro oczu." }
  - { kind: pronunciation, text: "Основа чередуется: osiem, но ośmiu и ośmioro, с мягким ś. Ударение всегда на первый слог." }
collocations:
  - { pl: "osiem godzin", ru: "восемь часов" }
  - { pl: "osiem lat", ru: "восемь лет" }
  - { pl: "ośmiu ludzi", ru: "восемь человек" }
etymology: "Праславянское *osmь — то же слово, что русское «восемь». Русское начальное «в-» появилось позже, по аналогии с «семь»."
memory: "osiem — «восемь», с родительным падежом множественного числа: osiem godzin. Мужско-личная форма ośmiu (ośmiu braci), собирательная ośmioro (ośmioro dzieci). Основа чередуется: osiem, но ośmi-."
