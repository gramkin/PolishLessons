  - id: not-ones-own
    ru: "чужой (о делах, заслугах)"
    examples:
      - pl: "Nie wtrącaj się w cudze sprawy."
        ru: "Не вмешивайся в чужие дела."
        source: { kind: translated, id: 691838 }
      - pl: "Próbował sobie przywłaszczyć cudze zasługi."
        ru: "Он пытался присвоить чужие заслуги."
        source: { kind: translated, id: 13971334 }
notes:
  - { kind: false-friend, text: "Не «чудный»! Корень cudzy — это русское «чужой», а «чудо» по-польски cud. Слова похожи по виду, но восходят к разным корням." }
  - { kind: usage, text: "cudze sprawy «чужие дела», na cudzych błędach «на чужих ошибках» — обороты совпадают с русскими дословно." }
  - { kind: government, text: "Обычное притяжательное прилагательное; склоняется как twój." }
  - { kind: usage, text: "Родственные: cudzoziemiec «иностранец», cudzysłów «кавычки» — буквально «чужое слово»." }
collocations:
  - { pl: "cudze sprawy", ru: "чужие дела" }
  - { pl: "na cudzych błędach", ru: "на чужих ошибках" }
etymology: "Праславянское *tjuždь «чужой»; русское «чужой» — то же слово. С cud «чудо» не связано."
memory: "cudzy — «чужой», а вовсе не «чудный»: чудо по-польски cud. Отсюда cudzoziemiec «иностранец» и cudzysłów «кавычки», буквально «чужое слово»."
