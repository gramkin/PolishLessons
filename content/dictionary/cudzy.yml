senses:
  - id: someone-elses
    ru: "чужой (принадлежащий другому)"
    examples:
      - pl: "Ucz cię na cudzych błędach."
        ru: "Учись на чужих ошибках."
        source: { kind: tatoeba, id: 356997 }
