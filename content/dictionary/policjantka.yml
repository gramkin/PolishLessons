# review
id: policjantka
format: 2
lemma: "policjantka"
rank: 5384
pos: noun
pron: { cyr: "полицья́нтка" }
senses:
  - id: policewoman
    ru: "сотрудница полиции, женщина-полицейский"
    examples:
      - pl: "Policjantka zatrzymała pijanego kierowcę."
        ru: "Сотрудница полиции остановила пьяного водителя."
        source: { kind: authored }
      - pl: "Moja siostra jest policjantką."
        ru: "Моя сестра служит в полиции."
        source: { kind: authored }
      - pl: "Policjantka pomogła dziecku znaleźć mamę."
        ru: "Женщина-полицейский помогла ребёнку найти маму."
        source: { kind: authored }
  - id: officer
    ru: "полицейская (в обращении, в новостях)"
    examples:
      - pl: "Policjantki patrolowały park."
        ru: "Сотрудницы полиции патрулировали парк."
        source: { kind: authored }
      - pl: "Policjantka z drogówki wypisała mandat."
        ru: "Сотрудница ДПС выписала штраф."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "POLICJANTKA — «женщина-полицейский», женская форма от POLICJANT. В русском такой формы нет: говорят «сотрудница полиции». Дорожная полиция в разговоре — DROGÓWKA." }
  - { kind: usage, text: "Девять форм, женский род. В дательном и местном K переходит в C: O POLICJANTCE. Родительный множественного — POLICJANTEK. Звательный POLICJANTKO не учим." }
  - { kind: government, text: "Работать в полиции — BYĆ POLICJANTKĄ, творительный. Спросить полицейскую — ZAPYTAĆ POLICJANTKĘ, винительный." }
  - { kind: pronunciation, text: "Читается «полицья́нтка»: CJA — «цья». Ударение на предпоследнем слоге. POLICJANTCE — «полицья́нтце»." }
collocations:
  - { pl: "policjantka z drogówki", ru: "сотрудница ДПС" }
  - { pl: "zostać policjantką", ru: "пойти служить в полицию" }
  - { pl: "młoda policjantka", ru: "молодая сотрудница полиции" }
family:
  - { pl: "policjant", ru: "полицейский", relation: root, id: policjant }
  - { pl: "policja", ru: "полиция", relation: root, id: policja }
  - { pl: "komisariat", ru: "полицейский участок", relation: root, id: komisariat }
etymology: "От POLICJANT «полицейский» с женским суффиксом -KA. В основе — POLICJA, из латыни через немецкий."
