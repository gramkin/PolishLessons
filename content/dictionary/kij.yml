notes:
  - { kind: false-friend, text: "РУССКИЙ «КИЙ» ВЗЯТ ИЗ ПОЛЬСКОГО, НО СУЗИЛСЯ ДО БИЛЬЯРДА. Польское kij это ПАЛКА вообще: любая палка в лесу, трость, клюшка, бита. Русский заимствовал слово и оставил его при одной игре. Так что переводить kij надо словом «палка», а «кий» подойдёт только в бильярдной: kij bilardowy." }
  - { kind: usage, text: "РОДИТЕЛЬНЫЙ НА -A, ХОТЯ ПРЕДМЕТ НЕОДУШЕВЛЁН: KIJA. Так в польском ведут себя многие вещи, которые берут в руки: szukać kija, kupić banana, zamówić drinka, postawić plusa. Третий такой случай в словаре после plus и szampan. Виды: kij hokejowy, kij golfowy, kij bejsbolowy, kij bilardowy." }
  - { kind: pronunciation, text: "Один слог: «кий», как русское слово. В косвенных падежах появляется второй: kija — «ки́я», kijem — «ки́ем». Множественное kije читается «ки́е»." }
collocations:
  - { pl: "kij hokejowy", ru: "хоккейная клюшка" }
  - { pl: "kij ma dwa końce", ru: "палка о двух концах" }
  - { pl: "podpierać się kijem", ru: "опираться на палку" }
family:
  - { pl: "kijek", ru: "палочка", relation: derived }
  - { pl: "laska", ru: "трость", relation: root, id: laska }
  - { pl: "patyk", ru: "прутик, палка", relation: root }
etymology: "Праславянское *kyjь «палка, дубина», от корня со значением «бить» — того же, что в kować и русском «ковать». Русский «кий» заимствован из польского в значении бильярдной палки, а исконно слово значило любую палку. Отсюда kijek, kijanka «головастик» и pałka."
memory: "kij — «ПАЛКА» вообще, а не только «кий»: русское слово взято отсюда же, но сузилось до бильярда. Родительный kija, с окончанием одушевлённых, как plusa и szampana. Пословица совпадает: kij ma dwa końce."
idioms:
  - { pl: "kij ma dwa końce", ru: "палка о двух концах" }
  - { pl: "marchewka i kij", ru: "кнут и пряник" }
