notes:
  - { kind: false-friend, text: "WYRAZ — ЭТО ПРЕЖДЕ ВСЕГО «СЛОВО», А НЕ «ВЫРАЖЕНИЕ». Trudny wyraz значит «трудное слово», tysiąc wyrazów — «тысяча слов». Русское «выражение» в смысле оборота речи будет WYRAŻENIE, через ż и с другим суффиксом. Зато WYRAZ TWARZY — это как раз «выражение лица», и тут два языка сходятся. Проверяй по соседнему слову: при twarz это мимика, в остальных случаях — лексика." }
  - { kind: usage, text: "Устойчивый оборот WYRAZY WSPÓŁCZUCIA значит «соболезнования», буквально «слова сочувствия», и во множественном числе он застыл. Так же wyrazy szacunku «заверения в уважении» в конце письма. Эти формулы стоит запомнить целиком, по частям они не собираются." }
  - { kind: pronunciation, text: "Предложный падеж — WYRAZIE, со смягчением z в zi, как analiza — analizie и zaraza — zarazie. Родительный единственного — WYRAZU, с окончанием -u, по той же склонности отвлечённых существительных, что у soku и aresztu." }
collocations:
  - { pl: "wyraz twarzy", ru: "выражение лица" }
  - { pl: "wyrazy współczucia", ru: "соболезнования" }
  - { pl: "wyraz obcy", ru: "заимствованное слово" }
family:
  - { pl: "wyrazić", ru: "выразить", relation: root, id: wyrazic }
  - { pl: "wyrażenie", ru: "выражение, оборот", relation: root }
  - { pl: "słowo", ru: "слово", relation: root, id: slowo }
etymology: "От wyrazić «выразить», из корня raz-, того же, что в razić «поражать» и obraz «образ, картина». Русское «выражение» построено из тех же частей, но у поляков производное на -az стало значить сам языковой знак, слово, а не способ сказать. Отсюда расхождение: wyraz — «слово», wyrażenie — «выражение»."
memory: "wyraz — это «слово»: tysiąc wyrazów, trudny wyraz. «Выражение» как оборот речи будет wyrażenie. Исключение одно и важное: wyraz twarzy — «выражение лица»."
idioms:
  - { pl: "wyrazy współczucia", ru: "соболезнования" }
  - { pl: "dać wyraz czemuś", ru: "выразить что-л., дать выход чему-л." }
