notes:
  - { kind: usage, text: "Этимология прозрачная: праславянское *skala от *skoliti «раскалывать», то есть скала — это «отколотое». Русская «скала» — то же слово." }
  - { kind: false-friend, text: "Не путайте skała «скала» и skala «шкала, масштаб» — разные слова, но в дательном и предложном они совпадают: na skale может значить и «на скале», и «в масштабе»." }
  - { kind: usage, text: "Пословица kropla drąży skałę — «капля точит камень», ровно русская." }
  - { kind: usage, text: "Второе значение геологическое: skała как «горная порода», skały i minerały «горные породы и минералы»." }
collocations:
  - { pl: "twardy jak skała", ru: "твёрдый как скала" }
  - { pl: "kropla drąży skałę", ru: "капля точит камень" }
  - { pl: "skały i minerały", ru: "горные породы и минералы" }
etymology: "Праславянское *skala от *skoliti «раскалывать»: скала — это буквально «отколотое». Русская «скала» — то же самое слово."
memory: "skała — «скала», и внутри неё спрятан глагол «раскалывать»: праславянское *skala значило «отколотое». Русское слово то же самое. Осторожно с соседом: skala «шкала, масштаб» — другое слово, а в предложном падеже они совпадают (na skale). И запомните пословицу kropla drąży skałę «капля точит камень»."
idioms:
