notes:
  - { kind: false-friend, text: "Самая частая ошибка здесь не смысловая, а зрительная: ZLECIĆ и ZLECIEĆ — разные глаголы. ZLECIĆ значит «поручить», а ZLECIEĆ — «слететь, спуститься», от LECIEĆ «лететь». В прошедшем времени они различаются одной буквой: ON ZLECIŁ «он поручил» и ON ZLECIAŁ «он слетел». Разница в А, и на письме её легко не заметить, а на слух она ясна: «зле́чиу» против «зле́чяу». Корни тоже разные, несмотря на внешнее сходство, и путать их нельзя." }
  - { kind: usage, text: "Корень -LEC- в современном польском сам по себе не употребляется и живёт только с приставками, зато ряд получается богатый: POLECIĆ «порекомендовать, поручить», ZALECIĆ «предписать, рекомендовать», ZLECIĆ «поручить, заказать». Для русскоязычного здесь важен урок о приставках: весь ряд в русском передаётся тремя неродственными глаголами — «порекомендовать», «предписать», «поручить», — а польский строит его из одного корня. Существительные устроены так же: POLECENIE, ZALECENIE, ZLECENIE. Несовершенный партнёр — ZLECAĆ." }
  - { kind: government, text: "Схема совпадает с русской: ZLECIĆ KOMUŚ COŚ — дательный на исполнителя, винительный на работу. ZLECIŁ NAM PRZYGOTOWANIE RAPORTU «поручил нам подготовку отчёта». Часто вместо лица стоит организация: ZLECIĆ REMONT FIRMIE, ZLECIĆ BADANIE LABORATORIUM, и дательный сохраняется. Устойчивый оборот NA ZLECENIE KOGOŚ значит «по заказу кого-то»: DZIAŁAŁ NA ZLECENIE MINISTERSTWA. Существительное ZLECENIE употребляется и как «заказ», и как «поручение», смотря по делу." }
  - { kind: pronunciation, text: "Читается «зле́чичь», два слога, ударение на первом. Начальное ZL произносится слитно и звонко, без гласной между согласными. Буква C перед I даёт мягкое «ч», ближе к «чь», поэтому середина слова звучит «ле́чи», а не «леци». Конечное Ć такое же мягкое. В повелительном наклонении остаётся только основа: ZLEĆ звучит «злечь», одним слогом, и это одна из самых коротких польских форм." }
  - { kind: register, text: "Слово делового языка: им говорят о подрядах, услугах и поручениях. Важнее всего знать UMOWA ZLECENIE — распространённую в Польше форму договора, по которой работают без трудового найма; грамматика сочетания необычна, оба слова стоят в именительном падеже, и запоминать его надо целиком. Рядом живут ZLECENIODAWCA «заказчик» и ZLECENIOBIORCA «исполнитель», слова длинные, но в документах неизбежные. В быту вместо глагола чаще скажут POPROSIĆ KOGOŚ O COŚ." }
collocations:
  - { pl: "zlecić komuś pracę", ru: "поручить кому-то работу" }
  - { pl: "na zlecenie", ru: "по заказу" }
  - { pl: "umowa zlecenie", ru: "договор поручения" }
