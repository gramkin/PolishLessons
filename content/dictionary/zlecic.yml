etymology: "Приставка Z- плюс связанный корень -LEC-, который в современном польском самостоятельно не встречается и существует только в приставочных глаголах POLECIĆ, ZALECIĆ, ZLECIĆ и в их существительных POLECENIE, ZALECENIE, ZLECENIE. Прямого русского родственника у этого корня нет, и в этом главный урок: там, где польский обходится одной основой и меняет только приставку, русский берёт три разных слова — «порекомендовать», «предписать», «поручить». Русское «поручить» построено на «руке», то есть на образе передачи из рук в руки, и показывает, что к одному понятию языки пришли совсем разными путями. Внешне похожий глагол ZLECIEĆ «слететь» к этому гнезду не принадлежит и восходит к LECIEĆ «лететь»."
memory: "Корень здесь связанный: сам по себе -lec- не употребляется, но приставки дают целый ряд — polecić «порекомендовать», zalecić «предписать», zlecić «поручить». Русский на это место ставит три неродственных глагола, и в этом вся разница устройства. Управление совпадает: zlecić komuś coś, дательный и винительный. Беречься одной буквы: zlecił «поручил» против zleciał «слетел», от другого глагола lecieć. И знать umowa zlecenie — польский договор поручения."
idioms:
  - { pl: "umowa zlecenie", ru: "договор поручения, подряд без трудового найма" }
formExamplesSkip:
  - { form: "zleceni", reason: "Форма страдательного причастия мужского лица во множественном числе грамматически неупотребима. Глагол ставит исполнителя в дательный падеж, а порученное дело в винительный, поэтому в страдательный оборот обращается только дело, то есть работа, заказ или исследование. Подлежащим при ZLECENI пришлось бы сделать мужчин как то, что поручено, а такого управления у глагола нет." }
