notes:
  - { kind: false-friend, text: "Русское «дольний» — книжное, «земной, нижний мир», и в быту не встречается. Польское DOLNY — обычное «нижний»: DOLNA PÓŁKA, DOLNA WARGA. Противоположность — GÓRNY, «верхний». Русское «долина» — того же корня, что DOLNY и DÓŁ, «низ, яма»." }
  - { kind: usage, text: "Степеней сравнения нет, но есть превосходная форма NAJNIŻSZY от NISKI, если нужно «самый нижний». Формы для мужчин-людей DOLNI в карточке нет: людей нижними не называют. Остальные десять форм живые. В географических названиях пишется с заглавной: DOLNY ŚLĄSK." }
  - { kind: government, text: "Ставится перед существительным: DOLNA PÓŁKA, DOLNE PIĘTRO. В географии и анатомии — тоже перед: DOLNY ŚLĄSK, DOLNA KOŃCZYNA. Падежных требований нет. Внизу — NA DOLE, вниз — NA DÓŁ." }
  - { kind: pronunciation, text: "Читается «до́льны», два слога, ударение на первом. L перед согласной N мягкая: «ль». Не путайте с DÓŁ «дуу», где Ó даёт «у», а Ł — «у»." }
  - { kind: register, text: "Нейтральное повседневное слово. В географии DOLNY ŚLĄSK — регион с центром во Вроцлаве, его жители — DOLNOŚLĄZACY. В медицине KOŃCZYNY DOLNE, «нижние конечности», — официальное название ног." }
