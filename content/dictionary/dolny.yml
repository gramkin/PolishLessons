etymology: "От DÓŁ «низ, яма», общеславянского *dolъ, того же, что русское «дол» в «горы и долы» и в слове «долина». Русский превратил прилагательное в книжное «дольний», а польский сохранил DOLNY повседневным. Ó и O чередуются в польском корне: DÓŁ, но DOLNY, NA DOLE."
memory: "Dolny — нижний: dolna szuflada, dolna warga, Dolny Śląsk. Противоположность — górny. От dół — низ, как русское «дол». Читается «до́льны»."
