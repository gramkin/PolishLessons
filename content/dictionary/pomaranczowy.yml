notes:
  - { kind: false-friend, text: "Польское POMARAŃCZOWY покрывает два русских слова: «оранжевый» и «апельсиновый». Цвет и фрукт тут одно слово, потому что апельсин по-польски POMARAŃCZA, а цвет назван по нему. Русскому «оранжевый» созвучно польское ORANŻOWY, но оно редкое и звучит манерно. В быту только POMARAŃCZOWY: POMARAŃCZOWY KOLOR и SOK POMARAŃCZOWY." }
  - { kind: usage, text: "Относительное прилагательное в значении «апельсиновый» и качественное в значении цвета, но степеней сравнения нет и у цвета: «более оранжевый» говорят описательно, BARDZIEJ POMARAŃCZOWY. Форма для мужчин-людей POMARAŃCZOWI в карточку не включена: кроме газетного прозвища сборной Нидерландов она не встречается, а о мужчинах в оранжевом говорят W POMARAŃCZOWYCH KAMIZELKACH." }
  - { kind: government, text: "Сорт ставят после существительного: SOK POMARAŃCZOWY, DŻEM POMARAŃCZOWY, SKÓRKA POMARAŃCZOWA. Цвет можно и до, и после: POMARAŃCZOWY SAMOCHÓD и SAMOCHÓD POMARAŃCZOWY. Красить в оранжевый — MALOWAĆ NA POMARAŃCZOWO, NA с наречием." }
  - { kind: pronunciation, text: "Читается «помараньчо́вы», пять слогов, ударение на предпоследнем. Ń перед CZ звучит мягким «нь», а не носовым, и CZ даёт твёрдое «ч»: «раньчо». Конечная Y — «ы»." }
  - { kind: register, text: "Нейтральное слово на все случаи. В спорте POMARAŃCZOWI без существительного зовут сборную Нидерландов, по цвету её формы, но это газетный оборот. SKÓRKA POMARAŃCZOWA, буквально «апельсиновая корка», ещё и бытовое название целлюлита." }
collocations:
  - { pl: "sok pomarańczowy", ru: "апельсиновый сок" }
  - { pl: "skórka pomarańczowa", ru: "апельсиновая корка; целлюлит (разг.)" }
  - { pl: "pomarańczowa kamizelka", ru: "оранжевый жилет" }
family:
  - { pl: "pomarańcza", ru: "апельсин", relation: root }
  - { pl: "pomarańczka", ru: "апельсинчик", relation: derived }
  - { pl: "pomarańczowo", ru: "оранжево, в оранжевый цвет", relation: derived }
etymology: "POMARAŃCZA — заимствование из итальянского pomo arancio, «плод апельсинового дерева»: POM- значит «яблоко», а ARANCIO через арабский восходит к санскриту. Русское «апельсин» собрано по той же модели, но из голландского: appelsien, «китайское яблоко». То есть и поляк, и русский называют апельсин «яблоком», просто из разных языков."
memory: "Pomarańczowy — и «оранжевый», и «апельсиновый»: pomarańczowa sukienka, sok pomarańczowy. От pomarańcza — апельсин. Читается «помараньчо́вы»: ń перед cz — мягкое «нь»."
idioms:
  - { pl: "skórka pomarańczowa", ru: "апельсиновая корка, то есть целлюлит" }
