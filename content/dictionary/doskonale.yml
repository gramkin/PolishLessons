  - id: perfectly
    ru: "вполне, прекрасно (с глаголами знания и речи)"
    examples:
      - pl: "Wiem doskonale, o czym mówisz."
        ru: "Я прекрасно знаю, о чём ты говоришь."
        source: { kind: translated, id: 4413348 }
      - pl: "Mówisz doskonale po francusku."
        ru: "Ты превосходно говоришь по-французски."
        source: { kind: translated, id: 13360936 }
      - pl: "Betty doskonale mówi po esperancku."
        ru: "Бетти превосходно говорит на эсперанто."
        source: { kind: translated, id: 532261 }
notes:
  - { kind: usage, text: "Doskonale! как отдельная реплика значит «Отлично!», «Превосходно!» — частый отклик на хорошую новость." }
  - { kind: usage, text: "С глаголами восприятия значит «вполне, прекрасно»: wiem doskonale «я прекрасно знаю», rozumiem doskonale «я прекрасно понимаю»." }
  - { kind: usage, text: "Прилагательное — doskonały «превосходный». Синонимы наречия — świetnie и znakomicie." }
  - { kind: pronunciation, text: "Ударение на предпоследний слог: доскона́ле. Все o читаются как «о»." }
collocations:
  - { pl: "doskonale wiem", ru: "я прекрасно знаю" }
  - { pl: "doskonale mówi", ru: "превосходно говорит" }
  - { pl: "doskonale się bawić", ru: "прекрасно проводить время" }
etymology: "От doskonały «совершенный», из do- и konać «совершать, завершать»: буквально «доведённый до конца». Русское «совершенный» от «свершить» построено так же."
memory: "doskonale — «отлично, прекрасно». Отдельной репликой Doskonale! значит «Отлично!». С глаголами знания даёт wiem doskonale «я прекрасно знаю». Прилагательное — doskonały."
