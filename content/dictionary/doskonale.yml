# review
id: doskonale
format: 2
lemma: "doskonale"
rank: 1317
pos: adv
pron: { cyr: "доскона́ле" }
senses:
  - id: excellent
    ru: "отлично, превосходно"
    examples:
      - pl: "Doskonale!"
        ru: "Отлично!"
        source: { kind: translated, id: 525181 }
      - pl: "Doskonale."
        ru: "Прекрасно."
        source: { kind: translated, id: 13782645 }
      - pl: "Mary doskonale tańczy."
        ru: "Мэри превосходно танцует."
