# review
id: utrzymywac
format: 2
lemma: "utrzymywać"
rank: 2341
pos: verb
aspect: imperf
aspectPair: utrzymac
pron: { cyr: "утшымы́ваць" }
senses:
  - id: keep
    ru: "поддерживать, содержать в каком-л. состоянии"
    examples:
      - pl: "On utrzymuje z nią kontakt."
        ru: "Он поддерживает с ней связь."
        source: { kind: tatoeba, id: 3605063 }
      - pl: "Utrzymuje swój pokój w czystości."
        ru: "Он содержит свою комнату в чистоте."
        source: { kind: translated, id: 579179 }
      - pl: "Sport utrzymuje nas w dobrej kondycji."
        ru: "Спорт поддерживает нас в хорошей форме."
        source: { kind: translated, id: 1590499 }
  - id: support
    ru: "содержать (семью), кормить"
    examples:
      - pl: "Musiał utrzymywać liczną rodzinę."
        ru: "Ему приходилось содержать большую семью."
        source: { kind: translated, id: 551634 }
      - pl: "Jesteś już dość dorosły, by utrzymywać się samemu."
        ru: "Ты уже достаточно взрослый, чтобы содержать себя сам."
        source: { kind: translated, id: 351985 }
  - id: maintain
    ru: "утверждать, настаивать"
    examples:
      - pl: "Ona wciąż utrzymuje, że jest niewinna."
        ru: "Она по-прежнему утверждает, что невиновна."
        source: { kind: translated, id: 653171 }
      - pl: "Podczas procesu utrzymywał, że działał w ramach obrony koniecznej, i został oczyszczony z zarzutów."
        ru: "На процессе он утверждал, что действовал в рамках необходимой обороны, и был оправдан."
        source: { kind: translated, id: 3749353 }
notes:
  - { kind: government, text: "Держать в чистоте — utrzymywać w czystości, предложный падеж. Поддерживать связь — utrzymywać kontakt, винительный." }
  - { kind: usage, text: "Три значения расходятся далеко: «поддерживать», «содержать» (кормить) и «утверждать». Последнее — книжное, обычное в судебных и научных текстах." }
  - { kind: false-friend, text: "u- + trzymywać от trzymać «держать», которое уже есть в словаре. Русское «удерживать» — тот же состав, но значения разошлись." }
  - { kind: usage, text: "С się — «содержать себя, кормиться»: utrzymywać się z czegoś «жить на что-л.», с родительным. Совершенный вид — utrzymać." }
collocations:
  - { pl: "utrzymywać kontakt", ru: "поддерживать связь" }
  - { pl: "utrzymywać w czystości", ru: "содержать в чистоте" }
  - { pl: "utrzymywać się z czegoś", ru: "жить на что-л." }
etymology: "u- + trzymać «держать»; русское «удерживать» того же состава, но значения разошлись."
memory: "utrzymywać — «поддерживать», «содержать» (семью) и «утверждать». Запомните utrzymywać się z czegoś «жить на что-л.», с родительным. Совершенный вид — utrzymać."
idioms:
