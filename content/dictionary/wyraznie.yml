  - { pl: "wyraz", ru: "слово, выражение", relation: root }
  - { pl: "wyrazić", ru: "выразить", relation: root }
etymology: "От wyraźny «отчётливый», того же корня, что wyraz «слово» и wyrazić «выразить». Русское «выразить» и «выражение» — тот же корень."
memory: "wyraźnie — «отчётливо, внятно», а также «заметно»: Wyraźnie się postarzał. Но главное — превосходная форма najwyraźniej, которая значит уже не «отчётливее всего», а «по-видимому»: Najwyraźniej masz rację «Ты, видимо, прав». Это её самое частое употребление."
