# review
id: wyraznie
format: 2
lemma: "wyraźnie"
rank: 916
pos: adv
pron: { cyr: "выра́зьне" }
senses:
  - id: clearly
    ru: "отчётливо, ясно, внятно"
    examples:
      - pl: "Powiedź to wyraźnie."
        ru: "Скажи это отчётливо."
        source: { kind: translated, id: 559987 }
      - pl: "Wyraźnie!"
        ru: "Отчётливо!"
        source: { kind: translated, id: 10202793 }
      - pl: "Mów wyraźnie, nic nie słyszę."
        ru: "Говори внятно, я ничего не слышу."
        source: { kind: authored }
  - id: markedly
    ru: "заметно, явно (о степени)"
    examples:
      - pl: "Wyraźnie się postarzał."
        ru: "Он заметно постарел."
        source: { kind: tatoeba, id: 12556890 }
      - pl: "Wyraźnie mu się polepszyło."
        ru: "Ему заметно полегчало."
        source: { kind: authored }
      - pl: "Ceny wyraźnie wzrosły."
        ru: "Цены заметно выросли."
        source: { kind: authored }
  - id: apparently
    ru: "najwyraźniej — по-видимому, судя по всему"
    note: "Превосходная степень значит не «отчётливее всего», а «видимо»."
    examples:
      - pl: "Najwyraźniej masz rację."
        ru: "Ты, видимо, прав."
        source: { kind: translated, id: 11573512 }
      - pl: "Najwyraźniej była chora."
        ru: "Она, видимо, была больна."
        source: { kind: translated, id: 6483549 }
      - pl: "Najwyraźniej jestem adoptowany."
        ru: "Я, судя по всему, приёмный."
        source: { kind: translated, id: 3655039 }
notes:
  - { kind: false-friend, text: "Превосходная степень najwyraźniej сменила значение: она значит не «отчётливее всего», а «по-видимому, судя по всему». Najwyraźniej masz rację — «Ты, видимо, прав». Это самая частая форма слова, и переводить её буквально нельзя." }
  - { kind: usage, text: "Обычное значение — «отчётливо, внятно»: Mów wyraźnie «Говори внятно». Отсюда и «заметно, явно»: Wyraźnie się postarzał «Он заметно постарел»." }
  - { kind: usage, text: "Прилагательное — wyraźny «отчётливый, явный»: wyraźna różnica «явная разница». Корень тот же, что в wyraz «слово» и wyrazić «выразить»." }
  - { kind: usage, text: "Сравнительная форма wyraźniej «отчётливее» существует, но в живой речи встречается редко: чаще скажут bardziej wyraźnie." }
collocations:
  - { pl: "mów wyraźnie", ru: "говори внятно" }
  - { pl: "najwyraźniej", ru: "по-видимому" }
  - { pl: "wyraźnie widać", ru: "отчётливо видно" }
  - { pl: "wyraźna różnica", ru: "явная разница" }
family:
