# review
id: wylac
format: 2
lemma: "wylać"
rank: 3736
pos: verb
pron: { cyr: "вы́лаць" }
senses:
  - id: pour-out
    ru: "вылить, пролить"
    examples:
      - pl: "Wylał kawę na spodnie."
        ru: "Он пролил кофе на брюки."
        source: { kind: authored }
      - pl: "Wylała zupę do zlewu."
        ru: "Она вылила суп в раковину."
        source: { kind: authored }
      - pl: "Wylej wodę z wiadra."
        ru: "Вылей воду из ведра."
        source: { kind: authored }
  - id: fire
    ru: "разг. выгнать, уволить"
    examples:
      - pl: "Szef wylał go z pracy."
        ru: "Шеф выгнал его с работы."
        source: { kind: authored }
      - pl: "Wylali go ze szkoły."
        ru: "Его выгнали из школы."
        source: { kind: authored }
  - id: overflow
    ru: "выйти из берегов (о реке)"
    examples:
      - pl: "Rzeka wylała po ulewach."
        ru: "После ливней река вышла из берегов."
        source: { kind: authored }
      - pl: "Rzeki wylały w całym regionie."
        ru: "Реки разлились по всему региону."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "WYLAĆ — «вылить, пролить», а разговорное WYLAĆ Z PRACY — «выгнать с работы». RZEKA WYLAŁA — «река вышла из берегов». Не путать с WYLECZYĆ — «вылечить». WYLAĆ ŻALE — «излить душу»." }
  - { kind: usage, text: "Пятьдесят три формы, включая WYLANI — «выгнанные»: WYLANI ZE SZKOŁY. Будущее: WYLEJĘ, WYLEJESZ, повелительное WYLEJ. В прошедшем — WYLALI, в разговоре и WYLELI. Несовершенный вид — WYLEWAĆ." }
  - { kind: government, text: "Что откуда — винительный и Z с родительным: WYLAĆ WODĘ Z WIADRA. На что — NA с винительным: WYLAĆ KAWĘ NA SPODNIE. Кого откуда — Z с родительным: WYLAĆ Z PRACY, ZE SZKOŁY." }
  - { kind: pronunciation, text: "Читается «вы́лаць», ударение на первом слоге. WYLEJĘ — «выле́е», WYLAŁ — «вы́лау»." }
  - { kind: register, text: "В прямом смысле — нейтральное. WYLAĆ Z PRACY — разговорное и грубоватое; официально — ZWOLNIĆ. WYLAĆ ŁZY, WYLAĆ ŻALE — книжное «излить»." }
collocations:
  - { pl: "wylać kawę", ru: "пролить кофе" }
  - { pl: "wylać z pracy", ru: "выгнать с работы" }
  - { pl: "wylać fundamenty", ru: "залить фундамент" }
family:
  - { pl: "lać", ru: "лить", relation: root, id: lac }
  - { pl: "nalać", ru: "налить", relation: derived }
  - { pl: "wylewać", ru: "выливать", relation: aspect }
etymology: "Приставка WY- «вы-» плюс LAĆ «лить», праславянское *liti, *lějati. Русское «вылить», «разлив» — то же гнездо; значение «выгнать» — польское разговорное."
memory: "Wylać — вылить, пролить: wylał kawę. Wylać z pracy — выгнать с работы. Rzeka wylała — река разлилась. Читается «вы́лаць»."
idioms:
  - { pl: "wylać dziecko z kąpielą", ru: "выплеснуть ребёнка вместе с водой" }
