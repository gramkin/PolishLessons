    ru: "собраться (в дорогу)"
    examples:
      - pl: "Spakowałam się i czekam na taksówkę."
        ru: "Я собралась и жду такси."
        source: { kind: authored }
      - pl: "Spakuj się wieczorem, rano nie zdążysz."
        ru: "Соберись вечером, утром не успеешь."
        source: { kind: authored }
notes:
  - { kind: pronunciation, text: "Самое полезное в этом слове — класс, а не слово. Все глаголы на -OWAĆ делают настоящее время на -UJ-, и это одно из самых надёжных правил польской морфологии, без исключений: SPAKOWAĆ даёт SPAKUJĘ, PRACOWAĆ даёт PRACUJĘ, KUPOWAĆ даёт KUPUJĘ, DZIĘKOWAĆ даёт DZIĘKUJĘ. Русскому тут даже думать не надо, у него то же самое: «паковать» даёт «пакую», «работать» — нет, но «рисовать» даёт «рисую», «ночевать» — «ночую». Правило переносится целиком: -овать даёт -ую, -ować даёт -uję." }
  - { kind: usage, text: "Возвратное SPAKOWAĆ SIĘ — обычный способ сказать «собраться в дорогу», и русский тут строит фразу иначе: SPAKOWAŁEM SIĘ отвечает не «я упаковался», а «я собрал вещи» или «я собрался». Прямое SPAKOWAĆ COŚ — об отдельной вещи или о куче вещей: SPAKOWAĆ WALIZKĘ, SPAKOWAĆ KSIĄŻKI. Разница как между русскими «собраться» и «собрать»: в первом случае собираешь себя, во втором — вещи." }
  - { kind: government, text: "Что — винительный; куда — предлог DO с родительным: SPAKOWAĆ KSIĄŻKI DO KARTONU, UBRANIA DO WALIZKI, NARZĘDZIA DO SKRZYNKI. Русский предпочитает «в» с винительным — «в коробку», — и это одно из мест, где польский берёт родительный там, где русский винительный. Срок — за сколько — идёт предлогом W с винительным: SPAKOWAĆ SIĘ W KWADRANS." }
  - { kind: false-friend, text: "Корень не славянский: он пришёл из немецкого PACKEN, и русский взял то же слово тем же путём — «паковать», «пакет», «упаковка». То есть сходство здесь не родственное, а общее заимствование, и совпадение держится лучше, чем у исконных корней: PAKOWAĆ и «паковать», PAKUNEK и «пакет», OPAKOWANIE и «упаковка». Расходится приставка: русское «упаковать» отвечает польскому SPAKOWAĆ или ZAPAKOWAĆ, а не UPAKOWAĆ, которого в польском нет." }
collocations:
  - { pl: "spakować walizkę", ru: "собрать чемодан" }
  - { pl: "spakować się w kwadrans", ru: "собраться за четверть часа" }
  - { pl: "spakować książki do kartonu", ru: "упаковать книги в коробку" }
family:
  - { pl: "pakować", ru: "паковать, упаковывать", relation: aspect, id: pakowac }
  - { pl: "zapakować", ru: "упаковать, завернуть", relation: root }
  - { pl: "opakowanie", ru: "упаковка", relation: derived }
etymology: "Приставка s- «с-, вместе» и PAKOWAĆ, из немецкого PACKEN «укладывать, упаковывать», которое пришло в польский через торговый язык вместе с самим тюком — PAK, PAKUNEK. Русский взял то же немецкое слово и тем же путём: «паковать», «пакет», «упаковка». Поэтому совпадение тут не унаследованное, а общее заимствование из третьего языка, и оно прочнее обычного: заимствованные корни не успели разойтись по звукам, как исконные. Приставка s- делает ровно то, что русская «с-» в «сложить, собрать»: сводит разбросанное в одно место."
memory: "Все глаголы на -ować дают настоящее на -uj-: spakować → spakuję, pracować → pracuję. Как русское -овать → -ую: «паковать → пакую». А spakować się — это «собраться», а не «упаковаться»."
idioms:
  - { pl: "spakować się w kwadrans", ru: "собраться за четверть часа" }
  - { pl: "spakować manatki", ru: "собрать барахлишко, смотать удочки" }
