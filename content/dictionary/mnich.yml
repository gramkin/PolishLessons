# review
id: mnich
format: 2
lemma: "mnich"
rank: 4044
pos: noun
pron: { cyr: "мних" }
senses:
  - id: monk
    ru: "монах"
    examples:
      - pl: "Mnich modlił się w ciszy."
        ru: "Монах молился в тишине."
        source: { kind: authored }
      - pl: "W klasztorze mieszka dwudziestu mnichów."
        ru: "В монастыре живут двадцать монахов."
        source: { kind: authored }
      - pl: "Mnisi wstają przed świtem."
        ru: "Монахи встают до рассвета."
        source: { kind: authored }
  - id: recluse
    ru: "отшельник, затворник (перен.)"
    examples:
      - pl: "Żyje jak mnich, bez telewizora i telefonu."
        ru: "Он живёт как монах, без телевизора и телефона."
        source: { kind: authored }
      - pl: "Od lat pracuje z cierpliwością mnicha."
        ru: "Он годами работает с монашеским терпением."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "MNICH — «монах»: то же слово, но без гласной после M. Монахиня — ZAKONNICA или MNISZKA. Монастырь — KLASZTOR, а не «монастырь»." }
  - { kind: usage, text: "Мужской род, лицо. Множественное — MNISI: CH переходит в Ś перед мужско-личным -I. Форма MNICHY — пренебрежительная, её не учим. Местный и звательный — MNICHU." }
  - { kind: government, text: "Стать монахом — ZOSTAĆ MNICHEM, творительный. Жить как монах — ŻYĆ JAK MNICH, именительный после JAK." }
  - { kind: pronunciation, text: "Читается «мних», один слог: MN в начале произносится слитно, без гласной между ними. Конечное CH — «х»." }
collocations:
  - { pl: "mnich buddyjski", ru: "буддийский монах" }
  - { pl: "zostać mnichem", ru: "постричься в монахи" }
  - { pl: "cela mnicha", ru: "монашеская келья" }
family:
  - { pl: "mniszka", ru: "монахиня", relation: derived }
  - { pl: "klasztor", ru: "монастырь", relation: root }
  - { pl: "zakonnik", ru: "монах, член ордена", relation: root }
etymology: "В конечном счёте от латинского MONACHUS и греческого MONACHOS «одинокий». Русское «монах» сохранило гласную, а в польском она выпала. Древнерусское «мних» — того же происхождения."
memory: "Mnich — монах, без гласной: «мних». Mnisi — монахи. Klasztor — монастырь. Żyć jak mnich — жить по-монашески."
idioms:
  - { pl: "żyć jak mnich", ru: "жить аскетом" }
