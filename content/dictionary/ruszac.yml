# review
id: ruszac
format: 2
lemma: "ruszać"
rank: 367
pos: verb
aspect: imperf
pron: { cyr: "ру́шаць" }
senses:
  - id: touch
    ru: "трогать, прикасаться"
    examples:
      - pl: "Nie ruszaj!"
        ru: "Не трогай!"
        source: { kind: translated, id: 582829 }
      - pl: "Poszkodowanego nie wolno ruszać, należy czekać na pogotowie."
        ru: "Пострадавшего нельзя трогать, надо ждать скорую помощь."
        source: { kind: tatoeba, id: 13547048 }
      - pl: "Nie ruszaj moich rzeczy."
        ru: "Не трогай мои вещи."
        source: { kind: authored }
  - id: set-off
    ru: "трогаться, двигаться, отправляться"
    examples:
      - pl: "Ruszam do akcji."
        ru: "Я вступаю в дело."
        source: { kind: translated, id: 12955905 }
      - pl: "Dziś ruszamy do bitwy."
        ru: "Сегодня мы выступаем в бой."
        source: { kind: translated, id: 12454784 }
      - pl: "Pociąg rusza o piątej."
        ru: "Поезд отправляется в пять."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Русское «рушить» — то же самое слово, но значения разошлись: поляки сохранили исходное «сдвинуть с места», так что ruszać это «трогать». Русское «рушить» будет burzyć или niszczyć." }
  - { kind: usage, text: "Два значения: «трогать, прикасаться» (Nie ruszaj! «Не трогай!») и «трогаться, отправляться» (Pociąg rusza «Поезд трогается»)." }
  - { kind: usage, text: "ruszać się значит «шевелиться, двигаться»: Nie ruszaj się! «Не шевелись!»" }
  - { kind: usage, text: "Совершенный вид — ruszyć. Ruszamy! — готовая команда «Выдвигаемся!»" }
collocations:
  - { pl: "nie ruszaj!", ru: "не трогай!" }
  - { pl: "ruszać się", ru: "шевелиться, двигаться" }
  - { pl: "ruszać w drogę", ru: "отправляться в путь" }
  - { pl: "ruszamy!", ru: "выдвигаемся!" }
etymology: "Праславянское *rušiti «двигать, сдвигать с места». Русское «рушить» — то же самое слово, но его значение ушло к разрушению, а польский сохранил исходное «сдвинуть»."
memory: "ruszać — «трогать» и «трогаться». Русское «рушить» того же корня, но поляки сохранили исходный смысл «сдвинуть с места». Nie ruszaj! значит «Не трогай!», а Ruszamy! — «Выдвигаемся!»"
idioms:
  - { pl: "ruszać się jak mucha w smole", ru: "двигаться как муха в смоле" }
  - { pl: "ruszyć głową", ru: "пошевелить мозгами" }
  - { pl: "nie ruszać się z miejsca", ru: "не двигаться с места" }
