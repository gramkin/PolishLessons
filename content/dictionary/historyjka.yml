etymology: "Уменьшительное от HISTORIA с суффиксом -KA, а само HISTORIA — из латинского HISTORIA и греческого HISTORIA «расспрос, рассказ о разузнанном», от HISTOR «знающий, свидетель». Оба языка взяли слово из латыни школы и церкви, поэтому основа совпадает. Расходится работа суффикса: русское -КА при существительных на -ИЯ даёт либо ласкательное, либо сниженное, но от «истории» такого слова язык почти не образует, тогда как польский строит его свободно и пользуется им постоянно. Соединительное J в основе — след того же правила, что в LINIJKA и PARTYJKA: между мягким окончанием -IA и суффиксом -KA польский вставляет J, чтобы не столкнулись две гласные."
memory: "Уменьшительное от historia, но уменьшение снижающее: это байка, побасенка, рассказ, которому не верят — to tylko historyjka. Русская «история» шире и нейтральнее. Отдельно: historyjka obrazkowa значит «комикс». Падежи как у всей серии на -ka: historyjce с меной k→c и historyjek с беглым e. Соединительное j в основе — как в linijka от linia."
