notes:
  - { kind: false-friend, text: "Слово образовано от HISTORIA, но значит не то, что русская «история». Польское HISTORIA покрывает и науку, и событие, и рассказ; HISTORYJKA — уменьшительное, и уменьшение здесь не ласковое, а снижающее: это байка, побасенка, случай не стоящий доверия. Русскому отвечают «байка», «побасенка», иногда «анекдот» в старом смысле рассказа. Говоря TO TYLKO HISTORYJKA, поляк отказывает рассказу в серьёзности. Отдельно стоит сочетание HISTORYJKA OBRAZKOWA: так по-польски называется комикс, и слово KOMIKS тоже есть, но первое старше и встречается в школьных учебниках." }
  - { kind: usage, text: "Десять форм, женский род. Дательный и местный единственного — HISTORYJCE, где заднеязычное K перед окончанием -E переходит в C: обязательная мена, та же, что в KACZCE, NERCE и MARCE. Родительный множественного — HISTORYJEK, с беглым E между J и K. Родительный единственного и именительный множественного — одна форма HISTORYJKI. Основа содержит YJ, потому что суффикс -KA присоединён к HISTORIA через соединительное J: так же устроены LINIJKA от LINIA и FAMILIJKA от FAMILIA." }
  - { kind: pronunciation, text: "Читается «хисторы́йка», четыре слога, ударение на третьем. Начальное H даёт «х», буква Y — «ы», а сочетание YJ звучит как «ый». Поэтому середина слова получается тяжеловатой: «сторы-й». В форме HISTORYJCE сочетание JC читается «йц»: «хисторы́йце». В форме HISTORYJEK беглое E произносится отчётливо: «хисторы́йэк». В форме HISTORYJKĘ конечное Ę даёт чистое «э»." }
  - { kind: register, text: "Слово разговорное и слегка пренебрежительное, когда речь о правдивости, и совершенно нейтральное, когда речь о детском чтении. Устойчивые сочетания: ZABAWNA HISTORYJKA, HISTORYJKA OBRAZKOWA, HISTORYJKA NA DOBRANOC «сказка на ночь». В школе HISTORYJKA OBRAZKOWA — это задание: подписать картинки по порядку. Увеличительной пары у слова нет, зато есть ряд соседей: OPOWIADANIE «рассказ» как жанр, ANEGDOTA «анекдот» в старом смысле случая из жизни, KAWAŁ «анекдот» в современном смысле шутки." }
