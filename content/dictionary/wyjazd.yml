notes:
  - { kind: pronunciation, text: "ГЛАВНОЕ ЗДЕСЬ — ПРЕДЛОЖНЫЙ ПАДЕЖ: WYJEŹDZIE. Корневое a переходит в e, а zd смягчается в ździ. Это древнее чередование, которое есть и в русском: «ехать — езжу», «везу — везёшь». В польском тот же ряд виден в miasto — w mieście, las — w lesie, lato — w lecie. Форму wyjeździe приходится просто запомнить: по общему правилу её не угадать." }
  - { kind: false-friend, text: "РУССКИЙ «ВЫЕЗД» УЖЕ ПОЛЬСКОГО. По-русски это момент отправления или место, где выезжают. Польское wyjazd значит прежде всего ВСЮ ПОЕЗДКУ целиком: wyjazd na wakacje «поездка в отпуск», wyjazd służbowy «командировка», udany wyjazd «удачная поездка». Сказать «мой выезд удался» по-русски нельзя, а по-польски — обычное дело." }
  - { kind: government, text: "Куда — na с винительным: wyjazd na wakacje, na konferencję, na wieś. Откуда — z с родительным: wyjazd z kraju, z miasta. Когда — przed wyjazdem «перед отъездом», po wyjeździe «после отъезда». Глагольная пара: wyjechać «уехать» и wyjeżdżać «уезжать»." }
collocations:
  - { pl: "wyjazd służbowy", ru: "командировка" }
  - { pl: "przed wyjazdem", ru: "перед отъездом" }
  - { pl: "wyjazd na wakacje", ru: "поездка в отпуск" }
family:
  - { pl: "wyjechać", ru: "уехать", relation: root, id: wyjechac }
  - { pl: "jazda", ru: "езда", relation: root, id: jazda }
  - { pl: "przyjazd", ru: "приезд", relation: antonym }
etymology: "От wyjechać, приставка wy- плюс корень jazd-/jech-, тот же, что в русских «ехать», «езда», «выезд». Чередование a и e в wyjazd — wyjeździe восходит к праславянскому перегласованию, которое в русском дало пары вроде «ехать — езжу». Отсюда jazda, przyjazd, zjazd, dojazd и objazd."
memory: "wyjazd — не только «выезд», но ВСЯ ПОЕЗДКА: wyjazd służbowy это командировка. И запомнить надо предложный падеж: po wyjeździe, с e вместо a и с мягким ździ. По общему правилу эту форму не угадать."
idioms:
  - { pl: "wyjazd służbowy", ru: "командировка" }
  - { pl: "przed wyjazdem", ru: "перед отъездом" }
formExamplesSkip:
