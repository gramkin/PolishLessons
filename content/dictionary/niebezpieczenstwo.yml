notes:
  - { kind: usage, text: "Средний род на -stwo, как państwo и towarzystwo. Предложный — w niebezpieczeństwie «в опасности»." }
  - { kind: usage, text: "Слово разбирается прозрачно: nie + bezpieczeństwo «безопасность», а то — от bezpieczny «безопасный». Русское «опасность» устроено иначе, от «опасаться»." }
  - { kind: government, text: "ostrzegać przed niebezpieczeństwem «предупреждать об опасности» и chronić przed niebezpieczeństwem «защищать от опасности» — оба с przed и творительным падежом." }
  - { kind: usage, text: "Прилагательное — niebezpieczny «опасный», уже есть отдельной карточкой." }
collocations:
  - { pl: "w niebezpieczeństwie", ru: "в опасности" }
  - { pl: "uniknąć niebezpieczeństwa", ru: "избежать опасности" }
  - { pl: "grozi niebezpieczeństwo", ru: "грозит опасность" }
etymology: "Отрицание nie- и bezpieczeństwo «безопасность», от bezpieczny (bez + piecza «забота»): буквально «отсутствие безопасности». Русское «опасность» идёт от «опасаться», так что образ другой."
memory: "niebezpieczeństwo — «опасность», и разбирается прозрачно: nie плюс bezpieczeństwo «безопасность». Предложный — w niebezpieczeństwie «в опасности». Управление: ostrzegać przed niebezpieczeństwem."
idioms:
