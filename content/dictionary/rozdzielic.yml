# review
id: rozdzielic
format: 2
lemma: "rozdzielić"
rank: 2620
pos: verb
pron: { cyr: "розьдзе́лиць" }
senses:
  - id: divide
    ru: "разделить, распределить"
    examples:
      - pl: "Rozdzielili pracę po równo."
        ru: "Они разделили работу поровну."
        source: { kind: authored }
      - pl: "Rozdzielę te dokumenty na trzy teczki."
        ru: "Я разложу эти документы по трём папкам."
        source: { kind: authored }
      - pl: "Majątek rozdzielono między spadkobierców."
        ru: "Имущество разделили между наследниками."
        source: { kind: authored }
  - id: separate
    ru: "разнять, развести"
    examples:
      - pl: "Nauczyciel rozdzielił bijących się chłopców."
        ru: "Учитель разнял дерущихся мальчиков."
        source: { kind: authored }
      - pl: "Rozdziel ich, zanim zrobią sobie krzywdę."
        ru: "Разними их, пока они не покалечились."
        source: { kind: authored }
notes:
  - { kind: usage, text: "ОДИН ГЛАГОЛ НА ДВА РУССКИХ. ROZDZIELIĆ COŚ — «разделить, распределить»: rozdzielić pracę, majątek, karty. ROZDZIELIĆ KOGOŚ — уже «разнять»: rozdzielić bijących się. Русский меняет слово, поляк оставляет одно и полагается на дополнение. Третий случай — карты: ROZDZIELIĆ KARTY значит «раздать карты», а не «разделить» их." }
  - { kind: pronunciation, text: "Основа ходит между dzi и dz: инфинитив ROZDZIELIĆ и будущее ROZDZIELĘ, ROZDZIELI идут с мягким dzi, повелительное ROZDZIEL — тоже, а причастие ROZDZIELONY возвращает твёрдое dz. Та же тройка, что у poprowadzić. Приставка roz- перед dz произносится звонко, примерно «розь-»." }
  - { kind: government, text: "Делят MIĘDZY KOGOŚ с винительным: rozdzielić majątek MIĘDZY spadkobiercÓW. Русское «между наследниками» ставит творительный, и это расхождение легко пропустить, потому что предлог переводится дословно. А вот ROZDZIELIĆ NA CZĘŚCI «разделить на части» совпадает с русским полностью." }
collocations:
  - { pl: "rozdzielić pracę", ru: "распределить работу" }
  - { pl: "rozdzielić karty", ru: "раздать карты" }
  - { pl: "rozdzielić bijących się", ru: "разнять дерущихся" }
family:
  - { pl: "rozdzielać", ru: "разделять, распределять (несов.)", relation: aspect }
  - { pl: "dzielić", ru: "делить", relation: root, id: dzielic }
  - { pl: "podzielić", ru: "поделить", relation: root, id: podzielic }
etymology: "Приставка roz- «раз-» и dzielić «делить», из праславянского *děliti — того же слова, что русское «делить». Разбор совпадает морфема в морфему с нашим «раз-делить», и значение «распределить» идёт прямо отсюда. Смысл «разнять» вырос позже: развести дерущихся — тоже разделить, только людей."
memory: "Дополнение решает перевод: rozdzielić pracę — «распределить», rozdzielić chłopców — «разнять», rozdzielić karty — «раздать». И падеж: między spadkobierców, винительный, а не творительный, как у нас."
idioms:
  - { pl: "rozdzielić karty", ru: "раздать карты" }
  - { pl: "rozdzielić włos na czworo", ru: "делить волос на четверо, придираться к мелочам" }
