  - id: malignant
    ru: "злокачественный (в медицине); вредоносный (о программе)"
    examples:
      - pl: "Lekarz wykrył złośliwy nowotwór."
        ru: "Врач обнаружил злокачественную опухоль."
        source: { kind: authored }
      - pl: "Komputer zainfekowało złośliwe oprogramowanie."
        ru: "Компьютер заразила вредоносная программа."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Русскому «злобный» польское ZŁOŚLIWY близко, но оттенок другой: не «злой, свирепый», а «ехидный, язвительный, любящий досадить». ZŁOŚLIWA UWAGA — «колкость», ZŁOŚLIWY UŚMIESZEK — «ехидная улыбочка». А в медицине ZŁOŚLIWY — «злокачественный»: NOWOTWÓR ZŁOŚLIWY. В компьютерах — «вредоносный»: ZŁOŚLIWE OPROGRAMOWANIE, malware." }
  - { kind: usage, text: "Полная парадигма с простыми степенями: ZŁOŚLIWY, ZŁOŚLIWSZY, NAJZŁOŚLIWSZY. Мужское-личное: ZŁOŚLIWI, ZŁOŚLIWSI, NAJZŁOŚLIWSI. ZŁOŚLIWOŚĆ — «ехидство, колкость», а ZŁOŚLIWOŚĆ RZECZY MARTWYCH — «вредность неодушевлённых предметов», шутливо о всякой поломке." }
  - { kind: government, text: "Ехидный к кому-то — ZŁOŚLIWY WOBEC KOGOŚ или DLA KOGOŚ, с родительным. Наречие ZŁOŚLIWIE — «ехидно, назло»: ZROBIŁ TO ZŁOŚLIWIE, «он сделал это назло»." }
  - { kind: pronunciation, text: "Читается «зуосьли́вы», четыре слога, ударение на предпоследнем. Ł — «у», Ś — мягкое «сь». В ZŁOŚLIWSZY: «зуосьли́вшы»." }
  - { kind: register, text: "Нейтральное слово. О человеке — осуждение, но часто с улыбкой: «язва». В медицине и IT — точный термин. ZŁOŚLIWOŚĆ RZECZY MARTWYCH — крылатая фраза о бутерброде, падающем маслом вниз." }
collocations:
  - { pl: "złośliwa uwaga", ru: "колкое замечание" }
  - { pl: "nowotwór złośliwy", ru: "злокачественная опухоль" }
  - { pl: "złośliwe oprogramowanie", ru: "вредоносная программа" }
family:
  - { pl: "złość", ru: "злость", relation: root, id: zlosc }
  - { pl: "zły", ru: "злой", relation: root, id: zly }
  - { pl: "złośliwość", ru: "ехидство; злокачественность", relation: derived }
etymology: "От ZŁOŚĆ «злость», от ZŁY «злой», общеславянского *zъlъ, того же, что русское «злой». Суффикс -LIWY означает склонность: «склонный к злости», как русское «-ливый» в «болтливый». Медицинское «злокачественный» — калька латинского malignus."
memory: "Złośliwy — ехидный, язвительный: złośliwa uwaga, złośliwy uśmieszek. В медицине — злокачественный: nowotwór złośliwy. Złośliwszy, najzłośliwszy. Читается «зуосьли́вы»."
idioms:
  - { pl: "złośliwość rzeczy martwych", ru: "вредность неодушевлённых предметов (закон подлости)" }
