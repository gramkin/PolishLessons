# review
id: bebnic
format: 2
lemma: "bębnić"
rank: 6086
pos: verb
aspect: imperf
pron: { cyr: "бэ́мбниць" }
senses:
  - id: drum
    ru: "бить в барабан, играть на ударных"
    examples:
      - pl: "W młodości bębnił w zespole rockowym."
        ru: "В молодости он играл на барабанах в рок-группе."
        source: { kind: authored }
      - pl: "Kibice bębnią przez cały mecz."
        ru: "Болельщики бьют в барабаны весь матч."
        source: { kind: authored }
  - id: patter
    ru: "барабанить, стучать (пальцами, дождь по стеклу, кулаком в дверь)"
    examples:
      - pl: "Deszcz bębnił o okno."
        ru: "Дождь барабанил в окно."
        source: { kind: translated, id: 670363 }
      - pl: "Nerwowo bębnił palcami po kierownicy."
        ru: "Он нервно барабанил пальцами по рулю."
        source: { kind: authored }
      - pl: "Ktoś bębni w drzwi o północy."
        ru: "Кто-то колотит в дверь в полночь."
        source: { kind: authored }
  - id: trumpet
    ru: "разг. трубить, твердить (о чём-л. повсюду)"
    examples:
      - pl: "Prasa bębni o tym skandalu od miesiąca."
        ru: "Пресса трубит об этом скандале уже месяц."
        source: { kind: authored }
  - id: bang-piano
    ru: "разг. бренчать (неумело на фортепиано)"
    examples:
      - pl: "Bębniła na fortepianie jakąś polkę."
        ru: "Она бренчала на фортепиано какую-то польку."
        source: { kind: authored }
notes:
  - { kind: government, text: "По чему стучат — зависит от предмета. Пальцами по поверхности — PO с предложным: BĘBNIĆ PALCAMI PO STOLE. Ударами в преграду — W или O с винительным: BĘBNIĆ W DRZWI, DESZCZ BĘBNI O SZYBY (W SZYBY). Русское «по стёклам» соблазняет на PO SZYBACH — так говорят реже." }
  - { kind: usage, text: "Глагол без прямого дополнения, страдательного причастия нет. Совершенный вид — ZABĘBNIĆ «забарабанить», однократно — ZABĘBNIĆ PALCAMI. Музыкант — PERKUSISTA, барабан — BĘBEN, малый барабан — WERBEL." }
  - { kind: pronunciation, text: "Ę перед B — «эм»: «бэ́мбниць». BĘBNIĘ — «бэ́мбнье», BĘBNIĄ — «бэ́мбньоу̃»." }
  - { kind: false-friend, text: "BĘBENEK — не только «барабанчик», но и «барабанная перепонка»: PĘKŁ MU BĘBENEK — у него лопнула барабанная перепонка." }
collocations:
  - { pl: "bębnić palcami po stole", ru: "барабанить пальцами по столу" }
  - { pl: "deszcz bębni o szyby", ru: "дождь барабанит по стёклам" }
  - { pl: "bębnić w drzwi", ru: "колотить в дверь" }
  - { pl: "bębnić na fortepianie", ru: "бренчать на фортепиано" }
  - { pl: "bębnić o czymś", ru: "трубить о чём-л." }
family:
  - { pl: "bęben", ru: "барабан", relation: root }
  - { pl: "bębenek", ru: "барабанчик; барабанная перепонка", relation: derived }
  - { pl: "zabębnić", ru: "забарабанить", relation: aspect }
  - { pl: "pukać", ru: "стучать", relation: root, id: pukac }
synonyms: ["stukać", "łomotać", "trąbić"]
etymology: "От BĘBEN «барабан», праславянское *bǫbьnъ — звукоподражание «бум-бум». Русское «бубен» — то же слово: праславянское носовое *ǫ дало русское «у» и польское Ę/Ą, ср. ZĄB — «зуб», DĄB — «дуб»."
memory: "BĘBEN = «бубен»: польский нос вместо русского «у», как в ZĄB — «зуб». Bębnić — бить в бубен, барабанить."
idioms:
