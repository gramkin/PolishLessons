# review
id: rozporzadzac
format: 2
lemma: "rozporządzać"
rank: 2421
pos: verb
aspect: imperf
pron: { cyr: "роспожо́ндзаць" }
senses:
  - id: dispose-of
    ru: "распоряжаться (чем-л.)"
    examples:
      - pl: "Rozporządza dużym majątkiem."
        ru: "Он распоряжается большим состоянием."
        source: { kind: authored }
      - pl: "Rozporządzamy skromnymi środkami."
        ru: "Мы располагаем скромными средствами."
        source: { kind: authored }
      - pl: "Kto tu rozporządza?"
        ru: "Кто здесь распоряжается?"
        source: { kind: authored }
  - id: decree
    ru: "предписывать, постановлять"
    examples:
      - pl: "Ustawa rozporządza inaczej."
        ru: "Закон предписывает иначе."
        source: { kind: authored }
      - pl: "Minister rozporządza w tej sprawie."
        ru: "Министр издаёт распоряжение по этому делу."
        source: { kind: authored }
notes:
  - { kind: government, text: "ТВОРИТЕЛЬНЫЙ падеж: rozporządzać czymś «распоряжаться чем-л.», ровно как в русском. Это редкий случай полного совпадения управления." }
  - { kind: false-friend, text: "roz- + porządek «порядок», которое уже есть в словаре. Русское «распоряжаться» собрано так же — «рас» + «порядок»." }
  - { kind: usage, text: "Существительное rozporządzenie значит «постановление, распоряжение» — официальный акт." }
  - { kind: usage, text: "В корпусе глагол не встречается, поэтому все примеры составлены вручную." }
collocations:
  - { pl: "rozporządzać czymś", ru: "распоряжаться чем-л." }
  - { pl: "rozporządzenie ministra", ru: "постановление министра" }
etymology: "roz- + porządek «порядок»; русское «распоряжаться» собрано так же."
memory: "rozporządzać czymś — «распоряжаться чем-л.», с творительным, как в русском. Существительное rozporządzenie — «постановление»."
