etymology: "Из праславянского *věža, первоначально «передвижное жильё, кибитка», от корня «везти». Древнерусское «вѣжа» значило то же и дожило до летописей, но в современном русском исчезло: его вытеснила «башня», заимствованная через польское baszta из итальянского. Отсюда wieżowiec «небоскрёб» и wieżyczka «башенка»."
memory: "wieża — «башня», и это родное славянское слово, то самое древнерусское «вѣжа». Русский его потерял и взял взамен «башню» — через польское baszta. Так что в польском башен две: своя wieża и пришлая baszta. И не забудьте шахматы: wieża — это ладья."
