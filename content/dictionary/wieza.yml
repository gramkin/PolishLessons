notes:
  - { kind: false-friend, text: "РОДСТВЕННИК ЕСТЬ, НО В РУССКОМ ОН УМЕР. Древнерусское «вѣжа» — то же слово: сначала кочевой шатёр, передвижное жильё, потом башня. Из живого русского оно ушло, и его место заняла «башня» — заимствование, пришедшее как раз через польское baszta. Получилось так, что в польском живут оба слова: родное wieża и заимствованное baszta «башня крепостной стены», а в русском осталось только заимствование." }
  - { kind: usage, text: "Где русский скажет «вышка», польский почти всегда скажет wieża: wieża ciśnień «водонапорная башня», wieża wiertnicza «буровая вышка», wieża kontrolna «диспетчерская вышка». Отдельно стоит шахматное значение: wieża — это «ладья», а не «башня», хотя фигура и похожа на башенку." }
  - { kind: pronunciation, text: "wie читается как «ве», ż как ж: «ве́жа». В родительном множественного окончания нет вовсе — просто wież, и на конце ж оглушается до ш: «веш». Это обычное польское правило: конечные звонкие согласные теряют голос." }
collocations:
