format: 2
lemma: "pożyczyć"
rank: 1621
pos: verb
aspect: perf
pron: { cyr: "пожы́чыць" }
senses:
  - id: lend
    ru: "одолжить (дать)"
    examples:
      - pl: "Pożycz mi samochód."
        ru: "Одолжи мне машину."
        source: { kind: translated, id: 704064 }
      - pl: "Pożycz mi swój słownik."
        ru: "Одолжи мне свой словарь."
        source: { kind: translated, id: 622658 }
      - pl: "Pożyczył mi dwie książki."
        ru: "Он одолжил мне две книги."
        source: { kind: translated, id: 364573 }
  - id: borrow
    ru: "одолжить, взять взаймы"
    examples:
      - pl: "Czy możesz pożyczyć mi swój rower?"
        ru: "Можешь одолжить мне твой велосипед?"
        source: { kind: tatoeba, id: 2143137 }
      - pl: "Czy mógłbym pożyczyć Twój samochód?"
        ru: "Не мог бы ты мне одолжить свою машину?"
        source: { kind: tatoeba, id: 745257 }
      - pl: "Pożyczyłem słownik od kolegi."
        ru: "Я одолжил словарь у коллеги."
        source: { kind: translated, id: 367828 }
notes:
  - { kind: false-friend, text: "Одно слово на оба направления: pożyczyć komuś «одолжить кому-то (дать)» и pożyczyć od kogoś «одолжить у кого-то (взять)». Направление задаёт падеж: дательный — даёшь, od с родительным — берёшь." }
  - { kind: government, text: "Pożycz mi… — «Одолжи мне…», дательный падеж; Pożyczyłem od kolegi — «Я взял у коллеги», предлог od." }
  - { kind: usage, text: "Несовершенный вид — pożyczać. Существительное pożyczka значит «заём, кредит»." }
  - { kind: usage, text: "Разговорно pożyczyć может иронически значить «украсть»: Nie ukradłam, tylko pożyczyłam «Я не украла, а одолжила»." }
collocations:
  - { pl: "pożyczyć komuś", ru: "одолжить кому-то" }
  - { pl: "pożyczyć od kogoś", ru: "занять у кого-то" }
  - { pl: "pożyczyć pieniądze", ru: "одолжить денег" }
etymology: "Приставка po- + życzyć «желать», исходно «пожелать, уступить по доброй воле». Русское «одолжить» идёт от «долг», то есть от обязательства вернуть — метафора другая, а смысл сошёлся."
memory: "pożyczyć — одно слово на оба направления: pożyczyć komuś «одолжить кому-то» (дать) и pożyczyć od kogoś «одолжить у кого-то» (взять). Направление задаёт падеж: дательный или od с родительным."
idioms:
