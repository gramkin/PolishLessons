# review
id: ocenic
format: 2
lemma: "ocenić"
rank: 4934
pos: verb
pron: { cyr: "оце́ниць" }
senses:
  - id: assess
    ru: "оценить, дать оценку"
    examples:
      - pl: "Trudno ocenić jego pracę."
        ru: "Трудно оценить его работу."
        source: { kind: authored }
      - pl: "Eksperci ocenili szkody na milion złotych."
        ru: "Эксперты оценили ущерб в миллион злотых."
        source: { kind: authored }
      - pl: "Oceń go po czynach, a nie po słowach."
        ru: "Оценивай его по поступкам, а не по словам."
        source: { kind: authored }
  - id: grade
    ru: "поставить оценку (в школе)"
    examples:
      - pl: "Nauczyciel ocenił wypracowanie na czwórkę."
        ru: "Учитель оценил сочинение на четвёрку."
        source: { kind: authored }
      - pl: "Jury oceniło występy uczestników."
        ru: "Жюри оценило выступления участников."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "OCENIĆ — «оценить» как «дать оценку, определить стоимость». Русское «оценить» в смысле «признать по достоинству» — DOCENIĆ: DOCENIŁEM JEJ POMOC, «я оценил её помощь». Скажете OCENIŁEM JEJ POMOC — прозвучит как «я поставил её помощи оценку»." }
  - { kind: usage, text: "Пятьдесят три формы — подпись переходного глагола совершенного вида: страдательное OCENIONY и деепричастие OCENIWSZY. Повелительное OCEŃ, OCEŃCIE — с мягким Ń. Видовой партнёр — OCENIAĆ: NIE OCENIAJ LUDZI PO WYGLĄDZIE." }
  - { kind: government, text: "Что — винительный: OCENIĆ PRACĘ, RYZYKO. Во сколько — NA с винительным: OCENIĆ STRATY NA MILION, OCENIĆ NA PIĄTKĘ. Как — наречием: OCENIĆ WYSOKO, NISKO, POZYTYWNIE." }
  - { kind: pronunciation, text: "Читается «оце́ниць», три слога, ударение на предпоследнем. C — «ц», E — «э», NI — мягкое «ни». Конечное Ć — «ць». OCEŃ — «о́цень»." }
  - { kind: register, text: "Нейтральное слово школы, работы, экспертизы. Устойчивое: OCENIĆ SYTUACJĘ, OCENIĆ RYZYKO, OCENIĆ KOGOŚ PO POZORACH, «судить по внешности»." }
collocations:
  - { pl: "ocenić sytuację", ru: "оценить ситуацию" }
  - { pl: "ocenić na piątkę", ru: "оценить на пятёрку" }
  - { pl: "ocenić ryzyko", ru: "оценить риск" }
family:
  - { pl: "oceniać", ru: "оценивать", relation: aspect, id: oceniac }
  - { pl: "ocena", ru: "оценка", relation: derived, id: ocena }
  - { pl: "docenić", ru: "оценить по достоинству", relation: root }
etymology: "Приставка O- плюс CENIĆ «ценить», от CENA «цена», древнее заимствование, родственное русскому «цена», «ценить», «оценить»."
memory: "Ocenić — оценить, дать оценку: ocenić pracę, ocenić na piątkę, ocenić straty. По достоинству — docenić! Oceń — с Ń. Читается «оце́ниць»."
idioms:
  - { pl: "ocenić kogoś po pozorach", ru: "судить о ком-то по внешности" }
