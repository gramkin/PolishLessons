# review
id: zostawac
format: 2
lemma: "zostawać"
rank: 768
pos: verb
aspect: imperf
aspectPair: zostac
pron: { cyr: "зоста́ваць" }
senses:
  - id: stay
    ru: "оставаться"
    examples:
      - pl: "Idziesz czy zostajesz?"
        ru: "Ты идёшь или остаёшься?"
        source: { kind: tatoeba, id: 981792 }
      - pl: "Zostajesz tam."
        ru: "Ты остаёшься там."
        source: { kind: translated, id: 8725854 }
      - pl: "Zostaję w domu."
        ru: "Я остаюсь дома."
        source: { kind: translated, id: 5326063 }
  - id: become
    ru: "zostawać KIMŚ — становиться кем-л. (творительный!)"
    note: "Второе значение, неожиданное для русского уха."
    examples:
      - pl: "Niewiele kobiet zostaje matkami."
        ru: "Немногие женщины становятся матерями."
        source: { kind: tatoeba, id: 668685 }
      - pl: "Przez trzy lata zostawałem pracownikiem roku."
        ru: "Три года подряд я становился работником года."
        source: { kind: translated, id: 3886415 }
      - pl: "Po studiach zostaje lekarzem."
        ru: "После учёбы он становится врачом."
        source: { kind: authored }
  - id: stay-long
    ru: "zostawać na długo — оставаться надолго"
    examples:
      - pl: "On zostaje na długo za każdym razem, kiedy przyjeżdża."
        ru: "Он остается надолго всякий раз, как приедет."
        source: { kind: tatoeba, id: 3660842 }
      - pl: "Po prostu nie lubię zostawać z tyłu."
        ru: "Я просто не люблю оставаться позади."
        source: { kind: translated, id: 3897612 }
      - pl: "Zimą zostajemy chętnie w domu."
        ru: "Зимой мы охотно остаёмся дома."
        source: { kind: translated, id: 4953547 }
  - id: aspect
    ru: "zostawać — процесс; zostać — один раз"
    examples:
      - pl: "Oni zostają, ja idę."
        ru: "Они остаются, я ухожу."
        source: { kind: translated, id: 12905149 }
      - pl: "Zostajemy."
        ru: "Мы остаёмся."
        source: { kind: translated, id: 8746803 }
      - pl: "Nie zostawaj w tyle!"
        ru: "Не отставай!"
        source: { kind: translated, id: 4746932 }
notes:
  - { kind: government, text: "Два значения, и второе — главное отличие от русского. zostawać значит «оставаться» (Zostaję w domu) и «становиться» (Niewiele kobiet zostaje matkami «Немногие женщины становятся матерями»). Во втором значении нужен творительный падеж: zostać lekarzem, zostać matką." }
  - { kind: usage, text: "Совершенный вид — zostać, и он же строит страдательный залог: został zwolniony «его уволили», dom został sprzedany «дом был продан»." }
  - { kind: usage, text: "nie zostawać w tyle — «не отставать», буквально «не оставаться позади»." }
  - { kind: usage, text: "Родня: zostać «остаться; стать», zostawić «оставить (что-то где-то)», pozostawać «пребывать». Не путайте zostawać «оставаться» и zostawiać «оставлять»." }
collocations:
  - { pl: "zostawać w domu", ru: "оставаться дома" }
  - { pl: "zostać kimś", ru: "стать кем-либо" }
  - { pl: "nie zostawać w tyle", ru: "не отставать" }
  - { pl: "zostać lekarzem", ru: "стать врачом" }
family:
  - { pl: "zostać", ru: "остаться; стать", relation: aspect }
  - { pl: "stać", ru: "стоять", relation: root }
  - { pl: "zostawić", ru: "оставить", relation: root }
  - { pl: "pozostawać", ru: "пребывать", relation: root }
etymology: "za- + stawać, от stać «стоять» — то же гнездо, что русские «оставаться» и «стать»."
memory: "zostawać работает на два значения. Первое ожидаемое — «оставаться»: Zostaję w domu. Второе неожиданное — «становиться», и там нужен творительный падеж: Niewiele kobiet zostaje matkami «Немногие женщины становятся матерями». Совершенный вид zostać вдобавок строит страдательный залог: został zwolniony «его уволили»."
idioms:
  - { pl: "nie zostawać w tyle", ru: "не отставать" }
  - { pl: "zostać kimś", ru: "стать кем-либо" }
  - { pl: "zostawać w domu", ru: "оставаться дома" }
