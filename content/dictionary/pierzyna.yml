        ru: "Над долиной лежала густая пелена тумана."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Русская перина обычно лежит под человеком. Польская PIERZYNA — толстое пуховое одеяло, которым укрываются: SPAĆ POD PIERZYNĄ. Обычное одеяло — KOŁDRA." }
  - { kind: usage, text: "Женский род, склоняется как KOBIETA: W PIERZYNIE, POD PIERZYNĄ. Звательный PIERZYNO не употребляется." }
  - { kind: pronunciation, text: "RZ читается «ж», IE — мягкое «пе»: «пежы́на». Ударение на предпоследнем слоге." }
collocations:
