# review
id: wywozic
format: 2
lemma: "wywozić"
rank: 5852
pos: verb
aspect: imperf
pron: { cyr: "выво́зиць" }
senses:
  - id: take-out
    ru: "вывозить (груз, мусор, товар)"
    examples:
      - pl: "Śmieci wywozi się u nas trzy razy w tygodniu."
        ru: "Мусор у нас вывозят три раза в неделю."
        source: { kind: translated, id: 880302 }
      - pl: "Ciężarówki wywożą ziemię z budowy."
        ru: "Грузовики вывозят землю со стройки."
        source: { kind: authored }
      - pl: "Firma wywozi meble do Niemiec."
        ru: "Фирма вывозит мебель в Германию."
        source: { kind: authored }
  - id: deport
    ru: "вывозить, депортировать (людей, ист.)"
    examples:
      - pl: "W czasie wojny wywożono ludzi na Syberię."
        ru: "Во время войны людей вывозили в Сибирь."
        source: { kind: authored }
      - pl: "Okupanci wywozili dzieci do obozów."
        ru: "Оккупанты вывозили детей в лагеря."
        source: { kind: authored }
  - id: take-away
    ru: "увозить с собой (впечатления, воспоминания)"
    examples:
      - pl: "Turyści wywożą z Krakowa piękne wspomnienia."
        ru: "Туристы увозят из Кракова прекрасные воспоминания."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Несовершенный вид; совершенный — WYWIEŹĆ: CO TYDZIEŃ WYWOZIMY ŚMIECI «каждую неделю вывозим мусор», а WCZORAJ WYWIEŹLIŚMY ŚMIECI «вчера вывезли мусор». WYWOZIĆ — повторяющееся или длящееся действие, WYWIEŹĆ — однократное, доведённое до конца." }
  - { kind: pronunciation, text: "Чередование Z/Ż: WYWOZIĆ, WYWOZISZ, но WYWOŻĘ, WYWOŻĄ, WYWOŻONY — «выво́жэ», «вывожо́ны». Повелительное — WYWOŹ, WYWOŹCIE, без Ó: так же, как WOŹ от WOZIĆ и NOŚ от NOSIĆ." }
  - { kind: government, text: "Что — винительный, откуда — Z + родительный, куда — DO + родительный или NA + винительный: WYWOZIĆ ŚMIECI Z PODWÓRKA NA WYSYPISKO. За границу — ZA GRANICĘ. Людей — тоже винительный: WYWOZIĆ LUDZI NA SYBERIĘ «депортировать людей в Сибирь»." }
  - { kind: false-friend, text: "Русское «вывозить» в смысле «вытянуть, справиться» («он всё вывозит») по-польски так не говорят: это DAWAĆ RADĘ. WYWOZIĆ — только буквально «вывозить на транспорте» и «увозить с собой» впечатления." }
collocations:
  - { pl: "wywozić śmieci", ru: "вывозить мусор" }
  - { pl: "wywozić za granicę", ru: "вывозить за границу" }
  - { pl: "wywozić towar", ru: "вывозить товар" }
  - { pl: "wywozić wspomnienia", ru: "увозить с собой воспоминания" }
family:
  - { pl: "wywieźć", ru: "вывезти", relation: aspect }
  - { pl: "wozić", ru: "возить", relation: root }
  - { pl: "wóz", ru: "повозка, телега", relation: root, id: woz }
  - { pl: "wywóz", ru: "вывоз", relation: derived }
  - { pl: "przywozić", ru: "привозить", relation: antonym }
etymology: "Приставка WY- «вы-» плюс WOZIĆ «возить», праславянское *voziti, то же, что русское «возить»; WY- соответствует русскому «вы-»."
memory: "Wy- = «вы-», wozić = «возить»: wywozić — вывозить. Śmieci wywożą w czwartki — мусор вывозят по четвергам."
idioms:
  - { pl: "wywozić kogoś na taczkach", ru: "с позором выгонять кого-то (буквально «вывозить на тачке»)" }
formExamplesSkip:
  - { form: "wywoziwszy", reason: "деепричастие прошедшего времени на -wszy образуется от совершенного вида, а wywozić — несовершенного: ему соответствует wywożąc, а совершенному wywieźć — wywiózłszy" }
  - { form: "wywóź", reason: "форма не нормативна: повелительное наклонение — wywoź. Глаголы этого типа сохраняют o во всех формах повелительного наклонения: wozić — woź, nosić — noś" }
  - { form: "wywóźcie", reason: "форма не нормативна: повелительное наклонение — wywoźcie, как woźcie от wozić. То же основание, по которому без примеров оставлена форма wywóź" }
  - { form: "wywóźmy", reason: "форма не нормативна: повелительное наклонение — wywoźmy, как woźmy от wozić. То же основание, по которому без примеров оставлена форма wywóź" }
