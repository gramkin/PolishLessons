# review
id: pomyslec
format: 2
lemma: "pomyśleć"
rank: 261
pos: verb
aspect: perf
pron: { cyr: "помы́щлець" }
senses:
  - id: think
    ru: "подумать"
    examples:
      - pl: "Daj mi pomyśleć."
        ru: "Дай мне подумать."
        source: { kind: tatoeba, id: 12567466 }
      - pl: "Co pomyślą sąsiedzi?"
        ru: "Что подумают соседи?"
        source: { kind: tatoeba, id: 5379457 }
      - pl: "Dlaczego wcześniej o tym nie pomyślałem?"
        ru: "Почему я раньше об этом не подумал?"
        source: { kind: tatoeba, id: 3495452 }
  - id: think-about
    ru: "подумать о чём-либо, поразмыслить"
    note: "pomyśleć o czymś «подумать о чём-то», pomyśleć nad czymś «поразмыслить над чем-то»."
    examples:
      - pl: "Pomyśl o tym spokojnie."
        ru: "Подумай об этом спокойно."
        source: { kind: authored }
      - pl: "Muszę pomyśleć nad tą propozycją."
        ru: "Мне надо поразмыслить над этим предложением."
        source: { kind: authored }
      - pl: "Kto by pomyślał!"
        ru: "Кто бы мог подумать!"
        source: { kind: authored }
notes:
  - { kind: usage, text: "Приставка po- работает как русская: myśleć «думать» → pomyśleć «подумать», то есть недолго и разок." }
  - { kind: usage, text: "Два управления: pomyśleć o czymś «подумать о чём-то» и pomyśleć nad czymś «поразмыслить над чем-то»." }
  - { kind: usage, text: "Daj mi pomyśleć «Дай мне подумать» и Kto by pomyślał! «Кто бы мог подумать!» — готовые обороты, которые стоит выучить целиком." }
collocations:
  - { pl: "daj mi pomyśleć", ru: "дай мне подумать" }
  - { pl: "pomyśl o tym", ru: "подумай об этом" }
  - { pl: "kto by pomyślał", ru: "кто бы мог подумать" }
  - { pl: "muszę pomyśleć", ru: "мне надо подумать" }
etymology: "Из po- + myśleć, от myśl «мысль», праславянское *myslь; то же гнездо, что русские «мысль», «думать», «помыслить»."
memory: "pomyśleć — «подумать», приставка po- работает как русская. Думают о чём-то (pomyśleć o czymś) или над чем-то (pomyśleć nad czymś)."
idioms:
  - { pl: "kto by pomyślał", ru: "кто бы мог подумать" }
  - { pl: "daj mi pomyśleć", ru: "дай мне подумать" }
  - { pl: "nie do pomyślenia", ru: "немыслимо" }
