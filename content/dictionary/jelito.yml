# review
id: jelito
format: 2
lemma: "jelito"
rank: 5286
pos: noun
pron: { cyr: "ели́то" }
senses:
  - id: intestine
    ru: "кишка; (мн.) кишечник"
    examples:
      - pl: "Bolą mnie jelita."
        ru: "У меня болит кишечник."
        source: { kind: authored }
      - pl: "Jelito grube ma około półtora metra."
        ru: "Толстая кишка длиной около полутора метров."
        source: { kind: authored }
      - pl: "Lekarz zbadał mu jelita."
        ru: "Врач обследовал ему кишечник."
        source: { kind: authored }
      - pl: "Błonnik dobrze wpływa na pracę jelit."
        ru: "Клетчатка хорошо влияет на работу кишечника."
        source: { kind: authored }
      - pl: "Ma zapalenie jelita."
        ru: "У него воспаление кишки."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "JELITO — медицинское «кишка», а кишечник в целом — JELITA во множественном. Разговорное KISZKA тоже значит «кишка», но ещё и «кровяная колбаса». Тонкая кишка — JELITO CIENKIE, толстая — JELITO GRUBE." }
  - { kind: usage, text: "Девять форм, средний род. В местном падеже T переходит в C: W JELICIE. Родительный множественного — JELIT, без окончания." }
  - { kind: government, text: "Воспаление кишечника — ZAPALENIE JELIT, родительный множественного. Работа кишечника — PRACA JELIT. В кишке — W JELICIE." }
  - { kind: pronunciation, text: "Читается «ели́то», ударение на предпоследнем слоге. JE — «е», LI — мягкое «ли»." }
collocations:
  - { pl: "jelito grube", ru: "толстая кишка" }
  - { pl: "jelito cienkie", ru: "тонкая кишка" }
  - { pl: "zapalenie jelit", ru: "воспаление кишечника" }
family:
  - { pl: "jelitowy", ru: "кишечный", relation: derived }
  - { pl: "jelito grube", ru: "толстая кишка", relation: derived }
  - { pl: "jelito cienkie", ru: "тонкая кишка", relation: derived }
etymology: "Старое славянское слово для кишки; в русском на его месте «кишка». В польском KISZKA осталось разговорным и кулинарным."
memory: "Jelito — кишка, jelita — кишечник. Читается «ели́то». Jelito grube — толстая кишка. Kiszki marsza grają — в животе урчит от голода."
idioms:
  - { pl: "kiszki marsza grają", ru: "в животе урчит от голода" }
