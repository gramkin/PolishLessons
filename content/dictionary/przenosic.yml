        source: { kind: authored }
notes:
  - { kind: usage, text: "Шестьдесят четыре формы — на одну больше, чем у обычного несовершенного переходного глагола, и причина любопытная. PoliMorf помечает этот глагол и как несовершенный, и как совершенный: каждая личная форма стоит в таблице дважды, с двумя разными пометами. Отсюда и лишняя форма PRZENOSIWSZY, деепричастие на -WSZY, какое бывает только у совершенного вида. Совершенное чтение в польском настоящее: PRZENOSIĆ WSZYSTKIE KSIĄŻKI значит перенести их все, в несколько приёмов, а PRZENOSIĆ CIĄŻĘ — «перенашивать», выйти за срок. Так что шестьдесят четыре складываются как шестьдесят три плюс одна форма от второго чтения." }
  - { kind: pronunciation, text: "Основа кончается мягким с, и польское письмо пишет его тремя способами — та же картина, что в карточке PRZERAZIĆ. Перед окончаниями -ę и -ą он твердеет в sz: PRZENOSZĘ, PRZENOSZĄ, и от этой же твёрдой основы идут все причастия: PRZENOSZONY, PRZENOSZĄCY, PRZENOSZENIE. Перед i стоит простое s: PRZENOSI, PRZENOSISZ, PRZENOSIŁ. А на конце слова и перед согласным — ś, откуда повелительное PRZENOŚ, PRZENOŚMY, PRZENOŚCIE." }
  - { kind: usage, text: "Пара NIEŚĆ и NOSIĆ устроена ровно как русская «нести» и «носить»: NIEŚĆ — нести сейчас, в одну сторону, NOSIĆ — носить вообще, туда и обратно, по привычке. Приставочные пары идут отсюда же: PRZENIEŚĆ «перенести» однократно против PRZENOSIĆ «переносить» многократно. Русскому это деление знакомо насквозь, и переносить его можно прямо — редкий случай, когда совпадает не одно слово, а вся система." }
  - { kind: government, text: "Переходный, винительный плюс предлог направления: PRZENOSIĆ COŚ Z CZEGOŚ DO CZEGOŚ — przenosić meble z pokoju do pokoju, przenosić biuro na drugie piętro. О человеке значит «переводить»: PRZENIEŚLI GO DO INNEGO DZIAŁU. О сроке — «переносить»: PRZENOSIĆ TERMIN, SPOTKANIE, и здесь он сходится с PRZEŁOŻYĆ из партии 263, только PRZEŁOŻYĆ звучит чуть официальнее. Возвратное PRZENOSIĆ SIĘ значит «переезжать»: PRZENIEŚLI SIĘ DO KRAKOWA." }
collocations:
  - { pl: "przenosić meble", ru: "переносить мебель" }
  - { pl: "przenosić termin", ru: "переносить срок" }
  - { pl: "przenosić się do innego miasta", ru: "переезжать в другой город" }
family:
  - { pl: "przenieść", ru: "перенести", relation: aspect, id: przeniesc }
  - { pl: "nosić", ru: "носить", relation: root, id: nosic }
  - { pl: "przeniesienie", ru: "перенос, перевод", relation: derived }
etymology: "Приставка prze- и NOSIĆ «носить», из праславянского *nositi — то же слово, что русское «носить», многократная пара к *nesti «нести». Соответствие с русским полное и по частям, и по системе: PRZENIEŚĆ при PRZENOSIĆ стоит ровно как «перенести» при «переносить». Из гнезда вышли PRZENIESIENIE «перенос», NOSICIEL «носитель», ZNOSIĆ «сносить, терпеть», DONOSIĆ «доносить», PRZYNOSIĆ «приносить»."
memory: "nieść и nosić делятся как «нести» и «носить», и приставки идут за ними: przenieść однократно, przenosić многократно. Один мягкий с пишется тремя способами: przenoszę, przenosi, przenoś."
idioms:
  - { pl: "przenosić się z miejsca na miejsce", ru: "переезжать с места на место" }
  - { pl: "przenosić górę na inne miejsce", ru: "сдвинуть горы, сделать невозможное" }
