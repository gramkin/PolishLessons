formExamples:
  - form: "ożenić"
    pl: "Chcesz się ożenić?"
    ru: "Ты хочешь жениться?"
    source: { kind: translated, id: 3680520 }
  - form: "ożenić"
    pl: "Obiecał ożenić się z nią."
    ru: "Он обещал жениться на ней."
    source: { kind: tatoeba, id: 351506 }
  - form: "ożenić"
    pl: "Chcę się ożenić z Martiną."
    ru: "Я хочу жениться на Мартине."
    source: { kind: tatoeba, id: 1602715 }
  - form: "ożenię"
    pl: "Nie ożenię się z tobą."
    ru: "Я на тебе не женюсь."
    source: { kind: translated, id: 3841255 }
  - form: "ożenię"
    pl: "Ożenię się z piękną Estonką."
    ru: "Я женюсь на красивой эстонке."
    source: { kind: translated, id: 919260 }
  - form: "ożenię"
