    source: { kind: translated, id: 10778825 }
  - form: "ożenili"
    pl: "Ożenili się w zeszłym roku."
    ru: "Они поженились в прошлом году."
    source: { kind: authored }
  - form: "ożenili"
    pl: "Bracia ożenili się tego samego dnia."
    ru: "Братья женились в один и тот же день."
