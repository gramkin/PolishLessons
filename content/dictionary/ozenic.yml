# review
id: ozenic
format: 2
lemma: "ożenić"
rank: 1840
pos: verb
aspect: perf
pron: { cyr: "ожэ́ниць" }
senses:
  - id: marry-man
    ru: "ożenić się — жениться (о мужчине)"
    examples:
      - pl: "Obiecał ożenić się z nią."
        ru: "Он обещал жениться на ней."
        source: { kind: tatoeba, id: 351506 }
      - pl: "Chcę się ożenić z Martiną."
        ru: "Я хочу жениться на Мартине."
        source: { kind: tatoeba, id: 1602715 }
      - pl: "Ożenił się."
        ru: "Он женился."
        source: { kind: translated, id: 13067852 }
  - id: marry-whom
    ru: "жениться на ком-либо"
    examples:
      - pl: "Ożenił się z aktorką."
        ru: "Он женился на актрисе."
        source: { kind: translated, id: 364592 }
      - pl: "Ożenił się z nią dla pieniędzy."
        ru: "Он женился на ней ради денег."
        source: { kind: tatoeba, id: 6328269 }
      - pl: "Kiedy się ożeniłeś?"
        ru: "Когда ты женился?"
        source: { kind: translated, id: 348929 }
notes:
  - { kind: false-friend, text: "Главное отличие от русского: ożenić się говорят только о мужчине. Женщина wychodzi za mąż «выходит замуж», а пара bierze ślub «вступает в брак». Русское «пожениться» покрывает всё сразу." }
  - { kind: government, text: "Жениться на ком-то — ożenić się z kimś, с предлогом z и творительным падежом: ożenił się z aktorką. Русское «жениться на» требует предложного — это расхождение." }
  - { kind: usage, text: "Глагол почти всегда возвратный: ożenić się. Без się он значит «женить кого-то», выдать за кого-то." }
  - { kind: usage, text: "Несовершенный вид — żenić się; существительное — ożenek «женитьба»." }
  - { kind: government, text: "Глагол относится только к мужчине: ożenić się «жениться» и ożenić kogoś «женить кого-то». О женщине говорят wyjść za mąż «выйти замуж» и jest zamężna «замужем», поэтому женского причастия ożeniona в языке нет." }
collocations:
  - { pl: "ożenić się z kimś", ru: "жениться на ком-либо" }
  - { pl: "chcę się ożenić", ru: "я хочу жениться" }
  - { pl: "wyjść za mąż", ru: "выйти замуж" }
family:
  - { pl: "żenić się", ru: "жениться", relation: root }
  - { pl: "żona", ru: "жена", relation: root, id: zona }
  - { pl: "małżeństwo", ru: "брак", relation: root, id: malzenstwo }
etymology: "От żona «жена» — то же слово, что русское «жена» и «жениться». Приставка o- показывает завершённость."
memory: "ożenić się — «жениться», но только о мужчине: женщина wychodzi za mąż. На ком — z kimś, творительный падеж: ożenił się z aktorką."
idioms:
  - { pl: "ożenić się z kimś", ru: "жениться на ком-либо" }
  - { pl: "chcę się ożenić", ru: "я хочу жениться" }
  - { pl: "wyjść za mąż", ru: "выйти замуж" }
