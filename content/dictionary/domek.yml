notes:
  - { kind: pronunciation, text: "БЕГЛОЕ E, И ЗДЕСЬ ОНО ИСЧЕЗАЕТ. В именительном падеже domek, но во всех остальных e пропадает: domku, domkowi, domkiem, domki. Русское «домик» так себя не ведёт, там и остаётся на месте. Заметьте симметрию с plotka в этой же группе: там беглое e, наоборот, ВСТАВЛЯЕТСЯ в родительном множественного, plotek. Один и тот же звук, два противоположных движения." }
  - { kind: usage, text: "Суффикс -ek уменьшительный, но domek далеко не всегда значит «маленький». Domek jednorodzinny — это обычный частный дом, официальный термин, и дом этот бывает немаленьким. Так же domek letniskowy «дачный домик» и domek dla lalek «кукольный домик»." }
  - { kind: false-friend, text: "Ловушек нет: dom это «дом», domek — «домик», суффиксы в обоих языках уменьшительные и работают одинаково. Совпадает даже идиома: domek z kart это «карточный домик», слово в слово." }
collocations:
  - { pl: "domek jednorodzinny", ru: "частный дом" }
  - { pl: "domek letniskowy", ru: "дачный домик" }
  - { pl: "domek z kart", ru: "карточный домик" }
family:
  - { pl: "dom", ru: "дом", relation: root, id: dom }
  - { pl: "domowy", ru: "домашний", relation: derived, id: domowy }
  - { pl: "domownik", ru: "домочадец", relation: derived }
etymology: "От dom «дом» с уменьшительным суффиксом -ek, из праславянского *domъ — того же слова, что русский «дом». Русское «домик» собрано точно так же, суффиксом. Отсюда domowy «домашний», domostwo «усадьба» и domownik «домочадец»."
memory: "domek — «домик», всё как в русском. Запомните только беглое e: domek, но domku и domkiem, без него. И что domek jednorodzinny это не «маленький домик», а обычный частный дом."
idioms:
  - { pl: "domek z kart", ru: "карточный домик" }
  - { pl: "domek letniskowy", ru: "дачный домик" }
formExamplesSkip:
