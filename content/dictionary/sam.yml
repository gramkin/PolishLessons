# review
id: sam
format: 2
lemma: "sam"
rank: 64
pos: adj
pron: { cyr: "сам" }
senses:
  - id: alone
    ru: "один, сам (без других)"
    examples:
      - pl: "Tom szedł sam."
        ru: "Том шёл один."
        source: { kind: tatoeba, id: 12476525 }
      - pl: "Jesteś sama?"
        ru: "Вы одна?"
        source: { kind: tatoeba, id: 10568864 }
      - pl: "Nie chcę iść sama."
        ru: "Я не хочу идти одна."
        source: { kind: tatoeba, id: 6329826 }
  - id: same
    ru: "сам, самый; ten sam — тот же"
    examples:
      - pl: "Wszyscy jedli to samo."
        ru: "Все ели одно и то же."
        source: { kind: tatoeba, id: 959809 }
      - pl: "Obaj są w tym samym wieku."
        ru: "Они оба одного возраста."
        source: { kind: tatoeba, id: 6995442 }
notes:
  - { kind: usage, text: "Одно слово на два русских: Jestem sam значит и «Я один», и «Я сам»." }
  - { kind: usage, text: "ten sam — «тот же самый», tak samo — «так же», sam na sam — «наедине»." }
collocations:
  - { pl: "ten sam", ru: "тот же самый" }
  - { pl: "tak samo", ru: "так же" }
  - { pl: "sam na sam", ru: "наедине" }
etymology: "Праславянское *samъ — то же слово, что русские «сам» и «самый»."
memory: "Одно слово покрывает два русских: sam = «сам» и «один». Дальше идут устойчивые сочетания: ten sam «тот же самый», tak samo «так же», sam na sam «наедине»."
idioms:
  - { pl: "sam na sam", ru: "наедине" }
  - { pl: "być samemu jak palec", ru: "быть одному как перст" }
  - { pl: "sam sobie sterem i okrętem", ru: "сам себе хозяин" }
