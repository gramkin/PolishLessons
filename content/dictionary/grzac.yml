# review
id: grzac
format: 2
lemma: "grzać"
rank: 5905
pos: verb
aspect: imperf
pron: { cyr: "гжа́ць" }
senses:
  - id: heat
    ru: "греть, разогревать, нагревать"
    examples:
      - pl: "Grzeję zupę w mikrofali."
        ru: "Я грею суп в микроволновке."
        source: { kind: authored }
      - pl: "Babcia grzała mleko dla wnuków."
        ru: "Бабушка грела молоко для внуков."
        source: { kind: authored }
  - id: give-warmth
    ru: "греть, давать тепло"
    examples:
      - pl: "Cudzy ogień nie grzeje."
        ru: "Чужой огонь не греет."
        source: { kind: translated, id: 13454533 }
      - pl: "Mamy wielki piec, który dobrze nas grzeje."
        ru: "У нас большая печь, которая хорошо нас греет."
        source: { kind: translated, id: 925791 }
      - pl: "Dzisiaj słońce mocno grzeje."
        ru: "Сегодня солнце сильно печёт."
        source: { kind: authored }
  - id: heat-house
    ru: "отапливать, топить (дом, комнату)"
    examples:
      - pl: "Dawniej grzano domy węglem."
        ru: "Раньше дома топили углём."
        source: { kind: authored }
      - pl: "Czym grzejesz mieszkanie?"
        ru: "Чем ты отапливаешь квартиру?"
        source: { kind: authored }
  - id: warm-oneself
    ru: "grzać się — греться"
    examples:
      - pl: "Grzałem się przy ogniu."
        ru: "Я грелся у огня."
        source: { kind: translated, id: 1002970 }
      - pl: "Jaszczurki grzeją się na kamieniach."
        ru: "Ящерицы греются на камнях."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Несовершенный вид. Спряжение как у русского «греть»: GRZEJĘ, GRZEJESZ, GRZEJE, GRZEJĄ «грею, греешь, греет, греют»; повелительное GRZEJ. Прошедшее — на -A-: GRZAŁ, GRZAŁA, GRZALI. Законченное действие передают приставочные глаголы: NAGRZAĆ, PODGRZAĆ «подогреть», OGRZAĆ, ROZGRZAĆ «согреть»." }
  - { kind: government, text: "Что греют — винительный: GRZAĆ WODĘ, ZUPĘ, RĘCE. GRZAĆ DOM, MIESZKANIE — «отапливать», чем — творительный: GRZAĆ DOM DREWNEM, GAZEM. Греться где — GRZAĆ SIĘ PRZY OGNIU, NA SŁOŃCU." }
  - { kind: pronunciation, text: "GRZ читается «гж»: GRZAĆ — «гжаць», GRZEJĘ — «гже́йэ». RZ здесь звонкое, потому что рядом звонкое G." }
  - { kind: register, text: "В разговорной речи у GRZAĆ есть и переносные значения: «гнать» (GRZAŁ DWIEŚCIE NA GODZINĘ), «лупить», «пить много». GRZANE WINO — «глинтвейн», GRZANIE в быту — «отопление»." }
collocations:
  - { pl: "grzać wodę", ru: "греть воду" }
  - { pl: "grzać się na słońcu", ru: "греться на солнце" }
  - { pl: "słońce grzeje", ru: "солнце греет, печёт" }
  - { pl: "grzane wino", ru: "глинтвейн" }
family:
  - { pl: "nagrzać", ru: "нагреть", relation: derived, id: nagrzac }
  - { pl: "podgrzać", ru: "подогреть", relation: derived }
  - { pl: "rozgrzać", ru: "согреть, разогреть", relation: derived }
  - { pl: "grzejnik", ru: "батарея, обогреватель", relation: derived }
  - { pl: "ogrzewanie", ru: "отопление", relation: derived }
etymology: "Праславянское *grěti, родственное русскому «греть». Польское RZ стоит на месте мягкого R перед древним ятем."
memory: "Grzać — «греть»: RZ читается как Ж, и GRZEJĘ звучит почти как «грею»."
idioms:
  - { pl: "ani mnie to ziębi, ani grzeje", ru: "мне от этого ни холодно ни жарко" }
  - { pl: "grzać ławę", ru: "сидеть на скамейке запасных" }
formExamplesSkip:
  - { form: "grzeli", reason: "устаревший и диалектный вариант мужско-личной формы прошедшего времени; в современной норме — GRZALI" }
