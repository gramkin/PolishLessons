# review
id: zawiesc
format: 2
lemma: "zawieść"
rank: 1204
pos: verb
aspect: perf
pron: { cyr: "за́весьць" }
senses:
  - id: let-down
    ru: "подвести, не оправдать доверия"
    examples:
      - pl: "Mam nadzieję, że mnie nie zawiedziesz."
        ru: "Надеюсь, ты меня не разочаруешь."
        source: { kind: tatoeba, id: 11318460 }
      - pl: "Nie zawiodę cię."
        ru: "Я тебя не подведу."
        source: { kind: translated, id: 3095249 }
      - pl: "Zawiodłeś mnie."
        ru: "Ты меня подвёл."
        source: { kind: translated, id: 5211188 }
  - id: disappointed
    ru: "zawiedziony — разочарованный"
    examples:
      - pl: "Byłem zawiedziony."
        ru: "Я был разочарован."
        source: { kind: translated, id: 366932 }
      - pl: "Była zawiedziona."
        ru: "Она была разочарована."
        source: { kind: translated, id: 10708005 }
  - id: fail
    ru: "подвести, отказать, провалиться (о плане, памяти, нервах)"
    examples:
      - pl: "Plan Toma zawiódł."
        ru: "План Тома провалился."
        source: { kind: translated, id: 5147962 }
      - pl: "Oczy go zawiodły."
        ru: "Глаза его подвели."
        source: { kind: translated, id: 350032 }
notes:
  - { kind: usage, text: "В мужском роде прошедшего времени пишется zawiódł — с ó, потому что слог закрывается согласной. Как только после ł появляется гласная, возвращается o: zawiodła, zawiodło, zawiodłam, zawiodły, zawiedli. Формы zawiodł не существует. То же чередование в mógł — mogła, niósł — niosła." }
  - { kind: false-friend, text: "Не путайте zawieść «подвести, разочаровать» с zawieźć «отвезти»: разница только в ś/ź, а значения совершенно разные." }
  - { kind: usage, text: "Совершенный вид к zawodzić." }
  - { kind: government, text: "zawieść kogo, винительный: zawieść przyjaciela «подвести друга», zawieść oczekiwania «обмануть ожидания»." }
  - { kind: usage, text: "Самая частая форма слова — страдательное причастие zawiedziony «разочарованный»: Byłem zawiedziony." }
collocations:
  - { pl: "nie zawieść kogoś", ru: "не подвести кого-либо" }
  - { pl: "zawieść oczekiwania", ru: "обмануть ожидания" }
  - { pl: "być zawiedzionym", ru: "быть разочарованным" }
etymology: "Приставка za- и wieść «вести» (праславянское *vesti). Русское «завести» того же корня, но значение разошлось: польское zawieść — «подвести, обмануть надежды»."
memory: "zawieść — «подвести, разочаровать»: Nie zawiodę cię «Я тебя не подведу». Самая частая форма — причастие zawiedziony «разочарованный». И будьте внимательны: zawieźć через ź это «отвезти», совсем другое слово."
idioms:
  - { pl: "nie zawieść kogoś", ru: "не подвести кого-либо" }
  - { pl: "zawieść oczekiwania", ru: "обмануть ожидания" }
  - { pl: "zawiedziony w miłości", ru: "разочарованный в любви" }
formExamplesSkip:
  - { form: "zawiodł", reason: "такой формы нет: мужской род прошедшего времени — zawiódł, с ó в закрытом слоге" }
  - { form: "zawiodłby", reason: "такой формы нет: условное наклонение мужского рода строится от zawiódł — zawiódłby, zawiódłbym, zawiódłbyś, с ó, как и сама форма zawiódł. Частица by не открывает слог обратно. Остальная парадигма при этом верна: zawiodła → zawiodłaby, zawiodły → zawiodłyby, zawiodło → zawiodłoby" }
  - { form: "zawiodłbym", reason: "такой формы нет: условное наклонение мужского рода строится от zawiódł — zawiódłby, zawiódłbym, zawiódłbyś, с ó, как и сама форма zawiódł. Частица by не открывает слог обратно. Остальная парадигма при этом верна: zawiodła → zawiodłaby, zawiodły → zawiodłyby, zawiodło → zawiodłoby" }
  - { form: "zawiodłbyś", reason: "такой формы нет: условное наклонение мужского рода строится от zawiódł — zawiódłby, zawiódłbym, zawiódłbyś, с ó, как и сама форма zawiódł. Частица by не открывает слог обратно. Остальная парадигма при этом верна: zawiodła → zawiodłaby, zawiodły → zawiodłyby, zawiodło → zawiodłoby" }
