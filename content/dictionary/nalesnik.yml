# review
id: nalesnik
format: 2
lemma: "naleśnik"
rank: 4408
pos: noun
pron: { cyr: "нале́сьник" }
senses:
  - id: pancake
    ru: "блинчик (тонкий, с начинкой)"
    examples:
      - pl: "Na obiad są naleśniki z dżemem."
        ru: "На обед блинчики с вареньем."
        source: { kind: authored }
      - pl: "Umiesz smażyć naleśniki?"
        ru: "Ты умеешь печь блинчики?"
        source: { kind: authored }
      - pl: "Zjadłam dwa naleśniki z serem."
        ru: "Я съела два блинчика с творогом."
        source: { kind: authored }
      - pl: "Naleśnik z owocami to dobre śniadanie."
        ru: "Блинчик с фруктами — хороший завтрак."
        source: { kind: authored }
      - pl: "W tej budce sprzedają naleśniki na słodko i na słono."
        ru: "В этом киоске продают сладкие и солёные блинчики."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "NALEŚNIK — тонкий «блинчик», обычно с начинкой и свёрнутый. Толстые дрожжевые «блины» в Польше называют по-русски BLINY, а оладьи — PLACKI. «Первый блин комом» — PIERWSZY NALEŚNIK ZAWSZE WYCHODZI BRZYDKI." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. В разговоре винительный нередко как у одушевлённых: ZJEŚĆ NALEŚNIKA, так говорят о многих блюдах. Родительный — NALEŚNIKA." }
  - { kind: government, text: "Блинчики с чем — Z и творительный: NALEŚNIKI Z SEREM, «с творогом», Z DŻEMEM. Печь блины — SMAŻYĆ NALEŚNIKI, буквально «жарить»." }
  - { kind: pronunciation, text: "Читается «нале́сьник», ударение на предпоследнем слоге. Ś — мягкое «сь»." }
collocations:
  - { pl: "naleśniki z serem", ru: "блинчики с творогом" }
  - { pl: "smażyć naleśniki", ru: "печь блинчики" }
  - { pl: "naleśniki z dżemem", ru: "блинчики с вареньем" }
family:
  - { pl: "nalać", ru: "налить", relation: root }
  - { pl: "naleśnikarnia", ru: "блинная", relation: derived }
  - { pl: "naleśnikowy", ru: "блинный", relation: derived }
etymology: "Связано с NALAĆ, NALEWAĆ «наливать»: жидкое тесто наливают на сковороду. Русское «блин» — совсем другое слово."
memory: "Naleśnik — блинчик: тесто наливают, nalać. Читается «нале́сьник». Naleśniki z serem — блинчики с творогом. Smażyć naleśniki — печь блины."
idioms:
  - { pl: "płaski jak naleśnik", ru: "плоский как блин" }
