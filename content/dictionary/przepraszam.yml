notes:
  - { kind: government, text: "Извините ЗА что-л. — przepraszam ZA coś, с винительным падежом: przepraszam za spóźnienie." }
  - { kind: usage, text: "Двойная служба: и извинение, и способ привлечь внимание незнакомого человека — как русское «извините» в обоих смыслах." }
  - { kind: false-friend, text: "Это 1-е лицо глагола przepraszać «извиняться». Корень prosić «просить» с приставкой prze-: буквально «выпрашивать прощение»." }
  - { kind: usage, text: "Более formalно — przepraszam bardzo; в ответ говорят nic nie szkodzi «ничего страшного»." }
collocations:
  - { pl: "przepraszam za spóźnienie", ru: "извините за опоздание" }
  - { pl: "nic nie szkodzi", ru: "ничего страшного" }
etymology: "Форма глагола przepraszać, от prosić «просить»: буквально «выпрашивать прощение»."
memory: "przepraszam — «извините», и как извинение, и чтобы обратиться к незнакомому. За что-л. — za coś, с винительным. В ответ: nic nie szkodzi."
