etymology: "Это уменьшительное от PĄK «бутон», от праславянского корня со значением «вздуваться, набухать». Пончик назван по виду: округлый, вздутый, как нераскрывшийся бутон. Русские родственники того же корня — «пук», «пучок», то есть то, что топорщится и вздувается. Носовая Ą здесь отвечает русскому у, и это регулярно: PĄK и «пук», ZĄB и «зуб», MĄŻ и «муж», DĄB и «дуб». Русское «пончик» того же корня не имеет: оно от «понч», от слова «пончик» в значении округлой лепёшки, и совпадение двух слов в языках чисто смысловое."
memory: "Читается «по́нчэк», потому что ą это «он». Два значения на одном образе округлого и вздутого: пончик и бутон. Главная грамматика здесь: еда в разговорной речи берёт винительный как у одушевлённых, zjedz pączka, а не «zjedz pączek», и так же zjeść banana. Не путать с paczka женского рода, это «посылка». Правило корня: ą отвечает русскому у, pąk и «пук», ząb и «зуб». И поговорка: żyć jak pączek w maśle значит «жить как сыр в масле»."
