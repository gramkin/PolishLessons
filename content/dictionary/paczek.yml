notes:
  - { kind: government, text: "Здесь прячется правило, которое удивляет всех, кто учит польский. Съедобные вещи в разговорной речи берут винительный падеж по образцу одушевлённых, то есть совпадающий с родительным: говорят ZJEDZ PĄCZKA, а не «zjedz pączek». То же с другой едой: ZJEŚĆ BANANA, HOT-DOGA, LODA. Грамматика считает пончик неодушевлённым, а язык обращается с ним как с живым, и это не ошибка, а норма разговорного стиля. В строгом письменном тексте допустимо и ZJEŚĆ PĄCZEK, но вживую почти всегда слышно PĄCZKA." }
  - { kind: false-friend, text: "Рядом стоит слово, с которым это легко спутать: PACZKA, женского рода, значит «посылка» и «пачка». Различаются они носовым Ą и родом: PĄCZEK мужской, PACZKA женская, и происхождение у них разное. ODEBRAĆ PACZKĘ NA POCZCIE это «получить посылку», а не пончик. Сам PĄCZEK родственник слова PĄK «бутон», отсюда и второе значение. А русское «пончик» с польским словом не связано вовсе: оба языка назвали одно и то же разными способами." }
  - { kind: pronunciation, text: "Читается «по́нчэк», два слога, ударение на первом. Носовая Ą звучит как «он» перед смычной согласной, поэтому начало слова «пон», а не «пан» и не «па». Сочетание CZ даёт твёрдое «ч», а E читается как «э»: «чэк». Во множественном числе PĄCZKI слышно «по́нчки». В основе без приставки, PĄK, звучит «понк». Правило общее: Ą это «он» или «ом», смотря по следующей согласной." }
  - { kind: register, text: "Слово бытовое и тёплое. Главный его день — TŁUSTY CZWARTEK, «жирный четверг» перед Великим постом, когда пончики едят по всей Польше и очереди стоят с утра. Частые обороты: PĄCZEK Z RÓŻĄ «пончик с розовым вареньем», PĄCZEK Z MARMOLADĄ, PĄCZKI Z CUKREM PUDREM. Отсюда же любимая поговорка: ŻYĆ JAK PĄCZEK W MAŚLE, буквально «жить как пончик в масле», то есть ровно наше «жить как сыр в масле»." }
  - { kind: usage, text: "Существительное мужского рода неодушевлённое, десять падежных форм. Второе значение, «бутон», принадлежит ботанике и книжной речи, но живёт полноценно: PĄCZEK LIŚCIOWY «листовая почка», а глагол PĄCZKOWAĆ значит «давать бутоны», а в биологии «размножаться делением». Оба значения держатся на одном образе — на чём-то округлом и набухшем, готовом раскрыться. Множественное число совершенно обычно в обоих значениях." }
