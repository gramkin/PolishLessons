  - { pl: "przeklinać", ru: "проклинать, ругаться", relation: aspect }
etymology: "Страдательное причастие от przekląć «проклясть», от kląć, праславянское *klęti «клясть, заклинать». Русское «проклятый» — то же самое слово с той же приставкой и тем же причастным суффиксом, поэтому совпадение буквальное. Исходный смысл корня — «призывать кару», отсюда и «клятва» рядом с «проклятием»."
memory: "przeklęty — «проклятый», слово в слово: причастие от kląć, то есть русского «клясть». Множественное мужско-личное przeklęci (t → ć). Во втором значении это просто «чёртов» в сердцах."
