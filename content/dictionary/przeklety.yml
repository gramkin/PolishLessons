notes:
  - { kind: false-friend, text: "Это прямой родственник русского «проклятый», и совпадение полное — вплоть до того, что оба слова суть страдательные причастия от «клясть»: польское kląć и русское «клясть» идут от праславянского *klęti. Так что przeklęty читается как «проклятый» и в буквальном, и в бранном смысле." }
  - { kind: usage, text: "По происхождению это страдательное причастие от przekląć «проклясть», но в современном языке оно работает как обычное прилагательное и склоняется полностью. Мужско-личная форма множественного — przeklęci, с чередованием t → ć." }
  - { kind: register, text: "Во втором значении слово бранное, но мягкое — примерно как русское «проклятый» или «чёртов» в сердцах: ten przeklęty korek. Это заметно слабее настоящей польской брани и допустимо в разговоре, хотя не в официальной речи." }
  - { kind: pronunciation, text: "Прилагательное склоняется полностью, но многие падежи совпадают по форме, поэтому различных написаний всего десять-одиннадцать, а не двадцать пять. Примеры в каждом слоте нарочно взяты из разных падежей, чтобы видно было весь охват формы." }
