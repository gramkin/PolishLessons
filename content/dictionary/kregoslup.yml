etymology: "Сложение KRĄG «круг, позвонок» и SŁUP «столб»: позвоночник увиден как столб, сложенный из колец. Оба корня общеславянские, и русскому знакомы по «кругу» и «столбу», так что слово читается насквозь, если только догадаться разделить его. Русское «позвоночник» построено от «позвонка», то есть от отдельного звена, а не от всей колонны. Из польского KRĄG в значении позвонка вышло и KRĘGOWIEC, название целого типа животных."
memory: "Разбирается на части: krąg «круг» плюс słup «столб», то есть столб из колец. Так поляк назвал позвоночник, а русский пошёл от позвонка. Польское krąg значит и «круг», и «позвонок», отсюда kręgowiec «позвоночное». Читается «крэнго́суп»: ę перед g даёт «эн», а ł даёт «у». Управление расходится: ból kręgosłupa, родительный без предлога, где русский говорит «боль в спине»."
idioms:
  - { pl: "kręgosłup moralny", ru: "нравственный стержень" }
