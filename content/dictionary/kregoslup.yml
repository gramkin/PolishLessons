notes:
  - { kind: false-friend, text: "Слово разбирается на части, и части эти русскому знакомы: KRĄG «круг» плюс SŁUP «столб», то есть «столб из кругов». Так поляк увидел позвоночник. Русский построил название иначе, от позвонка: «позвоночник». Образы разные, а предмет один. Заметьте, что польское KRĄG значит и «круг», и «позвонок», отсюда же KRĘGOWIEC «позвоночное животное», буквально «круговое»." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Носовое Ę держится во всех падежах, основа не сокращается. В местном падеже появляется смягчение: KRĘGOSŁUP, но W KRĘGOSŁUPIE. Переносное значение работает почти всегда в оборотах с предлогом: CZŁOWIEK Z KRĘGOSŁUPEM «человек со стержнем», BEZ KRĘGOSŁUPA «бесхребетный», и второе звучит резко осуждающе." }
  - { kind: government, text: "Боль в спине — BÓL KRĘGOSŁUPA, родительный без предлога, тогда как русский вставляет предлог «в». Это частое расхождение: поляк говорит BÓL GŁOWY, BÓL ZĘBA, BÓL BRZUCHA, везде родительный. В позвоночнике — W KRĘGOSŁUPIE, предлог W с местным падежом. Человек со стержнем — CZŁOWIEK Z KRĘGOSŁUPEM, предлог Z с творительным." }
  - { kind: pronunciation, text: "Читается «крэнго́суп», три слога, ударение на втором. Носовое Ę перед G даёт «эн», как и перед K: то же в RĘKA «рэнка». Буква Ł даёт «у», поэтому конец слова звучит «суп», а не «слуп». В местном падеже KRĘGOSŁUPIE сочетание PIE даёт мягкое «пе», и слышно «крэнго́супе». В слове KRĄG носовое Ą перед G даёт «он»: «кронк», с оглушением конечного G." }
  - { kind: register, text: "Слово нейтральное, из медицинского и бытового языка: BÓL KRĘGOSŁUPA «боль в спине», SKRZYWIENIE KRĘGOSŁUPA «искривление позвоночника», REHABILITACJA KRĘGOSŁUPA. Переносное употребление живое и оценочное: CZŁOWIEK BEZ KRĘGOSŁUPA это тот, кто гнётся под любым давлением, а KRĘGOSŁUP MORALNY это нравственная твёрдость. Русский в этом месте скажет «стержень» или «хребет»." }
