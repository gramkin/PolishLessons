# review
id: swietnie
format: 2
lemma: "świetnie"
rank: 273
pos: adv
pron: { cyr: "сьве́тне" }
senses:
  - id: excellently
    ru: "отлично, прекрасно"
    examples:
      - pl: "Tom świetnie mówi po francusku."
        ru: "Том прекрасно говорит по-французски."
        source: { kind: tatoeba, id: 12700146 }
      - pl: "Odpowiedział, że umie świetnie pływać."
        ru: "Он ответил, что умеет хорошо плавать."
        source: { kind: tatoeba, id: 350808 }
      - pl: "Świetnie sobie radzisz."
        ru: "Ты прекрасно справляешься."
        source: { kind: authored }
  - id: exclamation
    ru: "Świetnie! — Отлично!, Прекрасно!"
    note: "Самая частая форма — восклицание в ответ на хорошую новость."
    examples:
      - pl: "Świetnie! Właśnie o to chodziło."
        ru: "Отлично! Именно это и требовалось."
        source: { kind: authored }
      - pl: "Świetnie, że przyszedłeś."
        ru: "Прекрасно, что ты пришёл."
        source: { kind: authored }
      - pl: "Wszystko idzie świetnie."
        ru: "Всё идёт отлично."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Одинокое Świetnie! — обычная реакция на хорошую новость, как русское «Отлично!»." }
  - { kind: usage, text: "От прилагательного świetny «отличный», а оно — от światło «свет»: отличное то, что сияет." }
  - { kind: false-friend, text: "Не путайте со «светло»: «светло» по-польски jasno." }
collocations:
  - { pl: "świetnie sobie radzić", ru: "прекрасно справляться" }
  - { pl: "świetnie wygląda", ru: "прекрасно выглядит" }
  - { pl: "idzie świetnie", ru: "идёт отлично" }
  - { pl: "świetnie się bawić", ru: "отлично проводить время" }
etymology: "От świetny «отличный», а тот — от światło «свет»; ср. русское «светлый»: отличное то, что сияет."
memory: "Świetnie! — «Отлично!», самая частая реакция на хорошую новость. Корень тот же, что в światło «свет», но «светло» — это jasno."
