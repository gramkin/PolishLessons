etymology: "Эвфемизм, образованный усечением и переделкой грубого слова, начинающегося так же. Такие замены делаются во всех языках: русское «блин» вместо брани, «ёлки-палки», «ёкарный бабай». Созвучие с kura «курица» вторично и помогает смягчению, но исторически слово с ней не связано."
memory: "kurde — «блин!», смягчённое ругательство. Мягче исходного грубого слова, но всё же не для официальной речи. Не изменяется, стоит отдельно в начале фразы. С kura «курица» созвучно нарочно, как русское «блин»."
