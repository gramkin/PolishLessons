notes:
  - { kind: register, text: "ЭТО СМЯГЧЁННОЕ РУГАТЕЛЬСТВО — ПРИМЕРНО КАК РУССКОЕ «БЛИН». Kurde возникло как эвфемизм для грубого слова на ту же букву и звучит ощутимо мягче его, но всё же остаётся сниженным. Среди друзей и в сердцах — обычное дело; при начальнике, в учреждении, в письме — нет. Детям за него делают замечание." }
  - { kind: usage, text: "Слово не изменяется и в предложение грамматически не входит: оно стоит отдельно, обычно в начале фразы, и отделяется запятой. Часто усиливается частицами: no kurde, ale kurde. Родственные смягчённые восклицания той же силы — kurcze, kurka wodna, motyla noga." }
  - { kind: false-friend, text: "С названием курицы слово связано лишь по звуку, и это не случайность, а приём: эвфемизмы нарочно начинают так же, как грубое слово, и сворачивают в безобидную сторону. Русский делает то же самое, превращая брань в «блин» и «ёлки-палки». Переводить kurde словом «курица» нельзя ни при каких обстоятельствах." }
  - { kind: pronunciation, text: "Два слога, ударение на первом: KUR-de. Конечное e чистое, не редуцируется: «ку́рдэ». Произносится отрывисто, часто с протяжным у в сердцах: «ку-у-урдэ»." }
collocations:
