# review
id: dzialanie
format: 2
lemma: "działanie"
rank: 2034
pos: noun
pron: { cyr: "дзяуа́не" }
senses:
  - id: action
    ru: "действие, поступок; меры"
    examples:
      - pl: "Podjąć działania."
        ru: "Предпринять действия."
        source: { kind: translated, id: 5652098 }
      - pl: "Jego działania są bezprawne."
        ru: "Его действия противозаконны."
        source: { kind: translated, id: 359146 }
      - pl: "Potrzebujemy działań, nie słów."
        ru: "Нам нужны действия, а не слова."
        source: { kind: translated, id: 537352 }
  - id: operation
    ru: "работа, функционирование (механизма)"
    examples:
      - pl: "Objaśnił działanie tej maszyny."
        ru: "Он объяснил работу этой машины."
        source: { kind: translated, id: 754256 }
      - pl: "Co spowodowało niepoprawne działanie?"
        ru: "Что вызвало некорректную работу?"
        source: { kind: translated, id: 7713562 }
notes:
  - { kind: usage, text: "Отглагольное существительное от działać «действовать», поэтому значит и «действие», и «работа, функционирование»." }
  - { kind: usage, text: "Во множественном числе обычно «меры»: podjąć działania «предпринять действия, принять меры»." }
  - { kind: government, text: "Средний род: to działanie, tego działania." }
  - { kind: false-friend, text: "Корень dział «раздел, часть» — родственно русскому «делить», «дело»." }
collocations:
  - { pl: "podjąć działania", ru: "предпринять действия" }
  - { pl: "zasada działania", ru: "принцип работы" }
etymology: "От działać «действовать», от dział «часть, раздел», праславянское *dělъ; ср. русское «дело», «делить»."
memory: "działanie — и «действие», и «работа механизма». Во множественном числе чаще «меры»: podjąć działania «принять меры»."
idioms:
  - { pl: "podjąć działania", ru: "принять меры" }
  - { pl: "pole działania", ru: "поле деятельности" }
formExamplesSkip:
  - { form: "działaniami", reason: "в корпусе нет примеров для этой формы" }
  - { form: "działaniu", reason: "в корпусе нет примеров для этой формы" }
