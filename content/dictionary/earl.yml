notes:
  - { kind: government, text: "Английский титул, принятый в польское склонение целиком, без оговорок: одиннадцать форм, включая звательный EARLE и уважительный именительный множественного EARLOWIE на -OWIE — тот же, что у AMBASADOROWIE и OPIEKUNOWIE. Мужской род, одушевлённое, лицо, поэтому винительный равен родительному: WIDZIELI EARLA. Местный EARLU. Родительный множественного EARLÓW. Чей титул — родительный без предлога: EARL KENTU. Стать кем-то — глагол ZOSTAĆ с творительным: ZOSTAŁ EARLEM." }
  - { kind: false-friend, text: "Значение то же, что у русского «эрла», но русский обращается со словом иначе: по-русски титул чаще оставляют без склонения или склоняют с трудом, а в переводах предпочитают «граф». Польский же втянул слово в обычное склонение одушевлённых мужского рода, и формы EARLA, EARLOWI, EARLEM, EARLOWIE для него совершенно естественны. Это то же свойство, что было у ZOMBI, KASYNO и ECHO: польский склоняет заимствования охотнее. Собственно «граф» по-польски HRABIA, и титулы эти не взаимозаменяемы — EARL употребляют, когда речь именно об английской системе." }
  - { kind: pronunciation, text: "Читается «эрль», один слог, ударять нечего. Начальное EA произносится как одно «э», по английскому образцу, а не как два звука. Буква L мягкая, как всегда в польском, отсюда «рль». В родительном EARLA два слога и ударение на первом: «э́рля». В именительном множественного EARLOWIE три слога и ударение на предпоследнем: «эрло́ве». В звательном EARLE слышно «э́рле». Написание сохранило английский вид, чтение подчинилось польским правилам, и это обычная судьба таких заимствований." }
  - { kind: register, text: "Слово книжное и историческое: встречается в переводах, в текстах об Англии и в исторической прозе, а в обиходной речи — почти никогда. Частотные сочетания: EARL KENTU, TYTUŁ EARLA «титул эрла», GODNOŚĆ EARLA. Женского соответствия слово не имеет; жену эрла по-польски называют HRABINA или описательно ŻONA EARLA. Рядом стоят другие английские титулы, принятые так же: LORD с его LORDOWIE, BARON, WICEHRABIA. Польская система титулов своя и короче: KSIĄŻĘ, HRABIA, BARON." }
