etymology: "Из английского EARL, а оно из староанглийского EORL «знатный человек, воин», родственного древнескандинавскому JARL — тому же слову, что дало русское «ярл» в рассказах о викингах. Так что польский EARL и русский «ярл» это одно слово, пришедшее двумя путями: одно через современный английский, другое через скандинавские саги, и значения у них разошлись по эпохам — EARL о английском пэре, «ярл» о норманнском вожде. Любопытно, что английский титул GRAF, то есть EARL, не имеет латинского происхождения, в отличие от большинства европейских титулов: COMES дало французское COMTE и польское HRABIA через немецкое GRAF, а EARL остался германским. Поэтому в польском оказались рядом два слова для одного ранга, своё заимствованное HRABIA и английское EARL."
memory: "Английский титул, но склоняется полностью по польскому образцу: earla, earlowi, earlem, звательный earle, множественное earlowie на -owie, как ambasadorowie. Русский склоняет «эрла» неохотно и чаще переводит «графом»; польский граф — hrabia, и слова не взаимозаменяемы. Читается «эрль», ea как одно «э», l мягкое. Родственник русского «ярла» — одно слово двумя путями."
