# review
id: obawa
format: 2
lemma: "obawa"
rank: 1745
pos: noun
pron: { cyr: "оба́ва" }
senses:
  - id: fear
    ru: "опасение, боязнь, тревога"
    examples:
      - pl: "Istnieje obawa, że on może już nie żyć."
        ru: "Есть опасение, что его уже нет в живых."
        source: { kind: translated, id: 508955 }
      - pl: "Rozumiem twoje obawy."
        ru: "Я понимаю твои опасения."
        source: { kind: translated, id: 4739562 }
      - pl: "Tom wyraził podobne obawy."
        ru: "Том высказал похожие опасения."
        source: { kind: translated, id: 4952866 }
  - id: no-worry
    ru: "bez obaw — не беспокойся, без опасений"
    examples:
      - pl: "Bez obaw."
        ru: "Не беспокойся."
        source: { kind: translated, id: 348665 }
      - pl: "Nie ma powodu do obaw."
        ru: "Нет повода для беспокойства."
        source: { kind: translated, id: 601346 }
      - pl: "Bez obaw, jestem przy tobie."
        ru: "Не бойся, я рядом с тобой."
        source: { kind: translated, id: 5416896 }
notes:
  - { kind: usage, text: "bez obaw — очень частая разговорная формула «не беспокойся», «без проблем»." }
  - { kind: government, text: "Из опасения перед чем-то — z obawy przed czymś (творительный после przed): z obawy przed deszczem «опасаясь дождя». Из опасения, что… — w obawie, że…" }
  - { kind: false-friend, text: "obawa — это тревожное предчувствие, а strach «страх» сильнее и телеснее. Русское «опасение» ближе всего к obawa." }
  - { kind: usage, text: "Глагол того же корня — obawiać się «опасаться», он требует родительного падежа: obawiam się deszczu." }
collocations:
  - { pl: "bez obaw", ru: "не беспокойся" }
  - { pl: "z obawy przed", ru: "из опасения перед" }
  - { pl: "budzić obawy", ru: "вызывать опасения" }
family:
  - { pl: "obawiać się", ru: "опасаться", relation: root }
  - { pl: "bać się", ru: "бояться", relation: root, id: bac }
  - { pl: "strach", ru: "страх", relation: root, id: strach }
etymology: "От obawiać się «опасаться», того же корня, что bać się «бояться». Русское «опасение» построено от «опасаться» — совпадение полное."
memory: "obawa — «опасение», тревожное предчувствие; strach «страх» сильнее. Запомните формулу bez obaw «не беспокойся» и оборот z obawy przed deszczem «опасаясь дождя»."
