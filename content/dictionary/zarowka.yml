family:
  - { pl: "żar", ru: "жар, раскалённые угли", relation: root }
  - { pl: "żarzyć się", ru: "тлеть, раскаляться", relation: root }
synonyms: ["lampka"]
etymology: "От ŻAR «жар, раскалённость»: в лампе накаливания светится раскалённая нить. Корень тот же, что в русском «жар»."
memory: "Żarówka — то, в чём żar, жар раскалённой нити. Lampa — светильник, żarówka — лампочка в нём."
idioms:
  - { pl: "zapaliła mi się żarówka", ru: "меня осенило (букв. «у меня зажглась лампочка»)" }
