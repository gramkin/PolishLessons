senses:
  - id: bulb
    ru: "лампочка (электрическая)"
    note: "Исходно — лампа накаливания, но так называют и светодиодные, и энергосберегающие лампочки."
    examples:
      - { pl: "Żarówka się przepaliła.", ru: "Лампочка перегорела.", source: { kind: tatoeba, id: 967643 } }
      - { pl: "Tak zwane ekologiczne żarówki zawierają rtęć.", ru: "Так называемые экологичные лампочки содержат ртуть.", source: { kind: tatoeba, id: 2900720 } }
      - { pl: "Edison wynalazł żarówkę.", ru: "Эдисон изобрёл лампочку.", source: { kind: translated, id: 1452451 } }
      - { pl: "Umiesz wymienić żarówkę?", ru: "Ты умеешь поменять лампочку?", source: { kind: translated, id: 12567507 } }
      - { pl: "Żarówka LED świeci dłużej niż zwykła.", ru: "Светодиодная лампочка светит дольше обычной.", source: { kind: authored } }
notes:
  - { kind: false-friend, text: "ŻARÓWKA — не «жаровня» (это BRYTFANNA, ROŻEN), а «лампочка». Корень ŻAR «жар»: в лампочке светится раскалённая нить. Светильник целиком — LAMPA, а лампочка в нём — ŻARÓWKA." }
  - { kind: usage, text: "K перед E смягчается в C: W ŻARÓWCE, O ŻARÓWCE. Родительный множественного — ŻARÓWEK с беглым E. Звательный ŻARÓWKO не употребляется." }
  - { kind: pronunciation, text: "Ż — «ж», Ó — «у», W перед K оглушается: «жару́фка». Ударение на предпоследнем слоге." }
collocations:
  - { pl: "wymienić żarówkę", ru: "поменять лампочку" }
  - { pl: "żarówka się przepaliła", ru: "лампочка перегорела" }
  - { pl: "żarówka energooszczędna", ru: "энергосберегающая лампочка" }
