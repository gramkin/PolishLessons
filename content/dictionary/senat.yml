notes:
  - { kind: false-friend, text: "SENAT — «сенат», верхняя палата польского парламента: SEJM — нижняя, SENAT — верхняя. Председатель сената — MARSZAŁEK SENATU. В вузе SENAT — «учёный совет»." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Родительный — SENATU. В местном T переходит в C: W SENACIE." }
  - { kind: government, text: "В сенате — W SENACIE, местный. Выборы в сенат — WYBORY DO SENATU, DO с родительным. Маршал сената — MARSZAŁEK SENATU." }
  - { kind: pronunciation, text: "Читается «сэ́нат»: SE — твёрдое «сэ». Ударение на первом слоге. SENACIE — «сэна́це»." }
