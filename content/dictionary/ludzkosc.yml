notes:
  - { kind: false-friend, text: "ПОЛЬСКОЕ СЛОВО ОДНО ТАМ, ГДЕ РУССКИХ ДВА. Ludzkość значит и «ЧЕЛОВЕЧЕСТВО» — всех людей разом, — и «ЧЕЛОВЕЧНОСТЬ», то есть качество. Русский развёл эти смыслы по двум словам, польский держит в одном, и различает их только контекст: losy ludzkości против zabrakło mu ludzkości." }
  - { kind: usage, text: "ШЕСТЬ ФОРМ — ЭТО НОРМА ДЛЯ ВСЕГО КЛАССА НА -OŚĆ. Существительные женского рода на -ość склоняются одинаково и скупо: ludzkość, ludzkości (род., дат., предл.), ludzkością, и множественное, которое почти не употребляется. Так же устроены wolność, własność, miłość, wartość. Суффикс -ość отвечает русскому -ость." }
  - { kind: pronunciation, text: "Три слога, ударение на предпоследнем: LUDZ-kość. Dzk звучит как «цк», ść — как мягкое щць: «лу́цкощць». Конечное сочетание глухое и короткое, без гласного призвука." }
collocations:
  - { pl: "losy ludzkości", ru: "судьба человечества" }
  - { pl: "zbrodnia przeciwko ludzkości", ru: "преступление против человечности" }
  - { pl: "zabrakło ludzkości", ru: "не хватило человечности" }
family:
  - { pl: "ludzie", ru: "люди", relation: root, id: ludzie }
  - { pl: "ludzki", ru: "человеческий; человечный", relation: root, id: ludzki }
  - { pl: "człowiek", ru: "человек", relation: root, id: czlowiek }
etymology: "От ludzki «человеческий», от ludzie «люди», из праславянского *ljudъje — того же слова, что русские «люди» и «людской». Суффикс -ość равен русскому -ость. Русский построил «человечество» на другой основе, от «человека», поэтому слова не похожи, хотя собраны одинаково."
memory: "ludzkość — и «человечество», и «человечность»: одно польское слово на два русских. Построено от ludzie «люди», а не от «человека». Шесть форм, как у всего класса на -ość: wolność, miłość, wartość."
idioms:
