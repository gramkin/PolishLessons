etymology: "Это то же слово, что русское «зло», и от того же праславянского прилагательного, от которого русские «злой» и «зло». Расхождение не в происхождении, а в звуке: польское Ł, которое когда-то было твёрдым «л», в двадцатом веке перешло в звук «у», и слово стало звучать «зуо», тогда как русское сохранило «л». На письме родство видно сразу, на слух почти пропало, и это общее правило для целого пласта слов: GŁOWA и «голова», MAŁY и «малый», BYŁ и «был». Из того же гнезда ZŁY «плохой», ZŁOŚĆ «злость», ZŁOŚLIWY «злобный»."
memory: "То же слово, что «зло», но читается «зуо», потому что ł это «у», а не «л». Это правило дороже самого слова: głowa «гуова», mały «мауы», był «быу». Восемь падежей, и вся работа лежит на единственном числе; множественное книжное и живёт в рамке zła tego świata «беды этого мира». Управление как в русском: walczyć ze złem творительный, przeciwstawiać się złu дательный. Ловушка: złom это не только дательный множественного, но и обычное слово «металлолом»."
