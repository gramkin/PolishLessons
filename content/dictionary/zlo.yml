notes:
  - { kind: pronunciation, text: "Это слово нужно прежде всего научиться выговаривать, потому что русское чтение здесь неверно. Польское Ł звучит как русское «у» в слове «аудит», а не как «л». Поэтому ZŁO читается «зуо», в один слог, и «зло» будет ошибкой. То же во всех формах: ZŁA это «зуа», ZŁEM «зуэм», ZŁU «зуу». В родительном множественного Ł оказывается в конце: ZEŁ звучит «зэу». Правило общее и стоит дороже самого слова: везде, где в польском написано Ł, по-русски слышится «у», как в MAŁO «мауо» или BYŁ «быу»." }
  - { kind: false-friend, text: "Форма ZŁOM, дательный падеж множественного числа, совпадает с совершенно другим и очень частым словом: ZŁOM значит «металлолом, лом». ODDAĆ SAMOCHÓD NA ZŁOM — «сдать машину в металлолом», SKUP ZŁOMU «приём лома». Различает их только управление: у существительного ZŁOM свои падежи и предлог NA, а дательный от ZŁO стоит при глаголах вроде PRZECIWSTAWIAĆ SIĘ «противостоять». В обычном тексте почти всегда имеется в виду металлолом, потому что дательный множественного от «зла» — форма книжная и редкая." }
  - { kind: usage, text: "Это существительное среднего рода, выросшее из прилагательного ZŁY «плохой, злой», и падежей у него восемь. Единственное число несёт на себе всю обычную работу: ZŁO, ZŁA, ZŁU, ZŁEM. Формы множественного существуют и грамматически правильны, но принадлежат книжному слогу и живут почти только в одной рамке: ZŁA TEGO ŚWIATA «беды этого мира». В разговоре множественного лучше не употреблять вовсе, а вместо него сказать NIESZCZĘŚCIA «несчастья» или KŁOPOTY «неприятности»." }
  - { kind: government, text: "Схемы переносятся с русского почти без правки. Бороться со злом — WALCZYĆ ZE ZŁEM, предлог Z и творительный, как по-русски. Противостоять злу — PRZECIWSTAWIAĆ SIĘ ZŁU, дательный, тоже как по-русски. Источник зла — ŹRÓDŁO ZŁA, родительный. Обратить внимание стоит на форму предлога: перед словом, начинающимся на Z, предлог Z превращается в ZE, поэтому ZE ZŁEM, а не «z złem»." }
  - { kind: register, text: "Слово книжное и серьёзное: оно живёт в разговорах о морали, в проповеди, в философии, в политической публицистике. Частые обороты: DOBRO I ZŁO «добро и зло», MNIEJSZE ZŁO «меньшее зло», ZŁO KONIECZNE «необходимое зло», KORZEŃ ZŁA «корень зла». В бытовой речи про мелкие неприятности так не говорят: там будет KŁOPOT или PECH «незадача». Прилагательное ZŁY при этом совершенно повседневное и значит и «плохой», и «злой»." }
