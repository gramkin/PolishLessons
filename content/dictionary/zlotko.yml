etymology: "Уменьшительное от ZŁOTO «золото» с суффиксом -KO. Русское «золотко», «золотце» — того же корня и с тем же ласковым смыслом."
memory: "Złotko — золотко (ласк.) и фантик, фольга. Chodź tu, złotko! Читается «зуо́тко»."
