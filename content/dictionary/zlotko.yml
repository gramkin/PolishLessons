notes:
  - { kind: false-friend, text: "ZŁOTKO — «золотко», ласковое обращение, как русское «золотце». Но и «фольга, блестящая обёртка»: ZŁOTKO OD CZEKOLADY. Пищевая фольга — FOLIA ALUMINIOWA или SREBRNA FOLIA." }
  - { kind: register, text: "Обращение ласковое, чаще к детям и близким: ZŁOTKO, KOCHANIE, SKARBIE. К незнакомому взрослому звучит снисходительно или фамильярно." }
  - { kind: usage, text: "Средний род. Звательный совпадает с именительным: ZŁOTKO! Учим единственное и ZŁOTKA во множественном. Родительный — ZŁOTKA." }
  - { kind: pronunciation, text: "Читается «зуо́тко»: Ł — «у». Ударение на первом слоге." }
collocations:
  - { pl: "moje złotko", ru: "моё золотко" }
  - { pl: "złotko od cukierka", ru: "фантик от конфеты" }
