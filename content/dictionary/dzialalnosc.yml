family:
  - { pl: "działać", ru: "действовать, работать", relation: root, id: dzialac }
  - { pl: "działanie", ru: "действие", relation: derived, id: dzialanie }
  - { pl: "dzial", ru: "отдел", relation: root }
etymology: "От глагола DZIAŁAĆ, а тот от DZIAŁ «отдел, часть» и DZIELIĆ «делить», от праславянского корня, который в русском дал «дело», «делать» и «доля». Русское «деятельность» построено от старого глагола «деять», то есть от того же древнего гнезда, но через другую основу. Получается, что оба слова означают одно и то же и собраны похожим способом, но польское пришло через идею части и раздела, а русское через идею делания. Суффикс -OŚĆ при этом точно отвечает русскому -ОСТЬ."
memory: "Главное знание здесь административное: działalność gospodarcza это ИП, а założyć działalność значит «зарегистрировать ИП», сокращённо JDG. Вторая поправка бытовая: działać значит ещё и «работать» о приборах, telefon nie działa, где русское «действовать» не годится. Шесть форм, суффикс -ość отвечает русскому -ость. Читается «дзяуа́льносьчь»: dzia даёт «дзя», ł даёт «у». Из того же корня dział «отдел» и działka «садовый участок»."
