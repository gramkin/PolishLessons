notes:
  - { kind: register, text: "Для русскоязычного в Польше это слово прежде всего административное, и знать его надо целиком в одном обороте: DZIAŁALNOŚĆ GOSPODARCZA — это индивидуальное предпринимательство, а ZAŁOŻYĆ DZIAŁALNOŚĆ значит «зарегистрировать ИП». В разговоре оборот сокращают до одного слова: MAM DZIAŁALNOŚĆ значит «у меня своё дело». Рядом стоят ZAWIESIĆ DZIAŁALNOŚĆ «приостановить деятельность» и ZAMKNĄĆ DZIAŁALNOŚĆ «закрыть дело». Полное официальное название, JEDNOOSOBOWA DZIAŁALNOŚĆ GOSPODARCZA, сокращают до JDG." }
  - { kind: false-friend, text: "Глагол того же корня работает шире русского «действовать», и это одна из самых полезных поправок в бытовом языке. DZIAŁAĆ значит не только «действовать», но и «работать» о приборах и устройствах: TELEFON NIE DZIAŁA — «телефон не работает», WINDA NIE DZIAŁA — «лифт не работает». Русское «действовать» так не употребляется, а польское PRACOWAĆ о телефоне прозвучит странно. Отдельно: DZIAŁ значит «отдел», а DZIAŁKA — «садовый участок», и оба того же корня." }
  - { kind: government, text: "Вести деятельность — PROWADZIĆ DZIAŁALNOŚĆ, винительный без предлога. Область указывается прилагательным, а не предлогом: DZIAŁALNOŚĆ GOSPODARCZA, CHARYTATYWNA, NAUKOWA. Чья деятельность — родительный: DZIAŁALNOŚĆ FUNDACJI. Глагол DZIAŁAĆ управляет предлогом NA с винительным в значении воздействия: LEK DZIAŁA NA SERCE «лекарство действует на сердце», и здесь схема совпадает с русской полностью." }
  - { kind: pronunciation, text: "Читается «дзяуа́льносьчь», три слога, ударение на втором. Начало требует внимания: сочетание DZIA даёт слитное «дзя», где I только знак мягкости. Дальше Ł даёт «у», поэтому слышно «дзяу». Сочетание AL читается мягко, «аль». Конец слова, -ŚĆ, это два мягких звука подряд, «сьчь». В глаголе DZIAŁAĆ слышно «дзя́уачь»." }
  - { kind: usage, text: "Шесть форм, разряд женских существительных на -OŚĆ, где суффикс отвечает русскому -ОСТЬ. Множественное число употребляется, когда речь о разных направлениях работы: DZIAŁALNOŚCI STATUTOWE «уставные виды деятельности» в документах фонда. Основа идёт от DZIAŁAĆ, а то от DZIAŁ и DZIELIĆ «делить», от корня, который в русском дал «дело» и «делать». Отвлечённое существительное, поэтому в живой речи его чаще заменяют глаголом." }
collocations:
  - { pl: "prowadzić działalność", ru: "вести деятельность" }
  - { pl: "zawiesić działalność", ru: "приостановить деятельность" }
