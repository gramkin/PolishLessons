# review
id: rozlaczyc
format: 2
lemma: "rozłączyć"
rank: 4084
pos: verb
pron: { cyr: "розуо́нчыць" }
senses:
  - id: separate
    ru: "разлучить, разделить (людей)"
    examples:
      - pl: "Wojna rozłączyła rodzinę."
        ru: "Война разлучила семью."
        source: { kind: authored }
      - pl: "Los rozłączył ich na dwadzieścia lat."
        ru: "Судьба разлучила их на двадцать лет."
        source: { kind: authored }
      - pl: "Nic nas nie rozłączy."
        ru: "Ничто нас не разлучит."
        source: { kind: authored }
  - id: disconnect
    ru: "разъединить, отключить; с SIĘ — отключиться (о телефоне)"
    examples:
      - pl: "Rozłączył się bez słowa."
        ru: "Он молча положил трубку."
        source: { kind: authored }
      - pl: "Elektryk rozłączył przewody."
        ru: "Электрик разъединил провода."
        source: { kind: authored }
      - pl: "Rozłączyło nas w połowie rozmowy."
        ru: "Нас разъединило посреди разговора."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ROZŁĄCZYĆ — и «разлучить» людей, и «разъединить» провода или связь. ROZŁĄCZYĆ SIĘ по телефону — «отключиться, положить трубку». Русское «разлука» — ROZŁĄKA, «разлучник» — так по-польски не говорят." }
  - { kind: usage, text: "Пятьдесят три формы, включая ROZŁĄCZENI — «разлучённые»: ROZŁĄCZENI KOCHANKOWIE. Будущее: ROZŁĄCZĘ, ROZŁĄCZYSZ, повелительное ROZŁĄCZ. Несовершенный вид — ROZŁĄCZAĆ." }
  - { kind: government, text: "Кого или что — винительный: ROZŁĄCZYĆ KABLE. С кем — Z с творительным или OD с родительным: ROZŁĄCZYĆ MATKĘ Z DZIECKIEM, OD DZIECKA. Безлично — ROZŁĄCZYŁO NAS «нас разъединило»." }
  - { kind: pronunciation, text: "Читается «розуо́нчыць»: Ł — «у», Ą перед CZ — «он», ударение на предпоследнем слоге. ROZŁĄCZĘ — «розуо́нчэ», ROZŁĄCZ — «ро́зуонч»." }
  - { kind: register, text: "О людях — нейтральное, часто с оттенком драмы: WOJNA ICH ROZŁĄCZYŁA. О телефоне и технике — бытовое: ROZŁĄCZYŁO MNIE «меня отключило»." }
collocations:
  - { pl: "rozłączyć się", ru: "положить трубку, отключиться" }
  - { pl: "rozłączyć kable", ru: "разъединить провода" }
  - { pl: "rozłączyć rodzinę", ru: "разлучить семью" }
family:
  - { pl: "łączyć", ru: "соединять", relation: root, id: laczyc }
  - { pl: "połączyć", ru: "соединить", relation: antonym, id: polaczyc }
  - { pl: "rozłąka", ru: "разлука", relation: derived }
etymology: "Приставка ROZ- «раз-» плюс ŁĄCZYĆ «соединять», праславянское *lǫčiti. Польское Ą соответствует русскому «у»: ŁĄCZYĆ — «лучить» в «разлучить», «случай»."
memory: "Rozłączyć — разлучить, разъединить: wojna rozłączyła rodzinę. Rozłączyć się — положить трубку. Rozłąka — разлука. Читается «розуо́нчыць»."
idioms:
  - { pl: "co Bóg złączył, człowiek niech nie rozłącza", ru: "что Бог сочетал, того человек да не разлучает" }
