notes:
  - { kind: false-friend, text: "ГЛАВНОЕ ЗДЕСЬ — ПЕРЕВОД, А НЕ ЗНАЧЕНИЕ. Русское «локальный» существует, но живёт в технике: локальная сеть, локальный конфликт. Польское lokalny прежде всего значит «МЕСТНЫЙ»: lokalna gazeta «местная газета», lokalne władze «местные власти», lokalny patriotyzm. Перевести lokalna gazeta как «локальная газета» нельзя, только «местная». Техническое значение у польского слова тоже есть, но оно второе по частоте." }
  - { kind: usage, text: "Прилагательное относительное, степеней сравнения нет, отсюда одиннадцать форм — против тридцати трёх у genialny в этой же группе. Сравните две карточки рядом: латинский суффикс -alny у них общий, а таблицы разной длины, потому что «более местным» быть нельзя, а «более гениальным» можно." }
  - { kind: pronunciation, text: "Три слога, ударение на предпоследнем: lo-KAL-ny, «лока́льны». l перед n смягчается. Суффикс -alny отвечает русскому -альный, как в genialny, normalny и realny." }
collocations:
  - { pl: "lokalna gazeta", ru: "местная газета" }
  - { pl: "lokalne władze", ru: "местные власти" }
  - { pl: "lokal wyborczy", ru: "избирательный участок" }
family:
  - { pl: "lokal", ru: "помещение, заведение", relation: root }
  - { pl: "lokalizacja", ru: "размещение, локализация", relation: derived }
  - { pl: "ulokować", ru: "разместить", relation: derived }
etymology: "Из латинского localis «местный», от locus «место». Тем же путём в русский пришло «локальный», но закрепилось там в узком, техническом смысле. Отсюда lokal «помещение, заведение» — lokal gastronomiczny, lokal wyborczy «избирательный участок», — а также lokalizacja и ulokować «разместить»."
memory: "lokalny — прежде всего «МЕСТНЫЙ», а не «локальный»: lokalna gazeta это местная газета. И посмотрите на соседнюю карточку genialny: суффикс -alny у них один, а форм 11 против 33, потому что относительные прилагательные не сравниваются."
