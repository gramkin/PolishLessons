notes:
  - { kind: false-friend, text: "KUKURYDZA — «кукуруза», но с DZ: «кукуры́дза». Попкорн — POPCORN или PRAŻONA KUKURYDZA, кукурузные хлопья — PŁATKI KUKURYDZIANE, початок — KOLBA KUKURYDZY." }
  - { kind: usage, text: "Четыре живые формы, женский род, вещественное: только единственное число. Формы множественного и звательный не даются. Родительный, дательный и местный — KUKURYDZY." }
  - { kind: government, text: "Початок кукурузы — KOLBA KUKURYDZY, родительный. Поле кукурузы — POLE KUKURYDZY. Салат с кукурузой — SAŁATKA Z KUKURYDZĄ." }
  - { kind: pronunciation, text: "Читается «кукуры́дза», ударение на предпоследнем слоге. RY — «ры», DZ — слитное «дз»." }
