etymology: "Слово пришло в польский с юга, через балканские и турецкие названия; русское «кукуруза» того же происхождения. Польский закрепил форму с -DZA."
memory: "Kukurydza — кукуруза, с dz: «кукуры́дза». Prażona kukurydza — попкорн. Kolba kukurydzy — початок. Płatki kukurydziane — кукурузные хлопья."
