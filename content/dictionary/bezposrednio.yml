# review
id: bezposrednio
format: 2
lemma: "bezpośrednio"
rank: 5900
pos: adv
pron: { cyr: "бэспосьре́дньо" }
senses:
  - id: directly
    ru: "напрямую, непосредственно"
    note: "без посредников"
    examples:
      - pl: "Powinieneś porozmawiać bezpośrednio z Tomem."
        ru: "Тебе стоит поговорить напрямую с Томом."
        source: { kind: translated, id: 3300888 }
      - pl: "Powiedział mi o tym bezpośrednio sąsiad."
        ru: "Об этом мне сказал сам сосед."
        source: { kind: translated, id: 358961 }
      - pl: "Kupujemy warzywa bezpośrednio od rolnika."
        ru: "Мы покупаем овощи напрямую у фермера."
        source: { kind: authored }
  - id: right
    ru: "сразу, прямо"
    note: "о времени и месте: bezpośrednio po, przed"
    examples:
      - pl: "Tomowi wciąż było zimno, choć stał bezpośrednio przed piecem."
        ru: "Тому всё ещё было холодно, хотя он стоял прямо перед печкой."
        source: { kind: translated, id: 4106093 }
      - pl: "Bezpośrednio po lekcjach poszliśmy do kina."
        ru: "Сразу после уроков мы пошли в кино."
        source: { kind: authored }
  - id: frankly
    ru: "прямо, откровенно"
    examples:
      - pl: "Powiedz mi bezpośrednio, co o tym myślisz."
        ru: "Скажи мне прямо, что ты об этом думаешь."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Буквально «без посредника»: BEZ + POŚREDNI «промежуточный». Соответствует русскому «непосредственно», но в речи чаще переводится «напрямую», «прямо», «сразу»." }
  - { kind: government, text: "Часто стоит перед предлогом: BEZPOŚREDNIO PO «сразу после», BEZPOŚREDNIO PRZED «прямо перед», BEZPOŚREDNIO OD «напрямую от», BEZPOŚREDNIO ZWIĄZANY Z «непосредственно связан с»." }
  - { kind: usage, text: "Формы BEZPOŚREDNIEJ «прямее» и NAJBEZPOŚREDNIEJ редки, обычно говорят BARDZIEJ BEZPOŚREDNIO. И не спутайте: BEZPOŚREDNIEJ — ещё и родительный падеж женского рода прилагательного: CHCĘ BEZPOŚREDNIEJ ODPOWIEDZI «хочу прямого ответа»." }
  - { kind: pronunciation, text: "Читается «бэспосьре́дньо»: Z перед глухим P оглушается в «с», Ś — «сь», NIO — «ньо». Ударение на RED." }
collocations:
  - { pl: "bezpośrednio po", ru: "сразу после" }
  - { pl: "bezpośrednio od producenta", ru: "напрямую от производителя" }
  - { pl: "bezpośrednio związany z", ru: "непосредственно связанный с" }
  - { pl: "transmisja bezpośrednio z", ru: "прямая трансляция из" }
family:
