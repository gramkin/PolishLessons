  - { pl: "pośrednik", ru: "посредник", relation: root }
  - { pl: "środek", ru: "середина; средство", relation: root, id: srodek }
etymology: "BEZ «без» + POŚREDNI «промежуточный», от ŚRODEK «середина». Буквально «без посредника» — так же построено русское «непосредственно»."
memory: "bez pośrednika — без посредника: bezpośrednio = напрямую. Kupuj bezpośrednio od rolnika."
idioms:
