# review
id: wlamac
format: 2
lemma: "włamać"
rank: 1735
pos: verb
aspect: perf
pron: { cyr: "вуа́маць" }
senses:
  - id: break-in
    ru: "взломать, влезть (в помещение)"
    examples:
      - pl: "Włamał się do domu."
        ru: "Он влез в дом."
        source: { kind: translated, id: 570451 }
      - pl: "Wczoraj w nocy do banku włamał się złodziej."
        ru: "Вчера ночью в банк влез вор."
        source: { kind: translated, id: 351317 }
      - pl: "Kiedy mnie nie było, włamali się złodzieje."
        ru: "Пока меня не было, залезли воры."
        source: { kind: translated, id: 754588 }
  - id: hack
    ru: "взломать (компьютер, сайт, аккаунт)"
    examples:
      - pl: "Hakerzy włamali się na oficjalną stronę policji finansowej."
        ru: "Хакеры взломали официальный сайт финансовой полиции."
        source: { kind: translated, id: 10707202 }
      - pl: "Nie włamałem się na niczyj komputer."
        ru: "Я не взламывал ничей компьютер."
        source: { kind: translated, id: 3933749 }
notes:
  - { kind: government, text: "Глагол всегда возвратный и требует się: włamać się do domu «влезть в дом» (do + родительный), włamać się na stronę «взломать сайт» (na + винительный)." }
  - { kind: usage, text: "Совершенный вид; несовершенный — włamywać się. Существительное — włamanie «взлом», человек — włamywacz «взломщик»." }
  - { kind: usage, text: "Безличная форма на -ano очень частотна: włamano się do domu Toma «в дом Тома влезли», без указания кто." }
  - { kind: false-friend, text: "Русское «взломать» и польское włamać się собраны одинаково (w- «в» + łamać «ломать»), но польское обязательно требует się." }
collocations:
  - { pl: "włamać się do domu", ru: "влезть в дом" }
  - { pl: "włamać się na stronę", ru: "взломать сайт" }
  - { pl: "włamano się", ru: "произошёл взлом" }
family:
  - { pl: "włamanie", ru: "взлом", relation: root }
  - { pl: "włamywacz", ru: "взломщик", relation: root }
  - { pl: "złodziej", ru: "вор", relation: root, id: zlodziej }
etymology: "Приставка w- «в-» плюс łamać «ломать» — ровно как русское «в-зломать». Разница в том, что польский глагол обязательно требует się."
memory: "włamać się — «взломать, влезть»: włamał się do domu «он влез в дом», włamali się na stronę «взломали сайт». Без się глагол не употребляется."
