etymology: "От глагола ZASILAĆ, собранного из приставки ZA- и корня SIŁA «сила»: буквально «придавать силы, подкреплять». Тот же корень уже встречался в WYSIŁEK, где приставка WY- дала «то, что выжато из силы», а здесь приставка ZA- даёт обратное движение — силу вносят, а не извлекают. Русское «питание» построено на совсем другом образе, от «питать», то есть кормить, и потому одинаково легко прилагается и к человеку, и к машине; польское же слово говорит о силе, и к еде его приложить невозможно. Отглагольное существительное на -ANIE называет действие как длящийся процесс, и в этом его отличие от ZASIŁEK «пособие», где тот же корень дал название не процессу, а выплате."
memory: "Русское «питание» делится на два: zasilanie — техническое, электричество и подача; питание как еда — odżywianie или wyżywienie. От zasilać «придавать силы», тот же корень siła, что в wysiłek, но приставка za- вносит силу, а wy- извлекает. Восемь форм: zasilania служит родительному единственного и именительному множественного. Конечное -nie читается «не», одним слогом."
