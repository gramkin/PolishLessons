notes:
  - { kind: false-friend, text: "Русское «питание» покрывает сразу две вещи, которые польский держит раздельно, и это главный смысл карточки. ZASILANIE — это питание техническое: электричество, подача тока, снабжение водой или топливом. А питание в смысле еды — это ODŻYWIANIE или WYŻYWIENIE: ZDROWE ODŻYWIANIE «здоровое питание», WYŻYWIENIE W CENIE «питание в стоимость». Сказать ZASILANIE о еде нельзя, получится, что человека подключают к сети. В обратную сторону: польское ZASILANIE на русский почти всегда переводится «питанием», но с уточнением «электро-», если контекст не очевиден." }
  - { kind: usage, text: "Это отглагольное существительное от ZASILAĆ «питать, снабжать», и такие существительные в польском образуются совершенно регулярно, суффиксом -ANIE от несовершенного вида: CZYTAĆ даёт CZYTANIE, PISAĆ даёт PISANIE, ZASILAĆ даёт ZASILANIE. Значение у них процессное, то есть называют не предмет, а действие, и потому множественное число у них редкость: ZASILANIA в живой речи почти не встречается. Самые частые сочетания: ZASILANIE AWARYJNE «аварийное питание», BRAK ZASILANIA «отсутствие питания», ODCIĄĆ ZASILANIE «отключить питание»." }
  - { kind: government, text: "Средний род на -E, склонение правильное, но парадигма у отглагольных существительных экономная: родительный единственного и именительный множественного совпадают в ZASILANIA, а дательный и местный единственного — в ZASILANIU. Поэтому в таблице восемь форм, а не десять. Чем питают — предлог Z с родительным: ZASILANIE Z AKUMULATORA «питание от аккумулятора», и обратите внимание, что русский здесь скажет «от», а польский Z. Что питают — винительный после глагола: ZASILAĆ SIEĆ." }
  - { kind: pronunciation, text: "Читается «засила́не», ударение на предпоследнем слоге, то есть на -LA-. Конечное -NIE звучит «не», одним слогом с мягким n, а не «ние» в два слога, как в русском. Это общее правило для всех отглагольных существительных на -ANIE и -ENIE, и его стоит отработать сразу на нескольких словах: CZYTANIE «чыта́не», PISANIE «писа́не», ZASILANIE «засила́не»." }
