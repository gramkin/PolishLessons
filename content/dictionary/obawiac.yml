# review
id: obawiac
format: 2
lemma: "obawiać"
rank: 740
pos: verb
aspect: imperf
pron: { cyr: "оба́вяць" }
senses:
  - id: fear
    ru: "obawiać się czegoś — опасаться, бояться чего-либо (родительный падеж)"
    note: "Управление совпадает с русским: родительный падеж, как в «бояться чего-то»."
    examples:
      - pl: "Powiedział, że obawia się deszczu."
        ru: "Он сказал, что опасается дождя."
        source: { kind: translated, id: 363801 }
      - pl: "Starsi ludzie często obawiają się zmian."
        ru: "Пожилые люди часто опасаются перемен."
        source: { kind: translated, id: 2217026 }
      - pl: "Obawiał się wyśmiania."
        ru: "Он боялся насмешек."
        source: { kind: translated, id: 404496 }
  - id: i-am-afraid
    ru: "obawiam się, że… — боюсь, что… (вежливая оговорка)"
    note: "Самое частое употребление: это не страх, а смягчение неприятного ответа."
    examples:
      - pl: "Obawiam się, że nie mam wyboru."
        ru: "Боюсь, у меня нет выбора."
        source: { kind: tatoeba, id: 3787743 }
      - pl: "Obawiam się, że się nie zgodzi."
        ru: "Боюсь, он не согласится."
        source: { kind: tatoeba, id: 4649114 }
      - pl: "Obawiam się, że tak."
        ru: "Боюсь, что да."
        source: { kind: translated, id: 525594 }
notes:
  - { kind: government, text: "obawiać się czegoś — родительный падеж без предлога, ровно как русское «бояться чего-то»: obawia się deszczu «он опасается дождя», obawiają się zmian «они опасаются перемен»." }
  - { kind: government, text: "Но «бояться ЗА кого-то» строится иначе — obawiać się o kogoś, предлог o с винительным: Obawiałem się o jego życie «Я боялся за его жизнь». Не путайте две конструкции." }
  - { kind: register, text: "obawiać się книжнее и мягче, чем bać się. Bój się psa! — про настоящий страх; obawiam się, że nie zdążymy — вежливая оговорка «боюсь, мы не успеем». В разговоре о страхе чаще bać się." }
  - { kind: usage, text: "Глагол не употребляется без się. Совершенного вида у него практически нет: для однократного испуга берут przestraszyć się." }
collocations:
  - { pl: "obawiać się czegoś", ru: "опасаться чего-то" }
  - { pl: "obawiam się, że...", ru: "боюсь, что..." }
  - { pl: "obawiać się o kogoś", ru: "бояться за кого-то" }
  - { pl: "nie ma się czego obawiać", ru: "бояться нечего" }
family:
  - { pl: "obawa", ru: "опасение", relation: derived }
  - { pl: "bać się", ru: "бояться", relation: derived, id: bac }
  - { pl: "obawy", ru: "опасения", relation: derived }
etymology: "От obawa «опасение», в основе старое bać się «бояться» с приставкой o- — то же слово, что русское «бояться». Буквально «обеспокоиться чем-то со всех сторон»."
memory: "obawiać się — «опасаться», и управление совпадает с русским: родительный падеж, как в «бояться чего-то» — obawia się deszczu. Но «бояться ЗА кого-то» строится иначе: obawiać się o kogoś, предлог o с винительным — Obawiałem się o jego życie. Главное же, что нужно запомнить, — это вежливая формула obawiam się, że… «боюсь, что…», которой смягчают неприятный ответ: это не страх, а оговорка. Для настоящего страха берите bać się: Boję się psów. Без się глагол не употребляется."
idioms:
  - { pl: "obawiam się, że...", ru: "боюсь, что..." }
  - { pl: "nie ma się czego obawiać", ru: "бояться нечего" }
  - { pl: "obawiać się o kogoś", ru: "бояться за кого-то" }
