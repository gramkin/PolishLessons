# review
id: zaplacic
format: 2
lemma: "zapłacić"
rank: 467
pos: verb
aspect: perf
pron: { cyr: "запуа́циць" }
senses:
  - id: pay
    ru: "заплатить"
    examples:
      - pl: "Ja zapłacę."
        ru: "Я заплачу."
        source: { kind: tatoeba, id: 547730 }
      - pl: "Tom zapłacił."
        ru: "Том заплатил."
        source: { kind: tatoeba, id: 5629833 }
      - pl: "Tom zapłacił czynsz."
        ru: "Том заплатил за аренду."
        source: { kind: tatoeba, id: 8705128 }
  - id: pay-how
    ru: "заплатить (чем, сколько)"
    examples:
      - pl: "Tom zapłacił gotówką."
        ru: "Том заплатил наличными."
        source: { kind: tatoeba, id: 7875418 }
      - pl: "Zapłacisz gotówką?"
        ru: "Заплатишь наличными?"
        source: { kind: tatoeba, id: 3495475 }
      - pl: "Ile mi zapłacisz?"
        ru: "Сколько ты мне заплатишь?"
        source: { kind: tatoeba, id: 8108569 }
notes:
  - { kind: usage, text: "За что платят — предлог za с винительным падежом: zapłacić za obiad «заплатить за обед». А чем платят — творительный без предлога: zapłacić gotówką «заплатить наличными»." }
  - { kind: usage, text: "Несовершенный вид — płacić: Płacę co miesiąc «Плачу каждый месяц»." }
  - { kind: usage, text: "Bóg zapłać — старинная благодарность «спаси Бог», её и сегодня слышно в ответ на милостыню или помощь." }
  - { kind: usage, text: "zapłacić głową — «поплатиться головой»; zapłacić wysoką cenę — «заплатить высокую цену»." }
collocations:
  - { pl: "zapłacić za obiad", ru: "заплатить за обед" }
  - { pl: "zapłacić gotówką", ru: "заплатить наличными" }
  - { pl: "zapłacić rachunek", ru: "оплатить счёт" }
  - { pl: "Bóg zapłać", ru: "спаси Бог" }
etymology: "Из za- + płacić, от płat «плата, кусок ткани» — когда-то расплачивались именно тканью. Русские «заплатить» и «плата» из того же гнезда."
memory: "zapłacić — «заплатить», слово буква в букву русское. Учить надо управление: за что — za с винительным (zapłacić za obiad), а чем — простой творительный (zapłacić gotówką)."
idioms:
  - { pl: "Bóg zapłać", ru: "спаси Бог, благодарствую" }
  - { pl: "zapłacić głową", ru: "поплатиться головой" }
  - { pl: "zapłacić wysoką cenę", ru: "заплатить высокую цену" }
