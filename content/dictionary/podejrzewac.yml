# review
id: podejrzewac
format: 2
lemma: "podejrzewać"
rank: 1762
pos: verb
aspect: imperf
pron: { cyr: "подэйжэ́ваць" }
senses:
  - id: suspect-guess
    ru: "подозревать, предполагать"
    examples:
      - pl: "Tak podejrzewam."
        ru: "Так я и подозреваю."
        source: { kind: translated, id: 6178307 }
      - pl: "Podejrzewam, że macie rację."
        ru: "Подозреваю, что вы правы."
        source: { kind: translated, id: 6178314 }
      - pl: "Podejrzewałem to!"
        ru: "Я это подозревал!"
        source: { kind: translated, id: 10704051 }
  - id: suspect-person
    ru: "подозревать (кого-либо в чём-либо)"
    examples:
      - pl: "Tom wie, że policja go podejrzewa."
        ru: "Том знает, что полиция подозревает его."
        source: { kind: tatoeba, id: 3960499 }
      - pl: "Czemu mnie podejrzewasz?"
        ru: "Почему ты меня подозреваешь?"
        source: { kind: translated, id: 1473360 }
      - pl: "Podejrzewaliśmy naszego kasjera o kradzież pieniędzy."
        ru: "Мы подозревали нашего кассира в краже денег."
        source: { kind: tatoeba, id: 616274 }
notes:
  - { kind: government, text: "Подозревать кого-то в чём-то — podejrzewać kogoś o coś, с предлогом o и винительным падежом: podejrzewali go o kradzież." }
  - { kind: usage, text: "Podejrzewam, że… — очень частый оборот «подозреваю, что…», по смыслу ближе к «полагаю, что»." }
  - { kind: usage, text: "Существительное — podejrzenie «подозрение», прилагательное podejrzany «подозрительный, подозреваемый»." }
  - { kind: false-friend, text: "Слово совпадает с русским по составу: pod- «под» плюс корень «зреть, смотреть», как в «подозревать»." }
collocations:
  - { pl: "podejrzewam, że", ru: "подозреваю, что" }
  - { pl: "podejrzewać kogoś o coś", ru: "подозревать кого-либо в чём-либо" }
  - { pl: "niczego nie podejrzewa", ru: "ничего не подозревает" }
family:
  - { pl: "podejrzenie", ru: "подозрение", relation: root }
  - { pl: "podejrzany", ru: "подозрительный", relation: root }
  - { pl: "myśleć", ru: "думать", relation: root, id: myslec }
etymology: "Приставка pod- «под» плюс корень «зреть, смотреть» — точно как русское «подозревать»: смотреть исподтишка."
memory: "podejrzewać — «подозревать». Кого в чём — podejrzewać kogoś o coś, с предлогом o. И частый оборот Podejrzewam, że… «подозреваю, что…»"
idioms:
  - { pl: "podejrzewam, że", ru: "подозреваю, что" }
  - { pl: "podejrzewać kogoś o coś", ru: "подозревать кого-либо в чём-либо" }
  - { pl: "niczego nie podejrzewa", ru: "ничего не подозревает" }
