notes:
  - { kind: false-friend, text: "Совпадение с русским «терпеливый» полное, но корень другой на слух: польское CIERPIEĆ — «страдать, терпеть», а CIERPLIWY — «терпеливый». Русское «терпеть» и польское CIERPIEĆ — одно слово, где русское Т соответствует польскому C перед мягкой гласной. Нетерпеливый — NIECIERPLIWY." }
  - { kind: usage, text: "Полная парадигма с простыми степенями: CIERPLIWY, CIERPLIWSZY, NAJCIERPLIWSZY, без вставки -IEJ-. Форма для мужчин-людей: CIERPLIWI, CIERPLIWSI, NAJCIERPLIWSI. Наречие CIERPLIWIE — «терпеливо»." }
  - { kind: government, text: "Терпеливый с кем-то — CIERPLIWY DLA KOGOŚ или WOBEC KOGOŚ, с родительным: CIERPLIWY DLA DZIECI. Русское «терпелив к кому» с дательным здесь не работает." }
  - { kind: pronunciation, text: "Читается «церпли́вы», три слога, ударение на предпоследнем. CIE — мягкое «це», как в CIERPLIWOŚĆ. В CIERPLIWSZY: «церпли́вшы», W оглушается перед SZ." }
  - { kind: register, text: "Нейтральное слово, частое в воспитании и в бытовых советах: BĄDŹ CIERPLIWY! — «наберись терпения». Поговорка CIERPLIWOŚĆ JEST MATKĄ MĄDROŚCI — «терпение — мать мудрости»." }
collocations:
  - { pl: "cierpliwy nauczyciel", ru: "терпеливый учитель" }
  - { pl: "cierpliwa praca", ru: "кропотливая работа" }
  - { pl: "być cierpliwym", ru: "быть терпеливым" }
family:
  - { pl: "cierpliwość", ru: "терпение", relation: derived, id: cierpliwosc }
  - { pl: "cierpieć", ru: "страдать, терпеть", relation: root, id: cierpiec }
  - { pl: "niecierpliwy", ru: "нетерпеливый", relation: derived }
etymology: "От CIERPIEĆ «терпеть, страдать», общеславянского *tьrpěti, того же, что русское «терпеть». Польское C на месте русского Т перед мягким гласным — обычное соответствие: CIEŃ — «тень», CIEPŁY — «тёплый». Суффикс -LIWY означает склонность, как в русском «-ливый»: «терпеливый», «говорливый»."
memory: "Cierpliwy — терпеливый: bądź cierpliwy! От cierpieć — терпеть. Cierpliwszy, najcierpliwszy — без -iej-. Dla kogoś — с родительным. Читается «церпли́вы»."
idioms:
  - { pl: "cierpliwość jest matką mądrości", ru: "терпение — мать мудрости" }
