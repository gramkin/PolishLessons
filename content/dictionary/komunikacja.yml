notes:
  - { kind: false-friend, text: "Самое важное про это слово: в обиходном польском KOMUNIKACJA значит в первую очередь «транспорт», а не «коммуникация». KOMUNIKACJA MIEJSKA — это городской транспорт, автобусы и трамваи; ŚRODKI KOMUNIKACJI — транспортные средства; KOMUNIKACJA ZASTĘPCZA — объявление о замене маршрута, которое висит на каждой остановке. Русская «коммуникация» в этом смысле не употребляется вовсе. Второе значение, «общение и передача сведений», у польского слова тоже есть и совпадает с русским, но в разговоре оно уступает первому. Пишется с одним M, тогда как русский удваивает: KOMUNIKACJA против «коммуникации»." }
  - { kind: usage, text: "Слово типа на -CJA, и устроено оно так же, как REWOLUCJA и KAUCJA: родительный, дательный и местный единственного совпадают в одной форме KOMUNIKACJI, которая служит ещё и родительным множественного. Рядом живёт старая форма родительного множественного KOMUNIKACYJ, на -YJ. Множественное число у слова редкое, потому что понятие собирательное, но формы существуют. И главное правило типа: польское -CJA отвечает русскому -ЦИЯ без исключений, так что любое русское слово на -ЦИЯ переносится заменой окончания, с поправкой на то, что польский согласных не удваивает." }
  - { kind: government, text: "Женский род. С чем сообщение — предлог Z с творительным: KOMUNIKACJA Z LOTNISKIEM, KOMUNIKACJA Z MIASTEM. Между чем — MIĘDZY с творительным: KOMUNIKACJA MIĘDZY DZIAŁAMI. Частотные сочетания: KOMUNIKACJA MIEJSKA «городской транспорт», KOMUNIKACJA PUBLICZNA «общественный транспорт», ŚRODKI KOMUNIKACJI, KOMUNIKACJA AUTOBUSOWA. Прилагательное KOMUNIKACYJNY значит «транспортный» в большинстве контекстов: WĘZEŁ KOMUNIKACYJNY «транспортный узел», и переводить его как «коммуникационный» обычно неверно." }
  - { kind: pronunciation, text: "Читается «комуника́цья», пять слогов, ударение на предпоследнем, то есть на KA. Все O произносятся полно, как «о», без редукции. Одно M, и удлинять его не нужно: звучит «кому», а не «комму». Сочетание CJ даёт «ць» с последующим «я», слитное «цья». В форме KOMUNIKACJI конечное -I читается «и»: «комуника́цьи». В старой форме KOMUNIKACYJ слышно «комуника́цый»." }
