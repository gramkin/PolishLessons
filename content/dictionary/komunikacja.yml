etymology: "Из латинского COMMUNICATIO «сообщение, передача», от COMMUNICARE «делать общим, сообщать», которое идёт от COMMUNIS «общий». Исходный смысл — делание общим, и из него выросли оба современных значения: передача сведений и сообщение между местами. Польский развил второе сильнее, и оно стало главным в быту, потому что в девятнадцатом веке слово закрепилось за железными дорогами и городским транспортом — тем, что соединяет места. Русский пошёл за первым значением и оставил транспорт за «сообщением» и «транспортом». Отсюда и расхождение: одно латинское слово, два разных центра тяжести. От того же COMMUNIS происходят KOMUNA, KOMUNIKAT «сообщение» и KOMUNIA; корень общности в них виден прямо."
memory: "Главное: в быту komunikacja — это «транспорт». Komunikacja miejska — городской транспорт, środki komunikacji — транспортные средства, węzeł komunikacyjny — транспортный узел. Значение «общение» есть, но второе по частоте. Одно m, в отличие от русской «коммуникации». Тип на -cja: родительный, дательный, местный единственного — одна форма komunikacji, рядом архаичное komunikacyj."
