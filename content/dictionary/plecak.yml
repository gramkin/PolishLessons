notes:
  - { kind: false-friend, text: "PLECAK — «рюкзак», от PLECY «спина». А PLECY, хотя и родня русскому «плечо», значит именно «спина»; плечи по-польски — RAMIONA. Рюкзак — то, что носят на спине: NOSIĆ PLECAK NA PLECACH." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Родительный на -A: PLECAKA, местный — W PLECAKU. Школьный ранец — TORNISTER, рюкзак туриста — PLECAK TURYSTYCZNY." }
  - { kind: government, text: "В рюкзаке — W PLECAKU, местный. Из рюкзака — Z PLECAKA, родительный. С рюкзаком — Z PLECAKIEM, творительный: K перед I смягчается, отсюда -KIEM." }
  - { kind: pronunciation, text: "Читается «пле́цак», ударение на первом слоге. LE — «ле», C — «ц»." }
collocations:
  - { pl: "spakować plecak", ru: "собрать рюкзак" }
  - { pl: "ciężki plecak", ru: "тяжёлый рюкзак" }
  - { pl: "plecak szkolny", ru: "школьный рюкзак" }
family:
  - { pl: "plecy", ru: "спина", relation: root, id: plecy }
  - { pl: "plecaczek", ru: "рюкзачок", relation: derived }
  - { pl: "na plecach", ru: "на спине", relation: root }
etymology: "От PLECY «спина» с суффиксом -AK: «то, что на спине». Слово PLECY родственно русскому «плечо», но польский закрепил его за всей спиной."
memory: "Plecak — рюкзак, от plecy «спина» (а плечи — ramiona). Читается «пле́цак». W plecaku — в рюкзаке. Mieć plecy — иметь связи."
idioms:
  - { pl: "mieć plecy", ru: "иметь связи, блат" }
