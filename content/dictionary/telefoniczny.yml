notes:
  - { kind: usage, text: "Это относительное прилагательное, и из этого следует главное: степеней сравнения у него нет. Нельзя сказать BARDZIEJ TELEFONICZNY — разговор не бывает «более телефонным», он либо телефонный, либо нет. Поэтому в карточке одиннадцать форм, а не тридцать три, как у PASKUDNY или SMACZNY: градуируемое прилагательное даёт три степени по одиннадцати форм каждая, а относительное — только одну. Тот же разбор уже встречался на карточке с суффиксом -OWY, и правило в польском сквозное: суффиксы -OWY, -ICZNY, -ALNY, -NY в относительном значении степеней не дают." }
  - { kind: pronunciation, text: "Читается «тэлефони́чны», ударение на предпоследнем слоге, то есть на -NI-. Все E звучат «э» и не смягчают согласных: «тэ-лэ-», а не «те-ле-». Сочетание CZ даёт твёрдое «ч», а конечное Y — русское «ы». Мужско-личная форма множественного TELEFONICZNI звучит «тэлефони́чни», с мягким n на конце. Русское «телефонный» короче на слог, и ударение в нём стоит на другом месте, так что слово приходится переучивать целиком." }
  - { kind: government, text: "Прилагательное согласуется с существительным в роде, числе и падеже и само ничем не управляет. Устойчивые сочетания стоит выучить блоком, потому что они частотны: ROZMOWA TELEFONICZNA «телефонный разговор», NUMER TELEFONICZNY, KARTA TELEFONICZNA «телефонная карта», CENTRALA TELEFONICZNA «телефонная станция», BUDKA TELEFONICZNA «телефонная будка». Обратите внимание, что в современной речи «номер телефона» чаще передают родительным: NUMER TELEFONU, и этот вариант вытесняет прилагательное." }
  - { kind: false-friend, text: "Ложной дружбы в значении тут нет, зато есть ловушка в употреблении. Польский охотнее русского ставит прилагательное там, где русский берёт родительный падеж: ANKIETA TELEFONICZNA «опрос по телефону», ZGŁOSZENIE TELEFONICZNE «заявка по телефону», ZAMÓWIENIE TELEFONICZNE «заказ по телефону». Русский в этих случаях скажет «по телефону», предлогом, а не прилагательным. Поэтому при переводе с польского прилагательное часто приходится разворачивать в оборот, и наоборот — русское «по телефону» сворачивать в одно слово." }
