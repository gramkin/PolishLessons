etymology: "От TELEFON, собранного в девятнадцатом веке из греческих TELE «далеко» и PHONE «звук, голос»: буквально «далекозвук». Русское «телефонный» построено от того же заимствования, так что слова совпадают по составу полностью, и разница только в суффиксе: польский взял -ICZNY, русский -НЫЙ. Суффикс -ICZNY в польском соответствует русскому «-ический» и присоединяется к словам греко-латинского происхождения: HISTORYCZNY и «исторический», TECHNICZNY и «технический», LOGICZNY и «логический». Корень TELE- виден и в TELEWIZJA, и в TELESKOP, а PHONE — в FONETYKA и в MAGNETOFON, то есть в словах, которые русскому уже знакомы и помогают разобрать новое."
memory: "Относительное прилагательное: степеней сравнения нет, bardziej telefoniczny сказать нельзя — поэтому одиннадцать форм, а не тридцать три. Суффикс -iczny отвечает русскому «-ический»: historyczny, techniczny, logiczny. Польский ставит прилагательное там, где русский берёт «по телефону»: ankieta telefoniczna «опрос по телефону»."
