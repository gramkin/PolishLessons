# review
id: odlozyc
format: 2
lemma: "odłożyć"
rank: 1249
pos: verb
aspect: perf
pron: { cyr: "одуо́жыць" }
senses:
  - id: put-back
    ru: "положить на место, отложить в сторону"
    examples:
      - pl: "Odłożył słuchawkę."
        ru: "Он положил трубку."
        source: { kind: translated, id: 440624 }
      - pl: "Tom odłożył książkę."
        ru: "Том отложил книгу."
        source: { kind: translated, id: 6391726 }
      - pl: "Odłóż to."
        ru: "Положи это."
        source: { kind: translated, id: 10542205 }
  - id: postpone
    ru: "отложить, перенести на более поздний срок"
    examples:
      - pl: "Postanowił odłożyć swój odjazd."
        ru: "Он решил отложить свой отъезд."
        source: { kind: tatoeba, id: 351438 }
      - pl: "Mecz odłożono do przyszłego tygodnia."
        ru: "Матч отложили до следующей недели."
        source: { kind: translated, id: 365242 }
      - pl: "Muszę odłożyć wizytę u dentysty."
        ru: "Мне нужно перенести приём у стоматолога."
        source: { kind: translated, id: 831023 }
  - id: save-money
    ru: "отложить, накопить (деньги)"
    examples:
      - pl: "Nie mając pracy, nie odłożę ani grosza."
        ru: "Без работы я не отложу ни гроша."
        source: { kind: translated, id: 914727 }
      - pl: "Nie mam pracy, więc żadnych pieniędzy nie odłożę."
        ru: "У меня нет работы, так что никаких денег я не отложу."
        source: { kind: translated, id: 933323 }
      - pl: "Odłożyłem trochę pieniędzy na czarną godzinę."
        ru: "Я отложил немного денег на чёрный день."
        source: { kind: authored }
notes:
  - { kind: government, text: "odłożyć coś «отложить что-то» — винительный падеж. Перенести на потом — odłożyć na później, на конкретный срок — odłożyć do jutra." }
  - { kind: usage, text: "Odłożyć słuchawkę «положить трубку» — готовая фраза о телефонном разговоре." }
  - { kind: usage, text: "Значение «накопить»: odłożyć na czarną godzinę «отложить на чёрный день». Несовершенный вид — odkładać." }
  - { kind: pronunciation, text: "В повелительном наклонении o чередуется с ó: odłożyć, но Odłóż! «Положи!»." }
collocations:
  - { pl: "odłożyć słuchawkę", ru: "положить трубку" }
  - { pl: "odłożyć na później", ru: "отложить на потом" }
  - { pl: "odłożyć pieniądze", ru: "отложить деньги" }
etymology: "Приставка od- и łożyć «класть», от того же корня, что łoże «ложе». Русское «отложить» собрано ровно так же."
memory: "odłożyć — «отложить» во всех смыслах: положить на место (odłożyć słuchawkę), перенести на потом (odłożyć do jutra) и накопить (odłożyć na czarną godzinę). Повелительное — Odłóż!, с чередованием o в ó."
idioms:
  - { pl: "odłożyć słuchawkę", ru: "положить трубку" }
  - { pl: "odłożyć na czarną godzinę", ru: "отложить на чёрный день" }
  - { pl: "odłożyć ad acta", ru: "сдать в архив" }
formExamplesSkip:
  - { form: "odłożeni", reason: "мужско-личной страдательной формы у этого глагола не бывает: откладывают вещь, срок или деньги — книгу, спотканie, grosz, — но не человека. Остальные формы причастия в карточке есть с примерами: sprawa odłożona do jutra, pieniądze odłożone na czarną godzinę" }
  - { form: "odłożywszy", reason: "книжное деепричастие прошедшего времени; в живой речи не употребляется. То же основание, по которому в словаре оставлены без примеров doczekawszy, dołączywszy, przysławszy и doprowadziwszy" }
