etymology: "Приставка S- (из праславянского *sъ- «вниз, с поверхности») плюс CHODZIĆ «ходить», от *xoditi. То есть буквально «ходить вниз», и русское «сходить» собрано ровно из тех же двух частей с тем же значением приставки. Отсюда и совпадение первого значения, и общий предлог Z. Значение «отделяться» выросло из того же образа: пятно или краска сходит с поверхности так же, как человек сходит с горы. А переходное «исходить пешком» идёт от идеи полноты обхода, как в русском «исходить весь город», только польский выражает её той же приставкой S-, а не ИЗ-."
memory: "Несовершенный вид к zejść: s- «вниз» плюс chodzić. Читается «схо́дзиць», sch — это «сх», не «щ». Главная ловушка: «сходить в магазин» — НЕ schodzić, а pójść do sklepu. Переходное значение schodzić buty «истоптать» даёт формы schodzony."
idioms:
  - { pl: "schodzić komuś z drogi", ru: "уступать дорогу, не мешать" }
  - { pl: "plama schodzi", ru: "пятно сходит" }
  - { pl: "schodzić na psy", ru: "идти под откос, приходить в упадок" }
formExamplesSkip:
  - { form: "schodzeni", reason: "В переходном значении SCHODZIĆ управляет винительным падежом пути или обуви — SCHODZIĆ MIASTO «обойти город пешком», SCHODZIĆ BUTY «истоптать обувь», — но человека прямым дополнением этот глагол не берёт. Поэтому страдательное причастие мужско-личного множественного числа, которое предполагает людей в роли дополнения, грамматически невозможно: нельзя быть «исхоженным». Формы SCHODZONY, SCHODZONA, SCHODZONE согласуются с обувью и тропой и написаны, а SCHODZENI живёт только в таблице." }
