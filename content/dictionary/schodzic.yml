notes:
  - { kind: usage, text: "Несовершенный вид к ZEJŚĆ: SCHODZIĆ — процесс, ZEJŚĆ — результат. Три значения расходятся далеко. Первое прямое, о спуске: SCHODZIĆ ZE SCHODÓW, SCHODZIĆ Z GÓRY. Второе о том, что отделяется от поверхности: PLAMA SCHODZI, FARBA SCHODZI, SKÓRA SCHODZI — здесь подлежащее не человек, а само пятно или краска. Третье переходное и потому неожиданное: SCHODZIĆ MIASTO значит «обойти город пешком вдоль и поперёк», а SCHODZIĆ BUTY — «истоптать обувь». Именно от этого переходного значения берутся страдательные формы SCHODZONY, которых у непереходного спуска быть не могло бы." }
  - { kind: pronunciation, text: "Читается «схо́дзиць», в два слога, с ударением на первом: ударение предпоследнее, а слогов всего два. Начальное sch — это не «щ» и не «ш», а просто «сх»: s и ch читаются по отдельности, как в русском «схема». Сочетание dzi звучит «дзь», мягко. Повелительное наклонение SCHODŹ — «сходзь», с мягким дзь на конце. Деепричастие SCHODZĄC — «схо́дзонц», с носовой ą." }
  - { kind: government, text: "В значении спуска — предлог Z с родительным падежом: SCHODZIĆ ZE SCHODÓW, ZE SZCZYTU, Z DRABINY. По-русски здесь предлог «с» и тот же падеж, так что перенос прямой. В значении отделения подлежащим становится само пятно, а предлог тот же Z: PLAMA SCHODZI Z KOSZULI. В переходном значении предлога нет вовсе, только винительный: SCHODZIĆ CAŁE MIASTO, SCHODZIĆ BUTY. Отдельно стоит оборот SCHODZIĆ KOMUŚ Z DROGI — «уступать кому-то дорогу», с дательным падежом лица." }
  - { kind: false-friend, text: "Ловушка крупная и бытовая. Русское «сходить» имеет разговорное значение «пойти и вернуться»: «сходить в магазин», «сходить за хлебом». У польского SCHODZIĆ этого значения нет вовсе, и перевести так нельзя: получится «спускаться в магазин». По-польски «сходить в магазин» — это PÓJŚĆ DO SKLEPU или разговорное SKOCZYĆ DO SKLEPU, буквально «скакнуть в магазин». Это одна из самых частых ошибок русскоговорящих, потому что значение кажется очевидным." }
collocations:
  - { pl: "schodzić ze schodów", ru: "спускаться по лестнице" }
  - { pl: "plama schodzi", ru: "пятно сходит" }
