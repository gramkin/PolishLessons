notes:
  - { kind: pronunciation, text: "ИМЕНИТЕЛЬНЫЙ МНОЖЕСТВЕННОГО — CHIRURDZY, С ПЕРЕХОДОМ G В DZ. Это третий согласный в уже знакомом ряду: перед -i и -y заднеязычные смягчаются, и k даёт c (przeciwnik — przeciwnicy), ch даёт s (suchy — susi), а g даёт dz. Так же drogi — drodzy, Norweg — Norwedzy, wróg — wrogowie, но biolog — biolodzy. Русское «хирург — хирурги» основу не трогает вовсе." }
  - { kind: pronunciation, text: "Конечное g оглушается: сам CHIRURG звучит примерно «хиру́рк». Но в косвенных падежах звонкость возвращается, потому что за g идёт гласный: chirurga, chirurgiem, chirurgowi. То же самое у róg — rogu и u bóg — boga." }
  - { kind: usage, text: "Слово не меняется по полу: женщину-хирурга называют так же, CHIRURG, и говорят pani chirurg, nasza pani chirurg. Отдельной формы «chirurżka» в нормативном языке нет. Русский ведёт себя так же — «она хирург», — так что здесь расхождения нет, в отличие от nauczyciel — nauczycielka." }
collocations:
  - { pl: "chirurg plastyczny", ru: "пластический хирург" }
  - { pl: "pani chirurg", ru: "женщина-хирург" }
  - { pl: "zespół chirurgów", ru: "бригада хирургов" }
family:
  - { pl: "chirurgia", ru: "хирургия", relation: root }
  - { pl: "chirurgiczny", ru: "хирургический", relation: derived }
  - { pl: "lekarz", ru: "врач", relation: root, id: lekarz }
etymology: "Из греческого cheirourgós «работающий руками», от cheír «рука» и érgon «дело». Русский «хирург» пришёл тем же книжным путём, через латынь, поэтому слова совпадают целиком. Любопытно, что исходный смысл был вполне буквальным: тот, кто лечит руками, в отличие от врача, лечащего словом и снадобьем."
memory: "Множественное — CHIRURDZY, с dz вместо g, по тому же правилу, что susi от suchy и przeciwnicy от przeciwnik. И конечное g глухое: сам chirurg звучит «хиру́рк», но chirurga уже со звонким г."
idioms:
