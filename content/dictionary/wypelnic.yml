notes:
  - { kind: false-friend, text: "ОДИН польский глагол на ДВА русских. Wypełnić formularz — это «ЗАполнить бланк», а wypełnić obowiązek — «ВЫполнить долг». Русский различает эти смыслы приставками, польский обходится одним словом, и контекст решает всё. Поэтому wypełnił wszystko без дополнения двусмысленно: мог заполнить бумаги, а мог исполнить обещанное." }
  - { kind: usage, text: "У глагола ШЕСТЬ повелительных форм — два полных равноправных набора: wypełnij, wypełnijmy, wypełnijcie и wypełń, wypełńmy, wypełńcie. Оба правильны; именно из-за этой двойственности парадигма насчитывает 56 форм, а не обычные 53. Короткий набор чаще звучит в инструкциях и на бланках (Wypełń formularz),長 длинный — в книжной речи." }
  - { kind: government, text: "Заполнить ЧТО — винительный: wypełnić formularz, wypełnić lukę. Заполнить ЧЕМ — творительный без предлога: wypełnić dziurę zaprawą, wypełnić czas pracą. Обе схемы совпадают с русскими." }
  - { kind: pronunciation, text: "Буква ł звучит как русское неслоговое «у», поэтому wypełnić — это «выпэ́униць», а не «выпелнить». Отглагольное существительное wypełnienie значит и «заполнение», и, в зубоврачебном деле, «пломбу»." }
collocations:
  - { pl: "wypełnić formularz", ru: "заполнить бланк" }
  - { pl: "wypełnić obowiązek", ru: "выполнить долг" }
  - { pl: "wypełnienie zęba", ru: "пломба" }
family:
  - { pl: "pełny", ru: "полный", relation: root, id: pelny }
  - { pl: "wypełniać", ru: "заполнять; выполнять", relation: aspect }
  - { pl: "napełnić", ru: "наполнить", relation: derived }
etymology: "Приставка wy- плюс pełnić, от pełny «полный», праславянское *pьlnъ — то же слово, что русское «полный». Русские «выполнить» и «наполнить» построены от того же корня теми же приставками, так что всё гнездо прозрачно: pełny «полный», napełnić «наполнить», pełnia «полнота, полнолуние»."
memory: "wypełnić — и «заполнить» (formularz), и «выполнить» (obowiązek): один польский глагол на два русских. Корень тот же, что «полный». И запомните редкость: шесть повелительных форм, wypełnij и wypełń равно правильны."
idioms:
