  - { pl: "pisać", ru: "писать", relation: root, id: pisac }
etymology: "Сложное слово: DŁUGO «долго» + PISAĆ «писать». Ручка, которая долго пишет без чернильницы. DŁUG- родственно русскому «долгий»: ŁU на месте «ол»."
memory: "Długopis — шариковая ручка, «долгопис». Читается «дуу́гопис». Klamka — дверная ручка, pióro — перьевая. Pisać długopisem — писать ручкой."
idioms:
