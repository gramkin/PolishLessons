notes:
  - { kind: false-friend, text: "DŁUGOPIS — «шариковая ручка», буквально «долгопис». Дверная ручка — KLAMKA, перьевая ручка — PIÓRO, а «ручка» как маленькая рука — RĄCZKA. В обиходе DŁUGOPIS называют любую ручку, кроме перьевой." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Родительный на -U: DŁUGOPISU, местный — W DŁUGOPISIE. Стержень — WKŁAD, чернила в нём — TUSZ." }
  - { kind: government, text: "Писать ручкой — PISAĆ DŁUGOPISEM, творительный без предлога, как и в русском. Стержень для ручки — WKŁAD DO DŁUGOPISU, DO с родительным." }
  - { kind: pronunciation, text: "Читается «дуу́гопис», ударение на предпоследнем слоге. Ł — «у»: DŁU — «дуу». Никакого «л»." }
collocations:
  - { pl: "pisać długopisem", ru: "писать ручкой" }
  - { pl: "niebieski długopis", ru: "синяя ручка" }
  - { pl: "pożyczyć długopis", ru: "одолжить ручку" }
