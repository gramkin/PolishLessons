id: kontrakt
format: 2
lemma: "kontrakt"
rank: 1996
pos: noun
pron: { cyr: "ко́нтракт" }
senses:
  - id: contract
    ru: "контракт, договор"
    examples:
      - pl: "Podpisz kontrakt."
        ru: "Подпиши контракт."
        source: { kind: authored }
      - pl: "Podpisałeś kontrakt?"
        ru: "Ты подписал контракт?"
        source: { kind: authored }
      - pl: "Kontrakt wygasa w grudniu."
        ru: "Контракт истекает в декабре."
        source: { kind: authored }
      - pl: "W kontrakcie nie ma takiego punktu."
        ru: "В контракте нет такого пункта."
