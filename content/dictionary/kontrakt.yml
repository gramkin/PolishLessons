      - pl: "Zerwanie kontraktu kosztuje."
        ru: "Разрыв контракта обходится дорого."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Само слово совпадает с русским «контракт» — то же латинское заимствование. Но в польском оно уже, чем кажется: обычный бытовой договор это umowa (umowa o pracę, umowa najmu), а kontrakt звучит официально и чаще о коммерческих или спортивных соглашениях. По-русски различие похожее, между «договором» и «контрактом»." }
  - { kind: usage, text: "Предложный падеж — kontrakcie, с чередованием t → ć, как в koncercie и funcie. Глаголы при нём: podpisać kontrakt «подписать», zerwać kontrakt «разорвать», przedłużyć kontrakt «продлить»." }
  - { kind: government, text: "Предлоги: kontrakt NA coś «контракт на что-л.» (винительный), kontrakt Z kimś «контракт с кем-л.» (творительный). Оба совпадают с русскими." }
collocations:
  - { pl: "podpisać kontrakt", ru: "подписать контракт" }
  - { pl: "zerwać kontrakt", ru: "разорвать контракт" }
  - { pl: "kontrakt na rok", ru: "контракт на год" }
family:
  - { pl: "kontraktowy", ru: "контрактный", relation: derived }
etymology: "Из латинского contractus «стянутое, заключённое», от contrahere (con- «вместе» + trahere «тянуть»). Тот же корень дал «трактор» и «контракция». В русский слово пришло тем же книжным путём, поэтому kontrakt и «контракт» совпадают буква в букву."
memory: "kontrakt — «контракт», то же латинское слово. Но помните: обычный договор по-польски umowa, а kontrakt официальнее. Предложный kontrakcie (t → ć), как koncercie и funcie."
idioms:
  - { pl: "podpisać kontrakt", ru: "подписать контракт" }
  - { pl: "zerwać kontrakt", ru: "разорвать контракт" }
