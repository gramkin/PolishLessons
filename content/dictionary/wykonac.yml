# review
id: wykonac
format: 2
lemma: "wykonać"
rank: 813
pos: verb
aspect: perf
pron: { cyr: "выко́наць" }
senses:
  - id: carry-out
    ru: "выполнить, сделать (работу, задание)"
    examples:
      - pl: "Nie mógł wykonać tej pracy sam."
        ru: "Он не мог выполнить эту работу сам."
        source: { kind: translated, id: 502063 }
      - pl: "Wykonał pracę do końca."
        ru: "Он довёл работу до конца."
        source: { kind: translated, id: 787825 }
      - pl: "Tom wykonał świetną robotę."
        ru: "Том проделал отличную работу."
        source: { kind: translated, id: 1352119 }
  - id: made-of
    ru: "wykonany z czegoś — сделан из чего-то"
    examples:
      - pl: "To krzesło wykonane jest z drewna."
        ru: "Этот стул сделан из дерева."
        source: { kind: translated, id: 366067 }
      - pl: "Ta tkanina jest wykonana z bawełny."
        ru: "Эта ткань сделана из хлопка."
        source: { kind: translated, id: 832642 }
      - pl: "Ten komin wykonany jest z cegieł."
        ru: "Эта труба сделана из кирпича."
        source: { kind: translated, id: 720321 }
  - id: performance
    ru: "wykonanie — исполнение, выполнение"
    examples:
      - pl: "Wykonanie planu było proste."
        ru: "Выполнение плана было простым."
        source: { kind: translated, id: 524811 }
      - pl: "Pomysł był świetny, ale wykonanie okropne."
        ru: "Идея была отличная, а исполнение ужасное."
        source: { kind: translated, id: 13081748 }
      - pl: "Uważam swoje zadanie za wykonane."
        ru: "Я считаю свою задачу выполненной."
        source: { kind: translated, id: 12624975 }
notes:
  - { kind: government, text: "wykonany Z czegoś — «сделан из чего-то», предлог z с родительным: wykonany z drewna «сделан из дерева». Это самое частое употребление причастия." }
  - { kind: usage, text: "wykonać pracę, zadanie, polecenie — «выполнить работу, задание, поручение». А wykonać utwór значит «исполнить произведение»." }
  - { kind: usage, text: "Отглагольное существительное wykonanie покрывает и «выполнение» (wykonanie planu), и «исполнение» музыкальное: Pomysł był świetny, ale wykonanie okropne." }
  - { kind: usage, text: "Разбирается как wy- + konać, от koniec «конец»: буквально «довести до конца». Несовершенный вид — wykonywać." }
collocations:
  - { pl: "wykonać pracę", ru: "выполнить работу" }
  - { pl: "wykonać zadanie", ru: "выполнить задание" }
  - { pl: "wykonany z drewna", ru: "сделанный из дерева" }
  - { pl: "wykonanie planu", ru: "выполнение плана" }
family:
  - { pl: "wykonywać", ru: "выполнять", relation: aspect }
  - { pl: "wykonawca", ru: "исполнитель", relation: derived }
  - { pl: "koniec", ru: "конец", relation: root }
etymology: "Приставка wy- + konać, от koniec «конец»: буквально «довести до конца». Русское «выполнить» построено от «полный», мысль та же, но образ другой."
memory: "wykonać — «выполнить»: wykonać pracę, zadanie, polecenie. Причастие чаще всего встречается в обороте wykonany Z czegoś «сделан из чего-то»: wykonany z drewna. А wykonanie — это и «выполнение», и «исполнение» музыки."
idioms:
  - { pl: "wykonać zadanie", ru: "выполнить задание" }
  - { pl: "wykonany z drewna", ru: "сделанный из дерева" }
  - { pl: "misja wykonana", ru: "миссия выполнена" }
formExamplesSkip:
  - { form: "wykonani", reason: "мужско-личная форма страдательного причастия: глагол управляет только неодушевлёнными дополнениями — wykonuje się pracę, zadanie, utwór, а по-польски исполняют приговор (wykonano wyrok), но не человека" }
