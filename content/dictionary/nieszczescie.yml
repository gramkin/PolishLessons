# review
id: nieszczescie
format: 2
lemma: "nieszczęście"
rank: 3320
pos: noun
pron: { cyr: "нешчэ́ньсьце" }
senses:
  - id: misfortune
    ru: "несчастье, беда"
    examples:
      - pl: "Nieszczęścia chodzą parami."
        ru: "Беда не приходит одна."
        source: { kind: translated, id: 440614 }
      - pl: "Wojna zawsze przynosi nieszczęście."
        ru: "Война всегда приносит несчастье."
        source: { kind: tatoeba, id: 10559683 }
      - pl: "To sprowadzi nieszczęście na twoją rodzinę."
        ru: "Это навлечёт несчастье на твою семью."
        source: { kind: translated, id: 511566 }
  - id: grief
    ru: "горе, несчастье (как переживание)"
    examples:
      - pl: "Miał ochotę podzielić się ze wszystkimi swoim nieszczęściem."
        ru: "Ему хотелось поделиться со всеми своим горем."
        source: { kind: tatoeba, id: 12624945 }
      - pl: "Ratunek przed tym nieszczęściem jest niewyobrażalny."
        ru: "Спасение от этого несчастья невообразимо."
        source: { kind: translated, id: 4789091 }
notes:
  - { kind: usage, text: "szczęście w nieszczęściu — буквально «счастье в несчастье», русское «не было бы счастья, да несчастье помогло»." }
  - { kind: false-friend, text: "Слово собрано ровно как русское: nie + szczęście «счастье». Здесь языки совпадают полностью." }
  - { kind: government, text: "Средний род: to nieszczęście, tego nieszczęścia, tym nieszczęściem." }
  - { kind: usage, text: "na nieszczęście «к несчастью» — вводный оборот, как в русском." }
collocations:
  - { pl: "szczęście w nieszczęściu", ru: "счастье в несчастье" }
  - { pl: "na nieszczęście", ru: "к несчастью" }
etymology: "nie + szczęście «счастье», от праславянского *sъ-čęstь «хорошая доля»; русское «счастье» и «несчастье» построены от «части, доли» тем же способом."
memory: "nieszczęście = «несчастье», собрано как русское слово: nie + szczęście. Запомните оборот szczęście w nieszczęściu «счастье в несчастье»."
idioms:
  - { pl: "szczęście w nieszczęściu", ru: "счастье в несчастье" }
  - { pl: "na nieszczęście", ru: "к несчастью" }
