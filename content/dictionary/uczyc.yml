  - { pl: "uczony", ru: "учёный", relation: derived }
etymology: "Праславянское *učiti — то же слово, что русское «учить». Отсюда же uczeń «ученик», nauka «наука» и uczony «учёный»."
memory: "uczyć — «учить», и ловушек тут две. Первая — падежи: uczyć KOGOŚ CZEGOŚ, винительный плюс родительный. Tom uczy Mary francuskiego, а по-русски «учит Мэри французскому», дательный. И возвратное так же: uczę się polskiego, родительный, а не «polskiemu». Вторая — сама пара uczyć / uczyć się: без się вам нужен ученик, с się вы учитесь сами. А uczony — застывшее страдательное причастие, ставшее существительным «учёный», ровно как в русском."
idioms:
  - { pl: "uczyć się na błędach", ru: "учиться на ошибках" }
  - { pl: "uczyć się na pamięć", ru: "учить наизусть" }
  - { pl: "powtarzanie jest matką uczenia się", ru: "повторение — мать учения" }
  - { pl: "uczyć kogoś rozumu", ru: "учить кого-то уму-разуму" }
