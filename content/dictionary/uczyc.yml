senses:
  - id: teach
    ru: "учить кого-л. чему-л. (винительный + родительный)"
    note: "uczyć KOGOŚ CZEGOŚ: Tom uczy Mary francuskiego."
    examples:
      - pl: "Tom uczy Mary francuskiego."
        ru: "Том учит Мэри французскому."
        source: { kind: tatoeba, id: 5508767 }
      - pl: "Od jak dawna uczysz niemieckiego?"
        ru: "Давно ты немецкий учишь?"
        source: { kind: tatoeba, id: 6771302 }
      - pl: "Uczyłam w Bostonie."
        ru: "Я преподавала в Бостоне."
        source: { kind: translated, id: 12225679 }
  - id: learn
    ru: "uczyć się czegoś — учиться чему-л., изучать что-л. (родительный)"
    note: "Русский здесь ставит дательный («учиться чему-то»), польский — родительный."
    examples:
      - pl: "Uczę się czeskiego."
        ru: "Я учу чешский."
        source: { kind: tatoeba, id: 1564704 }
      - pl: "Muszę się uczyć japońskiego."
        ru: "Я должен учить японский."
        source: { kind: tatoeba, id: 368178 }
      - pl: "On się szybko uczy."
        ru: "Он быстро учится."
        source: { kind: tatoeba, id: 1627112 }
  - id: scholar
    ru: "uczony — учёный (застывшее причастие, ставшее существительным)"
    note: "Ровно как русское «учёный» — тоже причастие от «учить»."
    examples:
      - pl: "To powszechnie szanowany uczony."
        ru: "Он ученый, которого все уважают."
        source: { kind: tatoeba, id: 351390 }
      - pl: "Powiedział, że chciałby zostać uczonym."
        ru: "Он сказал, что хотел бы стать учёным."
        source: { kind: tatoeba, id: 13084444 }
      - pl: "Uczeni chyba znają prawdę."
        ru: "Учёные, наверное, знают правду."
        source: { kind: translated, id: 359932 }
  - id: learner
    ru: "uczący się — учащийся, изучающий"
    note: "Действительное причастие: osoby uczące się angielskiego."
    examples:
      - pl: "Uczący się zebrali się przed szkołą."
        ru: "Учащиеся собрались перед школой."
        source: { kind: tatoeba, id: 5907122 }
