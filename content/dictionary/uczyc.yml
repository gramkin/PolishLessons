      - pl: "Ile może być szkół uczących języka polskiego w Chinach?"
        ru: "Сколько может быть в Китае школ, обучающих польскому языку?"
        source: { kind: translated, id: 3743890 }
  - id: schooling
    ru: "uczenie (się) — обучение, учение"
    note: "Powtarzanie jest matką uczenia się «Повторение — мать учения»."
    examples:
      - pl: "Powtarzanie jest matką uczenia się."
        ru: "Повторение — мать учения."
        source: { kind: translated, id: 13024926 }
      - pl: "Praca mojej siostry polega na uczeniu angielskiego."
        ru: "Работа моей сестры состоит в обучении английскому."
        source: { kind: translated, id: 353946 }
      - pl: "Musimy unowocześnić nasze metody uczenia."
        ru: "Нам надо осовременить наши методы обучения."
        source: { kind: translated, id: 357703 }
notes:
  - { kind: government, text: "Главное отличие от русского: uczyć KOGOŚ CZEGOŚ — винительный плюс родительный. Tom uczy Mary francuskiego «Том учит Мэри французскому». Русский во второй позиции ставит дательный, поляк — родительный." }
  - { kind: government, text: "То же и в возвратном: uczyć się CZEGOŚ — родительный. Uczę się polskiego «Я учу польский», uczymy się arabskiego. Не «uczyć się polskiemu»." }
  - { kind: usage, text: "Пара uczyć / uczyć się переворачивает смысл: uczyć — «учить кого-то», uczyć się — «учиться самому». Без się глагол обязательно требует ученика." }
  - { kind: false-friend, text: "uczony — это не прилагательное «учёный» в смысле «умный», а существительное «учёный, исследователь»: to wybitny uczony. По происхождению это страдательное причастие от uczyć — ровно как русское «учёный» от «учить»." }
  - { kind: usage, text: "Совершенный вид — nauczyć (się): nauczyłem się polskiego «я выучил польский». Приставка na- даёт результат." }
  - { kind: usage, text: "Родня обширна: uczeń «ученик», nauczyciel «учитель», nauka «наука, учёба», uczelnia «вуз»." }
collocations:
  - { pl: "uczyć się czegoś", ru: "учиться чему-либо" }
  - { pl: "uczyć kogoś czegoś", ru: "учить кого-либо чему-либо" }
  - { pl: "uczyć się na pamięć", ru: "учить наизусть" }
