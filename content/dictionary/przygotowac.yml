# review
id: przygotowac
format: 2
lemma: "przygotować"
rank: 478
pos: verb
aspect: perf
pron: { cyr: "пшыгото́ваць" }
senses:
  - id: prepare
    ru: "приготовить, подготовить"
    examples:
      - pl: "Przygotowałaś obiad?"
        ru: "Ты обед приготовила?"
        source: { kind: tatoeba, id: 12470518 }
      - pl: "Przygotowała nam przekąski."
        ru: "Она приготовила нам закуски."
        source: { kind: translated, id: 766171 }
      - pl: "Przygotowałam kolację."
        ru: "Я приготовила ужин."
        source: { kind: translated, id: 817907 }
  - id: get-ready
    ru: "подготовиться (przygotować się)"
    examples:
      - pl: "Przygotować się."
        ru: "Приготовиться."
        source: { kind: translated, id: 730541 }
      - pl: "Uczniowie przygotowali się do egzaminu."
        ru: "Ученики подготовились к экзамену."
        source: { kind: translated, id: 4133986 }
      - pl: "Egzamin już jutro, a ja w ogóle nie jestem przygotowany."
        ru: "Экзамен уже завтра, а я вообще не готов."
        source: { kind: tatoeba, id: 12655221 }
notes:
  - { kind: usage, text: "С возвратным się значит «подготовиться», и требует предлога do с родительным: przygotować się do egzaminu «подготовиться к экзамену»." }
  - { kind: usage, text: "Причастие przygotowany работает как прилагательное «готовый»: Bądź przygotowany «Будь готов», Jestem przygotowana «Я готова»." }
  - { kind: usage, text: "Существительное przygotowania (множественное) — «приготовления»: Przygotowania zakończone «Приготовления закончены»." }
  - { kind: usage, text: "Несовершенный вид длиннее, с расширением -yw-: przygotowywać." }
collocations:
  - { pl: "przygotować obiad", ru: "приготовить обед" }
  - { pl: "przygotować się do", ru: "подготовиться к" }
  - { pl: "bądź przygotowany", ru: "будь готов" }
  - { pl: "przygotowania", ru: "приготовления" }
etymology: "Из przy- + gotować «готовить»; русское «приготовить» собрано ровно из тех же частей, и gotowy «готовый» тоже совпадает с русским."
memory: "przygotować — «приготовить, подготовить», слово буква в букву русское. С się это «подготовиться», и обязательно с предлогом do: przygotować się do egzaminu. Несовершенный вид длиннее — przygotowywać."
idioms:
  - { pl: "przygotować się do", ru: "подготовиться к" }
  - { pl: "bądź przygotowany", ru: "будь готов" }
  - { pl: "przygotowania zakończone", ru: "приготовления закончены" }
