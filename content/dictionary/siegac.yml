# review
id: siegac
format: 2
lemma: "sięgać"
rank: 2584
pos: verb
pron: { cyr: "сье́нгаць" }
senses:
  - id: reach-for
    ru: "тянуться, протягивать руку за чем-либо"
    examples:
      - pl: "Sięgał po szklankę w ciemności."
        ru: "Он тянулся за стаканом в темноте."
        source: { kind: authored }
      - pl: "Nie sięgaj po nóż bez pozwolenia."
        ru: "Не тянись за ножом без разрешения."
        source: { kind: authored }
  - id: aspire
    ru: "стремиться, претендовать на что-либо"
    examples:
      - pl: "Sięgali po władzę od lat."
        ru: "Они годами тянулись к власти."
        source: { kind: authored }
      - pl: "Młodzi artyści sięgają po nowe formy."
        ru: "Молодые художники обращаются к новым формам."
        source: { kind: authored }
  - id: extend
    ru: "доходить, достигать (о протяжённости)"
    examples:
      - pl: "Woda sięgała nam do kolan."
        ru: "Вода доходила нам до колен."
        source: { kind: authored }
      - pl: "Jego wiedza sięga głęboko."
        ru: "Его знания идут глубоко."
        source: { kind: authored }
notes:
  - { kind: government, text: "Несовершенный вид, и управление решает смысл: sięgać PO coś с винительным «тянуться за чем-то», sięgać DO czegoś с родительным «доходить до», sięgać czegoś с родительным «достигать уровня». Совершенный вид — sięgnąć." }
  - { kind: usage, text: "Переносно — «стремиться, претендовать»: sięgać po władzę «тянуться к власти», sięgać po nagrodę." }
  - { kind: usage, text: "О протяжённости и времени: woda sięgała do kolan, tradycja sięga średniowiecza. От того же корня zasięg «охват, радиус действия»." }
  - { kind: false-friend, text: "Корень тот же, что в русских книжных «посягать» и «досягаемый» и в слове «присяга», которому прямо отвечает польское przysięgać. Но обиходное sięgać значит простое «протянуть руку», без всякой торжественности." }
collocations:
  - { pl: "sięgać po coś", ru: "тянуться за чем-то" }
  - { pl: "sięgać do kolan", ru: "доходить до колен" }
  - { pl: "sięgać po władzę", ru: "тянуться к власти" }
family:
  - { pl: "sięgnąć", ru: "дотянуться, достать", relation: aspect }
  - { pl: "zasięg", ru: "охват, радиус действия", relation: derived, id: zasieg }
  - { pl: "przysięgać", ru: "присягать", relation: root, id: przysiegac }
etymology: "Праславянский корень *sęg- «протягивать руку». В русском он остался в книжных «посягать» и «досягаемый» и в существительном «присяга», которому прямо отвечает польское przysięgać. От того же корня польское zasięg «охват»."
memory: "sięgać — «протягивать руку, доходить». Падеж решает смысл: sięgać PO coś «тянуться за», sięgać DO czegoś «доходить до», sięgać czegoś «достигать»."
idioms:
  - { pl: "sięgać po władzę", ru: "тянуться к власти" }
  - { pl: "jak wzrok sięga", ru: "насколько хватает глаз" }
