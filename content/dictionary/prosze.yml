  - id: here-you-are
    ru: "пожалуйста (подавая что-л.); прошу"
    examples:
      - pl: "Proszę, to dla ciebie."
        ru: "Пожалуйста, это для тебя."
        source: { kind: authored }
      - pl: "Proszę wejść."
        ru: "Проходите, пожалуйста."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Одно слово на несколько русских: «пожалуйста» при просьбе, «пожалуйста» при подаче предмета, «прошу» при приглашении войти и «что, простите?» переспросом." }
  - { kind: government, text: "Просить О чём-л. — prosić O coś, с винительным: proszę o rachunek «счёт, пожалуйста». Это самая частая конструкция." }
  - { kind: usage, text: "В ответ на dziękuję говорят nie ma za co или proszę bardzo — как русское «не за что»." }
  - { kind: false-friend, text: "Это 1-е лицо глагола prosić «просить», застывшее в формулу вежливости. Русское «прошу» употребляется куда у́же." }
collocations:
  - { pl: "proszę o…", ru: "прошу…" }
  - { pl: "proszę bardzo", ru: "пожалуйста, не за что" }
etymology: "Форма глагола prosić «просить», застывшая как формула вежливости."
memory: "proszę — и «пожалуйста», и «прошу», и «проходите». Просят O coś, с винительным: proszę o rachunek. В ответ на спасибо — proszę bardzo."
