notes:
  - { kind: usage, text: "Девять форм, средний род. Во множественном BOGACTWA значит «богатства, ресурсы»: BOGACTWA NATURALNE. Родительный множественного — BOGACTW, без окончания. В местном падеже W смягчается: W BOGACTWIE." }
  - { kind: false-friend, text: "Слово то же, что русское «богатство», и значения совпадают. Запомните формулы: BOGACTWA NATURALNE — «природные ресурсы», DOJŚĆ DO BOGACTWA — «разбогатеть», буквально «дойти до богатства». BOGACZ — «богач», а WZBOGACIĆ SIĘ — «обогатиться»." }
  - { kind: government, text: "Разбогатеть — DOJŚĆ DO BOGACTWA, DO с родительным. Жить в богатстве — ŻYĆ W BOGACTWIE, местный. Богатство чего-то — BOGACTWO CZEGOŚ: BOGACTWO JĘZYKA." }
  - { kind: pronunciation, text: "Читается «бога́цтфо», три слога, ударение на втором. CTW звучит «цтф»: W после глухого T оглушается в «ф», как в DZIECIŃSTWO «дзеци́ньстфо»." }
  - { kind: register, text: "OPŁYWAĆ W BOGACTWA, «плавать в богатствах», — о жизни в роскоши, с лёгкой иронией. Пословица BOGACTW PRZYBYWA, CNOTY UBYWA — «богатства прибывает, добродетели убывает»." }
collocations:
  - { pl: "ogromne bogactwo", ru: "огромное богатство" }
  - { pl: "bogactwo języka", ru: "богатство языка" }
  - { pl: "dojść do bogactwa", ru: "разбогатеть" }
family:
  - { pl: "bogaty", ru: "богатый", relation: root, id: bogaty }
  - { pl: "bogacz", ru: "богач", relation: derived }
  - { pl: "wzbogacić", ru: "обогатить", relation: derived }
etymology: "От BOGATY «богатый», праславянского слова от корня BÓG в старом значении «доля, достаток»: богатый — «тот, у кого есть доля». Тот же корень в русских «богатый» и «убогий», то есть «лишённый доли»."
memory: "Bogactwo — богатство. Читается «бога́цтфо». Bogactwa naturalne — природные ресурсы. Dojść do bogactwa — разбогатеть. Opływać w bogactwa — купаться в роскоши. Bogacz — богач."
idioms:
  - { pl: "opływać w bogactwa", ru: "купаться в роскоши" }
  - { pl: "bogactwa naturalne", ru: "природные ресурсы" }
