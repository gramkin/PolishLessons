# review
id: zniechecony
format: 2
lemma: "zniechęcony"
rank: 2362
pos: adj
pron: { cyr: "знехэнцо́ны" }
senses:
  - id: discouraged
    ru: "обескураженный, павший духом"
    examples:
      - pl: "Byłem zniechęcony."
        ru: "Я был обескуражен."
        source: { kind: translated, id: 8730337 }
      - pl: "Tom i Mary są zniechęceni."
        ru: "Том и Мэри обескуражены."
        source: { kind: translated, id: 12053396 }
      - pl: "Pomyśl o sukcesach osiągniętych przez zmęczonych, zniechęconych ludzi, którzy zdecydowali, że spróbują jeszcze jeden raz."
        ru: "Подумай об успехах усталых, павших духом людей, которые решили попробовать ещё раз."
        source: { kind: translated, id: 1481977 }
  - id: put-off
    ru: "утративший охоту, разочарованный"
    examples:
      - pl: "Wrócił zniechęcony do domu."
        ru: "Он вернулся домой разочарованным."
        source: { kind: authored }
      - pl: "Była zniechęcona całą sprawą."
        ru: "Она утратила интерес ко всему делу."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Это застывшее прилагательное со своим склонением, а не просто форма глагола: zniechęcony, zniechęcona, zniechęceni." }
  - { kind: false-friend, text: "Причастие от zniechęcić «отбить охоту», корень chęć «желание, охота». Буквально «лишённый охоты» — русское «обескураженный» говорит о другом образе, о потере куража." }
  - { kind: government, text: "Чем — ТВОРИТЕЛЬНЫЙ падеж: zniechęcony niepowodzeniem «павший духом от неудачи»." }
  - { kind: usage, text: "Противоположность — zachęcony «воодушевлённый», от zachęcić «побудить». Пара chęć/niechęć «охота/неохота» стоит того, чтобы её запомнить." }
collocations:
  - { pl: "zniechęcony niepowodzeniem", ru: "павший духом от неудачи" }
etymology: "Причастие от zniechęcić «отбить охоту», корень chęć «желание, охота»."
memory: "zniechęcony — «павший духом», буквально «лишённый охоты»: корень chęć. Чем именно — творительный падеж. Противоположность — zachęcony."
idioms:
  - { pl: "zniechęcony niepowodzeniem", ru: "павший духом от неудачи" }
