senses:
  - id: dig-over
    ru: "вскопать, перекопать"
    examples:
      - pl: "Skopali grządki przed sadzeniem."
        ru: "Они вскопали грядки перед посадкой."
        source: { kind: authored }
      - pl: "Skop ten kawałek, posadzimy maliny."
        ru: "Вскопай этот участок, посадим малину."
        source: { kind: authored }
      - pl: "Ogród skopano jeszcze w marcu."
        ru: "Огород вскопали ещё в марте."
        source: { kind: authored }
  - id: kick-in
    ru: "избить ногами (разг., грубо)"
    examples:
      - pl: "Skopali go pod blokiem."
        ru: "Его избили ногами у дома."
        source: { kind: authored }
      - pl: "Skopany leżał na trawie do rana."
        ru: "Избитый, он лежал на траве до утра."
        source: { kind: authored }
notes:
  - { kind: register, text: "Два значения этого глагола отстоят друг от друга далеко, и второе требует осторожности. Первое совершенно нейтральное и садовое: SKOPAĆ GRZĄDKI, SKOPAĆ OGRÓD — «вскопать грядки, перекопать огород». Второе разговорное и грубое, о драке: SKOPAĆ KOGOŚ значит «избить ногами», и в нейтральной речи ему места нет. Нейтральные замены для второго смысла — POBIĆ «побить», ZAATAKOWAĆ «напасть». Различает всё дополнение: земля или человек." }
  - { kind: usage, text: "Оба смысла растут из одного корня, уже разобранного в карточке WYKOPAĆ: KOPAĆ в польском значит и «копать», и «пинать», тогда как русский делит это на два слова. Поэтому у приставочных глаголов обе ветки живут рядом: WYKOPAĆ — «выкопать» и разговорное «выгнать», SKOPAĆ — «вскопать» и грубое «запинать». Запомнив двойственность корня, оба значения перестают удивлять." }
  - { kind: pronunciation, text: "Губной согласный смягчается перед гласными переднего ряда, и это видно по всему настоящему времени: SKOPIĘ, SKOPIESZ, SKOPIE, SKOPIEMY, SKOPIECIE, SKOPIĄ — везде pi. А в инфинитиве, прошедшем и причастии стоит твёрдое p: SKOPAĆ, SKOPAŁ, SKOPANY. Та же мена, что у WYKOPAĆ при WYKOPIĘ и POGRZEBAĆ при POGRZEBIĘ, и касается она всех губных: p, b, m, w, f." }
  - { kind: government, text: "Переходный, винительный: SKOPAĆ COŚ или KOGOŚ — skopać grządki, skopać ogród, а в грубом значении skopać człowieka. Повелительное SKOP выходит из третьего лица SKOPIE отбрасыванием -ie, и основа SKOP- польское слово закончить может, поэтому никакого -ij не вставляется — тот же случай, что POGRZEB при POGRZEBIE. Несовершенной пары в обычном смысле нет: KOPAĆ значит просто «копать», а приставка s- добавляет завершённость и охват всей площади." }
collocations:
  - { pl: "skopać grządki", ru: "вскопать грядки" }
  - { pl: "skopać ogród", ru: "перекопать огород" }
  - { pl: "skopać kogoś", ru: "избить кого-либо ногами" }
family:
  - { pl: "kopać", ru: "копать, пинать", relation: root, id: kopac }
  - { pl: "wykopać", ru: "выкопать", relation: root, id: wykopac }
  - { pl: "skopanie", ru: "вскапывание", relation: derived }
etymology: "Приставка s- и KOPAĆ «копать», из праславянского *kopati — то же слово, что русское «копать». Приставка даёт здесь охват всей площади и завершённость, как в русском «вскопать» или «перекопать». Второе, грубое значение идёт от той ветки корня, которая в польском значит «пинать», а в русском отсутствует вовсе. Из гнезда вышли WYKOP «котлован», KOPALNIA «шахта», KOPIEC «курган», OKOP «окоп», KOPYTO «копыто»."
memory: "От kopać, у которого в польском два смысла: копать и пинать. Отсюда и skopać — «вскопать» про грядки, но грубое «запинать» про человека."
idioms:
  - { pl: "skopać grządki", ru: "вскопать грядки" }
  - { pl: "skopać komuś tyłek", ru: "надрать кому-либо задницу" }
