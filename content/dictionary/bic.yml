# review
id: bic
format: 2
lemma: "bić"
rank: 1097
pos: verb
aspect: imperf
pron: { cyr: "биць" }
senses:
  - id: hit
    ru: "бить, ударять"
    examples:
      - pl: "Przestań mnie bić!"
        ru: "Перестань меня бить!"
        source: { kind: translated, id: 3285525 }
      - pl: "Bił swoje dzieci."
        ru: "Он бил своих детей."
        source: { kind: tatoeba, id: 3464135 }
      - pl: "Nie bij mnie."
        ru: "Не бей меня."
        source: { kind: translated, id: 7680859 }
  - id: beat
    ru: "биться (о сердце), бить (о часах, колоколах)"
    examples:
      - pl: "Serce bije."
        ru: "Сердце бьется."
        source: { kind: tatoeba, id: 9671815 }
      - pl: "Moje serce bije tylko dla ciebie."
        ru: "Моё сердце бьётся только для тебя."
        source: { kind: tatoeba, id: 6689574 }
      - pl: "Zegar bije czwartą."
        ru: "Часы бьют четыре."
        source: { kind: translated, id: 909166 }
  - id: applaud
    ru: "bić brawo — аплодировать"
    examples:
      - pl: "Wszyscy bili brawo."
        ru: "Все аплодировали."
        source: { kind: translated, id: 8617326 }
      - pl: "Bili brawo."
        ru: "Они аплодировали."
        source: { kind: translated, id: 12053346 }
  - id: whipped
    ru: "bita śmietana — взбитые сливки; bity — битый"
    examples:
      - pl: "Deser zrobiony był z bitej śmietany."
        ru: "Десерт был сделан из взбитых сливок."
        source: { kind: translated, id: 840205 }
      - pl: "Czekałem bite trzy godziny."
        ru: "Я ждал битых три часа."
        source: { kind: translated, id: 367746 }
notes:
  - { kind: usage, text: "Глагол покрывает весь диапазон русского «бить»: бить человека, бьётся сердце, бьют часы и колокола." }
  - { kind: usage, text: "bić brawo значит «аплодировать» — буквально «бить браво». Одного слова вроде русского «аплодировать» в разговорной речи почти не используют." }
  - { kind: usage, text: "bita śmietana — «взбитые сливки», а bita godzina — «битый час». Причастие bity живёт в обоих оборотах." }
  - { kind: government, text: "bić kogoś — винительный падеж, как в русском. А bić się значит «драться»: Nie bij się! «Не дерись!»." }
collocations:
  - { pl: "bić brawo", ru: "аплодировать" }
  - { pl: "bita śmietana", ru: "взбитые сливки" }
  - { pl: "bić rekord", ru: "бить рекорд" }
  - { pl: "bić się", ru: "драться" }
family:
  - { pl: "zbić", ru: "разбить, побить", relation: derived }
  - { pl: "bitwa", ru: "битва", relation: derived }
  - { pl: "bójka", ru: "драка", relation: derived }
etymology: "Праславянское *biti — то же слово, что русское «бить», и без изменений в значении."
memory: "bić — «бить» во всех смыслах русского глагола: бить человека, бьётся сердце, бьют часы. Плюс два оборота, которых по-русски буквально нет: bić brawo «аплодировать» и bita śmietana «взбитые сливки»."
idioms:
  - { pl: "bić brawo", ru: "аплодировать" }
  - { pl: "bić rekord", ru: "бить рекорд" }
  - { pl: "bić się z myślami", ru: "терзаться сомнениями" }
