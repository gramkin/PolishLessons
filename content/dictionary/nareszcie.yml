etymology: "Сращение предлога na с формой слова reszta «остаток», то есть буквально «на остаток, под конец». Reszta пришла из латинского restare «оставаться» через немецкий. Русское «наконец» собрано по той же модели, но из своего материала — от «конца»."
memory: "nareszcie — «НАКОНЕЦ-ТО», с чувством: облегчение или нетерпение. Нейтральное «наконец» в перечислении — это wreszcie. Не изменяется, стоит в начале фразы, часто с no: no nareszcie!"
