notes:
  - { kind: false-friend, text: "ОТЛИЧИЕ ОТ WRESZCIE — В ЧУВСТВЕ, А НЕ В ЗНАЧЕНИИ. Оба слова значат «наконец», но nareszcie всегда окрашено: это облегчение или нетерпение, русское «НАКОНЕЦ-ТО». Wreszcie нейтрально и годится в перечислении: po pierwsze, po drugie, wreszcie po trzecie. Сказать «wreszcie jesteś» можно, но прозвучит холоднее." }
  - { kind: usage, text: "Слово не изменяется и обычно стоит в начале фразы, часто с усилителем no: no nareszcie. В перечислениях его не употребляют — там только wreszcie или w końcu. Выражение w końcu двузначно: и «наконец», и «в конце концов, всё-таки»." }
  - { kind: pronunciation, text: "Четыре слога, ударение на предпоследнем: na-RESZ-cie. Sz читается как ш, ci как ць: «нарэ́щче». В восклицании первый слог часто растягивают: «на-арэ́щче»." }
  - { kind: register, text: "Разговорно-нейтрально. В деловом письме вместо него напишут wreszcie или ostatecznie. Восклицательный знак при nareszcie почти обязателен: само слово уже несёт интонацию." }
collocations:
