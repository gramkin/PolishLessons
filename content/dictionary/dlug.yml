# review
id: dlug
format: 2
lemma: "dług"
rank: 1971
pos: noun
pron: { cyr: "дуук" }
senses:
  - id: debt
    ru: "долг (денежный)"
    examples:
      - pl: "Oddam dług jak najszybciej."
        ru: "Я верну долг как можно скорее."
        source: { kind: translated, id: 363530 }
      - pl: "Jak ja mam spłacić taki dług?"
        ru: "Как мне выплатить такой долг?"
        source: { kind: translated, id: 933093 }
      - pl: "Jego dług wzrósł do 100 dolarów."
        ru: "Его долг вырос до ста долларов."
        source: { kind: translated, id: 355251 }
      - pl: "Zażądał spłaty długu."
        ru: "Он потребовал выплаты долга."
        source: { kind: translated, id: 3082002 }
      - pl: "Nie zwrócił długu i znikł."
        ru: "Он не вернул долг и исчез."
        source: { kind: translated, id: 948193 }
      - pl: "Uzyskał umorzenie długu."
        ru: "Он добился списания долга."
        source: { kind: translated, id: 364772 }
  - id: in-debt
    ru: "в долгах (tonąć w długach)"
    examples:
      - pl: "Tonie po uszy w długach."
        ru: "Он по уши в долгах."
        source: { kind: translated, id: 364164 }
      - pl: "Tonął w długach i musiał opuścić swój dom."
        ru: "Он тонул в долгах и был вынужден покинуть свой дом."
        source: { kind: translated, id: 3081977 }
      - pl: "Tom nie chciał, żeby ktokolwiek wiedział, że tonie w długach."
        ru: "Том не хотел, чтобы кто-нибудь знал, что он тонет в долгах."
        source: { kind: translated, id: 3051411 }
notes:
  - { kind: false-friend, text: "Осторожно с формой długi: чаще всего это прилагательное «длинный» (карточка długi), а не множественное число от dług. Mam długi значит «У меня долги», но Słoń ma długi nos — «У слона длинный нос»." }
  - { kind: usage, text: "Тонуть в долгах — tonąć w długach, буквально то же, что по-русски: siedzieć po uszy w długach «сидеть по уши в долгах»." }
  - { kind: usage, text: "Второе значение — моральный долг: dług wdzięczności «долг благодарности»." }
collocations:
  - { pl: "spłacić dług", ru: "выплатить долг" }
  - { pl: "tonąć w długach", ru: "тонуть в долгах" }
  - { pl: "dług wdzięczności", ru: "долг благодарности" }
etymology: "Праславянское *dlъgъ. Русский «долг» — то же самое слово; польское ł здесь читается как «у», поэтому dług звучит примерно как «дуук»."
memory: "dług — «долг». Главная ловушка: форма długi чаще значит «длинный» (прилагательное), и только в контексте денег — «долги»: Mam długi."
idioms:
  - { pl: "spłacić dług", ru: "выплатить долг" }
  - { pl: "tonąć w długach", ru: "тонуть в долгах" }
  - { pl: "dług wdzięczności", ru: "долг благодарности" }
