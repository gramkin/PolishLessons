notes:
  - { kind: false-friend, text: "KATEGORIA — «категория», как в русском. Водительские права — PRAWO JAZDY KATEGORII B. Категорический — KATEGORYCZNY: KATEGORYCZNIE ODMÓWIŁ, «категорически отказался»." }
  - { kind: usage, text: "Женский род. Родительный, дательный и местный — KATEGORII. Множественное — KATEGORIE. Звательный и архаичное KATEGORYJ не используем." }
