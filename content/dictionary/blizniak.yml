notes:
  - { kind: false-friend, text: "Второе значение русскому в голову не придёт, а в объявлениях о недвижимости оно главное. BLIŹNIAK — это дом на две семьи с общей стеной, по-русски «дом на два хозяина» или «таунхаус на две секции». Фраза SPRZEDAM BLIŹNIAKA в газете значит именно это, а не продажу человека. Отличить легко по контексту и по падежу: о доме говорят KUPIĆ BLIŹNIAK, о человеке KUPIĆ нельзя вовсе, зато POZNAĆ BLIŹNIAKA, с винительным как у одушевлённых." }
  - { kind: usage, text: "Одиннадцать форм, мужской род. Как и PRZEWODNIK, слово двоится по одушевлённости: о людях множественное BLIŹNIACY, с чередованием K в C, о домах BLIŹNIAKI. Родительный множественного общий, BLIŹNIAKÓW. В единственном числе о человеке винительный совпадает с родительным, BLIŹNIAKA, а о доме с именительным, BLIŹNIAK, и это самый надёжный признак, какое из двух значений имеется в виду." }
  - { kind: government, text: "Чей близнец — родительный без предлога: BLIŹNIAK BRATA. Жить в доме на две семьи — MIESZKAĆ W BLIŹNIAKU, предлог W с местным падежом. Прилагательное того же корня, BLIŹNIACZY, значит «близнецовый, парный»: BLIŹNIACZE WIEŻE «башни-близнецы», SIOSTRA BLIŹNIACZKA «сестра-близнец». Женская пара к самому слову — BLIŹNIACZKA." }
  - { kind: pronunciation, text: "Читается «бли́зьняк», два слога, ударение на первом. Буква Ź с акутом даёт мягкое «зь», а не «ж» и не «з», и это главная трудность: нужно именно мягкое «зь», как в русском «зять». Сочетание NIA даёт «ня». В форме BLIŹNIACY слышно «бли́зьняцы», с твёрдым «ц». Не путать Ź с Ż: в BLIŹNIAK стоит Ź, мягкое, а в ŻONA «жона» твёрдое «ж»." }
  - { kind: register, text: "В значении «близнец» слово нейтральное и повседневное. В значении дома оно принадлежит языку объявлений и строительства: BLIŹNIAK, SZEREGOWIEC «секция в ряду» и WOLNOSTOJĄCY «отдельно стоящий дом» — три стандартные категории в любом объявлении о продаже. Знать их полезно всякому, кто ищет жильё в Польше. Астрологический знак Близнецов называется BLIŹNIĘTA, формой другого рода." }
