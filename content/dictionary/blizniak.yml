etymology: "От BLIŹNI «ближний», от праславянского корня, давшего и русское «близкий», и «ближний», и самого «близнеца». Образ прозрачен в обоих языках: близнецы это те, кто родились рядом, вплотную. Русское «близнец» и польское BLIŹNIAK собраны от одного корня разными суффиксами, но значат одно. Слово BLIŹNI живо в польском и в высоком смысле: евангельское MIŁUJ BLIŹNIEGO SWEGO это «возлюби ближнего своего». Значение дома на две семьи появилось в двадцатом веке, из образа двух одинаковых половин."
memory: "Корень общий с русским «близким» и «близнецом», от bliźni «ближний», как в miłuj bliźniego swego. Но второе значение неожиданное: bliźniak это ещё и дом на две семьи с общей стеной, и в объявлениях о жилье оно главное. Множественное двоится: bliźniacy о людях, bliźniaki о домах. Читается «бли́зьняк», где ź это мягкое «зь», как в русском «зять», а не «ж»."
