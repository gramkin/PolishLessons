# review
id: potrzeba
format: 2
lemma: "potrzeba"
rank: 667
pos: noun
pron: { cyr: "потшэ́ба" }
senses:
  - id: impersonal
    ru: "potrzeba komuś czegoś — кому-л. нужно чего-л."
    note: "Дательный лица плюс родительный вещи, как в brak mi czegoś."
    examples:
      - pl: "Czego jeszcze ci potrzeba?"
        ru: "Чего ещё тебе нужно?"
        source: { kind: tatoeba, id: 12700102 }
      - pl: "Potrzeba mu czasu, żeby dojść do siebie."
        ru: "Ему нужно время, чтобы прийти в себя."
        source: { kind: tatoeba, id: 6313913 }
      - pl: "Ile czasu potrzeba, żeby dojść do dworca?"
        ru: "Сколько времени нужно, чтобы дойти до вокзала?"
        source: { kind: tatoeba, id: 13106670 }
  - id: need-noun
    ru: "потребность, нужда"
    examples:
      - pl: "Mają potrzeby."
        ru: "У них есть потребности."
        source: { kind: translated, id: 6602805 }
      - pl: "Od kilku dni czuję potrzebę napisania do ciebie."
        ru: "Вот уже несколько дней я чувствую потребность написать тебе."
        source: { kind: tatoeba, id: 2987725 }
      - pl: "Podkreślił potrzebę podjęcia natychmiastowych działań."
        ru: "Он подчеркнул необходимость немедленных действий."
        source: { kind: translated, id: 856164 }
  - id: no-need
    ru: "nie ma potrzeby — нет необходимости"
    note: "С инфинитивом: nie ma potrzeby przepraszać."
    examples:
      - pl: "Nie ma potrzeby przepraszać; ja rozumiem."
        ru: "Нет необходимости извиняться; я понимаю."
        source: { kind: tatoeba, id: 3457077 }
      - pl: "Nie ma potrzeby walczyć."
        ru: "Нет необходимости бороться."
        source: { kind: translated, id: 4953197 }
      - pl: "Nie ma potrzeby się spieszyć."
        ru: "Нет необходимости спешить."
        source: { kind: authored }
  - id: in-need
    ru: "w potrzebie — в нужде, в беде"
    examples:
      - pl: "Chcemy pomóc ludziom, którzy są w potrzebie."
        ru: "Мы хотим помогать людям, нуждающимся в помощи."
        source: { kind: tatoeba, id: 13783091 }
      - pl: "Tom jest w potrzebie."
        ru: "Том в беде."
        source: { kind: translated, id: 8764585 }
      - pl: "Czy ktoś wyciągnie rękę, jak będę w potrzebie?"
        ru: "Протянет ли кто-нибудь руку, когда я буду в беде?"
        source: { kind: translated, id: 12955856 }
notes:
  - { kind: government, text: "Безличный оборот: potrzeba плюс дательный лица плюс родительный вещи. Potrzeba mu czasu «Ему нужно время», Czego ci potrzeba? «Что тебе нужно?». Устроен точно так же, как brak mi czegoś." }
  - { kind: usage, text: "Оборот nie ma potrzeby плюс инфинитив значит «нет необходимости»: Nie ma potrzeby przepraszać «Извиняться не нужно»." }
  - { kind: usage, text: "w potrzebie значит «в нужде, в беде»: pomagać ludziom w potrzebie «помогать нуждающимся». А w razie potrzeby — «в случае необходимости»." }
  - { kind: usage, text: "Семья уже знакома по другим карточкам: прилагательное potrzebny «нужный» (potrzebny mi lek) и глагол potrzebować «нуждаться», который требует родительного." }
collocations:
  - { pl: "Nie ma potrzeby", ru: "Нет необходимости" }
  - { pl: "w razie potrzeby", ru: "в случае необходимости" }
  - { pl: "w potrzebie", ru: "в нужде" }
  - { pl: "czego ci potrzeba?", ru: "что тебе нужно?" }
family:
  - { pl: "potrzebny", ru: "нужный", relation: derived }
  - { pl: "potrzebować", ru: "нуждаться", relation: derived }
  - { pl: "niepotrzebny", ru: "ненужный", relation: derived }
etymology: "Праславянское *po-trěba — то же гнездо, что русские «потреба», «потребность» и «требовать»."
memory: "potrzeba работает двояко, и оба употребления надо держать вместе. Как существительное это «потребность, нужда»: mają potrzeby, pomagać ludziom w potrzebie. А как безличное слово — «нужно»: potrzeba плюс дательный и родительный, Potrzeba mu czasu «Ему нужно время», Czego ci potrzeba? Оборот устроен ровно как brak mi czegoś. Рядом стоят potrzebny «нужный» и potrzebować «нуждаться»."
idioms:
  - { pl: "Nie ma potrzeby", ru: "Нет необходимости" }
  - { pl: "w razie potrzeby", ru: "в случае необходимости" }
  - { pl: "w potrzebie", ru: "в нужде" }
formExamplesSkip:
  - { form: "potrzebo", reason: "звательный падеж отвлечённого существительного: по-польски к нужде не обращаются, форма остаётся только в таблице" }
