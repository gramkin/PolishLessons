etymology: "Из позднелатинского PERSPECTIVA, от PERSPICERE «смотреть сквозь, разглядывать», сложенного из PER «сквозь» и SPECERE «смотреть». Первоначально это был термин оптики и геометрии: искусство изображать трёхмерное на плоскости, то есть смотреть сквозь плоскость картины. Из живописи слово перешло в переносное употребление — вид на будущее, — и оба наших языка проделали этот путь одновременно, взяв слово через французский в восемнадцатом веке. Поэтому значения совпадают, и расходятся только устойчивые обороты. От того же SPECERE происходят SPEKTAKL «спектакль», INSPEKCJA «инспекция» и RESPEKT, а от PER — PERFEKCJA и PERMANENTNY; корень «смотрения» в них лежит на виду."
memory: "Слово безопасно, обороты нет: z perspektywy czasu — «спустя время, оглядываясь назад», w perspektywie plus родительный — «в перспективе», z mojej perspektywy — «с моей точки зрения». Родительный множественного perspektyw, нулевой, без второго варианта — в отличие от akademii/akademij и rewolucji/rewolucyj. Оба e читаются «э»: «пэрспэкты́ва»."
