notes:
  - { kind: false-friend, text: "Значение совпадает с русским, и слово безопасно, но два оборота стоит знать отдельно, потому что по-русски они строятся иначе. Z PERSPEKTYWY CZASU значит «спустя время, оглядываясь назад»; дословное «с перспективы времени» по-русски не говорят, и переводить надо оборотом. W PERSPEKTYWIE плюс родительный значит «в течение, на горизонте»: W PERSPEKTYWIE DWÓCH LAT «в перспективе двух лет». Третье: Z MOJEJ PERSPEKTYWY значит «с моей точки зрения», и здесь польский предпочитает PERSPEKTYWA там, где русский скажет «точка зрения» или «позиция». Прилагательное PERSPEKTYWICZNY значит и «перспективный» о планах, и «перспективный» в рисовании." }
  - { kind: usage, text: "Родительный множественного — PERSPEKTYW, с нулевым окончанием и без вставной гласной, потому что группа TW на конце выговаривается легко. Это стоит сравнить с двумя соседями по карточке: у AKADEMIA и REWOLUCJA родительный множественного совпадает с формой на -I и имеет ещё архаичный вариант на -IJ или -YJ, а у PERSPEKTYWA никакого второго варианта нет вовсе. Дательный и местный единственного — PERSPEKTYWIE, с обычным смягчением W перед -IE. Форма PERSPEKTYWY покрывает родительный единственного вместе с именительным и винительным множественного." }
  - { kind: government, text: "Женский род. Чего перспектива — родительный: PERSPEKTYWA AWANSU, PERSPEKTYWA ZMIAN. «В перспективе» — предлог W с местным: W PERSPEKTYWIE. «С позиции» — Z с родительным: Z PERSPEKTYWY CZASU, Z PERSPEKTYWY UCZNIA. Частотные сочетания: MIEĆ PERSPEKTYWY «иметь перспективы», BEZ PERSPEKTYW «без перспектив», OTWIERAĆ PERSPEKTYWY «открывать перспективы». В живописи: PERSPEKTYWA ZBIEŻNA «сходящаяся перспектива», ZABURZONA PERSPEKTYWA «нарушенная перспектива»." }
  - { kind: pronunciation, text: "Читается «пэрспэкты́ва», четыре слога, ударение на предпоследнем. Оба E дают «э» без смягчения предшествующего согласного, поэтому слово звучит «пэрспэ», а не «перспе». Буква Y даёт «ы». Группа RSP выговаривается слитно, без вставных гласных. В дательном и местном PERSPEKTYWIE сочетание WIE даёт мягкое «ве»: «пэрспэкты́ве». В родительном множественного PERSPEKTYW конечное W оглушается до «ф»: «пэрспэ́ктыф»." }
