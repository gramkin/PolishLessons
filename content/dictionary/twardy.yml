# review
id: twardy
format: 2
lemma: "twardy"
rank: 1384
pos: adj
pron: { cyr: "тва́рды" }
senses:
  - id: hard
    ru: "твёрдый, жёсткий (на ощупь)"
    examples:
      - pl: "Żelazo jest twarde."
        ru: "Железо твёрдое."
        source: { kind: translated, id: 6672598 }
      - pl: "To mięso jest twarde."
        ru: "Это мясо жёсткое."
        source: { kind: translated, id: 734263 }
      - pl: "Diament jest z natury twardy."
        ru: "Алмаз по природе твёрдый."
        source: { kind: translated, id: 907944 }
  - id: tough-person
    ru: "крепкий, несгибаемый (о человеке)"
    examples:
      - pl: "Jestem twardy."
        ru: "Я крепкий."
        source: { kind: translated, id: 5662115 }
      - pl: "Bądź twardy jak skała."
        ru: "Будь твёрд как скала."
        source: { kind: translated, id: 10558509 }
      - pl: "To twarda sztuka."
        ru: "Это крепкий орешек."
        source: { kind: translated, id: 13657564 }
  - id: comparative
    ru: "твёрже, крепче (сравнительная степень)"
    examples:
      - pl: "Żelazo jest twardsze niż złoto."
        ru: "Железо твёрже золота."
        source: { kind: tatoeba, id: 7757317 }
      - pl: "Nie ma rzeczy twardszej od diamentu."
        ru: "Нет ничего твёрже алмаза."
        source: { kind: translated, id: 842069 }
      - pl: "Życie jest twarde, ale jestem twardszy."
        ru: "Жизнь трудна, но я крепче."
        source: { kind: translated, id: 369707 }
notes:
  - { kind: usage, text: "Прилагательное покрывает и «твёрдый» (о веществе), и «жёсткий» (о мясе, кровати), и «крепкий, несгибаемый» (о человеке)." }
  - { kind: usage, text: "dysk twardy — «жёсткий диск»; порядок слов в этом термине обычно именно такой." }
  - { kind: usage, text: "Сравнительная степень — twardszy, превосходная — najtwardszy; в корпусе превосходная не встречается ни разу." }
  - { kind: usage, text: "В фонетике тоже twardy: spółgłoska twarda «твёрдый согласный», в противоположность miękka «мягкий»." }
collocations:
  - { pl: "dysk twardy", ru: "жёсткий диск" }
  - { pl: "twardy orzech do zgryzienia", ru: "крепкий орешек" }
  - { pl: "twarda sztuka", ru: "крепкий малый" }
etymology: "Праславянское *tvьrdъ — то же слово, что русское «твёрдый». Соответствие регулярное: польское tw- отвечает русскому «тв-»."
memory: "twardy = «твёрдый», родство с русским прямое. Но значение шире: twarde mięso «жёсткое мясо», twardy człowiek «крепкий человек», dysk twardy «жёсткий диск». Сравнительная степень — twardszy."
idioms:
  - { pl: "twardy orzech do zgryzienia", ru: "крепкий орешек" }
  - { pl: "twarda sztuka", ru: "крепкий малый" }
  - { pl: "dysk twardy", ru: "жёсткий диск" }
