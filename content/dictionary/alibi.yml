notes:
  - { kind: usage, text: "Форма одна на все четырнадцать падежных мест, и это предел того, что в польском вообще бывает. Словарь даёт слову и единственное, и множественное число, и все семь падежей в каждом, а написание не меняется ни разу: TO ALIBI, TEGO ALIBI, TYM ALIBI, DWA ALIBI, BEZ ALIBI. Для сравнения: у MYŚL шесть форм на те же четырнадцать мест, у OSOBOWOŚĆ тоже шесть, а здесь одна. Падеж целиком несут согласуемое слово и предлог, само существительное не помогает ничем." }
  - { kind: usage, text: "Какие заимствования остаются неизменяемыми, можно предсказать по окончанию. У польского нет своего образца склонения для слов на -i и -u, поэтому ALIBI, MENU, TAXI и JURY застывают целиком. А окончания -o и -a попадают в готовые образцы, и такие слова язык присваивает: RADIO склоняется полностью — radia, radiu, radiem, radiów. Русский поступает точно так же и по той же причине, так что «алиби» и «меню» не склоняются и у него." }
  - { kind: usage, text: "Род средний: TO ALIBI, MOJE ALIBI, ŻELAZNE ALIBI. Так в польском ведут себя почти все неизменяемые заимствования, и русский с ним здесь согласен. Поскольку само слово о падеже не говорит, вся грамматика фразы ложится на определение: по WIARYGODNEGO ALIBI видно, что это родительный, а по WIARYGODNYM ALIBI — что творительный или местный." }
collocations:
  - { pl: "mieć alibi", ru: "иметь алиби" }
  - { pl: "żelazne alibi", ru: "железное алиби" }
  - { pl: "potwierdzić alibi", ru: "подтвердить алиби" }
etymology: "Из латинского ALIBI «в другом месте», сложенного из alius «другой» и ibi «там». В языке права это слово значило ссылку обвиняемого на то, что он был в другом месте, и в таком виде вошло во все европейские языки. Русский взял его тем же путём и через ту же юридическую латынь, и оба языка оставили его неизменяемым, потому что ни в польском, ни в русском нет образца для существительных на -и."
memory: "Одна форма на все падежи: to alibi, tego alibi, dwa alibi. Падеж виден только по согласуемому слову. Не склоняются слова на -i и -u, а на -o склоняются: radio."
