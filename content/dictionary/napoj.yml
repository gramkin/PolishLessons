notes:
  - { kind: pronunciation, text: "Буква ó стоит только в именительном и винительном — NAPÓJ, — а во всех остальных формах на её месте обычное o: NAPOJU, NAPOJEM, NAPOJE, NAPOJÓW. Это ó позиционное: оно сидит в закрытом конечном слоге и уходит, едва слог откроется. Проверка та же, что в карточке RÓŻOWY: посмотрите на косвенные формы. Если ó держится везде, как в różowego и omówi, оно корневое; если сменилось на o, как здесь и как в WZÓR — WZORU, оно появилось от закрытия слога." }
  - { kind: usage, text: "Родительный множественного имеет два вида: NAPOI и NAPOJÓW. Это третий такой дублет после bagaży/bagażów и ochroniarzy/ochroniarzów, и он подтверждает поправку, сделанную в карточке GROSZ: дублет не свойство разряда, а свойство отдельного слова. У grosz при такой же мягкой основе форма одна, у napój их две. Из двух здесь употребительнее NAPOJÓW, а NAPOI звучит старее." }
  - { kind: usage, text: "Форма NAPOJU работает за три падежа сразу — родительный, местный и звательный, — как PLIKU из партии 223. Корень же прозрачен: NAPÓJ от NAPIĆ SIĘ «напиться», а то от PIĆ «пить», из праславянского *piti. Русское «напиток» построено от того же корня и той же приставки, только с другим суффиксом, так что слово узнаётся сразу, несмотря на несовпадение концовки." }
collocations:
  - { pl: "napój gazowany", ru: "газированный напиток" }
  - { pl: "napój energetyczny", ru: "энергетический напиток" }
  - { pl: "napoje bezalkoholowe", ru: "безалкогольные напитки" }
family:
  - { pl: "pić", ru: "пить", relation: root, id: pic }
  - { pl: "picie", ru: "питьё", relation: derived }
etymology: "От NAPIĆ SIĘ «напиться», приставочного к PIĆ «пить», из праславянского *piti — того же корня, что русские «пить», «напиток» и «напиться», в родстве с латинским bibere. Русский и польский собрали название напитка из одних и тех же частей, приставки na- и корня pi-, и разошлись только в суффиксе: русский взял -ток, польский обошёлся без суффикса вовсе, оставив napój с позиционным ó."
memory: "ó только в napój; откроется слог — станет o: napoju, napoje. Как wzór/wzoru. Родительный множественного двойной: napojów употребительнее, napoi старее."
idioms:
  - { pl: "napój chłodzący", ru: "прохладительный напиток" }
  - { pl: "napoje wyskokowe", ru: "спиртные напитки" }
