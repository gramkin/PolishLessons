        source: { kind: authored }
  - id: authority
    ru: "орган (власти, учреждение)"
    examples:
      - pl: "Sejm jest organem władzy ustawodawczej."
        ru: "Сейм — орган законодательной власти."
        source: { kind: authored }
      - pl: "Organa państwa muszą działać zgodnie z prawem."
        ru: "Органы государства должны действовать по закону."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ORGAN — «орган» тела и власти. Но музыкальный «орган» — ORGANY, только во множественном: GRAĆ NA ORGANACH. Во множественном о государственных органах книжно — ORGANA, о частях тела — ORGANY." }
  - { kind: usage, text: "Мужской род, неодушевлённое. Родительный — ORGANU. Два множественных: ORGANY (тело, инструмент) и ORGANA (учреждения, книжн.). В местном N смягчается: W ORGANIE." }
  - { kind: government, text: "Пересадка органов — PRZESZCZEP ORGANÓW, родительный. Орган власти — ORGAN WŁADZY. Донор органов — DAWCA ORGANÓW." }
  - { kind: pronunciation, text: "Читается «о́рган», ударение на первом слоге, как в русском анатомическом слове." }
collocations:
  - { pl: "przeszczep organów", ru: "пересадка органов" }
  - { pl: "organ władzy", ru: "орган власти" }
  - { pl: "dawca organów", ru: "донор органов" }
family:
  - { pl: "ciało", ru: "тело", relation: root, id: cialo }
  - { pl: "narząd", ru: "орган (анат.)", relation: root }
  - { pl: "organy", ru: "орган (муз. инструмент)", relation: root }
etymology: "Из греческого ORGANON «орудие, инструмент». Отсюда и анатомический орган, и музыкальный инструмент ORGANY."
memory: "Organ — орган тела и власти; музыкальный орган — organy (мн.). Przeszczep organów — пересадка органов. Читается «о́рган»."
idioms:
