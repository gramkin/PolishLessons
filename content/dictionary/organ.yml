pron: { cyr: "о́рган" }
senses:
  - id: organ
    ru: "орган (тела)"
    examples:
      - pl: "Serce to najważniejszy organ."
        ru: "Сердце — важнейший орган."
        source: { kind: authored }
      - pl: "Przeszczep organów ratuje życie."
        ru: "Пересадка органов спасает жизнь."
