# review
id: biblioteka
format: 2
lemma: "biblioteka"
rank: 2428
pos: noun
pron: { cyr: "бібліотэ́ка" }
senses:
  - id: library
    ru: "библиотека (учреждение)"
    examples:
      - pl: "Biblioteka jest otwarta do osiemnastej."
        ru: "Библиотека открыта до шести."
        source: { kind: authored }
      - pl: "Spotkajmy się w bibliotece."
        ru: "Встретимся в библиотеке."
        source: { kind: authored }
  - id: collection
    ru: "библиотека (собрание книг)"
    examples:
      - pl: "Odziedziczył po ojcu sporą bibliotekę."
        ru: "Он унаследовал от отца изрядную библиотеку."
        source: { kind: authored }
      - pl: "Zbiory biblioteki liczą sto tysięcy tomów."
        ru: "Фонды библиотеки насчитывают сто тысяч томов."
        source: { kind: authored }
  - id: series
    ru: "библиотека (книжная серия)"
    examples:
      - pl: "Tom ukazał się w bibliotece klasyków."
        ru: "Том вышел в библиотеке классиков."
        source: { kind: authored }
notes:
  - { kind: usage, text: "ЕЩЁ ОДНО k, КОТОРОЕ ПЕРЕД -E ПРЕВРАЩАЕТСЯ В c. Дательный и предложный — BIBLIOTECE, а не bibliotek-e: w bibliotece, dzięki bibliotece. Так же ведут себя polityka → polityce, walizka → walizce, porażka → porażce. Русский в «в библиотеке» тоже смягчает, но буква остаётся к, и это сбивает." }
  - { kind: pronunciation, text: "Пять слогов, ударение на предпоследнем: bi-blio-TE-ka. Польское i перед гласной не образует отдельного слога целиком, а смягчает: «бі-бліо-тэ́-ка». Родительный множественного — bibliotek, с нулевым окончанием." }
  - { kind: register, text: "Работник библиотеки — bibliotekarz, женщина bibliotekarka. Читательский билет называется karta biblioteczna. Глагол «брать книгу в библиотеке» — wypożyczyć, а «сдавать» — oddać, не zwrócić, хотя и так поймут." }
collocations:
  - { pl: "biblioteka miejska", ru: "городская библиотека" }
  - { pl: "w bibliotece", ru: "в библиотеке" }
  - { pl: "karta biblioteczna", ru: "читательский билет" }
family:
  - { pl: "bibliotekarz", ru: "библиотекарь", relation: derived }
  - { pl: "księgarnia", ru: "книжный магазин", relation: root }
  - { pl: "książka", ru: "книга", relation: root, id: ksiazka }
etymology: "Из греческого bibliotheke, из biblion «книга» и theke «хранилище». То же слово дало русское «библиотека». Греческое biblion восходит к названию финикийского города Библ, через который в Грецию шёл папирус."
memory: "biblioteka — «библиотека», слово знакомое, но форма w BIBLIOTECE нет: перед -e k становится c, как в polityce и walizce. Родительный множественного — короткое bibliotek, без окончания."
idioms:
  - { pl: "mól książkowy w bibliotece", ru: "книжный червь в библиотеке" }
  - { pl: "cicho jak w bibliotece", ru: "тихо как в библиотеке" }
formExamplesSkip:
