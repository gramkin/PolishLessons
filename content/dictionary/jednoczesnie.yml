# review
id: jednoczesnie
format: 2
lemma: "jednocześnie"
rank: 2754
pos: adv
pron: { cyr: "едночэ́сьне" }
senses:
  - id: simultaneously
    ru: "одновременно"
    examples:
      - pl: "Nie można robić dwóch rzeczy jednocześnie."
        ru: "Нельзя делать два дела одновременно."
        source: { kind: authored }
      - pl: "Wszyscy zaczęli mówić jednocześnie."
        ru: "Все заговорили одновременно."
        source: { kind: authored }
      - pl: "Jednocześnie z listem przyszła paczka."
        ru: "Одновременно с письмом пришла посылка."
        source: { kind: authored }
  - id: at-the-same-time
    ru: "при этом, в то же время"
    examples:
      - pl: "Jest tani, a jednocześnie dobry."
        ru: "Он дешёвый и при этом хороший."
        source: { kind: authored }
      - pl: "Mówił cicho, jednocześnie patrząc w okno."
        ru: "Он говорил тихо, при этом глядя в окно."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Слово собрано из тех же двух понятий, что русское «одновременно»: JEDEN «один» и CZAS «время», через прилагательное JEDNOCZESNY. То есть перед вами не похожее слово, а то же самое, составленное из тех же частей в том же порядке. Такие совпадения в польском редки и их стоит замечать: учить здесь нечего, достаточно узнать состав." }
  - { kind: usage, text: "Форма одна, и степеней у наречия нет, хотя словарь помечает его как положительную степень: пометка отмечает место в системе, а не живую форму. У RÓWNOCZEŚNIE, ближайшего синонима, устройство такое же — RÓWNY «равный» плюс CZAS, то есть «в равное время». Польский держит два слова там, где русский обходится одним, и различаются они оттенком: równocześnie подчёркивает совпадение по времени, jednocześnie годится и для «при этом»." }
  - { kind: usage, text: "Второе употребление русскому неочевидно. JEDNOCZEŚNIE ставится там, где по-русски скажут «при этом» или «в то же время», и соединяет два свойства одного предмета: jest tani, a jednocześnie dobry. Здесь нет никакой одновременности во времени, речь о совмещении признаков. Переводить такое «одновременно» нельзя — выйдет бессмыслица." }
collocations:
