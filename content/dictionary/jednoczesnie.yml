etymology: "От прилагательного JEDNOCZESNY, сложенного из JEDEN «один» и CZAS «время», из праславянского *časъ — того же слова, что русский «час». Русское «одновременно» собрано из «одного» и «времени» тем же способом и в том же порядке. Разница только в том, какое слово для времени пошло в дело: польский взял czas, русский — «время», но оба получили одно и то же понятие."
memory: "Одна форма. Состав тот же, что в русском «одновременно»: jeden + czas. И второе значение — «при этом», а не про время."
idioms:
