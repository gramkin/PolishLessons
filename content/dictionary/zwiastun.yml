id: zwiastun
format: 2
lemma: "zwiastun"
rank: 2371
pos: noun
pron: { cyr: "звя́стун" }
senses:
  - id: harbinger
    ru: "предвестник, вестник"
    examples:
      - pl: "Jaskółka to zwiastun wiosny."
        ru: "Ласточка — предвестник весны."
        source: { kind: authored }
      - pl: "To zwiastun kłopotów."
        ru: "Это предвестник неприятностей."
        source: { kind: authored }
      - pl: "Pierwszy śnieg był zwiastunem zimy."
        ru: "Первый снег был предвестником зимы."
        source: { kind: authored }
  - id: trailer
    ru: "трейлер, анонс (фильма)"
    examples:
      - pl: "Obejrzałem zwiastun nowego filmu."
        ru: "Я посмотрел трейлер нового фильма."
        source: { kind: authored }
      - pl: "Zwiastun trwa dwie minuty."
        ru: "Трейлер длится две минуты."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Два разных употребления: книжное «предвестник» и современное «трейлер» кинофильма. Второе вытеснило первое в обиходе." }
  - { kind: false-friend, text: "От zwiastować «возвещать», корень wieść «весть». Русский «вестник» построен так же, от «вести»." }
  - { kind: government, text: "Мужской ЛИЧНЫЙ род в значении «вестник»: мн. zwiastunowie; о трейлере — неодушевлённый, мн. zwiastuny." }
  - { kind: usage, text: "Zwiastowanie с большой буквы — Благовещение. В корпусе слово не встречается, примеры составлены вручную." }
collocations:
