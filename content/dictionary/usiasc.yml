# review
id: usiasc
format: 2
lemma: "usiąść"
rank: 561
pos: verb
aspect: perf
pron: { cyr: "у́сёньсьць" }
senses:
  - id: sit-down
    ru: "сесть, усесться (занять сидячее место)"
    note: "Совершенный вид: «сесть», а не «сидеть». Сидеть — siedzieć."
    examples:
      - pl: "Proszę usiąść."
        ru: "Садитесь, пожалуйста."
        source: { kind: translated, id: 951399 }
      - pl: "Usiadł na ławce."
        ru: "Он сел на скамейку."
        source: { kind: translated, id: 363781 }
      - pl: "Usiadła przy niej."
        ru: "Она села рядом с ней."
        source: { kind: translated, id: 3632519 }
  - id: land
    ru: "сесть, приземлиться (о птице, самолёте)"
    examples:
      - pl: "Ptaki usiadły na gałęziach."
        ru: "Птицы сели на ветки."
        source: { kind: translated, id: 4151797 }
      - pl: "Samolot usiadł na pasie startowym."
        ru: "Самолёт сел на взлётную полосу."
        source: { kind: authored }
      - pl: "Motyl usiadł jej na dłoni."
        ru: "Бабочка села ей на ладонь."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Формы usiądę, usiądziesz, usiądzie выглядят как настоящее время, но это БУДУЩЕЕ: глагол совершенного вида настоящего времени не имеет. Usiądę tutaj — «Я сяду здесь», а не «сижу»." }
  - { kind: usage, text: "Различайте три глагола: siadać «садиться» (несов.), usiąść «сесть» (сов.), siedzieć «сидеть» (состояние). Usiądź! «Сядь!», но Siedź! «Сиди!»." }
  - { kind: usage, text: "Вежливое приглашение — Proszę usiąść «Садитесь, пожалуйста» или Niech pan usiądzie. В магазине и в гостях слышится постоянно." }
  - { kind: usage, text: "Отглагольное существительное usiądnięcie в живой речи практически не встречается; о самом действии говорят przysiadka или просто описательно." }
collocations:
  - { pl: "proszę usiąść", ru: "садитесь, пожалуйста" }
  - { pl: "usiąść przy stole", ru: "сесть за стол" }
  - { pl: "usiąść obok", ru: "сесть рядом" }
  - { pl: "usiądźmy", ru: "давайте сядем" }
family:
  - { pl: "siedzieć", ru: "сидеть", relation: derived, id: siedziec }
  - { pl: "siadać", ru: "садиться", relation: derived }
  - { pl: "przysiąść", ru: "присесть", relation: derived }
etymology: "Приставка u- плюс siąść «сесть», от праславянского *sěsti — то же слово, что русское «сесть». Словари отмечают влияние немецкого sich setzen на возвратную модель."
memory: "usiąść — «сесть», совершенный вид. Главная ловушка для русского уха: usiądę, usiądziesz, usiądzie выглядят как настоящее время, но означают БУДУЩЕЕ — у совершенного вида настоящего времени нет. Держите тройку целиком: siadać «садиться», usiąść «сесть», siedzieć «сидеть». Usiądź! «Сядь!» — но Siedź! «Сиди!». И запомните вежливое Proszę usiąść «Садитесь, пожалуйста»."
idioms:
  - { pl: "proszę usiąść", ru: "садитесь, пожалуйста" }
  - { pl: "usiąść do stołu", ru: "сесть за стол" }
  - { pl: "usiądźmy na chwilę", ru: "давайте присядем на минутку" }
formExamplesSkip:
  - { form: "usiądnięcia", reason: "отглагольное существительное usiądnięcie морфология образует, но в живой речи оно не употребляется: говорят siadanie или описательно" }
  - { form: "usiądnięcie", reason: "отглагольное существительное usiądnięcie морфология образует, но в живой речи оно не употребляется: говорят siadanie или описательно" }
  - { form: "usiądnięciem", reason: "отглагольное существительное usiądnięcie морфология образует, но в живой речи оно не употребляется: говорят siadanie или описательно" }
  - { form: "usiądnięciu", reason: "отглагольное существительное usiądnięcie морфология образует, но в живой речи оно не употребляется: говорят siadanie или описательно" }
