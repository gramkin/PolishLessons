etymology: "От существительного SPORT, которое пришло из английского SPORT, а то — сокращение от DISPORT «развлечение, забава», из старофранцузского DESPORT, от DESPORTER «развлекаться», буквально «уносить себя в сторону», из латинских DIS- «в разные стороны» и PORTARE «нести». Русский «спорт» заимствован из того же английского источника и в то же время, вторая половина девятнадцатого века, поэтому слова совпадают. Корень PORTARE знаком по целому ряду: TRANSPORT и «транспорт», EKSPORT, IMPORT, PORTIER. Суффикс -OWY в польском образует относительные прилагательные тысячами и отвечает русскому -ОВЫЙ и -НЫЙ: SPORTOWY и «спортивный», DOMOWY и «домашний», ZIMOWY и «зимний». Именно он и отвечает за отсутствие степеней сравнения."
memory: "Относительное прилагательное: одиннадцать форм, степеней сравнения нет — sportowszy не существует. «Более спортивный» передают оборотом bardziej sportowy. Сравните с качественным dostępny, у которого тридцать три формы. Сочетания запоминать целиком: obuwie sportowe — «кроссовки», zajęcia sportowe — «физкультура». Определение стоит после существительного: klub sportowy. Суффикс -owy отвечает русским -овый и -ный."
