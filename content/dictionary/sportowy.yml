notes:
  - { kind: government, text: "Прилагательное относительное, и это определяет число форм: их одиннадцать, а не тридцать три. Степеней сравнения у SPORTOWY нет, потому что относительное прилагательное называет не свойство, а отношение к предмету: нельзя быть «спортивнее» в смысле «более относящимся к спорту». Форм SPORTOWSZY и NAJSPORTOWSZY не существует. Когда нужно сказать «более спортивный» о внешности или стиле, берут описательный оборот BARDZIEJ SPORTOWY. Для сравнения: качественное прилагательное вроде DOSTĘPNY даёт тридцать три формы, потому что к одиннадцати основным добавляются одиннадцать сравнительной и одиннадцать превосходной степени." }
  - { kind: false-friend, text: "Значение совпадает с русским «спортивным» почти полностью, и подвоха в смысле нет. Стоит знать только, что сочетания устроены иначе, чем кажется. OBUWIE SPORTOWE это «кроссовки», а не просто спортивная обувь; STRÓJ SPORTOWY — «спортивная форма»; ZAJĘCIA SPORTOWE — «физкультура» в школьном расписании. И порядок слов: определение в этих сочетаниях стоит после существительного, KLUB SPORTOWY, SAMOCHÓD SPORTOWY, тогда как русский ставит его перед. Это общее свойство относительных прилагательных в польских терминах, а не особенность слова." }
  - { kind: pronunciation, text: "Читается «спорто́вы», ударение на предпоследнем слоге из трёх. Начальное SP твёрдое. Конечное -Y звучит «ы», как во всех прилагательных мужского рода. В форме мужского лица множественного SPORTOWI буква W смягчается перед -I: «спорто́ви». В женской SPORTOWA слышно «спорто́ва», в среднем SPORTOWE — «спорто́вэ». Ударение во всех формах остаётся на предпоследнем слоге, и в четырёхсложных формах вроде SPORTOWEGO оно сдвигается вправо: «спортове́го»." }
  - { kind: usage, text: "Частотные сочетания целиком: KLUB SPORTOWY, SAMOCHÓD SPORTOWY, OBUWIE SPORTOWE «кроссовки», STRÓJ SPORTOWY «спортивная форма», ZAJĘCIA SPORTOWE «физкультура», DZIENNIKARZ SPORTOWY, WYNIK SPORTOWY. Существительное SPORT не изменяется в этих оборотах и стоит в родительном, когда прилагательного недостаточно: KLUB SPORTU WYCZYNOWEGO. Наречия от относительного прилагательного не образуется: «спортивно» в смысле образа жизни передают оборотом PO SPORTOWEMU или словом AKTYWNIE." }
