# review
id: chetnie
format: 2
lemma: "chętnie"
rank: 1479
pos: adv
pron: { cyr: "хэ́нтне" }
senses:
  - id: willingly
    ru: "охотно, с удовольствием"
    examples:
      - pl: "Chętnie przyjął naszą propozycję."
        ru: "Он с радостью принял наше предложение."
        source: { kind: tatoeba, id: 5198883 }
      - pl: "Chętnie ci pomogę, w miarę możliwości."
        ru: "С удовольствием тебе помогу, в меру моих сил."
        source: { kind: tatoeba, id: 720297 }
      - pl: "Chętnie."
        ru: "Охотно."
        source: { kind: translated, id: 12182487 }
  - id: preference
    ru: "охотнее, предпочтительнее"
    examples:
      - pl: "Chętniej piję wodę gazowaną, niż niegazowaną."
        ru: "Я охотнее пью газированную воду, чем негазированную."
        source: { kind: translated, id: 13561481 }
      - pl: "Najchętniej przypominam sobie przyszłość."
        ru: "Охотнее всего я вспоминаю будущее."
        source: { kind: translated, id: 13046017 }
notes:
  - { kind: usage, text: "Наречие от chętny «охотный, готовый»; существительное — chęć «желание, охота»." }
  - { kind: usage, text: "Chętnie! отдельной репликой значит «С удовольствием!» — стандартный ответ на приглашение." }
  - { kind: usage, text: "Степени сравнения регулярные: chętniej «охотнее», najchętniej «охотнее всего». Najchętniej часто переводится как «лучше всего бы»: Najchętniej zostałbym w domu." }
  - { kind: false-friend, text: "Не путайте chętnie «охотно» с chyba «наверное» и chociaż «хотя»: все начинаются на ch-, но это разные слова." }
collocations:
  - { pl: "bardzo chętnie", ru: "очень охотно" }
  - { pl: "chętnie pomogę", ru: "охотно помогу" }
  - { pl: "najchętniej", ru: "охотнее всего" }
etymology: "От chęć «желание, охота» (праславянское *xotь, то же, что русские «хоть» и «хотеть»). Русское «охотно» собрано от «охоты» — образ тот же самый."
memory: "chętnie — «охотно», от chęć «желание», родственного русскому «хотеть». Chętnie! в одиночку значит «С удовольствием!» — ответ на приглашение. А najchętniej часто переводится как «лучше всего бы»."
idioms:
  - { pl: "bardzo chętnie", ru: "очень охотно, с большим удовольствием" }
  - { pl: "chętnie się zgadzam", ru: "охотно соглашаюсь" }
  - { pl: "najchętniej ze wszystkiego", ru: "охотнее всего" }
