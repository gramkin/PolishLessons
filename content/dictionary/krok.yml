# review
id: krok
format: 2
lemma: "krok"
rank: 851
pos: noun
pron: { cyr: "крок" }
senses:
  - id: step
    ru: "шаг"
    examples:
      - pl: "Zaskoczenie i zachwyt - oto pierwszy krok ku zrozumieniu."
        ru: "Изумление, удивление - это первый шаг на пути к постижению."
        source: { kind: tatoeba, id: 350103 }
      - pl: "Krok w bok."
        ru: "Шаг в сторону."
        source: { kind: translated, id: 5652433 }
      - pl: "Krok naprzód."
        ru: "Шаг вперёд."
        source: { kind: translated, id: 5652428 }
  - id: keep-up
    ru: "dotrzymywać kroku — поспевать, идти в ногу"
    examples:
      - pl: "Ani kroku dalej!"
        ru: "Ни шагу дальше!"
        source: { kind: tatoeba, id: 6320402 }
      - pl: "Dotrzymywał jej kroku."
        ru: "Он поспевал за ней."
        source: { kind: translated, id: 6534259 }
      - pl: "Spróbuj dotrzymać mi kroku."
        ru: "Попробуй поспеть за мной."
        source: { kind: translated, id: 5478608 }
  - id: measure
    ru: "шаг как мера действия: следующий шаг, меры"
    examples:
      - pl: "Nie wiem, co jest kolejnym krokiem."
        ru: "Я не знаю, каким будет следующий шаг."
        source: { kind: translated, id: 3656355 }
      - pl: "Chcę osiągnąć swój cel drobnymi krokami."
        ru: "Я хочу достичь цели маленькими шагами."
        source: { kind: translated, id: 925825 }
      - pl: "Zrobili kilka kroków do przodu."
        ru: "Они сделали несколько шагов вперёд."
        source: { kind: translated, id: 3365231 }
notes:
  - { kind: usage, text: "krok po kroku — «шаг за шагом», самое частое сочетание. Ещё krok w krok «по пятам» и krok wstecz «шаг назад»." }
  - { kind: government, text: "dotrzymywać komuś kroku «поспевать за кем-то» — дательный на человека и родительный на kroku: Dotrzymywał jej kroku." }
  - { kind: usage, text: "Ani kroku dalej! — «Ни шагу дальше!». Родительный падеж после отрицания, как и в русском." }
  - { kind: usage, text: "na każdym kroku — «на каждом шагу», то есть «повсюду, постоянно»." }
collocations:
  - { pl: "krok po kroku", ru: "шаг за шагом" }
  - { pl: "pierwszy krok", ru: "первый шаг" }
  - { pl: "dotrzymywać kroku", ru: "поспевать" }
  - { pl: "na każdym kroku", ru: "на каждом шагу" }
family:
  - { pl: "kroczyć", ru: "шагать", relation: root }
  - { pl: "przekroczyć", ru: "перешагнуть, превысить", relation: derived }
  - { pl: "wykrok", ru: "выпад", relation: derived }
etymology: "Праславянское *krokъ «шаг», от *kročiti «шагать» — тот же корень в kroczyć и przekroczyć. В русском этот корень не удержался: «шаг» слово другого происхождения, поэтому krok приходится просто запомнить."
memory: "krok — «шаг». Корень в русском не сохранился, так что слово запоминается отдельно, зато сочетания прозрачны: krok po kroku «шаг за шагом», pierwszy krok «первый шаг», na każdym kroku «на каждом шагу». И dotrzymywać komuś kroku — «поспевать за кем-то»."
idioms:
  - { pl: "krok po kroku", ru: "шаг за шагом" }
  - { pl: "na każdym kroku", ru: "на каждом шагу" }
  - { pl: "ani kroku dalej", ru: "ни шагу дальше" }
  - { pl: "dotrzymywać kroku", ru: "идти в ногу, поспевать" }
