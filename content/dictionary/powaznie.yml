notes:
  - { kind: usage, text: "Poważnie? — готовая разговорная реплика «Серьёзно?», как русское «Правда?»." }
  - { kind: usage, text: "brać na poważnie — «принимать всерьёз»: Nie bierz tego na poważnie." }
  - { kind: usage, text: "Второе значение — «значительно, сильно»: poważnie zachorować «серьёзно заболеть»." }
  - { kind: usage, text: "От прилагательного poważny «серьёзный», а то — от waga «вес»: серьёзное значит весомое. Русские «важный» и «уважать» из того же гнезда." }
collocations:
