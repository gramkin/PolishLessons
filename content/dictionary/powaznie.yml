  - { pl: "poważnie?", ru: "серьёзно?" }
etymology: "От poważny «серьёзный», а то — от waga «вес»: серьёзное это весомое. Русские «важный» и «уважать» выросли из того же корня."
memory: "poważnie — «серьёзно», и внутри сидит waga «вес»: серьёзное — то, что весомо. Отсюда же русские «важный» и «уважать». А Poważnie? — это готовое «Серьёзно?»."
