    pl: "Załamanie funkcji falowej jest jednym z najbardziej intrygujących zjawisk badanych przez mechanikę kwantową. Nie rozumiał go nawet Einstein."
    ru: "Коллапс волновой функции — одно из самых интригующих явлений, изучаемых квантовой механикой. Его не понимал даже Эйнштейн."
