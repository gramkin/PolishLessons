    pl: "Ceny załamały się w tydzień."
    ru: "Цены обрушились за неделю."
    source: { kind: authored }
  - form: "załamały"
    pl: "Plany załamały się w ostatniej chwili."
    ru: "Планы рухнули в последний момент."
    source: { kind: authored }
  - form: "załamaną"
    pl: "Tom zastanawiał się, czemu Mary wyglądała na załamaną."
    ru: "Том гадал, почему Мэри выглядела подавленной."
    source: { kind: translated, id: 3754163 }
  - form: "załamaną"
    pl: "Zastałem ją załamaną."
    ru: "Я застал её подавленной."
    source: { kind: authored }
  - form: "załamaną"
    pl: "Widziałem twarz załamaną bólem."
    ru: "Я видел лицо, искажённое болью."
    source: { kind: authored }
  - form: "załamania"
    pl: "Ona jest na granicy załamania nerwowego."
    ru: "Она на грани нервного срыва."
    source: { kind: translated, id: 416468 }
  - form: "załamania"
    pl: "Doszło do załamania rozmów."
    ru: "Дело дошло до срыва переговоров."
    source: { kind: authored }
  - form: "załamania"
    pl: "Nie ma powodu do załamania."
    ru: "Нет причины падать духом."
    source: { kind: authored }
  - form: "załamanie"
    pl: "Przeżyła załamanie nerwowe."
    ru: "Она пережила нервный срыв."
    source: { kind: translated, id: 730428 }
  - form: "załamanie"
    pl: "Załamanie funkcji falowej jest jednym z najbardziej intrygujących zjawisk badanych przez mechanikę kwantową. Nie rozumiał go nawet Einstein."
    ru: "Коллапс волновой функции — одна из самых интригующих задач."
    source: { kind: translated, id: 12893235 }
  - form: "załamanie"
    pl: "Załamanie pogody pokrzyżowało plany."
    ru: "Резкая перемена погоды спутала планы."
    source: { kind: authored }
  - form: "załamany"
    pl: "Byłem załamany."
    ru: "Я был подавлен."
    source: { kind: translated, id: 10572765 }
  - form: "załamany"
    pl: "Był załamany porażką."
    ru: "Он был подавлен поражением."
    source: { kind: translated, id: 355341 }
  - form: "załamany"
    pl: "Tom był doszczętnie załamany."
    ru: "Том был совершенно подавлен."
    source: { kind: translated, id: 6160003 }
