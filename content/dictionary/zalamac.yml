# review
id: zalamac
format: 2
lemma: "załamać"
rank: 2261
pos: verb
aspect: perf
pron: { cyr: "зауа́маць" }
senses:
  - id: break-down
    ru: "сломить, подкосить; сломаться (załamać się)"
    examples:
      - pl: "Załamał się gdy usłyszał złe wieści."
        ru: "Он сломался, когда услышал дурные вести."
        source: { kind: translated, id: 3176988 }
      - pl: "Porażka nie załamała go."
        ru: "Поражение его не сломило."
        source: { kind: translated, id: 745396 }
      - pl: "Diana załamała się kiedy zdechł jej kot."
        ru: "Диана сломалась, когда у неё умер кот."
        source: { kind: translated, id: 2408656 }
  - id: collapse
    ru: "обрушиться, сорваться (о льде, переговорах)"
    examples:
      - pl: "Lód załamał się pod ciężarem."
        ru: "Лёд проломился под тяжестью."
        source: { kind: translated, id: 722117 }
      - pl: "Rozmowy sojuszu w Berlinie załamały się."
        ru: "Переговоры союза в Берлине сорвались."
        source: { kind: translated, id: 6533097 }
notes:
  - { kind: government, text: "Винительный падеж без się: porażka go nie załamała. С się — непереходное «сломаться, обрушиться»." }
  - { kind: usage, text: "załamanie nerwowe «нервный срыв» — устойчивый термин; причастие załamany значит «подавленный, убитый горем»." }
  - { kind: false-friend, text: "Корень łamać «ломать» — ср. русское «ломать», «надломить». Приставка za- та же, что в «заломить»." }
  - { kind: usage, text: "Несовершенный вид — załamywać. Есть и физический смысл: załamanie światła «преломление света»." }
collocations:
  - { pl: "załamanie nerwowe", ru: "нервный срыв" }
  - { pl: "załamać się", ru: "сломаться" }
etymology: "za- + łamać «ломать»; ср. русское «ломать», «надломить», «заломить»."
memory: "załamać — «сломить», с się «сломаться, обрушиться». Запомните załamanie nerwowe «нервный срыв» и причастие załamany «подавленный»."
idioms:
  - { pl: "załamanie nerwowe", ru: "нервный срыв" }
  - { pl: "załamać się", ru: "сломаться" }
