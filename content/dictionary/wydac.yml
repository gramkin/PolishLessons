# review
id: wydac
format: 2
lemma: "wydać"
rank: 842
pos: verb
aspect: perf
pron: { cyr: "вы́даць" }
senses:
  - id: spend
    ru: "потратить (деньги)"
    examples:
      - pl: "Wydałem wszystkie pieniądze."
        ru: "Я потратил все деньги."
        source: { kind: tatoeba, id: 351470 }
      - pl: "Wydałem dziś 100 dolarów."
        ru: "Я потратил сегодня 100 долларов."
        source: { kind: translated, id: 659790 }
      - pl: "Wydałeś zbyt dużo pieniędzy."
        ru: "Ты потратил слишком много денег."
        source: { kind: translated, id: 3450740 }
  - id: publish
    ru: "издать, выпустить (книгу, альбом)"
    examples:
      - pl: "W którym wydawnictwie została wydana ta książka?"
        ru: "В каком издательстве была опубликована эта книга?"
        source: { kind: tatoeba, id: 13154942 }
      - pl: "Mało prawdopodobne, byśmy wydali nowy album przed zimą."
        ru: "Это очень маловероятно, что мы выпустим новый альбом до следующей зимы."
        source: { kind: tatoeba, id: 991172 }
      - pl: "Książkę wydano w Wielkiej Brytanii."
        ru: "Книгу издали в Великобритании."
        source: { kind: translated, id: 3781115 }
  - id: hand-over
    ru: "выдать (человека); вынести (приговор); дать (сдачу)"
    note: "Сюда же относится wydać resztę «дать сдачу» и wydać wyrok «вынести приговор»."
    examples:
      - pl: "Kto nas wydał?"
        ru: "Кто нас выдал?"
        source: { kind: translated, id: 3086105 }
      - pl: "Czy może mi pan wydać resztę z banknotu studolarowego?"
        ru: "Вы можете дать мне сдачу со стодолларовой купюры?"
        source: { kind: translated, id: 631992 }
      - pl: "Są wydał wyrok w sprawie."
        ru: "Суд вынес приговор по делу."
        source: { kind: translated, id: 770292 }
notes:
  - { kind: usage, text: "Самое частое значение в живой речи — «потратить»: Ile wydałeś? «Сколько ты потратил?», wydać pieniądze na coś «потратить деньги на что-то»." }
  - { kind: usage, text: "Формы wydam, wydasz, wyda — БУДУЩЕЕ время: глагол совершенного вида. Несовершенный — wydawać." }
  - { kind: usage, text: "С się значит «раскрыться, обнаружиться»: Wydało się «Всё раскрылось», Wszystkie jej tajemnice się wydały. Отдельно от этого wydawać się значит «казаться»." }
  - { kind: false-friend, text: "Существительное wydanie — это «издание» (книги, газеты), а wydatek — «расход, трата». Не путайте с wydarzenie «событие»." }
collocations:
  - { pl: "wydać pieniądze", ru: "потратить деньги" }
  - { pl: "wydać książkę", ru: "издать книгу" }
  - { pl: "wydać resztę", ru: "дать сдачу" }
  - { pl: "wydać na świat", ru: "произвести на свет" }
family:
  - { pl: "wydawać", ru: "выдавать, издавать", relation: derived }
  - { pl: "wydanie", ru: "издание", relation: derived }
  - { pl: "wydatek", ru: "расход", relation: derived }
  - { pl: "wydawnictwo", ru: "издательство", relation: derived }
etymology: "Приставка wy- плюс dać «дать», от праславянского *dati — то же слово, что русское «выдать». Значение «потратить» развилось из «отдать наружу»: деньги уходят из рук."
memory: "wydać — «выдать», но в живой речи чаще всего «потратить»: Ile wydałeś? «Сколько ты потратил?». Три значения стоит держать вместе: потратить (wydać pieniądze), издать (wydać książkę) и выдать (wydać kogoś policji, wydać wyrok, wydać resztę «дать сдачу»). С się получается «раскрыться»: Wydało się «Всё раскрылось». Формы wydam, wydasz — будущее время. Существительные разные: wydanie «издание», wydatek «расход»."
idioms:
  - { pl: "wydać na świat", ru: "произвести на свет" }
  - { pl: "wydać resztę", ru: "дать сдачу" }
  - { pl: "wydało się", ru: "всё раскрылось" }
