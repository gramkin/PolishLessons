# review
id: zabijac
format: 2
lemma: "zabijać"
rank: 595
pos: verb
aspect: imperf
aspectPair: zabic
pron: { cyr: "заби́яць" }
senses:
  - id: kill
    ru: "убивать (кого-л. — винительный)"
    note: "Совершенный вид — zabić."
    examples:
      - pl: "Koty zabijają szczury."
        ru: "Кошки убивают крыс."
        source: { kind: translated, id: 8983021 }
      - pl: "Nie zabijaj mnie."
        ru: "Не убивай меня."
        source: { kind: translated, id: 4837638 }
      - pl: "To nie pistolety zabijają ludzi. Ludzie zabijają ludzi."
        ru: "Не пистолеты убивают людей. Люди убивают людей."
        source: { kind: translated, id: 745174 }
  - id: kill-time
    ru: "zabijać czas — убивать время"
    note: "Идиома переносится из русского буквально."
    examples:
      - pl: "Zabijała czas, chodząc po sklepach."
        ru: "Она убивала время, ходя по магазинам."
        source: { kind: translated, id: 676776 }
      - pl: "Zabijaliśmy czas grą w karty."
        ru: "Мы убивали время игрой в карты."
        source: { kind: translated, id: 1353592 }
      - pl: "Zabijam czas czytaniem."
        ru: "Я убиваю время чтением."
        source: { kind: authored }
  - id: kill-abstract
    ru: "с отвлечённым подлежащим: Palenie zabija"
    note: "Язык предупреждающих надписей, как и в русском."
    examples:
      - pl: "Palenie zabija."
        ru: "Курение убивает."
        source: { kind: translated, id: 3452293 }
      - pl: "Prędkość zabija."
        ru: "Скорость убивает."
        source: { kind: translated, id: 8095898 }
      - pl: "Porównywanie zabija zabawę."
        ru: "Сравнение убивает радость."
        source: { kind: translated, id: 7943315 }
notes:
  - { kind: government, text: "zabijać kogoś — винительный, ровно как в русском. Совершенный вид — zabić: zabijał długo, w końcu zabił." }
  - { kind: usage, text: "Идиома совпадает с русской слово в слово: zabijać czas «убивать время»." }
  - { kind: usage, text: "С отвлечённым подлежащим слово звучит как предупреждение: Palenie zabija «Курение убивает», Prędkość zabija «Скорость убивает»." }
  - { kind: usage, text: "Возвратное zabijać się значит «кончать с собой». «Убиться» в смысле «сильно удариться» будет potłuc się, не zabić się." }
  - { kind: usage, text: "Отглагольное существительное — zabijanie «убийство как действие»: maszyna do zabijania." }
collocations:
  - { pl: "zabijać czas", ru: "убивать время" }
  - { pl: "Palenie zabija", ru: "Курение убивает" }
  - { pl: "zabijać się", ru: "кончать с собой" }
  - { pl: "maszyna do zabijania", ru: "машина для убийства" }
family:
  - { pl: "zabić", ru: "убить", relation: aspect }
  - { pl: "bić", ru: "бить", relation: root }
  - { pl: "zabójca", ru: "убийца", relation: derived }
  - { pl: "zabijanie", ru: "убийство", relation: derived }
etymology: "Приставка za- плюс bić «бить», праславянское *biti — то же слово, что русское «бить». «Убивать» по-польски буквально «забивать»."
memory: "zabijać — «убивать», и собрано оно из za- плюс bić, ровно как русское «убивать» из «бить». Совершенный вид — zabić. Идиома переносится слово в слово: zabijać czas «убивать время». А на предупреждающих надписях вы встретите ту же конструкцию, что по-русски: Palenie zabija, Prędkość zabija. Осторожно с возвратным: zabijać się значит «кончать с собой», а «убиться» в смысле «удариться» — potłuc się."
idioms:
  - { pl: "zabijać czas", ru: "убивать время" }
  - { pl: "Palenie zabija", ru: "Курение убивает" }
  - { pl: "zabijać się", ru: "кончать с собой" }
