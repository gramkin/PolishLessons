notes:
  - { kind: false-friend, text: "ZAGŁADA — «уничтожение, гибель», и с русским «загладить» её сближает только корень. В польском ZGŁADZIĆ значит «уничтожить, убить». С прописной буквы ZAGŁADA — Холокост: так говорят в Польше чаще, чем HOLOKAUST." }
  - { kind: usage, text: "Пять живых форм, женский род, только единственное число. Формы множественного и звательный не даются. В местном падеже D переходит в DZ: PO ZAGŁADZIE." }
  - { kind: government, text: "Гибель чего — родительный: ZAGŁADA MIASTA. Обречь на гибель — SKAZAĆ NA ZAGŁADĘ, NA с винительным. Спасти от уничтожения — URATOWAĆ PRZED ZAGŁADĄ, PRZED с творительным, где в русском «от» с родительным." }
  - { kind: pronunciation, text: "Читается «загуа́да», ударение на предпоследнем слоге. Ł — краткое «у», а не «л»." }
  - { kind: register, text: "Слово серьёзное и книжное: история, наука, публицистика. Устойчивое сочетание — BROŃ MASOWEJ ZAGŁADY, «оружие массового уничтожения»." }
collocations:
  - { pl: "broń masowej zagłady", ru: "оружие массового уничтожения" }
  - { pl: "skazany na zagładę", ru: "обречённый на гибель" }
  - { pl: "zagłada Żydów", ru: "уничтожение евреев, Холокост" }
family:
  - { pl: "zgładzić", ru: "уничтожить, убить", relation: root }
  - { pl: "gładzić", ru: "гладить, разглаживать", relation: root }
  - { pl: "gładki", ru: "гладкий", relation: root }
etymology: "От старого ZGŁADZIĆ, ZAGŁADZIĆ «стереть, уничтожить», а то — от GŁADZIĆ «разглаживать». Уничтожить — значит сровнять с землёй, сделать гладким место. В русском «загладить» тот же корень остался в мирном значении."
memory: "Zagłada — уничтожение, гибель; Zagłada — Холокост. Читается «загуа́да». Broń masowej zagłady — оружие массового уничтожения. Zgładzić — уничтожить."
idioms:
  - { pl: "zetrzeć z powierzchni ziemi", ru: "стереть с лица земли" }
