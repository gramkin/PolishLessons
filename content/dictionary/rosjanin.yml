etymology: "От ROSJA, которое пришло в польский через латинское RUSSIA, и далее — от РУСЬ. Суффикс -ANIN обозначает человека по месту или общности и точно отвечает русскому -ЯНИН: ROSJANIN и «россиянин», MIESZCZANIN и «мещанин», CHRZEŚCIJANIN и «христианин». Самое полезное в этом суффиксе — его поведение во множественном числе: он усекается, теряя -IN. Отсюда ROSJANIN, но ROSJANIE в именительном и ROSJAN в родительном множественного, в точности как «россиянин», «россияне», «россиян». То же усечение у INDIANIN, INDIANIE, INDIAN и у MIESZCZANIN, MIESZCZANIE, MIESZCZAN. Учащемуся достаточно заметить, что русский делает ровно то же самое, и форма перестаёт быть трудной."
memory: "Польский пишет национальность человека с большой буквы, а прилагательное с маленькой: Rosjanin, но rosyjski; Polak, но polski. Русский не пишет с большой ни то, ни другое — ошибка идёт в одну сторону. Суффикс -anin усекается во множественном: Rosjanin, Rosjanie, Rosjan — как «россиянин», «россияне», «россиян». «Он русский» — on jest Rosjaninem, творительный. Ruski и Rusek пренебрежительны; Rusin — это русин, другой народ."
idioms:
