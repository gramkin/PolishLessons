notes:
  - { kind: usage, text: "Польская орфография здесь расходится с русской, и правило надо просто запомнить: названия людей по национальности пишутся с большой буквы — ROSJANIN, POLAK, NIEMIEC, FRANCUZ, — а прилагательные от них с маленькой: ROSYJSKI, POLSKI, NIEMIECKI. Русский не пишет с большой ни то, ни другое, поэтому ошибка идёт в одну сторону: хочется написать rosjanin. Отсюда и перевод распадается на два слова: ROSJANIN это человек, а ROSYJSKI это прилагательное «русский». JĘZYK ROSYJSKI «русский язык», но ON JEST ROSJANINEM «он русский». Названия языков в польском тоже с маленькой буквы." }
  - { kind: government, text: "Мужской род, одушевлённое, лицо (m1). Винительный равен родительному: WIDZIAŁ ROSJANINA. Именительный множественного ROSJANIE, родительный множественного ROSJAN. Кем является — творительный с BYĆ: JEST ROSJANINEM, а не «jest Rosjanin». Это общее правило польского для профессий и национальностей: BYĆ LEKARZEM, BYĆ POLAKIEM, и русский строит так же — «быть врачом». Женская форма ROSJANKA, множественное ROSJANKI. Страна — ROSJA, прилагательное — ROSYJSKI." }
  - { kind: register, text: "Нейтральное слово — ROSJANIN, и в любом вежливом тексте употребляется только оно. Разговорное RUSEK и прилагательное RUSKI в современном польском пренебрежительны, иногда прямо оскорбительны, и учащемуся их лучше знать, чтобы не употреблять. Отдельно существует RUSIN — это не русский, а русин, представитель отдельного народа Карпат, и путать эти слова нельзя. Для жителя России как государства польский при необходимости скажет OBYWATEL ROSJI «гражданин России», отделяя гражданство от национальности, как и русское «россиянин» рядом с «русским»." }
  - { kind: pronunciation, text: "Читается «рося́нин», три слога, ударение на предпоследнем. Сочетание SJ произносится как «сй», то есть «рося» звучит почти как русское «Россия» без конечного «я». Во множественном ROSJANIE слышно «рося́не», а в родительном множественного ROSJAN — «ро́сян», и ударение перемещается на первый слог, потому что слогов остаётся два. Одно S, а не два: в польском написании удвоения нет, в отличие от русской «России»." }
