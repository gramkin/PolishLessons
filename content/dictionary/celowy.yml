        ru: "Его молчание было намеренным."
        source: { kind: authored }
  - id: purposeful
    ru: "целесообразный, разумный"
    examples:
      - pl: "Czy to jest celowe, żeby budować tu drogę?"
        ru: "Целесообразно ли строить здесь дорогу?"
        source: { kind: authored }
      - pl: "Komisja uznała wydatek za celowy."
        ru: "Комиссия признала расход целесообразным."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "CELOWY похоже на русское «целевой», но значит другое: «намеренный» или «целесообразный». Русское «целевой» — о том, что предназначено для цели: «целевой кредит», «целевая аудитория», — по-польски это CELOWY только в устойчивых сочетаниях: KREDYT CELOWY, а чаще DOCELOWY: GRUPA DOCELOWA, «целевая аудитория». Сказать «намеренно» — CELOWO, так поляк и упрекнёт: ZROBIŁEŚ TO CELOWO, «ты сделал это нарочно»." }
  - { kind: usage, text: "Относительное прилагательное, степеней сравнения нет. Формы для мужчин-людей CELOWI в карточке нет: намеренными бывают действия, а не люди. Остальные десять форм живые. В юридическом языке CELOWY противопоставлен NIEUMYŚLNY, «неумышленный»." }
  - { kind: government, text: "Целесообразно что-то делать — JEST CELOWE + инфинитив или ŻEBY: CZY JEST CELOWE CZEKAĆ? Признать целесообразным — UZNAĆ ZA CELOWY, ZA с винительным. Само прилагательное падежа не требует." }
  - { kind: pronunciation, text: "Читается «цэло́вы», три слога, ударение на предпоследнем. C даёт «ц», за ним твёрдое «э»: «цэ», как в CEL «цэль». L перед гласной обычная, «л»." }
  - { kind: register, text: "Нейтральное слово с официальным оттенком, особенно во втором значении: CELOWOŚĆ WYDATKÓW, «целесообразность расходов», — язык бухгалтерии и ревизий. В быту чаще услышите наречие CELOWO: ON TO ZROBIŁ CELOWO!, «он это нарочно!»." }
collocations:
  - { pl: "celowe działanie", ru: "умышленное действие" }
  - { pl: "celowe podpalenie", ru: "умышленный поджог" }
  - { pl: "dotacja celowa", ru: "целевая субсидия" }
family:
  - { pl: "cel", ru: "цель", relation: root, id: cel }
  - { pl: "celowo", ru: "нарочно, намеренно", relation: derived, id: celowo }
  - { pl: "docelowy", ru: "целевой, конечный", relation: derived }
etymology: "От CEL «цель», заимствованного из средневерхненемецкого zil, современное немецкое Ziel. Русское «цель» — то же немецкое слово, пришедшее через польский в семнадцатом веке. Польский суффикс -OWY сделал из него «намеренный», то есть сделанный с целью."
memory: "Celowy — намеренный: celowe działanie, celowe podpalenie. Не «целевой»! Целевая аудитория — grupa docelowa. Celowo — нарочно. Читается «цэло́вы»."
idioms:
  - { pl: "zrobić coś celowo", ru: "сделать что-то нарочно" }
formExamplesSkip:
  - { form: "celowi", reason: "форма для мужчин-людей: людей так не описывают" }
