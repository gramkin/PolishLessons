senses:
  - id: deliberate
    ru: "намеренный, умышленный"
    examples:
      - pl: "To było celowe działanie, nie przypadek."
        ru: "Это было намеренное действие, а не случайность."
        source: { kind: authored }
      - pl: "Policja podejrzewa celowe podpalenie."
        ru: "Полиция подозревает умышленный поджог."
        source: { kind: authored }
