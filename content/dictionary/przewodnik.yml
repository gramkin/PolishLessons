etymology: "Сложено из приставки PRZE-, корня WOD- и суффикса -NIK, то есть из тех же частей и в том же порядке, что русское «проводник»: про плюс вод плюс ник. Корень идёт от праславянского *voditi «водить», и оба языка построили от него название того, кто ведёт. Физическое значение, проводник тока, пришло в оба языка позже, как перевод западного термина, и потому тоже совпало. Разошлись только частности: польский добавил значение книги-путеводителя, а для железнодорожного проводника взял латинское KONDUKTOR."
memory: "Собрано как русское «проводник», часть в часть: prze- это «про-», wod- это «вод-», -nik это «-ник». Значения почти те же: человек, который ведёт, и проводник тока. Два отличия: przewodnik это ещё и путеводитель, книга, а проводник в поезде называется konduktor. Множественное двоится по одушевлённости: przewodnicy о людях, przewodniki о книгах и веществах. Читается «пшево́дник», где prz это «пш»."
idioms:
