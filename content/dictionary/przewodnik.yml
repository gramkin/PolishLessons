notes:
  - { kind: false-friend, text: "Слово собрано ровно как русское «проводник»: приставка PRZE- отвечает «про-», корень WOD- отвечает «вод-», суффикс -NIK отвечает «-ник». И значения почти совпадают: человек, который ведёт, и вещество, которое проводит ток. Но одно расходится: проводник в поезде по-польски не PRZEWODNIK, а KONDUKTOR. Зато добавилось третье значение, которого у русского слова нет: PRZEWODNIK это ещё и путеводитель, книга. PRZEWODNIK PO WARSZAWIE значит «путеводитель по Варшаве»." }
  - { kind: usage, text: "Одиннадцать форм, мужской род. Слово одушевлённое в первом значении и неодушевлённое в остальных, и это видно по множественному: о людях PRZEWODNICY, с чередованием K в C, а о книгах и о веществах PRZEWODNIKI. Такое раздвоение обычно для слов, обозначающих и человека, и предмет. Родительный множественного один для обоих, PRZEWODNIKÓW. Из того же гнезда PRZEWODNICZĄCY «председатель», буквально «тот, кто ведёт собрание»." }
  - { kind: government, text: "Путеводитель по чему — предлог PO с местным падежом: PRZEWODNIK PO MIEŚCIE, PRZEWODNIK PO MUZEUM, и русский строит так же. Проводник чего — родительный без предлога: PRZEWODNIK PRĄDU «проводник тока», PRZEWODNIK CIEPŁA. Быть хорошим проводником — BYĆ DOBRYM PRZEWODNIKIEM, с творительным после BYĆ, как и по-русски. Глагол PRZEWODZIĆ управляет дательным: PRZEWODZIĆ GRUPIE «возглавлять группу»." }
  - { kind: pronunciation, text: "Читается «пшево́дник», четыре слога, ударение на предпоследнем. Сочетание PRZ даёт «пш», как всегда в польском, поэтому начало слова звучит «пше», а не «пре». Дальше всё читается по буквам. В форме PRZEWODNICY слышно «пшево́дницы», с твёрдым «ц» на месте C. В глаголе PRZEWODZIĆ слышно «пшево́дзичь», где DZI даёт слитное мягкое «дзь»." }
  - { kind: register, text: "Слово нейтральное и частое во всех трёх значениях. Частые обороты: PRZEWODNIK TURYSTYCZNY «гид» и одновременно «путеводитель», PRZEWODNIK PO MIEŚCIE, PRZEWODNIK GÓRSKI «горный проводник», DOBRY PRZEWODNIK PRĄDU. В горах это слово официальное: PRZEWODNIK TATRZAŃSKI — лицензированная профессия. Производное PRZEWODNICZĄCY значит «председатель» и встречается в каждом протоколе собрания." }
collocations:
  - { pl: "przewodnik turystyczny", ru: "гид, путеводитель" }
  - { pl: "przewodnik po mieście", ru: "путеводитель по городу" }
