  - { pl: "brew", ru: "бровь", relation: root }
etymology: "Слово связывают с существительным BREW «бровь»: исходно это предложное сочетание со значением «в бровь, прямо в лицо», то есть лицом к лицу с препятствием. Отсюда и нынешний смысл: идти WBREW значит идти навстречу тому, что мешает. Объяснение это не единственное, в словарях оно подаётся с оговоркой, но образ правдоподобный и хорошо запоминается. Русское «вопреки» устроено иначе — от «перек», того же корня, что «поперёк» и «перечить», — но образ в нём тот же: двигаться поперёк. Два языка выбрали разные части тела и разные направления для одной мысли."
memory: "Требует дательного падежа, как русское «вопреки»: wbrew prawu, wbrew oczekiwaniom. Дательный после предлога в польском редкость — тут же dzięki и przeciw. Читается «вбрэф», один слог, конечное w оглушается. Не путать с przeciw «против»: wbrew — это «вопреки»."
idioms:
  - { pl: "wbrew pozorom", ru: "вопреки видимости, хотя на вид не похоже" }
  - { pl: "wbrew sobie", ru: "против своей воли" }
