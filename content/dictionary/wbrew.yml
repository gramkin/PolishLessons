        ru: "Вопреки видимости это самая трудная часть."
        source: { kind: authored }
  - id: against-wishes
    ru: "наперекор, против воли"
    examples:
      - pl: "Zrobiła to wbrew sobie."
        ru: "Она сделала это против себя самой."
        source: { kind: authored }
      - pl: "Wyjechał wbrew radom lekarza."
        ru: "Он уехал наперекор советам врача."
        source: { kind: authored }
notes:
  - { kind: government, text: "Здесь главное на карточке, и для русского это подарок: WBREW требует дательного падежа, ровно как русское «вопреки». WBREW PRAWU «вопреки закону», WBREW OCZEKIWANIOM «вопреки ожиданиям», WBREW RADOM «наперекор советам», WBREW SOBIE «против себя». Совпадение полное, включая множественное число, так что переносить конструкцию можно прямо. Запомнить стоит потому, что дательный после предлога в польском редок: большинство предлогов берут родительный или винительный, и WBREW вместе с DZIĘKI и PRZECIW составляют небольшую группу исключений." }
  - { kind: usage, text: "Предлог книжно-нейтральный: он обычен и в газете, и в разговоре, но оттенок у него всегда «несмотря на препятствие». Самые частые сочетания стоит выучить целиком: WBREW POZOROM «вопреки видимости, на первый взгляд не похоже», WBREW OCZEKIWANIOM, WBREW TEMU, CO MÓWIĄ «вопреки тому, что говорят». Последнее показывает, что после WBREW может стоять и целый оборот с TEMU, CO, а не только существительное." }
  - { kind: pronunciation, text: "Читается «вбрэф», в один слог: вокруг единственной гласной стоят четыре согласных. Конечное w оглушается в «ф», как всегда на конце польского слова, поэтому не «вбрэв», а «вбрэф». Начальное wb произносится слитно, без гласной между ними, и это упражнение на польские скопления согласных: WBREW, WBIĆ, WBREW SOBIE. Об ударении речи нет, слог один." }
  - { kind: false-friend, text: "Ложной пары нет, но стоит отделить WBREW от соседнего PRZECIW, который тоже берёт дательный и тоже переводится предлогом «против». Разница в том, против чего идут. PRZECIW — это противодействие: GŁOSOWAĆ PRZECIW USTAWIE «голосовать против закона». WBREW — это пренебрежение препятствием: GŁOSOWAĆ WBREW PARTII значит голосовать не так, как велела партия. По-русски первое «против», второе «вопреки», и смешивать их нельзя." }
