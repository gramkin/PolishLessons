pron: { cyr: "вбрэф" }
senses:
  - id: contrary-to
    ru: "вопреки (чему-то)"
    examples:
      - pl: "Wbrew oczekiwaniom wygrał w pierwszej turze."
        ru: "Вопреки ожиданиям он выиграл в первом туре."
        source: { kind: authored }
