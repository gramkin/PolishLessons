notes:
  - { kind: false-friend, text: "Русского слова «кауция» нет, и это редкий случай, когда польское заимствование не имеет русской пары вовсе: KAUCJA это «залог» или «задаток». Поэтому запоминать приходится само слово, зато значение у него одно и ясное. Три главных применения: залог при найме жилья (KAUCJA ZA MIESZKANIE), залог в суде (WYJŚĆ ZA KAUCJĄ «выйти под залог») и залоговая стоимость тары (KAUCJA ZA BUTELKĘ). Не путайте с ZASTAW — это залог имущества, заклад в ломбарде, и управление у него другое. Прилагательное KAUCYJNY значит «залоговый»: OPŁATA KAUCYJNA." }
  - { kind: usage, text: "Слово принадлежит к типу на -CJA, самому многочисленному среди польских заимствований, и у него есть две особенности. Первая: родительный, дательный и местный единственного совпадают в одной форме KAUCJI, и она же служит родительным множественного. Вторая: рядом с ней живёт старая форма родительного множественного на -YJ — KAUCYJ, которая в современных текстах звучит архаично, но встречается в документах девятнадцатого века. То же у всех слов этого типа: REWOLUCJA даёт REWOLUCYJ, KOLEKCJA — KOLEKCYJ, FANTAZJA — FANTAZYJ. Главное правило типа простое: польское -CJA отвечает русскому -ЦИЯ без исключений." }
  - { kind: government, text: "Женский род. За что залог — предлог ZA с винительным: KAUCJA ZA MIESZKANIE, KAUCJA ZA BUTELKĘ. «Под залог» — ZA с творительным: WYJŚĆ ZA KAUCJĄ, ZWOLNIĆ ZA KAUCJĄ. Разница между этими двумя конструкциями только в падеже, и она важна: винительный отвечает на вопрос «за что», творительный — «каким образом». Частотные глаголы: WPŁACIĆ KAUCJĘ «внести залог», ZWRÓCIĆ KAUCJĘ «вернуть залог», PRZEPAŚĆ KAUCJA «залог пропал». Сумма — WYSOKOŚĆ KAUCJI, с родительным." }
  - { kind: pronunciation, text: "Читается «ка́уцья», два слога, ударение на первом. Сочетание AU произносится как два гласных, «ау», а не как русское «ав»: то же правило, что в AUTOSTRADA и AUTOBUS. Сочетание CJ даёт «ць» с последующим «я», то есть слитное «цья». В родительном KAUCJI конечное -I читается «и», и слово звучит «ка́уцьи». В старой форме KAUCYJ буква Y даёт «ы», а конечное J — «й»: «ка́уцый»." }
