etymology: "Из латинского CAUTIO «осторожность, обеспечение», от CAVERE «быть осторожным, остерегаться», откуда и юридическое CAVEAT «предостережение». Исходный смысл — обеспечение, которое берут из осторожности, и в этом значении слово вошло во все европейские правовые системы. Польский взял его через латынь канцелярий вместе с остальной юридической лексикой, и оно встроилось в продуктивный тип на -CJA. Русский для того же понятия воспользовался своим «залогом», от «залечь, заложить», и латинское слово не прижилось, поэтому пары здесь нет. От того же CAVERE происходит и PRECAUTION в английском, и польское OSTROŻNY — нет, последнее от OSTRY; родство здесь только смысловое, через идею предусмотрительности."
memory: "Русской пары нет: kaucja — это «залог», и слово надо просто запомнить. Три применения: за жильё, в суде (wyjść za kaucją) и за тару (kaucja za butelkę). Два управления рядом: kaucja ZA mieszkanie с винительным (за что) и wyjść ZA kaucją с творительным (как). Родительный, дательный и местный — одна форма kaucji, она же родительный множественного; рядом архаичное kaucyj, как rewolucyj. Au читается «ау»."
