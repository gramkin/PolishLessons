# review
id: osoba
format: 2
lemma: "osoba"
rank: 239
pos: noun
pron: { cyr: "осо́ба" }
senses:
  - id: person
    ru: "человек, лицо"
    examples:
      - pl: "Jest dobrą osobą."
        ru: "Она хороший человек."
        source: { kind: tatoeba, id: 6154780 }
      - pl: "Dziecko nie jest dorosłą osobą."
        ru: "Ребёнок не является зрелым человеком."
        source: { kind: tatoeba, id: 2774807 }
      - pl: "Nie oceniaj osoby po wyglądzie."
        ru: "Не суди людей по внешности."
        source: { kind: tatoeba, id: 10699587 }
  - id: counted
    ru: "человек (при счёте людей)"
    note: "Считая людей, поляки говорят osoba, а не człowiek: pięć osób «пять человек»."
    examples:
      - pl: "Jest ich sześć osób."
        ru: "Их шестеро."
        source: { kind: tatoeba, id: 357111 }
      - pl: "Rozdziel te jabłka na trzy osoby."
        ru: "Раздели эти яблоки на троих."
        source: { kind: tatoeba, id: 348635 }
      - pl: "Wiele osób popełniło ten sam błąd."
        ru: "Много людей сделали одну и ту же ошибку."
        source: { kind: tatoeba, id: 3616113 }
notes:
  - { kind: false-friend, text: "osoba — нейтральное «человек, лицо», без иронии, которая слышится в русском «особа»." }
  - { kind: usage, text: "При счёте людей всегда osoba: dwie osoby, pięć osób, stolik na cztery osoby." }
  - { kind: usage, text: "osoba prawna — «юридическое лицо», osoba fizyczna — «физическое лицо», osoba trzecia — «третье лицо»." }
collocations:
  - { pl: "osoba prawna", ru: "юридическое лицо" }
  - { pl: "dorosła osoba", ru: "взрослый человек" }
  - { pl: "na osobę", ru: "на человека" }
  - { pl: "we własnej osobie", ru: "собственной персоной" }
etymology: "Праславянское *osoba; то же слово, что русская «особа», но в польском оно осталось нейтральным."
memory: "osoba — обычное «человек, лицо», без иронии русской «особы». И считают людей именно так: pięć osób «пять человек»."
idioms:
  - { pl: "we własnej osobie", ru: "собственной персоной" }
  - { pl: "osoba prawna", ru: "юридическое лицо" }
  - { pl: "osoba trzecia", ru: "третье лицо" }
formExamplesSkip:
  - { form: "osobo", reason: "звательный падеж от этого слова в живой речи не употребляется" }
