# review
id: sprawic
format: 2
lemma: "sprawić"
rank: 791
pos: verb
aspect: perf
pron: { cyr: "спра́виць" }
senses:
  - id: cause-that
    ru: "sprawić, że… — сделать так, что…"
    note: "Самая частая конструкция: придаточное с że."
    examples:
      - pl: "Sprawię, że będziesz szczęśliwa."
        ru: "Я сделаю так, что ты будешь счастлива."
        source: { kind: translated, id: 552199 }
      - pl: "Sprawiła, że się uśmiechnąłem."
        ru: "Она заставила меня улыбнуться."
        source: { kind: translated, id: 1824918 }
      - pl: "Sprawią, że będziesz szczęśliwa."
        ru: "Они сделают так, что ты будешь счастлива."
        source: { kind: translated, id: 7043508 }
  - id: cause-feeling
    ru: "sprawić komuś przyjemność, przykrość — доставить радость, огорчить"
    examples:
      - pl: "To sprawiło mi przyjemność."
        ru: "Это доставило мне удовольствие."
        source: { kind: translated, id: 8506651 }
      - pl: "Tom sprawił mi zawód."
        ru: "Том меня разочаровал."
        source: { kind: translated, id: 4869582 }
      - pl: "Chyba sprawiłem mu przykrość."
        ru: "Кажется, я его огорчил."
        source: { kind: translated, id: 362013 }
  - id: buy
    ru: "sprawić sobie coś — купить себе, обзавестись"
    examples:
      - pl: "Sprawiłeś sobie nową komórkę?"
        ru: "Ты завёл себе новый телефон?"
        source: { kind: translated, id: 5704259 }
      - pl: "Sprawili sobie psa."
        ru: "Они завели себе собаку."
        source: { kind: authored }
      - pl: "Sprawiła sobie nowy płaszcz."
        ru: "Она купила себе новое пальто."
        source: { kind: authored }
notes:
  - { kind: government, text: "Самая частая конструкция — sprawić, że… «сделать так, что…»: Sprawię, że będziesz szczęśliwa. Русский чаще скажет «я сделаю тебя счастливой», без придаточного." }
  - { kind: usage, text: "sprawić komuś przyjemność «доставить кому-то удовольствие», sprawić przykrość «огорчить», sprawić zawód «разочаровать», sprawić kłopot «доставить хлопоты» — дательный на человека, винительный на чувство." }
  - { kind: usage, text: "sprawić sobie coś значит «купить себе, обзавестись»: sprawić sobie psa «завести собаку»." }
  - { kind: false-friend, text: "Форма spraw совпадает с родительным множественного от существительного sprawa «дело»: Mam kilka spraw «У меня несколько дел». Повелительное наклонение глагола выглядит так же, различает только контекст." }
collocations:
  - { pl: "sprawić przyjemność", ru: "доставить удовольствие" }
  - { pl: "sprawić zawód", ru: "разочаровать" }
  - { pl: "sprawić, że", ru: "сделать так, что" }
  - { pl: "sprawić sobie", ru: "обзавестись" }
family:
  - { pl: "sprawiać", ru: "делать, причинять", relation: aspect }
  - { pl: "sprawa", ru: "дело", relation: root, id: sprawa }
  - { pl: "sprawca", ru: "виновник", relation: derived }
etymology: "От sprawa «дело», того же корня, что prawy «правый» и naprawić «починить». Буквально «сделать дело», отсюда «сделать так, что»."
memory: "sprawić — «сделать так, что»: Sprawię, że będziesz szczęśliwa. Отсюда же sprawić komuś przyjemność «доставить удовольствие» и sprawić zawód «разочаровать». А sprawić sobie coś значит «обзавестись». Осторожно с формой spraw: так же выглядит родительный множественного от sprawa «дело»."
idioms:
  - { pl: "sprawić przyjemność", ru: "доставить удовольствие" }
  - { pl: "sprawić zawód", ru: "разочаровать" }
  - { pl: "sprawić sobie", ru: "обзавестись" }
