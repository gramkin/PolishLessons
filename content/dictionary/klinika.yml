notes:
  - { kind: stress, text: "Ударение падает на предпоследний слог — kliNIka, тогда как по-русски «кли́ника» с ударением на первом. Польский ставит ударение на предпоследний слог почти всегда, и это слово подчиняется общему правилу. Исключение составляют слова на -yka и -ika, называющие области знания: matematyka, fizyka, gramatyka, technika — они ударяются слогом раньше. Клиника же не наука, а учреждение, поэтому идёт по общему правилу." }
  - { kind: usage, text: "Дательный и местный — KLINICE: k переходит в c перед окончанием -e. Это та же мена, что в kostce, kulce, szafce, gorączce и setce, и здесь важно, что слово заимствованное: правило действует на латинизм так же безотказно, как на исконное слово. Сравните DZIENNIKU из этой же партии — тот же k, но мена не происходит, потому что у мужского рода местный падеж берёт окончание -u, а смягчает только -e." }
  - { kind: usage, text: "Родительный множественного — KLINIK, голая основа без окончания, как RAS в этой же партии и как kobiet, szkół. Форма выглядит в точности как именительный единственного мужского рода, и отсюда берутся совпадения вроде technika: родительный множественного от «техника» и именительный от «техник» — одно и то же слово на письме." }
