etymology: "Из греческого klinikē «уход за лежачим», от klinē «постель, лежанка», через латынь и немецкий. Корень тот же, что у «клинома» в составе слов о наклоне: греческое klinō значит «наклонять», а постель — то, на что ложатся, наклонившись. Русский и польский взяли слово из одного источника, но ударение легло по-разному: русский сохранил греческое начальное, польский подчинил слово своему предпоследнему."
memory: "Ударение не как в русском: kliNIka, не КЛИ-ни-ка. А в дательном и местном k становится c: w klinice."
