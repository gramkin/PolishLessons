# review
id: pozdrowic
format: 2
lemma: "pozdrowić"
rank: 2717
pos: verb
pron: { cyr: "поздро́виць" }
senses:
  - id: greet
    ru: "поприветствовать, поздороваться"
    examples:
      - pl: "Zapomniał pozdrowić gospodarza."
        ru: "Он забыл поприветствовать хозяина."
        source: { kind: authored }
      - pl: "Pozdrowił nas skinieniem głowy."
        ru: "Он поприветствовал нас кивком головы."
        source: { kind: authored }
      - pl: "Gości pozdrowiono przy wejściu."
        ru: "Гостей поприветствовали у входа."
        source: { kind: authored }
  - id: regards
    ru: "привет, приветствие"
    examples:
      - pl: "Przesyłam serdeczne pozdrowienia."
        ru: "Передаю сердечный привет."
        source: { kind: authored }
      - pl: "Pozdrów ode mnie rodziców."
        ru: "Передай от меня привет родителям."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "POZDROWIĆ значит «поприветствовать», «передать привет», а не «поздравить». Поздравить по-польски будет POGRATULOWAĆ или ZŁOŻYĆ ŻYCZENIA. Соответственно POZDROWIENIE — это привет, а не поздравление. Ошибка эта из самых частых и самых заметных: pozdrowienia z okazji urodzin звучит так, будто вы передаёте привет по случаю дня рождения вместо того, чтобы поздравить." }
  - { kind: pronunciation, text: "Повелительное наклонение показывает чередование ó и o внутри глагола: POZDRÓW, POZDRÓWMY, POZDRÓWCIE с ó, но pozdrowię, pozdrowi, pozdrowił с обычным o. Правило то же, что у wzór — wzoru и opór — oporu: ó появляется в закрытом слоге и исчезает, едва за ним открывается гласная. Конечное w при этом оглушается, и pozdrów звучит «по́здруф»." }
  - { kind: usage, text: "Несовершенная пара POZDRAWIAĆ дала самую ходовую формулу польской переписки: POZDRAWIAM на конце письма отвечает нашему «с уважением» или «всего доброго», а pozdrawiam serdecznie — «с сердечным приветом». В живой речи чаще всего слышно повелительное POZDRÓW KOGOŚ ODE MNIE — «передай от меня привет кому-то»." }
collocations:
  - { pl: "pozdrowić kogoś", ru: "поприветствовать кого-то" }
  - { pl: "pozdrów ode mnie", ru: "передай от меня привет" }
  - { pl: "przesłać pozdrowienia", ru: "передать привет" }
family:
  - { pl: "pozdrawiać", ru: "приветствовать", relation: aspect }
  - { pl: "pozdrowienie", ru: "привет, приветствие", relation: derived }
  - { pl: "zdrowie", ru: "здоровье", relation: root, id: zdrowie }
etymology: "От ZDROWIE «здоровье», из праславянского *sъdorvъ — того же корня, что русское «здоровье» и «здоровый». Поприветствовать значило пожелать здоровья, и русский сохранил этот исходный смысл в слове «здравствуй». Наше «поздравить» выросло из того же корня, но ушло к поздравлению, и потому польское pozdrowić, оставшееся при приветствии, сбивает с толку."
memory: "pozdrowić — «поприветствовать», а поздравить будет pogratulować. И повелительное с ó: POZDRÓW, но pozdrowię."
idioms:
  - { pl: "Pozdrawiam serdecznie", ru: "с сердечным приветом" }
  - { pl: "pozdrów ode mnie", ru: "передай от меня привет" }
