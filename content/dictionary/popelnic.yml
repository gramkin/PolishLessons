# review
id: popelnic
format: 2
lemma: "popełnić"
rank: 984
pos: verb
aspect: perf
pron: { cyr: "попэ́униць" }
senses:
  - id: mistake
    ru: "popełnić błąd — совершить ошибку"
    examples:
      - pl: "Popełniłem błąd."
        ru: "Я совершил ошибку."
        source: { kind: translated, id: 521514 }
      - pl: "Popełnił błąd."
        ru: "Он совершил ошибку."
        source: { kind: translated, id: 8715038 }
      - pl: "Popełniliśmy błąd."
        ru: "Мы совершили ошибку."
        source: { kind: translated, id: 3313339 }
  - id: crime
    ru: "совершить (преступление, грех)"
    examples:
      - pl: "Popełniła przestępstwo."
        ru: "Она совершила преступление."
        source: { kind: translated, id: 7679635 }
      - pl: "Jakie przestępstwo popełniłeś?"
        ru: "Какое преступление ты совершил?"
        source: { kind: tatoeba, id: 3867597 }
  - id: suicide
    ru: "popełnić samobójstwo — покончить с собой"
    examples:
      - pl: "Minionej nocy Sami popełnił samobójstwo."
        ru: "Прошлой ночью Сами совершил самоубийство."
        source: { kind: tatoeba, id: 12681802 }
      - pl: "Bohaterka tej powieści popełniła samobójstwo."
        ru: "Героиня романа покончила жизнь самоубийством."
        source: { kind: tatoeba, id: 582170 }
notes:
  - { kind: usage, text: "Страдательное причастие относится к поступку: popełnione błędy, popełnione przestępstwo. Мужско-личной формы popełnieni не бывает — совершают ошибку или преступление, а не людей, поэтому эта форма осталась без примеров." }
  - { kind: government, text: "popełnić coś — винительный падеж без предлога, как русское «совершить что-то»: popełnić błąd, popełnić przestępstwo." }
  - { kind: usage, text: "Слово сочетается только с плохим: błąd «ошибка», przestępstwo «преступление», grzech «грех», samobójstwo «самоубийство». Хорошего им не совершают." }
  - { kind: usage, text: "popełnić samobójstwo — стандартный оборот, буквально «совершить самоубийство», как и в русском." }
  - { kind: usage, text: "Несовершенный вид — popełniać. Отглагольное popełnienie значит «совершение»: w noc popełnienia morderstwa «в ночь совершения убийства»." }
collocations:
  - { pl: "popełnić błąd", ru: "совершить ошибку" }
  - { pl: "popełnić przestępstwo", ru: "совершить преступление" }
  - { pl: "popełnić samobójstwo", ru: "покончить с собой" }
family:
  - { pl: "popełniać", ru: "совершать (несовершенный вид)", relation: aspect }
  - { pl: "popełnienie", ru: "совершение", relation: derived }
etymology: "Приставка po- плюс pełnić «исполнять», от pełny «полный» — буквально «исполнить до конца». Русское «совершить» собрано похоже, от «свершить, завершить»."
memory: "popełnić — «совершить», но только плохое: błąd «ошибку», przestępstwo «преступление», grzech «грех», samobójstwo «самоубийство». Хорошего им не совершают."
idioms:
  - { pl: "popełnić błąd", ru: "совершить ошибку" }
  - { pl: "popełnić samobójstwo", ru: "покончить с собой" }
formExamplesSkip:
  - { form: "popełnieni", reason: "страдательное причастие относится к поступку: popełnione błędy, popełnione przestępstwo, но не к человеку" }
  - { form: "popełniwszy", reason: "книжное деепричастие прошедшего времени; в живой речи не употребляется" }
