etymology: "От прилагательного GŁĘBOKI, из праславянского *glǫbokъ, и то же слово дало русское «глубокий». Соответствие польского носового Ę русскому У здесь регулярно и работает на целом ряде: GŁĘBOKI и «глубокий», WĘZEŁ и «узел», ZĄB и «зуб», DĄB и «дуб». Для русскоговорящего это один из самых полезных фонетических ключей в польском: увидев Ę или Ą, стоит попробовать подставить У или Я и посмотреть, не выйдет ли знакомое слово. Короткая основа GŁĘB- дала существительное GŁĘBIA «глубь» и сравнительную степень GŁĘBIEJ, и в русском та же короткая основа видна в «глуби» и «глубже». Так что супплетивизм здесь общий для двух языков и объясняется одинаково."
memory: "Совпадает с русским «глубоко» во всём, кроме звука. Ключ фонетический: польский носовой ę стоит там, где русский даёт у — głęboki и «глубокий», ząb и «зуб», dąb и «дуб». Ł читается «у», ę перед b звучит «эм»: «гуэмбо́ко». Степени от короткой основы głęb-: głębiej, najgłębiej, как «глубже» от «глуби». Różnica, которой нет в русском: głębia — глубь как пространство, głębokość — глубина как величина."
