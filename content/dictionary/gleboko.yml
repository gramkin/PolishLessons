notes:
  - { kind: government, text: "Наречие, три формы: GŁĘBOKO, GŁĘBIEJ, NAJGŁĘBIEJ. Степени образованы не от GŁĘBOK-, а от основы GŁĘB-, и это супплетивизм того же рода, что у NISKO с его NIŻEJ: формы берутся от короткой основы, которая в положительной степени не показывается. Русский поступает точно так же — «глубоко, глубже» от «глубь». Сравнение строится предлогом OD с родительным или союзом NIŻ: GŁĘBIEJ OD POPRZEDNIEGO, GŁĘBIEJ NIŻ MYŚLELI. Переносное употребление свободно и частотно: GŁĘBOKO PRZEKONANY, GŁĘBOKO ŻAŁOWAĆ." }
  - { kind: false-friend, text: "Значение совпадает с русским «глубоко» во всех употреблениях, и карточка здесь о звуке, не о смысле. Польское GŁĘBOKI и русское «глубокий» — одно праславянское слово, но польский носовой Ę стоит там, где русский даёт У: GŁĘBOKI и «глубокий», как CIĘŻKI и «тяжкий», WĘZEŁ и «узел». Это регулярное соответствие, и оно позволяет узнавать целые группы слов. Вторая половина — буква Ł, которая читается «у», так что начало слова звучит «гуэм», а не «глэм». Собственно GŁĘB «глубь» тоже существует и употребляется в обороте W GŁĄB «в глубь»." }
  - { kind: pronunciation, text: "Читается «гуэмбо́ко», ударение на предпоследнем слоге из трёх. Начальное GŁ даёт «гу», потому что Ł звучит как «у». Буква Ę перед B произносится «эм», а не «эн»: носовой уподобляется следующему губному, как в DOSTĘPNY «достэмпны». В сравнительной GŁĘBIEJ сочетание BIE даёт мягкое «бе»: «гуэ́мбей». В превосходной NAJGŁĘBIEJ четыре слога и ударение на предпоследнем: «найгуэ́мбей»." }
  - { kind: usage, text: "Частотные сочетания: GŁĘBOKO ODDYCHAĆ «глубоко дышать», GŁĘBOKO PRZEKONANY «глубоко убеждённый», GŁĘBOKO W LESIE «глубоко в лесу», SPAĆ GŁĘBOKO, GŁĘBIEJ NIŻ SIĘ WYDAJE. Оборот W GŁĄB с винительным значит «в глубь»: W GŁĄB KRAJU «в глубь страны». Прилагательное GŁĘBOKI значит и «глубокий» о воде, и «глубокий» о чувстве, как русское. Существительное GŁĘBIA означает глубину как пространство, а GŁĘBOKOŚĆ — глубину как измеримую величину, и это различение русский передаёт одним словом." }
