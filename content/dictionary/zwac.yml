# review
id: zwac
format: 2
lemma: "zwać"
rank: 1686
pos: verb
aspect: imperf
pron: { cyr: "зваць" }
senses:
  - id: so-called
    ru: "tak zwany — так называемый"
    examples:
      - pl: "Tak zwane ekologiczne żarówki zawierają rtęć."
        ru: "Так называемые экологичные лампочки содержат ртуть."
        source: { kind: tatoeba, id: 2900720 }
      - pl: "Jego badania oparte są na tak zwanych faktach."
        ru: "Его исследования опираются на так называемые факты."
        source: { kind: translated, id: 780330 }
      - pl: "Ona jest tak zwaną chodzącą encyklopedią."
        ru: "Она — так называемая ходячая энциклопедия."
        source: { kind: translated, id: 944314 }
  - id: call-named
    ru: "звать, называть (книжное, устаревшее); zwany «называемый»"
    examples:
      - pl: "Oto dzwon zwany Big Ben."
        ru: "Вот колокол, называемый Биг-Беном."
        source: { kind: translated, id: 713487 }
      - pl: "Kąt 90 stopni zwany jest kątem prostym."
        ru: "Угол в 90 градусов называется прямым углом."
        source: { kind: translated, id: 356541 }
      - pl: "Wiem jak to zwą."
        ru: "Я знаю, как это называют."
        source: { kind: translated, id: 7891434 }
notes:
  - { kind: usage, text: "Личные формы архаичного спряжения — zowię, zowiesz, zowiemy, zowiecie — и повелительное zowij сегодня не употребляются, поэтому оставлены без примеров. От всего этого ряда в живом языке уцелели только zowie и zowią, да и то главным образом в обороте co się zowie. Современное спряжение — zwę, zwiesz, zwie, zwiemy, zwiecie, zwą." }
  - { kind: usage, text: "Пожелательная форма двойная: обычная книжная — niech zwie, niech zwą; архаичная — niech zowie, niech zowią, та самая, что осталась в обороте co się zowie." }
  - { kind: register, text: "Сам глагол zwać «звать, называть» сегодня книжный и почти вышел из употребления: обычное слово — nazywać (się)." }
  - { kind: false-friend, text: "Русское «Как тебя зовут?» переводится не через zwać, а как Jak się nazywasz? Оборот jak cię zwą звучит архаично, примерно как «как тебя кличут»." }
  - { kind: usage, text: "Зато причастие zwany живёт полной жизнью: tak zwany «так называемый», на письме сокращается как tzw." }
  - { kind: usage, text: "Осталось и выражение co się zowie — «настоящий, что надо»: parada co się zowie «парад что надо»." }
collocations:
  - { pl: "tak zwany", ru: "так называемый" }
  - { pl: "zwany również", ru: "называемый также" }
  - { pl: "co się zowie", ru: "что надо, настоящий" }
family:
  - { pl: "nazywać", ru: "называть", relation: root, id: nazywac }
  - { pl: "nazwa", ru: "название", relation: root }
  - { pl: "wzywać", ru: "вызывать, призывать", relation: root }
etymology: "Праславянское *zъvati — то же слово, что русское «звать». Польское zwać сохранило старый корень, но уступило место приставочному nazywać."
memory: "zwać — книжное «звать, называть»; в живой речи его заменило nazywać się. Но причастие никуда не делось: tak zwany (tzw.) «так называемый» — слово повседневное. И помните: «Как тебя зовут?» — Jak się nazywasz?, а не jak cię zwą."
idioms:
  - { pl: "tak zwany", ru: "так называемый" }
  - { pl: "co się zowie", ru: "что надо, настоящий" }
  - { pl: "jak go zwą", ru: "как его там зовут" }
