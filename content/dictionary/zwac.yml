  - form: "zwana"
    pl: "Ta gra, zwana szachami, ma długą historię."
    ru: "Эта игра, называемая шахматами, имеет долгую историю."
    source: { kind: authored }
  - form: "zwaną"
    pl: "Ona jest tak zwaną chodzącą encyklopedią."
