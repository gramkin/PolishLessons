  - form: "zwaną"
    pl: "Poznałem kobietę zwaną Basią."
    ru: "Я познакомился с женщиной, которую звали Басей."
    source: { kind: authored }
  - form: "zwaną"
    pl: "Idę ulicą zwaną Długą."
    ru: "Я иду по улице, называемой Длинной."
