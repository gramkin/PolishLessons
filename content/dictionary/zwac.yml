  - form: "zwane"
    pl: "W północnej Afryce leży państwo zwane Algieria."
    ru: "В Северной Африке лежит государство, называемое Алжиром."
    source: { kind: translated, id: 10667873 }
  - form: "zwane"
    pl: "To są tak zwane koszty ukryte."
    ru: "Это так называемые скрытые расходы."
    source: { kind: authored }
  - form: "zwanego"
    pl: "Jest wprawdzie wielkim uczonym, ale brakuje mu tak zwanego zdrowego rozsądku."
    ru: "Он, правда, большой учёный, но ему не хватает так называемого здравого смысла."
    source: { kind: translated, id: 780328 }
  - form: "zwanego"
    pl: "Szukam człowieka zwanego Kowalskim."
    ru: "Я ищу человека по фамилии Ковальский."
    source: { kind: authored }
  - form: "zwanego"
    pl: "Nie znam tego tak zwanego eksperta."
