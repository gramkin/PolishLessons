  - form: "zwani"
    pl: "W feudalnej Japonii najwięksi właściciele ziemscy zwani byli „daimyo”."
    ru: "В феодальной Японии крупнейшие землевладельцы назывались даймё."
    source: { kind: translated, id: 760270 }
  - form: "zwani"
