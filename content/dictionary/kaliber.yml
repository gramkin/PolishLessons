etymology: "Из французского CALIBRE; дальше — через итальянский, вероятно, из арабского «форма для литья». Русское «калибр» — то же слово."
memory: "Kaliber — калибр, с e: kaliber, kalibru. Sprawa dużego kalibru — крупное дело. Читается «ка́либэр»."
idioms:
  - { pl: "sprawa dużego kalibru", ru: "крупное, серьёзное дело" }
