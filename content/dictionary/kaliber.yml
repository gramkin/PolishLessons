  - id: stature
    ru: "калибр, масштаб (перен.)"
    examples:
      - pl: "To polityk najwyższego kalibru."
        ru: "Это политик высочайшего калибра."
        source: { kind: authored }
      - pl: "Problem tego kalibru wymaga eksperta."
        ru: "Проблема такого масштаба требует эксперта."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "KALIBER — «калибр», с E между B и R: KALIBER. В переносном смысле — «масштаб, уровень»: SPRAWA DUŻEGO KALIBRU, «крупное дело». E выпадает в косвенных: KALIBRU." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. E беглое: KALIBER, но KALIBRU, KALIBRY. В местном R переходит в RZ: W KALIBRZE." }
  - { kind: government, text: "Калибра чего — родительный: BROŃ DUŻEGO KALIBRU. Такого масштаба — TEGO KALIBRU, родительный. Пистолет калибра 9 мм — PISTOLET KALIBRU 9 MM." }
  - { kind: pronunciation, text: "Читается «ка́либэр», ударение на первом слоге. KALIBRU — «кали́бру», KALIBRZE — «кали́бжэ»." }
collocations:
  - { pl: "duży kaliber", ru: "крупный калибр" }
  - { pl: "tego kalibru", ru: "такого масштаба" }
  - { pl: "najwyższego kalibru", ru: "высочайшего уровня" }
