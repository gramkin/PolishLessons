# review
id: tetnic
format: 2
lemma: "tętnić"
rank: 6009
pos: verb
aspect: imperf
pron: { cyr: "тэ́нтниць" }
senses:
  - id: throb
    ru: "пульсировать, стучать (о крови, боли, сердце)"
    examples:
      - pl: "Krew tętni mi w skroniach."
        ru: "Кровь стучит у меня в висках."
        source: { kind: authored }
      - pl: "Ból tętni w zranionym palcu."
        ru: "Боль пульсирует в раненом пальце."
        source: { kind: authored }
  - id: teem
    ru: "кипеть, бурлить (жизнью); звенеть (музыкой)"
    examples:
      - pl: "Miasto tętni życiem do późnej nocy."
        ru: "Город кипит жизнью до поздней ночи."
        source: { kind: authored }
      - pl: "Ulice Krakowa tętnią muzyką."
        ru: "Улицы Кракова звенят музыкой."
        source: { kind: authored }
  - id: resound
    ru: "гулко стучать, гудеть (о шагах, копытах; книжн.)"
    examples:
      - pl: "Na korytarzu tętnią czyjeś kroki."
        ru: "В коридоре гулко раздаются чьи-то шаги."
        source: { kind: authored }
      - pl: "Ziemia tętniła pod kopytami koni."
        ru: "Земля гудела под копытами коней."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Главное выражение — TĘTNIĆ ŻYCIEM «кипеть жизнью»: о городе, улице, рынке. О людях говорят в том же духе: TĘTNIĆ ENERGIĄ «быть полным энергии». Значение «гулко стучать» (о копытах, шагах) — книжное." }
  - { kind: government, text: "Чем — творительный без предлога: TĘTNIĆ ŻYCIEM, MUZYKĄ, ENERGIĄ. Где — W с предложным: KREW TĘTNI W SKRONIACH «кровь стучит в висках»." }
  - { kind: usage, text: "Того же корня TĘTNO «пульс» и TĘTNICA «артерия»; глагол из них — только TĘTNIĆ. Прямого русского родственника нет, по смыслу ближе всего «пульсировать», «стучать»." }
  - { kind: pronunciation, text: "Читается «тэ́нтниць»: Ę перед T звучит как «эн». Ударение на первом слоге: TĘTNI — «тэ́нтни»." }
collocations:
  - { pl: "tętnić życiem", ru: "кипеть жизнью" }
  - { pl: "krew tętni w skroniach", ru: "кровь стучит в висках" }
  - { pl: "tętniący ból", ru: "пульсирующая боль" }
family:
  - { pl: "tętno", ru: "пульс", relation: derived, id: tetno }
  - { pl: "tętnica", ru: "артерия", relation: derived, id: tetnica }
  - { pl: "tętnienie", ru: "пульсация; гулкий стук", relation: derived }
synonyms: ["pulsować", "dudnić", "kipieć"]
etymology: "Праславянское *tǫtъnati «гудеть, грохотать», звукоподражательного происхождения; ср. болгарское тъ̀тна «гудеть». Исходно — «гулко стучать», отсюда TĘTNO «пульс»."
memory: "Tętnić — стучать, как пульс (tętno): krew tętni w skroniach. Город тоже пульсирует — tętni życiem."
idioms:
  - { pl: "tętnić życiem", ru: "кипеть жизнью, бить ключом" }
formExamplesSkip:
  - { form: "tętniono", reason: "безличная форма на -NO называет действие людей, а TĘTNIĆ говорят о крови, сердце, городе: такой формы в речи нет" }
