notes:
  - { kind: usage, text: "Два оборота из быта стоит знать сразу. SKRZYNKA POCZTOWA — почтовый ящик у двери, а SKRZYNKA MAILOWA — ящик электронной почты, и слово то же. Дательный и предложный — SKRZYNCE, с переходом k→c, а родительный множественного — SKRZYNEK, с беглым e." }
  - { kind: false-friend, text: "Русский когнат спрятан в говорах. Польская skrzynka — уменьшительное от skrzynia «сундук», а то же слово живёт в украинском «скриня» и русском диалектном «скрыня», тоже «сундук». В литературном русском его нет, поэтому опереться не на что, и слово приходится запоминать." }
  - { kind: pronunciation, text: "Два слога, ударение на первом: SKRZYN-ka. Sk плюс rz дают сочетание «скш», y читается как ы: «скшы́нка». Форма skrzynce звучит «скшы́нцэ»." }
collocations:
