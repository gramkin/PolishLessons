etymology: "Уменьшительное от skrzynia «сундук», из латинского scrinium «ящик для свитков». То же латинское слово дало английское shrine «святилище» — исходно ларец для реликвий. В украинском это «скриня», в русских говорах «скрыня», а литературный русский слова не сохранил."
memory: "skrzynka — «ящик», уменьшительное от skrzynia «сундук». Два обихода: skrzynka pocztowa и skrzynka mailowa. Формы с чередованиями: skrzynce и skrzynek. Корень — латинское scrinium, то же, что в английском shrine."
idioms:
  - { pl: "skrzynka biegów", ru: "коробка передач" }
  - { pl: "czarna skrzynka", ru: "чёрный ящик" }
