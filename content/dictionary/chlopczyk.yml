etymology: "Уменьшительное от CHŁOPIEC, а то — от CHŁOP «мужик». Русское «холоп» — того же корня, но с другим смыслом."
memory: "Chłopczyk — мальчик, мальчуган. Urodził się chłopczyk — родился мальчик. Chłop — мужик. Читается «хуо́пчык»."
