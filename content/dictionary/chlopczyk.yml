        ru: "В глубине души он всё ещё мальчишка."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "CHŁOPCZYK — «мальчик, мальчуган», уменьшительное от CHŁOPIEC. Совсем маленький — CHŁOPCZYK, подросток — CHŁOPAK. Не путайте с CHŁOP — «крестьянин, мужик»." }
  - { kind: usage, text: "Мужской род, лицо. Множественное — CHŁOPCZYKI; CHŁOPCZYKOWIE не используется. Местный и звательный — CHŁOPCZYKU." }
  - { kind: government, text: "Родился мальчик — URODZIŁ SIĘ CHŁOPCZYK. Мальчик с собакой — CHŁOPCZYK Z PSEM, творительный. Купить мальчику — KUPIĆ CHŁOPCZYKOWI." }
  - { kind: pronunciation, text: "Читается «хуо́пчык»: CH — «х», Ł — «у», CZ — «ч». Ударение на первом слоге." }
collocations:
  - { pl: "mały chłopczyk", ru: "маленький мальчик" }
  - { pl: "urodził się chłopczyk", ru: "родился мальчик" }
