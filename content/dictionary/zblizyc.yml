        source: { kind: authored }
  - id: bring-together
    ru: "сблизить (людей, позиции)"
    examples:
      - pl: "Wspólny kłopot zbliżył ich do siebie."
        ru: "Общая беда сблизила их."
        source: { kind: authored }
      - pl: "Zbliżeni do siebie ludzie rozumieją się bez słów."
        ru: "Сблизившиеся люди понимают друг друга без слов."
        source: { kind: authored }
  - id: similar
    ru: "zbliżony — близкий, схожий"
    examples:
      - pl: "Jego pogląd jest zbliżony do mojego."
        ru: "Его взгляд близок к моему."
        source: { kind: authored }
      - pl: "Oba wyniki są zbliżone."
        ru: "Оба результата близки."
        source: { kind: authored }
  - id: closeness
    ru: "zbliżenie — сближение; крупный план"
    examples:
      - pl: "Zbliżenie obu stanowisk zajęło miesiąc."
        ru: "Сближение обеих позиций заняло месяц."
        source: { kind: authored }
      - pl: "W zbliżeniu widać każdą zmarszczkę."
        ru: "Крупным планом видна каждая морщина."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Родство полное: z- плюс bliski «близкий», праславянское *blizъ — то же слово, что русские «близкий», «ближе», «приблизить». Запоминать значение не нужно. Стоит заметить только двойственность существительного: zbliżenie это и «сближение» (между людьми, странами, позициями), и кинематографический «крупный план»." }
  - { kind: government, text: "Приближают К ЧЕМУ — предлог DO с РОДИТЕЛЬНЫМ: zbliżyć krzesło do stołu, zbliżony do prawdy. Русский здесь берёт дательный с «к» («приблизить к столу»), так что падеж приходится менять, хотя корень тот же. Возвратное zbliżyć się do czegoś значит «приблизиться»." }
  - { kind: pronunciation, text: "Причастие идёт по образцу -ony/-eni, уже выведенному на соседних карточках: глаголы на -ić и -yć дают zbliżony — zbliżeni, namierzony — namierzeni, как zatrudniony — zatrudnieni. Отдельно запоминать не нужно: класс причастия предсказуем по инфинитиву." }
collocations:
  - { pl: "zbliżyć się do kogoś", ru: "сблизиться с кем-л." }
  - { pl: "zbliżony do prawdy", ru: "близкий к правде" }
  - { pl: "w zbliżeniu", ru: "крупным планом" }
family:
  - { pl: "bliski", ru: "близкий", relation: root, id: bliski }
  - { pl: "zbliżać", ru: "приближать, сближать", relation: aspect, id: zblizac }
  - { pl: "blisko", ru: "близко", relation: derived, id: blisko }
etymology: "Приставка z- плюс bliski «близкий», от праславянского *blizъ. Русские «близкий», «ближе», «приблизить» и «сблизиться» — из того же гнезда, причём с теми же приставками, так что всё семейство прозрачно: blisko «близко», bliźniak «близнец», pobliże «окрестность»."
memory: "zbliżyć — «приблизить, сблизить», от bliski «близкий». Корень и приставки русские, меняется только падеж: приближают DO czegoś в родительном, а не «к чему-то» в дательном. И помните zbliżenie — это и «сближение», и «крупный план»."
idioms:
