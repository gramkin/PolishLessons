id: zblizyc
format: 2
lemma: "zbliżyć"
rank: 1783
pos: verb
pron: { cyr: "збли́жыць" }
senses:
  - id: bring-closer
    ru: "приблизить, придвинуть"
    examples:
      - pl: "Zbliżył krzesło do łóżka."
