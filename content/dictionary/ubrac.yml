# review
id: ubrac
format: 2
lemma: "ubrać"
rank: 887
pos: verb
aspect: perf
pron: { cyr: "у́браць" }
senses:
  - id: dress
    ru: "ubrać się — одеться"
    note: "Не «убрать»! Убирать по-польски — sprzątać."
    examples:
      - pl: "Muszę się ładnie ubrać."
        ru: "Мне надо красиво одеться."
        source: { kind: translated, id: 1007302 }
      - pl: "Tom się ubrał."
        ru: "Том оделся."
        source: { kind: translated, id: 8745230 }
      - pl: "Ubrała się."
        ru: "Она оделась."
        source: { kind: translated, id: 6541896 }
  - id: dress-someone
    ru: "одеть (кого-л.)"
    examples:
      - pl: "Ubierz ją."
        ru: "Одень её."
        source: { kind: translated, id: 8730317 }
      - pl: "Ubierzcie się ciepło."
        ru: "Оденьтесь потеплее."
        source: { kind: translated, id: 10596403 }
      - pl: "Ubierzmy choinkę."
        ru: "Давай нарядим ёлку."
        source: { kind: translated, id: 4408551 }
  - id: dressed
    ru: "ubrany — одетый; ubranie — одежда"
    examples:
      - pl: "Pielęgniarka jest ubrana na biało."
        ru: "Медсестра одета в белое."
        source: { kind: tatoeba, id: 3653833 }
      - pl: "Moje ubranie jest szare."
        ru: "Моя одежда серая."
        source: { kind: tatoeba, id: 831850 }
      - pl: "Ona zawsze kupuje drogie ubrania."
        ru: "Она всегда покупает дорогую одежду."
        source: { kind: tatoeba, id: 2983812 }
notes:
  - { kind: false-friend, text: "ubrać — это «одеть», а не «убрать». Русское «убрать» по-польски будет sprzątnąć (убрать комнату) или zabrać, usunąć (убрать со стола). Ubierz się! значит «Оденься!», и ничего больше." }
  - { kind: usage, text: "Строго говоря, одевают человека, а не вещь: ubrać dziecko «одеть ребёнка», ubrać się «одеться». Про одежду правильнее сказать założyć coś или włożyć coś: założyć koszulę «надеть рубашку». Оборот ubrać koszulę в живой речи встречается часто, но грамотным не считается." }
  - { kind: government, text: "ubrać się W coś «одеться во что-то» — винительный после w: ubrała się w sukienkę. Несовершенный вид — ubierać." }
  - { kind: usage, text: "Существительное ubranie значит «одежда», а ubrany — «одетый»: ubrany na czarno «одетый в чёрное». Ещё говорят ubrać choinkę «нарядить ёлку»." }
collocations:
  - { pl: "ubrać się", ru: "одеться" }
  - { pl: "ubrany na czarno", ru: "одетый в чёрное" }
  - { pl: "ubrać choinkę", ru: "нарядить ёлку" }
  - { pl: "ubranie", ru: "одежда" }
family:
  - { pl: "ubierać", ru: "одевать", relation: aspect }
  - { pl: "ubranie", ru: "одежда", relation: derived }
  - { pl: "ubiór", ru: "одеяние", relation: derived }
  - { pl: "brać", ru: "брать", relation: root }
etymology: "Из u- + brać «брать». Значение «одеть» развилось из «обобрать, обрядить»; русское «убрать» пошло от того же корня, но в другую сторону — отсюда и ловушка."
memory: "ubrać — «одеть», а не «убрать»: убирать комнату по-польски sprzątać. С się выходит «одеться»: Ubierz się! И запомните тонкость: одевают человека (ubrać dziecko), а вещь надевают — założyć koszulę. Существительное ubranie значит «одежда»."
idioms:
  - { pl: "ubrać się", ru: "одеться" }
  - { pl: "ubrany na czarno", ru: "одетый в чёрное" }
  - { pl: "ubrać choinkę", ru: "нарядить ёлку" }
