notes:
  - { kind: false-friend, text: "WSTRZĄS — «потрясение, шок» и «толчок»: WSTRZĄS SEJSMICZNY, «подземный толчок». Медицинское: WSTRZĄS MÓZGU — «сотрясение мозга», WSTRZĄS ANAFILAKTYCZNY — «анафилактический шок». Бытовое «шок» — SZOK." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. В местном S смягчается: WE WSTRZĄSIE." }
  - { kind: government, text: "В состоянии шока — W STANIE WSTRZĄSU, родительный. Пережить потрясение — PRZEŻYĆ WSTRZĄS, винительный. Сотрясение мозга — WSTRZĄS MÓZGU." }
  - { kind: pronunciation, text: "Читается «фстшонс», один слог: W оглушается в «ф», STRZ — «стш», Ą перед S — «он». WSTRZĄSU — «фстшо́нсу»." }
collocations:
  - { pl: "wstrząs mózgu", ru: "сотрясение мозга" }
  - { pl: "wstrząs sejsmiczny", ru: "подземный толчок" }
  - { pl: "wstrząs anafilaktyczny", ru: "анафилактический шок" }
family:
  - { pl: "wstrząsnąć", ru: "потрясти", relation: root, id: wstrzasnac }
