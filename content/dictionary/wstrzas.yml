etymology: "От WSTRZĄSNĄĆ «встряхнуть, потрясти», корень TRZĄŚĆ, как в русском «трясти». Польское Ą на месте русского «я»."
memory: "Wstrząs — потрясение, шок, толчок. Wstrząs mózgu — сотрясение мозга. Читается «фстшонс»."
idioms:
