# review
id: ktory
format: 2
lemma: "który"
rank: 31
pos: adj
pron: { cyr: "кту́ры" }
senses:
  - id: which-q
    ru: "который?, какой? (вопрос)"
    examples:
      - pl: "Który?"
        ru: "Который?"
        source: { kind: tatoeba, id: 4748373 }
      - pl: "Która godzina?"
        ru: "Который час?"
        source: { kind: tatoeba, id: 449607 }
  - id: which-rel
    ru: "который (относительное)"
    examples:
      - pl: "Psy, które szczekają, nie gryzą."
        ru: "Собаки, которые лают, не кусаются."
        source: { kind: tatoeba, id: 1170352 }
      - pl: "Jest wiele słów, których nie rozumiem."
        ru: "Есть много слов, которые я не понимаю."
        source: { kind: tatoeba, id: 590802 }
      - pl: "On jest jedynym przyjacielem, któremu ufam."
        ru: "Он единственный друг, которому я доверяю."
        source: { kind: tatoeba, id: 1046128 }
notes:
  - { kind: usage, text: "Род и число берутся от главного слова, падеж — от роли в придаточном, как в русском." }
  - { kind: usage, text: "O której? значит «во сколько?»: O której wstajesz?" }
collocations:
  - { pl: "o której godzinie", ru: "в котором часу" }
  - { pl: "w którym", ru: "в котором" }
etymology: "Праславянское *kotoryjь — то же слово, что русское «который»."
memory: "Работает как русское «который»: род и число — от существительного, падеж — от места в придаточном. Вопрос о времени строится через него же: O której godzinie? «В котором часу?»."
idioms:
  - { pl: "o której godzinie", ru: "в котором часу" }
  - { pl: "nie wiadomo który", ru: "неизвестно какой" }
formExamplesSkip:
  - { form: "któren", reason: "Устаревший и диалектный вариант który; в современном литературном языке не употребляется." }
