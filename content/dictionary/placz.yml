notes:
  - { kind: false-friend, text: "PŁACZ — «плач», то же слово с Ł. WYBUCHNĄĆ PŁACZEM — «разрыдаться», буквально «взорваться плачем». Плакать — PŁAKAĆ, PŁACZĘ, PŁACZESZ: формы глагола совпадают по звучанию с существительным." }
  - { kind: usage, text: "Мужской род, неодушевлённое. Учим единственное: PŁACZ, PŁACZU, PŁACZOWI, PŁACZEM. Множественное почти не используется." }
  - { kind: government, text: "Разразиться плачем — WYBUCHNĄĆ PŁACZEM, творительный. Сквозь слёзы — PRZEZ PŁACZ, винительный. До слёз — DO PŁACZU: ŚMIAĆ SIĘ DO PŁACZU." }
  - { kind: pronunciation, text: "Читается «пуач», один слог: Ł — «у», CZ — «ч». PŁACZU — «пуа́чу»." }
