# review
id: startowac
format: 2
lemma: "startować"
rank: 3902
pos: verb
pron: { cyr: "старто́ваць" }
senses:
  - id: compete
    ru: "стартовать, выступать (в соревнованиях)"
    examples:
      - pl: "Startuje w maratonie co roku."
        ru: "Он каждый год бежит марафон."
        source: { kind: authored }
      - pl: "Nasza drużyna startuje w lidze europejskiej."
        ru: "Наша команда выступает в европейской лиге."
        source: { kind: authored }
      - pl: "Startowała na dwóch olimpiadach."
        ru: "Она выступала на двух Олимпиадах."
        source: { kind: authored }
  - id: take-off
    ru: "взлетать (о самолёте); баллотироваться (STARTOWAĆ W WYBORACH)"
    examples:
      - pl: "Samolot startuje za dziesięć minut."
        ru: "Самолёт взлетает через десять минут."
        source: { kind: authored }
      - pl: "Startuje w wyborach na prezydenta miasta."
        ru: "Он баллотируется в мэры."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "STARTOWAĆ — «стартовать», но шире: о самолёте — «взлетать» (SAMOLOT STARTUJE), о политике — «баллотироваться» (STARTOWAĆ W WYBORACH), о спортсмене — «выступать». Разговорное STARTOWAĆ DO KOGOŚ — «подкатывать к кому-то»." }
  - { kind: usage, text: "Несовершенный вид; совершенный — WYSTARTOWAĆ. Спряжение на -UJĘ: STARTUJĘ, STARTUJESZ, STARTUJĄ. Отглагольное существительное (вместо него говорят START) и безличное STARTOWANO в карточку не включены." }
  - { kind: government, text: "В чём — W с предложным: STARTOWAĆ W ZAWODACH, W WYBORACH. Откуда — Z с родительным: STARTOWAĆ Z LOTNISKA. На что, на какую должность — NA с винительным: STARTOWAĆ NA BURMISTRZA." }
  - { kind: pronunciation, text: "Читается «старто́ваць»: ударение на предпоследнем слоге. STARTUJE — «старту́е»." }
  - { kind: register, text: "Нейтральное слово: спорт, авиация, политика. Разговорное STARTOWAĆ DO DZIEWCZYNY — «подкатывать к девушке» — шутливое." }
collocations:
  - { pl: "startować w zawodach", ru: "выступать на соревнованиях" }
  - { pl: "startować w wyborach", ru: "баллотироваться на выборах" }
  - { pl: "samolot startuje", ru: "самолёт взлетает" }
family:
  - { pl: "wystartować", ru: "стартовать, взлететь", relation: aspect }
  - { pl: "start", ru: "старт, взлёт", relation: derived, id: start }
  - { pl: "lot", ru: "полёт", relation: root, id: lot }
etymology: "От START, из английского START «начало, старт». Глагол образован польским суффиксом -OWAĆ, как и русское «стартовать»."
memory: "Startować — стартовать, выступать; samolot startuje — взлетает; startować w wyborach — баллотироваться."
idioms:
  - { pl: "startować do kogoś", ru: "подкатывать к кому-то (разг.)" }
formExamplesSkip:
  - { form: "startowanie", reason: "вместо отглагольного существительного говорят START" }
  - { form: "startowania", reason: "вместо отглагольного существительного говорят START" }
