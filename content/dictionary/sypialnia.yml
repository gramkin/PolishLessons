notes:
  - { kind: usage, text: "Образовано от spać «спать» с суффиксом -alnia, как jadalnia «столовая» от jeść: место для действия." }
  - { kind: government, text: "Где — w sypialni (предложный падеж), куда — do sypialni (родительный): wbiegł do sypialni «он вбежал в спальню»." }
  - { kind: usage, text: "В объявлениях о жилье считают спальни: dom z dwoma sypialniami «дом с двумя спальнями»." }
  - { kind: usage, text: "Переносно sypialnia — «спальный район» большого города, где только жильё и никакой работы." }
collocations:
  - { pl: "w sypialni", ru: "в спальне" }
  - { pl: "do sypialni", ru: "в спальню" }
  - { pl: "dom z dwoma sypialniami", ru: "дом с двумя спальнями" }
family:
  - { pl: "spać", ru: "спать", relation: root }
  - { pl: "jadalnia", ru: "столовая", relation: root }
  - { pl: "łóżko", ru: "кровать", relation: root, id: lozko }
etymology: "От spać «спать» с суффиксом -alnia, обозначающим место: как jadalnia «столовая» от jeść. Русское «спальня» собрано тем же способом."
memory: "sypialnia — «спальня», от spać «спать». Где — w sypialni, куда — do sypialni. А ещё так называют спальный район города."
idioms:
