# review
id: stanowczo
format: 2
lemma: "stanowczo"
rank: 2155
pos: adv
pron: { cyr: "стано́фчо" }
senses:
  - id: firmly
    ru: "решительно, твёрдо"
    examples:
      - pl: "Stanowczo cię popieramy."
        ru: "Мы решительно тебя поддерживаем."
        source: { kind: translated, id: 676824 }
      - pl: "Stanowczo zabroniłem Tomowi tam iść."
        ru: "Я решительно запретил Тому туда идти."
        source: { kind: translated, id: 4135866 }
      - pl: "Odmówił stanowczo."
        ru: "Он решительно отказался."
        source: { kind: authored }
  - id: decidedly
    ru: "решительно, явно (усиление перед za)"
    examples:
      - pl: "Zjedliśmy wczorajszej nocy stanowczo zbyt dużo."
        ru: "Вчера вечером мы съели решительно слишком много."
        source: { kind: translated, id: 9686296 }
      - pl: "To stanowczo za drogo."
        ru: "Это решительно слишком дорого."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Два употребления: «решительно» о действии и усилительное перед za — stanowczo za dużo «решительно слишком много»." }
  - { kind: false-friend, text: "Корень stanowić «устанавливать, составлять», от stać «стоять»; ср. русское «постановить», «становиться»." }
  - { kind: government, text: "Не изменяется; прилагательное — stanowczy «решительный»." }
  - { kind: usage, text: "В официальной речи stanowczo protestujemy «решительно протестуем» — стандартная формула." }
collocations:
  - { pl: "stanowczo za dużo", ru: "решительно слишком много" }
  - { pl: "stanowczo odmówić", ru: "решительно отказаться" }
etymology: "От stanowczy «решительный», от stanowić «устанавливать», от stać «стоять»; ср. русское «постановить»."
memory: "stanowczo — «решительно». Второе употребление усилительное: stanowczo za dużo «решительно слишком много», где слово стоит перед za."
idioms:
