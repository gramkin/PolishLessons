notes:
  - { kind: false-friend, text: "Главная трудность у этого слова не смысловая, а зрительная: имя Tom и существительное tom «том» различаются только заглавной буквой, а в косвенных падежах совпадают полностью. Zapomnij o Tomie — «Забудь о Томе», а w pierwszym tomie — «в первом томе». Ориентируйтесь на заглавную букву и на смысл." }
  - { kind: usage, text: "Слово книжное и в разговоре редкое: в корпусе почти все примеры с этими буквами относятся к имени. Уменьшительное — tomik «томик»." }
  - { kind: usage, text: "Порядковое числительное ставится перед словом: pierwszy tom, drugi tom. «В двух томах» — w dwóch tomach." }
  - { kind: pronunciation, text: "Читается ровно как русское «том», с тем же гласным." }
collocations:
  - { pl: "pierwszy tom", ru: "первый том" }
  - { pl: "w dwóch tomach", ru: "в двух томах" }
  - { pl: "gruby tom", ru: "толстый том" }
  - { pl: "tomik wierszy", ru: "томик стихов" }
family:
  - { pl: "tomik", ru: "томик", relation: derived }
etymology: "Из греческого τόμος «отрезок, часть», от τέμνω «резать»: том — это «часть», отрезанная от целого сочинения. Русское «том» — то же заимствование."
memory: "tom — «том», часть многотомного издания. Слово книжное, и главная его трудность не в смысле: имя Tom отличается от него только заглавной буквой, а в косвенных падежах они совпадают целиком. w pierwszym tomie — «в первом томе», o Tomie — «о Томе»."
idioms:
  - { pl: "pierwszy tom", ru: "первый том" }
  - { pl: "w dwóch tomach", ru: "в двух томах" }
  - { pl: "tomik wierszy", ru: "томик стихов" }
formExamplesSkip:
  - { form: "tomie", cell: "Звательный", reason: "звательный падеж: для неодушевлённого существительного он практически не употребляется" }
