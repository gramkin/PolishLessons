notes:
  - { kind: false-friend, text: "BYK — «бык», но в школьном жаргоне ещё и «грубая ошибка», особенно орфографическая: STRZELIĆ BYKA, ZROBIĆ BYKA. Учитель подчёркивает «быков» красным. Знак зодиака Телец — тоже BYK." }
  - { kind: usage, text: "Десять форм, мужской род, одушевлённое: винительный равен родительному, WIDZĘ BYKA, ZROBIĆ BYKA. Во множественном — BYKI, как у животных. Творительный — BYKIEM: K перед I смягчается." }
  - { kind: government, text: "Сделать ошибку — STRZELIĆ BYKA или ZROBIĆ BYKA, винительный в форме родительного. Бой быков — WALKA BYKÓW, родительный множественного." }
  - { kind: pronunciation, text: "Читается «бык», один слог. Y — «ы», конечное K глухое." }
collocations:
  - { pl: "walka byków", ru: "бой быков, коррида" }
  - { pl: "strzelić byka", ru: "сделать грубую ошибку" }
  - { pl: "silny jak byk", ru: "сильный как бык" }
family:
  - { pl: "byczek", ru: "бычок", relation: derived }
  - { pl: "byczy", ru: "бычий", relation: derived }
  - { pl: "byczo", ru: "классно, здорово (разг.)", relation: derived }
etymology: "Общеславянское слово, вероятно звукоподражательное — по рёву животного. Русское «бык» — то же слово. Школьное значение «ошибка» — шутливая метафора: грубая, заметная, как бык в огороде."
memory: "Byk — бык и грубая ошибка: strzelić byka. Читается «бык». Wziąć byka za rogi — взять быка за рога. Byczo — классно."
idioms:
  - { pl: "wziąć byka za rogi", ru: "взять быка за рога" }
