# review
id: sen
format: 2
lemma: "sen"
rank: 552
pos: noun
pron: { cyr: "сэн" }
senses:
  - id: sleep
    ru: "сон как состояние"
    examples:
      - pl: "Sen jest niezbędny do życia."
        ru: "Сон необходим для жизни."
        source: { kind: tatoeba, id: 4894261 }
      - pl: "Zawsze biorę kąpiel przed snem."
        ru: "Я всегда принимаю ванну перед сном."
        source: { kind: tatoeba, id: 1645409 }
      - pl: "Tomek ma problemy ze snem."
        ru: "У Тома проблемы со сном."
        source: { kind: tatoeba, id: 3464200 }
  - id: dream
    ru: "сон как сновидение; мечта"
    examples:
      - pl: "To nie sen."
        ru: "Это не сон."
        source: { kind: tatoeba, id: 13387576 }
      - pl: "Ostatniej nocy miałam dziwny sen."
        ru: "Прошлой ночью мне приснился странный сон."
        source: { kind: tatoeba, id: 5920934 }
      - pl: "Widziałem cię we śnie."
        ru: "Во сне я видел тебя."
        source: { kind: tatoeba, id: 2008942 }
notes:
  - { kind: usage, text: "Праславянское *sъnъ; русское «сон» — то же самое слово, и оба значения совпадают: и «состояние сна», и «сновидение»." }
  - { kind: usage, text: "Основа меняется при склонении: sen, но snu, snem, o śnie. Беглое e исчезает точно так же, как в русском «сон — сна»." }
  - { kind: usage, text: "we śnie — «во сне»: Widziałem cię we śnie. Предлог w переходит в we перед скоплением согласных." }
  - { kind: usage, text: "Пожелания на ночь: Miłych snów! и Słodkich snów! — «Приятных снов!», «Сладких снов!»" }
collocations:
  - { pl: "we śnie", ru: "во сне" }
  - { pl: "miłych snów!", ru: "приятных снов!" }
  - { pl: "przed snem", ru: "перед сном" }
  - { pl: "mieć sen", ru: "видеть сон" }
etymology: "Праславянское *sъnъ из *sъpnъ, от корня «спать». Русское «сон», чешское sen, украинское «сон» — то же слово; родственны латинское somnus и греческое ὕπνος."
memory: "sen — «сон», причём в обоих смыслах сразу, как и в русском: и состояние, и сновидение. Основа с беглым e ведёт себя точно как русская: sen, но snu, snem — ровно «сон, но сна, сном». Запомните we śnie «во сне» и пожелание Miłych snów! «Приятных снов!»"
idioms:
  - { pl: "we śnie", ru: "во сне" }
  - { pl: "miłych snów!", ru: "приятных снов!" }
  - { pl: "kamienny sen", ru: "мёртвый сон" }
