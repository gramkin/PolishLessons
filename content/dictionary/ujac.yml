  - { pl: "wyjąć", ru: "вынуть", relation: root, id: wyjac }
  - { pl: "ujęcie", ru: "кадр; трактовка", relation: derived }
etymology: "Приставка u- и JĄĆ «взять», из праславянского *jęti — того же корня, что русские «взять», «изъять», «объять» и «понять», где тот же корень спрятан за приставками. Русский простого глагола от этого корня не удержал вовсе и живёт только приставочными: «занять», «принять», «изъять». Польский удержал и его, и весь класс на -jąć с основой -jm- в будущем, так что ująć, wyjąć, zająć, przyjąć стоят в одном ряду."
memory: "Инфинитив на -jąć, будущее на -jm-: ująć — ujmę, ujmij. И в прошедшем ą только там, где слог закрыт: ujął, но ujęła."
idioms:
