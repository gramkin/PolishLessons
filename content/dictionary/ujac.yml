notes:
  - { kind: usage, text: "Инфинитив и будущее время у этого глагола построены на разных основах, и по инфинитиву будущее не угадать. UJĄĆ даёт UJMĘ, UJMIESZ, UJMIE и повелительное UJMIJ: сочетание -jąć уходит, на его месте появляется -jm-. Так же устроен весь класс: WYJĄĆ даёт WYJMĘ, ZAJĄĆ даёт ZAJMĘ, PRZYJĄĆ даёт PRZYJMĘ. Запоминать такие глаголы надо парой, инфинитив вместе с первым лицом, иначе формы будущего придётся угадывать." }
  - { kind: pronunciation, text: "В прошедшем времени ą и ę чередуются по положению, и это третий случай в словаре после URZĄD и ŚWIĘTO, а в глаголе первый. UJĄŁ стоит с ą, потому что слог закрыт согласным ł на конце; UJĘŁA, UJĘLI, UJĘTY, UJĘCIE стоят с ę, потому что за ł идёт гласная и слог открывается. Правило то же, что у существительных, только видно его внутри одной формы времени: ujął, но ujęła. Проверять надо не по смыслу, а по тому, закрывается ли слог." }
  - { kind: usage, text: "Вид совершенный, пара к несовершенному UJMOWAĆ, и пара эта поучительна: несовершенный построен не на основе инфинитива ująć, а на той самой основе -jm-, что в будущем времени — ujmować, ujmuję. Значит основа -jm- в этом классе главная, а -jąć надо считать особенностью одного только инфинитива и прошедшего времени." }
  - { kind: usage, text: "Смыслов у глагола три, и русскому они отвечают разными словами. Первый буквальный: UJĄĆ COŚ значит «взять, схватить» — ująć za rękę, ująć sprawcę «задержать преступника». Второй книжный: «изложить, выразить» — ująć w słowa, krótko ująć, и от него же существительное UJĘCIE, которое значит и «трактовка», и «кадр» в кино. Третий переносный: UJĄĆ KOGOŚ значит «расположить к себе» — ujęła nas szczerością. Есть и четвёртый, арифметический: ująć czegoś значит «убавить, вычесть»." }
collocations:
  - { pl: "ująć w słowa", ru: "выразить словами" }
  - { pl: "ująć za rękę", ru: "взять за руку" }
