# review
id: uscisk
format: 2
lemma: "uścisk"
rank: 4202
pos: noun
pron: { cyr: "у́сьциск" }
senses:
  - id: embrace
    ru: "объятие, пожатие"
    examples:
      - pl: "Okazują sobie miłość uściskami."
        ru: "Они выражают любовь объятиями."
        source: { kind: translated, id: 1065871 }
      - pl: "Szamotała się w jego uścisku."
        ru: "Она билась в его объятиях."
        source: { kind: translated, id: 2279796 }
      - pl: "Przywitał ją serdecznym uściskiem."
        ru: "Он встретил её сердечным объятием."
        source: { kind: authored }
  - id: handshake
    ru: "рукопожатие (uścisk dłoni)"
    examples:
      - pl: "Co do uścisków ręki, to mam ostatnią radę - nie zapominajmy o uśmiechu."
        ru: "Что до рукопожатий, у меня есть последний совет."
        source: { kind: translated, id: 1606041 }
      - pl: "Uścisk dłoni bywa mocniejszy od słów."
        ru: "Рукопожатие бывает сильнее слов."
        source: { kind: authored }
notes:
  - { kind: usage, text: "uścisk dłoni «рукопожатие» — основное употребление; само по себе слово значит «сжатие, объятие»." }
  - { kind: usage, text: "В конце письма пишут uściski «обнимаю» — во множественном числе, как русское «обнимаю» в подписи." }
  - { kind: false-friend, text: "Корень ścisnąć «сжать», ср. русское «стиснуть», «тиски». Прилагательное ścisły «точный» из этой же семьи." }
  - { kind: government, text: "Мужской неодушевлённый; родительный — uścisku." }
collocations:
  - { pl: "uścisk dłoni", ru: "рукопожатие" }
  - { pl: "serdeczny uścisk", ru: "сердечное объятие" }
etymology: "От uścisnąć «сжать», от ścisnąć; ср. русское «стиснуть», «тиски»."
memory: "uścisk — «объятие», а uścisk dłoni — «рукопожатие». В конце письма пишут uściski «обнимаю». Корень тот же, что у ścisły «точный»."
idioms:
  - { pl: "uścisk dłoni", ru: "рукопожатие" }
formExamplesSkip:
  - { form: "uścisku", cell: "Звательный", reason: "звательный падеж: для неодушевлённого существительного он практически не употребляется" }
