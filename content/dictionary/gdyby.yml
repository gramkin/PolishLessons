    ru: "Они бы удивились, если бы в мае пошёл снег."
    source: { kind: tatoeba, id: 593955 }
  - form: "gdyby"
    pl: "Jak byście się czuli, gdyby was zostawiła żona?"
    ru: "Как бы Вы чувствовали себя, если бы Ваша жена ушла от Вас?"
    source: { kind: tatoeba, id: 6313204 }
