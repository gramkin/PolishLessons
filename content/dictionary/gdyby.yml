# review
id: gdyby
format: 2
lemma: "gdyby"
rank: 334
pos: conj
pron: { cyr: "гды́бы" }
senses:
  - id: if-were
    ru: "если бы (нереальное условие)"
    note: "Всегда с прошедшим временем: Gdybym miał czas… «Если бы у меня было время…»."
    examples:
      - pl: "Gdyby znała rezultaty, byłaby zszokowana."
        ru: "Узнай она о результате, она была бы шокирована."
        source: { kind: tatoeba, id: 616268 }
      - pl: "Gdyby śnieg spadł w maju byliby tym zaskoczeni."
        ru: "Они бы удивились, если бы в мае пошёл снег."
        source: { kind: tatoeba, id: 593955 }
      - pl: "Świat byłby prostszy gdyby każdy znał angielski."
        ru: "Мир был бы проще, если бы каждый знал английский."
        source: { kind: tatoeba, id: 8529933 }
  - id: if-questions
    ru: "если бы (в вопросах и пожеланиях)"
    examples:
      - pl: "Jak byście się czuli, gdyby was zostawiła żona?"
        ru: "Как бы Вы чувствовали себя, если бы Ваша жена ушла от Вас?"
        source: { kind: tatoeba, id: 6313204 }
      - pl: "Gdyby tylko jej mąż pomógł jej, większość jej problemów w domu zniknęłaby."
        ru: "Если бы ей только помогал муж, большинство домашних проблем исчезло бы."
        source: { kind: tatoeba, id: 2838209 }
      - pl: "Jak by pan się czuł, gdyby zostawiła pana żona?"
        ru: "Как бы Вы чувствовали себя, если бы Ваша жена ушла от Вас?"
        source: { kind: tatoeba, id: 6313208 }
notes:
  - { kind: usage, text: "Главное отличие от jeśli: gdyby вводит нереальное, воображаемое условие и требует прошедшего времени. Jeśli będę miał czas «Если у меня будет время» — реально; Gdybym miał czas «Если бы у меня было время» — нет." }
  - { kind: usage, text: "Союз спрягается вместе с лицом: gdybym, gdybyś, gdyby, gdybyśmy, gdybyście. Окончание приклеивается прямо к нему." }
  - { kind: usage, text: "gdyby tylko — «если бы только»; gdyby nie — «если бы не»." }
collocations:
  - { pl: "gdybym miał", ru: "если бы у меня было" }
  - { pl: "gdyby nie", ru: "если бы не" }
  - { pl: "gdyby tylko", ru: "если бы только" }
  - { pl: "a gdyby tak", ru: "а что если" }
etymology: "Из gdy «когда» и частицы -by, показателя сослагательного наклонения; русское «если бы» устроено так же."
memory: "gdyby — «если бы», всегда о нереальном и всегда с прошедшим временем: Gdybym miał czas. Оно спрягается: gdybym, gdybyś, gdybyśmy. А реальное «если» — jeśli."
idioms:
  - { pl: "gdyby nie to", ru: "если бы не это" }
  - { pl: "gdyby tylko", ru: "если бы только" }
  - { pl: "gdyby kózka nie skakała, toby nóżki nie złamała", ru: "не прыгала бы козочка — не сломала бы ножку" }
formExamples:
