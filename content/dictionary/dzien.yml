notes:
  - { kind: usage, text: "Dzień dobry — универсальное приветствие, годится с утра до вечера; вечером говорят dobry wieczór." }
  - { kind: usage, text: "В косвенных падежах корень сжимается: dnia, dniu, dni — как русские «дня, дню, дней»." }
collocations:
  - { pl: "dzień dobry", ru: "здравствуйте" }
  - { pl: "co dzień", ru: "каждый день" }
  - { pl: "cały dzień", ru: "весь день" }
etymology: "Праславянское *dьnь из праиндоевропейского корня *di- «светить» — то же слово, что русское «день»."
memory: "В косвенных падежах гласная выпадает: dzień — dnia — dniu, ровно как «день — дня — дню». Приветствие Dzień dobry работает весь день, а вечером меняется на Dobry wieczór."
