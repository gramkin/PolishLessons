pron: { cyr: "та́рас" }
senses:
  - id: terrace
    ru: "терраса (у дома, кафе)"
    examples:
      - pl: "Pijemy kawę na tarasie."
        ru: "Мы пьём кофе на террасе."
        source: { kind: authored }
