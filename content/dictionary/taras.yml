        ru: "Ресторан открыл летнюю террасу."
        source: { kind: authored }
  - id: slope
    ru: "терраса на склоне (уступ)"
    examples:
      - pl: "Na zboczach góry ciągną się tarasy winnic."
        ru: "По склонам горы тянутся террасы виноградников."
        source: { kind: authored }
      - pl: "Ryż uprawia się tu na tarasach."
        ru: "Рис здесь выращивают на террасах."
        source: { kind: authored }
notes:
  - { kind: usage, text: "TARAS — мужской род, а русская «терраса» — женского: TEN TARAS, DUŻY TARAS, NA TARASIE. Родительный единственного — TARASU." }
  - { kind: stress, text: "Ударение на первом слоге: «та́рас», а не «тера́са». В польском слове одна R и одна S, а вместо русского «е» — A." }
  - { kind: false-friend, text: "Это не мужское имя Тарас, хотя пишется так же. TARAS WIDOKOWY — не терраса, а смотровая площадка." }
