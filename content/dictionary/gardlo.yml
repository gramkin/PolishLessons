# review
id: gardlo
format: 2
lemma: "gardło"
rank: 1801
pos: noun
pron: { cyr: "га́рдуо" }
senses:
  - id: throat
    ru: "горло"
    examples:
      - pl: "Gardło mnie boli."
        ru: "У меня горло болит."
        source: { kind: tatoeba, id: 590556 }
      - pl: "Boli mnie gardło."
        ru: "У меня болит горло."
        source: { kind: tatoeba, id: 10696224 }
      - pl: "Boli cię gardło?"
        ru: "У тебя болит горло?"
        source: { kind: translated, id: 9678367 }
  - id: throat-feel
    ru: "горло (ощущения, боль)"
    examples:
      - pl: "Zaschło mi w gardle."
        ru: "У меня пересохло в горле."
        source: { kind: translated, id: 7868847 }
      - pl: "Drapie mnie w gardle."
        ru: "У меня першит в горле."
        source: { kind: translated, id: 352172 }
      - pl: "Pierwsze objawy choroby to gorączka i ból gardła."
        ru: "Первые признаки болезни — температура и боль в горле."
        source: { kind: translated, id: 3866095 }
notes:
  - { kind: government, text: "Где — w gardle (предложный падеж): zaschło mi w gardle «у меня пересохло в горле». Боль горла — ból gardła (родительный)." }
  - { kind: usage, text: "na całe gardło — «во всё горло», громко: krzyczeli na całe gardło." }
  - { kind: usage, text: "mieć żabę w gardle — буквально «иметь лягушку в горле», то есть охрипнуть; по-русски скажут «ком в горле» о другом чувстве." }
  - { kind: false-friend, text: "Слово значит только «горло» как часть тела; «горлышко» бутылки — szyjka, а не gardło." }
collocations:
  - { pl: "ból gardła", ru: "боль в горле" }
  - { pl: "na całe gardło", ru: "во всё горло" }
  - { pl: "boli mnie gardło", ru: "у меня болит горло" }
family:
  - { pl: "gardłowy", ru: "горловой", relation: root }
  - { pl: "szyja", ru: "шея", relation: root }
etymology: "Праславянское *gъrdlo — то же слово, что русское «горло»; польское ar на месте русского «оро», как в brzeg «берег»."
memory: "gardło — «горло»: boli mnie gardło «у меня болит горло», ból gardła «боль в горле». И krzyczeć na całe gardło — «кричать во всё горло»."
idioms:
  - { pl: "na całe gardło", ru: "во всё горло" }
  - { pl: "ból gardła", ru: "боль в горле" }
  - { pl: "mieć nóż na gardle", ru: "быть под ножом, в безвыходном положении" }
