# review
id: przytrzasnac
format: 2
lemma: "przytrzasnąć"
rank: 5888
pos: verb
aspect: perf
pron: { cyr: "пшытша́сноньць" }
senses:
  - id: pinch
    ru: "прищемить (дверью, крышкой)"
    examples:
      - pl: "Dziewczyna przytrzasnęła sobie palce drzwiami."
        ru: "Девушка прищемила себе пальцы дверью."
        source: { kind: translated, id: 1270133 }
      - pl: "Uważaj, bo przytrzaśniesz kotu ogon!"
        ru: "Осторожно, а то прищемишь коту хвост!"
        source: { kind: authored }
      - pl: "Drzwi tramwaju przytrzasnęły mi płaszcz."
        ru: "Двери трамвая прищемили мне пальто."
        source: { kind: authored }
  - id: slam
    ru: "захлопнуть, придавив (крышку, дверцу)"
    examples:
      - pl: "Przytrzasnął klapę bagażnika i odjechał."
        ru: "Он захлопнул крышку багажника и уехал."
        source: { kind: authored }
      - pl: "Wiatr przytrzasnął okno z hukiem."
        ru: "Ветер с грохотом захлопнул окно."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "PRZYTRZASNĄĆ — «прищемить, захлопнув», а не «притрясти»: корень тот же, что в TRZASK «треск, хлопок» и TRZASNĄĆ «хлопнуть». Не путайте с PRZYTRZYMAĆ «придержать»: PRZYTRZYMAJ DRZWI! — «придержи дверь!», а PRZYTRZASNĄŁEM PALEC — «я прищемил палец»." }
  - { kind: government, text: "Что прищемили — винительный, кому — дательный (часто SOBIE), чем — творительный без предлога: PRZYTRZASNĘŁA SOBIE PALCE DRZWIAMI. Можно и W + предложный: PRZYTRZASNĄĆ PALEC W DRZWIACH." }
  - { kind: usage, text: "Совершенный вид; несовершенный — PRZYTRZASKIWAĆ. Будущее — с мягкой основой: PRZYTRZASNĘ, PRZYTRZAŚNIESZ, PRZYTRZAŚNIE, PRZYTRZASNĄ; повелительное — PRZYTRZAŚNIJ. Прошедшее чередует Ą и Ę: PRZYTRZASNĄŁ, но PRZYTRZASNĘŁA, PRZYTRZASNĘLI. Страдательное PRZYTRZAŚNIĘTY — частое слово в новостях: PASAŻER PRZYTRZAŚNIĘTY DRZWIAMI POCIĄGU." }
  - { kind: pronunciation, text: "Читается «пшытша́сноньць»: PRZ — «пш», TRZ — «тш» (RZ после T оглушается), Ą перед Ć — «онь». В формах с Ś: PRZYTRZAŚNIE — «пшытша́сьне»." }
collocations:
  - { pl: "przytrzasnąć sobie palec drzwiami", ru: "прищемить себе палец дверью" }
  - { pl: "przytrzasnąć płaszcz drzwiami", ru: "прищемить пальто дверью" }
  - { pl: "przytrzaśnięty drzwiami", ru: "зажатый дверями" }
family:
  - { pl: "przytrzaskiwać", ru: "прищемлять", relation: aspect }
  - { pl: "trzasnąć", ru: "хлопнуть, треснуть", relation: root }
  - { pl: "trzask", ru: "треск, хлопок", relation: root }
  - { pl: "zatrzasnąć", ru: "захлопнуть", relation: root }
  - { pl: "przytrzaśnięcie", ru: "защемление", relation: derived }
etymology: "Приставка PRZY- «при-» плюс TRZASNĄĆ «хлопнуть, треснуть», от звукоподражательного TRZASK «треск». Буквально — «прихлопнуть», «притиснуть хлопком»."
memory: "Przytrzasnąć — «прихлопнуть» дверью: trzask! — и палец прищемлён."
idioms:
  - { pl: "przytrzasnąć komuś palce", ru: "прищемить кому-то пальцы (перен.: больно прижать, поймать на чём-то)" }
