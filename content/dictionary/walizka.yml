notes:
  - { kind: false-friend, text: "ПОХОЖЕГО РУССКОГО СЛОВА В ЖИВОЙ РЕЧИ НЕТ. Walizka — из французского valise; русская «вализа» встречалась в девятнадцатом веке, но давно вышла из употребления, и сегодня говорят «чемодан». Так что опереться не на что: слово надо выучить, зато оборот siedzieć na walizkach совпадает с русским «сидеть на чемоданах» дословно." }
  - { kind: pronunciation, text: "ДВА ИЗМЕНЕНИЯ, УЖЕ ЗНАКОМЫЕ ПО PACZKA. Дательный и предложный меняют k на c: w walizce. Родительный множественного вставляет беглое e: walizek. Ровно так же ведут себя paczka — paczce — paczek и marynarka — marynarce — marynarek. Звонкое z перед глухим k оглушается: «вали́ска»." }
  - { kind: usage, text: "Уменьшительное walizeczka, увеличительное walizisko. Чемодан на колёсах — walizka na kółkach; ручная кладь — bagaż podręczny. Глагол spakować walizkę «собрать чемодан», rozpakować «разобрать»." }
collocations:
  - { pl: "spakować walizkę", ru: "собрать чемодан" }
  - { pl: "walizka na kółkach", ru: "чемодан на колёсах" }
  - { pl: "siedzieć na walizkach", ru: "сидеть на чемоданах" }
family:
  - { pl: "bagaż", ru: "багаж", relation: root }
  - { pl: "torba", ru: "сумка", relation: root, id: torba }
  - { pl: "pakować", ru: "паковать", relation: derived }
etymology: "Из французского valise «чемодан, сумка», а то — из итальянского valigia, слова тёмного происхождения. В польский пришло через немецкий в девятнадцатом веке и обросло родным уменьшительным суффиксом -ka. Русская «вализа» того же корня, но в живом языке её заменил «чемодан», тюркское слово персидского происхождения."
memory: "walizka — «чемодан»; русская «вализа» того же корня, но давно вышла из употребления. Склонение как у paczka: w walizce с c, walizek с беглым e. А siedzieć na walizkach значит ровно то же, что «сидеть на чемоданах»."
idioms:
  - { pl: "siedzieć na walizkach", ru: "сидеть на чемоданах" }
  - { pl: "spakować walizkę", ru: "собрать чемодан" }
