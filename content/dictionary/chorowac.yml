# review
id: chorowac
format: 2
lemma: "chorować"
rank: 4711
pos: verb
pron: { cyr: "хоро́ваць" }
senses:
  - id: be-ill
    ru: "болеть, хворать"
    examples:
      - pl: "Syn choruje od tygodnia."
        ru: "Сын болеет уже неделю."
        source: { kind: authored }
      - pl: "Zimą często choruję."
        ru: "Зимой я часто болею."
        source: { kind: authored }
      - pl: "Babcia długo chorowała."
        ru: "Бабушка долго болела."
        source: { kind: authored }
  - id: have-disease
    ru: "болеть чем-то (CHOROWAĆ NA + винительный)"
    examples:
      - pl: "Ojciec choruje na serce."
        ru: "Отец болеет сердцем."
        source: { kind: authored }
      - pl: "Na cukrzycę choruje coraz więcej ludzi."
        ru: "Диабетом болеет всё больше людей."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "CHOROWAĆ — «болеть» в смысле «хворать». «Болеть» о части тела — BOLEĆ: BOLI MNIE GŁOWA. «Болеть за команду» — KIBICOWAĆ. Русское «хворать» — тот же корень, что CHORY «больной»." }
  - { kind: usage, text: "Несовершенный вид. Спряжение на -UJĘ: CHORUJĘ, CHORUJESZ, CHORUJĄ. Начать болеть — ZACHOROWAĆ, выздороветь — WYZDROWIEĆ. Безличное CHOROWANO и форма CHORUJMY в карточку не включены." }
  - { kind: government, text: "Чем — NA с винительным: CHOROWAĆ NA GRYPĘ, NA SERCE, NA ASTMĘ. По-русски — творительный без предлога («болеть гриппом»), и эта разница сбивает постоянно. Как долго — винительный: CHOROWAĆ TYDZIEŃ." }
  - { kind: pronunciation, text: "Читается «хоро́ваць»: CH — «х», ударение на предпоследнем слоге. CHORUJĘ — «хору́е», CHORUJĄ — «хору́йон»." }
  - { kind: register, text: "Нейтральное слово. Разговорное CHOROWAĆ NA COŚ в шутку значит «очень хотеть»: CHORUJE NA NOWY TELEFON «он бредит новым телефоном»." }
collocations:
  - { pl: "chorować na grypę", ru: "болеть гриппом" }
  - { pl: "często chorować", ru: "часто болеть" }
  - { pl: "przewlekle chorować", ru: "хронически болеть" }
family:
  - { pl: "chory", ru: "больной", relation: derived, id: chory }
  - { pl: "choroba", ru: "болезнь", relation: derived, id: choroba }
  - { pl: "zachorować", ru: "заболеть", relation: aspect, id: zachorowac }
etymology: "От CHORY «больной», праславянское *chvorъ — тот же корень, что русские «хворый», «хворать». В польском CHV- упростилось до CH-."
memory: "Chorować — хворать: choruję na grypę. Чем болеть — na + винительный, не творительный! Голова болит — boli."
idioms:
  - { pl: "chorować na coś", ru: "бредить чем-то, очень хотеть (шутл.)" }
formExamplesSkip:
  - { form: "chorowano", reason: "безличная форма почти не употребляется" }
  - { form: "chorujmy", reason: "форма «давайте болеть» не употребляется" }
