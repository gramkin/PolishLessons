# review
id: rok
format: 2
lemma: "rok"
rank: 87
pos: noun
pron: { cyr: "рок" }
senses:
  - id: year
    ru: "год"
    examples:
      - pl: "Czekam na nowy rok."
        ru: "Я жду нового года."
        source: { kind: tatoeba, id: 12955879 }
      - pl: "Szczęśliwego Nowego Roku!"
        ru: "Хорошего Нового года!"
        source: { kind: tatoeba, id: 352753 }
      - pl: "Lata szybko lecą."
        ru: "Годы пролетают быстро."
        source: { kind: tatoeba, id: 2146655 }
  - id: age
    ru: "год (о возрасте, во множественном lata)"
    examples:
      - pl: "Ile on ma lat?"
        ru: "Сколько ему лет?"
        source: { kind: tatoeba, id: 500525 }
      - pl: "On ma dwadzieścia cztery lata."
        ru: "Ему двадцать четыре года."
        source: { kind: tatoeba, id: 4716826 }
notes:
  - { kind: usage, text: "Множественное число супплетивное: rok → lata, lat, latach — как русское «год → года, лет»." }
  - { kind: usage, text: "Возраст строится через lata: Ile masz lat? «Сколько тебе лет?», mam dwadzieścia lat." }
collocations:
  - { pl: "w tym roku", ru: "в этом году" }
  - { pl: "co roku", ru: "каждый год" }
  - { pl: "Nowy Rok", ru: "Новый год" }
etymology: "Праславянское *rokъ «срок, назначенное время» от *rekti «говорить»; ср. русские «срок» и «рок»."
memory: "Ложный друг: rok — это «год», а не «рок». Множественное супплетивное, как в русском: rok → lata. Возраст тоже через него: Ile masz lat?"
idioms:
  - { pl: "co roku", ru: "каждый год" }
  - { pl: "z roku na rok", ru: "из года в год" }
  - { pl: "Nowy Rok", ru: "Новый год" }
