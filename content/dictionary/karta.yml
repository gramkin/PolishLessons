      - pl: "Poproszę kartę."
        ru: "Меню, пожалуйста."
        source: { kind: translated, id: 2363401 }
      - pl: "Kelner przyniósł kartę."
        ru: "Официант принёс меню."
        source: { kind: authored }
      - pl: "Co jest dziś w karcie?"
        ru: "Что сегодня в меню?"
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Польское karta — это НЕ географическая карта: карта местности по-польски mapa. karta покрывает банковскую карту, игральные карты, карточку-талон и ресторанное меню." }
  - { kind: government, text: "«Платить картой» — творительный без предлога: płacić kartą, zapłacić kartą kredytową, ровно как в русском." }
  - { kind: usage, text: "В ресторане Poproszę kartę значит «Меню, пожалуйста», а не «карту»." }
  - { kind: usage, text: "Идиома совпадает с русской: szczęściarz w kartach, pechowiec w miłości «везёт в картах — не везёт в любви»." }
collocations:
