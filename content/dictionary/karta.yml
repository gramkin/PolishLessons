  - { pl: "kartoteka", ru: "картотека", relation: derived }
etymology: "Из латинского charta «лист папируса» через немецкий — то же заимствование, что и русская «карта»."
memory: "karta — «карта», но НЕ географическая: карта местности по-польски mapa. Польское karta покрывает банковскую карту (płacić kartą, творительный без предлога), игральные карты (grać w karty), карточку-талон и ресторанное меню — Poproszę kartę значит «Меню, пожалуйста». Идиома та же, что в русском: szczęściarz w kartach, pechowiec w miłości."
