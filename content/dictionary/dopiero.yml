# review
id: dopiero
format: 2
lemma: "dopiero"
rank: 530
pos: part
pron: { cyr: "допе́ро" }
senses:
  - id: only
    ru: "всего, только (о малом количестве, возрасте)"
    note: "Подчёркивает, что чего-то мало: ma dopiero dwa lata «ей всего два года»."
    examples:
      - pl: "Ma dopiero dwa lata, a już umie liczyć do stu."
        ru: "Ей всего два года, а она уже умеет считать до ста."
        source: { kind: tatoeba, id: 416426 }
      - pl: "Dopiero zacząłem."
        ru: "Я только что начал."
        source: { kind: tatoeba, id: 1532685 }
      - pl: "Dopiero zaczynam."
        ru: "Я только начинаю."
        source: { kind: translated, id: 3714658 }
  - id: not-until
    ru: "только, лишь (о времени — позже, чем ожидалось)"
    note: "Русское «только» во временном смысле: przyjdzie dopiero jutro «придёт только завтра»."
    examples:
      - pl: "Przesyłka przyjdzie dopiero jutro."
        ru: "Посылка придёт только завтра."
        source: { kind: authored }
      - pl: "Wrócił dopiero po północy."
        ru: "Он вернулся только после полуночи."
        source: { kind: authored }
      - pl: "Dopiero wtedy zrozumiałem."
        ru: "Только тогда я понял."
        source: { kind: authored }
  - id: just-now
    ru: "dopiero co — только что, совсем недавно"
    examples:
      - pl: "Dopiero co z nią rozmawiałem."
        ru: "Мы с ней только что разговаривали."
        source: { kind: tatoeba, id: 13084352 }
      - pl: "Dopiero co z nim rozmawiałem."
        ru: "Мы с ним только что разговаривали."
        source: { kind: tatoeba, id: 13084355 }
      - pl: "Dopiero co z nią rozmawiałam."
        ru: "Мы с ней только что разговаривали."
        source: { kind: translated, id: 13084353 }
notes:
  - { kind: usage, text: "Основное значение — «всего, только»: подчёркивает, что чего-то меньше, чем можно подумать. Ma dopiero 17 lat «Ему всего 17 лет», Nie możesz prowadzić «Тебе нельзя за руль»." }
  - { kind: usage, text: "Во временном смысле dopiero значит «не раньше чем»: Przyjdzie dopiero jutro «Придёт только завтра». Русское «только» покрывает оба смысла, польское — тоже." }
  - { kind: usage, text: "dopiero co — устойчивый оборот «только что»: Dopiero co z nim rozmawiałem «Я только что с ним говорил». Пишется раздельно." }
  - { kind: usage, text: "Оборот a cóż dopiero значит «что уж говорить о…»: On nawet piwa nie pije, a cóż dopiero whisky." }
collocations:
  - { pl: "dopiero co", ru: "только что" }
  - { pl: "dopiero wtedy", ru: "только тогда" }
  - { pl: "dopiero teraz", ru: "только сейчас" }
  - { pl: "a cóż dopiero", ru: "что уж говорить о" }
etymology: "Сращение do + piero, где piero — старая форма, родственная pierwszy «первый» и русскому «первый». Буквально «до первого», то есть «не раньше чем»."
memory: "dopiero — «только, всего, лишь». Два основных употребления. О количестве и возрасте: ma dopiero dwa lata «ей всего два года» — подчёркивает, что мало. О времени: przyjdzie dopiero jutro «придёт только завтра» — то есть не раньше. Отдельно выучите dopiero co «только что» (пишется раздельно) и a cóż dopiero «что уж говорить о». В основе то же слово, что русское «первый»: буквально «до первого»."
idioms:
  - { pl: "dopiero co", ru: "только что" }
  - { pl: "dopiero wtedy", ru: "только тогда" }
  - { pl: "a cóż dopiero", ru: "что уж говорить о" }
