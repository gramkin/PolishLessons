  - { pl: "żaden", ru: "ни один", relation: antonym, id: zaden }
etymology: "Сложение oba и dwa, то есть усиленное «оба». Oba восходит к праславянскому *oba, тому же, что русское «оба», и родственно латинскому ambo и греческому ampho. Собирательная форма obydwoje идёт от старого числительного среднего рода на -oje, как troje и czworo."
memory: "obydwa — «оба», но выбирать надо из четырёх: obydwa о вещах, obydwaj о мужчинах, obydwie о женщинах, obydwoje о разнополой паре. Последней в русском нет. Короткая форма oba значит то же самое."
