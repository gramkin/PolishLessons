notes:
  - { kind: usage, text: "РУССКИЙ ДЕЛИТ «ОБА» НА ДВА, ПОЛЬСКИЙ НА ЧЕТЫРЕ. OBYDWA — о вещах и среднем роде: obydwa okna. OBYDWAJ — только о мужчинах: obydwaj bracia. OBYDWIE — о женщинах и словах женского рода: obydwie siostry. И четвёртая, которой в русском нет вовсе: OBYDWOJE — о паре разного пола, мужчина и женщина вместе." }
  - { kind: government, text: "У собирательной формы своё склонение, и его надо знать отдельно: obydwoje в именительном, OBYDWOJGA в родительном, OBYDWOJGU в дательном и предложном, OBYDWOJGIEM в творительном. Остальные формы общие: obydwu и obydwóch на родительный и предложный, obydwom и obydwóm на дательный, obydwoma и obydwiema на творительный." }
  - { kind: register, text: "OBYDWA и OBA — одно и то же слово, обе формы правильны. Короткая oba чаще в речи, длинная obydwa немного выразительнее и чаще на письме. То же у пар obaj/obydwaj, obie/obydwie, oboje/obydwoje: выбирай любую, но не смешивай внутри одной фразы." }
  - { kind: pronunciation, text: "Три слога, ударение на предпоследнем: o-BY-dwa. Y читается как русское ы: «обы́два». В формах с ó звучит у: obydwóch — «обыдву́х», obydwóm — «обыдву́м»." }
