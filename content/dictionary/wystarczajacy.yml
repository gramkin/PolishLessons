# review
id: wystarczajacy
format: 2
lemma: "wystarczający"
rank: 1254
pos: adj
pron: { cyr: "выстарча́йонцы" }
senses:
  - id: sufficient
    ru: "достаточный"
    examples:
      - pl: "To wystarczający powód."
        ru: "Это достаточная причина."
        source: { kind: translated, id: 4881703 }
