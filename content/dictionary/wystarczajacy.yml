        ru: "Моё объяснение было недостаточным."
        source: { kind: translated, id: 3019609 }
  - id: enough-quantity
    ru: "достаточное количество"
    examples:
      - pl: "Każdy otrzymał wystarczającą ilość żywności i odzieży."
        ru: "Каждый получил достаточное количество еды и одежды."
        source: { kind: translated, id: 4934470 }
      - pl: "Tom nie pije wystarczającej ilości wody."
        ru: "Том не пьёт достаточно воды."
        source: { kind: translated, id: 10205865 }
      - pl: "Nie ma wystarczającej ilości światła, aby robić zdjęcia."
        ru: "Недостаточно света, чтобы делать снимки."
        source: { kind: translated, id: 7703651 }
notes:
  - { kind: usage, text: "Причастие от wystarczać «хватать», ставшее прилагательным: wystarczający значит «достаточный»." }
  - { kind: usage, text: "Очень частая связка — wystarczająca ilość «достаточное количество»: там, где по-русски скажут «достаточно воды», по-польски часто wystarczająca ilość wody." }
  - { kind: usage, text: "Наречие — wystarczająco «достаточно»: wystarczająco dużo «достаточно много»." }
  - { kind: false-friend, text: "Различайте три слова: dość wody «достаточно воды» (наречие), wystarczy «хватит» (глагол) и wystarczający «достаточный» (прилагательное)." }
collocations:
  - { pl: "wystarczająca ilość", ru: "достаточное количество" }
  - { pl: "wystarczający powód", ru: "достаточная причина" }
  - { pl: "wystarczająco dużo", ru: "достаточно много" }
etymology: "От wystarczyć «хватить», от starczyć «стать, хватить». Русское «достаточный» идёт от «достать» — метафора другая, но итог тот же."
memory: "wystarczający = «достаточный», причастие от wystarczać «хватать». Чаще всего идёт со словом ilość: wystarczająca ilość wody «достаточное количество воды». Наречие — wystarczająco."
idioms:
  - { pl: "wystarczająca ilość", ru: "достаточное количество" }
  - { pl: "wystarczający powód", ru: "достаточная причина" }
  - { pl: "nie mieć wystarczających dowodów", ru: "не иметь достаточных доказательств" }
formExamplesSkip:
  - { form: "wystarczającego", cell: "Винительный", reason: "винительный падеж одушевлённого мужского рода от этого слова почти не употребляется" }
