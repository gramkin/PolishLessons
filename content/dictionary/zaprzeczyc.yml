# review
id: zaprzeczyc
format: 2
lemma: "zaprzeczyć"
rank: 2049
pos: verb
aspect: perf
pron: { cyr: "запшэ́чиць" }
senses:
  - id: deny
    ru: "отрицать, отвергать"
    examples:
      - pl: "Zaprzeczył, by miał coś wspólnego z tym wypadkiem."
        ru: "Он отрицал, что имел отношение к этому происшествию."
        source: { kind: tatoeba, id: 448873 }
      - pl: "Zaprzeczył oskarżeniom."
        ru: "Он отверг обвинения."
        source: { kind: translated, id: 696446 }
      - pl: "Zaprzeczyła, by brała udział w spisku."
        ru: "Она отрицала, что участвовала в заговоре."
        source: { kind: translated, id: 744244 }
  - id: contradict
    ru: "возразить, опровергнуть"
    examples:
      - pl: "Nie mogłem zaprzeczyć."
        ru: "Я не мог возразить."
        source: { kind: translated, id: 6564047 }
      - pl: "Nie można tego zaprzeczyć."
        ru: "Этого нельзя отрицать."
        source: { kind: translated, id: 3445902 }
notes:
  - { kind: government, text: "Требует ДАТЕЛЬНОГО падежа: zaprzeczyć oskarżeniom «отвергнуть обвинения», тогда как русское «отрицать» — винительного." }
  - { kind: usage, text: "Часто с придаточным: zaprzeczył, że… «он отрицал, что…» или zaprzeczyła, jakoby… «она отрицала, будто…»." }
  - { kind: usage, text: "Несовершенный вид — zaprzeczać; существительное zaprzeczenie «отрицание»." }
  - { kind: false-friend, text: "Корень przeczyć «противоречить» — ср. русское «перечить», «поперёк»." }
collocations:
  - { pl: "zaprzeczyć oskarżeniom", ru: "отвергнуть обвинения" }
  - { pl: "nie da się zaprzeczyć", ru: "нельзя отрицать" }
etymology: "za- + przeczyć «противоречить»; ср. русское «перечить», «поперёк»."
memory: "zaprzeczyć — «отрицать», но с ДАТЕЛЬНЫМ падежом: zaprzeczyć oskarżeniom. Корень przeczyć — русское «перечить». Существительное zaprzeczenie «отрицание»."
idioms:
  - { pl: "nie da się zaprzeczyć", ru: "нельзя отрицать" }
