family:
  - { pl: "zajęcie", ru: "занятие, работа, дело", relation: root }
  - { pl: "zająć", ru: "занять", relation: root, id: zajac }
  - { pl: "zajęty", ru: "занятый, занят", relation: root }
  - { pl: "lekcja", ru: "урок", relation: root, id: lekcja }
etymology: "От глагола ZAJĄĆ «занять», составленного из приставки ZA- и корня, восходящего к праславянскому *jęti «взять», от которого и русские «взять», «занять», «изъять». Занятия — это буквально то, чем человек занят, то, что взяло его время. Русское «занятия» собрано из тех же частей и того же корня, поэтому слова совпадают и по виду, и по смыслу. Любопытно только, что польский закрепил за уроками множественное число, а за работой единственное, разведя два значения по числу; русский такого разделения не сделал и обходится контекстом."
memory: "Только множественное число в значении «уроки»: zajęcia, без единственного. Форма zajęcie существует, но значит «работа, дело». Предмет — через Z с родительным: zajęcia Z matematyki, не «по математике». Родительный множественного — zajęć."
idioms:
  - { pl: "iść na zajęcia", ru: "идти на занятия" }
  - { pl: "zajęcia z matematyki", ru: "занятия по математике" }
