notes:
  - { kind: usage, text: "В этом значении слово существует только во множественном числе — то, что называют pluralia tantum. Единственного числа тут нет: нельзя сказать MAM JEDNO ZAJĘCIE, имея в виду один урок. Форма ZAJĘCIE существует, но это другое слово со своим смыслом — «занятие» как дело, работа, род деятельности: SZUKAM ZAJĘCIA значит «ищу работу». Поэтому MAM ZAJĘCIA и MAM ZAJĘCIE сообщают совсем разное: первое про уроки, второе про то, что человек чем-то занят или имеет место работы. Русский различает их только по числу, и это как раз помогает запомнить." }
  - { kind: government, text: "Самое важное место — предмет. По-польски занятия бывают Z чего-то, с родительным падежом: ZAJĘCIA Z MATEMATYKI, ZAJĘCIA Z POLSKIEGO, ZAJĘCIA Z FIZYKI. Русский говорит «по математике», с дательным, так что конструкцию приходится менять целиком. Где — предлог NA с предложным: NA ZAJĘCIACH, как и по-русски «на занятиях». Куда — NA с винительным: IŚĆ NA ZAJĘCIA. Родительный множественного — ZAJĘĆ, с мягким ć на конце, и это единственная форма без окончания." }
  - { kind: pronunciation, text: "Читается «зайэ́нця», в три слога, с ударением на предпоследнем. Разберём: j даёт «й», ę перед c звучит как «эн», а сочетание cia — это «ця». Поэтому не «заечиа» и не «зайенциа», а «зайэ́нця». В родительном множественного ZAJĘĆ конечное ć мягкое, «зайэ́нць», и носовая слышна отчётливее, потому что слово кончается на согласный." }
  - { kind: false-friend, text: "Прямой ловушки нет, русские «занятия» отвечают польскому слову точно. Внимания требуют соседи по корню. ZAJĘTY значит «занятый» и о человеке, и о месте: MIEJSCE ZAJĘTE «место занято». ZAJĄĆ значит «занять», ZAJĄĆ SIĘ CZYMŚ — «заняться чем-то». А вот ZAJĘCIE в единственном числе лучше переводить «работа» или «дело», а не «занятие», чтобы не путать с уроками." }
collocations:
  - { pl: "zajęcia z matematyki", ru: "занятия по математике" }
  - { pl: "na zajęciach", ru: "на занятиях" }
