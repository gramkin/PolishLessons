# review
id: moc
format: 2
depth: deep
lemma: "móc"
rank: 16
pos: verb
aspect: imperf
pron: { cyr: "муц" }
senses:
  - id: can
    ru: "мочь, быть в состоянии"
    examples:
      - pl: "Mogę."
        ru: "Могу."
        source: { kind: tatoeba, id: 5015681 }
      - pl: "Możesz iść."
        ru: "Ты можешь идти."
        source: { kind: tatoeba, id: 524744 }
      - pl: "Wszyscy mogą grać."
        ru: "Все могут играть."
        source: { kind: tatoeba, id: 12476527 }
  - id: maybe
    ru: "może — может быть, возможно"
    examples:
      - pl: "Może później."
        ru: "Может быть, попозже."
        source: { kind: tatoeba, id: 2607628 }
      - pl: "Może i masz rację."
        ru: "Возможно, ты и права."
        source: { kind: tatoeba, id: 1118408 }
notes:
  - { kind: usage, text: "Форма третьего лица może работает и как вводное слово «может быть»: Może później «Может быть, позже»." }
  - { kind: usage, text: "В прошедшем времени чередование ó/o: mógł, но mogła, mogli — как в русском «мог — могла»." }
collocations:
  - { pl: "może być", ru: "сойдёт, пойдёт" }
  - { pl: "nie może być", ru: "не может быть" }
  - { pl: "jak mogę pomóc?", ru: "чем я могу помочь?" }
etymology: "Праславянское *mogti — то же слово, что русское «мочь»; ср. «могу — может»."
memory: "Спряжение узнаваемо: mogę «могу», możesz «можешь», może «может». Ловушек две: в прошедшем чередуется ó/o (mógł, но mogła), и то же może отдельно живёт как вводное «может быть»."
idioms:
  - { pl: "może być", ru: "сойдёт" }
  - { pl: "nie może być!", ru: "не может быть!" }
  - { pl: "chcieć to móc", ru: "хотеть значит мочь" }
