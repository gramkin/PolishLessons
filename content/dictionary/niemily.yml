notes:
  - { kind: false-friend, text: "Русское «немилый» — «нелюбимый», «постылый»: «немилый муж». Польское NIEMIŁY значит другое: «неприятный» о вещах и «нелюбезный, грубоватый» о людях. NIEMIŁA EKSPEDIENTKA — продавщица, которая хамит, а не та, которую не любят. Нелюбимый — NIEKOCHANY." }
  - { kind: usage, text: "Сравнивается: NIEMILSZY, NAJNIEMILSZY встречаются, но чаще говорят BARDZIEJ NIEMIŁY. Все одиннадцать форм живые. Форма для мужчин-людей NIEMILI частая: NIEMILI LUDZIE, NIEMILI SĄSIEDZI. Чередование: Ł в единственном, L в мужском-личном: NIEMIŁY, но NIEMILI." }
  - { kind: government, text: "Нелюбезный с кем-то — NIEMIŁY DLA KOGOŚ, DLA с родительным: BYŁ DLA MNIE NIEMIŁY. Неприятно кому-то — KOMUŚ JEST NIEMIŁO, наречие с дательным: BYŁO MI NIEMIŁO, «мне было неприятно»." }
  - { kind: pronunciation, text: "Читается «неми́уы», три слога, ударение на предпоследнем. MI — мягкое «ми», Ł — «у», конечная Y — «ы»: «-ми́уы». В форме NIEMILI Ł сменяется на L: «неми́ли». Сравните с MIŁOSNY «миуо́сны»: Ł там тоже даёт «у»." }
  - { kind: register, text: "Нейтральное повседневное слово, вежливое по тону: назвать кого-то NIEMIŁY мягче, чем CHAMSKI, «хамский», или NIEUPRZEJMY, «невежливый». NIEMIŁA NIESPODZIANKA — устойчивое выражение, как и русское «неприятный сюрприз»." }
collocations:
  - { pl: "niemiła niespodzianka", ru: "неприятный сюрприз" }
  - { pl: "niemiły zapach", ru: "неприятный запах" }
