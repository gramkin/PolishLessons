etymology: "От MIŁY «милый, приятный», общеславянского *milъ, с отрицанием NIE-. В русском «милый» сохранило ласковый, сердечный оттенок, а в польском MIŁY стало просто «приятным»: MIŁY DZIEŃ, MIŁA ROZMOWA. Отрицание пошло за ним, и NIEMIŁY значит «неприятный», а не «нелюбимый»."
memory: "Niemiły — неприятный, нелюбезный: niemiła niespodzianka, niemiły kelner. Не «немилый» (нелюбимый)! Читается «неми́уы»: ł даёт «у»."
