# review
id: brama
format: 2
lemma: "brama"
rank: 1853
pos: noun
pron: { cyr: "бра́ма" }
senses:
  - id: gate
    ru: "ворота"
    examples:
      - pl: "Gdzie jest brama?"
        ru: "Где ворота?"
        source: { kind: translated, id: 3545445 }
      - pl: "Brama była otwarta."
        ru: "Ворота были открыты."
        source: { kind: translated, id: 3945970 }
      - pl: "Brama była za wąska dla ciężarówki."
        ru: "Ворота были слишком узкими для грузовика."
        source: { kind: tatoeba, id: 406311 }
  - id: gate-action
    ru: "ворота (открыть, закрыть, стоять у ворот)"
    examples:
      - pl: "Otwórz bramę!"
        ru: "Открой ворота!"
        source: { kind: translated, id: 8763817 }
      - pl: "Zamknij bramę."
        ru: "Закрой ворота."
        source: { kind: tatoeba, id: 564988 }
      - pl: "Ktoś stoi przy bramie."
        ru: "Кто-то стоит у ворот."
        source: { kind: translated, id: 368152 }
notes:
  - { kind: false-friend, text: "Главное отличие от русского: brama — существительное единственного числа женского рода, а русские «ворота» всегда множественные. Ta brama jest zamknięta «эти ворота закрыты»." }
  - { kind: government, text: "У ворот — przy bramie (предложный падеж); за воротами — za bramą (творительный); через ворота — przez bramę (винительный)." }
  - { kind: usage, text: "В польском городе brama — это ещё и подворотня, проход во двор дома: spotkajmy się w bramie." }
  - { kind: usage, text: "Дверь — drzwi, тоже множественное; brama больше и ведёт во двор, на территорию или в крепость." }
collocations:
  - { pl: "otworzyć bramę", ru: "открыть ворота" }
  - { pl: "przy bramie", ru: "у ворот" }
  - { pl: "brama wjazdowa", ru: "въездные ворота" }
family:
  - { pl: "bramka", ru: "калитка, ворота (в футболе)", relation: root }
  - { pl: "drzwi", ru: "дверь", relation: root, id: drzwi }
etymology: "Праславянское *borna «ограда, застава» — того же корня, что русское «борона» и «оборона». Русские «ворота» построены от другого корня."
memory: "brama — «ворота», но в единственном числе и женского рода: ta brama. Русские «ворота» всегда множественные — это главное расхождение. У ворот — przy bramie."
idioms:
  - { pl: "otworzyć bramę", ru: "открыть ворота" }
  - { pl: "przy bramie", ru: "у ворот" }
  - { pl: "brama wjazdowa", ru: "въездные ворота" }
formExamplesSkip:
  - { form: "bramy", cell: "Звательный", reason: "звательный падеж: к предмету или понятию не обращаются" }
