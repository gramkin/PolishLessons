etymology: "Из праславянского *myslь — того же слова, что русская «мысль», от корня *mysl- в родстве со «смыслом», «умыслом» и «промыслом». Польский развернул этот корень шире русского: pomysł «идея», zamysł «замысел», wymysł «выдумка», przemysł «промышленность», domysł «догадка». Последнее особенно поучительно: przemysł построен как русский «промысел», но значение ушло от ремесла к целой отрасли."
memory: "Шесть форм на четырнадцать мест: myśli делает восемь работ. А mieć na myśli — «иметь в виду». И przemysł — это «промышленность», не «промысел»."
