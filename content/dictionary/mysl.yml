notes:
  - { kind: usage, text: "Шесть форм на четырнадцать падежных мест — это самое плотное склонение в словаре. Одна форма MYŚLI делает сразу восемь работ: родительный, дательный, местный и звательный единственного, а затем именительный, винительный, родительный и звательный множественного. Форма MYŚL закрывает ещё две — именительный и винительный единственного. То есть два написания покрывают десять мест из четырнадцати, а на остальные четыре идут MYŚLĄ, MYŚLOM, MYŚLAMI, MYŚLACH." }
  - { kind: usage, text: "Мягкие женские слова на согласный делятся на два образца, и сравнение полезно. У NOC форм семь, потому что именительный множественного NOCE отличается от родительного NOCY. У MYŚL обе эти роли достались одному MYŚLI, и потому форм шесть. Значит, встретив мягкое женское слово, надо выяснить одну вещь: даёт ли оно во множественном -e или -i, — и остальное встанет на место." }
  - { kind: usage, text: "Русская «мысль» тоже женского рода и тоже сильно складывает падежи: «мысли» служит родительным, дательным и предложным единственного и одновременно именительным с винительным множественного. Совпадение почти полное, так что здесь русское чутьё работает — редкий случай, когда догадка о том, какие формы сольются, оказывается верной. Запоминать нужно только MYŚLĄ в творительном, где русский даёт «мыслью»." }
  - { kind: false-friend, text: "Корень дал польскому слова, которые русскому расслышать опасно. POMYSŁ — это «идея, придумка», ZAMYSŁ — «замысел», а PRZEMYSŁ значит «промышленность», хотя выглядит в точности как русский «промысел». Сказать przemysł, имея в виду рыбный промысел, не выйдет: по-польски это будет вся отрасль. Самое же нужное выражение с самим словом — MIEĆ NA MYŚLI «иметь в виду», и его стоит заучить целиком." }
