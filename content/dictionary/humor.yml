# review
id: humor
format: 2
lemma: "humor"
rank: 1887
pos: noun
pron: { cyr: "ху́мор" }
senses:
  - id: mood
    ru: "настроение"
    examples:
      - pl: "Ma marny humor."
        ru: "У него скверное настроение."
        source: { kind: translated, id: 364505 }
      - pl: "Wszyscy mają zły humor."
        ru: "У всех плохое настроение."
        source: { kind: translated, id: 11262045 }
      - pl: "Jego dobry humor ulotnił się."
        ru: "Его хорошее настроение улетучилось."
        source: { kind: translated, id: 989471 }
      - pl: "Poranna gimnastyka poprawia humor."
        ru: "Утренняя зарядка улучшает настроение."
        source: { kind: translated, id: 13007958 }
      - pl: "Był w dobrym humorze."
        ru: "Он был в хорошем настроении."
        source: { kind: translated, id: 3470939 }
      - pl: "On jest w złym humorze."
        ru: "Он в плохом настроении."
        source: { kind: translated, id: 566148 }
  - id: humour
    ru: "юмор, чувство смешного"
    examples:
      - pl: "Humor czasem pomaga w takich sytuacjach."
        ru: "Юмор иногда помогает в таких ситуациях."
        source: { kind: tatoeba, id: 3743933 }
      - pl: "Masz poczucie humoru."
        ru: "У тебя есть чувство юмора."
        source: { kind: translated, id: 364035 }
      - pl: "Szkoda, że on nie ma poczucia humoru."
        ru: "Жаль, что у него нет чувства юмора."
        source: { kind: tatoeba, id: 458059 }
notes:
  - { kind: false-friend, text: "Главная ловушка: humor в польском чаще означает «настроение», а не «юмор». Mam dobry humor — это «У меня хорошее настроение», а вовсе не «у меня хороший юмор»." }
  - { kind: usage, text: "Чтобы сказать «чувство юмора», нужно poczucie humoru: On nie ma poczucia humoru «У него нет чувства юмора»." }
  - { kind: usage, text: "Конструкция «быть в настроении» строится с предложным падежом: być w dobrym humorze, być w złym humorze." }
  - { kind: usage, text: "Рядом стоит nastrój: оно более общее и книжное, а humor — о человеке и разговорное." }
collocations:
  - { pl: "poczucie humoru", ru: "чувство юмора" }
  - { pl: "w dobrym humorze", ru: "в хорошем настроении" }
  - { pl: "zły humor", ru: "плохое настроение" }
etymology: "Из латинского humor «влага»: по средневековой теории четыре телесные жидкости определяли нрав человека. Отсюда выросли оба значения — и «настроение», и «юмор». Русское «юмор» пришло от того же латинского слова, но сохранило только второе."
memory: "Mam dobry humor — не «у меня хороший юмор», а «у меня хорошее настроение». Если нужен именно юмор, говорят poczucie humoru «чувство юмора»."
