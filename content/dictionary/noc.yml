# review
id: noc
format: 2
lemma: "noc"
rank: 173
pos: noun
pron: { cyr: "ноц" }
senses:
  - id: night
    ru: "ночь"
    examples:
      - pl: "Była noc."
        ru: "Была ночь."
        source: { kind: tatoeba, id: 822161 }
      - pl: "Płakała całą noc."
        ru: "Она рыдала всю ночь."
        source: { kind: tatoeba, id: 352530 }
      - pl: "Całą noc padał śnieg."
        ru: "Всю ночь шёл снег."
        source: { kind: tatoeba, id: 531623 }
  - id: night-time
    ru: "ночь как отрезок времени (в оборотах)"
    examples:
      - pl: "Spędził tam noc."
        ru: "Он провёл там ночь."
        source: { kind: tatoeba, id: 12569760 }
      - pl: "Była to księżycowa noc."
        ru: "Та ночь была лунной."
        source: { kind: tatoeba, id: 923136 }
      - pl: "Tom pracował dzień i noc."
        ru: "Том работал день и ночь."
        source: { kind: tatoeba, id: 1592116 }
notes:
  - { kind: usage, text: "«Ночью» передаётся двумя способами: w nocy и nocą. «На ночь» — na noc, «по ночам» — po nocach." }
  - { kind: usage, text: "Женский род: ta noc, tej nocy, tą nocą. «Спокойной ночи» — dobranoc, в одно слово." }
collocations:
  - { pl: "w nocy", ru: "ночью" }
  - { pl: "całą noc", ru: "всю ночь" }
  - { pl: "dobranoc", ru: "спокойной ночи" }
  - { pl: "dzień i noc", ru: "день и ночь" }
etymology: "Праславянское *noktь — то же слово, что русское «ночь»; родственны латинское nox и немецкое Nacht."
memory: "Женский род: ta noc, tej nocy, tą nocą. «Ночью» — w nocy или nocą, а «спокойной ночи» — dobranoc, одним словом."
idioms:
  - { pl: "białe noce", ru: "белые ночи" }
  - { pl: "dniami i nocami", ru: "днями и ночами" }
  - { pl: "noce i dnie", ru: "ночи и дни" }
