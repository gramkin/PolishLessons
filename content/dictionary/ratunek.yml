etymology: "От глагола RATOWAĆ «спасать», заимствованного из средневерхненемецкого RETTEN того же значения, через чешское посредство в позднем средневековье. Русский в этом поле остался при своём: «спасать», «спасение» идут от «спасти» и в конечном счёте от того же корня, что «пасти», то есть оберегать стадо. Получается, что оба языка назвали спасение по-своему и ничего общего в словах не осталось, хотя понятие одно. Суффикс -UNEK в польском образует отвлечённые существительные от глаголов и знаком из RACHUNEK «счёт», PODARUNEK «подарок», SZACUNEK «уважение, оценка»: по нему незнакомое слово читается как название действия или его результата."
memory: "Родни в русском нет: ratować из немецкого retten, а «спасать» от «пасти». Крик о помощи — Ratunku! в звательном. На помощь — na ratunek с винительным. Беглое e выпадает: ratunku, ratunkiem; родительный и местный совпадают, отсюда девять форм. Суффикс -unek даёт отвлечённые имена: rachunek, podarunek, szacunek."
idioms:
