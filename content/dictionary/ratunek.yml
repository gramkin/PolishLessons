notes:
  - { kind: usage, text: "Самый частый оборот — NA RATUNEK с винительным падежом, то есть «на помощь, на выручку»: RUSZYĆ NA RATUNEK «броситься на помощь». Зов о помощи устроен иначе: это крик RATUNKU! в звательном падеже или оборот WOŁAĆ POMOCY с родительным. Именно форма RATUNKU! служит в польском криком о помощи, и её стоит узнавать с первого раза. Производные нужны постоянно: KOŁO RATUNKOWE «спасательный круг», SZALUPA RATUNKOWA, EKIPA RATUNKOWA, POGOTOWIE RATUNKOWE «скорая помощь»." }
  - { kind: pronunciation, text: "Читается «рату́нэк», ударение на предпоследнем слоге. Беглая гласная E выпадает во всех косвенных падежах: RATUNEK, но RATUNKU, RATUNKIEM, RATUNKI. Из-за этого ударение переезжает, оставаясь предпоследним: «рату́нэк», но «рату́нку». Это та же механика, что в WYSIŁEK, PIASEK и CUKIEREK. Конечное -EK звучит «эк», с твёрдым э." }
  - { kind: government, text: "Мужской род, неодушевлённое, и родительный с местным совпадают в одной форме RATUNKU: BEZ RATUNKU «без спасения» и O RATUNKU «о спасении» выглядят одинаково. Это шестой такой случай в словаре, после WYSIŁEK, POŚPIECH, DYSK, BLOK и PIASEK. Винительный равен именительному, и в обороте NA RATUNEK стоит именно он. Чем спасение — творительный: JEDYNYM RATUNKIEM BYŁA POŻYCZKA. При отрицании винительный уходит в родительный: NIE WIDZIAŁ RATUNKU." }
  - { kind: false-friend, text: "Русского однокоренного слова нет, и это стоит знать заранее: RATOWAĆ «спасать» и RATUNEK «спасение» в русском родственников не имеют, потому что пришли из немецкого RETTEN «спасать» через средневековое посредство. Русское «спасение» построено от «спасти», от совсем другого корня. Поэтому слово учится как новое, зато всё его гнездо прозрачно и однородно: RATOWAĆ, RATUNEK, RATOWNIK «спасатель», RATOWNICZY, и ни одно из них не похоже на русское соответствие." }
