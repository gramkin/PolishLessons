etymology: "Сращение PÓŁ WTORA, «половина второго»: один целый и половина второго. Русское «полтора» — из того же «пол-втора»."
memory: "Półtora — полтора: półtora roku. Перед женским родом — półtorej: półtorej godziny. Читается «пууто́ра»."
