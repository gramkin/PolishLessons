notes:
  - { kind: false-friend, text: "PÓŁTORA — «полтора», а PÓŁTOREJ — «полторы» перед женским родом: PÓŁTOREJ GODZINY, «полтора часа», потому что GODZINA — женского рода. Род выбирают по польскому слову, а не по русскому." }
  - { kind: usage, text: "Две формы в норме: PÓŁTORA перед мужским и средним родом (PÓŁTORA ROKU, PÓŁTORA KILO), PÓŁTOREJ перед женским (PÓŁTOREJ SZKLANKI). Существительное после них — в родительном единственного. Форма PÓŁTORY устарела." }
  - { kind: government, text: "После PÓŁTORA — родительный единственного: PÓŁTORA LITRA, PÓŁTOREJ GODZINY. Глагол в прошедшем — средний род: MINĘŁO PÓŁTORA ROKU, «прошло полтора года»." }
  - { kind: pronunciation, text: "Читается «пууто́ра»: Ó — «у», Ł — тоже «у», вместе — долгое «уу». Ударение на предпоследнем слоге: «пууто́рэй»." }
