# review
id: randka
format: 2
lemma: "randka"
rank: 762
pos: noun
pron: { cyr: "ра́нтка" }
senses:
  - id: date
    ru: "свидание"
    examples:
      - pl: "Moja pierwsza randka była w lodziarni."
        ru: "Моё первое свидание было в кафе-мороженом."
        source: { kind: translated, id: 11266218 }
      - pl: "Nie jesteśmy na randce."
        ru: "Мы не на свидании."
        source: { kind: translated, id: 12453629 }
      - pl: "Tom był wczoraj wieczorem na randce z Mary."
        ru: "Том был вчера вечером на свидании с Мэри."
        source: { kind: translated, id: 3951255 }
  - id: invite
    ru: "zaprosić na randkę — пригласить на свидание"
    examples:
      - pl: "Zaprosiłem ją na randkę."
        ru: "Я пригласил её на свидание."
        source: { kind: translated, id: 598267 }
      - pl: "Chcesz pójść z Tomem na randkę?"
        ru: "Хочешь пойти с Томом на свидание?"
        source: { kind: translated, id: 3945122 }
      - pl: "Odwołała randkę."
        ru: "Она отменила свидание."
        source: { kind: translated, id: 6534093 }
  - id: dating
    ru: "umawiać się na randki — ходить на свидания"
    examples:
      - pl: "Moi rodzice nie pozwalają mi umawiać się na randki."
        ru: "Родители не разрешают мне ходить на свидания."
        source: { kind: translated, id: 8178703 }
      - pl: "Jakie są korzyści z randek?"
        ru: "Какая польза от свиданий?"
        source: { kind: translated, id: 9684529 }
      - pl: "Umówili się na randkę w piątek."
        ru: "Они договорились о свидании в пятницу."
        source: { kind: authored }
  - id: first-date
    ru: "pierwsza randka, randka w ciemno"
    examples:
      - pl: "Co powinnam zrobić na mojej pierwszej randce?"
        ru: "Что мне делать на первом свидании?"
        source: { kind: translated, id: 11011559 }
      - pl: "Randka w ciemno bywa udana."
        ru: "Свидание вслепую бывает удачным."
        source: { kind: authored }
      - pl: "To była nasza pierwsza randka."
        ru: "Это было наше первое свидание."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Слово пришло из французского rendez-vous и обкаталось до randka. Значение осталось романтическим: деловая встреча — это spotkanie, а не randka." }
  - { kind: government, text: "na randce «на свидании» — предложный падеж; na randkę «на свидание» — винительный; przed randką «перед свиданием» — творительный." }
  - { kind: usage, text: "Ходовые обороты: iść na randkę «пойти на свидание», zaprosić kogoś na randkę «пригласить на свидание», umówić się na randkę «договориться о свидании», randka w ciemno «свидание вслепую»." }
  - { kind: usage, text: "«Встречаться с кем-то» в смысле отношений — umawiać się z kimś или chodzić z kimś." }
collocations:
  - { pl: "iść na randkę", ru: "пойти на свидание" }
  - { pl: "zaprosić na randkę", ru: "пригласить на свидание" }
  - { pl: "pierwsza randka", ru: "первое свидание" }
  - { pl: "randka w ciemno", ru: "свидание вслепую" }
family:
  - { pl: "spotkanie", ru: "встреча", relation: root }
  - { pl: "umawiać się", ru: "договариваться; встречаться", relation: root }
  - { pl: "umowa", ru: "договор", relation: root }
etymology: "Из французского rendez-vous; польский обкатал заимствование до randka, добавив уменьшительный суффикс -ka."
memory: "randka — «свидание», и слово пришло из французского rendez-vous, обкатавшись до randki. Значение осталось романтическим: деловая встреча — это spotkanie. Запомните обороты iść na randkę, zaprosić kogoś na randkę и randka w ciemno «свидание вслепую»."
idioms:
  - { pl: "randka w ciemno", ru: "свидание вслепую" }
  - { pl: "iść na randkę", ru: "пойти на свидание" }
  - { pl: "umówić się na randkę", ru: "договориться о свидании" }
