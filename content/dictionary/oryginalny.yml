etymology: "Из латинского ORIGINALIS «первоначальный», от ORIGO «начало, источник», через западноевропейские языки. Оба языка взяли слово из одного источника, но передали латинское окончание -ALIS по-своему: польский суффиксом -ALNY, русский — «-альный». Отсюда ORYGINALNY при «оригинальный», а также целый разряд пар: NORMALNY, SPECJALNY, LEGALNY при «нормальный», «специальный», «легальный». Запомнив соответствие один раз, остальные слова этого вида выводишь сам."
memory: "Польскому -ALNY отвечает русское «-альный»: oryginalny, normalny, specjalny. И никакого мягкого знака: oryginalny, через y."
