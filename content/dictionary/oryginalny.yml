notes:
  - { kind: usage, text: "У слова два значения, и русский делит их так же, только пользуется разными словами. Первое — «подлинный»: ORYGINALNY PODPIS, ORYGINALNE CZĘŚCI, то есть не копия и не подделка; тут русский скажет «подлинный» или «оригинальный». Второе — «самобытный, необычный»: ORYGINALNY POMYSŁ, ORYGINALNY STRÓJ. Существительное ORYGINAŁ значит и «оригинал» документа, и «оригинал» о человеке — чудак, как и в русском." }
  - { kind: pronunciation, text: "Мужско-личная форма множественного числа — ORYGINALNI, с мягким ni: «орыгина́льни». Это обычная форма для прилагательных на -NY, в отличие от разобранных в карточке MORSKI основ на -SKI, которые дают -SCY. Само слово читается «орыгина́лны», с y как русским ы и ударением на предпоследнем слоге. Обратите внимание, что в польском нет -ьн-: пишется ORYGINALNY, а не «оригинальный», и l здесь твёрдое." }
  - { kind: government, text: "Прилагательное согласуется с существительным в роде, числе и падеже, как и в русском, и отдельного управления не имеет. Степени сравнения образуются суффиксом: ORYGINALNY — ORYGINALNIEJSZY — NAJORYGINALNIEJSZY, рядом с описательным BARDZIEJ ORYGINALNY, которое в живой речи встречается даже чаще. С чем сравнивают — предлог OD с родительным или союз NIŻ: ORYGINALNIEJSZY OD POPRZEDNIEGO, ORYGINALNIEJSZY NIŻ RESZTA." }
  - { kind: false-friend, text: "Форма расходится с русской на одну букву, и это стоит заметить: по-польски ORYGINALNY, через y в первом слоге и без мягкого знака, тогда как русский пишет «оригинальный» через и и с -ьн-. Так же устроены остальные слова этого разряда: ORYGINAŁ против «оригинал», ORYGINALNOŚĆ против «оригинальность». Правило простое: латинское -alis польский передаёт как -ALNY, а русский как -альный." }
