# review
id: odbijac
format: 2
lemma: "odbijać"
rank: 4442
pos: verb
aspect: imperf
aspectPair: odbic
pron: { cyr: "одбия́ць" }
senses:
  - id: reflect
    ru: "отражать (свет, изображение); odbijać się — отражаться"
    examples:
      - pl: "Lustro odbija światło słońca."
        ru: "Зеркало отражает солнечный свет."
        source: { kind: authored }
      - pl: "Woda w jeziorze odbija niebo."
        ru: "Вода в озере отражает небо."
        source: { kind: authored }
      - pl: "W szybie odbija się jej twarz."
        ru: "В стекле отражается её лицо."
        source: { kind: authored }
  - id: bounce
    ru: "отбивать (мяч, удар); odbijać się — отскакивать"
    examples:
      - pl: "Bramkarz odbija piłkę na rzut rożny."
        ru: "Вратарь отбивает мяч на угловой."
        source: { kind: authored }
      - pl: "Piłka odbija się od ściany."
        ru: "Мяч отскакивает от стены."
        source: { kind: authored }
  - id: recapture
    ru: "отбивать (город, пленных у врага; девушку у соперника)"
    examples:
      - pl: "Żołnierze odbijają miasto z rąk wroga."
        ru: "Солдаты отбивают город у врага."
        source: { kind: authored }
      - pl: "On zawsze odbija kolegom dziewczyny."
        ru: "Он всегда отбивает у друзей девушек."
        source: { kind: authored }
  - id: cast-off
    ru: "отчаливать (от берега)"
    examples:
      - pl: "Statek powoli odbija od brzegu."
        ru: "Корабль медленно отчаливает от берега."
        source: { kind: authored }
notes:
  - { kind: government, text: "Что — винительный: ODBIJAĆ PIŁKĘ, ŚWIATŁO. У кого отбивают — дательный, а не «у» с родительным, как в русском: ODBIJAĆ KOMUŚ DZIEWCZYNĘ «отбивать у кого-то девушку». От чего отражаться или отскакивать — OD с родительным: ODBIJAĆ SIĘ OD ŚCIANY." }
  - { kind: usage, text: "Несовершенный вид; совершенный — ODBIĆ. Спряжение на -AM: ODBIJAM, ODBIJASZ, ODBIJAJĄ. Формы ODBIJĘ, ODBIJESZ принадлежат совершенному ODBIĆ и значат будущее: «отобью»." }
  - { kind: false-friend, text: "Русское «отражать» в значении «света» по-польски тоже ODBIJAĆ, а «отражаться» — ODBIJAĆ SIĘ. Разговорное ODBIJA MI SIĘ значит «у меня отрыжка», а ODBIJA MU (чаще ODBIŁO MU) — «у него крыша едет»." }
  - { kind: pronunciation, text: "Читается «одбия́ць»: D перед звонким B остаётся звонким, IJA — «ия». Ударение на предпоследнем слоге: ODBIJAM — «одби́ям»." }
collocations:
  - { pl: "odbijać światło", ru: "отражать свет" }
  - { pl: "odbijać piłkę", ru: "отбивать мяч" }
  - { pl: "odbijać od brzegu", ru: "отчаливать от берега" }
  - { pl: "odbijać się echem", ru: "отдаваться эхом" }
family:
  - { pl: "odbić", ru: "отбить, отразить", relation: aspect, id: odbic }
  - { pl: "bić", ru: "бить", relation: root, id: bic }
  - { pl: "odbicie", ru: "отражение; отскок", relation: derived }
  - { pl: "odbitka", ru: "оттиск, отпечаток, копия", relation: derived }
synonyms: ["odzwierciedlać", "odpierać", "odzyskiwać"]
antonyms: ["przybijać"]
etymology: "Приставка OD- плюс BIJAĆ, многократная форма от BIĆ «бить». Устроено так же, как русское «отбивать»."
memory: "Odbijać — от-бивать: мяч, город, девушку. Свет тоже «отбивается» от зеркала, то есть отражается."
idioms:
  - { pl: "odbijać się czkawką", ru: "аукаться, выходить боком (досл. «отрыгиваться икотой»)" }
  - { pl: "palma komuś odbija", ru: "у кого-то едет крыша, кто-то зазнаётся" }
