notes:
  - { kind: false-friend, text: "ПОЛЬСКОЕ SŁAWNY И РУССКОЕ «СЛАВНЫЙ» РАЗОШЛИСЬ. Sławny значит ЗНАМЕНИТЫЙ, широко известный: sławny aktor, sławny obraz. Русское «славный» в живой речи значит скорее «милый, симпатичный» — «славный малый», — а в высоком стиле «доблестный». Чтобы сказать по-польски «славный малый», нужно miły chłopak, а «славная победа» — chwalebne zwycięstwo." }
  - { kind: usage, text: "Рядом стоят два близких слова. Słynny тоже значит «знаменитый» и часто взаимозаменимо со sławny. Znany значит просто «известный», без оттенка величия: znany lekarz это врач, которого знают, sławny lekarz — светило. В третьем значении sławny звучит иронически, как русское «пресловутый»." }
  - { kind: pronunciation, text: "Два слога, ударение на первом: SŁAW-ny. Ł читается как краткое у, а w перед n оглушается до ф: «суа́фны». В сравнительной степени появляется мягкое ni: sławniejszy — «суавне́йшы»." }
  - { kind: register, text: "Нейтрально, парадигма полная в тридцать три формы. Степени сравнения употребительны: sławniejszy «более знаменитый», najsławniejszy «самый знаменитый». Существительное sława значит и «слава», и разговорно «знаменитость»: to miejscowa sława." }
collocations:
  - { pl: "sławny pisarz", ru: "знаменитый писатель" }
  - { pl: "stać się sławnym", ru: "стать знаменитым" }
  - { pl: "sławny z czegoś", ru: "знаменитый чем-л." }
family:
