  - { pl: "słynny", ru: "знаменитый", relation: derived }
  - { pl: "sławić", ru: "славить", relation: derived }
  - { pl: "nieznany", ru: "неизвестный", relation: antonym }
etymology: "От sława, из праславянского *slava, от корня *slu- «слышать» — того же, что в русских «слыть», «слух», «слово» и «слава». Слава это буквально то, что о человеке СЛЫШНО. Отсюда sławny, sławić, przesławny и имена на -sław: Stanisław, Bolesław, Władysław."
memory: "sławny — «ЗНАМЕНИТЫЙ», а не «славный»: русское «славный малый» будет miły chłopak. Корень тот же, что в «слава» и «слыть»: славен тот, о ком слышно. Рядом живёт słynny с тем же смыслом."
idioms:
