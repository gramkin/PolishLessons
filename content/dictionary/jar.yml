pron: { cyr: "яр" }
senses:
  - id: ravine
    ru: "овраг, лощина"
    examples:
      - pl: "Ścieżka schodzi w jar."
        ru: "Тропинка спускается в овраг."
        source: { kind: authored }
      - pl: "Na dnie jaru płynie potok."
        ru: "На дне оврага течёт ручей."
        source: { kind: authored }
      - pl: "Jar porośnięty jest krzakami."
        ru: "Овраг зарос кустами."
