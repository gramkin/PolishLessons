  - id: gorge
    ru: "ущелье, балка"
    examples:
      - pl: "Przeszliśmy przez głęboki jar."
        ru: "Мы прошли через глубокий овраг."
        source: { kind: authored }
      - pl: "Jar oddziela dwie wsie."
        ru: "Овраг разделяет две деревни."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Географический термин: узкая долина с крутыми склонами. Синоним — wąwóz." }
  - { kind: false-friend, text: "Русское «яр» — то же самое слово и то же значение, так что здесь языки совпадают. Но польское jary (прилагательное) значит «яровой, бодрый» и к оврагу отношения не имеет." }
  - { kind: government, text: "Мужской неодушевлённый; родительный — jaru." }
  - { kind: usage, text: "В корпусе единственное совпадение приходится на форму jary и относится к другому слову, поэтому примеры здесь составлены вручную." }
collocations:
  - { pl: "głęboki jar", ru: "глубокий овраг" }
  - { pl: "dno jaru", ru: "дно оврага" }
etymology: "Из тюркского jar «обрыв, круча», как и русское «яр»; оба языка взяли слово из одного источника."
memory: "jar — «овраг, ущелье», то же слово, что русское «яр». Осторожно: прилагательное jary значит «яровой, бодрый» и к оврагу не относится."
