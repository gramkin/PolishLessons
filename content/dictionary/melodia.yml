# review
id: melodia
format: 2
lemma: "melodia"
rank: 5076
pos: noun
pron: { cyr: "мело́дья" }
senses:
  - id: tune
    ru: "мелодия"
    examples:
      - pl: "Ta melodia chodzi mi po głowie cały dzień."
        ru: "Эта мелодия весь день крутится у меня в голове."
        source: { kind: authored }
      - pl: "Zagrał prostą melodię na flecie."
        ru: "Он сыграл простую мелодию на флейте."
        source: { kind: authored }
      - pl: "Melodia tej piosenki jest bardzo stara."
        ru: "Мелодия этой песни очень старая."
        source: { kind: authored }
  - id: inclination
    ru: "охота, склонность (разг.)"
    examples:
      - pl: "Nie mam dziś melodii do sprzątania."
        ru: "У меня сегодня нет охоты убираться."
        source: { kind: authored }
      - pl: "Ma melodię do języków obcych."
        ru: "У него склонность к иностранным языкам."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Слово то же, что русское «мелодия», но у него есть разговорное значение, которого нет у нас. MIEĆ MELODIĘ DO CZEGOŚ — «иметь охоту, тягу к чему-то»: NIE MAM MELODII DO TEJ PRACY — «не лежит у меня душа к этой работе». Прилагательные различаются: MELODYJNY — «мелодичный, приятный на слух», MELODYCZNY — «мелодический», термин музыкантов." }
  - { kind: usage, text: "Девять живых форм, женский род. Родительный, дательный и местный единственного и родительный множественного совпадают: MELODII. Старинная форма родительного множественного MELODYJ встречается только в старых текстах." }
  - { kind: government, text: "Напевать мелодию — NUCIĆ MELODIĘ, винительный. Под мелодию — POD MELODIĘ, POD с винительным. Охота к чему-то — MELODIA DO CZEGOŚ, DO с родительным." }
  - { kind: pronunciation, text: "Читается «мело́дья», три слога, ударение на втором: сочетание IA в конце считается одним слогом, как в HISTORIA «исто́рья». В форме MELODII два I: «мело́дьи»." }
collocations:
  - { pl: "nucić melodię", ru: "напевать мелодию" }
  - { pl: "melodia ludowa", ru: "народная мелодия" }
  - { pl: "wpadająca w ucho melodia", ru: "запоминающаяся мелодия" }
family:
  - { pl: "melodyjny", ru: "мелодичный", relation: derived }
  - { pl: "melodyczny", ru: "мелодический", relation: derived }
  - { pl: "melodyka", ru: "мелодика", relation: derived }
etymology: "Из греческого слова со значением «пение», через латынь. Русский взял то же слово, и ударение в обоих языках на одном слоге: «мело́дия» и «мело́дья». Различие только в конце: польское IA сливается в один слог."
memory: "Melodia — «мелодия», читается «мело́дья». Melodii — и «мелодии», и «мелодий». Mieć melodię do czegoś — иметь охоту к чему-то. Melodyjny — мелодичный, melodyczny — мелодический."
idioms:
  - { pl: "mieć melodię do czegoś", ru: "иметь охоту, склонность к чему-то" }
formExamplesSkip:
  - { form: "melodyj", reason: "архаичная форма родительного множественного; сейчас говорят MELODII" }
