# review
id: przerazony
format: 2
lemma: "przerażony"
rank: 1925
pos: adj
pron: { cyr: "пшэражо́ны" }
senses:
  - id: terrified
    ru: "напуганный, в ужасе"
    examples:
      - pl: "Byłem przerażony."
        ru: "Я был в ужасе."
        source: { kind: translated, id: 6392754 }
      - pl: "Jestem przerażony."
        ru: "Я в ужасе."
        source: { kind: translated, id: 12567542 }
      - pl: "Tom był przerażony."
        ru: "Том был в ужасе."
        source: { kind: translated, id: 1793610 }
      - pl: "Ludzie byli przerażeni."
        ru: "Люди были в ужасе."
        source: { kind: translated, id: 360454 }
      - pl: "Byłaś przerażona."
        ru: "Ты была в ужасе."
        source: { kind: translated, id: 12060453 }
      - pl: "Tom jest naprawdę przerażony."
        ru: "Том по-настоящему напуган."
        source: { kind: translated, id: 2770467 }
  - id: terrified-by
    ru: "напуганный чем-либо"
    examples:
      - pl: "Byłem przerażony widokiem."
        ru: "Я был в ужасе от увиденного."
        source: { kind: translated, id: 355219 }
      - pl: "Byłam przerażona widokiem."
        ru: "Я была в ужасе от увиденного."
        source: { kind: translated, id: 12180523 }
      - pl: "Wszyscy byliśmy przerażeni."
        ru: "Мы все были в ужасе."
        source: { kind: translated, id: 5437370 }
notes:
  - { kind: usage, text: "Это причастие-прилагательное от глагола przerazić «привести в ужас», и в речи оно ведёт себя как обычное прилагательное: przerażony człowiek." }
  - { kind: usage, text: "Сильнее, чем przestraszony «испуганный»: przerażony — это уже ужас, а не просто испуг. Существительное того же гнезда — strach «страх», у него своя карточка." }
  - { kind: usage, text: "Творительный падеж вводит причину: przerażony widokiem «в ужасе от увиденного»." }
collocations:
  - { pl: "być przerażonym", ru: "быть в ужасе" }
  - { pl: "przerażony widokiem", ru: "в ужасе от увиденного" }
  - { pl: "wyglądać na przerażonego", ru: "выглядеть напуганным" }
etymology: "Причастие от przerazić, prze- + razić «поражать», того же корня, что русские «разить» и «поразить». Русское «поражённый» построено из тех же частей."
memory: "przerażony — «в ужасе», сильнее, чем przestraszony «испуганный». Причину вводит творительный падеж: przerażony widokiem."
idioms:
  - { pl: "być przerażonym", ru: "быть в ужасе" }
  - { pl: "przerażony widokiem", ru: "в ужасе от увиденного" }
  - { pl: "śmiertelnie przerażony", ru: "смертельно напуган" }
