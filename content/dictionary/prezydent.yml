# review
id: prezydent
format: 2
lemma: "prezydent"
rank: 644
pos: noun
pron: { cyr: "прэзы́дэнт" }
senses:
  - id: president
    ru: "президент (глава государства)"
    note: "Kto jest prezydentem? — творительный падеж."
    examples:
      - pl: "Prezydent zawiesił konstytucję i wprowadził stan wojenny."
        ru: "Президент приостановил действие конституции и ввёл военное положение."
        source: { kind: tatoeba, id: 553598 }
      - pl: "Prezydent Francji odwiedzi Japonię w przyszłym miesiącu."
        ru: "Президент Франции посетит Японию в следующем месяце."
        source: { kind: tatoeba, id: 1100601 }
      - pl: "Kto jest prezydentem tego kraju?"
        ru: "Кто президент этой страны?"
        source: { kind: tatoeba, id: 10135814 }
  - id: mayor
    ru: "prezydent miasta — мэр крупного города"
    note: "Небольшим городом руководит burmistrz, деревней — wójt."
    examples:
      - pl: "On był prezydentem miasta."
        ru: "Он был мэром города."
        source: { kind: translated, id: 1414542 }
      - pl: "Prezydent miasta otworzył nowy most."
        ru: "Мэр города открыл новый мост."
        source: { kind: authored }
      - pl: "Wybory prezydenta miasta odbędą się jesienią."
        ru: "Выборы мэра города пройдут осенью."
        source: { kind: authored }
  - id: elected
    ru: "wybrać na prezydenta — избрать президентом"
    note: "С предлогом na и винительным."
    examples:
      - pl: "Został wybrany na prezydenta."
        ru: "Его избрали президентом."
        source: { kind: tatoeba, id: 588115 }
      - pl: "Część posłów oskarżyła prezydenta o masowe mordy."
        ru: "Часть парламентариев обвинила президента в массовых убийствах."
        source: { kind: tatoeba, id: 3243624 }
      - pl: "Kandydował na prezydenta trzy razy."
        ru: "Он баллотировался в президенты трижды."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "prezydent miasta — это не «президент города», а мэр. В Польше крупными городами руководит prezydent, городками поменьше — burmistrz, а сельской гминой — wójt." }
  - { kind: government, text: "Два падежа, которые надо развести: «быть президентом» — творительный (Kto jest prezydentem tego kraju?), а «избрать президентом» — na с винительным (został wybrany na prezydenta)." }
  - { kind: usage, text: "Мужское личное склонение: винительный совпадает с родительным (oskarżyli prezydenta), именительный множественного — prezydenci." }
  - { kind: usage, text: "Отдельной женской формы в официальном языке нет: говорят pani prezydent, и слово при этом не склоняется." }
collocations:
  - { pl: "prezydent miasta", ru: "мэр города" }
  - { pl: "wybrać na prezydenta", ru: "избрать президентом" }
  - { pl: "pani prezydent", ru: "госпожа президент" }
  - { pl: "prezydent kraju", ru: "президент страны" }
family:
  - { pl: "prezydencki", ru: "президентский", relation: derived }
  - { pl: "burmistrz", ru: "бургомистр, мэр", relation: root }
  - { pl: "prezydentura", ru: "президентство", relation: derived }
etymology: "Из латинского praesidens «председательствующий» через западноевропейские языки — то же заимствование, что и русское «президент»."
memory: "prezydent — «президент», но держите в голове вторую, чисто польскую работу этого слова: prezydent miasta значит «мэр». Крупными городами в Польше руководит именно prezydent, городками поменьше — burmistrz, а сельской гминой — wójt. И разведите два падежа: Kto jest prezydentem? — творительный, а został wybrany na prezydenta — винительный с na."
idioms:
