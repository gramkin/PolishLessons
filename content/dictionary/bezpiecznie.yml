# review
id: bezpiecznie
format: 2
lemma: "bezpiecznie"
rank: 1604
pos: adv
pron: { cyr: "бэспе́чне" }
senses:
  - id: safely
    ru: "безопасно, благополучно"
    examples:
      - pl: "Dotarł bezpiecznie."
        ru: "Он добрался благополучно."
        source: { kind: translated, id: 10605242 }
      - pl: "Samolot bezpiecznie wylądował."
        ru: "Самолёт благополучно приземлился."
        source: { kind: translated, id: 6534043 }
      - pl: "Czy bezpiecznie jest jeść surowe jajka?"
        ru: "Безопасно ли есть сырые яйца?"
        source: { kind: tatoeba, id: 982512 }
  - id: feel-safe
    ru: "безопасно (о состоянии, ощущении)"
    examples:
      - pl: "Tutaj jest bezpiecznie."
        ru: "Здесь безопасно."
        source: { kind: translated, id: 8739278 }
      - pl: "Czujemy się bezpiecznie."
        ru: "Мы чувствуем себя в безопасности."
        source: { kind: translated, id: 4953252 }
      - pl: "Nigdzie nie jest bezpiecznie."
        ru: "Нигде не безопасно."
        source: { kind: translated, id: 731873 }
notes:
  - { kind: usage, text: "Наречие от bezpieczny «безопасный»; существительное — bezpieczeństwo «безопасность»." }
  - { kind: usage, text: "czuć się bezpiecznie значит «чувствовать себя в безопасности»: по-русски здесь существительное, по-польски наречие." }
  - { kind: usage, text: "Сравнительная степень — bezpieczniej, превосходная — najbezpieczniej: Bezpieczniej jest zostać w domu «Безопаснее остаться дома»." }
  - { kind: false-friend, text: "Слово разбирается как bez + piecza «забота, попечение» — то же, что русское «беспечно», но значение разошлось: польское bezpiecznie значит «безопасно», а не «беззаботно»." }
collocations:
  - { pl: "czuć się bezpiecznie", ru: "чувствовать себя в безопасности" }
  - { pl: "bezpiecznie wylądować", ru: "благополучно приземлиться" }
  - { pl: "bezpieczniej jest", ru: "безопаснее" }
etymology: "Из bez + piecza «забота, попечение» — буквально «без забот». Русское «беспечный» собрано ровно из тех же частей, но значения разошлись: русское — «беззаботный», польское — «безопасный»."
memory: "bezpiecznie = «безопасно». Ловушка для русского уха: bez + piecza — то же, что русское «беспечно», но польское слово значит «безопасно». czuć się bezpiecznie — «чувствовать себя в безопасности»."
idioms:
  - { pl: "czuć się bezpiecznie", ru: "чувствовать себя в безопасности" }
  - { pl: "dotrzeć bezpiecznie", ru: "добраться благополучно" }
  - { pl: "bezpieczniej jest", ru: "безопаснее" }
