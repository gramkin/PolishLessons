notes:
  - { kind: false-friend, text: "КОРЕНЬ ZAWÓD НЕ ИМЕЕТ НИЧЕГО ОБЩЕГО С РУССКИМ «ЗАВОДОМ». ZAWÓD значит «профессия», а завод по-русски будет FABRYKA или ZAKŁAD. При этом у самого zawód есть второе значение — «разочарование»: SPRAWIĆ KOMUŚ ZAWÓD значит «разочаровать кого-то». Одно слово, два далёких смысла, и ни один не совпадает с русским «заводом»." }
  - { kind: usage, text: "Мужско-личная форма множественного — ZAWODOWI: zawodowi sportowcy. Запомни пары: SZKOŁA ZAWODOWA — профучилище, CHOROBA ZAWODOWA — профзаболевание, ŻOŁNIERZ ZAWODOWY — кадровый военный. Противоположность — amatorski «любительский»." }
  - { kind: pronunciation, text: "Четыре слога, ударение на предпоследнем: za-wo-DO-wy. Все o открытые, w звонкое: «заводо́вы». Женская форма zawodowa звучит «заводо́ва»." }
collocations:
  - { pl: "szkoła zawodowa", ru: "профучилище" }
  - { pl: "choroba zawodowa", ru: "профзаболевание" }
  - { pl: "zawodowy sportowiec", ru: "профессиональный спортсмен" }
family:
  - { pl: "zawód", ru: "профессия; разочарование", relation: root, id: zawod }
  - { pl: "praca", ru: "работа", relation: root, id: praca }
  - { pl: "amatorski", ru: "любительский", relation: antonym }
etymology: "От zawód «профессия», от zawodzić, буквально «то, чем человек себя ведёт по жизни». Тот же глагол дал второе значение — «подвести, разочаровать», отсюда sprawić zawód. С русским «заводом», который от «заводить» в смысле «запускать производство», родства по значению нет, хотя корень общий."
memory: "zawodowy — «профессиональный», от zawód «профессия». Но zawód значит ещё и «разочарование»: sprawić komuś zawód. А русский «завод» будет fabryka — созвучию верить нельзя."
idioms:
