# review
id: cios
format: 2
lemma: "cios"
rank: 2495
pos: noun
pron: { cyr: "цёс" }
senses:
  - id: blow
    ru: "удар"
    examples:
      - pl: "Pierwszy cios to połowa walki."
        ru: "Первый удар — это половина боя."
        source: { kind: tatoeba, id: 516529 }
      - pl: "Zastanawiałem się, jak to jest oberwać cios w brzuch."
        ru: "Я задумался, каково это получить удар в живот."
        source: { kind: tatoeba, id: 970458 }
      - pl: "Człowiek łagodny jest zdolny przyjmować ciosy nie eksplodując przy tym emocjonalnie. Człowiek łągodny nie kontratakuje, gdy zostanie zaatakowany, nie krzyczy i nie wrzeszczy, tylko ufny we własną wewnętrzną siłę, pozostaje spokojny i rozluźniony. To cecha, która przydałaby się nam wszystkim w kontaktach z innymi. A jednak nie łatwo ją rozwinąć. Zdobycie jej wymaga wysiłku przez całe życie."
        ru: "Кроткий человек способен принимать удары, не взрываясь при этом эмоционально. Кроткий человек не наносит ответного удара, когда на него нападают, не кричит и не вопит, а, доверяя собственной внутренней силе, остаётся спокойным и расслабленным. Это качество пригодилось бы всем нам в общении с другими. И всё же развить его нелегко: чтобы его обрести, нужны усилия всей жизни."
        source: { kind: translated, id: 1355965 }
  - id: shock
    ru: "удар (переносно), потрясение"
    examples:
      - pl: "Jej śmierć była dla mnie wielkim ciosem."
        ru: "Её смерть была для меня тяжёлым ударом."
        source: { kind: translated, id: 1829449 }
      - pl: "Okazało się to śmiertelnym ciosem dla ich planu."
        ru: "Это оказалось смертельным ударом для их плана."
        source: { kind: translated, id: 2148569 }
notes:
  - { kind: usage, text: "iść za ciosem «развивать успех», буквально «идти за ударом» — очень частый оборот, аналог русского «ковать железо, пока горячо»." }
  - { kind: government, text: "Мужской неодушевлённый; родительный — ciosu. Ударить кого-л. — zadać cios komuś, с дательным." }
  - { kind: false-friend, text: "Не «цветок» и не «тёс». Корень ciosać «тесать, рубить» — ср. русское «тесать»." }
  - { kind: usage, text: "И буквальный удар, и переносное потрясение — как русское «удар»." }
collocations:
  - { pl: "iść za ciosem", ru: "развивать успех" }
  - { pl: "zadać cios", ru: "нанести удар" }
etymology: "От ciosać «тесать, рубить», праславянское *tesati; ср. русское «тесать», «тёсаный»."
memory: "cios — «удар», и буквальный, и как потрясение. Запомните iść za ciosem «развивать успех» — по-русски «ковать железо, пока горячо»."
idioms:
  - { pl: "iść za ciosem", ru: "развивать успех" }
  - { pl: "zadać cios", ru: "нанести удар" }
