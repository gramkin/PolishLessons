etymology: "Праславянское *perz — то же, что русское «через» и приставка «пере-»."
memory: "przez = «через», но ещё и «по» (przez telefon «по телефону»), и «из-за» (przeze mnie «из-за меня»). В страдательном залоге вводит того, кто сделал: napisany przez Tomka."
idioms:
  - { pl: "przez przypadek", ru: "случайно" }
  - { pl: "sam przez się", ru: "сам по себе" }
