# review
id: urzednik
format: 2
lemma: "urzędnik"
rank: 4162
pos: noun
pron: { cyr: "уже́ндник" }
senses:
  - id: official
    ru: "чиновник, служащий"
    examples:
      - pl: "Urzędnik przyjął mój wniosek."
        ru: "Чиновник принял моё заявление."
        source: { kind: authored }
      - pl: "Pracuje jako urzędnik w banku."
        ru: "Он работает служащим в банке."
        source: { kind: authored }
      - pl: "Urzędnicy mają przerwę na lunch."
        ru: "У служащих обеденный перерыв."
        source: { kind: authored }
      - pl: "Drobny urzędnik nie może o tym decydować."
        ru: "Мелкий чиновник не может это решать."
        source: { kind: authored }
      - pl: "Zapytałam urzędnika, jak wypełnić formularz."
        ru: "Я спросила служащего, как заполнить бланк."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "URZĘDNIK — «чиновник, служащий», от URZĄD «учреждение, ведомство». Русскому оно напомнит «урядника», и это родня, но значение другое. URZĄD MIASTA — «мэрия», URZĄD SKARBOWY — «налоговая»." }
  - { kind: usage, text: "Десять форм, мужской род, лицо. Во множественном K переходит в C: URZĘDNICY. В корне чередуются Ą и Ę: URZĄD, но URZĘDU, URZĘDNIK. Женщина — URZĘDNICZKA." }
  - { kind: government, text: "Работать в учреждении — PRACOWAĆ W URZĘDZIE, местный. Чей служащий — родительный: URZĘDNIK BANKU, URZĘDNIK MINISTERSTWA." }
  - { kind: pronunciation, text: "Читается «уже́ндник», ударение на предпоследнем слоге. RZ — «ж», Ę перед D звучит «эн»." }
collocations:
  - { pl: "urzędnik państwowy", ru: "государственный служащий" }
  - { pl: "urzędnik bankowy", ru: "банковский служащий" }
  - { pl: "drobny urzędnik", ru: "мелкий чиновник" }
family:
  - { pl: "urząd", ru: "учреждение, ведомство; должность", relation: root, id: urzad }
  - { pl: "urzędowy", ru: "официальный, служебный", relation: derived }
  - { pl: "urzędniczka", ru: "служащая", relation: derived }
etymology: "От URZĄD «учреждение; должность», а то — от RZĄD «ряд, порядок; правительство». Корень тот же, что в русских «ряд», «порядок», «урядник»: чиновник — тот, кто наводит порядок."
memory: "Urzędnik — чиновник, служащий; urząd — учреждение. Читается «уже́ндник». Urzędnicy — чиновники. Odsyłać od Annasza do Kajfasza — гонять от одного к другому."
idioms:
  - { pl: "odsyłać od Annasza do Kajfasza", ru: "гонять от одного к другому, по инстанциям" }
