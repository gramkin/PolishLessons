# review
id: wejsc
format: 2
lemma: "wejść"
rank: 244
pos: verb
aspect: perf
pron: { cyr: "вэйсьць" }
senses:
  - id: enter
    ru: "войти, зайти"
    examples:
      - pl: "Wejdę."
        ru: "Я зайду."
        source: { kind: tatoeba, id: 556045 }
      - pl: "Niech pan wejdzie."
        ru: "Входите."
        source: { kind: tatoeba, id: 8617143 }
      - pl: "Mogę tam teraz wejść?"
        ru: "Могу я войти туда сейчас?"
        source: { kind: tatoeba, id: 6313055 }
  - id: entered
    ru: "войти (о совершившемся); попасть внутрь"
    note: "В прошедшем времени основа меняется: wszedłem, weszłam, weszliśmy."
    examples:
      - pl: "Wszedłem."
        ru: "Я вошёл."
        source: { kind: tatoeba, id: 12359837 }
      - pl: "Weszłam."
        ru: "Я вошла."
        source: { kind: tatoeba, id: 12359836 }
      - pl: "Nie pozwolono mi wejść."
        ru: "Мне не было позволено войти."
        source: { kind: tatoeba, id: 13784847 }
notes:
  - { kind: usage, text: "Главная трудность — прошедшее время: wszedłem «я вошёл», weszłam «я вошла», wszedł «он вошёл», weszła «она вошла», weszliśmy «мы вошли». Основа wejś- превращается в wszed-/wesz-." }
  - { kind: usage, text: "Несовершенный вид — wchodzić: Wchodzę do pokoju «Я вхожу в комнату»." }
  - { kind: usage, text: "Управление: wejść do czegoś «войти во что-то» (wejść do pokoju), wejść na coś «подняться на что-то» (wejść na górę, wejść na schody)." }
collocations:
  - { pl: "wejść do środka", ru: "войти внутрь" }
  - { pl: "wejść na górę", ru: "подняться наверх" }
  - { pl: "proszę wejść", ru: "войдите, пожалуйста" }
  - { pl: "wejście do budynku", ru: "вход в здание" }
etymology: "Из w- + iść «идти»; ср. русское «войти». В прошедшем времени всплывает старый корень: wszedł — как русское «шёл»."
memory: "wejść — «войти», но прошедшее время надо выучить целиком: wszedłem «я вошёл», weszłam «я вошла», weszliśmy «мы вошли». Основа меняется до неузнаваемости."
idioms:
  - { pl: "wejść w czyjąś skórę", ru: "влезть в чью-то шкуру" }
  - { pl: "wejść na głowę", ru: "сесть на голову" }
  - { pl: "wejść w życie", ru: "вступить в силу" }
