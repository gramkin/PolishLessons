notes:
  - { kind: false-friend, text: "ZAŁADOWAĆ — «погрузить, загрузить», а не «заладить». Русское «заладить» по-польски — UPARCIE POWTARZAĆ. Батарею и телефон заряжают глаголом NAŁADOWAĆ: NAŁADOWAĆ TELEFON, а ZAŁADOWAĆ — про груз, оружие и данные." }
  - { kind: usage, text: "Пятьдесят три формы, включая форму для мужчин-людей ZAŁADOWANI: людей тоже «грузят» в автобус или вагон. Спряжение на -UJĘ: ZAŁADUJĘ, ZAŁADUJESZ. Несовершенный вид — ŁADOWAĆ. С SIĘ — о странице или программе: STRONA SIĘ ZAŁADOWAŁA." }
  - { kind: government, text: "Что куда — винительный и DO или NA: ZAŁADOWAĆ WALIZKI DO AUTA, ZAŁADOWAĆ DREWNO NA WÓZ. Чем загружают — творительный: ZAŁADOWAĆ WAGON WĘGLEM. Оружие — винительный: ZAŁADOWAĆ PISTOLET." }
  - { kind: pronunciation, text: "Читается «зауадо́ваць»: Ł — «у», ударение на предпоследнем слоге. ZAŁADUJĘ — «зауаду́е», ZAŁADUJ — «зауа́дуй»." }
  - { kind: register, text: "Нейтральное слово, бытовое и техническое. В разговоре о компьютере его теснит WCZYTAĆ: WCZYTAĆ PLIK. В переносном смысле «загрузить работой» поляки чаще говорят ZAWALIĆ KOGOŚ ROBOTĄ." }
collocations:
  - { pl: "załadować samochód", ru: "загрузить машину" }
  - { pl: "załadować broń", ru: "зарядить оружие" }
  - { pl: "załadować towar na statek", ru: "погрузить товар на судно" }
family:
  - { pl: "ładować", ru: "грузить; заряжать", relation: root }
