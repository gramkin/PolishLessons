  - { pl: "wyładować", ru: "выгрузить", relation: derived }
etymology: "Приставка ZA- плюс ŁADOWAĆ «грузить», заимствованного из немецкого laden «грузить». Русское «ладить» с ним не связано."
memory: "Załadować — загрузить: załadowaliśmy meble na ciężarówkę. Telefon — naładować, груз и оружие — załadować. Читается «зауадо́ваць»."
