        ru: "Том выключил свет."
        source: { kind: tatoeba, id: 8108745 }
  - id: lamp
    ru: "свет как прибор; светофор"
    examples:
      - pl: "Nagle wszystkie światła zgasły."
        ru: "Внезапно весь свет погас."
        source: { kind: tatoeba, id: 7558739 }
      - pl: "Przejechaliście na czerwonym świetle."
        ru: "Вы проехали на красный свет."
        source: { kind: tatoeba, id: 3460675 }
      - pl: "Czekam na światłach."
        ru: "Я жду на светофоре."
        source: { kind: translated, id: 8763802 }
notes:
  - { kind: usage, text: "Праславянское *světъlo; русское «свет» — то же гнездо, ср. świeca «свеча», światły «просвещённый»." }
  - { kind: usage, text: "Во множественном числе światła часто значит «фары» или «светофор»: skręć na światłach «поверни на светофоре»." }
  - { kind: usage, text: "mieć zielone światło — «получить зелёный свет»; zobaczyć światło w tunelu — «увидеть свет в конце туннеля». Оба оборота совпадают с русскими." }
  - { kind: usage, text: "rzucić światło na coś — «пролить свет на что-то»." }
collocations:
  - { pl: "włączyć światło", ru: "включить свет" }
  - { pl: "zielone światło", ru: "зелёный свет" }
  - { pl: "na światłach", ru: "на светофоре" }
  - { pl: "rzucić światło na coś", ru: "пролить свет на что-то" }
etymology: "Праславянское *světъlo, от *světъ «свет». Русское «свет» — то же гнездо; ср. świeca «свеча» и światły «просвещённый»."
memory: "światło — «свет», слово родное и узнаваемое. Запомните множественное: światła — это «фары» и «светофор», отсюда na światłach «на светофоре». А обороты совпадают с русскими: zielone światło «зелёный свет», rzucić światło na coś «пролить свет»."
idioms:
  - { pl: "zielone światło", ru: "зелёный свет" }
  - { pl: "światło w tunelu", ru: "свет в конце туннеля" }
  - { pl: "rzucić światło na coś", ru: "пролить свет на что-то" }
