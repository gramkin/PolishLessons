lemma: "światło"
rank: 534
pos: noun
pron: { cyr: "сьвя́туо" }
senses:
  - id: light
    ru: "свет"
    examples:
      - pl: "Widziałem światło."
        ru: "Я видел свет."
        source: { kind: tatoeba, id: 3749885 }
      - pl: "Włącz światło."
