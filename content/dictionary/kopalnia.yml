notes:
  - { kind: false-friend, text: "Русского однокоренного слова нет, зато корень прозрачен и легко запоминается: KOPALNIA происходит от KOPAĆ «копать», то есть буквально «копальня», место, где копают. Русский в этом значении взял немецкое «шахта», а своё «копь» оставил специальным и почти книжным словом. Поэтому при переводе надо помнить, что KOPALNIA покрывает и шахту, и рудник, и прииск: KOPALNIA WĘGLA «угольная шахта», KOPALNIA SOLI «соляная копь», KOPALNIA ZŁOTA «золотой прииск». Глагол KOPAĆ при этом значит и «копать», и «пинать», и второе значение русскому придётся выучить отдельно." }
  - { kind: usage, text: "Падежные формы этого слова путают чаще других, потому что родительный единственного и родительный множественного выглядят по-разному, а на слух оба кажутся возможными. Родительный единственного — KOPALNI: NIE MA KOPALNI «шахты нет». Родительный множественного — KOPALŃ, с конечным Ń и без гласной: ZAMKNIĘTO PIĘĆ KOPALŃ «закрыли пять шахт». Это общее правило для существительных на -NIA: KSIĘGARNIA и KSIĘGARŃ, PRACOWNIA и PRACOWNI. Переносное значение, KOPALNIA WIEDZY «кладезь знаний», в польском живее русского и совершенно обиходно." }
  - { kind: pronunciation, text: "Читается «копа́льня», ударение на предпоследнем слоге. Сочетание LNIA даёт «льня»: L мягкая, как всегда, а NIA — «ня», одним слогом. Конечное -IA не образует отдельного слога, поэтому слово трёхсложное: KO-PAL-NIA. В родительном множественного KOPALŃ появляется Ń, и слово становится двусложным: «копа́льнь», с мягким н на конце, который русскому проще произнести как «нь»." }
  - { kind: government, text: "Женский род на -A после мягкой согласной. Винительный на -Ę: ZAMKNĘLI KOPALNIĘ. Что добывают — родительный без предлога: KOPALNIA WĘGLA, KOPALNIA SOLI, KOPALNIA MIEDZI. Работа внутри — предлог W с местным: W KOPALNI, и обратите внимание, что местный единственного совпадает с родительным единственного, обе формы KOPALNI. При отрицании винительный уходит в родительный, и получается та же форма: NIE ZAMKNĘLI KOPALNI." }
