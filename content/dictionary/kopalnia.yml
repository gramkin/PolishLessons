etymology: "От глагола KOPAĆ «копать», из праславянского *kopati — того же корня, что русские «копать», «копь», «окоп», «копыто». Суффикс -ALNIA в польском образует названия мест по действию и очень продуктивен: KOPALNIA «место, где копают», PALARNIA «курительная», PIEKARNIA «пекарня», DRUKARNIA «типография», KSIĘGARNIA «книжный магазин». Поэтому незнакомое слово на -ALNIA или -ARNIA почти всегда читается как название помещения или заведения, и это одно из самых полезных польских правил для угадывания смысла. Русское «шахта» пришло из немецкого SCHACHT и образа копания в себе не несёт, а русская «копь» от того же корня, что польское слово, но употребляется редко."
memory: "От kopać «копать»: буквально «копальня». Суффикс -alnia даёт названия мест: piekarnia, drukarnia, księgarnia — полезнейшее правило для догадки. Родительный единственного kopalni, а множественного kopalń, с мягким ń и без гласной. Переносное kopalnia wiedzy «кладезь знаний» в польском обиходно. Глагол kopać значит и «копать», и «пинать»."
