notes:
  - { kind: false-friend, text: "Русского однословного соответствия нет: «инопланетянин» построен из трёх частей, а «пришелец» говорит о приходе, не о космосе. Польское KOSMITA образовано прямо от KOSMOS с греческим по происхождению суффиксом -ITA, который означает принадлежность к месту или к общности: так же устроены IZRAELITA, SEMITA, JEZUITA. Русский в этом месте предпочитает свой суффикс -ЯНИН: «землянин», «марсианин», «инопланетянин». Отсюда простое правило при чтении: польское -ITA часто отвечает русскому -ЯНИН или -ИТ, и значение выводится из основы без словаря." }
  - { kind: usage, text: "Одиннадцать форм, мужской род. В единственном числе слово склоняется по женскому образцу, как SPECJALISTA и как русское «мужчина»: KOSMITY, KOSMICIE, KOSMITĘ, KOSMITĄ, KOSMITO. Во множественном возвращается мужское склонение: KOSMICI, KOSMITÓW, KOSMITOM. Прилагательные при этом всегда мужские: ZIELONY KOSMITA. Дважды виден один и тот же переход T в мягкий согласный: в дательном и местном KOSMICIE и в именительном множественного KOSMICI, где получается «ци». Винительный единственного равен родительному у лиц, но здесь он имеет своё окончание -Ę по женскому образцу." }
  - { kind: pronunciation, text: "Читается «косьми́та», три слога, ударение на втором. Буква S перед M смягчается не всегда, но в этом слове сочетание SM звучит мягко, ближе к «сьм». Буква O чистая. В форме KOSMICIE сочетание CIE даёт мягкое «це»: «косьми́це». В форме KOSMICI слышно «косьми́ци», с мягким «ци» на конце — это именительный множественного, а не местный падеж. В форме KOSMITÓW буква Ó читается как «у», а конечное W оглушается: «косьми́туф»." }
  - { kind: register, text: "Слово нейтральное и бытовое, принадлежит языку фантастики и детской игры. Устойчивые сочетания: ZIELONY KOSMITA «зелёный человечек», STATEK KOSMITÓW «корабль пришельцев», WIERZYĆ W KOSMITÓW. Переносное употребление очень частое и всегда шутливое: PATRZYLI NA MNIE JAK NA KOSMITĘ значит, что человек выглядел или говорил совершенно чуждо окружающим. Соседние слова того же гнезда: KOSMOS, KOSMICZNY, KOSMONAUTA — последнее употребляется о советских и российских космонавтах, тогда как об американских говорят ASTRONAUTA." }
