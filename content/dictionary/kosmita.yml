etymology: "От KOSMOS с суффиксом -ITA. Греческое KOSMOS означало сначала порядок и строй, затем украшение — отсюда «косметика», — и лишь потом мироздание как упорядоченное целое; все три значения живут в европейских языках до сих пор. Суффикс -ITES в греческом образовывал названия жителей и приверженцев, и через латынь он разошёлся по Европе в виде -ITA и -IT: польские IZRAELITA, JEZUITA, ERUDYTA, русские «семит», «иезуит», «эрудит». Польский воспользовался этим готовым образцом, когда понадобилось назвать обитателя космоса, а русский предпочёл собственный -ЯНИН, уже работавший в «землянине». Отсюда разница в облике слов при полном совпадении мысли."
memory: "Соответствия нет: по-русски «инопланетянин» или «пришелец», по-польски kosmita, от kosmos с греческим суффиксом -ita, тем же, что в izraelita и jezuita. Русский в этом месте берёт свой -янин: землянин, марсианин. Склонение как у specjalista: в единственном по женскому образцу (kosmity, kosmicie, kosmitę), во множественном по мужскому (kosmici), а прилагательные всегда мужские. Переход t в мягкое виден дважды: kosmicie и kosmici."
