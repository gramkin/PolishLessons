# review
id: kibel
format: 2
lemma: "kibel"
rank: 4341
pos: noun
pron: { cyr: "ки́бэль" }
senses:
  - id: loo
    ru: "разг. сортир, толчок, туалет"
    examples:
      - pl: "Muszę iść do kibla."
        ru: "Мне надо в сортир."
        source: { kind: authored }
      - pl: "Kibel na dworcu był brudny."
        ru: "Сортир на вокзале был грязный."
        source: { kind: authored }
      - pl: "Zamknął się w kiblu i płakał."
        ru: "Он заперся в туалете и плакал."
        source: { kind: authored }
  - id: toilet-bowl
    ru: "разг. унитаз"
    examples:
      - pl: "Telefon wpadł mu do kibla."
        ru: "Телефон упал у него в унитаз."
        source: { kind: authored }
      - pl: "Trzeba wymienić kibel w łazience."
        ru: "Надо заменить унитаз в ванной."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Русскому KIBEL ничего не подсказывает, а слово частое в разговоре. Это грубоватое «сортир», как русское «толчок». Вежливо — TOALETA, по-домашнему — ŁAZIENKA, детское — NOCNIK, «горшок». В тюремном жаргоне KIBEL — параша, отсюда и грубый оттенок." }
  - { kind: usage, text: "Мужской род, неодушевлённое, с беглым E: KIBEL, KIBLA, W KIBLU. Множественное KIBLE, родительный KIBLI. Уменьшительное KIBELEK звучит мягче и шутливо." }
  - { kind: government, text: "В туалет — DO KIBLA, DO с родительным. В туалете — W KIBLU, местный. Спустить в унитаз — SPUŚCIĆ W KIBLU, W с местным: и буквально, и в значении «выбросить»." }
  - { kind: pronunciation, text: "Читается «ки́бэль», два слога, ударение на первом. BE — твёрдое «бэ», конечная L мягкая. В KIBLA беглое E выпадает: «ки́бля»." }
  - { kind: register, text: "Разговорное и грубоватое слово, мужское, молодёжное. В гостях, в ресторане и при старших его лучше заменить на TOALETA: GDZIE JEST TOALETA? Выражение DO KIBLA, «в унитаз», значит «никуда не годится»: TA PRACA JEST DO KIBLA." }
collocations:
  - { pl: "iść do kibla", ru: "пойти в сортир" }
  - { pl: "spuścić w kiblu", ru: "спустить в унитаз" }
  - { pl: "do kibla", ru: "псу под хвост, в помойку (букв. в сортир)" }
family:
  - { pl: "toaleta", ru: "туалет", relation: root, id: toaleta }
  - { pl: "kibelek", ru: "туалетик (шутл.)", relation: derived }
  - { pl: "łazienka", ru: "ванная", relation: root, id: lazienka }
etymology: "Из немецкого Kübel, «бадья, ведро», через тюремный и солдатский жаргон, где так называли ведро-парашу в камере. Отсюда и грубый оттенок. Русскому слово чужое, но немецкое Kübel узнается в польском без труда."
memory: "Kibel — разг. сортир; и унитаз. Do kibla — в унитаз, никуда не годится. Вежливо — toaleta. Из немецкого Kübel — ведро. Читается «ки́бэль»."
idioms:
  - { pl: "do kibla", ru: "псу под хвост, в помойку (букв. в сортир)" }
