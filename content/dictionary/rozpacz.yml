# review
id: rozpacz
format: 2
lemma: "rozpacz"
rank: 2260
pos: noun
pron: { cyr: "ро́спач" }
senses:
  - id: despair
    ru: "отчаяние"
    examples:
      - pl: "Rozpacz doprowadziła go do próby samobójczej."
        ru: "Отчаяние довело его до попытки самоубийства."
        source: { kind: translated, id: 6683319 }
      - pl: "Oblał egzamin i pogrążył się w rozpaczy."
        ru: "Он провалил экзамен и погрузился в отчаяние."
        source: { kind: translated, id: 359166 }
      - pl: "Ona umiera z rozpaczy."
        ru: "Она умирает от отчаяния."
        source: { kind: translated, id: 959291 }
  - id: in-despair
    ru: "в обороте z rozpaczą — с отчаянием"
    examples:
      - pl: "Spojrzał na nas z rozpaczą."
        ru: "Он посмотрел на нас с отчаянием."
        source: { kind: authored }
      - pl: "Za późno już! — mówił z rozpaczą."
        ru: "Слишком поздно! — говорил он с отчаянием."
        source: { kind: authored }
      - pl: "Samobójstwo to akt rozpaczy."
        ru: "Самоубийство — акт отчаяния."
        source: { kind: translated, id: 352655 }
notes:
  - { kind: usage, text: "Существительное от rozpaczać «отчаиваться»; корень тот же, что в paczyć się «коробиться», исходно «ломаться, приходить в негодность»." }
  - { kind: usage, text: "Творительный z rozpaczą — «с отчаянием» — самая частая форма в повествовании: mówił z rozpaczą, spojrzał z rozpaczą." }
  - { kind: usage, text: "Множественного числа у слова нет: «отчаяния» не скажешь ни по-польски, ни по-русски." }
  - { kind: usage, text: "obraz nędzy i rozpaczy — устойчивое «жалкое зрелище», буквально «картина нищеты и отчаяния»." }
collocations:
  - { pl: "z rozpaczą", ru: "с отчаянием" }
  - { pl: "popaść w rozpacz", ru: "впасть в отчаяние" }
  - { pl: "akt rozpaczy", ru: "акт отчаяния" }
  - { pl: "obraz nędzy i rozpaczy", ru: "жалкое зрелище" }
etymology: "От rozpaczać «отчаиваться»; корень тот же, что в paczyć się «коробиться, кривиться» — исходно «приходить в негодность, ломаться»."
memory: "rozpacz — «отчаяние». Запомните прежде всего творительный падеж: z rozpaczą «с отчаянием» — в рассказе это самая частая форма (mówił z rozpaczą, spojrzał z rozpaczą). Множественного числа у слова нет, как и у русского «отчаяния»."
