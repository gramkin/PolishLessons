notes:
  - { kind: false-friend, text: "Русское «чад» — дым от подгоревшей еды, и слово знакомое. Польское CZAD того же происхождения, но значит другое: это угарный газ, невидимый и без запаха, тот самый, от которого гибнут зимой у газовых колонок. Чад от сковородки по-польски скорее SWĄD или DYM. А русское «угар» в переносном смысле, «в угаре веселья», польскому CZAD как раз близко: в молодёжной речи CZAD значит «отпад, круто»." }
  - { kind: usage, text: "Мужской род, неодушевлённое. Как название газа слово вещественное, множественного числа у него нет, поэтому в карточке только единственное. Живут формы CZAD, CZADU, CZADEM, CZADZIE, реже CZADOWI. В разговорном значении слово стоит в основном в двух оборотах: TO JEST CZAD и DAĆ CZADU." }
  - { kind: government, text: "Отравиться угарным газом — ZATRUĆ SIĘ CZADEM, творительный без предлога. Датчик угарного газа — CZUJNIK CZADU, родительный. Зажечь, оторваться — DAĆ CZADU, тоже родительный, как всегда при DAĆ в значении «выдать порцию чего-то»." }
  - { kind: pronunciation, text: "Читается «чат», один слог: CZ даёт «ч», конечная D оглушается в «т». В косвенных формах звонкость возвращается: CZADU «ча́ду», CZADEM «ча́дэм». В местном падеже D перед E смягчается: W CZADZIE «ф ча́дзье»." }
  - { kind: register, text: "Первое значение нейтральное и даже официальное: каждую зиму пожарные напоминают об угарном газе в новостях, а CZUJNIK CZADU продаётся в любом строительном магазине. Второе значение — молодёжный сленг девяностых и двухтысячных, теперь слегка старомодный: CZAD! в устах подростка звучит как «улёт!» у русского тридцатилетнего." }
collocations:
  - { pl: "czujnik czadu", ru: "датчик угарного газа" }
  - { pl: "zatrucie czadem", ru: "отравление угарным газом" }
  - { pl: "dać czadu", ru: "зажечь, оторваться (разг.)" }
family:
  - { pl: "czadowy", ru: "разг. классный, улётный", relation: derived }
  - { pl: "zaczadzić się", ru: "угореть", relation: derived }
  - { pl: "czadzić", ru: "чадить, дымить", relation: derived }
etymology: "Общеславянское *čadъ «дым, копоть»: отсюда и русское «чад», и чешское čad. Польский язык сохранил «дымное» значение лишь в старых текстах, а в девятнадцатом веке слово стало названием газа, который скапливается в избе от плохо протопленной печи. Сленговое «отпад» — уже двадцатый век: то, от чего кружится голова, как от угара."
memory: "Czad — не русский «чад» от сковородки, а угарный газ: czujnik czadu, zatruć się czadem. Читается «чат». А в разговоре «to był czad!» — «это был отпад!», и dać czadu — зажечь."
idioms:
  - { pl: "dać czadu", ru: "зажечь, оторваться по полной" }
  - { pl: "to jest czad", ru: "это отпад, это круто" }
