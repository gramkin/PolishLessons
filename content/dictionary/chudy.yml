pos: adj
pron: { cyr: "ху́ды" }
senses:
  - id: thin
    ru: "худой, тощий"
    examples:
      - pl: "Jest chudy jak patyk."
        ru: "Он худой как щепка."
        source: { kind: authored }
      - pl: "Po chorobie bardzo schudła i jest teraz chuda."
        ru: "После болезни она сильно похудела и теперь худая."
        source: { kind: authored }
      - pl: "To najchudszy kot w schronisku."
        ru: "Это самый тощий кот в приюте."
        source: { kind: authored }
  - id: lean
    ru: "нежирный, постный; скудный"
    examples:
      - pl: "Kupiłem chudy twaróg."
        ru: "Я купил нежирный творог."
        source: { kind: authored }
      - pl: "To były chude lata dla firmy."
        ru: "Это были скудные годы для фирмы."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Ловушка в половину слова. Русское «худой» значит и «тонкий», и «плохой, дырявый»: «худое ведро», «худо дело». Польское CHUDY — только «тощий» и «нежирный»: CHUDE MLEKO — «обезжиренное молоко», CHUDE MIĘSO — «постное мясо». «Плохой» по-польски — ZŁY или KIEPSKI." }
  - { kind: usage, text: "Полная парадигма с простыми степенями: CHUDY, CHUDSZY, NAJCHUDSZY. Мужское-личное множественное с чередованием D на DZ: CHUDZI; в степенях — CHUDSI, NAJCHUDSI. Вежливый синоним о человеке — SZCZUPŁY, «стройный», а CHUDY звучит как «тощий»." }
  - { kind: government, text: "Худой как щепка — CHUDY JAK PATYK или JAK SZCZAPA, JAK с именительным. В сравнении — NIŻ или OD с родительным. Похудеть — SCHUDNĄĆ." }
  - { kind: pronunciation, text: "Читается «ху́ды», два слога, ударение на первом. CH — «х», DY — твёрдое «ды». В мужском-личном CHUDZI: «ху́дзи», D становится мягким «дзь»." }
  - { kind: register, text: "Нейтральное слово, но о человеке звучит без комплимента, как русское «тощий»; комплимент — SZCZUPŁY. В магазинах CHUDY — стандарт на упаковках: CHUDY JOGURT, CHUDA SZYNKA. Выражение CHUDE LATA, «тощие годы», — из Библии, о бедных временах." }
collocations:
  - { pl: "chudy jak patyk", ru: "худой как щепка" }
  - { pl: "chudy twaróg", ru: "нежирный творог" }
  - { pl: "chude lata", ru: "тощие, скудные годы" }
family:
  - { pl: "schudnąć", ru: "похудеть", relation: derived }
  - { pl: "gruby", ru: "толстый", relation: root, id: gruby }
  - { pl: "szczupły", ru: "стройный, худощавый", relation: root }
etymology: "Общеславянское *xudъ, «малый, бедный, плохой», того же, что русское «худой». Русский сохранил оба смысла, «тонкий» и «плохой», а польский оставил только физический: худой и нежирный. «Плохой» осталось в русском «худо», которого в польском нет."
memory: "Chudy — худой, тощий; и нежирный: chudy twaróg, chude mleko. Не «плохой»! Chudszy, najchudszy; мн. ч. chudzi. Вежливо — szczupły. Читается «ху́ды»."
idioms:
  - { pl: "chudy jak patyk", ru: "худой как щепка" }
