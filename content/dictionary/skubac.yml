id: skubac
format: 2
lemma: "skubać"
rank: 2383
pos: verb
aspect: imperf
pron: { cyr: "ску́баць" }
senses:
  - id: nibble
    ru: "щипать (траву), общипывать"
    examples:
      - pl: "Owce skubią trawę."
        ru: "Овцы щиплют траву."
        source: { kind: authored }
      - pl: "Koń skubał siano."
        ru: "Конь щипал сено."
        source: { kind: authored }
      - pl: "Gęsi skubały zieloną murawę."
        ru: "Гуси щипали зелёную мураву."
        source: { kind: authored }
  - id: pluck
    ru: "щипать, теребить, выщипывать"
    examples:
      - pl: "Nie skub mnie za rękaw."
        ru: "Не теребите меня за рукав."
        source: { kind: authored }
      - pl: "Skubała nerwowo obrus."
        ru: "Она нервно теребила скатерть."
        source: { kind: authored }
notes:
  - { kind: government, text: "Винительный падеж: skubać trawę. За что — za + винительный: skubać kogoś za rękaw «теребить кого-л. за рукав»." }
  - { kind: false-friend, text: "Родня русскому «скубить, скубать» — областному слову со значением «дёргать за волосы». В литературном русском его почти нет, так что опора слабая." }
  - { kind: usage, text: "Skubać kurę значит «ощипывать курицу». Разговорно skubać kogoś — «обдирать кого-л.», брать втридорога." }
  - { kind: usage, text: "Совершенный вид — skubnąć (однократно). В корпусе глагол не встречается, примеры составлены вручную." }
collocations:
  - { pl: "skubać trawę", ru: "щипать траву" }
  - { pl: "skubać kurę", ru: "ощипывать курицу" }
etymology: "Родня областному русскому «скубать» — «дёргать за волосы»."
memory: "skubać — «щипать» траву и «теребить» за рукав. Ощипывать курицу — skubać kurę. Совершенный вид — skubnąć."
