# review
id: podzielic
format: 2
lemma: "podzielić"
rank: 1537
pos: verb
pron: { cyr: "подзе́лиць" }
senses:
  - id: divide
    ru: "разделить, поделить (на части)"
    examples:
      - pl: "Trzeba podzielić to na trzy części."
        ru: "Надо разделить это на три части."
        source: { kind: authored }
      - pl: "Nauczyciel podzieli uczniów na dwie grupy."
        ru: "Учитель разделит учеников на две группы."
        source: { kind: authored }
      - pl: "Majątek podzielono między spadkobierców."
        ru: "Имущество разделили между наследниками."
        source: { kind: authored }
  - id: share-out
    ru: "поделить (между кем-л.), поделиться"
    examples:
      - pl: "Podzielimy koszty na pół."
        ru: "Мы разделим расходы пополам."
        source: { kind: authored }
      - pl: "Podzielimy się wrażeniami po koncercie."
        ru: "Мы поделимся впечатлениями после концерта."
        source: { kind: authored }
  - id: split-opinion
    ru: "podzielony — расколотый, разделившийся (о мнениях)"
    examples:
      - pl: "Zdania są podzielone."
        ru: "Мнения разделились."
        source: { kind: authored }
      - pl: "Sprawa podzieliła opinię publiczną."
        ru: "Дело раскололо общественное мнение."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Ловушки нет, есть точное соответствие: po- плюс dzielić отвечает русскому «по-» плюс «делить». Корень праславянский *dělъ «часть, доля», откуда русские «делить», «доля», «отдел» и польские dział, podział. Оборот zdania są podzielone — слово в слово русское «мнения разделились»." }
  - { kind: government, text: "На что делят — предлог NA с винительным: podzielić na części, na grupy, na pół. Между кем — MIĘDZY с винительным: podzielić między dzieci. А «поделиться чем-то с кем-то» — podzielić się CZYMŚ (творительный) Z KIMŚ, в точности как по-русски." }
  - { kind: usage, text: "Глагол совершенного вида, поэтому podzielę, podzielisz, podzieli значат будущее. Несовершенная пара — dzielić. Отглагольное существительное podzielenie обозначает само действие, а готовый результат называют отдельным словом podział «раздел, деление»." }
  - { kind: pronunciation, text: "Страдательное причастие даёт -ony в большинстве форм, но в мужско-личном множественном о переходит в e: zatrudniony — zatrudnieni, podzielony — podzieleni. Это общее правило для таких причастий, и именно эта форма обычно застаёт врасплох." }
collocations:
  - { pl: "podzielić na pół", ru: "разделить пополам" }
  - { pl: "podzielić się czymś", ru: "поделиться чем-л." }
  - { pl: "zdania są podzielone", ru: "мнения разделились" }
family:
  - { pl: "dzielić", ru: "делить", relation: aspect }
  - { pl: "podział", ru: "раздел, деление", relation: derived }
  - { pl: "dział", ru: "отдел, раздел", relation: root }
etymology: "Приставка po- плюс dzielić, от праславянского *děliti и *dělъ «часть, доля». Русские «делить», «доля», «отдел» и «раздел» — из того же гнезда, поэтому podzielić отвечает «поделить» и «разделить» без остатка. Польское podział соответствует русскому «раздел», а dział — «отделу»."
memory: "podzielić — «поделить, разделить», po- + dzielić, часть в часть с русским. Делят na części (винительный с na), а делятся czymś z kimś, как по-русски. Мужско-личное причастие — podzieleni, с переходом -ony в -eni."
idioms:
  - { pl: "zdania są podzielone", ru: "мнения разделились" }
  - { pl: "podzielić się wrażeniami", ru: "поделиться впечатлениями" }
