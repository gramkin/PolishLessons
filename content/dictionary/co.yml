# review
id: co
format: 2
lemma: "co"
rank: 10
pos: noun
pron: { cyr: "цо" }
senses:
  - id: what-q
    ru: "что? (вопрос)"
    examples:
      - pl: "Co?"
        ru: "Что?"
        source: { kind: tatoeba, id: 441116 }
      - pl: "Co masz?"
        ru: "Что у тебя?"
        source: { kind: tatoeba, id: 1825415 }
      - pl: "Co czytasz?"
        ru: "Что ты читаешь?"
        source: { kind: tatoeba, id: 356413 }
  - id: what-rel
    ru: "что (в придаточном)"
    examples:
      - pl: "Wiem, co robisz."
        ru: "Я знаю, что ты делаешь."
        source: { kind: authored }
  - id: why
    ru: "czemu — почему (разговорное)"
    examples:
      - pl: "Czemu ucieka?"
        ru: "Почему он убегает?"
        source: { kind: tatoeba, id: 13784848 }
notes:
  - { kind: usage, text: "Склоняется: co — czego — czemu — czym. Дательное czemu заодно работает как разговорное «почему»." }
  - { kind: usage, text: "co перед словом времени значит «каждый»: co dzień «каждый день», co dwa lata «каждые два года»." }
collocations:
  - { pl: "co najmniej", ru: "по меньшей мере" }
  - { pl: "co dzień", ru: "каждый день" }
  - { pl: "co to jest?", ru: "что это?" }
etymology: "Старопольское cso из праславянского *čьso, родительного падежа от *čь, из праиндоевропейского *kʷíd; ср. русское «что»."
memory: "Падежи узнаваемы: czego «чего», czemu «чему», czym «чем». Две особенности: czemu в разговоре значит «почему», а co dwa dni — «каждые два дня»."
idioms:
  - { pl: "co najmniej", ru: "по меньшей мере" }
  - { pl: "nie ma co", ru: "не стоит" }
  - { pl: "co się stało, to się nie odstanie", ru: "что случилось, то случилось" }
