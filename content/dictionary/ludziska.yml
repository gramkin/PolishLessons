etymology: "От LUDZIE «люди» с экспрессивным суффиксом -ISKA, как в русском «людишки». Тот же корень, что в «люд», «люди»."
memory: "Ludziska — люди, народ (разг.). Ludziska, słuchajcie! — народ, слушайте! Biedne ludziska — бедные люди. Читается «людзи́ска»."
idioms:
  - { pl: "ludziska gadają", ru: "люди болтают, слухи ходят" }
