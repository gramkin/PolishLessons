notes:
  - { kind: false-friend, text: "LUDZISKA — разговорное «люди, народ», с оттенком: шутливым (LUDZISKA, SŁUCHAJCIE!), сочувственным (BIEDNE LUDZISKA) или пренебрежительным. Нейтрально — LUDZIE." }
  - { kind: register, text: "Слово разговорное и эмоциональное. В обращении к толпе звучит по-свойски. В официальной речи не используется." }
  - { kind: usage, text: "Pluralia tantum: пять форм. Родительный — LUDZISKÓW. Согласуется как средний или мужской род: BIEDNE LUDZISKA." }
  - { kind: pronunciation, text: "Читается «людзи́ска»: LU — мягкое «лю», DZI — «дзи». Ударение на предпоследнем слоге." }
collocations:
  - { pl: "biedne ludziska", ru: "бедные люди" }
  - { pl: "ludziska z miasta", ru: "городской люд" }
  - { pl: "ludziska, słuchajcie", ru: "народ, слушайте" }
family:
