notes:
  - { kind: false-friend, text: "Слово заимствовано обоими языками из одного источника и значит то же самое, поэтому прямой ловушки нет — зато есть две соседние. Первая: лампочка по-польски ŻARÓWKA, от ŻARZYĆ SIĘ «накаляться», а не LAMPKA. LAMPA — это прибор целиком, ŻARÓWKA — стеклянный баллон внутри, и фраза о перегоревшей лампочке требует именно ŻARÓWKA. Вторая: LAMPKA значит и маленькую лампу, и бокал вина — LAMPKA WINA, выражение очень частое за столом. Уличный фонарь — не LAMPA, а LATARNIA." }
  - { kind: usage, text: "Десять форм, женский род. Родительный единственного и именительный множественного — одна форма LAMPY. Дательный и местный единственного — LAMPIE, с мягким P. Родительный множественного — LAMP, с нулевым окончанием и без всякой вставки: сочетание MP выговаривается легко, и гласный не нужен. Это хорошо видно рядом с KROPEL и NEREK, где язык вставляет беглое E, потому что иначе согласные столкнулись бы. Таким образом три женских слова на -A дают в одной и той же форме три разных исхода, и выбор зависит только от того, выговаривается ли конец основы." }
  - { kind: pronunciation, text: "Читается «ла́мпа», два слога, ударение на первом — как и в русском, так что здесь перестраиваться не надо. Польское L произносится мягче русского твёрдого «л», ближе к европейскому, но на письме это никак не отражается. В форме LAMPIE буквосочетание PIE даёт мягкое «пе»: «ла́мпе». В форме LAMPĄ последнее Ą звучит «он»: «ла́мпон». В форме LAMPĘ конечное Ę читается как чистое «э»: «ла́мпэ». Конечное P в форме LAMP остаётся глухим и твёрдым." }
  - { kind: register, text: "Слово нейтральное и повседневное. Устойчивые сочетания покрывают почти весь быт: LAMPA NAFTOWA «керосиновая лампа», LAMPA BIURKOWA «настольная лампа», LAMPA BŁYSKOWA «фотовспышка», LAMPA KWARCOWA «кварцевая лампа». Уменьшительное LAMPKA вдвойне полезно: LAMPKA NOCNA «ночник» и LAMPKA WINA «бокал вина», и второе значение в разговоре встречается едва ли не чаще первого. Звательная форма LAMPO в живой речи не употребляется, она возможна только в стихах или в шутливом обращении к вещи." }
