etymology: "Из греческого LAMPAS «факел», от глагола LAMPEIN «светить», через латинское LAMPAS и дальше по всей Европе: французское LAMPE, немецкое LAMPE, итальянское LAMPADA. Польский взял слово из немецкого, русский — тем же путём через западные языки, и потому два слова совпадают и в звучании, и в значении: это не родство, а общее заимствование. От того же греческого корня идёт и «лампада», пришедшая в русский отдельно и раньше, через церковнославянский и греческий напрямую, с сохранением исходного -АД-. Польское ŻARÓWKA, напротив, слово собственное и позднее: оно образовано от ŻARZYĆ SIĘ «накаляться» в конце девятнадцатого века, когда появилась угольная нить накаливания."
memory: "Общее заимствование, не родство: оба языка взяли греческое lampas «факел» через западные языки, поэтому слово и значение совпадают, и ударение тоже на первом слоге. Ловушки по соседству: лампочка это żarówka (от żarzyć się «накаляться»), уличный фонарь — latarnia, а lampka значит и ночник, и бокал вина. Родительный множественного lamp без вставного гласного — в отличие от kropel и nerek, где язык вставляет беглое e."
idioms:
  - { pl: "lampka wina", ru: "бокал вина" }
