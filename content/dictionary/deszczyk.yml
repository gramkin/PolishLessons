pos: noun
pron: { cyr: "дэ́шчык" }
senses:
  - id: drizzle
    ru: "дождик, лёгкий дождь"
    examples:
      - pl: "Wczoraj padał lekki deszczyk."
        ru: "Вчера шёл лёгкий дождик."
        source: { kind: translated, id: 6360126 }
      - pl: "Pada ciepły deszczyk."
        ru: "Идёт тёплый дождик."
        source: { kind: authored }
      - pl: "Deszczyk ustał po chwili."
        ru: "Дождик перестал через минуту."
        source: { kind: authored }
  - id: light-rain
    ru: "дождичек (ласково)"
    examples:
      - pl: "Taki deszczyk nikomu nie zaszkodzi."
        ru: "Такой дождик никому не повредит."
        source: { kind: authored }
      - pl: "Wyszli mimo deszczyku."
        ru: "Они вышли несмотря на дождик."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Уменьшительное от deszcz «дождь», у которого уже есть карточка. Оттенок ласковый: не просто слабый дождь, а безобидный." }
  - { kind: government, text: "Мужской неодушевлённый; родительный — deszczyku. Идёт дождь — pada deszcz, с глаголом padać." }
  - { kind: false-friend, text: "Корень тот же, что в русском «дождь»; польское szcz здесь передаёт то же сочетание, что русское жд." }
  - { kind: usage, text: "В корпусе слово встречается один раз, поэтому большинство примеров составлено вручную." }
collocations:
  - { pl: "pada deszczyk", ru: "идёт дождик" }
  - { pl: "ciepły deszczyk", ru: "тёплый дождик" }
etymology: "Уменьшительное от deszcz «дождь», праславянское *dъždžь; русское «дождь» — то же слово."
memory: "deszczyk — «дождик», уменьшительное от deszcz. Оттенок ласковый и безобидный. Идёт дождь — pada deszcz."
