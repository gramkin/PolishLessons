notes:
  - { kind: false-friend, text: "ГЛАВНАЯ ловушка: dywan — это КОВЁР, а не диван. Диван по-польски kanapa или sofa. Слова пришли из одного восточного источника, но разошлись: у турок диван был и советом, и залой с коврами." }
  - { kind: government, text: "Мужской неодушевлённый; родительный — dywanu. На ковре — na dywanie, предложный падеж." }
  - { kind: usage, text: "Czerwony dywan «красная ковровая дорожка» — то же, что в русском." }
  - { kind: usage, text: "Оборот zamieść coś pod dywan значит «замести под ковёр», то есть скрыть неудобное дело." }
collocations:
  - { pl: "na dywanie", ru: "на ковре" }
  - { pl: "czerwony dywan", ru: "красная дорожка" }
etymology: "Через турецкий из персидского dīvān; в русском то же слово дало «диван», в польском — «ковёр»."
memory: "dywan — это КОВЁР, а не диван. Диван по-польски kanapa. Одно восточное слово разошлось в двух языках по разным предметам."
idioms:
  - { pl: "na dywanie", ru: "на ковре" }
  - { pl: "zamieść pod dywan", ru: "замести под ковёр" }
