# review
id: motyw
format: 2
lemma: "motyw"
rank: 2251
pos: noun
pron: { cyr: "мо́тыф" }
senses:
  - id: reason
    ru: "мотив, побуждение"
    examples:
      - pl: "Motyw zbrodni pozostał nieznany."
        ru: "Мотив преступления остался неизвестным."
        source: { kind: authored }
      - pl: "Nie znaleziono żadnego motywu."
        ru: "Не нашли никакого мотива."
        source: { kind: authored }
  - id: musical-motif
    ru: "мотив (музыкальный)"
    examples:
      - pl: "Motyw przewodni wraca w każdym akcie."
        ru: "Главный мотив возвращается в каждом акте."
        source: { kind: authored }
      - pl: "Nucił jakiś znajomy motyw."
        ru: "Он напевал какой-то знакомый мотив."
        source: { kind: authored }
  - id: pattern
    ru: "мотив, узор (в искусстве)"
    examples:
      - pl: "Motywy roślinne zdobią cały sufit."
        ru: "Растительные мотивы украшают весь потолок."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ЗНАЧЕНИЯ ТЕ ЖЕ, ЧТО В РУССКОМ, НО ОДНОГО НЕ ХВАТАЕТ. Motyw это побуждение, музыкальная тема и художественный узор — всё как по-русски. Чего он НЕ значит, так это «стимул, заинтересованность»: за это отвечают motywacja и bodziec. Сказать «brak mi motywu do pracy» нельзя, нужно brak mi motywacji." }
  - { kind: pronunciation, text: "Два слога, ударение на первом: MO-tyw. Конечное w оглушается до ф: «мо́тыф». В косвенных падежах звонкость возвращается: motywu — «моты́ву». В предложном w смягчается: w motywie — «в моты́ве»." }
  - { kind: usage, text: "Самое частое сочетание — motyw przewodni «лейтмотив, главный мотив», и говорят так не только о музыке, но и о книге, выставке, выступлении. В юридическом языке motyw значит побуждение к преступлению: motyw rabunkowy, motyw zemsty." }
collocations:
  - { pl: "motyw przewodni", ru: "лейтмотив" }
  - { pl: "motyw zbrodni", ru: "мотив преступления" }
  - { pl: "motywy roślinne", ru: "растительные мотивы" }
family:
  - { pl: "motywacja", ru: "мотивация", relation: derived }
  - { pl: "motywować", ru: "мотивировать", relation: derived }
  - { pl: "powód", ru: "причина", relation: root, id: powod }
etymology: "Из латинского motivus «движущий», от movere «двигать» — того же корня, что «момент» и «мотор». В польский и в русский слово пришло через западные языки почти одновременно, поэтому значения совпадают. Отсюда motywacja, motywować и umotywowany."
memory: "motyw — «мотив» во всех привычных смыслах: побуждение, музыкальная тема, узор. Одного значения нет: «мотивация, стимул» — это motywacja, не motyw. И запомнить стоит оборот motyw przewodni «лейтмотив»."
idioms:
  - { pl: "motyw przewodni", ru: "лейтмотив, главная тема" }
  - { pl: "motyw zbrodni", ru: "мотив преступления" }
