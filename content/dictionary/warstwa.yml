notes:
  - { kind: false-friend, text: "WARSTWA — «слой», и похожего русского слова для слоя нет. WARSTWA FARBY — слой краски, WARSTWA OZONOWA — озоновый слой, WARSTWY SPOŁECZNE — слои общества. Одеваться слоями — UBIERAĆ SIĘ NA WARSTWY, а в разговоре NA CEBULKĘ, «как луковица»." }
  - { kind: usage, text: "Десять форм в таблице, женский род. В дательном и местном падежах W смягчается: W WARSTWIE. Родительный множественного — WARSTW, без окончания. Звательная форма не нужна." }
  - { kind: government, text: "Слой чего-то — WARSTWA CZEGOŚ, родительный: WARSTWA KURZU. В слое — W WARSTWIE, местный. Одеваться слоями — UBIERAĆ SIĘ NA WARSTWY, NA с винительным." }
  - { kind: pronunciation, text: "Читается «ва́рстфа», два слога, ударение на первом. W после глухого T оглушается в «ф», как в TWARZ «тфаш». В форме WARSTWIE: «ва́рстфе»." }
collocations:
