etymology: "Слово праславянское, от древнего слова со значением «ряд», того же, что в русских «верста» и «сверстник». Слой — это ряд, лежащий на другом ряду, а сверстник — человек из того же «ряда» лет."
memory: "Warstwa — слой: warstwa farby, warstwa ozonowa. Читается «ва́рстфа». Родня русских «верста» и «сверстник» — всё от древнего «ряда». Ubierać się na warstwy — одеваться слоями."
