  - { pl: "razić", ru: "резать (о свете), поражать", relation: root }
  - { pl: "przerażenie", ru: "ужас", relation: derived }
etymology: "Приставка prze- и RAZIĆ, из праславянского *raziti «ударить, резать» — тот же корень, что в русских «разить», «поразить», «заразить», «раз». Буквально «пронять ударом», откуда «ужаснуть». Польское RAZIĆ сохранило смысл резкого воздействия: ŚWIATŁO RAZI OCZY «свет режет глаза». Из гнезда вышли PRZERAŻENIE «ужас», PRZERAŻONY «испуганный», PRZERAŻAJĄCY «ужасающий», PORAZIĆ «поразить током», RAZ «раз»."
memory: "Корень тот же, что в «разить», но смысл — «напугать», не «поразить». Один мягкий з пишется тремя способами: przeraź, przerazi, przerażę."
idioms:
