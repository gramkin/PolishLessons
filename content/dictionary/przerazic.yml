notes:
  - { kind: pronunciation, text: "Этот глагол доводит до конца правило из карточки ZŁOŚCIĆ, и заодно показывает, что оно о звуке, а не о букве. Там сказано: основы на ś, ź, ść, źdź твердеют перед окончаниями -ę и -ą. Здесь основа кончается мягким з, и польское письмо пишет его тремя способами: ź на конце слова и перед согласным — PRZERAŹ, PRZERAŹMY; zi перед гласной — PRZERAZI, PRZERAZISZ, PRZERAZIŁ; и наконец ż перед -ę и -ą, где он твердеет, — PRZERAŻĘ, PRZERAŻĄ. Буквы разные, согласный один и тот же, и правило к нему относится полностью." }
  - { kind: false-friend, text: "Похожих русских слов два, и ни одно не годится. PRZERAZIĆ значит «напугать, ужаснуть», а не «поразить»: «поразить» в смысле удивить — это ZADZIWIĆ, а в смысле ударить током или болезнью — PORAZIĆ. Корень у всех один: RAZIĆ, от праславянского *raziti «ударить», откуда и русские «разить», «поразить», «заразить». Приставка prze- дала здесь «пронять ударом», отсюда страх. Само RAZIĆ в польском значит «резать» о свете: ŚWIATŁO RAZI OCZY — «свет режет глаза»." }
  - { kind: usage, text: "Страдательное причастие живёт отдельной жизнью как обычное прилагательное, и встречается чаще самого глагола: PRZERAŻONY значит «испуганный». PATRZYŁ NA MNIE PRZERAŻONYMI OCZAMI — «он смотрел на меня испуганными глазами». Мужская личная форма множественного — PRZERAŻENI с e при PRZERAŻONY с o, та же мена, что в karmiony при karmieni. Существительное PRZERAŻENIE — «ужас», а действительное причастие от несовершенной пары, PRZERAŻAJĄCY, значит «ужасающий»." }
  - { kind: government, text: "Переходный: PRZERAZIĆ KOGOŚ в винительном — przeraził mnie, przeraziła dzieci. С SIĘ становится возвратным и берёт родительный или предлог: PRZERAZIĆ SIĘ CZEGOŚ «испугаться чего-то», PRZERAZILI SIĘ WŁASNEGO POMYSŁU. Русский здесь тоже берёт родительный — «испугаться шума», — так что перенос работает. Пятьдесят три формы: совершенный переходный, с деепричастием PRZERAZIWSZY и без действительного причастия. Несовершенная пара — PRZERAŻAĆ." }
collocations:
  - { pl: "przerazić kogoś", ru: "напугать кого-либо" }
  - { pl: "przerazić się czegoś", ru: "испугаться чего-либо" }
