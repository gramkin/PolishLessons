etymology: "От прилагательного WDZIĘCZNY, а то от основы DZIĘK-, которая в польский пришла из средневерхненемецкого DANK «благодарность, мысль», скорее всего через чешский. Это редкий случай, когда частое и совершенно обыденное польское слово оказывается заимствованием, а русское соответствие — своим: «спасибо» сложено из «спаси» и «Бог», а «благодарность» переведена по частям с греческого EUCHARISTIA. Через польский это немецкое слово разошлось дальше на восток и дало украинское «дякую» и белорусское «дзякуй». Суффикс -OŚĆ при этом свой, славянский, и отвечает русскому -ОСТЬ."
memory: "Корень не славянский: за словом стоит dziękować, заимствованное из немецкого danken через чешский, отсюда же украинское «дякую». Русское «спасибо» и «благодарность» — совсем другого происхождения, так что опереться на знакомое не получится. Поправить управление: wdzięczność ZA pomoc как в русском, но wdzięczność WOBEC rodziców с родительным, где русский ставит дательный. Зато jestem CI wdzięczny совпадает. Читается «вдзе́нчносьчь»."
