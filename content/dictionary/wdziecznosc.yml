notes:
  - { kind: false-friend, text: "Корень этого слова русскому незнаком, и знать об этом полезнее, чем искать сходство. За WDZIĘCZNOŚĆ стоит DZIĘKOWAĆ «благодарить» и DZIĘKI «спасибо», а это заимствование из средневекового немецкого DANK «благодарность», пришедшее через чешский. Русский в этом месте взял своё: «спасибо» выросло из «спаси Бог», а «благодарность» переведена по частям с греческого. Зато украинское «дякую» и белорусское «дзякуй» — то же немецкое слово, пришедшее через польский, и тому, кто их знает, DZIĘKUJĘ понятно сразу." }
  - { kind: government, text: "За что благодарность — предлог ZA с винительным: WDZIĘCZNOŚĆ ZA POMOC «благодарность за помощь», как по-русски. Перед кем или кому — предлог WOBEC с родительным или DLA с родительным: WDZIĘCZNOŚĆ WOBEC RODZICÓW «благодарность родителям», и здесь русский ставит дательный, так что падеж приходится менять. Прилагательное WDZIĘCZNY управляет дательным лица: JESTEM CI WDZIĘCZNY «я тебе благодарен», и это уже совпадает с русским полностью." }
  - { kind: pronunciation, text: "Читается «вдзе́нчносьчь», два слога, ударение на первом. Разбирается оно так: W перед звонким DZ остаётся «в»; сочетание DZI даёт слитное мягкое «дзь», и перед Ę это «дзе»; носовая Ę перед CZ звучит как «эн»; CZ даёт твёрдое «ч». Конец слова, -ŚĆ, это два мягких звука подряд, «сьчь». В слове DZIĘKUJĘ слышно «дзенку́е», и начало там то же самое." }
  - { kind: usage, text: "Шесть форм, разряд женских существительных на -OŚĆ. Отвлечённое существительное, поэтому множественное число редко и годится только для отдельных проявлений: WDZIĘCZNOŚCI PACJENTÓW «благодарности пациентов». Суффикс -OŚĆ отвечает русскому -ОСТЬ, а основа идёт от прилагательного WDZIĘCZNY «благодарный». У того же прилагательного есть второе значение, которого у существительного нет: WDZIĘCZNY TEMAT значит «выигрышная тема», то есть тема, на которой легко себя показать." }
  - { kind: register, text: "Слово нейтральное, чуть торжественное. Частые обороты: Z WDZIĘCZNOŚCIĄ «с благодарностью», WYRAZIĆ WDZIĘCZNOŚĆ «выразить благодарность», DŁUG WDZIĘCZNOŚCI «долг благодарности», W DOWÓD WDZIĘCZNOŚCI «в знак благодарности». В быту вместо существительного почти всегда скажут глаголом или прилагательным: DZIĘKUJĘ или JESTEM WDZIĘCZNY. Отдельно стоит DZIĘKI как предлог со значением «благодаря»: DZIĘKI TOBIE, с дательным." }
