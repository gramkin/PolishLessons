etymology: "Сравнительная форма от rad «рад, охотный» — буквально «охотнее». Русское «скорее» в этом значении тоже сравнительное."
memory: "raczej — «скорее, пожалуй», и служит оно смягчению: Jest raczej bogata «Она, пожалуй, богата». Самое частое сочетание — raczej nie «пожалуй, нет». Слово происходит от rad «рад» и буквально значит «охотнее», поэтому wolałbym raczej — это «я бы скорее предпочёл». С prędzej «быстрее» его лучше не путать: raczej никогда не о скорости."
