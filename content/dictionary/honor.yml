  - form: "honorowi"
    pl: "Nie wolno ingerować samowolnie w czyjekolwiek życie prywatne, rodzinne, domowe, ani w jego korespondencję, ani też uwłaczać jego honorowi lub dobremu imieniu. Każdy człowiek ma prawo do ochrony prawnej przeciwko takiej ingerencji lub uwłaczaniu."
    ru: "Нельзя произвольно вмешиваться в чью-либо личную, семейную или домашнюю жизнь, ни в его переписку, ни посягать на его честь и доброе имя. Каждый человек имеет право на защиту закона от такого вмешательства или таких посягательств."
    source: { kind: translated, id: 3594407 }
