# review
id: honor
format: 2
lemma: "honor"
rank: 1848
pos: noun
pron: { cyr: "хо́нор" }
senses:
  - id: honour
    ru: "честь, достоинство"
    examples:
      - pl: "To jest honor."
        ru: "Это честь."
        source: { kind: translated, id: 3744063 }
      - pl: "On ceni honor nade wszystko."
        ru: "Он ценит честь превыше всего."
        source: { kind: translated, id: 1604088 }
      - pl: "Nawet złodzieje mają swój honor."
        ru: "Даже у воров есть своя честь."
        source: { kind: translated, id: 525694 }
  - id: word-of-honour
    ru: "честь (слово чести, человек чести)"
    examples:
      - pl: "Daję ci słowo honoru."
        ru: "Даю тебе слово чести."
        source: { kind: translated, id: 3432571 }
      - pl: "Myślałem, że jesteś człowiekiem honoru."
        ru: "Я думал, что ты человек чести."
        source: { kind: tatoeba, id: 3695173 }
      - pl: "Bez honoru zwycięstwo jest daremne."
        ru: "Без чести победа напрасна."
        source: { kind: translated, id: 2164539 }
notes:
  - { kind: government, text: "Бороться за честь — walczyć o honor (винительный с o): walczyli o honor swojego kraju." }
  - { kind: usage, text: "słowo honoru — «слово чести»; człowiek honoru — «человек чести»; punkt honoru — «дело чести»." }
  - { kind: usage, text: "Во множественном honory значит «почести»: oddawać honory «отдавать почести», в том числе воинское приветствие." }
  - { kind: false-friend, text: "Русские «честь» и «почести» — это одно польское слово honor в разных числах. Польское cześć при этом значит и «честь», и «привет»." }
collocations:
  - { pl: "słowo honoru", ru: "слово чести" }
  - { pl: "człowiek honoru", ru: "человек чести" }
  - { pl: "walczyć o honor", ru: "бороться за честь" }
family:
  - { pl: "honorowy", ru: "почётный", relation: root }
  - { pl: "cześć", ru: "честь; привет", relation: root, id: czesc }
  - { pl: "godność", ru: "достоинство", relation: root }
etymology: "Из латинского honor через западные языки; русское «гонор» пришло тем же путём, но огрубело до «спеси». Польское honor сохранило исходное «честь»."
memory: "honor — «честь»: słowo honoru «слово чести», człowiek honoru. Во множественном honory — «почести». Осторожно: русский «гонор» значит совсем другое."
idioms:
