# review
id: bzdura
format: 2
lemma: "bzdura"
rank: 1210
pos: noun
pron: { cyr: "бзду́ра" }
senses:
  - id: nonsense
    ru: "чушь, ерунда, вздор"
    examples:
      - pl: "Bzdura!"
        ru: "Враки!"
        source: { kind: tatoeba, id: 8254329 }
      - pl: "To bzdura."
        ru: "Это чушь."
        source: { kind: tatoeba, id: 6327917 }
      - pl: "Co za bzdura!"
        ru: "Что за чушь!"
        source: { kind: translated, id: 8676539 }
  - id: talk-nonsense
    ru: "mówić bzdury — нести чушь, говорить ерунду"
    examples:
      - pl: "Mówisz bzdury, mój przyjacielu."
        ru: "Ты говоришь чушь, мой друг."
        source: { kind: tatoeba, id: 2122425 }
      - pl: "Gadasz bzdury."
        ru: "Ты несёшь чушь."
        source: { kind: translated, id: 2218823 }
      - pl: "Nie mów bzdur!"
        ru: "Не говори чепухи!"
        source: { kind: translated, id: 4916351 }
  - id: trifle
    ru: "ерунда, пустяк — то, что не стоит внимания"
    examples:
      - pl: "Nie marnuj pieniędzy na bzdury."
        ru: "Не трать деньги на ерунду."
        source: { kind: translated, id: 744246 }
      - pl: "Bzdury!"
        ru: "Враки!"
        source: { kind: tatoeba, id: 3643209 }
      - pl: "Kłócą się o bzdury."
        ru: "Они ссорятся из-за ерунды."
        source: { kind: authored }
notes:
  - { kind: government, text: "При отрицании винительный переходит в родительный, и это самая частая форма слова: Nie mów bzdur! «Не говори чепухи!», а не bzdury." }
  - { kind: register, text: "Слово разговорное, но вполне приличное — как русские «чушь», «ерунда», «вздор». Грубее звучат bzdety и brednie." }
  - { kind: usage, text: "Устойчивое stek bzdur «сплошная чушь», буквально «поток чуши»: To stek bzdur." }
  - { kind: usage, text: "Глаголы при нём — gadać, mówić, opowiadać, wygadywać bzdury: все значат «нести чушь»." }
collocations:
  - { pl: "mówić bzdury", ru: "нести чушь" }
  - { pl: "stek bzdur", ru: "сплошная чушь" }
  - { pl: "co za bzdura", ru: "что за чушь" }
etymology: "Слово тёмного происхождения, скорее всего звукоподражательное, того же ряда, что bzdyk и bzik. Прямого русского родственника у него нет."
memory: "bzdura — «чушь, ерунда». Чаще всего встречается во множественном числе и с отрицанием, а там винительный становится родительным: Nie mów bzdur! И запомните stek bzdur «сплошная чушь»."
idioms:
  - { pl: "stek bzdur", ru: "сплошная чушь" }
  - { pl: "mówić bzdury", ru: "нести чушь" }
  - { pl: "co za bzdura", ru: "что за чушь" }
formExamplesSkip:
  - { form: "bzduro", reason: "звательный падеж: для неодушевлённого существительного он практически не употребляется" }
