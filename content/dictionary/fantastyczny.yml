notes:
  - { kind: false-friend, text: "ЧАЩЕ ВСЕГО ЭТО ПРОСТО «ЗАМЕЧАТЕЛЬНЫЙ», А НЕ «ФАНТАСТИЧЕСКИЙ». Fantastyczny pomysł, fantastyczna pogoda, fantastyczni ludzie — обычная бытовая похвала, равная świetny «отличный». Русское «фантастический» в похвале звучит сильнее и реже, поэтому переводить надо словами «потрясающий, замечательный», а жанр оставить контексту." }
  - { kind: usage, text: "СТЕПЕНИ СРАВНЕНИЯ У ДЛИННЫХ ПРИЛАГАТЕЛЬНЫХ ОБЫЧНО АНАЛИТИЧЕСКИЕ. Формы fantastyczniejszy и najfantastyczniejszy образованы по правилу и в словарях есть, но в живой речи почти всегда скажут BARDZIEJ FANTASTYCZNY и NAJBARDZIEJ FANTASTYCZNY. Знать синтетические формы нужно, чтобы узнавать их в тексте, а строить лучше через bardziej." }
  - { kind: pronunciation, text: "Четыре слога, ударение на предпоследнем: fan-tas-TYCZ-ny. An звучит как «ан», cz как ч, y как ы: «фантасты́чны». В превосходной степени ударение смещается далеко вправо: naj-fan-tas-tycz-NIEJ-szy." }
collocations:
  - { pl: "fantastyczny pomysł", ru: "потрясающая идея" }
  - { pl: "literatura fantastyczna", ru: "фантастика" }
  - { pl: "fantastyka naukowa", ru: "научная фантастика" }
family:
  - { pl: "fantastyka", ru: "фантастика", relation: root }
  - { pl: "fantazja", ru: "фантазия", relation: root }
  - { pl: "zwyczajny", ru: "обычный", relation: antonym }
etymology: "Из греческого phantastikos «способный воображать», от phantazein «являть, показывать», от phainein «светить, являться». Тот же корень дал «фантазию», «фантом» и «феномен». Русское «фантастический» пришло тем же путём через латынь и французский."
memory: "fantastyczny в быту значит «потрясающий», а не «фантастический»: fantastyczny pomysł. И помни, что сравнительную от таких длинных слов строят через BARDZIEJ, хотя форма fantastyczniejszy существует."
idioms:
  - { pl: "fantastyka naukowa", ru: "научная фантастика" }
  - { pl: "fantastyczna robota", ru: "потрясающая работа" }
