  - id: genre
    ru: "фантастический (о жанре)"
    examples:
      - pl: "Fantastyczna literatura ma tu wielu czytelników."
        ru: "У фантастической литературы здесь много читателей."
        source: { kind: authored }
      - pl: "Fantastyczne stworzenia mieszkają w tej książce."
        ru: "Фантастические существа живут в этой книге."
