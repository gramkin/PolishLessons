# review
id: zechciec
format: 2
lemma: "zechcieć"
rank: 1065
pos: verb
aspect: perf
aspectPair: chciec
pron: { cyr: "зэ́хчець" }
senses:
  - id: want
    ru: "захотеть (совершенный вид)"
    examples:
      - pl: "Przyjdź kiedy zechcesz."
        ru: "Приходи, когда захочешь."
        source: { kind: tatoeba, id: 1182265 }
      - pl: "Jeśli dużo wiesz, możesz zostać kim zechcesz."
        ru: "Если много знаешь, можешь стать кем угодно."
        source: { kind: tatoeba, id: 773076 }
      - pl: "Zrobię co zechcę."
        ru: "Сделаю что захочу."
        source: { kind: translated, id: 5138588 }
  - id: polite
    ru: "вежливая просьба: czy zechce pan poczekać? «не согласитесь ли вы?»"
    note: "В живой речи это главное употребление глагола."
    examples:
      - pl: "Czy zechce pan chwileczkę poczekać?"
        ru: "Не подождёте ли минутку?"
        source: { kind: translated, id: 365180 }
      - pl: "Czy zechciałby Pan poczekać?"
        ru: "Не согласитесь ли вы подождать?"
        source: { kind: translated, id: 1480708 }
      - pl: "To bardzo miłe z pana strony, że zechciał mi pan pomóc."
        ru: "Очень любезно с вашей стороны, что вы согласились мне помочь."
        source: { kind: translated, id: 903987 }
notes:
  - { kind: usage, text: "Совершенный вид к chcieć «хотеть». Приставка ze- здесь только завершает действие: zechcieć «захотеть»." }
  - { kind: usage, text: "Чаще всего встречается не в значении «захотеть», а в вежливых формулах: Czy zechce pan poczekać? «Не согласитесь ли вы подождать?». Русский эквивалент — «не будете ли так любезны»." }
  - { kind: usage, text: "В придаточных значит «когда угодно, как угодно»: Przyjdź, kiedy zechcesz «Приходи, когда захочешь»; Rób, co zechcesz «Делай что хочешь»." }
  - { kind: false-friend, text: "zechcieć — это «захотеть», а не «расхотеть». Расхотеть по-польски — odechcieć się: Odechciało mi się «Мне расхотелось»." }
collocations:
  - { pl: "kiedy zechcesz", ru: "когда захочешь" }
  - { pl: "co zechcesz", ru: "что захочешь" }
  - { pl: "czy zechce pan", ru: "не согласитесь ли вы" }
family:
  - { pl: "chcieć", ru: "хотеть", relation: aspect, id: chciec }
  - { pl: "chętny", ru: "охотный, готовый", relation: derived }
  - { pl: "ochota", ru: "охота, желание", relation: derived }
etymology: "Приставка ze- (вариант z-) плюс chcieć «хотеть». Русское «захотеть» собрано по той же модели, только с приставкой «за-»."
memory: "zechcieć — совершенный вид к chcieć: «захотеть». Но чаще всего вы встретите его не в этом значении, а в вежливой формуле: Czy zechce pan poczekać? «Не согласитесь ли вы подождать?»."
idioms:
  - { pl: "kiedy tylko zechcesz", ru: "когда только захочешь" }
  - { pl: "rób co zechcesz", ru: "делай что хочешь" }
