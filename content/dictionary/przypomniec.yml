# review
id: przypomniec
format: 2
lemma: "przypomnieć"
rank: 1037
pos: verb
aspect: perf
pron: { cyr: "пшыпо́мнець" }
senses:
  - id: remind
    ru: "przypomnieć komuś — напомнить кому-то"
    examples:
      - pl: "Przypomnij mi, bym jutro napisał list."
        ru: "Напомни мне завтра написать письмо."
        source: { kind: translated, id: 940915 }
      - pl: "Przypomniał mi, abym nie zapomniał mojego paszportu."
        ru: "Он напомнил мне не забыть паспорт."
        source: { kind: translated, id: 539843 }
      - pl: "Przypomnisz mi, żebym wysłał te listy?"
        ru: "Ты напомнишь мне отправить эти письма?"
        source: { kind: translated, id: 13783069 }
  - id: recall
    ru: "przypomnieć sobie — вспомнить"
    note: "С sobie — «вспомнить», без него — «напомнить». Русский берёт два разных глагола."
    examples:
      - pl: "Nie mogę sobie przypomnieć."
        ru: "Я не могу вспомнить."
        source: { kind: translated, id: 669674 }
      - pl: "O, przypomniałem sobie."
        ru: "О, я вспомнил."
        source: { kind: translated, id: 827348 }
      - pl: "Przypomniałam sobie."
        ru: "Я вспомнила."
        source: { kind: translated, id: 5508776 }
  - id: remind-of
    ru: "coś przypomina komuś kogoś — что-то напоминает кому-то кого-то"
    examples:
      - pl: "Ta historia przypomniała mi o moim ojcu."
        ru: "Эта история напомнила мне о моём отце."
        source: { kind: translated, id: 11573484 }
      - pl: "Jej historia przypomniała mi moich rodziców."
        ru: "Её рассказ напомнил мне моих родителей."
        source: { kind: translated, id: 832623 }
      - pl: "To zdjęcie przypomniało mi Szkocję."
        ru: "Эта фотография напомнила мне Шотландию."
        source: { kind: translated, id: 956863 }
notes:
  - { kind: usage, text: "Ключевое различие: przypomnieć komuś coś — «напомнить кому-то», а przypomnieć SOBIE — «вспомнить». Одно польское слово там, где русский берёт два разных глагола." }
  - { kind: government, text: "przypomnieć KOMUŚ, ŻEBY… — «напомнить кому-то, чтобы…», с дательным падежом: Przypomnij mi, żebym napisał list." }
  - { kind: usage, text: "Оборот coś przypomina mi kogoś значит «что-то напоминает мне кого-то» — с винительным, без предлога: Ta historia przypomniała mi ojca." }
  - { kind: usage, text: "Несовершенный вид — przypominać. Существительное przypomnienie значит «напоминание»." }
collocations:
  - { pl: "przypomnieć sobie", ru: "вспомнить" }
  - { pl: "przypomnij mi", ru: "напомни мне" }
  - { pl: "przypomina mi", ru: "напоминает мне" }
  - { pl: "nie mogę sobie przypomnieć", ru: "не могу вспомнить" }
family:
  - { pl: "przypominać", ru: "напоминать", relation: aspect }
  - { pl: "pamięć", ru: "память", relation: root, id: pamiec }
  - { pl: "przypomnienie", ru: "напоминание", relation: derived }
etymology: "Приставка przy- + pomnieć «помнить», от того же корня, что pamięć. Русское «припомнить» собрано ровно так же."
memory: "Одно слово вместо двух русских: przypomnieć komuś — «напомнить», а przypomnieć SOBIE — «вспомнить». Разница только в sobie, и её легко не заметить: Nie mogę sobie przypomnieć «Не могу вспомнить»."
idioms:
  - { pl: "przypomnieć sobie", ru: "вспомнить" }
  - { pl: "przypomnij mi", ru: "напомни мне" }
  - { pl: "nie mogę sobie przypomnieć", ru: "не могу вспомнить" }
