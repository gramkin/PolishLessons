notes:
  - { kind: false-friend, text: "Ловушка чисто слуховая и очень цепкая: PLAMA звучит почти как русское «пламя», а значит «пятно». Русское «пламя» по-польски PŁOMIEŃ, и различает эти два слова та самая буква Ł, которая читается как «у»: PLAMA звучит «пляма», а PŁOMIEŃ — «пуомень». То есть разницу слышно сразу, стоит только помнить, что Ł это не «л». Второе: переносное значение у двух языков общее — PLAMA NA HONORZE отвечает русскому «пятну на чести», — но польский пошёл дальше и сделал из него разговорное DAĆ PLAMĘ со значением «опозориться, сесть в лужу»." }
  - { kind: usage, text: "Десять форм, женский род. Дательный и местный единственного — PLAMIE, где конечное M основы смягчается в MI перед окончанием -E. Родительный множественного — PLAM, с нулевым окончанием и без вставного гласного, потому что группа ЛМ выговаривается легко. Родительный единственного и именительный множественного — одна форма PLAMY. Управление: PLAMA PO CZYMŚ с местным указывает происхождение — PLAMA PO KAWIE, PLAMA PO TUSZU; а PLAMA NA CZYMŚ с местным указывает место — PLAMA NA OBRUSIE, PLAMA NA HONORZE." }
  - { kind: pronunciation, text: "Читается «пля́ма», два слога, ударение на первом. Польское L мягче русского твёрдого «л», поэтому сочетание PLA звучит ближе к «пля», чем к «пла». Это и есть главная примета, отличающая слово от PŁOMIEŃ, где Ł даёт «у». В форме PLAMIE сочетание MIE читается «ме» с мягким M: «пля́ме». В форме PLAMĘ конечное Ę звучит как чистое «э»: «пля́мэ». В форме PLAMĄ последнее Ą даёт «он»: «пля́мон»." }
  - { kind: register, text: "В прямом значении слово нейтральное и бытовое: PLAMA PO KAWIE, ODPLAMIACZ «пятновыводитель», WYWABIĆ PLAMĘ «вывести пятно». В переносном оно книжное, когда речь о репутации: PLAMA NA HONORZE, и разговорное, когда о промахе: DAĆ PLAMĘ значит «опозориться» и звучит совершенно обиходно, без грубости. Есть и специальные значения: PLAMY NA SŁOŃCU «пятна на Солнце», PLAMA ROPY «нефтяное пятно», ŚLEPA PLAMA «слепое пятно» в глазу и переносно." }
