etymology: "Происхождение слова не вполне ясно, и словари обычно связывают его с глаголом PLAMIĆ «пачкать», признавая основу выразительной по происхождению — из тех, что родились из подражания самому действию, как CHLAPAĆ и PLUSKAĆ. Прямого соответствия в русском у неё нет: русское «пятно» идёт от «пяты», то есть от следа ноги, и образ там совсем другой. Созвучие с русским «пламенем» при этом случайное: польское PŁOMIEŃ восходит к праславянскому *polmy и к корню горения, а PLAMA с ним не связана ничем, кроме трёх первых букв на письме. Такие пары особенно опасны, потому что проверить их на слух нельзя — нужно помнить, что Ł и L это разные звуки."
memory: "Созвучие обманывает: plama это «пятно», а «пламя» по-польски płomień. Различает их буква ł, которая читается как «у»: «пля́ма» против «пуо́мень». Связи между словами нет никакой, созвучие случайное. Переносное значение общее — plama na honorze, — но польский добавил своё разговорное dać plamę «опозориться, сесть в лужу». Дательный и местный plamie со смягчением m→mi."
idioms:
  - { pl: "dać plamę", ru: "опозориться, сесть в лужу" }
