etymology: "От ISTOTA «сущность», которое образовано от старого прилагательного ISTY «тот самый, подлинный», из праславянского *jьstъ. Этот корень русскому хорошо знаком с другой стороны: от него «истина», «истый», «воистину», «подлинно». Само же ISTOTA возникло как калька латинского ESSENTIA, от ESSE «быть», и русская «сущность» со «существом» сделаны тем же способом от «сущий» — поэтому два языка независимо пришли к одинаковому устройству слова, и ISTOTA LUDZKA с «человеческим существом» совпадают буквально. Старое ISTY дожило в польском как ISTNY «сущий, настоящий», и это объясняет, почему два похожих слова, ISTNY и ISTOTNY, значат разное: одно идёт прямо от прилагательного, другое через существительное."
memory: "Устроено как русское: istota «сущность, существо» — istotny «существенный», ровно как «сущий» — «существо» — «существенный». Не путать с istny «сущий, настоящий»: istny koszmar «сущий кошмар», но istotna różnica «существенная разница». Корень тот же, что в русской «истине» и «воистину». Книжное слово; в живой речи чаще ważny."
