notes:
  - { kind: false-friend, text: "Прозрачное для русского слово, но прозрачное не там, где кажется. ISTOTNY значит «существенный», и устроено оно точно так же, как русское: ISTOTA это «сущность» и «существо», от глагола бытия, ровно как «существо» от «сущий». Поэтому ISTOTA LUDZKA «человеческое существо» и W ISTOCIE «в сущности» переводятся дословно. Ловушка в другом слове: ISTNY, без O, это не то же самое. ISTNY значит «сущий, настоящий, чистейший» и живёт в восклицаниях: ISTNY KOSZMAR «сущий кошмар», ISTNY CUD. Сказать ISTNY ELEMENT UMOWY нельзя, как и ISTOTNY KOSZMAR." }
  - { kind: usage, text: "Рядом стоит WAŻNY «важный», и делить их стоит так: ISTOTNY о том, что относится к сути дела, WAŻNY о том, что имеет вес и последствия. ISTOTNA RÓŻNICA, ISTOTNY SZCZEGÓŁ, ISTOTNE OKOLICZNOŚCI — везде речь о существе. При этом WAŻNY имеет значение, которого у ISTOTNY нет вовсе: «действительный», о документе и билете, BILET WAŻNY DO PIĄTKU. Слово ISTOTNY книжное и канцелярское, частое в юридических и научных текстах; в обиходной речи скажут WAŻNY. Отрицание NIEISTOTNY «несущественный» столь же частотно, как и само слово." }
  - { kind: pronunciation, text: "Читается «исто́тны», ударение на предпоследнем слоге. Начальное I это полноценный гласный, а не русское «и» после согласной: слово начинается с «и». Конечное -Y звучит «ы», как во всех прилагательных мужского рода. В форме мужского лица множественного ISTOTNI сочетание -TNI читается «тни» с мягким н: «исто́тни». В степенях сравнения появляется SZ, которое читается «ш»: ISTOTNIEJSZY «истотне́йшы», NAJISTOTNIEJSZY «найистотне́йшы», и ударение в них по-прежнему на предпоследнем слоге." }
  - { kind: government, text: "Прилагательное, и склоняется полностью, тридцать три формы: одиннадцать в положительной степени, одиннадцать в сравнительной и одиннадцать в превосходной. Для кого существенно — предлог DLA с родительным: ISTOTNY DLA SPRAWY «существенный для дела». Сравнение строится двумя способами: предлог OD с родительным, ISTOTNIEJSZY OD PIERWSZEGO, или союз NIŻ с тем же падежом, что у первого члена, ISTOTNIEJSZY NIŻ PIERWSZY. Превосходная степень образуется приставкой NAJ- от сравнительной, без исключений." }
