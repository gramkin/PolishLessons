etymology: "От GŁOS, и здесь видно одно из самых полезных соответствий между языками. Праславянское слово дало русское «голос» с полногласием, то есть с двумя гласными вокруг согласного, а польское GŁOS — со стянутым сочетанием. Та же пара видна в «голова» и GŁOWA, в «ворота» и WROTA, в «молоко» и MLEKO. Узнав это правило, вы будете угадывать десятки польских слов: там, где у нас «оло» или «оро», у поляков стянутый слог."
memory: "Голосовой, от glos «голос». Главное сочетание — struny glosowe «голосовые связки». Читается «гуосо́вы», где gl со штрихом даёт «гу», как и в самом glos — «гу́ос». Запомните заодно правило полногласия: нашим «оло» и «оро» у поляков отвечает стянутый слог, отсюда glos при «голосе», glowa при «голове», mleko при «молоке». И не путайте glosny «громкий» с «голосистым»."
idioms:
  - { pl: "struny głosowe", ru: "голосовые связки" }
