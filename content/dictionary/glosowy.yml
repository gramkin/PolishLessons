notes:
  - { kind: false-friend, text: "Прилагательное отвечает русскому «голосовой» точно, но гнездо шире нашего. От того же корня поляки построили GŁOŚNY «громкий» и GŁOŚNIK «громкоговоритель, колонка»: громкость у них выросла из голоса, а у нас «громкий» идёт от «грома». Поэтому GŁOŚNY это «громкий», а не «голосистый», и путать эти два слова не стоит. А GŁOSOWAĆ значит «голосовать», как и у нас." }
  - { kind: usage, text: "В таблице одиннадцать форм, но живых десять. Одиннадцатая — GŁOSOWI, именительный множественного для мужчин-людей, и её не употребляют: прилагательное относительное, оно описывает связки или сообщение, а не человека. Примеров к этой форме в карточке поэтому нет. Заметьте, что GŁOSOWI по виду совпадает с дательным падежом существительного GŁOS, но это разные слова." }
  - { kind: government, text: "Голосовым связкам вредит — STRUNOM GŁOSOWYM SZKODZI, дательный падеж, как и по-русски. В голосовом сообщении — W WIADOMOŚCI GŁOSOWEJ, местный падеж. На голосовую почту — NA POCZTĘ GŁOSOWĄ, предлог NA с винительным. В закреплённых названиях прилагательное стоит после существительного: STRUNY GŁOSOWE, POCZTA GŁOSOWA, и порядок не меняется." }
  - { kind: pronunciation, text: "Читается «гуосо́вы», четыре слога, ударение на предпоследнем. Начало слова самое непривычное: Ł даёт «у», поэтому GŁ звучит «гу», а не «гл». Ровно так записано и само слово GŁOS — «гу́ос». Конечная Y даёт «ы». В женском роде GŁOSOWA это «гуосо́ва», в среднем GŁOSOWE — «гуосо́вэ»." }
  - { kind: register, text: "В медицине это STRUNY GŁOSOWE «голосовые связки» и APARAT GŁOSOWY, и так говорят врачи. В технике и в телефоне — POCZTA GŁOSOWA «голосовая почта», WIADOMOŚĆ GŁOSOWA «голосовое сообщение», STEROWANIE GŁOSOWE «голосовое управление». Последние три сочетания встречаются сегодня чаще всего, и узнавать их стоит с первого взгляда." }
