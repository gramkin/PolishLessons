id: noga
format: 2
lemma: "noga"
rank: 450
pos: noun
pron: { cyr: "но́га" }
senses:
  - id: leg
    ru: "нога"
    examples:
      - pl: "Boli mnie noga."
        ru: "У меня болит нога."
        source: { kind: tatoeba, id: 1605844 }
      - pl: "Tom ma dwie nogi."
        ru: "У Тома две ноги."
        source: { kind: tatoeba, id: 6689537 }
      - pl: "Bolą cię nogi?"
        ru: "У тебя ноги болят?"
        source: { kind: tatoeba, id: 6406052 }
  - id: idiomatic
    ru: "нога (в устойчивых оборотах)"
    examples:
      - pl: "Wstałem dziś lewą nogą."
        ru: "Я не с той ноги с утра встал."
        source: { kind: tatoeba, id: 3078146 }
      - pl: "Padam z nóg!"
        ru: "Я с ног валюсь!"
        source: { kind: translated, id: 8608273 }
      - pl: "Dał nogę."
        ru: "Он дал дёру."
        source: { kind: translated, id: 6541897 }
notes:
  - { kind: usage, text: "Родительный падеж множественного числа — nóg, с ó: noga → nóg, ровно как русское «нога → ног»." }
  - { kind: usage, text: "wstać lewą nogą — «встать не с той ноги». Смысл совпадает с русским, а буква нет: поляк встаёт «левой ногой»." }
  - { kind: usage, text: "dać nogę — разговорное «дать дёру, удрать»; padać z nóg — «валиться с ног»." }
  - { kind: false-friend, text: "Польское noga шире русского: это и нога человека, и лапа животного, и ножка стола." }
collocations:
  - { pl: "boli mnie noga", ru: "у меня болит нога" }
  - { pl: "na nogach", ru: "на ногах" }
  - { pl: "dać nogę", ru: "дать дёру" }
  - { pl: "pod nogi", ru: "под ноги" }
etymology: "Праславянское *noga; русское «нога» — то же самое слово, и чередование в родительном множественного ведёт себя одинаково: noga → nóg, «нога → ног»."
memory: "noga — «нога», слово совпадает с русским, и чередование тоже: noga → nóg. Идиомы почти те же: wstać lewą nogą «встать не с той ноги», padać z nóg «валиться с ног»."
idioms:
  - { pl: "brać nogi za pas", ru: "уносить ноги" }
  - { pl: "padać z nóg", ru: "валиться с ног" }
  - { pl: "wstać lewą nogą", ru: "встать не с той ноги" }
