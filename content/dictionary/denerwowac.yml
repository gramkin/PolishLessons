# review
id: denerwowac
format: 2
lemma: "denerwować"
rank: 1516
pos: verb
aspect: imperf
pron: { cyr: "дэнэрво́ваць" }
senses:
  - id: annoy
    ru: "раздражать, нервировать (кого-л.)"
    examples:
      - pl: "Denerwuje mnie to."
        ru: "Это меня раздражает."
        source: { kind: translated, id: 1605582 }
      - pl: "Denerwuje mnie jego egoizm."
        ru: "Меня раздражает его эгоизм."
        source: { kind: translated, id: 353157 }
      - pl: "Czy możesz przestać mnie denerwować?"
        ru: "Можешь перестать меня раздражать?"
        source: { kind: translated, id: 10091389 }
  - id: be-nervous
    ru: "нервничать, волноваться (с się)"
    examples:
      - pl: "Tom bardzo się denerwuje z tego powodu."
        ru: "Том очень из-за этого нервничает."
        source: { kind: tatoeba, id: 6895151 }
      - pl: "Trochę się denerwuję."
        ru: "Я немного нервничаю."
        source: { kind: translated, id: 2251883 }
      - pl: "Denerwuję się, kiedy mówię w innym języku."
        ru: "Я нервничаю, когда говорю на другом языке."
        source: { kind: translated, id: 5138363 }
  - id: calm-down
    ru: "не нервничай (в отрицательном повелении)"
    examples:
      - pl: "Nie denerwuj się."
        ru: "Не нервничай."
        source: { kind: translated, id: 368134 }
      - pl: "Nie denerwuj się, usiądź spokojnie."
        ru: "Не нервничай, сядь спокойно."
        source: { kind: translated, id: 736809 }
notes:
  - { kind: usage, text: "Без się глагол значит «раздражать кого-то» (denerwujesz mnie «ты меня раздражаешь»), с się — «нервничать самому» (denerwuję się «я нервничаю»). Это одна из главных пар на się." }
  - { kind: government, text: "Без się требует винительного падежа: denerwuje mnie hałas «меня раздражает шум»." }
  - { kind: usage, text: "Причастие denerwujący работает как прилагательное «раздражающий, нервирующий»: To denerwujące «Это раздражает»." }
  - { kind: usage, text: "Совершенный вид — zdenerwować (się): zdenerwowałem się «я разнервничался»." }
  - { kind: false-friend, text: "Не путайте с русским медицинским «денервировать»: польское denerwować — обычное бытовое «раздражать, нервировать»." }
collocations:
  - { pl: "denerwować się", ru: "нервничать" }
  - { pl: "nie denerwuj się", ru: "не нервничай" }
  - { pl: "to denerwujące", ru: "это раздражает" }
etymology: "Из французского énerver (латинское nervus «нерв»), пришедшее через немецкий. Русское «нервничать» построено от того же латинского корня, так что слова родственны."
memory: "denerwować без się = «раздражать кого-то», с się = «нервничать самому»: Denerwujesz mnie «ты меня раздражаешь», но Denerwuję się «я нервничаю». Совершенный вид — zdenerwować się, а причастие denerwujący значит «раздражающий»."
idioms:
  - { pl: "nie denerwuj się", ru: "не нервничай" }
  - { pl: "to denerwujące", ru: "это раздражает" }
  - { pl: "denerwować się przed egzaminem", ru: "волноваться перед экзаменом" }
