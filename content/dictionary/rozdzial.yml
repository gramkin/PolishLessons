notes:
  - { kind: false-friend, text: "Русский «раздел» делит те же два смысла, но распределяет их иначе, и это стоит заметить. Польское ROZDZIAŁ в книге — это именно «глава», а не «раздел»: русскому «разделу» книги отвечает CZĘŚĆ или DZIAŁ. Зато во втором значении слова совпадают: ROZDZIAŁ KOŚCIOŁA OD PAŃSTWA — «отделение церкви от государства», ROZDZIAŁ WŁADZ — «разделение властей». Так что при переводе на русский первое значение требует «главы», второе — «разделения» или «отделения», и одним словом не обойтись." }
  - { kind: pronunciation, text: "Читается «розьдзя́у», с ударением на предпоследнем слоге. Три места требуют внимания. Сочетание zdz звучит мягко, «зьдзь», потому что за ним идёт мягкое i. Сочетание ia даёт «я». И конечное ł читается как «у», а не «л»: не «роздзял», а «розьдзя́у». В косвенных падежах ł смягчается в l перед гласной: ROZDZIAŁU звучит «розьдзя́лу», а ROZDZIALE — «розьдзя́ле»." }
  - { kind: government, text: "Чего глава — предлог O с предложным падежом: ROZDZIAŁ O WOJNIE, ROZDZIAŁ O ZWIERZĘTACH. Разделение чего — родительный: ROZDZIAŁ WŁADZ, ROZDZIAŁ MAJĄTKU. Отделение чего от чего — родительный плюс OD с родительным: ROZDZIAŁ KOŚCIOŁA OD PAŃSTWA. Где — предлог W с предложным: W ROZDZIALE TRZECIM. Родительный множественного — ROZDZIAŁÓW." }
  - { kind: usage, text: "Первое значение самое частое и бытовое: главы в книге нумеруют, читают, пропускают. Второе книжное и встречается в юридических и политических текстах. Есть и переносное употребление первого значения, совпадающее с русским: NOWY ROZDZIAŁ W ŻYCIU «новая глава в жизни», ZAMKNĄĆ TEN ROZDZIAŁ «закрыть эту главу». Глагол к обоим значениям — ROZDZIELIĆ «разделить, разъединить», и от него же ROZDZIELNY." }
collocations:
  - { pl: "rozdział trzeci", ru: "третья глава" }
  - { pl: "rozdział władz", ru: "разделение властей" }
  - { pl: "nowy rozdział w życiu", ru: "новая глава в жизни" }
family:
