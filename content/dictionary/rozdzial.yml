  - { pl: "dział", ru: "отдел, раздел", relation: root }
  - { pl: "część", ru: "часть", relation: root, id: czesc-noun }
etymology: "Приставка ROZ- и корень DZIAŁ, от DZIELIĆ «делить», из праславянского *děliti, откуда русские «делить», «доля», «раздел». Буквально ROZDZIAŁ — «разделение», и это второе, более старое значение слова. Значение «глава книги» выросло из того же образа: глава есть то, на что текст разделён. Русский проделал ровно тот же ход, назвав часть книги «разделом», только у него это слово осталось при обоих смыслах, а польский развёл их: ROZDZIAŁ для главы и разделения, DZIAŁ для раздела или отдела. Приставка ROZ- отвечает русской «раз-» и значит расхождение в стороны."
memory: "Глава книги — ROZDZIAŁ, а не «раздел»: русскому «разделу» книги отвечает dział или część. Второе значение совпадает: rozdział władz «разделение властей». Читается «розьдзя́у», конечное ł как «у», но в падежах — «розьдзя́лу»."
idioms:
  - { pl: "nowy rozdział w życiu", ru: "новая глава в жизни" }
  - { pl: "zamknąć ten rozdział", ru: "закрыть эту главу" }
