# review
id: prywatny
format: 2
lemma: "prywatny"
rank: 1078
pos: adj
pron: { cyr: "прыва́тны" }
senses:
  - id: not-state
    ru: "частный (не государственный)"
    examples:
      - pl: "Tom ma prywatny jacht."
        ru: "У Тома частная яхта."
        source: { kind: translated, id: 1871542 }
      - pl: "Chodzisz do prywatnej szkoły?"
        ru: "Ты ходишь в частную школу?"
        source: { kind: translated, id: 3032292 }
      - pl: "Prywatna dobroczynność to kropla w morzu."
        ru: "Частная благотворительность - это только капля в море."
        source: { kind: tatoeba, id: 352160 }
  - id: personal
    ru: "личный (о делах, жизни)"
    examples:
      - pl: "Uważam, że to ich prywatna sprawa."
        ru: "Я считаю, что это их личное дело."
        source: { kind: tatoeba, id: 13782623 }
      - pl: "Nie pchaj nosa w moje prywatne sprawy."
        ru: "Не суй нос в мои личные дела."
        source: { kind: translated, id: 639902 }
  - id: own-use
    ru: "отдельный, для личного пользования"
    examples:
      - pl: "Chciałbym zarezerwować prywatny przedział."
        ru: "Я хотел бы забронировать отдельное купе."
        source: { kind: translated, id: 520025 }
      - pl: "Nie podoba mi się, że używa tego telefonu do celów prywatnych."
        ru: "Мне не нравится, что он использует этот телефон в личных целях."
        source: { kind: translated, id: 365607 }
notes:
  - { kind: false-friend, text: "Одно польское слово покрывает два русских: «частный» (prywatna szkoła «частная школа») и «личный» (życie prywatne «личная жизнь»). Русский их различает, польский нет." }
  - { kind: usage, text: "Противоположности — publiczny «общественный» и państwowy «государственный»: szkoła prywatna против szkoły państwowej." }
  - { kind: usage, text: "Наречие prywatnie значит «в частном порядке, лично»: Powiedział mi to prywatnie «Он сказал мне это лично»." }
  - { kind: usage, text: "Это относительное прилагательное, поэтому степеней сравнения у него нет: нельзя сказать bardziej prywatny о собственности." }
collocations:
  - { pl: "życie prywatne", ru: "личная жизнь" }
  - { pl: "prywatna szkoła", ru: "частная школа" }
  - { pl: "własność prywatna", ru: "частная собственность" }
  - { pl: "do celów prywatnych", ru: "в личных целях" }
family:
  - { pl: "prywatnie", ru: "в частном порядке, лично", relation: derived }
  - { pl: "prywatność", ru: "приватность, личное пространство", relation: derived }
  - { pl: "publiczny", ru: "общественный, публичный", relation: antonym }
etymology: "Через немецкое privat из латинского privatus «отдельный, свой собственный», от privare «отделять». Русское «приватный» — то же слово, а «частный» — своё, славянское."
memory: "prywatny — одно слово на два русских: «частный» (prywatna szkoła) и «личный» (życie prywatne). Противоположность — publiczny «общественный» или państwowy «государственный»."
idioms:
  - { pl: "życie prywatne", ru: "личная жизнь" }
  - { pl: "własność prywatna", ru: "частная собственность" }
