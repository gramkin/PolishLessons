notes:
  - { kind: usage, text: "У слова одиннадцать форм, тогда как у DZIENNIKARZ из партии 226 их десять, и лишняя форма — вариант родительного множественного. Словарь даёт оба: OCHRONIARZY и OCHRONIARZÓW. Обычная, нейтральная форма — на -y, её и надо употреблять; на -ów вы встретите в старых текстах и в небрежной речи, и знать её стоит только чтобы узнать. Структурной разницы между двумя словами нет никакой — просто у одного зафиксирован дублет, у другого нет." }
  - { kind: usage, text: "Суффикс -ARZ тот же, что в dziennikarz, но здесь он прозрачен для русского: слово построено от OCHRONA «охрана», а та от CHRONIĆ «защищать, хранить», и корень общий с русским «хранить» и «охранять». Это полезный контраст: dziennikarz по-русски не угадать, потому что профессия названа от газеты, а ochroniarz угадывается сразу. Один и тот же суффикс, разная прозрачность." }
  - { kind: usage, text: "Слово мужское личное. Множественное именительное OCHRONIARZE служит и уничижительной формой — той категорией, которой в русском нет, — ровно как у dziennikarze: обе роли совпали в одном написании. Звательный и местный сошлись в OCHRONIARZU, что для мягкой основы на -rz обычно, и обращение PANIE OCHRONIARZU звучит нормально, хотя и несколько официально." }
collocations:
  - { pl: "ochroniarz w klubie", ru: "охранник в клубе" }
  - { pl: "wynająć ochroniarza", ru: "нанять охранника" }
