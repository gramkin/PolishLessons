  - { pl: "chronić", ru: "защищать, хранить", relation: root, id: chronic }
etymology: "От OCHRONA «охрана», а та от CHRONIĆ, из праславянского *xorniti «хранить, оберегать» — того же корня, что русские «хранить», «охранять» и «схрон». Суффикс -arz, обозначающий занятие, пришёл через латинское -arius и в польском остался живым: им сделаны и pisarz, и lekarz, и kucharz, и совсем новые gliniarz и ochroniarz. Русский назвал ту же работу от того же корня, но другим суффиксом — «охранник»."
memory: "Одиннадцать форм, потому что родительный множественного имеет дублет: обычное ochroniarzy, вариант ochroniarzów. Корень тот же, что в «охране», — слово угадывается, в отличие от dziennikarz."
