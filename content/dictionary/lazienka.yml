      - pl: "Muszę iść do łazienki."
        ru: "Мне нужно в туалет."
        source: { kind: translated, id: 1348844 }
      - pl: "Dlaczego ciągle łazienka jest zajęta?"
        ru: "Почему туалет постоянно занят?"
        source: { kind: tatoeba, id: 1348779 }
  - id: in-bathroom
    ru: "w łazience — в ванной"
    examples:
      - pl: "Jest w łazience."
        ru: "Он в ванной."
        source: { kind: translated, id: 2741254 }
      - pl: "Zamknął się w łazience."
        ru: "Он заперся в ванной."
        source: { kind: translated, id: 4314012 }
      - pl: "Pająk, którego znalazła w łazience, okazał się jadowity."
        ru: "Паук, которого она нашла в ванной, оказался ядовитым."
        source: { kind: tatoeba, id: 8627578 }
notes:
  - { kind: usage, text: "Łazienka — комната с ванной или душем. Отдельный туалет — toaleta или WC, но в разговоре łazienka часто заменяет и его: Idę do łazienki «Я иду в туалет»." }
  - { kind: government, text: "Три ходовых сочетания с разными падежами: w łazience «в ванной» (предложный), do łazienki «в ванную» (родительный, направление), z łazienką «с ванной» (творительный)." }
  - { kind: usage, text: "Pokój z łazienką «номер с ванной» — обязательная фраза при бронировании гостиницы." }
  - { kind: pronunciation, text: "ł звучит как «у»: уаже́нка. Ударение на предпоследний слог." }
collocations:
  - { pl: "w łazience", ru: "в ванной" }
  - { pl: "iść do łazienki", ru: "идти в ванную" }
  - { pl: "pokój z łazienką", ru: "номер с ванной" }
  - { pl: "sprzątać łazienkę", ru: "убирать ванную" }
etymology: "Уменьшительное от łaźnia «баня», из праславянского *lazьnja. То же слово — украинское «лазня» и старорусское «лазня»."
memory: "łazienka — «ванная», уменьшительное от łaźnia «баня». Запомните падежи: w łazience «в ванной», do łazienki «в ванную», pokój z łazienką «номер с ванной». И помните, что Idę do łazienki часто значит просто «я в туалет»."
idioms:
  - { pl: "pokój z łazienką", ru: "номер с ванной" }
  - { pl: "iść do łazienki", ru: "идти в туалет" }
  - { pl: "w łazience", ru: "в ванной" }
formExamplesSkip:
  - { form: "łazienko", reason: "звательный падеж: для неодушевлённого существительного он практически не употребляется" }
