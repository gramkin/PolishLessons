# review
id: oddzwonic
format: 2
lemma: "oddzwonić"
rank: 1608
pos: verb
aspect: perf
pron: { cyr: "оддзво́ниць" }
senses:
  - id: call-back
    ru: "перезвонить"
    examples:
      - pl: "Oddzwonię wkrótce."
        ru: "Я скоро перезвоню."
        source: { kind: translated, id: 3603499 }
      - pl: "Oddzwonię później."
        ru: "Я перезвоню позже."
        source: { kind: translated, id: 4642287 }
      - pl: "Oddzwonię, jak tylko będę mógł."
        ru: "Я перезвоню, как только смогу."
        source: { kind: tatoeba, id: 973114 }
  - id: call-back-other
    ru: "перезвонить (о другом человеке)"
    examples:
      - pl: "Tom powiedział, że do mnie oddzwoni."
        ru: "Том сказал, что перезвонит мне."
        source: { kind: translated, id: 4091993 }
      - pl: "Tom nie oddzwonił."
        ru: "Том не перезвонил."
        source: { kind: translated, id: 6157223 }
      - pl: "Powiem mu, żeby do ciebie oddzwonił."
        ru: "Я скажу ему, чтобы он тебе перезвонил."
        source: { kind: tatoeba, id: 692036 }
notes:
  - { kind: usage, text: "Страдательного причастия у oddzwonić нет: глагол непереходный — перезванивают кому-то (oddzwonić do kogoś), а не кого-то. Поэтому oddzwoniony, oddzwoniona, oddzwonieni и весь этот ряд оставлены без примеров. Живут только действительные формы: oddzwonię, oddzwonił, oddzwońmy — и отглагольное существительное oddzwonienie." }
  - { kind: government, text: "Перезвонить кому-то — oddzwonić do kogoś, с предлогом do и родительным падежом: oddzwonię do ciebie." }
  - { kind: usage, text: "Совершенный вид; несовершенный — oddzwaniać. Приставка od- здесь значит «в ответ», как в odpowiedzieć «ответить»." }
  - { kind: usage, text: "Oddzwonię — стандартная телефонная формула «я перезвоню», без дополнения." }
  - { kind: false-friend, text: "Русское «перезвонить» использует приставку «пере-», польское — od- «от, в ответ»: образ не «ещё раз», а «звонок обратно»." }
collocations:
  - { pl: "oddzwonić do kogoś", ru: "перезвонить кому-либо" }
  - { pl: "oddzwonię później", ru: "я перезвоню позже" }
  - { pl: "dziękuję, że pan oddzwonił", ru: "спасибо, что перезвонили" }
family:
  - { pl: "dzwonić", ru: "звонить", relation: root, id: dzwonic }
  - { pl: "zadzwonić", ru: "позвонить", relation: root, id: zadzwonic }
  - { pl: "telefon", ru: "телефон", relation: root, id: telefon }
etymology: "Приставка od- «в ответ» плюс dzwonić «звонить»: буквально «отзвонить обратно». Русское «перезвонить» строит тот же смысл приставкой «пере-»."
memory: "oddzwonić — «перезвонить»: Oddzwonię później «Я перезвоню позже». Кому — do kogoś: oddzwonię do ciebie. Несовершенный вид — oddzwaniać."
idioms:
  - { pl: "oddzwonić do kogoś", ru: "перезвонить кому-либо" }
  - { pl: "oddzwonię później", ru: "я перезвоню позже" }
  - { pl: "dziękuję, że pan oddzwonił", ru: "спасибо, что перезвонили" }
