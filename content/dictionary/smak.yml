  - { pl: "smakować", ru: "быть вкусным, нравиться", relation: derived, id: smakowac }
  - { pl: "zapach", ru: "запах", relation: root, id: zapach }
etymology: "Из немецкого Geschmack «вкус», от schmecken «быть вкусным», прагерманского корня smak-. Польский взял слово в средние века, а из польского оно попало в русский как «смак» и «смаковать». Так что русское слово — польское по происхождению."
memory: "smak — «вкус», нейтральное слово, в отличие от русского «смак». Запомни два оборота: SMACZNEGO «приятного аппетита» и to mi smakuje «мне вкусно» — с дательным падежом."
idioms:
  - { pl: "Smacznego!", ru: "Приятного аппетита!" }
  - { pl: "nabrać smaku", ru: "войти во вкус" }
formExamplesSkip:
