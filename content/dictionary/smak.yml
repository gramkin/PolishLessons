notes:
  - { kind: government, text: "ГЛАВНОЕ ОТЛИЧИЕ В ГЛАГОЛЕ, А НЕ В СУЩЕСТВИТЕЛЬНОМ. Польское SMAKOWAĆ строится с ДАТЕЛЬНЫМ: to mi smakuje буквально «это мне вкусит», то есть «мне вкусно, мне нравится». Русский говорит «мне нравится» или «вкусно», и дословный перевод «это меня вкусит» невозможен. Запоминай оборот целиком." }
  - { kind: false-friend, text: "Русское «смак» — это заимствование из польского, и значение сузилось: по-русски «смак» это удовольствие от еды, «смаковать» — наслаждаться. А польское smak — обычное нейтральное слово «вкус», которым описывают и суп, и мороженое. Поэтому smak lodów это просто «вкус мороженого», без всякого смакования." }
  - { kind: usage, text: "Пожелание за столом — SMACZNEGO, родительный падеж от smaczny «вкусный», буквально «вкусного». Это польское «приятного аппетита»; apetytu не говорят. Прилагательное smaczny значит «вкусный», а bez smaku — «безвкусный»." }
collocations:
  - { pl: "smacznego", ru: "приятного аппетита" }
  - { pl: "o smaku", ru: "со вкусом (чего-л.)" }
  - { pl: "ze smakiem", ru: "со смаком" }
family:
