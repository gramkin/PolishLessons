# review
id: publicznie
format: 2
lemma: "publicznie"
rank: 3836
pos: adv
pron: { cyr: "публи́чне" }
senses:
  - id: publicly
    ru: "публично, открыто"
    examples:
      - pl: "Minister publicznie przyznał się do błędu."
        ru: "Министр публично признал ошибку."
        source: { kind: authored }
      - pl: "Pierwszy raz wystąpiła publicznie w wieku dziesięciu lat."
        ru: "Впервые она выступила публично в десять лет."
        source: { kind: authored }
      - pl: "Sprawa została publicznie ujawniona."
        ru: "Дело было предано огласке."
        source: { kind: authored }
  - id: in-public
    ru: "на людях, в общественных местах"
    examples:
      - pl: "Nie wolno publicznie pić alkoholu."
        ru: "Распивать алкоголь в общественных местах запрещено."
        source: { kind: authored }
      - pl: "Całowali się publicznie, nie zwracając na nikogo uwagi."
        ru: "Они целовались на людях, ни на кого не обращая внимания."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "PUBLICZNIE — «публично», тут перевод прямой. Ловушка в прилагательном PUBLICZNY: оно часто значит «общественный, государственный», а не «публичный». TRANSPORT PUBLICZNY — «общественный транспорт», SZKOŁA PUBLICZNA — «государственная школа», TOALETA PUBLICZNA — «общественный туалет»." }
  - { kind: usage, text: "Наречие, одна форма, без степеней. Два оттенка: «при всех, открыто», о заявлениях и выступлениях, и «на людях», о поведении в общественных местах." }
  - { kind: government, text: "Наречие ничем не управляет. Устойчивые глаголы: WYSTĄPIĆ PUBLICZNIE, «выступить публично», PRZEPROSIĆ PUBLICZNIE, «публично извиниться»." }
  - { kind: pronunciation, text: "Читается «публи́чне», ударение на предпоследнем слоге. LI — мягкое «ли», CZNIE — «чне»." }
collocations:
  - { pl: "publicznie przeprosić", ru: "публично извиниться" }
  - { pl: "wystąpić publicznie", ru: "выступить публично" }
  - { pl: "publicznie dostępny", ru: "общедоступный" }
family:
