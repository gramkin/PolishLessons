  - { pl: "publiczność", ru: "публика, зрители", relation: root, id: publicznosc }
  - { pl: "publikować", ru: "публиковать", relation: root }
etymology: "От PUBLICZNY, из латинского слова со значением «народный, общественный», от слова «народ». Отсюда и русские «публика», «публичный», «республика»."
memory: "Publicznie — публично, на людях. Читается «публи́чне». Transport publiczny — общественный транспорт. Prać brudy publicznie — выносить сор из избы."
idioms:
  - { pl: "prać brudy publicznie", ru: "выносить сор из избы" }
