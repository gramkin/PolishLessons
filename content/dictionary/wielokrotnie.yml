# review
id: wielokrotnie
format: 2
lemma: "wielokrotnie"
rank: 5996
pos: adv
pron: { cyr: "велокро́тне" }
senses:
  - id: many-times
    ru: "многократно, много раз, неоднократно"
    examples:
      - pl: "Ja też wielokrotnie płaciłem mandaty za nieprawidłowe parkowanie."
        ru: "Я тоже не раз платил штрафы за неправильную парковку."
        source: { kind: translated, id: 733019 }
      - pl: "Wielokrotnie byłam we Włoszech."
        ru: "Я много раз бывала в Италии."
        source: { kind: translated, id: 3578619 }
      - pl: "Już wielokrotnie o tym rozmawialiśmy."
        ru: "Мы уже много раз об этом говорили."
        source: { kind: translated, id: 3783039 }
      - pl: "Przed koncertem wielokrotnie przećwiczył ten utwór."
        ru: "Перед концертом он много раз отрепетировал эту пьесу."
        source: { kind: translated, id: 355986 }
  - id: many-fold
    ru: "во много раз"
    note: "при сравнении и при глаголах роста"
    examples:
      - pl: "Od tamtej pory ceny wzrosły wielokrotnie."
        ru: "С тех пор цены выросли во много раз."
        source: { kind: authored }
      - pl: "To miasto jest wielokrotnie większe od naszego."
        ru: "Этот город во много раз больше нашего."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Построено ровно как русское «многократно»: WIELO- «много» + -KROTNIE «-кратно». Два значения: «много раз» (WIELOKROTNIE PRÓBOWAŁEM) и «во много раз» (WIELOKROTNIE WIĘKSZY)." }
  - { kind: register, text: "Слово нейтрально-книжное. В разговоре чаще говорят WIELE RAZY или NIERAZ «не раз». Устойчивый оборот из новостей — WIELOKROTNIE KARANY «неоднократно судимый»." }
  - { kind: pronunciation, text: "Читается «велокро́тне»: WIE — «ве», NIE — «не». Ударение на предпоследнем слоге: wie-lo-KROT-nie." }
collocations:
  - { pl: "wielokrotnie powtarzać", ru: "многократно повторять" }
  - { pl: "wielokrotnie większy", ru: "во много раз больше" }
  - { pl: "już wielokrotnie", ru: "уже не раз" }
family:
  - { pl: "wiele", ru: "много", relation: root, id: wiele }
  - { pl: "wielokrotny", ru: "многократный", relation: derived }
  - { pl: "wielokrotność", ru: "кратное (в математике)", relation: derived }
synonyms: ["wiele razy", "nieraz", "niejednokrotnie"]
etymology: "Из WIELO- «много» и -KROTNY «-кратный» (от старого KROĆ «раз»); русское «многократно» построено из тех же частей."
memory: "Wielokrotnie = «многократно»: wiele «много» + -krotnie «-кратно». Wielokrotnie większy — «во много раз больше»."
idioms:
  - { pl: "wielokrotnie karany", ru: "неоднократно судимый" }
