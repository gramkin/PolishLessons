synonyms: ["dekoracja", "chluba"]
etymology: "От глагола ZDOBIĆ «украшать». Тот же корень, что в русском «сдобный» и «сдобрить»: украсить — значит «сделать лучше, богаче»."
memory: "Ozdoba — украшение; родня русской «сдобе»: сдобренное, нарядное. Ozdoby choinkowe — ёлочные игрушки."
idioms:
  - { pl: "aż kapie od ozdób", ru: "всё увешано украшениями (о чрезмерно разукрашенном)" }
