        ru: "Дети сами сделали украшения из бумаги."
        source: { kind: authored }
  - id: pride
    ru: "украшение, гордость (о человеке или месте)"
    examples:
      - pl: "Ten zabytkowy kościół jest ozdobą miasta."
        ru: "Эта старинная церковь — украшение города."
        source: { kind: authored }
      - pl: "Bramkarz był prawdziwą ozdobą drużyny."
        ru: "Вратарь был настоящим украшением команды."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "OZDOBA — украшение для дома, ёлки, фасада. Русские «украшения» в смысле серёг и колец — по-польски BIŻUTERIA, не OZDOBY." }
  - { kind: usage, text: "Женский род. Родительный множественного — OZDÓB: O переходит в Ó, как в DROGA → DRÓG. Звательный OZDOBO не употребляется." }
  - { kind: usage, text: "Второе значение — «гордость, краса»: OZDOBA MIASTA, OZDOBA DRUŻYNY. Глагол: OZDOBIĆ «украсить», несовершенный вид OZDABIAĆ." }
collocations:
