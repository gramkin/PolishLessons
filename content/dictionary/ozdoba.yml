pos: noun
pron: { cyr: "оздо́ба" }
senses:
  - id: decoration
    ru: "украшение (предмет декора)"
    examples:
      - pl: "Kupiliśmy nowe ozdoby na choinkę."
        ru: "Мы купили новые украшения на ёлку."
        source: { kind: authored }
