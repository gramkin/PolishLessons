# review
id: urazic
format: 2
lemma: "urazić"
rank: 4927
pos: verb
pron: { cyr: "ура́зиць" }
senses:
  - id: offend
    ru: "обидеть, задеть"
    examples:
      - pl: "Nie chciałem cię urazić."
        ru: "Я не хотел тебя обидеть."
        source: { kind: authored }
      - pl: "Jego słowa bardzo ją uraziły."
        ru: "Его слова очень её задели."
        source: { kind: authored }
      - pl: "Uraziłeś jego dumę."
        ru: "Ты задел его самолюбие."
        source: { kind: authored }
  - id: injure
    ru: "ушибить, повредить (часть тела)"
    examples:
      - pl: "Uraził kolano podczas meczu."
        ru: "Он ушиб колено во время матча."
        source: { kind: authored }
      - pl: "Uraziła się w łokieć o drzwi."
        ru: "Она ударилась локтем о дверь."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "URAZIĆ — «обидеть», а не «поразить». «Поразить» в смысле «удивить» — ZDUMIEĆ или ZASKOCZYĆ, «поразить цель» — TRAFIĆ. Близкое OBRAZIĆ сильнее: «оскорбить», URAZIĆ — мягче, «задеть»." }
  - { kind: usage, text: "Пятьдесят три формы. Страдательное URAŻONY — частое прилагательное «обиженный»: POCZUŁ SIĘ URAŻONY. Чередование Z/Ż: URAZIĆ, но URAŻĘ, URAŻĄ, URAŻONY. Несовершенный вид — URAŻAĆ." }
  - { kind: government, text: "Кого — винительный: URAZIĆ PRZYJACIELA. Чем — творительный: URAZIĆ KOGOŚ SŁOWEM. О части тела — винительный или W с винительным при SIĘ: URAZIĆ NOGĘ, URAZIĆ SIĘ W GŁOWĘ." }
  - { kind: pronunciation, text: "Читается «ура́зиць»: ZI — мягкое «зи», ударение на предпоследнем. URAŻĘ — «ура́жэ», URAŻONY — «уражо́ны»." }
  - { kind: register, text: "Нейтральное и вежливое слово: NIE CHCĘ NIKOGO URAZIĆ — частая оговорка перед критикой. URAŻONA DUMA — «уязвлённая гордость». О травме — разговорное, в медицине говорят DOZNAĆ URAZU." }
collocations:
  - { pl: "urazić czyjąś dumę", ru: "задеть чьё-то самолюбие" }
  - { pl: "poczuć się urażonym", ru: "почувствовать себя обиженным" }
  - { pl: "urazić kolano", ru: "ушибить колено" }
family:
  - { pl: "uraz", ru: "травма; обида, неприязнь", relation: derived, id: uraz }
  - { pl: "obrazić", ru: "оскорбить, обидеть", relation: root, id: obrazic }
  - { pl: "urażać", ru: "обижать, задевать", relation: aspect }
etymology: "Приставка U- плюс RAZIĆ «бить, поражать», от праславянского *raziti, *razъ «удар». Русское «разить», «поразить», «заразить» — то же гнездо."
memory: "Urazić — обидеть, задеть: nie chciałem cię urazić. Urażony — обиженный. Uraz — травма. Читается «ура́зиць»."
idioms:
  - { pl: "urazić kogoś do żywego", ru: "задеть кого-то за живое" }
