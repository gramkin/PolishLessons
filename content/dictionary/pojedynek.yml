etymology: "От приставки PO- и JEDEN «один», от праславянского корня, давшего и русское «один», и «поединок». Образ прозрачен в обоих языках: схватка один на один. Русское слово собрано из тех же частей и тем же способом, так что это не просто родственники, а одна и та же постройка. Из того же гнезда идёт POJEDYNCZY «одиночный», слово, которое русский узнаёт по «единичному»."
memory: "Собрано как русский «поединок», морфема в морфему: po плюс jedyn- «один», то есть схватка один на один. Значения совпадают целиком, включая переносное о словесной схватке. Беглое e выпадает: pojedynek, но pojedynku. Не путать на письме с pojedynczy «одиночный», от того же корня. Читается «поеды́нэк», где y даёт «ы», а oje сливается в «ое»."
idioms:
