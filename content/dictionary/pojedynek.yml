notes:
  - { kind: false-friend, text: "Слово собрано ровно как русский «поединок», морфема в морфему: приставка PO-, корень JEDYN- «один» и суффикс. Оба языка назвали схватку по числу участников: один на один. Значения совпадают полностью, включая переносное, о словесной схватке или о противостоянии идей. Это один из тех редких случаев, когда запоминать нечего, достаточно узнать слово в его польской одежде." }
  - { kind: usage, text: "Девять форм, мужской род, неодушевлённое. Беглое E выпадает во всех косвенных падежах: POJEDYNEK, но POJEDYNKU, POJEDYNKIEM, POJEDYNKOWI. Рядом стоит прилагательное POJEDYNCZY «одиночный, единичный», от того же корня, и его легко спутать на письме: POJEDYNEK с беглым E против POJEDYNCZY с C." }
  - { kind: government, text: "Вызвать на дуэль — WYZWAĆ NA POJEDYNEK, предлог NA с винительным, и русский строит оборот так же. В дуэли — W POJEDYNKU, предлог W с местным падежом. Выйти на поединок — STANĄĆ DO POJEDYNKU, предлог DO с родительным, где русский скажет «выйти на поединок», с винительным. Дуэль на пистолетах — POJEDYNEK NA PISTOLETY, предлог NA с винительным множественного." }
  - { kind: pronunciation, text: "Читается «поеды́нэк», четыре слога, ударение на предпоследнем. Буква J даёт «й», но между гласными она сливается, и сочетание OJE звучит как «ое». Буква Y даёт «ы», поэтому третий слог это «ды», а не «ди». В косвенных падежах беглое E пропадает, и POJEDYNKU звучит «поеды́нку», уже в четыре слога без «э»." }
  - { kind: register, text: "Слово книжное и историческое: дуэли в Польше запретили в девятнадцатом веке, и сегодня POJEDYNEK в прямом смысле принадлежит литературе и истории. Зато переносное употребление живое и частое: POJEDYNEK SŁOWNY «словесная перепалка», POJEDYNEK NA ARGUMENTY, а в спорте POJEDYNEK значит очную встречу двух соперников, и так говорят комментаторы." }
