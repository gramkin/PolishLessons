# review
id: mily
format: 2
lemma: "miły"
rank: 189
pos: adj
pron: { cyr: "мы́лы" }
senses:
  - id: kind
    ru: "милый, приветливый, добрый (о человеке)"
    examples:
      - pl: "To bardzo miła dziewczyna."
        ru: "Она очень милая девушка."
        source: { kind: tatoeba, id: 10747405 }
      - pl: "Jill jest inteligentna i oprócz tego miła."
        ru: "Джилл умна и к тому же симпатична."
        source: { kind: tatoeba, id: 7730335 }
      - pl: "Musimy być mili dla starszych ludzi."
        ru: "Нужно быть добрыми к старым людям."
        source: { kind: tatoeba, id: 582152 }
  - id: pleasant
    ru: "приятный (о вещах и событиях); в пожеланиях"
    examples:
      - pl: "Cóż za miła niespodzianka!"
        ru: "Какой приятный сюрприз!"
        source: { kind: tatoeba, id: 1605602 }
      - pl: "Miłego weekendu!"
        ru: "Хороших выходных!"
        source: { kind: tatoeba, id: 832676 }
      - pl: "Miłych snów!"
        ru: "Спокойной ночи!"
        source: { kind: tatoeba, id: 1183975 }
notes:
  - { kind: usage, text: "Пожелания строятся с родительным падежом: Miłego dnia! «Хорошего дня!», Miłych snów! «Приятных снов!», Miłej zabawy! «Приятно повеселиться!»." }
  - { kind: usage, text: "Степени сравнения — milszy и najmilszy. Форм вроде «milejszy» в языке нет, хотя словари их перечисляют." }
  - { kind: false-friend, text: "Существительное mila — это «миля», совсем другое слово: Pół mili «полмили». В таблицах его формы легко спутать с формами miły." }
collocations:
  - { pl: "miłego dnia!", ru: "хорошего дня!" }
  - { pl: "miła niespodzianka", ru: "приятный сюрприз" }
  - { pl: "bądź miły", ru: "будь милым" }
  - { pl: "miło mi", ru: "приятно познакомиться" }
etymology: "Праславянское *milъ — то же слово, что русское «милый»; значение почти не разошлось."
memory: "Пожелания идут с родительным падежом: Miłego dnia!, Miłych snów! Степени — milszy, najmilszy. И не путайте с mila «миля»: Pół mili — это про расстояние."
idioms:
  - { pl: "miłego dnia!", ru: "хорошего дня!" }
  - { pl: "miła niespodzianka", ru: "приятный сюрприз" }
  - { pl: "i gość miły, i chleba żal", ru: "и гостю рад, и хлеба жаль" }
