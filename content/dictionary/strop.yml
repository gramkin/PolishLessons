# review
id: strop
format: 2
lemma: "strop"
rank: 5848
pos: noun
pron: { cyr: "строп" }
senses:
  - id: ceiling
    ru: "перекрытие (между этажами), потолок как конструкция"
    examples:
      - pl: "Strop między piętrami zrobiono z betonu."
        ru: "Перекрытие между этажами сделали из бетона."
        source: { kind: authored }
      - pl: "W starym domu są drewniane stropy."
        ru: "В старом доме деревянные перекрытия."
        source: { kind: authored }
      - pl: "Pod ciężarem śniegu zawalił się strop hali."
        ru: "Под тяжестью снега обрушилось перекрытие павильона."
        source: { kind: authored }
  - id: vault
    ru: "свод (пещеры), кровля (выработки, пласта)"
    examples:
      - pl: "Ze stropu jaskini zwisały stalaktyty."
        ru: "Со свода пещеры свисали сталактиты."
        source: { kind: authored }
      - pl: "Górnicy wzmocnili strop chodnika."
        ru: "Шахтёры укрепили кровлю штрека."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "STROP — не русский «строп» (трос для подъёма груза; по-польски это ZAWIESIE). Польское STROP — «перекрытие», «потолок» как часть конструкции здания, а в пещере или шахте — «свод», «кровля»." }
  - { kind: usage, text: "STROP и SUFIT различаются как конструкция и поверхность: STROP — несущая плита или балки между этажами, SUFIT — то, что видно снизу и что красят. Строители говорят WYLAĆ STROP «залить перекрытие», жильцы — POMALOWAĆ SUFIT «покрасить потолок». В быту оба слова иногда путают." }
  - { kind: pronunciation, text: "Читается «строп», один слог. Родительный STROPU с -U, ударение в косвенных падежах на O: «стро́пу»." }
collocations:
  - { pl: "strop betonowy", ru: "бетонное перекрытие" }
  - { pl: "strop drewniany", ru: "деревянное перекрытие" }
  - { pl: "wylać strop", ru: "залить перекрытие" }
  - { pl: "strop jaskini", ru: "свод пещеры" }
family:
  - { pl: "stropowy", ru: "потолочный, относящийся к перекрытию", relation: derived }
  - { pl: "stropodach", ru: "совмещённое покрытие, бесчердачная крыша", relation: derived }
etymology: "Общеславянское слово: чешское STROP тоже значит «потолок». В русском тот же корень сохранился в слове «стропило»."
memory: "Strop — не строп, а перекрытие; родня русскому «стропило»: оба держат дом сверху."
idioms:
  - { pl: "pod sam strop", ru: "под самый потолок" }
