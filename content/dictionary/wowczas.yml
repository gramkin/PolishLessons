# review
id: wowczas
format: 2
lemma: "wówczas"
rank: 3888
pos: adv
pron: { cyr: "ву́фчас" }
senses:
  - id: then
    ru: "тогда, в то время"
    examples:
      - pl: "Wówczas nikt nie miał telefonów komórkowych."
        ru: "Тогда ни у кого не было мобильных телефонов."
        source: { kind: authored }
      - pl: "Mieszkaliśmy wówczas w Krakowie."
        ru: "Мы тогда жили в Кракове."
        source: { kind: authored }
      - pl: "Dopiero wówczas zrozumiał swój błąd."
        ru: "Только тогда он понял свою ошибку."
        source: { kind: authored }
  - id: in-that-case
    ru: "тогда, в таком случае"
    examples:
      - pl: "Jeśli pociąg się spóźni, wówczas pojedziemy autobusem."
        ru: "Если поезд опоздает, тогда поедем автобусом."
        source: { kind: authored }
      - pl: "Gdy temperatura spadnie poniżej zera, wówczas woda zamarznie."
        ru: "Когда температура упадёт ниже нуля, тогда вода замёрзнет."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "WÓWCZAS — книжное «тогда»; в разговоре говорят WTEDY. С русским «в час» слово роднит только CZAS «время». Внутри спрятано старое ÓW, «тот», как в ÓWCZESNY «тогдашний»." }
  - { kind: usage, text: "Наречие, одна форма. Два значения: время в прошлом или будущем («тогда, в то время») и следствие после условия: JEŚLI X, WÓWCZAS Y, «если X, то Y»." }
  - { kind: government, text: "Наречие ничем не управляет. В условной фразе стоит в начале второй части после запятой: JEŚLI ZADZWONI, WÓWCZAS WSZYSTKO MU WYJAŚNIĘ." }
  - { kind: pronunciation, text: "Читается «ву́фчас», ударение на первом слоге. Ó — «у», W перед глухим CZ оглушается в «ф»." }
  - { kind: register, text: "Слово книжное: история, публицистика, официальная речь. В бытовом разговоре звучит старомодно, там уместнее WTEDY." }
collocations:
  - { pl: "już wówczas", ru: "уже тогда" }
  - { pl: "wówczas jeszcze", ru: "тогда ещё" }
  - { pl: "dopiero wówczas", ru: "только тогда" }
family:
  - { pl: "ów", ru: "тот (книжн.)", relation: root, id: ow }
  - { pl: "ówczesny", ru: "тогдашний", relation: root }
  - { pl: "czas", ru: "время", relation: root, id: czas }
etymology: "Слияние W + ÓW CZAS, «в тот час, в то время». ÓW — старое указательное «тот», родственное русским «оный» и «вон тот». CZAS — «время», родня русского «час»."
memory: "Wówczas — книжное «тогда» (= wtedy): w + ów czas, «в то время». Читается «ву́фчас». Ówczesny — тогдашний."
idioms:
  - { pl: "po wsze czasy", ru: "на все времена" }
formExamples:
  - form: "wówczas"
    pl: "Wówczas jeszcze nie znałem polskiego."
    ru: "Тогда я ещё не знал польского."
    source: { kind: authored }
  - form: "wówczas"
    pl: "Miał wówczas dwadzieścia lat."
    ru: "Ему тогда было двадцать лет."
    source: { kind: authored }
  - form: "wówczas"
    pl: "Jeśli zadzwoni, wówczas wszystko mu wyjaśnię."
    ru: "Если он позвонит, тогда я ему всё объясню."
    source: { kind: authored }
