  - id: leave-to
    ru: "zostawiam to tobie — оставляю это тебе"
    examples:
      - pl: "Zostawiam to tobie."
        ru: "Оставляю это тебе."
        source: { kind: translated, id: 8608452 }
      - pl: "Zostawiam tę sprawę tobie."
        ru: "Оставляю это дело тебе."
        source: { kind: translated, id: 355983 }
      - pl: "Zostawiam to twojej wyobraźni."
        ru: "Оставляю это твоему воображению."
        source: { kind: translated, id: 350828 }
notes:
  - { kind: usage, text: "Совершенный вид — zostawić. Zostawiał klucze «оставлял ключи» о привычке, zostawił klucze «оставил ключи» о разовом действии." }
  - { kind: usage, text: "zostawiać coś otwarte — «оставлять что-то открытым», прилагательное согласуется с дополнением: zostawiać otwarte drzwi, zostawiać włączony komputer." }
  - { kind: usage, text: "zostawiać coś komuś — «оставлять что-то кому-то», с дательным: Zostawiam to tobie «Оставляю это тебе»." }
  - { kind: usage, text: "Не путайте с zostawać «оставаться»: zostawiam «я оставляю» (что-то), но zostaję «я остаюсь» (сам). Одна буква меняет смысл." }
collocations:
  - { pl: "nie zostawiaj mnie", ru: "не оставляй меня" }
  - { pl: "zostawiać otwarte", ru: "оставлять открытым" }
  - { pl: "zostawiam to tobie", ru: "оставляю это тебе" }
  - { pl: "zostawiać ślady", ru: "оставлять следы" }
family:
  - { pl: "zostawić", ru: "оставить", relation: aspect, id: zostawic }
  - { pl: "zostawać", ru: "оставаться", relation: root, id: zostawac }
  - { pl: "zostać", ru: "остаться", relation: root, id: zostac }
etymology: "Приставка zo- + stawiać «ставить». Русское «оставлять» собрано от того же корня «ставить», так что слова устроены одинаково."
memory: "zostawiać — «оставлять», совершенный вид zostawić. Осторожно с соседом: zostawiam «я оставляю (что-то)», но zostaję «я остаюсь (сам)». Одна буква меняет смысл целиком."
idioms:
