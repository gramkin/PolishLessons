notes:
  - { kind: false-friend, text: "WYZNACZYĆ — не «выразить значение»: это «назначить» срок, цену, человека — WYZNACZYĆ TERMIN, WYZNACZYĆ NAGRODĘ — и «наметить, обозначить» — WYZNACZYĆ TRASĘ, GRANICE. Русское «назначить лекарство» — PRZEPISAĆ LEK, а «назначить встречу» — UMÓWIĆ SIĘ, хотя WYZNACZYĆ SPOTKANIE тоже говорят." }
  - { kind: usage, text: "Пятьдесят три формы — подпись переходного глагола совершенного вида: страдательное WYZNACZONY, «назначенный, отведённый», и деепричастие WYZNACZYWSZY. Видовой партнёр — WYZNACZAĆ: ZASADY WYZNACZAJĄ GRANICE. WYZNACZONE MIEJSCE — «отведённое место»." }
  - { kind: government, text: "Что — винительный: WYZNACZYĆ TERMIN, CENĘ. Кого кем — NA с винительным: WYZNACZYĆ KOGOŚ NA KAPITANA. За что — ZA с винительным: NAGRODA ZA INFORMACJE. Себе — SOBIE: WYZNACZYĆ SOBIE CEL." }
  - { kind: pronunciation, text: "Читается «вызна́чыць», три слога, ударение на предпоследнем. Z перед N звонкое, CZ твёрдое — «чы». Конечное Ć — «ць». WYZNACZĘ — «вызна́чэ»." }
  - { kind: register, text: "Слово официальное и деловое: суды, конкурсы, спорт, планирование. На табличках: MIEJSCE WYZNACZONE DO PALENIA, «место для курения». В быту о свидании — UMÓWIĆ SIĘ NA." }
collocations:
  - { pl: "wyznaczyć termin", ru: "назначить срок" }
  - { pl: "wyznaczyć nagrodę", ru: "назначить награду" }
  - { pl: "wyznaczyć sobie cel", ru: "поставить себе цель" }
family:
  - { pl: "wyznaczać", ru: "назначать, определять", relation: aspect }
  - { pl: "znaczyć", ru: "значить; метить", relation: root, id: znaczyc }
  - { pl: "wyznacznik", ru: "показатель, определитель", relation: derived, id: wyznacznik }
etymology: "Приставка WY- плюс ZNACZYĆ «метить, обозначать», от ZNAK «знак», корень ZNA- «знать». Буквально «выставить знак»: назначенное — помеченное."
memory: "Wyznaczyć — назначить, наметить: wyznaczyć termin, nagrodę, trasę, cel. Wyznaczone miejsce — отведённое место. От znak — знак. Читается «вызна́чыць»."
idioms:
  - { pl: "wyznaczyć nagrodę za czyjąś głowę", ru: "назначить награду за чью-то голову" }
