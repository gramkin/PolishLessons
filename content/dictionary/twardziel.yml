notes:
  - { kind: false-friend, text: "Русского слова с таким корнем нет, зато корень знаком: TWARDY это «твёрдый», и соответствие звуков здесь правильное — польскому -AR- отвечает русское -ЁР-, как в MARTWY и «мёртвый», CZARNY и «чёрный». Главная трудность в другом: под одним написанием живут два разных слова. TWARDZIEL мужского рода означает человека несгибаемого, по-русски «крепкий орешек»; TWARDZIEL женского рода — технический термин лесного дела, ядровая древесина, тёмная и плотная середина ствола. Различает их только согласование: TEN TWARDZIEL о человеке, TA TWARDZIEL о дереве." }
  - { kind: usage, text: "Одиннадцать форм, и в них заметен след двух родов. Мужское склонение даёт TWARDZIELA в родительном, TWARDZIELOWI в дательном, TWARDZIELEM в творительном и TWARDZIELE во множественном. Женское склонение, по образцу слов на мягкий согласный вроде MYŚL и STAL, даёт в творительном единственного TWARDZIELĄ, и именно эта форма выдаёт второе слово. Местный единственного — TWARDZIELU. Родительный множественного — TWARDZIELI. При авторстве стоит держать два значения врозь: о человеке TWARDZIELEM, о древесине TWARDZIELĄ." }
  - { kind: pronunciation, text: "Читается «тва́рдзель», два слога, ударение на первом. Сочетание DZI даёт один мягкий звук «дзь», которого в русском нет; ближе всего к нему начало слова «дзюдо», произнесённое мягко. Конечное L по-польски заметно мягче русского твёрдого «л». В форме TWARDZIELA слышно «твардзе́ля», с ударением на втором слоге. В форме TWARDZIELĄ последнее Ą даёт «он»: «твардзе́лён». Начальное TW произносится слитно, без вставного гласного." }
  - { kind: register, text: "В значении человека слово разговорное и одобрительное: TWARDZIEL говорят с уважением, иногда с лёгкой иронией, о том, кто не жалуется и не сдаётся. Оно особенно частое в спортивном репортаже и в рассказах о войне. Женское значение принадлежит языку столяров и лесоводов, где TWARDZIEL противопоставлена слову BIEL — светлой наружной части ствола; в обычном разговоре его не услышишь. Прилагательное TWARDZIELOWY относится только ко второму значению. Производные от корня очень живые: TWARDY, TWARDO, STWARDNIEĆ, UTWARDZIĆ." }
