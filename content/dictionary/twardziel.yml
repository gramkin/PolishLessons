etymology: "От прилагательного TWARDY, праславянское *tvьrdъ, то же слово, что русское «твёрдый». Соответствие гласных здесь показательное и очень полезное: там, где русский даёт -ЁР- или -ЕР- между согласными, польский даёт -AR-, и ряд этот длинный — TWARDY и «твёрдый», MARTWY и «мёртвый», CZARNY и «чёрный», ZIARNO и «зерно». Суффикс -EL в польском образует названия лиц по свойству, и перед ним конечное D основы смягчается в DZ: отсюда TWARDZIEL. Техническое значение, ядровая древесина, появилось позже и по той же логике, по какой русский назвал её «ядром»: это самая твёрдая часть ствола."
memory: "Корень знаком: twardy это «твёрдый», и соответствие регулярное — польское -ar- против русского -ёр-, как martwy и мёртвый, czarny и чёрный. Но слово двуродовое: ten twardziel о человеке, «крепкий орешек», и ta twardziel о дереве, ядровая древесина. Различает согласование и творительный падеж: twardzielem о человеке, twardzielą о древесине. Сочетание dzi звучит одним мягким «дзь»."
