notes:
  - { kind: government, text: "Склоняется как прилагательное женского рода: Polska, Polski, Polsce, Polskę, Polską. Это редкость среди названий стран." }
  - { kind: usage, text: "В Польше — w Polsce, предложный; в Польшу — do Polski, с родительным после do. Не «в Польшу» через w." }
  - { kind: false-friend, text: "Родительный Polski совпадает по форме с прилагательным polski «польский» — различать приходится по контексту и заглавной букве." }
  - { kind: usage, text: "От pole «поле»: Польша — страна полей, а поляки — Polacy." }
  - { kind: usage, text: "Название страны живёт в единственном числе. Оборот dwie Polski «две Польши» о расколотой стране — риторическая фигура публицистики, а не обычная форма множественного числа." }
