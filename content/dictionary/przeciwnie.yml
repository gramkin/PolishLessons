etymology: "От PRZECIWNY, а то — от предлога PRZECIW, из праславянского *protivъ, откуда и русское «против», «противный», «напротив». Исходное значение корня пространственное: то, что стоит лицом к лицу, напротив. Польский это значение сохранил целиком, и у него PRZECIWNY — «противоположный», PRZECIWNIE — «наоборот», PRZECIWNIK — «противник». Русский на том же корне вырастил второе, оценочное значение: «противный» стало означать вызывающий отвращение, и первоначальное «противоположный» ушло к слову «противоположный» с удвоенной приставкой. Поэтому пара PRZECIWNY и «противный» — расхождение не формы, а смысла, и восстанавливается оно через «напротив», где русский корень сохранил старое значение в чистом виде. Наречный суффикс -IE здесь обычный польский способ сделать из прилагательного наречие, как DOBRY и DOBRZE."
memory: "przeciwnie — это «наоборот», а не «противно»: «противно» по-польски wstrętnie. И przeciwny — «противоположный», а не «противный» (это wstrętny). Корень общий с русским «против», но русский развил у него смысл отвращения, а польский остался при «напротив». Главный оборот — wręcz przeciwnie «как раз наоборот», годится как целый ответ. Форма одна: наречие не склоняется и степеней не имеет."
