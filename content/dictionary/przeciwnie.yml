notes:
  - { kind: false-friend, text: "Ловушка в этом слове прямая: PRZECIWNIE значит «наоборот, напротив», а не «противно». Русское «противно» по-польски WSTRĘTNIE или OBRZYDLIWIE, и ничего общего с PRZECIWNIE у него нет. Так же расходится и прилагательное: PRZECIWNY это «противоположный, обратный» (STRONA PRZECIWNA «противоположная сторона», PRZECIWNE ZDANIE «противоположное мнение»), а русское «противный» в смысле «неприятный» — это WSTRĘTNY, PASKUDNY. Корень при этом общий: польское PRZECIW и русское «против». Просто русский развил у этого корня значение отвращения, а польский остался при пространственном «напротив»." }
  - { kind: government, text: "Наречие, неизменяемое: одна форма на все случаи. Самый частый оборот — WRĘCZ PRZECIWNIE «как раз наоборот», которым целиком отвечают на предыдущую фразу: CZY BYŁ ZŁY? WRĘCZ PRZECIWNIE. Сравнение строится через NIŻ: POSTĄPIŁ PRZECIWNIE, NIŻ OBIECYWAŁ «поступил наоборот, чем обещал». Направление против чего-то — предлог DO с родительным: PRZECIWNIE DO RUCHU WSKAZÓWEK ZEGARA «против часовой стрелки». Рядом стоит ODWROTNIE, близкое по смыслу «наоборот», но оно скорее о перевёрнутом порядке, тогда как PRZECIWNIE — о противоположности по существу." }
  - { kind: usage, text: "Степеней сравнения не образует, потому что противоположность не бывает большей или меньшей — это относительное наречие, а не качественное. Поэтому в таблице у него одна-единственная форма, и это самый короткий полный набор в словаре. Отрицательной формы NIEPRZECIWNIE не существует. В начале предложения PRZECIWNIE отделяется запятой и опровергает сказанное раньше: NIE BYŁ ZMĘCZONY. PRZECIWNIE, TRYSKAŁ ENERGIĄ. В этой роли оно работает как цельный ответ, и по-русски передаётся тем же «наоборот»." }
  - { kind: pronunciation, text: "Читается «пшеци́вне», три слога, ударение на предпоследнем. Начальное PRZ звучит глухо, «пш», потому что P оглушает следующий согласный. Сочетание CI перед гласной даёт мягкое «ць»: CIW это «цив». Конечное NIE читается «не», с мягким н. Слово длиннее, чем кажется по написанию, и произносится слитно, одним движением, без паузы перед NIE." }
