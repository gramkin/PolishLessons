etymology: "От WYGODA «удобство», от GODZIĆ SIĘ «годиться, подходить». Удобное — то, что «годится». Русское «выгода» — того же корня, но ушло к прибыли: то, что годится для кармана. Польский оставил смысл «подходящий для тела и жизни»."
memory: "Wygodny — удобный, НЕ выгодный! Wygodny fotel, wygodne buty. Выгодный — korzystny. Wygodniejszy, najwygodniejszy. Читается «выго́дны»."
idioms:
