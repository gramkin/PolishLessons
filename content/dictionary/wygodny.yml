      - pl: "Jest zbyt wygodny, żeby się przeprowadzić."
        ru: "Он слишком ленив, чтобы переезжать."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Опаснейший ложный друг. Польское WYGODNY — «удобный», а не «выгодный»! WYGODNY FOTEL — «удобное кресло», WYGODNE BUTY — «удобная обувь». Русское «выгодный» по-польски — KORZYSTNY или OPŁACALNY: KORZYSTNA CENA, «выгодная цена». А о человеке WYGODNY значит «любящий комфорт, ленивый»: ON JEST WYGODNY, «он себя бережёт»." }
  - { kind: usage, text: "Полная парадигма: WYGODNY, WYGODNIEJSZY, NAJWYGODNIEJSZY. Все степени очень частотны: WYGODNIEJSZE KRZESŁO, NAJWYGODNIEJSZE ROZWIĄZANIE. Форма для мужчин-людей во всех трёх: WYGODNI, WYGODNIEJSI, NAJWYGODNIEJSI." }
  - { kind: government, text: "Удобный для кого-то — WYGODNY DLA KOGOŚ, DLA с родительным. Устраиваться поудобнее — USIĄŚĆ WYGODNIE, наречием. Удобно ли вам? — CZY JEST PANU WYGODNIE?, наречие с дательным." }
  - { kind: pronunciation, text: "Читается «выго́дны», три слога, ударение на предпоследнем, а не на первом, как в русском «вы́годный». WY — твёрдое «вы», GO — «го». В WYGODNIEJSZY: «выгодне́йшы»." }
  - { kind: register, text: "Нейтральное повседневное слово. В рекламе мебели и обуви — на каждом шагу: WYGODNE I TRWAŁE. О человеке — с лёгкой иронией: WYGODNICKI, «любящий удобства», — уже открыто осуждающее." }
