senses:
  - id: comfortable
    ru: "удобный, комфортный"
    examples:
      - pl: "To bardzo wygodny fotel."
        ru: "Это очень удобное кресло."
        source: { kind: authored }
      - pl: "Kup sobie wygodne buty na wycieczkę."
        ru: "Купи себе удобную обувь для похода."
