        ru: "В отеле удобные кровати."
        source: { kind: authored }
  - id: convenient
    ru: "удобный (по времени, месту); ленивый, любящий комфорт"
    examples:
      - pl: "To dla mnie wygodny termin."
        ru: "Это удобный для меня срок."
