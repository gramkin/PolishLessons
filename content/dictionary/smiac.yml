# review
id: smiac
format: 2
lemma: "śmiać"
rank: 1128
pos: verb
aspect: imperf
pron: { cyr: "сьмяць" }
senses:
  - id: laugh
    ru: "смеяться (śmiać się)"
    examples:
      - pl: "Lubię się śmiać."
        ru: "Я люблю смеяться."
        source: { kind: translated, id: 4735541 }
      - pl: "Śmieje się."
        ru: "Он смеётся."
        source: { kind: translated, id: 7663705 }
      - pl: "Oni się śmieją."
        ru: "Они смеются."
        source: { kind: translated, id: 8761350 }
  - id: at-someone
    ru: "śmiać się z kogoś — смеяться над кем-то"
    examples:
      - pl: "Nie śmiej się z niego."
        ru: "Не смейся над ним."
        source: { kind: translated, id: 363221 }
      - pl: "Wszyscy się śmiali z Jacka."
        ru: "Все смеялись над Джеком."
        source: { kind: tatoeba, id: 560519 }
  - id: stop
    ru: "przestać się śmiać — перестать смеяться"
    examples:
      - pl: "Przestań się śmiać."
        ru: "Перестань смеяться."
        source: { kind: translated, id: 5652385 }
      - pl: "Nie wiem, czy mam płakać, czy śmiać się."
        ru: "Я не знаю, плакать мне или смеяться."
        source: { kind: tatoeba, id: 691338 }
notes:
  - { kind: government, text: "Главное отличие от русского — падеж: śmiać się Z kogoś, предлог z с родительным. Русское «смеяться над кем-то» требует творительного с «над». Śmiali się z Jacka «Все смеялись над Джеком»." }
  - { kind: usage, text: "Глагол всегда идёт с się: śmiać się. Форм без się в живой речи нет." }
  - { kind: false-friend, text: "Не путайте с глаголом śmieć «сметь»: часть форм у них совпадает. Nie śmiałbym значит «я бы не посмел», а не «я бы не смеялся»." }
  - { kind: false-friend, text: "śmiało — не форма этого глагола, а отдельное наречие «смело, давай»: Śmiało! «Давай!, Не стесняйся!», pytaj śmiało «спрашивай смело»." }
collocations:
  - { pl: "śmiać się z kogoś", ru: "смеяться над кем-то" }
  - { pl: "przestać się śmiać", ru: "перестать смеяться" }
  - { pl: "śmiać się do łez", ru: "смеяться до слёз" }
family:
  - { pl: "śmiech", ru: "смех", relation: root }
  - { pl: "uśmiech", ru: "улыбка", relation: derived }
  - { pl: "śmieszny", ru: "смешной", relation: derived }
etymology: "Праславянское *smьjati sę — то же слово, что русское «смеяться». Польское ś- на месте русского с- здесь регулярно, как в śmierć «смерть»."
memory: "śmiać się — «смеяться», всегда с się. Падеж другой: śmiać się Z kogoś, предлог z с родительным, а по-русски «смеяться НАД кем-то». И осторожно с соседями: śmiało это наречие «смело, давай», а śmieć — отдельный глагол «сметь»."
idioms:
  - { pl: "śmiać się do łez", ru: "смеяться до слёз" }
  - { pl: "kto się śmieje ostatni, ten się śmieje najlepiej", ru: "хорошо смеётся тот, кто смеётся последним" }
formExamplesSkip:
  - { form: "śmiało", reason: "по написанию совпадает с наречием śmiało «смело, давай» — именно оно стоит во всех примерах корпуса (Śmiało!, pytaj śmiało), а не форма этого глагола" }
  - { form: "śmieli", reason: "нестандартный вариант формы прошедшего времени; нормой является śmiali, и та же форма принадлежит глаголу śmieć «сметь»" }
