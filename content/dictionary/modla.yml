# review
id: modla
format: 2
lemma: "modła"
rank: 5844
pos: noun
pron: { cyr: "мо́дуа" }
senses:
  - id: manner
    ru: "образец, лад, манер (почти только в оборотах NA … MODŁĘ)"
    examples:
      - pl: "Ukształtowała jego charakter na własną modłę."
        ru: "Она сформировала его характер на свой лад."
        source: { kind: translated, id: 13971336 }
      - pl: "Przerobił scenariusz na swoją modłę."
        ru: "Он переделал сценарий на свой лад."
        source: { kind: authored }
      - pl: "Wszystkie te domy zbudowano na jedną modłę."
        ru: "Все эти дома построены на один манер."
        source: { kind: authored }
  - id: prayer
    ru: "молитва; во мн. MODŁY — молитвы, моления (книжн.)"
    examples:
      - pl: "Wierni zanosili modły o deszcz."
        ru: "Верующие возносили молитвы о дожде."
        source: { kind: authored }
      - pl: "Klęczał pogrążony w cichej modle."
        ru: "Он стоял на коленях, погружённый в тихую молитву."
        source: { kind: authored }
notes:
  - { kind: usage, text: "В значении «образец» слово живёт почти только в оборотах с винительным: NA SWOJĄ MODŁĘ «на свой лад», NA JEDNĄ MODŁĘ «на один манер», NA MODŁĘ ZACHODNIĄ «на западный манер», NA AMERYKAŃSKĄ MODŁĘ «по-американски». В других падежах оно встречается редко и звучит книжно." }
  - { kind: false-friend, text: "MODŁA похожа и на «модель», и на «молитву» — и действительно значит то и другое. Но обычная молитва — MODLITWA; MODŁY во множественном числе — торжественное «моления»: ZANOSIĆ MODŁY «возносить молитвы». Родительный множественного у них MODŁÓW, а не MODEŁ." }
  - { kind: usage, text: "Женский род, склоняется как SZKOŁA: W MODLE, NA MODŁĘ, Z MODŁĄ. Ł перед E чередуется с L: MODŁA — O MODLE." }
  - { kind: pronunciation, text: "Читается «мо́дуа»: Ł звучит как короткое «у», а не как «л». Ударение на первом слоге." }
collocations:
  - { pl: "na swoją modłę", ru: "на свой лад" }
  - { pl: "na jedną modłę", ru: "на один манер, на одну колодку" }
  - { pl: "na modłę zachodnią", ru: "на западный манер" }
  - { pl: "zanosić modły", ru: "возносить молитвы" }
family:
  - { pl: "modlitwa", ru: "молитва", relation: root, id: modlitwa }
  - { pl: "modlić", ru: "молить (MODLIĆ SIĘ «молиться»)", relation: root, id: modlic }
  - { pl: "model", ru: "модель, образец", relation: root, id: model }
etymology: "В значении «образец» — заимствование из немецкого (ср. MODELL), восходящее к латинскому MODULUS «мера». В значении «молитва» слово связано с глаголом MODLIĆ SIĘ «молиться»."
memory: "Na swoją modłę — «на свой лад», по своей модели. А modły — книжные «моления»; обычная молитва — modlitwa."
idioms:
  - { pl: "na swoją modłę", ru: "на свой лад, по-своему" }
  - { pl: "na jedną modłę", ru: "на одну колодку, по одному шаблону" }
formExamplesSkip:
  - { form: "modeł", reason: "родительный множественного MODEŁ не употребляется: у MODŁY «молитвы» он MODŁÓW, а «образец» во множественном числе не встречается" }
  - { form: "modło", reason: "звательный не употребляется: «образцу» и «молитве» не говорят «о, модла»" }
  - { form: "modły", cell: "Звательный", reason: "звательный падеж: к предмету или понятию не обращаются" }
