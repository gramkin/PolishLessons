# review
id: wygladac
format: 2
lemma: "wyglądać"
rank: 115
pos: verb
aspect: imperf
pron: { cyr: "выглё́ндаць" }
senses:
  - id: look
    ru: "выглядеть, иметь вид"
    examples:
      - pl: "Jak wyglądam?"
        ru: "Как я выгляжу?"
        source: { kind: tatoeba, id: 3743739 }
      - pl: "Wyglądam dziś okropnie."
        ru: "Я сегодня ужасно выгляжу."
        source: { kind: tatoeba, id: 12567531 }
      - pl: "Babcia Toma wygląda zdrowo."
        ru: "Бабушка Тома выглядит здоровой."
        source: { kind: tatoeba, id: 2122159 }
  - id: seem
    ru: "wyglądać na kogoś/coś — выглядеть каким-либо, казаться"
    note: "После wyglądać na ставится винительный падеж: wygląda na chorego «выглядит больным»."
    examples:
      - pl: "Wygląda na smutną."
        ru: "Она выглядит грустной."
        source: { kind: tatoeba, id: 610625 }
      - pl: "Wygląda na chorego."
        ru: "Он выглядит больным."
        source: { kind: tatoeba, id: 6109102 }
      - pl: "Wygląda na sympatycznego."
        ru: "Он кажется дружелюбным."
        source: { kind: tatoeba, id: 4043880 }
notes:
  - { kind: government, text: "Две конструкции: wyglądać dobrze «выглядеть хорошо» (наречие) и wyglądać na chorego «выглядеть больным» (na + винительный)." }
  - { kind: usage, text: "wyglądać przez okno значит «выглядывать в окно»; Jak to wygląda? — «Как обстоит дело?»." }
  - { kind: usage, text: "Совершенного вида у этого глагола в значении «выглядеть» нет; для однократного «выглянуть» служит wyjrzeć." }
collocations:
  - { pl: "wyglądać dobrze", ru: "хорошо выглядеть" }
  - { pl: "wyglądać na zmęczonego", ru: "выглядеть усталым" }
  - { pl: "wyglądać przez okno", ru: "выглядывать в окно" }
  - { pl: "jak to wygląda?", ru: "как это выглядит?" }
etymology: "Приставка wy- + glądać «смотреть» (праславянское *ględati); тот же корень, что в русском «глядеть», но значение — «выглядеть»."
memory: "Родня русскому «глядеть», а значит «выглядеть». Главная конструкция — wyglądać na + винительный: Wygląda na chorego «Он выглядит больным». А wyglądać przez okno — «выглядывать в окно»."
idioms:
  - { pl: "wyglądać jak cień", ru: "выглядеть как тень" }
  - { pl: "wyglądać jak siedem nieszczęść", ru: "выглядеть хуже некуда" }
  - { pl: "wyglądać jak księżyc w pełni", ru: "выглядеть круглым как луна" }
