notes:
  - { kind: false-friend, text: "PROFESJONALISTA — «профессионал», с длинным суффиксом -ISTA. Короче и разговорнее — ZAWODOWIEC или FACHOWIEC, «мастер своего дела». Профессиональный — PROFESJONALNY." }
  - { kind: usage, text: "Мужской род, лицо, склоняется как существительные на -A: PROFESJONALISTA, PROFESJONALISTY, PROFESJONALIŚCIE. Множественное — PROFESJONALIŚCI. Звательный PROFESJONALISTO не учим." }
  - { kind: government, text: "Обратиться к профессионалу — ZWRÓCIĆ SIĘ DO PROFESJONALISTY, родительный. Стать профессионалом — ZOSTAĆ PROFESJONALISTĄ, творительный." }
  - { kind: pronunciation, text: "Читается «профэсьёнали́ста»: SJO — «сьё», ударение на предпоследнем слоге. PROFESJONALIŚCI — «профэсьёнали́сьци»." }
collocations:
