# review
id: nieznosny
format: 2
lemma: "nieznośny"
rank: 5561
pos: adj
pron: { cyr: "незно́сьны" }
senses:
  - id: unbearable
    ru: "невыносимый"
    examples:
      - pl: "Ból był nieznośny."
        ru: "Боль была невыносима."
        source: { kind: tatoeba, id: 362988 }
      - pl: "Dokuczają mi nieznośne bóle."
        ru: "У меня невыносимые боли."
        source: { kind: tatoeba, id: 2894983 }
      - pl: "Już drugi tydzień trwają nieznośne upały."
        ru: "Уже вторую неделю стоит невыносимая жара."
        source: { kind: translated, id: 933482 }
  - id: insufferable
    ru: "несносный (о человеке, поведении)"
    examples:
      - pl: "Znoszenie czegoś może być nieznośne."
        ru: "Выносить что-либо может быть невыносимо."
        source: { kind: tatoeba, id: 351456 }
      - pl: "Ten chłopiec bywa nieznośny."
        ru: "Этот мальчик бывает несносным."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Собрано как русское: nie + znosić «выносить, терпеть». Русское «невыносимый» и «несносный» — два слова там, где польский обходится одним." }
  - { kind: usage, text: "О боли, жаре, шуме — «невыносимый»; о человеке или ребёнке — «несносный»." }
  - { kind: government, text: "Обычное прилагательное; наречие — nieznośnie." }
  - { kind: usage, text: "Глагол znosić «выносить, терпеть» уже есть в словаре." }
  - { kind: government, text: "Степени сравнения обычны: nieznośniejszy, najnieznośniejszy. Приставка nie- этому не мешает — в отличие от niewłaściwy, у которого степеней нет по смыслу: «не тот» градаций не имеет." }
collocations:
  - { pl: "nieznośny ból", ru: "невыносимая боль" }
  - { pl: "nieznośny upał", ru: "невыносимая жара" }
etymology: "nie + znosić «выносить, терпеть»; русское «невыносимый» собрано из тех же частей."
memory: "nieznośny — и «невыносимый» (о боли, жаре), и «несносный» (о человеке). Русский делит это на два слова, польский обходится одним."
idioms:
  - { pl: "nieznośny ból", ru: "невыносимая боль" }
