# review
id: pewno
format: 2
lemma: "pewno"
rank: 2382
pos: adv
pron: { cyr: "пэ́вно" }
senses:
  - id: certainly
    ru: "na pewno — точно, наверняка"
    examples:
      - pl: "Na pewno przyjdę."
        ru: "Я точно приду."
        source: { kind: authored }
      - pl: "Na pewno go widziałem."
        ru: "Я наверняка его видел."
        source: { kind: authored }
  - id: probably
    ru: "наверное, пожалуй (разг.)"
    examples:
      - pl: "Pewno się spóźni, jak zwykle."
        ru: "Наверное, опоздает, как обычно."
        source: { kind: authored }
      - pl: "Pewno masz rację."
        ru: "Пожалуй, ты прав."
        source: { kind: authored }
  - id: more-surely
    ru: "вернее, надёжнее"
    examples:
      - pl: "Pewniej trzymać się poręczy."
        ru: "Надёжнее держаться за перила."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ДВА ПОХОЖИХ СЛОВА ЗНАЧАТ ПРОТИВОПОЛОЖНЫЕ СТЕПЕНИ УВЕРЕННОСТИ. NA PEWNO значит «ТОЧНО, наверняка»: na pewno przyjdę — обещание. PEWNIE значит «НАВЕРНОЕ, скорее всего»: pewnie przyjdzie — догадка. Русское «наверно» и «наверняка» различаются так же, но по-польски их легко перепутать, потому что корень один." }
  - { kind: usage, text: "Само pewno почти не стоит в одиночку: в значении «точно» оно требует предлога na, а в значении «наверное» звучит разговорно и старомодно, уступая слову pewnie. Степени сравнения pewniej и najpewniej употребляются свободно: pewniej będzie poczekać «надёжнее будет подождать»." }
  - { kind: pronunciation, text: "Два слога, ударение на первом: PEW-no. W перед n остаётся звонким: «пэ́вно». В сравнительной степени мягкое ni: pewniej — «пэ́вней»." }
  - { kind: register, text: "Оборот na pewno нейтрален и очень част. Одиночное pewno в значении догадки принадлежит разговорной и слегка деревенской речи; в городском разговоре скажут pewnie или chyba. В письме обоих лучше избегать в пользу prawdopodobnie." }
collocations:
  - { pl: "na pewno", ru: "точно, наверняка" }
  - { pl: "pewniej będzie", ru: "надёжнее будет" }
  - { pl: "na pewno nie", ru: "точно нет" }
family:
  - { pl: "pewny", ru: "уверенный, надёжный", relation: root, id: pewny }
  - { pl: "pewnie", ru: "наверное; уверенно", relation: derived, id: pewnie }
  - { pl: "chyba", ru: "наверное, кажется", relation: derived, id: chyba }
etymology: "От pewny «уверенный, надёжный», из праславянского *pъvati «доверять, надеяться» — того же корня, что русское «уповать» и старое «пва». Русский сохранил его только в книжном «уповать», польский сделал из него обиходное pewny. Отсюда pewność, upewnić się, zapewne."
memory: "pewno живёт прежде всего в обороте NA PEWNO — «точно, наверняка». Не путать с pewnie «наверное»: одно обещание, другое догадка. Корень тот же, что в русском «уповать»."
idioms:
  - { pl: "na pewno", ru: "наверняка" }
  - { pl: "na pewno nie", ru: "уж точно нет" }
