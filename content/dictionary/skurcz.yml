# review
id: skurcz
format: 2
lemma: "skurcz"
rank: 4922
pos: noun
pron: { cyr: "скурч" }
senses:
  - id: cramp
    ru: "судорога, спазм"
    examples:
      - pl: "W nocy złapał mnie skurcz łydki."
        ru: "Ночью у меня свело икру."
        source: { kind: authored }
      - pl: "Pływak dostał skurczu i zaczął tonąć."
        ru: "У пловца случилась судорога, и он начал тонуть."
        source: { kind: authored }
      - pl: "Skurcz minął po masażu."
        ru: "Судорога прошла после массажа."
        source: { kind: authored }
  - id: contraction
    ru: "сокращение (мышцы, сердца); схватки (мн.)"
    examples:
      - pl: "Skurcze porodowe stawały się coraz częstsze."
        ru: "Родовые схватки становились всё чаще."
        source: { kind: authored }
      - pl: "Serce wykonuje skurcz co sekundę."
        ru: "Сердце сокращается каждую секунду."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "SKURCZ — «судорога» и «спазм», от KURCZYĆ «сжимать», того же корня, что русские «корчиться» и «корчи». SKURCZE во множественном — ещё и родовые схватки: SKURCZE CO PIĘĆ MINUT. А наречие KURCZOWO — «судорожно, мёртвой хваткой»: TRZYMAĆ SIĘ KURCZOWO PORĘCZY." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Родительный единственного — SKURCZU. В родительном множественного две формы, SKURCZÓW и SKURCZY, обе правильные." }
  - { kind: government, text: "Свело судорогой — ZŁAPAŁ MNIE SKURCZ, буквально «меня поймала судорога». Получить судорогу — DOSTAĆ SKURCZU, родительный. Судорога чего-то — SKURCZ CZEGOŚ: SKURCZ ŁYDKI." }
  - { kind: pronunciation, text: "Читается «скурч», один слог. CZ на конце даёт «ч». В форме SKURCZU: «ску́рчу»." }
collocations:
  - { pl: "bolesny skurcz", ru: "болезненная судорога" }
  - { pl: "skurcz mięśni", ru: "спазм мышц" }
  - { pl: "skurcze porodowe", ru: "родовые схватки" }
family:
  - { pl: "kurczyć", ru: "сжимать, съёживать", relation: root }
  - { pl: "skurczyć", ru: "сжаться, усохнуть (skurczyć się)", relation: derived }
  - { pl: "kurczowo", ru: "судорожно, мёртвой хваткой", relation: derived }
etymology: "От KURCZYĆ «сжимать», праславянского корня, общего с русскими «корчить», «корчиться», «корчи». Польское U на месте русского «о» — след древнего гласного, который в двух языках развился по-разному."
memory: "Skurcz — судорога, спазм; skurcze — ещё и схватки. Читается «скурч». Złapał mnie skurcz — меня свело. Родня русских «корчи», «корчиться». Kurczowo — судорожно, мёртвой хваткой."
idioms:
  - { pl: "złapał mnie skurcz", ru: "меня свело судорогой" }
  - { pl: "skurcz żołądka", ru: "спазм желудка (в том числе от волнения)" }
