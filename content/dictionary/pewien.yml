# review
id: pewien
format: 2
lemma: "pewien"
rank: 431
pos: adj
pron: { cyr: "пе́вен" }
senses:
  - id: sure
    ru: "уверенный"
    examples:
      - pl: "Czy jesteś pewien?"
        ru: "Ты уверен?"
        source: { kind: tatoeba, id: 6327965 }
      - pl: "Jesteś pewna?"
        ru: "Ты уверена?"
        source: { kind: tatoeba, id: 532870 }
      - pl: "Jestem prawie pewien."
        ru: "Я почти уверен."
        source: { kind: tatoeba, id: 4735336 }
  - id: certain
    ru: "некоторый, некий, один (неопределённое значение)"
    examples:
      - pl: "Spotkamy się pewnego dnia."
        ru: "Когда-нибудь мы увидимся снова."
        source: { kind: tatoeba, id: 1354337 }
      - pl: "W pewnym sensie jest artystą."
        ru: "В некотором смысле он художник."
        source: { kind: translated, id: 364762 }
      - pl: "Trener dał mi pewną radę."
        ru: "Тренер дал мне один совет."
        source: { kind: translated, id: 3418774 }
notes:
  - { kind: usage, text: "В одном слове живут два разных значения: «уверенный» (jestem pewien «я уверен») и «некоторый, некий» (pewnego dnia «однажды», w pewnym sensie «в некотором смысле»)." }
  - { kind: usage, text: "pewien — короткая форма мужского рода, она стоит в сказуемом: Jestem pewien. Длинная форма pewny идёт при существительном: pewny krok «уверенный шаг»." }
  - { kind: false-friend, text: "na pewno значит «наверняка, точно», а похожее pewnie — наоборот, «наверное», то есть неуверенность. Na pewno przyjdę «Я точно приду», Pewnie przyjdzie «Он, наверное, придёт»." }
  - { kind: usage, text: "Корень связан с *pъvati «уповать, надеяться» — то же, что в русском «уповать»: уверенный значит «тот, на кого можно положиться»." }
collocations:
  - { pl: "na pewno", ru: "наверняка, точно" }
  - { pl: "jestem pewien", ru: "я уверен" }
  - { pl: "pewnego dnia", ru: "однажды" }
  - { pl: "w pewnym sensie", ru: "в некотором смысле" }
etymology: "Праславянское *pъvьnъ от *pъvati «надеяться, уповать». Русское «уповать» — тот же корень: pewien это «тот, на кого можно положиться»."
memory: "pewien — сразу «уверенный» и «некоторый». Короткая форма pewien стоит в сказуемом (jestem pewien), длинная pewny — при существительном. И держите в голове пару-перевёртыш: na pewno «точно», но pewnie «наверное»."
idioms:
  - { pl: "na pewno", ru: "наверняка, точно" }
  - { pl: "pewnego dnia", ru: "однажды" }
  - { pl: "w pewnym sensie", ru: "в некотором смысле" }
