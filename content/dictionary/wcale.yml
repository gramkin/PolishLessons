# review
id: wcale
format: 2
lemma: "wcale"
rank: 542
pos: adv
pron: { cyr: "вца́ле" }
senses:
  - id: not-at-all
    ru: "вовсе не, совсем не (с отрицанием)"
    note: "Почти всегда стоит рядом с nie: wcale nie «вовсе не»."
    examples:
      - pl: "Wcale nie boję się psów."
        ru: "Я совсем не боюсь собак."
        source: { kind: tatoeba, id: 12569936 }
      - pl: "Mój angielski wcale nie jest dobry."
        ru: "Мой английский вовсе не хорош."
        source: { kind: tatoeba, id: 919927 }
      - pl: "Moje psy nie są wcale posłuszne."
        ru: "Мои собаки совсем не послушны."
        source: { kind: tatoeba, id: 12760595 }
  - id: at-all
    ru: "вообще, совсем (в отрицательных и оценочных оборотах)"
    note: "Dwa procent — to wcale nie dużo «Два процента — это совсем немного»."
    examples:
      - pl: "Dlaczego wcale mi nie pomagasz?"
        ru: "Почему ты мне совсем не помогаешь?"
        source: { kind: tatoeba, id: 2176476 }
      - pl: "Dwa procent - to wcale nie dużo."
        ru: "Два процента — это совсем немного."
        source: { kind: tatoeba, id: 13784963 }
      - pl: "Lepiej mniej niż wcale."
        ru: "Лучше меньше, чем ничего."
        source: { kind: tatoeba, id: 7727830 }
notes:
  - { kind: usage, text: "Почти всегда употребляется с отрицанием: wcale nie «вовсе не». Wcale nie boję się psów «Я вовсе не боюсь собак»." }
  - { kind: usage, text: "wcale nie усиливает отрицание сильнее простого nie: To nie jest dobre «Это нехорошо», но To wcale nie jest dobre «Это вовсе нехорошо»." }
  - { kind: usage, text: "Без отрицания живёт в обороте lepiej mniej niż wcale «лучше меньше, чем совсем ничего»." }
  - { kind: false-friend, text: "Не путайте wcale «вовсе» с całkiem «вполне, совсем»: całkiem dobry — «вполне хороший», а wcale nie dobry — «вовсе не хороший»." }
collocations:
  - { pl: "wcale nie", ru: "вовсе не" }
  - { pl: "wcale nie tak źle", ru: "совсем неплохо" }
  - { pl: "lepiej mniej niż wcale", ru: "лучше меньше, чем ничего" }
  - { pl: "wcale nie dużo", ru: "совсем немного" }
family:
  - { pl: "cały", ru: "целый", relation: root }
  - { pl: "całkiem", ru: "вполне, совсем", relation: derived }
etymology: "Из w + cale, старой формы от cały «целый» — буквально «в целом, вовсе». Русское «вовсе» собрано ровно так же: во + весь."
memory: "wcale почти всегда ходит с отрицанием: wcale nie — «вовсе не, совсем не». Wcale nie boję się psów «Я вовсе не боюсь собак», Mój angielski wcale nie jest dobry «Мой английский вовсе не хорош». Само слово устроено как русское «вовсе»: w + cale, от cały «целый», — то же, что во + весь. А całkiem, похожее с виду, значит наоборот «вполне»."
