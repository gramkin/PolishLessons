etymology: "Из греческих слов «малый» и «звук». Вторая часть та же, что в TELEFON и MEGAFON."
memory: "Mikrofon — микрофон, ударение «микро́фон». Mówić do mikrofonu — говорить в микрофон (do!). Wycisz mikrofon — выключи микрофон."
idioms:
