notes:
  - { kind: false-friend, text: "MIKROFON — «микрофон», но ударение на предпоследнем слоге: «микро́фон», а не «микрофо́н». В онлайн-звонке «включи микрофон» — WŁĄCZ MIKROFON, «выключи» — WYCISZ MIKROFON." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Родительный — MIKROFONU, местный — W MIKROFONIE." }
  - { kind: government, text: "Говорить в микрофон — MÓWIĆ DO MIKROFONU, DO с родительным, а не W. Подойти к микрофону — PODEJŚĆ DO MIKROFONU. Перед микрофоном — PRZED MIKROFONEM." }
  - { kind: pronunciation, text: "Читается «микро́фон», ударение на предпоследнем слоге, по польскому правилу." }
collocations:
  - { pl: "mówić do mikrofonu", ru: "говорить в микрофон" }
  - { pl: "włączyć mikrofon", ru: "включить микрофон" }
  - { pl: "wbudowany mikrofon", ru: "встроенный микрофон" }
