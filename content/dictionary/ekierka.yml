notes:
  - { kind: false-friend, text: "EKIERKA — школьный чертёжный угольник, пластиковый или деревянный треугольник. Русское «экер» — геодезический прибор, и в школе так не говорят: по-русски это «угольник» или просто «треугольник»." }
  - { kind: usage, text: "Женский род, девять форм. Перед -E основа меняет K на C: W EKIERCE, KU EKIERCE. Родительный множественного — EKIEREK, с беглым E. Звательный EKIERKO не употребляется." }
  - { kind: pronunciation, text: "Читается «эке́рка»: I после K только смягчает его, отдельного звука «и» нет. Ударение на втором слоге." }
