# review
id: wysokosc
format: 2
lemma: "wysokość"
rank: 966
pos: noun
pron: { cyr: "высо́кошьць" }
senses:
  - id: height
    ru: "высота"
    examples:
      - pl: "Jaką wysokość na Fuji?"
        ru: "Какая высота горы Фудзи?"
        source: { kind: tatoeba, id: 361783 }
      - pl: "Jaką wysokość ma Mount Everest?"
        ru: "Какова высота горы Эверест?"
        source: { kind: tatoeba, id: 12466810 }
      - pl: "Jaka jest wysokość tego płaskowyżu?"
        ru: "Какова высота этого плато?"
        source: { kind: tatoeba, id: 351881 }
  - id: fear
    ru: "lęk wysokości — боязнь высоты"
    examples:
      - pl: "Mam lęk wysokości."
        ru: "У меня боязнь высоты."
        source: { kind: tatoeba, id: 12564186 }
      - pl: "Boję się wysokości."
        ru: "Я боюсь высоты."
        source: { kind: translated, id: 2814762 }
      - pl: "Jakiej wysokości jest Empire State Building?"
        ru: "Какова высота Эмпайр Стейт Билдинг?"
        source: { kind: tatoeba, id: 3460692 }
  - id: majesty
    ru: "Wasza Wysokość — Ваше Высочество"
    note: "Обращение к особам королевской крови, как и в русском."
    examples:
      - pl: "Wasza Wysokość, goście czekają."
        ru: "Ваше Высочество, гости ждут."
        source: { kind: authored }
      - pl: "Jego Wysokość wydał rozkaz."
        ru: "Его Высочество отдал приказ."
        source: { kind: authored }
      - pl: "Czuję się nieswojo na tak dużych wysokościach."
        ru: "Я чувствую себя неуютно на такой большой высоте."
        source: { kind: translated, id: 4944011 }
notes:
  - { kind: usage, text: "Вопрос о высоте строится через винительный: Jaką wysokość ma Mount Everest? «Какова высота Эвереста?». Можно и Jak wysoki jest…" }
  - { kind: usage, text: "lęk wysokości — «боязнь высоты», родительный падеж. А bać się wysokości «бояться высоты» — тоже родительный, как и в русском." }
  - { kind: usage, text: "Wasza Wysokość — «Ваше Высочество», обращение к королевским особам. Глагол при нём стоит в третьем лице: Jego Wysokość wydał rozkaz." }
  - { kind: usage, text: "Слово образовано от wysoki «высокий» суффиксом -ość, как и русское «высота» от «высокий». Множественное wysokości значит «высоты» в географическом смысле." }
collocations:
  - { pl: "lęk wysokości", ru: "боязнь высоты" }
  - { pl: "na wysokości", ru: "на высоте" }
  - { pl: "Wasza Wysokość", ru: "Ваше Высочество" }
  - { pl: "jaką wysokość ma", ru: "какова высота" }
family:
  - { pl: "wysoki", ru: "высокий", relation: root, id: wysoki }
  - { pl: "wysoko", ru: "высоко", relation: derived }
  - { pl: "wzniesienie", ru: "возвышенность", relation: derived }
etymology: "От wysoki «высокий» с суффиксом -ość. Русское «высота» собрано от того же прилагательного, так что слова соответствуют друг другу буквально."
memory: "wysokość — «высота». Запомните lęk wysokości «боязнь высоты» с родительным падежом и вопрос Jaką wysokość ma…? А Wasza Wysokość — это «Ваше Высочество», и глагол при нём идёт в третьем лице."
