# review
id: gorzki
format: 2
lemma: "gorzki"
rank: 2490
pos: adj
pron: { cyr: "го́шки" }
senses:
  - id: bitter
    ru: "горький (на вкус)"
    examples:
      - pl: "Lekarstwo ma gorzki smak."
        ru: "У лекарства горький вкус."
        source: { kind: tatoeba, id: 4886687 }
      - pl: "To lekarstwo jest gorzkie w smaku."
        ru: "Это лекарство горькое на вкус."
        source: { kind: tatoeba, id: 722341 }
      - pl: "Kawa jest gorzka."
        ru: "Кофе горький."
        source: { kind: translated, id: 1666912 }
  - id: bitter-fig
    ru: "горький (о разочаровании)"
    examples:
      - pl: "Oblany egzamin był dla niego gorzkim rozczarowaniem."
        ru: "Проваленный экзамен был для него горьким разочарованием."
        source: { kind: translated, id: 361887 }
      - pl: "Pijam gorzką kawę."
        ru: "Я пью горький кофе."
        source: { kind: translated, id: 3750057 }
notes:
  - { kind: false-friend, text: "Русское «горький» и польское gorzki — одно слово; rz отвечает русскому р мягкому. Родня — gorycz «горечь», которое уже есть в словаре, и gorący «горячий»." }
  - { kind: government, text: "Обычное прилагательное; наречие — gorzko, сравнительная степень — gorzki, bardziej gorzki." }
  - { kind: usage, text: "Gorzka kawa значит «кофе без сахара» — это обычный способ заказать несладкий кофе." }
  - { kind: usage, text: "Переносно — о разочаровании и упрёке: gorzkie słowa «горькие слова»." }
collocations:
  - { pl: "gorzka kawa", ru: "кофе без сахара" }
  - { pl: "gorzkie rozczarowanie", ru: "горькое разочарование" }
etymology: "Праславянское *gorьkъ; русское «горький» — то же слово, родня gorycz и gorący."
memory: "gorzki — «горький». Gorzka kawa значит «кофе без сахара» — так и заказывают. Родня — gorycz «горечь»."
