# review
id: fortuna
format: 2
lemma: "fortuna"
rank: 3170
pos: noun
pron: { cyr: "форту́на" }
senses:
  - id: luck
    ru: "фортуна, удача, судьба"
    examples:
      - pl: "Fortuna odwróciła się od nich w jednym tygodniu."
        ru: "Фортуна отвернулась от них за одну неделю."
        source: { kind: authored }
      - pl: "Bez fortuny sam talent tu nie wystarczy."
        ru: "Без удачи одного таланта здесь не хватит."
        source: { kind: authored }
      - pl: "O fortunie mówił jak o osobie, która go nie lubi."
        ru: "О фортуне он говорил как о человеке, который его не любит."
        source: { kind: authored }
  - id: wealth
    ru: "состояние, богатство"
    examples:
      - pl: "Zbił fortunę na handlu drewnem."
        ru: "Он сколотил состояние на торговле лесом."
        source: { kind: authored }
      - pl: "Fortuny rodzinne rozeszły się w dwóch pokoleniach."
        ru: "Семейные состояния разошлись в два поколения."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Русская «фортуна» книжна и означает только удачу, а польская FORTUNA, кроме удачи, значит ещё и состояние, крупные деньги: ZBIĆ FORTUNĘ «сколотить состояние», STRACIĆ FORTUNĘ, TO KOSZTUJE FORTUNĘ «это стоит целое состояние». Последнее выражение обиходно и частотно, и русский передаёт его через «состояние» или «кучу денег», но не через «фортуну». Поэтому при переводе надо решать по контексту: если речь о деньгах — «состояние», если о судьбе — «фортуна» или «удача»." }
  - { kind: usage, text: "В значении удачи слово слегка книжно и в живой речи уступает SZCZĘŚCIE «счастье, удача» и SZCZĘŚCIU в оборотах: MIEĆ SZCZĘŚCIE «иметь удачу». FORTUNA держится в устойчивых выражениях: FORTUNA KOŁEM SIĘ TOCZY «фортуна переменчива», буквально «фортуна катится колесом», FORTUNA SPRZYJA ODWAŻNYM. В значении состояния слово совершенно обиходно, и именно там его встретишь чаще всего: KOSZTOWAŁO FORTUNĘ. Прилагательное FORTUNNY употребляется редко, зато NIEFORTUNNY «неудачный, неловкий» частотно: NIEFORTUNNA UWAGA." }
  - { kind: pronunciation, text: "Читается «форту́на», ударение на предпоследнем слоге, как и в русском. Все гласные открытые, без редукции: первое O звучит полным «о», а не «а», как было бы в русском безударном слоге. В дательном и местном падеже FORTUNIE буква N смягчается перед -IE: «форту́не». Слово для русского лёгкое, и перестраивать нужно только безударное O в первом слоге." }
  - { kind: government, text: "Женский род на -A, склонение правильное. Винительный на -Ę: ZBIŁ FORTUNĘ. На чём заработано — предлог NA с местным: FORTUNA NA HANDLU, ZBIĆ FORTUNĘ NA CZYMŚ. Кому благоволит — глагол SPRZYJAĆ с дательным: FORTUNA SPRZYJA ODWAŻNYM «фортуна благоволит смелым». При отрицании винительный уходит в родительный: NIE ZBIŁ FORTUNY. В значении цены слово стоит в винительном без предлога: KOSZTUJE FORTUNĘ." }
collocations:
  - { pl: "zbić fortunę", ru: "сколотить состояние" }
  - { pl: "kosztować fortunę", ru: "стоить целое состояние" }
  - { pl: "fortuna kołem się toczy", ru: "фортуна переменчива" }
family:
  - { pl: "szczescie", ru: "счастье; удача", relation: root, id: szczescie }
  - { pl: "majatek", ru: "имущество, состояние", relation: root, id: majatek }
  - { pl: "niefortunny", ru: "неудачный, неловкий", relation: derived }
etymology: "Из латинского FORTUNA, имени богини судьбы, от FORS «случай, жребий» и далее от FERRE «нести». То есть фортуна буквально «то, что принесено», доля, выпавшая человеку, и римская богиня изображалась с колесом — отсюда и польская поговорка FORTUNA KOŁEM SIĘ TOCZY. Значение «состояние, богатство» развилось в западных языках через идею дарованного судьбой имущества, и польский взял его вместе с латинским словом, а русский — нет, оставив за «фортуной» только судьбу. Тот же корень FERRE виден в словах TRANSFER и OFERTA, и в русском «оферте»."
memory: "Шире русской «фортуны»: кроме удачи значит состояние, деньги — zbić fortunę «сколотить состояние», to kosztuje fortunę «это стоит целое состояние». В значении удачи книжно, и в живой речи скажут szczęście. Поговорка fortuna kołem się toczy идёт от колеса римской богини. Частотно производное niefortunny «неудачный»."
idioms:
  - { pl: "fortuna kołem się toczy", ru: "фортуна переменчива" }
  - { pl: "kosztować fortunę", ru: "стоить целое состояние" }
