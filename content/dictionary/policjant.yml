# review
id: policjant
format: 2
lemma: "policjant"
rank: 1016
pos: noun
pron: { cyr: "поли́цьянт" }
senses:
  - id: officer
    ru: "полицейский"
    examples:
      - pl: "Przyszedł do mnie policjant."
        ru: "Ко мне пришёл полицейский."
        source: { kind: translated, id: 908018 }
      - pl: "Przyszedł policjant."
        ru: "Пришёл полицейский."
        source: { kind: translated, id: 548434 }
      - pl: "Widzisz tam jakiegoś policjanta?"
        ru: "Видишь там какого-нибудь полицейского?"
        source: { kind: translated, id: 352689 }
  - id: be-officer
    ru: "być policjantem — быть полицейским"
    examples:
      - pl: "Jestem policjantem."
        ru: "Я полицейский."
        source: { kind: translated, id: 567089 }
      - pl: "Jestem policjantem z zawodu."
        ru: "Я по профессии полицейский."
        source: { kind: translated, id: 525641 }
      - pl: "Jesteś policjantem?"
        ru: "Ты полицейский?"
        source: { kind: translated, id: 8620963 }
  - id: plural
    ru: "policjanci — полицейские"
    examples:
      - pl: "Anglia to kraj, w którym policjanci nie noszą broni."
        ru: "Англия — страна, где полицейские не носят оружия."
        source: { kind: translated, id: 956708 }
      - pl: "Policjanci wkroczyli do baru."
        ru: "Полицейские вошли в бар."
        source: { kind: translated, id: 352665 }
      - pl: "Policjanci aresztowali włamywacza."
        ru: "Полицейские задержали взломщика."
        source: { kind: translated, id: 613032 }
notes:
  - { kind: usage, text: "Профессию называют творительным падежом: jestem policjantem «я полицейский», został policjantem «он стал полицейским». Русский берёт именительный, и это частая ошибка." }
  - { kind: usage, text: "Множественное мужско-личное — policjanci «полицейские», родительный policjantów." }
  - { kind: usage, text: "Женская форма — policjantka. Разговорное policjant w spódnicy «полицейский в юбке» — о женщине-полицейском." }
  - { kind: usage, text: "Образовано от policja «полиция» суффиксом -ant, как и русское «полицейский» от «полиции»." }
collocations:
  - { pl: "jestem policjantem", ru: "я полицейский" }
  - { pl: "zostać policjantem", ru: "стать полицейским" }
  - { pl: "zapytać policjanta", ru: "спросить полицейского" }
  - { pl: "policjanci aresztowali", ru: "полицейские задержали" }
family:
  - { pl: "policja", ru: "полиция", relation: root, id: policja }
  - { pl: "policjantka", ru: "женщина-полицейский", relation: derived }
etymology: "От policja «полиция» с суффиксом -ant; само слово через латынь из греческого πολιτεία «государственное устройство». Русское «полицейский» построено от того же заимствования."
memory: "policjant — «полицейский». Главное — падеж профессии: jestem policjantem, творительный, а не именительный. И множественное мужско-личное policjanci."
idioms:
  - { pl: "jestem policjantem", ru: "я полицейский" }
  - { pl: "zostać policjantem", ru: "стать полицейским" }
  - { pl: "policjant w spódnicy", ru: "полицейский в юбке" }
