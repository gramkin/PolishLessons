# review
id: przebrac
format: 2
lemma: "przebrać"
rank: 1986
pos: verb
pron: { cyr: "пшэ́браць" }
senses:
  - id: change-clothes
    ru: "переодеть(ся) — przebrać się"
    examples:
      - pl: "Przebierz się, jesteś cały mokry."
        ru: "Переоденься, ты весь мокрый."
        source: { kind: authored }
      - pl: "Przebrała dziecko w suche ubranie."
        ru: "Она переодела ребёнка в сухую одежду."
        source: { kind: authored }
      - pl: "Przebrany za Mikołaja rozdawał prezenty."
        ru: "Переодетый Дедом Морозом, он раздавал подарки."
        source: { kind: authored }
  - id: sort-out
    ru: "перебрать (отобрать, рассортировать)"
    examples:
      - pl: "Przebrali grzyby przed suszeniem."
        ru: "Они перебрали грибы перед сушкой."
        source: { kind: authored }
      - pl: "Przebrano cały worek ziemniaków."
        ru: "Перебрали целый мешок картошки."
        source: { kind: authored }
  - id: overstep
    ru: "przebrać miarę — перейти меру, перегнуть палку"
    examples:
      - pl: "Tym razem przebrał miarę."
        ru: "На этот раз он перегнул палку."
        source: { kind: authored }
      - pl: "Przebrała się miara cierpliwości."
        ru: "Чаша терпения переполнилась."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ГЛАВНАЯ ЛОВУШКА, И ОНА СЕРЬЁЗНАЯ. Польское przebrać się значит «ПЕРЕОДЕТЬСЯ», а вовсе не «перебраться». Русское «перебраться» (переехать) по-польски будет przeprowadzić się. Так что Przebierz się! — это «Переоденься!», а не приглашение к переезду. Второе значение, «перебрать, рассортировать», с русским совпадает: przebrać grzyby." }
  - { kind: pronunciation, text: "ЧЕРЕДОВАНИЕ В ОСНОВЕ, ЗНАКОМОЕ ПО РУССКОМУ. Неопределённая форма przebrać, но настоящее-будущее przebiorę, przebierzesz, przebierze — основа bra- переходит в bior-/bierz-. Русский делает ровно то же: «брать», но «беру, берёшь». Запомнив одну пару, вы получаете обе." }
  - { kind: government, text: "Переодевают ВО что — предлог w с ВИНИТЕЛЬНЫМ: przebrać dziecko w suche ubranie, przebrać się w garnitur. Переодеться КЕМ-ТО передаётся через za с винительным: przebrać się ZA Mikołaja «переодеться Дедом Морозом». Русский тут берёт творительный, так что предлог za придётся запомнить." }
  - { kind: usage, text: "Вид совершенный, несовершенная пара — przebierać. У неё есть и своё значение: przebierać nogami «перебирать ногами», przebierać w czymś «привередничать, перебирать». Существительное przebranie значит «маскарадный костюм»: bal przebierańców — «костюмированный бал»." }
collocations:
  - { pl: "przebrać się", ru: "переодеться" }
  - { pl: "przebrać miarę", ru: "перегнуть палку" }
  - { pl: "przebrać się za kogoś", ru: "переодеться кем-л." }
family:
  - { pl: "brać", ru: "брать", relation: root, id: brac }
  - { pl: "przebierać", ru: "переодевать; перебирать", relation: aspect }
  - { pl: "ubrać", ru: "одеть", relation: derived, id: ubrac }
etymology: "Приставка prze- плюс brać «брать» — те же части, что в русском «пере-брать», и тот же общеславянский корень с чередованием bra-/bior-, как в русском «брать/беру». Значение «переодеться» выросло из «перебрать на себе одежду». Отсюда przebranie «маскарадный костюм» и przebieralnia «примерочная, раздевалка»."
memory: "przebrać się — «ПЕРЕОДЕТЬСЯ», не «перебраться»: переезд будет przeprowadzić się. Основа чередуется как в русском: przebrać, но przebiorę, przebierzesz — ср. «брать, беру, берёшь»."
idioms:
  - { pl: "przebrać miarę", ru: "перегнуть палку" }
  - { pl: "przebrać się za kogoś", ru: "нарядиться кем-л." }
