notes:
  - { kind: false-friend, text: "Русский «посад» — слово историческое и мужского рода: торгово-ремесленная часть города за стенами крепости. Польская POSADA — женского рода и означает должность, место службы. Общего у них только корень: оба от глагола «садить», и оба называют место, где кого-то или что-то посадили, но один раз это поселение, а другой — служебное кресло. Поэтому переводить POSADA как «посад» нельзя ни в каком контексте. Отдельно стоит и русская «посадка»: по-польски это SADZENIE для растений, LĄDOWANIE для самолёта и WSIADANIE для пассажиров." }
  - { kind: usage, text: "Десять форм, женский род. Дательный и местный единственного — POSADZIE, где конечное D основы переходит в DZI перед окончанием -E: та же мена, что в WADZIE и REKORDZIE. Родительный множественного — POSAD, с нулевым окончанием. Родительный единственного и именительный множественного — одна форма POSADY. Глаголы вокруг слова устойчивы: DOSTAĆ POSADĘ «получить место», STRACIĆ POSADĘ «потерять место», OBJĄĆ POSADĘ «вступить в должность», SZUKAĆ POSADY в родительном." }
  - { kind: pronunciation, text: "Читается «поса́да», три слога, ударение на втором — то же место, что в русском «посаде», так что перестраиваться не нужно. Буква S звучит как «с», без озвончения между гласными: это важно, потому что русский в таком положении часто произносит «з». В форме POSADZIE сочетание DZI читается как мягкое «дзи»: «поса́дзе». В форме POSADĘ конечное Ę звучит как чистое «э»: «поса́дэ». В форме POSAD конечное D оглушается в «т»: «посат»." }
  - { kind: register, text: "Слово слегка старомодное и книжное. В современной речи о работе чаще скажут PRACA, о штатной единице ETAT, о должности в иерархии STANOWISKO. POSADA сохраняет оттенок надёжного, пожизненного места — того, что русский назвал бы «тёплым местечком» без иронии, — и потому часто встречается в прозе девятнадцатого века и в разговоре старшего поколения. Устойчивое POSADA PAŃSTWOWA «государственная должность» несёт именно этот смысл. Звательная форма POSADO в живой речи не употребляется." }
