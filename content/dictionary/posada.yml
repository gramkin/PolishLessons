etymology: "От глагола POSADZIĆ «посадить», праславянское *saditi, то же, что в русском «садить» и «сажать». Исходное значение — место, куда посадили, и дальше язык выбирал, какое именно место назвать этим словом. Польский пошёл к службе: посадить на место значило дать должность, и POSADA стала креслом в канцелярии. Русский пошёл к поселению: «посад» — это то, что посажено вокруг крепости, пригород с торгом и ремеслом, откуда «посадский человек». Один и тот же образ, две разные стороны жизни. Сам корень виден в обоих языках повсюду: SAD «сад», SADZIĆ, OSADA «посёлок», и русские «сад», «усадьба», «осадок»."
memory: "Корень общий с русским «посадом» — оба от «садить», место, куда посадили, — но посажены разные вещи: польская posada это должность, служебное кресло, а русский «посад» — пригород за стенами. Слово слегка старомодное: сегодня скажут praca, etat, stanowisko. Дательный и местный posadzie с меной d→dzi, как wadzie и rekordzie. Устойчиво: dostać posadę, stracić posadę."
idioms:
  - { pl: "stracić posadę", ru: "потерять место" }
