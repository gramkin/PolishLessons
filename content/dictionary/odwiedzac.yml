# review
id: odwiedzac
format: 2
lemma: "odwiedzać"
rank: 2403
pos: verb
pron: { cyr: "одвє́дзаць" }
senses:
  - id: visit-people
    ru: "навещать, посещать (кого-л.)"
    examples:
      - pl: "Odwiedzam babcię co tydzień."
        ru: "Я навещаю бабушку каждую неделю."
        source: { kind: authored }
      - pl: "Odwiedzali chorego codziennie."
        ru: "Они навещали больного ежедневно."
        source: { kind: authored }
  - id: call-on
    ru: "заходить, бывать у кого-л."
    examples:
      - pl: "Odwiedzaj nas częściej."
        ru: "Навещай нас чаще."
        source: { kind: authored }
      - pl: "Rzadko odwiedza rodzinę na wsi."
        ru: "Он редко бывает у родни в деревне."
        source: { kind: authored }
  - id: frequented
    ru: "посещаемый (о месте)"
    examples:
      - pl: "Muzeum jest chętnie odwiedzane przez turystów."
        ru: "Музей охотно посещают туристы."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "СЛОВО ПОХОЖЕ НА «ОТВЕДАТЬ», НО ЗНАЧИТ СОВСЕМ ДРУГОЕ. Odwiedzać — это «навещать, посещать», а попробовать на вкус будет SKOSZTOWAĆ или SPRÓBOWAĆ. Сходство тут чисто внешнее, и опираться на него нельзя: odwiedzić ciotkę значит зайти к тёте, а не попробовать её стряпню." }
  - { kind: usage, text: "ПОЛЬСКИЙ ДЕЛИТ ТО, ЧТО РУССКИЙ НАЗЫВАЕТ ОДНИМ СЛОВОМ. ODWIEDZAĆ — о людях: odwiedzam babcię, odwiedzam chorego. ZWIEDZAĆ — о местах, с осмотром: zwiedzamy muzeum, zwiedzamy Kraków. Русское «посещать» покрывает оба случая, поэтому выбирать приходится по тому, кого или что навещаешь." }
  - { kind: usage, text: "Существительное от этого глагола — ODWIEDZINY, и оно существует только во множественном числе, как przeprosiny и finanse: przyjść w odwiedziny «прийти в гости». Вид несовершенный: есть odwiedzając и odwiedzający, формы на -wszy нет, совершенная пара — odwiedzić, с повелительным odwiedź." }
collocations:
  - { pl: "odwiedzać chorego", ru: "навещать больного" }
  - { pl: "przyjść w odwiedziny", ru: "прийти в гости" }
  - { pl: "często odwiedzany", ru: "часто посещаемый" }
family:
  - { pl: "odwiedzić", ru: "навестить (сов.)", relation: aspect, id: odwiedzic }
  - { pl: "zwiedzać", ru: "осматривать, посещать (места)", relation: root }
  - { pl: "wiedzieć", ru: "знать", relation: root, id: wiedziec }
etymology: "Приставка od- и корень wiedz-, из праславянского *věděti «знать, ведать», родственного widzieć «видеть». Русское «навещать» построено на том же корне через «весть»: оба языка вывели посещение из идеи «подать весть, узнать». Отсюда odwiedziny и wiadomość «известие»."
memory: "odwiedzać — «навещать», и это не «отведать»: попробовать будет skosztować. Людей odwiedzamy, а места zwiedzamy — русское «посещать» тут делится надвое. Существительное только во множественном: odwiedziny."
idioms:
  - { pl: "przyjść w odwiedziny", ru: "прийти в гости" }
  - { pl: "odwiedzać kogoś w szpitalu", ru: "навещать кого-л. в больнице" }
