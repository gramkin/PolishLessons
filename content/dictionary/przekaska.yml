notes:
  - { kind: false-friend, text: "Слово собрано как русская «закуска», только приставка другая. У нас «за-кусить», у поляков PRZE-KĄSIĆ, и от этого глагола идёт PRZEKĄSKA. Корень же общий: KĄSAĆ значит «кусать». Здесь видно и правило носовых — где поляк пишет Ą, у нас стоит У: KĄSAĆ при «кусать», KĘS при «кусе». Так что закуска, кусок и укус — одна семья в двух языках." }
  - { kind: usage, text: "Десять форм, женский род. В дательном и местном падежах K переходит в C: PRZEKĄSKA, но O PRZEKĄSCE. В родительном множественного появляется беглое E: PRZEKĄSEK. Носовой Ą держится во всех формах. Множественное PRZEKĄSKI употребляется едва ли не чаще единственного, потому что закуски обычно подают во множестве." }
  - { kind: government, text: "На закуску — NA PRZEKĄSKĘ, предлог NA с винительным, как и по-русски. Закуски к пиву — PRZEKĄSKI DO PIWA, предлог DO с родительным, где русский скажет «к пиву», с дательным. Это обычное расхождение: польское DO там, где у нас «к». Без закуски — BEZ PRZEKĄSKI, родительный после BEZ." }
  - { kind: pronunciation, text: "Читается «пшэко́нска», три слога, ударение на предпоследнем. Сочетание PRZ даёт «пш», и никакого «р» в нём не слышно. Буква E после него даёт «э». Носовой Ą перед S даёт «он», поэтому середина слова это «кон». В форме PRZEKĄSCE сочетание SC даёт «сц»: «пшэко́нсце»." }
  - { kind: register, text: "Слово нейтральное и застольное. В меню стоит ZIMNE PRZEKĄSKI «холодные закуски» и PRZEKĄSKI GORĄCE «горячие закуски», и эти два заголовка стоит узнавать с первого взгляда. В разговоре PRZEKĄSKA значит просто «перекус»: ZROBIĘ SOBIE PRZEKĄSKĘ значит «я перекушу». Глагол PRZEKĄSIĆ живой и частый." }
collocations:
  - { pl: "na przekąskę", ru: "на закуску" }
  - { pl: "lekka przekąska", ru: "лёгкая закуска" }
