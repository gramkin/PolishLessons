family:
  - { pl: "kasac", ru: "кусать", relation: root }
  - { pl: "kes", ru: "кусок", relation: derived }
  - { pl: "przekasic", ru: "перекусить", relation: root }
etymology: "От глагола PRZEKĄSIĆ «перекусить», а тот — от KĄSAĆ «кусать», слова праславянского с носовым. Русская «закуска» собрана из того же корня и тем же способом, только приставка у нас «за-», а у поляков PRZE-. Правило носовых здесь работает дважды: KĄSAĆ отвечает «кусать», а KĘS — «кусу» и «куску». Значит, и закуска, и кусок, и укус выросли из одного корня в обоих языках."
memory: "Закуска, от przekasic «перекусить» — то же построение, что у нас, только приставка prze- вместо «за-». Корень kasac значит «кусать». Читается «пшэко́нска», где prz даёт «пш» без всякого «р», а a с хвостиком перед s — «он». В меню ищите заголовок zimne przekaski. И запомните: przekaski do piwa, с предлогом do там, где по-русски «к»."
idioms:
  - { pl: "zimne przekąski", ru: "холодные закуски" }
