# review
id: przednowek
format: 2
lemma: "przednówek"
rank: 5930
pos: noun
pron: { cyr: "пшэдну́вэк" }
senses:
  - id: lean-season
    ru: "голодная пора перед новым урожаем, весенняя бескормица"
    note: "в старой деревне: от конца зимних запасов до первых жатв"
    examples:
      - pl: "Przednówek był dla chłopów najtrudniejszą porą roku."
        ru: "Пора перед новым урожаем была для крестьян самым тяжёлым временем года."
        source: { kind: authored }
      - pl: "Ziemniaków ledwo starczyło do przednówka."
        ru: "Картошки едва хватило до голодной весны."
        source: { kind: authored }
      - pl: "Podczas przednówka jedzono zupę z pokrzywy."
        ru: "В голодную пору ели суп из крапивы."
        source: { kind: authored }
      - pl: "Na przednówku jedzono to, co rosło na łąkach."
        ru: "В голодную весну ели то, что росло на лугах."
        source: { kind: authored }
      - pl: "Przed przednówkiem trzeba było oszczędzać każde ziarno."
        ru: "Перед голодной порой приходилось беречь каждое зерно."
        source: { kind: authored }
notes:
  - { kind: register, text: "Слово историческое и деревенское: так называли конец весны и начало лета, когда прошлогодние запасы кончились, а новый урожай ещё не созрел. Сегодня встречается в рассказах о старой деревне, в литературе и в истории. Одного русского слова нет — переводят «голодная весна», «бескормица», «время перед новым урожаем»." }
  - { kind: usage, text: "Мужской род. E беглое: PRZEDNÓWEK — PRZEDNÓWKA, PRZEDNÓWKIEM. Ó сохраняется во всех формах. Чаще всего встречается в обороте NA PRZEDNÓWKU «в голодную пору, перед урожаем»; множественное число — о голодных вёснах разных лет." }
  - { kind: pronunciation, text: "Читается «пшэдну́вэк»: PRZ в начале — «пш», Ó — «у», ударение на предпоследнем слоге NÓ." }
collocations:
  - { pl: "na przednówku", ru: "в голодную пору перед урожаем" }
  - { pl: "głodny przednówek", ru: "голодная весна" }
  - { pl: "przetrwać przednówek", ru: "пережить бескормицу" }
family:
  - { pl: "nowy", ru: "новый", relation: root, id: nowy }
  - { pl: "przednówkowy", ru: "относящийся к голодной поре", relation: derived }
synonyms:
  - "przednowie"
  - "przedżniwek"
etymology: "Образовано от PRZED «перед» и корня NOW- «новый»: время перед новым урожаем."
memory: "Przednówek — «перед новым»: перед новым хлебом, когда старый уже съеден. Na przednówku — в голодную весну."
idioms:
  - { pl: "na przednówku", ru: "в голодную пору; когда всё на исходе" }
