# review
id: indyk
format: 2
lemma: "indyk"
rank: 3897
pos: noun
pron: { cyr: "и́ндык" }
senses:
  - id: turkey-bird
    ru: "индюк"
    examples:
      - pl: "Indyk głośno gulgotał."
        ru: "Индюк громко болботал."
        source: { kind: authored }
      - pl: "Na podwórku chodziły kury i indyk."
        ru: "По двору ходили куры и индюк."
        source: { kind: authored }
      - pl: "Był nadęty jak indyk."
        ru: "Он был надут, как индюк."
        source: { kind: authored }
  - id: turkey-meat
    ru: "индейка (мясо)"
    examples:
      - pl: "Na kolację jest indyk z warzywami."
        ru: "На ужин индейка с овощами."
        source: { kind: authored }
      - pl: "Dietetyk poleca mięso z indyka."
        ru: "Диетолог рекомендует мясо индейки."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "INDYK — и «индюк», и «индейка» как блюдо: PIECZONY INDYK, «запечённая индейка». Самка — INDYCZKA. Русскому приходится выбирать между двумя словами, польскому достаточно одного." }
  - { kind: usage, text: "Десять форм, мужской род, одушевлённое: винительный равен родительному, UPIEC INDYKA. Во множественном — INDYKI. Творительный — INDYKIEM: K перед I смягчается." }
  - { kind: government, text: "Из индейки — Z INDYKA: PIERŚ Z INDYKA, «грудка индейки», KANAPKA Z INDYKIEM, «бутерброд с индейкой», где Z требует творительного." }
  - { kind: pronunciation, text: "Читается «и́ндык», ударение на первом слоге. Y — «ы»." }
collocations:
  - { pl: "pieczony indyk", ru: "запечённая индейка" }
  - { pl: "pierś z indyka", ru: "грудка индейки" }
  - { pl: "nadęty jak indyk", ru: "надутый как индюк" }
family:
  - { pl: "indyczka", ru: "индюшка (самка)", relation: derived }
  - { pl: "indyczy", ru: "индюшачий", relation: derived }
  - { pl: "indyczek", ru: "индюшонок", relation: derived }
etymology: "От названия Индии: птицу привезли из Америки, которую первые мореплаватели считали Индией. Русское «индюк» названо по той же ошибке."
memory: "Indyk — индюк и индейка (мясо). Читается «и́ндык». Pierś z indyka — грудка индейки. Nadęty jak indyk — надутый как индюк."
idioms:
  - { pl: "myślał indyk o niedzieli, a w sobotę łeb mu ścięli", ru: "не говори «гоп», пока не перепрыгнешь" }
