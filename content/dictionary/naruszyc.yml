etymology: "Из приставки NA- и корня *rušiti, того же, что в русском «рушить», но польский развил этот корень через значение движения: RUSZYĆ значит «двинуть, тронуть», RUCH — «движение», RUSZAĆ SIĘ — «двигаться». Поэтому NARUSZYĆ для поляка — «тронуть то, чего трогать не следовало», а для русского «нарушить» — «надломить, разрушить»: один корень, две разные метафоры одного юридического понятия. Отсюда и расхождение в объёме: польское NARUSZYĆ не покрывает физического разрушения, которое выражают ZBURZYĆ и ZNISZCZYĆ. Существительное NARUSZENIE образовано по модели на -ENIE, отвечающей русскому -ЕНИЕ буквально: NARUSZENIE и «нарушение», ZNISZCZENIE и «уничтожение». Прилагательное NIENARUSZONY «нетронутый» сохраняет исходный образ прикосновения яснее всего."
memory: "Корень как в русском «рушить», но польский повёл его через движение: ruszyć «тронуть, двинуть», ruch «движение». Поэтому naruszyć буквально «тронуть то, чего нельзя», а русское «нарушить» — «надломить». Следствие: naruszyć не значит «разрушить» — для этого zburzyć, zniszczyć. Существительное naruszenie — главный юридический термин (naruszenie przepisów), требует родительного, как в русском. Прилагательное nienaruszony значит «нетронутый». Совершенный вид, 53 формы: деепричастие только прошедшее, naruszywszy."
