notes:
  - { kind: false-friend, text: "Польское и русское слово означают одно, но собраны из разных образов, и это стоит заметить. Польское NARUSZYĆ происходит от RUSZYĆ «двинуть, тронуть», отсюда RUCH «движение», PORUSZYĆ «затронуть», и буквальный смысл — «тронуть, сдвинуть с места». Русское «нарушить» идёт от «рушить», то есть от разрушения. Поэтому поляк нарушение понимает как прикосновение к тому, чего трогать нельзя, а русский — как поломку. Практическое следствие: NARUSZYĆ не значит «разрушить». Разрушить дом это ZBURZYĆ или ZNISZCZYĆ, и NARUSZYĆ DOM прозвучит как «повредить, затронуть конструкцию». Прилагательное NIENARUSZONY значит «нетронутый, целый»." }
  - { kind: usage, text: "Совершенный вид, переходный, пятьдесят три формы: сорок две от глагола, одна у деепричастия прошедшего времени NARUSZYWSZY и одиннадцать у страдательного причастия NARUSZONY. Деепричастия на -ĄC нет, потому что у совершенного вида его не бывает. Несовершенная пара — NARUSZAĆ. Существительное NARUSZENIE — основной юридический термин: NARUSZENIE PRZEPISÓW «нарушение правил», NARUSZENIE PRAW AUTORSKICH «нарушение авторских прав», и в судебных текстах оно встречается чаще самого глагола. Причастие NARUSZONY употребляется и о физических предметах: NARUSZONA PLOMBA «повреждённая пломба»." }
  - { kind: government, text: "Переходный: нарушить что — винительный без предлога, NARUSZYĆ PRZEPISY, UMOWĘ, CISZĘ, GRANICĘ. Русское управление то же, винительный, так что здесь ошибиться трудно. Отрицание переводит дополнение в родительный: NIE NARUSZYŁ ŻADNEGO PRZEPISU. Существительное NARUSZENIE требует родительного: NARUSZENIE PRZEPISÓW, NARUSZENIE PRAWA, как и русское «нарушение правил». Устойчивое оборот Z NARUSZENIEM CZEGOŚ значит «с нарушением чего-то» и ставится в официальных текстах: DZIAŁAŁ Z NARUSZENIEM PRAWA." }
  - { kind: pronunciation, text: "Читается «нару́шыць», три слога, ударение на предпоследнем. Буква A в первом слоге звучит отчётливо, без редукции: «на», а не «нъ». Буквосочетание SZ даёт твёрдое «ш», буква Y — «ы», поэтому второй и третий слоги звучат «ру-шыць». Конечное Ć — мягкое «ць». В страдательном причастии NARUSZONY на месте Y стоит O: «нарушо́ны». В деепричастии NARUSZYWSZY четыре слога, ударение на предпоследнем: «нарушы́фшы», где W перед S оглушается в «ф»." }
