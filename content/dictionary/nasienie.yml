notes:
  - { kind: false-friend, text: "NASIENIE — «семя», но множественное у него особое: NASIONA, «семена», от другой основы. Семечки для еды — PESTKI, а семена для посадки — NASIONA. В медицине NASIENIE — «сперма»." }
  - { kind: usage, text: "Средний род. В единственном — NASIENIE, NASIENIA, NASIENIU, NASIENIEM; во множественном основа NASION-: NASIONA, NASION, NASIONAMI. Это смешанная парадигма." }
  - { kind: government, text: "Сеять семена — SIAĆ NASIONA, винительный. Пачка семян — PACZKA NASION, родительный. Из семечка — Z NASIENIA." }
  - { kind: pronunciation, text: "Читается «насе́не»: SIE — мягкое «се», NIE — «не». Ударение на предпоследнем слоге. NASIONA — «насьо́на»." }
