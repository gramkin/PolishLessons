# review
id: slub
format: 2
lemma: "ślub"
rank: 611
pos: noun
pron: { cyr: "сьлюп" }
senses:
  - id: wedding
    ru: "венчание, бракосочетание, свадьба"
    note: "brać ślub «венчаться, вступать в брак» — устойчивый оборот."
    examples:
      - pl: "Kiedy jest jej ślub?"
        ru: "Когда будет её бракосочетание?"
        source: { kind: tatoeba, id: 904476 }
      - pl: "Maria i Tom wzięli ślub w kościele niedaleko stąd."
        ru: "Мэри и Том поженились в церкви недалеко отсюда."
        source: { kind: tatoeba, id: 3679915 }
      - pl: "Wzięli ślub."
        ru: "Они поженились."
        source: { kind: translated, id: 10606320 }
  - id: take-vows
    ru: "wziąć ślub — пожениться, вступить в брак"
    note: "Буквально «взять венчание»; русского дословного соответствия нет."
    examples:
      - pl: "Nie wzięliśmy ślubu."
        ru: "Мы не поженились."
        source: { kind: translated, id: 4124187 }
      - pl: "Ona chce zaczekać do ślubu."
        ru: "Она хочет подождать до свадьбы."
        source: { kind: translated, id: 5508855 }
      - pl: "Rodzice zmusili mnie do ślubu."
        ru: "Родители принудили меня к браку."
        source: { kind: translated, id: 10503894 }
  - id: after-wedding
    ru: "po ślubie — после свадьбы; być po ślubie — быть в браке"
    note: "po с предложным; być po ślubie значит «состоять в браке»."
    examples:
      - pl: "Jesteśmy po ślubie."
        ru: "Мы женаты."
        source: { kind: translated, id: 10606657 }
      - pl: "Po ślubie odbyło się wielkie przyjęcie."
        ru: "После свадьбы был большой приём."
        source: { kind: translated, id: 361039 }
      - pl: "Obie siostry Toma są po ślubie."
        ru: "Обе сестры Тома замужем."
        source: { kind: translated, id: 12040356 }
notes:
  - { kind: government, text: "Главный оборот — brać/wziąć ślub «вступать в брак»: wzięli ślub w kościele. Дословного русского соответствия нет, поэтому его стоит запомнить целиком." }
  - { kind: usage, text: "być po ślubie значит «состоять в браке», а не просто «после свадьбы»: obie siostry są po ślubie." }
  - { kind: usage, text: "rocznica ślubu — «годовщина свадьбы»; do ślubu — «до свадьбы», с родительным." }
  - { kind: usage, text: "Однокоренное ślubować значит «давать обет, клясться» — отсюда и ślub как «обет»." }
collocations:
  - { pl: "wziąć ślub", ru: "пожениться" }
  - { pl: "po ślubie", ru: "после свадьбы" }
  - { pl: "rocznica ślubu", ru: "годовщина свадьбы" }
  - { pl: "suknia ślubna", ru: "свадебное платье" }
family:
  - { pl: "ślubować", ru: "давать обет", relation: root }
  - { pl: "ślubny", ru: "свадебный", relation: derived }
  - { pl: "poślubić", ru: "взять в супруги", relation: derived }
etymology: "От ślubować «давать обет», праславянское *sljubiti «обещать, обетовать» — родственно русскому «слюбиться» и «любо»; ślub буквально «обет»."
memory: "ślub — «венчание, бракосочетание», и держится карточка на обороте, которого в русском нет дословно: brać ślub, wziąć ślub — «вступать в брак», буквально «брать обет». Wzięli ślub w kościele. Второй оборот тоже стоит запомнить: być po ślubie значит не «после свадьбы», а «состоять в браке». Прилагательное — ślubny: suknia ślubna «свадебное платье»."
idioms:
  - { pl: "wziąć ślub", ru: "пожениться" }
  - { pl: "być po ślubie", ru: "состоять в браке" }
  - { pl: "rocznica ślubu", ru: "годовщина свадьбы" }
