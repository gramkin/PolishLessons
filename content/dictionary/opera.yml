notes:
  - { kind: false-friend, text: "OPERA — «опера», совпадение полное, и тоже значит и жанр, и театр: IŚĆ DO OPERY. Сериал-«мыло» — OPERA MYDLANA. «Это из другой оперы» по-польски — TO INNA PARA KALOSZY." }
  - { kind: usage, text: "Девять живых форм, женский род. В местном падеже R переходит в RZ: W OPERZE. Родительный множественного — OPER. Звательный не даётся." }
  - { kind: government, text: "Пойти в оперу — IŚĆ DO OPERY, DO с родительным. В опере — W OPERZE. Опера кого — родительный: OPERA VERDIEGO." }
  - { kind: pronunciation, text: "Читается «о́пэра», ударение на первом слоге. PE — твёрдое «пэ»." }
collocations:
  - { pl: "iść do opery", ru: "пойти в оперу" }
  - { pl: "opera mydlana", ru: "мыльная опера" }
  - { pl: "śpiewak operowy", ru: "оперный певец" }
