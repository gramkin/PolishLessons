notes:
  - { kind: false-friend, text: "STRAŻAK — «пожарный», а не «стражник». Охранник, страж — STRAŻNIK. STRAŻ значит «охрана» вообще, но STRAŻ POŻARNA — «пожарная команда», и в обиходе просто STRAŻ: ZADZWOŃ PO STRAŻ!" }
  - { kind: usage, text: "Десять форм, мужской род, лицо. Во множественном K переходит в C: STRAŻACY. Винительный равен родительному: WEZWAĆ STRAŻAKA, WEZWAĆ STRAŻAKÓW. Пожарная машина — WÓZ STRAŻACKI." }
  - { kind: government, text: "Вызвать пожарных — WEZWAĆ STRAŻ или ZADZWONIĆ PO STRAŻ, PO с винительным. Стать пожарным — ZOSTAĆ STRAŻAKIEM, творительный." }
  - { kind: pronunciation, text: "Читается «стра́жак», ударение на первом из двух слогов. Ż — «ж». Во множественном STRAŻACY: «стража́цы»." }
collocations:
  - { pl: "straż pożarna", ru: "пожарная команда" }
  - { pl: "wezwać strażaków", ru: "вызвать пожарных" }
  - { pl: "wóz strażacki", ru: "пожарная машина" }
family:
  - { pl: "straż", ru: "охрана; пожарная команда", relation: root, id: straz }
  - { pl: "strażnik", ru: "охранник, страж", relation: root, id: straznik }
  - { pl: "strażacki", ru: "пожарный (прил.)", relation: derived }
etymology: "От STRAŻ «стража, охрана» с суффиксом -AK. Корень тот же, что в русских «стража», «сторож»: в польском он стал названием пожарной охраны."
memory: "Strażak — пожарный, не «стражник» (strażnik). Читается «стра́жак». Straż pożarna — пожарная команда. Strażacy — пожарные."
idioms:
