# review
id: rozwiesc
format: 2
lemma: "rozwieść"
rank: 3943
pos: verb
pron: { cyr: "ро́звесьць" }
senses:
  - id: divorce
    ru: "с SIĘ — развестись"
    examples:
      - pl: "Rozwiedli się po pięciu latach."
        ru: "Они развелись через пять лет."
        source: { kind: authored }
      - pl: "Rozwiodła się z mężem w zeszłym roku."
        ru: "Она развелась с мужем в прошлом году."
        source: { kind: authored }
      - pl: "Rozwiedź się z nim, jeśli cię nie szanuje."
        ru: "Разведись с ним, если он тебя не уважает."
        source: { kind: authored }
  - id: grant-divorce
    ru: "развести (о суде)"
    examples:
      - pl: "Sąd rozwiódł ich bez orzekania o winie."
        ru: "Суд развёл их без установления вины."
        source: { kind: authored }
      - pl: "Sędzia rozwiedzie małżonków na pierwszej rozprawie."
        ru: "Судья разведёт супругов на первом заседании."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ROZWIEŚĆ SIĘ — «развестись», как в русском; «развод» — ROZWÓD, «разведённый» — ROZWIEDZIONY. Но «разводить» животных, цветы — HODOWAĆ, а «развести огонь» — ROZPALIĆ." }
  - { kind: usage, text: "Сорок шесть форм: нет трёх ошибочных условных форм черновика и редкого отглагольного существительного. Прошедшее мужского рода — ROZWIÓDŁ, с Ó; ROZWIODŁA, ROZWIEDLI. Будущее: ROZWIODĘ, ROZWIEDZIESZ, повелительное ROZWIEDŹ. Несовершенный вид — ROZWODZIĆ SIĘ, ещё и «распространяться»: ROZWODZIĆ SIĘ NAD SZCZEGÓŁAMI." }
  - { kind: government, text: "С кем — Z с творительным: ROZWIEŚĆ SIĘ Z ŻONĄ. Кого — винительный (о суде): SĄD ICH ROZWIÓDŁ. ROZWIEDZIONY Z KIMŚ — «разведённый с кем-то»." }
  - { kind: pronunciation, text: "Читается «ро́звесьць», ударение на первом слоге. ROZWIODĘ — «розвё́дэ», ROZWIÓDŁ — «ро́звюду»." }
  - { kind: register, text: "Нейтральное слово. В официальной речи — ROZWIĄZAĆ MAŁŻEŃSTWO PRZEZ ROZWÓD. ROZWODNIK, ROZWÓDKA — разговорные «разведённый, разведёнка»." }
collocations:
  - { pl: "rozwieść się z mężem", ru: "развестись с мужем" }
  - { pl: "wziąć rozwód", ru: "развестись (оформить развод)" }
  - { pl: "osoba rozwiedziona", ru: "разведённый человек" }
family:
  - { pl: "rozwód", ru: "развод", relation: derived, id: rozwod }
  - { pl: "rozwodnik", ru: "разведённый мужчина", relation: derived }
  - { pl: "rozwodzić", ru: "разводить; с SIĘ — разводиться", relation: aspect }
etymology: "Приставка ROZ- «раз-» плюс WIEŚĆ «вести», праславянское *vesti, *vedǫ. Буквально — «развести в стороны». Русское «развести», «развод» — то же строение."
memory: "Rozwieść się — развестись: rozwiedli się po pięciu latach. Rozwód — развод, rozwiedziony — разведённый. Читается «ро́звесьць»."
idioms:
  - { pl: "rozwodzić się nad czymś", ru: "распространяться о чём-то, долго говорить" }
formExamplesSkip:
  - { form: "rozwiodł", reason: "Агглютинативная основа, а не самостоятельная форма: она живёт только с окончанием — ROZWIODŁEM, ROZWIODŁEŚ. Свободная форма мужского рода — ROZWIÓDŁ, и она в карточке есть." }
  - { form: "rozwiodłby", reason: "Правильная условная форма мужского рода — ROZWIÓDŁBY, и в черновике её нет: ó сохраняется в закрытом слоге перед ŁBY, как в ROZWIÓDŁ." }
  - { form: "rozwiodłbym", reason: "То же самое: правильная форма — ROZWIÓDŁBYM, которой в черновике нет. Женские, средние и множественные условные формы в карточке есть: ROZWIODŁABY, ROZWIODŁOBY, ROZWIODŁYBY." }
  - { form: "rozwiodłbyś", reason: "То же самое: правильная форма — ROZWIÓDŁBYŚ, которой в черновике нет. Ограничение касается только мужского рода единственного числа." }
  - { form: "rozwiedzenie", reason: "отглагольное существительное практически не употребляется: «развод» — ROZWÓD" }
  - { form: "rozwiedzenia", reason: "отглагольное существительное практически не употребляется: «развод» — ROZWÓD" }
  - { form: "rozwiedzeniu", reason: "отглагольное существительное практически не употребляется: «развод» — ROZWÓD" }
  - { form: "rozwiedzeniem", reason: "отглагольное существительное практически не употребляется: «развод» — ROZWÓD" }
