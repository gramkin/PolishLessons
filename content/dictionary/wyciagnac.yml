# review
id: wyciagnac
format: 2
lemma: "wyciągnąć"
rank: 701
pos: verb
aspect: perf
pron: { cyr: "выцё́нгнонць" }
senses:
  - id: pull-out
    ru: "вытащить, вынуть"
    examples:
      - pl: "Wyciągnął zeszyt."
        ru: "Он вытащил тетрадь."
        source: { kind: translated, id: 442891 }
      - pl: "Korka nie dało się wyciągnąć."
        ru: "Пробку не удалось вытащить."
        source: { kind: translated, id: 718951 }
      - pl: "Wyciągnąłem ziemniaki."
        ru: "Я вытащил картошку."
        source: { kind: translated, id: 2979471 }
  - id: stretch
    ru: "wyciągnąć rękę — протянуть руку"
    examples:
      - pl: "Zamknij oczy i wyciągnij rękę."
        ru: "Закрой глаза и протяни руку."
        source: { kind: tatoeba, id: 12470139 }
      - pl: "Wyciągnęła rękę."
        ru: "Она протянула руку."
        source: { kind: translated, id: 818758 }
      - pl: "Była gęsta mgła, nie było widać nic na wyciągnięcie ręki."
        ru: "Была густая мгла, не было видно дальше вытянутой руки."
        source: { kind: tatoeba, id: 349502 }
  - id: extract
    ru: "wyciągnąć coś OD kogoś — вытянуть из кого-л."
    examples:
      - pl: "Wyciągnąłem tę tajemnicę od pana Yoshidy."
        ru: "Я вытянул эту тайну у господина Ёсиды."
        source: { kind: translated, id: 3544321 }
      - pl: "Sprytnie wyciągnęła z niego prawdę."
        ru: "Она ловко вытянула из него правду."
        source: { kind: translated, id: 510067 }
      - pl: "Wyciągnął rękę."
        ru: "Он протянул руку."
        source: { kind: translated, id: 730382 }
  - id: conclusions
    ru: "wyciągnąć wnioski — сделать выводы"
    examples:
      - pl: "Do ciebie należy wyciągnięcie wniosków."
        ru: "Выводы делать тебе."
        source: { kind: translated, id: 901373 }
      - pl: "Astronomowie wyciągnęli wniosek o istnieniu lokalnej supergromady."
        ru: "Астрономы сделали вывод о существовании местного сверхскопления."
        source: { kind: translated, id: 3582023 }
      - pl: "Wyciągnij wnioski z tej historii."
        ru: "Сделай выводы из этой истории."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Буквально «вытянуть наружу»: wy- + ciągnąć «тянуть». Отсюда весь диапазон значений — от wyciągnąć korek «вытащить пробку» до wyciągnąć wnioski «сделать выводы»." }
  - { kind: government, text: "Откуда вытащить — z с родительным: wyciągnąć list z szuflady. У кого вытянуть — od с родительным: wyciągnąć prawdę od świadka." }
  - { kind: usage, text: "na wyciągnięcie ręki — «рукой подать», буквально «на расстоянии вытянутой руки»." }
  - { kind: usage, text: "wyciągnąć nogi значит «протянуть ноги», то есть умереть: идиома совпадает с русской дословно. Несовершенный вид — wyciągać." }
collocations:
  - { pl: "wyciągnąć rękę", ru: "протянуть руку" }
  - { pl: "wyciągnąć wnioski", ru: "сделать выводы" }
  - { pl: "na wyciągnięcie ręki", ru: "рукой подать" }
  - { pl: "wyciągnąć coś od kogoś", ru: "вытянуть из кого-либо" }
family:
  - { pl: "ciągnąć", ru: "тянуть", relation: root }
  - { pl: "wyciągać", ru: "вытягивать", relation: aspect }
  - { pl: "pociąg", ru: "поезд", relation: root }
  - { pl: "ciąg", ru: "ряд, тяга", relation: root }
etymology: "wy- + ciągnąć «тянуть», праславянское *tęgnǫti — то же гнездо, что русские «тянуть» и «тяга»."
memory: "wyciągnąć — wy- + ciągnąć, буквально «вытянуть наружу», и диапазон у слова широкий: wyciągnąć korek «вытащить пробку», wyciągnąć rękę «протянуть руку», wyciągnąć prawdę od kogoś «вытянуть правду», wyciągnąć wnioski «сделать выводы». Две идиомы переносятся дословно: na wyciągnięcie ręki «рукой подать» и wyciągnąć nogi «протянуть ноги»."
idioms:
  - { pl: "wyciągnąć wnioski", ru: "сделать выводы" }
  - { pl: "na wyciągnięcie ręki", ru: "рукой подать" }
  - { pl: "wyciągnąć nogi", ru: "протянуть ноги" }
