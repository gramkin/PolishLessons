# review
id: wygrywac
format: 2
lemma: "wygrywać"
rank: 1719
pos: verb
aspect: imperf
aspectPair: wygrac
pron: { cyr: "выгры́ваць" }
senses:
  - id: win
    ru: "выигрывать, побеждать"
    examples:
      - pl: "Kto wygrywa?"
        ru: "Кто выигрывает?"
        source: { kind: translated, id: 4748463 }
      - pl: "Nasza drużyna wygrywa."
        ru: "Наша команда выигрывает."
        source: { kind: translated, id: 606067 }
      - pl: "Czarny wygrywa."
        ru: "Чёрные выигрывают."
        source: { kind: translated, id: 2725535 }
  - id: win-habit
    ru: "выигрывать (постоянно, вообще)"
    examples:
      - pl: "Prawie zawsze wygrywam."
        ru: "Я почти всегда выигрываю."
        source: { kind: tatoeba, id: 6670463 }
      - pl: "Nie możesz zawsze wygrywać."
        ru: "Нельзя выигрывать всегда."
        source: { kind: translated, id: 4837813 }
      - pl: "Jedni wygrywają, inni przegrywają."
        ru: "Одни выигрывают, другие проигрывают."
        source: { kind: translated, id: 366178 }
notes:
  - { kind: usage, text: "Мужско-личной формы wygrywani не бывает: выигрывают матч, приз или дело, а не людей, поэтому она оставлена без примеров. Причастие живёт при вещах: wygrywane mecze «выигрываемые матчи», nagroda wygrywana co roku." }
  - { kind: usage, text: "Пара по виду: wygrywać (несовершенный) — wygrać (совершенный). Противоположность — przegrywać «проигрывать»." }
  - { kind: government, text: "Выигрывать у кого-то — wygrywać z kimś, творительный падеж с z: wygrywam z nim w golfa. Во что — w coś, винительный." }
  - { kind: usage, text: "Есть и музыкальное значение: wygrywać melodię «наигрывать мелодию»." }
  - { kind: false-friend, text: "Состав слова совпадает с русским: wy- это «вы-», grywać от grać «играть», так что wygrywać узнаётся сразу." }
collocations:
  - { pl: "wygrywać mecz", ru: "выигрывать матч" }
  - { pl: "wygrywać z kimś", ru: "выигрывать у кого-либо" }
  - { pl: "wygrywać wybory", ru: "выигрывать выборы" }
family:
  - { pl: "wygrać", ru: "выиграть", relation: aspect, id: wygrac }
  - { pl: "przegrać", ru: "проиграть", relation: root, id: przegrac }
  - { pl: "gra", ru: "игра", relation: root, id: gra }
etymology: "Приставка wy- плюс grywać, многократная форма от grać «играть» — точно как русское «вы-игрывать»."
memory: "wygrywać — «выигрывать», совершенный вид wygrać. У кого — z kimś: wygrywam z nim w szachy. Проигрывать — przegrywać."
idioms:
  - { pl: "wygrywać wybory", ru: "выигрывать выборы" }
  - { pl: "wygrywać z kimś", ru: "выигрывать у кого-либо" }
  - { pl: "nie można zawsze wygrywać", ru: "нельзя выигрывать всегда" }
