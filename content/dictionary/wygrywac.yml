    ru: "Побеждать каждую неделю утомительно."
    source: { kind: authored }
  - form: "wygrywanie"
    pl: "Wygrywanie uczciwie smakuje inaczej."
    ru: "Побеждать честно ощущается иначе."
    source: { kind: authored }
  - form: "wygrywaniem"
    pl: "Zmęczył się wygrywaniem bez rywali."
    ru: "Он устал побеждать без соперников."
    source: { kind: authored }
  - form: "wygrywaniem"
    pl: "Między wygrywaniem a graniem jest różnica."
    ru: "Между тем чтобы побеждать и играть, есть разница."
    source: { kind: authored }
  - form: "wygrywaniem"
    pl: "Cieszył się wygrywaniem w drobiazgach."
    ru: "Он радовался победам в мелочах."
    source: { kind: authored }
  - form: "wygrywaniu"
    pl: "W wygrywaniu też trzeba klasy."
    ru: "Побеждать тоже надо уметь."
    source: { kind: authored }
  - form: "wygrywaniu"
    pl: "Po wygrywaniu przyszła pora na porażkę."
    ru: "После побед пришло время поражения."
    source: { kind: authored }
  - form: "wygrywaniu"
    pl: "O wygrywaniu za wszelką cenę mówi trener z niechęcią."
    ru: "О победе любой ценой тренер говорит с неохотой."
    source: { kind: authored }
  - form: "wygrywany"
    pl: "Ten turniej jest wygrywany przez faworytów."
    ru: "Этот турнир выигрывают фавориты."
    source: { kind: authored }
  - form: "wygrywany"
    pl: "Wygrywany co roku puchar stoi w gablocie."
    ru: "Ежегодно выигрываемый кубок стоит в витрине."
    source: { kind: authored }
  - form: "wygrywany"
    pl: "Mecz wygrywany do przerwy skończył się remisem."
    ru: "Матч, который вели до перерыва, кончился ничьей."
    source: { kind: authored }
  - form: "wygrywanych"
    pl: "Nie ma tu łatwo wygrywanych meczów."
    ru: "Легко выигрываемых матчей тут нет."
    source: { kind: authored }
  - form: "wygrywanych"
    pl: "Z wygrywanych spraw żadna nie była prosta."
    ru: "Из выигрываемых дел ни одно не было простым."
    source: { kind: authored }
  - form: "wygrywanych"
    pl: "Lista wygrywanych nagród jest krótka."
    ru: "Список выигрываемых наград короток."
    source: { kind: authored }
  - form: "wygrywanym"
    pl: "W często wygrywanym turnieju nie ma emocji."
    ru: "В часто выигрываемом турнире нет азарта."
    source: { kind: authored }
  - form: "wygrywanym"
    pl: "Cieszył się wygrywanym co roku pucharem."
    ru: "Он радовался ежегодно выигрываемому кубку."
    source: { kind: authored }
  - form: "wygrywanym"
    pl: "Poświęcił rozdział wygrywanym procesom."
    ru: "Он посвятил главу выигрываемым процессам."
    source: { kind: authored }
  - form: "wygrywanymi"
    pl: "Chwalił się wygrywanymi procesami."
    ru: "Он хвалился выигранными процессами."
    source: { kind: authored }
  - form: "wygrywanymi"
    pl: "Między wygrywanymi a przegrywanymi meczami jest przepaść."
    ru: "Между выигрываемыми и проигрываемыми матчами пропасть."
    source: { kind: authored }
  - form: "wygrywanymi"
    pl: "Zajmuje się wygrywanymi w sądzie sprawami."
    ru: "Он занимается делами, выигрываемыми в суде."
    source: { kind: authored }
