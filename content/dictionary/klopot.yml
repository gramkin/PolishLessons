# review
id: klopot
format: 2
lemma: "kłopot"
rank: 490
pos: noun
pron: { cyr: "куо́пот" }
senses:
  - id: trouble
    ru: "беспокойство, хлопоты"
    examples:
      - pl: "Przepraszam za kłopot."
        ru: "Прошу прощения за беспокойство."
        source: { kind: tatoeba, id: 735757 }
      - pl: "Nie chciałem sprawić kłopotu."
        ru: "Я не хотел доставить хлопот."
        source: { kind: translated, id: 13560412 }
      - pl: "To żaden kłopot."
        ru: "Это вовсе не хлопотно."
        source: { kind: authored }
  - id: troubles
    ru: "неприятности, проблемы (во множественном)"
    examples:
      - pl: "Tom ma poważne kłopoty."
        ru: "У Тома серьёзные неприятности."
        source: { kind: tatoeba, id: 3184779 }
      - pl: "Jestem w kłopotach."
        ru: "У меня неприятности."
        source: { kind: translated, id: 8739310 }
      - pl: "On ma kłopoty."
        ru: "У него неприятности."
        source: { kind: translated, id: 12184022 }
notes:
  - { kind: usage, text: "Przepraszam za kłopot — «Извините за беспокойство», готовая вежливая формула." }
  - { kind: usage, text: "Множественное kłopoty значит «неприятности, проблемы»: mieć kłopoty «иметь неприятности», być w kłopotach «быть в беде»." }
  - { kind: usage, text: "sprawiać kłopot — «доставлять хлопоты»; I po kłopocie! — «И дело с концом!»" }
  - { kind: false-friend, text: "Слово звукоподражательное, того же типа, что stukot «стук» и tupot «топот»: исходно это «шум, суматоха». Русского родственника у него нет." }
collocations:
  - { pl: "przepraszam za kłopot", ru: "извините за беспокойство" }
  - { pl: "mieć kłopoty", ru: "иметь неприятности" }
  - { pl: "być w kłopotach", ru: "быть в беде" }
  - { pl: "sprawiać kłopot", ru: "доставлять хлопоты" }
etymology: "Праславянское *klopotъ — звукоподражание того же типа, что stukot «стук» и tupot «топот». Исходно слово значило «шум, суматоха»."
memory: "kłopot — «хлопоты, неприятность», и слово звукоподражательное: родня ему stukot «стук» и tupot «топот», а исходный смысл — «шум, суматоха». Запомните формулу Przepraszam za kłopot."
idioms:
  - { pl: "przepraszam za kłopot", ru: "извините за беспокойство" }
  - { pl: "i po kłopocie", ru: "и дело с концом" }
  - { pl: "mieć kłopoty", ru: "иметь неприятности" }
formExamplesSkip:
  - { form: "kłopocie", cell: "Звательный", reason: "звательный падеж: для неодушевлённого существительного он практически не употребляется" }
