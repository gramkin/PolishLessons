# review
id: nawet
format: 2
lemma: "nawet"
rank: 111
pos: part
pron: { cyr: "на́вэт" }
senses:
  - id: even
    ru: "даже (подчёркивает неожиданность)"
    examples:
      - pl: "Szanowała nawet wrogów."
        ru: "Она уважала даже врагов."
        source: { kind: tatoeba, id: 6300258 }
      - pl: "Tam jest zimno nawet latem."
        ru: "Там холодно даже летом."
        source: { kind: tatoeba, id: 691342 }
      - pl: "Nawet ona mnie nie rozumie."
        ru: "Даже она меня не понимает."
        source: { kind: tatoeba, id: 4327989 }
  - id: even-not
    ru: "даже не (в отрицании: nawet nie)"
    note: "Отрицание ставится после nawet: nawet nie wiem «даже не знаю»."
    examples:
      - pl: "My nie mamy nawet młotka."
        ru: "У нас даже молотка нет."
        source: { kind: tatoeba, id: 10703090 }
      - pl: "Oni nie wiedzą nawet dlaczego."
        ru: "Они даже не знают почему."
        source: { kind: tatoeba, id: 531057 }
notes:
  - { kind: usage, text: "nawet стоит прямо перед тем словом, которое подчёркивает: Nawet ona «даже она», nawet latem «даже летом»." }
  - { kind: usage, text: "nawet jeśli и nawet gdyby — «даже если»: Nawet jeśli padа, idziemy. В придаточном с gdyby глагол стоит в форме на -by." }
collocations:
  - { pl: "nawet nie", ru: "даже не" }
  - { pl: "nawet jeśli", ru: "даже если" }
  - { pl: "nawet gdyby", ru: "даже если бы" }
etymology: "Слово исконно польское; русское «даже» образовано от другого корня (да + же), так что прямого родственника у nawet в русском нет."
memory: "nawet = «даже». Самая частая связка — nawet nie «даже не»: Nawet nie wiem, co powiedzieć «Даже не знаю, что сказать»."
idioms:
  - { pl: "nawet nie drgnąć", ru: "даже не шелохнуться" }
  - { pl: "nawet mi się nie śniło", ru: "мне и не снилось" }
  - { pl: "nawet nie ma o czym mówić", ru: "и говорить не о чем" }
formExamples:
  - form: "nawet"
    pl: "Nie potrafi się nawet podpisać."
    ru: "Он даже расписаться не может."
    source: { kind: tatoeba, id: 351492 }
  - form: "nawet"
    pl: "Tutaj nawet latem jest zimno."
    ru: "Здесь холодно даже летом."
    source: { kind: tatoeba, id: 591820 }
  - form: "nawet"
    pl: "Nawet dzieci to wiedzą."
    ru: "Даже дети это знают."
    source: { kind: authored }
