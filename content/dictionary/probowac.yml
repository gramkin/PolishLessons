# review
id: probowac
format: 2
lemma: "próbować"
rank: 174
pos: verb
aspect: imperf
pron: { cyr: "пру́боваць" }
senses:
  - id: try
    ru: "пытаться, стараться (что-либо сделать)"
    examples:
      - pl: "Próbuję ją uspokoić."
        ru: "Я пытаюсь успокоить её."
        source: { kind: tatoeba, id: 5909108 }
      - pl: "Próbuję ją ochronić."
        ru: "Я пытаюсь защитить её."
        source: { kind: tatoeba, id: 8661249 }
      - pl: "Próbują obniżyć koszty."
        ru: "Они пытаются уменьшить затраты."
        source: { kind: tatoeba, id: 13787752 }
  - id: taste
    ru: "пробовать (на вкус) — с родительным падежом"
    note: "próbować zupy «попробовать супа» — падеж тот же, что в русском."
    examples:
      - pl: "Próbowałeś japońskiego piwa?"
        ru: "Ты пробовал японское пиво?"
        source: { kind: tatoeba, id: 2143166 }
      - pl: "Próbowałem wszystkich serów."
        ru: "Я попробовал все сыры."
        source: { kind: authored }
      - pl: "Próbuję nowej herbaty."
        ru: "Я пробую новый чай."
        source: { kind: authored }
notes:
  - { kind: government, text: "В значении «пробовать на вкус» глагол требует родительного падежа: próbować zupy, próbować wina — как русское «попробовать супа»." }
  - { kind: usage, text: "С инфинитивом значит «пытаться»: Próbuję zrozumieć «Пытаюсь понять»." }
  - { kind: usage, text: "Совершенный вид — spróbować: Spróbuj jeszcze raz «Попробуй ещё раз»." }
collocations:
  - { pl: "próbować szczęścia", ru: "попытать счастья" }
  - { pl: "próbuj dalej", ru: "продолжай пытаться" }
  - { pl: "warto spróbować", ru: "стоит попробовать" }
  - { pl: "nie ma co próbować", ru: "нечего и пытаться" }
etymology: "От próba «проба, попытка» — заимствования из латинского proba; русское «пробовать» пришло тем же путём, поэтому слова похожи."
memory: "С инфинитивом значит «пытаться»: próbuję zrozumieć. А «пробовать на вкус» требует родительного падежа: próbować zupy — как русское «попробовать супа». Совершенный вид — spróbować."
idioms:
  - { pl: "próbować szczęścia", ru: "попытать счастья" }
  - { pl: "nie ma co próbować", ru: "нечего и пытаться" }
  - { pl: "próbuj dalej", ru: "продолжай пытаться" }
