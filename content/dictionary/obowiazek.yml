# review
id: obowiazek
format: 2
lemma: "obowiązek"
rank: 1138
pos: noun
pron: { cyr: "обовё́нзэк" }
senses:
  - id: duty
    ru: "долг, обязанность"
    examples:
      - pl: "To mój obowiązek."
        ru: "Это мой долг."
        source: { kind: translated, id: 12320929 }
      - pl: "To jest mój dziennikarski obowiązek."
        ru: "Это мой журналистский долг."
        source: { kind: tatoeba, id: 3744883 }
      - pl: "Naszym obowiązkiem jest przestrzeganie prawa."
        ru: "Наш долг — соблюдать закон."
        source: { kind: translated, id: 891874 }
  - id: duties
    ru: "обязанности (по работе)"
    examples:
      - pl: "To należy do twoich obowiązków."
        ru: "Это входит в твои обязанности."
        source: { kind: translated, id: 929493 }
      - pl: "On zaniedbał swoje obowiązki."
        ru: "Он пренебрёг своими обязанностями."
        source: { kind: translated, id: 563622 }
  - id: sense
    ru: "poczucie obowiązku — чувство долга"
    examples:
      - pl: "Ona nie ma poczucia obowiązku."
        ru: "У неё нет чувства долга."
        source: { kind: translated, id: 2625437 }
      - pl: "Nie mam obowiązku tego robić."
        ru: "Я не обязан этим заниматься."
        source: { kind: tatoeba, id: 7151368 }
notes:
  - { kind: usage, text: "Мужской род с беглым e: именительный obowiązek, но obowiązku, obowiązki, obowiązków." }
  - { kind: false-friend, text: "obowiązek покрывает и «обязанность», и «долг» в смысле обязательства. А денежный долг — это совсем другое слово, dług." }
  - { kind: usage, text: "mieć obowiązek «быть обязанным»: Nie mam obowiązku tego robić «Я не обязан этим заниматься»." }
  - { kind: usage, text: "Родственное obowiązywać значит «действовать, быть в силе» — о правилах и законах." }
collocations:
  - { pl: "spełnić obowiązek", ru: "исполнить долг" }
  - { pl: "poczucie obowiązku", ru: "чувство долга" }
  - { pl: "obowiązki zawodowe", ru: "служебные обязанности" }
  - { pl: "mieć obowiązek", ru: "быть обязанным" }
family:
  - { pl: "obowiązkowy", ru: "обязательный", relation: derived }
  - { pl: "obowiązywać", ru: "действовать, быть в силе", relation: derived }
  - { pl: "wiązać", ru: "вязать, связывать", relation: root }
etymology: "От obowiązać «обязать», а то — от wiązać «вязать». Русская «обязанность» собрана точно так же, от «вязать»: то, чем человек связан."
memory: "obowiązek — «обязанность, долг», мужской род с беглым e: obowiązek, но obowiązku. Денежный долг — отдельное слово dług. И запомните mieć obowiązek «быть обязанным»."
idioms:
  - { pl: "poczucie obowiązku", ru: "чувство долга" }
  - { pl: "święty obowiązek", ru: "святой долг" }
formExamplesSkip:
