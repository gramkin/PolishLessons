# review
id: propos
format: 2
lemma: "propos"
rank: 4897
pos: part
pron: { cyr: "пропо́" }
senses:
  - id: by-the-way
    ru: "a propos — кстати, между прочим"
    examples:
      - pl: "A propos, w jakim jest pan wieku?"
        ru: "Кстати, сколько вам лет?"
        source: { kind: translated, id: 751426 }
      - pl: "A propos, widziałeś już nowy film?"
        ru: "Кстати, ты уже видел новый фильм?"
        source: { kind: authored }
      - pl: "A propos, dzwoniła do ciebie mama."
        ru: "Кстати, тебе звонила мама."
        source: { kind: authored }
  - id: speaking-of
    ru: "a propos + родительный — кстати о…, по поводу…"
    examples:
      - pl: "A propos Szwajcarii, byłaś tam kiedyś wiosną?"
        ru: "Кстати о Швейцарии, ты когда-нибудь была там весной?"
        source: { kind: translated, id: 11248427 }
      - pl: "A propos pieniędzy, oddasz mi wreszcie dług?"
        ru: "Кстати о деньгах, ты наконец вернёшь мне долг?"
        source: { kind: authored }
      - pl: "Pytam a propos twojego wczorajszego telefonu."
        ru: "Я спрашиваю по поводу твоего вчерашнего звонка."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Отдельно PROPOS не употребляется — только в обороте À PROPOS (с французским значком над A) или в упрощённом написании A PROPOS. Оба пишутся раздельно." }
  - { kind: government, text: "С существительным требует родительного падежа: A PROPOS PIENIĘDZY «кстати о деньгах», A PROPOS TEJ SPRAWY «по поводу этого дела». Русское «кстати о» — с предложным, польское — с родительным." }
  - { kind: pronunciation, text: "Читается по-французски, «а пропо́»: конечное S не произносится, ударение на последнем слоге — исключение из польского правила." }
collocations:
  - { pl: "a propos tego", ru: "кстати об этом" }
  - { pl: "a propos pieniędzy", ru: "кстати о деньгах" }
  - { pl: "tak a propos", ru: "кстати говоря" }
synonyms: ["przy okazji", "nawiasem mówiąc", "swoją drogą"]
etymology: "Из французского À PROPOS «кстати», буквально «к предмету (разговора)»; PROPOS по-французски — «речь, тема разговора»."
memory: "A propos — французское «кстати», читается «а пропо́», без S. С существительным — родительный: a propos pieniędzy."
idioms:
  - { pl: "tak a propos", ru: "кстати говоря, между прочим" }
formExamples:
