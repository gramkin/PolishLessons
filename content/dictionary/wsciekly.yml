# review
id: wsciekly
format: 2
lemma: "wściekły"
rank: 1653
pos: adj
pron: { cyr: "всьче́куы" }
senses:
  - id: furious
    ru: "взбешённый, в ярости"
    examples:
      - pl: "Jestem wściekły."
        ru: "Я в бешенстве."
        source: { kind: translated, id: 10606654 }
      - pl: "Tom jest wściekły."
        ru: "Том в бешенстве."
        source: { kind: translated, id: 9699264 }
      - pl: "Moi rodzice byli wściekli."
        ru: "Мои родители были в бешенстве."
        source: { kind: translated, id: 3232070 }
  - id: angry-at
    ru: "wściekły na kogoś — злой на кого-либо"
    examples:
      - pl: "Jestem wściekła na Toma."
        ru: "Я в бешенстве на Тома."
        source: { kind: translated, id: 3587215 }
      - pl: "Ona jest na mnie wściekła."
        ru: "Она на меня злится."
        source: { kind: translated, id: 1185120 }
      - pl: "Tom i Mary są wściekli na Johna."
        ru: "Том и Мэри злы на Джона."
        source: { kind: translated, id: 3093194 }
notes:
  - { kind: government, text: "«Злой на кого-то» — wściekły na kogoś, предлог na с винительным: jest na mnie wściekła «она на меня злится»." }
  - { kind: usage, text: "Слово сильнее, чем zły «злой»: wściekły значит «взбешённый, вне себя»." }
  - { kind: usage, text: "Второе значение прямое — «бешеный» о животном: wściekły pies «бешеная собака», wścieklizna «бешенство»." }
  - { kind: usage, text: "Степени сравнения (wścieklejszy, najwścieklejszy) в корпусе не встречаются ни разу." }
collocations:
  - { pl: "wściekły na kogoś", ru: "злой на кого-то" }
  - { pl: "być wściekłym", ru: "быть в бешенстве" }
  - { pl: "wściekły pies", ru: "бешеная собака" }
etymology: "От wściec się «взбеситься», в основе праславянское *sěk- «сечь, неистовствовать». Русское «бешеный» построено от «бес», метафора другая, но та же идея потери власти над собой."
memory: "wściekły = «взбешённый», сильнее, чем zły «злой». Управление: wściekły na kogoś «злой на кого-то», предлог na с винительным. Прямое значение тоже живо: wściekły pies «бешеная собака»."
