# review
id: kula
format: 2
lemma: "kula"
rank: 1057
pos: noun
pron: { cyr: "ку́ля" }
senses:
  - id: bullet
    ru: "пуля"
    examples:
      - pl: "Kula trafiła w cel."
        ru: "Пуля попала в цель."
        source: { kind: translated, id: 362473 }
      - pl: "Gandhi zginął od kuli."
        ru: "Ганди погиб от пули."
        source: { kind: translated, id: 937266 }
      - pl: "Kula przeszła przez jego piersi."
        ru: "Пуля прошла через его грудь."
        source: { kind: translated, id: 922453 }
  - id: sphere
    ru: "шар, сфера"
    examples:
      - pl: "Ziemia jest kulą."
        ru: "Земля — шар."
        source: { kind: translated, id: 12949470 }
      - pl: "Ziemia nie jest idealną kulą."
        ru: "Земля не идеальный шар."
        source: { kind: translated, id: 777781 }
      - pl: "Gwiazdy to olbrzymie kule plazmy."
        ru: "Звёзды — огромные шары плазмы."
        source: { kind: translated, id: 982929 }
  - id: crutch
    ru: "костыль (обычно во мн. ч.)"
    note: "chodzić o kulach — «ходить на костылях», с предлогом o."
    examples:
      - pl: "On chodzi o kulach."
        ru: "Он ходит на костылях."
        source: { kind: translated, id: 4328235 }
      - pl: "Odkąd złamałem sobie stopę, chodzę o kulach."
        ru: "С тех пор как я сломал стопу, хожу на костылях."
        source: { kind: translated, id: 692024 }
      - pl: "Podaj mi moje kule!"
        ru: "Подай мне мои костыли!"
        source: { kind: translated, id: 11584057 }
notes:
  - { kind: false-friend, text: "Одно слово на три разных значения: «пуля», «шар» и «костыль». Контекст различает их надёжно, но список стоит держать в голове." }
  - { kind: government, text: "chodzić O kulach — «ходить на костылях», предлог o с предложным падежом. Русский берёт «на» с предложным, так что конструкцию надо запоминать." }
  - { kind: usage, text: "kula ziemska — «земной шар». А kula śnieżna — «снежный ком»." }
  - { kind: usage, text: "kula u nogi буквально «ядро у ноги» — об обузе, как русское «камень на шее»." }
collocations:
  - { pl: "kula ziemska", ru: "земной шар" }
  - { pl: "chodzić o kulach", ru: "ходить на костылях" }
  - { pl: "zginąć od kuli", ru: "погибнуть от пули" }
  - { pl: "kula u nogi", ru: "обуза" }
family:
  - { pl: "kulka", ru: "шарик", relation: derived }
  - { pl: "kulisty", ru: "шарообразный", relation: derived }
etymology: "Из средневерхненемецкого kūle «палка, шар». В русском прямого родственника нет: «пуля» пришла из того же немецкого гнезда, но отдельным путём."
memory: "kula — сразу три вещи: «пуля», «шар» и «костыль». Kula ziemska «земной шар», zginąć od kuli «погибнуть от пули», chodzić O kulach «ходить на костылях» — с предлогом o."
idioms:
  - { pl: "kula ziemska", ru: "земной шар" }
  - { pl: "kula u nogi", ru: "обуза, камень на шее" }
  - { pl: "trafić kulą w płot", ru: "попасть пальцем в небо" }
formExamplesSkip:
  - { form: "kulo", reason: "звательный падеж: к пуле и шару не обращаются, форма не употребляется" }
