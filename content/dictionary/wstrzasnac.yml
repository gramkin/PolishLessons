# review
id: wstrzasnac
format: 2
lemma: "wstrząsnąć"
rank: 2297
pos: verb
aspect: perf
pron: { cyr: "фстшо́нснонць" }
senses:
  - id: shake
    ru: "встряхнуть, взболтать"
    examples:
      - pl: "Przed otwarciem wstrząsnąć."
        ru: "Перед открытием встряхнуть."
        source: { kind: translated, id: 838970 }
      - pl: "Wstrząśnij przed użyciem."
        ru: "Взболтать перед употреблением."
        source: { kind: translated, id: 524776 }
      - pl: "Przed użyciem wstrząsnąć lekarstwo."
        ru: "Перед употреблением взболтать лекарство."
        source: { kind: translated, id: 765891 }
  - id: shock
    ru: "потрясти (известием, событием)"
    examples:
      - pl: "Nowina wszystkimi wstrząsnęła."
        ru: "Известие всех потрясло."
        source: { kind: translated, id: 12359925 }
      - pl: "Byłem wstrząśnięty tym, co powiedział."
        ru: "Я был потрясён тем, что он сказал."
        source: { kind: translated, id: 943591 }
notes:
  - { kind: government, text: "В значении «потрясти кого-л.» требует ТВОРИТЕЛЬНОГО падежа: wstrząsnęła wszystkimi «потрясла всех», ta historia nim wstrząsnęła. Русское «потрясти» берёт винительный." }
  - { kind: usage, text: "Wstrząsnąć przed użyciem «взболтать перед употреблением» — надпись на любом флаконе." }
  - { kind: false-friend, text: "Корень trząść «трясти» — ср. русское «трясти», «встряхнуть»." }
  - { kind: usage, text: "Причастие wstrząśnięty «потрясённый» очень частотно. Несовершенный вид — wstrząsać." }
collocations:
  - { pl: "wstrząsnąć przed użyciem", ru: "взболтать перед употреблением" }
  - { pl: "być wstrząśniętym", ru: "быть потрясённым" }
etymology: "w- + trząść «трясти»; ср. русское «трясти», «встряхнуть», «потрясение»."
memory: "wstrząsnąć — «встряхнуть» и «потрясти», но во втором смысле с ТВОРИТЕЛЬНЫМ падежом: wiadomość wstrząsnęła wszystkimi. Причастие wstrząśnięty «потрясённый»."
idioms:
