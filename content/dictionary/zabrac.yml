# review
id: zabrac
format: 2
lemma: "zabrać"
rank: 176
pos: verb
aspect: perf
pron: { cyr: "за́браць" }
senses:
  - id: take-away
    ru: "забрать, взять (с собой)"
    examples:
      - pl: "Zabierz mnie stąd."
        ru: "Забери меня отсюда."
        source: { kind: tatoeba, id: 3460273 }
      - pl: "Zabierz mnie do domu."
        ru: "Забери меня домой."
        source: { kind: tatoeba, id: 5326049 }
      - pl: "Zabierz parasol, będzie padać."
        ru: "Возьми зонт, будет дождь."
        source: { kind: authored }
  - id: take-up
    ru: "отнять; занять (время); zabrać się do czegoś — взяться за что-либо"
    examples:
      - pl: "To zabrało mi cały dzień."
        ru: "Это заняло у меня целый день."
        source: { kind: authored }
      - pl: "Zabrali mu prawo jazdy."
        ru: "У него забрали права."
        source: { kind: authored }
      - pl: "Zabierz się do pracy."
        ru: "Возьмись за работу."
        source: { kind: authored }
notes:
  - { kind: usage, text: "zabrać się do czegoś значит «взяться за что-то»: Zabierzmy się do roboty «Возьмёмся за работу»." }
  - { kind: false-friend, text: "Форма zabrania чаще принадлежит другому глаголу — zabraniać «запрещать»: Prawo zabrania palić «Закон запрещает курить». Не путайте с zabranie «изъятие»." }
  - { kind: usage, text: "Несовершенный вид — zabierać: Zabieram dzieci ze szkoły «Забираю детей из школы»." }
collocations:
  - { pl: "zabrać ze sobą", ru: "взять с собой" }
  - { pl: "zabrać głos", ru: "взять слово" }
  - { pl: "zabrać się do roboty", ru: "взяться за работу" }
  - { pl: "zabrać czas", ru: "отнять время" }
etymology: "Приставка za- + brać; то же строение, что у русского «забрать». Несовершенный вид — zabierać."
memory: "zabrać coś — «забрать что-то», zabrać się do czegoś — «взяться за что-то». Осторожно с формой zabrania: чаще это другой глагол, zabraniać «запрещать»."
idioms:
  - { pl: "zabrać głos", ru: "взять слово" }
  - { pl: "zabrać się do roboty", ru: "взяться за работу" }
  - { pl: "zabrać ze sobą tajemnicę do grobu", ru: "унести тайну в могилу" }
