# review
id: poradzic
format: 2
lemma: "poradzić"
rank: 563
pos: verb
aspect: perf
pron: { cyr: "пора́дзиць" }
senses:
  - id: manage
    ru: "poradzić sobie z czymś — справиться с чем-л."
    note: "Самая частая конструкция: с się i z плюс творительный."
    examples:
      - pl: "Jak poradzić sobie z takim zimnem?"
        ru: "Как справиться с таким холодом?"
        source: { kind: tatoeba, id: 6729872 }
      - pl: "Poradzę sobie."
        ru: "Я справлюсь."
        source: { kind: translated, id: 6360042 }
      - pl: "On poradzi sobie z trudnymi problemami."
        ru: "Он справится с трудными задачами."
        source: { kind: translated, id: 758322 }
  - id: advise
    ru: "poradzić komuś — посоветовать кому-л."
    note: "Человек в дательном: poradził mi «он посоветовал мне»."
    examples:
      - pl: "Ktoś poradził mi, abym zawierzył się Bogu. Pytam: co miał na myśli?"
        ru: "Кто-то посоветовал мне довериться Богу. Я спрашиваю: что он имел в виду?"
        source: { kind: tatoeba, id: 13081643 }
      - pl: "Mam poradziła mi, bym poszedł do dentysty."
        ru: "Мама посоветовала мне сходить к дантисту."
        source: { kind: tatoeba, id: 631442 }
      - pl: "Poradziłem mu, by natychmiast wracał."
        ru: "Я посоветовал ему немедленно возвращаться."
        source: { kind: translated, id: 365113 }
  - id: consult
    ru: "poradzić się kogoś — посоветоваться с кем-л."
    note: "С się и родительным: poradź się lekarza «посоветуйся с врачом»."
    examples:
      - pl: "Lepiej poradź się lekarza."
        ru: "Лучше посоветуйся с врачом."
        source: { kind: translated, id: 523416 }
      - pl: "Ona potrzebuje kogoś do poradzenia się."
        ru: "Ей нужен кто-то, с кем можно посоветоваться."
        source: { kind: translated, id: 846230 }
      - pl: "Poradź mu coś."
        ru: "Посоветуй ему что-нибудь."
        source: { kind: translated, id: 943616 }
notes:
  - { kind: government, text: "Три конструкции, и все разные: poradzić sobie z czymś «справиться с чем-то» (się плюс z с творительным), poradzić komuś «посоветовать кому-то» (дательный) и poradzić się kogoś «посоветоваться с кем-то» (się плюс родительный)." }
  - { kind: usage, text: "Русский разводит эти значения по разным глаголам — «справиться» и «посоветовать», — а польский держит их в одном." }
  - { kind: usage, text: "Несовершенный вид — radzić: radzę ci «советую тебе», dam sobie radę «я справлюсь»." }
  - { kind: usage, text: "Существительное — rada «совет», отсюда же doradca «советник» и poradnia «консультация»." }
collocations:
  - { pl: "poradzić sobie", ru: "справиться" }
  - { pl: "poradzić komuś", ru: "посоветовать кому-либо" }
  - { pl: "poradzić się lekarza", ru: "посоветоваться с врачом" }
  - { pl: "dam sobie radę", ru: "я справлюсь" }
family:
  - { pl: "radzić", ru: "советовать", relation: root }
  - { pl: "rada", ru: "совет", relation: derived }
  - { pl: "doradca", ru: "советник", relation: derived }
etymology: "Приставка po- плюс radzić «советовать», от rada «совет», заимствованного из германского — то же слово, что русские «рада» и «радеть»."
memory: "poradzić — один глагол на три русских. С się и z: poradzić sobie z czymś «справиться с чем-то» — самая частая конструкция. С дательным: poradzić komuś «посоветовать кому-то». И с się плюс родительный: poradzić się lekarza «посоветоваться с врачом». Русский разводит это по разным глаголам, польский держит в одном. Несовершенный вид — radzić, существительное — rada «совет»."
idioms:
  - { pl: "poradzić sobie", ru: "справиться" }
  - { pl: "poradzić się lekarza", ru: "посоветоваться с врачом" }
  - { pl: "dam sobie radę", ru: "я справлюсь" }
