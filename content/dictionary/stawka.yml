notes:
  - { kind: false-friend, text: "Слова совпадают не полностью, и расходятся они в главном военном смысле. Русская «ставка» — это ещё и штаб верховного командования: Ставка Верховного Главнокомандующего. У польской STAWKA такого значения нет совсем; штаб по-польски KWATERA GŁÓWNA. Остальное совпадает: stawka godzinowa — часовая ставка, stawka podatkowa — налоговая ставка, wysoka stawka — высокая ставка в игре. То есть русский смысл шире, и именно лишний смысл подставляет подножку." }
  - { kind: usage, text: "Дательный и местный — STAWCE, с переходом k в c перед окончанием -e; родительный множественного — STAWEK, с беглым e. Это восьмой случай этой пары черт после kostce, kulce, szafce, gorączce, setce, klinice и działce из этой же партии. Правило у женских слов на -ka работает без исключений, и смысл слова на него никак не влияет — хоть кость, хоть клиника, хоть тариф." }
  - { kind: usage, text: "Корень прозрачен: STAWIAĆ значит «ставить», и ставка есть то, что поставлено — и в игре, и в оплате. Русская «ставка» от «ставить» построена точно так же, так что связь видна сразу. Полезное выражение STAWKA JEST WYSOKA употребляется ровно как русское «ставки высоки», в том числе переносно, когда речь не об игре и не о деньгах, а о риске." }
collocations:
  - { pl: "stawka godzinowa", ru: "часовая ставка" }
  - { pl: "wysoka stawka", ru: "высокая ставка" }
  - { pl: "stawka podatkowa", ru: "налоговая ставка" }
family:
  - { pl: "stawiać", ru: "ставить", relation: root, id: stawiac }
  - { pl: "postawić", ru: "поставить", relation: root, id: postawic }
etymology: "От STAWIAĆ «ставить», из праславянского *staviti — того же корня, что русские «ставить», «ставка» и «став». Ставка есть то, что поставлено на кон или установлено как размер оплаты, и оба смысла выросли из одного действия. Русское слово собрано тем же способом и из того же корня, но прибавило к себе военный штаб, чего польское не сделало."
memory: "Как русская «ставка», но без военного штаба: штаб — kwatera główna. Местный stawce, k даёт c; родительный множественного stawek с беглым e."
idioms:
  - { pl: "stawka jest wysoka", ru: "ставки высоки" }
  - { pl: "stawka godzinowa", ru: "часовая ставка" }
