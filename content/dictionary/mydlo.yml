notes:
  - { kind: false-friend, text: "Слово прозрачное: MYDŁO это «мыло», и оба идут от глагола мыть, MYĆ. Ловушка одна, зато яркая. Оборот MYDŁO I POWIDŁO буквально значит «мыло и повидло», а на деле — «всякая всячина, всё вперемешку», о лавке, ящике или докладе, где свалено несовместимое. Держится он на рифме, и переводить его дословно нельзя: по-русски это «сборная солянка» или «всё подряд»." }
  - { kind: usage, text: "Девять форм, средний род. В местном падеже Ł переходит в обычное L: MYDŁO, но W MYDLE. Это то же чередование, что в KRZESŁO — KRZEŚLE и в русском «село — в селе», только польский меняет ещё и качество звука. Родительный множественного MYDEŁ с беглым E. Множественное число употребляют, когда речь о сортах мыла: MYDŁA NATURALNE." }
  - { kind: government, text: "Мыть мылом — творительный без предлога: MYĆ MYDŁEM, ровно как по-русски. Кусок мыла — KOSTKA MYDŁA, родительный без предлога. Мыло для рук — MYDŁO DO RĄK, предлог DO с родительным, тогда как русский говорит «для рук». Это стоит заметить: польский в назначении предмета часто берёт DO там, где русский берёт «для»." }
  - { kind: pronunciation, text: "Читается «мы́дуо», два слога, ударение на первом. Буква Ł даёт «у», а не «л», поэтому слово звучит совсем не так, как русское «мыло», хотя пишется похоже. Буква Y даёт «ы». В местном падеже MYDLE буква уже обычная L, и слышно «мы́дле», с мягким «л». В родительном множественного MYDEŁ беглое E звучит отчётливо: «мы́дэу»." }
  - { kind: register, text: "Слово нейтральное и повседневное: MYDŁO W KOSTCE «кусковое мыло», MYDŁO W PŁYNIE «жидкое мыло», SZARE MYDŁO «хозяйственное мыло». Переносный пласт живой: MYDLIĆ KOMUŚ OCZY значит «втирать очки, морочить голову», а MYDŁO I POWIDŁO описывает беспорядочную смесь. Оба оборота разговорные и слышны постоянно, оба держатся на образе мыла как чего-то скользкого и неясного." }
