etymology: "От праславянского слова, образованного от MYĆ «мыть» суффиксом орудия: мыло это то, чем моют. Русское «мыло» собрано точно так же и из тех же частей, поэтому слова тождественны по строению и по смыслу. Разница только в звучании: польское Ł читается как «у», и на слух родство почти пропадает. Из того же гнезда идут MYDLINY «мыльная пена» и MYDLIĆ, давшее оборот о втирании очков."
memory: "Строение то же, что в русском: от myć «мыть» плюс суффикс орудия, то есть «то, чем моют». Но на слух родство теряется, потому что ł читается как «у»: mydło звучит «мы́дуо». В местном падеже ł переходит в l: w mydle. Главный оборот mydło i powidło, буквально «мыло и повидло», значит «всякая всячина». Рядом mydlić komuś oczy это «втирать очки»."
idioms:
  - { pl: "mydło i powidło", ru: "всякая всячина, всё вперемешку" }
