notes:
  - { kind: false-friend, text: "РУССКОЕ «НЕМЕЦКИЙ» — ТО ЖЕ САМОЕ СЛОВО С ТОЙ ЖЕ ВНУТРЕННЕЙ ФОРМОЙ. Niemiec происходит от niemy «НЕМОЙ»: так славяне называли соседа, который не говорит по-нашему. Русское «немец» построено ровно так же, из того же корня. Это общеславянское слово, и ни одно другое название народа не разбирается так прозрачно." }
  - { kind: usage, text: "НАЗВАНИЕ СТРАНЫ — ВО МНОЖЕСТВЕННОМ ЧИСЛЕ: NIEMCY. Говорят jadę do Niemiec «еду в Германию», mieszkam w Niemczech «живу в Германии». Так устроен целый ряд стран: Włochy «Италия», Węgry «Венгрия», Czechy «Чехия». Русский ставит их в единственном, польский — во множественном, и падежи приходится строить заново." }
  - { kind: pronunciation, text: "Четыре слога, ударение на предпоследнем: nie-MIEC-ki. Ni и mie мягкие, c читается как ц: «немє́цки». Мужско-личное множественное niemieccy произносится с долгим ц: «немє́ццы»." }
  - { kind: register, text: "Степеней сравнения нет: прилагательное относительное, как wojenny и narodowy, отсюда одиннадцать форм. Наречие образуется особым способом: не niemiecko, а po niemiecku «по-немецки» — та же модель, что po polsku и po rosyjsku." }
