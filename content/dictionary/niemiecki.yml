etymology: "От Niemiec, а то — от niemy «немой», из праславянского *němьcь «тот, кто не говорит понятно». Так называли всех чужеземцев германской речи. Русское «немец» — то же слово и та же логика. Противопоставлялись им Słowianie, чьё имя связывают со słowo: говорящие словами против немых."
memory: "niemiecki — «немецкий», и слово разбирается до конца: Niemiec от niemy «НЕМОЙ», тот, кто не говорит по-нашему; русское «немец» устроено так же. А страна во множественном числе: Niemcy, do Niemiec, w Niemczech."
