# review
id: wasy
format: 2
lemma: "wąsy"
rank: 4851
pos: noun
pron: { cyr: "во́нсы" }
senses:
  - id: moustache
    ru: "усы"
    examples:
      - pl: "Dziadek nosił gęste wąsy."
        ru: "Дед носил густые усы."
        source: { kind: authored }
      - pl: "Zgolił wąsy i wygląda młodziej."
        ru: "Он сбрил усы и выглядит моложе."
        source: { kind: authored }
      - pl: "Pod wąsami ukrywał uśmiech."
        ru: "Под усами он прятал улыбку."
        source: { kind: authored }
  - id: whiskers
    ru: "усы (у животного)"
    examples:
      - pl: "Kot ma długie białe wąsy."
        ru: "У кота длинные белые усы."
        source: { kind: authored }
      - pl: "Wąsy pomagają kotu w ciemności."
        ru: "Усы помогают коту в темноте."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "WĄSY — «усы», и носовое Ą стоит на месте русского «у», как в ZĄB и «зуб», DĄB и «дуб». Одно WĄS — «ус», а в разговоре и все усы целиком: MA WĄSA — «у него усы». Маленькие усики — WĄSIK, усатый — WĄSATY." }
  - { kind: usage, text: "Пять форм, только множественное число в этой карточке; единственное WĄS — отдельное слово. Обычно усы во множественном, как по-русски: NOSIĆ WĄSY. Родительный — WĄSÓW: BEZ WĄSÓW." }
  - { kind: government, text: "Сбрить усы — ZGOLIĆ WĄSY, винительный. Под усами — POD WĄSAMI, творительный. Без усов — BEZ WĄSÓW, родительный." }
  - { kind: pronunciation, text: "Читается «во́нсы», два слога, ударение на первом. Ą перед S звучит как «он», как в WĄS «вонс». В родительном WĄSÓW: «во́нсуф»." }
  - { kind: register, text: "ŚMIAĆ SIĘ POD WĄSEM, «смеяться под усом», — «посмеиваться в усы», втихомолку. Пышные усы — гордость старой шляхты, и WĄSY в польской культуре — знак солидного, немного старомодного мужчины." }
collocations:
  - { pl: "gęste wąsy", ru: "густые усы" }
  - { pl: "kocie wąsy", ru: "кошачьи усы" }
  - { pl: "podkręcać wąsy", ru: "подкручивать усы" }
family:
  - { pl: "was", ru: "ус", relation: root, id: was }
  - { pl: "wasik", ru: "усики", relation: derived }
  - { pl: "wasaty", ru: "усатый", relation: derived }
etymology: "Слово праславянское, общее с русским «ус»: древний носовой гласный в польском сохранился как Ą, а в русском стал «у». Русские «усы» и польские WĄSY — одно слово."
memory: "Wąsy — усы: ą на месте русского «у», как ząb и «зуб». Читается «во́нсы». Zgolić wąsy — сбрить усы. Śmiać się pod wąsem — посмеиваться в усы. Wąsik — усики."
idioms:
  - { pl: "śmiać się pod wąsem", ru: "посмеиваться в усы" }
  - { pl: "zapuścić wąsy", ru: "отпустить усы" }
