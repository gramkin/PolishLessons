# review
id: konkretnie
format: 2
lemma: "konkretnie"
rank: 5061
pos: adv
pron: { cyr: "конкрэ́тне" }
senses:
  - id: specifically
    ru: "конкретно, именно"
    examples:
      - pl: "Konkretnie ile to kosztuje?"
        ru: "Сколько конкретно это стоит?"
        source: { kind: authored }
      - pl: "Wyjaśnij mi to konkretnie."
        ru: "Объясни мне это конкретно."
        source: { kind: authored }
      - pl: "Wskazał konkretnie, gdzie jest błąd."
        ru: "Он точно указал, где ошибка."
        source: { kind: authored }
  - id: seriously-colloq
    ru: "здорово, крупно (разг.)"
    examples:
      - pl: "Konkretnie się wczoraj pokłócili."
        ru: "Вчера они крупно поссорились."
        source: { kind: authored }
      - pl: "Ale konkretnie zmokłem!"
        ru: "Ну и промок же я!"
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "KONKRETNIE — «конкретно», перевод прямой. В молодёжной речи у слова есть ещё значение «здорово, по-крупному»: KONKRETNIE SIĘ NAPRACOWAŁ, «он здорово поработал». A KONKRETNIE — «а именно»." }
  - { kind: usage, text: "Наречие со степенями: KONKRETNIE, KONKRETNIEJ, NAJKONKRETNIEJ. Частая просьба — CZY MOŻESZ KONKRETNIEJ, «а можно конкретнее»." }
  - { kind: government, text: "Наречие ничем не управляет. При вопросительных словах может стоять до или после них: CO KONKRETNIE, KONKRETNIE ILE." }
  - { kind: pronunciation, text: "Читается «конкрэ́тне», ударение на предпоследнем слоге. RE — твёрдое «рэ»." }
collocations:
  - { pl: "a konkretnie", ru: "а именно" }
  - { pl: "mówić konkretnie", ru: "говорить по делу" }
  - { pl: "co konkretnie", ru: "что конкретно" }
family:
  - { pl: "konkretny", ru: "конкретный", relation: root, id: konkretny }
  - { pl: "konkret", ru: "конкретика, факт", relation: root }
  - { pl: "skonkretyzować", ru: "конкретизировать", relation: root }
etymology: "От KONKRETNY, из латинского слова со значением «сгущённый, плотный». Русское «конкретный» — из того же источника."
memory: "Konkretnie — конкретно; a konkretnie — а именно. Читается «конкрэ́тне». Czy możesz konkretniej — а можно конкретнее. Przejść do konkretów — перейти к делу."
idioms:
  - { pl: "przejść do konkretów", ru: "перейти к делу" }
formExamples:
  - form: "konkretnie"
    pl: "Co konkretnie masz na myśli?"
    ru: "Что конкретно ты имеешь в виду?"
    source: { kind: authored }
  - form: "konkretnie"
    pl: "Mów konkretnie, nie mam czasu."
    ru: "Говори по делу, у меня нет времени."
    source: { kind: authored }
  - form: "konkretnie"
    pl: "Chodzi o jedną osobę, a konkretnie o twojego brata."
    ru: "Речь об одном человеке, а именно о твоём брате."
    source: { kind: authored }
  - form: "konkretniej"
    pl: "Czy możesz powiedzieć konkretniej?"
    ru: "Можешь сказать конкретнее?"
    source: { kind: authored }
  - form: "konkretniej"
    pl: "Odpowiedz konkretniej na pytanie."
    ru: "Ответь на вопрос конкретнее."
    source: { kind: authored }
  - form: "konkretniej"
    pl: "Musimy zaplanować wszystko konkretniej."
    ru: "Нам нужно спланировать всё конкретнее."
