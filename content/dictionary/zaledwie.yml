# review
id: zaledwie
format: 2
lemma: "zaledwie"
rank: 3164
pos: conj
pron: { cyr: "зале́две" }
senses:
  - id: only
    ru: "всего лишь, только"
    examples:
      - pl: "W Szwajcarii jest zaledwie 80 Ujgurów."
        ru: "В Швейцарии всего 80 уйгуров."
        source: { kind: tatoeba, id: 543676 }
      - pl: "Kiedy Justin Bieber rozpoczął karierę muzyczną, miał zaledwie 14 lat."
        ru: "Когда Джастин Бибер начал свою музыкальную карьеру, ему было четырнадцать лет."
        source: { kind: tatoeba, id: 478288 }
      - pl: "Przyszło zaledwie 50 osób."
        ru: "Пришло всего 50 человек."
        source: { kind: translated, id: 2909637 }
  - id: barely
    ru: "едва, еле-еле"
    examples:
      - pl: "Zaledwie zdążyliśmy na pociąg."
        ru: "Мы едва успели на поезд."
        source: { kind: authored }
      - pl: "Zaledwie go poznałem."
        ru: "Я едва его узнал."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Перед числом значит «всего лишь»: zaledwie 50 osób «всего 50 человек». Перед глаголом — «едва»: zaledwie zdążyliśmy «мы едва успели»." }
  - { kind: usage, text: "Может вводить придаточное времени: zaledwie wyszedł, zadzwonił telefon «едва он вышел, как зазвонил телефон»." }
  - { kind: false-friend, text: "Не путайте с ledwie «едва» без приставки — значения близки, но zaledwie сильнее подчёркивает малость." }
  - { kind: government, text: "Не изменяется. В грамматике числится то наречием, то союзом — отсюда pos: conj в словаре." }
collocations:
  - { pl: "zaledwie kilka", ru: "всего лишь несколько" }
  - { pl: "zaledwie zdążyć", ru: "едва успеть" }
etymology: "za- + ledwie «едва», праславянское *ledvь; ср. русское «едва»."
memory: "zaledwie — «всего лишь» перед числом и «едва» перед глаголом. Усиленная форма от ledwie «едва», которое прямо соответствует русскому слову."
