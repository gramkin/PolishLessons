notes:
  - { kind: false-friend, text: "NAWALIĆ похоже на русское «навалить», и это значение есть: NAWALIŁO ŚNIEGU, «навалило снега». Но в разговоре главное — «подвести, облажаться»: NAWALIŁEM — «я облажался», TECHNIKA NAWALIŁA — «техника подвела». NAWALIĆ SIĘ — «напиться», а NAWALONY — «пьяный в стельку»." }
  - { kind: usage, text: "Пятьдесят три формы: в значении «навалить» глагол переходный, отсюда страдательное NAWALONY и деепричастие NAWALIWSZY. В значении «подвести» — непереходный: NAWALIĆ Z CZYMŚ. Видовой партнёр — NAWALAĆ: CIĄGLE NAWALA, «вечно подводит»." }
  - { kind: government, text: "В чём подвести — Z с творительным: NAWALIĆ Z TERMINEM, Z ROBOTĄ. Кому навалить — дательный, чего — родительный: NAWALIĆ KOMUŚ ROBOTY. Безличное NAWALIŁO — с родительным: NAWALIŁO ŚNIEGU, LIŚCI." }
  - { kind: pronunciation, text: "Читается «нава́лиць», три слога, ударение на предпоследнем. L перед I мягкое: «ли». Конечное Ć — «ць». Повелительное NAWAL — «на́валь»." }
  - { kind: register, text: "Слово разговорное и молодёжное во всех значениях, кроме прямого «навалить». В официальном письме вместо NAWALIĆ — ZAWIEŚĆ, NIE DOTRZYMAĆ TERMINU. NAWALONY в значении «пьяный» — грубый сленг." }
collocations:
  - { pl: "nawalić z terminem", ru: "сорвать срок" }
  - { pl: "silnik nawalił", ru: "двигатель отказал" }
  - { pl: "nawalić komuś roboty", ru: "навалить на кого-то работы" }
family:
  - { pl: "walić", ru: "бить, валить", relation: root, id: walic }
  - { pl: "zawalić", ru: "обрушить; завалить", relation: root, id: zawalic }
  - { pl: "nawalac", ru: "подводить; наваливать", relation: aspect }
etymology: "Приставка NA- «на-» плюс WALIĆ «валить, бить», праславянское *valiti, то же, что русское «валить», «навалить». Значение «подвести» — от «свалиться, рухнуть»: дело рухнуло — человек подвёл."
memory: "Nawalić — в разговоре «подвести, облажаться»: nawaliłem, silnik nawalił. Nawaliło śniegu — навалило снега. Nawalić się — напиться. Читается «нава́лиць»."
idioms:
  - { pl: "nawalić na całej linii", ru: "облажаться по полной" }
