# review
id: szufla
format: 2
lemma: "szufla"
rank: 5911
pos: noun
pron: { cyr: "шу́фля" }
senses:
  - id: shovel
    ru: "совковая лопата, широкая лопата"
    examples:
      - pl: "Zgarniali śnieg z chodnika szuflą."
        ru: "Они сгребали снег с тротуара широкой лопатой."
        source: { kind: translated, id: 2671364 }
      - pl: "Weź szuflę z garażu i odśnież podjazd."
        ru: "Возьми лопату из гаража и расчисти въезд от снега."
        source: { kind: authored }
      - pl: "U tej starej szufli urwał się trzonek."
        ru: "У этой старой лопаты отломился черенок."
        source: { kind: authored }
  - id: shovelful
    ru: "лопата (количество, сколько помещается на лопату)"
    examples:
      - pl: "Wrzucił do pieca dwie szufle węgla."
        ru: "Он бросил в печь две лопаты угля."
        source: { kind: authored }
      - pl: "Do betoniarki dodaj jeszcze szuflę piasku."
        ru: "Добавь в бетономешалку ещё лопату песка."
        source: { kind: authored }
notes:
  - { kind: usage, text: "SZUFLA — широкая лопата с загнутыми краями, которой сгребают и перекидывают сыпучее: снег, уголь, песок, зерно. Копают землю другой лопатой — ŁOPATA. Маленький совок для мусора — SZUFELKA." }
  - { kind: false-friend, text: "Не путайте с SZUFLADA — это выдвижной ящик стола или комода. Слова похожи, но не родственны по смыслу: SZUFLA — лопата, SZUFLADA — ящик." }
  - { kind: usage, text: "Женский род. Родительный, дательный и местный единственного — SZUFLI. В родительном множественного две формы: SZUFEL (с беглым E) и SZUFLI. Звательный SZUFLO не употребляется." }
collocations:
  - { pl: "szufla do śniegu", ru: "лопата для снега" }
  - { pl: "szufla węgla", ru: "лопата угля" }
  - { pl: "odśnieżać szuflą", ru: "чистить снег лопатой" }
family:
  - { pl: "szufelka", ru: "совок", relation: derived }
  - { pl: "szuflować", ru: "перекидывать лопатой", relation: derived }
  - { pl: "szuflada", ru: "выдвижной ящик", relation: root, id: szuflada }
synonyms: ["łopata"]
etymology: "Из немецкого SCHAUFEL «лопата, совок»."
memory: "Szufla — лопата для снега и угля (нем. Schaufel). Szufelka — совок. Szuflada — ящик, не путать!"
idioms:
  - { pl: "zgarniać pieniądze szuflą", ru: "грести деньги лопатой" }
formExamplesSkip:
  - { form: "szuflo", reason: "звательная форма, а szufla — это лопата. Обращаться к ней некому, поэтому форма остаётся только в таблице склонения" }
