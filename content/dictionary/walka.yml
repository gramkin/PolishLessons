# review
id: walka
format: 2
lemma: "walka"
rank: 520
pos: noun
pron: { cyr: "ва́лка" }
senses:
  - id: fight
    ru: "борьба, бой"
    examples:
      - pl: "Żołnierze są gotowi do walki."
        ru: "Солдаты готовы к бою."
        source: { kind: tatoeba, id: 3279886 }
      - pl: "Został ranny w walce."
        ru: "Он был ранен в бою."
        source: { kind: translated, id: 410705 }
      - pl: "Wygram walkę."
        ru: "Я выиграю бой."
        source: { kind: translated, id: 901997 }
  - id: struggle
    ru: "схватка, поединок; борьба в переносном смысле"
    examples:
      - pl: "Karate to sztuka walki bez broni."
        ru: "Каратэ - это искусство обороны без оружия."
        source: { kind: tatoeba, id: 1355012 }
      - pl: "Życie to walka."
        ru: "Жизнь — это борьба."
        source: { kind: translated, id: 5320406 }
      - pl: "Życie jest walką ze śmiercią."
        ru: "Жизнь — это борьба со смертью."
        source: { kind: translated, id: 12061745 }
notes:
  - { kind: usage, text: "Внутри сидит walić «валить, бить», отсюда и walczyć «бороться». Русские «валить» и «свалка» — то же гнездо." }
  - { kind: usage, text: "Предлоги совпадают с русскими: walka o wolność «борьба за свободу», walka z chorobą «борьба с болезнью»." }
  - { kind: usage, text: "sztuka walki — «боевое искусство»: Karate to sztuka walki bez broni." }
  - { kind: usage, text: "walka z wiatrakami — «борьба с ветряными мельницами», тот же донкихотовский образ, что и в русском." }
collocations:
  - { pl: "sztuka walki", ru: "боевое искусство" }
  - { pl: "walka o życie", ru: "борьба за жизнь" }
  - { pl: "gotowy do walki", ru: "готовый к бою" }
  - { pl: "walka z czymś", ru: "борьба с чем-то" }
etymology: "От walić «валить, бить», праславянское *valiti; отсюда же walczyć «бороться». Русские «валить» и «свалка» — то же гнездо."
memory: "walka — «борьба, бой», от walić «валить, бить», ровно как русская «свалка» от «валить». Предлоги совпадают с русскими: walka o wolność «борьба за свободу», walka z chorobą «борьба с болезнью». Запомните sztuka walki «боевое искусство» и walka z wiatrakami «борьба с ветряными мельницами»."
idioms:
  - { pl: "sztuka walki", ru: "боевое искусство" }
  - { pl: "walka z wiatrakami", ru: "борьба с ветряными мельницами" }
  - { pl: "walka o życie", ru: "борьба за жизнь" }
