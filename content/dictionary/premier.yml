id: premier
format: 2
lemma: "premier"
rank: 4228
pos: noun
pron: { cyr: "прэ́мьер" }
senses:
  - id: prime-minister
    ru: "премьер-министр"
    examples:
      - pl: "Premier spotkał się z prezydentem."
        ru: "Премьер встретился с президентом."
        source: { kind: authored }
      - pl: "Nowy premier przedstawił rząd."
        ru: "Новый премьер представил правительство."
        source: { kind: authored }
      - pl: "Premier podał się do dymisji."
        ru: "Премьер ушёл в отставку."
        source: { kind: authored }
  - id: address
    ru: "глава правительства (в обращении)"
    examples:
      - pl: "Panie premierze, mam pytanie."
        ru: "Господин премьер, у меня вопрос."
        source: { kind: authored }
      - pl: "Pani premier odpowiedziała dziennikarzom."
        ru: "Госпожа премьер ответила журналистам."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "PREMIER — «премьер-министр», не «премьера». Премьера фильма — PREMIERA, женского рода. Полная форма — PREZES RADY MINISTRÓW, в речи — PREMIER." }
  - { kind: usage, text: "Мужской род, лицо. Множественное — PREMIERZY: R переходит в RZ. О женщине — PANI PREMIER: слово не склоняется, как PANI MINISTER." }
  - { kind: government, text: "Обращение — PANIE PREMIERZE, звательный. Встретиться с премьером — SPOTKAĆ SIĘ Z PREMIEREM, творительный. Стать премьером — ZOSTAĆ PREMIEREM." }
  - { kind: pronunciation, text: "Читается «прэ́мьер»: PRE — твёрдое «прэ», MIE — мягкое «мье». Ударение на первом слоге. PREMIERZE — «прэмье́жэ»." }
collocations:
  - { pl: "premier rządu", ru: "премьер-министр" }
  - { pl: "wicepremier", ru: "вице-премьер" }
  - { pl: "dymisja premiera", ru: "отставка премьера" }
family:
  - { pl: "premiera", ru: "премьера", relation: root, id: premiera }
  - { pl: "minister", ru: "министр", relation: root, id: minister }
  - { pl: "rząd", ru: "правительство", relation: root, id: rzad }
etymology: "Из французского PREMIER «первый», от латинского PRIMARIUS. Первый министр — отсюда и «премьер-министр»."
memory: "Premier — премьер-министр, а premiera — премьера фильма. Panie premierze! Pani premier — о женщине, без склонения. Читается «прэ́мьер»."
idioms:
  - { pl: "fotel premiera", ru: "пост премьер-министра" }
