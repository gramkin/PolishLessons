        ru: "После сорока он сменил сферу деятельности."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "BRANŻA — «отрасль, сфера», слово из французского. LUDZIE Z BRANŻY — «люди из профессии, свои». Русского «бранжа» нет, а польское слово очень частое в деловой речи." }
  - { kind: usage, text: "Девять живых форм, женский род. Родительный, дательный и местный — BRANŻY. Родительный множественного — BRANŻ. Звательный не даётся." }
  - { kind: government, text: "В отрасли — W BRANŻY, местный. Из отрасли — Z BRANŻY. Отрасль чего — прилагательным: BRANŻA BUDOWLANA, MOTORYZACYJNA." }
  - { kind: pronunciation, text: "Читается «бра́нжа», ударение на первом слоге. Ż — «ж»." }
collocations:
  - { pl: "branża IT", ru: "ИТ-сфера" }
  - { pl: "ludzie z branży", ru: "люди из профессии" }
  - { pl: "branża turystyczna", ru: "туристическая отрасль" }
family:
  - { pl: "branżowy", ru: "отраслевой, профильный", relation: derived }
  - { pl: "ludzie z branży", ru: "профессионалы отрасли", relation: derived }
  - { pl: "branża budowlana", ru: "строительная отрасль", relation: derived }
etymology: "Из французского слова со значением «ветвь, отрасль». В русском этого заимствования нет, говорят «отрасль» — тоже «ветвь»."
memory: "Branża — отрасль, сфера: branża IT. Читается «бра́нжа». Ludzie z branży — люди из профессии. W branży — в отрасли."
idioms:
