pos: noun
pron: { cyr: "бра́нжа" }
senses:
  - id: industry
    ru: "отрасль, сфера деятельности"
    examples:
      - pl: "Pracuje w branży IT."
        ru: "Он работает в ИТ-сфере."
        source: { kind: authored }
      - pl: "Branża turystyczna ucierpiała przez kryzys."
        ru: "Туристическая отрасль пострадала от кризиса."
        source: { kind: authored }
      - pl: "Zna wszystkich ludzi z branży."
        ru: "Он знает всех людей в своей сфере."
        source: { kind: authored }
      - pl: "To najlepsza firma w branży."
        ru: "Это лучшая фирма в отрасли."
        source: { kind: authored }
