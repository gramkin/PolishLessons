notes:
  - { kind: false-friend, text: "Значение совпадает с русским «специалистом», а расходится форма, и расходится она закономерно: польский сохранил конечное -A, которое русский отбросил. По этому правилу строится целый класс слов, и зная его, можно опознать десятки: ARTYSTA «артист», TURYSTA «турист», DENTYSTA «дантист», OPTYMISTA, EGOISTA, POETA «поэт», KOLEGA «коллега». Отсюда и главная практическая трудность — склонение. Второе различие в управлении: по-русски специалист «по чему-то», а по-польски SPECJALISTA OD CZEGOŚ с предлогом OD или, в официальном языке, SPECJALISTA W DZIEDZINIE CZEGOŚ." }
  - { kind: usage, text: "Одиннадцать форм, мужской род. В единственном числе слово склоняется как женское на -A: SPECJALISTY, SPECJALIŚCIE, SPECJALISTĘ, SPECJALISTĄ — окончания в точности те же, что у KOBIETA. Во множественном оно возвращается к мужскому склонению: SPECJALIŚCI, SPECJALISTÓW, SPECJALISTOM. Прилагательные при этом всегда мужские: DOBRY SPECJALISTA, а не DOBRA. Русский знает ровно эту картину в словах «мужчина», «дядя», «судья», так что приём знаком. В именительном множественного ST переходит в ŚCI: SPECJALIŚCI, и это обязательное смягчение для названий лиц." }
  - { kind: pronunciation, text: "Читается «спэцяли́ста», четыре слога, ударение на предпоследнем. Сочетание CJA даёт «ця», а не «ция»: польский стягивает латинское окончание в один слог, поэтому слово короче русского на слог. Буква E после C звучит как «э». В форме SPECJALIŚCIE сочетание ŚCI читается «сьци»: «спэцяли́сьце». В форме SPECJALIŚCI слышно «спэцяли́сьци», и это именно множественное, а не местный падеж: различает их только последняя буква." }
  - { kind: register, text: "Слово нейтральное и деловое. В медицине LEKARZ SPECJALISTA означает врача узкого профиля, в отличие от LEKARZ RODZINNY, и к такому врачу нужно направление, SKIEROWANIE DO SPECJALISTY. В объявлениях о работе стоит SPECJALISTA DO SPRAW, сокращённо SPECJALISTA DS., и дальше область: SPECJALISTA DS. SPRZEDAŻY. В разговоре слово может звучать иронически, если сказано о человеке самоуверенном: ZNALAZŁ SIĘ SPECJALISTA. Женская форма SPECJALISTKA употребляется свободно и без оговорок." }
