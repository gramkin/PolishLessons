etymology: "От латинского SPECIALIS «особый», от SPECIES «вид», с греческим по происхождению суффиксом -ISTES, который дал в польском -ISTA, а в русском -ИСТ. Разница в конце слова не случайна: польский брал такие слова через латынь и итальянский, где они кончались на -A, и сохранял этот вид целиком; русский получал их через немецкий и французский, где конечный гласный уже отпал. Поэтому польские ARTYSTA, TURYSTA и POETA выглядят как женские, а склоняются в единственном числе действительно по женскому образцу — язык подчинил заимствование своему строю. Во множественном числе мужской род берёт своё, и получается смешанная парадигма, которую русскому проще всего понять через собственное слово «мужчина»."
memory: "То же слово, что «специалист», но польский сохранил конечное -a, отброшенное русским: artysta, turysta, dentysta, poeta — целый класс. Отсюда склонение: в единственном числе как женское на -a (specjalisty, specjaliście, specjalistę), во множественном как мужское (specjaliści, specjalistów), а прилагательные всегда мужские: dobry specjalista. Русский делает так же в словах «мужчина» и «судья». Управление через od: specjalista od sieci."
