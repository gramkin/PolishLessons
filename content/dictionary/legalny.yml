# review
id: legalny
format: 2
lemma: "legalny"
rank: 3963
pos: adj
pron: { cyr: "лега́льны" }
senses:
  - id: legal
    ru: "законный, легальный"
    examples:
      - pl: "To całkowicie legalny interes."
        ru: "Это совершенно законный бизнес."
        source: { kind: authored }
      - pl: "Czy to jest legalne?"
        ru: "Это законно?"
        source: { kind: authored }
      - pl: "Ma legalną pracę i wszystkie papiery."
        ru: "У него легальная работа и все документы."
        source: { kind: authored }
  - id: licensed
    ru: "лицензионный, официальный (о копии, программе)"
    examples:
      - pl: "Kupiłem legalną wersję programu."
        ru: "Я купил лицензионную версию программы."
        source: { kind: authored }
      - pl: "Słuchaj muzyki z legalnych źródeł."
        ru: "Слушай музыку из легальных источников."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "LEGALNY шире русского «легальный»: это обычное слово для «законный» в быту. CZY TO LEGALNE? — «а это законно?». Русское «законный» в смысле «по праву положенный» — PRAWOWITY или NALEŻNY: PRAWOWITY WŁAŚCICIEL, «законный владелец». Противоположность — NIELEGALNY: NIELEGALNA PRACA, «нелегальная работа»." }
  - { kind: usage, text: "Одиннадцать форм без степеней: закон либо разрешает, либо нет. Формы для мужчин-людей живые: LEGALNI IMIGRANCI, «легальные иммигранты». Наречие — LEGALNIE: LEGALNIE ZATRUDNIONY, «официально трудоустроенный»." }
  - { kind: government, text: "Сказуемым — в именительном: TO JEST LEGALNE. В значении «разрешено где» — W: W POLSCE TO LEGALNE. «Узаконить» — ZALEGALIZOWAĆ, от того же корня." }
  - { kind: pronunciation, text: "Читается «лега́льны», ударение на предпоследнем слоге. L перед E — «ле», L перед N мягкое «ль». Наречие LEGALNIE — «лега́льне»." }
  - { kind: register, text: "Нейтральное слово, частое в разговоре и в СМИ. В юридических текстах рядом стоят ZGODNY Z PRAWEM, «соответствующий закону», и PRAWNY, «правовой»." }
collocations:
