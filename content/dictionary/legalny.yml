etymology: "Из латинского LEGALIS «законный», от LEX, LEGIS «закон». То же слово, что русское «легальный», но в польском оно стало бытовым."
memory: "Legalny — законный, легальный. Czy to legalne? — это законно? Legalna wersja programu — лицензионная. Противоположность — nielegalny."
