# review
id: zluzowac
format: 2
lemma: "zluzować"
rank: 5824
pos: verb
aspect: perf
pron: { cyr: "злюзо́ваць" }
senses:
  - id: loosen
    ru: "ослабить, отпустить (ремень, верёвку, винт)"
    examples:
      - pl: "Zluzuj pasek, bo jest za ciasno."
        ru: "Ослабь ремень, а то слишком туго."
        source: { kind: authored }
      - pl: "Kierowca zluzował hamulec ręczny."
        ru: "Водитель отпустил ручной тормоз."
        source: { kind: authored }
      - pl: "Żeglarz zluzował linę."
        ru: "Моряк ослабил канат."
        source: { kind: authored }
  - id: relieve
    ru: "сменить (на посту, на дежурстве)"
    examples:
      - pl: "O północy zluzował go kolega."
        ru: "В полночь его сменил товарищ."
        source: { kind: authored }
      - pl: "Wartownicy zostali zluzowani o świcie."
        ru: "Часовых сменили на рассвете."
        source: { kind: authored }
  - id: chill
    ru: "расслабиться, сбавить напор"
    note: "разг."
    examples:
      - pl: "Zluzuj trochę, nie ma pośpiechu."
        ru: "Расслабься немного, спешить некуда."
        source: { kind: authored }
      - pl: "Po egzaminach wreszcie zluzowałam."
        ru: "После экзаменов я наконец расслабилась."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Совершенный вид; несовершенный — LUZOWAĆ. Как все глаголы на -OWAĆ, в будущем меняет -OWA- на -UJ-: ZLUZUJĘ, ZLUZUJESZ, ZLUZUJĄ, повелительное ZLUZUJ!" }
  - { kind: government, text: "Что — винительный: ZLUZOWAĆ PASEK, LINĘ, ŚRUBĘ. Кого — тоже винительный: ZLUZOWAĆ WARTOWNIKA «сменить часового». В значении «расслабиться» дополнения нет: ZLUZUJ! — то же, что WYLUZUJ!" }
  - { kind: usage, text: "Корень — LUZ «слабина, зазор; спокойствие», немецкого происхождения. Глагол означает «дать слабину», а с людьми — «сменить на посту», то есть дать отдохнуть." }
collocations:
  - { pl: "zluzować pasek", ru: "ослабить ремень" }
  - { pl: "zluzować hamulec", ru: "отпустить тормоз" }
  - { pl: "zluzować śrubę", ru: "ослабить винт" }
family:
  - { pl: "luz", ru: "люфт, слабина; спокойствие", relation: root, id: luz }
  - { pl: "luzować", ru: "ослаблять; сменять", relation: aspect }
  - { pl: "luźny", ru: "свободный, просторный", relation: root }
  - { pl: "wyluzować", ru: "расслабиться", relation: derived, id: wyluzowac }
  - { pl: "rozluźnić", ru: "ослабить, расслабить", relation: root, id: rozluznic }
etymology: "Приставка Z- плюс LUZOWAĆ, от LUZ «слабина, зазор», из немецкого LOS «свободный, незакреплённый»."
memory: "Zluzować — дать luz, «слабину»: zluzuj pasek — «ослабь ремень»."
idioms:
  - { pl: "zluzować wartę", ru: "сменить караул" }
