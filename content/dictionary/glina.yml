senses:
  - id: clay
    ru: "глина"
    examples:
      - pl: "Glina jest podstawowym składnikiem w garncarstwie."
        ru: "Глина — основной материал в гончарном деле."
        source: { kind: translated, id: 6316976 }
      - pl: "Słońce utwardza glinę."
        ru: "Солнце затвердевает глину."
        source: { kind: translated, id: 6316926 }
      - pl: "On uformował miskę z gliny."
        ru: "Он вылепил миску из глины."
        source: { kind: translated, id: 6316927 }
  - id: clay-work
    ru: "lepić z gliny — лепить из глины"
    examples:
      - pl: "Utwardził glinę poprzez włożenie jej do ognia."
        ru: "Он затвердил глину, положив её в огонь."
        source: { kind: translated, id: 6316979 }
      - pl: "Pokrywamy ścianę gliną."
        ru: "Мы покрываем стену глиной."
        source: { kind: translated, id: 6316960 }
      - pl: "Wyrabiał glinę gołymi rękami."
        ru: "Он месил глину голыми руками."
        source: { kind: authored }
  - id: cop
    ru: "glina — мент, полицейский (разговорное)"
    note: "То же слово, второе значение — только по контексту."
    examples:
      - pl: "Skąd wiedziałeś, że ten facet to glina?"
        ru: "Откуда ты знал, что этот тип — мент?"
        source: { kind: translated, id: 3111712 }
      - pl: "Jesteś gliną?"
        ru: "Ты мент?"
        source: { kind: translated, id: 8620961 }
      - pl: "Tom był gliną przez 13 lat."
        ru: "Том был ментом тринадцать лет."
        source: { kind: translated, id: 12832291 }
  - id: cops
    ru: "gliny — менты"
    examples:
      - pl: "To gliny."
        ru: "Это менты."
        source: { kind: translated, id: 2265042 }
      - pl: "Gliny tym się zajmą."
        ru: "Менты этим займутся."
        source: { kind: translated, id: 12072951 }
      - pl: "Nie jesteśmy glinami."
        ru: "Мы не менты."
        source: { kind: translated, id: 3979028 }
notes:
  - { kind: usage, text: "Одно слово — два далёких значения. glina — это «глина» как материал и, в разговорной речи, «мент, полицейский». Различает только контекст: Glina jest składnikiem w garncarstwie, но Jesteś gliną? «Ты мент?»." }
  - { kind: register, text: "Разговорное значение примерно той же грубости, что русское «мент»: фамильярно и слегка пренебрежительно, но вполне печатно. Нейтральное слово — policjant." }
  - { kind: usage, text: "В значении «полицейский» слово мужского рода по смыслу, но склоняется по женскому образцу: ten glina, tego gliny, z tym gliną — как mężczyzna или kolega." }
  - { kind: usage, text: "ulepiony z tej samej gliny значит «слеплен из того же теста»: русский говорит про тесто, поляк — про глину." }
collocations:
  - { pl: "lepić z gliny", ru: "лепить из глины" }
  - { pl: "ulepiony z tej samej gliny", ru: "слеплен из того же теста" }
  - { pl: "ten glina", ru: "этот мент" }
  - { pl: "gliny", ru: "менты" }
family:
  - { pl: "gliniany", ru: "глиняный", relation: derived }
  - { pl: "glinka", ru: "глинка", relation: derived }
  - { pl: "policjant", ru: "полицейский", relation: root }
  - { pl: "garncarz", ru: "гончар", relation: root }
etymology: "Праславянское *glina — то же слово, что русское «глина»; праиндоевропейский корень *glei- «липкое, скользкое» дал и английское clay, и польские glon «водоросль», glista «глист»."
memory: "glina — это и «глина», и разговорное «мент». Различает контекст, а заодно и род: материал женского рода (ta glina), а полицейский — мужского по смыслу, но склоняется по женскому образцу: ten glina, tego gliny, z tym gliną. И запомните идиому ulepiony z tej samej gliny «слеплен из того же теста»: русский говорит про тесто, поляк про глину."
idioms:
  - { pl: "ulepiony z tej samej gliny", ru: "слеплен из того же теста" }
  - { pl: "lepić z gliny", ru: "лепить из глины" }
  - { pl: "ten glina", ru: "этот мент" }
formExamplesSkip:
  - { form: "glino", reason: "звательный падеж не употребляется: в значении «глина» — у неодушевлённого, а в разговорном значении так не обращаются" }
  - { form: "gliny", cell: "Звательный", reason: "звательный падеж: к предмету или понятию не обращаются" }
