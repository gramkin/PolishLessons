notes:
  - { kind: false-friend, text: "JEŹDZIEC — «всадник», только верхом на коне, хотя корень тот же, что в JEŹDZIĆ «ездить». Водитель машины — KIEROWCA, велосипедист — ROWERZYSTA. Конный спорт — JEŹDZIECTWO." }
  - { kind: usage, text: "Десять живых форм, мужской род, лицо. Беглое E и смягчение всей группы: JEŹDZIEC, но JEŹDŹCA, JEŹDŹCY. Книжный звательный JEŹDŹCZE не даётся: в живой речи к всаднику так не обращаются." }
  - { kind: government, text: "Всадник на коне — JEŹDZIEC NA KONIU, NA с местным. Стать наездником — ZOSTAĆ JEŹDŹCEM, творительный. Конь сбросил всадника — KOŃ ZRZUCIŁ JEŹDŹCA, винительный равен родительному." }
  - { kind: pronunciation, text: "Читается «е́зьдзец», ударение на первом слоге. JE — «е», ŹDZ — мягкое «зьдз», как в JEŹDZIĆ «е́зьдзиць». В форме JEŹDŹCA: «е́зьдзьца»." }
  - { kind: register, text: "Слово нейтральное: в спорте, в истории, в литературе. JEŹDZIEC BEZ GŁOWY — польское название романа Майн Рида «Всадник без головы»." }
collocations:
  - { pl: "jeździec bez głowy", ru: "всадник без головы" }
  - { pl: "doświadczony jeździec", ru: "опытный наездник" }
  - { pl: "jeździec na koniu", ru: "всадник на коне" }
family:
  - { pl: "jeździć", ru: "ездить", relation: root, id: jezdzic }
  - { pl: "jechać", ru: "ехать", relation: root, id: jechac }
  - { pl: "jeździectwo", ru: "конный спорт", relation: derived }
etymology: "От JEŹDZIĆ «ездить» с суффиксом деятеля -EC: «тот, кто ездит верхом». ŹDZ отвечает русскому «зд» в «ездить», а JE- — русскому начальному «е-»."
memory: "Jeździec — всадник, от jeździć «ездить». Читается «е́зьдзец». Koń zrzucił jeźdźca — конь сбросил всадника. Kierowca — водитель."
idioms:
  - { pl: "czterej jeźdźcy Apokalipsy", ru: "четыре всадника Апокалипсиса" }
formExamplesSkip:
  - { form: "jeźdźcze", reason: "книжный звательный падеж; в живой речи не употребляется" }
