rank: 4624
pos: noun
pron: { cyr: "е́зьдзец" }
senses:
  - id: rider
    ru: "всадник, наездник"
    examples:
      - pl: "Jeździec dosiadł konia."
        ru: "Всадник сел на коня."
        source: { kind: authored }
      - pl: "Jest świetnym jeźdźcem."
        ru: "Он отличный наездник."
        source: { kind: authored }
      - pl: "Jeźdźcy przemknęli przez wieś."
        ru: "Всадники промчались через деревню."
        source: { kind: authored }
      - pl: "Konia prowadził młody jeździec."
        ru: "Коня вёл молодой наездник."
        source: { kind: authored }
