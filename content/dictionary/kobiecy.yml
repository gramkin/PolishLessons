notes:
  - { kind: false-friend, text: "Русское «женский» покрывает сразу два польских прилагательных, и выбор между ними — главное содержание карточки. KOBIECY значит «женственный, присущий женщине»: KOBIECA INTUICJA, KOBIECY GŁOS, KOBIECA URODA. ŻEŃSKI значит «женский» как разряд, категория: RODZAJ ŻEŃSKI «женский род» в грамматике, DRUŻYNA ŻEŃSKA «женская команда», SZKOŁA ŻEŃSKA, KOŃCÓWKA ŻEŃSKA «женское окончание». Сказать RODZAJ KOBIECY о грамматическом роде — ошибка, и наоборот, ŻEŃSKA INTUICJA звучит как из зоологического справочника. Правило: природа и качество — KOBIECY, классификация и пол — ŻEŃSKI." }
  - { kind: usage, text: "Это относительное прилагательное, и степеней сравнения оно не образует: нельзя сказать BARDZIEJ KOBIECY в строгом смысле, хотя в разговоре о внешности такое встречается. Отсюда и десять форм в таблице — на одну меньше, чем у TELEFONICZNY и HANDLOWY, и причина грамматическая: мужско-личной формы множественного числа у этого прилагательного нет, потому что она требовала бы мужчин в роли носителей женственности как разряда. PoliMorf такой формы не приводит, и парадигма остаётся десятичленной." }
  - { kind: pronunciation, text: "Читается «кобе́цы», ударение на предпоследнем слоге. Сочетание BIE даёт «бе», одним слогом, с мягким b: буква I здесь знак мягкости, а не отдельная гласная. Конечное -CY звучит «цы», с твёрдым ц и гласной «ы». Женская форма KOBIECA читается «кобе́ца», средняя KOBIECE — «кобе́цэ». Корневое слово KOBIETA произносится «кобе́та», и его стоит проговорить вместе с прилагательным, чтобы закрепить чтение BIE." }
  - { kind: government, text: "Прилагательное согласуется с существительным и ничем не управляет. Устойчивые сочетания стоит выучить блоком, потому что они частотны: KOBIECA URODA «женская красота», KOBIECY WDZIĘK «женское обаяние», PRASA KOBIECA «женская пресса», DZIAŁ KOBIECY «женский отдел», PIŁKA NOŻNA KOBIECA, хотя в спорте чаще скажут ŻEŃSKA. Существительное — KOBIECOŚĆ «женственность», наречие — KOBIECO. Противоположность — MĘSKI «мужской», и там, в отличие от женской пары, одно слово покрывает оба значения." }
