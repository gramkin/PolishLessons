etymology: "От KOBIETA «женщина», и само это существительное — польская особенность, которой в русском нет. Общеславянское название женщины было ŻONA, и в польском оно сузилось до «жены», как и в русском, но на освободившееся место русский поставил «женщину», произведённое от той же «жены», а польский взял слово KOBIETA, происхождение которого спорно и в старопольском отчётливо пренебрежительное: в текстах шестнадцатого века оно ещё брань. К восемнадцатому веку слово очистилось и стало нейтральным, а затем и единственным. Поэтому KOBIECY и русское «женский» значат одно, а корни у них разные: польский от KOBIETA, русский от «жены». Прилагательное образовано суффиксом -CY с переходом T в C, как в KOBIETA и KOBIECY, ŚWIAT и ŚWIECKI."
memory: "Русское «женский» делится на два: kobiecy — женственный, по природе и качеству (kobieca intuicja), а żeński — женский как разряд (rodzaj żeński, drużyna żeńska). Rodzaj kobiecy сказать нельзя. Относительное, степеней нет, и мужско-личной формы множественного у него тоже нет — отсюда десять форм. От kobieta, слова со спорным и некогда бранным происхождением, вытеснившего żona из общего значения."
