# review
id: sloik
format: 2
lemma: "słoik"
rank: 5667
pos: noun
pron: { cyr: "суо́ик" }
senses:
  - id: jar
    ru: "банка (стеклянная)"
    examples:
      - pl: "Na stole stał słoik z dżemem."
        ru: "На столе стояла банка с джемом."
        source: { kind: tatoeba, id: 3744944 }
      - pl: "Możesz otworzyć mi ten słoik?"
        ru: "Можешь открыть мне эту банку?"
        source: { kind: translated, id: 12689937 }
      - pl: "Słoik dżemu."
        ru: "Банка варенья."
        source: { kind: translated, id: 13030244 }
  - id: jar-lid
    ru: "банка (в сочетаниях о крышке)"
    examples:
      - pl: "Zakrętka od słoika."
        ru: "Крышка от банки."
        source: { kind: translated, id: 13030201 }
      - pl: "Nie mogę otworzyć tego słoika."
        ru: "Я не могу открыть эту банку."
        source: { kind: translated, id: 4438996 }
notes:
  - { kind: government, text: "Мужской неодушевлённый; родительный — słoika. Банка варенья — słoik dżemu, с родительным." }
  - { kind: false-friend, text: "От słój «слой, кольцо на срезе дерева» и одновременно «банка». Русский «слой» — то же слово, но значение «банка» в русском не развилось." }
  - { kind: usage, text: "Zakręcany słoik «закручивающаяся банка», zakrętka «крышка». Глагол zakręcić «закрутить»." }
  - { kind: usage, text: "Разговорно słoik — прозвище приезжего, который возит из дома банки с едой. Это шутливое и слегка обидное словцо." }
collocations:
  - { pl: "słoik dżemu", ru: "банка варенья" }
  - { pl: "zakrętka od słoika", ru: "крышка от банки" }
etymology: "От słój «слой; банка». Русский «слой» — то же слово, но значения «банка» в нём нет."
memory: "słoik — стеклянная «банка»: słoik dżemu. Крышка — zakrętka. Разговорно słoik ещё и шутливое прозвище приезжего."
idioms:
  - { pl: "słoik dżemu", ru: "банка варенья" }
