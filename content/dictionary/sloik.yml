pron: { cyr: "суо́ик" }
senses:
  - id: jar
    ru: "банка (стеклянная)"
    examples:
      - pl: "Na stole stał słoik z dżemem."
        ru: "На столе стояла банка с джемом."
        source: { kind: tatoeba, id: 3744944 }
      - pl: "Możesz otworzyć mi ten słoik?"
        ru: "Можешь открыть мне эту банку?"
        source: { kind: translated, id: 12689937 }
