      - pl: "Pożywienie dostarcza nam białek, węglowodanów i tłuszczów."
        ru: "Пища даёт нам белки, углеводы и жиры."
        source: { kind: authored }
      - pl: "Cukier to najprostszy węglowodan."
        ru: "Сахар — простейший углевод."
        source: { kind: authored }
      - pl: "Ziemniaki są bogate w węglowodany."
        ru: "Картофель богат углеводами."
        source: { kind: authored }
      - pl: "Sportowcy jedzą dużo węglowodanów przed zawodami."
        ru: "Спортсмены едят много углеводов перед соревнованиями."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Мужской род, неодушевлённый; родительный единственного на -U: WĘGLOWODANU. В разговоре о еде почти всегда множественное: WĘGLOWODANY, BEZ WĘGLOWODANÓW." }
  - { kind: government, text: "«Богат углеводами» по-польски — BOGATY W WĘGLOWODANY (предлог W + винительный), а не творительный, как в русском." }
  - { kind: pronunciation, text: "Читается «вэнглово́дан»: Ę перед G звучит как «эн». Ударение на предпоследнем слоге, на WO." }
collocations:
  - { pl: "węglowodany proste", ru: "простые (быстрые) углеводы" }
  - { pl: "węglowodany złożone", ru: "сложные углеводы" }
  - { pl: "ograniczać węglowodany", ru: "ограничивать углеводы" }
  - { pl: "bogaty w węglowodany", ru: "богатый углеводами" }
family:
  - { pl: "węgiel", ru: "уголь; углерод", relation: root, id: wegiel }
  - { pl: "woda", ru: "вода", relation: root, id: woda }
  - { pl: "węglowodanowy", ru: "углеводный", relation: derived }
synonyms: ["sacharyd", "cukier"]
etymology: "Сложное слово WĘGIEL «углерод» + WODA «вода», построенное так же, как русское «углевод»."
memory: "Węglowodan = węgiel + woda, точно как «угле-вод». Ę перед G — «эн»: «вэнглово́дан»."
idioms:
