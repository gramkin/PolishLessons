# review
id: weglowodan
format: 2
lemma: "węglowodan"
rank: 5989
pos: noun
pron: { cyr: "вэнглово́дан" }
senses:
  - id: carbohydrate
    ru: "углевод"
    note: "Чаще во множественном числе: WĘGLOWODANY — «углеводы» в питании."
    examples:
      - pl: "Lekarz kazał mi jeść mniej węglowodanów."
