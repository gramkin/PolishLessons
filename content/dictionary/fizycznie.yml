notes:
  - { kind: false-friend, text: "FIZYCZNIE — «физически», перевод прямой. Прилагательное FIZYCZNY в одном сочетании расходится с русским: PRACOWNIK FIZYCZNY — «рабочий», человек физического труда. OSOBA FIZYCZNA — «физическое лицо», как и в русском." }
  - { kind: usage, text: "Наречие, одна форма, без степеней. Пара к нему — PSYCHICZNIE: FIZYCZNIE ZDROWY, PSYCHICZNIE ZMĘCZONY. Заниматься физическим трудом — PRACOWAĆ FIZYCZNIE." }
  - { kind: government, text: "Наречие ничем не управляет. Обычно определяет прилагательное или глагол: FIZYCZNIE ZMĘCZONY, FIZYCZNIE OBECNY." }
  - { kind: pronunciation, text: "Читается «физы́чне», ударение на предпоследнем слоге. ZY — твёрдое «зы», CZNIE — «чне»." }
