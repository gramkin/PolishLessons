notes:
  - { kind: false-friend, text: "Ловушки в значении нет: GITARA это «гитара», слово пришло в оба языка из одного источника. Зато есть ловушка в форме, и она касается одной буквы. В дательном и местном падеже R переходит в RZ: GITARZE, и читается это «гитаже». Поэтому GRAĆ NA GITARZE «играть на гитаре» звучит совсем не похоже на именительный, и узнать слово на слух бывает трудно. То же чередование было на карточках RURA с формой RURZE и LITERA с формой LITERZE: это общее правило польского, а не особенность отдельных слов." }
  - { kind: government, text: "Женский род на -A, склонение правильное. На чём играют — предлог NA с местным: GRAĆ NA GITARZE, и это совпадает с русским «играть на гитаре». Винительный на -Ę употребляется, когда гитара объект действия: WZIĄĆ GITARĘ, ZAGRAĆ GITARĘ о партии. Родительный множественного GITAR, без окончания. Дательный и местный единственного совпадают в форме GITARZE, с чередованием R в RZ. При отрицании винительный уходит в родительный: NIE MAM GITARY." }
  - { kind: pronunciation, text: "Читается «гита́ра», ударение на предпоследнем слоге из трёх, как и в русском. Начальное G твёрдое, звук «г». Главное место — форма GITARZE: сочетание RZ даёт «ж», поэтому «гита́же», а не «гитарзе» и не «гитаре». Это тот же звук, что в RZEKA «река» и в фамилиях на -RZEWSKI. В родительном множественного GITAR один слог на конце: «гита́р», и конечное R звучит ясно, без оглушения." }
  - { kind: usage, text: "Частотные сочетания: GRAĆ NA GITARZE «играть на гитаре», GITARA AKUSTYCZNA, GITARA ELEKTRYCZNA, GITARA BASOWA «бас-гитара», LEKCJE GITARY «уроки гитары». Исполнитель — GITARZYSTA, мужского рода с окончанием -A, тот же тип, что DENTYSTA и ARTYSTA; женская форма GITARZYSTKA. Обратите внимание, что в названии профессии тоже стоит RZ, и это облегчает запоминание чередования: GITARA, но GITARZE и GITARZYSTA." }
