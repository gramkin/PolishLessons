etymology: "Через немецкое GITARRE из испанского GUITARRA, которое идёт от арабского QĪTĀRA и далее от греческого KITHARA — названия струнного инструмента, давшего и слово «кифара». Русская «гитара» пришла тем же путём, через западноевропейское посредство, поэтому слова совпадают до буквы. Любопытно, что греческая KITHARA дала в европейских языках два разных слова: учёное «кифара» для античного инструмента и бытовое «гитара» для современного, причём второе прошло через арабский и испанский, набрав по дороге удвоенное R. Чередование R и RZ в польской форме GITARZE к происхождению слова отношения не имеет: это уже славянское правило, которое польский применяет ко всем словам на -RA, своим и заимствованным одинаково."
memory: "Значение как в русском, подвох в форме: дательный и местный — gitarze, с r→rz, и читается «гита́же». Grać na gitarze «играть на гитаре». То же чередование, что в rura — rurze и litera — literze: общее правило, а не исключение. Гитарист — gitarzysta, мужского рода на -a, как dentysta; в нём то же rz, и это помогает запомнить чередование."
