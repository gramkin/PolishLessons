# review
id: porzadnie
format: 2
lemma: "porządnie"
rank: 2073
pos: adv
pron: { cyr: "пожо́ндне" }
senses:
  - id: properly
    ru: "как следует, аккуратно, добросовестно"
    examples:
      - pl: "On wszystko robi porządnie."
        ru: "Он всё делает как следует."
        source: { kind: translated, id: 840194 }
      - pl: "Musisz porządniej uczyć się japońskiego."
        ru: "Тебе надо как следует учить японский."
        source: { kind: translated, id: 367770 }
      - pl: "Szkoda, że się nie uczysz porządniej."
        ru: "Жаль, что ты не учишься как следует."
        source: { kind: translated, id: 925874 }
  - id: thoroughly
    ru: "изрядно, основательно (об усилении)"
    examples:
      - pl: "Zrobiło się porządnie zimno."
        ru: "Стало изрядно холодно."
        source: { kind: translated, id: 361787 }
      - pl: "Kiedy pada, to porządnie."
        ru: "Когда идёт дождь, то уж основательно."
        source: { kind: translated, id: 606040 }
notes:
  - { kind: usage, text: "Два оттенка: «аккуратно, добросовестно» (robić coś porządnie) и усилительное «изрядно, как следует» (porządnie zimno «изрядно холодно»)." }
  - { kind: false-friend, text: "Корень porządek «порядок» — ср. русское «порядок», «порядочно». Русское «порядочно» тоже умеет значить «изрядно»." }
  - { kind: government, text: "Наречие от прилагательного porządny «порядочный, добротный»; сравнительная степень — porządniej." }
  - { kind: usage, text: "В отличие от русского «порядочно», у польского слова нет нравственного оттенка: о человеке скажут porządny człowiek «порядочный человек», но наречие про качество работы." }
collocations:
  - { pl: "robić coś porządnie", ru: "делать что-л. как следует" }
  - { pl: "porządnie zimno", ru: "изрядно холодно" }
etymology: "От porządny «порядочный, добротный», от porządek «порядок»; ср. русское «порядок», «порядочно»."
memory: "porządnie — «как следует, добросовестно», а с прилагательными ещё и «изрядно»: porządnie zimno. Корень porządek = русский «порядок»."
