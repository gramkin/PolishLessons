  - id: in-sky
    ru: "na niebie — на небе"
    examples:
      - pl: "Ptak jest na niebie."
        ru: "Птица в небе."
        source: { kind: tatoeba, id: 3840180 }
      - pl: "Na niebie nie ma chmur."
        ru: "На небе нет облаков."
        source: { kind: tatoeba, id: 3461116 }
      - pl: "Był w siódmym niebie."
        ru: "Он был на седьмом небе."
        source: { kind: tatoeba, id: 2659620 }
  - id: from-sky
    ru: "z nieba — с неба"
    examples:
      - pl: "Bogowie zstąpili z nieba."
        ru: "Боги пришли с неба."
        source: { kind: tatoeba, id: 10876448 }
      - pl: "To było jak grom z jasnego nieba."
        ru: "Это было как гром среди ясного неба."
        source: { kind: tatoeba, id: 353886 }
      - pl: "Wielkie nieba!"
        ru: "Боже мой!"
        source: { kind: translated, id: 750965 }
  - id: idioms
    ru: "pod gołym niebem, niebo i ziemia"
    examples:
      - pl: "Spali pod gołym niebem."
        ru: "Они спали под открытым небом."
        source: { kind: authored }
      - pl: "To niebo i ziemia."
        ru: "Это небо и земля."
        source: { kind: authored }
      - pl: "Poruszył niebo i ziemię."
        ru: "Он перевернул небо и землю."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Идиомы переносятся дословно, и это редкий случай полного совпадения: jak grom z jasnego nieba «как гром среди ясного неба», być w siódmym niebie «быть на седьмом небе», pod gołym niebem «под открытым небом»." }
  - { kind: usage, text: "Обычного множественного у слова нет. «Небеса» — это niebiosa, с косвенными niebios, niebiosom. Старая форма сохранилась в восклицании Wielkie nieba! «Боже мой!»." }
  - { kind: usage, text: "От niebo сделано niebieski «синий» — буквально «небесного цвета». Русское «синий» такой связи не показывает, и это хороший крючок для запоминания." }
  - { kind: usage, text: "Ещё ходовые: niebo w gębie — о вкусной еде, «пальчики оближешь»; manna z nieba «манна небесная»." }
collocations:
