  - { pl: "niebiański", ru: "небесный", relation: derived }
etymology: "Праславянское *nebo, множественное *nebesa, от праиндоевропейского *nébhos «облако» — то же слово, что русские «небо» и «небеса»; родственны греческое νέφος и латинское nebula «туман»."
memory: "niebo — «небо», слово то же самое, и идиомы переносятся дословно: jak grom z jasnego nieba, być w siódmym niebie. Особенностей две. Обычного множественного нет — «небеса» это niebiosa, а Wielkie nieba! сохраняет старую форму. И от niebo сделано niebieski «синий», буквально «небесного цвета»."
