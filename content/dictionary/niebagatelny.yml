etymology: "nie + bagatelny «пустяковый», от bagatela «пустяк», из итальянского bagattella через французский."
memory: "niebagatelny — «немалый, значительный», буквально «не пустяковый» (bagatela «пустяк»). Значительность подчёркивается отрицанием, как в русском «немалый»."
