notes:
  - { kind: usage, text: "Книжное слово, почти всегда перед существительным: niebagatelna kwota «немалая сумма», niebagatelny wpływ «немалое влияние»." }
  - { kind: false-friend, text: "Образовано через отрицание: nie + bagatelny «пустяковый», от bagatela «пустяк». То же слово, что музыкальная «багатель»." }
  - { kind: government, text: "Обычное прилагательное на -y, поэтому согласуется по роду: niebagatelny wpływ, niebagatelna kwota, niebagatelne ryzyko." }
  - { kind: usage, text: "Приём литоты: значительность подчёркивается через отрицание пустяка, ровно как в русском «немалый»." }
