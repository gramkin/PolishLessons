# review
id: przytrzymac
format: 2
lemma: "przytrzymać"
rank: 3799
pos: verb
pron: { cyr: "пшытшы́маць" }
senses:
  - id: hold
    ru: "придержать, подержать"
    examples:
      - pl: "Przytrzymaj mi drzwi, proszę."
        ru: "Придержи мне дверь, пожалуйста."
        source: { kind: authored }
      - pl: "Przytrzymał drabinę, kiedy wchodziłem."
        ru: "Он придержал лестницу, когда я поднимался."
        source: { kind: authored }
      - pl: "Przytrzymasz torbę przez chwilę?"
        ru: "Подержишь сумку минутку?"
        source: { kind: authored }
  - id: detain
    ru: "задержать, удержать (человека)"
    examples:
      - pl: "Ochrona przytrzymała złodzieja do przyjazdu policji."
        ru: "Охрана задержала вора до приезда полиции."
        source: { kind: authored }
      - pl: "Szef przytrzymał mnie w biurze do ósmej."
        ru: "Начальник продержал меня в офисе до восьми."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "PRZYTRZYMAĆ — «придержать», ненадолго и чтобы помочь: PRZYTRZYMAĆ DRZWI, PRZYTRZYMAĆ DRABINĘ. Русское «задержать» на работе или в дороге — ZATRZYMAĆ. Но о нарушителе, которого держат до приезда полиции, говорят именно PRZYTRZYMAĆ: PRZYTRZYMAĆ ZŁODZIEJA." }
  - { kind: usage, text: "Пятьдесят три формы — подпись переходного глагола совершенного вида: страдательное PRZYTRZYMANY и деепричастие PRZYTRZYMAWSZY. Видовой партнёр — PRZYTRZYMYWAĆ: PRZYTRZYMYWAŁ JEJ PŁASZCZ. Спряжение на -AM, -ASZ, -A, как у TRZYMAĆ." }
  - { kind: government, text: "Что или кого — винительный: PRZYTRZYMAĆ DRZWI, PRZYTRZYMAĆ PSA. Для кого — дательный: PRZYTRZYMAJ MI TO. За что — ZA с винительным: PRZYTRZYMAĆ KOGOŚ ZA RĘKĘ, ZA RAMIĘ. С отрицанием — родительный: NIE PRZYTRZYMAŁ DRZWI." }
  - { kind: pronunciation, text: "Читается «пшытшы́маць», три слога, ударение на предпоследнем. PRZY — «пшы»: RZ после P оглушается. TRZY — «тшы»: T и SZ звучат отдельно, не «ч». Повелительное PRZYTRZYMAJ — «пшытшы́май»." }
  - { kind: register, text: "Нейтральный бытовой глагол. Самое частое употребление — просьба: PRZYTRZYMAJ, PROSZĘ, «подержи, пожалуйста». В полицейских сводках: SPRAWCĘ PRZYTRZYMALI ŚWIADKOWIE, «преступника задержали свидетели»." }
collocations:
  - { pl: "przytrzymać drzwi", ru: "придержать дверь" }
  - { pl: "przytrzymać za rękę", ru: "придержать за руку" }
  - { pl: "przytrzymać złodzieja", ru: "задержать вора" }
family:
  - { pl: "przytrzymywać", ru: "придерживать", relation: aspect }
  - { pl: "trzymać", ru: "держать", relation: root, id: trzymac }
  - { pl: "zatrzymać", ru: "остановить, задержать", relation: root, id: zatrzymac }
etymology: "Приставка PRZY- «при-» плюс TRZYMAĆ «держать». TRZYMAĆ — общезападнославянское слово, в русском ему соответствует «держать». Дословно PRZYTRZYMAĆ — «придержать»."
memory: "Przytrzymać — придержать: przytrzymaj drzwi, przytrzymaj mi torbę. Przytrzymać złodzieja — задержать до полиции. Остановить — zatrzymać. Читается «пшытшы́маць»."
idioms:
  - { pl: "przytrzymać kogoś za słowo", ru: "поймать кого-то на слове" }
