# review
id: sniadanie
format: 2
lemma: "śniadanie"
rank: 1222
pos: noun
pron: { cyr: "сьняда́не" }
senses:
  - id: breakfast
    ru: "завтрак"
    examples:
      - pl: "Tom teraz je śniadanie."
        ru: "Том сейчас завтракает."
        source: { kind: tatoeba, id: 4716806 }
      - pl: "Czy śniadanie gotowe?"
        ru: "Завтрак готов?"
        source: { kind: tatoeba, id: 538552 }
      - pl: "Bob robi rano śniadanie."
        ru: "Боб утром готовит завтрак."
        source: { kind: tatoeba, id: 771876 }
  - id: eat-breakfast
    ru: "jeść śniadanie — завтракать (отдельного глагола нет)"
    examples:
      - pl: "Nie jem śniadania."
        ru: "Я не завтракаю."
        source: { kind: tatoeba, id: 12681786 }
      - pl: "Dziś rano byłam tak zajęta, że nawet nie zdążyłam zjeść śniadania."
        ru: "Сегодня утром я была так занята, что даже не успела позавтракать."
        source: { kind: tatoeba, id: 11751145 }
      - pl: "Jeszcze nie jadłem śniadania."
        ru: "Я ещё не завтракал."
        source: { kind: translated, id: 590549 }
notes:
  - { kind: usage, text: "Завтракать по-польски — jeść śniadanie, буквально «есть завтрак». Отдельного глагола в обиходе нет: старое śniadać вышло из употребления." }
  - { kind: government, text: "Предлоги размечают день: na śniadanie «на завтрак» (винительный), przed śniadaniem «перед завтраком» (творительный), po śniadaniu «после завтрака» (предложный)." }
  - { kind: usage, text: "Ряд приёмов пищи: śniadanie «завтрак», obiad «обед», kolacja «ужин». Польский obiad обычно позже русского обеда, ближе к вечеру." }
  - { kind: pronunciation, text: "Начальное śni- звучит мягко, «сьня-», а ударение падает на предпоследний слог: śniaDAnie." }
collocations:
  - { pl: "jeść śniadanie", ru: "завтракать" }
  - { pl: "na śniadanie", ru: "на завтрак" }
  - { pl: "przed śniadaniem", ru: "перед завтраком" }
  - { pl: "robić śniadanie", ru: "готовить завтрак" }
etymology: "Отглагольное существительное от старого śniadać «завтракать», из праславянского *sъnědati «съедать». Русское «снедь» — из того же гнезда."
memory: "śniadanie — «завтрак», а «завтракать» будет jeść śniadanie: отдельного глагола нет. Держите в голове три предлога: na śniadanie, przed śniadaniem, po śniadaniu. Родственное русское слово — «снедь»."
idioms:
  - { pl: "jeść śniadanie", ru: "завтракать" }
  - { pl: "na śniadanie", ru: "на завтрак" }
  - { pl: "pokój ze śniadaniem", ru: "номер с завтраком" }
