# review
id: upic
format: 2
lemma: "upić"
rank: 5016
pos: verb
pron: { cyr: "у́пиць" }
senses:
  - id: get-drunk
    ru: "с SIĘ — напиться, опьянеть; без SIĘ — напоить (кого-то)"
    examples:
      - pl: "Upił się na weselu kolegi."
        ru: "Он напился на свадьбе приятеля."
        source: { kind: authored }
      - pl: "Chcieli go upić, żeby wszystko wygadał."
        ru: "Они хотели его напоить, чтобы он всё выболтал."
        source: { kind: authored }
      - pl: "Nie upij się, jutro jedziesz."
        ru: "Смотри не напейся, завтра тебе ехать."
        source: { kind: authored }
  - id: sip
    ru: "отпить (немного)"
    examples:
      - pl: "Upiła łyk herbaty i odstawiła kubek."
        ru: "Она отпила глоток чая и поставила кружку."
        source: { kind: authored }
      - pl: "Upij trochę, bo się wyleje."
        ru: "Отпей немного, а то прольётся."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "UPIĆ — не «выпить» целиком: «выпить» — WYPIĆ. UPIĆ ŁYK — «отпить глоток», UPIĆ SIĘ — «напиться допьяна». «Напиться воды» — NAPIĆ SIĘ WODY, а не UPIĆ SIĘ: UPIĆ SIĘ WODĄ звучит как шутка." }
  - { kind: usage, text: "Пятьдесят три формы. Страдательное UPITY — разговорное «пьяный»: BYŁ KOMPLETNIE UPITY. Спряжение как у PIĆ: UPIJĘ, UPIJESZ, повелительное UPIJ. Несовершенный вид — UPIJAĆ: UPIJA SIĘ CO WEEKEND." }
  - { kind: government, text: "Кого — винительный: UPIĆ GOŚCI. Чем — творительный: UPIĆ SIĘ WÓDKĄ, UPIĆ SIĘ SZCZĘŚCIEM «опьянеть от счастья». Чего отпить — родительный или винительный: UPIĆ WINA, UPIĆ ŁYK." }
  - { kind: pronunciation, text: "Читается «у́пиць», ударение на первом слоге. UPIJĘ — «упи́е», UPIŁ — «у́пиу»: Ł — «у»." }
  - { kind: register, text: "UPIĆ SIĘ — разговорное и нейтральное для бытового «напиться». Грубее — NAWALIĆ SIĘ, ZALAĆ SIĘ. UPIĆ SIĘ SZCZĘŚCIEM, UPIĆ SIĘ SUKCESEM — книжные метафоры." }
collocations:
  - { pl: "upić się na weselu", ru: "напиться на свадьбе" }
  - { pl: "upić łyk", ru: "отпить глоток" }
  - { pl: "upić się sukcesem", ru: "опьянеть от успеха" }
family:
  - { pl: "pić", ru: "пить", relation: root, id: pic }
  - { pl: "wypić", ru: "выпить", relation: derived, id: wypic }
  - { pl: "pijany", ru: "пьяный", relation: derived, id: pijany }
etymology: "Приставка U- плюс PIĆ «пить», праславянское *piti. Русское «упиться», «опоить» — то же гнездо."
memory: "Upić się — напиться: upił się na weselu. Upić łyk — отпить. Wypić — выпить целиком. Читается «у́пиць»."
idioms:
  - { pl: "upić się w trupa", ru: "напиться в стельку, до беспамятства" }
