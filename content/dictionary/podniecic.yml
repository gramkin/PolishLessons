# review
id: podniecic
format: 2
lemma: "podniecić"
rank: 5212
pos: verb
pron: { cyr: "подне́циць" }
senses:
  - id: excite
    ru: "возбудить, взбудоражить (толпу, воображение)"
    examples:
      - pl: "Mecz podniecił kibiców."
        ru: "Матч взбудоражил болельщиков."
        source: { kind: authored }
      - pl: "Ta historia podnieciła jego wyobraźnię."
        ru: "Эта история разожгла его воображение."
        source: { kind: authored }
      - pl: "Plotki podnieciły całą wieś."
        ru: "Сплетни взбудоражили всю деревню."
        source: { kind: authored }
  - id: get-excited
    ru: "с SIĘ — разволноваться, возбудиться"
    examples:
      - pl: "Dzieci podnieciły się na widok śniegu."
        ru: "Дети разволновались при виде снега."
        source: { kind: authored }
      - pl: "Podniecili się wynikiem wyborów."
        ru: "Их взбудоражили итоги выборов."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "PODNIECIĆ — «возбудить», и часто с эротическим оттенком. Нейтральное «я в предвкушении, взволнован» — JESTEM PODEKSCYTOWANY, а не PODNIECONY. PODNIECONY TŁUM — «возбуждённая толпа» — звучит нормально." }
  - { kind: usage, text: "Сорок девять форм: повелительное наклонение и безличная форма PODNIECONO не употребляются. Будущее: PODNIECĘ, PODNIECISZ. Несовершенный вид — PODNIECAĆ. PODNIECENIE — «возбуждение, волнение»: Z PODNIECENIEM «с волнением»." }
  - { kind: government, text: "Кого или что — винительный: PODNIECIĆ TŁUM, WYOBRAŹNIĘ. Чем — творительный: PODNIECIĆ KOGOŚ OBIETNICĄ; с SIĘ — PODNIECIĆ SIĘ WIADOMOŚCIĄ." }
  - { kind: pronunciation, text: "Читается «подне́циць»: NIE — «не», CI — «ци», ударение на предпоследнем слоге. PODNIECĘ — «подне́цэ»." }
  - { kind: register, text: "О толпе, воображении, детях — нейтральное. О человеке без уточнения — интимное, его лучше избегать в официальной речи и заменять на PODEKSCYTOWAĆ." }
collocations:
  - { pl: "podniecić tłum", ru: "взбудоражить толпу" }
  - { pl: "podniecić wyobraźnię", ru: "разжечь воображение" }
  - { pl: "z podnieceniem", ru: "с волнением" }
family:
  - { pl: "niecić", ru: "разжигать (огонь)", relation: root }
  - { pl: "podniecenie", ru: "возбуждение, волнение", relation: derived }
  - { pl: "podniecać", ru: "возбуждать", relation: aspect }
etymology: "Приставка POD- плюс старое NIECIĆ «разжигать огонь», праславянское *nětiti. Буквально — «подложить огня»."
memory: "Podniecić — возбудить, взбудоражить: mecz podniecił kibiców. «Я взволнован» — jestem podekscytowany, а не podniecony. Читается «подне́циць»."
idioms:
  - { pl: "podniecić czyjąś wyobraźnię", ru: "разжечь чьё-то воображение" }
