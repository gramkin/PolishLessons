# review
id: ostrozny
format: 2
lemma: "ostrożny"
rank: 1443
pos: adj
pron: { cyr: "остро́жны" }
senses:
  - id: careful
    ru: "осторожный, внимательный"
    examples:
      - pl: "Muszę być ostrożny."
        ru: "Я должен быть осторожным."
        source: { kind: tatoeba, id: 3460234 }
      - pl: "Bądź ostrożny. Podłoga jest śliska."
        ru: "Будь осторожен, пол скользкий."
        source: { kind: tatoeba, id: 12274833 }
      - pl: "Jesteśmy ostrożni."
        ru: "Мы осторожны."
        source: { kind: tatoeba, id: 8428337 }
  - id: cautious
    ru: "осмотрительный, осторожный (о решениях)"
    examples:
      - pl: "Trudno być zbyt ostrożnym w doborze przyjaciół."
        ru: "Трудно быть слишком осторожным в выборе друзей."
        source: { kind: translated, id: 357642 }
      - pl: "Ta sytuacja wymaga ostrożnego potraktowania."
        ru: "Эта ситуация требует осторожного обращения."
        source: { kind: translated, id: 827293 }
notes:
  - { kind: usage, text: "Bądź ostrożny! — «Будь осторожен!», самая частая форма. Наречие ostrożnie уже есть отдельной карточкой." }
  - { kind: government, text: "ostrożny z czymś — «осторожен с чем-то», с творительным: Bądź ostrożna z żyletką." }
  - { kind: usage, text: "nie można być za ostrożnym — «нельзя быть слишком осторожным», устойчивый оборот." }
  - { kind: usage, text: "Степени сравнения регулярные: ostrożniejszy «осторожнее», najostrożniejszy «самый осторожный»." }
collocations:
  - { pl: "bądź ostrożny", ru: "будь осторожен" }
  - { pl: "ostrożny kierowca", ru: "осторожный водитель" }
  - { pl: "być ostrożnym z czymś", ru: "быть осторожным с чем-либо" }
etymology: "Того же корня, что straż «стража» и ostrzegać «предостерегать». Русское «осторожный» собрано от «сторожить» — образ тот же самый."
memory: "ostrożny — «осторожный», и русское слово собрано тем же способом, от «сторожить». Главная фраза — Bądź ostrożny! Управление с творительным: ostrożny z nożem."
idioms:
  - { pl: "bądź ostrożny", ru: "будь осторожен" }
  - { pl: "nie można być za ostrożnym", ru: "нельзя быть слишком осторожным" }
  - { pl: "ostrożny jak lis", ru: "осторожный как лиса" }
