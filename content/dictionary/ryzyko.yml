etymology: "Из итальянского risico через немецкий; русское «риск» пришло тем же путём. Разница в роде: польское слово среднего рода, русское мужского."
memory: "ryzyko — «риск», но среднего рода: to ryzyko, duże ryzyko. Идти на риск — podejmować ryzyko; na własne ryzyko «на свой страх и риск»."
