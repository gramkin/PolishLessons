notes:
  - { kind: government, text: "Идти на риск — podejmować ryzyko (винительный падеж); сознавать риск — być świadomym ryzyka (родительный)." }
  - { kind: usage, text: "na własne ryzyko — «на свой страх и риск», буквально «на собственный риск»." }
  - { kind: usage, text: "Глагол — ryzykować «рисковать»; прилагательное ryzykowny «рискованный»." }
  - { kind: false-friend, text: "Слово среднего рода: to ryzyko, duże ryzyko. Русское «риск» мужского рода, поэтому согласование отличается." }
  - { kind: usage, text: "Множественное число ryzyka (родительный ryzyk) — термин страхования и финансов: zarządzanie ryzykami «управление рисками». В обычной речи слово остаётся в единственном числе." }
collocations:
