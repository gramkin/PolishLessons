# review
id: wspominac
format: 2
lemma: "wspominać"
rank: 1437
pos: verb
aspect: imperf
aspectPair: wspomniec
pron: { cyr: "фспоми́наць" }
senses:
  - id: reminisce
    ru: "вспоминать (с чувством, о прошлом)"
    examples:
      - pl: "Każdy wspomina swą młodość jako beztroski okres."
        ru: "Каждый вспоминает свою молодость как беззаботную пору."
        source: { kind: translated, id: 705299 }
      - pl: "Miło wspominam cały czas, który razem spędziliśmy."
        ru: "Я с теплом вспоминаю всё время, что мы провели вместе."
        source: { kind: translated, id: 776325 }
      - pl: "Lubią wspominać dawne czasy."
        ru: "Они любят вспоминать былые времена."
        source: { kind: translated, id: 1623022 }
  - id: mention
    ru: "упоминать, вскользь говорить"
    examples:
      - pl: "Nie wspominaj o tym nikomu."
        ru: "Не упоминай об этом никому."
        source: { kind: translated, id: 4006932 }
      - pl: "Tom nie wspominał mi nic o tym."
        ru: "Том мне ничего об этом не упоминал."
        source: { kind: translated, id: 3070614 }
  - id: let-alone
    ru: "nie wspominając o… — не говоря уже о…"
    examples:
      - pl: "Ona umie grać na skrzypcach, nie wspominając o pianinie."
        ru: "Она умеет играть на скрипке, не говоря уже о фортепиано."
        source: { kind: translated, id: 531014 }
notes:
  - { kind: government, text: "Падеж задаёт смысл: wspominać coś (винительный) — «вспоминать что-то» (wspomina młodość), а wspominać o czymś (предложный с o) — «упоминать о чём-то» (nie wspominaj o tym)." }
  - { kind: usage, text: "Несовершенный вид к wspomnieć." }
  - { kind: usage, text: "nie wspominając o… — «не говоря уже о…», очень частый книжный оборот." }
  - { kind: false-friend, text: "Различайте wspominać «вспоминать, упоминать», pamiętać «помнить» и przypominać sobie «припоминать». Русское «вспоминать» покрывает первое и третье сразу." }
collocations:
  - { pl: "mile wspominać", ru: "тепло вспоминать" }
  - { pl: "wspominać o czymś", ru: "упоминать о чём-либо" }
  - { pl: "nie wspominając o", ru: "не говоря уже о" }
etymology: "Приставка w- и spominać, от pomnieć «помнить» (праславянское *pomьněti). Русское «вспоминать» собрано из тех же частей."
memory: "wspominać — и «вспоминать», и «упоминать». Разницу задаёт падеж: wspominać młodość «вспоминать молодость» (винительный), но wspominać o czymś «упоминать о чём-то». И запомните оборот nie wspominając o… «не говоря уже о…»."
idioms:
  - { pl: "nie wspominając o", ru: "не говоря уже о" }
  - { pl: "mile wspominać", ru: "тепло вспоминать" }
  - { pl: "wspominać dawne czasy", ru: "вспоминать былые времена" }
