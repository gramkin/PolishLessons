formExamples:
  - form: "wspomina"
    pl: "W książce nie wspomina o swoim zawodzie."
    ru: "В книге он не упоминает о своей профессии."
    source: { kind: translated, id: 365529 }
  - form: "wspomina"
    pl: "Ona z wielkim rozrzewnieniem wspomina męża."
    ru: "Она с большим умилением вспоминает мужа."
    source: { kind: translated, id: 746169 }
  - form: "wspomina"
    pl: "Każdy wspomina swą młodość jako beztroski okres."
    ru: "Каждый вспоминает свою молодость как беззаботную пору."
    source: { kind: translated, id: 705299 }
  - form: "wspominać"
    pl: "Lubią wspominać dawne czasy."
    ru: "Они любят вспоминать былые времена."
    source: { kind: translated, id: 1623022 }
  - form: "wspominać"
    pl: "Ona nie mówi po angielsku, a o francuskim to już nie ma co wspominać."
    ru: "Она не говорит по-английски, а о французском и говорить нечего."
    source: { kind: translated, id: 728558 }
  - form: "wspominać"
    pl: "Nie chcę o tym wspominać."
    ru: "Я не хочу об этом упоминать."
    source: { kind: authored }
  - form: "wspominaj"
    pl: "Nie wspominaj o tym Mary."
    ru: "Не упоминай об этом Мэри."
    source: { kind: translated, id: 3672745 }
  - form: "wspominaj"
    pl: "Nie wspominaj o tym nikomu."
    ru: "Не упоминай об этом никому."
    source: { kind: translated, id: 4006932 }
  - form: "wspominaj"
    pl: "Nie wspominaj dzieciom o tym wypadku."
    ru: "Не упоминай детям об этом происшествии."
    source: { kind: translated, id: 924465 }
  - form: "wspominają"
    pl: "Niech państwo nigdy więcej o tym nie wspominają."
    ru: "Пусть господа больше никогда об этом не упоминают."
    source: { kind: translated, id: 3881869 }
  - form: "wspominają"
    pl: "Rzadko wspominają o tamtym roku."
    ru: "Они редко вспоминают о том годе."
    source: { kind: authored }
  - form: "wspominają"
    pl: "Starzy przyjaciele często wspominają szkołę."
    ru: "Старые друзья часто вспоминают школу."
    source: { kind: authored }
  - form: "wspominając"
    pl: "Ona umie grać na skrzypcach, nie wspominając o pianinie."
    ru: "Она умеет играть на скрипке, не говоря уже о фортепиано."
    source: { kind: translated, id: 531014 }
  - form: "wspominając"
    pl: "Ona mówi po niemiecku i francusku, nie wspominając już o angielskim."
    ru: "Она говорит по-немецки и по-французски, не говоря уже об английском."
    source: { kind: translated, id: 3000042 }
  - form: "wspominając"
    pl: "Uznał, że robi mu przysługę nie wspominając o tym."
    ru: "Он решил, что делает ему одолжение, не упоминая об этом."
    source: { kind: translated, id: 6301907 }
  - form: "wspominajcie"
    pl: "Nigdy więcej o tym nie wspominajcie."
    ru: "Больше никогда об этом не упоминайте."
    source: { kind: translated, id: 3881866 }
  - form: "wspominajcie"
    pl: "Wspominajcie nas dobrze."
    ru: "Вспоминайте нас добром."
    source: { kind: authored }
  - form: "wspominajcie"
    pl: "Nie wspominajcie o tym przy dzieciach."
    ru: "Не упоминайте об этом при детях."
    source: { kind: authored }
  - form: "wspominał"
    pl: "Nigdy już o tym nie wspominał."
    ru: "Он больше никогда об этом не упоминал."
    source: { kind: translated, id: 3977854 }
  - form: "wspominał"
    pl: "Tom nie wspominał mi nic o tym."
    ru: "Том мне ничего об этом не упоминал."
    source: { kind: translated, id: 3070614 }
  - form: "wspominał"
    pl: "On wspominał czasy, które spędził w Rzymie."
    ru: "Он вспоминал времена, которые провёл в Риме."
    source: { kind: translated, id: 12954430 }
  - form: "wspominała"
    pl: "Czy ona wspominała coś o wypadku?"
    ru: "Она упоминала что-нибудь об аварии?"
    source: { kind: translated, id: 6106113 }
  - form: "wspominała"
    pl: "Sally wspominała czasy, kiedy jej babcia była silna i zdrowa."
    ru: "Салли вспоминала времена, когда её бабушка была сильной и здоровой."
    source: { kind: translated, id: 656179 }
  - form: "wspominała"
    pl: "Często wspominała dzieciństwo."
    ru: "Она часто вспоминала детство."
    source: { kind: authored }
  - form: "wspominam"
    pl: "Wspominam pierwszy raz."
    ru: "Я вспоминаю первый раз."
    source: { kind: translated, id: 643810 }
  - form: "wspominam"
    pl: "Miło wspominam cały czas, który razem spędziliśmy."
    ru: "Я с теплом вспоминаю всё время, что мы провели вместе."
    source: { kind: translated, id: 776325 }
  - form: "wspominam"
    pl: "Kiedy tak pięknie pada deszcz, wspominam nas oboje sprzed kilku lat."
    ru: "Когда так красиво идёт дождь, я вспоминаю нас обоих несколько лет назад."
    source: { kind: translated, id: 1863918 }
  - form: "wspominamy"
    pl: "Gdy tylko wspominamy o Meksyku zaraz myślimy o tacos."
    ru: "Как только мы упоминаем Мексику, сразу думаем о тако."
    source: { kind: translated, id: 1895936 }
  - form: "wspominamy"
    pl: "Wspominamy ten dzień co roku."
    ru: "Мы вспоминаем этот день каждый год."
    source: { kind: authored }
  - form: "wspominamy"
    pl: "Często wspominamy tamte wakacje."
    ru: "Мы часто вспоминаем тот отпуск."
    source: { kind: authored }
