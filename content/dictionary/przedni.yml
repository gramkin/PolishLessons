        ru: "Передние колёса новые."
        source: { kind: authored }
  - id: excellent
    ru: "отменный, превосходный (книжн., шутл.)"
    examples:
      - pl: "To było przednie wino."
        ru: "Это было отменное вино."
        source: { kind: authored }
      - pl: "Opowiedział przedni dowcip."
        ru: "Он рассказал отменный анекдот."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "PRZEDNI — «передний»: PRZEDNIE SIEDZENIE, PRZEDNIA SZYBA, «лобовое стекло». Но у слова есть и второе, неожиданное значение — «отменный»: PRZEDNIE WINO, PRZEDNIA ZABAWA, PRZEDNI ŻART. Русское «передовой» — POSTĘPOWY или NOWATORSKI, не PRZEDNI." }
  - { kind: usage, text: "Десять форм на мягкую основу: -NI, -NIA, -NIE, -NIEGO. Форма для мужчин-людей совпадает с мужским единственным. Степени в карточку не включены: PRZEDNIEJSZY — старинное «наилучший» и сегодня не употребляется. Наречие PRZEDNIO — «превосходно»: BAWIĆ SIĘ PRZEDNIO." }
  - { kind: government, text: "В значении «передний» обычно перед существительным: PRZEDNIE DRZWI, PRZEDNI NAPĘD, «передний привод». Противоположность — TYLNY, «задний»: TYLNE KOŁA." }
  - { kind: pronunciation, text: "Читается «пшэ́дни», два слога, ударение на первом. RZ после P оглушается в «ш»: «пшэ», не «прже». E — твёрдое «э», конечное NI мягкое." }
  - { kind: register, text: "«Передний» — нейтральное, техническое слово. «Отменный» — книжное и шутливое, с оттенком старины: PRZEDNIA ZABAWA звучит как у Сенкевича. В быту вместо него — ŚWIETNY, SUPER." }
collocations:
  - { pl: "przednie siedzenie", ru: "переднее сиденье" }
  - { pl: "przednia szyba", ru: "лобовое стекло" }
  - { pl: "przednia zabawa", ru: "отличное веселье" }
family:
  - { pl: "przód", ru: "перед, передняя часть", relation: root, id: przod }
