lemma: "przedni"
rank: 4445
pos: adj
pron: { cyr: "пшэ́дни" }
senses:
  - id: front
    ru: "передний"
    examples:
      - pl: "Usiadł na przednim siedzeniu."
        ru: "Он сел на переднее сиденье."
        source: { kind: authored }
      - pl: "Pies złamał przednią łapę."
