  - { pl: "tylny", ru: "задний", relation: root, id: tylny }
etymology: "От PRZÓD «перёд», того же корня, что предлог PRZED и русское «перед». Значение «отменный» — от «передний, первый по качеству», как русское «первосортный»."
memory: "Przedni — передний: przednie siedzenie, przednia szyba. И ещё «отменный»: przednie wino, przednia zabawa. Задний — tylny. Читается «пшэ́дни»."
idioms:
