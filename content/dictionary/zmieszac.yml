# review
id: zmieszac
format: 2
lemma: "zmieszać"
rank: 5294
pos: verb
pron: { cyr: "зме́шаць" }
senses:
  - id: mix
    ru: "смешать, перемешать"
    examples:
      - pl: "Zmieszaj mąkę z cukrem."
        ru: "Смешай муку с сахаром."
        source: { kind: authored }
      - pl: "Zmieszał farby i powstał zielony kolor."
        ru: "Он смешал краски, и получился зелёный цвет."
        source: { kind: authored }
      - pl: "Nie zmieszaj czystych ubrań z brudnymi."
        ru: "Не смешай чистую одежду с грязной."
        source: { kind: authored }
  - id: embarrass
    ru: "смутить; смутиться (zmieszać się)"
    examples:
      - pl: "Jego pytanie mnie zmieszało."
        ru: "Его вопрос меня смутил."
        source: { kind: authored }
      - pl: "Zmieszała się i spuściła wzrok."
        ru: "Она смутилась и опустила глаза."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ZMIESZAĆ — «смешать», но и «смутить»: ZMIESZAŁ MNIE, «он меня смутил». ZMIESZAĆ SIĘ — «смутиться, растеряться», а не «смешаться в толпе» (это WMIESZAĆ SIĘ W TŁUM). ZMIESZAĆ KOGOŚ Z BŁOTEM — «смешать с грязью», как по-русски." }
  - { kind: usage, text: "Пятьдесят три формы — подпись переходного глагола совершенного вида: страдательное ZMIESZANY — «смешанный» и «смущённый» — и деепричастие ZMIESZAWSZY. Спряжение на -AM: ZMIESZAM, ZMIESZASZ. Видовой партнёр — MIESZAĆ: MIESZAĆ ZUPĘ, «помешивать суп»." }
  - { kind: government, text: "Что с чем — винительный и Z с творительным: ZMIESZAĆ JAJKA Z MLEKIEM. Кого чем смутить — винительный и творительный: ZMIESZAĆ KOGOŚ PYTANIEM. Возвратное ZMIESZAĆ SIĘ — без дополнения." }
  - { kind: pronunciation, text: "Читается «зме́шаць», три слога: ZMIE-SZAĆ, ударение на предпоследнем. IE после M — «ме», SZ — твёрдое «ш». Конечное Ć — «ць»." }
  - { kind: register, text: "Нейтральное слово кухни и быта. «Смутиться» — чуть книжное: ZMIESZAŁ SIĘ, gdy ją zobaczył. Устойчивое: ZMIESZAĆ Z BŁOTEM — «смешать с грязью», о жёсткой критике." }
collocations:
  - { pl: "zmieszać składniki", ru: "смешать ингредиенты" }
  - { pl: "zmieszać się", ru: "смутиться" }
  - { pl: "zmieszać z błotem", ru: "смешать с грязью" }
family:
  - { pl: "mieszać", ru: "мешать, смешивать", relation: aspect, id: mieszac }
  - { pl: "mieszanka", ru: "смесь", relation: derived, id: mieszanka }
  - { pl: "wymieszać", ru: "перемешать", relation: root }
etymology: "Приставка Z- плюс MIESZAĆ «мешать, смешивать», праславянское *měšati, то же, что русское «мешать», «смешать». Значение «смутить» — образ «перемешать мысли»."
memory: "Zmieszać — смешать: mąkę z cukrem. И смутить: pytanie mnie zmieszało. Zmieszać się — смутиться. Zmieszać z błotem — смешать с грязью. Читается «зме́шаць»."
idioms:
  - { pl: "zmieszać kogoś z błotem", ru: "смешать кого-то с грязью" }
