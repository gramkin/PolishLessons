aspect: imperf
pron: { cyr: "вгуэ́мбяць" }
senses:
  - id: delve
    ru: "wgłębiać się — вникать, углубляться (в тему, детали)"
    examples:
      - pl: "Nie chcę się wgłębiać w szczegóły."
        ru: "Не хочу вдаваться в подробности."
        source: { kind: authored }
      - pl: "Im bardziej wgłębiam się w temat, tym mniej rozumiem."
        ru: "Чем глубже я вникаю в тему, тем меньше понимаю."
        source: { kind: authored }
      - pl: "Studenci wgłębiają się w historię regionu."
        ru: "Студенты углубляются в историю края."
        source: { kind: authored }
  - id: sink
    ru: "вдавливать, заглублять (во что-то); тех."
    examples:
      - pl: "Robotnicy wgłębiają fundament w twardy grunt."
        ru: "Рабочие заглубляют фундамент в твёрдый грунт."
        source: { kind: authored }
      - pl: "Dom był częściowo wgłębiany w zbocze."
        ru: "Дом частично врезали в склон."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Почти всегда с SIĘ: WGŁĘBIAĆ SIĘ W COŚ — «вникать, углубляться во что-то»: W SZCZEGÓŁY, W LEKTURĘ, W TEMAT. Без SIĘ — редкое техническое «вдавливать, утапливать, заглублять»: WGŁĘBIAĆ FUNDAMENT W GRUNT. Мужско-личное страдательное WGŁĘBIANI в карточку не включено: заглубляют предметы и постройки, а не людей." }
  - { kind: government, text: "Во что — W + винительный, как в русском «вникать во что»: WGŁĘBIAĆ SIĘ W PROBLEM, а не W PROBLEMIE. Предложный падеж здесь — частая ошибка." }
  - { kind: usage, text: "Несовершенный вид; совершенный — WGŁĘBIĆ SIĘ. Синонимы: ZAGŁĘBIAĆ SIĘ (то же и в прямом смысле «погружаться»), ZGŁĘBIAĆ «досконально изучать» — он переходный, без SIĘ: ZGŁĘBIAĆ TEMAT. Частая вежливая отговорка: NIE BĘDĘ SIĘ WGŁĘBIAĆ «не буду вдаваться в подробности»." }
  - { kind: pronunciation, text: "Читается «вгуэ́мбяць»: Ł — «у», Ę перед B — «эм», BI перед гласной — мягкое «бь» без отдельного «и»." }
collocations:
  - { pl: "wgłębiać się w szczegóły", ru: "вдаваться в подробности" }
  - { pl: "wgłębiać się w lekturę", ru: "погружаться в чтение" }
  - { pl: "wgłębiać się w temat", ru: "вникать в тему" }
family:
  - { pl: "wgłębić", ru: "углубить, вникнуть (wgłębić się)", relation: aspect }
  - { pl: "głęboki", ru: "глубокий", relation: root, id: gleboki }
  - { pl: "zgłębić", ru: "досконально изучить", relation: root, id: zglebic }
