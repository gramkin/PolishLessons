etymology: "Приставка W- «в» плюс корень GŁĘB- из GŁĘBOKI, GŁĄB «глубь»; буквально «вглубляться». Тот же корень — в русском «глубина», «углубляться»."
memory: "Wgłębiać się — «в глубь»: głęboki «глубокий». Wgłębiam się w temat — углубляюсь в тему."
idioms:
  - { pl: "nie wgłębiać się w szczegóły", ru: "не вдаваться в подробности" }
formExamplesSkip:
