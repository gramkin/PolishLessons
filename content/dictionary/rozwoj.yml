notes:
  - { kind: pronunciation, text: "Читается «ро́звуй», ударение на первом слоге из двух. Буква Ó даёт «у», поэтому не «розвой», а «ро́звуй». И здесь карточка повторяет правило из ODWRÓT: Ó стоит в именительном, потому что слог закрыт согласной J, а во всех косвенных падежах, где за ним идёт гласная, возвращается обычное O: ROZWÓJ, но ROZWOJU, ROZWOJEM, ROZWOJE. То же в самом ODWRÓT и ODWROTU, и в паре WÓZ и WOZU." }
  - { kind: government, text: "Мужской род, неодушевлённое, и парадигма у него девятичленная: родительный и местный падеж единственного числа совпадают в форме ROZWOJU, как у WYSIŁEK, POŚPIECH, DYSK и BLOK. Поэтому BEZ ROZWOJU «без развития» и W ROZWOJU «в развитии» выглядят одинаково. Чего развитие — родительный без предлога: ROZWÓJ MIASTA, ROZWÓJ GOSPODARCZY как прилагательное. При отрицании винительный уходит в родительный: NIE ZAHAMOWALI ROZWOJU." }
  - { kind: usage, text: "Устойчивые сочетания стоит выучить блоком, потому что они частотны в прессе и в документах: ROZWÓJ GOSPODARCZY «экономическое развитие», ZRÓWNOWAŻONY ROZWÓJ «устойчивое развитие», ROZWÓJ WYPADKÓW «развитие событий», KRAJ ROZWIJAJĄCY SIĘ «развивающаяся страна». Глагол — ROZWIJAĆ «развивать» и ROZWIJAĆ SIĘ «развиваться», и в нём тот же корень WIJ-, что в WIĆ «вить». Множественное число ROZWOJE в живой речи редко и звучит специально." }
  - { kind: false-friend, text: "Значение совпадает с русским «развитием» полностью, а строение слова — нет, и разбор стоит знать. ROZWÓJ собран из приставки ROZ- «раз-» и корня WÓJ от WIĆ «вить», то есть буквально «развивание, разматывание»: что-то свёрнутое разворачивают. Русское «развитие» построено точно так же, из «раз-» и «вить», и совпадение здесь полное, вплоть до образа клубка. Поэтому слово не надо запоминать как чужое: достаточно увидеть в нём «раз-вить», и остаётся только правило с Ó в закрытом слоге." }
