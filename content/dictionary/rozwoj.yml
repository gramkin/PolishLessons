etymology: "От ROZWIJAĆ «развивать, разворачивать», из приставки ROZ- и корня *vi- «вить», того же, что в WIĆ, POWÓJ «вьюнок» и в русских «вить», «развить», «повой». Образ предметный и понятный: свёрнутое разворачивают, клубок размотан. Русское «развитие» собрано из тех же двух частей и тем же способом, так что это один из редких случаев полного совпадения в строении, а не только в значении. Чередование I и Ó в корне — обычное польское: WIĆ, ale ROZWÓJ, как BIĆ и BÓJ, PIĆ и NAPÓJ «напиток». Этот ряд стоит запомнить целиком, он объясняет сразу несколько частых слов."
memory: "Ó только в закрытом слоге: rozwój, но rozwoju, rozwojem — то же, что odwrót и odwrotu. Родительный и местный совпадают в rozwoju, отсюда девять форм, как у wysiłek и blok. Строение полностью совпадает с русским «развитием»: roz- плюс корень wić «вить». Ряд чередования: bić и bój, pić и napój, wić и rozwój."
