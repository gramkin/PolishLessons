  - id: outrage
    ru: "безобразие, позор"
    examples:
      - pl: "To skandal, że pociąg znowu się spóźnia!"
        ru: "Это безобразие, что поезд опять опаздывает!"
        source: { kind: authored }
      - pl: "Takie ceny to skandal."
        ru: "Такие цены — это позор."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "SKANDAL — «скандал» как громкая история, о которой пишут газеты, и как «безобразие»: TO SKANDAL! Но ссора с криками дома — AWANTURA или KŁÓTNIA: «устроить скандал» — ZROBIĆ AWANTURĘ." }
  - { kind: usage, text: "Мужской род, неодушевлённое. Родительный — SKANDALU. Родительный множественного — SKANDALI, вариант SKANDALÓW встречается реже." }
  - { kind: government, text: "Скандал вокруг кого — SKANDAL WOKÓŁ и родительный. Быть замешанным в скандале — BYĆ ZAMIESZANYM W SKANDAL, винительный. После скандала — PO SKANDALU." }
  - { kind: pronunciation, text: "Читается «ска́ндал», ударение на первом слоге. Конечное L — твёрдое «л»." }
collocations:
  - { pl: "skandal obyczajowy", ru: "скандал на почве морали" }
  - { pl: "wywołać skandal", ru: "вызвать скандал" }
  - { pl: "to skandal", ru: "это безобразие" }
family:
  - { pl: "skandaliczny", ru: "скандальный, возмутительный", relation: derived }
  - { pl: "afera", ru: "афера, громкое дело", relation: root }
  - { pl: "awantura", ru: "скандал, ссора", relation: root }
etymology: "Из греческого SKANDALON «ловушка, камень преткновения», через латынь и французский. Русское «скандал» — то же слово."
memory: "Skandal — громкий скандал или «безобразие!»; ссора с криками — awantura. To skandal! — это позор! Читается «ска́ндал»."
