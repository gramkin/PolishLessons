notes:
  - { kind: usage, text: "Как и все названия языков, GRECKI работает и как существительное: UCZĘ SIĘ GRECKIEGO «я учу греческий», PRZETŁUMACZYĆ Z GRECKIEGO «перевести с греческого». Наречие — PO GRECKU: MÓWIĆ PO GRECKU «говорить по-гречески». Прилагательное пишется со строчной буквы, а народ и страна с прописной: GREK «грек», GRECZYNKA «гречанка», GRECJA «Греция»." }
  - { kind: usage, text: "В мужско-личном множественном K переходит в C: GRECKI → GRECCY, как POLSKI → POLSCY, ROSYJSKI → ROSYJSCY. GRECCY TURYŚCI «греческие туристы», но GRECKIE WYSPY «греческие острова». Степеней сравнения у относительного прилагательного нет, поэтому форм одиннадцать." }
  - { kind: pronunciation, text: "Читается «гре́цки», ударение на первом слоге. В форме GRECCY два C подряд дают долгое «цц»: «гре́ццы». После K буква I читается как мягкое «и», а после CC буква Y — как «ы»." }
collocations:
  - { pl: "kuchnia grecka", ru: "греческая кухня" }
  - { pl: "język grecki", ru: "греческий язык" }
  - { pl: "jogurt grecki", ru: "греческий йогурт" }
