  - { pl: "Grek", ru: "грек", relation: root }
  - { pl: "Greczynka", ru: "гречанка", relation: root }
  - { pl: "po grecku", ru: "по-гречески", relation: derived }
synonyms: ["helleński"]
etymology: "От GREK «грек», восходящего к латинскому GRAECUS. Русское «греческий» того же происхождения."
memory: "Grecki — греческий, «гре́цки». Язык: uczę się greckiego. Люди во множественном: greccy, как polscy. И do greckich kalend — значит никогда."
idioms:
