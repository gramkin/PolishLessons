# review
id: przyjazd
format: 2
lemma: "przyjazd"
rank: 4005
pos: noun
pron: { cyr: "пшы́яст" }
senses:
  - id: arrival
    ru: "приезд, прибытие"
    examples:
      - pl: "Czekamy na przyjazd gości."
        ru: "Мы ждём приезда гостей."
        source: { kind: authored }
      - pl: "Po przyjeździe zadzwoń do mnie."
        ru: "По приезде позвони мне."
        source: { kind: authored }
      - pl: "Przyjazd pociągu opóźni się o godzinę."
        ru: "Прибытие поезда задержится на час."
        source: { kind: authored }
      - pl: "Na tablicy wyświetlono przyjazdy i odjazdy."
        ru: "На табло показаны прибытия и отправления."
        source: { kind: authored }
      - pl: "Przygotowania do przyjazdu trwały tydzień."
        ru: "Подготовка к приезду длилась неделю."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "PRZYJAZD — «приезд» на транспорте. Приход пешком — PRZYJŚCIE, прилёт — PRZYLOT. На вокзальном табло: PRZYJAZDY — «прибытие», ODJAZDY — «отправление»." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. В местном падеже A переходит в E, а ZD — в ŹDZ: PO PRZYJEŹDZIE, «по приезде». Родительный — PRZYJAZDU." }
  - { kind: government, text: "По приезде — PO PRZYJEŹDZIE, PO с местным. Перед приездом — PRZED PRZYJAZDEM. Ждать приезда — CZEKAĆ NA PRZYJAZD, NA с винительным, а не родительный, как в русском." }
  - { kind: pronunciation, text: "Читается «пшы́яст», ударение на первом слоге. PRZY — «пшы», конечное ZD оглушается в «ст»." }
collocations:
  - { pl: "po przyjeździe", ru: "по приезде" }
  - { pl: "czekać na przyjazd", ru: "ждать приезда" }
  - { pl: "godzina przyjazdu", ru: "время прибытия" }
family:
  - { pl: "przyjechać", ru: "приехать", relation: root, id: przyjechac }
  - { pl: "jazda", ru: "езда", relation: root, id: jazda }
  - { pl: "przyjezdny", ru: "приезжий", relation: derived }
etymology: "PRZY- «при-» и корень JAZD- от JECHAĆ «ехать». Русское «приезд» построено точно так же, только польский корень с A: JAZDA — «езда»."
memory: "Przyjazd — приезд; przyjście — приход; przylot — прилёт. Читается «пшы́яст». Po przyjeździe — по приезде (a→e, zd→źdz)."
idioms:
  - { pl: "z kopyta", ru: "с места в карьер" }
