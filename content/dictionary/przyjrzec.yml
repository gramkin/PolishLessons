# review
id: przyjrzec
format: 2
lemma: "przyjrzeć"
rank: 2047
pos: verb
aspect: perf
pron: { cyr: "пшы́йжэць" }
senses:
  - id: examine
    ru: "присмотреться, рассмотреть (przyjrzeć się czemuś)"
    examples:
      - pl: "Chcę się bliżej przyjrzeć."
        ru: "Я хочу присмотреться поближе."
        source: { kind: translated, id: 3499950 }
      - pl: "Chcę się temu przyjrzeć bliżej."
        ru: "Я хочу присмотреться к этому поближе."
        source: { kind: translated, id: 2290002 }
      - pl: "Poproszono mnie, żebym przyjrzał się sprawie."
        ru: "Меня попросили присмотреться к делу."
        source: { kind: translated, id: 3772036 }
  - id: look-closely
    ru: "приглядеться, вглядеться"
    examples:
      - pl: "Przyjrzyj się."
        ru: "Присмотрись."
        source: { kind: translated, id: 3610716 }
      - pl: "Przyjrzyj się bliżej!"
        ru: "Присмотрись поближе!"
        source: { kind: translated, id: 12186614 }
notes:
  - { kind: government, text: "Всегда с się и ДАТЕЛЬНЫМ падежом: przyjrzeć się sprawie «присмотреться к делу» — как русское «присмотреться к чему»." }
  - { kind: usage, text: "Несовершенный вид — przyglądać się." }
  - { kind: false-friend, text: "Корень -jrzeć тот же, что в spojrzeć «взглянуть» и ujrzeć «увидеть»; ср. русское «зреть», «взор», «зоркий»." }
  - { kind: usage, text: "Очень частая форма — повелительное przyjrzyj się «присмотрись»." }
  - { kind: government, text: "Глагол возвратный и требует дательного: przyjrzeć się czemuś. Страдательного причастия он поэтому не образует вовсе — в отличие от stawić, где винительное дополнение есть." }
collocations:
  - { pl: "przyjrzeć się sprawie", ru: "присмотреться к делу" }
  - { pl: "przyjrzyj się bliżej", ru: "присмотрись поближе" }
etymology: "przy- + -jrzeć от старого źrzeć «смотреть»; ср. русское «зреть», «взор», «зоркий»."
memory: "przyjrzeć się czemuś — «присмотреться к чему-л.», с się и дательным, ровно как в русском. Несовершенный вид — przyglądać się."
idioms:
  - { pl: "przyjrzeć się bliżej", ru: "присмотреться поближе" }
