# review
id: biedak
format: 2
lemma: "biedak"
rank: 2454
pos: noun
pron: { cyr: "бе́дак" }
senses:
  - id: poor-man
    ru: "бедняк, бедняга"
    examples:
      - pl: "Ten człowiek czuł wstyd, że urodził się biedakiem."
        ru: "Этот человек стыдился того, что родился бедняком."
        source: { kind: translated, id: 363779 }
      - pl: "W zależności od tego czy będziesz bogaczem czy biedakiem, ludzie będą cię osądzać jako dobrego lub złego."
        ru: "В зависимости от того, будешь ты богачом или бедняком, люди будут судить тебя как хорошего или плохого."
        source: { kind: translated, id: 11569746 }
      - pl: "Biedak nie miał nawet butów."
        ru: "У бедняка не было даже обуви."
        source: { kind: authored }
  - id: poor-thing
    ru: "бедняга, горемыка (с сочувствием)"
    examples:
      - pl: "Biedak zgubił wszystkie pieniądze."
        ru: "Бедняга потерял все деньги."
        source: { kind: authored }
      - pl: "Biedak stał na deszczu bez parasola."
        ru: "Бедняга стоял под дождём без зонта."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Два оттенка сразу: «бедный человек» и сочувственное «бедняга». Какой именно — видно из контекста." }
  - { kind: government, text: "Мужской ЛИЧНЫЙ род: мн. ч. biedacy, винительный мн. biedaków. Это важно для согласования: ci biedacy, а не te biedaki." }
  - { kind: false-friend, text: "От bieda «беда, нужда». Обратите внимание: польское bieda — это прежде всего бедность, а не русская «беда» как несчастье." }
  - { kind: usage, text: "Женское соответствие — biedaczka. Прилагательное biedny «бедный» уже есть в словаре." }
collocations:
  - { pl: "biedny biedak", ru: "горемыка" }
  - { pl: "pomóc biedakowi", ru: "помочь бедняку" }
etymology: "От bieda «бедность, нужда»; суффикс -ak называет человека, как в rodak, prostak."
memory: "biedak — «бедняк» и «бедняга» сразу. Род мужской ЛИЧНЫЙ: ci biedacy. Корень bieda, которое значит «бедность», а не русскую «беду»."
