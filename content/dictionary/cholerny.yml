# review
id: cholerny
format: 2
lemma: "cholerny"
rank: 727
pos: adj
pron: { cyr: "холе́рны" }
senses:
  - id: damned
    ru: "чёртов, проклятый"
    examples:
      - pl: "Ten cholerny komputer nie działa."
        ru: "Этот чёртов компьютер не работает."
        source: { kind: translated, id: 5933048 }
      - pl: "Że też ten cholerny pies zawsze szczeka!"
        ru: "И надо же этой чёртовой собаке вечно лаять!"
        source: { kind: translated, id: 11263062 }
      - pl: "Zamknij te cholerne drzwi!"
        ru: "Закрой эти чёртовы двери!"
        source: { kind: translated, id: 10577201 }
      - pl: "Na litość boską, nie wziąłem twojego cholernego samochodu."
        ru: "Ради всего святого, я не брал твою чёртову машину."
        source: { kind: translated, id: 1259118 }
      - pl: "Gdzie jest ten cholerny klucz?"
        ru: "Где этот чёртов ключ?"
        source: { kind: authored }
      - pl: "Nie mogę znaleźć cholernej kartki."
        ru: "Я не могу найти чёртов листок."
        source: { kind: authored }
notes:
  - { kind: register, text: "Бранное, но умеренное слово — примерно как русские «чёртов» и «проклятый». Его избегают в официальной речи, но непристойным оно не считается." }
  - { kind: usage, text: "Наречие того же корня — cholernie «чертовски», у него своя карточка." }
  - { kind: usage, text: "Происходит от cholera «холера», которое и само работает как ругательство: Cholera! «Чёрт!», Cholera jasna! «Чёрт побери!»." }
collocations:
  - { pl: "cholerny świat", ru: "проклятый мир" }
  - { pl: "ten cholerny komputer", ru: "этот чёртов компьютер" }
  - { pl: "cholera jasna", ru: "чёрт побери" }
etymology: "От cholera «холера», из греческого. Название болезни дало ругательство ровно так же, как русские «холера тебя возьми» и «чума на оба ваши дома»."
memory: "cholerny — «чёртов, проклятый», умеренно бранное. От cholera «холера», которое и само служит возгласом «Чёрт!»."
idioms:
  - { pl: "cholerny świat", ru: "проклятый мир" }
  - { pl: "cholera jasna", ru: "чёрт побери" }
  - { pl: "ten cholerny hałas", ru: "этот чёртов шум" }
