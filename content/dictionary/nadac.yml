etymology: "Приставка NA- плюс DAĆ, от праславянского *dati, то же слово, что русское «дать». Корень общеиндоевропейский и узнаётся далеко за пределами славянских языков, от латинского DARE до санскритского корня со значением «давать». Самое примечательное здесь не родство корня, а сохранность спряжения: *dati принадлежал к древнему нетематическому типу, где личные окончания прирастали прямо к корню, и оба языка удержали этот тип до наших дней почти без изменений. Польское NADADZĄ и русское «дадут» показывают один и тот же согласный, выросший на месте древнего чередования. От того же корня идут DAR «дар», DAWCA «даритель», WYDAĆ «выдать», PODAĆ «подать»."
memory: "Спряжение идёт по образцу dać, и это тот самый древний тип, который русский сохранил в глаголе «дать»: nadam, nadasz, nada, nadamy, nadacie, nadadzą рядом с «дам, дашь, даст, дадим, дадите, дадут». Даже д в третьем лице множественного совпадает. Два главных значения — почтовое и торжественное: nadać paczkę «отправить посылку» и nadać tytuł «присвоить звание». На конверте стоит nadawca «отправитель»."
idioms:
  - { pl: "nadać sprawie bieg", ru: "дать делу ход" }
formExamplesSkip:
  - { form: "nadani", reason: "Форма страдательного причастия мужского лица во множественном числе грамматически неупотребима. Глагол ставит получателя в дательный падеж, а присваиваемое в винительный, поэтому в страдательный оборот обращается только присваиваемое, то есть звание, имя, награда или отправление. Подлежащим при NADANI пришлось бы сделать мужчин как то, что присвоено или отправлено, а такого управления у глагола нет." }
