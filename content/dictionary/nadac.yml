notes:
  - { kind: usage, text: "Самое ценное здесь — спряжение. NADAĆ идёт по образцу DAĆ, а это один из четырёх польских глаголов, сохранивших древнее нетематическое спряжение: NADAM, NADASZ, NADA, NADAMY, NADACIE, NADADZĄ. Русский сберёг ровно тот же образец в глаголе «дать»: «дам, дашь, даст, дадим, дадите, дадут». Совпадает даже появление Д в третьем лице множественного числа, NADADZĄ и «дадут». Такие совпадения редки, и запомнить польский ряд проще всего, проговорив рядом русский. По этому же образцу идут DAĆ, JEŚĆ, WIEDZIEĆ и все их приставочные." }
  - { kind: government, text: "В значении отправки дополнение в винительном: NADAĆ PACZKĘ, NADAĆ LIST. Способ отправки выражается творительным: NADAĆ POLECONYM «отправить заказным». В значении присвоения работает схема NADAĆ KOMUŚ COŚ — дательный на получателя и винительный на присваиваемое: NADANO MU TYTUŁ DOKTORA. Присвоение имени устроено так же: NADAĆ SZKOLE IMIĘ POETY, где школа в дательном. Русский в обоих случаях строит фразу одинаково, так что падежи переносятся без изменений." }
  - { kind: false-friend, text: "Существительное NADAWCA значит «отправитель» и стоит на каждом польском конверте рядом с ODBIORCA «получатель». Русское ухо может связать NADAWCA с «надавать», но родство тут только с «дать». Второе семейство значений идёт от вещания: NADAWAĆ значит «передавать, вещать», PROGRAM NADAWANY NA ŻYWO — «передача в прямом эфире», а NADAJNIK — «передатчик». Поэтому NADAĆ сам по себе почти никогда не значит «передать по радио»: для этого нужен несовершенный вид." }
  - { kind: pronunciation, text: "Читается «на́дачь», два слога, ударение на первом. Конечное Ć мягкое, «чь», и отличает инфинитив от русского «надать», которого, впрочем, в литературном языке нет. В форме NADADZĄ сочетание DZ даёт слитный звонкий звук «дз», а носовое Ą на конце — «он»: «нада́дзон». В формах прошедшего времени Ł звучит как «у»: NADAŁEM это «на́дауэм». В причастии NADANY ударение остаётся на предпоследнем слоге: «нада́ны»." }
  - { kind: register, text: "Слово нейтральное, но живёт в двух довольно разных мирах. На почте оно самое обиходное: NADAĆ PACZKĘ, NADAĆ LIST, DATA NADANIA «дата отправки». В официальном языке оно торжественно: NADANIE TYTUŁU «присвоение звания», NADAĆ OBYWATELSTWO «предоставить гражданство», NADAĆ ODZNACZENIE «вручить награду». Полезный оборот из канцелярского обихода — NADAĆ SPRAWIE BIEG «дать делу ход», и он совпадает с русским слово в слово." }
