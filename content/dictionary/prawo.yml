# review
id: prawo
format: 2
lemma: "prawo"
rank: 182
pos: noun
pron: { cyr: "пра́во" }
senses:
  - id: right
    ru: "право (возможность, полномочие)"
    examples:
      - pl: "Każdy ma prawo do wolności osobistej."
        ru: "Каждый имеет право на личную свободу."
        source: { kind: tatoeba, id: 4453627 }
      - pl: "Papież nie ma prawa się żenić."
        ru: "Папа не имеет права жениться."
        source: { kind: tatoeba, id: 528167 }
      - pl: "Każdy ma prawo do nauki."
        ru: "Каждый имеет право на образование."
        source: { kind: authored }
  - id: law
    ru: "закон; право как область знания"
    examples:
      - pl: "Złamałaś prawo."
        ru: "Ты нарушила закон."
        source: { kind: tatoeba, id: 3409984 }
      - pl: "Studiuje prawo na uniwersytecie."
        ru: "Он изучает право в университете."
        source: { kind: authored }
      - pl: "Nowe prawo wchodzi w życie w styczniu."
        ru: "Новый закон вступает в силу в январе."
        source: { kind: authored }
  - id: rightward
    ru: "w prawo — направо (наречие)"
    note: "То же слово в форме винительного падежа с предлогом w значит «направо»."
    examples:
      - pl: "Skręć w prawo."
        ru: "Поверни направо."
        source: { kind: authored }
      - pl: "Na prawo jest apteka."
        ru: "Справа аптека."
        source: { kind: authored }
      - pl: "Patrz w lewo i w prawo."
        ru: "Смотри налево и направо."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Одинаково пишутся три разных слова: prawo «право, закон» (существительное), w prawo «направо» (наречие) и prawa ręka «правая рука» (прилагательное prawy). В словарных таблицах их формы перемешаны." }
  - { kind: false-friend, text: "prawie — это не форма слова prawo, а отдельное наречие «почти»: Prawie skończyłem «Я почти закончил»." }
  - { kind: usage, text: "mieć prawo do czegoś — «иметь право на что-то»; prawo jazdy — «водительские права»; zgodnie z prawem — «по закону»." }
collocations:
  - { pl: "mieć prawo", ru: "иметь право" }
  - { pl: "prawo jazdy", ru: "водительские права" }
  - { pl: "zgodnie z prawem", ru: "по закону" }
  - { pl: "w prawo", ru: "направо" }
etymology: "От prawy «прямой, правильный» (праславянское *pravъ) — тот же корень, что в русских «правый» и «право»."
memory: "Одно написание — три слова: prawo «право, закон», w prawo «направо», prawa ręka «правая рука». И осторожно с prawie: это «почти», совсем другое слово."
idioms:
  - { pl: "prawo jazdy", ru: "водительские права" }
  - { pl: "na prawo i lewo", ru: "направо и налево" }
  - { pl: "prawo dżungli", ru: "закон джунглей" }
