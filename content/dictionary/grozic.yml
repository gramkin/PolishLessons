# review
id: grozic
format: 2
lemma: "grozić"
rank: 1544
pos: verb
aspect: imperf
aspectPair: zagrozic
pron: { cyr: "гро́зиць" }
senses:
  - id: threaten
    ru: "угрожать, грозить (кому-либо)"
    examples:
      - pl: "On mi groził!"
        ru: "Он мне угрожал!"
        source: { kind: tatoeba, id: 12624906 }
      - pl: "Tom groził mi."
        ru: "Том мне угрожал."
        source: { kind: translated, id: 2239251 }
      - pl: "Groziła, że mnie zabije."
        ru: "Она угрожала, что убьёт меня."
        source: { kind: translated, id: 11260326 }
  - id: danger
    ru: "грозить (об опасности, наказании)"
    examples:
      - pl: "To nam na pewno nie grozi."
        ru: "Нам это точно не грозит."
        source: { kind: tatoeba, id: 13084393 }
      - pl: "Ten dom grozi zawaleniem."
        ru: "Этот дом грозит обрушением."
        source: { kind: translated, id: 6313505 }
      - pl: "Groziło im dziesięć lat więzienia."
        ru: "Им грозило десять лет тюрьмы."
        source: { kind: translated, id: 6157670 }
notes:
  - { kind: government, text: "grozić требует дательного падежа для того, кому грозят: grozić komuś «угрожать кому-то». Здесь польский и русский совпадают." }
  - { kind: usage, text: "Второе значение безличное: grozi mu kara «ему грозит наказание», dom grozi zawaleniem «дом грозит обрушением» — с творительным падежом." }
  - { kind: usage, text: "Совершенный вид — zagrozić. Существительное groźba значит «угроза», прилагательное groźny — «грозный, опасный»." }
  - { kind: usage, text: "Безличная форма grożono «угрожали» частотна в протоколах: Grożono ci? «Тебе угрожали?»." }
collocations:
  - { pl: "grozić komuś", ru: "угрожать кому-то" }
  - { pl: "grozi mu kara", ru: "ему грозит наказание" }
  - { pl: "grozić zawaleniem", ru: "грозить обрушением" }
etymology: "Праславянское *grozìti от *groza «ужас, гроза» — то же слово, что русское «грозить», и то же гнездо, что «гроза». Соответствие полное, включая значение."
memory: "grozić = «грозить, угрожать», дательный падеж: grozić komuś. Совершенный вид — zagrozić. Второе значение безличное: grozi mu kara «ему грозит наказание», dom grozi zawaleniem «дом грозит обрушением»."
idioms:
  - { pl: "grozić palcem", ru: "грозить пальцем" }
  - { pl: "grozi mu kara", ru: "ему грозит наказание" }
  - { pl: "nic nam nie grozi", ru: "нам ничего не грозит" }
