etymology: "От LIPA с суффиксом -IEC: месяц назван по цветению липы, которое приходится как раз на июль и даёт пчёлам главный взяток. Название общеславянское по способу, но не по месту: в украинском ЛИПЕНЬ тоже июль, а в хорватском LIPANJ — июнь, потому что липа южнее зацветает раньше. Это хорошо показывает, как работали старые календари: месяц привязывали к природному событию, и граница сдвигалась вместе с климатом. Русский взял латинское имя Юлия Цезаря через греческий и церковный календарь, а славянское название в нём не удержалось вовсе. Само слово LIPA — праславянское, родственное русской «липе», и названо дерево, вероятно, по липкому соку."
memory: "Славянское название: lipiec от lipa — месяц цветения липы, а русский «июль» латинский, от Юлия Цезаря. Рядом czerwiec «июнь» от czerw. Осторожно с соседями по славянскому миру: украинский «липень» тоже июль, а хорватский lipanj — июнь, потому что липа там зацветает раньше. Беглое e пропадает: lipiec, но lipca, как ojciec и ojca. Предлог короткий: w lipcu, в отличие от we wrześniu."
idioms:
  - { pl: "w lipcu", ru: "в июле" }
