notes:
  - { kind: false-friend, text: "Как и WRZESIEŃ, слово славянское, а русское «июль» латинское, от имени Юлия Цезаря, и потому угадать его нельзя. LIPIEC образован от LIPA «липа»: это месяц, когда липа цветёт и когда берут липовый мёд. Запомнить легче всего именно через липу, тем более что русскому дерево знакомо и называется почти так же. Соседний месяц построен по тому же образцу: CZERWIEC от CZERW, то есть от личинки червеца, из которого добывали багряную краску. Слово LIPIEC означает и сам липовый мёд, и в этом значении оно встречается у пчеловодов." }
  - { kind: usage, text: "Десять форм, мужской род. Беглое E исчезает во всех косвенных формах, и вместе с ним пропадает смягчение: LIPIEC, но LIPCA, LIPCOWI, LIPCEM, LIPCU — то же самое, что в OJCIEC и OJCA. Местный единственного — LIPCU, и предлог здесь обычный, короткий: W LIPCU, в отличие от WE WRZEŚNIU, где перед двумя согласными W удлиняется до WE. Даты строятся родительным: DRUGIEGO LIPCA «второго июля». Прилагательное LIPCOWY «июльский» употребляется широко, в том числе о погоде: LIPCOWY UPAŁ." }
  - { kind: pronunciation, text: "Читается «ли́пец», два слога, ударение на первом. Буквосочетание LI даёт мягкое «ли», а IE после P — «е» с мягким P, поэтому первая часть звучит «ли-пе». Конечное C это «ц». В косвенных формах беглое E пропадает и слово становится короче: LIPCA звучит «ли́пца», LIPCU — «ли́пцу», LIPCEM — «ли́пцэм». В форме LIPCÓW буква Ó даёт «у», а конечное W оглушается в «ф»: «ли́пцуф»." }
  - { kind: register, text: "Слово нейтральное и бытовое. Устойчивые сочетания: W LIPCU, NA POCZĄTKU LIPCA, LIPCOWY UPAŁ, WAKACJE LIPCOWE. Название месяца пишется со строчной буквы. В польской истории оборот MANIFEST LIPCOWY отсылает к сорок четвёртому году, а ŚWIĘTO LIPCOWE обозначало государственный праздник Польской Народной Республики, так что в текстах того времени слово несёт политический оттенок; в современной речи этого оттенка нет. Месяц часто называют просто серединой лета: ŚRODEK LATA." }
