notes:
  - { kind: usage, text: "Склонение у слова смешанное, и это главное, что нужно о нём знать. В единственном числе окончания женские: WŁADCY в родительном, дательном и местном, WŁADCĘ в винительном, WŁADCĄ в творительном, WŁADCO в звательном — в точности как у KOBIETA. А во множественном окончания мужские личные: WŁADCY в именительном, WŁADCÓW в родительном, WŁADCOM, WŁADCAMI, WŁADCACH. Согласование при этом мужское во всех числах: TEN WŁADCA, DOBRY WŁADCA. Третий такой случай в словаре после ŁOWCA и рядом с DORADCA из этой же партии." }
  - { kind: usage, text: "Форма WŁADCY делает пять работ сразу: родительный, дательный и местный единственного плюс именительный и звательный множественного. Отсюда и всего девять форм на четырнадцать падежных мест. Уничижительная форма у слова своя — WŁADCE, — и она отличается от мужской личной WŁADCY, что согласуется с правилом из карточки PRODUCENT: уничижительная берёт немужское окончание, у основ на -ca это -e, и потому с мужским -y она не сливается." }
  - { kind: usage, text: "Разряд этот русскому не чужд, хотя слов в нём мало. Русское «убийца» устроено точно так же: род мужской, а склонение женское — «убийцы, убийцу, убийцей». Так же «пропойца», «пьяница». Значит образец переносится напрямую, надо только помнить, что в польском он продуктивен и слов таких много: władca от WŁADAĆ, doradca от DORADZAĆ, kierowca «водитель», sprzedawca «продавец», wykonawca «исполнитель»." }
