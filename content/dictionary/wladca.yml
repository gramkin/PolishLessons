etymology: "От WŁADAĆ «владеть», из праславянского *volděti — того же корня, что русские «владеть», «власть» и «волость». Суффикс -ca образует названия действующих лиц и в польском вполне живой. Русский то же понятие назвал суффиксом -тель и -итель: «властитель», «владетель», — а своё «-ца» оставил немногим словам вроде «убийцы», которые, однако, склоняются совершенно так же, как польские на -ca."
memory: "Единственное число склоняется по-женски (władcy, władcę, władcą), множественное по-мужски (władców). Как русское «убийца». Форма władcy — пять падежей сразу."
