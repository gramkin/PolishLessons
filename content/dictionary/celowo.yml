# review
id: celowo
format: 2
lemma: "celowo"
rank: 4625
pos: adv
pron: { cyr: "цэло́во" }
senses:
  - id: deliberately
    ru: "нарочно, намеренно"
    examples:
      - pl: "Spóźnił się celowo, żeby ją zdenerwować."
        ru: "Он нарочно опоздал, чтобы её разозлить."
        source: { kind: authored }
      - pl: "To nie był wypadek, ktoś celowo podpalił stodołę."
        ru: "Это не несчастный случай: кто-то намеренно поджёг сарай."
        source: { kind: authored }
      - pl: "Celowo zostawił drzwi otwarte."
        ru: "Он нарочно оставил дверь открытой."
        source: { kind: authored }
      - pl: "Czy zrobiłeś to celowo?"
        ru: "Ты сделал это нарочно?"
        source: { kind: authored }
      - pl: "Celowo milczała przez cały wieczór."
        ru: "Весь вечер она намеренно молчала."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "CELOWO — «нарочно», от CEL «цель», а не «целиком» (это W CAŁOŚCI). Прилагательное CELOWY — тоже ловушка: «целесообразный» или «целевой», а не «целый». Противоположность CELOWO — PRZYPADKIEM, «случайно», или NIECHCĄCY, «нечаянно»." }
  - { kind: usage, text: "Наречие, одна форма, без степеней. Синоним — UMYŚLNIE, книжнее и юридичнее. В разговоре по-детски говорят NAUMYŚLNIE или SPECJALNIE: ZROBIŁEŚ TO SPECJALNIE!" }
  - { kind: government, text: "Наречие ничем не управляет. Стоит перед глаголом или после него: CELOWO KŁAMAĆ, ZROBIĆ COŚ CELOWO." }
  - { kind: pronunciation, text: "Читается «цэло́во», ударение на предпоследнем слоге. CE — твёрдое «цэ», как в CEL «цэль»." }
collocations:
  - { pl: "zrobić coś celowo", ru: "сделать что-то нарочно" }
  - { pl: "celowo kłamać", ru: "намеренно лгать" }
  - { pl: "celowo milczeć", ru: "нарочно молчать" }
family:
  - { pl: "cel", ru: "цель", relation: root, id: cel }
  - { pl: "celowy", ru: "целесообразный; целевой", relation: root }
  - { pl: "celować", ru: "целиться", relation: root }
etymology: "От CEL «цель, мишень», заимствованного из немецкого. Русское «цель» пришло из того же источника через польский. Сделать CELOWO — сделать «с целью»."
memory: "Celowo — нарочно, с целью: cel. Читается «цэло́во». Przypadkiem — случайно. Celowy — целесообразный, не «целый»."
idioms:
  - { pl: "trafić w dziesiątkę", ru: "попасть в яблочко" }
