# review
id: pojawiac
format: 2
lemma: "pojawiać"
rank: 1893
pos: verb
pron: { cyr: "поя́вьяць" }
senses:
  - id: appear
    ru: "появляться, возникать"
    examples:
      - pl: "Pojawiają się nowe problemy."
        ru: "Появляются новые проблемы."
        source: { kind: authored }
      - pl: "Na niebie pojawiały się pierwsze gwiazdy."
        ru: "На небе появлялись первые звёзды."
        source: { kind: authored }
      - pl: "Objawy pojawiają się po tygodniu."
        ru: "Симптомы появляются через неделю."
        source: { kind: authored }
  - id: turn-up
    ru: "появляться где-л. (о человеке)"
    examples:
      - pl: "Pojawiał się tu co tydzień."
        ru: "Он появлялся тут каждую неделю."
        source: { kind: authored }
      - pl: "Rzadko pojawiam się na zebraniach."
        ru: "Я редко появляюсь на собраниях."
        source: { kind: authored }
  - id: appearance
    ru: "pojawianie — появление (как процесс)"
    examples:
      - pl: "Pojawianie się usterek nikogo nie dziwi."
        ru: "Появление неисправностей никого не удивляет."
        source: { kind: authored }
      - pl: "O pojawianiu się plam powiedział lekarzowi."
        ru: "О появлении пятен он сказал врачу."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "КОРЕНЬ, КОТОРЫЙ У ВАС УЖЕ ЕСТЬ. Польское jaw- — это русское яв-. Jawa значит «явь», na jawie — «наяву», zjawisko — «явление», objaw — «симптом, проявление», jawny — «явный». Отсюда и оба глагола появления: pojawić się «появиться» и zjawić się «явиться»." }
  - { kind: usage, text: "В значении «появляться» глагол употребляется ТОЛЬКО с się: coś się pojawia. Совершенная пара — pojawić się: problemy pojawiają się co tydzień «проблемы появляются каждую неделю», но problem pojawił się wczoraj «проблема появилась вчера». Страдательного причастия нет: возвратный глагол не даёт его." }
  - { kind: government, text: "Место — предлог w или na с ПРЕДЛОЖНЫМ падежом: pojawić się w drzwiach, na zebraniu, w telewizji. Русское «появиться в дверях, на собрании» строится так же. С людьми бывает u: pojawił się u nas wieczorem." }
  - { kind: register, text: "Нейтральное слово на все случаи. Рядом стоит zjawić się — тоже «появиться», но с оттенком внезапности, как русское «явиться»: pojawił się na zebraniu это просто «пришёл», а zjawił się na zebraniu намекает, что его не ждали." }
collocations:
  - { pl: "pojawić się w drzwiach", ru: "появиться в дверях" }
  - { pl: "pojawiają się problemy", ru: "появляются проблемы" }
  - { pl: "pojawić się na zebraniu", ru: "появиться на собрании" }
family:
  - { pl: "zjawić", ru: "явиться, появиться", relation: root, id: zjawic }
  - { pl: "zjawisko", ru: "явление", relation: root }
  - { pl: "jawny", ru: "явный, открытый", relation: root }
etymology: "Приставка po- плюс основа -jawiać от jawa «явь», и это ровно русский корень яв-: «явь», «явиться», «явление», «наяву». Русское «появиться» собрано из тех же частей — «по» плюс «явить» — так что слово разбирается без словаря."
memory: "pojawiać się — «появляться», всегда с się. Корень jaw- это русское яв-: jawa «явь», zjawisko «явление», jawny «явный». И помните соседа: zjawić się тоже «появиться», но с оттенком «явиться» — внезапно и незваным."
idioms:
  - { pl: "pojawić się znikąd", ru: "появиться из ниоткуда" }
  - { pl: "pojawiać się i znikać", ru: "то появляться, то исчезать" }
