# review
id: odtad
format: 2
lemma: "odtąd"
rank: 5603
pos: adv
pron: { cyr: "о́ттонт" }
senses:
  - id: from-now-on
    ru: "отныне, с этих пор"
    examples:
      - pl: "Odtąd jesteś zdany na siebie."
        ru: "Отныне ты предоставлен сам себе."
        source: { kind: translated, id: 911558 }
      - pl: "Odtąd nie będę używał tego słowa."
        ru: "Отныне я не буду употреблять это слово."
        source: { kind: translated, id: 973062 }
      - pl: "Odtąd wszystko się zmieniło."
        ru: "С тех пор всё изменилось."
        source: { kind: authored }
  - id: from-here
    ru: "отсюда (о месте, в паре odtąd dotąd)"
    examples:
      - pl: "Pęknięcie przedniej szyby biegnie odtąd dotąd."
        ru: "Трещина на лобовом стекле идёт отсюда досюда."
        source: { kind: translated, id: 12062021 }
      - pl: "Odtąd dotąd mierzy dwa metry."
        ru: "Отсюда досюда — два метра."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Два употребления: временное «отныне, с тех пор» и пространственное «отсюда», последнее почти всегда в паре odtąd dotąd." }
  - { kind: false-friend, text: "Собрано из od + tąd, как русское «оттуда»; парное dotąd значит «досюда, до сих пор»." }
  - { kind: government, text: "Не изменяется." }
  - { kind: usage, text: "В ряду с ним: dotąd «до сих пор», stąd «отсюда», dokąd «куда»." }
collocations:
  - { pl: "odtąd dotąd", ru: "отсюда досюда" }
etymology: "od + tąd; ср. русское «оттуда», «отсюда». Парное слово — dotąd «до сих пор»."
memory: "odtąd — «отныне, с тех пор», а о месте «отсюда», обычно в паре odtąd dotąd. В том же ряду stąd «отсюда» и dotąd «досюда»."
idioms:
  - { pl: "odtąd dotąd", ru: "отсюда досюда" }
