# review
id: slonce
format: 2
lemma: "słońce"
rank: 802
pos: noun
pron: { cyr: "суо́ньце" }
senses:
  - id: sun
    ru: "солнце"
    examples:
      - pl: "Słońce świeci."
        ru: "Солнце светит."
        source: { kind: tatoeba, id: 372413 }
      - pl: "Gdzie jest słońce?"
        ru: "Где солнце?"
        source: { kind: tatoeba, id: 3997929 }
      - pl: "Słońce stopiło śnieg."
        ru: "Солнце растопило снег."
        source: { kind: tatoeba, id: 1353781 }
  - id: around
    ru: "wokół Słońca — вокруг Солнца"
    examples:
      - pl: "Ziemia krąży wokół Słońca."
        ru: "Земной шар вращается вокруг Солнца."
        source: { kind: tatoeba, id: 709318 }
      - pl: "Wenus jest drugą planetą od Słońca."
        ru: "Венера — вторая планета от Солнца."
        source: { kind: tatoeba, id: 13265042 }
      - pl: "Ziemia porusza się po orbicie dookoła Słońca."
        ru: "Земля движется по орбите вокруг Солнца."
        source: { kind: tatoeba, id: 5909184 }
  - id: in-sun
    ru: "w słońcu — на солнце (предложный!)"
    note: "Поляк говорит «в солнце» там, где русский — «на солнце»."
    examples:
      - pl: "Koty lubią bawić się w słońcu."
        ru: "Кошки любят играть на солнце."
        source: { kind: tatoeba, id: 588395 }
      - pl: "Zbroja rycerza lśniła w słońcu."
        ru: "Доспехи рыцаря блестели на солнце."
        source: { kind: tatoeba, id: 11275506 }
      - pl: "Jaszczurka wylegiwała się na słońcu."
        ru: "Ящерица полёживала на солнце."
        source: { kind: tatoeba, id: 6406116 }
  - id: idioms
    ru: "nic nowego pod słońcem — ничего нового под солнцем"
    examples:
      - pl: "Nic nowego pod słońcem."
        ru: "Ничего нового под солнцем."
        source: { kind: translated, id: 364517 }
      - pl: "Jestem twoim słońcem."
        ru: "Я твоё солнце."
        source: { kind: tatoeba, id: 3410647 }
      - pl: "Jesteś moim słońcem."
        ru: "Ты моё солнце."
        source: { kind: translated, id: 3579433 }
notes:
  - { kind: government, text: "Запомните падеж: w słońcu, буквально «в солнце», там где русский говорит «на солнце». А pod słońcem «под солнцем» — творительный, wokół Słońca — родительный." }
  - { kind: usage, text: "nic nowego pod słońcem — «ничего нового под солнцем», идиома переносится дословно." }
  - { kind: usage, text: "porywać się z motyką na słońce значит «браться за непосильное», буквально «бросаться с мотыгой на солнце»." }
  - { kind: usage, text: "Słońce с большой буквы — светило в астрономическом смысле; słońce со строчной — солнце как свет и тепло. И ласковое: Jesteś moim słońcem «Ты моё солнце»." }
collocations:
  - { pl: "w słońcu", ru: "на солнце" }
  - { pl: "pod słońcem", ru: "под солнцем" }
  - { pl: "wokół Słońca", ru: "вокруг Солнца" }
  - { pl: "promienie słońca", ru: "лучи солнца" }
family:
  - { pl: "słoneczny", ru: "солнечный", relation: derived }
  - { pl: "słonecznik", ru: "подсолнух", relation: derived }
  - { pl: "słonecznie", ru: "солнечно", relation: derived }
etymology: "Общеславянское *sъlnьce — то же слово, что русское «солнце», с тем же уменьшительным суффиксом."
memory: "słońce — «солнце», слово то же самое. Запомните падеж: поляк говорит w słońcu, буквально «в солнце», там где русский говорит «на солнце». Идиома nic nowego pod słońcem переносится дословно, а porywać się z motyką na słońce значит «браться за непосильное»."
idioms:
  - { pl: "nic nowego pod słońcem", ru: "ничего нового под солнцем" }
  - { pl: "jasny jak słońce", ru: "ясный как солнце" }
  - { pl: "porywać się z motyką na słońce", ru: "браться за непосильное" }
