# review
id: obecnosc
format: 2
lemma: "obecność"
rank: 1625
pos: noun
pron: { cyr: "обе́цносьць" }
senses:
  - id: presence
    ru: "присутствие"
    examples:
      - pl: "Zauważył moją obecność."
        ru: "Он заметил моё присутствие."
        source: { kind: translated, id: 765873 }
      - pl: "Nie byłem świadom jej obecności."
        ru: "Я не осознавал её присутствия."
        source: { kind: translated, id: 357638 }
      - pl: "Jej obecność jest dla mnie ważna."
        ru: "Её присутствие для меня важно."
        source: { kind: translated, id: 4123785 }
  - id: in-presence
    ru: "w obecności — в присутствии"
    examples:
      - pl: "Wstydziła się w jego obecności."
        ru: "Она стеснялась в его присутствии."
        source: { kind: translated, id: 760336 }
      - pl: "Nie obrażaj mnie w obecności innych ludzi."
        ru: "Не оскорбляй меня в присутствии других людей."
        source: { kind: translated, id: 3453295 }
      - pl: "Czuł się niepewnie w obecności ojca."
        ru: "Он чувствовал себя неуверенно в присутствии отца."
        source: { kind: translated, id: 616242 }
  - id: attendance
    ru: "посещаемость, явка"
    examples:
      - pl: "Nauczyciel sprawdził obecność."
        ru: "Учитель проверил посещаемость."
        source: { kind: translated, id: 3487808 }
      - pl: "Obecność wszystkich członków jest obowiązkowa."
        ru: "Присутствие всех членов обязательно."
        source: { kind: translated, id: 9678459 }
notes:
  - { kind: government, text: "w obecności kogoś — «в присутствии кого-то», родительный падеж: w obecności ojca «в присутствии отца»." }
  - { kind: usage, text: "sprawdzić obecność — «проверить посещаемость» (в школе); obecność obowiązkowa — «присутствие обязательно»." }
  - { kind: usage, text: "Прилагательное — obecny «присутствующий» и одновременно «нынешний, теперешний»: obecny rok «нынешний год»." }
  - { kind: usage, text: "Существительное женского рода на -ść, как wolność и radość: в родительном и предложном — obecności." }
collocations:
  - { pl: "w obecności", ru: "в присутствии" }
  - { pl: "sprawdzić obecność", ru: "проверить посещаемость" }
  - { pl: "obecność obowiązkowa", ru: "присутствие обязательно" }
etymology: "От obecny «присутствующий», от старого obiec «вокруг, около». Русское «присутствие» собрано от «быть при» — метафора другая (быть рядом против быть вокруг), но итог тот же."
memory: "obecność = «присутствие»: w obecności ojca «в присутствии отца», родительный падеж. Осторожно с прилагательным obecny: оно значит и «присутствующий», и «нынешний»."
idioms:
  - { pl: "w obecności", ru: "в присутствии" }
  - { pl: "sprawdzić obecność", ru: "проверить посещаемость" }
  - { pl: "obecność obowiązkowa", ru: "присутствие обязательно" }
