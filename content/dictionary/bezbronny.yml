notes:
  - { kind: false-friend, text: "Русскому «безбронный» значит «без брони», и польское BEZBRONNY буквально так и собрано: BEZ «без» и BROŃ «оружие». Но значит оно «беззащитный»: тот, у кого нет оружия, чтобы защититься. «Бронированный» по-польски — PANCERNY, а польское BROŃ — это «оружие», не «броня»." }
  - { kind: usage, text: "Полная парадигма: BEZBRONNY, BEZBRONNIEJSZY, NAJBEZBRONNIEJSZY. Степени редки, но встречаются в публицистике: NAJBEZBRONNIEJSI, «самые беззащитные». Мужское-личное: BEZBRONNI, BEZBRONNIEJSI, NAJBEZBRONNIEJSI." }
  - { kind: government, text: "Беззащитный перед чем-то — BEZBRONNY WOBEC + родительный: BEZBRONNY WOBEC PRZEMOCY. Или BEZBRONNY NA + винительный: BEZBRONNY NA ATAKI. Русское «беззащитен перед чем» с творительным здесь не работает." }
  - { kind: pronunciation, text: "Читается «безбро́нны», три слога, ударение на предпоследнем. Z перед B звонкое, двойное NN тянется. В BEZBRONNIEJSZY: «безбронне́йшы»." }
  - { kind: register, text: "Нейтральное, но эмоциональное слово, частое в новостях о насилии и в публицистике: BEZBRONNI CYWILE, «беззащитные мирные жители». В переносном смысле — о беспомощности перед системой." }
collocations:
  - { pl: "bezbronni cywile", ru: "беззащитные мирные жители" }
  - { pl: "bezbronne dziecko", ru: "беззащитный ребёнок" }
  - { pl: "bezbronny wobec przemocy", ru: "беззащитный перед насилием" }
family:
