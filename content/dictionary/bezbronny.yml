  - { pl: "bronić", ru: "защищать", relation: root, id: bronic }
  - { pl: "bezradny", ru: "беспомощный", relation: root }
etymology: "Сложение BEZ «без» и BROŃ «оружие», общеславянского *bornь, «битва, защита», родственного русскому «оборона» и книжному «брань» в значении «битва». Беззащитный — буквально безоружный."
memory: "Bezbronny — беззащитный: bezbronna staruszka, bezbronni cywile. Bez + broń (оружие, не броня!). Bezbronniejszy, najbezbronniejszy. Читается «безбро́нны»."
