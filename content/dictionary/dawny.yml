# review
id: dawny
format: 2
lemma: "dawny"
rank: 544
pos: adj
pron: { cyr: "да́вны" }
senses:
  - id: former
    ru: "прежний, давний, бывший"
    note: "dawny przyjaciel «давний друг» — о времени, не о возрасте."
    examples:
      - pl: "Lincoln powitał dawnego przeciwnika politycznego."
        ru: "Линкольн приветствовал давнего политического противника."
        source: { kind: translated, id: 823222 }
      - pl: "Wczoraj spotkałem dawnego przyjaciela, którego nie widziałem od dawna."
        ru: "Вчера я встретил давнего друга, которого давно не видел."
        source: { kind: translated, id: 361680 }
      - pl: "Dawny znajomy przesłał mi list, informujący, że wrócił z zagranicy."
        ru: "Давний знакомый прислал мне письмо о том, что вернулся из-за границы."
        source: { kind: translated, id: 745352 }
  - id: old-times
    ru: "dawne czasy — прежние времена"
    note: "to dawne dzieje «дела давно минувших дней»."
    examples:
      - pl: "Lubią wspominać dawne czasy."
        ru: "Они любят вспоминать прежние времена."
        source: { kind: translated, id: 1623022 }
      - pl: "To już dawne dzieje."
        ru: "Это уже дела давно минувших дней."
        source: { kind: translated, id: 13661793 }
      - pl: "Dla dawnych Europejczyków ważka była symbolem diabła."
        ru: "В старину для европейцев стрекоза была символом дьявола."
        source: { kind: tatoeba, id: 7960618 }
  - id: long-ago
    ru: "od dawna — давно (застывшее наречие)"
    note: "Форма dawna живёт почти только в этом обороте."
    examples:
      - pl: "Znam Toma od dawna."
        ru: "Я давно знаю Тома."
        source: { kind: tatoeba, id: 4716892 }
      - pl: "Od dawna o tym wiedział."
        ru: "Он давно об этом знал."
        source: { kind: tatoeba, id: 983237 }
      - pl: "Od jak dawna uczysz niemieckiego?"
        ru: "Давно ты немецкий учишь?"
        source: { kind: tatoeba, id: 6771302 }
notes:
  - { kind: usage, text: "od dawna — застывшее наречие «давно», а не обычная форма прилагательного: Znam go od dawna. Так же устроено z dawna «издавна»." }
  - { kind: false-friend, text: "dawny значит «прежний, бывший», а не «старый по возрасту». Для возраста есть stary: dawny nauczyciel «прежний учитель», но stary nauczyciel «старый учитель»." }
  - { kind: usage, text: "Степени dawniejszy и najdawniejszy существуют, но в живой речи редки — чаще говорят wcześniejszy «более ранний»." }
  - { kind: usage, text: "Наречие — dawniej «раньше, прежде»: dawniej było inaczej «раньше было иначе»." }
collocations:
  - { pl: "od dawna", ru: "давно" }
  - { pl: "dawne czasy", ru: "прежние времена" }
  - { pl: "dawny przyjaciel", ru: "давний друг" }
  - { pl: "to dawne dzieje", ru: "дела давно минувших дней" }
family:
  - { pl: "dawno", ru: "давно", relation: derived }
  - { pl: "dawniej", ru: "раньше, прежде", relation: derived }
  - { pl: "niedawno", ru: "недавно", relation: derived }
etymology: "От праславянского *davьnъ — то же слово, что русские «давний» и «давно»; отсюда же dawniej «раньше» и niedawno «недавно»."
memory: "dawny — «прежний, давний», и со stary его путать не стоит: dawny nauczyciel это «прежний учитель», а stary nauczyciel — «старый». Чаще всего слово попадается в застывшем обороте od dawna «давно»: Znam go od dawna. Степени dawniejszy и najdawniejszy существуют, но в живой речи редки — обычно говорят wcześniejszy. Наречие — dawniej «раньше, прежде»."
idioms:
  - { pl: "od dawna", ru: "давно" }
  - { pl: "dawne czasy", ru: "прежние времена" }
  - { pl: "to dawne dzieje", ru: "дела давно минувших дней" }
