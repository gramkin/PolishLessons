notes:
  - { kind: false-friend, text: "Русское «моча» — женского рода, польское MOCZ — мужского: TEN MOCZ, MOCZU, MOCZEM. Глагол MOCZYĆ, «мочить, замачивать», — того же корня, но значит просто «намочить водой»: MOCZYĆ NOGI W JEZIORZE, «мочить ноги в озере». А «мочиться» — ODDAWAĆ MOCZ, вежливо и по-медицински." }
  - { kind: usage, text: "Мужской род, неодушевлённое, вещественное: множественного числа нет. Живые формы — MOCZ, MOCZU, MOCZOWI, MOCZEM. Родительный на -U: BADANIE MOCZU. Местный совпадает с ним: W MOCZU." }
  - { kind: government, text: "Анализ мочи — BADANIE MOCZU, родительный. Сдать мочу — ODDAĆ MOCZ, винительный. В моче — W MOCZU, местный. Недержание мочи — NIETRZYMANIE MOCZU, родительный." }
  - { kind: pronunciation, text: "Читается «моч», один слог. CZ на конце остаётся «ч», без смягчения. В MOCZU: «мо́чу», MOCZEM: «мо́чэм»." }
  - { kind: register, text: "Медицинское и нейтральное слово, его пишут в направлениях и на баночках в аптеке. В быту говорят SIKI, «пи-пи», детское и грубоватое, или SIKAĆ, «писать». Вежливо: IŚĆ DO TOALETY." }
collocations:
  - { pl: "badanie moczu", ru: "анализ мочи" }
  - { pl: "oddać mocz", ru: "сдать мочу; помочиться" }
  - { pl: "nietrzymanie moczu", ru: "недержание мочи" }
family:
  - { pl: "moczyć", ru: "мочить, замачивать", relation: root }
