etymology: "Общеславянское *močь, «влага, моча», от того же корня, что «мокнуть», «мокрый» и польское MOKRY. Русское «моча» — тот же корень с женским окончанием. Польский сохранил старый мужской род."
memory: "Mocz — моча, но мужского рода: ten mocz, badanie moczu. Oddać mocz — сдать мочу. Moczyć — просто мочить водой. Читается «моч»."
idioms:
