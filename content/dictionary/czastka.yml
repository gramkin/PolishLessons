notes:
  - { kind: false-friend, text: "Слово прозрачное и для русского лёгкое: CZĄSTKA это «частица», уменьшительное от CZĘŚĆ «часть». Обратите внимание на чередование носовых внутри польского: CZĘŚĆ с Ę, но CZĄSTKA с Ą. Такие пары в польском не редкость, и бояться их не надо. А вот прилагательных два, и они разные: CZĄSTKOWY значит «частичный, дробный», а CZĘŚCIOWY — «частичный» о неполноте." }
  - { kind: usage, text: "Десять форм, женский род, уменьшительное от CZĘŚĆ. В дательном и местном падежах K переходит в C: CZĄSTKA, но W CZĄSTCE. В родительном множественного появляется беглое E: CZĄSTEK. Носовой Ą держится во всех формах. В физике слово стоит прежде всего в сочетании CZĄSTKA ELEMENTARNA." }
  - { kind: government, text: "Частица чего-то — CZĄSTKA CZEGOŚ, родительный падеж: CZĄSTKA PRAWDY, CZĄSTKA SUMY. В частице — W CZĄSTCE, местный с переходом K в C. Состоять из частиц — SKŁADAĆ SIĘ Z CZĄSTEK, предлог Z с родительным множественного. Все три оборота требуют родительного там, где русский тоже ставит родительный." }
  - { kind: pronunciation, text: "Читается «чо́нстка», два слога, ударение на первом. Сочетание CZ даёт «ч». Носовой Ą перед S даёт «он», поэтому первый слог это «чон». В форме CZĄSTCE сочетание TC даёт «тц»: «чо́нстце». В родительном множественного CZĄSTEK появляется беглое E: «чо́нстэк»." }
  - { kind: register, text: "Слово научное и книжное. В физике это CZĄSTKA ELEMENTARNA и CZĄSTKI PYŁU, в химии — CZĄSTKA MATERII. В переносном смысле встречается CZĄSTKA PRAWDY «доля истины» и CZĄSTKA SIEBIE, когда говорят, что вложили в дело часть себя. Обиходное слово для части — CZĘŚĆ, а CZĄSTKA звучит точнее и меньше." }
