etymology: "Уменьшительное от CZĘŚĆ «часть», слова праславянского и того же, что русская «часть». Родство здесь полное, вплоть до уменьшительного: наша «частица» собрана точно так же. Любопытно только чередование носовых внутри польского: в CZĘŚĆ стоит Ę, а в CZĄSTKA уже Ą, хотя корень один. Такие переходы в польском обычны, и запоминать их лучше парами: CZĘŚĆ и CZĄSTKA рядом."
memory: "Частица, уменьшительное от czesc «часть» — слово для русского лёгкое, родство полное. Запомните чередование носовых внутри польского: czesc с e под хвостиком, но czastka с a. Читается «чо́нстка», где a с хвостиком перед s даёт «он». В дательном и местном k переходит в c: w czastce. Главное сочетание — czastka elementarna."
idioms:
