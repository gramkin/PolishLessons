# review
id: kosmos
format: 2
lemma: "kosmos"
rank: 2546
pos: noun
pron: { cyr: "ко́смос" }
senses:
  - id: space
    ru: "космос, вселенная"
    examples:
      - pl: "Kosmos jest większy, niż potrafimy pojąć."
        ru: "Космос больше, чем мы способны постичь."
        source: { kind: authored }
      - pl: "Polecieli w kosmos na pół roku."
        ru: "Они улетели в космос на полгода."
        source: { kind: authored }
  - id: outer-space
    ru: "космическое пространство"
    examples:
      - pl: "W kosmosie nie ma powietrza."
        ru: "В космосе нет воздуха."
        source: { kind: authored }
      - pl: "Badanie kosmosu kosztuje miliardy."
        ru: "Исследование космоса стоит миллиарды."
        source: { kind: authored }
  - id: chaos-colloquial
    ru: "нечто невероятное (разг.)"
    examples:
      - pl: "Ceny w tym sklepie to jakiś kosmos."
        ru: "Цены в этом магазине — это что-то невероятное."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "У ПОЛЬСКОГО СЛОВА ЕСТЬ РАЗГОВОРНОЕ ЗНАЧЕНИЕ, КОТОРОГО РУССКОЕ НЕ ИМЕЕТ. TO JAKIŚ KOSMOS значит «это что-то невероятное, уму непостижимое» — о ценах, о бюрократии, о чьём-то поведении. Русский «космос» так не употребляется, и фразу приходится переводить описательно." }
  - { kind: usage, text: "Предложный — w KOSMOSIE, с мягким si. Обороты запоминай парами: LECIEĆ W KOSMOS, с винительным, о направлении, и BYĆ W KOSMOSIE, с предложным, о месте. Прилагательное — kosmiczny «космический», а przestrzeń kosmiczna — «космическое пространство»." }
  - { kind: pronunciation, text: "Два слога, ударение на первом: KOS-mos. Оба o открытые, s глухие: «ко́смос». Предложный kosmosie звучит «космо́ще», с мягким щ." }
collocations:
  - { pl: "w kosmosie", ru: "в космосе" }
  - { pl: "lecieć w kosmos", ru: "лететь в космос" }
  - { pl: "podbój kosmosu", ru: "освоение космоса" }
family:
  - { pl: "kosmiczny", ru: "космический", relation: derived, id: kosmiczny }
  - { pl: "gwiazda", ru: "звезда", relation: root, id: gwiazda }
  - { pl: "planeta", ru: "планета", relation: root, id: planeta }
etymology: "Из греческого kosmos «порядок, устройство мира», от того же корня, что «косметика» — буквально «украшение, упорядоченность». То же слово дало русский «космос». Греки называли вселенную порядком в противоположность хаосу."
memory: "kosmos — «космос», но запомни разговорное to jakiś kosmos «это что-то невероятное», которого в русском нет. Предложный — w kosmosie, а направление — w kosmos, с винительным."
idioms:
  - { pl: "to jakiś kosmos", ru: "это что-то невероятное" }
  - { pl: "podbój kosmosu", ru: "покорение космоса" }
