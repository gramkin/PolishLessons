pos: noun
pron: { cyr: "щвир" }
senses:
  - id: madness
    ru: "помешательство, «тараканы» (о состоянии)"
    examples:
      - pl: "Chyba masz świra, żeby tam iść samemu."
        ru: "Ты, похоже, не в себе, если идёшь туда один."
        source: { kind: authored }
      - pl: "Ma świra na punkcie starych samochodów."
        ru: "Он помешан на старых автомобилях."
        source: { kind: authored }
      - pl: "Od tego hałasu można dostać świra."
        ru: "От этого шума можно свихнуться."
        source: { kind: authored }
  - id: nutcase
    ru: "чудик, псих (о человеке)"
    examples:
      - pl: "Jakiś świr krzyczał na przystanku."
        ru: "Какой-то псих кричал на остановке."
