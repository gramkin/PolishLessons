      - pl: "Sąsiad to świr, ale nieszkodliwy."
        ru: "Сосед — чудик, но безобидный."
        source: { kind: authored }
notes:
  - { kind: register, text: "Слово разговорное и грубоватое, но не брань: так говорят между своими, в том числе о себе. MAM ŚWIRA NA PUNKCIE CZEGOŚ «я помешан на чём-то» звучит почти ласково и совершенно обиходно. А вот назвать человека ŚWIR в лицо — обидно, примерно как русское «псих». В официальной речи, в документах и в разговоре с незнакомым слова нет; нейтральные замены — WARIAT (тоже разговорное, но привычнее), CHORY PSYCHICZNIE и описательное DZIWAK «чудак»." }
  - { kind: usage, text: "Два значения разводятся по конструкции, и это главное в карточке. MIEĆ ŚWIRA и DOSTAĆ ŚWIRA — о состоянии, здесь ŚWIR неодушевлённое и значит «помешательство»: MAM ŚWIRA «я спятил». А TO ŚWIR, JAKIŚ ŚWIR — о человеке, и тогда слово одушевлённое. От этого зависит и множественное число: о людях — ŚWIRY или ŚWIROWIE, причём ŚWIRZY тоже встречается в небрежной речи. Предлог при увлечении всегда NA PUNKCIE с родительным: NA PUNKCIE PORZĄDKU «на почве порядка»." }
  - { kind: government, text: "В значении состояния слово стоит в винительном при MIEĆ и DOSTAĆ: MAM ŚWIRA, DOSTAŁ ŚWIRA. Винительный здесь совпадает с родительным, как у всех одушевлённых мужского рода, и форма ŚWIRA служит обоим падежам. Предмет помешательства вводится оборотом NA PUNKCIE плюс родительный: ŚWIR NA PUNKCIE CZYSTOŚCI. Русский строит ту же мысль иначе — «помешан на чистоте», с предложным падежом, так что предлог придётся заучить отдельно." }
  - { kind: pronunciation, text: "Читается «щвир», один слог, с ś перед w. Сочетание ŚW для русского непривычно: ś мягкое, нечто между «сь» и «щ», и в транскрипции мы передаём его как «щ». Буква i после r не смягчает r, а показывает гласную «и»: не «сьвирь», а «щвир», с твёрдым конечным r. В местном и звательном падеже ŚWIRZE звучит «щви́же», потому что rz даёт «ж»." }
collocations:
  - { pl: "mieć świra", ru: "быть не в себе, спятить" }
  - { pl: "dostać świra", ru: "свихнуться" }
  - { pl: "świr na punkcie czegoś", ru: "помешательство на чём-то" }
family:
  - { pl: "świrować", ru: "сходить с ума, дурить", relation: derived }
  - { pl: "wariat", ru: "сумасшедший, безумец", relation: root, id: wariat }
  - { pl: "dziwak", ru: "чудак", relation: root }
etymology: "Слово молодое и разговорное, от глагола ŚWIROWAĆ «дурить, сходить с ума», а тот, по наиболее принятому объяснению, от ŚWIDER «сверло», ŚWIDROWAĆ «сверлить»: образ ввинчивания, то есть «у него в голове сверлит». Корень тот же, что в русском «сверло», «сверлить», из праславянского *svьrdlo, где польское ŚWID- и русское «свёрл-» расходятся по обычной линии: польское ś перед i там, где русский держит твёрдое с. Родства с русским «псих» нет никакого: «псих» — греческое, из «психика», а ŚWIR целиком славянский и построен на бытовом образе сверления. Поэтому и значение у него мягче: не диагноз, а чудаковатость."
memory: "mieć świra — «быть не в себе», а sam świr — уже про человека, «псих, чудик». Увлечение вводится через na punkcie с родительным: ma świra na punkcie porządku. Читается «щвир», одним слогом. Родня не «психу», а слову świder «сверло»: в голове сверлит."
idioms:
  - { pl: "mieć świra na punkcie czegoś", ru: "быть помешанным на чём-то" }
  - { pl: "dostać świra", ru: "свихнуться, потерять голову" }
