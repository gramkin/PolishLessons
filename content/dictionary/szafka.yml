    examples:
      - pl: "Szafka nocna stoi przy łóżku."
        ru: "Тумбочка стоит у кровати."
        source: { kind: authored }
      - pl: "Na szafce stoi lampka."
        ru: "На тумбочке стоит лампа."
        source: { kind: authored }
notes:
  - { kind: pronunciation, text: "Дательный и предложный — SZAFCE, с переходом k в c, родительный множественного — SZAFEK, с беглой e. Это третье слово такого рода в словаре после kostka и kulka, и правило уже можно считать общим для всех уменьшительных на -ka: перед -e заднеязычный смягчается, а в форме без окончания вставляется гласная." }
  - { kind: usage, text: "Уменьшительное от SZAFA «шкаф». Оба слова, польское szafa и русское «шкаф», пришли из немецкого, но по-разному улеглись: польский сделал слово женским, русский мужским. Сама szafka покрывает то, что русский делит по предмету: szafka nocna — тумбочка, szafka w szatni — шкафчик в раздевалке, szafka kuchenna — кухонный шкафчик. Отдельно стоит помнить оборот с большим шкафом: trup w szafie — это «скелет в шкафу»." }
collocations:
  - { pl: "szafka nocna", ru: "тумбочка" }
  - { pl: "szafka kuchenna", ru: "кухонный шкафчик" }
  - { pl: "szafka w szatni", ru: "шкафчик в раздевалке" }
family:
  - { pl: "szafa", ru: "шкаф", relation: root, id: szafa }
  - { pl: "szafeczka", ru: "шкафчик", relation: derived }
  - { pl: "szafkowy", ru: "шкафной", relation: derived }
etymology: "Уменьшительное от SZAFA, а то пришло из немецкого Schaff «ящик, шкаф». Русское «шкаф» того же немецкого происхождения, только взято в мужском роде, тогда как польский приписал слово к женскому. Отсюда вся разница в облике: ta szafa, ta szafka, но «этот шкаф»."
memory: "Дательный SZAFCE с k → c, родительный множественного SZAFEK с беглой e — как kostka и kulka. А szafa — это «шкаф», только женского рода."
idioms:
  - { pl: "szafka nocna", ru: "тумбочка" }
  - { pl: "trup w szafie", ru: "скелет в шкафу" }
