# review
id: odcisk
format: 2
lemma: "odcisk"
rank: 1279
pos: noun
pron: { cyr: "о́тциск" }
senses:
  - id: imprint
    ru: "отпечаток, оттиск, слепок"
    examples:
      - pl: "Zdejmiemy odcisk zębów."
        ru: "Мы снимем слепок зубов."
        source: { kind: translated, id: 929216 }
      - pl: "Poszedłem ostatnio do dentysty. Zrobił odcisk i rentgen zębów, że niby na wszelki wypadek. Niezły zawód..."
        ru: "Недавно я пошёл к стоматологу. Он сделал слепок и рентген зубов."
        source: { kind: translated, id: 945819 }
      - pl: "Twoje odciski palców były na pistolecie."
        ru: "Твои отпечатки пальцев были на пистолете."
        source: { kind: translated, id: 10584346 }
  - id: fingerprints
    ru: "odciski palców — отпечатки пальцев; а также мозоль"
    examples:
      - pl: "Skąd się wzięły twoje odciski palców na tej szklance?"
        ru: "Откуда взялись твои отпечатки пальцев на этом стакане?"
        source: { kind: translated, id: 1350417 }
      - pl: "Policja twierdzi, że odciski palców Toma zostały znalezione na broni."
        ru: "Полиция утверждает, что отпечатки пальцев Тома нашли на оружии."
        source: { kind: translated, id: 4817845 }
      - pl: "Będę mówić, co myślę, nawet jeśli nadepnę komuś na odcisk."
        ru: "Я буду говорить, что думаю, даже если наступлю кому-то на мозоль."
        source: { kind: translated, id: 13690218 }
notes:
  - { kind: usage, text: "Два значения: «отпечаток, оттиск» (odcisk palca, odcisk zębów) и «мозоль» на ноге." }
  - { kind: usage, text: "Odciski palców — «отпечатки пальцев», почти всегда во множественном числе." }
  - { kind: usage, text: "Идиома nadepnąć komuś na odcisk значит «задеть за живое», буквально «наступить кому-то на мозоль» — русский оборот устроен так же." }
  - { kind: pronunciation, text: "Приставка od- перед глухим c оглушается, и слово звучит «о́тциск»." }
collocations:
  - { pl: "odciski palców", ru: "отпечатки пальцев" }
  - { pl: "odcisk zębów", ru: "слепок зубов" }
  - { pl: "nadepnąć na odcisk", ru: "задеть за живое" }
etymology: "От odcisnąć «оттиснуть», из od- и cisnąć «давить». Русский «оттиск» собран ровно теми же частями."
memory: "odcisk — «отпечаток» (odciski palców «отпечатки пальцев») и заодно «мозоль». Отсюда идиома nadepnąć komuś na odcisk «задеть за живое» — по-русски говорят точно так же."
idioms:
  - { pl: "odciski palców", ru: "отпечатки пальцев" }
  - { pl: "nadepnąć na odcisk", ru: "задеть за живое" }
  - { pl: "odcisk stopy", ru: "отпечаток ступни" }
