etymology: "От STARY «старый», из праславянского *starъ, того же корня, что русское «старый», «старость», «старец». Суффикс -CZY образует в польском относительные прилагательные от основ существительных и прилагательных, и в русском ему отвечает -ЧЕСКИЙ или просто -СКИЙ: STARCZY и «старческий», DZIEWICZY и «девичий». Отдельно стоит глагол STARCZYĆ «хватить», чья форма третьего лица звучит точно так же, STARCZY; совпадение полное, и в текстах оно постоянно создаёт двусмысленность, которую снимает только порядок слов и наличие существительного. Утверждать, что оба слова восходят к одному корню, я не берусь: это разные гнёзда в современном языке, и для учащегося они и должны остаться разными."
memory: "Главное: starczy чаще всего не «старческий», а «хватит» — третье лицо от starczyć. To starczy, starczy na tydzień. Прилагательное starczy живёт в книжных и медицинских оборотах: wiek starczy, demencja starcza. Степеней нет, и форм всего десять: мужской личный множественного совпадает с единственным, обе starczy. В быту о человеке скажут stary, а не starczy."
