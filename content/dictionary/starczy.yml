notes:
  - { kind: false-friend, text: "Самое важное про это слово: оно почти всегда не прилагательное. STARCZY — это ещё и форма третьего лица единственного числа от глагола STARCZYĆ «хватить», и в живой речи учащийся встретит её в десять раз чаще: TO STARCZY «этого хватит», STARCZY NA TYDZIEŃ «хватит на неделю», STARCZY TEGO «хватит об этом». Прилагательное STARCZY «старческий» живёт почти только в медицинских и книжных оборотах: WIEK STARCZY, DEMENCJA STARCZA, ZMIANY STARCZE. Значит, увидев STARCZY, сначала проверьте, не глагол ли это: если рядом стоит существительное в именительном, скорее прилагательное, а если слово стоит само или с предлогом NA — это «хватит»." }
  - { kind: usage, text: "Прилагательное относительное: степеней сравнения не образует, потому что старческим нельзя быть «более» или «менее» — это свойство возраста, а не качество. Отсюда и всего десять форм вместо одиннадцати: мужской личный именительный множественного совпадает с мужским именительным единственного, обе формы STARCZY. Такое совпадение в польском обычно для прилагательных с основой на -CZ, -SZ, -Ż. Для оценки состояния человека вместо STARCZY употребляют STARY «старый» или подбирают описание: CZŁOWIEK W PODESZŁYM WIEKU «человек в пожилом возрасте», и это вежливее." }
  - { kind: government, text: "Согласуется с существительным в роде, числе и падеже, как всякое польское прилагательное. Частотные сочетания медицинские и описательные: WIEK STARCZY «старческий возраст», DEMENCJA STARCZA «старческая деменция», ZMIANY STARCZE «старческие изменения», PLAMY STARCZE «старческие пятна», NIEDOSŁUCH STARCZY «старческое снижение слуха». В отличие от русского, где «старческий» свободно присоединяется к любому слову, польское STARCZY в бытовой речи звучит книжно, и чаще скажут STARE RĘCE, а не STARCZE RĘCE." }
  - { kind: pronunciation, text: "Читается «ста́рчы», два слога, ударение на первом. Сочетание CZ даёт «ч», твёрдое и короткое, как русское «ч» в «что». Буква Y это «ы», а не «и», поэтому конец слова звучит «чы», и это слышно отчётливо. В форме STARCZEJ сочетание CZE читается «че»: «ста́рчей». В форме STARCZĄ носовое Ą даёт «он»: «ста́рчон». Разница с существительным STARZEC «старик» в согласном: там Z даёт «ж», «ста́жец»." }
