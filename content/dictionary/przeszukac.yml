  - { pl: "przeszukiwać", ru: "обыскивать", relation: aspect }
  - { pl: "poszukiwać", ru: "разыскивать", relation: derived }
etymology: "Приставка prze- плюс szukać «искать», праславянское *šukati. В литературном русском этого корня нет — там «искать», — но областное «шукать» и украинское «шукати» идут от того же слова. Приставка prze- даёт значение «насквозь, по всему», отсюда «перерыть всё»; та же приставка в przeczytać «прочитать» и przejść «пройти»."
memory: "przeszukać — «обыскать», prze- + szukać «искать» (ср. областное «шукать»). Главное о падеже: szukać берёт родительный (szukam kluczy), а przeszukać — винительный (przeszukał mieszkanie). Причастие przeszukany, множественное przeszukani."
