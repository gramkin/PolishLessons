notes:
  - { kind: government, text: "ВАЖНОЕ наблюдение: приставка меняет падеж. Простое szukać требует РОДИТЕЛЬНОГО — szukam pracy, szukam kluczy «ищу работу, ищу ключи». А приставочное przeszukać требует ВИНИТЕЛЬНОГО — przeszukał mieszkanie, przeszukali bagaże. Два родственных глагола, два разных управления, и перенести одно на другое нельзя." }
  - { kind: false-friend, text: "Корень szukać прозрачного соответствия в литературном русском не имеет: там на это значение взято «искать». Родственник есть, но областной — «шукать», и украинское «шукати»; опираться на него в речи не стоит, хотя узнать слово он помогает. Приставка prze- здесь значит «насквозь, по всему»: перерыть всё от начала до конца." }
  - { kind: usage, text: "Отглагольное существительное przeszukanie — юридический термин, отвечающий русскому «обыску»: przeszukanie z nakazem, przeszukanie mieszkania. Несовершенная пара — przeszukiwać, и она обычна о длительном поиске: przeszukiwali las całą noc." }
  - { kind: pronunciation, text: "ТРЕТИЙ образец страдательного причастия, и теперь можно вывести правило. Глаголы на -ać дают -any, а в мужско-личном множественном -ani: zbadany — zbadani, przeszukany — przeszukani. Глаголы на -ić/-yć дают -ony и -eni (zatrudniony — zatrudnieni, odrzucony — odrzuceni). Небольшая группа даёт -ty и -ci (pobity — pobici). Класс причастия предсказуем по инфинитиву, так что заучивать его отдельно для каждого глагола не нужно." }
