# review
id: poziom
format: 2
lemma: "poziom"
rank: 960
pos: noun
pron: { cyr: "по́зём" }
senses:
  - id: level
    ru: "уровень (величина, показатель)"
    examples:
      - pl: "Mam wysoki poziom cholesterolu."
        ru: "У меня высокий уровень холестерина."
        source: { kind: tatoeba, id: 614560 }
      - pl: "Spadł poziom jeziora."
        ru: "Уровень озера упал."
        source: { kind: translated, id: 10600704 }
      - pl: "Jej gorączka spadła do normalnego poziomu."
        ru: "Её температура упала до нормального уровня."
        source: { kind: translated, id: 836449 }
  - id: standard
    ru: "уровень (качества, подготовки)"
    examples:
      - pl: "Jaki jest twój poziom angielskiego?"
        ru: "Какой у тебя уровень английского?"
        source: { kind: translated, id: 13627071 }
      - pl: "Jej gra jest na poziomie profesjonalnym."
        ru: "Её игра на профессиональном уровне."
        source: { kind: translated, id: 731847 }
      - pl: "Znam angielski na poziomie B2."
        ru: "Я знаю английский на уровне B2."
        source: { kind: translated, id: 13726549 }
  - id: sea-level
    ru: "nad poziomem morza — над уровнем моря"
    examples:
      - pl: "Góra ponad 3000 metrów nad poziomem morza."
        ru: "Гора выше трёх тысяч метров над уровнем моря."
        source: { kind: translated, id: 524623 }
      - pl: "To miasteczko jest 1600 metrów nad poziomem morza."
        ru: "Этот городок на высоте тысячи шестисот метров над уровнем моря."
        source: { kind: translated, id: 10541853 }
      - pl: "Nie zniżę się do jego poziomu."
        ru: "Я не опущусь до его уровня."
        source: { kind: translated, id: 591071 }
notes:
  - { kind: usage, text: "nad poziomem morza — «над уровнем моря», устойчивое сочетание с творительным падежом." }
  - { kind: usage, text: "na poziomie — «на уровне»: na poziomie B2, na wysokim poziomie. А być na poziomie значит «быть на высоте, держать марку»." }
  - { kind: government, text: "zniżyć się DO czyjegoś poziomu «опуститься до чьего-то уровня» — родительный после do." }
  - { kind: usage, text: "Прилагательное poziomy значит «горизонтальный» — в противоположность pionowy «вертикальный». Это не то же, что «уровневый»." }
collocations:
  - { pl: "nad poziomem morza", ru: "над уровнем моря" }
  - { pl: "na wysokim poziomie", ru: "на высоком уровне" }
  - { pl: "poziom wody", ru: "уровень воды" }
  - { pl: "być na poziomie", ru: "быть на уровне (высокого качества)" }
family:
  - { pl: "poziomy", ru: "горизонтальный", relation: derived }
  - { pl: "wypoziomować", ru: "выровнять", relation: derived }
etymology: "Из po- + ziom, от ziemia «земля»: изначально «вровень с землёй». Русское «уровень» собрано иначе, от «ровный», но мысль та же."
memory: "poziom — «уровень». Внутри сидит ziemia «земля»: буквально «вровень с землёй». Запомните nad poziomem morza «над уровнем моря» и na wysokim poziomie «на высоком уровне». А прилагательное poziomy значит «горизонтальный», а не «уровневый»."
idioms:
  - { pl: "nad poziomem morza", ru: "над уровнем моря" }
  - { pl: "na wysokim poziomie", ru: "на высоком уровне" }
  - { pl: "być na poziomie", ru: "быть на уровне (высокого качества)" }
