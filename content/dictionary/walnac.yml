  - { pl: "walnięcie", ru: "удар", relation: derived }
  - { pl: "zwalić", ru: "свалить", relation: root }
etymology: "Однократная форма на -NĄĆ от WALIĆ «бить, валить», из праславянского *valiti — то же слово, что русское «валить». Приставки и суффиксы в этом гнезде русскому знакомы насквозь: WALIĆ «валить», ZWALIĆ «свалить», OBALIĆ «свалить, опрокинуть», WALEC «вал, валик». Суффикс -NĄĆ придаёт однократность, как русское -ну- в «стукнуть» против «стучать», так что WALNĄĆ к WALIĆ стоит ровно как «вмазать» к «бить»."
memory: "От walić «валить, бить» с однократным -nąć, как русское «стукнуть» от «стучать». Разговорное. И запомните walnięty — «чокнутый»."
