notes:
  - { kind: register, text: "Слово разговорное, и это надо держать в голове: в деловом письме или на экзамене WALNĄĆ не место. Нейтральные замены — UDERZYĆ «ударить», TRZASNĄĆ «хлопнуть», POWIEDZIEĆ WPROST «сказать прямо». Зато в живой речи глагол очень частый и держит целый веер смыслов: ударить, брякнуть, грохнуться, выпить. WALNĄĆ SIĘ значит «шлёпнуться», а WALNIĘTY в разговоре — «чокнутый», и это слово услышать можно куда чаще самого глагола." }
  - { kind: pronunciation, text: "Основа кончается сочетанием WALN-, и этим сочетанием польское слово закончиться не может — поэтому повелительное получает вставку -ij: WALNIJ, WALNIJMY, WALNIJCIE. Это тот самый случай, под который правило из карточки KARMIĆ было исправлено в партии 259: решает не окончание третьего лица, а способность основы закрыть слово. Сравните с POGRZEBAĆ из прошлой партии, где основа POGRZEB- слово закончить может и повелительное выходит просто POGRZEB." }
  - { kind: pronunciation, text: "Гласная в основе меняется по положению, как у TRZĄŚĆ из партии 259. В закрытом слоге стоит ą: WALNĄĆ, WALNĄŁ, WALNĄŁEM. В открытом — ę: WALNĘŁA, WALNĘŁO, WALNĘLI, WALNĘŁY, WALNĘ. То есть мужской род единственного числа прошедшего времени стоит особняком с ą, а все остальные формы берут ę — ровно как TRZĄSŁ при TRZĘSŁA. Это одна и та же древняя носовая гласная в двух положениях." }
  - { kind: usage, text: "Страдательное причастие у глаголов на -NĄĆ образуется не на -ony, как у глаголов на -IĆ, а на -ęty: WALNIĘTY, WALNIĘTA, WALNIĘTE, и мужская личная форма множественного — WALNIĘCI. Сравните с KARMIONY при KARMIĆ и OBRAŻONY при OBRAZIĆ. Поэтому и мены o на e, о которой говорит карточка KARMIĆ, здесь нет вовсе: менять нечего, гласная в причастии другая. Отглагольное существительное тоже на -ęcie: WALNIĘCIE." }
collocations:
