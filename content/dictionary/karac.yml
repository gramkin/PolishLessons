# review
id: karac
format: 2
lemma: "karać"
rank: 4482
pos: verb
pron: { cyr: "ка́раць" }
senses:
  - id: punish
    ru: "наказывать"
    examples:
      - pl: "Rodzice karzą go za kłamstwa."
        ru: "Родители наказывают его за ложь."
        source: { kind: authored }
      - pl: "Prawo surowo karze za jazdę po pijanemu."
        ru: "Закон строго наказывает за вождение в нетрезвом виде."
        source: { kind: authored }
      - pl: "Nie karz dziecka krzykiem."
        ru: "Не наказывай ребёнка криком."
        source: { kind: authored }
  - id: fine
    ru: "штрафовать (KARAĆ MANDATEM, GRZYWNĄ)"
    examples:
      - pl: "Policja karze kierowców mandatami."
        ru: "Полиция штрафует водителей."
        source: { kind: authored }
      - pl: "Za śmiecenie karze się grzywną."
        ru: "За мусор на улице штрафуют."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "KARAĆ — «карать» и «наказывать». Русское «карать» звучит торжественно, а польское KARAĆ — обычное бытовое слово: о детях, о штрафах, о спорте. KARA — «наказание», а также «штраф» и «пенальти»: RZUT KARNY." }
  - { kind: usage, text: "Несовершенный вид; совершенный — UKARAĆ. Спряжение с чередованием R → RZ: KARZĘ, KARZESZ, KARZĄ; повелительное — KARZ. Прошедшее без чередования: KARAŁ, KARALI." }
  - { kind: government, text: "Кого — винительный: KARAĆ UCZNIA. За что — ZA с винительным: ZA SPÓŹNIENIE. Чем — творительный: KARAĆ MANDATEM, WIĘZIENIEM. Как совпадает с русским «наказывать кого-то за что-то»." }
  - { kind: pronunciation, text: "Читается «ка́раць», ударение на первом слоге. KARZĘ — «ка́жэ»: RZ — «ж»." }
  - { kind: register, text: "Нейтральное слово. В праве — KARALNY «наказуемый», NIEKARALNY «без судимости»: ZAŚWIADCZENIE O NIEKARALNOŚCI «справка о несудимости»." }
collocations:
  - { pl: "karać za coś", ru: "наказывать за что-то" }
  - { pl: "karać mandatem", ru: "штрафовать" }
  - { pl: "surowo karać", ru: "строго наказывать" }
family:
  - { pl: "ukarać", ru: "наказать", relation: aspect, id: ukarac }
  - { pl: "kara", ru: "наказание, штраф", relation: derived, id: kara }
  - { pl: "nagradzać", ru: "награждать", relation: antonym }
etymology: "Праславянское *karati «наказывать, бранить», как русское «карать», «кара». Польское слово осталось бытовым, а русское стало высоким."
memory: "Karać — наказывать: rodzice karzą go za kłamstwa. Karzę, karzesz — с RZ! Kara — наказание и штраф."
idioms:
  - { pl: "Bóg nie rychliwy, ale sprawiedliwy", ru: "Бог не спешит, да справедлив (о том, кто наказан не сразу)" }
