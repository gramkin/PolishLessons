# review
id: pojsc
format: 2
lemma: "pójść"
rank: 124
pos: verb
aspect: perf
aspectPair: isc
pron: { cyr: "пу́йсьць" }
senses:
  - id: go
    ru: "пойти, отправиться (пешком)"
    examples:
      - pl: "Wszyscy poszli."
        ru: "Все пошли."
        source: { kind: tatoeba, id: 4837803 }
      - pl: "Poszedłem w góry."
        ru: "Я пошёл в горы."
        source: { kind: tatoeba, id: 10202725 }
      - pl: "Dokąd ona poszła?"
        ru: "Куда она пошла?"
        source: { kind: tatoeba, id: 6154742 }
  - id: turn-out
    ru: "пойти, пройти (о ходе дел)"
    examples:
      - pl: "Wszystko poszło dobrze."
        ru: "Всё прошло хорошо."
        source: { kind: authored }
      - pl: "Egzamin poszedł mi dobrze."
        ru: "Экзамен у меня прошёл хорошо."
        source: { kind: authored }
      - pl: "Poszło łatwiej, niż myślałem."
        ru: "Пошло легче, чем я думал."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Совершенный вид к iść: Idę do sklepu «Иду в магазин» — Poszedłem do sklepu «Я пошёл в магазин»." }
  - { kind: usage, text: "pójść po coś значит «сходить за чем-то»: Pójdę po chleb «Схожу за хлебом»." }
  - { kind: usage, text: "Безличное poszło переводится как «прошло, получилось»: Jak poszło? «Как прошло?»" }
collocations:
  - { pl: "pójść do domu", ru: "пойти домой" }
  - { pl: "pójść po chleb", ru: "сходить за хлебом" }
  - { pl: "pójść spać", ru: "пойти спать" }
  - { pl: "jak poszło?", ru: "как прошло?" }
etymology: "Приставка po- + iść; ср. русское «пойти» (по + идти). В прошедшем времени основа меняется: poszedł, как «пошёл»."
memory: "pójdę «пойду» — poszedłem «я пошёл», ровно как в русском. Pójść po coś — «сходить за чем-то», а Jak poszło? — «Как прошло?»."
idioms:
  - { pl: "pójść na całość", ru: "пойти ва-банк" }
  - { pl: "pójść po rozum do głowy", ru: "взяться за ум" }
  - { pl: "pójść do Canossy", ru: "пойти с повинной" }
