pron: { cyr: "до́браць" }
senses:
  - id: match
    ru: "подобрать (подходящее)"
    examples:
      - pl: "Dobrała torebkę do butów."
        ru: "Она подобрала сумочку к туфлям."
        source: { kind: authored }
      - pl: "Trzeba dobrać odpowiednie słowa."
        ru: "Нужно подобрать подходящие слова."
        source: { kind: authored }
      - pl: "Lekarz dobrał mi nowe okulary."
        ru: "Врач подобрал мне новые очки."
        source: { kind: authored }
  - id: add
    ru: "добрать, взять ещё (еды, карт)"
    examples:
      - pl: "Dobrał sobie ziemniaków."
        ru: "Он подложил себе ещё картошки."
        source: { kind: authored }
      - pl: "Dobierz kartę z talii."
        ru: "Возьми ещё карту из колоды."
        source: { kind: authored }
  - id: get-at
    ru: "с SIĘ — добраться (до чего-то), подобраться"
    examples:
      - pl: "Dzieci dobrały się do słodyczy."
        ru: "Дети добрались до сладостей."
        source: { kind: authored }
      - pl: "Złodziej dobrał się do sejfu."
        ru: "Вор добрался до сейфа."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "DOBRAĆ — «подобрать подходящее», а не «добрать» до конца. «Подобрать с пола» — PODNIEŚĆ. «Добраться до места» — DOTRZEĆ или DOSTAĆ SIĘ, а DOBRAĆ SIĘ DO CZEGOŚ — «добраться до чего-то запретного»: DOBRAĆ SIĘ DO LODÓWKI." }
  - { kind: usage, text: "Пятьдесят три формы. Будущее с чередованием: DOBIORĘ, DOBIERZESZ, DOBIORĄ; повелительное DOBIERZ. Страдательное DOBRANY — «подходящий, подобранный»: DOBRANA PARA «хорошая пара». Несовершенный вид — DOBIERAĆ." }
  - { kind: government, text: "Что — винительный, к чему — DO с родительным: DOBRAĆ KRAWAT DO KOSZULI. Чего добавить — родительный: DOBRAĆ ZUPY, DOBRAĆ KART. С SIĘ — DO с родительным: DOBRAĆ SIĘ DO ZAPASÓW." }
  - { kind: pronunciation, text: "Читается «до́браць», ударение на первом слоге. DOBIORĘ — «добё́рэ», DOBIERZ — «до́беж»: конечное RZ оглушается в «ш»." }
  - { kind: register, text: "Нейтральное слово: DOBRAĆ KOLORY, DOBRAĆ LUDZI DO ZESPOŁU. DOBRAĆ SIĘ DO KOGOŚ — разговорное, с оттенком приставаний или расправы: «ну я до него доберусь»." }
collocations:
  - { pl: "dobrać kolory", ru: "подобрать цвета" }
  - { pl: "dobrać ludzi do zespołu", ru: "подобрать людей в команду" }
  - { pl: "dobrać się do słodyczy", ru: "добраться до сладостей" }
family:
  - { pl: "brać", ru: "брать", relation: root, id: brac }
  - { pl: "wybrać", ru: "выбрать", relation: derived, id: wybrac }
  - { pl: "dobierać", ru: "подбирать", relation: aspect }
etymology: "Приставка DO- плюс BRAĆ «брать», будущее DOBIORĘ — от того же корня. Значение «подобрать подходящее» — из «добрать недостающее до пары»."
memory: "Dobrać — подобрать: dobrała torebkę do butów. Dobrana para — хорошая пара. Dobrać się do — добраться до. Читается «до́браць»."
idioms:
  - { pl: "dobrali się jak w korcu maku", ru: "два сапога пара, нашли друг друга" }
