notes:
  - { kind: false-friend, text: "DEKADA — прежде всего «десятилетие», как английское DECADE. Русская «декада», десять дней, тоже бывает: PIERWSZA DEKADA MAJA. В быту о десяти годах чаще говорят DZIESIĘĆ LAT." }
  - { kind: usage, text: "Девять форм, женский род. В местном D переходит в DZ: W DEKADZIE. Родительный множественного — DEKAD. Звательный DEKADO не употребляется." }
  - { kind: government, text: "В течение десятилетия — PRZEZ DEKADĘ, винительный. За последнее десятилетие — W OSTATNIEJ DEKADZIE, местный. Альбом десятилетия — ALBUM DEKADY." }
  - { kind: pronunciation, text: "Читается «дэка́да»: DE — твёрдое «дэ». Ударение на предпоследнем слоге. DEKADZIE — «дэка́дзе»." }
