etymology: "Из греческого DEKAS «десяток», от DEKA «десять». Русское «декада» — то же слово, но со значением «десять дней»."
memory: "Dekada — десятилетие (и декада, десять дней). W ostatniej dekadzie — за последнее десятилетие. Читается «дэка́да»."
