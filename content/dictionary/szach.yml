notes:
  - { kind: false-friend, text: "Шахматы по-польски SZACHY — то же слово SZACH во множественном числе, без всякого «-маты». GRAĆ W SZACHY — играть в шахматы, W с винительным. SZACHOWNICA — не только доска, но и узор: KOSZULA W SZACHOWNICĘ — рубашка в клетку. Ферзь в польских шахматах — HETMAN, ладья — WIEŻA, слон — GONIEC." }
  - { kind: usage, text: "Одиннадцать форм, мужской род. Во множественном две формы по смыслу: SZACHY — шахи в партии и сама игра, SZACHOWIE — шахи-монархи. Винительный — SZACHA: DAĆ SZACHA, «объявить шах», так же как о правителе." }
  - { kind: government, text: "Объявить шах — DAĆ SZACHA, винительный. Под шахом — W SZACHU, местный: KRÓL JEST W SZACHU. Держать в напряжении — TRZYMAĆ KOGOŚ W SZACHU, буквально «держать под шахом»." }
  - { kind: pronunciation, text: "Читается «шах», один слог, как по-русски. SZ даёт «ш», CH — «х». В косвенных формах ударение на первом слоге: SZACHU — «ша́ху»." }
  - { kind: register, text: "TRZYMAĆ KOGOŚ W SZACHU — книжный и газетный оборот о противнике, которого держат в напряжении угрозой: ARMIA TRZYMAŁA MIASTO W SZACHU. Значение «монарх» встречается в разговоре об Иране и в старых историях." }
collocations:
  - { pl: "dać szacha", ru: "объявить шах" }
  - { pl: "być w szachu", ru: "быть под шахом" }
  - { pl: "szach hetmanem", ru: "шах ферзём" }
family:
  - { pl: "szachy", ru: "шахматы", relation: derived }
  - { pl: "szachista", ru: "шахматист", relation: derived }
  - { pl: "szachownica", ru: "шахматная доска; клетка (узор)", relation: derived }
etymology: "Из персидского слова со значением «царь». Шахматный «мат» — тоже персидское слово, и всё восклицание значит «царь беспомощен». Польский, как и русский, взял слово целиком, но назвал игру просто SZACHY, по главному ходу."
memory: "Szach — шах, и в партии, и на троне. Шахматы — szachy, играть в шахматы — grać w szachy. Dać szacha — объявить шах. Trzymać w szachu — держать в напряжении. Szachownica — доска и клетка: koszula w szachownicę."
idioms:
  - { pl: "trzymać kogoś w szachu", ru: "держать кого-то в напряжении, в страхе" }
