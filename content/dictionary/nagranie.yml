# review
id: nagranie
format: 2
lemma: "nagranie"
rank: 2592
pos: noun
pron: { cyr: "награ́не" }
senses:
  - id: recording
    ru: "запись (аудио, видео)"
    examples:
      - pl: "To nagranie jest nudne."
        ru: "Эта запись скучная."
        source: { kind: translated, id: 753807 }
      - pl: "To jest moje nowe nagranie."
        ru: "Это моя новая запись."
        source: { kind: translated, id: 4258166 }
      - pl: "Wyślę Ci nagranie z moim głosem."
        ru: "Я пришлю тебе запись со своим голосом."
        source: { kind: translated, id: 3496387 }
  - id: listen-recording
    ru: "запись (слушать, смотреть)"
    examples:
      - pl: "Proszę posłuchać nagrania."
        ru: "Послушайте, пожалуйста, запись."
        source: { kind: translated, id: 2427650 }
      - pl: "Słuchałem niektórych jego nagrań."
        ru: "Я слушал некоторые его записи."
        source: { kind: translated, id: 3496507 }
      - pl: "Nagranie z kamery monitoringu przyłapało Toma na rozpalaniu ognia."
        ru: "Запись с камеры наблюдения засняла, как Том разжигает огонь."
        source: { kind: translated, id: 10149476 }
notes:
  - { kind: usage, text: "Отглагольное существительное от nagrać «записать»: буквально «записывание», но в живой речи это готовая запись." }
  - { kind: government, text: "Слушать запись — słuchać nagrania (родительный падеж); на записи — na nagraniu (предложный)." }
  - { kind: usage, text: "nagranie значит и аудио, и видео: nagranie z kamery «запись с камеры», nagranie dźwiękowe «звукозапись»." }
  - { kind: false-friend, text: "Русское «награда» тут ни при чём: nagranie от grać «играть, записывать», а награда по-польски nagroda." }
collocations:
  - { pl: "słuchać nagrania", ru: "слушать запись" }
  - { pl: "nagranie z kamery", ru: "запись с камеры" }
  - { pl: "nagranie dźwiękowe", ru: "звукозапись" }
family:
  - { pl: "nagrać", ru: "записать", relation: root, id: nagrac }
  - { pl: "nagrywać", ru: "записывать", relation: root }
  - { pl: "muzyka", ru: "музыка", relation: root, id: muzyka }
etymology: "Отглагольное существительное от nagrać «записать», приставка na- плюс grać «играть». Русская «награда» — слово другого корня, по-польски nagroda."
memory: "nagranie — «запись», и аудио, и видео: słuchać nagrania «слушать запись», nagranie z kamery. Глагол — nagrać, несовершенный nagrywać."
idioms:
  - { pl: "słuchać nagrania", ru: "слушать запись" }
  - { pl: "nagranie z kamery", ru: "запись с камеры" }
  - { pl: "nagranie dźwiękowe", ru: "звукозапись" }
