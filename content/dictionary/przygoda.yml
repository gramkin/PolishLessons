notes:
  - { kind: false-friend, text: "Не «пригода» и не «пригодиться». Корень przygodzić się «случиться»; ср. русское «приключение» от «ключиться, случиться» — образ тот же." }
  - { kind: government, text: "Женский род: ta przygoda, tej przygody. Жаждущий приключений — żądny przygód, с родительным." }
  - { kind: usage, text: "В разговорной речи przygoda может значить и мимолётный роман." }
  - { kind: usage, text: "Прилагательное przygodowy «приключенческий»: film przygodowy." }
collocations:
  - { pl: "żądny przygód", ru: "жаждущий приключений" }
  - { pl: "film przygodowy", ru: "приключенческий фильм" }
etymology: "От przygodzić się «случиться»; русское «приключение» от «ключиться» построено на том же образе случившегося."
memory: "przygoda — «приключение». Корень «случиться», как и в русском слове. Запомните żądny przygód «жаждущий приключений», с родительным падежом."
idioms:
