# review
id: mianowicie
format: 2
lemma: "mianowicie"
rank: 5402
pos: conj
pron: { cyr: "мянови́це" }
senses:
  - id: namely
    ru: "а именно"
    examples:
      - pl: "Hosni Mubarak ma tylko jednego przyjaciela, mianowicie Izrael."
        ru: "У Хосни Мубарака только один друг, а именно Израиль."
        source: { kind: translated, id: 6178317 }
      - pl: "Pozostaje mi już tylko zanotować jeden fakt z owego dnia, a mianowicie moją rozmowę z Barrymore'em."
        ru: "Мне остаётся отметить лишь один факт того дня, а именно мой разговор с Бэрримором."
        source: { kind: authored }
      - pl: "Brakuje nam jednego, a mianowicie czasu."
        ru: "Нам не хватает одного, а именно времени."
        source: { kind: authored }
  - id: that-is
    ru: "то есть, а конкретно (вводит перечисление)"
    examples:
      - pl: "Przyjadą we trójkę, mianowicie ojciec, matka i syn."
        ru: "Они приедут втроём, а именно отец, мать и сын."
        source: { kind: authored }
      - pl: "Interesuje mnie jedno, mianowicie wynik."
        ru: "Меня интересует одно, а именно результат."
        source: { kind: authored }
      - pl: "Zostało nam jedno wyjście, mianowicie poczekać."
        ru: "У нас остался один выход, а именно подождать."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Внутри сидит miano «имя» и mianować «называть» — слово построено ровно как русское «именно» от «имени»." }
  - { kind: usage, text: "Обычно идёт после запятой и союза a: …, a mianowicie… «…, а именно…»." }
  - { kind: register, text: "Книжное. В разговоре ту же роль играет czyli «то есть»." }
  - { kind: usage, text: "Вводит и уточнение одного предмета, и целое перечисление." }
collocations:
  - { pl: "a mianowicie", ru: "а именно" }
  - { pl: "czyli", ru: "то есть" }
  - { pl: "to znaczy", ru: "то есть" }
etymology: "От mianować «называть», от miano «имя», праславянское *mě̀no. Русское «именно» построено по той же модели от «имени»."
memory: "mianowicie — «а именно», и собрано оно ровно как русское «именно»: от miano «имя», ср. mianować «называть». Почти всегда идёт после a: …, a mianowicie… В разговоре ту же работу делает czyli «то есть»."
idioms:
