# review
id: ukrywac
format: 2
lemma: "ukrywać"
rank: 871
pos: verb
aspect: imperf
aspectPair: ukryc
pron: { cyr: "укры́ваць" }
senses:
  - id: hide-something
    ru: "скрывать, прятать"
    examples:
      - pl: "Tom coś ukrywa."
        ru: "Том что-то скрывает."
        source: { kind: translated, id: 5528836 }
      - pl: "Nie musisz nic ukrywać."
        ru: "Тебе не нужно ничего скрывать."
        source: { kind: translated, id: 5183836 }
      - pl: "Niczego nie ukrywam."
        ru: "Я ничего не скрываю."
        source: { kind: translated, id: 5360315 }
  - id: hide-oneself
    ru: "ukrywać się — прятаться, скрываться"
    examples:
      - pl: "Tom się ukrywa."
        ru: "Том прячется."
        source: { kind: translated, id: 8547684 }
      - pl: "Ukrywał się przed policją."
        ru: "Он скрывался от полиции."
        source: { kind: translated, id: 6328342 }
      - pl: "Ukrywam się."
        ru: "Я прячусь."
        source: { kind: translated, id: 10566168 }
  - id: conceal-feelings
    ru: "скрывать чувства, факты"
    examples:
      - pl: "Ukrywała smutek pod maską uśmiechu."
        ru: "Она скрывала печаль под маской улыбки."
        source: { kind: translated, id: 353922 }
      - pl: "Władze ukrywały fakty przed obywatelami."
        ru: "Власти скрывали факты от граждан."
        source: { kind: translated, id: 858414 }
      - pl: "Wzruszona, z trudem ukrywała łzy."
        ru: "Растроганная, она с трудом скрывала слёзы."
        source: { kind: translated, id: 11646961 }
notes:
  - { kind: government, text: "ukrywać coś PRZED kimś — «скрывать что-то от кого-то», предлог przed с творительным. Русский берёт «от» с родительным, так что оборот надо запоминать целиком." }
  - { kind: usage, text: "Возвратное ukrywać się значит «прятаться, скрываться»: Gdzie Tom się ukrywa? «Где Том прячется?»." }
  - { kind: usage, text: "Совершенный вид — ukryć. Ukrywał się przez lata «он скрывался годами» о процессе, ukrył się «он спрятался» о результате." }
  - { kind: usage, text: "Образовано от ukryć с суффиксом -ywać, а корень тот же, что в русском «крыть, скрывать»: kryć — ukryć — ukrywać." }
collocations:
  - { pl: "ukrywać się", ru: "прятаться" }
  - { pl: "ukrywać coś przed kimś", ru: "скрывать что-то от кого-то" }
  - { pl: "nie ukrywam", ru: "не скрываю" }
  - { pl: "ukrywać prawdę", ru: "скрывать правду" }
family:
  - { pl: "ukryć", ru: "скрыть, спрятать", relation: aspect, id: ukryc }
  - { pl: "kryć", ru: "крыть, прятать", relation: root }
  - { pl: "kryjówka", ru: "укрытие, тайник", relation: derived }
etymology: "От ukryć с суффиксом -ywać; корень тот же, что в русском «крыть, скрывать»: kryć — ukryć — ukrywać."
memory: "ukrywać — «скрывать», возвратное ukrywać się — «прятаться». Запомните предлог: ukrywać coś PRZED kimś, с przed и творительным, а не «от» с родительным."
idioms:
  - { pl: "ukrywać się", ru: "прятаться" }
  - { pl: "nie ukrywam", ru: "не скрываю" }
  - { pl: "ukrywać coś przed kimś", ru: "скрывать что-то от кого-то" }
