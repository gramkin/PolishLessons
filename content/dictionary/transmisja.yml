# review
id: transmisja
format: 2
lemma: "transmisja"
rank: 4378
pos: noun
pron: { cyr: "трансми́сья" }
senses:
  - id: broadcast
    ru: "трансляция, прямой эфир"
    examples:
      - pl: "Telewizja pokaże transmisję meczu."
        ru: "Телевидение покажет трансляцию матча."
        source: { kind: authored }
      - pl: "Transmisja na żywo zaczyna się o ósmej."
        ru: "Прямая трансляция начинается в восемь."
        source: { kind: authored }
      - pl: "Oglądaliśmy transmisję z koncertu."
        ru: "Мы смотрели трансляцию концерта."
        source: { kind: authored }
  - id: transmission
    ru: "передача (данных, болезни)"
    examples:
      - pl: "Transmisja danych trwa kilka sekund."
        ru: "Передача данных занимает несколько секунд."
        source: { kind: authored }
      - pl: "Maseczki ograniczają transmisję wirusa."
        ru: "Маски ограничивают передачу вируса."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "TRANSMISJA — «трансляция», а не «трансмиссия» в машине: коробка передач — SKRZYNIA BIEGÓW. TRANSMISJA NA ŻYWO — «прямой эфир». Транслировать — TRANSMITOWAĆ." }
  - { kind: usage, text: "Женский род. Родительный, дательный и местный — TRANSMISJI. Множественное — TRANSMISJE. Звательный и архаичное TRANSMISYJ не используем." }
  - { kind: government, text: "Трансляция чего — TRANSMISJA Z и родительный: TRANSMISJA Z MECZU, или просто родительный: TRANSMISJA MECZU. Смотреть трансляцию — OGLĄDAĆ TRANSMISJĘ." }
  - { kind: pronunciation, text: "Читается «трансми́сья»: SJA — «сья», ударение на предпоследнем слоге." }
collocations:
  - { pl: "transmisja na żywo", ru: "прямая трансляция" }
  - { pl: "transmisja meczu", ru: "трансляция матча" }
  - { pl: "transmisja danych", ru: "передача данных" }
family:
  - { pl: "transmitować", ru: "транслировать", relation: derived }
  - { pl: "telewizja", ru: "телевидение", relation: root, id: telewizja }
  - { pl: "relacja", ru: "репортаж", relation: root, id: relacja }
etymology: "Из латинского TRANSMISSIO «пересылка», от TRANSMITTERE «пересылать». Русское «трансмиссия» — то же слово, но в другом значении."
memory: "Transmisja — трансляция, а коробка передач — skrzynia biegów. Transmisja na żywo — прямой эфир. Читается «трансми́сья»."
idioms:
  - { pl: "transmisja na żywo", ru: "прямой эфир" }
formExamplesSkip:
  - { form: "transmisjo", reason: "звательный от названия действия не употребляется" }
  - { form: "transmisyj", reason: "архаичный родительный множественного, в норме TRANSMISJI" }
