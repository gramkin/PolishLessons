lemma: "łeb"
rank: 1842
pos: noun
pron: { cyr: "уэп" }
senses:
  - id: animal-head
    ru: "голова животного"
    examples:
      - pl: "Dzięcioł to ma mocny łeb."
        ru: "У дятла крепкая голова."
        source: { kind: translated, id: 3744896 }
      - pl: "Koń podniósł łeb znad trawy."
        ru: "Конь поднял голову от травы."
        source: { kind: authored }
      - pl: "Pies położył łeb na łapach."
        ru: "Пёс положил голову на лапы."
        source: { kind: authored }
  - id: human-head
    ru: "башка (грубовато о человеке)"
    examples:
      - pl: "Mam ochotę walnąć Toma w łeb."
        ru: "Мне хочется двинуть Тому по башке."
        source: { kind: translated, id: 2679448 }
      - pl: "Wicher łeb urywa."
        ru: "Ветер башку сносит."
        source: { kind: translated, id: 967656 }
      - pl: "Tom spojrzał spode łba."
        ru: "Том посмотрел исподлобья."
        source: { kind: translated, id: 12360212 }
  - id: idioms
    ru: "в устойчивых оборотах"
    examples:
      - pl: "Pędził na łeb na szyję."
        ru: "Он мчался сломя голову."
        source: { kind: translated, id: 900826 }
      - pl: "Dwaj kandydaci idą łeb w łeb."
        ru: "Два кандидата идут ноздря в ноздрю."
        source: { kind: translated, id: 13669918 }
      - pl: "Jeleń uciekał na łeb na szyję."
        ru: "Олень убегал сломя голову."
        source: { kind: translated, id: 837044 }
notes:
  - { kind: register, text: "О животном — нейтральное слово, «голова зверя». О человеке звучит грубовато, примерно как русское «башка». Нейтральное слово для головы — głowa, у неё своя карточка." }
  - { kind: usage, text: "na łeb na szyję — «сломя голову», о поспешном бегстве или падении." }
  - { kind: usage, text: "iść łeb w łeb — «идти ноздря в ноздрю», о равной борьбе." }
  - { kind: usage, text: "spode łba — «исподлобья»: patrzeć spode łba «смотреть исподлобья»." }
  - { kind: government, text: "При склонении e выпадает: łeb, ale łba, łbem, łby. То же чередование, что в pies и psa." }
  - { kind: usage, text: "Слово живёт в оборотах: łeb w łeb «голова в голову», wziąć się za łby «сцепиться», dostać po łbie «получить по башке». О человеке звучит грубовато." }
collocations:
  - { pl: "na łeb na szyję", ru: "сломя голову" }
  - { pl: "łeb w łeb", ru: "ноздря в ноздрю" }
  - { pl: "spode łba", ru: "исподлобья" }
etymology: "Праславянское *lъbъ «череп». Русский «лоб» — то же самое слово, но значения разошлись: польское łeb — вся голова, а русский «лоб» только её передняя часть."
memory: "łeb — голова животного, а о человеке грубовато, «башка». Нейтрально — głowa. Запомните na łeb na szyję «сломя голову»."
idioms:
  - { pl: "na łeb na szyję", ru: "сломя голову" }
  - { pl: "łeb w łeb", ru: "ноздря в ноздрю" }
  - { pl: "spode łba", ru: "исподлобья" }
