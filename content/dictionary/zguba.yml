# review
id: zguba
format: 2
lemma: "zguba"
rank: 2069
pos: noun
pron: { cyr: "згу́ба" }
senses:
  - id: ruin
    ru: "погибель, гибель"
    examples:
      - pl: "Nauka bez sumienia jest jeno zgubą duszy."
        ru: "Наука без совести — лишь погибель души."
        source: { kind: translated, id: 3749626 }
      - pl: "To była jego zguba."
        ru: "Это была его погибель."
        source: { kind: authored }
      - pl: "Alkohol stał się jej zgubą."
        ru: "Алкоголь стал её погибелью."
        source: { kind: authored }
  - id: lost-item
    ru: "пропажа, потерянная вещь"
    examples:
      - pl: "Zguba znalazła się."
        ru: "Пропажа нашлась."
        source: { kind: authored }
      - pl: "Biuro rzeczy znalezionych przyjmuje zguby."
        ru: "Бюро находок принимает пропажи."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Два значения: книжное «погибель» и бытовое «пропажа, потерянная вещь»." }
  - { kind: false-friend, text: "Форма родительного множественного zgub совпадает с повелительным наклонением глагола zgubić «потерять»: Nie zgub się! значит «Не потеряйся!», а не что-либо о пропаже." }
  - { kind: government, text: "Женский род: ta zguba, tej zguby." }
  - { kind: usage, text: "Корень gubić «губить, терять» — ср. русское «губить», «гибель»." }
collocations:
  - { pl: "znaleźć zgubę", ru: "найти пропажу" }
  - { pl: "zguba duszy", ru: "погибель души" }
etymology: "От gubić «губить, терять», праславянское *gubiti; ср. русское «губить», «гибель»."
memory: "zguba — и «погибель», и «пропажа». Корень gubić = русское «губить». Осторожно: zgub — это ещё и «не потеряй» от zgubić."
