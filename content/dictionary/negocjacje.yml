notes:
  - { kind: usage, text: "У этого существительного нет единственного числа, и это роднит его с русским напрямую: «переговоры» тоже только во множественном. Такие слова называют pluralia tantum, и форм у них не десять, а шесть: NEGOCJACJE, NEGOCJACJI, NEGOCJACJOM, NEGOCJACJAMI, NEGOCJACJACH. Сказать «одна негоциация» по-польски так же нельзя, как по-русски «один переговор». Шестая форма, NEGOCJACYJ, — старый родительный множественного, который встречается в документах девятнадцатого века рядом с современным NEGOCJACJI." }
  - { kind: government, text: "С кем ведут переговоры — предлог Z с творительным: NEGOCJACJE Z ZARZĄDEM «переговоры с правлением», как и по-русски. О чём — предлог W SPRAWIE с родительным: NEGOCJACJE W SPRAWIE PŁAC «переговоры о зарплатах», и здесь русский обходится предлогом «о» с предложным, так что конструкцию приходится менять целиком. Начать переговоры — PRZYSTĄPIĆ DO NEGOCJACJI, предлог DO с родительным, буквально «приступить к переговорам». Глагол NEGOCJOWAĆ управляет винительным: NEGOCJOWAĆ WARUNKI." }
  - { kind: register, text: "Слово делового и дипломатического языка. В обычной речи, да и в газетах, чаще скажут ROZMOWY, то есть просто «разговоры»: ROZMOWY POKOJOWE «мирные переговоры» звучит привычнее, чем NEGOCJACJE POKOJOWE, а ROZMOWY O PRACĘ значит «переговоры о работе». NEGOCJACJE остаётся там, где важна официальность: NEGOCJACJE AKCESYJNE «переговоры о вступлении», TWARDE NEGOCJACJE «жёсткие переговоры». Существительное NEGOCJATOR значит «переговорщик»." }
  - { kind: pronunciation, text: "Читается «негоця́цйе», четыре слога, ударение на предпоследнем. Сочетание CJ в польском звучит как «ць» с последующим «й», то есть слитно «ця» и «цйе», и разбивать его на «ци-я» не надо. Это общее правило для всего разряда слов на -CJA: STACJA звучит «ста́цйа», OPERACJA «опера́цйа», INFORMACJA «информа́цйа». Там, где русский слышит «ция» в два слога, поляк произносит один." }
  - { kind: false-friend, text: "Русское «переговоры» и польское NEGOCJACJE совпадают по числу и по смыслу, но не по стилю, и это главная поправка. Там, где русский свободно говорит «переговоры» о любом разговоре по делу, поляк в тех же случаях скажет ROZMOWY, а NEGOCJACJE прозвучит нарочито официально, почти как «переговорный процесс». Отдельно: NEGOCJOWAĆ значит не только «вести переговоры», но и «торговаться о цене», CENA DO NEGOCJACJI — это «цена обсуждаема», обычная строчка в объявлении." }
