etymology: "Из латинского NEGOTIUM «дело, занятие», откуда и NEGOTIARI «вести дела, торговать». Латинское слово само сложено из NEC «не» и OTIUM «досуг», то есть буквально «не-досуг», занятость. В русский тот же корень попал в слове «негоциант», то есть купец, а понятие переговоров русский выразил своим словом, от «говорить». Множественное число без единственного оба языка выбрали по одной причине: переговоры складываются из многих обменов словами и как единичное действие не мыслятся. Из того же латинского гнезда в польском NEGOCJATOR и NEGOCJACYJNY."
memory: "Слово только во множественном числе, как русские «переговоры», и форм поэтому шесть, а не десять. Сказать «одна негоциация» нельзя. Стиль официальный: в живой речи и в газетах поляк скажет rozmowy, rozmowy pokojowe «мирные переговоры». Управление поправить дважды: negocjacje W SPRAWIE czegoś с родительным вместо русского «о», и przystąpić DO negocjacji. Запомнить строчку из объявлений: cena do negocjacji значит «цена обсуждаема». Сочетание cj звучит слитно: «негоця́цйе»."
