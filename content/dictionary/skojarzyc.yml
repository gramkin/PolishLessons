    ru: "свести, сосватать (пару)"
    examples:
      - pl: "To ciotka skojarzyła moich rodziców."
        ru: "Это тётя свела моих родителей."
        source: { kind: authored }
notes:
  - { kind: government, text: "Что с чем — винительный + Z + творительный: SKOJARZYĆ ZAPACH Z DZIECIŃSTWEM «связать запах с детством». С SIĘ — «ассоциироваться, напомнить»: TEN ZAPACH SKOJARZYŁ MI SIĘ Z BABCIĄ «этот запах напомнил мне бабушку». Кого — тоже винительный: SKOJARZYĆ KOGOŚ «вспомнить, кто это»." }
  - { kind: usage, text: "Совершенный вид; несовершенный — KOJARZYĆ. Разговорное KOJARZYSZ GO? «ты его знаешь, помнишь, кто это?» и NIE MOGĘ SKOJARZYĆ «никак не вспомню, не соображу». Существительное SKOJARZENIE «ассоциация» — очень частое слово: PIERWSZE SKOJARZENIE «первая ассоциация»." }
  - { kind: false-friend, text: "SKOJARZYĆ не похоже ни на одно русское слово, но значит ровно «ассоциировать, связать в уме». Третье значение — «сосватать, свести пару»: SKOJARZYĆ MAŁŻEŃSTWO; к русскому «сочетать браком» оно ближе всего." }
  - { kind: pronunciation, text: "Читается «скоя́жыць»: JA — «я», RZ — «ж», Y — «ы». Ударение на предпоследнем слоге: SKOJARZONY — «скояжо́ны»." }
collocations:
  - { pl: "skojarzyć fakty", ru: "сопоставить факты, сообразить" }
