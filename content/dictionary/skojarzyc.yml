etymology: "Приставка S- плюс KOJARZYĆ «связывать, соединять»; происхождение KOJARZYĆ не вполне ясно, в русском прямого соответствия нет."
memory: "Skojarzenie — ассоциация. Skojarzyć — «щёлкнуть» в голове: to mi się skojarzyło z wakacjami — это напомнило мне каникулы."
