        ru: "Эта песня напомнила мне каникулы."
        source: { kind: authored }
  - id: recall
    ru: "вспомнить, сообразить (кто это, что к чему)"
    examples:
      - pl: "Długo nie mogłem skojarzyć, skąd go znam."
        ru: "Я долго не мог сообразить, откуда его знаю."
