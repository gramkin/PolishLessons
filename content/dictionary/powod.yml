# review
id: powod
format: 2
lemma: "powód"
rank: 242
pos: noun
pron: { cyr: "по́вут" }
senses:
  - id: reason
    ru: "причина, повод"
    examples:
      - pl: "Co jest powodem twoich porażek?"
        ru: "В чём причина твоей неудачи?"
        source: { kind: tatoeba, id: 7881186 }
      - pl: "Śmiech bez powodu jest oznaką głupoty."
        ru: "Смех без причины - признак дурачины."
        source: { kind: tatoeba, id: 4617412 }
      - pl: "Nie możemy spać z powodu hałasu."
        ru: "Мы не можем спать из-за шума."
        source: { kind: tatoeba, id: 600763 }
  - id: because-of
    ru: "z powodu — из-за, по причине"
    note: "z powodu требует родительного падежа: z powodu deszczu «из-за дождя»."
    examples:
      - pl: "Jestem tu z jej powodu."
        ru: "Я здесь из-за неё."
        source: { kind: tatoeba, id: 13547135 }
      - pl: "Spóźniliśmy się z powodu burzy."
        ru: "Мы опоздали из-за шторма."
        source: { kind: tatoeba, id: 904475 }
      - pl: "Gra została przełożona z powodu deszczu."
        ru: "Игра была отложена из-за дождя."
        source: { kind: tatoeba, id: 5960521 }
notes:
  - { kind: usage, text: "z powodu czegoś — «из-за чего-то» (о причине неприятной), bez powodu — «без причины», nie bez powodu — «не без причины»." }
  - { kind: false-friend, text: "Форма powodzie — ловушка: это и предложный падеж от powód («o powodzie» — о причине), и множественное число от powódź «наводнение» («powodzie w mieście» — наводнения в городе)." }
  - { kind: usage, text: "В юридическом языке powód значит «истец» — это отдельное слово со своими формами (powoda, powodowie)." }
collocations:
  - { pl: "z powodu", ru: "из-за" }
  - { pl: "bez powodu", ru: "без причины" }
  - { pl: "mieć powód", ru: "иметь причину" }
  - { pl: "powód do dumy", ru: "повод для гордости" }
etymology: "Из po- + wodzić «водить»: то, что ведёт к чему-то. Русское «повод» — то же слово и та же внутренняя форма."
memory: "powód — «причина»; z powodu czegoś значит «из-за чего-то». Осторожно с powodzie: это и «о причине» (предложный падеж), и «наводнения» — от другого слова, powódź."
idioms:
  - { pl: "z powodu", ru: "из-за" }
  - { pl: "bez powodu", ru: "без причины" }
  - { pl: "nie bez powodu", ru: "не без причины" }
