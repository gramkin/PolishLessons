  - { pl: "między", ru: "между", relation: root, id: miedzy }
etymology: "Сложение предлога MIĘDZY «между» и прилагательного NARODOWY, от NARÓD «народ» — буквально «международный», и русское слово построено из тех же частей тем же способом. Калька эта в обоих языках поздняя, девятнадцатого века, и восходит к латинскому INTERNATIONALIS, которое сами латиняне не знали: его придумал английский философ в конце восемнадцатого века. Так что польское и русское слово — независимые переводы одного нового понятия, сделанные по одной модели."
memory: "Разбирается на части: między «между» плюс narodowy от naród «народ». Степеней сравнения нет — вещь либо международная, либо нет, отсюда всего 11 форм."
idioms:
