notes:
  - { kind: usage, text: "Всего одиннадцать форм, и это не недостаток черновика, а полная картина: MIĘDZYNARODOWY — прилагательное относительное, оно не образует степеней сравнения. Нельзя сказать ни BARDZIEJ MIĘDZYNARODOWY, ни NAJMIĘDZYNARODOWSZY: вещь или международная, или нет. Сравните с ORYGINALNY из предыдущей партии, у которого тридцать три формы, потому что степени у него есть. Русский ведёт себя так же: «международнее» не говорят." }
  - { kind: false-friend, text: "Слово разбирается на части, и обе русскому знакомы: MIĘDZY отвечает русскому «между», NARÓD — «народ». То есть MIĘDZYNARODOWY буквально «международный», и смысл совпадает полностью. Расходится только огласовка корня: в NARÓD стоит ó, а в производном MIĘDZYNARODOWY — o, по той же мене закрытого и открытого слога, что разбиралась в карточках NARÓB и WRÓB. Так что NARÓD, но NARODOWY, и NARODY в множественном." }
  - { kind: pronunciation, text: "Носовая ę перед dz читается как «эн»: MIĘDZY звучит «ме́ндзы», и всё слово — «мендзынаро́довы», с ударением на предпоследнем слоге. Это одно из самых длинных частых слов в польском, и произносить его стоит по частям: MIĘ-DZY-NA-RO-DO-WY. Мужско-личная форма множественного числа — MIĘDZYNARODOWI, с мягким wi." }
  - { kind: government, text: "Прилагательное согласуется с существительным и своего управления не имеет. Стоит запомнить готовые сочетания, потому что они частотны и порядок слов в них устойчив: PRAWO MIĘDZYNARODOWE «международное право», STOSUNKI MIĘDZYNARODOWE «международные отношения», LOTNISKO MIĘDZYNARODOWE, TRANSPORT MIĘDZYNARODOWY. В официальных названиях прилагательное обычно идёт после существительного." }
collocations:
  - { pl: "prawo międzynarodowe", ru: "международное право" }
  - { pl: "stosunki międzynarodowe", ru: "международные отношения" }
