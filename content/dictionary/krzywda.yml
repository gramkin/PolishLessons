rank: 1639
pos: noun
pron: { cyr: "кшы́вда" }
senses:
  - id: harm
    ru: "вред, обида, зло (причинённое кому-л.)"
    examples:
      - pl: "Nie zrobię ci krzywdy."
        ru: "Я не причиню тебе вреда."
        source: { kind: translated, id: 3841226 }
      - pl: "Nie chciałem twojej krzywdy."
        ru: "Я не хотел тебе зла."
        source: { kind: translated, id: 364348 }
      - pl: "Ten pies nie zrobi Ci krzywdy."
        ru: "Эта собака не причинит тебе вреда."
        source: { kind: translated, id: 525907 }
  - id: hurt-oneself
    ru: "zrobić sobie krzywdę — навредить себе, покалечиться"
    examples:
      - pl: "Zrobisz sobie krzywdę."
        ru: "Ты себе навредишь."
        source: { kind: translated, id: 967634 }
      - pl: "Zrobisz sobie krzywdę pracując dzień i noc."
        ru: "Ты себе навредишь, работая день и ночь."
        source: { kind: translated, id: 659705 }
      - pl: "Tomowi stanie się krzywda."
        ru: "С Томом случится беда."
        source: { kind: translated, id: 6441750 }
notes:
  - { kind: usage, text: "Главный оборот — zrobić komuś krzywdę «причинить кому-то вред»: Nie zrobię ci krzywdy «Я не причиню тебе вреда». Кому — дательный, что — винительный." }
  - { kind: usage, text: "zrobić sobie krzywdę значит «покалечиться, навредить себе»: Zrobisz sobie krzywdę «Ты себе навредишь»." }
  - { kind: usage, text: "Безличное stała się komuś krzywda — «с кем-то случилась беда»: Tomowi stanie się krzywda." }
  - { kind: false-friend, text: "Русское «кривда» устарело и значит «ложь», а польское krzywda — «вред, обида». Корень общий (krzywy «кривой»), но значения разошлись." }
collocations:
  - { pl: "zrobić krzywdę", ru: "причинить вред" }
  - { pl: "nie zrobię ci krzywdy", ru: "я не причиню тебе вреда" }
  - { pl: "stała się krzywda", ru: "случилась беда" }
etymology: "От krzywy «кривой», праславянское *krivъ — буквально «то, что криво, несправедливо». Русское «кривда» — то же слово, но в русском оно ушло в значение «ложь», а в польском осталось «вред, обида»."
memory: "krzywda = «вред, обида». Главный оборот — zrobić komuś krzywdę «причинить кому-то вред», а zrobić sobie krzywdę значит «покалечиться». Русская «кривда» — то же слово, но значит «ложь»."
idioms:
