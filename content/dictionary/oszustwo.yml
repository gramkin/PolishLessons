notes:
  - { kind: pronunciation, text: "Предложный — OSZUSTWIE, с обычным для среднего рода смягчением. Интереснее родительный множественного: OSZUSTW, четыре согласных подряд и никакой вставной гласной. Сравните kostka — kostek, где беглая e появилась ради того же: польский терпит сочетание -stw на конце слова и не нуждается в подпорке. Само stw звучит глухо, «стф»: «ошу́стфо»." }
  - { kind: usage, text: "Слово построено от OSZUST «мошенник» суффиксом -stwo, который делает из названия человека название его занятия или свойства: oszust — oszustwo, złodziej — złodziejstwo, bohater — bohaterstwo. Русский пользуется суффиксом -ство точно так же: «мошенник» — «мошенничество», «герой» — «геройство». Пара переносится без правок." }
collocations:
  - { pl: "oszustwo podatkowe", ru: "налоговое мошенничество" }
  - { pl: "paść ofiarą oszustwa", ru: "стать жертвой мошенничества" }
  - { pl: "wykryć oszustwo", ru: "раскрыть обман" }
family:
  - { pl: "oszust", ru: "мошенник", relation: root, id: oszust }
  - { pl: "oszukać", ru: "обмануть", relation: root, id: oszukac }
  - { pl: "oszukańczy", ru: "мошеннический", relation: derived }
etymology: "От OSZUST «мошенник», а тот от OSZUKAĆ «обмануть», где корень тот же, что в szukać «искать»: обмануть значило заставить искать не там. Суффикс -stwo отвечает русскому -ство и делает отвлечённое имя из названия лица. Русское «мошенничество» собрано тем же способом, только корень другой — от «мошны», кошелька."
memory: "Родительный множественного без вставной гласной: OSZUSTW, четыре согласных. А образовано от oszust, как «мошенничество» от «мошенника»."
