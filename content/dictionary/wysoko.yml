        source: { kind: authored }
  - id: at-most
    ru: "максимум, самое большее"
    examples:
      - pl: "Zajmie to najwyżej dwa dni."
        ru: "Это займёт максимум два дня."
        source: { kind: authored }
      - pl: "Kosztuje najwyżej dwadzieścia złotych."
        ru: "Стоит самое большее двадцать злотых."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Форм три, потому что наречие изменяется только по степеням, и сравнительная здесь неправильная: не «wysokiej», а WYŻEJ. Окончание -oko отпадает целиком, а s переходит в ż. Превосходная строится от неправильной формы: NAJWYŻEJ." }
  - { kind: usage, text: "Это не исключение, а норма для частых польских наречий, и русский портит те же самые слова: dobrze — lepiej отвечает «хорошо — лучше», źle — gorzej отвечает «плохо — хуже», dużo — więcej отвечает «много — больше», daleko — dalej отвечает «далеко — дальше», wysoko — wyżej отвечает «высоко — выше». Редкий случай, когда переносится сама неправильность, а не только правило." }
  - { kind: usage, text: "У превосходной формы есть второе значение, уже не пространственное: NAJWYŻEJ означает «максимум, самое большее». Zajmie to najwyżej godzinę — «это займёт максимум час». По-русски тут тоже бывает «самое высокое» в смысле предела, но обычное выражение другое, поэтому оборот надо запомнить целиком." }
collocations:
  - { pl: "wysoko w górach", ru: "высоко в горах" }
  - { pl: "mierzyć wysoko", ru: "метить высоко" }
  - { pl: "najwyżej dwa dni", ru: "максимум два дня" }
family:
  - { pl: "wysoki", ru: "высокий", relation: root, id: wysoki }
  - { pl: "wysokość", ru: "высота", relation: derived, id: wysokosc }
  - { pl: "nisko", ru: "низко", relation: antonym }
etymology: "От WYSOKI, из праславянского *vysokъ — то же слово, что русское «высокий». Наречие образовано на -o, как и наше «высоко», а неправильная сравнительная WYŻEJ восходит к той же старой основе, что и русское «выше»: обе отбросили суффикс и смягчили согласный. Так что и форма, и её неправильность у двух языков общие."
memory: "Три формы: wysoko, WYŻEJ, najwyżej — сравнительная неправильная, как «выше». А najwyżej значит ещё и «максимум»."
idioms:
