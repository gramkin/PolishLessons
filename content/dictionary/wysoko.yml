# review
id: wysoko
format: 2
lemma: "wysoko"
rank: 2778
pos: adv
pron: { cyr: "высо́ко" }
senses:
  - id: high
    ru: "высоко"
    examples:
      - pl: "Mieszka wysoko, na ósmym piętrze."
        ru: "Он живёт высоко, на восьмом этаже."
        source: { kind: authored }
      - pl: "Powieś obraz wyżej, o dwa palce."
        ru: "Повесь картину выше, на два пальца."
        source: { kind: authored }
