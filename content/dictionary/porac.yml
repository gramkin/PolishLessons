# review
id: porac
format: 2
lemma: "porać"
rank: 5903
pos: verb
aspect: imperf
pron: { cyr: "по́раць" }
senses:
  - id: bustle
    ru: "porać się — хлопотать, возиться (по хозяйству, на кухне)"
    examples:
      - pl: "Mama od rana pora się w kuchni."
        ru: "Мама с утра хлопочет на кухне."
        source: { kind: authored }
      - pl: "Dziadek porał się przy krowach."
        ru: "Дедушка возился с коровами."
        source: { kind: authored }
      - pl: "Całą sobotę porałam się w ogrodzie."
        ru: "Всю субботу я возилась в саду."
        source: { kind: authored }
  - id: cope
    ru: "porać się z czymś — справляться, управляться (разг.)"
    examples:
      - pl: "Jak ty się porasz z trójką dzieci?"
        ru: "Как ты справляешься с тремя детьми?"
        source: { kind: authored }
      - pl: "Sama nie poram się z tą robotą."
        ru: "Одна я не справляюсь с этой работой."
        source: { kind: authored }
notes:
  - { kind: usage, text: "В современном языке — только с SIĘ: PORAĆ SIĘ «хлопотать, возиться» (W KUCHNI, PRZY KROWACH, W OGRODZIE) и PORAĆ SIĘ Z CZYMŚ «справляться, управляться с чем-то». Без SIĘ PORAĆ — диалектное «распарывать». Совершенного вида в паре нет; для «справиться, разделаться» берут UPORAĆ SIĘ: UPORAŁAM SIĘ Z PRANIEM." }
  - { kind: register, text: "Разговорное, с деревенским и немного старомодным оттенком: так говорят о домашней и хозяйственной работе. Нейтральные синонимы — KRZĄTAĆ SIĘ «хлопотать», RADZIĆ SOBIE «справляться»." }
  - { kind: false-friend, text: "Форма PORA SIĘ («он хлопочет») пишется как существительное PORA «пора, время года»: PORA ROKU «время года», JUŻ PORA «пора». Различает их SIĘ и контекст: MATKA PORA SIĘ W KUCHNI — это глагол." }
  - { kind: government, text: "Где — W + предложный или PRZY + предложный: PORAĆ SIĘ W OGRODZIE, PRZY GARNKACH. С чем — Z + творительный: PORAĆ SIĘ Z ROBOTĄ, Z DZIEĆMI." }
collocations:
  - { pl: "porać się w kuchni", ru: "хлопотать на кухне" }
  - { pl: "porać się przy gospodarstwie", ru: "управляться по хозяйству" }
  - { pl: "porać się z robotą", ru: "справляться с работой" }
family:
  - { pl: "uporać się", ru: "справиться, управиться", relation: root }
  - { pl: "poranie", ru: "хлопоты, возня (poranie się)", relation: derived }
etymology: "Родственно русскому «пороть» (распарывать): в польских диалектах PORAĆ и сейчас значит «распарывать». Как из этого выросло значение «хлопотать, возиться», словари объясняют по-разному."
memory: "Porać się — хлопотать по хозяйству: pora się w kuchni. Не путать с pora «пора»."
idioms:
  - { pl: "porać się w obejściu", ru: "хлопотать по хозяйству во дворе" }
