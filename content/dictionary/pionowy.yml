notes:
  - { kind: false-friend, text: "Основа PION не имеет отношения ни к цветку «пион» (по-польски PIWONIA), ни к «пионеру». PION — это «отвес» и «вертикаль»: TRZYMAĆ PION «держать вертикаль», а в переносном смысле POSTAWIĆ KOGOŚ DO PIONU «поставить кого-то на место, привести в чувство». Отсюда PIONOWY «вертикальный». Пешка в шахматах называется PIONEK, и редкое значение PIONOWY «пешечный» встречается только в шахматных текстах." }
  - { kind: usage, text: "Пара, которую стоит учить вместе: PIONOWY «вертикальный» и POZIOMY «горизонтальный», от POZIOM «уровень». В кроссвордах так же: PIONOWO «по вертикали», POZIOMO «по горизонтали», HASŁA PIONOWE «слова по вертикали». Наречие PIONOWO встречается в речи даже чаще самого прилагательного: STAĆ PIONOWO «стоять вертикально»." }
  - { kind: usage, text: "Прилагательное относительное и описывает предметы, линии, движения. Степеней сравнения нет: вертикаль либо есть, либо её нет. Мужско-личная форма PIONOWI в словаре значится, но с названиями людей слово не сочетается, поэтому примеров для неё нет. Остальные одиннадцать клеток обычные, как у любого прилагательного на -OWY." }
  - { kind: pronunciation, text: "«пёно́вы»: PIO читается одним слогом, как русское «пё», без отдельного «и». Ударение на предпоследнем слоге NO. W внутри слова перед гласным звонкое: «во», не «фо»." }
collocations:
  - { pl: "pionowa linia", ru: "вертикальная линия" }
  - { pl: "pionowy start", ru: "вертикальный взлёт" }
  - { pl: "pozycja pionowa", ru: "вертикальное положение" }
family:
  - { pl: "pion", ru: "отвес; вертикаль", relation: root }
  - { pl: "pionowo", ru: "вертикально; по вертикали", relation: derived }
  - { pl: "poziomy", ru: "горизонтальный", relation: antonym }
etymology: "Образовано от существительного pion «отвес, вертикаль» с суффиксом -owy, как domowy от dom. Русское «вертикальный» передаёт то же значение, но через латинский корень."
memory: "Pion — это отвес, грузик на нитке, который тянет строго вниз. Всё, что идёт по его линии, pionowe. Пара для запоминания: pionowo — по вертикали, poziomo — по горизонтали, как в кроссворде."
idioms:
  - { pl: "w pozycji pionowej", ru: "в вертикальном положении, стоя" }
formExamplesSkip:
  - { form: "pionowi", reason: "относительное прилагательное описывает линии, предметы и движения; с личными существительными мужского рода не сочетается, и живого употребления формы pionowi нет" }
