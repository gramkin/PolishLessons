notes:
  - { kind: false-friend, text: "Совпадение неполное, и расходится самое частое употребление. Русская «марка» прежде всего почтовая, а по-польски почтовая марка называется ZNACZEK — то же слово, что «значок», и MARKA в этом значении не употребляется совсем. Польская MARKA — это торговая марка, фирменный знак, бренд: MARKA SAMOCHODU, ZNANA MARKA. Второе значение, денежная единица, общее для двух языков: MARKA NIEMIECKA, MARKA POLSKA. Третье, переносное, есть только в польском: MIEĆ DOBRĄ MARKĘ значит пользоваться хорошей репутацией, и русское «марка» так не работает." }
  - { kind: usage, text: "Десять форм, женский род. Дательный и местный единственного — MARCE, где заднеязычное K перед окончанием -E переходит в C: это та же обязательная мена, что в KACZCE, NERCE и WÓDCE, и здесь она попадает в частую форму — O MARCE, DZIĘKI MARCE. Родительный множественного — MAREK, с беглым E между R и K, иначе слово кончалось бы на RK. Родительный единственного и именительный множественного — одна форма MARKI. В значении денег слово считают обычным образом: DZIESIĘĆ MAREK, DWIE MARKI." }
  - { kind: pronunciation, text: "Читается «ма́рка», два слога, ударение на первом — как и в русском. Буква R раскатистая и твёрдая. В форме MARCE сочетание RC звучит «рц»: «ма́рце». В форме MAREK беглое E произносится отчётливо: «ма́рэк», без смягчения предыдущего согласного. В форме MARKĘ конечное Ę читается как чистое «э»: «ма́ркэ». В форме MARKĄ последнее Ą даёт «он»: «ма́ркон»." }
  - { kind: register, text: "Слово нейтральное и очень частое в торговле и рекламе. Устойчивые сочетания: ZNANA MARKA, MARKA WŁASNA «собственная торговая марка», TOWAR MARKOWY «фирменный товар», MARKA SAMOCHODU. Прилагательное MARKOWY значит «фирменный, известной марки» и несёт оттенок качества. Выражение MIEĆ DOBRĄ MARKĘ книжное, но живое. В историческом контексте MARKA означает немецкую или довоенную польскую валюту. Звательная форма MARKO совпадает со звательной формой мужского имени MAREK и в живой речи о товаре не употребляется." }
