etymology: "Из средневекового немецкого MARKE «знак, метка», и дальше от общегерманского корня со значением «граница, пограничный знак» — того же, что в слове «марка» как названии пограничной области, откуда немецкие Mark Brandenburg и датское Danmark. Клеймо ремесленника на изделии было таким же знаком, и от него пошло значение торговой марки; денежная единица названа так же, потому что сначала это была мера веса серебра с клеймом. Русский взял слово тем же путём, через немецкий, и получил и почтовую, и денежную марку. Поэтому у двух языков общий источник и разные главные значения: русский закрепил за словом почтовый знак, польский — фирменный, и каждый обзавёлся своим вторым словом для чужого случая."
memory: "Общее заимствование из немецкого Marke «знак, метка», корень тот же, что в названии пограничной марки. Но главные значения разошлись: почтовая марка по-польски znaczek, а marka это бренд или денежная единица. Переносное mieć dobrą markę значит «пользоваться хорошей репутацией». Падежи: marce с меной k→c, как kaczce и nerce; родительный множественного marek с беглым e."
idioms:
  - { pl: "mieć dobrą markę", ru: "пользоваться хорошей репутацией" }
