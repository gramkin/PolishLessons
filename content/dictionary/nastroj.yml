  - id: mood-atmosphere
    ru: "настроение, атмосфера"
    examples:
      - pl: "Nastrój poprawia się, jak się człowiek porządnie wyśpi."
        ru: "Настроение улучшается, когда как следует выспишься."
        source: { kind: translated, id: 438392 }
      - pl: "Jego odpowiedź zależy od nastroju."
        ru: "Его ответ зависит от настроения."
        source: { kind: translated, id: 1627367 }
      - pl: "Zawodnicy po grze byli w doskonałych nastrojach."
        ru: "Игроки после игры были в прекрасном настроении."
