notes:
  - { kind: government, text: "В настроении — w nastroju (предложный падеж): jestem w dobrym nastroju «я в хорошем настроении»." }
  - { kind: usage, text: "Nie jestem w nastroju — «я не в настроении», готовая формула отказа." }
  - { kind: false-friend, text: "Форма nastrój совпадает с повелительным наклонением глагола nastroić «настроить»: nastrój gitarę значит «настрой гитару»." }
  - { kind: usage, text: "Слово значит и атмосферу места или произведения: świąteczny nastrój «праздничное настроение»." }
collocations:
  - { pl: "w dobrym nastroju", ru: "в хорошем настроении" }
  - { pl: "nie jestem w nastroju", ru: "я не в настроении" }
  - { pl: "świąteczny nastrój", ru: "праздничное настроение" }
family:
  - { pl: "nastrojowy", ru: "атмосферный", relation: root }
  - { pl: "nastroić", ru: "настроить", relation: root }
etymology: "От nastroić «настроить», того же корня, что русское «настроение» и «строить». Образ один: настроенность души, как настроенность инструмента."
memory: "nastrój — «настроение»: jestem w dobrym nastroju. Формула Nie jestem w nastroju значит «я не в настроении». Осторожно: nastrój — ещё и «настрой!» от nastroić."
