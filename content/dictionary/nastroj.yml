# review
id: nastroj
format: 2
lemma: "nastrój"
rank: 1861
pos: noun
pron: { cyr: "на́струй" }
senses:
  - id: mood
    ru: "настроение"
    examples:
      - pl: "Nie jestem w nastroju."
        ru: "Я не в настроении."
