etymology: "От WODA, то же праславянское слово, что русская «вода», и здесь оба языка совпадают до буквы. Прилагательное образовано суффиксом -NY, который в польском служит главным способом сделать из существительного относительное прилагательное: WODA даёт WODNY, ZIEMIA даёт ZIEMNY, DOM даёт DOMOWY. Русский в тех же случаях пользуется суффиксами -НЫЙ и -ЯНОЙ, и именно поэтому одно польское слово отвечает двум русским: польский суффикс один, русских два. Из того же гнезда WODNIK «водяной», мифический дух воды, и WODOCIĄG «водопровод»."
memory: "Одно польское слово на два русских: wodny это и «водный», transport wodny, и «водяной», znak wodny, para wodna. Причина простая: русский различает суффиксы -ный и -яной, а польский обходится одним -ny. Третье слово держать отдельно: wodnisty это «водянистый», zupa wodnista. Одиннадцать форм, степеней нет, как у zewnętrzny и srebrny; мера выражается через wodnisty. Читается «во́дны», с «ы» на конце."
