notes:
  - { kind: false-friend, text: "Русский различает здесь два прилагательных, польский обходится одним. «Водный» о пути и о спорте: TRANSPORT WODNY, SPORTY WODNE. «Водяной» о том, что из воды или про воду: ZNAK WODNY «водяной знак», PARA WODNA «водяной пар», MŁYN WODNY «водяная мельница». Оба по-польски WODNY, и выбирать не нужно. Зато нужно помнить третье русское слово: «водянистый», то есть жидкий и безвкусный, по-польски будет WODNISTY, и его путать с WODNY нельзя. ZUPA WODNISTA это «водянистый суп», а не «водный»." }
  - { kind: usage, text: "Одиннадцать форм, степеней сравнения нет: прилагательное относительное, оно приписывает предмет к воде. Если нужна мера, берут WODNISTY, у которого степени есть: WODNISTSZY «более водянистый». Мужско-личная форма WODNI живёт в одном почти официальном сочетании: RATOWNICY WODNI «водные спасатели», и в названии польской службы спасения на воде. В терминах прилагательное обычно стоит после существительного: ELEKTROWNIA WODNA, PARA WODNA, SPORTY WODNE." }
  - { kind: pronunciation, text: "Читается «во́дны», два слога, ударение на первом. Буква W перед гласной звучит как «в», D остаётся звонкой, потому что дальше идёт звонкая N. Конечное Y — это «ы», а не «и»: «водны», не «водни». В существительном WODA слышно «во́да», с ударением на первом слоге, точно как по-русски. А вот в родительном множественном WÓD появляется Ó, которая читается как «у»: «вут», с оглушением конечной согласной." }
  - { kind: government, text: "Прилагательное только согласуется и падежом не управляет. Полезнее запомнить предлоги при самом существительном: W WODZIE значит «в воде», с местным падежом, а DO WODY «в воду», с родительным, и это обычная польская пара на вопросы где и куда. Выражение POD WODĄ «под водой» берёт творительный, как и русское. Отдельно стоит отметить NA WODZIE «на воде», тоже местный: SPORTY NA WODZIE звучит наравне со SPORTY WODNE." }
  - { kind: register, text: "Слово нейтральное, с уклоном в технику и географию. Частые обороты: ELEKTROWNIA WODNA «гидроэлектростанция», DROGA WODNA «водный путь», ZNAK WODNY «водяной знак», PARA WODNA, ROŚLINY WODNE «водные растения», WODNE PTACTWO «водоплавающие птицы». Приставочное PODWODNY значит «подводный», а NAWODNY — «надводный». В разговоре о бытовой воде прилагательное почти не нужно: там говорят просто Z WODĄ или NA WODZIE." }
