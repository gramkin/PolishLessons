# review
id: kciuk
format: 2
lemma: "kciuk"
rank: 3803
pos: noun
pron: { cyr: "кцюк" }
senses:
  - id: thumb
    ru: "большой палец (руки)"
    examples:
      - pl: "Uderzył się młotkiem w kciuk."
        ru: "Он ударил себя молотком по большому пальцу."
        source: { kind: authored }
      - pl: "Dziecko ssie kciuk."
        ru: "Ребёнок сосёт большой палец."
        source: { kind: authored }
      - pl: "Pokazał mi kciuk w górę."
        ru: "Он показал мне большой палец вверх."
        source: { kind: authored }
  - id: fingers-crossed
    ru: "держать кулаки, болеть за кого-то (TRZYMAĆ KCIUKI)"
    examples:
      - pl: "Trzymam kciuki za twój egzamin."
        ru: "Держу за тебя кулаки на экзамене."
        source: { kind: authored }
      - pl: "Wszyscy trzymali kciuki za naszą drużynę."
        ru: "Все болели за нашу команду."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "KCIUK — «большой палец руки». Остальные пальцы — PALEC, большой палец ноги — DUŻY PALEC U NOGI. TRZYMAĆ KCIUKI — «держать кулаки», то есть желать удачи: поляки зажимают большие пальцы в кулаках." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Родительный — KCIUKA, с -A, как у частей тела. Множественное — KCIUKI." }
  - { kind: government, text: "Держать кулаки за кого — TRZYMAĆ KCIUKI ZA, винительный: ZA CIEBIE, ZA DRUŻYNĘ. Держать под каблуком — TRZYMAĆ POD KCIUKIEM, творительный." }
  - { kind: pronunciation, text: "Читается «кцюк», один слог. KC в начале произносится слитно, без гласной. CI перед U — мягкое «цю»." }
collocations:
  - { pl: "trzymać kciuki", ru: "держать кулаки, желать удачи" }
  - { pl: "kciuk w górę", ru: "большой палец вверх, «класс»" }
  - { pl: "ssać kciuk", ru: "сосать палец" }
family:
  - { pl: "palec", ru: "палец", relation: root, id: palec }
  - { pl: "ręka", ru: "рука", relation: root, id: reka }
  - { pl: "dłoń", ru: "ладонь, кисть", relation: root, id: dlon }
etymology: "Старое западнославянское слово с неясной этимологией. В русском прямого соответствия нет: там описательно, «большой палец»."
memory: "Kciuk — большой палец. Trzymam kciuki! — держу кулаки! Kciuk w górę — «класс». Читается «кцюк»."
idioms:
  - { pl: "trzymać kogoś pod kciukiem", ru: "держать кого-то под каблуком" }
