aspect: perf
pron: { cyr: "осё́нгнонць" }
senses:
  - id: achieve
    ru: "достичь, добиться (цели, успеха)"
    examples:
      - pl: "On stara się osiągnąć cel."
        ru: "Он старается достичь цели."
        source: { kind: translated, id: 1645532 }
      - pl: "Ciężko pracował, by osiągnąć cel."
        ru: "Он упорно работал, чтобы достичь цели."
        source: { kind: translated, id: 352221 }
      - pl: "Aby osiągnąć sukces, musisz ciężko pracować."
        ru: "Чтобы добиться успеха, нужно упорно работать."
        source: { kind: translated, id: 702915 }
  - id: reach-level
    ru: "достичь (уровня, величины, возраста)"
    examples:
      - pl: "Suma osiągnęła 10 dolarów."
        ru: "Сумма достигла 10 долларов."
        source: { kind: translated, id: 737222 }
      - pl: "Temperatura osiągnęła wczoraj 37°C."
        ru: "Температура вчера достигла 37°C."
        source: { kind: translated, id: 484527 }
      - pl: "Osiągnął wiek dziewięćdziesięciu lat."
        ru: "Он достиг возраста девяноста лет."
        source: { kind: translated, id: 12987016 }
  - id: agreement
    ru: "прийти к (соглашению, компромиссу)"
    examples:
      - pl: "Osiągnęliśmy kompromis."
        ru: "Мы достигли компромисса."
        source: { kind: translated, id: 366294 }
      - pl: "W końcu osiągnęliśmy kompromis."
        ru: "Наконец мы достигли компромисса."
        source: { kind: tatoeba, id: 2143123 }
      - pl: "Po wielu negocjacjach, strony sporu osiągnęły kompromis."
        ru: "После долгих переговоров стороны спора достигли компромисса."
        source: { kind: translated, id: 1637715 }
notes:
  - { kind: usage, text: "Мужско-личной формы osiągnięci не бывает: достигают цели, договорённости, скорости или возраста, а не людей, поэтому она оставлена без примеров. Причастие живёт при вещах: osiągnięty wynik «достигнутый результат», zgoda została osiągnięta." }
  - { kind: government, text: "osiągnąć требует винительного падежа: osiągnąć cel «достичь цели», osiągnąć sukces «добиться успеха». Русское «достичь» требует родительного — это главное расхождение." }
  - { kind: usage, text: "Несовершенный вид — osiągać: Osiągam dobre wyniki «Я достигаю хороших результатов»." }
  - { kind: usage, text: "От глагола образовано существительное osiągnięcie «достижение»: wielkie osiągnięcie inżynierii «великое достижение инженерии»." }
  - { kind: usage, text: "Безличная форма osiągnięto «достигли» частотна в отчётах: Porozumienia nie osiągnięto «Соглашения не достигли»." }
collocations:
  - { pl: "osiągnąć cel", ru: "достичь цели" }
  - { pl: "osiągnąć sukces", ru: "добиться успеха" }
  - { pl: "osiągnąć kompromis", ru: "прийти к компромиссу" }
  - { pl: "osiągnąć porozumienie", ru: "достичь соглашения" }
etymology: "Приставка o- + siągnąć, старое «протянуть руку, дотянуться» (ср. sięgać «тянуться, доставать»). Русское «достичь» собрано так же: до- + корень со значением касания. В обоих языках «достичь цели» — буквально «дотянуться»."
memory: "osiągnąć = «достичь, добиться», и падеж другой: osiągnąć cel — винительный, а русское «достичь цели» — родительный. Несовершенный вид — osiągać. Существительное osiągnięcie значит «достижение»."
