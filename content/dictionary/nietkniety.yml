lemma: "nietknięty"
rank: 2323
pos: adj
pron: { cyr: "нэткне́нты" }
senses:
  - id: untouched
    ru: "нетронутый, целый"
    examples:
      - pl: "Pudełko zostało uszkodzone, ale jego zawartość jest nietknięta."
        ru: "Коробка была повреждена, но её содержимое нетронуто."
        source: { kind: translated, id: 3416051 }
      - pl: "Domy przetrwały osunięcie ziemi nietknięte."
        ru: "Дома пережили оползень нетронутыми."
        source: { kind: translated, id: 3416055 }
      - pl: "Obiad został nietknięty."
        ru: "Обед остался нетронутым."
        source: { kind: authored }
  - id: intact
    ru: "невредимый, неприкосновенный"
    examples:
      - pl: "Las pozostał nietknięty przez wieki."
        ru: "Лес оставался нетронутым веками."
        source: { kind: authored }
      - pl: "Jego oszczędności są nietknięte."
        ru: "Его сбережения нетронуты."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Это застывшее прилагательное, а не форма глагола: у него свой полный набор окончаний — nietknięty, nietknięta, nietknięte." }
  - { kind: false-friend, text: "Причастие от tknąć «тронуть», с приставкой nie-, написанной слитно. В польском отрицание с прилагательными и причастиями пишется вместе: nietknięty, niemożliwy, niedobry." }
  - { kind: government, text: "Склоняется как обычное прилагательное." }
  - { kind: usage, text: "Частый оборот: pozostać nietkniętym «остаться нетронутым». Родственное dotknąć «коснуться» уже есть в словаре." }
collocations:
  - { pl: "pozostać nietkniętym", ru: "остаться нетронутым" }
  - { pl: "nietknięty obiad", ru: "нетронутый обед" }
etymology: "Причастие от tknąć «тронуть» с приставкой nie-, которая в польском пишется слитно."
memory: "nietknięty — «нетронутый», застывшее прилагательное со своим склонением. Отрицание nie- здесь пишется СЛИТНО, как в niemożliwy."
