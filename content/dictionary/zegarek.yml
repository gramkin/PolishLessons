notes:
  - { kind: false-friend, text: "zegarek — это ручные или карманные часы, а большие настенные и башенные — zegar. Русское «часы» покрывает и то и другое." }
  - { kind: usage, text: "Слово во множественном числе означает несколько штук часов, а не одни: mam dwa zegarki «у меня двое часов». По-русски «часы» сами по себе множественные." }
  - { kind: government, text: "На часах — na zegarku (предложный падеж): na moim zegarku jest czwarta «на моих часах четыре»." }
  - { kind: usage, text: "Wszystko działa jak w zegarku — «всё работает как часы»." }
collocations:
  - { pl: "na zegarku", ru: "на часах" }
  - { pl: "nosić zegarek", ru: "носить часы" }
  - { pl: "zsynchronizować zegarki", ru: "сверить часы" }
family:
  - { pl: "zegar", ru: "часы (настенные, башенные)", relation: root }
  - { pl: "zegarmistrz", ru: "часовщик", relation: root }
etymology: "Уменьшительное от zegar «часы», заимствованного из немецкого Seiger «часы с гирями». Русское «часы» — от «час», совсем другой образ."
memory: "zegarek — наручные или карманные часы, а большие настенные — zegar. Во множественном zegarki значит несколько штук: mam dwa zegarki «у меня двое часов»."
idioms:
  - { pl: "jak w zegarku", ru: "как часы, без сбоев" }
  - { pl: "z zegarkiem w ręku", ru: "с часами в руках, точно" }
  - { pl: "zsynchronizować zegarki", ru: "сверить часы" }
formExamplesSkip:
