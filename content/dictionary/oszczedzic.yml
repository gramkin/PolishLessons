formExamples:
  - form: "oszczędzi"
    pl: "Twoja pomoc oszczędzi nam sporo pracy."
    ru: "Твоя помощь сэкономит нам немало работы."
    source: { kind: translated, id: 3898868 }
  - form: "oszczędzi"
    pl: "On żyje z dnia na dzień, ani grosza nie oszczędzi."
    ru: "Он живёт одним днём, ни гроша не сбережёт."
    source: { kind: translated, id: 731929 }
  - form: "oszczędzi"
    pl: "To oszczędzi nam kłopotów."
    ru: "Это избавит нас от хлопот."
    source: { kind: authored }
  - form: "oszczędzić"
    pl: "Użyłem komputera, by oszczędzić czas."
    ru: "Я воспользовался компьютером, чтобы сэкономить время."
    source: { kind: translated, id: 2688609 }
  - form: "oszczędzić"
    pl: "Użyliśmy komputera, by oszczędzić czas."
    ru: "Мы воспользовались компьютером, чтобы сэкономить время."
    source: { kind: translated, id: 2688610 }
  - form: "oszczędzić"
    pl: "Bycie łysym ma przynajmniej jedną zaletę - można dużo oszczędzić na szamponie."
    ru: "У лысины есть хотя бы одно достоинство — можно много сэкономить на шампуне."
    source: { kind: translated, id: 6169375 }
  - form: "oszczędzisz"
    pl: "Oszczędzisz ojcu martwienia się, jeśli po prostu napiszesz do niego list."
    ru: "Ты избавишь отца от беспокойства, если просто напишешь ему письмо."
    source: { kind: translated, id: 3956218 }
  - form: "oszczędzisz"
    pl: "Oszczędzisz sobie wstydu."
    ru: "Ты избавишь себя от стыда."
    source: { kind: authored }
  - form: "oszczędzisz"
    pl: "Tak oszczędzisz godzinę."
    ru: "Так ты сэкономишь час."
    source: { kind: authored }
  - form: "oszczędź"
    pl: "Oszczędź mi szczegółów."
    ru: "Избавь меня от подробностей."
    source: { kind: translated, id: 3655572 }
  - form: "oszczędź"
    pl: "Oszczędź sobie fatygi."
    ru: "Избавь себя от хлопот."
    source: { kind: authored }
  - form: "oszczędź"
    pl: "Oszczędź mi wykładu."
    ru: "Избавь меня от нотации."
    source: { kind: authored }
  - form: "oszczędźmy"
    pl: "Oszczędźmy pieniądze na wyprzedaże."
    ru: "Сбережём деньги на распродажи."
    source: { kind: translated, id: 367014 }
  - form: "oszczędźmy"
    pl: "Oszczędźmy sobie czasu."
    ru: "Сэкономим себе время."
    source: { kind: authored }
  - form: "oszczędźmy"
    pl: "Oszczędźmy mu wstydu."
    ru: "Избавим его от стыда."
    source: { kind: authored }
