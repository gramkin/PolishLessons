# review
id: oszczedzic
format: 2
lemma: "oszczędzić"
rank: 2377
pos: verb
aspect: perf
pron: { cyr: "ошчэ́ндзиць" }
senses:
  - id: save
    ru: "сэкономить, сберечь"
    examples:
      - pl: "Użyłem komputera, by oszczędzić czas."
        ru: "Я воспользовался компьютером, чтобы сэкономить время."
        source: { kind: translated, id: 2688609 }
      - pl: "Twoja pomoc oszczędzi nam sporo pracy."
        ru: "Твоя помощь сэкономит нам немало работы."
        source: { kind: translated, id: 3898868 }
      - pl: "Oszczędźmy pieniądze na wyprzedaże."
        ru: "Сбережём деньги на распродажи."
        source: { kind: translated, id: 367014 }
  - id: spare-someone
    ru: "избавить (кого-л. от чего-л.), пощадить"
    examples:
      - pl: "Oszczędź mi szczegółów."
        ru: "Избавь меня от подробностей."
        source: { kind: translated, id: 3655572 }
      - pl: "Oszczędzisz ojcu martwienia się, jeśli po prostu napiszesz do niego list."
        ru: "Ты избавишь отца от беспокойства, если просто напишешь ему письмо."
        source: { kind: translated, id: 3956218 }
notes:
  - { kind: government, text: "Во втором значении два дополнения: КОГО в дательном и ЧТО в родительном — oszczędź mi szczegółów «избавь меня от подробностей». Русское «избавить от» берёт винительный и предлог, так что падежи расходятся полностью." }
  - { kind: false-friend, text: "От szczędzić «жалеть, скупиться», которое уже есть в словаре, и корень тот же, что в русском «щадить», «пощада»." }
  - { kind: usage, text: "Первое значение прозрачно: oszczędzić czas, oszczędzić pieniądze «сэкономить время, деньги», с винительным." }
  - { kind: usage, text: "Несовершенный вид — oszczędzać; существительное oszczędności «сбережения»." }
collocations:
  - { pl: "oszczędzić czas", ru: "сэкономить время" }
  - { pl: "oszczędź mi szczegółów", ru: "избавь меня от подробностей" }
etymology: "От szczędzić «жалеть, скупиться»; корень тот же, что в русском «щадить», «пощада»."
memory: "oszczędzić — «сэкономить» и «избавить». Во втором смысле падежи свои: кого в ДАТЕЛЬНОМ, что в РОДИТЕЛЬНОМ — oszczędź mi szczegółów. Несовершенный вид — oszczędzać."
idioms:
