etymology: "Из латинского VERSUS «строка, стих», от глагола VERTERE «поворачивать»: так называли борозду, которую плуг проводит до конца поля и поворачивает обратно, а затем — строку письма, идущую тем же порядком. Польский взял слово через чешское посредство и приспособил к своему звучанию, получив WIERSZ с закономерным переходом латинского V в W и S в SZ. Русский заимствовал уже польскую форму, через украинский, в семнадцатом веке, когда в Москву пришла школьная поэзия киевского образца, и получил «вирши». Поскольку эта поэзия скоро устарела, слово получило насмешливый оттенок, а для нейтрального понятия русский взял греческое «стих»."
memory: "Русские «вирши» — это и есть польское wiersz, заимствованное через украинский в семнадцатом веке, но по-польски слово нейтральное и школьное: wiersz Mickiewicza. От латинского versus «строка», от vertere «поворачивать», как борозда плуга. Отсюда и второе значение, незнакомое русскому: строка в тексте или таблице, против kolumna «столбец». Местный wierszu на -u, потому что основа на шипящий; родительный множественного wierszy без -ów."
idioms:
  - { pl: "wiersz po wierszu", ru: "строка за строкой" }
