notes:
  - { kind: false-friend, text: "Русское «вирши» — это и есть польское WIERSZ, заимствованное через украинское посредство в семнадцатом веке, но значение по дороге испортилось. По-польски WIERSZ это обычное, нейтральное слово для стихотворения: WIERSZ MICKIEWICZA звучит так же буднично, как «стихотворение Пушкина». Русские же «вирши» означают неумелые или насмешливо помянутые стихи, и сказать так о классике нельзя. Второе значение, строка, русскому незнакомо вовсе: WIERSZ TRZECI значит «третья строка», и в таблице WIERSZ противопоставлен KOLUMNIE, то есть столбцу." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Местный и звательный единственного — WIERSZU, с окончанием -U, потому что основа кончается на шипящий SZ; формы на -E у таких основ не бывает. Родительный единственного — WIERSZA, с окончанием -A, а не -U: названия произведений и текстов берут именно его. Родительный множественного — WIERSZY, без окончания -ÓW, что обычно для основ на мягкий и шипящий. Винительный равен именительному. Устойчивое WIERSZ PO WIERSZU значит «строка за строкой» и строится винительным с предлогом PO." }
  - { kind: pronunciation, text: "Читается «верш», один слог. Сочетание WIE даёт «ве» с мягким W, а RSZ произносится как «рш», одним движением, без гласного между ними. Конечное SZ глухое и твёрдое. В форме WIERSZA слышно «ве́рша», в форме WIERSZEM — «ве́ршэм», с чистым «э». Во множественном WIERSZE звучит «ве́рше», а WIERSZY — «ве́ршы», с твёрдым «ы», потому что после SZ польский всегда даёт Y, а не I." }
  - { kind: register, text: "В значении стихотворения слово нейтральное и школьное: UCZYĆ SIĘ WIERSZA NA PAMIĘĆ — обычное домашнее задание. Устойчивые сочетания: TOMIK WIERSZY «сборник стихов», WIERSZ WOLNY «верлибр», WIERSZ BIAŁY «белый стих». Для поэзии как рода есть слово POEZJA, для поэмы — POEMAT, и путать их не следует: POEMAT это крупное произведение, а не всякое стихотворение. В значении строки слово техническое и встречается в типографике, в таблицах и в программировании." }
