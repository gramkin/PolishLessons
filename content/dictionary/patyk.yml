# review
id: patyk
format: 2
lemma: "patyk"
rank: 5003
pos: noun
pron: { cyr: "па́тык" }
senses:
  - id: stick
    ru: "палочка, прут, сухая ветка"
    examples:
      - pl: "Pies przyniósł patyk w zębach."
        ru: "Пёс принёс палку в зубах."
        source: { kind: authored }
      - pl: "Dzieci rysowały patykiem na piasku."
        ru: "Дети рисовали палочкой на песке."
        source: { kind: authored }
      - pl: "Zbierz suche patyki na ognisko."
        ru: "Собери сухие палки для костра."
        source: { kind: authored }
  - id: grand
    ru: "тысяча злотых, «штука» (разг.)"
    examples:
      - pl: "Za ten rower dał dwa patyki."
        ru: "За этот велосипед он отдал две штуки."
        source: { kind: authored }
      - pl: "Zarabia pięć patyków miesięcznie."
        ru: "Он зарабатывает пять штук в месяц."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "PATYK — не палка вообще, а тонкая сухая ветка, палочка, прут. Палка покрепче — KIJ. Уменьшительное PATYCZEK в быту встречается чаще всего: PATYCZKI DO USZU — ватные палочки, PATYCZKI DO JEDZENIA — палочки для еды. А PATYCZAK — насекомое палочник." }
  - { kind: usage, text: "Десять форм, мужской род. В винительном две формы: PATYK и разговорная PATYKA, как ZJEŚĆ BANANA. В разговоре PATYK значит ещё «тысяча злотых», «штука»: DWA PATYKI, PIĘĆ PATYKÓW." }
  - { kind: government, text: "Рисовать палочкой — RYSOWAĆ PATYKIEM, творительный без предлога. На палочке — NA PATYKU, местный: KIEŁBASKA NA PATYKU. Писано вилами по воде — PISANY PATYKIEM PO WODZIE, творительный и PO с местным." }
  - { kind: pronunciation, text: "Читается «па́тык», два слога, ударение на первом. Y звучит как «ы». В формах PATYKI и PATYKIEM сочетание KI смягчает «к»: «па́тыки»." }
  - { kind: register, text: "Слово бытовое. CHUDY JAK PATYK — «худой как щепка». PISANY PATYKIEM PO WODZIE — о деле ненадёжном, как наше «вилами по воде писано». Значение «тысяча злотых» — уличное и разговорное." }
collocations:
  - { pl: "suchy patyk", ru: "сухая ветка" }
  - { pl: "rysować patykiem", ru: "рисовать палочкой" }
  - { pl: "kiełbaska na patyku", ru: "колбаска на палочке" }
family:
  - { pl: "patyczek", ru: "палочка; ватная палочка", relation: derived }
  - { pl: "patykowaty", ru: "тощий, долговязый", relation: derived }
  - { pl: "patyczak", ru: "палочник (насекомое)", relation: derived }
etymology: "Слово чисто польское: русского родственника у него нет, и происхождение его словари считают тёмным. Поэтому запоминать его удобнее через обороты: CHUDY JAK PATYK и PISANY PATYKIEM PO WODZIE."
memory: "Patyk — палочка, прут; крепкая палка — kij. Читается «па́тык». Patyczki do uszu — ватные палочки. Pisany patykiem po wodzie — вилами по воде писано. В разговоре dwa patyki — две тысячи злотых."
idioms:
  - { pl: "pisany patykiem po wodzie", ru: "вилами по воде писано" }
  - { pl: "chudy jak patyk", ru: "худой как щепка" }
