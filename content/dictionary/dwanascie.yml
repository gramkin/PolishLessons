etymology: "Праславянское *dъva na desęte «два на десяти», как русское «двенадцать». Польский сжал *na desęte в -NAŚCIE."
memory: "Dwanaście — «два на десять», как «двенадцать». О мужчинах — dwunastu, о детях — dwanaścioro."
idioms:
  - { pl: "za pięć dwunasta", ru: "без пяти двенадцать, в последний момент" }
