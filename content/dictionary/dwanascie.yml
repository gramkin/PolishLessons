notes:
  - { kind: false-friend, text: "DWANAŚCIE — «двенадцать», корни совпадают: DWA + NA + DZIEŚCIE, то есть «два на десять». Но о мужчинах говорят DWUNASTU, а о детях — DWANAŚCIORO: русское «двенадцать» здесь одно на все случаи." }
  - { kind: usage, text: "Косвенные падежи — DWUNASTU (родительный, дательный, предложный), творительный — DWUNASTOMA. DWUNASTU — ещё и счёт мужчин: DWUNASTU APOSTOŁÓW. Собирательное DWANAŚCIORO — для детей и смешанных групп. DWUNASTO- — первая часть сложных слов: DWUNASTOLETNI." }
  - { kind: government, text: "Требует родительного множественного: DWANAŚCIE LAT, DWANAŚCIE KOBIET. Глагол в прошедшем — средний род единственного: PRZYSZŁO DWANAŚCIE OSÓB «пришло двенадцать человек»." }
  - { kind: pronunciation, text: "Читается «двана́сьце»: ŚCIE — «сьце». Ударение, как у всех числительных на -naście, на предпоследнем слоге: dwa-NA-ście. DWUNASTU — «двуна́сту»." }
  - { kind: register, text: "Нейтральное слово. О времени чаще говорят порядковым: O DWUNASTEJ «в двенадцать». Дюжина — TUZIN." }
