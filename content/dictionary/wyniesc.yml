# review
id: wyniesc
format: 2
lemma: "wynieść"
rank: 2463
pos: verb
pron: { cyr: "вы́нєщць" }
senses:
  - id: carry-out
    ru: "вынести, выносить наружу"
    examples:
      - pl: "Wynieś śmieci, zanim wyjdziesz."
        ru: "Вынеси мусор, прежде чем уйдёшь."
        source: { kind: authored }
      - pl: "Wyniósł skrzynki do garażu."
        ru: "Он вынес ящики в гараж."
        source: { kind: authored }
  - id: amount-to
    ru: "составить (о сумме, величине)"
    examples:
      - pl: "Rachunek wyniósł sto złotych."
        ru: "Счёт составил сто злотых."
        source: { kind: authored }
      - pl: "Strata wyniosła dwa miliony."
        ru: "Убыток составил два миллиона."
        source: { kind: authored }
  - id: elevate
    ru: "возвысить, поднять (перен.)"
    examples:
      - pl: "Wyniesiono go na stanowisko dyrektora."
        ru: "Его возвели в должность директора."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ВТОРОЕ ЗНАЧЕНИЕ РУССКОМУ «ВЫНЕСТИ» ЧУЖДО СОВСЕМ. WYNIEŚĆ значит ещё и «составить» о сумме: rachunek wyniósł sto złotych, strata wyniosła dwa miliony, odległość wynosi kilometr. По-русски тут нужно «составить» или «равняться», а «вынести» прозвучало бы бессмыслицей. В финансовых и технических текстах это значение самое частое." }
  - { kind: usage, text: "ЧЕРЕДОВАНИЕ o/ó ЗДЕСЬ УПРАВЛЯЕТСЯ ЗАКРЫТОСТЬЮ СЛОГА, И ЭТО ВИДНО НАСКВОЗЬ. Свободная форма мужского рода — WYNIÓSŁ, слог закрыт согласной, поэтому ó. Как только окончание открывает слог, возвращается o: wyniosła, wyniosło, wyniosły, а также wyniosłem и wyniosłeś. Тот же механизм, что в naród/narodu и stół/stolik." }
  - { kind: usage, text: "Вид совершенный: есть WYNIÓSŁSZY, форм на -ąc и -ący нет, несовершенная пара — WYNOSIĆ. Отглагольное WYNIESIENIE значит «вынос» и «возвышение», а оборот wyniesiony na ołtarze означает причисление к лику святых." }
collocations:
  - { pl: "wynieść śmieci", ru: "вынести мусор" }
  - { pl: "rachunek wyniósł", ru: "счёт составил" }
  - { pl: "wyniesiony na ołtarze", ru: "причисленный к лику святых" }
family:
  - { pl: "wynosić", ru: "выносить (несов.)", relation: aspect, id: wynosic }
  - { pl: "nieść", ru: "нести", relation: root }
  - { pl: "wnieść", ru: "внести", relation: root, id: wniesc }
etymology: "Приставка wy- и nieść, из праславянского *nesti — того же корня, что русские «нести» и «вынести». Значение «составлять о сумме» развилось из образа «выносить итог», и русский его не перенял. Отсюда wyniesienie и wynosić."
memory: "wynieść — «вынести», но запомни второе значение: о сумме это «составить». Rachunek wyniósł sto złotych. И следи за o/ó: wyniósł в закрытом слоге, но wyniosła, wyniosłem, когда слог открывается."
idioms:
  - { pl: "wyniesiony na ołtarze", ru: "причисленный к лику святых" }
  - { pl: "wynieść coś z domu", ru: "усвоить что-л. с детства" }
