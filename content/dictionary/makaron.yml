notes:
  - { kind: false-friend, text: "Польский MAKARON — это не только «макароны», но любая паста и любая лапша: спагетти, тальятелле, домашняя лапша в супе. ROSÓŁ Z MAKARONEM — бульон с лапшой, и отдельного обиходного слова для лапши нет. Главное отличие в числе: как еда слово стоит в единственном, MAKARON JEST GOTOWY — «макароны готовы»." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Как еда слово почти всегда в единственном числе: ZJEŚĆ MAKARON, TALERZ MAKARONU. Множественное MAKARONY значит «разные виды макарон»: W SKLEPIE SĄ RÓŻNE MAKARONY." }
  - { kind: government, text: "Тарелка макарон — TALERZ MAKARONU, родительный единственного, где у нас родительный множественного. Бульон с лапшой — ROSÓŁ Z MAKARONEM, творительный после Z. Вешать лапшу на уши — NAWIJAĆ MAKARON NA USZY, буквально «наматывать макароны на уши»." }
  - { kind: pronunciation, text: "Читается «мака́рон», три слога, ударение на втором, как и положено в польском. В русском ударение падает на третий слог, «макаро́ны», и по привычке его легко перенести. Конечное N твёрдое." }
  - { kind: register, text: "Слово нейтральное, кухонное. Оборот NAWIJAĆ MAKARON NA USZY разговорный и совпадает с русским почти дословно, только поляк лапшу «наматывает», а не «вешает»." }
collocations:
  - { pl: "makaron z sosem", ru: "макароны с соусом" }
  - { pl: "ugotować makaron", ru: "сварить макароны" }
  - { pl: "rosół z makaronem", ru: "бульон с лапшой" }
family:
  - { pl: "makaronowy", ru: "макаронный", relation: derived }
  - { pl: "makaronik", ru: "пирожное макарон", relation: derived }
  - { pl: "makaronizm", ru: "макаронизм, вставка иноязычных слов", relation: derived }
etymology: "Из итальянского MACCHERONI. Русский взял то же слово, но во множественном числе, «макароны», а польский сделал из него вещественное существительное в единственном, как MIĘSO или CHLEB. От того же слова MAKARONIZM — смесь языков в речи, когда в польскую фразу вставляют латинские слова."
memory: "Makaron — любая паста и лапша, и в единственном числе: makaron jest gotowy. Rosół z makaronem — бульон с лапшой. Ударение на втором слоге: «мака́рон». А вешать лапшу на уши по-польски — nawijać makaron na uszy."
idioms:
  - { pl: "nawijać makaron na uszy", ru: "вешать лапшу на уши" }
