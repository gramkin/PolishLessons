  - { pl: "alergolog", ru: "аллерголог", relation: derived }
etymology: "Из греческих слов «другой» и «действие»: иная, необычная реакция организма. Русское «аллергия» — из того же источника."
memory: "Alergia — аллергия, одно L. Читается «але́ргья». Mam alergię na koty — у меня аллергия на кошек. Uczulony na — аллергик на."
idioms:
  - { pl: "mieć alergię na coś", ru: "не переваривать что-то" }
formExamplesSkip:
