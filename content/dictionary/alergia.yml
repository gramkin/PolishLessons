notes:
  - { kind: false-friend, text: "ALERGIA — «аллергия», но с одним L. Аллергик — ALERGIK. В разговоре вместо MAM ALERGIĘ часто говорят прилагательным: JESTEM UCZULONY NA KOTY." }
  - { kind: usage, text: "Восемь живых форм, женский род на -IA. Родительный, дательный и местный — ALERGII. Во множественном — ALERGIE, о разных видах. Архаичная форма ALERGIJ и звательный не даются." }
  - { kind: government, text: "Аллергия на что-то — ALERGIA NA, и винительный, как в русском: ALERGIA NA PYŁKI, NA ORZECHY. Лекарство от аллергии — LEK NA ALERGIĘ." }
  - { kind: pronunciation, text: "Читается «але́ргья», ударение на предпоследнем слоге. GIA — «гья», с мягким Г." }
collocations:
  - { pl: "alergia na orzechy", ru: "аллергия на орехи" }
  - { pl: "mieć alergię", ru: "страдать аллергией" }
  - { pl: "alergia pokarmowa", ru: "пищевая аллергия" }
family:
  - { pl: "alergik", ru: "аллергик", relation: derived }
