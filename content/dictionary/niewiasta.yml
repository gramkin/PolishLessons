# review
id: niewiasta
format: 2
lemma: "niewiasta"
rank: 2184
pos: noun
pron: { cyr: "невя́ста" }
senses:
  - id: woman
    ru: "женщина (устаревшее, книжное)"
    examples:
      - pl: "Młoda niewiasta weszła do izby."
        ru: "Молодая женщина вошла в горницу."
        source: { kind: authored }
      - pl: "Niewiasta w czerni stała przy oknie."
        ru: "Женщина в чёрном стояла у окна."
        source: { kind: authored }
      - pl: "Tak mówiły dawniej niewiasty."
        ru: "Так говорили женщины в старину."
        source: { kind: authored }
  - id: lady
    ru: "жена, госпожа (в старинных текстах)"
    examples:
      - pl: "Niewiasty zebrały się w kościele."
        ru: "Женщины собрались в костёле."
        source: { kind: authored }
      - pl: "Była to niewiasta wielkiej urody."
        ru: "Это была женщина большой красоты."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Главная ловушка транша: польское niewiasta значит «женщина», а русское «невеста» — «нареченная перед свадьбой». Слово одно, значения разошлись: исходное *ne-věsta «неизвестная, чужая в доме мужа»." }
  - { kind: usage, text: "Слово архаичное и книжное. В обычной речи женщина — kobieta." }
  - { kind: government, text: "Женский род: ta niewiasta, tej niewiasty." }
  - { kind: usage, text: "В корпусе слово не встречается совсем, поэтому все примеры составлены вручную." }
collocations:
  - { pl: "młoda niewiasta", ru: "молодая женщина" }
etymology: "Праславянское *ne-věsta «неизвестная» — та, что пришла в дом мужа чужой. Русское «невеста» — то же слово, но значение сузилось до нареченной."
memory: "niewiasta — книжное «женщина», а вовсе не «невеста». Слово общее с русским, но значения разошлись: невеста по-польски narzeczona, а обычная женщина — kobieta."
idioms:
  - { pl: "młoda niewiasta", ru: "молодая женщина" }
