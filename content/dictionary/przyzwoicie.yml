notes:
  - { kind: usage, text: "Два оттенка, как в русском: «пристойно» о поведении и «неплохо» о качестве или количестве." }
  - { kind: false-friend, text: "Корень przyzwoity «приличный», от старого zwoity «подобающий»; ср. русское «приличный» от «лик, приличие» — образ иной, смысл тот же." }
  - { kind: government, text: "Не изменяется; сравнительная степень — przyzwoiciej." }
  - { kind: usage, text: "Zachowuj się przyzwoicie «веди себя прилично» — стандартное родительское наставление." }
collocations:
  - { pl: "zachowywać się przyzwoicie", ru: "вести себя прилично" }
  - { pl: "zarabiać przyzwoicie", ru: "прилично зарабатывать" }
etymology: "От przyzwoity «приличный, подобающий», от старого zwoity."
