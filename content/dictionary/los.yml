# review
id: los
format: 2
lemma: "los"
rank: 907
pos: noun
pron: { cyr: "лёс" }
senses:
  - id: fate
    ru: "судьба, участь"
    examples:
      - pl: "Jesteś panem swego losu."
        ru: "Ты хозяин своей судьбы."
        source: { kind: translated, id: 945841 }
      - pl: "Pogodził się z losem."
        ru: "Он смирился с судьбой."
        source: { kind: translated, id: 643776 }
      - pl: "Stawił czoła losowi i wygrał."
        ru: "Он встретил судьбу лицом к лицу и победил."
        source: { kind: translated, id: 960946 }
  - id: tempt
    ru: "kusić los — испытывать судьбу"
    examples:
      - pl: "Nie kuś losu."
        ru: "Не искушай судьбу."
        source: { kind: translated, id: 363760 }
      - pl: "Kusisz los."
        ru: "Ты искушаешь судьбу."
        source: { kind: translated, id: 2218858 }
      - pl: "Nie igraj z losem."
        ru: "Не играй с судьбой."
        source: { kind: translated, id: 6729777 }
  - id: lot
    ru: "losy — жребий; лотерейный билет"
    note: "Во множественном числе слово значит ещё и «жребий»."
    examples:
      - pl: "Rzućmy losy."
        ru: "Бросим жребий."
        source: { kind: translated, id: 12249100 }
      - pl: "Książki mają własne losy."
        ru: "У книг своя судьба."
        source: { kind: translated, id: 970708 }
      - pl: "Kupił los na loterii."
        ru: "Он купил лотерейный билет."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Основное значение — «судьба, участь»: pan swego losu «хозяин своей судьбы», pogodzić się z losem «смириться с судьбой»." }
  - { kind: usage, text: "Второе значение — «жребий» и «лотерейный билет»: rzucić losy «бросить жребий», kupić los «купить лотерейный билет». Отсюда и loteria, и losowanie «жеребьёвка»." }
  - { kind: government, text: "stawić czoła losowi «встретить судьбу лицом к лицу» — дательный падеж; pogodzić się z losem «смириться с судьбой» — творительный." }
  - { kind: usage, text: "ofiara losu — «жертва судьбы», то есть «невезучий человек, недотёпа». А kusić los значит «испытывать судьбу»." }
collocations:
  - { pl: "kusić los", ru: "искушать судьбу" }
  - { pl: "ofiara losu", ru: "неудачник, растяпа" }
  - { pl: "pogodzić się z losem", ru: "смириться с судьбой" }
  - { pl: "rzucić losy", ru: "бросить жребий" }
family:
  - { pl: "losowanie", ru: "жеребьёвка", relation: derived }
  - { pl: "losowy", ru: "случайный", relation: derived }
  - { pl: "loteria", ru: "лотерея", relation: derived }
etymology: "Праславянское *losъ «жребий, доля». В русском прямого потомка не осталось — и «жребий», и «судьба» слова другого корня, — поэтому los приходится запоминать отдельно."
memory: "los — «судьба», а во множественном числе ещё и «жребий»: rzucić losy «бросить жребий», kupić los «купить лотерейный билет». Отсюда loteria и losowanie. Запомните kusić los «искушать судьбу» и ofiara losu — так называют вечного неудачника."
idioms:
  - { pl: "kusić los", ru: "искушать судьбу" }
  - { pl: "ofiara losu", ru: "неудачник, растяпа" }
  - { pl: "pogodzić się z losem", ru: "смириться с судьбой" }
