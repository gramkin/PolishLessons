  - id: men
    ru: "мужчина (во множественном, в описаниях)"
    examples:
      - pl: "Jesteśmy mężczyznami."
        ru: "Мы мужчины."
        source: { kind: tatoeba, id: 563485 }
      - pl: "Tam było trzech mężczyzn."
        ru: "Там было трое мужчин."
