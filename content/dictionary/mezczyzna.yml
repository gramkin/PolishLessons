notes:
  - { kind: usage, text: "Главная особенность: слово мужского рода, но склоняется как женские на -a: mężczyzna, mężczyzny, mężczyźnie, mężczyznę, mężczyzną. Русское «мужчина» устроено точно так же." }
  - { kind: false-friend, text: "mężczyzna — «мужчина», mąż — «муж». Не путайте: Jestem mężczyzną «Я мужчина», но Jest moim mężem «Он мой муж»." }
  - { kind: usage, text: "Звательный mężczyzno звучит грубовато; к незнакомому мужчине обращаются proszę pana." }
collocations:
  - { pl: "młody mężczyzna", ru: "молодой мужчина" }
  - { pl: "starszy mężczyzna", ru: "пожилой мужчина" }
  - { pl: "mężczyźni i kobiety", ru: "мужчины и женщины" }
  - { pl: "dorosły mężczyzna", ru: "взрослый мужчина" }
etymology: "Праславянское *mǫžьščina, от *mǫžь «муж»; русское «мужчина» образовано тем же суффиксом и склоняется так же."
memory: "mężczyzna — «мужчина», мужского рода, но склоняется как слова на -a: mężczyzny, mężczyźnie, mężczyzną — ровно как русское «мужчина». А «муж» — это mąż."
idioms:
