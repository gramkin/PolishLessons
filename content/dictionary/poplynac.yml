# review
id: poplynac
format: 2
lemma: "popłynąć"
rank: 5018
pos: verb
pron: { cyr: "попуы́нонць" }
senses:
  - id: swim-off
    ru: "поплыть, отплыть"
    examples:
      - pl: "Popłynął na drugi brzeg."
        ru: "Он поплыл на другой берег."
        source: { kind: authored }
      - pl: "Statek popłynął w stronę Gdańska."
        ru: "Корабль поплыл в сторону Гданьска."
        source: { kind: authored }
      - pl: "Popłyńmy do tej wysepki."
        ru: "Давай поплывём к тому островку."
        source: { kind: authored }
  - id: flow
    ru: "потечь, политься (о слезах, музыке); увлечься (разг.)"
    examples:
      - pl: "Łzy popłynęły jej po policzkach."
        ru: "Слёзы потекли у неё по щекам."
        source: { kind: authored }
      - pl: "Z głośników popłynęła muzyka."
        ru: "Из динамиков полилась музыка."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "POPŁYNĄĆ — «поплыть», и переносные значения совпадают: ŁZY POPŁYNĘŁY, «слёзы потекли», MUZYKA POPŁYNĘŁA, «полилась музыка». В сленге POPŁYNĄĆ — «увлечься, потерять контроль»: TROCHĘ POPŁYNĄŁEŚ, «ты немного перегнул палку», а также «опьянеть»." }
  - { kind: usage, text: "Сорок две формы: глагол совершенного вида и непереходный, страдательного причастия нет; есть деепричастие POPŁYNĄWSZY и безличное POPŁYNIĘTO. Чередование: POPŁYNĄŁ, но POPŁYNĘŁA. Начало движения — как POJECHAĆ, POBIEC." }
  - { kind: government, text: "Куда — DO с родительным или NA с винительным: POPŁYNĄĆ DO PORTU, NA WYSPĘ. По чему — PO с местным: ŁZY POPŁYNĘŁY PO TWARZY. Откуда — Z с родительным: MUZYKA POPŁYNĘŁA Z RADIA." }
  - { kind: pronunciation, text: "Читается «попуы́нонць», три слога, ударение на предпоследнем. Ł — короткое «у»: «пуы». Ą перед Ć — «он». POPŁYNĘŁA — «попуынэ́уа»." }
  - { kind: register, text: "Нейтральное слово. Переносное «потекли слёзы» — литературное. Сленговое «перегнуть палку, опьянеть» — молодёжное: NA IMPREZIE TROCHĘ POPŁYNĄŁ." }
collocations:
  - { pl: "popłynąć na drugi brzeg", ru: "поплыть на другой берег" }
  - { pl: "łzy popłynęły", ru: "слёзы потекли" }
  - { pl: "popłynęła muzyka", ru: "полилась музыка" }
family:
  - { pl: "płynąć", ru: "плыть, течь", relation: root, id: plynac }
  - { pl: "pływać", ru: "плавать", relation: root, id: plywac }
  - { pl: "wypłynąć", ru: "выплыть, выйти в море", relation: root, id: wyplynac }
etymology: "Приставка PO- (начало движения) плюс PŁYNĄĆ «плыть», праславянское *plynǫti. Русское «поплыть» — то же слово с тем же значением начала."
memory: "Popłynąć — поплыть: popłynął na drugi brzeg. Łzy popłynęły — слёзы потекли. Сленг: trochę popłynąłeś — перегнул палку. Читается «попуы́нонць»."
idioms:
