notes:
  - { kind: false-friend, text: "СЛОВО DRAGON В ПОЛЬСКОМ ЕСТЬ, НО ЭТО НЕ ДРАКОН. Польское dragon значит «драгун», то есть конный солдат. Сказочный зверь называется только SMOK. Русское «дракон» пришло из греческого, а польское smok — слово своё, славянское, и потому совсем не похоже." }
  - { kind: usage, text: "Существительное одушевлённое, поэтому винительный равен родительному: widzę SMOKA, zabił smoka. Главный смок Польши — Smok Wawelski из краковского предания; его фигура стоит у подножия Вавеля и выдыхает огонь. Отсюда и шутливое smok о грозной особе." }
  - { kind: pronunciation, text: "Один слог: смок. Читается как русское слово «смок», с твёрдым к на конце. Родительный smoka звучит «смо́ка», с ударением на первом слоге." }
collocations:
