etymology: "Из праславянского *smokъ «змей», того же корня, что *smъkati «ползти» — буквально «ползучий». Слово сохранилось в белорусском «смок» и в русских говорах, где «смок» значит уж или змею. Литературный русский взял вместо него греческое «дракон»."
memory: "smok — «дракон», слово славянское, родственное русскому диалектному «смок» — змея. А польское dragon это «драгун», солдат, а не зверь. Винительный как родительный: zabił smoka."
idioms:
