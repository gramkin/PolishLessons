  - { pl: "zabić smoka", ru: "убить дракона" }
  - { pl: "jaskinia smoka", ru: "пещера дракона" }
family:
  - { pl: "wąż", ru: "змея", relation: root, id: waz }
  - { pl: "baśń", ru: "сказка", relation: root }
