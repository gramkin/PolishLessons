pron: { cyr: "стшэ́льба" }
senses:
  - id: shotgun
    ru: "ружьё (охотничье)"
    examples:
      - pl: "Myśliwy zarzucił strzelbę na ramię."
        ru: "Охотник закинул ружьё на плечо."
