  - id: gun
    ru: "ружьё вообще, оружие (в рассказе, в кино)"
    examples:
      - pl: "Kowboj wyciągnął strzelbę."
        ru: "Ковбой вытащил ружьё."
        source: { kind: authored }
      - pl: "Strzelba wisi na ścianie w pierwszym akcie."
        ru: "В первом акте на стене висит ружьё."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "STRZELBA — «ружьё», а не «стрельба». Стрельба — STRZELANINA или STRZELANIE. Корень тот же: STRZELAĆ — «стрелять». Армейская винтовка — KARABIN." }
  - { kind: usage, text: "Девять форм, женский род. В дательном и местном L смягчается: STRZELBIE. Звательный STRZELBO не употребляется." }
  - { kind: government, text: "Стрелять из ружья — STRZELAĆ ZE STRZELBY, ZE с родительным. Целиться из ружья — CELOWAĆ ZE STRZELBY. С ружьём — ZE STRZELBĄ, творительный." }
  - { kind: pronunciation, text: "Читается «стшэ́льба». RZ после T оглушается в «ш», а L перед согласной — мягкое «ль». Ударение на предпоследнем слоге." }
collocations:
  - { pl: "strzelba myśliwska", ru: "охотничье ружьё" }
  - { pl: "strzelać ze strzelby", ru: "стрелять из ружья" }
  - { pl: "naładować strzelbę", ru: "зарядить ружьё" }
family:
  - { pl: "strzelać", ru: "стрелять", relation: root, id: strzelac }
  - { pl: "strzał", ru: "выстрел", relation: root, id: strzal }
  - { pl: "karabin", ru: "винтовка", relation: root, id: karabin }
etymology: "От STRZELAĆ «стрелять», того же корня, что русское «стрела», «стрелять». Польское RZ на месте русского Р: STRZAŁA — «стрела»."
memory: "Strzelba — ружьё, а стрельба — strzelanina. Strzelać ze strzelby — стрелять из ружья. Читается «стшэ́льба»."
idioms:
  - { pl: "strzelba Czechowa", ru: "чеховское ружьё" }
