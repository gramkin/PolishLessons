        ru: "Подавай претензию сразу, пока у тебя есть чек."
        source: { kind: authored }
  - id: self-promote
    ru: "(reklamować się) рекламировать себя, выставлять себя в выгодном свете"
    examples:
      - pl: "Każda partia reklamuje się jako jedyna uczciwa."
        ru: "Каждая партия выставляет себя единственной честной."
        source: { kind: authored }
      - pl: "Gazeta reklamowała się hasłem „Zawsze pierwsi”."
        ru: "Газета рекламировала себя лозунгом «Всегда первые»."
        source: { kind: authored }
      - pl: "Reklamowałbym się mniej, a pracował więcej."
        ru: "Я бы меньше себя рекламировал и больше работал."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Полуложный друг. Первое значение совпадает с русским «рекламировать». Но в магазине REKLAMOWAĆ почти всегда значит другое: «предъявить претензию к товару», «сдать по гарантии». Chcę reklamować te buty — не «хочу прорекламировать туфли», а «хочу вернуть их с претензией». Отсюда REKLAMACJA — «претензия, рекламация» (это слово в русском тоже есть, но только в деловом языке): złożyć reklamację, «подать претензию»; uznać reklamację, «признать претензию»; odrzucić reklamację, «отклонить её»." }
  - { kind: government, text: "Что — винительный в обоих значениях: reklamować kosmetyki, reklamować pralkę. Как что — JAKO: reklamować jogurt jako zdrowy. Где — W + местный: reklamować w telewizji, w radiu, w internecie. Возвратное REKLAMOWAĆ SIĘ — «рекламировать себя»: reklamować się na Facebooku." }
  - { kind: usage, text: "Несовершенный вид. Совершенный — ZAREKLAMOWAĆ, и он тоже в обоих значениях: zareklamować produkt, «прорекламировать»; zareklamować buty, «вернуть с претензией». В разговоре о претензии часто говорят описательно: złożyć reklamację, oddać do reklamacji, «сдать по претензии». Причастие REKLAMOWANY значит и «рекламируемый» (reklamowany film), и «сданный по претензии» (reklamowany telefon wrócił z serwisu) — различает только контекст." }
  - { kind: pronunciation, text: "«рэкламо́ваць», ударение на предпоследнем слоге, -mo-. RE — твёрдое «рэ», без смягчения. В настоящем времени -owa- сменяется на -uj-: reklamuję, reklamujesz — «рэкламу́е», «рэкламу́еш»." }
collocations:
  - { pl: "reklamować w telewizji", ru: "рекламировать по телевизору" }
