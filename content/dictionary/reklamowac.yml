  - id: complain
    ru: "предъявлять претензию к товару, сдавать по гарантии (требовать ремонта, замены или возврата денег)"
    examples:
      - pl: "Chcę reklamować te buty, bo odkleiła się podeszwa."
        ru: "Я хочу сдать эти туфли по гарантии: отклеилась подошва."
