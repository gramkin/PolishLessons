family:
  - { pl: "reklama", ru: "реклама", relation: root, id: reklama }
  - { pl: "zareklamować", ru: "прорекламировать; вернуть с претензией", relation: aspect }
  - { pl: "reklamacja", ru: "претензия, рекламация", relation: derived }
  - { pl: "reklamowy", ru: "рекламный", relation: derived }
etymology: "Из французского RÉCLAMER, «требовать, взывать, протестовать», от латинского RECLAMARE, «громко возражать» (RE- + CLAMARE, «кричать»). Оба польских значения выросли из него: «требовать» своего у продавца — и «выкрикивать», зазывая покупателей. Русский взял только второе."
memory: "Re-CLAMARE — «кричать в ответ». Покупатель кричит в ответ продавцу — reklamuje buty; продавец кричит покупателям — reklamuje buty. Одно слово на две стороны прилавка."
