        source: { kind: authored }
      - pl: "Ewangelie są częścią Nowego Testamentu."
        ru: "Евангелия входят в Новый Завет."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "TESTAMENT — прежде всего «завещание»: SPISAĆ TESTAMENT, «составить завещание». Библейский «Завет» — тоже TESTAMENT: STARY и NOWY TESTAMENT. «Наследство» — SPADEK." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Родительный — TESTAMENTU, в местном T переходит в C: W TESTAMENCIE." }
  - { kind: government, text: "Завещать что-то кому-то — ZAPISAĆ COŚ KOMUŚ W TESTAMENCIE. Составить завещание — SPISAĆ TESTAMENT. Завещание в пользу кого-то — TESTAMENT NA RZECZ, и родительный." }
  - { kind: pronunciation, text: "Читается «тэста́мэнт», ударение на предпоследнем слоге. TE и ME твёрдые." }
collocations:
  - { pl: "spisać testament", ru: "составить завещание" }
  - { pl: "zapisać w testamencie", ru: "завещать" }
  - { pl: "Nowy Testament", ru: "Новый Завет" }
family:
  - { pl: "testamentowy", ru: "завещательный", relation: derived }
  - { pl: "Stary Testament", ru: "Ветхий Завет", relation: derived }
  - { pl: "Nowy Testament", ru: "Новый Завет", relation: derived }
etymology: "Из латинского слова «завещание», от «свидетель»: завещание делается при свидетелях. Через церковную латынь то же слово стало названием Завета."
memory: "Testament — завещание и Завет. Читается «тэста́мэнт». Spisać testament — составить завещание. Spadek — наследство."
idioms:
  - { pl: "ostatnia wola", ru: "последняя воля" }
formExamplesSkip:
