# review
id: rozegrac
format: 2
lemma: "rozegrać"
rank: 5127
pos: verb
pron: { cyr: "розэ́граць" }
senses:
  - id: play-match
    ru: "сыграть, провести (матч, партию, турнир)"
    examples:
      - pl: "Drużyna rozegrała najlepszy mecz sezonu."
        ru: "Команда провела лучший матч сезона."
        source: { kind: authored }
      - pl: "Rozegram z tobą partię szachów."
        ru: "Я сыграю с тобой партию в шахматы."
        source: { kind: authored }
      - pl: "Finał rozegrają w Warszawie."
        ru: "Финал проведут в Варшаве."
        source: { kind: authored }
  - id: handle
    ru: "провернуть, разыграть (дело, ситуацию)"
    examples:
      - pl: "Rozegrał tę sprawę po mistrzowsku."
        ru: "Он мастерски провернул это дело."
        source: { kind: authored }
      - pl: "Trzeba to rozegrać sprytnie."
        ru: "Это надо разыграть хитро."
        source: { kind: authored }
  - id: take-place
    ru: "с SIĘ — произойти, разыграться"
    examples:
      - pl: "Tragedia rozegrała się w nocy."
        ru: "Трагедия разыгралась ночью."
        source: { kind: authored }
      - pl: "Wszystko rozegrało się w ciągu minuty."
        ru: "Всё произошло за минуту."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ROZEGRAĆ — «провести, сыграть (матч)», а не «разыграть» шутку. «Разыграть кого-то» — ZROBIĆ KOMUŚ KAWAŁ или NABRAĆ KOGOŚ. «Разыграть приз» — ROZLOSOWAĆ. Совпадает с русским только ROZEGRAĆ SIĘ «разыграться (о событиях)»." }
  - { kind: usage, text: "Пятьдесят две формы: страдательное ROZEGRANY — о матчах и партиях; форма для мужчин-людей ROZEGRANI в карточку не включена. Спряжение как у GRAĆ: ROZEGRAM, ROZEGRASZ. Несовершенный вид — ROZGRYWAĆ, отсюда ROZGRYWKA «игра, матч»." }
  - { kind: government, text: "Что — винительный: ROZEGRAĆ MECZ, PARTIĘ. С кем — Z с творительным: ROZEGRAĆ MECZ Z LIDEREM. Где — W или NA с предложным: NA STADIONIE. С SIĘ — где и когда: AKCJA ROZGRYWA SIĘ W PARYŻU." }
  - { kind: pronunciation, text: "Читается «розэ́граць», ударение на предпоследнем слоге. ROZEGRAM — «розэ́грам». Z перед E звонкое: «розэ», не «росэ»." }
  - { kind: register, text: "В спорте — нейтральное и очень частое. ROZEGRAĆ COŚ SPRYTNIE, PO SWOJEMU — разговорное «провернуть». AKCJA ROZEGRAŁA SIĘ — газетное и книжное «события развернулись»." }
collocations:
  - { pl: "rozegrać mecz", ru: "провести матч" }
  - { pl: "rozegrać partię szachów", ru: "сыграть партию в шахматы" }
  - { pl: "akcja rozgrywa się", ru: "действие происходит" }
family:
  - { pl: "grać", ru: "играть", relation: root, id: grac }
  - { pl: "zagrać", ru: "сыграть", relation: derived, id: zagrac }
  - { pl: "rozgrywka", ru: "игра, матч; розыгрыш", relation: derived }
etymology: "Приставка ROZ- «раз-» плюс GRAĆ «играть», праславянское *jьgrati. Русское «разыграть» — то же строение, но русское значение «подшутить» в польском отсутствует."
memory: "Rozegrać mecz — провести матч. Rozegrać sprawę — провернуть дело. Rozegrać się — разыграться, произойти. Читается «розэ́граць»."
idioms:
  - { pl: "rozegrać coś po mistrzowsku", ru: "провернуть что-то мастерски" }
formExamplesSkip:
  - { form: "rozegrani", reason: "людей не «разыгрывают»: формы для мужчин-людей нет" }
