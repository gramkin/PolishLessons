notes:
  - { kind: false-friend, text: "КОРЕНЬ НЕ «ГРУЗ», А «ЛАД». Ładunek от ładować «грузить», а то — от ład «ПОРЯДОК», того же слова, что русский «лад». Грузить значило укладывать по порядку. Русское «груз» и «грузить» — совсем другой корень, так что сходства искать не надо; зато ład узнаётся сразу: ład i porządek «лад и порядок»." }
  - { kind: pronunciation, text: "БЕГЛОЕ E ВЫПАДАЕТ ВО ВСЕХ КОСВЕННЫХ ПАДЕЖАХ: ŁADUNEK, НО ŁADUNKU. Так ведёт себя весь суффикс -ek: dodatek — dodatku, pierścionek — pierścionka, worek — worka. Ł читается как краткое у: «уаду́нэк»." }
  - { kind: usage, text: "Три значения делят одно слово: груз в кузове, заряд в физике и заряд взрывчатки. Переносно говорят ładunek emocjonalny «эмоциональный заряд». Глагол ładować значит и «грузить», и «заряжать»: ładować ciężarówkę, ładować telefon. Разгрузить — rozładować." }
collocations:
  - { pl: "ładunek wybuchowy", ru: "взрывное устройство" }
  - { pl: "ładunek elektryczny", ru: "электрический заряд" }
  - { pl: "przewozić ładunek", ru: "перевозить груз" }
family:
  - { pl: "ładować", ru: "грузить; заряжать", relation: root }
  - { pl: "ład", ru: "лад, порядок", relation: root }
  - { pl: "rozładować", ru: "разгрузить, разрядить", relation: antonym }
etymology: "От ładować «грузить», от ład «порядок, строй» — того же слова, что русский «лад», и родственного «ладить», «наладить», «ладный». Грузить означало складывать в порядке. Отсюда ładunek, ładowarka «зарядное устройство», rozładunek и wyładować."
memory: "ładunek — «груз» и «заряд» разом, от ładować «грузить, заряжать», а корень тут ład — русский «ЛАД», порядок. Беглое e выпадает: ładunku, ładunkiem. И телефон поляк тоже ładuje."
idioms:
