# review
id: astronauta
format: 2
lemma: "astronauta"
rank: 5229
pos: noun
pron: { cyr: "астрона́ута" }
senses:
  - id: astronaut
    ru: "астронавт, космонавт"
    examples:
      - pl: "Astronauta poleciał na Międzynarodową Stację Kosmiczną."
        ru: "Астронавт полетел на Международную космическую станцию."
        source: { kind: authored }
      - pl: "Mój syn chce zostać astronautą."
        ru: "Мой сын хочет стать космонавтом."
        source: { kind: authored }
      - pl: "Astronauci spędzili pół roku w kosmosie."
        ru: "Астронавты провели полгода в космосе."
        source: { kind: authored }
  - id: play
    ru: "космонавт (в играх, мечтах)"
    examples:
      - pl: "Dzieci bawiły się w astronautów."
        ru: "Дети играли в космонавтов."
        source: { kind: authored }
      - pl: "Kostium astronauty wygrał konkurs."
        ru: "Костюм космонавта победил в конкурсе."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ASTRONAUTA — «астронавт», с AU. Советских и российских космонавтов называют KOSMONAUTA. Первый поляк в космосе, Мирослав Гермашевский, — KOSMONAUTA. Слово мужского рода, хотя оканчивается на -A." }
  - { kind: usage, text: "Мужской род, лицо, склоняется как существительные на -A: ASTRONAUTA, ASTRONAUTY, ASTRONAUCIE. Множественное — ASTRONAUCI. Звательный ASTRONAUTO не учим." }
  - { kind: government, text: "Стать астронавтом — ZOSTAĆ ASTRONAUTĄ, творительный. Скафандр астронавта — SKAFANDER ASTRONAUTY. Об астронавте — O ASTRONAUCIE." }
  - { kind: pronunciation, text: "Читается «астрона́ута»: AU — дифтонг, ударение на нём. ASTRONAUCI — «астрона́уци», ASTRONAUCIE — «астрона́уце»." }
collocations:
  - { pl: "zostać astronautą", ru: "стать космонавтом" }
  - { pl: "skafander astronauty", ru: "скафандр астронавта" }
  - { pl: "lot astronautów", ru: "полёт астронавтов" }
family:
  - { pl: "kosmonauta", ru: "космонавт", relation: root }
  - { pl: "kosmos", ru: "космос", relation: root, id: kosmos }
  - { pl: "rakieta", ru: "ракета", relation: root, id: rakieta }
etymology: "Из греческого ASTRON «звезда» и NAUTĒS «мореплаватель»: «звёздный мореход». Русское «астронавт» — то же слово."
memory: "Astronauta — астронавт; российский — kosmonauta. Astronauci — астронавты. Zostać astronautą — стать космонавтом. Читается «астрона́ута»."
idioms:
  - { pl: "spacer kosmiczny", ru: "выход в открытый космос" }
formExamplesSkip:
