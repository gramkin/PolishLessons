# review
id: zastapic
format: 2
lemma: "zastąpić"
rank: 2321
pos: verb
pron: { cyr: "засто́мпиць" }
senses:
  - id: replace
    ru: "заменить, заместить"
    examples:
      - pl: "Zastąpił chorego kolegę na dyżurze."
        ru: "Он заменил больного коллегу на дежурстве."
        source: { kind: authored }
      - pl: "Masło zastąpiono olejem."
        ru: "Масло заменили маслом растительным."
        source: { kind: authored }
  - id: substitute-for
    ru: "заменить собой, стать вместо"
    examples:
      - pl: "Nic nie zastąpi rozmowy twarzą w twarz."
        ru: "Ничто не заменит разговора лицом к лицу."
        source: { kind: authored }
      - pl: "Babcia zastąpiła im matkę."
        ru: "Бабушка заменила им мать."
        source: { kind: authored }
  - id: block-the-way
    ru: "zastąpić drogę — преградить путь"
    examples:
      - pl: "Zastąpił jej drogę w bramie."
        ru: "Он преградил ей дорогу в воротах."
        source: { kind: authored }
notes:
  - { kind: government, text: "ЗАМЕНЯЮТ КОГО — ВИНИТЕЛЬНЫЙ, А ЧЕМ — ТВОРИТЕЛЬНЫЙ. Zastąpić kogoś, zastąpić coś: zastąpił dyrektora. Чем именно — творительный: zastąpić cukier miodem «заменить сахар мёдом». Третье значение строится иначе: zastąpić KOMUŚ drogę, с дательным лица и винительным дороги — «преградить кому-л. путь»." }
  - { kind: false-friend, text: "КОРЕНЬ ТОТ ЖЕ, ЧТО В РУССКОМ «СТУПИТЬ», НО СЛОВА РАЗОШЛИСЬ. Za- плюс stąpić «ступить»: заменить значило заступить на чужое место. Русское «заступить» существует, но значит «начать смену» или «вступиться», а не «заменить». Польское носовое ą отвечает русскому «у»: stąpać — «ступать», постоянное соответствие." }
  - { kind: pronunciation, text: "Три слога, ударение на предпоследнем: za-STĄ-pić. Носовое ą перед p звучит как «ом»: «засто́мпиць». В страдательном причастии и в отглагольном существительном p смягчается в pi: zastąpiony, zastąpienie — «застомпё́ны», «застомпе́не»." }
  - { kind: usage, text: "Вид совершенный, несовершенная пара — zastępować. Отсюда деепричастие zastąpiwszy и отсутствие причастия настоящего времени. Существительные: zastępstwo «замена, замещение» (mieć zastępstwo «вести урок за другого»), zastępca «заместитель». Мужско-личное причастие zastąpieni вполне обычно: заменяют и людей тоже." }
collocations:
  - { pl: "zastąpić kogoś", ru: "заменить кого-л." }
  - { pl: "nic tego nie zastąpi", ru: "ничто этого не заменит" }
  - { pl: "zastąpić komuś drogę", ru: "преградить кому-л. путь" }
family:
  - { pl: "zastępować", ru: "заменять", relation: aspect }
  - { pl: "zastępca", ru: "заместитель", relation: derived }
  - { pl: "stąpać", ru: "ступать", relation: root }
  - { pl: "zastępstwo", ru: "замена, замещение", relation: derived }
etymology: "Приставка za- плюс stąpić «ступить», из праславянского *stǫpiti — того же слова, что русское «ступить». Заменить значило заступить на место другого. Носовое ǫ дало в польском ą, а в русском у: stąpać против «ступать», постęp против «поступь». Отсюда zastępca, zastępstwo, następca «преемник» и ustąpić «уступить»."
memory: "zastąpić — «заменить», буквально «заступить на место»: za- плюс stąpić «ступить». Заменяют КОГО винительным, а ЧЕМ творительным: zastąpić cukier miodem. И отдельный оборот: zastąpić komuś drogę «преградить путь»."
idioms:
  - { pl: "nic tego nie zastąpi", ru: "ничто этого не заменит" }
  - { pl: "zastąpić komuś drogę", ru: "преградить кому-л. дорогу" }
