notes:
  - { kind: false-friend, text: "СЛОВО СОБРАНО ПОЧТИ КАК РУССКОЕ, ДЕТАЛЬ В ДЕТАЛЬ. Roz- плюс czar плюс -ować отвечает русскому раз-о-чар-овать: czar — это «чары», czarować — «очаровывать», czarodziej — «волшебник». Разница только в том, что польский обошёлся без вставного -o-: rozczarować, а не rozoczarować. Значение совпадает полностью." }
  - { kind: government, text: "УПРАВЛЕНИЕ ВОЗВРАТНОЙ ФОРМЫ РАСХОДИТСЯ. ROZCZAROWAĆ SIĘ требует творительного падежа — rozczarowałem się tym filmem — или оборота DO kogoś: rozczarować się do kogoś. Русский говорит «разочароваться В чём-то», с предлогом в и предложным падежом. Дословный перевод с русского даёт ошибку, так что оборот надо брать целиком." }
  - { kind: usage, text: "Основа настоящего времени идёт на -uj-, как у всех глаголов на -ować: ROZCZARUJĘ, rozczarujesz, rozczaruje, rozczarują. Вид совершенный: есть ROZCZAROWAWSZY, форм на -ąc и -ący нет, несовершенная пара — rozczarowywać. Существительное ROZCZAROWANIE значит «разочарование»." }
collocations:
  - { pl: "rozczarować się czymś", ru: "разочароваться в чём-л." }
  - { pl: "gorzkie rozczarowanie", ru: "горькое разочарование" }
  - { pl: "nie rozczarować nikogo", ru: "никого не разочаровать" }
family:
  - { pl: "rozczarowywać", ru: "разочаровывать (несов.)", relation: aspect }
  - { pl: "czarować", ru: "очаровывать, колдовать", relation: root }
  - { pl: "zachwycić", ru: "восхитить", relation: antonym }
etymology: "Приставка roz- и czarować «очаровывать», от czar «чары», из праславянского *čarъ — того же, что русские «чары», «чародей» и «очаровать». Разочарование понималось как снятие чар. Русское «разочаровать» собрано из тех же частей, только со вставным -o-."
memory: "rozczarować — «разочаровать», и собрано почти как русское: roz плюс czar «чары» плюс -ować, без вставного -o-. Но падеж другой: rozczarować się CZYMŚ, творительным, а не «в чём-то». Основа настоящего на -uj-: rozczaruję."
idioms:
  - { pl: "gorzkie rozczarowanie", ru: "горькое разочарование" }
  - { pl: "nie rozczarować oczekiwań", ru: "не обмануть ожиданий" }
