etymology: "Из na + tych + miast, старой формы от miasto в значении «место» — буквально «на том же месте», как русское «тотчас» из «тот час»."
memory: "natychmiast — «немедленно», и это самое сильное слово в своём ряду: zaraz значит «сейчас, вскоре», od razu — «сразу», а natychmiast не терпит отлагательства. Отдельной репликой Natychmiast! звучит как приказ. Собрано оно из na + tych + miast «на том же месте» — тем же способом, что русское «тотчас» из «тот час». Прилагательное — natychmiastowy."
