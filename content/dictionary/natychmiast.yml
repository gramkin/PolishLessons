      - pl: "Wyruszaj natychmiast."
        ru: "Отправляйся немедленно."
        source: { kind: translated, id: 367181 }
      - pl: "Zaczynajmy natychmiast."
        ru: "Начнём немедленно."
        source: { kind: translated, id: 603015 }
  - id: command
    ru: "Natychmiast! — Немедленно! (как приказ)"
    note: "Самостоятельная реплика, звучит резко."
    examples:
      - pl: "Natychmiast!"
        ru: "Немедленно!"
        source: { kind: translated, id: 11261133 }
      - pl: "Wracaj natychmiast!"
        ru: "Возвращайся немедленно!"
        source: { kind: authored }
