        ru: "Прекрати немедленно."
        source: { kind: authored }
notes:
  - { kind: usage, text: "natychmiast сильнее, чем zaraz «сейчас, вскоре»: zaraz przyjdę «сейчас приду», но przyjdź natychmiast «приходи немедленно»." }
  - { kind: usage, text: "Отдельной репликой Natychmiast! звучит как приказ." }
  - { kind: usage, text: "Прилагательное — natychmiastowy «немедленный»: natychmiastowa reakcja «немедленная реакция»." }
  - { kind: usage, text: "Синонимы разной силы: zaraz «сейчас», od razu «сразу», natychmiast «немедленно»." }
