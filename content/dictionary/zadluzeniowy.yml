notes:
  - { kind: usage, text: "Относительное прилагательное: оно не говорит о качестве, а только относит предмет к долгам, поэтому степеней сравнения у него нет. Живёт в экономических текстах и в прессе, в нескольких устойчивых сочетаниях: KRYZYS ZADŁUŻENIOWY «долговой кризис», SPIRALA ZADŁUŻENIOWA «долговая спираль», PUŁAPKA ZADŁUŻENIOWA «долговая ловушка». В бытовой речи чаще говорят описательно: PROBLEMY Z DŁUGAMI «проблемы с долгами»." }
  - { kind: usage, text: "Русскому «долговой» соответствует не только ZADŁUŻENIOWY. Прилагательное от самого слова DŁUG «долг» тоже есть, DŁUŻNY (BYĆ DŁUŻNYM «быть должным»), а «долговая расписка» по-польски SKRYPT DŁUŻNY или WEKSEL. ZADŁUŻENIOWY образовано от ZADŁUŻENIE «задолженность» и всегда значит «связанный с накопленными долгами»." }
  - { kind: pronunciation, text: "Читается «задужэньо́вы», пять слогов, ударение на предпоследнем. Ł звучит как «у», поэтому DŁU сливается в «ду»; Ż твёрдое, «жэ», а NIO даёт мягкое «ньо». Русское «долг» узнаётся в корне, если помнить соответствие польского Ł русскому Л." }
collocations:
  - { pl: "kryzys zadłużeniowy", ru: "долговой кризис" }
  - { pl: "spirala zadłużeniowa", ru: "долговая спираль" }
  - { pl: "pułapka zadłużeniowa", ru: "долговая ловушка" }
family:
  - { pl: "dług", ru: "долг", relation: root, id: dlug }
  - { pl: "zadłużenie", ru: "задолженность", relation: derived }
  - { pl: "zadłużyć się", ru: "влезть в долги", relation: root }
  - { pl: "zadłużony", ru: "задолжавший, обременённый долгами", relation: root }
etymology: "Образовано суффиксом -OWY от ZADŁUŻENIE «задолженность», а то от ZADŁUŻYĆ SIĘ «влезть в долги», в основе которого DŁUG «долг», того же корня, что русское «долг»."
memory: "Zadłużeniowy — долговой: kryzys zadłużeniowy, spirala zadłużeniowa. В середине прячется dług «долг», Ł читается как «у»: «задужэньо́вы»."
idioms:
  - { pl: "spirala zadłużeniowa", ru: "долговая спираль, когда новые долги берут, чтобы платить по старым" }
formExamplesSkip:
