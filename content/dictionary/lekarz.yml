# review
id: lekarz
format: 2
lemma: "lekarz"
rank: 442
pos: noun
pron: { cyr: "ле́каш" }
senses:
  - id: doctor
    ru: "врач"
    examples:
      - pl: "Jestem lekarzem."
        ru: "Я врач."
        source: { kind: tatoeba, id: 361231 }
      - pl: "Idę do lekarza."
        ru: "Я иду к врачу."
        source: { kind: tatoeba, id: 453427 }
      - pl: "Moja żona jest lekarzem."
        ru: "Моя жена — врач."
        source: { kind: tatoeba, id: 675374 }
  - id: doctors
    ru: "врачи (о профессии в целом)"
    examples:
      - pl: "Lekarze walczą z chorobą."
        ru: "Врачи борются с болезнью."
        source: { kind: translated, id: 513457 }
      - pl: "Tom boi się lekarzy."
        ru: "Том боится врачей."
        source: { kind: translated, id: 7224718 }
      - pl: "Oni są lekarzami."
        ru: "Они врачи."
        source: { kind: translated, id: 4668568 }
notes:
  - { kind: usage, text: "Профессия в сказуемом ставится в творительном падеже: Jestem lekarzem «Я врач», Moja żona jest lekarzem. Именительный здесь был бы ошибкой." }
  - { kind: usage, text: "iść do lekarza — «идти к врачу», с предлогом do и родительным падежом." }
  - { kind: usage, text: "Женский вариант — lekarka; в обращении к женщине-врачу говорят pani doktor." }
  - { kind: false-friend, text: "Русское «лекарь» — то же самое слово (от lek «лекарство»), но в польском оно осталось повседневным, а в русском устарело и вытеснено «врачом»." }
collocations:
  - { pl: "iść do lekarza", ru: "идти к врачу" }
  - { pl: "lekarz rodzinny", ru: "семейный врач" }
  - { pl: "jestem lekarzem", ru: "я врач" }
  - { pl: "lekarz prowadzący", ru: "лечащий врач" }
etymology: "Праславянское *lěkarjь, от *lěkъ «лекарство». Русское «лекарь» — то же самое слово, но у поляков оно осталось повседневным, а в русском устарело."
memory: "lekarz — «врач», и русское «лекарь» это ровно то же слово, только у нас оно ушло в старину. Помните про творительный падеж в сказуемом: Jestem lekarzem, а не «jestem lekarz»."
idioms:
  - { pl: "lekarzu, ulecz się sam", ru: "врачу, исцелися сам" }
  - { pl: "lekarz rodzinny", ru: "семейный врач" }
  - { pl: "co człowiek – to lekarz", ru: "что ни человек, то лекарь" }
formExamplesSkip:
  - { form: "lekarzów", reason: "устаревший вариант родительного падежа множественного числа; нормативная форма — lekarzy, и в корпусе lekarzów не встречается" }
