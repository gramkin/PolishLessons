# review
id: glab
format: 2
lemma: "głąb"
rank: 2025
pos: noun
pron: { cyr: "гуонп" }
senses:
  - id: depth
    ru: "глубина (пространства)"
    examples:
      - pl: "W głębi korytarza wybuchł pożar."
        ru: "В глубине коридора вспыхнул пожар."
        source: { kind: translated, id: 367764 }
      - pl: "Mieszka sam w głębi lasu."
        ru: "Он живёт один в глубине леса."
        source: { kind: translated, id: 12229109 }
      - pl: "W głębi serca to dobry człowiek."
        ru: "В глубине души он хороший человек."
        source: { kind: translated, id: 696475 }
  - id: inner
    ru: "глубина (внутренняя, о чувствах)"
    examples:
      - pl: "W głębi duszy się zgadzam."
        ru: "В глубине души я согласен."
        source: { kind: authored }
      - pl: "Ciszę przerwał głos z głębi domu."
        ru: "Тишину нарушил голос из глубины дома."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "В польском два разных слова głąb. Женское głąb «глубина» (родительный głębi) — о нём эта карточка. Мужское głąb «кочерыжка; болван» (родительный głąba) — совсем другое слово со своей парадигмой." }
  - { kind: government, text: "Главный оборот — w głębi + родительный: w głębi lasu «в глубине леса», w głębi serca «в глубине души»." }
  - { kind: usage, text: "Рядом стоят głęboki «глубокий», głębia «глубина», pogłębiać «углублять»." }
  - { kind: usage, text: "В обороте w głębi duszy/serca слово значит не физическую глубину, а «в душе, внутренне»." }
collocations:
  - { pl: "w głębi duszy", ru: "в глубине души" }
  - { pl: "w głębi lasu", ru: "в глубине леса" }
etymology: "Праславянское *glǫbь «глубина»; прямо соответствует русским «глубь», «глубина», «глубокий»."
memory: "głąb «глубина» — это русское «глубь». Держите в голове оборот w głębi serca «в глубине души» и не путайте с мужским омонимом głąb «кочерыжка, болван» (родительный głąba)."
