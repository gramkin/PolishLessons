etymology: "Из английского HAMBURGER, «гамбургский» — по городу Гамбургу, откуда в Америку привезли котлету HAMBURG STEAK. Немецкое H польский сохранил."
memory: "Hamburger — гамбургер, с h: «хамбу́ргэр». Zjeść hamburgera — съесть гамбургер. Часто просто burger."
