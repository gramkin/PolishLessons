notes:
  - { kind: false-friend, text: "HAMBURGER — «гамбургер», но с H, а не Г: польское H на месте русского Г в заимствованиях — HAMBURG, «Гамбург». В разговоре часто BURGER, с той же формой: ZJEŚĆ BURGERA." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. В разговоре винительный совпадает с родительным: ZJEŚĆ HAMBURGERA, как ZJEŚĆ BANANA. В местном R переходит в RZ: W HAMBURGERZE." }
  - { kind: government, text: "Гамбургер с чем — HAMBURGER Z и творительный: HAMBURGER Z SEREM, «чизбургер». Съесть гамбургер — ZJEŚĆ HAMBURGERA, винительный." }
  - { kind: pronunciation, text: "Читается «хамбу́ргэр»: H — «х», ударение на предпоследнем слоге. GE — твёрдое «гэ». HAMBURGERZE — «хамбургэ́жэ»." }
