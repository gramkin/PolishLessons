# review
id: cepelia
format: 2
lemma: "cepelia"
rank: 5880
pos: noun
pron: { cyr: "цэпэ́лья" }
senses:
  - id: shop
    ru: "магазин народных промыслов «Цепелия»"
    examples:
      - { pl: "Kupiłam w cepelii drewnianą szkatułkę.", ru: "Я купила в «Цепелии» деревянную шкатулку.", source: { kind: authored } }
      - { pl: "W cepelii sprzedają ręcznie malowane pisanki.", ru: "В «Цепелии» продают расписанные вручную пасхальные яйца.", source: { kind: authored } }
      - { pl: "Cepelia przy rynku jest już zamknięta.", ru: "«Цепелия» на площади уже закрыта.", source: { kind: authored } }
  - id: kitsch
    ru: "псевдонародный кич, фольклор напоказ"
    note: "пренебр."
    examples:
      - { pl: "Ten festyn to czysta cepelia.", ru: "Этот праздник — сплошной лубок.", source: { kind: authored } }
      - { pl: "Reżyser pokazał wieś bez cepelii i lukru.", ru: "Режиссёр показал деревню без лубка и глянца.", source: { kind: authored } }
notes:
  - { kind: usage, text: "CEPELIA (с большой буквы) — польская сеть кооперативов и магазинов народных промыслов, известная со времён ПНР: вышивки, резьба, вырезанки, керамика. С маленькой буквы — сам магазин или, иронично, всё «народное» напоказ." }
  - { kind: register, text: "В переносном смысле слово пренебрежительное: CEPELIA, RODEM Z CEPELII — фольклор, сделанный для туристов, лубок. Близкое по смыслу CEPELIADA — пышное псевдонародное зрелище." }
  - { kind: usage, text: "Женский род на -IA: родительный, дательный и предложный — CEPELII (два I). Звательный CEPELIO не употребляется." }
collocations:
  - { pl: "kupić w cepelii", ru: "купить в «Цепелии»" }
  - { pl: "wyroby z cepelii", ru: "изделия из «Цепелии»" }
  - { pl: "folklor rodem z cepelii", ru: "фольклор как из сувенирной лавки" }
family:
  - { pl: "cepeliowy", ru: "лубочный, псевдонародный", relation: derived }
  - { pl: "cepeliada", ru: "псевдонародное зрелище", relation: derived }
  - { pl: "sklep", ru: "магазин", relation: root, id: sklep }
  - { pl: "pamiątka", ru: "сувенир", relation: root, id: pamiatka }
etymology: "Из названия CEPELIA — так читается сокращение CPLiA (Centrala Przemysłu Ludowego i Artystycznego, «Центр народных и художественных промыслов»)."
memory: "Cepelia — это «це-пе-эль-и-а», CPLiA: магазин народных промыслов, а в иронии — фольклор на продажу."
idioms:
  - { pl: "rodem z cepelii", ru: "лубочный, как из сувенирной лавки" }
