etymology: "Из средневековой латыни mancamentum «недостаток», от mancare «недоставать» и mancus «увечный, неполноценный». Из того же источника итальянское mancare, французское manquer и русское «манкировать» — «пренебрегать, не исполнять»."
memory: "MANKAMENT — то, чего «недостаёт», как в «манкировать». Jedyny mankament — единственный недочёт."
idioms:
  - { pl: "jedyny mankament", ru: "единственный недостаток (оговорка в похвале)" }
