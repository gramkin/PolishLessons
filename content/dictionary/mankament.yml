        ru: "Механик быстро устранил неисправность."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Русскому не подсказывает ничего, кроме «манкировать» — «пренебрегать»: тот же латинский корень «недостающий». MANKAMENT — не провал и не порок, а именно недочёт: мягче, чем WADA, и почти всегда о вещах, планах, текстах. О человеке — WADA." }
  - { kind: usage, text: "Мужской род, неодушевлённый: родительный MANKAMENTU, местный и звательный MANKAMENCIE — T смягчается в CI. Типичные определения: DROBNY, JEDYNY, POWAŻNY MANKAMENT. С чем-то — Z с творительным: MANKAMENT Z HAMULCAMI." }
  - { kind: pronunciation, text: "«манка́мэнт», ударение на предпоследнем слоге. MANKAMENCIE — «манкаме́ньце»: ударение остаётся на предпоследнем слоге, NCI — «ньц»." }
  - { kind: register, text: "Слово книжное и несколько официальное: отзывы, рецензии, технические отчёты, объявления о продаже. В разговоре проще MINUS или WADA: JEDYNY MINUS TO CENA." }
