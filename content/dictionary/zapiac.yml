notes:
  - { kind: false-friend, text: "ZAPIĄĆ — «застегнуть», и русскому «запять» соответствия нет. Корень тот же, что в русском «распять» и «пялить»: PIĄĆ — «натягивать». ZAPIĄĆ PASY — «пристегнуться», ODPIĄĆ — «расстегнуть». ZAPIĘCIE — «застёжка»." }
  - { kind: usage, text: "Пятьдесят три формы — подпись переходного глагола совершенного вида: страдательное ZAPIĘTY и деепричастие ZAPIĄWSZY. Спряжение нерегулярное: ZAPNĘ, ZAPNIESZ, ZAPNĄ; повелительное ZAPNIJ; прошедшее ZAPIĄŁ, ZAPIĘŁA. Видовой партнёр — ZAPINAĆ." }
  - { kind: government, text: "Что — винительный: ZAPIĄĆ GUZIK, PASY, ZAMEK. Кому — дательный: ZAPIĄĆ DZIECKU KURTKĘ. Возвратное ZAPIĄĆ SIĘ — «застегнуться»: ZAPNIJ SIĘ, «застегнись». На что — NA: ZAPIĄĆ NA ZAMEK, NA GUZIKI." }
  - { kind: pronunciation, text: "Читается «за́пёнць», два слога, ударение на первом. PIĄ — «пён»: IA перед носовым даёт «ё», Ą перед Ć — «он». ZAPNĘ — «за́пнэ», ZAPIĘŁA — «запье́уа», с мягким P." }
  - { kind: register, text: "Нейтральное бытовое слово: одежда, ремни, сумки. ZAPNIJCIE PASY — стандартная фраза в самолёте и машине. ZAPIĄĆ NA OSTATNI GUZIK — «подготовить до мелочей», разговорное." }
collocations:
  - { pl: "zapiąć pasy", ru: "пристегнуть ремни" }
  - { pl: "zapiąć kurtkę", ru: "застегнуть куртку" }
  - { pl: "zapięte na ostatni guzik", ru: "подготовлено до мелочей" }
family:
  - { pl: "zapinać", ru: "застёгивать", relation: aspect }
  - { pl: "odpiąć", ru: "расстегнуть", relation: antonym }
  - { pl: "zapięcie", ru: "застёжка", relation: derived }
etymology: "Приставка ZA- плюс старый глагол PIĄĆ «натягивать», праславянское *pęti, тот же корень, что в русском «распять», «пялить», «запятая». Застегнуть — «натянуть и закрепить»."
memory: "Zapiąć — застегнуть: zapnij kurtkę, zapnijcie pasy. Odpiąć — расстегнуть. Zapnę, zapiął — нерегулярно. Zapięte na ostatni guzik — готово до мелочей. Читается «за́пёнць»."
idioms:
  - { pl: "zapiąć coś na ostatni guzik", ru: "подготовить что-то до последней мелочи" }
