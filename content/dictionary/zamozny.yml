notes:
  - { kind: usage, text: "ZAMOŻNY говорят только об имуществе и достатке: о людях, семьях, странах, районах. Это слово чуть официальнее, чем BOGATY, и ближе к русскому «состоятельный», «зажиточный». У BOGATY есть и переносный смысл — BOGATY W WITAMINY «богатый витаминами», BOGATE DOŚWIADCZENIE «богатый опыт», — а ZAMOŻNY так не употребляется. В разговоре о богатых людях звучат и жаргонные DZIANY, NADZIANY «при деньгах»." }
  - { kind: pronunciation, text: "Читается «замо́жны»: Ż — твёрдое «ж», конечное Y — «ы», ударение на предпоследнем слоге. В сравнительной степени появляется мягкое «нь»: ZAMOŻNIEJSZY — «заможне́йшы», NAJZAMOŻNIEJSZY — «найзаможне́йшы». Мужско-личное множественное ZAMOŻNI — «замо́жни», с мягким «ни»." }
  - { kind: false-friend, text: "Русскому глазу слово кажется странным: «за-можный» словно связано с «можно». Связь и правда есть, но через силу, а не через разрешение: MOŻNY по-польски «могущественный, знатный», и MOŻNI TEGO ŚWIATA значит «сильные мира сего». ZAMOŻNY — тот, у кого есть средства, то есть «возможности». Украинское «заможний» — то же слово и в том же значении." }
  - { kind: usage, text: "Степени образуются регулярно, через -IEJSZY и NAJ-: ZAMOŻNY, ZAMOŻNIEJSZY, NAJZAMOŻNIEJSZY. Тридцать три формы — это одиннадцать клеток в трёх степенях. Сравнительная степень часто значит не «более богатый», а «побогаче, позажиточнее»: ZAMOŻNIEJSI ROLNICY — «крестьяне позажиточнее»." }
