etymology: "Образовано от MOŻNY «могущественный; имеющий средства» с приставкой ZA-. MOŻNY восходит к тому же корню, что MÓC «мочь», и родственно русским «мощь», «можно», «вельможа»."
memory: "MÓC — «мочь», MOŻNY — «могущественный», ZAMOŻNY — «тот, кто может себе позволить», то есть состоятельный. Украинское «заможний» звучит так же. Степени: ZAMOŻNY, ZAMOŻNIEJSZY, NAJZAMOŻNIEJSZY."
