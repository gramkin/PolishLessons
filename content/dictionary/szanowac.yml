senses:
  - id: respect
    ru: "уважать (кого-л., чьё-л. мнение)"
    examples:
      - pl: "Szanuję jego zdanie, choć się nie zgadzam."
        ru: "Я уважаю его мнение, хотя не согласен."
        source: { kind: authored }
      - pl: "Szanował ojca do końca życia."
        ru: "Он уважал отца до конца жизни."
        source: { kind: authored }
      - pl: "Szanowani nauczyciele zostali w szkole."
        ru: "Уважаемые учителя остались в школе."
        source: { kind: authored }
  - id: take-care
    ru: "берегать, не портить (вещи, здоровье, время)"
    examples:
      - pl: "Szanuj buty, to nie na jeden sezon."
        ru: "Береги обувь, она не на один сезон."
        source: { kind: authored }
      - pl: "Szanuj zdrowie, póki je masz."
        ru: "Береги здоровье, пока оно есть."
        source: { kind: authored }
  - id: respected
    ru: "szanowany — уважаемый"
    examples:
      - pl: "To szanowany w mieście lekarz."
        ru: "Это уважаемый в городе врач."
        source: { kind: authored }
      - pl: "Była szanowana przez wszystkich."
        ru: "Её уважали все."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Неожиданность в том, что ПЕРВИЧНО здесь второе значение. Слово пришло из немецкого schonen «щадить, берегать», и «берегать» — исходный смысл, а «уважать» развился позже. Поэтому szanuj buty, szanuj czas, szanuj zdrowie — совершенно обычный польский, тогда как по-русски «уважать ботинки» не скажешь. Русскоязычный знает только «уважать» и на втором значении спотыкается. Прямого русского родственника у корня нет." }
  - { kind: usage, text: "Прилагательное szanowny даёт обязательную формулу вежливого письма: Szanowny Panie, Szanowna Pani, Szanowni Państwo — «Уважаемый...». Без неё официальное письмо по-польски не начинают. Обычное существительное для «уважения» — szacunek, а szanowanie называет само действие." }
  - { kind: government, text: "Уважают и берегут ЧТО или КОГО — винительный без предлога: szanować ojca, szanować czyjeś zdanie, szanować buty. Расхождений с русским в управлении нет, расходятся только значения." }
  - { kind: pronunciation, text: "Основа настоящего времени меняется: -owa- уступает место -uj-, то есть szanować, но szanuję, szanujesz. Тот же образец, что у całować — całuję и głosować — głosuję, уже разобранный на соседних карточках." }
collocations:
  - { pl: "szanować czyjeś zdanie", ru: "уважать чьё-л. мнение" }
  - { pl: "szanuj zdrowie", ru: "береги здоровье" }
  - { pl: "Szanowny Panie", ru: "Уважаемый господин" }
family:
  - { pl: "szacunek", ru: "уважение", relation: derived, id: szacunek }
  - { pl: "szanowny", ru: "уважаемый (в обращении)", relation: derived }
  - { pl: "poszanowanie", ru: "соблюдение, уважение", relation: derived }
etymology: "Из немецкого schonen «щадить, берегать, обходиться бережно». Исходное значение в польском сохранилось полностью — szanować rzeczy «берегать вещи», — а «уважать» выросло из него позже, через образ бережного обхождения с человеком. Русского родственника у корня нет: там на оба смысла пошли «берегать» и «уважать», слова разного происхождения."
memory: "szanować — «уважать» И «берегать», причём «берегать» первично: слово из немецкого schonen «щадить». Отсюда szanuj buty — нормальный польский. И запомните формулу письма: Szanowny Panie."
idioms:
  - { pl: "Szanowni Państwo", ru: "дамы и господа; уважаемые (обращение)" }
  - { pl: "szanować czyjąś pamięć", ru: "уважать чью-л. память" }
