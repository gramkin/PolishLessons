notes:
  - { kind: usage, text: "Почти всегда идёт рядом с lis: szczwany lis «хитрый лис» — самое частое сочетание, остальные встречаются редко." }
  - { kind: false-friend, text: "Это застывшее причастие от устаревшего szczuć «травить (собаками)». Буквально «травленый зверь» — тот, кого гоняли и кто научился уходить. Русское «травленый волк» построено ровно так же." }
  - { kind: government, text: "Склоняется как обычное прилагательное; наречия у него практически нет." }
  - { kind: usage, text: "Оттенок скорее уважительный, чем бранный: szczwany — это опытный и изворотливый, а не просто подлый." }
