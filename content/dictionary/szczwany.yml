# review
id: szczwany
format: 2
lemma: "szczwany"
rank: 5698
pos: adj
pron: { cyr: "шчва́ны" }
senses:
  - id: cunning
    ru: "хитрый, пронырливый"
    examples:
      - pl: "To szczwany lis."
        ru: "Это хитрый лис."
        source: { kind: authored }
      - pl: "Szczwany handlarz oszukał nas wszystkich."
        ru: "Хитрый торговец обманул нас всех."
        source: { kind: authored }
      - pl: "Okazał się szczwany i bezwzględny."
        ru: "Он оказался хитрым и безжалостным."
        source: { kind: authored }
  - id: old-fox
    ru: "матёрый, травленый (в обороте szczwany lis)"
    examples:
      - pl: "Stary polityk to szczwany lis."
        ru: "Старый политик — матёрый лис."
        source: { kind: authored }
      - pl: "Z takim szczwanym graczem trudno wygrać."
        ru: "С таким матёрым игроком трудно выиграть."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Почти всегда идёт рядом с lis: szczwany lis «хитрый лис» — самое частое сочетание, остальные встречаются редко." }
  - { kind: false-friend, text: "Это застывшее причастие от устаревшего szczuć «травить (собаками)». Буквально «травленый зверь» — тот, кого гоняли и кто научился уходить. Русское «травленый волк» построено ровно так же." }
  - { kind: government, text: "Склоняется как обычное прилагательное; наречия у него практически нет." }
  - { kind: usage, text: "Оттенок скорее уважительный, чем бранный: szczwany — это опытный и изворотливый, а не просто подлый." }
collocations:
  - { pl: "szczwany lis", ru: "хитрый лис" }
  - { pl: "szczwany gracz", ru: "матёрый игрок" }
etymology: "Застывшее причастие от szczuć «травить собаками»; «травленый зверь» — тот, кто научился уходить от погони. Ср. русское «травленый волк»."
memory: "szczwany — «хитрый, матёрый», и живёт оно в обороте szczwany lis. Это причастие от szczuć «травить»: образ ровно тот же, что в русском «травленый волк»."
idioms:
  - { pl: "szczwany lis", ru: "хитрый лис" }
