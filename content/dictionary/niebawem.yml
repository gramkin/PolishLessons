# review
id: niebawem
format: 2
lemma: "niebawem"
rank: 2010
pos: adv
pron: { cyr: "неба́вем" }
senses:
  - id: soon
    ru: "вскоре, скоро"
    examples:
      - pl: "Dzieci niebawem zasnęły."
        ru: "Дети вскоре уснули."
        source: { kind: translated, id: 6306745 }
      - pl: "Niebawem nadejdzie wiosna."
        ru: "Скоро придёт весна."
        source: { kind: translated, id: 12562294 }
      - pl: "Już niebawem dojdzie do siebie."
        ru: "Он уже скоро придёт в себя."
        source: { kind: translated, id: 5913580 }
      - pl: "Niebawem wrócę."
        ru: "Я скоро вернусь."
        source: { kind: authored }
      - pl: "Niebawem się zobaczymy."
        ru: "Скоро увидимся."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Слово книжное, но совершенно нейтральное; в разговорной речи чаще wkrótce или zaraz." }
  - { kind: usage, text: "Обычно стоит перед глаголом: Niebawem wrócę «Я скоро вернусь»." }
  - { kind: false-friend, text: "Ничего общего с niebo «небо». Слово от bawić в старом значении «медлить, задерживаться»: «не медля»." }
collocations:
  - { pl: "już niebawem", ru: "уже совсем скоро" }
etymology: "nie + bawem, от bawić «медлить, задерживаться» (ср. bawić «пребывать»): буквально «не медля»."
memory: "niebawem = «вскоре». Не от niebo «небо», а от bawić «медлить»: «не медля» значит «скоро»."
idioms:
  - { pl: "już niebawem", ru: "совсем скоро" }
