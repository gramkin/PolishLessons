notes:
  - { kind: usage, text: "Это причастие от глагола UPRZYWILEJOWAĆ «дать привилегию», ставшее обычным прилагательным. Степеней на -SZY у него нет, сравнение строится описательно: BARDZIEJ UPRZYWILEJOWANY «в более выгодном положении», NAJBARDZIEJ UPRZYWILEJOWANY. Поэтому форм всего одиннадцать. Корень тот же, что в существительном PRZYWILEJ «привилегия», а приставка U- и окончание причастия делают из него «наделённый привилегией»." }
  - { kind: usage, text: "Два устойчивых термина стоит знать отдельно. POJAZD UPRZYWILEJOWANY в правилах дорожного движения — машина экстренной службы с включёнными мигалкой и сиреной: скорая, пожарная, полиция, и ей все обязаны уступить дорогу. AKCJA UPRZYWILEJOWANA — привилегированная акция, дающая больше голосов или первенство при дивидендах. Русский в первом случае говорит «машина со спецсигналом», а не «привилегированная машина»." }
  - { kind: pronunciation, text: "Слово длинное, но читается ровно: «упшывилейова́ны», ударение на предпоследнем слоге WA. Сочетание PRZ звучит как «пш»: после глухого P буква RZ тоже оглушается. Слог JE даёт русское «е», а JO — «йо». Буква Y на конце звучит как «ы»." }
  - { kind: government, text: "Сравнение с другими строится через W STOSUNKU DO + родительный или через сравнительную конструкцию с OD: JEST BARDZIEJ UPRZYWILEJOWANY ODE MNIE «он в более выгодном положении, чем я». Само прилагательное падежом не управляет и согласуется с существительным, как любое другое." }
collocations:
  - { pl: "uprzywilejowana pozycja", ru: "привилегированное положение" }
  - { pl: "pojazd uprzywilejowany", ru: "машина экстренной службы" }
  - { pl: "akcja uprzywilejowana", ru: "привилегированная акция" }
family:
  - { pl: "przywilej", ru: "привилегия", relation: root, id: przywilej }
  - { pl: "uprzywilejować", ru: "дать привилегию, поставить в лучшее положение", relation: root }
  - { pl: "uprzywilejowanie", ru: "привилегированное положение, предпочтение", relation: derived }
etymology: "Причастие от глагола uprzywilejować, образованного от существительного przywilej «привилегия». Само przywilej восходит к латинскому privilegium, как и русское «привилегия», только польское слово пришло раньше и обросло славянским видом."
memory: "В середине прячется przywilej, «привилегия»: u-PRZYWILEJ-owany — «наделённый привилегией». На дороге это машина с мигалкой, pojazd uprzywilejowany, которой все уступают."
idioms:
  - { pl: "pojazd uprzywilejowany", ru: "машина экстренной службы со спецсигналом" }
