notes:
  - { kind: usage, text: "pudełko — уменьшительное от pudło «ящик, большая коробка»; само pudło значит ещё и «промах»." }
  - { kind: government, text: "В коробке — w pudełku (предложный падеж), в коробку — do pudełka (родительный с do): włożyła to do pudełka." }
  - { kind: usage, text: "pudełko zapałek — «коробок спичек»; pudełko czekoladek — «коробка конфет»." }
  - { kind: false-friend, text: "Русское «коробка» и «коробочка» — это одно польское pudełko; большая картонная коробка будет karton или pudło." }
collocations:
  - { pl: "w pudełku", ru: "в коробке" }
  - { pl: "do pudełka", ru: "в коробку" }
  - { pl: "pudełko zapałek", ru: "коробок спичек" }
family:
  - { pl: "pudło", ru: "ящик, большая коробка", relation: root }
  - { pl: "pudełeczko", ru: "коробочка", relation: root }
etymology: "Уменьшительное от pudło «ящик», заимствованного из немецкого. Русское «коробка» — от «короб», слово другого корня."
memory: "pudełko — «коробка, коробочка», уменьшительное от pudło. В коробке — w pudełku, в коробку — do pudełka."
idioms:
