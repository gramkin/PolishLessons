etymology: "Из немецкого слова со значением «рабочее место»: «работа» + «место». Значение «мастерство» пришло от мастерской, где ремесло оттачивают."
memory: "Warsztat — мастерская, автосервис; warsztaty — мастер-класс. Читается «ва́рштат». Mieć coś na warsztacie — работать над чем-то."
