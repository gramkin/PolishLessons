notes:
  - { kind: false-friend, text: "WARSZTAT — «мастерская», а WARSZTAT SAMOCHODOWY — «автосервис». Во множественном WARSZTATY — «мастер-класс, тренинг»: WARSZTATY TEATRALNE. О профессионале WARSZTAT — «мастерство, техника»: WARSZTAT AKTORSKI." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Родительный — WARSZTATU, в местном T переходит в C: W WARSZTACIE." }
  - { kind: government, text: "Отдать в мастерскую — ODDAĆ DO WARSZTATU, DO с родительным. В мастерской — W WARSZTACIE. Мастер-класс по чему — WARSZTATY Z, и родительный: WARSZTATY Z FOTOGRAFII." }
  - { kind: pronunciation, text: "Читается «ва́рштат», ударение на первом слоге. SZ — «ш»." }
collocations:
  - { pl: "warsztat samochodowy", ru: "автосервис" }
