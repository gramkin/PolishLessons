# review
id: spodobac
format: 2
lemma: "spodobać"
rank: 1149
pos: verb
aspect: perf
aspectPair: podobac
pron: { cyr: "сподо́баць" }
senses:
  - id: like
    ru: "spodobać się komuś — понравиться кому-то"
    examples:
      - pl: "Tomowi się to spodoba."
        ru: "Тому это понравится."
        source: { kind: tatoeba, id: 6441693 }
      - pl: "Spodobała ci się nasza niespodzianka?"
        ru: "Тебе понравился наш сюрприз?"
        source: { kind: tatoeba, id: 12476429 }
      - pl: "Spodoba ci się."
        ru: "Тебе понравится."
        source: { kind: translated, id: 8231485 }
  - id: will-like
    ru: "spodoba ci się — тебе понравится"
    examples:
      - pl: "Weź dowolny kwiat, jaki ci się spodoba."
        ru: "Возьми любой цветок, который тебе понравится."
        source: { kind: tatoeba, id: 766174 }
      - pl: "Podaruję ci i gwiazdy, jak ci się spodobają."
        ru: "Подарю тебе и звёзды, если они тебе понравятся."
        source: { kind: translated, id: 13074580 }
  - id: would
    ru: "spodobałoby się — понравилось бы"
    examples:
      - pl: "Spodobałoby ci się tam."
        ru: "Тебе бы там понравилось."
        source: { kind: translated, id: 2680659 }
      - pl: "Spodobałoby Wam się to."
        ru: "Вам бы это понравилось."
        source: { kind: translated, id: 11433255 }
notes:
  - { kind: government, text: "Конструкция как у русского «нравиться»: spodobać się KOMUŚ, дательный падеж, а подлежащее — то, что нравится. Spodobał mi się film «Мне понравился фильм»." }
  - { kind: usage, text: "Совершенный вид к podobać się. Глагол всегда идёт с się." }
  - { kind: usage, text: "О человеке: Spodobałaś mi się «Ты мне понравилась» — то есть приглянулась, а не просто «показалась милой»." }
  - { kind: usage, text: "Корень — podobny «подобный, похожий»: понравиться значит буквально «прийтись под стать»." }
collocations:
  - { pl: "spodobać się komuś", ru: "понравиться кому-то" }
  - { pl: "spodoba ci się", ru: "тебе понравится" }
  - { pl: "od razu się spodobać", ru: "сразу понравиться" }
family:
  - { pl: "podobać się", ru: "нравиться", relation: aspect, id: podobac }
  - { pl: "podobny", ru: "похожий, подобный", relation: root }
etymology: "Приставка s- плюс podobać się «нравиться», от podobny «подобный». Понравиться — буквально «прийтись под стать». Русское «нравиться» идёт от «нрава»."
memory: "spodobać się — совершенный вид к podobać się: «понравиться». Всегда с się и с дательным: Spodobał mi się film «Мне понравился фильм». Подлежащее — то, что нравится."
idioms:
  - { pl: "spodobać się komuś", ru: "понравиться кому-то" }
  - { pl: "spodoba ci się", ru: "тебе понравится" }
formExamplesSkip:
  - { form: "spodobania", reason: "отглагольного существительного у этого глагола нет: spodobać живёт только с się, а форма spodobanie построена так, как если бы существовал переходный spodobać coś. Нужное значение по-польски передаёт слово upodobanie «склонность, пристрастие»: mieć w czymś upodobanie" }
  - { form: "spodobanie", reason: "отглагольного существительного у этого глагола нет: spodobać живёт только с się, а форма spodobanie построена так, как если бы существовал переходный spodobać coś. Нужное значение по-польски передаёт слово upodobanie «склонность, пристрастие»: mieć w czymś upodobanie" }
  - { form: "spodobaniem", reason: "отглагольного существительного у этого глагола нет: spodobać живёт только с się, а форма spodobanie построена так, как если бы существовал переходный spodobać coś. Нужное значение по-польски передаёт слово upodobanie «склонность, пристрастие»: mieć w czymś upodobanie" }
  - { form: "spodobaniu", reason: "отглагольного существительного у этого глагола нет: spodobać живёт только с się, а форма spodobanie построена так, как если бы существовал переходный spodobać coś. Нужное значение по-польски передаёт слово upodobanie «склонность, пристрастие»: mieć w czymś upodobanie" }
  - { form: "spodobano", reason: "подлежащее у spodobać się — то, что нравится, а человек стоит в дательном (spodobał mi się film), о чём прямо сказано в карточке; безличная форма на -no предполагает человека-деятеля, поэтому формы spodobano живой язык не образует" }
  - { form: "spodobawszy", reason: "книжное деепричастие прошедшего времени; в живой речи не употребляется" }
