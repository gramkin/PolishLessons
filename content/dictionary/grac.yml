# review
id: grac
format: 2
lemma: "grać"
rank: 235
pos: verb
aspect: imperf
pron: { cyr: "граць" }
senses:
  - id: play-game
    ru: "играть (во что-либо); играть на инструменте"
    note: "grać w coś — в игру, grać na czymś — на инструменте. Ровно как в русском."
    examples:
      - pl: "Grają w szachy."
        ru: "Они играют в шахматы."
        source: { kind: tatoeba, id: 999314 }
      - pl: "Ona gra na gitarze."
        ru: "Она играет на гитаре."
        source: { kind: tatoeba, id: 588111 }
      - pl: "Idę grać w tenisa."
        ru: "Я собираюсь играть в теннис."
        source: { kind: tatoeba, id: 704122 }
  - id: perform
    ru: "играть (о спектакле, фильме, роли); состояться"
    examples:
      - pl: "Wszyscy mogą grać."
        ru: "Все могут играть."
        source: { kind: tatoeba, id: 12476527 }
      - pl: "Gramy w niedzielę."
        ru: "Мы играем в воскресенье."
        source: { kind: tatoeba, id: 6031120 }
      - pl: "Gram na organach."
        ru: "Я играю на орга́не."
        source: { kind: tatoeba, id: 9679696 }
notes:
  - { kind: usage, text: "Два предлога, как в русском: grać w szachy, grać w tenisa «играть в шахматы, в теннис» (игра); grać na gitarze, grać na pianinie «играть на гитаре, на пианино» (инструмент)." }
  - { kind: usage, text: "Совершенный вид — zagrać: Zagraj coś! «Сыграй что-нибудь!»" }
  - { kind: usage, text: "grać rolę значит «играть роль»; o filmie mówi się jest grany «фильм идёт»." }
  - { kind: usage, text: "Существительное от того же корня — gra «игра», а начальное и- (как в русском «играть») в польском отпало." }
collocations:
  - { pl: "grać w szachy", ru: "играть в шахматы" }
  - { pl: "grać na gitarze", ru: "играть на гитаре" }
  - { pl: "grać rolę", ru: "играть роль" }
  - { pl: "grać w piłkę", ru: "играть в мяч" }
etymology: "Праславянское *jьgrati — то же слово, что русское «играть»; начальное и- в польском отпало, отсюда gra «игра»."
memory: "Два предлога, как в русском: grać w szachy «играть в шахматы» (игра) и grać na gitarze «играть на гитаре» (инструмент). Начальное и- отпало: «играть» → grać."
idioms:
  - { pl: "grać na nerwach", ru: "играть на нервах" }
  - { pl: "grać na zwłokę", ru: "тянуть время" }
  - { pl: "grać pierwsze skrzypce", ru: "играть первую скрипку" }
