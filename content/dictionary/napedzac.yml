# review
id: napedzac
format: 2
lemma: "napędzać"
rank: 2197
pos: verb
aspect: imperf
pron: { cyr: "напэ́ндзаць" }
senses:
  - id: power
    ru: "приводить в движение, питать (о механизме)"
    examples:
      - pl: "Woda napędza turbinę."
        ru: "Вода приводит в движение турбину."
        source: { kind: translated, id: 7886535 }
      - pl: "To urządzenie napędza mały silnik elektryczny."
        ru: "Это устройство приводит в движение маленький электродвигатель."
        source: { kind: translated, id: 360419 }
      - pl: "Silnik jest napędzany parą."
        ru: "Двигатель работает на пару."
        source: { kind: translated, id: 5229165 }
  - id: drive-on
    ru: "подгонять, подстёгивать (переносно)"
    examples:
      - pl: "Susza, ubóstwo i bezrobocie napędzały emigrację z Mauretanii od lat siedemdziesiątych."
        ru: "Засуха, бедность и безработица подстёгивали эмиграцию."
        source: { kind: translated, id: 8948665 }
      - pl: "Udało mu się użyć pary wodnej do napędzania statków."
        ru: "Ему удалось использовать водяной пар для движения судов."
        source: { kind: translated, id: 982518 }
notes:
  - { kind: government, text: "Чем приводится в движение — творительный падеж: napędzany parą «приводимый в движение паром», napędzany prądem «работающий от электричества»." }
  - { kind: usage, text: "Причастие napędzany «приводимый в движение» встречается чаще личных форм — это язык техники." }
  - { kind: false-friend, text: "Корень pęd «стремительное движение», от pędzić «гнать», который уже есть в словаре." }
  - { kind: usage, text: "Совершенный вид — napędzić. Существительное napęd значит «привод, двигатель»." }
collocations:
  - { pl: "napędzany prądem", ru: "работающий от электричества" }
  - { pl: "napędzać gospodarkę", ru: "подстёгивать экономику" }
etymology: "na- + pędzać, от pęd «стремительное движение», pędzić «гнать»; ср. русское «понудить»."
memory: "napędzać — «приводить в движение», с творительным падежом: napędzany parą. Чаще всего встречается причастие napędzany. Существительное napęd — «привод»."
idioms:
