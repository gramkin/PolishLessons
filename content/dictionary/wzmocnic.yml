  - id: boost
    ru: "подкрепить, взбодрить (силы, иммунитет)"
    examples:
      - pl: "Gorąca zupa wzmocni cię po spacerze."
        ru: "Горячий суп подкрепит тебя после прогулки."
        source: { kind: authored }
      - pl: "Witaminy wzmocnią odporność."
        ru: "Витамины укрепят иммунитет."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "WZMOCNIĆ — «укрепить, усилить», от MOCNY, «крепкий, сильный». Русское «мощный» — POTĘŻNY, а MOC — «сила, мощность». Сильное лекарство или напиток — MOCNY: MOCNA KAWA, «крепкий кофе». Сигнал усиливает WZMACNIACZ, «усилитель»." }
  - { kind: usage, text: "Пятьдесят три формы — подпись переходного глагола совершенного вида: страдательное WZMOCNIONY и деепричастие WZMOCNIWSZY. Повелительное WZMOCNIJ — с -IJ. Видовой партнёр — WZMACNIAĆ: SPORT WZMACNIA CHARAKTER. Чередование O → A в несовершенном." }
  - { kind: government, text: "Что — винительный, чем — творительный: WZMOCNIĆ ŚCIANĘ BETONEM, WZMOCNIĆ ZESPÓŁ NOWYM GRACZEM. Возвратное WZMOCNIĆ SIĘ — «окрепнуть, подкрепиться»: WIATR SIĘ WZMOCNIŁ, «ветер усилился»." }
  - { kind: pronunciation, text: "Читается «взмо́цниць», три слога, ударение на предпоследнем. WZ в начале звонкое «вз», CN — «цн» без гласной, NI — мягкое «ни». Конечное Ć — «ць»." }
  - { kind: register, text: "Нейтральное слово стройки, спорта, медицины и политики: WZMOCNIĆ GRANICE, WZMOCNIĆ POZYCJĘ. Разговорное WZMOCNIĆ SIĘ — «подкрепиться» едой или рюмкой." }
collocations:
  - { pl: "wzmocnić odporność", ru: "укрепить иммунитет" }
  - { pl: "wzmocnić mięśnie", ru: "укрепить мышцы" }
  - { pl: "wzmocnić pozycję", ru: "укрепить позиции" }
family:
  - { pl: "wzmacniać", ru: "укреплять, усиливать", relation: aspect }
  - { pl: "mocny", ru: "крепкий, сильный", relation: root, id: mocny }
  - { pl: "moc", ru: "сила, мощность", relation: root }
etymology: "Приставка WZ- «вз-, вверх» плюс корень MOC- «сила», тот же, что в русском «мочь», «мощь», «помощь». Буквально «поднять силу»."
memory: "Wzmocnić — укрепить, усилить: wzmocnić most, odporność, patrole. От mocny — крепкий. Wzmocnić się — подкрепиться. Читается «взмо́цниць»."
idioms:
