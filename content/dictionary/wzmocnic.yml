senses:
  - id: strengthen
    ru: "укрепить, усилить"
    examples:
      - pl: "Trzeba wzmocnić ten most."
        ru: "Нужно укрепить этот мост."
        source: { kind: authored }
      - pl: "Ćwiczenia wzmocnią twoje plecy."
