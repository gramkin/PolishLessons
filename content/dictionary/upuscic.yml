# review
id: upuscic
format: 2
lemma: "upuścić"
rank: 3806
pos: verb
pron: { cyr: "упу́сьциць" }
senses:
  - id: drop
    ru: "уронить, выронить"
    examples:
      - pl: "Upuściłem telefon na podłogę."
        ru: "Я уронил телефон на пол."
        source: { kind: authored }
      - pl: "Kelner upuścił tacę z kieliszkami."
        ru: "Официант уронил поднос с бокалами."
        source: { kind: authored }
      - pl: "Ze strachu upuściła klucze."
        ru: "От страха она выронила ключи."
        source: { kind: authored }
  - id: let-out
    ru: "выпустить немного, отлить (крови, воздуха)"
    examples:
      - pl: "Cyrulik upuścił choremu krwi."
        ru: "Цирюльник пустил больному кровь."
        source: { kind: authored }
      - pl: "Upuść trochę powietrza z opony."
        ru: "Выпусти немного воздуха из шины."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "UPUŚCIĆ — не «упустить»: упустить шанс — PRZEGAPIĆ или STRACIĆ OKAZJĘ, упустить из виду — STRACIĆ Z OCZU. UPUŚCIĆ — «уронить», выпустить из рук: UPUŚCIĆ KUBEK. Корень тот же, что в PUŚCIĆ, «пустить, отпустить»: выпустил из рук — и упало." }
  - { kind: usage, text: "Пятьдесят три формы — подпись переходного глагола совершенного вида: страдательное UPUSZCZONY, «уроненный», и деепричастие UPUŚCIWSZY. Чередование ŚĆ → SZCZ: UPUŚCIĆ, но UPUSZCZĘ, UPUSZCZĄ, UPUSZCZONY. Видовой партнёр — UPUSZCZAĆ: CIĄGLE WSZYSTKO UPUSZCZAM." }
  - { kind: government, text: "Что уронить — винительный: UPUŚCIĆ TALERZ. С отрицанием — родительный: NIE UPUŚCIŁ ANI JEDNEGO TALERZA. Куда — NA с винительным: UPUŚCIĆ NA PODŁOGĘ. В значении «отлить немного» — родительный части: UPUŚCIĆ KRWI, UPUŚCIĆ WODY." }
  - { kind: pronunciation, text: "Читается «упу́сьциць», три слога, ударение на предпоследнем. ŚCI — «сьци», два мягких звука; конечное Ć — «ць». UPUSZCZĘ — «упу́шчэ», SZCZ — твёрдые «шч», похоже на русское «щ», но раздельно." }
  - { kind: register, text: "Нейтральный бытовой глагол. В разговоре так же часто говорят WYPUŚCIĆ Z RĄK, «выпустить из рук», и UPAŚĆ: TELEFON MI UPADŁ, «у меня упал телефон», — это даже частотнее. UPUSZCZANIE KRWI — исторический медицинский термин, «кровопускание»." }
collocations:
  - { pl: "upuścić na podłogę", ru: "уронить на пол" }
  - { pl: "upuścić z rąk", ru: "выронить из рук" }
  - { pl: "upuszczanie krwi", ru: "кровопускание" }
family:
  - { pl: "upuszczac", ru: "ронять", relation: aspect }
  - { pl: "puscic", ru: "пустить, отпустить", relation: root, id: puscic }
  - { pl: "wypuscic", ru: "выпустить", relation: root, id: wypuscic }
etymology: "Приставка U- «вниз, прочь» плюс PUŚCIĆ «пустить», от праславянского *pustiti, того же, что русское «пустить». Русское «упустить» и польское UPUŚCIĆ — одно слово, но русское ушло к «не удержать шанс», а польское осталось у вещей, которые падают из рук."
memory: "Upuścić — уронить: upuściłem telefon. Не «упустить»! Упустить шанс — przegapić. Upuścić krwi — пустить кровь. Upuszczę, upuszczony — с SZCZ. Читается «упу́сьциць»."
idioms:
  - { pl: "upuścić komuś krwi", ru: "пустить кому-то кровь" }
