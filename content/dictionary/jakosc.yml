notes:
  - { kind: false-friend, text: "Значение совпадает с русским «качеством», а вот оборот «в качестве кого-либо» по-польски строится совершенно иначе. По-русски говорят «в качестве директора», «в качестве примера»; по-польски — JAKO DYREKTOR, JAKO PRZYKŁAD, одним словом JAKO и без всякого падежа. Сказать W JAKOŚCI DYREKTORA нельзя: получится бессмыслица о сорте товара. Вторая ловушка на письме: JAKOŚ с одним Ś — это наречие «как-то», JAKOŚ TO BĘDZIE «как-нибудь обойдётся», а JAKOŚĆ с -ŚĆ — существительное. Третья: польское слово женского рода, русское среднего, поэтому все согласования разные." }
  - { kind: usage, text: "Шесть форм, женский род, как у всех имён на -OŚĆ. Форма JAKOŚCI покрывает родительный, дательный и местный единственного и родительный множественного сразу. Множественное число употребляется только во втором значении, о сортах и разрядах товара: JAKOŚCI HANDLOWE, DWIE JAKOŚCI MĄKI; говорить о качестве как о свойстве во множественном нельзя. Управление: JAKOŚĆ CZEGO в родительном — JAKOŚĆ WODY, JAKOŚĆ OBSŁUGI. Признак выражается родительным: TOWAR DOBREJ JAKOŚCI, WYSOKIEJ JAKOŚCI, и это самая частая конструкция со словом." }
  - { kind: pronunciation, text: "Читается «я́косьць», два слога, ударение на первом. Буква J в начале даёт «й», и вместе с A получается «я» — ошибкой было бы прочесть «джа» или «жа». Конечное -ŚĆ — два мягких звука подряд, «сь» и «ць», как в GODNOŚĆ и WOLNOŚĆ. В форме JAKOŚCI сочетание ŚCI звучит «сьци», а ударение переезжает на второй слог: «яко́сьци». В форме JAKOŚCIĄ последнее Ą даёт «он»: «яко́сьцён»." }
  - { kind: register, text: "Слово нейтральное и очень частое: в торговле, в технике, в разговоре о жизни. Устойчивые сочетания: JAKOŚĆ ŻYCIA «качество жизни», KONTROLA JAKOŚCI «контроль качества», WYSOKIEJ JAKOŚCI «высокого качества», JAKOŚĆ OBSŁUGI «качество обслуживания». В рекламе часто стоит голое DOBRA JAKOŚĆ, W DOBREJ CENIE. В технических текстах второе значение, о сортах, обязательно и ни с чем не смешивается. Звательная форма у слова теоретически есть, но в живой речи не употребляется вовсе." }
