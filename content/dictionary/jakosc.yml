etymology: "Калька с латинского QUALITAS, образованного от QUALIS «какой». Польский перевёл её своим вопросительным словом JAKI плюс суффикс -OŚĆ, русский — своим «какой» в старой форме «кой» плюс -ЕСТВО, и получились JAKOŚĆ и «качество»: два разных слова, построенных по одному чертежу из своего материала. Такие параллельные кальки с латыни стоят во всём европейском научном языке: ILOŚĆ «количество» от ILE построено так же, от QUANTITAS и QUANTUS. Сам суффикс -OŚĆ восходит к праславянскому -ostь и побуквенно отвечает русскому -ОСТЬ, поэтому большинство слов на -OŚĆ русскоязычный понимает сразу; именно поэтому стоит запомнить те немногие, где значение разошлось, как в GODNOŚĆ и PUBLICZNOŚĆ."
memory: "Значение то же, что у «качества», но слово женского рода и построено от jaki — это калька латинского qualitas от qualis, ровно как русское «качество» от «кой». Та же пара: ilość «количество» от ile. Главная ошибка: «в качестве директора» это jako dyrektor, одним словом, а не w jakości. И на письме: jakoś «как-то» против jakość «качество». Шесть форм, jakości делает четыре падежа; множественное только о сортах товара."
