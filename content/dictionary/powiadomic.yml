# review
id: powiadomic
format: 2
lemma: "powiadomić"
rank: 2170
pos: verb
pron: { cyr: "повядо́миць" }
senses:
  - id: notify
    ru: "уведомить, известить"
    examples:
      - pl: "Trzeba powiadomić rodzinę."
        ru: "Надо известить семью."
        source: { kind: authored }
      - pl: "Powiadomił policję o wypadku."
        ru: "Он сообщил в полицию о происшествии."
        source: { kind: authored }
      - pl: "Powiadomiono nas listownie."
        ru: "Нас известили письмом."
        source: { kind: authored }
  - id: notification
    ru: "powiadomienie — уведомление"
    examples:
      - pl: "Powiadomienie przyszło na telefon."
        ru: "Уведомление пришло на телефон."
        source: { kind: authored }
      - pl: "Bez powiadomienia termin nie biegnie."
        ru: "Без уведомления срок не течёт."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Корень тот же, что в русском «ведать»: powiadomić построено на wiadomy «известный», а то — на wiedzieć «знать». Ближайшее русское слово «уведомить» собрано из тех же кирпичей, только приставка другая: у-ведом-ить против po-wiadom-ić. Отсюда же wiadomość, которое значит и «известие», и просто «сообщение» — так по-польски называют эсэмэску." }
  - { kind: pronunciation, text: "ОБРАТИТЕ ВНИМАНИЕ НА ДВОЙНОЕ M. Повелительное наклонение образуется без окончания: powiadom. А первое лицо множественного добавляет -my прямо к нему, и выходит powiadommy, с двумя m подряд. Произносятся обе, звук тянется: «повядо́ммы». Само слово звучит «повядо́миць»." }
  - { kind: government, text: "Извещают КОГО — винительный падеж: powiadomić rodzinę, policję, sąsiadów. О ЧЁМ — o с предложным: powiadomić o wypadku, o zmianie terminu. Обе модели совпадают с русским «известить кого о чём», так что фразу можно строить по родному образцу." }
  - { kind: usage, text: "Вид совершенный, несовершенная пара — powiadamiać. Страдательное причастие powiadomiony образовано по знакомому правилу: -ić даёт -ony, как poprawić даёт poprawiony, а pomówić — pomówiony. Существительное powiadomienie «уведомление» в канцелярском языке встречается чаще самого глагола." }
collocations:
  - { pl: "powiadomić policję", ru: "сообщить в полицию" }
  - { pl: "powiadomić o terminie", ru: "известить о сроке" }
  - { pl: "bez powiadomienia", ru: "без уведомления" }
family:
  - { pl: "wiedzieć", ru: "знать, ведать", relation: root, id: wiedziec }
  - { pl: "wiadomość", ru: "известие; сообщение", relation: derived, id: wiadomosc }
  - { pl: "powiadomienie", ru: "уведомление", relation: derived }
  - { pl: "powiadamiać", ru: "уведомлять", relation: aspect }
etymology: "Приставка po- плюс wiadomić, от wiadomy «известный» и дальше от wiedzieć «знать», корень тот же, что в русских «ведать», «известие», «уведомить». Отсюда wiadomość «известие, сообщение», powiadamiać и niewiadoma «неизвестное» в математике."
memory: "powiadomić — «уведомить, известить», и корень знакомый: wiedzieć это «ведать». Запомните повелительное без окончания, powiadom, и вытекающее из него powiadommy с двумя m. А wiadomość по-польски это и «известие», и эсэмэска."
idioms:
