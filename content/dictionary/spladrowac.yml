# review
id: spladrowac
format: 2
lemma: "splądrować"
rank: 5974
pos: verb
aspect: perf
pron: { cyr: "сплондро́ваць" }
senses:
  - id: plunder
    ru: "разграбить, разорить (город, дом, страну)"
    examples:
      - pl: "Hunowie splądrowali wioskę i doszczętnie ją spalili."
        ru: "Гунны разграбили деревню и сожгли её дотла."
        source: { kind: translated, id: 10667443 }
      - pl: "Wikingowie splądrowali klasztor na wyspie."
        ru: "Викинги разграбили монастырь на острове."
        source: { kind: authored }
      - pl: "Złodzieje splądrowali nasze mieszkanie podczas wakacji."
        ru: "Воры обчистили нашу квартиру во время отпуска."
        source: { kind: authored }
      - pl: "Po bitwie żołnierze splądrowali całe miasto."
        ru: "После битвы солдаты разграбили весь город."
        source: { kind: authored }
  - id: raid
    ru: "перерыть, опустошить (шутл.: холодильник, шкаф)"
    examples:
      - pl: "Dzieci w nocy splądrowały lodówkę."
        ru: "Ночью дети опустошили холодильник."
        source: { kind: authored }
      - pl: "Siostra splądrowała moją szafę w poszukiwaniu sukienki."
        ru: "Сестра перерыла мой шкаф в поисках платья."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Совершенный вид; несовершенный — PLĄDROWAĆ «грабить, разорять». Спряжение на -UJĘ: SPLĄDRUJĘ, SPLĄDRUJESZ, SPLĄDRUJĄ — это будущее время. Мужско-личное страдательное SPLĄDROWANI в карточку не включено: грабят дома и города, а не людей." }
  - { kind: government, text: "Что — винительный: SPLĄDROWAĆ MIASTO, DOM, SKLEP. Людей так не «грабят»: «ограбить человека» — OKRAŚĆ, OBRABOWAĆ KOGOŚ." }
  - { kind: register, text: "Книжное слово о войне и набегах: WROGOWIE SPLĄDROWALI KRAJ. В разговоре — шутливо о том, кто всё перерыл или съел: DZIECI SPLĄDROWAŁY LODÓWKĘ «дети опустошили холодильник»." }
  - { kind: pronunciation, text: "Читается «сплондро́ваць»: Ą перед D — «он». Ударение на предпоследнем слоге; в SPLĄDRUJĘ — «сплондру́е»." }
collocations:
  - { pl: "splądrować miasto", ru: "разграбить город" }
  - { pl: "splądrować mieszkanie", ru: "обчистить квартиру" }
  - { pl: "splądrować lodówkę", ru: "опустошить холодильник (шутл.)" }
family:
  - { pl: "plądrować", ru: "грабить, разорять", relation: aspect }
  - { pl: "plądrowanie", ru: "грабёж, разграбление", relation: derived }
  - { pl: "grabić", ru: "грабить; сгребать", relation: root }
etymology: "Заимствовано через немецкое plündern «грабить» (от средневерхненемецкого plunder «домашний скарб»)."
memory: "Splądrować — как немецкое plündern: «разграбить». Wikingowie splądrowali wioskę."
idioms:
