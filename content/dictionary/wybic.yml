# review
id: wybic
format: 2
lemma: "wybić"
rank: 4307
pos: verb
pron: { cyr: "вы́биць" }
senses:
  - id: knock-out
    ru: "выбить (стекло, зуб, мяч)"
    examples:
      - pl: "Piłka wybiła szybę w oknie."
        ru: "Мяч выбил стекло в окне."
        source: { kind: authored }
      - pl: "Wybił mu dwa zęby."
        ru: "Он выбил ему два зуба."
        source: { kind: authored }
      - pl: "Bramkarz wybił piłkę na aut."
        ru: "Вратарь выбил мяч в аут."
        source: { kind: authored }
  - id: strike
    ru: "пробить (о часах); выбиться (wybić się — выделиться)"
    examples:
      - pl: "Zegar wybił północ."
        ru: "Часы пробили полночь."
        source: { kind: authored }
      - pl: "Wybiła się ponad przeciętność."
        ru: "Она поднялась над посредственностью."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "WYBIĆ почти совпадает с русским «выбить»: WYBIĆ SZYBĘ, WYBIĆ ZĄB. Но о часах — «пробить»: ZEGAR WYBIŁ DWUNASTĄ. WYBIĆ SIĘ — «выделиться, пробиться наверх», а не «выбиться из сил»: выбиться из сил — OPAŚĆ Z SIŁ. WYBIĆ KOMUŚ COŚ Z GŁOWY — «выбить из головы»." }
  - { kind: usage, text: "Пятьдесят три формы — подпись переходного глагола совершенного вида: страдательное WYBITY и деепричастие WYBIWSZY. Спряжение как у BIĆ: WYBIJĘ, WYBIJESZ, WYBIJ. Видовой партнёр — WYBIJAĆ: SERCE WYBIJA RYTM. WYBITNY, «выдающийся», — от того же глагола." }
  - { kind: government, text: "Что — винительный, кому — дательный: WYBIĆ KOMUŚ ZĄB. Откуда — Z с родительным: WYBIĆ Z RYTMU, ZE SNU, Z GŁOWY. Час — винительный порядкового: WYBIĆ PÓŁNOC, PIĄTĄ." }
  - { kind: pronunciation, text: "Читается «вы́биць», два слога, ударение на первом. Y — «ы», BI — мягкое «би», конечное Ć — «ць». WYBIJĘ — «выби́е»." }
  - { kind: register, text: "Нейтральное слово, частое в спорте, быту и хронике. Устойчивые: WYBIĆ Z GŁOWY, WYBIĆ Z RYTMU, WYBIĆ DO NOGI — «перебить всех до одного». WYBIŁA GODZINA — «пробил час», торжественное." }
collocations:
  - { pl: "wybić szybę", ru: "выбить стекло" }
  - { pl: "wybić z głowy", ru: "выбить из головы" }
  - { pl: "zegar wybił północ", ru: "часы пробили полночь" }
family:
  - { pl: "wybijać", ru: "выбивать", relation: aspect }
  - { pl: "bić", ru: "бить", relation: root, id: bic }
  - { pl: "wybitny", ru: "выдающийся", relation: derived }
etymology: "Приставка WY- «вы-» плюс BIĆ «бить», праславянское *biti. Польское WYBIĆ и русское «выбить» — одно слово; прилагательное WYBITNY «выдающийся» — буквально «выбившийся вперёд»."
memory: "Wybić — выбить: szybę, ząb, z głowy. Часы wybiły północ — пробили полночь. Wybić się — выделиться. Wybitny — выдающийся. Читается «вы́биць»."
idioms:
  - { pl: "wybić komuś coś z głowy", ru: "выбить что-то у кого-то из головы" }
