# review
id: przedawnic
format: 2
lemma: "przedawnić"
rank: 2004
pos: verb
aspect: perf
pron: { cyr: "пшэда́вниць" }
senses:
  - id: lapse
    ru: "погасить давностью; (с się) истечь — о сроке давности"
    examples:
      - pl: "Roszczenie się przedawniło."
        ru: "Требование погашено давностью."
        source: { kind: authored }
      - pl: "Sprawa się przedawniła."
        ru: "Дело закрыто за давностью."
        source: { kind: authored }
      - pl: "Dług się przedawnił."
        ru: "Долг погашен давностью."
        source: { kind: authored }
  - id: legal
    ru: "утратить силу за истечением срока (юридический термин)"
    examples:
      - pl: "Przestępstwo przedawni się za rok."
        ru: "Преступление будет погашено давностью через год."
        source: { kind: authored }
      - pl: "Te roszczenia już się przedawniły."
        ru: "Эти требования уже погашены давностью."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Почти всегда с się: coś się przedawnia «что-л. теряет силу за давностью». Без się встречается редко." }
  - { kind: government, text: "Подлежащее — то, что теряет силу: roszczenie «требование», dług «долг», przestępstwo «преступление»." }
  - { kind: false-friend, text: "Не «представить» и не «предать». Корень — dawny «давний», как в русском «давность»." }
  - { kind: usage, text: "Существительное — przedawnienie «исковая давность»: termin przedawnienia «срок давности»." }
collocations:
  - { pl: "przedawnienie roszczeń", ru: "исковая давность" }
  - { pl: "termin przedawnienia", ru: "срок давности" }
etymology: "prze- + dawny «давний»; ср. русское «давность» и оборот «погасить давностью»."
memory: "przedawnić się — «истечь за давностью». Корень dawny = русское «давний»: то, что стало слишком давним, теряет силу. Существительное — przedawnienie «исковая давность»."
idioms:
  - { pl: "termin przedawnienia", ru: "срок давности" }
  - { pl: "ulec przedawnieniu", ru: "погаситься давностью" }
