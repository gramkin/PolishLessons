etymology: "Из немецкого, а туда — из французского глагола со значением «наклеивать». Русское «плакат» — того же источника, но с ударением на втором слоге."
memory: "Plakat — плакат и афиша, ударение на первом: «пла́кат». Na plakacie — на афише. Farby plakatowe — гуашь."
