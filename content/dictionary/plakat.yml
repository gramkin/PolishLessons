notes:
  - { kind: false-friend, text: "PLAKAT — и «плакат», и «афиша»: PLAKAT FILMOWY, «киноафиша». Слово книжное AFISZ тоже есть, но в обиходе говорят PLAKAT. Гуашь в школе — FARBY PLAKATOWE." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Родительный — PLAKATU, в местном T переходит в C: NA PLAKACIE." }
  - { kind: government, text: "На плакате — NA PLAKACIE, местный. Расклеить афиши — ROZWIESIĆ PLAKATY или ROZKLEIĆ PLAKATY. Плакат чего — родительный: PLAKAT FILMU." }
  - { kind: pronunciation, text: "Читается «пла́кат», ударение на первом слоге, а не на втором, как в русском «плака́т»." }
collocations:
  - { pl: "plakat filmowy", ru: "киноафиша" }
  - { pl: "rozwiesić plakaty", ru: "расклеить афиши" }
  - { pl: "polska szkoła plakatu", ru: "польская школа плаката" }
family:
