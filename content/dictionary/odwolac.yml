# review
id: odwolac
format: 2
lemma: "odwołać"
rank: 1890
pos: verb
aspect: perf
pron: { cyr: "одво́уаць" }
senses:
  - id: cancel
    ru: "отменить"
    examples:
      - pl: "Jack postanowił odwołać rezerwację."
        ru: "Джек решил отменить бронь."
        source: { kind: translated, id: 364183 }
      - pl: "Chciałbym odwołać jutrzejsze zebranie."
        ru: "Я хотел бы отменить завтрашнее собрание."
        source: { kind: translated, id: 972902 }
      - pl: "Z powodu deszczu musieliśmy odwołać mecz."
        ru: "Из-за дождя нам пришлось отменить матч."
        source: { kind: translated, id: 921507 }
      - pl: "Odwołali lot."
        ru: "Они отменили рейс."
        source: { kind: translated, id: 6547845 }
      - pl: "Zebranie zostało odwołane."
        ru: "Собрание отменили."
        source: { kind: translated, id: 361840 }
      - pl: "Wskutek ulewy mecz został odwołany."
        ru: "Из-за ливня матч отменили."
        source: { kind: tatoeba, id: 945823 }
  - id: retract
    ru: "отозвать, взять назад (слова, решение)"
    examples:
      - pl: "Odwołał wszystko, co powiedział."
        ru: "Он отозвал всё, что сказал."
        source: { kind: translated, id: 3743732 }
      - pl: "Odwołaj to, że jestem skąpy!"
        ru: "Возьми назад свои слова о том, что я скупой!"
        source: { kind: translated, id: 356473 }
  - id: appeal
    ru: "сослаться, прибегнуть; обжаловать (odwołać się)"
    examples:
      - pl: "Musiał odwołać się do przemocy."
        ru: "Ему пришлось прибегнуть к насилию."
        source: { kind: translated, id: 840253 }
      - pl: "Odwołali się od wyroku do sądu wyższej instancji."
        ru: "Они обжаловали приговор в суде высшей инстанции."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Главное значение — «отменить»: odwołać spotkanie, lot, mecz. В объявлениях особенно часта безличная форма odwołano «отменили»." }
  - { kind: usage, text: "Страдательные формы odwołany, odwołana, odwołane «отменён, отменена, отменены» — обычная надпись на табло и в новостях." }
  - { kind: usage, text: "odwołać się do czegoś — «сослаться на что-то, прибегнуть к чему-то»; odwołać się od decyzji — «обжаловать решение»." }
  - { kind: usage, text: "Несовершенный вид — odwoływać: odwołuję «отменяю» — odwołam «отменю»." }
collocations:
  - { pl: "odwołać spotkanie", ru: "отменить встречу" }
  - { pl: "odwołać lot", ru: "отменить рейс" }
  - { pl: "odwołać się od decyzji", ru: "обжаловать решение" }
etymology: "od- + wołać «звать» — буквально «отозвать», ровно как русское «отозвать». Значение «отменить» выросло из «отозвать распоряжение»."
memory: "odwołać — буквально «отозвать» (od + wołać «звать»), но чаще всего это «отменить»: odwołano lot «рейс отменили». А odwołać się — «сослаться» или «обжаловать»."
idioms:
  - { pl: "odwołać spotkanie", ru: "отменить встречу" }
  - { pl: "odwołać się od decyzji", ru: "обжаловать решение" }
  - { pl: "lot został odwołany", ru: "рейс отменён" }
