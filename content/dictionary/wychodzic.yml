# review
id: wychodzic
format: 2
lemma: "wychodzić"
rank: 394
pos: verb
aspect: imperf
aspectPair: wyjsc
pron: { cyr: "выхо́дзиць" }
senses:
  - id: leave
    ru: "выходить, уходить"
    examples:
      - pl: "O szóstej wychodzę."
        ru: "Я в шесть ухожу."
        source: { kind: tatoeba, id: 13045931 }
      - pl: "Kiedy wychodzisz, mógłbyś zamykać drzwi."
        ru: "Будешь уходить, закрой за собой двери."
        source: { kind: tatoeba, id: 921388 }
      - pl: "Ojciec zwykle wychodzi z domu, kiedy śpię."
        ru: "Отец обычно выходит из дома, когда я сплю."
        source: { kind: tatoeba, id: 13787759 }
  - id: marry
    ru: "выходить замуж (wychodzić za mąż)"
    examples:
      - pl: "Wychodzę za mąż w październiku."
        ru: "Я выхожу замуж в октябре."
        source: { kind: tatoeba, id: 3686946 }
      - pl: "Nie chcę wychodzić za pana za mąż."
        ru: "Я не хочу выходить за Вас замуж."
        source: { kind: tatoeba, id: 3466673 }
      - pl: "Nie chcę wychodzić za ciebie za mąż."
        ru: "Я не хочу выходить за тебя замуж."
        source: { kind: tatoeba, id: 3466670 }
notes:
  - { kind: usage, text: "wychodzić za mąż — «выходить замуж», буквально «выходить за мужа». Так говорят только о женщине; о мужчине — żeni się «женится»." }
  - { kind: usage, text: "Совершенный вид меняет корень: wyjść. wychodzić — «выходить регулярно», wyjść — «выйти один раз»." }
  - { kind: usage, text: "Глагол непереходный, поэтому страдательных причастий у него нет: форм вроде wychodzony не существует, хотя словарь форм их изобретает." }
  - { kind: usage, text: "nie wychodzić z podziwu — «не переставать удивляться»; wychodzić ze skóry — «из кожи вон лезть»." }
collocations:
  - { pl: "wychodzić za mąż", ru: "выходить замуж" }
  - { pl: "wychodzić z domu", ru: "выходить из дома" }
  - { pl: "wychodzić na jaw", ru: "выходить наружу, обнаруживаться" }
etymology: "Из wy- + chodzić; русское «выходить» собрано ровно из тех же двух частей."
memory: "wychodzić — «выходить», слово буква в букву русское. Главное выражение — wychodzić za mąż «выходить замуж», буквально «за мужа». А совершенный вид меняет корень до неузнаваемости: wyjść."
idioms:
  - { pl: "wychodzić za mąż", ru: "выходить замуж" }
  - { pl: "nie wychodzić z podziwu", ru: "не переставать удивляться" }
  - { pl: "wychodzić ze skóry", ru: "из кожи вон лезть" }
