# review
id: szalony
format: 2
lemma: "szalony"
rank: 676
pos: adj
pron: { cyr: "шало́ны" }
senses:
  - id: crazy
    ru: "сумасшедший, безумный (о человеке)"
    examples:
      - pl: "Jesteś szalony."
        ru: "Ты сумасшедший."
        source: { kind: tatoeba, id: 928165 }
      - pl: "Myślę, że Tom jest szalony."
        ru: "Думаю, что Том - сумасшедший."
        source: { kind: tatoeba, id: 3615650 }
      - pl: "Jestem szalona."
        ru: "Я сумасшедшая."
        source: { kind: translated, id: 8651094 }
  - id: thats-crazy
    ru: "szalone — безумие, это безумно"
    note: "Средний род работает самостоятельно."
    examples:
      - pl: "To szalone."
        ru: "Это безумие."
        source: { kind: translated, id: 565971 }
      - pl: "To kompletnie szalone."
        ru: "Это совершенно безумно."
        source: { kind: translated, id: 4437761 }
      - pl: "Życie jest szalone."
        ru: "Жизнь безумна."
        source: { kind: translated, id: 8774145 }
  - id: wild
    ru: "бешеный, неистовый (о чувстве, затее)"
    note: "szalona miłość, szalony pomysł."
    examples:
      - pl: "Miłość jest szalona."
        ru: "Любовь безумна."
        source: { kind: translated, id: 8608803 }
      - pl: "To był szalony pomysł."
        ru: "Это была безумная затея."
        source: { kind: authored }
      - pl: "Łączyła ich szalona miłość."
        ru: "Их связывала безумная любовь."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Корень знакомый: то же гнездо, что русские «шалить» и «шальной». szaleć значит «безумствовать»." }
  - { kind: usage, text: "Слово покрывает и человека (Jesteś szalony), и чувство или затею: szalona miłość «безумная любовь», szalony pomysł «безумная затея»." }
  - { kind: usage, text: "Средний род szalone работает самостоятельно: To szalone «Это безумие»." }
  - { kind: usage, text: "Степени сравнения описательные: bardziej szalony, najbardziej szalony. Простые формы szaleńszy словари приводят, но в живом языке они не встречаются." }
  - { kind: usage, text: "Родня: szaleć «безумствовать», szaleniec «безумец», szaleństwo «безумие»." }
collocations:
  - { pl: "To szalone", ru: "Это безумие" }
  - { pl: "szalona miłość", ru: "безумная любовь" }
  - { pl: "szalony pomysł", ru: "безумная затея" }
  - { pl: "szaleństwo", ru: "безумие" }
family:
