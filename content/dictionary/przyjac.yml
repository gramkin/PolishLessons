# review
id: przyjac
format: 2
lemma: "przyjąć"
rank: 405
pos: verb
aspect: perf
pron: { cyr: "пшы́йонць" }
senses:
  - id: accept
    ru: "принять (приглашение, извинения, подарок)"
    examples:
      - pl: "Tom przyjął przeprosiny."
        ru: "Том принял извинения."
        source: { kind: tatoeba, id: 8664460 }
      - pl: "Przyjąłem jego zaproszenie."
        ru: "Я принял его приглашение."
        source: { kind: tatoeba, id: 1184660 }
      - pl: "Chętnie przyjął naszą propozycję."
        ru: "Он с радостью принял наше предложение."
        source: { kind: tatoeba, id: 5198883 }
  - id: adopt
    ru: "принять (решение, метод, веру); допустить"
    examples:
      - pl: "Nasza szkoła przyjęła jego metody dydaktyczne."
        ru: "Наша школа приняла его метод преподавания."
        source: { kind: tatoeba, id: 567101 }
      - pl: "Przyjął islam."
        ru: "Он принял ислам."
        source: { kind: translated, id: 12239905 }
      - pl: "Przyjmijmy, że był to komplement."
        ru: "Давайте считать это комплиментом."
        source: { kind: tatoeba, id: 367154 }
notes:
  - { kind: usage, text: "Прошедшее время чередует носовые: przyjął в мужском роде, но przyjęła в женском. Так ведут себя все глаголы на -ąć." }
  - { kind: usage, text: "Настоящее и будущее берут другую основу: przyjmę, przyjmiesz, przyjmie — при прошедшем przyjął." }
  - { kind: usage, text: "Существительное przyjęcie значит и «принятие», и «приём, вечеринка»: Wydał huczne przyjęcie «Он устроил шумный приём»." }
  - { kind: usage, text: "Несовершенный вид — przyjmować. Przyjmijmy, że... — готовая формула «Допустим, что...»" }
collocations:
  - { pl: "przyjąć zaproszenie", ru: "принять приглашение" }
  - { pl: "przyjąć propozycję", ru: "принять предложение" }
  - { pl: "przyjąć do wiadomości", ru: "принять к сведению" }
  - { pl: "przyjęcie", ru: "приём, вечеринка" }
etymology: "Из przy- + jąć «взять» — старого глагола, уцелевшего в zająć, objąć, wziąć. Русское «принять» построено так же: «при-» + «-ять»."
memory: "przyjąć — «принять», и собрано как русское: przy- + jąć «взять». Прошедшее чередует носовые: przyjął в мужском роде, przyjęła в женском. А przyjęcie — это и «принятие», и «приём, вечеринка»."
idioms:
  - { pl: "mądry przyjmie radę, głupi nią wzgardzi", ru: "умный примет совет, глупый им пренебрежёт" }
  - { pl: "przyjąć do wiadomości", ru: "принять к сведению" }
  - { pl: "przyjmijmy, że...", ru: "допустим, что..." }
