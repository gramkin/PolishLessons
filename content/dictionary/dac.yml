# review
id: dac
format: 2
lemma: "dać"
rank: 61
pos: verb
aspect: perf
pron: { cyr: "даць" }
senses:
  - id: give
    ru: "дать, отдать"
    examples:
      - pl: "Proszę mi dać poduszkę i kołdrę."
        ru: "Дайте мне, пожалуйста, подушку и одеяло."
        source: { kind: tatoeba, id: 982763 }
      - pl: "Daj jej to."
        ru: "Дай это ей."
        source: { kind: tatoeba, id: 6155083 }
      - pl: "Dał jemu książkę."
        ru: "Он дал ему книгу."
        source: { kind: tatoeba, id: 3460226 }
  - id: manage
    ru: "в обороте dać radę — справиться; nie da się — невозможно"
    examples:
      - pl: "Dam ci pięć dolarów."
        ru: "Я дам тебе пять долларов."
        source: { kind: tatoeba, id: 591531 }
      - pl: "Taniej się nie da."
        ru: "Дешевле нельзя."
        source: { kind: tatoeba, id: 8665151 }
notes:
  - { kind: usage, text: "Управление как в русском: dać komuś coś «дать кому-то что-то»." }
  - { kind: usage, text: "Запомните два оборота: dać radę «справиться» (Dam radę «Я справлюсь») и nie da się «невозможно»." }
collocations:
  - { pl: "dać radę", ru: "справиться" }
  - { pl: "dać znać", ru: "дать знать" }
  - { pl: "dać spokój", ru: "оставить в покое" }
etymology: "Праславянское *dati — то же слово, что русское «дать»; ср. также «дар» и «давать»."
memory: "Значение и управление совпадают с русским, а вот два оборота надо выучить отдельно: dać radę «справиться» (Dasz radę? «Справишься?») и безличное nie da się «невозможно»."
idioms:
  - { pl: "dać radę", ru: "справиться" }
  - { pl: "dać znać", ru: "дать знать" }
  - { pl: "dać spokój", ru: "оставить в покое" }
  - { pl: "nie da się", ru: "невозможно" }
