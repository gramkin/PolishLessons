id: wniesc
format: 2
lemma: "wnieść"
rank: 3645
pos: verb
pron: { cyr: "внещць" }
senses:
  - id: carry-in
    ru: "внести (вещь в помещение)"
    examples:
      - pl: "Wniósł walizkę do pokoju."
        ru: "Он внёс чемодан в комнату."
        source: { kind: authored }
      - pl: "Tragarze wnieśli fortepian na górę."
        ru: "Грузчики внесли фортепиано наверх."
        source: { kind: authored }
  - id: contribute
    ru: "внести (вклад, лепту)"
    examples:
      - pl: "Wniósł duży wkład w rozwój firmy."
        ru: "Он внёс большой вклад в развитие фирмы."
        source: { kind: authored }
      - pl: "Nie wniosła nic nowego do dyskusji."
        ru: "Она не внесла ничего нового в обсуждение."
        source: { kind: authored }
  - id: file
    ru: "подать, внести (жалобу, иск, поправку)"
    examples:
      - pl: "Wniosła skargę do sądu."
        ru: "Она подала жалобу в суд."
        source: { kind: authored }
      - pl: "Można wnieść skargę w ciągu dwóch tygodni."
        ru: "Жалобу можно подать в течение двух недель."
        source: { kind: authored }
notes:
  - { kind: government, text: "wnieść coś — ВИНИТЕЛЬНЫЙ падеж: wnieść walizkę, wkład, skargę, poprawkę. Дополнением бывает и человек, когда его вносят на руках, поэтому мужсколичное wniesieni работает: zwycięzcy zostali wniesieni na rękach." }
  - { kind: pronunciation, text: "В мужском роде единственного числа прошедшего времени свободная форма — wniósł, с ó: on wniósł walizkę. Форма wniosł без ó самостоятельным словом не бывает: это основа, которая появляется только со слитным личным окончанием — wniosłem, wniosłeś, а также в формах wniosła, wniosło, wniosły." }
  - { kind: pronunciation, text: "В условном наклонении ó сохраняется: wniósłby, wniósłbym, wniósłbyś. Частица by начинается с согласного и не открывает слог после ł, так что перехода ó в o здесь нет. Форм wniosłby, wniosłbym, wniosłbyś в языке нет." }
  - { kind: false-friend, text: "Корень nieść — прямой родственник русского «нести», и wnieść отвечает «внести» приставка в приставку. Но в юридическом употреблении языки расходятся: польское wnieść skargę значит «подать жалобу», а по-русски говорят именно «подать», а не «внести» жалобу." }
collocations:
  - { pl: "wnieść walizkę", ru: "внести чемодан" }
  - { pl: "wnieść wkład", ru: "внести вклад" }
  - { pl: "wnieść skargę", ru: "подать жалобу" }
family:
  - { pl: "wnosić", ru: "вносить", relation: aspect }
  - { pl: "nieść", ru: "нести", relation: root }
  - { pl: "wniosek", ru: "заявление; вывод", relation: derived, id: wniosek }
etymology: "Приставка w- «внутрь» и глагол nieść, от праславянского *nesti. Русское «нести» — прямой родственник, и «внести» сложено из тех же двух частей. Из того же гнезда wniosek — и «заявление», которое вносят, и «вывод», к которому приходят."
memory: "wnieść = w- + nieść, буквально русское «внести». Запомни написание: on wniósł с ó, но ja wniosłem без ó — основа меняется, когда к ней прирастает личное окончание. А wnieść skargę значит «подать жалобу»."
idioms:
  - { pl: "wnieść wkład w coś", ru: "внести вклад во что-л." }
  - { pl: "wnieść skargę", ru: "подать жалобу" }
