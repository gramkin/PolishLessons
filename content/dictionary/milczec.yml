# review
id: milczec
format: 2
lemma: "milczeć"
rank: 2018
pos: verb
pron: { cyr: "ми́льчець" }
senses:
  - id: be-silent
    ru: "молчать"
    examples:
      - pl: "Milczał przez cały wieczór."
        ru: "Он молчал весь вечер."
        source: { kind: authored }
      - pl: "Milcz i słuchaj."
        ru: "Молчи и слушай."
        source: { kind: authored }
      - pl: "Gazety milczą o tej sprawie."
        ru: "Газеты молчат об этом деле."
        source: { kind: authored }
  - id: silence
    ru: "milczenie — молчание"
    examples:
      - pl: "Jego milczenie było gorsze od krzyku."
        ru: "Его молчание было хуже крика."
        source: { kind: authored }
      - pl: "Odpowiedział milczeniem."
        ru: "Он ответил молчанием."
        source: { kind: authored }
  - id: silent
    ru: "milczący — молчаливый, безмолвный"
    examples:
      - pl: "Milczący sąsiad kiwnął tylko głową."
        ru: "Молчаливый сосед только кивнул."
        source: { kind: authored }
      - pl: "Milcząca zgoda wystarczyła."
        ru: "Молчаливого согласия было достаточно."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ЭТО ТО ЖЕ СЛОВО, ЧТО РУССКОЕ «МОЛЧАТЬ», и разница только в одном звуке. Польское il отвечает русскому «ол»: milczeć — «молчать», wilk — «волк», pełny — «полный». Отсюда и milczenie «молчание», и milczący «молчаливый». Опираться на русский тут можно смело." }
  - { kind: government, text: "Молчат О чём — предлог o с ПРЕДЛОЖНЫМ, как по-русски: milczeć o tej sprawie, o przeszłości. Есть и книжный оборот milczeć na temat czegoś «молчать по поводу чего-то». Глагол непереходный, поэтому страдательного причастия у него нет вовсе." }
  - { kind: pronunciation, text: "ЧЕРЕДОВАНИЕ a и e В ПРОШЕДШЕМ, уже знакомое по pachnieć: milczał, но milczeli. Перед твёрдым согласным пишется a, перед мягким e, и мужско-личная форма множественного всегда тянет за собой e. Так же widział — widzieli, słyszał — słyszeli." }
  - { kind: register, text: "Повелительное milcz! звучит резко — это окрик, «молчать!». Вежливее будет proszę o ciszę. Зато milczenie в книжной речи совершенно нейтрально: minuta milczenia — «минута молчания»." }
collocations:
  - { pl: "milczeć jak grób", ru: "молчать как могила" }
  - { pl: "minuta milczenia", ru: "минута молчания" }
  - { pl: "milczeć o czymś", ru: "молчать о чём-л." }
family:
  - { pl: "milczenie", ru: "молчание", relation: derived }
  - { pl: "milczący", ru: "молчаливый", relation: derived }
  - { pl: "zamilknąć", ru: "замолчать, умолкнуть", relation: derived }
etymology: "Праславянское *mьlčati дало польское milczeć и русское «молчать» — одно слово. Слоговое l развилось в польском в il, а в русском в «ол», отсюда пары milczeć/«молчать», wilk/«волк», pełny/«полный». Из того же гнезда milczenie «молчание» и zamilknąć «умолкнуть»."
memory: "milczeć — «молчать», то же слово: польское il отвечает русскому «ол» (wilk «волк», pełny «полный»). Управление родное: milczeć O czymś. И обе поговорки совпадают: milczeć jak grób, milczenie jest złotem."
idioms:
  - { pl: "milczeć jak grób", ru: "молчать как могила" }
  - { pl: "milczenie jest złotem", ru: "молчание — золото" }
