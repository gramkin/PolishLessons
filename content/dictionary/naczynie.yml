etymology: "Сложено из приставки NA- и корня CZYN-, того же, что в CZYNIĆ «делать, совершать», и русское «чинить», «учинить», «починить» идут от него же. Исходный смысл прозрачен: сосуд — это сделанная вещь, изделие, нечто учинённое руками. Русский для той же вещи взял «посуду», от «судно» в старом значении всякой утвари, и «сосуд», от того же корня. Анатомическое значение в оба языка пришло позже, как перевод латинского VAS «сосуд», и здесь языки сошлись: и польское NACZYNIE, и русский «сосуд» обслуживают кухню и кровеносную систему сразу."
memory: "Главная поправка в числе: русская «посуда» собирательная и единственная, а польское naczynie означает одну вещь, вся посуда это naczynia во множественном. Поэтому pozmywaj naczynia, буквально «помой сосуды». Второе значение совпадает с русским: naczynia krwionośne «кровеносные сосуды». Корень от czynić «делать», то есть сосуд это изделие. Читается «начы́не», где cz это «ч», y это «ы». Родительный множественного naczyń, без окончания."
idioms:
