notes:
  - { kind: false-friend, text: "Разница тут не в значении, а в числе, и она сбивает каждого русскоязычного. Русская «посуда» — слово собирательное и стоит в единственном числе: «помой посуду». Польское NACZYNIE означает одну вещь, один сосуд, а вся посуда — это NACZYNIA, множественное число. Поэтому просьба звучит POZMYWAJ NACZYNIA, буквально «помой сосуды», и единственное число здесь будет ошибкой. То же во всех бытовых оборотах: NACZYNIA W ZLEWIE «посуда в раковине», ZMYWAĆ NACZYNIA «мыть посуду»." }
  - { kind: usage, text: "Восемь форм, средний род, родительный множественного NACZYŃ без окончания. Второе значение, анатомическое, работает так же свободно, как первое: NACZYNIA KRWIONOŚNE «кровеносные сосуды», NACZYNIA WŁOSOWATE «капилляры», CHOROBY NACZYNIOWE «сосудистые заболевания». Русский здесь тоже пользуется словом «сосуд», так что совпадение полное, и запоминать надо только бытовое значение с его обязательным множественным числом." }
  - { kind: government, text: "Сосуд для чего — предлог DO с родительным: NACZYNIE DO PIECZENIA «форма для запекания», или предлог NA с винительным, если речь о содержимом: NACZYNIE NA WODĘ «сосуд для воды». Мыть — ZMYWAĆ NACZYNIA, винительный, и это самый частый оборот. Отдельно стоит существительное ZMYWARKA «посудомоечная машина», от того же глагола ZMYWAĆ, то есть буквально «смывалка»." }
  - { kind: pronunciation, text: "Читается «начы́не», три слога, ударение на втором. Сочетание CZ даёт твёрдое «ч», а буква Y — «ы», поэтому середина слова «чы», а не «чи». Конечное NIE звучит как мягкое «не», где I только знак мягкости. В родительном множественного NACZYŃ слышно «на́чынь», с мягким «нь» на конце и без всякой гласной после него." }
  - { kind: register, text: "Слово нейтральное и ежедневное в первом значении, медицинское во втором. Частые обороты: ZMYWAĆ NACZYNIA «мыть посуду», NACZYNIA STOŁOWE «столовая посуда», NACZYNIE ŻAROODPORNE «жаропрочная форма», NACZYNIA KRWIONOŚNE «кровеносные сосуды». В разговоре о посуде часто обходятся без самого слова: ZMYWAĆ значит «мыть посуду» и без дополнения, как русское «мыть» в той же роли понятно не всегда." }
collocations:
