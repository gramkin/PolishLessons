pos: noun
pron: { cyr: "ну́да" }
senses:
  - id: boredom
    ru: "скука"
    examples:
      - pl: "Z nudów zaczął liczyć muchy."
        ru: "Со скуки он начал считать мух."
        source: { kind: authored }
      - pl: "Nuda zabija każdą miłość."
        ru: "Скука убивает любую любовь."
