notes:
  - { kind: false-friend, text: "Польская NUDA — просто «скука», без русского оттенка «нудности». NUDNY — «скучный»: NUDNY FILM — скучный фильм. NUDZIĆ SIĘ — «скучать от безделья»: NUDZĘ SIĘ — «мне скучно». А «скучать по кому-то» — совсем другое слово, TĘSKNIĆ. NUDZIARZ — «зануда»." }
  - { kind: usage, text: "Женский род. Со скуки — Z NUDÓW, с формой родительного множественного: так говорят гораздо чаще, чем Z NUDY. Множественное NUDY значит «скукотища»: ALE NUDY! — «ну и тоска!». В дательном и местном падежах D смягчается: NUDZIE." }
  - { kind: government, text: "Со скуки — Z NUDÓW, родительный. Умирать со скуки — UMIERAĆ Z NUDÓW. Поддаться скуке — PODDAĆ SIĘ NUDZIE, дательный. Долой скуку — KONIEC Z NUDAMI, творительный." }
  - { kind: pronunciation, text: "Читается «ну́да», два слога, ударение на первом. В форме NUDZIE сочетание DZI даёт мягкое «дз»: «ну́дзе»." }
  - { kind: register, text: "Слово нейтральное, а множественное NUDY и рифмованное NUDY NA PUDY — разговорные, шутливые. В рекламе и афишах любят KONIEC Z NUDAMI — «долой скуку»." }
collocations:
  - { pl: "śmiertelna nuda", ru: "смертная скука" }
  - { pl: "z nudów", ru: "со скуки" }
  - { pl: "zabić nudę", ru: "убить скуку" }
family:
  - { pl: "nudny", ru: "скучный", relation: derived, id: nudny }
  - { pl: "nudzić", ru: "надоедать; скучать (nudzić się)", relation: derived }
  - { pl: "nudziarz", ru: "зануда", relation: derived }
etymology: "Слово праславянское, от корня со значением «принуждение», того же, что в русских «нудить», «принуждать» и «нужда». В польском NUDA ушла к значению «тягостное безделье, скука», а в русском «нудный» сохранил оттенок тягостного."
memory: "Nuda — скука; nudny — скучный, nudzić się — скучать от безделья. Читается «ну́да». Со скуки — z nudów. Umierać z nudów — умирать со скуки, nudy na pudy — скука смертная. Скучать по кому-то — tęsknić."
idioms:
  - { pl: "umierać z nudów", ru: "умирать со скуки" }
  - { pl: "nudy na pudy", ru: "скука смертная" }
formExamplesSkip:
  - { form: "nudowie", reason: "личное множественное у абстрактного слова; не употребляется" }
  - { form: "nud", reason: "редкая форма родительного множественного; обычно говорят NUDÓW: Z NUDÓW" }
