  - id: drag
    ru: "скукотища, тоска (мн. NUDY)"
    examples:
      - pl: "Ten film to straszne nudy."
        ru: "Этот фильм — страшная скукотища."
        source: { kind: authored }
      - pl: "Ale nudy na tej imprezie!"
        ru: "Ну и скука на этой вечеринке!"
