# review
id: smietnik
format: 2
lemma: "śmietnik"
rank: 4304
pos: noun
pron: { cyr: "сьме́тник" }
senses:
  - id: bin
    ru: "мусорный бак, помойка"
    examples:
      - pl: "Wyrzuć śmieci do śmietnika."
        ru: "Выброси мусор в бак."
        source: { kind: authored }
      - pl: "Śmietnik stoi za blokiem."
        ru: "Мусорный бак стоит за домом."
        source: { kind: authored }
      - pl: "Koty szukały jedzenia przy śmietniku."
        ru: "Кошки искали еду у помойки."
        source: { kind: authored }
  - id: mess
    ru: "свалка, бардак (перен.)"
    examples:
      - pl: "W twoim pokoju jest prawdziwy śmietnik."
        ru: "В твоей комнате настоящая свалка."
        source: { kind: authored }
      - pl: "Ta ideologia trafiła na śmietnik historii."
        ru: "Эта идеология попала на свалку истории."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ŚMIETNIK — место или бак для мусора, от ŚMIECI «мусор». Сам мусор — во множественном: WYNIEŚĆ ŚMIECI — «вынести мусор», а единственное ŚMIEĆ — «соринка» или, грубо о человеке, «отброс». Мусоровоз — ŚMIECIARKA, совок — ŚMIETNICZKA." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Родительный — ŚMIETNIKA, с окончанием -A. В разговоре ŚMIETNIK — ещё и «бардак, свалка»: ALE ŚMIETNIK! — «ну и бардак!»." }
  - { kind: government, text: "Выбросить в мусорку — WYRZUCIĆ DO ŚMIETNIKA, DO с родительным. Найти на помойке — ZNALEŹĆ NA ŚMIETNIKU, местный. У помойки — PRZY ŚMIETNIKU." }
  - { kind: pronunciation, text: "Читается «сьме́тник», два слога, ударение на первом. Ś даёт «сь», MIE — «ме», как в ŚMIEĆ «сьмець». В форме ŚMIETNIKU: «сьметни́ку»." }
  - { kind: register, text: "ŚMIETNIK HISTORII — «свалка истории», газетное, о том, что безвозвратно устарело. В быту говорят и ŚMIETNIK, и KOSZ NA ŚMIECI — «мусорное ведро»." }
collocations:
  - { pl: "osiedlowy śmietnik", ru: "дворовая помойка" }
  - { pl: "wyrzucić do śmietnika", ru: "выбросить в мусорку" }
  - { pl: "przy śmietniku", ru: "у помойки" }
family:
  - { pl: "smiec", ru: "соринка; мусор (мн. śmieci)", relation: root, id: smiec }
  - { pl: "smieciarka", ru: "мусоровоз", relation: derived }
  - { pl: "smietniczka", ru: "совок для мусора", relation: derived }
etymology: "От ŚMIECI «мусор», а тот от глагола со значением «мести», того же, что русское «смести»: мусор — то, что сметено. Польское Ś на месте русского «с» — мягкость перед «м», как в ŚMIAĆ SIĘ и «смеяться»."
memory: "Śmietnik — мусорный бак, помойка; śmieci — мусор. Читается «сьме́тник». Wyrzucić do śmietnika — выбросить в мусорку. Śmietnik historii — свалка истории. Родня русского «смести»."
idioms:
  - { pl: "śmietnik historii", ru: "свалка истории" }
  - { pl: "wyrzucić na śmietnik", ru: "выбросить на помойку" }
