notes:
  - { kind: usage, text: "Форм одиннадцать, степеней сравнения нет: кредитным предмет либо является, либо нет. Это уже четвёртое такое прилагательное рядом с fizyczny и miejscowy, и у всех причина одна — они относят к разряду, а не измеряют качество. Противоположность им słoneczny и bystry с их тридцатью тремя формами." }
  - { kind: usage, text: "Суффикс -owy в польском и есть обычный знак относительности, там где русский берёт -ный или -овый: kredytowy — кредитный, bankowy — банковский, domowy — домашний, samochodowy — автомобильный. Зная это соответствие, прилагательные от заимствованных существительных можно строить почти механически." }
collocations:
  - { pl: "karta kredytowa", ru: "кредитная карта" }
  - { pl: "zdolność kredytowa", ru: "кредитоспособность" }
  - { pl: "limit kredytowy", ru: "кредитный лимит" }
family:
  - { pl: "kredyt", ru: "кредит", relation: root }
  - { pl: "kredytować", ru: "кредитовать", relation: derived }
  - { pl: "kredytobiorca", ru: "заёмщик", relation: derived }
etymology: "От KREDYT, из латинского creditum «ссуда», причастия от credere «верить, доверять». Корень доверия виден и в «кредо», и в «кредитоспособности»: дать кредит значит поверить на слово. Оба языка взяли существительное из западноевропейского обихода, а прилагательное построили каждый своим суффиксом, польский через -owy, русский через -ный."
memory: "Одиннадцать форм, степеней нет: разряд не градуируется. А суффикс -owy отвечает нашему -ный: kredytowy, bankowy, domowy."
idioms:
