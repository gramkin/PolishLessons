pos: adj
pron: { cyr: "пия́ны" }
senses:
  - id: drunk
    ru: "пьяный"
    examples:
      - pl: "Jestem pijana."
        ru: "Я пьяна."
        source: { kind: tatoeba, id: 5454480 }
      - pl: "Czy Tom jest pijany?"
        ru: "Том пьяный?"
        source: { kind: tatoeba, id: 13547180 }
      - pl: "Jesteś zbyt pijany, by prowadzić samochód."
        ru: "Ты слишком пьян, чтобы вести машину."
        source: { kind: tatoeba, id: 4719314 }
  - id: po-pijanemu
    ru: "po pijanemu — спьяну, в нетрезвом виде"
    examples:
      - pl: "Zrobiłem to po pijanemu."
        ru: "Я сделал это спьяну."
        source: { kind: translated, id: 6566910 }
      - pl: "Prowadzenie po pijanemu może być niebezpieczne."
        ru: "Вождение в пьяном виде может быть опасным."
        source: { kind: translated, id: 352902 }
notes:
  - { kind: usage, text: "po pijanemu — «спьяну, в нетрезвом виде», застывшее наречное сочетание с дательным: prowadzić po pijanemu. В корпусе форма pijanemu почти всегда именно из этого оборота." }
  - { kind: usage, text: "От pić «пить». Антоним — trzeźwy «трезвый», существительное — pijak «пьяница»." }
  - { kind: usage, text: "Есть и переносное значение: pijana ze szczęścia «пьяная от счастья»." }
  - { kind: usage, text: "Как существительное значит «пьяный (человек)»: Pijanym wstęp wzbroniony «Пьяным вход воспрещён»." }
collocations:
  - { pl: "po pijanemu", ru: "спьяну" }
  - { pl: "pijany kierowca", ru: "пьяный водитель" }
  - { pl: "pijany jak bela", ru: "пьян в стельку" }
etymology: "Страдательное причастие от pić «пить» (праславянское *piti). Русское «пьяный» того же корня, так что слово читается насквозь."
memory: "pijany — «пьяный», от pić «пить», как и русское слово. Запомните застывший оборот po pijanemu «спьяну»: prowadzić po pijanemu. И переносное pijany ze szczęścia «пьяный от счастья»."
idioms:
  - { pl: "po pijanemu", ru: "спьяну" }
  - { pl: "pijany jak bela", ru: "пьян в стельку" }
  - { pl: "pijany ze szczęścia", ru: "пьяный от счастья" }
