notes:
  - { kind: false-friend, text: "SZOPA — «сарай, навес». Хлев — OBORA, амбар — STODOŁA. В разговоре SZOPA — «копна волос». SZOPKA — «вертеп, рождественская сценка», а также «балаган»." }
  - { kind: usage, text: "Девять форм, женский род. В местном P смягчается: W SZOPIE. Родительный множественного — SZOP. Звательный SZOPO не употребляется." }
  - { kind: government, text: "В сарае — W SZOPIE, местный. В сарай — DO SZOPY, родительный. За сараем — ZA SZOPĄ, творительный." }
  - { kind: pronunciation, text: "Читается «шо́па»: SZ — «ш», ударение на первом слоге. SZOPIE — «шо́пе»." }
collocations:
