      - pl: "Nie ulegaj temu szaleństwu."
        ru: "Не поддавайся этому безумию."
        source: { kind: translated, id: 6160999 }
  - id: undergo
    ru: "подвергаться: ULEGAĆ ZMIANOM «меняться», ULEGAĆ ZNISZCZENIU «разрушаться»"
    examples:
      - pl: "Czy opłata ulega zmianie przy zmianie rezerwacji?"
        ru: "Меняется ли плата при изменении бронирования?"
        source: { kind: translated, id: 695747 }
      - pl: "Kiedy materia ulega zmianie chemicznej, uwalnia się energia chemiczna."
        ru: "Когда вещество претерпевает химическое изменение, выделяется химическая энергия."
        source: { kind: translated, id: 355566 }
      - pl: "Ceny ulegają zmianom co miesiąc."
        ru: "Цены меняются каждый месяц."
        source: { kind: authored }
  - id: lose-to
    ru: "уступать, проигрывать (сопернику)"
    examples:
      - pl: "Ulegaliśmy rywalom w każdym meczu."
        ru: "Мы уступали соперникам в каждом матче."
        source: { kind: authored }
      - pl: "Na boisku rzadko ulegamy rywalom."
        ru: "На поле мы редко уступаем соперникам."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ULEGAĆ — «поддаваться, уступать», а не «улегаться»: «улечься, лечь» — POŁOŻYĆ SIĘ, KŁAŚĆ SIĘ, а «буря улеглась» — BURZA UCICHŁA. Корень тот же, что в «лечь», но польский увёл его к смыслу «лечь под кого-то», то есть подчиниться." }
  - { kind: usage, text: "Несовершенный вид, пара — ULEC: ULEGAM, ULEGASZ, ULEGAJĄ — обычное спряжение на -AĆ, без чередований. Пятьдесят две формы: сорок одна от глагола, десять от причастия ULEGAJĄCY и отглагольное ULEGANIE. Страдательного причастия нет: глагол непереходный. NIE ULEGA WĄTPLIWOŚCI «не подлежит сомнению» — застывший оборот, всегда в этой форме." }
  - { kind: government, text: "Кому или чему — дательный: ULEGAĆ PRESJI, POKUSOM, MODZIE, RYWALOM. С отглагольным существительным получается почти пассив: ULEGAĆ ZMIANOM «меняться», ULEGAĆ ZNISZCZENIU «разрушаться», ULEGAĆ ZEPSUCIU «портиться». Отсюда PRODUKTY ULEGAJĄCE ZEPSUCIU — «скоропортящиеся продукты»." }
  - { kind: pronunciation, text: "Читается «уле́гаць», ударение на втором слоге. ULEGAM — «уле́гам», ULEGAJĄ — «улега́йоу̃»: носовое на конце. В ULEGAŁEM ударение сдвигается: «улега́уэм», Ł — «у»." }
  - { kind: register, text: "Книжное и газетное слово. ULEGAĆ ZMIANOM, ULEGAĆ ZNISZCZENIU — язык объявлений и отчётов. В разговоре вместо «уступать» чаще DAWAĆ SIĘ NAMÓWIĆ, USTĘPOWAĆ, а вместо «меняться» — ZMIENIAĆ SIĘ." }
collocations:
  - { pl: "ulegać pokusom", ru: "поддаваться искушениям" }
  - { pl: "ulegać zmianom", ru: "меняться" }
  - { pl: "produkty ulegające zepsuciu", ru: "скоропортящиеся продукты" }
family:
  - { pl: "ulec", ru: "поддаться, уступить", relation: aspect, id: ulec }
  - { pl: "uległy", ru: "покорный, уступчивый", relation: derived }
  - { pl: "uległość", ru: "покорность", relation: derived }
  - { pl: "lec", ru: "лечь (книжн.)", relation: root }
synonyms: ["ustępować", "poddawać się"]
etymology: "Несовершенная пара к ULEC: приставка U- плюс корень LEG-, тот же, что в старом LEC «лечь» и в русском «лечь, полегать», праславянское *legti, *legati. Суффикс -AĆ делает из однократного действия длительное или повторяющееся, как в русском «лечь — ложиться». Смысл «поддаваться» вырос из «ложиться под кого-то, склоняться перед кем-то»."
memory: "Ulegać — поддаваться: ulegam pokusom, «поддаюсь искушениям». Всегда с дательным. Ulegać zmianom — меняться. Nie ulega wątpliwości — «не подлежит сомнению». Пара — ulec. Читается «уле́гаць»."
idioms:
  - { pl: "nie ulega wątpliwości", ru: "не подлежит сомнению" }
  - { pl: "ulegać pokusom", ru: "поддаваться искушениям" }
