# review
id: ulegac
format: 2
lemma: "ulegać"
rank: 6039
pos: verb
pron: { cyr: "уле́гаць" }
senses:
  - id: yield
    ru: "поддаваться, уступать (давлению, искушению, уговорам)"
    examples:
      - pl: "Młodzi ludzie łatwo ulegają pokusom."
