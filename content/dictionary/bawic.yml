# review
id: bawic
format: 2
lemma: "bawić"
rank: 470
pos: verb
aspect: imperf
pron: { cyr: "ба́виць" }
senses:
  - id: play
    ru: "играть, веселиться (bawić się)"
    examples:
      - pl: "Tylko się bawiliśmy."
        ru: "Мы просто играли."
        source: { kind: tatoeba, id: 13547085 }
      - pl: "Wczoraj bawiłem się z Tony."
        ru: "Вчера я играл с Тони."
        source: { kind: tatoeba, id: 529594 }
      - pl: "Koty lubią bawić się w słońcu."
        ru: "Кошки любят играть на солнце."
        source: { kind: tatoeba, id: 588395 }
  - id: amuse
    ru: "развлекать, забавлять (bawić kogoś — без się)"
    examples:
      - pl: "To mnie nie bawi."
        ru: "Меня это не забавляет."
        source: { kind: authored }
      - pl: "Bawił nas przez cały wieczór."
        ru: "Он развлекал нас весь вечер."
        source: { kind: authored }
      - pl: "Jego żarty nikogo nie bawiły."
        ru: "Его шутки никого не забавляли."
        source: { kind: authored }
notes:
  - { kind: usage, text: "się переворачивает смысл: bawić kogoś — «развлекать кого-то», bawić się — «играть, веселиться». Без się глагол требует дополнения." }
  - { kind: false-friend, text: "Играют czymś — творительным без предлога: bawić się ogniem «играть с огнём», bawić się lalką «играть куклой». Русское «с» здесь лишнее." }
  - { kind: usage, text: "bawić się w coś — «играть во что-то»: bawić się w chowanego «играть в прятки», bawić się w berka «играть в салки»." }
  - { kind: usage, text: "Dobrze się bawić — «хорошо проводить время». Baw się dobrze! — обычное пожелание «Повеселись!», а Dobrze się bawiłeś? — «Тебе понравилось?»" }
collocations:
  - { pl: "bawić się", ru: "играть, веселиться" }
  - { pl: "dobrze się bawić", ru: "хорошо проводить время" }
  - { pl: "bawić się ogniem", ru: "играть с огнём" }
  - { pl: "baw się dobrze!", ru: "повеселись!" }
etymology: "Праславянское *baviti — каузатив к *byti «быть», то есть «заставлять пребывать, задерживать». Русская «забава» и «забавлять» — то же гнездо; отсюда и книжное польское bawić «пребывать» (bawić w Warszawie)."
memory: "bawić — родня русской «забаве», и всё держится на się. bawić kogoś — «развлекать кого-то», bawić się — «играть, веселиться». Падеж запомните отдельно: играют творительным без предлога — bawić się ogniem «играть с огнём», bawić się lalką «играть куклой». А Baw się dobrze! — это обычное «Повеселись!»"
idioms:
  - { pl: "bawić się w kotka i myszkę", ru: "играть в кошки-мышки" }
  - { pl: "bawić się czyimś kosztem", ru: "развлекаться за чужой счёт" }
  - { pl: "baw się dobrze!", ru: "хорошо повеселись!" }
