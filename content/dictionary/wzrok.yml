# review
id: wzrok
format: 2
lemma: "wzrok"
rank: 1876
pos: noun
pron: { cyr: "взрок" }
senses:
  - id: eyesight
    ru: "зрение"
    examples:
      - pl: "Ma dobry wzrok."
        ru: "У него хорошее зрение."
        source: { kind: translated, id: 1350545 }
      - pl: "Mam marny wzrok."
        ru: "У меня плохое зрение."
        source: { kind: translated, id: 732921 }
      - pl: "Tom stracił wzrok."
        ru: "Том потерял зрение."
        source: { kind: translated, id: 12180514 }
  - id: gaze
    ru: "взгляд"
    examples:
      - pl: "Odwrócić wzrok."
        ru: "Отвести взгляд."
        source: { kind: translated, id: 5660018 }
      - pl: "Nie patrz na mnie takim wzrokiem."
        ru: "Не смотри на меня таким взглядом."
        source: { kind: translated, id: 3760143 }
      - pl: "Unikał jej wzroku."
        ru: "Он избегал её взгляда."
        source: { kind: translated, id: 6671273 }
notes:
  - { kind: false-friend, text: "Одно слово покрывает два русских: «зрение» (stracić wzrok «потерять зрение») и «взгляд» (odwrócić wzrok «отвести взгляд»). Контекст решает." }
  - { kind: government, text: "Смотреть каким-то взглядом — patrzeć jakimś wzrokiem (творительный падеж): patrzyła na niego gniewnym wzrokiem." }
  - { kind: usage, text: "zasięg wzroku — «поле зрения»: zniknął z zasięgu wzroku «он скрылся из виду»." }
  - { kind: usage, text: "Глаз — oko, а зрение как чувство — wzrok; проверить зрение — zbadać wzrok." }
collocations:
  - { pl: "stracić wzrok", ru: "потерять зрение" }
  - { pl: "odwrócić wzrok", ru: "отвести взгляд" }
  - { pl: "zasięg wzroku", ru: "поле зрения" }
family:
