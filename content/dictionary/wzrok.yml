  - { pl: "oko", ru: "глаз", relation: root, id: oko }
  - { pl: "widzieć", ru: "видеть", relation: root, id: widziec }
etymology: "От wzrok, того же корня, что zrok и русское «зрак», «зрение». Значение «взгляд» развилось из «зрения»."
memory: "wzrok — сразу «зрение» и «взгляд»: stracić wzrok «потерять зрение», odwrócić wzrok «отвести взгляд». Глаз — oko, отдельное слово."
