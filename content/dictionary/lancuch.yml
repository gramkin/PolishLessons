        source: { kind: authored }
  - id: chains
    ru: "оковы, цепи (в переносном смысле)"
    examples:
      - pl: "Uwolnij się od łańcuchów, które cię przywiązują!"
        ru: "Освободись от цепей, которые тебя связывают!"
        source: { kind: translated, id: 10770957 }
      - pl: "Łańcuch górski ciągnie się na południe."
        ru: "Горная цепь тянется на юг."
