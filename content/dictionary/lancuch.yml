notes:
  - { kind: government, text: "Мужской неодушевлённый; родительный — łańcucha. Приковать цепью — przykuć łańcuchem, творительный падеж." }
  - { kind: false-friend, text: "Заимствовано из немецкого Lannzug через средневековье. Русская «цепь» — другого корня, так что опереться на родство не получится." }
  - { kind: usage, text: "Переносные употребления те же, что в русском: łańcuch górski «горная цепь», łańcuch pokarmowy «пищевая цепь», łańcuch wydarzeń «цепь событий»." }
  - { kind: usage, text: "Уменьшительное łańcuszek значит «цепочка» — то, что носят на шее." }
collocations:
  - { pl: "łańcuch górski", ru: "горная цепь" }
  - { pl: "przykuć łańcuchem", ru: "приковать цепью" }
etymology: "Заимствование из немецкого; русская «цепь» — другого корня."
memory: "łańcuch — «цепь», и переносные значения те же, что в русском: łańcuch górski, łańcuch pokarmowy. Цепочка на шею — łańcuszek."
idioms:
  - { pl: "łańcuch górski", ru: "горная цепь" }
formExamplesSkip:
