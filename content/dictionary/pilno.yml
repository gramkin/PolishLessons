# review
id: pilno
format: 2
lemma: "pilno"
rank: 2241
pos: adv
pron: { cyr: "пи́льно" }
senses:
  - id: diligently
    ru: "прилежно, усердно (в сравнительной степени)"
    examples:
      - pl: "Musisz uczyć się pilniej."
        ru: "Тебе нужно учиться прилежнее."
        source: { kind: translated, id: 880975 }
      - pl: "Powinienem był pilniej uczyć się francuskiego."
        ru: "Мне следовало прилежнее учить французский."
        source: { kind: translated, id: 12294392 }
      - pl: "Uczył się coraz pilniej, bo nauczyciel go chwalił."
        ru: "Он учился всё прилежнее, потому что учитель его хвалил."
        source: { kind: translated, id: 440448 }
  - id: most-diligently
    ru: "прилежнее всех"
    examples:
      - pl: "On pracuje najpilniej w klasie."
        ru: "Он работает прилежнее всех в классе."
        source: { kind: translated, id: 4830017 }
      - pl: "Uczy się najpilniej z całej grupy."
        ru: "Он учится прилежнее всех в группе."
        source: { kind: authored }
notes:
  - { kind: usage, text: "В корпусе живут только сравнительные формы pilniej и najpilniej «прилежнее, прилежнее всех». Положительная степень pilnie тоже существует, но здесь не засвидетельствована." }
  - { kind: false-friend, text: "Есть и второе, безличное употребление: pilno mi «мне не терпится, я спешу». Оно к прилежанию отношения не имеет и в корпусе не встречается." }
  - { kind: government, text: "Наречие от pilny, у которого два значения — «прилежный» и «срочный». Отсюда двойственность и у наречия." }
  - { kind: usage, text: "Сравнительная степень образуется неправильно: pilno — pilniej — najpilniej." }
collocations:
  - { pl: "uczyć się pilniej", ru: "учиться прилежнее" }
  - { pl: "pilno mi", ru: "мне не терпится" }
etymology: "Наречие от pilny «прилежный; срочный»; ср. русское «пильно» в старых говорах."
memory: "pilno — «прилежно», и в корпусе живут только степени pilniej и najpilniej. Отдельно стоит безличное pilno mi «мне не терпится»."
