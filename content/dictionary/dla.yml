notes:
  - { kind: government, text: "dla требует родительного падежа, как русское «для»: dla mnie, dla ciebie, dla dzieci." }
collocations:
  - { pl: "dla mnie", ru: "для меня" }
  - { pl: "dla przykładu", ru: "для примера" }
etymology: "Старопольское dziela из праславянского *dьľa «возле, ради», от *dьľa «длина»; ср. русское «для» и «ради»."
memory: "dla = «для» с родительным падежом. Но там, где по-русски «мне», поляк обходится дательным без предлога: Daj mi «Дай мне», а не dla mnie."
idioms:
  - { pl: "dla zasady", ru: "из принципа" }
  - { pl: "dla świętego spokoju", ru: "ради спокойствия" }
