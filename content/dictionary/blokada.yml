etymology: "От BLOKOWAĆ, а то — от BLOK, слова, пришедшего через немецкий из французского. Русская «блокада» явилась тем же путём, через французский, поэтому слова почти совпадают. Разошлись языки не в корне, а в употреблении: у нас слово осталось при осаде, у поляков разошлось по всему быту. А польское BLOK обзавелось в прошлом веке и жилищным смыслом, которого русский «блок» не знает: мы на это говорим «панельный дом»."
memory: "Не только блокада, а всякая помеха: blokada drogi это перекрытие дороги, blokada karty — блокировка карты, blokada psychiczna — внутренний барьер. Русское слово осталось при осаде, польское разошлось по быту. Читается «блока́да», где lo звучит твёрдо. В местном падеже d переходит в dzi: w blokadzie. И запомните корень: blok по-польски ещё и панельный дом."
