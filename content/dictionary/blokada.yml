notes:
  - { kind: false-friend, text: "Русская «блокада» почти всегда военная, про осаждённый город. Польская BLOKADA бывает и такой, но гораздо чаще значит обычную помеху: BLOKADA DROGI это перекрытие дороги, BLOKADA KIEROWNICY — блокировка руля, BLOKADA NA KOŁO — тот самый башмак, что надевают на колесо. А BLOKADA PSYCHICZNA это внутренний барьер. Запомните и корень: BLOK по-польски значит ещё и панельный дом, и MIESZKAM W BLOKU — «живу в многоэтажке»." }
  - { kind: usage, text: "Десять форм, женский род. В дательном и местном падежах D переходит в DZI: BLOKADA, но W BLOKADZIE. Так же устроены WYPAD и ZASŁUGA со своими чередованиями. В родительном множественного окончания нет: BLOKAD. Глагол ODBLOKOWAĆ значит «разблокировать» и годится и для руля, и для телефона, и для дороги." }
  - { kind: government, text: "Перекрытие дороги — BLOKADA DROGI, родительный без предлога. Снять блокировку — ZDJĄĆ BLOKADĘ, винительный. В блокаде — W BLOKADZIE, местный с переходом D в DZI. Под блокадой — POD BLOKADĄ, творительный, и так говорят об осаждённом городе: MIASTO POD BLOKADĄ." }
  - { kind: pronunciation, text: "Читается «блока́да», три слога, ударение на предпоследнем. Сочетание BL произносится слитно, а L перед гласной O звучит твёрдо, как «ло», а не «лё». Слово читается почти так же, как русское, и для русского уха оно одно из самых простых в этом разделе словаря." }
  - { kind: register, text: "Слово и газетное, и бытовое. В новостях это BLOKADA DROGI, которую устраивают земледельцы, и BLOKADA PORTU. На парковке — BLOKADA NA KOŁO. В телефоне и в банке — BLOKADA KARTY «блокировка карты». А BLOKADA PSYCHICZNA пришла из психологии и прижилась в обиходной речи: говорят MAM BLOKADĘ, когда не могут начать." }
