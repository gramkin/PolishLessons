notes:
  - { kind: false-friend, text: "Значение совпадает с русским полностью, и ловушка здесь только в написании и чтении. Польский ставит Y там, где русский пишет И после твёрдой согласной, и произносит её как «ы»: MEDYCYNA читается «мэдыцы́на», а не «медицина». Это шестой случай того же правила в словаре, после DYSK, DYSKUSJA, SYSTEM, DYSCYPLINA и INSTYNKT, так что к нему пора привыкнуть. Обратите внимание и на E: оно даёт «э» и предыдущую согласную не смягчает, поэтому первый слог звучит «мэ», а не «ме»." }
  - { kind: usage, text: "Разделение между наукой и средством в обоих языках одинаковое, и переносить его не нужно: MEDYCYNA — это наука и область, а лекарство — LEK или LEKARSTWO, как русские «медицина» и «лекарство». Устойчивые сочетания стоит выучить блоком: MEDYCYNA RODZINNA «семейная медицина», MEDYCYNA LUDOWA «народная медицина», MEDYCYNA SĄDOWA «судебная медицина», AKADEMIA MEDYCZNA. Множественное число MEDYCYNY встречается только в значении «отрасли, виды медицины» и звучит специально." }
  - { kind: government, text: "Женский род на -A, склонение правильное. Винительный на -Ę: STUDIUJE MEDYCYNĘ, и обратите внимание: «учиться на медицине» по-польски будет STUDIOWAĆ MEDYCYNĘ, с прямым винительным и без всякого предлога, тогда как русский вставляет «на». Это общее правило для названий изучаемых предметов: STUDIOWAĆ PRAWO «учиться на юридическом», STUDIOWAĆ FIZYKĘ. Местный на -IE: W MEDYCYNIE. При отрицании винительный уходит в родительный: NIE STUDIUJE MEDYCYNY." }
  - { kind: pronunciation, text: "Читается «мэдыцы́на», ударение на предпоследнем слоге, то есть на -CY-. Обе Y дают «ы», и обе согласные перед ними остаются твёрдыми: «ды» и «цы». Буква C без следующей I читается «ц». В местном падеже MEDYCYNIE сочетание NIE даёт мягкое «не»: «мэдыцы́не». Русское слово длиннее на звук и мягче почти всюду, так что произношение приходится перестраивать целиком, хотя слово узнаётся сразу." }
