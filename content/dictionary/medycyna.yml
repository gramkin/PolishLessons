etymology: "Из латинского MEDICINA, от MEDICUS «врач» и далее от MEDERI «лечить, исцелять». Русское «медицина» пришло тем же путём, через латынь учёных текстов, поэтому слова совпадают до суффикса. Корень MEDERI означал первоначально «обдумывать, принимать меру» и связан с латинским MODUS «мера» и MEDITARI «размышлять»: врачевание понималось как умение соблюсти меру. Отсюда же польское MEDYK «медик», MEDYCZNY, и слова другого ряда — MODERACJA, MODA. Суффикс -YNA в польском обычно образует названия веществ и областей: BENZYNA, WITAMINA, MEDYCYNA, и по нему такое слово легко узнать."
memory: "Шестой случай правила y за русское и: «мэдыцы́на», как dysk, system, instynkt. Наука — medycyna, лекарство — lek или lekarstwo, точно как в русском. «Учиться на медицинском» — studiować medycynę, прямой винительный без предлога. От латинского mederi «лечить», родня слову modus «мера»: врачевание как соблюдение меры."
