notes:
  - { kind: false-friend, text: "Корень слова русскому понятен, но результат другой. Польское zabawa отвечает русской «забаве», однако zabawka значит не «забавка», а ИГРУШКА — предмет, которым играют. И ещё: польское zabawa в обиходе значит «вечеринка, танцы» (idziemy na zabawę «идём на вечеринку»), а не только «забава»." }
  - { kind: usage, text: "Уменьшительное от zabawa с суффиксом -ka. Дательный и предложный совпадают: zabawce, с чередованием k → c. Родительный множественного — zabawek, с беглым e." }
  - { kind: government, text: "Играть чем-то — творительный с глаголом bawić się: bawić się zabawką «играть игрушкой». Внимание на расхождение с русским: по-русски «играть В игрушку», по-польски без предлога и в творительном." }
  - { kind: pronunciation, text: "Звательный падеж у неодушевлённых существительных формально есть, но в живой речи почти не встречается: его берегут для стихов, песен и шутливого обращения к вещи. Примеры в этом слоте именно такие — запоминать их как образец повседневной речи не нужно." }
collocations:
  - { pl: "bawić się zabawką", ru: "играть игрушкой" }
  - { pl: "zepsuta zabawka", ru: "сломанная игрушка" }
  - { pl: "pudło zabawek", ru: "коробка игрушек" }
family:
  - { pl: "zabawa", ru: "забава; вечеринка", relation: root, id: zabawa }
  - { pl: "bawić się", ru: "играть, развлекаться", relation: root, id: bawic }
etymology: "Уменьшительное от zabawa, а то — от zabawić, bawić, праславянское *baviti «задерживать, медлить» (отсюда же и «пребывать»). Русское «забава» — то же слово, но русский назвал игрушку иначе, от «играть». Исходное значение «задерживать» хорошо видно: игрушка — то, чем занимают, задерживают внимание ребёнка."
memory: "zabawka — «игрушка», уменьшительное от zabawa, которое и есть русская «забава». Но «забавка» — ложный след: это именно игрушка. И помните, что zabawa по-польски ещё и «вечеринка»."
idioms:
  - { pl: "zabawka w czyichś rękach", ru: "игрушка в чьих-то руках" }
  - { pl: "traktować kogoś jak zabawkę", ru: "обращаться с кем-то как с игрушкой" }
