notes:
  - { kind: government, text: "Относительное прилагательное от schab «свиная корейка»: schabowy, schabowa, schabowe. Степеней сравнения не имеет." }
  - { kind: usage, text: "Kotlet schabowy — главное блюдо польской домашней кухни. В разговоре название сокращают до одного прилагательного: zjeść schabowego." }
  - { kind: usage, text: "Даже как существительное слово склоняется по-прилагательному: schabowego, schabowemu, schabowym." }
  - { kind: false-friend, text: "Русского однокоренного слова нет: schab это именно свиная корейка, и переводить приходится описательно." }
collocations:
