  - { pl: "mięso", ru: "мясо", relation: root, id: mieso }
etymology: "От существительного schab «свиная корейка» с суффиксом -owy. Русского однокоренного соответствия нет, поэтому и само слово, и блюдо приходится объяснять описательно."
memory: "schabowy — «из свиной корейки», от schab. Kotlet schabowy это главная польская отбивная, и в речи её называют просто schabowy, склоняя как прилагательное."
idioms:
  - { pl: "kotlet schabowy", ru: "свиная отбивная" }
formExamplesSkip:
  - { form: "schabowi", reason: "прилагательное относительное и описывает еду: kotlet schabowy, pieczeń schabowa. Мужско-личная форма требует, чтобы определяемое было лицом мужского пола, а о человеке это прилагательное не говорят, поэтому формы schabowi в языке нет" }
