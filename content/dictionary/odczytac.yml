# review
id: odczytac
format: 2
lemma: "odczytać"
rank: 4681
pos: verb
pron: { cyr: "одчы́таць" }
senses:
  - id: read-out
    ru: "зачитать (вслух), огласить"
    examples:
      - pl: "Odczytał list na głos."
        ru: "Он зачитал письмо вслух."
        source: { kind: authored }
      - pl: "Sędzia odczytał wyrok."
        ru: "Судья огласил приговор."
        source: { kind: authored }
      - pl: "Odczytaj na głos pierwszy akapit."
        ru: "Прочитай вслух первый абзац."
        source: { kind: authored }
  - id: decipher
    ru: "прочитать, расшифровать; истолковать"
    examples:
      - pl: "Nie mogę odczytać jego pisma."
        ru: "Я не могу разобрать его почерк."
        source: { kind: authored }
      - pl: "Odczytał jej milczenie jako zgodę."
        ru: "Он истолковал её молчание как согласие."
        source: { kind: authored }
  - id: take-reading
    ru: "снять показания (прибора)"
    examples:
      - pl: "Odczytaj temperaturę z termometru."
        ru: "Посмотри температуру на термометре."
        source: { kind: authored }
      - pl: "Odczytali stan licznika."
        ru: "Они сняли показания счётчика."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ODCZYTAĆ — «зачитать, прочитать», а не «отчитать». «Отчитать кого-то» — ZBESZTAĆ или OCHRZANIĆ. ODCZYT — «доклад, лекция» или «показание прибора», а не «отчёт»: отчёт — SPRAWOZDANIE." }
  - { kind: usage, text: "Пятьдесят две формы: страдательное ODCZYTANY — о письмах, текстах, данных; форма для мужчин-людей ODCZYTANI в карточку не включена. Спряжение как у CZYTAĆ: ODCZYTAM, ODCZYTASZ. Несовершенный вид — ODCZYTYWAĆ." }
  - { kind: government, text: "Что — винительный: ODCZYTAĆ LIST, WYROK. Откуда — Z с родительным: ODCZYTAĆ Z TWARZY, Z WYKRESU. Как что — JAKO с винительным: ODCZYTAĆ COŚ JAKO OBRAZĘ." }
  - { kind: pronunciation, text: "Читается «одчы́таць»: DCZ — «дч», CZY — твёрдое «чы», ударение на предпоследнем слоге. ODCZYTAM — «одчы́там»." }
  - { kind: register, text: "Нейтральное и официальное: ODCZYTAĆ WYROK, LISTĘ OBECNOŚCI, APEL. О показаниях приборов — техническое." }
collocations:
  - { pl: "odczytać list na głos", ru: "зачитать письмо вслух" }
  - { pl: "odczytać wyrok", ru: "огласить приговор" }
  - { pl: "odczytać stan licznika", ru: "снять показания счётчика" }
family:
  - { pl: "czytać", ru: "читать", relation: root, id: czytac }
  - { pl: "przeczytać", ru: "прочитать", relation: derived, id: przeczytac }
  - { pl: "odczyt", ru: "доклад; показание прибора", relation: derived, id: odczyt }
etymology: "Приставка OD- плюс CZYTAĆ «читать», праславянское *čitati. По строению — «отчитать», но значение польское: «прочитать вслух, расшифровать»."
memory: "Odczytać — зачитать: odczytał list na głos. Odczytać pismo — разобрать почерк. «Отчитать» — zbesztać. Читается «одчы́таць»."
idioms:
  - { pl: "odczytać coś z czyjejś twarzy", ru: "прочитать что-то по чьему-то лицу" }
formExamplesSkip:
  - { form: "odczytani", reason: "людей не зачитывают: формы для мужчин-людей нет" }
