# review
id: zabawny
format: 2
lemma: "zabawny"
rank: 575
pos: adj
pron: { cyr: "заба́вны" }
senses:
  - id: funny
    ru: "смешной, забавный"
    note: "To nie jest zabawne «Это не смешно»."
    examples:
      - pl: "Jesteś bardzo zabawny."
        ru: "Ты очень смешной."
        source: { kind: tatoeba, id: 2218782 }
      - pl: "To nie jest zabawne."
        ru: "Это не смешно."
        source: { kind: tatoeba, id: 6328161 }
      - pl: "W czasie imprezy był tak zabawny, że nie mogłem powstrzymać śmiechu."
        ru: "На вечеринке он был так комичен, что я не мог удержаться от смеха."
        source: { kind: tatoeba, id: 364747 }
  - id: amusing-thing
    ru: "zabawne — забавное, смешное (как существительное)"
    note: "coś zabawnego «что-то забавное»."
    examples:
      - pl: "Chcesz posłuchać czegoś zabawnego?"
        ru: "Хочешь послушать что-нибудь забавное?"
        source: { kind: translated, id: 951417 }
      - pl: "Opowiem ci coś zabawnego."
        ru: "Я расскажу тебе кое-что забавное."
        source: { kind: translated, id: 991213 }
      - pl: "Chcę wiedzieć, co jest takiego zabawnego."
        ru: "Я хочу знать, что тут такого смешного."
        source: { kind: translated, id: 12454770 }
  - id: amusing-story
    ru: "zabawna historia — забавная история"
    note: "О рассказах, анекдотах, случаях."
    examples:
      - pl: "Nauczyciel nam opowiedział zabawną historię."
        ru: "Учитель рассказал нам забавную историю."
        source: { kind: translated, id: 3522504 }
      - pl: "Zaczął wykład od zabawnej anegdoty."
        ru: "Он начал лекцию с забавного анекдота."
        source: { kind: translated, id: 442829 }
      - pl: "Gazeta opublikowała zabawną parodię przemówienia prezydenta."
        ru: "Газета опубликовала забавную пародию на речь президента."
        source: { kind: translated, id: 711021 }
notes:
  - { kind: usage, text: "Степени правильные: zabawny — zabawniejszy — najzabawniejszy; мужское личное во множественном — zabawni." }
  - { kind: usage, text: "Средний род zabawne часто работает как существительное: coś zabawnego «что-то забавное», co w tym zabawnego? «что в этом смешного?»" }
  - { kind: false-friend, text: "Не путайте с zabawka «игрушка» и zabawa «игра, веселье, вечеринка» — у них общий корень, но разные значения." }
  - { kind: usage, text: "Глагол — bawić «развлекать», bawić się «играть, веселиться»; наречие — zabawnie." }
collocations:
  - { pl: "zabawna historia", ru: "забавная история" }
  - { pl: "to nie jest zabawne", ru: "это не смешно" }
  - { pl: "coś zabawnego", ru: "что-то забавное" }
  - { pl: "zabawny film", ru: "смешной фильм" }
family:
  - { pl: "zabawa", ru: "игра, веселье", relation: root }
  - { pl: "zabawka", ru: "игрушка", relation: derived }
  - { pl: "bawić", ru: "развлекать", relation: derived }
etymology: "От zabawa «игра, веселье», из za- плюс bawić «развлекать», праславянское *baviti — тот же корень, что в русском «забава»."
memory: "zabawny — «смешной, забавный», от zabawa «веселье». Степени правильные: zabawny — zabawniejszy — najzabawniejszy, мужское личное множественное — zabawni. Средний род часто работает как существительное: coś zabawnego «что-то забавное», co w tym zabawnego? «что в этом смешного?». И держите врозь соседей: zabawa это «веселье, вечеринка», а zabawka — «игрушка»."
idioms:
  - { pl: "to nie jest zabawne", ru: "это не смешно" }
  - { pl: "zabawna historia", ru: "забавная история" }
  - { pl: "coś zabawnego", ru: "что-то забавное" }
