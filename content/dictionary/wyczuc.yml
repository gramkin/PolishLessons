        source: { kind: authored }
notes:
  - { kind: usage, text: "Пятьдесят три формы, и это ровно та клетка таблицы, которую карточка POTWIERDZAĆ описывала с другой стороны: совершенный переходный. Складывается она так: сорок одна основная форма, одиннадцать страдательных причастий и деепричастие на -WSZY — WYCZUWSZY. Действительного причастия нет вовсе, и быть не может: оно описывает действие в ходу, а совершенный вид действия в ходу не знает. Сравните с NAGRYWAĆ из прошлой партии: шестьдесят три формы, потому что у несовершенного вида есть ещё десять форм действительного причастия и деепричастие на -ĄC." }
  - { kind: false-friend, text: "Корень прямо родствен русскому, но не тому слову, которое приходит в голову первым. CZUĆ — это не «чувствовать» в книжном смысле, а именно «чуять»: родственник русского «чуять», из праславянского *čuti. Поэтому WYCZUĆ ближе всего к русскому «вычуять, учуять»: WYCZUĆ ZAPACH, WYCZUĆ PODSTĘP. Переводить его как «вычувствовать» нельзя, такого слова нет, а «почувствовать» годится не всегда: WYCZUĆ подразумевает чутьё, догадку по слабому признаку, а не прямое ощущение." }
  - { kind: usage, text: "Отглагольное существительное этого глагола застыло как отдельное слово, и запомнить его стоит отдельно: WYCZUCIE значит «чутьё». MIEĆ WYCZUCIE — «иметь чутьё», ROBIĆ COŚ Z WYCZUCIEM — «делать что-то с тактом, чутко». В карточке оно стоит на своём месте среди форм, но в речи живёт самостоятельно, как русское «чутьё» рядом с «чуять». Из того же гнезда CZUJNY «бдительный, чуткий» и CZUJNIK «датчик» — то есть прибор, который «чует»." }
  - { kind: government, text: "Управление простое и совпадает с русским: WYCZUĆ COŚ в винительном — wyczuć zapach, wyczuć napięcie, wyczuć blef. Дополнением может быть и человек, и тогда значение «раскусить, понять»: WYCZUŁ MNIE OD RAZU «он сразу меня раскусил». Именно поэтому в карточке есть и мужская личная форма множественного страдательного причастия WYCZUCI — людей вычуять можно, в отличие от POPEŁNIANI и ODMAWIANI из партий 252 и 255, где её пришлось пропустить. Несовершенная пара — WYCZUWAĆ." }
collocations:
