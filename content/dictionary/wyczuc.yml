etymology: "Приставка wy- и CZUĆ, из праславянского *čuti «чуять, ощущать» — то же слово, что русское «чуять», и дальний родственник «чувства». Приставка wy- даёт здесь значение «уловить, вынюхать, распознать по слабому признаку», ровно как в русском «учуять». Гнездо большое и прозрачное: CZUJNY «чуткий, бдительный», CZUJNIK «датчик», PRZECZUCIE «предчувствие», WYCZUCIE «чутьё», POCZUĆ «почувствовать»."
memory: "czuć — это «чуять», а не книжное «чувствовать». Значит wyczuć — «учуять», уловить по слабому признаку. А существительное wyczucie застыло как «чутьё»."
