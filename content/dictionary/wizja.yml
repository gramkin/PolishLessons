# review
id: wizja
format: 2
lemma: "wizja"
rank: 1769
pos: noun
pron: { cyr: "ви́зья" }
senses:
  - id: vision-plan
    ru: "видение, образ будущего"
    examples:
      - pl: "Wizja ta zakorzeniła się w mojej świadomości i spokojnie w niej tkwi."
        ru: "Это видение укоренилось в моём сознании и спокойно там сидит."
        source: { kind: translated, id: 768843 }
      - pl: "Mamy jasną wizję przyszłości."
        ru: "У нас есть ясное видение будущего."
        source: { kind: authored }
      - pl: "Przedstawił swoją wizję firmy."
        ru: "Он представил своё видение фирмы."
        source: { kind: authored }
  - id: vision-apparition
    ru: "видение, призрачный образ"
    examples:
      - pl: "Byłeś zaledwie ulotną wizją złotego dziecięcego marzenia."
        ru: "Ты был лишь мимолётным видением золотой детской мечты."
        source: { kind: translated, id: 12989508 }
      - pl: "Miał wizje po gorączce."
        ru: "У него были видения после жара."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Слово книжное: чаще всего про замысел и образ будущего, реже про призрачное видение." }
  - { kind: usage, text: "telewizja «телевидение» собрана из tele- «далеко» и wizja «изображение»: буквально «дальновидение»." }
  - { kind: government, text: "Видение чего-то — wizja czegoś (родительный падеж): wizja przyszłości «видение будущего»." }
  - { kind: false-friend, text: "Русское «визжать» и «визировать» тут ни при чём: wizja от латинского visio «зрение», как и русское «визуальный»." }
collocations:
  - { pl: "wizja przyszłości", ru: "видение будущего" }
  - { pl: "mieć wizję", ru: "иметь видение" }
  - { pl: "wizja lokalna", ru: "выезд на место, следственный осмотр" }
family:
  - { pl: "telewizja", ru: "телевидение", relation: root, id: telewizja }
  - { pl: "wizjer", ru: "глазок", relation: root }
  - { pl: "widzieć", ru: "видеть", relation: root, id: widziec }
etymology: "Из латинского visio «зрение, видение», как и русское «визуальный». Отсюда же польское telewizja — буквально «дальновидение»."
memory: "wizja — «видение»: и замысел, образ будущего (wizja przyszłości), и призрачное видение. Слово книжное, в корпусе редкое."
