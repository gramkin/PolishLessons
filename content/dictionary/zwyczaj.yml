notes:
  - { kind: false-friend, text: "Корень тот же, что в русском «обычае», но приставка другая: польский взял Z-, русский О-. Основа общая — та, что в ZWYKNĄĆ «привыкнуть» и в русском «обыкнуть», «привыкнуть», «навык». Значения совпали, приставки разошлись, и это тот же случай, что OZNAKA против «признака». Но дальше начинается тонкость, которой в русском нет: польский сохранил ОБА приставочных образования и поделил между ними смысл. ZWYCZAJ это обычай или привычка, то, что делают по заведённому порядку. OBYCZAJ — слово более высокое и собирательное, о нравах: DOBRE OBYCZAJE «добрые нравы», OBYCZAJE EPOKI «нравы эпохи». Русское «обычай» покрывает оба, так что при переводе на польский приходится выбирать." }
  - { kind: government, text: "Мужской род, неодушевлённое. Устойчивая конструкция MIEĆ ZWYCZAJ плюс инфинитив — «иметь обыкновение»: MIAŁ ZWYCZAJ WSTAWAĆ O PIĄTEJ. С предлогом W и местным получается BYĆ W ZWYCZAJU «быть в обычае»: TO BYŁO W ZWYCZAJU. Чей обычай или чего — родительный: ZWYCZAJ WSI, ZWYCZAJE WESELNE через прилагательное. Частотные глаголы: ZACHOWAĆ ZWYCZAJ «сохранить обычай», ZERWAĆ Z DAWNYM ZWYCZAJEM «расстаться с давним обычаем» — последнее требует предлога Z с творительным. Наречие от того же корня — ZWYKLE «обычно», прилагательное — ZWYCZAJNY «обычный»." }
  - { kind: usage, text: "Основа мягкая, на -J, и это сокращает набор форм до девяти: родительный и местный единственного совпадают в одной форме ZWYCZAJU. Такое совпадение обычно для мужских слов на -J и -L: KRAJ даёт KRAJU и в родительном, и в местном, то же у POKÓJ и POKOJU. Родительный множественного — ZWYCZAJÓW, с полным окончанием -ÓW, потому что мягкая основа его требует; формы «zwyczaj» в родительном множественного не бывает. Именительный и винительный множественного — ZWYCZAJE." }
  - { kind: pronunciation, text: "Читается «звы́чай», два слога, ударение на первом. Начальное ZW звучит слитно, без гласной между з и в. Буква Y это «ы». Сочетание CZ даёт «ч». Конечное J это «й», короткое. В форме ZWYCZAJU слогов три, ударение переходит на предпоследний: «звыча́ю». В родительном множественного ZWYCZAJÓW буква Ó читается «у», а конечное W оглушается: «звыча́юф»." }
