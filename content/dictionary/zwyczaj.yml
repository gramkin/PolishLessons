etymology: "От приставки Z- и праславянского корня *vyk- «привыкать», того же, что в русских «обыкнуть», «привыкнуть», «навык», «обычай». Польский образовал имя с приставкой Z-, русский с приставкой О-, и получились ZWYCZAJ и «обычай» — одно понятие, две приставки. Такое расхождение приставок при общем корне в этих двух языках встречается часто и само по себе есть правило, а не исключение: сравните OZNAKA и «признак». Отличие польского в том, что он сохранил и второе образование: OBYCZAJ, с той же приставкой О-, что у русского, существует и означает нравы, обычаи общества в целом. Так один корень дал в польском пару слов с разделённым смыслом там, где русскому хватило одного. Из того же гнезда идут ZWYKŁY «обычный», ZWYKLE «обычно», ZWYCZAJNY «обыкновенный» и PRZYZWYCZAIĆ SIĘ «привыкнуть», которое морфема за морфемой отвечает русскому «привыкнуть»."
memory: "Тот же корень, что в «обычае», но приставка другая: польский z-, русский о- — как oznaka против «признака». И польский сохранил оба: zwyczaj — обычай, привычка; obyczaj — нравы (dobre obyczaje). Русскому «обычаю» в польском отвечают два слова, и приходится выбирать. Мягкая основа на -j: родительный и местный единственного — одна форма zwyczaju, как kraj/kraju. Отсюда же zwykle «обычно» и przyzwyczaić się «привыкнуть»."
