# review
id: zmusic
format: 2
lemma: "zmusić"
rank: 955
pos: verb
aspect: perf
pron: { cyr: "зму́сиць" }
senses:
  - id: force
    ru: "заставить, вынудить (совершенный вид)"
    examples:
      - pl: "Zmusił mnie."
        ru: "Он меня заставил."
        source: { kind: translated, id: 2397686 }
      - pl: "Zmusili mnie do śpiewania."
        ru: "Меня заставили петь."
        source: { kind: translated, id: 364787 }
      - pl: "Złodziej zmusił ją do oddania pieniędzy."
        ru: "Вор заставил её отдать деньги."
        source: { kind: translated, id: 931184 }
  - id: be-forced
    ru: "być zmuszonym — быть вынужденным"
    examples:
      - pl: "Byłem zmuszony pójść."
        ru: "Я был вынужден пойти."
        source: { kind: tatoeba, id: 6154744 }
      - pl: "Cudzoziemcy zmuszeni są opuścić kraj."
        ru: "Иностранцы вынуждены покинуть страну."
        source: { kind: tatoeba, id: 8664344 }
  - id: impersonal
    ru: "zmuszono — вынудили (безлично)"
    examples:
      - pl: "Zmuszono go do przyznania się."
        ru: "Его вынудили признаться."
        source: { kind: translated, id: 12053431 }
      - pl: "Zmuszono mnie do przyznania się."
        ru: "Меня вынудили признаться."
        source: { kind: translated, id: 713420 }
notes:
  - { kind: government, text: "Главное отличие от русского — управление: zmusić kogoś DO czegoś, винительный плюс do с родительным. По-русски «заставить кого-то сделать» идёт с инфинитивом: Zmusili mnie do śpiewania «Меня заставили петь»." }
  - { kind: usage, text: "Несовершенный вид — zmuszać. Корень — musieć «быть должным», заимствованное из немецкого müssen." }
  - { kind: usage, text: "Страдательное причастие работает как прилагательное: być zmuszonym «быть вынужденным», czuć się zmuszonym." }
  - { kind: usage, text: "Безличное zmuszono «вынудили» — частая форма протоколов и газет: Zmuszono go do przyznania się." }
collocations:
  - { pl: "zmusić kogoś do czegoś", ru: "заставить кого-то что-то сделать" }
  - { pl: "być zmuszonym", ru: "быть вынужденным" }
  - { pl: "zmusić się", ru: "заставить себя" }
family:
  - { pl: "zmuszać", ru: "заставлять (несовершенный вид)", relation: aspect }
  - { pl: "musieć", ru: "быть должным", relation: root, id: musiec }
  - { pl: "przymus", ru: "принуждение", relation: derived }
etymology: "Приставка z- плюс musieć «быть должным», которое само пришло из немецкого müssen. Русское «заставить» — своё слово, от «ставить»."
memory: "zmusić — «заставить, вынудить», и управление другое: zmusić kogoś DO czegoś, винительный плюс do с родительным, а по-русски «заставить кого-то сделать» с инфинитивом. Быть вынужденным — być zmuszonym."
idioms:
  - { pl: "zmusić się do czegoś", ru: "заставить себя что-то сделать" }
  - { pl: "być zmuszonym", ru: "быть вынужденным" }
formExamplesSkip:
  - { form: "zmusiwszy", reason: "книжное деепричастие прошедшего времени; в живой речи не употребляется" }
