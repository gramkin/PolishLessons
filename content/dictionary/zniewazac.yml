etymology: "От прилагательного NIEWAŻNY, «неважный, ничтожный», с приставкой Z-: буквально «сделать ничтожным, обесценить». Корень WAG-/WAŻ- — «вес», тот же, что в WAŻYĆ, «взвешивать», и в русском «важный», «уважать», «отвага». Русский из «веса» вывел почтение, польский в ZNIEWAŻAĆ — его противоположность."
memory: "Z-NIE-WAŻ-AĆ: сделать НЕВАЖНЫМ, лишить веса — то есть оскорбить. Не путайте с «уважать» (szanować). Слово суда и газет: znieważenie funkcjonariusza — «оскорбление должностного лица». Пара: znieważać — znieważyć."
idioms:
  - { pl: "znieważyć czyjąś pamięć", ru: "надругаться над чьей-то памятью" }
  - { pl: "znieważać słowem i czynem", ru: "оскорблять словом и делом" }
