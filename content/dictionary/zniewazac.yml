        ru: "Такими словами ты оскорбляешь память своего отца."
        source: { kind: authored }
notes:
  - { kind: usage, text: "ZNIEWAŻAĆ сильнее и официальнее, чем OBRAŻAĆ. OBRAŻAĆ — обычное «обижать, оскорблять» в быту: obraziłem ją, «я её обидел». ZNIEWAŻAĆ — намеренно унижать чьё-то достоинство или глумиться над символом; это слово газет, полиции и суда. В Уголовном кодексе Польши ZNIEWAŻENIE — состав преступления: znieważenie funkcjonariusza publicznego, znieważenie flagi, znieważenie zwłok." }
  - { kind: government, text: "Кого — винительный, как в русском: znieważać sędziego, znieważać flagę. Чем — творительный: znieważać kogoś słowami, gestem. С отрицанием дополнение уходит в родительный: nie znieważaj ludzi, nie znieważajmy przeciwników." }
  - { kind: false-friend, text: "Русскому слышится «уважать», и корень действительно тот же: WAGA, «вес», WAŻNY, «важный». Но польское слово значит обратное: Z-NIE-WAŻAĆ — «сделать неважным, лишить веса», то есть унизить, оскорбить. Само «уважать» по-польски — SZANOWAĆ, а UWAŻAĆ значит «считать» и «быть внимательным»." }
  - { kind: pronunciation, text: "Читается «знева́жаць», ударение на предпоследнем слоге: znie-WA-żać. Ż — твёрдое «ж», конечное Ć — мягкое «ць». В прошедшем ударение сдвигается вместе с окончанием: znieważaliśmy — «зневажа́лисьмы», на третьем от конца, как во всех формах на -liśmy." }
  - { kind: usage, text: "Несовершенный вид, пара — ZNIEWAŻYĆ: znieważał sędziego przez cały mecz, «оскорблял весь матч», но znieważył sędziego, «оскорбил (один раз)». Юридическое существительное образуют от совершенного: ZNIEWAŻENIE; ZNIEWAŻANIE подчёркивает повторяющееся, длящееся оскорбление." }
collocations:
  - { pl: "znieważać funkcjonariusza", ru: "оскорблять должностное лицо" }
  - { pl: "znieważać symbole narodowe", ru: "глумиться над национальными символами" }
  - { pl: "znieważać czyjąś pamięć", ru: "оскорблять чью-то память" }
  - { pl: "znieważać uczucia religijne", ru: "оскорблять религиозные чувства" }
  - { pl: "publicznie znieważać", ru: "публично оскорблять" }
family:
  - { pl: "znieważyć", ru: "оскорбить", relation: aspect }
  - { pl: "zniewaga", ru: "оскорбление", relation: derived }
  - { pl: "znieważenie", ru: "оскорбление (юр.)", relation: derived }
  - { pl: "ważny", ru: "важный", relation: root, id: wazny }
