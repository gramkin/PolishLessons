        ru: "Этого нельзя было предвидеть."
        source: { kind: authored }
  - id: provide-for
    ru: "предусмотреть (в плане, в законе)"
    examples:
      - pl: "Ustawodawca przewidział trzy wyjątki."
        ru: "Законодатель предусмотрел три исключения."
        source: { kind: authored }
      - pl: "W projekcie przewidziano miejsce na parking."
        ru: "В проекте предусмотрено место для парковки."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Приставка расходится с русской, и это главное, что надо заметить. Польское PRZE- обычно отвечает русским «пере-» или «про-», но здесь — русскому «пред-»: PRZEWIDZIEĆ значит «предвидеть», а не «перевидеть». Так же устроено PRZEWIDYWANIE «предвидение, прогноз» и NIEPRZEWIDZIANY «непредвиденный». Запоминать надо саму пару: prze- + widzieć читается как «пред-» + «видеть», хотя буквы говорят другое." }
  - { kind: usage, text: "Второе значение в официальном языке встречается чаще первого, и там у глагола другой подлежащий: не человек, а документ. USTAWA PRZEWIDUJE, UMOWA PRZEWIDUJE, PROJEKT PRZEWIDUJE — «закон предусматривает», «договор предусматривает». В этом значении обычно берут несовершенный PRZEWIDYWAĆ для общего правила и совершенный PRZEWIDZIEĆ для отдельного случая: USTAWA PRZEWIDUJE KARĘ, но USTAWODAWCA PRZEWIDZIAŁ TEN WYJĄTEK. Безличное PRZEWIDZIANO — готовая формула проектной документации." }
  - { kind: pronunciation, text: "Основа та же, что у WIDZIEĆ, и ведёт себя так же: dzi мягкое во всех формах, PRZEWIDZĘ, PRZEWIDZISZ, PRZEWIDZI. В прошедшем времени мена -ie-/-ia- по роду, как у всех глаголов на -EĆ: PRZEWIDZIELI с ie для мужского лица, PRZEWIDZIAŁY с ia для остального, и мужское единственное PRZEWIDZIAŁ тоже с ia. Повелительное PRZEWIDŹ оканчивается на твёрдый dź без гласной." }
  - { kind: government, text: "Что — винительный: PRZEWIDZIEĆ WYNIK, SKUTKI, OBRÓT SPRAWY. Часто идёт с союзом ŻE: PRZEWIDZIAŁ, ŻE TAK SIĘ STANIE. В значении «предусмотреть» подлежащее — документ, а дополнение — то, что в нём заложено: USTAWA PRZEWIDUJE WYJĄTKI, PROJEKT PRZEWIDUJE PARKING. Отрицание требует родительного, как всегда: NIE PRZEWIDZIAŁ TAKIEGO OBROTU." }
collocations:
  - { pl: "nie dało się przewidzieć", ru: "нельзя было предвидеть" }
  - { pl: "ustawa przewiduje", ru: "закон предусматривает" }
  - { pl: "przewidzieć skutki", ru: "предвидеть последствия" }
family:
  - { pl: "przewidywać", ru: "предвидеть, предусматривать", relation: aspect }
  - { pl: "widzieć", ru: "видеть", relation: root, id: widziec }
  - { pl: "nieprzewidziany", ru: "непредвиденный", relation: derived }
etymology: "Приставка prze- и WIDZIEĆ, из праславянского *viděti — то же слово, что русское «видеть», с тем же корнем, что в «вид», «видный», «свидетель». Польское гнездо устроено так же: WIDOK «вид», WIDNY «светлый», ŚWIADEK «свидетель». Расходится только приставка: там, где русский взял «пред-», польский взял prze-, и получилось PRZEWIDZIEĆ при русском «предвидеть». Смысл у обеих приставок один и тот же — увидеть прежде, чем случилось, — просто выражен разными предлогами, польским przez «через, сквозь» и русским «перед»."
memory: "prze- + widzieć читается как «пред-» + «видеть»: przewidzieć — «предвидеть», nieprzewidziany — «непредвиденный». А ustawa przewiduje — «закон предусматривает»."
idioms:
  - { pl: "nie dało się przewidzieć", ru: "нельзя было предвидеть" }
  - { pl: "ustawa przewiduje", ru: "закон предусматривает" }
