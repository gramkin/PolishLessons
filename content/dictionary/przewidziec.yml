pron: { cyr: "пшэви́дзець" }
senses:
  - id: foresee
    ru: "предвидеть, предугадать"
    examples:
      - pl: "Nikt nie przewidział takiego obrotu sprawy."
        ru: "Никто не предвидел такого поворота дела."
        source: { kind: authored }
      - pl: "Przewidziała wynik na tydzień przed głosowaniem."
        ru: "Она предугадала результат за неделю до голосования."
