# review
id: wyrazac
format: 2
lemma: "wyrażać"
rank: 3954
pos: verb
pron: { cyr: "выра́жаць" }
senses:
  - id: express
    ru: "выражать (мнение, чувства)"
    examples:
      - pl: "Wyrażam swoją opinię."
        ru: "Я выражаю своё мнение."
        source: { kind: authored }
      - pl: "Muzyka wyraża to, czego nie można powiedzieć."
        ru: "Музыка выражает то, что нельзя сказать."
        source: { kind: authored }
      - pl: "Wyraża zgodę na operację."
        ru: "Он даёт согласие на операцию."
        source: { kind: authored }
  - id: speak
    ru: "выражаться (WYRAŻAĆ SIĘ); NIE WYRAŻAJ SIĘ — не выражайся"
    examples:
      - pl: "Wyraża się bardzo elegancko."
        ru: "Он выражается очень изысканно."
        source: { kind: authored }
      - pl: "Nie wyrażaj się przy dzieciach!"
        ru: "Не выражайся при детях!"
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "WYRAŻAĆ — «выражать», совпадение полное, включая WYRAŻAĆ SIĘ «выражаться», и в смысле «ругаться»: NIE WYRAŻAJ SIĘ! Важный канцелярский оборот — WYRAŻAĆ ZGODĘ «давать согласие». Выражение — WYRAŻENIE, лицо — WYRAZ TWARZY." }
  - { kind: usage, text: "Несовершенный вид; совершенный — WYRAZIĆ. Спряжение на -AM: WYRAŻAM, WYRAŻASZ, WYRAŻAJĄ. Мужско-личное страдательное WYRAŻANI в карточку не включено." }
  - { kind: government, text: "Что — винительный: WYRAŻAĆ RADOŚĆ, ZGODĘ. Как выражаться — наречие: WYRAŻAĆ SIĘ JASNO. О ком — O с предложным: WYRAŻAĆ SIĘ O KIMŚ DOBRZE. Чем — творительный: WYRAŻAĆ SŁOWAMI." }
  - { kind: pronunciation, text: "Читается «выра́жаць»: Ż — «ж», ударение на предпоследнем слоге. WYRAŻAM — «выра́жам»." }
  - { kind: register, text: "Нейтрально-книжное слово. WYRAŻAĆ ZGODĘ — официальное, в документах: WYRAŻAM ZGODĘ NA PRZETWARZANIE DANYCH." }
collocations:
  - { pl: "wyrażać zgodę", ru: "давать согласие" }
  - { pl: "wyrażać opinię", ru: "выражать мнение" }
  - { pl: "wyrażać się jasno", ru: "выражаться ясно" }
family:
  - { pl: "wyrazić", ru: "выразить", relation: aspect, id: wyrazic }
  - { pl: "wyraz", ru: "выражение, слово", relation: derived, id: wyraz }
  - { pl: "mówić", ru: "говорить", relation: root, id: mowic }
etymology: "Приставка WY- плюс RAZIĆ «ударять, поражать», праславянское *raziti: буквально «выбивать наружу». Русское «выражать», «образ» — того же корня."
memory: "Wyrażać — выражать: wyrażam opinię. Wyrażać zgodę — давать согласие. Nie wyrażaj się! — не выражайся!"
