notes:
  - { kind: false-friend, text: "Значение то же, что у русского «орла», и корень общий. Разница вся в парадигме, зато двойная. Первое: беглое E исчезает уже в родительном — ORZEŁ, но ORŁA, ORŁOWI, ORŁEM; русский делает то же самое в «орёл — орла», так что сама беглость знакома. Второе, и это уже чисто польское: перед беглым E согласный R переходит в RZ, поэтому именительный пишется и звучит ORZEŁ, а все прочие формы начинаются с OR-. Русское «орёл» такого чередования не знает. Выражение ORZEŁ CZY RESZKA отвечает русскому «орёл или решка» слово в слово." }
  - { kind: usage, text: "Двенадцать форм, мужской род. Дательных единственного два: полное ORŁOWI и короткое ORŁU, и оба правильны — короткое -U берут немногие слова, в основном названия животных и близких людей: PSU, LWU, BRATU, OJCU. Местный и звательный единственного — ORLE, где основа опять смягчается. Именительных множественного тоже два: обычное ORŁY о птицах и мужское-личное ORŁOWIE, которое употребляется, только когда речь идёт о людях — о выдающихся, об асах; о птицах сказать ORŁOWIE нельзя. Винительный единственного равен родительному, ORŁA, потому что слово одушевлённое." }
  - { kind: pronunciation, text: "Читается «о́жеу», два слога, ударение на первом. Буквосочетание RZ даёт «ж», а конечное Ł — «у» неслоговое, поэтому именительный звучит совсем не похоже на русское «орёл». Зато в косвенных формах RZ пропадает вместе с беглым E: ORŁA читается «о́руа», ORŁEM — «о́руэм», и в них слышится обычное «р». Форма ORLE звучит «о́рле», с мягким L. Мужское-личное ORŁOWIE читается «оруо́ве», с ударением на предпоследнем слоге." }
  - { kind: register, text: "В прямом значении слово нейтральное. В геральдическом оно торжественное и очень нагруженное: ORZEŁ BIAŁY — герб Польши, и выражение узнаёт каждый. Переносное употребление о человеке — похвала способностям: ON JEST ORZEŁ «он орёл, голова», а в отрицании ON NIE JEST ORZEŁ значит мягкую насмешку над недалёким человеком, и этот оборот очень частый. ORZEŁ CZY RESZKA — обычная формула при подбрасывании монеты. Уменьшительное ORZEŁEK называет значок или нашивку с гербом." }
