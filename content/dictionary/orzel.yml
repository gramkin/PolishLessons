etymology: "Из праславянского *orьlъ, того же слова, что русский «орёл», и дальше к индоевропейскому корню *or- «большая птица», давшему греческое ORNIS «птица» и хеттское HARAS «орёл». Слово очень старое и во всех славянских языках сохранилось почти без изменений. Беглый гласный в обоих языках идёт от одного и того же упавшего еря: он звучит в именительном, потому что иначе слово кончалось бы на две согласные, и исчезает всюду, где за ним следует окончание. Чисто польское добавление — переход R в RZ перед этим гласным: так работает старое смягчение, то же самое, что превратило MORZE в пару к русскому «морю» и TERAZ к «теперь». Поэтому ORZEŁ и ORŁA выглядят как слова из разных гнёзд, хотя это одно слово."
memory: "То же слово, что русский «орёл», с тем же беглым гласным: orzeł, но orła. Чисто польская добавка — r переходит в rz перед этим беглым e, поэтому именительный orzeł звучит «о́жеу», а косвенные формы начинаются с обычного or-. Два дательных: orłowi и короткое orłu, как psu, lwu, bratu. Два именительных множественного: orły о птицах, orłowie только о людях. Монету подбрасывают так же: orzeł czy reszka."
idioms:
  - { pl: "orzeł czy reszka", ru: "орёл или решка" }
