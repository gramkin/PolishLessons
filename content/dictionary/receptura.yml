notes:
  - { kind: false-friend, text: "RECEPTURA — состав продукта, его «формула»: TAJNA RECEPTURA, WEDŁUG STAREJ RECEPTURY. Рецепт от врача — RECEPTA, рецепт блюда в кулинарной книге — PRZEPIS." }
  - { kind: usage, text: "Женский род. Дательный и местный — RECEPTURZE: R чередуется с RZ. Родительный множественного — RECEPTUR. Звательный RECEPTURO не употребляется." }
  - { kind: register, text: "Слово книжно-техническое: этикетки, пищевое производство, фармацевтика. Дома говорят PRZEPIS NA CIASTO, а не RECEPTURA." }
collocations:
  - { pl: "tajna receptura", ru: "секретный рецепт" }
  - { pl: "według tradycyjnej receptury", ru: "по традиционному рецепту" }
