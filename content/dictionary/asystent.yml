  - { pl: "asystent dyrektora", ru: "помощник директора" }
  - { pl: "zatrudnić asystenta", ru: "нанять ассистента" }
family:
  - { pl: "asystentka", ru: "ассистентка", relation: derived }
  - { pl: "asystować", ru: "ассистировать", relation: root }
  - { pl: "asysta", ru: "сопровождение", relation: derived }
etymology: "Из латинского assistens «стоящий рядом», причастия от assistere, где ad- «к» и sistere «ставить». Оба языка взяли слово из латыни через западноевропейский обиход и сохранили оба смысла: помощник вообще и младшая научная должность. Из того же корня asysta «сопровождение» и наше «ассистировать»."
memory: "Одно смягчение в двух местах: w ASYSTENCIE и ASYSTENCI, оба раза t переходит в ci. И винительный как родительный: widzę asystenta."
