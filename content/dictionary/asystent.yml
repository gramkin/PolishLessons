notes:
  - { kind: pronunciation, text: "Две формы этого слова показывают одно и то же смягчение в разных местах. В предложном t переходит в ci: W ASYSTENCIE, как w elemencie, w kącie, w rakiecie, we fragmencie. В мужской личной форме множественного то же t смягчается перед -i: ASYSTENCI. Правило, стало быть, одно, а срабатывает в двух падежах, и к ряду смягчений перед передним гласным — k в c, g в dz, ch в s — добавляется t." }
  - { kind: usage, text: "Существительное одушевлённое, поэтому винительный равен родительному: widzę ASYSTENTA, szukam asystenta. Женская форма образуется суффиксом -ka, как у всех названий занятий: ASYSTENTKA, ровно так же как nauczyciel — nauczycielka, lekarz — lekarka. Русский в этом месте тоже берёт -ка, так что пара переносится напрямую." }
collocations:
