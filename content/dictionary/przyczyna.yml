# review
id: przyczyna
format: 2
lemma: "przyczyna"
rank: 1574
pos: noun
pron: { cyr: "пшычы́на" }
senses:
  - id: cause
    ru: "причина (того, что произошло)"
    examples:
      - pl: "Przyczyna pożaru była nieznana."
        ru: "Причина пожара была неизвестной."
        source: { kind: tatoeba, id: 600894 }
      - pl: "Jaka była przyczyna eksplozji?"
        ru: "Какова была причина взрыва?"
        source: { kind: translated, id: 3871995 }
      - pl: "Policja szuka przyczyny wypadku."
        ru: "Полиция ищет причину аварии."
        source: { kind: translated, id: 789048 }
  - id: reason
    ru: "основание, причина поступка"
    examples:
      - pl: "Przyczyną porażki była jego niefrasobliwość."
        ru: "Причиной отказа была его беспечность."
        source: { kind: tatoeba, id: 533649 }
      - pl: "Musisz wyjaśnić przyczynę swojej nieobecności."
        ru: "Ты должен объяснить причину своего отсутствия."
        source: { kind: translated, id: 2607629 }
notes:
  - { kind: government, text: "przyczyna czegoś — с родительным: przyczyna pożaru «причина пожара». А в именной части сказуемого нужен творительный: Przyczyną porażki było lenistwo." }
  - { kind: false-friend, text: "Различайте przyczyna «причина (объективная)» и powód «повод, основание», который уже есть карточкой: z tego powodu «по этой причине», но przyczyna śmierci «причина смерти»." }
  - { kind: usage, text: "z przyczyn naturalnych — «от естественных причин», стандартный оборот." }
  - { kind: usage, text: "Родственное przyczynić się do czegoś значит «поспособствовать чему-либо»." }
collocations:
  - { pl: "przyczyna pożaru", ru: "причина пожара" }
  - { pl: "z przyczyn naturalnych", ru: "от естественных причин" }
  - { pl: "bez przyczyny", ru: "без причины" }
etymology: "Приставка przy- и czyn «действие, поступок», от czynić «делать». Русская «причина» собрана точно так же — «при-» плюс тот же корень, что в «чинить»."
memory: "przyczyna — «причина», и собрана она как русское слово: przy- плюс czyn «действие». Управление родительным: przyczyna pożaru. А в сказуемом творительный: Przyczyną było lenistwo."
idioms:
  - { pl: "z przyczyn naturalnych", ru: "от естественных причин" }
  - { pl: "przyczyna i skutek", ru: "причина и следствие" }
  - { pl: "bez przyczyny", ru: "без причины" }
