# review
id: egzekwowac
format: 2
lemma: "egzekwować"
rank: 6085
pos: verb
aspect: imperf
pron: { cyr: "эгзэкфо́ваць" }
senses:
  - id: enforce
    ru: "обеспечивать исполнение, следить за соблюдением (закона, правил)"
    examples:
      - pl: "Policja musi egzekwować przepisy drogowe."
        ru: "Полиция должна следить за соблюдением правил дорожного движения."
        source: { kind: authored }
      - pl: "Państwo słabo egzekwuje prawo."
        ru: "Государство плохо обеспечивает исполнение закона."
        source: { kind: authored }
  - id: collect
    ru: "юр. взыскивать (долг, штраф, налог)"
    examples:
      - pl: "Komornik egzekwuje dług z pensji."
        ru: "Судебный исполнитель взыскивает долг из зарплаты."
        source: { kind: authored }
      - pl: "Urzędy skarbowe egzekwują zaległe podatki."
        ru: "Налоговые органы взыскивают недоимки."
        source: { kind: authored }
  - id: demand
    ru: "egzekwować coś od kogoś — требовать (дисциплины, порядка, выполнения обещанного)"
    examples:
      - pl: "Egzekwuję od dzieci porządek w pokoju."
        ru: "Я требую от детей порядка в комнате."
        source: { kind: authored }
      - pl: "Trener egzekwuje dyscyplinę na treningach."
        ru: "Тренер требует дисциплины на тренировках."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Не «казнить»! EGZEKWOWAĆ — «обеспечивать исполнение, взыскивать». «Казнить» — STRACIĆ, WYKONAĆ WYROK ŚMIERCI. Ловушку ставит EGZEKUCJA: это и «казнь», и юридическое «исполнительное производство, взыскание» — EGZEKUCJA KOMORNICZA." }
  - { kind: government, text: "Что — винительный: EGZEKWOWAĆ PRAWO, DŁUG. С кого, от кого — OD с родительным: EGZEKWOWAĆ OD DZIECI PORZĄDEK, DŁUG OD DŁUŻNIKA. Русское «взыскать с кого» — не Z, а OD." }
  - { kind: usage, text: "Совершенный вид — WYEGZEKWOWAĆ «добиться исполнения, взыскать»: WYEGZEKWOWAĆ DŁUG. Объект — закон, правило, долг, а не человек, поэтому мужско-личная форма причастия EGZEKWOWANI не употребляется." }
  - { kind: pronunciation, text: "«эгзэкфо́ваць»: W после K оглушается в «ф», ударение на предпоследнем слоге. Настоящее время: EGZEKWUJĘ — «эгзэкфу́е»." }
  - { kind: register, text: "Официально-деловое слово: право, администрация, договоры. В быту — шутливо-книжно: EGZEKWOWAĆ OD MĘŻA OBIETNICE. Проще — WYMAGAĆ, PILNOWAĆ." }
collocations:
  - { pl: "egzekwować prawo", ru: "обеспечивать исполнение закона" }
  - { pl: "egzekwować przepisy", ru: "следить за соблюдением правил" }
  - { pl: "egzekwować dług", ru: "взыскивать долг" }
  - { pl: "egzekwować swoje prawa", ru: "отстаивать свои права" }
  - { pl: "egzekwować dyscyplinę", ru: "требовать дисциплины" }
family:
  - { pl: "egzekucja", ru: "казнь; принудительное взыскание", relation: derived, id: egzekucja }
  - { pl: "wyegzekwować", ru: "добиться исполнения, взыскать", relation: aspect }
  - { pl: "egzekutor", ru: "исполнитель; сборщик долгов", relation: derived }
  - { pl: "wymagać", ru: "требовать", relation: root, id: wymagac }
synonyms: ["wymagać", "ściągać", "pilnować"]
etymology: "Из латинского exsequi «доводить до конца, исполнять» (ex- «из» + sequi «следовать»), через средневековое exsecutio. Русское «экзекуция» и английское execute — от того же корня; в русском слово сузилось до «наказания», а польский сохранил юридическое «исполнение»."
memory: "EGZEKWOWAĆ — «экзекуция» для правил и долгов, а не для людей: komornik egzekwuje dług — судебный исполнитель взыскивает долг."
idioms:
  - { pl: "martwa litera prawa", ru: "мёртвая буква закона (закон, за исполнением которого никто не следит)" }
formExamplesSkip:
  - { form: "egzekwowani", reason: "взыскивают долги и правила, а не людей: мужско-личная форма не употребляется" }
