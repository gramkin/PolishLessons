# review
id: cudownie
format: 2
lemma: "cudownie"
rank: 1442
pos: adv
pron: { cyr: "цудо́вне" }
senses:
  - id: wonderfully
    ru: "чудесно, замечательно"
    examples:
      - pl: "Cudownie śpiewała."
        ru: "Она замечательно пела."
        source: { kind: tatoeba, id: 13784394 }
      - pl: "Cudownie!"
        ru: "Чудесно!"
        source: { kind: translated, id: 4791058 }
      - pl: "Cudownie wyglądasz w niebieskim."
        ru: "Ты чудесно выглядишь в голубом."
        source: { kind: translated, id: 837039 }
  - id: miraculously
    ru: "чудом, чудесным образом"
    examples:
      - pl: "Dziecko cudownie wyzdrowiało."
        ru: "Ребёнок чудесным образом выздоровел."
        source: { kind: translated, id: 2150159 }
      - pl: "Cudownie ocalał z wypadku."
        ru: "Он чудом уцелел в аварии."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Наречие от cudowny «чудесный», а то — от cud «чудо». Оба уже есть отдельными карточками." }
  - { kind: usage, text: "Cudownie! отдельной репликой значит «Чудесно!, Прекрасно!» — частый отклик на хорошую новость." }
  - { kind: usage, text: "Второе значение буквальное — «чудом»: cudownie ocalał «он чудом уцелел», cudownie wyzdrowiał «чудесным образом выздоровел»." }
  - { kind: usage, text: "Степени сравнения cudowniej и najcudowniej существуют, но в живой речи почти не встречаются." }
collocations:
  - { pl: "Cudownie!", ru: "Чудесно!" }
  - { pl: "wygląda cudownie", ru: "выглядит чудесно" }
  - { pl: "cudownie ocaleć", ru: "чудом уцелеть" }
etymology: "От cud «чудо» (праславянское *čudo) через прилагательное cudowny. Русские «чудо» и «чудесно» того же корня, так что слово читается насквозь."
memory: "cudownie — «чудесно», от cud «чудо», слова того же корня, что русское. Cudownie! в одиночку — отклик «Чудесно!». А второе значение совсем буквальное: cudownie ocalał «чудом уцелел»."
idioms:
