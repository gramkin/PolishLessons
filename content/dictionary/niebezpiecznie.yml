# review
id: niebezpiecznie
format: 2
lemma: "niebezpiecznie"
rank: 4200
pos: adv
pron: { cyr: "небэспе́чне" }
senses:
  - id: dangerously
    ru: "опасно"
    examples:
      - pl: "Samochód zatrzymał się niebezpiecznie blisko przepaści."
        ru: "Машина остановилась опасно близко к обрыву."
        source: { kind: authored }
      - pl: "Lód niebezpiecznie trzeszczał."
        ru: "Лёд угрожающе трещал."
        source: { kind: authored }
      - pl: "Temperatura niebezpiecznie wzrosła."
        ru: "Температура опасно поднялась."
        source: { kind: authored }
  - id: it-is-dangerous
    ru: "опасно (делать что-то)"
    examples:
      - pl: "Niebezpiecznie jest pływać po alkoholu."
        ru: "Опасно плавать после алкоголя."
        source: { kind: authored }
      - pl: "Czy tam nie jest zbyt niebezpiecznie?"
        ru: "А там не слишком опасно?"
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "NIEBEZPIECZNIE — «опасно», буквально «небезопасно». Ловушка в корне: BEZPIECZNY — «безопасный», а не русское «беспечный». «Беспечный» по-польски — BEZTROSKI." }
  - { kind: usage, text: "Наречие со степенями: NIEBEZPIECZNIE, NIEBEZPIECZNIEJ, NAJNIEBEZPIECZNIEJ. Работает и как безличное сказуемое: NIEBEZPIECZNIE JEST + инфинитив, ROBI SIĘ NIEBEZPIECZNIE, «становится опасно»." }
  - { kind: government, text: "Наречие ничем не управляет. Перед прилагательным и наречием значит «опасно, угрожающе»: NIEBEZPIECZNIE BLISKO, NIEBEZPIECZNIE SZYBKO." }
  - { kind: pronunciation, text: "Читается «небэспе́чне», ударение на предпоследнем слоге. Z перед P оглушается в «с»: BEZP — «бэсп»." }
collocations:
  - { pl: "robi się niebezpiecznie", ru: "становится опасно" }
  - { pl: "niebezpiecznie blisko", ru: "опасно близко" }
  - { pl: "jeździć niebezpiecznie", ru: "ездить опасно" }
family:
  - { pl: "niebezpieczny", ru: "опасный", relation: root, id: niebezpieczny }
  - { pl: "niebezpieczeństwo", ru: "опасность", relation: root, id: niebezpieczenstwo }
  - { pl: "bezpieczny", ru: "безопасный", relation: root, id: bezpieczny }
etymology: "NIE + BEZPIECZNIE, от BEZ + старое PIECZA «забота, опека». Безопасный — тот, кому не о чем заботиться. Русское «беспечный» — тот же образ «без печали», но смысл ушёл к «легкомысленный»."
memory: "Niebezpiecznie — опасно; bezpieczny — безопасный, не «беспечный». Читается «небэспе́чне». Robi się niebezpiecznie — становится опасно."
idioms:
  - { pl: "igrać z ogniem", ru: "играть с огнём" }
