pos: noun
pron: { cyr: "прагне́не" }
senses:
  - id: thirst
    ru: "жажда"
    examples:
      - pl: "Pragnienie dokuczało im od południa."
        ru: "Жажда мучила их с полудня."
        source: { kind: authored }
      - pl: "Nie mógł ugasić pragnienia."
        ru: "Он не мог утолить жажду."
        source: { kind: authored }
      - pl: "Z pragnieniem walczyli do wieczora."
        ru: "С жаждой они боролись до вечера."
        source: { kind: authored }
  - id: desire
    ru: "желание, стремление"
    examples:
      - pl: "Pragnienie wolności było silniejsze od strachu."
        ru: "Жажда свободы была сильнее страха."
        source: { kind: authored }
      - pl: "Lista jego pragnień była krótka."
        ru: "Список его желаний был коротким."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Оба значения совпадают с русской «жаждой»: pragnienie — это и физическая жажда, и сильное желание, pragnienie wolności, pragnienie zemsty. Но в быту «хочу пить» говорят иначе: CHCE MI SIĘ PIĆ, безлично и с дательным. Оборот mam pragnienie звучит книжно, почти по-медицински, и в обычном разговоре его лучше не ставить." }
  - { kind: pronunciation, text: "Родительный множественного — PRAGNIEŃ, с мягким ń и без окончания. Так ведут себя все существительные на -nie: pustynia — pustyń, zdanie — zdań, życzenie — życzeń. Мягкость при этом не появляется, а остаётся: она была в основе и просто выходит на поверхность, когда окончание исчезает." }
collocations:
  - { pl: "ugasić pragnienie", ru: "утолить жажду" }
  - { pl: "pragnienie wolności", ru: "жажда свободы" }
  - { pl: "spełnić pragnienie", ru: "исполнить желание" }
family:
  - { pl: "pragnąć", ru: "жаждать, желать", relation: root, id: pragnac }
  - { pl: "spragniony", ru: "жаждущий", relation: derived }
  - { pl: "upragniony", ru: "желанный", relation: derived }
etymology: "Отглагольное существительное от PRAGNĄĆ «жаждать, страстно желать». Русский для этого понятия взял другой корень: «жажда» родственна «жадному», обе из праславянского *žędja. Так что совпадает здесь не форма, а устройство мысли — оба языка назвали сильное желание тем же словом, что и телесную жажду."
memory: "Значения те же, что у «жажды»: и пить, и хотеть. Но «хочу пить» — это chce mi się pić, а не «mam pragnienie»."
idioms:
