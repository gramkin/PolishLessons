# review
id: zatruc
format: 2
lemma: "zatruć"
rank: 4275
pos: verb
pron: { cyr: "за́труць" }
senses:
  - id: pollute
    ru: "отравить, загрязнить (воду, воздух)"
    examples:
      - pl: "Zakład zatruł rzekę."
        ru: "Завод отравил реку."
        source: { kind: authored }
      - pl: "Spaliny zatruły powietrze."
        ru: "Выхлопные газы отравили воздух."
        source: { kind: authored }
      - pl: "Pestycydy zatruły glebę."
        ru: "Пестициды отравили почву."
        source: { kind: authored }
  - id: food-poisoning
    ru: "с SIĘ — отравиться (едой)"
    examples:
      - pl: "Zatruł się grzybami."
        ru: "Он отравился грибами."
        source: { kind: authored }
      - pl: "Zatruli się na weselu."
        ru: "Они отравились на свадьбе."
        source: { kind: authored }
  - id: embitter
    ru: "отравить (жизнь, радость)"
    examples:
      - pl: "Zatruł jej życie zazdrością."
        ru: "Он отравил ей жизнь ревностью."
        source: { kind: authored }
      - pl: "Plotki zatrują atmosferę w pracy."
        ru: "Сплетни отравят атмосферу на работе."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ZATRUĆ SIĘ — бытовое «отравиться едой»: ZATRUŁEM SIĘ RYBĄ. Сравни OTRUĆ — «отравить насмерть, нарочно». Не путать с русским «затравить»: «затравить кого-то» — ZASZCZUĆ." }
  - { kind: usage, text: "Пятьдесят три формы, включая ZATRUCI — «отравившиеся». ZATRUCIE POKARMOWE — «пищевое отравление». Спряжение: ZATRUJĘ, ZATRUJESZ, повелительное ZATRUJ. Несовершенный вид — ZATRUWAĆ." }
  - { kind: government, text: "Что — винительный: ZATRUĆ WODĘ. Чем — творительный: ZATRUĆ SIĘ GRZYBAMI, ZATRUĆ CHEMIKALIAMI. Кому что — дательный: ZATRUĆ KOMUŚ ŻYCIE." }
  - { kind: pronunciation, text: "Читается «за́труць», ударение на первом слоге. ZATRUJĘ — «затру́е», ZATRUŁ — «за́труу»: Ł — «у»." }
  - { kind: register, text: "Нейтральное слово. ZATRUCIE POKARMOWE — медицинское. ZATRUĆ KOMUŚ ŻYCIE — разговорное и выразительное, как русское «отравить жизнь»." }
collocations:
  - { pl: "zatruć się grzybami", ru: "отравиться грибами" }
  - { pl: "zatruć środowisko", ru: "загрязнить окружающую среду" }
  - { pl: "zatrucie pokarmowe", ru: "пищевое отравление" }
family:
  - { pl: "otruć", ru: "отравить", relation: derived, id: otruc }
  - { pl: "trucizna", ru: "яд, отрава", relation: derived, id: trucizna }
  - { pl: "zatruwać", ru: "отравлять", relation: aspect }
etymology: "Приставка ZA- плюс TRUĆ «травить», праславянское *truti. Русское «отрава» — от другого корня, от слова «трава»."
memory: "Zatruć się — отравиться едой: zatruł się grzybami. Zatruć rzekę — отравить реку. Zatruć komuś życie — отравить жизнь. Читается «за́труць»."
idioms:
  - { pl: "zatruć komuś życie", ru: "отравить кому-то жизнь" }
