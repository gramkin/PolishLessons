        source: { kind: authored }
  - id: dignified
    ru: "достойный, подобающий"
    examples:
      - pl: "Zachował się w sposób godny."
        ru: "Он повёл себя достойно."
        source: { kind: authored }
      - pl: "Chcieli zapewnić matce godną starość."
        ru: "Они хотели обеспечить матери достойную старость."
        source: { kind: authored }
  - id: predicative
    ru: "godzien — достоин (краткая форма)"
    examples:
      - pl: "Nie jestem godzien takiej pochwały."
        ru: "Я не достоин такой похвалы."
        source: { kind: authored }
notes:
  - { kind: usage, text: "GODZIEN — ЭТО ОСТАТОК КРАТКОЙ ФОРМЫ ПРИЛАГАТЕЛЬНОГО, И В ЭТОМ ГЛАВНАЯ РАЗНИЦА С РУССКИМ. Польский краткие формы почти утратил: их сохранилось меньше десятка — GODZIEN, WINIEN, PEWIEN, WART, ZDRÓW, CIEKAW, ŁASKAW. Русский же держит их живыми и продуктивными, и наше «достоин» — ровно такая краткая форма. Поэтому jestem godzien звучит как «я достоин», а jestem godny — как «я достойный»." }
  - { kind: government, text: "Прилагательное требует РОДИТЕЛЬНОГО падежа: godny UWAGI, godny ZAUFANIA, godny PODZIWU, godny NAŚLADOWANIA. Русское «достойный внимания» управляется так же, поэтому тут можно переводить прямо. Краткая форма ведёт себя одинаково: godzien pochwały." }
  - { kind: false-friend, text: "Корень тот же, что в pogoda и pogodzić: праславянское *god- «пригодность, подходящее время». Русские «годный», «пригодный», «угодный» и «выгода» — то же гнездо. Но осторожно: польское godny значит «достойный», а не «годный»; «годный» будет ZDATNY или NADAJĄCY SIĘ." }
collocations:
  - { pl: "godny uwagi", ru: "достойный внимания" }
  - { pl: "godny zaufania", ru: "заслуживающий доверия" }
  - { pl: "godne życie", ru: "достойная жизнь" }
family:
  - { pl: "godność", ru: "достоинство", relation: derived }
  - { pl: "zgoda", ru: "согласие", relation: root, id: zgoda }
  - { pl: "niegodny", ru: "недостойный", relation: antonym }
etymology: "Из праславянского *godьnъ «пригодный, подходящий», от *godъ «подходящее время». То же гнездо дало zgoda, pogoda, pogodzić и русские «годный», «угодить», «выгода», «погода». Значение сдвинулось от пригодности к достоинству, отсюда godność «достоинство»."
memory: "godny — «достойный», с родительным падежом: godny uwagi, как «достойный внимания». И запомни краткую форму GODZIEN: польский их почти потерял, оставив горстку, а русское «достоин» — ровно такая же краткая форма."
idioms:
