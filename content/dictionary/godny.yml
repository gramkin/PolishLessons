pos: adj
pron: { cyr: "го́дны" }
senses:
  - id: worthy
    ru: "достойный (+ род.)"
    examples:
      - pl: "To film godny uwagi."
        ru: "Это фильм, достойный внимания."
        source: { kind: authored }
      - pl: "Szukają człowieka godnego zaufania."
