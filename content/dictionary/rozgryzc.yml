notes:
  - { kind: false-friend, text: "ROZGRYŹĆ — и «разгрызть», и «раскусить» в переносном смысле: ROZGRYŹĆ PROBLEM, ROZGRYŹĆ KOGOŚ. Русское «раскусить» как «понять, что за человек» — ровно ROZGRYŹĆ. Но «разгадать шифр» тоже ROZGRYŹĆ SZYFR, где по-русски «взломать»." }
  - { kind: usage, text: "Пятьдесят три формы — подпись переходного глагола совершенного вида: страдательное ROZGRYZIONY и деепричастие ROZGRYZŁSZY. Прошедшее без -Ł- в мужском лице множественного: ROZGRYŹLI. Видовой партнёр — ROZGRYZAĆ." }
  - { kind: government, text: "Что — винительный: ROZGRYŹĆ ORZECH, ZAGADKĘ, KOGOŚ. С придаточным: ROZGRYŹĆ, JAK, CO, DLACZEGO. С отрицанием — родительный: NIE ROZGRYZŁ TEGO SZYFRU." }
  - { kind: pronunciation, text: "Читается «ро́згрызьць», два слога, ударение на первом. Z перед G звонкое, Y — «ы», ŹĆ — мягкие «зьць». ROZGRYZĘ — «розгры́зэ», ROZGRYZŁ — «ро́згрыз» с немым Ł после согласного." }
  - { kind: register, text: "В переносном значении — разговорное и очень частое: ROZGRYŹĆ SYSTEM, ROZGRYŹĆ SZEFA. В прямом — бытовое о зубах и орехах. В книжной речи вместо «понять» — ZROZUMIEĆ, ROZSZYFROWAĆ." }
collocations:
  - { pl: "rozgryźć zagadkę", ru: "разгадать загадку" }
  - { pl: "rozgryźć kogoś", ru: "раскусить кого-то" }
  - { pl: "twardy orzech do zgryzienia", ru: "крепкий орешек" }
family:
  - { pl: "rozgryzac", ru: "разгрызать; разгадывать", relation: aspect }
  - { pl: "gryźć", ru: "грызть, кусать", relation: root }
  - { pl: "zagryzc", ru: "загрызть; закусить", relation: root }
etymology: "Приставка ROZ- «раз-» плюс GRYŹĆ «грызть», праславянское *grysti, то же, что русское «грызть». Переносное «понять» — тот же образ, что в русском «раскусить»: добраться до сути, как до ядра ореха."
memory: "Rozgryźć — раскусить, разгадать: rozgryźć zagadkę, rozgryźć kogoś. И буквально — разгрызть: pies rozgryzł kość. Rozgryźli — без Ł. Читается «ро́згрызьць»."
idioms:
  - { pl: "twardy orzech do zgryzienia", ru: "крепкий орешек" }
