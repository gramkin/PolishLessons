# review
id: rozgryzc
format: 2
lemma: "rozgryźć"
rank: 3945
pos: verb
pron: { cyr: "ро́згрызьць" }
senses:
  - id: crack
    ru: "раскусить, разгадать (задачу, человека)"
    examples:
      - pl: "W końcu rozgryzłem tę zagadkę."
        ru: "Наконец я разгадал эту загадку."
