      - pl: "Rozgryzła, jak działa ten program."
        ru: "Она разобралась, как работает эта программа."
        source: { kind: authored }
  - id: bite-through
    ru: "раскусить, разгрызть"
    examples:
      - pl: "Pies rozgryzł kość."
        ru: "Собака разгрызла кость."
        source: { kind: authored }
      - pl: "Rozgryź tabletkę przed połknięciem."
        ru: "Разжуй таблетку перед тем, как проглотить."
