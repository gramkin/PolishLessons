notes:
  - { kind: false-friend, text: "СЛОВО ТО ЖЕ, ЧТО РУССКОЕ «ЯМА», НО ГЛАВНЫЕ ЗНАЧЕНИЯ ДРУГИЕ. По-польски jama — прежде всего НОРА зверя (jama lisa, jama niedźwiedzia) и ПОЛОСТЬ тела (jama ustna «ротовая полость», jama brzuszna «брюшная полость»). Яма, вырытая в земле, обычно dół, а выбоина на дороге — dziura. Сказать о дорожной выбоине jama нельзя." }
  - { kind: pronunciation, text: "Два слога, ударение на первом: JA-ma. Польское j читается как русское й, так что звучит слово ровно как «яма». В дательном и предложном m смягчается: w jamie — «в я́ме», тот же ряд, что farma — na farmie." }
  - { kind: usage, text: "Анатомическое значение самое частотное в письменном языке: jama ustna, jama nosowa, jama brzuszna, jama opłucnowa. В разговоре чаще слышно о звериной норе. Производное jamnik «такса» значит буквально «норник» — собака, лезущая в нору." }
  - { kind: register, text: "Звательный падеж jamo принадлежит книжной и фольклорной речи: загадке, стихотворению, обращению к месту. В обычном разговоре к норе не обращаются, и вместо звательного звучит именительный." }
collocations:
  - { pl: "jama ustna", ru: "ротовая полость" }
  - { pl: "jama brzuszna", ru: "брюшная полость" }
  - { pl: "jama lisa", ru: "лисья нора" }
family:
  - { pl: "jamnik", ru: "такса", relation: derived }
  - { pl: "dół", ru: "яма, низ", relation: root, id: dol }
  - { pl: "dziura", ru: "дыра, выбоина", relation: derived, id: dziura }
etymology: "Праславянское *jama, то же слово, что русская «яма»; родственно греческому ame «лопата» и, вероятно, корню со значением «копать». Польский закрепил за ним нору и телесную полость, русский — углубление в земле. Отсюда jamnik «такса», буквально «норная собака», и jamisty «ноздреватый»."
memory: "jama — та же «яма», но смысл сместился: по-польски это прежде всего НОРА зверя и ПОЛОСТЬ тела (jama ustna «ротовая полость»). Яма в земле — dół, выбоина — dziura. А такса называется jamnik, буквально «норник»."
idioms:
  - { pl: "jama ustna", ru: "ротовая полость" }
  - { pl: "jama niedźwiedzia", ru: "медвежья берлога" }
