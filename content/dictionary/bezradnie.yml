notes:
  - { kind: usage, text: "Внутри rada «совет»: bez + rada = «без совета», то есть «не зная, что делать». Русское «беспомощно» построено от «помощи», так что образ разный." }
  - { kind: usage, text: "Типичные сочетания — о жестах: załamać ręce bezradnie «беспомощно заломить руки», rozłożyć bezradnie ręce «развести руками»." }
  - { kind: usage, text: "Прилагательное bezradny значит «беспомощный, растерянный», существительное bezradność — «беспомощность»." }
  - { kind: usage, text: "Примеров в корпусе нет, поэтому все предложения составлены вручную и ждут проверки." }
collocations:
  - { pl: "bezradnie rozłożyć ręce", ru: "беспомощно развести руками" }
  - { pl: "bezradny", ru: "беспомощный" }
  - { pl: "poczuć się bezradnie", ru: "почувствовать себя беспомощно" }
etymology: "Наречие от bezradny «беспомощный», внутри которого rada «совет»: буквально «без совета», то есть не знающий, что делать."
memory: "bezradnie — «беспомощно», и образ внутри другой, чем в русском: польское слово строится на rada «совет» (bez + rada — «без совета»), а русское «беспомощно» — на «помощи». Запомните жест, с которым оно чаще всего ходит: rozłożyć bezradnie ręce «беспомощно развести руками»."
idioms:
