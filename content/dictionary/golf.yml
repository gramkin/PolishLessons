notes:
  - { kind: false-friend, text: "Со спортом всё совпадает, а с одеждой нет, и расхождение полное. Польский GOLF в обиходной речи прежде всего означает свитер с высоким, отворачиваемым воротом — по-русски «свитер с высоким воротом» или «гольф» в том же значении, но русское «гольфы» во множественном значит совсем другое: чулки до колена. По-польски это PODKOLANÓWKI. Поэтому KUPIŁEM GOLF это «я купил свитер», а не «я купил гольфы», и спутать легко. Название одежды пошло от свитеров, в которых играли в гольф в начале двадцатого века, так что оба значения в польском — одно слово, а не омонимы." }
  - { kind: government, text: "Мужской род, и у него два родительных единственного: GOLFA и GOLFU. Форма GOLFA обычна, когда речь об одежде, GOLFU — когда об игре, но граница не строгая, и оба варианта нормативны, как у KRAWATA и KRAWATU. Винительный равен именительному для одежды: WŁOŻYĆ GOLF. В названии игры винительный идёт с предлогом W и формой GOLFA: GRAĆ W GOLFA — обратите внимание, что здесь обязательно родительная по виду форма, как в GRAĆ W TENISA. Местный GOLFIE. Родительный множественного GOLFÓW." }
  - { kind: pronunciation, text: "Читается «гольф», один слог, ударять нечего. Буква L мягкая, как всегда в польском, отсюда «ль», а не «л». Конечное F звучит ясно. В родительном GOLFA два слога и ударение на первом: «го́льфа». В местном GOLFIE сочетание FI даёт мягкое «фе»: «го́льфе». В родительном множественного GOLFÓW буква Ó даёт «у», конечное W оглушается в «ф»: «гольфуф»." }
  - { kind: usage, text: "Частотные сочетания: WŁOŻYĆ GOLF «надеть свитер с высоким воротом» — и глагол здесь именно WKŁADAĆ, как со всякой отдельной вещью одежды; CZARNY GOLF, GOLF POD MARYNARKĘ; а для игры GRAĆ W GOLFA, POLE GOLFOWE «поле для гольфа», KIJ GOLFOWY «гольф-клуб как палка». Прилагательное GOLFOWY относится только к игре: не бывает SWETER GOLFOWY. Для чулок до колена есть PODKOLANÓWKI, а для коротких носков SKARPETKI, и путать их с GOLF нельзя." }
