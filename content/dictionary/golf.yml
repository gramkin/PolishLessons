etymology: "Из английского GOLF, названия игры, чьё собственное происхождение не установлено: одни выводят его из средненидерландского KOLF «палка, дубина», другие считают шотландским словом без внешних связей. Польский взял слово в двух значениях и в разное время: сначала как название игры, затем как название свитера — потому что в таких свитерах играли в гольф в начале двадцатого века, и одежда получила имя по занятию. Русский взял только спортивное значение и построил «гольфы» для чулок из другого английского слова, от названия тех же гольфистских чулок до колена. Так одно английское слово дало в двух языках предметы одежды, которые не совпадают: польский свитер против русских чулок."
memory: "Два значения, и одежда расходится с русским: polski golf — свитер с высоким воротом, а русские «гольфы» — чулки до колена, по-польски podkolanówki. Игра совпадает, но управление особое: grać w golfa, с формой на -a, как grać w tenisa. Два родительных, golfa и golfu, оба правильные, как krawata и krawatu. Название одежды пошло от свитеров гольфистов, так что это одно слово, а не омонимы."
