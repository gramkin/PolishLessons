etymology: "Из французского FRISURE «завивка», от глагола FRISER «завивать», пришедшего в польский через немецкое посредство в восемнадцатом веке, когда французская мода задавала тон всей Европе. От того же корня идёт FRYZJER, по-французски FRISEUR, то есть «завивальщик». Русский в это же время брал ремесло у немцев и получил «парикмахера», сложение из PERÜCKE «парик» и MACHER «делатель»; слово «парик» при этом тоже французское, PERRUQUE, но пришло отдельно. Так одно ремесло дало двум соседним языкам слова из разных источников и разного строения, и ни одно из них не помогает угадать другое. Суффикс -URA в польском продуктивен для отглагольных имён действия и результата: FRYZURA, STRUKTURA, FAKTURA."
memory: "Французское слово, frisure от friser «завивать», и вместе с ним пришёл fryzjer — французский friseur. Русский взял то же ремесло у немцев: «парикмахер» это Perückenmacher, «изготовитель париков». Поэтому ни одно слово пары не угадывается. Звук: y даёт «ы», «фрызу́ра». Дательный и местный fryzurze с меной r→rz, как czarze и inżynierze. Причёска ёжиком — fryzura na jeża."
idioms:
  - { pl: "fryzura na jeża", ru: "причёска ёжиком" }
