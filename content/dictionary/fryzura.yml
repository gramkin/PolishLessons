notes:
  - { kind: false-friend, text: "Русского слова с таким корнем нет: «причёска» своя, от «чесать». Польское FRYZURA заимствовано из французского, и вместе с ним пришло FRYZJER «парикмахер». Здесь два языка взяли одно ремесло из разных рук: поляки у французов, от FRISEUR, а русские у немцев, от PERÜCKENMACHER, то есть буквально «изготовитель париков», откуда и «парикмахер». Поэтому ни одно из слов этой пары не угадывается. Полезно помнить и третье: FRYZJER это и мужской, и женский мастер, а салон называется SALON FRYZJERSKI или просто FRYZJER, и вывеска читается как название места." }
  - { kind: usage, text: "Десять форм, женский род. Дательный и местный единственного — FRYZURZE, где конечное R основы переходит в RZ перед окончанием -E: та же мена, что в CZARZE и INŻYNIERZE, только здесь она попадает в женское склонение. Родительный множественного — FRYZUR, с нулевым окончанием. Родительный единственного и именительный множественного — одна форма FRYZURY. Управление: FRYZURA NA COŚ в винительном описывает вид стрижки — FRYZURA NA JEŻA «причёска ёжиком», FRYZURA NA PAZIA «каре»." }
  - { kind: pronunciation, text: "Читается «фрызу́ра», три слога, ударение на втором. Буква Y даёт «ы», поэтому первый слог звучит «фры», а не «фри» — это главное отличие от французского оригинала и от русского слуха. Буква Z звонкая, «з». В форме FRYZURZE буквосочетание RZ читается «ж»: «фрызу́же», и местный падеж на слух сильно расходится с именительным. В форме FRYZURĘ конечное Ę звучит как чистое «э»: «фрызу́рэ». В форме FRYZURĄ последнее Ą даёт «он»." }
  - { kind: register, text: "Слово нейтральное и повседневное. Устойчивые сочетания: ZMIENIĆ FRYZURĘ, MODNA FRYZURA, FRYZURA ŚLUBNA «свадебная причёска», FRYZURA NA JEŻA. Разговорное ZEPSUĆ KOMUŚ FRYZURĘ употребляется и буквально, и в шутку. Производные: FRYZJER, FRYZJERKA, FRYZJERSKI, а также UCZESANIE — более официальный синоним самой причёски. Звательная форма FRYZURO в живой речи не встречается и возможна только в шутливом обращении к собственной голове." }
