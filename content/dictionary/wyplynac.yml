# review
id: wyplynac
format: 2
lemma: "wypłynąć"
rank: 5221
pos: verb
pron: { cyr: "выпуы́нонць" }
senses:
  - id: sail-out
    ru: "выплыть, отплыть (из порта, на воду)"
    examples:
      - pl: "Statek wypłynął z portu o świcie."
        ru: "Корабль вышел из порта на рассвете."
        source: { kind: authored }
      - pl: "Rybacy wypłynęli na połów."
        ru: "Рыбаки вышли на лов."
        source: { kind: authored }
      - pl: "Wypłynęliśmy kajakiem na środek jeziora."
        ru: "Мы выплыли на каяке на середину озера."
        source: { kind: authored }
  - id: come-out
    ru: "всплыть, выйти наружу (о правде, информации); вытечь"
    examples:
      - pl: "Prawda w końcu wypłynęła."
        ru: "Правда наконец всплыла."
        source: { kind: authored }
      - pl: "Z rany wypłynęła krew."
        ru: "Из раны вытекла кровь."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "WYPŁYNĄĆ — «выплыть» и «выйти в море»: STATEK WYPŁYNĄŁ. Переносное совпадает с русским «всплыть»: PRAWDA WYPŁYNĘŁA, «правда всплыла», INFORMACJE WYPŁYNĘŁY DO PRASY, «информация просочилась в прессу». WYPŁYNĄĆ NA SZEROKIE WODY — «выйти на широкую дорогу», добиться успеха." }
  - { kind: usage, text: "Сорок две формы: глагол совершенного вида и непереходный, страдательного причастия нет; есть деепричастие WYPŁYNĄWSZY и безличное WYPŁYNIĘTO. Чередование: WYPŁYNĄŁ, но WYPŁYNĘŁA, WYPŁYNĘLI. Видовой партнёр — WYPŁYWAĆ." }
  - { kind: government, text: "Откуда — Z с родительным: Z PORTU, Z RANY. Куда — NA с винительным: NA MORZE, NA POWIERZCHNIĘ, NA POŁÓW. Куда о месте назначения — DO: WYPŁYNĄĆ DO GDAŃSKA." }
  - { kind: pronunciation, text: "Читается «выпуы́нонць», три слога, ударение на предпоследнем. Ł — короткое «у», Y — «ы»: «пуы». Ą перед Ć — «он». WYPŁYNĘŁA — «выпуынэ́уа»." }
  - { kind: register, text: "Нейтральное слово моряков и спортсменов. Переносное — журналистское: AFERA WYPŁYNĘŁA, «скандал всплыл». WYPŁYNĄĆ NA SZEROKIE WODY — книжное «добиться успеха»." }
collocations:
  - { pl: "wypłynąć z portu", ru: "выйти из порта" }
  - { pl: "wypłynąć na powierzchnię", ru: "всплыть на поверхность" }
  - { pl: "wypłynąć na szerokie wody", ru: "выйти на широкую дорогу" }
family:
  - { pl: "wypływać", ru: "выплывать; вытекать", relation: aspect }
  - { pl: "płynąć", ru: "плыть, течь", relation: root, id: plynac }
  - { pl: "wpłynąć", ru: "вплыть; повлиять", relation: root, id: wplynac }
etymology: "Приставка WY- «вы-» плюс PŁYNĄĆ «плыть», праславянское *plynǫti, то же, что русское «плыть», «выплыть». Польское Ł на месте русского «л»."
memory: "Wypłynąć — выплыть, выйти в море: statek wypłynął z portu. Prawda wypłynęła — всплыла. Wypłynąć na szerokie wody — добиться успеха. Читается «выпуы́нонць»."
idioms:
  - { pl: "wypłynąć na szerokie wody", ru: "выйти на широкую дорогу, добиться успеха" }
