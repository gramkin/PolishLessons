# review
id: oboz
format: 2
lemma: "obóz"
rank: 1166
pos: noun
pron: { cyr: "о́бус" }
senses:
  - id: camp
    ru: "лагерь, стоянка (палаточный)"
    examples:
      - pl: "Rozbiliśmy obóz w pobliżu jeziora."
        ru: "Мы разбили лагерь рядом с озером."
        source: { kind: tatoeba, id: 2470061 }
      - pl: "Tutaj rozbijemy nasz obóz."
        ru: "Здесь мы разобьём наш лагерь."
        source: { kind: translated, id: 8705141 }
      - pl: "On uciekł z obozu."
        ru: "Он сбежал из лагеря."
        source: { kind: translated, id: 12954456 }
  - id: summer-camp
    ru: "лагерь (детский, спортивный сбор)"
    examples:
      - pl: "Chciałbym jechać na obóz letni."
        ru: "Я хотел бы поехать в летний лагерь."
        source: { kind: translated, id: 933380 }
      - pl: "W sierpniu pojechaliśmy na obóz."
        ru: "В августе мы поехали в лагерь."
        source: { kind: translated, id: 521310 }
      - pl: "Jeździłem na obozy letnie."
        ru: "Я ездил в летние лагеря."
        source: { kind: translated, id: 5190345 }
  - id: refugee-camp
    ru: "лагерь (беженцев, военнопленных)"
    examples:
      - pl: "Dadaab to obóz uchodźców w Kenii."
        ru: "Дадааб — лагерь беженцев в Кении."
        source: { kind: translated, id: 2809433 }
      - pl: "Warunki sanitarne w obozach dla uchodźców były koszmarne."
        ru: "Санитарные условия в лагерях для беженцев были кошмарными."
        source: { kind: translated, id: 733024 }
      - pl: "Uchodźcy zajęli schronienie w obozie uchodźców Czerwonego Krzyża."
        ru: "Беженцы укрылись в лагере беженцев Красного Креста."
        source: { kind: translated, id: 1723583 }
notes:
  - { kind: usage, text: "Одно слово на все русские «лагеря»: палаточный, детский летний, спортивный сбор, лагерь беженцев и политический лагерь." }
  - { kind: government, text: "rozbić obóz «разбить лагерь» (винительный), jechać na obóz «поехать в лагерь» (na с винительным), być w obozie «быть в лагере» (предложный)." }
  - { kind: usage, text: "Переносно — политический лагерь: obóz rządzący «правящий лагерь», obóz opozycji «лагерь оппозиции»." }
  - { kind: pronunciation, text: "ó читается как «у», конечное z оглушается: о́бус. В косвенных падежах ó переходит в o: obozu, w obozie." }
collocations:
  - { pl: "rozbić obóz", ru: "разбить лагерь" }
  - { pl: "obóz letni", ru: "летний лагерь" }
  - { pl: "obóz uchodźców", ru: "лагерь беженцев" }
  - { pl: "obóz rządzący", ru: "правящий лагерь" }
etymology: "От obozić się «располагаться станом», от того же корня, что wóz «повозка»: лагерь — место, где встал обоз. Русское «обоз» — то же слово, только значение осталось на повозках."
memory: "obóz — «лагерь» во всех смыслах: палаточный, детский летний, лагерь беженцев и политический. Родственно русскому «обоз»: один корень «воз» — место, где встал обоз. Чередование гласной: obóz, но obozu, w obozie."
idioms:
  - { pl: "rozbić obóz", ru: "разбить лагерь" }
  - { pl: "obóz letni", ru: "летний лагерь" }
  - { pl: "obóz uchodźców", ru: "лагерь беженцев" }
