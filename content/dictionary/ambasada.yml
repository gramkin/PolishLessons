notes:
  - { kind: false-friend, text: "AMBASADA — «посольство». Посол — AMBASADOR, а польское POSEŁ сегодня значит прежде всего «депутат Сейма». Консульство — KONSULAT." }
  - { kind: usage, text: "Девять живых форм, женский род. В местном падеже D переходит в DZ: W AMBASADZIE. Родительный множественного — AMBASAD. Звательный не даётся." }
  - { kind: government, text: "Посольство какой страны — родительный: AMBASADA FRANCJI, AMBASADA NIEMIEC. В посольство — DO AMBASADY, в посольстве — W AMBASADZIE. Перед посольством — PRZED AMBASADĄ." }
  - { kind: pronunciation, text: "Читается «амбаса́да», ударение на предпоследнем слоге. Все A — чистое «а»." }
