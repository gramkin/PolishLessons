etymology: "Из французского через итальянский: слово восходит к позднелатинскому «поручение, служба». Русские «амбассадор», «амбассада» — книжные заимствования того же корня."
memory: "Ambasada — посольство; ambasador — посол; poseł — депутат. Читается «амбаса́да». W ambasadzie — в посольстве."
