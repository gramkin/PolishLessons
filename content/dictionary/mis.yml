notes:
  - { kind: false-friend, text: "Соответствие русской «мишке» точное по употреблению и разное по происхождению. Русское слово идёт от имени Михаил, то есть медведя назвали человеческим именем; польское MIŚ к именам отношения не имеет и выросло из детской, звукоподражательно-ласковой речи. Зверь как таковой называется NIEDŹWIEDŹ, и это слово тяжёлое и книжное рядом с MIŚ: в зоопарке табличка скажет NIEDŹWIEDŹ, а ребёнок скажет MIŚ. Как ласковое обращение к человеку MIŚ работает так же, как русское «мишка», и мужчине его говорят чаще, чем женщине." }
  - { kind: usage, text: "Десять форм, мужской род, одушевлённое. Основа мягкая, на -Ś, и потому во всех косвенных формах появляется мягкое SI: MISIA, MISIOWI, MISIEM, MISIU. Винительный единственного равен родительному, MISIA, потому что слово одушевлённое — даже когда речь об игрушке. Именительный множественного — MISIE, родительный — MISIÓW. Местный и звательный единственного совпадают в форме MISIU, и именно она служит обращением. Уменьшительное от уменьшительного существует: MISIACZEK, и звучит оно совсем по-детски." }
  - { kind: pronunciation, text: "Читается «мись», один слог. Сочетание MI даёт мягкое «ми», а конечное Ś — мягкое «сь», которого в русском на конце слова почти не бывает; ближе всего звук в слове «мысь», если произнести его совсем мягко. В форме MISIA слышно «ми́ся», в форме MISIEM — «ми́сем», в форме MISIU — «ми́сю». Во множественном MISIE звучит «ми́се», а MISIÓW — «ми́сюф», где Ó даёт «у», а конечное W оглушается." }
  - { kind: register, text: "Слово ласковое и детское, но совершенно обиходное и для взрослых. Устойчивые сочетания: MIŚ PLUSZOWY «плюшевый мишка», MIŚ KOALA «коала», KUBUŚ PUCHATEK — так зовут Винни-Пуха, и он тоже MIŚ. В разговоре между близкими MISIU работает как ласковое обращение. Отдельно: MIŚ в кино означает знаменитую комедию семьдесят девятого года, и упоминание названия поляк узнаёт без пояснений. Для настоящего зверя в научном и газетном тексте стоит NIEDŹWIEDŹ." }
