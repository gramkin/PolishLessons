etymology: "Слово детской речи, выросшее из ласкового подзывания зверя и не имеющее книжного источника; словари связывают его с междометным MIŚ-MIŚ, каким подзывают животное. Русская «мишка» устроена иначе: это уменьшительное от имени Михаил, и зверя в сказках звали человеческим именем, как звали Лисой Патрикеевной лису. Общее у двух слов не происхождение, а приём: оба языка нашли для медведя ласковое имя взамен прямого, потому что прямое было опасно произносить. Само NIEDŹWIEDŹ и русский «медведь» — как раз такая замена, древняя и прозрачная: тот, кто ведает мёд."
memory: "Соответствует русской «мишке» по употреблению, но не по корню: русское слово от имени Михаил, польское — из детской ласковой речи, от подзывания miś-miś. Зверь как таковой niedźwiedź, и это слово книжное рядом с miś. Любопытно, что и niedźwiedź, и «медведь» сами по себе замены: оба значат «ведающий мёд», потому что прямое имя зверя произносить избегали. Основа мягкая: misia, misiowi, misiem, а misiu служит и местным, и обращением."
