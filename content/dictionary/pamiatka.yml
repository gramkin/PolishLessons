notes:
  - { kind: false-friend, text: "Русская «памятка» и польская PAMIĄTKA построены от одного корня и значат разное. Русская «памятка» — это листок с правилами, краткое руководство, то, что помогает помнить порядок действий; по-польски это INSTRUKCJA или ULOTKA. Польская PAMIĄTKA — предмет, который хранят на память: сувенир из поездки, вещь, оставшаяся от близкого человека. Отсюда и управление: PAMIĄTKA PO KIMŚ с местным падежом означает вещь, доставшуюся от умершего, а PAMIĄTKA Z CZEGOŚ с родительным — сувенир, привезённый откуда-то. Оборот NA PAMIĄTKĘ отвечает русскому «на память»." }
  - { kind: usage, text: "Десять форм, женский род. Дательный и местный единственного — PAMIĄTCE, с меной K в C перед окончанием -E; родительный множественного — PAMIĄTEK, с беглым E. Носовая Ą сохраняется во всех формах, потому что стоит в корне, а не в окончании. Управление двойное и смыслоразличительное: PO KIMŚ о человеке, Z CZEGOŚ о месте или событии. В официальном языке слово значит ещё и памятник культуры: PAMIĄTKI NARODOWE, и тогда рядом стоит ZABYTEK, то есть памятник архитектуры." }
  - { kind: pronunciation, text: "Читается «памё́нтка», три слога, ударение на втором. Буква Ą перед T даёт носовое «он», а предшествующее MI смягчается, отчего получается «мён». Сочетание TK произносится слитно и глухо. В форме PAMIĄTCE сочетание TC читается «тц»: «памё́нтце». В форме PAMIĄTEK беглое E звучит отчётливо: «памё́нтэк». В форме PAMIĄTKĄ оба носовых дают «он»: «памё́нткон»." }
  - { kind: register, text: "Слово нейтральное и тёплое. Устойчивые сочетания: NA PAMIĄTKĘ, SKLEP Z PAMIĄTKAMI «сувенирная лавка», PAMIĄTKA RODZINNA «семейная реликвия», PAMIĄTKA PO MATCE. В разговоре о поездке слово совершенно обиходное; в разговоре о наследстве оно звучит мягче, чем SPADEK, потому что говорит о памяти, а не об имуществе. Производные: PAMIĄTKOWY «памятный, сувенирный», ZDJĘCIE PAMIĄTKOWE «фотография на память» — последний оборот звучит на каждом семейном торжестве." }
