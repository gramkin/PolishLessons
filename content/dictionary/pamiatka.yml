etymology: "От PAMIĘĆ «память» с суффиксом -KA, через основу PAMIĄT-, в которой носовой гласный Ą чередуется с Ę: та же мена видна в PAMIĘTAĆ и PAMIĄTKA, в ZAJĄĆ и ZAJĘTY. Корень праславянский, *pamętь, и русское «память» — то же слово; родственны ему «мнить», «мнение» и латинское MENS «ум», так что память, мысль и ум оказываются одного гнезда. Суффикс -KA образовал здесь предмет по его назначению: вещь для памяти. Русский построил от того же корня «памятку», но назвал ею не предмет на память, а бумагу для памяти, и в этом вся разница между двумя словами."
memory: "Корень тот же, что в «памяти», но значение другое: pamiątka это сувенир или вещь, оставшаяся от близкого, а русская «памятка» — листок с правилами, по-польски instrukcja. Управление различает смысл: pamiątka po kimś это вещь от умершего, pamiątka z czegoś — сувенир оттуда-то. Na pamiątkę значит «на память». Падежи как у всей серии на -ka: pamiątce с меной k→c, pamiątek с беглым e."
