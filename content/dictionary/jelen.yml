etymology: "Слово праславянское, общее для всех славян. Русский «олень» — то же слово: на востоке начальное «е» перешло в «о», как в «озеро» и «осень», а польский сохранил JE-. Тот же корень у литовского ELNIAS. Оленина по-польски JELENINA, и тоже от JELEŃ."
memory: "Jeleń — наш «олень»: польское начальное je- отвечает русскому о-, как jezioro и «озеро», jesień и «осень». Читается «е́лень». В разговоре jeleń — лох: robić z kogoś jelenia значит делать из кого-то дурака, wyjść na jelenia — остаться в дураках."
idioms:
  - { pl: "robić z kogoś jelenia", ru: "делать из кого-то лоха" }
  - { pl: "wyjść na jelenia", ru: "остаться в дураках" }
