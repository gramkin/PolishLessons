notes:
  - { kind: pronunciation, text: "Читается «е́лень», два слога, ударение на первом. J перед E даёт «е», а Ń — «нь». Здесь работает полезное правило: польское начальное JE- отвечает русскому О-. JELEŃ — «олень», JEZIORO — «озеро», JESIEŃ — «осень», JEDEN — «один». Русский в начале слова заменил «е» на «о», польский сохранил древнее JE-." }
  - { kind: false-friend, text: "В разговоре JELEŃ — это простак, лох, тот, кого легко обмануть. ROBIĆ Z KOGOŚ JELENIA значит «делать из кого-то дурака», а WYJŚĆ NA JELENIA — «остаться в дураках». Похожее значение есть и у русского жаргонного «олень», так что запомнить легко." }
  - { kind: usage, text: "Десять форм, мужской род, одушевлённое: винительный совпадает с родительным, JELENIA. Конечное Ń перед гласной пишется как NI: JELENIA, JELENIU, JELENIE. Родительный множественного — JELENI, без окончания -ÓW. Самка оленя — ŁANIA, детёныш — JELONEK." }
  - { kind: government, text: "Охотиться на оленей — POLOWAĆ NA JELENIE, NA с винительным, а винительный множественного у животных совпадает с именительным. Сделать из кого-то лоха — ROBIĆ Z KOGOŚ JELENIA, Z с родительным. Остаться в дураках — WYJŚĆ NA JELENIA, NA с винительным." }
  - { kind: register, text: "В прямом смысле слово нейтральное, лесное и охотничье: JELEŃ SZLACHETNY, RYK JELENI во время осеннего гона. Переносное JELEŃ — разговорное и грубоватое, но не бранное." }
collocations:
