notes:
  - { kind: false-friend, text: "КОРЕНЬ ЗНАКОМЫЙ, НО РАБОТАЕТ НА ТРИ СТОРОНЫ. Польское chować значит и «ПРЯТАТЬ», и «РАСТИТЬ», и — с приставкой — «ХОРОНИТЬ»: chować pieniądze «прятать деньги», chować dzieci «растить детей», pochować zmarłego «похоронить умершего». В русском этот корень разошёлся по двум словам: областному «ховать» (прятать) и «хоронить». Приставочное wychować оставляет себе только одно значение — «воспитать», и спутать его уже не с чем." }
  - { kind: government, text: "Воспитывают КОГО — винительный: wychować syna, dzieci. Но «воспитать КЕМ-ТО» строится иначе, чем по-русски: поляк ставит NA с ВИНИТЕЛЬНЫМ — wychować syna na lekarza, на кого, а не кем. Русский здесь берёт творительный («воспитать врачом») или оборот «вырастить врача». Это расхождение стоит запомнить отдельно." }
  - { kind: usage, text: "Вид совершенный, несовершенная пара — wychowywać: wychowywała dzieci przez dwadzieścia lat «она растила детей двадцать лет», но wychowała je na porządnych ludzi «она вырастила их порядочными людьми». Причастие wychowany живёт самостоятельно: dobrze wychowany «благовоспитанный», źle wychowany «невоспитанный»." }
  - { kind: register, text: "Wychowanie fizyczne, сокращённо WF, — это школьная «физкультура». А wychowawca — не «воспитатель» вообще, а классный руководитель. Оба слова нужны всякому, кто имеет дело с польской школой." }
collocations:
  - { pl: "dobrze wychowany", ru: "благовоспитанный" }
  - { pl: "wychowanie fizyczne", ru: "физкультура" }
  - { pl: "wychować na lekarza", ru: "вырастить врачом" }
family:
  - { pl: "chować", ru: "прятать; растить", relation: root }
  - { pl: "wychowywać", ru: "воспитывать", relation: aspect }
  - { pl: "wychowawca", ru: "классный руководитель", relation: derived }
etymology: "Приставка wy- плюс chować, а корень тот же, что в областном русском «ховать» «прятать» и в «хоронить». Исходное значение было «беречь, укрывать», и из него выросли оба польских смысла: прятать вещь и оберегать ребёнка, то есть растить. Отсюда wychowanie «воспитание» и wychowawca «классный руководитель»."
memory: "wychować — «воспитать», от chować, которое значит сразу и «прятать», и «растить» (а с приставкой — «хоронить»). Русский родственник — областное «ховать». Главное отличие в управлении: wychować syna NA lekarza, на кого, а не кем."
idioms:
