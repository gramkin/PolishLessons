        ru: "Проект был сделан как попало."
        source: { kind: authored }
  - id: move-aside
    ru: "отвалить, отодвинуть (тяжёлое)"
    examples:
      - pl: "Odwalili kamień od wejścia do piwnicy."
        ru: "Они отвалили камень от входа в подвал."
