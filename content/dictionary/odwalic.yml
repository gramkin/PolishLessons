notes:
  - { kind: register, text: "Слово разговорное во всех значениях, и в официальном тексте ему места нет: в заявлении или отчёте пишут WYKONAĆ или ODSUNĄĆ. Оттенок зависит от дополнения. ODWALIĆ KAWAŁ ROBOTY — скорее похвала, «отмахать уйму работы». ODWALIĆ COŚ NA KOLANIE — осуждение, «сделать на коленке». А повелительное ODWAL SIĘ — уже грубость, «отвались, отстань»; это не ругательство, но сказанное взрослому человеку звучит резко. Третье значение, про камень или снег, нейтральнее прочих, потому что оно прямое." }
  - { kind: usage, text: "Три значения, и все держатся на одном образе: отвалить в сторону тяжёлое. Отсюда и работа, которую «отвалили», то есть сдвинули с места целую груду, и небрежность, когда сдвинули лишь бы с глаз. Прямое значение самое старое: ODWALIĆ KAMIEŃ, ODWALIĆ ŚNIEG. Отдельно живёт возвратное ODWALIĆ SIĘ в значении «отстать», и форма ODWAL употребляется почти только в нём. Есть и просторечное ODWALIĆ KITĘ — «умереть», буквально «отвалить хвост»." }
  - { kind: pronunciation, text: "Читается «одва́лиць», в три слога, с ударением на предпоследнем: O-DWA-LIĆ, значит на DWA. Приставка OD перед звонким w сохраняет звонкость, поэтому звучит «од», а не «от», — в отличие от русского «отвалить», где пишется т. Сочетание LIĆ на конце мягкое, «лиць». В форме ODWAL ударение переходит на первый слог, «о́дваль», потому что слогов стало два." }
  - { kind: government, text: "Глагол переходный: что сделали или отодвинули — винительный падеж без предлога, ODWALIĆ ROBOTĘ, ODWALIĆ KAMIEŃ. Откуда отодвинули — предлог OD с родительным: ODWALIĆ KAMIEŃ OD WEJŚCIA, и приставка с предлогом здесь совпадают, как в DOPAŚĆ DO. Возвратная форма требует OD с родительным для лица: ODWAL SIĘ ODE MNIE «отстань от меня», где ODE — это вариант предлога OD перед скоплением согласных." }
collocations:
  - { pl: "odwalić kawał roboty", ru: "отмахать уйму работы" }
  - { pl: "odwalić coś na kolanie", ru: "сделать на коленке" }
  - { pl: "odwalić kamień", ru: "отвалить камень" }
family:
  - { pl: "walić", ru: "валить, бить", relation: root, id: walic }
  - { pl: "zawalić", ru: "завалить; провалить", relation: root }
  - { pl: "odwalać", ru: "отваливать", relation: aspect }
  - { pl: "nawalić", ru: "навалить; напортить", relation: root }
etymology: "Приставка OD- «от» плюс WALIĆ «валить, бросать с силой», из праславянского *valiti, от которого и русское «валить». Корень тот же, и приставка та же, поэтому ODWALIĆ и «отвалить» — слово в слово одно и то же образование. Прямое значение, сдвинуть в сторону что-то тяжёлое, сохранилось в обоих языках. Дальше пути разошлись: польский развил из него разговорное «проделать много работы» и «сделать небрежно», а русский — «уйти, отплыть» и грубое «отвали». Единственное, что совпало в переносном, — именно грубый отказ: ODWAL SIĘ и «отвали» значат одно и то же."
memory: "Разговорное во всех значениях: od- плюс walić, буквально «отвалить». Odwalić kawał roboty — похвала, odwalić na kolanie — упрёк, odwal się — грубость. Пишется od перед w и звучит «од», не «от». Ударение «одва́лиць»."
idioms:
  - { pl: "odwal się", ru: "отвались, отстань" }
  - { pl: "odwalić kawał roboty", ru: "проделать уйму работы" }
  - { pl: "odwalić kitę", ru: "умереть (просторечное)" }
formExamplesSkip:
  - { form: "odwaleni", reason: "ODWALIĆ берёт прямым дополнением вещь — ROBOTĘ, KAMIEŃ, ŚNIEG, — но не человека: «отвалить кого-то» по-польски не говорят, а грубое ODWAL SIĘ возвратно и дополнения не имеет. Поэтому страдательное причастие мужско-личного множественного числа, которое предполагает людей в роли прямого дополнения, у этого глагола грамматически невозможно. Формы ODWALONY, ODWALONA и ODWALONE согласуются с работой и камнем и написаны, а ODWALENI живёт только в таблице склонения." }
