notes:
  - { kind: false-friend, text: "Это слово и русское «осторожность» — одно и то же, и различаются они только огласовкой корня, по правилу, которое стоит дороже самого слова. Там, где в русском корне звучит -ОРО- или -ЕРЕ-, в польском гласной между согласными нет: OSTROŻNY и «осторожный», STRÓŻ и «сторож», GRÓD и «город», PROCH и «порох», BRZEG и «берег». Это не выпадение звука в польском, а наоборот: восточнославянские языки развили полногласие, а польский сохранил старую короткую форму." }
  - { kind: government, text: "В чём осторожность — предлог W с предложным: OSTROŻNOŚĆ W SŁOWACH «осторожность в словах», как по-русски. С осторожностью — Z с творительным: Z OSTROŻNOŚCIĄ. Ради осторожности — DLA OSTROŻNOŚCI с родительным, и это готовая формула, которую стоит запомнить целиком. Прилагательное OSTROŻNY управляет предлогом Z с творительным: BĄDŹ OSTROŻNY Z TYM NOŻEM «будь осторожен с этим ножом», и здесь схема тоже совпадает с русской." }
  - { kind: pronunciation, text: "Читается «остро́жносьчь», три слога, ударение на втором, то есть на предпоследнем. Буква Ż с точкой даёт «ж», поэтому середина слова звучит «рож», а не «роз». Начало читается просто, «ост». Конец слова, -ŚĆ, это два мягких звука подряд, «сьчь», и произносятся они слитно. В прилагательном OSTROŻNY слышно «остро́жны», с «ы» на конце." }
  - { kind: usage, text: "Шесть форм, разряд женских существительных на -OŚĆ, где суффикс отвечает русскому -ОСТЬ. Существительное отвлечённое, и множественное число у него почти не нужно: оно годится разве что для перечисления мер предосторожности в инструкции. Не путать с OSTROŚĆ, которое от OSTRY «острый» и значит «острота», в том числе резкость в фотографии: USTAW OSTROŚĆ «настрой резкость». Два слова похожи на вид, но корни у них разные." }
  - { kind: register, text: "Слово нейтральное, частое в инструкциях и предупреждениях. Частые обороты: ZACHOWAĆ OSTROŻNOŚĆ «соблюдать осторожность», Z OSTROŻNOŚCIĄ «с осторожностью», DLA OSTROŻNOŚCI «для осторожности», NADMIERNA OSTROŻNOŚĆ «излишняя осторожность». На дорожных щитах и в предупреждениях чаще стоит короткое OSTROŻNIE «осторожно» или UWAGA «внимание». Прилагательное OSTROŻNY совершенно повседневно: BĄDŹ OSTROŻNY значит «будь осторожен»." }
