etymology: "Сложено из приставки O- и основы STROŻ-, той же, что в STRÓŻ «сторож» и STRZEC «стеречь», от праславянского корня со значением охраны и присмотра. Русское «осторожный» собрано из тех же частей и того же корня, только с полногласием: «о-сторож-ный» против польского O-STROŻ-NY. Поэтому родство видно на письме сразу, стоит лишь мысленно вставить пропавшее «о». Тот же ряд даёт STRÓŻ и «сторож», GRÓD и «город», BRZEG и «берег». Суффикс -OŚĆ при этом точно отвечает русскому -ОСТЬ."
memory: "То же слово, что «осторожность», и правило огласовки важнее слова: где в русском -оро- или -ере-, в польском гласной нет, ostrożny и «осторожный», stróż и «сторож», gród и «город», brzeg и «берег». Корень тот же, что в strzec «стеречь». Запомнить две готовые формулы: dla ostrożności «для осторожности» и zachować ostrożność. И не путать с ostrość, которое от ostry и значит «острота, резкость»."
