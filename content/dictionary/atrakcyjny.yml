senses:
  - id: attractive
    ru: "привлекательный (о человеке, внешности)"
    examples:
      - pl: "To bardzo atrakcyjna kobieta."
        ru: "Это очень привлекательная женщина."
        source: { kind: authored }
      - pl: "Uważa się za atrakcyjnego mężczyznę."
        ru: "Он считает себя привлекательным мужчиной."
        source: { kind: authored }
      - pl: "Z wiekiem stała się jeszcze atrakcyjniejsza."
        ru: "С возрастом она стала ещё привлекательнее."
        source: { kind: authored }
  - id: appealing
    ru: "выгодный, заманчивый (о предложении, цене, месте)"
    examples:
      - pl: "Dostał atrakcyjną ofertę pracy."
        ru: "Он получил заманчивое предложение о работе."
        source: { kind: authored }
      - pl: "Ceny są tu bardzo atrakcyjne."
        ru: "Цены здесь очень выгодные."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Русское «атракцион» — карусель в парке, а польское ATRAKCJA — «достопримечательность, приманка»: ATRAKCJE TURYSTYCZNE. Прилагательное ATRAKCYJNY шире русского «привлекательный»: оно и о внешности, и о деньгах. ATRAKCYJNA CENA — «выгодная цена», ATRAKCYJNA OFERTA — «заманчивое предложение». Русский тут не скажет «привлекательная цена» так легко, как поляк." }
  - { kind: usage, text: "Полная парадигма: ATRAKCYJNY, ATRAKCYJNIEJSZY, NAJATRAKCYJNIEJSZY. Простые степени обычны: ATRAKCYJNIEJSZA OFERTA. Форма для мужчин-людей во всех трёх степенях: ATRAKCYJNI, ATRAKCYJNIEJSI, NAJATRAKCYJNIEJSI." }
  - { kind: government, text: "Привлекательный для кого-то — ATRAKCYJNY DLA KOGOŚ, DLA с родительным: ATRAKCYJNY DLA TURYSTÓW, DLA INWESTORÓW. В сравнении: ATRAKCYJNIEJSZY NIŻ или OD с родительным." }
  - { kind: pronunciation, text: "Читается «атракцы́йны», четыре слога, ударение на предпоследнем. KC — «кц», CY — твёрдое «цы», J — «й». В ATRAKCYJNIEJSZY: «атракцыйне́йшы»." }
  - { kind: register, text: "Нейтральное слово, частое в рекламе, туризме и в описаниях внешности. О человеке звучит сдержаннее, чем PIĘKNY или PRZYSTOJNY: ATRAKCYJNY — тот, кто нравится, необязательно красавец. В объявлениях о работе ATRAKCYJNE WYNAGRODZENIE — «привлекательная зарплата», стандартная формула." }
collocations:
  - { pl: "atrakcyjna oferta", ru: "заманчивое предложение" }
  - { pl: "atrakcyjna cena", ru: "выгодная цена" }
  - { pl: "atrakcyjne wynagrodzenie", ru: "привлекательная зарплата" }
family:
  - { pl: "atrakcja", ru: "достопримечательность, приманка", relation: root }
  - { pl: "przystojny", ru: "красивый (о мужчине)", relation: root, id: przystojny }
  - { pl: "nieatrakcyjny", ru: "непривлекательный", relation: derived }
etymology: "Из латинского attrahere, «притягивать»: ad- «к» и trahere «тянуть». Привлекательное — то, что тянет к себе. Тот же корень в русском «трактор», «трактат» и в польском ATRAKCJA. Польский суффикс -YJNY — обычный для прилагательных от слов на -CJA."
memory: "Atrakcyjny — привлекательный: atrakcyjna kobieta. И выгодный: atrakcyjna cena, atrakcyjna oferta. Atrakcyjniejszy, najatrakcyjniejszy. Читается «атракцы́йны»."
idioms:
  - { pl: "atrakcyjne wynagrodzenie", ru: "привлекательная зарплата (формула вакансий)" }
