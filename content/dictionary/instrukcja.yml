notes:
  - { kind: usage, text: "Класс на -CJA, и правило у него то же, что у PRODUKCJA, OBSERWACJA и DYSKUSJA: родительный, дательный и местный падеж единственного числа совпадают в форме INSTRUKCJI, и она же служит родительным множественного. Старая книжная форма родительного множественного — INSTRUKCYJ, как PRODUKCYJ и OBSERWACYJ. Самые частые сочетания: INSTRUKCJA OBSŁUGI «инструкция по эксплуатации», что буквально значит «инструкция обслуживания», ZGODNIE Z INSTRUKCJĄ «согласно инструкции», WBREW INSTRUKCJI «вопреки инструкции»." }
  - { kind: pronunciation, text: "Читается «инстру́кцья», ударение на предпоследнем слоге. Сочетание CJA даёт «цья», в один слог, а не «ция» в два: слово четырёхсложное, IN-STRU-KCJA — точнее трёхсложное, потому что KCJA читается одним слогом «кцья». Скопление STR в начале произносится слитно, как в русском. Русское слово длиннее на слог и ударение в нём стоит там же, так что перестраивать нужно только окончание." }
  - { kind: government, text: "Женский род на -A. Винительный на -Ę: PRZECZYTAJ INSTRUKCJĘ. Согласно чему — оборот ZGODNIE Z с творительным: ZGODNIE Z INSTRUKCJĄ. Вопреки чему — WBREW с дательным: WBREW INSTRUKCJI. К чему инструкция — предлог DO с родительным: INSTRUKCJA DO PRALKI, либо родительный без предлога: INSTRUKCJA OBSŁUGI PRALKI. При отрицании винительный уходит в родительный: NIE PRZECZYTAŁ INSTRUKCJI, и форма совпадает с родительным единственного." }
  - { kind: false-friend, text: "Значение совпадает с русским полностью, и ловушек в смысле нет. Отметить стоит лишь то, что польское слово покрывает и письменное руководство, и устное указание, и во втором значении оно частотнее русского: DOSTAĆ INSTRUKCJE значит «получить указания», а не «получить инструкции» в смысле брошюр. Русский в этом случае скажет «указания» или «распоряжения». Поэтому при переводе на русский нужно смотреть, о бумаге речь или о приказе." }
