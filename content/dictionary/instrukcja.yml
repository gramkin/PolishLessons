etymology: "Из латинского INSTRUCTIO «наставление, обучение», от INSTRUERE «выстраивать, снаряжать, наставлять», собранного из IN- и STRUERE «складывать, строить». Тот же корень STRUERE дал KONSTRUKCJA, STRUKTURA, DESTRUKCJA и русские «конструкция», «структура», так что всё гнездо учащемуся знакомо, и INSTRUKCJA читается в нём как «выстраивание», приведение в порядок. Образ исходно военный: INSTRUERE значило построить войско в линию, и наставление понималось как такое же выстраивание знаний. Русская «инструкция» пришла той же дорогой, через латынь и немецкий."
memory: "Класс на -cja: instrukcji служит родительному, дательному, местному единственного и родительному множественного; старая форма — instrukcyj. Инструкция по эксплуатации — instrukcja obsługi, буквально «инструкция обслуживания». Во втором значении это «указания»: dostać instrukcje. Согласно — zgodnie z instrukcją, вопреки — wbrew instrukcji, дательный."
