# review
id: pieprzyc
format: 2
lemma: "pieprzyć"
rank: 453
pos: verb
aspect: imperf
pron: { cyr: "пе́пшыць" }
senses:
  - id: season
    ru: "перчить, приправлять перцем"
    examples:
      - pl: "Pieprz mięso do smaku."
        ru: "Поперчи мясо по вкусу."
        source: { kind: authored }
      - pl: "Kucharz pieprzy zupę."
        ru: "Повар перчит суп."
        source: { kind: authored }
      - pl: "Posól i pieprz warzywa."
        ru: "Посоли и поперчи овощи."
        source: { kind: authored }
  - id: talk-rubbish
    ru: "разговорное: молоть чепуху, нести вздор (грубое)"
    examples:
      - pl: "Przestań pieprzyć!"
        ru: "Перестань нести чушь!"
        source: { kind: translated, id: 10704015 }
      - pl: "Od rana wszystko się pieprzy."
        ru: "С самого утра всё идёт наперекосяк."
        source: { kind: translated, id: 997621 }
      - pl: "Nie pieprz głupot."
        ru: "Не мели чепухи."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Нейтральное значение у глагола только одно — «перчить», от существительного pieprz «перец». Во всех остальных употреблениях слово грубое." }
  - { kind: false-friend, text: "Разговорное pieprzyć значит «нести чушь», а Pieprzyć to! — грубое «к чёрту это». Вежливый синоним для первого — gadać głupoty." }
  - { kind: usage, text: "Причастие pieprzony в живой речи работает как грубое усиление «чёртов, долбаный»: pieprzony samochód. В нейтральной речи оно значит просто «поперченный»." }
  - { kind: false-friend, text: "Форма pieprz się — это грубое «отвали», а не «поперчись». Будьте осторожны: сам по себе pieprz — это мирное существительное «перец»." }
collocations:
  - { pl: "pieprz i sól", ru: "перец и соль" }
  - { pl: "pieprzyć do smaku", ru: "перчить по вкусу" }
  - { pl: "przestań pieprzyć", ru: "перестань нести чушь" }
  - { pl: "pieprzyć głupoty", ru: "нести чушь" }
etymology: "От pieprz «перец», а то — из латинского piper через германское посредство. Русский «перец» пришёл из того же латинского источника, как и английское pepper."
memory: "pieprzyć буквально значит «перчить», от pieprz «перец» — того же латинского piper, что и русский «перец». Но в живой речи глагол почти всегда грубый: przestań pieprzyć «перестань нести чушь», а причастие pieprzony работает как «чёртов». Нейтральная замена для второго смысла — gadać głupoty. А скороговорка nie pieprz, Pietrze, pieprzem wieprza — про самый настоящий перец."
idioms:
  - { pl: "nie pieprz, Pietrze, pieprzem wieprza", ru: "скороговорка: «не перчи, Пётр, перцем кабана»" }
  - { pl: "pieprzyć głupoty", ru: "нести чушь" }
  - { pl: "pieprzyć głodne kawałki", ru: "молоть вздор" }
formExamplesSkip:
  - { form: "pieprzeni", reason: "лично-мужская форма страдательного причастия: в нейтральном значении «перчить» к людям не применяется, поэтому такой формы в языке нет" }
