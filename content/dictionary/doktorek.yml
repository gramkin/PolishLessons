notes:
  - { kind: register, text: "Слово двузначно по тону, и различает их только контекст. Суффикс -EK в польском образует и уменьшительные, и пренебрежительные формы, поэтому DOKTOREK может значить и «докторишка» с насмешкой, и «докторок» с теплотой, как NASZ DOKTOREK о сельском враче, которого любят. В газетной речи и в споре слово почти всегда пренебрежительное, в деревенском разговоре — скорее ласковое. Нейтрального употребления у него нет вовсе: назвать так врача в его присутствии нельзя. Для нейтрального обращения есть DOKTOR и PAN DOKTOR, а женщина-врач — PANI DOKTOR или DOKTORKA, что с DOKTOREK не связано." }
  - { kind: usage, text: "Десять форм, мужской род, одушевлённое лицо. Главный урок — мужское-личное множественное DOKTORKOWIE на -OWIE. Это окончание в польском закреплено за словами, обозначающими лиц с оттенком уважения или родства: WUJOWIE «дядья», SYNOWIE «сыновья», PROFESOROWIE. У DOKTOREK оно звучит слегка иронически именно потому, что уважительное окончание присоединяется к пренебрежительной основе. В основе работает беглое E: DOKTOREK, но DOKTORKA, DOKTORKIEM — гласный исчезает во всех косвенных падежах, как в WOREK и WORKA. Местный единственного — DOKTORKU." }
  - { kind: false-friend, text: "Русское «докторишка» однозначно пренебрежительно, а польское DOKTOREK способно быть и тёплым, и это главное различие. Второе: русский строит уменьшительное от «доктора» через -ИШК- с ясной отрицательной окраской, польский использует нейтральный по форме -EK, и тон приходится читать из контекста. Третье различие в парадигме: русское «докторишки» во множественном, польское DOKTORKOWIE с уважительным -OWIE, что по-русски передать нечем — приходится выбирать между «докторишками» и «докторами» по смыслу фразы." }
  - { kind: pronunciation, text: "Читается «докто́рэк», три слога, ударение на предпоследнем. Буква O в обоих первых слогах звучит отчётливо, без редукции: «док-то», а не «дак-та». Буква E в последнем слоге — «э». Конечное K твёрдое. В косвенных падежах беглое E исчезает и слогов становится меньше на один: DOKTORKA звучит «докто́рка», DOKTORKIEM — «докто́ркем». Во множественном DOKTORKOWIE четыре слога, ударение по-прежнему предпоследнее: «докторко́ве»." }
