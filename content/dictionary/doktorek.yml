etymology: "От DOKTOR, из латинского DOCTOR «учитель», от DOCERE «учить», с польским суффиксом -EK. Суффикс этот в праславянском был только уменьшительным, но в польском развил вторую, пренебрежительную функцию, и сегодня обе живут рядом: DOMEK это «домик» без всякой насмешки, а PISARZEK — «писака». Различие несёт контекст, а не форма, и в этом польский отличается от русского, где для пренебрежения есть отдельные суффиксы -ИШК- и -ЁНК-. Множественное на -OWIE пришло из древнего склонения существительных мужского рода, обозначавших лиц, и сохранилось у слов родства и уважения; его присоединение к уменьшительной основе и даёт тот иронический оттенок, который чувствуется в DOKTORKOWIE."
memory: "Суффикс -ek в польском и уменьшительный, и пренебрежительный, так что doktorek может быть и «докторишкой», и тёплым «докторком» — решает контекст, а не форма. Нейтрального употребления нет: врачу так не говорят, для этого pan doktor. В парадигме два урока: мужское-личное множественное doktorkowie на -owie (как synowie, wujowie), и беглое e, которое исчезает в косвенных падежах — doktorek, но doktorka, doktorkiem."
