# review
id: krakac
format: 2
lemma: "krakać"
rank: 5820
pos: verb
aspect: imperf
pron: { cyr: "кра́каць" }
senses:
  - id: caw
    ru: "каркать (о вороне, вороне)"
    examples:
      - pl: "Wrona kracze na dachu."
        ru: "Ворона каркает на крыше."
        source: { kind: authored }
      - pl: "Nad polem kraczą kruki."
