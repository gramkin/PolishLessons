  - id: croak-gloom
    ru: "каркать, пророчить беду"
    note: "разг."
    examples:
      - pl: "Nie kracz, wszystko będzie dobrze."
        ru: "Не каркай, всё будет хорошо."
        source: { kind: authored }
      - pl: "Ciągle kraczesz, że się nie uda."
        ru: "Ты всё время каркаешь, что ничего не выйдет."
        source: { kind: authored }
      - pl: "Sąsiad krakał, że będzie powódź."
        ru: "Сосед каркал, что будет наводнение."
        source: { kind: authored }
notes:
  - { kind: usage, text: "В настоящем времени K чередуется с CZ: KRACZĘ, KRACZESZ, KRACZE, KRACZĄ, повелительное KRACZ! Прошедшее и инфинитив сохраняют K: KRAKAŁ, KRAKAĆ." }
  - { kind: false-friend, text: "Как и русское «каркать», переносно значит «пророчить беду»: NIE KRACZ! — «не каркай!». «Накаркать» — WYKRAKAĆ: wykrakałeś deszcz «ты накаркал дождь»." }
  - { kind: government, text: "Несовершенный вид, непереходный глагол: страдательных причастий нет, есть только безличное KRAKANO «каркали». Совершенный вид — ZAKRAKAĆ «закаркать», однократное — KRAKNĄĆ «каркнуть»." }
collocations:
  - { pl: "wrona kracze", ru: "ворона каркает" }
  - { pl: "krakać nad głową", ru: "каркать над головой" }
  - { pl: "ciągle krakać", ru: "постоянно каркать, ныть" }
