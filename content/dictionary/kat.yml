notes:
  - { kind: pronunciation, text: "Предложный падеж — W KĄCIE, с переходом t в ci, как в element — w elemencie, brat — o bracie, świat — na świecie. Носовое ą при этом держится во всех формах: kąta, kątem, kątów, и никуда не исчезает. Читается оно перед t как «он»: «конт»." }
  - { kind: usage, text: "Корень *kǫtъ в русском тоже есть, но ушёл на окраину языка: это «закуток», уголок, укромное место. Нашим обычным «углом» стало слово от другого корня, *ǫgъlъ, и оно по-польски тоже существует — WĘGIEŁ, но означает только наружный угол здания. Языки как будто поменялись: у поляков повседневное слово от нашего редкого корня, а наше повседневное у них редкое. Само kąt покрывает и геометрию, и угол комнаты, и собственное жильё: mieć swój kąt." }
collocations:
  - { pl: "kąt prosty", ru: "прямой угол" }
  - { pl: "w kącie", ru: "в углу" }
  - { pl: "mieć swój kąt", ru: "иметь свой угол" }
family:
  - { pl: "kątowy", ru: "угловой", relation: derived }
  - { pl: "zakątek", ru: "уголок, закуток", relation: derived }
  - { pl: "kącik", ru: "уголок", relation: derived }
etymology: "Из праславянского *kǫtъ «угол, закуток». В русском этот корень сохранился в «закутке» и «куте» — переднем углу избы, — а обычным словом стало «угол», от другого праславянского корня *ǫgъlъ. Польский распорядился ровно наоборот: kąt у него повседневное слово, а węgieł от нашего корня означает лишь наружный угол стены."
memory: "Предложный с мягким ci: w kącie, как w elemencie. А корень тот же, что в нашем «закутке»."
idioms:
  - { pl: "kąt prosty", ru: "прямой угол" }
  - { pl: "mieć swój kąt", ru: "иметь свой угол" }
