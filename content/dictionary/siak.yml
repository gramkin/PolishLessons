etymology: "Старое указательное наречие, парное к tak: tak «так» — siak «сяк», от праславянского указательного корня со значением «этот». В русском сохранился тот же парный оборот «так или сяк», и, как в польском, второе слово вне него не употребляется."
memory: "siak живёт только в tak czy siak «так или иначе» — ровно как русское «сяк» в «так или сяк». Отдельно это слово не ставят."
