notes:
  - { kind: usage, text: "Самостоятельно слово не употребляется: оно живёт только в застывшем обороте tak czy siak «так или иначе». В корпусе польских предложений проекта нет ни одного примера на siak вне этого оборота." }
  - { kind: usage, text: "Рядом стоит такой же застывший оборот tak czy owak с тем же значением; owak вне него тоже не встречается." }
  - { kind: government, text: "Частица неизменяемая, падежа и степеней не имеет." }
  - { kind: false-friend, text: "Русское «сяк» из «так или сяк» — тот же корень и та же судьба: вне оборота оно тоже не живёт." }
collocations:
