  - form: "wyprzedzeniem"
    pl: "Gdybym o tym wiedział z wyprzedzeniem, prawdopodobnie bym w tym uczestniczył."
    ru: "Если бы я знал об этом заранее, я, вероятно, принял бы в этом участие."
