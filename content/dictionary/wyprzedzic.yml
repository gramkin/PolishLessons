# review
id: wyprzedzic
format: 2
lemma: "wyprzedzić"
rank: 2429
pos: verb
aspect: perf
pron: { cyr: "выпшэ́дзиць" }
senses:
  - id: overtake
    ru: "обогнать, опередить"
    examples:
      - pl: "Ten samochód mnie wyprzedził."
        ru: "Эта машина меня обогнала."
        source: { kind: translated, id: 670389 }
      - pl: "Samochód wyprzedził ciężarówkę na autostradzie."
        ru: "Машина обогнала грузовик на шоссе."
        source: { kind: translated, id: 11113340 }
      - pl: "Jeśli chcesz wyprzedzić musisz włączyć kierunkowskaz."
        ru: "Если хочешь обогнать, нужно включить поворотник."
        source: { kind: translated, id: 6109710 }
  - id: ahead-of-time
    ru: "опережение (в обороте z wyprzedzeniem)"
    examples:
      - pl: "Wszystko zostało przygotowane z dużym wyprzedzeniem."
        ru: "Всё было подготовлено сильно заранее."
        source: { kind: translated, id: 3529753 }
      - pl: "Wszyscy wiemy, że Mendel wyprzedził swe czasy."
        ru: "Мы все знаем, что Мендель опередил своё время."
        source: { kind: translated, id: 960698 }
notes:
  - { kind: government, text: "Винительный падеж: wyprzedzić samochód. Опередить своё время — wyprzedzić swoje czasy." }
  - { kind: false-friend, text: "wy- + przedzić, от przód «перёд», которое уже есть в словаре. Русское «опередить» — тоже от «перёд», так что образ общий." }
  - { kind: usage, text: "Оборот z wyprzedzeniem значит «заранее, заблаговременно»: z dużym wyprzedzeniem «сильно заранее». Это самое частое употребление слова." }
  - { kind: usage, text: "Несовершенный вид — wyprzedzać. В ПДД wyprzedzanie — «обгон»." }
collocations:
  - { pl: "z wyprzedzeniem", ru: "заранее" }
  - { pl: "wyprzedzić swoje czasy", ru: "опередить своё время" }
etymology: "wy- + przedzić, от przód «перёд»; русское «опередить» — тот же образ."
memory: "wyprzedzić — «обогнать, опередить». Самое частое — оборот z wyprzedzeniem «заранее». Несовершенный вид — wyprzedzać."
idioms:
  - { pl: "z wyprzedzeniem", ru: "заранее" }
