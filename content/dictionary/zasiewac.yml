format: 2
lemma: "zasiewać"
rank: 2144
pos: verb
aspect: imperf
pron: { cyr: "засе́ваць" }
senses:
  - id: sow
    ru: "засевать, сеять"
    examples:
      - pl: "Rolnicy zasiewają pole zbożem."
        ru: "Земледельцы засевают поле зерном."
        source: { kind: authored }
      - pl: "Wiosną zasiewamy warzywa."
        ru: "Весной мы сеем овощи."
        source: { kind: authored }
      - pl: "Zasiewać trzeba o świcie."
        ru: "Сеять нужно на рассвете."
        source: { kind: authored }
  - id: sow-figurative
    ru: "сеять (тревогу, сомнение) — переносно"
    examples:
      - pl: "Zasiewają niepokój wśród ludzi."
        ru: "Они сеют тревогу среди людей."
        source: { kind: authored }
      - pl: "Plotki zasiewają wątpliwość."
        ru: "Сплетни сеют сомнение."
        source: { kind: authored }
notes:
  - { kind: government, text: "zasiewać coś czymś «засевать что-л. чем-л.»: винительный плюс творительный, как в русском." }
  - { kind: usage, text: "Несовершенный вид; совершенный — zasiać." }
  - { kind: false-friend, text: "Корень siać «сеять» — ср. русское «сеять», «засевать». Здесь языки совпадают." }
  - { kind: usage, text: "Переносное употребление то же, что в русском: сеять тревогу, сомнение, раздор. В корпусе слово не встречается." }
collocations:
  - { pl: "zasiewać pole", ru: "засевать поле" }
  - { pl: "zasiewać niepokój", ru: "сеять тревогу" }
etymology: "za- + siewać, от siać «сеять», праславянское *sěti; русское «засевать» собрано так же."
memory: "zasiewać — «засевать», и буквально, и переносно: zasiewać niepokój «сеять тревогу». Совершенный вид — zasiać."
idioms:
  - { pl: "zasiewać niepokój", ru: "сеять тревогу" }
