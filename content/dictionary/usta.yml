# review
id: usta
format: 2
lemma: "usta"
rank: 877
pos: noun
pron: { cyr: "у́ста" }
senses:
  - id: mouth
    ru: "рот"
    note: "Обычное, повседневное слово — не «уста». Единственного числа у него нет."
    examples:
      - pl: "Oddychaj przez nos, nie przez usta."
        ru: "Дыши носом, а не ртом."
        source: { kind: tatoeba, id: 5961814 }
      - pl: "Otwórz usta!"
        ru: "Открой рот!"
        source: { kind: translated, id: 598042 }
      - pl: "Otwórz usta."
        ru: "Открой рот."
        source: { kind: translated, id: 10606300 }
  - id: in-mouth
    ru: "w ustach — во рту"
    examples:
      - pl: "Siedział tam z fajką w ustach."
        ru: "Он сидел там с трубкой во рту."
        source: { kind: tatoeba, id: 3710454 }
      - pl: "Miałem sucho w ustach."
        ru: "У меня пересохло во рту."
        source: { kind: translated, id: 592892 }
      - pl: "Nie mówi się z pełnymi ustami."
        ru: "Не говори с набитым ртом."
        source: { kind: tatoeba, id: 539962 }
  - id: silent
    ru: "об умолчании: nie puścić pary z ust — не проронить ни слова"
    examples:
      - pl: "Nie puścił pary z ust."
        ru: "Он не проронил ни слова."
        source: { kind: translated, id: 1592083 }
      - pl: "Nikt nie otworzył ust."
        ru: "Никто не раскрыл рта."
        source: { kind: translated, id: 8379982 }
      - pl: "Arystoteles utrzymywał, że kobiety mają mniej zębów niż mężczyźni. Choć był żonaty dwukrotnie, nigdy nie wpadł na to, by zweryfikować swoje stwierdzenie przez oględziny ust swoich żon."
        ru: "Аристотель утверждал, что у женщин меньше зубов, чем у мужчин. Хоть он и был дважды женат, ему ни разу не пришло в голову проверить это утверждение, посмотрев во рту у своей жены."
        source: { kind: tatoeba, id: 969833 }
notes:
  - { kind: false-friend, text: "Главная ловушка: usta — это обычный, повседневный «рот», а не высокое «уста». По-русски «уста» звучит по-книжному и почти не употребляется, а поляк говорит usta всякий раз, когда русский скажет «рот»: Otwórz usta «Открой рот»." }
  - { kind: usage, text: "Слово существует только во множественном числе (plurale tantum): формы единственного у него нет вовсе, как у русских «ножницы» или «сани». Поэтому Masz ładne usta значит «У тебя красивый рот»." }
  - { kind: usage, text: "В зависимости от контекста слово покрывает и «губы»: Masz coś na ustach «У тебя что-то на губах», pomadka do ust «помада для губ»." }
  - { kind: usage, text: "Идиомы почти дословно совпадают с русскими: nabrać wody w usta «набрать в рот воды», z ust do ust «из уст в уста», nie puścić pary z ust «не проронить ни слова»." }
collocations:
  - { pl: "otworzyć usta", ru: "открыть рот" }
  - { pl: "w ustach", ru: "во рту" }
  - { pl: "pomadka do ust", ru: "помада для губ" }
  - { pl: "z ust do ust", ru: "из уст в уста" }
family:
  - { pl: "ustny", ru: "устный", relation: derived }
  - { pl: "ustnik", ru: "мундштук", relation: derived }
etymology: "Старая форма множественного числа от исчезнувшего usto. Русское «уста» — то же слово, но в русском оно стало книжным, а в польском осталось единственным обиходным названием рта."
memory: "usta — это «рот», обычное повседневное слово, а вовсе не торжественные «уста». И у него нет единственного числа: как «ножницы» по-русски, usta всегда множественное. Otwórz usta «Открой рот», w ustach «во рту», pomadka do ust «помада для губ»."
idioms:
  - { pl: "nabrać wody w usta", ru: "набрать в рот воды" }
  - { pl: "z ust do ust", ru: "из уст в уста" }
  - { pl: "nie puścić pary z ust", ru: "не проронить ни слова" }
  - { pl: "od ust sobie odejmować", ru: "отрывать от себя последнее" }
