etymology: "Из латинского CIVILIS «гражданский», от CIVIS «гражданин», через французское CIVILISATION восемнадцатого века. Русский и польский взяли слово из одного источника и почти одновременно, поэтому значение совпадает полностью. Разошлась только форма: французское окончание русский передал как -ЦИЯ, а польский как -CJA, и это различие держится во всём разряде латинских заимствований. В основе образ города и гражданина: цивилизация это то, что отличает жителя города от человека вне его стен."
memory: "Само слово переводится само собой, но за ним стоит правило на сотни слов: латинское -tio это русское -ция и польское -cja. Cywilizacja, informacja, stacja, lekcja, policja — все женского рода, все с ударением на предпоследнем слоге. Читается «цывилиза́цья», и главная ловушка в начале: c это «ц», y это «ы», значит «цы», а не «ци». Родительный, дательный и местный единственного совпадают в cywilizacji."
idioms:
