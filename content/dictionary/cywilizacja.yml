notes:
  - { kind: false-friend, text: "Ложным другом слово не является, зато за ним стоит правило, которое открывает сотни слов разом. Латинские существительные на -TIO русский передаёт через -ЦИЯ, а польский через -CJA: CYWILIZACJA «цивилизация», INFORMACJA «информация», STACJA «станция», LEKCJA «лекция», POLICJA «полиция». Все они в польском женского рода, все склоняются одинаково, и ударение во всех падает на предпоследний слог. Выучив одно слово, вы получаете целый разряд." }
  - { kind: usage, text: "Десять форм, женский род. Родительный, дательный и местный падежи единственного числа совпадают в CYWILIZACJI, и та же форма служит родительным множественного: по контексту различают DO CYWILIZACJI «к цивилизации» и UPADEK CYWILIZACJI «падение цивилизаций». Рядом живёт старая форма родительного множественного CYWILIZACYJ, которую сегодня встретишь только в книгах начала двадцатого века. Звательный CYWILIZACJO звучит риторически." }
  - { kind: government, text: "К цивилизации — предлог DO с родительным: WRACAĆ DO CYWILIZACJI. Вдали от — Z DALA OD с родительным: Z DALA OD CYWILIZACJI. Между цивилизациями — предлог MIĘDZY с творительным: MIĘDZY CYWILIZACJAMI. В цивилизациях — предлог W с местным падежом: W DAWNYCH CYWILIZACJACH. Все три схемы повторяют русские один в один, так что управление здесь переносится без потерь." }
  - { kind: pronunciation, text: "Читается «цывилиза́цья», пять слогов, ударение на предпоследнем, то есть на ZA. Буква C всегда даёт «ц», а Y даёт «ы», поэтому начало звучит «цы», а не «ци»: это первое, что выдаёт русского. Конечное -CJA произносится слитно, «цья». В форме CYWILIZACJI конец звучит «цьи». Ударение не двигается ни в одном падеже, оно всегда на предпоследнем слоге, и в CYWILIZACJAMI это уже «ца»." }
  - { kind: register, text: "Слово книжное и публицистическое, но вполне повседневное в переносном смысле: WRACAĆ DO CYWILIZACJI говорят, выходя из леса к первому магазину. Частые обороты: STAROŻYTNA CYWILIZACJA «древняя цивилизация», ROZWÓJ CYWILIZACJI «развитие цивилизации», CHOROBY CYWILIZACYJNE «болезни цивилизации», то есть диабет и гипертония. ZDERZENIE CYWILIZACJI это калька известного политического труда, и поляки её узнают сразу." }
