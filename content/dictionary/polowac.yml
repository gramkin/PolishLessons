formExamples:
  - form: "polować"
    pl: "Lubi polować."
    ru: "Он любит охотиться."
    source: { kind: translated, id: 1353856 }
  - form: "polować"
    pl: "Pojechał polować na kaczki."
    ru: "Он поехал охотиться на уток."
    source: { kind: translated, id: 3792127 }
  - form: "polować"
    pl: "Mężczyźni poszli polować na lwy."
    ru: "Мужчины пошли охотиться на львов."
    source: { kind: translated, id: 350085 }
  - form: "polowali"
    pl: "Polowali na lisy."
    ru: "Они охотились на лис."
    source: { kind: tatoeba, id: 535877 }
  - form: "polowali"
    pl: "Polowali na sarny i lisy."
    ru: "Они охотились на косуль и лис."
    source: { kind: translated, id: 3377657 }
  - form: "polowali"
    pl: "Dawniej polowali na wilki."
    ru: "Раньше они охотились на волков."
    source: { kind: authored }
  - form: "polują"
    pl: "Wilki polują w stadzie."
    ru: "Волки охотятся стаей."
    source: { kind: translated, id: 8524126 }
  - form: "polują"
    pl: "Koty polują na myszy."
    ru: "Кошки охотятся на мышей."
    source: { kind: authored }
  - form: "polują"
    pl: "Oni polują tylko jesienią."
    ru: "Они охотятся только осенью."
    source: { kind: authored }
  - form: "poluje"
    pl: "Dużo ludzi poluje."
    ru: "Многие люди охотятся."
    source: { kind: translated, id: 10601463 }
  - form: "poluje"
    pl: "Nieważne czy czarny czy biały, kot, który poluje na myszy, jest dobrym kotem."
    ru: "Неважно, чёрный или белый: кот, который охотится на мышей, — хороший кот."
    source: { kind: translated, id: 2470048 }
  - form: "poluje"
    pl: "Ten ptak poluje nocą."
    ru: "Эта птица охотится ночью."
    source: { kind: authored }
