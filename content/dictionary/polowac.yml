# review
id: polowac
format: 2
lemma: "polować"
rank: 1697
pos: verb
aspect: imperf
pron: { cyr: "полё́ваць" }
senses:
  - id: hunt
    ru: "охотиться"
    examples:
      - pl: "Lubi polować."
        ru: "Он любит охотиться."
        source: { kind: translated, id: 1353856 }
      - pl: "Polowali na lisy."
        ru: "Они охотились на лис."
        source: { kind: tatoeba, id: 535877 }
      - pl: "Mężczyźni poszli polować na lwy."
        ru: "Мужчины пошли охотиться на львов."
        source: { kind: translated, id: 350085 }
  - id: hunt-for
    ru: "охотиться за, выслеживать"
    examples:
      - pl: "Wilki polują w stadzie."
        ru: "Волки охотятся стаей."
        source: { kind: translated, id: 8524126 }
      - pl: "Nieważne czy czarny czy biały, kot, który poluje na myszy, jest dobrym kotem."
        ru: "Неважно, чёрный или белый: кот, который охотится на мышей, — хороший кот."
        source: { kind: translated, id: 2470048 }
notes:
  - { kind: government, text: "Всегда с предлогом na и винительным падежом: polować na lisy «охотиться на лис», polować na okazje «охотиться за скидками»." }
  - { kind: usage, text: "Существительное — polowanie «охота», человек — myśliwy «охотник»." }
  - { kind: false-friend, text: "Не путайте polować «охотиться» и połowa «половина»: во втором слове ł, и к охоте оно отношения не имеет." }
  - { kind: usage, text: "Переносно — polować na okazje «охотиться за выгодными покупками», polowanie na czarownice «охота на ведьм»." }
collocations:
  - { pl: "polować na lisy", ru: "охотиться на лис" }
  - { pl: "iść na polowanie", ru: "идти на охоту" }
  - { pl: "polowanie na czarownice", ru: "охота на ведьм" }
family:
  - { pl: "polowanie", ru: "охота", relation: root }
  - { pl: "myśliwy", ru: "охотник", relation: root }
etymology: "От pole «поле»: охота как выход в поле. Русское «охотиться» построено от «охота» — желания, то есть с совсем другого конца."
memory: "polować — «охотиться», всегда с na и винительным: polować na lisy. Существительное — polowanie «охота». Осторожно: połowa «половина» пишется через ł."
idioms:
  - { pl: "polowanie na czarownice", ru: "охота на ведьм" }
  - { pl: "polować na okazje", ru: "охотиться за скидками" }
  - { pl: "iść na polowanie", ru: "идти на охоту" }
