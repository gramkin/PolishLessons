# review
id: doznac
format: 2
lemma: "doznać"
rank: 4722
pos: verb
pron: { cyr: "до́знаць" }
senses:
  - id: suffer
    ru: "получить, испытать (травму, потрясение, поражение)"
    examples:
      - pl: "Doznał poważnego urazu kręgosłupa."
        ru: "Он получил серьёзную травму позвоночника."
        source: { kind: authored }
      - pl: "Pasażerowie doznali lekkich obrażeń."
        ru: "Пассажиры получили лёгкие травмы."
        source: { kind: authored }
      - pl: "Drużyna doznała porażki u siebie."
        ru: "Команда потерпела поражение дома."
        source: { kind: authored }
  - id: feel
    ru: "испытать (облегчение, чувство)"
    examples:
      - pl: "Doznała ulgi po rozmowie."
        ru: "После разговора она почувствовала облегчение."
        source: { kind: authored }
      - pl: "Doznał olśnienia pod prysznicem."
        ru: "Озарение пришло к нему в душе."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "DOZNAĆ — «испытать, получить», а не «дознаться». «Дознаться» — DOWIEDZIEĆ SIĘ. Управляет родительным: DOZNAĆ ULGI, DOZNAĆ URAZU. DOZNANIE — «ощущение, переживание»: MOCNE DOZNANIE «сильное впечатление»." }
  - { kind: usage, text: "Сорок восемь форм: повелительное наклонение не употребляется, нет и форм DOZNANI, DOZNANO. Страдательное DOZNANY — о травмах и обидах: DOZNANE KRZYWDY. Спряжение: DOZNAM, DOZNASZ. Несовершенный вид — DOZNAWAĆ." }
  - { kind: government, text: "Чего — родительный: DOZNAĆ SZOKU, PORAŻKI, KRZYWDY. От кого — OD с родительным: DOZNAĆ KRZYWDY OD KOGOŚ. В полицейских сводках — DOZNAĆ OBRAŻEŃ «получить травмы»." }
  - { kind: pronunciation, text: "Читается «до́знаць», ударение на первом слоге. DOZNAM — «до́знам», DOZNAŁ — «до́знау»." }
  - { kind: register, text: "Книжное и газетное слово. В разговоре вместо него — PRZEŻYĆ или MIEĆ: MIAŁ WYPADEK. DOZNAĆ OBRAŻEŃ — протокольное." }
collocations:
  - { pl: "doznać urazu", ru: "получить травму" }
  - { pl: "doznać ulgi", ru: "почувствовать облегчение" }
  - { pl: "doznać porażki", ru: "потерпеть поражение" }
family:
  - { pl: "znać", ru: "знать", relation: root, id: znac }
  - { pl: "doznanie", ru: "ощущение, переживание", relation: derived }
  - { pl: "doznawać", ru: "испытывать", relation: aspect }
etymology: "Приставка DO- плюс ZNAĆ «знать», праславянское *znati. Исходный смысл — «узнать на себе». Русское «дознаться» — то же строение, но значение другое."
memory: "Doznać — испытать, получить: doznał urazu, doznała ulgi. Всегда с родительным. Doznanie — ощущение. Читается «до́знаць»."
