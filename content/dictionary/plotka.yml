notes:
  - { kind: false-friend, text: "ОДНА И ТА ЖЕ МЕТАФОРА В ДВУХ ЯЗЫКАХ. Plotka идёт от pleść «плести» — ровно как русская «сплетня» от «сплетать». Оба языка независимо назвали пустой разговор плетением. Само pleść тоже совпадает: pleść bzdury это «плести чушь». Слово на вид другое, а образ один, и запоминается он сразу." }
  - { kind: pronunciation, text: "В дательном и предложном k переходит в c: plotka, но w plotce — «в пло́тцэ». То же, что paczka → w paczce и fabryka → w fabryce. Родительный множественного с беглым e: plotek, как paczek и marynarek — а у domka в этой же группе e, наоборот, пропадает." }
  - { kind: usage, text: "Множественное plotki значит ещё и «слухи»: krążą plotki «ходят слухи». Отсюда plotkować «сплетничать», plotkarz и plotkara «сплетник, сплетница», а также plotkarski: prasa plotkarska — это жёлтая пресса." }
collocations:
  - { pl: "puścić plotkę", ru: "пустить сплетню" }
  - { pl: "krążą plotki", ru: "ходят слухи" }
  - { pl: "prasa plotkarska", ru: "жёлтая пресса" }
family:
