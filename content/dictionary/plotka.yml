  - { pl: "plotkować", ru: "сплетничать", relation: derived }
  - { pl: "plotkarz", ru: "сплетник", relation: derived }
  - { pl: "plotkarski", ru: "бульварный, сплетнический", relation: derived }
etymology: "От pleść «плести», из праславянского корня, давшего и русское «плести». Русская «сплетня» построена из того же корня с приставкой с-, так что образ в обоих языках один: пустой разговор — это плетение. Отсюда plotkować, plotkarz и plotkarski."
memory: "plotka — «сплетня», и образ тот же самый: от pleść «плести», как русская «сплетня» от «сплетать». Падеж знакомый: w plotce, с переходом k в c, а родительный множественного с беглым e — plotek."
