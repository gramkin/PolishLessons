# review
id: chryste
format: 2
lemma: "Chryste"
rank: 1417
pos: interj
pron: { cyr: "хры́стэ" }
senses:
  - id: exclamation
    ru: "Господи!, Боже мой! (возглас удивления, испуга, досады)"
    examples:
      - pl: "Jezu Chryste!"
        ru: "Господи Иисусе!"
        source: { kind: translated, id: 3496502 }
      - pl: "O Chryste, co za dzień!"
        ru: "Господи, что за день!"
        source: { kind: authored }
      - pl: "Chryste, ale mnie wystraszyłeś!"
        ru: "Господи, как ты меня напугал!"
        source: { kind: authored }
  - id: vocative
    ru: "Христе (обращение в молитве)"
    examples:
      - pl: "Uwielbiamy Cię, Chryste."
        ru: "Поклоняемся Тебе, Христе."
        source: { kind: translated, id: 6014639 }
      - pl: "Panie Jezu Chryste, Synu Boży, zmiłuj się nade mną, grzesznikiem."
        ru: "Господи Иисусе Христе, Сыне Божий, помилуй меня, грешного."
        source: { kind: translated, id: 6637566 }
notes:
  - { kind: usage, text: "Это звательная форма от Chrystus, закрепившаяся как самостоятельное восклицание — словари дают её отдельной статьёй именно как междометие." }
  - { kind: usage, text: "Чаще всего в связке Jezu Chryste! — «Господи Иисусе!». Выражает удивление, испуг или досаду; ср. карточку jezus и оборот Jezus Maria!." }
  - { kind: false-friend, text: "Именительный падеж — Chrystus, и в обычном предложении нужен именно он: Jezus Chrystus umarł na krzyżu. Форма Chryste бывает только в обращении и в восклицании." }
  - { kind: register, text: "В разговорной речи возглас звучит нейтрально-эмоционально, но для верующего собеседника это имя Божие, и в религиозном контексте оно употребляется всерьёз." }
collocations:
  - { pl: "Jezu Chryste!", ru: "Господи Иисусе!" }
  - { pl: "o Chryste!", ru: "о Господи!" }
  - { pl: "Chryste Panie!", ru: "Господи Боже!" }
etymology: "Звательная форма от Chrystus, через латинское Christus из греческого Χριστός «помазанник». Русское «Христос» пришло тем же путём, и русская звательная форма «Христе» сохранилась ровно в тех же молитвенных оборотах."
memory: "Chryste — звательная форма от Chrystus, ставшая самостоятельным восклицанием. Jezu Chryste! это «Господи Иисусе!» — удивление или испуг. В обычном предложении нужен именительный: Jezus Chrystus."
idioms:
  - { pl: "Jezu Chryste!", ru: "Господи Иисусе!" }
  - { pl: "o Chryste!", ru: "о Господи!" }
  - { pl: "Chryste Panie!", ru: "Господи Боже!" }
