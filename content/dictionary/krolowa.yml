# review
id: krolowa
format: 2
lemma: "królowa"
rank: 1066
pos: noun
pron: { cyr: "крулё́ва" }
senses:
  - id: queen
    ru: "королева"
    examples:
      - pl: "Kim była królowa Elżbieta?"
        ru: "Кем была королева Елизавета?"
        source: { kind: translated, id: 2257120 }
      - pl: "Elżbieta II to królowa Anglii."
        ru: "Елизавета II — королева Англии."
        source: { kind: translated, id: 6729504 }
      - pl: "Królowa jest w swoim zamku."
        ru: "Королева в своём замке."
        source: { kind: translated, id: 11519293 }
  - id: be-queen
    ru: "być królową — быть королевой"
    examples:
      - pl: "Jest królową."
        ru: "Она королева."
        source: { kind: translated, id: 10470312 }
      - pl: "Widzisz królową?"
        ru: "Видишь королеву?"
        source: { kind: translated, id: 2183709 }
      - pl: "Jadwiga była formalnie królem Polski, a nie królową."
        ru: "Формально Ядвига была королём Польши, а не королевой."
        source: { kind: translated, id: 12569835 }
  - id: queen-of
    ru: "królowa nauk — царица наук"
    examples:
      - pl: "Matematyka to królowa nauk."
        ru: "Математика — царица наук."
        source: { kind: translated, id: 13472028 }
      - pl: "Matematyka jest królową wszystkich nauk."
        ru: "Математика — царица всех наук."
        source: { kind: translated, id: 7703132 }
      - pl: "W Wielkiej Brytanii królowa panuje, ale nie rządzi."
        ru: "В Великобритании королева царствует, но не правит."
        source: { kind: translated, id: 951204 }
notes:
  - { kind: usage, text: "Существительное женского рода, но склоняется как прилагательное: królowa, królowej, królową. Тот же тип, что у sędzia, только женский." }
  - { kind: usage, text: "Образовано от król «король» суффиксом -owa, как и старые фамилии жён: Nowak — Nowakowa. Буквально «королёва (жена)»." }
  - { kind: usage, text: "królowa nauk «царица наук» — о математике. Есть и królowa balu «королева бала»." }
  - { kind: usage, text: "Историческая тонкость: Ядвигу короновали как «короля» Польши, а не королеву, — это подчёркивало, что она правит сама, а не как жена короля." }
collocations:
  - { pl: "królowa Anglii", ru: "королева Англии" }
  - { pl: "być królową", ru: "быть королевой" }
  - { pl: "królowa nauk", ru: "царица наук" }
  - { pl: "królowa balu", ru: "королева бала" }
family:
  - { pl: "król", ru: "король", relation: root, id: krol }
  - { pl: "królewski", ru: "королевский", relation: derived }
  - { pl: "królestwo", ru: "королевство", relation: derived }
etymology: "От król «король» с суффиксом -owa — буквально «королёва», как старые польские фамилии жён: Nowak даёт Nowakowa."
memory: "królowa — «королева», но склоняется как прилагательное: królowej, królową. Тот же тип, что у sędzia. И запомните królowa nauk «царица наук» — так по-польски говорят о математике."
idioms:
