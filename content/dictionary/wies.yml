        ru: "После окончания учёбы он вернулся в деревню."
        source: { kind: tatoeba, id: 3657093 }
  - id: countryside
    ru: "деревня (как местность)"
    examples:
      - pl: "Obecnie mieszkam na wsi."
        ru: "Сейчас я живу в деревне."
        source: { kind: tatoeba, id: 12569619 }
      - pl: "Mój dom jest na wsi."
        ru: "Мой дом в деревне."
        source: { kind: tatoeba, id: 524708 }
notes:
  - { kind: false-friend, text: "ГЛАВНАЯ ловушка: wieś — это ДЕРЕВНЯ, а не «весь». Русское «весь» в значении села осталось только в летописях («города и веси»), и звучит оно одинаково." }
  - { kind: government, text: "Женский род на мягкую согласную: ta wieś, tej wsi. Обратите внимание на выпадение e: wieś, но wsi, wsią." }
  - { kind: usage, text: "Жить в деревне — mieszkać NA wsi, с предлогом na, а не w. Поехать в деревню — jechać na wieś." }
  - { kind: usage, text: "Противоположность — miasto «город», у которого уже есть карточка." }
collocations:
  - { pl: "na wsi", ru: "в деревне" }
  - { pl: "jechać na wieś", ru: "поехать в деревню" }
etymology: "Праславянское *vьsь; русское «весь» в значении села — то же слово, но оно вышло из употребления."
