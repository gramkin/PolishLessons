senses:
  - id: auditorium
    ru: "зрительный зал, места для зрителей"
    examples:
      - pl: "Widownia jest pełna."
        ru: "Зал полон."
        source: { kind: authored }
      - pl: "Usiedliśmy w trzecim rzędzie widowni."
        ru: "Мы сели в третьем ряду зала."
