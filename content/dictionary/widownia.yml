notes:
  - { kind: false-friend, text: "WIDOWNIA — не «видовая», а «зрительный зал», от WIDZ «зритель». Слово называет и места, и людей на них: CAŁA WIDOWNIA WSTAŁA — «весь зал встал». Трибуны стадиона — TRYBUNY, а WIDOWNIA — в театре, кино, концертном зале." }
  - { kind: usage, text: "Девять форм, женский род на -NIA. Родительный, дательный и местный единственного — WIDOWNI, и родительный множественного тоже WIDOWNI. Звательного падежа на практике нет: к залу обращаются PROSZĘ PAŃSTWA." }
  - { kind: government, text: "В зале, среди зрителей — NA WIDOWNI, с NA, а не W: SIEDZIEĆ NA WIDOWNI. Из зала — Z WIDOWNI. Перед полным залом — PRZED PEŁNĄ WIDOWNIĄ, творительный." }
  - { kind: pronunciation, text: "Читается «видо́вня», ударение на предпоследнем слоге. NIA — «ня» с мягким Н, как в KAWIARNIA." }
  - { kind: register, text: "Слово нейтральное. О телевидении и интернете тоже говорят WIDOWNIA: WIDOWNIA TELEWIZYJNA — «телеаудитория». Слушатели радио — SŁUCHACZE." }
collocations:
  - { pl: "pełna widownia", ru: "полный зал" }
  - { pl: "na widowni", ru: "в зале, среди зрителей" }
  - { pl: "widownia telewizyjna", ru: "телеаудитория" }
family:
  - { pl: "widz", ru: "зритель", relation: root, id: widz }
  - { pl: "widzieć", ru: "видеть", relation: root, id: widziec }
  - { pl: "widowisko", ru: "зрелище", relation: root }
etymology: "От WIDZ «зритель», а оно — от WIDZIEĆ «видеть». Суффикс -OWNIA, -NIA обозначает место: KAWIARNIA — «кафе», PIEKARNIA — «пекарня». WIDOWNIA — «место, где смотрят»."
memory: "Widownia — зрительный зал и сами зрители, от widz «зритель». Читается «видо́вня». Siedzieć na widowni — сидеть в зале: с na."
idioms:
  - { pl: "widzieć na własne oczy", ru: "видеть своими глазами" }
formExamplesSkip:
