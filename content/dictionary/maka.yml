notes:
  - { kind: false-friend, text: "Русская «мука» и польское mąka — одно слово: носовое ą отвечает русскому у. Но ударение разное — по-польски мо́нка, всегда на первом слоге." }
  - { kind: government, text: "Женский род: ta mąka, tej mąki. Посыпать мукой — posypać mąką, творительный падеж." }
  - { kind: usage, text: "Пословица Jaka mąka, taki chleb «Какая мука, такой и хлеб» — о том, что результат зависит от сырья." }
  - { kind: usage, text: "Сорта: mąka pszenna «пшеничная», mąka żytnia «ржаная», mąka ziemniaczana «картофельный крахмал»." }
