# review
id: obrocic
format: 2
lemma: "obrócić"
rank: 2940
pos: verb
pron: { cyr: "обру́циць" }
senses:
  - id: turn
    ru: "повернуть, перевернуть"
    examples:
      - pl: "Obróć krzesło w stronę okna."
        ru: "Поверни стул в сторону окна."
        source: { kind: authored }
      - pl: "Obrócił kartkę i zaczął pisać od nowa."
        ru: "Он перевернул листок и начал писать заново."
        source: { kind: authored }
      - pl: "Stół obrócono o dziewięćdziesiąt stopni."
        ru: "Стол повернули на девяносто градусов."
        source: { kind: authored }
  - id: turn-into
    ru: "обратить (во что-л.)"
    examples:
      - pl: "Pożar obrócił dom w ruinę."
        ru: "Пожар обратил дом в развалины."
        source: { kind: authored }
      - pl: "Obrócił całą sprawę w żart."
        ru: "Он обратил всё дело в шутку."
        source: { kind: authored }
notes:
  - { kind: pronunciation, text: "Гласная ó здесь не позиционная, и это стоит отличать от разобранного в прошлых партиях. У NARÓB и PRZEŁÓŻ ó появлялась только в закрытом слоге, а в остальных формах стояло o. Здесь же ó сидит в корне и держится везде: OBRÓCIĆ, OBRÓCĘ, OBRÓCI, OBRÓCIŁ, OBRÓCONY. Зато в несовершенной паре она сменяется на a: OBRACAĆ, OBRACAM. То есть мена тут не ó/o по положению, а ó/a по виду — и русский делает ровно то же: «обратить» при «обращать»." }
  - { kind: usage, text: "Гнездо этого корня русскому знакомо, только через другую огласовку. Польское -RÓCIĆ отвечает русскому -воротить или -вратить: WRÓCIĆ — «вернуться», ZWRÓCIĆ — «вернуть» и «обратить», OBRÓCIĆ — «повернуть, обратить», POWRÓT — «возврат». Самое полезное выражение из гнезда стоит выучить целиком: ZWRÓCIĆ UWAGĘ значит «обратить внимание», слово в слово. А ZWRÓCIĆ KOMUŚ PIENIĄDZE — «вернуть кому-то деньги»." }
  - { kind: government, text: "В прямом значении берёт винительный плюс предлог направления: OBRÓCIĆ COŚ W STRONĘ CZEGOŚ, OBRÓCIĆ KRZESŁO DO OKNA. Угол поворота идёт с предлогом O и винительным: OBRÓCIĆ O DZIEWIĘĆDZIESIĄT STOPNI — «повернуть на девяносто градусов», где русский берёт «на». Во втором значении — предлог W с винительным: OBRÓCIĆ COŚ W RUINĘ, W ŻART, W POPIÓŁ, и русский говорит так же: «обратить в развалины, в шутку». Возвратное OBRÓCIĆ SIĘ значит «обернуться»." }
  - { kind: usage, text: "Пятьдесят три формы — совершенный переходный: сорок одна основная, одиннадцать страдательных причастий и деепричастие OBRÓCIWSZY. Повелительное OBRÓĆ выходит из третьего лица OBRÓCI отбрасыванием -i со смягчением c в ć, как SKRĘĆ при SKRĘCI из партии 281. Страдательное причастие OBRÓCONY даёт мужскую личную форму множественного OBRÓCENI с e, по правилу причастий на -ony. Несовершенная пара — OBRACAĆ." }
collocations:
  - { pl: "obrócić w stronę okna", ru: "повернуть в сторону окна" }
  - { pl: "obrócić w ruinę", ru: "обратить в развалины" }
  - { pl: "zwrócić uwagę", ru: "обратить внимание" }
family:
  - { pl: "obracać", ru: "поворачивать, обращать", relation: aspect }
  - { pl: "wrócić", ru: "вернуться", relation: root, id: wrocic }
  - { pl: "zwrócić", ru: "вернуть, обратить", relation: root, id: zwrocic }
etymology: "Приставка ob- и -RÓCIĆ, из праславянского *vortiti «вертеть, поворачивать» — тот же корень, что русские «воротить», «вратить», «ворот». Польская огласовка -ró- отвечает русской -воро- или -вра-, и всё гнездо читается по этому ключу: WRÓCIĆ «вернуться» при «воротиться», ZWRÓCIĆ «вернуть, обратить» при «обратить», POWRÓT «возврат», OBRÓT «оборот», WRÓT и WROTA «врата». Мена ó на a в несовершенном виде, OBRÓCIĆ при OBRACAĆ, повторяет русскую «обратить» при «обращать»."
memory: "Польское -rócić отвечает русскому -воротить: wrócić «вернуться», zwrócić «обратить», obrócić «повернуть». И мена как в русском: obrócić при obracać, «обратить» при «обращать»."
idioms:
  - { pl: "zwrócić uwagę", ru: "обратить внимание" }
  - { pl: "obrócić w żart", ru: "обратить в шутку" }
