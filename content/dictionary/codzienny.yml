notes:
  - { kind: false-friend, text: "Русское «ежедневный» и «повседневный» — два слова, польское CODZIENNY покрывает оба. CODZIENNA GAZETA — «ежедневная газета», ŻYCIE CODZIENNE — «повседневная жизнь», а UBRANIE CODZIENNE — «одежда на каждый день». Не путайте с наречием CODZIENNIE, «каждый день»: прилагательное отвечает на вопрос «какой», наречие — «когда»." }
  - { kind: usage, text: "Относительное прилагательное, степеней сравнения нет, все одиннадцать форм живые. Форма для мужчин-людей CODZIENNI встречается о людях, которые приходят каждый день: CODZIENNI GOŚCIE, CODZIENNI PASAŻEROWIE. Пишется слитно, хотя собрано из CO и DZIEŃ." }
  - { kind: government, text: "В значении «повседневный» прилагательное чаще стоит после существительного: ŻYCIE CODZIENNE, PRZEDMIOTY CODZIENNEGO UŻYTKU. В значении «ежедневный» — перед: CODZIENNY SPACER, CODZIENNA PRACA. В повседневной жизни — W ŻYCIU CODZIENNYM, W с местным." }
  - { kind: pronunciation, text: "Читается «цодзе́нны», три слога, ударение на предпоследнем. C в начале — «ц», как в CO «цо». DZIE даёт мягкое «дзе», двойное NN тянется. Наречие CODZIENNIE звучит «цодзе́нне»." }
  - { kind: register, text: "Нейтральное слово на все случаи. Устойчивое PRZEDMIOTY CODZIENNEGO UŻYTKU, «предметы обихода», пришло из официального языка и живёт в торговле. Поэтически CODZIENNOŚĆ, «обыденность», противопоставляют празднику: SZARA CODZIENNOŚĆ, «серые будни»." }
