etymology: "Сращение CO DZIEŃ, «каждый день», где CO в старом значении «каждый». Русский тот же смысл собирает из «еже» и «день», но польское CO здесь не «что», а остаток старой конструкции, как и в CO ROKU, «каждый год», CO TYDZIEŃ, «каждую неделю». Из наречия выросло прилагательное."
memory: "Codzienny — и ежедневный, и повседневный: codzienny spacer, życie codzienne. Из co dzień, «каждый день». А хлеб насущный — chleb powszedni, не codzienny. Читается «цодзе́нны»."
idioms:
  - { pl: "chleb powszedni", ru: "хлеб насущный, обычное дело" }
