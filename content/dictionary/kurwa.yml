# review
id: kurwa
format: 2
lemma: "kurwa"
rank: 297
pos: noun
pron: { cyr: "ку́рва" }
senses:
  - id: interjection
    ru: "грубое ругательство-междометие, примерно «блин», «чёрт», но гораздо грубее"
    note: "Самое частое употребление — именно возглас досады, а не название человека."
    examples:
      - pl: "Kurwa!"
        ru: "Чёрт!"
        source: { kind: translated, id: 1007346 }
      - pl: "Kurwa, znowu się spóźniłem."
        ru: "Чёрт, я опять опоздал."
        source: { kind: authored }
      - pl: "Ale kurwa zimno."
        ru: "Ну и холодрыга."
        source: { kind: authored }
  - id: noun
    ru: "бранное слово о женщине; в переносном смысле — о ком угодно"
    note: "Оскорбление. Приводится для понимания, а не для употребления."
    examples:
      - pl: "Nie nazywaj nikogo kurwą."
        ru: "Не называй никого этим словом."
        source: { kind: authored }
      - pl: "Słowo kurwa jest obraźliwe."
        ru: "Слово kurwa — оскорбление."
        source: { kind: authored }
      - pl: "W słowniku słowo kurwa oznaczono jako wulgarne."
        ru: "В словаре слово kurwa помечено как вульгарное."
        source: { kind: authored }
notes:
  - { kind: register, text: "Это самое грубое и самое частое ругательство польского языка. Слово стоит узнавать на слух, но иностранцу лучше не употреблять его никогда: в разговоре с незнакомыми, на работе и при детях оно звучит оскорбительно." }
  - { kind: usage, text: "Чаще всего работает как междометие-заполнитель, вроде русского «блин», но с куда большей грубостью; смысла «женщина» в таком употреблении нет." }
  - { kind: usage, text: "Смягчённые замены, которые можно услышать вместо него: kurczę, kurde, kurna — они безобидны и годятся в обычной речи." }
  - { kind: usage, text: "Встречается в составе бранных оборотов (do kurwy nędzy и подобных); все они принадлежат тому же грубому пласту." }
collocations:
  - { pl: "kurczę", ru: "блин (мягкая замена)" }
  - { pl: "kurde", ru: "блин (мягкая замена)" }
  - { pl: "o kurczę", ru: "ой блин" }
  - { pl: "bez przekleństw", ru: "без ругательств" }
etymology: "Праславянское *kury «курица» с уничижительным развитием значения; ср. русское диалектное «курва» с тем же смыслом."
memory: "Самое грубое и самое частое ругательство польского языка. Узнавать его на слух нужно, употреблять — нет: в разговоре с незнакомыми, на работе и при детях оно звучит оскорбительно. Безобидные замены — kurczę, kurde."
idioms:
  - { pl: "kurczę", ru: "блин (мягкая замена)" }
  - { pl: "kurde", ru: "блин (мягкая замена)" }
  - { pl: "do kurwy nędzy", ru: "чёрт побери (грубо)" }
