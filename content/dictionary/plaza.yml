etymology: "Из французского plage (через немецкий), восходит к латинскому plagia «побережье». Русское «пляж» заимствовано из того же французского источника — слова родственны напрямую."
memory: "plaża = «пляж», из того же французского plage, что и русское слово. Держите в голове пару падежей: idę na plażę «иду на пляж» (винительный, направление) и jestem na plaży «я на пляже» (предложный, место)."
