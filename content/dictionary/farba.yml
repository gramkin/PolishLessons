notes:
  - { kind: false-friend, text: "Русского литературного слова с таким корнем нет, хотя украинцам и белорусам «фарба» знакома. Польское FARBA значит «краска» — для стен, для ткани, для волос, для живописи. Цвет при этом называется KOLOR, и путать их нельзя: JAKIEGO KOLORU это «какого цвета», а не «какой краски». Различаются и глаголы: FARBOWAĆ значит красить волосы или ткань, то есть менять цвет материала, а MALOWAĆ — красить стены и писать картины. Поэтому FARBOWAĆ ŚCIANY сказать нельзя, нужно MALOWAĆ ŚCIANY, и ошибка слышна сразу." }
  - { kind: usage, text: "Десять форм, женский род. Дательный и местный единственного — FARBIE, где конечное B основы смягчается в BI перед окончанием -E. Рядом с соседними карточками видно весь ряд: FRYZURZE даёт R в RZ, PLAMIE смягчает M, FARBIE смягчает B, и все три показывают одно правило — окончание -E требует мягкой основы. Родительный множественного — FARB, с нулевым окончанием. Управление: FARBA DO CZEGOŚ в родительном — FARBA DO WŁOSÓW, FARBA DO PODŁÓG; а материал указывается прилагательным: FARBA OLEJNA, FARBA AKRYLOWA." }
  - { kind: pronunciation, text: "Читается «фа́рба», два слога, ударение на первом. Буква F как в русском, R раскатистое, B звонкое. В форме FARBIE сочетание BIE даёт «бе» с мягким B: «фа́рбе». В форме FARBĘ конечное Ę звучит как чистое «э»: «фа́рбэ». В форме FARBĄ последнее Ą даёт «он»: «фа́рбон». В форме FARB конечное B оглушается в «п»: «фарп», и это стоит отметить — на слух родительный множественного кончается глухо." }
  - { kind: register, text: "Слово нейтральное и хозяйственное. Устойчивые сочетания: FARBA OLEJNA, FARBA AKRYLOWA, FARBA DO WŁOSÓW, ŚWIEŻO MALOWANE «окрашено» на табличке. Разговорное PUŚCIĆ FARBĘ значит «проговориться, выдать секрет», и выражение очень живое: образ тот же, что в русском «пустить краску», но значение другое, поэтому запоминать его нужно отдельно. Производные: FARBOWAĆ, FARBOWANY, ODFARBOWAĆ SIĘ «полинять». В охотничьем языке FARBA означает кровь зверя, и это значение встречается в старой прозе." }
