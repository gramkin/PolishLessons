etymology: "Из немецкого FARBE «краска, цвет», заимствованного в средние века вместе с ремеслом красильщика, как и десятки других слов этого круга: BLACHA, HUTA, WARSZTAT, MALARZ в значении живописца. Немецкое слово восходит к общегерманскому корню со значением «вид, облик», родственному латинскому FORMA. Русский в этом месте оставил своё «краску», от «красить» и «красный», где исходное значение было «красивый», а не цвет; украинский и белорусский, напротив, взяли ту же немецкую «фарбу», что и поляки, через польское посредство. Поэтому слово служит хорошей приметой: там, где русский говорит «краска», у западных и южных соседей чаще стоит FARBA."
memory: "Немецкое Farbe, пришедшее вместе с ремеслом красильщика — как blacha, huta, warsztat. Русский оставил своё «краска», от «красить», а украинский и белорусский взяли ту же «фарбу» через польский. Цвет это kolor, не farba. Глаголы разные: farbować о волосах и ткани, malować о стенах и картинах. Дательный и местный farbie со смягчением b→bi. Puścić farbę значит «проговориться»."
idioms:
  - { pl: "puścić farbę", ru: "проговориться, выдать секрет" }
