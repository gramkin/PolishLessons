etymology: "Здесь сошлись два праславянских корня, и польский их склеил, а русский развёл. Первый — *pad-ti «падать», откуда русское «пасть, упасть» и польское PAŚĆ, UPAŚĆ. Второй — *pas-ti «пасти, кормить скот», откуда русское «пасти» и польское PAŚĆ «пасти». Оба сочетания, и *d-t, и *s-t, по польским звуковым законам дали одно и то же -ŚĆ, поэтому две разные приставочные формы слились в один инфинитив UPAŚĆ. В русском слияния не случилось: «упасть» сохранило д в «упаду», а «пасти» своё с в «пасу», и инфинитивы остались разными. Так что польская омонимия — не путаница смыслов, а след фонетики: один звуковой закон стёр различие, которое русский сохранил."
memory: "Два глагола в одном инфинитиве. Основа upadn- — «упасть» (upadnę, upadnij), основа upas- — «откормить» (upasę, upaś). Есть прямое дополнение — значит откорм. И «упаси Бог» сюда не относится: это nie daj Boże."
