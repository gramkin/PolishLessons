notes:
  - { kind: usage, text: "Самая странная карточка этой партии: UPAŚĆ — это два разных глагола, у которых случайно совпал инфинитив. Первый значит «упасть» и спрягается на основу UPADN- и UPAD-: UPADNĘ, UPADNIESZ, UPADŁ, UPADNIJ. Второй значит «откормить скот» и спрягается на основу UPAS- и UPASI-: UPASĘ, UPASIESZ, UPASŁ, UPAŚ. Различить их в речи легко, потому что совпадает только инфинитив: как только глагол изменился, видно, который это. В русском такой путаницы нет, там два разных слова — «упасть» и «пасти»." }
  - { kind: pronunciation, text: "Читается «у́пасьць», ударение на предпоследнем слоге; ść — мягкое сочетание, как в карточке PAŚĆ «па́сьць». Главное различие на слух — в повелительном наклонении: у глагола падения UPADNIJ «упа́дний», у глагола откорма UPAŚ «упа́сь». И ещё: деепричастие UPADŁSZY «упа́души» — ł здесь читается как «у», а не как «л»." }
  - { kind: government, text: "Глагол падения непереходный, прямого дополнения не берёт. Куда упал — предлог NA с винительным: UPAŚĆ NA ZIEMIĘ, UPAŚĆ NA KOLANA. Отчего упал — предлог Z с родительным: UPAŚĆ Z WYCZERPANIA, UPAŚĆ ZE ŚMIECHU, буквально «упасть от истощения, со смеху». Глагол откорма, наоборот, переходный и требует винительного: UPAŚĆ ŚWINIE, UPAŚĆ GĘSI. Это ещё один способ их различить: если есть прямое дополнение, речь об откорме." }
  - { kind: false-friend, text: "Русское «упаси» — не от этого слова. «Упаси Бог», «упасти от беды» идут от «спасти, сохранить» и в польском отвечают оборотам NIE DAJ BOŻE или UCHROŃ BOŻE; сказать UPAŚĆ в этом смысле нельзя, получится «упасть». Зато второе значение русскому знакомо через существительное: UPADEK — это и «падение», и «упадок», и «банкротство» фирмы, а UPADŁY значит «павший» и «обанкротившийся»." }
