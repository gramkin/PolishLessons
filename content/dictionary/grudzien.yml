etymology: "От GRUDA «смёрзшийся ком земли», от праславянского корня, давшего и русскую «груду». Месяц назван по состоянию почвы: в декабре земля смерзается и дорога идёт по грудам. Русский взял латинское DECEMBER, буквально «десятый», потому что римский год начинался в марте, и связь с природой потерялась совсем. Украинское «грудень» сохранило польский образ. Любопытно, что русская «груда» и польская GRUDA — одно слово с разошедшимся смыслом: у нас куча чего угодно, у них именно мёрзлый ком."
memory: "Третий славянский месяц: grudzień это декабрь, от gruda «смёрзшийся ком земли», месяц, когда земля смерзается. Украинское «грудень» такое же. Русская «груда» того же корня, но значит кучу, а название месяца у нас латинское. Парадигма та же, что у kwiecień и sierpień: беглое e исчезает, grudzień но grudnia, и dzi переходит в d. Читается «гру́дзень». Знать исторический смысл: Grudzień 1970 это события на Побережье."
idioms:
  - { pl: "Grudzień 1970", ru: "декабрь 1970 года, события на Побережье" }
