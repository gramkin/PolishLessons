notes:
  - { kind: false-friend, text: "Третий славянский месяц, и снова мост к русскому идёт через корень, а не через название. GRUDZIEŃ назван от GRUDA, а GRUDA по-польски — это смёрзшийся ком земли: декабрь это месяц, когда земля смерзается в комья. Русская «груда» того же корня, но значит кучу, нагромождение, то есть смысл сместился с мёрзлого кома на всякий ворох. Украинское «грудень» устроено как польское. Русское же название месяца пришло из латыни, от DECEMBER, десятого месяца римского года." }
  - { kind: usage, text: "Одиннадцать форм, мужской род, и парадигма та же, что у KWIECIEŃ и SIERPIEŃ. Беглое E исчезает в косвенных падежах: GRUDZIEŃ, но GRUDNIA, GRUDNIEM, GRUDNIU. Мягкое DZI именительного переходит в обычное D. Это уже третий месяц на -EŃ в нашем словаре, и схема подтвердилась полностью, так что WRZESIEŃ и его WRZEŚNIA можно вывести, не заглядывая в таблицу." }
  - { kind: government, text: "В каком месяце — предлог W с местным падежом: W GRUDNIU «в декабре». До и от — DO и OD с родительным: DO GRUDNIA, OD GRUDNIA. Дата идёт родительным без предлога: DWUDZIESTEGO GRUDNIA «двадцатого декабря». Отдельно стоит запомнить оборот POD KONIEC GRUDNIA «в конце декабря», с предлогом POD и родительным, тогда как русский говорит «в конце» с предложным." }
  - { kind: pronunciation, text: "Читается «гру́дзень», два слога, ударение на первом. Сочетание DZI даёт слитное мягкое «дзь», и перед E это «дзе». Конечное Ń — мягкое «нь». В косвенных падежах мягкость уходит вместе с беглым E: GRUDNIA звучит «гру́дня», с обычным «д». В слове GRUDA, от которого назван месяц, слышно «гру́да», совсем как русская «груда», хотя значит оно другое." }
  - { kind: register, text: "Слово нейтральное и ежедневное. Частые обороты: W GRUDNIU «в декабре», POD KONIEC GRUDNIA «в конце декабря», GRUDNIOWY WIECZÓR «декабрьский вечер». Отдельно стоит исторический пласт: GRUDZIEŃ 1970 означает расстрел рабочих на Побережье, а STAN WOJENNY, введённый тринадцатого декабря тысяча девятьсот восемьдесят первого года, по-польски так и называют по дате. Для поляка декабрь это месяц и праздничный, и тяжёлый одновременно." }
