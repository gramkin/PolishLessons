# review
id: gwarantowac
format: 2
lemma: "gwarantować"
rank: 2549
pos: verb
pron: { cyr: "гварантова́ць" }
senses:
  - id: guarantee
    ru: "гарантировать (что-л. кому-л.)"
    examples:
      - pl: "Gwarantuję ci spokój."
        ru: "Я гарантирую тебе покой."
        source: { kind: authored }
      - pl: "Producent gwarantuje dwa lata."
        ru: "Производитель гарантирует два года."
        source: { kind: authored }
      - pl: "Przepisy gwarantują każdemu obronę."
        ru: "Законы гарантируют каждому защиту."
        source: { kind: authored }
  - id: warranted
    ru: "о причастии: гарантированный, с гарантией"
    examples:
      - pl: "To produkt gwarantowany na pięć lat."
        ru: "Это товар с гарантией на пять лет."
        source: { kind: authored }
      - pl: "Dostęp do akt jest gwarantowany ustawą."
        ru: "Доступ к делам гарантирован законом."
        source: { kind: authored }
notes:
  - { kind: government, text: "gwarantować coś komuś: гарантируемое — в ВИНИТЕЛЬНОМ падеже, человек — в ДАТЕЛЬНОМ. Gwarantuję ci spokój. Возможна и конструкция с союзом: gwarantuję, że zdążymy. Дополнением бывает и человек, поэтому мужсколичное gwarantowani работает — о людях, чьё место обеспечено договором." }
  - { kind: usage, text: "Причастие gwarantowany настолько прижилось, что PoliMorf даёт ему отдельную словарную статью прилагательного, рядом со статьёй причастия от gwarantować. Поэтому gwarantowana jakość ощущается как «гарантийное качество», готовое сочетание, а не как форма глагола." }
  - { kind: usage, text: "Несовершенный вид; совершенный — zagwarantować. Существительное gwarancja «гарантия» и gwarant «гарант» — из того же заимствования." }
  - { kind: false-friend, text: "Здесь ловушки нет, и это стоит знать: польское gwarantować и русское «гарантировать», gwarancja и «гарантия» — одно и то же западноевропейское заимствование, пришедшее в оба языка почти одинаково. Корень в конечном счёте германский, со значением «защищать»; английские warrant и guarantee — его же дублеты." }
collocations:
  - { pl: "gwarantować jakość", ru: "гарантировать качество" }
  - { pl: "gwarantowany ustawą", ru: "гарантированный законом" }
  - { pl: "gwarancja na dwa lata", ru: "гарантия на два года" }
family:
  - { pl: "zagwarantować", ru: "гарантировать, обеспечить", relation: aspect }
  - { pl: "gwarancja", ru: "гарантия", relation: derived }
  - { pl: "gwarant", ru: "гарант", relation: derived }
etymology: "Заимствование: через западноевропейские языки от итальянского garantire и французского garantir, в основе которых лежит германский корень со значением «защищать, оберегать». Тот же корень дал английские warrant и guarantee — дублеты одного слова. Русское «гарантировать» пришло тем же путём, поэтому слова совпадают почти буква в букву."
memory: "gwarantować coś komuś — винительный плюс дательный: gwarantuję ci spokój. Слово заимствованное и совпадает с русским «гарантировать», так что запоминать надо не корень, а управление. Причастие gwarantowany стало самостоятельным прилагательным."
idioms:
  - { pl: "gwarantowany sukces", ru: "гарантированный успех" }
  - { pl: "gwarantuję ci to", ru: "я тебе это гарантирую" }
