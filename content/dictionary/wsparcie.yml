# review
id: wsparcie
format: 2
lemma: "wsparcie"
rank: 1894
pos: noun
pron: { cyr: "вспа́рце" }
senses:
  - id: support
    ru: "поддержка"
    examples:
      - pl: "Potrzebuję wsparcia."
        ru: "Мне нужна поддержка."
        source: { kind: translated, id: 8735244 }
      - pl: "Potrzebujemy twojego wsparcia."
        ru: "Нам нужна твоя поддержка."
        source: { kind: translated, id: 3969058 }
      - pl: "Dziękuję za twoje wsparcie."
        ru: "Спасибо за твою поддержку."
        source: { kind: translated, id: 842148 }
  - id: give-support
    ru: "оказать поддержку"
    examples:
      - pl: "Okaż wsparcie."
        ru: "Окажи поддержку."
        source: { kind: translated, id: 8617329 }
      - pl: "Udzielmy im wsparcia duchowego."
        ru: "Окажем им духовную поддержку."
        source: { kind: translated, id: 719012 }
      - pl: "Tom docenił wsparcie Mary."
        ru: "Том оценил поддержку Мэри."
        source: { kind: translated, id: 3863122 }
notes:
  - { kind: usage, text: "Глагол — wspierać «поддерживать» (несовершенный) и wesprzeć (совершенный); существительное образовано от него." }
  - { kind: government, text: "«Поддержка кого-то» — wsparcie kogoś или wsparcie dla kogoś; «благодаря поддержке» — dzięki wsparciu с дательным." }
  - { kind: usage, text: "wsparcie finansowe — «финансовая поддержка», wsparcie duchowe — «духовная поддержка»." }
  - { kind: usage, text: "Существительное среднего рода на -cie, как pożegnanie и zdanie: wsparcie, wsparcia, wsparciu." }
collocations:
  - { pl: "wsparcie finansowe", ru: "финансовая поддержка" }
  - { pl: "dziękuję za wsparcie", ru: "спасибо за поддержку" }
  - { pl: "udzielić wsparcia", ru: "оказать поддержку" }
etymology: "От wspierać «поддерживать» (w- + przeć «упирать»), праславянское *perti. Русское «поддержка» идёт от «держать» — метафора другая (держать против упирать), но смысл общий."
memory: "wsparcie = «поддержка», от wspierać. Запомните dzięki wsparciu «благодаря поддержке» — дательный падеж. Сочетания: wsparcie finansowe, wsparcie duchowe."
idioms:
  - { pl: "wsparcie finansowe", ru: "финансовая поддержка" }
  - { pl: "dziękuję za wsparcie", ru: "спасибо за поддержку" }
  - { pl: "udzielić wsparcia", ru: "оказать поддержку" }
formExamplesSkip:
  - { form: "wsparcie", cell: "Звательный", reason: "звательный падеж: к предмету или понятию не обращаются" }
