# review
id: klatka
format: 2
lemma: "klatka"
rank: 1452
pos: noun
pron: { cyr: "кла́тка" }
senses:
  - id: cage
    ru: "клетка (для птиц, зверей)"
    examples:
      - pl: "Żaden ptak nie lubi siedzieć w klatce."
        ru: "Ни одна птица не любит сидеть в клетке."
        source: { kind: tatoeba, id: 965320 }
      - pl: "Klatka jest pusta."
        ru: "Клетка пуста."
        source: { kind: translated, id: 12229230 }
      - pl: "Papuga otworzyła klatkę dziobem."
        ru: "Попугай открыл клетку клювом."
        source: { kind: tatoeba, id: 6406110 }
  - id: chest
    ru: "klatka piersiowa — грудная клетка"
    examples:
      - pl: "Boli mnie klatka piersiowa."
        ru: "У меня болит грудная клетка."
        source: { kind: translated, id: 8735303 }
      - pl: "Mam bóle w klatce piersiowej."
        ru: "У меня боли в грудной клетке."
        source: { kind: translated, id: 8735308 }
notes:
  - { kind: usage, text: "klatka piersiowa — «грудная клетка». Отдельного слова для груди как анатомической области нет, так что сочетание обязательно." }
  - { kind: usage, text: "klatka schodowa — «лестничная клетка», и в разговоре часто просто klatka: Spotkajmy się na klatce." }
  - { kind: usage, text: "Третье значение — «кадр» плёнки или фильма: stop-klatka «стоп-кадр»." }
  - { kind: usage, text: "Предложный с чередованием k→c: w klatce." }
collocations:
  - { pl: "klatka piersiowa", ru: "грудная клетка" }
  - { pl: "klatka schodowa", ru: "лестничная клетка" }
  - { pl: "w klatce", ru: "в клетке" }
etymology: "Уменьшительное от старого klata «клеть», праславянское *klětь. Русские «клеть» и «клетка» — то же самое слово."
memory: "klatka — «клетка», и русское слово того же корня. Но запомните два обязательных сочетания: klatka piersiowa «грудная клетка» и klatka schodowa «лестничная клетка». Предложный с чередованием: w klatce."
idioms:
  - { pl: "klatka piersiowa", ru: "грудная клетка" }
  - { pl: "klatka schodowa", ru: "лестничная клетка" }
  - { pl: "zamknąć w złotej klatce", ru: "запереть в золотой клетке" }
formExamplesSkip:
