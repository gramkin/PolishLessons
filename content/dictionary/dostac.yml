# review
id: dostac
format: 2
lemma: "dostać"
rank: 152
pos: verb
aspect: perf
pron: { cyr: "до́стаць" }
senses:
  - id: receive
    ru: "получить (что-либо от кого-либо)"
    examples:
      - pl: "Dostałem bilet za darmo."
        ru: "Билет достался мне бесплатно."
        source: { kind: tatoeba, id: 416252 }
      - pl: "Każde dziecko dostało upominek."
        ru: "Каждому ребёнку дали подарок."
        source: { kind: tatoeba, id: 636046 }
      - pl: "Dostałaś jej list?"
        ru: "Ты получила её письмо?"
        source: { kind: tatoeba, id: 6554177 }
  - id: obtain
    ru: "достать, раздобыть; получить возможность"
    examples:
      - pl: "Mogę dostać łyżkę?"
        ru: "Можно мне ложку?"
        source: { kind: tatoeba, id: 2809338 }
      - pl: "Dostaniemy kolejną szansę."
        ru: "Мы получим еще один шанс."
        source: { kind: tatoeba, id: 3313321 }
      - pl: "Czy mogę dostać zaliczkę z pensji?"
        ru: "Я могу получить аванс в счет зарплаты?"
        source: { kind: tatoeba, id: 756963 }
notes:
  - { kind: usage, text: "Совершенный вид к dostawać: Dostaję listy co tydzień «Получаю письма каждую неделю» — Dostałem list «Я получил письмо»." }
  - { kind: usage, text: "Будущее время образуется от основы -stanę: dostanę, dostaniesz, dostanie — как русское «достану, достанешь»." }
  - { kind: usage, text: "dostać się значит «попасть куда-то»: Dostał się na studia «Он поступил в университет»." }
collocations:
  - { pl: "dostać list", ru: "получить письмо" }
  - { pl: "dostać pracę", ru: "получить работу" }
  - { pl: "dostać się na studia", ru: "поступить в университет" }
  - { pl: "dostać w prezencie", ru: "получить в подарок" }
etymology: "Приставка do- + stać; ср. русское «достать» (до + стать). Отсюда и будущее dostanę — «достану»."
memory: "Будущее от другой основы: dostanę, dostaniesz, dostanie — как русское «достану». И запомните dostać się «попасть куда-то»: dostać się na studia «поступить в вуз»."
idioms:
  - { pl: "dostać baty", ru: "получить взбучку" }
  - { pl: "dostać kosza", ru: "получить от ворот поворот" }
  - { pl: "dostać cykora", ru: "струсить" }
