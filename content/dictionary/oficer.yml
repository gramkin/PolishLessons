# review
id: oficer
format: 2
lemma: "oficer"
rank: 1167
pos: noun
pron: { cyr: "офи́цэр" }
senses:
  - id: rank
    ru: "офицер"
    examples:
      - pl: "Oficer uchwycił go za ramię."
        ru: "Офицер схватил его за плечо."
        source: { kind: translated, id: 10760673 }
      - pl: "Włamywacz wycelował swój pistolet na oficera policji."
        ru: "Взломщик направил пистолет на офицера полиции."
        source: { kind: translated, id: 539851 }
      - pl: "Zakochała się w młodym oficerze."
        ru: "Она влюбилась в молодого офицера."
        source: { kind: translated, id: 3513611 }
  - id: be-officer
    ru: "быть офицером"
    examples:
      - pl: "Jestem oficerem."
        ru: "Я офицер."
        source: { kind: translated, id: 3749930 }
      - pl: "Generał jest wysoko postawionym oficerem."
        ru: "Генерал — высокопоставленный офицер."
        source: { kind: translated, id: 12450179 }
notes:
  - { kind: usage, text: "Мужской одушевлённый: винительный совпадает с родительным — widzę oficera." }
  - { kind: usage, text: "В польской армии oficer — звание от podporucznik и выше; ниже идут подофицеры, среди них sierżant." }
  - { kind: usage, text: "Множественное о людях — oficerowie: Oficerowie zebrali się w sztabie." }
  - { kind: usage, text: "oficer policji «офицер полиции», oficer dyżurny «дежурный офицер», oficer prowadzący «куратор» в разведке." }
collocations:
  - { pl: "oficer policji", ru: "офицер полиции" }
  - { pl: "zostać oficerem", ru: "стать офицером" }
  - { pl: "oficer dyżurny", ru: "дежурный офицер" }
family:
  - { pl: "oficerski", ru: "офицерский", relation: derived }
  - { pl: "podoficer", ru: "подофицер, сержантский состав", relation: derived }
etymology: "Через немецкое Offizier и французское officier из латинского officiarius «должностное лицо». Русский «офицер» — то же заимствование."
memory: "oficer — «офицер», мужской одушевлённый: widzę oficera. В польской армии это звание от podporucznik и выше, а sierżant относится уже к подофицерам."
idioms:
  - { pl: "oficer policji", ru: "офицер полиции" }
  - { pl: "zostać oficerem", ru: "стать офицером" }
formExamplesSkip:
