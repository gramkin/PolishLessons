notes:
  - { kind: false-friend, text: "Совпадение с русским «элегантный» полное, но форма другая: польское прилагательное на -CKI, а не на -NTNY. Ловушка в сравнительной степени: от основы ELEGANT-, а не ELEGANCK-: ELEGANTSZY, NAJELEGANTSZY. Так же устроены и другие слова на -NCKI." }
  - { kind: usage, text: "Полная парадигма: ELEGANCKI, ELEGANTSZY, NAJELEGANTSZY. Обратите внимание на чередования: K перед мужским-личным -I даёт C: ELEGANCCY, а в сравнительной степени возвращается T: ELEGANTSI, NAJELEGANTSI. Положительная степень берёт окончания -ICH, -IM: ELEGANCKICH, ELEGANCKIM." }
  - { kind: government, text: "Ставится перед существительным: ELEGANCKA SUKIENKA, ELEGANCKI HOTEL. Одетый элегантно — UBRANY ELEGANCKO, наречием. В сравнении — NIŻ или OD с родительным." }
  - { kind: pronunciation, text: "Читается «элега́нцки», четыре слога, ударение на предпоследнем. LE — «ле», GAN — «ган», CKI — «цки». В ELEGANTSZY: «элега́нтшы», T и SZ рядом." }
  - { kind: register, text: "Нейтральное слово, частое в моде, ресторанах и в приглашениях: STRÓJ ELEGANCKI — «вечерний дресс-код». О решении или жесте ELEGANCKI значит «красивый, достойный»: ELEGANCKIE WYJŚCIE Z SYTUACJI." }
collocations:
  - { pl: "elegancka sukienka", ru: "элегантное платье" }
  - { pl: "strój elegancki", ru: "вечерний дресс-код" }
  - { pl: "eleganckie rozwiązanie", ru: "изящное решение" }
family:
  - { pl: "elegancja", ru: "элегантность", relation: root }
  - { pl: "elegancko", ru: "элегантно", relation: derived }
  - { pl: "szykowny", ru: "шикарный", relation: root }
etymology: "Из латинского elegans, «изысканный, разборчивый», от eligere «выбирать». Элегантный — тот, кто умеет выбрать. Польский взял основу ELEGANT- и присоединил славянский суффикс -SKI, получив ELEGANCKI, а в степенях основа ELEGANT- снова проступает."
memory: "Elegancki — элегантный: elegancka sukienka. Степени от elegant-: elegantszy, najelegantszy. Мн. ч. для мужчин — eleganccy. Читается «элега́нцки»."
idioms:
  - { pl: "strój elegancki", ru: "вечерний дресс-код" }
