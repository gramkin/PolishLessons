# review
id: odpowiedzialny
format: 2
lemma: "odpowiedzialny"
rank: 1383
pos: adj
pron: { cyr: "отповедзя́льны" }
senses:
  - id: responsible-for
    ru: "ответственный за что-либо; виновный в чём-либо"
    examples:
      - pl: "Dopóki nie skończysz osiemnastu lat, jestem za ciebie odpowiedzialny."
        ru: "Пока тебе нет восемнадцати, я несу за тебя ответственность."
        source: { kind: tatoeba, id: 12016271 }
      - pl: "Każda osoba jest odpowiedzialna za swoje zachowanie."
        ru: "Каждый человек отвечает за своё поведение."
        source: { kind: translated, id: 2788028 }
      - pl: "Rodzice są odpowiedzialni za wykształcenie dzieci."
        ru: "Родители отвечают за образование детей."
        source: { kind: translated, id: 830291 }
  - id: conscientious
    ru: "ответственный, добросовестный (о человеке)"
    examples:
      - pl: "Tom to odpowiedzialny kierowca."
        ru: "Том — ответственный водитель."
        source: { kind: translated, id: 982768 }
      - pl: "Jesteś odpowiedzialny."
        ru: "Ты человек ответственный."
        source: { kind: translated, id: 5665356 }
notes:
  - { kind: government, text: "odpowiedzialny za coś — «ответственный за что-либо», с винительным падежом: odpowiedzialny za wypadek." }
  - { kind: false-friend, text: "Слово покрывает два русских смысла сразу: «ответственный (по характеру)» и «несущий вину». Byli odpowiedzialni za ten wypadek значит «Они виновны в этой аварии», а не похвалу." }
  - { kind: usage, text: "Гнездо: odpowiadać «отвечать», odpowiedzialność «ответственность», odpowiedź «ответ»." }
  - { kind: usage, text: "osoba odpowiedzialna — «ответственное лицо», устойчивый оборот официального языка." }
collocations:
  - { pl: "odpowiedzialny za coś", ru: "ответственный за что-либо" }
  - { pl: "osoba odpowiedzialna", ru: "ответственное лицо" }
  - { pl: "odpowiedzialny pracownik", ru: "ответственный работник" }
etymology: "От odpowiadać «отвечать» (od- и powiadać «говорить»), через odpowiedzialność «ответственность». Русское «ответственный» собрано так же — от «отвечать»."
memory: "odpowiedzialny — «ответственный», от odpowiadać «отвечать», ровно как русское слово. Управление: odpowiedzialny za coś, винительный. И помните второй смысл — «виновный»: odpowiedzialny za wypadek это и «отвечающий за аварию», и «виновный в ней»."
idioms:
