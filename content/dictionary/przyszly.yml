# review
id: przyszly
format: 2
lemma: "przyszły"
rank: 1172
pos: adj
pron: { cyr: "пшы́шуы" }
senses:
  - id: next
    ru: "следующий, будущий (о времени)"
    examples:
      - pl: "W przyszłym roku muszę zdać egzamin wstępny."
        ru: "В следующем году я должен сдавать вступительные экзамены."
        source: { kind: tatoeba, id: 351925 }
      - pl: "Zobaczymy się w przyszłą środę."
        ru: "Увидимся в следующую среду."
        source: { kind: tatoeba, id: 6313342 }
      - pl: "Do przyszłego tygodnia."
        ru: "До следующей недели."
        source: { kind: translated, id: 827810 }
  - id: future
    ru: "будущий (о поколениях, планах)"
    examples:
      - pl: "Życzymy mu wszelkich sukcesów w przyszłych staraniach."
        ru: "Желаем ему всяческих успехов в будущих начинаниях."
        source: { kind: translated, id: 6313778 }
      - pl: "Mamy prawo żądać bezpiecznej przyszłości dla nas i dla przyszłych pokoleń."
        ru: "Мы вправе требовать безопасного будущего для нас и для будущих поколений."
        source: { kind: translated, id: 2148650 }
  - id: time
    ru: "w przyszłym roku, tygodniu, miesiącu"
    examples:
      - pl: "Planuję jechać do Europy w przyszłym tygodniu."
        ru: "Я планирую поехать в Европу на следующей неделе."
        source: { kind: tatoeba, id: 765707 }
      - pl: "Jego nowa książka ukaże się w przyszłym miesiącu."
        ru: "Его новая книга выйдет в следующем месяце."
        source: { kind: tatoeba, id: 880900 }
notes:
  - { kind: false-friend, text: "Главная ловушка: формы przyszedł, przyszła, przyszli, przyszły одновременно принадлежат глаголу przyjść «прийти». Przyszła wiosna значит «Пришла весна», а не «будущая весна». Различает только контекст и место в предложении." }
  - { kind: usage, text: "Самое частое употребление — с названиями отрезков времени: w przyszłym roku «в следующем году», w przyszłym tygodniu «на следующей неделе», w przyszłą niedzielę «в следующее воскресенье»." }
  - { kind: usage, text: "czas przyszły — грамматический термин «будущее время»." }
  - { kind: usage, text: "Родственное существительное przyszłość значит «будущее» и имеет свою карточку." }
collocations:
  - { pl: "w przyszłym roku", ru: "в следующем году" }
  - { pl: "w przyszłym tygodniu", ru: "на следующей неделе" }
  - { pl: "przyszłe pokolenia", ru: "будущие поколения" }
  - { pl: "czas przyszły", ru: "будущее время" }
family:
  - { pl: "przyszłość", ru: "будущее", relation: root, id: przyszlosc }
  - { pl: "przyjść", ru: "прийти", relation: root, id: przyjsc }
etymology: "Причастие от przyjść «прийти», застывшее в значении «тот, который придёт» — то есть «будущий». Русское «будущий» собрано так же, от «быть»."
memory: "przyszły — «будущий, следующий», и живёт прежде всего при отрезках времени: w przyszłym roku, w przyszłym tygodniu. Осторожно: przyszła, przyszli, przyszły — это ещё и прошедшее время глагола przyjść, так что Przyszła wiosna значит «Пришла весна»."
idioms:
  - { pl: "w przyszłym roku", ru: "в следующем году" }
  - { pl: "czas przyszły", ru: "будущее время" }
