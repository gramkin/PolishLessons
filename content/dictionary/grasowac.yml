# review
id: grasowac
format: 2
lemma: "grasować"
rank: 2468
pos: verb
aspect: imperf
pron: { cyr: "грасо́ваць" }
senses:
  - id: prowl
    ru: "рыскать, бесчинствовать"
    examples:
      - pl: "W okolicy grasuje złodziej."
        ru: "В окрестностях орудует вор."
        source: { kind: authored }
      - pl: "Wilki grasowały nocą."
        ru: "Волки рыскали по ночам."
        source: { kind: authored }
      - pl: "Banda grasowała przez miesiąc."
        ru: "Шайка орудовала месяц."
        source: { kind: authored }
  - id: rage
    ru: "свирепствовать (о болезни, стихии)"
    examples:
      - pl: "W mieście grasowała zaraza."
        ru: "В городе свирепствовала зараза."
        source: { kind: authored }
      - pl: "Grypa grasuje w szkołach."
        ru: "Грипп свирепствует в школах."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Всегда с отрицательной окраской: так говорят о преступниках, хищниках и болезнях — о том, что действует безнаказанно." }
  - { kind: government, text: "Где — предложный падеж: grasować w okolicy, grasować po lasach." }
  - { kind: false-friend, text: "Из немецкого grassieren «свирепствовать». Русское «грассировать» — совсем другое слово, из французского, о произношении звука р." }
  - { kind: usage, text: "В корпусе глагол не встречается, поэтому все примеры составлены вручную. Совершенного вида практически нет." }
collocations:
  - { pl: "grasować w okolicy", ru: "орудовать в окрестностях" }
etymology: "Из немецкого grassieren «свирепствовать». Русское «грассировать» — другое слово, из французского."
memory: "grasować — «орудовать, рыскать, свирепствовать», всегда с дурным оттенком: о преступниках, хищниках, болезнях. Не путайте с «грассировать»."
