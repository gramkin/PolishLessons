# review
id: dzieciak
format: 2
lemma: "dzieciak"
rank: 401
pos: noun
pron: { cyr: "дзе́цяк" }
senses:
  - id: kid
    ru: "ребёнок, малыш (разговорное)"
    examples:
      - pl: "Jesteś leniwym dzieciakiem."
        ru: "Ты ленивый ребёнок."
        source: { kind: translated, id: 12041236 }
      - pl: "Gdzie są dzieciaki?"
        ru: "Где дети?"
        source: { kind: translated, id: 4560209 }
      - pl: "To mądry dzieciak."
        ru: "Это смышлёный ребёнок."
        source: { kind: authored }
  - id: kids
    ru: "детвора, ребятня (во множественном числе)"
    examples:
      - pl: "Ta wyspa to raj dla dzieciaków."
        ru: "Этот остров — рай для детей."
        source: { kind: translated, id: 758323 }
      - pl: "Mam już dość tego dzieciaka."
        ru: "Мне уже надоел этот ребёнок."
        source: { kind: translated, id: 2577400 }
      - pl: "Dzieciaki biegają po podwórku."
        ru: "Дети бегают по двору."
        source: { kind: authored }
notes:
  - { kind: usage, text: "dzieciak — разговорная и тёплая замена слову dziecko «ребёнок». Суффикс -ak даёт фамильярный оттенок, как русские «пацан, малец»." }
  - { kind: usage, text: "Главная ловушка — род: dziecko среднего рода (to dziecko), а dzieciak мужского (ten dzieciak, tego dzieciaka)." }
  - { kind: usage, text: "В живой речи множественное число — dzieciaki «ребятня»; мужско-личная форма dzieciacy формально существует, но почти не употребляется." }
  - { kind: usage, text: "Звательный dzieciaku звучит и дружески, и снисходительно: Radź sobie sam, dzieciaku «Выкручивайся сам, малой»." }
collocations:
  - { pl: "fajny dzieciak", ru: "классный парень" }
  - { pl: "dzieciaki z podwórka", ru: "дворовая ребятня" }
  - { pl: "być dzieciakiem", ru: "быть ребёнком" }
etymology: "От dziecko с суффиксом -ak, который в польском даёт разговорные названия живых существ. Корень тот же, что в русских «дитя» и «дети»."
memory: "dzieciak — разговорное «ребёнок, пацан», от dziecko плюс суффикс -ak. Главное отличие от русского: dziecko среднего рода, а dzieciak мужского — ten dzieciak. В живой речи множественное всегда dzieciaki «ребятня»."
idioms:
  - { pl: "fajny dzieciak", ru: "классный парень" }
  - { pl: "dzieciaki z podwórka", ru: "дворовая ребятня" }
  - { pl: "być jeszcze dzieciakiem", ru: "быть ещё ребёнком" }
