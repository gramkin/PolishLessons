notes:
  - { kind: false-friend, text: "Русское «речь» покрывает сразу три польских слова, и выбрать нужно верно. MOWA это речь как способность и как язык вообще: MOWA OJCZYSTA «родная речь», WADA MOWY «дефект речи». PRZEMOWA — речь как выступление перед людьми, чаще устное и не слишком официальное. PRZEMÓWIENIE — то же самое, но официальнее, и именно оно стоит в газетном отчёте о выступлении политика. Четвёртое слово, REFERAT, означает доклад. Поэтому фразу «он произнёс речь» нельзя перевести через MOWA: нужно WYGŁOSIŁ PRZEMOWĘ или WYGŁOSIŁ PRZEMÓWIENIE." }
  - { kind: usage, text: "Десять форм, женский род. Дательный и местный единственного — PRZEMOWIE, где конечное W основы смягчается в WI перед окончанием -E. Родительный множественного — PRZEMÓW, и здесь работает удлинение гласной: O переходит в Ó перед нулевым окончанием, как в KOMÓR, WDÓW и GŁÓW. Родительный единственного и именительный множественного — одна форма PRZEMOWY. Глагол при слове устойчив: WYGŁOSIĆ PRZEMOWĘ, буквально «огласить речь»; сказать POWIEDZIEĆ PRZEMOWĘ нельзя." }
  - { kind: pronunciation, text: "Читается «пшемо́ва», три слога, ударение на втором. Начальное PRZ произносится как «пш», а не «пж»: звонкое RZ оглушается после глухого P, и это общее правило для сочетаний PRZ, TRZ, KRZ — PRZEZ звучит «пшэз», TRZY — «тшы». Буква E после PRZ даёт «э». В форме PRZEMOWIE сочетание WIE читается «ве» с мягким W: «пшемо́ве». В форме PRZEMÓW буква Ó даёт «у», а конечное W оглушается: «пшему́ф»." }
  - { kind: register, text: "Слово нейтральное, с лёгким оттенком торжественности. Устойчивые сочетания: WYGŁOSIĆ PRZEMOWĘ, KRÓTKA PRZEMOWA, PRZEMOWA POWITALNA «приветственная речь», PRZEMOWA POŻEGNALNA. В ироническом употреблении слово значит нудное многословие: ZNOWU ZACZĄŁ SWOJĄ PRZEMOWĘ. Производные: PRZEMÓWIĆ «заговорить, произнести речь», PRZEMÓWIENIE, MÓWCA «оратор». Звательная форма PRZEMOWO в живой речи не употребляется и возможна только в шутке." }
