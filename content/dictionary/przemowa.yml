etymology: "Приставка PRZE- плюс MOWA от глагола MÓWIĆ, а тот — из праславянского *mъlviti, того же слова, что русское «молвить». Русский сохранил Л, польский его потерял: *mъlviti дало MÓWIĆ, где от старого сочетания осталось только долгое Ó. Поэтому русские «молва», «молвить», «безмолвный» и польские MOWA, MÓWIĆ, NIEMOWA — одно гнездо, хотя на слух родство почти не угадывается. Увидеть его помогает именно Л: там, где русский держит «мол-», польский даёт «MÓW-». Приставка PRZE- отвечает русским «пере-» и «про-», и здесь она означает полноту действия: произнести всё до конца, выговориться."
memory: "Корень тот же, что в русском «молвить», только польский потерял л: *mъlviti дало mówić, и от старого сочетания остался долгий ó. Отсюда mowa и «молва» — одно слово. Различать три: mowa это речь как способность и язык, przemowa — выступление, przemówienie — официальное выступление. Глагол обязателен: wygłosić przemowę. Начало читается «пше», потому что rz после глухого p оглушается. Родительный множественного przemów с o→ó."
idioms:
  - { pl: "wygłosić przemowę", ru: "произнести речь" }
