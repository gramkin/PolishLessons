family:
  - { pl: "prowadzić", ru: "вести, водить (несов.)", relation: aspect, id: prowadzic }
  - { pl: "przeprowadzić", ru: "провести, перевести", relation: root, id: przeprowadzic }
  - { pl: "wyprowadzić", ru: "вывести", relation: root, id: wyprowadzic }
  - { pl: "zaprowadzić", ru: "отвести, завести", relation: root, id: zaprowadzic }
etymology: "Корень *ved-/*vod- «вести», тот же, что в русских «вести», «водить», «вождь». Любопытна приставочная археология: prowadzić само по себе содержит старое pro-, давно сросшееся с корнем и уже не ощущаемое, — и новая приставка po- лепится поверх неё. Получается po-pro-wadzić, две приставки подряд, из которых живой остаётся только внешняя."
memory: "poprowadzić — один глагол на три русских: поведу группу, проведу урок, проложу кабель. И не путай с «проводить кого-л.»: это odprowadzić. А prowadzić samochód — это «водить машину»."
idioms:
