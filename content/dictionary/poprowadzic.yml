notes:
  - { kind: usage, text: "ОДИН ГЛАГОЛ ПОКРЫВАЕТ ТРИ РУССКИХ. POPROWADZIĆ GRUPĘ — «повести группу», POPROWADZIĆ LEKCJĘ — «провести урок», POPROWADZIĆ KABEL — «проложить кабель». Русский каждый раз меняет приставку, польский обходится одним словом, и выбор перевода делается по дополнению, а не по глаголу." }
  - { kind: false-friend, text: "PROWADZIĆ SAMOCHÓD значит «водить машину», а не «проводить». И PROWADZIĆ FIRMĘ — это «руководить фирмой», «вести дело». Русское «проводить» в смысле «сопровождать» будет по-польски ODPROWADZIĆ: odprowadzić kogoś na dworzec «проводить кого-л. на вокзал». Три похожих слова, три разные работы." }
  - { kind: usage, text: "Основа меняет мягкость: инфинитив POPROWADZIĆ и будущее POPROWADZĘ, POPROWADZI идут с твёрдым dz, а повелительное наклонение — POPROWADŹ, POPROWADŹCIE — уже с мягким dź. Страдательное причастие возвращает твёрдое: POPROWADZONY. Вид совершенный, так что poprowadzę значит «поведу», несовершенная пара — PROWADZIĆ." }
collocations:
  - { pl: "poprowadzić lekcję", ru: "провести урок" }
  - { pl: "poprowadzić samochód", ru: "повести машину" }
