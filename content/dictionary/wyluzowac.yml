# review
id: wyluzowac
format: 2
lemma: "wyluzować"
rank: 1616
pos: verb
pron: { cyr: "вылюзо́ваць" }
senses:
  - id: relax
    ru: "расслабиться, успокоиться (разговорное)"
    examples:
      - pl: "Wyluzuj."
        ru: "Расслабься."
        source: { kind: translated, id: 3427126 }
      - pl: "Wyluzuj!"
        ru: "Расслабься!"
        source: { kind: translated, id: 6320799 }
      - pl: "Wyluzuj na chwilkę."
        ru: "Расслабься на минутку."
        source: { kind: translated, id: 999223 }
  - id: laid-back
    ru: "расслабленный, невозмутимый (о человеке)"
    examples:
      - pl: "Ja jestem wyluzowany."
        ru: "Я расслаблен."
        source: { kind: translated, id: 768670 }
      - pl: "Byłem kompletnie wyluzowany."
        ru: "Я был совершенно расслаблен."
        source: { kind: translated, id: 722138 }
      - pl: "Tomasz jest bardzo wyluzowanym facetem."
        ru: "Томаш очень расслабленный парень."
        source: { kind: translated, id: 12890394 }
notes:
  - { kind: register, text: "Слово разговорное и молодёжное. В нейтральной речи скажут odpocząć «отдохнуть», uspokoić się «успокоиться», rozluźnić się «расслабиться»." }
  - { kind: usage, text: "Wyluzuj! — самая частая форма, дружеское «Расслабься!, Остынь!». Звучит неформально, но не грубо." }
  - { kind: usage, text: "Причастие wyluzowany значит «расслабленный, свободный в общении»: wyluzowany facet «свойский парень»." }
  - { kind: usage, text: "Образовано от luz «свобода, зазор» — буквально «дать себе слабину»." }
collocations:
  - { pl: "wyluzuj!", ru: "расслабься!" }
  - { pl: "wyluzowany facet", ru: "свойский парень" }
  - { pl: "trzeba wyluzować", ru: "надо расслабиться" }
etymology: "От luz «свобода, зазор, слабина» (из немецкого los) с приставкой wy- — буквально «дать себе слабину». Русское «расслабиться» построено от «слабый», то есть той же метафорой ослабления."
memory: "wyluzować = «расслабиться», слово разговорное. Главная форма — Wyluzuj! «Расслабься!». В нейтральной речи лучше odpocząć или uspokoić się. Причастие wyluzowany — «свойский, невозмутимый»."
idioms:
