# review
id: car
format: 2
lemma: "car"
rank: 4143
pos: noun
pron: { cyr: "цар" }
senses:
  - id: tsar
    ru: "царь (русский или болгарский монарх)"
    examples:
      - pl: "Car Piotr Wielki założył Petersburg."
        ru: "Царь Пётр Великий основал Петербург."
        source: { kind: authored }
      - pl: "Ostatni car Rosji zginął w 1918 roku."
        ru: "Последний царь России погиб в 1918 году."
        source: { kind: authored }
      - pl: "Car rządził samowładnie."
        ru: "Царь правил самодержавно."
        source: { kind: authored }
  - id: czar
    ru: "перен. царь, главный (в какой-то области)"
    examples:
      - pl: "Nowy minister został carem do spraw gospodarki."
        ru: "Новый министр стал главным по экономике."
        source: { kind: authored }
      - pl: "To prawdziwy car tego biznesu."
        ru: "Это настоящий царь этого бизнеса."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Совпадение с русским «царь» почти полное, но в польском CAR — слово чужое: так называют только русских и болгарских монархов. Польский король — KRÓL, германский — CESARZ, «император, кайзер». Для поляка CAR связан прежде всего с историей разделов Польши и восстаний против России, и звучит оно отчуждённо." }
  - { kind: usage, text: "Мужской род, одушевлённое, мужское-личное: CAR, CARA, CAROWI, CAREM, O CARZE. Множественное CAROWIE, родительный CARÓW. В местном R чередуется с RZ: O CARZE. Женский род — CARYCA, «царица»." }
  - { kind: government, text: "Царь всея Руси — CAR WSZECHRUSI или CAR CAŁEJ ROSJI, родительный. Под властью царя — POD WŁADZĄ CARA, родительный. При царе — ZA CARA, ZA с родительным, как русское «при царе»." }
  - { kind: pronunciation, text: "Читается «цар», один слог. C — «ц», твёрдая R на конце. В CARZE: «ца́жэ», RZ даёт «ж». Сравните с русским «царь»: в польском нет мягкого знака." }
  - { kind: register, text: "Историческое слово. В публицистике CAR встречается и как ярлык для авторитарного правителя: NOWY CAR KREMLA. А русское «при царе Горохе» по-польски звучит без царя: ZA KRÓLA ĆWIECZKA." }
collocations:
  - { pl: "car Rosji", ru: "царь России" }
  - { pl: "za cara", ru: "при царе" }
  - { pl: "za króla Ćwieczka", ru: "при царе Горохе (шутл.)" }
family:
  - { pl: "caryca", ru: "царица", relation: derived }
  - { pl: "carski", ru: "царский", relation: derived }
  - { pl: "cesarz", ru: "император", relation: root, id: cesarz }
etymology: "Из церковнославянского «цѣсарь», а то из латинского Caesar, имени Юлия Цезаря, ставшего титулом. Польский взял то же латинское слово дважды: CESARZ — «император», через немецкий Kaiser, и CAR — через русский, только для русских правителей. Русское «царь» — сокращение того же «цесарь»."
memory: "Car — царь, только русский или болгарский. Наш король — król, император — cesarz. Za cara — при царе. Из Caesar, как и cesarz. Читается «цар»."
idioms:
  - { pl: "za króla Ćwieczka", ru: "при царе Горохе" }
