# review
id: przygladac
format: 2
lemma: "przyglądać"
rank: 3956
pos: verb
pron: { cyr: "пшыгло́ндаць" }
senses:
  - id: watch
    ru: "присматриваться, разглядывать (PRZYGLĄDAĆ SIĘ + дательный)"
    examples:
      - pl: "Przyglądał się jej z ciekawością."
        ru: "Он с любопытством её разглядывал."
        source: { kind: authored }
      - pl: "Dzieci przyglądają się mrówkom."
        ru: "Дети наблюдают за муравьями."
        source: { kind: authored }
      - pl: "Przyglądam się temu od dawna."
        ru: "Я давно к этому присматриваюсь."
        source: { kind: authored }
  - id: look-into
    ru: "изучать, внимательно рассматривать (вопрос, дело)"
    examples:
      - pl: "Komisja przygląda się sprawie."
        ru: "Комиссия изучает это дело."
        source: { kind: authored }
      - pl: "Przyglądamy się wydatkom firmy."
        ru: "Мы внимательно изучаем расходы фирмы."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "PRZYGLĄDAĆ SIĘ — «присматриваться», «разглядывать», от GLĄDAĆ, родственного русскому «глядеть». Главная ловушка — падеж: по-польски дательный (PRZYGLĄDAĆ SIĘ KOMUŚ), по-русски винительный («разглядывать кого-то») или «за» с творительным («наблюдать за кем-то»)." }
  - { kind: usage, text: "Несовершенный вид; совершенный — PRZYJRZEĆ SIĘ. Спряжение на -AM: PRZYGLĄDAM SIĘ, PRZYGLĄDASZ SIĘ, PRZYGLĄDAJĄ SIĘ. Без SIĘ не употребляется. Безличное PRZYGLĄDANO в карточку не включено." }
  - { kind: government, text: "Кому, чему — дательный: PRZYGLĄDAĆ SIĘ DZIECIOM, OBRAZOWI, SPRAWIE. Как — наречие: UWAŻNIE, Z BLISKA, Z BOKU. Никогда не винительный: не «przyglądać się obraz»." }
  - { kind: pronunciation, text: "Читается «пшыгло́ндаць»: PRZ — «пш», Ą перед D — «он». Ударение на предпоследнем слоге. PRZYGLĄDAM SIĘ — «пшыгло́ндам сен»." }
  - { kind: register, text: "Нейтральное слово, частое в рассказах и прессе. Разговорный синоним — GAPIĆ SIĘ «пялиться», он грубее." }
collocations:
  - { pl: "przyglądać się uważnie", ru: "внимательно присматриваться" }
  - { pl: "przyglądać się z boku", ru: "наблюдать со стороны" }
  - { pl: "przyglądać się sprawie", ru: "изучать дело" }
family:
  - { pl: "przyjrzeć", ru: "присмотреться (PRZYJRZEĆ SIĘ)", relation: aspect, id: przyjrzec }
  - { pl: "oglądać", ru: "смотреть, осматривать", relation: root, id: ogladac }
  - { pl: "patrzeć", ru: "смотреть", relation: root, id: patrzec }
etymology: "Приставка PRZY- плюс старопольское GLĄDAĆ «смотреть», родственное русскому «глядеть». Тот же корень в OGLĄDAĆ «осматривать» и WYGLĄDAĆ «выглядеть»."
memory: "Przyglądać się komuś — присматриваться к кому-то, разглядывать: przyglądał się jej. Дательный, не винительный!"
idioms:
  - { pl: "przyglądać się z boku", ru: "наблюдать со стороны, не вмешиваясь" }
formExamplesSkip:
  - { form: "przyglądano", reason: "безличная форма почти не употребляется" }
