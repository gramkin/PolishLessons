# review
id: zerwac
format: 2
lemma: "zerwać"
rank: 1638
pos: verb
aspect: perf
pron: { cyr: "зэ́рваць" }
senses:
  - id: break-up
    ru: "порвать, расстаться (с кем-л.)"
    examples:
      - pl: "Tom zerwał z Mary."
        ru: "Том расстался с Мэри."
        source: { kind: translated, id: 1176750 }
      - pl: "Zerwał ze swoją dziewczyną."
        ru: "Он расстался со своей девушкой."
        source: { kind: translated, id: 10568177 }
      - pl: "Zerwali zaręczyny."
        ru: "Они разорвали помолвку."
        source: { kind: translated, id: 3816201 }
  - id: tear-off
    ru: "сорвать, оторвать"
    examples:
      - pl: "Tom zerwał jabłko z drzewa."
        ru: "Том сорвал яблоко с дерева."
        source: { kind: translated, id: 3049795 }
      - pl: "Zerwał mi się pasek od zegarka."
        ru: "У меня оторвался ремешок от часов."
        source: { kind: tatoeba, id: 8617747 }
      - pl: "Tom zerwał plaster."
        ru: "Том сорвал пластырь."
        source: { kind: translated, id: 9044304 }
  - id: spring-up
    ru: "подняться, сорваться (о ветре, с места)"
    examples:
      - pl: "Zerwał się silny wiatr."
        ru: "Поднялся сильный ветер."
        source: { kind: translated, id: 636065 }
      - pl: "Tom zerwał się na nogi."
        ru: "Том вскочил на ноги."
        source: { kind: translated, id: 7960671 }
notes:
  - { kind: government, text: "«Порвать с кем-то» — zerwać z kimś, предлог z с творительным: zerwał z dziewczyną «он расстался с девушкой»." }
  - { kind: usage, text: "Несовершенный вид — zrywać. Отсюда zerwać z nawykiem «порвать с привычкой», zerwać umowę «разорвать договор»." }
  - { kind: usage, text: "С się значит «сорваться, вскочить»: zerwać się na równe nogi «вскочить на ноги», zerwał się wiatr «поднялся ветер»." }
  - { kind: usage, text: "Прямое значение сохранилось тоже: zerwać jabłko «сорвать яблоко», zerwać plaster «содрать пластырь»." }
collocations:
  - { pl: "zerwać z kimś", ru: "расстаться с кем-то" }
  - { pl: "zerwać zaręczyny", ru: "разорвать помолвку" }
  - { pl: "zerwać się na równe nogi", ru: "вскочить на ноги" }
etymology: "Приставка ze- + rwać «рвать», праславянское *rъvati. Русское «сорвать» — то же слово с тем же корнем, и переносное «порвать с кем-то» развилось в обоих языках одинаково."
memory: "zerwać = «сорвать» и «порвать (с кем-то)»: zerwać jabłko «сорвать яблоко», но zerwać z kimś «расстаться с кем-то», предлог z с творительным. Несовершенный вид — zrywać."
idioms:
  - { pl: "zerwać z kimś", ru: "расстаться с кем-то" }
  - { pl: "zerwać zaręczyny", ru: "разорвать помолвку" }
  - { pl: "zerwać się na równe nogi", ru: "вскочить на ноги" }
