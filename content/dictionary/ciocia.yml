# review
id: ciocia
format: 2
lemma: "ciocia"
rank: 1589
pos: noun
pron: { cyr: "цё́ця" }
senses:
  - id: aunt
    ru: "тётя (сестра матери или отца)"
    examples:
      - pl: "Moja ciocia ma troje dzieci."
        ru: "У моей тёти трое детей."
        source: { kind: tatoeba, id: 557750 }
      - pl: "Siostra mojej mamy to moja ciocia."
        ru: "Сестра моей матери - моя тётя."
        source: { kind: tatoeba, id: 2665441 }
      - pl: "Moja ciocia jest starsza od mojej mamy."
        ru: "Моя тётя старше моей матери."
        source: { kind: tatoeba, id: 789055 }
  - id: aunt-address
    ru: "тётя (в обиходной речи и обращении)"
    examples:
      - pl: "Widziałeś moją ciocię?"
        ru: "Ты видел мою тётю?"
        source: { kind: tatoeba, id: 3603055 }
      - pl: "To jest moja ciocia."
        ru: "Это моя тётя."
        source: { kind: translated, id: 10701996 }
notes:
  - { kind: usage, text: "ciocia — ласковая форма от ciotka «тётка». В обиходной речи почти всегда говорят ciocia, а ciotka звучит суше." }
  - { kind: usage, text: "Мужская пара — wujek «дядя»; вместе это стандартная пара родственников: ciocia i wujek." }
  - { kind: usage, text: "Звательная форма ciociu используется в обращении: Ciociu, chodź tutaj! «Тётя, иди сюда!»." }
  - { kind: usage, text: "Родительный множественного неожиданно короткий — cioć: Mam sześciu wujków i tyle samo cioć." }
collocations:
  - { pl: "moja ciocia", ru: "моя тётя" }
  - { pl: "ciocia i wujek", ru: "тётя и дядя" }
  - { pl: "u cioci", ru: "у тёти" }
etymology: "Уменьшительно-ласкательное от ciotka, праславянское *teta — то же слово, что русское «тётя». Детское удвоение дало ciocia, как русское «тётя» рядом с «тётка»."
memory: "ciocia = «тётя», ласковая форма от ciotka. Пара — wujek «дядя». Обращение — ciociu!, а родительный множественного неожиданно короткий: cioć."
idioms:
  - { pl: "ciocia i wujek", ru: "тётя и дядя" }
  - { pl: "u cioci", ru: "у тёти" }
  - { pl: "ciocia z Ameryki", ru: "богатая тётушка" }
