notes:
  - { kind: false-friend, text: "MAKIJAŻ — «макияж», но с Ż на конце: «маки́яш». В разговоре вместо ROBIĆ MAKIJAŻ чаще говорят MALOWAĆ SIĘ, «краситься». Снятие макияжа — DEMAKIJAŻ: PŁYN DO DEMAKIJAŻU." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Родительный — MAKIJAŻU. Во множественном — MAKIJAŻE, родительный множественного: MAKIJAŻY и MAKIJAŻÓW." }
  - { kind: government, text: "Без макияжа — BEZ MAKIJAŻU, родительный. В макияже — W MAKIJAŻU, местный. Смыть макияж — ZMYĆ MAKIJAŻ, винительный." }
  - { kind: pronunciation, text: "Читается «маки́яш», ударение на предпоследнем слоге. JA — «я», конечное Ż оглушается в «ш»." }
collocations:
  - { pl: "mocny makijaż", ru: "яркий макияж" }
