etymology: "Из французского. Русское «макияж» — из того же источника. Польский, как и в MASAŻ, сохранил французский звук «ж» на конце и оглушает его."
memory: "Makijaż — макияж, читается «маки́яш». Malować się — краситься. Zmyć makijaż — смыть макияж. Demakijaż — снятие макияжа."
