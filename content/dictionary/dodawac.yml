# review
id: dodawac
format: 2
lemma: "dodawać"
rank: 3929
pos: verb
pron: { cyr: "дода́ваць" }
senses:
  - id: add
    ru: "добавлять; складывать (в арифметике)"
    examples:
      - pl: "Do zupy dodaję trochę pieprzu."
        ru: "В суп я добавляю немного перца."
        source: { kind: authored }
      - pl: "Dzieci uczą się dodawać i odejmować."
        ru: "Дети учатся складывать и вычитать."
        source: { kind: authored }
      - pl: "Babcia dodaje do ciasta skórkę z cytryny."
        ru: "Бабушка добавляет в тесто лимонную цедру."
        source: { kind: authored }
  - id: say-also
    ru: "добавлять (к сказанному); придавать (сил, смелости)"
    examples:
      - pl: "Zawsze dodaje, że to nie jego wina."
        ru: "Он всегда добавляет, что это не его вина."
        source: { kind: authored }
      - pl: "Twoje słowa dodają mi odwagi."
        ru: "Твои слова придают мне смелости."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "DODAWAĆ — «добавлять», а не «додавать» или «передавать» (PODAWAĆ). Важный оборот — DODAWAĆ OTUCHY, ODWAGI, SIŁ «придавать бодрости, смелости, сил» — с родительным, как в русском «придать смелости»." }
  - { kind: usage, text: "Несовершенный вид; совершенный — DODAĆ. Спряжение: DODAJĘ, DODAJESZ, DODAJĄ — в настоящем выпадает -WA-, как в DAWAĆ: DAJĘ. Повелительное — DODAWAJ. В арифметике DODAWANIE — «сложение»." }
  - { kind: government, text: "Что — винительный: DODAWAĆ SÓL. Чего немного — родительный: DODAWAĆ CUKRU. Куда — DO с родительным: DO ZUPY. Кому чего придавать — дательный и родительный: DODAWAĆ KOMUŚ SIŁ. Что сказать — придаточное с ŻE." }
  - { kind: pronunciation, text: "Читается «дода́ваць», ударение на предпоследнем слоге. DODAJĘ — «дода́е», DODAJĄ — «дода́йон»." }
  - { kind: register, text: "Нейтральное бытовое слово: кухня, школа, разговор. DODAWAĆ SOBIE LAT «прибавлять себе годы» — шутливое." }
collocations:
  - { pl: "dodawać soli", ru: "добавлять соли" }
  - { pl: "dodawać odwagi", ru: "придавать смелости" }
  - { pl: "dodawać i odejmować", ru: "складывать и вычитать" }
family:
  - { pl: "dodać", ru: "добавить", relation: aspect, id: dodac }
  - { pl: "dodatek", ru: "добавка, приложение", relation: derived, id: dodatek }
  - { pl: "odejmować", ru: "вычитать, отнимать", relation: antonym }
etymology: "Приставка DO- плюс DAWAĆ, многократное от DAĆ «дать»: «давать в придачу». Русское «додавать» существует, но значит другое; польское соответствует «добавлять»."
memory: "Dodawać — добавлять: dodaję pieprzu. Dodawać otuchy — придавать бодрости. В настоящем — dodaję, без -wa-."
idioms:
  - { pl: "dodawać sobie animuszu", ru: "подбадривать себя, храбриться" }
