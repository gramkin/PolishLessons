# review
id: blisko
format: 2
lemma: "blisko"
rank: 739
pos: adv
pron: { cyr: "бли́ско" }
senses:
  - id: near
    ru: "близко"
    examples:
      - pl: "Czy on mieszka blisko?"
        ru: "Близко ли он живёт?"
        source: { kind: tatoeba, id: 13106667 }
      - pl: "Po kwadransie trolejbus już był blisko uniwersytetu."
        ru: "Через четверть часа троллейбус был уже вблизи университета."
        source: { kind: tatoeba, id: 10138290 }
      - pl: "Dzik zabił już kilku myśliwych, którzy podeszli zbyt blisko."
        ru: "Кабан уже убил несколько охотников, которые слишком близко подошли."
        source: { kind: tatoeba, id: 10202662 }
  - id: nearer
    ru: "bliżej — ближе"
    examples:
      - pl: "Listopad jest coraz bliżej!"
        ru: "Ноябрь всё ближе!"
        source: { kind: tatoeba, id: 2247854 }
      - pl: "Przysuń krzesło bliżej ognia."
        ru: "Пододвинь стул поближе к огню."
        source: { kind: tatoeba, id: 716726 }
      - pl: "Podejdź bliżej."
        ru: "Подойди ближе."
        source: { kind: translated, id: 6327931 }
  - id: nearest
    ru: "najbliżej — ближе всего"
    examples:
      - pl: "Leon siedział najbliżej krawędzi."
        ru: "Леон сидел ближе всех к краю."
        source: { kind: translated, id: 12076221 }
      - pl: "Którym zwierzętom jest do nas najbliżej?"
        ru: "Какие животные нам ближе всего?"
        source: { kind: translated, id: 7868572 }
      - pl: "Kto z was mieszka najbliżej?"
        ru: "Кто из вас живёт ближе всех?"
        source: { kind: authored }
  - id: almost
    ru: "blisko перед числом — почти"
    note: "Второе значение, которого у русского «близко» нет."
    examples:
      - pl: "Przyszło blisko sto osób."
        ru: "Пришло почти сто человек."
        source: { kind: authored }
      - pl: "Czekał blisko godzinę."
        ru: "Он ждал почти час."
        source: { kind: authored }
      - pl: "Kosztowało to blisko tysiąc złotych."
        ru: "Это стоило почти тысячу злотых."
        source: { kind: authored }
notes:
  - { kind: government, text: "blisko требует родительного падежа и никакого предлога: blisko domu «близко от дома», blisko uniwersytetu «недалеко от университета». Русское «от» здесь не переводится." }
  - { kind: usage, text: "Перед числом blisko значит «почти»: blisko sto osób «почти сто человек», blisko godzinę «почти час». Этого значения у русского «близко» нет." }
  - { kind: usage, text: "Степени правильные: blisko — bliżej — najbliżej. У прилагательного bliski «близкий» свои: bliższy, najbliższy. Najbliższy значит и «ближайший» (najbliższy przystanek), и «самый близкий» (najbliższa rodzina «ближайшие родственники»)." }
  - { kind: usage, text: "z bliska — «вблизи, вплотную»: przyjrzeć się z bliska «рассмотреть вблизи»." }
collocations:
  - { pl: "blisko domu", ru: "близко от дома" }
  - { pl: "z bliska", ru: "вблизи" }
  - { pl: "podejść bliżej", ru: "подойти ближе" }
  - { pl: "najbliższa rodzina", ru: "ближайшие родственники" }
family:
  - { pl: "bliski", ru: "близкий", relation: root }
  - { pl: "zbliżyć się", ru: "приблизиться", relation: derived }
  - { pl: "pobliże", ru: "окрестность", relation: derived }
  - { pl: "bliźni", ru: "ближний", relation: root }
etymology: "Праславянское *blizъ — то же слово, что русское «близко» и «близкий»."
memory: "blisko — «близко», слово то же самое, но добавить надо две вещи. Первая: оно требует родительного падежа без всякого предлога — blisko domu значит «близко от дома». Вторая: перед числом blisko значит «почти» — blisko sto osób «почти сто человек». Степени правильные: blisko — bliżej — najbliżej."
idioms:
  - { pl: "z bliska", ru: "вблизи" }
  - { pl: "blisko sto osób", ru: "почти сто человек" }
  - { pl: "najbliższa rodzina", ru: "ближайшие родственники" }
