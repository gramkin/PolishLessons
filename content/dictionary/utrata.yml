notes:
  - { kind: false-friend, text: "РЕДКИЙ СЛУЧАЙ ПОЛНОГО СОВПАДЕНИЯ: utrata и «утрата» — одно слово, один корень, один оттенок книжности. Рядом живёт STRATA, которая значит «потеря, убыток» и звучит обыденнее: straty finansowe «финансовые потери». Так что utrata — для прав, доверия, памяти, а strata — для денег и времени." }
  - { kind: usage, text: "Дательный и предложный — UTRACIE, с переходом t→ci: doszło do utraty, mówić o utracie. Корень тот же, что в TRACIĆ «терять» и STRACIĆ «потерять». Обороты запоминай готовыми: utrata prawa jazdy, utrata przytomności «потеря сознания»." }
  - { kind: pronunciation, text: "Три слога, ударение на предпоследнем: u-TRA-ta. Все гласные открытые, r раскатистое: «утра́та». Форма utracie звучит «утра́це», с мягким ц." }
collocations:
  - { pl: "utrata przytomności", ru: "потеря сознания" }
  - { pl: "utrata zaufania", ru: "утрата доверия" }
  - { pl: "utrata prawa jazdy", ru: "лишение прав" }
family:
  - { pl: "tracić", ru: "терять", relation: root, id: tracic }
  - { pl: "strata", ru: "потеря, убыток", relation: root, id: strata }
  - { pl: "zysk", ru: "прибыль", relation: antonym }
etymology: "От utracić «утратить», от tracić «терять», из праславянского *tratiti. Русские «утрата», «тратить» и «утратить» — те же слова и тот же корень. Книжный оттенок у обоих одинаковый, поэтому переводить можно прямо."
memory: "utrata — «утрата», слово совпадает полностью, включая книжность. Для денег и времени берут STRATA «потеря, убыток». Дательный и предложный — utracie, с t→ci."
