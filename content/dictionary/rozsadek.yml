etymology: "От приставки ROZ- и SĄD «суд, суждение», от праславянского корня, давшего и русский «суд», и «судить». Русское «рассудок» собрано из тех же двух частей и тем же способом, так что слова эти не родственники издалека, а две почти одинаковые постройки. Разница в опорном слове: польское SĄD до сих пор значит и «суждение», поэтому ROZSĄDEK читается как «способность рассуждать» прямо из своего состава, а русский «суд» это уже только учреждение, и связь затерлась."
memory: "Собрано ровно как русское слово: roz- плюс sąd, то есть рас- плюс «суд». Но польское sąd значит и «суд», и «суждение», поэтому состав слова для поляка до сих пор прозрачен. Множественного числа нет, это абстрактная способность. Управление: wbrew rozsądkowi с дательным, как русское «вопреки рассудку». Читается «россо́ндэк»: ą даёт «он», а z перед глухим s оглушается, и слышится долгое «сс»."
