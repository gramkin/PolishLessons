notes:
  - { kind: false-friend, text: "Слово собрано из тех же частей, что русский «рассудок», морфема в морфему: ROZ- плюс SĄD, как РАС- плюс «суд». Но за польским SĄD стоит больше, чем за русским «судом». SĄD это и суд как учреждение, и суждение, мнение: WYDAĆ SĄD O KIMŚ значит «вынести суждение о ком-то». Поэтому ROZSĄDEK прозрачен для поляка насквозь, как способность рассуждать, тогда как русский «рассудок» давно оторвался от «суда» и живёт сам по себе." }
  - { kind: usage, text: "Существительное мужского рода, абстрактное, обозначает способность, и потому множественного числа в употреблении не имеет: формы вроде ROZSĄDKI генератор строит по образцу, но живой язык ими не пользуется, ровно как русский не говорит «рассудки». Реально работают четыре формы единственного числа. В них проступает беглое E: ROZSĄDEK, но ROZSĄDKU, ROZSĄDKOWI, ROZSĄDKIEM, где E выпадает, а K остаётся." }
  - { kind: government, text: "Вопреки рассудку — предлог WBREW с дательным падежом: WBREW ROZSĄDKOWI. Это важный случай, потому что WBREW один из немногих польских предлогов, требующих дательного, и русский здесь совпадает: «вопреки рассудку», тоже дательный. Недостаток чего-либо — BRAK с родительным: BRAK ROZSĄDKU. Руководствоваться — KIEROWAĆ SIĘ с творительным: KIEROWAĆ SIĘ ROZSĄDKIEM." }
  - { kind: pronunciation, text: "Читается «россо́ндэк», три слога, ударение на втором. Две тонкости сразу. Первая: Ą даёт «он» перед D, поэтому SĄD это «сонд», а не «сад» и не «санд». Вторая: Z перед глухим S оглушается и сливается с ним, так что ROZ- звучит не «роз», а «рос», и на стыке слышится долгое «сс». В форме ROZSĄDKIEM сочетание KIE даёт мягкое «ке»: «россо́ндкем»." }
  - { kind: register, text: "Слово нейтральное и частое, одинаково уместное в разговоре и в газете. Устойчивые обороты: ZDROWY ROZSĄDEK «здравый смысл», STRACIĆ ROZSĄDEK «потерять рассудок», WBREW ROZSĄDKOWI «вопреки здравому смыслу», KIEROWAĆ SIĘ ROZSĄDKIEM «руководствоваться рассудком». Рядом живёт прилагательное ROZSĄDNY «рассудительный, разумный», которое в быту слышно ещё чаще самого существительного: BĄDŹ ROZSĄDNY «будь благоразумен»." }
