# review
id: oskarzyc
format: 2
lemma: "oskarżyć"
rank: 1240
pos: verb
aspect: perf
pron: { cyr: "оска́ржыць" }
senses:
  - id: accuse
    ru: "обвинить кого-то в чём-то — oskarżyć kogoś o coś"
    examples:
      - pl: "Oskarżył ją o kłamstwo."
        ru: "Он обвинил её во лжи."
        source: { kind: translated, id: 959678 }
      - pl: "Maria oskarżyła Toma o kradzież."
        ru: "Мария обвинила Тома в краже."
        source: { kind: tatoeba, id: 10115725 }
      - pl: "Oskarżył mnie o nieuczciwość."
        ru: "Он обвинил меня в нечестности."
        source: { kind: translated, id: 1589825 }
  - id: the-accused
    ru: "oskarżony — обвиняемый, подсудимый (причастие как существительное)"
    examples:
      - pl: "Oskarżonego skazano na śmierć."
        ru: "Обвиняемого приговорили к смерти."
        source: { kind: translated, id: 1133628 }
      - pl: "Sędzia uznał oskarżonego za winnego."
        ru: "Судья признал обвиняемого виновным."
        source: { kind: translated, id: 2211946 }
      - pl: "Oskarżony został skazany na śmierć."
        ru: "Обвиняемый был приговорён к смерти."
        source: { kind: translated, id: 1191620 }
  - id: charged
    ru: "być oskarżonym o coś — быть обвинённым в чём-то"
    examples:
      - pl: "Jest oskarżony o gwałt."
        ru: "Он обвиняется в изнасиловании."
        source: { kind: translated, id: 350734 }
      - pl: "Został oskarżony o morderstwo."
        ru: "Он был обвинён в убийстве."
        source: { kind: translated, id: 616249 }
      - pl: "Została oskarżona o kłamstwo."
        ru: "Её обвинили во лжи."
        source: { kind: translated, id: 355540 }
notes:
  - { kind: government, text: "oskarżyć kogoś o coś: винительный для лица и предлог o с винительным для обвинения. Русскому «в» здесь отвечает польское o." }
  - { kind: usage, text: "Страдательное причастие oskarżony свободно работает как существительное «обвиняемый, подсудимый»: Sędzia uznał oskarżonego za winnego." }
  - { kind: usage, text: "Вид совершенный; несовершенный — oskarżać. Существительное — oskarżenie «обвинение», akt oskarżenia «обвинительное заключение»." }
  - { kind: false-friend, text: "Не путайте с obwinić «поставить в вину»: оно бытовое, а oskarżyć — юридическое." }
collocations:
  - { pl: "oskarżyć o coś", ru: "обвинить в чём-то" }
  - { pl: "akt oskarżenia", ru: "обвинительное заключение" }
  - { pl: "zostać oskarżonym", ru: "быть обвинённым" }
etymology: "Приставка o- и skarżyć «жаловаться», от skarga «жалоба». Русское «обвинить» собрано иначе, от «вина», но смысл тот же."
memory: "oskarżyć kogoś o coś — «обвинить кого-то в чём-то»: русскому «в» отвечает польское o с винительным. Причастие oskarżony работает как существительное «обвиняемый». Несовершенный вид — oskarżać."
idioms:
  - { pl: "akt oskarżenia", ru: "обвинительное заключение" }
  - { pl: "oskarżyć o morderstwo", ru: "обвинить в убийстве" }
  - { pl: "ława oskarżonych", ru: "скамья подсудимых" }
