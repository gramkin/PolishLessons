# review
id: wtracac
format: 2
lemma: "wtrącać"
rank: 3072
pos: verb
pron: { cyr: "фтро́нцаць" }
senses:
  - id: interject
    ru: "вставлять (слово, замечание)"
    examples:
      - pl: "Wtrącał uwagi co drugie zdanie."
        ru: "Он вставлял замечания через фразу."
        source: { kind: authored }
      - pl: "Wtrącała jedno słowo i zaraz milkła."
        ru: "Она вставляла одно слово и сразу умолкала."
        source: { kind: authored }
      - pl: "Nie wtrącaj uwag, póki nie skończę."
        ru: "Не вставляй замечаний, пока я не закончу."
        source: { kind: authored }
  - id: butt-in
    ru: "вмешиваться (с się)"
    examples:
      - pl: "Nie wtrącaj się w nasze sprawy."
        ru: "Не вмешивайся в наши дела."
        source: { kind: authored }
      - pl: "Wtrącała się do każdej rozmowy przy stole."
        ru: "Она вмешивалась в каждый разговор за столом."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Самое частое употребление — возвратное, и его стоит выучить целиком: NIE WTRĄCAJ SIĘ — «не вмешивайся», фраза из бытовой ссоры. Управление при нём двойное: WTRĄCAĆ SIĘ W COŚ с винительным о деле (W NASZE SPRAWY) и WTRĄCAĆ SIĘ DO CZEGOŚ с родительным о разговоре (DO ROZMOWY). Невозвратное WTRĄCAĆ значит «вставлять»: WTRĄCIĆ SŁOWO — «вставить слово», и это ровно то, что делает человек, который едва успевает вмешаться в чужую речь." }
  - { kind: false-friend, text: "Корень TRĄCIĆ русскому не помогает: он значит «толкнуть, задеть», и русского однокоренного слова с таким смыслом нет. Опираться приходится на приставки, которые как раз прозрачны: W- значит «в», отсюда WTRĄCAĆ «вставлять, вмешивать»; OD- даёт ODTRĄCIĆ «оттолкнуть, отвергнуть»; PO- даёт POTRĄCIĆ «задеть, толкнуть». Так что корень заучивается один раз, а дальше работает знакомая логика приставок." }
  - { kind: government, text: "Что — винительный: WTRĄCAĆ UWAGI, SŁOWO, ZDANIE. Куда — предлог DO с родительным: WTRĄCAĆ SŁOWO DO ROZMOWY. Возвратное идёт двумя путями, как сказано выше: W SPRAWY с винительным, DO ROZMOWY с родительным. Есть и третье, книжное значение с совершенным видом: WTRĄCIĆ KOGOŚ DO WIĘZIENIA — «бросить кого-то в тюрьму», оборот из исторических текстов." }
  - { kind: pronunciation, text: "Носовая ą перед c читается как «он»: WTRĄCAĆ звучит «фтро́нцаць», а начальное W перед глухим оглушается до «ф». Настоящее время у этого глагола на -AM, как у CZYTAĆ: WTRĄCAM, WTRĄCASZ, WTRĄCA — основа инфинитива сохраняется целиком. Совершенная пара WTRĄCIĆ меняет основу на -CI-: WTRĄCĘ, WTRĄCISZ, и повелительное там WTRĄĆ, а здесь WTRĄCAJ." }
collocations:
  - { pl: "nie wtrącaj się", ru: "не вмешивайся" }
  - { pl: "wtrącić słowo", ru: "вставить слово" }
  - { pl: "wtrącać się do rozmowy", ru: "вмешиваться в разговор" }
family:
  - { pl: "wtrącić", ru: "вставить; вмешать", relation: aspect, id: wtracic }
  - { pl: "potrącić", ru: "задеть, толкнуть", relation: root }
  - { pl: "odtrącić", ru: "оттолкнуть, отвергнуть", relation: root }
etymology: "Приставка w- «в» и TRĄCAĆ, многократная форма от TRĄCIĆ «толкнуть, задеть», из праславянского *trǫtiti. Русского однокоренного слова с этим значением не сохранилось, так что корень приходится брать как есть; зато приставочное гнездо в польском широкое и читается по знакомому ключу: POTRĄCIĆ «задеть», ODTRĄCIĆ «оттолкнуть», WYTRĄCIĆ «выбить» (WYTRĄCIĆ Z RĘKI). Переносное значение выросло из буквального толчка: вставить слово — значит втолкнуть его в чужую речь, а вмешаться — втолкнуть себя в чужое дело."
memory: "Корень trąc- значит «толкнуть», и дальше работают приставки: wtrącać — «вставлять, вмешивать», potrącić — «задеть», odtrącić — «оттолкнуть». А nie wtrącaj się — «не вмешивайся»."
idioms:
  - { pl: "nie wtrącaj się", ru: "не вмешивайся, не лезь" }
  - { pl: "wtrącić swoje trzy grosze", ru: "вставить свои три копейки" }
