notes:
  - { kind: false-friend, text: "ДВА ЯЗЫКА НАЗВАЛИ ПРИБОР ОТ РАЗНЫХ КОРНЕЙ. Польская LODÓWKA построена на LÓD «лёд»: буквально «льдянка». Русский «холодильник» построен на «холоде». Предмет один, образ разный, поэтому слово не угадывается — его надо запомнить вместе с корнем lód." }
  - { kind: usage, text: "Дательный и предложный — LODÓWCE, с переходом k→c: w lodówce. Родительный множественного — LODÓWEK, с беглым e. И следи за ó: оно остаётся во всех формах, потому что пришло из lód, где слог закрытый: lód, но lodu." }
  - { kind: pronunciation, text: "Три слога, ударение на предпоследнем: lo-DÓW-ka. Ó читается как у, а w перед k оглушается до ф: «лоду́фка». Форма lodówce звучит «лоду́фцэ»." }
collocations:
  - { pl: "w lodówce", ru: "в холодильнике" }
  - { pl: "wstawić do lodówki", ru: "поставить в холодильник" }
  - { pl: "pusta lodówka", ru: "пустой холодильник" }
family:
  - { pl: "lód", ru: "лёд", relation: root, id: lod }
  - { pl: "zamrażalnik", ru: "морозилка", relation: root }
  - { pl: "kuchnia", ru: "кухня", relation: root, id: kuchnia }
etymology: "От lód «лёд», из праславянского *ledъ — того же, что русское «лёд». Суффикс -ówka образует названия предметов, как в żarówka «лампочка». Русский для этого прибора выбрал корень «холод», и потому слова не похожи, хотя lód и «лёд» — одно и то же."
memory: "lodówka — «холодильник», но буквально «льдянка»: от lód «лёд», тогда как русское слово от «холода». Формы с чередованиями: w lodówce и lodówek."
