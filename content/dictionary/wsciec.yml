etymology: "Приставка W- плюс ŚCIEC, и корень здесь связывают с тем же, что в CIEC «течь» и ŚCIEKAĆ «стекать». Русский хранит его во множестве слов: «течь», «ток», «поток», «стечь», «истекать». Смысловой переход от течения к ярости не так далёк, как кажется: кровь вскипает и бросается в голову, и этот образ лежит за русскими «вскипеть» и «кровь бросилась в лицо». Русский для самого понятия взял другой путь и построил «взбеситься» на слове «бес», то есть представил ярость как одержимость. Так два языка объяснили одно состояние разными картинами: польский через кипение, русский через нечистую силу."
memory: "Глагол живёт только с się, но куда чаще самого глагола встречается прилагательное wściekły «взбешённый», которое się не берёт вовсе. Оно же значит «бешеный» о собаке, а болезнь называется wścieklizna. Управление совпадает с русским: wściec się na kogoś, предлог na с винительным. Произношение трудное: «фсьцец», в один слог, где w перед глухим ś оглушается в «ф». И помнить про второй инфинитив wścieknąć."
