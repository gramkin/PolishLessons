notes:
  - { kind: usage, text: "Сам глагол употребляется только с частицей SIĘ: WŚCIEC SIĘ, WŚCIEKŁ SIĘ. Но куда чаще самого глагола встречается причастие, ставшее прилагательным: WŚCIEKŁY значит «взбешённый, яростный» и живёт совершенно самостоятельно, без всякого SIĘ. Наречие WŚCIEKLE работает усилителем: WŚCIEKLE DROGI «страшно дорогой», WŚCIEKLE ZŁY «злющий». Сорок три формы, и лишняя против сорока двух — второй инфинитив: WŚCIEC и WŚCIEKNĄĆ, оба правильные, причём будущее строится от второй основы, WŚCIEKNĘ." }
  - { kind: false-friend, text: "Прилагательное WŚCIEKŁY покрывает сразу два русских: и «взбешённый» о человеке, и «бешеный» о собаке. Поэтому PIES WŚCIEKŁY может значить и «злющий пёс», и «бешеная собака», и различает их только дело. Название болезни от того же корня: WŚCIEKLIZNA это «бешенство», и слово это медицинское, без всякой переносности. Русское «бешенство» и «бес» связаны между собой, а польское WŚCIEKLIZNA с нечистой силой никак не связано, так что образ за словами разный." }
  - { kind: government, text: "Объект гнева вводится предлогом NA с винительным: WŚCIEC SIĘ NA KOGOŚ, NA COŚ. WŚCIEKŁ SIĘ NA MNIE значит «он разозлился на меня», и предлог с падежом совпадают с русскими полностью. Причина идёт с предлогом O или ZA с винительным: WŚCIEC SIĘ O DROBIAZG «разозлиться из-за пустяка», WŚCIEC SIĘ ZA SPÓŹNIENIE. Прямого дополнения у глагола нет, он непереходный, поэтому страдательного причастия в парадигме не бывает, а причастие WŚCIEKŁY по происхождению действительное." }
  - { kind: pronunciation, text: "Читается «фсьцец», в один слог, и это одно из самых трудных для произношения польских слов. Начальное W перед глухим Ś оглушается и звучит как «ф». Сочетание ŚC даёт два мягких звука подряд, «сьць», которых в русском рядом не бывает. Конечное C без хвостика читается как твёрдое «ц». Второй инфинитив легче: WŚCIEKNĄĆ звучит «фсьцекно́нчь», три слога с ударением на предпоследнем. В прилагательном WŚCIEKŁY слышно «фсьце́куы», где Ł даёт «у»." }
  - { kind: register, text: "Слово выразительное и разговорное, в официальном тексте неуместно. В быту оно встречается постоянно: WŚCIEKŁEM SIĘ «я разозлился», JESTEM WŚCIEKŁY «я в ярости», ON SIĘ WŚCIEKNIE «он взбесится». Нейтральные замены — ZDENERWOWAĆ SIĘ «разнервничаться» и ROZZŁOŚCIĆ SIĘ «разозлиться». Наречие WŚCIEKLE в разговоре работает как русское «страшно» или «ужасно» при прилагательном. Медицинское WŚCIEKLIZNA стоит особняком и никакой разговорности не имеет." }
