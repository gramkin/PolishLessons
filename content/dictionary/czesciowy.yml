etymology: "От CZĘŚĆ «часть», общеславянского *čęstь, где носовое Ę соответствует русскому «а»: CZĘŚĆ — «часть», PIĘĆ — «пять», MIĘSO — «мясо». Суффикс -OWY сделал из существительного прилагательное «состоящий из части»."
memory: "Częściowy — частичный: częściowy sukces, częściowe zachmurzenie (переменная облачность). От część — часть, с ę на месте «а». Częściowo — отчасти. Читается «чэнсьцьо́вы»."
