notes:
  - { kind: false-friend, text: "Ловушки нет, но есть путаница с соседом: CZĘŚĆ «часть» пишется так же, как CZEŚĆ «привет, честь», только с Ę. От CZĘŚĆ — CZĘŚCIOWY «частичный», от CZEŚĆ — ничего похожего. Зато русское «частичный» и польское CZĘŚCIOWY — точные соответствия, и польское Ę на месте русского «а» тут обычное: CZĘŚĆ — «часть»." }
  - { kind: usage, text: "Относительное прилагательное, степеней сравнения нет. Формы для мужчин-людей CZĘŚCIOWI в карточке нет: частичными бывают успехи и выплаты, а не люди. Остальные десять форм живые. Наречие CZĘŚCIOWO, «частично, отчасти», очень частое: CZĘŚCIOWO MASZ RACJĘ, «отчасти ты прав»." }
  - { kind: government, text: "Ставится перед существительным: CZĘŚCIOWY SUKCES, CZĘŚCIOWA ZAPŁATA, CZĘŚCIOWE ZACHMURZENIE. Падежных требований нет. Противоположность — CAŁKOWITY или PEŁNY: CAŁKOWITY SUKCES, PEŁNA ZAPŁATA." }
  - { kind: pronunciation, text: "Читается «чэнсьцьо́вы», четыре слога, ударение на предпоследнем. Ę перед Ś звучит «эн», ŚCI — «сьць», CIO — «цьо». Скопление мягких согласных в середине — главная трудность: «чэн-сьцьо»." }
  - { kind: register, text: "Нейтральное слово, частое в официальной речи и в прогнозе погоды: ZACHMURZENIE CZĘŚCIOWE, «переменная облачность». В быту чаще наречие: CZĘŚCIOWO ZROBIONE, «частично сделано»." }
