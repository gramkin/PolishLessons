notes:
  - { kind: false-friend, text: "Само слово чужое нам только по виду: русский взял на это место английское «контейнер», у которого в нашем языке нет никакой родни. А польское POJEMNIK вырос из глагола POJĄĆ, и вот где неожиданность: POJĄĆ значит «понять». NIE POJMUJĘ — это «не понимаю». Первым смыслом корня было «взять, вместить», и отсюда сразу две ветки: POJEMNIK вмещает вещи, а POJĄĆ — мысли. Русское «понять» собрано ровно так же, из «по» и «ять»." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Основа не меняется, беглых гласных нет. Существительное POJEMNOŚĆ значит «ёмкость, объём» и стоит на каждой бутылке и батарейке. Прилагательное POJEMNY значит «вместительный»: POJEMNA TORBA — «вместительная сумка». Все три слова одного корня, и узнав одно, вы узнаёте остальные." }
  - { kind: government, text: "Контейнер для мусора — POJEMNIK NA ŚMIECI, предлог NA с винительным, и именно NA передаёт назначение: POJEMNIK NA WODĘ, POJEMNIK NA SZKŁO. Русский здесь скажет «для», с родительным. В контейнере — W POJEMNIKU, местный падеж. Без контейнера — BEZ POJEMNIKA, родительный." }
  - { kind: pronunciation, text: "Читается «пое́мник», три слога, ударение на предпоследнем. Сочетание JE даёт «е», и буква J здесь между гласными почти сливается, поэтому начало слова звучит «пое». Дальше идёт «мник», с мягким «н» перед I. Трудных мест в слове нет." }
  - { kind: register, text: "Слово нейтральное и бытовое, из разговора о кухне и о мусоре. POJEMNIK NA ŚMIECI стоит в каждом дворе, а POJEMNIKI NA SEGREGACJĘ, для раздельного сбора, различают по цветам. На кухне это POJEMNIK PLASTIKOWY или SZCZELNY POJEMNIK для крупы. В технике POJEMNOŚĆ значит ёмкость аккумулятора или объём двигателя." }
collocations:
