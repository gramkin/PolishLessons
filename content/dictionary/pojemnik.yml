etymology: "От глагола POJĄĆ, собранного из приставки PO- и корня JĄĆ «взять», праславянского и того же, что в русском «взять» и «имать». Русское «понять» построено буквально так же: «по» плюс «ять». Значит, POJĄĆ и «понять» — одно и то же слово, и оба означают «взять умом». А POJEMNIK пошёл по другой ветке того же корня, по вещественной: это то, что берёт в себя. Так ёмкость и понимание оказались родней."
memory: "Контейнер, ёмкость. Корень тут поучительнее самого слова: pojemnik от pojac, а pojac значит «понять», потому что первым смыслом корня было «взять, вместить». Русское «понять» собрано так же, из «по» и «ять», так что pojac и «понять» — одно слово. Читается «пое́мник». Назначение передаётся предлогом na: pojemnik na smieci, там где русский скажет «для»."
idioms:
  - { pl: "pojemnik na śmieci", ru: "мусорный контейнер" }
