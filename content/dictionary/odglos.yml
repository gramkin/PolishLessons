notes:
  - { kind: false-friend, text: "Собрано из od- «от-» и głos «голос»: буквально «отголосок». Русское «отголосок» — то же слово, но значит эхо, отзвук, а польское odgłos это любой звук." }
  - { kind: government, text: "Мужской неодушевлённый; родительный — odgłosu." }
  - { kind: usage, text: "Чаще всего о звуке, который что-то издаёт: odgłos pociągu, odgłosy wiosny, odgłos kroków." }
  - { kind: usage, text: "Карточка głos «голос» уже есть — стоит держать их рядом." }
