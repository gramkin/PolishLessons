  - { pl: "odgłosy wiosny", ru: "звуки весны" }
etymology: "od- + głos «голос»: буквально «отголосок». Русское «отголосок» — то же слово, но уже по значению."
memory: "odgłos — любой звук, который что-то издаёт: odgłos kroków «звук шагов». Русский «отголосок» сузился до эха, польское слово осталось широким."
idioms:
  - { pl: "odgłos kroków", ru: "звук шагов" }
