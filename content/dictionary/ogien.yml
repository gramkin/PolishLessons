# review
id: ogien
format: 2
lemma: "ogień"
rank: 617
pos: noun
pron: { cyr: "о́гень" }
senses:
  - id: fire
    ru: "огонь"
    note: "Беглый гласный: ogień, но ognia, ogniem, ogniu."
    examples:
      - pl: "Ogień! Uciekaj!"
        ru: "Огонь! Беги!"
        source: { kind: tatoeba, id: 975964 }
      - pl: "Ogień gaśnie."
        ru: "Огонь гаснет."
        source: { kind: tatoeba, id: 4735285 }
      - pl: "Smoki mają skrzydła i wypuszczają ogień."
        ru: "Драконы имеют крылья и испускают огонь."
        source: { kind: tatoeba, id: 2147302 }
  - id: play-with-fire
    ru: "bawić się ogniem — играть с огнём"
    note: "Творительный падеж, как и в русском."
    examples:
      - pl: "Niebezpiecznie jest bawić się ogniem."
        ru: "Опасно играть с огнём."
        source: { kind: tatoeba, id: 989369 }
      - pl: "Ostrożnie z ogniem."
        ru: "Осторожно с огнём."
        source: { kind: translated, id: 712409 }
      - pl: "Całe miasto było w ogniu."
        ru: "Весь город был в огне."
        source: { kind: tatoeba, id: 2164558 }
  - id: fireworks
    ru: "sztuczne ognie — фейерверк"
    note: "Буквально «искусственные огни»; множественное живёт почти только здесь."
    examples:
      - pl: "Sztuczne ognie."
        ru: "Фейерверк."
        source: { kind: translated, id: 13030344 }
      - pl: "Wystrzelili sztuczne ognie."
        ru: "Они запустили фейерверк."
        source: { kind: translated, id: 410338 }
      - pl: "Widzę sztuczne ognie!"
        ru: "Я вижу фейерверк!"
        source: { kind: translated, id: 1198752 }
notes:
  - { kind: usage, text: "Беглый гласный: именительный ogień, но родительный ognia, творительный ogniem, предложный ogniu." }
  - { kind: government, text: "bawić się ogniem «играть с огнём» — творительный, как в русском; w ogniu «в огне» — предложный." }
  - { kind: usage, text: "Множественное ognie живёт почти только в сочетании sztuczne ognie «фейерверк», буквально «искусственные огни»." }
  - { kind: usage, text: "Ognia! — военная команда «Огонь!», стоит в родительном падеже. Костёр — ognisko, прилагательное — ognisty." }
collocations:
  - { pl: "bawić się ogniem", ru: "играть с огнём" }
  - { pl: "sztuczne ognie", ru: "фейерверк" }
  - { pl: "w ogniu", ru: "в огне" }
  - { pl: "przy ogniu", ru: "у огня" }
family:
  - { pl: "ognisko", ru: "костёр", relation: derived }
  - { pl: "ognisty", ru: "огненный", relation: derived }
  - { pl: "zapalić", ru: "зажечь", relation: root }
etymology: "От праславянского *ognь — то же слово, что русское «огонь», и с той же беглой гласной: ogień — ognia, как огонь — огня."
memory: "ogień — «огонь», и склоняется он с беглым гласным ровно как русское слово: ogień, но ognia, ogniem, ogniu — как «огонь, огня, огнём». Управление тоже совпадает: bawić się ogniem «играть с огнём» (творительный), w ogniu «в огне» (предложный). А множественное ognie живёт почти только в обороте sztuczne ognie «фейерверк» — буквально «искусственные огни». Костёр — ognisko."
idioms:
  - { pl: "bawić się ogniem", ru: "играть с огнём" }
  - { pl: "sztuczne ognie", ru: "фейерверк" }
  - { pl: "Ognia!", ru: "Огонь!" }
