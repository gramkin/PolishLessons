formExamples:
  - form: "porozumiałbym"
    pl: "Język chiński jest przydatny, ale trudny. Gdybym mówił po chińsku, porozumiałbym się z wielu ludźmi, bo najwięcej na świecie jest Chińczyków."
    ru: "Китайский полезен, но труден. Если бы я говорил по-китайски, я объяснился бы легче."
    source: { kind: translated, id: 1355058 }
  - form: "porozumiałbym"
    pl: "Porozumiałbym się z nimi po angielsku."
    ru: "Я объяснился бы с ними по-английски."
    source: { kind: authored }
  - form: "porozumiałbym"
    pl: "Nie porozumiałbym się bez tłumacza."
    ru: "Без переводчика я бы не объяснился."
    source: { kind: authored }
  - form: "porozumieć"
    pl: "To rozmówki, pomogą ci się porozumieć."
    ru: "Это разговорник. Он поможет вам в общении."
    source: { kind: tatoeba, id: 10695932 }
  - form: "porozumieć"
    pl: "Umiesz się porozumieć po japońsku?"
    ru: "Ты умеешь объясниться по-японски?"
    source: { kind: translated, id: 728588 }
  - form: "porozumieć"
    pl: "Próbował się porozumieć słowem i gestem."
    ru: "Он пытался объясниться словом и жестом."
    source: { kind: translated, id: 366221 }
  - form: "porozumieją"
    pl: "Porozumieją się w tym punkcie."
    ru: "В этом пункте они договорятся."
    source: { kind: translated, id: 7868574 }
  - form: "porozumieją"
    pl: "Może się jeszcze porozumieją."
    ru: "Может, они ещё договорятся."
    source: { kind: authored }
  - form: "porozumieją"
    pl: "Nigdy się nie porozumieją."
    ru: "Они никогда не договорятся."
    source: { kind: authored }
  - form: "porozumieliśmy"
    pl: "Porozumieliśmy się z pracownikami, których biuro jest zielone."
    ru: "Мы договорились с сотрудниками, чей офис зелёный."
    source: { kind: translated, id: 10963549 }
  - form: "porozumieliśmy"
    pl: "Porozumieliśmy się bez słów."
    ru: "Мы поняли друг друга без слов."
    source: { kind: authored }
  - form: "porozumieliśmy"
    pl: "W końcu się porozumieliśmy."
    ru: "В конце концов мы договорились."
    source: { kind: authored }
  - form: "porozumiemy"
    pl: "Jeśli kiedykolwiek nawiążemy kontakt z obcymi, jak się z nimi porozumiemy?"
    ru: "Если мы когда-нибудь установим контакт с чужими, как мы с ними объяснимся?"
    source: { kind: translated, id: 521418 }
  - form: "porozumiemy"
    pl: "Jakoś się porozumiemy."
    ru: "Как-нибудь объяснимся."
    source: { kind: authored }
  - form: "porozumiemy"
    pl: "Porozumiemy się na migi."
    ru: "Объяснимся знаками."
    source: { kind: authored }
  - form: "porozumienia"
    pl: "Na razie porozumienia nie osiągnięto."
    ru: "Пока соглашения не достигнуто."
    source: { kind: translated, id: 360184 }
  - form: "porozumienia"
    pl: "Poziom wzajemnego porozumienia zależy od kultury."
    ru: "Степень взаимопонимания зависит от культуры."
    source: { kind: translated, id: 366072 }
  - form: "porozumienia"
    pl: "Tom i Mary doszli do porozumienia."
    ru: "Том и Мэри пришли к соглашению."
    source: { kind: translated, id: 5088093 }
  - form: "porozumienie"
    pl: "Przyjaźń to porozumienie się."
    ru: "Дружба - это взаимопонимание."
    source: { kind: tatoeba, id: 4004071 }
  - form: "porozumienie"
    pl: "W tej kwestii pewnie osiągną porozumienie."
    ru: "В этом вопросе они, вероятно, достигнут соглашения."
    source: { kind: translated, id: 440647 }
  - form: "porozumienie"
    pl: "Podpisali porozumienie."
    ru: "Они подписали соглашение."
    source: { kind: authored }
