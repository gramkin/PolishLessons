# review
id: porozumiec
format: 2
lemma: "porozumieć"
rank: 2240
pos: verb
aspect: perf
pron: { cyr: "порозу́мець" }
senses:
  - id: communicate
    ru: "объясниться, суметь договориться (porozumieć się)"
    examples:
      - pl: "To rozmówki, pomogą ci się porozumieć."
        ru: "Это разговорник. Он поможет вам в общении."
        source: { kind: tatoeba, id: 10695932 }
      - pl: "Umiesz się porozumieć po japońsku?"
        ru: "Ты умеешь объясниться по-японски?"
        source: { kind: translated, id: 728588 }
      - pl: "Próbował się porozumieć słowem i gestem."
        ru: "Он пытался объясниться словом и жестом."
        source: { kind: translated, id: 366221 }
  - id: agreement
    ru: "соглашение, взаимопонимание (существительное porozumienie)"
    examples:
      - pl: "Przyjaźń to porozumienie się."
        ru: "Дружба - это взаимопонимание."
        source: { kind: tatoeba, id: 4004071 }
      - pl: "Tom i Mary doszli do porozumienia."
        ru: "Том и Мэри пришли к соглашению."
        source: { kind: translated, id: 5088093 }
notes:
  - { kind: government, text: "Всегда с się. С кем — z и творительный: porozumieć się z kimś. На каком языке — по- плюс наречие: porozumieć się po japońsku." }
  - { kind: usage, text: "Отглагольное существительное porozumienie значит и «взаимопонимание», и «соглашение»: dojść do porozumienia «прийти к соглашению»." }
  - { kind: false-friend, text: "Корень rozumieć «понимать», который уже есть в словаре; ср. русское «разуметь», «разум»." }
  - { kind: usage, text: "Несовершенный вид — porozumiewać się." }
  - { kind: government, text: "Повелительное наклонение — porozum się, porozumcie się: у глаголов на -umieć оно строится от голой основы, как rozum от rozumieć. Формы porozumiej нет." }
collocations:
  - { pl: "porozumieć się z kimś", ru: "договориться с кем-л." }
  - { pl: "dojść do porozumienia", ru: "прийти к соглашению" }
etymology: "po- + rozumieć «понимать»; ср. русское «разуметь», «разум», «уразуметь»."
memory: "porozumieć się — «объясниться, договориться», всегда с się и с z плюс творительный. Существительное porozumienie значит и «взаимопонимание», и «соглашение»."
idioms:
