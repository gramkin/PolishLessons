# review
id: zlecenie
format: 2
lemma: "zlecenie"
rank: 5788
pos: noun
pron: { cyr: "злеце́не" }
senses:
  - id: order
    ru: "заказ (на работу, услугу)"
    examples:
      - pl: "Zastanawiam się, czy przyjąć to zlecenie."
        ru: "Я раздумываю, браться ли за этот заказ."
        source: { kind: translated, id: 933271 }
      - pl: "Dzięki kampanii reklamowej do firmy trafiło dużo zleceń."
        ru: "Благодаря рекламной кампании в фирму поступило много заказов."
        source: { kind: translated, id: 766487 }
      - pl: "Pracuje na zlecenie dużego wydawnictwa."
        ru: "Он работает по заказу крупного издательства."
        source: { kind: authored }
      - pl: "Zabójstwo na zlecenie wstrząsnęło miastem."
        ru: "Заказное убийство потрясло город."
        source: { kind: authored }
  - id: instruction
    ru: "поручение, распоряжение (банку, ведомству)"
    examples:
      - pl: "Złożyłem w banku zlecenie stałe na czynsz."
        ru: "Я оформил в банке постоянное поручение на оплату квартиры."
        source: { kind: authored }
      - pl: "Policja wykonała zlecenie prokuratury."
        ru: "Полиция выполнила поручение прокуратуры."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ZLECENIE — «заказ, поручение», к «лечению» отношения не имеет (лечение — LECZENIE). Глагол — ZLECIĆ / ZLECAĆ «поручить, заказать»." }
  - { kind: usage, text: "UMOWA ZLECENIA (в разговоре UMOWA-ZLECENIE) — гражданско-правовой договор вместо трудового: PRACOWAĆ NA ZLECENIU. NA ZLECENIE KOGOŚ — «по заказу кого-то»; ZABÓJSTWO NA ZLECENIE — «заказное убийство»." }
  - { kind: government, text: "Чей заказ — родительный: ZLECENIE KLIENTA. На что — NA с винительным: ZLECENIE NA TŁUMACZENIE. Взять заказ — PRZYJĄĆ ZLECENIE, выполнить — WYKONAĆ ZLECENIE." }
  - { kind: pronunciation, text: "Читается «злеце́не»: C — твёрдое «ц», не «ч». Восемь форм, средний род; звательный совпадает с именительным." }
collocations:
  - { pl: "przyjąć zlecenie", ru: "взять заказ" }
  - { pl: "na zlecenie", ru: "по заказу" }
  - { pl: "umowa zlecenia", ru: "договор поручения" }
  - { pl: "zlecenie stałe", ru: "постоянное банковское поручение" }
family:
  - { pl: "zlecić", ru: "поручить, заказать", relation: root, id: zlecic }
  - { pl: "zlecać", ru: "поручать, заказывать", relation: root }
  - { pl: "zleceniodawca", ru: "заказчик", relation: derived }
  - { pl: "zleceniobiorca", ru: "исполнитель заказа", relation: derived }
etymology: "Отглагольное существительное от ZLECIĆ «поручить» с суффиксом -ENIE."
memory: "Zlecenie — заказ, поручение; не «лечение». Na zlecenie — по заказу. Umowa zlecenia — договор вместо трудового."
idioms:
