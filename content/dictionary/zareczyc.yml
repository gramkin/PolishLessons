# review
id: zareczyc
format: 2
lemma: "zaręczyć"
rank: 4016
pos: verb
pron: { cyr: "зарэ́нчыць" }
senses:
  - id: engage
    ru: "с SIĘ — обручиться, помолвиться"
    examples:
      - pl: "Zaręczyli się po roku znajomości."
        ru: "Они обручились через год после знакомства."
        source: { kind: authored }
      - pl: "Zaręczyła się z Włochem."
        ru: "Она обручилась с итальянцем."
        source: { kind: authored }
      - pl: "Zaręczmy się na wiosnę."
        ru: "Давай обручимся весной."
        source: { kind: authored }
  - id: vouch
    ru: "поручиться, заверить"
    examples:
      - pl: "Mogę zaręczyć, że mówi prawdę."
        ru: "Могу поручиться, что он говорит правду."
        source: { kind: authored }
      - pl: "Zaręczył za brata w banku."
        ru: "Он поручился за брата в банке."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ZARĘCZYĆ SIĘ — «обручиться», а не «заручиться». Русское «заручиться поддержкой» — ZAPEWNIĆ SOBIE POPARCIE. ZARĘCZYĆ без SIĘ — «поручиться»: ZARĘCZAM, ŻE TO PRAWDA — «уверяю вас, что это правда»." }
  - { kind: usage, text: "Пятьдесят три формы. Страдательное ZARĘCZONY — «помолвленный»: JESTEŚMY ZARĘCZENI. Помолвка — ZARĘCZYNY, только мн. ч.; жених и невеста — NARZECZONY, NARZECZONA. Будущее: ZARĘCZĘ, ZARĘCZYSZ, повелительное ZARĘCZ. Несовершенный вид — ZARĘCZAĆ «ручаться»." }
  - { kind: government, text: "С кем — Z с творительным: ZARĘCZYĆ SIĘ Z KASIĄ. За кого — ZA с винительным: ZARĘCZYĆ ZA PRZYJACIELA. В чём — придаточное с ŻE: ZARĘCZYĆ, ŻE TO PRAWDA." }
  - { kind: pronunciation, text: "Читается «зарэ́нчыць»: Ę перед CZ — «эн», CZY — твёрдое «чы». Ударение на предпоследнем слоге. ZARĘCZĘ — «зарэ́нчэ»." }
  - { kind: register, text: "ZARĘCZYĆ SIĘ — нейтральное. ZARĘCZAM, ŻE — чуть книжное, вежливое «уверяю». ZARĘCZYĆ SŁOWEM HONORU — торжественное." }
collocations:
  - { pl: "zaręczyć się z kimś", ru: "обручиться с кем-то" }
  - { pl: "zaręczyć za kogoś", ru: "поручиться за кого-то" }
  - { pl: "zaręczyć się w tajemnicy", ru: "тайно обручиться" }
family:
  - { pl: "narzeczony", ru: "жених", relation: derived, id: narzeczony }
  - { pl: "ręka", ru: "рука", relation: root, id: reka }
  - { pl: "zaręczyny", ru: "помолвка", relation: derived }
etymology: "Приставка ZA- плюс RĘCZYĆ «ручаться», от RĘKA «рука»: поручиться значило «дать руку». Польское Ę соответствует русскому «у»: RĘKA — «рука», ZARĘCZYĆ — «заручиться»."
memory: "Zaręczyć się — обручиться: zaręczyli się w Paryżu. Zaręczyć za kogoś — поручиться. Zaręczyny — помолвка. Читается «зарэ́нчыць»."
idioms:
  - { pl: "zaręczyć słowem honoru", ru: "поручиться честным словом" }
