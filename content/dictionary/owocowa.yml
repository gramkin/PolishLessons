        ru: "Туристы проехали мимо цветущих плодовых деревьев."
        source: { kind: translated, id: 6156448 }
  - id: fruit-tree
    ru: "плодовый (о деревьях, саде)"
    examples:
      - pl: "W ogrodzie rosną drzewa owocowe."
        ru: "В саду растут плодовые деревья."
        source: { kind: authored }
      - pl: "Kupiliśmy herbatę owocową."
        ru: "Мы купили фруктовый чай."
        source: { kind: authored }
notes:
  - { kind: government, text: "Обычное прилагательное; согласуется с существительным: sok owocowy «фруктовый сок», herbata owocowa, drzewa owocowe." }
  - { kind: false-friend, text: "От owoc «фрукт, плод». Русское «овощ» звучит почти так же, но значит другое: польское owoc — это фрукт, а овощ — warzywo. Одна из самых известных ловушек между языками." }
  - { kind: usage, text: "Идентификатор карточки стоит в женском роде, потому что в реестре слово записано именно так; словарная форма — owocowy." }
  - { kind: usage, text: "Частые сочетания: sok owocowy «сок», sałatka owocowa «фруктовый салат», drzewo owocowe «плодовое дерево»." }
collocations:
