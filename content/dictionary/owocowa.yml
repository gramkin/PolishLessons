senses:
  - id: fruit-attr
    ru: "фруктовый, плодовый"
    examples:
      - pl: "Lubię musujące i owocowe wina."
        ru: "Я люблю игристые и фруктовые вина."
        source: { kind: translated, id: 1059807 }
      - pl: "Lubisz sałatkę owocową?"
        ru: "Ты любишь фруктовый салат?"
        source: { kind: translated, id: 6305754 }
