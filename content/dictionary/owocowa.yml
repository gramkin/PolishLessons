  - { pl: "sałatka owocowa", ru: "фруктовый салат" }
etymology: "От owoc «фрукт, плод». Русский «овощ» созвучен, но значит другое: овощ по-польски warzywo."
memory: "owocowy — «фруктовый», от owoc «фрукт». И главная ловушка: польское owoc — это ФРУКТ, а овощ — warzywo."
