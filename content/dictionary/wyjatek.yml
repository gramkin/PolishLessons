notes:
  - { kind: government, text: "За исключением кого-либо — z wyjątkiem kogoś, с родительным падежом: z wyjątkiem Jima. Вариант za wyjątkiem тоже встречается, но считается менее правильным." }
  - { kind: usage, text: "Wyjątek potwierdza regułę — «Исключение подтверждает правило», пословица совпадает с русской." }
  - { kind: usage, text: "zrobić wyjątek — «сделать исключение»: zrobię dla ciebie wyjątek." }
  - { kind: usage, text: "Прилагательное — wyjątkowy «исключительный», наречие wyjątkowo «исключительно, необычайно»." }
collocations:
  - { pl: "z wyjątkiem", ru: "за исключением" }
  - { pl: "zrobić wyjątek", ru: "сделать исключение" }
  - { pl: "bez wyjątku", ru: "без исключения" }
family:
  - { pl: "wyjątkowy", ru: "исключительный", relation: root, id: wyjatkowy }
  - { pl: "wyjątkowo", ru: "исключительно", relation: root }
etymology: "От wyjąć «вынуть»: буквально «вынутое», то, что вынуто из-под общего правила. Русское «исключение» построено от «исключить» — образ очень близкий."
memory: "wyjątek — «исключение»: zrobić wyjątek «сделать исключение». За исключением — z wyjątkiem с родительным падежом. И пословица та же: Wyjątek potwierdza regułę."
