notes:
  - { kind: false-friend, text: "PRZYRZEKAĆ — «торжественно обещать, клясться», а не «приговаривать» и не «присекать». Это книжный и торжественный синоним OBIECYWAĆ. Типичные контексты — клятва скаутов, свадебный обет, обещание ребёнку: PRZYRZEKAM! «честное слово!». Обещание — PRZYRZECZENIE." }
  - { kind: usage, text: "Несовершенный вид; совершенный — PRZYRZEC. Спряжение на -AM: PRZYRZEKAM, PRZYRZEKASZ, PRZYRZEKAJĄ. Мужско-личное страдательное PRZYRZEKANI в карточку не включено: обещают что-то, а не людей." }
  - { kind: government, text: "Что — винительный, кому — дательный: PRZYRZEKAĆ KOMUŚ POMOC. Что сделать — инфинитив: PRZYRZEKA WRÓCIĆ. С придаточным — ŻE: PRZYRZEKAM, ŻE PRZYJDĘ." }
  - { kind: pronunciation, text: "Читается «пшыжэ́каць»: PRZ — «пш», RZE — «жэ». Ударение на предпоследнем слоге. PRZYRZEKAM — «пшыжэ́кам»." }
  - { kind: register, text: "Книжно-торжественное слово. В быту — OBIECYWAĆ; детское PRZYRZEKAM! — «честное слово!»." }
collocations:
  - { pl: "przyrzekać wierność", ru: "клясться в верности" }
  - { pl: "przyrzekać poprawę", ru: "обещать исправиться" }
  - { pl: "uroczyście przyrzekać", ru: "торжественно обещать" }
family:
  - { pl: "przyrzec", ru: "пообещать, поклясться", relation: aspect }
  - { pl: "obiecywać", ru: "обещать", relation: root, id: obiecywac }
  - { pl: "przyrzeczenie", ru: "обещание, клятва", relation: derived }
etymology: "Приставка PRZY- плюс RZEKAĆ, от RZEC «сказать», праславянское *rekti, как русское «речь», «изрекать»."
memory: "Przyrzekać — торжественно обещать: przyrzekam, że wrócę. От rzec «сказать», как русское «речь»."
