        ru: "Он обещает ей любовь до конца жизни."
        source: { kind: authored }
  - id: vow
    ru: "давать обет, присягать (в обряде)"
    examples:
      - pl: "Państwo młodzi przyrzekają sobie wierność."
        ru: "Молодые клянутся друг другу в верности."
        source: { kind: authored }
      - pl: "Świadkowie przyrzekają mówić prawdę."
        ru: "Свидетели клянутся говорить правду."
