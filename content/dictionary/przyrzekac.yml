pron: { cyr: "пшыжэ́каць" }
senses:
  - id: promise
    ru: "обещать, клясться (торжественно)"
    examples:
      - pl: "Przyrzekam, że to się więcej nie powtórzy."
        ru: "Обещаю, что это больше не повторится."
