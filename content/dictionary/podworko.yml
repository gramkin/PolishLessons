  - { pl: "bawić się na podwórku", ru: "играть во дворе" }
  - { pl: "koledzy z podwórka", ru: "друзья по двору" }
family:
  - { pl: "podwórze", ru: "двор (большой)", relation: root }
  - { pl: "dwór", ru: "двор (королевский); усадьба", relation: root, id: dwor }
  - { pl: "podwórkowy", ru: "дворовый", relation: derived }
etymology: "Уменьшительное от PODWÓRZE, а то — от POD «под, у» и DWÓR «двор, усадьба»: пространство у дома. Русское «подворье» — того же строения."
memory: "Podwórko — двор у дома; dwór — королевский двор, усадьба. Читается «подву́рко». Na podwórku — во дворе (na!)."
