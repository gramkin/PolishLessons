notes:
  - { kind: false-friend, text: "PODWÓRKO — «двор» дома, где играют дети. DWÓR — это королевский «двор» или «усадьба»: DWÓR KRÓLEWSKI, DWÓR SZLACHECKI. Большой двор — PODWÓRZE." }
  - { kind: usage, text: "Восемь форм, средний род. Местный — NA PODWÓRKU, родительный множественного — PODWÓREK, с беглым E." }
  - { kind: government, text: "Во дворе — NA PODWÓRKU, с NA, а не W. Выйти во двор — WYJŚĆ NA PODWÓRKO, винительный. По двору — PO PODWÓRKU." }
  - { kind: pronunciation, text: "Читается «подву́рко», ударение на предпоследнем слоге. Ó — «у», W перед Ó звонкое." }
collocations:
