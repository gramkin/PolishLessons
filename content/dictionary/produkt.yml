notes:
  - { kind: usage, text: "Местный падеж — PRODUKCIE: t переходит в ć, которое перед гласной пишется как ci. Это шестое слово в одном ряду: elemencie, kącie, rakiecie, fragmencie, asystencie, produkcie. Правило надёжное и стоит запомнить его как закон: перед окончанием -e твёрдое t не выживает никогда. Обратное тоже верно — там, где окончание не -e, t остаётся на месте: produktu, produktem, produktom." }
  - { kind: usage, text: "Родительный падеж — PRODUKTU с окончанием -u, как PLIKU и DYMU из партии 223. Напомню расклад: мужские неодушевлённые выбирают между -a и -u, выбор лексический, и по виду слова его не угадать. Здесь -u, но местный всё равно отличается — produkcie против produktu, — так что формы не слились, и их десять, а не девять." }
  - { kind: false-friend, text: "Ловушка в числе. Русское «продукты» во множественном значит именно еду, съестное, и слово в этом смысле не требует пояснений. Польское PRODUKTY — это любые изделия и товары: produkty tej fabryki, produkty bankowe. Чтобы получить русский смысл, нужно добавить определение: PRODUKTY SPOŻYWCZE или ARTYKUŁY SPOŻYWCZE. Сказать в магазине kupiłem produkty и ждать, что поймут про еду, не выйдет — спросят, какие именно." }
collocations:
  - { pl: "produkt krajowy", ru: "отечественный товар" }
  - { pl: "produkty spożywcze", ru: "продукты питания" }
  - { pl: "produkt uboczny", ru: "побочный продукт" }
family:
  - { pl: "produkować", ru: "производить", relation: derived }
  - { pl: "produkcja", ru: "производство", relation: derived }
  - { pl: "producent", ru: "производитель", relation: derived }
etymology: "Из латинского PRODUCTUM «выведенное вперёд», от producere: pro- «вперёд» и ducere «вести». Тот же ducere стоит в «дедукции», «акведуке» и «дирижёре». Русский взял слово тем же книжным путём, но развёл числа по смыслам: единственное «продукт» осталось общим, а множественное «продукты» сузилось до еды. Польский такого сужения не сделал, и produkty остались просто изделиями."
memory: "Местный produkcie — t всегда даёт ć перед -e. А produkty — это товары вообще; еда требует spożywcze."
idioms:
  - { pl: "produkt krajowy brutto", ru: "валовой внутренний продукт" }
  - { pl: "produkt uboczny", ru: "побочный продукт" }
formExamplesSkip:
