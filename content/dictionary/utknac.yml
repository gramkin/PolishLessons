        ru: "Туристы застряли в приюте на три дня."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "КОРЕНЬ ЗНАКОМЫЙ, СМЫСЛ СДВИНУТ. Utknąć — это u- плюс tknąć, а tknąć и есть русское «ткнуть». Ближайший русский родственник собран ровно так же — «уткнуться», — но значит другое: упереться лицом или взглядом. «Уткнуться в пробку» по-русски не скажешь, а utknąć w korku — самая обычная польская фраза. Зато соседи по гнезду совпадают полностью: potknąć się это «споткнуться», natknąć się — «наткнуться», dotknąć — «дотронуться»." }
  - { kind: usage, text: "Вид совершенный, несовершенная пара — utykać. Глагол непереходный: застревают САМИ, винительного дополнения у него нет. Поэтому страдательного причастия не бывает, хотя формы utknięty, utknięta генератор и выдаёт — правило «-nąć даёт -nięty» верно само по себе, как в ciągnąć → ciągnięty, но применить его здесь не к чему. Безличное utknięto при этом совершенно нормально: оно образуется и от непереходных глаголов." }
  - { kind: pronunciation, text: "Чередование ą и ę в прошедшем времени, уже знакомое по płynął/płynęła и ciągnął/ciągnęła: utknął звучит «у́ткноу», а utknęła — «уткнэ́уа». Задний носовой держится только в мужском роде единственного числа, во всех остальных формах он передний." }
  - { kind: government, text: "Застревают В чём-то — w с предложным падежом: utknąć w korku, w błocie, w windzie. Или НА чём-то — na с предложным: utknąć na moście, na granicy, na pierwszym punkcie. Обе модели совпадают с русскими «застрять в» и «застрять на», и предлог выбирается так же." }
collocations:
  - { pl: "utknąć w korku", ru: "застрять в пробке" }
  - { pl: "utknąć na granicy", ru: "застрять на границе" }
  - { pl: "utknąć w martwym punkcie", ru: "зайти в тупик" }
family:
  - { pl: "tknąć", ru: "тронуть, ткнуть", relation: root }
  - { pl: "potknąć się", ru: "споткнуться", relation: derived }
  - { pl: "utykać", ru: "застревать", relation: aspect }
etymology: "Приставка u- плюс tknąć «ткнуть, тронуть», от того же корня, что русские «ткнуть» и «тыкать». Внутри польского гнездо совпадает с русским до буквы: dotknąć «дотронуться», potknąć się «споткнуться», natknąć się «наткнуться». Разошлось только само utknąć: русское «уткнуться» ушло в сторону «упереться», польское — в сторону «застрять»."
memory: "utknąć — «застрять», и собрано оно из знакомого: u- плюс tknąć, то есть «ткнуть». Русский сложил те же части в «уткнуться», а значение получилось другое. Держитесь за две самые частые фразы: utknąć w korku «застрять в пробке» и utknąć w martwym punkcie «зайти в тупик»."
idioms:
  - { pl: "utknąć w martwym punkcie", ru: "зайти в тупик, застрять на мёртвой точке" }
  - { pl: "utknąć w korku", ru: "застрять в пробке" }
