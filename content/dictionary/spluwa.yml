pos: noun
pron: { cyr: "сплю́ва" }
senses:
  - id: gun
    ru: "сленг пушка, ствол (пистолет)"
    examples:
      - pl: "Bandyta wyciągnął spluwę."
        ru: "Бандит вытащил ствол."
        source: { kind: authored }
      - pl: "Miał spluwę za paskiem."
        ru: "У него за поясом была пушка."
        source: { kind: authored }
      - pl: "Rzuć spluwę i ręce do góry!"
        ru: "Бросай пушку, руки вверх!"
