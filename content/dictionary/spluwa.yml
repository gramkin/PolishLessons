  - id: firearm-generic
    ru: "сленг огнестрельное оружие вообще"
    examples:
      - pl: "W tym filmie wszyscy biegają ze spluwami."
        ru: "В этом фильме все бегают со стволами."
        source: { kind: authored }
      - pl: "Policja znalazła w bagażniku trzy spluwy."
        ru: "Полиция нашла в багажнике три ствола."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Русскому SPLUWA напоминает «плевать», и правильно: корень тот же, PLUĆ, «плевать». Пистолет «плюётся» пулями. Это криминальный и киношный сленг, как русское «пушка» или «ствол». Нейтральное слово — PISTOLET, общее — BROŃ." }
  - { kind: usage, text: "Женский род, неодушевлённое, обычное склонение на -A: SPLUWA, SPLUWY, SPLUWĘ, SPLUWĄ, W SPLUWIE. Множественное SPLUWY, родительный SPLUW. Звательный SPLUWO встречается только в шутку и в карточку не включён." }
  - { kind: government, text: "Держать пушку — TRZYMAĆ SPLUWĘ, винительный. Целиться из пистолета — CELOWAĆ ZE SPLUWY, ZE с родительным. Угрожать пистолетом — GROZIĆ SPLUWĄ, творительный." }
  - { kind: pronunciation, text: "Читается «сплю́ва», два слога, ударение на первом. PLU — мягкое «плю». W между гласными звонкое «в». В SPLUWĘ конечное Ę звучит «э»: «сплю́вэ»." }
  - { kind: register, text: "Сленг гангстерских фильмов, детективов и дубляжа: в переводах американских боевиков gun часто передают как SPLUWA. В официальной речи — BROŃ PALNA, «огнестрельное оружие». У полицейских своё слово — KLAMKA, тоже сленг." }
collocations:
  - { pl: "wyciągnąć spluwę", ru: "вытащить пушку" }
  - { pl: "rzucić spluwę", ru: "бросить ствол" }
  - { pl: "grozić spluwą", ru: "угрожать пушкой" }
family:
  - { pl: "pluć", ru: "плевать", relation: root }
  - { pl: "pistolet", ru: "пистолет", relation: root, id: pistolet }
  - { pl: "broń", ru: "оружие", relation: root, id: bron }
etymology: "От SPLUWAĆ «сплёвывать», от PLUĆ «плевать», общеславянского корня, родственного русскому «плевать». Пистолет назвали по тому, как он «выплёвывает» пули. Слово, по-видимому, пришло из воровского жаргона и прижилось в кино."
memory: "Spluwa — сленг: пушка, ствол. Rzuć spluwę! — бросай пушку! От pluć — плевать: пистолет «плюётся». Читается «сплю́ва»."
idioms:
  - { pl: "rzuć spluwę", ru: "бросай пушку" }
formExamplesSkip:
