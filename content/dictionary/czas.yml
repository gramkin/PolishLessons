# review
id: czas
format: 2
lemma: "czas"
rank: 60
pos: noun
pron: { cyr: "час" }
senses:
  - id: time
    ru: "время"
    examples:
      - pl: "Nie ma czasu."
        ru: "Нет времени."
        source: { kind: tatoeba, id: 2657694 }
      - pl: "Będę na czas."
        ru: "Будь вовремя."
        source: { kind: tatoeba, id: 3865333 }
      - pl: "Nie piję w czasie pracy."
        ru: "Я не пью во время работы."
        source: { kind: tatoeba, id: 12949432 }
  - id: era
    ru: "времена, эпоха (чаще во множественном)"
    examples:
      - pl: "Czasy się zmieniają i my zmieniamy się wraz z nimi."
        ru: "Времена меняются, и мы меняемся вместе с ними."
        source: { kind: tatoeba, id: 1397656 }
      - pl: "Czasów się nie wybiera, w nich się żyje i umiera."
        ru: "Времена не выбирают, в них живут и умирают."
        source: { kind: tatoeba, id: 12117372 }
notes:
  - { kind: false-friend, text: "czas — это «время», а не «час». «Час» по-польски godzina." }
  - { kind: usage, text: "czas + инфинитив значит «пора»: Czas iść «Пора идти». Формы czasem и czasami значат «иногда»." }
collocations:
  - { pl: "nie ma czasu", ru: "нет времени" }
  - { pl: "na czas", ru: "вовремя" }
  - { pl: "od czasu do czasu", ru: "время от времени" }
etymology: "Праславянское *časъ — то же слово, что русское «час», но в польском значение расширилось до «время» вообще."
memory: "Классический ложный друг: czas — это «время», а «час» — godzina. Отсюда Nie mam czasu «У меня нет времени» и czasem «иногда»."
idioms:
  - { pl: "na czas", ru: "вовремя" }
  - { pl: "czas to pieniądz", ru: "время — деньги" }
  - { pl: "od czasu do czasu", ru: "время от времени" }
