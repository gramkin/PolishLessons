# review
id: chronic
format: 2
lemma: "chronić"
rank: 752
pos: verb
aspect: imperf
pron: { cyr: "хро́ниць" }
senses:
  - id: protect
    ru: "защищать, охранять"
    examples:
      - pl: "Będę Cię chronić."
        ru: "Я буду тебя защищать."
        source: { kind: translated, id: 4940388 }
      - pl: "Możemy cię chronić."
        ru: "Мы можем тебя защитить."
        source: { kind: translated, id: 3706537 }
      - pl: "Dlaczego ją chronisz?"
        ru: "Почему ты её защищаешь?"
        source: { kind: translated, id: 13350578 }
  - id: protect-from
    ru: "chronić PRZED czymś — защищать от чего-л. (творительный)"
    note: "После przed — творительный падеж."
    examples:
      - pl: "Jego czarne okulary przeciwsłoneczne chroniły jego oczy przed Słońcem."
        ru: "Его чёрные солнечные очки защищали глаза от солнца."
        source: { kind: translated, id: 12375506 }
      - pl: "Chroniliśmy się przed niebezpieczeństwem."
        ru: "Мы укрывались от опасности."
        source: { kind: translated, id: 355762 }
      - pl: "Krem chroni przed słońcem."
        ru: "Крем защищает от солнца."
        source: { kind: authored }
  - id: protected
    ru: "gatunek chroniony — охраняемый вид"
    examples:
      - pl: "Borsuk jest zwierzęciem chronionym."
        ru: "Барсук — охраняемое животное."
        source: { kind: tatoeba, id: 6155822 }
      - pl: "Krokodyl należy do gatunków chronionych."
        ru: "Крокодил относится к охраняемым видам."
        source: { kind: translated, id: 10469047 }
      - pl: "Wieloryby powinny być chronionym gatunkiem."
        ru: "Киты должны быть охраняемым видом."
        source: { kind: translated, id: 2125503 }
  - id: god-protect
    ru: "Boże, chroń… — Боже, храни…"
    examples:
      - pl: "Boże chroń Ukrainę!"
        ru: "Боже, храни Украину!"
        source: { kind: tatoeba, id: 3008270 }
      - pl: "Chroń mnie."
        ru: "Защити меня."
        source: { kind: translated, id: 10596360 }
      - pl: "Chrońcie mnie."
        ru: "Защитите меня."
        source: { kind: translated, id: 10596361 }
notes:
  - { kind: government, text: "chronić kogoś PRZED czymś — «защищать кого-то от чего-то», и после przed идёт творительный падеж: chronić przed słońcem, chronić przed zimnem. Русское «от» с родительным здесь не помогает." }
  - { kind: usage, text: "Существительное от этого глагола — ochrona «защита, охрана»; отглагольное chronienie практически не употребляется." }
  - { kind: usage, text: "Причастие chroniony значит «охраняемый»: gatunek chroniony «охраняемый вид», obszar chroniony «охраняемая территория»." }
  - { kind: usage, text: "Корень тот же, что в русских «хранить» и «хоронить». Родня: ochrona «охрана», schronienie «убежище», ochroniarz «охранник»." }
collocations:
  - { pl: "chronić przed czymś", ru: "защищать от чего-либо" }
  - { pl: "gatunek chroniony", ru: "охраняемый вид" }
  - { pl: "chronić dzieci", ru: "защищать детей" }
  - { pl: "ochrona środowiska", ru: "охрана окружающей среды" }
family:
  - { pl: "ochrona", ru: "охрана, защита", relation: derived }
  - { pl: "schronienie", ru: "убежище", relation: derived }
  - { pl: "ochroniarz", ru: "охранник", relation: derived }
  - { pl: "chroniony", ru: "охраняемый", relation: derived }
etymology: "Праславянское *xorniti «беречь» — то же слово, что русские «хранить» и «хоронить»; в польском корень дал chron-."
memory: "chronić — «защищать, охранять», и корень тот же, что в русских «хранить» и «хоронить». Управление надо запомнить: chronić kogoś PRZED czymś, и после przed идёт творительный падеж — krem chroni przed słońcem. Существительное от глагола — ochrona, а причастие chroniony значит «охраняемый»: gatunek chroniony."
idioms:
  - { pl: "chronić przed słońcem", ru: "защищать от солнца" }
  - { pl: "gatunek chroniony", ru: "охраняемый вид" }
  - { pl: "Boże, chroń…", ru: "Боже, храни…" }
formExamplesSkip:
  - { form: "chronienia", reason: "отглагольного существительного от chronić нет; «защита, охрана» — это ochrona" }
  - { form: "chronienie", reason: "отглагольного существительного от chronić нет; «защита, охрана» — это ochrona" }
  - { form: "chronieniem", reason: "отглагольного существительного от chronić нет; «защита, охрана» — это ochrona" }
  - { form: "chronieniu", reason: "отглагольного существительного от chronić нет; «защита, охрана» — это ochrona" }
