# review
id: zgubic
format: 2
lemma: "zgubić"
rank: 1094
pos: verb
aspect: perf
pron: { cyr: "згу́биць" }
senses:
  - id: lose
    ru: "потерять (вещь)"
    examples:
      - pl: "Zgubiłem klucz."
        ru: "Я потерял ключ."
        source: { kind: tatoeba, id: 352711 }
      - pl: "Zgubiłem portfel."
        ru: "Я потерял кошелёк."
        source: { kind: tatoeba, id: 351549 }
      - pl: "Tom zgubił bilet."
        ru: "Том потерял билет."
        source: { kind: translated, id: 3414266 }
  - id: get-lost
    ru: "zgubić się — заблудиться, потеряться"
    examples:
      - pl: "Zgubiliśmy się."
        ru: "Мы заблудились."
        source: { kind: translated, id: 1913499 }
      - pl: "W tym labiryncie uliczek łatwo się zgubić."
        ru: "В этом лабиринте улочек легко заблудиться."
        source: { kind: translated, id: 12345728 }
  - id: lost-adj
    ru: "zgubiony — потерянный, заблудившийся"
    examples:
      - pl: "Znajdę twój zgubiony pierścionek."
        ru: "Я найду твоё потерянное кольцо."
        source: { kind: translated, id: 364175 }
      - pl: "Jesteśmy zgubieni."
        ru: "Мы пропали."
        source: { kind: translated, id: 8770224 }
notes:
  - { kind: false-friend, text: "zgubić — это потерять вещь, которую куда-то не туда положил. Утратить близкого человека, работу или здоровье — это stracić, а не zgubić." }
  - { kind: usage, text: "С się смысл меняется: zgubić się значит «заблудиться, потеряться»: Zgubiliśmy się w lesie «Мы заблудились в лесу»." }
  - { kind: government, text: "zgubić coś — винительный падеж без предлога, ровно как русское «потерять что-то»." }
  - { kind: usage, text: "Несовершенный вид — gubić. Старое значение «губить» уцелело в zguba «погибель» и в обороте Twoja naiwność cię zgubi «Твоя наивность тебя погубит»." }
collocations:
  - { pl: "zgubić klucze", ru: "потерять ключи" }
  - { pl: "zgubić się", ru: "заблудиться" }
  - { pl: "zgubiony portfel", ru: "потерянный кошелёк" }
  - { pl: "zgubić drogę", ru: "сбиться с пути" }
family:
  - { pl: "gubić", ru: "терять (несовершенный вид)", relation: aspect }
  - { pl: "zguba", ru: "погибель; пропажа", relation: root }
  - { pl: "zgubny", ru: "губительный", relation: derived }
etymology: "Приставка z- плюс gubić, родственное русскому «губить». В польском значение смягчилось до «потерять вещь», а старое осталось в zguba «погибель» и в Twoja naiwność cię zgubi."
memory: "zgubić — «потерять» вещь, а с się — «заблудиться»: Zgubiłem klucz, но Zgubiliśmy się w lesie. Утратить близкого, работу или здоровье — это stracić, а не zgubić."
idioms:
  - { pl: "zgubić się", ru: "заблудиться" }
  - { pl: "zgubić wątek", ru: "потерять нить" }
  - { pl: "zgubić drogę", ru: "сбиться с пути" }
