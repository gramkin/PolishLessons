etymology: "Наречие от butny «заносчивый», от существительного buta «спесь, гордыня». С but «ботинок» слово не связано."
memory: "butnie — «заносчиво, с вызовом», от buta «спесь». Не дайте себя обмануть внешнему сходству: but «ботинок» здесь ни при чём. Слово книжное — в разговоре скажут zarozumiale или hardo."
