notes:
  - { kind: usage, text: "Наречие от butny «спесивый, заносчивый», от существительного buta «спесь, гордыня»." }
  - { kind: false-friend, text: "С обувью ничего общего: but «ботинок» и buta «спесь» — разные слова, хотя выглядят похоже." }
  - { kind: register, text: "Слово книжное, чаще встречается в литературе, чем в разговоре; нейтральные замены — zarozumiale, hardo, wyniośle." }
  - { kind: usage, text: "Примеров в корпусе нет, поэтому все предложения составлены вручную и ждут проверки." }
