notes:
  - { kind: false-friend, text: "ИСХОДНОЕ СЛОВО ШИРЕ РУССКОГО: NAUKA ЭТО И «НАУКА», И «УЧЁБА». Русская «наука» — только область знания; польское nauka значит ещё и учение, занятия: nauka w szkole «учёба в школе», nauka jazdy «автошкола», iść na naukę «пойти учиться». Прилагательное naukowy, однако, покрывает только первый смысл — научный; «учебный» будет szkolny или dydaktyczny." }
  - { kind: usage, text: "Частые сочетания: praca naukowa «научная работа», stopień naukowy «учёная степень», badania naukowe «научные исследования», pracownik naukowy «научный сотрудник». Слитное popularnonaukowy пишется в одно слово, в отличие от русского дефисного «научно-популярный»." }
  - { kind: pronunciation, text: "Четыре слога, ударение на предпоследнем: na-u-KO-wy. Au здесь не дифтонг: a и u читаются раздельно, в два слога — «на-у-ко́-вы». В женском роде ударение там же." }
  - { kind: register, text: "Степеней сравнения нет: прилагательное относительное, как wojenny, narodowy, światowy и finansowy, отсюда одиннадцать форм. Регистр книжный и деловой; в разговоре о школьной учёбе naukowy не употребляют, там szkolny." }
collocations:
  - { pl: "praca naukowa", ru: "научная работа" }
  - { pl: "stopień naukowy", ru: "учёная степень" }
  - { pl: "badania naukowe", ru: "научные исследования" }
family:
  - { pl: "nauka", ru: "наука; учёба", relation: root, id: nauka }
  - { pl: "naukowiec", ru: "учёный", relation: derived, id: naukowiec }
  - { pl: "uczyć", ru: "учить", relation: root, id: uczyc }
etymology: "От nauka, а то — от na- плюс uczyć «учить», из праславянского *uk- — того же корня, что русские «учить», «наука», «навык», «привычка». Польское nauka сохранило оба смысла корня: и добывание знания, и его преподавание. Отсюда naukowiec, naukowo и popularnonaukowy."
memory: "naukowy — «научный». Но само nauka шире русской «науки»: оно значит ещё и УЧЁБУ — nauka w szkole, nauka jazdy «автошкола». Прилагательное при этом только научное; учебный — szkolny."
