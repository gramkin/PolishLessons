# review
id: gdzie
format: 2
lemma: "gdzie"
rank: 67
pos: adv
pron: { cyr: "гдзе" }
senses:
  - id: where-q
    ru: "где?; куда?"
    examples:
      - pl: "Gdzie?"
        ru: "Где?"
        source: { kind: tatoeba, id: 6160600 }
      - pl: "Gdzie byłaś?"
        ru: "Где ты была?"
        source: { kind: tatoeba, id: 1665928 }
      - pl: "Gdzie mieszkasz?"
        ru: "Где ты живёшь?"
        source: { kind: tatoeba, id: 353202 }
      - pl: "Gdzie pracujesz?"
        ru: "Где ты работаешь?"
        source: { kind: tatoeba, id: 553536 }
  - id: where-conj
    ru: "где (в придаточном)"
    examples:
      - pl: "Nie wiem, gdzie on jest."
        ru: "Я не знаю, где он."
        source: { kind: authored }
notes:
  - { kind: usage, text: "В разговорной речи gdzie покрывает и «куда»: Gdzie idziesz? «Куда ты идёшь?». Строгий вариант — dokąd." }
collocations:
  - { pl: "gdzie indziej", ru: "в другом месте" }
  - { pl: "gdzie bądź", ru: "где попало" }
etymology: "Праславянское *kъde — то же слово, что русское «где»; начальный звук озвончился в g-."
memory: "gdzie = «где», а в разговоре и «куда». Читается «гдзе»: dz здесь мягкое. Пара: tu «тут» — gdzie «где» — tam «там»."
idioms:
  - { pl: "gdzie diabeł mówi dobranoc", ru: "у чёрта на куличках" }
  - { pl: "gdzie drwa rąbią, tam wióry lecą", ru: "лес рубят — щепки летят" }
