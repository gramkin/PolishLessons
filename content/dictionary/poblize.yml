etymology: "Приставка po- и bliski «близкий», из праславянского *blizъ. Русское «поблизости» собрано ровно так же: «по» плюс «близ»."
memory: "pobliże живёт почти только в обороте w pobliżu «поблизости»: W pobliżu nikogo nie ma. С родительным — w pobliżu jeziora «рядом с озером». Собрано как русское «поблизости»: po плюс bliski."
idioms:
