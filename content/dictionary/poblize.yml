notes:
  - { kind: usage, text: "Слово живёт почти только в обороте w pobliżu «поблизости». Самостоятельным существительным оно практически не бывает." }
  - { kind: government, text: "w pobliżu czegoś «рядом с чем-то»: сам pobliże стоит в предложном, а зависимое слово в родительном — w pobliżu jeziora «рядом с озером»." }
  - { kind: usage, text: "Направление передаётся винительным w pobliże: Nie dopuszczaj dzieci w pobliże stawu «Не подпускай детей к пруду»." }
  - { kind: usage, text: "Синонимы — blisko «близко», niedaleko «недалеко», obok «рядом». Карточки blisko и bliski уже есть." }
collocations:
