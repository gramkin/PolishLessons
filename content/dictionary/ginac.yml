# review
id: ginac
format: 2
lemma: "ginąć"
rank: 2343
pos: verb
pron: { cyr: "ги́нонць" }
senses:
  - id: perish
    ru: "гибнуть, погибать"
    examples:
      - pl: "Ginęli tysiącami na froncie."
        ru: "Они гибли тысячами на фронте."
        source: { kind: authored }
      - pl: "Ludzie giną w wypadkach co dzień."
        ru: "Люди гибнут в авариях каждый день."
        source: { kind: authored }
  - id: disappear
    ru: "пропадать, исчезать"
    examples:
      - pl: "Rzeczy giną w tym domu bez śladu."
        ru: "Вещи в этом доме пропадают без следа."
        source: { kind: authored }
      - pl: "Ginie mi czas na drobiazgi."
        ru: "У меня пропадает время на мелочи."
        source: { kind: authored }
  - id: be-lost-in
    ru: "теряться (в толпе, из виду)"
    examples:
      - pl: "Ginie w tłumie, taki jest niepozorny."
        ru: "Он теряется в толпе, такой неприметный."
        source: { kind: authored }
notes:
  - { kind: usage, text: "ЭТО ТОТ ГЛАГОЛ, ОТ КОТОРОГО ОБРАЗОВАНЫ ZGINĄĆ И ZAGINĄĆ — И ПРИСТАВКА РЕШАЕТ ВСЁ. Сам ginąć несовершенный и покрывает оба смысла: и гибнуть, и пропадать. Приставка z- даёт zginąć «ПОГИБНУТЬ», приставка za- даёт zaginąć «ПРОПАСТЬ БЕЗ ВЕСТИ». Отсюда и причастие zaginiony «пропавший», которое ни в коем случае не значит «погибший»." }
  - { kind: pronunciation, text: "ЧЕРЕДОВАНИЕ Ą И Ę В ПРОШЕДШЕМ ВРЕМЕНИ, КАК У ВСЕХ ГЛАГОЛОВ НА -NĄĆ. Мужской род единственного числа берёт ą: ginął. Все остальные формы берут ę: ginęła, ginęło, ginęli, ginęły. То же самое уже было у uniknąć и zacząć. Носовое ą перед ć звучит как «он»: «ги́нонць»." }
  - { kind: false-friend, text: "Корень тот же, что в русском «ГИБНУТЬ»: праславянское *gybnǫti. Русские «погибнуть», «сгинуть», «погибель» — ближайшая родня. Расходится вид: русское «гибнуть» тоже несовершенное, но у поляков от этого корня выросла целая приставочная система, где каждая приставка меняет смысл заметнее, чем в русском." }
  - { kind: government, text: "Гибнут ОТ чего — z с родительным или od z родительным: ginąć z głodu «умирать с голоду», ginąć od kul «гибнуть от пуль». ГДЕ — w с предложным: ginąć w tłumie, w wypadku. Глагол непереходный, поэтому страдательных причастий у него нет вовсе; в таблице их и не найти." }
collocations:
  - { pl: "ginąć z głodu", ru: "умирать с голоду" }
  - { pl: "ginąć w tłumie", ru: "теряться в толпе" }
  - { pl: "gatunki ginące", ru: "исчезающие виды" }
family:
  - { pl: "zginąć", ru: "погибнуть", relation: aspect, id: zginac }
  - { pl: "zaginąć", ru: "пропасть без вести", relation: derived, id: zaginac }
  - { pl: "zaginiony", ru: "пропавший без вести", relation: derived, id: zaginiony }
  - { pl: "przepadać", ru: "пропадать", relation: derived }
etymology: "Из праславянского *gybnǫti «гибнуть, пропадать» — того же корня, что русские «гибнуть», «погибель», «сгинуть». Корень связывают с *gъb- «гнуться»: гибнущее сгибается и падает. Отсюда zginąć, zaginąć, zguba «пропажа», pogrzeb и zgubić «потерять»."
memory: "ginąć — «гибнуть» и «пропадать» разом, корень тот же, что в русском «гибнуть». Приставка решает: zginąć «погибнуть», zaginąć «пропасть без вести». И чередование: ginął с ą, но ginęła с ę."
idioms:
