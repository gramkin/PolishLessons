# review
id: zabawic
format: 2
lemma: "zabawić"
rank: 2009
pos: verb
pron: { cyr: "заба́виць" }
senses:
  - id: amuse
    ru: "развлечь, позабавить"
    examples:
      - pl: "Zabawił gości opowieściami z podróży."
        ru: "Он развлёк гостей рассказами из путешествий."
        source: { kind: authored }
      - pl: "Ta historia zabawiła nawet najmłodszych."
        ru: "Эта история позабавила даже самых младших."
        source: { kind: authored }
      - pl: "Zabawieni goście nie chcieli wychodzić."
        ru: "Развлечённые гости не хотели уходить."
        source: { kind: authored }
  - id: have-fun
    ru: "zabawić się — повеселиться, поразвлечься"
    examples:
      - pl: "Zabawili się do rana."
        ru: "Они веселились до утра."
        source: { kind: authored }
      - pl: "Zabaw się dobrze na weselu."
        ru: "Хорошо повеселись на свадьбе."
        source: { kind: authored }
  - id: stay-a-while
    ru: "пробыть, задержаться (недолго)"
    examples:
      - pl: "Zabawił u nas tylko tydzień."
        ru: "Он пробыл у нас всего неделю."
        source: { kind: authored }
      - pl: "Nie zabawię długo, mam pociąg."
        ru: "Я недолго задержусь, у меня поезд."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "КОРЕНЬ ЕСТЬ В РУССКОМ, НО СЕМЬЯ У НЕГО СОВСЕМ ДРУГАЯ. Zabawić отвечает русскому «забавить», однако в польском это гнездо несёт всю повседневную лексику игры и веселья: bawić się значит просто «ИГРАТЬ» (dzieci się bawią «дети играют»), zabawa — «вечеринка, танцы» или «игра», zabawka — «ИГРУШКА». Русская «забава» рядом с этим звучит старомодно, а «игрушка» и «играть» идут от других корней." }
  - { kind: government, text: "Развлекают КОГО — винительный: zabawić gości, dzieci, publiczność. Чем — творительный без предлога: zabawić kogoś opowieścią, anegdotą. Возвратное zabawić się значит «повеселиться» и дополнения не требует. Третье значение, «пробыть», идёт с местом: zabawić u kogoś, zabawić w mieście." }
  - { kind: usage, text: "Вид совершенный, несовершенная пара — bawić. Пожелание Dobrej zabawy! значит «Хорошо провести время!» и говорится перед любым праздником. Обиходное bawić się dobrze — «хорошо проводить время»: dobrze się bawiliśmy «мы хорошо провели время»." }
  - { kind: register, text: "Третье значение, «пробыть, задержаться», звучит слегка книжно: zabawił u nas tydzień. В живой речи чаще скажут zostać или pobyć. Зато оно постоянно встречается в литературе и в письмах, поэтому узнавать его стоит." }
collocations:
  - { pl: "zabawić gości", ru: "развлечь гостей" }
  - { pl: "dobrej zabawy", ru: "хорошо повеселиться!" }
  - { pl: "zabawić się do rana", ru: "веселиться до утра" }
family:
  - { pl: "bawić", ru: "развлекать; играть", relation: aspect, id: bawic }
  - { pl: "zabawa", ru: "игра; вечеринка", relation: root, id: zabawa }
  - { pl: "zabawka", ru: "игрушка", relation: derived, id: zabawka }
etymology: "Приставка za- плюс bawić, от общеславянского корня, давшего и русское «забавить», «забава». В польском это гнездо заняло всю область игры и веселья: bawić się «играть», zabawa «вечеринка», zabawka «игрушка». В русском корень остался при одной «забаве», а «играть» и «игрушка» пошли от другого."
memory: "zabawić — «развлечь, позабавить», корень как в «забаве». Но запомните всю семью: bawić się это «ИГРАТЬ», zabawa — «вечеринка», zabawka — «игрушка». И пожелание Dobrej zabawy! — «хорошо провести время»."
idioms:
  - { pl: "dobrej zabawy", ru: "хорошо повеселиться!" }
  - { pl: "zabawić się czyimś kosztem", ru: "позабавиться за чей-л. счёт" }
