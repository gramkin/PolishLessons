notes:
  - { kind: usage, text: "Приставка na- означает здесь «много, в количестве», и русский делает то же самое той же приставкой: NAROBIĆ — «наделать». Образец продуктивный в обоих языках: NAROBIĆ BAŁAGANU «наделать беспорядка», NAZBIERAĆ «набрать», NAKUPIĆ «накупить», NAGADAĆ «наговорить». Важно, что речь всегда о количестве, часто чрезмерном и обычно нежелательном: NAROBIĆ DŁUGÓW, HAŁASU, KŁOPOTÓW, WSTYDU. Просто «сделать» — это ZROBIĆ, без na-." }
  - { kind: government, text: "Главное в управлении: NAROBIĆ берёт родительный падеж, а не винительный. NAROBIĆ BAŁAGANU, HAŁASU, DŁUGÓW, KŁOPOTÓW — везде родительный, потому что речь о неопределённом количестве. Русский делает ровно то же: «наделать беспорядка, шуму, долгов». Сравните с ZROBIĆ COŚ в винительном — ZROBIĆ OBIAD «приготовить обед». То есть приставка меняет не только смысл, но и падеж дополнения, и в двух языках одинаково. Кому наделали — дательный: NAROBIŁA MU WSTYDU." }
  - { kind: pronunciation, text: "Повелительное NARÓB показывает удлинение гласной в закрытом слоге. Берём третье лицо NAROBI, отбрасываем -i, остаётся NAROB — и слог закрывается, а o переходит в ó: NARÓB, NARÓBMY, NARÓBCIE. Та же мена, что в ROBI при RÓB, в PRZEŁOŻY при PRZEŁÓŻ и в PODWIOZŁA при PODWIÓZŁ. А во всех формах, где за b идёт гласная, стоит обычное o: NAROBIŁ, NAROBIONY, NAROBIĘ." }
  - { kind: usage, text: "Пятьдесят три формы — совершенный переходный: сорок одна основная, одиннадцать страдательных причастий и деепричастие NAROBIWSZY. Страдательное причастие NAROBIONY в живой речи встречается редко, потому что дополнение у глагола обычно стоит в родительном, а страдательному залогу нужен винительный; зато безличное NAROBIONO вполне обычно: NAROBIONO DŁUGÓW. Мужская личная форма множественного — NAROBIENI с e при NAROBIONY с o, по правилу причастий на -ony из карточки KARMIĆ." }
