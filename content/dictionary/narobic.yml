etymology: "Приставка na- со значением количества и ROBIĆ «делать», из праславянского *robiti, того же корня, что русские «работа», «раб», «робить». Соответствие с русским полное и по частям, и по управлению: NAROBIĆ BAŁAGANU стоит ровно как «наделать беспорядка», с родительным падежом в обоих языках. Из гнезда вышли ROBOTA «тяжёлая работа», ROBOTNIK «рабочий», ZROBIĆ «сделать», WYROBIĆ «выработать», PRZEROBIĆ «переделать»."
memory: "na- значит «много», как в «наделать», и падеж тот же — родительный: narobić bałaganu. А повелительное — narób, с ó в закрытом слоге."
