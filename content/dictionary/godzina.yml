notes:
  - { kind: usage, text: "Która godzina? — «Который час?»; O której godzinie? — «Во сколько?»; za godzinę — «через час»." }
  - { kind: usage, text: "godzina szczytu — «час пик»; godzina policyjna — «комендантский час»; czarna godzina — «чёрный день»." }
collocations:
  - { pl: "która godzina?", ru: "который час?" }
  - { pl: "za godzinę", ru: "через час" }
  - { pl: "pół godziny", ru: "полчаса" }
  - { pl: "godzinami", ru: "часами" }
etymology: "Праславянское *godina «время, пора»; русское «година» — то же слово, но значение разошлось: по-польски это обычный «час»."
memory: "Która godzina? — «Который час?», o której godzinie — «во сколько», za godzinę — «через час». Русская «година» — тот же корень, но другое значение."
idioms:
  - { pl: "godzina szczytu", ru: "час пик" }
  - { pl: "czarna godzina", ru: "чёрный день" }
  - { pl: "godzina policyjna", ru: "комендантский час" }
