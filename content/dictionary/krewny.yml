notes:
  - { kind: usage, text: "Слово склоняется как прилагательное, а работает как существительное: mój KREWNY «мой родственник», KREWNI «родственники», KREWNA «родственница». Словари помечают мужские личные формы сразу двумя разрядами, и прилагательным, и существительным. Таких слов в польском целая группа: CHORY «больной», DOROSŁY «взрослый», UCZONY «учёный», ZNAJOMY «знакомый». Русский поступает с теми же самыми словами точно так же, поэтому здесь ничего не нужно переучивать." }
  - { kind: usage, text: "Форм одиннадцать, степеней сравнения нет, и причина опять новая. У fizyczny их нет потому, что он относит к разряду; у mokry — потому что синтетические просто не сложились; у zagubiony — потому что это причастие. Здесь дело в родстве: родственником либо являешься, либо нет, более родственным не бываешь. Для сравнения, przyjemny из этой же подборки имеет все тридцать три." }
collocations:
  - { pl: "bliski krewny", ru: "близкий родственник" }
  - { pl: "daleki krewny", ru: "дальний родственник" }
  - { pl: "krewni i znajomi", ru: "родственники и знакомые" }
family:
  - { pl: "krew", ru: "кровь", relation: root, id: krew }
  - { pl: "pokrewny", ru: "родственный", relation: derived }
  - { pl: "krewniak", ru: "родич", relation: derived }
etymology: "От KREW «кровь», из праславянского *krъvь — то же слово, что русская «кровь». Польский назвал родство по крови, а русский выбрал другой корень и построил «родственника» от «рода». Мысль при этом одна, и в польском она сохранилась открыто: pokrewny, krewniak, spokrewniony — всё это о кровной связи."
memory: "Склоняется как прилагательное, а значит «родственник» — как наши «больной» и «взрослый». И степеней нет: родственником бывают, а не бывают более."
idioms:
