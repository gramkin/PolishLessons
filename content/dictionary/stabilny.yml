# review
id: stabilny
format: 2
lemma: "stabilny"
rank: 3996
pos: adj
pron: { cyr: "стаби́льны" }
senses:
  - id: stable
    ru: "стабильный, устойчивый"
    examples:
      - pl: "Stan pacjenta jest stabilny."
        ru: "Состояние пациента стабильное."
        source: { kind: authored }
      - pl: "Szuka stabilnej pracy."
        ru: "Он ищет стабильную работу."
        source: { kind: authored }
      - pl: "Złoty jest dziś stabilniejszy niż kiedyś."
        ru: "Злотый сегодня стабильнее, чем раньше."
        source: { kind: authored }
  - id: steady
    ru: "надёжный, прочный (о конструкции, человеке)"
    examples:
      - pl: "Ta drabina nie jest stabilna."
        ru: "Эта лестница неустойчивая."
        source: { kind: authored }
      - pl: "Potrzebuje stabilnego partnera."
        ru: "Ей нужен надёжный партнёр."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Совпадение с русским «стабильный» полное, но польское слово шире в быту: о стуле, лестнице, столе поляк скажет STABILNY там, где русский скажет «устойчивый»: STABILNY STÓŁ. В медицине STAN STABILNY — «состояние стабильное», как и по-русски." }
  - { kind: usage, text: "Полная парадигма: STABILNY, STABILNIEJSZY, NAJSTABILNIEJSZY. Все степени живые: STABILNIEJSZA SYTUACJA, NAJSTABILNIEJSZA WALUTA. Форма для мужчин-людей во всех трёх: STABILNI, STABILNIEJSI, NAJSTABILNIEJSI." }
  - { kind: government, text: "Стабильный в чём-то — STABILNY W + местный: STABILNY W UCZUCIACH. В сравнении — NIŻ или OD с родительным. Падежных требований само прилагательное не имеет." }
  - { kind: pronunciation, text: "Читается «стаби́льны», три слога, ударение на предпоследнем. BI — мягкое «би», L перед N мягкая. В STABILNIEJSZY: «стабильне́йшы»." }
  - { kind: register, text: "Нейтральное слово, частое в экономике, медицине и в разговоре о личной жизни: STABILNY ZWIĄZEK, «прочные отношения», STABILNA SYTUACJA FINANSOWA. В объявлениях о работе STABILNE ZATRUDNIENIE — главная приманка." }
collocations:
  - { pl: "stan stabilny", ru: "стабильное состояние" }
  - { pl: "stabilna praca", ru: "стабильная работа" }
  - { pl: "stabilny związek", ru: "прочные отношения" }
family:
  - { pl: "stabilność", ru: "стабильность", relation: derived }
  - { pl: "niestabilny", ru: "нестабильный", relation: derived }
  - { pl: "stały", ru: "постоянный", relation: root, id: staly }
etymology: "Из латинского stabilis, «устойчивый», от stare «стоять». Тот же корень в польском STAĆ, «стоять», и в русском «стоять», «стабильный» — общий индоевропейский корень. Польский взял латинское слово через немецкий или французский и оформил суффиксом -NY."
memory: "Stabilny — стабильный, устойчивый: stan stabilny, stabilna praca, stabilny stół. Stabilniejszy, najstabilniejszy. Читается «стаби́льны»."
idioms:
  - { pl: "stan stabilny", ru: "стабильное состояние (о пациенте)" }
