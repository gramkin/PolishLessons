# review
id: film
format: 2
lemma: "film"
rank: 397
pos: noun
pron: { cyr: "фильм" }
senses:
  - id: movie
    ru: "фильм"
    examples:
      - pl: "Ona ogląda film."
        ru: "Она смотрит фильм."
        source: { kind: tatoeba, id: 10798873 }
      - pl: "Znasz film Avatar?"
        ru: "Знаешь фильм «Аватар»?"
        source: { kind: tatoeba, id: 4942123 }
      - pl: "Ten film mnie poruszył."
        ru: "Я был поражён этим фильмом."
        source: { kind: tatoeba, id: 700918 }
  - id: cinema
    ru: "кино (как искусство и как жанр)"
    examples:
      - pl: "Bardzo lubię filmy."
        ru: "Я обожаю кино."
        source: { kind: tatoeba, id: 590547 }
      - pl: "Lubi pan filmy SF?"
        ru: "Вам нравятся научно-фантастические фильмы?"
        source: { kind: tatoeba, id: 351543 }
      - pl: "Interesuje się filmem od dziecka."
        ru: "Он интересуется кино с детства."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Прямое заимствование из английского, склоняется как обычное существительное мужского рода: film, filmu, w filmie." }
  - { kind: false-friend, text: "film значит и «фильм», и «фотоплёнка»: Czy używałeś filmu? — «Ты пользовался плёнкой?»" }
  - { kind: usage, text: "czeski film — «чешский фильм», идиома о полной неразберихе: «никто ничего не знает»." }
  - { kind: usage, text: "film się urwał — «плёнку оборвало», о провале в памяти после выпивки." }
collocations:
  - { pl: "oglądać film", ru: "смотреть фильм" }
  - { pl: "film dokumentalny", ru: "документальный фильм" }
  - { pl: "iść na film", ru: "идти на фильм" }
  - { pl: "czeski film", ru: "полная неразбериха" }
etymology: "Из английского film «плёнка». Слово пришло в польский вместе с кинематографом и сохранило оба значения оригинала."
memory: "film — «фильм», прямое заимствование, так что учить надо только склонение: film, filmu, w filmie. Зато две идиомы стоят внимания: czeski film — «полная неразбериха», а film się urwał — «плёнку оборвало», то есть провал в памяти."
idioms:
  - { pl: "czeski film", ru: "полная неразбериха" }
  - { pl: "film się urwał", ru: "память отшибло" }
  - { pl: "film z żółtymi napisami", ru: "фильм с жёлтыми субтитрами, пиратская копия" }
