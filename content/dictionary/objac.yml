    ru: "Под амнистию попали несколько сотен заключённых."
    source: { kind: authored }
  - form: "objęty"
    pl: "Teren jest objęty ochroną."
    ru: "Территория под охраной."
    source: { kind: authored }
  - form: "objęty"
    pl: "Był objęty opieką od dziecka."
    ru: "Он был под опекой с детства."
    source: { kind: authored }
  - form: "objęty"
    pl: "Ten obszar jest objęty remontem."
    ru: "Этот участок охвачен ремонтом."
    source: { kind: authored }
  - form: "objętych"
    pl: "Nie dodawaj zdań ze źródeł objętych prawami autorskimi."
    ru: "Не добавляйте предложения из источников, защищённых авторским правом."
    source: { kind: tatoeba, id: 877682 }
  - form: "objętych"
    pl: "Unikamy terenów objętych konfliktem."
    ru: "Мы избегаем территорий, охваченных конфликтом."
    source: { kind: authored }
  - form: "objętych"
    pl: "Lista domów objętych remontem jest długa."
    ru: "Список домов, охваченных ремонтом, длинный."
    source: { kind: authored }
  - form: "objętym"
    pl: "W terenie objętym ochroną nie wolno budować."
    ru: "На территории под охраной строить нельзя."
    source: { kind: authored }
  - form: "objętym"
    pl: "Uczniom objętym programem przysługuje obiad."
    ru: "Ученикам, охваченным программой, полагается обед."
    source: { kind: authored }
  - form: "objętym"
    pl: "Z obszarem objętym remontem trzeba się liczyć."
    ru: "С участком, охваченным ремонтом, надо считаться."
    source: { kind: authored }
  - form: "objętymi"
    pl: "Zajmujemy się terenami objętymi ochroną."
    ru: "Мы занимаемся территориями под охраной."
    source: { kind: authored }
  - form: "objętymi"
    pl: "Między sprawami objętymi tajemnicą a jawnymi jest różnica."
    ru: "Между делами под грифом и открытыми есть разница."
    source: { kind: authored }
  - form: "objętymi"
    pl: "Z obszarami objętymi remontem bywa kłopot."
    ru: "С участками, охваченными ремонтом, бывают хлопоты."
    source: { kind: authored }
