# review
id: objac
format: 2
lemma: "objąć"
rank: 2007
pos: verb
aspect: perf
pron: { cyr: "о́бйонць" }
senses:
  - id: embrace
    ru: "обнять, заключить в объятия"
    examples:
      - pl: "Tomcio objął przytulankę."
        ru: "Том обнял чучело."
        source: { kind: tatoeba, id: 13781656 }
      - pl: "Objął ją ramieniem."
        ru: "Он обнял её за плечи."
        source: { kind: translated, id: 742514 }
      - pl: "Obejmij mnie."
        ru: "Обними меня."
        source: { kind: translated, id: 12232682 }
  - id: cover
    ru: "охватить, распространиться на"
    examples:
      - pl: "Pas deszczu, kierujący się na wschód, do końca dnia obejmie cały obszar."
        ru: "Полоса дождя, идущая на восток, к концу дня охватит весь район."
        source: { kind: translated, id: 6533104 }
  - id: assume
    ru: "занять (должность), принять (власть)"
    examples:
      - pl: "Bill był zbyt młody aby objąć stanowisko."
        ru: "Билл был слишком молод, чтобы занять эту должность."
        source: { kind: translated, id: 6156570 }
notes:
  - { kind: usage, text: "Совершенный вид; несовершенный — obejmować." }
  - { kind: government, text: "objąć kogoś ramieniem «обнять кого-л. за плечи»; objąć coś wzrokiem «охватить что-л. взглядом»." }
  - { kind: usage, text: "Очень частые обороты с должностью и властью: objąć stanowisko «занять должность», objąć władzę «взять власть»." }
  - { kind: false-friend, text: "Здесь языки родственны: objąć — то же самое, что русское «объять, обнять», от старого jąć «взять»." }
collocations:
  - { pl: "objąć stanowisko", ru: "занять должность" }
  - { pl: "objąć władzę", ru: "взять власть" }
  - { pl: "objąć kogoś ramieniem", ru: "обнять кого-л. за плечи" }
etymology: "ob- + jąć «взять» (старый глагол, ср. zająć «занять»). Русские «объять», «обнять», «взять» — тот же корень."
memory: "objąć = «обнять» и «объять» одновременно: корень тот же, что в русском. Отсюда и переносные значения — objąć stanowisko «занять должность», objąć władzę «взять власть». Несовершенный вид — obejmować."
idioms:
  - { pl: "objąć władzę", ru: "взять власть" }
  - { pl: "objąć stanowisko", ru: "занять должность" }
  - { pl: "objąć kogoś ramieniem", ru: "обнять кого-л. за плечи" }
