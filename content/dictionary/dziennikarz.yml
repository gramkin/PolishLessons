notes:
  - { kind: false-friend, text: "Слово нельзя вывести из русского «дневника», хотя корень именно он. Разгадка в том, что DZIENNIK по-польски значит ещё и «ежедневная газета», и профессия названа от газеты, а не от тетради: dziennikarz — тот, кто делает dziennik. Русский назвал ту же профессию от «журнала», слова французского, и получилось «журналист». Поэтому, зная только школьный «дневник», до журналиста не додуматься — нужно помнить газетное значение." }
  - { kind: usage, text: "Суффикс -ARZ делает названия занятий и в польском совершенно живой: PISARZ «писатель», MALARZ «художник», LEKARZ «врач», KUCHARZ «повар», OCHRONIARZ «охранник», GLINIARZ «полицейский». Русский родственный суффикс -арь остался в «пекаре», «вратаре» и «звонаре», но новых слов давно не делает, так что перед польским -arz русскому стоит ждать профессии, даже если корень незнаком." }
  - { kind: usage, text: "Слово мужское личное, и это задаёт весь набор. Множественное именительное — DZIENNIKARZE, родительный множественного — DZIENNIKARZY. Звательный и местный совпали в DZIENNIKARZU, что для мягкой основы обычно: PANIE DZIENNIKARZU — нормальное обращение. Любопытно, что форма DZIENNIKARZE служит ещё и уничижительной — той категорией, которой в русском нет вовсе; у wuj она отдельная (wujowie обычная, wuje уничижительная), а здесь обе совпали в одном написании, и различить их можно только по тону." }
