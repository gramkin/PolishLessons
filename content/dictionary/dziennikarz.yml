etymology: "От DZIENNIK в значении «ежедневная газета», а оно — от DZIEŃ «день», из праславянского *dьnь. Суффикс -arz, которым сделано слово, пришёл из немецкого -er через латинское -arius и прижился в польском как главный способ назвать занятие: pisarz, malarz, lekarz, kucharz. Русский тот же суффикс знает как -арь, но профессию газетчика назвал иначе — от «журнала», через французское journal, которое само значит «дневной». Так что оба языка пришли к «дневному» корню, только разными дорогами."
memory: "От dziennik в значении «газета», а не «дневник»: отсюда «журналист». Суффикс -arz — живой указатель профессии: pisarz, lekarz, kucharz."
