# review
id: kilkanascie
format: 2
lemma: "kilkanaście"
rank: 5838
pos: num
pron: { cyr: "килькана́сьце" }
senses:
  - id: a-dozen-or-so
    ru: "больше десяти, десяток с лишним (от 11 до 19; + родительный падеж)"
    examples:
      - pl: "Stonoga, wbrew nazwie, ma zaledwie kilkanaście par odnóży."
        ru: "У многоножки, вопреки названию, всего десятка полтора пар ног."
        source: { kind: translated, id: 6155691 }
      - pl: "Na targu kupiłam kilkanaście jajek."
        ru: "На рынке я купила десятка полтора яиц."
        source: { kind: authored }
      - pl: "Na zebranie przyszło kilkunastu rodziców."
        ru: "На собрание пришло больше десятка родителей."
        source: { kind: authored }
  - id: time
    ru: "десяток с лишним (минут, лет, раз)"
    examples:
      - pl: "Czekałem na ciebie kilkanaście minut."
        ru: "Я ждал тебя минут пятнадцать."
        source: { kind: authored }
      - pl: "Mieszkam tu od kilkunastu lat."
        ru: "Я живу здесь уже больше десяти лет."
        source: { kind: authored }
      - pl: "Dzwoniłem do niej kilkanaście razy."
        ru: "Я звонил ей больше десяти раз."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "В русском такого числительного нет: KILKANAŚCIE — это «несколько» плюс «-надцать», то есть любое число от одиннадцати до девятнадцати. Переводят «десяток с лишним», «больше десяти», «десятка полтора»." }
  - { kind: government, text: "Как KILKA, требует родительного множественного: KILKANAŚCIE DNI. Глагол в прошедшем — средний род единственного числа: PRZYSZŁO KILKANAŚCIE OSÓB «пришло больше десяти человек»." }
  - { kind: usage, text: "Косвенные падежи — KILKUNASTU, творительный — KILKUNASTOMA (или KILKUNASTU). KILKUNASTU — ещё и счёт мужчин: KILKUNASTU MĘŻCZYZN. Для детей и смешанных групп — собирательное KILKANAŚCIORO. KILKUNASTO- — первая часть сложных слов: KILKUNASTOLETNI." }
  - { kind: pronunciation, text: "Читается «килькана́сьце»: перед согласной L мягкое, «ль»; ŚCIE — «сьце». Ударение, как у всех числительных на -NAŚCIE, на предпоследнем слоге. KILKUNASTU — «килькуна́сту»." }
collocations:
  - { pl: "kilkanaście lat", ru: "больше десяти лет" }
  - { pl: "od kilkunastu dni", ru: "уже больше десяти дней" }
  - { pl: "przed kilkunastoma laty", ru: "лет пятнадцать назад" }
  - { pl: "kilkanaście razy", ru: "больше десяти раз" }
family:
  - { pl: "kilka", ru: "несколько", relation: root, id: kilka }
  - { pl: "kilkadziesiąt", ru: "несколько десятков", relation: root }
  - { pl: "kilkunastoletni", ru: "лет пятнадцати, подростковый", relation: derived }
  - { pl: "nastolatek", ru: "подросток", relation: root, id: nastolatek }
synonyms: ["paręnaście"]
etymology: "Из KILKA «несколько» и -NAŚCIE, как в JEDENAŚCIE и DWANAŚCIE; -NAŚCIE восходит к праславянскому *na desęte «на десяти», как русское «-надцать»."
memory: "Kilkanaście — «несколько-надцать»: больше десяти, но меньше двадцати. По-русски — «десяток с лишним». О мужчинах — kilkunastu, о детях — kilkanaścioro."
idioms:
  - { pl: "przed kilkunastoma laty", ru: "лет пятнадцать тому назад" }
formExamplesSkip:
  - { form: "kilkunasto", reason: "не самостоятельная форма, а первая часть сложных слов: KILKUNASTOLETNI" }
