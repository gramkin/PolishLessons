# review
id: nacisnac
format: 2
lemma: "nacisnąć"
rank: 4160
pos: verb
pron: { cyr: "наци́снонць" }
senses:
  - id: press
    ru: "нажать"
    examples:
      - pl: "Naciśnij zielony przycisk."
        ru: "Нажми зелёную кнопку."
        source: { kind: authored }
      - pl: "Nacisnął klamkę i wszedł."
        ru: "Он нажал на ручку и вошёл."
        source: { kind: authored }
      - pl: "Nacisnęła hamulec w ostatniej chwili."
        ru: "Она нажала на тормоз в последний момент."
        source: { kind: authored }
  - id: pressure
    ru: "надавить, оказать давление (на кого-то)"
    examples:
      - pl: "Trzeba na niego nacisnąć, bo nic nie zrobi."
        ru: "Надо на него надавить, иначе он ничего не сделает."
        source: { kind: authored }
      - pl: "Związki nacisnęły na rząd."
        ru: "Профсоюзы надавили на правительство."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "NACISNĄĆ — «нажать», но в отличие от русского глагол часто управляет винительным без предлога: NACISNĄĆ PRZYCISK, KLAMKĘ, HAMULEC, где по-русски «нажать на». С предлогом NA — о давлении на человека: NACISNĄĆ NA SZEFA. Не путать с CISNĄĆ — «давить, жать» об обуви: BUTY MNIE CISNĄ." }
  - { kind: usage, text: "Пятьдесят три формы — подпись переходного глагола совершенного вида: страдательное NACIŚNIĘTY и деепричастие NACISNĄWSZY. Чередование S → Ś: NACISNĄĆ, NACISNĄŁ, но NACIŚNIE, NACIŚNIJ. Видовой партнёр — NACISKAĆ: NACISKAĆ NA KOGOŚ, «давить на кого-то»." }
  - { kind: government, text: "Что нажать — винительный: NACISNĄĆ GUZIK, SPUST, ENTER. На кого надавить — NA с винительным: NACISNĄĆ NA ZARZĄD. Чем — творительный: NACISNĄĆ PALCEM, STOPĄ." }
  - { kind: pronunciation, text: "Читается «наци́снонць», три слога, ударение на предпоследнем. CI — «ци», Ą перед Ć — носовое «он». NACIŚNIJ — «наци́сьний» с мягким «сь», а в NACISNĘŁA S твёрдое: «нациснэ́уа»." }
  - { kind: register, text: "Нейтральное бытовое и техническое слово инструкций: NACIŚNIJ ENTER, NACIŚNIJ I PRZYTRZYMAJ. Значение «надавить на человека» — разговорное и политическое: NACISKI — «давление, нажим»." }
collocations:
  - { pl: "nacisnąć przycisk", ru: "нажать кнопку" }
  - { pl: "nacisnąć hamulec", ru: "нажать на тормоз" }
  - { pl: "nacisnąć na kogoś", ru: "надавить на кого-то" }
family:
  - { pl: "naciskać", ru: "нажимать; давить", relation: aspect, id: naciskac }
  - { pl: "nacisk", ru: "нажим, давление", relation: derived, id: nacisk }
  - { pl: "cisnąć", ru: "давить, жать; швырнуть", relation: root }
etymology: "Приставка NA- плюс CISNĄĆ «давить, жать», праславянское *tiskati, то же, что русское «тискать», «стиснуть». Польское CI на месте русского «ти» — обычное смягчение T перед I."
memory: "Nacisnąć — нажать: nacisnąć przycisk, hamulec (без «на»!). Nacisnąć na kogoś — надавить на человека. Naciśnij — с Ś. Nacisk — давление. Читается «наци́снонць»."
idioms:
  - { pl: "nacisnąć na gaz", ru: "дать газу" }
