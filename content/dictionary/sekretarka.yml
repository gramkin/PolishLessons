etymology: "От SEKRETARZ, а тот — из средневекового латинского SECRETARIUS «тот, кому доверены тайны», от SECRETUM «тайна» и далее от SECERNERE «отделять, откладывать в сторону». Исходно это был доверенный писец при особе, знавший то, что не предназначалось другим, и русское «секретарь» прошло тот же путь через латынь и немецкий. Польский добавил к заимствованию свой суффикс -KA и получил женскую форму, а заодно, по другой линии того же суффикса, название машины. Корень виден и в польском SEKRET, и в SEKRETNY, и в русских «секрет», «секретный», «секреция» — последнее уже прямо от «отделять», в медицинском смысле."
memory: "Два значения от одного суффикса: -arka делает и женщин по профессии (pisarka, lekarka), и машины по действию (drukarka, suszarka) — отсюда и секретарша, и автоответчик. Nagraj się na sekretarkę может только автоответчик. В дательном и местном k переходит в c: sekretarce. От латинского secretum «тайна»: тот, кому доверены тайны."
