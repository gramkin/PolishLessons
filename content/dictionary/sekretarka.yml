notes:
  - { kind: usage, text: "Два значения слова объясняются одним суффиксом, и это главная мысль карточки. Суффикс -ARKA в польском делает две вещи: образует название женщины по занятию и название машины по действию. Женщины: SEKRETARZ и SEKRETARKA, PISARZ и PISARKA, LEKARZ и LEKARKA. Машины: DRUKARKA «принтер», KOSIARKA «газонокосилка», SUSZARKA «фен», ZMYWARKA «посудомоечная машина». Автоответчик попал во второй разряд — это «машина, которая секретарит», — и поэтому SEKRETARKA означает и человека, и устройство. Контекст различает их без труда: NAGRAĆ SIĘ NA SEKRETARKĘ может только автоответчик." }
  - { kind: pronunciation, text: "Читается «сэкрэта́рка», ударение на предпоследнем слоге. Оба E звучат «э» и не смягчают согласных: «сэ-крэ-», а не «се-кре-». В дательном и местном падеже SEKRETARCE согласная K переходит в C: «сэкрэта́рце». Это то же чередование, что в PANIKA и PANICE, PIGUŁKA и PIGUŁCE, и в этой же партии оно встречается ещё раз. Родительный множественного SEKRETAREK получает вставную гласную E между R и K, как DESKA и DESEK." }
  - { kind: register, text: "Русское «секретарша» звучит слегка пренебрежительно, а польское SEKRETARKA совершенно нейтрально и является официальным названием должности: так напишут в объявлении о работе и в штатном расписании. Поэтому переводить его русским «секретаршей» стоит осторожно, лучше «секретарь» или «помощник». Мужская форма SEKRETARZ при этом означает не только помощника, но и высокую должность: SEKRETARZ STANU «госсекретарь», SEKRETARZ GENERALNY. Эта асимметрия между SEKRETARZ и SEKRETARKA в польском заметна и обсуждается, но названия должностей пока держатся." }
  - { kind: government, text: "Женский род на -A, склонение правильное. Винительный на -Ę: ZNAM SEKRETARKĘ. Сообщение оставляют NA SEKRETARKĘ, с винительным, потому что здесь движение «на» носитель: NAGRAJ SIĘ NA SEKRETARKĘ. А то, что на автоответчике уже есть, стоит в местном: NA SEKRETARCE BYŁY WIADOMOŚCI. Договорённость с человеком — предлог Z с творительным: UMÓW SIĘ Z SEKRETARKĄ. При отрицании винительный уходит в родительный: NIE ZNAM SEKRETARKI." }
