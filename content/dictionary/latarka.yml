notes:
  - { kind: false-friend, text: "LATARKA — ручной «фонарик». LATARNIA — большой фонарь: LATARNIA ULICZNA — «уличный фонарь», LATARNIA MORSKA — «маяк». Русское «фонарь» другого происхождения, а польские слова восходят к латинскому названию светильника, как и итальянское «лантерна»." }
  - { kind: usage, text: "Девять форм, женский род. Перед E K переходит в C: W LATARCE. Родительный множественного — LATAREK, с беглым E. Звательного падежа у вещи нет." }
  - { kind: government, text: "Посветить фонариком — POŚWIECIĆ LATARKĄ, творительный без предлога. Светить в глаза — ŚWIECIĆ W OCZY, W с винительным. Батарейки для фонарика — BATERIE DO LATARKI, DO с родительным." }
  - { kind: pronunciation, text: "Читается «лата́рка», ударение на предпоследнем слоге. L перед A твёрдое, как в LATARNIA «лата́рня»." }
  - { kind: register, text: "Обиходное слово. Налобный фонарик туристов и шахтёров — LATARKA CZOŁOWA, от CZOŁO «лоб»." }
collocations:
  - { pl: "latarka czołowa", ru: "налобный фонарик" }
  - { pl: "włączyć latarkę", ru: "включить фонарик" }
  - { pl: "baterie do latarki", ru: "батарейки для фонарика" }
family:
  - { pl: "latarnia", ru: "фонарь; маяк", relation: root, id: latarnia }
  - { pl: "latarnik", ru: "смотритель маяка; фонарщик", relation: root }
  - { pl: "latarenka", ru: "фонарик, фонарёк", relation: root }
etymology: "Уменьшительное от LATARNIA «фонарь», которое пришло из латинского LATERNA через немецкий и чешский. Суффикс -KA делает из большого фонаря маленький ручной."
memory: "Latarka — фонарик; latarnia — фонарь, latarnia morska — маяк. Читается «лата́рка». Poświecić latarką — посветить фонариком."
idioms:
