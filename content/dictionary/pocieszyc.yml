      - pl: "Pocieszę cię: jutro będzie słońce."
        ru: "Я тебя обрадую: завтра будет солнце."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "POCIESZYĆ — от CIESZYĆ, «радовать», и русскому «потешить» родственно: «потеха», «утешить» — тот же корень. Но польское POCIESZYĆ — именно «утешить», а не «позабавить». Позабавить — ROZBAWIĆ. POCIESZYĆ SIĘ — «утешиться»: POCIESZYŁ SIĘ MYŚLĄ O URLOPIE, «утешился мыслью об отпуске»." }
  - { kind: usage, text: "Пятьдесят три формы — подпись переходного глагола совершенного вида: страдательное причастие POCIESZONY, «утешенный», и деепричастие POCIESZYWSZY. Видовой партнёр — POCIESZAĆ: POCIESZAŁA GO CAŁĄ NOC. Существительное POCIESZENIE — «утешение»: NAGRODA POCIESZENIA, «утешительный приз»." }
  - { kind: government, text: "Кого — винительный: POCIESZYĆ PRZYJACIELA. Чем — творительный без предлога: POCIESZYĆ KOGOŚ SŁOWEM, UŚMIECHEM. В возвратной форме — чем утешиться: POCIESZYĆ SIĘ CZEKOLADĄ. Слабое утешение — MARNE POCIESZENIE." }
  - { kind: pronunciation, text: "Читается «поце́шыць», три слога, ударение на предпоследнем. CIE — мягкое «це», SZ твёрдое: «шы», а не «ши». Конечное Ć — мягкое «ць». POCIESZ — «по́цеш»." }
  - { kind: register, text: "Нейтральный глагол, частый в быту. Устойчивые формулы: TO MNIE POCIESZA — «это меня утешает», NA POCIESZENIE — «в утешение», JEDYNE POCIESZENIE — «единственное утешение». В шутку: POCIESZ SIĘ, ŻE MOGŁO BYĆ GORZEJ — «утешься тем, что могло быть хуже»." }
collocations:
  - { pl: "pocieszyć przyjaciela", ru: "утешить друга" }
  - { pl: "na pocieszenie", ru: "в утешение" }
  - { pl: "marne pocieszenie", ru: "слабое утешение" }
family:
  - { pl: "pocieszac", ru: "утешать", relation: aspect }
  - { pl: "cieszyć", ru: "радовать", relation: root, id: cieszyc }
  - { pl: "pociecha", ru: "утешение, отрада", relation: derived }
etymology: "Приставка PO- плюс CIESZYĆ «радовать», от праславянского *těšiti, того же, что русское «тешить», «утешить», «потеха». Польское CIE- на месте русского «те-» — регулярное смягчение T перед старым Ě."
memory: "Pocieszyć — утешить: pocieszyć przyjaciela, pocieszyć słowem. Корень как в «тешить», «утешить». Na pocieszenie — в утешение. Несовершенный — pocieszać. Читается «поце́шыць»."
idioms:
  - { pl: "nagroda pocieszenia", ru: "утешительный приз" }
