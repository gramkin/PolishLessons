notes:
  - { kind: false-friend, text: "Корень тот же, что в русском «пламени», но род другой, и это меняет каждое согласование. Польское PŁOMIEŃ — мужского рода: TEN PŁOMIEŃ, GORĄCY PŁOMIEŃ, PŁOMIEŃ ZGASŁ. Русское «пламя» среднего: «это пламя», «пламя погасло». Поэтому прилагательные и глаголы в прошедшем времени в двух языках расходятся во всех формах, и ошибка слышна сразу. Второе различие: у русского «пламени» нет обычного множественного, а польское PŁOMIENIE употребляется свободно — о нескольких языках огня. Третье: PŁOMIEŃ не значит «пламень» как высокий стиль, это обычное бытовое слово." }
  - { kind: usage, text: "Десять форм, мужской род, мягкая основа на -Ń. В парадигме стоят две формы, которые различаются только последней гласной, и путать их нельзя: PŁOMIENIA — родительный единственного («пламени» одного огня), а PŁOMIENI — родительный множественного («пламён», нескольких огней). Дательный единственного — PŁOMIENIOWI, местный — PŁOMIENIU, именительный множественного — PŁOMIENIE. Мягкость основы сохраняется во всех косвенных формах, и потому слогов становится на один больше: PŁOMIEŃ двусложное, PŁOMIENIA трёхсложное." }
  - { kind: pronunciation, text: "Читается «пуо́мень», два слога, ударение на первом. Буква Ł это «у» неслоговое, поэтому начало звучит «пуо», а не «пло» — это та же ловушка, что в WPŁYWAĆ и WŁĄCZAĆ, и для русскоязычного она главная в этом слове. Сочетание MIE даёт «ме» с мягким M. Конечное Ń — мягкое «нь». В форме PŁOMIENIA три слога, ударение на втором: «пуоме́ня». В форме PŁOMIENIEM тоже три: «пуоме́нем»." }
  - { kind: register, text: "В прямом значении слово нейтральное и бытовое: PŁOMIEŃ ŚWIECY, PŁOMIEŃ GAZOWY. В переносном значении оно книжное и эмоциональное, употребляется о страсти, вере, гневе: PŁOMIEŃ UCZUCIA, Z PŁOMIENIEM W OCZACH, и в обычном разговоре звучало бы приподнято. Устойчивое STANĄĆ W PŁOMIENIACH значит «вспыхнуть, загореться» и употребляется и о доме, и о человеке в переносном смысле. Уменьшительное PŁOMYK «огонёк» очень живое и часто встречается о свече и о надежде." }
