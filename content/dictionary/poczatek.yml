# review
id: poczatek
format: 2
lemma: "początek"
rank: 523
pos: noun
pron: { cyr: "почо́нтэк" }
senses:
  - id: beginning
    ru: "начало"
    note: "В самых частых оборотах стоит в косвенном падеже: na początku «в начале», od początku «с начала»."
    examples:
      - pl: "Dobry początek to połowa roboty."
        ru: "Хорошее начало — половина дела."
        source: { kind: tatoeba, id: 442808 }
      - pl: "Na początku nie wiedziałem, co zrobić."
        ru: "Сначала я не знал, что делать."
        source: { kind: tatoeba, id: 6373411 }
      - pl: "On wyjechał do Londynu na początku lipca."
        ru: "Он уехал в Лондон в начале июля."
        source: { kind: tatoeba, id: 3659334 }
  - id: origins
    ru: "początki — истоки, зачатки (мн. ч.)"
    note: "Множественное число сдвигает значение к «истокам»: początki filozofii."
    examples:
      - pl: "Początki tenisa miały miejsce we Francji, w trzynastym wieku."
        ru: "Истоки тенниса — во Франции, в тринадцатом веке."
        source: { kind: translated, id: 1354040 }
      - pl: "Początków filozofii współczesnej należy szukać w XIX wieku."
        ru: "Истоки современной философии следует искать в XIX веке."
        source: { kind: translated, id: 735896 }
      - pl: "Początków Wszechświata zapewne nigdy nie uda się wyjaśnić."
        ru: "Истоки Вселенной, вероятно, никогда не удастся объяснить."
        source: { kind: translated, id: 987524 }
notes:
  - { kind: government, text: "na początku czegoś — «в начале чего-то», с родительным: na początku lipca «в начале июля»." }
  - { kind: usage, text: "od początku «с начала», z początku «сначала, поначалу», od początku do końca «от начала до конца»." }
  - { kind: usage, text: "Множественное początki значит «истоки, зачатки»: początki państwa polskiego «истоки польской государственности»." }
  - { kind: usage, text: "Пословица Miłe złego początki отвечает русскому «Лиха беда начало»." }
collocations:
  - { pl: "na początku", ru: "в начале" }
  - { pl: "od początku", ru: "с начала" }
  - { pl: "z początku", ru: "сначала, поначалу" }
  - { pl: "dobry początek", ru: "хорошее начало" }
family:
  - { pl: "zacząć", ru: "начать", relation: root }
  - { pl: "początkowy", ru: "начальный", relation: derived }
  - { pl: "początkowo", ru: "сначала, первоначально", relation: derived }
etymology: "Из po- плюс czątek, от праславянского *čęti «начать» — тот же корень, что в русских «начать», «почин» и «зачаток»."
memory: "początek — «начало», но в живой речи оно почти всегда стоит в косвенном падеже: na początku «в начале» (и дальше родительный: na początku lipca), od początku «с начала», z początku «сначала». Множественное число сдвигает значение: początki — это «истоки, зачатки». И запомните пословицу Miłe złego początki — русское «Лиха беда начало»."
idioms:
  - { pl: "od początku do końca", ru: "от начала до конца" }
  - { pl: "na początku", ru: "в начале" }
  - { pl: "Miłe złego początki", ru: "Лиха беда начало" }
formExamplesSkip:
  - { form: "początku", cell: "Звательный", reason: "звательный падеж: для неодушевлённого существительного он практически не употребляется" }
