  - form: "początkach"
    pl: "W początkach r. 1878, kiedy świat polityczny zajmował się pokojem san-stefańskim, wyborem nowego papieża, albo szansami europejskiej wojny, warszawscy kupcy, tudzież inteligencya pewnej okolicy Krakowskiego Przedmieścia, niemniej gorąco interesowała się przyszłością galanteryjnego sklepu pod firmą J. Mincel i S. Wokulski."
    ru: "В начале 1878 года, когда политический мир был озабочен Сан-Стефанским договором, выборами нового папы либо степенью вероятия европейской войны, варшавское купечество, а также интеллигентские круги одного из кварталов Краковского предместья не менее горячо интересовались будущностью галантерейного магазина фирмы \"Я. Минцель и С. Вокульский\"."
    source: { kind: tatoeba, id: 5197139 }
  - form: "początkach"
