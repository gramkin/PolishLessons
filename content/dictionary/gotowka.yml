notes:
  - { kind: usage, text: "Обычно слово употребляется только в единственном: gotówka «наличные». Множественное gotówki живёт в бухгалтерском и обменном обиходе — когда речь о нескольких кассах или нескольких валютах сразу; примеры даны именно там." }
  - { kind: government, text: "«Платить наличными» — płacić gotówką, творительный падеж: по-русски тоже творительный, конструкции совпадают." }
  - { kind: usage, text: "«В наличных» — w gotówce: siedem dolarów w gotówce «семь долларов наличными»." }
  - { kind: usage, text: "Слово образовано от gotowy «готовый» — буквально «готовые деньги», то есть доступные сразу. Русское «наличные» построено от «налицо»." }
  - { kind: usage, text: "Звательная форма gotówko в корпусе не встречается — у неодушевлённых существительных она почти не употребляется." }
collocations:
  - { pl: "płacić gotówką", ru: "платить наличными" }
  - { pl: "w gotówce", ru: "наличными" }
  - { pl: "brak gotówki", ru: "нехватка наличных" }
etymology: "От gotowy «готовый» — буквально «готовые деньги», доступные сразу. Русское «наличные» построено от «налицо», то есть «то, что есть на руках»: метафора другая, смысл тот же."
memory: "gotówka = «наличные», от gotowy «готовый». Запомните творительный: płacić gotówką «платить наличными» — как и в русском. А «в наличных» — w gotówce."
idioms:
  - { pl: "płacić gotówką", ru: "платить наличными" }
  - { pl: "w gotówce", ru: "наличными" }
  - { pl: "brak gotówki", ru: "нехватка наличных" }
formExamplesSkip:
  - { form: "gotówko", reason: "звательный падеж у неодушевлённых существительных в современном языке остался только в поэтическом обращении: в обычной речи вместо gotówko говорят gotówka" }
