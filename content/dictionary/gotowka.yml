  - id: pay-cash
    ru: "наличными (платить)"
    examples:
      - pl: "Płacę gotówką."
        ru: "Я плачу наличными."
        source: { kind: tatoeba, id: 8763722 }
      - pl: "Chciałbym zapłacić gotówką."
        ru: "Я бы хотел заплатить наличными."
        source: { kind: tatoeba, id: 730575 }
