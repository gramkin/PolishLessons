senses:
  - id: cash
    ru: "наличные, наличка"
    examples:
      - pl: "Mam gotówkę."
        ru: "У меня есть наличные."
        source: { kind: tatoeba, id: 10556283 }
      - pl: "Nie mam gotówki."
