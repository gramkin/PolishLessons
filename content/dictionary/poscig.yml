      - pl: "Pościg trwał kilka minut."
        ru: "Погоня длилась несколько минут."
        source: { kind: authored }
notes:
  - { kind: government, text: "Погоня за кем-л. — pościg za kimś, творительный падеж после za. Броситься в погоню — rzucić się w pościg, винительный." }
  - { kind: false-friend, text: "Корень ścigać «преследовать, гнаться», у которого уже есть карточка; ср. русское «стигать» в «настигать», «достигать»." }
  - { kind: government, text: "Мужской неодушевлённый; родительный — pościgu." }
  - { kind: usage, text: "Не путайте с pościel «постельное бельё» — слова похожи по началу, но не связаны." }
collocations:
  - { pl: "pościg za kimś", ru: "погоня за кем-л." }
  - { pl: "rzucić się w pościg", ru: "броситься в погоню" }
