# review
id: nienawidzic
format: 2
lemma: "nienawidzić"
rank: 542
pos: verb
aspect: imperf
pron: { cyr: "ненави́дзиць" }
senses:
  - id: hate
    ru: "ненавидеть (кого-л., что-л. — с родительным!)"
    note: "Требует родительного падежа, а не винительного: nienawidzę Toma, nienawidzą owadów."
    examples:
      - pl: "Nienawidzę cię."
        ru: "Я тебя ненавижу."
        source: { kind: tatoeba, id: 827298 }
      - pl: "Nienawidzę Toma."
        ru: "Я ненавижу Тома."
        source: { kind: tatoeba, id: 1351801 }
      - pl: "Nienawidzą owadów."
        ru: "Они ненавидят насекомых."
        source: { kind: tatoeba, id: 3428129 }
  - id: hate-doing
    ru: "ненавидеть что-либо делать"
    note: "С инфинитивом: nienawidzi tkwić w korku."
    examples:
      - pl: "Tom nienawidzi tkwić w korku."
        ru: "Том ненавидит торчать в пробке."
        source: { kind: tatoeba, id: 8661234 }
      - pl: "Tom nienawidził szkoły."
        ru: "Том ненавидел школу."
        source: { kind: translated, id: 4818117 }
      - pl: "Nienawidził kłamstwa."
        ru: "Он ненавидел ложь."
        source: { kind: translated, id: 3085212 }
  - id: hated
    ru: "nienawidzony — ненавидимый, ненавистный"
    note: "Страдательное причастие: bywają nienawidzeni «их иногда ненавидят»."
    examples:
      - pl: "Ludzi zawsze logiczni czasem bywają nienawidzeni."
        ru: "Всегда логичных людей иногда ненавидят."
        source: { kind: translated, id: 952151 }
      - pl: "Ten władca był powszechnie nienawidzony."
        ru: "Этого правителя все ненавидели."
        source: { kind: authored }
      - pl: "Nienawidzona ustawa wreszcie upadła."
        ru: "Ненавистный закон наконец провалился."
        source: { kind: authored }
notes:
  - { kind: government, text: "Главная ловушка: nienawidzić требует РОДИТЕЛЬНОГО падежа, а не винительного — nienawidzę Toma, nienawidzi kotów, nienawidzą owadów. Русское «ненавидеть» управляет винительным." }
  - { kind: usage, text: "В настоящем времени основа на -dz-: nienawidzę, nienawidzisz, nienawidzi, nienawidzimy, nienawidzicie, nienawidzą." }
  - { kind: usage, text: "Слово уже содержит отрицание (nie + nawidzieć «смотреть благосклонно»), поэтому отрицательная частица ставится отдельно: Nie nienawidź mnie!" }
  - { kind: usage, text: "Существительное — nienawiść «ненависть»: nienawiść do kogoś «ненависть к кому-либо»." }
collocations:
  - { pl: "nienawidzić kogoś", ru: "ненавидеть кого-либо" }
  - { pl: "nienawiść do kogoś", ru: "ненависть к кому-либо" }
  - { pl: "nienawidzić się nawzajem", ru: "ненавидеть друг друга" }
  - { pl: "szczerze nienawidzić", ru: "искренне ненавидеть" }
family:
  - { pl: "nienawiść", ru: "ненависть", relation: derived }
  - { pl: "widzieć", ru: "видеть", relation: root }
  - { pl: "znienawidzić", ru: "возненавидеть", relation: derived }
etymology: "Из nie + nawidzieć «смотреть благосклонно, любить» (от widzieć «видеть») — буквально «не смотреть благосклонно». Русское «ненавидеть» собрано ровно так же: не + навидеть."
memory: "Главное здесь — падеж: nienawidzić требует родительного, а не винительного. Nienawidzę Toma, nienawidzi kotów, nienawidzą owadów — там, где русский говорит «ненавижу Тома» в винительном. Само слово устроено как русское: nie + nawidzieć, «не смотреть благосклонно», и отрицание в нём уже есть, поэтому второе nie ставится отдельно: Nie nienawidź mnie! Существительное — nienawiść."
idioms:
  - { pl: "nienawidzić kogoś", ru: "ненавидеть кого-либо" }
  - { pl: "nienawiść do kogoś", ru: "ненависть к кому-либо" }
  - { pl: "nienawidzić się nawzajem", ru: "ненавидеть друг друга" }
