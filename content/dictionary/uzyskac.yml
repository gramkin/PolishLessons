        ru: "Улучшения достигли через две недели."
        source: { kind: authored }
  - id: gain-access
    ru: "получить (доступ, сведения)"
    examples:
      - pl: "Uzyskali dostęp do archiwum."
        ru: "Они получили доступ к архиву."
        source: { kind: authored }
notes:
  - { kind: register, text: "СЛОВО КАНЦЕЛЯРСКОЕ — В БЫТУ ОНО ЗВУЧИТ СТРАННО. Uzyskać употребляют в заявлениях, отчётах, судебных решениях: uzyskać zgodę, pozwolenie, kredyt, dostęp, tytuł. Обычное бытовое «получить» это dostać: dostałem list, dostałem prezent. Сказать «uzyskałem prezent» нельзя, это звучит как протокол." }
  - { kind: false-friend, text: "РУССКОГО РОДСТВЕННИКА У КОРНЯ НЕТ. Zysk значит «прибыль, выгода», zyskać — «выиграть, приобрести», uzyskać — «получить». В русском этого гнезда не осталось: старое «зыск» было заимствованием из польского и давно вышло из употребления. Опираться приходится на внутрипольскую семью: zysk, zyskać, uzyskać, wyzyskać." }
  - { kind: government, text: "Получают ЧТО — винительный без предлога: uzyskać zgodę, wynik, informację. ОТ КОГО — od с родительным: uzyskać coś od urzędu. НА ЧТО — na с винительным внутри самого дополнения: zgoda na budowę. Безличное uzyskano очень частотно в научном и официальном тексте." }
  - { kind: usage, text: "Вид совершенный, несовершенная пара — uzyskiwać. Отсюда деепричастие uzyskawszy и отсутствие действительного причастия настоящего времени. Одна форма причастия пропущена по грамматической причине и объяснена в карточке. Существительное uzyskanie живёт в оборотах вроде warunki uzyskania kredytu." }
collocations:
  - { pl: "uzyskać zgodę", ru: "получить согласие" }
  - { pl: "uzyskać dostęp", ru: "получить доступ" }
  - { pl: "uzyskać wynik", ru: "показать результат" }
family:
  - { pl: "zysk", ru: "прибыль, выгода", relation: root }
  - { pl: "zyskać", ru: "выиграть, приобрести", relation: root }
  - { pl: "uzyskiwać", ru: "получать", relation: aspect }
  - { pl: "stracić", ru: "потерять", relation: antonym, id: stracic }
etymology: "Приставка u- плюс zyskać, от zysk «прибыль, выгода». Происхождение самого zysk спорно: его связывают с гнездом глагола «искать», но надёжного ответа этимологи не дают. Для русского уха важнее другое — живого соответствия этому корню в русском нет, старое «зыск» было полонизмом и забылось. Отсюда zyskowny «прибыльный», wyzyskać и uzyskanie."
memory: "uzyskać — «получить, добиться», но слово КАНЦЕЛЯРСКОЕ: uzyskać zgodę, pozwolenie, dostęp. Бытовое «получить» это dostać. Корень zysk «прибыль» русской родни не имеет, запоминать приходится как есть."
idioms:
  - { pl: "uzyskać zgodę", ru: "получить согласие" }
  - { pl: "uzyskać dostęp do czegoś", ru: "получить доступ к чему-л." }
formExamplesSkip:
  - { form: "uzyskani", reason: "Пропуск по грамматической причине. Uzyskać управляет винительным падежом РЕЗУЛЬТАТА или РАЗРЕШЕНИЯ: uzyskać zgodę, pozwolenie, wynik, dostęp. Людей этим глаголом не получают, поэтому страдательное причастие описывает добытое — uzyskane wyniki, uzyskana zgoda, — а мужско-личная форма множественного числа означала бы «люди, которых добыли». Для приобретения людей в польском есть другой глагол, pozyskać: pozyskać sponsora, pozyskać zawodnika. Немужско-личное uzyskane при этом совершенно обычно." }
