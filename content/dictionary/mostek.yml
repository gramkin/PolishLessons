etymology: "Уменьшительное от MOST, из праславянского *mostъ, того же слова, что русский «мост». Суффикс -EK несёт беглую гласную и отвечает русскому -ИК и -ОК. Анатомическое значение возникло по сходству формы: грудина лежит посередине груди и соединяет рёбра, как мост соединяет берега; тем же образом объясняется латинское STERNUM и русское название «грудина», хотя последнее построено на другом корне. Значение в гимнастике и в стоматологии появилось позже и тоже по форме, причём стоматологический мост называется мостом и по-русски, так что перенос образа в обоих языках один и тот же. Из того же гнезда идут MOSTOWY «мостовой» и PRZEDMOŚCIE «предмостье»."
memory: "Уменьшительное от most — «мостик», но у слова есть и второе обиходное значение: грудина. Ból w mostku — «боль в грудине», mostek wołowy — «говяжья грудинка». Плюс гимнастический мостик и зубной мост. Беглая e выпадает всюду, кроме именительного: mostek, но mostka, mostkiem, w mostku. У исходного most беглой гласной нет, зато местный с чередованием: w moście, «мо́сьце»."
