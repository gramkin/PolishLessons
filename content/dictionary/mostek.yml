notes:
  - { kind: false-friend, text: "Слово кажется совсем прозрачным: MOSTEK это уменьшительное от MOST, то есть «мостик». Но у него есть второе, вполне обиходное значение, которого русский уменьшительной формой не передаёт: MOSTEK — это грудина, кость посередине груди, и в этом смысле слово употребляется и врачами, и мясниками. BÓL W MOSTKU значит «боль в грудине», а MOSTEK WOŁOWY — «говяжья грудинка». Есть и третье применение, спортивное: MOSTEK в гимнастике это «мостик», как и по-русски. И четвёртое, стоматологическое: MOSTEK — зубной мост. Так одно уменьшительное обслуживает мост, кость, упражнение и протез." }
  - { kind: usage, text: "Как и KUBEK, слово содержит беглую гласную в суффиксе -EK, и она выпадает во всех формах, кроме именительного и винительного единственного: MOSTEK, но MOSTKA, MOSTKOWI, MOSTKIEM, MOSTKU, MOSTKI. Группа STK, которая при этом возникает, произносится слитно и без вставных гласных. Местный падеж на -U, потому что основа кончается на K: W MOSTKU. Родительный множественного — MOSTKÓW. Полезно держать рядом с MOST, у которого беглой гласной нет вовсе: MOST, MOSTU, MOŚCIE, и местный у него на -IE с чередованием ST в ŚĆ." }
  - { kind: government, text: "Мужской род, неодушевлённое. Через что мостик — предлог NAD с творительным: MOSTEK NAD STRUMIENIEM, или PRZEZ с винительным: MOSTEK PRZEZ RÓW. В анатомическом значении «в грудине» — W с местным: BÓL W MOSTKU. Частотные сочетания: MOSTEK WOŁOWY «говяжья грудинка», MOSTEK LINOWY «верёвочный мостик», MOSTEK KAPITAŃSKI «капитанский мостик» — последнее совпадает с русским полностью. В стоматологии: MOSTEK PROTETYCZNY «зубной мост»." }
  - { kind: pronunciation, text: "Читается «мо́стэк», два слога, ударение на первом. Буква O произносится полно, E даёт «э». В родительном MOSTKA беглая гласная выпадает, и получается группа из трёх согласных STK: «мо́стка», выговаривается слитно. В местном MOSTKU слышно «мо́стку». Сравните с MOST, где местный падеж MOŚCIE звучит «мо́сьце», с мягкими Ś и Ć: уменьшительное и исходное слово расходятся в этой форме полностью." }
