# review
id: wkurzac
format: 2
lemma: "wkurzać"
rank: 2234
pos: verb
pron: { cyr: "фку́жаць" }
senses:
  - id: annoy
    ru: "бесить, раздражать, выводить из себя"
    examples:
      - pl: "Wkurza mnie ten hałas."
        ru: "Меня бесит этот шум."
        source: { kind: authored }
      - pl: "Nie wkurzaj brata."
        ru: "Не беси брата."
        source: { kind: authored }
  - id: annoy-habitual
    ru: "доводить, доставать (постоянно)"
    examples:
      - pl: "Wkurzał nauczycieli przez cały rok."
        ru: "Он доставал учителей весь год."
        source: { kind: authored }
      - pl: "Wkurzają mnie te ciągłe pytania."
        ru: "Меня раздражают эти постоянные вопросы."
        source: { kind: authored }
  - id: reflexive
    ru: "wkurzać się — злиться, беситься"
    examples:
      - pl: "Nie wkurzaj się, to tylko żart."
        ru: "Не злись, это всего лишь шутка."
        source: { kind: authored }
notes:
  - { kind: register, text: "СЛОВО РАЗГОВОРНОЕ И ГРУБОВАТОЕ — НЕ ДЛЯ ОФИЦИАЛЬНОЙ РЕЧИ. На письме в документе, на работе с начальником, в разговоре с незнакомым его не употребляют. Нейтральные замены: denerwować, irytować, złościć. В дружеском разговоре wkurzać звучит естественно и часто — примерно как русское «бесить»." }
  - { kind: false-friend, text: "Созвучие с «курить» обманчиво ровно наполовину. Корень действительно тот же: kurzyć значит «ПЫЛИТЬ, ДЫМИТЬ», а русское «курить» восходит к тому же праславянскому *kuriti «дымить». Но смысл разошёлся: по-польски курят palić papierosa, а kurzyć — это поднимать пыль. Wkurzać построено на образе «довести до дыма», как русское «дымиться от злости»." }
  - { kind: government, text: "Бесят КОГО — винительный без предлога: wkurza mnie, wkurza nas, wkurzasz go. ЧЕМ — творительный: wkurzać kogoś pytaniami, hałasem. Возвратная форма строится с na и винительным: wkurzać się na kogoś «злиться на кого-то», ровно как в русском." }
  - { kind: usage, text: "Вид несовершенный, совершенная пара — wkurzyć. Поэтому деепричастия на -wszy у него нет, зато есть причастие настоящего времени wkurzający, которое давно живёт отдельно как прилагательное «раздражающий, бесячий»: wkurzająca reklama, wkurzający dźwięk." }
collocations:
  - { pl: "wkurza mnie", ru: "меня бесит" }
  - { pl: "wkurzać się na kogoś", ru: "злиться на кого-л." }
  - { pl: "wkurzająca reklama", ru: "раздражающая реклама" }
family:
  - { pl: "wkurzyć", ru: "взбесить", relation: aspect, id: wkurzyc }
  - { pl: "kurz", ru: "пыль", relation: root }
  - { pl: "denerwować", ru: "нервировать, раздражать", relation: derived, id: denerwowac }
etymology: "Приставка w- плюс kurzyć «пылить, дымить», от kurz «пыль», из праславянского *kuriti «дымить» — того же корня, что русское «курить». Образ прозрачен и совпадает с русским «дымиться от злости»: довести человека до того, что от него пар идёт. В живой речи слово к тому же служит смягчённой заменой более грубого глагола того же вида, оттого и регистр у него сниженный."
memory: "wkurzać — «бесить», разговорное и грубоватое; нейтрально denerwować. Корень kurz «ПЫЛЬ», kurzyć «дымить» — тот же, что в русском «курить»; образ как в «дымиться от злости». Бесят винительным: wkurza mnie. Злятся — na: wkurzam się na niego."
idioms:
  - { pl: "wkurza mnie to", ru: "меня это бесит" }
  - { pl: "wkurzać się na kogoś", ru: "злиться на кого-л." }
