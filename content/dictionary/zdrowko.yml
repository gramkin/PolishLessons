notes:
  - { kind: false-friend, text: "ZDRÓWKO — ласковое от ZDROWIE, «здоровьице». Главное употребление — тост: NA ZDRÓWKO! или просто ZDRÓWKO! Ответ на «спасибо» за угощение — NA ZDROWIE, «на здоровье», и на чих — тоже NA ZDROWIE." }
  - { kind: register, text: "Разговорное и тёплое. В тосте — дружеское; в официальном тосте говорят ZA ZDROWIE. Вопрос JAK ZDRÓWKO? — заботливый, к пожилым." }
  - { kind: usage, text: "Средний род. Учим единственное: ZDRÓWKO, ZDRÓWKA, ZDRÓWKU, ZDRÓWKIEM. Ó чередуется с O: ZDROWIE, но ZDRÓWKO." }
  - { kind: pronunciation, text: "Читается «здру́фко»: Ó — «у», W перед K оглушается в «ф». Ударение на первом слоге." }
