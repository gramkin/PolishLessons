# review
id: przepuscic
format: 2
lemma: "przepuścić"
rank: 4701
pos: verb
pron: { cyr: "пшэпу́сьциць" }
senses:
  - id: let-through
    ru: "пропустить (вперёд, через границу)"
    examples:
      - pl: "Przepuść panią w drzwiach."
        ru: "Пропусти женщину в дверях."
        source: { kind: authored }
      - pl: "Kierowca przepuścił pieszych."
        ru: "Водитель пропустил пешеходов."
        source: { kind: authored }
      - pl: "Celnicy przepuścili nas bez kontroli."
        ru: "Таможенники пропустили нас без досмотра."
        source: { kind: authored }
  - id: miss
    ru: "упустить; промотать (деньги)"
    examples:
      - pl: "Przepuścił szansę życia."
        ru: "Он упустил шанс всей жизни."
        source: { kind: authored }
      - pl: "Przepuścił cały spadek w kasynie."
        ru: "Он промотал всё наследство в казино."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "PRZEPUŚCIĆ — «пропустить» в смысле «дать пройти»: PRZEPUŚCIĆ KOGOŚ W DRZWIACH. Но «пропустить урок» — OPUŚCIĆ LEKCJĘ, а «пропустить слово» при чтении — POMINĄĆ. PRZEPUŚCIĆ OKAZJĘ — «упустить шанс», PRZEPUŚCIĆ PIENIĄDZE — «промотать деньги»." }
  - { kind: usage, text: "Пятьдесят три формы — подпись переходного глагола совершенного вида: страдательное PRZEPUSZCZONY и деепричастие PRZEPUŚCIWSZY. Чередование ŚĆ → SZCZ: PRZEPUSZCZĘ, PRZEPUSZCZONY. Видовой партнёр — PRZEPUSZCZAĆ: TA KURTKA NIE PRZEPUSZCZA WODY, «эта куртка не пропускает воду»." }
  - { kind: government, text: "Кого или что — винительный: PRZEPUŚCIĆ SAMOCHÓD, OKAZJĘ. Через что — PRZEZ с винительным: PRZEPUŚCIĆ PRZEZ GRANICĘ, PRZEZ SITO. Пропустить вперёд — PRZODEM: PRZEPUŚCIĆ KOGOŚ PRZODEM." }
  - { kind: pronunciation, text: "Читается «пшэпу́сьциць», четыре слога, ударение на предпоследнем. PRZE — «пшэ», ŚCI — «сьци». Конечное Ć — «ць». PRZEPUSZCZĘ — «пшэпу́шчэ»." }
  - { kind: register, text: "Нейтральное бытовое слово: в дверях, на дороге, на границе. Вежливое PROSZĘ PRZODEM — «проходите, пожалуйста». PRZEPUŚCIĆ PIENIĄDZE — разговорное, с оттенком осуждения." }
collocations:
  - { pl: "przepuścić kogoś przodem", ru: "пропустить кого-то вперёд" }
  - { pl: "przepuścić okazję", ru: "упустить шанс" }
  - { pl: "przepuścić przez sito", ru: "пропустить через сито" }
family:
  - { pl: "przepuszczać", ru: "пропускать", relation: aspect }
  - { pl: "puścić", ru: "пустить", relation: root, id: puscic }
  - { pl: "przepustka", ru: "пропуск (документ)", relation: derived }
etymology: "Приставка PRZE- «про-, через» плюс PUŚCIĆ «пустить». Русское «пропустить» строится так же, только с приставкой «про-». PRZEPUSTKA — «пропуск», того же корня."
memory: "Przepuścić — пропустить вперёд: przepuść panią. Przepuścić okazję — упустить шанс. Пропустить урок — opuścić! Przepustka — пропуск. Читается «пшэпу́сьциць»."
idioms:
  - { pl: "nie przepuścić żadnej okazji", ru: "не упустить ни одного случая" }
