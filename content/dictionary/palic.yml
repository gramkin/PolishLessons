# review
id: palic
format: 2
lemma: "palić"
rank: 977
pos: verb
aspect: imperf
pron: { cyr: "па́лиць" }
senses:
  - id: smoke
    ru: "курить"
    examples:
      - pl: "Nie palę."
        ru: "Я не курю."
        source: { kind: translated, id: 3600352 }
      - pl: "Czy on pali?"
        ru: "Он курит?"
        source: { kind: translated, id: 11134178 }
      - pl: "Rzuciłem palenie."
        ru: "Я бросил курить."
        source: { kind: translated, id: 351947 }
  - id: burn
    ru: "жечь, сжигать; palić się — гореть"
    examples:
      - pl: "Drzewo łatwo się pali."
        ru: "Дерево легко горит."
        source: { kind: translated, id: 937891 }
      - pl: "Otworzył oczy i zobaczył, że świeca na stole jeszcze się pali."
        ru: "Он открыл глаза и увидел, что свеча на столе всё ещё горит."
        source: { kind: translated, id: 4719036 }
      - pl: "Heretyków palono żywcem."
        ru: "Еретиков сжигали заживо."
        source: { kind: translated, id: 2947621 }
  - id: burning
    ru: "palący — палящий, жгучий; курящий"
    examples:
      - pl: "Palący czy niepalący?"
        ru: "Курящий или некурящий?"
        source: { kind: translated, id: 10603602 }
      - pl: "Babcia używała parasolki, aby chronić się przed palącym letnim słońcem."
        ru: "Бабушка пользовалась зонтиком, чтобы защититься от палящего летнего солнца."
        source: { kind: translated, id: 11005872 }
      - pl: "Dla palących czy niepalących?"
        ru: "Для курящих или для некурящих?"
        source: { kind: translated, id: 6067362 }
notes:
  - { kind: usage, text: "Два основных значения: «курить» (palę papierosy) и «жечь» (palić liście). Возвратное palić się значит «гореть»: Świeczka się pali." }
  - { kind: usage, text: "Отглагольное существительное palenie — «курение»: rzucić palenie «бросить курить», zakaz palenia «курить запрещено». Это стандартная надпись на табличках." }
  - { kind: usage, text: "Причастие palący субстантивировалось: palący «курящий», niepalący «некурящий», miejsce dla palących «место для курящих». В другом значении — «палящий»: palące słońce." }
  - { kind: usage, text: "Единой видовой пары у глагола нет: zapalić значит «закурить, зажечь», spalić — «сжечь», wypalić — «выкурить, выжечь». Приставка каждый раз меняет смысл." }
collocations:
  - { pl: "palić papierosy", ru: "курить сигареты" }
  - { pl: "rzucić palenie", ru: "бросить курить" }
  - { pl: "zakaz palenia", ru: "курить запрещено" }
  - { pl: "palić się", ru: "гореть" }
family:
  - { pl: "ogień", ru: "огонь", relation: root, id: ogien }
  - { pl: "zapalić", ru: "закурить, зажечь", relation: derived }
  - { pl: "spalić", ru: "сжечь", relation: derived }
etymology: "Праславянское *paliti «заставлять гореть», каузатив к *polěti. Русское «палить» — то же слово, и «пылать», «пепел» ему родня."
memory: "palić — и «курить», и «жечь». Palę «я курю», но Świeczka się pali «свеча горит». Запомните palenie «курение»: rzucić palenie «бросить курить», zakaz palenia — табличка «не курить»."
idioms:
  - { pl: "palić za sobą mosty", ru: "сжигать за собой мосты" }
  - { pl: "nie pali się", ru: "не горит, не к спеху" }
  - { pl: "palić jak smok", ru: "дымить как паровоз" }
