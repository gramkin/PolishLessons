# review
id: przeczyc
format: 2
lemma: "przeczyć"
rank: 5579
pos: verb
aspect: imperf
aspectPair: zaprzeczyc
pron: { cyr: "пшэ́чиць" }
senses:
  - id: deny
    ru: "отрицать, перечить"
    examples:
      - pl: "Nie przeczę."
        ru: "Не отрицаю."
        source: { kind: translated, id: 4735543 }
      - pl: "Nie przeczę, że się myliłem."
        ru: "Не отрицаю, что ошибался."
        source: { kind: authored }
      - pl: "Przeczy oczywistym faktom."
        ru: "Он отрицает очевидные факты."
        source: { kind: authored }
  - id: contradict
    ru: "противоречить (чему-л.)"
    examples:
      - pl: "Jej melancholijny uśmiech przeczył smutkowi, który czuła, mając odjeżdżać."
        ru: "Её меланхоличная улыбка противоречила грусти, которую она чувствовала."
        source: { kind: translated, id: 3017732 }
      - pl: "Dał ci odpowiedź twierdzącą czy przeczącą?"
        ru: "Он дал тебе утвердительный ответ или отрицательный?"
        source: { kind: translated, id: 441244 }
notes:
  - { kind: government, text: "Противоречить чему-л. — ДАТЕЛЬНЫЙ падеж: przeczyć faktom, przeczyć sobie. Та же модель, что у zaprzeczyć." }
  - { kind: usage, text: "Nie przeczę «не отрицаю» — вежливая формула частичного согласия в споре." }
  - { kind: false-friend, text: "Корень тот же, что у zaprzeczyć «отрицать» и sprzeczność «противоречие», обе карточки уже есть; ср. русское «перечить»." }
  - { kind: usage, text: "Причастие przeczący значит «отрицательный»: odpowiedź przecząca «отрицательный ответ»." }
collocations:
  - { pl: "nie przeczę", ru: "не отрицаю" }
  - { pl: "odpowiedź przecząca", ru: "отрицательный ответ" }
etymology: "prze- + -czyć, тот же корень, что в zaprzeczyć и sprzeczność; ср. русское «перечить», «противоречие»."
memory: "przeczyć — «отрицать, противоречить», с ДАТЕЛЬНЫМ падежом: przeczyć faktom. Совершенный вид — zaprzeczyć. Причастие przeczący «отрицательный»."
idioms:
