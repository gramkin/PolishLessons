notes:
  - { kind: false-friend, text: "Одно польское слово на два русских, и причина в самом корне. Południe значит И «полдень», И «юг» — потому что южная сторона есть та, где солнце стоит в полдень. Русское «полдень» — тот же состав («пол» плюс «день»), и русский когда-то тоже говорил «полуденные страны» о южных землях, но потом закрепил за направлением отдельное слово «юг». Поляк обходится одним: przerwa południowa «обеденный перерыв», но Ameryka Południowa «Южная Америка»." }
  - { kind: usage, text: "ВАЖНО о числе форм: их здесь всего одиннадцать, а не тридцать три, и это не пропуск. Południowy — прилагательное ОТНОСИТЕЛЬНОЕ: нельзя быть «более южным», как нельзя быть «более деревянным». Поэтому степеней сравнения у него нет. Сравните с naturalny, где степени есть и форм выходит тридцать три. По этому признаку относительные прилагательные узнаются сразу: słowny, drewniany, męski, magiczny — все дают одиннадцать форм." }
  - { kind: government, text: "Обычное прилагательное, согласуется с существительным: południowy wiatr, południowa ściana, południowe zbocze. В названиях пишется с большой буквы: Ameryka Południowa, Korea Południowa. Мужско-личная форма множественного — południowi (południowi sąsiedzi)." }
