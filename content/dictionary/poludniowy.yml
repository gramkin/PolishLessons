  - { pl: "północny", ru: "северный; полуночный", relation: antonym, id: polnocny }
etymology: "От południe, а это сложение pół «пол» и dzień «день» — буквально «полдень». Русское «полдень» собрано из тех же частей. Направление названо по солнцу: юг там, где оно в полдень. Та же логика в паре północ «север; полночь» при русской «полночи» — польский сохранил двойное значение в обоих словах, а русский развёл их на «юг/полдень» и «север/полночь»."
memory: "południowy — и «южный», и «полуденный», потому что południe значит и «юг», и «полдень» (pół + dzień, как русское «полдень»). И запомните: форм всего одиннадцать, потому что относительное прилагательное степеней сравнения не имеет."
