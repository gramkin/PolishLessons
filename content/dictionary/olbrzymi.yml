# review
id: olbrzymi
format: 2
lemma: "olbrzymi"
rank: 4006
pos: adj
pron: { cyr: "олбжы́ми" }
senses:
  - id: huge
    ru: "огромный, громадный"
    examples:
      - pl: "Chiny to olbrzymi kraj."
        ru: "Китай — огромная страна."
        source: { kind: tatoeba, id: 766109 }
      - pl: "Z krzaków wyskoczył olbrzymi dzik."
        ru: "Из кустов выскочил огромный дикий кабан."
        source: { kind: tatoeba, id: 10202661 }
      - pl: "Popyt jest olbrzymi."
        ru: "Спрос огромен."
        source: { kind: translated, id: 3127529 }
  - id: giant
    ru: "гигантский (в том числе в названиях видов)"
    examples:
      - pl: "Na wyspach Galapagos jest wiele gatunków żółwi olbrzymich."
        ru: "На Галапагосских островах есть много видов гигантских черепах."
        source: { kind: tatoeba, id: 975080 }
      - pl: "Gwiazdy to olbrzymie kule plazmy."
        ru: "Звёзды — это гигантские шары плазмы."
        source: { kind: translated, id: 982929 }
notes:
  - { kind: usage, text: "Сильнее, чем duży «большой»; практически синоним ogromny «огромный»." }
  - { kind: false-friend, text: "Ничего общего с «брюхом». Корень — olbrzym «великан, гигант»." }
  - { kind: government, text: "Обычное прилагательное, но степеней сравнения почти не образует: «огромнее» не говорят ни по-польски, ни по-русски." }
  - { kind: usage, text: "В названиях видов стоит после существительного: żółw olbrzymi «гигантская черепаха», panda olbrzymia «большая панда»." }
collocations:
  - { pl: "olbrzymi sukces", ru: "огромный успех" }
  - { pl: "olbrzymia różnica", ru: "огромная разница" }
etymology: "От olbrzym «великан», из праславянского *obrъ — так называли аваров, народ-завоеватель; русские летописи знают их как «обры»."
memory: "olbrzymi — «огромный», от olbrzym «великан». Слово восходит к названию аваров, которых русская летопись зовёт «обры»."
idioms:
  - { pl: "olbrzymi sukces", ru: "огромный успех" }
