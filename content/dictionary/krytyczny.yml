# review
id: krytyczny
format: 2
lemma: "krytyczny"
rank: 4662
pos: adj
pron: { cyr: "крыты́чны" }
senses:
  - id: critical-judging
    ru: "критический, критичный (оценивающий)"
    examples:
      - pl: "Jest bardzo krytyczny wobec siebie."
        ru: "Он очень критичен к себе."
        source: { kind: authored }
      - pl: "Napisał krytyczną recenzję."
        ru: "Он написал критическую рецензию."
        source: { kind: authored }
      - pl: "To najkrytyczniejszy z recenzentów."
        ru: "Это самый строгий из рецензентов."
        source: { kind: authored }
  - id: crucial
    ru: "критический, переломный, опасный (о моменте, состоянии)"
    examples:
      - pl: "Pacjent jest w stanie krytycznym."
        ru: "Пациент в критическом состоянии."
        source: { kind: authored }
      - pl: "To był krytyczny moment meczu."
        ru: "Это был переломный момент матча."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Совпадение с русским «критический» полное в обоих значениях: и «оценивающий», и «опасный, переломный». Разница в форме: польское -YCZNY, твёрдое «ты»: KRYTYCZNY «крыты́чны». И ещё: «критичный» о человеке и «критический» о моменте поляк не различает — одно слово на оба." }
  - { kind: usage, text: "Полная парадигма: KRYTYCZNY, KRYTYCZNIEJSZY, NAJKRYTYCZNIEJSZY. Степени встречаются в значении «строже оценивающий»: KRYTYCZNIEJSZY WOBEC WŁADZY. Мужское-личное: KRYTYCZNI, KRYTYCZNIEJSI, NAJKRYTYCZNIEJSI." }
  - { kind: government, text: "Критичный к кому-то — KRYTYCZNY WOBEC KOGOŚ, WOBEC с родительным: KRYTYCZNY WOBEC RZĄDU. Русское «критичен к кому» с дательным здесь не работает." }
  - { kind: pronunciation, text: "Читается «крыты́чны», три слога, ударение на предпоследнем. KRY и TY — твёрдые «кры» и «ты», без русских «кри» и «ти». В KRYTYCZNIEJSZY: «крытычне́йшы»." }
  - { kind: register, text: "Нейтральное слово, частое в медицине (STAN KRYTYCZNY), технике (MASA KRYTYCZNA) и журналистике (KRYTYCZNY ARTYKUŁ). Разговорно — KRYTYCZNY MOMENT, «самое трудное место»." }
collocations:
  - { pl: "stan krytyczny", ru: "критическое состояние" }
  - { pl: "krytyczny moment", ru: "критический момент" }
  - { pl: "krytyczny wobec kogoś", ru: "критичный к кому-то" }
family:
  - { pl: "krytyka", ru: "критика", relation: root }
  - { pl: "krytyk", ru: "критик", relation: root }
  - { pl: "krytykować", ru: "критиковать", relation: derived }
etymology: "Из греческого kritikós, «способный судить», от krínein «судить, решать». Критический момент — тот, когда решается исход, а критичный человек — тот, кто выносит суждение. Тот же корень в польском KRYZYS и русском «кризис»."
memory: "Krytyczny — критический: stan krytyczny, krytyczny moment. И критичный: krytyczny wobec siebie. Wobec + родительный. Твёрдое «ты»: крыты́чны."
idioms:
