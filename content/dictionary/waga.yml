pos: noun
pron: { cyr: "ва́га" }
senses:
  - id: scales
    ru: "весы (прибор)"
    examples:
      - pl: "Waga w łazience pokazuje za dużo."
        ru: "Весы в ванной показывают слишком много."
        source: { kind: authored }
      - pl: "Postaw torbę na wadze."
        ru: "Поставь сумку на весы."
        source: { kind: authored }
  - id: weight
    ru: "вес"
    examples:
      - pl: "Waga paczki przekracza dwa kilogramy."
        ru: "Вес посылки превышает два килограмма."
        source: { kind: authored }
      - pl: "Stracił na wadze po chorobie."
        ru: "Он потерял в весе после болезни."
        source: { kind: authored }
  - id: importance
    ru: "вес, значение"
    examples:
      - pl: "Nie przywiązuj do tego wagi."
        ru: "Не придавай этому значения."
