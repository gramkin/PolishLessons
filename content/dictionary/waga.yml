notes:
  - { kind: false-friend, text: "ОДНО ПОЛЬСКОЕ СЛОВО НА ДВА РУССКИХ. Waga это и «ВЕС», и «ВЕСЫ» — причём прибор называется словом в ЕДИНСТВЕННОМ числе: kupiłem wagę «я купил весы», waga się zepsuła «весы сломались». Русские «весы» существуют только во множественном, и буквальный перевод «wagi się zepsuły» будет значить, что сломались несколько приборов." }
  - { kind: pronunciation, text: "ДАТЕЛЬНЫЙ И ПРЕДЛОЖНЫЙ: G ПЕРЕХОДИТ В DZ. Waga даёт wadze, и это общее правило для женских существительных на -ga: noga — nodze, droga — drodze, Praga — w Pradze. Рядом стоят уже знакомые смягчения: k переходит в c (fabryka — fabryce), t в ci (płyta — płycie), d в dzi (metoda — metodzie)." }
  - { kind: usage, text: "Переносное значение «вес, значение» живое и частотное: przywiązywać wagę do czegoś «придавать значение чему-л.», sprawa wielkiej wagi «дело большой важности». Waga это ещё и знак зодиака Весы, и весовая категория в спорте: waga ciężka «тяжёлый вес»." }
collocations:
  - { pl: "przywiązywać wagę", ru: "придавать значение" }
  - { pl: "stracić na wadze", ru: "похудеть, потерять в весе" }
  - { pl: "waga ciężka", ru: "тяжёлый вес" }
family:
  - { pl: "ważyć", ru: "весить, взвешивать", relation: derived }
  - { pl: "ważny", ru: "важный", relation: derived, id: wazny }
  - { pl: "odważyć się", ru: "отважиться", relation: derived }
etymology: "Из средневекового немецкого wāge «весы», того же корня, что и английское weigh. Отсюда ważyć «весить» и ważny — буквально «имеющий вес». А вот дальше начинается самое интересное: русское «ВАЖНЫЙ» не родное, оно заимствовано из польского ważny, и внутри него спрятана та же waga. «Отважный» и «уважать» — оттуда же."
memory: "waga — и «вес», и «весы», причём прибор в единственном числе: kupiłem wagę. Дательный и предложный с чередованием g/dz: na wadze. А чтобы запомнить корень, достаточно вспомнить, что русское «важный» — это польское ważny «имеющий вес», заимствованное целиком."
idioms:
  - { pl: "przywiązywać wagę do czegoś", ru: "придавать значение чему-л." }
  - { pl: "sprawa najwyższej wagi", ru: "дело первостепенной важности" }
