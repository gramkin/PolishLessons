# review
id: widocznie
format: 2
lemma: "widocznie"
rank: 2209
pos: adv
pron: { cyr: "видо́чне" }
senses:
  - id: apparently
    ru: "видимо, по-видимому"
    examples:
      - pl: "Widocznie o nas zapomnieli."
        ru: "Видимо, о нас забыли."
        source: { kind: authored }
      - pl: "Nie odpisał, widocznie nie miał czasu."
        ru: "Он не ответил, видимо, не было времени."
        source: { kind: authored }
      - pl: "Najwidoczniej pomylił adres."
        ru: "По всей видимости, он перепутал адрес."
        source: { kind: authored }
  - id: visibly
    ru: "заметно, видимо (о степени)"
    examples:
      - pl: "Posiwiał widocznie w ciągu roku."
        ru: "Он заметно поседел за год."
        source: { kind: authored }
      - pl: "Ręce drżały mu widocznie."
        ru: "Руки у него заметно дрожали."
        source: { kind: authored }
notes:
  - { kind: usage, text: "НАРЕЧИЕ СО СТЕПЕНЯМИ СРАВНЕНИЯ — ВОТ ПОЧЕМУ ФОРМ ВСЕГО ТРИ. Польские наречия сравниваются так же, как прилагательные: widocznie, widoczniej, najwidoczniej. Русские «видно» и «заметно» тоже это умеют, но у польского наречия превосходная степень najwidoczniej застыла в самостоятельное вводное слово со значением «по всей видимости», и в этом употреблении она даже частотнее исходной формы." }
  - { kind: false-friend, text: "Корень тот же, что в русских «вид» и «видеть»: widocznie идёт от widoczny «видимый, заметный», а оно — от widok «вид». Совпадают и оба значения, модальное «видимо, по-видимому» и обстоятельственное «заметно». Опираться на русский здесь можно смело, ловушки нет." }
  - { kind: pronunciation, text: "Четыре слога, ударение на предпоследнем: wi-do-CZNIE, «видо́чне». cz звучит как ч, а ni мягко. В превосходной степени ударение уезжает вправо: naj-wi-do-CZNIEJ, «найвидо́чней»." }
collocations:
  - { pl: "najwidoczniej", ru: "по всей видимости" }
  - { pl: "widocznie się spóźnił", ru: "видимо, он опоздал" }
  - { pl: "widocznie zmęczony", ru: "заметно уставший" }
family:
  - { pl: "widoczny", ru: "видимый, заметный", relation: derived }
  - { pl: "widok", ru: "вид", relation: root, id: widok }
  - { pl: "widzieć", ru: "видеть", relation: root, id: widziec }
etymology: "От widoczny «видимый, заметный», от widok «вид» и дальше от widzieć «видеть» — корень тот же, что в русских «видеть» и «вид». Приставка naj- образует превосходную степень, как и у прилагательных. Отсюда widoczność «видимость» и niewidoczny «незаметный»."
memory: "widocznie — «видимо, по-видимому», корень знакомый, от widzieć. Форм всего три, потому что польские наречия сравниваются: widocznie, widoczniej, najwidoczniej. Последнее уже почти вводное слово: «по всей видимости»."
idioms:
  - { pl: "najwidoczniej", ru: "по всей видимости" }
  - { pl: "widocznie tak miało być", ru: "видимо, так и должно было быть" }
