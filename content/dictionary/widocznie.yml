    pl: "Drzwi były otwarte, najwidoczniej wyszedł w pośpiechu."
    ru: "Дверь была открыта, по всей видимости, он вышел в спешке."
    source: { kind: authored }
  - form: "najwidoczniej"
    pl: "Telefon milczy, najwidoczniej wyładowała się bateria."
