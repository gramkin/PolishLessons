# review
id: zielony
format: 2
lemma: "zielony"
rank: 1225
pos: adj
pron: { cyr: "зело́ны" }
senses:
  - id: green
    ru: "зелёный (цвет)"
    examples:
      - pl: "Dlaczego trawa jest zielona?"
        ru: "Почему трава зелёная?"
        source: { kind: tatoeba, id: 1348947 }
      - pl: "Ma zielone oczy."
        ru: "У неё зелёные глаза."
        source: { kind: tatoeba, id: 2256050 }
      - pl: "Zielony to mój ulubiony kolor."
        ru: "Зелёный - мой любимый цвет."
        source: { kind: tatoeba, id: 1111422 }
  - id: unripe
    ru: "зелёный, незрелый; переносно — неопытный"
    examples:
      - pl: "Te śliwki są jeszcze zielone, nie jedz ich."
        ru: "Эти сливы ещё зелёные, не ешь их."
        source: { kind: tatoeba, id: 6156375 }
      - pl: "Jesteś jeszcze zielony."
        ru: "Ты ещё зелёный."
        source: { kind: tatoeba, id: 661331 }
      - pl: "Jabłko jest zielone."
        ru: "Яблоко зелёное."
        source: { kind: translated, id: 8754470 }
  - id: no-idea
    ru: "nie mieć zielonego pojęcia — не иметь ни малейшего понятия"
    examples:
      - pl: "Nie mam zielonego pojęcia."
        ru: "Не имею ни малейшего понятия."
        source: { kind: translated, id: 349474 }
      - pl: "Nie mam zielonego pojęcia jak grać w golfa."
        ru: "Не имею ни малейшего понятия, как играть в гольф."
        source: { kind: translated, id: 1354021 }
      - pl: "Tom nie ma zielonego pojęcia, co ma zrobić."
        ru: "Том не имеет ни малейшего понятия, что делать."
        source: { kind: translated, id: 3502596 }
notes:
  - { kind: usage, text: "Идиома nie mieć zielonego pojęcia «не иметь ни малейшего понятия» — одна из самых частых в языке. Буквально «не иметь зелёного понятия»." }
  - { kind: usage, text: "Как и в русском, zielony значит «незрелый», а переносно «неопытный»: Jesteś jeszcze zielony «Ты ещё зелёный»." }
  - { kind: government, text: "О цвете одежды — предложный падеж с w: Do twarzy ci w zielonym «Тебе идёт зелёное»." }
  - { kind: usage, text: "Zielone światło — и зелёный свет на светофоре, и переносно «добро»: dostać zielone światło «получить добро»." }
collocations:
  - { pl: "zielona herbata", ru: "зелёный чай" }
  - { pl: "zielone światło", ru: "зелёный свет" }
  - { pl: "nie mieć zielonego pojęcia", ru: "не иметь ни малейшего понятия" }
etymology: "Праславянское *zelenъ — то же слово, что русское «зелёный». Отсюда же zieleń «зелень» и ziele «трава, зелье»."
memory: "zielony — «зелёный», один в один с русским. Две идиомы обязательны: nie mieć zielonego pojęcia «не иметь ни малейшего понятия» и zielone światło «зелёный свет, добро». И zielony значит «незрелый, неопытный», как русское «зелёный»."
idioms:
  - { pl: "nie mieć zielonego pojęcia", ru: "не иметь ни малейшего понятия" }
  - { pl: "zielone światło", ru: "зелёный свет" }
  - { pl: "zielona herbata", ru: "зелёный чай" }
