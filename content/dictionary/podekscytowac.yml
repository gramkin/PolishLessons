notes:
  - { kind: register, text: "В ЖИВОЙ РЕЧИ ПОЧТИ ВСЕГДА ВСТРЕЧАЕТСЯ ПРИЧАСТИЕ, А НЕ САМ ГЛАГОЛ. JESTEM PODEKSCYTOWANY, DZIECI SĄ PODEKSCYTOWANE — вот обычный способ употребления; сам podekscytować в личных формах звучит книжно. Та же картина, что у obiecujący при редком obiecować: производное живёт полной жизнью, а исходный глагол отступил." }
  - { kind: false-friend, text: "Чувство тут РАДОСТНОЕ, и это главное. PODEKSCYTOWANY значит «взволнованный в предвкушении», «на подъёме» — так говорят о ребёнке перед праздником. Русское «возбуждённый» двусмысленно, «экзальтированный» прямо отрицательно, а польское слово нейтрально-положительное. Точнее всего переводить «в предвкушении» или «радостно взволнован»." }
  - { kind: usage, text: "Приставка po- здесь одновременно образует совершенный вид и слегка смягчает действие: не «привести в исступление», а «взбудоражить». Несовершенная пара — EKSCYTOWAĆ. Спряжение стандартное для заимствований на -ować: podekscytować, но podekscytuję, podekscytujesz, как и русское «-ировать — -ирую»." }
collocations:
  - { pl: "być podekscytowanym", ru: "быть в предвкушении" }
  - { pl: "podekscytować się czymś", ru: "разволноваться из-за чего-л." }
  - { pl: "podekscytowany tłum", ru: "возбуждённая толпа" }
family:
  - { pl: "ekscytować", ru: "волновать, будоражить (несов.)", relation: aspect }
  - { pl: "ekscytujący", ru: "волнующий, захватывающий", relation: root }
  - { pl: "ekscytacja", ru: "волнение, возбуждение", relation: root }
etymology: "Из латинского excitare «возбуждать, пробуждать», пришедшего через французский и немецкий. Русский взял тот же корень в «экзальтации» и книжном «эксцитации», но для повседневного чувства оставил свои слова. Приставку поляки добавили родную: po- делает глагол совершенным ровно так же, как в poinformować, где русский берёт «про-»."
memory: "podekscytowany — это радостное волнение, предвкушение, а не «возбуждённый» в тревожном смысле. И запомни, что живёт в речи именно причастие: jestem podekscytowany, а сам глагол почти не употребляют."
idioms:
