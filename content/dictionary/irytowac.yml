# review
id: irytowac
format: 2
lemma: "irytować"
rank: 5845
pos: verb
aspect: imperf
pron: { cyr: "ирыто́ваць" }
senses:
  - id: annoy
    ru: "раздражать, злить (кого-либо)"
    examples:
      - pl: "To nie jest powód, aby się irytować."
        ru: "Это не повод раздражаться."
        source: { kind: translated, id: 544396 }
      - pl: "Jego samowola mnie irytuje."
        ru: "Меня раздражает его своеволие."
        source: { kind: translated, id: 369016 }
      - pl: "Te nowoczesne butelki mnie irytują."
        ru: "Меня раздражают эти современные бутылки."
        source: { kind: translated, id: 8529808 }
      - pl: "Irytuje nas ten ciągły hałas."
        ru: "Нас раздражает этот постоянный шум."
        source: { kind: translated, id: 2213160 }
  - id: get-annoyed
    ru: "раздражаться, злиться (irytować się)"
    note: "С się: irytować się na kogoś — «злиться на кого-то»."
    examples:
      - pl: "Nie irytuj się tak."
        ru: "Не раздражайся так."
        source: { kind: translated, id: 758324 }
      - pl: "Ona się szybko irytuje."
        ru: "Она быстро раздражается."
        source: { kind: translated, id: 402675 }
      - pl: "Czy łatwo się irytujesz?"
        ru: "Ты легко раздражаешься?"
        source: { kind: translated, id: 6306828 }
notes:
  - { kind: government, text: "Кого — винительный: IRYTUJE MNIE, IRYTUJE GO. Подлежащим часто бывает то, что раздражает: TEN HAŁAS MNIE IRYTUJE «меня раздражает этот шум». С SIĘ — «раздражаться»: IRYTOWAĆ SIĘ NA KOGOŚ (на кого), Z POWODU CZEGOŚ (из-за чего)." }
  - { kind: usage, text: "Несовершенный вид; совершенный — ZIRYTOWAĆ (SIĘ). Спряжение на -UJĘ, как у всех глаголов на -OWAĆ: IRYTUJĘ, IRYTUJESZ, IRYTUJĄ. Причастие IRYTUJĄCY стало обычным прилагательным «раздражающий, надоедливый»: JESTEŚ IRYTUJĄCY." }
  - { kind: register, text: "Слово нейтральное, чуть книжнее, чем DENERWOWAĆ. В разговоре чаще говорят DENERWUJE MNIE или WKURZA MNIE (грубовато)." }
collocations:
  - { pl: "irytować się na kogoś", ru: "злиться на кого-то" }
  - { pl: "irytować się z byle powodu", ru: "раздражаться по любому поводу" }
  - { pl: "irytujący hałas", ru: "раздражающий шум" }
family:
  - { pl: "zirytować", ru: "раздражить, разозлить", relation: aspect }
  - { pl: "irytacja", ru: "раздражение", relation: derived }
  - { pl: "irytujący", ru: "раздражающий, надоедливый", relation: derived }
  - { pl: "denerwować", ru: "нервировать, злить", relation: root, id: denerwowac }
etymology: "Из латинского irritare «раздражать, дразнить»; тот же корень в русских «ирритация», «ирритант»."
memory: "Irytować — раздражать: латинское irritare, как в медицинском «ирритация». Irytuje mnie — меня раздражает."
idioms:
  - { pl: "irytować kogoś do białości", ru: "доводить кого-то до белого каления" }
