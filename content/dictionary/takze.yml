# review
id: takze
format: 2
lemma: "także"
rank: 525
pos: part
pron: { cyr: "та́гже" }
senses:
  - id: also
    ru: "также, тоже"
    examples:
      - pl: "Mam starszego brata, a także starszą siostrę."
        ru: "У меня есть старший брат, а также старшая сестра."
        source: { kind: translated, id: 645903 }
      - pl: "Ja także."
        ru: "Я тоже."
        source: { kind: translated, id: 560141 }
      - pl: "Ja także poszłam."
        ru: "Я тоже пошла."
        source: { kind: translated, id: 5868709 }
  - id: as-well-as
    ru: "а также: связка в перечислении"
    examples:
      - pl: "Zaprosiliśmy rodziców, a także dziadków."
        ru: "Мы пригласили родителей, а также дедушку с бабушкой."
        source: { kind: authored }
      - pl: "Mówi po polsku, a także po rosyjsku."
        ru: "Он говорит по-польски, а также по-русски."
        source: { kind: authored }
      - pl: "Nie tylko czyta, ale także pisze."
        ru: "Он не только читает, но и пишет."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Слово сложено буквально как русское «также»: tak + że = «так» + «же»." }
  - { kind: false-friend, text: "Главная ловушка на письме: także «также» и tak że «так что» звучат одинаково, но пишутся по-разному. Tak że musimy iść «Так что нам надо идти»." }
  - { kind: usage, text: "W разговорной речи чаще говорят też; także звучит книжнее и официальнее." }
  - { kind: usage, text: "Стандартная конструкция противопоставления: nie tylko..., ale także... «не только..., но и...»." }
collocations:
  - { pl: "a także", ru: "а также" }
  - { pl: "ja także", ru: "я тоже" }
  - { pl: "nie tylko..., ale także", ru: "не только..., но и" }
  - { pl: "a także dlatego", ru: "а также потому" }
etymology: "Сложение tak + że. Русское «также» собрано ровно из тех же частей — «так» и «же»."
memory: "także — «также, тоже», и слово сложено буквально как русское «также»: tak + że. В разговоре чаще говорят też, а także звучит книжнее. Главная ловушка на письме: także «также» и tak że «так что» — омофоны, но пишутся по-разному."
idioms:
