# review
id: wyjechac
format: 2
lemma: "wyjechać"
rank: 728
pos: verb
aspect: perf
pron: { cyr: "вы́ехаць" }
senses:
  - id: leave
    ru: "уехать, выехать"
    examples:
      - pl: "Chcę wyjechać za granicę."
        ru: "Я хочу поехать за границу."
        source: { kind: tatoeba, id: 588401 }
      - pl: "Zdecydował się wyjechać za granicę."
        ru: "Он решил уехать за границу."
        source: { kind: tatoeba, id: 575448 }
      - pl: "Wyjechała za granicę."
        ru: "Она уехала за границу."
        source: { kind: tatoeba, id: 12040200 }
  - id: leave-to
    ru: "wyjechać DO czegoś — уехать в (родительный)"
    examples:
      - pl: "On wyjechał do Londynu na początku lipca."
        ru: "Он уехал в Лондон в начале июля."
        source: { kind: tatoeba, id: 3659334 }
      - pl: "Wyjechał do Londynu."
        ru: "Он уехал в Лондон."
        source: { kind: translated, id: 3446618 }
      - pl: "Ona wyjechała do USA."
        ru: "Она уехала в США."
        source: { kind: tatoeba, id: 598253 }
  - id: leave-from
    ru: "wyjechać Z czegoś — уехать из (родительный)"
    examples:
      - pl: "Nie wyjadę z Bostonu."
        ru: "Я не уеду из Бостона."
        source: { kind: translated, id: 3841242 }
      - pl: "To dlatego wyjechałem z Bostonu."
        ru: "Вот почему я уехал из Бостона."
        source: { kind: translated, id: 3828825 }
      - pl: "Wyjedzie z Japonii w kwietniu."
        ru: "Он уедет из Японии в апреле."
        source: { kind: translated, id: 363105 }
  - id: future
    ru: "wyjadę, wyjedziesz — уеду, уедешь"
    note: "Будущее идёт не от инфинитива."
    examples:
      - pl: "Kiedy wyjedziesz, będę tęsknił za tobą."
        ru: "Когда ты уедешь, я буду по тебе скучать."
        source: { kind: translated, id: 529673 }
      - pl: "Kiedy wyjedziesz z Japonii, będziemy bardzo tęsknić."
        ru: "Когда ты уедешь из Японии, мы будем очень скучать."
        source: { kind: translated, id: 581334 }
      - pl: "Kiedy wyjedziecie, nam wszystkim będzie was brakować."
        ru: "Нам всем будет вас не хватать, когда вы уедете."
        source: { kind: tatoeba, id: 1728735 }
notes:
  - { kind: government, text: "Три сочетания и два падежа. wyjechać DO Londynu «уехать в Лондон» и wyjechać Z Bostonu «уехать из Бостона» берут родительный. А wyjechać ZA granicę «уехать за границу» — винительный, и это единственное из трёх." }
  - { kind: usage, text: "Будущее время образуется не от инфинитива, и там чередование ja/je: wyjadę, wyjedziesz, wyjedzie, wyjedziemy, wyjedziecie, но снова wyjadą." }
  - { kind: usage, text: "Приставка wy- значит «наружу». От jechać «ехать» сделан целый ряд: przyjechać «приехать», pojechać «поехать», dojechać «доехать», zajechać «заехать»." }
  - { kind: usage, text: "Отглагольного существительного у глагола нет: «отъезд» — это wyjazd. Несовершенный вид — wyjeżdżać." }
collocations:
  - { pl: "wyjechać za granicę", ru: "уехать за границу" }
  - { pl: "wyjechać do Londynu", ru: "уехать в Лондон" }
  - { pl: "wyjechać z Bostonu", ru: "уехать из Бостона" }
  - { pl: "wyjechać na stałe", ru: "уехать навсегда" }
family:
  - { pl: "jechać", ru: "ехать", relation: root }
  - { pl: "przyjechać", ru: "приехать", relation: root }
  - { pl: "wyjazd", ru: "отъезд", relation: derived }
  - { pl: "wyjeżdżać", ru: "уезжать", relation: aspect }
etymology: "wy- + jechać «ехать» — та же сборка, что русское «вы-ехать»."
memory: "wyjechać — «уехать, выехать», собрано как русское «вы-ехать». Труднее всего управление: wyjechać DO Londynu и wyjechać Z Bostonu берут родительный, а wyjechać ZA granicę — винительный. И будущее идёт не от инфинитива, с чередованием ja/je: wyjadę, wyjedziesz, wyjedzie, но снова wyjadą."
idioms:
  - { pl: "wyjechać za granicę", ru: "уехать за границу" }
  - { pl: "wyjechać na stałe", ru: "уехать навсегда" }
  - { pl: "wyjechać z miasta", ru: "уехать из города" }
formExamplesSkip:
