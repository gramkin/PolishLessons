  - { form: "wyjechanie", reason: "отглагольного существительного от wyjechać нет; «отъезд» — это wyjazd" }
  - { form: "wyjechaniem", reason: "отглагольного существительного от wyjechać нет; «отъезд» — это wyjazd" }
  - { form: "wyjechaniu", reason: "отглагольного существительного от wyjechać нет; «отъезд» — это wyjazd" }
