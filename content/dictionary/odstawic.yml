# review
id: odstawic
format: 2
lemma: "odstawić"
rank: 5082
pos: verb
pron: { cyr: "одста́виць" }
senses:
  - id: put-back
    ru: "поставить (обратно, в сторону), отставить"
    examples:
      - pl: "Odstawił kubek na stół."
        ru: "Он поставил кружку на стол."
        source: { kind: authored }
      - pl: "Odstaw to na miejsce."
        ru: "Поставь это на место."
        source: { kind: authored }
      - pl: "Odstawmy ten temat na bok."
        ru: "Давайте отложим эту тему."
        source: { kind: authored }
  - id: deliver
    ru: "отвезти, доставить (кого-то, что-то куда-то)"
    examples:
      - pl: "Odstawię dziecko do przedszkola i przyjadę."
        ru: "Я отвезу ребёнка в садик и приеду."
        source: { kind: authored }
      - pl: "Muszę odstawić auto do warsztatu."
        ru: "Мне надо отогнать машину в мастерскую."
        source: { kind: authored }
  - id: quit
    ru: "бросить, перестать принимать (лекарство, сахар, алкоголь)"
    examples:
      - pl: "Lekarz kazał mi odstawić cukier."
        ru: "Врач велел мне отказаться от сахара."
        source: { kind: authored }
      - pl: "Odstawiła leki bez konsultacji z lekarzem."
        ru: "Она бросила лекарства, не посоветовавшись с врачом."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ODSTAWIĆ — не только «отставить в сторону», но и «отвезти»: ODSTAWIĆ DZIECKO DO SZKOŁY, и «бросить принимать»: ODSTAWIĆ LEKI. Русское «отставка» по-польски — DYMISJA, а «отставить» как команда — по-польски так не говорят." }
  - { kind: usage, text: "Пятьдесят три формы. ODSTAWIENI — о людях, которых отстранили: ODSTAWIENI NA BOCZNY TOR. Будущее: ODSTAWIĘ, ODSTAWISZ, повелительное ODSTAW. Несовершенный вид — ODSTAWIAĆ." }
  - { kind: government, text: "Что — винительный, куда — NA с винительным: NA MIEJSCE, NA BOK; или DO с родительным: DO LODÓWKI, DO WARSZTATU. Кого куда — ODSTAWIĆ GOŚCI NA LOTNISKO. Под что — POD с винительным: POD DOM." }
  - { kind: pronunciation, text: "Читается «одста́виць», ударение на предпоследнем слоге. ODSTAWIĘ — «одста́вье». ODSTAW — «о́дстаф»: конечное W оглушается." }
  - { kind: register, text: "В значениях «поставить» и «отвезти» — нейтральное, бытовое. ODSTAWIĆ SZOPKĘ, ODSTAWIĆ NUMER — разговорное «устроить спектакль, выкинуть номер». ODSTAWIĆ NA BOCZNY TOR — газетное." }
collocations:
  - { pl: "odstawić na miejsce", ru: "поставить на место" }
  - { pl: "odstawić dziecko do szkoły", ru: "отвезти ребёнка в школу" }
  - { pl: "odstawić leki", ru: "бросить принимать лекарства" }
family:
  - { pl: "stawiać", ru: "ставить", relation: root, id: stawiac }
  - { pl: "postawić", ru: "поставить", relation: derived, id: postawic }
  - { pl: "odstawiać", ru: "отставлять; отвозить", relation: aspect }
etymology: "Приставка OD- «от-» плюс STAWIĆ «ставить», праславянское *staviti. Русское «отставить» — то же строение; значения «отвезти» и «бросить» развились в польском."
memory: "Odstawić — поставить обратно: odstaw kubek. Отвезти: odstawię dziecko do szkoły. Бросить: odstawić cukier. Читается «одста́виць»."
idioms:
  - { pl: "odstawić kogoś na boczny tor", ru: "отодвинуть кого-то на второй план, задвинуть" }
