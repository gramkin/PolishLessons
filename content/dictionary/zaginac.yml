# review
id: zaginac
format: 2
lemma: "zaginąć"
rank: 1624
pos: verb
aspect: perf
pron: { cyr: "заги́нонць" }
senses:
  - id: go-missing
    ru: "пропасть без вести, исчезнуть"
    examples:
      - pl: "Tom zaginął."
        ru: "Том пропал."
        source: { kind: translated, id: 10588416 }
      - pl: "Tom zaginął w październiku."
        ru: "Том пропал в октябре."
        source: { kind: tatoeba, id: 10602892 }
      - pl: "Tom wezwał policję i zgłosił, że jego córka zaginęła."
        ru: "Том вызвал полицию и заявил, что его дочь пропала."
        source: { kind: translated, id: 6155596 }
  - id: be-lost
    ru: "пропасть, затеряться (о вещах)"
    examples:
      - pl: "Moje listy z Afryki zaginęły."
        ru: "Мои письма из Африки пропали."
        source: { kind: translated, id: 2178477 }
      - pl: "Mój drogi kotek zaginął przed tygodniem."
        ru: "Мой дорогой котёнок пропал неделю назад."
        source: { kind: translated, id: 1863921 }
      - pl: "Co zaginęło?"
        ru: "Что пропало?"
        source: { kind: translated, id: 8547606 }
notes:
  - { kind: usage, text: "Безличная форма zaginięto оставлена без примеров: zaginąć непереходный, и форма на -no/-to у таких глаголов практически не встречается. Говорят ktoś zaginął, zaginęło dziecko." }
  - { kind: usage, text: "Глагол о людях значит «пропасть без вести»: zaginiony «пропавший без вести», osoba zaginiona «пропавший человек»." }
  - { kind: usage, text: "Базовая форма zaginąć в корпусе не встречается ни разу — слово живёт в прошедшем времени: zaginął, zaginęła, zaginęły." }
  - { kind: false-friend, text: "Не путайте с zaginać «загибать» — другой глагол, отличается одной буквой в основе (ą против a). В корпусе он не встречается вовсе." }
  - { kind: usage, text: "Соседние по смыслу слова: zniknąć «исчезнуть», zgubić się «потеряться», przepaść «пропасть»." }
collocations:
  - { pl: "osoba zaginiona", ru: "пропавший без вести" }
  - { pl: "zaginąć bez śladu", ru: "пропасть без следа" }
  - { pl: "zgłosić zaginięcie", ru: "заявить о пропаже" }
etymology: "Приставка za- + ginąć «гибнуть, пропадать», праславянское *gyb-. Русское «загинуть» устарело, но «гибнуть» и «погибнуть» — то же гнездо; польское zaginąć значит мягче: «пропасть без вести»."
memory: "zaginąć = «пропасть без вести»: Tom zaginął «Том пропал». Базовая форма в корпусе не встречается — слово живёт в прошедшем времени. И не путайте с zaginać «загибать», которое отличается одной буквой."
