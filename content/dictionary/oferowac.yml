# review
id: oferowac
format: 2
lemma: "oferować"
rank: 2809
pos: verb
pron: { cyr: "офэрова́ць" }
senses:
  - id: offer
    ru: "предлагать"
    examples:
      - pl: "Oferują pomoc za darmo."
        ru: "Они предлагают помощь бесплатно."
        source: { kind: authored }
      - pl: "Oferuję ci lepsze warunki."
        ru: "Я предлагаю тебе лучшие условия."
        source: { kind: authored }
      - pl: "Mieszkania oferowano bez pośredników."
        ru: "Квартиры предлагали без посредников."
        source: { kind: authored }
  - id: provide
    ru: "предоставлять (услугу, товар)"
    examples:
      - pl: "Hotel oferuje basen i siłownię."
        ru: "Отель предоставляет бассейн и спортзал."
        source: { kind: authored }
      - pl: "Oferowany kurs trwa dwa miesiące."
        ru: "Предлагаемый курс длится два месяца."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Самое важное — различить два почти одинаковых глагола, у которых корни совсем разные. OFEROWAĆ значит «предлагать», от OFERTA, из латинского offerre. А OFIAROWAĆ значит «пожертвовать, преподнести в дар», от OFIARA «жертва». Разница в одной букве и в целом смысле: OFEROWAŁ MI PRACĘ — «он предложил мне работу», а OFIAROWAŁ MI KSIĄŻKĘ — «он подарил мне книгу». Русскому легко спутать, потому что оба слова выглядят чужими и книжными." }
  - { kind: usage, text: "Существительное OFERTA в польском куда обиходнее, чем русская «оферта». По-русски это слово юридическое и в магазине его не увидишь, а по-польски OFERTA — это обычное «предложение» или «акция»: OFERTA SPECJALNA в витрине значит «специальное предложение», NASZA OFERTA — «наш ассортимент». Так что встретив OFERTA, читайте «предложение», а не юридический термин." }
  - { kind: government, text: "Управление совпадает с русским: OFEROWAĆ COŚ KOMUŚ — винительный на предмете и дательный на человеке, ровно как «предлагать что-то кому-то». OFERUJĘ CI LEPSZE WARUNKI. Можно и без адресата: HOTEL OFERUJE BASEN. А вот возвратного OFEROWAĆ SIĘ в польском нет — «предлагать себя» будет PROPONOWAĆ SIĘ или ZGŁASZAĆ SIĘ. Совершенная пара — ZAOFEROWAĆ." }
  - { kind: pronunciation, text: "Глагол из класса на -OWAĆ, уже разобранного в карточках DOPILNOWAĆ, DOPASOWAĆ и ZORIENTOWAĆ: в настоящем времени -owa- сменяется на -uj-, то есть OFERUJĘ, OFERUJESZ, OFERUJE, OFERUJĄ, повелительное OFERUJ. Прошедшее время и причастия держат -owa-: OFEROWAŁ, OFEROWANY, OFEROWANIE. Через этот класс в польский входят почти все заимствованные глаголы, и OFEROWAĆ — типичный пример." }
collocations:
  - { pl: "oferować pomoc", ru: "предлагать помощь" }
  - { pl: "oferta specjalna", ru: "специальное предложение" }
  - { pl: "oferować lepsze warunki", ru: "предлагать лучшие условия" }
family:
  - { pl: "zaoferować", ru: "предложить", relation: aspect, id: zaoferowac }
  - { pl: "oferta", ru: "предложение", relation: derived, id: oferta }
  - { pl: "ofiarować", ru: "пожертвовать, преподнести", relation: root }
etymology: "Из латинского offerre «подносить, предлагать», через западноевропейские языки и немецкое offerieren. Русское «оферта» пришло тем же путём, но осталось в юридическом языке, тогда как польское OFERTA стало обиходным словом. Не путать с гнездом OFIARA «жертва», OFIAROWAĆ «пожертвовать»: оно идёт от праславянского корня и к латинскому offerre отношения не имеет, хотя выглядит почти так же."
memory: "oferować — «предлагать», а ofiarować — «подарить, пожертвовать»: одна буква, разные корни. И oferta по-польски не юридический термин, а обычное «предложение»."
idioms:
