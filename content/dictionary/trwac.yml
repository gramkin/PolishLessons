# review
id: trwac
format: 2
lemma: "trwać"
rank: 923
pos: verb
aspect: imperf
pron: { cyr: "трваць" }
senses:
  - id: last
    ru: "длиться, продолжаться"
    examples:
      - pl: "Jak długo to trwa?"
        ru: "Как долго это длится?"
        source: { kind: tatoeba, id: 6313128 }
      - pl: "Wojna trwała cztery lata."
        ru: "Война продолжалась четыре года."
        source: { kind: tatoeba, id: 3373931 }
      - pl: "Korek trwał godzinę."
        ru: "Пробка длилась час."
        source: { kind: tatoeba, id: 7868549 }
  - id: forever
    ru: "trwać wiecznie — длиться вечно"
    examples:
      - pl: "Wiem, że nic nie trwa wiecznie."
        ru: "Я знаю, что ничто не длится вечно."
        source: { kind: tatoeba, id: 4953052 }
      - pl: "Ani radość ani smutek nie trwają wiecznie."
        ru: "Ни радость, ни печаль не длятся вечно."
        source: { kind: tatoeba, id: 3754116 }
      - pl: "Prawdziwa przyjaźń będzie trwać zawsze."
        ru: "Настоящая дружба будет длиться вечно."
        source: { kind: tatoeba, id: 6602721 }
  - id: persist
    ru: "trwać przy czymś — держаться чего-л., упорствовать"
    note: "С предлогом przy глагол значит «не отступать»."
    examples:
      - pl: "Trwali w małżeństwie z myślą o dzieciach."
        ru: "Они не разводились ради детей."
        source: { kind: translated, id: 842090 }
      - pl: "Trwał przy swoim zdaniu."
        ru: "Он держался своего мнения."
        source: { kind: authored }
      - pl: "Trwamy przy dawnych zwyczajach."
        ru: "Мы держимся прежних обычаев."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Подлежащее при глаголе — обычно событие или отрезок времени, а не человек: Wojna trwała cztery lata «Война длилась четыре года», Film trwał dwie godziny." }
  - { kind: government, text: "trwać PRZY czymś значит «держаться чего-то, упорствовать»: trwać przy swoim zdaniu «стоять на своём». Тут подлежащим уже бывает человек." }
  - { kind: usage, text: "Совершенного вида у глагола по сути нет: «продлиться» передаётся через potrwać. Ile to potrwa? «Сколько это продлится?»." }
  - { kind: usage, text: "Прилагательное trwały значит «прочный, долговечный», существительное trwanie — «длительность». А nietrwały — «непрочный»." }
collocations:
  - { pl: "jak długo to trwa?", ru: "как долго это длится?" }
  - { pl: "trwać wiecznie", ru: "длиться вечно" }
  - { pl: "trwać przy swoim", ru: "стоять на своём" }
  - { pl: "trwały", ru: "прочный" }
family:
  - { pl: "potrwać", ru: "продлиться", relation: aspect }
  - { pl: "trwały", ru: "прочный", relation: derived }
  - { pl: "trwanie", ru: "длительность", relation: derived }
etymology: "Праславянское *trъvati «сносить, длиться». В русском прямого потомка нет — «длиться» слово другого корня, — так что trwać запоминается отдельно."
memory: "trwać — «длиться, продолжаться». Подлежащее обычно событие, а не человек: Wojna trwała cztery lata. Но с предлогом przy глагол меняет роль: trwać przy swoim zdaniu «стоять на своём». Совершенный вид — potrwać: Ile to potrwa?"
idioms:
  - { pl: "jak długo to trwa?", ru: "как долго это длится?" }
  - { pl: "trwać wiecznie", ru: "длиться вечно" }
  - { pl: "trwać przy swoim", ru: "стоять на своём" }
formExamplesSkip:
  - { form: "trwano", reason: "trwać — непереходный глагол: страдательных форм он не образует" }
