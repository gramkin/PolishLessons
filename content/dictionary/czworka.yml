notes:
  - { kind: usage, text: "Это существительное от числительного, и в польском такие формы живут гораздо активнее, чем можно подумать: ими называют цифру, номер маршрута, школьную отметку и группу людей. Весь ряд стоит выучить сразу, он строится одинаково: JEDYNKA, DWÓJKA, TRÓJKA, CZWÓRKA, PIĄTKA, SZÓSTKA. В школе отметки идут от JEDYNKA, худшей, до SZÓSTKA, лучшей, и CZWÓRKA посередине — заметьте, что русская пятибалльная шкала здесь не работает, и польская CZWÓRKA не равна русской четвёрке по смыслу. Автобус или трамвай номер четыре — тоже CZWÓRKA." }
  - { kind: pronunciation, text: "Читается «чву́рка», ударение на первом слоге из двух. Начальное CZW даёт «чв», и это стечение для русского непривычно: ни гласной, ни паузы между Ч и В нет. Буква Ó даёт «у», поэтому не «чворка», а «чву́рка». В дательном и местном падеже CZWÓRCE согласная K переходит в C: «чву́рце». Это то же чередование, что в PANIKA и PANICE, SEKRETARKA и SEKRETARCE, ODZNAKA и ODZNACE." }
  - { kind: government, text: "Женский род на -A, склонение правильное. Винительный на -Ę: DOSTAŁ CZWÓRKĘ. По чему отметка — предлог Z с родительным: CZWÓRKA Z MATEMATYKI «четвёрка по математике», и русский здесь берёт «по», так что предлог придётся переучить. Группа людей в творительном множественном означает способ передвижения: SZLI CZWÓRKAMI «шли по четверо», и это устойчивая конструкция, как DWÓJKAMI, TRÓJKAMI. При отрицании винительный уходит в родительный: NIE DOSTAŁ CZWÓRKI." }
  - { kind: false-friend, text: "Ловушка в школьной шкале, и она существенная. Польская CZWÓRKA — это хорошая, но не лучшая оценка в шестибалльной системе, где лучшая SZÓSTKA, а худшая JEDYNKA. Русская «четвёрка» в пятибалльной системе стоит второй сверху. Поэтому CZWÓRKA по ощущению ближе к русской четвёрке, но формально это середина шкалы, а не вторая позиция, и при переводе школьных документов разница существенна. Числовое значение, разумеется, совпадает: цифра четыре везде четыре." }
