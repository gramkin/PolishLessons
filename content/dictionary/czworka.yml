etymology: "От числительного CZTERY «четыре» через порядковое CZWARTY «четвёртый», с суффиксом -KA, который в польском образует существительные от числительных. Корень праславянский, *četyre, и русские «четыре», «четвёртый», «четвёрка» — его же потомки, построенные тем же способом и с тем же суффиксом. Расхождение только фонетическое: польское CZW- на месте русского «четв-», с выпадением гласной, и Ó на месте русского «ё». Поэтому слово узнаётся на письме сразу, а на слух почти нет: «чву́рка» и «четвёрка» звучат непохоже, хотя это одно и то же слово, собранное из одних частей."
memory: "Весь ряд строится одинаково: jedynka, dwójka, trójka, czwórka, piątka, szóstka — и называет цифру, номер трамвая, отметку и группу людей. Школьная шкала шестибалльная: лучшая szóstka, худшая jedynka, так что czwórka это середина, а не вторая сверху. Отметка по предмету — z matematyki, с родительным. Читается «чву́рка», без гласной между ч и в."
