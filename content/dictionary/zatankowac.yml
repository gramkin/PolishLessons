# review
id: zatankowac
format: 2
lemma: "zatankować"
rank: 5963
pos: verb
aspect: perf
pron: { cyr: "затанко́ваць" }
senses:
  - id: refuel
    ru: "заправить (машину, бак топливом)"
    examples:
      - pl: "Tom podjechał na stację zatankować samochód."
        ru: "Том подъехал на заправку заправить машину."
        source: { kind: translated, id: 11564260 }
      - pl: "Czy samochód jest zatankowany?"
        ru: "Машина заправлена?"
        source: { kind: translated, id: 6154819 }
      - pl: "Przed trasą zatankuję do pełna."
        ru: "Перед дорогой заправлюсь под завязку."
        source: { kind: authored }
  - id: fill-up
    ru: "залить (определённое топливо, количество)"
    examples:
      - pl: "Zatankowałem czterdzieści litrów benzyny."
        ru: "Я залил сорок литров бензина."
        source: { kind: authored }
      - pl: "Przez pomyłkę zatankowała ropę zamiast benzyny."
        ru: "По ошибке она залила дизель вместо бензина."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Совершенный вид; несовершенный — TANKOWAĆ «заправлять(ся)». Настоящего времени нет: ZATANKUJĘ — «заправлюсь», будущее. Спряжение -OWAĆ → -UJĘ: ZATANKUJĘ, ZATANKUJESZ, ZATANKUJĄ; повелительное ZATANKUJ." }
  - { kind: government, text: "Что заправляют и чем — оба в винительном: ZATANKOWAĆ SAMOCHÓD, ZATANKOWAĆ BENZYNĘ. «Заправиться» без дополнения — тоже просто ZATANKOWAĆ, без SIĘ: MUSZĘ ZATANKOWAĆ «мне надо заправиться». Полный бак — DO PEŁNA." }
  - { kind: false-friend, text: "TANKOWAĆ не связано с танками: TANK здесь — «бак, резервуар» (из английского). Танк по-польски тоже CZOŁG. Заправка — STACJA BENZYNOWA, разговорно STACJA." }
  - { kind: usage, text: "Мужско-личное страдательное ZATANKOWANI в карточку не включено: заправляют машины, а не людей. Разговорное «он хорошо заправился» в смысле «выпил» по-польски тоже бывает, но это сленг." }
collocations:
  - { pl: "zatankować do pełna", ru: "заправить полный бак" }
  - { pl: "zatankować samochód", ru: "заправить машину" }
  - { pl: "zatankować na stacji", ru: "заправиться на заправке" }
family:
  - { pl: "tankować", ru: "заправлять(ся)", relation: aspect }
  - { pl: "tankowanie", ru: "заправка (действие)", relation: derived }
  - { pl: "benzyna", ru: "бензин", relation: root, id: benzyna }
  - { pl: "paliwo", ru: "топливо", relation: root, id: paliwo }
etymology: "Приставка ZA- плюс TANKOWAĆ, от английского tank «бак, цистерна»."
memory: "Tank — «бак», не «танк»: zatankować — «залить бак». Zatankuj do pełna!"
idioms:
  - { pl: "zatankować do pełna", ru: "заправиться под завязку (и перен. наесться, напиться)" }
formExamplesSkip:
  - { form: "zatankowani", reason: "мужско-личная форма: заправляют машины и баки, а не людей" }
