# review
id: mnostwo
format: 2
lemma: "mnóstwo"
rank: 1059
pos: noun
pron: { cyr: "мну́ство" }
senses:
  - id: lots
    ru: "множество, масса"
    examples:
      - pl: "Zjedliśmy mnóstwo jabłek."
        ru: "Мы съели множество яблок."
        source: { kind: translated, id: 2900785 }
      - pl: "Mamy jeszcze mnóstwo czasu."
        ru: "У нас ещё полно времени."
        source: { kind: translated, id: 928182 }
      - pl: "Jest mnóstwo innych sposobów."
        ru: "Есть множество других способов."
        source: { kind: translated, id: 6109654 }
  - id: genitive
    ru: "mnóstwo czegoś — множество чего-то"
    note: "Требует родительного падежа, как и русское «множество»."
    examples:
      - pl: "Aby opanować obcy język, trzeba mnóstwo ćwiczeń."
        ru: "Чтобы освоить иностранный язык, нужно много практики."
        source: { kind: translated, id: 629894 }
      - pl: "Przykładów może być mnóstwo."
        ru: "Примеров может быть множество."
        source: { kind: translated, id: 2064618 }
      - pl: "Mam mnóstwo pracy."
        ru: "У меня масса работы."
        source: { kind: authored }
  - id: dative
    ru: "mnóstwu — множеству (дательный)"
    examples:
      - pl: "To uratowało życie mnóstwu ludzi."
        ru: "Это спасло жизнь множеству людей."
        source: { kind: translated, id: 12624974 }
      - pl: "Pomogło to mnóstwu ludzi."
        ru: "Это помогло множеству людей."
        source: { kind: authored }
      - pl: "Przyjrzał się mnóstwu zdjęć."
        ru: "Он просмотрел множество фотографий."
        source: { kind: authored }
notes:
  - { kind: government, text: "mnóstwo CZEGOŚ — с родительным падежом: mnóstwo czasu «масса времени», mnóstwo ludzi «множество людей». Русское «множество» управляет так же." }
  - { kind: usage, text: "Глагол при слове стоит в среднем роде единственного числа: Przyszło mnóstwo ludzi «Пришло множество людей», а не «przyszli»." }
  - { kind: usage, text: "Разговорный синоним — masa, книжный — wiele. Mnóstwo чуть эмоциональнее, чем wiele." }
  - { kind: usage, text: "Слово почти не склоняется в живой речи: кроме именительного и винительного mnóstwo встречается разве что дательный mnóstwu." }
collocations:
  - { pl: "mnóstwo czasu", ru: "масса времени" }
  - { pl: "mnóstwo ludzi", ru: "множество людей" }
  - { pl: "mnóstwo pracy", ru: "масса работы" }
  - { pl: "mnóstwo razy", ru: "множество раз" }
family:
  - { pl: "mnogi", ru: "многочисленный", relation: root }
  - { pl: "mnożyć", ru: "умножать", relation: derived }
etymology: "Праславянское *mъnožьstvo, от *mъnogъ «многий» — то же слово, что русское «множество»."
memory: "mnóstwo — «множество, масса», с родительным падежом: mnóstwo czasu. Глагол при нём стоит в среднем роде единственного числа: Przyszło mnóstwo ludzi."
