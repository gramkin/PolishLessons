  - { pl: "przypadkowe spotkanie", ru: "случайная встреча" }
  - { pl: "przypadkowe osoby", ru: "посторонние лица" }
family:
  - { pl: "przypadek", ru: "случай; падеж", relation: root, id: przypadek }
  - { pl: "przypadkiem", ru: "случайно", relation: derived }
  - { pl: "celowy", ru: "намеренный", relation: antonym }
etymology: "От przypadek «случай», а то — от przypaść «припасть, выпасть»: случай это то, что выпало. Тем же путём шли латинское casus от cadere «падать» и русский «падеж», переведённый с него слово в слово. Русское «припадок» сделано из той же приставки и корня, но пошло по медицинской дороге."
memory: "przypadkowy — «случайный», от przypadek «СЛУЧАЙ», а не «припадок»: припадок это atak. И у przypadek есть второе значение — «падеж»: случай и падеж тут одно слово, как в латинском casus."
idioms:
  - { pl: "przypadkowe spotkanie", ru: "случайная встреча" }
  - { pl: "nie przypadkiem", ru: "не случайно" }
