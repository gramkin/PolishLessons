notes:
  - { kind: false-friend, text: "КОРЕНЬ ВЕДЁТ НЕ ТУДА, КУДА КАЖЕТСЯ. Przypadek — это «СЛУЧАЙ», а вовсе не «припадок»; припадок по-польски atak или napad. Хуже того, у przypadek есть и грамматическое значение: «ПАДЕЖ». Оба смысла из одного образа — того, что выпало: латинское casus тоже значит и случай, и падеж, и русское «падеж» сделано по той же мерке." }
  - { kind: pronunciation, text: "Пять слогов, ударение на предпоследнем: przy-pad-KO-wy. Группа prz звучит как «пш», d перед k оглушается: «пшыпатко́вы». В женском роде ударение там же: przy-pad-KO-wa." }
  - { kind: usage, text: "ОДНА ФОРМА СОВПАДАЕТ С ФОРМОЙ СУЩЕСТВИТЕЛЬНОГО. Przypadkowi — это и мужско-личное множественное прилагательного (przypadkowi świadkowie «случайные свидетели»), и дательный падеж существительного przypadek (dzięki przypadkowi «благодаря случаю»). Различает только согласование, как у пары polityka и polityk." }
  - { kind: register, text: "Степеней сравнения нет: слово относительное, как wojenny и szkolny, — случайность либо есть, либо нет. Отсюда одиннадцать форм. Если нужна степень, говорят описательно: bardziej przypadkowy." }
collocations:
