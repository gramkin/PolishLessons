id: jadlo
format: 2
lemma: "jadło"
rank: 3869
pos: noun
pron: { cyr: "я́дуо" }
senses:
  - id: food
    ru: "еда, яства (книжн., шутл., по-деревенски)"
    examples:
      - pl: "Na stole nie brakowało jadła i napitku."
        ru: "На столе хватало и еды, и питья."
        source: { kind: authored }
      - pl: "Karczma słynęła z dobrego jadła."
        ru: "Корчма славилась хорошей едой."
        source: { kind: authored }
      - pl: "Polskie jadło to bigos, pierogi i żurek."
        ru: "Польская еда — это бигос, вареники и журек."
        source: { kind: authored }
  - id: rustic-cuisine
    ru: "деревенская кухня (в названиях ресторанов)"
    examples:
      - pl: "Zjedliśmy obiad w restauracji „Chłopskie Jadło”."
        ru: "Мы пообедали в ресторане «Крестьянская еда»."
        source: { kind: authored }
      - pl: "Jadło staropolskie podają tu na glinianych talerzach."
        ru: "Старопольскую еду здесь подают на глиняных тарелках."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Русское «ядло» звучит грубо и устарело, а польское JADŁO — книжное и шутливое, с оттенком старины и деревенского застолья: JADŁO I NAPITEK, «еда и питьё». Обычная еда по-польски JEDZENIE. «Яд» — TRUCIZNA, с JADŁO не связан, хотя по-польски JAD — это змеиный яд." }
  - { kind: usage, text: "Средний род, неодушевлённое, чаще всего в единственном числе: множественное встречается разве что в шутку, и в карточке его нет. Местный падеж с чередованием Ł на L: O JADLE. Устойчивая пара — JADŁO I NAPITEK, «яства и напитки»." }
  - { kind: government, text: "Еда для кого-то — JADŁO DLA KOGOŚ, DLA с родительным. Вдоволь еды — PEŁNO JADŁA, DOSYĆ JADŁA, родительный. Само существительное падежа не требует." }
  - { kind: pronunciation, text: "Читается «я́дуо», два слога, ударение на первом. Ł даёт «у», и выходит «я́-дуо». В местном O JADLE L становится обычной: «я́дле»." }
  - { kind: register, text: "Книжное, архаичное или стилизованное слово. Его любят названия ресторанов «под старину», меню и шуточные тосты. В обычном разговоре JADŁO звучит иронично: CO TAM MASZ DO JADŁA?, «чего там у тебя пожевать?»." }
collocations:
  - { pl: "jadło i napitek", ru: "еда и питьё, яства и напитки" }
  - { pl: "staropolskie jadło", ru: "старопольская еда" }
  - { pl: "chłopskie jadło", ru: "крестьянская еда" }
family:
  - { pl: "jeść", ru: "есть, кушать", relation: root, id: jesc }
  - { pl: "jedzenie", ru: "еда", relation: root, id: jedzenie }
  - { pl: "jadalnia", ru: "столовая (комната)", relation: derived }
etymology: "Общеславянское *jadlo, от корня *jad- «есть», того же, что в JEŚĆ «есть» и русском «еда», «яства». Суффикс -ŁO обозначает предмет действия, как в MYDŁO «мыло» от MYĆ. Русское «ядло» существовало, но стало грубым, а польское JADŁO осталось книжным и тёплым."
memory: "Jadło — еда, яства (книжно, шутливо): jadło i napitek. Обычная еда — jedzenie. От jeść. Читается «я́дуо»."
idioms:
