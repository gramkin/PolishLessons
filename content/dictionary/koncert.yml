# review
id: koncert
format: 2
lemma: "koncert"
rank: 1951
pos: noun
pron: { cyr: "ко́нцэрт" }
senses:
  - id: concert
    ru: "концерт (событие)"
    examples:
      - pl: "Koncert był taki sobie."
        ru: "Концерт был так себе."
        source: { kind: authored }
      - pl: "Idziemy na koncert."
        ru: "Мы идём на концерт."
        source: { kind: authored }
      - pl: "Na koncercie publiczność dopisała."
        ru: "На концерте публика не подвела."
        source: { kind: authored }
  - id: concerto
    ru: "концерт (музыкальное произведение)"
    examples:
      - pl: "W tych koncertach grał sam kompozytor."
        ru: "В этих концертах играл сам композитор."
        source: { kind: authored }
      - pl: "Zajmuje się koncertami kameralnymi."
        ru: "Он занимается камерными концертами."
        source: { kind: authored }
notes:
  - { kind: government, text: "Главное здесь — пара падежей, и она совпадает с русской. Направление: iść NA KONCERT, винительный, «идти на концерт». Место: być NA KONCERCIE, предложный, «быть на концерте». Один и тот же предлог na, разные падежи, ровно как по-русски." }
  - { kind: usage, text: "Предложный падеж — koncercie, с чередованием t → ć. Та же модель у целого ряда заимствований на -t: kontrakt — w kontrakcie, efekt — w efekcie, funt — w funcie." }
  - { kind: false-friend, text: "Ловушки нет: польское koncert и русское «концерт» — одно и то же заимствование из итальянского, и оба сохранили оба значения, событие и музыкальную форму. Запоминать надо только падежи." }
collocations:
  - { pl: "iść na koncert", ru: "идти на концерт" }
  - { pl: "być na koncercie", ru: "быть на концерте" }
  - { pl: "koncert fortepianowy", ru: "фортепианный концерт" }
family:
  - { pl: "koncertowy", ru: "концертный", relation: derived }
  - { pl: "koncertować", ru: "давать концерты", relation: derived }
etymology: "Из итальянского concerto, от concertare — слова со спорной историей: его связывают и с «состязаться», и с «согласовывать», что хорошо отвечает сути жанра, где солист и оркестр делают и то и другое. В русский слово пришло тем же путём через западноевропейские языки, поэтому koncert и «концерт» совпадают."
memory: "koncert — «концерт», то же заимствование. Всё дело в падежах: na koncert (винительный) о направлении, na koncercie (предложный) о месте — как в русском «на концерт» и «на концерте»."
idioms:
  - { pl: "koncert życzeń", ru: "концерт по заявкам" }
  - { pl: "dać koncert", ru: "дать концерт" }
