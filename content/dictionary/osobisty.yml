# review
id: osobisty
format: 2
lemma: "osobisty"
rank: 1013
pos: adj
pron: { cyr: "особи́сты" }
senses:
  - id: personal
    ru: "личный, персональный"
    examples:
      - pl: "Wolność osobista to istota demokracji."
        ru: "Свобода личности — душа демократии."
        source: { kind: translated, id: 357274 }
      - pl: "To tylko moja osobista opinia."
        ru: "Это всего лишь моё личное мнение."
        source: { kind: translated, id: 6441600 }
      - pl: "To wszystko to moje osobiste rzeczy."
        ru: "Всё это мои личные вещи."
        source: { kind: translated, id: 7151482 }
  - id: id-card
    ru: "dowód osobisty — удостоверение личности"
    note: "Основной документ поляка, не заграничный паспорт."
    examples:
      - pl: "Sami ma swój dowód osobisty."
        ru: "У Сами есть удостоверение личности."
        source: { kind: translated, id: 12058120 }
      - pl: "Szukam mojego dowodu osobistego."
        ru: "Я ищу своё удостоверение личности."
        source: { kind: translated, id: 8764850 }
      - pl: "Jej dowód osobisty okazał się niewystarczający."
        ru: "Её удостоверения личности оказалось недостаточно."
        source: { kind: translated, id: 2246078 }
  - id: in-person
    ru: "личный, при личном присутствии"
    examples:
      - pl: "Mam z nim kontakt osobisty."
        ru: "У меня с ним личный контакт."
        source: { kind: translated, id: 919897 }
      - pl: "Czy możliwy jest odbiór osobisty?"
        ru: "Возможно ли личное получение?"
        source: { kind: translated, id: 3799097 }
      - pl: "Kandydaci są proszeni o osobiste zgłoszenie się."
        ru: "Кандидатов просят явиться лично."
        source: { kind: translated, id: 3929835 }
notes:
  - { kind: usage, text: "dowód osobisty — «удостоверение личности», главный документ поляка. Заграничный паспорт — paszport, это разные вещи." }
  - { kind: usage, text: "To nic osobistego — «Ничего личного». Ответная реплика: Nie obrażam się." }
  - { kind: usage, text: "Слово образовано от osoba «человек, лицо» суффиксом -isty, как и русское «личный» от «лицо»." }
  - { kind: usage, text: "Степеней сравнения нет: «более личный» передаётся только описательно — bardziej osobisty, najbardziej osobisty." }
collocations:
  - { pl: "dowód osobisty", ru: "удостоверение личности" }
  - { pl: "życie osobiste", ru: "личная жизнь" }
  - { pl: "rzeczy osobiste", ru: "личные вещи" }
  - { pl: "z powodów osobistych", ru: "по личным причинам" }
family:
  - { pl: "osoba", ru: "человек, лицо", relation: root, id: osoba }
  - { pl: "osobiście", ru: "лично", relation: derived }
  - { pl: "osobowość", ru: "личность", relation: derived }
etymology: "От osoba «человек, лицо» с суффиксом -isty. Русское «личный» собрано тем же способом от «лицо», так что слова устроены одинаково."
memory: "osobisty — «личный», от osoba. Главное сочетание — dowód osobisty «удостоверение личности», это основной документ поляка, а не загранпаспорт. И запомните To nic osobistego «Ничего личного»."
idioms:
