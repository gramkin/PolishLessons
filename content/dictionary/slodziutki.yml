notes:
  - { kind: false-friend, text: "Как и русское «сладенький», SŁODZIUTKI бывает и о вкусе, и о милоте. Но польское умиление шире: SŁODKI и SŁODZIUTKI — главные слова для «милый, прелестный» о детях и животных, как английское sweet или cute. Русское «сладенький» о человеке звучит приторно или насмешливо, а польское SŁODZIUTKIE DZIECKO — обычный комплимент маме." }
  - { kind: usage, text: "Степеней сравнения нет: слово уже уменьшительно-усилительное. Все одиннадцать форм живые. Форма для мужчин-людей SŁODZIUTCY встречается о маленьких мальчиках: SŁODZIUTCY CHŁOPCY. Чередование: K перед мужским-личным -I превращается в C: SŁODZIUTKI, но SŁODZIUTCY." }
  - { kind: government, text: "Ставится перед существительным или служит сказуемым: SŁODZIUTKI KOTEK, KOTEK JEST SŁODZIUTKI. Падежных требований нет. Часто с восклицанием: JAKI SŁODZIUTKI!, «какой милый!»." }
  - { kind: pronunciation, text: "Читается «суодзю́тки», три слога, ударение на предпоследнем. Ł — «у», DZIU — мягкое «дзю», KI — мягкое «ки». Сравните с SŁODKI «суо́тки»: там D перед K оглушается в «т», а в SŁODZIUTKI D становится мягким «дзь»." }
  - { kind: register, text: "Разговорное, умилённое, часто женское или детское слово. Взрослый мужчина скорее скажет FAJNY или ŁADNY. С иронией SŁODZIUTKI значит «приторный, слащавый»: SŁODZIUTKI UŚMIESZEK, «слащавая улыбочка»." }
collocations:
  - { pl: "słodziutkie dziecko", ru: "прелестный ребёнок" }
  - { pl: "słodziutki kotek", ru: "милый котик" }
  - { pl: "słodziutka herbata", ru: "сладенький чай" }
family:
  - { pl: "słodki", ru: "сладкий; милый", relation: root, id: slodki }
  - { pl: "słodycze", ru: "сладости", relation: derived }
  - { pl: "malutki", ru: "крошечный", relation: derived, id: malutki }
etymology: "От SŁODKI «сладкий», общеславянского *soldъkъ, родственного русскому «сладкий» через перестановку: польское SŁO- против русского «сла-». Суффикс -UTKI ласкательный, тот же, что в MALUTKI и CICHUTKI, а D перед ним смягчилось в DZI."
memory: "Słodziutki — сладенький, и о милоте: słodziutki kotek, słodziutkie dziecko. От słodki. Читается «суодзю́тки». С иронией — слащавый."
idioms:
  - { pl: "słodziutki jak cukierek", ru: "сладенький, как конфетка" }
