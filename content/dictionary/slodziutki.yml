rank: 5036
pos: adj
pron: { cyr: "суодзю́тки" }
senses:
  - id: very-sweet
    ru: "сладенький, очень сладкий"
    examples:
      - pl: "Te truskawki są słodziutkie."
        ru: "Эта клубника сладенькая."
        source: { kind: authored }
      - pl: "Wypił słodziutką herbatę z miodem."
