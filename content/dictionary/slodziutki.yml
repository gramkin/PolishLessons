  - id: cute
    ru: "милый, прелестный (о ребёнке, животном)"
    examples:
      - pl: "Jaki słodziutki szczeniaczek!"
        ru: "Какой милый щеночек!"
        source: { kind: authored }
      - pl: "Ich córeczka jest słodziutka."
        ru: "Их дочурка — прелесть."
