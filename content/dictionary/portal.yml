notes:
  - { kind: false-friend, text: "PORTAL — «портал»: и сайт, и парадный вход здания. PORTAL SPOŁECZNOŚCIOWY — «соцсеть». В разговоре сайт — STRONA, STRONA INTERNETOWA." }
  - { kind: usage, text: "Мужской род, неодушевлённое. Родительный — PORTALU. Множественное — PORTALE, родительный — PORTALI." }
  - { kind: government, text: "На портале — NA PORTALU, NA с местным. Зайти на портал — WEJŚĆ NA PORTAL, винительный. Портал чего — родительный: PORTAL MIASTA." }
  - { kind: pronunciation, text: "Читается «по́рталь»: конечное L мягкое. Ударение на первом слоге." }
collocations:
  - { pl: "portal informacyjny", ru: "новостной портал" }
