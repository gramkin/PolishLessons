# review
id: winda
format: 2
lemma: "winda"
rank: 2029
pos: noun
pron: { cyr: "ви́нда" }
senses:
  - id: lift
    ru: "лифт"
    examples:
      - pl: "Gdzie jest winda?"
        ru: "Где лифт?"
        source: { kind: translated, id: 363769 }
      - pl: "Czy jest winda?"
        ru: "Есть ли лифт?"
        source: { kind: translated, id: 1112234 }
      - pl: "Winda nie działa."
        ru: "Лифт не работает."
        source: { kind: translated, id: 3930124 }
      - pl: "Dlaczego winda nie działa?"
        ru: "Почему лифт не работает?"
        source: { kind: tatoeba, id: 3745223 }
      - pl: "Winda jest zepsuta."
        ru: "Лифт сломан."
        source: { kind: translated, id: 597656 }
      - pl: "Wsiedli do windy."
        ru: "Они вошли в лифт."
        source: { kind: translated, id: 9677022 }
  - id: lift-use
    ru: "ездить на лифте, находиться в лифте"
    examples:
      - pl: "Oni jadą windą."
        ru: "Они едут на лифте."
        source: { kind: translated, id: 8636667 }
      - pl: "Wjechałem windą na piąte piętro."
        ru: "Я поднялся на лифте на пятый этаж."
        source: { kind: translated, id: 3930127 }
      - pl: "Nie wolno palić w windzie."
        ru: "В лифте нельзя курить."
        source: { kind: translated, id: 3930123 }
notes:
  - { kind: false-friend, text: "winda — это «лифт», а не «Windows» и не «винда». Разговорное название системы Windows тоже существует, но это жаргон, а основное значение — подъёмник." }
  - { kind: government, text: "Ехать на лифте — jechać windą, с творительным падежом, как и другими средствами передвижения: jechać autobusem, pociągiem." }
  - { kind: usage, text: "Английское lift в польский не вошло: только winda. В предложном падеже чередование d → dz: w windzie." }
collocations:
  - { pl: "jechać windą", ru: "ехать на лифте" }
  - { pl: "w windzie", ru: "в лифте" }
  - { pl: "winda nie działa", ru: "лифт не работает" }
etymology: "От niemieckiego Winde «лебёдка, ворот», того же корня, что winden «наматывать». Русское «лифт» пришло из английского, поэтому слова совсем не похожи."
memory: "winda — «лифт», а не «винда». Ехать на лифте — jechać windą, творительный падеж. В предложном — w windzie."
idioms:
  - { pl: "jechać windą", ru: "ехать на лифте" }
  - { pl: "w windzie", ru: "в лифте" }
  - { pl: "winda jest zepsuta", ru: "лифт сломан" }
