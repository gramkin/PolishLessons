  - { pl: "blizna", ru: "шрам", relation: root }
etymology: "Из французского tatouage, а то — из полинезийского tatau, привезённого в Европу мореплавателями восемнадцатого века. Слово обошло весь свет почти без изменений. Русский взял ту же французскую форму, но закрепил её за косметической процедурой, а для наколки оставил «татуировку», от той же основы с другим суффиксом."
memory: "tatuaż — «ТАТУИРОВКА», любая. Русский «татуаж» значит совсем другое — перманентный макияж, по-польски makijaż permanentny. Конечное ż оглушается: пишется tatuaż, слышится «тату́аш»."
