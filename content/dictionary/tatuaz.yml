notes:
  - { kind: false-friend, text: "РУССКИЙ «ТАТУАЖ» — ЭТО ДРУГОЕ. По-русски «татуаж» означает перманентный макияж: подводку, брови. Польское tatuaż — это ЛЮБАЯ татуировка, в том числе обычная наколка; перманентный макияж называют makijaż permanentny. Так что tatuaż переводится словом «татуировка», а не созвучным «татуажем»." }
  - { kind: pronunciation, text: "Три слога, ударение на предпоследнем: ta-TU-aż. Конечное ż оглушается до ш: «тату́аш». В косвенных падежах звонкость возвращается: tatuażu — «тату́ажу». Родительный множественного мягкий, на -y: tatuaży." }
  - { kind: usage, text: "Татуировку ДЕЛАЮТ себе: zrobić sobie tatuaż, а мастер её wykonuje. Свести — usunąć tatuaż или wywabić. Мастер называется tatuażysta, салон — studio tatuażu. Прилагательное tatuażowy встречается редко, чаще говорят описательно." }
collocations:
  - { pl: "zrobić sobie tatuaż", ru: "сделать себе татуировку" }
  - { pl: "salon tatuażu", ru: "тату-салон" }
  - { pl: "usunąć tatuaż", ru: "свести татуировку" }
family:
