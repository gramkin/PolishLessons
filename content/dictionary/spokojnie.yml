notes:
  - { kind: usage, text: "Spokojnie! — готовая реплика «Спокойно!», «Не волнуйся!»." }
  - { kind: usage, text: "na spokojnie — разговорное «без спешки, в спокойной обстановке»: Zróbmy to na spokojnie." }
  - { kind: usage, text: "Второе значение — «запросто, легко»: Spokojnie zdążymy «Мы запросто успеем»." }
  - { kind: usage, text: "Наречие от spokojny «спокойный», а то — от spokój «покой». Русское «спокойно» это то же слово." }
collocations:
  - { pl: "spokojnie!", ru: "спокойно!" }
  - { pl: "na spokojnie", ru: "спокойно, без спешки" }
  - { pl: "spać spokojnie", ru: "спать спокойно" }
etymology: "Наречие от spokojny «спокойный», а то — от spokój «покой», праславянское *pokojь. Русские «покой» и «спокойный» — то же самое гнездо."
memory: "spokojnie — «спокойно», и родство видно сразу: внутри spokój «покой». Реплика Spokojnie! значит «Не волнуйся!», а na spokojnie — «без спешки»."
idioms:
