notes:
  - { kind: false-friend, text: "ZACIĄGNĄĆ — «затащить», но ZACIĄGNĄĆ KREDYT — «взять кредит», ZACIĄGNĄĆ ZASŁONY — «задёрнуть шторы». ZACIĄGNĄĆ SIĘ — «затянуться (сигаретой)» и «записаться (в армию)». Русское «затянуть песню» — ZAINTONOWAĆ." }
  - { kind: usage, text: "Пятьдесят три формы, включая ZACIĄGNIĘCI — «затащенные». Будущее: ZACIĄGNĘ, ZACIĄGNIESZ, повелительное ZACIĄGNIJ. Несовершенный вид — ZACIĄGAĆ; ещё он значит «говорить с акцентом, растягивая»: ZACIĄGA ZE WSCHODNIA." }
  - { kind: government, text: "Кого куда — винительный и DO или NA: ZACIĄGNĄĆ DO KINA, NA IMPREZĘ. Что — винительный: ZACIĄGNĄĆ KREDYT. Где — W с предложным: W BANKU. С SIĘ — творительный: ZACIĄGNĄĆ SIĘ DYMEM; куда — DO WOJSKA." }
  - { kind: pronunciation, text: "Читается «зацё́нгнонць»: CIĄG — «цёнг», конечное ĄĆ — «онць», ударение на предпоследнем слоге. ZACIĄGNĘ — «зацё́нгнэ»." }
  - { kind: register, text: "Нейтральное слово. ZACIĄGNĄĆ KREDYT — финансовое и официальное. ZACIĄGNĄĆ KOGOŚ NA IMPREZĘ — разговорное. NIEBO ZACIĄGNĘŁO SIĘ CHMURAMI — книжное «небо затянуло тучами»." }
collocations:
  - { pl: "zaciągnąć kredyt", ru: "взять кредит" }
  - { pl: "zaciągnąć zasłony", ru: "задёрнуть шторы" }
  - { pl: "zaciągnąć się do wojska", ru: "записаться в армию" }
family:
  - { pl: "ciągnąć", ru: "тянуть", relation: root, id: ciagnac }
  - { pl: "pociągnąć", ru: "потянуть", relation: derived, id: pociagnac }
  - { pl: "wyciągnąć", ru: "вытащить", relation: derived, id: wyciagnac }
etymology: "Приставка ZA- плюс CIĄGNĄĆ «тянуть», праславянское *tęgnǫti. Польское Ą соответствует русскому «я»: CIĄGNĄĆ — «тянуть», ZACIĄGNĄĆ — «затянуть»."
memory: "Zaciągnąć — затащить: zaciągnęła męża na zakupy. Zaciągnąć kredyt — взять кредит. Zaciągnąć zasłony — задёрнуть шторы. Читается «зацё́нгнонць»."
idioms:
