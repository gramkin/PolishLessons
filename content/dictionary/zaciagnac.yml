  - id: draw
    ru: "задёрнуть (шторы); затянуть (ремень, ручник)"
    examples:
      - pl: "Zaciągnęła zasłony i zapaliła lampę."
        ru: "Она задёрнула шторы и включила лампу."
        source: { kind: authored }
      - pl: "Zaciągnij hamulec ręczny."
        ru: "Затяни ручник."
        source: { kind: authored }
  - id: incur
    ru: "взять (кредит, долг)"
    examples:
      - pl: "Zaciągnął kredyt na mieszkanie."
        ru: "Он взял кредит на квартиру."
        source: { kind: authored }
      - pl: "Miasto zaciągnęło dług na budowę metra."
        ru: "Город взял в долг на строительство метро."
