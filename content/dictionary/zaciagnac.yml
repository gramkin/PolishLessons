pron: { cyr: "зацё́нгнонць" }
senses:
  - id: drag
    ru: "затащить, затянуть (куда-то)"
    examples:
      - pl: "Zaciągnęła męża na zakupy."
        ru: "Она затащила мужа за покупками."
