# review
id: prosic
format: 2
lemma: "prosić"
rank: 56
pos: verb
aspect: imperf
pron: { cyr: "про́сиць" }
senses:
  - id: ask
    ru: "просить (о чём-л.)"
    examples:
      - pl: "Proszę o uwagę."
        ru: "Прошу внимания."
        source: { kind: tatoeba, id: 908249 }
      - pl: "Proszę o rachunek."
        ru: "Счёт, пожалуйста."
        source: { kind: tatoeba, id: 382593 }
      - pl: "Mogę prosić o autograf?"
        ru: "Можно мне ваш автограф, пожалуйста?"
        source: { kind: tatoeba, id: 6689519 }
  - id: please
    ru: "proszę — пожалуйста, прошу"
    examples:
      - pl: "Wybacz, proszę."
        ru: "Прости меня, пожалуйста."
        source: { kind: tatoeba, id: 351546 }
      - pl: "Nigdy nie prosiłem o to."
        ru: "Я никогда не просил об этом."
        source: { kind: tatoeba, id: 1870682 }
notes:
  - { kind: government, text: "prosić o coś — с предлогом o и винительным падежом: prosić o pomoc «просить о помощи», prosić o rękę «просить руки»." }
  - { kind: usage, text: "Форма proszę — самое частое вежливое слово: и «прошу», и «пожалуйста», и «вот, возьмите» при подаче чего-либо." }
collocations:
  - { pl: "proszę bardzo", ru: "пожалуйста" }
  - { pl: "prosić o pomoc", ru: "просить о помощи" }
  - { pl: "proszony obiad", ru: "званый обед" }
etymology: "Праславянское *prositi — то же слово, что русское «просить»."
memory: "Управление совпадает с русским: prosić o coś «просить о чём-то». Но чаще всего вы встретите форму proszę — она работает сразу как «прошу», «пожалуйста» и «вот, возьмите»."
idioms:
  - { pl: "proszę bardzo", ru: "пожалуйста" }
  - { pl: "prosić o rękę", ru: "просить руки" }
  - { pl: "proszony obiad", ru: "званый обед" }
