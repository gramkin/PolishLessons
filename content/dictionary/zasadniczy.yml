  - { pl: "zasadniczo", ru: "в принципе, в основном", relation: derived }
  - { pl: "podstawowy", ru: "основной", relation: root, id: podstawowy }
synonyms: ["podstawowy", "pryncypialny", "główny"]
etymology: "Прилагательное от ZASADA «принцип, правило, основа» с суффиксом -NICZY. Само ZASADA связано с ZASADZIĆ «посадить, установить»: принцип — то, на чём что-то прочно «посажено»."
memory: "Zasada — не «засада», а «принцип»; засада — zasadzka. Zasadniczy — «принципиальный, основной»: zasadnicza różnica, ustawa zasadnicza «конституция». О строгом отце, живущем по правилам, тоже скажут zasadniczy."
idioms:
  - { pl: "ustawa zasadnicza", ru: "основной закон, конституция" }
