notes:
  - { kind: false-friend, text: "Русскому слышится «засада», но польское ZASADA значит «принцип, правило, основа», а засада по-польски ZASADZKA. Отсюда и ZASADNICZY: «основной, коренной» — ZASADNICZA RÓŻNICA «принципиальная разница», ZASADNICZY PROBLEM «главная проблема», — и о человеке «принципиальный, строгий, живущий по правилам». К засаде слово отношения не имеет." }
  - { kind: usage, text: "Несколько устойчивых сочетаний стоит выучить целиком. USTAWA ZASADNICZA — «основной закон», то есть конституция. ZASADNICZA SZKOŁA ZAWODOWA, в разговоре просто ZAWODÓWKA, — профессиональное училище. SŁUŻBA ZASADNICZA — срочная военная служба. Наречие ZASADNICZO значит «в принципе, в основном»: ZASADNICZO SIĘ ZGADZAM «в принципе я согласен»." }
  - { kind: usage, text: "Мужско-личное множественное число совпадает с основной формой, как у всех прилагательных на -CZY: ZASADNICZY LUDZIE «принципиальные люди». Поэтому в таблице десять разных форм, а не одиннадцать. Синтетических степеней нет; о человеке говорят BARDZIEJ ZASADNICZY «более принципиальный»." }
  - { kind: pronunciation, text: "Читается «засадни́чы», ударение на предпоследнем слоге. NI перед гласным даёт мягкое «ни», CZ — твёрдое «ч», и после него Y звучит «ы»." }
