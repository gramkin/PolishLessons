notes:
  - { kind: pronunciation, text: "Дательный и предложный — SETCE, с переходом k в c, родительный множественного — SETEK, с беглой e. Это пятое слово такого рода в словаре, после kostka, kulka, szafka и gorączka, так что правило для уменьшительных на -ka можно считать установленным и не проверять каждый раз." }
  - { kind: usage, text: "Слово образовано от SETNY «сотый», а тот от STO. Как и русская «сотка», оно употребляется не только в прямом счёте: SETKA это и сотня чего-нибудь, и стограммовая стопка, и стометровка в беге, и сотая часть гектара. Выбор значения целиком на контексте: setka ludzi, przebiec setkę, wypić setkę." }
collocations:
  - { pl: "setka ludzi", ru: "сотня людей" }
  - { pl: "przebiec setkę", ru: "пробежать стометровку" }
  - { pl: "setki razy", ru: "сотни раз" }
family:
  - { pl: "sto", ru: "сто", relation: root, id: sto }
  - { pl: "setny", ru: "сотый", relation: derived }
  - { pl: "stulecie", ru: "столетие", relation: root }
etymology: "От SETNY «сотый», восходящего к STO, из праславянского *sъto — то же слово, что русское «сто». Русская «сотка» построена тем же способом и обросла теми же побочными значениями: мера площади, мера водки, дистанция. Совпадение здесь не только в корне, но и в том, как оба языка обошлись со словом."
memory: "SETCE с k → c и SETEK с беглой e — как kostka и gorączka. А значений столько же, сколько у нашей «сотки»."
idioms:
  - { pl: "setki razy", ru: "сотни раз" }
  - { pl: "przebiec setkę", ru: "пробежать стометровку" }
