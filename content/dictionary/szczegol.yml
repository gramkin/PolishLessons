# review
id: szczegol
format: 2
lemma: "szczegół"
rank: 1339
pos: noun
pron: { cyr: "шчэ́гуу" }
senses:
  - id: detail
    ru: "деталь, подробность"
    examples:
      - pl: "To szczegół."
        ru: "Это деталь."
        source: { kind: translated, id: 352456 }
      - pl: "Chcę znać szczegóły."
        ru: "Я хочу знать подробности."
        source: { kind: translated, id: 7949760 }
      - pl: "A szczegóły?"
        ru: "А поподробней?"
        source: { kind: tatoeba, id: 814181 }
  - id: in-detail
    ru: "w szczegółach, ze szczegółami — подробно"
    examples:
      - pl: "Diabeł tkwi w szczegółach."
        ru: "Дьявол кроется в деталях."
        source: { kind: translated, id: 1603812 }
      - pl: "Wyjaśniłem w szczegółach powód."
        ru: "Я подробно объяснил причину."
        source: { kind: translated, id: 4884422 }
      - pl: "Opowiedział mi ze szczegółami."
        ru: "Он рассказал мне подробно."
        source: { kind: translated, id: 4289259 }
  - id: no-details
    ru: "не вдаваться в подробности"
    examples:
      - pl: "Nie wchodźmy w szczegóły."
        ru: "Не будем вдаваться в подробности."
        source: { kind: translated, id: 7949771 }
      - pl: "Oszczędź mi szczegółów."
        ru: "Избавь меня от подробностей."
        source: { kind: translated, id: 3655572 }
      - pl: "Nie zagłębiajmy się w szczegóły."
        ru: "Не будем углубляться в подробности."
        source: { kind: translated, id: 526189 }
notes:
  - { kind: usage, text: "Diabeł tkwi w szczegółach — «дьявол кроется в деталях», ровно как русская поговорка." }
  - { kind: government, text: "wchodzić w szczegóły «вдаваться в подробности» — предлог w с винительным. А «подробно» будет ze szczegółami, творительный." }
  - { kind: usage, text: "Прилагательное — szczegółowy «подробный», наречие — szczegółowo «подробно»." }
  - { kind: pronunciation, text: "Начальное szcz звучит как «щч», ó как «у», конечное ł как «у»: щчэ́гуу." }
collocations:
  - { pl: "w szczegółach", ru: "в деталях" }
  - { pl: "wchodzić w szczegóły", ru: "вдаваться в подробности" }
  - { pl: "szczegóły planu", ru: "детали плана" }
etymology: "От szczególny «особый», от старого szczegół «отдельная вещь». Русская «деталь» — французское заимствование, а польское слово своё."
memory: "szczegół — «деталь, подробность». Diabeł tkwi w szczegółach «дьявол кроется в деталях». Обороты: wchodzić w szczegóły «вдаваться в подробности», ze szczegółami «подробно»."
idioms:
  - { pl: "diabeł tkwi w szczegółach", ru: "дьявол кроется в деталях" }
  - { pl: "wchodzić w szczegóły", ru: "вдаваться в подробности" }
  - { pl: "ze szczegółami", ru: "подробно" }
