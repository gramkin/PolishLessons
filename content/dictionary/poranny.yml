etymology: "От PORANEK «утро», а оно от RANO с приставкой PO-, из праславянского *rano «рано, утро». Корень русскому знаком целиком: «рано», «раний» в старом виде, «ранний», «заранее». Польское RANO совмещает существительное и наречие, как и русское «рано» в части употреблений, а PORANEK с приставкой обозначает утро как отрезок — ровно тем же способом, каким русский образовал «утренник» от «утро», только корень другой. Суффикс -NY даёт здесь относительное прилагательное, и двойное NN в PORANNY получилось на стыке: основа PORAN- плюс суффикс -NY, без выпадения. Поэтому удвоение не орфографическая условность, а состав слова, и произносится оно долго."
memory: "Относительное прилагательное: одиннадцать форм, степеней нет — poranniejszy не существует, как и sportowszy. Двойное nn произносится долго и идёт из состава: poranek плюс -ny. Три слова рядом: rano — «утро» и «утром», poranek — «утро» как отрезок и «утренник», poranny — «утренний». Dziś rano значит «сегодня утром»."
