notes:
  - { kind: government, text: "Прилагательное относительное, и отсюда одиннадцать форм без степеней сравнения: PORANNIEJSZY не существует, потому что нельзя быть «утреннее». Это тот же случай, что SPORTOWY, и противоположный качественному DOSTĘPNY с его тридцатью тремя формами. Образовано от PORANEK «утро» суффиксом -NY, но суффикс здесь не делает прилагательное качественным: решает значение, а значение чисто относительное — «относящийся к утру». Когда нужно сравнение, берут описательный оборот: BARDZIEJ PORANNY почти не употребляется, вместо него говорят WCZEŚNIEJSZY «более ранний»." }
  - { kind: false-friend, text: "Соответствует русскому «утреннему» точно, а трудность в соседях. Польский держит три слова там, где русский обходится двумя: RANO значит и «утро» как существительное, и «утром» как наречие; PORANEK — «утро» как отрезок времени, более книжное, а также «утренник», детское представление; PORANNY — прилагательное «утренний». Поэтому DZIŚ RANO это «сегодня утром», PORANEK W PRZEDSZKOLU — «утренник в детском саду», а PORANNA GAZETA — «утренняя газета». Русское «утренник» и польское PORANEK совпадают в этом втором значении, что для русскоговорящего приятная неожиданность." }
  - { kind: pronunciation, text: "Читается «пора́нны», ударение на предпоследнем слоге из трёх. Двойное NN произносится долго, как два отдельных звука: «поран-ны», и это один из немногих случаев, где польский действительно удваивает согласную в произношении. Конечное -Y звучит «ы». В форме мужского лица множественного PORANNI слышно «пора́нни», тоже с долгим н. В женской PORANNA и средней PORANNE удвоение сохраняется во всех формах, потому что оно идёт из состава слова: PORANEK плюс -NY." }
  - { kind: usage, text: "Частотные сочетания: PORANNY POCIĄG, PORANNA GAZETA, PORANNA KAWA, PORANNE MDŁOŚCI «утренняя тошнота», PORANNA GIMNASTYKA «утренняя зарядка», PORANNY SZCZYT «утренний час пик». В расписаниях и объявлениях встречается оборот GODZINY PORANNE «утренние часы». Наречия от этого прилагательного нет: «по-утреннему» передают оборотом JAK RANO или через RANO. Существительное PORANEK вдобавок означает утренник, детский праздник, и в этом значении оно вполне обиходно." }
