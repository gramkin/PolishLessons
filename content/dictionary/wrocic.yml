# review
id: wrocic
format: 2
lemma: "wrócić"
rank: 130
pos: verb
aspect: perf
pron: { cyr: "вру́циць" }
senses:
  - id: return
    ru: "вернуться, возвратиться"
    examples:
      - pl: "Tom już wrócił."
        ru: "Том уже вернулся."
        source: { kind: tatoeba, id: 3649941 }
      - pl: "Już wróciłaś?"
        ru: "Ты уже вернулась?"
        source: { kind: tatoeba, id: 13784829 }
      - pl: "Wróć do domu."
        ru: "Возвращайся домой."
        source: { kind: tatoeba, id: 5326054 }
  - id: come-back
    ru: "вернуться к чему-либо; вернуться (о времени, состоянии)"
    examples:
      - pl: "Co było, nie wróci."
        ru: "Прошлое не вернётся."
        source: { kind: tatoeba, id: 12689731 }
      - pl: "Chcę, by Tom wrócił."
        ru: "Я хочу, чтобы Том вернулся."
        source: { kind: tatoeba, id: 5907105 }
      - pl: "Wróćmy do tematu."
        ru: "Вернёмся к теме."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Совершенный вид к wracać: Wracam co wieczór «Возвращаюсь каждый вечер» — Wróciłem późno «Я вернулся поздно»." }
  - { kind: usage, text: "Направление: wrócić do domu «вернуться домой» (do + родительный), wrócić z pracy «вернуться с работы» (z + родительный)." }
  - { kind: usage, text: "Существительное к этому глаголу — powrót «возвращение», а не «wrócenie»: droga powrotna «обратный путь»." }
collocations:
  - { pl: "wrócić do domu", ru: "вернуться домой" }
  - { pl: "wrócić do zdrowia", ru: "выздороветь" }
  - { pl: "wrócić do tematu", ru: "вернуться к теме" }
  - { pl: "wróć!", ru: "вернись!" }
etymology: "Приставка w- + rócić (от *vortiti «поворачивать»); тот же корень, что в русском «воротить, возвратиться», а powrót — «возврат»."
memory: "wrócę «вернусь» — wróciłem «я вернулся». Существительное не «wrócenie», а powrót «возвращение». И помните оборот wrócić do siebie «прийти в себя»."
idioms:
  - { pl: "wrócić do zdrowia", ru: "выздороветь" }
  - { pl: "wrócić na tarczy", ru: "вернуться с позором" }
  - { pl: "wrócić z tarczą", ru: "вернуться с победой" }
