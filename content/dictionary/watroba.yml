notes:
  - { kind: false-friend, text: "Польская WĄTROBA и русская «утроба» — одно и то же слово, разошедшееся по смыслу, и это главная ловушка карточки. Праславянское *ǫtroba значило «внутренности, то, что внутри». Польский сузил его до одного органа — печени. Русский оставил общее значение и получил «утробу», то есть чрево, живот, материнское лоно. Поэтому WĄTROBA — это печень и только печень, а русское «утроба» переводится на польский как WNĘTRZE, ŁONO или BRZUCH. В обратную сторону ошибка тоже легка: русская «печень» названа от «печь», по жару органа, и никакого польского родственника у этого названия нет." }
  - { kind: usage, text: "Родительный множественного WĄTRÓB показывает сквозное польское правило: в закрытом слоге O переходит в Ó. Так же ведут себя WODA и WÓD, NOGA и NÓG, KROWA и KRÓW. Правило срабатывает именно там, где окончание исчезает и слог закрывается согласной, поэтому во всех прочих формах остаётся O: WĄTROBY, WĄTROBOM, WĄTROBAMI. В кухонном значении чаще употребляют уменьшительное WĄTRÓBKA: WĄTRÓBKA DROBIOWA «куриная печёнка», и там тоже Ó. Звательный падеж WĄTROBO в живой речи встречается только в шутку, как обращение к собственному организму." }
  - { kind: pronunciation, text: "Читается «вонтро́ба», ударение на предпоследнем слоге. Носовая ą перед t даёт «он», как и в SĄD «сонт» или в RĄBAĆ. В местном падеже WĄTROBIE звучит «вонтро́бе», где BI перед гласной читается мягко, «бе». В родительном множественного WĄTRÓB гласная Ó даёт «у»: «во́нтруп», и конечное B оглушается в «п». Это сочетание — носовая плюс Ó плюс оглушение — стоит проговорить вслух несколько раз." }
  - { kind: government, text: "Существительное женского рода на -A, склоняется совершенно правильно. Винительный на -Ę: NISZCZY WĄTROBĘ. При отрицании он переходит в родительный: NIE USZKODZIŁ WĄTROBY. Медицинские сочетания строятся с родительным, как и в русском: ZAPALENIE WĄTROBY «воспаление печени, гепатит», MARSKOŚĆ WĄTROBY «цирроз печени», BADANIE WĄTROBY. Предлог «с чем» — Z с творительным: PROBLEMY Z WĄTROBĄ «проблемы с печенью», и это полностью совпадает с русской конструкцией." }
