etymology: "Из праславянского *ǫtroba «внутренности», от *ǫtrь «внутрь» — того же корня, что польское WNĘTRZE и русское «внутрь», «утроба», «нутро». Исходное значение было широким: всё, что внутри тела. Дальше языки выбрали разное. Польский закрепил слово за печенью, самым крупным внутренним органом, и общее значение отдал словам WNĘTRZE и BRZUCH. Русский сохранил широкий смысл в «утробе» и «нутре», а для печени взял отдельное слово от «печь»: орган горячий на ощупь, отсюда и название, и та же мотивировка видна в английском liver и немецком Leber, связанных с жизнью. Носовая ą в польском отвечает здесь русскому у, как в SĄD и «суде», RĘKA и «руке»: это обычный исход праславянских носовых."
memory: "Одно слово с русской «утробой», но смысл сузился: wątroba — это печень, а «утроба» по-польски wnętrze или brzuch. Русская «печень» названа от «печь», польской родни у неё нет. В родительном множественного o переходит в ó: wątrób, как woda и wód. Читается «вонтро́ба»."
