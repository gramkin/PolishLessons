notes:
  - { kind: false-friend, text: "Расхождение в форме, а не в значении, и оно то же, что в карточке INFORMOWAĆ: русский вставляет -ир-, польский обходится без него. TRENOWAĆ против «тренировать», TRENING против «тренировка», TRENER против «тренер». Разница в том, что польское TRENOWAĆ покрывает сразу и «тренировать», и «тренироваться»: TRENUJE значит и «он тренирует», и «он тренируется», а различает только наличие дополнения. Возвратное TRENOWAĆ SIĘ тоже есть, но в спортивной речи его почти не употребляют." }
  - { kind: government, text: "Кого — винительный: TRENOWAĆ DRUŻYNĘ, ZAWODNIKÓW, KADRĘ. Что — тоже винительный, о дисциплине: TRENOWAĆ PŁYWANIE, BOKS, RZUT OSZCZEPEM. А вот без дополнения глагол значит «тренироваться»: TRENUJĘ CODZIENNIE. Как часто — винительный с предлогом: TRZY RAZY W TYGODNIU. Русский во втором случае обязан добавить «-ся», польский нет, и это самая частая ошибка в обе стороны." }
  - { kind: pronunciation, text: "Глагол класса на -OWAĆ, настоящее на -UJ-: TRENUJĘ, TRENUJESZ, TRENUJE, TRENUJĄ — правило из карточки SPAKOWAĆ, и для заимствованных глаголов оно почти без исключений. Начальное TR читается твёрдо, а e открытое, как русское э: всё слово звучит «трэно́ваць». Ударение на предпоследнем слоге во всех формах, кроме условных на -byśmy и -byście." }
  - { kind: usage, text: "Совершенная пара у этого глагола не образуется обычным путём: для однократного занятия скажут POTRENOWAĆ («потренироваться»), а для доведения до результата — WYTRENOWAĆ («натренировать»). Существительные обиходны и нужны сразу: TRENING «тренировка», TRENER «тренер», TRENINGOWY «тренировочный», а в объявлениях спортзалов постоянно встречается TRENER PERSONALNY." }
collocations:
  - { pl: "trenować trzy razy w tygodniu", ru: "тренироваться три раза в неделю" }
  - { pl: "trenować drużynę", ru: "тренировать команду" }
  - { pl: "trener personalny", ru: "персональный тренер" }
family:
  - { pl: "potrenować", ru: "потренироваться", relation: aspect }
  - { pl: "trening", ru: "тренировка", relation: derived, id: trening }
  - { pl: "trener", ru: "тренер", relation: derived, id: trener }
etymology: "Из английского TRAIN через немецкий TRAINIEREN, как и большинство спортивных слов в обоих языках. Русский взял немецкую форму на -ieren и передал её своим -ировать: «тренировать». Польский присоединил родной -OWAĆ и получил TRENOWAĆ. Поэтому корень в двух языках один, а суффиксы разные, и это касается целого разряда: TRENOWAĆ, INFORMOWAĆ, ORGANIZOWAĆ, KONTROLOWAĆ — против «тренировать», «информировать», «организовать», «контролировать»."
memory: "Как и informować, без -ир-: trenować, trening, trener. И одно слово на два русских: trenuje значит и «тренирует», и «тренируется» — различает дополнение."
idioms:
