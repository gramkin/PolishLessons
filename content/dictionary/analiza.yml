notes:
  - { kind: false-friend, text: "РОД ДРУГОЙ: ПО-ПОЛЬСКИ ANALIZA ЖЕНСКОГО РОДА. Русский «анализ» мужской — «этот анализ», «анализ показал». Польское слово кончается на -a и ведёт себя как женское: TA analiza, analiza POKAZAŁA, dobrA analiza. Смысл при этом тот же, поэтому ошибка в роде проскакивает незаметно для самого говорящего и режет слух полякам." }
  - { kind: usage, text: "Родительный множественного — ANALIZ, с нулевым окончанием. Это обычное поведение существительных на -a: procedura — procedur, kobieta — kobiet, szkoła — szkół. А вот заимствования на -ja ведут себя иначе: konferencja даёт konferencji. Так что окончание предсказывает не значение, а последняя буква основы." }
  - { kind: pronunciation, text: "Дательный и предложный — ANALIZIE, со смягчением z в zi. То же в koza — kozie, bluza — bluzie, zaraza — zarazie. Русское «анализе» мягкости не знает, и твёрдое «analize» выдаёт иностранца сразу." }
collocations:
  - { pl: "analiza krwi", ru: "анализ крови" }
  - { pl: "przeprowadzić analizę", ru: "провести анализ" }
  - { pl: "analiza danych", ru: "анализ данных" }
family:
  - { pl: "analizować", ru: "анализировать", relation: root }
  - { pl: "analityczny", ru: "аналитический", relation: derived }
  - { pl: "synteza", ru: "синтез", relation: antonym }
etymology: "Из греческого análysis «разложение, развязывание», через латынь научных текстов. Русский взял слово в мужском роде, как оно звучало в греческом и латинском именительном, а польский переделал на свой лад, добавив -a и сделав женским. Та же судьба у польских metoda, problematyka, tematyka — там, где русский оставил «метод» и «проблематику»."
memory: "Главное — род: TA analiza, женский, а не «этот анализ». И родительный множественного без окончания: kilka analiz, не «analizów»."
idioms:
