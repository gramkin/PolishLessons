# review
id: serce
format: 2
lemma: "serce"
rank: 282
pos: noun
pron: { cyr: "се́рцэ" }
senses:
  - id: organ
    ru: "сердце (орган)"
    examples:
      - pl: "Serce bije."
        ru: "Сердце бьется."
        source: { kind: tatoeba, id: 9671815 }
      - pl: "On ma chore serce."
        ru: "У него больное сердце."
        source: { kind: tatoeba, id: 2605115 }
      - pl: "Mam rozrusznik serca."
        ru: "У меня кардиостимулятор."
        source: { kind: tatoeba, id: 599485 }
  - id: soul
    ru: "сердце (душа, характер)"
    examples:
      - pl: "On ma dobre serce."
        ru: "У него доброе сердце."
        source: { kind: tatoeba, id: 12955512 }
      - pl: "Ona ma dobre serce."
        ru: "У неё доброе сердце."
        source: { kind: tatoeba, id: 2964446 }
      - pl: "Ona ma czyste serce."
        ru: "У неё чистое сердце."
        source: { kind: tatoeba, id: 5969973 }
notes:
  - { kind: false-friend, text: "Слово прозрачное, но глагола «сердиться» от него в польском нет: сердиться — это gniewać się или złościć się." }
  - { kind: usage, text: "z całego serca — «от всего сердца», kochać całym sercem — «любить всем сердцем»." }
  - { kind: usage, text: "mieć dobre serce — «иметь доброе сердце»; coś leży mi na sercu — «что-то лежит у меня на сердце»." }
collocations:
  - { pl: "dobre serce", ru: "доброе сердце" }
  - { pl: "z całego serca", ru: "от всего сердца" }
  - { pl: "bicie serca", ru: "биение сердца" }
  - { pl: "w głębi serca", ru: "в глубине души" }
etymology: "Общеславянское слово, праславянское *sьrdьce — то же, что русское «сердце»; родственно литовскому širdis и латинскому cor."
memory: "serce — «сердце», буква в букву. Но «сердиться» от него в польском не образовано: это gniewać się или złościć się."
idioms:
  - { pl: "kamień spadł z serca", ru: "камень с сердца свалился" }
  - { pl: "leżeć na sercu", ru: "лежать на сердце" }
  - { pl: "z całego serca", ru: "от всего сердца" }
