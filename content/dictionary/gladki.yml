  - id: plain-smooth
    ru: "гладкий, однотонный; гладкий в обхождении"
    examples:
      - pl: "Wolę gładkie koszule bez wzorów."
        ru: "Я предпочитаю однотонные рубашки без узоров."
        source: { kind: authored }
      - pl: "Jest gładki w obejściu, ale nieszczery."
        ru: "Он обходителен, но неискренен."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Совпадение с русским «гладкий» почти полное. Польская особенность — значение «однотонный, без узора»: GŁADKA TKANINA, GŁADKA SUKIENKA. О человеке GŁADKI W OBEJŚCIU — «обходительный, вежливый», иногда с оттенком «скользкий». GŁADKO — «гладко, без проблем»: WSZYSTKO POSZŁO GŁADKO." }
  - { kind: usage, text: "Полная парадигма с простыми степенями: GŁADKI, GŁADSZY, NAJGŁADSZY, где K выпадает перед -SZY. Мужское-личное: GŁADCY, GŁADSI, NAJGŁADSI. Положительная степень берёт -ICH, -IM: GŁADKICH, GŁADKIM." }
  - { kind: government, text: "Гладкий как что-то — GŁADKI JAK LUSTRO, JAK AKSAMIT, JAK с именительным. Обходительный — GŁADKI W OBEJŚCIU, W с местным. В сравнении — NIŻ или OD с родительным." }
  - { kind: pronunciation, text: "Читается «гуа́тки», два слога, ударение на первом. Ł — «у», D перед K оглушается в «т». В GŁADSZY: «гуа́тшы», D оглушается перед SZ." }
  - { kind: register, text: "Нейтральное слово. В рекламе косметики — на каждом шагу: GŁADKA SKÓRA. Об успехе — разговорное GŁADKO POSZŁO, «прошло как по маслу». GŁADKIE SŁÓWKA — «сладкие речи», с недоверием." }
collocations:
  - { pl: "gładka skóra", ru: "гладкая кожа" }
  - { pl: "gładki jak lustro", ru: "гладкий как зеркало" }
  - { pl: "gładkie słówka", ru: "сладкие речи" }
family:
  - { pl: "gładko", ru: "гладко", relation: derived }
  - { pl: "szorstki", ru: "шершавый, грубый", relation: root }
  - { pl: "wygładzić", ru: "разгладить", relation: derived }
etymology: "Общеславянское *gladъkъ, того же, что русское «гладкий». Польское ŁA на месте русского «ла» — то же слово без изменений: GŁADKI — «гладкий», GŁAZ — «глыба». В степенях K выпадает: GŁADSZY, как в русском «глаже»."
memory: "Gładki — гладкий; и однотонный: gładka koszula. Gładszy, najgładszy — без k. Gładki w obejściu — обходительный. Gładko poszło — прошло как по маслу. Читается «гуа́тки»."
idioms:
