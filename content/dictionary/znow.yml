id: znow
format: 2
lemma: "znów"
rank: 473
pos: part
pron: { cyr: "знуф" }
senses:
  - id: again
    ru: "снова, опять"
    examples:
      - pl: "Znów jestem tu."
        ru: "Я опять здесь."
        source: { kind: tatoeba, id: 5907136 }
      - pl: "Tom znów jest tu."
        ru: "Том снова тут."
        source: { kind: tatoeba, id: 3268213 }
      - pl: "Kiedy znów się spotkamy?"
        ru: "Когда мы встретимся снова?"
        source: { kind: tatoeba, id: 826592 }
  - id: repetition
    ru: "снова (о повторении)"
    examples:
      - pl: "Znów pocałowałam Toma."
        ru: "Я снова поцеловала Тома."
        source: { kind: tatoeba, id: 6441731 }
      - pl: "Znów będziesz szczęśliwy."
        ru: "Ты снова будешь счастлив."
        source: { kind: tatoeba, id: 3776815 }
      - pl: "Moje skarpetki znów są dziurawe."
        ru: "Мои носки снова дырявые."
        source: { kind: tatoeba, id: 3744905 }
notes:
  - { kind: usage, text: "znów и znowu — одно и то же наречие, просто два варианта. Различия в значении нет, znowu чуть длиннее и чаще на письме." }
  - { kind: usage, text: "Русские «снова» и «опять» покрываются обоими вариантами без разбора." }
  - { kind: usage, text: "O nie, znowu! — «Ну вот опять!», обычная реакция на повторившуюся неприятность." }
  - { kind: usage, text: "Слово собрано как русское «снова»: z + nowu, от nowy «новый»." }
collocations:
  - { pl: "znów to samo", ru: "опять то же самое" }
  - { pl: "znów pada", ru: "опять идёт дождь" }
  - { pl: "kiedy znów?", ru: "когда снова?" }
etymology: "Из z + nowu, от nowy «новый». Русское «снова» собрано ровно тем же способом: «с» + «нова»."
memory: "znów — «снова, опять», и это тот же самый наречие, что znowu: два варианта одного слова. Собрано как русское «снова», от nowy «новый»."
