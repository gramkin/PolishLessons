notes:
  - { kind: false-friend, text: "KOSZYKÓWKA — не «корзинка», а «баскетбол». Корзинка — KOSZYK. Игра названа по корзине: KOSZ, KOSZYK, а -ÓWKA делает из слова название вида спорта, как SIATKÓWKA — «волейбол», от SIATKA «сетка»." }
  - { kind: usage, text: "Название игры, поэтому только единственное число; множественного и звательного падежа на практике нет. Баскетболист — KOSZYKARZ, баскетболистка — KOSZYKARKA. В местном падеже K перед E переходит в C: W KOSZYKÓWCE." }
  - { kind: government, text: "Играть в баскетбол — GRAĆ W KOSZYKÓWKĘ, W с винительным, как и по-русски. Матч по баскетболу — MECZ KOSZYKÓWKI, родительный без предлога. Увлекаться баскетболом — INTERESOWAĆ SIĘ KOSZYKÓWKĄ, творительный." }
  - { kind: pronunciation, text: "Читается «кошыку́фка», ударение на предпоследнем слоге. SZ перед Y — «шы», Ó — «у», W перед K оглушается в «ф»." }
  - { kind: register, text: "Слово нейтральное. В разговоре говорят короче: GRAĆ W KOSZA, где KOSZ, «корзина», значит и кольцо, и саму игру." }
