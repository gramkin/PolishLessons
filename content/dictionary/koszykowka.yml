etymology: "От KOSZYK «корзинка», уменьшительного от KOSZ «корзина», с суффиксом -ÓWKA. Это калька английского слова «баскетбол», где первая часть тоже значит «корзина». По той же модели: SIATKÓWKA — от SIATKA «сетка»."
memory: "Koszykówka — баскетбол, игра в корзинку: kosz, koszyk. Читается «кошыку́фка». Grać w koszykówkę — играть в баскетбол. Siatkówka — волейбол."
idioms:
