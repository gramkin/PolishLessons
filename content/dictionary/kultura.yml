etymology: "Из латинского cultura «возделывание», от colere «возделывать, населять, почитать». Исходно слово было про землю, и этот смысл в польском жив до сих пор: kultura rolna — это агрокультура. Переносное значение, культура как достояние народа, оба языка взяли из западноевропейского обихода Нового времени. От того же латинского корня kultywować и kolonia."
memory: "kulturalny — это «воспитанный», а не «культурный»: о культуре как явлении говорят kulturowy. Вместе с inteligentny «умный» эта пара закрывает обе наши ловушки."
