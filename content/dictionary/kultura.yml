notes:
  - { kind: false-friend, text: "Русское «культурный» по-польски распадается надвое. KULTURALNY — это воспитанный, обходительный человек: kulturalny człowiek, zachowywać się kulturalnie. Именно это значение несёт русское «интеллигентный», а польское inteligentny, как мы уже видели, означает «умный». KULTUROWY — другое слово, оно о культуре как явлении: różnice kulturowe, dziedzictwo kulturowe. Перепутать их легко, а разница заметная." }
  - { kind: pronunciation, text: "Дательный и предложный — KULTURZE, с переходом r в rz, как и во всех основах на r: teatr — teatrze, nora — norze, atmosfera — atmosferze. Родительный множественного — KULTUR, без окончания, по образцу strzał и atmosfer." }
