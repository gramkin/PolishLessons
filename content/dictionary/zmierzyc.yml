etymology: "От MIARA, из праславянского *měra, того же слова, что русская «мера», с приставкой Z-, которая в польском означает завершённость действия, как русское «из-» в «измерить». Гнездо в обоих языках широкое и почти совпадающее: MIERZYĆ и «мерить», WYMIAR и «размер», POMIAR и «измерение», NIEZMIERZONY и «неизмеримый». Интереснее всего ZAMIAR «намерение»: приставка ZA- плюс «мера», то есть отмеренное заранее решение. Русский построил «намерение» по той же модели, только с приставкой НА-, и образ в обоих языках один — замысел как заранее снятая мерка. Сочетание RZ на месте русского Р с мягкостью («мерить» и MIERZYĆ) — закономерное польское развитие старого мягкого R, то же, что в MORZE и «море», RZEKA и «река»."
memory: "Корень как в русской «мере»: miara, mierzyć, zmierzyć «измерить», wymiar «размер», pomiar «измерение». Главная находка гнезда — zamiar «намерение»: za- + «мера», и русское «намерение» устроено так же, через «мерить». Поэтому mam zamiar значит «я намереваюсь», а не «у меня есть замер» — замер это pomiar. Совершенный вид, 53 формы: деепричастие только прошедшее (zmierzywszy), формы на -ąc нет. И возвратное zmierzyć się z czymś — «столкнуться, сразиться с чем-то», предлог и падеж как в русском."
