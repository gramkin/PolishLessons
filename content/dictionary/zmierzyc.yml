notes:
  - { kind: false-friend, text: "Корень MIAR-/MIERZ- это русская «мера» и «мерить», и соответствие прямое: MIARA «мера», MIERZYĆ «мерить», ZMIERZYĆ «измерить», WYMIAR «размер, измерение», POMIAR «измерение». Самое интересное слово гнезда — ZAMIAR «намерение». Оно построено из ZA- и «меры», то есть буквально «то, что намечено, отмерено», и русское «намерение» устроено точно так же, от «мерить» через «намерить». Поэтому ZAMIAR нельзя принимать за «замер»: MAM ZAMIAR значит «я намереваюсь», а не «у меня есть замер». Замер по-польски POMIAR. Пара ZAMIAR и «намерение» отличается только приставкой, и обе построены на одной метафоре: решение как отмеренная заранее величина." }
  - { kind: usage, text: "Совершенный вид, пятьдесят три формы: сорок две от глагола, одна у деепричастия прошедшего времени ZMIERZYWSZY, одиннадцать у страдательного причастия ZMIERZONY. Настоящего времени нет: ZMIERZĘ и ZMIERZYSZ значат «измерю», «измеришь». Деепричастия на -ĄC у совершенного вида не бывает, и формы ZMIERZAJĄC в этом наборе быть не может. Несовершенная пара — MIERZYĆ, и у неё шире значение: MIERZYĆ может значить и «примерять» одежду, MIERZYĆ MARYNARKĘ. Возвратное ZMIERZYĆ SIĘ Z CZYMŚ значит «сразиться, столкнуться лицом к лицу», и в спортивных отчётах это основное употребление." }
  - { kind: government, text: "Переходный: измерить что — винительный без предлога, ZMIERZYĆ TEMPERATURĘ, ZMIERZYĆ CIŚNIENIE, ZMIERZYĆ POKÓJ. Кому — дательный: ZMIERZYĆ KOMUŚ CIŚNIENIE, в точности как русское «измерить кому-то давление». Отрицание требует родительного: NIE ZMIERZYŁ TEMPERATURY. Возвратная конструкция управляет предлогом Z с творительным: ZMIERZYĆ SIĘ Z PRZECIWNIKIEM, ZMIERZYĆ SIĘ Z PROBLEMEM, и русский здесь говорит «столкнуться с чем-то» или «сразиться с кем-то», то есть предлог и падеж совпадают. Устойчивое ZMIERZYĆ KOGOŚ WZROKIEM значит «окинуть кого-то взглядом», буквально «измерить взглядом»." }
  - { kind: pronunciation, text: "Читается «зме́жыць», два слога, ударение на первом. Сочетание ZMIE звучит «зме»: Z твёрдое, M смягчается перед I, а само I не произносится отдельно. Буквосочетание RZ даёт «ж», и это правило без исключений: RZ всегда «ж», никогда «рз». Буква Y это «ы», поэтому второй слог звучит «жыць». Конечное Ć — мягкое «ць». В деепричастии ZMIERZYWSZY три слога, ударение на предпоследнем: «змежы́фшы», где W перед S оглушается в «ф». В причастии ZMIERZONY на месте Y стоит O: «змежо́ны»." }
