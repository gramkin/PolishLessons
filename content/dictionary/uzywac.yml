# review
id: uzywac
format: 2
lemma: "używać"
rank: 446
pos: verb
aspect: imperf
pron: { cyr: "ужы́ваць" }
senses:
  - id: use
    ru: "использовать, пользоваться"
    examples:
      - pl: "Możesz używać mojego słownika."
        ru: "Можешь пользоваться моим словарём."
        source: { kind: tatoeba, id: 6134524 }
      - pl: "Nikt już nie używa tego słowa."
        ru: "Это слово уже никто не употребляет."
        source: { kind: tatoeba, id: 3765009 }
      - pl: "Używamy komunikacji miejskiej."
        ru: "Мы пользуемся городским транспортом."
        source: { kind: tatoeba, id: 6472236 }
  - id: use-word
    ru: "употреблять (слово, выражение)"
    examples:
      - pl: "Nie używaj tego słowa."
        ru: "Не употребляй это слово."
        source: { kind: tatoeba, id: 3621228 }
      - pl: "Kiedy używany jest średnik?"
        ru: "Когда ставится точка с запятой?"
        source: { kind: tatoeba, id: 12293582 }
      - pl: "Głusi używają języka migowego."
        ru: "Глухие пользуются языком жестов."
        source: { kind: translated, id: 353967 }
notes:
  - { kind: usage, text: "Как и совершенный użyć, глагол требует родительного падежа: używać słownika «пользоваться словарём». Русский здесь ставит творительный, так что падеж надо переучивать." }
  - { kind: false-friend, text: "Причастие używany значит «подержанный, бывший в употреблении»: używany samochód «подержанная машина». Это слово стоит на каждом втором объявлении." }
  - { kind: usage, text: "Существительное używanie — «употребление, использование»: łatwy w używaniu «простой в использовании»." }
  - { kind: usage, text: "Совершенный вид — użyć: Używam codziennie «Пользуюсь каждый день», но Użyłem raz «Воспользовался один раз»." }
collocations:
  - { pl: "używać słownika", ru: "пользоваться словарём" }
  - { pl: "używany samochód", ru: "подержанная машина" }
  - { pl: "nie używaj tego słowa", ru: "не употребляй это слово" }
  - { pl: "używać życia", ru: "наслаждаться жизнью" }
etymology: "Из u- + żywać, от żyć «жить» — исходно «извлекать пользу». То же гнездо, что у совершенного użyć."
memory: "używać — «пользоваться», и падеж тот же, что у użyć: родительный там, где русский берёт творительный — używam słownika. А причастие używany значит «подержанный»: używany samochód."
idioms:
  - { pl: "używać życia", ru: "наслаждаться жизнью" }
  - { pl: "używany samochód", ru: "подержанная машина" }
  - { pl: "łatwy w używaniu", ru: "простой в использовании" }
