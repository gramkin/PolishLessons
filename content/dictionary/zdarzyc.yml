formExamples:
  - form: "zdarzenia"
    pl: "Sami uciekł z miejsca zdarzenia."
    ru: "Сами сбежал с места происшествия."
    source: { kind: translated, id: 7183519 }
  - form: "zdarzenia"
    pl: "Policja ogrodziła miejsce zdarzenia."
    ru: "Полиция оцепила место происшествия."
    source: { kind: translated, id: 737238 }
  - form: "zdarzenia"
    pl: "Był jedynym świadkiem tego zdarzenia."
    ru: "Он был единственным свидетелем этого происшествия."
    source: { kind: translated, id: 817875 }
  - form: "zdarzenie"
    pl: "Opisał zdarzenie ze szczegółami."
