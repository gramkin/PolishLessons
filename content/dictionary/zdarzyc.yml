# review
id: zdarzyc
format: 2
lemma: "zdarzyć"
rank: 1098
pos: verb
aspect: perf
pron: { cyr: "зда́жыць" }
senses:
  - id: happen
    ru: "случиться, произойти (совершенный вид)"
    examples:
      - pl: "Zdarzył się wypadek."
        ru: "Произошла авария."
        source: { kind: translated, id: 880276 }
      - pl: "To się nigdy więcej nie zdarzy."
        ru: "Этого никогда больше не случится."
        source: { kind: tatoeba, id: 4716899 }
      - pl: "Wszystko zdarzyło się tak szybko."
        ru: "Всё произошло так быстро."
        source: { kind: tatoeba, id: 4952800 }
  - id: may-happen
    ru: "może się zdarzyć — может случиться"
    examples:
      - pl: "Wszystko się może zdarzyć."
        ru: "Всё может случиться."
        source: { kind: translated, id: 3945951 }
      - pl: "To może zdarzyć się każdemu."
        ru: "Это может случиться с каждым."
        source: { kind: translated, id: 601428 }
  - id: event
    ru: "zdarzenie — происшествие, событие"
    examples:
      - pl: "Policja ogrodziła miejsce zdarzenia."
        ru: "Полиция оцепила место происшествия."
        source: { kind: translated, id: 737238 }
      - pl: "Bardzo dobrze pamiętam to zdarzenie."
        ru: "Я очень хорошо помню это происшествие."
        source: { kind: translated, id: 3696427 }
notes:
  - { kind: usage, text: "Глагол почти всегда идёт с się: zdarzyć się «случиться». Формы без się книжные и редкие." }
  - { kind: usage, text: "Несовершенный вид — zdarzać się: To się często zdarza «Это часто случается»." }
  - { kind: usage, text: "Отглагольное существительное zdarzenie значит «происшествие, событие»: miejsce zdarzenia «место происшествия» — оборот из сводок и протоколов." }
  - { kind: usage, text: "Оборот zdarzyło się, że значит «случилось так, что»: Zdarzyło się, że mnie odwiedził." }
collocations:
  - { pl: "zdarzyć się", ru: "случиться" }
  - { pl: "może się zdarzyć", ru: "может случиться" }
  - { pl: "miejsce zdarzenia", ru: "место происшествия" }
  - { pl: "cokolwiek się zdarzy", ru: "что бы ни случилось" }
family:
  - { pl: "zdarzać się", ru: "случаться (несовершенный вид)", relation: aspect }
  - { pl: "zdarzenie", ru: "происшествие, событие", relation: derived }
  - { pl: "wydarzenie", ru: "событие", relation: derived }
etymology: "Приставка z- плюс darzyć «дарить, наделять» — буквально «выпасть на долю». Русское «случиться» собрано от «случай», но логика та же: то, что выпало."
memory: "zdarzyć się — «случиться, произойти», и почти всегда с się. Отглагольное zdarzenie значит «происшествие»: miejsce zdarzenia «место происшествия»."
idioms:
  - { pl: "cokolwiek się zdarzy", ru: "что бы ни случилось" }
  - { pl: "wszystko się może zdarzyć", ru: "всё может случиться" }
