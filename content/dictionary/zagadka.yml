notes:
  - { kind: government, text: "Женский род: ta zagadka, tej zagadki. Разгадать загадку — rozwiązać zagadkę, винительный падеж; буквально «решить», как задачу." }
  - { kind: false-friend, text: "От zagadać «заговорить», корень gadać «говорить». Русская «загадка» — от «гадать», то есть угадывать. Смысл сошёлся, а корни разные." }
  - { kind: usage, text: "Оборот mówić zagadkami «говорить загадками» требует творительного падежа, как и в русском." }
  - { kind: usage, text: "Остаться загадкой — pozostać zagadką, с творительным." }
collocations:
  - { pl: "rozwiązać zagadkę", ru: "разгадать загадку" }
  - { pl: "mówić zagadkami", ru: "говорить загадками" }
etymology: "От zagadać «заговорить», корень gadać «говорить». Русская «загадка» — от «гадать»: смысл общий, корни разные."
memory: "zagadka — «загадка» и «тайна». Разгадать её по-польски значит «решить»: rozwiązać zagadkę. И mówić zagadkami — «говорить загадками», с творительным."
idioms:
  - { pl: "rozwiązać zagadkę", ru: "разгадать загадку" }
  - { pl: "mówić zagadkami", ru: "говорить загадками" }
formExamplesSkip:
