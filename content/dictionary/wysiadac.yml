        source: { kind: authored }
  - id: break-down
    ru: "сдавать, отказывать (разг.)"
    examples:
      - pl: "Silnik wysiada przy każdym mrozie."
        ru: "Двигатель сдаёт при каждом морозе."
        source: { kind: authored }
