        ru: "Почки у него сдавали годами."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Это несовершенная пара к WYSIĄŚĆ из партии 283, и числа форм складываются так же, как у WYCZUĆ и WYCZUWAĆ. У совершенного WYSIĄŚĆ сорок две формы: сорок одна основная плюс деепричастие WYSIADŁSZY. У несовершенного WYSIADAĆ пятьдесят две: те же сорок одна, но вместо деепричастия на -SZY добавляются десять форм действительного причастия WYSIADAJĄCY и деепричастие WYSIADAJĄC. Разница ровно в десять форм. Страдательных причастий нет ни у одного из двух: глагол непереходный, выходят ИЗ чего-то, а не что-то." }
  - { kind: usage, text: "Повелительное WYSIADAJ и инфинитив в вежливой просьбе — то, что слышно в польском транспорте каждый день: PROSZĘ WYSIADAĆ значит «прошу выходить», и объявляют так на конечной. Сравните с парной формой: PROSZĘ WSIADAĆ — «прошу садиться». Обе пары приставок, WSIADAĆ и WYSIADAĆ, построены на одном корне, тогда как русский берёт «садиться в» и «выходить из» — два разных корня. Польский тут проще, и запомнив SIADAĆ, вы получаете обе половины." }
  - { kind: usage, text: "Разговорное значение русскому надо запомнить отдельно, потому что переносить нечего: SILNIK WYSIADA — «двигатель сдаёт», KOMPUTER WYSIADA — «компьютер отказывает», NERKI WYSIADAJĄ — «почки сдают». То есть всё, что постепенно перестаёт работать, по-польски «выходит». В несовершенном виде это особенно удобно: речь о повторяющемся или длящемся отказе, а не о единичном, для которого есть WYSIADŁ." }
  - { kind: government, text: "Берёт предлог Z с родительным: WYSIADAĆ Z AUTOBUSU, Z POCIĄGU, Z SAMOCHODU — ровно как русское «выходить из автобуса». Место выхода идёт с NA и предложным: WYSIADAĆ NA NASTĘPNYM PRZYSTANKU. Повелительное WYSIADAJ выходит из третьего лица WYSIADA прибавлением -j, по правилу карточки KARMIĆ, и никакой мены в основе тут нет — в отличие от совершенного WYSIĄŚĆ, где основа меняется трижды." }
collocations:
  - { pl: "proszę wysiadać", ru: "прошу выходить" }
  - { pl: "wysiadać z autobusu", ru: "выходить из автобуса" }
