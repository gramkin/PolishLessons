family:
  - { pl: "wysiąść", ru: "выйти (из транспорта)", relation: aspect, id: wysiasc }
  - { pl: "wsiadać", ru: "садиться (в транспорт)", relation: antonym, id: wsiadac }
  - { pl: "siadać", ru: "садиться", relation: root, id: siadac }
etymology: "Приставка wy- и SIADAĆ «садиться», многократная форма от SIĄŚĆ, из праславянского *sěsti — то же слово, что русское «сесть». Многократный суффикс -da- делает действие длящимся или повторяющимся, отсюда несовершенный вид. Приставочная пара WSIADAĆ и WYSIADAĆ делит вход и выход одним корнем, чего русский не делает. Из гнезда вышли PRZESIADAĆ SIĘ «пересаживаться», SIEDZIEĆ «сидеть», SIEDZENIE «сиденье», POSIEDZENIE «заседание»."
memory: "Пара к wysiąść: там 42 формы, здесь 52 — ровно на десять форм действительного причастия больше. И запомните объявление: proszę wysiadać."
