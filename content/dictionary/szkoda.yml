# review
id: szkoda
format: 2
lemma: "szkoda"
rank: 734
pos: noun
pron: { cyr: "шко́да" }
senses:
  - id: pity
    ru: "szkoda, że… — жаль, что… (не существительное, а сказуемое)"
    note: "Именительный szkoda почти всегда значит «жаль»."
    examples:
      - pl: "Szkoda, że Tom odchodzi."
        ru: "Жаль, что Том уходит."
        source: { kind: tatoeba, id: 13785966 }
      - pl: "Szkoda, że on nie ma poczucia humoru."
        ru: "Жаль, что у него нет чувства юмора."
        source: { kind: tatoeba, id: 458059 }
      - pl: "Jaka szkoda, że ona nie może przyjść!"
        ru: "Как жаль, что она не может прийти!"
        source: { kind: tatoeba, id: 924592 }
  - id: damage
    ru: "ущерб, убыток (существительное)"
    examples:
      - pl: "Musisz pokryć szkody."
        ru: "Ты должен покрыть убытки."
        source: { kind: translated, id: 4428992 }
      - pl: "Szkody sięgnęły miliona jenów."
        ru: "Убытки достигли миллиона иен."
        source: { kind: translated, id: 13782743 }
      - pl: "Tajfun spowodował straszliwe szkody."
        ru: "Тайфун причинил страшный ущерб."
        source: { kind: translated, id: 919233 }
  - id: waste
    ru: "szkoda czasu, szkoda słów — жаль времени, не стоит слов"
    note: "После szkoda в этом значении — родительный падеж."
    examples:
      - pl: "Szkoda czasu."
        ru: "Жаль времени."
        source: { kind: authored }
      - pl: "Szkoda słów."
        ru: "Не стоит слов."
        source: { kind: authored }
      - pl: "Szkoda gadać."
        ru: "Что тут говорить."
        source: { kind: authored }
  - id: too-late
    ru: "po szkodzie — после беды, задним числом"
    examples:
      - pl: "Mądry Polak po szkodzie."
        ru: "Мудрый поляк — после беды."
        source: { kind: translated, id: 516421 }
      - pl: "Już po szkodzie."
        ru: "Спохватились, когда уже поздно."
        source: { kind: translated, id: 11433242 }
      - pl: "Po szkodzie każdy jest mądry."
        ru: "После беды все умные."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Главное о слове: в именительном падеже szkoda — это обычно не существительное, а сказуемое «жаль». Szkoda, że nie przyszedłeś «Жаль, что ты не пришёл». Запятая перед że обязательна." }
  - { kind: government, text: "В значении «жаль» слово требует родительного падежа: szkoda czasu «жаль времени», szkoda pieniędzy «жаль денег», szkoda słów «не стоит слов»." }
  - { kind: usage, text: "Во всех остальных формах это существительное «ущерб, убыток»: pokryć szkody «покрыть убытки», wyrządzić szkodę «причинить ущерб»." }
  - { kind: false-friend, text: "Не путайте szkoda «жаль, ущерб» со szkoła «школа» — слова разные и корни разные." }
  - { kind: usage, text: "Mądry Polak po szkodzie — польская поговорка о том, что умнеют задним числом; русский аналог — «задним умом крепок»." }
collocations:
  - { pl: "szkoda, że…", ru: "жаль, что…" }
  - { pl: "szkoda czasu", ru: "жаль времени" }
  - { pl: "pokryć szkody", ru: "покрыть убытки" }
  - { pl: "wyrządzić szkodę", ru: "причинить ущерб" }
family:
  - { pl: "szkodzić", ru: "вредить", relation: root }
  - { pl: "szkodliwy", ru: "вредный", relation: derived }
  - { pl: "uszkodzić", ru: "повредить", relation: derived }
etymology: "Праславянское *škoda «вред» — то же слово, что русское «шкода» (озорство, вред) и украинское «шкода»; в польском сохранилось основное значение «ущерб»."
memory: "Два слова в одном. В именительном szkoda — это почти всегда сказуемое «жаль»: Szkoda, że nie przyszedłeś, и с родительным — szkoda czasu «жаль времени». Во всех остальных формах это существительное «ущерб»: pokryć szkody, wyrządzić szkodę. И не путайте со szkoła «школа»."
idioms:
  - { pl: "szkoda słów", ru: "не стоит слов" }
  - { pl: "szkoda gadać", ru: "что тут говорить" }
  - { pl: "mądry Polak po szkodzie", ru: "задним умом крепок" }
formExamplesSkip:
  - { form: "szkodo", reason: "звательный падеж у неодушевлённого отвлечённого существительного не употребляется" }
