# review
id: brat
format: 2
lemma: "brat"
rank: 254
pos: noun
pron: { cyr: "брат" }
senses:
  - id: brother
    ru: "брат"
    examples:
      - pl: "Mam brata."
        ru: "У меня есть брат."
        source: { kind: tatoeba, id: 4721696 }
      - pl: "Nie mam braci."
        ru: "У меня нет братьев."
        source: { kind: tatoeba, id: 545822 }
      - pl: "Masz dwóch braci."
        ru: "У тебя два брата."
        source: { kind: tatoeba, id: 928159 }
  - id: brothers
    ru: "брат (в обращении, в переносном смысле)"
    examples:
      - pl: "Bracia!"
        ru: "Братья!"
        source: { kind: tatoeba, id: 8745305 }
      - pl: "Byliśmy jak bracia."
        ru: "Мы были как братья."
        source: { kind: tatoeba, id: 10584108 }
      - pl: "Bob i Tom to bracia."
        ru: "Боб и Том — братья."
        source: { kind: tatoeba, id: 574986 }
notes:
  - { kind: usage, text: "Множественное число неправильное: brat, но bracia «братья», braci «братьев», braciom, braćmi. Русское «брат → братья» устроено похоже." }
  - { kind: usage, text: "Звательный падеж bracie живой и частый: Dzięki, bracie! «Спасибо, брат!»" }
  - { kind: usage, text: "brat cioteczny / brat stryjeczny — «двоюродный брат»; być za pan brat z kimś — «быть на короткой ноге»." }
collocations:
  - { pl: "starszy brat", ru: "старший брат" }
  - { pl: "młodszy brat", ru: "младший брат" }
  - { pl: "brat i siostra", ru: "брат и сестра" }
  - { pl: "rodzony brat", ru: "родной брат" }
etymology: "Общеславянское слово, праславянское *bratrъ / *bratъ — то же, что русское «брат»; родственно латинскому frater."
memory: "brat — «брат», но множественное неправильное: bracia «братья», braci «братьев». И звательный падеж живой: Bracie!"
idioms:
  - { pl: "być za pan brat", ru: "быть на короткой ноге" }
  - { pl: "ani brat, ani swat", ru: "ни сват ни брат" }
  - { pl: "brat łata", ru: "свой парень, рубаха-парень" }
