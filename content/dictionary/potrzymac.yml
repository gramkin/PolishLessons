# review
id: potrzymac
format: 2
lemma: "potrzymać"
rank: 3032
pos: verb
pron: { cyr: "потшы́маць" }
senses:
  - id: hold-a-while
    ru: "подержать (недолго)"
    examples:
      - pl: "Potrzymaj mi torbę, zawiążę but."
        ru: "Подержи мне сумку, я завяжу шнурок."
        source: { kind: authored }
      - pl: "Potrzymał drabinę, póki nie zszedłem."
        ru: "Он подержал лестницу, пока я не спустился."
        source: { kind: authored }
      - pl: "Potrzymam dziecko, idź spokojnie."
        ru: "Я подержу ребёнка, иди спокойно."
        source: { kind: authored }
  - id: keep-for-a-time
    ru: "подержать, продержать (в каком-л. состоянии)"
    examples:
      - pl: "Potrzymali go w szpitalu jeszcze dwa dni."
        ru: "Его продержали в больнице ещё два дня."
        source: { kind: authored }
      - pl: "Potrzymaj ciasto w piekarniku kwadrans dłużej."
        ru: "Подержи пирог в духовке на четверть часа дольше."
        source: { kind: authored }
notes:
  - { kind: government, text: "Самое полезное в этой карточке — сравнение с DOTRZYMAĆ из предыдущей партии. Один корень, один класс, но падежи разные: POTRZYMAĆ берёт ВИНИТЕЛЬНЫЙ — POTRZYMAJ TORBĘ, DRABINĘ, DZIECKO, — а DOTRZYMAĆ требует РОДИТЕЛЬНОГО: DOTRZYMAĆ SŁOWA, TERMINU. То есть приставка здесь решает падеж, и выучить надо каждую пару отдельно. Кому — дательный: POTRZYMAJ MI TORBĘ. Сколько — винительный без предлога: POTRZYMAĆ MINUTĘ, DWA DNI." }
  - { kind: usage, text: "Приставка po- тут та же ограничительная, что в POSIEDZIEĆ: «недолго, немного». И русский пользуется ею так же — POTRZYMAĆ «подержать», POCZEKAĆ «подождать», POLEŻEĆ «полежать». Поэтому просьба POTRZYMAJ MI TO строится и понимается без перевода. Второе значение, о больнице или духовке, русский передаёт то «подержать», то «продержать», и выбор зависит от того, насколько долго: POTRZYMALI GO DWA DNI — «продержали два дня»." }
  - { kind: pronunciation, text: "Сочетание TRZ читается «тш», одним движением: всё слово звучит «потшы́маць». Настоящее время на -AM, как у CZYTAĆ: POTRZYMAM, POTRZYMASZ, POTRZYMA — основа инфинитива сохраняется целиком, никакой мены нет. Повелительное POTRZYMAJ оканчивается на -AJ и строится от той же основы." }
  - { kind: false-friend, text: "Русское «потрёпать» или «потрогать» тут ни при чём, хотя начало слова похоже: корень в POTRZYMAĆ тот же, что в «держать», и ничего общего с «трогать» он не имеет. Зато стоит запомнить польское TRZYMAĆ SIĘ — «держаться», и обиходное TRZYMAJ SIĘ, которым заканчивают письма и разговоры: это «держись» или «пока», смотря по тону." }
collocations:
  - { pl: "potrzymaj mi to", ru: "подержи мне это" }
  - { pl: "potrzymać drabinę", ru: "подержать лестницу" }
  - { pl: "potrzymać w szpitalu", ru: "продержать в больнице" }
family:
  - { pl: "trzymać", ru: "держать", relation: root, id: trzymac }
  - { pl: "dotrzymać", ru: "сдержать, соблюсти", relation: root, id: dotrzymac }
  - { pl: "zatrzymać", ru: "остановить, задержать", relation: root, id: zatrzymac }
etymology: "Приставка po- в ограничительном значении и TRZYMAĆ, из праславянского *trimati, родственного русскому «держать». Приставка po- отмеряет действию небольшой срок, и русский делает то же самое той же приставкой: «подержать», «подождать», «посидеть». Поэтому из всего гнезда TRZYMAĆ именно POTRZYMAĆ переносится на русский без усилия, тогда как DOTRZYMAĆ и ZATRZYMAĆ приходится учить отдельно: первое значит «сдержать», второе «остановить», и ни одно не выводится из приставки по русскому образцу."
memory: "po- значит «недолго», как в русском: potrzymaj mi to «подержи мне это». И внимание на падеж: potrzymać берёт винительный, а dotrzymać — родительный."
idioms:
  - { pl: "potrzymaj mi to", ru: "подержи мне это" }
  - { pl: "trzymaj się", ru: "держись; пока" }
