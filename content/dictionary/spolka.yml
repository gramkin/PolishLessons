  - { pl: "wspólnik", ru: "компаньон", relation: derived, id: wspolnik }
  - { pl: "spoldzielnia", ru: "кооператив", relation: derived }
etymology: "От старого SPÓŁ «сообща», буквально «с половиной»: каждый вносит свою половину. Тот же корень в русских «пополам» и «сполна»."
memory: "Spółka — компания, общество: spółka akcyjna. Na spółkę — вскладчину. Читается «спу́ука». Wspólny — общий, wspólnik — компаньон, spółdzielnia — кооператив."
idioms:
