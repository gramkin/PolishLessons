notes:
  - { kind: false-friend, text: "SPÓŁKA — юридическое лицо, компания: SPÓŁKA AKCYJNA — акционерное общество, а SPÓŁKA Z OGRANICZONĄ ODPOWIEDZIALNOŚCIĄ — наше ООО. В разговоре это ещё совместность: NA SPÓŁKĘ — «вскладчину», DO SPÓŁKI Z KIMŚ — «на пару с кем-то». Корень тот же, что в WSPÓLNY «общий», WSPÓLNIK «компаньон» и SPÓŁDZIELNIA «кооператив»." }
  - { kind: usage, text: "Десять форм в таблице, женский род. В дательном и местном падежах K переходит в C: W SPÓŁCE. В родительном множественного беглое E: SPÓŁEK. Звательная форма не нужна." }
  - { kind: government, text: "Работать в компании — PRACOWAĆ W SPÓŁCE, местный. Купить вскладчину — KUPIĆ NA SPÓŁKĘ, NA с винительным. Вместе с кем-то — DO SPÓŁKI Z KIMŚ, родительный и творительный." }
  - { kind: pronunciation, text: "Читается «спу́ука», два слога, ударение на первом. Ó звучит как «у», а Ł — как короткое «у», и вместе они дают протяжное «уу». В форме SPÓŁCE: «спу́уце»." }
collocations:
  - { pl: "spółka akcyjna", ru: "акционерное общество" }
  - { pl: "założyć spółkę", ru: "основать компанию" }
  - { pl: "spółka rodzinna", ru: "семейная компания" }
family:
