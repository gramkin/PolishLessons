etymology: "Из немецкого GROSCHEN, а то — из латинского denarius grossus «толстый денарий», от grossus «толстый», откуда и «гросс», и французское gros. Русский «грош» пришёл из того же немецкого источника, так что слова родные друг другу. Разошлась только судьба: польская монета осталась в обращении и называется в каждом ценнике, русская исчезла и уцелела лишь в поговорках."
memory: "Живая монета: сто groszy — один злотый, не то что русский «грош» из поговорок. Родительный grosza, местный groszu, родительный множественного только groszy."
idioms:
