notes:
  - { kind: usage, text: "Сто грошей составляют один злотый, и в отличие от русского гроша польский GROSZ — живая монета, которая лежит в кармане и называется в ценах. Русское «грош» уцелело только в поговорках: «ни гроша», «грош цена». Поэтому выражения совпадают дословно — NIE MAM ANI GROSZA «у меня нет ни гроша», CO DO GROSZA «до последнего гроша», LICZYĆ KAŻDY GROSZ «считать каждый грош», — а вот фразу о пятидесяти грошах по-русски придётся переводить копейками." }
  - { kind: usage, text: "Родительный множественного — только GROSZY, и дублета на -ów у слова нет. Это уточняет то, что сказано в карточке BAGAŻ: там зафиксированы и bagaży, и bagażów, и я вывел из этого, что колебание свойственно мягким основам как разряду. Grosz показывает, что вывод был слишком широк — основа такая же мягкая, а форма одна. Значит дублет надо проверять по каждому слову отдельно, а не предполагать по виду основы." }
  - { kind: usage, text: "Родительный единственного — GROSZA с окончанием -a, хотя монета неодушевлённая. Местный при этом GROSZU, так что формы расходятся. Напомню минимальную пару из этой же партии: OGON даёт ogona, а ZGON даёт zgonu, при том что слова различаются одной буквой. Выбор между -a и -u у мужских неодушевлённых не вычисляется ни из звучания, ни из значения." }
