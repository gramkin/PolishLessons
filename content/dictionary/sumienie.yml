notes:
  - { kind: false-friend, text: "ДВА ЯЗЫКА ПЕРЕВЕЛИ ОДНО И ТО ЖЕ ПОНЯТИЕ, НО С РАЗНЫХ ОРИГИНАЛОВ. Польское sumienie — калька латинского conscientia, из con- «вместе» и scire «знать». Русская «совесть» — калька греческого syneidesis, из syn- «вместе» и eidenai «знать». Та же мысль «со-знание», переведённая дважды, поэтому слова не похожи, а значат одно." }
  - { kind: usage, text: "Обороты стоит запомнить готовыми: czyste sumienie «чистая совесть», wyrzuty sumienia «угрызения совести», mieć coś na sumieniu «иметь что-то на совести», zgodnie z sumieniem «по совести». Прилагательное sumienny значит «добросовестный», а не «совестливый»: sumienny pracownik." }
  - { kind: pronunciation, text: "Четыре слога, ударение на предпоследнем: su-MIE-nie. Mie звучит как «мє», ni как нь: «сумє́не». Родительный множественного — sumień, с мягким нь на конце." }
collocations:
  - { pl: "czyste sumienie", ru: "чистая совесть" }
  - { pl: "wyrzuty sumienia", ru: "угрызения совести" }
  - { pl: "mieć na sumieniu", ru: "иметь на совести" }
family:
  - { pl: "sumienny", ru: "добросовестный", relation: derived }
  - { pl: "świadomość", ru: "сознание", relation: root }
  - { pl: "wina", ru: "вина", relation: root, id: wina }
etymology: "Калька латинского conscientia «со-знание», где con- «вместе» передано приставкой, а scire «знать» — корнем mnie-, тем же, что в mniemać «полагать» и русском «мнить», «память». Русская «совесть» калькирует греческое syneidesis по той же схеме. Отсюда sumienny и bezsumienny."
memory: "sumienie — «совесть». Слова не похожи, потому что калькировали разные оригиналы: польское с латинского conscientia, русское с греческого syneidesis, но мысль одна — «со-знание». Прилагательное sumienny значит «добросовестный»."
idioms:
  - { pl: "mieć coś na sumieniu", ru: "иметь что-л. на совести" }
  - { pl: "wyrzuty sumienia", ru: "угрызения совести" }
