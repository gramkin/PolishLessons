notes:
  - { kind: false-friend, text: "ZBIÓRKA — «сбор» денег или вещей и «сбор, построение» людей: ZBIÓRKA O ÓSMEJ! — «сбор в восемь!». Сборник — ZBIÓR. Онлайн-сбор — ZBIÓRKA INTERNETOWA или ZRZUTKA." }
  - { kind: usage, text: "Девять форм, женский род. В дательном и местном K переходит в C: NA ZBIÓRCE. Родительный множественного — ZBIÓREK. Звательный ZBIÓRKO не употребляется." }
  - { kind: government, text: "Сбор на что — ZBIÓRKA NA и винительный: ZBIÓRKA NA SCHRONISKO. Сбор чего — родительный: ZBIÓRKA KRWI, «сдача крови». На сборе — NA ZBIÓRCE." }
  - { kind: pronunciation, text: "Читается «збу́рка»: Ó — «у», ударение на предпоследнем слоге. ZBIÓRCE — «збу́рце»." }
collocations:
  - { pl: "zbiórka pieniędzy", ru: "сбор денег" }
  - { pl: "zbiórka na cel charytatywny", ru: "благотворительный сбор" }
