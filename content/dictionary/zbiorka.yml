etymology: "От ZBIERAĆ «собирать», с суффиксом -KA. Тот же корень, что в русском «сбор», «собирать», с польским Ó на месте Е."
memory: "Zbiórka — сбор денег и сбор людей. Zbiórka o ósmej! — сбор в восемь! Zbiórka na leczenie — сбор на лечение. Читается «збу́рка»."
