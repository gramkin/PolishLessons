# review
id: zdziwienie
format: 2
lemma: "zdziwienie"
rank: 5470
pos: noun
pron: { cyr: "здзиве́не" }
senses:
  - id: surprise
    ru: "удивление"
    examples:
      - pl: "Nauczyciele i koledzy ze zdziwieniem patrzą na zmieszanego ucznia, który pomylił Tiutczewa z Fetem."
        ru: "Учителя и одноклассники удивлённо смотрят на сконфуженного ученика, перепутавшего Тютчева с Фетом."
        source: { kind: tatoeba, id: 2495917 }
      - pl: "Dowiedziałem się, ze zdziwieniem, że ona nie żyje."
        ru: "Я с удивлением узнал, что её нет в живых."
        source: { kind: translated, id: 1473838 }
      - pl: "Obudził się i ze zdziwieniem stwierdził, że jest na ławce w parku."
        ru: "Он проснулся и с удивлением обнаружил, что лежит на скамейке в парке."
        source: { kind: translated, id: 362888 }
  - id: to-my-surprise
    ru: "к моему удивлению (ku zdziwieniu)"
    examples:
      - pl: "Ku mojemu zdziwieniu, drzwi były otwarte."
        ru: "К моему удивлению, дверь была открыта."
        source: { kind: translated, id: 502259 }
      - pl: "Ku memu zdziwieniu, on pięknie śpiewał."
        ru: "К моему удивлению, он прекрасно пел."
        source: { kind: translated, id: 705351 }
notes:
  - { kind: government, text: "Устойчивый оборот ku (mojemu) zdziwieniu «к моему удивлению» требует дательного падежа — ровно как русское «к удивлению»." }
  - { kind: usage, text: "Второй частый оборот — ze zdziwieniem «с удивлением», с творительным падежом." }
  - { kind: false-friend, text: "Корень dziw «диво» — ср. русское «диво», «удивление», «дивиться»." }
  - { kind: usage, text: "Отглагольное существительное от zdziwić się «удивиться»." }
  - { kind: usage, text: "Слово называет состояние и живёт в единственном числе: ze zdziwieniem, ku mojemu zdziwieniu, wyraz zdziwienia. Формы множественного числа в таблице есть, но в живых текстах не встречаются." }
collocations:
  - { pl: "ku mojemu zdziwieniu", ru: "к моему удивлению" }
  - { pl: "ze zdziwieniem", ru: "с удивлением" }
etymology: "От zdziwić się «удивиться», корень dziw «диво»; ср. русское «диво», «дивиться», «удивление»."
memory: "zdziwienie — «удивление», от dziw «диво». Два оборота стоит выучить целиком: ku mojemu zdziwieniu «к моему удивлению» и ze zdziwieniem «с удивлением»."
idioms:
