etymology: "От наречия TUTAJ «здесь», которое само из TU плюс усилительная частица, а TU восходит к праславянскому указательному корню, тому же, что в русском «тут». Суффикс -EJSZY здесь не степень сравнения, а старый способ делать прилагательные от наречий, и русский располагает точно таким же: «здесь» даёт «здешний», «сегодня» даёт «сегодняшний», «вчера» даёт «вчерашний». Сравните пары: TUTEJSZY и «здешний», DZISIEJSZY и «сегодняшний», WCZORAJSZY и «вчерашний». Оба языка построили одну и ту же группу слов одним и тем же приёмом, только от разных наречий: польский от TU, русский от «здесь»."
memory: "Главное здесь не значение, а разбор: -ejszy выглядит как сравнительная степень, но tutejszy ни от чего не степень, это прилагательное от наречия tutaj «здесь», ровно как русское «здешний» от «здесь». Та же группа: dzisiejszy «сегодняшний», wczorajszy «вчерашний». Степеней нет, одиннадцать форм. Tutejsi работает без существительного и значит «местные». Запомнить формулу nie jestem tutejszy, где после być стоит именительный, а не творительный."
idioms:
  - { pl: "nie jestem tutejszy", ru: "я не местный" }
