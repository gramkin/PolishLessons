notes:
  - { kind: false-friend, text: "Окончание -EJSZY сбивает с толку всех, кто уже выучил сравнительную степень. В польском -SZY и -EJSZY действительно образуют сравнительную степень: ŁATWY даёт ŁATWIEJSZY «легче», NOWY даёт NOWSZY «новее». Но TUTEJSZY не сравнительная степень ни от чего: это обычное относительное прилагательное от наречия TUTAJ «здесь». «Более тутошним» быть нельзя. Тот же обман в DZISIEJSZY «сегодняшний» от DZIŚ, WCZORAJSZY «вчерашний» от WCZORAJ и в ONEGDAJSZY «давнишний». Признак простой: если в основе наречие времени или места, то -EJSZY не степень, а суффикс." }
  - { kind: usage, text: "Одиннадцать форм, степеней сравнения нет, и по той же причине, что у ZEWNĘTRZNY и SREBRNY: прилагательное относительное. Мужско-личная форма TUTEJSI часто работает самостоятельно, без существительного, и означает местных жителей: TUTEJSI NIE CHODZĄ TĄ ŚCIEŻKĄ. Русский делает то же самое со словом «местные». В отрицательной конструкции слово ставят после глагола BYĆ в именительном, а не в творительном: NIE JESTEM TUTEJSZY, и это исключение из польской привычки ставить творительный после BYĆ." }
  - { kind: pronunciation, text: "Читается «туте́йшы», три слога, ударение на предпоследнем. Сочетание SZ даёт твёрдое «ш», а не «сь», так что конец слова звучит «йшы», с твёрдым «ы». Начальное TU читается просто «ту». В основе TUTAJ ударение падает на первый слог: «ту́тай», а в коротком TU гласная одна. Не путать SZ с Ś: TUTEJSZY это «туте́йшы», и мягкого «сь» здесь нет нигде." }
  - { kind: government, text: "Прилагательное только согласуется с существительным и падежом не управляет. Запомнить стоит наречия того же гнезда, потому что они употребительнее: TUTAJ и TU значат «здесь», STĄD «отсюда», TĘDY «этим путём, здесь» в смысле направления. Последнее особенно полезно: TĘDY PROSZĘ значит «сюда, пожалуйста», и русскому легко сказать вместо него TUTAJ, что будет означать «здесь», а не «этим путём»." }
  - { kind: register, text: "Слово нейтральное, живёт в разговоре о местах и людях. Частые обороты: TUTEJSI LUDZIE «местные люди», TUTEJSZA LUDNOŚĆ «местное население», TUTEJSZY ZWYCZAJ «местный обычай», TUTEJSZA GWARA «местный говор». Формула NIE JESTEM TUTEJSZY — обычный способ объяснить, почему спрашиваешь дорогу. Рядом стоит MIEJSCOWY, которое значит почти то же, но звучит официальнее и попадается в документах: LUDNOŚĆ MIEJSCOWA, CZAS MIEJSCOWY «местное время»." }
