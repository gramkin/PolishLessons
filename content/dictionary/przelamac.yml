etymology: "Приставка PRZE- плюс ŁAMAĆ «ломать», праславянское *lomiti; ср. русское «переломить»."
memory: "Przełamać — переломить: хлеб пополам, страх пополам, лёд пополам: przełamać pierwsze lody."
idioms:
