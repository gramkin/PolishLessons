        ru: "Лёд слишком твёрдый, чтобы его проломить."
        source: { kind: translated, id: 3866097 }
  - id: overcome
    ru: "преодолеть, сломить (страх, сопротивление, барьер); нарушить (тишину)"
    examples:
      - pl: "Musiała przełamać strach przed wodą."
        ru: "Ей пришлось преодолеть страх перед водой."
        source: { kind: authored }
      - pl: "Tom spróbował przełamać lody."
        ru: "Том попытался растопить лёд."
        source: { kind: translated, id: 13690533 }
      - pl: "Dźwięk strzelania z karabinu przełamał poranną ciszę."
        ru: "Звук винтовочного выстрела нарушил утреннюю тишину."
        source: { kind: translated, id: 8763015 }
  - id: break-through
    ru: "прорвать (фронт, оборону); в теннисе — взять подачу соперника"
    examples:
      - pl: "W maju 1915 roku wojska przełamały front pod Gorlicami."
        ru: "В мае 1915 года войска прорвали фронт под Горлице."
        source: { kind: authored }
      - pl: "Polak przełamał rywala w piątym gemie."
        ru: "Поляк взял подачу соперника в пятом гейме."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "PRZEŁAMAĆ — не «переломать» (переломать всё подряд — POŁAMAĆ). Это «переломить надвое» или, чаще, «преодолеть, сломить»: PRZEŁAMAĆ STRACH, OPÓR, BARIERĘ, IMPAS. PRZEŁAMAĆ CISZĘ — «нарушить тишину»." }
  - { kind: usage, text: "Совершенный вид; несовершенный — PRZEŁAMYWAĆ. Спряжение с чередованием M → MI: PRZEŁAMIĘ, PRZEŁAMIESZ, PRZEŁAMIĄ. Повелительное — PRZEŁAM, PRZEŁAMCIE. С SIĘ: PRZEŁAMAĆ SIĘ «пересилить себя» (PRZEŁAMAŁ SIĘ I ZADZWONIŁ) и в рождественском обычае PRZEŁAMAĆ SIĘ OPŁATKIEM «разломить облатку, поздравляя друг друга»." }
  - { kind: government, text: "Что — винительный падеж: PRZEŁAMAĆ OPÓR. В отрицании — родительный: NIE PRZEŁAMAŁ OPORU. В спортивном значении объект — соперник: PRZEŁAMAĆ RYWALA «взять подачу соперника», отсюда и мужско-личное PRZEŁAMANI." }
  - { kind: pronunciation, text: "Ł читается «у»: «пшэуа́маць», PRZEŁAMAŁ — «пшэуа́мау». Ударение на предпоследнем слоге." }
collocations:
