# review
id: przelamac
format: 2
lemma: "przełamać"
rank: 6038
pos: verb
aspect: perf
pron: { cyr: "пшэуа́маць" }
senses:
  - id: break-in-two
    ru: "переломить, разломить надвое"
    examples:
      - pl: "Ojciec przełamał chleb i podał mi połowę."
        ru: "Отец разломил хлеб и дал мне половину."
