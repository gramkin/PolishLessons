  - { pl: "dzielić", ru: "делить", relation: root, id: dzielic }
etymology: "От DZIAŁ «раздел, отдел», а тот от DZIELIĆ, из праславянского *dělъ «часть, доля» — того же корня, что русские «делить», «доля», «отдел» и «предел». Участок земли — это буквально отделённая часть, выделенная доля, и русская «делянка» построена от того же корня тем же способом. Слово прозрачно для русского насквозь, что в этой партии редкость."
memory: "Дательный и местный działce, k даёт c; родительный множественного działek с беглым e. Корень — «делить», участок есть выделенная доля."
