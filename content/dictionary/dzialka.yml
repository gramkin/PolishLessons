notes:
  - { kind: usage, text: "Дательный и местный — DZIAŁCE: k переходит в c перед окончанием -e. Это седьмой случай в карточках рядом с kostce, kulce, szafce, gorączce, setce и klinice, и восьмой даёт STAWKA из этой же партии. Родительный множественного — DZIAŁEK, с беглым e, вставленным, чтобы развести согласные: так же kostek, kulek, szafek, setek, stawek. Обе черты идут вместе у всех женских слов на -ka, и выучив одно такое слово, вы получаете всю группу." }
  - { kind: usage, text: "По форме это уменьшительное от DZIAŁ, но по смыслу уже нет: działka не «маленький отдел», а самостоятельное слово со своим значением — участок земли. Суффикс -ka в польском часто так застывает: слово рождается уменьшительным и перестаёт им быть. Полезно не искать в таких словах оттенка малости — stawka тоже не «маленький staw»." }
  - { kind: usage, text: "За словом стоит целое явление, которого в русском быту нет под этим именем. OGRÓDEK DZIAŁKOWY — это городской садовый участок, часто крошечный, где поляки выращивают овощи и проводят выходные; целые кварталы таких участков окружают города. Русская «дача» — ближайшее соответствие, но это обычно дом с землёй, а działka чаще земля с беседкой. Переводить «дачей» можно, но образ выходит богаче, чем на самом деле." }
collocations:
  - { pl: "działka budowlana", ru: "участок под застройку" }
  - { pl: "ogródek działkowy", ru: "садовый участок" }
