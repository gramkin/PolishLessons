# review
id: uciekac
format: 2
lemma: "uciekać"
rank: 468
pos: verb
aspect: imperf
aspectPair: uciec
pron: { cyr: "уцье́каць" }
senses:
  - id: run-away
    ru: "убегать, бежать"
    examples:
      - pl: "Czemu ucieka?"
        ru: "Почему он убегает?"
        source: { kind: tatoeba, id: 13784848 }
      - pl: "Tysiące ludzi ucieka przed wojną."
        ru: "Тысячи людей бегут от войны."
        source: { kind: tatoeba, id: 13264472 }
      - pl: "Ogień! Uciekaj!"
        ru: "Огонь! Беги!"
        source: { kind: tatoeba, id: 975964 }
  - id: slip-away
    ru: "уходить, ускользать (о времени, поезде)"
    examples:
      - pl: "Czas ucieka."
        ru: "Время уходит."
        source: { kind: authored }
      - pl: "Pociąg nam ucieka!"
        ru: "Поезд уходит!"
        source: { kind: authored }
      - pl: "Szczęście zbliża się powoli jak żółw, a ucieka jak sarna."
        ru: "Счастье приближается медленно, как черепаха, а убегает, как косуля."
        source: { kind: tatoeba, id: 8627627 }
notes:
  - { kind: usage, text: "Несовершенный вид к uciec: uciekać — «убегать вообще», uciec — «убежать один раз»." }
  - { kind: usage, text: "Убегают przed kimś/czymś — с творительным: uciekać przed wojną «бежать от войны», uciekać przed deszczem «убегать от дождя»." }
  - { kind: false-friend, text: "Буквально это «утекать»: u- + ciekać, того же корня, что ciec «течь». Русское «утекать» — то же слово, но польский увёл его от воды к бегству." }
  - { kind: usage, text: "О времени и транспорте говорят так же: Czas ucieka «Время уходит», Pociąg ucieka «Поезд уходит»." }
collocations:
  - { pl: "uciekać przed wojną", ru: "бежать от войны" }
  - { pl: "czas ucieka", ru: "время уходит" }
  - { pl: "uciekaj stąd!", ru: "беги отсюда!" }
  - { pl: "uciekać z domu", ru: "убегать из дома" }
etymology: "Из u- + ciekać, того же корня, что ciec «течь». Буквально «утекать»; русское «утекать» — то же слово, только польский перенёс его с воды на бегство."
memory: "uciekać буквально значит «утекать»: внутри сидит ciec «течь», как в русском «утекать». Отсюда и Czas ucieka «Время уходит», и Pociąg ucieka «Поезд уходит». Бегут przed kimś — с творительным: uciekać przed wojną. И запомните поговорку robota nie zając, nie ucieknie."
idioms:
  - { pl: "robota nie zając, nie ucieknie", ru: "работа не волк, в лес не убежит" }
  - { pl: "uciekać gdzie pieprz rośnie", ru: "бежать за тридевять земель" }
  - { pl: "dusza uciekła w pięty", ru: "душа ушла в пятки" }
