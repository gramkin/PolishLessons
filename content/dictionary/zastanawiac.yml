# review
id: zastanawiac
format: 2
lemma: "zastanawiać"
rank: 652
pos: verb
aspect: imperf
pron: { cyr: "застана́вяць" }
senses:
  - id: wonder
    ru: "zastanawiać się — размышлять, раздумывать, задаваться вопросом"
    note: "Самое частое употребление. Управление: zastanawiać się nad czymś — nad с творительным."
    examples:
      - pl: "Zastanawiam się, co powie Tom."
        ru: "Интересно, что скажет Том."
        source: { kind: translated, id: 3884259 }
      - pl: "Nad czym się zastanawiasz?"
        ru: "О чём ты раздумываешь?"
        source: { kind: translated, id: 591867 }
      - pl: "Zastanawiamy się nad kupnem nowego samochodu."
        ru: "Мы подумываем о покупке новой машины."
        source: { kind: translated, id: 2810117 }
  - id: puzzle
    ru: "озадачивать, наводить на размышления (кого-л. — винительный)"
    note: "Без się глагол переходный: Zastanawia mnie… «Меня озадачивает…»."
    examples:
      - pl: "Zastanawia mnie, czemu Tom kłamie."
        ru: "Меня озадачивает, почему Том лжёт."
        source: { kind: translated, id: 9686575 }
      - pl: "Zastanawia mnie, gdzie Tom mógłby być."
        ru: "Мне интересно, где мог бы быть Том."
        source: { kind: translated, id: 3679802 }
      - pl: "Zawsze mnie zastanawiało, dlaczego Hiszpania nie podbiła Portugalii."
        ru: "Меня всегда было интересно, почему Испания не завоевала Португалию."
        source: { kind: tatoeba, id: 4746972 }
notes:
  - { kind: government, text: "zastanawiać się nad czymś — предлог nad с творительным падежом: zastanawiam się nad tym «я думаю об этом». Русское «размышлять над» совпадает, но «думать о» — нет: *zastanawiać się o czymś ошибка." }
  - { kind: usage, text: "Без się глагол переходный и значит «озадачивать»: Zastanawia mnie jego milczenie «Меня озадачивает его молчание». Здесь mnie — винительный падеж, а не возвратная частица." }
  - { kind: usage, text: "Очень частая разговорная формула zastanawiam się, czy… отвечает русскому «интересно, …ли» или «хотел бы я знать»: Zastanawiam się, czy przyjdzie." }
  - { kind: usage, text: "Совершенный вид — zastanowić się: Zastanów się! «Подумай!». Существительное — zastanowienie «раздумье»: bez zastanowienia «не раздумывая»." }
collocations:
  - { pl: "zastanawiać się nad czymś", ru: "размышлять над чем-то" }
  - { pl: "zastanawiam się, czy...", ru: "интересно, ...ли" }
  - { pl: "bez zastanowienia", ru: "не раздумывая" }
  - { pl: "zastanów się", ru: "подумай" }
family:
  - { pl: "zastanowić się", ru: "подумать, поразмыслить", relation: derived }
  - { pl: "zastanowienie", ru: "раздумье", relation: derived }
etymology: "Приставка za- плюс stanowić/stanąć «стать, остановиться», от праславянского *stati — то же слово, что русское «стать». Буквально «остановиться мыслью над чем-то», ровно как русское «задуматься» от «думать»."
memory: "zastanawiać почти всегда встречается с się: zastanawiać się nad czymś «размышлять над чем-то» — предлог nad с творительным, как в русском «размышлять над». А вот «думать о чём-то» так сказать нельзя: *zastanawiać się o czymś ошибка. Без się глагол переходный и значит «озадачивать»: Zastanawia mnie jego milczenie — здесь mnie винительный падеж, а не возвратная частица. Выучите разговорную формулу zastanawiam się, czy… «интересно, …ли». Совершенный вид — zastanowić się: Zastanów się! «Подумай!»."
idioms:
  - { pl: "zastanawiam się, czy...", ru: "интересно, ...ли" }
  - { pl: "bez zastanowienia", ru: "не раздумывая" }
  - { pl: "zastanów się dobrze", ru: "подумай хорошенько" }
