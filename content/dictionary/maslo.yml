notes:
  - { kind: false-friend, text: "ПОЛЬСКОЕ MASŁO — ТОЛЬКО СЛИВОЧНОЕ. Растительное масло называется OLEJ, а оливковое — OLIWA. Русское «масло» покрывает всё разом, поэтому фраза «налей масла на сковороду» требует выбора: olej, если жарим, masło, если это кусок из холодильника. Ошибка тут выдаёт иностранца сразу." }
  - { kind: usage, text: "Предложный — w MAŚLE, с переходом sł в śl: smażyć w maśle. Родительный множественного — MASEŁ, с беглым e. А оборот JAK PO MAŚLE совпал с русским «как по маслу» буквально, вместе со значением «гладко, без заминок»." }
  - { kind: pronunciation, text: "Два слога, ударение на первом: MA-sło. Ł читается как краткое у, поэтому выходит «ма́суо». Предложный maśle звучит «ма́щле», с мягким щ." }
collocations:
  - { pl: "jak po maśle", ru: "как по маслу" }
  - { pl: "chleb z masłem", ru: "хлеб с маслом" }
  - { pl: "masło orzechowe", ru: "ореховое масло" }
family:
  - { pl: "olej", ru: "масло (растительное)", relation: root }
  - { pl: "oliwa", ru: "оливковое масло", relation: root }
  - { pl: "chleb", ru: "хлеб", relation: root, id: chleb }
etymology: "Из праславянского *maslo, от *mazati «мазать» — то, чем мажут. Русское «масло» то же самое слово и тот же корень, что в «мазать» и «мазь». Польский сузил его до сливочного, а для растительного взял olej из латинского oleum."
memory: "masło — только сливочное масло; растительное это olej, оливковое — oliwa. Русское «масло» покрывает всё. Предложный — w maśle, с sł→śl, а jak po maśle значит ровно «как по маслу»."
idioms:
  - { pl: "jak po maśle", ru: "как по маслу" }
  - { pl: "bułka z masłem", ru: "пустяковое дело" }
