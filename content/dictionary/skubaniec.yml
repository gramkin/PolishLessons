# review
id: skubaniec
format: 2
lemma: "skubaniec"
rank: 6002
pos: noun
pron: { cyr: "скуба́нец" }
senses:
  - id: rascal
    ru: "хитрец, пройдоха, ловкач (разг., шутл.)"
    examples:
      - pl: "Ten skubaniec znowu mnie oszukał!"
        ru: "Этот пройдоха опять меня обманул!"
        source: { kind: authored }
      - pl: "Ach, ty skubańcu, znowu wygrałeś!"
        ru: "Ах ты хитрец, опять выиграл!"
        source: { kind: authored }
      - pl: "Mały skubaniec zjadł wszystkie cukierki."
        ru: "Маленький хитрюга съел все конфеты."
        source: { kind: authored }
  - id: lucky-devil
    ru: "вот зараза, везунчик (с восхищением или завистью)"
    examples:
      - pl: "Wygrał na loterii, skubaniec jeden!"
        ru: "Выиграл в лотерею, вот зараза!"
        source: { kind: authored }
      - pl: "Skubaniec zdał wszystkie egzaminy bez nauki."
        ru: "Этот хитрец сдал все экзамены, не готовясь."
        source: { kind: authored }
notes:
  - { kind: register, text: "Разговорное и шутливое слово, вполне безобидное. В нём смешаны досада и восхищение: так говорят о ловкаче, которому всё сходит с рук, о шустром ребёнке, о везунчике. Смягчённая замена более резкого SKURCZYBYK." }
  - { kind: usage, text: "Мужской личный род, беглое E: SKUBANIEC → SKUBAŃCA, SKUBAŃCEM, звательный SKUBAŃCU. Во множественном две формы: SKUBAŃCY и экспрессивная SKUBAŃCE (TE SKUBAŃCE ZJADŁY CAŁY TORT)." }
  - { kind: pronunciation, text: "Читается «скуба́нец»; в косвенных падежах Ń перед C: SKUBAŃCA «скуба́ньца». Ударение на BA." }
collocations:
  - { pl: "ty skubańcu!", ru: "ах ты хитрец!" }
  - { pl: "mały skubaniec", ru: "маленький хитрюга" }
  - { pl: "sprytny skubaniec", ru: "ловкий пройдоха" }
family:
  - { pl: "skubać", ru: "щипать, ощипывать", relation: root, id: skubac }
  - { pl: "skubany", ru: "хитрец (разг.); ощипанный", relation: root }
synonyms: ["spryciarz", "cwaniak", "skurczybyk", "szczwany lis"]
etymology: "Связано с SKUBAĆ «щипать, ощипывать» и разговорным SKUBANY, которое служит мягкой заменой бранных слов."
memory: "Skubaniec — хитрец, который всех «ощипал» (skubać) и вышел сухим из воды. Mam cię, skubańcu! — Попался, хитрец!"
idioms:
  - { pl: "mam cię, skubańcu!", ru: "попался, хитрец!" }
