pron: { cyr: "по́граць" }
senses:
  - id: play-a-while
    ru: "поиграть (какое-то время)"
    examples:
      - pl: "Chodź, pogramy w piłkę."
        ru: "Пойдём, поиграем в мяч."
        source: { kind: authored }
      - pl: "Pograliśmy trochę w karty."
