  - id: play-music
    ru: "поиграть, помузицировать (на инструменте)"
    examples:
      - pl: "Pograł nam chwilę na gitarze."
        ru: "Он немного поиграл нам на гитаре."
        source: { kind: authored }
      - pl: "Pograj coś na pianinie."
        ru: "Сыграй что-нибудь на пианино."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "POGRAĆ — «поиграть», то есть играть недолго, ради удовольствия. Это не «сыграть» одну партию или роль: для этого есть ZAGRAĆ. POGRAĆ W GRY — «поиграть в игры», а не «проиграть» (PRZEGRAĆ)." }
  - { kind: usage, text: "Совершенный вид с оттенком «немного, некоторое время», как POSIEDZIEĆ, POCZYTAĆ. Спряжение как у GRAĆ: POGRAM, POGRASZ, POGRAJĄ. Отглагольное существительное POGRANIE и безличное POGRANO в живой речи почти не встречаются, поэтому в карточку не включены. Пара по смыслу — несовершенный GRAĆ." }
  - { kind: government, text: "Во что — W с винительным: POGRAĆ W SZACHY, W PIŁKĘ. На чём — NA с предложным: POGRAĆ NA GITARZE. С кем — Z с творительным: POGRAĆ Z DZIEĆMI." }
  - { kind: pronunciation, text: "Читается «по́граць»: ударение на предпоследнем слоге, конечное Ć — мягкое «ць». POGRAMY — «погра́мы», POGRAJĄ — «погра́йон»." }
  - { kind: register, text: "Разговорное, домашнее слово. О спорте на серьёзном уровне так не говорят: «команда сыграла матч» — DRUŻYNA ZAGRAŁA MECZ." }
collocations:
  - { pl: "pograć w piłkę", ru: "поиграть в мяч" }
  - { pl: "pograć w karty", ru: "поиграть в карты" }
  - { pl: "pograć na gitarze", ru: "поиграть на гитаре" }
family:
  - { pl: "grać", ru: "играть", relation: aspect, id: grac }
  - { pl: "zagrać", ru: "сыграть", relation: root, id: zagrac }
  - { pl: "gra", ru: "игра", relation: root, id: gra }
etymology: "Приставка PO- «немного, какое-то время» плюс GRAĆ «играть», праславянское *jьgrati. Русское «поиграть» построено точно так же, только польский потерял начальный гласный."
memory: "Pograć — поиграть немного: pograliśmy w karty. Сыграть одну партию — zagrać, проиграть — przegrać."
idioms:
  - { pl: "pograć komuś na nerwach", ru: "поиграть у кого-то на нервах" }
