# review
id: umiescic
format: 2
lemma: "umieścić"
rank: 1565
pos: verb
aspect: perf
pron: { cyr: "уме́сьциць" }
senses:
  - id: place
    ru: "поместить, разместить"
    examples:
      - pl: "Udało im się umieścić satelitę na orbicie."
        ru: "Им удалось вывести спутник на орбиту."
        source: { kind: translated, id: 977231 }
      - pl: "Tom umieścił znak na ścianie."
        ru: "Том поместил знак на стене."
        source: { kind: translated, id: 4130096 }
      - pl: "Tom umieścił walizki w samochodzie."
        ru: "Том поместил чемоданы в машину."
        source: { kind: translated, id: 2770462 }
  - id: put-into
    ru: "поместить (в учреждение)"
    examples:
      - pl: "Toma zaaresztowano i umieszczono w izolatce."
        ru: "Тома арестовали и поместили в одиночную камеру."
        source: { kind: tatoeba, id: 10747468 }
      - pl: "Ona została umieszczona w celi."
        ru: "Её поместили в камеру."
        source: { kind: translated, id: 12954460 }
      - pl: "Został umieszczony w izolatce."
        ru: "Он был помещён в изолятор."
        source: { kind: translated, id: 1591986 }
notes:
  - { kind: government, text: "umieścić требует винительного падежа для объекта и предлога w или na для места: umieścić coś w szafie «поместить что-то в шкаф», umieścić na liście «внести в список»." }
  - { kind: usage, text: "Несовершенный вид — umieszczać. Существительное umieszczenie значит «размещение»." }
  - { kind: usage, text: "Причастие umieszczony «помещённый, размещённый» часто встречается в инструкциях: Data produkcji jest umieszczona na pokrywce «Дата производства размещена на крышке»." }
  - { kind: usage, text: "Слово книжнее, чем położyć «положить» и włożyć «вложить»: umieścić звучит официально." }
collocations:
  - { pl: "umieścić na liście", ru: "внести в список" }
  - { pl: "umieścić w szafie", ru: "поместить в шкаф" }
  - { pl: "zostać umieszczonym", ru: "быть помещённым" }
etymology: "Приставка u- + mieścić «вмещать», от miejsce «место». Русское «поместить» собрано так же: приставка плюс «место». Совпадение полное."
memory: "umieścić = «поместить, разместить», буквально u- + miejsce «место», как русское «по-местить». Книжнее, чем położyć. Причастие umieszczony «размещён» живёт в инструкциях."
idioms:
  - { pl: "umieścić na liście", ru: "внести в список" }
  - { pl: "umieścić w internecie", ru: "разместить в интернете" }
  - { pl: "zostać umieszczonym", ru: "быть помещённым" }
