notes:
  - { kind: false-friend, text: "РУССКИЙ «НЕВОЛЬНИК» — ТО ЖЕ СЛОВО, НО ДРУГОГО РЕГИСТРА. Собрано оно одинаково: nie plus wola plus -nik против «не» плюс «воля» плюс «-ник». Но по-русски «невольник» звучит книжно и устарело, обычное слово — «раб». Польское niewolnik, наоборот, самое обыкновенное: это и исторический раб, и раб привычки." }
  - { kind: pronunciation, text: "МУЖСКО-ЛИЧНОЕ МНОЖЕСТВЕННОЕ МЕНЯЕТ K НА C: NIEWOLNICY. Тот же переход уже был в zakładnik — zakładnicy, а в словаре рядом стоят Polak — Polacy и rybak — rybacy. Четыре слога, ударение на предпоследнем: nie-wol-NIK — точнее nie-WOL-nik." }
  - { kind: usage, text: "Винительный как у всех мужско-личных совпадает с родительным: uwolnić niewolnika, uwolnić niewolników. Отвлечённое существительное — niewola «неволя, плен»: dostać się do niewoli «попасть в плен». Прилагательное niewolniczy: praca niewolnicza «рабский труд»." }
collocations:
