family:
  - { pl: "niewola", ru: "неволя, плен", relation: root }
  - { pl: "wola", ru: "воля", relation: root }
  - { pl: "wolny", ru: "свободный", relation: antonym, id: wolny }
etymology: "От niewola «неволя», то есть nie «не» плюс wola «воля», с суффиксом -nik, называющим лицо. Русское «невольник» построено из тех же трёх частей и в том же порядке. Корень wola тот же, что в русских «воля», «вольный», «позволить». Отсюда niewolnictwo «рабство» и niewolniczy."
memory: "niewolnik — «раб», хотя собрано слово как русское «невольник»: nie + wola + -nik. Разница в регистре: по-русски «невольник» книжно, по-польски niewolnik — обычное слово. Множественное niewolnicy, с k переходящим в c."
idioms:
