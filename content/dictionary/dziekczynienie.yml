# review
id: dziekczynienie
format: 2
lemma: "dziękczynienie"
rank: 3955
pos: noun
pron: { cyr: "дзенкчыне́не" }
senses:
  - id: thanksgiving
    ru: "благодарение, благодарность (особенно Богу)"
    examples:
      - pl: "Odprawiono mszę w dziękczynieniu za uratowanie dzieci."
        ru: "Отслужили мессу в благодарность за спасение детей."
        source: { kind: authored }
      - pl: "Modlitwa dziękczynienia zakończyła uroczystość."
        ru: "Благодарственная молитва завершила торжество."
        source: { kind: authored }
      - pl: "Złożył ofiarę na znak dziękczynienia."
        ru: "Он сделал пожертвование в знак благодарности."
        source: { kind: authored }
  - id: thanksgiving-day
    ru: "День благодарения (американский праздник)"
    examples:
      - pl: "W Święto Dziękczynienia Amerykanie jedzą indyka."
        ru: "На День благодарения американцы едят индейку."
        source: { kind: authored }
      - pl: "Na Dziękczynienie przyleciał do rodziców do Bostonu."
        ru: "На День благодарения он прилетел к родителям в Бостон."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Русское «благодарение» книжное и встречается почти только в «Дне благодарения» и церковном языке. Польское DZIĘKCZYNIENIE — тоже книжное и церковное: MSZA DZIĘKCZYNNA, MODLITWA DZIĘKCZYNIENIA. Обычное «спасибо, благодарность» — PODZIĘKOWANIE или WDZIĘCZNOŚĆ." }
  - { kind: usage, text: "Средний род, неодушевлённое, отглагольное существительное на -NIE. Множественное число почти не встречается, в карточке только единственное. Американский праздник пишут с заглавной: ŚWIĘTO DZIĘKCZYNIENIA, разговорно просто DZIĘKCZYNIENIE." }
  - { kind: government, text: "В благодарность за что-то — W DZIĘKCZYNIENIU ZA COŚ, ZA с винительным. В знак благодарности — NA ZNAK DZIĘKCZYNIENIA, родительный. Месса благодарения — MSZA DZIĘKCZYNNA, с прилагательным." }
  - { kind: pronunciation, text: "Читается «дзенкчыне́не», пять слогов, ударение на предпоследнем. DZIĘ — «дзен», носовое Ę перед K звучит «эн». KCZY — «кчы», скопление согласных без гласной." }
  - { kind: register, text: "Книжное, торжественное и церковное слово. В быту благодарят словами DZIĘKUJĘ, PODZIĘKOWANIE. О празднике говорят по-американски: THANKSGIVING или ŚWIĘTO DZIĘKCZYNIENIA, но в Польше его не празднуют." }
collocations:
  - { pl: "Święto Dziękczynienia", ru: "День благодарения" }
  - { pl: "na znak dziękczynienia", ru: "в знак благодарности" }
  - { pl: "modlitwa dziękczynienia", ru: "благодарственная молитва" }
family:
  - { pl: "dziękować", ru: "благодарить", relation: root, id: dziekowac }
  - { pl: "wdzięczność", ru: "благодарность", relation: root }
  - { pl: "dziękczynny", ru: "благодарственный", relation: derived }
etymology: "Сложение DZIĘK «благодарность» и CZYNIĆ «делать»: «делание благодарности», калька с латинского gratiarum actio. Русское «благодарение» собрано похоже, из «благо» и «дарить». DZIĘK — старое германское заимствование, родственное немецкому Dank."
memory: "Dziękczynienie — благодарение: Święto Dziękczynienia — День благодарения, msza dziękczynna. Dzięk + czynić. Читается «дзенкчыне́не»."
