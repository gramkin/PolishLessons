  - { pl: "koniak", ru: "коньяк", relation: root }
etymology: "Из английского WHISKY, а оно из гэльского UISGE BEATHA, «вода жизни». Та же идея в латинском AQUA VITAE и, по одной версии, в польском WÓDKA, «водичка»."
memory: "Whisky — виски, в польском женского рода: ta whisky, szkocka whisky. Не склоняется. Читается «ви́ски»."
idioms:
  - { pl: "whisky z lodem", ru: "виски со льдом, «на камнях»" }
