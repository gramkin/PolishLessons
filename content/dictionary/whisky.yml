notes:
  - { kind: false-friend, text: "WHISKY — «виски», но в польском женского рода: TA WHISKY, SZKOCKA WHISKY. В русском «виски» обычно мужского рода. Пишется по-английски, с WH и Y." }
  - { kind: usage, text: "Не склоняется: TA WHISKY, BEZ WHISKY, Z WHISKY. Род женский, по слову WÓDKA. В разговоре встречается и мужской: TEN WHISKY, но в норме — женский." }
  - { kind: government, text: "Виски со льдом — WHISKY Z LODEM, Z с творительным. Бутылка виски — BUTELKA WHISKY, родительный, форма та же." }
  - { kind: pronunciation, text: "Читается «ви́ски»: WH — как польское W, «в», Y в конце — «и», как в английском. Ударение на первом слоге." }
collocations:
  - { pl: "whisky z lodem", ru: "виски со льдом" }
  - { pl: "szkocka whisky", ru: "шотландский виски" }
  - { pl: "butelka whisky", ru: "бутылка виски" }
family:
