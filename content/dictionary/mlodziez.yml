  - { pl: "młodzieniec", ru: "юноша", relation: derived, id: mlodzieniec }
etymology: "От MŁODY «молодой», праславянского слова, общего с русским. Собирательный суффикс тот же, что в русском «молодёжь», только польский стянул «оло» в ŁO по закону полногласия."
memory: "Młodzież — молодёжь: mło- отвечает русскому «моло-», как młody и «молодой». Читается «муо́дзеш». Dla młodzieży — для молодёжи, młodzież szkolna — школьники. Złota młodzież — золотая молодёжь."
idioms:
  - { pl: "złota młodzież", ru: "золотая молодёжь" }
