notes:
  - { kind: usage, text: "Собирательное существительное женского рода: MŁODZIEŻ JEST, MŁODZIEŻ PRZYSZŁA. Живых форм три: MŁODZIEŻ, MŁODZIEŻY и MŁODZIEŻĄ. Формы множественного числа в таблице грамматически возможны, но на деле не употребляются." }
  - { kind: pronunciation, text: "Читается «муо́дзеш», два слога, ударение на первом. Ł — короткое «у», DZIE — «дзе», конечное Ż оглушается в «ш». Полногласие здесь видно сразу: MŁODZIEŻ и «молодёжь», MŁODY и «молодой»." }
  - { kind: government, text: "Для молодёжи — DLA MŁODZIEŻY, родительный. С молодёжью — Z MŁODZIEŻĄ, творительный. Работать с молодёжью — PRACOWAĆ Z MŁODZIEŻĄ." }
  - { kind: register, text: "В официальном языке MŁODZIEŻ — это прежде всего учащиеся: MŁODZIEŻ SZKOLNA, BILET DLA MŁODZIEŻY. ZŁOTA MŁODZIEŻ и BANANOWA MŁODZIEŻ — «золотая молодёжь», ироничное название детей богатых родителей." }
collocations:
  - { pl: "młodzież szkolna", ru: "школьники, учащаяся молодёжь" }
  - { pl: "dzisiejsza młodzież", ru: "нынешняя молодёжь" }
  - { pl: "młodzież akademicka", ru: "студенчество" }
family:
