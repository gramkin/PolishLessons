# review
id: geniusz
format: 2
lemma: "geniusz"
rank: 1865
pos: noun
pron: { cyr: "ге́ньюш" }
senses:
  - id: genius-person
    ru: "гений (человек)"
    examples:
      - pl: "To geniusz."
        ru: "Это гений."
        source: { kind: translated, id: 713481 }
      - pl: "Jego syn jest geniuszem."
        ru: "Его сын гений."
        source: { kind: tatoeba, id: 595079 }
      - pl: "On jest geniuszem."
        ru: "Он гений."
        source: { kind: translated, id: 532139 }
  - id: consider-genius
    ru: "гений (считать кого-либо гением); гениальность"
    examples:
      - pl: "Uważaliśmy go za geniusza."
        ru: "Мы считали его гением."
        source: { kind: tatoeba, id: 5518192 }
      - pl: "Uważa się ją za geniusza."
        ru: "Её считают гением."
        source: { kind: translated, id: 613024 }
      - pl: "Był to przebłysk geniuszu."
        ru: "Это был проблеск гениальности."
        source: { kind: translated, id: 10774157 }
notes:
  - { kind: government, text: "После być и uważać za стоит в творительном и винительном: jest geniuszem «он гений», uważali go za geniusza «его считали гением»." }
  - { kind: usage, text: "Слово значит и человека, и само качество: jego geniusz matematyczny «его математическая гениальность»." }
  - { kind: usage, text: "Винительный падеж совпадает с родительным, как у одушевлённых: uważam go za geniusza." }
  - { kind: false-friend, text: "Русское «гений» и польское geniusz — одно латинское слово; разница только в окончании и в том, что польское склоняется как мужской род на -usz." }
  - { kind: government, text: "Родительный падеж множественного числа существует в двух вариантах: geniuszy и geniuszów. Оба правильны, geniuszy встречается чаще." }
collocations:
  - { pl: "jest geniuszem", ru: "он гений" }
  - { pl: "uważać za geniusza", ru: "считать гением" }
  - { pl: "przebłysk geniuszu", ru: "проблеск гениальности" }
family:
  - { pl: "genialny", ru: "гениальный", relation: root }
  - { pl: "talent", ru: "талант", relation: root, id: talent }
  - { pl: "mądry", ru: "умный", relation: root, id: madry }
etymology: "Из латинского genius «дух-покровитель», через которое слово пришло и в русский. Отсюда же второе, старое значение — дух места."
memory: "geniusz — «гений», и человек, и само качество. После być — творительный: jest geniuszem. Считать гением — uważać za geniusza."
idioms:
  - { pl: "jest geniuszem", ru: "он гений" }
  - { pl: "uważać za geniusza", ru: "считать гением" }
  - { pl: "przebłysk geniuszu", ru: "проблеск гениальности" }
