pos: noun
pron: { cyr: "да́фца" }
senses:
  - id: donor
    ru: "донор"
    examples:
      - pl: "Jest honorowym dawcą krwi."
        ru: "Он почётный донор крови."
        source: { kind: authored }
      - pl: "Szukają dawcy szpiku dla chłopca."
        ru: "Для мальчика ищут донора костного мозга."
        source: { kind: authored }
      - pl: "Dawca nerki jest jej bratem."
        ru: "Донор почки — её брат."
        source: { kind: authored }
      - pl: "Każdy może zostać dawcą."
        ru: "Каждый может стать донором."
        source: { kind: authored }
      - pl: "Na kartę dawcy wpisał swoją zgodę."
        ru: "В карточку донора он вписал своё согласие."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "DAWCA — «донор», от DAWAĆ «давать»: тот, кто даёт. Донор крови — DAWCA KRWI или одним словом KRWIODAWCA. Тот, кто получает, — BIORCA, от BRAĆ «брать»." }
  - { kind: usage, text: "Девять живых форм. Мужской род, но в единственном склоняется как женское на -A: DAWCY, DAWCĘ, DAWCĄ. Во множественном — DAWCY, DAWCÓW. О женщине тоже говорят DAWCA. Звательный не даётся." }
  - { kind: government, text: "Донор чего — родительный: DAWCA KRWI, DAWCA NARZĄDÓW. Стать донором — ZOSTAĆ DAWCĄ, творительный." }
  - { kind: pronunciation, text: "Читается «да́фца», два слога, ударение на первом. W перед C оглушается в «ф»." }
collocations:
  - { pl: "dawca krwi", ru: "донор крови" }
  - { pl: "honorowy dawca krwi", ru: "почётный донор крови" }
  - { pl: "dawca narządów", ru: "донор органов" }
family:
  - { pl: "dawać", ru: "давать", relation: root, id: dawac }
  - { pl: "krwiodawca", ru: "донор крови", relation: derived }
  - { pl: "biorca", ru: "реципиент", relation: root }
etymology: "От DAWAĆ «давать» с суффиксом деятеля -CA: «дающий». Пара к нему — BIORCA, «берущий», от BRAĆ."
memory: "Dawca — донор, «дающий»; biorca — реципиент. Читается «да́фца». Honorowy dawca krwi — почётный донор крови."
idioms:
  - { pl: "dać z siebie wszystko", ru: "выложиться полностью" }
