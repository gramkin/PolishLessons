# review
id: baza
format: 2
lemma: "baza"
rank: 1049
pos: noun
pron: { cyr: "ба́за" }
senses:
  - id: military
    ru: "база (военная)"
    examples:
      - pl: "Po drugiej stronie księżyca znajduje się sekretna baza."
        ru: "На обратной стороне Луны находится секретная база."
        source: { kind: translated, id: 8231455 }
      - pl: "Wielka Brytania ma dwie bazy wojskowe na Cyprze."
        ru: "У Великобритании две военные базы на Кипре."
        source: { kind: translated, id: 3127701 }
      - pl: "Wojsko opuściło bazę."
        ru: "Войска покинули базу."
        source: { kind: authored }
  - id: database
    ru: "baza danych — база данных"
    examples:
      - pl: "Obawiam się, że w państwa bazie danych nie ma mojego nowego adresu."
        ru: "Боюсь, что в вашей базе данных нет моего нового адреса."
        source: { kind: translated, id: 631958 }
      - pl: "Ta baza zawiera bardzo dużo błędów."
        ru: "В этой базе очень много ошибок."
        source: { kind: translated, id: 1357241 }
      - pl: "Stworzyliśmy bazę danych klientów."
        ru: "Мы создали базу данных клиентов."
        source: { kind: authored }
  - id: basis
    ru: "основа: na bazie czegoś «на основе чего-то»"
    examples:
      - pl: "Nie jem mięsa, ryb, skorupiaków, ani bulionu na bazie mięsa."
        ru: "Я не ем мяса, рыбы, моллюсков и бульона на основе мяса."
        source: { kind: translated, id: 13343225 }
      - pl: "Krem na bazie wody jest lżejszy."
        ru: "Крем на водной основе легче."
        source: { kind: authored }
notes:
  - { kind: government, text: "na bazie czegoś «на основе чего-то» — предлог na с предложным падежом: na bazie wody «на водной основе», na bazie mleka «на основе молока»." }
  - { kind: usage, text: "Самый частый оборот — baza danych «база данных», точное соответствие русскому. Родительный — bazy danych." }
  - { kind: usage, text: "Женский род на -a, склоняется как kobieta: baza, bazy, bazie, bazę, bazą." }
  - { kind: usage, text: "Разговорное Kumasz bazę? «Врубаешься?» — молодёжный сленг, в нейтральной речи так не говорят." }
collocations:
  - { pl: "baza danych", ru: "база данных" }
  - { pl: "baza wojskowa", ru: "военная база" }
  - { pl: "na bazie", ru: "на основе" }
family:
  - { pl: "bazowy", ru: "базовый", relation: derived }
  - { pl: "bazować", ru: "основываться, базироваться", relation: derived }
etymology: "Через французское base и латинское basis из греческого basis «основание, шаг» — тот же источник, что у русской «базы»."
memory: "baza — «база» во всех смыслах сразу: baza wojskowa «военная база», baza danych «база данных» и na bazie czegoś «на основе чего-то». Женский род, склоняется как kobieta."
idioms:
  - { pl: "baza danych", ru: "база данных" }
  - { pl: "na bazie czegoś", ru: "на основе чего-то" }
formExamplesSkip:
