etymology: "От ŻYD «еврей», из латинского Judaeus через древневерхненемецкий или итальянский, от имени колена Иуды. Русское «иудей» — из того же корня через греческий. В польском, чешском и словацком производное ŻYD стало нейтральным словом, а в русском сходная форма стала бранной."
memory: "Żydowski — еврейский, нейтрально и официально: cmentarz żydowski, kuchnia żydowska, Muzeum Historii Żydów Polskich. Żyd по-польски не оскорбление! Читается «жыдо́вски»."
