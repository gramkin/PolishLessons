notes:
  - { kind: false-friend, text: "Важнейшая ловушка для русского. Польское ŻYD, ŻYDOWSKI — нейтральные, литературные и официальные слова: «еврей», «еврейский». Русское «жид» — грубое оскорбление, а польское ŻYD им не является. Наоборот, польское EBREJ звучит устаревшим. В Польше говорят MUZEUM HISTORII ŻYDÓW POLSKICH, ŻYDOWSKI INSTYTUT HISTORYCZNY — это официальные названия." }
  - { kind: usage, text: "Относительное прилагательное, степеней сравнения нет. Все одиннадцать форм живые. Форма для мужчин-людей ŻYDOWSCY частая: ŻYDOWSCY MIESZKAŃCY, ŻYDOWSCY PISARZE. Существительное с заглавной: ŻYD, ŻYDÓWKA, ŻYDZI; прилагательное — со строчной." }
  - { kind: government, text: "Ставится после существительного в названиях: CMENTARZ ŻYDOWSKI, KUCHNIA ŻYDOWSKA, DZIELNICA ŻYDOWSKA. Перед — в описаниях: ŻYDOWSKA RODZINA. Падежных требований нет." }
  - { kind: pronunciation, text: "Читается «жыдо́вски», три слога, ударение на предпоследнем. Ż — твёрдое «ж», за ним «ы». В мужском-личном ŻYDOWSCY сочетание SC даёт «сц»: «жыдо́всцы»." }
  - { kind: register, text: "Нейтральное и официальное слово, которым пишут учебники, музеи и газеты. Еврейская история Польши — тысяча лет, и до войны в стране жила крупнейшая в Европе еврейская община. Оскорбительный оттенок слово приобретает только в устах антисемитов, как любое слово." }
collocations:
