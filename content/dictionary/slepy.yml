      - pl: "Prowadził ślepą babcię pod rękę."
        ru: "Он вёл слепую бабушку под руку."
        source: { kind: authored }
  - id: dead-end
    ru: "тупиковый, глухой (ślepa uliczka — тупик)"
    examples:
      - pl: "W ślepej uliczce zawrócili."
        ru: "В тупике они повернули обратно."
        source: { kind: authored }
      - pl: "Rozmowa weszła w ślepy zaułek."
        ru: "Разговор зашёл в тупик."
        source: { kind: authored }
  - id: blank
    ru: "пустой, невидящий (ślepy nabój — холостой патрон)"
    examples:
      - pl: "Strzelali ślepymi nabojami."
        ru: "Они стреляли холостыми патронами."
        source: { kind: authored }
      - pl: "Patrzył przed siebie ślepym wzrokiem."
        ru: "Он смотрел перед собой невидящим взглядом."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Степеней сравнения в парадигме нет, отсюда одиннадцать форм. Но запрет здесь не смысловой, а формальный: сказать «более слепой» можно, только польский не лепит для этого отдельного слова и берёт bardziej ślepy. Этим ślepy отличается от południowy, где сравнение невозможно по существу. Итог один — одиннадцать форм, причины разные." }
  - { kind: false-friend, text: "Прямое родство с русским «слепой», так что значение угадывается без труда. Расходятся только производные: ślepa uliczka это «тупик», ślepa kiszka — «слепая кишка, аппендикс», а na ślepo значит «наугад, наобум», а вовсе не «вслепую» в смысле «с закрытыми глазами»." }
  - { kind: pronunciation, text: "ОДИННАДЦАТЬ ФОРМ И ОДНА РАЗВИЛКА. У прилагательного этого типа нет степеней сравнения, поэтому форм всего одиннадцать, а не тридцать с лишним. Зато во множественном числе развилка: мужско-личная форма отдельно от всех прочих — ślepi ludzie против ślepe konie, magiczni czarodzieje против magiczne słowa, męscy koledzy против męskie koszule. Про людей-мужчин одно окончание, про всё остальное другое." }
collocations:
  - { pl: "ślepa uliczka", ru: "тупик" }
  - { pl: "na ślepo", ru: "наугад, наобум" }
  - { pl: "ślepy nabój", ru: "холостой патрон" }
family:
  - { pl: "ślepnąć", ru: "слепнуть", relation: derived }
  - { pl: "oślepić", ru: "ослепить", relation: derived }
  - { pl: "widzący", ru: "зрячий", relation: antonym }
etymology: "Прямой родственник русского «слепой» — слово общеславянское, и звуки совпадают почти буква в букву. Из того же гнезда ślepnąć «слепнуть» и oślepić «ослепить». Переносные значения развились так же, как в русском: ślepa uliczka «тупик», ślepy los «слепой случай»."
memory: "ślepy — «слепой», узнаётся сразу. Запоминать стоит не слово, а его обороты: ślepa uliczka «тупик» и na ślepo «наугад». Форм одиннадцать, потому что степени сравнения польский строит здесь через bardziej."
idioms:
