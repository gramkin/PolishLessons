notes:
  - { kind: false-friend, text: "Слово то же самое, что русское «перо», и оба значения совпадают: и птичье перо, и орудие письма. Мешает только чтение. Буква Ó даёт «у», поэтому PIÓRO звучит «пю́ро», и на слух родство пропадает начисто. Собирательное PIERZE это «перья» как масса, пух и перо вместе, а PIERZYNA это «перина», слово, которое русский узнаёт сразу. WIECZNE PIÓRO буквально «вечное перо», то есть перьевая ручка." }
  - { kind: usage, text: "Девять форм, средний род. В местном падеже R переходит в RZ: PIÓRO, но W PIÓRZE. Это то же чередование, что в MIARA — W MIERZE, и в русском ему отвечает простое смягчение, «перо — о пере». Родительный множественного PIÓR без окончания, с сохранённым Ó. Множественное PIÓRA значит и перья птицы, и несколько перьевых ручек." }
  - { kind: government, text: "Писать пером — творительный без предлога: PISAĆ PIÓREM, ровно как по-русски. Подушка из перьев — PODUSZKA Z PIÓR, предлог Z с родительным множественного. В пере — предлог W с местным падежом: W PIÓRZE SKOŃCZYŁ SIĘ ATRAMENT. Под чьим-то пером — POD PIÓREM KOGOŚ, предлог POD с творительным, и оборот этот книжный, о писательской манере." }
  - { kind: pronunciation, text: "Читается «пю́ро», два слога, ударение на первом. Сочетание PIÓ даёт «пю»: мягкое P плюс «у» от Ó, в один приём. Это самое неожиданное место, потому что по написанию ждёшь «пио». В местном падеже PIÓRZE сочетание RZ даёт «ж», и слово звучит «пю́же», то есть ещё дальше от русского «пера». В родительном множественного PIÓR слышно короткое «пюр»." }
  - { kind: register, text: "Слово нейтральное в обоих значениях: GĘSIE PIÓRO «гусиное перо», PIÓRA PTAKA, WIECZNE PIÓRO. Отдельно живёт книжный оборот LEKKIE PIÓRO о лёгком и живом слоге писателя: MA LEKKIE PIÓRO значит «у него лёгкое перо». В спорте WAGA PIÓRKOWA это «полулёгкий вес», от уменьшительного PIÓRKO. Все три употребления есть и в русском, так что переносить их можно смело." }
