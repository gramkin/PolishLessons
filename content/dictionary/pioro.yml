etymology: "Праславянское слово, то же, что русское «перо», от корня со значением полёта: того же, что в «парить» и в польском PRZEĆ. Перо это то, чем летят. Значения в обоих языках развивались одинаково, включая перенос на орудие письма, когда писали гусиными перьями. Польское Ó на месте русского «е» восходит к древнему долгому гласному, и та же пара видна в PIÓRO и «перо», MIÓD и «мёд», PIÓRKO и «пёрышко»."
memory: "То же слово, что русское «перо», и оба значения те же, птичье перо и орудие письма. Прячет родство только чтение: ó даёт «у», поэтому pióro звучит «пю́ро». В местном падеже r переходит в rz, и w piórze это «пю́же». Рядом знакомые слова: pierze «перья», pierzyna «перина». Wieczne pióro это «перьевая ручка», буквально «вечное перо», а mieć lekkie pióro значит «иметь лёгкий слог»."
idioms:
  - { pl: "wieczne pióro", ru: "перьевая ручка" }
