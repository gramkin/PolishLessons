notes:
  - { kind: usage, text: "ОСНОВА В НАСТОЯЩЕМ ВРЕМЕНИ СМЯГЧАЕТСЯ: ŁAMAĆ, НО ŁAMIĘ, ŁAMIESZ, ŁAMIE. Русское «ломать — ломаю» основу не трогает, и русскоговорящие по привычке говорят «łamam» — такой формы нет. Запоминать надо парой: инфинитив на -ać, настоящее на -mię, -miesz." }
  - { kind: usage, text: "Повелительное 1-го лица мн. ч. — ŁAMMY, с двумя m. Это просто ŁAM плюс окончание -MY, и поляки ничего не упрощают, обе буквы остаются на письме и в речи. Выглядит странно, но форма словарная." }
  - { kind: false-friend, text: "Второе значение русскому «ломать» недоступно: ŁAMAĆ PRAWO, ZASADY, OBIETNICĘ, UMOWĘ — это «нарушать», а не «ломать». По-русски «сломать закон» не говорят, по-польски łamać prawo — обычное выражение, и существительное ŁAMANIE PRZEPISÓW значит «нарушение правил». Зато ŁAMANA POLSZCZYZNA «ломаный польский» совпадает с русским один в один." }
  - { kind: pronunciation, text: "Буква ł читается как английское w, то есть łamać звучит примерно «уа́маць», а не «ламать». Соблазн прочитать её как русское «л» велик именно здесь, потому что слово и значение знакомые." }
collocations:
  - { pl: "łamać prawo", ru: "нарушать закон" }
  - { pl: "łamać sobie głowę", ru: "ломать голову" }
  - { pl: "łamać obietnicę", ru: "нарушать обещание" }
family:
  - { pl: "złamać", ru: "сломать, нарушить (сов.)", relation: aspect, id: zlamac }
  - { pl: "załamać", ru: "надломить, сломить", relation: root, id: zalamac }
  - { pl: "połamać", ru: "переломать", relation: root }
etymology: "Праславянский корень *lom-/*lam- «ломать». Русский закрепил огласовку с о («ломать», «лом», «сломать»), польский в этом глаголе — с а: łamać, łamanie, złamać, хотя и польское łom «лом» с о тоже живо. Так что łamać и «ломать» — буквально одно слово, разошедшееся гласной в корне."
memory: "łamać, но łamię, łamiesz, łamie — основа в настоящем смягчается, формы «łamam» не существует. И второе значение шире русского: łamać prawo — это «нарушать закон», а не «ломать» его."
idioms:
