    examples:
      - pl: "Kto łamie prawo, ten odpowiada przed sądem."
        ru: "Кто нарушает закон, тот отвечает перед судом."
        source: { kind: authored }
      - pl: "Łamiecie obietnicę daną dzieciom."
        ru: "Вы нарушаете обещание, данное детям."
        source: { kind: authored }
  - id: rack
    ru: "ломать (голову)"
    examples:
      - pl: "Przestań łamać sobie głowę nad tym zadaniem."
