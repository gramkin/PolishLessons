# review
id: swietny
format: 2
lemma: "świetny"
rank: 376
pos: adj
pron: { cyr: "сьве́тны" }
senses:
  - id: great
    ru: "отличный, прекрасный"
    examples:
      - pl: "Robisz świetną robotę."
        ru: "Ты делаешь отличную работу."
        source: { kind: tatoeba, id: 6313089 }
      - pl: "Jesteś świetnym nauczycielem!"
        ru: "Ты прекрасный учитель!"
        source: { kind: tatoeba, id: 3599592 }
      - pl: "To świetny pomysł."
        ru: "Это отличная идея."
        source: { kind: authored }
  - id: excellent-thing
    ru: "превосходный (о вещи, качестве)"
    examples:
      - pl: "W tej posiadłości robią świetny ocet."
        ru: "В этом особняке делают превосходный уксус."
        source: { kind: tatoeba, id: 5909156 }
      - pl: "Przeczytałem ostatnio świetną książkę o historii średniowiecznej Europy."
        ru: "Я недавно прочитал прекрасную книгу об истории средневековой Европы."
        source: { kind: tatoeba, id: 9684615 }
      - pl: "Mamy świetną pogodę."
        ru: "У нас отличная погода."
        source: { kind: authored }
notes:
  - { kind: usage, text: "świetny — самая ходовая похвала в разговорной речи, сильнее dobry: Świetny pomysł! «Отличная идея!»" }
  - { kind: usage, text: "Świetnie! — наречие и готовая реплика «Отлично!». В живой речи оно встречается даже чаще прилагательного." }
  - { kind: usage, text: "Степени сравнения (świetniejszy, najświetniejszy) существуют, но в разговоре почти не звучат — вместо них берут lepszy и najlepszy." }
  - { kind: usage, text: "Внутри слова тот же корень, что в świecić «светить» и русском «свет»: świetny буквально «сияющий»." }
collocations:
  - { pl: "świetny pomysł", ru: "отличная идея" }
  - { pl: "świetna robota", ru: "отличная работа" }
  - { pl: "w świetnej formie", ru: "в отличной форме" }
  - { pl: "świetnie!", ru: "отлично!" }
etymology: "От świecić «светить», праславянское *světьlъ; буквально «сияющий, блистательный». Внутри тот же корень, что в русском «свет»."
memory: "świetny — «отличный», а буквально «сияющий»: внутри тот же корень, что в świecić «светить» и русском «свет». И запомните реплику Świetnie! — «Отлично!»: её вы услышите по десять раз на дню."
idioms:
  - { pl: "świetnie!", ru: "отлично!" }
  - { pl: "być w świetnej formie", ru: "быть в отличной форме" }
  - { pl: "świetna robota", ru: "отличная работа" }
