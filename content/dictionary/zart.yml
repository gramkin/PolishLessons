# review
id: zart
format: 2
lemma: "żart"
rank: 859
pos: noun
pron: { cyr: "жарт" }
senses:
  - id: joke
    ru: "шутка, анекдот"
    examples:
      - pl: "To był tylko żart."
        ru: "Это была всего лишь шутка."
        source: { kind: tatoeba, id: 357351 }
      - pl: "To żart."
        ru: "Это шутка."
        source: { kind: translated, id: 6729661 }
      - pl: "Anglik, Belg i Holender wchodzą do pubu i siadają przy barze. Barman pyta, \"Chwila, to jakiś żart czy co?\""
        ru: "Англичанин, бельгиец и голландец заходят в паб и садятся за стойку. Бармен: \"Не понял, это что, анекдот?\""
        source: { kind: tatoeba, id: 2987385 }
  - id: in-jest
    ru: "żartem, w żarcie — в шутку"
    examples:
      - pl: "Powiedziałem to żartem."
        ru: "Я сказал это шутя."
        source: { kind: translated, id: 402698 }
      - pl: "Nie mów tego nawet żartem."
        ru: "Не говори этого даже в шутку."
        source: { kind: translated, id: 13037966 }
      - pl: "Powiedziałem w żarcie."
        ru: "Я сказал это в шутку."
        source: { kind: translated, id: 623631 }
  - id: no-joke
    ru: "to nie żarty — это не шутки"
    examples:
      - pl: "To nie żarty."
        ru: "Это не шутки."
        source: { kind: tatoeba, id: 6320454 }
      - pl: "Żarty na bok."
        ru: "Шутки в сторону."
        source: { kind: translated, id: 10634837 }
      - pl: "Koniec żartów."
        ru: "Конец шуткам."
        source: { kind: translated, id: 10543475 }
notes:
  - { kind: false-friend, text: "Осторожно с формой żarcie. У существительного żart это предложный падеж («в шутке»), но в разговорной речи żarcie — совсем другое слово, «жратва», от żreć «жрать». Tom lubi włoskie żarcie значит «Том любит итальянскую еду», а не «итальянскую шутку»." }
  - { kind: usage, text: "«В шутку» передаётся творительным падежом без предлога: Powiedziałem to żartem. Вариант w żarcie тоже есть, но звучит книжнее." }
  - { kind: usage, text: "Устойчивые обороты: żarty na bok «шутки в сторону», pół żartem, pół serio «полушутя, полусерьёзно», nie na żarty «не на шутку, всерьёз»." }
  - { kind: usage, text: "Глагол — żartować «шутить»: Żartujesz? «Ты шутишь?». Прилагательное żartobliwy «шутливый»." }
collocations:
  - { pl: "to tylko żart", ru: "это всего лишь шутка" }
  - { pl: "żarty na bok", ru: "шутки в сторону" }
  - { pl: "powiedzieć żartem", ru: "сказать в шутку" }
  - { pl: "nie znać się na żartach", ru: "не понимать шуток" }
family:
  - { pl: "żartować", ru: "шутить", relation: root }
  - { pl: "żartobliwy", ru: "шутливый", relation: derived }
  - { pl: "żarcik", ru: "шуточка", relation: derived }
etymology: "Старое заимствование; в русском однокоренного слова нет — «шутка» другого происхождения, поэтому żart приходится запоминать отдельно."
memory: "żart — «шутка». Запомните творительный без предлога: powiedzieć żartem «сказать в шутку». И будьте внимательны с формой żarcie: у żart это предложный падеж, но то же самое слово в разговоре значит «жратва» — Tom lubi włoskie żarcie про еду, а не про шутки."
idioms:
  - { pl: "żarty na bok", ru: "шутки в сторону" }
  - { pl: "pół żartem, pół serio", ru: "полушутя, полусерьёзно" }
  - { pl: "nie na żarty", ru: "не на шутку" }
  - { pl: "nie znać się na żartach", ru: "не понимать шуток" }
