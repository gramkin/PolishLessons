# review
id: tyle
format: 2
lemma: "tyle"
rank: 450
pos: num
pron: { cyr: "ты́ле" }
senses:
  - id: so-much
    ru: "столько"
    examples:
      - pl: "Zjedz tyle, ile chcesz."
        ru: "Ешьте столько, сколько вы хотите."
        source: { kind: tatoeba, id: 3945583 }
      - pl: "Skąd on ma tyle entuzjazmu?"
        ru: "Откуда у него столько энтузиазма?"
        source: { kind: tatoeba, id: 3745202 }
      - pl: "Po co Tomkowi tyle gotówki?"
        ru: "Зачем Тому столько наличных?"
        source: { kind: tatoeba, id: 13054836 }
  - id: as-much
    ru: "столько (в сравнении со сколько)"
    examples:
      - pl: "Ona nie ma tylu lat co Mary."
        ru: "Ей не столько же лет, сколько Мэри."
        source: { kind: tatoeba, id: 352952 }
      - pl: "Przyszło tylu mężczyzn."
        ru: "Пришло столько мужчин."
        source: { kind: translated, id: 868221 }
      - pl: "Proszę jeść tyle, ile pani chce."
        ru: "Ешьте столько, сколько вы хотите."
        source: { kind: tatoeba, id: 6313167 }
notes:
  - { kind: usage, text: "Пара tyle… ile работает как русское «столько… сколько»: Zjedz tyle, ile chcesz «Ешь столько, сколько хочешь»." }
  - { kind: usage, text: "Косвенная форма — tylu: tylu ludzi «столько людей», z tyloma osobami «со столькими людьми»." }
  - { kind: usage, text: "na tyle — «настолько», o tyle — «постольку», а I to by było na tyle — шутливое «вот, собственно, и всё»." }
  - { kind: usage, text: "Пословица ile głów, tyle rozumów совпадает с русской «сколько голов, столько умов»." }
collocations:
  - { pl: "tyle, ile", ru: "столько, сколько" }
  - { pl: "na tyle", ru: "настолько" }
  - { pl: "tylu ludzi", ru: "столько людей" }
  - { pl: "tyle razy", ru: "столько раз" }
etymology: "От указательного корня ten, праславянское *tolь. Русское «столько» того же корня, только с приставкой «с-»."
memory: "tyle — «столько», пара к ile «сколько», и конструкция tyle… ile работает точно как русская «столько… сколько». Косвенная форма меняется: tylu ludzi «столько людей»."
idioms:
  - { pl: "ile głów, tyle rozumów", ru: "сколько голов, столько умов" }
  - { pl: "tyle, co kot napłakał", ru: "кот наплакал" }
  - { pl: "i to by było na tyle", ru: "вот, собственно, и всё" }
formExamplesSkip:
