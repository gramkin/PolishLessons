# review
id: zakradac
format: 2
lemma: "zakradać"
rank: 2190
pos: verb
aspect: imperf
pron: { cyr: "закра́даць" }
senses:
  - id: sneak
    ru: "красться, пробираться (zakradać się)"
    examples:
      - pl: "Mój kot zakrada się do ogrodu sąsiada."
        ru: "Мой кот пробирается в сад соседа."
        source: { kind: translated, id: 13593810 }
      - pl: "Zakrada się do spiżarni po nocy."
        ru: "Он пробирается в кладовую по ночам."
        source: { kind: authored }
      - pl: "Ktoś zakradał się pod okno."
        ru: "Кто-то подкрадывался под окно."
        source: { kind: authored }
  - id: creep-in
    ru: "закрадываться (о сомнении, ошибке)"
    examples:
      - pl: "W tekst zakradał się błąd."
        ru: "В текст закралась ошибка."
        source: { kind: authored }
      - pl: "Zakrada się wątpliwość."
        ru: "Закрадывается сомнение."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Всегда с się. Второе значение переносное и совпадает с русским: закрадывается сомнение, ошибка, подозрение." }
  - { kind: government, text: "Куда — do с родительным: zakradać się do ogrodu." }
  - { kind: false-friend, text: "Корень kraść «красть» — ср. русское «красть», «красться». Модель совпадает полностью." }
  - { kind: usage, text: "Совершенный вид — zakraść się." }
collocations:
  - { pl: "zakradać się do", ru: "пробираться в" }
  - { pl: "zakrada się błąd", ru: "закрадывается ошибка" }
etymology: "za- + kraść «красть»; ср. русское «красться», «закрадываться»."
memory: "zakradać się — «красться, пробираться», всегда с się. Переносное значение то же, что в русском: закрадывается сомнение. Совершенный вид — zakraść się."
