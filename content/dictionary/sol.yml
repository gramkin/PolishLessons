notes:
  - { kind: government, text: "Женский род на мягкую согласную: ta sól, tej soli. Чередование ó/o: sól, но soli, solą." }
  - { kind: false-friend, text: "Русская «соль» и польское sól — одно слово, и род совпадает, женский. Ó читается как у: «суль»." }
  - { kind: usage, text: "Подай соль — podaj sól, винительный. А «посыпать солью» — posypać solą, творительный." }
  - { kind: usage, text: "Оборот sól ziemi «соль земли» есть и в польском. Не путайте solą (соль, твор.) с формой глагола solić «солить»." }
