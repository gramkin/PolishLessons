senses:
  - id: loaf
    ru: "буханка, каравай"
    examples:
      - pl: "Bochenek chleba."
        ru: "Буханка хлеба."
        source: { kind: translated, id: 13030219 }
      - pl: "Kupiłem w piekarni bochenek chleba."
        ru: "Я купил в пекарне буханку хлеба."
        source: { kind: translated, id: 718932 }
      - pl: "Poproszę bochenek chleba i mleko."
        ru: "Дайте, пожалуйста, буханку хлеба и молоко."
        source: { kind: translated, id: 1351025 }
  - id: loaves
    ru: "буханки (мн. ч.)"
    examples:
      - pl: "Tom kupił trzy bochenki chleba."
        ru: "Том купил три буханки хлеба."
        source: { kind: translated, id: 3711129 }
      - pl: "Na półce leżały świeże bochenki."
        ru: "На полке лежали свежие буханки."
        source: { kind: authored }
notes:
  - { kind: government, text: "Мужской неодушевлённый; родительный — bochenka, с выпадением e. Буханка хлеба — bochenek chleba, с родительным, как и в русском." }
  - { kind: false-friend, text: "Заимствование из немецкого (Fochenz, из латинского focacia «лепёшка, испечённая в золе»). Отсюда же итальянская focaccia — дальняя родня." }
  - { kind: usage, text: "Слово chleb уже есть в словаре; bochenek — счётная единица для него, как kromka «ломоть»." }
  - { kind: usage, text: "Уменьшительное bochenek от старого bochen; сегодня уменьшительная форма и стала основной." }
collocations:
  - { pl: "bochenek chleba", ru: "буханка хлеба" }
etymology: "Из немецкого, в конечном счёте из латинского focacia «лепёшка в золе»; итальянская focaccia — дальняя родня."
