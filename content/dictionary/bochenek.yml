senses:
  - id: loaf
    ru: "буханка, каравай"
    examples:
      - pl: "Bochenek chleba."
        ru: "Буханка хлеба."
        source: { kind: translated, id: 13030219 }
      - pl: "Kupiłem w piekarni bochenek chleba."
        ru: "Я купил в пекарне буханку хлеба."
