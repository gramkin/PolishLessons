# review
id: odezwac
format: 2
lemma: "odezwać"
rank: 2350
pos: verb
aspect: perf
pron: { cyr: "одэ́зваць" }
senses:
  - id: speak-up
    ru: "подать голос, заговорить"
    examples:
      - pl: "Nareszcie ktoś się odezwał."
        ru: "Наконец кто-то подал голос."
        source: { kind: translated, id: 5377698 }
      - pl: "Nie odezwał się ani słowem."
        ru: "Он не сказал ни слова."
        source: { kind: translated, id: 10573078 }
      - pl: "Boisz się odezwać?"
        ru: "Боишься заговорить?"
        source: { kind: translated, id: 3743422 }
  - id: get-in-touch
    ru: "связаться, дать о себе знать"
    examples:
      - pl: "Tom wkrótce się do ciebie odezwie."
        ru: "Том скоро с тобой свяжется."
        source: { kind: translated, id: 4122299 }
      - pl: "Od teraz nie odezwę się słowem."
        ru: "Отныне я не скажу ни слова."
        source: { kind: tatoeba, id: 12569761 }
notes:
  - { kind: government, text: "Всегда с się. Обратиться К кому-л. — odezwać się DO kogoś, с родительным падежом после do. Русское «обратиться к» берёт дательный — вот и ловушка." }
  - { kind: usage, text: "Odezwij się! значит «Дай о себе знать!» — обычная просьба на прощание, а не приказ говорить." }
  - { kind: false-friend, text: "od- + zwać «звать», корень тот же, что в русском «звать», «отзываться». Польское odezwać się и русское «отозваться» — почти одно слово." }
  - { kind: usage, text: "Не odezwać się ani słowem «не сказать ни слова» — частый оборот с творительным падежом. Несовершенный вид — odzywać się." }
collocations:
  - { pl: "odezwać się do kogoś", ru: "обратиться к кому-л." }
  - { pl: "nie odezwać się ani słowem", ru: "не сказать ни слова" }
etymology: "od- + zwać «звать»; русское «отозваться» — почти то же слово."
memory: "odezwać się — «подать голос» и «дать о себе знать». Обращаются DO kogoś, с РОДИТЕЛЬНЫМ, а не с дательным как в русском. Odezwij się! — «Дай о себе знать!»"
idioms:
  - { pl: "odezwać się do kogoś", ru: "обратиться к кому-л." }
  - { pl: "nie odezwać się ani słowem", ru: "не сказать ни слова" }
