  - { pl: "sztucznie", ru: "искусственно", relation: derived }
  - { pl: "naturalny", ru: "естественный", relation: antonym, id: naturalny }
etymology: "От SZTUKA, пришедшего из средневерхненемецкого stucke «кусок, часть». В польском слово разрослось: от куска к единице товара, от единицы к мастерству, от мастерства к искусству и театральной пьесе. Русская «штука» заимствована из польского на ранней ступени этого пути и осталась при куске, а прилагательное sztuczny образовано от позднего значения: сделанный мастерством, а не природой."
memory: "Звучит как «штучный», значит «искусственный». А корень sztuka — это «искусство», откуда наша «штука» взяла лишь значение единицы."
