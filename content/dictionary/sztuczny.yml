notes:
  - { kind: false-friend, text: "Слово звучит почти как русское «штучный» — «шту́чны», — а означает «искусственный». Русское «штучный» по-польски будет JEDNOSTKOWY. Сходство не случайно: корень тут SZTUKA, и русская «штука» — заимствование из польского, но взявшее лишь одно из значений. У польской sztuki их три: искусство (dzieło sztuki), театральная пьеса (sztuka w trzech aktach) и единица, штука (dwie sztuki). Русский унёс третье и оставил остальные." }
  - { kind: usage, text: "Это второе слово в соседних подборках, которое русский заимствовал из польского и сузил. Первым была kula: польское kula означает и шар, и пулю, а русское «пуля» взяло только военный смысл. Здесь то же самое с sztuka и «штукой». Полезно помнить направление: слово пришло отсюда, значит польский набор значений шире, а не наоборот." }
