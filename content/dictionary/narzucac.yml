# review
id: narzucac
format: 2
lemma: "narzucać"
rank: 2223
pos: verb
aspect: imperf
pron: { cyr: "нажу́цаць" }
senses:
  - id: impose
    ru: "навязывать"
    examples:
      - pl: "Nie powinniśmy narzucać swoich poglądów innym."
        ru: "Мы не должны навязывать свои взгляды другим."
        source: { kind: translated, id: 756430 }
      - pl: "Narzucają nam swoje warunki."
        ru: "Они навязывают нам свои условия."
        source: { kind: authored }
      - pl: "Nie narzucaj mi swojego zdania."
        ru: "Не навязывай мне своё мнение."
        source: { kind: authored }
  - id: intrude
    ru: "навязываться (narzucać się)"
    examples:
      - pl: "Nie chciałbym się narzucać."
        ru: "Я не хотел бы навязываться."
        source: { kind: translated, id: 4546964 }
      - pl: "Tom nie chciał narzucać się Mary."
        ru: "Том не хотел навязываться Мэри."
        source: { kind: translated, id: 3051365 }
notes:
  - { kind: government, text: "Навязывать что-л. кому-л. — винительный плюс дательный: narzucać komuś swoje poglądy. С się значит «навязываться» самому." }
  - { kind: usage, text: "Nie chciałbym się narzucać «не хотел бы навязываться» — вежливая формула при визите или просьбе." }
  - { kind: false-friend, text: "Корень rzucać «бросать», который уже есть в словаре; ср. русское «набросить». Значение «навязывать» выросло из «набрасывать сверху»." }
  - { kind: usage, text: "Совершенный вид — narzucić. Буквальное значение «набросить (одежду)» тоже живо: narzucić płaszcz." }
collocations:
  - { pl: "narzucać komuś coś", ru: "навязывать кому-л. что-л." }
  - { pl: "narzucać się", ru: "навязываться" }
etymology: "na- + rzucać «бросать»; ср. русское «набросить», «навязать». Значение выросло из образа набрасывания сверху."
memory: "narzucać — «навязывать», с винительным и дательным. С się значит «навязываться»: Nie chciałbym się narzucać. Совершенный вид — narzucić."
idioms:
  - { pl: "narzucać się", ru: "навязываться" }
