# review
id: zakup
format: 2
lemma: "zakup"
rank: 2218
pos: noun
pron: { cyr: "за́куп" }
senses:
  - id: purchase
    ru: "покупка (действие, предмет)"
    examples:
      - pl: "Zakup mieszkania to poważna decyzja."
        ru: "Покупка квартиры — серьёзное решение."
        source: { kind: authored }
      - pl: "Zachowaj dowód zakupu."
        ru: "Сохрани чек о покупке."
        source: { kind: authored }
  - id: shopping
    ru: "zakupy — покупки, поход по магазинам"
    examples:
      - pl: "Idziemy na zakupy przed świętami."
        ru: "Мы идём за покупками перед праздниками."
        source: { kind: authored }
      - pl: "Zrobił zakupy na cały tydzień."
        ru: "Он сделал покупки на всю неделю."
        source: { kind: authored }
      - pl: "Wrócili z zakupów późnym wieczorem."
        ru: "Они вернулись из магазина поздно вечером."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Корень знакомый: za- плюс kup-, как в kupić «купить». Русский «закуп» тоже существует, но звучит по-хозяйственному, специально; обычное слово там «покупка». Польское zakup нейтрально. А множественное zakupy значит «покупки» в смысле похода по магазинам: iść na zakupy, robić zakupy." }
  - { kind: usage, text: "Единственное число обычно о конкретной сделке: zakup mieszkania, zakup sprzętu, dowód zakupu «чек». Множественное zakupy почти всегда о хождении по магазинам, и в этом значении единственного у него нет. Рядом живёт kupno, тоже «покупка», но юридическое: umowa kupna-sprzedaży." }
  - { kind: pronunciation, text: "Два слога, ударение на первом: ZA-kup, «за́куп». В предложном падеже p смягчается: w zakupie — «в заку́пе»." }
collocations:
  - { pl: "iść na zakupy", ru: "идти за покупками" }
  - { pl: "dowód zakupu", ru: "чек о покупке" }
  - { pl: "zakup mieszkania", ru: "покупка квартиры" }
family:
  - { pl: "kupić", ru: "купить", relation: root, id: kupic }
  - { pl: "kupować", ru: "покупать", relation: derived, id: kupowac }
  - { pl: "kupno", ru: "покупка, купля", relation: derived }
etymology: "Приставка za- плюс корень kup-, тот же, что в kupić и в русских «купить», «купец». В конечном счёте от латинского caupo «торговец» через германское посредство — слово разошлось по всей Европе. Отсюда zakupy, kupno, kupować и zakupowy."
memory: "zakup — «покупка», корень тот же, что в «купить». Главное — множественное: zakupy это не покупки вообще, а поход по магазинам. Iść na zakupy значит «идти за покупками»."
idioms:
  - { pl: "iść na zakupy", ru: "идти за покупками" }
  - { pl: "dowód zakupu", ru: "чек, доказательство покупки" }
