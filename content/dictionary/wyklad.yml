notes:
  - { kind: false-friend, text: "Слово разбирается по частям — WY- плюс корень KŁAD- от KŁAŚĆ «класть» — и потому выглядит как русский «выклад», которого в языке нет. Значит оно «лекция», и это первое, что нужно запомнить. Второе: польское LEKCJA существует, но означает школьный урок, а в вузе занятие называется WYKŁAD, если это лекция, и ĆWICZENIA, если это семинар. Третье: глагол WYKŁADAĆ значит и «преподавать» — ON WYKŁADA FIZYKĘ «он преподаёт физику», — и «выкладывать, выстилать»: ŚCIANY WYŁOŻONE BOAZERIĄ «стены, обшитые панелями». Оба значения живы и различаются только дополнением." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Местный единственного — WYKŁADZIE, где конечное D основы переходит в DZI перед окончанием -E: это та же мена, что в SĄSIEDZIE от SĄSIAD и OBIEDZIE от OBIAD, и она обязательна. Родительный единственного — WYKŁADU, с окончанием -U, обычным для отглагольных существительных этого типа. Винительный равен именительному. На занятие ходят с предлогом NA: IŚĆ NA WYKŁAD, BYĆ NA WYKŁADZIE — то есть «на лекцию» и «на лекции», как и по-русски. Лектор называется WYKŁADOWCA." }
  - { kind: pronunciation, text: "Читается «вы́куат», два слога, ударение на первом. Буква Y даёт «ы», а Ł — «у» неслоговое, поэтому середина звучит «куа», а не «кла». Конечное D оглушается в «т». В форме WYKŁADU звонкое D возвращается: «выкуа́ду». В форме WYKŁADZIE сочетание DZI читается как мягкое «дзи»: «выкуа́дзе». В форме WYKŁADÓW буква Ó даёт «у», а конечное W оглушается в «ф»: «выкуа́дуф»." }
  - { kind: register, text: "Слово нейтральное и академическое. Устойчивые сочетания: WYKŁAD INAUGURACYJNY «вступительная лекция», PROWADZIĆ WYKŁAD «читать лекцию», WYKŁAD OTWARTY «открытая лекция», SALA WYKŁADOWA «лекционный зал». Во втором значении слово книжное: WYKŁAD ZASAD «изложение принципов», и здесь оно отвечает русскому «изложению». Переносного или разговорного употребления у слова нет, в отличие от русского «лекции», которую можно шутливо прочитать нерадивому сыну: по-польски в этом смысле скажут KAZANIE, то есть «проповедь»." }
