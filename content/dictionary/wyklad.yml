etymology: "Отглагольное существительное от WYKŁADAĆ, то есть приставка WY- и корень *klad- «класть», праславянский и общий с русским. Исходная мысль — выложить перед слушателем, разложить предмет по порядку; та же метафора лежит в русском «изложить» и «изложение», только с другой приставкой, и в слове «доклад», где приставка третья. Корень этот в обоих языках чрезвычайно плодовит: «склад», «уклад», «вклад», «оклад», и польский отвечает им своими SKŁAD, UKŁAD, WKŁAD. Поэтому WYKŁAD понятен сразу, как только увидишь в нём «вы-клад»: это выложенное знание. Чередование A и Ł в основе — обычное польское соответствие русскому полногласию в «класть» и «кладу»."
memory: "Разбирается насквозь: wy- + kład- от kłaść «класть», то есть «выложенное» — но значит «лекция». Та же метафора в русских «изложить» и «доклад». Школьный урок это lekcja, семинар — ćwiczenia, преподаватель — wykładowca. Глагол wykładać значит и «преподавать», и «выстилать». Местный wykładzie с меной d→dzi, как sąsiedzie от sąsiad. На лекцию идут na wykład, звучит «вы́куат» с ł как «у»."
idioms:
