# review
id: pozegnac
format: 2
lemma: "pożegnać"
rank: 1606
pos: verb
aspect: perf
aspectPair: zegnac
pron: { cyr: "поже́гнаць" }
senses:
  - id: say-goodbye
    ru: "попрощаться, проститься"
    examples:
      - pl: "Czas się pożegnać."
        ru: "Пора прощаться."
        source: { kind: translated, id: 925895 }
      - pl: "Chcę się pożegnać."
        ru: "Я хочу попрощаться."
        source: { kind: translated, id: 10642394 }
      - pl: "Nawet nie pożegnał się ze mną."
        ru: "Он даже не попрощался со мной."
        source: { kind: tatoeba, id: 365136 }
  - id: farewell
    ru: "прощание (pożegnanie)"
    examples:
      - pl: "Wyszła bez pożegnania."
        ru: "Она вышла без прощания."
        source: { kind: translated, id: 3520416 }
      - pl: "Pożegnania zawsze są smutne."
        ru: "Прощания всегда грустны."
        source: { kind: translated, id: 10545307 }
      - pl: "Pocałowała ją na pożegnanie."
        ru: "Она поцеловала её на прощание."
        source: { kind: translated, id: 7185147 }
notes:
  - { kind: government, text: "Почти всегда с się и предлогом z с творительным: pożegnać się z kimś «попрощаться с кем-то»." }
  - { kind: usage, text: "Несовершенный вид — żegnać. Существительное pożegnanie значит «прощание»: na pożegnanie «на прощание», bez pożegnania «не попрощавшись»." }
  - { kind: usage, text: "pożegnać się z czymś значит и «распрощаться с чем-то»: pożegnać się z marzeniami «распрощаться с мечтами»." }
  - { kind: usage, text: "Без się глагол переходный: pożegnał gości «он проводил гостей»." }
collocations:
  - { pl: "pożegnać się z", ru: "попрощаться с" }
  - { pl: "na pożegnanie", ru: "на прощание" }
  - { pl: "bez pożegnania", ru: "не попрощавшись" }
etymology: "Приставка po- + żegnać «прощать, осенять крестом», от znak «знак» — исходно «перекрестить на дорогу». Русское «прощаться» идёт от «простить», так что образ другой, но обряд расставания общий."
memory: "pożegnać się z kimś = «попрощаться с кем-то»: się и творительный падеж обязательны. Несовершенный вид — żegnać, существительное pożegnanie «прощание»: na pożegnanie, bez pożegnania."
idioms:
  - { pl: "pożegnać się z", ru: "попрощаться с" }
  - { pl: "na pożegnanie", ru: "на прощание" }
  - { pl: "bez pożegnania", ru: "не попрощавшись" }
