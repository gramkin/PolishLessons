notes:
  - { kind: false-friend, text: "Слово значит ровно то же, что русская «засада», но собрано от другого глагола, и это стоит заметить. Русская «засада» идёт от «засесть»: засаду высиживают. Польская ZASADZKA идёт от ZASADZIĆ SIĘ, то есть от SADZIĆ «сажать, помещать»: засаду расставляют. Тот же корень в OSADA «поселение» и в ZASADA «принцип», буквально то, что положено в основу." }
  - { kind: usage, text: "Десять форм, женский род. В дательном и местном падеже единственного числа K переходит в C: ZASADZKA, но W ZASADZCE. Родительный множественного ZASADZEK с беглым E. Переносное значение, о подвохе в вопросе или в договоре, совершенно обиходно и не требует военного контекста: TO PYTANIE TO ZASADZKA значит «это вопрос с подвохом»." }
  - { kind: government, text: "Попасть в засаду — WPAŚĆ W ZASADZKĘ, предлог W с винительным, как и по-русски. Ждать в засаде — CZEKAĆ W ZASADZCE, предлог W с местным падежом: направление берёт винительный, место — местный, и пара работает так же, как русская. Устроить засаду — URZĄDZIĆ ZASADZKĘ, винительный без предлога. Заманить в засаду — WCIĄGNĄĆ W ZASADZKĘ." }
  - { kind: pronunciation, text: "Читается «заса́цка», три слога, ударение на втором. Самое интересное в середине: сочетание DZ перед глухим K оглушается и звучит как «ц», поэтому слышно «сацка», а не «садзка». В дательном и местном падеже ZASADZCE оглушение остаётся, и выходит «заса́цце». А в исходном глаголе ZASADZIĆ сочетание DZI звонкое и мягкое: «заса́дзиць»." }
  - { kind: register, text: "Слово нейтральное, из военного и криминального языка: WPAŚĆ W ZASADZKĘ, ZASADZKA POLICYJNA «полицейская засада», CZEKAĆ W ZASADZCE. Переносное употребление частое и бытовое, о скрытом подвохе: PYTANIE Z ZASADZKĄ «вопрос с подвохом», UMOWA PEŁNA ZASADZEK «договор, полный ловушек». В обоих смыслах слово звучит одинаково обычно." }
