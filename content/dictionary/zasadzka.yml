etymology: "От ZASADZIĆ SIĘ «засесть, расположиться в засаде», от SADZIĆ «сажать», от праславянского корня SAD-, того же, что в русских «сад», «садить», «осадок». Русская «засада» построена от «сидеть», и образы разошлись: у нас засаду высиживают, у поляков расставляют, как сажают растение. Из того же корня вышли OSADA «поселение», то есть посаженное место, и ZASADA «принцип», то, что положено в основание."
memory: "Значит то же, что «засада», но построено от другого глагола: не от «сидеть», а от sadzić «сажать», через zasadzić się. Поэтому засаду у поляка расставляют, а не высиживают. Тот же корень в osada «поселение» и zasada «принцип». Звучит «заса́цка»: dz перед глухим k оглушается до «ц». Переносное значение обиходно: pytanie z zasadzką это «вопрос с подвохом»."
idioms:
  - { pl: "wpaść w zasadzkę", ru: "попасть в засаду" }
