# review
id: swiecie
format: 2
lemma: "święcie"
rank: 2030
pos: adv
pron: { cyr: "сьве́ньце" }
senses:
  - id: firmly
    ru: "свято (верить, быть убеждённым)"
    examples:
      - pl: "Święcie w to wierzę."
        ru: "Я свято в это верю."
        source: { kind: authored }
      - pl: "Jestem święcie przekonany."
        ru: "Я свято убеждён."
        source: { kind: authored }
      - pl: "Święcie przestrzegają tej zasady."
        ru: "Они свято соблюдают это правило."
        source: { kind: authored }
  - id: solemnly
    ru: "свято, твёрдо (об обещании)"
    examples:
      - pl: "Wierzył święcie w swoją misję."
        ru: "Он свято верил в свою миссию."
        source: { kind: authored }
      - pl: "Święcie obiecał wrócić."
        ru: "Он свято обещал вернуться."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Почти всегда при глаголах веры и убеждения: święcie wierzyć «свято верить», być święcie przekonanym «быть свято убеждённым»." }
  - { kind: false-friend, text: "Три похожих слова легко спутать. święcie — наречие «свято» (от święty). po święcie — «после праздника», предложный падеж от święto. na świecie — «в мире», от świat." }
  - { kind: usage, text: "Наречие от święty «святой»; в корпусе встречается редко, книжное." }
  - { kind: usage, text: "Русское «свято верить» — точное соответствие, в том числе по оттенку." }
collocations:
  - { pl: "święcie wierzyć", ru: "свято верить" }
  - { pl: "święcie przekonany", ru: "свято убеждённый" }
etymology: "Наречие от święty «святой», праславянское *svętъ; русское «святой» и «свято» — то же слово."
memory: "święcie = «свято», от święty. Держите рядом три разных слова: święcie «свято», po święcie «после праздника» (święto), na świecie «в мире» (świat)."
idioms:
  - { pl: "święcie wierzyć", ru: "свято верить" }
