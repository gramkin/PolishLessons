# review
id: stawac
format: 2
lemma: "stawać"
rank: 1018
pos: verb
aspect: imperf
pron: { cyr: "стaва́ць" }
senses:
  - id: become
    ru: "stawać się — становиться"
    note: "Главное значение; требует творительного падежа."
    examples:
      - pl: "Yerba mate staje się coraz bardziej popularna w Europie."
        ru: "Йерба мате становится в Европе всё популярнее."
        source: { kind: translated, id: 3492120 }
      - pl: "Dni stają się coraz krótsze."
        ru: "Дни становятся всё короче."
        source: { kind: translated, id: 1176739 }
      - pl: "Im starsi się stajemy, tym bardziej słabnie nasza pamięć."
        ru: "Чем старше мы становимся, тем больше слабеет наша память."
        source: { kind: translated, id: 3701875 }
  - id: take-side
    ru: "stawać po stronie — вставать на сторону"
    examples:
      - pl: "Zawsze stajesz po jej stronie."
        ru: "Ты всегда встаёшь на её сторону."
        source: { kind: translated, id: 3448122 }
      - pl: "Nie stawaj zawsze po jego stronie."
        ru: "Не вставай всегда на его сторону."
        source: { kind: translated, id: 3141086 }
      - pl: "Musimy stawać za naszymi prawami."
        ru: "Мы должны отстаивать свои права."
        source: { kind: translated, id: 669058 }
  - id: idioms
    ru: "stawać na rzęsach — из кожи вон лезть"
    examples:
      - pl: "Możesz stawać na rzęsach, a ona i tak cię odepchnie."
        ru: "Можешь из кожи вон лезть, а она всё равно тебя оттолкнёт."
        source: { kind: translated, id: 13008687 }
      - pl: "Stawałem na rzęsach żeby kupić komputer."
        ru: "Я из кожи вон лез, чтобы купить компьютер."
        source: { kind: translated, id: 13008685 }
      - pl: "Koń staje dęba."
        ru: "Конь встаёт на дыбы."
        source: { kind: translated, id: 12438401 }
notes:
  - { kind: government, text: "stawać się KIMŚ, CZYMŚ — «становиться кем-то, чем-то», с творительным падежом: staje się popularna «становится популярной». Русский берёт тот же падеж." }
  - { kind: usage, text: "Настоящее время нерегулярное: основа меняется с stawa- на staj-, отсюда staję, stajesz, staje, stajemy, stajecie, stają. Формы вроде stawam и stawasz устарели." }
  - { kind: usage, text: "Совершенных видов два, и они значат разное: stanąć «встать, остановиться» и stać się «стать». Приставка выбирает смысл." }
  - { kind: false-friend, text: "Не путайте с глаголом stać «стоять», у которого своя карточка: stoję «я стою», но staję się «я становлюсь»." }
collocations:
  - { pl: "stawać się", ru: "становиться" }
  - { pl: "stawać po stronie", ru: "вставать на сторону" }
  - { pl: "stawać na rzęsach", ru: "из кожи вон лезть" }
  - { pl: "stawać na nogi", ru: "вставать на ноги" }
family:
  - { pl: "stanąć", ru: "встать, остановиться", relation: aspect }
  - { pl: "stać", ru: "стоять", relation: root, id: stac }
  - { pl: "stan", ru: "состояние", relation: derived }
etymology: "Праславянское *stavati, от *stati «стать». Русские «вставать» и «стать» — та же семья, и значение «становиться» у обоих языков общее."
memory: "stawać się — «становиться», с творительным падежом: staje się popularna. Настоящее время нерегулярное: staję, stajesz, staje, а не «stawam». И не путайте с глаголом stać «стоять»."
idioms:
