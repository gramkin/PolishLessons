notes:
  - { kind: false-friend, text: "Русское «злодей» и польское złodziej — ложные друзья. По составу это одно и то же слово (zło «зло» + -dziej от dziać «делать»), но польское значит именно «вор». «Злодей» по-польски — łotr или zbrodniarz." }
  - { kind: usage, text: "Родительный множественного — złodziei, реже złodziejów: Uwaga na złodziei «Осторожно, воры»." }
  - { kind: usage, text: "Пословица Okazja czyni złodzieja «Случай делает вора» есть и в русском." }
  - { kind: usage, text: "Глагол — ukraść «украсть», существительное kradzież — «кража»." }
collocations:
  - { pl: "uwaga na złodziei", ru: "осторожно, воры" }
  - { pl: "złapać złodzieja", ru: "поймать вора" }
  - { pl: "złodziej kieszonkowy", ru: "карманник" }
etymology: "Из zło «зло» и -dziej (от dziać «делать») — буквально «тот, кто делает зло». Русское «злодей» — то же самое слово, но в польском значение сузилось до «вор», а в русском осталось широким."
memory: "złodziej = «вор», хотя выглядит как русское «злодей» — и по составу это ровно оно (zło + dziać). Значения разошлись: польское słowo значит именно «вор». Родительный множественного — złodziei."
idioms:
  - { pl: "okazja czyni złodzieja", ru: "случай делает вора" }
  - { pl: "złapać złodzieja", ru: "поймать вора" }
  - { pl: "uwaga na złodziei", ru: "осторожно, воры" }
