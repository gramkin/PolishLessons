        ru: "Пациент без сознания попал в реанимацию."
        source: { kind: authored }
  - id: dazed
    ru: "ошалевший, не в себе, рассеянный"
    examples:
      - pl: "Patrzył na mnie nieprzytomnym wzrokiem."
        ru: "Он смотрел на меня невидящим взглядом."
        source: { kind: authored }
      - pl: "Rano jestem nieprzytomny, dopóki nie wypiję kawy."
        ru: "Утром я не в себе, пока не выпью кофе."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Русскому NIEPRZYTOMNY ничего не подсказывает, а ведь это обычное слово: «без сознания». Русский скажет описательно — «потерял сознание», «без сознания», а у поляка на это есть прилагательное. Противоположное PRZYTOMNY значит «в сознании» и ещё «сообразительный, находчивый»: PRZYTOMNOŚĆ UMYSŁU — «присутствие духа». Связи с русским «присутствовать» здесь больше, чем кажется: PRZYTOMNY — буквально «присутствующий»." }
  - { kind: usage, text: "Степеней сравнения в первом значении нет: без сознания либо есть, либо нет. Во втором сравнивается описательно. Все одиннадцать форм живые. Форма для мужчин-людей NIEPRZYTOMNI встречается в медицинских и новостных текстах: NIEPRZYTOMNI PACJENCI, NIEPRZYTOMNI PASAŻEROWIE." }
  - { kind: government, text: "Без сознания от чего-то — NIEPRZYTOMNY Z BÓLU, Z PRZERAŻENIA, Z с родительным: «потерявший сознание от боли». Потерять сознание — STRACIĆ PRZYTOMNOŚĆ, прийти в себя — ODZYSKAĆ PRZYTOMNOŚĆ. В значении «не в себе» тоже Z: NIEPRZYTOMNY ZE SZCZĘŚCIA, «обезумевший от счастья»." }
  - { kind: pronunciation, text: "Читается «непшыто́мны», четыре слога, ударение на предпоследнем. PRZ даёт «пш»: RZ после глухого P оглушается в «ш». TO — чёткое «то». Сравните с PRZYTOMNOŚĆ «пшыто́мносьць»." }
  - { kind: register, text: "Нейтральное слово, обычное и в медицине, и в быту. Во втором значении разговорное и часто шутливое: JESTEM NIEPRZYTOMNY — «я никакой», после бессонной ночи. NIEPRZYTOMNIE ZAKOCHANY — «безумно влюблённый»." }
collocations:
  - { pl: "nieprzytomny pacjent", ru: "пациент без сознания" }
  - { pl: "nieprzytomny wzrok", ru: "невидящий, отсутствующий взгляд" }
  - { pl: "nieprzytomny z bólu", ru: "потерявший сознание от боли" }
family:
  - { pl: "przytomność", ru: "сознание; присутствие духа", relation: root, id: przytomnosc }
  - { pl: "przytomny", ru: "в сознании; сообразительный", relation: root }
  - { pl: "nieprzytomnie", ru: "без памяти, безумно", relation: derived }
etymology: "От старопольского PRZYTOMNY «присутствующий, находящийся рядом», с приставкой PRZY- «при». Человек в сознании — тот, кто «здесь», присутствует. Русское «присутствовать» собрано похоже, только на другой основе. Отрицание NIE- даёт «отсутствующий», то есть без сознания."
memory: "Nieprzytomny — без сознания: leżał nieprzytomny. Буквально «не присутствующий». Stracić przytomność — потерять сознание. И шутливо: rano jestem nieprzytomny — утром я никакой. Читается «непшыто́мны»."
idioms:
  - { pl: "nieprzytomnie zakochany", ru: "безумно влюблённый" }
