notes:
  - { kind: false-friend, text: "JEDNOŚĆ — «единство», с польским суффиксом -OŚĆ на месте русского «-ство». Так же WOLNOŚĆ — «свобода», MŁODOŚĆ — «молодость». JEDNOŚĆ — не «одиночество»: одиночество — SAMOTNOŚĆ." }
  - { kind: usage, text: "Женский род, мягкая основа. Учим единственное: JEDNOŚĆ, JEDNOŚCI, JEDNOŚCIĄ. Родительный, дательный и местный совпадают — JEDNOŚCI." }
  - { kind: government, text: "Единство с кем — JEDNOŚĆ Z и творительный: JEDNOŚĆ Z NATURĄ. В единстве — W JEDNOŚCI, местный. Призыв к единству — APEL O JEDNOŚĆ, винительный." }
  - { kind: pronunciation, text: "Читается «е́дносьць»: J — «й», с E даёт «е»; OŚĆ — «осьць». Ударение на первом слоге." }
