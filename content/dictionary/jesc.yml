# review
id: jesc
format: 2
lemma: "jeść"
rank: 272
pos: verb
aspect: imperf
pron: { cyr: "есьць" }
senses:
  - id: eat
    ru: "есть, кушать"
    note: "Спряжение неправильное: jem, jesz, je, jemy, jecie, jedzą."
    examples:
      - pl: "Jem."
        ru: "Я ем."
        source: { kind: tatoeba, id: 1613978 }
      - pl: "Jem mięso."
        ru: "Я ем мясо."
        source: { kind: tatoeba, id: 3207174 }
      - pl: "Jem zupę."
        ru: "Я ем суп."
        source: { kind: tatoeba, id: 8688536 }
  - id: eat-food
    ru: "есть (что-либо), питаться"
    examples:
      - pl: "Jem jabłko."
        ru: "Я ем яблоко."
        source: { kind: tatoeba, id: 2146132 }
      - pl: "Pies je."
        ru: "Собака ест."
        source: { kind: tatoeba, id: 5974885 }
      - pl: "Co jadłeś?"
        ru: "Что ты ел?"
        source: { kind: tatoeba, id: 5242451 }
notes:
  - { kind: usage, text: "Спряжение неправильное и его надо выучить: jem, jesz, je, jemy, jecie, jedzą. Прошедшее — jadłem, jadłam, jadł, jadła, jedliśmy." }
  - { kind: usage, text: "Совершенный вид — zjeść: Zjadłem obiad «Я съел обед»." }
  - { kind: usage, text: "Существительное jedzenie значит «еда»: po jedzeniu «после еды», przed jedzeniem «перед едой»." }
  - { kind: usage, text: "За столом говорят Smacznego! — «Приятного аппетита!»" }
collocations:
  - { pl: "jeść obiad", ru: "обедать" }
  - { pl: "chcę jeść", ru: "я хочу есть" }
  - { pl: "po jedzeniu", ru: "после еды" }
  - { pl: "smacznego", ru: "приятного аппетита" }
etymology: "Праславянское *(j)ěsti, из праиндоевропейского *h₁édti — то же слово, что русское «есть»."
memory: "jeść — «есть», но спряжение неправильное: jem, jesz, je, jemy, jecie, jedzą, а прошедшее — jadłem, jadła. Существительное jedzenie значит «еда»."
idioms:
  - { pl: "jeść jak wróbelek", ru: "есть как воробушек" }
  - { pl: "jeść z ręki", ru: "есть с руки" }
  - { pl: "jeść po królewsku", ru: "есть по-царски" }
