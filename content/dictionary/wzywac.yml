# review
id: wzywac
format: 2
lemma: "wzywać"
rank: 1999
pos: verb
aspect: imperf
aspectPair: wezwac
pron: { cyr: "взы́ваць" }
senses:
  - id: summon
    ru: "вызывать, призывать к себе"
    examples:
      - pl: "Ojciec cię wzywa."
        ru: "Отец тебя зовёт."
        source: { kind: translated, id: 524602 }
      - pl: "Dlaczego musiała go wzywać?"
        ru: "Почему ей пришлось его вызывать?"
        source: { kind: translated, id: 722348 }
      - pl: "Nikt cię nie wzywał!"
        ru: "Никто тебя не вызывал!"
        source: { kind: translated, id: 12198120 }
      - pl: "Obowiązki wzywają."
        ru: "Долг зовёт."
        source: { kind: translated, id: 10542050 }
      - pl: "Wzywam pogotowie."
        ru: "Я вызываю скорую."
        source: { kind: authored }
      - pl: "Nauczyciel wzywa ucznia do tablicy."
        ru: "Учитель вызывает ученика к доске."
        source: { kind: authored }
  - id: call-for-help
    ru: "звать на помощь"
    examples:
      - pl: "Słyszałem, jak młoda dziewczynka wzywa pomoc."
        ru: "Я слышал, как маленькая девочка зовёт на помощь."
        source: { kind: translated, id: 3049304 }
      - pl: "Czemu Tom nie wzywał pomocy?"
        ru: "Почему Том не звал на помощь?"
        source: { kind: translated, id: 8948286 }
      - pl: "Wzywanie pomocy nie ma sensu. Nikt cię nie usłyszy."
        ru: "Звать на помощь бессмысленно. Никто тебя не услышит."
        source: { kind: translated, id: 1465655 }
notes:
  - { kind: usage, text: "Несовершенный вид к wezwać, у которого своя карточка: wzywam «вызываю» — wezwę «вызову»." }
  - { kind: usage, text: "Частые сочетания: wzywać pomocy «звать на помощь», wzywać pogotowie «вызывать скорую», wzywać policję «вызывать полицию»." }
  - { kind: usage, text: "Оборот Obowiązki wzywają значит «Долг зовёт» — так говорят, уходя по делам." }
collocations:
  - { pl: "wzywać pomocy", ru: "звать на помощь" }
  - { pl: "wzywać pogotowie", ru: "вызывать скорую" }
  - { pl: "obowiązki wzywają", ru: "долг зовёт" }
etymology: "w- + zywać, многократная форма от zwać «звать», праславянское *zъvati. Русское «взывать» — то же самое слово, но в русском оно книжное, а польское wzywać совершенно обиходно."
memory: "wzywać — «вызывать, звать», несовершенный вид к wezwać. Wzywać pomocy «звать на помощь», wzywać pogotowie «вызывать скорую»."
idioms:
