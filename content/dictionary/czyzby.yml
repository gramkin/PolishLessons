# review
id: czyzby
format: 2
lemma: "czyżby"
rank: 1869
pos: part
pron: { cyr: "чы́жбы" }
senses:
  - id: really
    ru: "неужели, разве (сомнение или предположение)"
    examples:
      - pl: "Czyżby był chory?"
        ru: "Неужели он болен?"
        source: { kind: translated, id: 760364 }
      - pl: "Czyżby toaleta się zepsuła?"
        ru: "Неужели туалет сломался?"
        source: { kind: translated, id: 973059 }
      - pl: "Czyżby autobus był popsuty?"
        ru: "Неужели автобус сломался?"
        source: { kind: translated, id: 3659294 }
  - id: is-that-so
    ru: "как отдельная реплика — «неужели?», «да ну?»"
    examples:
      - pl: "Czyżby?"
        ru: "Неужели?"
        source: { kind: translated, id: 8745315 }
      - pl: "Och, czyżby?"
        ru: "О, неужели?"
        source: { kind: translated, id: 2570948 }
      - pl: "Czyżbyś pan chciał ze mną jechać, panie Holmes?"
        ru: "Неужели вы хотите поехать со мной, мистер Холмс?"
        source: { kind: authored }
notes:
  - { kind: usage, text: "Слово сложено из czy + -ż + -by: вопросительная частица, усилитель и условное by." }
  - { kind: usage, text: "Вводит вопрос с оттенком недоверия или догадки — как русское «неужели» и «разве»." }
  - { kind: usage, text: "Может стоять отдельной репликой: Czyżby? «Неужели?», «Да ну?»" }
  - { kind: usage, text: "К czyżby приклеиваются личные окончания: czyżbyś «неужели ты», czyżbyście «неужели вы»." }
collocations:
  - { pl: "czyżby?", ru: "неужели?" }
  - { pl: "czyżbyś", ru: "неужели ты" }
  - { pl: "czy", ru: "ли" }
etymology: "Сложение czy «ли» + усилительной частицы -ż + условного by. Русское «неужели» тоже собрано из вопросительной частицы и усилителя."
memory: "czyżby — «неужели, разве»: czy + -ż + -by. Вводит вопрос с недоверием или догадкой и легко стоит отдельной репликой: Czyżby? «Да ну?» К нему приклеиваются личные окончания: czyżbyś «неужели ты»."
