# review
id: wersja
format: 2
lemma: "wersja"
rank: 1387
pos: noun
pron: { cyr: "вэ́рсья" }
senses:
  - id: version
    ru: "версия, вариант (программы, текста)"
    examples:
      - pl: "Myślę, że nowa wersja Windowsów na pewno nie wyjdzie w tym miesiącu."
        ru: "Я думаю, маловероятно, что следующая версия Windows выйдет до конца этого месяца."
        source: { kind: tatoeba, id: 969063 }
      - pl: "Kup pełną wersję."
        ru: "Купи полную версию."
        source: { kind: translated, id: 11581323 }
      - pl: "To tylko jedna z możliwych wersji."
        ru: "Это только одна из возможных версий."
        source: { kind: tatoeba, id: 13786771 }
  - id: account
    ru: "версия событий, чей-либо рассказ"
    examples:
      - pl: "Teraz opowiem ci moją wersję."
        ru: "Теперь я расскажу тебе свою версию."
        source: { kind: translated, id: 991263 }
      - pl: "Troje ludzi podało trzy różne wersje wypadku."
        ru: "Трое человек изложили три разные версии происшествия."
        source: { kind: translated, id: 3029850 }
notes:
  - { kind: usage, text: "Женский род на -ja: родительный, дательный и предложный — wersji. Так же склоняются lekcja, stacja, policja." }
  - { kind: usage, text: "Значит и «версия» программы, и «версия» событий: moja wersja wydarzeń «моя версия событий»." }
  - { kind: usage, text: "wersja robocza — «рабочая версия, черновик», wersja ostateczna — «окончательная версия»." }
  - { kind: false-friend, text: "Не путайте wersja «версия» с wiersz «стихотворение, строка»: созвучие обманчиво, слова не связаны." }
collocations:
  - { pl: "nowa wersja", ru: "новая версия" }
  - { pl: "wersja robocza", ru: "рабочая версия" }
  - { pl: "wersja wydarzeń", ru: "версия событий" }
etymology: "Из латинского versio «поворот, изложение» (от vertere «поворачивать») через европейские языки; в русский «версия» пришла тем же путём."
memory: "wersja — «версия», слово международное. Запоминать надо только склонение на -ja: nowej wersji «новой версии», z nową wersją. Те же окончания, что у lekcja и stacja."
idioms:
  - { pl: "wersja robocza", ru: "рабочая версия" }
  - { pl: "wersja wydarzeń", ru: "версия событий" }
  - { pl: "najnowsza wersja", ru: "новейшая версия" }
formExamplesSkip:
  - { form: "wersyj", reason: "устаревшая форма родительного падежа множественного числа. До орфографической реформы 1936 года писали wersyj, lekcyj, stacyj, komisyj; современная норма — wersji, и именно она стоит в карточке. Форма принадлежит дореформенному правописанию, а не сегодняшнему языку" }
