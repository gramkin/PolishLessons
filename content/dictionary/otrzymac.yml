# review
id: otrzymac
format: 2
lemma: "otrzymać"
rank: 1222
pos: verb
aspect: perf
pron: { cyr: "отшы́маць" }
senses:
  - id: receive
    ru: "получить (письмо, награду, ответ)"
    examples:
      - pl: "Jackson nie otrzymał odpowiedzi na swój list."
        ru: "Джексон не получил ответа на своё письмо."
        source: { kind: tatoeba, id: 7960817 }
      - pl: "Otrzymałem zaproszenie."
        ru: "Я получил приглашение."
        source: { kind: translated, id: 355935 }
      - pl: "Otrzymał pierwszą nagrodę."
        ru: "Он получил первую премию."
        source: { kind: translated, id: 529677 }
  - id: obtain
    ru: "получить (право, скидку, разрешение)"
    examples:
      - pl: "Prawo jazdy można otrzymać od 18. roku życia."
        ru: "Водительские права можно получить с восемнадцати лет."
        source: { kind: translated, id: 356935 }
      - pl: "Czy mógłbym otrzymać rabat za płatność gotówką?"
        ru: "Могу ли я получить скидку за оплату наличными?"
        source: { kind: translated, id: 983238 }
      - pl: "Mogę otrzymać zwrot pieniędzy?"
        ru: "Могу я получить возврат денег?"
        source: { kind: translated, id: 7164790 }
  - id: result
    ru: "получить в результате (о числе, цвете)"
    examples:
      - pl: "Co musisz dodać do 17 aby otrzymać 60?"
        ru: "Что нужно прибавить к семнадцати, чтобы получить шестьдесят?"
        source: { kind: translated, id: 3432385 }
      - pl: "Dodaj nowe zdanie, by otrzymać nagrodę."
        ru: "Добавь новое предложение, чтобы получить награду."
        source: { kind: translated, id: 10284026 }
      - pl: "Jaki kolor otrzymasz, jeśli zmieszasz niebieski i żółty?"
        ru: "Какой цвет получится, если смешать синий и жёлтый?"
        source: { kind: translated, id: 3298930 }
notes:
  - { kind: register, text: "Otrzymać заметно официальнее разговорного dostać «получить». В документах и объявлениях пишут otrzymać, в живой речи чаще dostać." }
  - { kind: government, text: "Винительный падеж: otrzymać nagrodę, otrzymać list. При отрицании он меняется на родительный: nie otrzymał odpowiedzi." }
  - { kind: usage, text: "Вид совершенный; несовершенный — otrzymywać. Отглагольное существительное otrzymanie живёт в канцелярских оборотах: po otrzymaniu listu «по получении письма»." }
  - { kind: usage, text: "В счёте и математике значит «получить в результате»: Co dodać do 17, aby otrzymać 60?" }
collocations:
  - { pl: "otrzymać nagrodę", ru: "получить награду" }
  - { pl: "otrzymać odpowiedź", ru: "получить ответ" }
  - { pl: "po otrzymaniu", ru: "по получении" }
etymology: "Приставка o- и trzymać «держать». Буквально «удержать при себе» — отсюда значение «получить»."
memory: "otrzymać — «получить», но официальнее разговорного dostać: в объявлениях и документах всегда otrzymać. Несовершенный вид — otrzymywać. И запомните канцелярское po otrzymaniu «по получении»."
idioms:
  - { pl: "otrzymać nagrodę", ru: "получить награду" }
  - { pl: "otrzymać odpowiedź", ru: "получить ответ" }
  - { pl: "po otrzymaniu listu", ru: "по получении письма" }
