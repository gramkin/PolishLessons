# review
id: chetny
format: 2
lemma: "chętny"
rank: 4541
pos: adj
pron: { cyr: "хэ́нтны" }
senses:
  - id: willing
    ru: "желающий, готовый (что-то сделать)"
    examples:
      - pl: "Jest chętny do pomocy."
        ru: "Он готов помочь."
        source: { kind: authored }
      - pl: "Chętni mogą zapisać się na listę."
        ru: "Желающие могут записаться в список."
        source: { kind: authored }
      - pl: "Był najchętniejszy do pracy w całej grupie."
        ru: "Он охотнее всех в группе брался за работу."
        source: { kind: authored }
  - id: eager
    ru: "охочий, падкий (до чего-то)"
    examples:
      - pl: "Dzieci są chętne do zabawy."
        ru: "Дети охотно играют."
        source: { kind: authored }
      - pl: "Nie jest chętny do rozmowy."
        ru: "Он не расположен к разговору."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Русскому CHĘTNY не подсказывает, а слово частое: CHĘĆ — «желание, охота», CHĘTNY — «желающий, охотно готовый». Самое частое употребление — как существительное: CHĘTNI, «желающие»: CHĘTNYCH ZAPRASZAMY, «приглашаем желающих». Наречие CHĘTNIE — «охотно, с удовольствием»: CHĘTNIE POMOGĘ." }
  - { kind: usage, text: "Полная парадигма: CHĘTNY, CHĘTNIEJSZY, NAJCHĘTNIEJSZY. Степени живые, особенно в опросах: NAJCHĘTNIEJ WYBIERANY, «чаще всего выбираемый» (наречие). Форма для мужчин-людей: CHĘTNI, CHĘTNIEJSI, NAJCHĘTNIEJSI." }
  - { kind: government, text: "Готовый к чему-то — CHĘTNY DO + родительный: CHĘTNY DO PRACY, DO POMOCY, DO NAUKI. Это главная конструкция. Русское «готов к чему» с дательным здесь не работает." }
  - { kind: pronunciation, text: "Читается «хэ́нтны», два слога, ударение на первом. CH — «х», Ę перед T звучит «эн». В CHĘTNIEJSZY: «хэнтне́йшы»." }
  - { kind: register, text: "Нейтральное слово, частое в объявлениях: CHĘTNI PROSZENI SĄ O KONTAKT, «желающих просим связаться». Об интересе к противоположному полу — разговорное: ONA JEST CHĘTNA, «она не против», с игривым оттенком." }
collocations:
  - { pl: "chętny do pomocy", ru: "готовый помочь" }
  - { pl: "chętni mogą", ru: "желающие могут" }
  - { pl: "chętny do pracy", ru: "охотно берущийся за работу" }
family:
  - { pl: "chęć", ru: "желание, охота", relation: root, id: chec }
  - { pl: "chętnie", ru: "охотно", relation: derived, id: chetnie }
  - { pl: "ochota", ru: "охота, желание", relation: root, id: ochota }
etymology: "От CHĘĆ «желание», общеславянского *xǫtь, родственного русскому «хотеть» и «охота». Польское Ę на месте русского «о» в этом корне — то же, что в CHCIEĆ, «хотеть». Желающий — тот, у кого есть охота."
memory: "Chętny — желающий, готовый: chętny do pomocy. Chętni — желающие. Chętnie — охотно. Do + родительный. Chętniejszy, najchętniejszy. Читается «хэ́нтны»."
idioms:
  - { pl: "chętnych zapraszamy", ru: "приглашаем всех желающих" }
