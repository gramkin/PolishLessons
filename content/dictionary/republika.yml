notes:
  - { kind: false-friend, text: "REPUBLIKA — «республика», но сама Польша называется RZECZPOSPOLITA, а не REPUBLIKA: RZECZPOSPOLITA POLSKA. Это калька латинского RES PUBLICA, «общее дело». REPUBLIKA — о других странах: REPUBLIKA CZESKA, REPUBLIKA FRANCUSKA." }
  - { kind: usage, text: "Девять форм, женский род. В дательном и местном K переходит в C: W REPUBLICE. Звательный REPUBLIKO не употребляется." }
  - { kind: government, text: "В республике — W REPUBLICE, местный. Президент республики — PREZYDENT REPUBLIKI, родительный. Провозгласить республику — PROKLAMOWAĆ REPUBLIKĘ." }
  - { kind: pronunciation, text: "Читается «рэпу́блика»: ударение на третьем слоге с конца, как во всех словах на -IKA. REPUBLICE — «рэпу́блице»." }
