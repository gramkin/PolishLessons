notes:
  - { kind: pronunciation, text: "ИМЕНИТЕЛЬНЫЙ МНОЖЕСТВЕННОГО — OSZUŚCI, СО СМЯГЧЕНИЕМ ST В ŚĆ. Перед окончанием -i смягчается вся группа, а не один согласный: oszust — oszuści, student — studenci, turysta — turyści, artysta — artyści. Русское «мошенник — мошенники» основу не трогает, так что форму надо брать готовой. То же смягчение в предложном и звательном: o oszuście." }
  - { kind: usage, text: "Слово построено от OSZUKAĆ «обмануть» суффиксом деятеля -ista/-ust. Рядом живёт OSZUSTWO «мошенничество, обман» и NACIĄGACZ — «прохиндей, разводила», оттенком помягче. Русское «обманщик» ближе к naciągacz, а oszust звучит серьёзнее и годится для протокола." }
collocations:
  - { pl: "paść ofiarą oszusta", ru: "стать жертвой мошенника" }
  - { pl: "oszust podatkowy", ru: "налоговый мошенник" }
  - { pl: "zdemaskować oszusta", ru: "разоблачить мошенника" }
family:
  - { pl: "oszukać", ru: "обмануть", relation: root, id: oszukac }
  - { pl: "oszustwo", ru: "мошенничество", relation: root }
  - { pl: "uczciwy", ru: "честный", relation: antonym, id: uczciwy }
etymology: "От oszukać «обмануть», где корень szuk- тот же, что в szukać «искать»: обмануть значило когда-то «обыскать, обвести вокруг пальца в поисках». Русское «мошенник» идёт от «мошна» — кошелька, который срезали. Оба слова о краже, но образы разные: у поляков хитрость, у нас карман."
memory: "Множественное число — OSZUŚCI, со смягчением st в ść, как studenci и turyści. И предложный тот же: o oszuście."
idioms:
  - { pl: "paść ofiarą oszusta", ru: "стать жертвой мошенника" }
  - { pl: "oszust nad oszustami", ru: "мошенник из мошенников" }
