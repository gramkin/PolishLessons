  - { pl: "kostium", ru: "женский костюм; костюм (сценический)", relation: derived }
  - { pl: "ubranie", ru: "одежда", relation: root, id: ubranie }
etymology: "Из французского garniture «убранство, снаряжение», от garnir «снаряжать, украшать» — слова германского происхождения, родственного английскому warn. Сначала это был комплект чего угодно, потом в польском значение сузилось до комплекта одежды, то есть костюма. Русский взял то же слово, но оставил его при мебели."
memory: "garnitur — это прежде всего МУЖСКОЙ КОСТЮМ, а не «гарнитур»: мебель так называют лишь в обороте garnitur mebli. Русский «костюм» это garnitur; польское kostium — женский или сценический. Предложный: w garniturze, с r переходящим в rz."
idioms:
