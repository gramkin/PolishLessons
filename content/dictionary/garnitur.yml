notes:
  - { kind: false-friend, text: "ГЛАВНОЕ ЗНАЧЕНИЕ РУССКОМУ НЕЗНАКОМО. Русский «гарнитур» — это мебель, набор предметов; о костюме так не говорят. Польское garnitur прежде всего значит МУЖСКОЙ КОСТЮМ: garnitur i krawat, ślubny garnitur. Русский «костюм» переводится именно этим словом, а не словом kostium: kostium по-польски это женский костюм или театральный, сценический наряд." }
  - { kind: pronunciation, text: "ПРЕДЛОЖНЫЙ ПАДЕЖ МЕНЯЕТ R НА RZ: W GARNITURZE. Это общее правило для основ на r: aktor — o aktorze, rozmiar — w rozmiarze, spacer — na spacerze. Rz читается как ж, так что «в гарнитуже». Ударение везде на предпоследнем слоге: gar-ni-TUR, gar-ni-TU-rze." }
  - { kind: usage, text: "Второе значение, «комплект», сохранилось в устойчивых сочетаниях: garnitur mebli, garnitur narzędzi, garnitur pościeli. В обиходе же слово почти всегда про костюм. Пиджак отдельно — marynarka, брюки — spodnie, жилет — kamizelka." }
