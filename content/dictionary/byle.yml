# review
id: byle
format: 2
lemma: "byle"
rank: 2282
pos: part
pron: { cyr: "бы́ле" }
senses:
  - id: if-only
    ru: "лишь бы, только бы"
    examples:
      - pl: "Byle zdążyć na pociąg."
        ru: "Лишь бы успеть на поезд."
        source: { kind: authored }
      - pl: "Zrobi wszystko, byle mieć spokój."
        ru: "Он сделает всё, лишь бы иметь покой."
        source: { kind: authored }
  - id: any-old
    ru: "byle jaki — какой попало, никудышный"
    examples:
      - pl: "To nie byle jaki prezent."
        ru: "Это не какой-нибудь там подарок."
        source: { kind: authored }
      - pl: "Kupił byle jakie buty i teraz żałuje."
        ru: "Он купил какие попало ботинки и теперь жалеет."
        source: { kind: authored }
  - id: anyone-anywhere
    ru: "byle kto, byle gdzie — кто угодно, где попало"
    examples:
      - pl: "Nie powierzaj tego byle komu."
        ru: "Не доверяй это кому попало."
        source: { kind: authored }
notes:
  - { kind: usage, text: "ТРИ УПОТРЕБЛЕНИЯ, И ВСЕ ЧАСТОТНЫЕ. Первое — с инфинитивом или с żeby: byle zdążyć, byle tylko nie padało «лишь бы не было дождя». Второе — перед вопросительным словом: byle kto «кто попало», byle gdzie «где попало», byle jak «кое-как», byle co «что попало». Третье — byle jaki «никудышный». Во всех случаях оттенок пренебрежительный, кроме первого." }
  - { kind: false-friend, text: "ОТРИЦАНИЕ ПЕРЕВОРАЧИВАЕТ СМЫСЛ В ПОХВАЛУ. Byle jaki значит «так себе, никудышный», но nie byle jaki — это уже «НЕЗАУРЯДНЫЙ, не простой»: nie byle jaki specjalista «специалист не из рядовых». Русское «не абы какой» работает так же, но слышится реже, поэтому оборот легко понять наоборот." }
  - { kind: pronunciation, text: "Два слога, ударение на первом: BY-le. Y читается как русское ы, конечное e чисто, без редукции: «бы́ле». Слово не склоняется и не изменяется вовсе — форма одна." }
  - { kind: register, text: "Нейтрально, но разговорно. В канцелярском тексте вместо byle пишут aby tylko или jedynie. Оборот byle jak «кое-как» в оценке работы звучит довольно резко: zrobione byle jak значит, что работу придётся переделывать." }
collocations:
  - { pl: "byle jaki", ru: "никудышный, какой попало" }
  - { pl: "byle jak", ru: "кое-как" }
  - { pl: "nie byle kto", ru: "не кто-нибудь, важная персона" }
family:
  - { pl: "by", ru: "бы (частица)", relation: root, id: by }
  - { pl: "aby", ru: "чтобы", relation: derived, id: aby }
  - { pl: "żeby", ru: "чтобы", relation: derived, id: zeby }
etymology: "Сращение условной частицы by с древней усилительной частицей -le, то есть буквально «если бы только». Та же by сидит внутри aby и żeby. Русское «лишь бы» устроено похоже и тоже содержит «бы», так что логика оборота узнаваема, хотя слова разные."
memory: "byle — «лишь бы»: byle zdążyć. Перед вопросительным словом даёт пренебрежение: byle kto «кто попало», byle jak «кое-как». А с отрицанием переворачивается в похвалу: nie byle jaki значит «незаурядный»."
idioms:
  - { pl: "byle jak", ru: "кое-как" }
  - { pl: "nie byle jaki", ru: "незаурядный, не из рядовых" }
formExamples:
  - form: "byle"
    pl: "Byle zdążyć na pociąg."
    ru: "Лишь бы успеть на поезд."
    source: { kind: authored }
  - form: "byle"
    pl: "Zrobione byle jak, trzeba poprawić."
    ru: "Сделано кое-как, надо переделать."
    source: { kind: authored }
  - form: "byle"
    pl: "To nie byle kto, to sam dyrektor."
    ru: "Это не кто-нибудь, это сам директор."
    source: { kind: authored }
