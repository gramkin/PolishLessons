lemma: "pociągnąć"
rank: 2666
pos: verb
pron: { cyr: "поцёнгнонць" }
senses:
  - id: pull
    ru: "потянуть, дёрнуть"
    examples:
      - pl: "Wystarczy pociągnąć za sznurek."
        ru: "Достаточно потянуть за шнурок."
        source: { kind: authored }
      - pl: "Pociągnął za sznurek i zapaliło się światło."
        ru: "Он потянул за шнурок, и зажёгся свет."
        source: { kind: authored }
      - pl: "Pociągnij za dzwonek."
        ru: "Потяни за звонок."
        source: { kind: authored }
  - id: entail
    ru: "повлечь за собой"
    examples:
      - pl: "Ta decyzja może pociągnąć za sobą zwolnienia."
        ru: "Это решение может повлечь за собой увольнения."
        source: { kind: authored }
      - pl: "Został pociągnięty do odpowiedzialności."
        ru: "Он был привлечён к ответственности."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Вид совершенный, пара к несовершенному POCIĄGAĆ. Формы pociągnę, pociągniesz, pociągnie означают будущее: «потяну», «потянешь». У несовершенного pociągać есть побочное значение, которого у совершенного нет: «привлекать, нравиться». To mnie nie pociąga значит «меня это не привлекает», и к тяге за верёвку отношения уже не имеет." }
  - { kind: pronunciation, text: "Класс на -nąć здесь ведёт себя обычным образом: суффикс сохраняется, а ą и ę чередуются. POCIĄGNĄŁ в мужском роде единственного, POCIĄGNĘŁA, pociągnęło, pociągnęli, pociągnęły во всём остальном прошедшем. Так же устроен przesunąć. Выпадение суффикса, как в pękł вместо «pęknął», встречается реже и запоминается отдельно, как исключение." }
  - { kind: usage, text: "Приставка po- и корень дают целую связку оборотов, которые по-русски переводятся разными глаголами. POCIĄGNĄĆ ZA SOBĄ — повлечь за собой, POCIĄGNĄĆ DO ODPOWIEDZIALNOŚCI — привлечь к ответственности, POCIĄGNĄĆ ŁYK — сделать глоток, POCIĄGNĄĆ NOSEM — шмыгнуть носом, POCIĄGNĄĆ LINIĘ — провести линию. Общий образ один: что-то тянут из одной точки в другую." }
collocations:
  - { pl: "pociągnąć za sobą", ru: "повлечь за собой" }
  - { pl: "pociągnąć do odpowiedzialności", ru: "привлечь к ответственности" }
  - { pl: "pociągnąć łyk", ru: "сделать глоток" }
family:
  - { pl: "ciągnąć", ru: "тянуть", relation: root, id: ciagnac }
  - { pl: "pociągać", ru: "тянуть, привлекать", relation: aspect }
  - { pl: "pociąg", ru: "поезд; влечение", relation: derived, id: pociag }
etymology: "Приставка po- и глагол CIĄGNĄĆ, из праславянского *tęgnǫti — то же слово, что русское «тянуть», где t перед носовым гласным дало в польском ć. Из этого же корня польские ciąg «тяга» и pociąg, который означает сразу и «поезд», и «влечение»: буквально это «то, что тянут» и «то, что тянет к себе». Русская «тяга» и «поезд» разошлись по разным корням, а польский удержал оба смысла в одном слове."
memory: "Суффикс сохраняется: pociągnął, pociągnęła — как przesunął. Исключение с выпадением было у pękł. И pociąg — это «поезд», потому что его тянут."
idioms:
  - { pl: "pociągnąć kogoś do odpowiedzialności", ru: "привлечь к ответственности" }
  - { pl: "pociągnąć za sobą", ru: "повлечь за собой" }
