# review
id: widmowy
format: 2
lemma: "widmowy"
rank: 5523
pos: adj
pron: { cyr: "видмо́вы" }
senses:
  - id: ghostly
    ru: "призрачный, фантомный"
    examples:
      - pl: "Widmowy blask sączył się z okien."
        ru: "Призрачный свет сочился из окон."
        source: { kind: authored }
      - pl: "To był widmowy statek."
        ru: "Это был корабль-призрак."
        source: { kind: authored }
      - pl: "Widmowa postać zniknęła."
        ru: "Призрачная фигура исчезла."
        source: { kind: authored }
  - id: spectral
    ru: "спектральный (физический термин)"
    examples:
      - pl: "Analiza widmowa pokazuje skład."
        ru: "Спектральный анализ показывает состав."
        source: { kind: authored }
      - pl: "Zmierzono widmowy rozkład światła."
        ru: "Измерили спектральное распределение света."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Два значения от одного существительного widmo, которое значит и «призрак», и «спектр». Отсюда и «призрачный», и «спектральный»." }
  - { kind: false-friend, text: "Русский разводит эти значения по разным корням — «призрачный» и «спектральный», — а польский держит одно слово." }
  - { kind: government, text: "Обычное прилагательное на -y." }
  - { kind: usage, text: "В корпусе слово не встречается, поэтому все примеры составлены вручную." }
collocations:
  - { pl: "analiza widmowa", ru: "спектральный анализ" }
  - { pl: "widmowy statek", ru: "корабль-призрак" }
etymology: "От widmo «призрак; спектр», от widzieć «видеть»; ср. русское «видение», «вид»."
memory: "widmowy — «призрачный» и «спектральный» сразу, потому что widmo значит и «призрак», и «спектр». Русский разводит эти смыслы по разным корням."
idioms:
  - { pl: "analiza widmowa", ru: "спектральный анализ" }
formExamplesSkip:
  - { form: "widmowi", reason: "мужско-личная форма множественного числа, а оба значения слова — о вещах и явлениях: widmowy blask, widmowy statek, analiza widmowa. Даже в первом значении говорят widmowe postacie, а не о людях, поэтому формы widmowi в текстах нет" }
