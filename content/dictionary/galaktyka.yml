notes:
  - { kind: government, text: "Женский род на -KA, и главное в склонении — чередование K в C перед окончанием -E. Дательный и местный единственного совпадают в форме GALAKTYCE, и ни одна другая форма этого чередования не показывает. Так ведут себя все существительные на -KA: PRAKTYKA даёт PRAKTYCE, MATKA даёт MATCE, RĘKA даёт RĘCE. Запоминать стоит правило, а не слово. Винительный на -Ę: OPISAĆ GALAKTYKĘ. Родительный множественного GALAKTYK, без окончания. Где — предлог W с местным: W GALAKTYCE. Чего галактика — родительный: GALAKTYKA GWIAZD." }
  - { kind: false-friend, text: "Значение совпадает с русской «галактикой» полностью, и подвоха нет. Зато любопытно, что оба языка обошлись с греческим словом одинаково и дважды. Греческое GALAXIAS KYKLOS значило «молочный круг», от GALA «молоко», и это название нашей собственной галактики. Оба языка перевели его буквально — польское DROGA MLECZNA, русский «Млечный Путь» — а для общего понятия взяли греческое слово без перевода: GALAKTYKA, «галактика». Так что в польском и русском соседствуют калька и заимствование одного и того же выражения, и говорящие обычно не замечают, что это одно и то же слово." }
  - { kind: pronunciation, text: "Читается «галакты́ка», ударение на предпоследнем слоге из четырёх. Гласная Y звучит «ы», и это единственное место, где польское чтение расходится с русским «галактикой» с её «и». Сочетание KT произносится раздельно. В дательном и местном GALAKTYCE буква K переходит в C и читается «ц»: «галакты́це», и ударение остаётся на предпоследнем слоге. В родительном множественного GALAKTYK три слога: «гала́ктык»." }
  - { kind: usage, text: "Частотные сочетания: GALAKTYKA SPIRALNA, GALAKTYKA KARŁOWATA «карликовая галактика», NASZA GALAKTYKA, GROMADA GALAKTYK «скопление галактик», DROGA MLECZNA «Млечный Путь». Прилагательное GALAKTYCZNY значит «галактический» и тоже показывает чередование K в C перед -YCZNY, только здесь оно орфографическое. В переносном употреблении слово означает несчётное множество: CAŁA GALAKTYKA PROBLEMÓW, и русский в этом значении скорее скажет «целый космос» или «море»." }
