etymology: "Из греческого GALAXIAS, от GALA «молоко» — того же корня, что латинское LAC и, через него, слова вроде LAKTOZA «лактоза». Греки называли звёздную полосу на небе GALAXIAS KYKLOS, «молочный круг», и через латинское VIA LACTEA это выражение попало во все европейские языки в переводе: польское DROGA MLECZNA, русский «Млечный Путь», английское MILKY WAY. Когда в двадцатом веке понадобилось общее слово для звёздных систем, языки взяли греческое GALAXIAS уже без перевода, и так в одном словаре оказались калька и заимствование одного выражения. Чередование K в C в форме GALAKTYCE к происхождению отношения не имеет: это славянское правило, которое польский прилагает к заимствованиям наравне со своими словами."
memory: "Совпадает с русской «галактикой», читать Y как «ы». Главная форма — дательный и местный galaktyce, с k→c: это общее правило для всех слов на -ka, как praktyka — praktyce и matka — matce. Этимология двойная: греческое «молочный круг» оба языка перевели — Droga Mleczna, «Млечный Путь», — а для общего понятия взяли то же греческое слово без перевода."
