        ru: "Я никогда не списывал на экзамене."
        source: { kind: authored }
  - id: summon
    ru: "созвать, собрать (людей откуда-л.)"
    examples:
      - pl: "Ściągnęli ekipę z Warszawy."
        ru: "Они вызвали бригаду из Варшавы."
