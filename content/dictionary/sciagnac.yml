      - pl: "Ściągnięci z całego kraju specjaliści obradowali do nocy."
        ru: "Собранные со всей страны специалисты совещались до ночи."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Корень прозрачен: ś- (то же, что z-) плюс ciągnąć «тянуть», праславянское *tęgnǫti. Русское «стянуть» собрано из тех же частей, так что первое значение понятно сразу. Дальше смыслы расходятся веером, и все они растут из того же образа «потянуть к себе»: скачать файл, списать на экзамене, созвать людей. Русский на каждый из них взял своё слово, поэтому переводить приходится по контексту." }
  - { kind: government, text: "Снимают ЧТО — винительный: ściągnąć buty. Откуда — Z с РОДИТЕЛЬНЫМ: ściągnąć plik Z internetu, ściągnąć obrus ZE stołu. Списывают НА чём — NA с ПРЕДЛОЖНЫМ: ściągać na egzaminie, na sprawdzianie; а у кого — OD с РОДИТЕЛЬНЫМ: ściągnąć OD kolegi, в точности как русское «списать У кого-то»." }
  - { kind: usage, text: "Чередование ą/ę позиционное, как у wynająć: ą стоит в инфинитиве (ściągnąć), в деепричастии (ściągnąwszy) и в мужском единственном прошедшего с его условными формами (ściągnął, ściągnąłem, ściągnąłby); во всех остальных клетках ę — ściągnęła, ściągnęli, ściągnięty, ściągnięcie." }
  - { kind: register, text: "Значение «списать» — школьный и студенческий жаргон, но совершенно общеупотребительный: его знают все и употребляют свободно, включая преподавателей. Несовершенная пара ściągać в этом значении даже обычнее: ściągać na klasówce." }
collocations:
  - { pl: "ściągnąć buty", ru: "снять обувь" }
  - { pl: "ściągnąć plik", ru: "скачать файл" }
  - { pl: "ściągać na egzaminie", ru: "списывать на экзамене" }
family:
  - { pl: "ciągnąć", ru: "тянуть", relation: root }
  - { pl: "ściągać", ru: "стягивать; скачивать; списывать", relation: aspect }
  - { pl: "pociągnąć", ru: "потянуть", relation: derived }
etymology: "Приставка ś- (вариант z-) плюс ciągnąć «тянуть», от праславянского *tęgnǫti. Русское «стянуть» — то же сложение тех же частей, поэтому слово узнаётся без усилий. Все позднейшие значения выросли из одного образа: потянуть к себе. Файл «стягивают» из сети, ответ «стягивают» у соседа, людей «стягивают» со всей страны."
memory: "ściągnąć — «стянуть», ś- + ciągnąć, часть в часть. Дальше один образ даёт четыре смысла: снять (buty), скачать (plik), списать (na egzaminie) и созвать (ekipę). Чередование как у wynająć: ściągnął, но ściągnęła."
idioms:
  - { pl: "ściągać na egzaminie", ru: "списывать на экзамене" }
  - { pl: "ściągnąć kogoś na ziemię", ru: "вернуть кого-л. с небес на землю" }
