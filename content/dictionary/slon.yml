senses:
  - id: elephant
    ru: "слон"
    examples:
      - pl: "Słoń to największe zwierzę lądowe."
        ru: "Слон — самое крупное сухопутное животное."
        source: { kind: authored }
      - pl: "Dzieci najbardziej lubią słonie."
