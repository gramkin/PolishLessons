notes:
  - { kind: false-friend, text: "SŁOŃ — «слон», но шахматный слон по-польски — GONIEC, буквально «гонец». В шахматах SŁOŃ не говорят. И произносится слово не «слонь»: Ł — это «у», поэтому «суонь»." }
  - { kind: usage, text: "Десять форм, мужской род, одушевлённое. Основа мягкая: SŁONIA, SŁONIEM, SŁONIE. Родительный множественного — SŁONI. Местный и звательный совпадают: SŁONIU." }
  - { kind: government, text: "Как слон в посудной лавке — JAK SŁOŃ W SKŁADZIE PORCELANY. Слоновая кость — KOŚĆ SŁONIOWA. Со слоном — ZE SŁONIEM: перед SŁ предлог Z получает E." }
  - { kind: pronunciation, text: "Читается «суонь», один слог. Ł — краткое «у», Ń на конце — мягкое «нь»." }
collocations:
  - { pl: "słoń afrykański", ru: "африканский слон" }
  - { pl: "kość słoniowa", ru: "слоновая кость" }
  - { pl: "pamięć słonia", ru: "слоновья, отличная память" }
family:
  - { pl: "słonica", ru: "слониха", relation: derived }
  - { pl: "słonik", ru: "слоник", relation: derived }
  - { pl: "słoniowy", ru: "слоновый", relation: derived }
etymology: "Слово общее с русским «слон»; его происхождение спорно. Польское Ł на месте русского «л» здесь звучит как «у», а мягкое Ń — как «нь»."
memory: "Słoń — слон, читается «суонь». Шахматный слон — goniec. Jak słoń w składzie porcelany — как слон в посудной лавке."
idioms:
  - { pl: "jak słoń w składzie porcelany", ru: "как слон в посудной лавке" }
