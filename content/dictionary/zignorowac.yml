# review
id: zignorowac
format: 2
lemma: "zignorować"
rank: 4534
pos: verb
pron: { cyr: "зигноро́ваць" }
senses:
  - id: ignore
    ru: "проигнорировать, не обратить внимания"
    examples:
      - pl: "Zignorował moje ostrzeżenie."
        ru: "Он проигнорировал моё предупреждение."
        source: { kind: authored }
      - pl: "Zignoruj tę wiadomość."
        ru: "Не обращай внимания на это сообщение."
        source: { kind: authored }
      - pl: "Kierowca zignorował czerwone światło."
        ru: "Водитель проехал на красный свет."
        source: { kind: authored }
  - id: snub
    ru: "не заметить нарочно, пренебречь (человеком)"
    examples:
      - pl: "Zignorowała mnie na przyjęciu."
        ru: "Она сделала вид, что не заметила меня на приёме."
        source: { kind: authored }
      - pl: "Nie pozwolę się zignorować."
        ru: "Я не позволю себя игнорировать."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ZIGNOROWAĆ — точное «проигнорировать». Но русское «не заметить» в смысле «по рассеянности» — NIE ZAUWAŻYĆ: ZIGNOROWAĆ всегда нарочно. Польское IGNORANT — «невежда», а не тот, кто игнорирует." }
  - { kind: usage, text: "Пятьдесят три формы — подпись переходного глагола совершенного вида: страдательное ZIGNOROWANY и деепричастие ZIGNOROWAWSZY. Спряжение на -UJĘ: ZIGNORUJĘ, ZIGNORUJESZ. Видовой партнёр — IGNOROWAĆ: IGNORUJE MNIE OD TYGODNIA." }
  - { kind: government, text: "Кого или что — винительный: ZIGNOROWAĆ RADĘ, ZNAK, CZŁOWIEKA. С отрицанием — родительный: NIE ZIGNOROWAŁ OSTRZEŻENIA. Сравните русское «на что не обратить внимания» — по-польски без предлога." }
  - { kind: pronunciation, text: "Читается «зигноро́ваць», четыре слога, ударение на предпоследнем. ZI — мягкое «зи», GN — раздельно «гн», не «нь». Будущее ZIGNORUJĘ — «зигнору́е»." }
  - { kind: register, text: "Нейтральное слово, обычное и в быту, и в новостях. В разговоре чаще OLAĆ — «забить, наплевать»: OLAŁ MNIE. Официальное ZIGNOROWAĆ WEZWANIE — «проигнорировать вызов»." }
collocations:
  - { pl: "zignorować ostrzeżenie", ru: "проигнорировать предупреждение" }
  - { pl: "zignorować radę", ru: "пропустить совет мимо ушей" }
  - { pl: "zignorować wiadomość", ru: "не ответить на сообщение" }
family:
  - { pl: "ignorowac", ru: "игнорировать", relation: aspect, id: ignorowac }
  - { pl: "ignorancja", ru: "невежество", relation: root }
  - { pl: "olac", ru: "наплевать, забить (разг.)", relation: root }
etymology: "Приставка Z- плюс IGNOROWAĆ, из латинского IGNORARE «не знать». То же слово, что русское «игнорировать»; польский суффикс -OWAĆ короче русского -ировать."
memory: "Zignorować — проигнорировать: zignorował ostrzeżenie, zignoruj to. Всегда нарочно; по рассеянности — nie zauważyć. Ignorant — невежда! Читается «зигноро́ваць»."
idioms:
  - { pl: "zignorować kogoś ostentacyjnie", ru: "демонстративно проигнорировать кого-то" }
