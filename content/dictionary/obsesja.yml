# review
id: obsesja
format: 2
lemma: "obsesja"
rank: 2485
pos: noun
pron: { cyr: "обсэ́ся" }
senses:
  - id: obsession
    ru: "навязчивая идея, одержимость"
    examples:
      - pl: "Czystość stała się u niej obsesją."
        ru: "Чистота стала у неё навязчивой идеей."
        source: { kind: authored }
      - pl: "Ma obsesję na punkcie porządku."
        ru: "У него навязчивая идея насчёт порядка."
        source: { kind: authored }
  - id: fixation
    ru: "мания, пунктик"
    examples:
      - pl: "Jego obsesje męczyły całą rodzinę."
        ru: "Его навязчивые идеи мучили всю семью."
        source: { kind: authored }
      - pl: "Nie rozumiem tej obsesji."
        ru: "Я не понимаю этой одержимости."
        source: { kind: authored }
  - id: compulsion
    ru: "обсессия (мед.)"
    examples:
      - pl: "Lekarz mówił o obsesjach i natręctwach."
        ru: "Врач говорил об обсессиях и навязчивостях."
        source: { kind: authored }
notes:
  - { kind: government, text: "ОБОРОТ ЗАПОМИНАЙ ЦЕЛИКОМ: MIEĆ OBSESJĘ NA PUNKCIE czegoś — «иметь навязчивую идею насчёт чего-то». Буквально «на пункте», с родительным падежом после punkcie. Русское «быть одержимым чем-то» строится совсем иначе, через творительный, и дословный перевод тут не работает." }
  - { kind: usage, text: "Ещё одно существительное класса на -ja, как komisja и stacja, и родительный множественного у него тоже двойной: обычное OBSESJI и старое книжное OBSESYJ. В живой речи звучит только первое, второе встретишь в текстах прошлого века." }
  - { kind: false-friend, text: "Русская «обсессия» существует, но это узкий медицинский термин. Польская obsesja совершенно обиходна и означает просто «пунктик, навязчивую идею»: to u niego obsesja. Переводить её медицинским словом почти всегда неверно — нужнее «одержимость» или «навязчивая идея»." }
collocations:
  - { pl: "mieć obsesję", ru: "иметь навязчивую идею" }
  - { pl: "na punkcie czegoś", ru: "насчёт чего-л." }
  - { pl: "chora obsesja", ru: "болезненная одержимость" }
family:
  - { pl: "obsesyjny", ru: "навязчивый", relation: derived }
  - { pl: "mania", ru: "мания", relation: root }
  - { pl: "spokój", ru: "покой", relation: antonym, id: spokoj }
etymology: "Из латинского obsessio «осада», от obsidere «осаждать», сложения ob- «вокруг» и sedere «сидеть». Навязчивая мысль понималась как осада ума. Тот же латинский корень дал английское obsess и русскую «обсессию», а sedere виден в «резиденции» и «сессии»."
memory: "obsesja — «навязчивая идея», слово обиходное, не медицинское. Оборот целиком: mieć obsesję NA PUNKCIE czegoś. По происхождению это латинская «осада»: навязчивая мысль осаждает ум."
idioms:
  - { pl: "mieć obsesję na punkcie czegoś", ru: "быть одержимым чем-л." }
  - { pl: "to już obsesja", ru: "это уже навязчивая идея" }
