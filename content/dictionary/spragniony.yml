  - { pl: "pragnąć", ru: "желать, жаждать", relation: root, id: pragnac }
  - { pl: "głodny", ru: "голодный", relation: root, id: glodny }
etymology: "От PRAGNĄĆ «жаждать», общеславянского *pragnǫti, предположительно от корня *prag-, «сохнуть, жариться». Тот же глагол живёт в украинском «прагнути», «стремиться», а в русском литературном языке он не сохранился. Жажда — это когда во рту пересохло. SPRAGNIONY — причастие с приставкой S-: «пришедший в состояние жажды»."
memory: "Spragniony — мучимый жаждой: jestem spragniony — я хочу пить. И переносно: spragniony wiedzy — жаждущий знаний. Читается «спрагньо́ны». Мн. ч. для мужчин — spragnieni."
idioms:
