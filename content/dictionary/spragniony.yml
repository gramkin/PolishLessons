notes:
  - { kind: false-friend, text: "Русский скажет «хочу пить» глаголом, а поляк — прилагательным: JESTEM SPRAGNIONY, буквально «я жаждущий». Так же и с голодом: JESTEM GŁODNY, «я голоден». Сказать CHCĘ PIĆ тоже можно, но JESTEM SPRAGNIONY звучит естественнее. Русское «жаждущий» книжное, польское SPRAGNIONY — повседневное." }
  - { kind: usage, text: "Сравнивается описательно: BARDZIEJ SPRAGNIONY. Все одиннадцать форм живые. Форма для мужчин-людей SPRAGNIENI частая: SPRAGNIENI TURYŚCI, SPRAGNIENI KIBICE. Обратите внимание на чередование: SPRAGNIONY, но SPRAGNIENI, O переходит в E перед мягким окончанием." }
  - { kind: government, text: "Жаждущий чего-то — SPRAGNIONY + родительный, без предлога: SPRAGNIONY WIEDZY, «жаждущий знаний», SPRAGNIONY SŁAWY, «жаждущий славы». Русское «жаждущий чего» тоже с родительным, так что конструкция совпадает." }
  - { kind: pronunciation, text: "Читается «спрагньо́ны», три слога, ударение на предпоследнем. GNIO даёт «гньо», с мягким «нь», как в PRAGNIENIE «прагне́не». Конечная Y — «ы»." }
  - { kind: register, text: "Нейтральное слово. В прямом значении оно бытовое и детское: MAMO, JESTEM SPRAGNIONY. В переносном — с поэтическим оттенком: SPRAGNIONY PRZYGÓD, «жаждущий приключений». В рекламе напитков встречается постоянно." }
collocations:
