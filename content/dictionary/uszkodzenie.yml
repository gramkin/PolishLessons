# review
id: uszkodzenie
format: 2
lemma: "uszkodzenie"
rank: 5146
pos: noun
pron: { cyr: "ушкодзэ́не" }
senses:
  - id: damage
    ru: "повреждение, поломка"
    examples:
      - pl: "Samochód ma uszkodzenie silnika."
        ru: "У машины повреждён двигатель."
        source: { kind: authored }
      - pl: "Paczka dotarła bez uszkodzeń."
        ru: "Посылка дошла без повреждений."
        source: { kind: authored }
      - pl: "Ubezpieczenie pokrywa uszkodzenia."
        ru: "Страховка покрывает повреждения."
        source: { kind: authored }
  - id: injury
    ru: "повреждение, травма (мед.)"
    examples:
      - pl: "Lekarz stwierdził uszkodzenie kolana."
        ru: "Врач обнаружил травму колена."
        source: { kind: authored }
      - pl: "Uszkodzenie nerwu wymaga operacji."
        ru: "Повреждение нерва требует операции."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "USZKODZENIE — «повреждение», от SZKODA, «вред, ущерб». Не путайте с SZKODA! — «жаль!». Поломка машины — AWARIA, разрушение — ZNISZCZENIE. Повредить — USZKODZIĆ." }
  - { kind: usage, text: "Средний род, отглагольное от USZKODZIĆ. Родительный множественного — USZKODZEŃ: BEZ USZKODZEŃ, «без повреждений». Звательного нет." }
  - { kind: government, text: "Повреждение чего — родительный: USZKODZENIE MÓZGU. Без повреждений — BEZ USZKODZEŃ, родительный. Получить повреждения — DOZNAĆ USZKODZEŃ." }
  - { kind: pronunciation, text: "Читается «ушкодзэ́не»: SZ — «ш», DZE — «дзэ», NIE — «не». Ударение на предпоследнем слоге." }
collocations:
  - { pl: "uszkodzenie mechaniczne", ru: "механическое повреждение" }
  - { pl: "bez uszkodzeń", ru: "без повреждений" }
  - { pl: "uszkodzenie ciała", ru: "телесное повреждение" }
family:
  - { pl: "uszkodzić", ru: "повредить", relation: root, id: uszkodzic }
  - { pl: "szkoda", ru: "вред, ущерб; жаль", relation: root, id: szkoda }
  - { pl: "awaria", ru: "авария, поломка", relation: root, id: awaria }
etymology: "От USZKODZIĆ «повредить», а то — от SZKODA «вред». Русское разговорное «шкода», «шкодить» — того же корня."
memory: "Uszkodzenie — повреждение, от szkoda — вред. Bez uszkodzeń — без повреждений. Читается «ушкодзэ́не»."
idioms:
  - { pl: "uszkodzenie ciała", ru: "телесное повреждение (юр.)" }
