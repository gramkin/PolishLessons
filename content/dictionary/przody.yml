# review
id: przody
format: 2
lemma: "przódy"
rank: 5793
pos: adv
pron: { cyr: "пшу́ды" }
senses:
  - id: formerly
    ru: "прежде, раньше"
    note: "устаревшее"
    examples:
      - pl: "Przódy bywało inaczej, dziś wszystko się zmieniło."
        ru: "Прежде бывало иначе, сегодня всё изменилось."
        source: { kind: authored }
      - pl: "Dziadek opowiadał, jak przódy żyło się na wsi."
        ru: "Дедушка рассказывал, как прежде жилось в деревне."
        source: { kind: authored }
      - pl: "Wszystko wróciło do tego, co było przódy."
        ru: "Всё вернулось к тому, что было прежде."
        source: { kind: authored }
  - id: first
    ru: "сперва, сначала"
    note: "устаревшее"
    examples:
      - pl: "Przódy wysłuchaj, potem sądź."
        ru: "Сперва выслушай, потом суди."
        source: { kind: authored }
      - pl: "Musisz przódy zapytać ojca o zgodę."
        ru: "Сперва тебе нужно спросить согласия у отца."
        source: { kind: authored }
notes:
  - { kind: register, text: "Слово устаревшее: оно встречается в старой литературе и в стилизации под старину. Сегодня говорят WCZEŚNIEJ, PRZEDTEM «раньше» или NAJPIERW «сначала»." }
  - { kind: usage, text: "Два значения, как у русского «прежде»: «раньше, в прошлом» (JAK PRZÓDY «как прежде») и «сперва» (PRZÓDY WYSŁUCHAJ «сперва выслушай»). Книжный синоним с тем же корнем — WPRZÓDY." }
  - { kind: pronunciation, text: "Читается «пшу́ды»: RZ после глухого P оглушается в «ш», Ó — «у». Ударение на первый слог." }
collocations:
  - { pl: "jak przódy", ru: "как прежде" }
  - { pl: "przódy i dziś", ru: "прежде и теперь" }
  - { pl: "przódy wysłuchaj", ru: "сперва выслушай" }
family:
  - { pl: "przód", ru: "перёд", relation: root, id: przod }
  - { pl: "wprzódy", ru: "сперва, прежде", relation: root, id: wprzody }
  - { pl: "naprzód", ru: "вперёд", relation: root, id: naprzod }
  - { pl: "przodek", ru: "предок", relation: root, id: przodek }
etymology: "Старое наречие от PRZÓD «перёд»: то, что «впереди» во времени, — прежде. Тот же корень, что в русских «перёд» и «прежде»."
memory: "przódy — «прежде»: przód — перёд, а przódy — то, что было впереди по времени, то есть раньше."
idioms:
  - { pl: "jak przódy", ru: "как прежде, как встарь" }
formExamples:
  - form: "przódy"
    pl: "Jak przódy, tak i dziś bronimy swego."
    ru: "Как прежде, так и сегодня мы защищаем своё."
    source: { kind: authored }
  - form: "przódy"
    pl: "Rycerz przódy zsiadł z konia, a potem ukłonił się królowi."
    ru: "Рыцарь сперва сошёл с коня, а потом поклонился королю."
    source: { kind: authored }
  - form: "przódy"
    pl: "W starych kronikach czytamy, że przódy było tu jezioro."
    ru: "В старых летописях мы читаем, что прежде здесь было озеро."
    source: { kind: authored }
