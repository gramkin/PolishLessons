notes:
  - { kind: usage, text: "Мужской неодушевлённый: винительный совпадает с именительным (Mam pistolet), родительный — pistoletu. После отрицания нужен родительный: nie mam pistoletu." }
  - { kind: usage, text: "Слово переносится на инструменты той же формы: pistolet do kleju «клеевой пистолет», pistolet natryskowy «краскопульт», pistolet dystrybutora «заправочный пистолет»." }
  - { kind: false-friend, text: "Разговорно pistolet может значить «шустрый малый, бойкий человек» — значения, которого у русского слова нет." }
collocations:
  - { pl: "wyciągnąć pistolet", ru: "вытащить пистолет" }
  - { pl: "grozić pistoletem", ru: "угрожать пистолетом" }
  - { pl: "pistolet do kleju", ru: "клеевой пистолет" }
etymology: "Через немецкое Pistole из французского pistolet, а то восходит к чешскому píšťala «дудка, ствол». Русское «пистолет» пришло тем же европейским путём, поэтому слова почти совпадают."
memory: "pistolet — «пистолет», слово то же самое. Помните родительный pistoletu: он же нужен после отрицания — nie mam pistoletu. И держите в голове переносное значение: pistolet do kleju «клеевой пистолет»."
idioms:
  - { pl: "przystawić komuś pistolet do głowy", ru: "приставить кому-то нож к горлу" }
  - { pl: "pistolet do kleju", ru: "клеевой пистолет" }
  - { pl: "z pistoletem w ręku", ru: "с пистолетом в руке" }
formExamplesSkip:
