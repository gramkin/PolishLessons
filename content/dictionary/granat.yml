notes:
  - { kind: false-friend, text: "GRANAT — ловушка: это и «граната» (мужского рода!), и «гранат» — фрукт и камень, и «тёмно-синий цвет». GRANATOWY — «тёмно-синий», а не «гранатовый»: GRANATOWY GARNITUR, «тёмно-синий костюм». Гранатовый цвет — BORDOWY." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Граната по-польски мужского рода: TEN GRANAT. В местном T переходит в C: W GRANACIE." }
  - { kind: government, text: "Бросить гранату — RZUCIĆ GRANAT, винительный. Сок из граната — SOK Z GRANATU, родительный. Кольцо с гранатом — PIERŚCIONEK Z GRANATEM, творительный." }
  - { kind: pronunciation, text: "Читается «гра́нат», ударение на первом слоге. В GRANACIE — «грана́це»: CI — мягкое «ць»." }
collocations:
