etymology: "Из латинского GRANATUM «зернистый плод», от GRANUM «зерно». Граната получила имя по сходству с плодом, полным зёрен. Тёмно-синее значение развилось в польском отдельно."
memory: "Granat — граната (мужского рода), гранат-фрукт и тёмно-синий. Granatowy — тёмно-синий, не гранатовый! Читается «гра́нат»."
