etymology: "Приставка U- плюс корень *god-, означавший в праславянском то, что подходит, годится, приходится вовремя. От него пошло всё большое гнездо, одинаковое в двух языках: ZGODA и «согласие», POGODA и «погода» — то есть подходящее состояние неба, — WYGODA и «выгода», GODZINA и «година», GODNY и «годный», а в русском ещё и «год», который был сначала подходящим сроком. UGODA — это то, на чём стороны сошлись, то, что обоим подошло. Русское «угода» пошло по другой ветви: угодить значит сделать приятное другому, и слово ушло к угождению, оставшись лишь в застывшем обороте «в угоду»."
memory: "Корень тот же, что в русской «угоде», но значение иное: ugoda это мировое соглашение, которым кончают спор, а русское слово осталось в обороте «в угоду». Общее гнездо огромно и совпадает почти слово в слово: zgoda и согласие, pogoda и погода, wygoda и выгода, godzina и година, godny и годный. Падежи: ugodzie с меной d→dzi, родительный множественного ugód с o→ó, звучит «угут»."
