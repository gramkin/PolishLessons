notes:
  - { kind: false-friend, text: "Русское «угода» живёт только в обороте «в угоду кому-то» и значит угождение, уступку чужой воле. Польская UGODA — это соглашение, которым спорящие кончают спор, прежде всего мировое соглашение в суде. Общего между ними ровно столько, сколько в корне: оба слова от праславянского *god-, идеи того, что подходит и годится. Отсюда целое гнездо, в котором русский и польский совпадают почти слово в слово: ZGODA и «согласие», POGODA и «погода», WYGODA и «выгода», GODZINA и «година», GODNY и «годный». Зная это гнездо, можно разобрать половину слов на -GOD- без словаря." }
  - { kind: usage, text: "Десять форм, женский род. Дательный и местный единственного — UGODZIE, где конечное D основы переходит в DZI перед окончанием -E: та же мена, что в POSADZIE и WADZIE. Родительный множественного — UGÓD, с удлинением O в Ó перед нулевым окончанием, рядом с WDÓW, DÓB и KOMÓR. Глаголы при слове устойчивы: ZAWRZEĆ UGODĘ «заключить соглашение», PÓJŚĆ NA UGODĘ «пойти на мировую», DOJŚĆ DO UGODY в родительном. Прилагательное UGODOWY значит «склонный к компромиссу»." }
  - { kind: pronunciation, text: "Читается «уго́да», три слога, ударение на втором — как и в русском обороте «в угоду». Все согласные твёрдые. В форме UGODZIE сочетание DZI даёт мягкое «дзи»: «уго́дзе». В форме UGODĄ последнее Ą звучит «он»: «уго́дон». В форме UGODĘ конечное Ę даёт чистое «э». В форме UGÓD буква Ó читается как «у», а конечное D оглушается в «т», и слово звучит «угут», с ударением на первом слоге." }
  - { kind: register, text: "Слово юридическое, но вполне обиходное: о мировом соглашении в Польше говорят часто, и суды к нему склоняют. Устойчивые сочетания: UGODA SĄDOWA «судебное мировое соглашение», UGODA POZASĄDOWA «внесудебное соглашение», ZAWRZEĆ UGODĘ, PÓJŚĆ NA UGODĘ. В бытовой речи слово значит примирение между людьми: DOSZŁO MIĘDZY NIMI DO UGODY. Производное UGODOWY о человеке означает уступчивого, готового к компромиссу, и оттенок у него скорее одобрительный." }
