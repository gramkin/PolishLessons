# review
id: wtracic
format: 2
lemma: "wtrącić"
rank: 2119
pos: verb
aspect: perf
pron: { cyr: "фтро́нциць" }
senses:
  - id: interject
    ru: "вставить (слово), вмешаться в разговор"
    examples:
      - pl: "Zawsze chcesz wtrącić swoje trzy grosze."
        ru: "Ты всегда хочешь вставить свои три гроша."
        source: { kind: translated, id: 4134025 }
      - pl: "Mary wtrąciła się do naszej rozmowy."
        ru: "Мэри вмешалась в наш разговор."
        source: { kind: translated, id: 696464 }
      - pl: "Wtrąciła kilka słów po angielsku."
        ru: "Она вставила несколько слов по-английски."
        source: { kind: authored }
  - id: interjection
    ru: "вставка, междометие (существительное wtrącenie)"
    examples:
      - pl: "Ten autor lubi wtrącenia."
        ru: "Этот автор любит вставки."
        source: { kind: translated, id: 929380 }
      - pl: "\"Ach!\" to wtrącenie."
        ru: "«Ах!» — это междометие."
        source: { kind: translated, id: 10545333 }
notes:
  - { kind: usage, text: "Устойчивый оборот wtrącić swoje trzy grosze «вставить свои три гроша» — русское «вставить свои пять копеек», только монеты другие." }
  - { kind: government, text: "Вмешаться во что-л. — się plus do с родительным: wtrącić się do rozmowy «вмешаться в разговор»." }
  - { kind: usage, text: "Несовершенный вид — wtrącać. Существительное wtrącenie значит и «вставку», и «междометие»." }
  - { kind: false-friend, text: "Корень trącić «толкнуть, задеть» — ср. русское «трогать». Приставка w- означает «внутрь»." }
  - { kind: usage, text: "У глагола есть и значение «бросить кого-л. в тюрьму» — wtrącić kogoś do więzienia, — но эта карточка его не разбирает; здесь wtrącić всегда о слове или реплике." }
collocations:
  - { pl: "wtrącić swoje trzy grosze", ru: "вставить свои пять копеек" }
  - { pl: "wtrącić się do rozmowy", ru: "вмешаться в разговор" }
etymology: "w- + trącić «толкнуть, задеть»; ср. русское «трогать», «втолкнуть»."
memory: "wtrącić — «вставить слово, вмешаться». Запомните wtrącić swoje trzy grosze: по-русски это «вставить свои пять копеек». Несовершенный вид — wtrącać."
idioms:
  - { pl: "wtrącić swoje trzy grosze", ru: "вставить свои пять копеек" }
formExamplesSkip:
