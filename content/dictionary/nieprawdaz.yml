# review
id: nieprawdaz
format: 2
lemma: "nieprawdaż"
rank: 1758
pos: part
pron: { cyr: "непра́вдаш" }
senses:
  - id: tag
    ru: "не правда ли?, не так ли?"
    examples:
      - pl: "Ten kwiat jest piękny, nieprawdaż?"
        ru: "Этот цветок красив, не правда ли?"
        source: { kind: tatoeba, id: 623120 }
      - pl: "Wielki, nieprawdaż?"
        ru: "Огромный, не правда ли?"
        source: { kind: translated, id: 569829 }
      - pl: "Wspaniała pogoda, nieprawdaż?"
        ru: "Прекрасная погода, не правда ли?"
        source: { kind: translated, id: 568119 }
  - id: confirm
    ru: "верно?, да? (в конце фразы)"
    examples:
      - pl: "Wygodne, nieprawdaż?"
        ru: "Удобно, не правда ли?"
        source: { kind: translated, id: 1259280 }
      - pl: "Przegrałeś, nieprawdaż?"
        ru: "Ты проиграл, не так ли?"
        source: { kind: translated, id: 1593460 }
      - pl: "Święta niedługo, nieprawdaż?"
        ru: "Скоро праздники, не правда ли?"
        source: { kind: translated, id: 558282 }
notes:
  - { kind: usage, text: "Стоит только в конце фразы и приглашает собеседника согласиться, как русское «не правда ли?»." }
  - { kind: register, text: "Слово книжное и слегка старомодное. В обычной речи скажут prawda? или просто nie?: Ładnie tu, prawda?" }
  - { kind: usage, text: "Форма одна, слово не склоняется и не спрягается." }
  - { kind: false-friend, text: "Не путайте с nieprawda «неправда»: nieprawdaż — это вопрос-подтверждение, а nieprawda — отрицание сказанного." }
collocations:
  - { pl: "wspaniale, nieprawdaż", ru: "прекрасно, не правда ли" }
  - { pl: "prawda?", ru: "правда?" }
  - { pl: "no nie?", ru: "ну не так ли?" }
family:
  - { pl: "nieprawda", ru: "неправда", relation: root }
  - { pl: "prawda", ru: "правда", relation: root }
etymology: "Сложение nieprawda «неправда» и усилительной частицы -ż. Русское «не правда ли?» построено ровно так же, только раздельно."
memory: "nieprawdaż — «не правда ли?», книжный вопрос-подтверждение в конце фразы. В живой речи то же самое скажут коротко: prawda? или nie?"
