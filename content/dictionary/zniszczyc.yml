# review
id: zniszczyc
format: 2
lemma: "zniszczyć"
rank: 434
pos: verb
aspect: perf
pron: { cyr: "зни́шчыць" }
senses:
  - id: destroy
    ru: "уничтожить, разрушить"
    examples:
      - pl: "Salwa z dział doszczętnie zniszczyła zabudowania."
        ru: "Залп артиллерии полностью разрушил постройки."
        source: { kind: tatoeba, id: 3744780 }
      - pl: "Woda zniszczyła całe miasto."
        ru: "Вода разрушила весь город."
        source: { kind: translated, id: 6156055 }
      - pl: "To zniszczy uprawę."
        ru: "Это погубит урожай."
        source: { kind: translated, id: 789031 }
  - id: ruin
    ru: "испортить, сломать, погубить"
    examples:
      - pl: "Dlaczego ona zniszczyła moją konsolę do gier?"
        ru: "Зачем она сломала мою игровую консоль?"
        source: { kind: tatoeba, id: 2278799 }
      - pl: "Ktoś zniszczył mój aparat."
        ru: "Кто-то сломал мой фотоаппарат."
        source: { kind: translated, id: 3936221 }
      - pl: "Picie go zniszczyło."
        ru: "Пьянство его погубило."
        source: { kind: translated, id: 864111 }
notes:
  - { kind: usage, text: "Несовершенный вид — niszczyć: zniszczyć значит «уничтожить совсем», а niszczyć — «разрушать, портить постепенно»." }
  - { kind: false-friend, text: "Причастие zniszczony значит не только «уничтоженный», но и просто «потрёпанный, изношенный»: zniszczony dywan «вытертый ковёр»." }
  - { kind: usage, text: "Существительное zniszczenie — «разрушение, уничтожение»: zniszczenie środowiska «разрушение окружающей среды»." }
  - { kind: usage, text: "Внутри слова nic «ничто»: niszczyć буквально «обращать в ничто». Русское «уничтожить» собрано точно так же." }
collocations:
  - { pl: "zniszczyć doszczętnie", ru: "уничтожить дотла" }
  - { pl: "zniszczony dywan", ru: "потёртый ковёр" }
  - { pl: "zniszczenie środowiska", ru: "разрушение окружающей среды" }
etymology: "Из z- + niszczyć, от nic «ничто»: буквально «обратить в ничто». Русское «уничтожить» собрано ровно тем же способом."
memory: "zniszczyć — «уничтожить», и логика та же, что в русском: внутри nic «ничто». Но причастие zniszczony шире нашего: оно значит и «уничтоженный», и просто «потрёпанный» — zniszczony dywan."
idioms:
  - { pl: "zniszczyć doszczętnie", ru: "уничтожить дотла" }
  - { pl: "zniszczenie środowiska", ru: "разрушение окружающей среды" }
  - { pl: "zniszczony dywan", ru: "потёртый ковёр" }
