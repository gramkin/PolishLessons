# review
id: zaczac
format: 2
lemma: "zacząć"
rank: 165
pos: verb
aspect: perf
pron: { cyr: "за́чонць" }
senses:
  - id: begin
    ru: "начать (делать что-либо)"
    note: "После zacząć идёт инфинитив несовершенного вида: zacząć czytać «начать читать»."
    examples:
      - pl: "Zaczął płakać."
        ru: "Он начал плакать."
        source: { kind: tatoeba, id: 1348383 }
      - pl: "Dopiero zacząłem."
        ru: "Я только что начал."
        source: { kind: tatoeba, id: 1532685 }
      - pl: "Zacznij stąd."
        ru: "Начни отсюда."
        source: { kind: tatoeba, id: 6313997 }
  - id: start
    ru: "начаться (о явлении); начнём!"
    examples:
      - pl: "Zaczęło padać."
        ru: "Начался дождь."
        source: { kind: tatoeba, id: 2247063 }
      - pl: "Zaczęło śnieżyć."
        ru: "Пошёл снег."
        source: { kind: tatoeba, id: 12449372 }
      - pl: "Zacznijmy!"
        ru: "Начнём!"
        source: { kind: tatoeba, id: 3743730 }
notes:
  - { kind: usage, text: "Несовершенный вид — zaczynać: Zaczynam rozumieć «Начинаю понимать» — Zacząłem rozumieć «Я начал понимать»." }
  - { kind: usage, text: "«Начаться» — zacząć się: Film zaczyna się o ósmej «Фильм начинается в восемь»." }
  - { kind: usage, text: "Существительное к этому глаголу — początek «начало», а не «zaczęcie»: od początku «сначала»." }
collocations:
  - { pl: "zacząć od początku", ru: "начать сначала" }
  - { pl: "zacząć pracę", ru: "начать работу" }
  - { pl: "zacząć się", ru: "начаться" }
  - { pl: "zacznijmy!", ru: "начнём!" }
etymology: "Приставка za- + cząć (праславянское *čęti); тот же корень, что в русском «начать, зачать» — ср. początek «начало»."
memory: "zacząć — совершенный вид, zaczynać — несовершенный. После него инфинитив только несовершенного вида: zacząć czytać. А «начаться» — zacząć się."
idioms:
  - { pl: "zacząć od zera", ru: "начать с нуля" }
  - { pl: "zacząć od początku", ru: "начать сначала" }
  - { pl: "niech się zacznie", ru: "пусть начнётся" }
formExamplesSkip:
  - { form: "zaczęci", reason: "страдательное причастие мужского лица от этого глагола не употребляется" }
  - { form: "zaczęcia", reason: "отглагольное существительное не употребляется: говорят początek или rozpoczęcie" }
  - { form: "zaczęcie", reason: "отглагольное существительное не употребляется: говорят początek или rozpoczęcie" }
  - { form: "zaczęciem", reason: "отглагольное существительное не употребляется: говорят początek или rozpoczęcie" }
  - { form: "zaczęciu", reason: "отглагольное существительное не употребляется: говорят początek или rozpoczęcie" }
