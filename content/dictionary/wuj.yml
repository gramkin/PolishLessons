notes:
  - { kind: usage, text: "Польский различает то, что русский давно свёл в одно слово. WUJ — это брат матери, а брат отца называется STRYJ. Русское «дядя» покрывает обоих, и выбрать нужное слово по-русски невозможно, приходится знать родство. В живой речи различие стирается, и уменьшительное WUJEK годится для любого дяди, но в текстах и в деревне оно держится." }
  - { kind: pronunciation, text: "Именительный множественного — WUJOWIE, с окончанием -owie. Оно ставится у мужских личных существительных, к которым относятся с уважением: syn — synowie, pan — panowie, profesor — profesorowie. Русскому языку такого противопоставления не нужно вовсе. Рядом существует ещё пренебрежительная форма WUJE, которую словари помечают как уничижительную: эта категория в русском отсутствует полностью." }
  - { kind: usage, text: "Существительное одушевлённое, поэтому винительный совпадает с родительным: widzę WUJA, не «widzę wuj». Та же пара форм, что у królika из прошлой подборки, и то же правило: живое существо берёт -a в обоих падежах." }
collocations:
  - { pl: "wuj ze strony matki", ru: "дядя со стороны матери" }
  - { pl: "u wuja", ru: "у дяди" }
  - { pl: "ciotka i wuj", ru: "тётя и дядя" }
family:
  - { pl: "wujek", ru: "дядя, дядюшка", relation: derived }
  - { pl: "wujenka", ru: "жена дяди", relation: derived }
  - { pl: "wujostwo", ru: "дядя с тётей", relation: derived }
etymology: "Из праславянского *ujь «брат матери», с приставным w- в начале. В древнерусском это слово тоже было — «уй», «вуй», — но его вытеснило «дядя», и сегодня оно осталось только в словарях старины. Корень очень древний и родственен латинскому avunculus, от которого пошло французское oncle и английское uncle."
memory: "WUJ — брат матери, STRYJ — брат отца; русское «дядя» не различает. Множественное почтительное: wujowie, как synowie."
idioms:
