  - { pl: "przywieźć", ru: "привезти", relation: root, id: przywiezc }
etymology: "Приставка od- «от» и WIEŹĆ, из праславянского *vezti — то же слово, что русское «везти», и с тем же чередованием в основе. Корень дал в обоих языках целое хозяйство: польские WÓZ «телега, машина», WOZIĆ «возить», PRZEWÓZ «перевоз», и русские «воз», «возить», «перевозка». Приставка od- работает как русская «от-»: уводит от нынешнего места и чаще всего возвращает к исходному, откуда и главное значение — отвезти кого-то домой, то есть туда, где ему место."
memory: "nieść/wieźć ложатся на «нести/везти» без зазора: odnieść — отнести пешком, odwieźć — отвезти на колёсах. И приставки свои: przywieźć «привезти», wywieźć «вывезти»."
idioms:
  - { pl: "odwieźć do domu", ru: "отвезти домой, доставить до дверей" }
  - { pl: "odwieźć na dworzec", ru: "отвезти на вокзал, проводить до поезда" }
