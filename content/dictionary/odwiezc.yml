# review
id: odwiezc
format: 2
lemma: "odwieźć"
rank: 2967
pos: verb
pron: { cyr: "о́двезьць" }
senses:
  - id: drive-someone
    ru: "отвезти (кого-л. куда-л.)"
    examples:
      - pl: "Odwiozę cię do domu."
        ru: "Я отвезу тебя домой."
        source: { kind: authored }
      - pl: "Odwiózł dzieci do szkoły i pojechał do pracy."
        ru: "Он отвёз детей в школу и поехал на работу."
        source: { kind: authored }
      - pl: "Odwieźli chorego do szpitala."
        ru: "Они отвезли больного в больницу."
        source: { kind: authored }
  - id: deliver-thing
    ru: "отвезти, доставить (что-л.)"
    examples:
      - pl: "Odwieź te paczki na pocztę."
        ru: "Отвези эти посылки на почту."
        source: { kind: authored }
      - pl: "Meble odwieziono do magazynu."
        ru: "Мебель отвезли на склад."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Польский делит перевозку на два глагола точно так же, как русский. NIEŚĆ — «нести», на себе, руками; WIEŹĆ — «везти», на чём-то, на колёсах или верхом. Значит ODNIEŚĆ KSIĄŻKĘ — отнести книгу пешком, а ODWIEŹĆ KSIĄŻKĘ — отвезти её машиной. Русскому тут не надо ничего запоминать заново: пара nieść/wieźć ложится на «нести/везти» без зазора, включая переносное POJAZD WIEZIE и «машина везёт». Ошибаются обычно в другую сторону — по-английски обоим отвечает carry, и выученное через английский мешает." }
  - { kind: pronunciation, text: "Основа играет тремя огласовками, как у PONIEŚĆ из предыдущей партии, и по тем же правилам: -ie- перед мягким (ODWIEZIESZ, ODWIEZIE, ODWIEŹLI), -io- перед твёрдым (ODWIOZĘ, ODWIOZĄ, ODWIOZŁA), -ió- в закрытом слоге перед Ł (ODWIÓZŁ). Ударение на предпоследнем слоге, а в двуслоговом ODWIEŹĆ это первый: О́ДВЕЗЬЦЬ. Сочетание ŹĆ читается «зьць», одним мягким движением, без гласной между." }
  - { kind: government, text: "Кого или что — винительный; куда — DO с родительным (DO DOMU, DO SZPITALA, DO MAGAZYNU) или NA с винительным (NA POCZTĘ, NA DWORZEC, NA LOTNISKO). Выбор предлога тот же, что у остальных глаголов движения, и запоминается вместе с ними. Чем — предлог z или вовсе без него: ODWIEŹĆ SAMOCHODEM, но чаще способ не называют, он уже в самом глаголе." }
  - { kind: usage, text: "Приставки у корня WIEŹĆ те же, что у русского «везти», и смысл делят так же: PRZYWIEŹĆ «привезти», WYWIEŹĆ «вывезти», ZAWIEŹĆ «завезти, отвезти», DOWIEŹĆ «довезти», PRZEWIEŹĆ «перевезти», ODWIEŹĆ «отвезти». Между ZAWIEŹĆ и ODWIEŹĆ разница тонкая: ODWIEŹĆ предполагает возвращение туда, откуда взяли, или доставку домой — ODWIEŹĆ KOGOŚ DO DOMU, — а ZAWIEŹĆ просто доставляет в новое место." }
  - { kind: usage, text: "Мужской род прошедшего времени — ODWIÓZŁ, с ó в закрытом слоге. Основа odwiozł- без ó живёт только в связке с окончанием, ODWIOZŁEM, ODWIOZŁEŚ, где слог открывается; отдельно такой формы нет. В условном наклонении мужского рода ó остаётся: ODWIÓZŁBY, ODWIÓZŁBYM, ODWIÓZŁBYŚ. Деепричастие здесь ODWIÓZŁSZY, с -SZY после согласного." }
collocations:
  - { pl: "odwieźć do domu", ru: "отвезти домой" }
  - { pl: "odwieźć do szpitala", ru: "отвезти в больницу" }
