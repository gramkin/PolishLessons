etymology: "Из приставки W- и корня *lǫčiti «соединять», того же, что в русском «лучить» в старом значении соединять, и в «разлучить», «случай», «получить». Польский сохранил глагол ŁĄCZYĆ как основное слово для соединения, а русский простой глагол утратил и держит корень только под приставками, где смысл уже затемнён: «разлучить» это разъединить, «случиться» — сойтись вместе. Поэтому для русскоязычного ŁĄCZYĆ выглядит незнакомым, хотя корень общий. Образ включения у двух языков разный: польское WŁĄCZAĆ значит «подсоединить внутрь», а русское «включать» идёт от «ключа» и «заключать», то есть от запирания. Отсюда и курьёз с названием прибора: польский WŁĄCZNIK назван по включению, русский «выключатель» — по выключению, хотя это одна и та же кнопка."
memory: "Корень łącz- = «соединять» (русский тот же корень держит только в «разлучить», «случиться»). Поэтому włączać буквально «присоединять внутрь», а не «заключать», как русское «включать» от «ключа». Гнездо: łącze «линия», połączenie «соединение» и «звонок», wyłączać «выключать», włącznik «выключатель» — назван по включению, в отличие от русского. Управление: włączać coś (винительный), но włączać DO czegoś с родительным, тогда как русский говорит «включать в список». Звук: ł это «у», поэтому «вуо́нчаць»."
