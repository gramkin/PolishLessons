notes:
  - { kind: false-friend, text: "Корень тут ŁĄCZ-, от ŁĄCZYĆ «соединять», и буквально WŁĄCZAĆ значит «присоединять, подключать внутрь». Русское «включать» построено от «ключа», от «заключать», то есть образ совсем другой: русский запирает, поляк соединяет. Поэтому всё гнездо в польском держится на соединении: ŁĄCZE «канал, линия», POŁĄCZENIE «соединение», а в разговоре о телефоне — «звонок, связь», ŁĄCZNIK «связной; дефис», WYŁĄCZAĆ «выключать», то есть «отсоединять». Ловушка в похожести на другое русское слово: WŁĄCZYĆ не значит «вложить», вложить это WŁOŻYĆ, от ŁOŻYĆ. Два похожих на слух глагола, два разных корня." }
  - { kind: usage, text: "Несовершенный вид, переходный, шестьдесят три формы: сорок две от глагола, десять от действительного причастия WŁĄCZAJĄCY, одиннадцать от страдательного WŁĄCZANY. Совершенная пара — WŁĄCZYĆ, и основа меняется: WŁĄCZA- в несовершенном, WŁĄCZY- в совершенном. Возвратное WŁĄCZAĆ SIĘ значит «включаться, вмешиваться»: WŁĄCZYĆ SIĘ DO ROZMOWY «вступить в разговор», а о приборе — «включаться сам». Антоним — WYŁĄCZAĆ, и приставки здесь работают прозрачно: W- внутрь, WY- наружу. Существительное WŁĄCZNIK значит «выключатель», хотя по-русски это звучит наоборот: по-польски прибор назван по включению, по-русски по выключению." }
  - { kind: government, text: "Переходный: включать что — винительный без предлога, WŁĄCZAĆ ŚWIATŁO, RADIO, SILNIK. Включать куда — предлог DO с родительным: WŁĄCZAĆ DO PORZĄDKU OBRAD, DO ZESPOŁU, DO LISTY, тогда как русский говорит «включать В список» с винительным, и это расхождение стоит запомнить. Отрицание требует родительного: NIE WŁĄCZAM RADIA. Возвратное WŁĄCZAĆ SIĘ управляет предлогом DO с родительным в значении «вступать»: WŁĄCZAĆ SIĘ DO DYSKUSJI, и предлогом W с винительным в выражении WŁĄCZAĆ SIĘ W RUCH «вливаться в поток машин»." }
  - { kind: pronunciation, text: "Читается «вуо́нчаць», ударение на первом слоге. Буква Ł это «у» неслоговое, поэтому WŁĄ звучит «вуон», а не «вля»: это та же ловушка, что в WPŁYWAĆ и ŁADNY. Носовое Ą перед CZ даёт «он». Буквосочетание CZ — твёрдое «ч». Конечное Ć — мягкое «ць». В совершенном виде WŁĄCZYĆ вместо A стоит Y: «вуо́нчыць», и этим два вида различаются на слух. В существительном WŁĄCZNIK ударение на первом слоге: «вуо́нчник»." }
