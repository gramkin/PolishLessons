etymology: "Через немецкое Signal и французское signal из латинского signum «знак». Русский «сигнал» — то же заимствование."
memory: "sygnał — «сигнал», мужской род. Помните про ł: sygnał, но sygnału, sygnale. Brak sygnału «нет сигнала», а jechać na sygnale значит «ехать с сиреной»."
idioms:
  - { pl: "brak sygnału", ru: "нет сигнала" }
  - { pl: "jechać na sygnale", ru: "ехать с сиреной" }
