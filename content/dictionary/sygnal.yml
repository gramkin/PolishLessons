# review
id: sygnal
format: 2
lemma: "sygnał"
rank: 1083
pos: noun
pron: { cyr: "сы́гнау" }
senses:
  - id: sign
    ru: "сигнал, знак"
    examples:
      - pl: "Proszę o sygnał."
        ru: "Дайте сигнал, пожалуйста."
        source: { kind: translated, id: 818761 }
      - pl: "Daj nam zaraz sygnał do wymarszu."
        ru: "Дай нам сейчас же сигнал к выходу."
        source: { kind: translated, id: 368843 }
      - pl: "Brak sygnału."
        ru: "Нет сигнала."
        source: { kind: translated, id: 12680271 }
  - id: sound
    ru: "сигнал (звуковой)"
    examples:
      - pl: "Po sygnale zostaw wiadomość."
        ru: "После сигнала оставьте сообщение."
        source: { kind: translated, id: 840312 }
      - pl: "Zostaw wiadomość po sygnale."
        ru: "Оставьте сообщение после сигнала."
        source: { kind: translated, id: 2679944 }
  - id: indication
    ru: "сигнал, признак, знак чего-то"
    examples:
      - pl: "Zmysły to właściwie tylko sygnały chemiczne przetwarzane przez mózg."
        ru: "Чувства на самом деле являются просто химическими сигналами, обрабатываемыми мозгом."
        source: { kind: tatoeba, id: 6327892 }
      - pl: "Dostajemy sprzeczne sygnały."
        ru: "Мы получаем противоречивые сигналы."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Мужской род. Следите за ł: именительный sygnał, но дальше sygnału, sygnale, sygnały." }
  - { kind: usage, text: "brak sygnału «нет сигнала» — о связи; po sygnale «после сигнала» — на автоответчике." }
  - { kind: usage, text: "jechać na sygnale значит «ехать с сиреной и мигалкой» — о скорой помощи или полиции." }
  - { kind: usage, text: "Переносно — «весточка, знак»: Nie ma od niego sygnału «От него нет вестей»." }
collocations:
  - { pl: "brak sygnału", ru: "нет сигнала" }
  - { pl: "po sygnale", ru: "после сигнала" }
  - { pl: "dać sygnał", ru: "дать сигнал" }
  - { pl: "sygnał alarmowy", ru: "сигнал тревоги" }
family:
  - { pl: "sygnalizacja", ru: "сигнализация", relation: derived }
