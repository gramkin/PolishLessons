etymology: "От PRAWNIK «юрист», от PRAWO «право». Корень PRAW- тот же, что в русском «право», «правый», «править»."
memory: "Prawniczy — юридический, о юристах: studia prawnicze, kancelaria prawnicza. О праве — prawny: osoba prawna. От prawnik — юрист. Читается «правни́чы»."
