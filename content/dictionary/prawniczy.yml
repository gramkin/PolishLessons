# review
id: prawniczy
format: 2
lemma: "prawniczy"
rank: 5094
pos: adj
pron: { cyr: "правни́чы" }
senses:
  - id: legal
    ru: "юридический (относящийся к юристам и праву как профессии)"
    examples:
      - pl: "Skończył studia prawnicze."
        ru: "Он окончил юридический факультет."
        source: { kind: authored }
      - pl: "Pracuje w kancelarii prawniczej."
        ru: "Он работает в юридической фирме."
        source: { kind: authored }
      - pl: "Ten tekst jest napisany prawniczym językiem."
        ru: "Этот текст написан юридическим языком."
        source: { kind: authored }
  - id: lawyerly
    ru: "юридический, крючкотворский (о стиле, мышлении)"
    examples:
      - pl: "Unikaj prawniczego żargonu."
        ru: "Избегай юридического жаргона."
        source: { kind: authored }
      - pl: "Ma typowo prawniczy umysł."
        ru: "У него типично юридический склад ума."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Русскому «юридический» соответствуют два слова. PRAWNY — о самом праве: PODSTAWA PRAWNA, «правовая основа», OSOBA PRAWNA, «юридическое лицо». PRAWNICZY — о юристах и их профессии: STUDIA PRAWNICZE, KANCELARIA PRAWNICZA, JĘZYK PRAWNICZY. Юридическая консультация — PORADA PRAWNA, а не PRAWNICZA." }
  - { kind: usage, text: "Десять форм без степеней: форма для мужчин-людей совпадает с мужским единственным, PRAWNICZY. О людях её почти не употребляют. От PRAWNIK, «юрист»; К перед -CZY переходит в CZ, как в RĘKA и RĘCZNY." }
  - { kind: government, text: "Факультет — WYDZIAŁ PRAWA, без прилагательного. Обычно ставится после существительного, как термин: JĘZYK PRAWNICZY, ZAWÓD PRAWNICZY. Перед ним — в оценочном смысле: PRAWNICZE KRUCZKI, «юридические уловки»." }
  - { kind: pronunciation, text: "Читается «правни́чы», три слога, ударение на предпоследнем. CZ твёрдое, как русское «ч» перед «ы»: «чы», не «чи». W перед N звучит как «в»." }
  - { kind: register, text: "Нейтральное слово, частое в профессиональной речи и в объявлениях: APLIKACJA PRAWNICZA — стажировка юриста. JĘZYK PRAWNICZY с оттенком иронии — «канцелярит юристов»." }
collocations:
  - { pl: "studia prawnicze", ru: "юридическое образование" }
  - { pl: "kancelaria prawnicza", ru: "юридическая фирма" }
  - { pl: "język prawniczy", ru: "юридический язык" }
family:
  - { pl: "prawnik", ru: "юрист", relation: root, id: prawnik }
