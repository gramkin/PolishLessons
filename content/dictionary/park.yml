senses:
  - id: park
    ru: "парк"
    examples:
      - pl: "W śródmieściu jest park."
        ru: "В центре города есть парк."
        source: { kind: translated, id: 817237 }
      - pl: "Za naszym domem jest park."
        ru: "За нашим домом парк."
        source: { kind: translated, id: 2733989 }
