  - id: in-park
    ru: "w parku — в парке"
    examples:
      - pl: "Co robisz w tym parku?"
        ru: "Что ты делаешь в этом парке?"
        source: { kind: translated, id: 2970759 }
      - pl: "Czy w tym parku jest zoo?"
        ru: "В этом парке есть зоопарк?"
        source: { kind: translated, id: 6313070 }
      - pl: "W parku gęsto rosną drzewa."
        ru: "В парке густо растут деревья."
        source: { kind: translated, id: 527550 }
  - id: to-park
    ru: "do parku — в парк"
    examples:
      - pl: "Idę do parku."
        ru: "Я иду в парк."
        source: { kind: translated, id: 365163 }
      - pl: "Poszła na spacer do parku."
        ru: "Она пошла в парк на прогулку."
        source: { kind: translated, id: 2205260 }
      - pl: "Idę przez park."
        ru: "Я иду через парк."
        source: { kind: translated, id: 4699654 }
notes:
  - { kind: government, text: "Направление — do parku с родительным: idę do parku «иду в парк». Место — w parku с предложным: jestem w parku. Русский в обоих случаях берёт «в», польский различает предлоги." }
  - { kind: usage, text: "Слово заимствовано, как и русское «парк», и значение совпадает полностью — ловушки здесь нет." }
  - { kind: usage, text: "park narodowy «национальный парк», park maszynowy «машинный парк». Второе значение, «совокупность техники», тоже совпадает с русским." }
  - { kind: usage, text: "Разговорное park sztywnych — «кладбище», буквально «парк застывших». Шутливое и грубоватое." }
collocations:
  - { pl: "iść do parku", ru: "идти в парк" }
  - { pl: "w parku", ru: "в парке" }
  - { pl: "park narodowy", ru: "национальный парк" }
  - { pl: "spacer po parku", ru: "прогулка по парку" }
family:
  - { pl: "parkowy", ru: "парковый", relation: derived }
  - { pl: "parking", ru: "парковка", relation: derived }
etymology: "Заимствование через немецкий из английского park, тем же путём, что и русское «парк». Значение совпадает полностью."
memory: "park — «парк», без подвохов. Следите только за предлогами: idę DO parku «иду в парк» с родительным, но jestem W parku «я в парке» с предложным."
idioms:
  - { pl: "iść do parku", ru: "идти в парк" }
  - { pl: "park narodowy", ru: "национальный парк" }
  - { pl: "spacer po parku", ru: "прогулка по парку" }
