# review
id: zepsuc
format: 2
lemma: "zepsuć"
rank: 1787
pos: verb
aspect: perf
pron: { cyr: "зэ́псуць" }
senses:
  - id: break
    ru: "сломать, испортить"
    examples:
      - pl: "Tom zepsuł okno."
        ru: "Том разбил окно."
        source: { kind: tatoeba, id: 569973 }
      - pl: "Kto to zepsuł?"
        ru: "Кто это сломал?"
        source: { kind: translated, id: 6534012 }
      - pl: "Zepsułeś pralkę."
        ru: "Ты сломал стиральную машину."
        source: { kind: translated, id: 4111486 }
  - id: break-down
    ru: "zepsuć się — сломаться, испортиться"
    examples:
      - pl: "Komputer się zepsuł."
        ru: "Компьютер сломался."
        source: { kind: translated, id: 5932983 }
      - pl: "Mleko się zepsuło."
        ru: "Молоко испортилось."
        source: { kind: translated, id: 359904 }
      - pl: "Auto się zepsuło."
        ru: "Машина сломалась."
        source: { kind: translated, id: 8765438 }
notes:
  - { kind: usage, text: "Совершенный вид; несовершенный — psuć. Возвратное zepsuć się значит «сломаться» само собой: telewizor się zepsuł." }
  - { kind: usage, text: "Про еду zepsuć się значит «испортиться, протухнуть»: mleko się zepsuło «молоко испортилось»." }
  - { kind: usage, text: "Причастие zepsuty — «сломанный, испорченный»: winda jest zepsuta «лифт не работает». Это самая частая форма в объявлениях." }
  - { kind: false-friend, text: "zepsuć komuś humor — «испортить кому-то настроение»; zepsuć zabawę — «испортить веселье», как и по-русски." }
collocations:
  - { pl: "zepsuć się", ru: "сломаться" }
  - { pl: "jest zepsuty", ru: "сломан" }
  - { pl: "zepsuć humor", ru: "испортить настроение" }
family:
  - { pl: "psuć", ru: "портить", relation: root }
  - { pl: "zepsuty", ru: "сломанный", relation: root }
  - { pl: "naprawić", ru: "починить", relation: root, id: naprawic }
etymology: "Приставка ze- плюс psuć «портить». Русское «портить» — слово другого корня, поэтому zepsuć и причастие zepsuty приходится запоминать отдельно."
memory: "zepsuć — «сломать, испортить», совершенный вид от psuć. Возвратное zepsuć się — «сломаться»: telewizor się zepsuł. Причастие zepsuty «сломанный»."
idioms:
  - { pl: "zepsuć się", ru: "сломаться" }
  - { pl: "zepsuć humor", ru: "испортить настроение" }
  - { pl: "jest zepsuty", ru: "сломан" }
