# review
id: narzeczony
format: 2
lemma: "narzeczony"
rank: 2002
pos: noun
pron: { cyr: "нажэчо́ны" }
senses:
  - id: fiance
    ru: "жених"
    examples:
      - pl: "To mój narzeczony."
        ru: "Это мой жених."
        source: { kind: translated, id: 8178713 }
      - pl: "Niech żyją narzeczony i narzeczona!"
        ru: "Да здравствуют жених и невеста!"
        source: { kind: translated, id: 12451345 }
      - pl: "Wyszłabym za mego narzeczonego, gdyby i on tego chciał."
        ru: "Я бы вышла за своего жениха, если бы и он этого хотел."
        source: { kind: translated, id: 735768 }
  - id: fiancee
    ru: "narzeczona — невеста"
    examples:
      - pl: "Moja narzeczona pojechała do Kanady."
        ru: "Моя невеста уехала в Канаду."
        source: { kind: translated, id: 989395 }
      - pl: "Dziewczyna w białym to jego narzeczona."
        ru: "Девушка в белом — его невеста."
        source: { kind: translated, id: 361217 }
      - pl: "Ken pocałował narzeczoną Toma."
        ru: "Кен поцеловал невесту Тома."
        source: { kind: translated, id: 6534289 }
notes:
  - { kind: usage, text: "Слово склоняется как прилагательное, но работает как существительное: mój narzeczony «мой жених», moja narzeczona «моя невеста». В словаре оно поэтому и помечено прилагательным." }
  - { kind: false-friend, text: "Это жених и невеста до свадьбы, в период помолвки. В день свадьбы они становятся pan młody и panna młoda — буквально «молодой господин» и «молодая барышня»." }
  - { kind: usage, text: "Множественное narzeczeni значит «жених и невеста, обручённые»." }
  - { kind: government, text: "Быть чьим-то женихом — być czyimś narzeczonym (творительный падеж)." }
collocations:
  - { pl: "mój narzeczony", ru: "мой жених" }
  - { pl: "moja narzeczona", ru: "моя невеста" }
  - { pl: "narzeczeni", ru: "жених и невеста" }
family:
  - { pl: "narzeczeństwo", ru: "помолвка", relation: root }
  - { pl: "ślub", ru: "свадьба", relation: root, id: slub }
  - { pl: "małżeństwo", ru: "брак", relation: root, id: malzenstwo }
etymology: "От narzec «наречь, назвать», приставка na- плюс rzec «сказать»: буквально «наречённый». Русское «наречённый» — то же слово, а «жених» построено от другого корня."
memory: "narzeczony — «жених», narzeczona — «невеста», до свадьбы. В день свадьбы они становятся pan młody и panna młoda. Склоняется как прилагательное."
idioms:
