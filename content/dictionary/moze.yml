# review
id: moze
format: 2
lemma: "może"
rank: 1642
pos: part
pron: { cyr: "мо́жэ" }
senses:
  - id: maybe
    ru: "может быть, возможно"
    examples:
      - pl: "Może później."
        ru: "Может быть, попозже."
        source: { kind: tatoeba, id: 2607628 }
      - pl: "Może innym razem."
        ru: "Может, в другой раз."
        source: { kind: tatoeba, id: 6109693 }
      - pl: "Może i masz rację."
        ru: "Возможно, ты и права."
        source: { kind: tatoeba, id: 1118408 }
  - id: suggestion
    ru: "может (предложение, совет)"
    examples:
      - pl: "Może wpadniesz do nas?"
        ru: "Может, заглянешь к нам?"
        source: { kind: translated, id: 351496 }
      - pl: "Może pójdziemy do kina?"
        ru: "Может, пойдём в кино?"
        source: { kind: authored }
  - id: uncertainty
    ru: "возможно (о вероятности)"
    examples:
      - pl: "On może przyjść jutro."
        ru: "Может, он придёт завтра."
        source: { kind: tatoeba, id: 2097220 }
      - pl: "Ona może znać odpowiedź."
        ru: "Возможно, что она знала ответ."
        source: { kind: tatoeba, id: 393296 }
notes:
  - { kind: false-friend, text: "Форма może совпадает с 3-м лицом единственного числа глагола móc «мочь»: On może przyjść — это и «он может прийти» (глагол), и «может, он придёт» (частица). Различают порядок слов и запятая: частица обычно стоит в начале и отделяется." }
  - { kind: usage, text: "Как частица może вводит предположение или предложение: Może później «может, попозже», Może pójdziemy? «может, пойдём?»." }
  - { kind: usage, text: "Сравните три слова: może «может быть» (предположение), chyba «пожалуй, наверное» (склоняется к утверждению), zapewne «наверное» (высокая вероятность)." }
  - { kind: usage, text: "Усиленный вариант — być może: Być może masz rację «Возможно, ты прав»." }
collocations:
  - { pl: "może być", ru: "может быть" }
  - { pl: "być może", ru: "возможно" }
  - { pl: "może później", ru: "может, попозже" }
etymology: "Застывшая форма 3-го лица глагола móc «мочь» — буквально «(оно) может». Русское «может быть» и разговорное «может» прошли ровно тот же путь: глагольная форма стала частицей."
memory: "może = «может быть», и это застывшая форма глагола móc, ровно как русское «может» из «может быть». Отсюда ловушка: On może przyjść — либо «он может прийти» (глагол), либо «может, он придёт» (частица). Усиленный вариант — być może."
idioms:
  - { pl: "być może", ru: "возможно" }
  - { pl: "może być", ru: "сойдёт, может быть" }
  - { pl: "a może", ru: "а может" }
