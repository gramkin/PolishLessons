# review
id: drzeworyt
format: 2
lemma: "drzeworyt"
rank: 5783
pos: noun
pron: { cyr: "джэво́рыт" }
senses:
  - id: technique
    ru: "гравюра на дереве, ксилография (техника)"
    examples:
      - pl: "Drzeworyt to jedna z najstarszych technik graficznych."
        ru: "Гравюра на дереве — одна из старейших графических техник."
        source: { kind: authored }
      - pl: "Studiowała drzeworyt na akademii sztuk pięknych."
        ru: "Она изучала ксилографию в академии изящных искусств."
        source: { kind: authored }
      - pl: "Japoński drzeworyt wpłynął na twórczość van Gogha."
        ru: "Японская гравюра на дереве повлияла на творчество Ван Гога."
        source: { kind: authored }
  - id: print
    ru: "гравюра на дереве (оттиск)"
    examples:
      - pl: "Na ścianie wisi stary drzeworyt."
        ru: "На стене висит старая гравюра."
        source: { kind: authored }
      - pl: "Muzeum kupiło cenny drzeworyt z szesnastego wieku."
        ru: "Музей купил ценную гравюру шестнадцатого века."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Мужской род, хотя русская «гравюра» женского: TEN DRZEWORYT. Неодушевлённое: винительный равен именительному. Родительный — DRZEWORYTU, в предложном T переходит в C: NA DRZEWORYCIE." }
  - { kind: false-friend, text: "Слово прозрачно делится: DRZEWO «дерево» + RYT «резьба, гравировка» (от RYĆ «рыть, резать»). Гравюра на меди — MIEDZIORYT, по тому же образцу. Общее слово для гравюры — RYCINA." }
  - { kind: pronunciation, text: "Читается «джэво́рыт»: DRZ звучит как «дж», ударение на предпоследнем слоге. Конечное T глухое и так." }
collocations:
  - { pl: "japoński drzeworyt", ru: "японская гравюра" }
  - { pl: "odbitka drzeworytu", ru: "оттиск гравюры" }
  - { pl: "ilustrowany drzeworytami", ru: "иллюстрированный гравюрами" }
family:
  - { pl: "drzewo", ru: "дерево", relation: root, id: drzewo }
  - { pl: "drzeworytnik", ru: "гравёр по дереву", relation: derived }
  - { pl: "miedzioryt", ru: "гравюра на меди", relation: root }
etymology: "Сложение DRZEWO «дерево» и RYT «резьба» от глагола RYĆ; калька с немецкого Holzstich."
memory: "Drzeworyt — «дерево» + «рыть»: картинка, вырезанная на доске. Drz читается «дж»."
idioms:
  - { pl: "drzeworyt sztorcowy", ru: "торцовая гравюра на дереве" }
