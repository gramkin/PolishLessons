# review
id: wystrzelic
format: 2
lemma: "wystrzelić"
rank: 3898
pos: verb
pron: { cyr: "выстшэ́лиць" }
senses:
  - id: fire
    ru: "выстрелить"
    examples:
      - pl: "Policjant wystrzelił w powietrze."
        ru: "Полицейский выстрелил в воздух."
        source: { kind: authored }
      - pl: "Ktoś wystrzelił z okna."
        ru: "Кто-то выстрелил из окна."
        source: { kind: authored }
      - pl: "Strzelec wystrzelił trzy razy."
        ru: "Стрелок выстрелил три раза."
        source: { kind: authored }
  - id: launch
    ru: "запустить (ракету, спутник, фейерверк)"
    examples:
      - pl: "Chiny wystrzeliły nowego satelitę."
        ru: "Китай запустил новый спутник."
        source: { kind: authored }
      - pl: "O północy wystrzelono fajerwerki."
        ru: "В полночь запустили фейерверк."
        source: { kind: authored }
  - id: shoot-up
    ru: "взлететь, резко вырасти (о ценах, растениях)"
    examples:
      - pl: "Ceny mieszkań wystrzeliły w górę."
        ru: "Цены на квартиры взлетели."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "WYSTRZELIĆ — «выстрелить», но не только из оружия. О ракете и спутнике по-польски тоже WYSTRZELIĆ, где по-русски «запустить»: WYSTRZELIĆ RAKIETĘ. О ценах, акциях, растениях — «взлететь, рвануть вверх»: CENY WYSTRZELIŁY. Русское «выстрелить» о песне или фильме — «стать хитом» — по-польски скорее STAĆ SIĘ HITEM." }
  - { kind: usage, text: "Пятьдесят три формы — подпись переходного глагола совершенного вида: WYSTRZELIĆ RAKIETĘ даёт страдательное WYSTRZELONY, «запущенный», и деепричастие WYSTRZELIWSZY. Видовой партнёр — WYSTRZELIWAĆ: WYSTRZELIWAĆ SATELITY. Без дополнения глагол значит просто «выстрелить»." }
  - { kind: government, text: "Из чего — Z с родительным: WYSTRZELIĆ Z PISTOLETU, Z ARMATY. Во что — DO с родительным: WYSTRZELIĆ DO CELU, DO LUDZI. Куда — W: W POWIETRZE, W GÓRĘ. Что запустить — винительный: WYSTRZELIĆ RAKIETĘ, PIŁKĘ." }
  - { kind: pronunciation, text: "Читается «выстшэ́лиць», три слога, ударение на предпоследнем. TRZ — «тш», два глухих звука подряд, а не «ч» и не «тр». E после RZ — «э», L перед I мягкое. Конечное Ć — «ць»." }
  - { kind: register, text: "Нейтральное слово новостей, спорта и техники. В спорте — о мяче: WYSTRZELIĆ PIŁKĘ W SIATKĘ. В разговоре: WYSTRZELIĆ JAK Z PROCY, «вылететь как из рогатки»." }
collocations:
  - { pl: "wystrzelić w powietrze", ru: "выстрелить в воздух" }
  - { pl: "wystrzelić rakietę", ru: "запустить ракету" }
  - { pl: "ceny wystrzeliły", ru: "цены взлетели" }
family:
  - { pl: "strzelić", ru: "выстрелить", relation: root, id: strzelic }
  - { pl: "strzelać", ru: "стрелять", relation: root, id: strzelac }
  - { pl: "wystrzal", ru: "выстрел", relation: derived }
etymology: "Приставка WY- «вы-» плюс STRZELIĆ «выстрелить», от STRZAŁA «стрела», праславянское *strěla, то же, что русское «стрела». Польское RZ на месте русского «р» перед старым Ě: STRZAŁA и «стрела»."
memory: "Wystrzelić — выстрелить: w powietrze, z pistoletu. И «запустить»: wystrzelić rakietę, satelitę. Ceny wystrzeliły — цены взлетели. Читается «выстшэ́лиць»."
idioms:
  - { pl: "wystrzelić jak z procy", ru: "вылететь как из рогатки" }
