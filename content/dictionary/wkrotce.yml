# review
id: wkrotce
format: 2
lemma: "wkrótce"
rank: 751
pos: adv
pron: { cyr: "фкру́тце" }
senses:
  - id: soon
    ru: "скоро, вскоре"
    examples:
      - pl: "Wkrótce wiosna."
        ru: "Скоро весна."
        source: { kind: tatoeba, id: 352658 }
      - pl: "Kolacja wkrótce będzie gotowa."
        ru: "Ужин скоро будет готов."
        source: { kind: tatoeba, id: 2151503 }
      - pl: "Wkrótce wyszła ponownie za mąż."
        ru: "Вскоре она вновь вышла замуж."
        source: { kind: tatoeba, id: 988617 }
  - id: shortly-after
    ru: "wkrótce potem — вскоре после этого"
    examples:
      - pl: "Wkrótce potem wyjechał."
        ru: "Вскоре после этого он уехал."
        source: { kind: authored }
      - pl: "Wkrótce potem zaczęło padać."
        ru: "Вскоре после этого пошёл дождь."
        source: { kind: authored }
      - pl: "Zmarł wkrótce potem."
        ru: "Он умер вскоре после этого."
        source: { kind: authored }
  - id: vs-zaraz
    ru: "wkrótce «вскоре» ≠ zaraz «сейчас же»"
    note: "Разная дистанция во времени."
    examples:
      - pl: "Wkrótce wrócę, ale nie zaraz."
        ru: "Скоро вернусь, но не сию минуту."
        source: { kind: authored }
      - pl: "Wkrótce się zobaczymy."
        ru: "Скоро увидимся."
        source: { kind: authored }
      - pl: "Wkrótce wszystko się wyjaśni."
        ru: "Скоро всё выяснится."
        source: { kind: authored }
  - id: future
    ru: "wkrótce będzie — скоро будет"
    examples:
      - pl: "Wkrótce będzie gotowe."
        ru: "Скоро будет готово."
        source: { kind: authored }
      - pl: "Wkrótce się dowiemy."
        ru: "Скоро узнаем."
        source: { kind: authored }
      - pl: "Wkrótce zaczyna się sezon."
        ru: "Скоро начинается сезон."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Разводите wkrótce и zaraz. Zaraz — это «сейчас же, сию минуту»: Zaraz wracam. Wkrótce — «скоро, вскоре», дистанция побольше: Wkrótce wrócę." }
  - { kind: usage, text: "wkrótce potem — «вскоре после этого», очень ходовой оборот в рассказе о прошлом." }
  - { kind: usage, text: "Синонимы по возрастанию срочности: zaraz «сейчас же», za chwilę «через минуту», niedługo и wkrótce «скоро», lada dzień «со дня на день»." }
  - { kind: pronunciation, text: "Начальное w перед глухим k оглушается, поэтому слово звучит «фкру́тце», а не «вкру́тце»." }
collocations:
  - { pl: "wkrótce potem", ru: "вскоре после этого" }
  - { pl: "wkrótce będzie", ru: "скоро будет" }
  - { pl: "do zobaczenia wkrótce", ru: "до скорой встречи" }
family:
  - { pl: "krótki", ru: "короткий", relation: root }
  - { pl: "niedługo", ru: "скоро", relation: root }
  - { pl: "zaraz", ru: "сейчас", relation: root }
etymology: "w + krótce, от krótki «короткий» — буквально «в короткое время». Русское «вскоре» собрано так же, от «скорый»."
memory: "wkrótce собрано из w + krótki, буквально «в короткое время», а русское «вскоре» — от «скорый»: идея одна, корень разный. Разводите его с zaraz: zaraz значит «сейчас же», wkrótce — «скоро, вскоре». И запомните ходовой оборот wkrótce potem «вскоре после этого». В произношении w оглушается: «фкру́тце»."
idioms:
  - { pl: "wkrótce potem", ru: "вскоре после этого" }
  - { pl: "do zobaczenia wkrótce", ru: "до скорой встречи" }
  - { pl: "wkrótce się okaże", ru: "скоро выяснится" }
