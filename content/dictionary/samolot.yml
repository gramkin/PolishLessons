# review
id: samolot
format: 2
lemma: "samolot"
rank: 655
pos: noun
pron: { cyr: "само́лот" }
senses:
  - id: plane
    ru: "самолёт"
    note: "Слово собрано как русское: samo + lot."
    examples:
      - pl: "Samolot odlatuje o 17:30."
        ru: "Вылет самолёта в 17:30."
        source: { kind: tatoeba, id: 998726 }
      - pl: "Samolot wystartował punktualnie."
        ru: "Самолёт вылетел вовремя."
        source: { kind: tatoeba, id: 1197849 }
      - pl: "Nad miastem leci samolot."
        ru: "Над городом летит самолёт."
        source: { kind: tatoeba, id: 912639 }
  - id: by-plane
    ru: "samolotem — самолётом (творительный без предлога)"
    note: "Управление совпадает с русским «лететь самолётом»."
    examples:
      - pl: "Polecę tam samolotem."
        ru: "Я полечу туда самолётом."
        source: { kind: tatoeba, id: 4716807 }
      - pl: "Polecę samolotem."
        ru: "Я полечу самолётом."
        source: { kind: translated, id: 6879577 }
      - pl: "Ze strachu nie lata samolotami."
        ru: "Из страха он не летает самолётами."
        source: { kind: translated, id: 823166 }
  - id: on-board
    ru: "w samolocie — в самолёте"
    note: "Чередование t/c в предложном: samolot — w samolocie."
    examples:
      - pl: "Są w tym samolocie."
        ru: "Они в том самолёте."
        source: { kind: tatoeba, id: 6017171 }
      - pl: "Wszystko zaczęło się w samolocie, kiedy leciałem na konferencję."
        ru: "Все началось в самолете, когда я летел на конференцию."
        source: { kind: tatoeba, id: 2962853 }
      - pl: "Rzadko śpię w samolocie."
        ru: "Я редко сплю в самолёте."
        source: { kind: translated, id: 8993274 }
notes:
  - { kind: usage, text: "Слово разбирается прозрачно: samo «само» плюс lot «полёт», ровно тем же способом, что русское «самолёт». Редкий случай, когда оба языка собрали слово одинаково." }
  - { kind: pronunciation, text: "Читается «само́лот», с ударением на предпоследний слог, как всегда в польском. Никакого «ё»: оба последних гласных — обычное o." }
  - { kind: usage, text: "В предложном падеже t переходит в c: samolot, но w samolocie." }
  - { kind: government, text: "«Лететь самолётом» — творительный без предлога: lecieć samolotem. «В самолёт» — do samolotu с родительным, «в самолёте» — w samolocie с предложным." }
collocations:
  - { pl: "lecieć samolotem", ru: "лететь самолётом" }
  - { pl: "w samolocie", ru: "в самолёте" }
  - { pl: "katastrofa samolotu", ru: "авиакатастрофа" }
  - { pl: "model samolotu", ru: "модель самолёта" }
family:
  - { pl: "lot", ru: "полёт", relation: root }
  - { pl: "lotnisko", ru: "аэропорт", relation: derived }
  - { pl: "latać", ru: "летать", relation: root }
etymology: "Сложение samo- «само-» и lot «полёт» — слово собрано тем же способом, что и русское «самолёт»."
memory: "samolot — «самолёт», и это один из самых удобных случаев для русского уха: слово собрано ровно как русское, samo плюс lot, и управление совпадает — lecieć samolotem, творительный без предлога. Запомнить надо две мелочи. Во-первых, произношение: «само́лот», никакого «ё». Во-вторых, чередование в предложном: w samolocie, с c вместо t. Рядом стоят lotnisko «аэропорт» и latać «летать»."
idioms:
  - { pl: "lecieć samolotem", ru: "лететь самолётом" }
  - { pl: "w samolocie", ru: "в самолёте" }
  - { pl: "katastrofa samolotu", ru: "авиакатастрофа" }
