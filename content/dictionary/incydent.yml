etymology: "Из латинского INCIDENS, причастия глагола INCIDERE «впадать, случаться», сложенного из IN- «в» и CADERE «падать». Буквально — «впадающее, выпадающее на долю», тот же образ, что в русском «случае» от «случиться» и в польском WYPADEK от WYPAŚĆ «выпасть». Все три слова построены на одной метафоре: событие как нечто упавшее. Оба наших языка взяли латинское слово в девятнадцатом веке через французский, и написание почти совпало; разница только в польском Y на месте русского И, что отражает польское чтение этой буквы как «ы». От того же CADERE происходят OKAZJA, AKCYDENS и PRZYPADEK — последнее в польском значит и «случай», и грамматический «падеж», как и русское «падение» рядом с «падежом»."
memory: "Нейтральнее русского: польский incydent — любое происшествие, в том числе мелкое, и в сводках встречается постоянно (incydent odosobniony «единичный случай»). По-русски часто лучше «происшествие». Ударение на предпоследнем: «инцы́дэнт», и y читается «ы». В местном t→c: o incydencie. Zgłosić incydent — винительный без предлога, тогда как по-русски «сообщить ОБ инциденте»."
