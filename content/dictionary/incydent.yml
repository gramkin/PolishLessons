notes:
  - { kind: false-friend, text: "Слово совпадает с русским «инцидентом», но оттенок немного другой, и его стоит знать. Польское INCYDENT нейтральнее: это любое происшествие, в том числе мелкое и безобидное, и в официальных сводках оно употребляется постоянно — INCYDENT ODOSOBNIONY «единичный случай», INCYDENT DROGOWY «дорожное происшествие». Русское «инцидент» звучит серьёзнее и в бытовой речи встречается реже, так что при переводе на русский часто лучше «происшествие» или «случай». Ударение, как и в KONFLIKT, падает на предпоследний слог: «инцы́дэнт», а не «инциде́нт». И буква Y здесь читается «ы», поэтому второй слог звучит «цы», а не «ци»." }
  - { kind: usage, text: "В местном падеже единственного числа T переходит в C: W INCYDENCIE, O INCYDENCIE. Это второе из трёх слов в этой карточке с тем же чередованием, вместе с KONFLIKT и PRZYNĘTA, и повторение здесь намеренное: правило лучше запоминается на трёх словах сразу, чем на одном. Родительный единственного — INCYDENTU на -U. Родительный множественного — INCYDENTÓW. Основа в остальном не меняется, и во множественном числе слово употребляется не реже, чем в единственном, потому что происшествия обычно считают." }
  - { kind: government, text: "Мужской род, неодушевлённое. Где произошёл — предлог W или NA с местным: INCYDENT W SZKOLE, INCYDENT NA GRANICY. С кем — Z с творительным: INCYDENT Z UDZIAŁEM POLICJI «происшествие с участием полиции», и это стандартная формула сводок. Частотные глаголы: ZGŁOSIĆ INCYDENT «сообщить об инциденте» — по-польски винительный без предлога, тогда как по-русски нужен предлог «об»; WYJAŚNIĆ INCYDENT «выяснить обстоятельства происшествия»; UZNAĆ ZA ODOSOBNIONY «признать единичным»." }
  - { kind: pronunciation, text: "Читается «инцы́дэнт», три слога, ударение на предпоследнем, то есть на CY. Буква C перед Y даёт «ц», а Y — «ы». Буква E в последнем слоге звучит «э» без смягчения предшествующего согласного. Конечное -NT произносится полностью, оба согласных. В местном падеже INCYDENCIE слогов четыре, сочетание CIE даёт мягкое «це»: «инцыде́нце», и ударение снова на предпоследнем." }
