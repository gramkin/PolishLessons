lemma: "dziwka"
rank: 948
pos: noun
pron: { cyr: "дзи́фка" }
senses:
  - id: whore
    ru: "шлюха, проститутка"
    examples:
      - pl: "Dziwka."
        ru: "Шлюха."
        source: { kind: translated, id: 12359672 }
      - pl: "Ona jest dziwką."
        ru: "Она шлюха."
        source: { kind: translated, id: 5838124 }
      - pl: "Nie ubieraj się jak dziwka."
        ru: "Не одевайся как шлюха."
        source: { kind: translated, id: 1453219 }
      - pl: "Przepuścił spadek na alkohol i dziwki."
        ru: "Он спустил наследство на алкоголь и шлюх."
        source: { kind: translated, id: 709264 }
      - pl: "Nazwanie kobiety dziwką jest bardzo obraźliwe."
        ru: "Назвать женщину шлюхой — очень оскорбительно."
        source: { kind: authored }
      - pl: "Słowo dziwka jest wulgarne i obraźliwe."
        ru: "Слово dziwka вульгарно и оскорбительно."
        source: { kind: authored }
notes:
  - { kind: register, text: "Грубое оскорбление женщины, соответствует русскому «шлюха». Исходное значение — «проститутка», но в живой речи это прежде всего ругательство." }
  - { kind: false-friend, text: "Корень тот же, что в dziewczyna «девушка» и dziewczynka «девочка», но dziwka — оскорбление. Русские «дева» и «девка» разошлись точно так же." }
  - { kind: usage, text: "В некоторых говорах слово сохранило нейтральное значение «девушка» — след исходного смысла." }
collocations:
  - { pl: "nie ubieraj się jak dziwka", ru: "не одевайся как шлюха" }
  - { pl: "nazwać kogoś dziwką", ru: "назвать кого-то шлюхой" }
  - { pl: "tania dziwka", ru: "дешёвая шлюха" }
etymology: "От dziewka «девка», уменьшительного от dziewa «дева». Русское «девка» прошло ровно тот же путь от нейтрального слова к грубому."
memory: "dziwka — «шлюха», грубое оскорбление. Корень тот же, что в dziewczyna «девушка», — как русские «дева» и «девка»."
