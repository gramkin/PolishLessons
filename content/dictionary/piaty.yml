# review
id: piaty
format: 2
lemma: "piąty"
rank: 1925
pos: num
pron: { cyr: "пё́нты" }
senses:
  - id: fifth
    ru: "пятый"
    examples:
      - pl: "Dzisiaj jest piąty marca."
        ru: "Сегодня пятое марта."
        source: { kind: tatoeba, id: 6154716 }
      - pl: "Zająłem piąte miejsce w wyścigu."
        ru: "Я занял пятое место в гонке."
        source: { kind: translated, id: 533630 }
      - pl: "Piąty maj jest dniem dziecka."
        ru: "Пятое мая — день ребёнка."
        source: { kind: translated, id: 2289962 }
  - id: five-oclock
    ru: "пять часов (o piątej «в пять»)"
    examples:
      - pl: "Spotkajmy się o piątej."
        ru: "Встретимся в пять."
        source: { kind: tatoeba, id: 5336675 }
      - pl: "Wstałem o piątej rano."
        ru: "Я встал в пять утра."
        source: { kind: tatoeba, id: 12662417 }
      - pl: "On wróci przed piątą."
        ru: "Он вернётся до пяти."
        source: { kind: translated, id: 353146 }
notes:
  - { kind: government, text: "О времени — o piątej (предложный падеж): spotkajmy się o piątej «встретимся в пять». До пяти — do piątej, перед пятью — przed piątą (творительный)." }
  - { kind: usage, text: "Женская форма piąta сама по себе значит «пять часов»: Czy to już piąta? «Уже пять?»" }
  - { kind: usage, text: "В дробях piąta значит «пятая часть»: jedna piąta «одна пятая», cztery piąte «четыре пятых»." }
  - { kind: false-friend, text: "piąty «пятый» — порядковое числительное, а pięć «пять» — количественное, ровно как в русском." }
collocations:
  - { pl: "o piątej", ru: "в пять часов" }
  - { pl: "piąte piętro", ru: "пятый этаж" }
  - { pl: "jedna piąta", ru: "одна пятая" }
family:
  - { pl: "pięć", ru: "пять", relation: root }
  - { pl: "piątka", ru: "пятёрка", relation: root, id: piatka }
  - { pl: "czwarty", ru: "четвёртый", relation: root }
etymology: "От pięć «пять», как русское «пятый» от «пять». Носовое ą стоит там, где в русском «я»."
memory: "piąty — «пятый». О времени — o piątej «в пять часов», а сама форма piąta значит «пять часов». В дробях jedna piąta — «одна пятая»."
idioms:
  - { pl: "o piątej", ru: "в пять часов" }
  - { pl: "piąte koło u wozu", ru: "пятое колесо в телеге" }
  - { pl: "jedna piąta", ru: "одна пятая" }
