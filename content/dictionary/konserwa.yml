notes:
  - { kind: usage, text: "Основное значение — консервы, но в политической речи konserwa значит «ретрограды, косное крыло». Оттенок резко пренебрежительный." }
  - { kind: false-friend, text: "Из латинского conservare «сохранять», как и русские «консервы», «консерватор». Но по-русски «консерва» в единственном числе почти не употребляется, а по-польски это нормальная форма." }
  - { kind: government, text: "Женский род: ta konserwa, tej konserwy. Открыть консервы — otworzyć konserwę, винительный." }
  - { kind: usage, text: "Оба корпусных примера пришлось отвергнуть — один оказался пропагандистским абзацем, другой бессмысленной рифмовкой, — поэтому все примеры составлены вручную." }
