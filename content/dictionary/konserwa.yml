id: konserwa
format: 2
lemma: "konserwa"
rank: 5669
pos: noun
pron: { cyr: "консэ́рва" }
senses:
  - id: tinned-food
    ru: "консервы, консервная банка"
    examples:
      - pl: "Otworzył konserwę scyzorykiem."
        ru: "Он открыл консервы ножом."
        source: { kind: authored }
      - pl: "W plecaku miał dwie konserwy."
        ru: "В рюкзаке у него были две банки консервов."
        source: { kind: authored }
      - pl: "Konserwa była przeterminowana."
        ru: "Консервы были просрочены."
        source: { kind: authored }
  - id: reactionary
    ru: "ретроград, консерватор (пренебрежительно)"
    examples:
      - pl: "Nazwali go starą konserwą."
        ru: "Его назвали старым ретроградом."
        source: { kind: authored }
      - pl: "W partii rządzi konserwa."
        ru: "В партии правят ретрограды."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Основное значение — консервы, но в политической речи konserwa значит «ретрограды, косное крыло». Оттенок резко пренебрежительный." }
  - { kind: false-friend, text: "Из латинского conservare «сохранять», как и русские «консервы», «консерватор». Но по-русски «консерва» в единственном числе почти не употребляется, а по-польски это нормальная форма." }
  - { kind: government, text: "Женский род: ta konserwa, tej konserwy. Открыть консервы — otworzyć konserwę, винительный." }
  - { kind: usage, text: "Оба корпусных примера пришлось отвергнуть — один оказался пропагандистским абзацем, другой бессмысленной рифмовкой, — поэтому все примеры составлены вручную." }
collocations:
  - { pl: "otworzyć konserwę", ru: "открыть консервы" }
etymology: "Из латинского conservare «сохранять», как и русские «консервы», «консерватор»."
memory: "konserwa — «консервы», и в единственном числе это нормально, в отличие от русского. В политике konserwa — пренебрежительное «ретрограды»."
idioms:
  - { pl: "otworzyć konserwę", ru: "открыть консервы" }
