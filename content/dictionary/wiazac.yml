notes:
  - { kind: false-friend, text: "Корень общий с русским «вязать», и соответствие звуков регулярное: польское Ą отвечает русскому Я там, где когда-то стоял носовой гласный. WIĄZAĆ и «вязать», ZWIĄZEK и «связь», WIĄZKA и «вязанка». Главная награда за это наблюдение — слово OBOWIĄZEK «обязанность». Оно образовано из OB- и того же корня, то есть буквально «обвязка, то, чем человек обвязан», и русское «обязанность» устроено точно так же, только русский потерял В в середине: «обвязать» дало «обязать». Поляк этот В сохранил, и потому OBOWIĄZEK выглядит длиннее русского слова, хотя это одно и то же. Увидев связь, учащийся получает сразу OBOWIĄZEK, ZWIĄZEK, WĘZEŁ и WIĘZIENIE." }
  - { kind: usage, text: "Шестьдесят три формы, и это полный набор несовершенного переходного глагола: сорок две формы даёт сам глагол, десять — действительное причастие WIĄŻĄCY, одиннадцать — страдательное WIĄZANY. У этого глагола обе причастные серии есть, потому что он переходный и несовершенный одновременно. В основе настоящего времени Z переходит в Ż: инфинитив WIĄZAĆ, но WIĄŻĘ, WIĄŻESZ, WIĄŻE. Это обязательное чередование, и забыть его — самая частая ошибка. Совершенные пары разные по смыслу: ZAWIĄZAĆ «завязать», ZWIĄZAĆ «связать», PRZYWIĄZAĆ «привязать», ROZWIĄZAĆ «развязать, решить». Отглагольное WIĄZANIE значит и «вязание», и «крепление» на лыжах." }
  - { kind: government, text: "Переходный: вязать что-то — винительный без предлога, WIĄZAĆ SZNUROWADŁA, WIĄZAĆ SNOPY. Связывать что с чем — предлог Z с творительным: WIĄZAĆ FAKT Z FAKTEM, WIĄZAĆ JEDNO Z DRUGIM, и русское управление то же. Чем вязать — тоже творительный, но без предлога: WIĄZAĆ SZNURKIEM «вязать верёвкой». Возвратное WIĄZAĆ SIĘ Z CZYMŚ значит «быть связанным с чем-то, влечь за собой»: TA PRACA WIĄŻE SIĘ Z PODRÓŻAMI «эта работа связана с поездками». Важный оборот WIĄZAĆ KONIEC Z KOŃCEM дословно повторяет русское «сводить концы с концами» и значит то же самое." }
  - { kind: pronunciation, text: "Читается «вё́нзаць», два слога, ударение на первом. Сочетание WIĄ это мягкое «вё» с носовым призвуком: W мягкое из-за I, а Ą перед Z даёт «он», так что слог звучит примерно как «вён». В формах настоящего времени на месте Z стоит Ż и звучит твёрдое «ж»: WIĄŻĘ это «вё́нжэ», WIĄŻESZ — «вё́нжэш». В причастии WIĄŻĄCY два носовых подряд: «вёнжо́нцы». Повелительное WIĄŻ кончается на «ж»: «вёнж». Конечное -AĆ в инфинитиве это «аць» с мягким Ć." }
