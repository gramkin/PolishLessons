etymology: "Из праславянского *vęzati, того же слова, что русское «вязать». Носовой гласный распался в двух языках по-разному: русский дал Я, польский — Ą перед твёрдым согласным и Ę перед мягким, и это чередование видно внутри самого польского гнезда. WIĄZAĆ и ZWIĄZEK с твёрдым Z имеют Ą, а WIĘZY «узы» и WIĘZIENIE «тюрьма» с мягким Ź имеют Ę — ровно то же распределение, что в паре ZĄB и ZĘBY, DĄB и DĘBY. Значение «тюрьма» у WIĘZIENIE прямое: место, где человека связывают. Самое полезное слово гнезда — OBOWIĄZEK, из OB- и корня вязать, и русское «обязанность» того же строения, но с утраченным В: «обвязать» стянулось в «обязать». Поэтому польская форма сохраняет лишний слог и выглядит архаичнее русской, оставаясь тем же словом."
memory: "Корень как в русском «вязать», и ą отвечает я: wiązać, związek «связь», wiązka «вязанка». Главная находка — obowiązek «обязанность»: это ob- + вязать, а русское слово того же строения, только потеряло в («обвязать» → «обязать»). Внутри гнезда работает чередование ą/ę: твёрдый согласный даёт ą (wiązać, związek), мягкий — ę (więzy, więzienie «тюрьма», то есть место, где связывают), как в ząb/zęby. В настоящем времени z меняется на ż: wiążę, wiążesz, но инфинитив wiązać. И оборот wiązać koniec z końcem — буквально «сводить концы с концами»."
