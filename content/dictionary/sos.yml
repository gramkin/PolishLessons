notes:
  - { kind: false-friend, text: "СЛОВО РОДСТВЕННО НЕ «СОУСУ», А «СОЛИ». Sos пришёл из французского sauce, а то из латинского salsa «солёная», от sal «соль» — то есть от того же корня, что польское SÓL и русская «соль». Русский «соус» пришёл тем же путём, чуть позже, поэтому слова и похожи, и оба означают одно." }
  - { kind: usage, text: "Названия соусов строятся прилагательным: sos pomidorowy «томатный», sos sojowy «соевый», sos czosnkowy «чесночный». Предложный — w SOSIE, с мягким si. И запомни оборот w tym samym sosie — «в том же духе», о людях одного сорта." }
  - { kind: pronunciation, text: "Один слог: сос. Оба s глухие и твёрдые, o открытое: «сос». Предложный sosie звучит «со́ще», с мягким щ, а не с твёрдым с." }
collocations:
  - { pl: "sos pomidorowy", ru: "томатный соус" }
  - { pl: "sos sojowy", ru: "соевый соус" }
  - { pl: "polać sosem", ru: "полить соусом" }
family:
  - { pl: "sól", ru: "соль", relation: root, id: sol }
  - { pl: "zupa", ru: "суп", relation: root }
  - { pl: "przyprawa", ru: "приправа", relation: root }
etymology: "Из французского sauce, от народнолатинского salsa «солёная», женской формы от salsus, от sal «соль». Тот же латинский корень дал «салат», «салями» и «сальса», а в славянских он отвечает польскому sól и русской «соли». Русский «соус» — то же французское слово."
memory: "sos — «соус», и корень у него не свой, а латинский sal «соль»: salsa значило «солёная». Так что sos и sól — родня. Предложный — w sosie, с мягким щ."
idioms:
  - { pl: "w tym samym sosie", ru: "того же сорта, в том же духе" }
  - { pl: "sos własny", ru: "соус из собственного сока" }
