notes:
  - { kind: false-friend, text: "KARTOTEKA — «картотека», но и «досье»: MIEĆ KARTOTEKĘ — «иметь судимость, быть на учёте в полиции». Медицинская карта — KARTA PACJENTA, а в регистратуре — тоже KARTOTEKA." }
  - { kind: usage, text: "Девять форм, женский род. В дательном и местном K переходит в C: W KARTOTECE. Родительный множественного — KARTOTEK. Звательный KARTOTEKO не употребляется." }
  - { kind: government, text: "В картотеке — W KARTOTECE, местный. Заглянуть в картотеку — ZAJRZEĆ DO KARTOTEKI, родительный. Иметь криминальное прошлое — MIEĆ KARTOTEKĘ." }
  - { kind: pronunciation, text: "Читается «картотэ́ка»: TE — твёрдое «тэ». Ударение на предпоследнем слоге. KARTOTECE — «картотэ́це»." }
