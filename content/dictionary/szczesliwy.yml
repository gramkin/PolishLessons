# review
id: szczesliwy
format: 2
lemma: "szczęśliwy"
rank: 400
pos: adj
pron: { cyr: "шчэньсьли́вы" }
senses:
  - id: happy
    ru: "счастливый"
    examples:
      - pl: "Jestem szczęśliwy."
        ru: "Я счастлив."
        source: { kind: tatoeba, id: 625284 }
      - pl: "Jestem szczęśliwa."
        ru: "Я счастлива."
        source: { kind: tatoeba, id: 2659362 }
      - pl: "Bob był bardzo szczęśliwy."
        ru: "Боб был очень счастлив."
        source: { kind: tatoeba, id: 559516 }
  - id: wishes
    ru: "счастливый, удачный (в пожеланиях)"
    examples:
      - pl: "Szczęśliwego Nowego Roku!"
        ru: "Хорошего Нового года!"
        source: { kind: tatoeba, id: 352753 }
      - pl: "Szczęśliwej drogi."
        ru: "Счастливого пути."
        source: { kind: translated, id: 498422 }
      - pl: "Szczęśliwego Halloween!"
        ru: "Счастливого Хэллоуина!"
        source: { kind: translated, id: 534061 }
notes:
  - { kind: usage, text: "В пожеланиях слово стоит в родительном падеже, как и в русском: Szczęśliwego Nowego Roku! «С Новым годом!», Szczęśliwej drogi! «Счастливого пути!»" }
  - { kind: usage, text: "Существительное szczęście значит и «счастье», и «удача»: na szczęście «к счастью», mieć szczęście «повезти»." }
  - { kind: usage, text: "Степени сравнения регулярные: szczęśliwy → szczęśliwszy → najszczęśliwszy." }
  - { kind: usage, text: "Пословица szczęśliwi czasu nie liczą — это ровно русское «счастливые часов не наблюдают»." }
collocations:
  - { pl: "szczęśliwego Nowego Roku", ru: "с Новым годом" }
  - { pl: "szczęśliwej drogi", ru: "счастливого пути" }
  - { pl: "mieć szczęście", ru: "повезти" }
  - { pl: "na szczęście", ru: "к счастью" }
etymology: "Праславянское *sъčęstьnъ от *čęstь «часть, доля»: счастливый — это тот, кому досталась своя доля. Русское «счастье» собрано точно так же, а польское szcz стоит на месте русского «сч»."
memory: "szczęśliwy — «счастливый», и внутри та же «доля», что в русском «счастье»: szcz на месте «сч». В пожеланиях слово идёт в родительном: Szczęśliwego Nowego Roku! А пословица szczęśliwi czasu nie liczą — это ровно «счастливые часов не наблюдают»."
idioms:
  - { pl: "mieć szczęśliwą rękę", ru: "иметь лёгкую руку" }
  - { pl: "urodzić się pod szczęśliwą gwiazdą", ru: "родиться под счастливой звездой" }
  - { pl: "szczęśliwi czasu nie liczą", ru: "счастливые часов не наблюдают" }
