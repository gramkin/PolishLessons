# review
id: dramat
format: 2
lemma: "dramat"
rank: 5049
pos: noun
pron: { cyr: "дра́мат" }
senses:
  - id: drama
    ru: "драма (жанр, пьеса)"
    examples:
      - pl: "Dramat Mickiewicza wystawiono w teatrze."
        ru: "Драму Мицкевича поставили в театре."
        source: { kind: authored }
      - pl: "Ten film to dramat psychologiczny."
        ru: "Этот фильм — психологическая драма."
        source: { kind: authored }
      - pl: "Studiuje historię dramatu."
        ru: "Он изучает историю драмы."
        source: { kind: authored }
  - id: tragedy
    ru: "драма, беда, трагедия (в жизни)"
    examples:
      - pl: "To prawdziwy dramat dla rodziny."
        ru: "Для семьи это настоящая трагедия."
        source: { kind: authored }
      - pl: "Nie rób dramatu z powodu spóźnienia."
        ru: "Не устраивай драму из-за опоздания."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "DRAMAT — «драма», но мужского рода: TEN DRAMAT. В разговоре — «беда, кошмар»: TO DRAMAT! — «это кошмар!». Драматург — DRAMATURG, драматичный — DRAMATYCZNY." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Родительный — DRAMATU. В местном T переходит в C: W DRAMACIE." }
  - { kind: government, text: "Драма кого — родительный: DRAMAT RODZINY. Устраивать драму из-за — ROBIĆ DRAMAT Z и родительный. В драме — W DRAMACIE." }
  - { kind: pronunciation, text: "Читается «дра́мат», ударение на первом слоге. DRAMACIE — «драма́це»." }
collocations:
  - { pl: "dramat obyczajowy", ru: "бытовая драма" }
  - { pl: "robić dramat", ru: "устраивать драму" }
  - { pl: "ludzki dramat", ru: "человеческая трагедия" }
family:
  - { pl: "dramatyczny", ru: "драматический, драматичный", relation: derived }
  - { pl: "tragedia", ru: "трагедия", relation: root, id: tragedia }
  - { pl: "komedia", ru: "комедия", relation: root }
etymology: "Из греческого DRAMA «действие», от DRAN «действовать». В польском слово мужского рода по форме на согласный."
memory: "Dramat — драма, мужского рода: ten dramat. To dramat! — это кошмар! W dramacie — в драме. Читается «дра́мат»."
idioms:
  - { pl: "nie rób dramatu", ru: "не драматизируй" }
