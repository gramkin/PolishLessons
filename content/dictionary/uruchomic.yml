        ru: "Недавно запущенная фабрика уже зарабатывает."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Корень здесь родственный, но не тому русскому слову, которое приходит на ум. RUCH значит «движение», а родня ему в русском — «рух», «рушить», «рухнуть», из праславянского *ruxъ. Русское «движение» идёт от совсем другого корня, так что мостик надо строить через «рухнуть»: то, что рушится, приходит в движение. От RUCH идёт прилагательное RUCHOMY «движимый», от него URUCHOMIĆ — буквально «привести в движимое состояние», то есть «запустить»." }
  - { kind: usage, text: "Одно слово из этого гнезда русскому узнать легко, и оно повседневное: NIERUCHOMOŚĆ — «недвижимость», от NIE плюс RUCHOMY «движимый». Собрано точно так же, как русское «недвижимость» от «не движимый», хотя корни у двух языков разные: польский считает от RUCH, русский от «двигать». Картина мысли одна, материал разный. Отсюда же MAJĄTEK RUCHOMY «движимое имущество» и NIERUCHOMY «неподвижный»." }
  - { kind: usage, text: "Пятьдесят три формы — совершенный переходный: сорок одна основная, одиннадцать страдательных причастий и деепричастие URUCHOMIWSZY. Повелительное URUCHOM выходит из третьего лица URUCHOMI отбрасыванием -i, по правилу карточки KARMIĆ, и основа на -m польское слово закончить может, так что -ij не вставляется. А вот первое лицо множественного стоит отметить: URUCHOMMY пишется с двумя m, потому что это URUCHOM плюс -MY, и упрощать сочетание не принято — ровно как KARMMY от KARM. Несовершенная пара — URUCHAMIAĆ, и в ней появляется -a-: URUCHAMIAM." }
  - { kind: government, text: "Управление простое и совпадает с русским: URUCHOMIĆ COŚ в винительном — uruchomić silnik, uruchomić program, uruchomić produkcję, uruchomić procedurę. В канцелярском языке глагол означает «дать делу ход»: URUCHOMIONO PROCEDURĘ ODWOŁAWCZĄ «запустили процедуру обжалования». Существительное URUCHOMIENIE «запуск, ввод в действие» встречается в документах чаще самого глагола: DATA URUCHOMIENIA «дата запуска»." }
collocations:
  - { pl: "uruchomić silnik", ru: "запустить двигатель" }
  - { pl: "uruchomić program", ru: "запустить программу" }
  - { pl: "uruchomić produkcję", ru: "запустить производство" }
family:
  - { pl: "uruchamiać", ru: "запускать", relation: aspect }
  - { pl: "ruch", ru: "движение", relation: root, id: ruch }
  - { pl: "ruszyć", ru: "двинуть, тронуться", relation: root, id: ruszyc }
etymology: "Приставка u-, корень RUCH «движение» и глагольное -omić от RUCHOMY «движимый»: буквально «сделать движимым, привести в движение». RUCH идёт из праславянского *ruxъ, родственного русским «рух», «рушить», «рухнуть» — но не «движению», у которого корень другой. Из этого гнезда вышли RUCHOMY «движимый», NIERUCHOMY «неподвижный», NIERUCHOMOŚĆ «недвижимость», RUSZYĆ «тронуться» и URUCHOMIENIE «запуск»."
memory: "ruch — это «движение», а родня ему «рухнуть», не «двигать». uruchomić значит «привести в движимое состояние», то есть запустить. И помните nieruchomość — «недвижимость»."
idioms:
  - { pl: "uruchomić procedurę", ru: "запустить процедуру, дать делу ход" }
  - { pl: "data uruchomienia", ru: "дата запуска" }
