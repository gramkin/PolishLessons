# review
id: czarodziej
format: 2
lemma: "czarodziej"
rank: 5228
pos: noun
pron: { cyr: "чаро́дзей" }
senses:
  - id: wizard
    ru: "волшебник, чародей"
    examples:
      - pl: "Czarodziej zamienił żabę w księcia."
        ru: "Волшебник превратил лягушку в принца."
        source: { kind: authored }
      - pl: "Harry Potter jest młodym czarodziejem."
        ru: "Гарри Поттер — юный волшебник."
        source: { kind: authored }
      - pl: "W bajce zły czarodziej porwał księżniczkę."
        ru: "В сказке злой волшебник похитил принцессу."
        source: { kind: authored }
  - id: master
    ru: "кудесник, мастер своего дела (перен.)"
    examples:
      - pl: "Ten fotograf to czarodziej światła."
        ru: "Этот фотограф — кудесник света."
        source: { kind: authored }
      - pl: "Mechanik okazał się czarodziejem: auto znowu jeździ."
        ru: "Механик оказался кудесником: машина снова ездит."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "CZARODZIEJ — русское «чародей», но без книжного оттенка: это обычное слово для «волшебника» в сказках и в книгах о Гарри Поттере. Волшебница — CZARODZIEJKA, ведьма — CZAROWNICA, колдун — CZARNOKSIĘŻNIK." }
  - { kind: usage, text: "Одиннадцать форм, мужской род, лицо. Во множественном CZARODZIEJE, без -OWIE. В родительном множественного две равноправные формы: CZARODZIEJÓW и CZARODZIEI. Местный и звательный совпадают: CZARODZIEJU." }
  - { kind: government, text: "Превратить во что-то — ZAMIENIĆ W COŚ, W с винительным, как в русском: ZAMIENIĆ ŻABĘ W KSIĘCIA. Нарядиться волшебником — PRZEBRAĆ SIĘ ZA CZARODZIEJA, ZA с винительным." }
  - { kind: pronunciation, text: "Читается «чаро́дзей», ударение на предпоследнем слоге. DZIE — «дзе», как в ZŁODZIEJ «зуо́дзей». CZ твёрдое: «ча»." }
  - { kind: register, text: "Сказочное слово, но нейтральное. В переносном смысле хвалит мастера: CZARODZIEJ KUCHNI, CZARODZIEJ PIŁKI. Прилагательное — CZARODZIEJSKI: CZARODZIEJSKA RÓŻDŻKA, «волшебная палочка»." }
collocations:
  - { pl: "zły czarodziej", ru: "злой волшебник" }
  - { pl: "potężny czarodziej", ru: "могущественный волшебник" }
  - { pl: "szkoła czarodziejów", ru: "школа волшебников" }
family:
  - { pl: "czary", ru: "чары, колдовство", relation: root }
  - { pl: "czarować", ru: "колдовать; очаровывать", relation: root }
  - { pl: "czarodziejski", ru: "волшебный", relation: derived }
etymology: "CZARY «чары» + -DZIEJ «делатель», от старого DZIAĆ «делать». Та же модель, что ZŁODZIEJ: по-польски «вор», буквально «злодей». Русское «чародей» сложено точно так же."
memory: "Czarodziej — волшебник, «чародей»: czary + dziej. Читается «чаро́дзей». Czarodziejska różdżka — волшебная палочка. Złodziej — вор, та же модель."
idioms:
  - { pl: "jak za dotknięciem czarodziejskiej różdżki", ru: "как по мановению волшебной палочки" }
