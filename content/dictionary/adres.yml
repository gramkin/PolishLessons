# review
id: adres
format: 2
lemma: "adres"
rank: 987
pos: noun
pron: { cyr: "а́дрэс" }
senses:
  - id: address
    ru: "адрес"
    examples:
      - pl: "Znasz adres Tom'a?"
        ru: "Ты знаешь адрес Тома?"
        source: { kind: translated, id: 3738951 }
      - pl: "Wpisz swoje imię i adres."
        ru: "Впиши своё имя и адрес."
        source: { kind: translated, id: 3743389 }
      - pl: "Mógłby mi pan podać pański adres?"
        ru: "Не могли бы вы дать мне ваш адрес?"
        source: { kind: translated, id: 839175 }
  - id: email
    ru: "adres e-mail — электронный адрес"
    examples:
      - pl: "Masz łatwy do zapamiętania adres email."
        ru: "У тебя легко запоминающийся электронный адрес."
        source: { kind: translated, id: 601720 }
      - pl: "Małpę umieszczamy w adresie e-mail przed domeną."
        ru: "В электронном адресе собачка ставится перед доменом."
        source: { kind: translated, id: 6156505 }
      - pl: "Zapomniałem mojego adresu email."
        ru: "Я забыл свой электронный адрес."
        source: { kind: translated, id: 601695 }
  - id: wrong-address
    ru: "zły adres — неправильный адрес"
    examples:
      - pl: "List nie doszedł, bo podałeś zły adres."
        ru: "Письмо не дошло, потому что ты указал неправильный адрес."
        source: { kind: translated, id: 8428544 }
      - pl: "List nie doszedł, bo zrobiłeś błąd w adresie."
        ru: "Письмо не дошло, потому что ты ошибся в адресе."
        source: { kind: translated, id: 8428545 }
      - pl: "Pomyliłem się w adresie na kopercie."
        ru: "Я ошибся в адресе на конверте."
        source: { kind: translated, id: 6588976 }
notes:
  - { kind: usage, text: "adres e-mail — «электронный адрес». Символ @ по-польски называется małpa «обезьяна»: małpę stawiamy przed domeną." }
  - { kind: usage, text: "podać adres — «дать, указать адрес»; zapisać adres — «записать адрес»." }
  - { kind: usage, text: "Предложный падеж — w adresie: błąd w adresie «ошибка в адресе»." }
  - { kind: usage, text: "Слово французское по происхождению, как и русское «адрес», поэтому значение совпадает полностью — ловушки здесь нет." }
collocations:
  - { pl: "adres e-mail", ru: "электронный адрес" }
  - { pl: "podać adres", ru: "указать адрес" }
  - { pl: "zły adres", ru: "неправильный адрес" }
  - { pl: "błąd w adresie", ru: "ошибка в адресе" }
family:
  - { pl: "adresować", ru: "адресовать", relation: derived }
  - { pl: "adresat", ru: "адресат", relation: derived }
etymology: "Из французского adresse — тем же путём, что и русское «адрес». Слова совпадают и по форме, и по значению."
memory: "adres — «адрес», без подвохов. Запомните adres e-mail и то, что символ @ поляки называют małpa «обезьяна». Предложный падеж — w adresie: błąd w adresie."
idioms:
  - { pl: "adres e-mail", ru: "электронный адрес" }
  - { pl: "podać adres", ru: "указать адрес" }
  - { pl: "pod tym adresem", ru: "по этому адресу" }
