notes:
  - { kind: false-friend, text: "Форма bądź — омоним: это и союз «либо», и повелительное наклонение от być «быть». Bądź zdrów! значит «Будь здоров!», а не «либо здоров»." }
  - { kind: usage, text: "Как союз обычно идёт парой: bądź…, bądź… «либо…, либо…». Синоним — albo." }
  - { kind: usage, text: "bądź co bądź — устойчивый оборот «как бы то ни было, как-никак»." }
  - { kind: register, text: "Союзное bądź книжнее, чем albo; в разговоре чаще albo или lub." }
