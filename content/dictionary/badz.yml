etymology: "То же слово, что повелительное bądź от być «быть»: союз развился из уступительного «будь (то)…». Русское «будь то…, будь то…» устроено ровно так же."
memory: "bądź как союз значит «либо» и обычно идёт парой: bądź…, bądź… Но осторожно: эта же форма — повелительное от być, поэтому Bądź zdrów! — это «Будь здоров!», а не «либо здоров». И запомните оборот bądź co bądź «как бы то ни было»."
idioms:
