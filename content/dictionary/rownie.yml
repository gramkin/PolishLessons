# review
id: rownie
format: 2
lemma: "równie"
rank: 1635
pos: adv
pron: { cyr: "ру́вне" }
senses:
  - id: as-as
    ru: "równie … jak — столь же … как"
    examples:
      - pl: "Są równie silni jak my."
        ru: "Они столь же сильны, как мы."
        source: { kind: translated, id: 498265 }
      - pl: "Jest równie wysoki jak ona."
        ru: "Он такой же высокий, как она."
        source: { kind: translated, id: 364649 }
      - pl: "Jestem równie wysoki jak Tom."
        ru: "Я такой же высокий, как Том."
        source: { kind: translated, id: 943650 }
  - id: as-as-co
    ru: "równie … co — столь же … сколь"
    examples:
      - pl: "Jest równie hojny co bogaty."
        ru: "Он столь же щедр, сколь богат."
        source: { kind: translated, id: 2211940 }
      - pl: "Mary jest równie inteligentna, co miła."
        ru: "Мэри столь же умна, сколь мила."
        source: { kind: translated, id: 357203 }
      - pl: "Jestem równie zaskoczony, co Tom."
        ru: "Я удивлён не меньше Тома."
        source: { kind: translated, id: 3502512 }
notes:
  - { kind: usage, text: "Слово почти не употребляется само по себе: оно вводит сравнение и требует продолжения с jak или co — równie wysoki jak ona «такой же высокий, как она»." }
  - { kind: usage, text: "Оба союза равноправны: równie … jak и równie … co значат одно и то же, co звучит чуть книжнее." }
  - { kind: usage, text: "Отдельный оборот — równie dobrze «с тем же успехом»: Równie dobrze możemy poczekać «С тем же успехом можем и подождать»." }
  - { kind: usage, text: "Степени сравнения równiej и najrówniej есть в парадигме, но в корпусе не встречаются: слово само по себе выражает равенство." }
collocations:
  - { pl: "równie dobrze", ru: "с тем же успехом" }
  - { pl: "równie … jak", ru: "столь же … как" }
  - { pl: "równie ważny", ru: "столь же важный" }
etymology: "От równy «равный», праславянское *orvьnъ — то же слово, что русское «ровный» и «равный». Наречие построено так же, как русское «равно» в обороте «равно как и»."
memory: "równie само по себе не стоит: оно всегда вводит сравнение — równie wysoki jak ona «такой же высокий, как она», równie … co значит то же самое. Отдельно живёт оборот równie dobrze «с тем же успехом»."
idioms:
  - { pl: "równie dobrze", ru: "с тем же успехом" }
  - { pl: "równie … jak", ru: "столь же … как" }
  - { pl: "równie ważny", ru: "столь же важный" }
formExamplesSkip:
  - { form: "równiej", reason: "сравнительная степень, в корпусе примеров нет" }
  - { form: "najrówniej", reason: "превосходная степень, в корпусе примеров нет" }
