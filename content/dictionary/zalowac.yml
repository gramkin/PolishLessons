# review
id: zalowac
format: 2
lemma: "żałować"
rank: 1226
pos: verb
aspect: imperf
pron: { cyr: "жауо́ваць" }
senses:
  - id: regret
    ru: "сожалеть, жалеть о чём-то — с родительным падежом"
    examples:
      - pl: "Żałuję, że to zrobiłem."
        ru: "Я жалею, что сделал это."
        source: { kind: translated, id: 352629 }
      - pl: "Żałuję swoich błędów."
        ru: "Я сожалею о своих ошибках."
        source: { kind: translated, id: 730470 }
      - pl: "On żałuje tego, co zrobił."
        ru: "Он сожалеет о том, что сделал."
        source: { kind: translated, id: 349367 }
  - id: will-regret
    ru: "пожалеть — как предупреждение"
    examples:
      - pl: "Głupota. Sama będziesz potem żałować."
        ru: "Ну и глупо. Сама же потом жалеть будешь."
        source: { kind: tatoeba, id: 13783097 }
      - pl: "Lepiej żałować tego, co się zrobiło, niż tego, czego się nie zrobiło."
        ru: "Лучше жалеть о том, что сделал, чем о том, чего не сделал."
        source: { kind: tatoeba, id: 3184785 }
      - pl: "Przyjdzie czas, że będziesz tego żałować."
        ru: "Придёт время, когда ты об этом пожалеешь."
        source: { kind: translated, id: 368945 }
  - id: pity
    ru: "жалеть кого-то, сочувствовать; скупиться"
    examples:
      - pl: "Byli tacy, co ich żałowali."
        ru: "Были такие, кто их жалел."
        source: { kind: translated, id: 841673 }
      - pl: "Żałujemy jego śmierci."
        ru: "Мы скорбим о его смерти."
        source: { kind: translated, id: 880981 }
      - pl: "Nie żałuj masła na chleb."
        ru: "Не жалей масла на хлеб."
        source: { kind: authored }
notes:
  - { kind: government, text: "Требует родительного падежа, а не винительного: żałuję swoich błędów «жалею о своих ошибках», niczego nie żałuję «ни о чём не жалею». С придаточным — żałuję, że…" }
  - { kind: false-friend, text: "Русское «жалеть» покрывает два польских слова: żałować «сожалеть о чём-то» и współczuć «сочувствовать кому-то». Żałować kogoś тоже возможно, но звучит снисходительно." }
  - { kind: usage, text: "Ещё одно значение — «скупиться»: nie żałować pieniędzy «не жалеть денег», nie żałuj masła «не жалей масла»." }
  - { kind: usage, text: "Вид несовершенный; совершенный — pożałować. Niczego nie żałuję — готовая формула «ни о чём не жалею»." }
collocations:
  - { pl: "żałować czegoś", ru: "сожалеть о чём-то" }
  - { pl: "niczego nie żałować", ru: "ни о чём не жалеть" }
  - { pl: "nie żałować pieniędzy", ru: "не жалеть денег" }
etymology: "От żal «жаль, сожаление», из праславянского *žalь. Русские «жаль», «жалеть» и «жалоба» — из того же гнезда."
memory: "żałować — «сожалеть», и управляет родительным падежом: żałuję swoich błędów, niczego nie żałuję. С придаточным — żałuję, że… Есть и значение «скупиться»: nie żałować pieniędzy. Корень тот же, что в русском «жаль»."
idioms:
  - { pl: "niczego nie żałować", ru: "ни о чём не жалеть" }
  - { pl: "nie żałować pieniędzy", ru: "не жалеть денег" }
  - { pl: "będziesz żałować", ru: "ты пожалеешь" }
