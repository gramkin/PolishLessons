# review
id: zaprosic
format: 2
lemma: "zaprosić"
rank: 626
pos: verb
aspect: perf
pron: { cyr: "запро́сиць" }
senses:
  - id: invite
    ru: "пригласить (кого-л. на что-л.)"
    note: "zaprosić kogoś NA coś: na kolację, na imprezę."
    examples:
      - pl: "Zaprosili ich na kolację."
        ru: "Они пригласили их на ужин."
        source: { kind: tatoeba, id: 6017176 }
      - pl: "Przyjaciele zaprosili mnie na kolację."
        ru: "Мои друзья пригласили меня на ужин."
        source: { kind: tatoeba, id: 416744 }
      - pl: "Zaprosiłem Jane na obiad."
        ru: "Я пригласил Джейн на обед."
        source: { kind: tatoeba, id: 392968 }
  - id: invite-in
    ru: "zaprosić do... — пригласить внутрь, к себе"
    note: "zaprosiła go do środka «пригласила его войти»."
    examples:
      - pl: "Zaprosiła go do środka."
        ru: "Она пригласила его войти."
        source: { kind: translated, id: 10874348 }
      - pl: "Zaprosił nas do domu."
        ru: "Он пригласил нас в дом."
        source: { kind: authored }
      - pl: "Zaprosiła mnie do siebie na herbatę."
        ru: "Она пригласила меня к себе на чай."
        source: { kind: authored }
  - id: invitation
    ru: "zaproszenie — приглашение"
    note: "dziękuję za zaproszenie «спасибо за приглашение»."
    examples:
      - pl: "Dziękuję za zaproszenie."
        ru: "Спасибо за приглашение."
        source: { kind: tatoeba, id: 529660 }
      - pl: "Przyjąłem jego zaproszenie."
        ru: "Я принял его приглашение."
        source: { kind: tatoeba, id: 1184660 }
      - pl: "Nie mogę nie przyjąć jego zaproszenia."
        ru: "Я не могу не принять его приглашение."
        source: { kind: tatoeba, id: 3474725 }
  - id: invited
    ru: "zaproszony — приглашённый"
    note: "Страдательные формы здесь живые и частотные."
    examples:
      - pl: "Był rozczarowany, że nie został zaproszony."
        ru: "Он был разочарован, что его не пригласили."
        source: { kind: tatoeba, id: 5913211 }
      - pl: "Jesteś zaproszony."
        ru: "Ты приглашён."
        source: { kind: translated, id: 5665200 }
      - pl: "Wszyscy jesteście zaproszeni."
        ru: "Вы все приглашены."
        source: { kind: translated, id: 539945 }
notes:
  - { kind: government, text: "zaprosić kogoś NA coś — винительный плюс na с винительным: zaprosić na kolację, na imprezę, na obiad. Здесь польский и русский совпадают полностью." }
  - { kind: usage, text: "С предлогом do получается «пригласить внутрь, к себе»: zaprosiła go do środka «пригласила его войти», zaprosić do domu." }
  - { kind: usage, text: "Несовершенный вид — zapraszać, и он живёт отдельной жизнью как вежливая формула: Zapraszam! значит «Прошу, входите!» или «Угощайтесь!»." }
  - { kind: usage, text: "Существительное — zaproszenie «приглашение»: przyjąć zaproszenie «принять приглашение», dostać zaproszenie «получить приглашение»." }
collocations:
  - { pl: "zaprosić na kolację", ru: "пригласить на ужин" }
  - { pl: "dziękuję za zaproszenie", ru: "спасибо за приглашение" }
  - { pl: "przyjąć zaproszenie", ru: "принять приглашение" }
  - { pl: "Zapraszam!", ru: "Прошу!" }
family:
  - { pl: "zapraszać", ru: "приглашать", relation: aspect }
  - { pl: "prosić", ru: "просить", relation: root }
  - { pl: "zaproszenie", ru: "приглашение", relation: derived }
etymology: "Приставка za- плюс prosić «просить», праславянское *prositi — то же слово, что русское «просить». «Пригласить» по-польски буквально «запросить»."
memory: "zaprosić — «пригласить», и разбирается оно прозрачно: za- плюс prosić «просить». Управление совпадает с русским: zaprosić kogoś NA coś — zaprosili mnie na kolację. С предлогом do получается «пригласить внутрь»: zaprosiła go do środka. Несовершенный вид zapraszać живёт отдельной жизнью как вежливое Zapraszam! «Прошу, входите!». Существительное — zaproszenie."
idioms:
  - { pl: "zaprosić na kolację", ru: "пригласить на ужин" }
  - { pl: "dziękuję za zaproszenie", ru: "спасибо за приглашение" }
  - { pl: "przyjąć zaproszenie", ru: "принять приглашение" }
