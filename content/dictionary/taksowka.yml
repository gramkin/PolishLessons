notes:
  - { kind: false-friend, text: "Главное отличие от русского: taksówka склоняется как обычное существительное женского рода, а русское «такси» не склоняется вовсе. Wezmę taksówkę, jadę taksówką, wysiadłem z taksówki." }
  - { kind: government, text: "На такси — taksówką (творительный падеж): pojedziemy taksówką. Взять такси — wziąć taksówkę (винительный)." }
  - { kind: usage, text: "Водитель — taksówkarz или kierowca taksówki; стоянка — postój taksówek." }
  - { kind: usage, text: "Слово образовано от taksa «такса, тариф» с уменьшительным суффиксом -ówka, как и русское «таксомотор» в старину." }
collocations:
  - { pl: "wziąć taksówkę", ru: "взять такси" }
  - { pl: "jechać taksówką", ru: "ехать на такси" }
  - { pl: "postój taksówek", ru: "стоянка такси" }
family:
  - { pl: "taksówkarz", ru: "таксист", relation: root }
  - { pl: "samochód", ru: "машина", relation: root, id: samochod }
etymology: "От taksa «такса, тариф» с суффиксом -ówka. Русское «такси» — усечение французского taximètre, поэтому оно не склоняется, а польское слово склоняется полностью."
memory: "taksówka — «такси», но в отличие от русского оно склоняется: wezmę taksówkę, jadę taksówką, wysiadłem z taksówki. Таксист — taksówkarz."
