notes:
  - { kind: usage, text: "Просят о помощи через предлог o: prosić o pomoc, poprosić kogoś o pomoc." }
  - { kind: usage, text: "Два оборота «с помощью»: za pomocą czegoś — о средстве (za pomocą noża), przy pomocy kogoś — о человеке (przy pomocy brata)." }
  - { kind: usage, text: "Во множественном числе pomoce значит «пособия»: pomoce naukowe — «учебные пособия»." }
collocations:
  - { pl: "prosić o pomoc", ru: "просить о помощи" }
  - { pl: "na pomoc!", ru: "на помощь!" }
  - { pl: "pierwsza pomoc", ru: "первая помощь" }
  - { pl: "z pomocą", ru: "на помощь, с помощью" }
etymology: "Праславянское *pomogtь; русское «помощь» пришло со старославянским -щ-, а польское pomoc даёт закономерное -c-."
memory: "pomoc = «помощь», просят о ней с предлогом: prosić o pomoc. Различайте za pomocą czegoś «с помощью чего-то» и przy pomocy kogoś «с помощью кого-то»."
idioms:
  - { pl: "za pomocą", ru: "с помощью (чего-то)" }
  - { pl: "przy pomocy", ru: "с помощью (кого-то)" }
  - { pl: "iść z pomocą", ru: "прийти на помощь" }
