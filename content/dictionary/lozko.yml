# review
id: lozko
format: 2
lemma: "łóżko"
rank: 514
pos: noun
pron: { cyr: "уу́шко" }
senses:
  - id: bed
    ru: "кровать (мебель)"
    examples:
      - pl: "To jest łóżko."
        ru: "Это кровать."
        source: { kind: tatoeba, id: 12824958 }
      - pl: "To łóżko jest ciężkie."
        ru: "Эта кровать тяжёлая."
        source: { kind: tatoeba, id: 2784646 }
      - pl: "Chłopcy są pod łóżkiem."
        ru: "Мальчики под кроватью."
        source: { kind: tatoeba, id: 5322146 }
  - id: in-bed
    ru: "постель: место сна и болезни"
    examples:
      - pl: "Tom leży w łóżku."
        ru: "Том лежит в постели."
        source: { kind: tatoeba, id: 8768452 }
      - pl: "Mój mąż zawsze czyta w łóżku."
        ru: "Мой муж всегда читает в постели."
        source: { kind: tatoeba, id: 525638 }
      - pl: "Leży w łóżku z przeziębieniem."
        ru: "Она слегла с простудой."
        source: { kind: tatoeba, id: 841760 }
notes:
  - { kind: usage, text: "Одно слово покрывает русские «кровать» и «постель»: leżeć w łóżku «лежать в постели», iść do łóżka «идти спать»." }
  - { kind: usage, text: "Постель застилают: ścielić łóżko. Tom nigdy nie ścieli łóżka «Том никогда не застилает постель»." }
  - { kind: false-friend, text: "Рядом стоит łoże — книжное и торжественное «ложе» (łoże śmierci «смертное ложе»). В быту всегда łóżko." }
  - { kind: usage, text: "Русское «ложе» — то же самое слово, что łoże, а łóżko — его уменьшительное. Корень тот же, что в leżeć «лежать»." }
collocations:
  - { pl: "iść do łóżka", ru: "идти спать" }
  - { pl: "leżeć w łóżku", ru: "лежать в постели" }
  - { pl: "ścielić łóżko", ru: "застилать постель" }
  - { pl: "podwójne łóżko", ru: "двуспальная кровать" }
etymology: "Уменьшительное от łoże «ложе», праславянское *lože, от *ležati «лежать». Русское «ложе» — то же самое слово."
memory: "łóżko — «кровать» и «постель» разом, а по происхождению это уменьшительное от łoże «ложе», от того же корня, что leżeć «лежать». Русское «ложе» — ровно то же слово, только в польском быту прижилась уменьшительная форма. Запомните обороты: iść do łóżka «идти спать», leżeć w łóżku «лежать в постели», ścielić łóżko «застилать постель»."
idioms:
  - { pl: "iść do łóżka", ru: "идти спать" }
  - { pl: "ścielić łóżko", ru: "застилать постель" }
  - { pl: "być przykutym do łóżka", ru: "быть прикованным к постели" }
