notes:
  - { kind: pronunciation, text: "Существительное мужское и личное, но в единственном числе берёт женские окончания: ŁOWCY, ŁOWCĘ, ŁOWCĄ, ŁOWCO. Во множественном возвращаются мужские: łowców, łowcom, łowcami, łowcach. Форма ŁOWCY при этом делает работу за пять падежей — родительный, дательный и предложный единственного плюс именительный и звательный множественного. Русскому эта смешанная модель знакома: «мужчина», «судья», «коллега» устроены так же." }
  - { kind: usage, text: "Суффикс -ca в польском живой и образует названия действующих лиц: ŁOWCA от łowić, KIEROWCA «водитель» от kierować, SPRZEDAWCA «продавец» от sprzedawać, WYKONAWCA «исполнитель», OBROŃCA «защитник». Все они склоняются по этому же смешанному образцу, так что выучив одно слово, получаешь целую группу. Отдельно отметим, что охотника с ружьём чаще называют MYŚLIWY, а łowca звучит шире и переносно: łowca talentów, łowca przygód." }
collocations:
  - { pl: "łowca talentów", ru: "охотник за талантами" }
  - { pl: "łowca nagród", ru: "охотник за наградами" }
  - { pl: "łowca przygód", ru: "искатель приключений" }
family:
  - { pl: "łowić", ru: "ловить", relation: root }
  - { pl: "łowiectwo", ru: "охота", relation: derived }
  - { pl: "połów", ru: "улов", relation: root }
etymology: "От ŁOWIĆ «ловить», из праславянского *loviti — то же слово, что русское «ловить», и суффикса -ca, который делает из глагола название действующего лица. Буквально это «ловец», и русское слово построено точно так же, только другим суффиксом. Из того же гнезда połów «улов» и łowiectwo «охота»."
memory: "Мужское, а окончания в единственном женские: łowcy, łowcę, łowcą — как «мужчина» и «судья». И łowcy — это сразу пять падежей."
