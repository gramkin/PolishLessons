# review
id: papier
format: 2
lemma: "papier"
rank: 1063
pos: noun
pron: { cyr: "па́пер" }
senses:
  - id: material
    ru: "бумага"
    examples:
      - pl: "Papier jest biały."
        ru: "Бумага белая."
        source: { kind: tatoeba, id: 611731 }
      - pl: "To dobry papier."
        ru: "Это хорошая бумага."
        source: { kind: tatoeba, id: 5909174 }
      - pl: "Potrzebuję papieru."
        ru: "Мне нужна бумага."
        source: { kind: tatoeba, id: 6309259 }
  - id: documents
    ru: "papiery — документы, бумаги"
    examples:
      - pl: "Gdzie są twoje papiery?"
        ru: "Где твои документы?"
        source: { kind: translated, id: 10570797 }
      - pl: "Skończył porządkowanie papierów."
        ru: "Он закончил разбирать бумаги."
        source: { kind: translated, id: 355479 }
  - id: on-paper
    ru: "na papierze — на бумаге (в противоположность делу)"
    examples:
      - pl: "On jest premierem na papierze, ale nie w rzeczywistości."
        ru: "Он премьер на бумаге, но не на деле."
        source: { kind: translated, id: 2159752 }
      - pl: "Wszystko wygląda dobrze na papierze."
        ru: "На бумаге всё выглядит хорошо."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Мужской род неодушевлённый: ten papier, tego papieru." }
  - { kind: usage, text: "Множественное papiery очень часто значит «документы»: Gdzie są twoje papiery? «Где твои документы?». Так же и papiery wartościowe «ценные бумаги»." }
  - { kind: false-friend, text: "Родственное papieros значит «сигарета», а не «папироса с мундштуком» — это обычная сигарета. А «папка» по-польски teczka." }
  - { kind: usage, text: "na papierze «на бумаге» — о том, что существует только формально: dobry plan na papierze." }
collocations:
  - { pl: "papier toaletowy", ru: "туалетная бумага" }
  - { pl: "papiery wartościowe", ru: "ценные бумаги" }
  - { pl: "na papierze", ru: "на бумаге" }
  - { pl: "kartka papieru", ru: "лист бумаги" }
family:
  - { pl: "papierowy", ru: "бумажный", relation: derived }
  - { pl: "papieros", ru: "сигарета", relation: derived }
  - { pl: "papierek", ru: "бумажка", relation: derived }
etymology: "Через немецкое Papier и латинское papyrus из греческого papyros — то же слово, что русский «папирус». Русская «бумага» пришла совсем другим путём, из итальянского через тюркские языки."
memory: "papier — «бумага», мужского рода: ten papier. Множественное papiery чаще всего значит «документы»: Gdzie są twoje papiery? И запомните родственное papieros — это «сигарета»."
idioms:
  - { pl: "na papierze", ru: "на бумаге" }
  - { pl: "blady jak papier", ru: "бледный как бумага" }
  - { pl: "papier wszystko przyjmie", ru: "бумага всё стерпит" }
