etymology: "От ÓWCZESNY «тогдашний», в котором соединились старое местоимение ÓW «тот» и CZAS «время»: буквально «того времени»."
memory: "ów + czas = «тот час»: ówcześnie — «в то время». Книжный брат слова wtedy."
idioms:
