id: owczesnie
format: 2
lemma: "ówcześnie"
rank: 5778
pos: adv
pron: { cyr: "уфче́сьне" }
senses:
  - id: then
    ru: "тогда, в то время"
    note: "о прошлом, книжное"
    examples:
      - pl: "Ówcześnie sądzono, że to niemożliwe."
