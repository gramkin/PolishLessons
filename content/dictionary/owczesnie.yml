notes:
  - { kind: register, text: "Слово книжное: его встречают в учебниках истории, биографиях, статьях о прошлом. В разговоре говорят WTEDY или WÓWCZAS." }
  - { kind: usage, text: "Наречие от прилагательного ÓWCZESNY «тогдашний». Часто стоит перед причастием: ÓWCZEŚNIE PANUJĄCY «правивший тогда», ÓWCZEŚNIE OBOWIĄZUJĄCY «действовавший тогда»." }
  - { kind: pronunciation, text: "Читается «уфче́сьне»: Ó — «у», W перед глухим CZ оглушается в «ф», Ś — мягкое «сь». Ударение на предпоследний слог." }
collocations:
  - { pl: "ówcześnie panujący", ru: "правивший тогда" }
  - { pl: "ówcześnie obowiązujące przepisy", ru: "действовавшие тогда правила" }
  - { pl: "jak ówcześnie mówiono", ru: "как тогда говорили" }
family:
