      - pl: "Miasto liczyło ówcześnie zaledwie kilka tysięcy mieszkańców."
        ru: "В то время в городе было всего несколько тысяч жителей."
        source: { kind: authored }
      - pl: "Ówcześnie panujący król nie lubił zmian."
        ru: "Правивший тогда король не любил перемен."
        source: { kind: authored }
      - pl: "Podróż do Gdańska trwała ówcześnie cały tydzień."
        ru: "Поездка в Гданьск занимала тогда целую неделю."
