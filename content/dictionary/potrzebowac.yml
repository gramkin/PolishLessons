# review
id: potrzebowac
format: 2
lemma: "potrzebować"
rank: 111
pos: verb
aspect: imperf
pron: { cyr: "потшэбо́ваць" }
senses:
  - id: need
    ru: "нуждаться в чём-либо (+ родительный падеж)"
    note: "Подлежащее — тот, кто нуждается: Potrzebuję pomocy «Мне нужна помощь»."
    examples:
      - pl: "Potrzebuję noża."
        ru: "Мне нужен нож."
        source: { kind: tatoeba, id: 3049827 }
      - pl: "Potrzebuję pomocy."
        ru: "Мне нужна помощь."
        source: { kind: tatoeba, id: 1591778 }
      - pl: "Potrzebuję wody."
        ru: "Мне нужна вода."
        source: { kind: tatoeba, id: 8500256 }
  - id: need-someone
    ru: "нуждаться в ком-либо; быть нужным"
    examples:
      - pl: "Tom nas potrzebuje."
        ru: "Мы нужны Тому."
        source: { kind: tatoeba, id: 3851806 }
      - pl: "Potrzebujemy łyżek."
        ru: "Нам нужны ложки."
        source: { kind: tatoeba, id: 13679689 }
      - pl: "Potrzebuję papieru."
        ru: "Мне нужна бумага."
        source: { kind: tatoeba, id: 6309259 }
notes:
  - { kind: government, text: "potrzebować требует родительного падежа: potrzebuję wody, potrzebuję pomocy. Русское «мне нужна вода» перестраивается: подлежащим становится тот, кто нуждается." }
  - { kind: usage, text: "Тот же смысл передаёт прилагательное potrzebny: Potrzebna mi pomoc «Мне нужна помощь» — здесь конструкция ближе к русской." }
  - { kind: usage, text: "Причастие potrzebujący значит «нуждающийся»: pomoc dla potrzebujących «помощь нуждающимся»." }
collocations:
  - { pl: "potrzebować pomocy", ru: "нуждаться в помощи" }
  - { pl: "potrzebować czasu", ru: "нуждаться во времени" }
  - { pl: "nie potrzebuję", ru: "мне не нужно" }
  - { pl: "w razie potrzeby", ru: "в случае необходимости" }
etymology: "От potrzeba «потребность, нужда» (приставка po- + trzeba); то же слово, что русское «потреба, потребность»."
memory: "Конструкция перестраивается: русское «мне нужна помощь» — это Potrzebuję pomocy, где нуждающийся становится подлежащим, а нужное стоит в родительном падеже."
idioms:
  - { pl: "w razie potrzeby", ru: "в случае необходимости" }
  - { pl: "potrzebny jak powietrze", ru: "нужен как воздух" }
  - { pl: "chory niewiele potrzebuje, ale dużo kosztuje", ru: "больной немного требует, да дорого обходится" }
