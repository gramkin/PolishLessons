# review
id: rozwiazac
format: 2
lemma: "rozwiązać"
rank: 724
pos: verb
aspect: perf
pron: { cyr: "розвьо́нзаць" }
senses:
  - id: solve
    ru: "решить (задачу, проблему), разгадать"
    examples:
      - pl: "Pomożecie mi rozwiązać tę zagadkę?"
        ru: "Вы поможете мне разгадать эту загадку?"
        source: { kind: tatoeba, id: 12624929 }
      - pl: "Rozwiązałem ten problem bez trudu."
        ru: "Для меня не составило труда решить эту проблему."
        source: { kind: tatoeba, id: 933157 }
      - pl: "Rozwiąż problem."
        ru: "Реши задачу."
        source: { kind: translated, id: 5131824 }
  - id: untie
    ru: "развязать; распустить (о парламенте, организации)"
    note: "Буквальное значение корня: roz- + wiązać «вязать»."
    examples:
      - pl: "Krawat ci się rozwiązał."
        ru: "У тебя галстук развязался."
        source: { kind: translated, id: 12351168 }
      - pl: "Parlament został rozwiązany."
        ru: "Парламент был распущен."
        source: { kind: translated, id: 9679590 }
      - pl: "Rozwiązał sznurowadła."
        ru: "Он развязал шнурки."
        source: { kind: authored }
  - id: solution
    ru: "rozwiązanie — решение, выход"
    examples:
      - pl: "To nie najlepsze rozwiązanie."
        ru: "Это не лучшее решение."
        source: { kind: tatoeba, id: 3460263 }
      - pl: "Masz pięć minut na rozwiązanie problemu."
        ru: "У тебя есть пять минут на решение проблемы."
        source: { kind: tatoeba, id: 12712045 }
      - pl: "Nie ma rozwiązania."
        ru: "Решения нет."
        source: { kind: translated, id: 8458046 }
notes:
  - { kind: government, text: "rozwiązać coś «решить что-то» — винительный падеж: rozwiązać problem, rozwiązać zagadkę. Несовершенный вид — rozwiązywać." }
  - { kind: usage, text: "Корень буквальный: roz- + wiązać «вязать», то есть «развязать». Отсюда и «решить»: задача — это узел, который надо развязать. Русское «развязать» и «разрешить» устроены похоже." }
  - { kind: usage, text: "С się глагол значит «развязаться»: Krawat ci się rozwiązał «У тебя галстук развязался»." }
  - { kind: usage, text: "Об организациях и органах власти глагол значит «распустить»: Parlament został rozwiązany «Парламент был распущен», rozwiązać umowę «расторгнуть договор»." }
collocations:
  - { pl: "rozwiązać problem", ru: "решить проблему" }
  - { pl: "rozwiązać zagadkę", ru: "разгадать загадку" }
  - { pl: "rozwiązać umowę", ru: "расторгнуть договор" }
  - { pl: "rozwiązanie", ru: "решение" }
family:
  - { pl: "rozwiązywać", ru: "решать", relation: aspect }
  - { pl: "wiązać", ru: "вязать, связывать", relation: root }
  - { pl: "rozwiązanie", ru: "решение", relation: derived }
  - { pl: "związek", ru: "связь, союз", relation: derived }
etymology: "Из roz- + wiązać «вязать» — буквально «развязать». Русское «разрешить» и «развязать» устроены так же: задача мыслится как узел."
memory: "rozwiązać — «решить», но буквально «развязать»: внутри сидит wiązać «вязать». Отсюда и второе значение — развязать узел, и третье — распустить парламент или расторгнуть договор. Существительное rozwiązanie значит «решение, выход»."
idioms:
  - { pl: "rozwiązać problem", ru: "решить проблему" }
  - { pl: "rozwiązać zagadkę", ru: "разгадать загадку" }
  - { pl: "rozwiązać umowę", ru: "расторгнуть договор" }
