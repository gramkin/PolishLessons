# review
id: rocznik
format: 2
lemma: "rocznik"
rank: 5098
pos: noun
pron: { cyr: "ро́чник" }
senses:
  - id: birth-year
    ru: "год рождения; ровесники"
    examples:
      - pl: "Jestem rocznik osiemdziesiąty."
        ru: "Я восьмидесятого года рождения."
        source: { kind: authored }
      - pl: "Cały nasz rocznik poszedł do jednej szkoły."
        ru: "Все наши ровесники пошли в одну школу."
        source: { kind: authored }
      - pl: "Z jakiego jesteś rocznika?"
        ru: "Ты какого года рождения?"
        source: { kind: authored }
  - id: vintage
    ru: "год выпуска, винтаж; ежегодник, годовая подшивка"
    examples:
      - pl: "To wino to bardzo dobry rocznik."
        ru: "Это вино — очень удачный год урожая."
        source: { kind: authored }
      - pl: "W bibliotece są roczniki gazet."
        ru: "В библиотеке хранятся годовые подшивки газет."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ROCZNIK — «год рождения» и все люди этого года: MÓJ ROCZNIK — «мои ровесники». Возраст поляки часто называют так: JESTEM ROCZNIK DZIEWIĘĆDZIESIĄTY — «я девяностого года». У вина ROCZNIK — год урожая, у машины — год выпуска, а ещё это ежегодник: ROCZNIK STATYSTYCZNY. Годовщина — ROCZNICA, а не ROCZNIK." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Родительный — ROCZNIKA, с окончанием -A. В обороте «я такого-то года» слово стоит в именительном: JESTEM ROCZNIK OSIEMDZIESIĄTY." }
  - { kind: government, text: "Какого года рождения — Z JAKIEGO ROCZNIKA, Z с родительным. Того же года — Z TEGO SAMEGO ROCZNIKA. Ежегодник чего-то — ROCZNIK CZEGOŚ." }
  - { kind: pronunciation, text: "Читается «ро́чник», два слога, ударение на первом. CZ — «ч». В форме ROCZNIKU: «рочни́ку»." }
  - { kind: register, text: "В разговоре о возрасте ROCZNIK звучит естественно и чуть шутливо: DOBRY ROCZNIK, «хороший урожай», говорят и о людях. В документах год рождения — ROK URODZENIA." }
collocations:
  - { pl: "rocznik statystyczny", ru: "статистический ежегодник" }
  - { pl: "rocznik wina", ru: "год урожая вина" }
  - { pl: "mój rocznik", ru: "мои ровесники" }
family:
  - { pl: "rok", ru: "год", relation: root, id: rok }
  - { pl: "roczny", ru: "годовой, годичный", relation: derived }
  - { pl: "rocznica", ru: "годовщина", relation: derived, id: rocznica }
etymology: "От ROK «год», праславянского слова, у которого в русском остался только смысл «судьба»: «рок». В польском ROK — обычный календарный год, и от него ROCZNY «годовой», ROCZNICA «годовщина» и ROCZNIK."
memory: "Rocznik — год рождения или выпуска; ровесники; ежегодник. Читается «ро́чник». Jestem rocznik osiemdziesiąty — я восьмидесятого года. Dobry rocznik — удачный год. Годовщина — rocznica."
idioms:
  - { pl: "dobry rocznik", ru: "удачный год (о вине; шутл. о людях)" }
  - { pl: "z jednego rocznika", ru: "одного года рождения, ровесники" }
