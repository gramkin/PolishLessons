# review
id: biodro
format: 2
lemma: "biodro"
rank: 4529
pos: noun
pron: { cyr: "бьо́дро" }
senses:
  - id: hip
    ru: "тазобедренный сустав; бок, бёдра"
    examples:
      - pl: "Złamała biodro na oblodzonym chodniku."
        ru: "Она сломала шейку бедра на обледеневшем тротуаре."
        source: { kind: authored }
      - pl: "Wymiana biodra to częsta operacja."
        ru: "Замена тазобедренного сустава — частая операция."
        source: { kind: authored }
      - pl: "Ból w biodrze promieniuje do kolana."
        ru: "Боль в бедре отдаёт в колено."
        source: { kind: authored }
      - pl: "Spódnica jest za wąska w biodrach."
        ru: "Юбка узка в бёдрах."
        source: { kind: authored }
      - pl: "Oparł rękę na biodrze."
        ru: "Он упёр руку в бок."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "BIODRO — это тазобедренная область, «бок, бёдра» в смысле таза, а не «бедро»-ляжка. Ляжка, верхняя часть ноги — UDO. Руки в боки — RĘCE NA BIODRACH." }
  - { kind: usage, text: "Девять форм, средний род. Родительный множественного — BIODER, с беглым E. В местном падеже R смягчается в RZ: W BIODRZE." }
  - { kind: government, text: "Боль в бедре — BÓL BIODRA или BÓL W BIODRZE. Ударить бедром — UDERZYĆ BIODREM, творительный. Объём бёдер — OBWÓD BIODER." }
  - { kind: pronunciation, text: "Читается «бьо́дро», два слога, ударение на первом. BIO — один слог «бьо»." }
collocations:
  - { pl: "złamać biodro", ru: "сломать шейку бедра" }
  - { pl: "staw biodrowy", ru: "тазобедренный сустав" }
  - { pl: "ręce na biodrach", ru: "руки в боки" }
family:
  - { pl: "biodrowy", ru: "тазобедренный", relation: derived }
  - { pl: "biodrówki", ru: "джинсы с заниженной талией", relation: derived }
  - { pl: "staw biodrowy", ru: "тазобедренный сустав", relation: derived }
etymology: "Общеславянское слово, то же, что русское «бедро». Польское IO на месте русского «е», а значение сместилось вверх, к тазу."
memory: "Biodro — тазобедренная область, бок; udo — ляжка. Читается «бьо́дро». Ręce na biodrach — руки в боки. Kręcić biodrami — вилять бёдрами."
idioms:
  - { pl: "kręcić biodrami", ru: "вилять бёдрами" }
