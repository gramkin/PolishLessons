etymology: "Праславянское *vina — то же слово, что русское «вина»; с «вином» (wino, из латинского vinum) оно не связано совсем."
memory: "wina — «вина», а wino — «вино». Формы опасно похожи: butelka wina «бутылка вина», но to nie moja wina «это не моя вина»."
idioms:
