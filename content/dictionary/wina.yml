notes:
  - { kind: false-friend, text: "Опасное соседство: wina — «вина», а wino — «вино». Формы пересекаются: butelka wina «бутылка вина» (от wino), но to nie moja wina «это не моя вина»." }
  - { kind: usage, text: "zrzucać winę na kogoś — «сваливать вину на кого-то»; przyznać się do winy — «признать вину»; z czyjejś winy — «по чьей-то вине»." }
  - { kind: usage, text: "poczuwać się do winy — «чувствовать себя виноватым»; bez winy — «без вины»." }
collocations:
