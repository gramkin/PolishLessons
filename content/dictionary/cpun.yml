id: cpun
format: 2
lemma: "ćpun"
rank: 4424
pos: noun
pron: { cyr: "цьпун" }
senses:
  - id: junkie
    ru: "сленг наркоман, торчок"
    examples:
      - pl: "Pod mostem śpi jakiś ćpun."
        ru: "Под мостом спит какой-то торчок."
        source: { kind: authored }
      - pl: "Jego brat był ćpunem przez dziesięć lat."
        ru: "Его брат был наркоманом десять лет."
        source: { kind: authored }
      - pl: "Ćpuni kręcą się koło dworca."
        ru: "У вокзала крутятся наркоманы."
        source: { kind: authored }
  - id: addict-joke
    ru: "разг., шутл. фанат, «наркоман» (чего-то)"
    examples:
      - pl: "Jestem kawowym ćpunem, bez kawy nie żyję."
        ru: "Я кофейный наркоман, без кофе не живу."
        source: { kind: authored }
      - pl: "Ten ćpun serialowy obejrzał wszystko w tydzień."
        ru: "Этот сериальный наркоман посмотрел всё за неделю."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Русскому ĆPUN ничего не подсказывает, а слово частое в сленге. Оно от глагола ĆPAĆ, «колоться, употреблять наркотики». Нейтральное слово — NARKOMAN или OSOBA UZALEŻNIONA, «зависимый». ĆPUN — грубое и презрительное, как русское «торчок», «нарик»." }
  - { kind: usage, text: "Мужской род, одушевлённое, мужское-личное: ĆPUN, ĆPUNA, ĆPUNIE, множественное ĆPUNI с мягким NI. Винительный совпадает с родительным: ZOBACZYŁ ĆPUNA. Женский род — ĆPUNKA." }
  - { kind: government, text: "Наркоман со стажем — ĆPUN Z WIELOLETNIM STAŻEM, Z с творительным. Кофейный наркоман — KAWOWY ĆPUN, с прилагательным. Падежных требований существительное не имеет." }
  - { kind: pronunciation, text: "Читается «цьпун», один слог. Ć — мягкое «ць», сразу за ним P: скопление, которого нет в русском. Во множественном ĆPUNI: «цьпу́ни»." }
  - { kind: register, text: "Сленг, грубый и стигматизирующий. В разговоре о реальных людях с зависимостью лучше сказать OSOBA UZALEŻNIONA. Шутливое употребление — о сериалах, кофе, играх — распространено и обид не вызывает." }
collocations:
  - { pl: "stary ćpun", ru: "старый торчок" }
  - { pl: "kawowy ćpun", ru: "кофейный наркоман (шутл.)" }
  - { pl: "ćpun z dworca", ru: "наркоман с вокзала" }
family:
  - { pl: "ćpać", ru: "колоться, употреблять наркотики (сленг)", relation: root }
  - { pl: "narkoman", ru: "наркоман", relation: root }
  - { pl: "ćpunka", ru: "наркоманка (сленг)", relation: derived }
etymology: "От сленгового ĆPAĆ «употреблять наркотики», происхождение которого неясно: возможно, звукоподражательное или от диалектного «есть жадно, набивать рот». Слово появилось в польском молодёжном сленге семидесятых-восьмидесятых, когда наркотики стали заметной проблемой."
memory: "Ćpun — сленг: торчок, наркоман. Ćpać — колоться. И шутливо: kawowy ćpun — кофейный наркоман. Вежливо — osoba uzależniona. Читается «цьпун»."
idioms:
  - { pl: "kawowy ćpun", ru: "кофейный наркоман, кофеман" }
