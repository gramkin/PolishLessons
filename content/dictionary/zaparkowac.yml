# review
id: zaparkowac
format: 2
lemma: "zaparkować"
rank: 4246
pos: verb
pron: { cyr: "запарко́ваць" }
senses:
  - id: park
    ru: "припарковать(ся)"
    examples:
      - pl: "Zaparkowałem pod domem."
        ru: "Я припарковался у дома."
        source: { kind: authored }
      - pl: "Gdzie zaparkowałaś samochód?"
        ru: "Где ты припарковала машину?"
        source: { kind: authored }
      - pl: "Tu nie wolno zaparkować."
        ru: "Здесь нельзя парковаться."
        source: { kind: authored }
  - id: shelve
    ru: "отложить, «запарковать» (дело, проект) (разг.)"
    examples:
      - pl: "Zaparkujmy ten temat do jutra."
        ru: "Давайте отложим эту тему до завтра."
        source: { kind: authored }
      - pl: "Projekt zaparkowano na pół roku."
        ru: "Проект отложили на полгода."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ZAPARKOWAĆ — «припарковаться» и «припарковать машину» одновременно: польский не различает ZAPARKOWAĆ SAMOCHÓD и просто ZAPARKOWAĆ — оба говорят о водителе. Возвратного «-ся» нет: не ZAPARKOWAĆ SIĘ. Русское «парк» как сад — PARK, а «парковка» — PARKING." }
  - { kind: usage, text: "Пятьдесят три формы — подпись переходного глагола совершенного вида: страдательное ZAPARKOWANY, «припаркованный», и деепричастие ZAPARKOWAWSZY. Спряжение на -UJĘ: ZAPARKUJĘ, ZAPARKUJESZ. Видовой партнёр — PARKOWAĆ: TU NIE WOLNO PARKOWAĆ." }
  - { kind: government, text: "Где — NA и PRZY с местным падежом, POD, ZA и PRZED с творительным: ZAPARKOWAĆ NA PARKINGU, PRZY SKLEPIE, POD DOMEM, ZA ROGIEM. Что — винительный: ZAPARKOWAĆ AUTO, ROWER." }
  - { kind: pronunciation, text: "Читается «запарко́ваць», четыре слога, ударение на предпоследнем. R перед K отчётливое, W перед A — «в». Будущее ZAPARKUJĘ — «запарку́е»." }
  - { kind: register, text: "Нейтральное бытовое слово. В офисном жаргоне ZAPARKOWAĆ TEMAT — «отложить вопрос», калька с английского. На знаках: ZAKAZ PARKOWANIA — «стоянка запрещена»." }
collocations:
  - { pl: "zaparkować pod domem", ru: "припарковаться у дома" }
  - { pl: "źle zaparkowany", ru: "неправильно припаркованный" }
  - { pl: "zaparkować na parkingu", ru: "встать на парковке" }
family:
  - { pl: "parkować", ru: "парковать(ся)", relation: aspect }
  - { pl: "parking", ru: "парковка", relation: root, id: parking }
  - { pl: "parkowanie", ru: "парковка (действие)", relation: derived }
etymology: "От PARKOWAĆ, из английского TO PARK через немецкое PARKEN. Исходное PARK — «огороженная площадка», то же слово, что русский «парк». Приставка ZA- делает глагол совершенным."
memory: "Zaparkować — припарковаться: zaparkowałem pod domem. Без się! Źle zaparkowany — неправильно припаркованный. Читается «запарко́ваць»."
idioms:
  - { pl: "zaparkować temat", ru: "отложить вопрос" }
