notes:
  - { kind: usage, text: "Слово образовано ровно так же, как русское «переломный»: PRZEŁOM «перелом» + -OWY. Но польское шире. Кроме «переломного момента» оно постоянно значит «прорывной, новаторский»: PRZEŁOMOWE ODKRYCIE «прорывное открытие», PRZEŁOMOWA TECHNOLOGIA «прорывная технология». Русское «переломное открытие» так не скажешь, поэтому в переводе выбирают по контексту: момент и год переломные, открытие и работа прорывные." }
  - { kind: false-friend, text: "Само слово PRZEŁOM значит не только «перелом» в ходе событий. Перелом кости по-польски ZŁAMANIE, а не PRZEŁOM. Кроме того, PRZEŁOM это «рубеж» (NA PRZEŁOMIE WIEKÓW «на рубеже веков») и «теснина реки» (PRZEŁOM DUNAJCA). Прилагательное PRZEŁOMOWY связано только с первым значением, с поворотом и прорывом." }
  - { kind: pronunciation, text: "Читается «пшэуомо́вы»: PRZ даёт «пш», потому что RZ после глухого P оглушается, Ł звучит как «у». Ударение на предпоследнем слоге. Форма PRZEŁOMOWI (мужско-личное множественное, PRZEŁOMOWI TWÓRCY) совпадает с дательным падежом существительного PRZEŁOM: KU PRZEŁOMOWI «к перелому»." }
collocations:
  - { pl: "przełomowy moment", ru: "переломный момент" }
  - { pl: "przełomowe odkrycie", ru: "прорывное открытие" }
  - { pl: "przełomowa decyzja", ru: "поворотное решение" }
family:
  - { pl: "przełom", ru: "перелом, рубеж, прорыв", relation: root, id: przelom }
  - { pl: "przełamać", ru: "переломить, преодолеть", relation: root }
  - { pl: "przełomowość", ru: "новаторство, прорывной характер", relation: derived }
etymology: "От PRZEŁOM «перелом, поворот» с суффиксом -OWY. PRZEŁOM в свою очередь из PRZE- «пере-» и ŁOM, корня глагола ŁAMAĆ «ломать», то есть по составу это точное соответствие русскому «перелом»."
memory: "PRZE- = «пере-», ŁOM = «лом»: PRZEŁOMOWY = «переломный». Плюс второе значение, которого у русского слова нет: «прорывной» об открытиях."
idioms:
  - { pl: "moment przełomowy", ru: "переломный момент, поворотная точка" }
