# review
id: sledzic
format: 2
lemma: "śledzić"
rank: 1348
pos: verb
aspect: imperf
pron: { cyr: "сьле́дзиць" }
senses:
  - id: follow
    ru: "следить за кем-то, выслеживать"
    examples:
      - pl: "Policja mnie śledzi."
        ru: "Полиция за мной следит."
        source: { kind: translated, id: 3853634 }
      - pl: "Ktoś nas chyba śledzi."
        ru: "Кажется, за нами кто-то следит."
        source: { kind: translated, id: 4802004 }
      - pl: "Wiem, że on mnie śledzi."
        ru: "Я знаю, что он за мной следит."
        source: { kind: translated, id: 1165923 }
  - id: tail
    ru: "вести слежку, идти по пятам"
    examples:
      - pl: "Śledził go."
        ru: "Он за ним следил."
        source: { kind: translated, id: 12135510 }
      - pl: "Zatrudniła prywatnego detektywa, żeby śledzić męża."
        ru: "Она наняла частного детектива, чтобы следить за мужем."
        source: { kind: translated, id: 919650 }
      - pl: "Tom poprosił mnie, żebym śledził Mary."
        ru: "Том попросил меня следить за Мэри."
        source: { kind: translated, id: 3782947 }
  - id: track
    ru: "следить за ходом событий, отслеживать"
    examples:
      - pl: "Zenek zaczął uważnie śledzić przebieg akcji."
        ru: "Зенек начал внимательно следить за ходом действия."
        source: { kind: translated, id: 11254082 }
      - pl: "Śledzenie gangu było niebezpieczną przygodą."
        ru: "Слежка за бандой была опасным приключением."
        source: { kind: translated, id: 841701 }
      - pl: "Śledzenie amerykańskiej polityki jest ciekawe, zwłaszcza podczas wyborów prezydenckich."
        ru: "Следить за американской политикой интересно, особенно во время выборов."
        source: { kind: translated, id: 1351383 }
notes:
  - { kind: government, text: "śledzić kogoś «следить за кем-то» требует винительного падежа без предлога — в отличие от русского «следить за кем-то» с творительным." }
  - { kind: usage, text: "Второе значение нейтральное: «следить за ходом событий, отслеживать» — śledzić wiadomości «следить за новостями»." }
  - { kind: false-friend, text: "Форма śledź совпадает с существительным śledź «селёдка»: Zielony śledź wisiał na drzewie — это рыба, а не повеление." }
  - { kind: usage, text: "Рядом стоят śledztwo «следствие», карточка есть, и ślad «след»." }
collocations:
  - { pl: "śledzić kogoś", ru: "следить за кем-то" }
  - { pl: "śledzić wiadomości", ru: "следить за новостями" }
  - { pl: "być śledzonym", ru: "быть под слежкой" }
etymology: "От ślad «след», из праславянского *slědъ. Русское «следить» — то же слово, от того же «следа»."
memory: "śledzić — «следить», но управление другое: śledzić kogoś с винительным без предлога, тогда как русский требует «за кем-то». Осторожно: форма śledź совпадает с существительным śledź «селёдка»."
idioms:
  - { pl: "śledzić kogoś", ru: "следить за кем-то" }
  - { pl: "śledzić wiadomości", ru: "следить за новостями" }
  - { pl: "być śledzonym", ru: "быть под слежкой" }
