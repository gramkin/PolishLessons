notes:
  - { kind: false-friend, text: "LOTERIA — «лотерея», с IA на конце. Самая известная польская лотерея — LOTTO, с двумя T. Билет — LOS или KUPON: KUPIĆ LOS NA LOTERII." }
  - { kind: usage, text: "Женский род. Родительный, дательный и местный — LOTERII. Множественное — LOTERIE. Звательный и архаичное LOTERYJ не используем." }
  - { kind: government, text: "Выиграть в лотерею — WYGRAĆ NA LOTERII, NA с местным. Играть в лотерею — GRAĆ W LOTERIĘ, W с винительным. Билет лотереи — LOS NA LOTERIĘ." }
  - { kind: pronunciation, text: "Читается «лотэ́рья»: TE — твёрдое «тэ», RIA — «рья». Ударение на предпоследнем слоге." }
collocations:
