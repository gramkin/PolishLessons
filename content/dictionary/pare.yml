etymology: "Винительный падеж от para «пара», а то — через немецкое посредство из латинского par «равный». Русское «пара» — то же слово, и разговорное «пару дней» развилось так же."
memory: "parę — «несколько», а не «ровно два»: Daj mi parę dni «Дай мне несколько дней». Требует родительного множественного: parę razy, parę osób. В косвенных падежах и с мужским лицом — paru: potrzebujemy paru minut."
