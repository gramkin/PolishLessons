pron: { cyr: "па́рэ" }
senses:
  - id: a-few
    ru: "несколько, пара (о небольшом числе)"
    note: "Числительное значит «несколько», а не ровно два."
    examples:
      - pl: "Daj mi parę dni."
        ru: "Дай мне пару дней."
        source: { kind: tatoeba, id: 13106673 }
      - pl: "W szufladzie znalazłam tylko parę świec."
        ru: "В выдвижном ящике я нашла только пару свечей."
        source: { kind: tatoeba, id: 6406107 }
      - pl: "Zamówiliśmy parę nowych książek z zagranicy."
        ru: "Мы заказали несколько новых книг из-за границы."
        source: { kind: tatoeba, id: 2900632 }
  - id: oblique
    ru: "paru — несколько (косвенные падежи и мужской род)"
    examples:
      - pl: "Potrzebujemy paru minut."
        ru: "Нам нужно несколько минут."
        source: { kind: translated, id: 7703691 }
      - pl: "Nauczyłem się paru rzeczy."
        ru: "Я научился нескольким вещам."
        source: { kind: translated, id: 11610890 }
      - pl: "Spotkałam paru wędrowców na górze."
        ru: "Я встретила нескольких путников в горах."
        source: { kind: translated, id: 12180493 }
notes:
  - { kind: false-friend, text: "parę значит «несколько», а не обязательно «пара, два». Daj mi parę dni — «Дай мне несколько дней», а не «ровно два дня». Русское «пару дней» в разговорной речи ведёт себя так же." }
  - { kind: government, text: "После parę идёт родительный падеж множественного числа: parę dni, parę osób, parę razy." }
  - { kind: usage, text: "Форма paru употребляется в косвенных падежах и с мужским лицом: potrzebujemy paru minut, spotkałem paru kolegów." }
  - { kind: usage, text: "Не путайте с существительным para «пара, чета» (para butów «пара обуви») и para «пар». У числительного значение размытое — «сколько-то»." }
collocations:
