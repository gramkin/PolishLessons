notes:
  - { kind: false-friend, text: "Корень тот же, что в русском «свет», «светить», «свеча», и соответствие звуков здесь регулярное: польское ŚWIE- отвечает русскому СВЕ-. Польское Ś перед W произносится мягко, «сьв», поэтому ŚWIATŁO это «свет», ŚWIECA это «свеча», ŚWIECIĆ это «светить». Ловушка в другом слове того же вида: ŚWIĘTO с носовым Ę значит не «свет», а «праздник», от «святой», и ŚWIĘTY это «святой». Два гнезда, ŚWIAT-ŚWIECIĆ и ŚWIĘTY-ŚWIĘTO, различаются только носовым, и путать их нельзя: ŚWIECZKA это «свечка», а ŚWIĘCZKA не существует." }
  - { kind: usage, text: "Несовершенный вид, непереходный, пятьдесят две формы: сорок две от непереходного глагола и десять от действительного причастия ŚWIECĄCY «светящийся». Страдательного причастия нет, и это согласуется со значением: светит источник света, а не кто-то что-то. В значении «направлять свет» глагол тоже остаётся непереходным — светят не фонарик, а фонариком, то есть дополнение стоит в творительном. Не путать с ŚWIĘCIĆ «освящать, праздновать», у которого носовое Ę и другое гнездо; совершенный вид ŚWIECIĆ образует приставками: ZAŚWIECIĆ «зажечь, засветить», POŚWIECIĆ «посветить»." }
  - { kind: government, text: "Непереходный. Чем светить — творительный без предлога: ŚWIECIĆ LATARKĄ, ŚWIECIĆ TELEFONEM, в точности как русское «светить фонариком». Куда — W с винительным: ŚWIECIĆ W OCZY «светить в глаза», ŚWIECIĆ W KĄT. Где — W с местным: W KORYTARZU ŚWIECI ŻARÓWKA. Устойчивое ŚWIECIĆ PRZYKŁADEM значит «служить примером», буквально «светить примером», и творительный там тот же. Выражение ŚWIECIĆ PUSTKAMI, дословно «светить пустотами», значит «пустовать, стоять пустым»: о зале, гостинице, магазине." }
  - { kind: pronunciation, text: "Читается «сьве́циць», два слога, ударение на первом. Начальное ŚW это мягкое «сьв», одним движением, без гласного между согласными. Сочетание CI перед гласным даёт мягкое «ць», поэтому второй слог звучит «циць». В форме ŚWIECĘ носовое Ę на конце звучит как «э» с носовым призвуком: «сьве́цэ». В причастии ŚWIECĄCY носовое Ą перед C даёт «он»: «сьвецо́нцы». Будущее сложное ставится так же, как у всех несовершенных: BĘDĘ ŚWIECIĆ." }
