etymology: "Из праславянского *světiti, от того же *světъ, что дал русский «свет». Польское ŚWIE- и русское СВЕ- — закономерное соответствие, и оно связывает целый ряд слов: ŚWIATŁO и «свет», ŚWIECA и «свеча», ŚWIT и «рассвет», ŚWIECIĆ и «светить». Отдельно стоит ŚWIAT «мир»: это то же слово «свет», но в старом значении «белый свет, мир», которое русский сохранил во втором смысле — «обойти весь свет». Рядом лежит омонимичное на вид гнездо от *svętъ «святой», давшее ŚWIĘTY и ŚWIĘTO «праздник»; в праславянском это был другой корень с носовым гласным, и польский носовое Ę сохранил, а русский передал через Я в «святом». Поэтому различие ŚWIECIĆ и ŚWIĘCIĆ не прихоть орфографии, а память о двух разных словах."
memory: "Корень тот же, что в русском «свет»: ŚWIE- отвечает СВЕ-, отсюда światło «свет», świeca «свеча», świecić «светить». Светят чем — творительным, как в русском: świecić latarką. Главное — не спутать с święcić «освящать»: там носовое ę, и это гнездо от «святого», где русский даёт Я (święty «святой», święto «праздник»). Пятьдесят две формы: сорок две непереходного глагола плюс десять причастия świecący. Запомнить оборот świecić pustkami — «пустовать»."
idioms:
