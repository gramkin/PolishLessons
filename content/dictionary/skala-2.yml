senses:
  - id: scale-map
    ru: "масштаб (карты, модели)"
    examples:
      - pl: "W jakiej skali jest ta mapa?"
        ru: "Каков масштаб этой карты?"
        source: { kind: tatoeba, id: 11268998 }
      - pl: "Potrzebuję mapy Teksasu w skali 1:250000."
        ru: "Мне нужна карта Техаса в масштабе 1:250000."
        source: { kind: translated, id: 1251238 }
      - pl: "Chciałbym mapę Teksasu w skali 1:250 tys."
        ru: "Я хотел бы карту Техаса в масштабе 1:250 тыс."
        source: { kind: translated, id: 404006 }
  - id: scale-extent
    ru: "размах, шкала"
    examples:
      - pl: "On prowadzi interesy na wielką skalę."
        ru: "Он ведёт дела с большим размахом."
        source: { kind: translated, id: 734260 }
      - pl: "Jego IQ jest poza skalą."
        ru: "Его IQ за пределами шкалы."
        source: { kind: translated, id: 12602372 }
notes:
  - { kind: false-friend, text: "Два разных слова, один ASCII-идентификатор: skala «масштаб, шкала» и skała «скала, утёс» различаются только буквой ł. Отсюда id skala-2. Карточка skała — о камне." }
  - { kind: usage, text: "na wielką skalę «в большом масштабе, с размахом», na szeroką skalę «широкомасштабно» — очень частые обороты." }
  - { kind: government, text: "Женский род: ta skala, tej skali. В каком масштабе — w skali с предложным." }
  - { kind: usage, text: "Есть и музыкальное значение: ćwiczyć skalę «играть гамму»." }
collocations:
  - { pl: "na wielką skalę", ru: "в большом масштабе" }
  - { pl: "w skali", ru: "в масштабе" }
etymology: "Из итальянского scala «лестница, шкала» через латынь; русское «шкала» и «масштаб» пришли тем же путём."
memory: "skala — «масштаб, шкала», а skała (с чёрточкой) — «скала». В латинице они сливаются, отсюда id skala-2. Запомните na wielką skalę «с размахом»."
idioms:
  - { pl: "na wielką skalę", ru: "в большом масштабе" }
  - { pl: "w skali", ru: "в масштабе" }
formExamplesSkip:
  - { form: "skalo", reason: "звательная форма, а skala — это масштаб, шкала или гамма. Обращаться к ней некому, поэтому форма остаётся только в таблице склонения" }
  - { form: "skale", cell: "Звательный", reason: "звательный падеж: к предмету или понятию не обращаются" }
