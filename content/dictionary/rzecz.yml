# review
id: rzecz
format: 2
lemma: "rzecz"
rank: 128
pos: noun
pron: { cyr: "жэч" }
senses:
  - id: thing
    ru: "вещь, предмет"
    examples:
      - pl: "Ktoś ukradł moje rzeczy."
        ru: "Кто-то украл мои вещи."
        source: { kind: tatoeba, id: 6324421 }
      - pl: "A gdzie wasze rzeczy?"
        ru: "А где ваши вещи?"
        source: { kind: tatoeba, id: 10747402 }
      - pl: "Jestem za stary na takie rzeczy."
        ru: "Я слишком стар для таких вещей."
        source: { kind: tatoeba, id: 3579263 }
  - id: matter
    ru: "вещь как дело, явление, обстоятельство"
    examples:
      - pl: "Nie wierzę w takie rzeczy."
        ru: "Я не верю в такие вещи."
        source: { kind: tatoeba, id: 13785920 }
      - pl: "Działy się tam dziwne rzeczy."
        ru: "Там происходили странные вещи."
        source: { kind: tatoeba, id: 709413 }
      - pl: "Może mówić takie rzeczy."
        ru: "Он может такое сказать."
        source: { kind: tatoeba, id: 2145983 }
notes:
  - { kind: false-friend, text: "rzecz — это «вещь» или «дело», а не «речь». Русская «речь» по-польски mowa, а «выступление» — przemówienie." }
  - { kind: usage, text: "w rzeczy samej — «в самом деле»; rzecz jasna — «ясное дело»; mówić do rzeczy — «говорить по делу»." }
collocations:
  - { pl: "w rzeczy samej", ru: "в самом деле" }
  - { pl: "rzecz jasna", ru: "ясное дело" }
  - { pl: "takie rzeczy", ru: "такие вещи" }
  - { pl: "rzecz w tym, że", ru: "дело в том, что" }
etymology: "Праславянское *rěčь от *rekti «говорить» — то же слово, что русское «речь», но значения разошлись: в польском осталось «вещь, дело»."
memory: "Ложный друг: rzecz — «вещь» или «дело», а русская «речь» — это mowa. Родство видно только в этимологии (rzec «сказать»)."
idioms:
  - { pl: "do rzeczy", ru: "ближе к делу; по делу" }
  - { pl: "gadać od rzeczy", ru: "говорить невпопад" }
  - { pl: "coś jest na rzeczy", ru: "тут что-то есть, дело нечисто" }
