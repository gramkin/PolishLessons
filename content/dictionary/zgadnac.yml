# review
id: zgadnac
format: 2
lemma: "zgadnąć"
rank: 1285
pos: verb
aspect: perf
pron: { cyr: "зга́днонць" }
senses:
  - id: guess
    ru: "угадать"
    examples:
      - pl: "W życiu byś nie zgadł."
        ru: "Ты бы в жизни не угадал."
        source: { kind: tatoeba, id: 6156344 }
      - pl: "Tom zgadł dobrze."
        ru: "Том угадал верно."
        source: { kind: translated, id: 8792038 }
      - pl: "Nigdy bym nie zgadł."
        ru: "Я бы никогда не угадал."
        source: { kind: translated, id: 2279929 }
  - id: guess-imperative
    ru: "zgadnij! — угадай! (вводит загадку или новость)"
    examples:
      - pl: "Zgadnij!"
        ru: "Угадай!"
        source: { kind: translated, id: 7783288 }
      - pl: "Zgadnij, gdzie byłem."
        ru: "Угадай, где я был."
        source: { kind: translated, id: 6178072 }
      - pl: "Zgadnij kogo dzisiaj spotkałem!"
        ru: "Угадай, кого я сегодня встретил!"
        source: { kind: translated, id: 524698 }
  - id: cannot-guess
    ru: "не суметь угадать, не догадаться"
    examples:
      - pl: "Próbowałem zgadnąć, ile ona ma lat."
        ru: "Я пытался угадать, сколько ей лет."
        source: { kind: translated, id: 966918 }
      - pl: "Nie sposób zgadnąć, co on sobie myśli."
        ru: "Невозможно угадать, что он думает."
        source: { kind: translated, id: 966923 }
      - pl: "Nigdy nie zgadniesz, kogo spotkałem dziś rano."
        ru: "Ты никогда не угадаешь, кого я встретил сегодня утром."
        source: { kind: translated, id: 4158035 }
notes:
  - { kind: usage, text: "Zgadnij! «Угадай!» — самая частая форма: с неё начинают загадку или новость. Zgadnij, kogo spotkałem!" }
  - { kind: government, text: "zgadnąć coś «угадать что-то» — винительный падеж. С придаточным — zgadnąć, gdzie, kto или ile." }
  - { kind: usage, text: "Вид совершенный; несовершенный — zgadywać «угадывать, отгадывать». Существительное — zagadka «загадка»." }
  - { kind: pronunciation, text: "ą перед ć звучит как «он»: зга́днонць." }
collocations:
  - { pl: "zgadnij!", ru: "угадай!" }
  - { pl: "nigdy nie zgadniesz", ru: "никогда не угадаешь" }
  - { pl: "zgadnąć odpowiedź", ru: "угадать ответ" }
etymology: "Приставка z- и gadnąć от gadać «говорить»: буквально «договориться до правды». Русское «угадать» построено от «гадать»."
memory: "zgadnąć — «угадать». Самая живая форма — Zgadnij! «Угадай!», с неё начинают загадку или новость. Несовершенный вид — zgadywać, а существительное — zagadka «загадка»."
idioms:
  - { pl: "zgadnij!", ru: "угадай!" }
  - { pl: "nigdy nie zgadniesz", ru: "никогда не угадаешь" }
  - { pl: "zgadnij co", ru: "угадай что" }
