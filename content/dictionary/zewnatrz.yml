# review
id: zewnatrz
format: 2
lemma: "zewnątrz"
rank: 675
pos: prep
pron: { cyr: "зэ́внонтш" }
senses:
  - id: outside
    ru: "na zewnątrz — наружу, на улицу (движение)"
    note: "Chodź na zewnątrz «Выйди на улицу»."
    examples:
      - pl: "Chodź na zewnątrz."
        ru: "Выходи на улицу."
        source: { kind: tatoeba, id: 2155284 }
      - pl: "Wyjdźmy na zewnątrz."
        ru: "Давай выйдем на улицу."
        source: { kind: tatoeba, id: 6328360 }
      - pl: "Kiedy ostatni raz wychodziłeś na zewnątrz?"
        ru: "Ты когда последний раз на улицу выходил?"
        source: { kind: tatoeba, id: 13784964 }
  - id: out-there
    ru: "na zewnątrz — снаружи, на улице (место)"
    note: "Один и тот же оборот покрывает и движение, и место."
    examples:
      - pl: "Poczekaj na zewnątrz."
        ru: "Подожди снаружи."
        source: { kind: translated, id: 966921 }
      - pl: "Na zewnątrz jest zimno."
        ru: "Снаружи холодно."
        source: { kind: authored }
      - pl: "Czekali na zewnątrz budynku."
        ru: "Они ждали снаружи здания."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Самостоятельно слово не употребляется: оно живёт только в оборотах na zewnątrz «наружу, снаружи», z zewnątrz «извне», od zewnątrz «снаружи»." }
  - { kind: usage, text: "na zewnątrz покрывает сразу и движение, и место, где русский различает «наружу» и «снаружи»: Chodź na zewnątrz «Выйди на улицу», но Poczekaj na zewnątrz «Подожди снаружи»." }
  - { kind: government, text: "Если появляется дополнение, оно идёт в родительном: na zewnątrz domu «снаружи дома», na zewnątrz budynku." }
  - { kind: usage, text: "Пара к нему — wewnątrz «внутри»: na zewnątrz i wewnątrz «снаружи и внутри»." }
collocations:
  - { pl: "na zewnątrz", ru: "наружу, снаружи" }
  - { pl: "z zewnątrz", ru: "извне" }
  - { pl: "wewnątrz", ru: "внутри" }
  - { pl: "na zewnątrz domu", ru: "снаружи дома" }
family:
  - { pl: "wewnątrz", ru: "внутри", relation: root }
  - { pl: "zewnętrzny", ru: "внешний", relation: derived }
  - { pl: "wnętrze", ru: "нутро, интерьер", relation: root }
etymology: "От старого wnętrze «нутро» с приставкой — то же гнездо, что русские «нутро», «внутри» и «вне»."
memory: "zewnątrz само по себе не употребляется: оно живёт в обороте na zewnątrz, и этот один оборот покрывает оба русских слова — и «наружу» (Chodź na zewnątrz «Выйди на улицу»), и «снаружи» (Poczekaj na zewnątrz «Подожди снаружи»). Если нужно дополнение, идёт родительный: na zewnątrz domu. Пара к нему — wewnątrz «внутри»."
idioms:
  - { pl: "na zewnątrz", ru: "наружу, снаружи" }
  - { pl: "z zewnątrz", ru: "извне" }
  - { pl: "wewnątrz", ru: "внутри" }
