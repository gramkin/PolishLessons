notes:
  - { kind: false-friend, text: "Значение совпадает с русским «ритуалом», и пишется слово по тому же правилу, что RYTM: польское R твёрдое, сочетания RI не бывает, и латинское RITUS даёт RYT, а производное — RYTUAŁ. Главная же особенность здесь в парадигме, и она неожиданная: местный падеж звучит W RYTUALE, с обычным L вместо Ł. Правило то же, что в W FINALE от FINAŁ: окончание -E требует мягкой основы, а мягкой парой к Ł служит L. Все прочие формы сохраняют Ł: RYTUAŁU, RYTUAŁEM, RYTUAŁY." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Местный единственного — RYTUALE, с переходом Ł в L перед окончанием -E; родительный единственного — RYTUAŁU. Винительный равен именительному. Управление: RYTUAŁ CZEGO в родительном — RYTUAŁ PRZEJŚCIA, RYTUAŁ POGRZEBOWY строится прилагательным. В переносном значении слово употребляется с притяжательным местоимением: MÓJ PORANNY RYTUAŁ, и тогда оно означает личную привычку, повторяемую до мелочей." }
  - { kind: pronunciation, text: "Читается «рыту́ау», три слога, ударение на втором. Буква Y в первом слоге даёт «ы», а конечное Ł — «у» неслоговое, поэтому слово кончается на гласный звук. В форме RYTUAŁU слышно «рыту́ау», с тем же «у» в середине. А вот в форме RYTUALE буква L обычная и мягкая, и слово звучит «рыту́але» — местный падеж резко отличается от остальных форм именно этим. В форме RYTUAŁÓW буква Ó даёт «у», а конечное W оглушается, и слово звучит «рытуа́уф»." }
  - { kind: register, text: "Слово нейтральное, в прямом значении книжное и этнографическое, в переносном совершенно обиходное. Устойчивые сочетания: RYTUAŁ PRZEJŚCIA «обряд перехода», RYTUAŁ POGRZEBOWY, CODZIENNY RYTUAŁ, RYTUAŁ PARZENIA HERBATY. Прилагательное RYTUALNY значит «обрядовый, ритуальный»: TANIEC RYTUALNY. В разговоре о привычках слово звучит слегка иронически и тепло: TO JUŻ U NAS RYTUAŁ. Для церковного обряда есть и слово OBRZĘD, более торжественное и родное." }
