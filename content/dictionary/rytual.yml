etymology: "Из латинского RITUALIS «обрядовый», от RITUS «обряд, установленный порядок», а тот — от индоевропейского корня со значением «считать, соблюдать меру», родственного греческому ARITHMOS «число» и, через него, слову «арифметика». Исходная мысль — то, что делается по счёту, в заведённом порядке. Оба языка взяли слово из латыни церковной и научной. Польское написание через Y объясняется твёрдостью польского R, как в RYTM и RYZYKO, а конечное Ł — приспособлением латинского окончания -ALIS к польскому строю, где твёрдое L на конце слова закономерно стало Ł."
memory: "Пишется по тому же правилу, что rytm: польское r твёрдое, ri невозможно, латинское ritus даёт ryt- и rytuał. Главная неожиданность в парадигме: местный w rytuale, с обычным l вместо ł, потому что окончание -e требует мягкой основы — ровно как w finale от finał. Остальные формы сохраняют ł: rytuału, rytuałem. Из латинского ritualis, от ritus «заведённый порядок», и дальше от корня со значением «счёт» — дальняя родня арифметике."
