# review
id: obcy
format: 2
lemma: "obcy"
rank: 1054
pos: adj
pron: { cyr: "о́пцы" }
senses:
  - id: foreign
    ru: "иностранный, чужой"
    examples:
      - pl: "Uważam, że języki obce są bardzo ciekawe."
        ru: "Я считаю, что иностранные языки очень интересны."
        source: { kind: translated, id: 2495679 }
      - pl: "Aby opanować obcy język, trzeba mnóstwo ćwiczeń."
        ru: "Чтобы освоить иностранный язык, нужно много практики."
        source: { kind: translated, id: 629894 }
      - pl: "Jest prawie niemożliwe, aby nauczyć się języka obcego w krótkim czasie."
        ru: "Почти невозможно выучить иностранный язык за короткое время."
        source: { kind: translated, id: 2146158 }
  - id: stranger
    ru: "obcy — чужак, незнакомец (о человеке)"
    note: "Прилагательное свободно превращается в существительное."
    examples:
      - pl: "Pies szczeka na obcych."
        ru: "Собака лает на незнакомцев."
        source: { kind: translated, id: 360494 }
      - pl: "Do budynku wszedł obcy."
        ru: "В здание вошёл чужой."
        source: { kind: translated, id: 359220 }
      - pl: "Nie ufaj obcym."
        ru: "Не доверяй незнакомцам."
        source: { kind: translated, id: 961086 }
  - id: alien-to
    ru: "coś jest komuś obce — что-то кому-то чуждо"
    examples:
      - pl: "Człowiekiem jestem i nic co ludzkie nie jest mi obce."
        ru: "Я человек, и ничто человеческое мне не чуждо."
        source: { kind: translated, id: 13472044 }
      - pl: "Nienawiść wobec innych jest jej obca."
        ru: "Ненависть к другим ей чужда."
        source: { kind: translated, id: 2838301 }
      - pl: "Nie jest dla mnie obca."
        ru: "Она мне не чужая."
        source: { kind: translated, id: 734360 }
notes:
  - { kind: usage, text: "Прилагательное легко становится существительным: obcy «чужак, незнакомец», obcych «незнакомцев». Nie ufaj obcym «Не доверяй незнакомцам»." }
  - { kind: government, text: "coś jest komuś obce — «что-то кому-то чуждо», с дательным падежом: nic co ludzkie nie jest mi obce." }
  - { kind: usage, text: "język obcy — «иностранный язык». Порядок слов обычно такой: существительное, потом прилагательное." }
  - { kind: usage, text: "В фантастике obcy значит «инопланетянин»: kontakt z obcymi «контакт с пришельцами». Прямая противоположность — swój «свой»." }
collocations:
  - { pl: "język obcy", ru: "иностранный язык" }
  - { pl: "nie ufaj obcym", ru: "не доверяй незнакомцам" }
  - { pl: "obcy kraj", ru: "чужая страна" }
  - { pl: "jest mi obce", ru: "мне чуждо" }
family:
  - { pl: "swój", ru: "свой", relation: antonym, id: swoj }
  - { pl: "obcokrajowiec", ru: "иностранец", relation: derived }
  - { pl: "obczyzna", ru: "чужбина", relation: derived }
etymology: "Праславянское *obьtjь «общий, не свой» — родня русскому «общий», но значение перевернулось: из «общего» вышло «чужое»."
memory: "obcy — «чужой, иностранный», и прямая противоположность swój «свой». Слово легко становится существительным: obcy «чужак», nie ufaj obcym. А język obcy — «иностранный язык»."
idioms:
  - { pl: "język obcy", ru: "иностранный язык" }
  - { pl: "co swój, to nie obcy", ru: "свой своему поневоле брат" }
  - { pl: "nie ufaj obcym", ru: "не доверяй незнакомцам" }
