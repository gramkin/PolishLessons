notes:
  - { kind: false-friend, text: "LITERATURA — «литература», перевод прямой. Художественная литература — LITERATURA PIĘKNA. В научной работе LITERATURA — «источники»: PRZEGLĄD LITERATURY, «обзор литературы»." }
  - { kind: usage, text: "Девять живых форм, женский род. В местном падеже R переходит в RZ: W LITERATURZE. Множественное — о разных национальных литературах: LITERATURY SŁOWIAŃSKIE. Звательный не даётся." }
  - { kind: government, text: "В литературе — W LITERATURZE, местный. Литература о чём — LITERATURA O, и местный падеж. Нобелевская премия по литературе — NAGRODA NOBLA W DZIEDZINIE LITERATURY." }
  - { kind: pronunciation, text: "Читается «литэрату́ра», ударение на предпоследнем слоге. TE — твёрдое «тэ»." }
collocations:
  - { pl: "literatura piękna", ru: "художественная литература" }
  - { pl: "literatura polska", ru: "польская литература" }
  - { pl: "przegląd literatury", ru: "обзор литературы" }
