# review
id: falszywy
format: 2
lemma: "fałszywy"
rank: 1461
pos: adj
pron: { cyr: "фауши́вы" }
senses:
  - id: untrue
    ru: "ложный, неверный"
    examples:
      - pl: "Oba twierdzenia są fałszywe."
        ru: "Оба утверждения ложны."
        source: { kind: translated, id: 10707663 }
      - pl: "Plotka okazała się być fałszywa."
        ru: "Слух оказался ложным."
        source: { kind: translated, id: 3093111 }
      - pl: "Złożył policji fałszywe zeznania."
        ru: "Он дал полиции ложные показания."
        source: { kind: translated, id: 575389 }
  - id: fake
    ru: "поддельный, фальшивый; неискренний"
    examples:
      - pl: "Tom kupił piwo posługując się fałszywym dowodem osobistym."
        ru: "Том купил пиво, воспользовавшись поддельным удостоверением личности."
        source: { kind: translated, id: 10543392 }
      - pl: "Jesteś taki fałszywy!"
        ru: "Какой же ты фальшивый!"
        source: { kind: translated, id: 4789210 }
notes:
  - { kind: usage, text: "Одно слово покрывает три русских: «ложный» (fałszywe zeznania «ложные показания»), «поддельный» (fałszywy dokument) и «фальшивый» о звуке и о человеке." }
  - { kind: false-friend, text: "fałszywy przyjaciel — это и «неверный друг», и лингвистический термин «ложный друг переводчика». В словаре польского для русскоговорящих второй смысл встречается на каждом шагу." }
  - { kind: usage, text: "Антоним — prawdziwy «настоящий, истинный». Существительное — fałsz «фальшь, ложь», глагол — fałszować «подделывать, фальшивить»." }
  - { kind: usage, text: "Степени сравнения (fałszywszy, najfałszywszy) образуются, но в живой речи почти не встречаются." }
collocations:
  - { pl: "fałszywe zeznania", ru: "ложные показания" }
  - { pl: "fałszywy dokument", ru: "поддельный документ" }
  - { pl: "fałszywy alarm", ru: "ложная тревога" }
etymology: "Из латинского falsus «ложный» через немецкое falsch. Русское «фальшивый» пришло тем же немецким путём, поэтому слова совпадают."
memory: "fałszywy — «ложный, поддельный, фальшивый» сразу: fałszywe zeznania «ложные показания», fałszywy dokument «поддельный документ». Антоним — prawdziwy. И помните термин fałszywy przyjaciel — «ложный друг переводчика»."
idioms:
  - { pl: "fałszywy przyjaciel", ru: "ложный друг переводчика" }
  - { pl: "fałszywe zeznania", ru: "ложные показания" }
  - { pl: "fałszywy alarm", ru: "ложная тревога" }
