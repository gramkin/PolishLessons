notes:
  - { kind: usage, text: "PRZYTŁACZAJĄCY — действительное причастие настоящего времени от PRZYTŁACZAĆ «придавливать, подавлять», ставшее прилагательным. Оно точно соответствует русскому «подавляющий»: PRZYTŁACZAJĄCA WIĘKSZOŚĆ — «подавляющее большинство», PRZYTŁACZAJĄCA PRZEWAGA — «подавляющий перевес». Простых степеней сравнения нет: говорят BARDZIEJ PRZYTŁACZAJĄCY, NAJBARDZIEJ PRZYTŁACZAJĄCY." }
  - { kind: usage, text: "Во втором значении слово описывает то, что давит на психику: обстановку, тишину, новости, архитектуру. Русский здесь выбирает «гнетущий» или «удручающий», а не «подавляющий». Пару ему составляет страдательное PRZYTŁOCZONY «подавленный, придавленный»: PRZYTŁACZAJĄCE WIADOMOŚCI делают человека PRZYTŁOCZONYM." }
  - { kind: pronunciation, text: "Читается «пшытуачайо́нцы». RZ после P оглушается в «ш», Ł звучит как «у», а носовое Ą перед C даёт «он». Ударение на предпоследнем слоге, на JĄ: слогов пять, PRZY-TŁA-CZA-JĄ-CY. Мужско-личная форма множественного числа совпадает с именительным единственного: CI LUDZIE SĄ PRZYTŁACZAJĄCY." }
collocations:
  - { pl: "przytłaczająca większość", ru: "подавляющее большинство" }
  - { pl: "przytłaczająca cisza", ru: "гнетущая тишина" }
  - { pl: "przytłaczające wrażenie", ru: "гнетущее впечатление" }
family:
  - { pl: "przytłaczać", ru: "подавлять, придавливать", relation: root, id: przytlaczac }
  - { pl: "przytłoczyć", ru: "подавить, придавить", relation: root }
  - { pl: "przytłoczony", ru: "подавленный", relation: derived }
synonyms: ["przygniatający", "miażdżący", "druzgocący"]
etymology: "Причастие от PRZYTŁACZAĆ, где корень тот же, что в TŁOCZYĆ «давить, теснить» и TŁOK «давка», а приставка PRZY- придаёт значение «прижимать сверху»."
memory: "PRZYTŁACZAJĄCY — то, что давит, как толпа в TŁOK. Подавляющее большинство по-польски przytłaczająca większość, слово в слово."
idioms:
