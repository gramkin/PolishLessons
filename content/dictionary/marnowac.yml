# review
id: marnowac
format: 2
lemma: "marnować"
rank: 1979
pos: verb
pron: { cyr: "марно́ваць" }
senses:
  - id: waste
    ru: "тратить впустую (время, деньги, еду)"
    examples:
      - pl: "Nie marnuj czasu na kłótnie."
        ru: "Не трать время впустую на ссоры."
        source: { kind: authored }
      - pl: "Marnowali pieniądze na drobiazgi."
        ru: "Они тратили деньги впустую на мелочи."
        source: { kind: authored }
      - pl: "Marnowane jedzenie trafiało do kosza."
        ru: "Напрасно потраченная еда попадала в мусор."
        source: { kind: authored }
  - id: squander
    ru: "губить, растрачивать (талант, жизнь)"
    examples:
      - pl: "Marnuje talent na takiej posadzie."
        ru: "Он губит талант на такой должности."
        source: { kind: authored }
      - pl: "Marnowane latami życie trudno nadrobić."
        ru: "Загубленную годами жизнь трудно наверстать."
        source: { kind: authored }
  - id: wasting
    ru: "marnowanie — растрата, напрасная трата"
    examples:
      - pl: "Marnowanie jedzenia to wstyd."
        ru: "Выбрасывать еду — стыд."
        source: { kind: authored }
      - pl: "Po latach marnowania czasu wziął się do nauki."
        ru: "После лет напрасно потраченного времени он взялся за учёбу."
        source: { kind: authored }
notes:
  - { kind: pronunciation, text: "НАСТОЯЩЕЕ ВРЕМЯ ПО УЖЕ ЗНАКОМОМУ ПРАВИЛУ: глаголы на -ować берут -uj-, поэтому marnować даёт marnuję, marnujesz, marnuje. Так же pracować — pracuję и dziękować — dziękuję. Это тот же ряд, что и -ywać у zatrzymywać, и противоположность -awać у podawać, где выходит podaję." }
  - { kind: false-friend, text: "Корень здесь не самый очевидный: marnować идёт от marny «жалкий, тщетный, пустой», а то — от праславянского корня со значением «морок, наваждение», который в русском виден в словах «мара» и «марево». Связь дальняя, опереться на неё в речи трудно, так что слово проще выучить напрямую — зато производные прозрачны: zmarnować «растратить», zmarnowany «загубленный», marnotrawstwo «расточительство»." }
  - { kind: government, text: "Тратят впустую ЧТО — винительный: marnować czas, pieniądze, talent, jedzenie. На что — na с винительным: marnować pieniądze NA drobiazgi. Оба совпадают с русским «тратить что-то на что-то», так что строить фразу можно по родному образцу." }
  - { kind: usage, text: "Вид несовершенный, совершенная пара — zmarnować: marnował czas przez całe studia «он тратил время впустую все годы учёбы», но zmarnował szansę «упустил шанс». Причастие zmarnowany живёт самостоятельно и звучит горько: zmarnowane życie, zmarnowana okazja." }
collocations:
  - { pl: "marnować czas", ru: "тратить время впустую" }
  - { pl: "nie marnuj okazji", ru: "не упусти случая" }
  - { pl: "marnować talent", ru: "губить талант" }
family:
  - { pl: "zmarnować", ru: "растратить, загубить", relation: aspect }
  - { pl: "marny", ru: "жалкий, ничтожный", relation: root }
  - { pl: "marnotrawstwo", ru: "расточительство", relation: derived }
etymology: "От прилагательного marny «жалкий, пустой, тщетный», восходящего к праславянскому корню со значением «морок, призрак» — тому же, что в русских «мара» и «марево». Образ такой: истратить впустую значит обратить в морок, в ничто. Русский этот корень в глаголе не закрепил, поэтому marnować приходится запоминать отдельно."
memory: "marnować — «тратить впустую, губить»: marnować czas, talent, pieniądze. Настоящее время по правилу -ować: marnuję, marnujesz. Родственника в русском глаголе нет, зато от того же корня marny «жалкий» и zmarnowany «загубленный»."
idioms:
  - { pl: "marnować czas", ru: "тратить время впустую" }
  - { pl: "zmarnowana okazja", ru: "упущенная возможность" }
