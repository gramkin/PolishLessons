# review
id: swoj
format: 2
lemma: "swój"
rank: 59
pos: adj
pron: { cyr: "сфуй" }
senses:
  - id: own
    ru: "свой (принадлежащий подлежащему)"
    examples:
      - pl: "Zdradziłeś swój kraj."
        ru: "Ты предал свою страну."
        source: { kind: tatoeba, id: 6694862 }
      - pl: "Tom lubi swoją pracę."
        ru: "Том любит свою работу."
        source: { kind: tatoeba, id: 3703927 }
      - pl: "Bił swoje dzieci."
        ru: "Он бил своих детей."
        source: { kind: tatoeba, id: 3464135 }
  - id: own-cases
    ru: "свой (в косвенных падежах)"
    examples:
      - pl: "Nie umyłem swoich włosów."
        ru: "Я не помыл голову."
        source: { kind: tatoeba, id: 2809339 }
      - pl: "On gra w swoim pokoju."
        ru: "Он играет в своей комнате."
        source: { kind: tatoeba, id: 742353 }
notes:
  - { kind: usage, text: "Возвратно-притяжательное местоимение: владелец — подлежащее. On czyta swoją książkę «Он читает свою книгу», но On czyta jego książkę — книгу другого человека." }
  - { kind: usage, text: "Краткие формы swego, swej, swemu, swych книжные; в разговоре звучат полные swojego, swojej." }
collocations:
  - { pl: "swoją drogą", ru: "впрочем" }
  - { pl: "na swój sposób", ru: "по-своему" }
  - { pl: "robić swoje", ru: "делать своё дело" }
etymology: "Праславянское *svojь — то же слово, что русское «свой»."
memory: "Работает ровно как русское «свой» и по той же причине обязателен: On kocha swoją żonę «Он любит свою жену», а On kocha jego żonę — уже чужую. Ряд swego, swej, swemu, swych книжный."
idioms:
  - { pl: "robić swoje", ru: "делать своё дело" }
  - { pl: "wyjść na swoje", ru: "остаться при своих" }
  - { pl: "mieć swoje pięć minut", ru: "иметь свой звёздный час" }
