# review
id: deszcz
format: 2
lemma: "deszcz"
rank: 1767
pos: noun
pron: { cyr: "дэшч" }
senses:
  - id: rain
    ru: "дождь"
    examples:
      - pl: "Deszcz pada."
        ru: "Идёт дождь."
        source: { kind: tatoeba, id: 349034 }
      - pl: "Pada deszcz."
        ru: "Идёт дождь."
        source: { kind: tatoeba, id: 2826513 }
      - pl: "Po deszczu słońce wyszło zza chmur."
        ru: "После дождя солнце вышло из-за туч."
        source: { kind: tatoeba, id: 827776 }
  - id: shower
    ru: "дождь, ливень чего-либо (переносно)"
    examples:
      - pl: "Rośnie jak grzyby po deszczu."
        ru: "Он растёт как грибы после дождя."
        source: { kind: tatoeba, id: 12721026 }
      - pl: "Deszcze zrujnowały plony."
        ru: "Дожди погубили урожай."
        source: { kind: translated, id: 6903832 }
      - pl: "Deszcz lał się za kołnierz."
        ru: "Дождь лился за воротник."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Праславянское *dъždžь; отсюда старая форма deżdż, от которой и осталась книжная основа dżdż-. Русское «дождь» — то же слово." }
  - { kind: usage, text: "Предложный падеж po deszczu «после дождя» — в обороте rosnąć jak grzyby po deszczu «расти как грибы после дождя», ровно как в русском." }
  - { kind: usage, text: "wpaść z deszczu pod rynnę — «из огня да в полымя», буквально «из дождя под водосточную трубу»." }
  - { kind: usage, text: "kwaśny deszcz — «кислотный дождь»; deszcz pada и pada deszcz одинаково правильны." }
collocations:
  - { pl: "pada deszcz", ru: "идёт дождь" }
  - { pl: "po deszczu", ru: "после дождя" }
  - { pl: "kwaśny deszcz", ru: "кислотный дождь" }
  - { pl: "z deszczu pod rynnę", ru: "из огня да в полымя" }
etymology: "Праславянское *dъždžь, откуда старое deżdż и книжная основа dżdż-. Русское «дождь» — то же самое слово."
memory: "deszcz — «дождь», то же слово, что русское. Обороты совпадают: pada deszcz «идёт дождь», rosnąć jak grzyby po deszczu «расти как грибы после дождя». А вот идиома wpaść z deszczu pod rynnę буквально значит «попасть из дождя под водосточную трубу» — по-русски «из огня да в полымя»."
idioms:
  - { pl: "pada deszcz", ru: "идёт дождь" }
  - { pl: "rosnąć jak grzyby po deszczu", ru: "расти как грибы после дождя" }
  - { pl: "wpaść z deszczu pod rynnę", ru: "из огня да в полымя" }
