        ru: "Север страны холоднее."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Одно слово на два русских: «полночь» и «север» — зеркально к południe, которое значит и «полдень», и «юг»." }
  - { kind: government, text: "o północy «в полночь» — предложный падеж; przed północą «до полуночи» — творительный; na północ «на север» о направлении, na północy «на севере» о месте." }
  - { kind: usage, text: "Разбирается прозрачно: pół + noc, буквально «полночи». Русская «полночь» собрана ровно так же." }
  - { kind: usage, text: "Прилагательное — północny «северный, полуночный»: Ameryka Północna «Северная Америка»." }
collocations:
  - { pl: "o północy", ru: "в полночь" }
  - { pl: "przed północą", ru: "до полуночи" }
  - { pl: "na północ", ru: "на север" }
  - { pl: "na północy", ru: "на севере" }
family:
  - { pl: "północny", ru: "северный", relation: derived }
  - { pl: "południe", ru: "юг, полдень", relation: antonym, id: poludnie }
  - { pl: "noc", ru: "ночь", relation: root }
etymology: "Прозрачно из pół + noc «полночи» — ровно как русская «полночь». Значение «север» пришло по противоположности: południe значит и «полдень», и «юг», значит północ значит и «полночь», и «север»."
memory: "północ — «полночь» и «север» сразу, зеркально к południe. o północy «в полночь», przed północą «до полуночи», na północ «на север», na północy «на севере»."
idioms:
