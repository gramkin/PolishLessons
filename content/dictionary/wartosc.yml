# review
id: wartosc
format: 2
lemma: "wartość"
rank: 1683
pos: noun
pron: { cyr: "ва́ртосьць" }
senses:
  - id: worth
    ru: "ценность, стоимость"
    examples:
      - pl: "To książka o wielkiej wartości."
        ru: "Это книга большой ценности."
        source: { kind: translated, id: 905915 }
      - pl: "Jaka jest wartość tego domu?"
        ru: "Какова стоимость этого дома?"
        source: { kind: translated, id: 11561135 }
      - pl: "Wartość tego się potroiła."
        ru: "Его стоимость утроилась."
        source: { kind: translated, id: 448998 }
  - id: moral
    ru: "ценность (моральная), ценности"
    examples:
      - pl: "Cnota jest wartością samą w sobie."
        ru: "Добродетель — ценность сама по себе."
        source: { kind: translated, id: 13661960 }
      - pl: "Nie mam poczucia własnej wartości."
        ru: "У меня нет чувства собственного достоинства."
        source: { kind: translated, id: 4534293 }
  - id: number
    ru: "значение, величина (число)"
    examples:
      - pl: "Ta zmienna ma złą wartość."
        ru: "У этой переменной неверное значение."
        source: { kind: translated, id: 3457048 }
      - pl: "Proszę sprawdzić, czy te wartości się zgadzają."
        ru: "Проверьте, пожалуйста, сходятся ли эти значения."
        source: { kind: translated, id: 355577 }
notes:
  - { kind: usage, text: "Во множественном числе wartości — это обычно «ценности» в моральном смысле: wartości rodzinne «семейные ценности»." }
  - { kind: false-friend, text: "wartość — это «ценность, стоимость», то есть сколько вещь стоит по сути, а cena — «цена», сколько за неё просят. Ośmioletni samochód jest praktycznie bez wartości, но cena у него всё равно какая-то есть." }
  - { kind: usage, text: "poczucie własnej wartości — «чувство собственного достоинства», самооценка; буквально «чувство собственной ценности»." }
  - { kind: government, text: "Ценность чего-либо — wartość czegoś (родительный падеж): wartość domu, wartość pracy." }
collocations:
  - { pl: "wartość odżywcza", ru: "пищевая ценность" }
  - { pl: "poczucie własnej wartości", ru: "чувство собственного достоинства" }
  - { pl: "bez wartości", ru: "ничего не стоящий" }
family:
  - { pl: "wart", ru: "стоящий, достойный", relation: root, id: wart }
  - { pl: "wartościowy", ru: "ценный", relation: root }
etymology: "От warty «стоящий» (ср. wart «стоит»), заимствованного из германского; тот же корень, что в немецком wert. Русское «ценность» построено иначе — от «цена»."
memory: "wartość — «ценность, стоимость»: сколько вещь стоит по сути. Цена, которую просят, — это cena. Во множественном числе wartości — «ценности» моральные, а в математике — «значения»."
idioms:
