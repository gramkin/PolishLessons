# review
id: rozmawiac
format: 2
lemma: "rozmawiać"
rank: 200
pos: verb
aspect: imperf
pron: { cyr: "розма́вяць" }
senses:
  - id: talk
    ru: "разговаривать, беседовать (с кем-либо)"
    note: "rozmawiać z kimś — с предлогом z и творительным, как в русском."
    examples:
      - pl: "Z kim rozmawiam?"
        ru: "С кем я разговариваю?"
        source: { kind: tatoeba, id: 526814 }
      - pl: "Ona ze mną nie rozmawia."
        ru: "Она со мной не разговаривает."
        source: { kind: tatoeba, id: 357829 }
      - pl: "Tom z nikim nie rozmawia."
        ru: "Том ни с кем не разговаривает."
        source: { kind: tatoeba, id: 3584665 }
  - id: talk-about
    ru: "разговаривать о чём-либо; говорить по телефону"
    examples:
      - pl: "Rozmawiają przez telefon."
        ru: "Они говорят по телефону."
        source: { kind: tatoeba, id: 6017175 }
      - pl: "Rzadko rozmawiam z Tomem"
        ru: "Я редко говорю с Томом."
        source: { kind: tatoeba, id: 10748492 }
      - pl: "Nie rozmawiaj ze mną."
        ru: "Не разговаривай со мной."
        source: { kind: tatoeba, id: 11584580 }
notes:
  - { kind: government, text: "rozmawiać z kimś o czymś — предлоги те же, что в русском: с кем-то о чём-то." }
  - { kind: usage, text: "rozmawiać — «разговаривать» (обоюдно), mówić — «говорить, произносить». Mówię po polsku «Говорю по-польски», но Rozmawiam z bratem «Разговариваю с братом»." }
  - { kind: usage, text: "Существительное — rozmowa «разговор»; rozmowa telefoniczna — «телефонный разговор»." }
collocations:
  - { pl: "rozmawiać z kimś", ru: "разговаривать с кем-то" }
  - { pl: "rozmawiać o czymś", ru: "говорить о чём-то" }
  - { pl: "rozmawiać przez telefon", ru: "говорить по телефону" }
  - { pl: "nie ma o czym rozmawiać", ru: "не о чем говорить" }
etymology: "Приставка roz- + mawiać (от mówić «говорить»); существительное — rozmowa «разговор»."
memory: "rozmawiać z kimś o czymś — предлоги те же, что в русском. Но не путайте с mówić: Mówię po polsku «Говорю по-польски», а Rozmawiam z bratem «Разговариваю с братом»."
idioms:
  - { pl: "nie ma o czym rozmawiać", ru: "не о чем говорить" }
  - { pl: "rozmawiać jak równy z równym", ru: "говорить на равных" }
  - { pl: "rozmawiać przez telefon", ru: "говорить по телефону" }
