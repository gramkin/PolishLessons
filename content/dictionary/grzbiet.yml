# review
id: grzbiet
format: 2
lemma: "grzbiet"
rank: 6049
pos: noun
pron: { cyr: "гжбьет" }
senses:
  - id: back
    ru: "спина (животного; разг. — человека)"
    examples:
      - pl: "Kot wyprężył grzbiet."
        ru: "Кот выгнул спину."
        source: { kind: translated, id: 350043 }
      - pl: "Wielbłąd potrafi zgromadzić dużą ilość wody w garbie na swoim grzbiecie."
        ru: "Верблюд может запасти много воды в горбу на спине."
        source: { kind: translated, id: 9385187 }
      - pl: "Koń niósł na grzbiecie dwa worki."
        ru: "Лошадь несла на спине два мешка."
        source: { kind: authored }
  - id: ridge
    ru: "хребет, гребень (горы, волны); корешок (книги), верх (носа, ладони)"
    examples:
      - pl: "Szliśmy grzbietem gór przez cały dzień."
        ru: "Мы весь день шли по горному хребту."
        source: { kind: authored }
      - pl: "Na grzbiecie książki widać tytuł i nazwisko autora."
        ru: "На корешке книги видно название и фамилию автора."
        source: { kind: authored }
      - pl: "Surfer złapał falę na samym grzbiecie."
        ru: "Сёрфер поймал волну на самом гребне."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "GRZBIET похож на «гребень» и «хребет» — и это родственные слова, но основное значение у него «спина животного»: koń, kot, pies mają grzbiet. О человеке обычно говорят PLECY; GRZBIET о человеке — разговорно и грубовато: «горб», «хребет»." }
  - { kind: usage, text: "В горах GRZBIET — длинная вершинная линия, «хребет»: iść grzbietem, «идти по хребту», творительный пути без предлога. У книги GRZBIET — корешок, у ладони — тыльная сторона: grzbiet dłoni." }
  - { kind: pronunciation, text: "Один слог: «гжбьет». RZ здесь звучит как «ж»: между звонкими G и B оглушаться ему не от чего; IE — «ье». В предложном T переходит в C: na grzbiecie — «на гжбье́цье»." }
  - { kind: register, text: "Нейтральное слово в зоологии, географии и быту. Выражения mieć coś na grzbiecie, «тащить на своём горбу», и nie mieć co na grzbiet włożyć, «нечего надеть», разговорные." }
collocations:
  - { pl: "grzbiet górski", ru: "горный хребет" }
  - { pl: "iść grzbietem", ru: "идти по хребту" }
  - { pl: "grzbiet książki", ru: "корешок книги" }
  - { pl: "grzbiet dłoni", ru: "тыльная сторона ладони" }
  - { pl: "wygiąć grzbiet", ru: "выгнуть спину" }
family:
  - { pl: "grzbietowy", ru: "спинной", relation: derived }
etymology: "Праславянское *grъbetъ, от того же корня, что «горб» и «горбатый»: изогнутая спина. Русское «хребет» — тот же корень с перестановкой и древним х-, а «гребень» — отдалённый родственник. Значения «горный хребет» и «корешок книги» — переносы с изогнутой спины зверя."
memory: "Grzbiet — спина зверя и хребет гор: родня русскому «горб» и «хребет». Kot wygiął grzbiet — кот выгнул спину. У книги grzbiet — корешок. Предложный — na grzbiecie."
idioms:
  - { pl: "nie mieć co na grzbiet włożyć", ru: "нечего надеть, ходить в чём попало" }
  - { pl: "mieć kogoś na grzbiecie", ru: "тащить кого-то на своём горбу" }
