notes:
  - { kind: government, text: "Два падежа, два значения: z Rosji «из России» (родительный), z tobą «с тобой» (творительный)." }
  - { kind: usage, text: "Перед скоплением согласных и перед mną пишется ze: ze szkoły, ze mną — как русское «со»." }
collocations:
  - { pl: "z powrotem", ru: "обратно" }
  - { pl: "ze sobą", ru: "с собой" }
  - { pl: "z kolei", ru: "в свою очередь" }
etymology: "Сокращённое праславянское *jьz «из» — тот же предлог, что русские «из» и «с»."
memory: "Один польский предлог покрывает два русских: z + родительный = «из» (z Rosji), z + творительный = «с» (z tobą). Форма ze появляется перед скоплением согласных, как русское «со»: ze mną."
idioms:
