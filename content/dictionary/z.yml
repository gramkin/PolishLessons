senses:
  - id: from
    ru: "из, с (откуда?) — с родительным падежом"
    examples:
      - pl: "Jestem z Rosji."
        ru: "Я из России."
        source: { kind: tatoeba, id: 459120 }
      - pl: "Zbladłeś ze strachu."
