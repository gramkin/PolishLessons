notes:
  - { kind: false-friend, text: "СЛОВО ТО ЖЕ, ЧТО РУССКИЙ «СНЕГ», НО ГЛАГОЛ ДРУГОЙ. По-русски снег ИДЁТ, по-польски он ПАДАЕТ: pada śnieg. Сказать «śnieg idzie» нельзя. Тем же глаголом описывают дождь и град: pada deszcz, pada grad — или просто pada, без подлежащего, что значит «идёт дождь»." }
  - { kind: pronunciation, text: "Один слог. Ś читается как мягкое щ, а конечное g оглушается до к: «щнек». В косвенных падежах звонкость возвращается и появляется второй слог: śniegu — «щне́гу», śniegiem — «щне́гем»." }
  - { kind: usage, text: "Уменьшительное śnieżek, прилагательное śnieżny «снежный», глагол śnieżyć. Снеговик — bałwan ze śniegu; осторожно, само bałwan в разговоре значит ещё «болван, дурень», ровно как русское слово, от которого оно и происходит. Снежинка — płatek śniegu, сугроб — zaspa." }
collocations:
  - { pl: "pada śnieg", ru: "идёт снег" }
  - { pl: "bałwan ze śniegu", ru: "снеговик" }
  - { pl: "pierwszy śnieg", ru: "первый снег" }
family:
