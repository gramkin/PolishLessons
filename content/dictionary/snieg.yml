  - { pl: "śnieżyca", ru: "метель", relation: derived }
  - { pl: "zima", ru: "зима", relation: root }
etymology: "Праславянское *sněgъ — то же слово, что русский «снег», родственное латинскому nix, nivis и немецкому Schnee. Одно из самых древних слов в языке, общее для всей индоевропейской семьи. Отсюда śnieżny, śnieżyca, śnieżynka и zaśnieżony."
memory: "śnieg — «снег», слово в слово. Запомнить надо глагол: снег не «идёт», а ПАДАЕТ — pada śnieg. И конечное g оглушается: пишется śnieg, слышится «щнек»."
idioms:
