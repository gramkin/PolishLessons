notes:
  - { kind: false-friend, text: "Суффикс -ALNY отвечает русскому -АЛЬНЫЙ, и это соответствие работает почти без исключений на всём слое латинских заимствований: EMOCJONALNY и «эмоциональный», NORMALNY и «нормальный», LOKALNY и «локальный», GLOBALNY и «глобальный», AKTUALNY и «актуальный». Поэтому прилагательное этого вида русскоязычный может образовать сам, и ошибётся только в одном: польское -ALNY короче русского -АЛЬНЫЙ на звук, потому что в польском нет окончания -ЫЙ. Говорят EMOCJONALNY, а не EMOCJONALNYJ. Ещё одна мелочь: в польском здесь CJ, а в русском Ц с И — EMOCJONALNY против «эмоциональный»." }
  - { kind: usage, text: "Одиннадцать форм. Сравнительная степень в наборе отсутствует, и говорят аналитически: BARDZIEJ EMOCJONALNY, NAJBARDZIEJ EMOCJONALNY — так польский поступает со всеми длинными прилагательными на -ALNY, где BARDZIEJ надёжнее синтетической формы. Существительное рядом — EMOCJA «эмоция», и множественное EMOCJE употребляется чаще единственного: BEZ EMOCJI «без эмоций», DUŻO EMOCJI «много эмоций». Наречие — EMOCJONALNIE: REAGOWAĆ EMOCJONALNIE «реагировать эмоционально». Устойчивое SZANTAŻ EMOCJONALNY значит то же, что русское «эмоциональный шантаж»." }
  - { kind: pronunciation, text: "Читается «эмоцйона́льны», пять слогов, ударение на предпоследнем, то есть на NAL. Начальное E это «э». Сочетание CJ произносится как «ць» с последующим «й», слитно: «цйо», и это не «ци» и не «ч». Буква L перед Ń мягкая, «ль», как и в русском. Конечное -NY это «ны», без «й»: «эмоцйона́льны», а не «эмоциональный». В форме EMOCJONALNĄ последнее Ą даёт «он»: «эмоцйона́льнон»." }
  - { kind: stress, text: "Слово длинное, и ударение в нём переезжает по общему польскому правилу — всегда предпоследний слог. EMOCJONALNY: пять слогов, ударение на четвёртом, NAL. EMOCJONALNEGO: шесть слогов, ударение на пятом, NE. EMOCJONALNYMI: шесть слогов, ударение на пятом, NY. Русское «эмоциона́льный» держит ударение на одном и том же слоге во всех формах, и это главная причина, по которой длинные польские прилагательные звучат у русскоязычных неправильно: слоги надо считать с конца каждый раз заново." }
