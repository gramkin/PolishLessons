etymology: "От EMOCJA, из латинского EMOTIO «движение души», через французский ÉMOTION, которым в девятнадцатом веке воспользовались оба языка. Польский оформил существительное своим -CJA, русский — своим -ЦИЯ, и это соответствие такое же регулярное, как у прилагательных: EMOCJA и «эмоция», LEKCJA и «лекция», STACJA и «станция», REWOLUCJA и «революция». Прилагательное оба языка построили одинаково, через латинский -ALIS: польское -ALNY, русское -АЛЬНЫЙ. В итоге пара EMOCJONALNY и «эмоциональный» различается только тем, что польское слово на звук короче, и русскоязычному достаточно снять с конца -ЫЙ, чтобы получить польскую форму. Правило переносится на десятки слов, и именно поэтому этот слой лексики учится быстрее всего."
memory: "Суффикс -ALNY = русское -АЛЬНЫЙ: emocjonalny, normalny, lokalny, globalny, aktualny. Снять с русского слова конечное -ЫЙ — и получится польское. Степени сравнения строятся через bardziej: bardziej emocjonalny. Существительное emocja (чаще во множественном: bez emocji), наречие emocjonalnie. Помнить inteligencja emocjonalna и szantaż emocjonalny — оба оборота совпадают с русскими."
