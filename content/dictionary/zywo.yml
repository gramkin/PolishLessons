# review
id: zywo
format: 2
lemma: "żywo"
rank: 2180
pos: adv
pron: { cyr: "жы́во" }
senses:
  - id: vividly
    ru: "живо, энергично"
    examples:
      - pl: "Nasz baronet zaczyna interesować się żywo piękną sąsiadką."
        ru: "Наш баронет начинает живо интересоваться красивой соседкой."
        source: { kind: authored }
      - pl: "Wyglądać żywo."
        ru: "Выглядеть живо."
        source: { kind: translated, id: 5660022 }
      - pl: "Dyskusja toczyła się żywo do północy."
        ru: "Дискуссия живо шла до полуночи."
        source: { kind: authored }
  - id: live
    ru: "na żywo — в прямом эфире, вживую"
    examples:
      - pl: "Koncert był nadawany na żywo."
        ru: "Концерт транслировали в прямом эфире."
        source: { kind: translated, id: 12229264 }
      - pl: "Widziałam ich na żywo."
        ru: "Я видела их вживую."
        source: { kind: translated, id: 10998783 }
      - pl: "Kiedy ostatnio widziałaś Toma na żywo?"
        ru: "Когда ты в последний раз видела Тома вживую?"
        source: { kind: translated, id: 3502783 }
notes:
  - { kind: usage, text: "Наречие от żywy «живой»; русское «живо» — то же самое слово." }
  - { kind: usage, text: "Современное значение, которое обязательно надо знать: na żywo — «в прямом эфире, вживую». transmisja na żywo «прямая трансляция»." }
  - { kind: usage, text: "żywo interesować się czymś — «живо интересоваться чем-то», с творительным падежом." }
  - { kind: usage, text: "Сравнительная степень żywiej: Serce bije mi żywiej «Сердце бьётся у меня живее»." }
collocations:
  - { pl: "na żywo", ru: "в прямом эфире" }
  - { pl: "żywo się interesować", ru: "живо интересоваться" }
  - { pl: "transmisja na żywo", ru: "прямая трансляция" }
etymology: "Наречие от żywy «живой», праславянское *živъ. Русское «живо» — то же самое слово."
memory: "żywo — «живо, энергично», от żywy «живой»; русское «живо» — то же слово. Но главное современное значение выучите отдельно: na żywo значит «в прямом эфире, вживую» — transmisja na żywo, widzieć kogoś na żywo."
idioms:
