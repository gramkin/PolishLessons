etymology: "Из французского CENTIMÈTRE: латинское CENTUM «сто» и METRUM «мера». Сотая часть метра."
memory: "Centymetr — сантиметр, читается «цэнты́мэтр». Pięć centymetrów — пять сантиметров. Centymetr krawiecki — сантиметр портнихи."
idioms:
  - { pl: "centymetr po centymetrze", ru: "шаг за шагом, очень медленно" }
