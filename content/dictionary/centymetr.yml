notes:
  - { kind: false-friend, text: "CENTYMETR — «сантиметр», через CE: «цэнты́мэтр», а не «санти-». Как и в русском, это и мера, и мерная лента портнихи. Сокращение — CM." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Родительный — CENTYMETRA. После 2, 3, 4 — CENTYMETRY, после 5 и больше — CENTYMETRÓW. В местном R переходит в RZ." }
  - { kind: government, text: "Вырасти на сантиметр — UROSNĄĆ O CENTYMETR, O с винительным. Длиной в сантиметр — DŁUGOŚCI CENTYMETRA. Измерить сантиметром — ZMIERZYĆ CENTYMETREM." }
  - { kind: pronunciation, text: "Читается «цэнты́мэтр»: CE — «цэ», TY — «ты». Ударение на предпоследнем слоге. CENTYMETRZE — «цэнтымэ́тшэ»." }
