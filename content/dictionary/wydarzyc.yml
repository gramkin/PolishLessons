# review
id: wydarzyc
format: 2
lemma: "wydarzyć"
rank: 798
pos: verb
aspect: perf
pron: { cyr: "выда́жыць" }
senses:
  - id: happen
    ru: "wydarzyć się — случиться, произойти"
    note: "Глагол употребляется только с się и только в 3-м лице: подлежащее — событие, а не человек."
    examples:
      - pl: "To wydarzyło się pewnej nocy."
        ru: "Это случилось однажды ночью."
        source: { kind: tatoeba, id: 2810197 }
      - pl: "To się wydarzyło następnego dnia."
        ru: "Это случилось на следующий день."
        source: { kind: tatoeba, id: 6305700 }
      - pl: "Kiedy wypadek się wydarzył?"
        ru: "Когда случилась авария?"
        source: { kind: translated, id: 781256 }
  - id: whatever
    ru: "cokolwiek się wydarzy — что бы ни случилось"
    examples:
      - pl: "Cokolwiek się wydarzy, zawsze jestem po twojej stronie."
        ru: "Что бы ни случилось - я всегда на твоей стороне."
        source: { kind: tatoeba, id: 2145280 }
      - pl: "Wiem co się wydarzy."
        ru: "Я знаю, что случится."
        source: { kind: translated, id: 4837656 }
      - pl: "To nie powinno się nigdy wydarzyć."
        ru: "Этого никогда не должно было случиться."
        source: { kind: translated, id: 12454438 }
  - id: unexpected
    ru: "о неожиданном происшествии"
    examples:
      - pl: "Dziwna rzecz wydarzyła się ostatniej nocy."
        ru: "Странная вещь случилась прошлой ночью."
        source: { kind: translated, id: 2994929 }
      - pl: "Żadna z tych rzeczy się nie wydarzyła."
        ru: "Ничего из этого не случилось."
        source: { kind: translated, id: 4939962 }
      - pl: "Wypadek wydarzył się o świcie."
        ru: "Авария случилась на рассвете."
        source: { kind: translated, id: 1454689 }
notes:
  - { kind: usage, text: "Глагол существует только в возвратной форме wydarzyć się и только в 3-м лице: подлежащим бывает событие, а не человек. Сказать «я случился» нельзя ни по-польски, ни по-русски." }
  - { kind: false-friend, text: "Не путайте глагол с существительным wydarzenie «событие»: Idę na to wydarzenie «Я иду на это мероприятие». Формы wydarzenia, wydarzeniem принадлежат существительному, а не глаголу." }
  - { kind: usage, text: "Несовершенный вид — wydarzać się. Близкие по смыслу zdarzyć się и stać się значат ровно то же: Co się stało? = Co się wydarzyło? «Что случилось?»." }
  - { kind: government, text: "Частая конструкция — cokolwiek się wydarzy «что бы ни случилось», co się wydarzyło? «что случилось?»." }
collocations:
  - { pl: "co się wydarzyło", ru: "что случилось" }
  - { pl: "cokolwiek się wydarzy", ru: "что бы ни случилось" }
  - { pl: "nic się nie wydarzyło", ru: "ничего не случилось" }
  - { pl: "wydarzenie", ru: "событие" }
family:
  - { pl: "wydarzać się", ru: "случаться", relation: aspect }
  - { pl: "wydarzenie", ru: "событие", relation: derived }
  - { pl: "zdarzyć się", ru: "случиться", relation: root }
  - { pl: "dar", ru: "дар", relation: root }
etymology: "Из wy- + darzyć «одарять», от dar «дар». Событие мыслится как то, что судьба «выдаёт» человеку; тот же корень в zdarzyć się и в русском «дарить»."
memory: "wydarzyć się — «случиться». Внутри сидит dar «дар»: событие — это то, что судьба тебе выдаёт, ровно как в zdarzyć się. Глагол живёт только с się и только в 3-м лице. И не спутайте его с существительным wydarzenie «событие»: Idę na to wydarzenie — это «мероприятие», а не форма глагола."
