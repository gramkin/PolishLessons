rank: 5453
pos: verb
aspect: imperf
pron: { cyr: "сы́чэць" }
senses:
  - id: hiss
    ru: "шипеть"
    examples:
      - pl: "Patelnia syczy."
        ru: "Сковорода шипит."
        source: { kind: tatoeba, id: 9532697 }
      - pl: "Wąż syczy."
        ru: "Змея шипит."
        source: { kind: translated, id: 6170140 }
      - pl: "Olej syczy na patelni."
        ru: "Масло шипит на сковороде."
        source: { kind: authored }
  - id: hiss-speech
    ru: "шипеть, цедить сквозь зубы"
    examples:
      - pl: "Syczał ze złości."
        ru: "Он шипел от злости."
        source: { kind: authored }
      - pl: "Syczała mu coś do ucha."
        ru: "Она шипела ему что-то на ухо."
        source: { kind: authored }
notes:
  - { kind: usage, text: "И о звуке (змея, сковорода, пар), и о человеке, который говорит сквозь зубы от злости." }
  - { kind: false-friend, text: "Звукоподражание, как и русское «шипеть», но звук другой: польское sy- передаёт именно свистящий с, а не ш." }
  - { kind: government, text: "Непереходный; совершенный вид — syknąć «шикнуть, зашипеть однократно»." }
  - { kind: usage, text: "В корпусе встречается только форма syczy, поэтому остальные примеры составлены вручную." }
  - { kind: government, text: "Раз глагол непереходный, страдательного причастия он не образует: форм syczany или syczani в языке нет. Действительное причастие обычно — syczący wąż, para sycząca w rurach." }
collocations:
  - { pl: "wąż syczy", ru: "змея шипит" }
  - { pl: "syczeć ze złości", ru: "шипеть от злости" }
etymology: "Звукоподражательное, праславянское *sykati; ср. русское «сычать», «шипеть»."
memory: "syczeć — «шипеть»: и змея, и сковорода, и человек сквозь зубы. Совершенный вид — syknąć «шикнуть»."
