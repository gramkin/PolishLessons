id: zadbac
format: 2
lemma: "zadbać"
rank: 2599
pos: verb
pron: { cyr: "задба́ць" }
senses:
  - id: take-care
    ru: "позаботиться (о ком/чём-л.)"
    examples:
      - pl: "Zadbaj o siebie."
        ru: "Позаботься о себе."
        source: { kind: authored }
      - pl: "Kto zadba o ogród pod naszą nieobecność?"
        ru: "Кто позаботится о саде в наше отсутствие?"
        source: { kind: authored }
      - pl: "Zadbałem o bilety z wyprzedzeniem."
        ru: "Я заранее позаботился о билетах."
        source: { kind: authored }
  - id: well-kept
    ru: "привести в порядок; быть ухоженным (о причастии zadbany)"
    examples:
      - pl: "To bardzo zadbany ogród."
        ru: "Это очень ухоженный сад."
        source: { kind: authored }
      - pl: "Dom jest stary, ale zadbany."
        ru: "Дом старый, но ухоженный."
        source: { kind: authored }
notes:
  - { kind: government, text: "zadbać o coś, o kogoś — предлог o с ВИНИТЕЛЬНЫМ падежом: zadbać o zdrowie, o dzieci, o siebie. Русское «позаботиться о ком/чём» берёт тот же предлог, но ПРЕДЛОЖНЫЙ падеж. Предлог совпадает, падеж — нет, и это главная ловушка: правильно zadbam o dzieci, а не «zadbam o dzieciach»." }
  - { kind: usage, text: "Совершенный вид; несовершенный — dbać (dbać o coś «заботиться о чём-л.»). Приставка za- добавляет однократность и результат: dbam o ogród «я ухаживаю за садом», но zadbam o ogród «я приведу сад в порядок»." }
  - { kind: government, text: "Причастие zadbany давно оторвалось от глагола и живёт самостоятельным прилагательным «ухоженный, опрятный»: zadbany ogród, zadbana kobieta, zadbani goście. Строго говоря, прямого дополнения в винительном у zadbać нет — оно идёт через предлог o, — поэтому это не обычный пассив, а прилагательное. Его антоним — zaniedbany «запущенный»." }
  - { kind: pronunciation, text: "Сочетание db в начале корня произносится слитно и звонко: dbać — [дбаць], zadbać — [задбаць]. Русскому уху непривычно, но для польского это обычное начало слова (dbać, dbałość)." }
collocations:
  - { pl: "zadbać o zdrowie", ru: "позаботиться о здоровье" }
  - { pl: "zadbać o siebie", ru: "позаботиться о себе" }
  - { pl: "zadbany ogród", ru: "ухоженный сад" }
family:
  - { pl: "dbać", ru: "заботиться (о чём-л.)", relation: aspect, id: dbac }
  - { pl: "dbałość", ru: "забота, тщательность", relation: derived }
  - { pl: "zaniedbany", ru: "запущенный, неухоженный", relation: antonym }
  - { pl: "niedbały", ru: "небрежный", relation: antonym }
etymology: "Приставка za- и глагол dbać «заботиться». Корень dba- общеславянский, но уцелел он главным образом в западнославянских языках — польское dbać, чешское dbát; в русском он не удержался, и его место заняло «заботиться», так что опереться на родственное слово здесь не на что. От того же корня dbałość «забота, тщательность» и отрицательные niedbały «небрежный», zaniedbany «запущенный»."
memory: "zadbać o coś — предлог тот же, что в русском, а падеж другой: o + ВИНИТЕЛЬНЫЙ. Zadbaj o siebie «позаботься о себе». А zadbany — это уже просто «ухоженный», противоположность zaniedbany."
idioms:
  - { pl: "zadbać o siebie", ru: "позаботиться о себе; привести себя в порядок" }
  - { pl: "zadbać o swoje interesy", ru: "позаботиться о своих интересах, не упустить своего" }
