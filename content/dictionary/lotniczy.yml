notes:
  - { kind: false-friend, text: "Самое полезное здесь не само слово, а привычка, которую оно показывает. Русский почти всё в этой области строит с латинским «авиа-»: авиапочта, авиабилет, авиакомпания, авиакатастрофа. Польский же не взял ни одного такого слова и собрал всё от своего корня: POCZTA LOTNICZA, BILET LOTNICZY, LINIE LOTNICZE, KATASTROFA LOTNICZA. Даже аэропорт у него свой, LOTNISKO, буквально «лётное место». Запомнив корень LOT, вы разберёте десяток слов сразу." }
  - { kind: usage, text: "Десять форм, а не одиннадцать, и причина в основе. У прилагательных на твёрдый -CZY мужско-личная форма множественного числа совпадает с мужской единственного: и LOTNICZY PILOT, и LOTNICZY INŻYNIEROWIE. Так же устроены POJEDYNCZY и ŚLEDCZY. Отсюда экономия на целой форме. Степеней сравнения у слова нет: оно относительное, вещь бывает авиационной или нет, но не «более авиационной»." }
  - { kind: government, text: "В промышленности — предлог W с местным падежом: W PRZEMYŚLE LOTNICZYM. Послать авиапочтой — творительный без предлога: NADAĆ POCZTĄ LOTNICZĄ, тогда как русский вставляет предлог и говорит «отправить авиапочтой» тоже творительным, так что схема совпадает. До аэропорта — DO PORTU LOTNICZEGO, предлог DO с родительным. Прилагательное всегда согласуется с существительным, и в польском оно чаще стоит после него: PORT LOTNICZY, а не наоборот." }
  - { kind: pronunciation, text: "Читается «лотни́чы», три слога, ударение на втором. Сочетание CZ даёт «ч», а следующее за ним Y даёт «ы», поэтому конец слова звучит «чы», а не «чи»: для русского уха это самое непривычное место. Буквосочетание TNI даёт мягкое «тни». В женской форме LOTNICZA слышно «лотни́ча», в творительном LOTNICZĄ конечное Ą даёт «он», и получается «лотни́чон»." }
  - { kind: register, text: "Слово нейтральное, из языка транспорта и новостей. Набор устойчивых сочетаний стоит выучить целиком: PORT LOTNICZY «аэропорт», LINIE LOTNICZE «авиакомпания», RUCH LOTNICZY «воздушное движение», KATASTROFA LOTNICZA «авиакатастрофа», POCZTA LOTNICZA «авиапочта», BAZA LOTNICZA «авиабаза». В разговоре вместо PORT LOTNICZY чаще скажут просто LOTNISKO, и это слово услышишь в любом объявлении." }
