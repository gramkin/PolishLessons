etymology: "От LOT «полёт», от LATAĆ «летать», от праславянского корня, давшего русские «лёт», «летать», «полёт». Корень общий и совершенно прозрачный, поэтому всё гнездо читается без словаря: LOTNIK «лётчик», LOTNISKO «аэродром», LOTNICZY «авиационный». Русский в начале двадцатого века предпочёл для новой техники латинское «авиа-», от AVIS «птица», и получил «авиацию» рядом с «лётчиком». Польский от заимствования отказался и остался при своём корне."
memory: "Держитесь за корень lot «полёт», тот же, что в русском «лёте» и «летать», и целое гнездо открывается само: lotnik «лётчик», lotnisko «аэропорт», lotniczy «авиационный». Главное отличие от русского в том, что там, где мы берём латинское «авиа-», поляк складывает своё: poczta lotnicza, linie lotnicze, katastrofa lotnicza. Форм десять, а не одиннадцать: у основ на -czy мужско-личная форма совпадает с мужской единственного."
idioms:
  - { pl: "poczta lotnicza", ru: "авиапочта" }
