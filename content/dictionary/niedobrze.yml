# review
id: niedobrze
format: 2
lemma: "niedobrze"
rank: 2274
pos: adv
pron: { cyr: "недо́бжэ" }
senses:
  - id: badly
    ru: "нехорошо, плохо"
    examples:
      - pl: "Niedobrze się stało."
        ru: "Нехорошо получилось."
        source: { kind: authored }
      - pl: "Mówisz o nim niedobrze."
        ru: "Ты плохо о нём говоришь."
        source: { kind: authored }
  - id: nauseous
    ru: "тошно (robi się niedobrze)"
    examples:
      - pl: "Niedobrze mi od tego zapachu."
        ru: "Меня тошнит от этого запаха."
        source: { kind: authored }
      - pl: "Zrobiło mu się niedobrze w autobusie."
        ru: "Его затошнило в автобусе."
        source: { kind: authored }
  - id: exclamation
    ru: "плохо дело!, скверно!"
    examples:
      - pl: "Niedobrze, spóźnimy się na pociąg."
        ru: "Плохо дело, мы опоздаем на поезд."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "САМОЕ ЧАСТОЕ УПОТРЕБЛЕНИЕ РУССКИЙ НЕ УГАДЫВАЕТ. Jest mi niedobrze и robi mi się niedobrze значат не «мне как-то не по себе», а совершенно определённо «МЕНЯ ТОШНИТ». Это обиходный способ сказать о тошноте — в автобусе, после еды, при беременности. Если хочется сказать «мне нехорошо» вообще, говорят źle się czuję." }
  - { kind: usage, text: "ПИШЕТСЯ СЛИТНО — И ЭТО ПРАВИЛО ДЛЯ ЦЕЛОГО КЛАССА. Отрицание nie- сливается с наречиями, образованными от прилагательных: niedobrze, niedaleko, niełatwo, niewiele, niedrogo. С глаголами же nie пишется отдельно: nie wiem, nie mam. Русский делит иначе, поэтому ошибка в написании очень частая." }
  - { kind: pronunciation, text: "Три слога, ударение на предпоследнем: nie-DO-brze. Группа rz после глухого b звучит как ш, но здесь b звонкое, поэтому rz читается как ж: «недо́бжэ». Форма одна: наречие не склоняется и не спрягается." }
  - { kind: register, text: "Нейтрально во всех значениях. Как самостоятельный возглас Niedobrze! звучит как русское «плохо дело!» или «скверно!». Сравнительная степень образуется от gorzej «хуже», а не от самого слова: jest coraz gorzej." }
collocations:
  - { pl: "niedobrze mi", ru: "меня тошнит" }
  - { pl: "robi się niedobrze", ru: "становится дурно" }
  - { pl: "niedobrze się stało", ru: "нехорошо вышло" }
family:
  - { pl: "dobrze", ru: "хорошо", relation: antonym, id: dobrze }
  - { pl: "dobry", ru: "хороший", relation: root, id: dobry }
  - { pl: "źle", ru: "плохо", relation: derived, id: zle }
etymology: "Отрицание nie- плюс dobrze «хорошо», от dobry — того же слова, что русское «добрый», из праславянского *dobrъ «подходящий, годный». Значение тошноты выросло из общего «плохо мне»: телесное недомогание назвали тем же словом, что и неладное положение дел. Отсюда niedobry, niedobrze, dobro и dobroć."
memory: "niedobrze — «нехорошо», но чаще всего это про ТОШНОТУ: niedobrze mi значит «меня тошнит». Если нужно просто «мне нехорошо», говорят źle się czuję. И пишется слитно, как niedaleko и niełatwo."
idioms:
  - { pl: "niedobrze mi", ru: "меня тошнит" }
  - { pl: "robi mi się niedobrze", ru: "мне становится дурно" }
formExamples:
