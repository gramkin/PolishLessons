notes:
  - { kind: government, text: "Схема совпадает с русской почти целиком: ZAWIADOMIĆ KOGOŚ O CZYMŚ — винительный на лицо, предлог O с предложным на дело. ZAWIADOMIŁ RODZINĘ O WYPADKU это «известил семью о происшествии». Расходится одно место, и оно частотное: учреждение по-польски извещают прямым дополнением, без предлога. ZAWIADOMIĆ POLICJĘ, ZAWIADOMIĆ SZKOŁĘ, ZAWIADOMIĆ SĄD — буквально «известить полицию», тогда как русский говорит «сообщить в полицию». Сказать по-польски ZAWIADOMIĆ DO POLICJI нельзя. Способ передаётся наречием или предлогом: ZAWIADOMIĆ LISTOWNIE «известить письмом», NA PIŚMIE «письменно»." }
  - { kind: false-friend, text: "Корень тот же, что в русском «ведать», и соответствие здесь почти буквальное: ZAWIADOMIĆ отвечает русскому «уведомить», только приставка другая. Прилагательное WIADOMY значит «известный, ведомый», а существительное WIADOMOŚĆ — «известие, сообщение»; в разговоре WIADOMOŚĆ это ещё и сообщение в телефоне. Русская «ведомость» выглядит как прямая пара к WIADOMOŚĆ, но значит совсем другое — расчётный список, — так что переводить одно другим нельзя." }
  - { kind: usage, text: "Несовершенный партнёр — ZAWIADAMIAĆ, с обычным чередованием O и A в основе. Очень близкий по смыслу глагол POWIADOMIĆ употребляется почти так же, и разницу можно считать стилистической: ZAWIADOMIĆ чуть официальнее. В быту вместо обоих чаще скажут DAĆ ZNAĆ «дать знать»: DAJ ZNAĆ, JAK DOJEDZIESZ. Пятьдесят три формы — подпись переходного глагола совершенного вида, с деепричастием ZAWIADOMIWSZY и полным страдательным причастием ZAWIADOMIONY." }
  - { kind: pronunciation, text: "Читается «завядо́мичь», четыре слога, ударение на предпоследнем. Сочетание WIA даёт «вя»: буква I здесь не гласная, а знак мягкости предыдущего W, поэтому слышно «вя», а не «виа». То же в WIADOMOŚĆ «вядо́мощь» и в WIARA «вя́ра». Конечное Ć мягкое, «чь». В причастии ZAWIADOMIONY группа IO даёт «ё»: «завядомё́ны»." }
  - { kind: register, text: "Слово официально-деловое: им пишут повестки, объявления и служебные письма. Отглагольное существительное ZAWIADOMIENIE означает «уведомление, извещение» и живёт прежде всего в канцелярском и юридическом языке: ZAWIADOMIENIE O ROZPRAWIE «извещение о заседании», ZAWIADOMIENIE O ZMIANIE TERMINU. Самый частый юридический оборот — ZŁOŻYĆ ZAWIADOMIENIE O PRZESTĘPSTWIE «подать заявление о преступлении», и глагол там именно ZŁOŻYĆ, а не DAĆ. В разговоре с близкими всё это звучало бы слишком сухо, и там уместнее DAĆ ZNAĆ." }
