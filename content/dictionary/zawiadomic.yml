etymology: "Приставка ZA- плюс WIADOMIĆ, от прилагательного WIADOMY «известный», а оно — от праславянского *vědomъ, страдательной формы глагола *věděti «ведать, знать». Русский хранит ту же цепочку целиком: «ведать», «ведомый», «уведомить», «сведения», «весть». Польское WIEDZIEĆ отвечает русскому «ведать», WIADOMOŚĆ — «вести, известию», а ZAWIADOMIĆ — «уведомить»; различается только выбор приставки, ZA- против У-. Дальше в том же гнезде стоят WIEDZA «знание», ŚWIADOMY «сознательный» и ŚWIADEK «свидетель» — последнее слово показывает, что свидетель это буквально тот, кто ведает."
memory: "Корень тот же, что в «ведать»: wiedzieć «знать», wiadomość «известие», zawiadomić «уведомить». Управление совпадает с русским: zawiadomić kogoś o czymś, винительный и предлог o. Расходится одно место — учреждение извещают прямым дополнением: zawiadomić policję, без предлога, где русский говорит «сообщить в полицию». Произношение: wia звучит как «вя», отсюда «завядо́мичь»."
idioms:
  - { pl: "złożyć zawiadomienie o przestępstwie", ru: "подать заявление о преступлении" }
