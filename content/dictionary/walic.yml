# review
id: walic
format: 2
lemma: "walić"
rank: 1952
pos: verb
aspect: imperf
pron: { cyr: "ва́лиць" }
senses:
  - id: hit
    ru: "колотить, бить"
    examples:
      - pl: "Przestań walić w drzwi."
        ru: "Перестань колотить в дверь."
        source: { kind: translated, id: 831763 }
      - pl: "Tom zaczął walić w drzwi."
        ru: "Том начал колотить в дверь."
        source: { kind: translated, id: 3985920 }
      - pl: "Muzyk mocno walił w bębny."
        ru: "Музыкант сильно колотил в барабаны."
        source: { kind: translated, id: 349577 }
      - pl: "Krople deszczu waliły w szyby."
        ru: "Капли дождя били в окна."
        source: { kind: translated, id: 367656 }
  - id: heart
    ru: "колотиться (о сердце)"
    examples:
      - pl: "Czuła, jak serce jej wali."
        ru: "Она чувствовала, как колотится её сердце."
        source: { kind: translated, id: 493161 }
      - pl: "Serce mi waliło po niewielkim biegu."
        ru: "Сердце колотилось после небольшой пробежки."
        source: { kind: translated, id: 403175 }
  - id: bluntly
    ru: "говорить напрямик; махнуть рукой"
    examples:
      - pl: "Wal prosto z mostu."
        ru: "Говори напрямик."
        source: { kind: translated, id: 751523 }
      - pl: "Wal to."
        ru: "Да брось это."
        source: { kind: translated, id: 12938306 }
      - pl: "Walę to, bo nie wytrzymam."
        ru: "Да плюну я на это, сил нет."
        source: { kind: translated, id: 12938313 }
notes:
  - { kind: register, text: "В прямых значениях («колотить», «биться») слово разговорное, но не грубое. Однако у него есть и вульгарные употребления, поэтому в незнакомом контексте с ним стоит быть осторожным." }
  - { kind: usage, text: "walić w drzwi «колотить в дверь», serce wali «сердце колотится» — самые обычные сочетания." }
  - { kind: usage, text: "walić prosto z mostu значит «говорить напрямик, резать правду-матку»." }
  - { kind: usage, text: "Wal to! в разговоре значит «Да брось это», «Плюнь»." }
  - { kind: false-friend, text: "Отглагольное существительное walenie «стук, колочение» пишется так же, как walenie «киты» — множественное число от waleń. Различает только смысл предложения." }
collocations:
  - { pl: "walić w drzwi", ru: "колотить в дверь" }
  - { pl: "walić prosto z mostu", ru: "резать правду-матку" }
  - { pl: "serce wali", ru: "сердце колотится" }
etymology: "Праславянское *valiti «валить, катить». Русское «валить» — то же самое слово; значение «бить» развилось из «обрушивать»."
memory: "walić — «колотить»: walić w drzwi, serce wali. А walić prosto z mostu значит «резать правду-матку»."
idioms:
  - { pl: "walić w drzwi", ru: "колотить в дверь" }
  - { pl: "walić prosto z mostu", ru: "резать правду-матку" }
  - { pl: "serce wali", ru: "сердце колотится" }
