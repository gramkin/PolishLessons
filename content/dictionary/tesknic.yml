id: tesknic
format: 2
lemma: "tęsknić"
rank: 796
pos: verb
aspect: imperf
pron: { cyr: "тэ́нскниць" }
senses:
  - id: miss
    ru: "tęsknić ZA kimś — скучать по кому-л. (творительный!)"
    note: "Русский ставит дательный с «по», польский — творительный с za."
    examples:
      - pl: "Ona tęskni za nim."
        ru: "Она скучает по нему."
        source: { kind: tatoeba, id: 8763478 }
      - pl: "Tęsknię za tobą."
        ru: "Грущу без тебя."
        source: { kind: tatoeba, id: 864109 }
      - pl: "Tęsknisz za mną?"
        ru: "Скучаешь по мне?"
        source: { kind: translated, id: 7680879 }
  - id: missed
    ru: "tęskniłem za tobą — я скучал по тебе"
    examples:
      - pl: "Tęskniłem za tobą."
        ru: "Я скучал по тебе."
        source: { kind: translated, id: 410091 }
      - pl: "Bardzo za tobą tęskniłem."
        ru: "Я очень по тебе скучал."
        source: { kind: translated, id: 1348640 }
      - pl: "W ogóle za mną nie tęskniłeś?"
        ru: "Ты совсем по мне не скучал?"
        source: { kind: tatoeba, id: 6689541 }
  - id: homesick
    ru: "tęsknić za domem — скучать по дому"
    examples:
      - pl: "Tom tęsknił za domem."
        ru: "Том скучал по дому."
        source: { kind: translated, id: 8765410 }
      - pl: "Tęsknicie za domem?"
        ru: "Скучаете по дому?"
        source: { kind: translated, id: 8457902 }
      - pl: "Ludzie z wielkich miast tęsknią za życiem na wsi."
        ru: "Люди из больших городов тоскуют по деревенской жизни."
        source: { kind: translated, id: 976153 }
  - id: will-miss
    ru: "będę tęsknić — буду скучать"
    examples:
      - pl: "Będę za tobą tęsknić."
        ru: "Я буду по тебе скучать."
        source: { kind: translated, id: 2213011 }
      - pl: "Będę za wami tęsknić."
        ru: "Я буду по вам скучать."
        source: { kind: translated, id: 3363574 }
      - pl: "Tęskniliśmy za Tomem."
        ru: "Мы скучали по Тому."
        source: { kind: tatoeba, id: 3127245 }
notes:
  - { kind: government, text: "Главное отличие от русского — падеж. tęsknić ZA kimś, ZA czymś требует творительного: Tęsknię za tobą «Скучаю по тебе», tęsknić za domem «скучать по дому». Русский в этом месте ставит дательный с предлогом «по»." }
  - { kind: usage, text: "Корень тот же, что в русской «тоске»: праславянское *tǫska. Отсюда существительное tęsknota «тоска» — а отглагольное tęsknienie практически не употребляется." }
  - { kind: usage, text: "Совершенный вид — zatęsknić «затосковать». Прилагательное tęskny «тоскливый», наречие tęsknie." }
  - { kind: usage, text: "Будущее строится с инфинитивом: Będę za tobą tęsknić «Я буду по тебе скучать» — или с формой на -ła: Będę tęskniła." }
collocations:
  - { pl: "tęsknić za kimś", ru: "скучать по кому-либо" }
  - { pl: "tęsknić za domem", ru: "скучать по дому" }
  - { pl: "będę tęsknić", ru: "буду скучать" }
  - { pl: "tęsknota", ru: "тоска" }
family:
  - { pl: "tęsknota", ru: "тоска", relation: derived }
  - { pl: "tęskny", ru: "тоскливый", relation: derived }
  - { pl: "zatęsknić", ru: "затосковать", relation: aspect }
etymology: "От tęskny «тоскливый», праславянское *tǫska — то же слово, что русские «тоска» и «тошно»."
memory: "tęsknić — «скучать, тосковать», и корень тот же, что в русской «тоске». Главное отличие — падеж: tęsknić ZA kimś требует творительного там, где русский ставит дательный с «по». Tęsknię za tobą значит «Скучаю по тебе». Существительное — tęsknota, а совершенный вид — zatęsknić."
idioms:
  - { pl: "tęsknić za kimś", ru: "скучать по кому-либо" }
  - { pl: "tęsknić za domem", ru: "скучать по дому" }
  - { pl: "tęsknota", ru: "тоска" }
