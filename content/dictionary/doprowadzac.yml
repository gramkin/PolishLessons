etymology: "Приставка DO- плюс PROWADZIĆ, от праславянского *voditi «водить». Русский хранит всё гнездо: «водить», «вести», «доводить», «вводить», «проводить», «повод», «вождь». Польское PROWADZIĆ отвечает русскому «проводить», только приставка PRO- срослась с корнем так давно, что перестала осознаваться, и сегодня слово значит просто «вести». Поэтому там, где русский обходится «доводить», польский строит DOPROWADZAĆ, с двумя приставками подряд. Приставка DO- в обоих языках указывает на достижение предела, и обороты DOPROWADZIĆ DO KOŃCA и «довести до конца» совпадают полностью."
memory: "Корень тот же, что в «водить», и карточку стоит читать рядом с wprowadzać: один корень, разные приставки. Оборот doprowadzać kogoś do szału совпадает с русским «доводить до бешенства» слово в слово. А вот близкое doprowadzić do porządku расходится: поляк говорит do с родительным там, где русский берёт «в» с винительным — «привести в порядок». И знать второе значение: doprowadzić wodę, gaz, prąd «подвести воду, газ, электричество»."
idioms:
