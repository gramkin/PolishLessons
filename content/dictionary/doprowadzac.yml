notes:
  - { kind: government, text: "Главная схема одна и очень частая: DOPROWADZAĆ COŚ ALBO KOGOŚ DO CZEGOŚ, предлог DO с родительным. DOPROWADZASZ MNIE DO SZAŁU значит «ты доводишь меня до бешенства», и тут предлог с падежом совпадают с русскими. Но в близком обороте они расходятся: DOPROWADZIĆ COŚ DO PORZĄDKU это «привести что-то в порядок», где русский берёт «в» с винительным, а поляк остаётся при своём DO с родительным. Запоминать стоит именно эту пару, потому что оборот ходовой." }
  - { kind: usage, text: "Корень тот же, что в PROWADZIĆ «вести», и карточка стоит рядом с WPROWADZAĆ: один корень, разные приставки, разные отношения к русскому. DO- отвечает русскому ДО- и означает доведение до предела: DOPROWADZIĆ DO KOŃCA, DO SKUTKU, DO SZAŁU. Шестьдесят три формы — подпись переходного глагола несовершенного вида, с действительным причастием на -ĄCY. Видовой партнёр — DOPROWADZIĆ, и у него пятьдесят три формы. Отглагольное существительное DOPROWADZENIE означает подведение коммуникаций." }
  - { kind: false-friend, text: "Осторожнее с существительным DOPROWADZENIE: в быту оно значит «подведение» воды или газа, а в юридическом языке — «принудительную доставку» человека в суд или в полицию, то есть совсем не то, что подсказывает корень. Само слово PROWADZIĆ русскому кажется знакомым через «проводить», но значит просто «вести»: PROWADZIĆ SAMOCHÓD «вести машину», PROWADZIĆ FIRMĘ «руководить фирмой», PROWADZIĆ DO CZEGOŚ «вести к чему-то»." }
  - { kind: pronunciation, text: "Читается «допрова́дзачь», четыре слога, ударение на предпоследнем. Сочетание DZ даёт слитный звонкий звук, средний между «д» и «з», а не два отдельных согласных. Буква R твёрдая и раскатистая. Конечное Ć мягкое, «чь». В формах настоящего времени слышно «допрова́дзам», «допрова́дзаш». В страдательном причастии DOPROWADZANY ударение остаётся на предпоследнем слоге." }
  - { kind: register, text: "Слово нейтральное и ходовое в обоих значениях. Из первого особенно живы обороты DOPROWADZAĆ KOGOŚ DO SZAŁU «доводить до бешенства», DO ROZPACZY «до отчаяния», DO ŁEZ «до слёз», DO RUINY «до разорения». Второе значение техническое: DOPROWADZIĆ PRĄD, WODĘ, GAZ. Есть и канцелярское DOPROWADZIĆ SPRAWĘ DO KOŃCA «довести дело до конца». В разговоре о доведении до состояния часто говорят короче: WKURZAĆ «бесить», но это слово грубее." }
