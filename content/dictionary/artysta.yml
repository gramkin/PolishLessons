# review
id: artysta
format: 2
lemma: "artysta"
rank: 2207
pos: noun
pron: { cyr: "арты́ста" }
senses:
  - id: artist
    ru: "художник, артист"
    examples:
      - pl: "Ten artysta jest utalentowany."
        ru: "Этот художник талантлив."
        source: { kind: translated, id: 875910 }
      - pl: "Artysta stworzył wiele pięknych obrazów."
        ru: "Художник создал много прекрасных картин."
        source: { kind: translated, id: 9410293 }
      - pl: "Artysta musi mieć oko do kolorów."
        ru: "У художника должен быть глаз на цвета."
        source: { kind: translated, id: 359852 }
  - id: artist-instr
    ru: "художник (быть художником — artystą)"
    examples:
      - pl: "Nie jestem artystą, nigdy o tym nie myślałem."
        ru: "Я не художник. Я совсем не гожусь для этого."
        source: { kind: tatoeba, id: 352010 }
      - pl: "Tacy artyści jak Picasso to wielka rzadkość."
        ru: "Такие художники, как Пикассо - большая редкость."
        source: { kind: tatoeba, id: 4104331 }
notes:
  - { kind: government, text: "Как и poeta: окончание -a, склонение женского типа, но род МУЖСКОЙ — ten artysta, utalentowany artysta." }
  - { kind: false-friend, text: "Польское artysta покрывает и «художника», и «артиста». Художник в узком смысле — malarz, а артист театра — aktor." }
  - { kind: usage, text: "Множественное artyści «художники» с мужским личным окончанием -i; творительный artystą — в конструкции «быть кем-л.»." }
  - { kind: usage, text: "Женское соответствие — artystka." }
collocations:
  - { pl: "utalentowany artysta", ru: "талантливый художник" }
  - { pl: "być artystą", ru: "быть художником" }
etymology: "Из итальянского artista через латынь, как и русское «артист»."
memory: "artysta — «художник» и «артист», род МУЖСКОЙ при женском склонении: ten utalentowany artysta. Множественное artyści."
idioms:
  - { pl: "być artystą", ru: "быть художником" }
