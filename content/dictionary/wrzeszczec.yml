# review
id: wrzeszczec
format: 2
lemma: "wrzeszczeć"
rank: 4903
pos: verb
pron: { cyr: "вжэ́шчэць" }
senses:
  - id: yell
    ru: "орать, вопить"
    examples:
      - pl: "Nie wrzeszcz, dziecko śpi!"
        ru: "Не ори, ребёнок спит!"
        source: { kind: authored }
      - pl: "Kibice wrzeszczeli na trybunach."
        ru: "Болельщики орали на трибунах."
        source: { kind: authored }
      - pl: "Wrzeszczy na mnie za byle co."
        ru: "Он орёт на меня по любому поводу."
        source: { kind: authored }
  - id: scream
    ru: "визжать, кричать (от страха, боли)"
    examples:
      - pl: "Dziewczyny wrzeszczały na kolejce górskiej."
        ru: "Девушки визжали на американских горках."
        source: { kind: authored }
      - pl: "Wrzeszczał z bólu."
        ru: "Он кричал от боли."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "WRZESZCZEĆ — «орать», «вопить», грубее, чем KRZYCZEĆ «кричать». Похоже на русское «верещать», и это действительно родственные слова, но польское значит именно громкий крик, а не писк." }
  - { kind: usage, text: "Несовершенный вид; однократный совершенный — WRZASNĄĆ «заорать». Спряжение: WRZESZCZĘ, WRZESZCZYSZ, WRZESZCZĄ. Форма WRZESZCZMY, безличное WRZESZCZANO и отглагольное существительное (вместо него — WRZASK «вопль») в карточку не включены." }
  - { kind: government, text: "На кого — NA с винительным: WRZESZCZEĆ NA DZIECI. От чего — Z с родительным: Z BÓLU, ZE STRACHU. Что — прямая речь или придаточное: WRZESZCZAŁ, ŻEBY UCIEKAĆ." }
  - { kind: pronunciation, text: "Читается «вжэ́шчэць»: WRZ — «вж», SZCZ — «шч». Ударение на первом слоге. WRZESZCZY — «вжэ́шчы»." }
  - { kind: register, text: "Разговорное, экспрессивное слово с оттенком неодобрения. Нейтрально — KRZYCZEĆ, вежливо — MÓWIĆ GŁOŚNO." }
collocations:
  - { pl: "wrzeszczeć na kogoś", ru: "орать на кого-то" }
  - { pl: "wrzeszczeć z bólu", ru: "кричать от боли" }
  - { pl: "wrzeszczeć wniebogłosy", ru: "орать во всё горло" }
family:
  - { pl: "krzyczeć", ru: "кричать", relation: root, id: krzyczec }
  - { pl: "wrzask", ru: "вопль, ор", relation: derived }
  - { pl: "wrzasnąć", ru: "заорать", relation: aspect }
etymology: "Звукоподражательный корень, праславянское *vrěsk-, тот же, что в русском «верещать». Польское WRZ- на месте русского ВЕР- — обычное соответствие."
memory: "Wrzeszczeć — орать: nie wrzeszcz! Na kogoś — na + винительный. Родственник русского «верещать»."
idioms:
  - { pl: "wrzeszczeć wniebogłosy", ru: "орать во всю глотку" }
