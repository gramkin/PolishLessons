notes:
  - { kind: government, text: "Три управления, и различать их обязательно, потому что от падежа зависит значение. Первое: OPIERAĆ COŚ O COŚ, винительный с предлогом O — «прислонять к», OPIERAĆ DRABINĘ O ŚCIANĘ. Второе: OPIERAĆ SIĘ NA CZYMŚ, местный с предлогом NA — «основываться на», TEZA OPIERA SIĘ NA DANYCH. Третье: OPIERAĆ SIĘ CZEMUŚ, дательный без предлога — «сопротивляться», OPIERAĆ SIĘ ZMIANOM. Третье легко спутать со вторым, а разница в падеже: OPIERAĆ SIĘ NA REFORMIE значит опираться на реформу, OPIERAĆ SIĘ REFORMIE — сопротивляться ей. Несовершенный вид, совершенный — OPRZEĆ." }
  - { kind: false-friend, text: "Корень русскому понятен, и в первом значении слово переводится прямо: «опирать», «опираться». Ловушка в третьем значении. Русское «опираться» не значит «сопротивляться» никогда, а польское OPIERAĆ SIĘ с дательным значит именно это, и переводить его надо как «сопротивляться», «противиться». Поэтому NIE OPIERAJ SIĘ это «не сопротивляйся», а не «не опирайся»; «не опирайся» было бы NIE OPIERAJ SIĘ O TO, с предлогом. Второе расхождение мелкое, но частое: отглагольное существительное OPARCIE значит и «опора», и «спинка стула», и «поддержка» — ZNALEŹĆ OPARCIE W RODZINIE «найти поддержку в семье»." }
  - { kind: pronunciation, text: "Читается «опе́раць», ударение на предпоследнем слоге из трёх. Сочетание PIE даёт мягкое «пе», а не «пье». Конечное -Ć это мягкое «ць». В причастии на -ĄC буква Ą звучит «он» перед согласным: OPIERAJĄC «опера́йонц», и это одно из немногих мест, где носовой слышен отчётливо. В страдательном причастии OPIERANY звучит «опера́ны» с твёрдым н, а в действительном OPIERAJĄCY — «операйо́нцы», и ударение там переходит дальше вправо вместе с удлинением слова." }
  - { kind: usage, text: "Два причастия на одной карточке, и это свойство несовершенного вида: действительное OPIERAJĄCY «опирающийся, основывающийся» существует только у несовершенных глаголов, а у совершенного OPRZEĆ его нет вовсе. Зато деепричастие у несовершенного только настоящего времени, OPIERAJĄC; формы на -WSZY принадлежат совершенному, OPARŁSZY. Частотные обороты: OPIERAĆ SIĘ NA DANYCH, OPIERAĆ SIĘ NA ŹRÓDŁACH, OPIERAĆ WNIOSKI NA CZYMŚ, NIE OPIERAJ SIĘ O ŚCIANĘ. В гнезде корня стоят OPRZEĆ, WESPRZEĆ, PODPORA, OPARCIE." }
collocations:
  - { pl: "opierać się na danych", ru: "основываться на данных" }
  - { pl: "opierać drabinę o ścianę", ru: "прислонять лестницу к стене" }
  - { pl: "opierać się zmianom", ru: "сопротивляться переменам" }
family:
  - { pl: "oprzeć", ru: "опереть, прислонить (соверш.)", relation: aspect, id: oprzec }
  - { pl: "poprzeć", ru: "поддержать", relation: root, id: poprzec }
