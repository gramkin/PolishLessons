etymology: "Приставка O- и основа -PIERAĆ, из праславянского *perti «напирать», того же корня, что русские «переть», «опереть», «опора», «упор». Самое полезное здесь не корень, а вставка -IER-: именно она делает из совершенного OPRZEĆ несовершенный OPIERAĆ, и русский проделывает то же самое вставкой -ИРА-, превращая «опереть» в «опирать». Соответствие работает и на других глаголах этого класса: ZEBRAĆ и ZBIERAĆ отвечают «собрать» и «собирать», WYBRAĆ и WYBIERAĆ — «выбрать» и «выбирать». Поэтому польское -IER- или -BIER- в середине глагола почти всегда означает несовершенный вид и почти всегда соответствует русскому -ИРА-. Третье значение, «сопротивляться», выросло из того же напора: тот, кто упирается, напирает в обратную сторону."
memory: "Три управления, и падеж решает значение: opierać coś o coś «прислонять к», opierać się na czymś «основываться на», opierać się czemuś «сопротивляться». Opierać się reformie — противиться ей, opierać się na reformie — опираться на неё. Nie opieraj się значит «не сопротивляйся». Несовершенный вид; совершенный — oprzeć, и вставка -ier- это ровно русское -ира-: опереть — опирать, собрать — собирать."
