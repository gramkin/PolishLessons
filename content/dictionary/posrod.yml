# review
id: posrod
format: 2
lemma: "pośród"
rank: 3499
pos: prep
pron: { cyr: "по́сьрут" }
senses:
  - id: among
    ru: "среди"
    examples:
      - pl: "Pośród uczniów był jeden prawdziwy geniusz."
        ru: "Среди учеников был один настоящий гений."
        source: { kind: authored }
      - pl: "Czuła się samotna pośród tłumu."
        ru: "Она чувствовала себя одинокой среди толпы."
        source: { kind: authored }
      - pl: "Pośród kwiatów brzęczały pszczoły."
        ru: "Среди цветов жужжали пчёлы."
        source: { kind: authored }
  - id: in-the-midst
    ru: "посреди"
    examples:
      - pl: "Pośród pola stał samotny dąb."
        ru: "Посреди поля стоял одинокий дуб."
        source: { kind: authored }
      - pl: "Pośród ciszy rozległ się krzyk."
        ru: "Посреди тишины раздался крик."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "POŚRÓD — книжное «среди». В обычной речи говорят WŚRÓD: WŚRÓD PRZYJACIÓŁ. Пространственное «посреди, в центре» чаще передают как NA ŚRODKU или POŚRODKU: NA ŚRODKU POKOJU, «посреди комнаты»." }
  - { kind: usage, text: "Одна форма. Слово поэтическое и литературное, в разговоре звучит приподнято. Часто — о времени: POŚRÓD NOCY, «среди ночи»." }
  - { kind: government, text: "Предлог требует родительного падежа, как русское «среди»: POŚRÓD DRZEW, POŚRÓD GOŚCI." }
  - { kind: pronunciation, text: "Читается «по́сьрут», ударение на первом слоге. Ś — мягкое «сь», Ó — «у», конечное D оглушается в «т»." }
collocations:
  - { pl: "pośród drzew", ru: "среди деревьев" }
  - { pl: "pośród nocy", ru: "среди ночи" }
  - { pl: "pośród przyjaciół", ru: "среди друзей" }
family:
  - { pl: "wśród", ru: "среди", relation: root, id: wsrod }
  - { pl: "środek", ru: "середина; средство", relation: root, id: srodek }
  - { pl: "pośrodku", ru: "посередине", relation: root }
etymology: "PO + старое ŚRÓD «середина». Корень тот же, что в русских «среда», «середина», «среди»: польское ŚRÓD на месте русского «сред»."
memory: "Pośród — книжное «среди» (= wśród): pośród drzew. Читается «по́сьрут». Na środku — посреди. Środek — середина."
idioms:
  - { pl: "złoty środek", ru: "золотая середина" }
