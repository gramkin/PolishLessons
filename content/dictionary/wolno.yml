# review
id: wolno
format: 2
lemma: "wolno"
rank: 4176
pos: adv
depth: deep
pron: { cyr: "во́льно" }
senses:
  - id: slowly
    ru: "медленно"
    examples:
      - pl: "Idź wolno, nie biegnij."
        ru: "Иди медленно, не беги."
        source: { kind: authored }
      - pl: "Ten komputer działa bardzo wolno."
        ru: "Этот компьютер работает очень медленно."
        source: { kind: authored }
      - pl: "Czas płynie wolno, kiedy się czeka."
        ru: "Когда ждёшь, время тянется медленно."
        source: { kind: authored }
  - id: allowed
    ru: "можно, разрешено; NIE WOLNO — нельзя"
    examples:
      - pl: "Tu nie wolno palić."
        ru: "Здесь нельзя курить."
        source: { kind: authored }
      - pl: "Czy wolno mi zadać pytanie?"
        ru: "Можно мне задать вопрос?"
        source: { kind: authored }
      - pl: "Dzieciom nie wolno wchodzić do wody bez opieki."
        ru: "Детям нельзя заходить в воду без присмотра."
        source: { kind: authored }
  - id: freely
    ru: "свободно, на воле"
    examples:
      - pl: "Psy biegają tu wolno."
        ru: "Собаки бегают здесь на свободе."
        source: { kind: authored }
      - pl: "Kupili wolno stojący dom pod miastem."
        ru: "Они купили отдельно стоящий дом за городом."
        source: { kind: authored }
      - pl: "Puścił konia wolno na łąkę."
        ru: "Он отпустил коня пастись на луг."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "WOLNO почти никогда не значит русское «вольно». Главные значения — «медленно» и «можно»: NIE WOLNO — «нельзя», твёрдый запрет. Армейская команда «Вольно!» по-польски — SPOCZNIJ!" }
  - { kind: usage, text: "Слово работает двумя способами. Как наречие, «медленно», оно имеет степени: WOLNIEJ, NAJWOLNIEJ. Как безличное сказуемое, «можно», степеней не имеет и меняется только связкой: NIE WOLNO BYŁO, NIE BĘDZIE WOLNO." }
  - { kind: government, text: "В значении «можно» лицо стоит в дательном падеже, действие — в инфинитиве: WOLNO MI, NIE WOLNO CI. После NIE WOLNO прямое дополнение уходит в родительный: NIE WOLNO PIĆ ALKOHOLU." }
  - { kind: pronunciation, text: "Читается «во́льно», ударение на первом слоге. L перед N мягкое: «ль». В форме WOLNIEJ: «во́льней»." }
  - { kind: register, text: "NIE WOLNO — строгий запрет, так пишут на табличках и говорят детям. Мягче — NIE MOŻNA или NIE NALEŻY. В значении «медленно» синоним — POWOLI, оно разговорнее." }
collocations:
  - { pl: "nie wolno palić", ru: "курить запрещено" }
  - { pl: "mówić wolniej", ru: "говорить медленнее" }
  - { pl: "wolno stojący", ru: "отдельно стоящий" }
family:
  - { pl: "wolny", ru: "свободный; медленный", relation: root, id: wolny }
  - { pl: "wolność", ru: "свобода", relation: root, id: wolnosc }
  - { pl: "powoli", ru: "медленно, потихоньку", relation: root, id: powoli }
etymology: "От WOLNY «свободный», корень тот же, что в русских «воля», «вольный». Из «свободы» выросли оба польских значения: свободному всё разрешено, отсюда «можно», а свободный от спешки идёт медленно."
memory: "Wolno — медленно, а nie wolno — нельзя. Читается «во́льно». Mów wolniej — говори медленнее. Nie wolno palić — курить запрещено. «Вольно!» — Spocznij!"
idioms:
  - { pl: "wolnoć Tomku w swoim domku", ru: "в своём доме что хочу, то и делаю" }
  - { pl: "co wolno wojewodzie, to nie tobie, smrodzie", ru: "что позволено Юпитеру, не позволено быку" }
  - { pl: "wolniej jedziesz, dalej zajedziesz", ru: "тише едешь — дальше будешь" }
