        ru: "Это ловкое решение."
        source: { kind: authored }
  - id: cunning
    ru: "ловкий, хитрый (с оттенком упрёка)"
    examples:
      - pl: "Sprytny handlarz naciągnął ich na podwójną cenę."
        ru: "Ловкий торговец развёл их на двойную цену."
        source: { kind: authored }
      - pl: "Sprytni ludzie zawsze wychodzą na swoje."
        ru: "Ловкие люди всегда добиваются своего."
        source: { kind: authored }
  - id: clever-idea
    ru: "ловкий, остроумный (о замысле)"
    examples:
      - pl: "Najsprytniejszy pomysł okazał się najprostszy."
        ru: "Самая ловкая идея оказалась самой простой."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "РУССКОГО КОГНАТА У ЭТОГО СЛОВА НЕТ ВОВСЕ, И ОПЕРЕТЬСЯ НЕ НА ЧТО. Sprytny — это не «умный»: умный будет MĄDRY, а образованный — INTELIGENTNY. Sprytny значит «смекалистый, ловкий», с практическим уклоном и нередко с лёгким упрёком: человек умеет обойти правило и выйти на своё. Существительное SPRYT — «смекалка»." }
  - { kind: usage, text: "В сравнительной степени суффикс сохраняется целиком и добавляется -iejszy: SPRYTNIEJSZY, NAJSPRYTNIEJSZY. Сравни с brzydki, который своё -k- наоборот теряет: brzydszy. Мужско-личные формы — sprytni, sprytniejsi, najsprytniejsi, и их стоит проговорить отдельно." }
  - { kind: pronunciation, text: "Два слога, ударение на первом: SPRYT-ny. Начальное spr произносится слитно, y читается как русское ы: «спры́тны». В сравнительной ударение смещается: spryt-NIEJ-szy." }
collocations:
  - { pl: "sprytny chwyt", ru: "ловкий приём" }
  - { pl: "sprytne rozwiązanie", ru: "ловкое решение" }
  - { pl: "mieć spryt", ru: "иметь смекалку" }
family:
  - { pl: "spryt", ru: "смекалка", relation: root }
  - { pl: "mądry", ru: "умный", relation: root, id: madry }
  - { pl: "głupi", ru: "глупый", relation: antonym, id: glupi }
etymology: "От spryt «смекалка», которое, по принятому объяснению, пришло в польский в восемнадцатом веке из итальянского spirito или французского esprit «ум, живость». Слово нигде в славянских языках родственников не имеет, поэтому русскому уху оно совершенно чужое, в отличие от mądry, где корень общий."
memory: "sprytny — «смекалистый, ловкий», а не «умный»: умный это mądry. Русского когната нет совсем, слово пришло из романских через spryt «смекалка». Сравнительная сохраняет суффикс: sprytniejszy, в отличие от brzydszy."
idioms:
