pron: { cyr: "спры́тны" }
senses:
  - id: resourceful
    ru: "смекалистый, ловкий, находчивый"
    examples:
      - pl: "Sprytny chłopak zawsze znajdzie wyjście."
        ru: "Смекалистый парень всегда найдёт выход."
