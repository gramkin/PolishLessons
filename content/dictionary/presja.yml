notes:
  - { kind: false-friend, text: "Русское «давление» покрывает два понятия, которые польский держит раздельно, и это главная трудность карточки. PRESJA — давление общественное, психологическое, политическое: PRESJA RODZINY, PRESJA CZASU, POD PRESJĄ. А физическое давление — крови, атмосферы, в шине — это CIŚNIENIE: CIŚNIENIE KRWI «давление крови», WYSOKIE CIŚNIENIE, CIŚNIENIE W OPONACH. Сказать PRESJA KRWI нельзя, это не по-польски. Обратная ошибка тоже возможна: CIŚNIENIE SPOŁECZNE не говорят. Правило простое: что измеряют прибором — CIŚNIENIE, что оказывают люди — PRESJA." }
  - { kind: usage, text: "Класс на -SJA ведёт себя как класс на -CJA: родительный, дательный и местный падеж единственного числа совпадают в форме PRESJI, и она же служит родительным множественного. Старая книжная форма родительного множественного — PRESYJ, как DYSKUSYJ, OBSERWACYJ, PRODUKCYJ и RELIGIJ. Самые частые сочетания: POD PRESJĄ «под давлением», WYWIERAĆ PRESJĘ «оказывать давление», ULEC PRESJI «поддаться давлению», PRESJA CZASU. Прилагательное от него не образуют, вместо него говорят PRESYJNY редко или описательно." }
  - { kind: pronunciation, text: "Читается «прэ́сья», ударение на первом слоге из двух. Сочетание SJA даёт «сья», в один слог, а не «сия» в два. Буква E звучит «э» и предыдущую согласную не смягчает: «прэ», а не «пре». Одна S произносится коротко, без удвоения, которое русский делает в «прессе» машинально. В форме PRESJI окончание звучит «сьи»." }
  - { kind: government, text: "Женский род на -A. Винительный на -Ę: WYWIERALI PRESJĘ. На кого давят — предлог NA с винительным: PRESJA NA RZĄD «давление на правительство». Кто давит — предлог ZE STRONY с родительным: PRESJA ZE STRONY SPONSORÓW. Состояние под давлением — предлог POD с творительным: POD PRESJĄ, и русский строит это так же. Поддаться — ULEC с дательным: ULEC PRESJI. При отрицании винительный уходит в родительный: NIE WYWIERALI PRESJI." }
