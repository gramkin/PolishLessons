etymology: "Из латинского PRESSIO «давление, сжатие», от PREMERE «давить, жать». Тот же корень дал целое гнездо знакомых слов: PRASA «пресса» и «печать», IMPRESJA «впечатление», то есть «вдавливание», EKSPRESJA «выразительность», DEPRESJA «подавленность», буквально «вдавленность вниз». Русское «пресс» и «пресса» пришли оттуда же, но для понятия давления русский взял своё слово, от «давить», и потому одно русское «давление» покрыло обе области, которые польский разделил между латинским PRESJA и своим CIŚNIENIE — а CIŚNIENIE, в свою очередь, от CISNĄĆ «жать», то есть точная калька того же латинского образа."
memory: "Русское «давление» делится на два: presja — общественное и психологическое, ciśnienie — физическое, крови и атмосферы. Presja krwi сказать нельзя. Класс на -sja: родительный, дательный, местный и родительный множественного дают presji, старая форма — presyj. Под давлением — pod presją, творительный. От латинского premere «давить», откуда и prasa, depresja, impresja."
