etymology: "От NOGA, слова праславянского и того же, что русская «нога». Суффикс -NY дал относительное прилагательное, в точности как русское «ножной». А сочетание PIŁKA NOŻNA — это перевод английского FOOTBALL по частям, слово за словом: FOOT стало NOŻNA, BALL стало PIŁKA. Русский в этом месте поступил иначе и взял английское слово целиком, поэтому «футбол» и PIŁKA NOŻNA выглядят совсем непохоже."
memory: "Отвечает русскому «ножной» и собрано от noga точно так же. Главное — pilka nozna, то есть футбол: поляк перевёл английское football по частям, где foot стало nozna, а ball — pilka. Играть в футбол — grac w pilke nozna, с винительным у обоих слов. Не путать с nozowy «ножевой», от noz. Формы nozni нет: футболистов называют pilkarze."
idioms:
  - { pl: "piłka nożna", ru: "футбол" }
formExamplesSkip:
