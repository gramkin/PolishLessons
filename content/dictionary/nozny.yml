notes:
  - { kind: false-friend, text: "Само слово отвечает русскому «ножной» точно: оба от названия ноги. Ловушка в другом: PIŁKA NOŻNA это не «ножной мяч», а футбол, и никак иначе по-польски этот вид спорта не называется в официальной речи. Русский взял английское слово целиком, поляк перевёл его по частям. И не путайте NOŻNY с NOŻOWY: первое от NOGA, второе от NÓŻ, то есть «ножевой»." }
  - { kind: usage, text: "В таблице одиннадцать форм, но живых десять. Одиннадцатая — NOŻNI, именительный множественного для мужчин-людей, и её не употребляют: прилагательное относительное, оно описывает устройство предмета, а не человека. Футболистов называют PIŁKARZE, существительным. Примеров к этой форме в карточке поэтому нет. В сочетании PIŁKA NOŻNA прилагательное всегда стоит после существительного." }
  - { kind: government, text: "Главное, что надо запомнить: играть в футбол — GRAĆ W PIŁKĘ NOŻNĄ, предлог W с винительным падежом, причём меняются оба слова. Матч по футболу — MECZ PIŁKI NOŻNEJ, родительный без предлога. В футболе — W PIŁCE NOŻNEJ, местный падеж, и обратите внимание, что PIŁKA здесь даёт PIŁCE, с чередованием K в C." }
  - { kind: pronunciation, text: "Читается «но́жны», два слога, ударение на первом. Сочетание Ż даёт «ж», поэтому середина слова это «жн». Конечная Y даёт «ы», и слово кончается на «ны», а не на «ный». В женском роде NOŻNA это «но́жна», в среднем NOŻNE — «но́жнэ», с «э» на конце, а NOŻNĄ звучит «но́жнон», с носовым на конце." }
  - { kind: register, text: "В прямом значении слово техническое: HAMULEC NOŻNY «ножной тормоз», NAPĘD NOŻNY «ножной привод», POMPKA NOŻNA «ножной насос», KĄPIEL NOŻNA «ножная ванна». Зато PIŁKA NOŻNA — выражение, которое слышно каждый день, из новостей и разговоров. В быту поляки говорят ещё и FUTBOL, но официальное название всегда PIŁKA NOŻNA." }
