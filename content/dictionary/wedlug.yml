# review
id: wedlug
format: 2
lemma: "według"
rank: 703
pos: prep
pron: { cyr: "ве́длук" }
senses:
  - id: according-to
    ru: "согласно, по (чему-л. — родительный)"
    note: "Według Biblii «Согласно Библии»."
    examples:
      - pl: "Według Biblii, Bóg stworzył świat w sześć dni."
        ru: "Согласно Библии, Бог создал мир за шесть дней."
        source: { kind: tatoeba, id: 367048 }
      - pl: "Według Mike'a, Mac kupił nowy samochód."
        ru: "По словам Майка, Мак купил новую машину."
        source: { kind: tatoeba, id: 933126 }
      - pl: "Według prognozy będzie padać."
        ru: "По прогнозу будет дождь."
        source: { kind: authored }
  - id: in-my-view
    ru: "według mnie — по-моему, на мой взгляд"
    note: "Синоним частого moim zdaniem."
    examples:
      - pl: "Według mnie to nie ma sensu."
        ru: "По-моему, это не имеет смысла."
        source: { kind: tatoeba, id: 5373165 }
      - pl: "Według niego to pomyłka."
        ru: "По его мнению, это ошибка."
        source: { kind: authored }
      - pl: "Według mnie masz rację."
        ru: "По-моему, ты прав."
        source: { kind: authored }
  - id: by-criterion
    ru: "по (признаку): według wielkości, według alfabetu"
    examples:
      - pl: "Ustawiliśmy książki według wielkości."
        ru: "Мы расставили книжки по размеру."
        source: { kind: tatoeba, id: 3663702 }
      - pl: "Ułóż nazwiska według alfabetu."
        ru: "Расположи фамилии по алфавиту."
        source: { kind: authored }
      - pl: "Posortowali dane według daty."
        ru: "Они отсортировали данные по дате."
        source: { kind: authored }
notes:
  - { kind: government, text: "Предлог требует родительного падежа: według mnie, według Biblii, według wielkości. Русские «согласно» и «по» берут дательный, так что падеж приходится переучивать." }
  - { kind: usage, text: "według mnie — «по-моему», обиходный синоним оборота moim zdaniem." }
  - { kind: usage, text: "С признаком упорядочивания: ustawić według wielkości «расставить по размеру», według alfabetu «по алфавиту»." }
  - { kind: pronunciation, text: "Конечное g оглушается: według читается «ве́длук»." }
collocations:
  - { pl: "według mnie", ru: "по-моему" }
  - { pl: "według Biblii", ru: "согласно Библии" }
  - { pl: "według alfabetu", ru: "по алфавиту" }
  - { pl: "moim zdaniem", ru: "по-моему" }
family:
  - { pl: "wedle", ru: "согласно (устар.)", relation: root }
  - { pl: "zgodnie z", ru: "в соответствии с", relation: root }
  - { pl: "podług", ru: "согласно (устар.)", relation: root }
etymology: "Из we- плюс dług «длина, протяжение» — исходно «вдоль, по протяжению». Родственно русским «долгий» и «вдоль»."
memory: "według — «согласно, по», и главное здесь падеж: предлог требует родительного — według mnie, według Biblii, według wielkości, — тогда как русские «согласно» и «по» берут дательный. Оборот według mnie значит «по-моему» и ходит наравне с moim zdaniem. Произносится «ве́длук», с оглушённым g на конце."
idioms:
