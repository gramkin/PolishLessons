# review
id: na
format: 2
depth: deep
lemma: "na"
rank: 9
pos: prep
pron: { cyr: "на" }
senses:
  - id: place
    ru: "на (где? на чём?) — с предложным падежом"
    examples:
      - pl: "Książka leży na stole."
        ru: "Книга лежит на столе."
        source: { kind: authored }
      - pl: "Starczy na dziś."
        ru: "Хватит на сегодня."
        source: { kind: tatoeba, id: 366701 }
  - id: direction
    ru: "на (куда? на что?) — с винительным падежом"
    examples:
      - pl: "Na dół!"
        ru: "Вниз!"
        source: { kind: tatoeba, id: 13782814 }
      - pl: "Na pomoc!"
        ru: "На помощь!"
        source: { kind: tatoeba, id: 12572539 }
      - pl: "Polowali na lisy."
        ru: "Они охотились на лис."
        source: { kind: tatoeba, id: 535877 }
  - id: purpose
    ru: "на (для чего, на какой срок); при вызове и ответе"
    examples:
      - pl: "Odpowiedz na pytanie."
        ru: "Ответь на вопрос."
        source: { kind: tatoeba, id: 349045 }
      - pl: "Zadzwoń na policję!"
        ru: "Вызывай полицию!"
        source: { kind: tatoeba, id: 569981 }
      - pl: "Wystarczy na dzisiaj."
        ru: "На сегодня хватит."
        source: { kind: tatoeba, id: 565545 }
notes:
  - { kind: government, text: "Винительный падеж при направлении (na stół), предложный при месте (na stole) — ровно как в русском." }
  - { kind: usage, text: "na + винительный также означает срок или назначение: na dziś «на сегодня», na jutro «на завтра»." }
  - { kind: false-friend, text: "Выбор между na и w для мест не совпадает с русским. Говорят na poczcie «на почте», na uniwersytecie «в университете», na wsi «в деревне», но w domu «дома», w szkole «в школе». Список приходится запоминать." }
  - { kind: usage, text: "Ряд глаголов требует именно na: odpowiedzieć na pytanie «ответить на вопрос», czekać na kogoś «ждать кого-то», patrzeć na coś «смотреть на что-то», zadzwonić na policję «вызвать полицию»." }
collocations:
  - { pl: "na pewno", ru: "наверняка" }
  - { pl: "na razie", ru: "пока" }
  - { pl: "na przykład", ru: "например" }
etymology: "Праславянское *na, из праиндоевропейского *nō «вверх, на» — то же слово, что русское «на»."
memory: "Совпадает с русским «на» и по форме, и по управлению: na stole (где) — na stół (куда). Запомните устойчивые сочетания, которых нет в русском: na pewno «наверняка», na razie «пока»."
idioms:
