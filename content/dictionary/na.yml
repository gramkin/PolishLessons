# review
id: na
format: 2
lemma: "na"
rank: 9
pos: prep
pron: { cyr: "на" }
senses:
  - id: place
    ru: "на (где? на чём?) — с предложным падежом"
    examples:
      - pl: "Książka leży na stole."
        ru: "Книга лежит на столе."
        source: { kind: authored }
      - pl: "Starczy na dziś."
        ru: "Хватит на сегодня."
        source: { kind: tatoeba, id: 366701 }
  - id: direction
    ru: "на (куда? на что?) — с винительным падежом"
    examples:
      - pl: "Na dół!"
        ru: "Вниз!"
        source: { kind: tatoeba, id: 13782814 }
      - pl: "Na pomoc!"
        ru: "На помощь!"
        source: { kind: tatoeba, id: 12572539 }
      - pl: "Polowali na lisy."
        ru: "Они охотились на лис."
        source: { kind: tatoeba, id: 535877 }
notes:
  - { kind: government, text: "Винительный падеж при направлении (na stół), предложный при месте (na stole) — ровно как в русском." }
  - { kind: usage, text: "na + винительный также означает срок или назначение: na dziś «на сегодня», na jutro «на завтра»." }
collocations:
  - { pl: "na pewno", ru: "наверняка" }
  - { pl: "na razie", ru: "пока" }
  - { pl: "na przykład", ru: "например" }
etymology: "Праславянское *na, из праиндоевропейского *nō «вверх, на» — то же слово, что русское «на»."
memory: "Совпадает с русским «на» и по форме, и по управлению: na stole (где) — na stół (куда). Запомните устойчивые сочетания, которых нет в русском: na pewno «наверняка», na razie «пока»."
idioms:
  - { pl: "pójść na swoje", ru: "зажить самостоятельно" }
  - { pl: "wyjść na ludzi", ru: "выбиться в люди" }
  - { pl: "na wszelki wypadek", ru: "на всякий случай" }
