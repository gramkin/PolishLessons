etymology: "dzień «день» и dobry «добрый» — праславянские слова, совпадающие с русскими. Застывший порядок «существительное плюс прилагательное» сохраняет старую формулу пожелания «дня доброго»."
memory: "dzień dobry — одно приветствие на всё светлое время суток, включая утро: отдельного «доброе утро» в польском нет. Запомните обратный порядок: dzień dobry, но dobry wieczór."
idioms:
