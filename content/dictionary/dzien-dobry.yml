# review
id: dzien-dobry
format: 2
lemma: "dzień dobry"
rank: 5716
pos: interj
pron: { cyr: "дзьень до́бры" }
senses:
  - id: greeting
    ru: "добрый день, здравствуйте"
    examples:
      - pl: "Dzień dobry, czym mogę służyć?"
        ru: "Добрый день, чем могу служить?"
        source: { kind: authored }
      - pl: "Dzień dobry, jestem nowym sąsiadem."
        ru: "Добрый день, я новый сосед."
        source: { kind: authored }
      - pl: "Wszedł i powiedział dzień dobry."
        ru: "Он вошёл и сказал «здравствуйте»."
        source: { kind: authored }
      - pl: "Nawet dzień dobry trudno mu było powiedzieć."
        ru: "Ему даже «здравствуйте» было трудно сказать."
        source: { kind: authored }
      - pl: "Dzień dobry, czy pani doktor przyjmuje?"
        ru: "Здравствуйте, доктор принимает?"
        source: { kind: authored }
notes:
  - { kind: usage, text: "Универсальное приветствие от утра до сумерек: покрывает и «здравствуйте», и «добрый день», и «доброе утро». Отдельного dobre rano в живой речи нет." }
  - { kind: usage, text: "Порядок слов обратный вечернему: существительное впереди — dzień dobry, но dobry wieczór." }
  - { kind: government, text: "Оба слова в именительном падеже; в приветствии они не изменяются." }
  - { kind: false-friend, text: "Русское «добрый день» годится только днём. Польское dzień dobry покрывает и утро, так что «доброе утро» по-польски — тоже dzień dobry." }
collocations:
  - { pl: "dzień dobry", ru: "здравствуйте, добрый день" }
  - { pl: "dzień dobry państwu", ru: "здравствуйте (нескольким)" }
family:
