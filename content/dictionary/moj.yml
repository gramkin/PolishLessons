# review
id: moj
format: 2
lemma: "mój"
rank: 20
pos: adj
pron: { cyr: "муй" }
senses:
  - id: my
    ru: "мой, моя, моё"
    examples:
      - pl: "To mój dom."
        ru: "Это мой дом."
        source: { kind: tatoeba, id: 665859 }
      - pl: "Moja kolej?"
        ru: "Моя очередь?"
        source: { kind: tatoeba, id: 2122198 }
      - pl: "To nie moje."
        ru: "Это не моё."
        source: { kind: tatoeba, id: 5511027 }
  - id: mine
    ru: "мой (в косвенных падежах)"
    examples:
      - pl: "Po moim trupie!"
        ru: "Только через мой труп!"
        source: { kind: tatoeba, id: 735802 }
      - pl: "To moi rodzice."
        ru: "Это мои родители."
        source: { kind: tatoeba, id: 7960744 }
notes:
  - { kind: usage, text: "Если владелец совпадает с подлежащим, поляк обычно говорит swój, а не mój: Kocham swoją żonę «Я люблю свою жену»." }
  - { kind: usage, text: "Рядом с полными формами существует краткий поэтический ряд: mego, mej, memu, mych — он встречается в стихах и устойчивых оборотах." }
collocations:
  - { pl: "mój Boże", ru: "боже мой" }
  - { pl: "moim zdaniem", ru: "по-моему" }
  - { pl: "po mojemu", ru: "по-моему" }
etymology: "Праславянское *mojь — то же слово, что русское «мой»."
memory: "Главное правило не в склонении, а в выборе слова: когда владелец совпадает с подлежащим, поляк скажет swój, а не mój — Kocham swoją żonę. Короткий ряд mego, mej, memu, mych звучит книжно и живёт в стихах."
idioms:
  - { pl: "mój Boże", ru: "боже мой" }
  - { pl: "moim zdaniem", ru: "по-моему" }
  - { pl: "cała przyjemność po mojej stronie", ru: "мне было очень приятно (ответ на благодарность или «приятно познакомиться»)" }
