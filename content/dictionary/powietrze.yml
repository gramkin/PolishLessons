lemma: "powietrze"
rank: 860
pos: noun
pron: { cyr: "пове́тшэ" }
senses:
  - id: air
    ru: "воздух"
    examples:
      - pl: "Bez powietrza pomarlibyśmy."
        ru: "Без воздуха мы бы умерли."
        source: { kind: tatoeba, id: 670336 }
      - pl: "Na księżycu nie ma powietrza."
        ru: "На Луне нет воздуха."
        source: { kind: tatoeba, id: 3695138 }
      - pl: "Człowiek nie przeżyje bez powietrza."
        ru: "Человек не выживет без воздуха."
        source: { kind: tatoeba, id: 946854 }
  - id: fresh
    ru: "na świeżym powietrzu — на свежем воздухе, на улице"
    note: "Устойчивое сочетание значит ещё и «вне помещения»."
    examples:
      - pl: "Lekarz zalecił mi więcej ruchu, częstsze przebywanie na świeżym powietrzu i zdrowe odżywianie."
        ru: "Врач порекомендовал мне больше двигаться, чаще бывать на свежем воздухе и правильно питаться."
        source: { kind: tatoeba, id: 13786634 }
      - pl: "Wieje tu świeżym powietrzem."
        ru: "Здесь веет свежим воздухом."
        source: { kind: translated, id: 359272 }
      - pl: "Dzieci bawią się na świeżym powietrzu."
        ru: "Дети играют на свежем воздухе."
        source: { kind: authored }
  - id: blow-up
    ru: "wysadzić w powietrze — взорвать"
    examples:
      - pl: "Tom wysadził most w powietrze."
        ru: "Том взорвал мост."
        source: { kind: tatoeba, id: 1590877 }
      - pl: "Celował w gęś, trafił w powietrze."
        ru: "Целил в гуся, попал в воздух."
        source: { kind: tatoeba, id: 906106 }
      - pl: "Most wyleciał w powietrze."
        ru: "Мост взлетел на воздух."
        source: { kind: authored }
notes:
  - { kind: usage, text: "na świeżym powietrzu значит не только «на свежем воздухе», но и просто «на улице, не в помещении»: Spędzamy dużo czasu na świeżym powietrzu." }
  - { kind: usage, text: "wysadzić w powietrze «взорвать», wylecieć w powietrze «взлететь на воздух» — винительный падеж после w." }
  - { kind: usage, text: "traktować kogoś jak powietrze — «не замечать кого-то, игнорировать», буквально «обращаться как с воздухом»." }
  - { kind: usage, text: "Слово вещественное: множественного числа у него нет, как и у русского «воздух»." }
collocations:
  - { pl: "świeże powietrze", ru: "свежий воздух" }
  - { pl: "na świeżym powietrzu", ru: "на свежем воздухе" }
  - { pl: "wysadzić w powietrze", ru: "взорвать" }
