  - { pl: "wietrzyć", ru: "проветривать", relation: derived }
  - { pl: "przewiew", ru: "сквозняк", relation: derived }
etymology: "Из po- + wiatr «ветер» — буквально «то, что вдоль ветра». Русское «воздух» собрано иначе (вз- + дух), так что общего корня у слов нет."
memory: "powietrze — «воздух», и с русским словом оно не в родстве: внутри сидит wiatr «ветер», а не «дух». Множественного числа нет. Держите в голове na świeżym powietrzu — это и «на свежем воздухе», и просто «на улице», и wysadzić w powietrze «взорвать»."
