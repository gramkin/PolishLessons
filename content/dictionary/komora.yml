etymology: "Из латинского CAMERA «свод, сводчатое помещение», а то — из греческого KAMARA с тем же значением. В польский слово попало рано, через латынь и немецкий, и обжилось настолько, что обросло своими производными: KOMÓRKA, KOMORNE, KOMORNIK. Русский взял ту же латинскую основу гораздо позже и в книжном виде, получив «камеру» с сохранённым латинским А; областная «комора» в русских говорах — это как раз раннее заимствование того же слова, пришедшее через польское и украинское посредство. Так одно латинское слово вошло в русский дважды: один раз снизу, через соседей, и другой раз сверху, через книгу, и два отражения разошлись по стилю и по значению."
memory: "То же латинское camera, что и русская «камера», но пришедшее в польский рано и через немцев, а потому иначе звучащее; областная русская «комора» — это ранний слой того же слова. Значение широкое: komora serca, komora chłodnicza, komora spalania, а в деревне — кладовая. Тюремная камера это cela, фотоаппарат — aparat. Komórka значит и клетку, и мобильник. Местный komorze с меной r→rz, родительный множественного komór с o→ó."
