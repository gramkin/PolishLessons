notes:
  - { kind: false-friend, text: "Русское литературное слово здесь «камера», и оно пришло из того же латинского источника, только позже и другим путём, поэтому звучит иначе. Польская KOMORA покрывает всё, что по-русски называют камерой в смысле замкнутого объёма: KOMORA SERCA «желудочек сердца», KOMORA CHŁODNICZA «холодильная камера», KOMORA SPALANIA «камера сгорания». Тюремная камера при этом называется CELA, а фотокамера APARAT, и подставлять сюда KOMORA нельзя. Второе значение, кладовая, в русском отвечает областной «коморе» и литературному «чулану». Отдельно стоит KOMÓRKA: это и клетка в биологии, и, в разговоре, мобильный телефон." }
  - { kind: usage, text: "Десять форм, женский род. Дательный и местный единственного — KOMORZE, где конечное R основы переходит в RZ перед окончанием -E: та же мена, что в FRYZURZE и CZARZE. Родительный множественного — KOMÓR, с удлинением O в Ó перед нулевым окончанием, рядом с PRZEMÓW в соседней карточке. Родительный единственного и именительный множественного — одна форма KOMORY. Уменьшительное KOMÓRKA образовано от основы с Ó и склоняется отдельно; в значении телефона оно обычно и нейтрально." }
  - { kind: pronunciation, text: "Читается «комо́ра», три слога, ударение на втором — как в русской «коморе». Все согласные твёрдые, R раскатистое. В форме KOMORZE буквосочетание RZ даёт «ж»: «комо́же», и местный падеж на слух расходится с именительным. В форме KOMÓR буква Ó читается как «у», а ударение падает на первый слог: «ко́мур». В форме KOMORĘ конечное Ę звучит как чистое «э»: «комо́рэ»." }
  - { kind: register, text: "Слово нейтральное и широкое: оно живёт в медицине, в технике и в деревенском быту. Устойчивые сочетания: KOMORA SERCA, KOMORA SPALANIA, KOMORA CELNA «таможенный пост», KOMORA CHŁODNICZA. Историческое KOMORA GAZOWA принадлежит языку памяти о войне и в обычном разговоре не употребляется. В старом деревенском доме KOMORA это помещение рядом с сенями, где держали припасы, и в этом значении слово встречается в прозе и в этнографии. Производное KOMORNE означает квартирную плату, а KOMORNIK — судебного пристава." }
