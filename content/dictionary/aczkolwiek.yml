# review
id: aczkolwiek
format: 2
lemma: "aczkolwiek"
rank: 6021
pos: conj
pron: { cyr: "ачко́львек" }
senses:
  - id: although
    ru: "хотя"
    examples:
      - pl: "Aczkolwiek było zimno, poszliśmy na spacer."
        ru: "Хотя было холодно, мы пошли гулять."
        source: { kind: authored }
      - pl: "Nikt nie wierzył świadkowi, aczkolwiek mówił prawdę."
        ru: "Никто не верил свидетелю, хотя он говорил правду."
        source: { kind: authored }
      - pl: "Przyjdę, aczkolwiek trochę się spóźnię."
        ru: "Я приду, хотя немного опоздаю."
        source: { kind: authored }
  - id: albeit
    ru: "хотя и (перед прилагательным или наречием)"
    examples:
      - pl: "Mieszkanie było małe, aczkolwiek wygodne."
        ru: "Квартира была маленькой, хотя и удобной."
        source: { kind: authored }
      - pl: "Przyznał się do winy, aczkolwiek niechętnie."
        ru: "Он признал вину, хотя и неохотно."
        source: { kind: authored }
      - pl: "Wygraliśmy, aczkolwiek nie bez trudu."
        ru: "Мы победили, хотя и не без труда."
        source: { kind: authored }
notes:
  - { kind: register, text: "Книжный союз: встречается в письменной речи, в выступлениях, в официальных письмах. В разговоре говорят CHOCIAŻ или CHOĆ «хотя»." }
  - { kind: usage, text: "Перед ACZKOLWIEK ставится запятая, как перед русским «хотя». Может вводить целое придаточное (ACZKOLWIEK BYŁO ZIMNO…) или одно слово — тогда переводится «хотя и»: MAŁE, ACZKOLWIEK WYGODNE." }
  - { kind: pronunciation, text: "Читается «ачко́львек»: CZ — «ч», L перед согласной — «ль», WIEK — «век». Ударение на предпоследнем слоге: acz-KOL-wiek." }
collocations:
  - { pl: "aczkolwiek niechętnie", ru: "хотя и неохотно" }
  - { pl: "aczkolwiek nie bez trudu", ru: "хотя и не без труда" }
  - { pl: "aczkolwiek… jednak", ru: "хотя…, всё же" }
family:
  - { pl: "acz", ru: "хотя (устар.)", relation: root }
  - { pl: "ktokolwiek", ru: "кто угодно", relation: root, id: ktokolwiek }
synonyms: ["chociaż", "choć", "mimo że", "jakkolwiek"]
etymology: "Из старопольского ACZ «хотя» и частицы -KOLWIEK, той же, что в KTOKOLWIEK «кто угодно» и COKOLWIEK «что угодно»."
memory: "Aczkolwiek — книжное «хотя». Конец -kolwiek знаком по ktokolwiek и cokolwiek; в разговоре хватит chociaż."
idioms:
  - { pl: "aczkolwiek nie bez trudu", ru: "хотя и не без труда" }
