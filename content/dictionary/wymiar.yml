# review
id: wymiar
format: 2
lemma: "wymiar"
rank: 1872
pos: noun
pron: { cyr: "вы́мяр" }
senses:
  - id: dimension
    ru: "измерение, размер"
    examples:
      - pl: "Jakie są wymiary pokoju?"
        ru: "Каковы размеры комнаты?"
        source: { kind: translated, id: 3865309 }
      - pl: "Ciężko jest zobrazować cztery wymiary."
        ru: "Трудно представить четыре измерения."
        source: { kind: translated, id: 692597 }
      - pl: "Wymiary dywanu to 120 na 160 centymetrów."
        ru: "Размеры ковра — 120 на 160 сантиметров."
        source: { kind: translated, id: 527958 }
  - id: extent
    ru: "мера, объём (наказания, времени)"
    examples:
      - pl: "Ale to nie zmienia wymiaru kary."
        ru: "Но это не меняет размер наказания."
        source: { kind: tatoeba, id: 3449889 }
      - pl: "Jesteś aresztowany za utrudnianie pracy wymiaru sprawiedliwości."
        ru: "Ты арестован за воспрепятствование правосудию."
        source: { kind: translated, id: 13339122 }
      - pl: "Moja żona pracuje w niepełnym wymiarze godzin."
        ru: "Моя жена работает неполный рабочий день."
        source: { kind: translated, id: 6554307 }
notes:
  - { kind: usage, text: "wymiar sprawiedliwości — «правосудие», буквально «измерение справедливости»: utrudnianie pracy wymiaru sprawiedliwości «воспрепятствование правосудию»." }
  - { kind: usage, text: "w niepełnym wymiarze godzin — «на неполный рабочий день», стандартная формула в объявлениях о работе." }
  - { kind: government, text: "В измерении — w wymiarze (предложный падеж); размеры чего-то — wymiary czegoś (родительный)." }
  - { kind: false-friend, text: "Бытовой «размер» одежды или обуви — это rozmiar, а не wymiar: wymiar употребляют о геометрии, объёме и мере." }
collocations:
  - { pl: "wymiar sprawiedliwości", ru: "правосудие" }
  - { pl: "w niepełnym wymiarze godzin", ru: "на неполный рабочий день" }
  - { pl: "cztery wymiary", ru: "четыре измерения" }
family:
  - { pl: "mierzyć", ru: "мерить", relation: root }
  - { pl: "rozmiar", ru: "размер", relation: root }
  - { pl: "sprawiedliwość", ru: "справедливость", relation: root, id: sprawiedliwosc }
etymology: "От mierzyć «мерить», приставка wy-: то, что вымерено. Русское «измерение» построено от того же корня «мера»."
memory: "wymiar — «измерение, размер»: cztery wymiary. Бытовой размер одежды — rozmiar. И запомните wymiar sprawiedliwości «правосудие»."
idioms:
  - { pl: "wymiar sprawiedliwości", ru: "правосудие" }
  - { pl: "w niepełnym wymiarze godzin", ru: "на неполный рабочий день" }
  - { pl: "cztery wymiary", ru: "четыре измерения" }
