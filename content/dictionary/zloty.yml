notes:
  - { kind: usage, text: "Тем же словом называется польская валюта, и это не случайность: złoty — прилагательное, ставшее существительным. Поэтому и склоняется оно по-прилагательному: jeden złoty, dwa złote, pięć złotych, sto złotych." }
  - { kind: usage, text: "Счёт денег требует внимания: после 2, 3, 4 — złote, после 5 и больше — złotych. Ровно как русское «два рубля» против «пять рублей», только формы прилагательные." }
  - { kind: false-friend, text: "Существительное «золото» — это złoto, среднего рода: kilo złota «килограмм золота». Форма złota принадлежит и ему, и прилагательному, так что различать их приходится по смыслу." }
  - { kind: usage, text: "Устойчивые образы совпадают с русскими: złote serce «золотое сердце», złota rączka «мастер на все руки», obiecywać złote góry «обещать золотые горы»." }
collocations:
