  - { pl: "złocisty", ru: "золотистый", relation: derived }
  - { pl: "pozłacany", ru: "позолоченный", relation: derived }
etymology: "От złoto «золото», праславянское *zolto. Русское «золото» и «золотой» — те же слова, только с полногласием: złoty — золотой, głowa — голова."
memory: "złoty — «золотой», и тем же словом зовётся польская валюта: это прилагательное, ставшее существительным, поэтому склоняется по-прилагательному — jeden złoty, dwa złote, pięć złotych. Само «золото» это złoto, среднего рода. И помните чередование ło — оло: złoty — золотой."
idioms:
