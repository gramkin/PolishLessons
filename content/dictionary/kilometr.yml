# review
id: kilometr
format: 2
lemma: "kilometr"
rank: 2051
pos: noun
pron: { cyr: "кило́мэтр" }
senses:
  - id: kilometre
    ru: "километр"
    examples:
      - pl: "Przebiegliśmy 10 kilometrów."
        ru: "Мы пробежали десять километров."
        source: { kind: translated, id: 733056 }
      - pl: "Do Paryża jest 50 kilometrów."
        ru: "До Парижа пятьдесят километров."
        source: { kind: translated, id: 415210 }
      - pl: "Tom biega 10 kilometrów dziennie."
        ru: "Том бегает десять километров в день."
        source: { kind: translated, id: 3872380 }
      - pl: "Przeszliśmy około sześciu kilometrów."
        ru: "Мы прошли пешком около шести километров."
        source: { kind: tatoeba, id: 722344 }
      - pl: "Za kilometr będzie stacja benzynowa."
        ru: "Через километр будет заправка."
        source: { kind: translated, id: 6308388 }
      - pl: "Odległość od mojego do twojego domu wynosi dwa kilometry."
        ru: "Расстояние от моего дома до твоего — два километра."
        source: { kind: translated, id: 7886493 }
  - id: figurative
    ru: "в переносных оборотах"
    examples:
      - pl: "Od tych akcji trzymałbym się na kilometr."
        ru: "От этих акций я держался бы за километр."
        source: { kind: translated, id: 832670 }
      - pl: "Spudłować o centymetr, to tak jak spudłować o kilometr."
        ru: "Промахнуться на сантиметр — всё равно что промахнуться на километр."
        source: { kind: translated, id: 1045442 }
notes:
  - { kind: usage, text: "После числительных больше четырёх — родительный множественного: dziesięć kilometrów «десять километров», но dwa kilometry «два километра»." }
  - { kind: usage, text: "В сокращении пишется km, и именно так чаще всего выглядит в текстах: 50 km od stolicy." }
  - { kind: usage, text: "Оборот na kilometr значит «за километр», о том, что заметно издалека: omijać coś na kilometr «обходить за километр»." }
collocations:
  - { pl: "dziesięć kilometrów", ru: "десять километров" }
  - { pl: "kilometr dalej", ru: "километром дальше" }
  - { pl: "na kilometr", ru: "за километр" }
etymology: "Из французского kilomètre, составленного из греческого χίλιοι «тысяча» и metron «мера». Русский «километр» — то же заимствование, поэтому слова совпадают."
memory: "kilometr — «километр», в сокращении km. После числительных от пяти — родительный множественного: dziesięć kilometrów, но dwa kilometry."
idioms:
  - { pl: "dziesięć kilometrów", ru: "десять километров" }
  - { pl: "na kilometr", ru: "за километр" }
  - { pl: "kilometr kwadratowy", ru: "квадратный километр" }
