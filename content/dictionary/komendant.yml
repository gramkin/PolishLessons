notes:
  - { kind: false-friend, text: "Ловушка не в форме, а в ранге. Русский «комендант» — должность скромная: комендант общежития, комендант здания. Польский KOMENDANT стоит несравнимо выше: KOMENDANT POLICJI — начальник полиции, KOMENDANT STRAŻY POŻARNEJ — начальник пожарной охраны, а KOMENDANT GŁÓWNY POLICJI возглавляет полицию всей страны. В истории словом без уточнений называли Пилсудского. Переводя komendant русским «комендантом», вы понижаете человека на несколько ступеней." }
  - { kind: usage, text: "Согласный t меняется дважды и в обоих случаях на ć. Местный и звательный — KOMENDANCIE, перед окончанием -e; мужская личная форма множественного — KOMENDANCI, перед окончанием -i. Ровно так же ведёт себя ASYSTENT из партии 219: asystencie и asystenci. Правило стоит запомнить парой, потому что обе формы встречаются постоянно: звательная в обращении, множественная в любом тексте о службе." }
  - { kind: usage, text: "У слова есть и уничижительная форма — KOMENDANTY, — которой в русском языке нет вовсе как категории. Здесь она отличается от обычной множественной KOMENDANCI, и в этом контраст с DZIENNIKARZ из партии 226, где уничижительная совпала с обычной в одном написании DZIENNIKARZE. Значит у этой категории два устройства: иногда своя отдельная форма, как у wuj — wuje и здесь, иногда совпадение. В карточке формы komendanty нет, потому что её нет в наборе, с которым карточка сверяется." }
