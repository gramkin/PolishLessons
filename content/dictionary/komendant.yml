etymology: "От KOMENDA «команда», через немецкий из французского commande, а то — из латинского commendare «поручать, вверять»: приставка com- и mandare «вручать», тот же корень, что в «мандате». Русский взял из того же источника и «команду», и «комендант», но закрепил за последним мелкую должность, тогда как польский оставил слову исходный смысл начальника, которому вверено подразделение."
memory: "Выше русского «коменданта» на несколько ступеней: komendant policji — начальник полиции. И t даёт ć дважды: komendancie, komendanci."
