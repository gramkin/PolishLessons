# review
id: bulka
format: 2
lemma: "bułka"
rank: 5101
pos: noun
pron: { cyr: "бу́ука" }
senses:
  - id: roll
    ru: "булочка (хлебная)"
    examples:
      - pl: "Na śniadanie jem bułkę z masłem."
        ru: "На завтрак я ем булочку с маслом."
        source: { kind: authored }
      - pl: "Idę do piekarni po bułki."
        ru: "Я иду в пекарню за булочками."
        source: { kind: authored }
      - pl: "Ta bułka jest pełnoziarnista."
        ru: "Эта булочка цельнозерновая."
        source: { kind: authored }
  - id: sweet-bun
    ru: "сдобная булочка"
    examples:
      - pl: "Kupiłam słodką bułkę z jagodami."
        ru: "Я купила сладкую булочку с черникой."
        source: { kind: authored }
      - pl: "Dzieci dostały bułki z budyniem."
        ru: "Дети получили булочки с заварным кремом."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "BUŁKA — это маленькая булочка, а не «буханка» и не «батон». Буханка — BOCHENEK, хлеб — CHLEB, длинный батон — BUŁKA PARYSKA. BUŁKA TARTA — «панировочные сухари». Русское «булка» пришло как раз из польского." }
  - { kind: usage, text: "Девять живых форм, женский род. Перед E K переходит в C: NA BUŁCE. Родительный множественного — BUŁEK. Звательный не даётся." }
  - { kind: government, text: "С чем булочка — Z и творительный: BUŁKA Z MASŁEM, BUŁKA Z SEREM. Пойти за булочками — IŚĆ PO BUŁKI, PO с винительным." }
  - { kind: pronunciation, text: "Читается «бу́ука», ударение на первом слоге. Ł — «у», поэтому два «у» подряд, без «л»." }
collocations:
  - { pl: "świeże bułki", ru: "свежие булочки" }
  - { pl: "bułka tarta", ru: "панировочные сухари" }
  - { pl: "bułka paryska", ru: "батон" }
family:
  - { pl: "bułeczka", ru: "булочка (ласк.)", relation: derived }
  - { pl: "bułka z masłem", ru: "булка с маслом; проще простого", relation: derived }
  - { pl: "bułka tarta", ru: "панировочные сухари", relation: derived }
etymology: "Польское слово, из которого русский взял «булку». Его считают заимствованием из старофранцузского слова со значением «шар»."
memory: "Bułka — булочка; bochenek — буханка; bułka paryska — батон. Читается «бу́ука». To bułka z masłem — проще простого."
idioms:
  - { pl: "bułka z masłem", ru: "проще простого, раз плюнуть" }
formExamplesSkip:
  - { form: "bułko", reason: "звательный падеж у названия еды не употребляется" }
