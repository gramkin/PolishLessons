notes:
  - { kind: government, text: "С кем — Z + творительный, за что — O + винительный: RYWALIZOWAĆ Z KIMŚ O COŚ, RYWALIZOWAĆ O NAGRODĘ «бороться за награду». Русское «за» здесь передаётся предлогом O, а не ZA. В чём — W + предложный: RYWALIZOWAĆ W SPORCIE." }
  - { kind: usage, text: "Только несовершенный вид, пары у глагола нет; результат выражают другие слова: WYGRAĆ, POKONAĆ. Спряжение -OWAĆ → -UJĘ: RYWALIZUJĘ, RYWALIZUJESZ, RYWALIZUJĄ. Глагол непереходный, страдательных причастий нет; безличное RYWALIZOWANO возможно: O MEDALE RYWALIZOWANO ZACIEKLE." }
  - { kind: pronunciation, text: "Ударение на предпоследнем слоге: RYWALIZOWAĆ — «рывализо́ваць», RYWALIZUJĄ — «рывализу́йоу̃». Y — «ы», LI — мягкое «ли»." }
