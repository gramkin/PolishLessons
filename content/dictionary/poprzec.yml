senses:
  - id: support
    ru: "поддержать (кандидата, предложение)"
    examples:
      - pl: "Poparł wniosek bez wahania."
        ru: "Он поддержал предложение без колебаний."
        source: { kind: authored }
      - pl: "Poprę ten projekt, jeśli zmienią trzeci punkt."
        ru: "Я поддержу этот проект, если изменят третий пункт."
        source: { kind: authored }
      - pl: "Poparto wniosek jednogłośnie."
        ru: "Предложение поддержали единогласно."
        source: { kind: authored }
  - id: corroborate
    ru: "подкрепить (доказательствами, подписями)"
    examples:
      - pl: "Oskarżenie poparte nagraniem trudno było podważyć."
        ru: "Обвинение, подкреплённое записью, трудно было оспорить."
        source: { kind: authored }
      - pl: "Poparte podpisami żądania trafiły do ministerstwa."
        ru: "Требования, подкреплённые подписями, попали в министерство."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "По частям слово разбирается прозрачно, и именно поэтому обманывает. POPRZEĆ это PO- и PRZEĆ «напирать, переть», то есть буквально «подпереть», но значит оно «поддержать»: POPRZEĆ WNIOSEK «поддержать предложение», POPRZEĆ KANDYDATA. Русское «попереть» с ним не имеет ничего общего — оно просторечное и значит «ломиться, двинуть», так что POPARŁEM GO переводится «я его поддержал», а не «я на него попёр». Существительное POPARCIE это «поддержка», не «подпорка»: CIESZYĆ SIĘ POPARCIEM «пользоваться поддержкой», UDZIELIĆ POPARCIA «оказать поддержку». Для физической подпорки польский берёт PODPORA или OPARCIE." }
  - { kind: government, text: "Совершенный вид, несовершенный — POPIERAĆ. Отсюда главное: POPRĘ, POPRZESZ, POPRZE это будущее время, «поддержу», а не «поддерживаю»; настоящее даёт POPIERAĆ с его POPIERAM. Вторая особенность важнее: у глагола две основы, и они не смешиваются. POPRZ- живёт только в будущем и повелительном — POPRĘ, POPRZESZ, POPRZYJ, — а прошедшее, причастие и отглагольное существительное строятся на POPAR-: POPARŁ, POPARTY, POPARŁSZY, POPARCIE. Управление простое: кого или что поддерживают — винительный без предлога, POPRZEĆ WNIOSEK, POPRZEĆ KANDYDATA. Чем подкрепляют — творительный без предлога: POPRZEĆ ŻĄDANIA PODPISAMI." }
  - { kind: pronunciation, text: "Читается «по́пшэць», ударение на предпоследнем слоге, то есть на первом из двух. Сочетание RZ после глухого P оглушается и звучит «ш», а не «ж»: отсюда «попшэць», и та же картина в POPRZESZ «по́пшэш». В формах прошедшего времени картина меняется вместе с основой: POPARŁ читается «по́пару», где Ł даёт «у». В причастии POPARTY звучит «попа́рты» с твёрдым Т. Отглагольное существительное POPARCIE читается «попа́рце», где CI даёт мягкое «ць»: «попа́рцье»." }
  - { kind: usage, text: "Обороты, которые стоит знать целиком: POPRZEĆ WNIOSEK «поддержать предложение», POPRZEĆ KANDYDATURĘ, CIESZYĆ SIĘ POPARCIEM «пользоваться поддержкой», UDZIELIĆ KOMUŚ POPARCIA, POPARCIE SPOŁECZNE «общественная поддержка». Слово принадлежит языку политики, администрации и права и там же набирает частотность. Рядом стоит целое гнездо с корнем PRZEĆ, и значения в нём расходятся сильно: OPRZEĆ «опереть, прислонить», WESPRZEĆ «поддержать, помочь», NAPRZEĆ «напереть», ZAPRZEĆ «запереть, затаить». Для поддержки деньгами или делом чаще скажут WSPIERAĆ, а POPRZEĆ оставляют для голоса и мнения." }
