etymology: "Приставка PO- и глагол PRZEĆ «напирать, давить», из праславянского *perti, того же корня, что русские «переть», «опереть», «подпереть», «опора», «упор». По частям POPRZEĆ это в точности русское «подпереть», и образ понятен: поддержать значит подпереть снизу. Любопытно, что три языка выбрали для одной мысли три разных действия. Польский взял напор: POPRZEĆ. Русский взял держание: «поддержать», от «держать». Латынь взяла несение снизу: SUPPORTARE, из SUB «под» и PORTARE «нести», откуда английское SUPPORT и французское SUPPORT. Все три сходятся на «снизу», но подпирают, держат и несут соответственно. В польском гнезде корня PRZEĆ значения разошлись широко: OPRZEĆ «прислонить», WESPRZEĆ «помочь», ZAPRZEĆ «запереть», и ни одно не выводится из другого без оговорок."
memory: "Поддержать, а не «попереть»: poprzeć wniosek «поддержать предложение», poparcie «поддержка». Две основы, и они не смешиваются: poprz- только в будущем и повелительном — poprę, poprzesz, poprzyj, — а прошедшее и причастие на popar-: poparł, poparty, poparcie. Совершенный вид, несовершенный — popierać, и poprę значит «поддержу», а не «поддерживаю». По частям это русское «подпереть»; русский для той же мысли взял «держать», латынь — «нести снизу»."
idioms:
  - { pl: "cieszyć się poparciem", ru: "пользоваться поддержкой" }
  - { pl: "udzielić poparcia", ru: "оказать поддержку" }
