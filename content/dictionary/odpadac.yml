# review
id: odpadac
format: 2
lemma: "odpadać"
rank: 3745
pos: verb
pron: { cyr: "отпа́даць" }
senses:
  - id: fall-off
    ru: "отпадать, отваливаться"
    examples:
      - pl: "Tynk odpada ze ścian."
        ru: "Штукатурка отваливается от стен."
        source: { kind: authored }
      - pl: "Z drzwi odpada farba."
        ru: "С двери облезает краска."
        source: { kind: authored }
      - pl: "Liście odpadają jesienią."
        ru: "Осенью листья опадают."
        source: { kind: authored }
  - id: drop-out
    ru: "выбывать (из соревнований); отпадать (о варианте)"
    examples:
      - pl: "Nasza drużyna odpada w półfinale."
        ru: "Наша команда вылетает в полуфинале."
        source: { kind: authored }
      - pl: "Ten termin odpada, jestem zajęty."
        ru: "Этот срок отпадает, я занят."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ODPADAĆ — «отпадать», совпадение почти полное, включая переносное «этот вариант отпадает»: TO ODPADA. Разговорное ODPADAM значит «я пас», «я выхожу из игры». ODPADY — «отходы», мусор: SEGREGACJA ODPADÓW «сортировка отходов»." }
  - { kind: usage, text: "Несовершенный вид; совершенный — ODPAŚĆ. Спряжение на -AM: ODPADAM, ODPADASZ, ODPADAJĄ. Повелительное и безличное ODPADANO в карточку не включены. ODPADANIE — «отслаивание»: ODPADANIE TYNKU." }
  - { kind: government, text: "Откуда — Z или OD с родительным: ODPADAĆ ZE ŚCIANY, OD SUFITU. Из чего выбыть — Z с родительным: ODPADAĆ Z TURNIEJU. На каком этапе — W с предложным: W PÓŁFINALE." }
  - { kind: pronunciation, text: "Читается «отпа́даць»: D перед P оглушается в «т». Ударение на предпоследнем слоге. ODPADA — «отпа́да»." }
  - { kind: register, text: "Нейтральное слово. Разговорное TO ODPADA «это не вариант» и ODPADAM «я пас» — очень частые." }
collocations:
  - { pl: "tynk odpada", ru: "штукатурка отваливается" }
  - { pl: "odpadać z turnieju", ru: "вылетать из турнира" }
  - { pl: "to odpada", ru: "это отпадает, не вариант" }
family:
  - { pl: "odpaść", ru: "отпасть, выбыть", relation: aspect }
  - { pl: "odpady", ru: "отходы", relation: derived }
  - { pl: "spadać", ru: "падать, спадать", relation: root, id: spadac }
etymology: "Приставка OD- плюс PADAĆ «падать», праславянское *padati, как русское «отпадать». Тот же корень в ODPADY «отходы» — «то, что отпало»."
memory: "Odpadać — отпадать: tynk odpada. To odpada — не вариант. Odpadam — я пас. Odpady — отходы."
idioms:
  - { pl: "ręce mi odpadają", ru: "руки отваливаются (от усталости)" }
formExamplesSkip:
  - { form: "odpadaj", reason: "повелительное не употребляется" }
  - { form: "odpadajmy", reason: "повелительное не употребляется" }
  - { form: "odpadajcie", reason: "повелительное не употребляется" }
  - { form: "odpadano", reason: "безличная форма не употребляется" }
