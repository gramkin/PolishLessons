# review
id: szalenstwo
format: 2
lemma: "szaleństwo"
rank: 1282
pos: noun
pron: { cyr: "шале́ньство" }
senses:
  - id: madness
    ru: "безумие, сумасшествие"
    examples:
      - pl: "To szaleństwo."
        ru: "Это безумие."
        source: { kind: translated, id: 975975 }
      - pl: "To było czystym szaleństwem."
        ru: "Это было чистым безумием."
        source: { kind: translated, id: 7053619 }
      - pl: "Jego odwaga graniczyła z szaleństwem."
        ru: "Его отвага граничила с безумием."
        source: { kind: tatoeba, id: 6155924 }
  - id: drive-mad
    ru: "doprowadzać do szaleństwa — сводить с ума"
    examples:
      - pl: "Ona doprowadza mnie do szaleństwa."
        ru: "Она сводит меня с ума."
        source: { kind: translated, id: 1633110 }
      - pl: "Brat prawie doprowadził mnie do szaleństwa."
        ru: "Брат чуть с ума меня не свёл."
        source: { kind: tatoeba, id: 8664477 }
      - pl: "On doprowadza nauczyciela do szaleństwa."
        ru: "Он сводит учителя с ума."
        source: { kind: translated, id: 12960008 }
  - id: wild-fun
    ru: "во множественном — безумства, весёлые выходки"
    examples:
      - pl: "Lubię twoje szaleństwa."
        ru: "Мне нравятся твои безумства."
        source: { kind: translated, id: 12227358 }
      - pl: "Szaleństwom nie było końca."
        ru: "Безумствам не было конца."
        source: { kind: tatoeba, id: 6155927 }
      - pl: "Dość już tych szaleństw!"
        ru: "Хватит уже этих безумств!"
        source: { kind: translated, id: 6160032 }
notes:
  - { kind: usage, text: "Три слоя значения: «безумие» как болезнь, «безумство» как безрассудный поступок и во множественном — «весёлые выходки»: zimowe szaleństwa «зимние забавы»." }
  - { kind: government, text: "doprowadzić kogoś do szaleństwa «свести кого-то с ума» — предлог do с родительным падежом." }
  - { kind: usage, text: "W tym szaleństwie jest metoda — «в этом безумии есть метод», цитата из Гамлета, вошедшая в язык." }
  - { kind: pronunciation, text: "ń звучит как «нь», а сочетание -stwo как «-ство»: шале́ньство." }
collocations:
  - { pl: "doprowadzać do szaleństwa", ru: "сводить с ума" }
  - { pl: "czyste szaleństwo", ru: "чистое безумие" }
  - { pl: "do szaleństwa", ru: "до безумия" }
etymology: "От szalony «безумный», из праславянского *šalъ «бешеный, шальной». Русское «шальной» — то же слово."
memory: "szaleństwo — «безумие», а во множественном szaleństwa ещё и «весёлые выходки». Главный оборот — doprowadzać kogoś do szaleństwa «сводить кого-то с ума». Корень тот же, что в русском «шальной»."
idioms:
  - { pl: "doprowadzać do szaleństwa", ru: "сводить с ума" }
  - { pl: "w tym szaleństwie jest metoda", ru: "в этом безумии есть метод" }
  - { pl: "czyste szaleństwo", ru: "чистое безумие" }
