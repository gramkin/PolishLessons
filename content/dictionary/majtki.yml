notes:
  - { kind: false-friend, text: "MAJTKI — «трусы», не «майка»: майка — KOSZULKA или PODKOSZULEK. Только множественное: JEDNE MAJTKI, «одни трусы», DWIE PARY MAJTEK. Мужские боксеры — BOKSERKI." }
  - { kind: usage, text: "Pluralia tantum: пять форм, все множественные. Родительный — MAJTEK, с беглым E. Одна пара — JEDNE MAJTKI, с собирательным JEDNE." }
  - { kind: government, text: "Пара трусов — PARA MAJTEK, родительный. В трусах — W MAJTKACH, местный. Без трусов — BEZ MAJTEK." }
  - { kind: pronunciation, text: "Читается «ма́йтки»: AJ — «ай». Ударение на первом слоге." }
collocations:
