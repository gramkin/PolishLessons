# review
id: owszem
format: 2
lemma: "owszem"
rank: 1175
pos: part
pron: { cyr: "о́вшэм" }
senses:
  - id: yes
    ru: "да, конечно, разумеется (подтверждение)"
    examples:
      - pl: "Owszem, znam ją."
        ru: "Да, я её знаю."
        source: { kind: translated, id: 734361 }
      - pl: "Owszem, gotuję, ale nie jestem w tym najlepszy."
        ru: "Да, я готовлю, но не то чтобы очень хорошо."
        source: { kind: translated, id: 722156 }
      - pl: "Owszem, ten słownik przydaje się początkującym, ale zaawansowanym uczącym się też."
        ru: "Да, этот словарь полезен начинающим, но и продвинутым тоже."
        source: { kind: translated, id: 875530 }
  - id: but-yes
    ru: "а вот, напротив (возражение собеседнику)"
    examples:
      - pl: "Nie jesteś odpowiedzialny za to, co już się wydarzyło, ale owszem za to, co się jeszcze wydarzy!"
        ru: "Ты не отвечаешь за то, что уже случилось, а вот за то, что ещё случится, — да."
        source: { kind: translated, id: 7321431 }
      - pl: "Nie lubię kawy, owszem herbatę."
        ru: "Кофе я не люблю, а вот чай — да."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Утвердительный ответ, чуть более вежливый и книжный, чем простое tak «да». Часто открывает уточнение: Owszem, ale." }
  - { kind: usage, text: "Особенность: owszem годится и как ответ на вопрос с отрицанием. На Nie idziesz? «Ты не идёшь?» ответ Owszem значит «Нет, иду» — русское «да» здесь двусмысленно." }
  - { kind: usage, text: "Не склоняется и не изменяется: это частица, а не прилагательное." }
  - { kind: usage, text: "В сочетании a owszem звучит совсем разговорно: «а как же, ещё как»." }
collocations:
  - { pl: "owszem, ale", ru: "да, но" }
  - { pl: "a owszem", ru: "а как же" }
  - { pl: "owszem, znam", ru: "да, знаю" }
family:
  - { pl: "tak", ru: "да", relation: root, id: tak }
etymology: "Из старого oboje + że, застывшего в утвердительную частицу. Русское «конечно» и «разумеется» собраны иначе, но работают на том же месте."
memory: "owszem — «да, конечно», чуть вежливее простого tak. Главная тонкость: на вопрос с отрицанием (Nie idziesz?) ответ owszem значит «нет, иду» — там, где русское «да» двусмысленно."
idioms:
