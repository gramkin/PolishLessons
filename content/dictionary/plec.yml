notes:
  - { kind: false-friend, text: "PŁEĆ — «пол» как мужской или женский. Пол в комнате — PODŁOGA, и путать их легко: оба по-русски «пол». PŁEĆ ещё и «плоть» по происхождению: тело, а не доски." }
  - { kind: usage, text: "Семь форм, женский род, мягкая основа. Е выпадает: PŁEĆ, но PŁCI во всех косвенных падежах единственного. Множественное PŁCIE встречается редко: OBIE PŁCIE." }
  - { kind: government, text: "По признаку пола — ZE WZGLĘDU NA PŁEĆ, NA с винительным. Обоих полов — OBU PŁCI, родительный. Лица одного пола — OSOBY TEJ SAMEJ PŁCI." }
  - { kind: pronunciation, text: "Читается «пуэць», один слог: Ł — «у», конечное Ć — мягкое «ць». В PŁCI гласной нет вовсе: «пуци» с мягким «ць»." }
