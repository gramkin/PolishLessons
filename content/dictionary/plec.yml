etymology: "Из праславянского *пълть «плоть, тело» — то же, что русское «плоть». В польском значение сузилось до «пол». Русское «пол» в этом смысле — другое слово."
memory: "Płeć — пол (мужской или женский), а пол в комнате — podłoga. Читается «пуэць». Płeć piękna — прекрасный пол. Od płeć — płciowy."
