# review
id: opowiadac
format: 2
lemma: "opowiadać"
rank: 1255
pos: verb
aspect: imperf
aspectPair: opowiedziec
pron: { cyr: "оповя́даць" }
senses:
  - id: tell
    ru: "рассказывать"
    examples:
      - pl: "Umiesz opowiadać bajki?"
        ru: "Ты умеешь рассказывать сказки?"
        source: { kind: tatoeba, id: 6156330 }
      - pl: "Babcia opowiadała mu bajki na dobranoc."
        ru: "Бабушка рассказывала ему сказки на ночь."
        source: { kind: tatoeba, id: 6156328 }
      - pl: "Tom opowiada historię."
        ru: "Том рассказывает историю."
        source: { kind: translated, id: 3432813 }
  - id: tell-about
    ru: "opowiadać o czymś — рассказывать о чём-то"
    examples:
      - pl: "Ona nigdy nie opowiadała o swoim pierwszym mężu."
        ru: "Она никогда не рассказывала о своём первом муже."
        source: { kind: tatoeba, id: 13116573 }
      - pl: "Opowiadał o podróży."
        ru: "Он рассказывал о поездке."
        source: { kind: translated, id: 350755 }
      - pl: "Opowiadałem mu o naszej szkole."
        ru: "Я рассказывал ему о нашей школе."
        source: { kind: translated, id: 670411 }
  - id: story
    ru: "opowiadanie — рассказ (литературный жанр)"
    examples:
      - pl: "Przeczytałem to opowiadanie w jakiejś książce."
        ru: "Я прочитал этот рассказ в какой-то книге."
        source: { kind: tatoeba, id: 352497 }
      - pl: "Ona pisze opowiadania."
        ru: "Она пишет рассказы."
        source: { kind: translated, id: 620835 }
      - pl: "To jest interesujące opowiadanie."
        ru: "Это интересный рассказ."
        source: { kind: translated, id: 2011161 }
notes:
  - { kind: government, text: "opowiadać komuś o czymś «рассказывать кому-то о чём-то»: дательный для слушателя и o с предложным для темы. Можно и без предлога, с винительным: opowiadać bajki «рассказывать сказки»." }
  - { kind: usage, text: "Отглагольное существительное opowiadanie значит «рассказ» как литературный жанр: Ona pisze opowiadania." }
  - { kind: usage, text: "Вид несовершенный; совершенный — opowiedzieć, карточка уже есть. Nie opowiadaj głupstw! «Не говори глупостей!»." }
  - { kind: usage, text: "Второе, книжное значение — «высказываться за что-то»: opowiadać się za czymś." }
collocations:
  - { pl: "opowiadać bajki", ru: "рассказывать сказки" }
  - { pl: "opowiadać o czymś", ru: "рассказывать о чём-то" }
  - { pl: "pisać opowiadania", ru: "писать рассказы" }
etymology: "Приставка o- и powiadać «говорить», от wiedzieć «знать». Русское «рассказывать» строится от «сказать», но логика та же: передать известное."
memory: "opowiadać — «рассказывать»: opowiadać komuś o czymś. Совершенный вид — opowiedzieć. Существительное opowiadanie значит «рассказ» как жанр. И запомните Nie opowiadaj głupstw! «Не говори глупостей!»."
idioms:
  - { pl: "opowiadać bajki", ru: "рассказывать сказки" }
  - { pl: "nie opowiadaj głupstw", ru: "не говори глупостей" }
  - { pl: "opowiadać niestworzone rzeczy", ru: "рассказывать небылицы" }
