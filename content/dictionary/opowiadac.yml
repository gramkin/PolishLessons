    ru: "Её плач добавил рассказу достоверности."
    source: { kind: translated, id: 709278 }
  - form: "opowiadaniu"
    pl: "On prawdopodobnie przesadza w swoim opowiadaniu."
    ru: "Он, вероятно, преувеличивает в своём рассказе."
    source: { kind: translated, id: 3043431 }
  - form: "opowiadaniu"
