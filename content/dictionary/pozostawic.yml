# review
id: pozostawic
format: 2
lemma: "pozostawić"
rank: 3824
pos: verb
pron: { cyr: "позоста́виць" }
senses:
  - id: leave
    ru: "оставить (книжн.)"
    examples:
      - pl: "Proszę pozostawić bagaż w szatni."
        ru: "Просьба оставить багаж в гардеробе."
        source: { kind: authored }
      - pl: "Pozostawił po sobie wspaniałe dzieła."
        ru: "Он оставил после себя прекрасные произведения."
        source: { kind: authored }
      - pl: "Pozostawiła męża z trójką dzieci."
        ru: "Она оставила мужа с тремя детьми."
        source: { kind: authored }
  - id: leave-as-is
    ru: "оставить как есть, предоставить (решение)"
    examples:
      - pl: "Pozostawię tę decyzję tobie."
        ru: "Я оставлю это решение тебе."
        source: { kind: authored }
      - pl: "Sąd pozostawił wyrok bez zmian."
        ru: "Суд оставил приговор без изменений."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "POZOSTAWIĆ — книжный двойник обычного ZOSTAWIĆ, «оставить». В объявлениях, письмах, законах — POZOSTAWIĆ: PROSZĘ NIE POZOSTAWIAĆ BAGAŻU BEZ OPIEKI, «не оставляйте багаж без присмотра». В разговоре — ZOSTAWIĆ: ZOSTAW TO! Не путать с POZOSTAĆ, «остаться»." }
  - { kind: usage, text: "Пятьдесят три формы — подпись переходного глагола совершенного вида: страдательное POZOSTAWIONY, «оставленный», и деепричастие POZOSTAWIWSZY. Видовой партнёр — POZOSTAWIAĆ. Устойчивое: POZOSTAWIAĆ WIELE DO ŻYCZENIA, «оставлять желать лучшего», — почти всегда в несовершенном." }
  - { kind: government, text: "Что — винительный, кому — дательный: POZOSTAWIĆ KOMUŚ WYBÓR, DECYZJĘ. Без чего — BEZ с родительным: POZOSTAWIĆ BEZ ODPOWIEDZI, BEZ OPIEKI. После себя — PO SOBIE: POZOSTAWIĆ PO SOBIE ŚLAD." }
  - { kind: pronunciation, text: "Читается «позоста́виць», четыре слога, ударение на предпоследнем. ZO — звонкое «зо», WI — мягкое «ви», конечное Ć — «ць». Повелительное POZOSTAW — «позо́став»." }
  - { kind: register, text: "Книжное и официальное слово: объявления, документы, некрологи, новости. POZOSTAWIĆ BEZ ODPOWIEDZI, POZOSTAWIĆ W SPOKOJU — устойчивые. В быту на тех же местах — ZOSTAWIĆ." }
collocations:
  - { pl: "pozostawić bez odpowiedzi", ru: "оставить без ответа" }
  - { pl: "pozostawić po sobie", ru: "оставить после себя" }
  - { pl: "pozostawić wybór", ru: "оставить выбор" }
family:
  - { pl: "pozostawiać", ru: "оставлять", relation: aspect }
  - { pl: "zostawić", ru: "оставить", relation: root, id: zostawic }
  - { pl: "pozostać", ru: "остаться", relation: root, id: pozostac }
etymology: "Приставка PO- плюс ZOSTAWIĆ, от STAWIĆ «ставить», праславянское *staviti, то же, что русское «ставить», «оставить». Двойная приставка PO-ZO- придаёт слову книжный оттенок."
memory: "Pozostawić — оставить, книжно: pozostawić bagaż, pozostawić bez odpowiedzi. В разговоре — zostawić. Pozostać — остаться! Читается «позоста́виць»."
idioms:
  - { pl: "pozostawiać wiele do życzenia", ru: "оставлять желать лучшего" }
