notes:
  - { kind: false-friend, text: "SANITARIUSZ — «санитар». Не путайте с SANATORIUM — «санаторий». Спасатель, парамедик — RATOWNIK MEDYCZNY, медсестра — PIELĘGNIARKA." }
  - { kind: usage, text: "Мужской род, лицо. Множественное — SANITARIUSZE, родительный — SANITARIUSZY. Местный и звательный — SANITARIUSZU." }
  - { kind: government, text: "Работать санитаром — PRACOWAĆ JAKO SANITARIUSZ или BYĆ SANITARIUSZEM, творительный. Позвать санитара — ZAWOŁAĆ SANITARIUSZA." }
  - { kind: pronunciation, text: "Читается «санита́рьюш»: RIU — «рью», SZ — «ш». Ударение на предпоследнем слоге." }
