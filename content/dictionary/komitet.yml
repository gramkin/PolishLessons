notes:
  - { kind: false-friend, text: "KOMITET — «комитет», как в русском. Но KOMITET WYBORCZY — «избирательный штаб» партии или кандидата, а не «избирком»: избирательная комиссия — KOMISJA WYBORCZA." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Родительный — KOMITETU. В местном T переходит в C: W KOMITECIE." }
  - { kind: government, text: "Входить в комитет — BYĆ W KOMITECIE, местный. Комитет по чему — KOMITET DO SPRAW и родительный: KOMITET DO SPRAW KULTURY." }
  - { kind: pronunciation, text: "Читается «коми́тэт», ударение на предпоследнем слоге. TE — твёрдое «тэ». KOMITECIE — «комитэ́це»." }
collocations:
  - { pl: "komitet organizacyjny", ru: "оргкомитет" }
  - { pl: "komitet wyborczy", ru: "избирательный штаб" }
