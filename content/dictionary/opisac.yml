  - id: label
    ru: "подписать, надписать (пометить)"
    examples:
      - pl: "Opisz pudełka, żeby się nie pomylić."
        ru: "Подпиши коробки, чтобы не перепутать."
        source: { kind: authored }
notes:
  - { kind: pronunciation, text: "ОСНОВА НАСТОЯЩЕГО ВРЕМЕНИ МЕНЯЕТ S НА SZ — И РУССКИЙ ДЕЛАЕТ ТО ЖЕ САМОЕ. Инфинитив opisać даёт opiszę, opiszesz, opisze, opiszą; русское «описать» даёт «опишу, опишешь». Там с переходит в ш, здесь s в sz — одно и то же древнее чередование. Повелительное наклонение тоже на sz: opisz!" }
  - { kind: government, text: "Описывают КОГО или ЧТО — винительный без предлога: opisać wypadek, opisać człowieka, opisać sytuację. Чем, какими словами — творительный или оборот с w: opisał to w dwóch zdaniach. Безличное opisano «описали» очень частотно в научном тексте." }
  - { kind: false-friend, text: "Ловушки нет: корень pisać «писать» тот же, что русский, и приставка o- равна русской о-. Opisać это «описать» во всех значениях сразу. Стоит лишь помнить третье, бытовое: opisać pudełko значит «надписать коробку», сделать на ней пометку." }
  - { kind: usage, text: "Вид совершенный, несовершенная пара — opisywać. Поэтому есть деепричастие opisawszy и нет действительного причастия настоящего времени. Существительное opis «описание» короче ожидаемого opisanie и употребляется чаще: opis produktu, opis przyrody." }
collocations:
  - { pl: "opisać sytuację", ru: "описать ситуацию" }
  - { pl: "opisać w książce", ru: "описать в книге" }
  - { pl: "trudno opisać", ru: "трудно описать" }
family:
  - { pl: "pisać", ru: "писать", relation: root, id: pisac }
  - { pl: "opisywać", ru: "описывать", relation: aspect }
  - { pl: "opis", ru: "описание", relation: derived }
  - { pl: "napisać", ru: "написать", relation: derived, id: napisac }
etymology: "Приставка o- плюс pisać, из праславянского *pisati «писать, рисовать», родственного латинскому pingere «рисовать» и русскому «писать»; исходный смысл был «наносить знаки, расписывать». Отсюда opis, opisywać, pismo, pisarz. Чередование s и sz в настоящем времени — след древнего смягчения перед гласным переднего ряда."
memory: "opisać — «описать», от pisać «писать». Главное — чередование в настоящем времени: opiszę, opiszesz, как русское «опишу, опишешь». И повелительное тоже на sz: opisz! Существительное короткое: opis, а не «opisanie»."
idioms:
  - { pl: "nie da się opisać", ru: "не поддаётся описанию" }
  - { pl: "opisać w dwóch słowach", ru: "описать в двух словах" }
