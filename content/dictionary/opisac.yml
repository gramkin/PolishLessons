        ru: "Он описал в романе всю свою деревню."
        source: { kind: authored }
      - pl: "Zjawisko opisano po raz pierwszy w tysiąc dziewięćsetnym roku."
        ru: "Явление впервые описали в тысяча девятисотом году."
