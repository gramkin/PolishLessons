notes:
  - { kind: false-friend, text: "Губная помада по-польски — SZMINKA, а польское POMADA — это прежде всего помада для волос. Гигиеническая помада — POMADKA OCHRONNA. SZMINKA пришла из немецкого, где родственное слово значит «грим, косметика»." }
  - { kind: usage, text: "Девять форм, женский род. Перед E K переходит в C: W SZMINCE. Родительный множественного — SZMINEK. Звательного падежа у вещи нет." }
  - { kind: government, text: "Накрасить губы помадой — UMALOWAĆ USTA SZMINKĄ или POMALOWAĆ USTA SZMINKĄ, творительный без предлога. След помады — ŚLAD SZMINKI, родительный." }
  - { kind: pronunciation, text: "Читается «шми́нка», два слога, ударение на первом. SZ — твёрдое «ш»." }
  - { kind: register, text: "Обиходное слово. Карандаш для губ — KONTURÓWKA или KREDKA DO UST, блеск — BŁYSZCZYK." }
collocations:
  - { pl: "czerwona szminka", ru: "красная помада" }
  - { pl: "ślad szminki", ru: "след помады" }
  - { pl: "pomalować usta szminką", ru: "накрасить губы помадой" }
family:
  - { pl: "szminkować się", ru: "краситься, гримироваться", relation: root }
  - { pl: "uszminkowany", ru: "накрашенный", relation: derived }
  - { pl: "szminkowanie", ru: "нанесение косметики", relation: derived }
etymology: "Из немецкого: там родственное слово значит «грим, косметика», а глагол — «гримировать, краситься». В польском значение сузилось до губной помады."
memory: "Szminka — губная помада; pomada — помада для волос. Читается «шми́нка». Pomalować usta szminką — накрасить губы. Ślad szminki — след помады."
