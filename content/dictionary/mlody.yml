# review
id: mlody
format: 2
lemma: "młody"
rank: 328
pos: adj
pron: { cyr: "муо́ды" }
senses:
  - id: young
    ru: "молодой"
    examples:
      - pl: "Tomasz jest młody."
        ru: "Том молодой."
        source: { kind: tatoeba, id: 3743777 }
      - pl: "Jest młodą studentką."
        ru: "Она молодая студентка."
        source: { kind: tatoeba, id: 5183800 }
      - pl: "Była młoda i niewinna."
        ru: "Она была молода и невинна."
        source: { kind: tatoeba, id: 1853815 }
  - id: bride-groom
    ru: "pan młody — жених, panna młoda — невеста"
    note: "Буквально «молодой господин» и «молодая барышня»."
    examples:
      - pl: "Pan młody jest przystojny."
        ru: "Жених красив."
        source: { kind: tatoeba, id: 12678782 }
      - pl: "Jest panem młodym."
        ru: "Он жених."
        source: { kind: translated, id: 12312150 }
      - pl: "To ojciec panny młodej."
        ru: "Это отец невесты."
        source: { kind: translated, id: 521317 }
notes:
  - { kind: usage, text: "Свадебные обороты стоит выучить целиком: pan młody «жених», panna młoda «невеста», państwo młodzi «молодожёны»." }
  - { kind: usage, text: "Степени: młody — młodszy — najmłodszy. Młodszy brat — «младший брат», najmłodszy w rodzinie — «самый младший в семье»." }
  - { kind: usage, text: "Множественное młodzi значит «молодые, молодёжь»: Ulice pełne były młodych par." }
collocations:
  - { pl: "młody człowiek", ru: "молодой человек" }
  - { pl: "pan młody", ru: "жених" }
  - { pl: "młodszy brat", ru: "младший брат" }
  - { pl: "najmłodszy w rodzinie", ru: "самый младший в семье" }
etymology: "Праславянское *moldъ — то же слово, что русское «молодой»; русский дал полногласие -оло-, польский обошёлся без него: młody."
memory: "młody — «молодой»: русское слово с полногласием, польское без. А pan młody значит «жених», panna młoda — «невеста»."
idioms:
  - { pl: "pan młody", ru: "жених" }
  - { pl: "panna młoda", ru: "невеста" }
  - { pl: "młody gniewny", ru: "молодой да ранний" }
