# review
id: poruszac
format: 2
lemma: "poruszać"
rank: 2196
pos: verb
aspect: imperf
pron: { cyr: "пору́шаць" }
senses:
  - id: move
    ru: "двигаться, передвигаться (poruszać się)"
    examples:
      - pl: "Ziemia porusza się po orbicie dookoła Słońca."
        ru: "Земля движется по орбите вокруг Солнца."
        source: { kind: tatoeba, id: 5909184 }
      - pl: "Ślimaki poruszają się powoli."
        ru: "Улитки передвигаются медленно."
        source: { kind: tatoeba, id: 12470080 }
      - pl: "Nie mogę się poruszać."
        ru: "Я не могу двигаться."
        source: { kind: translated, id: 5015686 }
  - id: raise-topic
    ru: "затрагивать (тему, вопрос)"
    examples:
      - pl: "Nie poruszajmy tego tematu."
        ru: "Не будем затрагивать эту тему."
        source: { kind: translated, id: 13690253 }
      - pl: "Nigdy nie poruszaj tematów religii i polityki w czasie pierwszej rozmowy!"
        ru: "Никогда не затрагивай темы религии и политики за ужином."
        source: { kind: translated, id: 1844895 }
notes:
  - { kind: government, text: "С się — непереходное «двигаться»: porusza się szybko. Без się — переходное «затрагивать»: poruszać temat, винительный падеж." }
  - { kind: usage, text: "Причастие poruszający значит «трогательный, волнующий»: poruszająca historia «трогательная история». Это третий пласт значения — душевное движение." }
  - { kind: false-friend, text: "Корень ruch «движение», который уже есть в словаре; ср. русское «рушить», «двигать»." }
  - { kind: usage, text: "Совершенный вид — poruszyć." }
collocations:
  - { pl: "poruszać się", ru: "двигаться" }
  - { pl: "poruszać temat", ru: "затрагивать тему" }
etymology: "po- + ruszać «двигать», от ruch «движение»; ср. русское «двигать», «рушить»."
memory: "poruszać się — «двигаться», а без się poruszać temat — «затрагивать тему». Третий пласт даёт причастие poruszający «трогательный». Совершенный вид — poruszyć."
idioms:
  - { pl: "poruszać się", ru: "двигаться" }
  - { pl: "poruszać temat", ru: "затрагивать тему" }
