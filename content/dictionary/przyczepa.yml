notes:
  - { kind: false-friend, text: "PRZYCZEPA — «прицеп», а не «прищепка». Прищепка для белья — KLAMERKA или SPINACZ DO BIELIZNY. Жилой прицеп — PRZYCZEPA KEMPINGOWA." }
  - { kind: usage, text: "Девять живых форм, женский род. В местном падеже P перед IE смягчается: NA PRZYCZEPIE. Родительный множественного — PRZYCZEP. Звательный не даётся." }
  - { kind: government, text: "На прицепе — NA PRZYCZEPIE, местный. Машина с прицепом — SAMOCHÓD Z PRZYCZEPĄ, творительный. Прицеп с чем — Z, и творительный: PRZYCZEPA Z SIANEM." }
  - { kind: pronunciation, text: "Читается «пшыче́па», ударение на предпоследнем слоге. PRZY — «пшы», CZE — «че»." }
collocations:
  - { pl: "przyczepa kempingowa", ru: "дом на колёсах" }
  - { pl: "samochód z przyczepą", ru: "машина с прицепом" }
  - { pl: "przyczepa z sianem", ru: "прицеп с сеном" }
family:
  - { pl: "przyczepić", ru: "прицепить", relation: root }
  - { pl: "czepiać się", ru: "цепляться, придираться", relation: root }
  - { pl: "przyczepność", ru: "сцепление (с дорогой)", relation: derived }
etymology: "От PRZYCZEPIĆ «прицепить», от корня CZEP-, того же, что в русском «цеплять». Польское CZ на месте русского «ц»: CZEPIAĆ SIĘ — «цепляться»."
memory: "Przyczepa — прицеп, не «прищепка» (klamerka). Читается «пшыче́па». Przyczepa kempingowa — дом на колёсах."
idioms:
  - { pl: "czepiać się kogoś", ru: "придираться к кому-то" }
formExamplesSkip:
