# review
id: poludnie
format: 2
lemma: "południe"
rank: 1101
pos: noun
pron: { cyr: "поуу́дне" }
senses:
  - id: noon
    ru: "полдень"
    examples:
      - pl: "Jest południe."
        ru: "Сейчас полдень."
        source: { kind: translated, id: 10704046 }
      - pl: "Będę czekał do południa."
        ru: "Я буду ждать до полудня."
        source: { kind: translated, id: 13067577 }
      - pl: "Powinna tu być około południa."
        ru: "Она должна быть здесь около полудня."
        source: { kind: translated, id: 349001 }
  - id: afternoon
    ru: "po południu — после полудня, днём"
    note: "Самое частое употребление слова."
    examples:
      - pl: "Wyjdę dziś po południu."
        ru: "Я выйду сегодня после полудня."
        source: { kind: translated, id: 827808 }
      - pl: "Czy jesteś zajęty w niedzielę po południu?"
        ru: "Ты занят в воскресенье днём?"
        source: { kind: translated, id: 351435 }
      - pl: "Wychodzę po południu."
        ru: "Я выхожу после полудня."
        source: { kind: translated, id: 6030317 }
  - id: south
    ru: "юг"
    examples:
      - pl: "Na południe."
        ru: "На юг."
        source: { kind: translated, id: 10202790 }
      - pl: "Południe i północ."
        ru: "Юг и север."
        source: { kind: translated, id: 6443104 }
      - pl: "Ona musi być z południa."
        ru: "Она, должно быть, с юга."
        source: { kind: translated, id: 668992 }
notes:
  - { kind: usage, text: "Одно слово на два русских: «полдень» и «юг». Логика простая — в полдень солнце стоит на юге, отсюда и второе значение. Русское «полдень» и «юг» связи не сохранило." }
  - { kind: usage, text: "po południu — «днём, после полудня», предложный падеж. А przed południem — «до полудня, утром», творительный. Эти два оборота и есть основное употребление слова." }
  - { kind: usage, text: "Разбирается прозрачно: pół + dzień, буквально «полдня». Русское «полдень» собрано ровно так же." }
  - { kind: usage, text: "na południe «на юг» о направлении, na południu «на юге» о месте: Mieszka na południu Polski." }
collocations:
  - { pl: "po południu", ru: "днём, после обеда (во второй половине дня)" }
  - { pl: "przed południem", ru: "до полудня" }
  - { pl: "na południe", ru: "на юг" }
  - { pl: "około południa", ru: "около полудня" }
family:
  - { pl: "południowy", ru: "южный", relation: derived }
  - { pl: "północ", ru: "север, полночь", relation: antonym }
  - { pl: "dzień", ru: "день", relation: root }
etymology: "Прозрачно из pół + dzień «полдня» — ровно как русский «полдень». А «юг» отсюда потому, что в полдень солнце стоит на юге."
memory: "południe — и «полдень», и «юг»: в полдень солнце на юге, отсюда второе значение, которого у русского слова нет. Главные обороты — po południu «днём» и przed południem «до полудня»."
idioms:
  - { pl: "po południu", ru: "днём, после обеда (во второй половине дня)" }
  - { pl: "przed południem", ru: "до полудня" }
  - { pl: "na południe", ru: "на юг" }
