etymology: "Из английского LAPTOP, сложения LAP «колени сидящего» и TOP «верх»: компьютер, который кладут на колени. Слово пришло в польский в девяностые годы вместе с самой вещью и сразу получило польское склонение, вплоть до родительного на -A, как у всякого предмета, который берут в руки. Русский в это же время предпочёл другое английское слово, NOTEBOOK «записная книжка», и построил на нём «ноутбук». Так два языка, заимствуя у одного и того же источника в одно и то же десятилетие, выбрали разные слова для одной вещи — редкий и наглядный случай того, что заимствование есть выбор, а не механическая передача."
memory: "Оба языка взяли из английского, но разные слова: польский laptop, русский notebook, то есть «ноутбук». Поляк «ноутбука» не поймёт. Главное в склонении: родительный laptopa на -a, как у одушевлённых, и винительный ему равен — kupił laptopa. Так же smartfona, papierosa, banana: обиходные вещи, которые берут в руки, тянутся к этому окончанию. Планшет это tablet, не tabletka."
idioms:
  - { pl: "pracować na laptopie", ru: "работать на ноутбуке" }
