notes:
  - { kind: false-friend, text: "Любопытный случай: оба языка взяли слово из английского, но разные слова. Польский взял LAPTOP, русский — NOTEBOOK, и получилось «ноутбук», которого поляк не поймёт. Поэтому догадаться нельзя, хотя источник один язык. Польское слово NOTEBOOK тоже существует, но звучит как торговый термин и в разговоре почти не встречается; обиходное — LAPTOP, а в официальных текстах KOMPUTER PRZENOŚNY «переносной компьютер». Отдельно стоит запомнить, что планшет по-польски TABLET, а не TABLETKA: последнее, как мы видели, лекарство." }
  - { kind: usage, text: "Десять форм, мужской род. Главное в парадигме — родительный единственного LAPTOPA, с окончанием -A, а не -U, хотя предмет неодушевлённый. Так склоняется целый круг обиходных вещей, которые берут в руки: LAPTOPA, SMARTFONA, PAPIEROSA, BANANA, и винительный у них тоже равен родительному: KUPIŁ LAPTOPA. Явление это живое и расширяющееся, и для русскоязычного оно неожиданно, потому что в русском одушевлённость на технику не распространяется. Местный единственного — LAPTOPIE. Родительный множественного — LAPTOPÓW." }
  - { kind: pronunciation, text: "Читается «ла́птоп», два слога, ударение на первом. Польское L мягче русского твёрдого «л», но в транскрипции передаётся обычным «л». Обе гласные O чистые, без оканья. Конечное P глухое. В форме LAPTOPA слышно «лапто́па», с ударением на втором слоге. В форме LAPTOPIE сочетание PIE даёт мягкое «пе»: «лапто́пе». В форме LAPTOPÓW буква Ó читается как «у», а конечное W оглушается: «лапто́пуф»." }
  - { kind: register, text: "Слово нейтральное и ежедневное. Устойчивые сочетания: PRACOWAĆ NA LAPTOPIE, LAPTOP SŁUŻBOWY «служебный ноутбук», TORBA NA LAPTOPA «сумка для ноутбука». Уменьшительное LAPTOPIK звучит фамильярно и встречается в объявлениях о продаже. Прилагательного от слова нет, и признак выражают родительным: EKRAN LAPTOPA. В школьном и канцелярском языке попадается KOMPUTER PRZENOŚNY, но в живой речи его не услышишь." }
