etymology: "Сокращение от KINEMATOGRAF, как и русское «кино» от «кинематографа», и оба языка укоротили слово в одно и то же время, в начале двадцатого века. В основе греческое KINEMA «движение», от KINEIN «двигать», то есть буквально «движущееся изображение» — тот же корень в «кинетике» и в польском KINETYCZNY. Дальше пути разошлись в грамматике, а не в смысле: русский принял слово как несклоняемое, по образцу «пальто» и «метро», а польский встроил его в обычный средний род на -O, рядом с OKNO и MIASTO, и заставил склоняться. Это хороший пример того, что заимствование в польском почти всегда получает полную парадигму, тогда как русский охотно оставляет чужое слово неизменяемым."
memory: "Склоняется! Не как русское неизменяемое «кино»: do kina, w kinie, o kinie — и никогда do kino. Ударение на первом слоге, «ки́но», а не «кино́». Отдельный фильм — это film, а kino — здание или искусство. Сокращение от kinematograf, греческое kinema «движение»."
