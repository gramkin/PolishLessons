notes:
  - { kind: false-friend, text: "Ловушка не в значении, а в склонении, и она подводит каждого русскоязычного. Русское «кино» неизменяемое: «в кино», «из кино», «о кино» — слово стоит как вкопанное. Польское KINO склоняется полностью и правильно, как всякое существительное среднего рода на -O: KINO, KINA, KINU, KINEM, KINIE. Поэтому «идём в кино» будет IDZIEMY DO KINA, с родительным падежом, а не DO KINO, и «в кинотеатре» — W KINIE, а не W KINO. Сказать DO KINO — выдать себя первой же фразой." }
  - { kind: government, text: "Направление — предлог DO с родительным: DO KINA. Это общее польское правило для зданий и заведений: DO SZKOŁY, DO SKLEPU, DO KINA, и русское «в кино» с винительным здесь не работает. Местонахождение — W с местным: W KINIE. Цель посещения вводится предлогом NA с винительным: DO KINA NA NOWY FILM «в кино на новый фильм». Средний род означает, что именительный, винительный и звательный единственного числа совпадают в форме KINO, а родительный единственного и именительный множественного совпадают в форме KINA — отсюда девять форм в таблице, а не одиннадцать." }
  - { kind: pronunciation, text: "Читается «ки́но», ударение на первом слоге из двух — и здесь польский расходится с русским, где ударение падает на второй слог, «кино́». Ошибка в ударении слышна сразу, потому что польское правило безоговорочно: предпоследний слог. В местном падеже KINIE звучит «ки́не», где NI перед гласной даёт мягкое «не». Во множественном KINA читается «ки́на», и ударение остаётся на первом слоге." }
  - { kind: usage, text: "Слово значит прежде всего кинотеатр, то есть здание: KINO STUDYJNE «артхаусный кинотеатр», KINO LETNIE «летний кинотеатр». Во втором значении это кинематограф как искусство: KINO POLSKIE, KINO AUTORSKIE. А вот отдельный фильм — это FILM, никогда не KINO: «посмотрел хорошее кино» по-польски будет OBEJRZAŁEM DOBRY FILM. Домашний просмотр — KINO DOMOWE, то есть система для домашнего кинотеатра, ровно как в русском." }
collocations:
  - { pl: "iść do kina", ru: "идти в кино" }
