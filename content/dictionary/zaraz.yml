# review
id: zaraz
format: 2
lemma: "zaraz"
rank: 285
pos: part
pron: { cyr: "за́рас" }
senses:
  - id: right-now
    ru: "сейчас, сразу, сию минуту"
    examples:
      - pl: "Zaraz zakrzyczę!"
        ru: "Сейчас я закричу!"
        source: { kind: tatoeba, id: 3460179 }
      - pl: "Zaraz wrócę z państwa napojami."
        ru: "Сейчас вернусь с вашими напитками."
        source: { kind: tatoeba, id: 3038435 }
      - pl: "Zaraz znajdziemy panu miejsce."
        ru: "Мы скоро найдём, где Вам сесть."
        source: { kind: tatoeba, id: 460945 }
  - id: soon
    ru: "скоро, вот-вот"
    examples:
      - pl: "Mokra koszula zaraz wyschnie."
        ru: "Мокрая рубашка скоро высохнет."
        source: { kind: tatoeba, id: 352217 }
      - pl: "Stół stoi krzywo i pewnie zaraz się przewróci."
        ru: "Стол стоит криво и, вероятно, скоро перевернётся."
        source: { kind: tatoeba, id: 827792 }
      - pl: "Zaraz wracam."
        ru: "Сейчас вернусь."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Zaraz wracam — «Сейчас вернусь», одна из самых частых бытовых фраз." }
  - { kind: usage, text: "zaraz po czymś значит «сразу после чего-то»: zaraz po pracy «сразу после работы»." }
  - { kind: usage, text: "Отдельное Zaraz, zaraz! в разговоре значит «Погоди-погоди!», когда что-то не сходится." }
collocations:
  - { pl: "zaraz wracam", ru: "сейчас вернусь" }
  - { pl: "zaraz po", ru: "сразу после" }
  - { pl: "zaraz potem", ru: "сразу потом" }
  - { pl: "zaraz, zaraz", ru: "погоди-погоди" }
etymology: "Из za + raz — буквально «за один раз», то есть в один приём, немедленно."
memory: "zaraz — «сейчас, сразу»: Zaraz wrócę «Сейчас вернусь». Внутри спрятано «за раз», то есть в один приём."
idioms:
