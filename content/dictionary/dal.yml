etymology: "Из праславянского *dalь, отвлечённого существительного от корня *dal- «далёкий». Русская «даль» есть то же самое слово, и совпадение здесь полное: один корень, один тип образования, один род. Такие существительные на мягкую согласную праславянский образовывал от прилагательных целыми рядами, и в обоих языках они сохранились похожими парами: DAL и «даль», GŁĘBIA и «глубь». Надёжнее держать рядом DAL и DALEKI, как «даль» и «далёкий»: существительное называет свойство, прилагательное его приписывает. Дальнейшее родство корня ведёт к литовскому TOLI «далеко», и общего индоевропейского предка у него, по-видимому, нет."
memory: "Полное совпадение с русской «далью», включая женский род. Семь форм, потому что родительный, дательный и местный дают одну форму dali: w dali «вдали», но w dal «вдаль», с винительным. Расходится только спорт: skok w dal — это прыжок в длину. И не путать dal «даль» с dał «дау», прошедшим от dać."
idioms:
  - { pl: "skok w dal", ru: "прыжок в длину" }
  - { pl: "patrzeć w dal", ru: "смотреть в даль" }
