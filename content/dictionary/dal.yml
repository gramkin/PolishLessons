notes:
  - { kind: false-friend, text: "Редкий случай полного совпадения: польская DAL и русская «даль» значат одно и то же и даже совпадают в роде — обе женского. Расходятся они только в одном месте, зато неожиданно: спортивный термин. SKOK W DAL по-польски есть прыжок в длину, а русский в этом термине меряет длину, а не даль: «прыжок в длину». Поэтому дословный перевод «скачок в даль» будет ошибкой, а польское SKOK W DŁUGOŚĆ не существует. Запоминать стоит сразу целиком, как название дисциплины: SKOK W DAL, SKOK WZWYŻ «прыжок в высоту»." }
  - { kind: government, text: "Женский род, но склонение особое: это существительное на мягкую согласную, так называемый женский тип на -I, и у него родительный, дательный и местный падеж единственного числа совпадают в одной форме DALI. W DALI «в дали», Z DALI «из дали», DALI в дательном — всё одна форма. Поэтому в таблице всего семь форм. Винительный равен именительному: PATRZYŁ W DAL, и предлог W здесь с винительным, потому что отвечает на вопрос «куда». А W DALI, с местным, отвечает на вопрос «где», и разница та же, что в русском «вдаль» и «вдали»." }
  - { kind: pronunciation, text: "Читается «даль», одним слогом. Польская L всегда мягкая, поэтому конечное L звучит точно как русское «ль» — слово произносится в точности как русская «даль», и переучивать нечего. Это та же буква, что в PULS «пульс», и стоит ещё раз отделить её от Ł, которая даёт «у»: DAL «даль», но DAŁ «дау» — форма прошедшего времени от DAĆ «дать». Два слова различаются одной чёрточкой и одним звуком, а значат совершенно разное." }
  - { kind: usage, text: "В единственном числе слово книжное и слегка поэтическое, как и русское «даль»: PATRZYĆ W DAL, GINĄĆ W DALI. В обиходной речи вместо него скажут DALEKO или ODLEGŁOŚĆ «расстояние». Множественное число DALE встречается почти только в поэзии и в описаниях пейзажа: SINE DALE «синие дали». Зато термин SKOK W DAL совершенно нейтрален и частотен, и именно в нём слово чаще всего и попадается на глаза. Прилагательное — DALEKI «далёкий», наречие DALEKO, сравнительная степень DALEJ «дальше»." }
