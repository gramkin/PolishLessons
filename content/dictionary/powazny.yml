notes:
  - { kind: false-friend, text: "Ложный друг наполовину: poważny — «серьёзный», но не «важный». «Важный» — это ważny. Оба слова от waga «вес», и различать их надо твёрдо: sprawa poważna «серьёзное дело», sprawa ważna «важное дело»." }
  - { kind: usage, text: "muzyka poważna — это «классическая музыка», буквально «серьёзная». Запоминать лучше целиком." }
  - { kind: usage, text: "nic poważnego «ничего серьёзного» — стандартный ответ о болезни или происшествии." }
  - { kind: usage, text: "Степени правильные: poważny — poważniejszy — najpoważniejszy. mieć poważne zamiary «иметь серьёзные намерения» говорят о сватовстве." }
collocations:
  - { pl: "poważny problem", ru: "серьёзная проблема" }
  - { pl: "nic poważnego", ru: "ничего серьёзного" }
  - { pl: "muzyka poważna", ru: "классическая музыка" }
  - { pl: "poważne zamiary", ru: "серьёзные намерения" }
family:
  - { pl: "waga", ru: "вес", relation: root }
  - { pl: "ważny", ru: "важный", relation: root }
  - { pl: "poważnie", ru: "серьёзно", relation: derived }
  - { pl: "powaga", ru: "серьёзность", relation: derived }
etymology: "От waga «вес» с приставкой po- — буквально «весомый». Русское «важный» восходит к тому же корню, поэтому польское ważny значит «важный», а poważny — «серьёзный»."
memory: "poważny — «серьёзный», и рядом живёт ważny — «важный». Оба от waga «вес», но путать их нельзя: sprawa poważna «серьёзное дело», sprawa ważna «важное дело». Два оборота стоит взять целиком: nic poważnego «ничего серьёзного» и muzyka poważna — это «классическая музыка», буквально «серьёзная»."
idioms:
  - { pl: "nic poważnego", ru: "ничего серьёзного" }
  - { pl: "mieć poważne zamiary", ru: "иметь серьёзные намерения" }
  - { pl: "muzyka poważna", ru: "классическая музыка" }
