# review
id: poderznac
format: 2
lemma: "poderżnąć"
rank: 2098
pos: verb
aspect: perf
pron: { cyr: "подэ́жнонць" }
senses:
  - id: slit
    ru: "перерезать (горло)"
    examples:
      - pl: "Tom poderżnął Mary gardło."
        ru: "Том перерезал Мэри горло."
        source: { kind: translated, id: 1549701 }
      - pl: "Jeśli mi to zrobisz, poderżnę ci gardło."
        ru: "Если ты это со мной сделаешь, я перережу тебе горло."
        source: { kind: translated, id: 4328660 }
      - pl: "Grozili, że poderżną mu gardło."
        ru: "Они грозили перерезать ему горло."
        source: { kind: authored }
  - id: cut-under
    ru: "подрезать снизу"
    examples:
      - pl: "Może nie będę szczęśliwy, ale żył sobie nie poderżnę."
        ru: "Может, я и не буду счастлив, но жизнь себе не перережу."
        source: { kind: translated, id: 5518103 }
      - pl: "Poderżnął łodygę u nasady."
        ru: "Он подрезал стебель у основания."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Слово живёт почти исключительно в обороте poderżnąć gardło «перерезать горло»; вне его встречается редко." }
  - { kind: government, text: "Кому перерезали — дательный падеж: poderżnąć komuś gardło, как в русском «перерезать кому-то горло»." }
  - { kind: false-friend, text: "Корень rżnąć «резать» — ср. русское «резать». Приставка pod- значит «снизу», отсюда буквальное «подрезать»." }
  - { kind: usage, text: "Несовершенный вид — poderzynać. Слово резкое и в обычной речи не встречается вне угроз и криминальной хроники." }
  - { kind: government, text: "Страдательное причастие описывает то, что перерезали: poderżnięte gardło, poderżnięta lina. Мужско-личной формы poderżnięci нет — человек в этом обороте стоит в дательном падеже." }
collocations:
  - { pl: "poderżnąć gardło", ru: "перерезать горло" }
etymology: "pod- + rżnąć «резать», праславянское *rězati; ср. русское «резать», «подрезать»."
memory: "poderżnąć живёт в одном обороте: poderżnąć komuś gardło «перерезать кому-л. горло», с дательным падежом. Корень rżnąć = русское «резать»."
idioms:
  - { pl: "poderżnąć gardło", ru: "перерезать горло" }
