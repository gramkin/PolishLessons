# review
id: przynajmniej
format: 2
lemma: "przynajmniej"
rank: 474
pos: part
pron: { cyr: "пшына́ймней" }
senses:
  - id: at-least
    ru: "по крайней мере, хотя бы"
    examples:
      - pl: "Mógłby przynajmniej powiedzieć dziękuję."
        ru: "Мог бы хоть спасибо сказать!"
        source: { kind: tatoeba, id: 6016816 }
      - pl: "Przynajmniej jeszcze żyję."
        ru: "По крайней мере, я ещё жив."
        source: { kind: translated, id: 6070078 }
      - pl: "Przynajmniej spróbuj."
        ru: "Хотя бы попробуй."
        source: { kind: authored }
  - id: no-less-than
    ru: "по меньшей мере (о количестве)"
    examples:
      - pl: "Ma przynajmniej pięcioro dzieci."
        ru: "У него по меньшей мере пятеро детей."
        source: { kind: authored }
      - pl: "Trwało to przynajmniej godzinę."
        ru: "Это длилось по меньшей мере час."
        source: { kind: authored }
      - pl: "Przynajmniej połowa się zgadza."
        ru: "По меньшей мере половина согласна."
        source: { kind: authored }
notes:
  - { kind: usage, text: "przynajmniej — «по крайней мере, хотя бы»: Mógłby przynajmniej powiedzieć dziękuję «Мог бы хоть спасибо сказать»." }
  - { kind: usage, text: "О количестве значит «не меньше чем»: przynajmniej godzinę «по меньшей мере час»." }
  - { kind: usage, text: "Слово разбирается прозрачно: przy + najmniej «наименьше», то есть «при наименьшем»." }
  - { kind: usage, text: "Близкий синоним — co najmniej; он чаще употребляется с числами." }
collocations:
  - { pl: "przynajmniej tyle", ru: "хотя бы столько" }
  - { pl: "przynajmniej spróbuj", ru: "хотя бы попробуй" }
  - { pl: "co najmniej", ru: "по меньшей мере" }
etymology: "Из przy + najmniej, превосходной степени от mało «мало». Буквально «при наименьшем»."
memory: "przynajmniej — «по крайней мере, хотя бы», и разбирается прозрачно: przy + najmniej «наименьше». С числами то же самое значит co najmniej."
