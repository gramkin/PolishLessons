senses:
  - id: lead
    ru: "powieść kogoś — повести, отвести, привести (книжн.)"
    note: "Книжное слово; в разговоре чаще zaprowadzić или poprowadzić. Powieść do zwycięstwa — «привести к победе»."
    examples:
      - pl: "Przewodnik powiódł nas wąską ścieżką na szczyt."
        ru: "Проводник повёл нас узкой тропой на вершину."
        source: { kind: authored }
      - pl: "Matka powiodła dzieci do lasu na grzyby."
        ru: "Мать повела детей в лес за грибами."
        source: { kind: authored }
      - pl: "Trener powiódł drużynę do zwycięstwa."
        ru: "Тренер привёл команду к победе."
        source: { kind: authored }
      - pl: "Dokąd nas powiedziesz?"
        ru: "Куда ты нас поведёшь?"
        source: { kind: authored }
  - id: succeed
    ru: "powieść się (komuś) — удаться, получиться; преуспеть"
    note: "Подлежащее — дело, а человек стоит в дательном: Plan się powiódł «План удался», Powiodło mu się «Ему удалось, он преуспел»."
    examples:
      - pl: "Eksperyment się powiódł."
        ru: "Эксперимент удался."
        source: { kind: translated, id: 3937088 }
      - pl: "Plan się nie powiódł."
        ru: "План не удался."
        source: { kind: translated, id: 6406161 }
      - pl: "Czemu jej się nie powiodło?"
        ru: "Почему у неё не получилось?"
        source: { kind: translated, id: 2829985 }
      - pl: "Nasza misja się powiodła."
        ru: "Наша миссия удалась."
        source: { kind: translated, id: 12470103 }
  - id: pass-over
    ru: "powieść wzrokiem / ręką po czymś — обвести взглядом, провести рукой"
    note: "Чем — творительный (wzrokiem, palcem, dłonią), по чему — po с предложным."
    examples:
      - pl: "Powiódł wzrokiem po sali."
        ru: "Он обвёл взглядом зал."
        source: { kind: authored }
      - pl: "Powiodła palcem po mapie."
        ru: "Она провела пальцем по карте."
        source: { kind: authored }
      - pl: "Nauczyciel powiódł wzrokiem po klasie i westchnął."
        ru: "Учитель обвёл взглядом класс и вздохнул."
        source: { kind: authored }
      - pl: "Ostrożnie powiodłem dłonią po chłodnym kamieniu."
        ru: "Я осторожно провёл ладонью по холодному камню."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ГЛАВНАЯ ловушка — сходство с powiedzieć «сказать». Plan się powiedzie значит «План удастся», а не «скажет»: «скажет» — powie. Повелительное powiedź (с ź) — «поведи», а powiedz (с z) — «скажи»; так же powiedźmy «поведём» и powiedzmy «скажем». Отглагольное powiedzenie почти всегда принадлежит powiedzieć — «поговорка» или «сказать» (nie mam nic do powiedzenia), поэтому эти четыре формы в таблице пропущены; существительное к powieść się — powodzenie «успех», niepowodzenie «неудача»." }
  - { kind: government, text: "Powieść się устроено иначе, чем русское «удаться» с инфинитивом: подлежащее — само дело, а человек в дательном. Egzamin mi się powiódł «Экзамен мне удался», Powiodło mu się w życiu «Он преуспел в жизни». С инфинитивом говорят udać się: Udało mi się zdać egzamin. Значение «повести»: кого — винительный, куда — do с родительным или na с винительным, к чему — do: powieść drużynę do zwycięstwa." }
  - { kind: pronunciation, text: "Два чередования, как в русском «вести — веду — вёл». E/o: powiodę, powiodą, powiodła перед твёрдым согласным, но powiedziesz, powiedzie, powiedli перед мягким. Ó/o: в закрытом слоге мужского рода пишется ó — powiódł, powiódłszy, и в условном powiódłby, powiódłbym, powiódłbyś, потому что by начинается с согласного. Формы powiodłby, powiodłbym, powiodłbyś в таблице — артефакт генератора, а основа powiodł сама по себе не употребляется; все четыре пропущены. Перед гласным o законно: powiodłem, powiodła, powiodłaby." }
  - { kind: usage, text: "Вид совершенный. Несовершенная пара — wieść «вести», а в значении «удаваться» — wieść się: Jak ci się wiedzie? «Как поживаешь?». Значение «повести» книжное: в разговоре скажут zaprowadzić dzieci do szkoły, poprowadzić drużynę. Причастие powiedziony тоже книжное и редкое; в обороте «движимый чем-то» чаще звучит несовершенное wiedziony: wiedziony ciekawością." }
  - { kind: usage, text: "Омоним — существительное powieść «роман» (карточка powiesc-noun): ta powieść, czytać powieści. Глагол узнаётся по формам: powiódł, powiodło się, powiedzie." }
