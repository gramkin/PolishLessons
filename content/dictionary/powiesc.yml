synonyms: ["udać się", "zaprowadzić"]
etymology: "Приставка po- плюс wieść «вести», из праславянского *vesti (*vedti) — то же слово, что русское «повести». Чередование e/o (wiodę — wiedziesz) — польская перегласовка перед твёрдыми зубными, как в niosę — niesiesz. Значение «удаться» развилось из «повести дело»; к нему же powodzenie «успех» и wodzić «водить»."
memory: "powieść — «повести», а powieść się — «удаться»: Plan się powiódł «План удался», Powiodło mu się «Ему повезло, он преуспел». Не путайте с powiedzieć: powiedzie «удастся», а powie «скажет»; powiedź «поведи», а powiedz «скажи». Чередования как в русском «веду — вёл»: powiodę, но powiedziesz; powiódł, но powiodła. Существительное powieść — «роман», отдельная карточка."
idioms:
