notes:
  - { kind: false-friend, text: "Главное значение польского BLOK русскому не передаётся одним словом, и это основная трудность. BLOK — это жилой многоэтажный дом, обычно панельный: MIESZKAM W BLOKU значит «живу в многоэтажке», и так говорит пол Польши. Русский «блок» жилым домом не бывает: по-русски это «панельный дом», «многоэтажка», «хрущёвка» по эпохе. Зато прочие значения совпадают: BLOK RYSUNKOWY «блок для рисования», BLOK WYBORCZY «предвыборный блок», BLOK SILNIKA «блок двигателя». Поэтому при переводе надо каждый раз решать, о доме речь или о чём-то другом." }
  - { kind: government, text: "Мужской род, неодушевлённое, и парадигма у него экономная: родительный и местный падеж единственного числа совпадают в форме BLOKU. Поэтому BEZ BLOKU «без блока» и W BLOKU «в доме» выглядят одинаково, а в таблице девять форм, а не десять. Это четвёртый такой случай в словаре, после WYSIŁEK, POŚPIECH и DYSK, и к четвёртому разу совпадение стоит считать типичным для неодушевлённых на согласную. Жить в доме — W BLOKU с местным; за домом — ZA BLOKIEM с творительным." }
  - { kind: usage, text: "Городской словарь вокруг слова стоит выучить блоком, потому что он частотен в быту: BLOK MIESZKALNY «жилой дом», BLOKOWISKO «панельный район, спальный район», OSIEDLE «жилой массив», KLATKA SCHODOWA «подъезд». Слово BLOKOWISKO с оттенком пренебрежения, но вполне обиходное. В других значениях: для записей говорят NOTATNIK или BLOK BIUROWY, а BLOK RYSUNKOWY есть альбом для рисования, который всякий польский школьник покупает в сентябре." }
  - { kind: pronunciation, text: "Читается «блок», одним слогом, и совпадает с русским полностью. Конечное K глухое в обоих языках. В местном падеже BLOKU ударение остаётся на том же слоге: «бло́ку». Во множественном BLOKI сочетание KI смягчается: «бло́ки», и буква I здесь знак мягкости, а не отдельная гласная. В родительном множественного BLOKÓW гласная Ó даёт «у»: «блу́коф», с оглушением конечного W в «ф»." }
