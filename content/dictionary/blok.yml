etymology: "Из немецкого BLOCK, а то из средневекового германского корня со значением «колода, обрубок бревна»; через французское BLOC слово разошлось по Европе в значении «цельный кусок». Русский «блок» пришёл той же дорогой, и в технических значениях языки совпадают полностью. Разошлись они на жилье: когда в середине двадцатого века в Польше начали ставить дома из крупных панелей, их назвали BLOKI, по цельным блокам, из которых они собраны, и слово закрепилось как обиходное название самого дома. Русский в этом месте назвал дома по материалу и способу — «панельные», «блочные», — а существительным «блок» дом называть не стал. Отсюда и расхождение, целиком бытовое, а не языковое."
memory: "Польский blok — это жилой многоэтажный дом: mieszkam w bloku «живу в многоэтажке». Русский «блок» так не употребляется. Прочие значения совпадают: blok rysunkowy, blok wyborczy, blok silnika. Родительный и местный совпадают: bez bloku и w bloku — девять форм, как у wysiłek, pośpiech и dysk. Район таких домов — blokowisko."
