notes:
  - { kind: usage, text: "Та же двойня, что у UPAŚĆ: один инфинитив, два глагола. Основа WYPADN-/WYPAD- даёт значения падения и результата: WYPADNĘ, WYPADŁ, WYPADNIJ. Основа WYPAS-/WYPASI- даёт значение выпаса скота: WYPASĘ, WYPASŁ, WYPAŚ, WYPASIONY. Но у первого глагола значений внутри себя сразу три, и второе из них русскому неочевидно: WYPAŚĆ значит не только «выпасть», но и «получиться, выйти» о результате. EGZAMIN WYPADŁ DOBRZE — «экзамен прошёл хорошо», и подлежащее здесь экзамен, а не человек." }
  - { kind: pronunciation, text: "Читается «вы́пасьць», ударение на предпоследнем слоге, то есть на приставке WY-. Это общее правило для таких двусложных приставочных глаголов: UPAŚĆ — «у́пасьць», WYPAŚĆ — «вы́пасьць», NAPAŚĆ — «на́пасьць». Русское ударение падает иначе, на корень, и это один из самых частых источников акцента: не «выпа́сьць», а «вы́пасьць». Повелительное наклонение различает два глагола на слух: WYPADNIJ против WYPAŚ." }
  - { kind: government, text: "В значении падения глагол непереходный, откуда выпало — предлог Z с родительным: WYPAŚĆ Z KIESZENI, WYPAŚĆ Z OKNA, WYPAŚĆ Z GRY. В значении результата подлежащим становится само событие, а оценка выражается наречием: EGZAMIN WYPADŁ DOBRZE, ZDJĘCIE WYPADŁO CIEMNO — буквально «экзамен выпал хорошо». Глагол выпаса, наоборот, переходный и требует винительного: WYPAŚĆ KROWY. Наличие прямого дополнения снова служит различителем." }
  - { kind: false-friend, text: "Ловушка в несовершенном виде, а не в этом слове. Польское WYPADAĆ значит ещё и «подобать, быть приличным»: NIE WYPADA TAK MÓWIĆ — «так говорить не принято», и подлежащего у этого оборота нет вовсе. Русское «выпадать» такого смысла не имеет, и перевести NIE WYPADA словом «не выпадает» нельзя. Второе место: WYPADEK — это «случай» и «авария, несчастный случай», а не «выпадение»; W TYM WYPADKU значит «в этом случае»." }
