etymology: "Та же пара праславянских корней, что и в UPAŚĆ: *pad-ti «падать» и *pas-ti «пасти», которые по польским звуковым законам дали одно и то же -ŚĆ и потому слились в общий инфинитив. Приставка WY- отвечает русскому «вы-» и значит движение изнутри наружу, отсюда прямое «выпасть» и, для второго глагола, «выгнать скот на пастбище». Значение «получиться, выйти» развилось из той же идеи: нечто выпало так или иначе, как кости из руки, — и русское «вышло хорошо» построено на том же образе выхода наружу. Так что третье значение не произвол, а метафора, которую русский проделал другим глаголом."
memory: "Приставка под ударением: «вы́пасьць», не «выпа́сьць». Три значения у глагола падения: выпасть, выбыть и — неожиданно — «получиться»: egzamin wypadł dobrze. Основа wypas- это уже другой глагол, «выпасти». И nie wypada значит «не принято»."
idioms:
