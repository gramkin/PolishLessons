# review
id: liczba
format: 2
lemma: "liczba"
rank: 1427
pos: noun
pron: { cyr: "ли́чба" }
senses:
  - id: number
    ru: "число (математическое)"
    examples:
      - pl: "25 jest liczbą naturalną."
        ru: "25 — натуральное число."
        source: { kind: translated, id: 4308387 }
      - pl: "Piętnaście nie jest liczbą pierwszą."
        ru: "Пятнадцать — не простое число."
        source: { kind: translated, id: 3604794 }
      - pl: "Dwa i cztery to liczby parzyste."
        ru: "Два и четыре — чётные числа."
        source: { kind: translated, id: 12721124 }
  - id: quantity
    ru: "количество, численность"
    examples:
      - pl: "Liczba studentów obcokrajowców rośnie."
        ru: "Число иностранных студентов растёт."
        source: { kind: tatoeba, id: 13781658 }
      - pl: "Liczba ludności rośnie."
        ru: "Численность населения растёт."
        source: { kind: translated, id: 766560 }
      - pl: "Liczba uczniów spada."
        ru: "Число учеников падает."
        source: { kind: translated, id: 2138918 }
  - id: grammar
    ru: "число (грамматическая категория)"
    examples:
      - pl: "Rzeczownik ma dwie liczby: pojedynczą i mnogą."
        ru: "У существительного два числа: единственное и множественное."
        source: { kind: authored }
      - pl: "Ten czasownik stoi w liczbie mnogiej."
        ru: "Этот глагол стоит во множественном числе."
        source: { kind: authored }
notes:
  - { kind: usage, text: "liczba значит и «число», и «количество»: liczba ludności «численность населения», duża liczba ofiar «большое количество жертв». Русское «количество» — ilość, но для исчисляемого предпочитают liczba." }
  - { kind: false-friend, text: "Не путайте liczba «число» с numer «номер»: numer telefonu «номер телефона», но liczba parzysta «чётное число»." }
  - { kind: usage, text: "Грамматический термин: liczba pojedyncza «единственное число», liczba mnoga «множественное число»." }
  - { kind: usage, text: "Звательная форма liczbo в корпусе не встречается — у неодушевлённых существительных она почти не употребляется." }
collocations:
  - { pl: "liczba mnoga", ru: "множественное число" }
  - { pl: "liczba ludności", ru: "численность населения" }
  - { pl: "duża liczba", ru: "большое количество" }
  - { pl: "liczba parzysta", ru: "чётное число" }
etymology: "От liczyć «считать» (праславянское *lic-). Русское «число» восходит к другому корню — к «читать, честь», — но идея та же: счёт. Ближайший русский родственник польского слова — «личить, обличье» по корню, а по смыслу — «счёт»."
memory: "liczba — это и «число», и «количество»: liczba parzysta «чётное число», liczba ludności «численность населения». Не путайте с numer «номер телефона». В грамматике — liczba pojedyncza и liczba mnoga."
idioms:
  - { pl: "liczba mnoga", ru: "множественное число" }
  - { pl: "liczba pojedyncza", ru: "единственное число" }
  - { pl: "w liczbie", ru: "в количестве" }
formExamplesSkip:
  - { form: "liczbo", reason: "звательный падеж у неодушевлённых существительных в современном языке остался только в поэтическом обращении: в обычной речи вместо liczbo говорят liczba" }
