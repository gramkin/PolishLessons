# review
id: zmartwienie
format: 2
lemma: "zmartwienie"
rank: 4775
pos: noun
pron: { cyr: "змартфе́не" }
senses:
  - id: worry
    ru: "забота, тревога, огорчение"
    examples:
      - pl: "Twoje zdrowie to moje największe zmartwienie."
        ru: "Твоё здоровье — моя главная забота."
        source: { kind: authored }
      - pl: "Ze zmartwienia nie mogła spać."
        ru: "От тревоги она не могла спать."
        source: { kind: authored }
      - pl: "Ma teraz poważne zmartwienia."
        ru: "У него сейчас серьёзные заботы."
        source: { kind: authored }
  - id: cause-of-worry
    ru: "повод для беспокойства, головная боль"
    examples:
      - pl: "Syn był zmartwieniem całej rodziny."
        ru: "Сын был головной болью всей семьи."
        source: { kind: authored }
      - pl: "To nie moje zmartwienie."
        ru: "Это не моя забота."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ZMARTWIENIE — «забота, тревога, огорчение», от MARTWIĆ SIĘ «беспокоиться». Корень неожиданный: MARTWY — «мёртвый», и «огорчать» значило когда-то «мертвить» душу. NIE MARTW SIĘ! — «не волнуйся!». А TO NIE MOJE ZMARTWIENIE — «это не моя забота, не моя проблема»." }
  - { kind: usage, text: "Восемь форм, средний род. Родительный множественного — ZMARTWIEŃ, с мягким N на конце. Во множественном ZMARTWIENIA — «заботы, хлопоты»: CODZIENNE ZMARTWIENIA." }
  - { kind: government, text: "От огорчения — ZE ZMARTWIENIA, родительный; перед ZM предлог Z получает E. Быть головной болью для кого-то — BYĆ CZYIMŚ ZMARTWIENIEM, творительный. К чьему-то огорчению — KU CZYJEMUŚ ZMARTWIENIU, дательный." }
  - { kind: pronunciation, text: "Читается «змартфе́не», четыре слога, ударение на третьем. W после глухого T оглушается в «ф», как в MARTWIĆ «ма́ртфиць». В форме ZMARTWIEŃ: «зма́ртфень»." }
collocations:
  - { pl: "wielkie zmartwienie", ru: "большое горе" }
  - { pl: "codzienne zmartwienia", ru: "повседневные заботы" }
  - { pl: "ze zmartwienia", ru: "от огорчения" }
family:
  - { pl: "martwić", ru: "огорчать; беспокоиться (martwić się)", relation: root, id: martwic }
  - { pl: "zmartwiony", ru: "огорчённый, встревоженный", relation: derived }
  - { pl: "martwy", ru: "мёртвый", relation: root, id: martwy }
etymology: "От MARTWIĆ «огорчать», а тот от MARTWY «мёртвый», праславянского слова, общего с русским «мёртвый». Огорчение — это когда что-то в душе будто «умирает»."
memory: "Zmartwienie — забота, огорчение. Читается «змартфе́не». Nie martw się! — не волнуйся! To nie moje zmartwienie — это не моя забота. Корень тот же, что в martwy — мёртвый."
idioms:
  - { pl: "to nie moje zmartwienie", ru: "это не моя забота" }
  - { pl: "ku czyjemuś zmartwieniu", ru: "к чьему-то огорчению" }
formExamplesSkip:
