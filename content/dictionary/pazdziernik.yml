etymology: "От PAŹDZIERZE «костра», то есть одревесневшие части стебля, которые отбивают от льна и конопли при обработке. Работу эту делали осенью, в октябре, и месяц получил имя по ней. Русский знает слово «кострика» и «костра» в том же значении, но названия месяца из него не вывел и взял латинское OCTOBER, «восьмой» по счёту римского года. Из того же польского корня идёт PŁYTA PAŹDZIERZOWA, древесно-стружечная плита."
memory: "Название от paździerze «костра», отходов, которые остаются при обработке льна: мяли лён в октябре, отсюда и месяц. Корень жив в płyta paździerzowa, это наша ДСП. Русский взял латинское «октябрь», а украинский назвал месяц «жовтнем», по жёлтому. Беглого e здесь нет, основа целая во всех падежах. Читается «паздзе́рник», и начало сплошь мягкое: ź даёт «зь», dzi даёт «дзь»."
idioms:
  - { pl: "Polski Październik", ru: "Польский октябрь, оттепель 1956 года" }
