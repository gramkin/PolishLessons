notes:
  - { kind: false-friend, text: "Название идёт от PAŹDZIERZE — это костра, деревянистые отходы, которые остаются, когда мнут лён и коноплю. Делали это в октябре, и месяц назвали по работе. Корень жив до сих пор: PŁYTA PAŹDZIERZOWA это древесно-стружечная плита, которую у нас зовут ДСП. Русский взял для месяца латинское OCTOBER, «восьмой». Украинский на этот раз пошёл своим путём и назвал октябрь «жовтнем», по жёлтому цвету." }
  - { kind: usage, text: "Десять форм, мужской род. Беглого E здесь нет, основа PAŹDZIERNIK- держится целиком во всех падежах, как и у LISTOPAD. Это самое длинное название месяца в польском, четыре слога, и именно оно обычно пугает начинающих. Разбор на части снимает страх: PAŹDZIERZE плюс суффикс, и получается «месяц костры». Множественное число обычное: PAŹDZIERNIKI, о разных октябрях разных лет." }
  - { kind: government, text: "В каком месяце — предлог W с местным падежом: W PAŹDZIERNIKU «в октябре». До и от — DO и OD с родительным: DO PAŹDZIERNIKA, OD PAŹDZIERNIKA. Дата идёт родительным без предлога: PIERWSZEGO PAŹDZIERNIKA «первого октября», день начала учебного года в польских вузах. В конце октября — POD KONIEC PAŹDZIERNIKA, предлог POD с родительным." }
  - { kind: pronunciation, text: "Читается «паздзе́рник», три слога, ударение на втором. Буква Ź даёт мягкое «зь», а следующее DZI даёт слитное мягкое «дзь», так что начало слова это сплошная мягкость, «паздзе». Для русского уха это самое трудное место, и проще всего произносить его как одно слитное «пажьдже», постепенно разделяя. Конечное K звучит твёрдо. В родительном PAŹDZIERNIKA ударение смещается на «ни»." }
  - { kind: register, text: "Слово нейтральное и ежедневное: W PAŹDZIERNIKU, POCZĄTEK PAŹDZIERNIKA, PAŹDZIERNIKOWY WIECZÓR. Первого октября в Польше начинается учебный год в университетах, так что для студента это слово значит ровно то же, что сентябрь для школьника. Из истории сюда относится POLSKI PAŹDZIERNIK тысяча девятьсот пятьдесят шестого года, короткая оттепель после смерти Сталина." }
