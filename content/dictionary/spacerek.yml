# review
id: spacerek
format: 2
lemma: "spacerek"
rank: 5797
pos: noun
pron: { cyr: "спацэ́рэк" }
senses:
  - id: stroll
    ru: "прогулочка, небольшая прогулка"
    examples:
      - pl: "Chodźmy na krótki spacerek po obiedzie."
        ru: "Пойдём на короткую прогулочку после обеда."
        source: { kind: authored }
      - pl: "Po powrocie ze spacerku trzeba umyć ręce."
        ru: "После прогулки нужно вымыть руки."
        source: { kind: authored }
      - pl: "To był miły spacerek nad rzeką."
        ru: "Это была приятная прогулочка у реки."
        source: { kind: authored }
  - id: leisurely
    ru: "spacerkiem — пешочком, прогулочным шагом"
    examples:
      - pl: "Do szkoły idziemy spacerkiem."
        ru: "В школу мы идём пешочком."
        source: { kind: authored }
      - pl: "Szli spacerkiem, nigdzie się nie spiesząc."
        ru: "Они шли прогулочным шагом, никуда не спеша."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Уменьшительное к SPACER с беглым E: SPACEREK — SPACERKU, SPACERKI. Мужской род, неодушевлённое. В отличие от SPACER (NA SPACERZE) здесь R не меняется: NA SPACERKU." }
  - { kind: register, text: "Ласковое и разговорное: так говорят с детьми и о приятной неспешной прогулке. С иронией TO NIE SPACEREK — «это вам не прогулка», о трудном деле." }
  - { kind: pronunciation, text: "Читается «спацэ́рэк», ударение на предпоследнем слоге: SPACERKU — «спацэ́рку». C — «ц», конечное K глухое." }
collocations:
  - { pl: "krótki spacerek", ru: "короткая прогулочка" }
  - { pl: "iść na spacerek", ru: "пойти прогуляться" }
  - { pl: "wrócić spacerkiem", ru: "вернуться пешочком" }
family:
  - { pl: "spacer", ru: "прогулка", relation: root, id: spacer }
  - { pl: "spacerować", ru: "гулять, прогуливаться", relation: derived }
  - { pl: "spacerowicz", ru: "гуляющий, прохожий", relation: derived }
etymology: "Уменьшительное к SPACER «прогулка» с суффиксом -EK. SPACER пришёл из немецкого spazieren «гулять»."
memory: "Spacerek — прогулочка; spacerkiem — пешочком. To nie spacerek — это вам не прогулка."
idioms:
  - { pl: "to nie spacerek", ru: "это вам не прогулка, дело нелёгкое" }
