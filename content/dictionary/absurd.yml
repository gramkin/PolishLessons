notes:
  - { kind: false-friend, text: "ABSURD — «абсурд», как в русском. Абсурдный — ABSURDALNY. Чушь в разговоре — BZDURA. DOPROWADZIĆ DO ABSURDU — «довести до абсурда»." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Родительный — ABSURDU. В местном D переходит в DZ: W ABSURDZIE. Множественное ABSURDY — «нелепости»." }
