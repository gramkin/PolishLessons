# review
id: glowa
format: 2
lemma: "głowa"
rank: 221
pos: noun
pron: { cyr: "гло́ва" }
senses:
  - id: head
    ru: "голова"
    examples:
      - pl: "Boli mnie głowa."
        ru: "У меня голова болит."
        source: { kind: tatoeba, id: 349454 }
      - pl: "Spadł głową w dół."
        ru: "Он упал головой вниз."
        source: { kind: tatoeba, id: 1085712 }
      - pl: "Posąg nie ma głowy."
        ru: "У статуи нет головы."
        source: { kind: tatoeba, id: 1110207 }
  - id: head-phrases
    ru: "голова в оборотах; глава (кто-то во главе)"
    examples:
      - pl: "Głowa mnie boli."
        ru: "У меня болит голова."
        source: { kind: tatoeba, id: 856052 }
      - pl: "Tom stoi na głowie."
        ru: "Том стоит на голове."
        source: { kind: tatoeba, id: 3663697 }
      - pl: "Maria skinęła głową."
        ru: "Мария закивала."
        source: { kind: tatoeba, id: 2578104 }
notes:
  - { kind: government, text: "Boli mnie głowa — буквально «болит меня голова»: человек стоит в винительном падеже, а не в конструкции «у меня»." }
  - { kind: usage, text: "głowa значит и «голова», и «глава»: głowa rodziny «глава семьи», głowa państwa «глава государства»." }
  - { kind: usage, text: "z głowy — «наизусть, по памяти»; mieć z głowy — «отделаться от чего-то»." }
collocations:
  - { pl: "boli mnie głowa", ru: "у меня болит голова" }
  - { pl: "głowa rodziny", ru: "глава семьи" }
  - { pl: "kiwać głową", ru: "кивать головой" }
  - { pl: "z głowy", ru: "наизусть" }
etymology: "Праславянское *golva — то же слово, что русское «голова»; ср. чешское hlava и хорватское glava."
memory: "Boli mnie głowa — дословно «болит меня голова»: человек в винительном падеже. И głowa — это и «голова», и «глава»: głowa rodziny."
idioms:
  - { pl: "barania głowa", ru: "баранья голова, дурень" }
  - { pl: "bić głową w mur", ru: "биться головой о стену" }
  - { pl: "czapki z głów", ru: "шапки долой" }
formExamplesSkip:
  - { form: "głowo", reason: "звательный падеж от этого существительного встречается только в поэзии" }
