# review
id: zarabiac
format: 2
lemma: "zarabiać"
rank: 1728
pos: verb
aspect: imperf
aspectPair: zarobic
pron: { cyr: "зара́бяць" }
senses:
  - id: earn
    ru: "зарабатывать (получать плату)"
    examples:
      - pl: "Nieźle zarabia."
        ru: "Он неплохо зарабатывает."
        source: { kind: translated, id: 674640 }
      - pl: "Tom zarabia o wiele więcej niż ja."
        ru: "Том зарабатывает гораздо больше, чем я."
        source: { kind: tatoeba, id: 6313112 }
      - pl: "Zarabiam dobrze."
        ru: "Я хорошо зарабатываю."
        source: { kind: translated, id: 8773892 }
  - id: earn-want
    ru: "зарабатывать (хотеть, стремиться)"
    examples:
      - pl: "Chciałbym zarabiać więcej."
        ru: "Я бы хотел больше зарабатывать."
        source: { kind: tatoeba, id: 6328333 }
      - pl: "Chcesz zarabiać dużo pieniędzy?"
        ru: "Хочешь зарабатывать много денег?"
        source: { kind: translated, id: 11264392 }
      - pl: "Zarabiam na życie śpiewając."
        ru: "Я зарабатываю на жизнь пением."
        source: { kind: translated, id: 1541614 }
notes:
  - { kind: usage, text: "Пара по виду: zarabiać (несовершенный) — zarobić (совершенный)." }
  - { kind: government, text: "Зарабатывать на жизнь — zarabiać na życie (винительный с na): zarabiam na życie śpiewaniem." }
  - { kind: usage, text: "Сколько — прямо в винительном падеже: zarabiam sto euro dziennie «я зарабатываю сто евро в день»." }
  - { kind: false-friend, text: "Состав слова совпадает с русским: za- это «за-», -rabiać от robić «делать». Но «работать» — это pracować, а не zarabiać." }
collocations:
  - { pl: "zarabiać na życie", ru: "зарабатывать на жизнь" }
  - { pl: "dobrze zarabiać", ru: "хорошо зарабатывать" }
  - { pl: "zarabiać pieniądze", ru: "зарабатывать деньги" }
family:
