etymology: "Приставка za- плюс -rabiać от robić «делать» — как русское «за-рабатывать» от «работать»."
memory: "zarabiać — «зарабатывать», совершенный вид zarobić. На жизнь — zarabiać na życie. А «работать» — это pracować, другое слово."
