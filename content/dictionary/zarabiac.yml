    ru: "Он не доверял так легко зарабатываемой прибыли."
    source: { kind: authored }
  - form: "zarabianiem"
    pl: "Zmęczył się zarabianiem na wszystkich."
    ru: "Он устал зарабатывать на всех."
    source: { kind: authored }
  - form: "zarabianiem"
    pl: "Między zarabianiem a wydawaniem nie ma równowagi."
    ru: "Между заработком и тратами нет равновесия."
    source: { kind: authored }
  - form: "zarabianiem"
    pl: "Zajmuje się zarabianiem, nie liczeniem."
    ru: "Он занят заработком, а не подсчётами."
    source: { kind: authored }
  - form: "zarabiany"
    pl: "Ten dodatek jest zarabiany co miesiąc."
    ru: "Эта надбавка зарабатывается каждый месяц."
    source: { kind: authored }
  - form: "zarabiany"
    pl: "Grosz zarabiany uczciwie smakuje inaczej."
    ru: "Честно заработанная копейка ощущается иначе."
    source: { kind: authored }
  - form: "zarabiany"
    pl: "Zarabiany za granicą zysk trafia do kraju."
    ru: "Зарабатываемая за границей прибыль идёт в страну."
    source: { kind: authored }
  - form: "zarabianych"
    pl: "Nie wydał zarabianych pieniędzy."
    ru: "Он не потратил зарабатываемых денег."
    source: { kind: authored }
  - form: "zarabianych"
    pl: "Z zarabianych sum spłacili kredyt."
    ru: "Из зарабатываемых сумм они погасили кредит."
    source: { kind: authored }
  - form: "zarabianych"
    pl: "Nie ma tu łatwo zarabianych majątków."
    ru: "Легко зарабатываемых состояний тут нет."
    source: { kind: authored }
  - form: "zarabianym"
    pl: "Cieszył się zarabianym groszem."
    ru: "Он радовался зарабатываемой копейке."
    source: { kind: authored }
  - form: "zarabianym"
    pl: "W zarabianym uczciwie chlebie nie ma wstydu."
    ru: "В честно зарабатываемом хлебе нет стыда."
    source: { kind: authored }
  - form: "zarabianym"
    pl: "Podzielił się zarabianym dodatkiem."
    ru: "Он поделился зарабатываемой надбавкой."
    source: { kind: authored }
  - form: "zarabianymi"
    pl: "Chwalił się zarabianymi sumami."
    ru: "Он хвалился зарабатываемыми суммами."
    source: { kind: authored }
  - form: "zarabianymi"
    pl: "Między zarabianymi a odziedziczonymi pieniędzmi jest różnica."
    ru: "Между зарабатываемыми и унаследованными деньгами есть разница."
    source: { kind: authored }
  - form: "zarabianymi"
    pl: "Zapłacił zarabianymi oszczędnościami."
    ru: "Он расплатился зарабатываемыми сбережениями."
    source: { kind: authored }
  - form: "zarabiasz"
    pl: "Jak zarabiasz na codzienne potrzeby?"
    ru: "Как ты зарабатываешь на повседневные нужды?"
    source: { kind: translated, id: 539701 }
  - form: "zarabiasz"
    pl: "Słyszałem, że zarabiasz dużo pieniędzy."
    ru: "Я слышал, что ты зарабатываешь много денег."
    source: { kind: translated, id: 1002692 }
  - form: "zarabiasz"
    pl: "Im mniej pracujesz, tym mniej zarabiasz."
    ru: "Чем меньше ты работаешь, тем меньше зарабатываешь."
    source: { kind: translated, id: 11569779 }
