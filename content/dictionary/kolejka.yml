senses:
  - id: queue
    ru: "очередь"
    examples:
      - pl: "Stań w kolejce."
        ru: "Встаньте в очередь."
        source: { kind: tatoeba, id: 10695782 }
      - pl: "Kolejka rośnie."
        ru: "Очередь растёт."
        source: { kind: translated, id: 7457315 }
      - pl: "Za czym ta kolejka?"
        ru: "За чем эта очередь?"
        source: { kind: translated, id: 999205 }
  - id: in-queue
    ru: "очередь (стоять, ждать, занять)"
    examples:
      - pl: "Czekam w kolejce."
        ru: "Я жду в очереди."
        source: { kind: translated, id: 6155585 }
      - pl: "Stanąłem na końcu kolejki."
        ru: "Я встал в конец очереди."
        source: { kind: translated, id: 991170 }
      - pl: "Czyja kolejka?"
        ru: "Чья очередь?"
        source: { kind: translated, id: 550666 }
notes:
  - { kind: usage, text: "Основное значение — «очередь»: stać w kolejce «стоять в очереди», czekać w kolejce «ждать в очереди»." }
  - { kind: government, text: "В очереди — w kolejce (предложный падеж); встать в очередь — stanąć w kolejce или ustawić się w kolejkę." }
  - { kind: usage, text: "Czyja kolejka? значит «чья очередь?» — о порядке хода, а не о людях в ряду." }
  - { kind: usage, text: "Другие значения: kolejka górska — «американские горки», а kolejka в баре — «круг выпивки»: Tom kupuje nam kolejkę «Том ставит нам по кругу»." }
collocations:
  - { pl: "stać w kolejce", ru: "стоять в очереди" }
  - { pl: "czyja kolejka", ru: "чья очередь" }
  - { pl: "kolejka górska", ru: "американские горки" }
family:
  - { pl: "kolej", ru: "железная дорога; очередь", relation: root, id: kolej }
  - { pl: "kolejny", ru: "очередной", relation: root }
  - { pl: "pociąg", ru: "поезд", relation: root, id: pociag }
etymology: "Уменьшительное от kolej «черёд, железная дорога», того же корня, что koło «колесо» и русское «колея». Значение «очередь» выросло из «череда»."
memory: "kolejka — прежде всего «очередь»: stać w kolejce. Czyja kolejka? значит «чья очередь?». А kolejka górska — это «американские горки»."
idioms:
