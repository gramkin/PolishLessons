notes:
  - { kind: usage, text: "Основное значение — «очередь»: stać w kolejce «стоять в очереди», czekać w kolejce «ждать в очереди»." }
  - { kind: government, text: "В очереди — w kolejce (предложный падеж); встать в очередь — stanąć w kolejce или ustawić się w kolejkę." }
  - { kind: usage, text: "Czyja kolejka? значит «чья очередь?» — о порядке хода, а не о людях в ряду." }
  - { kind: usage, text: "Другие значения: kolejka górska — «американские горки», а kolejka в баре — «круг выпивки»: Tom kupuje nam kolejkę «Том ставит нам по кругу»." }
