# review
id: glupiec
format: 2
lemma: "głupiec"
rank: 1567
pos: noun
pron: { cyr: "гу́упец" }
senses:
  - id: fool
    ru: "глупец, дурак"
    examples:
      - pl: "Tylko głupiec nie boi się morza."
        ru: "Только глупец не боится моря."
        source: { kind: tatoeba, id: 1180228 }
      - pl: "Cóż to za głupiec!"
        ru: "Что за глупец!"
        source: { kind: translated, id: 933360 }
      - pl: "On jest głupcem."
        ru: "Он глупец."
        source: { kind: translated, id: 6309366 }
  - id: make-a-fool
    ru: "выставить дураком, считать дураком"
    examples:
      - pl: "Masz mnie za głupca?"
        ru: "Ты меня за дурака держишь?"
        source: { kind: translated, id: 10545701 }
      - pl: "Tom zrobił z siebie głupca."
        ru: "Том выставил себя дураком."
        source: { kind: translated, id: 1348476 }
      - pl: "Mają nas za głupców."
        ru: "Они нас за дураков держат."
        source: { kind: translated, id: 12691789 }
notes:
  - { kind: usage, text: "В основе беглое e: głupiec, но głupca, głupcem, głupcy — гласная выпадает при склонении, ровно как в русском «отец — отца»." }
  - { kind: usage, text: "Звательная форма głupcze используется в обращении и в ругани: Ty głupcze! «Ты дурак!»." }
  - { kind: usage, text: "Прилагательное — głupi «глупый», существительное głupota — «глупость»." }
  - { kind: usage, text: "robić z kogoś głupca значит «выставлять кого-то дураком»: Tom zrobił z siebie głupca «Том выставил себя дураком»." }
collocations:
  - { pl: "robić z kogoś głupca", ru: "выставлять дураком" }
  - { pl: "mieć kogoś za głupca", ru: "считать дураком" }
  - { pl: "ty głupcze!", ru: "ты дурак!" }
etymology: "От głupi «глупый» с суффиксом -ec, обозначающим носителя признака — ровно как русское «глупец» от «глупый». Словообразование совпадает полностью."
memory: "głupiec = «глупец», от głupi «глупый», как и в русском. Осторожно со склонением: беглое e выпадает — głupiec, но głupca, głupcem. Обращение — ty głupcze!"
idioms:
  - { pl: "robić z kogoś głupca", ru: "выставлять дураком" }
  - { pl: "wyjść na głupca", ru: "остаться в дураках" }
  - { pl: "ty głupcze!", ru: "ты дурак!" }
