# review
id: pisac
format: 2
lemma: "pisać"
rank: 532
pos: verb
aspect: imperf
pron: { cyr: "пи́саць" }
senses:
  - id: write
    ru: "писать (что-л. — винительный, как в русском)"
    note: "Прямое дополнение в винительном: piszę list."
    examples:
      - pl: "Umiesz pisać?"
        ru: "Ты умеешь писать?"
        source: { kind: tatoeba, id: 5336646 }
      - pl: "On pisze książki."
        ru: "Он пишет книги."
        source: { kind: tatoeba, id: 1393347 }
      - pl: "Piszę list."
        ru: "Я пишу письмо."
        source: { kind: translated, id: 2164635 }
  - id: write-to
    ru: "pisać do kogoś — писать кому-либо"
    note: "Главное отличие: с предлогом do и родительным, а не с дательным."
    examples:
      - pl: "Pisała do rodziców przynajmniej raz w tygodniu."
        ru: "Она писала родителям минимум раз в неделю."
        source: { kind: translated, id: 882892 }
      - pl: "Nie znała jego adresu, więc do niego nie pisała."
        ru: "Она не знала его адреса, поэтому ему не писала."
        source: { kind: translated, id: 771750 }
      - pl: "Nie pisz do mnie takich długich listów."
        ru: "Не пиши мне таких длинных писем."
        source: { kind: tatoeba, id: 1783757 }
  - id: destined
    ru: "pisane komuś — суждено кому-либо"
    note: "Застывший оборот с причастием: co komu pisane «кому что суждено»."
    examples:
      - pl: "Było jej pisane umrzeć młodo."
        ru: "Ей было суждено умереть молодой."
        source: { kind: translated, id: 837082 }
      - pl: "Patrz, zmarł tak nagle. A taki był zdrowy... Nikt nie wie, co komu pisane."
        ru: "Смотри, умер так внезапно. А такой был здоровый... Никто не знает, кому что суждено."
        source: { kind: translated, id: 959782 }
      - pl: "Widać tak było pisane."
        ru: "Видно, так было суждено."
        source: { kind: authored }
notes:
  - { kind: government, text: "«Писать кому-то» по-польски строится иначе: pisać DO kogoś, с предлогом do и родительным — pisać do rodziców «писать родителям». Дательного падежа здесь нет." }
  - { kind: usage, text: "pisać na komputerze «печатать на компьютере», pisać na maszynie «печатать на машинке», pisać na temat czegoś «писать на тему чего-либо»." }
  - { kind: usage, text: "Совершенный вид — napisać: napisałem list «я написал письмо»." }
  - { kind: usage, text: "Причастие в обороте pisane komuś значит «суждено»: Nikt nie wie, co komu pisane." }
collocations:
  - { pl: "pisać list", ru: "писать письмо" }
  - { pl: "pisać do kogoś", ru: "писать кому-либо" }
  - { pl: "pisać na komputerze", ru: "печатать на компьютере" }
  - { pl: "co komu pisane", ru: "кому что суждено" }
family:
  - { pl: "napisać", ru: "написать", relation: derived }
  - { pl: "pismo", ru: "письмо; письменность", relation: derived }
  - { pl: "pisarz", ru: "писатель", relation: derived }
etymology: "От праславянского *pьsati «писать, рисовать» — то же слово, что русское «писать»; отсюда же pismo «письмо, письменность» и pisarz «писатель»."
memory: "pisać — «писать», и прямое дополнение как в русском: piszę list. Но «писать КОМУ-ТО» строится иначе: pisać DO kogoś, с предлогом do и родительным — pisała do rodziców «она писала родителям», никакого дательного. Совершенный вид — napisać. И запомните застывший оборот pisane komuś «суждено кому-то»: Nikt nie wie, co komu pisane."
idioms:
  - { pl: "pisać do kogoś", ru: "писать кому-либо" }
  - { pl: "co komu pisane", ru: "кому что суждено" }
  - { pl: "pisać na komputerze", ru: "печатать на компьютере" }
