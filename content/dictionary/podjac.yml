# review
id: podjac
format: 2
lemma: "podjąć"
rank: 1259
pos: verb
aspect: perf
pron: { cyr: "по́дйонць" }
senses:
  - id: decision
    ru: "podjąć decyzję — принять решение"
    examples:
      - pl: "Muszę podjąć decyzję."
        ru: "Мне нужно принять решение."
        source: { kind: translated, id: 3416284 }
      - pl: "Tom podjął decyzję."
        ru: "Том принял решение."
        source: { kind: translated, id: 2024586 }
      - pl: "Długo nie mogłem podjąć decyzji."
        ru: "Я долго не мог принять решения."
        source: { kind: tatoeba, id: 2519098 }
  - id: action
    ru: "предпринять (действия, меры, попытку)"
    examples:
      - pl: "Podjąć działania."
        ru: "Предпринять действия."
        source: { kind: translated, id: 5652098 }
      - pl: "Jakie działania powinniśmy podjąć?"
        ru: "Какие действия нам следует предпринять?"
        source: { kind: translated, id: 5142984 }
      - pl: "Komisja obiecała wkrótce podjąć działania."
        ru: "Комиссия обещала вскоре принять меры."
        source: { kind: translated, id: 3048645 }
  - id: undertake
    ru: "podjąć się czegoś — взяться за что-то (с родительным)"
    examples:
      - pl: "Podejmiesz się tej pracy?"
        ru: "Возьмёшься за эту работу?"
        source: { kind: translated, id: 750567 }
      - pl: "Podjąłem się tego niechętnie."
        ru: "Я взялся за это неохотно."
        source: { kind: translated, id: 7707273 }
      - pl: "Czy podjął się tej misji?"
        ru: "Он взялся за эту миссию?"
        source: { kind: translated, id: 365727 }
notes:
  - { kind: government, text: "podjąć decyzję «принять решение» — винительный падеж. А возвратное podjąć się czegoś «взяться за что-то» требует родительного: podjąć się tej pracy." }
  - { kind: usage, text: "Самое частое сочетание — podjąć decyzję. Русское «принять решение» устроено так же, только глагол другой." }
  - { kind: usage, text: "Дальше по частоте: podjąć działania «предпринять действия», podjąć próbę «предпринять попытку», podjąć ryzyko «пойти на риск»." }
  - { kind: usage, text: "Вид совершенный; несовершенный — podejmować. Основа чередуется: podjąć и podjął, но podejmę и podejmiesz в будущем." }
collocations:
  - { pl: "podjąć decyzję", ru: "принять решение" }
  - { pl: "podjąć działania", ru: "предпринять действия" }
  - { pl: "podjąć się czegoś", ru: "взяться за что-то" }
etymology: "Приставка pod- и jąć «взять», из праславянского *jęti. Русские «поднять» и «занять» — из того же корня «-ять»."
memory: "podjąć — прежде всего podjąć decyzję «принять решение». Возвратное podjąć się czegoś значит «взяться за что-то», с родительным. Основа чередуется: podjąć и podjął, но podejmę и podejmiesz. Несовершенный вид — podejmować."
idioms:
