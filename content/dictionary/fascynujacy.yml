# review
id: fascynujacy
format: 2
lemma: "fascynujący"
rank: 4575
pos: adj
pron: { cyr: "фасцыную́нцы" }
senses:
  - id: fascinating
    ru: "захватывающий, увлекательный, завораживающий"
    examples:
      - pl: "To fascynująca książka, przeczytałem ją w jedną noc."
        ru: "Это захватывающая книга, я прочёл её за одну ночь."
        source: { kind: authored }
      - pl: "Kosmos to fascynujący temat."
        ru: "Космос — увлекательная тема."
        source: { kind: authored }
      - pl: "Rozmowa z nim była fascynująca."
        ru: "Разговор с ним был увлекательным."
        source: { kind: authored }
  - id: captivating
    ru: "обворожительный, неотразимый (о человеке)"
    examples:
      - pl: "Poznałem fascynującą kobietę."
        ru: "Я познакомился с обворожительной женщиной."
        source: { kind: authored }
      - pl: "To fascynujący człowiek o niezwykłym życiorysie."
        ru: "Это человек завораживающий, с необычной биографией."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Русское «фасцинирующий» почти не употребляют, говорят «захватывающий», «увлекательный». Польское FASCYNUJĄCY — обычное слово похвалы: FASCYNUJĄCY FILM, FASCYNUJĄCA PODRÓŻ. По форме это причастие от FASCYNOWAĆ, «восхищать, увлекать», как русское «восхищающий», но работает как прилагательное." }
  - { kind: usage, text: "Сравнивается описательно: BARDZIEJ FASCYNUJĄCY, NAJBARDZIEJ FASCYNUJĄCY. В карточке десять форм: мужское-личное множественное FASCYNUJĄCY совпадает с именительным единственного: FASCYNUJĄCY LUDZIE. Синонимы попроще — CIEKAWY и INTERESUJĄCY." }
  - { kind: government, text: "Захватывающий для кого-то — FASCYNUJĄCY DLA KOGOŚ, DLA с родительным. Глагол FASCYNOWAĆ берёт винительный: TO MNIE FASCYNUJE, «это меня увлекает». Прилагательное ставится и до, и после существительного." }
  - { kind: pronunciation, text: "Читается «фасцыную́нцы», пять слогов, ударение на предпоследнем. SC произносится раздельно, «с-ц», а не «щ». CY — твёрдое «цы». Ą перед C даёт «он»: «-ю́нцы»." }
  - { kind: register, text: "Нейтральное, чуть книжное слово с восторженным оттенком. В разговоре его часто заменяют на CIEKAWY или молодёжное ODLOTOWY, «улётный». В рецензиях и рекламе FASCYNUJĄCY — стандарт." }
collocations:
  - { pl: "fascynująca książka", ru: "захватывающая книга" }
  - { pl: "fascynujący temat", ru: "увлекательная тема" }
  - { pl: "fascynująca podróż", ru: "увлекательное путешествие" }
family:
  - { pl: "fascynować", ru: "восхищать, увлекать", relation: root }
  - { pl: "fascynacja", ru: "увлечение, очарование", relation: derived }
  - { pl: "ciekawy", ru: "интересный", relation: root, id: ciekawy }
etymology: "Из латинского fascinare, «околдовывать, сглазить», от fascinum, «чары, амулет». Изначально это было о колдовстве: тот, кого «фасцинировали», был заворожён. Польский взял глагол FASCYNOWAĆ и его действительное причастие FASCYNUJĄCY, которое стало обычным прилагательным."
memory: "Fascynujący — захватывающий, увлекательный: fascynująca książka, fascynujący człowiek. От fascynować. Читается «фасцыную́нцы»: s и c раздельно."
idioms:
  - { pl: "to fascynujące", ru: "это поразительно, это удивительно" }
