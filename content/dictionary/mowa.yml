# review
id: mowa
format: 2
lemma: "mowa"
rank: 700
pos: noun
pron: { cyr: "мо́ва" }
senses:
  - id: speech
    ru: "речь, выступление"
    examples:
      - pl: "Wygłaszałeś kiedyś mowę po francusku?"
        ru: "Ты когда-нибудь произносил речь по-французски?"
        source: { kind: translated, id: 5882599 }
      - pl: "Zszokowana, straciła mowę."
        ru: "Потрясённая, она потеряла дар речи."
        source: { kind: translated, id: 361189 }
      - pl: "Ze wzruszenia odebrało mi mowę."
        ru: "От волнения у меня отняло речь."
        source: { kind: translated, id: 914998 }
  - id: language
    ru: "речь, язык (устная форма)"
    note: "w mowie i w piśmie «устно и письменно» — очень частая формула."
    examples:
      - pl: "Angielski w mowie jest trudny."
        ru: "Английский в устной речи труден."
        source: { kind: translated, id: 1896046 }
      - pl: "Ona zna francuski w mowie i w piśmie."
        ru: "Она знает французский устно и письменно."
        source: { kind: translated, id: 750513 }
      - pl: "W mowie daję sobie radę z japońskim."
        ru: "В устной речи я справляюсь с японским."
        source: { kind: translated, id: 921770 }
notes:
  - { kind: usage, text: "Nie ma mowy! — «Не может быть речи!», «Ни в коем случае!». Одна из самых частых разговорных формул, встречается постоянно." }
  - { kind: usage, text: "O wilku mowa — «лёгок на помине», буквально «о волке речь». Говорят, когда человек появляется, едва о нём заговорили." }
  - { kind: usage, text: "Грамматические термины строятся на этом слове: mowa zależna «косвенная речь», mowa niezależna «прямая речь», części mowy «части речи»." }
  - { kind: false-friend, text: "Не путайте существительное mowa «речь» с формами глагола mówić «говорить»: mów! — это повелительное наклонение «говори!», а не форма слова mowa." }
collocations:
  - { pl: "nie ma mowy", ru: "не может быть и речи" }
  - { pl: "o wilku mowa", ru: "лёгок на помине" }
  - { pl: "w mowie i w piśmie", ru: "устно и письменно" }
  - { pl: "wygłosić mowę", ru: "произнести речь" }
family:
  - { pl: "mówić", ru: "говорить", relation: root, id: mowic }
  - { pl: "wymowa", ru: "произношение", relation: derived }
etymology: "Праславянское *mlva «шум, говор», давшее старопольское mołva и затем mowa. Русское «молва» — то же слово, но значение разошлось: в польском это «речь» вообще, в русском — «слухи»."
memory: "mowa — «речь»: и выступление (wygłosić mowę), и устная форма языка (w mowie i w piśmie «устно и письменно»). Родня русской «молве», но значение шире. Две формулы надо знать наизусть: Nie ma mowy! «Ни в коем случае!» и O wilku mowa «лёгок на помине». На этом слове держатся и грамматические термины: mowa zależna «косвенная речь», części mowy «части речи». И не путайте mowa с mów! — это повелительное от mówić «говори!»."
idioms:
  - { pl: "nie ma mowy", ru: "не может быть и речи" }
  - { pl: "o wilku mowa", ru: "лёгок на помине" }
  - { pl: "w mowie i w piśmie", ru: "устно и письменно" }
