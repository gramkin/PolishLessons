# review
id: sluchac
format: 2
lemma: "słuchać"
rank: 156
pos: verb
aspect: imperf
pron: { cyr: "слу́хаць" }
senses:
  - id: listen
    ru: "слушать (+ родительный падеж)"
    note: "Управление отличается от русского только падежом: słucham muzyki, а не «muzykę»."
    examples:
      - pl: "Słuchaj."
        ru: "Слушай."
        source: { kind: tatoeba, id: 4791063 }
      - pl: "Ona słucha muzyki."
        ru: "Она слушает музыку."
        source: { kind: tatoeba, id: 8506031 }
      - pl: "Słuchali radia."
        ru: "Они слушали радио."
        source: { kind: tatoeba, id: 6313425 }
  - id: obey
    ru: "слушаться, повиноваться"
    examples:
      - pl: "Nie słuchaj go."
        ru: "Не слушай его."
        source: { kind: tatoeba, id: 10700193 }
      - pl: "Nikt nie słucha."
        ru: "Никто не слушает."
        source: { kind: tatoeba, id: 5659980 }
      - pl: "Dzieci nie słuchają rodziców."
        ru: "Дети не слушаются родителей."
        source: { kind: authored }
notes:
  - { kind: government, text: "słuchać требует родительного падежа: słucham muzyki, słuchaj mnie. А słyszeć — винительного: słyszę muzykę. Это самая частая ошибка." }
  - { kind: usage, text: "słuchać — «слушать» намеренно, słyszeć — «слышать» непроизвольно." }
  - { kind: usage, text: "Słucham? в ответ на телефонный звонок или в значении «Простите, что?» — как русское «Алло» и «Простите?»." }
collocations:
  - { pl: "słuchać muzyki", ru: "слушать музыку" }
  - { pl: "słuchać rodziców", ru: "слушаться родителей" }
  - { pl: "słucham?", ru: "алло?, простите?" }
  - { pl: "słuchaj!", ru: "слушай!" }
etymology: "Праславянское *sluchati от *sluchъ «слух»; то же слово, что русское «слушать», и один корень со słyszeć."
memory: "Пара как в русском: słuchać «слушать» — słyszeć «слышать». Но падежи разные: słucham muzyki (родительный), słyszę muzykę (винительный). И Słucham? значит «Алло?» или «Простите?»."
idioms:
  - { pl: "słuchać jednym uchem", ru: "слушать вполуха" }
  - { pl: "słuchać jak świnia grzmotu", ru: "пропускать мимо ушей" }
  - { pl: "kto chce rozkazywać, musi się najpierw nauczyć słuchać", ru: "кто хочет приказывать, должен сперва научиться слушаться" }
