notes:
  - { kind: false-friend, text: "Три похожих слова, и путать их нельзя. NAUKA это «наука» и одновременно «учёба». LEKCJA это школьный урок, тот, что в расписании. А NAUCZKA это урок горький, преподанный жизнью или человеком в наказание: русское «урок» в обороте «это тебе урок» или «проучить». Уменьшительный суффикс здесь работает не на размер, а на оценку, как в SPRAWKA: дело мелкое, но поучительное." }
  - { kind: usage, text: "Десять форм, женский род. В дательном и местном падеже единственного числа K переходит в C: NAUCZKA, но PO NAUCZCE. Это то же чередование, что в MATKA — MATCE и SPRAWKA — SPRAWCE. Множественное число NAUCZKI вполне живое, когда речь о череде уроков, которые жизнь преподаёт одному человеку. Родительный множественного NAUCZEK с беглым E." }
  - { kind: government, text: "Дать кому-то урок — DAĆ KOMUŚ NAUCZKĘ, дательный на лицо и винительный на урок, ровно как по-русски. Получить урок — DOSTAĆ NAUCZKĘ, винительный. После этого урока — PO TEJ NAUCZCE, предлог PO с местным падежом. Урок для кого-то — NAUCZKA DLA KOGOŚ, предлог DLA с родительным. Принять что-то как урок — POTRAKTOWAĆ COŚ JAKO NAUCZKĘ, винительный после JAKO." }
  - { kind: pronunciation, text: "Читается «нау́чка», три слога, ударение на втором. Сочетание AU произносится в два приёма, «а-у», а не как английский дифтонг. Дальше CZ даёт «ч», и получается «учка». В форме NAUCZCE сочетание CZC даёт подряд «чц», что для русского уха непривычно, но выговаривается легко: «нау́чце». В NAUCZEK беглое E слышно отчётливо." }
  - { kind: register, text: "Слово разговорное и всегда с оттенком назидания: DOBRA NAUCZKA «хороший урок», SUROWA NAUCZKA «суровый урок», NAUCZKA NA PRZYSZŁOŚĆ. Говорят так и с сочувствием, и со злорадством, смотря по тону: NIECH TO BĘDZIE DLA CIEBIE NAUCZKA значит «пусть это будет тебе уроком». В официальной речи слова нет, там скажут DOŚWIADCZENIE или WNIOSKI." }
collocations:
  - { pl: "dostać nauczkę", ru: "получить урок" }
  - { pl: "dobra nauczka", ru: "хороший урок" }
