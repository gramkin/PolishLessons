  - { pl: "nauka", ru: "наука; учёба", relation: root, id: nauka }
  - { pl: "nauczyciel", ru: "учитель", relation: derived, id: nauczyciel }
etymology: "Уменьшительное от NAUKA, от NAUCZYĆ, от приставки NA- и корня UCZ-, того же, что в русских «учить», «наука», «учитель». Корень общеславянский и совершенно прозрачный. Разошлось распределение: польская NAUKA взяла на себя и науку, и учёбу, для школьного урока нашлось латинское LEKCJA, а уменьшительное NAUCZKA осталось при уроке жизненном. Русский обошёлся одним словом «урок» на два последних случая."
memory: "Три слова рядом, и разводить их надо твёрдо: nauka это «наука» и «учёба», lekcja это школьный урок, а nauczka это урок горький, преподанный жизнью или в наказание. Dać komuś nauczkę значит «проучить кого-то». Уменьшительный суффикс тут про оценку, а не про размер, как в sprawka. В дательном и местном k переходит в c: po nauczce. Читается «нау́чка», и au произносится в два приёма."
idioms:
  - { pl: "dać komuś nauczkę", ru: "проучить кого-либо, преподать урок" }
