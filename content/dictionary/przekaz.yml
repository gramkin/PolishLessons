# review
id: przekaz
format: 2
lemma: "przekaz"
rank: 4821
pos: noun
pron: { cyr: "пшэ́кас" }
senses:
  - id: message
    ru: "передача (информации), посыл; трансляция"
    examples:
      - pl: "Przekaz tego filmu jest jasny."
        ru: "Посыл этого фильма ясен."
        source: { kind: authored }
      - pl: "Media kontrolują przekaz informacji."
        ru: "СМИ контролируют передачу информации."
        source: { kind: authored }
      - pl: "Przekaz na żywo przerwano."
        ru: "Прямую трансляцию прервали."
        source: { kind: authored }
  - id: remittance
    ru: "денежный перевод; предание"
    examples:
      - pl: "Wysłał matce przekaz pocztowy."
        ru: "Он отправил матери почтовый перевод."
        source: { kind: authored }
      - pl: "Przekaz pieniężny dotarł po tygodniu."
        ru: "Денежный перевод пришёл через неделю."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "PRZEKAZ — «передача» в широком смысле: передача сигнала, трансляция, денежный перевод. В политике и рекламе PRZEKAZ — «посыл, месседж»: JAKI JEST PRZEKAZ TEJ KAMPANII? Главная формула — ŚRODKI MASOWEGO PRZEKAZU, «средства массовой передачи», то есть СМИ. Телепередача — не PRZEKAZ, а PROGRAM или AUDYCJA." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. В местном падеже Z смягчается: W PRZEKAZIE. Во множественном PRZEKAZY — ещё и «предания»: PRZEKAZY LUDOWE." }
  - { kind: government, text: "Передача чего-то — PRZEKAZ CZEGOŚ, родительный: PRZEKAZ INFORMACJI. Прямая трансляция — PRZEKAZ NA ŻYWO. В посыле — W PRZEKAZIE, местный." }
  - { kind: pronunciation, text: "Читается «пшэ́кас», два слога, ударение на первом. PRZ — «пш», конечное Z оглушается в «с». В форме PRZEKAZIE: «пшэка́зе»." }
  - { kind: register, text: "Слово деловое и медийное: PRZEKAZ MEDIALNY, PRZEKAZ RZĄDU. Почтовый PRZEKAZ сегодня старомоден, его вытеснили банковские переводы, PRZELEWY." }
collocations:
  - { pl: "przekaz na żywo", ru: "прямая трансляция" }
  - { pl: "jasny przekaz", ru: "ясный посыл" }
  - { pl: "przekaz medialny", ru: "медийный посыл" }
family:
  - { pl: "przekazać", ru: "передать", relation: derived, id: przekazac }
  - { pl: "przekazywać", ru: "передавать", relation: derived }
  - { pl: "przekaźnik", ru: "реле; ретранслятор", relation: derived }
etymology: "От PRZEKAZAĆ «передать»: приставка PRZE- и KAZAĆ в старом смысле «говорить», буквально «пере-сказать». Русские «пересказ» и «приказ» — тот же корень, но польское слово ушло к значению «передача»."
memory: "Przekaz — передача, посыл, перевод. Читается «пшэ́кас». Środki masowego przekazu — СМИ. Przekaz na żywo — прямая трансляция. Przekaz pieniężny — денежный перевод; банковский — przelew."
idioms:
  - { pl: "środki masowego przekazu", ru: "средства массовой информации" }
  - { pl: "przekaz pieniężny", ru: "денежный перевод" }
formExamplesSkip:
