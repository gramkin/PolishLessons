# review
id: scigac
format: 2
lemma: "ścigać"
rank: 1834
pos: verb
aspect: imperf
pron: { cyr: "щи́гаць" }
senses:
  - id: chase
    ru: "преследовать, гнаться за"
    examples:
      - pl: "Ściga mnie policja."
        ru: "Меня преследует полиция."
        source: { kind: translated, id: 6554312 }
      - pl: "Tom ścigał włamywacza."
        ru: "Том гнался за взломщиком."
        source: { kind: translated, id: 10593271 }
      - pl: "Pies ścigał kota aż na czubek drzewa."
        ru: "Собака гналась за котом до самой верхушки дерева."
        source: { kind: translated, id: 921369 }
  - id: prosecute-race
    ru: "преследовать (по закону); ścigać się — состязаться"
    examples:
      - pl: "On jest ścigany przez policję."
        ru: "Его разыскивает полиция."
        source: { kind: translated, id: 621330 }
      - pl: "Ścigaliśmy się w biegu na sto metrów."
        ru: "Мы состязались в беге на сто метров."
        source: { kind: translated, id: 460704 }
      - pl: "Ścigałem się z nim."
        ru: "Я состязался с ним."
        source: { kind: translated, id: 359758 }
notes:
  - { kind: government, text: "Гнаться за кем-то — ścigać kogoś, прямо в винительном падеже, без предлога: pies ścigał kota. Русское «гнаться за» требует предлога — это расхождение." }
  - { kind: usage, text: "Возвратное ścigać się значит «состязаться, гоняться наперегонки»: ścigaliśmy się w biegu." }
  - { kind: usage, text: "Второе значение — юридическое: być ściganym przez policję «быть разыскиваемым полицией», ściganie przestępstw «преследование преступлений»." }
  - { kind: usage, text: "Пословица Kto ściga dwa zające, nie złapie żadnego — «За двумя зайцами погонишься, ни одного не поймаешь»." }
collocations:
  - { pl: "ścigać kogoś", ru: "преследовать кого-либо" }
  - { pl: "ścigać się", ru: "состязаться" }
  - { pl: "ścigany przez policję", ru: "разыскиваемый полицией" }
family:
  - { pl: "wyścig", ru: "гонка", relation: root, id: wyscig }
  - { pl: "gonić", ru: "гнать, гнаться", relation: root }
  - { pl: "policja", ru: "полиция", relation: root, id: policja }
etymology: "От ścigać, того же корня, что wyścig «гонка» и русское «стигать» в «настигать», «достигать». Образ один: догонять."
memory: "ścigać — «преследовать, гнаться», но прямо с винительным падежом, без предлога: pies ścigał kota. Возвратное ścigać się — «состязаться»."
idioms:
  - { pl: "kto ściga dwa zające, nie złapie żadnego", ru: "за двумя зайцами погонишься, ни одного не поймаешь" }
  - { pl: "ścigać się", ru: "состязаться" }
  - { pl: "ścigany przez policję", ru: "разыскиваемый полицией" }
