  - form: "ścigają"
    pl: "Ścigają złodzieja."
    ru: "Они преследуют вора."
    source: { kind: translated, id: 2395867 }
  - form: "ścigają"
    pl: "Ścigają go od tygodnia."
    ru: "Его преследуют уже неделю."
    source: { kind: authored }
  - form: "ścigają"
    pl: "Dzieci ścigają się po podwórku."
    ru: "Дети носятся наперегонки по двору."
    source: { kind: authored }
  - form: "ścigali"
    pl: "Ścigali go, by go aresztować."
    ru: "Они преследовали его, чтобы арестовать."
    source: { kind: translated, id: 696424 }
  - form: "ścigali"
    pl: "Nie chcę, żeby ci goście mnie ścigali."
