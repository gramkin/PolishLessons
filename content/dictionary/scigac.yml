formExamples:
  - form: "ściga"
    pl: "Ściga mnie policja."
    ru: "Меня преследует полиция."
    source: { kind: translated, id: 6554312 }
  - form: "ściga"
    pl: "Kto ściga dwa zające, nie złapie żadnego."
    ru: "Кто гонится за двумя зайцами, не поймает ни одного."
    source: { kind: translated, id: 567123 }
  - form: "ściga"
    pl: "Pies ściga rowerzystę."
    ru: "Собака гонится за велосипедистом."
    source: { kind: authored }
  - form: "ścigają"
    pl: "Ścigają złodzieja."
    ru: "Они преследуют вора."
    source: { kind: translated, id: 2395867 }
  - form: "ścigają"
    pl: "Ścigają go od tygodnia."
    ru: "Его преследуют уже неделю."
    source: { kind: authored }
  - form: "ścigają"
    pl: "Dzieci ścigają się po podwórku."
    ru: "Дети носятся наперегонки по двору."
    source: { kind: authored }
  - form: "ścigali"
    pl: "Ścigali go, by go aresztować."
    ru: "Они преследовали его, чтобы арестовать."
    source: { kind: translated, id: 696424 }
  - form: "ścigali"
    pl: "Nie chcę, żeby ci goście mnie ścigali."
    ru: "Я не хочу, чтобы эти типы меня преследовали."
    source: { kind: translated, id: 10756646 }
  - form: "ścigali"
    pl: "Ścigali złodzieja przez całe miasto."
    ru: "Они гнались за вором через весь город."
    source: { kind: authored }
  - form: "ścigał"
    pl: "Tom ścigał włamywacza."
    ru: "Том гнался за взломщиком."
    source: { kind: translated, id: 10593271 }
  - form: "ścigał"
    pl: "Pies ścigał kota aż na czubek drzewa."
    ru: "Собака гналась за котом до самой верхушки дерева."
    source: { kind: translated, id: 921369 }
  - form: "ścigał"
    pl: "Pies w zapamiętaniu ścigał niedźwiedzia."
    ru: "Пёс самозабвенно гнался за медведем."
    source: { kind: translated, id: 410313 }
  - form: "ścigała"
    pl: "Policja ścigała skradziony pojazd autostradą."
    ru: "Полиция преследовала угнанный автомобиль по автостраде."
    source: { kind: translated, id: 751753 }
  - form: "ścigała"
    pl: "Kamera ścigała go przez cały bieg."
    ru: "Камера следовала за ним весь забег."
    source: { kind: authored }
  - form: "ścigała"
    pl: "Ścigała go myśl o porażce."
    ru: "Его преследовала мысль о поражении."
    source: { kind: authored }
  - form: "ścigałem"
    pl: "Ścigałem się z nim."
    ru: "Я состязался с ним."
    source: { kind: translated, id: 359758 }
  - form: "ścigałem"
    pl: "Ścigałem się z bratem."
    ru: "Я состязался с братом."
    source: { kind: authored }
  - form: "ścigałem"
    pl: "Nigdy nikogo nie ścigałem."
    ru: "Я никогда никого не преследовал."
    source: { kind: authored }
