# review
id: odczepic
format: 2
lemma: "odczepić"
rank: 4082
pos: verb
pron: { cyr: "одче́пиць" }
senses:
  - id: unhook
    ru: "отцепить, отстегнуть"
    examples:
      - pl: "Odczepił przyczepę od samochodu."
        ru: "Он отцепил прицеп от машины."
        source: { kind: authored }
      - pl: "Odczep psa, niech pobiega."
        ru: "Отстегни собаку, пусть побегает."
        source: { kind: authored }
      - pl: "Odczepili ostatni wagon."
        ru: "Они отцепили последний вагон."
        source: { kind: authored }
  - id: leave-alone
    ru: "разг. с SIĘ — отвязаться, отстать"
    examples:
      - pl: "Odczep się ode mnie!"
        ru: "Отстань от меня!"
        source: { kind: authored }
      - pl: "Wreszcie się ode mnie odczepił."
        ru: "Наконец он от меня отвязался."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ODCZEPIĆ — «отцепить», как в русском. ODCZEP SIĘ! — грубоватое «отстань!», как русское «отцепись!». Вежливее — DAJ MI SPOKÓJ. Отстегнуть ремень — ODPIĄĆ, а не ODCZEPIĆ." }
  - { kind: usage, text: "Пятьдесят две формы: страдательное ODCZEPIONY — о вагонах, прицепах, лодках; форма для мужчин-людей ODCZEPIENI в карточку не включена. Будущее: ODCZEPIĘ, ODCZEPISZ, повелительное ODCZEP. Несовершенный вид — ODCZEPIAĆ." }
  - { kind: government, text: "Что — винительный, от чего — OD с родительным: ODCZEPIĆ WAGON OD POCIĄGU. Откуда — Z с родительным: ODCZEPIĆ PSA ZE SMYCZY. С SIĘ — OD с родительным: ODCZEPIĆ SIĘ OD KOGOŚ." }
  - { kind: pronunciation, text: "Читается «одче́пиць»: DCZ — «дч», ударение на предпоследнем слоге. ODCZEPIĘ — «одче́пье», ODCZEP — «о́дчеп»." }
  - { kind: register, text: "В прямом смысле — нейтральное, техническое. ODCZEP SIĘ — разговорное и резкое. ODCZEPIĆ SIĘ OD TEMATU — разговорное «оставить тему в покое»." }
collocations:
  - { pl: "odczepić przyczepę", ru: "отцепить прицеп" }
  - { pl: "odczepić wagon", ru: "отцепить вагон" }
  - { pl: "odczepić się od kogoś", ru: "отстать от кого-то" }
family:
  - { pl: "czepiać się", ru: "цепляться, придираться", relation: root }
  - { pl: "przyczepić", ru: "прицепить", relation: derived }
  - { pl: "odczepiać", ru: "отцеплять", relation: aspect }
etymology: "Приставка OD- «от-» плюс CZEPIĆ «цеплять», праславянское *čepiti. Русское «отцепить», «цепляться» — то же гнездо."
memory: "Odczepić — отцепить: odczepił przyczepę. Odczep się! — отстань! Читается «одче́пиць»."
idioms:
  - { pl: "odczep się ode mnie!", ru: "отстань от меня!, отвяжись!" }
formExamplesSkip:
  - { form: "odczepieni", reason: "людей не отцепляют: формы для мужчин-людей нет" }
