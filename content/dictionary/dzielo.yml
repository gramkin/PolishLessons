# review
id: dzielo
format: 2
lemma: "dzieło"
rank: 1540
pos: noun
pron: { cyr: "дзе́уо" }
senses:
  - id: work-of-art
    ru: "произведение, труд, творение"
    examples:
      - pl: "To prawdziwe dzieło sztuki."
        ru: "Это настоящее произведение искусства."
        source: { kind: translated, id: 3744873 }
      - pl: "Mam komplet dzieł Szekspira."
        ru: "У меня есть полное собрание сочинений Шекспира."
        source: { kind: translated, id: 365161 }
      - pl: "Poeta umarł młodo, ale jego dzieła przetrwały stulecia."
        ru: "Поэт умер молодым, но его произведения пережили столетия."
        source: { kind: translated, id: 6304329 }
  - id: deed
    ru: "дело, результат чьих-либо действий"
    examples:
      - pl: "To odkrycie jest dziełem przypadku."
        ru: "Это открытие — дело случая."
        source: { kind: translated, id: 831735 }
      - pl: "Do dzieła."
        ru: "За дело."
        source: { kind: translated, id: 442926 }
notes:
  - { kind: false-friend, text: "Этимологически это то же слово, что русское «дело», но значение сузилось: dzieło — «произведение, труд», а обычное «дело» по-польски sprawa или rzecz." }
  - { kind: usage, text: "dzieło sztuki — «произведение искусства», самое частое сочетание." }
  - { kind: usage, text: "Do dzieła! — «За дело!», призыв приниматься за работу." }
  - { kind: usage, text: "Не путайте на письме dzieło «произведение», działo «орудие, пушка» и dział «раздел»." }
collocations:
  - { pl: "dzieło sztuki", ru: "произведение искусства" }
  - { pl: "do dzieła", ru: "за дело" }
  - { pl: "dzieła zebrane", ru: "собрание сочинений" }
etymology: "От działać «действовать», праславянское *dělo «дело». Русское «дело» — то же самое слово, но польское сузило значение до «произведение, труд»."
memory: "dzieło — «произведение, труд», а не просто «дело», хотя слово этимологически то же самое. Главное сочетание — dzieło sztuki «произведение искусства». А Do dzieła! значит «За дело!»."
idioms:
  - { pl: "dzieło sztuki", ru: "произведение искусства" }
  - { pl: "do dzieła", ru: "за дело" }
  - { pl: "koniec wieńczy dzieło", ru: "конец венчает дело" }
