# review
id: obronic
format: 2
lemma: "obronić"
rank: 5226
pos: verb
pron: { cyr: "обро́ниць" }
senses:
  - id: defend
    ru: "защитить, отстоять"
    examples:
      - pl: "Żołnierze obronili miasto."
        ru: "Солдаты отстояли город."
        source: { kind: authored }
      - pl: "Obroniła się przed napastnikiem."
        ru: "Она защитилась от нападавшего."
        source: { kind: authored }
      - pl: "Adwokat obronił klienta przed sądem."
        ru: "Адвокат защитил клиента в суде."
        source: { kind: authored }
  - id: save-defend
    ru: "отбить (мяч); защитить (диплом, диссертацию)"
    examples:
      - pl: "Bramkarz obronił rzut karny."
        ru: "Вратарь отбил пенальти."
        source: { kind: authored }
      - pl: "W czerwcu obroniła pracę magisterską."
        ru: "В июне она защитила магистерскую работу."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "OBRONIĆ — «защитить, отстоять», и русское «оборонить» — то же слово. Польское шире: OBRONIĆ PRACĘ MAGISTERSKĄ — «защитить диплом», а в футболе OBRONIĆ KARNEGO — «отбить пенальти». OBRONIĆ SIĘ — «защититься, отбиться»: OBRONIĆ SIĘ PRZED ZARZUTAMI." }
  - { kind: usage, text: "Пятьдесят три формы — подпись переходного глагола совершенного вида: страдательное OBRONIONY и деепричастие OBRONIWSZY. Повелительное OBROŃ — с мягким Ń. Видовой партнёр — BRONIĆ: BRONIĆ OJCZYZNY, с родительным!" }
  - { kind: government, text: "Кого или что — винительный: OBRONIĆ MIASTO, TYTUŁ, PRACĘ. От кого — PRZED с творительным: OBRONIĆ PRZED WROGIEM. Внимание: несовершенный BRONIĆ требует родительного: BRONIĆ KRAJU, а совершенный OBRONIĆ — винительного: OBRONIĆ KRAJ." }
  - { kind: pronunciation, text: "Читается «обро́ниць», три слога, ударение на предпоследнем. Оба O ясные, без «а». NI — мягкое «ни», конечное Ć — «ць». OBROŃ — «о́бронь»." }
  - { kind: register, text: "Нейтральное слово: война, суд, спорт, университет. OBRONIĆ TYTUŁ MISTRZA — «отстоять чемпионский титул». OBRONA PRACY — «защита диплома», важное событие в жизни польского студента." }
collocations:
  - { pl: "obronić miasto", ru: "отстоять город" }
  - { pl: "obronić pracę magisterską", ru: "защитить магистерскую работу" }
  - { pl: "obronić tytuł", ru: "отстоять титул" }
family:
  - { pl: "bronić", ru: "защищать", relation: aspect, id: bronic }
  - { pl: "obrona", ru: "оборона, защита", relation: derived, id: obrona }
  - { pl: "obrońca", ru: "защитник", relation: derived, id: obronca }
etymology: "Приставка O- плюс BRONIĆ «защищать», праславянское *borniti, то же, что русское «оборонить», «оборона». Польское -RO- на месте русского «-оро-»: BRONIĆ и «боронить»."
memory: "Obronić — защитить, отстоять: obronić miasto (винительный). Bronić — с родительным! Obronić pracę — защитить диплом, obronić karnego — отбить пенальти. Читается «обро́ниць»."
idioms:
  - { pl: "obronić się przed zarzutami", ru: "отбиться от обвинений" }
