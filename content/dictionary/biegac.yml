        source: { kind: authored }
  - id: jog
    ru: "бегать, заниматься бегом"
    examples:
      - pl: "Biegam co rano w parku."
        ru: "Я бегаю каждое утро в парке."
        source: { kind: authored }
      - pl: "Biegają razem od dziesięciu lat."
        ru: "Они бегают вместе десять лет."
        source: { kind: authored }
  - id: running
    ru: "bieganie — бег, беготня"
    examples:
      - pl: "Bieganie po urzędach zajęło mu tydzień."
        ru: "Беготня по учреждениям заняла у него неделю."
        source: { kind: authored }
      - pl: "Bieganie dobrze robi na serce."
        ru: "Бег полезен для сердца."
        source: { kind: authored }
notes:
  - { kind: usage, text: "ЦЕЛАЯ КАТЕГОРИЯ, КОТОРАЯ У ВАС УЖЕ ЕСТЬ. Польский делит глаголы движения ровно так же, как русский. Biegać — «бегать», туда-сюда и не раз; biec — «бежать», один раз и в одну сторону. Та же пара в chodzić/iść («ходить/идти»), jeździć/jechać («ездить/ехать»), latać/lecieć («летать/лететь»). Правило выбора у поляка и русского одно и то же, так что переносите его из родного языка целиком." }
  - { kind: false-friend, text: "Прямое родство с русским «бегать», и значение то же. Из того же гнезда bieg «бег», biegacz «бегун», biegły «сведущий, искусный» — последнее по-русски звучало бы как «набивший руку», и его стоит запомнить отдельно: biegły w prawie значит «сведущий в праве», а biegły sądowy — «судебный эксперт»." }
  - { kind: government, text: "Бегают ПО чему — предлог po с предложным: biegać po lesie, po schodach, po urzędach. За кем-то — za с творительным: biegać za kimś. Оба совпадают с русским, включая переносное biegać za kimś «бегать за кем-то», то есть добиваться." }
  - { kind: register, text: "Разговорное biegać po urzędach значит «обивать пороги», ходить по инстанциям, и звучит так же устало, как русская «беготня». Нейтральный синоним — załatwiać sprawy." }
collocations:
  - { pl: "biegać po lesie", ru: "бегать по лесу" }
  - { pl: "biegać za kimś", ru: "бегать за кем-л." }
  - { pl: "bieganie po urzędach", ru: "беготня по инстанциям" }
family:
  - { pl: "biec", ru: "бежать (в одну сторону)", relation: aspect, id: biec }
  - { pl: "bieg", ru: "бег", relation: root, id: bieg }
  - { pl: "biegacz", ru: "бегун", relation: derived }
etymology: "Общеславянский корень *běg-, тот же, что в русских «бег», «бегать», «бежать», «беглец». Польское biegać и русское «бегать» — одно слово, различающееся только огласовкой be-/бе-. Пара biegać/biec в точности повторяет русскую «бегать/бежать»."
memory: "biegać — «бегать», и важно не само слово, а пара: biegać значит «бегать» (туда-сюда, не раз), а biec — «бежать» (один раз, в одну сторону). Выбирают между ними так же, как между русскими «ходить/идти» и «ездить/ехать»."
idioms:
