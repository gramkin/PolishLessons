etymology: "Из праславянского *ovьca, уменьшительного образования от более старого *ovь «овца», которое восходит к индоевропейскому *owis — тому же корню, что латинское OVIS, греческое OIS и английское EWE. То есть и польское, и русское слово содержат суффикс -ьca, присоединённый к давно исчезнувшей простой основе: язык назвал овцу «овечкой» и забыл, как называл её прежде. След исходной основы остался в прилагательном OWCZY «овечий» и в OWCZAREK, где суффикс другой. Беглое E в родительном множественном OWIEC — это на месте упавшего еря: гласный исчез в большинстве форм, но вернулся там, где иначе столкнулись бы три согласных. Русское «овец» получилось точно так же и из того же звука, поэтому две формы совпадают почти полностью."
memory: "Полное соответствие русской «овце», та же праславянская основа с суффиксом -ьca от исчезнувшего *ovь (лат. ovis, англ. ewe). Ударение польское, на первом слоге: «о́вца». Форма owcy делает сразу три падежа: родительный, дательный и местный единственного. Родительный множественного owiec с беглым e — ровно как русское «овец», из того же упавшего еря. Овчарка — owczarek, мужского рода. Поговорка: czarna owca это «паршивая овца»."
idioms:
  - { pl: "czarna owca", ru: "паршивая овца, позор семьи" }
