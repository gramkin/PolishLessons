notes:
  - { kind: false-friend, text: "Слово и значение совпадают с русской «овцой», корень общий. Ловушек три, и все в деталях. Первая — ударение: по-польски на первом слоге, О-wca, по-русски на последнем, ов-ЦА. Вторая — овчарка: по-польски OWCZAREK, мужского рода и с уменьшительным суффиксом, OWCZAREK NIEMIECKI «немецкая овчарка», так что согласования меняются целиком. Третья — поговорка: польское CZARNA OWCA отвечает русскому «паршивая овца», а дословная «чёрная овца» по-русски не говорится. Баран — BARAN, ягнёнок — JAGNIĘ, и оба слова русскому понятны без перевода." }
  - { kind: usage, text: "Десять форм, женский род, основа на -C. Самое важное: форма OWCY несёт сразу три падежа единственного числа — родительный, дательный и местный: WEŁNA OWCY «шерсть овцы», OWCY BRAKOWAŁO «овце не хватало», NA OWCY «на овце». Такое тройное совмещение обычно для женских слов на -CA и -JA. Именительный и винительный множественного — OWCE. Родительный множественного — OWIEC, где между W и C появляется беглое E, которого нет в основе. Русский делает в этой форме то же самое: «овца» даёт «овец», тоже со вставным гласным, и потому запомнить её легко." }
  - { kind: pronunciation, text: "Читается «о́вца», два слога, ударение на первом — не так, как в русском. Сочетание WC произносится «вц» слитно. В форме OWCĘ конечное Ę звучит как чистое «э», по общему правилу для конца слова: «о́вцэ». В форме OWCĄ последнее Ą даёт «он»: «о́вцон». В форме OWIEC буквосочетание WIE читается «ве» с мягким W: «о́вец», и здесь польское слово звучит почти как русское «овец», только с другим ударением." }
  - { kind: register, text: "В прямом значении слово нейтральное и деревенское, частое в горных районах: HODOWLA OWIEC, STADO OWIEC, WEŁNA Z OWIEC. В переносном — пренебрежительное: об овцах говорят, когда толпа идёт за кем-то не думая, и назвать человека OWCA значит обругать его безвольным. Устойчивое CZARNA OWCA о члене семьи, который всех опозорил, употребляется часто и без грубости. Детское LICZYĆ OWCE «считать овец» перед сном — то же самое, что по-русски. Звательная форма OWCO встречается в сказках и в ругани." }
