# review
id: odrzucac
format: 2
lemma: "odrzucać"
rank: 4274
pos: verb
pron: { cyr: "оджу́цаць" }
senses:
  - id: reject
    ru: "отвергать, отклонять"
    examples:
      - pl: "Odrzucam twoją propozycję."
        ru: "Я отклоняю твоё предложение."
        source: { kind: authored }
      - pl: "Sąd odrzuca apelację."
        ru: "Суд отклоняет апелляцию."
        source: { kind: authored }
      - pl: "Firma odrzuca większość kandydatów."
        ru: "Фирма отсеивает большинство кандидатов."
        source: { kind: authored }
  - id: repel
    ru: "отталкивать, вызывать отвращение (разг.); отбрасывать"
    examples:
      - pl: "Ten zapach mnie odrzuca."
        ru: "Меня отталкивает этот запах."
        source: { kind: authored }
      - pl: "Dzieci odrzucają piłkę do siebie."
        ru: "Дети бросают мяч друг другу."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ODRZUCAĆ — «отвергать, отклонять», а не просто «отбрасывать». Разговорное TO MNIE ODRZUCA значит «меня от этого воротит». Отказ на заявку — ODRZUCENIE WNIOSKU, «отказать» человеку — ODMÓWIĆ." }
  - { kind: usage, text: "Несовершенный вид; совершенный — ODRZUCIĆ. Спряжение на -AM: ODRZUCAM, ODRZUCASZ, ODRZUCAJĄ. Мужско-личное страдательное ODRZUCANI — «отвергнутые»: ODRZUCANI KANDYDACI." }
  - { kind: government, text: "Что, кого — винительный: ODRZUCAĆ OFERTĘ, KANDYDATA. С отрицанием — родительный: NIE ODRZUCA POMOCY. Куда — DO с родительным или NA с винительным: ODRZUCAĆ PIŁKĘ DO KOLEGI." }
  - { kind: pronunciation, text: "Читается «оджу́цаць»: DRZ — «дж», ударение на предпоследнем слоге. ODRZUCAM — «оджу́цам»." }
  - { kind: register, text: "Нейтральное слово, частое в официальной речи: ODRZUCAĆ WNIOSEK, PROJEKT USTAWY. Разговорное ODRZUCA MNIE — эмоциональное." }
collocations:
  - { pl: "odrzucać propozycję", ru: "отклонять предложение" }
  - { pl: "odrzucać wniosek", ru: "отклонять заявку" }
  - { pl: "to mnie odrzuca", ru: "меня от этого воротит" }
family:
  - { pl: "odrzucić", ru: "отвергнуть", relation: aspect, id: odrzucic }
  - { pl: "przyjmować", ru: "принимать", relation: antonym, id: przyjmowac }
  - { pl: "rzucać", ru: "бросать", relation: root, id: rzucac }
etymology: "Приставка OD- «от-» плюс RZUCAĆ «бросать»: буквально «отбрасывать». Русское «отринуть» — близкий образ, но другого корня."
memory: "Odrzucać — отклонять: odrzucam propozycję. To mnie odrzuca — меня воротит. Od + rzucać — «отбрасывать»."
idioms:
  - { pl: "odrzucać coś z góry", ru: "отвергать что-то с порога" }
