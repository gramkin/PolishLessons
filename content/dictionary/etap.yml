etymology: "Из французского ÉTAPE, которое идёт от средненидерландского STAPEL «склад, складочное место», родственного немецкому STAPEL и английскому STAPLE. Исходно это был пункт, где войско получало припасы на марше, то есть именно остановка в пути, а уже от неё — отрезок между остановками и затем стадия любого дела. Русский взял слово из того же французского источника и в том же военном значении, но развил его дальше в сторону конвоя и пересылки арестантов, откуда «идти по этапу», и этого шага польский не сделал. Поэтому у двух слов общее происхождение, общее основное значение и одно лишнее значение у русского, которого в польском нет."
memory: "Как русский «этап», но уже: значения «пересылка арестантов» у польского слова нет — это konwój или transport więźniów. Ударение расходится: польское э́тап на первом слоге против русского эта́п на втором, а в местном падеже etapie оно переходит на второй. Na tym etapie — «на этом этапе». Из французского étape, а до того нидерландское stapel «склад»: исходно место остановки войска на марше."
idioms:
