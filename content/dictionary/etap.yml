notes:
  - { kind: false-friend, text: "Слово то же, что русский «этап», и в основном значении они совпадают: ETAP PRAC «этап работ», NA TYM ETAPIE «на этом этапе», ETAP GÓRSKI «горный этап». Но у русского есть значение, которого в польском нет вовсе: «этап» как пересылка арестантов, «идти по этапу», «этапом». По-польски это передаётся совсем иначе, через KONWÓJ или TRANSPORT WIĘŹNIÓW, и слово ETAP здесь не годится ни в каком падеже. Так что сужение идёт в сторону русского: польское слово узкее. Второе отличие на слух: ударение. Польское Э́ТАП падает на первый слог, русское ЭТА́П — на второй, и привычка переносится легко." }
  - { kind: government, text: "Мужской род, неодушевлённое. Винительный равен именительному: ZAKOŃCZYĆ ETAP. Родительный на -U: BEZ ETAPU, DO ETAPU. Местный ETAPIE, где P смягчается перед -IE, и это главная форма: NA TYM ETAPIE «на этом этапе». Польский берёт здесь предлог NA с местным, как и русский. Порядковое определение ставится после: ETAP PIERWSZY, ETAP DRUGI, хотя PIERWSZY ETAP тоже правильно. Чего этап — родительный без предлога: ETAP PRAC, ETAP WYŚCIGU. Родительный множественного ETAPÓW." }
  - { kind: pronunciation, text: "Читается «э́тап», ударение на предпоследнем слоге из двух, то есть на первом — и в этом главное расхождение с русским «эта́п». Начальное E звучит как чистое «э», без призвука. В местном падеже ETAPIE буква P смягчается и звучит «пе»: «эта́пе», слогов становится три, и ударение по правилу переходит на предпоследний, то есть на второй. Получается, что в именительном ударение на первом слоге, а в местном на втором, и обе формы надо держать в голове отдельно." }
  - { kind: usage, text: "Частотные сочетания: NA TYM ETAPIE «на этом этапе», ETAP PRZEJŚCIOWY «переходный этап», ETAP WSTĘPNY «предварительный этап», ETAPAMI «этапами, поэтапно», PO ETAPACH то же самое. Прилагательное ETAPOWY употребляется редко, вместо него берут родительный. В спортивном языке ETAP это отрезок многодневной гонки, и выражение WYGRAĆ ETAP «выиграть этап» слышно каждое лето. Наречный оборот ETAPAMI отвечает русскому «поэтапно» и строится творительным множественного без предлога — тем же приёмом, что ŚRODAMI и PIĄTKAMI." }
