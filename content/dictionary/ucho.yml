notes:
  - { kind: usage, text: "Множественное число супплетивное: ucho, но uszy, uszu, uszach, uszami, uszom. Основа меняется целиком, как в русском «ухо — уши»." }
  - { kind: usage, text: "Польский входит в крошечный класс слов с таким чередованием: ucho — uszy, oko — oczy, ręka — ręce. Эти три слова стоит запомнить вместе." }
  - { kind: usage, text: "nie wierzyć własnym uszom «не верить своим ушам» — с дательным падежом, как и в русском." }
  - { kind: usage, text: "Второе значение — «ушко, ручка»: ucho igły «ушко иглы», ucho kubka «ручка кружки»." }
collocations:
  - { pl: "boli mnie ucho", ru: "у меня болит ухо" }
  - { pl: "dzwoni mi w uszach", ru: "у меня звенит в ушах" }
  - { pl: "nie wierzyć uszom", ru: "не верить ушам" }
  - { pl: "wpadać w ucho", ru: "легко запоминаться" }
family:
