  - { pl: "ręka", ru: "рука", relation: root, id: reka }
  - { pl: "słuchać", ru: "слушать", relation: derived }
etymology: "Праславянское *ucho — то же слово, что русское «ухо», и множественное число в обоих языках берёт другую основу: uszy, «уши»."
memory: "ucho — «ухо», но множественное от другой основы: uszy, uszu, uszach. Польский держит тот же крошечный класс, что и русский: ucho — uszy, oko — oczy, ręka — ręce."
idioms:
  - { pl: "nie wierzyć własnym uszom", ru: "не верить своим ушам" }
  - { pl: "dzwoni mi w uszach", ru: "у меня звенит в ушах" }
  - { pl: "wpadać w ucho", ru: "легко запоминаться" }
  - { pl: "od ucha do ucha", ru: "до ушей" }
