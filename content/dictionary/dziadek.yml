# review
id: dziadek
format: 2
lemma: "dziadek"
rank: 879
pos: noun
pron: { cyr: "дзя́дэк" }
senses:
  - id: grandfather
    ru: "дедушка"
    examples:
      - pl: "To mój dziadek."
        ru: "Это мой дедушка."
        source: { kind: tatoeba, id: 10695791 }
      - pl: "Ile twój dziadek ma lat?"
        ru: "Сколько лет твоему дедушке?"
        source: { kind: tatoeba, id: 1548177 }
      - pl: "Mój dziadek lubi spacerować."
        ru: "Мой дедушка любит гулять."
        source: { kind: tatoeba, id: 393346 }
  - id: grandparents
    ru: "dziadkowie — дедушка с бабушкой, прародители"
    note: "Множественное число покрывает обоих сразу, как państwo покрывает пару."
    examples:
      - pl: "To są moi dziadkowie."
        ru: "Это мои дедушка с бабушкой."
        source: { kind: tatoeba, id: 10695790 }
      - pl: "Jego dziadkowie są ze Śląska."
        ru: "Его дедушка с бабушкой из Силезии."
        source: { kind: translated, id: 2246965 }
      - pl: "Dzieci kochają swoje babcie i dziadków, bo niczego im nie odmawiają."
        ru: "Дети любят бабушек и дедушек, потому что они ни в чём им не отказывают."
        source: { kind: tatoeba, id: 12727090 }
  - id: vocative
    ru: "dziadku! — обращение к дедушке"
    examples:
      - pl: "Cześć dziadku."
        ru: "Привет, дедушка."
        source: { kind: translated, id: 1205989 }
      - pl: "Bez wątpienia dostał imię po dziadku."
        ru: "Несомненно, его назвали в честь деда."
        source: { kind: translated, id: 745434 }
      - pl: "Opowiedz dziadkowi wiersz, którego się nauczyłeś."
        ru: "Ну, расскажи дедушке стихотворение, которое ты выучил."
        source: { kind: tatoeba, id: 12907223 }
notes:
  - { kind: usage, text: "Множественное dziadkowie значит не только «дедушки», но и «дедушка с бабушкой» вместе — как русское «бабушка с дедушкой» одним словом. Moi dziadkowie «мои бабушка и дедушка»." }
  - { kind: usage, text: "Звательный падеж dziadku! употребляется живо: Cześć, dziadku! «Привет, дедушка!». В русском звательной формы нет, и про неё легко забыть." }
  - { kind: usage, text: "Прадед — pradziadek, а грубоватое dziad значит «старик, дед» и звучит пренебрежительно. Женская пара — babcia." }
  - { kind: usage, text: "dziadek do orzechów — «щелкунчик» (орехокол), отсюда и название балета. А gdyby babcia miała wąsy, toby była dziadkiem — «если бы да кабы»." }
collocations:
  - { pl: "mój dziadek", ru: "мой дедушка" }
  - { pl: "dziadkowie", ru: "бабушка с дедушкой" }
  - { pl: "dziadek do orzechów", ru: "щелкунчик" }
  - { pl: "pradziadek", ru: "прадед" }
family:
  - { pl: "dziad", ru: "дед, старик", relation: root }
  - { pl: "pradziadek", ru: "прадед", relation: derived }
  - { pl: "babcia", ru: "бабушка", relation: root, id: babcia }
etymology: "Уменьшительное от dziad «дед, старик», праславянское *dědъ. Русское «дед» — то же слово, а польское dziadek относится к нему как «дедушка» к «деду»."
memory: "dziadek — «дедушка». Главное запомнить множественное: dziadkowie значит не только «дедушки», но и «бабушка с дедушкой» вместе. И не забывайте звательный падеж — Cześć, dziadku! Грубоватое dziad значит «старик», а dziadek do orzechów — «щелкунчик»."
idioms:
  - { pl: "dziadkowie", ru: "бабушка с дедушкой" }
  - { pl: "dziadek do orzechów", ru: "щелкунчик" }
  - { pl: "gdyby babcia miała wąsy, toby była dziadkiem", ru: "если бы да кабы" }
