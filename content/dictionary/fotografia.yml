  - { pl: "aparat", ru: "фотоаппарат", relation: root, id: aparat }
etymology: "Из греческого PHŌS «свет» и GRAPHEIN «писать»: «светопись». Русское «фотография» — то же слово."
memory: "Fotografia — фотография как искусство; снимок в быту — zdjęcie. Na fotografii — на фотографии. Читается «фотогра́фья»."
