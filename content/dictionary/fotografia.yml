notes:
  - { kind: false-friend, text: "FOTOGRAFIA — и «фотография» как искусство, и «снимок», но снимок в быту чаще ZDJĘCIE: ZROBIĆ ZDJĘCIE, «сфотографировать». FOTOGRAFIA о снимке звучит книжно или профессионально. Разговорное — FOTKA." }
  - { kind: usage, text: "Женский род. Родительный, дательный и местный — FOTOGRAFII. Множественное — FOTOGRAFIE. Звательный и архаичное FOTOGRAFIJ не используем." }
  - { kind: government, text: "Заниматься фотографией — ZAJMOWAĆ SIĘ FOTOGRAFIĄ, творительный. На фотографии — NA FOTOGRAFII, местный. Выставка фотографий — WYSTAWA FOTOGRAFII." }
  - { kind: pronunciation, text: "Читается «фотогра́фья»: FIA — «фья», ударение на предпоследнем слоге." }
collocations:
  - { pl: "fotografia ślubna", ru: "свадебная фотография" }
  - { pl: "wystawa fotografii", ru: "фотовыставка" }
  - { pl: "stara fotografia", ru: "старая фотография" }
