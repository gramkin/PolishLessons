  - { pl: "niezdrowo", ru: "вредно, нездорово", relation: derived }
synonyms: ["szkodliwy", "chory", "chorobliwy"]
etymology: "Образовано приставкой NIE- от ZDROWY «здоровый», которое восходит к праславянскому прилагательному, давшему и русское «здоровый»."
memory: "Niezdrowy — прежде всего «вредный»: niezdrowe jedzenie, palenie jest niezdrowe. А краткое niezdrów — ровно русское «нездоров»: jestem niezdrów."
