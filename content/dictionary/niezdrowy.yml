        ru: "Лапша быстрого приготовления вредна для здоровья."
        source: { kind: translated, id: 351954 }
  - id: unwell
    ru: "нездоровый, болезненный (о человеке, его виде)"
    examples:
      - pl: "Miała bladą, niezdrową cerę."
        ru: "У неё был бледный, нездоровый цвет лица."
        source: { kind: authored }
      - pl: "Ojciec jest dziś niezdrów i nie przyjdzie."
        ru: "Отец сегодня нездоров и не придёт."
        source: { kind: authored }
  - id: unwholesome
    ru: "нездоровый, ненормальный (об отношениях, интересе)"
    examples:
      - pl: "W zespole panowała niezdrowa atmosfera."
        ru: "В коллективе царила нездоровая атмосфера."
        source: { kind: authored }
      - pl: "Z niezdrową ciekawością czytał o wypadku."
        ru: "С нездоровым любопытством он читал об аварии."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Главное значение польского слова — «вредный для здоровья»: NIEZDROWE JEDZENIE это «вредная еда», PALENIE JEST NIEZDROWE «курить вредно». Русский здесь чаще говорит «вредный», а «нездоровый» оставляет для вида человека и для переносного смысла. Оба этих значения у польского слова тоже есть: NIEZDROWA CERA «нездоровый цвет лица», NIEZDROWA ATMOSFERA, NIEZDROWA CIEKAWOŚĆ «нездоровое любопытство». Пишется слитно, как любое прилагательное с NIE-." }
  - { kind: register, text: "Есть краткая форма NIEZDRÓW, точно как русское «нездоров»: JESTEM NIEZDRÓW «я нездоров». Она бывает только в мужском роде единственного числа и только в сказуемом, звучит книжно и немного старомодно. Женского соответствия у краткой формы нет: женщина скажет JESTEM CHORA или ŹLE SIĘ CZUJĘ «я плохо себя чувствую»." }
  - { kind: usage, text: "Тридцать три полные формы — это одиннадцать клеток в трёх степенях: NIEZDROWY, NIEZDROWSZY «вреднее», NAJNIEZDROWSZY «самый вредный». Степени образуются от ZDROWY совершенно регулярно, и рядом с ними так же часто говорят описательно: BARDZIEJ NIEZDROWY. Тридцать четвёртая форма — краткая NIEZDRÓW." }
  - { kind: pronunciation, text: "Читается «нездро́вы»: NIE — «не», Y на конце — «ы». В сравнительной степени W оглушается перед SZ: NIEZDROWSZY звучит «нездро́фшы». В краткой форме всего два слога, и ударение по общему правилу встаёт на первый из них: NIEZDRÓW — «не́здруф», где Ó читается как «у», а конечное W оглушается в «ф»." }
