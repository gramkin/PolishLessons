# review
id: dodac
format: 2
lemma: "dodać"
rank: 1898
pos: verb
aspect: perf
pron: { cyr: "до́дачь" }
senses:
  - id: add
    ru: "добавить (положить, влить)"
    examples:
      - pl: "Muszę dodać wody do chłodnicy."
        ru: "Мне нужно долить воды в радиатор."
        source: { kind: translated, id: 5239856 }
      - pl: "Dodał mleko do swojej kawy."
        ru: "Он добавил молока в свой кофе."
        source: { kind: translated, id: 3033671 }
      - pl: "Dodaj trochę mleka."
        ru: "Добавь немного молока."
        source: { kind: translated, id: 760299 }
      - pl: "Dodałam soli do zupy."
        ru: "Я добавила соли в суп."
        source: { kind: translated, id: 3743760 }
      - pl: "Jak tylko woda zaczęła się gotować, dodała składniki."
        ru: "Как только вода закипела, она добавила ингредиенты."
        source: { kind: translated, id: 358941 }
      - pl: "Można dodać oleju sezamowego i przypraw."
        ru: "Можно добавить кунжутного масла и приправ."
        source: { kind: translated, id: 352648 }
  - id: add-say
    ru: "добавить (сказать в дополнение)"
    examples:
      - pl: "„Nie spiesz się” - dodał."
        ru: "Не спеши, добавил он."
        source: { kind: translated, id: 743145 }
      - pl: "Dodam tylko, że nie mam racji."
        ru: "Добавлю только, что я не прав."
        source: { kind: translated, id: 608208 }
      - pl: "Nie mam nic więcej do dodania."
        ru: "Мне больше нечего добавить."
        source: { kind: translated, id: 459103 }
  - id: encourage
    ru: "придать (смелости, бодрости)"
    examples:
      - pl: "Własny sukces dodał mu odwagi."
        ru: "Собственный успех придал ему смелости."
        source: { kind: translated, id: 771709 }
      - pl: "Twoje słowa dodały mu otuchy."
        ru: "Твои слова придали ему бодрости."
        source: { kind: translated, id: 1589315 }
      - pl: "Dodała mi otuchy, kiedy byłem przygnębiony."
        ru: "Она подбодрила меня, когда я был подавлен."
        source: { kind: translated, id: 450217 }
notes:
  - { kind: usage, text: "Совершенный вид к dodawać. Пара к карточке dać «дать»: do- + dać буквально «додать»." }
  - { kind: usage, text: "Устойчивое dodać komuś otuchy / odwagi значит «придать кому-то бодрости, смелости» — с родительным падежом." }
  - { kind: usage, text: "В арифметике dodać значит «прибавить», отсюда dodawanie «сложение»." }
  - { kind: false-friend, text: "Пословица Nic dodać, nic ująć — «Ни прибавить, ни убавить», в точности как по-русски." }
collocations:
  - { pl: "dodać soli", ru: "добавить соли" }
  - { pl: "dodać otuchy", ru: "придать бодрости" }
  - { pl: "nic dodać, nic ująć", ru: "ни прибавить, ни убавить" }
etymology: "do- + dać «дать» — буквально «додать». Русское «добавить» устроено похоже, но от другого глагола, «бавить»; ближайший русский двойник по составу — «додать»."
memory: "dodać — «добавить», совершенный вид к dodawać. Кроме кухни и арифметики помните dodać otuchy «придать бодрости» и пословицу Nic dodać, nic ująć."
idioms:
  - { pl: "nic dodać, nic ująć", ru: "ни прибавить, ни убавить" }
  - { pl: "dodać otuchy", ru: "придать бодрости" }
  - { pl: "dodać soli", ru: "добавить соли" }
