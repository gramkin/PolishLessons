# review
id: obczaic
format: 2
lemma: "obczaić"
rank: 5823
pos: verb
aspect: perf
pron: { cyr: "опча́иць" }
senses:
  - id: check-out
    ru: "заценить, посмотреть, разведать"
    note: "разг., молодёжн."
    examples:
      - pl: "Masz, obczaj to."
        ru: "На, зацени."
        source: { kind: translated, id: 12470377 }
      - pl: "Obczaj ten filmik, jest świetny!"
        ru: "Зацени этот ролик, он классный!"
        source: { kind: authored }
      - pl: "Obczaiłem nową knajpę na rogu."
        ru: "Я разведал новое кафе на углу."
        source: { kind: authored }
  - id: figure-out
    ru: "просечь, сообразить, раскусить"
    note: "разг., молодёжн."
    examples:
      - pl: "Szybko obczaił, o co chodzi."
        ru: "Он быстро просёк, в чём дело."
        source: { kind: authored }
      - pl: "Nauczycielka obczaiła, że ściągamy."
        ru: "Учительница просекла, что мы списываем."
        source: { kind: authored }
notes:
  - { kind: register, text: "Молодёжный сленг, в официальной речи неуместен. Нейтральные замены: SPRAWDZIĆ, ZOBACZYĆ «посмотреть», ZORIENTOWAĆ SIĘ «сообразить», ROZGRYŹĆ «раскусить». OBCZAJ TO! — почти точное «зацени!»." }
  - { kind: usage, text: "Совершенный вид; несовершенный — OBCZAJAĆ. Перед гласной окончания I переходит в J: OBCZAJĘ, OBCZAJĄ, повелительное OBCZAJ!, причастие OBCZAJONY. Настоящего времени нет: OBCZAJĘ — «разузнаю, заценю»." }
  - { kind: government, text: "Что — винительный: OBCZAIĆ TEMAT, OBCZAIĆ KNAJPĘ. Часто с придаточным: OBCZAIĆ, ŻE… / CO… / GDZIE…: obczaj, gdzie jest wyjście." }
  - { kind: pronunciation, text: "B перед глухим CZ оглушается: «опча́иць». AI — два слога, «а-и», ударение на A: OBCZAIŁ — «опча́иу»." }
collocations:
  - { pl: "obczaić nowy lokal", ru: "разведать новое заведение" }
  - { pl: "obczaić sytuację", ru: "оценить обстановку" }
  - { pl: "obczaj to!", ru: "зацени!" }
family:
  - { pl: "czaić", ru: "таиться; разг. понимать", relation: root, id: czaic }
  - { pl: "obczajać", ru: "разузнавать, заценивать", relation: aspect }
  - { pl: "zaczaić się", ru: "притаиться, подкараулить", relation: root }
etymology: "Приставка OB- плюс CZAIĆ, которое в сленге значит «понимать, соображать», а в литературном языке — «таиться, выжидать»."
memory: "Obczaić — обойти и высмотреть, как кот, который czai się в траве. Obczaj to! — «зацени!»."
idioms:
  - { pl: "obczaić temat", ru: "разнюхать, что к чему" }
