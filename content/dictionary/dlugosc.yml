notes:
  - { kind: false-friend, text: "Русский различает здесь два слова, польский обходится одним, и так же устроена вторая пара. DŁUGOŚĆ значит и «длина», и «долгота»: DŁUGOŚĆ KABLA — длина, DŁUGOŚĆ GEOGRAFICZNA — долгота. Точно так же SZEROKOŚĆ значит и «ширина», и «широта». Прилагательное GEOGRAFICZNA — единственное, что их различает, и в географическом тексте его не опускают. Отдельно стоит запомнить, что DŁUGOŚĆ FALI это «длина волны», обычное радиотехническое выражение." }
  - { kind: usage, text: "Шесть форм, и это весь разряд женских существительных на -OŚĆ. Устроен он просто: именительный и винительный совпадают, DŁUGOŚĆ, а родительный, дательный и предложный единственного числа совпадают с именительным множественного, DŁUGOŚCI. Отдельно стоят только творительный DŁUGOŚCIĄ и три формы множественного. Суффикс -OŚĆ отвечает русскому -ОСТЬ почти без исключений, и образует он отвлечённые существительные от прилагательных: DŁUGI даёт DŁUGOŚĆ, как «долгий» даёт «долгота»." }
  - { kind: government, text: "Чего длина — родительный без предлога: DŁUGOŚĆ KABLA, DŁUGOŚĆ RZEKI, как по-русски. Но мера выражается иначе, и это главная поправка: POKÓJ MA CZTERY METRY DŁUGOŚCI, где само слово стоит в родительном, тогда как русский говорит «четыре метра в длину», через предлог и винительный. Протяжённость целиком — NA CAŁEJ DŁUGOŚCI с предложным: NA CAŁEJ DŁUGOŚCI TRASY «по всей длине маршрута»." }
  - { kind: pronunciation, text: "Читается «ду́угосьчь», два слога, ударение на первом. Начало слова требует внимания: Ł даёт «у», а следующая U — тоже «у», поэтому слышно два «у» подряд, «дуу», и чтение «длугость» будет ошибкой. Конечное -ŚĆ — это два мягких звука подряд, «сьчь», и произносятся они слитно, без гласной между ними. В прилагательном DŁUGI слышно «ду́уги»." }
  - { kind: register, text: "Слово нейтральное: измерения, техника, география. Частые обороты: DŁUGOŚĆ GEOGRAFICZNA «долгота», DŁUGOŚĆ FALI «длина волны», NA CAŁEJ DŁUGOŚCI «по всей длине», MIEĆ DWA METRY DŁUGOŚCI. Прилагательное DŁUGI значит «длинный» о предмете и «долгий» о времени сразу: DŁUGI STÓŁ «длинный стол», DŁUGI DZIEŃ «долгий день». Русский развёл эти два смысла по разным словам, и это стоит держать в голове." }
