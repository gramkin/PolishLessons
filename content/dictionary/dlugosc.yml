etymology: "От прилагательного DŁUGI, от праславянского *dьlgъ, то есть от того же слова, что русское «долгий». Суффикс -OŚĆ отвечает русскому -ОСТЬ, так что DŁUGOŚĆ и «долгота» собраны из одинаковых частей. Расходятся языки в том, как они поделили смысл прилагательного: польский оставил DŁUGI и для предмета, и для времени, а русский развёл «длинный» и «долгий» по двум словам от одного корня. Отсюда и то, что одно польское существительное покрывает русские «длину» и «долготу». Из того же гнезда DŁUGO «долго» и PRZEDŁUŻYĆ «продлить»."
memory: "Одно слово на два русских: длина и долгота, различает только прилагательное geograficzna. Та же пара у szerokość, ширина и широта. Шесть форм, и это весь разряд на -ość: суффикс отвечает русскому -ость. Поправить меру: pokój ma cztery metry DŁUGOŚCI, родительный, где русский говорит «в длину». И помнить, что długi значит сразу «длинный» и «долгий», русский развёл это по двум словам. Читается «ду́угосьчь», с двумя «у» в начале."
