etymology: "Из праславянского *vъtorъkъ, от *vъtorъ «второй»: второй день недели при счёте с понедельника. Русский «вторник» устроен так же и сохранил рядом живое «второй». Польский пошёл иначе: место «второго» занял DRUGI, а старый корень уцелел лишь в названии дня и в глаголе powtórzyć."
memory: "Предлог удлиняется: WE wtorek, как we Wrocławiu. И звучит глухо: «фто́рэк»."
idioms:
