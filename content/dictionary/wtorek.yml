notes:
  - { kind: pronunciation, text: "Предлог здесь удлиняется: WE WTOREK, а не «w wtorek». Правило общее — w превращается в we перед словом, начинающимся с w или f плюс согласный: we Wrocławiu, we Francji, we wtorek. Само слово начинается с оглушённого w: «фто́рэк», потому что перед глухим t звонкости не удержать." }
  - { kind: usage, text: "Слово хранит в себе прилагательное, которого в живом языке уже нет. WTOREK происходит от WTÓRY «второй», но «вторым» по-польски давно говорят DRUGI, а wtóry осталось книжным. Корень при этом не исчез: он сидит в глаголе POWTÓRZYĆ, собранном точно так же, как русское «повторить» от «второй». Русский «вторник» сохранил ту же связь, но у нас и «второй» никуда не делось." }
