# review
id: alez
format: 2
lemma: "ależ"
rank: 1267
pos: part
pron: { cyr: "а́леш" }
senses:
  - id: exclamation
    ru: "ну и …!, вот это …! — восклицание удивления"
    examples:
      - pl: "Ależ zimno!"
        ru: "Ну и холод!"
        source: { kind: translated, id: 410093 }
      - pl: "Ależ ziąb!"
        ru: "Ну и стужа!"
        source: { kind: translated, id: 856160 }
      - pl: "Ależ zabawa!"
        ru: "Вот это веселье!"
        source: { kind: translated, id: 909178 }
  - id: intensifier
    ru: "усиление оценки человека или поступка"
    examples:
      - pl: "Ależ z ciebie kutwa!"
        ru: "Ну ты и жмот!"
        source: { kind: tatoeba, id: 348643 }
      - pl: "Ależ głupota. Sama będziesz potem żałować."
        ru: "Ну и глупо. Сама же потом жалеть будешь."
        source: { kind: tatoeba, id: 13783096 }
      - pl: "Ależ wnikliwe!"
        ru: "Как проницательно!"
        source: { kind: translated, id: 8617260 }
notes:
  - { kind: usage, text: "ależ — это ale «но» плюс усилительная частица -ż. Отсюда два употребления: восклицание «ну и …!» и вежливое возражение «да нет же, что вы»." }
  - { kind: usage, text: "В восклицании порядок жёсткий: ależ и сразу существительное или прилагательное, без глагола: Ależ zimno! «Ну и холод!»" }
  - { kind: register, text: "Ależ oczywiście! «Ну конечно же!» и Ależ skąd! «Да что вы, вовсе нет!» — обиходные формулы вежливого согласия и отказа." }
  - { kind: pronunciation, text: "Конечное ż оглушается, слово звучит «а́леш», с ударением на первый слог." }
collocations:
  - { pl: "ależ tak", ru: "ну да, конечно" }
  - { pl: "ależ skąd", ru: "да что вы, вовсе нет" }
  - { pl: "ależ oczywiście", ru: "ну конечно же" }
etymology: "Из ale «но» и усилительной частицы -ż, той же, что в też и jakże. Русское «да нет же» собрано ровно так же: союз плюс усилительная частица."
memory: "ależ — это ale «но» плюс усилительное -ż. В восклицании значит «ну и …!»: Ależ zimno! А в ответе — вежливое возражение: Ależ skąd! «Да что вы!» Звучит «а́леш», с глухим ш на конце."
idioms:
  - { pl: "ależ skąd!", ru: "да что вы, вовсе нет!" }
  - { pl: "ależ oczywiście!", ru: "ну конечно же!" }
  - { pl: "ależ tak!", ru: "ну да, конечно!" }
