# review
id: powolac
format: 2
lemma: "powołać"
rank: 4291
pos: verb
pron: { cyr: "пово́уаць" }
senses:
  - id: appoint
    ru: "назначить (на должность); призвать (в армию)"
    examples:
      - pl: "Prezydent powołał nowego premiera."
        ru: "Президент назначил нового премьера."
        source: { kind: authored }
      - pl: "Powołali go do wojska w wieku osiemnastu lat."
        ru: "Его призвали в армию в восемнадцать лет."
        source: { kind: authored }
      - pl: "Powołam cię na swojego zastępcę."
        ru: "Я назначу тебя своим заместителем."
        source: { kind: authored }
  - id: establish
    ru: "учредить, создать (комиссию, организацию)"
    examples:
      - pl: "Sejm postanowił powołać komisję śledczą."
        ru: "Сейм решил создать следственную комиссию."
        source: { kind: authored }
      - pl: "Władze powołały sztab kryzysowy."
        ru: "Власти создали антикризисный штаб."
        source: { kind: authored }
  - id: cite
    ru: "с SIĘ NA — сослаться на"
    examples:
      - pl: "Powołał się na przepisy unijne."
        ru: "Он сослался на нормы ЕС."
        source: { kind: authored }
      - pl: "Powołaj się na moje nazwisko."
        ru: "Сошлись на меня."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "POWOŁAĆ — «назначить, призвать, учредить», а не «позвать». «Позвать» — ZAWOŁAĆ. POWOŁAĆ SIĘ NA — «сослаться на». POWOŁANIE — «призвание», а также «повестка в армию»." }
  - { kind: usage, text: "Пятьдесят три формы, включая POWOŁANI — «призванные, назначенные». Спряжение: POWOŁAM, POWOŁASZ, повелительное POWOŁAJ. Несовершенный вид — POWOŁYWAĆ." }
  - { kind: government, text: "Кого на что — винительный и NA с винительным: POWOŁAĆ KOGOŚ NA STANOWISKO. Куда — DO с родительным: DO WOJSKA, DO KOMISJI. Что — винительный: POWOŁAĆ KOMISJĘ. С SIĘ — NA с винительным: POWOŁAĆ SIĘ NA UMOWĘ." }
  - { kind: pronunciation, text: "Читается «пово́уаць»: Ł — «у», ударение на предпоследнем слоге. POWOŁAM — «пово́уам»." }
  - { kind: register, text: "Официальное и книжное слово, частое в новостях и документах. POWOŁAĆ SIĘ NA — нейтральное в деловой речи. POWOŁAĆ DO ŻYCIA — торжественное «создать»." }
collocations:
  - { pl: "powołać komisję", ru: "создать комиссию" }
  - { pl: "powołać do wojska", ru: "призвать в армию" }
  - { pl: "powołać się na przepisy", ru: "сослаться на правила" }
family:
  - { pl: "wołać", ru: "звать, кричать", relation: root, id: wolac }
  - { pl: "zawołać", ru: "позвать", relation: derived, id: zawolac }
  - { pl: "powołanie", ru: "призвание; повестка", relation: derived }
etymology: "Приставка PO- плюс WOŁAĆ «звать», праславянское *volati. По строению POWOŁAĆ — «позвать», но значение сместилось к «призвать, назначить»."
memory: "Powołać — назначить, призвать: powołali go do wojska. Powołać się na — сослаться на. Powołanie — призвание. Читается «пово́уаць»."
idioms:
  - { pl: "wielu jest powołanych, lecz mało wybranych", ru: "много званых, но мало избранных" }
