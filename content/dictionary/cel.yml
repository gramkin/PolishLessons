# review
id: cel
format: 2
lemma: "cel"
rank: 446
pos: noun
pron: { cyr: "цэль" }
senses:
  - id: target
    ru: "цель, мишень"
    examples:
      - pl: "Strzała trafiła w cel."
        ru: "Стрела попала в цель."
        source: { kind: tatoeba, id: 12470619 }
      - pl: "Widzę cel."
        ru: "Я вижу цель."
        source: { kind: translated, id: 10737755 }
      - pl: "Tom jest łatwym celem."
        ru: "Том — лёгкая мишень."
        source: { kind: translated, id: 7053932 }
  - id: aim
    ru: "цель, намерение"
    examples:
      - pl: "Mam nadzieję, że nie posuną się do przemocy, aby osiągnąć swój cel."
        ru: "Надеюсь, они не станут прибегать к насилию ради достижения своих целей."
        source: { kind: tatoeba, id: 1166360 }
      - pl: "W jakim celu?"
        ru: "С какой целью?"
        source: { kind: translated, id: 552525 }
      - pl: "Tom osiągnął już wiele ze swoich celów."
        ru: "Том уже достиг многих своих целей."
        source: { kind: translated, id: 10698040 }
notes:
  - { kind: usage, text: "Оборот w celu + родительный падеж значит «с целью, для»: w celu ulepszenia «с целью улучшения». Это канцелярский, официальный стиль." }
  - { kind: usage, text: "trafić w cel — «попасть в цель», osiągnąć cel — «достичь цели»." }
  - { kind: usage, text: "Пословица cel uświęca środki совпадает с русской «цель оправдывает средства»." }
  - { kind: usage, text: "Слово заимствовано из средневерхненемецкого zīl через чешский. Русское «цель» пришло тем же путём, только через польский." }
collocations:
  - { pl: "trafić w cel", ru: "попасть в цель" }
  - { pl: "osiągnąć cel", ru: "достичь цели" }
  - { pl: "w celu", ru: "с целью" }
  - { pl: "cel podróży", ru: "цель поездки" }
etymology: "Из средневерхненемецкого zīl через чешское cil и старопольское cyl. Русское «цель» пришло тем же путём, только следующим шагом — через польский."
memory: "cel — «цель», и русское слово пришло по той же дороге: из немецкого zīl через польский. Канцелярский оборот w celu значит «с целью», а пословица совпадает: cel uświęca środki."
idioms:
  - { pl: "cel uświęca środki", ru: "цель оправдывает средства" }
  - { pl: "trafić w cel", ru: "попасть в цель" }
  - { pl: "w celu", ru: "с целью" }
