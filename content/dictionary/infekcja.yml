# review
id: infekcja
format: 2
lemma: "infekcja"
rank: 3726
pos: noun
pron: { cyr: "инфэ́кцья" }
senses:
  - id: infection
    ru: "инфекция; простуда"
    examples:
      - pl: "Złapałem jakąś infekcję i mam gorączkę."
        ru: "Я подхватил какую-то инфекцию, у меня жар."
        source: { kind: authored }
      - pl: "Lekarz przepisał antybiotyk na infekcję."
        ru: "Врач выписал антибиотик от инфекции."
        source: { kind: authored }
      - pl: "Infekcja dróg oddechowych trwała tydzień."
        ru: "Респираторная инфекция длилась неделю."
        source: { kind: authored }
      - pl: "Rana się goi, nie ma infekcji."
        ru: "Рана заживает, инфекции нет."
        source: { kind: authored }
      - pl: "Dzieci w przedszkolu często łapią infekcje."
        ru: "Дети в садике часто подхватывают инфекции."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "INFEKCJA — «инфекция», но в быту это часто просто «простуда»: MAM INFEKCJĘ, «я приболел». Заразный — ZAKAŹNY, заражённый вирусом — ZAINFEKOWANY." }
  - { kind: usage, text: "Восемь живых форм, женский род на -CJA. Родительный, дательный и местный — INFEKCJI. Архаичная форма INFEKCYJ и звательный не даются." }
  - { kind: government, text: "Подхватить инфекцию — ZŁAPAĆ INFEKCJĘ, винительный. Лекарство от инфекции — LEK NA INFEKCJĘ, NA с винительным. Инфекция чего — родительный: INFEKCJA UCHA." }
  - { kind: pronunciation, text: "Читается «инфэ́кцья», ударение на предпоследнем слоге. FE — твёрдое «фэ», CJA — «цья»." }
collocations:
  - { pl: "złapać infekcję", ru: "подхватить инфекцию" }
  - { pl: "infekcja wirusowa", ru: "вирусная инфекция" }
  - { pl: "infekcja dróg oddechowych", ru: "респираторная инфекция" }
family:
  - { pl: "infekować", ru: "заражать", relation: derived }
  - { pl: "zainfekowany", ru: "заражённый", relation: derived }
  - { pl: "infekcja wirusowa", ru: "вирусная инфекция", relation: derived }
etymology: "Из латинского слова со значением «заражение, порча». Русская «инфекция» — то же слово."
memory: "Infekcja — инфекция, в быту «простуда»: złapać infekcję. Читается «инфэ́кцья». Lek na infekcję — лекарство от инфекции."
idioms:
  - { pl: "chuchać i dmuchać", ru: "пылинки сдувать" }
formExamplesSkip:
