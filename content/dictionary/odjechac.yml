# review
id: odjechac
format: 2
lemma: "odjechać"
rank: 3014
pos: verb
pron: { cyr: "отъе́хаць" }
senses:
  - id: depart
    ru: "отъехать, уехать (о транспорте)"
    examples:
      - pl: "Pociąg odjechał pięć minut temu."
        ru: "Поезд ушёл пять минут назад."
        source: { kind: authored }
      - pl: "Autobus odjechał z peronu trzeciego."
        ru: "Автобус отошёл с третьей платформы."
        source: { kind: authored }
      - pl: "Odjechali rano, nie czekając na nas."
        ru: "Они уехали утром, не дожидаясь нас."
        source: { kind: authored }
  - id: move-away
    ru: "отъехать (на небольшое расстояние)"
    examples:
      - pl: "Odjedź trochę, zasłaniasz wyjazd."
        ru: "Отъедь немного, ты загораживаешь выезд."
        source: { kind: authored }
      - pl: "Odjechał kawałek i stanął pod drzewem."
        ru: "Он отъехал немного и встал под деревом."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Приставка od- и корень JECHAĆ дают ровно то же, что русские «от-» и «ехать», и весь ряд читается напрямую: ODJECHAĆ «отъехать, уехать», PRZYJECHAĆ «приехать», WYJECHAĆ «выехать», DOJECHAĆ «доехать», PRZEJECHAĆ «переехать, проехать», ZAJECHAĆ «заехать». Для расписаний нужен несовершенный ODJEŻDŻAĆ: POCIĄG ODJEŻDŻA O SIÓDMEJ — «поезд отходит в семь», и на вокзальных табло стоит существительное ODJAZD «отправление», против PRZYJAZD «прибытие»." }
  - { kind: pronunciation, text: "Основа меняется между видами сильнее, чем кажется: ODJECHAĆ, но ODJADĘ, ODJEDZIESZ, ODJEDZIE в будущем времени — то есть -JECHA- в инфинитиве против -JAD-/-JEDZ- в личных формах. Это общее свойство корня JECHAĆ: JADĘ «я еду», JEDZIESZ «ты едешь». Русский тут проще, у него «едешь» и «ехать» ближе друг к другу, так что польские формы надо просто запомнить. Повелительное ODJEDŹ с мягким dź." }
  - { kind: government, text: "Откуда — предлог Z с родительным: ODJECHAĆ Z PERONU, Z DWORCA, Z MIASTA. Куда — DO с родительным или NA с винительным: DO WARSZAWY, NA WSI нет, но NA WIEŚ есть. На сколько отъехать — винительный без предлога или с KAWAŁEK: ODJECHAĆ KILKA METRÓW, ODJECHAĆ KAWAŁEK. Непереходный глагол, поэтому страдательных причастий нет, и всех форм сорок две: сорок одна основная и деепричастие ODJECHAWSZY." }
  - { kind: false-friend, text: "Разговорное значение, которого русский не ждёт: ODJECHAĆ о человеке значит «отключиться, уйти в себя», а ODJECHANY — «чудаковатый, с приветом». ON CAŁKIEM ODJECHAŁ не про поездку, а про состояние. В нейтральной речи этого смысла нет, но в живом языке он частый, и спутать его с отъездом легко." }
collocations:
  - { pl: "pociąg odjeżdża", ru: "поезд отходит" }
  - { pl: "odjechać z peronu", ru: "отъехать от платформы" }
  - { pl: "odjechać kawałek", ru: "отъехать немного" }
family:
  - { pl: "odjeżdżać", ru: "отъезжать, отходить", relation: aspect }
  - { pl: "jechać", ru: "ехать", relation: root, id: jechac }
  - { pl: "przyjechać", ru: "приехать", relation: root, id: przyjechac }
etymology: "Приставка od- «от» и JECHAĆ, из праславянского *jexati «ехать» — то же слово, что русское «ехать», с тем же корнем, что в «езда», «поезд», «выезд». Польское гнездо устроено так же: JAZDA «езда», POJAZD «транспортное средство», ODJAZD «отправление», PRZYJAZD «прибытие», WJAZD «въезд». Приставка od- работает как русская «от-»: отделяет движение от исходной точки, откуда и «отъехать», и «уехать» — разница лишь в том, далеко ли уехал."
memory: "od- + jechać = «от-» + «ехать»: odjechać «отъехать», przyjechać «приехать», wyjechać «выехать». Но личные формы от другой основы: odjadę, odjedziesz, как jadę, jedziesz."
idioms:
  - { pl: "pociąg odjechał", ru: "поезд ушёл (и о возможности тоже)" }
  - { pl: "odjechany", ru: "чудаковатый, с приветом" }
