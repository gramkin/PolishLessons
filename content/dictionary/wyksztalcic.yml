# review
id: wyksztalcic
format: 2
lemma: "wykształcić"
rank: 2121
pos: verb
aspect: perf
pron: { cyr: "выкшта́уциць" }
senses:
  - id: education
    ru: "образование (существительное wykształcenie)"
    examples:
      - pl: "Wykształcenie jest ważnym czynnikiem."
        ru: "Образование — важный фактор."
        source: { kind: tatoeba, id: 8737513 }
      - pl: "On ma wykształcenie klasyczne."
        ru: "У него классическое образование."
        source: { kind: translated, id: 461118 }
      - pl: "To, kim dziś jestem, zawdzięczam wykształceniu."
        ru: "Тем, кто я есть сегодня, я обязан образованию."
        source: { kind: translated, id: 363008 }
  - id: develop
    ru: "выработать, развить (в себе)"
    examples:
      - pl: "Powinieneś wykształcić w sobie nawyk używania słowników."
        ru: "Тебе следует выработать привычку пользоваться словарями."
        source: { kind: translated, id: 366193 }
      - pl: "To wuj go wykształcił."
        ru: "Это дядя дал ему образование."
        source: { kind: translated, id: 968941 }
notes:
  - { kind: usage, text: "Отглагольное существительное wykształcenie «образование» встречается намного чаще самого глагола: wyższe wykształcenie «высшее образование»." }
  - { kind: government, text: "Выработать что-л. в себе — w sobie: wykształcić w sobie nawyk «выработать у себя привычку»." }
  - { kind: false-friend, text: "Корень kształt «форма» (карточка ksztalt), то есть «придать форму». Русское «образование» от «образ» устроено по тому же образцу." }
  - { kind: usage, text: "Несовершенный вид — wykształcać. Причастие wykształcony значит «образованный»." }
collocations:
  - { pl: "wyższe wykształcenie", ru: "высшее образование" }
  - { pl: "wykształcony człowiek", ru: "образованный человек" }
etymology: "wy- + kształcić, от kształt «форма» (из немецкого Gestalt): «придать форму». Русское «образование» от «образ» собрано так же."
memory: "wykształcić — «дать образование, выработать». Существительное wykształcenie «образование» встречается чаще глагола. Корень kształt «форма», как «образование» от «образа»."
