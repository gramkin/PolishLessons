notes:
  - { kind: false-friend, text: "Самое частое значение русскому понятно не сразу, зато после объяснения не забывается. WPŁYNĄĆ буквально значит «втечь, вплыть», от PŁYNĄĆ «плыть, течь», и уже отсюда — «повлиять»: WPŁYNĄĆ NA COŚ. Русское «влиять» построено на той же картинке, только от другого глагола: «вливать». То есть оба языка увидели влияние как втекание, и оборот WPŁYNĄĆ NA DECYZJĘ отвечает русскому «повлиять на решение» слово в слово, включая предлог." }
  - { kind: government, text: "В главном значении — предлог NA с винительным, как в русском: WPŁYNĄĆ NA DECYZJĘ, NA WYNIK, NA KOGOŚ. В значении движения — DO с родительным: WPŁYNĄĆ DO PORTU, DO ZATOKI. В денежном — тоже NA с винительным, но смысл другой: WPŁYNĄĆ NA KONTO «поступить на счёт». Различает их подлежащее: человек или обстоятельство влияет, судно вплывает, деньги поступают." }
  - { kind: pronunciation, text: "Глагол класса на -ĄĆ, и у него мена ą/ę по роду и числу в прошедшем времени: WPŁYNĄŁ с ą только в мужском единственном, а дальше всюду ę — WPŁYNĘŁA, WPŁYNĘŁO, WPŁYNĘLI, WPŁYNĘŁY. Так же ведут себя ZACZĄĆ, WZIĄĆ и все прочие на -ĄĆ. Сочетание PŁY читается «пуы», с ł как кратким у: «фпуы́нонць», а начальное W перед глухим оглушается до ф." }
  - { kind: usage, text: "Канцелярское значение стоит знать отдельно: WNIOSEK WPŁYNĄŁ, PISMO WPŁYNĘŁO, SKARGA WPŁYNĘŁA — так по-польски говорят о поступлении документа, и дата WPŁYNIĘCIA есть на каждом штампе. Русский в этом месте скажет «поступило» или «зарегистрировано». Несовершенная пара — WPŁYWAĆ, а существительное WPŁYW значит «влияние»: MIEĆ WPŁYW NA COŚ." }
collocations:
  - { pl: "wpłynąć na decyzję", ru: "повлиять на решение" }
  - { pl: "wpłynąć do portu", ru: "войти в порт" }
