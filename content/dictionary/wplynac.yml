  - { pl: "wpływ", ru: "влияние", relation: derived, id: wplyw }
etymology: "Приставка w- «в» и PŁYNĄĆ, из праславянского *plynǫti «плыть, течь» — тот же корень, что русские «плыть», «плавать», «поток» через чередование. Переносное значение выросло из буквального: то, что втекает, незаметно меняет содержимое, отсюда WPŁYW «влияние» и WPŁYNĄĆ NA COŚ «повлиять». Русский пришёл к тому же образу другим путём, через «вливать»: «влияние» — это тоже втекание, и даже приставка та же. Редкий случай, когда две метафоры совпали независимо и дали одинаковое управление."
memory: "wpłynąć — это «втечь», а оттуда «повлиять»: wpłynąć na decyzję, как русское «повлиять на решение». Русское «влиять» построено на той же картинке, от «вливать»."
idioms:
