# review
id: tamten
format: 2
lemma: "tamten"
rank: 445
pos: adj
pron: { cyr: "та́мтэн" }
senses:
  - id: that
    ru: "тот (в противопоставлении этому)"
    examples:
      - pl: "Pamiętasz tamten dzień?"
        ru: "Помнишь тот день?"
        source: { kind: tatoeba, id: 3070693 }
      - pl: "Chcemy się wspiąć na tamtą górę."
        ru: "Мы хотим забраться на ту гору."
        source: { kind: tatoeba, id: 350143 }
      - pl: "To są moje książki, a tamte jego."
        ru: "Это мои книги, а то — его."
        source: { kind: tatoeba, id: 3656764 }
  - id: that-remote
    ru: "тот (удалённый во времени или пространстве)"
    examples:
      - pl: "Co robiliście w tamtej chwili?"
        ru: "Что Вы тогда делали?"
        source: { kind: tatoeba, id: 1002547 }
      - pl: "Tamto muzeum okazało się ogromne."
        ru: "Музей оказался очень большим."
        source: { kind: tatoeba, id: 1353137 }
      - pl: "Widzisz kolibra na tamtym krzaku?"
        ru: "Видишь колибри на том кусту?"
        source: { kind: tatoeba, id: 10466202 }
notes:
  - { kind: usage, text: "Пара указателей: ten «этот» и tamten «тот». Слово разбирается прозрачно: tam «там» + ten «этот», то есть «тот, что там»." }
  - { kind: usage, text: "tamten świat — «тот свет»: przenieść się na tamten świat «отправиться на тот свет»." }
  - { kind: usage, text: "Мужско-личное множественное — tamci: Kim są tamci dwaj? «Кто те двое?»" }
  - { kind: usage, text: "to i tamto — «то да сё», о разговоре ни о чём конкретном." }
collocations:
  - { pl: "tamten dzień", ru: "тот день" }
  - { pl: "tamten świat", ru: "тот свет" }
  - { pl: "to i tamto", ru: "то да сё" }
  - { pl: "tamtej nocy", ru: "той ночью" }
etymology: "Из tam «там» + ten «этот» — буквально «тот, что там». Русское «тот» короче, но указывает ровно на то же."
memory: "tamten — «тот», и разбирается прозрачно: tam + ten. Это пара к ten «этот». А tamten świat — «тот свет»."
idioms:
  - { pl: "tamten świat", ru: "тот свет" }
  - { pl: "przenieść się na tamten świat", ru: "отправиться на тот свет" }
  - { pl: "to i tamto", ru: "то да сё" }
formExamplesSkip:
  - { form: "tamtę", reason: "устаревший винительный падеж женского рода; нормативная форма — tamtą, и в корпусе tamtę не встречается" }
