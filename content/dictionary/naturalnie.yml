etymology: "От прилагательного NATURALNY, из латинского NATURALIS «природный», от NATURA. Это тот же класс, что ORYGINALNY и BRUTALNY: латинское -ALIS даёт польское -ALNY без мягкости, против русского «-альный» с мягким знаком. Наречие от такого прилагательного образуется заменой -NY на -NIE, и правило это общее: NATURALNY даёт NATURALNIE, ORYGINALNY даёт ORYGINALNIE, BRUTALNY даёт BRUTALNIE. Значение «конечно» выросло из «естественно»: то, что происходит само собою, не требует доказательств, — и русский проделал тот же ход в слове «естественно», которое тоже значит согласие."
memory: "Два значения: «естественно» о поведении и «конечно» как согласие, причём второе совершенно нейтрально, в отличие от просторечного русского «натурально». Класс -ALNY без мягкости: «натура́лне». Наречие от прилагательного: -NY меняется на -NIE."
