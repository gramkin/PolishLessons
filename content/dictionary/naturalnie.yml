notes:
  - { kind: false-friend, text: "Оттенок перевёрнут. Русское «натурально» в значении «конечно» звучит просторечно и устарело, его скажет разве что персонаж старого рассказа. Польское NATURALNIE в этом значении совершенно нейтрально и частотно: это обычный способ согласиться, наравне с OCZYWIŚCIE. Поэтому переводить NATURALNIE словом «натурально» нельзя почти никогда: нужно «конечно» или «разумеется». В первом же значении, «естественно, непринуждённо», слова совпадают без оговорок." }
  - { kind: usage, text: "Два употребления различаются местом в предложении. Как наречие образа действия слово стоит при глаголе: ZACHOWYWAŁ SIĘ NATURALNIE, MÓW NATURALNIE. Как знак согласия оно стоит отдельно, часто в начале и с запятой или восклицательным знаком: NATURALNIE, ŻE POMOGĘ. NATURALNIE! Во втором случае оно равно слову OCZYWIŚCIE и взаимозаменяемо с ним. Степени сравнения есть у первого значения: NATURALNIEJ, NAJNATURALNIEJ." }
  - { kind: pronunciation, text: "Читается «натура́лне», в четыре слога, с ударением на предпоследнем, то есть на RAL. Буква l здесь твёрдая, как всегда в польском, поэтому не «натуральне», а «натура́лне», и мягкости русского «-альный» здесь нет. Сочетание nie на конце — это «не», одним слогом. В сравнительной степени NATURALNIEJ ударение остаётся на том же слоге от конца: «натура́лней»." }
  - { kind: government, text: "Наречие падежей не требует. В устойчивом обороте NAJNATURALNIEJ W ŚWIECIE «самым естественным образом» после предлога W стоит предложный падеж. Когда слово значит согласие, оно часто вводит придаточное с ŻE: NATURALNIE, ŻE TAK, и запятая перед ŻE обязательна. Как усилитель перед прилагательным оно не употребляется: сказать NATURALNIE DOBRY в значении «очень хороший» нельзя, для этого есть NIESAMOWICIE или BARDZO." }
