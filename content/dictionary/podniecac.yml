  - id: get-excited
    ru: "с SIĘ — волноваться, приходить в восторг (часто иронично)"
    examples:
      - pl: "Nie ma czym się podniecać."
        ru: "Тут нечему так радоваться."
        source: { kind: translated, id: 13655451 }
