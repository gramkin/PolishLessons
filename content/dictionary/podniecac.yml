        ru: "В детстве мы приходили в восторг от снега."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "PODNIECAĆ — «возбуждать», и о человеке часто с эротическим оттенком. Нейтральное «я в восторге, предвкушаю» — CIESZĘ SIĘ или JESTEM PODEKSCYTOWANY. PODNIECAJĄCY о матче, книге, приключении звучит нормально — «захватывающий»." }
  - { kind: usage, text: "Несовершенный вид; совершенный — PODNIECIĆ. Спряжение на -AM: PODNIECAM, PODNIECASZ, PODNIECAJĄ. С SIĘ — «волноваться, восторгаться»; NIE MA SIĘ CZYM PODNIECAĆ — «нечему тут радоваться»." }
  - { kind: government, text: "Кого или что — винительный: PODNIECAĆ TŁUM, CIEKAWOŚĆ. Чем — творительный без предлога: PODNIECAĆ SIĘ PLOTKAMI, MECZEM." }
  - { kind: pronunciation, text: "Читается «подне́цаць»: NIE — «не», CA — «ца», ударение на предпоследнем слоге. PODNIECAJĄ — «подне́цайоу̃»." }
collocations:
