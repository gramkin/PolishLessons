etymology: "Приставка POD- плюс старое NIECIĆ «разжигать огонь», праславянское *nětiti. Буквально — «подкладывать огня»."
memory: "Podniecać — подкладывать огня: mówca podniecał tłum. «Я в восторге» — cieszę się, а не podniecam się."
