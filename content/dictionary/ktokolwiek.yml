# review
id: ktokolwiek
format: 2
lemma: "ktokolwiek"
rank: 758
pos: pron
pron: { cyr: "ктоко́львек" }
senses:
  - id: anyone
    ru: "кто-либо, кто-нибудь (безразлично кто)"
    examples:
      - pl: "Czy ktokolwiek wierzy ci?"
        ru: "Тебе хоть кто-нибудь верит?"
        source: { kind: translated, id: 550669 }
      - pl: "Spytaj kogokolwiek."
        ru: "Спроси кого угодно."
        source: { kind: translated, id: 8617410 }
      - pl: "Nie możemy powiedzieć tego komukolwiek."
        ru: "Мы не можем сказать это кому попало."
        source: { kind: translated, id: 4749167 }
  - id: whoever
    ru: "кто бы ни (в придаточном)"
    note: "В начале придаточного значит «кто бы ни»: Ktokolwiek wygra… «Кто бы ни выиграл…»."
    examples:
      - pl: "Ktokolwiek wygra, będzie dobrze."
        ru: "Кто бы ни выиграл, будет хорошо."
        source: { kind: translated, id: 362899 }
      - pl: "Jest tam ktokolwiek w środku ?"
        ru: "Есть там кто внутри?"
        source: { kind: translated, id: 1568564 }
      - pl: "Ktokolwiek to zrobił, odpowie za to."
        ru: "Кто бы это ни сделал, он за это ответит."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Образовано прозрачно: kto + -kolwiek, и склоняется по kto — kogokolwiek, komukolwiek, kimkolwiek. Творительного с предлогом z: z kimkolwiek «с кем угодно»." }
  - { kind: usage, text: "Частица -kolwiek образует целый ряд: cokolwiek «что угодно», gdziekolwiek «где угодно», kiedykolwiek «когда угодно», jakikolwiek «какой угодно»." }
  - { kind: usage, text: "В отрицательных предложениях звучит сильнее, чем nikt: Nie powiedziałem tego komukolwiek «Я не говорил этого вообще никому»." }
  - { kind: usage, text: "В придаточном переводится «кто бы ни»: Ktokolwiek przyjdzie, wpuść go «Кто бы ни пришёл, впусти его»." }
collocations:
  - { pl: "spytaj kogokolwiek", ru: "спроси кого угодно" }
  - { pl: "ktokolwiek inny", ru: "кто-либо другой" }
  - { pl: "z kimkolwiek", ru: "с кем угодно" }
  - { pl: "ktokolwiek to zrobił", ru: "кто бы это ни сделал" }
family:
  - { pl: "kto", ru: "кто", relation: root, id: kto }
  - { pl: "cokolwiek", ru: "что угодно", relation: derived, id: cokolwiek }
etymology: "Сращение kto «кто» и частицы -kolwiek, восходящей к старому kolwiek «сколько угодно». Русское «кто-либо» собрано тем же способом — местоимение плюс частица."
memory: "ktokolwiek — «кто угодно, кто-нибудь», склоняется как kto: kogokolwiek, komukolwiek, kimkolwiek. Частица -kolwiek продуктивна и даёт целый ряд: cokolwiek «что угодно», gdziekolwiek «где угодно», kiedykolwiek «когда угодно». В придаточном переводится «кто бы ни»: Ktokolwiek przyjdzie, wpuść go. В отрицании звучит сильнее, чем nikt: nie mówiłem tego komukolwiek «я не говорил этого вообще никому»."
idioms:
