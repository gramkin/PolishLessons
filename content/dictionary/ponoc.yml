  - { pl: "rzekomo", ru: "якобы", relation: root }
  - { pl: "mówić", ru: "говорить", relation: root, id: mowic }
etymology: "Старая частица, родственная PONO и PONIEKĄD. Точное происхождение спорно; в русском прямого соответствия нет, по смыслу ближе всего «мол», «дескать»."
memory: "Ponoć — говорят, якобы. Не путай с północ — полночь. Ponoć ma nowego chłopaka — говорят, у неё новый парень."
idioms:
  - { pl: "ponoć wszystko się zmieni", ru: "говорят, всё изменится" }
