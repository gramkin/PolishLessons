id: ponoc
format: 2
lemma: "ponoć"
rank: 3621
pos: part
pron: { cyr: "по́ноць" }
senses:
  - id: reportedly
    ru: "говорят, якобы, вроде бы"
    examples:
      - pl: "Ponoć ma nowego chłopaka."
        ru: "Говорят, у неё новый парень."
        source: { kind: authored }
      - pl: "Ten lekarz jest ponoć najlepszy w mieście."
        ru: "Этот врач, говорят, лучший в городе."
        source: { kind: authored }
      - pl: "Zima ma być ponoć bardzo mroźna."
        ru: "Зима, говорят, будет очень морозной."
        source: { kind: authored }
      - pl: "Ponoć widziano go w Paryżu."
        ru: "Его якобы видели в Париже."
        source: { kind: authored }
      - pl: "Sklep ponoć zamykają w przyszłym miesiącu."
        ru: "Магазин, говорят, закрывают в следующем месяце."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "PONOĆ — «говорят, будто бы». Это не «полночь»: полночь — PÓŁNOC. Слово передаёт чужие слова, за которые говорящий не ручается, как русское «мол» или «якобы»." }
  - { kind: usage, text: "Частица, не изменяется. Стоит в начале фразы или перед сказуемым: PONOĆ PRZYJDZIE или ON PONOĆ PRZYJDZIE. Синоним, более частый — PODOBNO." }
  - { kind: register, text: "PONOĆ чуть книжнее и живее, чем PODOBNO: в газетах и в разговоре с оттенком сплетни. В официальном тексте пишут RZEKOMO, «якобы», или PODOBNO." }
  - { kind: pronunciation, text: "Читается «по́ноць», ударение на первом слоге. Конечное Ć — мягкое «ць»." }
collocations:
  - { pl: "to ponoć prawda", ru: "это, говорят, правда" }
  - { pl: "ponoć tak było", ru: "говорят, так и было" }
  - { pl: "ponoć wkrótce", ru: "говорят, скоро" }
family:
