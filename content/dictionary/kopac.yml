# review
id: kopac
format: 2
lemma: "kopać"
rank: 1816
pos: verb
pron: { cyr: "ко́паць" }
senses:
  - id: dig
    ru: "копать, рыть"
    examples:
      - pl: "Kopali studnię dwa tygodnie."
        ru: "Они копали колодец две недели."
        source: { kind: authored }
      - pl: "Kopię dół na drzewo."
        ru: "Я копаю яму под дерево."
        source: { kind: authored }
      - pl: "Kopano tu studnie od wieków."
        ru: "Здесь копали колодцы веками."
        source: { kind: authored }
  - id: kick
    ru: "пинать, лягать (ногой)"
    examples:
      - pl: "Kopie piłkę o ścianę."
        ru: "Он пинает мяч об стену."
        source: { kind: authored }
      - pl: "Koń kopie, uważaj."
        ru: "Конь лягается, осторожно."
        source: { kind: authored }
      - pl: "Nie kop brata."
        ru: "Не пинай брата."
        source: { kind: authored }
  - id: kicked
    ru: "kopany — пинаемый, избиваемый ногами"
    examples:
      - pl: "Kopany przez kolegów chłopiec przestał chodzić do szkoły."
        ru: "Пинаемый товарищами мальчик перестал ходить в школу."
        source: { kind: authored }
      - pl: "Kopani przez starszych kolegów chłopcy bali się przerw."
        ru: "Пинаемые старшими мальчики боялись перемен."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ГЛАВНОЕ, и русскоязычный об этом не догадается. Русское «копать» умеет только рыть землю. Польское kopać умеет И это, И пинать ногой: kopać piłkę «пинать мяч», koń kopie «конь лягается», nie kop brata «не пинай брата». Первое значение — точное родство (праслав. *kopati, ср. «копать», «окоп», «подкоп»), и именно поэтому второе остаётся невидимым: фраза nie kop brata читается как «не копай брата» и смысл теряется начисто." }
  - { kind: usage, text: "Осторожно с формой kopie: это и третье лицо этого глагола («копает, пинает»), и именительный множественного от существительного kopia «копия». Различает только контекст: on kopie dół «он копает яму» против kopie dokumentów «копии документов»." }
  - { kind: government, text: "Копают ЧТО — винительный: kopać dół, kopać studnię. Пинают КОГО и ЧТО — тоже винительный: kopać piłkę, kopać brata. А пинать ВО что-то — W с винительным: kopać w ścianę, kopać w drzwi. Возвратное kopać się значит «пинаться, лягаться»." }
  - { kind: pronunciation, text: "Основа настоящего времени получает -i-: kopać, но kopię, kopiesz, kopie, kopiemy, kopiecie, kopią. Здесь, в отличие от piec и wpuścić, края парадигмы не выделяются — вся основа одинаковая." }
collocations:
  - { pl: "kopać dół", ru: "копать яму" }
  - { pl: "kopać piłkę", ru: "пинать мяч" }
  - { pl: "kopać w ścianę", ru: "пинать в стену" }
family:
  - { pl: "wykopać", ru: "выкопать", relation: aspect }
  - { pl: "kopniak", ru: "пинок", relation: derived }
  - { pl: "okop", ru: "окоп", relation: derived }
etymology: "Праславянское *kopati «копать» — то же слово, что русское «копать», и из того же гнезда «окоп», «подкоп», «копанка». Значение «пинать» выросло из образа удара ногой, которым разгребают землю: сперва так говорили о лошади, бьющей копытом, потом о человеке. Русский этого хода не сделал и обходится словами «пинать» и «лягать»."
memory: "kopać — «копать» И «пинать». Первое значение русское, второе — чистый польский, и о нём надо помнить: nie kop brata значит «не пинай брата». И не путайте kopie «копает» с kopie «копии»."
idioms:
  - { pl: "kopać pod kimś dołki", ru: "копать под кого-л., подставлять" }
  - { pl: "kopać piłkę", ru: "пинать мяч, играть в футбол" }
