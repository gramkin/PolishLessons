notes:
  - { kind: false-friend, text: "Русская «пассия» — это человек, предмет влюблённости, и слово это устарелое и слегка шутливое. Польская PASJA значит совсем другое: увлечение, любимое занятие, то, чему человек отдаёт свободное время. MOJĄ PASJĄ JEST WSPINACZKA переводится «моё увлечение — скалолазание», и о человеке так сказать нельзя. Второе значение, которого в русском нет вовсе, — ярость: WPAŚĆ W PASJĘ значит «прийти в бешенство», DOPROWADZIĆ KOGOŚ DO PASJI «довести до белого каления». Третье, религиозное: PASJA с прописной буквы означает Страсти Христовы и музыкальное произведение о них." }
  - { kind: usage, text: "Десять форм, женский род, основа на -SJA. Форма PASJI покрывает родительный, дательный и местный единственного и служит обычным родительным множественного. Рядом стоит старая форма PASYJ, с нулевым окончанием: она принадлежит книжному и музыковедческому языку, как EGZEKUCYJ и AMUNICYJ. Именительный и винительный множественного — PASJE. Управление: PASJA DO CZEGOŚ с родительным — PASJA DO MUZYKI; а в значении ярости слово входит в обороты WPAŚĆ W PASJĘ с винительным и W PASJI с местным." }
  - { kind: pronunciation, text: "Читается «па́ся», два слога, ударение на первом. Буквосочетание SJA стягивается в один слог и звучит как мягкое «ся» — поэтому слово короче русской «пассии» на целый слог, и это главное отличие на слух. В форме PASJI слышно «па́си». В форме PASJĄ последнее Ą даёт «он»: «па́сён». В форме PASJĘ конечное Ę звучит как чистое «э»: «па́сэ». В форме PASYJ буква Y даёт «ы»: «па́сый»." }
  - { kind: register, text: "В значении увлечения слово нейтральное и очень частое: вопрос JAKA JEST TWOJA PASJA звучит в анкетах и на собеседованиях. Устойчивые сочетания: ROBIĆ COŚ Z PASJĄ «делать что-то увлечённо», ŻYCIOWA PASJA, PASJAT — нет такого слова, зато есть PASJONAT «увлечённый человек, энтузиаст» и PASJONUJĄCY «увлекательный». В значении ярости слово книжное и сильное: WPAŚĆ W PASJĘ говорят о вспышке, а не о раздражении. Религиозное значение пишется с прописной: PASJA WEDŁUG ŚWIĘTEGO MATEUSZA." }
