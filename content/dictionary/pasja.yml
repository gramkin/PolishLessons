etymology: "Из латинского PASSIO «страдание, претерпевание», от глагола PATI «страдать, терпеть». Первым значением было именно страдание, и отсюда Страсти Христовы, которые по-польски называются PASJA, а по-русски «Страсти». Дальше слово пошло двумя дорогами: страдание как сильное чувство дало страсть и увлечение, а страдание как невыносимое состояние — ярость. Самое любопытное, что русское «страсть» построено ровно по той же мысли, от «страдать», и потому два слова независимо прошли одинаковый путь от боли к силе чувства. Из того же латинского корня идут «пациент», то есть претерпевающий, и «пассивный», то есть испытывающий действие."
memory: "Не «пассия»: польская pasja это увлечение, любимое занятие, и о человеке так не говорят. Второе значение, которого в русском нет, — ярость: wpaść w pasję «прийти в бешенство». Третье, с прописной буквы, — Страсти Христовы. Корень тот же, что в «пациенте» и «пассивном»: латинское pati «страдать», и русская «страсть» от «страдать» проделала ровно тот же путь от боли к силе чувства. Звучит коротко, «па́ся», на слог меньше русского слова."
idioms:
  - { pl: "wpaść w pasję", ru: "прийти в ярость" }
