# review
id: skinac
format: 2
lemma: "skinąć"
rank: 2233
pos: verb
aspect: perf
pron: { cyr: "ски́нонць" }
senses:
  - id: nod
    ru: "кивнуть"
    examples:
      - pl: "Maria skinęła głową."
        ru: "Мария закивала."
        source: { kind: tatoeba, id: 2578104 }
      - pl: "Tom skinął głową."
        ru: "Том кивнул головой."
        source: { kind: translated, id: 3711135 }
      - pl: "Skinąłem głową."
        ru: "Я кивнул головой."
        source: { kind: translated, id: 6328316 }
  - id: beckon
    ru: "сделать знак, поманить"
    examples:
      - pl: "Skinął do mnie."
        ru: "Он сделал мне знак."
        source: { kind: translated, id: 406213 }
      - pl: "Skinęła, bym wszedł."
        ru: "Она сделала знак, чтобы я вошёл."
        source: { kind: translated, id: 356423 }
notes:
  - { kind: government, text: "Кивнуть головой — skinąć głową, творительный падеж, как в русском. Поманить кого-л. — skinąć na kogoś, предлог na с винительным." }
  - { kind: usage, text: "Без дополнения skinąć уже значит «кивнуть»: Tom skinął. Głową добавляют для ясности." }
  - { kind: false-friend, text: "Не «скинуть»! Русское «скинуть» — это zrzucić. Корень тут kiwać «качать, кивать»." }
  - { kind: usage, text: "Несовершенный вид — skinąć образован от kiwać; более обиходное «кивать» — kiwać głową." }
collocations:
  - { pl: "skinąć głową", ru: "кивнуть головой" }
  - { pl: "skinąć na kogoś", ru: "поманить кого-л." }
etymology: "От kiwać «качать, кивать»; русское «кивать» — тот же корень."
memory: "skinąć — «кивнуть» (skinąć głową) и «поманить» (skinąć na kogoś). Не путайте со «скинуть»: это zrzucić."
idioms:
  - { pl: "skinąć głową", ru: "кивнуть головой" }
