notes:
  - { kind: usage, text: "Подчёркивает укрывательство от кого-то конкретного. Официально засекреченное — tajny, а потихоньку сделанное — potajemny." }
  - { kind: false-friend, text: "Корень tajemnica «тайна», который уже есть в словаре; ср. русское «таить», «тайна»." }
  - { kind: government, text: "Обычное прилагательное; наречие — potajemnie «тайком, украдкой»." }
  - { kind: usage, text: "Наречие potajemnie встречается чаще прилагательного: wyjechał potajemnie «он уехал тайком»." }
