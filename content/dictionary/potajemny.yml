id: potajemny
format: 2
lemma: "potajemny"
rank: 5549
pos: adj
pron: { cyr: "потае́мны" }
senses:
  - id: secret
    ru: "тайный, скрытый"
    examples:
      - pl: "Ponoć zaczęły się już potajemne rozmowy pokojowe."
        ru: "Говорят, тайные мирные переговоры уже начались."
        source: { kind: translated, id: 919279 }
      - pl: "Mieli potajemne spotkanie."
        ru: "У них была тайная встреча."
        source: { kind: authored }
      - pl: "To potajemny plan."
        ru: "Это тайный план."
        source: { kind: authored }
  - id: clandestine
    ru: "подпольный, негласный"
    examples:
      - pl: "Prowadzili potajemną działalność."
        ru: "Они вели подпольную деятельность."
        source: { kind: authored }
      - pl: "Potajemna umowa wyszła na jaw."
        ru: "Тайный договор вышел наружу."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Подчёркивает укрывательство от кого-то конкретного. Официально засекреченное — tajny, а потихоньку сделанное — potajemny." }
  - { kind: false-friend, text: "Корень tajemnica «тайна», который уже есть в словаре; ср. русское «таить», «тайна»." }
  - { kind: government, text: "Обычное прилагательное; наречие — potajemnie «тайком, украдкой»." }
  - { kind: usage, text: "Наречие potajemnie встречается чаще прилагательного: wyjechał potajemnie «он уехал тайком»." }
collocations:
  - { pl: "potajemne spotkanie", ru: "тайная встреча" }
  - { pl: "potajemnie", ru: "тайком" }
etymology: "От tajemnica «тайна», корень taić «таить»; ср. русское «таить», «тайна», «потаённый»."
memory: "potajemny — «тайный» в смысле «сделанный украдкой». Официально засекреченное — tajny. Наречие potajemnie «тайком» встречается чаще."
idioms:
  - { pl: "potajemne spotkanie", ru: "тайная встреча" }
