notes:
  - { kind: false-friend, text: "Это одна из самых красивых ловушек в языке. Польское DOGADAĆ SIĘ и русское «догадаться» собраны из одних и тех же частей — приставка DO- плюс корень *gadati, — а значат совершенно разное. По-польски это «договориться, прийти к согласию», по-русски «сообразить, понять». DOGADALIŚMY SIĘ значит «мы договорились», а не «мы догадались»; для русского смысла в польском есть DOMYŚLIĆ SIĘ. Третий член той же семьи, ZAGADKA, в обоих языках значит ровно «загадку», и это совпадение делает расхождение ещё заметнее." }
  - { kind: government, text: "Партнёр по договору вводится предлогом Z с творительным: DOGADAĆ SIĘ Z KIMŚ, как и по-русски «договориться с кем-то». Предмет договора идёт через CO DO с родительным или W SPRAWIE с родительным: DOGADALIŚMY SIĘ CO DO CENY «мы договорились насчёт цены», DOGADAĆ SIĘ W SPRAWIE TERMINU. Частица SIĘ при этом значении обязательна. Без SIĘ глагол употребляется редко и значит «договорить, обсудить до конца»: DOGADANO WSZYSTKO PRZEZ TELEFON." }
  - { kind: register, text: "Слово разговорное, потому что сам корень разговорный: GADAĆ значит «болтать, трепаться» и в официальной речи неуместно. Поэтому DOGADAĆ SIĘ годится для беседы, переговоров между своими, торга на базаре, но в договоре или протоколе пишут иначе: POROZUMIEĆ SIĘ, DOJŚĆ DO POROZUMIENIA. Очень живо причастие: JESTEŚMY DOGADANI значит «мы уже всё обговорили», а SPRAWA DOGADANA — «дело решённое». Отрицательный оборот NIE MOGĘ SIĘ Z NIM DOGADAĆ значит «я не нахожу с ним общего языка»." }
  - { kind: usage, text: "Пятьдесят три формы — подпись переходного глагола совершенного вида. Видовой партнёр — DOGADYWAĆ SIĘ, но он гораздо реже; обычно говорят просто DOGADAĆ SIĘ или описательно. Приставка DO- здесь значит доведение до конца, как в русских «договорить», «доделать»: разговор доведён до согласия. Причастие DOGADANY в живой речи работает как прилагательное и спокойно принимает формы мужского лица во множественном числе: DOGADANI WSPÓLNICY, JESTEŚMY DOGADANI." }
  - { kind: pronunciation, text: "Читается «догада́чь», три слога, ударение на предпоследнем. Все согласные твёрдые, как в русском, и единственная трудность — конечное Ć, которое даёт мягкое «чь» вместо русского «ть». Буква G всегда звучит как твёрдое «г», без оглушения и без фрикативного оттенка. В причастии DOGADANY ударение тоже на предпоследнем слоге: «догада́ны»." }
