etymology: "Приставка DO- плюс GADAĆ, от праславянского *gadati, которое значило сразу «говорить» и «предполагать, угадывать». Два языка разобрали эти смыслы по-разному, и в этом вся соль. Польский взял говорение: GADAĆ «болтать», DOGADAĆ SIĘ «договориться», POGADANKA «беседа». Русский взял угадывание: «гадать», «догадаться», «загадка», «отгадать». Единственное слово, где оба языка остались на одной стороне, — ZAGADKA и «загадка», потому что загадку и загадывают, и разгадывают. Поэтому DOGADAĆ SIĘ и «догадаться» — это один и тот же набор морфем, разошедшийся на развилке древнего значения."
memory: "Один набор морфем, два разных смысла: польское dogadać się значит «договориться», а русское «догадаться» — «сообразить». Корень *gadati значил и «говорить», и «угадывать»; польский пошёл по первому пути, русский по второму, а слово zagadka осталось у обоих одинаковым. Для русского смысла в польском есть domyślić się. Управление совпадает: dogadać się z kimś, предлог z с творительным. Слово разговорное; в документе пишут porozumieć się."
idioms:
  - { pl: "nie móc się z kimś dogadać", ru: "не находить с кем-то общего языка" }
