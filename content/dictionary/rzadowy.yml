notes:
  - { kind: false-friend, text: "Слово построено на RZĄD «правительство», и здесь прячется ловушка. Русское «рядовой» идёт от того же праславянского корня *rędъ «ряд, порядок», но значит «обычный, заурядный», а в армии — звание. Польское RZĄDOWY значит «правительственный» и ничего «рядового» в нём нет. Для русского «рядового» по-польски нужны SZEREGOWY — и как прилагательное, и как воинское звание, — или ZWYKŁY. Так один корень дал в двух языках слова о власти и о заурядности. Рядом стоит RZĄDZĄCY «правящий» и ZARZĄDOWY «относящийся к правлению», от ZARZĄD; не путайте их с нашим словом." }
  - { kind: usage, text: "В мужском личном именительном множественного прилагательные на -OWY не меняют основу и просто берут окончание -I: RZĄDOWI. Это третий случай в карточке, и самый спокойный: JAPOŃSKI даёт JAPOŃSCY с переходом -SKI в -SCY, SZARY даёт SZARZY с переходом R в RZ, а RZĄDOWY — просто RZĄDOWI. У формы есть, однако, двойник: RZĄDOWI — это ещё и дательный падеж единственного числа от существительного RZĄD. PRZEKAZANO RZĄDOWI значит «передали правительству», а RZĄDOWI URZĘDNICY — «правительственные чиновники». Различает только согласование." }
  - { kind: government, text: "Согласуется с существительным в роде, числе и падеже. Относительное, степеней сравнения не образует. Частотные сочетания: PROGRAM RZĄDOWY «правительственная программа», DOTACJA RZĄDOWA, KOMISJA RZĄDOWA, AGENCJA RZĄDOWA, ŹRÓDŁA RZĄDOWE «правительственные источники». Противопоставляется SAMORZĄDOWY «муниципальный, относящийся к местному самоуправлению» и PRYWATNY. Для словосочетания «государственный» в широком смысле чаще употребляется PAŃSTWOWY, и разницу стоит держать: RZĄDOWY о кабинете министров, PAŃSTWOWY о государстве как целом." }
  - { kind: pronunciation, text: "Читается «жондо́вы», три слога, ударение на предпоследнем. Начальное RZ даёт «ж», потому что перед ним нет глухого согласного. Носовое Ą перед D читается «он». Буква W между гласными звучит «в». Конечное -Y это «ы». В мужском личном множественном RZĄDOWI конечное -I мягкое, и предшествующее W смягчается: «жондо́ви». Сравните с существительным RZĄD, где конечное D оглушается: «жонт»." }
