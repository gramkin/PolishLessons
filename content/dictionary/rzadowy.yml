etymology: "От RZĄD «правительство», из праславянского *rędъ «ряд, порядок», того же корня, что русские «ряд», «порядок», «обряд», «наряд». Польский построил на идее порядка названия власти — RZĄD «правительство», URZĄD «учреждение», RZĄDZIĆ «править», — а русский оставил корень при упорядоченности и получил «ряд» и «рядовой». Поэтому RZĄDOWY и «рядовой» — одно гнездо и несовместимые значения: одно о кабинете министров, другое о заурядности. Суффикс -OWY образует относительные прилагательные от существительных и отвечает русскому -ОВЫЙ: RZĄDOWY, SPORTOWY, BENZYNOWY. В мужском личном множественном такие прилагательные берут -I без изменения основы, в отличие от основ на -SKI и на -R."
memory: "Одно гнездо, несовместимые смыслы: rządowy от rząd «правительство» — «правительственный», а русское «рядовой» от того же корня *rędъ значит «заурядный». Для «рядового» нужны szeregowy или zwykły. Мужской личный множественного rządowi — без изменения основы, в отличие от japońscy и szarzy; и эта форма совпадает с дательным единственного от rząd: przekazano rządowi «передали правительству»."
