  - { kind: false-friend, text: "Из немецкого Schande «позор» через чешский; русское «ганьба» живёт в южных говорах и в украинском." }
  - { kind: government, text: "Женский род: ta hańba, tej hańby." }
  - { kind: usage, text: "Слово употребляется в единственном числе. Выкрик Hańba! — именительный падеж, а не звательный." }
