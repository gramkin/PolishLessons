# review
id: hanba
format: 2
lemma: "hańba"
rank: 2270
pos: noun
pron: { cyr: "ха́ньба" }
senses:
  - id: disgrace
    ru: "позор, бесчестье"
    examples:
      - pl: "To była hańba."
        ru: "Это был позор."
        source: { kind: translated, id: 3960522 }
      - pl: "Hańba temu, kto widzi w tym coś nieprzystojnego."
        ru: "Позор тому, кто видит в этом что-то непристойное."
        source: { kind: translated, id: 746161 }
      - pl: "Przez ciebie nasza rodzina okryła się hańbą."
        ru: "Из-за тебя наша семья покрылась позором."
        source: { kind: translated, id: 2607600 }
  - id: shame-on
    ru: "позор! (как восклицание)"
    examples:
      - pl: "Hańba! — krzyczeli zebrani."
        ru: "Позор! — кричали собравшиеся."
        source: { kind: authored }
      - pl: "To hańba dla całego kraju."
        ru: "Это позор для всей страны."
        source: { kind: authored }
notes:
  - { kind: usage, text: "okryć się hańbą «покрыться позором» — с творительным падежом, ровно как в русском." }
  - { kind: usage, text: "Hańba! как выкрик на демонстрации — то же самое, что русское «Позор!»." }
  - { kind: false-friend, text: "Из немецкого Schande «позор» через чешский; русское «ганьба» живёт в южных говорах и в украинском." }
  - { kind: government, text: "Женский род: ta hańba, tej hańby." }
collocations:
  - { pl: "okryć się hańbą", ru: "покрыться позором" }
  - { pl: "hańba dla kraju", ru: "позор для страны" }
etymology: "Из немецкого Schande «позор» через чешский; ср. украинское «ганьба» и русские южные говоры."
memory: "hańba — «позор». Запомните okryć się hańbą «покрыться позором», с творительным как в русском, и выкрик Hańba! «Позор!»."
