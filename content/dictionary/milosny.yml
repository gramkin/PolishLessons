notes:
  - { kind: usage, text: "В мужском личном именительном множественного S переходит в Ś: MIŁOŚNI. Это третье большое чередование в этой позиции рядом с -SKI в -SCY и R в RZ, и работает оно у основ на S: ŁASY даёт ŁASI, BOSY даёт BOSI. Для вещей и для женского рода основа не меняется: LISTY MIŁOSNE, POWIEŚĆ MIŁOSNA. Прилагательное относительное, степеней сравнения не образует, поэтому форм одиннадцать. Обратите внимание, что Ś появляется здесь по той же причине, что в самом существительном MIŁOŚĆ: мягкость перед передним гласным." }
  - { kind: false-friend, text: "Значение совпадает с русским «любовным», но рядом стоят два слова, которые легко спутать. MIŁY значит «милый, приятный», и это слово повседневное: BĄDŹ TAK MIŁY «будь так добр». MIŁOSNY относится только к любви как чувству и теме: LIST MIŁOSNY, POEZJA MIŁOSNA. А MIŁOSIERNY значит «милосердный», от MIŁOSIERDZIE. Русское «милостный» и «милостивый» отвечают скорее польскому ŁASKAWY. Так одно гнездо дало четыре слова с разными областями, и путать MIŁOSNY с MIŁY значит сказать «приятное письмо» вместо «любовного»." }
  - { kind: government, text: "Согласуется с существительным в роде, числе и падеже. Частотные сочетания: LIST MIŁOSNY «любовное письмо», POWIEŚĆ MIŁOSNA «любовный роман», WIERSZ MIŁOSNY, WYZNANIE MIŁOSNE «любовное признание», HISTORIA MIŁOSNA «любовная история». Существительное, от которого образовано прилагательное, — MIŁOŚĆ «любовь», и у него шесть форм, как у всех слов на -OŚĆ. Для «влюблённого» нужно другое слово: ZAKOCHANY, а для «любимого» — UKOCHANY или KOCHANY." }
  - { kind: pronunciation, text: "Читается «миуо́сны», три слога, ударение на предпоследнем. Буква Ł даёт неслоговое «у», поэтому второй слог звучит «уо», а не «ло». Группа SN выговаривается слитно. Конечное -Y это «ы». В мужском личном множественном MIŁOŚNI буква Ś даёт мягкое «сь»: «миуо́сьни». В форме MIŁOSNĄ носовое Ą читается «он»: «миуо́снон». Сравните с MIŁY, которое звучит «ми́уы», всего два слога." }
