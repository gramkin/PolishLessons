etymology: "От MIŁOŚĆ «любовь», а то — от MIŁY, из праславянского *milъ «милый, дорогой», того же корня, что русские «милый», «милость», «умиление». Суффикс -OSNY образует прилагательные от существительных на -OŚĆ и отвечает русскому -ОСТНЫЙ: MIŁOSNY и «милостный» по составу одинаковы, хотя значения разошлись. Русский от «любви» образовал «любовный» с другим корнем вовсе, потому что для чувства выбрал слово «любовь», а не производное от «милого»; польский же построил и существительное, и прилагательное на одном корне MIŁ-. Отсюда в польском гнезде MIŁOŚĆ, MIŁOSNY, MIŁOSIERDZIE, MIŁOŚNIK «любитель», и все они держатся за «милого»."
memory: "Мужской личный множественного miłośni, с s→ś — третье большое чередование в этой позиции после -ski/-scy и r/rz. Значение как у «любовного», но рядом два ложных соседа: miły — «милый, приятный» (bądź tak miły), miłosierny — «милосердный». Польский построил и «любовь», и «любовный» на корне «милого»: miłość, miłosny, miłośnik «любитель»."
