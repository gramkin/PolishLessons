      - pl: "Nie bądź frajerem, sprawdź rachunek."
        ru: "Не будь лохом, проверь счёт."
        source: { kind: authored }
  - id: no-suckers
    ru: "в отрицании: дураков нет"
    examples:
      - pl: "Nie ma frajerów, każdy liczy swoje."
        ru: "Дураков нет, каждый считает своё."
        source: { kind: authored }
      - pl: "Frajerów tu nie znajdziesz."
        ru: "Лохов ты здесь не найдёшь."
        source: { kind: authored }
      - pl: "Frajerzy zawsze płacą za wszystkich."
        ru: "Лохи всегда платят за всех."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ЭТО РУССКИЙ «ФРАЕР», И ПРОИСХОЖДЕНИЕ У НИХ ОБЩЕЕ. Оба слова восходят к немецкому Freier, и в русский оно попало как раз через эти края, с польско-идишским посредничеством. Но значения разошлись. Польское frajer — это «лох, простофиля», тот, кого легко обмануть, слово обиходно-грубоватое. Русский «фраер» ушёл в блатной язык и значит скорее «не вор, чужой» или «пижон». Общее у них одно: оба нелестные." }
  - { kind: register, text: "Слово разговорное и обидное, хотя не нецензурное. В речи живёт прежде всего в отрицании: nie ma frajerów «дураков нет», nie rób ze mnie frajera «не делай из меня дурака». В письменной и вежливой речи его избегают." }
  - { kind: pronunciation, text: "Три слога, ударение на предпоследнем: FRA-jer, «фра́йэр». В предложном падеже r переходит в rz — o frajerze, — а именительный множественного тоже с rz, но с другим окончанием: frajerzy. Та же пара, что у aktor: aktorze и aktorzy." }
collocations:
  - { pl: "nie ma frajerów", ru: "дураков нет" }
  - { pl: "zrobić z kogoś frajera", ru: "сделать из кого-л. дурака" }
  - { pl: "czuć się frajerem", ru: "чувствовать себя дураком" }
family:
  - { pl: "frajerstwo", ru: "простофильство, глупость", relation: derived }
  - { pl: "frajerski", ru: "дурацкий, лоховской", relation: derived }
etymology: "Из немецкого Freier «жених, искатель», буквально «свободный», через идиш. В воровском жаргоне так называли человека со стороны, не из своих, а оттуда слово разошлось в двух направлениях: польский сделал из него простофилю, русский — чужака и пижона. Отсюда frajerstwo и frajerski."
memory: "frajer — «лох, простофиля», и это тот же самый «фраер», только в русском он ушёл в блатной язык, а в польском остался обиходным. Падежи как у aktor: o frajerze в предложном, frajerzy во множественном."
idioms:
  - { pl: "nie ma frajerów", ru: "дураков нет" }
  - { pl: "zrobić z kogoś frajera", ru: "сделать из кого-л. дурака" }
