senses:
  - id: uplift
    ru: "поднимать, выдавливать вверх (горы, пласты; геол.)"
    examples:
      - pl: "Ruchy tektoniczne powoli wypiętrzają góry."
        ru: "Тектонические движения медленно поднимают горы."
        source: { kind: authored }
      - pl: "Lodowiec wypiętrza przed sobą wały ziemi."
        ru: "Ледник выдавливает перед собой земляные валы."
        source: { kind: authored }
      - pl: "Nacisk płyt wypiętrzał warstwy skał."
        ru: "Давление плит поднимало пласты горных пород."
        source: { kind: authored }
  - id: tower
    ru: "wypiętrzać się: вздыматься, громоздиться ввысь"
    examples:
      - pl: "Nad miastem wypiętrzają się ciemne chmury."
        ru: "Над городом вздымаются тёмные тучи."
        source: { kind: authored }
      - pl: "Fale wypiętrzały się coraz wyżej."
        ru: "Волны вздымались всё выше."
        source: { kind: authored }
notes:
  - { kind: register, text: "Книжное, в первую очередь геологическое слово: RUCHY TEKTONICZNE WYPIĘTRZAJĄ GÓRY «тектонические движения поднимают горы». С SIĘ — тоже книжно и образно: о горах, облаках, волнах, которые «вздымаются». В быту про кучи и стопки говорят PIĘTRZYĆ SIĘ." }
  - { kind: usage, text: "Несовершенный вид; совершенный — WYPIĘTRZYĆ: ALPY WYPIĘTRZYŁY SIĘ MILIONY LAT TEMU «Альпы поднялись миллионы лет назад». Спряжение на -AM: WYPIĘTRZAM, WYPIĘTRZASZ, WYPIĘTRZAJĄ. Мужско-личное страдательное WYPIĘTRZANI в карточку не включено: поднимают пласты и горы, а не людей." }
  - { kind: pronunciation, text: "Читается «выпе́нтшаць»: Ę перед T — «эн», TRZ — «тш» (RZ после глухого T оглушается). Ударение на предпоследнем слоге: WYPIĘTRZAM — «выпе́нтшам»." }
collocations:
  - { pl: "wypiętrzać góry", ru: "поднимать горы (о тектонике)" }
  - { pl: "wypiętrzać się ku niebu", ru: "вздыматься к небу" }
  - { pl: "wypiętrzać warstwy skał", ru: "поднимать пласты горных пород" }
family:
  - { pl: "wypiętrzyć", ru: "поднять, вздыбить", relation: aspect }
  - { pl: "piętro", ru: "этаж, ярус", relation: root, id: pietro }
  - { pl: "piętrzyć", ru: "громоздить, нагромождать", relation: root }
  - { pl: "wypiętrzenie", ru: "поднятие (земной коры)", relation: derived }
etymology: "Приставка WY- плюс PIĘTRZYĆ «громоздить ярусами», от PIĘTRO «этаж, ярус»."
memory: "Piętro — этаж: wypiętrzać — выводить вверх этаж за этажом. Ruchy skorupy ziemskiej wypiętrzają góry — земная кора поднимает горы ярус за ярусом."
