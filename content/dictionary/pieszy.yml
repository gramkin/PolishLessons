# review
id: pieszy
format: 2
lemma: "pieszy"
rank: 5998
pos: adj
pron: { cyr: "пе́шы" }
senses:
  - id: on-foot
    ru: "пеший, пешеходный"
    examples:
      - pl: "Latem uwielbiam piesze wycieczki po lesie."
        ru: "Летом я обожаю пешие прогулки по лесу."
        source: { kind: authored }
      - pl: "Szlak pieszy prowadzi przez las na szczyt."
        ru: "Пешеходная тропа ведёт через лес на вершину."
        source: { kind: authored }
      - pl: "Rynek w centrum jest strefą pieszą."
        ru: "Площадь в центре — пешеходная зона."
        source: { kind: authored }
  - id: pedestrian
    ru: "пешеход"
    note: "субстантивированное прилагательное: pieszy, piesi"
    examples:
      - pl: "Uważaj na rowerzystów i pieszych."
        ru: "Будь осторожен с велосипедистами и пешеходами."
        source: { kind: translated, id: 6102836 }
      - pl: "Kierowca autobusu nie widział pieszego."
        ru: "Водитель автобуса не видел пешехода."
        source: { kind: translated, id: 12470404 }
notes:
  - { kind: usage, text: "Польское PIESZY делает работу двух русских слов. Как прилагательное оно значит «пеший, пешеходный»: PIESZA WYCIECZKA «пеший поход», SZLAK PIESZY «пешеходная тропа». Как существительное — «пешеход»: PIESZY WSZEDŁ NA JEZDNIĘ «пешеход вышел на проезжую часть». Отдельного слова вроде «пешеход» в обиходе нет, и знаменитый переход называется PRZEJŚCIE DLA PIESZYCH, буквально «переход для пеших»." }
  - { kind: usage, text: "Как существительное PIESZY склоняется по-прежнему как прилагательное: PIESZEGO, PIESZEMU, PIESZYM, во множественном числе PIESI, PIESZYCH. Наречие «пешком» — PIESZO или разговорное PIECHOTĄ: IDĘ PIESZO «иду пешком». Степеней сравнения у слова нет." }
  - { kind: pronunciation, text: "Читается «пе́шы»: IE после P даёт мягкое «пе», SZ — твёрдое «ш», за которым Y звучит как «ы». Во множественном числе мужско-личной формы SZ переходит в Ś: PIESI, «пе́сьи»." }
collocations:
  - { pl: "piesza wycieczka", ru: "пеший поход" }
  - { pl: "szlak pieszy", ru: "пешеходная тропа" }
  - { pl: "strefa piesza", ru: "пешеходная зона" }
family:
  - { pl: "pieszo", ru: "пешком", relation: derived }
  - { pl: "piechota", ru: "пехота", relation: root, id: piechota }
  - { pl: "piechur", ru: "пешеход, любитель ходить пешком", relation: root }
  - { pl: "zmotoryzowany", ru: "моторизованный, на машине", relation: antonym }
synonyms: ["niezmotoryzowany"]
etymology: "Общеславянское слово, родственное русским «пеший» и «пешком» и польскому PIECHOTA «пехота»."
memory: "PIESZY — «пеший», а ещё сам пешеход. Przejście dla pieszych — переход «для пеших», то есть пешеходный переход."
idioms:
  - { pl: "przejście dla pieszych", ru: "пешеходный переход" }
