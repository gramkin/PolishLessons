# review
id: zejsc
format: 2
lemma: "zejść"
rank: 945
pos: verb
aspect: perf
pron: { cyr: "зэйсьць" }
senses:
  - id: go-down
    ru: "сойти, спуститься"
    examples:
      - pl: "Zejdź ze swojego konia."
        ru: "Слезай с твоей лошади."
        source: { kind: tatoeba, id: 3656217 }
      - pl: "Zejdźmy tą ścieżką."
        ru: "Давай спустимся по этой тропинке."
        source: { kind: tatoeba, id: 368146 }
      - pl: "Ann zeszła na dół."
        ru: "Анна спустилась вниз."
        source: { kind: translated, id: 559497 }
  - id: get-off
    ru: "zejść z czegoś — сойти с чего-л., уйти"
    examples:
      - pl: "Zejdź mi z z drogi."
        ru: "Уйди с моей дороги."
        source: { kind: tatoeba, id: 3462230 }
      - pl: "Tom zszedł ze sceny."
        ru: "Том сошёл со сцены."
        source: { kind: tatoeba, id: 5377697 }
      - pl: "Zeszli z drzewa."
        ru: "Они слезли с дерева."
        source: { kind: translated, id: 757229 }
  - id: come-off
    ru: "сойти, отойти (о пятне); пройти (о времени)"
    examples:
      - pl: "Plama z atramentu nie zejdzie w praniu."
        ru: "Чернильное пятно не сойдёт при стирке."
        source: { kind: translated, id: 3549150 }
      - pl: "I tak zeszło do południa."
        ru: "Так и прошло до полудня."
        source: { kind: translated, id: 1449028 }
      - pl: "Ta dziewczynka zejdzie na złą drogę, jeśli nikt się nią nie zaopiekuje."
        ru: "Эта девочка собьётся с пути, если о ней никто не позаботится."
        source: { kind: translated, id: 367305 }
notes:
  - { kind: government, text: "zejść Z czegoś «сойти с чего-то» — родительный после z: zejść ze sceny «сойти со сцены», zejść z drogi «уйти с дороги». Zejdź mi z drogi значит «Уйди с моей дороги»." }
  - { kind: usage, text: "Несовершенный вид — schodzić. Прошедшее время мужского рода нерегулярно: zszedł, zszedłem — с беглым e, как у wszedł от wejść." }
  - { kind: false-friend, text: "Форма zeszły выглядит как прошедшее время, но чаще это прилагательное «прошлый»: w zeszły weekend «в прошлые выходные», zeszły miesiąc «прошлый месяц». Различает контекст." }
  - { kind: usage, text: "Переносно: zejść na psy «пойти прахом, опуститься», zejść z obłoków na ziemię «спуститься с небес на землю». О пятне zejść значит «сойти, отстираться»." }
collocations:
  - { pl: "zejść na dół", ru: "спуститься вниз" }
  - { pl: "zejdź z drogi", ru: "уйди с дороги" }
  - { pl: "zejść ze sceny", ru: "сойти со сцены" }
  - { pl: "zejść na psy", ru: "пойти прахом" }
family:
  - { pl: "schodzić", ru: "сходить", relation: aspect }
  - { pl: "iść", ru: "идти", relation: root, id: isc }
  - { pl: "zejście", ru: "спуск", relation: derived }
etymology: "Из z- + iść «идти», с беглым e в прошедшем: zszedł. Русское «сойти» собрано так же, и приставка работает одинаково."
memory: "zejść — «сойти, спуститься». Управление: zejść Z czegoś, с родительным — zejdź z drogi «уйди с дороги». Прошедшее мужского рода нерегулярно: zszedł, zszedłem. И не спутайте zeszły: чаще это прилагательное «прошлый», а не форма глагола."
idioms:
  - { pl: "zejść na dół", ru: "спуститься вниз" }
  - { pl: "zejdź z drogi", ru: "уйди с дороги" }
  - { pl: "zejść na psy", ru: "пойти прахом" }
