notes:
  - { kind: false-friend, text: "Один польский глагол отвечает сразу двум русским, и кулинарное значение русскому в голову не придёт. DUSIĆ значит и «душить», и «тушить» еду: DUSZONE MIĘSO это «тушёное мясо», DUSIĆ WARZYWA — «тушить овощи». Связь между значениями прямая и даже логичная: тушат под крышкой, то есть еда томится в собственном пару, как бы задыхается. Русское «тушить» идёт от совсем другого корня и с дыханием не связано, поэтому опереться на него нельзя." }
  - { kind: usage, text: "Пятьдесят три формы — подпись переходного глагола совершенного вида. В основе работает чередование S и SZ, и оно неровное: первое лицо единственного и третье множественного дают SZ — UDUSZĘ, UDUSZĄ, — а прочие формы сохраняют мягкое Ś: UDUSISZ, UDUSI, UDUSIMY. Такую же неровность давали WCISNĄĆ со своим S и Ś и NARAZIĆ с Z и Ż; это общий польский образец, и узнавать его стоит по первой форме. Видовой партнёр — DUSIĆ, и у него оба значения те же." }
  - { kind: government, text: "Прямое дополнение в винительном: UDUSIĆ MIĘSO, UDUSIĆ WARZYWA. Среда, в которой тушат, идёт с предлогом W и предложным: UDUSIĆ W WINIE, W SOSIE, W MAŚLE. Условие готовки выражается оборотом POD PRZYKRYCIEM «под крышкой». Во втором значении дополнением бывает живое существо, и падеж тот же винительный. Переносное UDUSIĆ COŚ W ZARODKU совпадает с русским «задушить в зародыше» слово в слово, включая предлог." }
  - { kind: pronunciation, text: "Читается «уду́сиць», три слога, ударение на предпоследнем. Сочетание SI перед гласной даёт мягкое «сь», поэтому середина слова звучит «дуси», а не «души». Зато в формах с SZ слышно твёрдое «ш»: UDUSZĘ это «уду́шэ», UDUSZONY — «удушо́ны». Эта мена «сь» и «ш» внутри одной парадигмы и есть главная трудность слова, поэтому проговаривать пару UDUSISZ и UDUSZĘ стоит вместе. Конечное Ć мягкое, «ць»." }
  - { kind: register, text: "Кулинарное значение нейтральное и самое частое: DUSZONE MIĘSO, DUSZONA KAPUSTA, DUSIĆ POD PRZYKRYCIEM. Второе значение принадлежит языку происшествий и переносной речи: UDUSIĆ POMYSŁ W ZARODKU, DUSIĆ W SOBIE ZŁOŚĆ «подавлять в себе злость». Прилагательное DUSZNO значит «душно» и совпадает с русским полностью: DZISIAJ JEST DUSZNO. Из того же гнезда идут DUSZA «душа», DUCH «дух» и ODDYCHAĆ «дышать»." }
