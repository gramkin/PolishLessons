etymology: "Приставка U- плюс DUSIĆ, от праславянского *dušiti, а то — от *duxъ «дух, дыхание». Русский сохранил всё гнездо целиком и на виду: «дух», «душа», «дышать», «душно», «вздох», «воздух». Польское гнездо такое же: DUCH, DUSZA, DUSZNO, ODDYCHAĆ, WESTCHNIENIE. Кулинарное значение выросло из того же образа: еду закрывают крышкой, и она томится в собственном пару, как бы лишённая воздуха. Поэтому DUSZONE MIĘSO и «задушить» — родня не только по корню, но и по картинке. Слово PODUSZKA к этому гнезду не относится вовсе: оно от POD плюс UCHO, ровно как русская «подушка»."
memory: "Один глагол на два русских: udusić значит и «задушить», и «потушить» еду. Duszone mięso это «тушёное мясо», и связь не случайна — под крышкой еда томится в собственном пару. Корень тот же, что в «духе» и «душе»: dusza, duszno, oddychać. В парадигме неровное чередование: uduszę и uduszą с твёрдым ш, но udusisz и udusi с мягким сь. И запомнить udusić coś w zarodku — точное русское «задушить в зародыше»."
idioms:
  - { pl: "udusić coś w zarodku", ru: "задушить что-то в зародыше" }
