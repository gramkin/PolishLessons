# review
id: wzdluz
format: 2
lemma: "wzdłuż"
rank: 3418
pos: prep
pron: { cyr: "вздуш" }
senses:
  - id: along
    ru: "вдоль (чего-то)"
    examples:
      - pl: "Spacerowaliśmy wzdłuż rzeki."
        ru: "Мы гуляли вдоль реки."
        source: { kind: authored }
      - pl: "Wzdłuż ulicy stoją stare kamienice."
        ru: "Вдоль улицы стоят старые дома."
        source: { kind: authored }
      - pl: "Pociąg jedzie wzdłuż wybrzeża."
        ru: "Поезд едет вдоль побережья."
        source: { kind: authored }
  - id: lengthwise
    ru: "вдоль, в длину (наречие)"
    examples:
      - pl: "Pokrój ogórek wzdłuż."
        ru: "Разрежь огурец вдоль."
        source: { kind: authored }
      - pl: "Materiał trzeba złożyć wzdłuż."
        ru: "Ткань нужно сложить вдоль."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "WZDŁUŻ — русское «вдоль», и управление то же. Подвох в произношении: Ł — это «у», поэтому не «вздлуж», а «вздуш». Вдоль и поперёк — WZDŁUŻ I WSZERZ." }
  - { kind: usage, text: "Одна форма. Работает и предлогом, WZDŁUŻ RZEKI, и наречием без дополнения: PRZECIĄĆ WZDŁUŻ, «разрезать вдоль». Поперёк — W POPRZEK, а «вширь» — WSZERZ." }
  - { kind: government, text: "Предлог требует родительного падежа, как и русское «вдоль»: WZDŁUŻ DROGI, WZDŁUŻ GRANICY, WZDŁUŻ BRZEGU." }
  - { kind: pronunciation, text: "Читается «вздуш», один слог. WZD — звонкое «вз» перед D, Ł — «у», конечное Ż оглушается в «ш»." }
collocations:
  - { pl: "wzdłuż rzeki", ru: "вдоль реки" }
  - { pl: "wzdłuż i wszerz", ru: "вдоль и поперёк" }
  - { pl: "przeciąć wzdłuż", ru: "разрезать вдоль" }
family:
  - { pl: "długi", ru: "длинный", relation: root, id: dlugi }
  - { pl: "długość", ru: "длина", relation: root, id: dlugosc }
  - { pl: "wzdłużny", ru: "продольный", relation: derived }
etymology: "Из W + основа DŁUG- «длинный, долгий» с чередованием G и Ż. Русское «вдоль» — от «долгий», то есть тот же корень. Польскому ŁU отвечает русское «ол»: DŁUGI — «долгий»."
memory: "Wzdłuż — вдоль, с родительным: wzdłuż rzeki. Читается «вздуш», ł — «у». Wzdłuż i wszerz — вдоль и поперёк. Długi — длинный, тот же корень."
idioms:
  - { pl: "wzdłuż i wszerz", ru: "вдоль и поперёк" }
