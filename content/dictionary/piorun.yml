etymology: "От имени праславянского громовержца Перуна, того самого, чьи идолы стояли в Киеве и Новгороде. В польском имя бога стало обычным названием молнии и живёт так до сих пор, а в русском его вытеснили «молния» и «гром», и Перун остался только историческим именем. Из того же корня идёт PIORUNOCHRON, буквально «громоотвод», слово, собранное точно так же, как русское."
memory: "Слово выглядит чужим, а родственник у него знаменитый: piorun это тот самый Перун, славянский громовержец. В польском имя бога осталось обычным словом для молнии, а русский заменил его на «молнию» и «гром». Читается «пьо́рун»: сочетание pio даёт «пьо» в один приём. Два родительных единственного, pioruna и piorunu: первый трактует молнию как живую."
idioms:
  - { pl: "jak piorun z jasnego nieba", ru: "как гром среди ясного неба" }
