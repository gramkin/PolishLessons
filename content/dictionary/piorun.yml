notes:
  - { kind: false-friend, text: "Прямого русского слова нет, зато есть прямой родственник, и он неожиданный: PIORUN это тот самый Перун, громовержец славянского язычества. Имя бога осталось в польском обычным словом для молнии, а русский заменил его на «молнию» и «гром», оставив Перуна только в учебниках истории. Поэтому слово выглядит чужим, а на самом деле знакомо каждому, кто слышал о славянских богах." }
  - { kind: usage, text: "Одиннадцать форм, мужской род. Любопытны два родительных единственного: PIORUNA и PIORUNU. Первый трактует молнию как существо одушевлённое, второй как явление, и оба в ходу, хотя PIORUNA звучит живее и чаще в народной речи. В местном падеже PIORUNIE, с обычным смягчением. Множественное PIORUNY совершенно обиходно, потому что в грозу их много." }
  - { kind: government, text: "Молния ударила во что-либо — PIORUN UDERZYŁ W COŚ, предлог W с винительным, как и по-русски. Как гром среди ясного неба — JAK PIORUN Z JASNEGO NIEBA, предлог Z с родительным. Грохот молнии — HUK PIORUNU, родительный без предлога. От молнии загорелось — OD PIORUNA, предлог OD с родительным, где русский скажет «от молнии» тоже родительным." }
  - { kind: pronunciation, text: "Читается «пьо́рун», два слога, ударение на первом. Сочетание PIO даёт «пьо», в один приём: мягкое P и сразу «о». Для русского уха это непривычно, потому что по написанию ждёшь «пио» в два слога. Конечное N твёрдое. В местном падеже PIORUNIE слышно «пьору́не», с ударением на предпоследнем слоге и мягким «не»." }
  - { kind: register, text: "Слово нейтральное и повседневное: PIORUN UDERZYŁ, PIORUNOCHRON «громоотвод», BURZA Z PIORUNAMI «гроза с молниями». В сравнениях оно частое и выразительное: SZYBKI JAK PIORUN, JAK PIORUN Z JASNEGO NIEBA. Есть и восклицание: DO PIORUNA! примерно как русское «чёрт побери», старомодное и беззлобное. Прилагательное PIORUNUJĄCY значит «сокрушительный»." }
collocations:
  - { pl: "piorun uderzył", ru: "молния ударила" }
