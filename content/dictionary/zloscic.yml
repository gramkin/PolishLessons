notes:
  - { kind: pronunciation, text: "Основа у этого глагола двоится, и распределение строгое. Сочетание ŚĆ стоит в инфинитиве, во втором и третьем лице единственного, в первом и втором множественного, во всём прошедшем и условном и в повелительном: ZŁOŚCIĆ, ZŁOŚCISZ, ZŁOŚCI, ZŁOŚCIMY, ZŁOŚCICIE, ZŁOŚCIŁ, ZŁOŚĆ. А SZCZ появляется ровно в двух местах настоящего времени — в первом лице единственного ZŁOSZCZĘ и в третьем множественного ZŁOSZCZĄ, — и за ними следует всё, что построено на этой основе: причастия ZŁOSZCZĄCY и ZŁOSZCZONY, отглагольное ZŁOSZCZENIE, деепричастие ZŁOSZCZĄC и безличное ZŁOSZCZONO." }
  - { kind: usage, text: "Мена эта касается не всех глаголов на -IĆ, а только тех, чья основа кончается на ś, ź, ść или źdź: перед окончаниями -ę и -ą они твердеют в sz, ż, szcz, żdż. Так же ведут себя PROSIĆ (PROSZĘ, PROSZĄ при PROSI), NOSIĆ (NOSZĘ, NOSZĄ), WOZIĆ (WOŻĘ, WOŻĄ) и JEŹDZIĆ (JEŻDŻĘ, JEŻDŻĄ). А CHODZIĆ, PŁACIĆ, KRĘCIĆ, TRACIĆ и RZUCIĆ не меняют основы вовсе, у KARMIĆ, MÓWIĆ, LUBIĆ и ROBIĆ разница только на письме, потому что -ię и -ią уже сами обозначают мягкость, а у глаголов на -AĆ, как POTWIERDZAĆ, основа одна во всех формах. Русскому картина знакома, но не до конца. Русский тоже меняет основу в этом месте: «просить» даёт «прошу». Но дальше языки расходятся: русский меняет её только в первом лице единственного, а третье множественное оставляет мягким — «просят». Польский же меняет в обоих, и получается ZŁOSZCZĄ, PROSZĄ. Русскому проще всего запомнить так: где в русском «прошу», там в польском ещё и «просят» перестроилось." }
  - { kind: usage, text: "Форм шестьдесят три: несовершенный переходный, полный набор. Повелительное ZŁOŚĆ получается из третьего лица ZŁOŚCI отбрасыванием -i, по правилу из карточки KARMIĆ, и мягкость здесь уже на месте, так что доделывать нечего. Страдательное причастие даёт ZŁOSZCZONY с o, а мужскую личную форму множественного ZŁOSZCZENI с e — четвёртый случай этой мены после przyłączony и karmiony." }
  - { kind: government, text: "Без частицы глагол переходный и значит «злить кого-то»: TO MNIE ZŁOŚCI «это меня злит», ZŁOŚCIŁ NAS SWOIM SPOKOJEM. С частицей SIĘ он значит «злиться» и требует предлога NA с винительным: ZŁOŚCIĆ SIĘ NA KOGOŚ, ZŁOSZCZĘ SIĘ NA SIEBIE. Русский строит так же — «злиться на кого-то», — и даже падеж после предлога совпадает, так что переносится конструкция целиком. В речи возвратная форма встречается гораздо чаще прямой." }
collocations:
  - { pl: "złościć się na kogoś", ru: "злиться на кого-то" }
  - { pl: "to mnie złości", ru: "это меня злит" }
