family:
  - { pl: "złość", ru: "злость", relation: root }
  - { pl: "zły", ru: "злой", relation: root, id: zly }
  - { pl: "rozzłościć", ru: "разозлить", relation: aspect }
etymology: "От ZŁOŚĆ «злость», а то от ZŁY «злой», из праславянского *zъlъ — того же корня, что русские «злой», «злость» и «зло». Соответствие полное во всём гнезде, и никаких подвохов в значении тут нет. Запоминать приходится только двоение основы, ść и szcz, потому что в русском на этом месте чередование другое и затрагивает лишь первое лицо."
memory: "Основа двоится: złości, złościsz, но złoszczę и złoszczą. Как prosi, prosisz, но proszę, proszą. Русский меняет основу только в «прошу», польский ещё и в третьем множественном."
idioms:
  - { pl: "nie złość się", ru: "не злись" }
  - { pl: "złościć się na cały świat", ru: "злиться на весь свет" }
