id: dosc
format: 2
lemma: "dość"
rank: 379
pos: part
pron: { cyr: "досьць" }
senses:
  - id: enough
    ru: "достаточно, хватит"
    examples:
      - pl: "Dość!"
        ru: "Хватит!"
        source: { kind: tatoeba, id: 821045 }
      - pl: "Nie wiem, czy mam dość pieniędzy."
        ru: "Я не знаю, достаточно ли у меня денег."
        source: { kind: tatoeba, id: 3656719 }
      - pl: "Dość tego!"
        ru: "Хватит об этом!"
        source: { kind: authored }
  - id: fairly
    ru: "довольно, весьма (перед прилагательным или наречием)"
    examples:
      - pl: "Tom jest dość przystojny."
        ru: "Том довольно красив."
        source: { kind: tatoeba, id: 12470549 }
      - pl: "Dość trudno jest opanować francuski w ciągu 2-3 lat."
        ru: "Довольно сложно выучить французский за 2—3 года."
        source: { kind: tatoeba, id: 352003 }
      - pl: "To dość ciekawe."
        ru: "Это довольно интересно."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Два разных dość в одном слове: «достаточно» (mam dość pieniędzy «мне хватает денег») и «довольно, весьма» перед прилагательным (dość trudny «довольно трудный»)." }
  - { kind: usage, text: "mieć dość czegoś значит «устать от чего-то, надоесть»: Mam dość tego, że ciągle się spóźniasz «Мне надоело, что ты постоянно опаздываешь»." }
  - { kind: usage, text: "Полная форма — dosyć; dość это её стянутый вариант, и в живой речи он куда обычнее." }
  - { kind: usage, text: "Одиночное Dość! — резкая реплика «Хватит!», ровно как русское «Довольно!»." }
collocations:
  - { pl: "mieć dość", ru: "быть сытым по горло" }
  - { pl: "dość dobrze", ru: "довольно хорошо" }
  - { pl: "dość często", ru: "довольно часто" }
  - { pl: "dość tego", ru: "хватит об этом" }
etymology: "Стянутая форма слова dosyć, из do + syt «сытый» — буквально «до сыта». Русское «досыта» собрано ровно из тех же двух частей."
memory: "dość — это и «достаточно», и «довольно». Разверните слово: do + syt, то есть «досыта» — отсюда и мера, и оценка. Mam dość значит «с меня хватит»."
idioms:
