pos: noun
pron: { cyr: "ко́стьюм" }
senses:
  - id: womans-suit
    ru: "женский костюм (жакет с юбкой)"
    examples:
      - pl: "Włożyła granatowy kostium."
        ru: "Она надела тёмно-синий костюм."
        source: { kind: authored }
      - pl: "Kostium uszyto na miarę."
        ru: "Костюм сшили на заказ."
        source: { kind: authored }
  - id: stage-costume
    ru: "костюм (сценический, карнавальный)"
    examples:
      - pl: "Kostiumy do spektaklu przyjechały wczoraj."
        ru: "Костюмы для спектакля приехали вчера."
        source: { kind: authored }
      - pl: "Przyszedł na bal w kostiumie pirata."
        ru: "Он пришёл на бал в костюме пирата."
        source: { kind: authored }
  - id: swimsuit
    ru: "kostium kąpielowy — купальник"
    examples:
      - pl: "Zapomniała kostiumu kąpielowego."
        ru: "Она забыла купальник."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "РУССКИЙ «КОСТЮМ» ШИРЕ ПОЛЬСКОГО — И ЭТО ПРОДОЛЖЕНИЕ ИСТОРИИ С GARNITUR. Мужской костюм по-польски GARNITUR, и только он. Kostium — это женский костюм, жакет с юбкой, либо сценический и карнавальный наряд. Сказать о мужчине «ma na sobie kostium» значит, что он в маскарадном костюме, а не в деловом." }
  - { kind: usage, text: "Третье значение практичнее первых двух: kostium kąpielowy «купальник», а в разговоре просто kostium. Плавки — kąpielówki. Прилагательное kostiumowy: film kostiumowy «историческая костюмная драма», bal kostiumowy «маскарад»." }
  - { kind: pronunciation, text: "Три слога, ударение на предпоследнем: kos-TIUM — точнее ko-STIUM с мягким ti: «ко́стьюм». В предложном падеже m смягчается: w kostiumie, тот же ряд, что в farmie, jamie и normie." }
  - { kind: register, text: "Нейтрально. В театре и кино слово профессиональное: kostiumograf «художник по костюмам». В магазине одежды kostium ищут в женском отделе, а garnitur — в мужском, и перепутать отдел проще, чем кажется." }
collocations:
  - { pl: "kostium kąpielowy", ru: "купальник" }
  - { pl: "bal kostiumowy", ru: "маскарад" }
  - { pl: "kostium na miarę", ru: "костюм на заказ" }
family:
  - { pl: "garnitur", ru: "мужской костюм", relation: derived, id: garnitur }
  - { pl: "kostiumowy", ru: "костюмный", relation: derived }
  - { pl: "strój", ru: "наряд, одеяние", relation: root, id: stroj }
etymology: "Из французского costume, а то — из итальянского costume «обычай, нрав», от латинского consuetudo. Через значение «принятый наряд, то, как принято одеваться» слово и пришло к одежде; тот же латинский корень дал английское custom. В русский слово попало тем же путём, но осталось общим для обоих полов."
memory: "kostium — женский костюм или сценический наряд; мужской деловой костюм это GARNITUR. И самое полезное значение: kostium kąpielowy «купальник». Предложный смягчает m: w kostiumie."
idioms:
