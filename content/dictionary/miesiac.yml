notes:
  - { kind: false-friend, text: "Праславянское *měsęcь значило и «луна», и «месяц». Русское «месяц» сохранило оба значения, а в польском они разошлись: miesiąc — только период, луна — księżyc." }
  - { kind: usage, text: "Счёт как в русском: jeden miesiąc, dwa / trzy / cztery miesiące, pięć miesięcy." }
  - { kind: usage, text: "za miesiąc — «через месяц», od miesiąca — «уже месяц», raz w miesiącu — «раз в месяц», co miesiąc — «каждый месяц»." }
collocations:
  - { pl: "za miesiąc", ru: "через месяц" }
  - { pl: "co miesiąc", ru: "каждый месяц" }
  - { pl: "w zeszłym miesiącu", ru: "в прошлом месяце" }
  - { pl: "miodowy miesiąc", ru: "медовый месяц" }
etymology: "Праславянское *měsęcь значило и «луна», и «месяц»; в польском «луна» стала называться księżyc, а miesiąc остался только периодом."
memory: "miesiąc — только «месяц» как период; «луна» по-польски księżyc. В русском «месяц» сохранил оба значения, а в польском они разошлись."
idioms:
