  - { pl: "właściwość", ru: "свойство", relation: derived }
etymology: "От właść «собственность, природа вещи» (праславянское *volstь) — той же основы, что русские «власть» и «волость». Буквально «относящийся к собственной природе чего-либо» → «свойственный» → «подходящий, правильный»."
memory: "właściwy — прежде всего «правильный, подходящий, нужный»: właściwa decyzja «правильное решение», we właściwym momencie «в нужный момент», właściwy człowiek na właściwym miejscu. Второе значение — «свойственный», почти всегда с sobie: z właściwą sobie energią. После существительного — «собственно»: Anglia właściwa. Не путайте с наречием właściwie «собственно говоря» — разница в одной букве. Корень тот же, что в własny «собственный» и в русском «власть»."
idioms:
