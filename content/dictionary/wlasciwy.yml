pron: { cyr: "вуасьци́вы" }
senses:
  - id: right
    ru: "правильный, подходящий, нужный"
    examples:
      - pl: "To była właściwa decyzja."
        ru: "Это было правильное решение."
        source: { kind: translated, id: 8774216 }
      - pl: "Jesteś pewien, że to właściwy pociąg?"
        ru: "Ты уверен, что это нужный поезд?"
        source: { kind: translated, id: 3363432 }
