        ru: "Это шаг в правильном направлении."
        source: { kind: translated, id: 6155118 }
  - id: characteristic
    ru: "свойственный, присущий (кому-л., чему-л.)"
    note: "В этом значении почти всегда с sobie: z właściwą sobie energią «со свойственной ему энергией»."
    examples:
      - pl: "Każdy postrzega kolory we właściwy sobie sposób."
        ru: "Каждый воспринимает цвета свойственным ему образом."
        source: { kind: translated, id: 12674278 }
      - pl: "Zabrał się do pracy z właściwym sobie spokojem."
        ru: "Он взялся за работу со свойственным ему спокойствием."
        source: { kind: authored }
  - id: proper
    ru: "собственно такой-то; надлежащий, компетентный (в канцелярском языке)"
    note: "После существительного — «собственно»: Anglia właściwa. В документах — «компетентный»: właściwy organ."
    examples:
      - pl: "Anglia właściwa nie obejmuje Walii."
        ru: "Собственно Англия не включает Уэльс."
        source: { kind: translated, id: 1913859 }
      - pl: "Należało powiadomić właściwe służby."
        ru: "Следовало уведомить соответствующие службы."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Основное значение — «правильный, подходящий, нужный»: właściwa decyzja «правильное решение», we właściwym momencie «в нужный момент», właściwy człowiek na właściwym miejscu «нужный человек на нужном месте»." }
  - { kind: false-friend, text: "Не путайте прилагательное właściwy с наречием właściwie «собственно говоря, в сущности»: Właściwie to nie wiem «Я, собственно, не знаю». Разница в одной букве, а смысл совсем разный." }
  - { kind: usage, text: "Стоя после существительного, właściwy значит «собственно»: Anglia właściwa «собственно Англия», dramat właściwy «собственно драма»." }
  - { kind: usage, text: "В канцелярском языке właściwy — «компетентный, надлежащий»: właściwy organ «компетентный орган», właściwe służby «соответствующие службы»." }
collocations:
