  - { pl: "sredni", ru: "средний (по величине), усреднённый", relation: root, id: sredni }
  - { pl: "sroda", ru: "среда (день недели)", relation: root, id: sroda }
etymology: "От ŚRODEK «середина», от праславянского корня со значением «середина», того же, что дал русские «середина», «средний» и «среда». Родня здесь особенно поучительна. ŚRODA это «среда», день посередине недели, и назван он так в обоих языках по одной и той же причине. А ŚRODEK, кроме середины, значит ещё и «средство»: ŚRODEK NASENNY это «снотворное средство». Русский эти два смысла раздал разным словам, польский оставил в одном."
memory: "Средний, но только по положению, посередине: palec srodkowy, pas srodkowy, ucho srodkowe. Средний по величине — это sredni, другое слово от того же корня, и путать их нельзя. Читается «сьродко́вы», с мягким «сь» в начале. В родне два подарка: sroda это «среда», день посередине недели, а srodek значит и «середина», и «средство», как в srodek nasenny «снотворное»."
idioms:
  - { pl: "palec środkowy", ru: "средний палец" }
formExamplesSkip:
