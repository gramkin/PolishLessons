notes:
  - { kind: false-friend, text: "Русское «средний» покрывает два смысла: средний по размеру и средний по положению. Польский их разделил. ŚREDNI значит «средний» о величине и об усреднённом: ŚREDNI WZROST «средний рост», ŚREDNIA OCENA «средняя оценка». А ŚRODKOWY значит только «тот, что посередине»: PALEC ŚRODKOWY, RZĄD ŚRODKOWY. Сказать ŚREDNI PALEC нельзя, это была бы оценка размера." }
  - { kind: usage, text: "В таблице одиннадцать форм, но живых десять. Одиннадцатая — ŚRODKOWI, именительный множественного для мужчин-людей, и её не употребляют: прилагательное относительное, оно описывает место предмета в ряду, а не человека. Примеров к этой форме в карточке поэтому нет. Прилагательное стоит после существительного: PALEC ŚRODKOWY, UCHO ŚRODKOWE, PAS ŚRODKOWY." }
  - { kind: government, text: "В среднем ухе — W UCHU ŚRODKOWYM, местный падеж, и обратите внимание, что UCHO даёт UCHU. Воспаление среднего уха — ZAPALENIE UCHA ŚRODKOWEGO, родительный, и это обычное медицинское название. Без среднего пальца — BEZ PALCA ŚRODKOWEGO, предлог BEZ с родительным. В средней части — W CZĘŚCI ŚRODKOWEJ, местный." }
  - { kind: pronunciation, text: "Читается «сьродко́вы», четыре слога, ударение на предпоследнем. Буква Ś даёт мягкое «сь», поэтому слово начинается не с «ср», а с «сьр». Сочетание DK произносится полностью. Конечная Y даёт «ы». В женском роде ŚRODKOWA это «сьродко́ва», в среднем ŚRODKOWE — «сьродко́вэ», с «э» на конце." }
  - { kind: register, text: "Слово нейтральное и обиходное. В медицине это UCHO ŚRODKOWE и ZAPALENIE UCHA ŚRODKOWEGO. На дороге — PAS ŚRODKOWY «средний ряд». В театре и в кино — RZĄD ŚRODKOWY и MIEJSCA ŚRODKOWE. А PALEC ŚRODKOWY значит и просто средний палец, и тот самый жест, причём ровно как и у нас, так что осторожность не помешает." }
