# review
id: odechciec
format: 2
lemma: "odechcieć"
rank: 2036
pos: verb
aspect: perf
pron: { cyr: "одэ́хцець" }
senses:
  - id: lose-desire
    ru: "расхотеться (безлично, с дательным)"
    examples:
      - pl: "Już mi się odechciało."
        ru: "Мне уже расхотелось."
        source: { kind: translated, id: 623614 }
      - pl: "Jak popatrzyłem na Facebooka, to żyć mi się odechciało."
        ru: "Как посмотрел на Фейсбук, так и жить расхотелось."
        source: { kind: translated, id: 3657633 }
      - pl: "Odechciało mi się jeść."
        ru: "Мне расхотелось есть."
        source: { kind: authored }
      - pl: "Nagle odechciało mu się spaceru."
        ru: "Ему вдруг расхотелось гулять."
        source: { kind: authored }
      - pl: "Po tej rozmowie odechciało nam się śmiać."
        ru: "После этого разговора нам расхотелось смеяться."
        source: { kind: authored }
notes:
  - { kind: government, text: "Безличный глагол: лицо стоит в дательном, а сам глагол — в среднем роде с się. Odechciało mi się «мне расхотелось»." }
  - { kind: usage, text: "Практически всегда встречается именно в форме odechciało się — прошедшее среднего рода." }
  - { kind: false-friend, text: "od- «от-» + chcieć «хотеть»; русское «расхотеться» устроено так же, только с другой приставкой." }
  - { kind: usage, text: "После него идёт инфинитив (odechciało mi się jeść) или родительный падеж (odechciało mu się spaceru)." }
collocations:
  - { pl: "odechciało mi się", ru: "мне расхотелось" }
etymology: "od- + chcieć «хотеть»; ср. русское «расхотеть(ся)»."
memory: "odechcieć się — «расхотеться», и работает безлично: odechciało mi się «мне расхотелось», ровно как русское безличное «расхотелось»."
idioms:
  - { pl: "odechciało mi się", ru: "мне расхотелось" }
