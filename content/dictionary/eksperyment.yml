etymology: "Из латинского experimentum «проба, испытание», от experiri «испытывать» — того же корня, что ekspert и ekspercki. В польский и в русский слово пришло через западные языки почти одновременно. Отсюда eksperymentalny, eksperymentator и eksperymentować."
memory: "eksperyment — «эксперимент». Запомнить стоит орфографию: глухое x пишется ks (eksperyment, ekspert), звонкое — gz (egzamin). И предложный смягчает t: w eksperymencie, как o ekspercie."
idioms:
