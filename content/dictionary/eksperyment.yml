notes:
  - { kind: pronunciation, text: "ЛАТИНСКОЕ X ПОЛЬСКИЙ ПИШЕТ ДВОЯКО — И ПРАВИЛО ПРОСТОЕ. Если x звучит глухо, пишут KS: eksperyment, ekspert, tekst, maksimum. Если звонко — пишут GZ: egzamin, egzotyczny, egzekucja. Русский в обоих случаях обходится буквой «кс» или «кз», поэтому выбор приходится запоминать по звуку: «эксперы́мэнт», но «эгза́мин»." }
  - { kind: usage, text: "ПРЕДЛОЖНЫЙ ПАДЕЖ СМЯГЧАЕТ T В CI: W EKSPERYMENCIE. Тот же переход уже был у ekspert — o ekspercie, и у student — o studencie. Глагол: przeprowadzić eksperyment «провести эксперимент», а не «zrobić». Прилагательное eksperymentalny, глагол eksperymentować." }
  - { kind: false-friend, text: "Значения совпадают с русскими полностью. Отличается сочетаемость: по-русски опыт «ставят», по-польски его przeprowadza się — проводят. Słowo doświadczenie значит и «опыт» как эксперимент, и «опыт» как житейский стаж, ровно как русское «опыт»; eksperyment только первое." }
