# review
id: wystep
format: 2
lemma: "występ"
rank: 1882
pos: noun
pron: { cyr: "вы́стэмп" }
senses:
  - id: performance
    ru: "выступление (артиста), номер"
    examples:
      - pl: "Jego występ był fascynujący."
        ru: "Его выступление было захватывающим."
        source: { kind: translated, id: 392977 }
      - pl: "Występ właśnie się kończył."
        ru: "Выступление как раз заканчивалось."
        source: { kind: translated, id: 919791 }
      - pl: "Czy to twój pierwszy występ?"
        ru: "Это твоё первое выступление?"
        source: { kind: translated, id: 8426991 }
      - pl: "Kiedy jest twój następny występ?"
        ru: "Когда твоё следующее выступление?"
        source: { kind: translated, id: 6554228 }
      - pl: "Jego występ był godny podziwu."
        ru: "Его выступление было достойно восхищения."
        source: { kind: translated, id: 360939 }
      - pl: "Występ tego doświadczonego artysty był rewelacyjny."
        ru: "Выступление этого опытного артиста было великолепным."
        source: { kind: translated, id: 2495939 }
  - id: ledge
    ru: "выступ, выдающаяся наружу часть"
    examples:
      - pl: "Skalny występ zasłaniał nam widok."
        ru: "Скальный выступ закрывал нам вид."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Главное значение — «выступление», а не «выступ»: jego występ был захватывающим. Значение «выступ» существует, но оно редкое и техническое." }
  - { kind: usage, text: "Глагол к этому существительному — występować / wystąpić «выступать»: występuje na scenie «он выступает на сцене»." }
  - { kind: usage, text: "Не путайте с występek «проступок, правонарушение»: корень общий, но смысл совсем другой." }
collocations:
  - { pl: "pierwszy występ", ru: "первое выступление, дебют" }
  - { pl: "występ na żywo", ru: "живое выступление" }
  - { pl: "udany występ", ru: "удачное выступление" }
etymology: "wy- + stąpić «ступить» — буквально «выступить». Русское «выступление» собрано ровно из тех же частей, поэтому слово узнаётся сразу."
memory: "występ — это «выступление»: Jego występ był fascynujący. А występek — уже «проступок». Одна буква, а смысл другой."
idioms:
  - { pl: "pierwszy występ", ru: "дебют, первое выступление" }
  - { pl: "występ na żywo", ru: "живое выступление" }
  - { pl: "występ gościnny", ru: "гастрольное выступление" }
