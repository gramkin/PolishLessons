# review
id: czesto
format: 2
lemma: "często"
rank: 714
pos: adv
pron: { cyr: "чэ́нсто" }
senses:
  - id: often
    ru: "часто"
    examples:
      - pl: "Często wagarowałem."
        ru: "Я часто прогуливал."
        source: { kind: tatoeba, id: 4327995 }
      - pl: "Często musimy czekać."
        ru: "Нам часто приходится ждать."
        source: { kind: tatoeba, id: 6015323 }
      - pl: "Często się przeziębiała."
        ru: "Она часто простужалась."
        source: { kind: tatoeba, id: 12085379 }
  - id: more-often
    ru: "częściej — чаще"
    note: "Степени нерегулярные: -st- переходит в -ść-."
    examples:
      - pl: "Pragnąłem, aby częściej pisał."
        ru: "Мне хотелось, чтобы он писал чаще."
        source: { kind: translated, id: 532146 }
      - pl: "Staram się częściej tu przychodzić."
        ru: "Я стараюсь приходить сюда чаще."
        source: { kind: translated, id: 10203111 }
      - pl: "Coraz częściej o tym myślę."
        ru: "Я всё чаще об этом думаю."
        source: { kind: authored }
  - id: most-often
    ru: "najczęściej — чаще всего; обычно"
    note: "Значит не только «чаще всего», но и просто «обычно»."
    examples:
      - pl: "To najczęściej spotykany błąd."
        ru: "Это наиболее часто встречающаяся ошибка."
        source: { kind: tatoeba, id: 13084409 }
      - pl: "Fale najczęściej są powodowane przez wiatr."
        ru: "Волны чаще всего вызываются ветром."
        source: { kind: tatoeba, id: 6696196 }
      - pl: "Do szkoły chodzimy najczęściej piechotą."
        ru: "В школу мы чаще всего ходим пешком."
        source: { kind: translated, id: 1357795 }
notes:
  - { kind: usage, text: "Степени сравнения нерегулярные, их надо выучить целиком: często — częściej — najczęściej. Согласные меняются: -st- переходит в -ść-." }
  - { kind: usage, text: "najczęściej значит не только «чаще всего», но и «обычно, в большинстве случаев»: Do szkoły chodzimy najczęściej piechotą." }
  - { kind: usage, text: "Прилагательное — częsty «частый», существительное — częstość «частота»: częsty gość «частый гость»." }
  - { kind: false-friend, text: "Не спутайте często «часто» с формами słowa część «часть» — częścią, części. Слова звучат почти одинаково, но корни разные, ровно как русские «часто» и «часть»." }
collocations:
  - { pl: "jak często?", ru: "как часто?" }
  - { pl: "coraz częściej", ru: "всё чаще" }
  - { pl: "najczęściej", ru: "чаще всего, обычно" }
  - { pl: "dość często", ru: "довольно часто" }
family:
  - { pl: "częsty", ru: "частый", relation: root }
  - { pl: "częstość", ru: "частота", relation: derived }
  - { pl: "rzadko", ru: "редко", relation: root }
etymology: "От częsty «частый», праславянское *čęstъ — то же слово, что русское «частый» и наречие «часто»."
memory: "często — «часто», корень тот же, что в русском. Выучить надо прежде всего нерегулярные степени: często — częściej — najczęściej, где -st- переходит в -ść-. И запомните вторую работу превосходной степени: najczęściej значит не только «чаще всего», но и просто «обычно» — Do szkoły chodzimy najczęściej piechotą."
idioms:
  - { pl: "jak często?", ru: "как часто?" }
  - { pl: "coraz częściej", ru: "всё чаще" }
  - { pl: "najczęściej", ru: "чаще всего, обычно" }
