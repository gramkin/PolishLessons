senses:
  - id: portrait
    ru: "портрет (живописный, фото)"
    examples:
      - pl: "Na ścianie wisi portret babci."
        ru: "На стене висит портрет бабушки."
        source: { kind: authored }
      - pl: "Malarz skończył portret króla."
        ru: "Художник закончил портрет короля."
        source: { kind: authored }
