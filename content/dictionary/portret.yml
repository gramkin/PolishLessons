        ru: "Я сделал её портрет в парке."
        source: { kind: authored }
  - id: depiction
    ru: "портрет, описание (перен.)"
    examples:
      - pl: "Książka daje portret całego pokolenia."
        ru: "Книга даёт портрет целого поколения."
        source: { kind: authored }
      - pl: "Policja opublikowała portret pamięciowy sprawcy."
        ru: "Полиция опубликовала фоторобот преступника."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Слово то же, что русское «портрет». Важное отличие одно: PORTRET PAMIĘCIOWY, «портрет по памяти», — это наш «фоторобот», составленный по описанию свидетелей. Портретист — PORTRECISTA, а писать портрет — PORTRETOWAĆ." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. В местном падеже T переходит в CI: NA PORTRECIE. То же смягчение в PORTRECISTA: T перед I становится C." }
  - { kind: government, text: "На портрете — NA PORTRECIE, местный. Портрет кого-то — PORTRET KOGOŚ, родительный: PORTRET MATKI. Позировать для портрета — POZOWAĆ DO PORTRETU, DO с родительным." }
  - { kind: pronunciation, text: "Читается «по́ртрэт», два слога, ударение на первом, тогда как у нас «портре́т». В местном падеже PORTRECIE ударение на втором слоге: «портрэ́це»." }
collocations:
  - { pl: "portret olejny", ru: "портрет маслом" }
  - { pl: "namalować portret", ru: "написать портрет" }
  - { pl: "portret rodzinny", ru: "семейный портрет" }
family:
  - { pl: "portrecista", ru: "портретист", relation: derived }
  - { pl: "portretować", ru: "писать портрет; изображать", relation: derived }
  - { pl: "autoportret", ru: "автопортрет", relation: derived }
etymology: "Из французского слова того же значения, от старого глагола «изображать, выводить черту за чертой». Русский и польский взяли одно слово, но польский по своему правилу перенёс ударение на предпоследний слог."
memory: "Portret — «портрет», но ударение на первом слоге: «по́ртрэт». Na portrecie — на портрете. Portret pamięciowy — фоторобот. Autoportret — автопортрет."
idioms:
  - { pl: "portret pamięciowy", ru: "фоторобот" }
