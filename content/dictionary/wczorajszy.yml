  - { pl: "dzisiejszy", ru: "сегодняшний", relation: root, id: dzisiejszy }
  - { pl: "jutrzejszy", ru: "завтрашний", relation: root }
etymology: "От wczoraj «вчера», из праславянского *vьčera — того же, что русское «вчера». Суффикс -szy образует прилагательные от наречий времени и отвечает русскому -шний: wczorajszy и «вчерашний» собраны одинаково, деталь в деталь."
memory: "wczorajszy — «вчерашний», и весь ряд совпадает с русским: wczorajszy, dzisiejszy, jutrzejszy. Переносный смысл тоже тот же: wczorajsze poglądy — «вчерашние взгляды». И запомни nie od wczoraj."
idioms:
