notes:
  - { kind: usage, text: "ПРИЛАГАТЕЛЬНЫЕ ОТ НАРЕЧИЙ ВРЕМЕНИ ОБРАЗУЮТСЯ ТУТ ТАК ЖЕ, КАК В РУССКОМ. Wczoraj даёт WCZORAJSZY, dziś — DZISIEJSZY, jutro — JUTRZEJSZY. Русский строит ровно тот же ряд: «вчерашний, сегодняшний, завтрашний». Суффикс -szy отвечает русскому -шний, и запоминать стоит сразу всю тройку." }
  - { kind: false-friend, text: "У слова есть переносный смысл, который совпал с русским. WCZORAJSZY значит ещё «устаревший, отживший»: wczorajsze poglądy — «вчерашние взгляды». И оборот NIE OD WCZORAJ отвечает русскому «не вчера родился», то есть «не новичок»: robię to nie od wczoraj." }
  - { kind: pronunciation, text: "Четыре слога, ударение на предпоследнем: wczo-raj-SZY, точнее wczo-RAJ-szy. Начальное w перед cz оглушается до ф, sz звучит как ш: «фчора́йшы»." }
collocations:
