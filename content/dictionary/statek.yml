id: statek
format: 2
lemma: "statek"
rank: 485
pos: noun
pron: { cyr: "ста́тэк" }
senses:
  - id: ship
    ru: "судно, корабль"
    examples:
      - pl: "Załoga opuściła statek."
        ru: "Экипаж покинул судно."
        source: { kind: tatoeba, id: 2563939 }
      - pl: "Nasz statek zbliżył się do portu."
        ru: "Наш корабль приблизился к гавани."
        source: { kind: tatoeba, id: 525621 }
      - pl: "Statek z Nowego Jorku powinien przybyć niedługo."
        ru: "Скоро должен прибыть корабль из Нью-Йорка."
        source: { kind: tatoeba, id: 1659907 }
  - id: ship-travel
    ru: "корабль (о плавании и устройстве судна)"
    examples:
      - pl: "Jestem kapitanem tego statku."
        ru: "Я капитан этого судна."
        source: { kind: tatoeba, id: 13785281 }
      - pl: "Lubię podróżować statkiem."
        ru: "Я люблю путешествовать на корабле."
        source: { kind: translated, id: 3631073 }
      - pl: "On jest na tym statku."
        ru: "Он на этом корабле."
        source: { kind: translated, id: 349622 }
notes:
  - { kind: usage, text: "Беглое e в корне: statek, но statku, statkiem — ровно как domek → domku." }
  - { kind: usage, text: "На чём плывут — творительный падеж без предлога: podróżować statkiem «путешествовать на корабле»." }
  - { kind: usage, text: "statek kosmiczny — «космический корабль»; na pokładzie statku — «на борту судна»." }
  - { kind: usage, text: "Корень тот же, что в stać «стоять»: праславянское *statъkъ. Русский «достаток» из того же гнезда, хотя значение ушло далеко." }
collocations:
  - { pl: "statek kosmiczny", ru: "космический корабль" }
  - { pl: "kapitan statku", ru: "капитан судна" }
  - { pl: "podróżować statkiem", ru: "путешествовать на корабле" }
  - { pl: "na pokładzie statku", ru: "на борту судна" }
etymology: "Праславянское *statъkъ, от *stati «стать, стоять» — исходно «то, что стоит крепко». Русский «достаток» вырос из того же корня, хотя ушёл далеко по смыслу."
memory: "statek — «судно, корабль», и беглое e ведёт себя как в domek → domku: statek → statku. Плывут на чём-то творительным падежом: podróżować statkiem."
idioms:
