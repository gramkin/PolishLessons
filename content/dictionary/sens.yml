# review
id: sens
format: 2
lemma: "sens"
rank: 568
pos: noun
pron: { cyr: "сэнс" }
senses:
  - id: meaning
    ru: "смысл, значение"
    note: "sens zdania «смысл предложения»."
    examples:
      - pl: "Mógłbyś wyjaśnić mi sens tego zdania?"
        ru: "Ты мог бы мне объяснить смысл этого предложения?"
        source: { kind: tatoeba, id: 3088568 }
      - pl: "Jaki jest sens istnienia?"
        ru: "В чём смысл существования?"
        source: { kind: translated, id: 4145022 }
      - pl: "Myślę o sensie życia."
        ru: "Я думаю о смысле жизни."
        source: { kind: translated, id: 975069 }
  - id: make-sense
    ru: "mieć sens — иметь смысл; bez sensu — бессмысленно"
    note: "To ma sens «В этом есть смысл», to nie ma sensu «это бессмысленно»."
    examples:
      - pl: "To ma sens."
        ru: "В этом есть смысл."
        source: { kind: translated, id: 4770469 }
      - pl: "To nie ma żadnego sensu."
        ru: "Это совершенно бессмысленно."
        source: { kind: tatoeba, id: 2363914 }
      - pl: "Jego słowa są bez sensu."
        ru: "Его слова бессмысленны."
        source: { kind: tatoeba, id: 13787757 }
  - id: in-a-sense
    ru: "w pewnym sensie — в некотором смысле"
    note: "Частый смягчающий оборот."
    examples:
      - pl: "W pewnym sensie jest artystą."
        ru: "В некотором смысле он художник."
        source: { kind: translated, id: 364762 }
      - pl: "To w jakimś sensie prawda."
        ru: "Это в каком-то смысле правда."
        source: { kind: translated, id: 766558 }
      - pl: "Byłem w pewnym sensie outsiderem."
        ru: "Я был в некотором смысле чужаком."
        source: { kind: translated, id: 780321 }
notes:
  - { kind: usage, text: "Ключевые обороты строятся с mieć: to ma sens «в этом есть смысл», to nie ma sensu «это бессмысленно» — во втором случае дополнение уходит в родительный из-за отрицания." }
  - { kind: usage, text: "bez sensu значит «бессмысленно, зря»: mówić bez sensu «говорить бессмыслицу»." }
  - { kind: usage, text: "w pewnym sensie «в некотором смысле» — частый смягчающий оборот." }
  - { kind: usage, text: "Прилагательное — sensowny «разумный, толковый», а bezsensowny — «бессмысленный»." }
collocations:
  - { pl: "to ma sens", ru: "в этом есть смысл" }
  - { pl: "nie ma sensu", ru: "нет смысла" }
  - { pl: "w pewnym sensie", ru: "в некотором смысле" }
  - { pl: "bez sensu", ru: "бессмысленно" }
family:
  - { pl: "sensowny", ru: "разумный", relation: derived }
  - { pl: "bezsens", ru: "бессмыслица", relation: derived }
  - { pl: "sensowność", ru: "осмысленность", relation: derived }
etymology: "Из латинского sensus «чувство, смысл» через немецкое Sinn и французское sens — то же слово, что русский «сенс» в «сенсация» и «сенсорный»."
memory: "sens — «смысл», и держится он на глаголе mieć: to ma sens «в этом есть смысл», а вот to nie ma sensu «это бессмысленно» — здесь отрицание уводит дополнение в родительный падеж, как и в русском «нет смысла». Рядом два готовых оборота: bez sensu «бессмысленно» и w pewnym sensie «в некотором смысле». Прилагательное — sensowny «разумный, толковый»."
idioms:
  - { pl: "to ma sens", ru: "в этом есть смысл" }
  - { pl: "nie ma sensu", ru: "нет смысла" }
  - { pl: "w pewnym sensie", ru: "в некотором смысле" }
formExamplesSkip:
  - { form: "sensie", cell: "Звательный", reason: "звательный падеж: для неодушевлённого существительного он практически не употребляется" }
