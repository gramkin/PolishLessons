etymology: "От NĘCIĆ «манить, прельщать», из праславянского *nętiti, с приставкой PRZY-, означающей приближение, как в русском «при-». Русская «приманка» собрана по той же схеме — приставка плюс корень со значением «манить», — но корень взят другой, *maniti, который в польском тоже есть, в слове MANIĆ «обманывать», и значение у него сдвинуто в сторону обмана. Получилось, что два языка выразили одну мысль одинаковой приставкой и разными корнями, а те корни, что совпали, разошлись по смыслу. Из польского гнезда идут PONĘTNY «привлекательный», ZANĘCIĆ «заманить» и NĘKAĆ «докучать, преследовать» — последнее показывает, что исходное значение корня было связано с настойчивым воздействием."
memory: "Схема как в русском, корень другой: przynęta от nęcić «манить», а «приманка» от «манить» — приставка одна, корни разные. Польское manić значит «обманывать», так что ложная опора рядом. Połknąć przynętę — «проглотить приманку», и переносно тоже. В дательном и местном t→c: na przynęcie, как w konflikcie и o incydencie. Носовое ę не меняется ни в одной форме."
