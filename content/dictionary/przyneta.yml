notes:
  - { kind: false-friend, text: "Значение совпадает с русской «приманкой», а корень другой. Польское PRZYNĘTA образовано от NĘCIĆ «манить, прельщать» с приставкой PRZY-; русская «приманка» построена на «манить» с той же приставкой. То есть схема образования одинаковая, а корни разные, и угадать польское слово по русскому нельзя. Глагол PRZYNĘCIĆ значит «приманить», а ZANĘCIĆ — «привлечь, заманить»; прилагательное PONĘTNY значит «привлекательный, соблазнительный» и в живой речи употребляется часто. Для рыболовной наживки есть и второе слово, ROBAK или PRZYNĘTA ŻYWA, а искусственная приманка называется BŁYSTKA." }
  - { kind: usage, text: "В дательном и местном падеже единственного числа T переходит в C: PRZYNĘCIE. Это третье слово в карточке с тем же чередованием, рядом с KONFLIKT и INCYDENT, и повторение намеренное: одно правило на трёх словах запоминается надёжнее, чем на одном. Носовое Ę при этом не меняется ни в одной форме. Родительный множественного — PRZYNĘT, с нулевым окончанием и без вставной гласной. Форма PRZYNĘTY покрывает родительный единственного вместе с именительным и винительным множественного." }
  - { kind: government, text: "Женский род. На что приманка — предлог NA с винительным: PRZYNĘTA NA SZCZUPAKA «приманка на щуку». «На приманке» — NA с местным: NA PRZYNĘCIE. Чем служит — творительный при BYĆ: NISKA CENA BYŁA TYLKO PRZYNĘTĄ. Частотные глаголы: ZARZUCIĆ PRZYNĘTĘ «забросить приманку», NADZIAĆ PRZYNĘTĘ «насадить приманку», POŁKNĄĆ PRZYNĘTĘ «проглотить приманку» — последнее употребляется и переносно, точно как по-русски: POŁKNĄŁ PRZYNĘTĘ «он проглотил приманку»." }
  - { kind: pronunciation, text: "Читается «пшынэ́нта», три слога, ударение на предпоследнем. Начальное PRZ звучит глухо, «пш», потому что P оглушает следующий согласный. Буква Y даёт «ы». Носовое Ę перед T читается «эн». В дательном и местном PRZYNĘCIE сочетание CIE даёт мягкое «це», и слово звучит «пшынэ́нце». В родительном множественного PRZYNĘT слогов два, ударение переходит на первый: «пшы́нэнт»." }
