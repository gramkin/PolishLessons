etymology: "Приставка O- плюс ŚRODEK «середина», а тот — от праславянского *serdь, того же корня, что русские «середина», «сердце» и «среда». Соответствие звуков правильное: там, где русский даёт полногласное -ЕРЕ-, польский даёт -RO- с мягким началом, как в BRZEG против «берега» и MLEKO против «молока». Приставка O- означала здесь «вокруг», и исходный смысл был «то, что лежит вокруг середины», то есть ядро с окружением — отсюда и значение средоточия, а затем учреждения. Русский построил на том же корне слово «средоточие» с тем же ходом мысли, но оставил его книжным, а для учреждения взял латинское «центр». Польский употребляет оба: CENTRUM о городском центре и OŚRODEK о заведении."
memory: "Корень как в «середине» и «сердце» (праслав. *serdь), с правильным соответствием: русское -ере- против польского -ro-, как берег и brzeg. Но значение сместилось к учреждению: ośrodek zdrowia это поликлиника, ośrodek kultury — дом культуры, ośrodek wypoczynkowy — база отдыха. Середина и средство — это środek без приставки, центр города — centrum. Беглое e пропадает: ośrodek, но ośrodka; местный ośrodku на -u, как у всех основ на k."
