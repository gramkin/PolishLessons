notes:
  - { kind: false-friend, text: "Корень тот же, что в русской «середине», но слово значит не середину, а учреждение. ŚRODEK — это и середина, и средство: W ŚRODKU «внутри, в середине», ŚRODEK NASENNY «снотворное средство». А OŚRODEK, с приставкой O-, означает центр как заведение или как средоточие деятельности. Отсюда главная практическая ловушка: OŚRODEK ZDROWIA — это не центр здоровья, а обычная поликлиника, куда ходят к участковому врачу. OŚRODEK WYPOCZYNKOWY — база отдыха, OŚRODEK SZKOLENIOWY — учебный центр. Геометрический центр круга по-польски ŚRODEK, а городской центр — CENTRUM." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Беглое E исчезает во всех косвенных формах: OŚRODEK, но OŚRODKA, OŚRODKOWI, OŚRODKIEM — ровно так же, как в PASEK и PASKA или в DOMEK и DOMKU. Местный единственного — OŚRODKU, с окончанием -U: его берут основы на заднеязычный K, G, CH, и потому W OŚRODKU, а не по общему образцу на -E. Винительный единственного равен именительному, потому что слово неодушевлённое. Родительный множественного — OŚRODKÓW. Управление: OŚRODEK CZEGO в родительном — OŚRODEK KULTURY, OŚRODEK BADAŃ." }
  - { kind: pronunciation, text: "Читается «осьро́дэк», три слога, ударение на втором. Буква Ś даёт мягкое «сь», и сочетание ŚR произносится слитно, без гласного между ними — для русского уха это непривычно, потому что в русском «ср» всегда твёрдое. Конечное K глухое и твёрдое. В косвенных формах беглое E пропадает и слово становится короче на слог: OŚRODKA звучит «осьро́тка», с оглушением D перед K. В форме OŚRODKIEM слышно «осьро́ткем», в форме OŚRODKÓW — «осьро́ткуф», где Ó даёт «у», а конечное W оглушается." }
  - { kind: register, text: "Слово нейтральное и канцелярски частое: оно стоит на вывесках, в адресах, в объявлениях. Устойчивые сочетания покрывают почти всю общественную сферу: OŚRODEK ZDROWIA, OŚRODEK KULTURY, OŚRODEK POMOCY SPOŁECZNEJ, OŚRODEK DLA CUDZOZIEMCÓW, OŚRODEK SZKOLENIA KIEROWCÓW. В переносном значении — OŚRODEK WŁADZY «центр власти», OŚRODEK OPORU «очаг сопротивления». В анатомии и физиологии OŚRODEK значит нервный центр: OŚRODEK MOWY «речевой центр». Звательная форма у слова не употребляется." }
