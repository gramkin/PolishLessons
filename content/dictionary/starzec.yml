  - { pl: "stary", ru: "старый", relation: root, id: stary }
  - { pl: "starość", ru: "старость", relation: root }
etymology: "От STARY «старый» с суффиксом -EC. Русское «старец» — то же слово, тоже книжное."
memory: "Starzec — старик, старец; в быту — staruszek. Starcy — старики. Читается «ста́жэц»."
