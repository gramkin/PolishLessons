id: starzec
format: 2
lemma: "starzec"
rank: 3843
pos: noun
pron: { cyr: "ста́жэц" }
senses:
  - id: old-man
    ru: "старик, старец"
    examples:
      - pl: "Siwy starzec siedział na ławce."
        ru: "Седой старик сидел на скамейке."
        source: { kind: authored }
      - pl: "Starzec opowiadał dzieciom bajki."
        ru: "Старик рассказывал детям сказки."
        source: { kind: authored }
      - pl: "Po latach w więzieniu wyszedł jako starzec."
        ru: "После многих лет в тюрьме он вышел стариком."
        source: { kind: authored }
  - id: elder
    ru: "старец, мудрец (книжн.)"
    examples:
      - pl: "Mądry starzec udzielił mu rady."
        ru: "Мудрый старец дал ему совет."
        source: { kind: authored }
      - pl: "Rada starców decydowała o wszystkim."
        ru: "Совет старейшин решал всё."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "STARZEC — «старик», но звучит книжно и немного печально. В быту — STARUSZEK, «старичок», или STARSZY PAN, «пожилой мужчина». Старуха — STARUSZKA. Не путайте с STARSZY — «старший»." }
  - { kind: usage, text: "Мужской род, лицо. E беглое: STARZEC, но STARCA. Множественное — STARCY. Формы STARCE и звательное STARCZE устарели." }
  - { kind: government, text: "Помочь старику — POMÓC STARCOWI, дательный. Стать стариком — STAĆ SIĘ STARCEM, творительный. Совет старейшин — RADA STARCÓW." }
  - { kind: pronunciation, text: "Читается «ста́жэц»: RZ — «ж», конечное C — «ц». Ударение на первом слоге. STARCA — «ста́рца»." }
collocations:
  - { pl: "siwy starzec", ru: "седой старик" }
  - { pl: "mądry starzec", ru: "мудрый старец" }
  - { pl: "zgarbiony starzec", ru: "сгорбленный старик" }
family:
