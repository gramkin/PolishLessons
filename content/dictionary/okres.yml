# review
id: okres
format: 2
lemma: "okres"
rank: 1593
pos: noun
pron: { cyr: "о́крэс" }
senses:
  - id: period
    ru: "период, срок"
    examples:
      - pl: "Myślę, że trzy lata to długi okres."
        ru: "Думаю, три года — долгий срок."
        source: { kind: translated, id: 599976 }
      - pl: "Okres ładnej pogody trwał długo."
        ru: "Период хорошей погоды длился долго."
        source: { kind: translated, id: 967572 }
      - pl: "Każdy wspomina swą młodość jako beztroski okres."
        ru: "Каждый вспоминает свою молодость как беззаботный период."
        source: { kind: translated, id: 705299 }
  - id: historical
    ru: "эпоха, период (исторический)"
    examples:
      - pl: "Emilio di Cavalieri był kompozytorem okresu Odrodzenia."
        ru: "Эмилио де Кавальери — композитор эпохи Возрождения."
        source: { kind: tatoeba, id: 966916 }
      - pl: "Ten zwyczaj narodził się w okresie Edo."
        ru: "Этот обычай родился в период Эдо."
        source: { kind: translated, id: 364527 }
      - pl: "W okresie Renesansu sztuki piękne w Wenecji przeżywały złoty wiek."
        ru: "В период Ренессанса изящные искусства в Венеции переживали золотой век."
        source: { kind: translated, id: 732978 }
  - id: menstruation
    ru: "месячные"
    examples:
      - pl: "Masz teraz okres?"
        ru: "У тебя сейчас месячные?"
        source: { kind: translated, id: 644977 }
      - pl: "Nie dostałam okresu."
        ru: "У меня не было месячных."
        source: { kind: translated, id: 8178633 }
notes:
  - { kind: usage, text: "Основное значение — «период, срок»: okres próbny «испытательный срок», okres ciąży «период беременности»." }
  - { kind: usage, text: "Историческое значение: w okresie Renesansu «в период Ренессанса», z okresu celtyckiego «кельтского периода»." }
  - { kind: usage, text: "Обиходно okres значит «месячные»: mieć okres. Слово нейтральное, не эвфемизм." }
  - { kind: usage, text: "Прилагательное — okresowy «периодический», наречие — okresowo «периодически»." }
collocations:
  - { pl: "okres próbny", ru: "испытательный срок" }
  - { pl: "w okresie", ru: "в период" }
  - { pl: "na okres", ru: "на срок" }
etymology: "От o- + kres «предел, конец»: буквально «очерченный предел», отсюда «отрезок времени». Русское «период» — греческое заимствование, поэтому прямого родства нет, но логика отрезка общая."
memory: "okres = «период, срок»: okres próbny «испытательный срок», w okresie Renesansu «в период Ренессанса». И третье, вполне обиходное значение — «месячные»: mieć okres."
idioms:
  - { pl: "okres próbny", ru: "испытательный срок" }
  - { pl: "w tym okresie", ru: "в этот период" }
  - { pl: "mieć okres", ru: "(у неё) месячные" }
