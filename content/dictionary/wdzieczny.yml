# review
id: wdzieczny
format: 2
lemma: "wdzięczny"
rank: 1457
pos: adj
pron: { cyr: "вдзе́нчны" }
senses:
  - id: grateful
    ru: "благодарный, признательный"
    examples:
      - pl: "Jestem wdzięczny za to, co dla mnie zrobiłeś."
        ru: "Я благодарен за то, что ты для меня сделал."
        source: { kind: tatoeba, id: 10699608 }
      - pl: "Jestem ci wdzięczny."
        ru: "Я тебе благодарен."
        source: { kind: translated, id: 933292 }
      - pl: "Będą wdzięczni."
        ru: "Они будут благодарны."
        source: { kind: tatoeba, id: 5907094 }
  - id: graceful
    ru: "изящный, грациозный; благодатный, выигрышный"
    examples:
      - pl: "Ma wdzięczną sylwetkę."
        ru: "У неё изящная фигура."
        source: { kind: authored }
      - pl: "To wdzięczny temat do rozmowy."
        ru: "Это благодатная тема для разговора."
        source: { kind: authored }
notes:
  - { kind: government, text: "wdzięczny komuś za coś — дательный лица плюс za с винительным: Jestem ci wdzięczny za pomoc «Я благодарен тебе за помощь»." }
  - { kind: usage, text: "Гнездо слова: dziękować «благодарить», dzięki «спасибо», wdzięczność «благодарность»." }
  - { kind: usage, text: "Второе значение — «изящный, грациозный»: wdzięczna sylwetka. Отсюда же wdzięczny temat «благодатная тема», wdzięczna rola «выигрышная роль»." }
  - { kind: false-friend, text: "Родственное wdzięk значит не «благодарность», а «обаяние, грация». Слова одного гнезда, но значения разошлись." }
collocations:
  - { pl: "być wdzięcznym", ru: "быть благодарным" }
  - { pl: "wdzięczny za pomoc", ru: "благодарен за помощь" }
  - { pl: "wdzięczny temat", ru: "благодатная тема" }
etymology: "От dzięki «благодарность» и dziękować «благодарить» — гнезда, пришедшего из германского danken. Русское «благодарный» собрано иначе, из «благо» и «дарить», так что совпадает только значение."
memory: "wdzięczny — «благодарный», от dziękować «благодарить». Управление: wdzięczny komuś za coś — дательный лица и za с винительным: Jestem ci wdzięczny za pomoc. И держите в голове второе значение — «изящный»: wdzięczna sylwetka."
idioms:
  - { pl: "być komuś wdzięcznym", ru: "быть кому-то благодарным" }
  - { pl: "wdzięczny temat", ru: "благодатная тема" }
  - { pl: "wdzięczna rola", ru: "выигрышная роль" }
formExamplesSkip:
  - { form: "wdzięczen", reason: "книжная краткая форма, в современном языке не употребляется" }
