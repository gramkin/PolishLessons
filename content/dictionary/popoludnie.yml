notes:
  - { kind: false-friend, text: "У РУССКОГО НЕТ ОДНОГО СЛОВА ДЛЯ ЭТОГО ОТРЕЗКА ДНЯ. Popołudnie это время от обеда до вечера, и по-русски приходится говорить описательно: «вторая половина дня», «после обеда», «днём». Польский обходится одним существительным, которое к тому же склоняется: całe popołudnie, na popołudnie, po południu." }
  - { kind: usage, text: "Различать стоит две записи. PO POŁUDNIU, в два слова, значит «после полудня, днём» и отвечает на вопрос «когда»: wrócę po południu. POPOŁUDNIE, слитно, — существительное: miłe popołudnie. Слитное написание меняет часть речи, и в диктанте это частая ошибка самих поляков." }
  - { kind: pronunciation, text: "Пять слогов, ударение на предпоследнем: po-po-łu-DNIE — точнее po-po-ŁUD-nie. Ł читается как краткое у, dni как мягкое днь: «попоуу́дне». Родительный множественного popołudni." }
collocations:
  - { pl: "po południu", ru: "днём, после обеда (во второй половине дня)" }
  - { pl: "całe popołudnie", ru: "весь день после обеда" }
