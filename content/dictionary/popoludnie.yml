family:
  - { pl: "południe", ru: "полдень; юг", relation: root, id: poludnie }
  - { pl: "przedpołudnie", ru: "первая половина дня", relation: antonym }
  - { pl: "wieczór", ru: "вечер", relation: root, id: wieczor }
etymology: "Приставка po- плюс południe «полдень», а то — из poł «пол» и dzień «день», как русский «полдень». Польское południe значит ещё и «юг»: в полдень солнце стоит на юге. Отсюда popołudnie, przedpołudnie и południowy «южный, полуденный»."
memory: "popołudnie — «вторая половина дня», одним словом там, где русскому нужно три. И следи за написанием: po południu раздельно значит «после обеда», popołudnie слитно — существительное. Корень południe это и «полдень», и «юг»."
idioms:
  - { pl: "po południu", ru: "днём, после обеда (во второй половине дня)" }
  - { pl: "leniwe popołudnie", ru: "ленивый день" }
