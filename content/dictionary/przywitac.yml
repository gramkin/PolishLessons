        ru: "Они встретили делегацию в аэропорту."
        source: { kind: authored }
      - pl: "Gości przywitano chlebem i solą."
        ru: "Гостей встретили хлебом и солью."
        source: { kind: authored }
  - id: greet-metaphor
    ru: "встретить (о явлении, новости)"
    examples:
      - pl: "Nowinę przywitano brawami."
        ru: "Новость встретили аплодисментами."
        source: { kind: authored }
notes:
  - { kind: government, text: "ПРИВЕТСТВУЮТ КОГО — ВИНИТЕЛЬНЫЙ, БЕЗ ПРЕДЛОГА: przywitać gości, przywitać nauczyciela. Русское «поздороваться С кем-то» требует предлога, польское — нет, и это самая частая ошибка. Предлог появляется только у возвратной формы: przywitać SIĘ Z kimś «поздороваться с кем-то», с творительным. Чем встречают — тоже творительный: przywitać kogoś uśmiechem, brawami, chlebem i solą." }
  - { kind: false-friend, text: "ЗНАКОМОЕ «ПРИВЕТ» ЗДЕСЬ НИ ПРИ ЧЁМ. Созвучие обманчиво: русское «привет» — от корня вет- «слово», того же, что в «совет» и «ответ». А witać восходит к другому корню, *vitati «пребывать, жить»; в русском он уцелел в «обитать» и в устаревшем «витать». Приветствие изначально было пожеланием жить и оставаться." }
  - { kind: usage, text: "Вид совершенный, несовершенная пара — witać. Приставка przy- подчёркивает встречу идущего: przywitać гостя на пороге. Рядом стоит powitać, почти то же, но торжественнее: powitanie делегации. Отглагольное существительное przywitanie значит «приветствие, встреча»: na przywitanie «в знак приветствия»." }
  - { kind: pronunciation, text: "Четыре слога в инфинитиве, ударение на предпоследнем: przy-wi-TAĆ. Группа prz звучит как «пш», а конечное -ać — как «-ать» с мягким ц на конце: «пшывита́ць». В формах прошедшего времени ударение остаётся предпоследним: przywitaliśmy — «пшывитали́шмы»." }
collocations:
  - { pl: "przywitać gości", ru: "встретить гостей" }
  - { pl: "przywitać się z kimś", ru: "поздороваться с кем-л." }
  - { pl: "na przywitanie", ru: "в знак приветствия" }
family:
  - { pl: "witać", ru: "приветствовать", relation: aspect, id: witac }
  - { pl: "powitać", ru: "приветствовать, встретить", relation: derived }
  - { pl: "przywitanie", ru: "приветствие", relation: derived }
  - { pl: "pożegnać", ru: "попрощаться", relation: antonym, id: pozegnac }
etymology: "Приставка przy- плюс witać, из праславянского *vitati «пребывать, жить, гостить»; приветствие было пожеланием остаться в живых и погостить. В русском этот корень сохранился в «обитать» (из *ob-vitati) и в книжном «витать». Похожее «привет» — от другого корня, вет- «слово». Отсюда powitać, przywitanie, powitanie, gościna."
memory: "przywitać — «поприветствовать, встретить», и приветствуют КОГО, винительным, без предлога: przywitać gości. Предлог нужен только возвратной форме: przywitać się z kimś. А созвучие с «приветом» случайно: корень тот же, что в «обитать»."
idioms:
  - { pl: "przywitać się z kimś", ru: "поздороваться с кем-л." }
  - { pl: "na przywitanie", ru: "в знак приветствия, при встрече" }
