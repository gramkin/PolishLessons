# review
id: ksiazka
format: 2
lemma: "książka"
rank: 481
pos: noun
pron: { cyr: "ксьо́ншка" }
senses:
  - id: book
    ru: "книга"
    examples:
      - pl: "To książka."
        ru: "Это книга."
        source: { kind: tatoeba, id: 550691 }
      - pl: "Mam książkę."
        ru: "У меня есть книга."
        source: { kind: tatoeba, id: 2939749 }
      - pl: "Kupiłem książkę."
        ru: "Я купил книгу."
        source: { kind: tatoeba, id: 611674 }
  - id: books
    ru: "книги (во множественном числе)"
    examples:
      - pl: "Czytam książki."
        ru: "Я читаю книги."
        source: { kind: tatoeba, id: 2183390 }
      - pl: "Mam mało książek."
        ru: "У меня мало книг."
        source: { kind: tatoeba, id: 6157987 }
      - pl: "Co zrobiłeś z tymi książkami?"
        ru: "Что ты сделал с этими книгами?"
        source: { kind: translated, id: 639857 }
notes:
  - { kind: false-friend, text: "Русское «книжка» — то же самое слово с тем же суффиксом, но в польском książka совершенно нейтральна: это обычная «книга». Уменьшительное у поляков — książeczka." }
  - { kind: usage, text: "Этимология неожиданная: праславянское *kъnigy — уменьшительное от *kъnъ «колода, чурбан». Первые книги писали на деревянных дощечках." }
  - { kind: usage, text: "До XVI века слово употреблялось только во множественном числе, как и русское «книги»." }
  - { kind: usage, text: "Предложный падеж — o książce, с чередованием k → c." }
collocations:
  - { pl: "czytać książkę", ru: "читать книгу" }
  - { pl: "książka kucharska", ru: "кулинарная книга" }
  - { pl: "o książce", ru: "о книге" }
  - { pl: "pochłaniać książki", ru: "глотать книги" }
etymology: "Праславянское *kъnigy — уменьшительное от *kъnъ «колода, чурбан»: первые книги писали на деревянных дощечках. Русское «книга» — то же слово, а «книжка» сохранила тот же суффикс, что и польское książka."
memory: "książka — «книга», и русское «книжка» это ровно то же слово с тем же суффиксом, только у поляков оно стало нейтральным. Предложный падеж меняет k на c: o książce."
idioms:
  - { pl: "nie oceniaj książki po okładce", ru: "не суди книгу по обложке" }
  - { pl: "pochłaniać książki", ru: "глотать книги" }
  - { pl: "książka do poduszki", ru: "книга на ночь" }
