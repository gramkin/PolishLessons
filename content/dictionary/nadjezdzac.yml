notes:
  - { kind: false-friend, text: "NADJEŻDŻAĆ — «подъезжать, приближаться», а не «наезжать» (сбивать или давить — NAJEŻDŻAĆ, POTRĄCAĆ). Приставка NAD- здесь значит «приближение», как в NADCHODZIĆ «приближаться (пешком)»: POCIĄG NADJEŻDŻA «поезд подходит»." }
  - { kind: usage, text: "Несовершенный непереходный глагол; совершенный — NADJECHAĆ: AUTOBUS JUŻ NADJECHAŁ «автобус уже подъехал». Спряжение на -AM: NADJEŻDŻAM, NADJEŻDŻASZ, NADJEŻDŻAJĄ. Обычно о транспорте и о людях в нём; чаще всего в 3-м лице." }
  - { kind: government, text: "Откуда — Z + родительный: NADJEŻDŻAĆ Z PRZECIWKA «ехать навстречу», Z LEWEJ «слева». Куда — DO + родительный, POD + винительный: NADJEŻDŻAĆ POD DOM. В отличие от PODJEŻDŻAĆ, NADJEŻDŻAĆ подчёркивает, что машину видно или слышно издалека." }
  - { kind: pronunciation, text: "Читается «надъе́жджаць»: D перед J звучит раздельно, ŻDŻ — «ждж». Ударение на предпоследнем слоге: NADJEŻDŻA — «надъе́жджа»." }
collocations:
  - { pl: "pociąg nadjeżdża", ru: "поезд подходит" }
  - { pl: "nadjeżdżać z przeciwka", ru: "ехать навстречу" }
  - { pl: "nadjeżdżający samochód", ru: "приближающаяся машина" }
family:
