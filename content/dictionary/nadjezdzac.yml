  - { pl: "jazda", ru: "езда", relation: root, id: jazda }
etymology: "Приставка NAD- «над-, при-» плюс JEŻDŻAĆ, многократное к JECHAĆ «ехать» (праславянское *jěxati, как русское «ехать»)."
memory: "Nad- значит «приближаться»: nadchodzi — идёт сюда, nadjeżdża — едет сюда. Uwaga, nadjeżdża pociąg!"
idioms:
