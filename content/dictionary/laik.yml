notes:
  - { kind: false-friend, text: "LAIK — не «лайк» из соцсетей: это неспециалист, человек со стороны. Русские соответствия — «профан», «дилетант», «непосвящённый»; в церковном языке — «мирянин». Оттенок мягче, чем у «профана»: JESTEM LAIKIEM — скромное «я не специалист»." }
  - { kind: usage, text: "Мужской личный род: винительный равен родительному (ZNAM TEGO LAIKA). Во множественном K чередуется с C: LAIK → LAICY, но LAIKÓW, LAIKAMI." }
  - { kind: government, text: "В чём профан — W + предложный: LAIK W SPRAWACH PRAWA, LAIK W TEJ DZIEDZINIE. «Быть профаном» — творительный: BYĆ LAIKIEM." }
  - { kind: pronunciation, text: "Два слога: «ла́-ик», A и I не сливаются в «ай». Ударение на первом слоге." }
collocations:
  - { pl: "zupełny laik", ru: "полный профан" }
  - { pl: "laik w sprawach…", ru: "неспециалист в вопросах…" }
  - { pl: "dla laika", ru: "для непосвящённого" }
family:
