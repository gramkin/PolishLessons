# review
id: zabezpieczyc
format: 2
lemma: "zabezpieczyć"
rank: 1985
pos: verb
aspect: perf
pron: { cyr: "забэзпе́чыць" }
senses:
  - id: secure
    ru: "обезопасить, защитить"
    examples:
      - pl: "Wzmocnili wały, żeby zabezpieczyć wioskę przed powodzią."
        ru: "Они укрепили валы, чтобы защитить деревню от наводнения."
        source: { kind: translated, id: 525124 }
      - pl: "Ta twierdza była zabezpieczona przed wszelkim atakami."
        ru: "Эта крепость была защищена от любых нападений."
        source: { kind: translated, id: 947972 }
      - pl: "Twój komputer w ogóle nie jest zabezpieczony."
        ru: "Твой компьютер вообще не защищён."
        source: { kind: translated, id: 2680455 }
      - pl: "Żadna szczepionka nie zabezpieczy przed tą chorobą."
        ru: "Никакая вакцина не защитит от этой болезни."
        source: { kind: translated, id: 2265146 }
      - pl: "Polityka regionalna jest najlepszą drogą, żeby zabezpieczyć spójność terytorialną."
        ru: "Региональная политика — лучший способ обеспечить территориальную связность."
        source: { kind: translated, id: 1348151 }
      - pl: "Jednak los Marty wtedy wydawał się już zabezpieczony."
        ru: "Однако судьба Марты тогда уже казалась обеспеченной."
        source: { kind: translated, id: 2279753 }
  - id: safeguard-noun
    ru: "zabezpieczenie — защита, страховка"
    examples:
      - pl: "To nasze zabezpieczenie."
        ru: "Это наша страховка."
        source: { kind: translated, id: 2830000 }
      - pl: "Żaden system zabezpieczenia nie jest niezawodny."
        ru: "Ни одна система защиты не безотказна."
        source: { kind: translated, id: 945842 }
notes:
  - { kind: usage, text: "Совершенный вид. Несовершенная пара zabezpieczać в реестрах отсутствует, поэтому в карточке она только названа." }
  - { kind: government, text: "Защитить от чего-либо — zabezpieczyć przed czymś, с предлогом przed и творительным падежом: zabezpieczyć przed powodzią «защитить от наводнения»." }
  - { kind: usage, text: "Отглагольное существительное zabezpieczenie значит «защита, обеспечение, страховка»: system zabezpieczenia «система защиты»." }
  - { kind: usage, text: "Рядом с карточками chronić «защищать» и bezpieczny «безопасный», от которого слово и образовано." }
  - { kind: usage, text: "Причастие zabezpieczony говорится и о людях: są dobrze zabezpieczeni «они хорошо обеспечены». Отглагольное существительное zabezpieczenie значит «защита, обеспечение»: zabezpieczenie kredytu." }
collocations:
  - { pl: "zabezpieczyć przed", ru: "защитить от" }
  - { pl: "system zabezpieczenia", ru: "система защиты" }
  - { pl: "nie jest zabezpieczony", ru: "не защищён" }
etymology: "za- + bezpieczyć, от bezpieczny «безопасный», а то — от bez + piecza «забота, попечение». Буквально «сделать так, чтобы не было нужды в опеке». Русское «обезопасить» построено по другой модели, но с той же идеей."
memory: "zabezpieczyć — «защитить, обезопасить», с предлогом przed: zabezpieczyć przed powodzią. А zabezpieczenie — «защита, страховка»."
idioms:
  - { pl: "zabezpieczyć przed", ru: "защитить от" }
  - { pl: "system zabezpieczenia", ru: "система защиты" }
  - { pl: "zabezpieczony hasłem", ru: "защищённый паролем" }
