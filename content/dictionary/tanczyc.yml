# review
id: tanczyc
format: 2
lemma: "tańczyć"
rank: 1281
pos: verb
aspect: imperf
pron: { cyr: "та́ньчыць" }
senses:
  - id: dance
    ru: "танцевать"
    examples:
      - pl: "Aoi dobrze tańczy."
        ru: "Аой хорошо танцует."
        source: { kind: tatoeba, id: 565969 }
      - pl: "Ona chce tańczyć."
        ru: "Она хочет танцевать."
        source: { kind: tatoeba, id: 2165133 }
      - pl: "Dobrze tańczysz."
        ru: "Ты хорошо танцуешь."
        source: { kind: tatoeba, id: 6689542 }
  - id: go-dancing
    ru: "идти танцевать, танцевать с кем-то"
    examples:
      - pl: "Chcę tańczyć."
        ru: "Я хочу танцевать."
        source: { kind: translated, id: 8546134 }
      - pl: "Dziś idziemy tańczyć."
        ru: "Сегодня мы идём танцевать."
        source: { kind: translated, id: 349127 }
      - pl: "Tom i Mary tańczyli razem."
        ru: "Том и Мэри танцевали вместе."
        source: { kind: translated, id: 4104437 }
  - id: figurative
    ru: "переносно о предметах: кружиться, плясать"
    examples:
      - pl: "Kurz tańczył na wietrze."
        ru: "Пыль кружилась на ветру."
        source: { kind: translated, id: 716720 }
      - pl: "Piękne czerwone liście klonu oddzielają się od gałęzi i tańczą na wietrze."
        ru: "Красивые красные листья клёна отрываются от веток и кружатся на ветру."
        source: { kind: translated, id: 12111827 }
      - pl: "Piach tańczył w podmuchach wiatru."
        ru: "Песок кружился в порывах ветра."
        source: { kind: translated, id: 716721 }
notes:
  - { kind: government, text: "tańczyć z kimś «танцевать с кем-то» — творительный падеж. А tańczyć do muzyki «танцевать под музыку» — предлог do с родительным, а не «под»." }
  - { kind: usage, text: "Идиома tańczyć, jak ktoś zagra значит «плясать под чью-то дудку» — картинка та же, что в русском." }
  - { kind: usage, text: "Вид несовершенный; совершенный — zatańczyć. Существительное — taniec «танец»." }
  - { kind: pronunciation, text: "ń звучит как «нь»: та́ньчыць. В личных формах носовой сохраняется: tańczę, tańczysz." }
collocations:
  - { pl: "tańczyć z kimś", ru: "танцевать с кем-то" }
  - { pl: "iść tańczyć", ru: "идти танцевать" }
  - { pl: "tańczyć do muzyki", ru: "танцевать под музыку" }
etymology: "От taniec «танец», из средневерхненемецкого tanz. Русские «танец» и «танцевать» пришли тем же путём, через польский."
memory: "tańczyć — «танцевать». Управление: tańczyć z kimś «с кем-то» (творительный), но tańczyć do muzyki «под музыку» — предлог do, а не «под». Совершенный вид — zatańczyć, существительное — taniec."
idioms:
  - { pl: "tańczyć jak ktoś zagra", ru: "плясать под чью-то дудку" }
  - { pl: "iść tańczyć", ru: "идти танцевать" }
  - { pl: "tańczyć do muzyki", ru: "танцевать под музыку" }
