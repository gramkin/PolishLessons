# review
id: niedlugo
format: 2
lemma: "niedługo"
rank: 931
pos: adv
pron: { cyr: "неду́го" }
senses:
  - id: soon
    ru: "скоро, вскоре"
    note: "Не «недолго»! Слово говорит о близком будущем."
    examples:
      - pl: "Niedługo będzie wiosna."
        ru: "Скоро весна."
        source: { kind: tatoeba, id: 4934403 }
      - pl: "Niedługo wyjeżdżam za granicę."
        ru: "Скоро я уезжаю за границу."
        source: { kind: tatoeba, id: 6156383 }
      - pl: "Statek z Nowego Jorku powinien przybyć niedługo."
        ru: "Скоро должен прибыть корабль из Нью-Йорка."
        source: { kind: tatoeba, id: 1659907 }
  - id: not-long
    ru: "недолго (редко, о длительности)"
    note: "Это значение возможно, но встречается гораздо реже."
    examples:
      - pl: "Mieszkał tu niedługo, ledwie rok."
        ru: "Он прожил тут недолго, всего год."
        source: { kind: authored }
      - pl: "Trwało to niedługo."
        ru: "Длилось это недолго."
        source: { kind: authored }
      - pl: "Niedługo po ślubie wyjechali."
        ru: "Вскоре после свадьбы они уехали."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Главная ловушка транша: niedługo значит «скоро», а не «недолго». Niedługo będzie wiosna — «Скоро весна», а не «Весна будет недолго». Русское «недолго» передаётся словом krótko или оборотом nie za długo." }
  - { kind: usage, text: "Логика слова такая: «не долго ждать» — отсюда «скоро». Синонимы — wkrótce «вскоре» и za chwilę «сейчас, через минуту»." }
  - { kind: usage, text: "В значении «недолго» слово всё же употребляется, но редко и обычно с уточнением: Mieszkał tu niedługo, ledwie rok. Контекст всегда подскажет." }
  - { kind: usage, text: "Оборот niedługo po czymś значит «вскоре после чего-то»: niedługo po ślubie «вскоре после свадьбы»." }
collocations:
  - { pl: "niedługo wrócę", ru: "скоро вернусь" }
  - { pl: "niedługo po", ru: "вскоре после" }
  - { pl: "już niedługo", ru: "уже скоро" }
family:
  - { pl: "długo", ru: "долго", relation: root }
  - { pl: "niedługi", ru: "недлинный", relation: root }
etymology: "Из nie + długo «долго». Буквально «недолго», но смысл ушёл в сторону: «недолго ждать» превратилось в «скоро»."
memory: "niedługo — «скоро», а вовсе не «недолго», хотя собрано именно из этих частей: nie + długo. Niedługo będzie wiosna значит «Скоро весна». Русское «недолго» по-польски будет krótko. Это одна из самых коварных пар между языками."
idioms:
