# review
id: zamykac
format: 2
lemma: "zamykać"
rank: 1569
pos: verb
aspect: imperf
aspectPair: zamknac
pron: { cyr: "замы́каць" }
senses:
  - id: close
    ru: "закрывать (дверь, глаза)"
    examples:
      - pl: "Niech pani nie zamyka oczu."
        ru: "Не закрывайте глаза."
        source: { kind: tatoeba, id: 6313082 }
      - pl: "Nie zamykaj oczu."
        ru: "Не закрывай глаза."
        source: { kind: translated, id: 357834 }
      - pl: "Nie zamykaj drzwi."
        ru: "Не закрывай дверь."
        source: { kind: translated, id: 11427397 }
  - id: shut-shop
    ru: "закрывать(ся) — о заведении"
    examples:
      - pl: "Sklep zamyka się o 11."
        ru: "Магазин закрывается в 11."
        source: { kind: translated, id: 358952 }
      - pl: "Większość sklepów zamyka się o dziesiątej."
        ru: "Большинство магазинов закрывается в десять."
        source: { kind: translated, id: 3571235 }
      - pl: "Zamykamy o wpół do trzeciej."
        ru: "Мы закрываем в полтретьего."
        source: { kind: translated, id: 3571251 }
notes:
  - { kind: usage, text: "Совершенный вид — zamknąć. От того же корня существительное zamek «замок» — буквально «то, что закрывает»." }
  - { kind: government, text: "Требует винительного падежа: zamykać drzwi «закрывать дверь», zamykać oczy «закрывать глаза»." }
  - { kind: usage, text: "С się значит «закрываться»: Sklep zamyka się o jedenastej. Но часто говорят и без się, с подразумеваемым подлежащим: Sklep zamykają o dziewiątej." }
  - { kind: usage, text: "Причастие zamykany значит «закрываемый»: Ten sklep jest zamykany o dziewiątej «Этот магазин закрывают в девять»." }
collocations:
  - { pl: "zamykać drzwi", ru: "закрывать дверь" }
  - { pl: "zamykać oczy", ru: "закрывать глаза" }
  - { pl: "zamykać sklep", ru: "закрывать магазин" }
etymology: "Приставка za- + mykać, старое «двигать, задвигать» (корень *myk-). Русское «замыкать» — то же слово с тем же значением, и «замок» в обоих языках происходит от него же."
memory: "zamykać = «закрывать», совершенный вид — zamknąć. От того же корня zamek «замок» — буквально «то, что замыкает». Русское «замыкать» — прямой родственник."
idioms:
  - { pl: "zamykać oczy na coś", ru: "закрывать глаза на что-то" }
  - { pl: "zamykać drzwi", ru: "закрывать дверь" }
  - { pl: "zamykać sklep", ru: "закрывать магазин" }
