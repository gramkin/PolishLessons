senses:
  - id: explain
    ru: "объяснить, растолковать"
    examples:
      - pl: "Potrzebna wieczność, żeby wszystko wytłumaczyć."
        ru: "Мне потребуется вечность, чтобы всё объяснить."
        source: { kind: tatoeba, id: 351503 }
      - pl: "Wytłumacz mi to."
        ru: "Объясни мне это."
        source: { kind: translated, id: 1085518 }
      - pl: "Wytłumaczę ci to."
        ru: "Я тебе это объясню."
        source: { kind: translated, id: 2251863 }
  - id: justify
    ru: "wytłumaczyć się — оправдаться, объясниться"
    examples:
      - pl: "Wytłumacz się."
        ru: "Объяснись."
        source: { kind: translated, id: 10542045 }
      - pl: "Co? Nie zrobiłeś pracy domowej bo grałeś w piłkę? To żadne wytłumaczenie."
        ru: "Что? Ты не сделал домашнее задание, потому что играл в футбол? Это не оправдание."
        source: { kind: translated, id: 603069 }
notes:
  - { kind: usage, text: "Совершенный вид к tłumaczyć. Важная тонкость: tłumaczyć значит и «объяснять», и «переводить», а у wytłumaczyć остаётся только «объяснить»." }
  - { kind: government, text: "wytłumaczyć coś komuś — винительный вещи и дательный лица: Wytłumacz mi to «Объясни мне это»." }
  - { kind: usage, text: "С się значит «оправдаться, объясниться»: Wytłumacz się! «Объяснись!»." }
  - { kind: usage, text: "Существительное wytłumaczenie значит и «объяснение», и «оправдание»: To żadne wytłumaczenie «Это не оправдание»." }
collocations:
  - { pl: "wytłumaczyć komuś coś", ru: "объяснить кому-то что-то" }
  - { pl: "wytłumaczyć się", ru: "оправдаться" }
  - { pl: "nie ma wytłumaczenia", ru: "нет оправдания" }
etymology: "Приставка wy- и tłumaczyć «толковать, переводить», от tłumacz «переводчик». Русское «толмач» — то же самое слово, пришедшее тем же тюркским путём."
memory: "wytłumaczyć — «объяснить», совершенный вид к tłumaczyć. Главное: tłumaczyć значит и «объяснять», и «переводить», а wytłumaczyć — только «объяснить». А wytłumaczyć się — «оправдаться». Корень тот же, что в русском «толмач»."
