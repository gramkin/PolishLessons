notes:
  - { kind: false-friend, text: "WICEPREZYDENT — «вице-президент», но в Польше это ещё и «заместитель мэра» крупного города: мэр Варшавы, Кракова — PREZYDENT MIASTA. Пишется слитно, без дефиса: WICEPREZYDENT." }
  - { kind: usage, text: "Десять форм, мужской род, лицо. Множественное — WICEPREZYDENCI: T переходит в C. Местный и звательный — WICEPREZYDENCIE." }
