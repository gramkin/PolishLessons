etymology: "Из do + prawda «правда», буквально «по правде». Русское «вправду» и «поистине» собраны из того же материала, только с другими предлогами."
memory: "doprawdy — книжное «право же, в самом деле». Doprawdy? значит «Неужели?». В обиходной речи чаще скажут naprawdę."
