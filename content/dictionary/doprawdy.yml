notes:
  - { kind: usage, text: "Книжная и слегка старомодная частица. Обиходные синонимы — naprawdę и rzeczywiście, у обоих свои карточки." }
  - { kind: usage, text: "Само по себе Doprawdy? выражает удивление или вежливое сомнение: «Неужели?», «Да что вы?»." }
