# review
id: firma
format: 2
lemma: "firma"
rank: 515
pos: noun
pron: { cyr: "фи́рма" }
senses:
  - id: company
    ru: "фирма, компания"
    examples:
      - pl: "Firma walczy o przetrwanie."
        ru: "Компания борется за выживание."
        source: { kind: tatoeba, id: 2146656 }
      - pl: "Pracuję w tej firmie."
        ru: "Я работаю в этой компании."
        source: { kind: translated, id: 360421 }
      - pl: "Założył firmę."
        ru: "Он основал фирму."
        source: { kind: translated, id: 2246959 }
  - id: workplace
    ru: "предприятие, место работы"
    examples:
      - pl: "W naszej firmie kiepsko płacą."
        ru: "В нашей компании плохо платят."
        source: { kind: tatoeba, id: 745320 }
      - pl: "Do jutra w firmie."
        ru: "До завтра на работе."
        source: { kind: translated, id: 640346 }
      - pl: "Wyszła już z firmy."
        ru: "Она уже ушла с работы."
        source: { kind: translated, id: 901480 }
notes:
  - { kind: usage, text: "В польском firma шире русской «фирмы»: так называют и корпорацию, и ларёк, и просто место работы. Idę do firmy значит «Иду на работу»." }
  - { kind: usage, text: "W firmie — «на работе»: Do jutra w firmie «До завтра на работе», Pracuję w tej firmie «Я работаю в этой компании»." }
  - { kind: usage, text: "Прилагательное firmowy значит «фирменный»: danie firmowe «фирменное блюдо»." }
  - { kind: usage, text: "firma krzak — «фирма-однодневка», буквально «фирма-куст»: так говорят о подставной конторе." }
collocations:
  - { pl: "założyć firmę", ru: "основать фирму" }
  - { pl: "pracować w firmie", ru: "работать в компании" }
  - { pl: "własna firma", ru: "собственное дело" }
  - { pl: "firma krzak", ru: "фирма-однодневка" }
etymology: "Итальянское firma «подпись, торговый дом», от латинского firmus «крепкий, надёжный». Русское «фирма» — то же заимствование, пришедшее через немецкий."
memory: "firma — «фирма, компания», из латинского firmus «крепкий». В польском слово шире русского: это и корпорация, и ларёк, и просто работа — Idę do firmy «Иду на работу», Do jutra w firmie «До завтра на работе». А firma krzak — «фирма-однодневка», буквально «фирма-куст»."
idioms:
  - { pl: "firma krzak", ru: "фирма-однодневка" }
  - { pl: "solidna firma", ru: "солидная фирма" }
  - { pl: "pracować w firmie", ru: "работать в компании" }
