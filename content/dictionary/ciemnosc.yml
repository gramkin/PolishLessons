notes:
  - { kind: government, text: "Бояться темноты — bać się ciemności (родительный падеж); видеть в темноте — widzieć w ciemności или w ciemnościach, обе формы обычны." }
  - { kind: usage, text: "Множественное ciemności значит то же самое, что единственное: koty widzą w ciemnościach «кошки видят в темноте»." }
  - { kind: usage, text: "książę ciemności — «князь тьмы», то есть Сатана; egipskie ciemności — «тьма египетская», кромешная темнота." }
  - { kind: usage, text: "Прилагательное — ciemny «тёмный»; противоположность — jasność «светлота» и światło «свет»." }
collocations:
