etymology: "От ciemny «тёмный», как русское «темнота» от «тёмный»; польское cie- отвечает русскому «тё-», как в ciepły «тёплый»."
memory: "ciemność — «темнота», от ciemny «тёмный». Бояться темноты — bać się ciemności, родительный падеж. Множественное ciemności значит то же самое."
