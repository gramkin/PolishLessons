  - form: "rzekł"
    pl: "Odchrząknął i rzekł: „Uwielbiam Tatoeba!”."
    ru: "Он откашлялся и сказал: «Обожаю Татоэбу!»."
    source: { kind: translated, id: 440509 }
  - form: "rzekła"
    pl: "Kobieta ostrożnie przeliczyła pieniądze, a następnie rzekła: - Wciąż brakuje 0.99."
    ru: "Женщина осторожно пересчитала деньги, а затем сказала."
    source: { kind: translated, id: 1351871 }
  - form: "rzekła"
    pl: "– Ot, tak – rzekła, powstając z klęczek i twarz zaru­mienioną od rozdmuchiwania płomienia zwracając ku nie­ruchomej kobiecie – rozpaliłam ogień i zaraz tu będzie pani cieplej i widniej."
    ru: "«Вот так», — сказала она, поднимаясь с колен и обращая к неподвижной женщине лицо, раскрасневшееся от раздувания пламени, — «я развела огонь, и сейчас вам тут станет теплее и светлее»."
    source: { kind: translated, id: 8202134 }
  - form: "rzekła"
    pl: "\"Wiem, czego pragniesz,\" rzekła morska wiedźma. \"To bardzo niemądre z twojej strony, jednakże dostaniesz, czego chcesz, mimo, że sprowadzi to na ciebie smutek, nadobna księżniczko. Chcesz pozbyć się swojego rybiego ogona i mieć dwie nogi, tak jak ludzie na stałym lądzie, żeby młody książę zakochał się w tobie, i żeby uczynić swoją duszę nieśmiertelną.\""
    ru: "«Я знаю, чего ты желаешь», — сказала морская ведьма. — «Это очень неразумно с твоей стороны, но ты получишь, чего хочешь, хотя это и принесёт тебе горе, прекрасная принцесса. Ты хочешь избавиться от своего рыбьего хвоста и иметь две ноги, как люди на суше, чтобы молодой принц полюбил тебя и чтобы сделать свою душу бессмертной»."
    source: { kind: translated, id: 12692396 }
