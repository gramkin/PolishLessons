formExamples:
  - form: "rzec"
    pl: "Cóż możemy rzec?"
    ru: "Что мы можем сказать?"
    source: { kind: translated, id: 3643195 }
  - form: "rzec"
    pl: "Był dobrze zbudowany, by nie rzec gruby."
    ru: "Он был хорошо сложён, чтобы не сказать толст."
    source: { kind: translated, id: 362396 }
  - form: "rzec"
    pl: "Był dobrze zbudowany, by nie rzec tęgi."
    ru: "Он был хорошо сложён, чтобы не сказать тучен."
    source: { kind: translated, id: 722415 }
  - form: "rzecze"
    pl: "Tako rzecze Zaraturstra."
    ru: "Так говорил Заратустра."
    source: { kind: translated, id: 982762 }
  - form: "rzecze"
    pl: "Tako rzecze mistrz."
    ru: "Так говорит мастер."
    source: { kind: authored }
  - form: "rzecze"
    pl: "Kto tak rzecze, myli się."
    ru: "Кто так говорит, ошибается."
    source: { kind: authored }
  - form: "rzekł"
    pl: "Lekarz rzekł, żeby odpoczęła."
    ru: "Врач сказал, чтобы она отдохнула."
    source: { kind: translated, id: 8287810 }
  - form: "rzekł"
    pl: "„Wygląda całkiem ciekawie” – rzekł Hiroshi."
    ru: "«Выглядит довольно интересно», — сказал Хироси."
    source: { kind: translated, id: 350107 }
  - form: "rzekł"
    pl: "Odchrząknął i rzekł: „Uwielbiam Tatoeba!”."
    ru: "Он откашлялся и сказал: «Обожаю Татоэбу!»."
    source: { kind: translated, id: 440509 }
  - form: "rzekła"
    pl: "Kobieta ostrożnie przeliczyła pieniądze, a następnie rzekła: - Wciąż brakuje 0.99."
    ru: "Женщина осторожно пересчитала деньги, а затем сказала."
    source: { kind: translated, id: 1351871 }
  - form: "rzekła"
    pl: "– Ot, tak – rzekła, powstając z klęczek i twarz zaru­mienioną od rozdmuchiwania płomienia zwracając ku nie­ruchomej kobiecie – rozpaliłam ogień i zaraz tu będzie pani cieplej i widniej."
    ru: "«Вот так», — сказала она, поднимаясь с колен."
    source: { kind: translated, id: 8202134 }
  - form: "rzekła"
    pl: "\"Wiem, czego pragniesz,\" rzekła morska wiedźma. \"To bardzo niemądre z twojej strony, jednakże dostaniesz, czego chcesz, mimo, że sprowadzi to na ciebie smutek, nadobna księżniczko. Chcesz pozbyć się swojego rybiego ogona i mieć dwie nogi, tak jak ludzie na stałym lądzie, żeby młody książę zakochał się w tobie, i żeby uczynić swoją duszę nieśmiertelną.\""
    ru: "«Я знаю, чего ты желаешь», — сказала морская ведьма."
    source: { kind: translated, id: 12692396 }
