  - { form: "rzeką", reason: "форма архаичного настоящего времени (rzekę, rzeczesz, rzecze, rzeczemy, rzeczecie, rzeką). Из всего ряда на rzecz- в живом языке осталось только третье лицо единственного числа rzecze — в названии Tako rzecze Zaratustra, которое приводит карточка. Живое третье лицо множественного числа — rzekną; карточка уже отказывает по этой причине формам rzeczesz, rzeczemy и rzeczecie" }
  - { form: "rzekąc", reason: "глагол совершенного вида, а причастие настоящего времени и деепричастие настоящего времени образуют только глаголы несовершенного вида. Поэтому форм на rzekąc- у rzec нет вовсе — это уже отмечено при форме rzekącą. Единственное причастие этого глагола — rzeczony «вышеупомянутый»" }
