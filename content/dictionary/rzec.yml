# review
id: rzec
format: 2
lemma: "rzec"
rank: 2275
pos: verb
aspect: perf
aspectPair: mowic
pron: { cyr: "жэц" }
senses:
  - id: say
    ru: "молвить, сказать (книжное)"
    examples:
      - pl: "Cóż możemy rzec?"
        ru: "Что мы можем сказать?"
        source: { kind: translated, id: 3643195 }
      - pl: "„Wygląda całkiem ciekawie” – rzekł Hiroshi."
        ru: "«Выглядит довольно интересно», — сказал Хироси."
        source: { kind: translated, id: 350107 }
      - pl: "Lekarz rzekł, żeby odpoczęła."
        ru: "Врач сказал, чтобы она отдохнула."
        source: { kind: translated, id: 8287810 }
  - id: so-to-speak
    ru: "сказать (в оборотах: by nie rzec, że tak rzeknę)"
    examples:
      - pl: "Był dobrze zbudowany, by nie rzec gruby."
        ru: "Он был хорошо сложён, чтобы не сказать толст."
        source: { kind: translated, id: 362396 }
      - pl: "Tako rzecze Zaraturstra."
        ru: "Так говорил Заратустра."
        source: { kind: translated, id: 982762 }
notes:
  - { kind: usage, text: "Книжный и архаичный глагол. В живой речи — powiedzieć. Живёт в оборотах by nie rzec «чтобы не сказать» и że tak rzeknę «так сказать»." }
  - { kind: false-friend, text: "Осторожно с соседями: rzecz значит «вещь», а rzeka — «река». Три слова с общим началом и разными корнями, и в корпусе они постоянно перемешиваются." }
  - { kind: government, text: "Совершенный вид; пару ему составляет mówić «говорить». Прошедшее rzekł, rzekła встречается чаще инфинитива." }
  - { kind: usage, text: "Tako rzecze Zaratustra «Так говорил Заратустра» — название книги Ницше по-польски." }
collocations:
  - { pl: "by nie rzec", ru: "чтобы не сказать" }
  - { pl: "że tak rzeknę", ru: "так сказать" }
etymology: "Праславянское *rekti «говорить»; ср. русское «речь», «изречь», «нарекать»."
memory: "rzec — книжное «молвить». В живой речи powiedzieć. Осторожно с соседями: rzecz «вещь» и rzeka «река» — другие слова, хотя начало общее."
idioms:
  - { pl: "by nie rzec", ru: "чтобы не сказать" }
  - { pl: "że tak rzeknę", ru: "так сказать" }
