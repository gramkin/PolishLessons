# review
id: zakochac
format: 2
lemma: "zakochać"
rank: 1070
pos: verb
aspect: perf
pron: { cyr: "зако́хаць" }
senses:
  - id: fall-in-love
    ru: "влюбиться (zakochać się w kimś)"
    examples:
      - pl: "Tom zakochał się w Mary."
        ru: "Том влюбился в Мэри."
        source: { kind: tatoeba, id: 1090695 }
      - pl: "Zakochałem się w niej."
        ru: "Я влюбился в неё."
        source: { kind: tatoeba, id: 1298420 }
      - pl: "Zakochała się w nim od pierwszego wejrzenia."
        ru: "Она влюбилась в него с первого взгляда."
        source: { kind: translated, id: 459882 }
  - id: in-love
    ru: "zakochany — влюблённый"
    examples:
      - pl: "Jestem w tobie zakochany."
        ru: "Я влюблён в тебя."
        source: { kind: tatoeba, id: 5804034 }
      - pl: "Jest w niej zakochany bez pamięci."
        ru: "Он влюблён в неё без памяти."
        source: { kind: tatoeba, id: 440457 }
      - pl: "Byłaś zakochana w Tomie?"
        ru: "Ты была влюблена в Тома?"
        source: { kind: tatoeba, id: 3582002 }
  - id: lovers
    ru: "zakochani — влюблённые (как существительное)"
    examples:
      - pl: "Zakochani szli pod rękę."
        ru: "Влюблённые шли под руку."
        source: { kind: translated, id: 355554 }
      - pl: "Luty to miesiąc zakochanych."
        ru: "Февраль — месяц влюблённых."
        source: { kind: translated, id: 11341808 }
notes:
  - { kind: government, text: "Главное отличие от русского — падеж: zakochać się w kimś, предложный падеж. По-русски «влюбиться в кого-то» — винительный. Zakochałem się w niej «Я влюбился в неё»." }
  - { kind: usage, text: "Глагол всегда идёт с się: zakochać się. Формы без się значат другое и в живой речи не употребляются." }
  - { kind: usage, text: "Причастие zakochany работает как прилагательное «влюблённый» (jestem zakochany) и как существительное во множественном — zakochani «влюблённые»." }
  - { kind: usage, text: "zakochać się od pierwszego wejrzenia «влюбиться с первого взгляда» и zakochać się po uszy «влюбиться по уши» — обороты совпадают с русскими." }
collocations:
  - { pl: "zakochać się w kimś", ru: "влюбиться в кого-то" }
  - { pl: "zakochany po uszy", ru: "влюблённый по уши" }
  - { pl: "od pierwszego wejrzenia", ru: "с первого взгляда" }
  - { pl: "miesiąc zakochanych", ru: "месяц влюблённых" }
family:
  - { pl: "kochać", ru: "любить", relation: root, id: kochac }
  - { pl: "zakochany", ru: "влюблённый", relation: derived }
  - { pl: "miłość", ru: "любовь", relation: root }
etymology: "Приставка za- плюс kochać «любить». Русское «влюбиться» собрано по той же модели, только с приставкой «в-»."
memory: "zakochać się — «влюбиться», всегда с się. Главная ловушка — падеж: zakochać się w kimś, предложный, а по-русски «влюбиться в кого-то», винительный. И zakochany значит «влюблённый», zakochani — «влюблённые»."
idioms:
  - { pl: "zakochać się po uszy", ru: "влюбиться по уши" }
  - { pl: "zakochać się od pierwszego wejrzenia", ru: "влюбиться с первого взгляда" }
formExamplesSkip:
  - { form: "zakochawszy", reason: "книжное деепричастие прошедшего времени; в живой речи не употребляется" }
