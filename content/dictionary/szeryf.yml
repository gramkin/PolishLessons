etymology: "Из английского sheriff, а оно из древнеанглийского scirgerefa «управитель графства». Русский «шериф» — то же заимствование и тем же путём."
memory: "szeryf — «шериф», слово об американских и британских реалиях: своей такой должности в Польше нет. Читается «шэрыф». А во множественном szeryfy в типографике значит «засечки» у шрифта."
