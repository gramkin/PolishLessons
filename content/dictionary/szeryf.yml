notes:
  - { kind: usage, text: "Слово об американских и британских реалиях: своей должности с таким названием в Польше нет, поэтому и корпусных примеров почти не встречается." }
  - { kind: pronunciation, text: "sz читается как ш: szeryf звучит «шэрыф», ровно как русское слово." }
  - { kind: usage, text: "Мужской одушевлённый: винительный совпадает с родительным — widzę szeryfa." }
  - { kind: usage, text: "Третье значение — типографское: szeryfy это «засечки» у шрифта, отсюда czcionka szeryfowa «шрифт с засечками»." }
