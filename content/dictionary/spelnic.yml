notes:
  - { kind: false-friend, text: "Польский делит там, где русский нет. Spełnić берёт ОБЕЩАНИЯ и ЖЕЛАНИЯ: spełnić obietnicę, życzenie, marzenie, warunki. А wypełnić берёт ФОРМЫ и ПРОСТРАНСТВО: wypełnić formularz, lukę, przestrzeń. Русское «исполнить, выполнить» покрывает оба набора, поэтому границу приходится заучивать: нельзя spełnić formularza и нельзя wypełnić obietnicy." }
  - { kind: usage, text: "У глагола ШЕСТЬ повелительных форм — два равноправных набора: spełnij, spełnijmy, spełnijcie и spełń, spełńmy, spełńcie. Именно поэтому парадигма насчитывает 56 форм, а не 53. Ровно та же двойственность у родственного wypełnić — оба глагола сидят на корне pełny «полный»." }
  - { kind: government, text: "Исполняют ЧТО — винительный: spełnić obietnicę, spełnić warunki. Возвратное spełnić się значит «исполниться, осуществиться», и подлежащим при нём стоит само желание: marzenie się spełniło «мечта исполнилась». Причастие spełniony живёт самостоятельно в значении «состоявшийся»: spełniony zawodowo, spełniona matka." }
collocations:
  - { pl: "spełnić obietnicę", ru: "исполнить обещание" }
  - { pl: "spełnić warunki", ru: "выполнить условия" }
  - { pl: "marzenie się spełniło", ru: "мечта исполнилась" }
family:
  - { pl: "pełny", ru: "полный", relation: root, id: pelny }
  - { pl: "wypełnić", ru: "заполнить; выполнить", relation: derived, id: wypelnic }
  - { pl: "spełniać", ru: "исполнять", relation: aspect }
etymology: "Приставка s- плюс pełnić, от pełny «полный», праславянское *pьlnъ — то же слово, что русское «полный». Русские «исполнить», «выполнить» и «наполнить» построены от того же корня теми же приставками, так что всё гнездо прозрачно; расходятся только сочетания, за которыми закрепились spełnić и wypełnić."
memory: "spełnić — «исполнить» обещание, желание, мечту, условия. Для бланков и пустот нужен wypełnić: польский делит то, что русский покрывает одним «выполнить». Корень тот же, что «полный», и повелительных форм две: spełnij и spełń."
idioms:
  - { pl: "marzenie się spełniło", ru: "мечта исполнилась" }
  - { pl: "spełnić czyjąś ostatnią wolę", ru: "исполнить чью-л. последнюю волю" }
