  - id: unexpectedly
    ru: "неожиданно (перед прилагательным)"
    examples:
      - pl: "Wynik był zaskakująco dobry."
        ru: "Результат был на удивление хорошим."
        source: { kind: authored }
      - pl: "Odpowiedział zaskakująco spokojnie."
        ru: "Он ответил на удивление спокойно."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Почти всегда стоит перед прилагательным и усиливает его: zaskakująco łatwy «на удивление лёгкий», zaskakująco dobry «на удивление хороший»." }
  - { kind: false-friend, text: "Корень skakać «прыгать»: zaskoczyć буквально «застать прыжком, застигнуть». Русское «неожиданно» этого образа не хранит." }
  - { kind: government, text: "Наречие от причастия zaskakujący «удивляющий», от zaskakiwać." }
  - { kind: usage, text: "Глагол zaskoczyć «удивить, застать врасплох» уже есть в словаре." }
collocations:
  - { pl: "zaskakująco łatwy", ru: "на удивление лёгкий" }
etymology: "От zaskakujący «удивляющий», от zaskoczyć «застать врасплох», корень skakać «прыгать»."
memory: "zaskakująco — «на удивление», всегда перед прилагательным. Корень skakać: zaskoczyć значит буквально «застать прыжком»."
