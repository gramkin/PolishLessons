notes:
  - { kind: usage, text: "По-польски чаще говорят во множественном: wąsy «усы», как и по-русски. Единственное wąs — это один ус." }
  - { kind: false-friend, text: "Русский «ус» и польское wąs — одно слово: носовое ą отвечает русскому у. Тот же ряд: dąb/дуб, pająk/паук." }
  - { kind: government, text: "Мужской неодушевлённый; родительный — wąsa. Отращивать усы — zapuszczać wąsy, винительный." }
  - { kind: usage, text: "Pod wąsem — «под усами», о человеке с усами: facet pod wąsem. Кошачьи усы — wąsy тоже." }
collocations:
  - { pl: "zapuszczać wąsy", ru: "отращивать усы" }
  - { pl: "pod wąsem", ru: "с усами" }
etymology: "Праславянское *ǫsъ; русский «ус» — то же слово, носовое ą отвечает русскому у."
memory: "wąs — «ус», читается «вонс», но говорят обычно во множественном: wąsy «усы». Тот же ряд носовых: dąb/дуб, pająk/паук."
