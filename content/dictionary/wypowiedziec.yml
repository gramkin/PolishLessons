pos: verb
pron: { cyr: "выповье́дзець" }
senses:
  - id: utter
    ru: "произнести, высказать"
    examples:
      - pl: "Nie mógł wypowiedzieć ani słowa."
        ru: "Он не мог произнести ни слова."
        source: { kind: authored }
      - pl: "Wypowiedz życzenie i zdmuchnij świeczki."
        ru: "Загадай желание и задуй свечи."
        source: { kind: authored }
      - pl: "Wypowiedziała się krytycznie o projekcie."
        ru: "Она высказалась о проекте критически."
        source: { kind: authored }
  - id: terminate
    ru: "расторгнуть, объявить (договор, войну)"
    examples:
      - pl: "Pracodawca wypowiedział mu umowę."
        ru: "Работодатель расторг с ним договор."
        source: { kind: authored }
      - pl: "Niemcy wypowiedziały wojnę Stanom Zjednoczonym."
        ru: "Германия объявила войну Соединённым Штатам."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "WYPOWIEDZIEĆ — не «выповедать» и не «исповедать». Это «высказать, произнести»: WYPOWIEDZIEĆ SŁOWO, ŻYCZENIE. Важнее второе значение — «расторгнуть, объявить»: WYPOWIEDZIEĆ UMOWĘ, «расторгнуть договор», WYPOWIEDZIEĆ WOJNĘ, «объявить войну». WYPOWIEDZENIE — «уведомление об увольнении»: DOSTAŁ WYPOWIEDZENIE, «его уволили»." }
  - { kind: usage, text: "Пятьдесят две формы: глагол переходный, страдательное WYPOWIEDZIANY — о словах и договорах: UMOWA WYPOWIEDZIANA. Форма для мужчин-людей WYPOWIEDZIANI в карточку не включена: расторгают договор, а не людей. Спряжение как у POWIEDZIEĆ: WYPOWIEM, WYPOWIESZ, WYPOWIEDZĄ. Видовой партнёр — WYPOWIADAĆ." }
  - { kind: government, text: "Что — винительный: WYPOWIEDZIEĆ SŁOWA, UMOWĘ. Кому — дательный: WYPOWIEDZIEĆ KOMUŚ WOJNĘ, UMOWĘ. Возвратное WYPOWIEDZIEĆ SIĘ — «высказаться», о чём — O с винительным или NA TEMAT с родительным: WYPOWIEDZIEĆ SIĘ O FILMIE, NA TEMAT PODATKÓW." }
  - { kind: pronunciation, text: "Читается «выповье́дзець», пять слогов, ударение на предпоследнем. IE после W — «вье», DZI — мягкое «дзи», CIE — «це». Конечное Ć — «ць». WYPOWIEM — «выпо́вьем»." }
  - { kind: register, text: "В значении «произнести» — книжное: в быту говорят POWIEDZIEĆ. WYPOWIEDZIEĆ SIĘ — обычное слово СМИ и собраний. WYPOWIEDZIEĆ UMOWĘ и WYPOWIEDZENIE — главные слова трудового права, их знает каждый работающий в Польше." }
collocations:
  - { pl: "wypowiedzieć umowę", ru: "расторгнуть договор" }
  - { pl: "wypowiedzieć wojnę", ru: "объявить войну" }
  - { pl: "wypowiedzieć się na temat", ru: "высказаться на тему" }
family:
  - { pl: "wypowiadac", ru: "высказывать; расторгать", relation: aspect }
  - { pl: "powiedzieć", ru: "сказать", relation: root, id: powiedziec }
  - { pl: "wypowiedz", ru: "высказывание", relation: derived }
etymology: "Приставка WY- «вы-» плюс POWIEDZIEĆ «сказать», от корня WIED- «ведать, знать», того же, что в русском «ведать», «поведать». Значение «расторгнуть договор» — от «высказать отказ, объявить вслух»."
memory: "Wypowiedzieć — высказать, произнести; и расторгнуть: wypowiedzieć umowę, wojnę. Wypowiedzenie — уведомление об увольнении. Wypowiedzieć się — высказаться. Читается «выповье́дзець»."
idioms:
  - { pl: "wypowiedzieć posłuszeństwo", ru: "отказаться повиноваться" }
formExamplesSkip:
  - { form: "wypowiedziani", reason: "расторгают договор, а не людей: формы для мужчин-людей нет" }
