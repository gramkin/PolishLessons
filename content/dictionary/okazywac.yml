# review
id: okazywac
format: 2
lemma: "okazywać"
rank: 2078
pos: verb
pron: { cyr: "оказы́ваць" }
senses:
  - id: show-feeling
    ru: "проявлять, выказывать (чувства, уважение)"
    examples:
      - pl: "Rzadko okazywał uczucia."
        ru: "Он редко выказывал чувства."
        source: { kind: authored }
      - pl: "Okazuj szacunek starszym."
        ru: "Проявляй уважение к старшим."
        source: { kind: authored }
      - pl: "Okazywana przy ludziach czułość go krępowała."
        ru: "Проявляемая при людях нежность его стесняла."
        source: { kind: authored }
  - id: turn-out
    ru: "okazywać się — оказываться"
    examples:
      - pl: "Okazuje się, że mieliśmy rację."
        ru: "Оказывается, мы были правы."
        source: { kind: authored }
      - pl: "Wszystko okazywało się prostsze, niż myśleli."
        ru: "Всё оказывалось проще, чем они думали."
        source: { kind: authored }
  - id: present
    ru: "предъявлять (документ, билет)"
    examples:
      - pl: "Przy wejściu okazuje się bilet."
        ru: "При входе предъявляют билет."
        source: { kind: authored }
      - pl: "Okazywane dokumenty sprawdzano pobieżnie."
        ru: "Предъявляемые документы проверяли бегло."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "КОРЕНЬ ТОТ ЖЕ, ЧТО В РУССКОМ «КАЗАТЬ»: pokazać — «показать», wskazać — «указать», okazać — «оказать, показать». Но главное значение польского okazywać — «ПРОЯВЛЯТЬ, выказывать» (чувства, уважение), а не «оказывать услугу». Русское «оказывать помощь» по-польски будет raczej udzielać pomocy." }
  - { kind: usage, text: "САМЫЙ ЧАСТЫЙ ОБОРОТ ЯЗЫКА ИДЁТ ОТ ЭТОГО ГЛАГОЛА: okazuje się, że… значит «оказывается, что…», а okazało się, że… — «оказалось, что…». Совпадение с русским полное, вплоть до порядка слов. Запомнив его, вы получаете готовую рамку для рассказа о любом повороте событий." }
  - { kind: government, text: "Проявляют ЧТО КОМУ — винительный плюс дательный: okazywać komuś szacunek, wdzięczność, zrozumienie. Русский говорит «выказывать кому-то уважение» так же. Возвратное okazywać się идёт с творительным или с że: okazał się dobrym człowiekiem, okazało się, że go nie ma." }
  - { kind: pronunciation, text: "Настоящее время по правилу -ywać: okazuję, okazujesz, okazuje — тот же ряд, что pracuję и marnuję. Обратите внимание на существительное okazja: оно значит «случай, повод», а в магазине — «выгодная покупка», и русской «оказии» не ровня." }
collocations:
  - { pl: "okazuje się, że", ru: "оказывается, что" }
  - { pl: "okazywać szacunek", ru: "проявлять уважение" }
  - { pl: "okazać dokumenty", ru: "предъявить документы" }
family:
  - { pl: "okazać", ru: "проявить; предъявить", relation: aspect, id: okazac }
  - { pl: "pokazywać", ru: "показывать", relation: root, id: pokazywac }
  - { pl: "okazja", ru: "случай, повод; выгодная покупка", relation: derived, id: okazja }
etymology: "Приставка o- плюс kazać в старом значении «показывать» — тот же корень, что в русских «казать», «показать», «указать». Отсюда okazać «показать, предъявить», okazja «случай» и okaz «экземпляр, образец». Современное польское kazać значит уже «велеть», но в приставочных глаголах старое значение сохранилось."
memory: "okazywać — «проявлять, выказывать»: okazywać szacunek, uczucia. Корень тот же, что в «показать» и «указать». И запомните готовую рамку: okazuje się, że… — «оказывается, что…»."
idioms:
  - { pl: "okazało się, że", ru: "оказалось, что" }
  - { pl: "okazywać komuś wdzięczność", ru: "выказывать кому-л. благодарность" }
