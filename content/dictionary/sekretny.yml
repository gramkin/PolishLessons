  - { pl: "tajny", ru: "тайный, секретный (официально)", relation: root }
etymology: "Из латинского SECRETUS «отделённый, тайный», от SECERNERE «отделять». Тот же корень, что в SEKRETARZ — «тот, кому доверяют тайны»."
memory: "Sekretny — тайный, личный: sekretny wielbiciel, sekretne przejście. Государственная тайна — tajny. Читается «сэкрэ́тны», с твёрдым «сэ»."
idioms:
