# review
id: sekretny
format: 2
lemma: "sekretny"
rank: 3731
pos: adj
pron: { cyr: "сэкрэ́тны" }
senses:
  - id: secret
    ru: "тайный, секретный (скрываемый от других)"
    examples:
      - pl: "Miała sekretnego wielbiciela."
        ru: "У неё был тайный поклонник."
        source: { kind: authored }
      - pl: "To mój sekretny przepis na sernik."
        ru: "Это мой секретный рецепт сырника."
        source: { kind: authored }
      - pl: "Spotykali się w sekretnym miejscu."
        ru: "Они встречались в тайном месте."
        source: { kind: authored }
  - id: hidden
    ru: "потайной, скрытый (о ящике, ходе)"
    examples:
      - pl: "W biurku jest sekretna szuflada."
        ru: "В столе есть потайной ящик."
        source: { kind: authored }
      - pl: "Z zamku prowadzi sekretne przejście."
        ru: "Из замка ведёт потайной ход."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Русское «секретный» о государственной тайне по-польски — TAJNY: TAJNE DOKUMENTY, ŚCIŚLE TAJNE, «совершенно секретно». SEKRETNY — личное, романтическое, сказочное: SEKRETNA MIŁOŚĆ, SEKRETNY OGRÓD, SEKRETNE PRZEJŚCIE. Существительное SEKRET — «тайна, секрет»: ZDRADZIĆ SEKRET." }
  - { kind: usage, text: "Одиннадцать форм без степеней: тайное либо скрыто, либо нет. Форма для мужчин-людей: SEKRETNI WIELBICIELE, «тайные поклонники». Наречие — SEKRETNIE, но чаще говорят W SEKRECIE или W TAJEMNICY, «по секрету, втайне»." }
  - { kind: government, text: "Обычно перед существительным: SEKRETNY PLAN, SEKRETNA BROŃ. «Держать в секрете» — TRZYMAĆ W SEKRECIE или W TAJEMNICY, с предлогом W и местным падежом." }
  - { kind: pronunciation, text: "Читается «сэкрэ́тны», три слога, ударение на предпоследнем. Оба E — твёрдое «э»: S и R перед E не смягчаются. Не «секре́тный» с мягким «с»." }
  - { kind: register, text: "Слово чуть литературное и детское: SEKRETNY OGRÓD, SEKRETNY PAMIĘTNIK. В официальной речи вместо него TAJNY, в разговорной — часто TAJEMNICZY, «таинственный», или просто W SEKRECIE." }
collocations:
  - { pl: "sekretny wielbiciel", ru: "тайный поклонник" }
  - { pl: "sekretne przejście", ru: "потайной ход" }
  - { pl: "sekretna broń", ru: "секретное оружие" }
family:
