notes:
  - { kind: usage, text: "Шесть форм — обычный набор существительного на -OŚĆ, где одна форма OSOBNOŚCI покрывает сразу несколько позиций: родительный, дательный и местный единственного, а также именительный и винительный множественного. Но практически слово живёт в одном обороте: NA OSOBNOŚCI «наедине, без посторонних». Остальные формы встречаются редко и в книжной речи. Множественное число почти не употребляется, потому что уединение не считают по штукам. Суффикс -OŚĆ отвечает русскому -ОСТЬ буквально: OSOBNOŚĆ и «особность», WOLNOŚĆ и «вольность», MIŁOŚĆ и «милость», и этот слой лексики русскоязычный строит сам." }
  - { kind: false-friend, text: "Опора здесь OSOBA, и она же ловушка. Польское OSOBA — нейтральное слово «человек, лицо»: TRZY OSOBY «три человека», OSOBA FIZYCZNA «физическое лицо». Русская «особа» звучит иронически или высокомерно, и перевести ею польское OSOBA нельзя почти никогда. Отсюда и всё гнездо: OSOBNY значит «отдельный», OSOBNO — «отдельно», OSOBOWY — «личный, пассажирский» (POCIĄG OSOBOWY «пассажирский поезд»), OSOBISTY — «личный». Русское «особый» отвечает польскому SZCZEGÓLNY или SPECJALNY, а не OSOBNY: OSOBNY POKÓJ это «отдельная комната», а не «особая»." }
  - { kind: government, text: "Слово почти всегда стоит с предлогом. Главный оборот — NA OSOBNOŚCI с местным падежом: POROZMAWIAJMY NA OSOBNOŚCI. Реже встречается W OSOBNOŚCI, тоже с местным, и звучит книжнее. Без предлога употребляется в родительном после глаголов поиска и желания: SZUKAĆ OSOBNOŚCI, POTRZEBOWAĆ OSOBNOŚCI «искать уединения, нуждаться в уединении», и здесь русский тоже требует родительного. Творительный OSOBNOŚCIĄ самостоятельно почти не встречается и появляется в оборотах с предлогами: DZIĘKI OSOBNOŚCI «благодаря уединению»." }
  - { kind: pronunciation, text: "Читается «осо́бносьць», три слога, ударение на предпоследнем. Оба O звучат отчётливо, без редукции: «о-со», а не «а-са». Буква Ś даёт мягкое «сь», Ć — мягкое «ць», и на конце слова они идут подряд: «сьць». Это то же окончание, что во всех словах на -OŚĆ, и произносить его следует одним движением, без вставного гласного. В форме OSOBNOŚCI конец звучит «сьци»: «осо́бносьци». В форме OSOBNOŚCIĄ последнее Ą даёт «он»: «осо́бносьцён»." }
