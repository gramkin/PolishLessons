etymology: "От OSOBNY «отдельный», а то от OSOBA, из праславянского *osoba, сложенного из приставки O- и корня *sobъ, того же, что в русском «себе» и «собой». Исходный смысл — «то, что само по себе», отдельное существо; отсюда и русская «особь», и «особый», и польское OSOBA. Дальше языки разошлись в оценке: польский оставил OSOBA нейтральным обозначением человека, а русский развил у «особы» иронический оттенок и для нейтрального смысла взял «лицо» и «человека». Суффикс -OŚĆ, образующий отвлечённые существительные, отвечает русскому -ОСТЬ один в один, так что OSOBNOŚĆ разбирается как «отдельность» — и именно это буквальное значение стоит за оборотом NA OSOBNOŚCI: разговор, вынесенный отдельно от остальных."
memory: "Корень osoba = русская «особа», но тон другой: польское osoba нейтрально, это просто «человек, лицо» (trzy osoby). Отсюда osobny «отдельный», osobno, pociąg osobowy «пассажирский поезд». Русское «особый» это szczególny, не osobny. Само слово osobność живёт в одном обороте: na osobności «наедине». Шесть форм, как у всех на -ość: суффикс отвечает русскому -ость буквально."
