# review
id: zadzwonic
format: 2
lemma: "zadzwonić"
rank: 233
pos: verb
aspect: perf
pron: { cyr: "задзво́ниць" }
senses:
  - id: call
    ru: "позвонить (кому-либо по телефону)"
    note: "Управление: zadzwonić do kogoś — буквально «позвонить к кому-то»."
    examples:
      - pl: "Zadzwoń do nas."
        ru: "Позвони нам."
        source: { kind: tatoeba, id: 5627272 }
      - pl: "Zadzwoń do mnie później."
        ru: "Позвони мне позже."
        source: { kind: tatoeba, id: 351517 }
      - pl: "Chciałbym zadzwonić."
        ru: "Я бы хотел позвонить."
        source: { kind: tatoeba, id: 524710 }
  - id: ring
    ru: "вызвать по телефону; зазвонить (о телефоне, звонке)"
    examples:
      - pl: "Zadzwoń na policję!"
        ru: "Вызывай полицию!"
        source: { kind: tatoeba, id: 569981 }
      - pl: "On zadzwoni po karetkę."
        ru: "Он вызовет скорую."
        source: { kind: tatoeba, id: 12954449 }
      - pl: "Telefon znowu zadzwonił."
        ru: "Телефон снова зазвонил."
        source: { kind: tatoeba, id: 4148617 }
notes:
  - { kind: usage, text: "Главная ловушка — предлог: zadzwonić do kogoś, а не «komuś». Zadzwoń do mnie значит «Позвони мне»." }
  - { kind: usage, text: "zadzwonić po kogoś значит «вызвать»: zadzwonić po karetkę «вызвать скорую», zadzwonić po lekarza «вызвать врача»." }
  - { kind: usage, text: "Несовершенный вид — dzwonić: Dzwonię do mamy codziennie «Я звоню маме каждый день»." }
collocations:
  - { pl: "zadzwonić do kogoś", ru: "позвонить кому-то" }
  - { pl: "zadzwonić po karetkę", ru: "вызвать скорую" }
  - { pl: "zadzwonić później", ru: "позвонить позже" }
  - { pl: "telefon zadzwonił", ru: "телефон зазвонил" }
etymology: "Приставка za- + dzwonić от dzwon «колокол»; тот же корень, что в русских «звонить», «звон», «колокольный звон»."
memory: "Главное — управление: zadzwonić do kogoś, буквально «позвонить к кому-то»: Zadzwoń do mnie. А zadzwonić po kogoś значит «вызвать»: zadzwonić po karetkę."
idioms:
  - { pl: "zadzwoniło w uszach", ru: "зазвенело в ушах" }
  - { pl: "zadzwonić po karetkę", ru: "вызвать скорую" }
  - { pl: "zadzwonić do kogoś", ru: "позвонить кому-то" }
