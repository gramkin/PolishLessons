notes:
  - { kind: false-friend, text: "BRACTWO — «братство» как организация, общество: BRACTWO RYCERSKIE, BRACTWO KURKOWE. Братство как чувство, братские отношения — BRATERSTWO: WOLNOŚĆ, RÓWNOŚĆ, BRATERSTWO." }
  - { kind: usage, text: "Девять форм, средний род. В местном W смягчается: W BRACTWIE. Родительный множественного — BRACTW." }
