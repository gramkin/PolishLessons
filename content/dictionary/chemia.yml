notes:
  - { kind: false-friend, text: "CHEMIA — «химия», но с E: «хэ́мья». В магазине CHEMIA — это моющие и чистящие средства, «бытовая химия»: DZIAŁ CHEMII. Как и по-русски, так говорят и о симпатии между людьми." }
  - { kind: usage, text: "Четыре живые формы, женский род, только единственное число. Родительный, дательный и местный — CHEMII. Множественное, архаичный CHEMIJ и звательный не даются." }
  - { kind: government, text: "По химии — Z CHEMII, Z с родительным: EGZAMIN Z CHEMII, OCENA Z CHEMII. Урок химии — LEKCJA CHEMII." }
  - { kind: pronunciation, text: "Читается «хэ́мья», ударение на первом слоге. CH — «х», MIA — «мья»." }
