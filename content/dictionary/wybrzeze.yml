notes:
  - { kind: pronunciation, text: "Слово собрано из приставки wy- и корня BRZEG «берег», причём g перед окончанием -e переходит в ż: brzeg — wybrzeże. Та же мена работает в Bóg — Boże и róg — rożek. Русское «побережье» построено из тех же частей, только с другой приставкой, и наше г тоже смягчается, но в ж не уходит." }
  - { kind: usage, text: "BRZEG и «берег» — одно праславянское слово *bergъ, и расхождение между ними не случайное, а правило. Там, где русский развил полногласие — берег, молоко, голова, дерево, корова, — польский стянул сочетание: brzeg, mleko, głowa, drzewo, krowa. Зная это соответствие, можно угадывать слова целыми рядами: достаточно убрать лишний гласный из русского слова и смягчить то, что осталось." }
collocations:
  - { pl: "na wybrzeżu", ru: "на побережье" }
  - { pl: "wzdłuż wybrzeża", ru: "вдоль побережья" }
  - { pl: "wybrzeże Bałtyku", ru: "побережье Балтики" }
family:
  - { pl: "brzeg", ru: "берег", relation: root, id: brzeg }
  - { pl: "przybrzeżny", ru: "прибрежный", relation: derived }
  - { pl: "brzeżek", ru: "краешек", relation: derived }
etymology: "От BRZEG с приставкой wy- и окончанием -e, буквально «то, что вдоль берега». Корень праславянский *bergъ, он же в русском «берег»; разница в огласовке — закономерная, а не случайная. Наше «побережье» устроено точно так же, только приставка «по-» вместо wy-, так что слова разошлись лишь выбором предлога, застывшего в приставке."
memory: "brzeg — это «берег»: там, где у нас полногласие, у поляков стяжение. А в производном g переходит в ż: brzeg — wybrzeże."
