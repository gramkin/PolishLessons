# review
id: wiatr
format: 2
lemma: "wiatr"
rank: 1463
pos: noun
pron: { cyr: "вятр" }
senses:
  - id: wind
    ru: "ветер"
    examples:
      - pl: "Wiatr był silny."
        ru: "Ветер был сильный."
        source: { kind: tatoeba, id: 1604664 }
      - pl: "Wiatr wieje z zachodu."
        ru: "Ветер дует с запада."
        source: { kind: tatoeba, id: 3615685 }
      - pl: "Północny wiatr wiał przez cały dzień."
        ru: "Северный ветер дул весь день."
        source: { kind: tatoeba, id: 3446217 }
  - id: figurative
    ru: "ветер в переносных оборотах"
    examples:
      - pl: "Kto sieje wiatr, ten zbiera burzę."
        ru: "Кто сеет ветер, пожнёт бурю."
        source: { kind: tatoeba, id: 440666 }
      - pl: "Pewnego dnia będę pędzić jak wiatr."
        ru: "Однажды я побегу как ветер."
        source: { kind: tatoeba, id: 600719 }
      - pl: "Nie rzucam słów na wiatr."
        ru: "Я не бросаю слов на ветер."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Праславянское *větrъ; русское «ветер» — то же слово, и все главные обороты совпадают." }
  - { kind: usage, text: "Предложный падеж неправильный: wiatr, но na wietrze «на ветру» — с чередованием a/e, как в русском «ветер — на ветру»." }
  - { kind: usage, text: "rzucać słowa na wiatr — «бросать слова на ветер»; mieć wiatr w głowie — «ветер в голове»." }
  - { kind: usage, text: "Пословица kto sieje wiatr, ten zbiera burzę — «кто сеет ветер, пожнёт бурю», ровно русская." }
collocations:
  - { pl: "silny wiatr", ru: "сильный ветер" }
  - { pl: "na wietrze", ru: "на ветру" }
  - { pl: "rzucać słowa na wiatr", ru: "бросать слова на ветер" }
  - { pl: "mieć wiatr w głowie", ru: "ветер в голове" }
etymology: "Праславянское *větrъ; русское «ветер» — то же самое слово, с тем же чередованием в предложном падеже."
memory: "wiatr — «ветер», слово родное и узнаваемое. Одна неправильность: предложный падеж na wietrze «на ветру», с чередованием a/e, ровно как русское «ветер — на ветру». Обороты тоже совпадают: rzucać słowa na wiatr «бросать слова на ветер», kto sieje wiatr, ten zbiera burzę."
idioms:
  - { pl: "rzucać słowa na wiatr", ru: "бросать слова на ветер" }
  - { pl: "mieć wiatr w głowie", ru: "ветер в голове" }
  - { pl: "kto sieje wiatr, ten zbiera burzę", ru: "кто сеет ветер, пожнёт бурю" }
formExamplesSkip:
  - { form: "wietrze", cell: "Звательный", reason: "звательный падеж: для неодушевлённого существительного он практически не употребляется" }
