notes:
  - { kind: false-friend, text: "ГЛАВНАЯ ЛОВУШКА В ВОЗВРАТНОЙ ФОРМЕ. Польское poddawać się значит «СДАВАТЬСЯ»: nie poddawaj się! — «не сдавайся!». Русское «поддаваться» значит совсем другое — уступать влиянию, идти на поводу. А польское «подвергать» это как раз poddawać czemuś, без возвратной частицы. Разобрать слово по частям можно (pod- плюс dawać, как «под-давать»), но значения разошлись." }
  - { kind: pronunciation, text: "ДВА ГЛАГОЛА НА -ać, А НАСТОЯЩЕЕ ВРЕМЯ РАЗНОЕ, и подсказка в самом окончании. Глаголы на -awać теряют -wa- и берут -aj-: poddawać даёт poddaję, poddajesz, как podawać — podaję и dawać — daję. Обычные же глаголы на -ać берут -am: zapewniać даёт zapewniam, zapewniasz, как czytać — czytam. Посмотрите на две буквы перед -ć, и спряжение известно заранее." }
  - { kind: government, text: "Подвергают ЧТО ЧЕМУ — винительный плюс ДАТЕЛЬНЫЙ, как по-русски: poddawać coś próbie, krytyce, leczeniu. Устойчиво poddawać w wątpliwość «подвергать сомнению» — тут винительный с предлогом w. Возвратное poddawać się идёт само или с дательным: poddać się losowi «покориться судьбе»." }
  - { kind: usage, text: "Вид несовершенный, совершенная пара — poddać. Оба употребляются постоянно: poddawał się wielokrotnie «он сдавался не раз», но poddał się po godzinie «сдался через час». Страдательное причастие poddawany обычно в медицинской и канцелярской речи: pacjent poddawany leczeniu." }
collocations:
  - { pl: "nie poddawaj się", ru: "не сдавайся" }
  - { pl: "poddawać w wątpliwość", ru: "подвергать сомнению" }
  - { pl: "poddawać krytyce", ru: "подвергать критике" }
family:
  - { pl: "dawać", ru: "давать", relation: root, id: dawac }
  - { pl: "poddać", ru: "подвергнуть; сдать", relation: aspect, id: poddac }
  - { pl: "poddany", ru: "подданный", relation: derived }
etymology: "Приставка pod- плюс dawać «давать» — те же части, что в русском «под-давать», и корень общеславянский. Но значения разошлись: польское poddawać się стало «сдаваться», а poddawać czemuś — «подвергать». Отсюда poddany «подданный» и poddanie się «капитуляция»."
memory: "poddawać — «подвергать» (poddawać krytyce), а poddawać się — «СДАВАТЬСЯ», а не «поддаваться». Настоящее время по правилу -awać: poddaję, poddajesz, как podaję от podawać."
idioms:
