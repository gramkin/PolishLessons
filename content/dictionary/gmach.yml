# review
id: gmach
format: 2
lemma: "gmach"
rank: 2103
pos: noun
pron: { cyr: "гмах" }
senses:
  - id: building
    ru: "здание, корпус (большое, представительное)"
    examples:
      - pl: "Nowy gmach teatru wygląda bardzo okazale."
        ru: "Новое здание театра выглядит очень внушительно."
        source: { kind: translated, id: 5653014 }
      - pl: "W miejscu tym ma powstać wielgachny gmach."
        ru: "На этом месте должно вырасти огромное здание."
        source: { kind: translated, id: 6160067 }
      - pl: "Mam czekać jutro na ciebie przed gmachem Opery?"
        ru: "Мне ждать тебя завтра перед зданием Оперы?"
        source: { kind: translated, id: 1197546 }
  - id: edifice
    ru: "громада, здание (о чём-то внушительном)"
    examples:
      - pl: "Wielgachny gmach rzucał cień na całą ulicę."
        ru: "Огромное здание отбрасывало тень на всю улицу."
        source: { kind: translated, id: 6160069 }
      - pl: "Gmach uniwersytetu stoi w centrum."
        ru: "Здание университета стоит в центре."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Не всякое здание: gmach — это крупное, представительное сооружение (театр, министерство, университет). Обычный дом — budynek или dom." }
  - { kind: false-friend, text: "Не путайте с «гам» или «гмых». Слово заимствовано из средневерхненемецкого gemach «покой, помещение»." }
  - { kind: government, text: "Мужской неодушевлённый; родительный — gmachu." }
  - { kind: usage, text: "Переносно — о больших умозрительных построениях: gmach nauki «здание науки»." }
collocations:
  - { pl: "gmach teatru", ru: "здание театра" }
  - { pl: "gmach sądu", ru: "здание суда" }
etymology: "Из средневерхненемецкого gemach «покой, помещение»; в польском значение сместилось к большому зданию."
memory: "gmach — крупное представительное здание: театра, суда, университета. Обычный дом — budynek. Слово немецкое по происхождению."
