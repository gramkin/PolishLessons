  - { kind: false-friend, text: "Не путайте с «гам» или «гмых». Слово заимствовано из средневерхненемецкого gemach «покой, помещение»." }
  - { kind: government, text: "Мужской неодушевлённый; родительный — gmachu." }
  - { kind: usage, text: "Переносно — о больших умозрительных построениях: gmach nauki «здание науки»." }
