etymology: "От SKARŻYĆ, от существительного SKARGA «жалоба», с приставкой O-, означающей здесь охват со всех сторон: обвинить значит обговорить человека вокруг, подать на него жалобу публично. Русский построил «обвинять» иначе — от «вины», то есть назвал не действие жалобщика, а состояние обвиняемого, и потому родства между «жаловаться» и «обвинять» в русском нет. В польском оно прямое и видное: SKARŻYĆ SIĘ, SKARŻYĆ, OSKARŻAĆ — один корень на три ступени, от бытовой жалобы до судебного обвинения. Отсюда и юридический слой: OSKARŻONY, OSKARŻYCIEL, AKT OSKARŻENIA. Приставка O- в этой роли встречается и в других словах: OPOWIADAĆ «рассказывать», буквально «обговорить», OMAWIAĆ «обсуждать», и каждый раз она означает обход предмета словами со всех сторон."
memory: "Польское гнездо однокоренное там, где русское нет: skarga «жалоба», skarżyć się «жаловаться», oskarżać «обвинять» — буквально «обжаловать кого-то кругом». Русский взял для этого два разных корня, «жалобу» и «вину». Главное — управление, оно расходится: oskarżać kogoś O coś с винительным, тогда как русский говорит «обвинять в чём» с предложным. Oskarżać w kradzieży сказать нельзя. Юридический слой учится вместе: oskarżony «обвиняемый», oskarżyciel «обвинитель», akt oskarżenia."
