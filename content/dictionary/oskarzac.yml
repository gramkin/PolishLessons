notes:
  - { kind: government, text: "Главное, что нужно запомнить из этой карточки, — управление, потому что оно расходится с русским. Обвинять кого в чём по-польски — OSKARŻAĆ KOGOŚ O COŚ, где второе дополнение идёт с предлогом O и в винительном падеже: OSKARŻAJĄ GO O KRADZIEŻ. Русский требует предлога «в» и предложного падежа: «обвиняют его в краже». Поэтому ошибка возникает сразу и слышна: сказать OSKARŻAĆ W KRADZIEŻY нельзя. Перед придаточным ставится O TO, ŻE: OSKARŻAJĄ GO O TO, ŻE ZATAIŁ DOCHODY. Отрицание переводит первое дополнение в родительный: NIE OSKARŻAM GO O NIC." }
  - { kind: false-friend, text: "Корень SKARŻ- в русском прямого двойника не имеет, и это редкий случай, когда польское слово приходится учить через собственное гнездо. Зато гнездо прозрачное и очень полезное: SKARGA значит «жалоба», SKARŻYĆ SIĘ — «жаловаться», SKARŻYĆ — «подавать в суд», а OSKARŻAĆ с приставкой O- — «обвинять», то есть буквально «пожаловаться на кого-то кругом, во всеуслышание». Русский для этих понятий взял разные корни: «жалоба» от «жалеть», а «обвинять» от «вины». Поэтому пара SKARŻYĆ SIĘ и OSKARŻAĆ в польском однокоренная, а в русском нет, и связь между «жаловаться» и «обвинять» приходится увидеть заново." }
  - { kind: usage, text: "Несовершенный вид, переходный, шестьдесят три формы: сорок две от глагола, десять от действительного причастия OSKARŻAJĄCY, одиннадцать от страдательного OSKARŻANY. Совершенная пара — OSKARŻYĆ, и основы различаются одной гласной: OSKARŻA- против OSKARŻY-, сравните OSKARŻAM и OSKARŻĘ. Юридические производные нужно знать вместе с глаголом: OSKARŻONY «обвиняемый, подсудимый», OSKARŻYCIEL «обвинитель», AKT OSKARŻENIA «обвинительное заключение», OSKARŻENIE «обвинение». Причастие OSKARŻANY и существительное OSKARŻONY не одно и то же: первое о продолжающемся обвинении, второе — процессуальный статус." }
  - { kind: pronunciation, text: "Читается «оска́ржаць», три слога, ударение на предпоследнем. Сочетание SK произносится слитно. Буква Ż даёт «ж», и в SKARŻ она идёт прямо после R, так что слог звучит «скарж», с «р» и «ж» подряд, без гласного между ними. Конечное Ć — мягкое «ць». В совершенном виде OSKARŻYĆ на месте A стоит Y: «оска́ржыць». В существительном OSKARŻONY четыре слога, ударение предпоследнее: «оскаржо́ны»." }
