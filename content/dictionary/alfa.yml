# review
id: alfa
format: 2
lemma: "alfa"
rank: 2395
pos: noun
pron: { cyr: "а́льфа" }
senses:
  - id: greek-letter
    ru: "альфа (буква)"
    examples:
      - pl: "Alfa to pierwsza litera alfabetu greckiego."
        ru: "Альфа — первая буква греческого алфавита."
        source: { kind: authored }
      - pl: "Kąt oznaczono alfą."
        ru: "Угол обозначили альфой."
        source: { kind: authored }
  - id: alpha-and-omega
    ru: "alfa i omega — альфа и омега"
    examples:
      - pl: "Był dla nich alfą i omegą."
        ru: "Он был для них альфой и омегой."
        source: { kind: authored }
      - pl: "Pieniądze to nie alfa i omega."
        ru: "Деньги — не альфа и омега."
        source: { kind: authored }
  - id: alpha-technical
    ru: "альфа (в науке, технике)"
    examples:
      - pl: "Promieniowanie alfa zatrzymuje kartka papieru."
        ru: "Альфа-излучение задерживает лист бумаги."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Ловушки нет: слово греческое и в оба языка пришло одинаково, вместе с алфавитом. Полезно помнить оборот alfa i omega «альфа и омега», то есть начало и конец, и переносно — непререкаемый авторитет: być dla kogoś alfą i omegą." }
  - { kind: pronunciation, text: "Два слога, ударение на первом: AL-fa. Польское l мягче русского, поэтому слышится «а́льфа». В дательном и предложном f смягчается: w alfie — «в а́льфе», тот же ряд, что в farma — farmie и norma — normie." }
  - { kind: usage, text: "В науке слово идёт в сложениях без склонения: promieniowanie alfa, cząstka alfa, fale alfa — здесь alfa стоит после существительного и не изменяется. Самостоятельно оно склоняется как обычное женское существительное на -a. Само alfabet происходит от альфы и беты." }
collocations:
  - { pl: "alfa i omega", ru: "альфа и омега" }
  - { pl: "promieniowanie alfa", ru: "альфа-излучение" }
  - { pl: "oznaczyć alfą", ru: "обозначить альфой" }
family:
  - { pl: "alfabet", ru: "алфавит", relation: derived }
  - { pl: "omega", ru: "омега", relation: antonym }
  - { pl: "litera", ru: "буква", relation: root }
etymology: "Из греческого alpha, а то — из финикийского aleph «бык»: древнейшие буквы называли по предметам, на которые походили. Вместе с бетой альфа дала слово alfabet, по-русски «алфавит». Оборот «альфа и омега» пришёл из Откровения: первая и последняя буквы греческого алфавита."
memory: "alfa — «альфа», первая буква греческого алфавита; вместе с бетой она дала слово alfabet. Оборот alfa i omega значит «начало и конец», а о человеке — непререкаемый авторитет. Предложный смягчает f: w alfie."
idioms:
  - { pl: "alfa i omega", ru: "альфа и омега, начало и конец" }
  - { pl: "być dla kogoś alfą i omegą", ru: "быть для кого-л. высшим авторитетом" }
