# review
id: lekki
format: 2
lemma: "lekki"
rank: 1553
pos: adj
pron: { cyr: "ле́кки" }
senses:
  - id: weight
    ru: "лёгкий (по весу)"
    examples:
      - pl: "Ta walizka jest bardzo lekka."
        ru: "Этот чемодан очень лёгкий."
        source: { kind: authored }
      - pl: "Co jest lżejsze: kilo złota czy kilo srebra?"
        ru: "Что легче: килограмм золота или килограмм серебра?"
        source: { kind: tatoeba, id: 967602 }
      - pl: "Pióro jest lekkie jak powietrze."
        ru: "Перо лёгкое как воздух."
        source: { kind: authored }
  - id: slight
    ru: "лёгкий, слабый, незначительный; нетрудный"
    note: "Очень частое значение: lekki ból «лёгкая боль», lekki wiatr «лёгкий ветер», lekka praca «нетрудная работа»."
    examples:
      - pl: "Mam lekki ból głowy."
        ru: "У меня лёгкая головная боль."
        source: { kind: tatoeba, id: 4731749 }
      - pl: "Mam lekkie przeziębienie."
        ru: "У меня лёгкая простуда."
        source: { kind: tatoeba, id: 7321598 }
      - pl: "Od rana mam lekką gorączkę."
        ru: "У меня с утра небольшая температура."
        source: { kind: tatoeba, id: 510069 }
notes:
  - { kind: usage, text: "lekki покрывает оба русских смысла: «лёгкий по весу» (lekka walizka) и «слабый, незначительный» (lekki ból, lekki wiatr)." }
  - { kind: false-friend, text: "«Легко» в смысле «нетрудно» будет łatwo, а не lekko. To łatwe «это легко», но lekko pada deszcz «слегка идёт дождь». Наречие lekko значит именно «слегка»." }
  - { kind: usage, text: "Сравнение отбрасывает -ki и меняет основу: lekki → lżejszy → najlżejszy. Та же основа видна в ulga «облегчение» — родня русской «льготе»." }
  - { kind: usage, text: "Устойчивые сочетания: lekka atletyka «лёгкая атлетика», kobieta lekkich obyczajów «женщина лёгкого поведения», lekko mówiąc «мягко говоря»." }
collocations:
  - { pl: "lekki wiatr", ru: "лёгкий ветер" }
  - { pl: "lekki ból", ru: "лёгкая боль" }
  - { pl: "lekka praca", ru: "нетрудная работа" }
  - { pl: "lekka atletyka", ru: "лёгкая атлетика" }
family:
  - { pl: "lekko", ru: "легко, слегка", relation: derived }
  - { pl: "lekkość", ru: "лёгкость", relation: derived }
  - { pl: "ulga", ru: "облегчение, льгота", relation: derived }
etymology: "Праславянское *lьgъkъ — то же слово, что русское «лёгкий». Та же основа видна в ulga «облегчение», родственном русской «льготе»."
memory: "lekki — «лёгкий» и по весу, и по силе: lekka walizka, lekki ból, lekki wiatr. Сравнение выбрасывает -ki и меняет основу: lżejszy «легче», najlżejszy. Главная ловушка для русского уха: «легко» в значении «нетрудно» будет łatwo, а lekko значит «слегка» — lekko pada deszcz «слегка идёт дождь». Родня подсказывает связь: ulga «облегчение» — то же, что русская «льгота»."
idioms:
