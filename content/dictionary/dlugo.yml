# review
id: dlugo
format: 2
lemma: "długo"
rank: 382
pos: adv
pron: { cyr: "ду́уго" }
senses:
  - id: long-time
    ru: "долго"
    examples:
      - pl: "Długo na nią czekałem."
        ru: "Я долго ждал её."
        source: { kind: tatoeba, id: 450198 }
      - pl: "Jak długo to trwa?"
        ru: "Как долго это длится?"
        source: { kind: tatoeba, id: 6313128 }
      - pl: "Dziesięć lat to długo."
        ru: "Десять лет - это долго."
        source: { kind: tatoeba, id: 5975454 }
  - id: longer
    ru: "дольше (сравнительная степень — dłużej)"
    examples:
      - pl: "Nie wytrzymam dłużej!"
        ru: "Я не могу больше терпеть."
        source: { kind: tatoeba, id: 352506 }
      - pl: "Zostań jeszcze dłużej."
        ru: "Останься ещё подольше."
        source: { kind: authored }
      - pl: "Nie mogę czekać dłużej."
        ru: "Я не могу больше ждать."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Jak długo? — «как долго?», и очень часто отвечает русскому «сколько времени»: Jak długo to zajmie? «Сколько времени это займёт?»" }
  - { kind: usage, text: "Степени сравнения нерегулярные, как и в русском: długo → dłużej → najdłużej («долго — дольше — дольше всех»)." }
  - { kind: false-friend, text: "О длине предмета говорят не długo, а прилагательным długi: długi stół «длинный стол». Наречие długo — только о времени." }
  - { kind: usage, text: "Długo już tu pracujesz? значит «Ты давно тут работаешь?» — там, где русский берёт «давно», поляк часто берёт długo." }
collocations:
  - { pl: "jak długo?", ru: "как долго?" }
  - { pl: "na długo", ru: "надолго" }
  - { pl: "nie dłużej niż", ru: "не дольше чем" }
  - { pl: "długo czekać", ru: "долго ждать" }
etymology: "От прилагательного długi «длинный», праславянское *dьlgъ; русское «долго» — то же самое слово, только без перестановки -ьl- в -łu-."
memory: "długo — «долго», и степени сравнения нерегулярны ровно как в русском: długo → dłużej → najdłużej. Вопрос Jak długo? покрывает и «как долго», и «сколько времени»."
idioms:
  - { pl: "kto długo sypia, tego się bieda czepia", ru: "кто долго спит, тот живёт в нужде" }
  - { pl: "na długo", ru: "надолго" }
  - { pl: "długo i szczęśliwie", ru: "долго и счастливо" }
formExamples:
  - form: "długo"
    pl: "Jak długo to trwa?"
    ru: "Как долго это длится?"
    source: { kind: tatoeba, id: 6313128 }
  - form: "długo"
    pl: "Jak długo to zajmie?"
    ru: "Сколько времени это займёт?"
    source: { kind: tatoeba, id: 579550 }
  - form: "długo"
    pl: "Jak długo to zajmuje?"
    ru: "Сколько времени это займёт?"
    source: { kind: tatoeba, id: 6313127 }
  - form: "dłużej"
    pl: "Nie wytrzymam dłużej!"
    ru: "Я не могу больше терпеть."
    source: { kind: tatoeba, id: 352506 }
  - form: "dłużej"
    pl: "Nie mogę dłużej czekać."
    ru: "Я не могу больше ждать."
    source: { kind: tatoeba, id: 356436 }
  - form: "dłużej"
    pl: "Tom spał o wiele dłużej, niż zamierzał."
    ru: "Том спал намного дольше, чем собирался."
    source: { kind: tatoeba, id: 12470229 }
  - form: "najdłużej"
    pl: "Który gad żyje najdłużej?"
    ru: "Какая рептилия живёт дольше всех?"
