  - form: "najdłużej"
    pl: "Kto wytrzyma najdłużej?"
    ru: "Кто выдержит дольше всех?"
    source: { kind: authored }
  - form: "najdłużej"
    pl: "To trwało najdłużej ze wszystkiego."
    ru: "Это длилось дольше всего."
    source: { kind: authored }
