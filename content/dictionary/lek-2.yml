notes:
  - { kind: false-friend, text: "Польский развёл то, что русский держит в одном слове. STRACH это страх перед чем-то близким и понятным: STRACH PRZED PSEM. А LĘK — тревога без ясной причины, то смутное чувство, которое у нас скорее «тревога», и именно это слово стоит в медицине: ZABURZENIA LĘKOWE значит «тревожные расстройства». Поэтому «страх» переводится то как STRACH, то как LĘK, и выбирать надо по тому, есть ли у страха предмет." }
  - { kind: usage, text: "Девять форм, мужской род, неодушевлённое. Носовой Ę держится во всех формах: LĘK, LĘKU, LĘKIEM, LĘKI. Не путайте на письме с LEK «лекарство», где никакого хвостика нет: LEKI это лекарства, а LĘKI — страхи, и различает их только хвостик под буквой. Множественное LĘKI обычно и означает именно навязчивые страхи." }
  - { kind: government, text: "Страх перед чем-то — LĘK PRZED CZYMŚ, предлог PRZED с творительным, в точности как русское «перед»: LĘK PRZED CIEMNOŚCIĄ. А вот боязнь высоты — LĘK WYSOKOŚCI, просто родительный, без всякого предлога. Со страхом — Z LĘKIEM, творительный с предлогом Z. Испытывать страх — ODCZUWAĆ LĘK, винительный без предлога." }
  - { kind: pronunciation, text: "Читается «ленк», один слог, и знак ударения не нужен. Носовой Ę перед K даёт «эн», а L перед ним звучит мягко, поэтому получается «лен», а не «лэн». В косвенных падежах появляется второй слог: LĘKU это «ле́нку», LĘKIEM — «ле́нкем», с мягким «ке». Главное — не прочесть это как «лек», лекарство." }
  - { kind: register, text: "Слово книжное и врачебное. В обиходной речи поляк скажет STRACH или BOJĘ SIĘ, а LĘK прозвучит в кабинете врача, в книге и в серьёзном разговоре о себе. Прилагательное LĘKLIWY значит «робкий, пугливый» и о человеке, и о взгляде. LĘK WYSOKOŚCI и LĘK PRZESTRZENI — обычные названия двух страхов, которые знает каждый." }
collocations:
  - { pl: "lęk przed ciemnością", ru: "страх темноты" }
