etymology: "Праславянское слово с носовым гласным, от того же корня, что глагол LĘKAĆ SIĘ «бояться». В русском литературном языке родственника не осталось, зато он жив у соседей: по-украински «ляк» значит именно испуг. И здесь работает уже знакомое правило носовых: там, где поляк пишет Ę, у восточных славян стоит Я, как в PIĘĆ против «пяти» и JĘZYK против «языка». LĘK и «ляк» — одно и то же слово."
memory: "Тревога, смутный страх без ясной причины, в отличие от strach — страха перед чем-то определённым. Это слово медицины: zaburzenia lekowe «тревожные расстройства». Читается «ленк», один слог. На письме не путайте с lek «лекарство»: различает их только хвостик под e. Страх перед чем-то — lek przed czyms, с творительным, как и русское «перед»."
idioms:
  - { pl: "lęk wysokości", ru: "боязнь высоты" }
