# review
id: wznosic
format: 2
lemma: "wznosić"
rank: 2174
pos: verb
aspect: imperf
pron: { cyr: "взно́сиць" }
senses:
  - id: rise
    ru: "возвышаться, подниматься (wznosić się)"
    examples:
      - pl: "Zamek wznosi się nad miastem."
        ru: "Замок возвышается над городом."
        source: { kind: tatoeba, id: 1772939 }
      - pl: "Droga tu wznosi się łagodnie w górę."
        ru: "Дорога здесь плавно поднимается вверх."
        source: { kind: translated, id: 415420 }
      - pl: "Im wyżej się wznosimy, tym chłodniejsze staje się powietrze."
        ru: "Чем выше мы поднимаемся, тем холоднее становится воздух."
        source: { kind: translated, id: 3696444 }
  - id: erect
    ru: "возводить, воздвигать"
    examples:
      - pl: "Nikt nie ma intencji wznoszenia muru."
        ru: "Никто не намерен возводить стену."
        source: { kind: translated, id: 3188289 }
      - pl: "Pomału artykuły wznoszą się na wyższy poziom."
        ru: "Постепенно статьи поднимаются на более высокий уровень."
        source: { kind: translated, id: 2311158 }
notes:
  - { kind: government, text: "Без się — переходный «возводить»: wznosić mur «возводить стену». С się — непереходный «возвышаться»: zamek wznosi się nad miastem." }
  - { kind: usage, text: "wznosić toast «поднимать тост» — устойчивый оборот, как в русском." }
  - { kind: false-friend, text: "Корень nosić «носить» с приставкой wz- «вз-»: буквально «взносить». Русское «возносить» — то же самое слово." }
  - { kind: usage, text: "Совершенный вид — wznieść." }
collocations:
  - { pl: "wznosić się nad", ru: "возвышаться над" }
  - { pl: "wznosić toast", ru: "поднимать тост" }
etymology: "wz- + nosić «носить»; русское «возносить», «возвышать» собрано из тех же частей."
memory: "wznosić — «возводить», а с się «возвышаться»: zamek wznosi się nad miastem. Запомните wznosić toast «поднимать тост». Совершенный вид — wznieść."
idioms:
  - { pl: "wznosić się nad", ru: "возвышаться над" }
  - { pl: "wznosić toast", ru: "поднимать тост" }
formExamplesSkip:
  - { form: "wznoszeni", reason: "страдательное причастие мужского лица, а возводят стену, памятник или тост: примечание к карточке даёт wznosić mur, wznosić toast. Человека не возводят, поэтому формы нет" }
