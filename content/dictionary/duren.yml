notes:
  - { kind: false-friend, text: "Прямой родственник русского «дурня», и совпадение почти полное: DUREŃ значит «дурень, глупец», слово разговорное и бранное, но не грубое. Русское «дурень» звучит так же мягко, так что пара переводится один в один. Осторожнее с соседями: DURNY значит «глупый» и в польском это скорее областное и разговорное, а нейтральное слово — GŁUPI. А вот DURNIEĆ значит «глупеть, тупеть», и русское «дурнеть» означает совсем другое — становиться некрасивым. Поэтому ON DURNIEJE это «он тупеет», а не «он дурнеет»." }
  - { kind: government, text: "Мужской род, одушевлённое, лицо, и склонение показывает выпадение беглой гласной: DUREŃ, но DURNIA, DURNIOWI, DURNIEM — гласная E выпадает во всех косвенных формах, а Ń остаётся мягким. Это то же явление, что в SZALENIEC и SZALEŃCA, и запоминать стоит пару форм, а не одну. Винительный равен родительному: WIDZIAŁ DURNIA. Звательный DURNIU употребляется как прямое оскорбление. В таблице два родительных множественного, DURNI и DURNIÓW, и оба встречаются — то же колебание, что у TALERZY и TALERZÓW." }
  - { kind: pronunciation, text: "Читается «ду́рэнь», ударение на предпоследнем слоге из двух. Конечное Ń это мягкое «нь», произносимое отчётливо. В родительном DURNIA гласная E выпадает, слогов остаётся два: «ду́рня». В именительном множественного DURNIE слышно «ду́рне», с мягким н. В родительном множественного DURNIÓW буква Ó даёт «у», а конечное W оглушается: «дурню́ф». Так три формы одного слова звучат заметно по-разному." }
  - { kind: register, text: "Слово разговорное и обидное, но мягче, чем крепкие ругательства: его можно услышать в семейной перепалке и в прессе в кавычках. Частотные сочетания: DUREŃ Z NIEGO «дурень он», UDAWAĆ DURNIA «валять дурака», ROBIĆ Z KOGOŚ DURNIA «делать из кого-то дурака». Последние два отвечают русским оборотам почти дословно. Уменьшительное DURNIEŃ не употребляется; усилительное DURNOTA означает глупость как свойство. В обращении DURNIU слово звучит резко, и в вежливой речи его не бывает." }
