etymology: "Из праславянского *durъ «глупость, дурь», того же корня, что русские «дурь», «дурак», «дурень», «одурь». Суффикс -EŃ обозначает лицо по свойству и отвечает русскому -ЕНЬ в «дурне» точно, так что слово образовано в двух языках одинаково и одинаково же звучит. Беглая гласная E в этом суффиксе выпадает в косвенных формах — DUREŃ, но DURNIA, — и это общее свойство типа: тот же выпад виден в SZALENIEC и SZALEŃCA, в UCZEŃ и UCZNIA. Из гнезда идут DURNY «глупый», DURNIEĆ «тупеть», DURNOTA «глупость», и русскому они понятны все, кроме последнего: «дурнота» по-русски означает тошноту, а не глупость."
memory: "Прямой родственник «дурня», и перевод один в один; слово обидное, но не грубое. Беглая e выпадает: dureń, но durnia, durniowi — как szaleniec и szaleńca. Два родительных множественного, durni и durniów, как talerzy и talerzów. Ловушки в гнезде: durnieć значит «тупеть», а не «дурнеть»; durnota — глупость, а не тошнота. Нейтральное «глупый» — głupi, не durny."
idioms:
