# review
id: prawda
format: 2
lemma: "prawda"
rank: 93
pos: noun
pron: { cyr: "пра́вда" }
senses:
  - id: truth
    ru: "правда, истина"
    examples:
      - pl: "To prawda."
        ru: "Это правда."
        source: { kind: tatoeba, id: 356399 }
      - pl: "Tom nie zna prawdy."
        ru: "Том не знает правды."
        source: { kind: tatoeba, id: 6328150 }
      - pl: "On wierzył w prawdę."
        ru: "Он поверил в правду."
        source: { kind: tatoeba, id: 3660825 }
  - id: tag
    ru: "правда?, не так ли? (в конце фразы)"
    examples:
      - pl: "Ładnie tu, prawda?"
        ru: "Красиво здесь, правда?"
        source: { kind: authored }
      - pl: "Jego historia okazała się prawdą."
        ru: "Его история оказалась правдой."
        source: { kind: tatoeba, id: 1002581 }
notes:
  - { kind: usage, text: "В конце предложения prawda работает как русское «правда?»: Jesteś głodny, prawda?" }
  - { kind: usage, text: "Отсюда же наречие naprawdę «по-настоящему, действительно»." }
collocations:
  - { pl: "to prawda", ru: "это правда" }
  - { pl: "mówić prawdę", ru: "говорить правду" }
  - { pl: "co prawda", ru: "правда, хотя" }
etymology: "Праславянское *pravьda от *pravъ «прямой, правый» — то же слово, что русское «правда»."
memory: "Совпадает с русским и по форме, и по употреблению, включая вопрос в конце фразы: Ładnie tu, prawda? Отсюда же naprawdę «по-настоящему»."
idioms:
  - { pl: "co prawda", ru: "правда, хотя" }
  - { pl: "prawdę mówiąc", ru: "по правде говоря" }
  - { pl: "godzina prawdy", ru: "час истины" }
