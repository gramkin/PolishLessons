# review
id: rog
format: 2
lemma: "róg"
rank: 1519
pos: noun
pron: { cyr: "рук" }
senses:
  - id: horn
    ru: "рог (у животного)"
    examples:
      - pl: "Byk wziął torreadora na rogi."
        ru: "Бык взял тореадора на рога."
        source: { kind: tatoeba, id: 6441013 }
      - pl: "Aby schwytać byka, należy wziąć go za rogi."
        ru: "Чтобы поймать быка, нужно взять его за рога."
        source: { kind: tatoeba, id: 831791 }
      - pl: "Ślimak pokazał rogi"
        ru: "Улитка показала рожки."
        source: { kind: translated, id: 2493428 }
  - id: corner
    ru: "угол (улицы, комнаты, предмета)"
    examples:
      - pl: "W rogu pokoju stała duża szafa."
        ru: "В углу комнаты стоял большой шкаф."
        source: { kind: tatoeba, id: 5959874 }
      - pl: "Stał na rogu ulic."
        ru: "Он стоял на углу улиц."
        source: { kind: translated, id: 369261 }
      - pl: "Na następnym rogu skręć w lewo."
        ru: "На следующем углу поверни налево."
        source: { kind: translated, id: 440610 }
  - id: instrument
    ru: "рог (духовой инструмент)"
    examples:
      - pl: "Sansonetto zadął w róg, wyzywając olbrzyma na pojedynek."
        ru: "Сансонетто затрубил в рог, вызывая великана на поединок."
        source: { kind: translated, id: 10472098 }
      - pl: "Myśliwy zadął w róg."
        ru: "Охотник затрубил в рог."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Одно слово покрывает два русских: róg «рог» (у животного, инструмент) и róg «угол» (улицы, комнаты). Различает только контекст." }
  - { kind: false-friend, text: "Геометрический угол — это kąt, а не róg: kąt prosty «прямой угол». róg — угол как место стыка: na rogu ulicy «на углу улицы»." }
  - { kind: usage, text: "za rogiem значит «за углом» и в прямом, и в переносном смысле: Wiosna jest tuż za rogiem «Весна уже на носу»." }
  - { kind: usage, text: "ó в основе чередуется с o: róg, но rogu, rogiem, rogi — при склонении ó переходит в o." }
collocations:
  - { pl: "na rogu", ru: "на углу" }
  - { pl: "za rogiem", ru: "за углом" }
  - { pl: "wziąć byka za rogi", ru: "взять быка за рога" }
etymology: "Праславянское *rogъ — то же слово, что русское «рог». Значение «угол» развилось из «выступ, торчащая часть»; русский сохранил этот ход в «рог изобилия» и в «на углу»."
memory: "róg — это и «рог», и «угол»: wziąć byka za rogi «взять быка за рога», но na rogu ulicy «на углу улицы». При склонении ó переходит в o: róg, но rogu. Геометрический угол — это kąt, а не róg."
idioms:
  - { pl: "wziąć byka za rogi", ru: "взять быка за рога" }
  - { pl: "za rogiem", ru: "за углом, на носу" }
  - { pl: "róg obfitości", ru: "рог изобилия" }
  - { pl: "zapędzić w kozi róg", ru: "загнать в угол" }
