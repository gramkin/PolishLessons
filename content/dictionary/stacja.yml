  - { kind: usage, text: "Женский род на -ja: stacja, stacji, stację. Родительный, дательный и предложный совпадают — stacji." }
  - { kind: usage, text: "stacja benzynowa «заправка», stacja metra «станция метро», stacja telewizyjna «телеканал»." }
