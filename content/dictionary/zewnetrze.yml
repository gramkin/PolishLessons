notes:
  - { kind: register, text: "Слово книжное и профессиональное (архитектура, дизайн, автомобили). В быту говорят NA ZEWNĄTRZ «снаружи» или ZEWNĘTRZNA STRONA «внешняя сторона»." }
  - { kind: usage, text: "Средний род, склоняется как MORZE: W ZEWNĘTRZU, ZEWNĘTRZEM. Пара к WNĘTRZE «внутренность, интерьер». Множественное число встречается редко, в текстах об архитектуре." }
  - { kind: pronunciation, text: "Ę перед T — «эн», TRZ — «тш»: «зэвнэ́нтшэ». Ударение на предпоследнем слоге." }
