# review
id: zmuszac
format: 2
lemma: "zmuszać"
rank: 2283
pos: verb
pron: { cyr: "змуша́ць" }
senses:
  - id: force
    ru: "заставлять, принуждать"
    examples:
      - pl: "Nikt cię nie zmusza do wyjazdu."
        ru: "Никто тебя не заставляет уезжать."
        source: { kind: authored }
      - pl: "Zmuszali nas do milczenia."
        ru: "Нас заставляли молчать."
        source: { kind: authored }
  - id: compel
    ru: "вынуждать (об обстоятельствах)"
    examples:
      - pl: "Choroba zmusza go do odpoczynku."
        ru: "Болезнь вынуждает его отдыхать."
        source: { kind: authored }
      - pl: "Okoliczności zmuszają nas do zmiany planów."
        ru: "Обстоятельства вынуждают нас изменить планы."
        source: { kind: authored }
  - id: coercion
    ru: "принуждение (отглаг.)"
    examples:
      - pl: "Zmuszanie dzieci do jedzenia nie pomaga."
        ru: "Заставлять детей есть не помогает."
        source: { kind: authored }
notes:
  - { kind: government, text: "ГЛАВНОЕ ОТЛИЧИЕ ОТ РУССКОГО — В ДОПОЛНЕНИИ. Zmuszać требует ZMUSZAĆ KOGOŚ DO CZEGOŚ: винительный на человека и DO плюс РОДИТЕЛЬНЫЙ на действие. Русское «заставлять» берёт инфинитив: «заставлять уйти». По-польски инфинитива тут нет, нужно отглагольное существительное: zmuszać DO WYJŚCIA, do jedzenia, do pracy. Это самая частая ошибка при переводе с русского." }
  - { kind: usage, text: "Отсюда и оборот BYĆ ZMUSZONYM DO CZEGOŚ — «быть вынужденным»: byłem zmuszony do odejścia. Прилагательное ZMUSZONY значит «вынужденный», а существительное PRZYMUS — «принуждение»: pod przymusem «под принуждением». Все три держатся того же управления с do." }
  - { kind: usage, text: "Вид несовершенный: есть ZMUSZAJĄC «заставляя» и причастие ZMUSZAJĄCY, деепричастия на -wszy нет. Совершенная пара — ZMUSIĆ: zmuszam «заставляю», zmuszę «заставлю». Корень тот же, что в MUSIEĆ «быть должным», а оно пришло из немецкого müssen." }
collocations:
  - { pl: "zmuszać do czegoś", ru: "заставлять к чему-л." }
  - { pl: "być zmuszonym", ru: "быть вынужденным" }
  - { pl: "pod przymusem", ru: "под принуждением" }
family:
  - { pl: "zmusić", ru: "заставить (сов.)", relation: aspect, id: zmusic }
  - { pl: "musieć", ru: "быть должным", relation: root, id: musiec }
  - { pl: "pozwalać", ru: "позволять", relation: antonym, id: pozwalac }
etymology: "Приставка z- и musić, от musieć «быть должным», которое пришло в польский из средневерхненемецкого müezen, нынешнего müssen. Русский на эту роль взял свои слова — «должен», «заставлять», — поэтому родства здесь нет. Отсюда przymus «принуждение» и musowo «обязательно»."
memory: "zmuszać — «заставлять», но управление другое: zmuszać kogoś DO czegoś, с do и родительным. Русский инфинитив тут не годится: «заставлять уйти» будет zmuszać DO WYJŚCIA. И запомни być zmuszonym do czegoś — «быть вынужденным»."
idioms:
  - { pl: "zmuszać kogoś do czegoś", ru: "принуждать кого-л. к чему-л." }
  - { pl: "nikt cię nie zmusza", ru: "никто тебя не заставляет" }
