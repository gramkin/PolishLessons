# review
id: zbyt
format: 2
lemma: "zbyt"
rank: 267
pos: adv
pron: { cyr: "збыт" }
senses:
  - id: too
    ru: "слишком"
    examples:
      - pl: "Jesteś zbyt leniwy."
        ru: "Ты слишком ленивый."
        source: { kind: tatoeba, id: 5416836 }
      - pl: "On jest zbyt gruby."
        ru: "Он слишком толстый."
        source: { kind: tatoeba, id: 8675021 }
      - pl: "Tom jest zbyt zajęty."
        ru: "Том слишком занят."
        source: { kind: tatoeba, id: 4491102 }
  - id: too-much
    ru: "слишком (много, дорого, поздно)"
    examples:
      - pl: "Tom zbyt dużo pracuje."
        ru: "Том слишком много работает."
        source: { kind: tatoeba, id: 4491099 }
      - pl: "Krawat jest zbyt drogi."
        ru: "Галстук слишком дорогой."
        source: { kind: tatoeba, id: 1855044 }
      - pl: "Jesteś zbyt cyniczny."
        ru: "Ты слишком циничен."
        source: { kind: tatoeba, id: 4950515 }
notes:
  - { kind: usage, text: "zbyt всегда стоит перед прилагательным или наречием: zbyt drogi «слишком дорогой», zbyt dużo «слишком много», zbyt późno «слишком поздно»." }
  - { kind: usage, text: "В разговорной речи вместо zbyt чаще говорят za: za drogi = zbyt drogi. Слитное niezbyt значит «не слишком»." }
  - { kind: false-friend, text: "Существует омоним — существительное zbyt «сбыт, продажа» (rynek zbytu «рынок сбыта»). Это другое слово, со своим склонением; здесь оно не разбирается." }
collocations:
  - { pl: "zbyt dużo", ru: "слишком много" }
  - { pl: "zbyt późno", ru: "слишком поздно" }
  - { pl: "zbyt drogi", ru: "слишком дорогой" }
  - { pl: "niezbyt", ru: "не слишком" }
etymology: "От zbyć / zbywać «сбывать, избывать»: наречие значит «сверх меры»; существительное того же корня — zbyt «сбыт», как в русском."
memory: "zbyt — «слишком»: zbyt drogi, zbyt dużo. В разговоре чаще говорят za: za drogi. А существительное zbyt «сбыт» — отдельное слово."
idioms:
  - { pl: "zbyt wiele", ru: "слишком много" }
  - { pl: "zbyt późno", ru: "слишком поздно" }
  - { pl: "zbyt piękne, żeby było prawdziwe", ru: "слишком хорошо, чтобы быть правдой" }
