# review
id: rachunek
format: 2
lemma: "rachunek"
rank: 1277
pos: noun
pron: { cyr: "раху́нэк" }
senses:
  - id: bill
    ru: "счёт (в ресторане, к оплате)"
    examples:
      - pl: "Proszę o rachunek."
        ru: "Счёт, пожалуйста."
        source: { kind: tatoeba, id: 382593 }
      - pl: "Rachunek, proszę."
        ru: "Счёт, пожалуйста."
        source: { kind: translated, id: 10542197 }
      - pl: "Zapłacę rachunek."
        ru: "Я оплачу счёт."
        source: { kind: translated, id: 562935 }
  - id: bills
    ru: "счета (коммунальные, регулярные)"
    examples:
      - pl: "Zapłaciłem rachunki."
        ru: "Я оплатил счета."
        source: { kind: translated, id: 6392759 }
      - pl: "To może nie jest wymarzona praca, ale pozwala opłacić rachunki."
        ru: "Это, может, и не работа мечты, но позволяет оплачивать счета."
        source: { kind: translated, id: 7904557 }
      - pl: "On odmówił płacenia rachunków."
        ru: "Он отказался оплачивать счета."
        source: { kind: tatoeba, id: 12959990 }
  - id: account
    ru: "счёт (банковский); расчёт"
    examples:
      - pl: "Dopisz to do mojego rachunku."
        ru: "Запиши это на мой счёт."
        source: { kind: translated, id: 2397708 }
      - pl: "W rachunku jest błąd."
        ru: "В счёте ошибка."
        source: { kind: translated, id: 13951060 }
      - pl: "Mam rachunki do wyrównania z Tomem."
        ru: "У меня с Томом свои счёты."
        source: { kind: translated, id: 13655475 }
notes:
  - { kind: usage, text: "В ресторане просят Rachunek, proszę! «Счёт, пожалуйста!» Разговорный вариант — Płacę! «Расплачиваюсь!»" }
  - { kind: government, text: "zapłacić rachunek «оплатить счёт» — винительный; dopisać do rachunku «записать на счёт» — предлог do с родительным." }
  - { kind: usage, text: "Rachunek bankowy «банковский счёт», rachunek sumienia «испытание совести», na własny rachunek «на свой страх и риск»." }
  - { kind: false-friend, text: "Русский «счёт» в спортивном смысле — это wynik, а не rachunek: wynik meczu «счёт матча»." }
collocations:
  - { pl: "zapłacić rachunek", ru: "оплатить счёт" }
  - { pl: "rachunek bankowy", ru: "банковский счёт" }
  - { pl: "opłacić rachunki", ru: "оплатить счета" }
  - { pl: "na własny rachunek", ru: "на свой страх и риск" }
etymology: "Из немецкого Rechnung «расчёт, счёт», от rechnen «считать». Русский «счёт» — своё слово, от «честь, читать»."
memory: "rachunek — «счёт»: и в ресторане (Rachunek, proszę!), и коммунальный (opłacić rachunki), и банковский (rachunek bankowy). Но счёт матча — это wynik, не rachunek."
idioms:
  - { pl: "rachunek, proszę", ru: "счёт, пожалуйста" }
  - { pl: "na własny rachunek", ru: "на свой страх и риск" }
  - { pl: "rachunek sumienia", ru: "испытание совести" }
