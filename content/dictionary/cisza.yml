# review
id: cisza
format: 2
lemma: "cisza"
rank: 1458
pos: noun
pron: { cyr: "ци́ша" }
senses:
  - id: silence
    ru: "тишина, молчание"
    examples:
      - pl: "W pokoju panowała cisza."
        ru: "В комнате царила тишина."
        source: { kind: tatoeba, id: 3853627 }
      - pl: "Lubię ciszę i spokój."
        ru: "Я люблю тишину и покой."
        source: { kind: tatoeba, id: 4490544 }
      - pl: "Zachowaj ciszę."
        ru: "Соблюдай тишину."
        source: { kind: translated, id: 1844958 }
  - id: calm
    ru: "затишье, штиль (отсутствие ветра)"
    examples:
      - pl: "Po prostu cieszmy się tą ciszą i spokojem."
        ru: "Давайте просто насладимся этой тишиной и покоем."
        source: { kind: translated, id: 3034067 }
      - pl: "Na morzu zapanowała cisza."
        ru: "На море наступил штиль."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Женский род. Родительный, дательный и предложный совпадают — ciszy: w ciszy «в тишине», boi się ciszy «боится тишины»." }
  - { kind: usage, text: "Cisza! — это команда «Тихо!», ровно как русское «Тишина!»." }
  - { kind: usage, text: "Второе значение — «штиль, безветрие»: cisza na morzu «штиль на море»." }
  - { kind: false-friend, text: "Не путайте cisza «тишина» с ciasny «тесный» и cisnąć «жать, давить» — созвучие обманчиво." }
collocations:
  - { pl: "w ciszy", ru: "в тишине" }
  - { pl: "zachować ciszę", ru: "соблюдать тишину" }
  - { pl: "cisza przed burzą", ru: "затишье перед бурей" }
etymology: "От cichy «тихий» (праславянское *tixъ). Русская пара «тихий — тишина» устроена точно так же, только с другим суффиксом."
memory: "cisza — «тишина», от cichy «тихий», как русское «тишина» от «тихий». Запомните предложный: w ciszy «в тишине». А cisza przed burzą — «затишье перед бурей», выражение совпадает с русским."
idioms:
  - { pl: "cisza przed burzą", ru: "затишье перед бурей" }
  - { pl: "cisza jak makiem zasiał", ru: "гробовая тишина" }
  - { pl: "zachować ciszę", ru: "соблюдать тишину" }
