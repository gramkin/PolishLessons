# review
id: kmiec
format: 2
lemma: "kmieć"
rank: 5843
pos: noun
pron: { cyr: "кмець" }
senses:
  - id: tenant
    ru: "кмет, крестьянин со своим наделом (ист.)"
    examples:
      - pl: "Kmieć miał własne pole i płacił czynsz panu."
        ru: "Кмет владел своим полем и платил пану чинш."
        source: { kind: authored }
      - pl: "W średniowiecznej wsi kmiecie stanowili większość."
        ru: "В средневековой деревне кметы составляли большинство."
        source: { kind: authored }
      - pl: "Bogaty kmieć mógł mieć nawet parobka."
        ru: "Богатый кмет мог держать даже батрака."
        source: { kind: authored }
  - id: peasant
    ru: "крестьянин, мужик (книжн., поэт.)"
    examples:
      - pl: "Stary kmieć oparł się o płot i milczał."
        ru: "Старый крестьянин опёрся о забор и молчал."
        source: { kind: authored }
      - pl: "Poeta opiewał prosty żywot kmieci."
        ru: "Поэт воспевал простую жизнь крестьян."
        source: { kind: authored }
notes:
  - { kind: register, text: "Историческое слово. В средневековой и старопольской деревне KMIEĆ — полноправный крестьянин с наделом (обычно в один лан), платящий чинш; ниже него стояли ZAGRODNIK и CHAŁUPNIK с малой землёй или без неё. В литературе XIX века KMIEĆ — возвышенное «крестьянин, пахарь». В живой речи так не говорят: крестьянин — CHŁOP, фермер — ROLNIK." }
  - { kind: usage, text: "Мужской род, одушевлённое, основа на мягкое Ć: KMIEĆ — KMIECIA — KMIECIOWI. Во множественном именительный KMIECIE, а родительный и винительный KMIECI: WEZWAŁ KMIECI «вызвал кметов». Прилагательное — KMIECY: ŁAN KMIECY, ZAGRODA KMIECA." }
  - { kind: pronunciation, text: "Читается «кмець»: один слог, KM в начале произносится слитно, MIE — мягкое «ме», конечное Ć — «ць». В косвенных падежах «кме́ця», «кме́цёви»." }
collocations:
  - { pl: "bogaty kmieć", ru: "зажиточный кмет" }
  - { pl: "kmiecie i zagrodnicy", ru: "кметы и загродники" }
  - { pl: "ziemia kmieci", ru: "кметская земля" }
family:
  - { pl: "kmiecy", ru: "кметский, крестьянский", relation: derived }
  - { pl: "kmiotek", ru: "мужичок (пренебр.)", relation: derived }
  - { pl: "chłop", ru: "крестьянин", relation: root, id: chlop }
etymology: "От праславянского *KЪMETЬ «старейшина, глава рода»; источник спорен — возводят к латинскому COMES «спутник, вельможа» или к восточным языкам. Русская историография берёт польское слово как есть: «кмет»."
memory: "Kmieć — кмет: крестьянин старой Польши со своим наделом. Его уменьшительно-пренебрежительный потомок — kmiotek «мужичок»."
idioms:
  - { pl: "łan kmiecy", ru: "кметский лан, стандартный крестьянский надел" }
