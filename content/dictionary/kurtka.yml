notes:
  - { kind: false-friend, text: "РУССКАЯ «КУРТКА» ВЗЯТА ИЗ ПОЛЬСКОГО — ЭТО ТО ЖЕ САМОЕ СЛОВО. Польское kurtka от kurta, а то — от латинского curtus «короткий»: куртка это короткая одежда в отличие от длинного płaszcza. Русский заимствовал его целиком вместе с предметом, поэтому совпадение полное и доверять слуху можно." }
  - { kind: usage, text: "Верхняя одежда делится в польском строже, чем в русском: kurtka короткая, płaszcz длинный (и значит «пальто», не только «плащ»), marynarka это пиджак, a futro шуба. Прилагательные уточняют вид: kurtka puchowa «пуховик», kurtka przeciwdeszczowa «дождевик», kurtka skórzana «кожанка»." }
  - { kind: pronunciation, text: "ДВА ИЗМЕНЕНИЯ, ОБЩИЕ ДЛЯ ВСЕГО КЛАССА НА -KA. Дательный и предложный дают kurtce с c, родительный множественного — kurtek с беглым e. Рядом в словаре те же paczka, walizka, koszulka, porażka и koleżanka. Читается «ку́ртка», с ясным р." }
collocations:
  - { pl: "kurtka puchowa", ru: "пуховик" }
  - { pl: "kurtka skórzana", ru: "кожаная куртка" }
  - { pl: "włożyć kurtkę", ru: "надеть куртку" }
family:
  - { pl: "płaszcz", ru: "пальто, плащ", relation: root, id: plaszcz }
  - { pl: "marynarka", ru: "пиджак", relation: root, id: marynarka }
  - { pl: "kurtkowy", ru: "курточный", relation: derived }
etymology: "Уменьшительное от kurta «короткий кафтан», из латинского curtus «короткий» через германское посредство — того же корня, что английское short и немецкое kurz. Русская «куртка» заимствована из польского вместе с самой одеждой в семнадцатом веке, поэтому слова совпадают до буквы."
memory: "kurtka — «куртка», и русское слово взято ИЗ ПОЛЬСКОГО: от kurta, из латинского curtus «короткий», в отличие от длинного płaszcza. Склоняется как paczka: w kurtce, bez kurtek."
