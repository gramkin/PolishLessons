  - id: have-doubts
    ru: "иметь сомнения, делиться сомнениями"
    examples:
      - pl: "Masz jakieś wątpliwości?"
        ru: "У тебя есть какие-то сомнения?"
        source: { kind: translated, id: 3063991 }
      - pl: "Podzieliłem się z Tomem swoimi wątpliwościami."
        ru: "Я поделился с Томом своими сомнениями."
