notes:
  - { kind: usage, text: "Слово живёт почти всегда во множественном числе: mieć wątpliwości «иметь сомнения», nie ma wątpliwości «нет сомнений»." }
  - { kind: usage, text: "bez wątpienia и bez wątpliwości значат «без сомнения»; первое чаще." }
  - { kind: usage, text: "poddać w wątpliwość — «поставить под сомнение», винительный падеж." }
  - { kind: usage, text: "Глагол — wątpić «сомневаться»; существительное женского рода на -ść, как radość и litość." }
collocations:
  - { pl: "mieć wątpliwości", ru: "иметь сомнения" }
  - { pl: "nie ma wątpliwości", ru: "нет сомнений" }
  - { pl: "poddać w wątpliwość", ru: "поставить под сомнение" }
etymology: "От wątpić «сомневаться», праславянское *vǫt- «внутри, в себе». Русское «сомнение» построено от «мнить» — другой корень, но обе метафоры о внутреннем колебании."
memory: "wątpliwość = «сомнение», и живёт оно почти всегда во множественном: mieć wątpliwości «иметь сомнения», nie ma wątpliwości «нет сомнений». Глагол — wątpić."
