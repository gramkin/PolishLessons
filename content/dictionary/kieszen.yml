notes:
  - { kind: false-friend, text: "znać coś jak własną kieszeń буквально «знать как собственный карман», а по-русски говорят «как свои пять пальцев». Образ разный, смысл один — переводить дословно нельзя." }
  - { kind: government, text: "«В кармане» — w kieszeni (предложный), «в карман» — do kieszeni (родительный с do): włożył ręce do kieszeni «он засунул руки в карманы»." }
  - { kind: usage, text: "Переносно kieszeń значит «денежные средства»: dostać po kieszeni «ударить по карману», mieć pełne kieszenie «иметь полные карманы»." }
  - { kind: usage, text: "Существительное женского рода на мягкую основу: kieszeń, kieszeni, kieszenią." }
collocations:
  - { pl: "w kieszeni", ru: "в кармане" }
  - { pl: "do kieszeni", ru: "в карман" }
  - { pl: "znać jak własną kieszeń", ru: "знать как свои пять пальцев" }
etymology: "Праславянское *kyšenь, связанное с «кишка, мешок». Русское «карман» — заимствование из тюркского, так что слова не родственны: сходство только в значении."
memory: "kieszeń = «карман», но слово женского рода и не родственно русскому «карману». Запомните идиому: znać jak własną kieszeń — по-русски «знать как свои пять пальцев», образ совсем другой."
