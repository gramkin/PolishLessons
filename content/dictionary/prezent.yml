# review
id: prezent
format: 2
lemma: "prezent"
rank: 761
pos: noun
pron: { cyr: "прэ́зэнт" }
senses:
  - id: gift
    ru: "подарок"
    examples:
      - pl: "Zapomniała, że kupiła mu prezent."
        ru: "Она забыла, что купила ему подарок."
        source: { kind: tatoeba, id: 3433161 }
      - pl: "To najlepszy prezent, jaki kiedykolwiek dostałem!"
        ru: "Это лучший подарок, какой я когда-либо получал!"
        source: { kind: tatoeba, id: 13785951 }
      - pl: "To są prezenty."
        ru: "Это подарки."
        source: { kind: translated, id: 2907440 }
  - id: gift-for
    ru: "prezent DLA kogoś — подарок для кого-л."
    examples:
      - pl: "Tom poprosił Mary, by kupiła prezent dla Johna."
        ru: "Том попросил Мэри купить подарок для Джона."
        source: { kind: tatoeba, id: 5947945 }
      - pl: "Szukam prezentu dla mamy."
        ru: "Я ищу подарок для мамы."
        source: { kind: translated, id: 901908 }
      - pl: "Szukam prezentu dla ojca."
        ru: "Я ищу подарок для отца."
        source: { kind: translated, id: 1603703 }
  - id: as-gift
    ru: "dostać w prezencie — получить в подарок"
    examples:
      - pl: "Dostałem w prezencie powieść - od kolegi!"
        ru: "Я получил в подарок роман — от приятеля!"
        source: { kind: translated, id: 982540 }
      - pl: "Tę książkę, którą przeczytałem już dwa razy, dostałem w prezencie od Petera."
        ru: "Эту книгу, которую я прочёл уже дважды, я получил в подарок от Петера."
        source: { kind: translated, id: 919576 }
      - pl: "Unikam używania świecy zapachowej, którą dostałem w prezencie."
        ru: "Я избегаю пользоваться ароматической свечой, которую получил в подарок."
        source: { kind: translated, id: 12227330 }
  - id: gifts
    ru: "prezenty — подарки"
    examples:
      - pl: "Nie potrzebuję jego prezentów."
        ru: "Мне не нужны его подарки."
        source: { kind: tatoeba, id: 13782753 }
      - pl: "Mary dostała wiele prezentów na urodziny."
        ru: "Мэри получила много подарков на свой день рожденья."
        source: { kind: tatoeba, id: 945780 }
      - pl: "On kupił prezenty."
        ru: "Он купил подарки."
        source: { kind: translated, id: 12953709 }
notes:
  - { kind: false-friend, text: "prezent — это «подарок», обиходное слово. Русский «презент» звучит книжно и шутливо, а польское prezent нейтрально. И не путайте его с prezenter — это «телеведущий», совсем другое слово." }
  - { kind: government, text: "Для кого — dla с родительным: prezent dla mamy. От кого — od с родительным: prezent od Piotra. А «в подарок» — dostać coś w prezencie, с предложным." }
  - { kind: usage, text: "Синоним podarunek более книжный. «Подарить» — podarować или dać w prezencie." }
  - { kind: usage, text: "Ходовые сочетания: prezent urodzinowy «подарок на день рождения», prezent pod choinkę «подарок под ёлку», prezent ślubny «свадебный подарок»." }
collocations:
  - { pl: "prezent dla kogoś", ru: "подарок для кого-либо" }
  - { pl: "dostać w prezencie", ru: "получить в подарок" }
  - { pl: "prezent urodzinowy", ru: "подарок на день рождения" }
  - { pl: "kupić prezent", ru: "купить подарок" }
family:
  - { pl: "podarunek", ru: "подарок", relation: root }
  - { pl: "podarować", ru: "подарить", relation: root }
  - { pl: "prezentować", ru: "представлять", relation: derived }
etymology: "Через французское présent «подарок» — то же заимствование, что русский «презент», но в польском слово обиходное, а не книжное."
memory: "prezent — «подарок», и это обычное повседневное слово, в отличие от русского «презента», который звучит книжно. Управление держите парой: prezent DLA kogoś «подарок для кого-то» и prezent OD kogoś «от кого-то», оба с родительным, а «в подарок» — dostać w prezencie. И не путайте с prezenter: это «телеведущий»."
idioms:
  - { pl: "dostać w prezencie", ru: "получить в подарок" }
  - { pl: "prezent pod choinkę", ru: "подарок под ёлку" }
  - { pl: "prezent urodzinowy", ru: "подарок на день рождения" }
