# review
id: usilowac
format: 2
lemma: "usiłować"
rank: 4742
pos: verb
pron: { cyr: "усиуо́ваць" }
senses:
  - id: try-hard
    ru: "пытаться, силиться (с усилием)"
    examples:
      - pl: "Usiłował otworzyć drzwi."
        ru: "Он пытался открыть дверь."
        source: { kind: authored }
      - pl: "Usiłuję zrozumieć, co się stało."
        ru: "Я пытаюсь понять, что случилось."
        source: { kind: authored }
      - pl: "Policja usiłuje ustalić sprawcę."
        ru: "Полиция пытается установить виновника."
        source: { kind: authored }
  - id: attempt-law
    ru: "покушаться (юр.: USIŁOWANIE — покушение)"
    examples:
      - pl: "Usiłowano go zabić."
        ru: "На него покушались."
        source: { kind: authored }
      - pl: "Został skazany za usiłowanie zabójstwa."
        ru: "Его осудили за покушение на убийство."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "USIŁOWAĆ — «пытаться», а не «усилить» (WZMOCNIĆ) и не «усиливаться». Корень SIŁA «сила», как в русском «силиться». USIŁOWANIE в праве — «покушение»: USIŁOWANIE ZABÓJSTWA." }
  - { kind: usage, text: "Несовершенный вид, пары нет. Почти всегда с инфинитивом: USIŁOWAĆ COŚ ZROBIĆ. Подчёркивает усилие и часто неудачу, в отличие от нейтрального PRÓBOWAĆ. Повелительное в карточку не включено: «силься!» по-польски не говорят." }
  - { kind: government, text: "Что сделать — инфинитив: USIŁOWAŁ UCIEC. Без прямого дополнения: «usiłować czegoś» нельзя. Безличное USIŁOWANO — «пытались» с неназванным деятелем." }
  - { kind: pronunciation, text: "Читается «усиуо́ваць»: Ł — «у», ударение на предпоследнем слоге. USIŁUJĘ — «усиу́е»." }
  - { kind: register, text: "Книжно-нейтральное слово: пресса, протоколы, литература. В разговоре — PRÓBOWAĆ или STARAĆ SIĘ." }
collocations:
  - { pl: "usiłować uciec", ru: "пытаться убежать" }
  - { pl: "usiłowanie zabójstwa", ru: "покушение на убийство" }
  - { pl: "na próżno usiłować", ru: "тщетно пытаться" }
family:
  - { pl: "próbować", ru: "пытаться, пробовать", relation: root, id: probowac }
  - { pl: "siła", ru: "сила", relation: root, id: sila }
  - { pl: "wysiłek", ru: "усилие", relation: derived, id: wysilek }
etymology: "Приставка U- плюс SIŁA «сила»: буквально «прилагать силу». Русское «силиться» и «усилие» построены от того же корня."
memory: "Usiłować — силиться, пытаться: usiłował otworzyć drzwi. Usiłowanie zabójstwa — покушение на убийство."
idioms:
