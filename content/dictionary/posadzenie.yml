notes:
  - { kind: false-friend, text: "Идентификатор карточки вводит в заблуждение: латиница стирает носовую ą, и posądzenie «подозрение» выглядит как posadzenie «усаживание». Это разные слова: posądzić «заподозрить» против posadzić «посадить»." }
  - { kind: government, text: "В чём подозревают — предлог o с винительным: posądzenie o kradzież «обвинение в краже». Русский здесь ставит предложный." }
  - { kind: usage, text: "Отглагольное существительное от posądzić. Слово книжное; обычное обвинение — oskarżenie, а подозрение — podejrzenie." }
  - { kind: usage, text: "В корпусе не встречается, поэтому все примеры составлены вручную." }
collocations:
  - { pl: "posądzenie o kradzież", ru: "обвинение в краже" }
etymology: "От posądzić «заподозрить», от sąd «суд, суждение»; ср. русское «осудить», «рассудить»."
memory: "posądzenie — «подозрение, обвинение», от posądzić «заподозрить». Не путайте с posadzenie «усаживание» от posadzić: в латинице носовая ą пропадает и слова сливаются."
