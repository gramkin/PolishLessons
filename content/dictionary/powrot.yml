# review
id: powrot
format: 2
lemma: "powrót"
rank: 404
pos: noun
pron: { cyr: "по́врут" }
senses:
  - id: return
    ru: "возвращение"
    examples:
      - pl: "Czekam na powrót kota."
        ru: "Я жду возвращения кота."
        source: { kind: translated, id: 10284009 }
      - pl: "Nie ma już powrotu."
        ru: "Пути назад уже нет."
        source: { kind: translated, id: 657365 }
      - pl: "Myślimy o powrocie do Bostonu."
        ru: "Мы думаем о возвращении в Бостон."
        source: { kind: translated, id: 3931516 }
  - id: back
    ru: "обратно (в обороте z powrotem)"
    examples:
      - pl: "Kupiłem bilet tam i z powrotem."
        ru: "Я купил билет туда-обратно."
        source: { kind: tatoeba, id: 999356 }
      - pl: "Jesteś z powrotem."
        ru: "Ты вернулся."
        source: { kind: translated, id: 5664904 }
      - pl: "Wracamy z powrotem do domu."
        ru: "Мы возвращаемся обратно домой."
        source: { kind: authored }
notes:
  - { kind: usage, text: "z powrotem — застывшее наречие «обратно», и это самая частая форма слова: tam i z powrotem «туда и обратно»." }
  - { kind: usage, text: "bilet tam i z powrotem — «билет туда-обратно»; то же самое можно сказать как bilet w obie strony." }
  - { kind: usage, text: "Nie ma powrotu — «пути назад нет», о необратимом решении." }
  - { kind: usage, text: "Предложный падеж — powrocie, с чередованием t → ci: powrót, ale o powrocie." }
collocations:
  - { pl: "z powrotem", ru: "обратно" }
  - { pl: "tam i z powrotem", ru: "туда и обратно" }
  - { pl: "po powrocie", ru: "по возвращении" }
  - { pl: "nie ma powrotu", ru: "пути назад нет" }
etymology: "От powrócić «вернуться», из po- + wrócić; корень *vort- тот же, что в русских «воротить» и «возвратить». Польское ró стоит на месте русского «оро»."
memory: "powrót — «возвращение», корень тот же, что в «воротить»: польское ró на месте русского «оро». Но чаще всего вы услышите застывшее z powrotem «обратно» — tam i z powrotem."
idioms:
  - { pl: "z powrotem", ru: "обратно" }
  - { pl: "tam i z powrotem", ru: "туда и обратно" }
  - { pl: "nie ma powrotu", ru: "пути назад нет" }
