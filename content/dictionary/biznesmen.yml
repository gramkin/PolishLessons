notes:
  - { kind: false-friend, text: "BIZNESMEN — «бизнесмен», как в русском. Официально и нейтрально — PRZEDSIĘBIORCA, «предприниматель». Женщина — BIZNESWOMAN, несклоняемое, или KOBIETA BIZNESU." }
