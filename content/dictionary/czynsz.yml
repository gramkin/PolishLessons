etymology: "Из немецкого ZINS «оброк, процент», а то — из латинского CENSUS «перепись, оценка имущества», от CENSERE «оценивать, высказывать мнение». Образ исходно податной: чинш был оброком, который платили за пользование землёй, и в польской деревне это слово держалось в таком смысле несколько веков, прежде чем перешло на городскую квартплату. Тот же латинский CENSUS дал русскую «цензуру» и слово «ценз», так что связь с польским словом восстанавливается через них, хотя на слух её нет. Русское «оброк» было своим и построено от «обрекать», а современная «квартплата» есть сокращение сложного описания."
memory: "Родни в русском нет: czynsz из немецкого Zins, а то из латинского census «оценка имущества» — отсюда же «ценз» и «цензура». Русский называет это описательно: квартплата. Родительный и местный совпадают в czynszu, девятый такой случай. Долг по квартплате — zalegać Z czynszem, творительный. Читается «чынш», одним слогом."
