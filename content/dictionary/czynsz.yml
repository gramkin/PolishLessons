notes:
  - { kind: false-friend, text: "Русского однокоренного слова нет: CZYNSZ пришёл из немецкого ZINS «процент, оброк», а то — из латинского CENSUS «перепись, оценка имущества». Русский назвал то же понятие описательно, «квартплата» или «арендная плата», то есть сложением, а не отдельным корнем. Поэтому слово надо выучить, зато оно короткое и частотное: в Польше оно встречается каждому, кто снимает жильё. Отличать стоит от OPŁATY, «платежи» в широком смысле: CZYNSZ есть основная плата за пользование жильём, а счётчики и дополнительные услуги часто идут отдельной строкой." }
  - { kind: government, text: "Мужской род, неодушевлённое, и родительный с местным совпадают в форме CZYNSZU: BEZ CZYNSZU «без квартплаты» и W CZYNSZU «в квартплату» выглядят одинаково. Это девятый такой случай в словаре, после WYSIŁEK, POŚPIECH, DYSK, BLOK, PIASEK, RATUNEK, MOTEL и ROZWÓJ, и к девятому разу совпадение можно считать правилом для неодушевлённых на согласную, а не исключением. Платить — PŁACIĆ с винительным: PŁACIĆ CZYNSZ. Входить в состав — предлог W с местным: W CZYNSZU ZAWARTE JEST." }
  - { kind: usage, text: "Устойчивые сочетания стоит выучить блоком, потому что они встречаются в каждом объявлении о сдаче жилья: CZYNSZ NAJMU «плата по найму», CZYNSZ ADMINISTRACYJNY «плата управляющей компании», PODWYŻKA CZYNSZU «повышение квартплаты», ZALEGAĆ Z CZYNSZEM «иметь долг по квартплате». Последнее требует творительного после ZALEGAĆ Z. Прилагательное — CZYNSZOWY, и KAMIENICA CZYNSZOWA есть доходный дом, исторический тип постройки, которого в русском городе называли «доходным домом»." }
  - { kind: pronunciation, text: "Читается «чынш», один слог. Начальное CZ даёт твёрдое «ч», гласная Y — русское «ы», а конечное SZ — «ш». Для русского это непривычное сочетание: слово начинается и кончается шипящими, а между ними только «ы». В местном падеже CZYNSZU ударение падает на первый слог: «чы́ншу». Проговорить стоит медленно, потому что скопление шипящих заставляет русскоязычного вставлять лишнюю гласную." }
