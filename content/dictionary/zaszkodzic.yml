etymology: "Приставка za- и SZKODZIĆ, от SZKODA, которое польский взял из средневерхненемецкого SCHADE «вред, ущерб» — то же слово, что современное немецкое SCHADEN. Русский получил его тем же путём через польский, но закрепил за озорством: «шкода» о ребёнке. Отсюда и расхождение, которое ловит учащихся: по-польски SZKODA говорят, когда жаль, а не когда шалят. Приставка za- делает действие однократным и завершённым, как русская «на-» в «навредить»: SZKODZIĆ вредит вообще, ZASZKODZIĆ навредил один раз."
memory: "szkoda значит «жаль», а не «шкода»: szkoda, że nie przyszedł — «жаль, что он не пришёл». А глагол требует дательного, как русский: nikomu to nie zaszkodzi."
idioms:
  - { pl: "szkoda, że", ru: "жаль, что" }
  - { pl: "nic nie szkodzi", ru: "ничего страшного" }
