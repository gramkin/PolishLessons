notes:
  - { kind: government, text: "Глагол требует ДАТЕЛЬНОГО падежа, и тут русский совпадает полностью: ZASZKODZIĆ KOMUŚ — «навредить кому-то», ZASZKODZIŁY MU OSTRYGI — «ему повредили устрицы». Винительного при нём не бывает вовсе, поэтому и страдательных причастий у глагола нет, а форм всего сорок две. В чём навредить — предлог W с местным: ZASZKODZIĆ KOMUŚ W PRACY, W OCZACH SZEFA. Самая частая фраза — отрицательная: NIKOMU TO NIE ZASZKODZI, «никому это не навредит»." }
  - { kind: false-friend, text: "Корень SZKODA русскому знаком на слух, но значит совсем другое. Польское SZKODA — это «вред, ущерб» (NAPRAWIĆ SZKODĘ «возместить ущерб»), а как восклицание SZKODA! значит «ЖАЛЬ!»: SZKODA, ŻE NIE PRZYSZEDŁ — «жаль, что он не пришёл». Русская же «шкода» — это озорство, а «шкодливый» о ребёнке значит «озорной». Так что SZKODA, ŻE… нельзя понимать как «озорство»: это обычное выражение сожаления, одно из самых частых в разговоре." }
  - { kind: usage, text: "Несовершенная пара — SZKODZIĆ, и она нужна для общих утверждений: PALENIE SZKODZI ZDROWIU — «курение вредит здоровью», надпись с каждой пачки. Отсюда же прилагательное SZKODLIWY «вредный» (SZKODLIWE SUBSTANCJE) и существительное SZKODNIK — «вредитель», и о насекомом, и в переносном смысле о человеке. А оборот NIC NIE SZKODZI значит «ничего страшного» и служит обычным ответом на извинение." }
  - { kind: pronunciation, text: "Сочетание SZK читается «шк», а DZI мягко, «дзи», так что всё слово звучит «зашко́дзиць». Ударение на предпоследнем слоге: za-szko-DZIĆ, точнее zaSZKOdzić. В формах на -byśmy и -byście ударение уходит на третий слог от конца, как у всех польских глаголов: zaszkodziliBYŚmy." }
  - { kind: pronunciation, text: "Повелительное здесь ZASZKODŹ, без ó, и это стоит сопоставить с карточками NAROBIĆ и WROBIĆ, где повелительное даёт NARÓB и WRÓB. Слог закрывается во всех трёх случаях одинаково, а ó появляется только в двух. Значит правило «ó в закрытом слоге» описывает не всё: мена принадлежит отдельным корням — ROB-, WIOZ-, NIOS- — и в корне SZKOD- её просто нет. Проверять приходится по слову, а не по положению слога; в сомнительном случае смотрите на другие формы того же корня." }
