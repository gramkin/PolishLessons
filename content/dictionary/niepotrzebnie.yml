# review
id: niepotrzebnie
format: 2
lemma: "niepotrzebnie"
rank: 3967
pos: adv
pron: { cyr: "непотшэ́бне" }
senses:
  - id: needlessly
    ru: "без нужды, напрасно"
    examples:
      - pl: "Niepotrzebnie zabrałem parasol."
        ru: "Зря я взял зонт."
        source: { kind: authored }
      - pl: "Lekarz niepotrzebnie przepisał antybiotyk."
        ru: "Врач без надобности выписал антибиотик."
        source: { kind: authored }
      - pl: "Nie komplikuj sprawy niepotrzebnie."
        ru: "Не усложняй дело без нужды."
        source: { kind: authored }
  - id: regret
    ru: "зря (с сожалением)"
    examples:
      - pl: "Niepotrzebnie to powiedziałem."
        ru: "Зря я это сказал."
        source: { kind: authored }
      - pl: "Niepotrzebnie się z nim kłóciłam."
        ru: "Зря я с ним поссорилась."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "NIEPOTRZEBNIE переводится не «ненужно», а чаще всего «зря»: NIEPOTRZEBNIE TO ZROBIŁEM — «зря я это сделал». Русское «зря» в значении «попусту» — NA PRÓŻNO или NA DARMO, а когда жалеют о поступке, говорят NIEPOTRZEBNIE." }
  - { kind: usage, text: "Наречие, одна форма, пишется слитно. Чаще всего стоит в начале фразы с глаголом прошедшего времени: NIEPOTRZEBNIE SIĘ MARTWIŁEŚ, «зря ты волновался»." }
  - { kind: government, text: "Наречие ничем не управляет. Прилагательное — NIEPOTRZEBNY «ненужный, лишний»: NIEPOTRZEBNE RZECZY." }
  - { kind: pronunciation, text: "Читается «непотшэ́бне», ударение на предпоследнем слоге. TRZ — «тш»: RZ после глухого T оглушается, как в POTRZEBNY «потшэ́бны»." }
collocations:
  - { pl: "niepotrzebnie się martwisz", ru: "зря ты волнуешься" }
  - { pl: "niepotrzebnie kupiłem", ru: "зря я купил" }
  - { pl: "niepotrzebnie stracony czas", ru: "зря потерянное время" }
family:
