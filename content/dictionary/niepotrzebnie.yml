  - { pl: "potrzebować", ru: "нуждаться", relation: root, id: potrzebowac }
etymology: "NIE + POTRZEBNIE, от POTRZEBA «нужда». Корень тот же, что в русских «потребность», «потребовать»: польскому RZ отвечает русское «р»."
memory: "Niepotrzebnie — зря (о сделанном), без нужды. Читается «непотшэ́бне». Niepotrzebnie to powiedziałem — зря я это сказал. Potrzeba — нужда."
idioms:
