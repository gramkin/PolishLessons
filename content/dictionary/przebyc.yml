# review
id: przebyc
format: 2
lemma: "przebyć"
rank: 2116
pos: verb
aspect: perf
pron: { cyr: "пшэ́быць" }
senses:
  - id: traverse
    ru: "преодолеть, пройти (расстояние)"
    examples:
      - pl: "Przebyliśmy sto kilometrów."
        ru: "Мы преодолели сто километров."
        source: { kind: authored }
      - pl: "Przebył całą drogę pieszo."
        ru: "Он прошёл весь путь пешком."
        source: { kind: authored }
      - pl: "Trzeba przebyć rzekę."
        ru: "Нужно перебраться через реку."
        source: { kind: authored }
  - id: undergo
    ru: "перенести (болезнь, испытание)"
    examples:
      - pl: "Przebył ciężką chorobę."
        ru: "Он перенёс тяжёлую болезнь."
        source: { kind: authored }
      - pl: "Przebyła operację w marcu."
        ru: "Она перенесла операцию в марте."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Совершенный вид по форме к przebywać, но значения разошлись: przebyć — «преодолеть, перенести», przebywać — «находиться»." }
  - { kind: government, text: "Винительный падеж: przebyć drogę «пройти путь», przebyć chorobę «перенести болезнь»." }
  - { kind: false-friend, text: "Не «прибыть». Приехать — przybyć; przebyć это «пройти через что-л.»." }
  - { kind: usage, text: "Частое причастие — nieprzebyty «непроходимый»: nieprzebyte lasy «непроходимые леса». В корпусе для самого глагола примеров нет." }
collocations:
  - { pl: "przebyć drogę", ru: "пройти путь" }
  - { pl: "przebyć chorobę", ru: "перенести болезнь" }
etymology: "prze- + być «быть»; ср. русское «пробыть», «пребыть». Значение «пройти через» развилось из «побыть в пути»."
memory: "przebyć — «преодолеть, перенести»: przebyć drogę, przebyć chorobę. Не путайте ни с przebywać «находиться», ни с przybyć «прибыть»."
idioms:
  - { pl: "przebyć drogę", ru: "пройти путь" }
  - { pl: "przebyć chorobę", ru: "перенести болезнь" }
