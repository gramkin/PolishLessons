etymology: "Сложение BŁOGO, от BŁOGI «блаженный, благой», из праславянского *bolgъ, и SŁAWIĆ «славить». Всё слово — калька греческого EULOGEIN «хорошо говорить», пришедшая через церковнославянское благословити, но вторым элементом в польском стало именно SŁAWIĆ, а не «слово». Русское «благословить» сохранило «слово» и потому ближе к греческому образцу. Первая же половина в польском осталась в живом употреблении: BŁOGI, BŁOGOSTAN, BŁOGOSŁAWIEŃSTWO."
memory: "błogo плюс sławić: по-польски благословение «славят», а по-русски «словят». А błogosławiony stan — это не святость, а беременность."
idioms:
