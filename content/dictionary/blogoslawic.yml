notes:
  - { kind: false-friend, text: "Разбор слова по частям даёт расхождение, которого не ждёшь. BŁOGOSŁAWIĆ — это BŁOGO плюс SŁAWIĆ, то есть «славить во благо», а русское «благословить» — это «благо» плюс «слово». Первая половина у двух слов одна, вторая разная: польский взял «славить», русский оставил «слово». Оба слова при этом переводят греческое EULOGEIN, «хорошо говорить», и русский держится к греческому ближе. Для запоминания это даже удобно: по-польски благословение не произносят, а воспевают." }
  - { kind: usage, text: "Прилагательное BŁOGI, от которого идёт первая половина, в польском своё, не книжное: BŁOGI SPOKÓJ — «блаженный покой», BŁOGOSTAN — «блаженство». Русское «благо» пришло из церковнославянского, а собственная восточнославянская форма этого корня была бы с -оло-. Польское BŁOGO как раз и показывает, как корень выглядит без церковнославянского посредничества. Отсюда же BŁOGOSŁAWIEŃSTWO «благословение» и BŁOGOSŁAWIONY «блаженный, благословенный»." }
  - { kind: usage, text: "Страдательное причастие застыло как отдельное слово и в церковном словаре значит «блаженный»: BŁOGOSŁAWIONA DZIEWICA — «Блаженная Дева», BŁOGOSŁAWIONY JAN — «блаженный Ян», то есть ступень перед святостью. А в бытовой речи BŁOGOSŁAWIONY STAN — это иносказание о беременности, ровно как русское «в положении». Мужская личная форма множественного — BŁOGOSŁAWIENI с e при BŁOGOSŁAWIONY с o: та же мена, что в karmiony при karmieni, и она касается всех причастий на -ony." }
  - { kind: government, text: "Управление двойное, и смысл при этом не меняется. С винительным — BŁOGOSŁAWIĆ KOGOŚ: KSIĄDZ BŁOGOSŁAWIŁ MŁODĄ PARĘ. С дательным — BŁOGOSŁAWIĆ KOMUŚ, и это обычная форма пожелания: NIECH BÓG CI BŁOGOSŁAWI «да благословит тебя Бог». Русский в обоих случаях берёт винительный, так что дательный придётся запомнить отдельно. Повелительное BŁOGOSŁAW выходит из третьего лица BŁOGOSŁAWI отбрасыванием -i, по правилу карточки KARMIĆ. Совершенная пара — POBŁOGOSŁAWIĆ." }
collocations:
