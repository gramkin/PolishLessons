# review
id: zdumiewajacy
format: 2
lemma: "zdumiewający"
rank: 5122
pos: adj
pron: { cyr: "здумевайо́нцы" }
senses:
  - id: astonishing
    ru: "поразительный, изумительный"
    examples:
      - pl: "To zdumiewające odkrycie."
        ru: "Это поразительное открытие."
        source: { kind: authored }
      - pl: "Ma zdumiewającą pamięć."
        ru: "У неё поразительная память."
        source: { kind: authored }
      - pl: "Wynik był zdumiewający."
        ru: "Результат был поразительным."
        source: { kind: authored }
  - id: surprising
    ru: "удивительный (вызывающий недоумение)"
    examples:
      - pl: "Zdumiewające, że nikt tego nie zauważył."
        ru: "Удивительно, что никто этого не заметил."
        source: { kind: authored }
      - pl: "Jego obojętność jest zdumiewająca."
        ru: "Его равнодушие удивительно."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ZDUMIEWAJĄCY — от ZDUMIEWAĆ, «изумлять», и к русскому «думать» отношения почти не имеет, хотя корень DUM- тот же: польское ZDUMIENIE — «изумление», буквально «то, что заставило задуматься». Русское «задумчивый» — ZAMYŚLONY, а не ZDUMIONY. ZDUMIONY — «изумлённый»." }
  - { kind: usage, text: "Десять форм: это причастие, степеней у него нет, а форма для мужчин-людей совпадает с мужским единственным. Безличное ZDUMIEWAJĄCE, ŻE — «удивительно, что». Синонимы: ZADZIWIAJĄCY, ZASKAKUJĄCY, NIESAMOWITY." }
  - { kind: government, text: "Для кого — DLA с родительным: ZDUMIEWAJĄCE DLA NAUKOWCÓW. Усиление — WRĘCZ: WRĘCZ ZDUMIEWAJĄCY, «просто поразительный». Наречие — ZDUMIEWAJĄCO: ZDUMIEWAJĄCO SZYBKO." }
  - { kind: pronunciation, text: "Читается «здумевайо́нцы», пять слогов, ударение на предпоследнем. IE после M — «ме», Ą перед C — носовое «он». Начальное ZD звонкое." }
  - { kind: register, text: "Слово книжное и эмоциональное, частое в научно-популярных текстах и рецензиях. В разговоре проще: NIESAMOWITY, NIEWIARYGODNY, или WOW." }
collocations:
  - { pl: "zdumiewające odkrycie", ru: "поразительное открытие" }
  - { pl: "zdumiewająca pamięć", ru: "поразительная память" }
  - { pl: "wręcz zdumiewający", ru: "просто поразительный" }
family:
  - { pl: "zdumienie", ru: "изумление", relation: derived }
  - { pl: "zdumiony", ru: "изумлённый", relation: derived }
  - { pl: "zdumiewać", ru: "изумлять", relation: root, id: zdumiewac }
etymology: "От ZDUMIEWAĆ «изумлять», от DUMAĆ «думать, размышлять», родственного русскому «думать». Изумлённый — это человек, которого вещь заставила задуматься."
memory: "Zdumiewający — поразительный. Zdumiewające odkrycie, zdumiewająca pamięć. Zdumiony — изумлённый. Корень dum-, как в «думать». Читается «здумевайо́нцы»."
idioms:
  - { pl: "ku mojemu zdumieniu", ru: "к моему изумлению" }
