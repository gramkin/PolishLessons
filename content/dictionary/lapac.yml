# review
id: lapac
format: 2
lemma: "łapać"
rank: 1304
pos: verb
aspect: imperf
aspectPair: zlapac
pron: { cyr: "уа́паць" }
senses:
  - id: catch
    ru: "ловить, хватать"
    examples:
      - pl: "Koty łapią myszy."
        ru: "Кошки ловят мышей."
        source: { kind: translated, id: 8547482 }
      - pl: "Łap!"
        ru: "Лови!"
        source: { kind: translated, id: 8745395 }
  - id: catch-illness
    ru: "подхватывать (болезнь), простужаться"
    examples:
      - pl: "On łatwo łapie przeziębienia."
        ru: "Он легко простужается."
        source: { kind: tatoeba, id: 565313 }
      - pl: "Ona łatwo łapie przeziębienie."
        ru: "Она быстро подхватывает простуду."
        source: { kind: tatoeba, id: 553189 }
      - pl: "Zawsze zimą łapię katar."
        ru: "Зимой я всегда подхватываю насморк."
        source: { kind: translated, id: 930182 }
  - id: get-it
    ru: "разговорное: доходить, понимать"
    examples:
      - pl: "Już łapię."
        ru: "Теперь дошло."
        source: { kind: translated, id: 12951299 }
      - pl: "Łapiesz?"
        ru: "Врубаешься?"
        source: { kind: translated, id: 12470435 }
notes:
  - { kind: usage, text: "Несовершенный вид к złapać." }
  - { kind: government, text: "łapać co, винительный: łapać piłkę, myszy, ryby." }
  - { kind: usage, text: "Очень частое значение — «подхватывать болезнь»: łapać przeziębienie «простужаться», łapać katar «подхватывать насморк». Русский тут скажет «простужаться», а не «ловить»." }
  - { kind: register, text: "Разговорно łapać значит «доходить, понимать»: Już łapię «Дошло», Nie łapiesz? «Не врубаешься?». В нейтральной речи лучше rozumieć." }
  - { kind: false-friend, text: "Форма łap — это и повелительное наклонение «лови», и родительный множественного от существительного łapa «лапа»: chciwych łap «жадных лап». Различает только контекст." }
collocations:
  - { pl: "łapać przeziębienie", ru: "простужаться" }
  - { pl: "łapać piłkę", ru: "ловить мяч" }
  - { pl: "już łapię", ru: "дошло, понял" }
etymology: "От łapa «лапа»: буквально «брать лапой». Русская «лапа» — то же слово, но глагола со значением «ловить» русский от него не образовал."
memory: "łapać — «ловить», от łapa «лапа». Совершенный вид — złapać. Два значения, которых у русского «ловить» нет: łapać przeziębienie «простужаться» и разговорное Już łapię «Дошло»."
idioms:
  - { pl: "łapać dwie sroki za ogon", ru: "гнаться за двумя зайцами" }
  - { pl: "łapać przeziębienie", ru: "простужаться" }
  - { pl: "łapać za słówka", ru: "придираться к словам" }
