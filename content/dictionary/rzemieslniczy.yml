# review
id: rzemieslniczy
format: 2
lemma: "rzemieślniczy"
rank: 5892
pos: adj
pron: { cyr: "жэмесьльни́чы" }
senses:
  - id: craft
    ru: "ремесленный, кустарный; о пиве и хлебе — крафтовый"
    examples:
      - pl: "Kupiliśmy rzemieślniczą ceramikę na targu."
        ru: "Мы купили ремесленную керамику на рынке."
        source: { kind: authored }
      - pl: "Lubię rzemieślnicze piwo z małych browarów."
        ru: "Я люблю крафтовое пиво из маленьких пивоварен."
        source: { kind: authored }
      - pl: "Dziadek był członkiem cechu rzemieślniczego."
        ru: "Дед был членом ремесленного цеха."
        source: { kind: authored }
  - id: technical
    ru: "технический, относящийся к мастерству (о работе художника, писателя)"
    note: "Иногда с оттенком «ремесленнический»: умело, но без вдохновения."
    examples:
      - pl: "Brakuje mu rzemieślniczego warsztatu, nie talentu."
        ru: "Ему не хватает мастерства, а не таланта."
        source: { kind: authored }
      - pl: "To była solidna, rzemieślnicza robota."
        ru: "Это была добротная ремесленная работа."
        source: { kind: authored }
      - pl: "W tej książce widać więcej rzemieślniczej wprawy niż talentu."
        ru: "В этой книге видно больше ремесленной сноровки, чем таланта."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Слово относительное и не сравнивается, поэтому форм не тридцать три, а десять. Одиннадцатой нет потому, что мужско-личное множественное совпадает с основной формой: основа кончается на CZ, а после CZ пишется Y, так что RZEMIEŚLNICZY значит и «ремесленный», и «ремесленные» (о мужчинах). Сегодня слово часто встречается в рекламе: PIWO RZEMIEŚLNICZE, CHLEB RZEMIEŚLNICZY, PIEKARNIA RZEMIEŚLNICZA — это русское «крафтовый», «ремесленный», противопоставленное фабричному." }
  - { kind: false-friend, text: "Русское «ремесленнический» звучит пренебрежительно, а польское RZEMIEŚLNICZY в основном нейтрально и даже хвалебно: RZEMIEŚLNICZA ROBOTA может значить «добротная ручная работа». Оттенок «умело, но без вдохновения» появляется только в разговоре об искусстве, когда мастерство противопоставляют таланту. Следите за контекстом и не переводите слово автоматически с презрением." }
  - { kind: pronunciation, text: "Читается «жэмесьльни́чы», ударение на предпоследнем слоге. Начальное RZ звучит как «ж», Ś перед L мягкое «сь», и мягкость переходит на L: «сьль». Конечное CZY — твёрдое «чы», а не «чи». Русский корень «ремесл-» узнаётся, если помнить, что польское RZ часто стоит на месте русского «р»: RZEKA — «река», RZEMIOSŁO — «ремесло»." }
collocations:
  - { pl: "wyroby rzemieślnicze", ru: "ремесленные изделия" }
  - { pl: "cech rzemieślniczy", ru: "ремесленный цех" }
  - { pl: "piwo rzemieślnicze", ru: "крафтовое пиво" }
  - { pl: "szkoła rzemieślnicza", ru: "ремесленное училище" }
family:
  - { pl: "rzemiosło", ru: "ремесло", relation: root }
  - { pl: "rzemieślnik", ru: "ремесленник", relation: root }
  - { pl: "rzemieślniczo", ru: "по-ремесленному", relation: derived, id: rzemieslniczo }
  - { pl: "rzemieślnictwo", ru: "ремесленничество", relation: derived }
etymology: "Образовано от RZEMIEŚLNIK «ремесленник», а тот от RZEMIOSŁO «ремесло». RZEMIOSŁO и русское «ремесло» восходят к одному праславянскому слову; польское RZ на месте русского «р» перед гласной переднего ряда — обычное соответствие."
memory: "RZEMIOSŁO — «ремесло», RZEMIEŚLNIK — «ремесленник», RZEMIEŚLNICZY — «ремесленный». Замените RZ на «р» — и слово узнаётся. А на вывеске пивной PIWO RZEMIEŚLNICZE — это просто «крафтовое пиво»."
