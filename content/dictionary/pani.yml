# review
id: pani
format: 2
lemma: "pani"
rank: 61
pos: noun
pron: { cyr: "па́ни" }
senses:
  - id: polite
    ru: "Вы (вежливое обращение к женщине)"
    examples:
      - pl: "Ma pani alibi?"
        ru: "У Вас есть алиби?"
        source: { kind: tatoeba, id: 3479802 }
      - pl: "Interesują Panią kwiaty?"
        ru: "Вас интересуют цветы?"
        source: { kind: tatoeba, id: 531897 }
      - pl: "A Pani?"
        ru: "А вы?"
        source: { kind: tatoeba, id: 3463020 }
  - id: lady
    ru: "госпожа, дама, женщина"
    examples:
      - pl: "Panie przodem."
        ru: "Сначала дамы."
        source: { kind: tatoeba, id: 352119 }
      - pl: "Ta pani jest nauczycielką."
        ru: "Эта женщина — учительница."
        source: { kind: authored }
notes:
  - { kind: usage, text: "После pani глагол стоит в третьем лице: Czy pani mówi po polsku? — дословно «Госпожа говорит по-польски?»." }
  - { kind: usage, text: "Обращение proszę pani соответствует русскому «извините / скажите, пожалуйста»." }
collocations:
  - { pl: "proszę pani", ru: "извините (обращение к женщине)" }
  - { pl: "pani domu", ru: "хозяйка дома" }
etymology: "От pan с женским суффиксом -i; тот же корень, что в чешском pán и в старом польском обращении к владельцу земли."
memory: "pani — это и «Вы» к женщине, и «дама, госпожа». Ключ к вежливой речи: после pani глагол идёт в третьем лице, а не во втором — Czy pani wie? вместо русского «Вы знаете?»."
idioms:
  - { pl: "proszę pani", ru: "извините, скажите пожалуйста" }
  - { pl: "pani domu", ru: "хозяйка дома" }
