etymology: "От существительного PYCHA «гордыня», из праславянского корня *pyx- «пыхать, раздуваться, дуть». Тот же корень в русских «пыхать», «пыл», «пухнуть», «пышный» и в польском PYCHAĆ, DMUCHAĆ по смыслу рядом. Исходный образ один: нечто раздутое, напыщенное. Дальше языки выбрали разные половины этого образа. Русский взял физическую сторону — поднявшееся тесто, объёмные волосы, обильное торжество — и получил «пышный». Польский взял нравственную: раздутый от самомнения человек, отсюда PYCHA как гордыня и PYSZNY как надменный. А значение «очень вкусный» пришло третьим путём, через идею роскошного, обильного угощения: PYSZNY STÓŁ был сначала богато накрытым столом, а затем уже просто вкусным. Поэтому восклицание PYCHA! при вкусной еде и грех гордыни PYCHA — одно и то же слово, и это не совпадение, а две ветви одного образа."
memory: "Не «пышный»! О еде pyszny значит «очень вкусный», сильнее чем smaczny; о человеке — «надменный». Русское «пышный» по-польски okazały или bujny. Всё от pycha «гордыня», от *pyx- «раздуваться»: русский взял физическое раздувание, польский — нравственное. И то же слово pycha! служит восклицанием «вкуснятина!»."
idioms:
