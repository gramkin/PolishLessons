notes:
  - { kind: false-friend, text: "Один корень, три разных итога — и русский не угадает ни одного. Русское «пышный» значит «роскошный, объёмный»: «пышные волосы», «пышное торжество». Польское PYSZNY не значит ни того, ни другого. Его первое и самое частое значение — «очень вкусный», сильнее, чем SMACZNY: PYSZNY OBIAD есть обед, от которого в восторге. Второе значение — «надменный, высокомерный», о человеке. А русское «пышный» по-польски будет OKAZAŁY, WSPANIAŁY или о волосах BUJNY. Так что при переводе надо каждый раз смотреть, о еде речь или о человеке, и ни в том, ни в другом случае «пышный» не подходит." }
  - { kind: usage, text: "Два значения различает предмет: о еде — «вкусный», о человеке — «надменный», и спутать их в живой речи невозможно. Отдельно стоит выучить существительное PYCHA: оно значит «гордыня» и входит в список семи смертных грехов в польском катехизисе, а в разговоре служит восклицанием при вкусной еде — PYCHA! «вкуснятина!». То есть одно и то же слово называет и грех гордыни, и восторг от обеда, и обе дороги ведут от одного образа: нечто раздутое, пышащее. Степени сравнения правильные: PYSZNY, PYSZNIEJSZY, NAJPYSZNIEJSZY." }
  - { kind: pronunciation, text: "Читается «пы́шны», ударение на первом слоге из двух. Гласная Y даёт русское «ы», а сочетание SZ — «ш». Конечное Y тоже «ы», поэтому слово звучит почти как русское «пышный», и именно это созвучие создаёт ловушку: звучит знакомо, значит другое. Мужско-личная форма множественного PYSZNI звучит «пы́шни», с мягким n. В сравнительной степени PYSZNIEJSZY ударение переходит на -NIEJ-: «пышне́йшы»." }
  - { kind: government, text: "Прилагательное согласуется с существительным и ничем не управляет. В отличие от SMACZNY из предыдущей партии, мужско-личная форма множественного PYSZNI здесь вполне законна и нужна, потому что надменным бывает именно человек: PYSZNI URZĘDNICY, PYSZNI PANOWIE. А вот о еде во множественном числе говорят PYSZNE: PYSZNE PIEROGI, и эта форма неличная. При сравнении — предлог OD с родительным или союз NIŻ: PYSZNIEJSZY OD WCZORAJSZEGO." }
