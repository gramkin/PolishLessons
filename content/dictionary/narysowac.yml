  - id: outline
    ru: "обрисовать, описать (перен.)"
    examples:
      - pl: "Minister narysował czarny scenariusz."
        ru: "Министр нарисовал мрачный сценарий."
        source: { kind: authored }
      - pl: "Narysuj mi ogólny obraz sytuacji."
        ru: "Обрисуй мне общую картину ситуации."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "NARYSOWAĆ — «нарисовать» линиями: карандашом, ручкой, мелом. Красками — NAMALOWAĆ: NAMALOWAĆ OBRAZ OLEJNY. Русское «рисовать» покрывает оба, польский различает RYSOWAĆ и MALOWAĆ. А MALOWAĆ ŚCIANY — «красить стены»." }
  - { kind: usage, text: "Пятьдесят три формы — подпись переходного глагола совершенного вида: страдательное NARYSOWANY и деепричастие NARYSOWAWSZY. Спряжение на -UJĘ: NARYSUJĘ, NARYSUJESZ, NARYSUJĄ. Видовой партнёр — RYSOWAĆ: DZIECI RYSUJĄ KREDKAMI." }
  - { kind: government, text: "Что — винительный: NARYSOWAĆ DOM. Чем — творительный без предлога: NARYSOWAĆ OŁÓWKIEM, KREDĄ. На чём — NA с местным: NA KARTCE, NA TABLICY. Кому — дательный: NARYSUJ MI." }
  - { kind: pronunciation, text: "Читается «нарысо́ваць», четыре слога, ударение на предпоследнем. Y — «ы», S твёрдое: «со», не «сё». Будущее NARYSUJĘ — «нарысу́е»." }
  - { kind: register, text: "Нейтральное бытовое слово школы и детства. В переносном смысле — «обрисовать картину»: NARYSOWAĆ SCENARIUSZ. Техническое «начертить» — NAKREŚLIĆ или тоже NARYSOWAĆ." }
collocations:
  - { pl: "narysować ołówkiem", ru: "нарисовать карандашом" }
  - { pl: "narysować mapę", ru: "нарисовать карту" }
  - { pl: "narysować scenariusz", ru: "обрисовать сценарий" }
family:
  - { pl: "rysować", ru: "рисовать", relation: aspect }
  - { pl: "rysunek", ru: "рисунок", relation: root, id: rysunek }
  - { pl: "namalować", ru: "нарисовать красками", relation: root }
etymology: "Приставка NA- плюс RYSOWAĆ, из немецкого REISSEN «чертить», то же слово, что русское «рисовать». В русский пришло через польский."
memory: "Narysować — нарисовать линиями: ołówkiem, kredą. Красками — namalować! Narysuj mi kota. Читается «нарысо́ваць»."
idioms:
