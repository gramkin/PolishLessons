# review
id: narysowac
format: 2
lemma: "narysować"
rank: 4660
pos: verb
pron: { cyr: "нарысо́ваць" }
senses:
  - id: draw
    ru: "нарисовать (карандашом, линиями)"
    examples:
      - pl: "Narysuj mi kota."
        ru: "Нарисуй мне кошку."
        source: { kind: authored }
      - pl: "Córka narysowała nasz dom."
        ru: "Дочь нарисовала наш дом."
        source: { kind: authored }
      - pl: "Narysował mapę na serwetce."
        ru: "Он нарисовал карту на салфетке."
