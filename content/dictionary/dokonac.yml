# review
id: dokonac
format: 2
lemma: "dokonać"
rank: 1534
pos: verb
aspect: perf
pron: { cyr: "доко́наць" }
senses:
  - id: accomplish
    ru: "совершить, осуществить"
    examples:
      - pl: "Dokonał odważnej rzeczy."
        ru: "Он совершил смелый поступок."
        source: { kind: translated, id: 558351 }
      - pl: "Dokonał ważnego odkrycia."
        ru: "Он сделал важное открытие."
        source: { kind: translated, id: 572872 }
      - pl: "Dokonaliśmy niemożliwego."
        ru: "Мы совершили невозможное."
        source: { kind: translated, id: 3756976 }
  - id: make
    ru: "сделать (выбор, платёж, изменения)"
    examples:
      - pl: "Musisz tylko dokonać wyboru."
        ru: "Тебе нужно только сделать выбор."
        source: { kind: translated, id: 13339107 }
      - pl: "Dokonaliście mądrego wyboru."
        ru: "Вы сделали мудрый выбор."
        source: { kind: translated, id: 12351092 }
      - pl: "Dokonałem płatności w odpowiednim terminie."
        ru: "Я произвёл платёж в надлежащий срок."
        source: { kind: translated, id: 3456905 }
notes:
  - { kind: government, text: "dokonać требует родительного падежа — это главное отличие от русского: dokonać wyboru «сделать выбор», dokonać odkrycia «сделать открытие», dokonać zmian «произвести изменения»." }
  - { kind: usage, text: "Несовершенный вид — dokonywać, и он тоже управляет родительным: dokonywać wyborów." }
  - { kind: usage, text: "Безличное dokonano «совершили» частотно в отчётах и хронике: zabójstwa dokonano «убийство совершили»." }
  - { kind: usage, text: "Существительное dokonanie значит «совершение», а во множественном dokonania — «достижения»." }
collocations:
  - { pl: "dokonać wyboru", ru: "сделать выбор" }
  - { pl: "dokonać odkrycia", ru: "сделать открытие" }
  - { pl: "dokonać zmian", ru: "внести изменения" }
etymology: "Приставка do- + konać, от koniec «конец» — буквально «довести до конца». Русские «кончить» и «доконать» от того же корня; польское dokonać сохранило значение «совершить, довести до конца»."
memory: "dokonać = «совершить, осуществить», и падеж другой, чем в русском: dokonać wyboru — родительный, а русское «сделать выбор» — винительный. Несовершенный вид — dokonywać. Безличное dokonano «совершили» живёт в отчётах."
idioms:
