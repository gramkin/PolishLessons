# review
id: powtarzac
format: 2
lemma: "powtarzać"
rank: 1060
pos: verb
aspect: imperf
pron: { cyr: "повта́жаць" }
senses:
  - id: repeat
    ru: "повторять (несовершенный вид)"
    examples:
      - pl: "Nie każ mi powtarzać."
        ru: "Не заставляй меня повторять."
        source: { kind: translated, id: 349119 }
      - pl: "Powtarzaj za mną."
        ru: "Повторяй за мной."
        source: { kind: translated, id: 1112989 }
      - pl: "Ciągle powtarzam to samo."
        ru: "Я постоянно повторяю одно и то же."
        source: { kind: translated, id: 6029678 }
  - id: recur
    ru: "powtarzać się — повторяться"
    examples:
      - pl: "Historia się powtarza."
        ru: "История повторяется."
        source: { kind: translated, id: 3446210 }
      - pl: "Powtarzały się przy każdej wizycie."
        ru: "Они повторялись при каждом визите."
        source: { kind: translated, id: 11318562 }
  - id: revise
    ru: "повторять (учебный материал), готовиться к экзамену"
    note: "Значения «готовиться, зубрить» у русского «повторять» нет, а у польского есть."
    examples:
      - pl: "Mary jeszcze nie powtarzała lekcji."
        ru: "Мэри ещё не повторяла урок."
        source: { kind: translated, id: 6541767 }
      - pl: "Powtarzam słówka przed egzaminem."
        ru: "Я повторяю слова перед экзаменом."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Несовершенный вид к powtórzyć «повторить». Обратите внимание на чередование: powtórzyć с ó, powtarzać с a." }
  - { kind: usage, text: "powtarzać się значит и «повторяться» о событиях (Historia się powtarza), и «повторяться» о человеке, который твердит одно и то же (Nie lubię się powtarzać)." }
  - { kind: usage, text: "Третье значение — учебное: powtarzać lekcje, powtarzać słówka «повторять уроки, слова» перед экзаменом. Отглагольное powtórka значит «повторение перед экзаменом»." }
  - { kind: pronunciation, text: "Сочетание rz читается как ж: powtarzać звучит «повтажаць», а не «повтарзаць»." }
collocations:
  - { pl: "powtarzać za kimś", ru: "повторять за кем-то" }
  - { pl: "powtarzać się", ru: "повторяться" }
  - { pl: "powtarzać materiał", ru: "повторять материал" }
family:
  - { pl: "powtórzyć", ru: "повторить", relation: aspect }
  - { pl: "powtórka", ru: "повторение, повтор", relation: derived }
  - { pl: "powtarzalny", ru: "повторяемый", relation: derived }
etymology: "Приставка po- плюс корень -twarzać/-tórzyć, родственный русскому «творить» и «вторить»; powtórzyć буквально «сделать во второй раз». Русское «повторить» собрано из тех же частей."
memory: "powtarzać — «повторять», несовершенный вид к powtórzyć. Запомните чередование гласной: powtórzyć с ó, powtarzać с a. И третье значение, которого нет у русского: powtarzać lekcje «повторять уроки, готовиться к экзамену»."
idioms:
  - { pl: "powtarzać jak papuga", ru: "повторять как попугай" }
  - { pl: "historia się powtarza", ru: "история повторяется" }
  - { pl: "powtarzać jak mantrę", ru: "твердить как мантру" }
