# review
id: gratulacje
format: 2
lemma: "gratulacje"
rank: 1244
pos: noun
pron: { cyr: "гратуля́цье" }
senses:
  - id: congrats
    ru: "поздравления; Gratulacje! «Поздравляю!»"
    examples:
      - pl: "Gratulacje!"
        ru: "Поздравляю!"
        source: { kind: translated, id: 1011651 }
      - pl: "Moje gratulacje!"
        ru: "Мои поздравления!"
        source: { kind: translated, id: 349169 }
      - pl: "Gratulacje, wygrałeś gofrownicę!"
        ru: "Поздравляю, Вы выиграли вафельницу!"
        source: { kind: tatoeba, id: 13783057 }
  - id: on-occasion
    ru: "gratulacje z okazji — поздравления по случаю"
    examples:
      - pl: "Gratulacje z okazji zawarcia związku małżeńskiego."
        ru: "Поздравления по случаю вступления в брак."
        source: { kind: translated, id: 11580212 }
      - pl: "Przyjmij moje serdeczne gratulacje z okazji twojego dzisiejszego sukcesu."
        ru: "Прими мои сердечные поздравления по случаю твоего сегодняшнего успеха."
        source: { kind: tatoeba, id: 442702 }
      - pl: "Słyszałem, że zdałeś egzaminy wstępne. Gratulacje!"
        ru: "Я слышал, ты сдал вступительные экзамены. Поздравляю!"
        source: { kind: translated, id: 766209 }
notes:
  - { kind: usage, text: "Слово существует только во множественном числе, как русские «поздравления». Само по себе Gratulacje! значит «Поздравляю!»." }
  - { kind: government, text: "gratulacje z okazji czegoś «поздравления по случаю чего-то» — оборот z okazji требует родительного падежа." }
  - { kind: government, text: "Глагол gratulować требует дательного и родительного сразу: Gratuluję ci sukcesu «Поздравляю тебя с успехом». Русскому «с» отвечает польский родительный без предлога." }
  - { kind: false-friend, text: "С днём рождения поздравляют иначе: Wszystkiego najlepszego! «Всего наилучшего!». Gratulacje! приберегают для достижений — экзамена, свадьбы, повышения." }
collocations:
  - { pl: "gratulacje z okazji", ru: "поздравления по случаю" }
  - { pl: "moje gratulacje", ru: "мои поздравления" }
  - { pl: "składać gratulacje", ru: "приносить поздравления" }
etymology: "Из латинского gratulatio «изъявление радости», от gratus «приятный, благодарный». Русское «поздравление» — своё слово, от «здравие»."
memory: "gratulacje — «поздравления», только во множественном числе. Gratulacje! значит «Поздравляю!», но с днём рождения говорят Wszystkiego najlepszego! Глагол требует сразу двух падежей: gratuluję ci sukcesu."
