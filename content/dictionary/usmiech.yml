# review
id: usmiech
format: 2
lemma: "uśmiech"
rank: 1711
pos: noun
pron: { cyr: "у́сьмех" }
senses:
  - id: smile
    ru: "улыбка"
    examples:
      - pl: "Kocham twój uśmiech."
        ru: "Я люблю твою улыбку."
        source: { kind: translated, id: 10167875 }
      - pl: "Susie ma ładny uśmiech."
        ru: "У Сюзи красивая улыбка."
        source: { kind: translated, id: 1059752 }
      - pl: "Jej uśmiech wyrażał wdzięczność."
        ru: "Её улыбка выражала благодарность."
        source: { kind: tatoeba, id: 362460 }
  - id: with-smile
    ru: "z uśmiechem — с улыбкой"
    examples:
      - pl: "Odpowiedział uśmiechem."
        ru: "Он ответил улыбкой."
        source: { kind: tatoeba, id: 4685044 }
      - pl: "„Cześć” - powiedział Tom z uśmiechem."
        ru: "\"Привет\", — сказал Том, улыбаясь."
        source: { kind: tatoeba, id: 826564 }
      - pl: "Pozdrowił mnie z uśmiechem."
        ru: "Он поздоровался со мной с улыбкой."
        source: { kind: translated, id: 757247 }
notes:
  - { kind: government, text: "«С улыбкой» — z uśmiechem, творительный падеж; «улыбкой» без предлога тоже творительный: odpowiedział uśmiechem «он ответил улыбкой»." }
  - { kind: usage, text: "Глагол — uśmiechać się / uśmiechnąć się «улыбаться»; существительное образовано от него приставкой u-." }
  - { kind: usage, text: "uśmiech losu — «улыбка судьбы», устойчивое сочетание, как и в русском." }
  - { kind: usage, text: "Существительное мужского рода: uśmiech, uśmiechu, uśmiechem." }
collocations:
  - { pl: "z uśmiechem", ru: "с улыбкой" }
  - { pl: "piękny uśmiech", ru: "красивая улыбка" }
  - { pl: "uśmiech losu", ru: "улыбка судьбы" }
etymology: "От uśmiechać się «улыбаться», в основе śmiać się «смеяться» (праславянское *smьjati). Русская «улыбка» идёт от другого корня («лыбиться»), но оба слова строятся от глагола."
memory: "uśmiech = «улыбка», от uśmiechać się. Запомните творительный: z uśmiechem «с улыбкой» и odpowiedzieć uśmiechem «ответить улыбкой». Слово мужского рода: uśmiechu, uśmiechem."
idioms:
  - { pl: "z uśmiechem", ru: "с улыбкой" }
  - { pl: "piękny uśmiech", ru: "красивая улыбка" }
  - { pl: "uśmiech losu", ru: "улыбка судьбы" }
