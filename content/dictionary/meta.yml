notes:
  - { kind: false-friend, text: "Русская «мета» и польское META выглядят одинаково, но родства между ними нет. Русская «мета» — это знак, отметка, от глагола «метить», слово славянское. Польская META — латинское заимствование, от META «поворотный столб на римском ристалище», то есть точка, вокруг которой разворачивались колесницы. Отсюда и смысл: конец дистанции, финиш. Совпадение звучания здесь чистая случайность, и переводить META как «мета» нельзя никогда." }
  - { kind: usage, text: "Десять форм, женский род, склонение как у KOBIETA. В дательном и местном падеже единственного числа T переходит в C: META, но MECIE. Это то же чередование, что в KOBIETA — KOBIECIE и SIOSTRA — SIOSTRZE. Звательный METO употребляется редко, разве что в стихах или в шутку, когда бегун обращается к далёкому финишу. Множественное число живое: METY POŚREDNIE «промежуточные финиши» в длинных гонках." }
  - { kind: government, text: "До финиша — предлог DO с родительным: DO METY. На финише — предлог NA с местным падежом: NA MECIE. Пересечь финиш — PRZEKROCZYĆ METĘ, винительный без предлога. В устойчивом обороте NA DŁUŻSZĄ METĘ предлог NA идёт с винительным, а не с местным, и это надо запомнить отдельно: не NA DŁUŻSZEJ MECIE, а именно NA DŁUŻSZĄ METĘ." }
  - { kind: pronunciation, text: "Читается «мэ́та», два слога, ударение на первом. Буква E даёт «э», а T остаётся твёрдым, так что первый слог звучит как русское «мэ», не «ме». В форме MECIE сочетание CIE даёт мягкое «це», и всё слово звучит «ме́це», с мягким началом. Разница между META «мэ́та» и MECIE «ме́це» слышна сразу, и она же подсказывает, где прошло чередование." }
  - { kind: register, text: "Слово нейтральное, из спорта и повседневной речи. Частые обороты: LINIA METY «линия финиша», PRZEKROCZYĆ METĘ «пересечь финиш», NA MECIE «на финише». Отдельно и много чаще спорта звучит NA DŁUŻSZĄ METĘ «в долгосрочной перспективе» и его пара NA KRÓTKĄ METĘ «в краткосрочной»: эти два оборота слышны в деловой речи, в политике и в обычном разговоре, и ради них одних слово стоит выучить." }
