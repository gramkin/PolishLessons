etymology: "Из латинского META «поворотный столб на ристалище», вокруг которого колесницы разворачивались на римских бегах. Отсюда значение конечной точки дистанции. Русский взял для того же понятия английское «финиш», а древнее латинское слово в русский не попало. Русская «мета» — другое слово, славянское, от «метить», и означает знак или отметку. Так что META и «мета» это два независимых слова, случайно сошедшихся в звучании: один из самых чистых примеров ложного друга в польском."
memory: "Чистый ложный друг: польская meta это финиш, от латинского meta «поворотный столб на ристалище», а русская «мета» это отметка, от «метить». Общего нет ничего. Главное, ради чего слово стоит выучить, это оборот na dłuższą metę «в долгосрочной перспективе» и его пара na krótką metę: предлог na там идёт с винительным. В дательном и местном t переходит в c: meta, но na mecie «мэ́та», но «ме́це»."
idioms:
