notes:
  - { kind: government, text: "В прямом значении: ZRZUCIĆ COŚ плюс откуда — предлог Z с родительным: ZRZUCIĆ KLUCZE Z BALKONU, ZRZUCIĆ ŚNIEG Z DACHU. Куда — предлог NA с винительным: NA PODWÓRZE, NA KRZESŁO. В значении вины предлог тот же NA с винительным, и русский совпадает: ZRZUCIĆ WINĘ NA KOGOŚ — «свалить вину на кого-то». А вот вес идёт без предлога, прямым винительным: ZRZUCIĆ PIĘĆ KILO, ZRZUCIĆ WAGĘ." }
  - { kind: false-friend, text: "Корень RZUC- ничего в русском не напоминает, и опереться тут не на что: RZUCIĆ — «бросить», и приставки разбирают смысл так же, как в русском у «бросить», только с чужим корнем. ZRZUCIĆ — «сбросить», WYRZUCIĆ — «выбросить», PORZUCIĆ — «забросить, покинуть», ODRZUCIĆ — «отбросить, отвергнуть», PRZERZUCIĆ — «перебросить». Выучив RZUCIĆ, остальное выводишь по приставке — набор приставок тот же, что в русском." }
  - { kind: pronunciation, text: "Начальное ZRZ- выглядит страшно, но читается просто: z плюс rz, то есть «зж». Получается ZRZUCIĆ как «зжруциць», где согласные идут подряд без вставных гласных. Русскому это привычнее, чем кажется: он сам говорит «сжать» как «жжать». Ударение на предпоследнем слоге везде, кроме форм на -byśmy и -byście, где оно уходит на третий слог от конца: zrzuciliBYŚmy." }
  - { kind: usage, text: "Пятьдесят три формы — совершенный переходный: сорок одна основная, одиннадцать страдательных причастий и деепричастие ZRZUCIWSZY. Гласная в корне не меняется нигде: ZRZUCIĆ, ZRZUCĘ, ZRZUCIŁ, ZRZUCONY, и несовершенная пара ZRZUCAĆ тоже держит u. Это стоит сравнить с OBRÓCIĆ из прошлой партии: там тот же класс на -CIĆ и то же причастие на -CONY, но корень играет ó против a — OBRÓCIĆ при OBRACAĆ. Значит мена гласной принадлежит корню, а не классу." }
collocations:
  - { pl: "zrzucić winę na kogoś", ru: "свалить вину на кого-то" }
  - { pl: "zrzucić kilka kilo", ru: "сбросить несколько килограммов" }
  - { pl: "zrzucić śnieg z dachu", ru: "сбросить снег с крыши" }
family:
  - { pl: "zrzucać", ru: "сбрасывать", relation: aspect, id: zrzucac }
  - { pl: "rzucić", ru: "бросить", relation: root, id: rzucic }
  - { pl: "wyrzucić", ru: "выбросить", relation: root, id: wyrzucic }
etymology: "Приставка z- «с, вниз» и RZUCIĆ, из праславянского *rjutiti «бросать, швырять». Русского родственника у корня нет, и это редкий случай, когда частое польское слово приходится заучивать целиком. Зато приставка работает ровно как русская «с-» в «сбросить»: движение сверху вниз и прочь от себя. Отсюда и второе значение — сбросить вес, то есть снять с себя лишнее, — и третье, переносное: сбросить с себя вину, переложив её на другого."
memory: "Корень чужой, приставки свои: rzucić «бросить», zrzucić «сбросить», wyrzucić «выбросить», odrzucić «отбросить». Выучи корень один раз, а приставки уже знаешь по-русски."
idioms:
  - { pl: "zrzucić winę na kogoś", ru: "свалить вину на кого-то" }
  - { pl: "zrzucić maskę", ru: "сбросить маску, показать своё настоящее лицо" }
