notes:
  - { kind: usage, text: "Главное значение — «общий, суммарный»: ŁĄCZNY KOSZT «общая стоимость», ŁĄCZNA KWOTA «итоговая сумма», W KLASYFIKACJI ŁĄCZNEJ «в общем зачёте». Рядом стоит наречие ŁĄCZNIE «в общей сложности, вместе»: ŁĄCZNIE STO ZŁOTYCH «всего сто злотых». Два термина стоит выучить целиком: TKANKA ŁĄCZNA «соединительная ткань» и PISOWNIA ŁĄCZNA «слитное написание» — в польских правилах орфографии постоянно противопоставляют PISOWNIĘ ŁĄCZNĄ I ROZDZIELNĄ, «слитное и раздельное написание»." }
  - { kind: false-friend, text: "Форма напоминает русские «лучший» или «ласковый», но связи нет. ŁĄCZNY — от ŁĄCZYĆ «соединять»: «общий» значит «сложенный вместе». Не путайте его и с WSPÓLNY: WSPÓLNY POKÓJ — «общая комната», которой пользуются вместе, а ŁĄCZNY говорят о сумме, итоге, совокупности: ŁĄCZNY CZAS «общее время», а не «совместное». Мужско-личная форма ŁĄCZNI в таблице есть, но при существительных-лицах слово не употребляется." }
  - { kind: pronunciation, text: "Читается «уо́нчны»: Ł — «у», Ą перед CZ — «он», CZ твёрдое «ч», конечное Y — «ы». Ударение на первом слоге, потому что слогов всего два. Начало «уо» произносится слитно, как один слог с губным полугласным, а не «у-о»." }
