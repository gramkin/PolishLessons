etymology: "Образовано от ŁĄCZYĆ «соединять». Этот глагол восходит к тому же праславянскому корню, что русское «лучить» в словах «разлучить», «случай», «улучить»: польское Ą на месте русского «у», как в RĄKA — «рука»."
memory: "ŁĄCZYĆ — «соединять», ŁĄCZNY — «соединённый вместе», то есть «общий, суммарный». Вспомните русское «разлучить»: тот же корень, только наоборот. А в школе: PISOWNIA ŁĄCZNA — «слитное написание»."
idioms:
