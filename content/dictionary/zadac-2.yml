notes:
  - { kind: false-friend, text: "САМАЯ ОПАСНАЯ ПАРА: ŻĄDAĆ НЕ «ЗАДАТЬ». Русское «задать» по-польски zadać, через z и a: zadać pytanie «задать вопрос», zadać pracę domową. А żądać, через ż и ą, значит «ТРЕБОВАТЬ». Слова различаются двумя буквами и всем смыслом; на письме их спасает ą, в речи — носовое «он»: «жонда́ць» против «зада́ць»." }
  - { kind: government, text: "ТРЕБУЮТ ЧЕГО — РОДИТЕЛЬНЫЙ, И РУССКИЙ ЗДЕСЬ СОЮЗНИК. Żądać wyjaśnień, pieniędzy, odpowiedzi, zwrotu — никакого винительного. Русское «требовать объяснений» устроено точно так же, так что падеж переносится без поправки. От кого — od с родительным: żądać czegoś od kogoś. С придаточным — żądać, żeby…" }
  - { kind: pronunciation, text: "Два слога, ударение на первом: ŻĄ-dać. Ż читается как твёрдое ж, ą перед d даёт «он»: «жонда́ць». В настоящем времени носовой сохраняется: żądam — «жо́ндам», żądają — «жонда́йон»." }
  - { kind: usage, text: "Вид несовершенный, совершенная пара — zażądać. Поэтому есть причастие żądający и деепричастие żądając, но нет формы на -wszy. Существительное żądanie «требование» очень частотно: na żądanie «по требованию», przystanek na żądanie «остановка по требованию». Одна форма причастия пропущена по грамматической причине и объяснена в карточке." }
collocations:
  - { pl: "żądać wyjaśnień", ru: "требовать объяснений" }
  - { pl: "na żądanie", ru: "по требованию" }
  - { pl: "spełnić żądania", ru: "выполнить требования" }
family:
  - { pl: "żądanie", ru: "требование", relation: derived }
  - { pl: "zażądać", ru: "потребовать", relation: aspect }
  - { pl: "żądza", ru: "страсть, вожделение", relation: root }
  - { pl: "żądny", ru: "жаждущий, алчный", relation: derived }
etymology: "Из праславянского *žędati «желать, жаждать» — того же корня, что русские «жаждать», «жажда» и «жадный». Требование выросло из сильного желания. Польский сохранил и исходное значение в żądza «страсть» и żądny «алчный». С глаголом zadać «задать» родства нет никакого: тот от dać «дать»."
memory: "żądać — «ТРЕБОВАТЬ», не «задать»: задать это zadać, через z и a. Настоящая родня русская — «ЖАЖДАТЬ» и «жадный»: требование выросло из жажды. Падеж тот же, что в русском: żądać wyjaśnień, родительный."
idioms:
  - { pl: "na żądanie", ru: "по требованию" }
  - { pl: "żądać wyjaśnień", ru: "требовать объяснений" }
formExamplesSkip:
  - { form: "żądani", reason: "Пропуск по грамматической причине. Żądać управляет родительным падежом того, ЧТО требуют: денег, объяснений, документов. Страдательное причастие поэтому описывает требуемую вещь — żądana kwota, żądane dokumenty, — а мужско-личная форма множественного числа означала бы «люди, которых требуют». Такого управления у глагола нет: требуют не людей, а их выдачи (żądać wydania kogoś). Остальные формы причастия, включая немужско-личное żądane, совершенно обычны." }
