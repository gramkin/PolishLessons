  - { pl: "dostawa", ru: "поставка", relation: derived }
  - { pl: "dostępny", ru: "доступный", relation: derived }
etymology: "Из do- + stawać, того же гнезда, что dostać «получить». Русское «доставать» собрано из тех же частей, но значение разошлось — отсюда ловушка."
memory: "dostawać — «получать», а не «доставать»: доставать из кармана будет wyjmować. И запомните спряжение: оно идёт не от инфинитива, а как у dawać — dostaję, dostajesz, dostaje. Формы dostawam не существует. Совершенный вид — dostać."
