# review
id: dostawac
format: 2
lemma: "dostawać"
rank: 891
pos: verb
aspect: imperf
aspectPair: dostac
pron: { cyr: "доста́ваць" }
senses:
  - id: receive
    ru: "получать"
    note: "Не «доставать»! Доставать — wyjmować, sięgać."
    examples:
      - pl: "W większości wyborów, kandydat który dostaje większość głosów, wygrywa wybory."
        ru: "Как правило кандидат, получивший большинство голосов, выигрывает выборы."
        source: { kind: tatoeba, id: 3777849 }
      - pl: "Ile zadań domowych dostajesz każdego dnia?"
        ru: "Сколько домашних заданий ты получаешь каждый день?"
        source: { kind: tatoeba, id: 9678408 }
      - pl: "Kto to dostaje?"
        ru: "Кто это получает?"
        source: { kind: translated, id: 12188963 }
  - id: regularly
    ru: "о регулярном получении: зарплата, оценки"
    examples:
      - pl: "Dostaję zapłatę dzienną."
        ru: "Мне платят подённо."
        source: { kind: translated, id: 792176 }
      - pl: "Dostajemy pieniądze przy wypłacie."
        ru: "Деньги мы получаем в день зарплаты."
        source: { kind: translated, id: 12949336 }
      - pl: "Jeśli nie będziesz się lepiej uczyć, będziesz dostawać marne oceny."
        ru: "Если не будешь учиться лучше, будешь получать скверные оценки."
        source: { kind: translated, id: 659755 }
  - id: symptom
    ru: "dostawać czegoś — о состояниях: сыпи, злости"
    examples:
      - pl: "Od jajek dostaję wysypki."
        ru: "От яиц у меня сыпь."
        source: { kind: translated, id: 1845010 }
      - pl: "Dostaję gęsiej skórki."
        ru: "У меня мурашки по коже."
        source: { kind: authored }
      - pl: "Dostaje szału, gdy to słyszy."
        ru: "Он приходит в бешенство, когда это слышит."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "dostawać значит «получать», а не «доставать». Русское «доставать» по-польски будет wyjmować (вынимать), sięgać (дотягиваться) или zdobywać (раздобывать). Dostaję list значит «Я получаю письмо»." }
  - { kind: usage, text: "Настоящее время образуется не от основы инфинитива: dostaję, dostajesz, dostaje, dostajemy, dostajecie, dostają — как у dawać. Форм вроде dostawam не существует, хотя по инфинитиву их легко вообразить." }
  - { kind: false-friend, text: "Существительное dostawa «поставка, доставка» пишется как форма глагола, но глагольной формой не является: Czy dostawa jest płatna? «Доставка платная?»." }
  - { kind: usage, text: "Совершенный вид — dostać. С родительным падежом глагол описывает накатившее состояние: dostawać gorączki «подхватывать жар», dostawać szału «приходить в бешенство»." }
collocations:
  - { pl: "dostawać pieniądze", ru: "получать деньги" }
  - { pl: "dostawać oceny", ru: "получать оценки" }
  - { pl: "dostawać szału", ru: "приходить в бешенство" }
  - { pl: "dostawa", ru: "поставка, доставка" }
family:
