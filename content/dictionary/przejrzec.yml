etymology: "Приставка PRZE- «пере-, про-» плюс старый глагол -JRZEĆ, продолжающий праславянское *zьrěti «смотреть, видеть». Это тот же корень, что в русских «зреть», «зрение», «взор», «прозреть», и в польском он сохранился только в приставочных словах: PRZEJRZEĆ, WEJRZEĆ, SPOJRZEĆ. Начальное z- корня в польском перешло в j после приставки, отсюда и странное на вид скопление PRZEJRZ-. Значение «просмотреть» идёт от идеи взгляда, прошедшего насквозь, а «прозреть» и «проясниться» — от того же образа, только применённого к самому глазу или к воде: сквозь них стало видно."
memory: "Один инфинитив, два спряжения: przejrzy- для переходного «просмотреть, раскусить», przejrzej- для непереходного «проясниться, прозреть». Прошедшее время у обоих общее. Корень тот же, что в русском «зрение». И przejrzeć kogoś — это «раскусить», а не «просмотреть, не заметить»."
idioms:
