notes:
  - { kind: usage, text: "Самое неожиданное в этом слове — два набора форм настоящего-будущего времени у одного инфинитива. Основа PRZEJRZY- обслуживает переходные значения, «просмотреть» и «раскусить»: PRZEJRZĘ, PRZEJRZYSZ, PRZEJRZY, повелительное PRZEJRZYJ. Основа PRZEJRZEJ- обслуживает непереходное «проясниться, прозреть»: PRZEJRZEJĘ, PRZEJRZEJESZ, PRZEJRZEJE, повелительное PRZEJRZEJ. При этом прошедшее время, условное наклонение и отглагольное существительное у обоих общие — PRZEJRZAŁ, PRZEJRZELI, PRZEJRZENIE, — так что расходятся они только в будущем. Это не два разных глагола, как UPAŚĆ, а один с двумя спряжениями." }
  - { kind: pronunciation, text: "Читается «пше́йжэць», в два слога, с ударением на первом. Разберите буквы по порядку: prz — это «пш», e — «э», j — «й», rz — «ж», e — «э», ć — «ць». Скопление PRZEJRZ выглядит страшно, но содержит всего четыре звука, «пшейж». В формах PRZEJRZYSZ — «пшейжы́ш», ударение уже на втором слоге. Деепричастие PRZEJRZAWSZY звучит «пшейжа́фшы», где w перед s оглушается." }
  - { kind: government, text: "В переходных значениях глагол требует винительного падежа без предлога, и предмет при нём бывает двух родов. Вещь или текст: PRZEJRZEĆ GAZETĘ, PRZEJRZEĆ DOKUMENTY, PRZEJRZEĆ POCZTĘ. Человек или его намерения: PRZEJRZEĆ KOGOŚ, PRZEJRZEĆ CZYJEŚ ZAMIARY — «раскусить». Именно потому, что человек здесь бывает прямым дополнением, у глагола есть и форма PRZEJRZANI, «раскушенные»: ZOSTALI PRZEJRZANI. В непереходном значении дополнения нет вовсе: WODA PRZEJRZEJE, CHORY PRZEJRZAŁ." }
  - { kind: false-friend, text: "Корень русскому знаком, а распределение значений другое. PRZEJRZEĆ покрывает сразу и «просмотреть», и «прозреть», которые в русском разошлись по разным приставкам. Переводить нужно по контексту: PRZEJRZAŁ GAZETĘ — «просмотрел газету», PRZEJRZAŁ NA OCZY — «прозрел». Третье значение, «раскусить человека», русским «просмотреть» не передаётся вовсе: «я его просмотрел» значило бы, что не заметил, то есть почти обратное. Для него нужно «раскусить» или «разгадать»." }
