# review
id: czyscic
format: 2
lemma: "czyścić"
rank: 4460
pos: verb
pron: { cyr: "чы́сьциць" }
senses:
  - id: clean
    ru: "чистить"
    examples:
      - pl: "Codziennie czyszczę buty."
        ru: "Я каждый день чищу ботинки."
        source: { kind: authored }
      - pl: "Mama czyści dywan odkurzaczem."
        ru: "Мама чистит ковёр пылесосом."
        source: { kind: authored }
      - pl: "Czyść zęby dwa razy dziennie."
        ru: "Чисти зубы два раза в день."
        source: { kind: authored }
  - id: clean-food
    ru: "чистить (рыбу, овощи); очищать (данные, память)"
    examples:
      - pl: "Dziadek czyści ryby nad rzeką."
        ru: "Дедушка чистит рыбу у реки."
        source: { kind: authored }
      - pl: "Ten program czyści pamięć telefonu."
        ru: "Эта программа очищает память телефона."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "CZYŚCIĆ — «чистить», совпадение почти полное. Но картошку по-польски не чистят, а обирают: OBIERAĆ ZIEMNIAKI. Зубы — чаще MYĆ ZĘBY. Химчистка — PRALNIA CHEMICZNA, а CZYSZCZENIE NA SUCHO — «сухая чистка»." }
  - { kind: usage, text: "Несовершенный вид; совершенный — WYCZYŚCIĆ. Спряжение: CZYSZCZĘ, CZYŚCISZ, CZYSZCZĄ — Ś-Ć чередуется со SZCZ в первом лице и третьем множественного. Мужско-личное страдательное CZYSZCZENI в карточку не включено." }
  - { kind: government, text: "Что — винительный: CZYŚCIĆ BUTY. Чем — творительный: CZYŚCIĆ SZCZOTKĄ. От чего — Z с родительным: CZYŚCIĆ Z KURZU, Z RDZY." }
  - { kind: pronunciation, text: "Читается «чы́сьциць»: CZY — «чы», ŚCI — «сьци». Ударение на первом слоге. CZYSZCZĘ — «чы́шчэ»." }
  - { kind: register, text: "Нейтральное бытовое слово. Разговорное CZYŚCIĆ KONTO «опустошать счёт» — шутливое." }
collocations:
  - { pl: "czyścić buty", ru: "чистить ботинки" }
  - { pl: "czyścić z kurzu", ru: "очищать от пыли" }
  - { pl: "czyścić ryby", ru: "чистить рыбу" }
family:
  - { pl: "wyczyścić", ru: "вычистить", relation: aspect, id: wyczyscic }
  - { pl: "czysty", ru: "чистый", relation: root, id: czysty }
  - { pl: "brud", ru: "грязь", relation: antonym, id: brud }
etymology: "От CZYSTY «чистый», праславянское *čistъ, как русское «чистить». Польское Ś-Ć на месте русского СТ — обычное смягчение."
memory: "Czyścić — чистить: czyszczę buty. Картошку — obierać! Czyszczę — с SZCZ."
idioms:
  - { pl: "czyścić komuś konto", ru: "опустошать кому-то счёт" }
formExamplesSkip:
