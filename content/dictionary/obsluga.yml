etymology: "Приставка OB- и корень SŁUGA «слуга», из праславянского *sluga, откуда и русский «слуга». Приставка OB- несёт идею охвата со всех сторон, как в OBEJŚĆ «обойти», поэтому OBSŁUGA — это буквально «обслуживание кругом», полное попечение о чём-то. Русское «обслуживание» собрано из тех же частей и тем же способом, только с добавочным суффиксом, и значит то же. Разошлись языки лишь в коротком варианте: русская «обслуга» получила пренебрежительный оттенок, а польская OBSŁUGA осталась нейтральной и вытеснила более длинные формы."
memory: "Нейтральное слово, не «обслуга» по стилю: OBSŁUGA — это и обслуживание, и персонал. Читается «опсу́уга»: ob перед s даёт «оп», ł даёт «у». В предложном — w obsłudze, с g в dz. И instrukcja obsługi значит «инструкция по эксплуатации»."
idioms:
  - { pl: "obsługa klienta", ru: "обслуживание клиентов" }
  - { pl: "instrukcja obsługi", ru: "инструкция по эксплуатации" }
