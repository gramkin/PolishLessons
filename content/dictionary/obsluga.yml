notes:
  - { kind: false-friend, text: "Оттенок перевёрнут, как в случае PIGUŁKA и «пилюли». Русская «обслуга» — слово разговорное и слегка пренебрежительное, его не напишут в отчёте. Польское OBSŁUGA совершенно нейтрально: так называется и услуга, и персонал, и это слово стоит на вывесках, в договорах, в инструкциях. Русскому нейтральному «обслуживание» отвечает OBSŁUGA, а русскому «обслуге» — скорее SŁUŻBA или пренебрежительное SŁUŻBISTA. Так что переводить OBSŁUGA словом «обслуга» почти всегда неверно по стилю." }
  - { kind: usage, text: "Три употребления, и все частые. Первое — действие: OBSŁUGA KLIENTA, OBSŁUGA PRAWNA. Второе — люди: CAŁA OBSŁUGA DOSTAŁA PREMIĘ. Третье — работа с устройством: OBSŁUGA KOMPUTERA, INSTRUKCJA OBSŁUGI «инструкция по эксплуатации», и это сочетание стоит запомнить целиком, потому что русский тут скажет не «обслуживание», а «эксплуатация». Глагол — OBSŁUGIWAĆ: OBSŁUGIWAĆ KLIENTÓW, OBSŁUGIWAĆ MASZYNĘ." }
  - { kind: pronunciation, text: "Читается «опсу́уга», в три слога, с ударением на предпоследнем. Два места требуют внимания. Приставка OB перед глухим s оглушается, поэтому звучит «оп», а не «об». И ł даёт «у», а перед ним стоит гласная u, отсюда долгое «уу»: «опсу-у-га». В предложном падеже OBSŁUDZE — «опсу́удзе», где g переходит в dz перед окончанием -E, как NOGA даёт NODZE." }
  - { kind: government, text: "Чего — родительный падеж без предлога: OBSŁUGA KLIENTA, OBSŁUGA MASZYNY, INSTRUKCJA OBSŁUGI. На что жалуются — предлог NA с винительным: NARZEKAĆ NA OBSŁUGĘ. Где — предлог W с предложным: W OBSŁUDZE BRAKUJE LUDZI. Родительный множественного — OBSŁUG, без окончания. Чередование g в dz в предложном падеже обязательно: W OBSŁUDZE, и никак иначе — как NOGA даёт W NODZE, а DROGA даёт W DRODZE." }
