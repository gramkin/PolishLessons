# review
id: gra
format: 2
lemma: "gra"
rank: 387
pos: noun
pron: { cyr: "гра" }
senses:
  - id: game
    ru: "игра"
    examples:
      - pl: "Ta gra jest prosta."
        ru: "Эта игра простая."
        source: { kind: tatoeba, id: 3649651 }
      - pl: "To była wspaniała gra."
        ru: "Это была отличная игра."
        source: { kind: tatoeba, id: 13020793 }
      - pl: "Nie znam tej gry."
        ru: "Я не знаю эту игру."
        source: { kind: tatoeba, id: 3898941 }
  - id: videogame
    ru: "игра (настольная, компьютерная)"
    examples:
      - pl: "Tom jest bardzo dobry w grach wideo."
        ru: "Том очень хорош в видеоиграх."
        source: { kind: translated, id: 4817015 }
      - pl: "Kupiłem nową grę."
        ru: "Я купил новую игру."
        source: { kind: authored }
      - pl: "Gry planszowe są znowu modne."
        ru: "Настольные игры снова в моде."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Форма gra — это ещё и 3-е лицо глагола grać «играть». Ona gra na gitarze значит «Она играет на гитаре», а вовсе не «она игра»." }
  - { kind: false-friend, text: "Форма grom (дательный падеж множественного числа) совпадает с отдельным словом grom «гром»: Uderzył grom — «Ударил гром», к играм отношения не имеет." }
  - { kind: usage, text: "Родительный падеж множественного числа — gier, с беглым e: gra → gier, ровно как русское «игра → игр»." }
  - { kind: usage, text: "Слово gro в живой речи — не звательная форма от gra, а отдельное несклоняемое существительное: gro ludzi «большинство людей»." }
collocations:
  - { pl: "gra planszowa", ru: "настольная игра" }
  - { pl: "gra komputerowa", ru: "компьютерная игра" }
  - { pl: "koniec gry", ru: "конец игры" }
  - { pl: "wziąć udział w grze", ru: "принять участие в игре" }
etymology: "Праславянское *jьgra; русское «игра» — то же самое слово, просто поляки потеряли начальное и-."
memory: "gra — «игра», то же слово, что русское, только без начального и-. Но берегитесь двойников: gra это ещё и «играет» от grać, а grom — не только «играм», но и «гром»."
idioms:
  - { pl: "gra słów", ru: "игра слов" }
  - { pl: "brudna gra", ru: "грязная игра" }
  - { pl: "gra niewarta świeczki", ru: "игра не стоит свеч" }
  - { pl: "robić dobrą minę do złej gry", ru: "делать хорошую мину при плохой игре" }
