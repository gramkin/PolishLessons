# review
id: siedziec
format: 2
lemma: "siedzieć"
rank: 335
pos: verb
aspect: imperf
pron: { cyr: "ще́дзець" }
senses:
  - id: sit
    ru: "сидеть"
    examples:
      - pl: "On siedzi w fotelu."
        ru: "Он сидит в кресле."
        source: { kind: tatoeba, id: 8541108 }
      - pl: "Kot siedzi na krześle."
        ru: "Кошка сидит на стуле."
        source: { kind: tatoeba, id: 925917 }
      - pl: "Tom siedzi na krześle."
        ru: "Том сидит на стуле."
        source: { kind: tatoeba, id: 4756103 }
  - id: be-somewhere
    ru: "сидеть (находиться, торчать где-либо)"
    examples:
      - pl: "Pod stołem siedzi kot."
        ru: "Под столом сидит кот."
        source: { kind: tatoeba, id: 2202155 }
      - pl: "Na dachu siedzi gołąb."
        ru: "На крыше сидит голубь."
        source: { kind: tatoeba, id: 12005228 }
      - pl: "Ona siedzi na ławce."
        ru: "Она сидит на скамейке."
        source: { kind: tatoeba, id: 4716895 }
notes:
  - { kind: usage, text: "Спряжение: siedzę, siedzisz, siedzi, siedzimy, siedzicie, siedzą." }
  - { kind: usage, text: "Как и в русском, siedzieć w więzieniu значит «сидеть в тюрьме»; siedzieć w domu — «сидеть дома»." }
  - { kind: usage, text: "siedzenie — «сиденье»; miejsce siedzące — «сидячее место»." }
  - { kind: usage, text: "siedzieć cicho — «сидеть тихо, помалкивать»." }
collocations:
  - { pl: "siedzieć na krześle", ru: "сидеть на стуле" }
  - { pl: "siedzieć w domu", ru: "сидеть дома" }
  - { pl: "siedź cicho", ru: "сиди тихо" }
  - { pl: "miejsce siedzące", ru: "сидячее место" }
etymology: "Праславянское *sěděti — то же слово, что русское «сидеть»; отсюда же siedzenie «сиденье»."
memory: "siedzieć — «сидеть»: siedzę, siedzisz, siedzą. Как и в русском, siedzieć w więzieniu значит «сидеть в тюрьме», а siedzenie — «сиденье»."
idioms:
  - { pl: "siedzieć cicho", ru: "сидеть тихо" }
  - { pl: "miejsce siedzące", ru: "сидячее место" }
  - { pl: "podcinać gałąź, na której się siedzi", ru: "рубить сук, на котором сидишь" }
