        ru: "Это сказка для наивных."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Русская «байка» — это то же самое слово, и родство здесь прямое: оба от праславянского корня со значением «говорить, рассказывать», который в русском виден в «баять», «баюкать» и «обаянии». Но употребление разошлось. Польская BAJKA — прежде всего детская сказка, то, что читают перед сном. Русская «байка» осталась в разговорном смысле «небылица, побасёнка». Второй, разговорный смысл есть и у польского слова: OPOWIADAĆ BAJKI значит «рассказывать сказки», то есть врать, ровно как по-русски." }
  - { kind: usage, text: "Дательный и местный — BAJCE, с переходом k в c; родительный множественного — BAJEK, с беглым e. Пара эта у женских слов на -ka неразлучна и повторяется в каждом таком слове: kostce и kostek, działce и działek, szklance и szklanek, rozrywce и rozrywek. Проверять её отдельно уже не нужно, достаточно узнать окончание -ka." }
  - { kind: usage, text: "Польский различает два слова там, где русский обходится «сказкой». BAJKA — это сказка обиходная, детская, а также басня с моралью, вроде эзоповых. BAŚŃ — сказка литературная, книжная, та, что у Андерсена или в народных сборниках. Сказать baśń o smoku можно, но звучит это торжественно, как «предание». Для повседневного разговора берите bajka." }
collocations:
  - { pl: "bajka dla dzieci", ru: "сказка для детей" }
  - { pl: "opowiadać bajki", ru: "рассказывать сказки" }
