  - { pl: "bajkowy", ru: "сказочный", relation: derived }
etymology: "От BAJAĆ «рассказывать, баять», из праславянского *bajati — того же корня, что русские «баять», «баюкать», «обаяние» и «байка». Сказка есть то, что рассказывают. Русское «байка» — прямой родственник, сохранивший разговорный смысл побасёнки, тогда как польское слово ушло к детской сказке. Один корень, два возраста значения."
memory: "То же слово, что русская «байка», но значит «сказка». Местный bajce, родительный множественного bajek. А литературная сказка — baśń."
idioms:
