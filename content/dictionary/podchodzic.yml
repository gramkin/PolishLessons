        ru: "Они относятся к этому как к игре."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Пятьдесят две формы — несовершенный непереходный, и склад тот же, что у ODZYWAĆ SIĘ: сорок одна основная форма, десять форм действительного причастия и деепричастие PODCHODZĄC. Страдательных причастий нет, потому что глагол непереходный: подходят К чему-то, а не что-то. Безличное PODCHODZONO при этом возможно и в карточке есть. Для сравнения: совершенная пара PODEJŚĆ попадает в клетку с сорока двумя формами, как DOMYŚLIĆ SIĘ из прошлой партии." }
  - { kind: pronunciation, text: "Основа кончается мягким дз, и польское письмо пишет его двумя способами: dzi перед гласной — PODCHODZI, PODCHODZISZ, PODCHODZIŁ, — и dź на конце слова и перед согласным, откуда повелительное PODCHODŹ, PODCHODŹMY, PODCHODŹCIE. Та же картина, что в карточке PRZERAZIĆ, где один мягкий з писался тремя способами. Перед окончаниями -ę и -ą согласный твердеет в dz: PODCHODZĘ, PODCHODZĄ." }
  - { kind: usage, text: "Пара видов устроена неожиданно для глаза, но знакомо для слуха: PODCHODZIĆ в несовершенном и PODEJŚĆ в совершенном. Основы совсем разные — PODCHODZ- против PODEJD-: PODCHODZĘ, PODCHODZI против PODEJDĘ, PODEJDZIE. Русский делает то же самое и теми же корнями: «подходить, подхожу» против «подойти, подойду». То есть различие не польская причуда, а прямое соответствие, и запоминать пару надо целиком, как в русском." }
  - { kind: government, text: "В прямом значении — предлог DO с родительным: PODCHODZIĆ DO OKNA, DO STOŁU, DO DRZWI. Русский берёт здесь «к» с дательным, так что предлог и падеж меняются оба: DO OKNA против «к окну». Во втором значении предлог тот же: PODCHODZIĆ DO SPRAWY POWAŻNIE — «относиться к делу серьёзно», и существительное PODEJŚCIE значит «подход»: NOWE PODEJŚCIE DO PROBLEMU. А вот PODCHODZIĆ KOGOŚ в разговорной речи значит «подкатывать, обхаживать» и берёт винительный." }
collocations:
  - { pl: "podchodzić do okna", ru: "подходить к окну" }
  - { pl: "podchodzić poważnie", ru: "относиться серьёзно" }
  - { pl: "nowe podejście", ru: "новый подход" }
family:
  - { pl: "podejść", ru: "подойти", relation: aspect, id: podejsc }
  - { pl: "chodzić", ru: "ходить", relation: root, id: chodzic }
  - { pl: "podejście", ru: "подход", relation: derived }
etymology: "Приставка pod- и CHODZIĆ «ходить», из праславянского *choditi — то же слово, что русское «ходить». Соответствие полное по частям: pod- это «под-», -chodzić это «-ходить», и даже чередование основ в паре видов то же, что в русском. Из гнезда вышли PODEJŚCIE «подход», PRZECHODZIĆ «переходить», WYCHODZIĆ «выходить», DOCHÓD «доход», CHÓD «ходьба»."
memory: "pod- плюс chodzić: «подходить» часть за частью, и пара видов чередуется как в русском — podchodzę при podejdę, «подхожу» при «подойду». Но предлог другой: podchodzić DO okna, не «к окну»."
idioms:
