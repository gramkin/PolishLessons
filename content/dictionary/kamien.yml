        ru: "В этом кольце настоящий камень."
        source: { kind: authored }
  - id: deposit
    ru: "накипь, отложение: kamień nazębny «зубной камень», kamień nerkowy «камень в почке»"
    examples:
      - pl: "W czajniku osadził się kamień."
        ru: "В чайнике образовалась накипь."
        source: { kind: authored }
      - pl: "Dentysta usunął mi kamień nazębny."
        ru: "Стоматолог удалил мне зубной камень."
        source: { kind: authored }
      - pl: "Kamień nerkowy to bardzo bolesna sprawa."
        ru: "Камень в почке — очень болезненная вещь."
        source: { kind: authored }
  - id: figurative
    ru: "в переносных оборотах: serce z kamienia «каменное сердце»"
    examples:
      - pl: "Tom ma serce z kamienia."
        ru: "У Тома каменное сердце."
        source: { kind: translated, id: 2391311 }
      - pl: "Ona ma serce z kamienia!"
        ru: "У неё каменное сердце!"
        source: { kind: translated, id: 11260295 }
      - pl: "Przepadł jak kamień w wodę."
        ru: "Он исчез как камень в воду."
        source: { kind: tatoeba, id: 1085698 }
notes:
  - { kind: government, text: "rzucać kamieniem (творительный) значит «бросаться камнем» и подчёркивает способ, rzucić kamień (винительный) — «бросить камень». Творительный гораздо частотнее." }
  - { kind: usage, text: "Значений больше, чем кажется: камень на дороге, драгоценный камень, накипь в чайнике, камень в почке (kamień nerkowy) и зубной камень (kamień nazębny)." }
  - { kind: usage, text: "Оборот serce z kamienia «каменное сердце» строится с родительным падежом — в точности как русский." }
  - { kind: pronunciation, text: "Конечное ń звучит как «нь»: ка́мень. Во всех косвенных падежах появляется -ie-: kamienia, kamieniem, kamieniu." }
collocations:
  - { pl: "drogocenny kamień", ru: "драгоценный камень" }
  - { pl: "rzucać kamieniami", ru: "бросаться камнями" }
  - { pl: "serce z kamienia", ru: "каменное сердце" }
  - { pl: "kamień nerkowy", ru: "камень в почке" }
etymology: "Праславянское *kamy с родительным *kamene — отсюда чередование kamień/kamienia. Русское «камень» из той же основы, и русское «-мен-» в косвенных падежах повторяет польское -mien-."
memory: "kamień — «камень», и косвенные падежи вставляют -ie-: kamienia, kamieniem, kamieniu. Значений больше, чем кажется: драгоценный камень, накипь, камень в почке, зубной камень. При броске нужен творительный: rzucać kamieniami."
idioms:
  - { pl: "serce z kamienia", ru: "каменное сердце" }
  - { pl: "rzucać kamieniami", ru: "бросаться камнями" }
  - { pl: "kamień spadł mi z serca", ru: "камень с души свалился" }
  - { pl: "kamień węgielny", ru: "краеугольный камень" }
formExamplesSkip:
