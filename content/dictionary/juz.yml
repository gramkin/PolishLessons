etymology: "Сокращение старопольского juże; общеславянское слово, то же, что русское «уже»."
memory: "już = «уже», но в отрицании значение переворачивается: Już nie palę — «Я больше не курю», а не «я уже не курю» в смысле времени."
idioms:
