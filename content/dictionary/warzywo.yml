notes:
  - { kind: false-friend, text: "WARZYWO — «овощ», а польское OWOC — «фрукт, плод»! Русскому уху «овощи» и OWOCE созвучны, но это противоположности: WARZYWA I OWOCE, «овощи и фрукты». Слово WARZYWO — от WARZYĆ «варить»." }
  - { kind: usage, text: "Девять форм, средний род. Родительный множественного — WARZYW, без окончания. Чаще употребляется во множественном: WARZYWA." }
  - { kind: government, text: "Суп из овощей — ZUPA Z WARZYW, Z с родительным. Есть много овощей — JEŚĆ DUŻO WARZYW. Овощной магазин — WARZYWNIAK, разговорное." }
  - { kind: pronunciation, text: "Читается «важы́во», ударение на предпоследнем слоге. RZ — «ж», Y — «ы»." }
collocations:
  - { pl: "świeże warzywa", ru: "свежие овощи" }
  - { pl: "warzywa i owoce", ru: "овощи и фрукты" }
  - { pl: "zupa z warzyw", ru: "овощной суп" }
family:
  - { pl: "warzywny", ru: "овощной", relation: derived }
  - { pl: "warzywniak", ru: "овощной магазин (разг.)", relation: derived }
  - { pl: "warzywnik", ru: "огород", relation: derived }
etymology: "От WARZYĆ «варить»: овощ — то, что варят. Корень тот же, что в русских «варить», «варево»."
memory: "Warzywo — овощ (от warzyć «варить»); owoc — фрукт! Читается «важы́во». Warzywa i owoce — овощи и фрукты."
idioms:
  - { pl: "co za dużo, to niezdrowo", ru: "всё хорошо в меру" }
