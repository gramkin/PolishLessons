notes:
  - { kind: false-friend, text: "RECEPTA — только врачебный рецепт и переносный «рецепт успеха». Кулинарный рецепт по-польски — PRZEPIS: PRZEPIS NA PIEROGI. Попросить в гостях RECEPTĘ NA CIASTO — значит насмешить хозяйку." }
  - { kind: usage, text: "Девять живых форм, женский род. В местном и дательном T переходит в C: NA RECEPCIE. Звательный не даётся. В Польше рецепты электронные: E-RECEPTA приходит на телефон кодом." }
  - { kind: government, text: "По рецепту — NA RECEPTĘ, без рецепта — BEZ RECEPTY. Рецепт на лекарство — RECEPTA NA LEK, NA с винительным. Выписать рецепт — WYPISAĆ RECEPTĘ." }
  - { kind: pronunciation, text: "Читается «рэцэ́пта», ударение на предпоследнем слоге. RE и CE твёрдые: «рэ», «цэ»." }
collocations:
  - { pl: "lek na receptę", ru: "рецептурное лекарство" }
  - { pl: "wypisać receptę", ru: "выписать рецепт" }
  - { pl: "bez recepty", ru: "без рецепта" }
family:
  - { pl: "receptura", ru: "рецептура", relation: root }
  - { pl: "e-recepta", ru: "электронный рецепт", relation: derived }
  - { pl: "recepta lekarska", ru: "врачебный рецепт", relation: derived }
etymology: "Из латыни: врачебные предписания начинались словом RECIPE, «возьми». Русское «рецепт» — из того же источника, но расширилось и на кухню, а польское осталось у врача."
memory: "Recepta — рецепт врача; кулинарный рецепт — przepis. Читается «рэцэ́пта». Na receptę — по рецепту, bez recepty — без рецепта."
