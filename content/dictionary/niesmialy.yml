etymology: "От ŚMIEĆ «сметь, отваживаться» (не путать с ŚMIAĆ SIĘ, «смеяться»), общеславянского *sъměti, того же, что русское «сметь». ŚMIAŁY — «смелый», с отрицанием NIE- — «несмелый». Польское Ś на месте русского «с» перед мягкой гласной — постоянное соответствие: ŚMIAŁY и «смелый», ŚNIEG и «снег»."
memory: "Nieśmiały — застенчивый, робкий: nieśmiały chłopak, nieśmiały uśmiech. От śmiały — смелый. Читается «несьмя́уы»: ł даёт «у»."
idioms:
