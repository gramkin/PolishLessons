notes:
  - { kind: false-friend, text: "Русское «несмелый» есть, но звучит книжно; польское NIEŚMIAŁY — обычное слово для застенчивого человека, как русское «стеснительный». Его противоположность ŚMIAŁY значит «смелый», и пара полностью совпадает с русской: ŚMIAŁY — NIEŚMIAŁY, «смелый — несмелый». Только у поляков частотность обратная: NIEŚMIAŁY — бытовое слово, ŚMIAŁY — книжное." }
  - { kind: usage, text: "Сравнивается описательно: BARDZIEJ NIEŚMIAŁY, хотя встречается и NIEŚMIALSZY. Все одиннадцать форм живые. Форма для мужчин-людей NIEŚMIALI частая: NIEŚMIALI CHŁOPCY, NIEŚMIALI UCZNIOWIE. Обратите внимание на чередование: Ł в мужском единственном, L в мужском-личном множественном: NIEŚMIAŁY, но NIEŚMIALI." }
  - { kind: government, text: "Застенчивый с кем-то — NIEŚMIAŁY WOBEC KOGOŚ, WOBEC с родительным, или W TOWARZYSTWIE, «в компании». Падежа само прилагательное не требует. Застенчиво — NIEŚMIAŁO, наречие." }
  - { kind: pronunciation, text: "Читается «несьмя́уы», четыре слога, ударение на предпоследнем. ŚMIA даёт «сьмя», Ł — «у», конечная Y — «ы»: «-я́уы». В форме NIEŚMIALI Ł сменяется на L, и выходит «несьмя́ли»." }
  - { kind: register, text: "Нейтральное слово с мягким, сочувственным оттенком. Застенчивость не осуждают: NIEŚMIAŁY CHŁOPAK — скорее милый, чем жалкий. Более сильное, книжное слово — WSTYDLIWY, «стыдливый»." }
