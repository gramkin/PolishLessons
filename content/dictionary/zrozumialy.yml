# review
id: zrozumialy
format: 2
lemma: "zrozumiały"
rank: 4684
pos: adj
pron: { cyr: "зрозумя́уы" }
senses:
  - id: clear
    ru: "понятный, ясный"
    examples:
      - pl: "Instrukcja jest krótka i zrozumiała."
        ru: "Инструкция короткая и понятная."
        source: { kind: authored }
      - pl: "Mówił zrozumiałym językiem."
        ru: "Он говорил понятным языком."
        source: { kind: authored }
      - pl: "Wyjaśnij to w bardziej zrozumiały sposób."
        ru: "Объясни это более понятно."
        source: { kind: authored }
  - id: understandable
    ru: "понятный, объяснимый (о чувстве, реакции)"
    examples:
      - pl: "Jego złość jest zrozumiała."
        ru: "Его злость понятна."
        source: { kind: authored }
      - pl: "To zrozumiałe, że się boisz."
        ru: "Понятно, что ты боишься."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ZROZUMIAŁY — «понятный», и русскому «разумный» он не равен: разумный — ROZSĄDNY. TO ZROZUMIAŁE — «это понятно, естественно», а не «это разумно». Русское «понятно!» в ответ — ROZUMIEM или JASNE, не ZROZUMIAŁE. Корень тот же, что в ROZUMIEĆ, «понимать»." }
  - { kind: usage, text: "Степени живые: ZROZUMIALSZY, NAJZROZUMIALSZY — Ł перед -SZY переходит в L. Формы для мужчин-людей ZROZUMIALI и производные в карточку не включены: о людях так не говорят. Безличное TO ZROZUMIAŁE, ŻE — «понятно, что»." }
  - { kind: government, text: "Для кого понятно — DLA с родительным: ZROZUMIAŁY DLA DZIECI, «понятный детям». Русский дательный тут не работает: не ZROZUMIAŁY DZIECIOM. Сам по себе — ZROZUMIAŁY SAM PRZEZ SIĘ, «само собой разумеющийся»." }
  - { kind: pronunciation, text: "Читается «зрозумя́уы», четыре слога, ударение на предпоследнем. IA после M — «мя», Ł — короткое «у». Сравнительная ZROZUMIALSZY — «зрозумя́льшы», с мягким «ль»." }
  - { kind: register, text: "Нейтральное слово, обычное в речи о текстах и инструкциях. ZROZUMIAŁE SAMO PRZEZ SIĘ — «само собой разумеется», книжнее. В быту про текст чаще говорят JASNY или PROSTY." }
collocations:
  - { pl: "zrozumiały język", ru: "понятный язык" }
  - { pl: "zrozumiały dla wszystkich", ru: "понятный всем" }
  - { pl: "to zrozumiałe", ru: "это понятно, естественно" }
family:
  - { pl: "rozumieć", ru: "понимать", relation: root, id: rozumiec }
  - { pl: "zrozumieć", ru: "понять", relation: root, id: zrozumiec }
  - { pl: "niezrozumiały", ru: "непонятный", relation: derived }
etymology: "От ZROZUMIEĆ «понять», от ROZUM «разум, ум». Суффикс -ŁY — старое причастие прошедшего времени, как в DOJRZAŁY, «зрелый», от DOJRZEĆ. Буквально «понятый»."
memory: "Zrozumiały — понятный. Zrozumiały dla dzieci — понятный детям, с dla. To zrozumiałe — это понятно, естественно. Zrozumialszy — понятнее. Читается «зрозумя́уы»."
idioms:
  - { pl: "zrozumiałe samo przez się", ru: "само собой разумеющееся" }
formExamplesSkip:
  - { form: "zrozumiali", reason: "форма для мужчин-людей: людей «понятными» не называют" }
  - { form: "zrozumialsi", reason: "форма для мужчин-людей: людей «понятными» не называют" }
  - { form: "najzrozumialsi", reason: "форма для мужчин-людей: людей «понятными» не называют" }
