# review
id: wydobyc
format: 2
lemma: "wydobyć"
rank: 2376
pos: verb
aspect: perf
pron: { cyr: "выдо́быць" }
senses:
  - id: extract
    ru: "извлечь, достать"
    examples:
      - pl: "Wpadł mi owad do oka, nie mogę go wydobyć."
        ru: "Мне в глаз попало насекомое, я не могу его достать."
        source: { kind: translated, id: 711186 }
      - pl: "Wskutek paskudnego przeziębienia śpiewak nie mógł wydobyć głosu."
        ru: "Из-за сильной простуды певец не мог издать ни звука."
        source: { kind: translated, id: 510059 }
      - pl: "Wydobyli rannego spod gruzów."
        ru: "Они извлекли раненого из-под обломков."
        source: { kind: authored }
  - id: mine
    ru: "добывать (полезные ископаемые); добыча"
    examples:
      - pl: "Wydobycie drewna jest zabronione."
        ru: "Добыча древесины запрещена."
        source: { kind: translated, id: 13011470 }
      - pl: "W tej kopalni wydobyto węgiel."
        ru: "На этой шахте добыли уголь."
        source: { kind: authored }
notes:
  - { kind: government, text: "Винительный падеж; откуда — z + родительный: wydobyć z kieszeni «достать из кармана»." }
  - { kind: false-friend, text: "wy- + dobyć «добыть», корень тот же, что в русском «добыть», «добыча». Значения совпадают близко." }
  - { kind: usage, text: "Wydobyć głos «издать звук, выговорить» — устойчивый оборот, обычно с отрицанием: nie mógł wydobyć głosu." }
  - { kind: usage, text: "Отглагольное wydobycie значит «добыча» как процесс: wydobycie węgla. Несовершенный вид — wydobywać." }
collocations:
  - { pl: "wydobyć z kieszeni", ru: "достать из кармана" }
  - { pl: "wydobyć głos", ru: "издать звук" }
etymology: "wy- + dobyć «добыть»; русские «добыть», «добыча» — тот же корень."
memory: "wydobyć — «извлечь, достать» и «добыть» ископаемое. Запомните nie mógł wydobyć głosu «не мог издать ни звука». Несовершенный вид — wydobywać."
idioms:
  - { pl: "wydobyć głos", ru: "издать звук" }
