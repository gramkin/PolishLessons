# review
id: podniesc
format: 2
lemma: "podnieść"
rank: 1177
pos: verb
aspect: perf
pron: { cyr: "по́днесьць" }
senses:
  - id: lift
    ru: "поднять"
    examples:
      - pl: "Podnieś rękę."
        ru: "Подними руку."
        source: { kind: translated, id: 456953 }
      - pl: "Nie jestem w stanie podnieść tego kamienia."
        ru: "Я не в состоянии поднять этот камень."
        source: { kind: tatoeba, id: 998713 }
      - pl: "Jim podniósł rękę."
        ru: "Джим поднял руку."
        source: { kind: translated, id: 457413 }
  - id: raise
    ru: "поднять (цены, голос, настроение)"
    examples:
      - pl: "Ona podniosła głos."
        ru: "Она повысила голос."
        source: { kind: translated, id: 6441425 }
      - pl: "Dobre wiadomości podniosły go na duchu."
        ru: "Хорошие новости подняли ему настроение."
        source: { kind: translated, id: 983382 }
  - id: get-up
    ru: "podnieść się — подняться, встать"
    examples:
      - pl: "On podniósł się z krzesła."
        ru: "Он встал со стула."
        source: { kind: tatoeba, id: 2247268 }
      - pl: "Do końca życia się z tego nie podniesie."
        ru: "Он не оправится от этого до конца своей жизни."
        source: { kind: tatoeba, id: 351346 }
notes:
  - { kind: usage, text: "Форма podniosł оставлена без примеров: по-польски мужской род прошедшего времени пишется через ó — podniósł. Женский и средний род идут без диакритики: podniosła, podniosło, podniosłam." }
  - { kind: government, text: "podnieść coś — винительный падеж без предлога, как русское «поднять что-то»." }
  - { kind: usage, text: "Совершенный вид; несовершенный — podnosić. С się глагол значит «подняться, встать»: Podniósł się z krzesła." }
  - { kind: usage, text: "Переносно — «повысить»: podnieść ceny «поднять цены», podnieść głos «повысить голос», podnieść na duchu «поднять настроение, ободрить»." }
  - { kind: usage, text: "Отглагольное podniesienie значит «поднятие, повышение»: podniesienie jakości «повышение качества»." }
collocations:
  - { pl: "podnieść rękę", ru: "поднять руку" }
  - { pl: "podnieść głos", ru: "повысить голос" }
  - { pl: "podnieść na duchu", ru: "ободрить" }
  - { pl: "podnieść się", ru: "подняться" }
family:
  - { pl: "podnosić", ru: "поднимать (несовершенный вид)", relation: aspect }
  - { pl: "nieść", ru: "нести", relation: root }
  - { pl: "podniesienie", ru: "поднятие, повышение", relation: derived }
etymology: "Приставка pod- плюс nieść «нести» — буквально «под-нести». Русское «поднять» собрано от «ять, взять», но результат тот же."
memory: "podnieść — «поднять», совершенный вид к podnosić. С się значит «подняться, встать». Переносно — «повысить»: podnieść ceny, podnieść głos, podnieść na duchu «ободрить»."
idioms:
  - { pl: "podnieść rękę", ru: "поднять руку" }
  - { pl: "podnieść na duchu", ru: "ободрить" }
