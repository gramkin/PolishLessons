# review
id: stawiac
format: 2
lemma: "stawiać"
rank: 1464
pos: verb
aspect: imperf
aspectPair: postawic
pron: { cyr: "ста́вяць" }
senses:
  - id: place
    ru: "ставить, помещать"
    examples:
      - pl: "Nie stawiaj szklanki przy krawędzi stołu."
        ru: "Не ставь стакан у края стола."
        source: { kind: translated, id: 393086 }
      - pl: "Uważaj gdzie stawiasz nogi."
        ru: "Смотри, куда ставишь ноги."
        source: { kind: translated, id: 9560579 }
  - id: treat
    ru: "угощать, платить за других"
    examples:
      - pl: "Ja stawiam."
        ru: "Я угощаю."
        source: { kind: translated, id: 568110 }
      - pl: "Kolację ja stawiam."
        ru: "Ужин с меня."
        source: { kind: translated, id: 364784 }
  - id: face-up
    ru: "stawiać czoła — противостоять; делать ставку"
    examples:
      - pl: "Stawiaj czoła życiu z uśmiechem!"
        ru: "Встречай жизнь с улыбкой!"
        source: { kind: translated, id: 526797 }
      - pl: "Odważnie stawiał czoła przeciwnościom."
        ru: "Он отважно противостоял невзгодам."
        source: { kind: translated, id: 759139 }
notes:
  - { kind: register, text: "Ja stawiam! — «Я угощаю!», обычная фраза в кафе и баре. У русского «ставить» это значение есть только в разговорном жаргоне, у польского оно нейтральное." }
  - { kind: usage, text: "Несовершенный вид к postawić." }
  - { kind: government, text: "stawiać czoła czemuś — «противостоять чему-то», с дательным: stawiać czoła problemom. Буквально «подставлять лоб»." }
  - { kind: usage, text: "Ещё одно значение — «делать ставку»: stawiać na kogoś «ставить на кого-то», stawiać wszystko na jedną kartę." }
collocations:
  - { pl: "ja stawiam", ru: "я угощаю" }
  - { pl: "stawiać czoła", ru: "противостоять" }
  - { pl: "stawiać pytania", ru: "задавать вопросы" }
etymology: "Многократная основа от stawić, в основе stać «стоять» (праславянское *stati). Русское «ставить» — то же самое слово."
memory: "stawiać — «ставить», слово то же самое. Но два значения русскому неочевидны: Ja stawiam! значит «Я угощаю!», а stawiać czoła czemuś — «противостоять чему-то», буквально «подставлять лоб»."
idioms:
  - { pl: "ja stawiam", ru: "я угощаю" }
  - { pl: "stawiać czoła", ru: "противостоять" }
  - { pl: "stawiać wszystko na jedną kartę", ru: "ставить всё на одну карту" }
