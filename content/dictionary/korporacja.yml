etymology: "Из латинского слова со значением «объединение, сообщество», от слова «тело». Русская «корпорация» — то же слово."
memory: "Korporacja — корпорация; korpo — офисная жизнь (разг.). Читается «корпора́цья». Pracuję w korpo — работаю в офисе крупной фирмы."
