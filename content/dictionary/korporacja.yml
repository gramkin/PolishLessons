notes:
  - { kind: false-friend, text: "KORPORACJA — «корпорация», крупная, часто международная фирма. В разговоре сокращают до KORPO: PRACUJĘ W KORPO, «я работаю в офисе крупной компании», обычно с иронией. Офисный работник — KORPOSZCZUR, «офисная крыса»." }
  - { kind: usage, text: "Восемь живых форм, женский род на -CJA. Родительный, дательный и местный — KORPORACJI. Архаичная форма KORPORACYJ и звательный не даются." }
  - { kind: government, text: "Работать в корпорации — PRACOWAĆ W KORPORACJI, местный. Уйти из корпорации — ODEJŚĆ Z KORPORACJI." }
  - { kind: pronunciation, text: "Читается «корпора́цья», ударение на предпоследнем слоге. CJA — «цья»." }
collocations:
  - { pl: "międzynarodowa korporacja", ru: "международная корпорация" }
  - { pl: "pracować w korporacji", ru: "работать в корпорации" }
  - { pl: "kultura korporacyjna", ru: "корпоративная культура" }
family:
