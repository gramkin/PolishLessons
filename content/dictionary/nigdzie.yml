# review
id: nigdzie
format: 2
lemma: "nigdzie"
rank: 950
pos: adv
pron: { cyr: "ни́гдзе" }
senses:
  - id: nowhere
    ru: "нигде, никуда"
    note: "Требует второго отрицания при глаголе, как и в русском."
    examples:
      - pl: "Dziś Tom nigdzie nie idzie."
        ru: "Сегодня Том никуда не идёт."
        source: { kind: tatoeba, id: 10797342 }
      - pl: "Szukałam wszędzie. Ich nigdzie nie było."
        ru: "Я везде искала. Их нигде не было."
        source: { kind: tatoeba, id: 10768429 }
      - pl: "Nigdzie mi nie spieszno."
        ru: "Мне некуда спешить."
        source: { kind: translated, id: 973204 }
  - id: short
    ru: "Nigdzie. — Никуда. (как краткий ответ)"
    examples:
      - pl: "Nigdzie."
        ru: "Никуда."
        source: { kind: translated, id: 12940166 }
      - pl: "Nigdzie go nie ma."
        ru: "Его нигде нет."
        source: { kind: authored }
      - pl: "Nigdzie nie idę."
        ru: "Я никуда не иду."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Как и в русском, отрицание двойное: nigdzie nie ma «нигде нет», nigdzie nie idę «никуда не иду». Пропустить nie нельзя — предложение станет неграмотным." }
  - { kind: usage, text: "Слово покрывает сразу и «нигде», и «никуда»: Nigdzie nie idę «Я никуда не иду», Nigdzie go nie ma «Его нигде нет». Направление и место не различаются." }
  - { kind: usage, text: "Ряд отрицательных наречий строится одинаково: nigdzie «нигде», nigdy «никогда», nijak «никак». Все требуют второго nie." }
  - { kind: usage, text: "Само по себе Nigdzie. работает кратким ответом на вопрос Dokąd idziesz? — «Никуда»." }
collocations:
  - { pl: "nigdzie nie ma", ru: "нигде нет" }
  - { pl: "nigdzie nie idę", ru: "никуда не иду" }
  - { pl: "nigdzie indziej", ru: "нигде больше" }
  - { pl: "nigdy", ru: "никогда" }
family:
  - { pl: "gdzie", ru: "где", relation: root, id: gdzie }
  - { pl: "nigdy", ru: "никогда", relation: root }
etymology: "Из ni- + gdzie «где», ровно как русское «нигде» из «ни» и «где». Отрицательная частица одна и та же во всех славянских."
memory: "nigdzie — «нигде» и «никуда» разом: направление и место оно не различает. Отрицание, как и в русском, двойное: Nigdzie nie idę. Пропустить nie нельзя. В один ряд с ним встают nigdy «никогда» и nijak «никак»."
idioms:
