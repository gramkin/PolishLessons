pos: noun
pron: { cyr: "коля́но" }
senses:
  - id: knee
    ru: "колено"
    examples:
      - pl: "Kolano mnie boli."
        ru: "У меня болит колено."
        source: { kind: translated, id: 3682695 }
      - pl: "Moje kolano krwawi."
        ru: "У меня кровоточит колено."
