  - id: on-knees
    ru: "на коленях, на колени"
    examples:
      - pl: "Na kolana!"
        ru: "На колени!"
        source: { kind: translated, id: 3552125 }
      - pl: "Dziecko spało na kolanach matki."
        ru: "Ребёнок спал на коленях матери."
        source: { kind: translated, id: 362848 }
      - pl: "Trzymała ręce na kolanach."
        ru: "Она держала руки на коленях."
        source: { kind: translated, id: 908201 }
  - id: up-to-knees
    ru: "по колено, до колен"
    examples:
      - pl: "Ziri była po kolana w wodzie."
        ru: "Зири была по колено в воде."
        source: { kind: translated, id: 13073439 }
      - pl: "Sukienka sięga mi do kolan."
        ru: "Платье достаёт мне до колен."
        source: { kind: translated, id: 8178663 }
notes:
  - { kind: usage, text: "na kolanach значит и «на коленях» (сидя), и «на коленях» (в мольбе); na kolana! — «на колени!»." }
  - { kind: usage, text: "po kolana — «по колено»: woda po kolana «вода по колено». Русская конструкция совпадает." }
  - { kind: usage, text: "Существительное среднего рода: множественное kolana, родительный множественного — kolan, без окончания." }
  - { kind: usage, text: "Переносно: kolano rzeki «колено реки» (крутой изгиб) и kolano rury «колено трубы» — та же метафора, что в русском." }
collocations:
  - { pl: "na kolanach", ru: "на коленях" }
  - { pl: "po kolana", ru: "по колено" }
  - { pl: "boli mnie kolano", ru: "у меня болит колено" }
etymology: "Праславянское *kolěno — то же слово, что русское «колено», вплоть до переносных значений («колено реки», «колено трубы»). Совпадение полное."
memory: "kolano = «колено», и слово совпадает с русским даже в переносных значениях: kolano rzeki «колено реки», kolano rury «колено трубы». Запомните na kolanach «на коленях» и po kolana «по колено»."
idioms:
