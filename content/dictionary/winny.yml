# review
id: winny
format: 2
lemma: "winny"
rank: 884
pos: adj
pron: { cyr: "ви́нны" }
senses:
  - id: guilty
    ru: "виновный, виноватый"
    examples:
      - pl: "Kto jest winny?"
        ru: "Кто виноват?"
        source: { kind: tatoeba, id: 4748442 }
      - pl: "Jesteś tak samo winna jak on."
        ru: "Ты так же виновата, как и он."
        source: { kind: tatoeba, id: 12470532 }
      - pl: "Tom został uznany za winnego."
        ru: "Тома признали виновным."
        source: { kind: translated, id: 3857371 }
  - id: owing
    ru: "winien komuś coś — должен кому-л. что-л. (о долге)"
    note: "Второе значение: не вина, а денежный долг."
    examples:
      - pl: "Jestem winny ci dziesięć dolarów."
        ru: "Я должен тебе десять долларов."
        source: { kind: tatoeba, id: 591634 }
      - pl: "Tom jest winny Mary trzydzieści dolarów."
        ru: "Том должен Мэри тридцать долларов."
        source: { kind: tatoeba, id: 8108547 }
      - pl: "Ile jestem winien?"
        ru: "Сколько я должен?"
        source: { kind: translated, id: 8454443 }
  - id: found-guilty
    ru: "uznać za winnego — признать виновным"
    examples:
      - pl: "Słyszałem że uznali ją za winną."
        ru: "Я слышал, её признали виновной."
        source: { kind: tatoeba, id: 12501747 }
      - pl: "Ogłosili go winnym."
        ru: "Его объявили виновным."
        source: { kind: translated, id: 944237 }
      - pl: "Został uznany winnym morderstwa."
        ru: "Его признали виновным в убийстве."
        source: { kind: translated, id: 1635581 }
notes:
  - { kind: false-friend, text: "У слова два значения, и второе неожиданное: winny значит не только «виновный», но и «должный» о деньгах. Jestem winny ci dziesięć dolarów — «Я должен тебе десять долларов», никакой вины тут нет. Различает контекст." }
  - { kind: usage, text: "В мужском роде живёт особая краткая форма winien: Ile jestem winien? «Сколько я должен?», On nie jest niczemu winien «Он ни в чём не виноват». Полная форма winny тоже возможна, но краткая звучит естественнее." }
  - { kind: government, text: "uznać kogoś za winnego «признать кого-то виновным» — винительный после za; być winnym czegoś «быть виновным в чём-то» — родительный." }
  - { kind: usage, text: "Существительное — wina «вина», глагол zawinić «провиниться». Есть и омоним от wino «вино»: winny krzew «виноградная лоза», winnica «виноградник», но в живой речи он почти не встречается." }
collocations:
  - { pl: "kto jest winny?", ru: "кто виноват?" }
  - { pl: "uznać za winnego", ru: "признать виновным" }
  - { pl: "ile jestem winien?", ru: "сколько я должен?" }
  - { pl: "czuć się winnym", ru: "чувствовать себя виноватым" }
family:
  - { pl: "wina", ru: "вина", relation: root, id: wina }
  - { pl: "zawinić", ru: "провиниться", relation: derived }
  - { pl: "niewinny", ru: "невиновный", relation: antonym }
etymology: "От wina «вина», праславянское *vina. Русское «вина» и «виновный» — те же слова. Омоним от wino «вино» (winnica «виноградник») существует отдельно."
memory: "winny — «виновный», но и «должный» о деньгах: Jestem winny ci dziesięć dolarów «Я должен тебе десять долларов». В мужском роде живёт краткая форма winien: Ile jestem winien? Существительное — wina, отрицание — niewinny."
idioms:
