        ru: "Температура упала."
        source: { kind: translated, id: 8908711 }
  - id: snow-rain
    ru: "о снеге и дожде: выпасть, пойти"
    examples:
      - pl: "Dzisiaj spadł pierwszy śnieg."
        ru: "Сегодня выпал первый снег."
        source: { kind: tatoeba, id: 4418130 }
      - pl: "Wkrótce spadnie deszcz."
        ru: "Скоро пойдёт дождь."
        source: { kind: translated, id: 8213724 }
      - pl: "Spadło dużo śniegu."
        ru: "Выпало много снега."
        source: { kind: translated, id: 6999999 }
notes:
  - { kind: usage, text: "Формы spasę, spasą, spasł, spasła, spasło, spasły, spaśli, spaś и spasłszy принадлежат не этому глаголу, а spaść «откормить» (совершенный вид к spasać): spasł bydło «откормил скот». У spaść «упасть» прошедшее время идёт на spad-: spadł, spadła, spadli." }
  - { kind: usage, text: "Инфинитив только spaść. Форма spadnąć — разговорная, образованная задним числом от основы будущего spadn- (spadnę, spadniesz), и в норме не употребляется, поэтому оставлена без примеров. Безличное spadnięto тоже практически не встречается." }
  - { kind: government, text: "spaść z czegoś «упасть с чего-то» — предлог z с родительным: spadł z konia, spadła z drabiny." }
  - { kind: usage, text: "О ценах, температуре и продажах значит «упасть, понизиться»: Ceny spadły «Цены упали»." }
  - { kind: usage, text: "О снеге и дожде: Spadł pierwszy śnieg «Выпал первый снег», Spadnie deszcz «Пойдёт дождь»." }
  - { kind: usage, text: "Вид совершенный; несовершенный — spadać, карточка уже есть. Формы будущего берут основу spadn-: spadnie, spadną." }
collocations:
  - { pl: "spaść z konia", ru: "упасть с лошади" }
  - { pl: "ceny spadły", ru: "цены упали" }
  - { pl: "spadł śnieg", ru: "выпал снег" }
etymology: "Приставка s- и paść «пасть», из праславянского *pasti. Русское «спасть» и «упасть» — то же гнездо."
memory: "spaść — «упасть», совершенный вид от spadać. Управление: spaść z czegoś (родительный). О ценах значит «упасть»: Ceny spadły. О снеге — «выпасть». Будущее берёт основу spadn-: spadnie, spadną."
idioms:
