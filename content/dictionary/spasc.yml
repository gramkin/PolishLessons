  - id: drop
    ru: "о ценах, температуре: упасть, понизиться"
    examples:
      - pl: "Ceny spadły."
        ru: "Цены упали."
        source: { kind: tatoeba, id: 3611494 }
      - pl: "Wczoraj temperatura spadła do minus pięciu stopni Celsjusza."
