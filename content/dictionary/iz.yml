# review
id: iz
format: 2
lemma: "iż"
rank: 1504
pos: conj
pron: { cyr: "иж" }
senses:
  - id: that
    ru: "что (книжный вариант союза że)"
    examples:
      - pl: "Przed piętnastym wiekiem wierzono, iż Ziemia jest centrum wszechświata."
        ru: "До пятнадцатого века считалось, что Земля - центр Вселенной."
        source: { kind: tatoeba, id: 3154584 }
      - pl: "Ona powiedziała, iż myśli, że ja kłamię."
        ru: "Она сказала, что думает, будто я лгу."
        source: { kind: translated, id: 12451356 }
      - pl: "Tom powiedział, że myślał, iż Maria jest mężatką."
        ru: "Том сказал, что думал, что Мария замужем."
        source: { kind: translated, id: 13412471 }
  - id: although
    ru: "в обороте mimo iż — несмотря на то что"
    examples:
      - pl: "Maria będzie pracować, mimo iż jest chora."
        ru: "Мария будет работать, несмотря на то что больна."
        source: { kind: translated, id: 7727890 }
      - pl: "Mimo, iż jedziemy do Francji, to nie potrzebujemy wizy."
        ru: "Несмотря на то что мы едем во Францию, виза нам не нужна."
        source: { kind: translated, id: 5186362 }
notes:
  - { kind: register, text: "Книжный вариант союза że «что». Значение ровно то же, но iż звучит официально или литературно и в разговорной речи почти не встречается." }
  - { kind: usage, text: "Главная живая причина выбрать iż — не ставить два że подряд: Tom powiedział, że myślał, iż Maria jest mężatką." }
  - { kind: usage, text: "mimo iż — «несмотря на то что», книжный вариант оборота mimo że." }
  - { kind: usage, text: "Запятая, как и при że, ставится перед союзом, а не после него." }
collocations:
  - { pl: "mimo iż", ru: "несмотря на то что" }
  - { pl: "pomimo iż", ru: "несмотря на то что" }
  - { pl: "z uwagi na to, iż", ru: "ввиду того что" }
etymology: "Сложение союза i «и» с усилительной частицей -ż, той же, что в że и też. Русское «что» устроено иначе, поэтому опоры на родство нет."
memory: "iż — это книжное że «что», значение ровно то же. Главная причина его выбрать — не ставить два że подряд: powiedział, że myślał, iż… В разговоре говорите że."
idioms:
