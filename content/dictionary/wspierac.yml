# review
id: wspierac
format: 2
lemma: "wspierać"
rank: 2256
pos: verb
pron: { cyr: "фспє́раць" }
senses:
  - id: support-financially
    ru: "поддерживать (материально)"
    examples:
      - pl: "Fundacja wspiera młodych artystów."
        ru: "Фонд поддерживает молодых художников."
        source: { kind: authored }
      - pl: "Rodzice wspierali go przez całe studia."
        ru: "Родители поддерживали его всю учёбу."
        source: { kind: authored }
  - id: back-morally
    ru: "поддерживать (морально), быть за"
    examples:
      - pl: "Wspieram cię, cokolwiek wybierzesz."
        ru: "Я поддерживаю тебя, что бы ты ни выбрал."
        source: { kind: authored }
      - pl: "Wspierali się nawzajem w trudnych latach."
        ru: "Они поддерживали друг друга в трудные годы."
        source: { kind: authored }
  - id: support-noun
    ru: "поддержка, содействие (отглаг.)"
    examples:
      - pl: "Wspieranie nauki wymaga pieniędzy."
        ru: "Поддержка науки требует денег."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ДВА ЯЗЫКА ВЗЯЛИ ДЛЯ ПОДДЕРЖКИ РАЗНЫЕ ОБРАЗЫ. Польское wspierać буквально значит «подпирать»: корень тот же, что в podpora «опора», opierać się «опираться» и русских «опора», «подпирать», «упор». Русское «поддерживать» собрано из «под» и «держать», то есть из образа держания. Смысл один, картинка разная, и потому слова не похожи." }
  - { kind: usage, text: "Существительное — WSPARCIE «поддержка», и оно уже не похоже на инфинитив: wsparcie finansowe, udzielić wsparcia. Возвратное WSPIERAĆ SIĘ NA CZYMŚ значит «опираться на что-то»: wspierał się na lasce. Управление прямое, как по-русски: wspierać KOGOŚ, винительный падеж." }
  - { kind: usage, text: "Вид несовершенный: есть WSPIERAJĄC и причастие WSPIERAJĄCY, формы на -wszy нет. Совершенная пара меняет основу до неузнаваемости — WESPRZEĆ: wesprę, wesprze, wsparł, wsparty. Так же ведут себя zawierać и zawrzeć, и такие пары надо запоминать целиком." }
collocations:
  - { pl: "wspierać finansowo", ru: "поддерживать материально" }
  - { pl: "wsparcie finansowe", ru: "финансовая поддержка" }
  - { pl: "wspierać się na lasce", ru: "опираться на палку" }
family:
  - { pl: "wesprzeć", ru: "поддержать (сов.)", relation: aspect, id: wesprzec }
  - { pl: "wsparcie", ru: "поддержка", relation: derived, id: wsparcie }
  - { pl: "podpora", ru: "опора", relation: root }
etymology: "Приставка w- плюс s- и корень pier-, из праславянского *perti «пирать, подпирать» — того же, что в русских «опора», «подпирать», «упор» и «запор». Поддержка понималась как подпорка. Отсюда wsparcie, podpora, opierać się и zapora «плотина»."
memory: "wspierać — «поддерживать», но буквально «подпирать»: корень тот же, что в «опоре». Русское «поддерживать» идёт от «держать», отсюда и непохожесть. Существительное wsparcie, а совершенная пара — wesprzeć, с другой основой."
idioms:
  - { pl: "wsparcie finansowe", ru: "финансовая поддержка" }
  - { pl: "wspierać kogoś na duchu", ru: "поддерживать кого-л. морально" }
