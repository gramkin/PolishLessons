        ru: "Омерзительные льстецы окружали его всегда."
        source: { kind: authored }
notes:
  - { kind: usage, text: "СУФФИКС -LIWY ОТВЕЧАЕТ РУССКОМУ -ЛИВЫЙ и означает склонность: kłamliwy «лживый», płaczliwy «плаксивый», wątpliwy «сомнительный». И в сравнительной степени он никуда не девается: OBRZYDLIWSZY, суффикс плюс -szy. Сравни с однокоренным brzydki, который -k- как раз выбрасывает: brzydszy. Один корень, два разных поведения." }
  - { kind: false-friend, text: "Разница с brzydki — в силе, а не в оттенке. BRZYDKI это «некрасивый», про внешность: brzydki dom. OBRZYDLIWY это «отвратительный», про отвращение: obrzydliwy smak. Наречие obrzydliwie умеет ещё и усиливать: obrzydliwie bogaty — «отвратительно богат», в точности как по-русски." }
  - { kind: pronunciation, text: "Четыре слога, ударение на предпоследнем: o-brzy-DLI-wy. Rz после b звучит как ж, y как ы: «обжыдлі́вы». В превосходной степени ударение смещается: naj-o-brzy-DLIW-szy." }
collocations:
  - { pl: "obrzydliwy smak", ru: "отвратительный вкус" }
  - { pl: "obrzydliwie bogaty", ru: "отвратительно богатый" }
  - { pl: "obrzydliwe zachowanie", ru: "мерзкое поведение" }
family:
  - { pl: "brzydki", ru: "некрасивый", relation: root }
  - { pl: "obrzydzenie", ru: "отвращение", relation: derived }
  - { pl: "wspaniały", ru: "прекрасный", relation: antonym, id: wspanialy }
etymology: "От obrzydzić «вызвать отвращение», от того же корня brzyd-, что в brzydki, из праславянского *bridъkъ «острый, едкий». Суффикс -liwy образует прилагательные склонности и отвечает русскому -ливый. Отсюда obrzydzenie «отвращение» и obrzydliwie «отвратительно»."
memory: "obrzydliwy — «отвратительный», сильнее, чем brzydki «некрасивый». Суффикс -liwy равен русскому -ливый, и в сравнительной он сохраняется: obrzydliwszy. А brzydki своё -k- теряет: brzydszy."
idioms:
  - { pl: "obrzydliwie bogaty", ru: "отвратительно богатый" }
  - { pl: "obrzydliwy typ", ru: "мерзкий тип" }
