notes:
  - { kind: pronunciation, text: "Родительный множественного — WYDARZEŃ, с мягким ń и без окончания. Так устроены все существительные на -enie: pragnienie — pragnień, zdanie — zdań, życzenie — życzeń. Мягкость не появляется в этой форме, а просто обнажается: она была в основе всё время, и исчезновение окончания её показывает." }
  - { kind: usage, text: "Слово построено от WYDARZYĆ SIĘ «случиться», а тот — от DARZYĆ «одарять», того же корня, что русское «дарить». Событие по-польски есть нечто выпавшее на долю. Русский назвал его иначе, через «со-бытие», совместное бытие, но тот же образ у нас всё-таки есть: «день выдался хороший» — это ровно польская логика." }
collocations:
  - { pl: "ważne wydarzenie", ru: "важное событие" }
  - { pl: "bieg wydarzeń", ru: "ход событий" }
  - { pl: "wydarzenia polityczne", ru: "политические события" }
family:
  - { pl: "wydarzyć się", ru: "случиться", relation: root }
  - { pl: "zdarzenie", ru: "происшествие", relation: root }
  - { pl: "darzyć", ru: "одарять", relation: root }
etymology: "Отглагольное существительное от WYDARZYĆ SIĘ, в основе которого лежит DARZYĆ «одарять, наделять», из праславянского *dariti — то же слово, что русское «дарить». Событие, таким образом, это то, что выпало, досталось. Русское «событие» собрано из «со» и «бытия», по другой мысли, но наше «выдалось» идёт ровно польским путём."
memory: "Родительный множественного без окончания и с мягким ń: wydarzeń, как pragnień. А корень тот же, что в «дарить»: событие — это то, что выдалось."
idioms:
