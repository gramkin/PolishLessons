notes:
  - { kind: false-friend, text: "Один из самых безопасных случаев: ORGANIZM это «организм», и совпадение полное. Работает здесь общее правило, которое стоит запомнить раз и навсегда: польское -IZM и русское -ИЗМ — один и тот же суффикс в заимствованиях, и переходят друг в друга без исключений. ORGANIZM и «организм», MECHANIZM и «механизм», KAPITALIZM и «капитализм», OPTYMIZM и «оптимизм». Поэтому любое слово на -ИЗМ можно смело переносить в польский, заменив окончание. Разница только в написании основы там, где русский удваивает согласную, а польский нет, и в чтении Y как «ы»." }
  - { kind: usage, text: "Местный падеж единственного числа — ORGANIZMIE, и здесь никакого чередования в основе не происходит: M просто смягчается перед -IE. Это стоит сопоставить с соседями по той же позиции, где основа меняется: APARTAMENT даёт APARTAMENCIE с переходом T в C, AUTOSTRADA даёт AUTOSTRADZIE с переходом D в DZ. Иначе говоря, окончание -IE одно и то же, а что случится с основой, решает её последний согласный: заднеязычные и зубные чередуются, губные только смягчаются. Родительный единственного — ORGANIZMU на -U, родительный множественного — ORGANIZMÓW." }
  - { kind: government, text: "Мужской род, неодушевлённое. Чей организм — родительный: ORGANIZM CZŁOWIEKA, ORGANIZM DZIECKA. «В организме» — W с местным: W ORGANIZMIE. «В организм» о попадании — DO с родительным: DO ORGANIZMU DOSTAJE SIĘ PRZEZ SKÓRĘ. Частотные сочетания: ODPORNOŚĆ ORGANIZMU «иммунитет организма», OSŁABIONY ORGANIZM «ослабленный организм», ORGANIZMY ŻYWE «живые организмы», ORGANIZMY MODYFIKOWANE GENETYCZNIE «генетически модифицированные организмы». Прилагательное ORGANICZNY значит «органический», а ORGANIZACYJNY — «организационный», и это разные слова." }
  - { kind: pronunciation, text: "Читается «орга́низм», три слога, ударение на предпоследнем, то есть на GA. Начальное O произносится полно, как «о». Буква G всегда твёрдая, «г», и никогда не читается как «ж» или «дж». Конечное сочетание -ZM выговаривается без вставной гласной, двумя согласными подряд: «изм», ровно как по-русски. В местном падеже ORGANIZMIE сочетание MIE даёт мягкое «ме»: «органи́зме», четыре слога, и ударение переходит на предпоследний." }
