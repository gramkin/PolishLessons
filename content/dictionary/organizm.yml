etymology: "Из позднелатинского ORGANISMUS, построенного на греческом ΌΡΓΑΝΟΝ «орудие, инструмент, орган», от ΈΡΓΟΝ «дело, работа». Исходный образ — слаженное устройство, в котором части работают как инструменты одного целого. Слово вошло в европейские языки в восемнадцатом веке вместе с биологией как наукой, и оба наших языка взяли его из одного источника и в одно время, поэтому различий между ORGANIZM и «организмом» не осталось никаких, кроме чтения Y там, где он встречается в родственных словах. Суффикс -IZM, из греческого -ΙΣΜΌΣ, в обоих языках стал самым продуктивным способом называть учения, системы и устройства, и соответствие -IZM и -ИЗМ не знает исключений. Из того же греческого корня идут ORGAN «орган», ORGANIZACJA «организация», ORGANICZNY «органический» и ENERGIA, где ΈΡΓΟΝ видно прямо."
memory: "Полное совпадение с русским, и за ним общее правило: -izm всегда равно -изм, без исключений — organizm, mechanizm, kapitalizm, optymizm. Местный падеж organizmie: губное m только смягчается, основа не меняется — в отличие от apartamencie (t→c) и autostradzie (d→dz). Что случится с основой перед -ie, решает её последний согласный. Не путать organiczny «органический» и organizacyjny «организационный»."
