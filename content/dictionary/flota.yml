notes:
  - { kind: false-friend, text: "РОД РАСХОДИТСЯ, И ЭТО ГЛАВНОЕ. Польская FLOTA женского рода: ta flota, cała flota, а русский «флот» мужского. Потому и формы женские: we flocie, flotą. Слово пришло через французское flotte, тоже женское, а русский взял его через голландское vloot." }
  - { kind: usage, text: "Дательный и предложный — WE FLOCIE, с переходом t→c: służyć we flocie. Предлог тут we, а не w, потому что следом идёт группа согласных fl. Второе значение, которого в русском нет напрямую: flota означает ещё и автопарк фирмы — flota samochodowa." }
  - { kind: pronunciation, text: "Два слога, ударение на первом: FLO-ta. Все звуки твёрдые и ясные: «фло́та». В форме flocie слышно мягкое «фло́це»." }
collocations:
  - { pl: "flota wojenna", ru: "военный флот" }
  - { pl: "we flocie", ru: "во флоте" }
  - { pl: "flota samochodowa", ru: "автопарк" }
family:
  - { pl: "statek", ru: "судно, корабль", relation: root, id: statek }
  - { pl: "marynarka", ru: "флот; пиджак", relation: root, id: marynarka }
  - { pl: "port", ru: "порт", relation: root }
etymology: "Через французское flotte и итальянское flotta из древнескандинавского flota «плавучее», от корня со значением «плыть». Русский «флот» пришёл при Петре через голландское vloot, поэтому мужского рода. Корень родствен английскому float и немецкому Flotte."
memory: "flota — «флот», но женского рода: ta flota. Предложный — WE FLOCIE, с t→c и предлогом we перед группой fl. И помни второе значение: flota это ещё и автопарк фирмы."
