# review
id: prawnik
format: 2
lemma: "prawnik"
rank: 874
pos: noun
pron: { cyr: "пра́вник" }
senses:
  - id: lawyer
    ru: "юрист, адвокат"
    examples:
      - pl: "Potrzebujesz prawnika."
        ru: "Тебе нужен адвокат."
        source: { kind: tatoeba, id: 2801370 }
      - pl: "Nie potrzebuję prawnika."
        ru: "Мне не нужен адвокат."
        source: { kind: translated, id: 6157969 }
      - pl: "Czy potrzebuję prawnika?"
        ru: "Мне нужен адвокат?"
        source: { kind: translated, id: 8707563 }
  - id: profession
    ru: "jest prawnikiem — он юрист (творительный после być)"
    examples:
      - pl: "Myślę, że nie jest prawnikiem."
        ru: "Думаю, что он не адвокат."
        source: { kind: tatoeba, id: 2146389 }
      - pl: "On nie jest politykiem a prawnikiem."
        ru: "Он не политик, а юрист."
        source: { kind: tatoeba, id: 593181 }
      - pl: "Będę prawnikiem."
        ru: "Я буду юристом."
        source: { kind: translated, id: 5204595 }
  - id: plural
    ru: "prawnicy — юристы"
    examples:
      - pl: "Firmowi prawnicy pracują na okrągło, żeby dopiąć fuzję."
        ru: "Юристы фирмы работают круглосуточно, чтобы завершить слияние."
        source: { kind: translated, id: 363793 }
      - pl: "Prawnicy, jako specjaliści w dziedzinie prawa, chronią praw ludzi."
        ru: "Юристы как специалисты в области права защищают права людей."
        source: { kind: translated, id: 13573535 }
      - pl: "Miał trzech synów, którzy zostali prawnikami."
        ru: "У него было три сына, которые стали юристами."
        source: { kind: translated, id: 2289918 }
notes:
  - { kind: usage, text: "prawnik — это юрист вообще, человек с юридическим образованием. Адвокат, выступающий в суде, — adwokat, а юрисконсульт — radca prawny." }
  - { kind: government, text: "После być и zostać — творительный падеж: jest prawnikiem «он юрист», zostali prawnikami «они стали юристами»." }
  - { kind: usage, text: "Множественное число мужского лица — prawnicy (не prawniki): Firmowi prawnicy pracują na okrągło." }
  - { kind: usage, text: "Слово прозрачно разбирается: prawo «право» + -nik, ровно как русское «право» → «правовед»." }
collocations:
  - { pl: "potrzebuję prawnika", ru: "мне нужен адвокат" }
  - { pl: "zostać prawnikiem", ru: "стать юристом" }
  - { pl: "dobry prawnik", ru: "хороший юрист" }
  - { pl: "radca prawny", ru: "юрисконсульт" }
family:
  - { pl: "prawo", ru: "право", relation: root, id: prawo }
  - { pl: "prawny", ru: "правовой", relation: derived }
  - { pl: "prawniczy", ru: "юридический", relation: derived }
etymology: "Из prawo «право» и суффикса -nik — буквально «человек права». Русское «право» того же корня, так что слово разбирается без труда."
memory: "prawnik — юрист вообще, человек с юридическим образованием. Адвокат в суде — adwokat, юрисконсульт — radca prawny. Множественное число мужского лица — prawnicy, а после być всегда творительный: jest prawnikiem."
idioms:
  - { pl: "potrzebuję prawnika", ru: "мне нужен адвокат" }
  - { pl: "zostać prawnikiem", ru: "стать юристом" }
  - { pl: "radca prawny", ru: "юрисконсульт" }
