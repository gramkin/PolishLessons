id: brzmiec
format: 2
lemma: "brzmieć"
rank: 415
pos: verb
aspect: imperf
pron: { cyr: "бжмець" }
senses:
  - id: sound
    ru: "звучать"
    examples:
      - pl: "Brzmi nienaturalnie."
        ru: "Это звучит неестественно."
        source: { kind: tatoeba, id: 12696329 }
      - pl: "To brzmi prawie jak groźba."
        ru: "Это звучит почти как угроза."
        source: { kind: tatoeba, id: 8668464 }
      - pl: "Gitara elektryczna nie brzmi tak samo jak gitara akustyczna."
        ru: "Электрогитара звучит не так, как акустическая."
        source: { kind: tatoeba, id: 524384 }
  - id: sound-like
    ru: "звучать как, производить впечатление"
    examples:
      - pl: "Człowiek - to brzmi dumnie!"
        ru: "Человек — это звучит гордо!"
        source: { kind: tatoeba, id: 3655789 }
      - pl: "Jeśli to brzmi zbyt dobrze, żeby to mogła być prawda, prawdopodobnie to nieprawda."
        ru: "Если это звучит слишком хорошо, чтобы быть правдой, вероятно, это неправда."
        source: { kind: tatoeba, id: 4716823 }
      - pl: "Brzmisz jak Tom."
        ru: "Ты говоришь как Том."
        source: { kind: translated, id: 3032431 }
notes:
  - { kind: usage, text: "Главная конструкция — brzmieć jak «звучать как»: Brzmisz jak Tom «Ты говоришь как Том», To brzmi jak groźba «Это звучит как угроза»." }
  - { kind: usage, text: "О человеке brzmieć значит «производить впечатление голосом»: Nie brzmiałaś, jakbyś żartowała «Не похоже было, что ты шутишь»." }
  - { kind: usage, text: "Существительное brzmienie — «звучание, звук»: Lubię brzmienie pianina «Я люблю звучание фортепиано»." }
  - { kind: false-friend, text: "Родня русскому «бренчать» и польскому brzęczeć «жужжать», но переводить надо именно «звучать»: brzmi dobrze «звучит хорошо»." }
collocations:
  - { pl: "brzmi dobrze", ru: "звучит хорошо" }
  - { pl: "brzmieć jak", ru: "звучать как" }
  - { pl: "brzmienie", ru: "звучание" }
  - { pl: "brzmi znajomo", ru: "звучит знакомо" }
etymology: "Праславянское *brьněti «звенеть, гудеть»; отсюда же польское brzęczeć «жужжать», а в русском — «бренчать»."
memory: "brzmieć — «звучать», родня русскому «бренчать» и польскому brzęczeć «жужжать». Главная конструкция — brzmieć jak: Brzmisz jak Tom. А существительное brzmienie значит «звучание»."
idioms:
  - { pl: "Człowiek — to brzmi dumnie!", ru: "Человек — это звучит гордо!" }
  - { pl: "brzmi znajomo", ru: "звучит знакомо" }
  - { pl: "brzmi zbyt dobrze, żeby było prawdziwe", ru: "звучит слишком хорошо, чтобы быть правдой" }
