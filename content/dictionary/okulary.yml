# review
id: okulary
format: 2
lemma: "okulary"
rank: 1992
pos: noun
pron: { cyr: "окуля́ры" }
senses:
  - id: glasses
    ru: "очки"
    examples:
      - pl: "On nosi okulary."
        ru: "Он носит очки."
        source: { kind: tatoeba, id: 351350 }
      - pl: "Gdzie są moje okulary?"
        ru: "Где мои очки?"
        source: { kind: tatoeba, id: 348997 }
      - pl: "Zdjął okulary."
        ru: "Он снял очки."
        source: { kind: translated, id: 357706 }
      - pl: "Zgubiłem okulary."
        ru: "Я потерял очки."
        source: { kind: translated, id: 360040 }
      - pl: "Przynieś mi moje okulary."
        ru: "Принеси мне мои очки."
        source: { kind: tatoeba, id: 659097 }
      - pl: "Okulary upadły ci na podłogę."
        ru: "Ваши очки упали на пол."
        source: { kind: tatoeba, id: 1361836 }
  - id: need-glasses
    ru: "без очков, нужны очки"
    examples:
      - pl: "Nie mogę czytać bez okularów."
        ru: "Я не могу читать без очков."
        source: { kind: tatoeba, id: 2143144 }
      - pl: "Potrzebuje okularów."
        ru: "Ему нужны очки."
        source: { kind: tatoeba, id: 6320848 }
      - pl: "Nie noszę już okularów."
        ru: "Я больше не ношу очки."
        source: { kind: tatoeba, id: 351914 }
notes:
  - { kind: usage, text: "Слово только множественного числа, как и русские «очки»: nosić okulary «носить очки», bez okularów «без очков». Единственного числа okular в этом значении нет." }
  - { kind: usage, text: "okulary przeciwsłoneczne — «солнцезащитные очки», буквально «противосолнечные»." }
  - { kind: usage, text: "Идиома patrzeć przez różowe okulary значит «смотреть сквозь розовые очки», ровно как по-русски." }
collocations:
  - { pl: "nosić okulary", ru: "носить очки" }
  - { pl: "bez okularów", ru: "без очков" }
  - { pl: "okulary przeciwsłoneczne", ru: "солнцезащитные очки" }
etymology: "От okular «окуляр», из латинского oculus «глаз». Русское «окуляр» — то же заимствование, но русские «очки» образованы от «око», а польское слово от латинского корня."
memory: "okulary — «очки», только во множественном числе, как и по-русски. Nosić okulary «носить очки», bez okularów «без очков»."
idioms:
  - { pl: "nosić okulary", ru: "носить очки" }
  - { pl: "okulary przeciwsłoneczne", ru: "солнцезащитные очки" }
  - { pl: "patrzeć przez różowe okulary", ru: "смотреть сквозь розовые очки" }
formExamplesSkip:
