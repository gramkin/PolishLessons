# review
id: wspomnienie
format: 2
lemma: "wspomnienie"
rank: 2248
pos: noun
pron: { cyr: "фспомне́не" }
senses:
  - id: memory
    ru: "воспоминание"
    examples:
      - pl: "Zostało mi po nim tylko wspomnienie."
        ru: "От него у меня осталось только воспоминание."
        source: { kind: authored }
      - pl: "To wspomnienie wraca co roku."
        ru: "Это воспоминание возвращается каждый год."
        source: { kind: authored }
  - id: memoirs
    ru: "wspomnienia — воспоминания, мемуары"
    examples:
      - pl: "Wydał wspomnienia z wojny."
        ru: "Он издал воспоминания о войне."
        source: { kind: authored }
      - pl: "Jej wspomnienia czyta się jak powieść."
        ru: "Её воспоминания читаются как роман."
        source: { kind: authored }
  - id: mention
    ru: "упоминание"
    examples:
      - pl: "Na samo wspomnienie o nim bladła."
        ru: "При одном упоминании о нём она бледнела."
        source: { kind: authored }
notes:
  - { kind: usage, text: "СУФФИКС -ENIE ОТВЕЧАЕТ РУССКОМУ -ЕНИЕ, И РАЗБОР СОВПАДАЕТ ПОМОРФЕМНО. Wspomnienie собрано из ws- плюс pomn- плюс -enie, а «воспоминание» — из вос- плюс помин- плюс -ание. Один корень, одна приставка, один суффикс. Так же читаются mieszkanie, spotkanie, zebranie, zakończenie — целый класс отглагольных существительных среднего рода." }
  - { kind: pronunciation, text: "Четыре слога, ударение на предпоследнем: wspo-mnie-NIE — точнее, wspom-NIE-nie. Начальная группа wsp звучит как «фсп», потому что w перед глухим оглушается: «фспомне́не». Ni читается как мягкое нь." }
  - { kind: false-friend, text: "Опереться на русский можно почти полностью, но одно значение шире: wspomnienie значит и «упоминание». Na wspomnienie o wojnie milkł — «при упоминании о войне он умолкал». Русское «воспоминание» так не употребляется, там нужно «упоминание»." }
  - { kind: register, text: "Нейтрально во всех регистрах. Множественное wspomnienia в заглавиях книг значит «воспоминания, мемуары»; в разговоре — просто «воспоминания». Глагольная пара: wspominać «вспоминать, упоминать» и wspomnieć «вспомнить, упомянуть»." }
collocations:
  - { pl: "miłe wspomnienie", ru: "приятное воспоминание" }
  - { pl: "na wspomnienie o czymś", ru: "при упоминании о чём-л." }
  - { pl: "wspomnienia z dzieciństwa", ru: "воспоминания детства" }
family:
  - { pl: "wspomnieć", ru: "вспомнить, упомянуть", relation: root, id: wspomniec }
  - { pl: "wspominać", ru: "вспоминать", relation: aspect, id: wspominac }
  - { pl: "pamięć", ru: "память", relation: derived, id: pamiec }
etymology: "От wspomnieć, из приставки ws- и корня pomn-, того же, что в pamięć «память» и в русских «помнить», «воспоминание», «поминать». Суффикс -enie равен русскому -ение. Слово разбирается на части, которые все до одной узнаваемы. Отсюда wspominać, upamiętnić, pamiątka «сувенир, памятная вещь»."
memory: "wspomnienie — «воспоминание», и собирается оно из тех же частей, что русское слово: ws- плюс pomn- плюс -enie. Суффикс -enie всегда равен русскому -ение. Одно отличие: польское слово значит ещё и «упоминание»."
idioms:
