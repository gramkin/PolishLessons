notes:
  - { kind: false-friend, text: "Ключевое расхождение с русским: польская нумерация этажей сдвинута на единицу. Русский первый этаж — это parter, а pierwsze piętro — уже второй. Поэтому Moje mieszkanie jest na drugim piętrze переводится как «Моя квартира на третьем этаже»." }
  - { kind: usage, text: "Средний род: piętro, piętra, na piętrze. Родительный множественного — pięter, с чередованием: dwadzieścia pięter." }
  - { kind: usage, text: "piętro niżej «этажом ниже» и piętro wyżej «этажом выше» — наречные обороты без предлога." }
  - { kind: usage, text: "Слово значит не только этаж здания, но и ярус вообще: piętro lasu «ярус леса»." }
collocations:
  - { pl: "na piętrze", ru: "на этаже" }
  - { pl: "pierwsze piętro", ru: "второй этаж" }
  - { pl: "piętro niżej", ru: "этажом ниже" }
etymology: "Слово исконно славянское, от корня со значением «настил, помост». Русское «этаж» — французское заимствование, так что опоры на родство здесь нет."
memory: "piętro — «этаж», но счёт другой: русский первый этаж это parter, а pierwsze piętro — уже второй. Mieszkam na drugim piętrze значит «Я живу на третьем этаже». Предложный — na piętrze, родительный множественного — pięter."
idioms:
