# review
id: kazdy
format: 2
lemma: "każdy"
rank: 121
pos: adj
pron: { cyr: "ка́жды" }
senses:
  - id: every
    ru: "каждый (без исключения)"
    examples:
      - pl: "Każdy ma swoje wady."
        ru: "У каждого есть свои недостатки."
        source: { kind: tatoeba, id: 357286 }
      - pl: "Każdego ranka golę się."
        ru: "Я бреюсь каждое утро."
        source: { kind: tatoeba, id: 3786689 }
      - pl: "Słabnę z każdym dniem."
        ru: "Я слабею с каждым днём."
        source: { kind: tatoeba, id: 12696348 }
  - id: any
    ru: "любой, всякий (какой угодно)"
    examples:
      - pl: "Każdy to może zrobić."
        ru: "Это любой может сделать."
        source: { kind: tatoeba, id: 1913840 }
      - pl: "Każdy może się pomylić."
        ru: "Каждый может ошибиться."
        source: { kind: tatoeba, id: 6109675 }
      - pl: "Każdy decyduje za siebie."
        ru: "Каждый решает для себя сам."
        source: { kind: tatoeba, id: 1794051 }
notes:
  - { kind: usage, text: "każdy склоняется как прилагательное: każdego, każdemu, każdą. Во множественном числе почти не встречается — «все» передаётся словом wszyscy." }
  - { kind: usage, text: "Русскому «все знают» отвечает Każdy wie — в польском здесь единственное число." }
collocations:
  - { pl: "każdego dnia", ru: "каждый день" }
  - { pl: "w każdym razie", ru: "во всяком случае" }
  - { pl: "każdy z nas", ru: "каждый из нас" }
  - { pl: "za każdym razem", ru: "каждый раз" }
etymology: "Праславянское *kъžьdo; то же слово, что русское «каждый»."
memory: "Склоняется как прилагательное (każdego, każdemu, każdą) и стоит в единственном числе: Każdy wie = «Все знают». Множественное każdych бывает только при словах вроде drzwi, wybory."
idioms:
  - { pl: "w każdym calu", ru: "до кончиков ногтей, во всех отношениях" }
  - { pl: "w każdym razie", ru: "во всяком случае" }
  - { pl: "każdy ma swojego mola, co go gryzie", ru: "у каждого свои заботы" }
formExamplesSkip:
  - { form: "każden", reason: "устаревший разговорный вариант, в современном языке не употребляется" }
  - { form: "każdzi", reason: "форма из морфологического словаря, в живой речи не существует" }
  - { form: "każdymi", reason: "творительный множественного встречается только при pluralia tantum и звучит искусственно" }
