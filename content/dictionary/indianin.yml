etymology: "От названия Индии: Колумб считал, что достиг Индии, и назвал местных жителей индейцами, а языки Европы повторили ошибку каждый на свой лад. Польский образовал INDIANIN суффиксом -ANIN, тем же, что в MIESZCZANIN и PARYŻANIN, из праславянского *-janinъ — и русский построил «россиянина» и «горожанина» тем же суффиксом, с тем же усечением во множественном числе. Для жителя Индии польский взял отдельное слово HINDUS, из персидского HINDU через западноевропейское посредство, и тем развёл два понятия, которые Колумб смешал. Русский развёл их иначе, суффиксами: «индеец» и «индиец», отличающиеся одной гласной, что делает русскую пару труднее на слух, а польскую — труднее для запоминания."
memory: "Индеец, а индиец — Hindus; прилагательные indiański и indyjski различаются одной буквой. Склонение по типу -anin, и суффикс усекается во множественном: Indianin, но Indianie и Indian — ровно как русское «россиянин», «россияне», «россиян». Названия народов в польском пишутся с большой буквы, в отличие от русского, а прилагательные от них — со строчной."
