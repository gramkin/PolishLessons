notes:
  - { kind: false-friend, text: "Русский различает «индейца» и «индийца», и польский различает их тоже, но другими словами, и перепутать их очень легко. INDIANIN это американский индеец. Индиец, житель Индии, по-польски HINDUS. Поэтому HINDUS Z BOMBAJU это «индиец из Бомбея», а INDIANIN Z ARIZONY — «индеец из Аризоны». Слово INDYJSKI значит «индийский», а INDIAŃSKI — «индейский», и разница в одной букве несёт весь смысл. Добавим, что HINDUS в польском означает жителя Индии независимо от религии, тогда как русское «хинду» относится к вероисповеданию, — ещё один повод не переводить его как «хинду»." }
  - { kind: government, text: "Мужской род, одушевлённое, лицо, и склонение идёт по типу на -ANIN, где суффикс ведёт себя по-разному в двух числах. В единственном он сохраняется целиком: INDIANIN, INDIANINA, INDIANINOWI, INDIANINEM, INDIANINIE. Во множественном он усечён: INDIANIE в именительном, INDIAN в родительном, INDIANOM, INDIANAMI, INDIANACH. Русскому этот тип знаком до буквы по слову «россиянин»: «россиянин», но «россияне» и «россиян», с тем же усечением. Винительный равен родительному: WIDZIELI INDIANINA. Пишется слово с большой буквы, как все названия народов в польском." }
  - { kind: pronunciation, text: "Читается «индя́нин», ударение на предпоследнем слоге из трёх. Сочетание DIA даёт «дя» с мягким д. В родительном INDIANINA слогов становится четыре и ударение переходит на предпоследний: «индяни́на». В именительном множественного INDIANIE три слога: «индя́не». В родительном множественного INDIAN два слога и ударение на первом: «и́ндян». Так усечение суффикса меняет и место ударения, и это стоит проговорить вслух по формам." }
  - { kind: usage, text: "Названия народов в польском пишутся с большой буквы: INDIANIN, ROSJANIN, POLAK, NIEMIEC — в этом польский расходится с русским, где «индеец» и «россиянин» строчные. Прилагательные от них, напротив, строчные: INDIAŃSKI, ROSYJSKI, POLSKI. Частотные сочетания: INDIANIN Z PLEMIENIA CZEJENÓW, REZERWAT INDIAŃSKI «индейская резервация», JĘZYKI INDIAŃSKIE. Женская форма INDIANKA. Суффикс -ANIN даёт целый ряд названий по месту и происхождению: MIESZCZANIN «горожанин», WIEŚNIAK по другой модели, PARYŻANIN «парижанин», и все ведут себя одинаково." }
