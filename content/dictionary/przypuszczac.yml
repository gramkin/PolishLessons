# review
id: przypuszczac
format: 2
lemma: "przypuszczać"
rank: 1654
pos: verb
aspect: imperf
pron: { cyr: "пшыпу́шчаць" }
senses:
  - id: suppose
    ru: "предполагать, полагать"
    examples:
      - pl: "Tak przypuszczam."
        ru: "Так я и предполагаю."
        source: { kind: translated, id: 10578474 }
      - pl: "Przypuszczam, że on przyjdzie."
        ru: "Предполагаю, что он придёт."
        source: { kind: translated, id: 2342425 }
      - pl: "Przypuszczam, że jesteś głodny."
        ru: "Предполагаю, что ты голоден."
        source: { kind: translated, id: 547738 }
  - id: never-supposed
    ru: "предполагать (в отрицании — «не думал, что…»)"
    examples:
      - pl: "Nikt tego nie przypuszczał."
        ru: "Никто этого не предполагал."
        source: { kind: translated, id: 8493032 }
      - pl: "Nie przypuszczałem, że to jest ważne."
        ru: "Я не предполагал, что это важно."
        source: { kind: translated, id: 2299579 }
      - pl: "Nigdy nie przypuszczałem, że tak skończymy."
        ru: "Я никогда не предполагал, что мы так кончим."
        source: { kind: translated, id: 967024 }
notes:
  - { kind: usage, text: "Przypuszczam, że… — «Полагаю, что…», самая частая форма; вводит осторожное предположение без уверенности." }
  - { kind: usage, text: "Совершенный вид — przypuścić; существительное przypuszczenie значит «предположение»." }
  - { kind: usage, text: "От этого же корня грамматический термин tryb przypuszczający — «условное наклонение»." }
  - { kind: usage, text: "Деепричастие przypuszczając значит «предполагая»: przypuszczając najgorsze «предполагая худшее»." }
collocations:
  - { pl: "przypuszczam, że", ru: "полагаю, что" }
  - { pl: "nigdy nie przypuszczałem", ru: "я никогда не предполагал" }
  - { pl: "tryb przypuszczający", ru: "условное наклонение" }
etymology: "Приставка przy- + puszczać «пускать», праславянское *pustiti. Русское «предполагать» построено иначе («класть перед»), но польское слово буквально значит «допускать мысль»."
memory: "przypuszczać = «предполагать, полагать». Главная формула — Przypuszczam, że… «Полагаю, что…». Совершенный вид — przypuścić, существительное — przypuszczenie «предположение»."
idioms:
