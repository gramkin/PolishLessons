formExamples:
  - form: "przypuszcza"
    pl: "Policja przypuszcza, że mógł napaść na bank."
    ru: "Полиция предполагает, что он мог напасть на банк."
    source: { kind: translated, id: 349256 }
  - form: "przypuszcza"
    pl: "Nikt nie przypuszcza najgorszego."
    ru: "Никто не предполагает худшего."
    source: { kind: authored }
  - form: "przypuszcza"
    pl: "Lekarz przypuszcza, że to alergia."
    ru: "Врач предполагает, что это аллергия."
    source: { kind: authored }
  - form: "przypuszczając"
    pl: "Przypuszczając najgorsze, wezwał pomoc."
    ru: "Предполагая худшее, он вызвал помощь."
    source: { kind: authored }
  - form: "przypuszczając"
    pl: "Milczał, przypuszczając, że to żart."
    ru: "Он молчал, предполагая, что это шутка."
    source: { kind: authored }
  - form: "przypuszczając"
    pl: "Wyszła wcześniej, przypuszczając korki."
    ru: "Она вышла раньше, предполагая пробки."
    source: { kind: authored }
  - form: "przypuszczał"
    pl: "Nikt tego nie przypuszczał."
    ru: "Никто этого не предполагал."
    source: { kind: translated, id: 8493032 }
  - form: "przypuszczał"
    pl: "Tom nie przypuszczał, że Mary pójdzie bez niego."
    ru: "Том не предполагал, что Мэри пойдёт без него."
    source: { kind: translated, id: 12040863 }
  - form: "przypuszczał"
    pl: "Tom nie przypuszczał, że Mary będzie tak śliczna."
    ru: "Том не предполагал, что Мэри будет такой красивой."
    source: { kind: translated, id: 9686854 }
  - form: "przypuszczała"
    pl: "To było trudniejsze, niż bym przypuszczała."
    ru: "Это было труднее, чем я предполагала."
    source: { kind: translated, id: 3754148 }
  - form: "przypuszczała"
    pl: "Nie przypuszczała, że to potrwa tak długo."
    ru: "Она не предполагала, что это продлится так долго."
    source: { kind: authored }
  - form: "przypuszczała"
    pl: "Przypuszczała, że wrócimy wcześniej."
    ru: "Она предполагала, что мы вернёмся раньше."
    source: { kind: authored }
  - form: "przypuszczałam"
    pl: "Tom nie jest taki, jak przypuszczałam."
    ru: "Том не такой, как я предполагала."
    source: { kind: translated, id: 3887829 }
  - form: "przypuszczałam"
    pl: "Nie przypuszczałam, że będzie tak pusto."
    ru: "Я не предполагала, что будет так пусто."
