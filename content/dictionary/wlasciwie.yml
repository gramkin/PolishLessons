# review
id: wlasciwie
format: 2
lemma: "właściwie"
rank: 410
pos: adv
pron: { cyr: "вуасьци́ве" }
senses:
  - id: actually
    ru: "собственно, вообще-то, на самом деле"
    examples:
      - pl: "U nas właściwie nic nowego."
        ru: "У нас вроде ничего нового."
        source: { kind: tatoeba, id: 12470145 }
      - pl: "Zmysły to właściwie tylko sygnały chemiczne przetwarzane przez mózg."
        ru: "Чувства на самом деле являются просто химическими сигналами, обрабатываемыми мозгом."
        source: { kind: tatoeba, id: 6327892 }
      - pl: "Co właściwie chcesz powiedzieć?"
        ru: "Что ты, собственно, хочешь сказать?"
        source: { kind: authored }
  - id: properly
    ru: "правильно, надлежащим образом"
    examples:
      - pl: "Myślę, że działał właściwie."
        ru: "Я думаю, он действовал правильно."
        source: { kind: tatoeba, id: 13200103 }
      - pl: "Zrobiłeś to właściwie."
        ru: "Ты сделал это правильно."
        source: { kind: authored }
      - pl: "Trzeba się właściwie zachować."
        ru: "Надо вести себя подобающе."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Два разных właściwie: «собственно, вообще-то» (Co właściwie chcesz? «Чего ты, собственно, хочешь?») и «правильно, надлежащим образом» (działał właściwie «действовал правильно»)." }
  - { kind: usage, text: "В первом значении это слово-заполнитель разговорной речи, как русские «вообще-то» и «в общем-то»." }
  - { kind: usage, text: "Степени сравнения (właściwiej, najwłaściwiej) возможны только во втором значении: «правильнее», «правильнее всего»." }
  - { kind: usage, text: "От прилагательного właściwy «присущий, подходящий, правильный»: właściwy człowiek na właściwym miejscu «нужный человек на нужном месте»." }
collocations:
  - { pl: "właściwie to...", ru: "собственно говоря..." }
  - { pl: "no właściwie", ru: "ну вообще-то" }
  - { pl: "postąpić właściwie", ru: "поступить правильно" }
etymology: "От właściwy «присущий, подходящий», а то — от własny «собственный». Корень тот же, что в русских «владеть» и «власть»: то, что принадлежит по праву, то и есть правильное."
memory: "właściwie — это сразу «собственно» и «правильно». В разговоре чаще первое: Co właściwie chcesz? — «Чего ты, собственно, хочешь?» Внутри własny «собственный», родня русскому «владеть»."
idioms:
  - { pl: "właściwie to...", ru: "собственно говоря..." }
  - { pl: "właściwy człowiek na właściwym miejscu", ru: "нужный человек на нужном месте" }
  - { pl: "no właściwie", ru: "ну вообще-то" }
