id: ubierac
format: 2
lemma: "ubierać"
rank: 2807
pos: verb
pron: { cyr: "убе́раць" }
senses:
  - id: dress
    ru: "одевать"
    examples:
      - pl: "Ubiera dziecko do przedszkola."
        ru: "Он одевает ребёнка в садик."
        source: { kind: authored }
      - pl: "Ubierała go sama przez pierwsze lata."
        ru: "Она одевала его сама первые годы."
        source: { kind: authored }
