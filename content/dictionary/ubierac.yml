        source: { kind: authored }
  - id: decorate
    ru: "наряжать, украшать"
    examples:
      - pl: "Ubieramy choinkę w Wigilię."
        ru: "Мы наряжаем ёлку в Сочельник."
        source: { kind: authored }
      - pl: "Ubieranie choinki zajęło wieczór."
        ru: "Наряжание ёлки заняло вечер."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Самая опасная ловушка этой партии. Польское UBIERAĆ значит «одевать» — надевать одежду на кого-то. Русское «убирать» значит совсем другое, и по-польски это SPRZĄTAĆ. Слова настолько похожи, что подмена происходит сама: UBIERAM POKÓJ по-польски означало бы «я одеваю комнату», а русское «убери со стола» будет SPRZĄTNIJ ZE STOŁU. Проверяйте по смыслу: если речь об одежде — ubierać, если о порядке — sprzątać." }
  - { kind: usage, text: "Самое неприятное в этой паре то, что слова действительно родственны, и именно поэтому ошибка кажется правильной. UBRAĆ собрано из приставки U- и глагола BRAĆ «брать», то есть буквально «взять на себя». Русское «убрать» собрано из тех же частей — у- плюс «брать», — но приставка потянула смысл в другую сторону: «взять от себя, унести». Один корень, одна приставка, расхождение только в направлении. Отсюда и UBRANIE «одежда» — то, что взято на себя." }
  - { kind: usage, text: "Форм шестьдесят три: несовершенный переходный, полный набор с двумя причастиями. Совершенная пара UBRAĆ попадает в соседнюю клетку с пятьюдесятью тремя формами, так что на одном корне опять видно устройство системы. Повелительное UBIERAJ подтверждает правило из карточки KARMIĆ: берём третье лицо UBIERA и прибавляем -j, потому что основа кончается гласной." }
  - { kind: usage, text: "С частицей SIĘ глагол значит «одеваться»: UBIERAM SIĘ, UBIERZ SIĘ CIEPŁO. И запомните два готовых выражения. UBIERAĆ CHOINKĘ — «наряжать ёлку», где русский берёт другой глагол. А UBIERAĆ SIĘ NA CEBULKĘ, буквально «одеваться луковицей», значит одеваться слоями, чтобы снимать по одному в тепле; русского соответствия у этого образа нет, и переводить приходится описательно." }
collocations:
  - { pl: "ubierać dziecko", ru: "одевать ребёнка" }
  - { pl: "ubierać choinkę", ru: "наряжать ёлку" }
  - { pl: "ubierać się ciepło", ru: "одеваться тепло" }
family:
  - { pl: "brać", ru: "брать", relation: root, id: brac }
  - { pl: "ubranie", ru: "одежда", relation: derived, id: ubranie }
  - { pl: "ubrać", ru: "одеть", relation: aspect, id: ubrac }
etymology: "Приставка u- и BRAĆ «брать», из праславянского *bьrati — того же корня, что русское «брать». Одеться значит взять на себя, и отсюда же UBRANIE «одежда». Русское «убрать» и «убирать» собраны из тех же частей, но приставка у- получила там значение удаления, и смысл ушёл к уборке. Поэтому слова родственны и обманчивы одновременно: расходятся они не корнем, а тем, куда повернула приставка."
memory: "Не «убирать», а «одевать»! Убирать — это sprzątać. При этом слова родственны: u + brać, как у + брать, только приставка повернула смысл в другую сторону."
idioms:
  - { pl: "ubierać choinkę", ru: "наряжать ёлку" }
  - { pl: "ubierać się na cebulkę", ru: "одеваться слоями" }
