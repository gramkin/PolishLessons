etymology: "Прямой родственник русского «редкого», и расхождение только в начальном звуке: польское rz отвечает русскому мягкому «р», как в rzeka при «реке» или trzy при «трёх». Исходное значение было «негустой, расположенный с промежутками», отсюда и «редкий по времени», и «жидкий» — в русском сохранилась лишь первая половина, в польском обе."
memory: "rzadki — «редкий», и rz отвечает русскому мягкому «р»: «редкий». Но помните второй смысл, которого у русского слова нет: rzadka zupa это «ЖИДКИЙ суп», и антоним тут gęsty «густой». Полная парадигма в тридцать три формы: rzadki, rzadszy, najrzadszy."
idioms:
  - { pl: "z rzadka", ru: "изредка, время от времени" }
  - { pl: "rzadki ptak", ru: "редкая птица, редкий гость" }
