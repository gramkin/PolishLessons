notes:
  - { kind: false-friend, text: "ГЛАВНАЯ ловушка карточки — второе значение. По-русски «редкий суп» не говорят, а по-польски rzadka zupa совершенно обычно и значит «ЖИДКИЙ суп». То же с тестом: rzadkie ciasto — «жидкое тесто». Противоположность здесь не «частый», а gęsty «густой». Значит, у слова два антонима на два смысла: częsty для «редко случающегося» и gęsty для «негустого»." }
  - { kind: pronunciation, text: "Начальное rz после которого идёт глухой звук оглушается: rzadki звучит «жа́тки», а d перед k произносится как «т». А само соответствие уже знакомо: польское rz отвечает русскому мягкому «р» — rzadki при «редком», rzeka при «реке», trzy при «трёх»." }
  - { kind: usage, text: "ТРИ РАЗМЕРА ПАРАДИГМЫ, И У КАЖДОГО СВОЯ ПРИЧИНА. Одиннадцать форм — степеней сравнения нет вовсе (południowy, magiczny). Тридцать три — полный набор из трёх степеней по одиннадцати форм (rzadki: rzadki, rzadszy, najrzadszy). Тридцать две — тоже три степени, но у прилагательных с мягкой основой именительный падеж мужского рода единственного числа совпадает с мужско-личным множественного: tani hotel и tani sprzedawcy, одна форма на две клетки. Так же устроены głupi и tutejszy." }
collocations:
