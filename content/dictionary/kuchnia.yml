        ru: "Это моя кухня."
        source: { kind: translated, id: 10543454 }
  - id: cuisine
    ru: "кухня (национальная, способ готовки)"
    examples:
      - pl: "Lubię chińską kuchnię."
        ru: "Я люблю китайскую кухню."
        source: { kind: translated, id: 5585045 }
      - pl: "Grecka kuchnia jest ciekawa."
        ru: "Греческая кухня интересная."
        source: { kind: translated, id: 11261075 }
  - id: inside
    ru: "od kuchni — изнутри, с изнанки"
    examples:
      - pl: "Znam tę firmę od kuchni."
        ru: "Я знаю эту фирму изнутри."
        source: { kind: authored }
      - pl: "Pokazał nam teatr od kuchni."
        ru: "Он показал нам театр изнутри."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Женский род на -ia: kuchnia, kuchni, kuchnię. Родительный, дательный и предложный совпадают — kuchni." }
  - { kind: usage, text: "Два основных значения, как и в русском: комната и национальная кухня — kuchnia polska «польская кухня»." }
  - { kind: false-friend, text: "Плита — это не kuchnia, а kuchenka. Слово kuchnia в значении «плита» осталось только в обороте kuchnia węglowa «угольная плита»." }
  - { kind: usage, text: "znać coś od kuchni «знать что-то изнутри» — о закулисной стороне дела." }
collocations:
  - { pl: "kuchnia polska", ru: "польская кухня" }
  - { pl: "w kuchni", ru: "на кухне" }
  - { pl: "kuchnia polowa", ru: "полевая кухня" }
  - { pl: "od kuchni", ru: "изнутри" }
family:
  - { pl: "kuchenny", ru: "кухонный", relation: derived }
  - { pl: "kuchenka", ru: "плита, плитка", relation: derived }
  - { pl: "kucharz", ru: "повар", relation: derived }
etymology: "От немецкого корня kuch- «готовить» (ср. kochen) плюс суффикс -nia. Русская «кухня» пришла из того же немецкого источника."
memory: "kuchnia — и «кухня» как комната, и «кухня» как национальная: kuchnia polska. Женский род, родительный kuchni. А плита — отдельное слово kuchenka."
idioms:
  - { pl: "kuchnia polowa", ru: "полевая кухня" }
  - { pl: "znać od kuchni", ru: "знать изнутри" }
formExamplesSkip:
  - { form: "kuchen", reason: "устаревший вариант родительного падежа множественного числа; нормой является kuchni" }
  - { form: "kuchnio", reason: "звательный падеж у этого слова в живой речи не употребляется" }
