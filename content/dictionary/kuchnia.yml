senses:
  - id: room
    ru: "кухня (помещение)"
    examples:
      - pl: "Tom, Mary i John są w kuchni."
        ru: "Том, Мэри и Джон на кухне."
        source: { kind: tatoeba, id: 3807891 }
      - pl: "Czy w kuchni jest ekspres do kawy?"
        ru: "Есть ли на кухне кофеварка?"
        source: { kind: tatoeba, id: 8396958 }
