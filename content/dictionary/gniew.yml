# review
id: gniew
format: 2
lemma: "gniew"
rank: 2174
pos: noun
pron: { cyr: "гнеф" }
senses:
  - id: anger
    ru: "гнев"
    examples:
      - pl: "Wpadł w gniew i wyszedł."
        ru: "Он впал в гнев и вышел."
        source: { kind: authored }
      - pl: "Jego gniew szybko minął."
        ru: "Его гнев быстро прошёл."
        source: { kind: authored }
      - pl: "W gniewie powiedział rzeczy, których żałuje."
        ru: "В гневе он сказал вещи, о которых жалеет."
        source: { kind: authored }
  - id: wrath
    ru: "гнев (высокое, божий)"
    examples:
      - pl: "Gniew boży spadł na miasto."
        ru: "Гнев божий обрушился на город."
        source: { kind: authored }
      - pl: "Bali się gniewu władcy."
        ru: "Они боялись гнева правителя."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Ловушек нет: gniew и «гнев» — одно праславянское слово, и значение то же. Стоит запомнить только соседа по полке — złość. Gniew звучит весомее, ближе к книжному, а złość это обиходная «злость». В быту поляк чаще скажет złościć się, оставив gniew для серьёзного: gniew boży, wpaść w gniew." }
  - { kind: pronunciation, text: "Конечное w оглушается в ф: gniew звучит «гнеф». В косвенных падежах звонкость возвращается — gniewu, «гне́ву», — а в предложном w ещё и смягчается: w gniewie, «в гне́ве». Та же пара оглушения есть в этой же группе у trening, который звучит «трэ́нинк»." }
  - { kind: usage, text: "Множественное gniewy значит не «гневы» вообще, а отдельные вспышки: jego gniewy mijają szybko «его вспышки гнева проходят быстро». По-русски здесь без слова «вспышка» не обойтись, одного «гнева» не хватит." }
collocations:
  - { pl: "wpaść w gniew", ru: "впасть в гнев" }
  - { pl: "ochłonąć z gniewu", ru: "остыть от гнева" }
  - { pl: "gniew boży", ru: "гнев божий" }
family:
  - { pl: "gniewać się", ru: "сердиться", relation: derived }
  - { pl: "gniewny", ru: "гневный", relation: derived }
  - { pl: "rozgniewać", ru: "разгневать", relation: derived }
etymology: "Из праславянского *gněvъ — того же слова, что русский «гнев», с тем же значением. Отсюда gniewać się «сердиться», gniewny «гневный», rozgniewać «разгневать» и zagniewany «рассерженный»."
memory: "gniew — «гнев», слово общее и без подвохов. Две мелочи: на конце оглушение, «гнеф», а в быту поляк чаще скажет złość, приберегая gniew для серьёзного случая."
idioms:
  - { pl: "wpaść w gniew", ru: "впасть в гнев" }
  - { pl: "gniew boży", ru: "гнев божий" }
