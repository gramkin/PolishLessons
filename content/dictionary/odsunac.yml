# review
id: odsunac
format: 2
lemma: "odsunąć"
rank: 1419
pos: verb
aspect: perf
pron: { cyr: "отсу́нонць" }
senses:
  - id: move-aside
    ru: "отодвинуть, отодвинуться, отойти"
    examples:
      - pl: "Odsuń się."
        ru: "Отодвинься."
        source: { kind: translated, id: 5627102 }
      - pl: "Odsunąłem stół, by nie przeszkadzał."
        ru: "Я отодвинул стол, чтобы он не мешал."
        source: { kind: translated, id: 718952 }
      - pl: "Tom odsunął się na bok."
        ru: "Том отодвинулся в сторону."
        source: { kind: translated, id: 6304259 }
  - id: draw-back
    ru: "раздвинуть, отдёрнуть (шторы, дверь)"
    examples:
      - pl: "Kiedy odsunąłem zasłony, padał śnieg."
        ru: "Когда я открыл шторы, шёл снег."
        source: { kind: tatoeba, id: 3549155 }
      - pl: "Jeśli dotkniesz tego przełącznika, załony automatycznie się odsuną."
        ru: "Если коснёшься этого выключателя, шторы раздвинутся автоматически."
        source: { kind: translated, id: 1348827 }
  - id: remove
    ru: "отстранить (от должности, от дела)"
    examples:
      - pl: "Został odsunięty od tego stanowiska przez grupę młodych ludzi."
        ru: "Он был отстранён от этой должности группой молодых людей."
        source: { kind: translated, id: 933148 }
notes:
  - { kind: usage, text: "Совершенный вид к odsuwać." }
  - { kind: government, text: "odsunąć co, винительный: odsunąć krzesło, zasłony. С się — «отодвинуться, отойти»: Odsuń się «Отодвинься»." }
  - { kind: usage, text: "Переносно — «отстранить»: został odsunięty od śledztwa «его отстранили от следствия»." }
  - { kind: false-friend, text: "Корень тот же, что в русском «сунуть», но польское sunąć значит «плавно двигать, скользить», а не «резко сунуть». Гнездо: przesunąć «передвинуть», wysunąć «выдвинуть», zasunąć «задвинуть»." }
collocations:
  - { pl: "odsunąć się", ru: "отодвинуться" }
  - { pl: "odsunąć zasłony", ru: "раздвинуть шторы" }
  - { pl: "odsunąć na bok", ru: "отодвинуть в сторону" }
etymology: "Приставка od- и sunąć «двигать, скользить» (праславянское *sunǫti). Русское «сунуть» — то же слово, но значение разошлось: польское sunąć это плавное движение."
memory: "odsunąć — «отодвинуть», od- плюс sunąć «двигать». С się — «отодвинуться, отойти»: Odsuń się! Переносно — «отстранить»: odsunięty od śledztwa."
