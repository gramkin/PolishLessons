notes:
  - { kind: pronunciation, text: "Читается «ру́нда», ударение на первом слоге из двух. Главное в карточке — местный и дательный падеж RUNDZIE: там D переходит в DZ и звучит «дзе», то есть «ру́ндзе». Это сквозное польское чередование перед окончанием -E, и оно уже встречалось в OBSŁUGA и OBSŁUDZE, ZARZĄD и ZARZĄDZIE. Русский в таких словах ничего не меняет, поэтому форму приходится заучивать отдельно: RUNDA — RUNDZIE, как WODA — WODZIE." }
  - { kind: government, text: "Женский род на -A, склонение правильное. Винительный на -Ę: WYGRAŁ RUNDĘ. Место в последовательности вводится порядковым числительным и предлогом W с местным: W PIERWSZEJ RUNDZIE, W DRUGIEJ RUNDZIE. Переход дальше — предлог DO с родительным: AWANSOWAĆ DO NASTĘPNEJ RUNDY «выйти в следующий круг». При отрицании винительный уходит в родительный: NIE WYGRAŁ RUNDY. Обратите внимание, что русский скажет «в следующий круг» с винительным, а польский требует родительного после DO." }
  - { kind: usage, text: "Слово работает в трёх кругах употребления. Спорт: RUNDA в боксе, в турнире, RUNDA WIOSENNA «весенний круг» в футбольной лиге. Переговоры и политика: RUNDA ROZMÓW, RUNDA NEGOCJACJI, KOLEJNA RUNDA WYBORÓW «очередной тур выборов» — заметьте, русский здесь предпочтёт «тур». И застольное: ZAMÓWIĆ RUNDĘ значит заказать всем по кругу. В последнем значении слово разговорное, но совершенно обычное." }
  - { kind: false-friend, text: "Русское «раунд» употребляется заметно уже польского RUNDA: по-русски раунд бывает в боксе и, с натяжкой, в переговорах, а футбольный круг или тур выборов раундом не назовут. Поэтому при переводе на русский приходится выбирать слово по контексту: RUNDA WIOSENNA — это «весенний круг», RUNDA WYBORÓW — «тур выборов», RUNDA ROZMÓW — «круг переговоров». Обратное направление проще: почти всё, что русский называет кругом, туром или раундом в последовательности, по-польски будет RUNDA." }
collocations:
