etymology: "Из немецкого RUNDE «круг», от прилагательного RUND «круглый», которое само из французского ROND и далее из латинского ROTUNDUS «круглый», от ROTA «колесо». Русский «раунд» пришёл иначе — из английского ROUND, то есть из того же латинского корня, но другой дорогой, и потому значение у него оказалось узким, спортивным. Польский, взяв слово у немцев раньше и в более общем смысле, сохранил всю широту: круг как любой повторяющийся отрезок последовательности. Латинское ROTA «колесо» видно и в польском ROTACJA, и в русской «ротации», и в слове «рулетка» через французское ROULETTE. Так что за спортивным термином стоит самый простой образ — колесо, которое делает оборот."
memory: "Шире русского «раунда»: и раунд в боксе, и круг в лиге, и тур выборов, и «по кругу» за столом. В дательном и местном d переходит в dz: w rundzie, как w wodzie и w obsłudze. Из немецкого Runde «круг», от латинского rota «колесо». Выйти дальше — awansować DO rundy, с родительным."
idioms:
  - { pl: "runda rozmów", ru: "круг переговоров" }
  - { pl: "zamówić rundę", ru: "заказать всем по кругу" }
