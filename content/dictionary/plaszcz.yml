notes:
  - { kind: false-friend, text: "ПОЛЬСКИЙ PŁASZCZ ШИРЕ РУССКОГО «ПЛАЩА». По-русски плащ — это именно непромокаемая накидка; зимняя верхняя одежда называется «пальто». Польское płaszcz покрывает и то и другое: płaszcz zimowy это ПАЛЬТО, а плащ от дождя уточняют — płaszcz przeciwdeszczowy. Слова «palto» в польском нет вовсе." }
  - { kind: pronunciation, text: "ДВА РОДИТЕЛЬНЫХ МНОЖЕСТВЕННОГО: PŁASZCZY И PŁASZCZÓW. Обе формы правильны, и выбор свободный — ровно как у kapelusz (kapeluszy / kapeluszów), tchórz и gracz. Само слово читается одним слогом: ł как краткое у, szcz как щч, и конечное сочетание оглушается — «пуащч»." }
  - { kind: usage, text: "Уменьшительное płaszczyk, прилагательное płaszczowy. В переносном смысле слово живёт в обороте pod płaszczykiem czegoś «под видом, под предлогом чего-л.» — буквально «под плащиком». Близкие слова: kurtka «куртка», marynarka «пиджак», futro «шуба»." }
collocations:
  - { pl: "płaszcz przeciwdeszczowy", ru: "плащ от дождя" }
  - { pl: "płaszcz zimowy", ru: "зимнее пальто" }
  - { pl: "pod płaszczykiem", ru: "под видом, под предлогом" }
family:
  - { pl: "płaszczyk", ru: "плащик", relation: derived }
  - { pl: "kurtka", ru: "куртка", relation: root }
  - { pl: "futro", ru: "шуба", relation: root }
etymology: "Праславянское *plaščь, от *platjь — того же корня, что płat «лоскут», płótno «полотно» и русские «платок», «платье», «плат». Плащ был просто куском ткани, накинутым на плечи. Русское «плащ» — то же слово; разошлись не корни, а объём значения."
memory: "płaszcz — не только «плащ», но и ПАЛЬТО: słowa «palto» в польском нет. Плащ от дождя уточняют: płaszcz przeciwdeszczowy. А родительный множественного двойной: płaszczy или płaszczów, как kapeluszy или kapeluszów."
idioms:
  - { pl: "pod płaszczykiem czegoś", ru: "под видом чего-л." }
  - { pl: "płaszcz przeciwdeszczowy", ru: "плащ от дождя" }
