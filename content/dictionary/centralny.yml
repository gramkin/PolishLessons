notes:
  - { kind: false-friend, text: "Прилагательное отвечает русскому «центральный» точно, но в гнезде есть слово, которое легко понять неверно. CENTRALA это не «централь», а головной офис или телефонная станция: CENTRALA FIRMY значит «головной офис фирмы», а CENTRALA TELEFONICZNA — «телефонная станция». И запомните, что CENTRUM по-польски прежде всего центр города: W CENTRUM значит «в центре»." }
  - { kind: usage, text: "В таблице одиннадцать форм, но живых десять. Одиннадцатая — CENTRALNI, именительный множественного для мужчин-людей, и её не употребляют: прилагательное относительное, оно описывает место или устройство, а не человека. Примеров к этой форме в карточке поэтому нет. Суффикс -ALNY прямо отвечает русскому «-альный», и это соответствие работает на сотнях слов." }
  - { kind: government, text: "Здесь порядок слов, в отличие от большинства закреплённых сочетаний, свободнее: говорят и OGRZEWANIE CENTRALNE, и CENTRALNE OGRZEWANIE, и оба варианта обычны. Поляки сокращают это до двух букв, CO, и так пишут в объявлениях о квартирах. В центральном отоплении — W OGRZEWANIU CENTRALNYM, местный падеж. Без центрального отопления — BEZ OGRZEWANIA CENTRALNEGO, родительный." }
  - { kind: pronunciation, text: "Читается «цэнтра́льны», четыре слога, ударение на предпоследнем. Буква E после C даёт «э», поэтому начало это «цэн». Буква L перед согласной N звучит как «ль», отсюда «ра́ль» в середине слова. Конечная Y даёт «ы». В женском роде CENTRALNA это «цэнтра́льна», в среднем CENTRALNE — «цэнтра́льнэ»." }
  - { kind: register, text: "Слово официальное и техническое. В объявлениях о жилье это OGRZEWANIE CENTRALNE, сокращённо CO. В политике — WŁADZA CENTRALNA и WŁADZE CENTRALNE «центральные власти». В городе — DWORZEC CENTRALNY, и в Варшаве так называется главный вокзал, уже как имя собственное. В технике говорят UKŁAD CENTRALNY о центральном узле установки." }
collocations:
  - { pl: "ogrzewanie centralne", ru: "центральное отопление" }
  - { pl: "władza centralna", ru: "центральная власть" }
