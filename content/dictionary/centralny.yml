family:
  - { pl: "centrum", ru: "центр", relation: root, id: centrum }
  - { pl: "centrala", ru: "головной офис; телефонная станция", relation: derived, id: centrala }
  - { pl: "centralizacja", ru: "централизация", relation: derived }
etymology: "Через латинское CENTRUM из греческого, где слово значило остриё циркуля, то есть точку, вокруг которой чертят круг. Русское «центр» пришло тем же путём, поэтому корень общий. Польский прибавил латинский суффикс -ALIS и получил -ALNY, русский — «-альный», и это одно из самых надёжных соответствий между языками: там, где у нас «-альный», у поляков -ALNY почти без исключений."
memory: "Центральный, и корень тот же, что в «центре». Главное сочетание — ogrzewanie centralne «центральное отопление», которое поляки сокращают до CO и пишут так в объявлениях о квартирах; порядок слов здесь свободный, centralne ogrzewanie тоже верно. Читается «цэнтра́льны», где l перед согласной даёт «ль». В гнезде не обманитесь: centrala это головной офис или телефонная станция."
idioms:
  - { pl: "ogrzewanie centralne", ru: "центральное отопление" }
formExamplesSkip:
  - { form: "centralni", reason: "именительный множественного для мужчин-людей; прилагательное относительное и людей не описывает" }
