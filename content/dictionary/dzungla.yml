etymology: "Из английского JUNGLE, а то из хинди JANGAL «необработанная земля, дикое место», от санскритского JANGALA «сухая пустошь». Любопытно, что исходное значение было ровно противоположным нынешнему: в хинди слово означало сухую бесплодную землю, а англичане в Индии применили его к густым влажным лесам, и в этом новом смысле оно разошлось по всей Европе. Польский и русский взяли слово через английский почти одновременно, в конце девятнадцатого века, но оформили по-разному: русский сделал его множественным, как «дебри» и «кущи», а польский — женским единственным, по образцу собственных слов на -LA. Орфография DŻ для английского J в польском регулярна: DŻEM, DŻINS, DŻOKEJ."
memory: "Польское dżungla — единственное число женского рода, а русские «джунгли» только множественное: dżungla zaczyna się, но «джунгли начинаются». При переводе меняется число: w dżungli «в джунглях», z dżungli «из джунглей». Орфография и есть урок: dż передаёт английское J, как в dżem от jam и dżins от jeans. Переносные значения совпадают: prawo dżungli, miejska dżungla. Прилагательного нет — говорят roślinność dżungli или tropikalny."
