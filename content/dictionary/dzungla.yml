notes:
  - { kind: false-friend, text: "Различие формальное, но заметное: русское «джунгли» существует только во множественном числе, а польское DŻUNGLA — существительное женского рода в единственном. Поэтому по-польски говорят DŻUNGLA ZACZYNA SIĘ, с глаголом в единственном числе, а по-русски «джунгли начинаются» — во множественном. При переводе приходится менять число: W DŻUNGLI это «в джунглях», Z DŻUNGLI — «из джунглей». Множественное DŻUNGLE в польском тоже есть, но значит «джунгли разных мест», как у леса. В переносном смысле слово работает одинаково в двух языках: MIEJSKA DŻUNGLA «городские джунгли», DŻUNGLA PRZEPISÓW «джунгли предписаний»." }
  - { kind: usage, text: "Девять форм, женский род. Родительный, дательный и местный единственного совпадают в форме DŻUNGLI, и это обычное дело для существительных на -LA с мягкой основой. Множественное DŻUNGLE употребляется, но реже единственного, потому что по-польски джунгли — это один массив. Звательный DŻUNGLO формально существует и встречается только в стихах. Прилагательного от этого слова нет: вместо него употребляют конструкцию с родительным, ROŚLINNOŚĆ DŻUNGLI «растительность джунглей», или слово TROPIKALNY «тропический»." }
  - { kind: pronunciation, text: "Читается «джу́нгля», три слога, ударение на первом. Главное — сочетание DŻ: это один слитный звук «дж», как в английском JUNGLE, откуда слово и взято. Польская орфография передала английский J буквосочетанием DŻ, и то же решение видно в DŻEM от JAM и DŻINS от JEANS. Буква U читается «у». Сочетание GL перед A даёт «гля», потому что L в польском всегда мягче русского твёрдого «л». Конечное A — чистое «а». В форме DŻUNGLI конец звучит «гли», мягко." }
  - { kind: register, text: "Слово нейтральное и книжно-бытовое: в прямом значении употребляется в географических и приключенческих текстах, в переносном — в публицистике. Переносное значение очень частое и всегда с оттенком хаоса или беззакония: DŻUNGLA PRZEPISÓW «путаница предписаний», PRAWO DŻUNGLI «закон джунглей», MIEJSKA DŻUNGLA «городские джунгли». В официальном языке прямого значения избегают, предпочитают LAS TROPIKALNY «тропический лес», который точнее как термин." }
