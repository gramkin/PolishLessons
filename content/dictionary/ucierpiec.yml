# review
id: ucierpiec
format: 2
lemma: "ucierpieć"
rank: 2130
pos: verb
aspect: perf
aspectPair: cierpiec
pron: { cyr: "уце́рпець" }
senses:
  - id: suffer
    ru: "пострадать"
    examples:
      - pl: "Cała ludzkość na tym ucierpi, jeśli wybuchnie wojna nuklearna."
        ru: "Всё человечество пострадает, если разразится ядерная война."
        source: { kind: tatoeba, id: 12470602 }
      - pl: "Budynek mocno ucierpiał w pożarze."
        ru: "Здание сильно пострадало при пожаре."
        source: { kind: translated, id: 742452 }
      - pl: "Na szczęście żaden z pasażerów nie ucierpiał."
        ru: "К счастью, никто из пассажиров не пострадал."
        source: { kind: translated, id: 6156609 }
  - id: be-damaged
    ru: "понести урон, ухудшиться"
    examples:
      - pl: "Wskutek tego skandalu wizerunek naszej firmy bardzo ucierpiał."
        ru: "Вследствие этого скандала репутация нашей фирмы сильно пострадала."
        source: { kind: translated, id: 719665 }
      - pl: "W tym trzęsieniu ziemi ucierpiało bardzo wiele budynków."
        ru: "При этом землетрясении пострадало очень много зданий."
        source: { kind: translated, id: 1603851 }
notes:
  - { kind: usage, text: "Совершенный вид к cierpieć «страдать», но значение уже: не «страдать», а «пострадать, понести урон» — один раз и в результате чего-то." }
  - { kind: government, text: "От чего пострадал — w с предложным (ucierpieć w pożarze) или wskutek с родительным (wskutek skandalu)." }
  - { kind: false-friend, text: "Корень cierpieć «терпеть, страдать» — ср. русское «терпеть». Карточка cierpliwość из той же семьи." }
  - { kind: usage, text: "Подлежащим часто бывает не человек, а вещь или репутация: budynek ucierpiał, wizerunek ucierpiał." }
  - { kind: government, text: "Прямого дополнения у глагола нет, поэтому страдательных форм ucierpiany, ucierpiani не существует. Нет и повелительного наклонения: пострадать не приказывают." }
collocations:
  - { pl: "ucierpieć w pożarze", ru: "пострадать при пожаре" }
  - { pl: "nikt nie ucierpiał", ru: "никто не пострадал" }
etymology: "u- + cierpieć «страдать, терпеть»; ср. русское «терпеть», «пострадать»."
memory: "ucierpieć — «пострадать», совершенный вид к cierpieć. Подлежащим часто бывает вещь или репутация: budynek ucierpiał «здание пострадало»."
idioms:
  - { pl: "nikt nie ucierpiał", ru: "никто не пострадал" }
