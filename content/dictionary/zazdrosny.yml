# review
id: zazdrosny
format: 2
lemma: "zazdrosny"
rank: 1765
pos: adj
pron: { cyr: "заздро́сны" }
senses:
  - id: jealous
    ru: "ревнивый, ревнующий"
    examples:
      - pl: "On jest zazdrosny."
        ru: "Он ревнивый."
        source: { kind: tatoeba, id: 3436238 }
      - pl: "Byłem zazdrosny."
        ru: "Я ревновал."
        source: { kind: translated, id: 4737281 }
      - pl: "Nie cierpię zazdrosnych kobiet."
        ru: "Терпеть не могу ревнивых женщин."
        source: { kind: translated, id: 965290 }
  - id: envious
    ru: "завидующий, завистливый"
    examples:
      - pl: "Po prostu jesteś zazdrosny."
        ru: "Ты просто завидуешь."
        source: { kind: tatoeba, id: 5492180 }
      - pl: "Po prostu jesteś zazdrosna."
        ru: "Ты просто завидуешь."
        source: { kind: tatoeba, id: 5492183 }
      - pl: "Jestem trochę zazdrosna."
        ru: "Я немного завидую."
        source: { kind: translated, id: 4869421 }
notes:
  - { kind: false-friend, text: "Одно польское слово покрывает два русских: «ревнивый» и «завистливый». Jesteś zazdrosny может значить и «ты ревнуешь», и «ты завидуешь» — решает контекст." }
  - { kind: government, text: "Ревновать к кому-то — być zazdrosnym o kogoś (винительный с o); завидовать чему-то — zazdrościć czegoś, уже другой глагол с родительным падежом." }
  - { kind: usage, text: "Существительное zazdrość тоже двузначно: и «ревность», и «зависть». Чисто «зависть» будет zawiść." }
  - { kind: usage, text: "Сравнительная степень — bardziej zazdrosny; форма zazdrośniejszy встречается редко." }
collocations:
  - { pl: "być zazdrosnym o kogoś", ru: "ревновать кого-либо" }
  - { pl: "zazdrosny mąż", ru: "ревнивый муж" }
  - { pl: "po prostu jesteś zazdrosny", ru: "ты просто завидуешь" }
family:
  - { pl: "zazdrość", ru: "ревность, зависть", relation: root }
  - { pl: "zazdrościć", ru: "завидовать", relation: root }
  - { pl: "zawiść", ru: "зависть", relation: root }
etymology: "От zazdrość, приставка za- плюс корень «зреть, смотреть» — тот же, что в русском «зависть» и «ревность» по образу «коситься на чужое»."
memory: "zazdrosny — сразу и «ревнивый», и «завистливый»: Jesteś zazdrosny значит либо «ты ревнуешь», либо «ты завидуешь». Ревновать к кому-то — być zazdrosnym o kogoś."
idioms:
  - { pl: "być zazdrosnym o kogoś", ru: "ревновать кого-либо" }
  - { pl: "zazdrosny mąż", ru: "ревнивый муж" }
  - { pl: "po prostu jesteś zazdrosny", ru: "ты просто завидуешь" }
