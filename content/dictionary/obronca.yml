etymology: "От глагола BRONIĆ «защищать», с приставкой O-, из праславянского *borniti — того же корня, что русские «бранить», «оборона», «брань» в старом значении «битва». Исходный смысл корня был «отражать, отбивать», и русская «оборона» построена в точности так же: приставка плюс тот же корень. Любопытно, что русское «бранить» ушло в сторону словесного порицания, а польское BRONIĆ осталось при защите, и потому для русского слуха связь между «бранью» и «обороной» почти исчезла, тогда как в польском BROŃ значит просто «оружие», и гнездо держится вместе: BROŃ, BRONIĆ, OBROŃCA, OBRONA. Суффикс -CA образует названия действующих лиц: SPRZEDAWCA, WYKONAWCA, DORADCA."
memory: "Мужской род с женскими окончаниями: obrońcy, obrońcę, obrońcą — как kolega, kierowca, sprzedawca, и как русские «дядя» и «судья». Согласование мужское: dobry obrońca. Именительный множественного obrońcy совпадает с родительным единственного. Adwokat — профессия, obrońca — роль в процессе. Корень как в «обороне», и broń значит «оружие»."
