notes:
  - { kind: usage, text: "Склонение этого слова для русского самое неожиданное в карточке: существительное мужского рода, а окончания у него женские. Родительный, дательный и местный единственного — OBROŃCY, винительный — OBROŃCĘ, творительный — OBROŃCĄ, звательный — OBROŃCO. То есть по падежам слово ведёт себя как KOBIETA, а по согласованию остаётся мужским: DOBRY OBROŃCA, а не DOBRA. Так же устроены KOLEGA, KIEROWCA, SPRZEDAWCA, MĘŻCZYZNA — целый разряд мужских существительных на -A, и русский знает то же явление в «дядя» и «судья»." }
  - { kind: government, text: "Кого защищает — родительный без предлога: OBROŃCA OSKARŻONEGO. Чего защитник — тоже родительный: OBROŃCA PRAW CZŁOWIEKA «защитник прав человека», OBROŃCA TEJ TEORII. Назначенный судом защитник — OBROŃCA Z URZĘDU, буквально «защитник от учреждения», и это устойчивый юридический термин. Именительный множественного — OBROŃCY, совпадающий с родительным единственного, так что контекст приходится читать внимательно: OBROŃCY PRZYSZLI «защитники пришли», но BEZ OBROŃCY «без защитника»." }
  - { kind: pronunciation, text: "Читается «оброньца», ударение на предпоследнем слоге. Буква Ń даёт мягкое «нь», и сочетание ŃC произносится слитно: «ньц». Начальное OB перед R звучит звонко, без оглушения. В родительном OBROŃCY конечное Y даёт «ы»: «оброньцы». Слово трёхсложное: O-BROŃ-CA, и ударение падает на -BROŃ-." }
  - { kind: false-friend, text: "Значение совпадает с русским «защитником», включая оба употребления, судебное и спортивное. Отметить стоит, что адвоката по-польски называют и ADWOKAT, и OBROŃCA, но не как попало: ADWOKAT — это профессия и титул, а OBROŃCA — роль в конкретном процессе, тот, кто защищает именно этого подсудимого. Поэтому ADWOKAT может в одном деле быть OBROŃCĄ, а в другом выступать на стороне истца. Русский в обоих случаях скажет «адвокат» или «защитник», не различая так строго." }
