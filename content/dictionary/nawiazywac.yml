notes:
  - { kind: false-friend, text: "NAWIĄZYWAĆ — «завязывать, налаживать» (контакт, разговор, знакомства), а не «навязывать». Русское «навязывать» — NARZUCAĆ: NARZUCAĆ KOMUŚ SWOJE ZDANIE. NAWIĄZYWAĆ DO — «ссылаться на, перекликаться с»." }
  - { kind: government, text: "Что — винительный: NAWIĄZYWAĆ KONTAKTY, ZNAJOMOŚCI. С кем — Z + творительный: NAWIĄZYWAĆ ROZMOWĘ Z SĄSIADEM. К чему — DO + родительный: FILM NAWIĄZUJE DO KLASYKI «фильм отсылает к классике»." }
  - { kind: usage, text: "Несовершенный вид к NAWIĄZAĆ. Спряжение на -UJĘ: NAWIĄZUJĘ, NAWIĄZUJESZ, NAWIĄZUJĄ, но в прошедшем снова -YWA-: NAWIĄZYWAŁ. Мужско-личное страдательное NAWIĄZYWANI в карточку не включено: завязывают контакты и отношения, а не людей." }
  - { kind: register, text: "Книжное и деловое слово, частое в прессе, рецензиях и письмах. В разговоре проще: ZAGADAĆ DO KOGOŚ, ZŁAPAĆ KONTAKT." }
collocations:
  - { pl: "nawiązywać kontakty", ru: "налаживать контакты" }
  - { pl: "nawiązywać znajomości", ru: "заводить знакомства" }
  - { pl: "nawiązywać do tradycji", ru: "обращаться к традиции" }
family:
  - { pl: "nawiązać", ru: "завязать, установить", relation: aspect, id: nawiazac }
  - { pl: "wiązać", ru: "вязать, связывать", relation: root, id: wiazac }
  - { pl: "nawiązanie", ru: "установление; отсылка", relation: derived, id: nawiazanie }
etymology: "Приставка NA- плюс WIĄZAĆ «вязать», праславянское *vęzati. Польское Ą соответствует русскому «я»: WIĄZAĆ — «вязать». По строению NAWIĄZYWAĆ — «навязывать», но значение польское: «завязывать связь»."
memory: "Nawiązywać kontakty — завязывать контакты, а не «навязывать». «Навязывать» — narzucać."
idioms:
  - { pl: "nawiązywać nić porozumienia", ru: "налаживать взаимопонимание" }
formExamplesSkip:
  - { form: "nawiązywani", reason: "мужско-личная форма страдательного причастия: завязывают контакты и отношения, а не людей" }
