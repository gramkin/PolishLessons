id: ryzykowac
format: 2
lemma: "ryzykować"
rank: 1901
pos: verb
aspect: imperf
pron: { cyr: "рызыко́вачь" }
senses:
  - id: risk
    ru: "рисковать"
    examples:
      - pl: "Przestań ryzykować."
        ru: "Перестань рисковать."
        source: { kind: translated, id: 8617179 }
      - pl: "Nie musisz ryzykować."
        ru: "Тебе не нужно рисковать."
        source: { kind: translated, id: 723900 }
      - pl: "Nie możemy ryzykować."
        ru: "Мы не можем рисковать."
        source: { kind: translated, id: 6554118 }
      - pl: "Tom nie chciał ryzykować."
        ru: "Том не хотел рисковать."
        source: { kind: translated, id: 3051308 }
      - pl: "Ryzykował życiem, by ją uratować."
        ru: "Он рисковал жизнью, чтобы спасти её."
        source: { kind: tatoeba, id: 364812 }
      - pl: "Ryzykował życiem."
        ru: "Он рисковал жизнью."
        source: { kind: translated, id: 998615 }
  - id: risk-losing
    ru: "рисковать потерять что-либо"
    examples:
      - pl: "Ryzykujesz utratę mojego zaufania."
        ru: "Ты рискуешь потерять моё доверие."
        source: { kind: translated, id: 596649 }
      - pl: "Wiem, co ryzykowałeś."
        ru: "Я знаю, чем ты рисковал."
        source: { kind: tatoeba, id: 3070717 }
      - pl: "Kto nie ryzykuje, ten nic nie ma."
        ru: "Кто не рискует, тот ничего не имеет."
        source: { kind: translated, id: 349167 }
notes:
  - { kind: usage, text: "Рядом с карточкой ryzyko «риск»: ryzykować — глагол от него, podejmować ryzyko — более книжный синоним." }
  - { kind: usage, text: "Пословица Kto nie ryzykuje, ten nie pije szampana — точный польский двойник русского «Кто не рискует, тот не пьёт шампанского»." }
  - { kind: usage, text: "Деепричастие ryzykując «рискуя» употребляется очень часто: ryzykując życiem «рискуя жизнью»." }
collocations:
  - { pl: "ryzykować życiem", ru: "рисковать жизнью" }
  - { pl: "nie ryzykuj", ru: "не рискуй" }
  - { pl: "ryzykować utratę", ru: "рисковать потерять" }
etymology: "Из итальянского risico через немецкий Risiko. Русское «рисковать» пришло тем же путём через французский, поэтому слова звучат почти одинаково."
memory: "ryzykować — «рисковать», от карточки ryzyko «риск». Запомните пословицу: Kto nie ryzykuje, ten nie pije szampana."
idioms:
  - { pl: "ryzykować życiem", ru: "рисковать жизнью" }
  - { pl: "kto nie ryzykuje, ten nie pije szampana", ru: "кто не рискует, тот не пьёт шампанского" }
  - { pl: "nie ryzykuj", ru: "не рискуй" }
