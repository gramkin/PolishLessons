  - id: mess
    ru: "разг. бардак, бедлам"
    examples:
      - pl: "W twoim pokoju jest straszny burdel."
        ru: "В твоей комнате страшный бардак."
        source: { kind: authored }
      - pl: "W firmie panuje kompletny burdel."
        ru: "В фирме полный бардак."
