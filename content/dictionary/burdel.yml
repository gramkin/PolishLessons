notes:
  - { kind: false-friend, text: "Русское «бордель» — только публичный дом, а «бардак» — его родня в значении беспорядка. Польское BURDEL покрывает оба: и публичный дом, и «бардак». Поэтому W POKOJU JEST BURDEL — это «в комнате бардак», без всякого неприличного подтекста, хотя слово грубоватое. Вежливо — BAŁAGAN." }
  - { kind: usage, text: "Мужской род, неодушевлённое. Родительный BURDELU, местный W BURDELU. Множественное BURDELE, родительный BURDELI или BURDELÓW. В значении «бардак» — обычно только в единственном." }
  - { kind: government, text: "В комнате бардак — W POKOJU JEST BURDEL, W с местным. Навести порядок в бардаке — ZROBIĆ PORZĄDEK Z BURDELEM, Z с творительным. Бардак в документах — BURDEL W PAPIERACH." }
  - { kind: pronunciation, text: "Читается «бу́рдэль», два слога, ударение на первом. U — «у», DE — твёрдое «дэ», конечная L мягкая. В BURDELU: «бурдэ́лю»." }
  - { kind: register, text: "В прямом значении — разговорное и грубоватое, официально DOM PUBLICZNY. В значении «бардак» — очень частое разговорное, но при детях и начальстве лучше BAŁAGAN. BURDEL NA KÓŁKACH, «бордель на колёсиках», — полный хаос." }
collocations:
  - { pl: "totalny burdel", ru: "полный бардак" }
  - { pl: "burdel na kółkach", ru: "полный хаос, бедлам" }
  - { pl: "dom publiczny", ru: "публичный дом (офиц.)" }
family:
  - { pl: "bałagan", ru: "беспорядок", relation: root, id: balagan }
  - { pl: "prostytutka", ru: "проститутка", relation: root }
  - { pl: "burdelmama", ru: "хозяйка борделя (разг.)", relation: derived }
etymology: "Из итальянского bordello, а то из старофранцузского bordel, «хижина», уменьшительного от borde, «дощатый домик». Русское «бордель» — то же слово; русское «бардак» — тюркского происхождения, но смысловое сближение обоих слов в русском и польском одинаковое."
memory: "Burdel — бордель; и разг. «бардак»: w pokoju jest burdel. Вежливо — bałagan. Burdel na kółkach — полный хаос. Читается «бу́рдэль»."
idioms:
  - { pl: "burdel na kółkach", ru: "полный хаос, бедлам" }
