senses:
  - id: brothel
    ru: "бордель, публичный дом"
    examples:
      - pl: "W tej kamienicy był kiedyś burdel."
        ru: "В этом доме когда-то был бордель."
        source: { kind: authored }
      - pl: "Policja zamknęła nielegalny burdel."
