  - { pl: "dopilnowanie", ru: "присмотр, надзор", relation: derived }
etymology: "Приставка do- со значением «до конца» и PILNOWAĆ «следить, охранять», от прилагательного PILNY «усердный, срочный». Корень этот в русском родственников не оставил, так что запоминать его приходится заново — зато в польском он дал целое гнездо: PILNY, PILNIE «срочно, внимательно», PILNOŚĆ «усердие», PILNOWAĆ, DOPILNOWAĆ, PILNUJĄCY. Приставка do- работает здесь ровно как в DOKOŃCZYĆ «докончить» и DOCZYTAĆ «дочитать»: доводит действие до результата."
memory: "Родни в русском нет, запоминать заново: pilnować — «следить», dopilnować — «доследить до конца». И управление без предлога: dopilnować terminów, а не «за сроками»."
idioms:
