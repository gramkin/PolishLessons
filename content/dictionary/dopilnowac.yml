notes:
  - { kind: government, text: "Управление расходится с русским, и это главное, что надо запомнить. DOPILNOWAĆ CZEGOŚ — чистый родительный, без предлога: DOPILNOWAŁA PRZEPROWADZKI, DOPILNOWANO TERMINÓW. Русский же берёт предлог «за» с творительным: «присмотреть за переездом», «проследить за сроками». Так что предлог здесь надо не менять, а убирать вовсе. Второй оборот — с союзом ŻEBY: DOPILNUJ, ŻEBY WSZYSTKO BYŁO GOTOWE, и он совпадает с русским «проследи, чтобы»." }
  - { kind: false-friend, text: "Корень в русском родни не имеет, и это тот же случай, что TRZYMAĆ из партии 266: придётся запомнить его отдельно, зато потом открывается всё гнездо. PILNOWAĆ значит «следить, охранять, караулить»: PILNUJ DZIECI «присмотри за детьми», PILNOWAĆ BAGAŻU «следить за багажом». Прилагательное PILNY при этом держит два смысла, и оба неожиданные: PILNA SPRAWA — «срочное дело», а PILNY UCZEŃ — «усердный ученик». Русское «пильный» сюда отношения не имеет." }
  - { kind: pronunciation, text: "Глаголы на -OWAĆ в настоящем времени меняют -owa- на -uj-, и это третий способ, каким польская основа может перестраиваться. DOPILNOWAĆ даёт DOPILNUJĘ, DOPILNUJESZ, DOPILNUJE, DOPILNUJĄ, а повелительное — DOPILNUJ. Сравните с двумя уже разобранными: глаголы на -AWAĆ держат две основы (DAWAĆ при DAJE, но повелительное DAWAJ, карточка KARMIĆ), а глаголы на -YWAĆ тоже переходят в -uj- (WSTRZYMYWAĆ при WSTRZYMUJĘ, карточка WSTRZYMAĆ). То есть -OWAĆ и -YWAĆ ведут себя одинаково, а -AWAĆ стоит особняком." }
  - { kind: usage, text: "Пятьдесят три формы — совершенный переходный: сорок одна основная, одиннадцать страдательных причастий и деепричастие DOPILNOWAWSZY. Приставка do- означает здесь «довести до конца», как в DOKOŃCZYĆ или DOCZYTAĆ: PILNOWAĆ — следить за чем-то, DOPILNOWAĆ — доследить до результата. Поэтому несовершенной пары в обычном смысле у глагола нет: PILNOWAĆ не «присматривать однократно», а просто «следить», и приставка меняет не только вид, но и смысл." }
collocations:
