# review
id: niz
format: 2
lemma: "niż"
rank: 162
pos: conj
pron: { cyr: "ниш" }
senses:
  - id: than
    ru: "чем (при сравнении)"
    note: "После niż слово стоит в том же падеже, что и сравниваемое: Jestem starszy niż on."
    examples:
      - pl: "To lepsze niż nic."
        ru: "Это лучше, чем ничего."
        source: { kind: tatoeba, id: 4716901 }
      - pl: "Tom mówi wolniej niż Bill."
        ru: "Том говорит медленнее Билла."
        source: { kind: tatoeba, id: 350774 }
      - pl: "Szkoła jest dalej niż dworzec."
        ru: "Школа находится дальше, чем вокзал."
        source: { kind: tatoeba, id: 692628 }
  - id: more-than
    ru: "чем (при количестве и степени)"
    examples:
      - pl: "Był więcej niż królem."
        ru: "Он был больше чем король."
        source: { kind: tatoeba, id: 10631713 }
      - pl: "Lepiej mniej niż wcale."
        ru: "Лучше меньше, чем ничего."
        source: { kind: tatoeba, id: 7727830 }
      - pl: "Mleko lubię bardziej, niż sok."
        ru: "Я больше люблю молоко, чем сок."
        source: { kind: tatoeba, id: 554245 }
notes:
  - { kind: usage, text: "Сравнение строится двумя способами: starszy niż on и starszy od niego (od + родительный). Русское «старше его» ближе ко второму." }
  - { kind: usage, text: "После niż падеж не меняется: Lubię psy bardziej niż koty. После od меняется: Lubię psy bardziej od kotów." }
  - { kind: false-friend, text: "Существительное niż значит «циклон» или «низина» — отсюда в словарях формы niżu, niże, niżem. К союзу они отношения не имеют." }
collocations:
  - { pl: "więcej niż", ru: "больше чем" }
  - { pl: "mniej niż", ru: "меньше чем" }
  - { pl: "lepiej niż", ru: "лучше чем" }
  - { pl: "inny niż", ru: "иной чем" }
etymology: "От niski «низкий» через сравнительную степень niżej: исходно «ниже чем». Русское «чем» образовано от другого корня."
memory: "Два способа сравнения: starszy niż on и starszy od niego. После niż падеж не меняется, после od — родительный. А niżu и niże — формы другого слова, niż «циклон»."
idioms:
  - { pl: "lepiej późno niż wcale", ru: "лучше поздно, чем никогда" }
  - { pl: "więcej niż dobrze", ru: "более чем хорошо" }
  - { pl: "inny niż wszyscy", ru: "не такой, как все" }
