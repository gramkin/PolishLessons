# review
id: znaczyc
format: 2
lemma: "znaczyć"
rank: 155
pos: verb
aspect: imperf
pron: { cyr: "зна́чыць" }
senses:
  - id: mean
    ru: "значить, означать"
    examples:
      - pl: "Nie wiem co to znaczy."
        ru: "Я не знаю, что это значит."
        source: { kind: tatoeba, id: 5837080 }
      - pl: "To zdanie nic nie znaczy."
        ru: "Это предложение ничего не означает."
        source: { kind: tatoeba, id: 1176599 }
      - pl: "Czy to znaczy, że mamy problemy?"
        ru: "Это значит, что у нас проблемы?"
        source: { kind: tatoeba, id: 2238561 }
  - id: matter
    ru: "значить, иметь вес (для кого-либо)"
    examples:
      - pl: "Więcej nie zawsze znaczy gorzej."
        ru: "Большое количество не всегда значит плохое качество."
        source: { kind: tatoeba, id: 12692424 }
      - pl: "Twoje zdanie wiele dla mnie znaczy."
        ru: "Твоё мнение много для меня значит."
        source: { kind: authored }
      - pl: "Przyjaźń znaczy dla niego wszystko."
        ru: "Дружба значит для него всё."
        source: { kind: authored }
  - id: mark
    ru: "метить, помечать (ставить знак)"
    note: "Конкретное значение того же корня: znak «знак» → znaczyć «ставить знак»."
    examples:
      - pl: "Leśnik znaczy drzewa farbą."
        ru: "Лесник метит деревья краской."
        source: { kind: authored }
      - pl: "Kto znaczył te karty?"
        ru: "Кто крапил эти карты?"
        source: { kind: authored }
      - pl: "Znaczy owce, żeby ich nie pomylić."
        ru: "Он метит овец, чтобы их не перепутать."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Co to znaczy? — «Что это значит?»; Co to ma znaczyć? — «Что это должно означать?» (с оттенком возмущения)." }
  - { kind: usage, text: "Существительное — znaczenie «значение»: mieć znaczenie «иметь значение», bez znaczenia «неважно»." }
  - { kind: usage, text: "Причастие znaczący значит «значительный»: znacząca rola «значительная роль»." }
collocations:
  - { pl: "co to znaczy?", ru: "что это значит?" }
  - { pl: "mieć znaczenie", ru: "иметь значение" }
  - { pl: "bez znaczenia", ru: "неважно" }
  - { pl: "to znaczy", ru: "то есть" }
etymology: "От znak «знак» — то же слово, что русское «знак»; отсюда и znaczyć «значить», и znaczyć «ставить знак, метить»."
memory: "Co to znaczy? — «Что это значит?». Существительное — znaczenie «значение», а to znaczy — «то есть». И помните второе, конкретное значение: znaczone karty «краплёные карты»."
idioms:
  - { pl: "to nic nie znaczy", ru: "это ничего не значит" }
  - { pl: "co to ma znaczyć?", ru: "что это значит?" }
  - { pl: "znaczone karty", ru: "краплёные карты" }
