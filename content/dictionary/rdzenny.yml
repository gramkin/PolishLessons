notes:
  - { kind: usage, text: "RDZENNY — это «коренной» о людях (RDZENNI MIESZKAŃCY «коренные жители», RDZENNA LUDNOŚĆ «коренное население», RDZENNI AMERYKANIE «коренные американцы») и «исконный» о языке и традиции (RDZENNE SŁOWNICTWO «исконная лексика»). Степени сравнения в таблице есть и встречаются в книжной речи о «подлинности»: NAJRDZENNIEJSZA POLSZCZYZNA «самый исконный польский», RDZENNIEJSZY WARIANT «более исконный вариант». В обычном разговоре о людях слово не сравнивают." }
  - { kind: false-friend, text: "Русское «коренной» шире польского RDZENNY. «Коренной зуб» — ZĄB TRZONOWY, «коренной перелом» — PRZEŁOM, «коренные изменения» — ZASADNICZE ZMIANY, а «коренной» в смысле «основной» — GŁÓWNY или PODSTAWOWY. RDZENNY годится только для «коренного жителя» и «исконного слова». Близкие синонимы — RODOWITY «урождённый» (RODOWITY KRAKOWIANIN) и TUBYLCZY «туземный»." }
  - { kind: pronunciation, text: "Читается «рдзэ́нны»: начальное R сразу переходит в DZ — слитное «дз», без гласной между ними. Двойное NN произносится долго, как в русском «длинный». Ударение на предпоследнем слоге; в сравнительной степени «рдзэнне́йшы»." }
collocations:
  - { pl: "rdzenni mieszkańcy", ru: "коренные жители" }
  - { pl: "rdzenna ludność", ru: "коренное население" }
  - { pl: "rdzenne słownictwo", ru: "исконная лексика" }
family:
  - { pl: "rdzeń", ru: "сердцевина; корень слова", relation: root, id: rdzen }
  - { pl: "rdzennie", ru: "исконно", relation: derived }
  - { pl: "rdzenność", ru: "исконность", relation: derived }
etymology: "Образовано от RDZEŃ «сердцевина, стержень; корень слова»: «коренной» по-польски буквально «сердцевинный», то есть принадлежащий самой сути. Русское «коренной» построено так же, только от «корня»."
memory: "RDZEŃ — «сердцевина», RDZENNY — «коренной, исконный»: русские говорят «от корня», поляки — «от сердцевины». RDZENNI MIESZKAŃCY — «коренные жители»; но коренной зуб — ZĄB TRZONOWY."
