notes:
  - { kind: false-friend, text: "JEJKU — «ой», «батюшки». К местоимению JEJ «её» отношения не имеет. Это уменьшительная форма от JEJ, сокращения JEZUS, но говорящие этого не ощущают." }
  - { kind: usage, text: "Неизменяемое междометие. Варианты: OJEJKU, JEJU, JEJCIU. Все звучат мягко, по-детски." }
  - { kind: government, text: "Ничем не управляет. Часто перед восклицанием с JAK или ALE: JEJKU, ALE ZIMNO!" }
  - { kind: pronunciation, text: "Читается «е́йку»: начальное JE — «е», J перед K — «й». Ударение на первом слоге." }
  - { kind: register, text: "Разговорное, детское или ласковое. В серьёзной речи не употребляется." }
