# review
id: obrazenie
format: 2
lemma: "obrażenie"
rank: 4952
pos: noun
pron: { cyr: "ображе́не" }
senses:
  - id: injury
    ru: "травма, телесное повреждение (обычно мн.)"
    examples:
      - pl: "Kierowca odniósł ciężkie obrażenia."
        ru: "Водитель получил тяжёлые травмы."
        source: { kind: authored }
      - pl: "Obrażenia głowy były poważne."
        ru: "Травмы головы были серьёзными."
        source: { kind: authored }
      - pl: "Pasażerowie wyszli z wypadku bez obrażeń."
        ru: "Пассажиры вышли из аварии без травм."
        source: { kind: authored }
  - id: insulting
    ru: "оскорбление (действие; книжн., юр.)"
    examples:
      - pl: "Oskarżono go o obrażenie sędziego."
        ru: "Его обвинили в оскорблении судьи."
        source: { kind: authored }
      - pl: "Za obrażenie funkcjonariusza grozi kara."
        ru: "За оскорбление сотрудника полиции грозит наказание."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Главная ловушка: OBRAŻENIA — «травмы, телесные повреждения», а не «оскорбления». ODNIEŚĆ OBRAŻENIA — «получить травмы» в аварии или драке. Само «оскорбление» по-польски обычно OBRAZA. Корень у слов общий, OBRAZIĆ — «оскорбить», но в медицине и полицейских сводках OBRAŻENIA — всегда раны и ушибы." }
  - { kind: usage, text: "Восемь форм, средний род. В значении «травмы» почти всегда множественное: OBRAŻENIA GŁOWY, CIĘŻKIE OBRAŻENIA. Родительный множественного — OBRAŻEŃ: BEZ OBRAŻEŃ." }
  - { kind: government, text: "Получить травмы — ODNIEŚĆ OBRAŻENIA, винительный. Без травм — BEZ OBRAŻEŃ, родительный. Умереть от травм — ZMARŁ W WYNIKU OBRAŻEŃ, родительный." }
  - { kind: pronunciation, text: "Читается «ображе́не», четыре слога, ударение на третьем. Ż — «ж», NIE — «не». В родительном множественного OBRAŻEŃ: «обра́жень»." }
  - { kind: register, text: "Слово официальное, из медицинских заключений и полицейских сводок: DOZNAŁ OBRAŻEŃ — «получил травмы». В быту говорят проще: URAZ, RANA, SINIAK." }
collocations:
  - { pl: "ciężkie obrażenia", ru: "тяжёлые травмы" }
  - { pl: "lekkie obrażenia", ru: "лёгкие травмы" }
  - { pl: "obrażenia wewnętrzne", ru: "внутренние повреждения" }
family:
  - { pl: "obrazić", ru: "оскорбить; (стар.) поранить", relation: root, id: obrazic }
  - { pl: "obraza", ru: "оскорбление", relation: derived, id: obraza }
  - { pl: "obrazony", ru: "обиженный", relation: derived }
etymology: "От OBRAZIĆ, а тот от RAZIĆ «поражать, ударять», того же корня, что русские «разить» и «поражать». Сначала глагол значил «поранить», потом — «оскорбить»; существительное OBRAŻENIA сохранило старый, телесный смысл."
memory: "Obrażenia — травмы, телесные повреждения, а не оскорбления. Читается «ображе́не». Odnieść obrażenia — получить травмы. Bez obrażeń — без травм. Оскорбление — obraza."
idioms:
  - { pl: "odnieść obrażenia", ru: "получить травмы" }
  - { pl: "obrażenia ciała", ru: "телесные повреждения" }
