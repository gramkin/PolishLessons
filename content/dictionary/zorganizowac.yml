# review
id: zorganizowac
format: 2
lemma: "zorganizować"
rank: 2071
pos: verb
pron: { cyr: "зорганизо́ваць" }
senses:
  - id: organise
    ru: "организовать, устроить"
    examples:
      - pl: "Zorganizowali konferencję w dwa tygodnie."
        ru: "Они организовали конференцию за две недели."
        source: { kind: authored }
      - pl: "Zorganizuj spotkanie na przyszły piątek."
        ru: "Организуй встречу на будущую пятницу."
        source: { kind: authored }
      - pl: "Wszystko zorganizowano bez nas."
        ru: "Всё организовали без нас."
        source: { kind: authored }
  - id: get-hold-of
    ru: "разг. раздобыть, достать"
    examples:
      - pl: "Trzeba zorganizować stół i krzesła."
        ru: "Надо раздобыть стол и стулья."
        source: { kind: authored }
      - pl: "Zorganizował skądś drabinę."
        ru: "Он откуда-то достал лестницу."
        source: { kind: authored }
  - id: organised
    ru: "zorganizowany — организованный; собранный (о человеке)"
    examples:
      - pl: "To bardzo zorganizowana osoba."
        ru: "Это очень собранный человек."
        source: { kind: authored }
      - pl: "Dobrze zorganizowana praca idzie szybciej."
        ru: "Хорошо организованная работа идёт быстрее."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Слово заимствованное, и в русский оно пришло тем же путём, поэтому zorganizować и «организовать» совпадают почти буква в букву. Но у польского есть РАЗГОВОРНОЕ значение, которого у русского нет: zorganizować coś значит «раздобыть, достать». Trzeba zorganizować stół — это не про устройство мероприятия, а про то, что стол надо где-то найти." }
  - { kind: pronunciation, text: "МЕЖДУНАРОДНЫЕ ГЛАГОЛЫ ПОЛЬСКИЙ ПРИНИМАЕТ ОДИНАКОВО: латинский или французский корень плюс -ować, а настоящее время по правилу -uj-. Zorganizować даёт zorganizuję, zaoferować — zaoferuję, так же pracować — pracuję и dziękować — dziękuję. Зная окончание неопределённой формы, спряжение строить не нужно — оно одно на всю группу." }
  - { kind: government, text: "Организуют ЧТО — винительный: zorganizować spotkanie, pomoc, transport. Кому — дательный: zorganizować komuś nocleg. Обе модели совпадают с русскими, так что фразу можно строить по родному образцу." }
  - { kind: usage, text: "Вид совершенный, несовершенная пара — organizować. Причастие zorganizowany о ЧЕЛОВЕКЕ значит «собранный, дисциплинированный»: jest bardzo zorganizowany — «он очень собранный». Русское «организованный» о человеке звучит слабее, чаще скажут «собранный» или «дисциплинированный»." }
collocations:
  - { pl: "zorganizować spotkanie", ru: "организовать встречу" }
  - { pl: "dobrze zorganizowany", ru: "хорошо организованный" }
  - { pl: "zorganizować pomoc", ru: "организовать помощь" }
family:
  - { pl: "organizacja", ru: "организация", relation: root, id: organizacja }
  - { pl: "organizować", ru: "организовывать", relation: aspect }
  - { pl: "organizator", ru: "организатор", relation: derived }
etymology: "Приставка z- плюс organizować, от латинского organizare через французский и немецкий. Русское «организовать» — то же заимствование и тем же путём, отсюда полное совпадение. Из того же гнезда organizacja, organizator и organizm."
memory: "zorganizować — «организовать», слово общее с русским. Запомните только разговорное второе значение: zorganizować coś это ещё и «раздобыть». И что zorganizowany о человеке значит «собранный»."
idioms:
  - { pl: "zorganizować coś na szybko", ru: "организовать что-л. на скорую руку" }
  - { pl: "dobrze zorganizowany człowiek", ru: "собранный человек" }
