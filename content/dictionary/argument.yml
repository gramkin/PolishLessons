        ru: "Укажи аргумент в скобках."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ARGUMENT — «довод», а не «спор». Спор — KŁÓTNIA или SPÓR. По-английски ARGUMENT значит и «ссора», а по-польски нет: MIELIŚMY KŁÓTNIĘ, «мы поссорились»." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Родительный — ARGUMENTU. В местном T переходит в C: W ARGUMENCIE." }
  - { kind: government, text: "Довод за что — ARGUMENT ZA и винительный, против — PRZECIW и дательный: ARGUMENT PRZECIW PODWYŻCE. Привести довод — PRZYTOCZYĆ ARGUMENT." }
  - { kind: pronunciation, text: "Читается «аргу́мэнт», ударение на предпоследнем слоге. ME — твёрдое «мэ». ARGUMENCIE — «аргумэ́нце»." }
collocations:
  - { pl: "mocny argument", ru: "сильный довод" }
  - { pl: "argument za", ru: "довод в пользу" }
  - { pl: "przytoczyć argument", ru: "привести довод" }
family:
  - { pl: "argumentować", ru: "аргументировать", relation: derived }
  - { pl: "racja", ru: "правота", relation: root, id: racja }
  - { pl: "dowód", ru: "доказательство", relation: root, id: dowod }
etymology: "Из латинского ARGUMENTUM «доказательство», от ARGUERE «показывать, доказывать». Русское «аргумент» — то же слово."
memory: "Argument — довод, а не ссора: ссора — kłótnia. Argument za, argument przeciw. Читается «аргу́мэнт»."
