# review
id: nieodpowiedni
format: 2
lemma: "nieodpowiedni"
rank: 5306
pos: adj
pron: { cyr: "неотпове́дни" }
senses:
  - id: unsuitable
    ru: "неподходящий, неуместный"
    examples:
      - pl: "To nieodpowiedni moment na żarty."
        ru: "Это неподходящий момент для шуток."
        source: { kind: authored }
      - pl: "Film jest nieodpowiedni dla dzieci."
        ru: "Фильм не подходит для детей."
        source: { kind: authored }
      - pl: "Wybrał nieodpowiednie słowa."
        ru: "Он выбрал неподходящие слова."
        source: { kind: authored }
  - id: improper
    ru: "неподобающий, неприличный (о поведении)"
    examples:
      - pl: "Jego zachowanie było nieodpowiednie."
        ru: "Его поведение было неподобающим."
        source: { kind: authored }
      - pl: "Zwrócono mu uwagę za nieodpowiedni strój."
        ru: "Ему сделали замечание за неподобающую одежду."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "NIEODPOWIEDNI не значит «безответственный»: это NIEODPOWIEDZIALNY. NIEODPOWIEDNI — «неподходящий»: NIEODPOWIEDNI CZAS, NIEODPOWIEDNIE MIEJSCE. Оба от ODPOWIADAĆ, но ODPOWIEDNI — «соответствующий», а ODPOWIEDZIALNY — «ответственный»." }
  - { kind: usage, text: "Десять форм на мягкую основу: -NI, -NIA, -NIE, -NIEGO, -NIM. Форма для мужчин-людей совпадает с мужским единственным: NIEODPOWIEDNI LUDZIE, «неподходящие люди». Степеней у слова на практике нет." }
  - { kind: government, text: "Для кого или чего — DLA с родительным: NIEODPOWIEDNI DLA DZIECI. Для цели — DO с родительным: NIEODPOWIEDNI DO PRACY W OGRODZIE. Не дательный, как в русском «непригодный кому»." }
  - { kind: pronunciation, text: "Читается «неотпове́дни», пять слогов, ударение на предпоследнем. D перед P оглушается в «т», IE после W — «ве», конечное NI мягкое." }
  - { kind: register, text: "Нейтральное, немного официальное слово: на табличках, в школе, в правилах. NIEODPOWIEDNIE TREŚCI — «неприемлемый контент». В разговоре чаще ZŁY: ZŁY MOMENT, ZŁY POMYSŁ." }
collocations:
  - { pl: "nieodpowiedni moment", ru: "неподходящий момент" }
  - { pl: "nieodpowiedni dla dzieci", ru: "не для детей" }
  - { pl: "nieodpowiednie zachowanie", ru: "неподобающее поведение" }
family:
  - { pl: "odpowiedni", ru: "подходящий, соответствующий", relation: root, id: odpowiedni }
  - { pl: "odpowiadać", ru: "отвечать; соответствовать", relation: root, id: odpowiadac }
  - { pl: "nieodpowiedzialny", ru: "безответственный", relation: root }
etymology: "Отрицание NIE- к ODPOWIEDNI «соответствующий», от ODPOWIADAĆ «отвечать, соответствовать», с корнем WIED- «ведать». Буквально «не отвечающий требованиям»."
memory: "Nieodpowiedni — неподходящий: nieodpowiedni moment, nieodpowiedni dla dzieci. Безответственный — nieodpowiedzialny! Читается «неотпове́дни»."
