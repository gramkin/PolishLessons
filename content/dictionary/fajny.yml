# review
id: fajny
format: 2
lemma: "fajny"
rank: 877
pos: adj
pron: { cyr: "фа́йны" }
senses:
  - id: nice
    ru: "классный, клёвый, славный"
    note: "Разговорное, но совершенно обиходное слово."
    examples:
      - pl: "To jest bardzo fajne!"
        ru: "Это очень круто!"
        source: { kind: tatoeba, id: 13789582 }
      - pl: "Jesteś fajny."
        ru: "Ты классный."
        source: { kind: translated, id: 5665003 }
      - pl: "Fajny dzień, prawda?"
        ru: "Классный день, правда?"
        source: { kind: translated, id: 789057 }
  - id: thing
    ru: "о вещах и занятиях: здорово, классно"
    examples:
      - pl: "Puzzle są fajne."
        ru: "Пазлы — это классно."
        source: { kind: translated, id: 10624152 }
      - pl: "Narty to fajna sprawa."
        ru: "Лыжи — классная штука."
        source: { kind: translated, id: 733071 }
      - pl: "Wiosna to fajna pora roku."
        ru: "Весна — классное время года."
        source: { kind: translated, id: 12044293 }
  - id: person
    ru: "о человеке: славный, хороший"
    examples:
      - pl: "Tom był fajnym facetem."
        ru: "Том был классным парнем."
        source: { kind: translated, id: 4005217 }
      - pl: "Masz fajną żonę."
        ru: "У тебя классная жена."
        source: { kind: translated, id: 13069677 }
      - pl: "Czy są jacyś fajni chłopcy w twojej klasie?"
        ru: "В твоём классе есть классные ребята?"
        source: { kind: translated, id: 7333827 }
notes:
  - { kind: register, text: "Слово разговорное, но вполне приличное и очень частое: так говорят и дети, и взрослые. Русские соответствия — «классный, клёвый, славный». В официальной речи его избегают, заменяя на dobry, przyjemny, udany." }
  - { kind: usage, text: "Наречие — fajnie «классно, здорово»: Było fajnie «Было классно». Ответ Fajnie! значит «Здорово!»." }
  - { kind: usage, text: "Степени сравнения образуются обычным способом и звучат естественно: fajniejszy «классней», najfajniejszy «самый классный»." }
  - { kind: usage, text: "Слово пришло из немецкого fein «тонкий, изящный» — через студенческий жаргон XIX века. С русским «файный» в западных говорах источник один и тот же." }
collocations:
  - { pl: "fajny facet", ru: "классный парень" }
  - { pl: "fajnie!", ru: "здорово!" }
  - { pl: "fajna sprawa", ru: "классное дело" }
  - { pl: "coś fajnego", ru: "что-нибудь классное" }
family:
  - { pl: "fajnie", ru: "классно", relation: derived }
  - { pl: "fajowy", ru: "клёвый", relation: derived }
etymology: "Из немецкого fein «тонкий, изящный», через студенческий жаргон XIX века. То же слово попало в западные русские говоры как «файный»."
memory: "fajny — «классный, клёвый», слово разговорное, но совершенно обиходное: так говорят все. В официальной речи его меняют на dobry или przyjemny. Наречие — fajnie «здорово», и Fajnie! часто звучит само по себе."
idioms:
  - { pl: "fajny facet", ru: "классный парень" }
  - { pl: "fajnie!", ru: "здорово!" }
  - { pl: "coś fajnego", ru: "что-нибудь классное" }
