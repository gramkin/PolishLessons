notes:
  - { kind: usage, text: "Слово разбирается на знакомые части: приставка WY- и корень SIŁA «сила», то есть «то, что выжимают из силы». Русское «усилие» собрано из тех же кирпичей, только с приставкой «у»: «у» плюс «сила». Отсюда и близость значений, и разница в сочетаемости. По-польски усилие ВКЛАДЫВАЮТ: WŁOŻYĆ WYSIŁEK W COŚ, буквально «вложить усилие во что-то», а русский скорее «приложит усилия». Ещё два частых оборота: BEZ WYSIŁKU «без усилий, легко» и NIE BEZ WYSIŁKU «не без труда». О физической нагрузке говорят WYSIŁEK FIZYCZNY, и это стандартный медицинский термин." }
  - { kind: pronunciation, text: "Читается «выси́уэк», ударение на предпоследнем слоге. Главное — буква Ł: она даёт не «л», а «у», как в POSŁAĆ «по́суаць» и WYSŁAĆ «вы́суаць». Поэтому не «высилек», а «выси́уэк». В косвенных падежах беглая гласная E выпадает: WYSIŁEK, но WYSIŁKU, WYSIŁKIEM, WYSIŁKI — и тогда Ł оказывается перед согласной и всё равно звучит «у»: «выси́уку»." }
  - { kind: government, text: "Мужской род, неодушевлённое. Особенность парадигмы в том, что родительный и местный падеж единственного числа совпадают в одной форме WYSIŁKU: BEZ WYSIŁKU «без усилия» и PO WYSIŁKU «после нагрузки». Поэтому в таблице у слова девять форм, а не десять, как у PASZPORT с его отдельным PASZPORCIE. Предмет усилия вводится предлогом W с винительным: WŁOŻYĆ WYSIŁEK W NAUKĘ. При отрицании винительный уходит в родительный: NIE WŁOŻYŁ WYSIŁKU." }
  - { kind: stress, text: "Ударение всегда на предпоследнем слоге, но при выпадении беглой гласной слогов становится меньше, и ударение переезжает: WY-SI-ŁEK даёт «выси́уэк», а WY-SIŁ-KU даёт «выси́уку» — в обоих случаях предпоследний слог, но это разные слоги. Во множественном числе WYSIŁKAMI ударение уходит дальше вправо: «высиука́ми». Это общее правило польского, и слово с беглой гласной показывает его особенно наглядно." }
