etymology: "От глагола WYSILIĆ SIĘ «напрячься», а тот — от SIŁA «сила» с приставкой WY-, которая в польском означает движение изнутри наружу и доведение до конца: WYJŚĆ «выйти», WYPIĆ «выпить до дна». Буквально WYSIŁEK — то, что из силы выжато. Русское «усилие» устроено по той же модели, но с приставкой «у», и это хороший случай увидеть, как два языка собирают одно понятие из одних деталей разными способами. Корень общий и древний: праславянское *sila дало и SIŁA, и «силу». Польское Ł на месте русского Л здесь не исключение, а правило: Ł продолжает тот же звук, но произносится как «у»."
memory: "wy- плюс siła: «то, что выжато из силы». Русское «усилие» — те же части с приставкой «у». По-польски усилие вкладывают: włożyć wysiłek w coś. Родительный и местный совпадают в одной форме wysiłku, поэтому в парадигме девять форм, а не десять. Читается «выси́уэк», где ł даёт «у»."
idioms:
