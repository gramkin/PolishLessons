etymology: "От прилагательного DOBRY, от праславянского *dobrъ, то есть от того же слова, что русское «добрый». Суффикс здесь -OĆ, более старый и более редкий, чем обычное -OŚĆ, и в русском ему отвечает -ОТА: DOBROĆ и «доброта», WILGOĆ и «сырость», хотя последняя пара уже не совпадает по суффиксу. Прилагательное развело значения по-разному: польский оставил DOBRY главным словом для «хорошего», а русский развёл «добрый» и «хороший» по двум словам. Из того же гнезда DOBRO «добро», DOBRZE «хорошо» и ZADOWOLONY «довольный»."
memory: "Суффикс здесь редкий, -oć вместо обычного -ość, и русскому отвечает -ота: dobroć и «доброта». Форм всё равно шесть. Главная поправка в прилагательном: польское dobry это прежде всего «хороший», dobry film, dobra robota, а не «добрый». Управление поправить: dobroć DLA zwierząt с родительным, где русский ставит «к» с дательным. Готовая формула z dobroci serca отвечает нашему «по доброте душевной». Читается «до́брочь», с мягким «чь» на конце."
