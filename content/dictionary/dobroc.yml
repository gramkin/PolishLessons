notes:
  - { kind: usage, text: "Здесь суффикс не -OŚĆ, а его более редкий брат -OĆ, и форм всё равно шесть: DOBROĆ, DOBROCI, DOBROCIĄ, DOBROCIOM, DOBROCIAMI, DOBROCIACH. По этому же образцу устроены WILGOĆ «сырость» и SŁODYCZ, так что разряд существует, просто он маленький. Склоняется слово как любое женское на мягкую согласную. Множественное число почти не нужно: отвлечённое качество не считают, и DOBROCI годится разве что для перечисления добрых дел." }
  - { kind: false-friend, text: "Поправка касается прилагательного, и она важнее самого слова. Польское DOBRY — это в первую очередь «хороший», а не «добрый»: DOBRY FILM «хороший фильм», DOBRA ROBOTA «хорошая работа», DOBRZE «хорошо». Русское «добрый» о фильме не скажут. Когда речь именно о доброте человека, поляк тоже употребит DOBRY, но контекст сделает это ясным: DOBRY CZŁOWIEK. Существительное же DOBROĆ однозначно и означает только доброту, без всякого оттенка качества." }
  - { kind: government, text: "Доброта к кому — предлог DLA с родительным: DOBROĆ DLA ZWIERZĄT «доброта к животным», тогда как русский ставит «к» с дательным, так что падеж приходится менять. По доброте — Z с родительным: Z DOBROCI SERCA, готовая формула, отвечающая русскому «по доброте душевной». Воспользоваться чьей-то добротой — NADUŻYĆ CZYJEJŚ DOBROCI, родительный, потому что глагол NADUŻYĆ родительного и требует." }
  - { kind: pronunciation, text: "Читается «до́брочь», два слога, ударение на первом. Конечное Ć мягкое, «чь», и это единственная трудность: твёрдое «ч» на конце прозвучит как другое слово. Буква O в обоих слогах чистая, без носового оттенка. В родительном DOBROCI слогов становится три: «до́брочи». В прилагательном DOBRY слышно «до́бры», с «ы» на конце, а в наречии DOBRZE — «до́бже», потому что RZ даёт «ж»." }
  - { kind: register, text: "Слово нейтральное, с тёплым и слегка книжным оттенком, из тех, что встречаются в воспоминаниях и в надгробных речах. Частые обороты: Z DOBROCI SERCA «по доброте душевной», OKAZAĆ DOBROĆ «проявить доброту», NADUŻYĆ DOBROCI «воспользоваться добротой». В живой речи чаще скажут прилагательным: ONA JEST BARDZO DOBRA. Существительное DOBRO того же корня значит «добро» как отвлечённое понятие и противопоставляется ZŁO." }
