# review
id: podobny
format: 2
lemma: "podobny"
rank: 567
pos: adj
pron: { cyr: "подо́бны" }
senses:
  - id: similar
    ru: "похожий (на кого-л., что-л.)"
    examples:
      - pl: "Uran jest podobny do Neptuna."
        ru: "Уран похож на Нептун."
        source: { kind: tatoeba, id: 5961624 }
      - pl: "Jest podobna do matki."
        ru: "Она похожа на мать."
        source: { kind: tatoeba, id: 757266 }
      - pl: "Jesteśmy bardzo podobni."
        ru: "Мы очень похожи."
        source: { kind: tatoeba, id: 3778924 }
  - id: such
    ru: "подобный, такой же (в оборотах nic podobnego, coś podobnego)"
    note: "В этом значении почти всегда в устойчивых оборотах, как русское «ничего подобного»."
    examples:
      - pl: "Nic podobnego nie mówiłem."
        ru: "Ничего подобного я не говорил."
        source: { kind: authored }
      - pl: "Coś podobnego! Nie spodziewałem się."
        ru: "Надо же! Я не ожидал."
        source: { kind: authored }
      - pl: "W podobnych sytuacjach lepiej milczeć."
        ru: "В подобных ситуациях лучше молчать."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Управление чужое русскому: podobny do + родительный. podobny do ojca «похож на отца», а не «na ojca». Это одна из самых частых ошибок." }
  - { kind: usage, text: "Обороты учите целиком: nic podobnego «ничего подобного», coś podobnego! «надо же!», i tym podobne (сокращённо itp.) «и тому подобное»." }
  - { kind: false-friend, text: "Наречие podobno значит не «подобно», а «говорят, будто бы»: Podobno wyjechał «Говорят, он уехал». Чтобы сказать «подобно», нужно podobnie." }
  - { kind: usage, text: "Краткая форма podobien — архаичная, живёт в книжной речи и поговорках и управляет дательным: podobien ojcu. В современном языке берите podobny do." }
collocations:
  - { pl: "podobny do ojca", ru: "похож на отца" }
  - { pl: "nic podobnego", ru: "ничего подобного" }
  - { pl: "coś podobnego!", ru: "надо же!" }
  - { pl: "i tym podobne", ru: "и тому подобное" }
family:
  - { pl: "podobać się", ru: "нравиться", relation: derived, id: podobac }
  - { pl: "podobnie", ru: "похоже, подобно", relation: derived }
  - { pl: "podobieństwo", ru: "сходство", relation: derived }
etymology: "От podobać się «нравиться», в основе то же *dob-, что в dobry «хороший» и в русском «подобать»: буквально «такой, какой подобает, впору». Русское «подобный» — та же основа."
memory: "podobny — «похожий», но управление своё: podobny do ojca, с предлогом do и родительным падежом. Русская модель «похож на отца» сюда не переносится — *podobny na ojca ошибка. Обороты берите целиком: nic podobnego «ничего подобного», coś podobnego! «надо же!», i tym podobne «и тому подобное». И держите в стороне наречие podobno — оно значит «говорят»: Podobno wyjechał."
idioms:
  - { pl: "nic podobnego!", ru: "ничего подобного!" }
  - { pl: "coś podobnego!", ru: "надо же!" }
  - { pl: "podobni jak dwie krople wody", ru: "похожи как две капли воды" }
