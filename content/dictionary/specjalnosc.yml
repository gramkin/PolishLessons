notes:
  - { kind: false-friend, text: "Первое значение совпадает с русским, второе удивляет. SPECJALNOŚĆ ZAKŁADU — это «фирменное блюдо», и такая строчка стоит в польском меню постоянно; слово SPECJALNOŚĆ там просто означает то, что в этом заведении умеют лучше всего. Ещё одна поправка в наречии: SPECJALNIE значит и «специально», и «особенно», поэтому оборот NIC SPECJALNEGO переводится как «ничего особенного», а не «ничего специального». А вопрос CZY SPECJALNIE значит «нарочно ли»." }
  - { kind: usage, text: "Шесть форм, разряд женских существительных на -OŚĆ, суффикс отвечает русскому -ОСТЬ. Множественное число употребляется свободно в первом значении, потому что специальностей много: SPECJALNOŚCI LEKARSKIE «врачебные специальности». Во втором значении слово остаётся в единственном. Рядом стоит SPECJALISTA «специалист», и в польской медицине это слово определяет всю систему: LEKARZ SPECJALISTA — это врач с узкой специализацией, к которому нужно направление." }
  - { kind: government, text: "По какой специальности — предлог Z с родительным: Z JAKIEJ SPECJALNOŚCI, EGZAMIN Z TEJ SPECJALNOŚCI, тогда как русский ставит предлог «по» с дательным, так что конструкцию надо менять целиком. Специальность чего или чья — родительный без предлога: SPECJALNOŚĆ ZAKŁADU, SPECJALNOŚCI UCZELNI. Прилагательное SPECJALNY управления не имеет: SPECJALNA OFERTA «специальное предложение»." }
  - { kind: pronunciation, text: "Читается «спеця́льносьчь», четыре слога, ударение на втором. Сочетание CJ произносится слитно, как «ць» с последующим «я», то есть «ця», а не «ци-я», и это общее правило для всего разряда слов на -CJA и -CJAL. Буква L перед N звучит мягко, «ль». Конец слова, -ŚĆ, это два мягких звука подряд, «сьчь». В прилагательном SPECJALNY слышно «спеця́льны»." }
  - { kind: register, text: "Слово нейтральное, живёт в двух совсем разных областях: в образовании и в общепите. Частые обороты: SPECJALNOŚĆ ZAKŁADU «фирменное блюдо», SPECJALNOŚĆ DOMU в том же смысле, SPECJALNOŚCI LEKARSKIE «врачебные специальности», KIERUNEK I SPECJALNOŚĆ «направление и специальность» в документах вуза. Производное SPECJALIZACJA значит «специализация», а глагол SPECJALIZOWAĆ SIĘ W CZYMŚ — «специализироваться на чём-то», с местным падежом." }
