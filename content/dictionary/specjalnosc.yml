etymology: "Из латинского SPECIALIS «особый, частный», от SPECIES «вид», и в оба языка слово пришло книжным путём, через западноевропейские языки. Поэтому корень совпадает буква в букву, а различается только оформление: латинское -ITAS дало в польском -NOŚĆ, собранное из своих частей, а в русском -НОСТЬ, собранное точно так же. Второе, кулинарное значение в польском выросло из французского SPÉCIALITÉ DE LA MAISON, и оборот SPECJALNOŚĆ ZAKŁADU — это перевод по частям той же французской формулы."
memory: "Первое значение как в русском, второе из меню: specjalność zakładu это «фирменное блюдо», перевод французского spécialité de la maison. Наречие тоже делится: specjalnie значит и «специально», и «особенно», отсюда nic specjalnego «ничего особенного». Поправить управление: z jakiej specjalności с родительным, где русский говорит «по какой» с дательным. Читается «спеця́льносьчь», где cj звучит слитно, как «ця»."
