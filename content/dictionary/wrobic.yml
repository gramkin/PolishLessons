notes:
  - { kind: register, text: "Главное значение — разговорное, и это стоит отметить до того, как учащийся скажет такое на работе. WROBIĆ KOGOŚ W COŚ значит «подставить» или «впутать», с явной досадой говорящего: WROBILI MNIE W DYŻUR. В официальной речи скажут иначе: WPLĄTAĆ, OBCIĄŻYĆ WINĄ, а о подложном обвинении — SFABRYKOWAĆ ZARZUTY. Грубым слово не считается, но и нейтральным тоже: это язык бытовой жалобы." }
  - { kind: false-friend, text: "Корень ROBIĆ русскому знаком по диалектному «робить» и по слову «работа», но значение у него сдвинуто, и путаница тут постоянная. Польское ROBIĆ значит «ДЕЛАТЬ», а не «работать»: CO ROBISZ? — «что ты делаешь?». «Работать» по-польски PRACOWAĆ, и смешивать их нельзя: PRACUJĘ W BIURZE «я работаю в конторе», но ROBIĘ OBIAD «я готовлю обед». Отсюда и ROBOTA — скорее «работа как дело, задание», а не место службы." }
  - { kind: pronunciation, text: "Повелительное здесь WRÓB, с ó, а не с o, и это та же позиционная мена, что в карточке про NAROBIĆ. Правило: ó появляется в закрытом слоге, то есть когда за гласной идёт согласный на конце слова. WROBI даёт WRÓB, потому что слог закрылся; но в WROBIĘ, WROBISZ, WROBIŁ слог открыт и стоит o. Сравните с NASTAW, где мены нет вовсе: там гласная другая и правило её не затрагивает." }
  - { kind: government, text: "Кого — винительный, во что — предлог W с винительным: WROBIĆ KOGOŚ W KRADZIEŻ, W DYŻUR, W AWANTURĘ. Русский строит так же: «впутать кого-то во что-то». Во втором значении предлог тот же, но дополнение вещественное: WROBIĆ MASŁO W CIASTO. Возвратное DAĆ SIĘ WROBIĆ — «дать себя впутать», и это самый частый оборот: NIE DAM SIĘ WROBIĆ." }
collocations:
  - { pl: "wrobić kogoś w coś", ru: "впутать кого-то во что-то" }
  - { pl: "dać się wrobić", ru: "дать себя впутать" }
  - { pl: "wrobić w dyżur", ru: "впутать в дежурство" }
family:
  - { pl: "wrabiać", ru: "впутывать", relation: aspect }
  - { pl: "robić", ru: "делать", relation: root, id: robic }
  - { pl: "narobić", ru: "наделать", relation: root, id: narobic }
etymology: "Приставка w- «в» и ROBIĆ, из праславянского *robiti «делать, трудиться», от *robъ «работник, раб» — тот же корень, что русские «работа», «раб», «робить». Польский оставил корню значение «делать», а для службы завёл PRACOWAĆ от PRACA; русский поступил наоборот и закрепил корень за работой. Переносное «подставить» выросло из буквального «вработать, вмешать внутрь»: подставленного как бы вмешивают в дело, словно масло в тесто, и он оказывается частью того, к чему не имел отношения."
memory: "robić — «делать», а не «работать»: co robisz? «что делаешь?», pracuję «работаю». А wrobić kogoś — разговорное «подставить, впутать»; повелительное wrób с ó, потому что слог закрылся."
idioms:
  - { pl: "dać się wrobić", ru: "дать себя впутать, попасться" }
  - { pl: "wrobić kogoś w coś", ru: "подставить кого-то, впутать во что-то" }
