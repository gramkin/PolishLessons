# review
id: uwaga
format: 2
lemma: "uwaga"
rank: 393
pos: noun
pron: { cyr: "ува́га" }
senses:
  - id: attention
    ru: "внимание"
    examples:
      - pl: "Uwaga!"
        ru: "Внимание!"
        source: { kind: tatoeba, id: 3743442 }
      - pl: "Proszę o uwagę."
        ru: "Прошу внимания."
        source: { kind: tatoeba, id: 908249 }
      - pl: "Ceny nie braliśmy pod uwagę."
        ru: "Мы не обращали внимание на цены."
        source: { kind: tatoeba, id: 739022 }
  - id: remark
    ru: "замечание, реплика"
    examples:
      - pl: "Twoja uwaga jest nie na temat."
        ru: "Твоё замечание не по теме."
        source: { kind: tatoeba, id: 691847 }
      - pl: "Jest trochę uwag."
        ru: "Есть несколько замечаний."
        source: { kind: translated, id: 12959969 }
      - pl: "Ona wnerwiła nas swoimi uwagami."
        ru: "Она вывела нас из себя своими замечаниями."
        source: { kind: translated, id: 7493688 }
notes:
  - { kind: usage, text: "Uwaga! — готовая надпись и окрик: и «Внимание!», и «Осторожно!». Uwaga na głowę! значит «Берегите голову!»" }
  - { kind: usage, text: "Два значения расходятся далеко: zwrócić uwagę — «обратить внимание», а Twoja uwaga jest nie na temat — «Твоё замечание не по теме»." }
  - { kind: usage, text: "brać pod uwagę — «принимать во внимание»; mieć na uwadze — «иметь в виду»." }
  - { kind: usage, text: "Дательный и предложный падежи — uwadze, с чередованием g → dz, как noga → nodze." }
collocations:
  - { pl: "brać pod uwagę", ru: "принимать во внимание" }
  - { pl: "zwrócić uwagę", ru: "обратить внимание" }
  - { pl: "mieć na uwadze", ru: "иметь в виду" }
  - { pl: "z uwagą", ru: "внимательно" }
etymology: "От uważać «считать, следить», из u- + waga «вес»: обратить внимание — буквально «взвесить». Русское «уважать» того же корня, но значение ушло в сторону почтения."
memory: "uwaga — «внимание» и «замечание». Внутри сидит waga «вес»: обратить внимание значит взвесить. Родственное русское «уважать» ушло в другую сторону. А Uwaga! на табличке — это «Осторожно!»."
idioms:
  - { pl: "brać pod uwagę", ru: "принимать во внимание" }
  - { pl: "zwrócić uwagę", ru: "обратить внимание" }
  - { pl: "mieć na uwadze", ru: "иметь в виду" }
