notes:
  - { kind: false-friend, text: "ZOO — «зоопарк», короче русского слова. Официальное название — OGRÓD ZOOLOGICZNY, «зоологический сад», а в речи всегда ZOO." }
  - { kind: usage, text: "Существительное среднего рода, несклоняемое: TO ZOO, W ZOO, DO ZOO, Z ZOO. Прилагательные согласуются в среднем роде: NOWE ZOO, WROCŁAWSKIE ZOO." }
  - { kind: government, text: "В зоопарк — DO ZOO, DO с родительным. В зоопарке — W ZOO. Форма слова при этом не меняется." }
  - { kind: pronunciation, text: "Читается «зо́о», два слога: оба O произносятся отдельно, а не как английское «зу»." }
  - { kind: register, text: "Слово нейтральное и обиходное. Шутливое JAK W ZOO — о толпе зевак или о шуме и беспорядке." }
