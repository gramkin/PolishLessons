etymology: "Сокращение от OGRÓD ZOOLOGICZNY. Первая часть — из греческого слова «живое существо», как в «зоология». Короткое ZOO вошло в польский вслед за английским."
memory: "Zoo — зоопарк, не склоняется: w zoo, do zoo. Читается «зо́о», два слога. Ogród zoologiczny — официальное название."
