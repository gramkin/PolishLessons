# review
id: pedny
format: 2
lemma: "pędny"
rank: 2092
pos: adj
pron: { cyr: "пе́ндны" }
senses:
  - id: propulsive
    ru: "движущий, тяговый (технический термин)"
    examples:
      - pl: "Siła pędna napędza maszynę."
        ru: "Движущая сила приводит машину в действие."
        source: { kind: authored }
      - pl: "To pędny mechanizm pojazdu."
        ru: "Это тяговый механизм машины."
        source: { kind: authored }
      - pl: "Pędny wał przenosi moment obrotowy."
        ru: "Приводной вал передаёт крутящий момент."
        source: { kind: authored }
  - id: driving
    ru: "побудительный, движущий (переносное)"
    examples:
      - pl: "Ciekawość była jej siłą pędną."
        ru: "Любопытство было её движущей силой."
        source: { kind: authored }
      - pl: "Zysk to pędny motyw tej reformy."
        ru: "Прибыль — движущий мотив этой реформы."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Слово техническое и редкое. Живёт прежде всего в сочетании siła pędna «движущая сила», в том числе переносно." }
  - { kind: false-friend, text: "Не путайте с pędzić «мчаться, гнать» — это однокоренные слова, но pędny описывает то, что приводит в движение, а не того, кто мчится." }
  - { kind: government, text: "Обычное прилагательное на -y; согласуется по роду: pędny wał, siła pędna." }
  - { kind: usage, text: "В корпусе не встречается совсем, поэтому все примеры составлены вручную." }
  - { kind: government, text: "Мужско-личной формы pędni не бывает: слово описывает механизмы — pędny wał, pędne koła, siła pędna, — а не людей." }
collocations:
  - { pl: "siła pędna", ru: "движущая сила" }
  - { pl: "wał pędny", ru: "приводной вал" }
etymology: "От pęd «стремительное движение», от pędzić «гнать, мчаться»; ср. русское «понудить»."
memory: "pędny — «движущий, тяговый», от pęd «стремительное движение». Главное сочетание — siła pędna «движущая сила», и буквально, и переносно."
idioms:
  - { pl: "siła pędna", ru: "движущая сила" }
formExamplesSkip:
  - { form: "pędni", reason: "мужско-личная форма множественного числа, а pędny — технический термин о механизмах: pędny wał, siła pędna, pędne koła. О людях так не говорят, поэтому формы pędni в текстах не бывает" }
