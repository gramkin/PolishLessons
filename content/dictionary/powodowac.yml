formExamples:
  - form: "powodować"
    pl: "Marznący śnieg z deszczem może powodować gołoledź."
    ru: "Мокрый снег с дождём может вызывать гололёд."
    source: { kind: translated, id: 1351030 }
  - form: "powodować"
    pl: "Może to powodować choroby u bydła pijącego taką wodę."
    ru: "Это может вызывать болезни у скота, пьющего такую воду."
    source: { kind: translated, id: 6406225 }
  - form: "powodować"
    pl: "Hałas może powodować stres."
    ru: "Шум может вызывать стресс."
    source: { kind: authored }
  - form: "powodowałoby"
    pl: "Po każdym złu zawsze pojawia się dobro. Nie ma zła, które nie powodowałoby zawsze dobra."
    ru: "После всякого зла всегда приходит добро. Нет зла, которое не вызывало бы в итоге добра."
    source: { kind: translated, id: 13036464 }
  - form: "powodowałoby"
    pl: "Nie sądzę, żeby to powodowałoby problemy."
    ru: "Не думаю, что это вызывало бы проблемы."
    source: { kind: authored }
  - form: "powodowałoby"
    pl: "Nie wiem, co powodowałoby takie objawy."
    ru: "Я не знаю, что вызывало бы такие симптомы."
