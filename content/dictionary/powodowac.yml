# review
id: powodowac
format: 2
lemma: "powodować"
rank: 1964
pos: verb
aspect: imperf
aspectPair: spowodowac
pron: { cyr: "поводо́ваць" }
senses:
  - id: cause
    ru: "вызывать, быть причиной"
    examples:
      - pl: "Dym tytoniowy powoduje raka."
        ru: "Табачный дым вызывает рак."
        source: { kind: translated, id: 13560389 }
      - pl: "Nietolerancja powoduje wojny."
        ru: "Нетерпимость вызывает войны."
        source: { kind: translated, id: 12214071 }
      - pl: "Nieuważna jazda powoduje wypadki."
        ru: "Невнимательная езда вызывает аварии."
        source: { kind: translated, id: 13560414 }
      - pl: "Zepsute zęby często powodują ból."
        ru: "Испорченные зубы часто вызывают боль."
        source: { kind: translated, id: 355333 }
      - pl: "Koronawirus powoduje uporczywy kaszel."
        ru: "Коронавирус вызывает упорный кашель."
        source: { kind: translated, id: 8666257 }
      - pl: "Nadal nie wiemy, co powoduje migreny."
        ru: "Мы до сих пор не знаем, что вызывает мигрени."
        source: { kind: translated, id: 3589487 }
  - id: cause-passive
    ru: "быть вызванным чем-либо"
    examples:
      - pl: "Fale najczęściej są powodowane przez wiatr."
        ru: "Волны чаще всего вызываются ветром."
        source: { kind: tatoeba, id: 6696196 }
      - pl: "Wypadanie włosów jest często powodowane przez geny."
        ru: "Выпадение волос часто вызвано генами."
        source: { kind: translated, id: 3367733 }
      - pl: "Tajfun dotarł do miasta, powodując duże zniszczenia."
        ru: "Тайфун дошёл до города, вызвав большие разрушения."
        source: { kind: translated, id: 2310540 }
notes:
  - { kind: usage, text: "Несовершенный вид к spowodować, у которого своя карточка: powoduje «вызывает» — spowoduje «вызовет»." }
  - { kind: usage, text: "Существительное того же корня — powód «причина», карточка przyczyna даёт синоним." }
  - { kind: usage, text: "Деепричастие powodując «вызывая» часто завершает предложение: tajfun dotarł do miasta, powodując duże zniszczenia." }
  - { kind: usage, text: "Страдательная форма powodowane przez «вызываемый чем-либо» обычна в научных текстах." }
collocations:
  - { pl: "powodować choroby", ru: "вызывать болезни" }
  - { pl: "powodować wypadki", ru: "вызывать аварии" }
  - { pl: "powodowane przez", ru: "вызываемый чем-либо" }
etymology: "От powód «причина», po- + wodzić «водить». Буквально «то, что ведёт к чему-то». Русское «повод» — то же самое слово, но в русском оно значит скорее «предлог», чем «причина»."
memory: "powodować — «вызывать, быть причиной», несовершенный вид к spowodować. Польское powód значит «причина», а не русский «повод»."
idioms:
  - { pl: "powodować choroby", ru: "вызывать болезни" }
  - { pl: "powodowane przez wiatr", ru: "вызываемый ветром" }
  - { pl: "powodując zniszczenia", ru: "вызывая разрушения" }
