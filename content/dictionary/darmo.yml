# review
id: darmo
format: 2
lemma: "darmo"
rank: 2228
pos: adv
pron: { cyr: "да́рмо" }
senses:
  - id: free
    ru: "даром, бесплатно"
    examples:
      - pl: "Dostałem bilet za darmo."
        ru: "Билет достался мне бесплатно."
        source: { kind: tatoeba, id: 416252 }
      - pl: "Pomożemy ci za darmo."
        ru: "Мы поможем тебе бесплатно."
        source: { kind: tatoeba, id: 10696219 }
      - pl: "To jest za darmo."
        ru: "Это бесплатно."
        source: { kind: translated, id: 593294 }
  - id: in-vain
    ru: "напрасно, зря"
    examples:
      - pl: "Nie darmo tyle lat przebywam w towarzystwie Sherlocka Holmesa."
        ru: "Не зря я столько лет провожу в обществе Шерлока Холмса."
        source: { kind: authored }
      - pl: "Darmo go przekonywać."
        ru: "Напрасно его убеждать."
        source: { kind: authored }
      - pl: "Wszystko poszło darmo."
        ru: "Всё пошло напрасно."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Слово прямо связано с dar «дар»: «за дар» — отсюда «бесплатно». Русское «даром» — то же самое слово и с тем же двойным смыслом." }
  - { kind: usage, text: "Оба значения совпадают с русскими: za darmo «бесплатно» и nie darmo «не зря»." }
  - { kind: usage, text: "Чаще всего встречается в обороте za darmo «бесплатно, задаром»." }
  - { kind: usage, text: "trudno i darmo — устойчивое «делать нечего, ничего не поделаешь»." }
collocations:
  - { pl: "za darmo", ru: "бесплатно" }
  - { pl: "nie darmo", ru: "не зря" }
  - { pl: "trudno i darmo", ru: "делать нечего" }
etymology: "От dar «дар», праславянское *darъ: «за дар», то есть бесплатно. Русское «даром» — то же самое слово, и у него тот же второй смысл «напрасно»."
memory: "darmo — «даром», и это ровно русское слово: из dar «дар». Оба значения тоже совпадают — za darmo «бесплатно» и nie darmo «не зря». Запомните ещё trudno i darmo «делать нечего»."
idioms:
