# review
id: zwiekszac
format: 2
lemma: "zwiększać"
rank: 2330
pos: verb
aspect: imperf
pron: { cyr: "звье́нкшаць" }
senses:
  - id: increase
    ru: "увеличивать, повышать"
    examples:
      - pl: "Brak snu zwiększa ryzyko ataku serca."
        ru: "Недостаток сна повышает риск сердечного приступа."
        source: { kind: translated, id: 999277 }
      - pl: "Firma zwiększa produkcję."
        ru: "Фирма увеличивает производство."
        source: { kind: authored }
      - pl: "Zwiększamy liczbę miejsc."
        ru: "Мы увеличиваем число мест."
        source: { kind: authored }
  - id: grow
    ru: "увеличиваться (zwiększać się)"
    examples:
      - pl: "Statystyki pokazują, że światowa populacja zwiększa się."
        ru: "Статистика показывает, что население мира увеличивается."
        source: { kind: translated, id: 1452431 }
      - pl: "Kiedy zwiększa się popyt, ceny rosną."
        ru: "Когда спрос увеличивается, цены растут."
        source: { kind: translated, id: 10801620 }
notes:
  - { kind: usage, text: "Без się глагол переходный «увеличивать», с się — непереходный «увеличиваться». Русский различает их суффиксом -ся точно так же." }
  - { kind: false-friend, text: "От większy «больший», сравнительной степени от duży. Буквально «делать бо́льшим»." }
  - { kind: government, text: "Винительный падеж: zwiększać produkcję, zwiększać ryzyko." }
  - { kind: usage, text: "Совершенный вид — zwiększyć. Противоположность — zmniejszać «уменьшать», от mniejszy." }
  - { kind: usage, text: "Страдательное причастие мужского лица (zwiększani) в живой речи почти не встречается: по-польски увеличивают не людей, а их число — liczba uczestników jest zwiększana. Формы даны для полноты парадигмы." }
  - { kind: usage, text: "Будущее время сложное: będę/będziesz/będzie + инфинитив или форма на -ł — będę zwiększać = będę zwiększał. Оба варианта равноправны, но форма на -ł согласуется в роде и числе." }
collocations:
  - { pl: "zwiększać ryzyko", ru: "повышать риск" }
  - { pl: "zwiększać się", ru: "увеличиваться" }
etymology: "От większy «больший» (сравнительная степень от duży) — буквально «делать бо́льшим». Тот же корень в większość «большинство» и zwiększenie «увеличение»; противоположность — zmniejszać от mniejszy."
memory: "zwiększać — «увеличивать», а с się «увеличиваться». От większy «больший». Совершенный вид — zwiększyć, противоположность — zmniejszać."
idioms:
  - { pl: "zwiększać ryzyko", ru: "повышать риск" }
  - { pl: "zwiększać obroty", ru: "наращивать обороты" }
  - { pl: "zwiększać tempo", ru: "наращивать темп" }
