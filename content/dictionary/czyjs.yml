notes:
  - { kind: false-friend, text: "Устроено ровно как русское «чей-то»: местоимение czyj «чей» плюс частица -ś, отвечающая русским -то и -нибудь. Ловушек нет, но есть важная деталь: частица приклеивается ПОСЛЕ падежного окончания, а не перед ним — czyj-ego-ś, czyj-emu-ś, czy-im-ś. Русский делает то же самое через дефис, «чьего-то», «чьему-то», только пишет раздельнее." }
  - { kind: usage, text: "Частица -ś образует целую серию неопределённых слов, и, выучив её один раз, вы получаете полдюжины сразу: ktoś «кто-то», coś «что-то», gdzieś «где-то», kiedyś «когда-то», jakiś «какой-то», czyjś «чей-то». Там, где русский ставит -то или -нибудь, польский почти всегда ставит -ś." }
  - { kind: pronunciation, text: "Основная форма односложная, ударять нечего: «чыйсь». cz звучит как ч, y как ы, ś как сь. В длинных формах ударение обычное, на предпоследнем слоге: czyjegoś — «чыйэго́сь»." }
