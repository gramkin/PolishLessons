etymology: "Местоимение czyj «чей», из праславянского *čьjь, плюс неопределённая частица -ś. Русское «чей-то» собрано из тех же двух кирпичей, только вторым служит частица «-то». От той же частицы вся польская серия неопределённых слов: ktoś, coś, gdzieś, jakiś, kiedyś."
memory: "czyjś — «чей-то», устроено как в русском: czyj плюс -ś. Главное запомнить, что -ś цепляется в самом конце, уже после падежного окончания: czyjegoś, czyjemuś, czyimś. И что та же частица даёт ktoś, coś, gdzieś, jakiś."
