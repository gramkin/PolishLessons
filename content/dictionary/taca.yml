  - id: collection
    ru: "пожертвования в церкви, сбор"
    examples:
      - pl: "Na tacę dał dziesięć złotych."
        ru: "Он положил на пожертвования десять злотых."
        source: { kind: authored }
      - pl: "Ksiądz ogłosił, na co pójdzie taca."
