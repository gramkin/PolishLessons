notes:
  - { kind: false-friend, text: "TACA — «поднос». В костёле TACA — это сбор пожертвований во время мессы: DAĆ NA TACĘ, «пожертвовать». NA TACY — и «на подносе», и «на блюдечке»: PODAĆ COŚ NA TACY, «преподнести на блюдечке»." }
  - { kind: usage, text: "Девять форм, женский род. Родительный, дательный и местный — TACY. Родительный множественного — TAC. Звательный TACO не употребляется." }
  - { kind: government, text: "На подносе — NA TACY, местный. Пожертвовать — DAĆ NA TACĘ, NA с винительным. Поднос с чем — TACA Z и творительный: TACA Z KANAPKAMI." }
  - { kind: pronunciation, text: "Читается «та́ца», ударение на первом слоге. C — «ц»." }
collocations:
  - { pl: "na tacy", ru: "на подносе" }
  - { pl: "dać na tacę", ru: "пожертвовать в церкви" }
  - { pl: "taca z ciastkami", ru: "поднос с пирожными" }
family:
  - { pl: "talerz", ru: "тарелка", relation: root, id: talerz }
  - { pl: "kelner", ru: "официант", relation: root, id: kelner }
  - { pl: "kościół", ru: "костёл, церковь", relation: root, id: kosciol }
etymology: "Старое заимствование, по-видимому, из итальянского TAZZA «чаша». В русском прямого родственника нет."
memory: "Taca — поднос и церковный сбор. Na tacy — на подносе, «на блюдечке». Dać na tacę — пожертвовать. Читается «та́ца»."
idioms:
  - { pl: "podać na tacy", ru: "преподнести на блюдечке" }
