notes:
  - { kind: false-friend, text: "Само слово ловушек не несёт: reklama и «реклама» пришли из французского одним путём и совпадают полностью. Опасен сосед по гнезду — reklamacja. По-польски это обиходное слово для претензии или возврата в магазине: złożyć reklamację «подать претензию», uznać reklamację «удовлетворить претензию». Русская «рекламация» существует, но звучит канцелярски; в магазине скажут «претензия» или просто «хочу вернуть»." }
  - { kind: pronunciation, text: "Польское la мягче русского «ла», и слово звучит ближе к «рэкля́ма», с ударением на предпоследнем слоге. В дательном и предложном падеже m смягчается в mi: w reklamie, «в рэкля́ме»." }
  - { kind: usage, text: "Родительный множественного — голая основа без окончания: reklam. Так же устроены wież и fabryk: у существительных женского рода на -a окончания в этом падеже попросту нет. И запомните reklamówkę: это и «рекламный ролик», но куда чаще — обычный полиэтиленовый пакет-майка." }
collocations:
  - { pl: "reklama telewizyjna", ru: "телевизионная реклама" }
  - { pl: "zamówić reklamę", ru: "заказать рекламу" }
  - { pl: "pracować w reklamie", ru: "работать в рекламе" }
family:
  - { pl: "reklamować", ru: "рекламировать", relation: derived }
  - { pl: "reklamacja", ru: "претензия, рекламация", relation: derived }
  - { pl: "reklamówka", ru: "пакет; рекламный ролик", relation: derived }
etymology: "Через французское réclame от латинского reclamare «громко возражать, выкрикивать» — изначально это был выкрик зазывалы. В русский слово пришло тем же путём и в ту же эпоху, поэтому совпадает буква в букву. Отсюда reklamować, reklamacja, reklamówka и reklamowy."
memory: "reklama — «реклама», учить в самом слове нечего. Запомните двух соседей: reklamacja это не канцелярская «рекламация», а обычная претензия в магазине, а reklamówka чаще всего не ролик, а полиэтиленовый пакет."
idioms:
