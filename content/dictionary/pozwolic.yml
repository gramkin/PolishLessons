# review
id: pozwolic
format: 2
lemma: "pozwolić"
rank: 158
pos: verb
aspect: perf
pron: { cyr: "позво́лиць" }
senses:
  - id: allow
    ru: "позволить, разрешить (кому-либо что-либо сделать)"
    note: "Как в русском: дательный падеж лица плюс инфинитив — pozwolić komuś coś zrobić."
    examples:
      - pl: "Rodzice pozwolili mi tam pójść."
        ru: "Родители разрешили мне пойти туда."
        source: { kind: tatoeba, id: 3656688 }
      - pl: "Nie pozwól mu tego dotykać."
        ru: "Не разрешай ему это трогать."
        source: { kind: tatoeba, id: 411621 }
      - pl: "Pozwól mu zrobić to samemu."
        ru: "Позволь сделать это ему самому."
        source: { kind: tatoeba, id: 3660731 }
  - id: permit
    ru: "позволить, допустить; вежливое «позвольте»"
    examples:
      - pl: "Pozwoli pan, że do niej zadzwonię."
        ru: "Позвольте мне ей позвонить."
        source: { kind: tatoeba, id: 6313045 }
      - pl: "Po prostu pozwól Tomowi odejść."
        ru: "Просто разреши Тому уйти."
        source: { kind: tatoeba, id: 8763037 }
      - pl: "Nie pozwolono mi wejść."
        ru: "Мне не было позволено войти."
        source: { kind: tatoeba, id: 13784847 }
notes:
  - { kind: government, text: "pozwolić komuś coś zrobić — дательный и инфинитив. А «допустить что-то» — pozwolić na coś, с предлогом na и винительным: Nie pozwolę na to." }
  - { kind: usage, text: "Pozwoli pan? и Pozwolisz? — вежливые формулы «Разрешите?»." }
  - { kind: usage, text: "pozwolić sobie na coś значит «позволить себе что-то»: Nie mogę sobie na to pozwolić «Я не могу себе этого позволить»." }
collocations:
  - { pl: "pozwolić komuś", ru: "разрешить кому-то" }
  - { pl: "pozwolić na coś", ru: "допустить что-то" }
  - { pl: "pozwolić sobie", ru: "позволить себе" }
  - { pl: "pozwoli pan?", ru: "разрешите?" }
etymology: "Приставка po- + zwolić от wola «воля»; то же строение, что у русского «позволить» (по + воля)."
memory: "pozwolić komuś coś zrobić — дательный и инфинитив, как в русском. Вежливое Pozwoli pan? значит «Разрешите?», а pozwolić sobie na coś — «позволить себе»."
idioms:
  - { pl: "pozwolić sobie na coś", ru: "позволить себе что-то" }
  - { pl: "pozwoli pan?", ru: "разрешите?" }
  - { pl: "nie pozwolić dojść do słowa", ru: "не дать слова сказать" }
