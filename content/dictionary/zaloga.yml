etymology: "От za- + łoga, от łożyć «класть» (корень *log-, тот же, что в русском «положить», «залог»). Исходно «то, что положено, размещено» — отсюда «размещённые на судне люди»."
memory: "załoga = «экипаж» и «персонал». Член экипажа — członek załogi. Родительный множественного с чередованием: załoga, но załóg."
