etymology: "Из приставки PRZE- «пере-» и корня *rъvati «рвать», того же, что русское «рвать». Соответствие полное и в приставке, и в корне, так что PRZERYWAĆ и «прерывать» — буквально одно слово, собранное дважды по одному чертежу. То же в существительных: PRZERWA и «перерыв» оба значат разрыв во времени, и оба происходят от разрывания поперёк. Гнездо в польском широкое: RWAĆ «рвать», ZERWAĆ «сорвать», ROZERWAĆ «разорвать», URWAĆ «оторвать», PRZERWA «перерыв», и русский в каждом случае даёт точный двойник. Различие только в огласовке корня: несовершенный вид в польском вставляет Y, PRZERYWAĆ, а совершенный оставляет корень без гласной, PRZERWAĆ, тогда как русский и там и там держит «рыв» и «рв» похожим образом — «прерывать» и «прервать»."
memory: "Собирается из знакомых частей: prze- = «пере-», rwać = «рвать», отсюда przerywać = «прерывать», а przerwa = «перерыв». Слово przerwa нужно с первого дня: przerwa między lekcjami, bez przerwy «непрерывно». Орфография по видам: несовершенный с Y (przerywać), совершенный без гласной (przerwać). И одно расхождение в управлении, слышное сразу: перебивают кому-то дательным — nie przerywaj MI, а не «меня»."
idioms:
  - { pl: "bez przerwy", ru: "без перерыва, непрерывно" }
  - { pl: "przerywać komuś w pół zdania", ru: "перебивать кого-то на полуслове" }
