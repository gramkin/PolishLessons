notes:
  - { kind: false-friend, text: "Разбирается по частям и совпадает с русским полностью: приставка PRZE- это «пере-», корень RW- это «рв» от RWAĆ «рвать», и PRZERYWAĆ буквально «перерывать», то есть разрывать поперёк. Русское «прерывать» и «перерыв» построены из тех же двух частей. Поэтому существительное PRZERWA значит «перерыв» и это одно из первых слов, нужных учащемуся: PRZERWA MIĘDZY LEKCJAMI «перерыв между уроками», BEZ PRZERWY «без перерыва», то есть «непрерывно». Ловушка только одна, орфографическая: в несовершенном виде корень пишется с Y, PRZERYWAĆ, а в совершенном с W без гласной, PRZERWAĆ, и путать их нельзя." }
  - { kind: usage, text: "Несовершенный вид, переходный, шестьдесят три формы: сорок две от глагола, десять от действительного причастия PRZERYWAJĄCY, одиннадцать от страдательного PRZERYWANY. Совершенная пара — PRZERWAĆ, и основы различаются заметно: PRZERYWA- против PRZERW-, сравните PRZERYWAM и PRZERWĘ. Отглагольное PRZERWANIE означает сам факт прекращения, а PRZERWA — промежуток времени, и смешивать их не стоит: PRZERWANIE DOSTAW «прекращение поставок», но PRZERWA W DOSTAWACH «перерыв в поставках». Возвратное PRZERYWAĆ SIĘ значит «обрываться»: NAGRANIE SIĘ PRZERYWA." }
  - { kind: government, text: "Переходный: прерывать что — винительный без предлога, PRZERYWAĆ ROZMOWĘ, PRACĘ, CISZĘ. Кому — дательный: PRZERYWAĆ KOMUŚ, и это главный оборот в живой речи: NIE PRZERYWAJ MI «не перебивай меня», где русский требует винительного «меня», а польский — дательного MI. Это расхождение стоит запомнить отдельно, потому что ошибка слышна сразу. Отрицание переводит дополнение в родительный: NIE PRZERYWAM ROZMOWY. На сколько прервать — предлог NA с винительным: PRZERYWAĆ NA PÓŁ GODZINY." }
  - { kind: pronunciation, text: "Читается «пшэры́ваць», четыре слога, ударение на предпоследнем. Приставка PRZE- звучит «пшэ»: сочетание RZ после глухого P оглушается в «ш», как в PRZEZ и PRZESADZAĆ. Буква Y это «ы», поэтому третий слог звучит «ры». Конечное Ć — мягкое «ць». В совершенном виде PRZERWAĆ слогов меньше и ударение на первом: «пшэ́рваць». В существительном PRZERWA два слога, ударение на первом: «пшэ́рва»." }
