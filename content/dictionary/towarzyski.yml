notes:
  - { kind: false-friend, text: "Слово выглядит как «товарищеский», и в одном случае это действительно так: MECZ TOWARZYSKI значит «товарищеский матч». Но главное значение другое. TOWARZYSKI о человеке — это «общительный», а о событии — «светский, дружеский». ŻYCIE TOWARZYSKIE это «светская жизнь», KRONIKA TOWARZYSKA «светская хроника», SPOTKANIE TOWARZYSKIE «дружеская встреча». Переводить это слово как «товарищеский» вне спорта почти всегда неверно. А существительное TOWARZYSZ действительно значит «товарищ», в том числе в партийном обращении." }
  - { kind: usage, text: "Одиннадцать форм. В значении «светский» прилагательное относительное, и степеней у него нет: вечер не может быть «более светским». В значении «общительный» мера нужна, и выражают её описательно, через наречие: BARDZIEJ TOWARZYSKI «более общительный», NAJBARDZIEJ TOWARZYSKI. Мужско-личная форма множественного — TOWARZYSCY, с чередованием K в C, как у MIĘKKI и MIĘKCY. Остальные формы берут окончания на -ICH и -IM, потому что основа кончается мягким K: TOWARZYSKICH, TOWARZYSKIM." }
  - { kind: pronunciation, text: "Читается «товажы́ски», четыре слога, ударение на предпоследнем. Сочетание RZ даёт «ж», поэтому середина слова звучит «важы», а не «варжи» и не «рзы». Буква Y после RZ — это «ы». Конечное KI читается мягко, «ки». В существительном TOWARZYSZ слышно «това́жыш», с конечным «ш», а в TOWARZYSTWO — «товажы́стфо», где W перед T оглушается в «ф»." }
  - { kind: government, text: "Прилагательное только согласуется. Полезнее запомнить управление родственного глагола TOWARZYSZYĆ «сопровождать», который требует дательного падежа: TOWARZYSZYŁ MI DO DOMU «он проводил меня до дома». Русский в этом случае ставит винительный, «сопровождал меня», так что падеж приходится менять. Существительное TOWARZYSTWO в значении «компания» берёт предлог W с местным: W TOWARZYSTWIE ZNAJOMYCH «в компании знакомых», и это же слово значит «общество» как организация." }
  - { kind: register, text: "Слово нейтральное. Частые обороты: ŻYCIE TOWARZYSKIE «светская жизнь», SPOTKANIE TOWARZYSKIE «дружеская встреча», KRONIKA TOWARZYSKA «светская хроника», MECZ TOWARZYSKI «товарищеский матч», CZŁOWIEK TOWARZYSKI «общительный человек». Обращение TOWARZYSZU принадлежит советскому периоду и сегодня звучит либо исторически, либо издевательски; нейтральное обращение — PANIE. А TOWARZYSTWO в разговоре часто значит просто «компания»: BYŁO MIŁE TOWARZYSTWO." }
