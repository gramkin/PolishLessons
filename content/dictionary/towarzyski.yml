etymology: "От TOWARZYSZ «товарищ», а оно от TOWAR «товар» с древним суффиксом принадлежности. Исходный смысл прозрачен и общий для обоих языков: товарищ — это тот, с кем делишь товар, спутник в торговой поездке. Русское «товарищ» устроено точно так же и от того же «товара», так что здесь совпадают оба слова гнезда сразу, и корень, и производное. Само TOWAR пришло к славянам из тюркских языков, где значило «скот, имущество». Дальше пути разошлись только в оттенках: польский увёл прилагательное к общительности и светской жизни, русский к товариществу и партийному обращению."
memory: "Корень общий и целиком: towar это «товар», towarzysz это «товарищ», и исходный смысл один, тот, с кем делишь товар. Но прилагательное значит не «товарищеский», а «общительный» о человеке и «светский» о событии: życie towarzyskie «светская жизнь». «Товарищеский» остался только в спорте, mecz towarzyski. Читается «товажы́ски», rz это «ж». Мужско-личное множественное towarzyscy, с чередованием k и c, как miękcy."
idioms:
