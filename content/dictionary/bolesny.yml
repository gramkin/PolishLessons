notes:
  - { kind: false-friend, text: "Похоже на русское «больной», а значит другое. BOLESNY это «болезненный», то есть причиняющий боль: BOLESNY ZABIEG «болезненная процедура», BOLESNY CIOS «болезненный удар». Про человека, который болен, так не говорят: больной по-польски CHORY, и CHORY CZŁOWIEK «больной человек», а BOLESNY CZŁOWIEK прозвучит как «человек, причиняющий боль». Различение держится на направлении: CHORY тот, кто страдает, BOLESNY то, от чего страдают. Русское «болезненный» при этом подходит почти всегда, и именно через него слово стоит запоминать." }
  - { kind: pronunciation, text: "Читается «боле́сны», ударение на предпоследнем слоге. Главное здесь не чтение, а то, что S в середине слова чередуется с Ś, и чередование видно на письме. В положительной степени стоит твёрдое S: BOLESNY, BOLESNA, BOLESNE. Но в форме мужского лица множественного появляется Ś: BOLEŚNI «болесьни». И вся сравнительная степень тоже с Ś: BOLEŚNIEJSZY «болесьне́йшы», NAJBOLEŚNIEJSZY. Причина в следующем мягком -NI и -NIEJ, которое тянет предыдущий согласный за собой." }
  - { kind: government, text: "Прилагательное с полным набором из тридцати трёх форм, и чередование S с Ś проходит по ним не как попало: в положительной степени твёрдое S стоит в десяти формах из одиннадцати, а в одиннадцатой, BOLEŚNI, мужском лице множественного, появляется Ś. Все одиннадцать форм сравнительной степени и все одиннадцать превосходной идут с Ś. Для кого болезненно — предлог DLA с родительным: BOLESNY DLA RODZINY. Сравнение предлогом OD с родительным или союзом NIŻ: BOLEŚNIEJSZY OD PIERWSZEGO, BOLEŚNIEJSZY NIŻ PIERWSZY." }
  - { kind: usage, text: "Форма BOLEŚNI, мужское лицо множественного, встречается редко, и редкость эта смысловая: прилагательное описывает вещи и события, а не людей, поэтому повод сказать «они болезненны» возникает нечасто и звучит переносно, об излишней резкости в словах. Выучить её всё равно стоит, потому что именно в ней Ś появляется в положительной степени, и она показывает чередование раньше, чем до него доходит сравнительная. Переносное употребление частотно: BOLESNA PRAWDA, BOLESNA PORAŻKA, BOLESNY CIOS. Наречие BOLEŚNIE «болезненно» тоже с Ś." }
