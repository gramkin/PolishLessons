etymology: "От BÓL «боль», из праславянского *bolь, того же, что дало русскую «боль», «болеть», «больной». Корень в двух языках один, а производные разошлись по значениям: польский от BÓL образовал BOLESNY «причиняющий боль» и BOLEĆ «болеть» о части тела, а слово для больного человека взял из другого гнезда, CHORY, родственного русскому «хворый». Русский же от «боли» произвёл и «больной», и «болезненный», поэтому одному русскому корню отвечают в польском два разных, и путаница идёт именно отсюда. В гнездо входят также BOLĄCZKA «болячка, наболевшая проблема» и BOLEŚCIWY «страдальческий»."
memory: "Болезненный, то есть причиняющий боль, а не больной: больной человек — chory. Направление решает: chory тот, кто страдает, bolesny то, от чего страдают. Чередование видно на письме: твёрдое s во всей положительной степени, но boleśni в мужском лице множественного и ś во всей сравнительной — boleśniejszy, najboleśniejszy. Корень тот же, что в русской «боли»."
