id: tchorzliwy
format: 2
lemma: "tchórzliwy"
rank: 2146
pos: adj
pron: { cyr: "тхужли́вы" }
senses:
  - id: cowardly
    ru: "трусливый"
    examples:
      - pl: "Tchórzliwy naród nie ma ojczyzny."
        ru: "Трусливый народ не имеет родины."
        source: { kind: translated, id: 4788672 }
      - pl: "To tchórzliwy postępek."
        ru: "Это трусливый поступок."
        source: { kind: authored }
      - pl: "Nie bądź tchórzliwy."
        ru: "Не будь трусливым."
        source: { kind: authored }
  - id: timid
    ru: "малодушный, робкий"
    examples:
      - pl: "Tchórzliwa decyzja nikomu nie pomoże."
        ru: "Малодушное решение никому не поможет."
        source: { kind: authored }
      - pl: "Uznano go za tchórzliwego."
        ru: "Его сочли трусливым."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Корень tchórz значит и «хорёк», и «трус». Русское «хорь, хорёк» — то же слово: зверёк дал название человеческому качеству." }
  - { kind: usage, text: "Рядом стоят tchórz «трус», tchórzostwo «трусость» и оборот podszyty tchórzem «трусоватый»." }
  - { kind: government, text: "Обычное прилагательное на -y; наречие — tchórzliwie." }
  - { kind: usage, text: "В корпусе одно совпадение, поэтому большинство примеров составлено вручную." }
collocations:
  - { pl: "tchórzliwy postępek", ru: "трусливый поступок" }
etymology: "От tchórz «хорёк; трус», праславянское *dъxorь; русское «хорь, хорёк» — то же слово."
memory: "tchórzliwy — «трусливый», от tchórz, который значит и «хорёк», и «трус». Русское «хорёк» — тот же корень."
