notes:
  - { kind: false-friend, text: "KLASZTOR — «монастырь», и мужской, и женский. Слово не похоже на русское: оно из латинского CLAUSTRUM, «закрытое место». Монастырский — KLASZTORNY. Пойти в монастырь — WSTĄPIĆ DO KLASZTORU." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Родительный — KLASZTORU. В местном R переходит в RZ: W KLASZTORZE." }
  - { kind: government, text: "Уйти в монастырь — WSTĄPIĆ DO KLASZTORU, DO с родительным. Жить в монастыре — ŻYĆ W KLASZTORZE, местный. Настоятель монастыря — PRZEOR KLASZTORU." }
  - { kind: pronunciation, text: "Читается «кла́штор»: SZ — «ш», ударение на первом слоге. KLASZTORZE — «клашто́жэ»." }
collocations:
