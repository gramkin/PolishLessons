etymology: "Через немецкое KLOSTER из латинского CLAUSTRUM «замкнутое пространство», от CLAUDERE «закрывать». Тот же корень в слове «клаустрофобия»."
memory: "Klasztor — монастырь, «закрытое место», как в «клаустрофобии». W klasztorze — в монастыре. Читается «кла́штор»."
