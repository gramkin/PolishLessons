etymology: "Из средневерхненемецкого ZEICHEN «знак», того же корня, что современное немецкое ZEICHEN и английское TOKEN. Слово пришло в польский вместе с городским правом и ремесленной организацией: сначала оно означало клеймо, знак мастера на изделии, а от знака развилось отвлечённое «отличительный признак, свойство». Из того же немецкого источника, но другим путём, пришло CECH «гильдия» — объединение, которое ставило на товар общий знак; поэтому два слова этимологически связаны, а в современном языке разошлись совершенно, оставшись похожими только на письме. Русский взял из немецкого «цех» в значении объединения, а для признака воспользовался своими «чертой» и «признаком», так что совпадение написания с польским CECH случайно по смыслу, но не по происхождению."
memory: "cecha — это «черта, свойство, признак», а не «цех»; цех-гильдия по-польски cech, мужского рода, и оба слова от немецкого Zeichen «знак». В документах cechy szczególne — «особые приметы». Дательный и местный cesze: ch→sz, и это третий способ из набора — matka/matce (k→c), flaga/fladze (g→dz), cecha/cesze (ch→sz). Родительный множественного cech совпадает с тем самым мужским словом."
