notes:
  - { kind: usage, text: "В дательном и местном падеже единственного числа CH переходит в SZ: CESZE, а не «cechie». Это третий способ, которым польский обходится с заднеязычным перед окончанием -E, и вместе они образуют полный набор: K переходит в C (MATKA и MATCE), G переходит в DZ (FLAGA и FLADZE), CH переходит в SZ (CECHA и CESZE, MUCHA и MUSZE, POŃCZOCHA и POŃCZOSZE). Зная все три, можно не угадывать ни одной формы. Родительный множественного — CECH, с нулевым окончанием, и эта форма совпадает с отдельным мужским словом CECH «цех, ремесленная гильдия»; различает их только род согласуемых слов." }
  - { kind: false-friend, text: "Переводить это слово русским «цехом» нельзя: CECHA значит «черта, свойство, признак». Польское слово для цеха — CECH, мужского рода, и означает оно средневековую ремесленную гильдию, а производственный цех по-польски HALA или WYDZIAŁ. Совпадение возникает только в родительном множественного, где CECHA даёт CECH. Полезно запомнить канцелярский оборот CECHY SZCZEGÓLNE: в документах это «особые приметы», и переводить его как «особые черты» неправильно. Прилагательное CHARAKTERYSTYCZNY значит «характерный», а глагол CECHOWAĆ — «быть свойственным»: CECHUJE GO SPOKÓJ «ему свойственно спокойствие»." }
  - { kind: government, text: "Женский род. Чья черта или чего — родительный: CECHA CHARAKTERU, CECHA STYLU, CECHA WSPÓLNA. «Чертой чего-то является» строится творительным при BYĆ: CECHĄ TEGO STYLU JEST PROSTOTA, и порядок слов здесь обычно обратный русскому. Глагол CECHOWAĆ требует винительного лица и именительного свойства: CECHUJE GO UPÓR. Частотные сочетания: CECHY WRODZONE «врождённые черты», CECHY NABYTE «приобретённые», CECHY SZCZEGÓLNE «особые приметы», WSPÓLNA CECHA «общая черта»." }
  - { kind: pronunciation, text: "Читается «це́ха», два слога, ударение на первом. Буква C перед E даёт «ц», а сочетание CH — «х», так что слово звучит «цеха» и ничем не напоминает русское «цех» по значению, хотя по звучанию близко. В дательном и местном CESZE сочетание SZ даёт «ш»: «це́ше». В родительном множественного CECH слог один: «цех», и здесь звучание с русским словом совпадает полностью, а смысл нет." }
