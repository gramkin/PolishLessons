# review
id: ktos
format: 2
lemma: "ktoś"
rank: 81
pos: noun
pron: { cyr: "ктось" }
senses:
  - id: someone
    ru: "кто-то, кто-нибудь"
    examples:
      - pl: "Ktoś puka."
        ru: "Кто-то стучит."
        source: { kind: tatoeba, id: 3713571 }
      - pl: "Czy ktoś umarł?"
        ru: "Кто-то умер?"
        source: { kind: tatoeba, id: 6603007 }
      - pl: "Porozmawiaj z kimś!"
        ru: "Поговори с кем-нибудь!"
        source: { kind: tatoeba, id: 2836302 }
  - id: anyone
    ru: "кто-нибудь (в вопросе)"
    examples:
      - pl: "To się przydarzyło komuś, kogo znam."
        ru: "Это случилось с одним моим знакомым."
        source: { kind: tatoeba, id: 10091413 }
      - pl: "Czy ktoś tu jest?"
        ru: "Здесь кто-нибудь есть?"
        source: { kind: authored }
notes:
  - { kind: usage, text: "Склоняется как kto с частицей -ś: kogoś, komuś, kimś." }
  - { kind: usage, text: "Различия «-то» и «-нибудь» польский не передаёт: ktoś покрывает оба." }
collocations:
  - { pl: "ktoś inny", ru: "кто-то другой" }
  - { pl: "być kimś", ru: "быть кем-то значимым" }
etymology: "Из kto с частицей -ś — та же модель, что coś и jakiś."
memory: "ktoś = «кто-то/кто-нибудь», склонение как у kto: kogoś, komuś, kimś. Оборот być kimś значит «быть кем-то значимым»."
idioms:
  - { pl: "ktoś inny", ru: "кто-то другой" }
  - { pl: "być kimś", ru: "быть кем-то (значимым)" }
