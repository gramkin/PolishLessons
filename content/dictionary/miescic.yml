# review
id: miescic
format: 2
lemma: "mieścić"
rank: 5798
pos: verb
aspect: imperf
pron: { cyr: "ме́сьциць" }
senses:
  - id: hold
    ru: "вмещать"
    examples:
      - pl: "Ta sala mieści dwa tysiące widzów."
        ru: "Этот зал вмещает две тысячи зрителей."
        source: { kind: translated, id: 360173 }
      - pl: "Ten hotel mieści stu gości."
        ru: "Эта гостиница вмещает сто гостей."
        source: { kind: translated, id: 412916 }
  - id: house
    ru: "размещать у себя, служить помещением"
    examples:
      - pl: "Stary pałac mieści dziś muzeum."
        ru: "В старом дворце сегодня размещается музей."
        source: { kind: authored }
  - id: fit
    ru: "mieścić się — помещаться, умещаться"
    examples:
      - pl: "To się nie mieści w głowie."
        ru: "Это не умещается в голове."
        source: { kind: tatoeba, id: 13465769 }
      - pl: "Nie mieszczę się w tym siedzeniu."
        ru: "Я не помещаюсь в этом кресле."
        source: { kind: translated, id: 13336026 }
  - id: be-located
    ru: "mieścić się — находиться, располагаться"
    examples:
      - pl: "To przedsiębiorstwo mieści się na przedmieściach Osaki."
        ru: "Это предприятие находится в пригороде Осаки."
        source: { kind: translated, id: 357077 }
      - pl: "Nowa sala koncertowa mieści się w wysokim, nowoczesnym budynku."
        ru: "Новый концертный зал находится в высоком современном здании."
        source: { kind: translated, id: 744149 }
notes:
  - { kind: usage, text: "Чаще всего глагол стоит с SIĘ, и у MIEŚCIĆ SIĘ два значения: «помещаться, умещаться» (WALIZKA SIĘ NIE MIEŚCI «чемодан не влезает») и «находиться, располагаться» (BIURO MIEŚCI SIĘ NA DRUGIM PIĘTRZE «офис находится на третьем этаже»). Во втором смысле это книжный синоним ZNAJDOWAĆ SIĘ." }
  - { kind: usage, text: "Несовершенный вид; совершенные — ZMIEŚCIĆ (SIĘ) «уместить(ся)» и POMIEŚCIĆ «вместить». Ś чередуется с SZCZ: MIEŚCISZ, MIEŚCI, но MIESZCZĘ, MIESZCZĄ, MIESZCZĄCY. Повелительное — MIEŚĆ (SIĘ)." }
  - { kind: government, text: "Что вмещает — винительный: SALA MIEŚCI TYSIĄC OSÓB. Где помещается — W + предложный: MIEŚCIĆ SIĘ W SZAFIE, W BUDŻECIE, W NORMIE «укладываться в бюджет, в норму»." }
  - { kind: pronunciation, text: "Читается «ме́сьциць»: ŚĆ — мягкое «сьць». MIESZCZĘ — «ме́шчэ», SZCZ — «шч», как русское «щ» в старом произношении." }
collocations:
  - { pl: "mieścić się w budżecie", ru: "укладываться в бюджет" }
  - { pl: "mieścić się w normie", ru: "быть в пределах нормы" }
  - { pl: "sala mieści tysiąc osób", ru: "зал вмещает тысячу человек" }
family:
  - { pl: "zmieścić", ru: "уместить", relation: aspect }
  - { pl: "pomieścić", ru: "вместить", relation: aspect }
  - { pl: "umieścić", ru: "поместить, разместить", relation: root, id: umiescic }
  - { pl: "miejsce", ru: "место", relation: root, id: miejsce }
  - { pl: "pomieszczenie", ru: "помещение", relation: derived }
etymology: "Праславянское *městiti «помещать», от *město «место»; отсюда же MIEJSCE и MIASTO (раньше тоже «место»). Русские «вместить», «поместить» — того же корня."
memory: "Mieścić — от miejsce «место»: давать место, вмещать, как русское «вместить»."
idioms:
  - { pl: "nie mieścić się w głowie", ru: "не укладываться в голове" }
formExamplesSkip:
  - { form: "mieszczeni", reason: "мужско-личная форма страдательного причастия: людей «вмещает» помещение (HOTEL MIEŚCI STU GOŚCI), страдательный оборот с лицами не употребляется — говорят ZAKWATEROWANI или UMIESZCZENI" }
