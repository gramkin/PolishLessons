pos: noun
pron: { cyr: "позоста́уосьць" }
senses:
  - id: remains
    ru: "остаток, остатки, следы (того, что было)"
    examples:
      - pl: "Odkryliśmy pozostałości starożytnej cywilizacji."
        ru: "Мы обнаружили остатки древней цивилизации."
        source: { kind: translated, id: 904228 }
      - pl: "Kiedyś był tu domek, to są jego pozostałości."
        ru: "Когда-то здесь был домик, это его остатки."
        source: { kind: authored }
      - pl: "Na talerzu zostały pozostałości obiadu."
        ru: "На тарелке остались остатки обеда."
        source: { kind: authored }
  - id: relic
    ru: "пережиток (прошлого)"
    examples:
      - pl: "Ten przepis to pozostałość poprzedniego systemu."
        ru: "Это правило — пережиток прежней системы."
        source: { kind: authored }
      - pl: "Jego akcent jest pozostałością dzieciństwa na wsi."
        ru: "Его акцент — след деревенского детства."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Чаще во множественном: POZOSTAŁOŚCI zamku, «остатки замка», pozostałości jedzenia, «остатки еды». Для небольшого остатка чего-то съедобного или ткани обычнее RESZTKA: resztki obiadu. POZOSTAŁOŚĆ — слово книжнее и шире: руины, химический осадок, пережиток." }
  - { kind: government, text: "Остаток чего — родительный: pozostałość po czymś или pozostałość czegoś: pozostałości po wojnie, pozostałości dawnego miasta. С PO — «то, что осталось после»." }
  - { kind: pronunciation, text: "«позоста́уосьць»: Ł — «у», конечное ŚĆ — «сьць». Ударение на предпоследнем слоге STA." }
  - { kind: register, text: "Нейтральное, но книжное: в новостях, археологии, химии (pozostałości pestycydów, «остатки пестицидов»). В разговоре проще: to, co zostało." }
collocations:
  - { pl: "pozostałości zamku", ru: "развалины замка" }
  - { pl: "pozostałość po czymś", ru: "то, что осталось от чего-то" }
  - { pl: "pozostałość przeszłości", ru: "пережиток прошлого" }
family:
  - { pl: "pozostać", ru: "остаться", relation: root, id: pozostac }
  - { pl: "pozostały", ru: "остальной, оставшийся", relation: derived }
etymology: "От POZOSTAŁY, «оставшийся», причастия глагола POZOSTAĆ, «остаться», с суффиксом отвлечённых существительных -OŚĆ, как русское «-ость»: «оставшееся» — «остаток». Корень STA- — тот же, что в «стоять» и «остаться»."
memory: "Pozostałość — то, что pozostało, «осталось»: остатки, руины, пережиток. Обычно во множественном: pozostałości zamku. Pozostałość po wojnie — след войны."
idioms:
  - { pl: "pozostałość przeszłości", ru: "пережиток прошлого" }
