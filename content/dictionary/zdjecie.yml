# review
id: zdjecie
format: 2
lemma: "zdjęcie"
rank: 652
pos: noun
pron: { cyr: "здъе́нце" }
senses:
  - id: photo
    ru: "фотография, снимок"
    note: "robić zdjęcia «фотографировать», na zdjęciu «на фотографии»."
    examples:
      - pl: "Pokazał tobie zdjęcie?"
        ru: "Он показал тебе фотографию?"
        source: { kind: tatoeba, id: 3696314 }
      - pl: "Zdjęcie jest czarno-białe."
        ru: "Фотография чёрно-белая."
        source: { kind: tatoeba, id: 6056658 }
      - pl: "Człowiek na tym zdjęciu to nie Tom."
        ru: "Человек на этой фотографии - не Том."
        source: { kind: tatoeba, id: 13785948 }
  - id: in-photo
    ru: "na zdjęciu — на фотографии"
    note: "Предложный падеж: kto jest na tym zdjęciu?"
    examples:
      - pl: "Czy znacie chłopca na tym zdjęciu?"
        ru: "Знаете ли вы мальчика на этом снимке?"
        source: { kind: tatoeba, id: 6313064 }
      - pl: "Co widzisz na zdjęciu?"
        ru: "Что ты видишь на фотографии?"
        source: { kind: translated, id: 3579463 }
      - pl: "Znasz tego człowieka na zdjęciu?"
        ru: "Ты знаешь этого человека на фотографии?"
        source: { kind: translated, id: 364113 }
  - id: removal
    ru: "снятие (отглагольное существительное от zdjąć)"
    note: "Proszę o zdjęcie butów «Просьба снять обувь»."
    examples:
      - pl: "Proszę o zdjęcie butów."
        ru: "Снимите, пожалуйста, свои ботинки."
        source: { kind: tatoeba, id: 827818 }
      - pl: "Zdjęcie opatrunku zajęło chwilę."
        ru: "Снятие повязки заняло минуту."
        source: { kind: authored }
      - pl: "Zdjęcie plakatu ze ściany nie było łatwe."
        ru: "Снять плакат со стены было непросто."
        source: { kind: authored }
notes:
  - { kind: usage, text: "robić zdjęcia значит «фотографировать»: interesuję się robieniem zdjęć «я увлекаюсь фотографией»." }
  - { kind: usage, text: "«На фотографии» — na zdjęciu, предложный падеж: kto jest na tym zdjęciu?" }
  - { kind: false-friend, text: "У слова два источника: это и «фотография», и отглагольное существительное от zdjąć «снять». Proszę o zdjęcie butów значит «просьба снять обувь», а вовсе не про снимок." }
  - { kind: usage, text: "wychodzić dobrze na zdjęciach — «хорошо получаться на фотографиях»." }
collocations:
  - { pl: "robić zdjęcia", ru: "фотографировать" }
  - { pl: "na zdjęciu", ru: "на фотографии" }
  - { pl: "album ze zdjęciami", ru: "фотоальбом" }
  - { pl: "zdjęcie butów", ru: "снятие обуви" }
family:
  - { pl: "zdjąć", ru: "снять", relation: root }
  - { pl: "zdjęciowy", ru: "съёмочный", relation: derived }
  - { pl: "fotografia", ru: "фотография", relation: derived }
etymology: "Отглагольное существительное от zdjąć «снять» (z + djąć, старое «деть») — «снимок» ровно в том же смысле, в каком русское «снимок» происходит от «снять»."
memory: "zdjęcie — «фотография», и образовано оно так же, как русское «снимок»: от глагола zdjąć «снять». Отсюда и второе значение, живое до сих пор: Proszę o zdjęcie butów значит «просьба снять обувь», а не про фотографию. «Фотографировать» будет robić zdjęcia, «на фотографии» — na zdjęciu с предложным, а фотоальбом — album ze zdjęciami."
idioms:
  - { pl: "robić zdjęcia", ru: "фотографировать" }
  - { pl: "na zdjęciu", ru: "на фотографии" }
  - { pl: "dobrze wychodzić na zdjęciach", ru: "хорошо получаться на фотографиях" }
