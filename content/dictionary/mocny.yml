# review
id: mocny
format: 2
lemma: "mocny"
rank: 859
pos: adj
pron: { cyr: "мо́цны" }
senses:
  - id: sturdy
    ru: "крепкий, прочный, мощный"
    examples:
      - pl: "Ten materiał jest mocny."
        ru: "Этот материал прочный."
        source: { kind: translated, id: 525477 }
      - pl: "Trąbka ma mocny dźwięk."
        ru: "У трубы сильный звук."
        source: { kind: translated, id: 11983204 }
      - pl: "Ta drużyna ma mocnych zawodników."
        ru: "В этой команде сильные игроки."
        source: { kind: translated, id: 1354028 }
  - id: concentrated
    ru: "крепкий (о кофе, алкоголе), сильный (о впечатлении)"
    note: "Здесь mocny незаменим: «крепкий кофе» — только mocna kawa, никогда silna."
    examples:
      - pl: "Ta kawa jest dla mnie za mocna."
        ru: "Этот кофе для меня слишком крепкий."
        source: { kind: translated, id: 360204 }
      - pl: "Ta whisky jest za mocna."
        ru: "Это виски слишком крепкое."
        source: { kind: translated, id: 933479 }
      - pl: "Kubek mocnej kawy pomaga mi się obudzić."
        ru: "Кружка крепкого кофе помогает мне проснуться."
        source: { kind: translated, id: 13268391 }
  - id: strong-point
    ru: "mocna strona — сильная сторона"
    examples:
      - pl: "Piłka nożna to moja mocna strona."
        ru: "Футбол — моя сильная сторона."
        source: { kind: translated, id: 758392 }
      - pl: "Matematyka nigdy nie była moją mocną stroną."
        ru: "Математика никогда не была моей сильной стороной."
        source: { kind: translated, id: 6313758 }
      - pl: "Każdy ma swoje mocne i słabe strony."
        ru: "У каждого есть свои сильные и слабые стороны."
        source: { kind: translated, id: 3634722 }
notes:
  - { kind: false-friend, text: "Главное отличие от silny: silny — про физическую силу человека, ветра, удара; mocny — про крепость, прочность и насыщенность. Silny człowiek «сильный человек», но mocna kawa «крепкий кофе», и наоборот сказать нельзя." }
  - { kind: usage, text: "mocna strona — «сильная сторона»: Matematyka nie jest moją mocną stroną. Противоположное — słaba strona." }
  - { kind: usage, text: "coś mocniejszego — «что-нибудь покрепче», об алкоголе: Masz ochotę na coś mocniejszego?" }
  - { kind: usage, text: "mocny w gębie — «силён на словах», о том, кто много обещает: Są mocni tylko w gębie." }
collocations:
  - { pl: "mocna kawa", ru: "крепкий кофе" }
  - { pl: "mocna strona", ru: "сильная сторона" }
  - { pl: "mocne wrażenie", ru: "сильное впечатление" }
  - { pl: "mocny głos", ru: "сильный голос" }
family:
  - { pl: "moc", ru: "сила, мощь", relation: root, id: moc }
  - { pl: "wzmocnić", ru: "усилить, укрепить", relation: derived }
  - { pl: "słaby", ru: "слабый", relation: antonym }
etymology: "От moc «сила, мощь», праславянское *mogtь — тот же корень, что в русских «мочь, мощь, могучий». Русское «мощный» — ближайший родственник, но по смыслу польское слово ближе к «крепкий»."
memory: "mocny — «крепкий», silny — «сильный». Silny человек, ветер, удар; mocny кофе, алкоголь, верёвка, впечатление. Mocna kawa «крепкий кофе» — только так. И запомните mocna strona «сильная сторона» и coś mocniejszego «что-нибудь покрепче»."
idioms:
  - { pl: "mocna strona", ru: "сильная сторона" }
  - { pl: "coś mocniejszego", ru: "что-нибудь покрепче" }
  - { pl: "mocny w gębie", ru: "силён на словах" }
  - { pl: "mieć mocne plecy", ru: "иметь надёжных покровителей" }
formExamplesSkip:
  - { form: "mocen", reason: "краткая форма: сохранилась только в книжных оборотах вроде nie jestem mocen, в живой речи не употребляется" }
