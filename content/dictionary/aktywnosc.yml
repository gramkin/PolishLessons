notes:
  - { kind: usage, text: "Слово подтверждает два правила соответствий сразу, и в этом его главная польза. Польское -YWNY отвечает русскому -ИВНЫЙ: AKTYWNY и «активный», POZYTYWNY и «позитивный», EFEKTYWNY и «эффективный». А польское -NOŚĆ отвечает русскому -НОСТЬ: AKTYWNOŚĆ и «активность». Шесть форм, обычный разряд. Множественное число употребляется о разных видах деятельности: AKTYWNOŚCI POZALEKCYJNE «внеклассные занятия» в школьных документах." }
  - { kind: false-friend, text: "Поправка касается официального оборота, с которым русскоязычный в Польше сталкивается рано. AKTYWNOŚĆ ZAWODOWA — это не «профессиональная активность» в смысле усердия, а трудовая занятость как юридическое состояние: человек либо работает, либо нет. Отсюда OSOBA AKTYWNA ZAWODOWO значит «работающий», а BIERNY ZAWODOWO — «не занятый». Отдельно стоит слово AKTYWA, среднего рода и только во множественном: это бухгалтерские «активы», и с AKTYWNOŚĆ оно не взаимозаменяемо." }
  - { kind: government, text: "Активность в чём — предлог W с местным падежом: AKTYWNOŚĆ W PRACY, AKTYWNOŚĆ W SIECI «активность в сети». Проявлять — WYKAZYWAĆ AKTYWNOŚĆ, винительный. Область передаётся прилагательным, а не предлогом: AKTYWNOŚĆ FIZYCZNA, AKTYWNOŚĆ ZAWODOWA, AKTYWNOŚĆ SPOŁECZNA. Прилагательное AKTYWNY управляет предлогом W с местным падежом: AKTYWNY W POLITYCE «активный в политике»." }
  - { kind: pronunciation, text: "Читается «акты́вносьчь», три слога, ударение на втором. Буква Y звучит как «ы», поэтому середина слова «тыв», а не «тив», и это та же разница, что в POZYTYWNY «позытывны». Буква W перед N остаётся звонкой. Конец слова, -ŚĆ, это два мягких звука подряд, «сьчь». В прилагательном AKTYWNY слышно «акты́вны»." }
  - { kind: register, text: "Слово нейтральное, частое в медицине, в школе и в документах. Частые обороты: AKTYWNOŚĆ FIZYCZNA «физическая активность», AKTYWNOŚĆ ZAWODOWA «трудовая занятость», AKTYWNOŚĆ SPOŁECZNA «общественная активность», WYKAZYWAĆ AKTYWNOŚĆ «проявлять активность». В разговоре вместо существительного скажут прилагательным или наречием: BĄDŹ AKTYWNY, DZIAŁA AKTYWNIE. Производное AKTYWISTA значит «активист» и, как и в русском, бывает окрашено насмешкой." }
