etymology: "Из латинского ACTIVUS «действенный», от AGERE «делать, вести», и в оба языка слово пришло книжным путём, через западноевропейские языки. Различается только оформление, и различается оно регулярно: латинское -IVUS дало в польском -YWNY, а в русском -ИВНЫЙ, тогда как отвлечённое существительное в обоих языках собрано из своих частей, -NOŚĆ и -НОСТЬ. Запомнив эту пару соответствий, русскоязычный разбирает целый разряд книжных слов: EFEKTYWNY, INTENSYWNY, PRYMITYWNY, и все они читаются через «ы»."
memory: "Два правила в одном слове: -ywny отвечает русскому -ивный, aktywny и «активный», а -ność отвечает -ность. Отсюда и чтение: «акты́вносьчь», через «ы», как pozytywny. Главная практическая поправка в официальном обороте: aktywność zawodowa это трудовая занятость как состояние, а osoba aktywna zawodowo значит «работающий». И не путать с aktywa, это бухгалтерские «активы», только множественное число."
