notes:
  - { kind: false-friend, text: "Русское «болото» и польское błoto — одно слово, но значение разошлось: błoto прежде всего «грязь, слякоть». Болото по-польски — bagno или mokradło." }
  - { kind: government, text: "Средний род: to błoto, tego błota. В грязи — w błocie, предложный падеж." }
  - { kind: usage, text: "Оборот wyrzucać pieniądze w błoto значит «выбрасывать деньги на ветер» — поляк бросает их в грязь, русский на ветер." }
  - { kind: usage, text: "Zmieszać kogoś z błotem «смешать с грязью» совпадает с русским дословно." }
collocations:
  - { pl: "w błocie", ru: "в грязи" }
  - { pl: "wyrzucać pieniądze w błoto", ru: "выбрасывать деньги на ветер" }
etymology: "Праславянское *bolto; русское «болото» — то же слово, но польское błoto значит «грязь»."
memory: "błoto — «грязь, слякоть», а не «болото»: болото по-польски bagno. Оборот wyrzucać pieniądze w błoto — «бросать деньги на ветер»."
idioms:
  - { pl: "wyrzucać pieniądze w błoto", ru: "выбрасывать деньги на ветер" }
  - { pl: "zmieszać z błotem", ru: "смешать с грязью" }
