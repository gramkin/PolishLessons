etymology: "Из праславянского *stьdza «тропа», от которого русское книжное «стезя», украинское «стежка» и польское ścieżka — одно и то же слово в трёх обличьях. Польская форма получила уменьшительный суффикс -ka, поэтому буквально значит «тропочка». Выражение iść własną ścieżką дословно отвечает русскому «идти своей стезёй»."
memory: "ścieżka — «тропинка», и у неё есть русский родственник: книжное «стезя» (праслав. *stьdza), а ещё украинское «стежка». Запомните: ścieżka dźwiękowa — «звуковая дорожка», и предложный ścieżce с k → c."
