notes:
  - { kind: false-friend, text: "У слова есть настоящий русский родственник, только книжный: «стезя». И польское ścieżka, и «стезя» идут от праславянского *stьdza, так что «пойти своей стезёй» и iść własną ścieżką — одно и то же выражение. В обиходе же ścieżka переводится простым «тропинка» или «дорожка», а в музыке — «дорожка»: ścieżka dźwiękowa «звуковая дорожка, саундтрек»." }
  - { kind: usage, text: "Дательный и предложный совпадают: ścieżce, с чередованием k → c (na ścieżce). Родительный множественного — ścieżek, с беглым e. В инструментальном ścieżką обозначают путь движения: iść ścieżką «идти тропинкой», без предлога, как в русском." }
  - { kind: government, text: "Направление — предлог do или przez: ścieżka do jeziora, ścieżka przez las. Путь движения — творительный без предлога: wracać ścieżką. В переносном значении слово берёт притяжательные: własna ścieżka, swoje ścieżki." }
  - { kind: pronunciation, text: "Звательный падеж у неодушевлённых существительных формально есть, но в живой речи почти не встречается: его берегут для стихов, песен и шутливого обращения к вещи. Примеры в этом слоте именно такие — запоминать их как образец повседневной речи не нужно." }
collocations:
  - { pl: "ścieżka dźwiękowa", ru: "звуковая дорожка, саундтрек" }
  - { pl: "ścieżka rowerowa", ru: "велодорожка" }
