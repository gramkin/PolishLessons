# review
id: nastepnie
format: 2
lemma: "następnie"
rank: 1738
pos: adv
pron: { cyr: "настэ́мпне" }
senses:
  - id: then
    ru: "затем, потом, далее"
    examples:
      - pl: "Następnie mocno kopnął piłkę."
        ru: "Затем он сильно ударил по мячу."
        source: { kind: translated, id: 723706 }
      - pl: "Studiował angielski, a następnie matematykę."
        ru: "Он изучал английский, а затем математику."
        source: { kind: translated, id: 352865 }
      - pl: "Następnie Miki trafił do szpitala."
        ru: "Затем Мики попал в больницу."
        source: { kind: translated, id: 901503 }
  - id: next-step
    ru: "дальше, следующим шагом"
    examples:
      - pl: "Co powinnam zrobić następnie?"
        ru: "Что мне делать дальше?"
        source: { kind: translated, id: 2139051 }
      - pl: "Zakładam, że wiesz, co mamy następnie zrobić."
        ru: "Полагаю, ты знаешь, что нам делать дальше."
        source: { kind: translated, id: 3880069 }
      - pl: "Następnie dodaj jabłka pokrojone na kawałki."
        ru: "Затем добавь нарезанные кусочками яблоки."
        source: { kind: translated, id: 1262534 }
notes:
  - { kind: usage, text: "następnie перечисляет шаги по порядку: najpierw…, następnie…, wreszcie… «сначала…, затем…, наконец…». В рецептах и инструкциях это основное слово." }
  - { kind: usage, text: "potem — просто «потом», о времени вообще; następnie звучит более книжно и всегда подразумевает очередь, порядок." }
  - { kind: false-friend, text: "Не путайте наречие następnie «затем» с прилагательным następny «следующий»: następny dzień «следующий день», но następnie poszedł do domu «затем он пошёл домой»." }
  - { kind: usage, text: "Слово не изменяется: это наречие, у него одна форма." }
collocations:
  - { pl: "a następnie", ru: "а затем" }
  - { pl: "najpierw, następnie", ru: "сначала, затем" }
  - { pl: "co następnie", ru: "что дальше" }
family:
  - { pl: "następny", ru: "следующий", relation: root, id: nastepny }
  - { pl: "potem", ru: "потом", relation: root, id: potem }
  - { pl: "następować", ru: "следовать", relation: root }
etymology: "От następować «следовать», того же корня, что русское «наступать», «наступить». Русское «затем» построено иначе — от «за тем»."
memory: "następnie — «затем, далее», слово порядка: najpierw…, następnie…, wreszcie…. Просто «потом» — это potem. И не путайте с następny «следующий»."
idioms:
  - { pl: "a następnie", ru: "а затем" }
  - { pl: "najpierw, następnie", ru: "сначала, затем" }
  - { pl: "co następnie?", ru: "что дальше?" }
