notes:
  - { kind: false-friend, text: "SZYNKA — «ветчина», а не «шинок» и не «шина». Слово немецкое. Ломтик ветчины — PLASTER SZYNKI, вес в магазине называют в DEKO: DWADZIEŚCIA DEKO SZYNKI, «двести граммов ветчины»." }
  - { kind: usage, text: "Девять живых форм, женский род. Перед E K переходит в C: W SZYNCE. Родительный множественного — SZYNEK. Звательный не даётся." }
  - { kind: government, text: "Бутерброд с ветчиной — KANAPKA Z SZYNKĄ, Z с творительным. Ломтик ветчины — PLASTER SZYNKI, родительный. В магазине количество — тоже родительный: KILO SZYNKI." }
  - { kind: pronunciation, text: "Читается «шы́нка», ударение на первом слоге. SZY — «шы»." }
collocations:
  - { pl: "plaster szynki", ru: "ломтик ветчины" }
  - { pl: "szynka wędzona", ru: "копчёная ветчина" }
