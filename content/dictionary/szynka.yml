etymology: "Из немецкого слова, которым называют окорок. В русский это слово не попало: там своё «ветчина», от «ветхий», «старый, выдержанный»."
memory: "Szynka — ветчина. Читается «шы́нка». Plaster szynki — ломтик ветчины. Dwadzieścia deko szynki — двести граммов ветчины."
