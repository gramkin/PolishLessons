# review
id: przyciagac
format: 2
lemma: "przyciągać"
rank: 2078
pos: verb
aspect: imperf
pron: { cyr: "пшычё́нгаць" }
senses:
  - id: attract
    ru: "притягивать, привлекать"
    examples:
      - pl: "Kwiaty przyciągają pszczoły."
        ru: "Цветы привлекают пчёл."
        source: { kind: translated, id: 524057 }
      - pl: "Ciepło przyciąga komary."
        ru: "Тепло привлекает комаров."
        source: { kind: translated, id: 2246894 }
      - pl: "Magnesy przyciągają żelazo."
        ru: "Магниты притягивают железо."
        source: { kind: translated, id: 12203728 }
  - id: draw-attention
    ru: "привлекать (внимание, взгляды)"
    examples:
      - pl: "Jezioro, usiane wyspami, przyciągało uwagę młodych podróżników."
        ru: "Озеро, усеянное островами, привлекло внимание юных путешественников."
        source: { kind: tatoeba, id: 2495839 }
      - pl: "Jej różowa wieczorowa suknia przyciągała spojrzenia."
        ru: "Её розовое вечернее платье притягивало взгляды."
        source: { kind: translated, id: 357050 }
notes:
  - { kind: government, text: "Винительный падеж: przyciągać wzrok «привлекать взгляд», przyciągać uwagę «привлекать внимание»." }
  - { kind: usage, text: "Совершенный вид — przyciągnąć." }
  - { kind: false-friend, text: "Корень ciągnąć «тянуть» — ср. русское «тягать», «притягивать». Модель полностью совпадает." }
  - { kind: usage, text: "Przeciwieństwa się przyciągają «противоположности притягиваются» — такая же поговорка, как в русском." }
collocations:
  - { pl: "przyciągać wzrok", ru: "притягивать взгляд" }
  - { pl: "przyciągać uwagę", ru: "привлекать внимание" }
etymology: "przy- + ciągnąć «тянуть», праславянское *tęgnǫti; ср. русское «тянуть», «притягивать»."
memory: "przyciągać — «притягивать, привлекать», от ciągnąć «тянуть», как русское «притягивать» от «тянуть». Запомните przyciągać wzrok «притягивать взгляд»."
idioms:
  - { pl: "przyciągać wzrok", ru: "притягивать взгляд" }
  - { pl: "przeciwieństwa się przyciągają", ru: "противоположности притягиваются" }
