  - id: botch
    ru: "разг. портить, заваливать (дело, текст)"
    examples:
      - pl: "Pierniczył ten raport trzy razy."
        ru: "Он портил этот отчёт три раза."
        source: { kind: authored }
      - pl: "Raport pierniczony trzy razy stracił sens."
        ru: "Отчёт, испорченный трижды, потерял смысл."
        source: { kind: authored }
  - id: talk-to-death
    ru: "разг. заболтать, замотать (тему, проект)"
    examples:
      - pl: "Pierniczono o tym na każdym zebraniu."
        ru: "Об этом мололи на каждом собрании."
        source: { kind: authored }
      - pl: "Pierniczony przez wszystkich projekt w końcu upadł."
        ru: "Проект, который все заболтали, в конце концов провалился."
        source: { kind: authored }
notes:
  - { kind: register, text: "Это ЭВФЕМИЗМ: слово подставлено вместо грубого pieprzyć, чтобы не выражаться. Поэтому pierniczyć звучит грубовато и фамильярно, но не бранно — примерно как русское «трепаться» или «молоть». В официальной речи неуместно; нейтральные замены — opowiadać głupstwa, gadać bez sensu." }
  - { kind: government, text: "В значении «нести чушь» глагол непереходный и часто идёт с предлогом o: pierniczyć o polityce. В значении «портить» берёт ВИНИТЕЛЬНЫЙ падеж: pierniczyć raport. Отсюда полный набор страдательных причастий, включая мужсколичное pierniczeni — о людях, которым заморочили голову." }
  - { kind: usage, text: "Несовершенный вид. Приставочные дают оттенки: spierniczyć «запороть», napierniczyć «наворотить». Все они того же разговорного регистра." }
  - { kind: false-friend, text: "Родственника у глагола в русском нет, зато корень знаком: pierniczyć идёт от piernik «пряник», а piernik — от pieprz «перец», которое прямо отвечает русскому «перец». Так что ругательство здесь выстроено на пряниках. Из того же гнезда stary piernik — «старый хрыч»." }
collocations:
  - { pl: "co ty pierniczysz?", ru: "что ты несёшь? (разг.)" }
  - { pl: "nie pierniczy!", ru: "да ну! не выдумывай! (разг.)" }
  - { pl: "pierniczyć o niczym", ru: "болтать ни о чём" }
family:
  - { pl: "piernik", ru: "пряник", relation: root }
  - { pl: "pieprz", ru: "перец", relation: root }
  - { pl: "pierniczenie", ru: "болтовня, трёп", relation: derived }
etymology: "Образовано от piernik «пряник», а piernik — от старого прилагательного pierny «перечный», то есть от pieprz «перец», которое прямо отвечает русскому «перец»: пряник был выпечкой на перце и других пряностях. Глагол возник как эвфемизм, безобидная замена грубого pieprzyć — по той же модели, по какой в русском вместо брани говорят что-нибудь созвучное и невинное."
memory: "pierniczyć — «нести чушь», и это эвфемизм вместо грубого pieprzyć. Корень вполне мирный: piernik «пряник» от pieprz «перец». «Co ty pierniczysz?» значит «что ты несёшь?»."
idioms:
  - { pl: "co ty pierniczysz?", ru: "что ты несёшь? (разг.)" }
  - { pl: "stary piernik", ru: "старый хрыч" }
