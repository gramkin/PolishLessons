# review
id: imie
format: 2
lemma: "imię"
rank: 257
pos: noun
pron: { cyr: "и́ме" }
senses:
  - id: name
    ru: "имя"
    examples:
      - pl: "Tom to imię."
        ru: "Том — это имя."
        source: { kind: tatoeba, id: 13930485 }
      - pl: "Znam jego imię."
        ru: "Я знаю его имя."
        source: { kind: tatoeba, id: 532111 }
      - pl: "Nie lubię mojego imienia."
        ru: "Мне не нравится моё имя."
        source: { kind: tatoeba, id: 7983146 }
  - id: to-be-called
    ru: "mieć na imię — зваться, называться по имени"
    note: "Jak masz na imię? — буквально «Как имеешь на имя?», то есть «Как тебя зовут?»."
    examples:
      - pl: "Jak masz na imię?"
        ru: "Как тебя зовут?"
        source: { kind: tatoeba, id: 406682 }
      - pl: "Mam na imię Jack."
        ru: "Меня зовут Джек."
        source: { kind: tatoeba, id: 526461 }
      - pl: "Wpisz swoje imię i adres."
        ru: "Впиши своё имя и адрес."
        source: { kind: tatoeba, id: 3743389 }
notes:
  - { kind: usage, text: "Главная фраза: Jak masz na imię? «Как тебя зовут?» — ответ Mam na imię Jack. Вежливо: Jak pan ma na imię?" }
  - { kind: usage, text: "Различайте imię «имя» и nazwisko «фамилия». Русское «название» — это nazwa, а не imię." }
  - { kind: usage, text: "Склонение с наращением -en-, ровно как в русском: imię, но imienia, imieniu — как «имя, имени»." }
collocations:
  - { pl: "mieć na imię", ru: "зваться: mam na imię… — меня зовут…" }
  - { pl: "po imieniu", ru: "по имени" }
  - { pl: "w imię", ru: "во имя" }
  - { pl: "imię i nazwisko", ru: "имя и фамилия" }
etymology: "Праславянское *jьmę — то же слово, что русское «имя»; в обоих языках косвенные падежи наращивают -en-: imienia, как «имени»."
memory: "Jak masz na imię? — «Как тебя зовут?», и ответ Mam na imię… Склонение наращивает -en- точно как в русском: imię — imienia, «имя — имени»."
idioms:
  - { pl: "w imię", ru: "во имя" }
  - { pl: "nazywać rzeczy po imieniu", ru: "называть вещи своими именами" }
  - { pl: "mieć na imię", ru: "зваться: mam na imię… — меня зовут…" }
formExamplesSkip:
  - { form: "imię", cell: "Звательный", reason: "звательный падеж: к предмету или понятию не обращаются" }
