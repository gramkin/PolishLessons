etymology: "Приставка WY- плюс CZYŚCIĆ, от прилагательного CZYSTY, праславянское *čistъ — то же слово, что русское «чистый». Корень один и тот же во всей семье: CZYSTOŚĆ и «чистота», OCZYSZCZAĆ и «очищать», CZYŚCIEC и «чистилище». Приставка WY- восходит к праславянскому *vy- и отвечает русской ВЫ- буквально, что делает пару WYCZYŚCIĆ и «вычистить» полным соответствием во всех частях. Чередование ŚĆ и SZCZ объясняется старым смягчением перед гласными переднего ряда: исходное *čistiti дало мягкое ŚĆ в одних формах и шипящее SZCZ в других, и такое же раздвоение видно в русском «чистить» рядом с «очищать»."
memory: "Приставка wy- это русская вы-, без исключений: wyczyścić «вычистить», wyjść «выйти», wypić «выпить». Чередование в основе: инфинитив wyczyścić, но будущее wyczyszczę и причастие wyczyszczony, то есть ść переходит в szcz. Важно не путать с уборкой: убрать квартиру это posprzątać mieszkanie, а czyścić относится к предмету, а не к помещению."
