notes:
  - { kind: usage, text: "Приставка WY- отвечает русской ВЫ- почти без исключений, и это одно из самых выгодных соответствий в языке: WYCZYŚCIĆ и «вычистить», WYJŚĆ и «выйти», WYPIĆ и «выпить», WYBRAĆ и «выбрать», WYRZUCIĆ и «выбросить». Значение тоже совпадает — доведение действия до конца или движение наружу. Несовершенный партнёр — CZYŚCIĆ. В основе работает чередование ŚĆ и SZCZ: инфинитив WYCZYŚCIĆ, но будущее WYCZYSZCZĘ, WYCZYSZCZĄ и всё причастие WYCZYSZCZONY. Та же мена видна в UCZCIĆ и UCZCZONY." }
  - { kind: false-friend, text: "Глагол значит «чистить» в прямом смысле — предмет, поверхность, пятно, — но убирать помещение им не говорят. Русское «убрать квартиру» переводится как POSPRZĄTAĆ MIESZKANIE, а не WYCZYŚCIĆ; WYCZYŚCIĆ MIESZKANIE прозвучит как капитальная чистка перед переездом. Разделение простое: SPRZĄTAĆ — наводить порядок в помещении, CZYŚCIĆ — удалять грязь с предмета. Прилагательное CZYSTY совпадает с русским «чистым» во всех значениях, включая «чистый лист», CZYSTA KARTKA." }
  - { kind: government, text: "Прямое дополнение в винительном: WYCZYŚCIĆ BUTY, WYCZYŚCIĆ FILTR, WYCZYŚCIĆ DYWAN. Средство идёт творительным без предлога, как и по-русски: WYCZYŚCIĆ SZCZOTKĄ «вычистить щёткой», WYCZYŚCIĆ PARĄ «вычистить паром». Во втором значении появляется предлог Z с родительным: WYCZYŚCIĆ KOGOŚ Z PIENIĘDZY «обчистить кого-то». Возвратное WYCZYŚCIĆ SIĘ употребляется о вещах и о воде: WODA SIĘ WYCZYŚCIŁA «вода отстоялась и стала чистой»." }
  - { kind: pronunciation, text: "Читается «вычы́сьцичь», три слога, ударение на предпоследнем. Буква Y даёт «ы», поэтому начало звучит «вычы», а не «вичи». Самое трудное — сочетание ŚC перед I: два мягких звука подряд, «сьць», которых в русском рядом не бывает. В повелительном наклонении это сочетание выходит на конец слова: WYCZYŚĆ звучит «вычысьць», и обе мягкости надо успеть произнести. В формах с SZCZ картина другая, твёрдая: WYCZYSZCZONY это «вычыщо́ны», с долгим «щ»." }
  - { kind: register, text: "Слово нейтральное и бытовое. Частые сочетания: WYCZYŚCIĆ BUTY «почистить обувь», WYCZYŚCIĆ ZĘBY «почистить зубы», WYCZYŚCIĆ PLAMĘ «вывести пятно», WYCZYŚCIĆ KOMIN «прочистить дымоход». Родственные слова в ходу: CZYSTY «чистый», CZYSTOŚĆ «чистота», CZYŚCIK «чистящее средство», PRALNIA CHEMICZNA «химчистка». Переносное значение «обчистить» принадлежит разговорной речи и звучит так же свободно, как русское «обчистили до нитки»." }
