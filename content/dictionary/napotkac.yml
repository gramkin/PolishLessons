  - { pl: "spotkać", ru: "встретить", relation: root, id: spotkac }
  - { pl: "napotkanie", ru: "встреча, столкновение (с чем-л.)", relation: derived }
etymology: "Приставка NA- и POTKAĆ «встретить, натолкнуться», тот же корень, что в SPOTKAĆ и POTYKAĆ SIĘ «спотыкаться». Русское «спотыкаться» и «ткнуться» — родственники."
memory: "Napotkać — «наткнуться»: na-potkać звучит почти как «на-ткнуться». Napotkać trudności — винительный без предлога."
idioms:
