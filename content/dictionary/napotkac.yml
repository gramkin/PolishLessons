        source: { kind: translated, id: 956904 }
notes:
  - { kind: government, text: "NAPOTKAĆ — переходный глагол с ВИНИТЕЛЬНЫМ без предлога: NAPOTKAĆ TRUDNOŚCI, NAPOTKAĆ OPÓR. По-русски здесь предлог: «столкнуться С трудностями», «натолкнуться НА сопротивление». Не добавляйте NA или Z по русской привычке." }
  - { kind: usage, text: "Совершенный вид; несовершенный — NAPOTYKAĆ. Спряжение на -AM: NAPOTKAM, NAPOTKASZ, NAPOTKAJĄ — это будущее время: «столкнусь, столкнёшься»." }
  - { kind: register, text: "Книжноватое слово: отчёты, новости, деловая речь (NAPOTKANE PROBLEMY «возникшие проблемы»). В разговоре о встрече с человеком чаще SPOTKAĆ; NAPOTKAĆ подчёркивает случайность." }
  - { kind: pronunciation, text: "Читается «напо́ткаць»: ударение на предпоследнем слоге, конечное Ć — мягкое «ць». NAPOTKAŁ — «напо́ткау»: Ł читается как «у». Корень тот же, что в SPOTKAĆ «встретить»." }
collocations:
  - { pl: "napotkać trudności", ru: "столкнуться с трудностями" }
  - { pl: "napotkać opór", ru: "встретить сопротивление" }
  - { pl: "napotkać przeszkodę", ru: "натолкнуться на препятствие" }
  - { pl: "napotkany przechodzień", ru: "случайный прохожий" }
family:
