# review
id: latwy
format: 2
lemma: "łatwy"
rank: 649
pos: adj
pron: { cyr: "уа́твы" }
senses:
  - id: easy
    ru: "лёгкий, простой"
    examples:
      - pl: "Masz łatwy do zapamiętania adres email."
        ru: "У тебя легко запоминающийся электронный адрес."
        source: { kind: tatoeba, id: 601720 }
      - pl: "Test był łatwy."
        ru: "Тест был лёгкий."
        source: { kind: translated, id: 8431997 }
      - pl: "Hiszpański jest łatwy."
        ru: "Испанский лёгкий."
        source: { kind: translated, id: 8760911 }
  - id: thats-easy
    ru: "to łatwe — это легко"
    note: "Средний род работает самостоятельно."
    examples:
      - pl: "To łatwe zwycięstwo."
        ru: "Это лёгкая победа."
        source: { kind: tatoeba, id: 547980 }
      - pl: "To jest po prostu zbyt łatwe."
        ru: "Это слишком просто."
        source: { kind: tatoeba, id: 5014767 }
      - pl: "Czy wy myślicie, że to łatwe?"
        ru: "Думаете, это легко?"
        source: { kind: tatoeba, id: 13781662 }
  - id: not-easy
    ru: "nie jest łatwy — непростой"
    note: "Частый способ сказать «трудный» через отрицание."
    examples:
      - pl: "Grecki nie jest łatwym językiem."
        ru: "Греческий — язык непростой."
        source: { kind: tatoeba, id: 826692 }
      - pl: "Szachy nie są łatwą grą."
        ru: "Шахматы – непростая игра."
        source: { kind: tatoeba, id: 11878571 }
      - pl: "Niemiecki nie jest łatwym językiem."
        ru: "Немецкий — непростой язык."
        source: { kind: translated, id: 449000 }
  - id: easier
    ru: "łatwiejszy — легче, проще"
    examples:
      - pl: "Im więcej ludzi, tym praca łatwiejsza."
        ru: "Чем больше людей, тем легче работа."
        source: { kind: tatoeba, id: 750573 }
      - pl: "Angielski jest łatwiejszy niż grecki."
        ru: "Английский легче греческого."
        source: { kind: translated, id: 11311537 }
      - pl: "Zadaj mi łatwiejsze pytanie."
        ru: "Задай мне вопрос полегче."
        source: { kind: translated, id: 3026053 }
notes:
  - { kind: pronunciation, text: "Начальное ł даёт «в»-образный звук, так что слово звучит ближе к «уа́твы». Главное — не читать ł как русское «л»." }
  - { kind: usage, text: "Средний род łatwe работает самостоятельно: To łatwe «Это легко», To zbyt łatwe." }
  - { kind: usage, text: "Очень частый способ сказать «трудный» — отрицание: Grecki nie jest łatwym językiem «Греческий — язык непростой»." }
  - { kind: usage, text: "Степени правильные: łatwy — łatwiejszy — najłatwiejszy, с чередованием w/wi." }
  - { kind: usage, text: "Наречие — łatwo «легко»; существительное — łatwość «лёгкость». Устойчивое łatwo powiedzieć «легко сказать»." }
collocations:
  - { pl: "To łatwe", ru: "Это легко" }
  - { pl: "nie jest łatwy", ru: "непростой" }
  - { pl: "łatwiejszy niż…", ru: "легче, чем…" }
  - { pl: "łatwo powiedzieć", ru: "легко сказать" }
family:
  - { pl: "łatwo", ru: "легко", relation: derived }
  - { pl: "łatwość", ru: "лёгкость", relation: derived }
  - { pl: "trudny", ru: "трудный", relation: root }
etymology: "Праславянское *lьgъtъvъ, связанное с lekki «лёгкий» — то же гнездо, что русское «льгота» и «лёгкий»."
memory: "łatwy — «лёгкий, простой», и первое, что надо поправить, — произношение: начальное ł даёт «в»-образный звук, слово звучит ближе к «уа́твы». Средний род работает самостоятельно: To łatwe «Это легко». А «трудный» поляк очень часто выражает отрицанием: Grecki nie jest łatwym językiem. Степени правильные — łatwy, łatwiejszy, najłatwiejszy."
idioms:
  - { pl: "To łatwe", ru: "Это легко" }
  - { pl: "nie jest łatwy", ru: "непростой" }
  - { pl: "łatwo powiedzieć", ru: "легко сказать" }
