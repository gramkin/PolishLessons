etymology: "От имени святого Николая Мирликийского, по-гречески Nikolaos — «победа народа», из nike «победа» и laos «народ». Имя пришло к славянам с христианством и у поляков дало Mikołaj, у русских «Николай». Нарицательное значение выросло из обычая дарить детям подарки в его день. Отсюда mikołajki и mikołajek."
memory: "mikołaj — «Дед Мороз», от имени святого Николая. Главное отличие от русского обычая: подарки приносят в ночь на ШЕСТОЕ ДЕКАБРЯ, на праздник mikołajki, а не под Новый год. Множественное неличное: mikołaje."
idioms:
