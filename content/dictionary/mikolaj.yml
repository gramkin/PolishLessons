notes:
  - { kind: false-friend, text: "ПРАЗДНИК НЕ СОВПАДАЕТ С РУССКИМ. В Польше подарки от святого Николая приносят в ночь на ШЕСТОЕ ДЕКАБРЯ, и день этот называется mikołajki. Русский Дед Мороз приходит в новогоднюю ночь, то есть на месяц позже. Детям кладут подарки в ботинок или под подушку, а не под ёлку: ёлка — это уже Рождество." }
  - { kind: usage, text: "Со строчной буквы mikołaj значит ряженого или сам подарок, с прописной Mikołaj — это имя святого или человека. Множественное у слова неличное: mikołaje, mikołajów — так говорят о ряженых и о фигурках, а не «mikołajowie». Уменьшительное mikołajek, праздник — mikołajki." }
  - { kind: pronunciation, text: "Четыре слога, ударение на предпоследнем: mi-ko-ŁAJ — точнее mi-KO-łaj. Ł читается как краткое у, поэтому конец звучит «-оуай»: «мико́уай». В косвенных падежах ударение остаётся предпоследним: mikołaja — «микоуа́я»." }
  - { kind: register, text: "Нейтрально и повседневно, особенно в декабре. В религиозном контексте говорят Święty Mikołaj полностью. Разговорное robić komuś mikołaja значит «дарить подарок на Николая», а chodzić za mikołaja — «работать Дедом Морозом»." }
collocations:
  - { pl: "Święty Mikołaj", ru: "святой Николай, Дед Мороз" }
  - { pl: "czekać na mikołaja", ru: "ждать Деда Мороза" }
  - { pl: "chodzić za mikołaja", ru: "работать Дедом Морозом" }
