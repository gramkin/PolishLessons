notes:
  - { kind: false-friend, text: "Корень общий и русскому знакомый: UCZYNEK от CZYNIĆ «делать», того же корня, что «учинить», «чинить», «причина» и «чин». Но русское «учинить» звучит сегодня канцелярски и почти всегда о чём-то дурном, а польское UCZYNEK совершенно нейтрально и чаще доброе: DOBRY UCZYNEK это «доброе дело». Рядом стоит прилагательное UCZYNNY, которое значит не «учёный» и не «деятельный», а «услужливый, отзывчивый»." }
  - { kind: usage, text: "Девять форм, мужской род, неодушевлённое. Беглое E выпадает во всех косвенных падежах: UCZYNEK, но UCZYNKU, UCZYNKIEM, UCZYNKOWI. Множественное UCZYNKI очень частое, потому что о поступках обычно говорят во множественном: UCZYNKI MÓWIĄ WIĘCEJ NIŻ SŁOWA. В религиозном языке закрепилось UCZYNKI MIŁOSIERDZIA «дела милосердия»." }
  - { kind: government, text: "С поличным — устойчивое NA GORĄCYM UCZYNKU, предлог NA с местным падежом, буквально «на горячем поступке». Русский образ другой, «с поличным», то есть с украденной вещью, но смысл тот же. Совершить поступок — SPEŁNIĆ UCZYNEK или POPEŁNIĆ UCZYNEK, причём первый глагол берут для добрых дел, а второй для дурных, как и в паре SPEŁNIĆ MARZENIE против POPEŁNIĆ BŁĄD." }
  - { kind: pronunciation, text: "Читается «учы́нэк», три слога, ударение на втором. Сочетание CZ даёт «ч», а следующее Y даёт «ы», поэтому середина звучит «чы», а не «чи»: это самое частое место ошибки для русского. Конечное E перед K звучит как «э». В косвенных падежах беглое E пропадает, и UCZYNKU слышно «учы́нку», в три слога без «э»." }
  - { kind: register, text: "Слово нейтральное, с лёгким оттенком книжности: DOBRY UCZYNEK, ZŁY UCZYNEK, UCZYNKI MIŁOSIERDZIA. В разговоре о повседневных делах чаще скажут просто CZYN или DZIAŁANIE. Зато оборот NA GORĄCYM UCZYNKU совершенно обиходен и звучит в новостях и в разговоре постоянно: ZŁAPAĆ KOGOŚ NA GORĄCYM UCZYNKU значит застать на месте преступления." }
collocations:
  - { pl: "dobry uczynek", ru: "доброе дело" }
  - { pl: "zły uczynek", ru: "дурной поступок" }
