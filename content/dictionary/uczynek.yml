  - { pl: "czynić", ru: "делать, совершать", relation: root, id: czynic }
  - { pl: "uczynny", ru: "услужливый, отзывчивый", relation: derived }
etymology: "От CZYNIĆ «делать» с приставкой U-, от праславянского корня ČIN-, давшего русские «чинить», «учинить», «причина» и «чин». Исходное значение корня — ставить в порядок, устраивать, отсюда и «чин» как порядок, и «причина» как то, что устраивает событие. Польское UCZYNEK сохранило нейтральность и склонность к доброму, а русское «учинить» сдвинулось к дурному и к канцелярии, так что совпадают слова только по корню."
memory: "Корень тот же, что в русских «учинить», «чинить», «причина» и «чин», но оттенок перевёрнут: русское «учинить» почти всегда о дурном, а польский uczynek нейтрален и чаще добрый, dobry uczynek. Соседнее uczynny значит «услужливый», а не «учёный». Главный оборот na gorącym uczynku, буквально «на горячем поступке», отвечает русскому «с поличным». Читается «учы́нэк», где cz плюс y дают «чы»."
idioms:
  - { pl: "złapać na gorącym uczynku", ru: "поймать с поличным, застать на месте преступления" }
