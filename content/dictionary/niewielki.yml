etymology: "Сложение отрицания NIE- и прилагательного WIELKI «большой, великий», из праславянского *velikъ — того же корня, что русские «великий», «велик», «величина». Исходно корень значил не размер, а превосходство: *velь- «очень, весьма», откуда и польское WIELCE «весьма» в книжном стиле. Русский развил из того же корня и «великого» в смысле величия, и «великий» как размер в устаревшем употреблении, а для обычного размера взял «большой», от «большой» в значении «более сильный». Польский же оставил WIELKI и для величия, и для размера, и потому NIEWIELKI значит просто «небольшой», без всякого оттенка умаления заслуг. Приставка NIE- в польском сливается с прилагательными всегда, и это отличает её от русской, где слитность зависит от противопоставления."
memory: "Одно слово, слитно, как русское «небольшой» — и устроено так же: отрицание плюс «великий». Мягче, чем mały: не называет размер прямо, а отказывает в величине. Степени берёт у mały: mniejszy, najmniejszy, потому что niewielszy не говорят. Мужско-личное множественное niewielcy, k переходит в c."
