notes:
  - { kind: usage, text: "Это одно слово, а не отрицание с частицей, и пишется слитно — отсюда и отдельная карточка. Разница с MAŁY тонкая, но есть: MAŁY значит просто «маленький», а NIEWIELKI мягче и уклончивее, как русское «небольшой» в сравнении с «маленьким». NIEWIELKI POKÓJ звучит вежливее, чем MAŁY POKÓJ, потому что не называет размер прямо, а лишь отказывает в величине. Русское соответствие тут буквальное: «небольшой» устроено точно так же, из отрицания и корня «большой». Степени сравнения берутся от MAŁY: MNIEJSZY, NAJMNIEJSZY, потому что NIEWIELSZY в польском не говорят." }
  - { kind: pronunciation, text: "Читается «неве́льки», ударение на предпоследнем слоге. Сочетание LKI на конце даёт мягкое «льки», а не «лки»: буква I после L работает знаком мягкости. Начальное NIE произносится «не», одним слогом. Мужско-личная форма множественного NIEWIELCY показывает переход K в C со смягчением: «неве́льцы» — то же чередование, что в WIELKI и WIELCY, POLSKI и POLSCY." }
  - { kind: government, text: "Прилагательное согласуется с существительным и ничем не управляет. Степени сравнения заимствует у MAŁY, как сказано выше, и это надо держать в голове: сравнительная степень от NIEWIELKI есть MNIEJSZY. При сравнении — предлог OD с родительным или союз NIŻ: MNIEJSZY OD POKOJU OBOK, MNIEJSZY NIŻ POKÓJ OBOK. Отрицание прилагательного пишется слитно, как и само слово: NIENIEWIELKI не существует, в этом случае скажут просто DUŻY или SPORY." }
  - { kind: false-friend, text: "Опасность не в значении, а в слитном написании. Польское NIEWIELKI — одно слово, и так же пишутся NIEDUŻY, NIEDALEKI, NIEMAŁY. Но стоит появиться противопоставлению, и пишут раздельно: NIE WIELKI, ALE ŚREDNI «не большой, а средний». Русский в этом месте ведёт себя точно так же: «небольшой» слитно, «не большой, а средний» раздельно. Так что правило переносится без изменений, и это один из немногих случаев, когда польская и русская орфография совпадают до запятой." }
