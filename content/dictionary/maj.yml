notes:
  - { kind: usage, text: "Основа мягкая, на -J, и это задаёт два удобных совпадения. Родительный единственного — MAJA, местный — MAJU: W MAJU «в мае». Родительный множественного — MAJÓW, с полным окончанием, потому что мягкая основа требует -ÓW. Так же устроен ZWYCZAJ с ZWYCZAJU и ZWYCZAJÓW, и KRAJ с KRAJU. Главное же практическое правило касается дат: месяц в них стоит в родительном падеже, как и в русском. PIERWSZEGO MAJA «первого мая», DWUDZIESTEGO MAJA «двадцатого мая», и само число тоже в родительном. Названия месяцев в польском пишутся с маленькой буквы, как и в русском." }
  - { kind: false-friend, text: "Слово совпадает с русским полностью, и подвоха в нём нет, но стоит знать производные, потому что одно из них прочно вошло в быт. MAJÓWKA — это длинные выходные в начале мая, которые поляки проводят за городом; русского однословного соответствия нет, и переводить приходится описательно, «майские праздники». Прилагательное MAJOWY значит «майский»: MAJOWY DESZCZ. Не путайте само слово с именем MAJA, которое пишется так же, как родительный падеж, и различается только контекстом и большой буквой. И помните, что в польском названия месяцев почти все славянские по происхождению, а MAJ один из двух латинских, вместе с MARZEC." }
  - { kind: government, text: "Мужской род, неодушевлённое. «В мае» — предлог W с местным: W MAJU. «До мая» — DO с родительным: DO MAJA. «С мая» — OD с родительным: OD MAJA. В датах месяц в родительном: PIERWSZEGO MAJA, PIĘTNASTEGO MAJA. «На май» о планах — NA с винительным: PLANY NA MAJ. Частотные сочетания: POCZĄTEK MAJA «начало мая», KONIEC MAJA, MAJOWY WEEKEND, ŚWIĘTO PIERWSZEGO MAJA «праздник Первого мая». Вопрос о дате: KTÓREGO MAJA? «какого мая?», и ответ тоже в родительном." }
  - { kind: pronunciation, text: "Читается «май», один слог, поэтому вопрос об ударении не встаёт. Буква J даёт «й», коротко и ясно. В родительном MAJA слогов два, ударение на первом: «ма́я». В местном MAJU слышно «ма́ю». В родительном множественного MAJÓW буква Ó читается «у», а конечное W оглушается до «ф»: «ма́юф». Слово звучит точно как русское, и это один из немногих случаев полного совпадения и в написании, и в произношении." }
