etymology: "Из латинского MAIUS, названия месяца, посвящённого богине Майе, покровительнице роста и плодородия. Оба наших языка взяли слово из латыни через церковный календарь, и совпадение полное. Любопытно, что в польском названиях месяцев латинских всего два, MARZEC и MAJ, а остальные славянские и описательные: STYCZEŃ от стыка года, LUTY от лютых морозов, KWIECIEŃ от цветения, LISTOPAD от падения листьев. Русский поступил наоборот и взял из латыни все двенадцать, поэтому польские названия месяцев для русского непрозрачны почти целиком — кроме этих двух. Производное MAJÓWKA образовано суффиксом -ÓWKA, который делает названия вещей и событий по признаку, как ŻARÓWKA «лампочка» от ŻAR."
memory: "Полное совпадение с русским, и один из двух латинских месяцев в польском — второй marzec; остальные славянские и непрозрачные (styczeń, luty, kwiecień, listopad). Основа мягкая: w maju, do maja, родительный множественного majów. В датах месяц в родительном, как и по-русски: pierwszego maja. Majówka — майские выходные за городом, одним словом по-русски не передать."
idioms:
  - { pl: "w maju", ru: "в мае" }
  - { pl: "majówka", ru: "майские выходные за городом" }
