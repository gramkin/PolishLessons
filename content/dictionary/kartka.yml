# review
id: kartka
format: 2
lemma: "kartka"
rank: 2398
pos: noun
pron: { cyr: "ка́ртка" }
senses:
  - id: sheet
    ru: "листок, лист (бумаги)"
    examples:
      - pl: "Zapisz na tej kartce leki, których potrzebujesz."
        ru: "Запишите на этом листе необходимые вам лекарства."
        source: { kind: tatoeba, id: 10695711 }
      - pl: "Poproszę o kartkę papieru."
        ru: "Дайте, пожалуйста, лист бумаги."
        source: { kind: translated, id: 511551 }
      - pl: "Zegnij kartkę w połowie."
        ru: "Согни лист пополам."
        source: { kind: translated, id: 363780 }
  - id: card
    ru: "открытка"
    examples:
      - pl: "Przysłał mi kartkę urodzinową."
        ru: "Он прислал мне открытку на день рождения."
        source: { kind: translated, id: 593937 }
      - pl: "W okresie Bożego Narodzenia wysyłamy przyjaciołom świąteczne kartki."
        ru: "На Рождество мы посылаем друзьям праздничные открытки."
        source: { kind: translated, id: 750539 }
notes:
  - { kind: government, text: "Женский род: ta kartka, tej kartki. Написать на листке — napisać NA kartce, предложный падеж." }
  - { kind: false-friend, text: "Уменьшительное от karta «карта, карточка», которое уже есть в словаре. Русская «карточка» — та же модель, но польское kartka значит прежде всего лист бумаги, а не карточку." }
  - { kind: usage, text: "Kartka papieru «лист бумаги» — самое частое сочетание. Kartka pocztowa «почтовая открытка», kartka świąteczna «праздничная открытка»." }
  - { kind: usage, text: "Ещё одно значение — страница книги: wyrywać kartki z książki «вырывать страницы из книги»." }
collocations:
  - { pl: "kartka papieru", ru: "лист бумаги" }
  - { pl: "kartka pocztowa", ru: "почтовая открытка" }
etymology: "Уменьшительное от karta «карта, карточка», из латинского charta «бумага»."
memory: "kartka — «листок бумаги» и «открытка». Самое частое — kartka papieru. Уменьшительное от karta, но значит именно лист, а не карточку."
idioms:
  - { pl: "kartka papieru", ru: "лист бумаги" }
  - { pl: "kartka pocztowa", ru: "почтовая открытка" }
formExamplesSkip:
  - { form: "kartko", reason: "звательная форма, а kartka — это листок или открытка. Обращаться к ней некому, поэтому форма остаётся только в таблице склонения" }
