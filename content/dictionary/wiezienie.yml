notes:
  - { kind: false-friend, text: "Осторожно с формой więzień: это не только родительный множественного от więzienie «тюрем», но и отдельное слово мужского рода «заключённый». Więzień uciekł z więzienia — «Заключённый сбежал из тюрьмы», и оба слова в одной фразе." }
  - { kind: usage, text: "Внутри сидит więzić «держать в неволе» и więzy «узы». Русские «вязать», «узы» и «узник» — то же гнездо." }
  - { kind: usage, text: "Ходовые обороты: iść do więzienia «сесть в тюрьму», wyjść z więzienia «выйти из тюрьмы», uciec z więzienia «сбежать из тюрьмы»." }
  - { kind: usage, text: "В приговорах więzienie значит «лишение свободы»: kara więzienia «тюремное заключение», dziesięć lat więzienia «десять лет тюрьмы»." }
collocations:
