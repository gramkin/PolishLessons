  - { pl: "wyjść z więzienia", ru: "выйти из тюрьмы" }
  - { pl: "kara więzienia", ru: "тюремное заключение" }
  - { pl: "uciec z więzienia", ru: "сбежать из тюрьмы" }
etymology: "От więzić «держать в неволе» и więzy «узы», праславянское *vęzti «вязать». Русские «вязать», «узы» и «узник» — то же самое гнездо."
memory: "więzienie — «тюрьма», от więzić «держать в неволе» и więzy «узы»: тот же корень, что в русских «вязать» и «узник». Главная ловушка — форма więzień: это и родительный множественного «тюрем», и отдельное слово «заключённый». Фраза Więzień uciekł z więzienia «Заключённый сбежал из тюрьмы» ставит оба слова рядом."
