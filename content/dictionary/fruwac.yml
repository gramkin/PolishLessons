# review
id: fruwac
format: 2
lemma: "fruwać"
rank: 5478
pos: verb
aspect: imperf
pron: { cyr: "фру́ваць" }
senses:
  - id: flit
    ru: "летать, порхать"
    examples:
      - pl: "Motyle fruwają nad łąką."
        ru: "Бабочки порхают над лугом."
        source: { kind: authored }
      - pl: "Ptaki fruwają nisko przed deszczem."
        ru: "Птицы летают низко перед дождём."
        source: { kind: authored }
      - pl: "Liście fruwają na wietrze."
        ru: "Листья летают на ветру."
        source: { kind: authored }
  - id: float
    ru: "носиться, кружить (в воздухе)"
    examples:
      - pl: "Puch fruwa po pokoju."
        ru: "Пух носится по комнате."
        source: { kind: authored }
      - pl: "Papiery fruwały po biurze."
        ru: "Бумаги летали по офису."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Многократный глагол: описывает не один полёт, а порхание туда-сюда. Однократное «лететь» — lecieć." }
  - { kind: government, text: "Непереходный; направление через nad с творительным или po с предложным." }
  - { kind: false-friend, text: "Звукоподражательное, родственно frunąć «вспорхнуть». С русским «фрукт» ничего общего." }
  - { kind: usage, text: "В корпусе слово не встречается, поэтому все примеры составлены вручную." }
collocations:
  - { pl: "fruwać nad łąką", ru: "порхать над лугом" }
etymology: "Звукоподражательное, ср. frunąć «вспорхнуть»."
memory: "fruwać — «порхать, летать туда-сюда», многократный глагол. Однократное «лететь» — lecieć, «вспорхнуть» — frunąć."
idioms:
  - { pl: "fruwać nad łąką", ru: "порхать над лугом" }
formExamplesSkip:
  - { form: "fruwano", reason: "безличная форма на -no предполагает человека-деятеля, а fruwać говорят о птицах, насекомых и предметах в воздухе, поэтому формы fruwano живой язык не образует" }
