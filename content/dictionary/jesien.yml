  - { kind: usage, text: "ГЛАВНОЕ: «осенью» — это jesienią, творительный падеж без предлога. Так же и с другими временами года: wiosną, latem, zimą." }
  - { kind: usage, text: "Прошлой осенью — zeszłej jesieni, родительный. Прилагательное — jesienny." }
