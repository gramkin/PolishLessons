  - { pl: "zeszłej jesieni", ru: "прошлой осенью" }
etymology: "Праславянское *(j)esenь; русская «осень» — то же слово, но без начального j-."
memory: "jesień — «осень», женского рода. Главное: «осенью» — jesienią, творительный БЕЗ предлога, как wiosną, latem, zimą."
