notes:
  - { kind: government, text: "Женский род на мягкую согласную: ta jesień, tej jesieni. Склоняется как noc и gęś." }
  - { kind: false-friend, text: "Русская «осень» и польское jesień — одно слово, но польское сохранило начальное j-. Род в обоих языках женский." }
  - { kind: usage, text: "ГЛАВНОЕ: «осенью» — это jesienią, творительный падеж без предлога. Так же и с другими временами года: wiosną, latem, zimą." }
  - { kind: usage, text: "Прошлой осенью — zeszłej jesieni, родительный. Прилагательное — jesienny." }
collocations:
  - { pl: "jesienią", ru: "осенью" }
  - { pl: "zeszłej jesieni", ru: "прошлой осенью" }
etymology: "Праславянское *(j)esenь; русская «осень» — то же слово, но без начального j-."
memory: "jesień — «осень», женского рода. Главное: «осенью» — jesienią, творительный БЕЗ предлога, как wiosną, latem, zimą."
idioms:
  - { pl: "jesienią", ru: "осенью" }
