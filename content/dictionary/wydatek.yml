notes:
  - { kind: false-friend, text: "Само слово понятно, а вот глагол при нём держит сразу три русских. WYDAWAĆ значит и «тратить» деньги, и «издавать» книгу, и «выдавать» документ: WYDAĆ PIENIĄDZE, WYDAĆ KSIĄŻKĘ, WYDAĆ PASZPORT. Отсюда и WYDAWCA — «издатель», а WYDANIE — «издание». Так один польский глагол делает работу трёх наших, и, встретив WYDAWCA, не ищите в нём ни траты, ни выдачи." }
  - { kind: usage, text: "Девять форм, мужской род, неодушевлённое. В основе беглое E, которое выпадает во всех косвенных падежах: WYDATEK, но WYDATKU, WYDATKIEM, WYDATKOWI. Так же устроены SPADEK и PRZYSTANEK. Множественное WYDATKI употребляется гораздо чаще единственного, потому что расходы обычно считают вместе." }
  - { kind: government, text: "Расходы на что-то — WYDATKI NA COŚ, предлог NA с винительным: WYDATKI NA ŻYCIE, WYDATKI NA LEKI. Покрыть расходы — POKRYĆ WYDATKI, винительный без предлога. Без расходов — BEZ WYDATKÓW, родительный множественного. А «он потратил» будет WYDAŁ, от того же глагола, что и «издал»." }
  - { kind: pronunciation, text: "Читается «выда́тэк», три слога, ударение на предпоследнем. Буква Y даёт «ы», поэтому начало слова это «вы». Конечная E даёт «э», отсюда «тэк». В косвенных падежах беглое E пропадает, и WYDATKU звучит «выда́тку», а WYDATKIEM — «выда́ткем», с мягким «ке»." }
  - { kind: register, text: "Слово конторское и домашнее сразу. В бюджете это WYDATKI BIEŻĄCE «текущие расходы» и WYDATKI STAŁE «постоянные расходы». В разговоре о доме — WYDATKI NA ŻYCIE. Прилагательное WYDATNY, от того же корня, значит уже не «расходный», а «значительный, заметный»: WYDATNA POMOC — существенная помощь." }
collocations:
  - { pl: "pokryć wydatki", ru: "покрыть расходы" }
  - { pl: "wydatki na życie", ru: "расходы на жизнь" }
  - { pl: "wydatki bieżące", ru: "текущие расходы" }
family:
  - { pl: "wydawać", ru: "тратить; издавать; выдавать", relation: root, id: wydawac }
  - { pl: "wydawca", ru: "издатель", relation: derived }
  - { pl: "wydanie", ru: "издание", relation: derived }
etymology: "От глагола WYDAWAĆ, от приставки WY- и DAWAĆ «давать», слова праславянского и того же, что русское «давать». Образ прямой: расход это то, что отдано наружу. Русский на это место поставил «расход», от «расходиться», то есть другой образ — деньги разошлись. А польское гнездо разрослось широко: от того же WYDAWAĆ идут и издатель, и издание, потому что книгу тоже «выдают» в свет."
memory: "Расход, трата, от wydawac. Главное — сам глагол: wydawac значит и «тратить», и «издавать», и «выдавать», отсюда wydawca «издатель» и wydanie «издание». Один глагол вместо наших трёх. Читается «выда́тэк», беглое e выпадает: wydatku. Расходы на что-то — wydatki na cos, с винительным. И не путайте wydatny: это «значительный», а не «расходный»."
idioms:
  - { pl: "pokryć wydatki", ru: "покрыть расходы" }
