etymology: "От прилагательного CIEKAWY, а оно, что неожиданно, от глагола CIEC «течь», того же, что русское «течь», через значение «бежать, стремиться». Любопытный в этом образе — тот, кто течёт и бежит туда, где новость, и образ этот тот же, что в русском «текучий» или в выражении «побежал узнавать». Русское «любопытство» собрано совсем иначе, из «любить» и «пытать», то есть из желания расспрашивать. Суффикс -OŚĆ отвечает русскому -ОСТЬ. Из того же гнезда CIEKAWIE и CIEKAWSKI «не в меру любопытный»."
memory: "Держать два значения прилагательного сразу: ciekawy это и «интересный» о предмете, ciekawa książka, и «любопытный» о человеке, jestem ciekawy. Отсюда ciekawe, co on powie значит «интересно, что он скажет». Корень неожиданный: ciekawy от ciec «течь», любопытный это тот, кто бежит за новостью. Управление поправить: ciekawość świata родительным, где русский ставит «к» с дательным. Готовая формула z ciekawości «из любопытства». Читается «чека́восьчь»."
