notes:
  - { kind: false-friend, text: "Прилагательное, от которого слово образовано, работает в двух направлениях сразу, и русскому надо держать оба. CIEKAWY значит и «интересный», и «любопытный»: CIEKAWA KSIĄŻKA — «интересная книга», о предмете; JESTEM CIEKAWY — «мне любопытно», о человеке. Поэтому вопрос CIEKAWE, CO ON POWIE значит «интересно, что он скажет». Русское «любопытный» о книге не скажут, а польское слово обслуживает оба случая. Для сильного интереса есть ещё INTERESUJĄCY, но оно книжнее." }
  - { kind: government, text: "Из любопытства — предлог Z с родительным: Z CIEKAWOŚCI, и это готовая формула. Любопытство к чему — родительный без предлога: CIEKAWOŚĆ ŚWIATA «интерес к миру», тогда как русский ставит предлог «к» с дательным, так что конструкцию надо менять. Прилагательное CIEKAWY управляет родительным: JESTEM CIEKAWY TWOJEJ OPINII «мне любопытно твоё мнение», или целым придаточным с CO: CIEKAWY JESTEM, CO POWIE." }
  - { kind: pronunciation, text: "Читается «чека́восьчь», три слога, ударение на втором. Сочетание CIE даёт мягкое «че», где I только знак мягкости, а не отдельный гласный, поэтому слогов три, а не четыре. Буква W перед гласной звучит как «в». Конец слова, -ŚĆ, это два мягких звука подряд, «сьчь». В прилагательном CIEKAWY слышно «чека́вы», с «ы» на конце." }
  - { kind: usage, text: "Шесть форм, разряд женских существительных на -OŚĆ, суффикс отвечает русскому -ОСТЬ. Отвлечённое существительное, и множественное число у него почти не нужно. Основа идёт от CIEKAWY, а оно, неожиданно, от глагола CIEC «течь»: любопытный — это тот, кто бежит и течёт за новостями. Наречие CIEKAWIE значит «интересно» о манере: CIEKAWIE OPOWIADA «он интересно рассказывает», а безличное CIEKAWE значит «интересно» как вводное слово." }
  - { kind: register, text: "Слово нейтральное и частое. Частые обороты: Z CIEKAWOŚCI «из любопытства», ZASPOKOIĆ CIEKAWOŚĆ «удовлетворить любопытство», CZYSTA CIEKAWOŚĆ «чистое любопытство», CIEKAWOŚĆ ŚWIATA «интерес к миру». Поговорка CIEKAWOŚĆ TO PIERWSZY STOPIEŃ DO PIEKŁA, буквально «любопытство это первая ступень в ад», отвечает русскому «любопытной Варваре на базаре нос оторвали» и звучит как шутливый укор." }
