notes:
  - { kind: false-friend, text: "Русское «приязненный» устарело, а польское PRZYJAZNY — обычное «дружелюбный»: PRZYJAZNY PIES, PRZYJAZNE MIASTO. Самое частое современное сочетание — PRZYJAZNY DLA: PRZYJAZNY DLA ŚRODOWISKA, «экологичный», PRZYJAZNY DLA DZIECI, «подходящий для детей», калька с английского -friendly." }
  - { kind: usage, text: "Полная парадигма: PRZYJAZNY, PRZYJAŹNIEJSZY, NAJPRZYJAŹNIEJSZY, с чередованием Z на Ź. Форма для мужчин-людей положительной степени, PRZYJAŹNI, в карточку не включена: она совпадает с формами PRZYJAŹŃ, «дружба». PRZYJAŹNIEJSI и NAJPRZYJAŹNIEJSI работают как обычно." }
  - { kind: government, text: "Дружелюбный к кому-то — PRZYJAZNY DLA KOGOŚ или WOBEC KOGOŚ, с родительным. Удобный для чего-то — PRZYJAZNY DLA + родительный: DLA OSÓB NIEPEŁNOSPRAWNYCH, «доступный для людей с инвалидностью»." }
  - { kind: pronunciation, text: "Читается «пшыя́зны», три слога, ударение на предпоследнем. PRZY — «пшы», JA — «я», ZN — без гласной. В PRZYJAŹNIEJSZY: «пшыязьне́йшы», Z становится мягким «зь»." }
  - { kind: register, text: "Нейтральное слово, частое в рекламе и официальных текстах: URZĄD PRZYJAZNY OBYWATELOWI, «учреждение, удобное для граждан». О людях и животных — тёплая похвала." }
collocations:
  - { pl: "przyjazny dla środowiska", ru: "экологичный" }
  - { pl: "przyjazna atmosfera", ru: "дружеская атмосфера" }
  - { pl: "przyjazny dla użytkownika", ru: "удобный для пользователя" }
family:
  - { pl: "przyjaźń", ru: "дружба", relation: root, id: przyjazn }
  - { pl: "przyjaciel", ru: "друг", relation: root, id: przyjaciel }
  - { pl: "przyjaźnie", ru: "дружелюбно", relation: derived }
etymology: "От PRZYJAŹŃ «дружба», общеславянского *prijaznь, того же корня, что русское «приязнь» и «приятель», от *prijati, «благоволить». В русском «приязнь» устарела, а в польском PRZYJAŹŃ и PRZYJAZNY — главные слова для дружбы."
memory: "Przyjazny — дружелюбный: przyjazny pies, przyjazna atmosfera. Przyjazny dla środowiska — экологичный. Przyjaźniejszy, najprzyjaźniejszy — z→ź. Читается «пшыя́зны»."
idioms:
  - { pl: "przyjazny dla środowiska", ru: "экологичный, безвредный для природы" }
formExamplesSkip:
