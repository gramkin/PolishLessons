# review
id: spostrzec
format: 2
lemma: "spostrzec"
rank: 2426
pos: verb
aspect: perf
pron: { cyr: "спо́стшец" }
senses:
  - id: notice
    ru: "заметить, приметить"
    examples:
      - pl: "Pies spostrzegł zagrożenie."
        ru: "Собака заметила угрозу."
        source: { kind: translated, id: 355455 }
      - pl: "Faktem jest, że nie spostrzegł różnicy."
        ru: "Дело в том, что он не заметил разницы."
        source: { kind: translated, id: 410020 }
      - pl: "Nie mógł spostrzec żadnej różnicy między bliźniętami."
        ru: "Он не мог заметить никакой разницы между близнецами."
        source: { kind: translated, id: 10776855 }
  - id: realise
    ru: "спохватиться, обнаружить (spostrzec się)"
    examples:
      - pl: "Tom spostrzegł się, że jest sam."
        ru: "Том спохватился, что он один."
        source: { kind: translated, id: 6391721 }
      - pl: "Kiedy się spostrzegłem, że opuściłem najważniejszą część mojego wystąpienia, było już za późno."
        ru: "Когда я спохватился, что пропустил самую важную часть выступления, было уже поздно."
        source: { kind: translated, id: 826351 }
notes:
  - { kind: government, text: "Винительный падеж: spostrzec różnicę. С się значит «спохватиться, заметить за собой»: spostrzegł się, że… «он спохватился, что…»." }
  - { kind: false-friend, text: "s- + postrzec, корень strzec «стеречь», которое уже есть в словаре. Русское «приметить» от «метить», образ другой, но «усмотреть» построено похоже." }
  - { kind: usage, text: "Книжноватое слово; в обычной речи скажут zauważyć «заметить»." }
  - { kind: usage, text: "Несовершенный вид — spostrzegać. Существительное spostrzeżenie «наблюдение, замечание»." }
collocations:
  - { pl: "spostrzec różnicę", ru: "заметить разницу" }
  - { pl: "spostrzec się", ru: "спохватиться" }
etymology: "s- + postrzec, корень strzec «стеречь»."
memory: "spostrzec — книжное «заметить»; обиходное — zauważyć. С się значит «спохватиться»: spostrzegł się, że… Несовершенный вид — spostrzegać."
idioms:
  - { pl: "spostrzec różnicę", ru: "заметить разницу" }
  - { pl: "spostrzec się", ru: "спохватиться" }
