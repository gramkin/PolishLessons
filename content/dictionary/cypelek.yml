notes:
  - { kind: false-friend, text: "CYPELEK звучит почти как «цыплёнок», но с птицами не связан: это маленький мыс, узкий клочок суши, вдающийся в озеро или море. Цыплёнок по-польски — KURCZAK, KURCZĄTKO." }
  - { kind: usage, text: "Уменьшительное от CYPEL «мыс». Мужской род, неодушевлённый: винительный равен именительному (WIDZĘ CYPELEK). Беглое E выпадает: CYPELEK → CYPELKA, NA CYPELKU." }
  - { kind: pronunciation, text: "Читается «цыпэ́лэк»: CY — «цы», ударение на втором слоге. В косвенных падежах ударение остаётся на том же слоге: «цыпэ́лка»." }
