# review
id: dokola
format: 2
lemma: "dokoła"
rank: 5598
pos: adv
pron: { cyr: "доко́уа" }
senses:
  - id: around
    ru: "вокруг, кругом"
    examples:
      - pl: "Rozejrzałem się dokoła, ale nic nie zobaczyłem."
        ru: "Я посмотрел вокруг, но ничего не увидел."
        source: { kind: tatoeba, id: 1181511 }
      - pl: "Rozejrzałem się dokoła, ale nie zobaczyłem nikogo."
        ru: "Я огляделся вокруг, но никого не увидел."
        source: { kind: translated, id: 639705 }
      - pl: "Ludzie zebrali się dokoła okrągłego stołu."
        ru: "Люди собрались вокруг круглого стола."
        source: { kind: translated, id: 1515198 }
  - id: all-around
    ru: "со всех сторон"
    examples:
      - pl: "Skakali dokoła z podniecenia."
        ru: "Они прыгали вокруг от возбуждения."
        source: { kind: translated, id: 403244 }
      - pl: "Morderca wodził wzrokiem dokoła jak zwierz."
        ru: "Убийца водил взглядом вокруг, как зверь."
        source: { kind: authored }
      - pl: "Dokoła panowała cisza."
        ru: "Вокруг стояла тишина."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Внутри koło «круг», поэтому буквально это «по кругу». Русское «вокруг» построено точно так же от «круга»." }
  - { kind: usage, text: "Варианты dookoła и naokoło значат то же самое; dokoła чуть книжнее." }
  - { kind: usage, text: "Как предлог требует родительного падежа: dokoła stołu «вокруг стола»." }
  - { kind: usage, text: "Частые сочетания: rozejrzeć się dokoła «оглядеться вокруг», dokoła panowała cisza «вокруг стояла тишина»." }
collocations:
  - { pl: "rozejrzeć się dokoła", ru: "оглядеться вокруг" }
  - { pl: "dokoła stołu", ru: "вокруг стола" }
  - { pl: "dookoła", ru: "вокруг" }
etymology: "Из do + koło «круг», то есть буквально «по кругу». Русское «вокруг» построено по той же модели от «круга»."
memory: "dokoła — «вокруг», и внутри сидит koło «круг», ровно как русское «вокруг» от «круга». Рядом живут dookoła и naokoło с тем же значением. Как предлог требует родительного: dokoła stołu «вокруг стола»."
