etymology: "От naród «народ, нация», а то — от na- плюс ród «род». Суффикс -owy образует относительные прилагательные, как в stołowy и wojskowy. Отсюда narodowość «национальность» и międzynarodowy «международный» — слово, разобранное точно как русское: między «между» плюс narodowy."
memory: "narodowy — «НАЦИОНАЛЬНЫЙ»: hymn narodowy, drużyna narodowa. «Народный» в смысле фольклорный — это ludowy: muzyka ludowa. Русский обходится одним словом, польский требует выбрать, как с wojenny и wojskowy."
