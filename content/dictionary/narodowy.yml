notes:
  - { kind: false-friend, text: "NARODOWY НЕ ЗНАЧИТ «НАРОДНЫЙ» В ФОЛЬКЛОРНОМ СМЫСЛЕ. Narodowy это НАЦИОНАЛЬНЫЙ, государственный: hymn narodowy, drużyna narodowa, Bank Narodowy. А «народная музыка», «народный танец», «народные промыслы» — это LUDOWY: muzyka ludowa, taniec ludowy, sztuka ludowa. Перепутать легко, потому что по-русски оба передаются одним словом." }
  - { kind: usage, text: "ОДНА ФОРМА СОВПАДАЕТ С ФОРМОЙ СУЩЕСТВИТЕЛЬНОГО. Narodowi — это и мужско-личное множественное прилагательного (narodowi bohaterowie), и дательный падеж слова naród (narodowi obiecano reformy). Третий такой случай подряд: раньше были polityka и polityk, przypadkowy и przypadek. Различает только согласование." }
  - { kind: pronunciation, text: "Четыре слога, ударение на предпоследнем: na-ro-DO-wy. В отличие от существительного naród, здесь никакого ó нет: слог открыт во всех формах, поэтому всюду o. Ударение в женском роде там же: na-ro-DO-wa." }
  - { kind: register, text: "Степеней сравнения нет: прилагательное относительное, как wojenny и szkolny. Отсюда одиннадцать форм. В политическом языке слово нагружено: narodowy часто противопоставляют słowu europejski, и выбор между ними бывает заявлением позиции." }
