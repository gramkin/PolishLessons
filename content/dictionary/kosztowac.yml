# review
id: kosztowac
format: 2
lemma: "kosztować"
rank: 1200
pos: verb
aspect: imperf
pron: { cyr: "кошто́ваць" }
senses:
  - id: cost-money
    ru: "стоить (о цене)"
    examples:
      - pl: "Ile kosztuje pokój?"
        ru: "Сколько стоит номер?"
        source: { kind: tatoeba, id: 701578 }
      - pl: "Ile kosztuje ta suknia?"
        ru: "Сколько стоит это платье?"
        source: { kind: tatoeba, id: 363744 }
      - pl: "Ile kosztują gruszki?"
        ru: "Сколько стоят груши?"
        source: { kind: tatoeba, id: 12567506 }
  - id: cost-loss
    ru: "стоить, обойтись (о потерях, жертвах)"
    examples:
      - pl: "Jego błąd wiele go kosztował."
        ru: "Его ошибка дорого ему обошлась."
        source: { kind: translated, id: 5301924 }
      - pl: "Ten wypadek prawie kosztował go życie."
        ru: "Этот несчастный случай едва не стоил ему жизни."
        source: { kind: translated, id: 5489617 }
      - pl: "To może kosztować Toma jego pracę."
        ru: "Это может стоить Тому работы."
        source: { kind: translated, id: 10541970 }
  - id: taste
    ru: "пробовать на вкус, отведать — с родительным падежом"
    note: "Неожиданное для русского уха второе значение: kosztować wina «пробовать вино»."
    examples:
      - pl: "Chcesz kosztować tego sera?"
        ru: "Хочешь попробовать этого сыра?"
        source: { kind: authored }
      - pl: "Kosztuje wina przed zakupem."
        ru: "Он пробует вино перед покупкой."
        source: { kind: authored }
      - pl: "Nie wolno kosztować potraw przed podaniem."
        ru: "Нельзя пробовать блюда перед подачей."
        source: { kind: authored }
notes:
  - { kind: government, text: "В значении «пробовать на вкус» нужен родительный падеж: kosztować wina «пробовать вино». В значении «стоить» — винительный суммы: kosztuje sto złotych." }
  - { kind: usage, text: "Главный вопрос покупателя: Ile to kosztuje? «Сколько это стоит?» Во множественном — Ile kosztują? «Сколько они стоят?»" }
  - { kind: usage, text: "Переносное значение совпадает с русским: kosztować kogoś życie «стоить кому-то жизни», kosztować kogoś pracę «стоить кому-то работы»." }
  - { kind: false-friend, text: "Слово не значит «пробовать» вообще: только на вкус. «Попробовать сделать» будет spróbować." }
collocations:
  - { pl: "ile to kosztuje", ru: "сколько это стоит" }
  - { pl: "kosztować fortunę", ru: "стоить целое состояние" }
  - { pl: "kosztować życie", ru: "стоить жизни" }
etymology: "Через средневерхненемецкое kosten из латинского constare «стоить». Тот же источник у итальянского costare и французского coûter; русское «стоить» — независимое славянское слово."
memory: "kosztować — «стоить»: Ile to kosztuje? Но есть и второе значение, «пробовать на вкус», и тогда нужен родительный падеж: kosztować wina. Переносное употребление как в русском: kosztowało go życie «стоило ему жизни»."
idioms:
  - { pl: "ile to kosztuje?", ru: "сколько это стоит?" }
  - { pl: "kosztować fortunę", ru: "стоить целое состояние" }
  - { pl: "kosztować kogoś życie", ru: "стоить кому-то жизни" }
