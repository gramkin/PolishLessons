      - pl: "Nie miałem zaszczytu go poznać."
        ru: "Я не имел чести с ним познакомиться."
        source: { kind: authored }
  - id: honours
    ru: "в мн. ч. почести, награды"
    examples:
      - pl: "Zaszczyty go nie interesowały."
        ru: "Почести его не интересовали."
        source: { kind: authored }
      - pl: "Obsypano go zaszczytami."
        ru: "Его осыпали почестями."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Русского однокоренного слова нет, и это сбивает: zaszczyt не «защита». Защита по-польски — obrona или ochrona, а zaszczyt значит «честь». Созвучие с русским «защитой» случайно и обманчиво, так что это слово стоит заучить отдельно." }
  - { kind: usage, text: "Предложный падеж — zaszczycie, с чередованием t → ć. Самый частый оборот — mieć zaszczyt «иметь честь», принадлежащий официальной и торжественной речи: mam zaszczyt zaprosić. В обиходе чаще скажут to dla mnie zaszczyt." }
  - { kind: government, text: "Что именно за честь — либо инфинитив, либо родительный: mam zaszczyt powitać, dostąpić zaszczytu otwarcia. Множественное zaszczyty значит «почести»: obsypać zaszczytami (творительный)." }
collocations:
  - { pl: "mieć zaszczyt", ru: "иметь честь" }
  - { pl: "to dla mnie zaszczyt", ru: "это для меня честь" }
  - { pl: "obsypać zaszczytami", ru: "осыпать почестями" }
family:
  - { pl: "szczyt", ru: "вершина, пик", relation: root, id: szczyt }
  - { pl: "zaszczytny", ru: "почётный", relation: derived }
etymology: "Приставка za- плюс szczyt «вершина»: честь понималась как возведение на вершину. Само szczyt этимологи связывают с праславянским *ščitъ «щит» — тем же словом, что русское «щит», — через значение «доска, щит фронтона», а оттуда «верх, пик». Так что дальний родственник у zaszczyt всё же есть, только в неожиданном месте: русский «щит»."
memory: "zaszczyt — «честь», а не «защита», хотя звучит похоже. Буквально za + szczyt «на вершину». Предложный zaszczycie (t → ć), и главный оборот mam zaszczyt «имею честь»."
idioms:
  - { pl: "mam zaszczyt", ru: "имею честь" }
  - { pl: "poczytywać sobie za zaszczyt", ru: "считать для себя честью" }
