etymology: "От праславянского *děva «дева», того же, что русское «дева», с суффиксом -ICA, который в польском образует названия лиц женского пола: DZIEWICA, KRÓLEWICA в старом языке, SIOSTRZYCA. Начальное *dě- дало польское DZIE- по закону смягчения, из которого вышли DZIEŃ из *dьnь и DZIECKO из *dětъko: там, где русский оставил Д, польский даёт мягкое DZI. Отсюда видно всё гнездо сразу: DZIEWCZYNA, DZIEWCZYNKA, DZIEWCZĘ — все от той же «девы». Разошлись языки в значении: русский сохранил и «деву», и «девицу» как слова о молодой женщине, а польский сузил DZIEWICA до одного точного смысла и передал значение «девушка» производному DZIEWCZYNA. Так регулярное родство корней оказалось ловушкой в употреблении."
memory: "Корень тот же, что в русской «деве»: польское dzie- отвечает русскому де- (dzień «день», dziecko «ребёнок»). Но объём значений разный, и это ловушка: русское «девица» — просто девушка, а польское dziewica значит только «девственница». Девушка по-польски dziewczyna. Нейтрально слово звучит лишь в церковном и историческом контексте: Maryja Dziewica, Dziewica Orleańska. Родительный множественного — dziewic, без беглого гласного. Прилагательное dziewiczy переносится как в русском: dziewicza puszcza «девственный лес»."
