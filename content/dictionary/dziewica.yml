notes:
  - { kind: false-friend, text: "Серьёзная ловушка, и ошибка здесь неловкая. Русское «девица» — это просто девушка, слово книжное или шутливое, но нейтральное по смыслу. Польское DZIEWICA значит только «девственница», и ничего другого. Поэтому назвать польскую знакомую DZIEWICA нельзя: по-русски это прозвучало бы как «девица», а по-польски — как утверждение о её личной жизни. Девушка по-польски DZIEWCZYNA, девочка DZIEWCZYNKA, молодая женщина MŁODA KOBIETA. Слова общего корня, но объём значений разошёлся: русский оставил «деву» и «девицу» в поэтической речи, польский закрепил DZIEWICA за одним точным смыслом." }
  - { kind: usage, text: "Десять форм, набор обычного существительного женского рода на -A. Родительный множественного — DZIEWIC, с нулевым окончанием и без беглого гласного, потому что основа кончается на один согласный и вставлять ничего не нужно: сравните TKANKA и TKANEK, где согласных два. Прилагательное от этого слова — DZIEWICZY, и оно живёт отдельной жизнью в переносном значении: DZIEWICZA PUSZCZA «девственный лес», DZIEWICZY REJS «первый рейс судна». Русское «девственный» ведёт себя так же, и этот перенос в обоих языках совпадает: нетронутое, первое, ещё не бывшее в употреблении." }
  - { kind: register, text: "Слово нейтрально в церковном, историческом и медицинском контексте: MARYJA DZIEWICA, DZIEWICA ORLEAŃSKA, в медицинской карте — как термин. В бытовом разговоре оно звучит прямо и может задеть, потому что сообщает о человеке то, что обычно не обсуждают; поэтому вне названных контекстов его просто не употребляют, а не ищут вежливую замену. В литературе и фольклоре DZIEWICE во множественном числе означает «девы» как образ, без этого смысла. Короткое правило: в польском этим словом называют либо исторических и религиозных лиц, либо факт — и никогда не называют знакомую девушку." }
  - { kind: pronunciation, text: "Читается «дзеви́ца», три слога, ударение на предпоследнем. Начальное DZI это мягкое «дзь», один слитный звук, и русскому его приходится осваивать отдельно: это не «д» и не «з», а их мягкое слияние, как в DZIEŃ «день» или DZIECKO «ребёнок». Сочетание WI даёт «ви». Буква C в конце основы это «ц». В родительном множественного DZIEWIC слово кончается на «ц» твёрдо: «дзе́виц», и ударение переезжает на первый слог, потому что слогов стало два." }
