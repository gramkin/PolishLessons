# review
id: podrozowac
format: 2
lemma: "podróżować"
rank: 2010
pos: verb
pron: { cyr: "подружо́ваць" }
senses:
  - id: travel
    ru: "путешествовать, ездить"
    examples:
      - pl: "Podróżuje po Europie od maja."
        ru: "Он путешествует по Европе с мая."
        source: { kind: authored }
      - pl: "Podróżowali pociągiem, bo było taniej."
        ru: "Они ездили поездом, потому что было дешевле."
        source: { kind: authored }
      - pl: "Lubię podróżować sam."
        ru: "Я люблю путешествовать один."
        source: { kind: authored }
  - id: traveller
    ru: "podróżujący — путешествующий, едущий"
    examples:
      - pl: "Podróżujący z dziećmi wsiadają pierwsi."
        ru: "Едущие с детьми садятся первыми."
        source: { kind: authored }
      - pl: "Podróżująca samotnie kobieta nie budziła podejrzeń."
        ru: "Путешествующая в одиночку женщина не вызывала подозрений."
        source: { kind: authored }
  - id: travelling
    ru: "podróżowanie — путешествия (как занятие)"
    examples:
      - pl: "Podróżowanie kosztuje mniej, niż się wydaje."
        ru: "Путешествия стоят меньше, чем кажется."
        source: { kind: authored }
      - pl: "Po latach podróżowania osiadł na wsi."
        ru: "После лет странствий он осел в деревне."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "КОРЕНЬ ВИДЕН СКВОЗЬ ПОЛНОГЛАСИЕ. Podróż — это po плюс droga, а польское droga отвечает русской «ДОРОГЕ»: тот же закон, что в głowa/«голова» и złoto/«золото», где поляк обходится «ро», а русский вставляет «оро». Значит podróż буквально «то, что по дороге». Отсюда podróżnik «путешественник» и podróżny «пассажир, путник»." }
  - { kind: government, text: "Путешествуют ПО чему — предлог po с ПРЕДЛОЖНЫМ, слово в слово как по-русски: podróżować po Europie, po kraju. Куда — do с родительным: podróżować do Włoch. Чем — творительный без предлога: podróżować pociągiem, samochodem, в точности как «ехать поездом»." }
  - { kind: usage, text: "ПОЧЕМУ ОДИННАДЦАТЬ ФОРМ ПРОПУЩЕНО. Глагол непереходный: путешествуют ПО чему-то или ДО чего-то, винительного дополнения у него нет, а значит страдательного причастия быть не может. Формы вроде podróżowany — артефакт автоматической парадигмы. То же самое уже отмечено у współpracować, skorzystać и gapić się." }
  - { kind: pronunciation, text: "Настоящее время по правилу -ować: podróżuję, podróżujesz, как pracuję и marnuję. Буква ó читается как «у», ż как «ж», поэтому podróż звучит «по́друш», а podróżować — «подружо́ваць»." }
collocations:
  - { pl: "podróżować po Europie", ru: "путешествовать по Европе" }
  - { pl: "podróżować pociągiem", ru: "ездить поездом" }
  - { pl: "podróż służbowa", ru: "командировка" }
family:
  - { pl: "podróż", ru: "путешествие, поездка", relation: root, id: podroz }
  - { pl: "droga", ru: "дорога", relation: root, id: droga }
  - { pl: "podróżnik", ru: "путешественник", relation: derived }
etymology: "От podróż «путешествие», а то — сложение po и droga «дорога». Русская «дорога» и польская droga — одно слово: польский даёт «ро» там, где русский развил полногласие «оро». Отсюда же podróżnik «путешественник», podróżny «пассажир» и podróżniczy «путевой»."
memory: "podróżować — «путешествовать», от podróż «путешествие», то есть po + droga, а droga это русская «дорога». Управление родное: podróżować PO Europie, podróżować pociągiem. Настоящее время: podróżuję."
idioms:
  - { pl: "podróż służbowa", ru: "служебная командировка" }
  - { pl: "szczęśliwej podróży", ru: "счастливого пути" }
