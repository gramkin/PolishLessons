# review
id: wejscie
format: 2
lemma: "wejście"
rank: 2020
pos: noun
pron: { cyr: "вэ́йсьце" }
senses:
  - id: entrance
    ru: "вход (место)"
    examples:
      - pl: "Gdzie jest wejście do muzeum?"
        ru: "Где вход в музей?"
        source: { kind: tatoeba, id: 382540 }
      - pl: "Gdzie jest wejście na scenę?"
        ru: "Где вход на сцену?"
        source: { kind: tatoeba, id: 4735288 }
      - pl: "Gdzie jest wejście?"
        ru: "Где вход?"
        source: { kind: translated, id: 2107215 }
  - id: entering
    ru: "вход, вхождение (действие)"
    examples:
      - pl: "Proszę pukać przed wejściem."
        ru: "Пожалуйста, стучите, прежде чем войти."
        source: { kind: tatoeba, id: 530056 }
      - pl: "Po wejściu zamknij drzwi."
        ru: "Войдя, закрой дверь."
        source: { kind: translated, id: 998694 }
notes:
  - { kind: usage, text: "Отглагольное существительное от wejść «войти», поэтому значит и «вход» (место), и «вхождение» (действие)." }
  - { kind: government, text: "wejście do czegoś «вход куда-л.»: wejście do muzeum «вход в музей»." }
  - { kind: false-friend, text: "Форма родительного множественного wejść совпадает с инфинитивом глагола wejść «войти» — различайте только по контексту." }
  - { kind: usage, text: "Антоним — wyjście «выход», устроенный так же: wy- + iść." }
collocations:
  - { pl: "wejście do", ru: "вход в" }
  - { pl: "przed wejściem", ru: "перед входом" }
etymology: "От wejść «войти» (w- + iść «идти»); русское «вход» образовано от «входить» тем же способом."
memory: "wejście — «вход», от wejść «войти». Антоним wyjście «выход». Осторожно: wejść — это и «входов» (родительный множественного), и «войти» (инфинитив)."
idioms:
  - { pl: "wejście do", ru: "вход в" }
  - { pl: "wolne wejście", ru: "свободный вход" }
formExamplesSkip:
