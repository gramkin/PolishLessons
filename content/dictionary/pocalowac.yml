        ru: "Я очень хочу ещё раз тебя поцеловать."
        source: { kind: tatoeba, id: 6313193 }
  - id: kiss-on
    ru: "поцеловать (в щёку, в руку)"
    examples:
      - pl: "Pocałował mnie w policzek."
        ru: "Он поцеловал меня в щёку."
        source: { kind: tatoeba, id: 4517741 }
      - pl: "Pocałował mnie w rękę."
        ru: "Он поцеловал мне руку."
        source: { kind: translated, id: 3530781 }
      - pl: "Tom pocałował Marię w policzek."
        ru: "Том поцеловал Мэри в щёку."
        source: { kind: tatoeba, id: 8512789 }
notes:
  - { kind: government, text: "pocałować требует винительного падежа: pocałować kogoś «поцеловать кого-то». Куда — предлог w с винительным: pocałować w policzek «поцеловать в щёку»." }
  - { kind: usage, text: "Несовершенный вид — całować. Существительное pocałunek значит «поцелуй»." }
  - { kind: usage, text: "С się глагол значит «поцеловаться»: Pocałowali się «Они поцеловались»." }
  - { kind: usage, text: "Повелительное Pocałuj mnie «Поцелуй меня» — одна из самых частых форм этого глагола в корпусе." }
collocations:
  - { pl: "pocałować w policzek", ru: "поцеловать в щёку" }
  - { pl: "pocałować się", ru: "поцеловаться" }
  - { pl: "pocałunek na dobranoc", ru: "поцелуй на ночь" }
etymology: "Приставка po- + całować, от cały «целый» — буквально пожелание быть целым и здоровым. Русское «целовать» построено точно так же, от «целый»: совпадение полное."
memory: "pocałować = «поцеловать», и слово родственно русскому буквально: от cały «целый», как «целовать» от «целый». Несовершенный вид — całować, существительное — pocałunek «поцелуй»."
idioms:
  - { pl: "pocałować w policzek", ru: "поцеловать в щёку" }
  - { pl: "pocałunek na dobranoc", ru: "поцелуй на ночь" }
  - { pl: "pocałować klamkę", ru: "прийти к закрытой двери" }
