senses:
  - id: kiss
    ru: "поцеловать"
    examples:
      - pl: "Chcę cię pocałować."
        ru: "Я хочу тебя поцеловать."
        source: { kind: translated, id: 883697 }
      - pl: "Mogę cię pocałować?"
        ru: "Можно тебя поцеловать?"
        source: { kind: translated, id: 2849696 }
