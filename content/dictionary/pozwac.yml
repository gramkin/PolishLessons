etymology: "Приставка PO- плюс ZWAĆ, от праславянского *zъvati «звать». Русский сохранил корень во всей полноте: «звать», «позвать», «призвать», «зов», «название». Польский взял тот же материал, но приставочное POZWAĆ ушло в суд, и путь понятен: вызвать человека к ответу, призвать его перед судьёй. Русский для той же мысли тоже пользовался глаголом зова — древнее «позвать на суд» значило именно это, — но в современном языке закрепил «подать в суд», а «позвать» оставил при приглашении. Так одно слово разошлось на юридический и бытовой смыслы в двух языках по-разному. От того же корня идут POZEW «иск» и WEZWANIE «повестка, вызов»."
memory: "Самая опасная ловушка: pozwać значит не «позвать», а «подать в суд». Pozwał mnie это «он подал на меня в суд»; позвать по-польски zawołać. Корень тот же, что в «звать», и логика старая — вызвать к ответу, призвать перед судьёй. Вокруг слова вся терминология: pozew «иск», pozwany «ответчик», powód «истец» и заодно «причина». Управление надо перестраивать: pozwać kogoś do sądu."
idioms:
  - { pl: "pozwać kogoś do sądu", ru: "подать на кого-то в суд" }
