notes:
  - { kind: false-friend, text: "Это одна из самых опасных ловушек для русскоязычного, потому что слово собрано из знакомых частей и выглядит совершенно прозрачным. POZWAĆ не значит «позвать»: оно значит «подать в суд». POZWAŁ MNIE переводится «он подал на меня в суд», и ошибка здесь меняет смысл фразы до неузнаваемости. Русское «позвать» по-польски будет ZAWOŁAĆ, а «пригласить» — ZAPROSIĆ. Простое ZWAĆ в польском значит «звать, называть», но звучит книжно; обычно говорят NAZYWAĆ SIĘ." }
  - { kind: usage, text: "Это слово юридического языка, и вокруг него собрана целая терминология, которую стоит выучить вместе. POZEW это «иск», POZWANY — «ответчик», POWÓD — «истец», ODPOWIEDŹ NA POZEW — «отзыв на иск». Обратите внимание на POWÓD: оно значит и «истец», и «причина», и различать их приходится только по делу. Причастие POZWANY давно стало существительным и склоняется как прилагательное. Пятьдесят три формы — подпись переходного глагола совершенного вида. Видовой партнёр — POZYWAĆ." }
  - { kind: government, text: "Схема: POZWAĆ KOGOŚ DO SĄDU — винительный на лицо и предлог DO с родительным на суд. Предмет иска вводится предлогом O с винительным: POZWAĆ KOGOŚ O ODSZKODOWANIE «подать в суд о возмещении», O NIEWYPŁACONE PENSJE. Русский в первом случае строит фразу иначе — «подать на кого-то в суд», с предлогом «на» и винительным, — так что конструкцию приходится перестраивать целиком, а не переводить по словам. Причастие берёт те же дополнения: POZWANY O ODSZKODOWANIE." }
  - { kind: pronunciation, text: "Читается «по́звачь», два слога, ударение на первом. Сочетание ZW произносится слитно и звонко, без гласной между согласными. Конечное Ć мягкое, «чь». В формах будущего времени основа смягчается: POZWIESZ звучит «по́звеш», где WIE даёт «ве», а POZWĘ — «по́звэн», с носовым Ę на конце. В причастии POZWANY ударение на предпоследнем слоге: «позва́ны»." }
  - { kind: register, text: "Слово строго юридическое, в бытовой речи почти не встречается, зато в новостях и документах постоянно. Частые сочетания: POZWAĆ KOGOŚ DO SĄDU, WNIEŚĆ POZEW «подать иск», POZEW O ROZWÓD «иск о разводе», STRONA POZWANA «сторона ответчика». В разговоре о том же скажут описательно: PODAĆ KOGOŚ DO SĄDU, и этот оборот тоже правильный и даже более частый. Угроза POZWĘ CIĘ звучит серьёзно, не как шутка." }
