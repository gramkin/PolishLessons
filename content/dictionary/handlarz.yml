      - pl: "Na targu każdy handlarz zachwala swój towar."
        ru: "На рынке каждый торговец расхваливает свой товар."
        source: { kind: authored }
      - pl: "Był handlarzem dziełami sztuki."
        ru: "Он был торговцем произведениями искусства."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "HANDLARZ — «торговец», и часто с неодобрительным оттенком: HANDLARZ NARKOTYKAMI, HANDLARZ BRONIĄ. Нейтральный продавец в магазине — SPRZEDAWCA. HANDEL — «торговля»." }
  - { kind: usage, text: "Одиннадцать форм, мужской род, лицо. Именительный множественного — HANDLARZE. В родительном множественного две формы: HANDLARZY и HANDLARZÓW." }
  - { kind: government, text: "Торговец чем — творительный без предлога: HANDLARZ BRONIĄ, HANDLARZ NARKOTYKAMI, как русское «торговать чем». В речи встречается и родительный: HANDLARZ NARKOTYKÓW. Торговец подержанными машинами — HANDLARZ UŻYWANYMI SAMOCHODAMI." }
  - { kind: pronunciation, text: "Читается «ха́ндлаш», ударение на первом слоге. H — «х», конечное RZ оглушается в «ш»." }
collocations:
  - { pl: "handlarz narkotykami", ru: "наркоторговец" }
  - { pl: "handlarz bronią", ru: "торговец оружием" }
  - { pl: "uliczny handlarz", ru: "уличный торговец" }
family:
  - { pl: "handel", ru: "торговля", relation: root, id: handel }
  - { pl: "handlować", ru: "торговать", relation: root, id: handlowac }
  - { pl: "handlowy", ru: "торговый", relation: derived, id: handlowy }
etymology: "От HANDEL «торговля», из немецкого слова того же значения. Суффикс деятеля -ARZ, как в LEKARZ и PIEKARZ."
memory: "Handlarz — торговец (часто с оттенком): handlarz bronią. Читается «ха́ндлаш». Sprzedawca — продавец в магазине. Handel — торговля."
idioms:
