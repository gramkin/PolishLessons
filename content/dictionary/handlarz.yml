pos: noun
pron: { cyr: "ха́ндлаш" }
senses:
  - id: dealer
    ru: "торговец (часто с оттенком)"
    examples:
      - pl: "Handlarz sprzedawał owoce na rogu ulicy."
        ru: "Торговец продавал фрукты на углу улицы."
        source: { kind: authored }
      - pl: "Policja złapała handlarza narkotykami."
