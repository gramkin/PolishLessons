# review
id: wydawca
format: 2
lemma: "wydawca"
rank: 5393
pos: noun
pron: { cyr: "выда́фца" }
senses:
  - id: publisher
    ru: "издатель, издательство"
    examples:
      - pl: "Wydawca książki ma siedzibę w Krakowie."
        ru: "Издательство книги находится в Кракове."
        source: { kind: authored }
      - pl: "Wysłała rękopis do wydawcy."
        ru: "Она отправила рукопись издателю."
        source: { kind: authored }
      - pl: "Poeta przez lata szukał wydawcy."
        ru: "Поэт годами искал издателя."
        source: { kind: authored }
  - id: issuer
    ru: "эмитент (карты, документа)"
    examples:
      - pl: "Wydawca karty pobiera opłatę roczną."
        ru: "Эмитент карты берёт годовую плату."
        source: { kind: authored }
      - pl: "Na odwrocie biletu podano dane wydawcy."
        ru: "На обороте билета указаны данные выпустившей его организации."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "WYDAWCA — «издатель», от WYDAWAĆ, которое значит и «выдавать», и «издавать». Русский различает «выдать» и «издать», а польский обходится одной приставкой WY-. Издательство как фирма — WYDAWNICTWO." }
  - { kind: usage, text: "Девять форм. Мужской род, но в единственном числе склоняется как женское на -A: WYDAWCĘ, WYDAWCĄ, WYDAWCY, как KIEROWCA и NASTĘPCA. Во множественном — мужские личные формы: WYDAWCY, WYDAWCÓW." }
  - { kind: government, text: "Издатель чего — родительный: WYDAWCA KSIĄŻKI, WYDAWCA GAZETY. Отправить рукопись издателю — WYSŁAĆ RĘKOPIS DO WYDAWCY, DO с родительным. В издательстве — U WYDAWCY." }
  - { kind: pronunciation, text: "Читается «выда́фца», ударение на предпоследнем слоге. W перед C оглушается в «ф». WY — «вы»." }
  - { kind: register, text: "Слово нейтральное и профессиональное: книги, газеты, игры, музыка. В банковском языке WYDAWCA KARTY — «эмитент карты»." }
collocations:
  - { pl: "wydawca książki", ru: "издатель книги" }
  - { pl: "znaleźć wydawcę", ru: "найти издателя" }
  - { pl: "wydawca gazety", ru: "издатель газеты" }
family:
  - { pl: "wydawać", ru: "выдавать; издавать", relation: root, id: wydawac }
  - { pl: "wydawnictwo", ru: "издательство", relation: root }
  - { pl: "wydanie", ru: "издание", relation: root }
etymology: "WY- + DAWAĆ «давать» + суффикс деятеля -CA. Русское «издатель» построено так же, только с приставкой «из-». Тот же суффикс в SPRZEDAWCA «продавец»."
memory: "Wydawca — издатель: wydawać — и выдавать, и издавать. Читается «выда́фца». Wydawnictwo — издательство. Wydanie — издание."
idioms:
  - { pl: "iść do druku", ru: "идти в печать" }
