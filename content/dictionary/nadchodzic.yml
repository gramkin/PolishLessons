# review
id: nadchodzic
format: 2
lemma: "nadchodzić"
rank: 1290
pos: verb
aspect: imperf
aspectPair: nadejsc
pron: { cyr: "надхо́дзиць" }
senses:
  - id: approach
    ru: "приближаться, наступать (о времени года, событии)"
    examples:
      - pl: "Zima nadchodzi."
        ru: "Зима приближается."
        source: { kind: translated, id: 2218946 }
      - pl: "Nadchodzi wiosna."
        ru: "Приходит весна."
        source: { kind: translated, id: 2282595 }
      - pl: "Co roku, gdy nadchodzi lato, przypomina mi się tamta dziewczyna."
        ru: "Каждый год, как наступит лето, я вспоминаю ту девчонку."
        source: { kind: tatoeba, id: 10091393 }
  - id: coming
    ru: "nadchodzący — наступающий, предстоящий"
    examples:
      - pl: "Nadchodząca zima będzie surowa."
        ru: "Наступающая зима будет суровой."
        source: { kind: translated, id: 3416407 }
      - pl: "Nie będzie kandydował w nadchodzących wyborach."
        ru: "Он не будет баллотироваться на предстоящих выборах."
        source: { kind: translated, id: 3680032 }
      - pl: "Czarne chmury zwiastowały nadchodzącą burzę."
        ru: "Чёрные тучи предвещали надвигающуюся бурю."
        source: { kind: translated, id: 597914 }
  - id: arrive
    ru: "подходить, надвигаться (о людях, буре)"
    examples:
      - pl: "Nadchodzi."
        ru: "Он идёт."
        source: { kind: translated, id: 8745436 }
      - pl: "Nadchodzi burza."
        ru: "Надвигается буря."
        source: { kind: translated, id: 5065062 }
      - pl: "Wynosimy się stąd. Gliny nadchodzą."
        ru: "Уходим отсюда. Полиция идёт."
        source: { kind: translated, id: 531835 }
notes:
  - { kind: usage, text: "Главное употребление — о временах года и событиях: Nadchodzi wiosna «Приходит весна», Zima nadchodzi «Зима близко»." }
  - { kind: usage, text: "Причастие nadchodzący значит «наступающий, предстоящий»: nadchodzące wybory «предстоящие выборы», w nadchodzący weekend «в предстоящие выходные»." }
  - { kind: usage, text: "Вид несовершенный; совершенный — nadejść, карточка уже есть. Основа там чередуется: nadszedł, nadeszła." }
  - { kind: pronunciation, text: "ch звучит как «х», dzi как «дзь»: надхо́дзиць." }
collocations:
  - { pl: "nadchodzi zima", ru: "зима приближается" }
  - { pl: "nadchodzące wybory", ru: "предстоящие выборы" }
  - { pl: "nadchodzi burza", ru: "надвигается буря" }
etymology: "Приставка nad- и chodzić «ходить», из праславянского *choditi. Значение «наступать» польский развил сам — как русское «наступать» из «ступать»."
memory: "nadchodzić — «приближаться, наступать»: Nadchodzi wiosna. Причастие nadchodzący значит «предстоящий»: nadchodzące wybory. Совершенный вид — nadejść, где основа чередуется: nadszedł, nadeszła."
idioms:
