senses:
  - id: hill
    ru: "холм, возвышенность"
    examples:
      - pl: "Wzgórze za wsią porasta sosna."
        ru: "Холм за деревней зарастает сосной."
        source: { kind: authored }
      - pl: "Ze wzgórza widać całą dolinę."
        ru: "С холма видна вся долина."
