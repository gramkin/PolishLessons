        ru: "На холме стоит старая церковь."
        source: { kind: authored }
  - id: hills
    ru: "холмы, гряда"
    examples:
      - pl: "Łańcuch wzgórz ciągnie się na południe."
        ru: "Цепь холмов тянется на юг."
        source: { kind: authored }
      - pl: "Słońce chowa się za wzgórzami."
        ru: "Солнце прячется за холмами."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Русское соответствие тут не «холм», а почти забытое «ВЗГОРЬЕ» — то же слово, собранное из тех же частей: приставка wz- «вз-» и корень góra «гора». У нас оно ушло в поэзию и диалекты, у поляков осталось обычным словом географии. Знать это полезно: разбор подсказывает и смысл, и написание через ó." }
  - { kind: pronunciation, text: "Перед стечением согласных предлог w удлиняется до WE: we wzgórzach, а не «w wzgórzach». То же правило даёт we Wrocławiu, we wtorek, ze mną. Выбор зависит не от слова, а от того, сколько согласных подряд получается на стыке." }
collocations:
  - { pl: "na wzgórzu", ru: "на холме" }
  - { pl: "łańcuch wzgórz", ru: "цепь холмов" }
  - { pl: "wzgórza morenowe", ru: "моренные холмы" }
family:
  - { pl: "góra", ru: "гора", relation: root, id: gora }
  - { pl: "górzysty", ru: "гористый", relation: derived }
  - { pl: "dolina", ru: "долина", relation: antonym }
etymology: "Приставка wz- «вз-, вверх» и góra «гора», из праславянского *gora. Русское «взгорье» построено буква в букву так же и значит ровно то же. Из этого же гнезда польские górzysty «гористый», podgórze «предгорье» и наши «пригорок», «взгорок»."
memory: "wzgórze — это наше «взгорье»: вз- плюс гора. И запомни предлог: WE wzgórzach, с удлинённым we перед стечением согласных."
idioms:
  - { pl: "na wzgórzu", ru: "на холме, на возвышении" }
  - { pl: "u stóp wzgórza", ru: "у подножия холма" }
