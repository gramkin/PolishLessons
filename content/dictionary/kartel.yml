notes:
  - { kind: false-friend, text: "KARTEL — «картель» и в экономике, и в криминале: KARTEL NARKOTYKOWY. Ценовой сговор — ZMOWA CENOWA. Не путайте с KARTKA — «листок», и KARTA — «карта, карточка»." }
  - { kind: usage, text: "Мужской род, неодушевлённое. Родительный — KARTELU. Множественное — KARTELE, родительный — KARTELI." }
