etymology: "Из праславянского *kъrmiti — того же корня, что русские «кормить», «корм» и «кормилец». Соответствие полное: польское KARMA значит «корм», KARMIĆ — «кормить», а разница только в огласовке корня, где польский дал ar, а русский ор, как в CZARNY при «чёрном» и в KARK при «корке». Эта мена ar и ор повторяется во множестве слов и стоит того, чтобы её заметить."
memory: "Повелительное из третьего лица: karmi даёт karm. А prosi даёт proś со смягчением, robi даёт rób с удлинением. Причастие karmiony, но karmieni с e."
