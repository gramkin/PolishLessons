notes:
  - { kind: usage, text: "Повелительное наклонение выводится, и выводится надёжно — только не из инфинитива, а из третьего лица единственного числа. KARMI даёт KARM: берём третье лицо и убираем окончание. Набор действий невелик. После гласной прибавляется -j: czyta даёт CZYTAJ, układa даёт UKŁADAJ, zyska даёт ZYSKAJ. Убирается -e: maluje даёт MALUJ, pisze даёт PISZ. Убирается -i: karmi даёт KARM, mówi даёт MÓW. Убирается -y: przyłączy даёт PRZYŁĄCZ. А иногда появляется -ij: wciągnie даёт WCIĄGNIJ, ujmie даёт UJMIJ. Дело тут не в окончании -ie, как можно подумать, а в том, что останется от основы. Отбросьте окончание и посмотрите на конец: если получившееся сочетание польское слово закончить не может, вставляется -ij. WCIĄGN-, UJM-, BIEGN-, KRADN- словами не кончаются, поэтому WCIĄGNIJ, UJMIJ, BIEGNIJ, KRADNIJ. А PODWIEZ-, TRZĘS-, NIEŚ- кончаться могут, и они просто смягчаются: PODWIEŹ, TRZĘŚ, NIEŚ. Правило проверено по PoliMorf на двух тысячах с лишним глаголов, чьё третье лицо кончается на -ie, и сходится в девяноста семи случаях из ста при одном единственном исключении — ZOWIE даёт ZOWIJ. Расходятся с правилом два опознаваемых семейства: CZERPAĆ с роднёй (CZERPIE даёт CZERP, NADSZARPIE — NADSZARP), где -rp польское слово закончить вполне может, как в KARP, и глаголы на -JŚĆ (DOJDZIE даёт DOJDŹ), где -jdź тоже законно. Исключение одно, зато целым классом: глаголы на -AWAĆ держат две основы — -awa- в инфинитиве, прошедшем и повелительном, -aj- в настоящем. У них повелительное идёт не от третьего лица, а от инфинитива: DAWAĆ даёт DAWAJ при DAJE, WSTAWAĆ даёт WSTAWAJ, PRZESTAWAĆ даёт PRZESTAWAJ. Зато их совершенные пары правилу подчиняются: DAĆ даёт DA, а от него DAJ." }
  - { kind: pronunciation, text: "Случаи, которые кажутся исключениями, на деле подчиняются правилам, уже разобранным в словаре. PROSI даёт PROŚ, а NIESIE даёт NIEŚ — это обычное смягчение s в ś, когда гласная ушла и согласный оказался на конце. IDZIE даёт IDŹ: то же смягчение dz в dź. А ROBI даёт RÓB, и здесь работает удлинение гласной в закрытом слоге: o переходит в ó, ровно как в WZÓR при WZORU и в SAMOCHÓD при SAMOCHODOWY. То есть повелительная форма получается из третьего лица двумя знакомыми шагами: отбросить окончание, а потом применить смягчение или удлинение, если слог этого требует." }
  - { kind: usage, text: "Две карточки прежних партий — WCIĄGNĄĆ и PRZYŁĄCZYĆ — говорили, что повелительную форму приходится просто запоминать. Это было слишком пессимистично, и обе карточки исправлены вместе с выпуском этой. Запоминать и правда надёжнее всего пару «инфинитив плюс первое лицо», но не потому, что форма непредсказуема, а потому, что от первого лица до третьего один шаг, а оттуда до повелительной ещё один." }
  - { kind: usage, text: "Форм шестьдесят три: несовершенный переходный, то есть полный набор. Отметьте два места. Повелительное первого лица множественного пишется с двумя m — KARMMY, потому что это karm плюс -my, и упрощать его не принято. А страдательное причастие даёт KARMIONY с o, но мужская личная форма множественного — KARMIENI с e: та же мена, что в przyłączony и przyłączeni, и она касается всех причастий на -ony." }
