notes:
  - { kind: false-friend, text: "Русскому CHWILOWY ничего не подсказывает, хотя украинцу оно знакомо: «хвилина» — минута. Польское CHWILA — «минута, момент», а CHWILOWY — «временный, минутный». Русское «временный» по-польски бывает TYMCZASOWY — о том, что устроено на время: TYMCZASOWY RZĄD, TYMCZASOWE ZAKWATEROWANIE. CHWILOWY — о том, что само скоро пройдёт: CHWILOWA SŁABOŚĆ, CHWILOWY BRAK." }
  - { kind: usage, text: "Относительное прилагательное, степеней сравнения нет. Формы для мужчин-людей CHWILOWI в карточке нет: людей минутными не называют. Остальные десять форм живые. Наречие CHWILOWO, «временно, сейчас», в объявлениях на каждом шагу: CHWILOWO NIECZYNNE, «временно закрыто»." }
  - { kind: government, text: "Ставится перед существительным: CHWILOWY BRAK, CHWILOWA PRZERWA, CHWILOWE ZAŁAMANIE. Падежных требований нет. Устойчиво: POŻYCZKA CHWILÓWKA, или просто CHWILÓWKA, — «краткосрочный микрокредит»." }
  - { kind: pronunciation, text: "Читается «хвило́вы», три слога, ударение на предпоследнем. CH даёт «х», WI — «ви», LO — «ло»: L перед гласной обычная. Сравните с CHWILA «хви́ля»." }
  - { kind: register, text: "Нейтральное слово, частое в официальных объявлениях и новостях: CHWILOWE UTRUDNIENIA, «временные неудобства». Существительное CHWILÓWKA — разговорное название микрозайма, и слово с дурной славой: CHWILÓWKI сравнивают с ловушкой." }
