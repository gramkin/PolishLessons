  - { pl: "tymczasowy", ru: "временный", relation: root, id: tymczasowy }
etymology: "От CHWILA «момент», общеславянского *chvila, родственного украинским «хвиля», «волна», и «хвилина», «минута». Мгновение — то, что накатывает и уходит, как волна. Польский суффикс -OWY превратил «момент» в «временный»."
memory: "Chwilowy — временный, минутный: chwilowy problem, chwilowa słabość. От chwila — момент. Chwilowo nieczynne — временно закрыто. Читается «хвило́вы»."
