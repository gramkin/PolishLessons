notes:
  - { kind: false-friend, text: "РУССКИЙ РАЗДЕЛИЛ ЭТО СЛОВО НАДВОЕ, ПОЛЬСКИЙ НЕТ. Польское trening — это обычная «ТРЕНИРОВКА»: trening w siłowni, trening przed meczem, trzy treningi w tygodniu. Русский «тренинг» так не работает: он закрепился за обучающим семинаром, «тренинг по продажам», а про спортзал русский скажет «тренировка». Оба значения у польского слова есть, но первое, спортивное, самое частое." }
  - { kind: pronunciation, text: "Конечное g оглушается в k: trening звучит «трэ́нинк». В косвенных падежах звонкость возвращается: treningu — «трэни́нгу». Та же пара есть в этой группе у gniew, который звучит «гнеф»." }
  - { kind: usage, text: "Родительный, предложный и звательный единственного числа слились в одной форме treningu, поэтому в таблице девять форм, а не десять. Так же устроен domek со своим domku." }
collocations:
  - { pl: "iść na trening", ru: "идти на тренировку" }
  - { pl: "trening przed meczem", ru: "тренировка перед матчем" }
  - { pl: "opuścić trening", ru: "пропустить тренировку" }
family:
  - { pl: "trenować", ru: "тренировать, тренироваться", relation: derived }
  - { pl: "trener", ru: "тренер", relation: derived, id: trener }
  - { pl: "treningowy", ru: "тренировочный", relation: derived }
etymology: "Из английского training через немецкий, от to train «обучать, тренировать». Русский «тренинг» пришёл тем же путём, но позже и в более узком значении, оставив спорт «тренировке». Отсюда trenować, trener и treningowy."
memory: "trening — это прежде всего «тренировка», спортивная: trening przed meczem. Русский «тренинг» ушёл в сторону семинара, польское слово этого сдвига не знает. И на конце оглушение: «трэ́нинк»."
idioms:
  - { pl: "trening czyni mistrza", ru: "повторение — мать учения" }
  - { pl: "iść na trening", ru: "идти на тренировку" }
formExamplesSkip:
