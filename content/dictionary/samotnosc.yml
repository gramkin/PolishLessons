notes:
  - { kind: pronunciation, text: "Читается «само́тносьць», в три слога, с ударением на предпоследнем, то есть на MOT. Конечное сочетание ść — то же самое, что в PAŚĆ «па́сьць» и UPAŚĆ «у́пасьць»: мягкое «сьць», произносимое одним движением. Начальное sa читается полно, без редукции, «са», а не «сэ». В косвенных падежах SAMOTNOŚCI — «само́тносьци», ударение остаётся на том же слоге." }
  - { kind: usage, text: "Абстрактное существительное женского рода, и в обычной речи оно употребляется почти только в единственном числе. Формы множественного есть и написаны, но живут в книжной речи, где говорят о разных видах одиночества: SAMOTNOŚCI BOHATERÓW, SAMOTNOŚCI MIEJSKIE. Два значения различает не форма, а оценка. Первое отрицательное, одиночество как тягость: SAMOTNOŚĆ CIĄŻY. Второе нейтральное или даже желанное, уединение: WYBRAĆ SAMOTNOŚĆ, PRACOWAĆ W SAMOTNOŚCI. По-русски второе значение обычно передают словом «уединение»." }
  - { kind: false-friend, text: "Русского слова «самотность» не существует, поэтому прямой ложной пары нет, но корень обманывает. Польское SAM — это и «сам», и «один, без других»: SAM W DOMU значит «один дома», а не «сам дома». Отсюда и SAMOTNY «одинокий», и SAMOTNOŚĆ «одиночество». Русский построил своё слово на «один», польский — на «sam», то есть на разных числительных-местоимениях при одном и том же смысле. Так что переводить SAMOTNY как «самотный» нельзя, а SAM в значении «один» надо просто принять." }
  - { kind: government, text: "Самые частые конструкции стоит запомнить готовыми, потому что падежи в них разные. Где — предлог W с предложным: W SAMOTNOŚCI «в одиночестве». Чего боятся или от чего страдают — родительный: BAĆ SIĘ SAMOTNOŚCI, UCIEKAĆ OD SAMOTNOŚCI. С чем борются — творительный с Z: WALCZYĆ Z SAMOTNOŚCIĄ. И отдельно оборот SKAZANY NA SAMOTNOŚĆ «обречён на одиночество», с предлогом NA и винительным." }
