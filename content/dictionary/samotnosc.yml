etymology: "От SAMOTNY «одинокий», а то — от SAM «сам, один», из праславянского *samъ, откуда и русское «сам». Конечный суффикс -OŚĆ — это тот же суффикс, что русский «-ость»: оба продолжают праславянское *-ostь и оба образуют отвлечённые существительные от прилагательных. Соответствие регулярное и даёт сразу целый список: WOLNOŚĆ «вольность, свобода», MIŁOŚĆ, RADOŚĆ, CIEMNOŚĆ, WŁASNOŚĆ. Стоит запомнить правило, а не слова: польское -OŚĆ отвечает русскому «-ость», и обе формы женского рода. Расходятся языки только в основе: русское «одиночество» выросло из «один», польское SAMOTNOŚĆ — из SAM."
memory: "Суффиксное правило: польское -OŚĆ — это русское «-ость», и род женский. Основа другая: польский считает от sam «один», русский от «один» другого корня. Два значения: тягостное одиночество и желанное уединение. Читается «само́тносьць», ść как в paść."
idioms:
