# review
id: nowy
format: 2
lemma: "nowy"
rank: 127
pos: adj
pron: { cyr: "но́вы" }
senses:
  - id: new
    ru: "новый, недавний (не старый)"
    examples:
      - pl: "To jest nowy dom."
        ru: "Это новый дом."
        source: { kind: tatoeba, id: 12680270 }
      - pl: "Ten jest nowy."
        ru: "Этот новый."
        source: { kind: tatoeba, id: 10747422 }
      - pl: "Dodaj nowe zdania."
        ru: "Добавь новые предложения."
        source: { kind: tatoeba, id: 12359920 }
  - id: newcomer
    ru: "новый, новенький (о человеке в коллективе)"
    examples:
      - pl: "Jesteś nowy?"
        ru: "Ты новенький?"
        source: { kind: tatoeba, id: 2979849 }
      - pl: "Jesteś tu nowa?"
        ru: "Ты новенькая?"
        source: { kind: tatoeba, id: 12470530 }
      - pl: "Czy oni są nowi?"
        ru: "Они новые?"
        source: { kind: tatoeba, id: 6320833 }
notes:
  - { kind: usage, text: "Степени сравнения правильные: nowy — nowszy — najnowszy («новый — новее — самый новый»)." }
  - { kind: usage, text: "Nowy Rok «Новый год» пишется с прописной буквы; od nowa значит «заново, с начала»." }
collocations:
  - { pl: "Nowy Rok", ru: "Новый год" }
  - { pl: "nowy rok szkolny", ru: "новый учебный год" }
  - { pl: "od nowa", ru: "заново" }
  - { pl: "co nowego?", ru: "что нового?" }
etymology: "Праславянское *novъ, из праиндоевропейского *newos; то же слово, что русское «новый» (ср. чешское nový, болгарское нов)."
memory: "Правильная цепочка: nowy — nowszy — najnowszy. Nowy Rok — «Новый год» (с прописной), od nowa — «заново», a co nowego? — «что нового?»."
idioms:
  - { pl: "Nowy Rok", ru: "Новый год" }
  - { pl: "nowa miotła dobrze zamiata", ru: "новая метла по-новому метёт" }
  - { pl: "od nowa", ru: "заново, с начала" }
