# review
id: wygarnac
format: 2
lemma: "wygarnąć"
rank: 5912
pos: verb
aspect: perf
pron: { cyr: "выга́рноньць" }
senses:
  - id: rake-out
    ru: "выгрести (золу, угли, мусор)"
    examples:
      - pl: "Dziadek wygarnął węgle z pieca."
        ru: "Дедушка выгреб угли из печи."
        source: { kind: authored }
      - pl: "Trzeba wygarnąć popiół z kominka."
        ru: "Нужно выгрести золу из камина."
        source: { kind: authored }
      - pl: "Babcia wygarnęła popiół do wiadra."
        ru: "Бабушка выгребла золу в ведро."
        source: { kind: authored }
  - id: tell-off
    ru: "разг. высказать, выложить (всё, что накипело) — wygarnąć komuś"
    examples:
      - pl: "W końcu wygarnął szefowi, co o nim myśli."
        ru: "Наконец он высказал начальнику, что о нём думает."
        source: { kind: authored }
      - pl: "Wygarnęła mężowi wszystkie pretensje."
        ru: "Она высказала мужу все претензии."
        source: { kind: authored }
      - pl: "Jutro wygarnę mu wszystko."
        ru: "Завтра я ему всё выскажу."
        source: { kind: authored }
  - id: fire
    ru: "разг. дать очередь (из оружия)"
    examples:
      - pl: "Żołnierz wygarnął serię z karabinu."
        ru: "Солдат дал очередь из автомата."
        source: { kind: authored }
      - pl: "Partyzanci wygarnęli serię w stronę lasu."
        ru: "Партизаны дали очередь в сторону леса."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Совершенный вид; несовершенный — WYGARNIAĆ. Спряжение на -NĄĆ: WYGARNĘ, WYGARNIESZ, WYGARNIE — это будущее время: «выгребу, выскажу». В прошедшем Ą мужского рода сменяется на Ę в остальных формах: WYGARNĄŁ, но WYGARNĘŁA, WYGARNĘLI." }
  - { kind: government, text: "Что откуда — винительный и Z + родительный: WYGARNĄĆ POPIÓŁ Z PIECA. В значении «высказать» — кому дательный, что винительный: WYGARNĄĆ KOMUŚ PRAWDĘ, WSZYSTKO; или придаточное: WYGARNĄŁ MU, CO O NIM MYŚLI." }
  - { kind: register, text: "Значение «высказать всё, что накипело» — разговорное и самое частое в живой речи; русское соответствие — «выложить», «высказать в лицо». «Дать очередь» (WYGARNĄĆ SERIĘ) — тоже разговорное. Мужско-личное страдательное WYGARNIĘCI в карточку не включено: выгребают золу и мусор, а не людей." }
  - { kind: pronunciation, text: "Читается «выга́рноньць»: Ą перед Ć — «онь». WYGARNĄŁ — «выга́рноу»: перед Ł носовой призвук пропадает. WYGARNĘ — «выга́рнэ»." }
collocations:
  - { pl: "wygarnąć popiół z pieca", ru: "выгрести золу из печи" }
  - { pl: "wygarnąć komuś prawdę", ru: "высказать кому-то правду" }
  - { pl: "wygarnąć komuś wszystko", ru: "выложить кому-то всё" }
  - { pl: "wygarnąć serię", ru: "дать очередь" }
family:
  - { pl: "wygarniać", ru: "выгребать; высказывать", relation: aspect }
  - { pl: "zgarnąć", ru: "сгрести; разг. загрести, забрать", relation: root, id: zgarnac }
  - { pl: "ogarnąć", ru: "охватить; разг. разобраться, привести в порядок", relation: root, id: ogarnac }
  - { pl: "garnąć się", ru: "тянуться, льнуть", relation: root }
etymology: "Приставка WY- «вы-» и GARNĄĆ «сгребать, прижимать к себе». Того же корня OGARNĄĆ «охватить» и ZGARNĄĆ «сгрести»."
memory: "Wygarnąć — «выгрести»: сначала золу из печи, а потом и всё, что накипело, — прямо человеку в лицо."
idioms:
  - { pl: "wygarnąć komuś prawdę prosto w oczy", ru: "высказать кому-то правду прямо в глаза" }
  - { pl: "wygarnąć wszystko, co leży na wątrobie", ru: "высказать всё, что наболело" }
formExamplesSkip:
  - { form: "wygarnięci", reason: "мужско-личная форма страдательного причастия: выгребают золу, землю и мусор, а не людей" }
