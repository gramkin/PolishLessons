etymology: "От PRZYJEMNY «приятный», от PRZYJĄĆ «принять»: приятное — то, что легко принимается. Русское «приятный» — того же корня, от «принять». Отрицание NIE- даёт противоположность."
memory: "Nieprzyjemny — неприятный: nieprzyjemny zapach, nieprzyjemna rozmowa; о человеке — грубый. Nieprzyjemniejszy, najnieprzyjemniejszy. Читается «непшые́мны»."
