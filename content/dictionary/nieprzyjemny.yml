notes:
  - { kind: false-friend, text: "Совпадение с русским «неприятный» полное, и устройство то же: NIE плюс PRZYJEMNY, как «не» плюс «приятный». Синоним NIEMIŁY мягче и чаще о людях; NIEPRZYJEMNY — шире, о запахах, ощущениях, ситуациях. Наречие NIEPRZYJEMNIE — «неприятно»: ZROBIŁO SIĘ NIEPRZYJEMNIE, «стало неприятно»." }
  - { kind: usage, text: "Полная парадигма: NIEPRZYJEMNY, NIEPRZYJEMNIEJSZY, NAJNIEPRZYJEMNIEJSZY. Все степени живые. Мужское-личное: NIEPRZYJEMNI, NIEPRZYJEMNIEJSI, NAJNIEPRZYJEMNIEJSI." }
  - { kind: government, text: "Неприятный кому-то — NIEPRZYJEMNY DLA KOGOŚ, DLA с родительным. Груб с кем-то — NIEPRZYJEMNY DLA KOGOŚ или WOBEC KOGOŚ. Мне неприятно — JEST MI NIEPRZYJEMNIE, наречие с дательным." }
  - { kind: pronunciation, text: "Читается «непшые́мны», четыре слога, ударение на предпоследнем. PRZY — «пшы», JE — «е». Сравните с PRZYJEMNY «пшые́мны»." }
  - { kind: register, text: "Нейтральное повседневное слово. NIEPRZYJEMNA NIESPODZIANKA — «неприятный сюрприз», NIEPRZYJEMNY INCYDENT — газетное «неприятный инцидент»." }
collocations:
