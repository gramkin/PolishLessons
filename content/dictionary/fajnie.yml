# review
id: fajnie
format: 2
lemma: "fajnie"
rank: 1041
pos: adv
pron: { cyr: "фа́йне" }
senses:
  - id: nice
    ru: "классно, здорово"
    examples:
      - pl: "Fajnie!"
        ru: "Классно!"
        source: { kind: translated, id: 12567725 }
      - pl: "Ale fajnie!"
        ru: "Как классно!"
        source: { kind: translated, id: 982411 }
      - pl: "Tutaj jest fajnie."
        ru: "Здесь классно."
        source: { kind: translated, id: 10704077 }
  - id: was-nice
    ru: "fajnie było — было классно, было здорово"
    examples:
      - pl: "Fajnie było na imprezie?"
        ru: "На вечеринке было классно?"
        source: { kind: translated, id: 858480 }
      - pl: "Fajnie było nic nie robić."
        ru: "Было здорово ничего не делать."
        source: { kind: translated, id: 3739652 }
      - pl: "Fajnie było cię zobaczyć."
        ru: "Было здорово тебя увидеть."
        source: { kind: authored }
  - id: agreement
    ru: "Fajnie. — Ладно, хорошо (реплика согласия)"
    examples:
      - pl: "Fajnie, spotkajmy się o piątej."
        ru: "Хорошо, встретимся в пять."
        source: { kind: authored }
      - pl: "Fajnie, że przyszedłeś."
        ru: "Здорово, что ты пришёл."
        source: { kind: authored }
      - pl: "No fajnie, to idziemy."
        ru: "Ну и отлично, тогда идём."
        source: { kind: authored }
notes:
  - { kind: register, text: "Разговорное слово, но вполне приличное: его говорят и взрослые, и дети. Это наречие от fajny «классный»." }
  - { kind: usage, text: "Безличная конструкция fajnie było + инфинитив: Fajnie było nic nie robić «Было здорово ничего не делать»." }
  - { kind: usage, text: "Fajnie, że… — «здорово, что…»: Fajnie, że przyszedłeś." }
  - { kind: usage, text: "Степени сравнения fajniej и najfajniej существуют, но в корпусе не встречаются; в живой речи чаще говорят lepiej." }
collocations:
  - { pl: "fajnie było", ru: "было здорово" }
  - { pl: "fajnie, że", ru: "здорово, что" }
  - { pl: "ale fajnie!", ru: "как классно!" }
  - { pl: "tu jest fajnie", ru: "здесь классно" }
family:
  - { pl: "fajny", ru: "классный, клёвый", relation: root, id: fajny }
etymology: "Наречие от fajny, которое пришло из немецкого fein «отличный, тонкий». В русском того же корня нет, ближайшее по духу — «классно»."
memory: "fajnie — «классно, здорово», наречие от fajny. Разговорное, но приличное. Запомните безличное fajnie było «было здорово» и fajnie, że… «здорово, что…»."
idioms:
