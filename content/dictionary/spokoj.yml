# review
id: spokoj
format: 2
lemma: "spokój"
rank: 278
pos: noun
pron: { cyr: "спо́куй" }
senses:
  - id: calm
    ru: "покой, спокойствие"
    examples:
      - pl: "Lubię ciszę i spokój."
        ru: "Я люблю тишину и покой."
        source: { kind: tatoeba, id: 4490544 }
      - pl: "Musimy zachować spokój."
        ru: "Мы должны сохранять спокойствие."
        source: { kind: tatoeba, id: 3049815 }
      - pl: "Zostaw mnie w spokoju!"
        ru: "Оставь меня в покое!"
        source: { kind: tatoeba, id: 691979 }
  - id: leave-alone
    ru: "покой (в обороте «оставить в покое»)"
    examples:
      - pl: "Zostawcie borsuki w spokoju."
        ru: "Оставьте барсуков в покое."
        source: { kind: tatoeba, id: 6155758 }
      - pl: "Zostaw mnie w spokoju! Nie widzisz, jestem zajęty."
        ru: "Оставь меня в покое! Не видишь, я занят."
        source: { kind: tatoeba, id: 5909071 }
      - pl: "Dajmy sobie spokój z jedzeniem w tej restauracji."
        ru: "Давайте не пойдём есть в этот ресторан."
        source: { kind: tatoeba, id: 991276 }
notes:
  - { kind: usage, text: "Это то же слово, что pokój «комната, мир», только с приставкой s-. Отсюда и значение: со-стояние покоя." }
  - { kind: usage, text: "Zostaw mnie w spokoju! — «Оставь меня в покое!», одна из самых частых фраз; zachować spokój — «сохранять спокойствие»." }
  - { kind: usage, text: "dać sobie spokój z czymś значит «бросить затею, махнуть рукой»: Dajmy sobie spokój z tym filmem." }
collocations:
  - { pl: "zostaw mnie w spokoju", ru: "оставь меня в покое" }
  - { pl: "zachować spokój", ru: "сохранять спокойствие" }
  - { pl: "dać sobie spokój", ru: "бросить затею" }
  - { pl: "cisza i spokój", ru: "тишина и покой" }
etymology: "Это pokój «покой, мир» с приставкой s-; праславянское *pokojь — то же слово, что русское «покой»."
memory: "spokój — это pokój с приставкой s-. Zostaw mnie w spokoju! значит «Оставь меня в покое!», а dać sobie spokój — «бросить затею»."
idioms:
  - { pl: "dać sobie spokój", ru: "бросить затею" }
  - { pl: "mieć święty spokój", ru: "иметь полный покой" }
  - { pl: "zachować spokój", ru: "сохранять спокойствие" }
