# review
id: napisac
format: 2
lemma: "napisać"
rank: 408
pos: verb
aspect: perf
pron: { cyr: "напи́саць" }
senses:
  - id: write
    ru: "написать"
    examples:
      - pl: "Kto to napisał?"
        ru: "Кто это написал?"
        source: { kind: tatoeba, id: 2587607 }
      - pl: "Napisałem list."
        ru: "Я написал письмо."
        source: { kind: tatoeba, id: 2146669 }
      - pl: "Muszę napisać list."
        ru: "Мне надо написать письмо."
        source: { kind: tatoeba, id: 529750 }
  - id: write-to
    ru: "написать произведение; написать кому-то"
    examples:
      - pl: "Chcę napisać książkę."
        ru: "Я хочу написать книгу."
        source: { kind: tatoeba, id: 2914757 }
      - pl: "Kto napisał „Hamleta”?"
        ru: "Кто написал «Гамлета»?"
        source: { kind: tatoeba, id: 590987 }
      - pl: "Napiszę do Toma."
        ru: "Я напишу Тому."
        source: { kind: translated, id: 3749966 }
notes:
  - { kind: usage, text: "Совершенный вид к pisać. Приставка na- совпадает с русской буквально: pisać «писать» — napisać «написать»." }
  - { kind: false-friend, text: "Главная ловушка — управление: письмо пишут do kogoś, а не дательным падежом. Napiszę do Toma «Я напишу Тому», Napisała do mnie «Она написала мне»." }
  - { kind: usage, text: "Основа будущего времени меняется: napisać, но napiszę, napiszesz, napisze. Повелительное — napisz." }
  - { kind: usage, text: "Co tu jest napisane? — «Что здесь написано?»; безличное napisano — «написали, было написано»." }
collocations:
  - { pl: "napisać list", ru: "написать письмо" }
  - { pl: "napisać do kogoś", ru: "написать кому-то" }
  - { pl: "co tu jest napisane?", ru: "что здесь написано?" }
  - { pl: "napisać książkę", ru: "написать книгу" }
etymology: "Из na- + pisać, праславянское *pьsati «писать». Русское «написать» — то же самое слово с той же приставкой."
memory: "napisać — «написать», и приставка na- совпадает с русской буквально. Запомните две вещи. Управление: письмо пишут do kogoś, а не дательным — Napiszę do Toma «Я напишу Тому». И основа будущего: napisać, но napiszę, napiszesz. А Co tu jest napisane? — «Что здесь написано?»"
idioms:
  - { pl: "napisać do kogoś", ru: "написать кому-то" }
  - { pl: "co tu jest napisane?", ru: "что здесь написано?" }
  - { pl: "napisać list", ru: "написать письмо" }
formExamplesSkip:
  - { form: "napisani", reason: "лично-мужская форма страдательного причастия: «написать» к людям не применяется, поэтому такой формы в языке нет" }
