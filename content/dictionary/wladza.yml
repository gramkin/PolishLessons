  - id: authorities
    ru: "władze (мн. ч.) — власти, органы власти"
    note: "Во множественном числе слово значит «начальство, органы власти»."
    examples:
      - pl: "Władze podjęły śledztwo w tej sprawie."
        ru: "Власти начали расследование по этому делу."
        source: { kind: translated, id: 970778 }
      - pl: "Władze ukrywały fakty przed obywatelami."
        ru: "Власти скрывали факты от граждан."
        source: { kind: translated, id: 858414 }
      - pl: "Studenci protestowali przeciw decyzji władz."
        ru: "Студенты протестовали против решения властей."
        source: { kind: translated, id: 959274 }
  - id: lust-for
    ru: "żądza władzy — жажда власти"
    examples:
      - pl: "Aż kipi żądzą władzy."
        ru: "Он так и кипит жаждой власти."
        source: { kind: translated, id: 511534 }
      - pl: "To człowiek żądny władzy."
        ru: "Это человек, жаждущий власти."
        source: { kind: translated, id: 349596 }
      - pl: "On nadużywa swojej władzy."
        ru: "Он злоупотребляет своей властью."
        source: { kind: translated, id: 6306781 }
notes:
  - { kind: usage, text: "Единственное число — «власть» как сила и полномочия; множественное władze — «власти, органы власти, начальство». Русский различает их так же: «власть» и «власти»." }
  - { kind: usage, text: "Родительный падеж władzy употребляется очень часто: żądza władzy «жажда власти», nadużywać władzy «злоупотреблять властью», dojść do władzy «прийти к власти»." }
  - { kind: usage, text: "czwarta władza — «четвёртая власть», то есть пресса. А władze umysłowe значит «умственные способности»." }
  - { kind: usage, text: "Глагол того же корня — władać «владеть, править»: władać językiem «владеть языком». Правитель — władca." }
collocations:
  - { pl: "dojść do władzy", ru: "прийти к власти" }
  - { pl: "żądza władzy", ru: "жажда власти" }
  - { pl: "nadużywać władzy", ru: "злоупотреблять властью" }
  - { pl: "władze lokalne", ru: "местные власти" }
family:
  - { pl: "władać", ru: "владеть, править", relation: root }
  - { pl: "władca", ru: "властитель", relation: derived }
  - { pl: "włodarz", ru: "управитель", relation: derived }
etymology: "От władać «владеть, править», праславянское *volděti — тот же корень, что в русском «владеть» и «власть». Польское ła на месте русского оло: władza — «власть», как głowa — «голова»."
memory: "władza — «власть», и корень тот же, что в русском: władać «владеть». Запомните чередование ła — оло, оно работает во многих словах: władza — власть, głowa — голова. И различайте число: władza одна — это сила, władze во множественном — это «власти, начальство»."
idioms:
