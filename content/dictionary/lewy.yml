# review
id: lewy
format: 2
lemma: "lewy"
rank: 814
pos: adj
pron: { cyr: "ле́вы" }
senses:
  - id: left
    ru: "левый (о стороне)"
    examples:
      - pl: "Boli mnie lewe ramię."
        ru: "У меня болит левое плечо."
        source: { kind: tatoeba, id: 2224061 }
      - pl: "Lewy głośnik nie działa."
        ru: "Левый динамик не работает."
        source: { kind: translated, id: 13264462 }
      - pl: "Lewy kierunkowskaz się zepsuł."
        ru: "Левый поворотник сломался."
        source: { kind: translated, id: 940899 }
  - id: left-hand
    ru: "lewa ręka — левая рука"
    examples:
      - pl: "Prawa ręka nie wie co czyni lewa."
        ru: "Правая рука не ведает, что творит левая."
        source: { kind: tatoeba, id: 2148306 }
      - pl: "Ona pisze lewą ręką."
        ru: "Она пишет левой рукой."
        source: { kind: tatoeba, id: 356547 }
      - pl: "Tom je lewą ręką, ale pisze prawą."
        ru: "Том ест левой рукой, но пишет правой."
        source: { kind: tatoeba, id: 1846157 }
  - id: on-the-left
    ru: "z lewej, po lewej — слева"
    examples:
      - pl: "Reflektory z lewej, z prawej, na początek pasa."
        ru: "Прожектора слева, справа, в начало полосы."
        source: { kind: tatoeba, id: 1736702 }
      - pl: "Proszę jechać z lewej."
        ru: "Пожалуйста, езжайте слева."
        source: { kind: translated, id: 10901373 }
      - pl: "Proszę jechać po lewej."
        ru: "Пожалуйста, езжайте по левой стороне."
        source: { kind: translated, id: 10901372 }
  - id: fake
    ru: "lewy — левый, липовый (разговорное)"
    note: "Переносное значение совпадает с русским."
    examples:
      - pl: "Uważaj na lewe taryfy."
        ru: "Берегись левых такси."
        source: { kind: translated, id: 970773 }
      - pl: "Gubernator wziął pieniądze z lewego konta."
        ru: "Губернатор взял деньги с левого счёта."
        source: { kind: translated, id: 823303 }
      - pl: "Sprzedawał lewe dokumenty."
        ru: "Он продавал липовые документы."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Переносное значение совпадает с русским до мелочей: lewy значит «левый, липовый, незаконный» — lewe dokumenty «липовые документы», lewe taryfy «левые такси», lewe konto «левый счёт»." }
  - { kind: usage, text: "Две идиомы переносятся почти дословно: mieć dwie lewe ręce «руки не из того места» (буквально «иметь две левые руки») и wstać lewą nogą «встать не с той ноги» — поляк уточняет, что с левой." }
  - { kind: government, text: "z lewej и po lewej значат «слева»; na lewo «налево»; na lewą stronę «наизнанку»." }
  - { kind: usage, text: "Антоним — prawy, и он же значит «правый» в смысле «правильный, праведный»: этимологически lewy и построено как противоположность prawy." }
collocations:
  - { pl: "lewa ręka", ru: "левая рука" }
  - { pl: "po lewej", ru: "слева" }
  - { pl: "mieć dwie lewe ręce", ru: "руки не из того места" }
  - { pl: "wstać lewą nogą", ru: "встать не с той ноги" }
family:
  - { pl: "prawy", ru: "правый", relation: root }
  - { pl: "lewo", ru: "влево", relation: derived }
  - { pl: "leworęczny", ru: "левша", relation: derived }
  - { pl: "lewica", ru: "левые (в политике)", relation: derived }
etymology: "Праславянское *lěvъ — то же слово, что русское «левый»; построено как противоположность prawy «правый»."
memory: "lewy — «левый», слово то же самое, и переносное значение совпадает до мелочей: lewe dokumenty «липовые документы», lewe konto «левый счёт». Две идиомы тоже почти дословны: mieć dwie lewe ręce «руки не из того места» и wstać lewą nogą «встать не с той ноги» — поляк только уточняет, что нога левая."
idioms:
  - { pl: "mieć dwie lewe ręce", ru: "руки не из того места" }
  - { pl: "wstać lewą nogą", ru: "встать не с той ноги" }
  - { pl: "na lewą stronę", ru: "наизнанку" }
