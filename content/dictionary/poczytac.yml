# review
id: poczytac
format: 2
lemma: "poczytać"
rank: 5364
pos: verb
pron: { cyr: "почы́таць" }
senses:
  - id: read-a-while
    ru: "почитать (какое-то время)"
    examples:
      - pl: "Poczytam trochę przed snem."
        ru: "Я немного почитаю перед сном."
        source: { kind: authored }
      - pl: "W pociągu poczytała gazetę."
        ru: "В поезде она почитала газету."
        source: { kind: authored }
      - pl: "Poczytaj mi bajkę, mamo!"
        ru: "Почитай мне сказку, мама!"
        source: { kind: authored }
  - id: consider
    ru: "книжн. счесть, расценить (POCZYTAĆ ZA)"
    examples:
      - pl: "Jego milczenie poczytano za zgodę."
        ru: "Его молчание сочли согласием."
        source: { kind: authored }
      - pl: "Poczytam to sobie za zaszczyt."
        ru: "Я сочту это за честь."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "POCZYTAĆ — «почитать», то есть читать недолго, а не «почитать» в смысле «уважать». «Почитать родителей» — CZCIĆ RODZICÓW или SZANOWAĆ. Прочитать целиком — PRZECZYTAĆ: PRZECZYTAŁEM KSIĄŻKĘ, но POCZYTAŁEM KSIĄŻKĘ — «почитал немного»." }
  - { kind: usage, text: "Пятьдесят три формы. Страдательные POCZYTANY, POCZYTANI относятся ко второму значению: ZOSTALI POCZYTANI ZA ZDRAJCÓW — «их сочли предателями». Спряжение как у CZYTAĆ: POCZYTAM, POCZYTASZ. Несовершенный вид в значении «считать» — POCZYTYWAĆ." }
  - { kind: government, text: "Что — винительный: POCZYTAĆ KSIĄŻKĘ. Кому — дательный: POCZYTAĆ DZIECKU. О чём — O с предложным: POCZYTAĆ O HISTORII. В значении «счесть» — ZA с винительным: POCZYTAĆ COŚ ZA BŁĄD, POCZYTAĆ KOMUŚ COŚ ZA ZŁE «поставить в вину»." }
  - { kind: pronunciation, text: "Читается «почы́таць»: CZY — «чы», твёрдо. Ударение на предпоследнем слоге. POCZYTAM — «почы́там»." }
  - { kind: register, text: "В значении «почитать» — нейтральное, бытовое. В значении «счесть» — книжное: POCZYTAĆ SOBIE ZA ZASZCZYT, POCZYTAĆ ZA ZŁE. В разговоре вместо этого говорят UZNAĆ ZA или ODEBRAĆ JAKO." }
collocations:
  - { pl: "poczytać przed snem", ru: "почитать перед сном" }
  - { pl: "poczytać dziecku bajkę", ru: "почитать ребёнку сказку" }
  - { pl: "poczytać sobie za zaszczyt", ru: "счесть за честь" }
family:
  - { pl: "czytać", ru: "читать", relation: root, id: czytac }
  - { pl: "przeczytać", ru: "прочитать", relation: derived, id: przeczytac }
  - { pl: "poczytny", ru: "популярный, читаемый (об авторе, книге)", relation: derived }
etymology: "Приставка PO- плюс CZYTAĆ «читать», праславянское *čitati «считать, читать». Значение «счесть» — от старого «считать»: русское «почитать за честь» хранит тот же след."
memory: "Poczytać — почитать немного: poczytam przed snem. Poczytać za — счесть: poczytano to za zgodę. Читается «почы́таць»."
idioms:
  - { pl: "poczytać komuś coś za złe", ru: "поставить кому-то что-то в вину, обидеться на кого-то за что-то" }
