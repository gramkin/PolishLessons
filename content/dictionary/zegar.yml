notes:
  - { kind: usage, text: "Главное отличие от русского — число. «Часы» по-русски не имеют единственного: один прибор всё равно «часы». Польский ZEGAR — обычное исчисляемое слово в единственном числе: JEDEN ZEGAR, DWA ZEGARY, TRZY ZEGARY. Русскому приходится переучивать согласование: zegar stanął, а не «часы встали». И наоборот, ZEGARY во множественном значит именно несколько приборов, а не один." }
  - { kind: false-friend, text: "Русский называет и единицу времени, и прибор одним корнем: «час» и «часы». Польский разводит их по двум несвязанным словам: GODZINA — это час как мера времени, ZEGAR — прибор. Поэтому «сколько часов?» о времени будет KTÓRA GODZINA, а не что-либо с zegar, а ILE ZEGARÓW спросят только в магазине. Путаница тут стоит дорого, потому что ошибка меняет смысл вопроса целиком." }
  - { kind: usage, text: "Местный падеж — ZEGARZE: r переходит в rz перед окончанием -e. Это та же мена, что в teatrze, norze, wzorze, atmosferze и kulturze, и она же стоит за bystrzy и bystrzejszy. Правило простое: твёрдое r перед -e не остаётся никогда. Родительный при этом ZEGARA с окончанием -a, как dziennika, а не -u, как pliku и dymu, — выбор лексический и предсказать его нельзя." }
