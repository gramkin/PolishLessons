etymology: "Из немецкого ZEIGER «указатель», от zeigen «показывать»: прибор назван по стрелке, которая показывает. Русский пошёл совсем другим путём и назвал прибор по тому, что он отсчитывает, — «часы» от «часа». Отсюда и вся разница: у русского прибор и единица времени однокоренные, а у польского это два чужих друг другу слова, zegar и godzina, и догадаться о связи по звучанию невозможно."
memory: "Единственное число, в отличие от русских «часов»: jeden zegar, zegar stanął. А час как мера времени — godzina, слово другое. Местный zegarze, r даёт rz."
idioms:
