        source: { kind: authored }
      - pl: "Przeczytaj całość, nie fragmenty."
        ru: "Прочитай целиком, а не отрывки."
        source: { kind: authored }
  - id: entirety
    ru: "w całości — полностью, целиком"
    examples:
      - pl: "Dług spłacili w całości."
        ru: "Долг они выплатили полностью."
        source: { kind: authored }
      - pl: "Budynek zachował się w całości."
        ru: "Здание сохранилось целиком."
        source: { kind: authored }
  - id: integrity
    ru: "целостность, единство"
    examples:
      - pl: "Całość kompozycji psuje jeden szczegół."
        ru: "Целостность композиции портит одна деталь."
        source: { kind: authored }
notes:
  - { kind: usage, text: "ЕЩЁ ОДНО СУЩЕСТВИТЕЛЬНОЕ НА -OŚĆ, И ФОРМ У НЕГО ШЕСТЬ. Całość склоняется как wolność, ludzkość, własność и miłość: całość, całości на родительный, дательный и предложный разом, całością, плюс почти неупотребительное множественное. Суффикс -ość равен русскому -ость, а корень cały — русскому «целый»." }
  - { kind: false-friend, text: "Русское «целость» существует, но звучит редко и книжно; обычное слово там — «целое» или оборот «целиком». Польское całość совершенно обиходно: zapłacić w całości, przeczytać całość. Переводить его чаще всего надо наречием «целиком», а не существительным." }
  - { kind: pronunciation, text: "Три слога, ударение на предпоследнем: ca-ŁOŚĆ — точнее CA-łość. Ł читается как краткое у, ść — как мягкое щць: «цауо́щць». Конечное сочетание глухое и короткое." }
collocations:
  - { pl: "w całości", ru: "целиком, полностью" }
  - { pl: "całość kwoty", ru: "вся сумма" }
  - { pl: "stanowić całość", ru: "составлять единое целое" }
family:
  - { pl: "cały", ru: "целый", relation: root, id: caly }
  - { pl: "częściowo", ru: "частично", relation: antonym }
  - { pl: "pocałunek", ru: "поцелуй", relation: derived, id: pocalunek }
etymology: "От cały «целый», из праславянского *cělъ — того же слова, что русское «целый», родственного немецкому heil «целый, здоровый». Суффикс -ość равен русскому -ость. Тот же корень дал pocałunek: поцеловать значило пожелать целости."
memory: "całość — «целое», и чаще всего переводится наречием: w całości «целиком». Шесть форм, как у всего класса на -ość. Корень cały «целый» — тот же, что в pocałunek."
idioms:
  - { pl: "w całości", ru: "целиком" }
  - { pl: "stanowić całość", ru: "составлять одно целое" }
