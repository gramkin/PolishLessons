      - pl: "Niepojęte, że nikt tego nie zauważył."
        ru: "Непостижимо, что никто этого не заметил."
        source: { kind: authored }
  - id: inconceivable
    ru: "невообразимый, немыслимый"
    examples:
      - pl: "Niepojęta cisza zapadła po wyroku."
        ru: "Невообразимая тишина повисла после приговора."
        source: { kind: authored }
      - pl: "Straty były niepojęte."
        ru: "Потери были невообразимыми."
        source: { kind: authored }
notes:
  - { kind: government, text: "Прилагательное от страдательного причастия: niepojęty, niepojęta, niepojęte. Степеней не образует — признак абсолютный." }
  - { kind: usage, text: "Книжное и выразительное слово; в нейтральной речи чаще niezrozumiały «непонятный»." }
  - { kind: usage, text: "Часто в безличном обороте: niepojęte, że… «непостижимо, что…»." }
  - { kind: false-friend, text: "Русское «непонятный» слабее и отвечает польскому niezrozumiały. Niepojęty это «непостижимый» — то, чего нельзя охватить умом." }
collocations:
  - { pl: "niepojęty upór", ru: "непостижимое упорство" }
  - { pl: "niepojęte, że…", ru: "непостижимо, что…" }
  - { pl: "niepojęta tajemnica", ru: "непостижимая тайна" }
family:
  - { pl: "pojąć", ru: "постичь, уразуметь", relation: root, id: pojac }
  - { pl: "niepojętość", ru: "непостижимость", relation: derived }
etymology: "Отрицание nie- плюс pojęty, страдательное причастие от pojąć «постичь, уразуметь»: буквально «непостижимый». Русское «непонятный» построено от другого глагола и звучит слабее."
memory: "niepojęty — «непостижимый», от pojąć «постичь» с отрицанием. Сильнее, чем niezrozumiały «непонятный»."
idioms:
