rank: 5751
pos: adj
pron: { cyr: "ньепое́нты" }
senses:
  - id: incomprehensible
    ru: "непостижимый, не поддающийся пониманию"
    examples:
      - pl: "Jego decyzja pozostaje dla mnie niepojęta."
        ru: "Его решение остаётся для меня непостижимым."
