# review
id: nocny
format: 2
lemma: "nocny"
rank: 1657
pos: adj
pron: { cyr: "но́цны" }
senses:
  - id: night-adj
    ru: "ночной"
    examples:
      - pl: "Pracuję na nocną zmianę."
        ru: "Я работаю в ночную смену."
        source: { kind: tatoeba, id: 9021962 }
      - pl: "Udało jej się złapać nocny pociąg."
        ru: "Ей удалось успеть на ночной поезд."
        source: { kind: translated, id: 11111918 }
      - pl: "Nocny strażnik nie słyszał złodziei."
        ru: "Ночной сторож не слышал воров."
        source: { kind: translated, id: 2265127 }
  - id: night-things
    ru: "ночной (о предметах и небе)"
    examples:
      - pl: "Patrzył w nocne niebo."
        ru: "Он смотрел в ночное небо."
        source: { kind: translated, id: 731991 }
      - pl: "Położyli lampę na szafce nocnej."
        ru: "Они поставили лампу на ночную тумбочку."
        source: { kind: translated, id: 12049072 }
      - pl: "Po nocnym niebie przemknęło UFO."
        ru: "По ночному небу промелькнуло НЛО."
        source: { kind: translated, id: 760373 }
notes:
  - { kind: usage, text: "Прилагательное от noc «ночь»: nocna zmiana «ночная смена», nocny pociąg «ночной поезд», lampka nocna «ночник»." }
  - { kind: usage, text: "nocny marek — идиома «сова» (о человеке, который поздно ложится). В корпусе форма nocnym чаще всего входит именно в неё, а не в обычное сочетание." }
  - { kind: usage, text: "stolik nocny и szafka nocna — «ночной столик, тумбочка»." }
  - { kind: usage, text: "życie nocne значит «ночная жизнь» города." }
collocations:
  - { pl: "nocna zmiana", ru: "ночная смена" }
  - { pl: "lampka nocna", ru: "ночник" }
  - { pl: "nocny marek", ru: "сова (о человеке)" }
etymology: "От noc «ночь», праславянское *noktь — то же слово, что русское «ночь», и прилагательное образовано тем же суффиксом, что русское «ночной»."
memory: "nocny = «ночной», от noc. Сочетания: nocna zmiana «ночная смена», lampka nocna «ночник». И запомните идиому nocny marek — «сова», о том, кто поздно ложится."
idioms:
