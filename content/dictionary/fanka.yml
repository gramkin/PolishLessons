pos: noun
pron: { cyr: "фа́нка" }
senses:
  - id: fan
    ru: "поклонница, фанатка"
    examples:
      - pl: "Jestem wielką fanką tego zespołu."
        ru: "Я большая поклонница этой группы."
        source: { kind: authored }
      - pl: "Fanki czekały pod hotelem."
        ru: "Поклонницы ждали у отеля."
        source: { kind: authored }
      - pl: "Fanka poprosiła o autograf."
        ru: "Фанатка попросила автограф."
        source: { kind: authored }
  - id: enthusiast
    ru: "любительница (чего-то)"
    examples:
      - pl: "Jest fanką kuchni włoskiej."
        ru: "Она любительница итальянской кухни."
        source: { kind: authored }
      - pl: "Moja mama to fanka kryminałów."
        ru: "Моя мама — любительница детективов."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "FANKA — «поклонница, фанатка», от FAN. Не только о звёздах: FANKA JOGI, «любительница йоги». Болельщица — KIBICKA, фанатка в негативном смысле — FANATYCZKA." }
  - { kind: usage, text: "Девять форм, женский род. В дательном и местном K переходит в C: O FANCE. Родительный множественного — FANEK. Звательный FANKO не учим." }
  - { kind: government, text: "Поклонница кого — родительный: FANKA BEATLESÓW. Быть фанаткой — BYĆ FANKĄ, творительный." }
  - { kind: pronunciation, text: "Читается «фа́нка», ударение на первом слоге. FANCE — «фа́нце»." }
collocations:
  - { pl: "wierna fanka", ru: "преданная поклонница" }
  - { pl: "wielka fanka", ru: "большая поклонница" }
  - { pl: "fanka kryminałów", ru: "любительница детективов" }
family:
  - { pl: "fan", ru: "фанат", relation: root, id: fan }
  - { pl: "kibic", ru: "болельщик", relation: root }
  - { pl: "wielbiciel", ru: "поклонник", relation: root }
etymology: "От FAN «фанат», из английского FAN, сокращения от FANATIC, с женским суффиксом -KA."
memory: "Fanka — поклонница, фанатка. Jestem fanką — я поклонница. Fanka jogi — любительница йоги. Читается «фа́нка»."
idioms:
