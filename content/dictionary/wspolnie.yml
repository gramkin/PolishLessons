etymology: "От прилагательного WSPÓLNY, а то — от старого сочетания с предлогом, означавшего «вместе с, при одном». Русское «общий» идёт от другого корня, *obьtjь. Польское WSPÓLNY связано с SPÓŁ-, SPÓŁKA «товарищество», и восходит к праславянскому сочетанию *sъ-pol- «с одной половиной, вместе», откуда и русское «пополам», и «спол-» в «исполу». То есть образ здесь делёжный: общее дело есть дело, поделённое надвое. Русское «сообща» построено иначе, от «общий», но пришло к тому же смыслу."
memory: "Не то же, что razem: razem — просто «рядом, в одно время», wspólnie — «сообща», об общем деле и общей ответственности. С кем — через Z с творительным. Читается «фспу́лне»: w перед s даёт «ф», ó даёт «у». Прилагательное wspólny частее наречия."
