notes:
  - { kind: false-friend, text: "Ловушка не в самом слове, а в выборе между ним и RAZEM. Оба переводятся русским «вместе», но делят работу. RAZEM значит простое совместное присутствие или одновременность: SZLI RAZEM «они шли вместе», то есть рядом. WSPÓLNIE значит общее участие в одном деле, с общей ответственностью или общим владением: WSPÓLNIE NAPISALI KSIĄŻKĘ «они написали книгу вместе», то есть оба авторы. Сказать RAZEM NAPISALI тоже можно, но тогда подчёркивается, что писали в одно время, а не что книга общая. Русское «сообща» и «совместно» ближе всего к WSPÓLNIE." }
  - { kind: pronunciation, text: "Читается «фспу́лне», с ударением на предпоследнем слоге. Три места требуют внимания. Начальное w перед глухим s оглушается в «ф», поэтому не «вспульне», а «фспу́лне». Буква ó даёт «у». И конечное -NIE звучит «не», одним слогом, с мягким n. Сочетание fsp в начале для русского непривычно, но разбивать его гласной не нужно: три согласных произносятся слитно." }
  - { kind: government, text: "С кем — предлог Z с творительным падежом: WSPÓLNIE Z BRATEM, WSPÓLNIE Z SĄSIADAMI. Русский говорит «вместе с братом», тоже с творительным, так что перенос прямой. Наречие ничем не управляет и падежей не требует. Прилагательное к нему — WSPÓLNY «общий, совместный», и оно частее самого наречия: WSPÓLNE MIESZKANIE «общая квартира», WSPÓLNY JĘZYK «общий язык», NIC WSPÓLNEGO «ничего общего». Степеней сравнения у наречия нет, потому что общее участие не бывает более или менее общим." }
  - { kind: usage, text: "Слово нейтральное, одинаково годится для разговора и для документа, и в юридических текстах встречается постоянно: WSPÓLNIE I SOLIDARNIE «совместно и солидарно» — устойчивая формула об ответственности. В быту чаще скажут RAZEM, а WSPÓLNIE выберут, когда важно подчеркнуть общность дела: WSPÓLNIE ZDECYDOWALIŚMY. Однокоренные слова стоит держать рядом: WSPÓLNOTA «сообщество, общность», WSPÓLNIK «партнёр, соучастник», WSPÓŁPRACA «сотрудничество»." }
