notes:
  - { kind: false-friend, text: "Всё гнездо русскому знакомо насквозь: PUSTY это «пустой», PUSTKA «пустота», PUSTYNIA «пустыня», PUSTKOWIE «пустошь». Корень общеславянский, и ни одно слово не обманывает. Запоминать стоит не значения, а оборот ŚWIECIĆ PUSTKAMI, буквально «светить пустотами»: так говорят о зале, магазине или улице, где никого нет. Русский скажет «пустовать» или «зиять пустотой», но образ света тут только польский." }
  - { kind: usage, text: "Десять форм, женский род. В дательном и местном падеже единственного числа K переходит в C: PUSTKA, но W PUSTCE. Родительный множественного PUSTEK с беглым E. Множественное число живёт прежде всего в обороте ŚWIECIĆ PUSTKAMI и в речи о пробелах: PUSTKI W PAMIĘCI «провалы в памяти», PUSTKI W KASIE «пусто в кассе»." }
  - { kind: government, text: "Пустота после кого-либо — PUSTKA PO KIMŚ, предлог PO с местным падежом: PUSTKA PO NIEJ. Пустота в чём-либо — PUSTKA W CZYMŚ, предлог W с местным: PUSTKA W GŁOWIE, PUSTKA W SERCU. Заполнить пустоту — WYPEŁNIĆ PUSTKĘ, винительный без предлога. Оборот ŚWIECIĆ PUSTKAMI требует творительного множественного и не меняется." }
  - { kind: pronunciation, text: "Читается «пу́стка», два слога, ударение на первом. Сочетание STK произносится слитно, три согласных подряд, и русскому уху оно привычно по слову «жёстко». В форме PUSTCE сочетание STC даёт «стц», и слышно «пу́стце». В родительном множественного PUSTEK беглое E звучит отчётливо: «пу́стэк»." }
  - { kind: register, text: "Слово нейтральное и работает в двух регистрах. В бытовом оно про отсутствие людей и вещей: PUSTKI W SKLEPACH «пусто в магазинах», SALA ŚWIECIŁA PUSTKAMI. В книжном и разговорном о чувствах: PUSTKA PO STRACIE «пустота после утраты», PUSTKA W GŁOWIE, то есть внезапный провал на экзамене. Последнее выражение знает каждый студент и употребляет без всякой торжественности." }
collocations:
  - { pl: "pustka w głowie", ru: "пустота в голове" }
  - { pl: "świecić pustkami", ru: "пустовать, зиять пустотой" }
  - { pl: "pustka po kimś", ru: "пустота после кого-либо" }
family:
  - { pl: "pusty", ru: "пустой", relation: root, id: pusty }
  - { pl: "pustynia", ru: "пустыня", relation: derived, id: pustynia }
  - { pl: "pustkowie", ru: "пустошь, безлюдное место", relation: derived }
etymology: "От PUSTY «пустой», от праславянского корня, давшего и русское «пустой», и «пустыню», и «пустошь». Гнездо в обоих языках устроено одинаково, слово в слово, и это один из самых прозрачных случаев родства. Любопытно только распределение: польское PUSTKOWIE значит безлюдное место вообще, а не песчаную пустыню, для которой есть PUSTYNIA, и русская «пустошь» ложится на первое из них точно."
memory: "Самое прозрачное гнездо в словаре: pusty «пустой», pustka «пустота», pustynia «пустыня», pustkowie «пустошь». Ничего не обманывает. Выучить стоит один оборот: świecić pustkami, буквально «светить пустотами», то есть пустовать, стоять без людей. Образ света здесь чисто польский, русский скажет «зиять пустотой». В дательном и местном k переходит в c: w pustce. Читается «пу́стка»."
idioms:
  - { pl: "świecić pustkami", ru: "пустовать, стоять совершенно пустым" }
