        source: { kind: translated, id: 1354971 }
  - id: in-safety
    ru: "być bezpiecznym — быть в безопасности"
    note: "О людях: jesteście bezpieczni «вы в безопасности»."
    examples:
      - pl: "Ze mną będą bezpieczni."
        ru: "Со мной они будут в безопасности."
        source: { kind: tatoeba, id: 3463010 }
