        ru: "Ты в безопасном месте."
        source: { kind: translated, id: 3363389 }
  - id: safe-journey
    ru: "Bezpiecznej podróży! — Счастливого пути!"
    note: "Пожелание строится родительным падежом без глагола."
    examples:
      - pl: "Bezpiecznej podróży!"
        ru: "Счастливого пути!"
        source: { kind: translated, id: 1827286 }
      - pl: "Bezpiecznej podróży."
        ru: "Счастливого пути."
        source: { kind: translated, id: 6309312 }
      - pl: "Bezpiecznej drogi do domu!"
        ru: "Счастливой дороги домой!"
        source: { kind: authored }
notes:
  - { kind: government, text: "Пожелания в польском строятся родительным падежом без глагола: Bezpiecznej podróży! «Счастливого пути!», как Smacznego! «Приятного аппетита!»" }
  - { kind: usage, text: "Слово собрано из bez + piecza «забота, попечение» — буквально «без забот». Русское «безопасный» построено иначе, через «опасность»." }
  - { kind: usage, text: "Степени правильные: bezpieczny — bezpieczniejszy — najbezpieczniejszy; мужское личное во множественном — bezpieczni." }
  - { kind: usage, text: "Существительное — bezpieczeństwo «безопасность», наречие — bezpiecznie." }
collocations:
  - { pl: "bezpieczne miejsce", ru: "безопасное место" }
  - { pl: "Bezpiecznej podróży!", ru: "Счастливого пути!" }
  - { pl: "czuć się bezpiecznie", ru: "чувствовать себя в безопасности" }
  - { pl: "bezpieczeństwo publiczne", ru: "общественная безопасность" }
family:
  - { pl: "bezpieczeństwo", ru: "безопасность", relation: derived }
  - { pl: "bezpiecznie", ru: "безопасно", relation: derived }
  - { pl: "piecza", ru: "попечение", relation: root }
etymology: "Из bez + piecza «забота, попечение» — буквально «без забот». Русское «безопасный» собрано иначе, через «опасность», но смысл сошёлся тот же."
memory: "bezpieczny — «безопасный», и собрано оно не как русское: bez + piecza, «без забот», а не «без опасности». Степени правильные: bezpieczny — bezpieczniejszy — najbezpieczniejszy, мужское личное множественное — bezpieczni. Отдельно запомните пожелание Bezpiecznej podróży! «Счастливого пути!» — оно строится родительным падежом без глагола, ровно как Smacznego! Существительное — bezpieczeństwo."
idioms:
