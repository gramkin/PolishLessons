notes:
  - { kind: false-friend, text: "POPULACJA — «популяция» животных и в научном языке «население». В обычной речи население — LUDNOŚĆ: LUDNOŚĆ POLSKI, «население Польши». POPULACJA о людях звучит книжно или статистически." }
  - { kind: usage, text: "Женский род. Родительный, дательный и местный — POPULACJI. Множественное — POPULACJE. Звательный и архаичное POPULACYJ не используем." }
  - { kind: government, text: "Популяция чего — родительный: POPULACJA RYSIA. В популяции — W POPULACJI, местный. Рост популяции — WZROST POPULACJI." }
  - { kind: pronunciation, text: "Читается «популя́цья»: LA — мягкое «ля», CJA — «цья». Ударение на предпоследнем слоге." }
