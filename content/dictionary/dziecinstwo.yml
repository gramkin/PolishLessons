  - { pl: "dziecinny", ru: "детский, ребяческий", relation: derived }
  - { pl: "dzieciak", ru: "ребятёнок", relation: derived, id: dzieciak }
  - { pl: "dorosłość", ru: "взрослость", relation: antonym }
etymology: "От dziecko «ребёнок», из праславянского *dětę — того же, что русское «дитя», — с суффиксом -stwo, равным русскому -ство. Корень восходит к значению «вскормленный», родственному глаголу «доить». Отсюда dziecinny, dzieciak, dziecięcy и dzieciństwo."
memory: "dzieciństwo — «детство», и собирается оно как русское слово: dziecko «дитя» плюс -stwo, равное «-ство». Главное — не спутать с dziecinność «ребячливость»: первое про пору жизни, второе про поведение взрослого."
idioms:
