notes:
  - { kind: usage, text: "ВТОРОЙ ПРИМЕР ТОГО ЖЕ РАВЕНСТВА: -STWO ОТВЕЧАЕТ РУССКОМУ -СТВО. Dziecko «ребёнок» плюс -stwo даёт dzieciństwo, как «дитя» плюс «-ство» даёт «детство». Рядом стоят królestwo «королевство», państwo «государство», bogactwo «богатство». Разбирается слово без остатка, и запоминать его как целое не нужно." }
  - { kind: pronunciation, text: "Четыре слога, ударение на предпоследнем: dzie-ciń-STWO — нет, на предпоследнем, то есть dzie-CIŃ-stwo. Dzi звучит как мягкое дз, ci как ць, ń как нь: «дзеци́ньстфо». В предложном падеже w смягчается: w dzieciństwie." }
  - { kind: false-friend, text: "Ловушки нет, но есть соседнее слово, с которым его путают сами поляки: dzieciństwo это «детство», а dziecinność — «ребячливость, инфантильность». Первое про возраст, второе про поведение взрослого. Прилагательное dziecinny тоже двузначно: dziecinny pokój «детская комната», но dziecinne zachowanie «ребяческое поведение»." }
collocations:
