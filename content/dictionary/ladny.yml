# review
id: ladny
format: 2
lemma: "ładny"
rank: 590
pos: adj
pron: { cyr: "уа́дны" }
senses:
  - id: pretty
    ru: "красивый, хорошенький"
    note: "Обиходное «красивый»; piękny — это уже «прекрасный»."
    examples:
      - pl: "Jakie ładne dziecko!"
        ru: "Какой красивый ребёнок!"
        source: { kind: tatoeba, id: 3461138 }
      - pl: "Masz bardzo ładne mieszkanie."
        ru: "У тебя очень красивая квартира."
        source: { kind: tatoeba, id: 5993166 }
      - pl: "Ładny strój."
        ru: "Красивый наряд."
        source: { kind: translated, id: 1112420 }
  - id: nice-weather
    ru: "ładna pogoda — хорошая погода"
    note: "О погоде ładny значит «ясный, хороший»."
    examples:
      - pl: "Pogoda jest ładna."
        ru: "Погода прекрасная."
        source: { kind: tatoeba, id: 7725979 }
      - pl: "Bardzo ładna dziś pogoda."
        ru: "Сегодня очень хорошая погода."
        source: { kind: tatoeba, id: 1845001 }
      - pl: "Przy ładnej pogodzie widać stąd górę Fudżi."
        ru: "В хорошую погоду отсюда видно Фудзи."
        source: { kind: translated, id: 367315 }
  - id: prettier
    ru: "ładniejszy — красивее"
    note: "Степени правильные: ładny — ładniejszy — najładniejszy."
    examples:
      - pl: "Jest coraz ładniejsza."
        ru: "Она становится всё красивее."
        source: { kind: translated, id: 364370 }
      - pl: "Philip jest ładniejszy niż ty."
        ru: "Филипп красивее тебя."
        source: { kind: translated, id: 1463522 }
      - pl: "Bożena jest piękną blondynką, to najładniejsza dziewczyna w naszej szkole."
        ru: "Божена — красивая блондинка, самая красивая девушка в нашей школе."
        source: { kind: translated, id: 3002157 }
notes:
  - { kind: usage, text: "Обиходное слово для «красивый»: ładna sukienka, ładny krawat. Сильнее него piękny «прекрасный», слабее — niebrzydki «недурной»." }
  - { kind: usage, text: "О погоде значит «хороший, ясный»: ładna pogoda, przy ładnej pogodzie «в хорошую погоду»." }
  - { kind: usage, text: "Степени правильные: ładny — ładniejszy — najładniejszy; мужское личное во множественном — ładni." }
  - { kind: usage, text: "Наречие — ładnie «красиво»: ładnie wygląda «хорошо выглядит». Поговорка Ładnemu we wszystkim ładnie — «красивому всё к лицу»." }
collocations:
  - { pl: "ładna pogoda", ru: "хорошая погода" }
  - { pl: "ładna dziewczyna", ru: "красивая девушка" }
  - { pl: "ładnie wygląda", ru: "хорошо выглядит" }
  - { pl: "najładniejszy", ru: "самый красивый" }
family:
  - { pl: "ładnie", ru: "красиво", relation: derived }
  - { pl: "ładność", ru: "миловидность", relation: derived }
  - { pl: "piękny", ru: "прекрасный", relation: derived }
etymology: "От ład «порядок, лад» — буквально «ладный, складный». Русское «ладный» от того же корня, только в польском оно стало обиходным словом для «красивый»."
memory: "ładny — «красивый», и это обиходное слово: ładna sukienka, ładny krawat. Сильнее него piękny «прекрасный». О погоде значит «хороший, ясный»: ładna pogoda, przy ładnej pogodzie. Степени правильные: ładny — ładniejszy — najładniejszy, мужское личное множественное — ładni. Корень тот же, что в русском «ладный», а наречие — ładnie."
idioms:
  - { pl: "ładna pogoda", ru: "хорошая погода" }
  - { pl: "ładnie wygląda", ru: "хорошо выглядит" }
  - { pl: "Ładnemu we wszystkim ładnie", ru: "Красивому всё к лицу" }
