# review
id: wlos
format: 2
lemma: "włos"
rank: 1362
pos: noun
pron: { cyr: "вуо́с" }
senses:
  - id: single-hair
    ru: "волос (один)"
    examples:
      - pl: "Oto pierwszy siwy włos na mojej głowie."
        ru: "Вот первый седой волос на моей голове."
        source: { kind: tatoeba, id: 1357093 }
      - pl: "W mojej zupie jest włos."
        ru: "У меня в супе волос."
        source: { kind: translated, id: 356960 }
  - id: hair
    ru: "во множественном числе — волосы (в том числе как причёска и «голова»)"
    examples:
      - pl: "Masz piękne włosy."
        ru: "У тебя красивые волосы."
        source: { kind: tatoeba, id: 3656147 }
      - pl: "Ona ma krótkie włosy."
        ru: "У неё короткие волосы."
        source: { kind: tatoeba, id: 591383 }
      - pl: "Nie umyłem swoich włosów."
        ru: "Я не помыл голову."
        source: { kind: tatoeba, id: 2809339 }
notes:
  - { kind: usage, text: "Единственное włos — «один волос», множественное włosy — «волосы» как целое. «Мыть голову» по-польски myć włosy, буквально «мыть волосы»." }
  - { kind: usage, text: "o włos, o mały włos — «чуть-чуть, на волосок»: O włos uniknął wypadku «Он чудом избежал аварии»." }
  - { kind: usage, text: "dzielić włos na czworo — буквально «делить волос на четверо», то есть придираться к мелочам." }
  - { kind: false-friend, text: "Не путайте włos «волос» с włoski «итальянский» и Włochy «Италия» — созвучие чисто случайное." }
collocations:
  - { pl: "myć włosy", ru: "мыть голову" }
  - { pl: "długie włosy", ru: "длинные волосы" }
  - { pl: "o mały włos", ru: "чуть не, на волосок" }
etymology: "Праславянское *volsъ. Русское «волос» сохранило полногласие -оло-, а польское włos его стянуло — та же пара, что «молоко» и mleko, «голова» и głowa."
memory: "włos — «волос», и родство видно, если помнить про стяжение: «во-ло-с» даёт włos, как «молоко» даёт mleko. Единственное число — один волос, а «волосы» и бытовое «голова» — это włosy: myć włosy значит «мыть голову»."
idioms:
  - { pl: "o mały włos", ru: "чуть не, на волосок" }
  - { pl: "dzielić włos na czworo", ru: "придираться к мелочам" }
  - { pl: "ani na włos", ru: "ни на волос" }
formExamplesSkip:
  - { form: "włosie", cell: "Звательный", reason: "звательный падеж: для неодушевлённого существительного он практически не употребляется" }
