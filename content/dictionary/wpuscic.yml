notes:
  - { kind: usage, text: "Самое полезное наблюдение о формах. Чередование ść → szcz идёт НЕ по всей парадигме, а по отдельным клеткам: szcz стоит в первом лице (wpuszczę), в третьем лице множественного (wpuszczą), во всех страдательных формах (wpuszczony) и в отглагольном существительном (wpuszczenie). А ść держится в wpuścisz, wpuści, wpuścimy, wpuścicie и во всём прошедшем времени. Если распространить любой из двух вариантов на всю парадигму, половина форм окажется неверной." }
  - { kind: government, text: "Куда впускают — предлог DO с РОДИТЕЛЬНЫМ: wpuścić do domu, do środka, do pokoju. Русский здесь берёт винительный с «в» («впустить в дом»), так что предлог и падеж приходится менять. Если речь о поверхности или открытом месте, служит NA с винительным: wpuścić na podwórko, na salę." }
  - { kind: false-friend, text: "Ловушки в значении нет: w- плюс puścić отвечает русскому «в-» плюс «пустить», праславянское *pustiti. Из того же гнезда wypuścić «выпустить», dopuścić «допустить», przepuścić «пропустить» и puścić «пустить» — приставки работают так же, как в русском." }
collocations:
  - { pl: "wpuścić do domu", ru: "впустить в дом" }
  - { pl: "wpuścić świeże powietrze", ru: "впустить свежий воздух" }
  - { pl: "nie wpuścić bez biletu", ru: "не впустить без билета" }
family:
  - { pl: "puścić", ru: "пустить", relation: root, id: puscic }
  - { pl: "wypuścić", ru: "выпустить", relation: derived, id: wypuscic }
  - { pl: "wpuszczać", ru: "впускать", relation: aspect }
etymology: "Приставка w- плюс puścić, праславянское *pustiti «пустить, отпустить», от *pustъ «пустой». Русское «впустить» собрано из тех же частей, поэтому слова совпадают полностью. Приставочное гнездо тоже параллельно русскому: wypuścić «выпустить», dopuścić «допустить», opuścić «опустить, покинуть»."
memory: "wpuścić — «впустить», w- + puścić, часть в часть. Запомните две вещи: впускают DO domu (родительный, не «в дом» в винительном), и чередование ść/szcz сидит только в отдельных формах — wpuszczę, но wpuścisz."
idioms:
