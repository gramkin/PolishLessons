# review
id: poszukac
format: 2
lemma: "poszukać"
rank: 1334
pos: verb
aspect: perf
aspectPair: szukac
pron: { cyr: "пошу́каць" }
senses:
  - id: search
    ru: "поискать, поискать немного"
    examples:
      - pl: "Muszę poszukać długopisu."
        ru: "Мне нужно поискать ручку."
        source: { kind: translated, id: 369257 }
      - pl: "Jestem głodny, pójdę więc poszukać czegoś do jedzenia."
        ru: "Я голоден, так что пойду поищу чего-нибудь поесть."
        source: { kind: translated, id: 1842994 }
      - pl: "Dziewczyna poszła do lasu, żeby poszukać grzybów."
        ru: "Девочка пошла в лес поискать грибов."
        source: { kind: translated, id: 3026102 }
  - id: look-up
    ru: "poszukać w słowniku — посмотреть в словаре"
    examples:
      - pl: "Jeśli nie znasz znaczenia słowa, poszukaj w słowniku."
        ru: "Если не знаешь значения слова, поищи в словаре."
        source: { kind: tatoeba, id: 12565047 }
      - pl: "Poszukaj tego słowa w słowniku."
        ru: "Поищи это слово в словаре."
        source: { kind: translated, id: 359229 }
      - pl: "Proszę samodzielnie poszukać tego wyrazu w słowniku."
        ru: "Пожалуйста, посмотрите это слово в словаре сами."
        source: { kind: translated, id: 831759 }
  - id: imperative
    ru: "poszukaj! — поищи!"
    examples:
      - pl: "Poszukaj w torbie."
        ru: "Поищи в сумке."
        source: { kind: translated, id: 12936656 }
      - pl: "Idź i go poszukaj."
        ru: "Иди и поищи его."
        source: { kind: translated, id: 4740492 }
      - pl: "Poszukam jej."
        ru: "Я её поищу."
        source: { kind: translated, id: 8948456 }
notes:
  - { kind: government, text: "poszukać czegoś «поискать что-то» требует родительного падежа, как и szukać: poszukać grzybów, poszukać pracy." }
  - { kind: usage, text: "Poszukaj w słowniku — «посмотри в словаре», стандартный совет на уроке." }
  - { kind: usage, text: "Вид совершенный; несовершенный — szukać, карточка уже есть. Приставка po- добавляет оттенок «немного, некоторое время»." }
  - { kind: usage, text: "Для длительного и целенаправленного поиска есть отдельный глагол poszukiwać: poszukiwany «разыскиваемый»." }
collocations:
  - { pl: "poszukać w słowniku", ru: "посмотреть в словаре" }
  - { pl: "poszukać pracy", ru: "поискать работу" }
  - { pl: "poszukaj", ru: "поищи" }
etymology: "Приставка po- и szukać «искать». Русское «поискать» собрано ровно так же, и приставка добавляет тот же оттенок «немного, некоторое время»."
memory: "poszukać — «поискать», совершенный вид от szukać, и требует родительного падежа: poszukać pracy. Poszukaj w słowniku «посмотри в словаре» — стандартный совет. Приставка po- значит «немного»."
