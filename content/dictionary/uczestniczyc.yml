pron: { cyr: "учэстни́чыць" }
senses:
  - id: take-part
    ru: "участвовать, принимать участие"
    examples:
      - pl: "Uczestniczę w kursie polskiego."
        ru: "Я участвую в курсе польского."
        source: { kind: authored }
      - pl: "W konferencji uczestniczyło stu naukowców."
        ru: "В конференции участвовали сто учёных."
        source: { kind: authored }
      - pl: "Czy uczestniczysz w wyborach?"
        ru: "Ты участвуешь в выборах?"
        source: { kind: authored }
  - id: attend
    ru: "присутствовать (на церемонии, событии)"
    examples:
      - pl: "Uczestniczyliśmy w ślubie przyjaciół."
        ru: "Мы были на свадьбе друзей."
        source: { kind: authored }
      - pl: "Cała rodzina uczestniczyła w pogrzebie."
        ru: "Вся семья присутствовала на похоронах."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "UCZESTNICZYĆ — «участвовать»: корень CZĘŚĆ «часть», как в русском «участь», «участие». Управление совпадает с русским: UCZESTNICZYĆ W ZEBRANIU «участвовать в собрании». Ловушка — в выборе слова: о событиях вроде свадьбы по-польски тоже UCZESTNICZYĆ, где по-русски скажут «быть на»." }
  - { kind: usage, text: "Несовершенный вид, пары нет. Синоним — BRAĆ UDZIAŁ «принимать участие», более разговорный. Повелительное UCZESTNICZ и отглагольное существительное (вместо него говорят UCZESTNICTWO) в карточку не включены." }
  - { kind: government, text: "В чём — W с предложным: UCZESTNICZYĆ W ZAJĘCIACH, W KONKURSIE, W ŻYCIU SZKOŁY. При числительном глагол стоит в среднем роде: UCZESTNICZYŁO STO OSÓB «участвовало сто человек»." }
  - { kind: pronunciation, text: "Читается «учэстни́чыць»: сочетание STN произносится полностью, T слышно. CZ — твёрдое «ч», ударение на предпоследнем слоге. UCZESTNICZĘ — «учэстни́чэ»." }
  - { kind: register, text: "Книжно-нейтральное слово: школа, работа, официальные объявления. В разговоре чаще BYĆ NA: BYŁEM NA WESELU «я был на свадьбе»." }
collocations:
  - { pl: "uczestniczyć w zajęciach", ru: "посещать занятия" }
  - { pl: "uczestniczyć w wyborach", ru: "участвовать в выборах" }
  - { pl: "aktywnie uczestniczyć", ru: "активно участвовать" }
family:
  - { pl: "uczestnik", ru: "участник", relation: derived }
  - { pl: "udział", ru: "участие, доля", relation: root, id: udzial }
  - { pl: "część", ru: "часть", relation: root, id: czesc-noun }
etymology: "От UCZESTNIK «участник», а оно от CZĘŚĆ «часть» через старопольское UCZĘSTNIK: «имеющий долю». Русское «участник», «участие» — тот же корень."
memory: "Uczestniczyć w czymś — участвовать в чём-то: uczestniczę w kursie. Корень część «часть», как в «участии»."
idioms:
  - { pl: "uczestniczyć w życiu kogoś", ru: "участвовать в чьей-то жизни" }
