id: sekret
format: 2
lemma: "sekret"
rank: 1188
pos: noun
pron: { cyr: "сэ́крэт" }
senses:
  - id: secret
    ru: "секрет, тайна"
    examples:
      - pl: "Znam twój sekret."
        ru: "Я знаю твой секрет."
        source: { kind: tatoeba, id: 6328165 }
      - pl: "To był nasz sekret."
        ru: "Это был наш секрет."
        source: { kind: tatoeba, id: 6688764 }
      - pl: "To sekret."
        ru: "Это секрет."
        source: { kind: translated, id: 569872 }
  - id: in-secret
    ru: "w sekrecie — в секрете, тайно"
    examples:
      - pl: "Trzymają to w sekrecie."
        ru: "Они держат это в секрете."
        source: { kind: translated, id: 13655470 }
      - pl: "Proszę, trzymaj to w sekrecie."
        ru: "Пожалуйста, держи это в секрете."
        source: { kind: translated, id: 560512 }
      - pl: "Spotkaliśmy się w sekrecie."
        ru: "Мы встретились тайно."
        source: { kind: translated, id: 6554267 }
notes:
  - { kind: usage, text: "Главный оборот — trzymać coś w sekrecie «держать что-то в секрете»: предлог w с предложным падежом, форма sekrecie." }
  - { kind: pronunciation, text: "Ударение польское, на первый слог: sékret. Русское «секре́т» ударяется на второй, и это самая частая ошибка." }
  - { kind: register, text: "Рядом живёт исконно славянское tajemnica «тайна». Sekret — заимствование и звучит обиходнее, tajemnica шире и торжественнее." }
collocations:
  - { pl: "trzymać w sekrecie", ru: "держать в секрете" }
  - { pl: "zdradzić sekret", ru: "выдать секрет" }
  - { pl: "w sekrecie", ru: "тайно, по секрету" }
etymology: "Из латинского secretus «отделённый, тайный» через западноевропейские языки — тот же источник, что и русское «секрет»."
memory: "sekret — «секрет», но ударение польское, на первый слог: sékret, а не «секре́т». Ключевой оборот — trzymać w sekrecie «держать в секрете». Более торжественный синоним — tajemnica."
idioms:
