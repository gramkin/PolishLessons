# review
id: podgrodzie
format: 2
lemma: "podgrodzie"
rank: 5850
pos: noun
pron: { cyr: "подгро́дзе" }
senses:
  - id: suburb
    ru: "посад, поселение у стен града (ист.)"
    examples:
      - pl: "Rzemieślnicy mieszkali na podgrodziu."
        ru: "Ремесленники жили на посаде."
        source: { kind: authored }
      - pl: "Podgrodzie otaczało gród z trzech stron."
        ru: "Посад окружал град с трёх сторон."
        source: { kind: authored }
      - pl: "Archeolodzy odkopali na podgrodziu ślady kuźni."
        ru: "Археологи раскопали на посаде следы кузницы."
        source: { kind: authored }
      - pl: "Miasto wyrosło z dawnego podgrodzia."
        ru: "Город вырос из старого посада."
        source: { kind: authored }
      - pl: "W czasie najazdu ludność podgrodzia chroniła się w grodzie."
        ru: "Во время набега жители посада укрывались в граде."
        source: { kind: authored }
notes:
  - { kind: register, text: "Термин историков и археологов. Раннесредневековый GRÓD — укреплённый град князя или кастеляна, а PODGRODZIE — открытое поселение у его стен, где жили ремесленники и торговцы; из таких посадов выросли многие польские города. Синонимы — PODZAMCZE, PRZYGRODZIE." }
  - { kind: usage, text: "Средний род, как POLE: PODGRODZIE — PODGRODZIA — W PODGRODZIU. Жить на посаде — MIESZKAĆ NA PODGRODZIU, с предлогом NA, как и в русском «на посаде». Родительный множественного — PODGRODZI." }
  - { kind: pronunciation, text: "Читается «подгро́дзе»: DZI — мягкое «дзь», ударение на предпоследнем слоге. D перед G остаётся звонким." }
collocations:
  - { pl: "na podgrodziu", ru: "на посаде" }
  - { pl: "gród z podgrodziem", ru: "град с посадом" }
  - { pl: "mieszkańcy podgrodzia", ru: "жители посада" }
family:
  - { pl: "gród", ru: "град, укреплённое поселение", relation: root }
  - { pl: "grodzisko", ru: "городище", relation: root }
  - { pl: "grodowy", ru: "градский", relation: derived }
etymology: "POD- «под» + GRÓD «град» + суффикс -E: «то, что под градом». Слово построено так же, как русское «Подмосковье»."
memory: "Pod + gród — подгродзе, «под градом»: посад у стен крепости, как Подмосковье у Москвы."
idioms:
  - { pl: "gród z podgrodziem", ru: "град с посадом, единый раннесредневековый комплекс" }
