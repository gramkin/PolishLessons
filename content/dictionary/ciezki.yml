# review
id: ciezki
format: 2
lemma: "ciężki"
rank: 366
pos: adj
pron: { cyr: "це́ншки" }
senses:
  - id: heavy
    ru: "тяжёлый (по весу)"
    examples:
      - pl: "Ten stół jest ciężki."
        ru: "Этот стол тяжёлый."
        source: { kind: tatoeba, id: 1085493 }
      - pl: "Ta książka jest ciężka."
        ru: "Эта книга тяжёлая."
        source: { kind: tatoeba, id: 504827 }
      - pl: "Ten stół jest bardzo ciężki."
        ru: "Этот стол очень тяжёлый."
        source: { kind: tatoeba, id: 4657043 }
  - id: hard
    ru: "тяжёлый, трудный (о жизни, работе, временах)"
    examples:
      - pl: "Miała ciężkie życie."
        ru: "У неё была тяжёлая жизнь."
        source: { kind: tatoeba, id: 730386 }
      - pl: "Jestem zmęczony ciężką pracą."
        ru: "Я устал от тяжёлой работы."
        source: { kind: translated, id: 362842 }
      - pl: "To był ciężki rok."
        ru: "Это был тяжёлый год."
        source: { kind: authored }
  - id: grave
    ru: "тяжёлый (о состоянии, болезни)"
    examples:
      - pl: "Ofiara jest w bardzo ciężkim stanie."
        ru: "Пострадавший в очень тяжёлом состоянии."
        source: { kind: translated, id: 11502784 }
      - pl: "Przeszedł ciężką grypę."
        ru: "Он перенёс тяжёлый грипп."
        source: { kind: authored }
      - pl: "Jego stan jest ciężki."
        ru: "Его состояние тяжёлое."
        source: { kind: authored }
notes:
  - { kind: usage, text: "ciężki покрывает ровно то же поле, что русское «тяжёлый»: и вес (ciężka walizka), и трудность (ciężkie czasy), и болезнь (ciężki stan)." }
  - { kind: usage, text: "Наречие — ciężko: Ciężko mi «Мне тяжело», ciężko pracować «тяжело работать»." }
  - { kind: usage, text: "Степени сравнения с чередованием żk → ższ: ciężki → cięższy → najcięższy." }
  - { kind: false-friend, text: "О человеке ciężki значит «трудный в общении», а не «грузный»: ciężki charakter «тяжёлый характер»." }
collocations:
  - { pl: "ciężka praca", ru: "тяжёлая работа" }
  - { pl: "ciężkie czasy", ru: "тяжёлые времена" }
  - { pl: "ciężki stan", ru: "тяжёлое состояние" }
  - { pl: "ciężka walizka", ru: "тяжёлый чемодан" }
etymology: "Праславянское *tęžьkъ от корня *tęg- «тянуть»; мягкое t дало польское ć, а носовое ę стоит на месте русского «я» — ciężki это и есть «тяжкий»."
memory: "ciężki — «тяжёлый». Разверните по звукам: ć на месте мягкого «т», ę на месте «я» — получается «тяжкий». Наречие ciężko: Ciężko mi. Степени меняют корень: ciężki → cięższy → najcięższy."
idioms:
  - { pl: "ciężki jak ołów", ru: "тяжёлый как свинец" }
  - { pl: "ciężki kawałek chleba", ru: "нелёгкий заработок" }
  - { pl: "mieć ciężką nogę", ru: "гонять, давить на газ (о водителе)" }
