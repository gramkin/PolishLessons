  - id: address
    ru: "юноша (как обращение)"
    examples:
      - pl: "Młodzieńcze, baw się, pókiś młody!"
        ru: "Юноша, веселись, пока молод!"
        source: { kind: translated, id: 635907 }
      - pl: "Tom jest naprawdę dobrze wychowanym młodzieńcem."
        ru: "Том — действительно хорошо воспитанный юноша."
        source: { kind: translated, id: 7184769 }
notes:
  - { kind: usage, text: "Слово книжное и чуть старомодное. Нейтрально скажут młody człowiek или chłopak." }
  - { kind: government, text: "Мужско-личный род: винительный совпадает с родительным — widzę młodzieńca «вижу юношу»." }
  - { kind: usage, text: "Звательная форма młodzieńcze живёт как обращение: Młodzieńcze! «Юноша!»" }
  - { kind: false-friend, text: "Корень młody — это русское «молодой», а суффикс -eniec тот же, что в «юнец», «молодец»." }
collocations:
  - { pl: "przystojny młodzieniec", ru: "красивый юноша" }
  - { pl: "młodzieniec z sąsiedztwa", ru: "юноша по соседству" }
etymology: "От młody «молодой» с суффиксом -eniec; ср. русское «молодец», «юнец»."
memory: "młodzieniec — книжное «юноша». Корень młody = «молодой». Обращение звучит как Młodzieńcze! — это звательная форма, которой в русском уже нет."
idioms:
  - { pl: "młodzieniec w kwiecie wieku", ru: "юноша в расцвете сил" }
