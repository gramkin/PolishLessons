# review
id: przykro
format: 2
lemma: "przykro"
rank: 271
pos: adv
pron: { cyr: "пшы́кро" }
senses:
  - id: sorry
    ru: "przykro mi — мне жаль, сожалею"
    note: "Главная формула сочувствия и вежливого отказа."
    examples:
      - pl: "Przykro mi, ale Tom ma rację."
        ru: "Мне жаль, но Том прав."
        source: { kind: tatoeba, id: 3695174 }
      - pl: "Przykro mi, nie mogę ci pomóc."
        ru: "К сожалению, я не могу тебе помочь."
        source: { kind: tatoeba, id: 2671274 }
      - pl: "Przykro mi, że tak długo do ciebie nie pisałem."
        ru: "Мне жаль, что я так долго тебе не писал."
        source: { kind: tatoeba, id: 2148526 }
  - id: unpleasant
    ru: "неприятно, обидно"
    examples:
      - pl: "Było jej przykro, że nikt jej nie zauważył."
        ru: "Ей было обидно, что никто не обратил на неё внимания."
        source: { kind: tatoeba, id: 349631 }
      - pl: "Jest nam bardzo przykro, ale nie możemy spełnić Pańskiej prośby."
        ru: "Нам очень жаль, но мы не можем выполнить вашей просьбы."
        source: { kind: tatoeba, id: 4725794 }
      - pl: "Zrobiło mi się przykro."
        ru: "Мне стало обидно."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Przykro mi — то, что чаще всего слышишь вместо «Мне жаль» и «К сожалению»: Przykro mi, nie mogę «Сожалею, не могу»." }
  - { kind: usage, text: "Конструкция безличная, с дательным падежом: przykro mi, przykro nam, było jej przykro." }
  - { kind: usage, text: "От прилагательного przykry «неприятный»; существительное przykrość значит «неприятность»." }
collocations:
  - { pl: "przykro mi", ru: "мне жаль" }
  - { pl: "bardzo mi przykro", ru: "мне очень жаль" }
  - { pl: "zrobiło się przykro", ru: "стало обидно" }
  - { pl: "sprawić przykrość", ru: "причинить неприятность" }
etymology: "От przykry «неприятный, тягостный»; тот же корень виден в чешском příkrý «крутой, резкий»."
memory: "Przykro mi — «Мне жаль». Это главная формула сочувствия и вежливого отказа: Przykro mi, nie mogę ci pomóc."
idioms:
