# review
id: przyjemny
format: 2
lemma: "przyjemny"
rank: 2727
pos: adj
pron: { cyr: "пшые́мны" }
senses:
  - id: pleasant
    ru: "приятный"
    examples:
      - pl: "To był przyjemny wieczór."
        ru: "Это был приятный вечер."
        source: { kind: authored }
      - pl: "Przyjemna niespodzianka czekała na stole."
        ru: "Приятная неожиданность ждала на столе."
        source: { kind: authored }
      - pl: "To najprzyjemniejszy dzień tego lata."
        ru: "Это самый приятный день этого лета."
        source: { kind: authored }
  - id: agreeable
    ru: "приятный в общении"
    examples:
      - pl: "Jest przyjemny w obejściu."
        ru: "Он приятен в общении."
        source: { kind: authored }
      - pl: "Sąsiedzi są przyjemni i cisi."
        ru: "Соседи приятные и тихие."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Тридцать три формы, все три степени, и это нарочный контраст с krewny и wieczny из той же подборки, у которых их одиннадцать. Приятность градуируется легко: przyjemniejszy, najprzyjemniejszy. Родство и вечность не градуируются вовсе, а fizyczny и mokry не градуируются каждый по своей причине. Число форм, таким образом, следует из значения, а не наоборот." }
  - { kind: usage, text: "Слово построено от PRZYJĄĆ «принять», из праславянского *prijęti, и мысль в нём та же, что в русском «приятный»: приятно то, что принимается охотно. Образование совпадает до суффикса, поэтому пара przyjemny и «приятный» переносится напрямую, как и существительное PRZYJEMNOŚĆ «удовольствие» — z przyjemnością значит «с удовольствием»." }
collocations:
  - { pl: "przyjemny wieczór", ru: "приятный вечер" }
  - { pl: "przyjemna niespodzianka", ru: "приятная неожиданность" }
  - { pl: "z przyjemnością", ru: "с удовольствием" }
family:
  - { pl: "przyjemność", ru: "удовольствие", relation: derived }
  - { pl: "przyjąć", ru: "принять", relation: root, id: przyjac }
  - { pl: "nieprzyjemny", ru: "неприятный", relation: antonym }
etymology: "От PRZYJĄĆ «принять», из праславянского *prijęti. Приятное есть то, что принимают охотно, и русское «приятный» построено из тех же частей и той же мыслью — от старого «приять». Совпадение здесь полное, вплоть до суффикса, а существительное przyjemność отвечает нашему «удовольствию» и «приятности» сразу."
memory: "Тридцать три формы, в отличие от одиннадцати у krewny и wieczny: приятность бывает большей и меньшей. А корень тот же, что в «принять»."
idioms:
  - { pl: "z przyjemnością", ru: "с удовольствием" }
  - { pl: "przyjemny w obejściu", ru: "приятный в общении" }
