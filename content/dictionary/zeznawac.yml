notes:
  - { kind: pronunciation, text: "Настоящее время у этого глагола не такое, как ждёшь по инфинитиву: ZEZNAWAĆ даёт ZEZNAJĘ, ZEZNAJESZ, ZEZNAJE — основа теряет -WA- и получает -J-. Это тот самый класс на -AWAĆ, который разбирался в примечании к карточке KARMIĆ: DAWAĆ даёт DAJE, SPRZEDAWAĆ даёт SPRZEDAJE, ZEZNAWAĆ даёт ZEZNAJE. И повелительное идёт не от настоящего, а от инфинитива: ZEZNAWAJ, а не ZEZNAJ, потому что ZEZNAJ принадлежит совершенному ZEZNAĆ." }
  - { kind: usage, text: "Это юридический термин, и в быту он почти не встречается. ZEZNAWAĆ значит «давать показания» — в суде, в полиции, под присягой; существительное ZEZNANIE значит «показание», а ZEZNANIE PODATKOWE — «налоговая декларация», что стоит знать отдельно. Совершенная пара — ZEZNAĆ, и она описывает отдельное высказывание: ZEZNAŁ, ŻE NIE BYŁ NA MIEJSCU. Русское «сознаваться» похоже по виду, но значит другое: это PRZYZNAWAĆ SIĘ, то есть признавать свою вину." }
  - { kind: government, text: "Перед кем — предлог PRZED с творительным: ZEZNAWAĆ PRZED SĄDEM, PRZED PROKURATOREM. Против кого — PRZECIWKO с творительным: PRZECIWKO MĘŻOWI, PRZECIWKO SOBIE. Как — предлог POD с творительным: POD PRZYSIĘGĄ. Содержание показаний идёт союзом ŻE: ZEZNAWAŁ, ŻE NIKOGO NIE WIDZIAŁ. В пользу кого — NA KORZYŚĆ с родительным." }
  - { kind: false-friend, text: "Корень здесь тот же, что в ZNAĆ «знать», и приставка ze- отвечает русской «со-», так что по частям слово читается как «со-знавать». Но значение сошлось не с русским «сознаваться», а с «показывать» в судебном смысле: сообщать суду то, что знаешь. Признание же вины — это PRZYZNAĆ SIĘ DO WINY. Разница существенная: ZEZNAWAĆ может и невиновный свидетель, PRZYZNAWAĆ SIĘ — только тот, кто берёт вину на себя." }
collocations:
  - { pl: "zeznawać przed sądem", ru: "давать показания в суде" }
  - { pl: "zeznawać pod przysięgą", ru: "давать показания под присягой" }
  - { pl: "zeznanie podatkowe", ru: "налоговая декларация" }
family:
  - { pl: "zeznać", ru: "дать показания", relation: aspect }
  - { pl: "zeznanie", ru: "показание", relation: derived, id: zeznanie }
  - { pl: "znać", ru: "знать", relation: root, id: znac }
etymology: "Приставка ze- (из z-, «со-») и ZNAWAĆ, многократная форма от ZNAĆ, из праславянского *znati — то же слово, что русское «знать». По частям получается «со-знавать», то есть сообщать то, что знаешь, и польский закрепил это за судебным показанием. Русский от того же корня и той же приставки произвёл «сознаваться», но увёл смысл к признанию вины, а показание назвал другим словом. Отсюда и ZEZNANIE «показание», и ZEZNANIE PODATKOWE «декларация» — буквально то, что ты сообщаешь государству о себе."
memory: "zeznawać — «давать показания», не «сознаваться»: сознаваться в вине — przyznać się. И настоящее время по классу -awać: zeznaję, как dawać → daję."
idioms:
  - { pl: "zeznawać pod przysięgą", ru: "давать показания под присягой" }
  - { pl: "zeznanie podatkowe", ru: "налоговая декларация" }
formExamplesSkip:
  - { form: "zeznawani", reason: "Страдательное причастие мужского лица множественного числа, а дополнением у этого глагола бывает только содержание показаний: ZEZNAWAĆ PRAWDĘ, ZEZNAWAĆ, ŻE… Человек прямым дополнением тут не бывает никогда — против кого-то показывают с предлогом, ZEZNAWAĆ PRZECIWKO KOMUŚ, — поэтому у мужско-личной страдательной формы нет и не может быть подлежащего. Остальные формы причастия в карточке есть с примерами: WERSJA ZEZNAWANA PRZEZ ŚWIADKA, OKOLICZNOŚCI ZEZNAWANE POD PRZYSIĘGĄ." }
