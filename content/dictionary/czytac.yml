# review
id: czytac
format: 2
lemma: "czytać"
rank: 525
pos: verb
aspect: imperf
pron: { cyr: "чы́таць" }
senses:
  - id: read
    ru: "читать (что-л. — винительный, как в русском)"
    note: "Прямое дополнение в винительном: czytam książkę."
    examples:
      - pl: "Lubię czytać."
        ru: "Я люблю читать."
        source: { kind: tatoeba, id: 599052 }
      - pl: "Czytam książki."
        ru: "Я читаю книги."
        source: { kind: tatoeba, id: 2183390 }
      - pl: "Co czytasz?"
        ru: "Что ты читаешь?"
        source: { kind: tatoeba, id: 356413 }
  - id: read-that
    ru: "читать о чём-л., узнавать из прочитанного"
    note: "С придаточным: czytałem, że… «я читал, что…»."
    examples:
      - pl: "Czytałem, że prezydentem Brazylii jest kobieta. Ona nazywa się Dilma."
        ru: "Я читал, что президент Бразилии — женщина. Её зовут Дилма."
        source: { kind: tatoeba, id: 1443429 }
      - pl: "Przestał czytać gazetę."
        ru: "Он перестал читать газету."
        source: { kind: tatoeba, id: 1850875 }
      - pl: "Czytałeś ten artykuł?"
        ru: "Ты читал эту статью?"
        source: { kind: translated, id: 393041 }
  - id: be-read
    ru: "czytany — читаемый, который читают"
    note: "Страдательное причастие: szeroko czytany «широко читаемый»."
    examples:
      - pl: "Żadna książka nie jest tak szeroko czytana jak Biblia."
        ru: "Ни одна книга не читается так широко, как Библия."
        source: { kind: translated, id: 792199 }
      - pl: "Ten romans był bardzo szeroko czytany."
        ru: "Этот роман был очень широко читаем."
        source: { kind: translated, id: 732995 }
      - pl: "Biblia jest najczęściej przekładaną i czytaną książką świata."
        ru: "Библия — самая переводимая и читаемая книга в мире."
        source: { kind: translated, id: 1450534 }
notes:
  - { kind: government, text: "Управление совпадает с русским: czytać coś — винительный падеж, czytam książkę «читаю книгу». Ловушки здесь нет." }
  - { kind: usage, text: "Совершенный вид — przeczytać «прочитать»: przeczytałem całą książkę." }
  - { kind: usage, text: "Устойчивые пары: czytać na głos «читать вслух» и czytać w myślach «читать про себя»; czytać komuś w myślach — «читать чьи-то мысли»." }
  - { kind: usage, text: "Отглагольное существительное czytanie «чтение» очень частое: mam mało czasu na czytanie." }
collocations:
  - { pl: "czytać książkę", ru: "читать книгу" }
  - { pl: "czytać na głos", ru: "читать вслух" }
  - { pl: "czytać w myślach", ru: "читать про себя" }
  - { pl: "umieć czytać", ru: "уметь читать" }
family:
  - { pl: "przeczytać", ru: "прочитать", relation: derived }
  - { pl: "czytanie", ru: "чтение", relation: derived }
  - { pl: "czytelnik", ru: "читатель", relation: derived }
etymology: "От праславянского *čitati «считать, читать» — то же слово, что русское «читать»; родственно польскому liczyć «считать»."
memory: "czytać — «читать», и здесь, в отличие от многих польских глаголов, всё как в русском: прямое дополнение в винительном, czytam książkę. Совершенный вид — przeczytać. Запомните пару: czytać na głos «читать вслух» и czytać w myślach «читать про себя», а czytać komuś w myślach — уже «читать чьи-то мысли». Существительное — czytanie «чтение», человек — czytelnik «читатель»."
idioms:
  - { pl: "czytać na głos", ru: "читать вслух" }
  - { pl: "czytać w myślach", ru: "читать про себя" }
  - { pl: "czytać między wierszami", ru: "читать между строк" }
