senses:
  - id: sponsor
    ru: "спонсор"
    examples:
      - pl: "Głównym sponsorem festiwalu jest bank."
        ru: "Главный спонсор фестиваля — банк."
        source: { kind: authored }
      - pl: "Drużyna szuka nowego sponsora."
