        source: { kind: authored }
  - id: backer
    ru: "покровитель, поручитель"
    examples:
      - pl: "Bez sponsora nie wydałby płyty."
        ru: "Без покровителя он не выпустил бы альбом."
        source: { kind: authored }
      - pl: "Rodzice są jej jedynym sponsorem."
        ru: "Родители — её единственный спонсор."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "SPONSOR — «спонсор», как в русском. Меценат искусства — MECENAS, а жертвователь — DARCZYŃCA. Спонсировать — SPONSOROWAĆ. В шутку родители — SPONSORZY: «спонсоры» студента." }
  - { kind: usage, text: "Десять форм, мужской род, лицо. Множественное — SPONSORZY: R переходит в RZ. Местный и звательный — SPONSORZE. О фирме тоже говорят как о лице: SPONSORZY." }
  - { kind: government, text: "Спонсор чего — SPONSOR и родительный: SPONSOR TURNIEJU. Найти спонсора — ZNALEŹĆ SPONSORA, винительный совпадает с родительным. Благодаря спонсорам — DZIĘKI SPONSOROM." }
  - { kind: pronunciation, text: "Читается «спо́нсор», ударение на первом слоге. SPONSORZE — «спонсо́жэ», SPONSORZY — «спонсо́жы»." }
collocations:
  - { pl: "główny sponsor", ru: "генеральный спонсор" }
  - { pl: "szukać sponsora", ru: "искать спонсора" }
  - { pl: "sponsor tytularny", ru: "титульный спонсор" }
family:
  - { pl: "sponsorować", ru: "спонсировать", relation: derived }
  - { pl: "reklama", ru: "реклама", relation: root, id: reklama }
  - { pl: "mecenas", ru: "меценат; адвокат", relation: root }
etymology: "Из латинского SPONSOR «поручитель», от SPONDERE «торжественно обещать». Русское «спонсор» — то же слово через английский."
memory: "Sponsor — спонсор. Sponsorzy — спонсоры. Szukać sponsora — искать спонсора. Читается «спо́нсор»."
