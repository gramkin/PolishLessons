etymology: "От праславянского корня со значением «мотать, виться», того же, что в русском «мотать». Бабочку назвали за мелькающий, вьющийся полёт. Тот же корень дал и русского «мотыля», только у нас им назвали личинку комара, которая тоже вьётся в воде, а «мотылёк» остался за ночной бабочкой. Так одно слово разошлось по трём существам: польская бабочка, русский червячок и наш мотылёк."
memory: "Бабочка, а не «мотыль»: наш мотыль это личинка комара для рыбалки, а польский motyl — бабочка. Слова родня, оба от корня «мотать», названы за мелькающий полёт. Читается «мо́тыль», где y даёт «ы», а конечная l — «ль». Слово одушевлённое, поэтому винительный равен родительному: zlapal motyla. И запомните motyle w brzuchu — «бабочки в животе»."
idioms:
  - { pl: "motyle w brzuchu", ru: "бабочки в животе" }
