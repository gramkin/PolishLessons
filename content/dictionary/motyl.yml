notes:
  - { kind: false-friend, text: "Вот ловушка редкой чистоты. Русский «мотыль» выглядит как польское MOTYL, но значит совсем другое: у нас это красный червячок, личинка комара, которой удят рыбу. А польский MOTYL — это бабочка, по-русски именно «бабочка». Слова при этом настоящие родственники: оба от корня со значением «мотать, виться», и назвали ими разных существ за одно и то же — за мелькание. Наш «мотылёк» стоит посередине." }
  - { kind: usage, text: "Десять форм, мужской род, и слово одушевлённое, а значит винительный падеж совпадает с родительным: ZŁAPAŁ MOTYLA, а не MOTYL. Это обычное правило для живых существ, и его стоит проверять всякий раз. Множественное MOTYLE употребляется часто, в том числе в обороте MOTYLE W BRZUCHU." }
  - { kind: government, text: "Поймать бабочку — ZŁAPAĆ MOTYLA, винительный, равный родительному, потому что слово одушевлённое. Плавать баттерфляем — PŁYWAĆ MOTYLEM, творительный без предлога, как и русское «плавать баттерфляем». Бабочки в животе — MOTYLE W BRZUCHU, местный падеж после W. О бабочке — O MOTYLU, тоже местный." }
  - { kind: pronunciation, text: "Читается «мо́тыль», два слога, ударение на первом. Буква Y даёт «ы», поэтому второй слог это «ты», а не «ти». Конечная L перед концом слова звучит «ль», отсюда «тыль». В косвенных падежах L стоит перед гласной и звучит мягко: MOTYLA это «моты́ля», MOTYLEM — «моты́лем»." }
  - { kind: register, text: "Слово нейтральное и детское сразу: бабочек первыми узнают по картинкам. MOTYL NOCNY значит «ночная бабочка», то есть мотылёк у лампы, а ĆMA — моль. Оборот MOTYLE W BRZUCHU «бабочки в животе» вполне живой и означает волнение перед чем-то важным, ровно как у нас. В спорте MOTYL это стиль плавания." }
