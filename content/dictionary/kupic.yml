# review
id: kupic
format: 2
lemma: "kupić"
rank: 342
pos: verb
aspect: perf
pron: { cyr: "ку́пиць" }
senses:
  - id: buy
    ru: "купить"
    examples:
      - pl: "Kupiłem książkę."
        ru: "Я купил книгу."
        source: { kind: tatoeba, id: 611674 }
      - pl: "Kupiłem tuzin jaj."
        ru: "Я купил дюжину яиц."
        source: { kind: tatoeba, id: 441238 }
      - pl: "On kupił dywan."
        ru: "Он купил ковёр."
        source: { kind: tatoeba, id: 13466281 }
  - id: buy-q
    ru: "купить (в вопросах и о покупках)"
    examples:
      - pl: "Co kupiłeś?"
        ru: "Что ты купил?"
        source: { kind: tatoeba, id: 356414 }
      - pl: "Co kupiłaś?"
        ru: "Что купила?"
        source: { kind: tatoeba, id: 3757095 }
      - pl: "Kupiłeś świece?"
        ru: "Ты купил свечи?"
        source: { kind: tatoeba, id: 6763983 }
notes:
  - { kind: usage, text: "Несовершенный вид — kupować: Kupuję chleb codziennie «Покупаю хлеб каждый день»." }
  - { kind: usage, text: "Купить кому-то — дательный падеж: kupię córce prezent «куплю дочери подарок»." }
  - { kind: usage, text: "kupić kota w worku — «купить кота в мешке», точная параллель русскому." }
  - { kind: register, text: "Разговорное nie kupuję tego значит «я в это не верю», как русское «не куплюсь»." }
collocations:
  - { pl: "kupić bilet", ru: "купить билет" }
  - { pl: "kupić prezent", ru: "купить подарок" }
  - { pl: "do kupienia", ru: "продаётся" }
  - { pl: "kupić kota w worku", ru: "купить кота в мешке" }
etymology: "Праславянское *kupiti, заимствование из германского (ср. немецкое kaufen); то же слово, что русское «купить»."
memory: "kupić — «купить», сов. к kupować. Кому-то покупают дательным падежом: kupię córce prezent. А kupić kota w worku — ровно как русское «купить кота в мешке»."
idioms:
  - { pl: "kupić kota w worku", ru: "купить кота в мешке" }
  - { pl: "do kupienia", ru: "продаётся" }
  - { pl: "kupić spod lady", ru: "купить из-под полы" }
