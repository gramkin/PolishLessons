# review
id: wysunac
format: 2
lemma: "wysunąć"
rank: 6056
pos: verb
aspect: perf
pron: { cyr: "высу́нонць" }
senses:
  - id: pull-out
    ru: "выдвинуть, высунуть (ящик, голову, язык)"
    examples:
      - pl: "Króliki wysunęły pyszczki."
        ru: "Кролики высунули мордочки."
        source: { kind: translated, id: 502861 }
      - pl: "Wysunął szufladę i wyjął klucze."
        ru: "Он выдвинул ящик и достал ключи."
        source: { kind: authored }
      - pl: "Z morskich głębin wysunęła się macka."
        ru: "Из морских глубин показалось щупальце."
        source: { kind: translated, id: 6160994 }
  - id: put-forward
    ru: "выдвинуть (предложение, кандидатуру, обвинение)"
    examples:
      - pl: "Po dłuższej dyskusji wysunęli jeden plan."
        ru: "После долгого обсуждения они выдвинули один план."
        source: { kind: translated, id: 450207 }
      - pl: "Partia wysunęła nowego kandydata."
        ru: "Партия выдвинула нового кандидата."
        source: { kind: authored }
  - id: get-ahead
    ru: "wysunąć się — выдвинуться вперёд, выйти в лидеры; выскользнуть"
    examples:
      - pl: "Pies wysunął się z obroży bez żadnego wysiłku."
        ru: "Собака без всякого труда выскользнула из ошейника."
        source: { kind: translated, id: 1302773 }
      - pl: "Po pierwszym okrążeniu wysunął się na prowadzenie."
        ru: "После первого круга он вышел вперёд."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Одно польское WYSUNĄĆ покрывает и «высунуть» (język, głowę), и «выдвинуть» (szufladę, kandydata, propozycję). Русское «высунуться» в смысле «вылезти не к месту» — WYCHYLIĆ SIĘ или разговорное WYCHYLAĆ SIĘ PRZED SZEREG." }
  - { kind: usage, text: "Совершенный вид, пара — WYSUWAĆ. Причастие WYSUNIĘTY очень частое в географии: najdalej wysunięty na północ, «самый северный», буквально «дальше всех выдвинутый на север»; wysunięty przyczółek, «передовой плацдарм». WYSUNĄĆ SIĘ NA PROWADZENIE — «выйти в лидеры»." }
  - { kind: government, text: "Что — винительный: wysunąć szufladę, wniosek. Откуда — Z + родительный: wysunąć się z obroży, z tłumu. Против кого (обвинение) — PRZECIWKO + дательный или WOBEC + родительный: wysunąć zarzuty wobec ministra." }
  - { kind: pronunciation, text: "«высу́нонць»: Ą перед Ć читается «он». В прошедшем Ą чередуется с Ę: wysunął — «высу́ноу», wysunęła — «высуне́уа». Ударение на предпоследнем слоге." }
collocations:
  - { pl: "wysunąć szufladę", ru: "выдвинуть ящик" }
  - { pl: "wysunąć kandydata", ru: "выдвинуть кандидата" }
  - { pl: "wysunąć propozycję", ru: "выдвинуть предложение" }
  - { pl: "wysunąć się na prowadzenie", ru: "выйти вперёд, в лидеры" }
  - { pl: "najdalej wysunięty na północ", ru: "самый северный" }
family:
  - { pl: "wysuwać", ru: "выдвигать", relation: aspect }
  - { pl: "sunąć", ru: "скользить, двигаться плавно", relation: root }
  - { pl: "przesunąć", ru: "передвинуть", relation: root }
etymology: "От WY- и SUNĄĆ, «двигать, толкать; скользить», праславянского *sunǫti, того же корня, что русское «совать», «сунуть», «высунуть». В польском корень дал и «высунуть», и «выдвинуть», а русский разделил их между «сунуть» и «двигать»."
memory: "Wysunąć — высунуть и выдвинуть: wysunąć język, szufladę, kandydata. Najdalej wysunięty na północ — самый северный. Wysunąć się na prowadzenie — выйти в лидеры. Пара — wysuwać."
idioms:
  - { pl: "wysunąć się na prowadzenie", ru: "выйти в лидеры" }
