notes:
  - { kind: false-friend, text: "WYSADZIĆ W POWIETRZE — ЭТО «ВЗОРВАТЬ». Русское «высадить» такого значения не знает вовсе, и здесь легко прочитать газетный заголовок наоборот. Всё держится на приставочном обороте W POWIETRZE «на воздух»: wysadzili most w powietrze «они взорвали мост». Убери эти два слова — и останется обычное «высадить»: wysadzili nas przed hotelem «они высадили нас перед отелем»." }
  - { kind: government, text: "Высаживают из транспорта через Z с родительным, как и по-русски: wysadzić kogoś Z pociągu, Z autobusu. А вот место высадки идёт с предлогом POD и творительным падежом: WYSADZIĆ KOGOŚ POD DOMEM, POD DWORCEM — «высадить у дома, у вокзала». Русское «у» требует родительного, польское pod — творительного, и это единственное расхождение в управлении у этого глагола." }
  - { kind: usage, text: "Основа мягчает только в повелительном: инфинитив WYSADZIĆ и будущее WYSADZĘ, WYSADZI идут с dz, повелительное WYSADŹ, WYSADŹCIE — с dź, причастие WYSADZONY снова с dz. Та же тройка, что у poprowadzić. Вид совершенный, wysadzę значит «высажу», несовершенная пара — WYSADZAĆ." }
  - { kind: usage, text: "Корень тот же, что у WSIĄŚĆ «сесть в транспорт»: праславянское *sěd- дало и «сесть», и каузатив *saditi «посадить». Так что wsiąść и wysadzić — пара противоположностей из одного гнезда: один садится сам, другого высаживают. Отсюда же sad «сад» и sadzić «сажать»." }
collocations:
  - { pl: "wysadzić w powietrze", ru: "взорвать" }
  - { pl: "wysadzić pasażerów", ru: "высадить пассажиров" }
  - { pl: "wysadzić rozsadę", ru: "высадить рассаду" }
family:
  - { pl: "wysadzać", ru: "высаживать, взрывать (несов.)", relation: aspect }
  - { pl: "sadzić", ru: "сажать", relation: root }
  - { pl: "posadzić", ru: "посадить", relation: root }
  - { pl: "wsiąść", ru: "сесть (в транспорт)", relation: antonym, id: wsiasc }
etymology: "Приставка wy- и sadzić «сажать», из праславянского *saditi — каузатива к *sěsti «сесть». То есть sadzić буквально «заставить сесть», и от того же гнезда идут русские «садить», «сажать», «сад» и польские sad, posadzić. Значение «взорвать» пришло позже и держится на обороте w powietrze: то, что взрывают, как бы «высаживают на воздух»."
memory: "wysadzić w powietrze — это «взорвать», а не «высадить»; всё решают слова w powietrze. Без них wysadzić значит ровно то же, что по-русски: wysadź mnie na rogu «высади меня на углу». И запомни место высадки: pod domem с творительным, а не «у дома»."
idioms:
  - { pl: "wysadzić w powietrze", ru: "взорвать" }
  - { pl: "wysadzić kogoś z siodła", ru: "выбить кого-л. из седла" }
