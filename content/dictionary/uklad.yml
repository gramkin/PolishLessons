# review
id: uklad
format: 2
lemma: "układ"
rank: 1298
pos: noun
pron: { cyr: "у́куат" }
senses:
  - id: system
    ru: "система (солнечная, нервная, пищеварительная)"
    examples:
      - pl: "Neptun jest ósmą planetą Układu Słonecznego."
        ru: "Нептун — восьмая планета Солнечной системы."
        source: { kind: tatoeba, id: 837861 }
      - pl: "Jowisz jest największą planetą układu słonecznego."
        ru: "Юпитер — самая большая планета Солнечной системы."
        source: { kind: translated, id: 4911973 }
      - pl: "Wątroba i trzustka tworzą część układu pokarmowego."
        ru: "Печень и поджелудочная железа входят в пищеварительную систему."
        source: { kind: translated, id: 13020725 }
  - id: arrangement
    ru: "устройство, расположение, компоновка"
    examples:
      - pl: "Omińmy układ zabezpieczający."
        ru: "Обойдём охранную систему."
        source: { kind: translated, id: 842064 }
      - pl: "Tom potrzebuje nowego układu wydechowego do swojego auta."
        ru: "Тому нужна новая выхлопная система для его машины."
        source: { kind: translated, id: 3095510 }
      - pl: "To samochód z układem automatycznego sterowania."
        ru: "Это автомобиль с системой автоматического управления."
        source: { kind: tatoeba, id: 4974167 }
  - id: deal
    ru: "договор, соглашение; układy — отношения, связи"
    examples:
      - pl: "Oba kraje wynegocjowały układ."
        ru: "Обе страны договорились о соглашении."
        source: { kind: translated, id: 404499 }
      - pl: "To był bardzo korzystny układ dla obu stron."
        ru: "Это было очень выгодное соглашение для обеих сторон."
        source: { kind: translated, id: 11692197 }
      - pl: "Mam z nią dobre układy."
        ru: "Я с ней в хороших отношениях."
        source: { kind: tatoeba, id: 575707 }
notes:
  - { kind: usage, text: "Три далёких значения: «система» (Układ Słoneczny «Солнечная система», układ nerwowy «нервная система»), «устройство, компоновка» и «соглашение»." }
  - { kind: usage, text: "Во множественном układy значит «связи, отношения»: mieć dobre układy z kimś «быть с кем-то в хороших отношениях»." }
  - { kind: usage, text: "Разговорное w takim układzie значит «в таком случае, при таком раскладе»." }
  - { kind: pronunciation, text: "Конечное d оглушается, а ł звучит как «у»: у́куат." }
collocations:
  - { pl: "Układ Słoneczny", ru: "Солнечная система" }
  - { pl: "układ nerwowy", ru: "нервная система" }
  - { pl: "mieć układy", ru: "иметь связи" }
etymology: "От układać «укладывать», из u- и kłaść «класть». Русское «уклад» — то же слово, но в русском оно осталось при быте и хозяйстве."
memory: "układ — «система» (Układ Słoneczny, układ nerwowy), «устройство» и «соглашение» сразу. Во множественном układy значит «связи, отношения». Конечное d оглушается: у́куат."
idioms:
  - { pl: "Układ Słoneczny", ru: "Солнечная система" }
  - { pl: "układ nerwowy", ru: "нервная система" }
  - { pl: "mieć układy", ru: "иметь связи" }
