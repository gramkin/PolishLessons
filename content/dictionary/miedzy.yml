# review
id: miedzy
format: 2
lemma: "między"
rank: 469
pos: prep
pron: { cyr: "ме́ндзы" }
senses:
  - id: between
    ru: "между (о положении)"
    examples:
      - pl: "On siedzi między dwoma krzesłami."
        ru: "Он сидит между двумя стульями."
        source: { kind: tatoeba, id: 2244449 }
      - pl: "Marzec jest między lutym a kwietniem."
        ru: "Март находится между февралём и апрелем."
        source: { kind: tatoeba, id: 742430 }
      - pl: "Kobieta siedziała między dwoma mężczyznami."
        ru: "Женщина сидела между двумя мужчинами."
        source: { kind: tatoeba, id: 6895130 }
  - id: relation
    ru: "между (о различии, отношении)"
    examples:
      - pl: "Jaki jest związek między polityką a wojną?"
        ru: "Какова связь между политикой и войной?"
        source: { kind: tatoeba, id: 623110 }
      - pl: "Jaka jest różnica między stołem a krzesłem?"
        ru: "В чем разница между столом и стулом?"
        source: { kind: tatoeba, id: 12137894 }
      - pl: "Tom nie widzi różnicy między radą a rozkazem."
        ru: "Том не знает разницы между советом и приказом."
        source: { kind: tatoeba, id: 1665935 }
notes:
  - { kind: usage, text: "С творительным падежом — о положении: między domami «между домами». С винительным — о направлении: wejść między ludzi «войти в толпу»." }
  - { kind: usage, text: "różnica między X a Y — «разница между X и Y», причём с союзом a, а не i." }
  - { kind: usage, text: "między innymi (сокращённо m.in.) значит «в том числе, между прочим»." }
  - { kind: usage, text: "mówiąc między nami — «между нами говоря»." }
collocations:
  - { pl: "między innymi", ru: "в том числе" }
  - { pl: "różnica między", ru: "разница между" }
  - { pl: "między nami", ru: "между нами" }
  - { pl: "między ludźmi", ru: "среди людей" }
etymology: "Праславянское *medju; русское «между» — то же самое слово, а носовой ę стоит на месте русского «е»."
memory: "między — «между», слово совпадает с русским. Учить надо падежи: творительный о положении (między domami) и винительный о движении (wejść między ludzi). И różnica między X a Y — с союзом a."
idioms:
  - { pl: "między innymi", ru: "в том числе, между прочим" }
  - { pl: "mówiąc między nami", ru: "между нами говоря" }
  - { pl: "kiedy wszedłeś między wrony, musisz krakać tak jak one", ru: "с волками жить — по-волчьи выть" }
