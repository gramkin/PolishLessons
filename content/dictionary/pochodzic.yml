# review
id: pochodzic
format: 2
lemma: "pochodzić"
rank: 864
pos: verb
aspect: imperf
pron: { cyr: "похо́дзиць" }
senses:
  - id: come-from
    ru: "происходить, быть родом (откуда-л.)"
    examples:
      - pl: "Pochodzę z Rosji."
        ru: "Я из России."
        source: { kind: tatoeba, id: 599430 }
      - pl: "Martyna pochodzi z Wrocławia."
        ru: "Мартина родом из Вроцлава."
        source: { kind: tatoeba, id: 919750 }
      - pl: "Moi rodzice pochodzą z Chin."
        ru: "Мои родители родом из Китая."
        source: { kind: translated, id: 2734512 }
  - id: origin
    ru: "о происхождении слов, вещей, идей"
    examples:
      - pl: "Osiemdziesiąt procent angielskich słów pochodzi z innych języków."
        ru: "Восемьдесят процентов английских слов происходят из других языков."
        source: { kind: tatoeba, id: 6017149 }
      - pl: "Demokracja to idea pochodząca od starożytnych Greków."
        ru: "Демократия — идея, идущая от древних греков."
        source: { kind: translated, id: 513487 }
      - pl: "Lateks to naturalny składnik pochodzący z drzew kauczukowych."
        ru: "Латекс — природный компонент, получаемый из каучуковых деревьев."
        source: { kind: translated, id: 10794243 }
  - id: noun
    ru: "pochodzenie — происхождение"
    examples:
      - pl: "Jest z pochodzenia Niemcem."
        ru: "Он немец по происхождению."
        source: { kind: translated, id: 525057 }
      - pl: "Pochodzenie tego słowa nie jest znane."
        ru: "Происхождение этого слова неизвестно."
        source: { kind: translated, id: 6148843 }
      - pl: "Jest z pochodzenia Japończykiem."
        ru: "Он японец по происхождению."
        source: { kind: translated, id: 359167 }
notes:
  - { kind: government, text: "pochodzić Z czegoś «происходить откуда-то» — родительный после z: Pochodzę z Rosji. О человеке спрашивают Skąd pochodzisz? «Откуда ты родом?»." }
  - { kind: usage, text: "Глагол описывает состояние, а не действие, поэтому повелительного наклонения у него нет. Формы pochodź, pochodźcie принадлежат другому глаголу — pochodzić «походить, побродить» (Pochodź trochę po pokoju)." }
  - { kind: usage, text: "Существительное pochodzenie «происхождение» очень частое: z pochodzenia Niemcem «немец по происхождению», pochodzenie słowa «происхождение слова»." }
  - { kind: usage, text: "Корень тот же, что в chodzić «ходить»: происходить — значит «идти откуда-то». Русское «происходить» устроено точно так же, от «ходить»." }
collocations:
  - { pl: "skąd pochodzisz?", ru: "откуда ты родом?" }
  - { pl: "pochodzić z", ru: "происходить из" }
  - { pl: "z pochodzenia", ru: "по происхождению" }
  - { pl: "pochodzenie słowa", ru: "происхождение слова" }
family:
  - { pl: "chodzić", ru: "ходить", relation: root, id: chodzic }
  - { pl: "pochodzenie", ru: "происхождение", relation: derived }
  - { pl: "pochodny", ru: "производный", relation: derived }
etymology: "Из po- + chodzić «ходить» — буквально «идти откуда-то». Русское «происходить» собрано ровно так же, от «ходить», так что логика полностью совпадает."
memory: "pochodzić — «происходить, быть родом». Внутри сидит chodzić «ходить», как и в русском «происходить». Управление: pochodzić Z czegoś, Skąd pochodzisz? «Откуда ты родом?». Повелительного наклонения у глагола нет — pochodź! это уже другое слово, «походи немного»."
idioms:
  - { pl: "skąd pochodzisz?", ru: "откуда ты родом?" }
  - { pl: "z pochodzenia", ru: "по происхождению" }
  - { pl: "pochodzenie słowa", ru: "происхождение слова" }
