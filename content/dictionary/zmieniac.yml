# review
id: zmieniac
format: 2
lemma: "zmieniać"
rank: 744
pos: verb
aspect: imperf
aspectPair: zmienic
pron: { cyr: "зме́няць" }
senses:
  - id: change
    ru: "менять, изменять"
    examples:
      - pl: "Chcemy zmieniać świat."
        ru: "Мы хотим изменить мир."
        source: { kind: tatoeba, id: 2194700 }
      - pl: "Ale to nie zmienia wymiaru kary."
        ru: "Но это не меняет размер наказания."
        source: { kind: tatoeba, id: 3449889 }
      - pl: "Po co to zmieniać?"
        ru: "Зачем это менять?"
        source: { kind: translated, id: 8722900 }
  - id: change-itself
    ru: "zmieniać się — меняться"
    examples:
      - pl: "Świat zmienia się coraz szybciej."
        ru: "Мир меняется всё быстрее и быстрее."
        source: { kind: tatoeba, id: 1918686 }
      - pl: "Czasy się zmieniają i my zmieniamy się wraz z nimi."
        ru: "Времена меняются, и мы меняемся вместе с ними."
        source: { kind: tatoeba, id: 1397656 }
      - pl: "Niektóre zwierzęta zmieniają płeć."
        ru: "Некоторые животные меняют пол."
        source: { kind: tatoeba, id: 3697586 }
  - id: mind
    ru: "zmieniać zdanie — менять мнение"
    note: "Здесь zdanie значит «мнение», а не «предложение»."
    examples:
      - pl: "Często zmieniam zdanie."
        ru: "Я часто меняю мнение."
        source: { kind: translated, id: 3141075 }
      - pl: "Dlaczego co chwila zmieniasz zdanie?"
        ru: "Почему ты поминутно меняешь мнение?"
        source: { kind: translated, id: 10548812 }
      - pl: "Nie zmieniaj zdania."
        ru: "Не передумывай."
        source: { kind: translated, id: 359314 }
  - id: aspect
    ru: "zmieniać — процесс и повторение; zmienić — один раз"
    examples:
      - pl: "Każdego dnia zmieniał zdanie."
        ru: "Каждый день он менял мнение."
        source: { kind: translated, id: 2364053 }
      - pl: "Zmieniał zdanie jak rękawiczki."
        ru: "Он менял мнение как перчатки."
        source: { kind: translated, id: 13008576 }
      - pl: "Nie zmieniaj tematu."
        ru: "Не меняй тему."
        source: { kind: translated, id: 349239 }
notes:
  - { kind: usage, text: "Несовершенный zmieniać — про повторение и процесс, совершенный zmienić — про один раз: Ciągle zmienia zdanie «Он постоянно меняет мнение», но Zmienił zdanie «Он передумал»." }
  - { kind: false-friend, text: "В обороте zmieniać zdanie слово zdanie значит «мнение», а не «предложение». Nie zmieniaj zdania переводится «Не передумывай»." }
  - { kind: usage, text: "zmieniać jak rękawiczki — «менять как перчатки»: идиома совпадает с русской дословно." }
  - { kind: usage, text: "Существительное zmiana значит и «изменение», и «смена» в рабочем смысле: zmiana pogody «перемена погоды», nocna zmiana «ночная смена»." }
collocations:
  - { pl: "zmieniać zdanie", ru: "менять мнение" }
  - { pl: "zmieniać temat", ru: "менять тему" }
  - { pl: "zmieniać się", ru: "меняться" }
  - { pl: "zmiana pogody", ru: "перемена погоды" }
family:
  - { pl: "zmienić", ru: "изменить", relation: aspect }
  - { pl: "zmiana", ru: "изменение, смена", relation: derived }
  - { pl: "zmienny", ru: "переменчивый", relation: derived }
  - { pl: "wymienić", ru: "обменять", relation: root }
etymology: "z- + miana, от mienić «менять», праславянское *měna — то же гнездо, что русские «мена», «менять» и «измена»."
memory: "zmieniać — «менять», корень тот же, что в русских «мена» и «менять». Несовершенный вид про повторение и процесс, совершенный zmienić — про один раз: Ciągle zmienia zdanie, но Zmienił zdanie «Он передумал». В обороте zmieniać zdanie слово zdanie значит «мнение», а не «предложение». А zmieniać jak rękawiczki переносится дословно."
idioms:
  - { pl: "zmieniać zdanie", ru: "менять мнение" }
  - { pl: "zmieniać jak rękawiczki", ru: "менять как перчатки" }
  - { pl: "zmieniać temat", ru: "менять тему" }
