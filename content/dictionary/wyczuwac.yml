        source: { kind: authored }
notes:
  - { kind: usage, text: "Это несовершенная пара к WYCZUĆ из партии 258, и вместе они показывают разницу в числе форм на одном корне. У совершенного WYCZUĆ пятьдесят три формы: сорок одна основная, одиннадцать страдательных причастий и деепричастие WYCZUWSZY. У несовершенного WYCZUWAĆ шестьдесят три: те же сорок одна и одиннадцать, но вместо деепричастия на -WSZY добавляются десять форм действительного причастия WYCZUWAJĄCY и деепричастие WYCZUWAJĄC. Разница ровно в десять форм, и она не случайна: действительное причастие описывает действие в ходу, а у совершенного вида хода нет." }
  - { kind: false-friend, text: "Корень тот же, что в карточке WYCZUĆ, и предупреждение то же: CZUĆ — это «чуять», а не книжное «чувствовать». Поэтому WYCZUWAĆ ближе всего к русскому «чуять, улавливать»: WYCZUWAĆ ZAPACH, WYCZUWAĆ PODSTĘP, WYCZUWAĆ NAPIĘCIE. Речь всегда о слабом признаке, о догадке по намёку, а не о прямом ощущении. Переводить «вычувствовать» нельзя, такого слова нет." }
  - { kind: usage, text: "Действительное причастие WYCZUWAJĄCY живёт и как обычное прилагательное о человеке с чутьём: POLITYK WYCZUWAJĄCY NASTROJE — «политик, чующий настроения». А страдательное WYCZUWANY значит «ощутимый, улавливаемый»: WYCZUWANE NAPIĘCIE — «ощутимое напряжение». Рядом стоит существительное WYCZUCIE «чутьё», разобранное в карточке WYCZUĆ, и прилагательное WYCZUWALNY — «ощутимый, различимый»." }
  - { kind: government, text: "Управление простое и совпадает с русским: WYCZUWAĆ COŚ в винительном — wyczuwać zapach, podstęp, napięcie. Дополнением может быть и человек: WYCZUWA LUDZI — «он разбирается в людях», где русский скажет с предлогом «в», а польский возьмёт чистый винительный. Можно и с предлогом W для места, где чуют: WYCZUWAM W TYM PODSTĘP — «я чувствую в этом подвох»." }
collocations:
  - { pl: "wyczuwać podstęp", ru: "чувствовать подвох" }
  - { pl: "wyczuwać napięcie", ru: "улавливать напряжение" }
  - { pl: "wyczuwalna różnica", ru: "ощутимая разница" }
family:
  - { pl: "wyczuć", ru: "почувствовать, уловить", relation: aspect, id: wyczuc }
  - { pl: "czuć", ru: "чувствовать, чуять", relation: root, id: czuc }
  - { pl: "wyczucie", ru: "чутьё", relation: derived }
etymology: "Приставка wy- и CZUWAĆ, многократная форма от CZUĆ, из праславянского *čuti «чуять» — то же слово, что русское «чуять». Многократный суффикс -wa- делает действие длящимся, отсюда и несовершенный вид: CZUĆ при CZUWAĆ стоит как «чуять» при «чуять постоянно». Гнездо то же, что у WYCZUĆ: CZUJNY «чуткий», CZUJNIK «датчик», PRZECZUCIE «предчувствие», WYCZUCIE «чутьё», WYCZUWALNY «ощутимый». Обратите внимание, что CZUWAĆ само по себе значит «бодрствовать, дежурить» — это отдельное слово того же корня."
memory: "Несовершенная пара к wyczuć: там 53 формы, здесь 63 — ровно на десять форм действительного причастия больше. И czuć значит «чуять», а не «чувствовать»."
idioms:
  - { pl: "wyczuwać pismo nosem", ru: "чуять нутром, предугадывать" }
  - { pl: "wyczuwalna różnica", ru: "ощутимая разница" }
