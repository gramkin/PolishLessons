# review
id: wyczuwac
format: 2
lemma: "wyczuwać"
rank: 2972
pos: verb
pron: { cyr: "вычува́ць" }
senses:
  - id: sense
    ru: "чувствовать, улавливать"
    examples:
      - pl: "Wyczuwam w tym podstęp."
        ru: "Я чувствую в этом подвох."
        source: { kind: authored }
