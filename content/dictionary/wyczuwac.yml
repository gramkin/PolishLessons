    ru: "разбираться в людях, угадывать"
    examples:
      - pl: "Wyczuwa ludzi po pierwszym zdaniu."
        ru: "Он раскусывает людей по первой фразе."
        source: { kind: authored }
      - pl: "Wyczuwający nastroje polityk rzadko się myli."
