      - pl: "To jest trochę zbyt luźne w pasie."
        ru: "Это немного свободно в талии."
        source: { kind: translated, id: 674688 }
notes:
  - { kind: usage, text: "Родительный падеж — обычно pasa, реже pasu. Обе формы правильные, но pasa встречается заметно чаще." }
  - { kind: false-friend, text: "Форма pasie принадлежит не только существительному: Bydło pasie się na trawie — это глагол paść «пасти(сь)». Отличайте w pasie «в талии» от pasie się «пасётся»." }
  - { kind: usage, text: "pas bezpieczeństwa — «ремень безопасности», zapiąć pasy — «пристегнуть ремни», pas startowy — «взлётная полоса»." }
  - { kind: usage, text: "В значении полосы движения говорят prawy pas, lewy pas: jechać prawym pasem «ехать по правой полосе»." }
  - { kind: government, text: "Голый по пояс — nagi do pasa (родительный падеж с do); носить на поясе — u pasa." }
collocations:
  - { pl: "pas bezpieczeństwa", ru: "ремень безопасности" }
  - { pl: "zapiąć pasy", ru: "пристегнуть ремни" }
  - { pl: "do pasa", ru: "по пояс" }
family:
  - { pl: "pasek", ru: "ремешок, поясок", relation: root }
  - { pl: "pasmo", ru: "полоса, диапазон", relation: root }
etymology: "Праславянское *pojasъ, стянувшееся в польском до pas: то же слово, что русское «пояс», только без первого слога."
memory: "pas — «пояс, ремень», а ещё «полоса» (prawy pas «правая полоса») и «талия» (wąski w pasie «узкий в талии»). Русское «пояс» — то же слово, просто польское потеряло начало. Осторожно: pasie бывает и формой глагола paść «пастись»."
idioms:
  - { pl: "cios poniżej pasa", ru: "удар ниже пояса" }
  - { pl: "brać nogi za pas", ru: "уносить ноги" }
  - { pl: "być za pasem", ru: "быть на носу, приближаться" }
