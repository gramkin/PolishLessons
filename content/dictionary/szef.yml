pos: noun
pron: { cyr: "шэф" }
senses:
  - id: boss
    ru: "начальник, шеф"
    examples:
      - pl: "Jesteś szefem."
        ru: "Ты начальник."
        source: { kind: tatoeba, id: 2145984 }
      - pl: "Mój szef jest mocno przeziębiony."
        ru: "Мой начальник сильно простужен."
        source: { kind: tatoeba, id: 929497 }
      - pl: "Teraz jestem waszym szefem."
        ru: "Теперь я ваш начальник."
        source: { kind: tatoeba, id: 3464069 }
  - id: boss-work
    ru: "начальник (на работе, в подчинении)"
    examples:
      - pl: "Tom ma nowego szefa."
        ru: "У Тома новый начальник."
        source: { kind: tatoeba, id: 6441715 }
      - pl: "Robotnicy budowlani pracują tylko wtedy gdy szef na nich patrzy."
        ru: "Строители работают, только когда на них смотрит бригадир."
        source: { kind: tatoeba, id: 3743851 }
      - pl: "Szef wezwał mnie do gabinetu."
        ru: "Начальник вызвал меня в кабинет."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Из французского chef «глава»; szef kuchni — «шеф-повар»." }
  - { kind: usage, text: "Звательный szefie живой и разговорный: Szefie! — так обращаются и к начальнику, и просто к незнакомому мужчине." }
  - { kind: usage, text: "Множественное szefowie «начальники»; женская форма — szefowa." }
collocations:
  - { pl: "mój szef", ru: "мой начальник" }
  - { pl: "szef kuchni", ru: "шеф-повар" }
  - { pl: "nowy szef", ru: "новый начальник" }
  - { pl: "rozmawiać z szefem", ru: "говорить с начальником" }
etymology: "Из французского chef «глава», а то — из латинского caput «голова»; в русский «шеф» пришёл тем же путём."
memory: "szef — «начальник, шеф», из французского chef «глава». Звательный szefie! живой: так обращаются и к начальнику, и к незнакомому мужчине."
idioms:
