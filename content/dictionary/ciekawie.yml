# review
id: ciekawie
format: 2
lemma: "ciekawie"
rank: 5223
pos: adv
pron: { cyr: "цека́ве" }
senses:
  - id: interestingly
    ru: "интересно"
    examples:
      - pl: "Lekcja była ciekawie poprowadzona."
        ru: "Урок был интересно построен."
        source: { kind: authored }
      - pl: "Ciekawie spędziliśmy wakacje."
        ru: "Мы интересно провели каникулы."
        source: { kind: authored }
      - pl: "Ten artykuł jest ciekawie napisany."
        ru: "Эта статья интересно написана."
        source: { kind: authored }
  - id: curiously
    ru: "с любопытством"
    examples:
      - pl: "Kot ciekawie przyglądał się rybkom."
        ru: "Кот с любопытством разглядывал рыбок."
        source: { kind: authored }
      - pl: "Spojrzała na mnie ciekawie."
        ru: "Она посмотрела на меня с любопытством."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "CIEKAWIE — «интересно» как наречие образа действия: CIEKAWIE OPOWIADA, «интересно рассказывает». Но «Интересно, кто это?» по-польски — CIEKAWE, KTO TO, с формой прилагательного, а не CIEKAWIE." }
  - { kind: usage, text: "Наречие со степенями: CIEKAWIE, CIEKAWIEJ, NAJCIEKAWIEJ. Прилагательное CIEKAWY значит и «интересный», и «любопытный»: CIEKAWA KSIĄŻKA, CIEKAWE DZIECKO." }
  - { kind: government, text: "Наречие ничем не управляет. Частый оборот — ZAPOWIADA SIĘ CIEKAWIE, «обещает быть интересным»." }
  - { kind: pronunciation, text: "Читается «цека́ве», ударение на предпоследнем слоге. CIE — «це», WIE — «ве»." }
collocations:
  - { pl: "ciekawie opowiadać", ru: "интересно рассказывать" }
  - { pl: "ciekawie spędzić czas", ru: "интересно провести время" }
  - { pl: "zapowiada się ciekawie", ru: "обещает быть интересным" }
family:
  - { pl: "ciekawy", ru: "интересный; любопытный", relation: root, id: ciekawy }
  - { pl: "ciekawość", ru: "любопытство", relation: root, id: ciekawosc }
  - { pl: "zaciekawić", ru: "заинтересовать", relation: root }
etymology: "От CIEKAWY, исходно «жадный, нетерпеливый», от старого глагола со значением «бегать, стремиться». Любопытный — тот, кто спешит узнать. Русского соответствия в общем языке нет."
memory: "Ciekawie — интересно (как?): ciekawie opowiada. «Интересно, кто это?» — Ciekawe, kto to. Читается «цека́ве». Ciekawość — любопытство."
idioms:
  - { pl: "ciekawość to pierwszy stopień do piekła", ru: "любопытство до добра не доводит" }
