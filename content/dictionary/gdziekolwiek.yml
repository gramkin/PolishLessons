# review
id: gdziekolwiek
format: 2
lemma: "gdziekolwiek"
rank: 1832
pos: adv
pron: { cyr: "гдзеко́львек" }
senses:
  - id: anywhere
    ru: "где угодно, куда угодно"
    examples:
      - pl: "Mogę spać gdziekolwiek."
        ru: "Я могу спать где угодно."
        source: { kind: translated, id: 2120176 }
      - pl: "Koty śpią gdziekolwiek."
        ru: "Кошки спят где угодно."
        source: { kind: translated, id: 5013692 }
      - pl: "Gdziekolwiek."
        ru: "Где угодно."
        source: { kind: translated, id: 13783239 }
  - id: wherever
    ru: "где бы ни, куда бы ни"
    examples:
      - pl: "Usiądź gdziekolwiek chcesz."
        ru: "Садись где хочешь."
        source: { kind: translated, id: 548035 }
      - pl: "Możesz iść gdziekolwiek chcesz."
        ru: "Ты можешь пойти куда хочешь."
        source: { kind: translated, id: 538500 }
      - pl: "Gdziekolwiek jest, jest blisko."
        ru: "Где бы он ни был, он близко."
        source: { kind: translated, id: 2256238 }
notes:
  - { kind: usage, text: "Собрано из gdzie «где» и частицы -kolwiek «-либо», как ktokolwiek «кто-либо» и cokolwiek «что-либо». Частица пишется слитно." }
  - { kind: usage, text: "Слово покрывает сразу «где угодно» и «куда угодно»: польский здесь не различает места и направления." }
  - { kind: usage, text: "В придаточном значит «где бы ни»: gdziekolwiek chcesz «где хочешь», gdziekolwiek jest «где бы он ни был»." }
  - { kind: false-friend, text: "Не путайте с wszędzie «везде»: gdziekolwiek — это одно любое место, wszędzie — все места сразу." }
collocations:
  - { pl: "gdziekolwiek chcesz", ru: "где хочешь" }
  - { pl: "gdziekolwiek jest", ru: "где бы он ни был" }
  - { pl: "pójdę gdziekolwiek", ru: "пойду куда угодно" }
family:
  - { pl: "gdzie", ru: "где", relation: root, id: gdzie }
  - { pl: "ktokolwiek", ru: "кто-либо", relation: root, id: ktokolwiek }
  - { pl: "wszędzie", ru: "везде", relation: root, id: wszedzie }
etymology: "Сложение gdzie «где» и частицы -kolwiek «-либо», той же, что в ktokolwiek и cokolwiek. Русское «где-либо» собрано тем же способом."
memory: "gdziekolwiek — «где угодно» и «куда угодно» сразу: польский тут не делит место и направление. В придаточном — «где бы ни»."
idioms:
