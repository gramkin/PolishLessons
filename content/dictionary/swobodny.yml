# review
id: swobodny
format: 2
lemma: "swobodny"
rank: 2051
pos: adj
pron: { cyr: "свобо́дны" }
senses:
  - id: free
    ru: "свободный, беспрепятственный"
    examples:
      - pl: "Wstęp jest swobodny."
        ru: "Вход свободный."
        source: { kind: authored }
      - pl: "Mamy swobodny dostęp do danych."
        ru: "У нас свободный доступ к данным."
        source: { kind: authored }
      - pl: "To swobodny przekład."
        ru: "Это вольный перевод."
        source: { kind: authored }
  - id: relaxed
    ru: "непринуждённый, вольный"
    examples:
      - pl: "Rozmowa była swobodna."
        ru: "Разговор был непринуждённым."
        source: { kind: authored }
      - pl: "Ma swobodny styl pisania."
        ru: "У него непринуждённый стиль письма."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Главная ловушка: «свободный» в смысле «незанятый» — это wolny (wolne miejsce «свободное место»). swobodny значит «вольный, непринуждённый, беспрепятственный»." }
  - { kind: usage, text: "Наречие swobodnie «свободно, непринуждённо» встречается чаще самого прилагательного." }
  - { kind: government, text: "Обычное прилагательное на -y." }
  - { kind: usage, text: "Рядом стоят swoboda «непринуждённость, свобода действий» и wolność «свобода» в политическом смысле." }
collocations:
  - { pl: "swobodny dostęp", ru: "свободный доступ" }
  - { pl: "swobodny styl", ru: "непринуждённый стиль" }
etymology: "От swoboda, праславянское *svoboda — то же слово, что русское «свобода»."
memory: "swobodny — «вольный, непринуждённый». Корень тот же, что у русского «свобода», но «свободное место» будет wolne miejsce, а не swobodne."
