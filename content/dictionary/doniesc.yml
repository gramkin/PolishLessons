# review
id: doniesc
format: 2
lemma: "donieść"
rank: 4707
pos: verb
pron: { cyr: "до́несьць" }
senses:
  - id: carry-to
    ru: "донести (до места); поднести ещё"
    examples:
      - pl: "Doniósł zakupy na piąte piętro."
        ru: "Он донёс покупки до пятого этажа."
        source: { kind: authored }
      - pl: "Donieś krzesło z kuchni."
        ru: "Принеси ещё стул из кухни."
        source: { kind: authored }
      - pl: "Kurier doniesie paczkę pod drzwi."
        ru: "Курьер доставит посылку к двери."
        source: { kind: authored }
  - id: report
    ru: "сообщить (о чём-то); донести (на кого-то)"
    examples:
      - pl: "Prasa doniosła o skandalu."
        ru: "Пресса сообщила о скандале."
        source: { kind: authored }
      - pl: "Doniósł na sąsiada."
        ru: "Он донёс на соседа."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "DONIEŚĆ — «донести» в обоих русских смыслах: DONIEŚĆ TORBĘ DO DOMU и DONIEŚĆ NA SĄSIADA. Ещё — «сообщить»: MEDIA DONIOSŁY O WYPADKU. DONIESIENIE — «сообщение; заявление (в полицию)», DONOS — «донос»." }
  - { kind: usage, text: "Прошедшее мужского рода — DONIÓSŁ, с Ó, и так же условное DONIÓSŁBY; DONIOSŁA, DONIOSŁEM, DONIEŚLI. Будущее: DONIOSĘ, DONIESIESZ, повелительное DONIEŚ. Деепричастие — DONIÓSŁSZY. Несовершенный вид — DONOSIĆ." }
  - { kind: government, text: "О чём — O с предложным: DONIEŚĆ O WYPADKU. На кого — NA с винительным: DONIEŚĆ NA SĄSIADA. Кому — дательный: DONIEŚĆ POLICJI. Куда — DO с родительным: DO DOMU." }
  - { kind: pronunciation, text: "Читается «до́несьць», ударение на первом слоге. DONIOSĘ — «донё́сэ», DONIÓSŁ — «до́нюсу»." }
  - { kind: register, text: "DONIEŚĆ O CZYMŚ — газетное. DONIEŚĆ NA KOGOŚ — с осуждением, как русское «донести». DONIEŚĆ KRZESŁA — бытовое «поднести ещё»." }
collocations:
  - { pl: "donieść o wypadku", ru: "сообщить об аварии" }
  - { pl: "donieść na kogoś", ru: "донести на кого-то" }
  - { pl: "złożyć doniesienie", ru: "подать заявление (в полицию)" }
family:
  - { pl: "nieść", ru: "нести", relation: root, id: niesc }
  - { pl: "donos", ru: "донос", relation: derived }
  - { pl: "donosić", ru: "доносить; сообщать", relation: aspect }
etymology: "Приставка DO- «до-» плюс NIEŚĆ «нести», праславянское *nesti. Русское «донести», «донос» — то же гнездо."
memory: "Donieść — донести: doniósł zakupy; donieść na kogoś. Media doniosły — СМИ сообщили. Читается «до́несьць»."
idioms:
  - { pl: "donieść na kogoś", ru: "донести на кого-то" }
