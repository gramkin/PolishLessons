# review
id: zbudowac
format: 2
lemma: "zbudować"
rank: 1357
pos: verb
aspect: perf
pron: { cyr: "збудо́ваць" }
senses:
  - id: build
    ru: "построить, возвести"
    examples:
      - pl: "Nie od razu Rzym zbudowano."
        ru: "Рим не за один день построили."
        source: { kind: tatoeba, id: 557720 }
      - pl: "Zbudował nowy dom."
        ru: "Он построил новый дом."
        source: { kind: translated, id: 525090 }
      - pl: "Zbudowali most."
        ru: "Они построили мост."
        source: { kind: translated, id: 356907 }
  - id: made-of
    ru: "в причастии zbudowany — «построенный, сделанный из чего-либо; сложённый»"
    examples:
      - pl: "Ten dom zbudowany jest z kamienia."
        ru: "Этот дом построен из камня."
        source: { kind: tatoeba, id: 832814 }
      - pl: "Nasze ciała zbudowane są z komórek."
        ru: "Наши тела состоят из клеток."
        source: { kind: translated, id: 6371461 }
      - pl: "On jest silnie zbudowany."
        ru: "Он крепко сложён."
        source: { kind: translated, id: 630644 }
notes:
  - { kind: usage, text: "Совершенный вид к budować: zbudować — «построить и закончить», budować — «строить»." }
  - { kind: government, text: "zbudować co (винительный): zbudować dom, most. «Построен из чего-то» — zbudowany z czegoś: dom zbudowany z kamienia." }
  - { kind: usage, text: "Причастие zbudowany значит не только «построенный», но и «сложённый» о человеке: On jest silnie zbudowany «Он крепкого сложения»." }
  - { kind: usage, text: "Безличная форма zbudowano «построили» — обычный способ сказать о постройке, не называя строителя: Zbudowano most «Построили мост»." }
collocations:
  - { pl: "zbudować dom", ru: "построить дом" }
  - { pl: "zbudować most", ru: "построить мост" }
  - { pl: "zbudowany z kamienia", ru: "построенный из камня" }
etymology: "Приставка z- «с-, до конца» и budować, от buda «строение, будка» (праславянское *buda). Русская «будка» — то же самое слово."
memory: "zbudować — совершенный вид к budować, «построить». Причастие zbudowany значит и «построенный», и «сложённый»: dom zbudowany z kamienia «дом из камня», но on jest silnie zbudowany «он крепкого сложения». И запомните польскую «Москва не сразу строилась» — Nie od razu Kraków zbudowano."
idioms:
  - { pl: "Nie od razu Kraków zbudowano", ru: "Москва не сразу строилась" }
  - { pl: "zbudować coś od podstaw", ru: "построить что-то с нуля" }
  - { pl: "silnie zbudowany", ru: "крепкого сложения" }
