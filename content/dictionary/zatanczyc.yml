# review
id: zatanczyc
format: 2
lemma: "zatańczyć"
rank: 2261
pos: verb
pron: { cyr: "затаньчы́ць" }
senses:
  - id: dance-once
    ru: "станцевать, потанцевать"
    examples:
      - pl: "Zatańczyli walca i usiedli."
        ru: "Они станцевали вальс и сели."
        source: { kind: authored }
      - pl: "Zatańczysz ze mną?"
        ru: "Потанцуешь со мной?"
        source: { kind: authored }
  - id: perform-dance
    ru: "исполнить танец"
    examples:
      - pl: "Zatańczyła solo w drugim akcie."
        ru: "Она исполнила соло во втором акте."
        source: { kind: authored }
      - pl: "Poloneza zatańczono na otwarcie balu."
        ru: "Полонез исполнили на открытие бала."
        source: { kind: authored }
  - id: for-joy
    ru: "сплясать (от радости)"
    examples:
      - pl: "Omal nie zatańczył z radości."
        ru: "Он чуть не сплясал от радости."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "РУССКОЕ «ТАНЕЦ» ПРИШЛО ЧЕРЕЗ ПОЛЬСКИЙ. Taniec — из средневекового немецкого tanz, и в русский слово попало не прямо от немцев, а через польское посредство, вместе с самими танцами. Так что tańczyć и «танцевать» — не случайное сходство, а одно заимствование, прошедшее через Польшу. Исконное русское слово было «плясать», ему отвечает польское pląsać." }
  - { kind: government, text: "Танцуют ЧТО — винительный: zatańczyć walca, tango, poloneza. С кем — z и творительный: zatańczyć z kimś. Под что — przy с предложным: zatańczyć przy tej piosence. Вид совершенный, несовершенная пара — tańczyć; приставка za- даёт значение однократности: «станцевать один раз»." }
  - { kind: pronunciation, text: "Четыре слога, ударение на предпоследнем: za-tań-CZYĆ. Ń читается как мягкое нь, cz — как твёрдое ч: «затаньчы́ць». В повелительном наклонении мягкость сохраняется: zatańcz — «за́таньч»." }
  - { kind: usage, text: "Одна форма причастия пропущена по грамматической причине и объяснена в карточке. Существительное zatańczenie почти не употребляется; обычное отглагольное слово здесь taniec «танец» или tańczenie. А вот безличное zatańczono вполне живо в описании торжеств: zatańczono poloneza." }
collocations:
  - { pl: "zatańczyć walca", ru: "станцевать вальс" }
  - { pl: "zatańczyć z kimś", ru: "потанцевать с кем-л." }
  - { pl: "zatańczyć poloneza", ru: "станцевать полонез" }
family:
  - { pl: "tańczyć", ru: "танцевать", relation: aspect, id: tanczyc }
  - { pl: "taniec", ru: "танец", relation: root, id: taniec }
  - { pl: "tancerz", ru: "танцор", relation: derived }
etymology: "Приставка za- плюс tańczyć, от taniec, а то — из средневекового немецкого tanz, пришедшего в Польшу вместе с придворными танцами. Русские «танец» и «танцевать» заимствованы из польского, а не прямо из немецкого. Исконный славянский глагол сохранился в pląsać и русском «плясать». Отсюда tancerz, taneczny, potańcówka."
memory: "zatańczyć — «станцевать» один раз, от taniec. Слово немецкое по происхождению, но в русский оно попало ЧЕРЕЗ ПОЛЬСКИЙ, так что сходство не случайно. Танцуют винительным: zatańczyć walca."
idioms:
  - { pl: "zatańczyć walca", ru: "станцевать вальс" }
  - { pl: "zatańczyć z radości", ru: "сплясать от радости" }
formExamplesSkip:
  - { form: "zatańczeni", reason: "Пропуск по грамматической причине. Танцуют ЧТО — zatańczyć walca, poloneza, tango: винительное дополнение у глагола это сам танец, а не человек. Поэтому страдательное причастие описывает танец — zatańczony walc, zatańczona polka, — а мужско-личная форма множественного числа означала бы «мужчины, которых станцевали». Такого управления у глагола нет. Остальные формы причастия, включая немужско-личное zatańczone, совершенно обычны." }
