etymology: "От GORSZY «худший», сравнительной степени к ZŁY. Корень тот же, что в русском «горе», «горький», «горше»: худое — то, что горько."
memory: "Pogorszyć — ухудшить: pogorszyć sytuację. Pogorszyć się — ухудшиться: pogoda się pogorszyła. От gorszy — худший. Противоположность — poprawić. Читается «пого́ршыць»."
