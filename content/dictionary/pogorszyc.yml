notes:
  - { kind: false-friend, text: "POGORSZYĆ — «ухудшить», от GORSZY, «хуже». Русскому «горше» оно родственно: GORZKI — «горький», а GORSZY — «худший», как «горше» в смысле «хуже». Противоположность — POPRAWIĆ, «улучшить»: POPRAWIĆ SYTUACJĘ." }
  - { kind: usage, text: "Пятьдесят две формы: страдательное POGORSZONY есть — о состоянии, условиях, отношениях, — а форма для мужчин-людей POGORSZENI в карточку не включена: людей не «ухудшают». Деепричастие POGORSZYWSZY. Видовой партнёр — POGARSZAĆ: SYTUACJA SIĘ POGARSZA, «ситуация ухудшается»." }
  - { kind: government, text: "Что — винительный: POGORSZYĆ STAN, WARUNKI, RELACJE. Чем — творительный: POGORSZYĆ SPRAWĘ KŁAMSTWEM. Возвратное POGORSZYĆ SIĘ — без дополнения: ZDROWIE MU SIĘ POGORSZYŁO, с дательным лица." }
  - { kind: pronunciation, text: "Читается «пого́ршыць», три слога, ударение на предпоследнем. RSZ — «рш», R и SZ раздельно. Y после SZ — «ы». Конечное Ć — «ць»." }
  - { kind: register, text: "Нейтральное слово новостей, медицины и экономики: POGORSZENIE KONIUNKTURY, «ухудшение конъюнктуры». В быту чаще: BĘDZIE GORZEJ, ZROBIŁO SIĘ GORZEJ." }
