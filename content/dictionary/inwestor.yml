# review
id: inwestor
format: 2
lemma: "inwestor"
rank: 5151
pos: noun
pron: { cyr: "инвэ́стор" }
senses:
  - id: investor
    ru: "инвестор, вкладчик"
    examples:
      - pl: "Inwestorzy stracili pieniądze na giełdzie."
        ru: "Инвесторы потеряли деньги на бирже."
        source: { kind: authored }
      - pl: "Firma szuka inwestora."
        ru: "Фирма ищет инвестора."
        source: { kind: authored }
      - pl: "Zagraniczny inwestor kupił fabrykę."
        ru: "Иностранный инвестор купил завод."
        source: { kind: authored }
  - id: developer
    ru: "застройщик, заказчик строительства"
    examples:
      - pl: "Inwestor wybudował nowe osiedle."
        ru: "Застройщик построил новый жилой квартал."
        source: { kind: authored }
      - pl: "Inwestor odpowiada za opóźnienie budowy."
        ru: "За задержку строительства отвечает заказчик."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "INWESTOR — «инвестор», но в строительстве и «заказчик, застройщик»: INWESTOR BUDOWY. Застройщик жилья — чаще DEWELOPER. Инвестировать — INWESTOWAĆ." }
  - { kind: usage, text: "Десять форм, мужской род, лицо. Множественное — INWESTORZY: R переходит в RZ. Местный и звательный — INWESTORZE." }
  - { kind: government, text: "Найти инвестора — ZNALEŹĆ INWESTORA, винительный. Привлекать инвесторов — PRZYCIĄGAĆ INWESTORÓW. Вложение инвестора — WKŁAD INWESTORA, родительный." }
  - { kind: pronunciation, text: "Читается «инвэ́стор»: WE — твёрдое «вэ». Ударение на предпоследнем слоге. INWESTORZE — «инвэсто́жэ»." }
collocations:
  - { pl: "zagraniczny inwestor", ru: "иностранный инвестор" }
  - { pl: "drobny inwestor", ru: "мелкий инвестор" }
  - { pl: "przyciągać inwestorów", ru: "привлекать инвесторов" }
family:
  - { pl: "inwestycja", ru: "инвестиция", relation: derived, id: inwestycja }
  - { pl: "inwestować", ru: "инвестировать", relation: derived }
  - { pl: "giełda", ru: "биржа", relation: root }
etymology: "Из латинского INVESTIRE «облачать», через немецкое INVESTOR. Русское «инвестор» — то же слово."
memory: "Inwestor — инвестор и застройщик. Inwestorzy — инвесторы. Szukać inwestora — искать инвестора. Читается «инвэ́стор»."
