notes:
  - { kind: usage, text: "Слово совпадает с русским «погода» и по форме, и по значению. Вопрос о погоде: Jaka pogoda? «Какая погода?»." }
  - { kind: usage, text: "Второе значение — «хорошая погода»: idzie na pogodę «дело идёт к хорошей погоде». Плохая погода — niepogoda." }
  - { kind: usage, text: "Предложный падеж с чередованием d → dz: o pogodzie «о погоде», przy ładnej pogodzie «при хорошей погоде»." }
collocations:
  - { pl: "ładna pogoda", ru: "хорошая погода" }
  - { pl: "o pogodzie", ru: "о погоде" }
  - { pl: "zła pogoda", ru: "плохая погода" }
etymology: "Из po- + god-, того же корня, что русское «погода» и «год». Слово общеславянское, и совпадение с русским полное."
memory: "pogoda — «погода», слово-близнец. Вопрос: Jaka pogoda? А в предложном падеже d меняется на dz: rozmawiamy o pogodzie."
idioms:
