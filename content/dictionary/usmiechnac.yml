notes:
  - { kind: usage, text: "Глагол возвратный, и частица SIĘ при нём обязательна: сказать UŚMIECHNĄŁ без SIĘ нельзя. Но одно место в парадигме ведёт себя иначе — причастие UŚMIECHNIĘTY давно стало обычным прилагательным «улыбающийся, улыбчивый» и частицы не берёт вовсе: UŚMIECHNIĘTY CHŁOPIEC, UŚMIECHNIĘTA TWARZ. Поэтому в карточке личные формы идут с SIĘ, а формы причастия без него, и это не небрежность, а разница между глаголом и прилагательным. Пятьдесят три формы — обычный счёт для этого типа." }
  - { kind: false-friend, text: "Корень тот же, что в русском «смехе»: ŚMIECH это «смех», ŚMIAĆ SIĘ — «смеяться», ŚMIESZNY — «смешной». А вот существительное UŚMIECH значит «улыбка», хотя построено от смеха; русский для улыбки взял другой корень, от «лыбиться». Поэтому запоминать стоит через смех: польская улыбка это буквально малый смех. Осторожнее с ŚMIESZNY: кроме «смешного» оно значит «ничтожный, смехотворный», как в ŚMIESZNA SUMA «смехотворная сумма»." }
  - { kind: government, text: "Адресат улыбки вводится предлогом DO с родительным: UŚMIECHNĄĆ SIĘ DO KOGOŚ. Русский здесь ставит дательный без предлога — «улыбнуться кому-то», — и это одно из самых частых расхождений: UŚMIECHNĄŁ SIĘ DO MNIE значит «он улыбнулся мне». Причина улыбки идёт с NA или PRZY: UŚMIECHNĄĆ SIĘ NA MYŚL O CZYMŚ «улыбнуться при мысли о чём-то». В обороте об удаче подлежащим становится само счастье: SZCZĘŚCIE SIĘ UŚMIECHNĘŁO, ровно как «удача улыбнулась»." }
  - { kind: pronunciation, text: "Читается «усьмех́нончь», три слога, ударение на предпоследнем. Буква Ś даёт мягкое «сь», поэтому начало звучит «усьме», а не «усме». Сочетание CH читается как «х». Носовое Ą перед Ć даёт «он», а конечное Ć мягкое, «чь». В формах прошедшего времени Ę перед Ł теряет носовость: UŚMIECHNĘŁA звучит «усьмехне́уа». В причастии UŚMIECHNIĘTY носовое Ę сохраняется: «усьмехне́нты»." }
  - { kind: register, text: "Слово нейтральное и очень частотное. Прилагательное UŚMIECHNIĘTY в ходу как похвала человеку: UŚMIECHNIĘTA OBSŁUGA «приветливое обслуживание». Устойчивые обороты: UŚMIECH OD UCHA DO UCHA «улыбка до ушей», UŚMIECHNĄĆ SIĘ POD NOSEM «усмехнуться себе под нос», SZCZĘŚCIE SIĘ UŚMIECHNĘŁO «удача улыбнулась». Несовершенный партнёр — UŚMIECHAĆ SIĘ, и он описывает повторяющееся или длящееся: UŚMIECHA SIĘ DO WSZYSTKICH «он всем улыбается»." }
