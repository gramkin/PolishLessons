etymology: "Приставка U- плюс ŚMIECHNĄĆ, от праславянского *smějati sę «смеяться» и существительного *směchъ «смех». Русский сохранил корень полностью: «смех», «смеяться», «насмешка», «смешной». Польское ŚMIECH и русский «смех» различаются только начальным согласным, и различие закономерное: праславянское сочетание *sm перед передним гласным дало в польском мягкое ŚM. Любопытно, как языки назвали улыбку. Польский построил её от смеха, добавив приставку: UŚMIECH это как бы приглушённый смех. Русский же взял совсем другой корень, тот же, что в просторечном «лыбиться», и связь со смехом потерял."
memory: "Корень тот же, что в «смехе»: śmiech «смех», śmiać się «смеяться». Улыбка по-польски построена от смеха — uśmiech, то есть малый смех, — а русский взял для неё другой корень. Частица się обязательна при личных формах, но причастие uśmiechnięty стало прилагательным «улыбающийся» и się не берёт. Управление расходится: uśmiechnąć się do kogoś, предлог do с родительным, где русский говорит просто «улыбнуться кому-то»."
