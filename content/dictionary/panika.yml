  - { pl: "strach", ru: "страх", relation: root, id: strach }
  - { pl: "spokój", ru: "спокойствие, покой", relation: root, id: spokoj }
etymology: "Из греческого PANIKOS «относящийся к Пану», через латынь и французский, и в русский «паника» пришла тем же путём, так что слова совпадают и по смыслу, и по звучанию. За словом стоит миф: лесной бог Пан умел внезапным криком нагонять на людей и стада безрассудный ужас, и именно внезапность, а не сила страха, составляет суть понятия. Отсюда и разница с общим словом STRACH «страх»: STRACH может быть долгим и обоснованным, PANIKA всегда внезапна и всегда лишает рассудка. Польский добавил к заимствованию свои суффиксы и получил PANIKOWAĆ и PANIKARZ, где -ARZ обозначает человека по склонности, как в PISARZ и KŁAMARZ."
memory: "Слово греческое, от бога Пана, который нагонял внезапный ужас: отсюда главное отличие от strach — паника всегда внезапна. Конструкции разные по падежам: wpaść w panikę (винительный), ulec panice (дательный), siać panikę. В местном и дательном k переходит в c: panice, как pigułce. Разговорное bez paniki — целая реплика."
idioms:
  - { pl: "bez paniki", ru: "без паники, спокойно" }
  - { pl: "siać panikę", ru: "сеять панику" }
