notes:
  - { kind: government, text: "Три конструкции стоит запомнить целиком, потому что падежи в них разные. WPAŚĆ W PANIKĘ «впасть в панику» — винительный с предлогом W. ULEC PANICE «поддаться панике» — дательный, как и у русского «поддаться». SIAĆ PANIKĘ «сеять панику» — простой винительный. Отдельно живёт застывшее BEZ PANIKI с родительным, которое употребляется как целая реплика: «без паники, спокойно». Отрицание, как всегда, переводит винительный в родительный: NIE WYWOŁAŁ PANIKI." }
  - { kind: pronunciation, text: "Читается «пани́ка», ударение на предпоследнем слоге — там же, где и в русском, так что переучивать нечего. Важнее местный и дательный падеж: PANICE, «пани́це». Перед окончанием -E согласная K закономерно переходит в C, и это то же чередование, что в PIGUŁKA и PIGUŁCE или в MONETA и MONECIE. Для русского уха «панице» звучит неожиданно, но правило сквозное: K переходит в C, G в DZ, T в C перед этим окончанием." }
  - { kind: usage, text: "Слово нейтральное и годится и для газеты, и для разговора. Производные частотны: PANIKOWAĆ «паниковать», NIE PANIKUJ «не паникуй», и PANIKARZ «паникёр» — последнее с суффиксом -ARZ, тем же, что в PISARZ. Множественное число употребляется только в финансовом и историческом смысле: PANIKI BANKOWE «банковские паники», PANIKI GIEŁDOWE. О человеке во множественном числе не говорят, так что формы PANIK, PANIKOM, PANIKAMI, PANIKACH почти всегда про рынки." }
  - { kind: register, text: "BEZ PANIKI — разговорная формула успокоения, вроде русского «спокойно, без паники», и в быту она слышится чаще самого существительного. В официальном тексте скажут иначе: NIE MA POWODU DO PANIKI «нет причин для паники». Глагол PANIKOWAĆ тоже разговорный; в сообщении для прессы напишут WPADAĆ W PANIKĘ. Заимствованное происхождение слова не делает его книжным: оно давно обжилось и в польском, и в русском одинаково." }
collocations:
  - { pl: "bez paniki", ru: "без паники" }
  - { pl: "wpaść w panikę", ru: "впасть в панику" }
