# review
id: odwyk
format: 2
lemma: "odwyk"
rank: 4562
pos: noun
pron: { cyr: "о́двык" }
senses:
  - id: rehab
    ru: "реабилитация от зависимости, наркологическое лечение"
    examples:
      - pl: "Poszedł na odwyk."
        ru: "Он лёг в наркологию."
        source: { kind: authored }
      - pl: "Po miesiącu na odwyku wrócił do pracy."
        ru: "После месяца в реабилитационном центре он вернулся на работу."
        source: { kind: authored }
      - pl: "Rodzina namówiła go na odwyk."
        ru: "Семья уговорила его пройти лечение от зависимости."
        source: { kind: authored }
  - id: detox
    ru: "отвыкание, «детокс» (шутл.)"
    examples:
      - pl: "Robię sobie odwyk od telefonu."
        ru: "Я устраиваю себе детокс от телефона."
        source: { kind: authored }
      - pl: "Tydzień bez słodyczy to dla niej prawdziwy odwyk."
        ru: "Неделя без сладкого для неё — настоящая ломка."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ODWYK — «лечение от зависимости», от ODWYKNĄĆ «отвыкнуть». IŚĆ NA ODWYK — «лечь лечиться», BYĆ NA ODWYKU — «лечиться от зависимости». Шутливо — «детокс» от чего угодно." }
  - { kind: usage, text: "Мужской род, неодушевлённое. Родительный — ODWYKU. Множественное ODWYKI — «повторные курсы лечения»." }
  - { kind: government, text: "Пойти на лечение — IŚĆ NA ODWYK, NA с винительным. На лечении — NA ODWYKU, местный. Детокс от чего — ODWYK OD и родительный." }
  - { kind: pronunciation, text: "Читается «о́двык»: DW — «дв», YK — «ык». Ударение на первом слоге." }
collocations:
  - { pl: "iść na odwyk", ru: "пойти лечиться от зависимости" }
  - { pl: "ośrodek odwykowy", ru: "реабилитационный центр" }
  - { pl: "odwyk od telefonu", ru: "детокс от телефона" }
family:
  - { pl: "nałóg", ru: "зависимость", relation: root }
  - { pl: "alkoholik", ru: "алкоголик", relation: root }
  - { pl: "terapia", ru: "терапия", relation: root, id: terapia }
etymology: "От ODWYKNĄĆ «отвыкнуть», корень WYK-, как в русском «привыкнуть», «отвыкнуть»."
memory: "Odwyk — лечение от зависимости, «отвыкание». Iść na odwyk — лечь лечиться. Odwyk od telefonu — детокс. Читается «о́двык»."
idioms:
  - { pl: "przymusowy odwyk", ru: "вынужденное воздержание" }
