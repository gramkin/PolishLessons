# review
id: zwloki
format: 2
lemma: "zwłoki"
rank: 2414
pos: noun
pron: { cyr: "зву́оки" }
senses:
  - id: corpse
    ru: "труп, тело (мёртвое)"
    examples:
      - pl: "W ruinach znaleźliśmy zwłoki."
        ru: "В развалинах мы нашли труп."
        source: { kind: translated, id: 2851990 }
      - pl: "To Tom znalazł zwłoki."
        ru: "Именно Том нашёл труп."
        source: { kind: translated, id: 12721008 }
      - pl: "Dzisiaj rano policja wyłowiła zwłoki z rzeki."
        ru: "Сегодня утром полиция выловила труп из реки."
        source: { kind: translated, id: 4132128 }
  - id: remains
    ru: "останки"
    examples:
      - pl: "W piwnicy są zwłoki."
        ru: "В подвале труп."
        source: { kind: translated, id: 5838065 }
      - pl: "Zaledwie wczoraj znaleziono zwłoki na mokradłach."
        ru: "Только вчера на болотах нашли труп."
        source: { kind: translated, id: 13116559 }
notes:
  - { kind: usage, text: "Слово только множественного числа: zwłoki. Единственного не бывает, даже когда речь об одном теле — znaleźli zwłoki значит «нашли труп»." }
  - { kind: government, text: "Множественное: te zwłoki, tych zwłok. Глагол при нём тоже во множественном: zwłoki zostały znalezione." }
  - { kind: false-friend, text: "Не путайте с zwłoka «отсрочка, промедление» — это другое слово, женского рода единственного числа, от zwlekać «медлить». Совпадение форм случайное: bez zwłoki значит «без промедления», а не «без трупа»." }
  - { kind: usage, text: "Официальное и судебное слово. Нейтральное «тело» — ciało; в разговоре о покойном скажут ciało или zmarły." }
collocations:
  - { pl: "znaleźć zwłoki", ru: "найти труп" }
  - { pl: "sekcja zwłok", ru: "вскрытие" }
etymology: "От zwlec «стащить»; слово только множественного числа. Не путать с zwłoka «отсрочка» от zwlekać «медлить»."
memory: "zwłoki — «труп, останки», только во множественном числе. И не путайте с zwłoka «отсрочка»: bez zwłoki значит «без промедления»."
