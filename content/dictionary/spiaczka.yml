notes:
  - { kind: usage, text: "Слово построено суффиксом -ĄCZKA, и этот суффикс в польском образует названия болезненных состояний, причём очень регулярно: GORĄCZKA «жар, лихорадка», BIAŁACZKA «лейкемия», ŻÓŁTACZKA «желтуха», ŚPIĄCZKA «кома». Узнав его, учащийся читает незнакомое медицинское слово как название состояния, и это надёжнее любого запоминания по отдельности. Корень здесь SPAĆ «спать», то есть ŚPIĄCZKA буквально «спячка, сонное состояние». Устойчивые сочетания: ZAPAŚĆ W ŚPIĄCZKĘ «впасть в кому», WYJŚĆ ZE ŚPIĄCZKI «выйти из комы», ŚPIĄCZKA FARMAKOLOGICZNA «медикаментозная кома»." }
  - { kind: false-friend, text: "Русская «спячка» и польская ŚPIĄCZKA звучат почти одинаково и значат разное, и это ловушка с медицинскими последствиями. ŚPIĄCZKA — это кома, тяжёлое бессознательное состояние. Русская «спячка» — зимний сон животных, по-польски SEN ZIMOWY или HIBERNACJA. Поэтому фраза ZAPADŁ W ŚPIĄCZKĘ значит «он впал в кому», а не «залёг в спячку», и спутать здесь нельзя. Второе значение слова, сонная болезнь, в русском передаётся описательно и однокоренного соответствия тоже не имеет." }
  - { kind: pronunciation, text: "Читается «щпё́нчка», и разобрать стоит по частям, потому что слово трудное. Буква Ś даёт мягкое «щ», сочетание PIĄ — «пён» с носовой, CZ — «ч», KA — «ка». Ударение на предпоследнем слоге, то есть на -PIĄ-. Носовая ą перед CZ сохраняет назальность и звучит «он». В дательном и местном падеже ŚPIĄCZCE стечение CZC произносится слитно: «щпё́нчце», и эту форму стоит проговорить отдельно несколько раз." }
  - { kind: government, text: "Женский род на -A, склонение правильное. Винительный на -Ę: ZAPAŚĆ W ŚPIĄCZKĘ, с предлогом W и винительным для входа в состояние. Выход — предлог Z с родительным, и перед скоплением согласных он удлиняется до ZE: WYJŚĆ ZE ŚPIĄCZKI. Нахождение в состоянии — W с местным: W ŚPIĄCZCE. Эта тройка предлогов повторяется у многих названий состояний, и выучить её стоит на одном слове: W ŚPIĄCZKĘ, ZE ŚPIĄCZKI, W ŚPIĄCZCE." }
