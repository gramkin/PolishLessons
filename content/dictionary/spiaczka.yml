etymology: "От глагола SPAĆ «спать», из праславянского *spati — того же корня, что русские «спать», «сон», «спячка». Суффикс -ĄCZKA образует названия болезненных состояний, и за ним стоит старое причастие на -ąc-, то есть «спящее состояние». Поэтому ŚPIĄCZKA буквально значит «спячка», и именно эта буквальность делает слово опасным для русского: значение в польском сдвинулось к медицинскому, к коме, а бытовой зимний сон животных получил другое название, SEN ZIMOWY. Русский же сохранил за «спячкой» именно бытовой смысл. Один корень, одно строение, два разных итога, и разница существенная."
memory: "Не «спячка»! śpiączka — это кома; зимний сон животных — sen zimowy. Zapadł w śpiączkę значит «впал в кому». Суффикс -ączka даёт названия болезненных состояний: gorączka, białaczka, żółtaczka. Корень spać. Три предлога блоком: w śpiączkę, ze śpiączki, w śpiączce."
