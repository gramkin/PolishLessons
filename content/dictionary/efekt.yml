# review
id: efekt
format: 2
lemma: "efekt"
rank: 2072
pos: noun
pron: { cyr: "эфэ́кт" }
senses:
  - id: result
    ru: "эффект, результат"
    examples:
      - pl: "Efekt był natychmiastowy."
        ru: "Эффект был мгновенным."
        source: { kind: authored }
      - pl: "Nie osiągnęliśmy zamierzonego efektu."
        ru: "Мы не достигли задуманного результата."
        source: { kind: authored }
      - pl: "Pierwsze efekty już są."
        ru: "Первые результаты уже есть."
        source: { kind: authored }
  - id: effect-media
    ru: "эффект (звуковой, зрительный)"
    examples:
      - pl: "Efekty specjalne były słabe."
        ru: "Спецэффекты были слабые."
        source: { kind: authored }
      - pl: "Zajmuje się efektami specjalnymi."
        ru: "Он занимается спецэффектами."
        source: { kind: authored }
  - id: in-effect
    ru: "w efekcie — в итоге, в результате"
    examples:
      - pl: "W efekcie musieliśmy zacząć od nowa."
        ru: "В итоге нам пришлось начать заново."
        source: { kind: authored }
      - pl: "W efekcie nikt nie przyszedł."
        ru: "В итоге никто не пришёл."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Слово совпадает с русским «эффект», но у польского есть ход, которого в русском нет: оборот w efekcie работает как наречие и значит «в итоге, в результате». По-русски «в эффекте» не скажешь, нужно «в итоге». Это самое частое употребление слова в живой речи." }
  - { kind: usage, text: "Предложный падеж — efekcie, с чередованием t → ć, как в koncercie, funcie и kontrakcie. Множественное efekty в разговоре чаще значит «результаты» (efekty leczenia), а efekty specjalne — «спецэффекты»." }
  - { kind: government, text: "Чего эффект — в родительном: efekt leczenia, efekt zmian. Цель ставится предлогом: dla efektu «для эффекта». Достигать — osiągnąć efekt (винительный), а не «достичь эффекта» в родительном, как по-русски." }
collocations:
  - { pl: "efekty specjalne", ru: "спецэффекты" }
  - { pl: "w efekcie", ru: "в итоге, в результате" }
  - { pl: "efekt uboczny", ru: "побочный эффект" }
family:
  - { pl: "efektowny", ru: "эффектный", relation: derived }
  - { pl: "efektywny", ru: "эффективный", relation: derived }
etymology: "Из латинского effectus «исполненное, совершённое», от efficere (ex- «из» + facere «делать»). Тот же корень в «факт» и «фабрика». Русское «эффект» пришло тем же книжным путём, поэтому слова совпадают; разошлись только производные: польское efektowny значит «эффектный, броский», а efektywny — «эффективный», и путать их не стоит."
memory: "efekt — «эффект», то же латинское слово. Запомните оборот w efekcie «в итоге» (по-русски так не скажешь) и предложный efekcie с t → ć, как koncercie и kontrakcie."
idioms:
  - { pl: "w efekcie", ru: "в итоге, в результате" }
  - { pl: "efekt cieplarniany", ru: "парниковый эффект" }
