# review
id: dyrektor
format: 2
lemma: "dyrektor"
rank: 1206
pos: noun
pron: { cyr: "дырэ́ктор" }
senses:
  - id: director
    ru: "директор, руководитель"
    examples:
      - pl: "Dyrektor naszej szkoły jest bardzo stary."
        ru: "Директор нашей школы очень старый."
        source: { kind: tatoeba, id: 527577 }
      - pl: "Dyrektor szkoły spotkał się z mamami uczniów."
        ru: "Директор школы встретился с мамами учеников."
        source: { kind: tatoeba, id: 7960593 }
      - pl: "Nasz dyrektor nie uczy."
        ru: "Наш директор не преподаёт."
        source: { kind: translated, id: 2218970 }
  - id: be-director
    ru: "być dyrektorem — быть директором (творительный падеж)"
    examples:
      - pl: "Jestem dyrektorem."
        ru: "Я директор."
        source: { kind: translated, id: 13782585 }
      - pl: "Zostałem dyrektorem."
        ru: "Я стал директором."
        source: { kind: translated, id: 364378 }
      - pl: "Tom jest dyrektorem oddziału."
        ru: "Том — директор отделения."
        source: { kind: translated, id: 7911140 }
  - id: address
    ru: "panie dyrektorze — обращение «господин директор»"
    examples:
      - pl: "Panie dyrektorze, wyszła mgła."
        ru: "Господин директор, появился туман."
        source: { kind: tatoeba, id: 1736190 }
      - pl: "Zrobiła dobre wrażenie na dyrektorze banku."
        ru: "Она произвела хорошее впечатление на директора банка."
        source: { kind: translated, id: 366606 }
      - pl: "Dzień dobry, panie dyrektorze!"
        ru: "Здравствуйте, господин директор!"
        source: { kind: authored }
notes:
  - { kind: government, text: "Быть директором требует творительного падежа: Jestem dyrektorem, Został dyrektorem. Это общее польское правило для названий профессий." }
  - { kind: usage, text: "В обращении обязателен звательный падеж вместе с pan: Panie dyrektorze! Одно dyrektorze без pan звучит грубо." }
  - { kind: usage, text: "Множественное число мужского лица — dyrektorzy, с чередованием r в rz. Женская форма — dyrektorka или pani dyrektor." }
  - { kind: false-friend, text: "Значение совпадает с русским «директор», но слово одушевлённое, поэтому винительный равен родительному: widzę dyrektora «вижу директора»." }
collocations:
  - { pl: "dyrektor szkoły", ru: "директор школы" }
  - { pl: "zostać dyrektorem", ru: "стать директором" }
  - { pl: "panie dyrektorze", ru: "господин директор" }
etymology: "Через немецкое Direktor из латинского director «управляющий», от dirigere «направлять». Русское «директор» пришло тем же путём."
memory: "dyrektor — «директор». Главное: быть им — творительный падеж (Jestem dyrektorem), обращаться — звательный вместе с pan (Panie dyrektorze!), а множественное — dyrektorzy, с чередованием r в rz."
idioms:
  - { pl: "dyrektor szkoły", ru: "директор школы" }
  - { pl: "zostać dyrektorem", ru: "стать директором" }
  - { pl: "panie dyrektorze", ru: "господин директор" }
