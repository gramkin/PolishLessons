# review
id: dziedzic
format: 2
lemma: "dziedzic"
rank: 5415
pos: noun
pron: { cyr: "дзе́дзиц" }
senses:
  - id: heir
    ru: "наследник (титула, рода, престола)"
    examples:
      - pl: "Król nie miał dziedzica."
        ru: "У короля не было наследника."
        source: { kind: authored }
      - pl: "Dziedzic tronu przybył do stolicy."
        ru: "Наследник престола прибыл в столицу."
        source: { kind: authored }
      - pl: "To dziedzic wielkiego rodu."
        ru: "Это наследник великого рода."
        source: { kind: authored }
  - id: squire
    ru: "помещик, барин (историческое)"
    examples:
      - pl: "Dziedzic mieszkał w dworze."
        ru: "Барин жил в усадьбе."
        source: { kind: authored }
      - pl: "Chłopi bali się dziedzica."
        ru: "Крестьяне боялись помещика."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Два значения: «наследник» титула или рода и историческое «помещик, барин» — владелец имения." }
  - { kind: false-friend, text: "Не путайте со spadkobierca: тот наследует имущество по закону, а dziedzic — титул, род, землю. По-русски оба будут «наследник»." }
  - { kind: government, text: "Мужско-личный род: винительный совпадает с родительным — widzę dziedzica." }
  - { kind: usage, text: "Женская форма — dziedziczka; глагол — dziedziczyć «наследовать»." }
  - { kind: government, text: "Два именительных множественного: обычное dziedzice и почтительное dziedzicowie. Окончание -owie сочетается с титулами и званиями, поэтому здесь оно возможно, а с бранными словами — нет." }
collocations:
  - { pl: "dziedzic tronu", ru: "наследник престола" }
  - { pl: "dziedzic fortuny", ru: "наследник состояния" }
etymology: "От dziad «дед» через dziedzina «отчина, владение»: тот, кому достаётся дедовское. Ср. русское «дед», «наследие»."
memory: "dziedzic — наследник рода и титула, а в старом смысле «помещик». Корень dziad «дед». Наследник имущества по закону — это spadkobierca."
idioms:
  - { pl: "dziedzic tronu", ru: "наследник престола" }
