pos: noun
pron: { cyr: "пэрфу́мы" }
senses:
  - id: perfume
    ru: "духи, парфюм"
    examples:
      - pl: "Dostała perfumy na urodziny."
        ru: "Ей подарили духи на день рождения."
        source: { kind: authored }
      - pl: "Te perfumy pachną wanilią."
        ru: "Эти духи пахнут ванилью."
        source: { kind: authored }
      - pl: "Psiknęła się perfumami przed wyjściem."
        ru: "Перед выходом она брызнулась духами."
        source: { kind: authored }
  - id: scent
    ru: "запах духов"
    examples:
      - pl: "W windzie czuć było jej perfumy."
        ru: "В лифте чувствовался запах её духов."
        source: { kind: authored }
      - pl: "Zapach perfum unosił się w pokoju."
        ru: "Запах духов стоял в комнате."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "PERFUMY — «духи», и только во множественном: TE PERFUMY SĄ DROGIE. Русскому «духи» соответствуют именно PERFUMY, а польские DUCHY — «духи, призраки». Магазин духов и косметики — PERFUMERIA." }
  - { kind: usage, text: "Пять форм, только множественное число. Родительный — PERFUM, без окончания: FLAKON PERFUM. Глагол при нём во множественном: PERFUMY PACHNĄ." }
  - { kind: government, text: "Надушиться — SKROPIĆ SIĘ PERFUMAMI, творительный. Флакон духов — FLAKON PERFUM, родительный. Пахнуть духами — PACHNIEĆ PERFUMAMI, творительный." }
  - { kind: pronunciation, text: "Читается «пэрфу́мы», три слога, ударение на втором. E после P твёрдое, «э». В родительном PERFUM: «пэ́рфум»." }
collocations:
  - { pl: "flakon perfum", ru: "флакон духов" }
  - { pl: "drogie perfumy", ru: "дорогие духи" }
  - { pl: "zapach perfum", ru: "запах духов" }
family:
  - { pl: "perfumeria", ru: "парфюмерный магазин", relation: derived }
  - { pl: "perfumować", ru: "душить, ароматизировать", relation: derived }
  - { pl: "perfumowany", ru: "надушенный, ароматизированный", relation: derived }
etymology: "Из французского PARFUM, от латинского «сквозь дым»: первые благовония курили. Русский взял то же слово как «парфюм», но обиходным для духов осталось «духи», а польский сделал PERFUMY основным словом."
memory: "Perfumy — духи, только во множественном. Читается «пэрфу́мы». Flakon perfum — флакон духов. Duchy — не духи, а призраки! Perfumeria — парфюмерный магазин."
idioms:
