  - { kind: government, text: "Что — винительный, чем — творительный без предлога: NACECHOWAĆ TEKST IRONIĄ, NACECHOWANY NIEUFNOŚCIĄ. Русское «проникнутый» требует того же падежа." }
  - { kind: register, text: "Книжное слово, частое в лингвистике: WYRAZ NACECHOWANY «стилистически окрашенное слово», NACECHOWANIE EMOCJONALNE «эмоциональная окраска», в противоположность NIENACECHOWANY «нейтральный»." }
  - { kind: pronunciation, text: "C читается «ц», CH — «х»: «нацэхо́ваць». В будущем времени -OWAĆ меняется на -UJ-: NACECHUJĘ — «нацэху́йэ»." }
