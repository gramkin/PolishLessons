# review
id: informacja
format: 2
lemma: "informacja"
rank: 495
pos: noun
pron: { cyr: "информа́цья" }
senses:
  - id: information
    ru: "информация, сведение"
    examples:
      - pl: "To przydatna informacja."
        ru: "Это полезная информация."
        source: { kind: translated, id: 914925 }
      - pl: "Obiecał, że dostarczy informacji."
        ru: "Он обещал предоставить информацию."
        source: { kind: tatoeba, id: 359370 }
      - pl: "Potrzebuję informacji."
        ru: "Мне нужна информация."
        source: { kind: translated, id: 10574828 }
  - id: news
    ru: "сведения, новости (во множественном числе)"
    examples:
      - pl: "Znalazłaś jakieś ciekawe informacje?"
        ru: "Ты нашла какую-нибудь интересную информацию?"
        source: { kind: tatoeba, id: 4606104 }
      - pl: "Gdzie jest ta kartka z informacjami?"
        ru: "Где та карточка со сведениями?"
        source: { kind: translated, id: 1399477 }
      - pl: "Dzięki za informację."
        ru: "Спасибо за информацию."
        source: { kind: translated, id: 1185439 }
notes:
  - { kind: usage, text: "Dzięki za informację — «Спасибо за информацию», готовая вежливая формула." }
  - { kind: usage, text: "Множественное informacje часто значит «сведения, новости»: ciekawe informacje «интересные сведения»." }
  - { kind: usage, text: "Родительный падеж единственного и множественного числа совпадают: informacji." }
  - { kind: usage, text: "Слово латинское — informatio «разъяснение», от informare «придавать форму». Русское «информация» — то же заимствование." }
collocations:
  - { pl: "dzięki za informację", ru: "спасибо за информацию" }
  - { pl: "przydatna informacja", ru: "полезная информация" }
  - { pl: "punkt informacji", ru: "справочная" }
  - { pl: "potrzebuję informacji", ru: "мне нужна информация" }
etymology: "Из латинского informatio «разъяснение», от informare «придавать форму». Русское «информация» — то же самое заимствование."
memory: "informacja — «информация», прямое латинское заимствование, как и русское слово, так что узнаётся сразу. Запомнить стоит одно: родительный единственного и множественного совпадают — informacji."
idioms:
  - { pl: "dzięki za informację", ru: "спасибо за информацию" }
  - { pl: "przydatna informacja", ru: "полезная информация" }
  - { pl: "punkt informacji", ru: "справочная" }
formExamplesSkip:
  - { form: "informacyj", reason: "устаревший вариант родительного падежа множественного числа; нормативная форма — informacji, и в корпусе informacyj не встречается" }
