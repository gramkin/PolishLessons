notes:
  - { kind: usage, text: "Это совершенная пара к DOMYŚLAĆ SIĘ из партии 256, и разница ровно та, что между «догадываться» и «догадаться»: DOMYŚLAŁEM SIĘ — я догадывался, подозревал, а DOMYŚLIŁEM SIĘ — догадался, понял. Как и несовершенный, этот глагол живёт только с SIĘ: DOMYŚLIĆ без SIĘ в польском не употребляется, и поэтому все сорок две формы в карточке даны с SIĘ." }
  - { kind: usage, text: "Сорок две формы — и это ровно та клетка таблицы, которую словарь до сих пор знал только в теории: совершенный непереходный. Складывается она просто: сорок одна основная форма плюс деепричастие DOMYŚLIWSZY. Страдательных причастий нет, потому что глагол возвратный и дополнения в винительном не берёт; действительного причастия нет, потому что вид совершенный. Сравните с несовершенным DOMYŚLAĆ SIĘ, у которого в таблице шестьдесят три формы и одиннадцать из них пришлось пропустить именно как страдательные." }
  - { kind: pronunciation, text: "Повелительное DOMYŚL — хорошая проверка правила, исправленного в партии 259. Берём третье лицо DOMYŚLI, отбрасываем -i, остаётся DOMYŚL. Основа кончается сочетанием -śl, и кажется, что оно требует вставки -ij. Но правило спрашивает не про сочетание, а про то, может ли им закончиться польское слово, — и MYŚL «мысль» отвечает на это само: может. Поэтому DOMYŚL, а не небывалое DOMYŚLIJ. Сравните с WALNĄĆ, где основа WALN- словом кончиться не может, и выходит WALNIJ." }
  - { kind: government, text: "Управление то же, что у несовершенной пары: родительный без предлога — DOMYŚLIĆ SIĘ CZEGOŚ. DOMYŚLIŁEM SIĘ PRAWDY значит «я догадался о правде», и предлога «о» здесь нет. Можно и с союзом: DOMYŚLIŁA SIĘ, ŻE KŁAMIE. Обиходный оборот JAK ŁATWO SIĘ DOMYŚLIĆ — «как легко догадаться» — стоит знать целиком, он встречается в речи и на письме постоянно." }
