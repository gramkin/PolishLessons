  - { pl: "myśleć", ru: "думать", relation: root, id: myslec }
  - { pl: "domysł", ru: "догадка", relation: derived }
etymology: "Приставка do- и MYŚLIĆ, старая форма от MYŚLEĆ «думать», из праславянского *mysliti — то же, что русское «мыслить». Буквально «додумать до конца», откуда «догадаться». Русское «домыслить» собрано из тех же частей, только в русском оно отдаёт произволом, а в польском значит простую догадку. Из гнезда DOMYSŁ «догадка», DOMYŚLNY «догадливый» и «по умолчанию», DOMYŚLNOŚĆ «догадливость»."
memory: "Совершенная пара к domyślać się: догадывался — domyślałem się, догадался — domyśliłem się. Только с SIĘ и только с родительным, без всякого «о»."
