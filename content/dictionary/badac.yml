# review
id: badac
format: 2
lemma: "badać"
rank: 1846
pos: verb
aspect: imperf
pron: { cyr: "ба́даць" }
senses:
  - id: investigate
    ru: "расследовать, изучать"
    examples:
      - pl: "Policja bada tę sprawę."
        ru: "Полиция расследует это дело."
        source: { kind: translated, id: 410002 }
      - pl: "Policja bada przyczyny tego wypadku."
        ru: "Полиция расследует причины этой аварии."
        source: { kind: translated, id: 771736 }
      - pl: "Badamy tą sprawę."
        ru: "Мы расследуем этот инцидент."
        source: { kind: tatoeba, id: 13782758 }
  - id: research-examine
    ru: "исследовать; осматривать (пациента)"
    examples:
      - pl: "On bada literaturę japońską."
        ru: "Он изучает японскую литературу."
        source: { kind: translated, id: 731883 }
      - pl: "Uczeni badają obecnie dno oceanu."
        ru: "Учёные сейчас исследуют дно океана."
        source: { kind: translated, id: 542062 }
      - pl: "Proszę uspokoić psa, kiedy go będę badał."
        ru: "Успокойте, пожалуйста, собаку, пока я буду её осматривать."
        source: { kind: translated, id: 590875 }
notes:
  - { kind: usage, text: "Слово покрывает сразу научное исследование, полицейское расследование и врачебный осмотр: badać sprawę, badać literaturę, badać pacjenta." }
  - { kind: government, text: "Исследовать что-то — badać coś, прямо в винительном падеже, без предлога." }
  - { kind: usage, text: "Существительное badanie значит и «исследование», и «медицинское обследование»: badanie lekarskie «медосмотр»." }
  - { kind: usage, text: "Совершенный вид — zbadać. Прилагательное badawczy «исследовательский»." }
collocations:
  - { pl: "badać sprawę", ru: "расследовать дело" }
  - { pl: "badanie lekarskie", ru: "медицинский осмотр" }
  - { pl: "badać pacjenta", ru: "осматривать пациента" }
family:
  - { pl: "zbadać", ru: "исследовать, осмотреть", relation: root }
  - { pl: "badanie", ru: "исследование", relation: root }
  - { pl: "sprawdzić", ru: "проверить", relation: root, id: sprawdzic }
etymology: "Праславянское *badati «исследовать, колоть» — родственно русскому «бодать». Значение «исследовать» развилось из «прощупывать»."
memory: "badać — «исследовать», и научно, и полицейски, и врачебно: badać sprawę, badać pacjenta. Прямо с винительным, без предлога. Совершенный вид — zbadać."
idioms:
