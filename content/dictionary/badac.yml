    source: { kind: translated, id: 525810 }
  - form: "badająca"
    pl: "Archeologia to nauka badająca działalność człowieka i jej zmiany na podstawie śladów przez niego pozostawionych."
    ru: "Археология — наука, изучающая деятельность человека по следам."
    source: { kind: translated, id: 3461232 }
  - form: "badająca"
