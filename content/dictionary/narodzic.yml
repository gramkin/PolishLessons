      - pl: "Narodziła się w czasie wojny i nigdy nie poznała ojca."
        ru: "Она родилась во время войны и никогда не знала отца."
        source: { kind: authored }
      - pl: "Narodziło się wtedy całe pokolenie bez dziadków."
        ru: "Тогда родилось целое поколение без дедов."
        source: { kind: authored }
  - id: give-rise
    ru: "породить, дать начало"
    examples:
      - pl: "Ten spór narodził nową szkołę w prawie."
        ru: "Этот спор породил новую школу в праве."
        source: { kind: authored }
      - pl: "Z tej rozmowy narodził się cały projekt."
        ru: "Из этого разговора родился весь проект."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Это слово приподнятое, и в быту его почти не услышишь. О рождении человека в обычной речи скажут URODZIĆ SIĘ: URODZIŁEM SIĘ W MOSKWIE. NARODZIĆ SIĘ звучит торжественно и годится для исторического или религиозного контекста — NARODZIŁ SIĘ CHRYSTUS, NARODZIŁA SIĘ NOWA RZECZPOSPOLITA, — а также для переносного рождения идеи или движения: NARODZIŁ SIĘ POMYSŁ. Выбирать между ними надо по тону, а не по смыслу: значение у них одно." }
  - { kind: false-friend, text: "Русское «народиться» существует, но звучит просторечно и редко, тогда как польское NARODZIĆ SIĘ принадлежит высокому слогу — расхождение в регистре прямо противоположное ожидаемому. Зато существительное NARODZINY «рождение» вполне обиходно: NARODZINY DZIECKA, NARODZINY NIEPODLEGŁOŚCI. И не надо путать его с NARÓD «народ»: слова похожи и действительно родственны, но NARÓD — это «народ», а NARODZINY — «рождение»." }
  - { kind: government, text: "Возвратное NARODZIĆ SIĘ почти всегда идёт с SIĘ и без дополнения: кто родился, где, когда. Где — предлог W с местным (W KRAKOWIE) или NA с местным (NA WSI). Когда — W с местным для года, а для переносного рождения идеи — предлог Z с родительным: Z TEJ ROZMOWY NARODZIŁ SIĘ PROJEKT. Невозвратное NARODZIĆ COŚ встречается реже и означает «породить», с прямым винительным." }
  - { kind: pronunciation, text: "Основа та же, что у RODZIĆ, и настоящее время у неё на -Ę, -ISZ: NARODZĘ, NARODZISZ, NARODZI. В прошедшем времени мены нет, корень держит o во всех формах: NARODZIŁ, NARODZIŁA, NARODZILI. Сочетание DZI читается мягко, «дзи», так что всё слово звучит «наро́дзиць». Ударение на предпоследнем слоге." }
collocations:
