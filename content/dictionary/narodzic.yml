senses:
  - id: be-born
    ru: "родиться (возвратное narodzić się)"
    examples:
      - pl: "Narodził się w Krakowie w tysiąc dziewięćset trzecim roku."
        ru: "Он родился в Кракове в тысяча девятьсот третьем году."
