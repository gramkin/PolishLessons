  - { pl: "narodziny", ru: "рождение", relation: derived }
  - { pl: "naród", ru: "народ", relation: root, id: narod }
etymology: "Приставка na- и RODZIĆ, из праславянского *roditi — того же корня, что русское «родить», «род», «народ». Польское гнездо широкое и прозрачное: RÓD «род», RODZINA «семья», RODZICE «родители», NARÓD «народ», NARODZINY «рождение», URODZAJ «урожай». Приставка na- в NARODZIĆ SIĘ отмечает появление на свет как завершённое событие, и русский построил «народиться» точно так же — только оставил слово в просторечии, тогда как польский поднял его в высокий слог. Отсюда и NARODZENIE в названии праздника: BOŻE NARODZENIE — «Рождество»."
memory: "narodzić się — торжественное «родиться»: в быту говорят urodzić się. А Boże Narodzenie — «Рождество», буквально «Божье рождение»."
idioms:
