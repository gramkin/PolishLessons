# review
id: spalic
format: 2
lemma: "spalić"
rank: 1631
pos: verb
aspect: perf
aspectPair: palic
pron: { cyr: "спа́лиць" }
senses:
  - id: burn
    ru: "сжечь"
    examples:
      - pl: "A potem spalił wszystko."
        ru: "А потом он всё сжёг."
        source: { kind: tatoeba, id: 7180695 }
      - pl: "Szpieg spalił dokumenty."
        ru: "Шпион сжёг документы."
        source: { kind: translated, id: 722234 }
      - pl: "Spaliłem wszystkie swoje stare książki."
        ru: "Я сжёг все свои старые книги."
        source: { kind: tatoeba, id: 12710029 }
  - id: burn-down
    ru: "сгореть (с się)"
    examples:
      - pl: "Nasza szkoła spaliła się."
        ru: "Наша школа сгорела."
        source: { kind: translated, id: 608352 }
      - pl: "Dom się spalił doszczętnie."
        ru: "Дом сгорел дотла."
        source: { kind: translated, id: 6156481 }
      - pl: "Ten dom spalił się całkowicie w pożarze."
        ru: "Этот дом полностью сгорел в пожаре."
        source: { kind: translated, id: 532147 }
notes:
  - { kind: false-friend, text: "Форма spali почти всегда принадлежит другому глаголу — spać «спать»: Wszyscy spali «Все спали», Nie spali całą noc «Они не спали всю ночь». К spalić она относится редко (Chwyć mięso, zanim się spali)." }
  - { kind: government, text: "Требует винительного падежа: spalić dokumenty «сжечь документы». С się значит «сгореть»: dom się spalił «дом сгорел»." }
  - { kind: usage, text: "Несовершенный вид — palić, который значит ещё и «курить»: palić papierosy «курить сигареты»." }
  - { kind: usage, text: "Переносно: spalić za sobą mosty «сжечь за собой мосты», spalić się na słońcu «обгореть на солнце»." }
collocations:
  - { pl: "spalić dokumenty", ru: "сжечь документы" }
  - { pl: "spalić się", ru: "сгореть" }
  - { pl: "spalić za sobą mosty", ru: "сжечь за собой мосты" }
etymology: "Приставка s- + palić «жечь», праславянское *paliti. Русское «спалить» — то же слово с той же приставкой и тем же значением."
memory: "spalić = «сжечь», с się — «сгореть». Несовершенный вид — palić, который значит ещё и «курить». Осторожно: форма spali в текстах чаще всего от spać «спать» — Wszyscy spali «Все спали»."
