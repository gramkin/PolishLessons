# review
id: automat
format: 2
lemma: "automat"
rank: 4514
pos: noun
pron: { cyr: "ауто́мат" }
senses:
  - id: machine
    ru: "автомат (торговый, билетный, игровой)"
    examples:
      - pl: "Kupiłem kawę z automatu."
        ru: "Я купил кофе в автомате."
        source: { kind: authored }
      - pl: "Automat zjadł moją monetę."
        ru: "Автомат проглотил мою монету."
        source: { kind: authored }
      - pl: "Bilety kupisz w automacie na peronie."
        ru: "Билеты купишь в автомате на перроне."
        source: { kind: authored }
  - id: automatic-car
    ru: "машина с автоматической коробкой (разг.)"
    examples:
      - pl: "Nowy samochód ma automat."
        ru: "У новой машины автоматическая коробка."
        source: { kind: authored }
      - pl: "Prawo jazdy zrobiła na automacie."
        ru: "Права она получила на машине с автоматом."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Польский AUTOMAT — то же, что русский «автомат»: торговый, игровой, билетный. Но есть два обиходных значения. Машина с автоматической коробкой — тоже AUTOMAT: JEŹDZIĆ AUTOMATEM. А Z AUTOMATU значит «автоматически, само собой, по умолчанию»: DOSTAŁ PODWYŻKĘ Z AUTOMATU — «прибавку ему дали автоматически»." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. В местном падеже T переходит в CI: W AUTOMACIE. Родительный — AUTOMATU." }
  - { kind: government, text: "Кофе из автомата — KAWA Z AUTOMATU, родительный после Z. В автомате — W AUTOMACIE, местный. Ездить на автомате — JEŹDZIĆ AUTOMATEM, творительный без предлога." }
  - { kind: pronunciation, text: "Читается «ауто́мат», три слога, ударение на втором. AU звучит как «ау», а не «ав»: так же AUTOBUS — «ауто́бус». В местном падеже AUTOMACIE сочетание CI звучит мягко: «аутома́це»." }
  - { kind: register, text: "Слово нейтральное. MÓWIĆ JAK AUTOMAT — «говорить как робот, машинально». В разговоре Z AUTOMATU — ещё и «с ходу, не раздумывая»: ODPOWIEDZIAŁ Z AUTOMATU." }
collocations:
  - { pl: "automat do kawy", ru: "кофейный автомат" }
  - { pl: "automat biletowy", ru: "билетный автомат" }
  - { pl: "automat z napojami", ru: "автомат с напитками" }
family:
  - { pl: "automatyczny", ru: "автоматический", relation: derived }
  - { pl: "automatycznie", ru: "автоматически", relation: derived }
  - { pl: "automatyzacja", ru: "автоматизация", relation: derived }
etymology: "Из греческого слова со значением «самодвижущийся», через латынь и французский. Русский «автомат» — то же слово, только греческое AU русский прочёл как «ав», а польский сохранил «ау»."
memory: "Automat — автомат: kawa z automatu, bilet z automatu. Читается «ауто́мат», с «ау». Jeździć automatem — ездить на автомате. Z automatu — автоматически, по умолчанию. Mówić jak automat — говорить как робот."
idioms:
  - { pl: "z automatu", ru: "автоматически, по умолчанию; с ходу" }
  - { pl: "mówić jak automat", ru: "говорить как робот, машинально" }
