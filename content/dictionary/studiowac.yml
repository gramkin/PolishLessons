pron: { cyr: "студьо́ваць" }
senses:
  - id: at-university
    ru: "учиться в вузе, изучать (предмет)"
    examples:
      - pl: "Studiuję prawo na drugim roku."
        ru: "Я на втором курсе юридического."
        source: { kind: authored }
      - pl: "Studiował w Krakowie pięć lat."
        ru: "Он учился в Кракове пять лет."
        source: { kind: authored }
  - id: examine-closely
    ru: "изучать, внимательно рассматривать"
    examples:
      - pl: "Studiował mapę przez godzinę."
        ru: "Он изучал карту час."
        source: { kind: authored }
      - pl: "Studiuje menu, jakby to był traktat."
        ru: "Он изучает меню, будто это трактат."
        source: { kind: authored }
  - id: studying
    ru: "изучение, учёба (отглаг.)"
    examples:
      - pl: "Studiowanie prawa wymaga cierpliwości."
        ru: "Изучение права требует терпения."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "STUDIOWAĆ — ЭТО НЕ ПРОСТО «УЧИТЬСЯ». Так говорят об учёбе в вузе и о предмете: studiuję prawo, studiuję medycynę. Вопрос CO STUDIUJESZ? означает «на каком факультете ты учишься». А обычное «учиться, учить что-то» — это UCZYĆ SIĘ: uczę się polskiego. Сказать studiuję polskiego нельзя, хотя studiuję polonistykę — можно." }
  - { kind: usage, text: "Существительное STUDIA в значении «учёба в вузе» существует только во множественном числе, как odwiedziny и przeprosiny: idę na studia, jestem na studiach, skończyłem studia. Единственное studium значит «исследование» или «этюд» и к учёбе не относится." }
  - { kind: usage, text: "Основа настоящего времени идёт на -uj-, как у всех глаголов на -ować: studiuję, studiujesz, studiuje, studiują. Вид несовершенный: есть studiując и studiujący, формы на -wszy нет. Настоящей совершенной пары в значении «учиться в вузе» у глагола нет; PRZESTUDIOWAĆ значит «изучить насквозь», о тексте, а не об университете." }
collocations:
  - { pl: "studiować prawo", ru: "учиться на юридическом" }
  - { pl: "być na studiach", ru: "учиться в вузе" }
  - { pl: "studiować mapę", ru: "изучать карту" }
family:
  - { pl: "student", ru: "студент", relation: derived, id: student }
  - { pl: "studia", ru: "учёба в вузе", relation: derived }
  - { pl: "uczyć", ru: "учить", relation: root, id: uczyc }
etymology: "Из латинского studere «усердно заниматься, стремиться», откуда studium «усердие, занятие». Через средневековые университеты слово разошлось по Европе и дало русские «студент» и книжное «студировать». Русский предпочёл для самого действия свои слова — «учиться» и «изучать»."
memory: "studiować — «учиться в вузе» или «изучать предмет»: studiuję prawo. Обычное «учиться» это uczyć się. И запомни studia только во множественном: na studiach. Основа настоящего на -uj-: studiuję."
idioms:
  - { pl: "Co studiujesz?", ru: "На каком факультете ты учишься?" }
  - { pl: "studiować coś na pamięć", ru: "изучать что-л. досконально" }
