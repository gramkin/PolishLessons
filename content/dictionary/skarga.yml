etymology: "От глагола SKARŻYĆ, из праславянского *skъrzati, связанного с корнем *skъrb- «забота, печаль». Надёжно в гнездо входят SKARŻYĆ, SKARGA, OSKARŻYĆ, OSKARŻENIE. Русское «жалоба» построено от «жалеть», то есть от сочувствия, а польское от обвинения: жалующийся не просит жалости, а указывает на виновного. Разница в образе объясняет, почему в польском один и тот же корень дал и бытовую жалобу, и судебное обвинение, тогда да в русском «жалоба» и «обвинение» стоят далеко друг от друга."
memory: "Родни в русском нет: skarga от skarżyć «обвинять», а «жалоба» от «жалеть» — разные образы. Поэтому один польский корень даёт и жалобу, и обвинение: skarga, oskarżyć, oskarżony. Жаловаться на что-то — skarżyć się NA coś, как по-русски. В дательном и местном g переходит в dz: w skardze, как w usłudze."
