notes:
  - { kind: false-friend, text: "Русского однокоренного слова здесь нет, и это стоит знать заранее: SKARGA идёт от SKARŻYĆ «жаловаться, обвинять», а русская «жалоба» — от «жалеть». Корни разные, и совпадений не будет. Зато гнездо прозрачно внутри польского: SKARŻYĆ SIĘ «жаловаться на что-то», SKARGA «жалоба», OSKARŻYĆ «обвинить», OSKARŻONY «обвиняемый», и последнее уже встречалось как существительное-причастие. Поэтому ряд SKARGA, OSKARŻENIE, OSKARŻONY стоит держать вместе: это один корень в бытовом, процессуальном и личном значении." }
  - { kind: pronunciation, text: "Читается «ска́рга», ударение на первом слоге из двух. Буква G твёрдая, как в русском. Главное в карточке — дательный и местный падеж SKARDZE, где G переходит в DZ: «ска́рдзе». Это то же чередование, что в OBSŁUGA и OBSŁUDZE, USŁUGA и USŁUDZE, FLAGA и FLADZE. В родительном множественного SKARG никакой вставной гласной нет, в отличие от IGŁA и IGIEŁ, потому что группа RG на конце слова произносима." }
  - { kind: government, text: "Женский род на -A, склонение правильное. Винительный на -Ę: ZŁOŻYĆ SKARGĘ «подать жалобу». На кого или на что жалоба — предлог NA с винительным: SKARGA NA SĄSIADA, SKARGA NA DECYZJĘ. Куда подают — предлог DO с родительным: SKARGA DO SĄDU, DO URZĘDU. Сам глагол требует предлога NA с винительным: SKARŻYĆ SIĘ NA HAŁAS, и русский здесь говорит «жаловаться на шум», так что конструкция переносится полностью." }
  - { kind: usage, text: "В быту слово нейтральное, в суде — термин, и формы его стоит знать: SKARGA KASACYJNA «кассационная жалоба», SKARGA ADMINISTRACYJNA, SKARGA KONSTYTUCYJNA «жалоба в Конституционный суд». Подача описывается глаголом ZŁOŻYĆ, не DAĆ: ZŁOŻYĆ SKARGĘ. Отдельно стоит KSIĄŻKA SKARG I WNIOSKÓW «книга жалоб и предложений», вывеска, которую в Польше ещё можно встретить в старых учреждениях, и русскому она знакома дословно." }
collocations:
