# review
id: prosty
format: 2
lemma: "prosty"
rank: 114
pos: adj
pron: { cyr: "про́сты" }
senses:
  - id: simple
    ru: "простой, несложный"
    examples:
      - pl: "Ta gra jest prosta."
        ru: "Эта игра простая."
        source: { kind: tatoeba, id: 3649651 }
      - pl: "To nie takie proste."
        ru: "Это не так просто."
        source: { kind: tatoeba, id: 6406169 }
      - pl: "No dalej, Tom! To proste zadanie arytmetyczne!"
        ru: "Ну же, Том! Это же простая арифметическая задача!"
        source: { kind: tatoeba, id: 13783075 }
  - id: straight
    ru: "прямой; простой (без затей)"
    examples:
      - pl: "Narysuj linię prostą."
        ru: "Нарисуй прямую линию."
        source: { kind: tatoeba, id: 591798 }
      - pl: "Tom prowadzi proste życie."
        ru: "Том ведёт простую жизнь."
        source: { kind: tatoeba, id: 8774153 }
      - pl: "Wyjaśnij to prostymi słowami."
        ru: "Объясни это простыми словами."
        source: { kind: tatoeba, id: 363552 }
notes:
  - { kind: usage, text: "prosty значит и «простой», и «прямой»: linia prosta «прямая линия», prosta sprawa «простое дело»." }
  - { kind: usage, text: "Степени сравнения — prostszy и najprostszy. Форм вроде «prościejszy» в языке нет, хотя словари их иногда перечисляют." }
  - { kind: usage, text: "Наречие po prostu значит «просто, попросту»: Po prostu nie wiem «Я просто не знаю»." }
collocations:
  - { pl: "po prostu", ru: "просто" }
  - { pl: "prosta sprawa", ru: "простое дело" }
  - { pl: "linia prosta", ru: "прямая линия" }
  - { pl: "wyjść na prostą", ru: "выкарабкаться, наладить жизнь (выйти на прямую)" }
etymology: "Праславянское *prostъ — то же слово, что русское «простой»; исходное значение «прямой, несогнутый» сохранилось в linia prosta."
memory: "prosty — и «простой», и «прямой»: prosta sprawa «простое дело», linia prosta «прямая линия». Степени — prostszy, najprostszy. И po prostu значит «просто»."
idioms:
  - { pl: "prosty jak drut", ru: "проще простого" }
  - { pl: "wyjść na prostą", ru: "выкарабкаться, наладить жизнь (выйти на прямую)" }
  - { pl: "prosty jak budowa cepa", ru: "проще пареной репы" }
