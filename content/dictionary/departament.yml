notes:
  - { kind: false-friend, text: "В ПОЛЬШЕ DEPARTAMENT — ЭТО ЧАСТЬ МИНИСТЕРСТВА, А НЕ МИНИСТЕРСТВО. Польское министерство называется MINISTERSTWO, а departament это управление внутри него. Когда речь об Америке, слово значит именно министерство: Departament Stanu — Госдепартамент. Так что перевод зависит от страны." }
  - { kind: usage, text: "Предложный — DEPARTAMENCIE, с переходом t→ci: w departamencie. Так же ведут себя ekspert → ekspercie и przedmiot → przedmiocie. Родительный единственного — departamentu, с окончанием -u, как у большинства неодушевлённых." }
  - { kind: pronunciation, text: "Пять слогов, ударение на предпоследнем: de-par-ta-MEN-t, точнее de-par-ta-MENT. Польское e открытое, как русское э: «дэпарта́мэнт». En перед t звучит как «эн», без носового призвука." }
collocations:
  - { pl: "Departament Stanu", ru: "Госдепартамент" }
  - { pl: "dyrektor departamentu", ru: "директор департамента" }
  - { pl: "w departamencie", ru: "в департаменте" }
family:
  - { pl: "ministerstwo", ru: "министерство", relation: root }
  - { pl: "minister", ru: "министр", relation: root }
  - { pl: "urząd", ru: "ведомство", relation: root }
etymology: "Из французского département «отделение», от départir «разделять», которое восходит к латинскому partire «делить» и pars «часть». То же слово дало русское «департамент», заимствованное при Петре. Корень part- виден в польском partia и część."
memory: "departament в Польше — управление внутри министерства, а само министерство это ministerstwo. Но Departament Stanu — это Госдепартамент, то есть министерство. Предложный — w departamencie, с t→ci."
idioms:
