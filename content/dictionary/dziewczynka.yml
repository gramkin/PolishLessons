# review
id: dziewczynka
format: 2
lemma: "dziewczynka"
rank: 638
pos: noun
pron: { cyr: "дзевчы́нка" }
senses:
  - id: girl-child
    ru: "девочка (ребёнок)"
    note: "Не путайте с dziewczyna «девушка» — это следующая ступень."
    examples:
      - pl: "Ciekawe, kim jest ta dziewczynka."
        ru: "Интересно, кто эта девочка."
        source: { kind: tatoeba, id: 12569942 }
      - pl: "Dziewczynka skacze."
        ru: "Девочка прыгает."
        source: { kind: translated, id: 869019 }
      - pl: "Dziewczynka ją lubi."
        ru: "Девочка её любит."
        source: { kind: translated, id: 13785885 }
  - id: plural
    ru: "dziewczynki — девочки"
    note: "Родительный множественного — dziewczynek, с беглым e."
    examples:
      - pl: "Wszystkie dziewczynki otrzymały nagrodę."
        ru: "Все девочки получили награду."
        source: { kind: translated, id: 723717 }
      - pl: "Dziewczynki siedziały obok siebie."
        ru: "Девочки сидели рядом."
        source: { kind: translated, id: 820805 }
      - pl: "W naszej szkole jest więcej dziewczynek niż chłopców."
        ru: "В нашей школе девочек больше, чем мальчиков."
        source: { kind: translated, id: 967064 }
  - id: as-a-girl
    ru: "małą dziewczynką — маленькой девочкой (творительный)"
    note: "«Быть кем-то» по-польски всегда творительный."
    examples:
      - pl: "Znam ją od wtedy, kiedy była małą dziewczynką."
        ru: "Я знаю её с тех пор, как она была маленькой девочкой."
        source: { kind: tatoeba, id: 3660858 }
      - pl: "Jesteś grzeczną dziewczynką."
        ru: "Ты послушная девочка."
        source: { kind: translated, id: 2197096 }
      - pl: "Ann jest małą dziewczynką."
        ru: "Анна — маленькая девочка."
        source: { kind: translated, id: 572627 }
notes:
  - { kind: false-friend, text: "Три ступени, которые легко спутать: dziewczynka «девочка» (ребёнок), dziewczyna «девушка» (и «подруга, девушка кого-то»), dziewczę «девица» (книжное). Русскому «девочка» отвечает именно dziewczynka." }
  - { kind: usage, text: "Это уменьшительное от dziewczyna с суффиксом -ka, работающим как русское «-очка». Мужская пара — chłopiec «мальчик»." }
  - { kind: government, text: "«Быть кем-то» требует творительного падежа: była małą dziewczynką «была маленькой девочкой», jesteś grzeczną dziewczynką." }
  - { kind: usage, text: "В родительном множественного появляется беглое e: dziewczynka — dziewczynek, как matka — matek." }
collocations:
  - { pl: "mała dziewczynka", ru: "маленькая девочка" }
  - { pl: "grzeczna dziewczynka", ru: "послушная девочка" }
  - { pl: "wiele dziewczynek", ru: "много девочек" }
  - { pl: "chłopiec", ru: "мальчик" }
family:
  - { pl: "dziewczyna", ru: "девушка", relation: root }
  - { pl: "dziewczę", ru: "девица", relation: derived }
  - { pl: "chłopiec", ru: "мальчик", relation: root }
etymology: "Уменьшительное от dziewczyna, а то — от dziewa «дева», праславянское *děva: то же гнездо, что русские «дева», «девушка», «девочка»."
memory: "dziewczynka — «девочка», и главное здесь не спутать ступени: dziewczynka это ребёнок, а dziewczyna — уже «девушка», в том числе «подруга». Суффикс -ka работает ровно как русское «-очка». Мужская пара — chłopiec. И запомните беглое e в родительном множественного: dziewczynka, но wiele dziewczynek."
idioms:
  - { pl: "mała dziewczynka", ru: "маленькая девочка" }
  - { pl: "grzeczna dziewczynka", ru: "послушная девочка" }
  - { pl: "wiele dziewczynek", ru: "много девочек" }
