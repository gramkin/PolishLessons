# review
id: opowiedziec
format: 2
lemma: "opowiedzieć"
rank: 724
pos: verb
aspect: perf
pron: { cyr: "оповедзе́ць" }
senses:
  - id: tell
    ru: "рассказать"
    examples:
      - pl: "Opowiedział mi ciekawą historię."
        ru: "Он рассказал мне интересную историю."
        source: { kind: tatoeba, id: 1627141 }
      - pl: "Opowiedz, jak to wszystko było."
        ru: "Расскажи, как всё было."
        source: { kind: tatoeba, id: 5659817 }
      - pl: "Możesz nam o tym opowiedzieć?"
        ru: "Ты можешь нам об этом рассказать?"
        source: { kind: translated, id: 9686245 }
  - id: tell-about
    ru: "opowiedzieć O czymś — рассказать о чём-л. (предложный)"
    examples:
      - pl: "Chcę, żebyś mi opowiedział o tym, co się zdarzyło."
        ru: "Я хочу, чтобы ты рассказал мне о том, что произошло."
        source: { kind: tatoeba, id: 6769142 }
      - pl: "Opowiedziała o skutkach swojej nieostrożności."
        ru: "Она рассказала о результате своей беспечности."
        source: { kind: tatoeba, id: 640297 }
      - pl: "Opowiem o tobie."
        ru: "Я расскажу о тебе."
        source: { kind: translated, id: 2827430 }
  - id: vs-odpowiedziec
    ru: "opowiedzieć «рассказать» ≠ odpowiedzieć «ответить»"
    note: "Слова отличаются одной буквой."
    examples:
      - pl: "Opowiem ci o Japonii."
        ru: "Я расскажу тебе о Японии."
        source: { kind: translated, id: 12564885 }
      - pl: "Opowiedz mi o tym, a potem odpowiedz na pytanie."
        ru: "Расскажи мне об этом, а потом ответь на вопрос."
        source: { kind: authored }
      - pl: "Opowiedział historię, ale nie odpowiedział na pytanie."
        ru: "Он рассказал историю, но не ответил на вопрос."
        source: { kind: authored }
  - id: tell-someone
    ru: "opowiedzieć KOMUŚ — рассказать кому-л. (дательный)"
    examples:
      - pl: "Opowiedziałem jemu historię."
        ru: "Я рассказал ему историю."
        source: { kind: tatoeba, id: 13633152 }
      - pl: "Ja im wszystko opowiedziałem."
        ru: "Я им всё рассказал."
        source: { kind: tatoeba, id: 6314037 }
      - pl: "Opowiedziała mi ciekawą historię."
        ru: "Она рассказала мне интересную историю."
        source: { kind: translated, id: 368958 }
notes:
  - { kind: false-friend, text: "Опаснейшая пара: opowiedzieć «рассказать» и odpowiedzieć «ответить» отличаются одной буквой. Opowiedz mi o tym «Расскажи мне об этом», но Odpowiedz mi «Ответь мне». Разводить их помогают приставки: o- значит «об, вокруг», od- — «от»." }
  - { kind: government, text: "Три падежа сразу: opowiedzieć KOMUŚ (дательный) O CZYMŚ (предложный), а что именно — винительный: opowiedzieć bratu o wakacjach, opowiedzieć historię." }
  - { kind: usage, text: "Спрягается как powiedzieć: opowiem, opowiesz, opowie, opowiemy, opowiecie, а в третьем лице множественного opowiedzą." }
  - { kind: usage, text: "С się слово меняет значение: opowiedzieć się ZA czymś — «высказаться за что-то», opowiedzieć się przeciw «высказаться против». Существительные — opowieść «повесть» и opowiadanie «рассказ»; несовершенный вид — opowiadać." }
collocations:
  - { pl: "opowiedzieć historię", ru: "рассказать историю" }
  - { pl: "opowiedzieć o czymś", ru: "рассказать о чём-либо" }
  - { pl: "opowiedzieć się za czymś", ru: "высказаться за что-либо" }
  - { pl: "opowiadać bajki", ru: "рассказывать сказки" }
family:
  - { pl: "opowiadać", ru: "рассказывать", relation: aspect }
  - { pl: "opowieść", ru: "повесть, рассказ", relation: derived }
  - { pl: "powiedzieć", ru: "сказать", relation: root }
  - { pl: "odpowiedzieć", ru: "ответить", relation: root }
etymology: "o- + powiedzieć «сказать», от wiedzieć «знать» — так же, как русское «рас-сказать» сделано от «сказать»."
memory: "opowiedzieć — «рассказать», и держать его надо рядом с odpowiedzieć «ответить»: слова отличаются одной буквой. Opowiedz mi o tym «Расскажи мне об этом», но Odpowiedz mi «Ответь мне». Управление тройное: opowiedzieć KOMUŚ o CZYMŚ. Спрягается как powiedzieć: opowiem, opowiesz, opowie, а в третьем лице множественного opowiedzą."
idioms:
  - { pl: "opowiedzieć historię", ru: "рассказать историю" }
  - { pl: "opowiedzieć się za czymś", ru: "высказаться за что-либо" }
  - { pl: "opowiadać bajki", ru: "рассказывать сказки" }
formExamplesSkip:
  - { form: "opowiedzenia", reason: "отглагольного существительного от opowiedzieć нет; «рассказ» — это opowieść или opowiadanie" }
  - { form: "opowiedzenie", reason: "отглагольного существительного от opowiedzieć нет; «рассказ» — это opowieść или opowiadanie" }
  - { form: "opowiedzeniem", reason: "отглагольного существительного от opowiedzieć нет; «рассказ» — это opowieść или opowiadanie" }
  - { form: "opowiedzeniu", reason: "отглагольного существительного от opowiedzieć нет; «рассказ» — это opowieść или opowiadanie" }
  - { form: "opowiedziani", reason: "страдательное причастие мужского лица не употребляется: рассказывают историю, а не людей" }
