id: wedzic
format: 2
lemma: "wędzić"
rank: 2393
pos: verb
aspect: imperf
pron: { cyr: "вэ́ндзиць" }
senses:
  - id: smoke-food
    ru: "коптить"
    examples:
      - pl: "Wędzą ryby nad olchowym dymem."
        ru: "Они коптят рыбу на ольховом дыму."
        source: { kind: authored }
      - pl: "Dziadek wędził szynkę sam."
        ru: "Дед коптил окорок сам."
        source: { kind: authored }
      - pl: "Tu się wędzi kiełbasy."
        ru: "Здесь коптят колбасы."
        source: { kind: authored }
  - id: cured
    ru: "копчёный (причастие wędzony)"
    examples:
      - pl: "Lubię wędzonego łososia."
        ru: "Я люблю копчёного лосося."
        source: { kind: authored }
      - pl: "Kupiliśmy wędzoną szynkę."
        ru: "Мы купили копчёный окорок."
        source: { kind: authored }
notes:
  - { kind: government, text: "Винительный падеж: wędzić ryby. Чем — творительный: wędzić dymem." }
  - {
      kind: false-friend,
      text: "Похожие на вид слова из разных гнёзд: wędka «удочка» и wędrować «странствовать» к копчению отношения не имеют. А вот wędlina «копчёности» и wędzarnia «коптильня» — прямая родня.",
    }
  - { kind: usage, text: "Причастие wędzony «копчёный» встречается намного чаще личных форм: wędzony łosoś, wędzona szynka." }
  - { kind: usage, text: "Wędzarnia — «коптильня». В корпусе глагол не встречается, поэтому все примеры составлены вручную." }
collocations:
  - { pl: "wędzić ryby", ru: "коптить рыбу" }
  - { pl: "wędzony łosoś", ru: "копчёный лосось" }
etymology: "Праславянское *vǫditi «коптить, вялить»; в русском прямого соответствия нет."
memory: "wędzić — «коптить». Чаще всего встретите причастие wędzony: wędzony łosoś «копчёный лосось». Коптильня — wędzarnia."
