# review
id: niszczyc
format: 2
lemma: "niszczyć"
rank: 1967
pos: verb
pron: { cyr: "ни́шчыць" }
senses:
  - id: destroy
    ru: "уничтожать, разрушать"
    examples:
      - pl: "Wojna niszczy wszystko."
        ru: "Война разрушает всё."
        source: { kind: authored }
      - pl: "Niszczyli dokumenty całą noc."
        ru: "Они уничтожали документы всю ночь."
        source: { kind: authored }
      - pl: "Niszczone akta trafiały do pieca."
        ru: "Уничтожаемые дела попадали в печь."
        source: { kind: authored }
  - id: wear-out
    ru: "портить, изнашивать (вещи, здоровье)"
    examples:
      - pl: "Niszczysz sobie buty takim chodzeniem."
        ru: "Ты так портишь себе обувь."
        source: { kind: authored }
      - pl: "Niszczy sobie zdrowie tą pracą."
        ru: "Он губит себе здоровье этой работой."
        source: { kind: authored }
  - id: destruction
    ru: "niszczenie — уничтожение, порча"
    examples:
      - pl: "Niszczenie dowodów jest przestępstwem."
        ru: "Уничтожение улик — преступление."
        source: { kind: authored }
      - pl: "Po latach niszczenia budynek nie nadawał się do remontu."
        ru: "После лет разрушения здание не годилось для ремонта."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ОБА ЯЗЫКА ПОСТРОИЛИ ЭТО СЛОВО ОТ «НИЧЕГО». Польское niszczyć идёт от nic «ничто», а русское «уничтожить» — от «ничто» же. Мысль одна: свести к нулю, обратить в ничто. Так что корень тут узнаваем, если вспомнить польское nic." }
  - { kind: register, text: "НО ОХВАТ У ПОЛЬСКОГО ШИРЕ. Niszczyć значит не только «уничтожать», но и попросту «портить, изнашивать»: niszczyć buty — «снашивать обувь», niszczyć zdrowie — «губить здоровье», niszczyć ubrania — «портить одежду». Там, где поляк обходится одним глаголом, русскому нужны «портить» и «изнашивать»." }
  - { kind: government, text: "Уничтожают ЧТО — винительный: niszczyć dokumenty, las, zdrowie. Возвратное niszczyć się значит «изнашиваться»: buty szybko się niszczą «обувь быстро изнашивается». Расхождений с русским в управлении нет." }
  - { kind: usage, text: "Вид несовершенный, совершенная пара — zniszczyć: niszczyli miasto przez tydzień «они разрушали город неделю», но zniszczyli je w jeden dzień «разрушили за один день». Причастие niszczony употребляется широко, а прилагательное zniszczony значит «потрёпанный, изношенный»." }
collocations:
  - { pl: "niszczyć zdrowie", ru: "губить здоровье" }
  - { pl: "niszczyć dowody", ru: "уничтожать улики" }
  - { pl: "niszczyć środowisko", ru: "разрушать окружающую среду" }
family:
  - { pl: "zniszczyć", ru: "уничтожить, разрушить", relation: aspect, id: zniszczyc }
  - { pl: "nic", ru: "ничто, ничего", relation: root, id: nic }
  - { pl: "zniszczenie", ru: "разрушение", relation: derived }
etymology: "От того же корня, что nic «ничто»: niszczyć буквально значит «обращать в ничто». Русское «уничтожить» собрано точно так же — из «ничто» с приставкой, — так что два языка независимо пришли к одному образу. Отсюда же zniszczenie «разрушение» и zniszczony «потрёпанный»."
memory: "niszczyć — «уничтожать», и корень тот же, что в nic «ничто»: свести к ничему, как русское «у-ничто-жить». Но польское слово шире: niszczyć buty значит просто «снашивать обувь», а niszczyć zdrowie — «губить здоровье»."
idioms:
  - { pl: "niszczyć sobie zdrowie", ru: "губить себе здоровье" }
  - { pl: "niszczyć dowody", ru: "уничтожать улики" }
