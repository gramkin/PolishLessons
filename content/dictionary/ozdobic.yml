# review
id: ozdobic
format: 2
lemma: "ozdobić"
rank: 5877
pos: verb
aspect: perf
pron: { cyr: "оздо́биць" }
senses:
  - id: decorate
    ru: "украсить (что-л. чем-л.)"
    examples:
      - pl: "Ozdobił dom na Święta."
        ru: "Он украсил дом к праздникам."
        source: { kind: translated, id: 13335488 }
      - pl: "Dzieci ozdobiły choinkę kolorowymi bombkami."
        ru: "Дети украсили ёлку разноцветными шарами."
        source: { kind: authored }
      - pl: "Ozdób tort świeżymi truskawkami."
        ru: "Укрась торт свежей клубникой."
        source: { kind: authored }
  - id: adorn-oneself
    ru: "украсить себя (ozdobić się)"
    examples:
      - pl: "Na bal ozdobiła się perłami."
        ru: "На бал она украсила себя жемчугом."
        source: { kind: authored }
  - id: grace
    ru: "перен. стать украшением (чего-л.)"
    examples:
      - pl: "Jego obraz ozdobi ścianę muzeum."
        ru: "Его картина украсит стену музея."
        source: { kind: authored }
notes:
  - { kind: government, text: "OZDOBIĆ COŚ CZYMŚ — что украшают, в винительном, чем — в творительном, как по-русски: OZDOBIĆ SALĘ KWIATAMI «украсить зал цветами»." }
  - { kind: usage, text: "Совершенный вид; несовершенный — OZDABIAĆ (с чередованием O → A: OZDOBIĆ / OZDABIAĆ). Будущее: OZDOBIĘ, OZDOBISZ, OZDOBIĄ. Повелительное с Ó: OZDÓB, OZDÓBMY, OZDÓBCIE." }
  - { kind: pronunciation, text: "Ударение на предпоследнем слоге: «оздо́биць», OZDOBIĘ — «оздо́бьэ». В повелительном Ó читается как «у»: OZDÓB — «о́здуп», с оглушением конечного B." }
collocations:
  - { pl: "ozdobić choinkę", ru: "нарядить ёлку" }
  - { pl: "ozdobić tort", ru: "украсить торт" }
  - { pl: "ozdobić salę kwiatami", ru: "украсить зал цветами" }
family:
  - { pl: "ozdabiać", ru: "украшать", relation: aspect }
  - { pl: "zdobić", ru: "украшать", relation: root }
  - { pl: "ozdoba", ru: "украшение", relation: derived }
  - { pl: "ozdobny", ru: "декоративный, нарядный", relation: derived }
etymology: "Приставка O- и ZDOBIĆ «украшать», от праславянского *sъdobiti; в том же гнезде русское «сдобный»: исходно «делать пригодным, добротным»."
memory: "Ozdobić — сделать «до́бным», нарядным; ozdoba — украшение. Ozdób choinkę! — наряди ёлку."
idioms:
  - { pl: "ozdobić coś jak choinkę", ru: "увешать украшениями, как ёлку (с перебором)" }
