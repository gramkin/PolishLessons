  - id: between-meals
    ru: "приём пищи (в оборотах «между едой», «перед едой»)"
    examples:
      - pl: "Myję zęby między posiłkami."
        ru: "Я чищу зубы между приёмами пищи."
        source: { kind: translated, id: 362486 }
      - pl: "Umył brudne ręce przed posiłkiem."
        ru: "Он вымыл грязные руки перед едой."
        source: { kind: translated, id: 367058 }
      - pl: "Ona zawsze sprząta po posiłku."
        ru: "Она всегда убирает после еды."
        source: { kind: translated, id: 720299 }
notes:
  - { kind: false-friend, text: "Во множественном числе posiłki значит ещё и «подкрепление» в военном смысле: Wyślij posiłki «Вышли подкрепление», Wezwij posiłki «Вызови подкрепление»." }
  - { kind: usage, text: "Русское «еда» как вещество — это jedzenie; posiłek всегда про приём пищи, про трапезу целиком." }
  - { kind: government, text: "Между приёмами пищи — między posiłkami (творительный падеж), перед едой — przed posiłkiem (творительный), после еды — po posiłku (предложный)." }
  - { kind: usage, text: "Jemy trzy posiłki dziennie — «мы едим три раза в день», буквально «три приёма пищи в день»." }
collocations:
  - { pl: "między posiłkami", ru: "между приёмами пищи" }
  - { pl: "przed posiłkiem", ru: "перед едой" }
  - { pl: "ciepły posiłek", ru: "горячая еда" }
family:
  - { pl: "posiłkowy", ru: "вспомогательный", relation: root }
  - { pl: "jedzenie", ru: "еда (как вещество)", relation: root }
etymology: "От posilić się «подкрепиться», того же корня, что siła «сила»: буквально «подкрепление сил». Отсюда и военное значение «подкрепление»."
memory: "posiłek — «приём пищи, трапеза»: jemy trzy posiłki dziennie «мы едим три раза в день». Еда как вещество — jedzenie. А во множественном posiłki — ещё и «подкрепление»: wezwij posiłki."
