lemma: "posiłek"
rank: 1730
pos: noun
pron: { cyr: "посьи́уэк" }
senses:
  - id: meal
    ru: "еда, приём пищи, трапеза"
    examples:
      - pl: "Zjadłam posiłek."
        ru: "Я съела свою еду."
        source: { kind: translated, id: 6729713 }
      - pl: "Jemy trzy posiłki dziennie."
        ru: "Мы едим три раза в день."
