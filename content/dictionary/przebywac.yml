    ru: "Сейчас мы находимся за границей."
    source: { kind: authored }
  - form: "przebywania"
    pl: "Musimy mieć prawo do przebywania tutaj."
    ru: "У нас должно быть право находиться здесь."
    source: { kind: translated, id: 3757011 }
  - form: "przebywania"
    pl: "Tom nie mógł znieść przebywania razem z Mary w jednym pokoju."
    ru: "Том не мог вынести пребывания с Мэри в одной комнате."
    source: { kind: translated, id: 5372120 }
  - form: "przebywania"
    pl: "Nie ma prawa przebywania w tym kraju."
    ru: "У него нет права пребывания в этой стране."
    source: { kind: authored }
  - form: "przebywanie"
    pl: "Lekarz zalecił mi więcej ruchu, częstsze przebywanie na świeżym powietrzu i zdrowe odżywianie."
    ru: "Врач порекомендовал мне больше двигаться, чаще бывать на свежем воздухе и правильно питаться."
    source: { kind: tatoeba, id: 13786634 }
  - form: "przebywanie"
    pl: "Przebywanie na słońcu męczy."
    ru: "Пребывание на солнце утомляет."
    source: { kind: authored }
  - form: "przebywanie"
    pl: "Przebywanie tutaj jest zabronione."
    ru: "Находиться здесь запрещено."
    source: { kind: authored }
  - form: "przebywaniem"
    pl: "Przed przebywaniem na słońcu chroni kapelusz."
    ru: "От пребывания на солнце защищает шляпа."
    source: { kind: authored }
  - form: "przebywaniem"
    pl: "Między mieszkaniem a przebywaniem jest różnica."
    ru: "Между проживанием и пребыванием есть разница."
    source: { kind: authored }
  - form: "przebywaniem"
    pl: "Zmęczył się przebywaniem w czterech ścianach."
    ru: "Он устал от пребывания в четырёх стенах."
    source: { kind: authored }
  - form: "przebywaniu"
    pl: "O przebywaniu na świeżym powietrzu mówił lekarz."
    ru: "О пребывании на свежем воздухе говорил врач."
    source: { kind: authored }
  - form: "przebywaniu"
    pl: "W przebywaniu za granicą nie ma nic złego."
    ru: "В пребывании за границей нет ничего плохого."
    source: { kind: authored }
  - form: "przebywaniu"
    pl: "Po przebywaniu w szpitalu potrzebował odpoczynku."
    ru: "После пребывания в больнице ему нужен был отдых."
    source: { kind: authored }
  - form: "przebywano"
    pl: "Przebywano tam tygodniami."
    ru: "Там находились неделями."
    source: { kind: authored }
  - form: "przebywano"
    pl: "Przebywano w kwarantannie."
    ru: "Находились на карантине."
    source: { kind: authored }
  - form: "przebywano"
    pl: "W górach przebywano do jesieni."
    ru: "В горах пробыли до осени."
    source: { kind: authored }
  - form: "przebywasz"
    pl: "Jak długo przebywasz w Japonii?"
    ru: "Как долго ты находишься в Японии?"
    source: { kind: translated, id: 1215389 }
