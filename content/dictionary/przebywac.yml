# review
id: przebywac
format: 2
lemma: "przebywać"
rank: 2117
pos: verb
aspect: imperf
pron: { cyr: "пшэбы́ваць" }
senses:
  - id: stay
    ru: "находиться, пребывать, жить (временно)"
    examples:
      - pl: "Prezydent obecnie przebywa w Miami."
        ru: "Президент сейчас находится в Майами."
        source: { kind: translated, id: 924552 }
      - pl: "Przebywał w Nowym Jorku przez trzy tygodnie."
        ru: "Он пробыл в Нью-Йорке три недели."
        source: { kind: translated, id: 6769062 }
      - pl: "Jak długo przebywasz w Japonii?"
        ru: "Как долго ты находишься в Японии?"
        source: { kind: translated, id: 1215389 }
  - id: spend-time
    ru: "бывать, проводить время"
    examples:
      - pl: "Lekarz zalecił mi więcej ruchu, częstsze przebywanie na świeżym powietrzu i zdrowe odżywianie."
        ru: "Врач порекомендовал мне больше двигаться, чаще бывать на свежем воздухе и правильно питаться."
        source: { kind: tatoeba, id: 13786634 }
      - pl: "Nie lubię przebywać w łaźni."
        ru: "Я не люблю находиться в бане."
        source: { kind: translated, id: 13030343 }
notes:
  - { kind: government, text: "Где — предлог w с предложным падежом: przebywać w Londynie «находиться в Лондоне». Как долго — винительный: przebywał trzy tygodnie." }
  - { kind: false-friend, text: "Не «прибывать» в смысле «приезжать»! Это ложный друг: przebywać значит «находиться, пребывать», а «прибыть» по-польски przybyć." }
  - { kind: usage, text: "Несовершенный вид. Родственный przebyć — совершенный по форме, но значение у него разошлось: «преодолеть, перенести»." }
  - { kind: usage, text: "Отглагольное существительное przebywanie «пребывание»: prawo do przebywania «право на пребывание»." }
collocations:
  - { pl: "przebywać w szpitalu", ru: "находиться в больнице" }
  - { pl: "przebywać za granicą", ru: "находиться за границей" }
etymology: "prze- + bywać «бывать», от być «быть»; ср. русское «пребывать», «бывать»."
memory: "przebywać — «находиться, пребывать». Ложный друг: это НЕ «прибывать». Приехать — przybyć. Родственный przebyć значит «преодолеть, перенести»."
idioms:
