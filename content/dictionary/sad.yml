senses:
  - id: court
    ru: "суд (учреждение)"
    note: "«Подать в суд» — podać do sądu, с предлогом do и родительным."
    examples:
      - pl: "Sąd wydał werdykt \"winny\"."
        ru: "Суд вынес вердикт «виновен»."
        source: { kind: translated, id: 7334880 }
      - pl: "Sąd skazał go na śmierć."
        ru: "Суд приговорил его к смерти."
        source: { kind: translated, id: 5065015 }
      - pl: "Nie złożę sprawy do sądu."
        ru: "Я не буду подавать в суд."
        source: { kind: tatoeba, id: 3841291 }
  - id: judgment
    ru: "суждение, мнение"
    note: "wydawać sąd o czymś «выносить суждение о чём-либо»."
    examples:
      - pl: "Nie wydawaj pochopnych sądów."
        ru: "Не выноси поспешных суждений."
        source: { kind: authored }
      - pl: "Mam o tym własny sąd."
        ru: "У меня об этом своё мнение."
        source: { kind: authored }
      - pl: "Jego sądy bywają surowe."
        ru: "Его суждения бывают суровы."
        source: { kind: authored }
  - id: named-courts
    ru: "Sąd Najwyższy, Sąd Ostateczny — Верховный суд, Страшный суд"
    note: "Устойчивые названия пишутся с прописной."
    examples:
      - pl: "Sąd Najwyższy zatwierdził pierwotny wyrok."
        ru: "Верховный суд утвердил первоначальный приговор."
        source: { kind: translated, id: 5065025 }
      - pl: "W tej sprawie zadecydował Sąd Najwyższy."
        ru: "В этом деле решение принял Верховный суд."
        source: { kind: translated, id: 1177837 }
      - pl: "Czekali jak na Sąd Ostateczny."
        ru: "Они ждали как Страшного суда."
        source: { kind: authored }
notes:
  - { kind: government, text: "«Подать на кого-то в суд» — podać kogoś do sądu, с предлогом do и родительным; «в суде» — w sądzie, предложный падеж." }
  - { kind: usage, text: "Второе значение — «суждение, мнение»: wydawać sąd o czymś, mieć własny sąd." }
  - { kind: usage, text: "Устойчивые названия: Sąd Najwyższy «Верховный суд», Sąd Ostateczny «Страшный суд»." }
  - { kind: usage, text: "Однокоренные: sądzić «судить; полагать», sędzia «судья», sądowy «судебный»." }
collocations:
  - { pl: "podać do sądu", ru: "подать в суд" }
  - { pl: "w sądzie", ru: "в суде" }
  - { pl: "Sąd Najwyższy", ru: "Верховный суд" }
  - { pl: "wydać sąd o czymś", ru: "вынести суждение о чём-либо" }
family:
  - { pl: "sądzić", ru: "судить; полагать", relation: root }
  - { pl: "sędzia", ru: "судья", relation: derived }
  - { pl: "sądowy", ru: "судебный", relation: derived }
etymology: "От праславянского *sǫdъ — то же слово, что русское «суд»; носовой ą стоит там, где русский даёт «у», как в ząb — «зуб»."
memory: "sąd — «суд», и слово то же, что русское, только с носовым ą на месте «у»: sąd — суд, ровно как ząb — зуб. Но у него есть и второе значение — «суждение, мнение»: wydawać sąd o czymś. «Подать в суд» строится с do и родительным: podać kogoś do sądu, а «в суде» — w sądzie. Глагол sądzić значит и «судить», и «полагать»."
idioms:
  - { pl: "podać do sądu", ru: "подать в суд" }
  - { pl: "Sąd Najwyższy", ru: "Верховный суд" }
  - { pl: "Sąd Ostateczny", ru: "Страшный суд" }
formExamplesSkip:
