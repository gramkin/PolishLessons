notes:
  - { kind: pronunciation, text: "Читается «пульс», одним слогом, и эта карточка удобна для того, чтобы запомнить одно из самых важных правил польского чтения. Польская L всегда мягкая и передаётся русским «ль»: PULS даёт «пульс», LAMPA даёт «лямпа», LAS даёт «ляс». А вот Ł — совсем другой звук, и передаётся русским «у»: WYSIŁEK даёт «выси́уэк», POSŁAĆ даёт «по́суаць». То есть две похожие на письме буквы читаются совершенно различно, и спутать их — значит произнести другое слово. Проговорите пару: PULS «пульс», но PUŁK «пуук» «полк»." }
  - { kind: government, text: "Мужской род, неодушевлённое. Винительный равен именительному: ZBADAŁA PULS. Родительный на -U: BEZ PULSU, и при отрицании винительный уходит туда же: NIE WYCZUŁ PULSU. Местный на -IE: W PULSIE, O PULSIE. Устойчивые сочетания стоит выучить блоком, потому что они частотны в быту и в медицине: BADAĆ PULS «проверять пульс», WYCZUĆ PULS «нащупать пульс», PULS PRZYSPIESZA «пульс учащается», PULS SPADA. Чей пульс — родительный без предлога: PULS PACJENTA." }
  - { kind: usage, text: "В прямом значении слово медицинское и обиходное одновременно, как и в русском. В переносном значении оно живёт шире русского: PULS MIASTA «пульс города», PULS RYNKU, PULS WYDARZEŃ — все три совершенно обычны в польской прессе. Идиома TRZYMAĆ RĘKĘ NA PULSIE значит «держать руку на пульсе», то есть быть в курсе и не упускать контроль, и переводится буквально, слово в слово. Глагол PULSOWAĆ значит «пульсировать» и о боли, и о свете: ŚWIATŁO PULSOWAŁO." }
  - { kind: false-friend, text: "Ложной дружбы в значении нет, слова совпадают полностью. Стоит заметить только, что русское «пульс» имеет мягкую Л по собственному праву, а польское PULS — потому что в польском L мягкая всегда, без исключений. Из этого следует практический вывод: русскому не нужно специально смягчать, он и так произносит верно; трудность в обратном — не смягчить там, где стоит Ł. Поэтому единственная настоящая ловушка слова лежит не в нём самом, а в его соседях по алфавиту." }
