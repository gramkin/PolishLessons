etymology: "Из латинского PULSUS «удар, толчок», от PELLERE «толкать, бить». Русское «пульс» пришло тем же путём, через латинские медицинские тексты, поэтому слова совпадают. Тот же корень PELLERE дал целое гнездо знакомых слов: IMPULS и «импульс», то есть «толчок внутрь», REPULSJA «отталкивание», а также английское PROPELLER, то, что толкает вперёд. Так что за медицинским термином стоит простой образ удара: пульс есть то, что бьёт. Польский, взяв слово, встроил его в обычное мужское склонение, с родительным на -U и местным на -IE, как всякое неодушевлённое заимствование."
memory: "Удобный случай запомнить главное правило чтения: польская l всегда мягкая, «ль» — puls «пульс», lampa «лямпа»; а ł даёт «у» — pułk «пуук». Две буквы, похожие на письме, читаются совершенно иначе. От латинского pellere «толкать», откуда и impuls. Идиома trzymać rękę na pulsie переводится буквально."
