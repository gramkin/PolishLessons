# review
id: zaden
format: 2
lemma: "żaden"
rank: 148
pos: adj
pron: { cyr: "жа́дэн" }
senses:
  - id: none
    ru: "никакой, ни один (всегда с отрицанием при глаголе)"
    examples:
      - pl: "Nie znam żadnego języka."
        ru: "Я не знаю ни одного языка."
        source: { kind: tatoeba, id: 3743853 }
      - pl: "Nie mam żadnych kotów."
        ru: "У меня нет никаких кошек."
        source: { kind: tatoeba, id: 8572879 }
      - pl: "Nie mam żadnych planów."
        ru: "У меня нет никаких планов."
        source: { kind: tatoeba, id: 6406154 }
  - id: no-kind
    ru: "никакой, вовсе не (отрицание признака)"
    examples:
      - pl: "To żadna nowość."
        ru: "Это никакая не новость."
        source: { kind: tatoeba, id: 8756174 }
      - pl: "W żadnym wypadku."
        ru: "Ни в коем случае."
        source: { kind: tatoeba, id: 3363038 }
      - pl: "Nie zna żadnego z nas."
        ru: "Она никого из нас не знает."
        source: { kind: tatoeba, id: 7185051 }
notes:
  - { kind: usage, text: "Двойное отрицание обязательно: Nie mam żadnych planów «У меня нет никаких планов». Без nie фраза неправильна." }
  - { kind: usage, text: "Склоняется как прилагательное, с беглым e: żaden — żadnego — żadnemu — żadnym." }
  - { kind: usage, text: "W żadnym wypadku и w żadnym razie значат «ни в коем случае»; żadną miarą — «никоим образом»." }
collocations:
  - { pl: "w żadnym razie", ru: "ни в коем случае" }
  - { pl: "żadną miarą", ru: "никоим образом" }
  - { pl: "bez żadnych problemów", ru: "без всяких проблем" }
etymology: "Из ni + że + jeden — буквально «ни один»; русское «ни один» построено так же, но осталось раздельным."
memory: "żaden требует nie при глаголе: Nie mam żadnych planów. Беглая гласная: żaden — żadnego — żadnym. И запомните w żadnym razie «ни в коем случае»."
idioms:
  - { pl: "pod żadnym pozorem", ru: "ни под каким предлогом" }
  - { pl: "za żadne skarby świata", ru: "ни за какие сокровища" }
  - { pl: "w żadnym razie", ru: "ни в коем случае" }
