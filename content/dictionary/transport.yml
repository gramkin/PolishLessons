# review
id: transport
format: 2
lemma: "transport"
rank: 2588
pos: noun
pron: { cyr: "тра́нспорт" }
senses:
  - id: carriage
    ru: "перевозка, транспортировка"
    examples:
      - pl: "Transport towarów koleją jest tańszy."
        ru: "Перевозка товаров по железной дороге дешевле."
        source: { kind: authored }
      - pl: "Firma zajmuje się transportem międzynarodowym."
        ru: "Фирма занимается международными перевозками."
        source: { kind: authored }
      - pl: "Koszty transportu wzrosły o połowę."
        ru: "Расходы на перевозку выросли наполовину."
        source: { kind: authored }
  - id: shipment
    ru: "груз, партия груза"
    examples:
      - pl: "Transport dotarł z dwudniowym opóźnieniem."
        ru: "Груз прибыл с двухдневным опозданием."
        source: { kind: authored }
      - pl: "Rozładowali transport w godzinę."
        ru: "Они разгрузили груз за час."
        source: { kind: authored }
notes:
  - { kind: government, text: "Мужской неодушевлённый: transport, transportu, transporcie. Множественное transporty значит и «перевозки», и «партии грузов»." }
  - { kind: usage, text: "Виды: transport samochodowy, drogowy, lotniczy, morski, kolejowy." }
  - { kind: false-friend, text: "Ложный друг по второму значению: польское transport это ещё и сам груз — transport dotarł значит «груз прибыл». Русское «транспорт» так не употребляется." }
  - { kind: usage, text: "О городском общественном транспорте чаще говорят komunikacja miejska, хотя встречается и transport publiczny." }
collocations:
  - { pl: "transport towarów", ru: "перевозка товаров" }
  - { pl: "koszty transportu", ru: "расходы на перевозку" }
  - { pl: "transport lotniczy", ru: "авиаперевозка" }
family:
  - { pl: "transportować", ru: "перевозить", relation: root }
  - { pl: "towar", ru: "товар", relation: root, id: towar }
etymology: "Через латинское transportare «переносить, перевозить», из trans- «через» и portare «нести». Русское «транспорт» — то же заимствование, но второго польского значения, «груз», оно не переняло."
memory: "transport — и перевозка, и сам груз: transport dotarł значит «груз прибыл». Это второе значение русскому «транспорту» незнакомо."
idioms:
  - { pl: "transport dotarł", ru: "груз прибыл" }
