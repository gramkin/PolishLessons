pron: { cyr: "мярко́ваць" }
senses:
  - id: moderate
    ru: "умерять, сдерживать"
    examples:
      - pl: "Musisz miarkować swój gniew."
        ru: "Ты должен умерять свой гнев."
        source: { kind: authored }
      - pl: "Miarkuj słowa!"
        ru: "Придержи язык!"
        source: { kind: authored }
      - pl: "Trudno miarkować apetyt."
        ru: "Трудно умерять аппетит."
        source: { kind: authored }
  - id: realize
    ru: "смекать, соображать (устаревшее)"
    examples:
      - pl: "Miarkuję, że coś jest nie tak."
        ru: "Смекаю, что что-то не так."
        source: { kind: authored }
      - pl: "Zaczął miarkować, o co chodzi."
        ru: "Он начал соображать, в чём дело."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Книжное и устаревающее слово. Основное значение — «умерять, сдерживать»." }
  - { kind: usage, text: "В старой речи и в диалектах значит ещё «смекать, соображать» — это значение сегодня почти ушло." }
  - { kind: false-friend, text: "Корень miara «мера»; ср. русское «мерить», «умерять», «соразмерять»." }
  - { kind: government, text: "Винительный падеж: miarkować gniew «умерять гнев»." }
  - { kind: usage, text: "Страдательное причастие живёт о том, что умеряют: gniew miarkowany wiekiem, ceny miarkowane przepisami. О людях так не говорят." }
