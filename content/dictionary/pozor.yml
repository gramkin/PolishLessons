  - { pl: "pozorny", ru: "мнимый, кажущийся", relation: derived }
etymology: "От приставки PO- и корня ZOR-, того же, что в русских «зреть», «взор», «дозор» и «надзор». Исходный смысл — то, что видно, что предстаёт взгляду, отсюда «видимость». Русский от этого же корня получил «позор», но пошёл другим путём: сперва это было зрелище, выставление на всеобщий взгляд, затем бесчестье. Так одно слово в двух языках разошлось от общей точки до противоположных смыслов."
memory: "Не «позор»: pozór значит «видимость, внешний вид», а позор по-польски hańba. Корень общий и знакомый, zor-, как во «взоре», «дозоре» и «надзоре», и польские dozór с nadzór совпадают с русскими точно. Русское слово ушло от зрелища к бесчестью, польское осталось при видимом. Читается «по́зур», потому что ó это «у». Главный оборот: pod żadnym pozorem."
idioms:
  - { pl: "pod żadnym pozorem", ru: "ни под каким предлогом" }
