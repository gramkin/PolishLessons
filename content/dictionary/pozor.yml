notes:
  - { kind: false-friend, text: "POZÓR это не «позор». Русский позор по-польски HAŃBA или WSTYD, а POZÓR значит «видимость, внешний вид»: POZORY MYLĄ это «внешность обманчива». Корень при этом общий и хорошо знакомый, ZOR-, тот же, что во «взоре», «дозоре» и «надзоре». Польские DOZÓR и NADZÓR значат ровно то же, что русские, и только POZÓR ушёл в сторону видимости, а русский тёзка — в сторону стыда." }
  - { kind: usage, text: "Десять форм, мужской род. В именительном стоит Ó, а в косвенных падежах оно переходит в обычное O: POZÓR, но POZORU, POZOREM, POZORY. Это общее правило для слов такого типа, то же в WÓZ — WOZU и MRÓZ — MROZU. В местном падеже R переходит в RZ: W POZORZE. Второе значение почти всегда сидит в обороте POD ŻADNYM POZOREM." }
  - { kind: government, text: "Под предлогом чего-либо — POD POZOREM CZEGOŚ, предлог POD с творительным и родительным при существительном. Ни под каким предлогом — POD ŻADNYM POZOREM, и русский строит оборот так же. На вид — NA POZÓR, предлог NA с винительным, и работает это как наречие. Соблюдать видимость — ZACHOWAĆ POZORY, винительный множественного без предлога." }
  - { kind: pronunciation, text: "Читается «по́зур», два слога, ударение на первом. Буква Ó даёт «у», поэтому слово звучит «позур», а не «позор»: именно это и отличает его на слух от русского тёзки. В косвенных падежах Ó сменяется на O, и POZORU звучит уже «позо́ру». В местном падеже POZORZE сочетание RZ даёт «ж»: «позо́же»." }
  - { kind: register, text: "Слово нейтральное и частое, прежде всего в двух оборотах. POZORY MYLĄ это готовая реплика, которую говорят, когда внешность обманула. POD ŻADNYM POZOREM звучит как строгий запрет, в инструкциях и в разговоре с детьми. Оборот ZACHOWAĆ POZORY употребляют о семьях и учреждениях, которые делают вид, что всё в порядке. Прилагательное POZORNY значит «мнимый»." }
collocations:
  - { pl: "na pozór", ru: "на вид, с виду" }
