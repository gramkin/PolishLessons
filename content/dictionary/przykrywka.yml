notes:
  - { kind: usage, text: "Второе значение совпадает с русским «прикрытие», но слово при этом то же самое, что кухонная крышка — по-русски так не выйдет. PRZYKRYWKA DLA PRZEMYTU «прикрытие для контрабанды» и przykrywka do garnka «крышка для кастрюли» — одно и то же существительное. Образ прозрачен: и то и другое накрывает содержимое." }
  - { kind: pronunciation, text: "Дательный и предложный — PRZYKRYWCE, с переходом k в c, как notatka — notatce и matka — matce. Родительный множественного — PRZYKRYWEK, с беглым e. Оба правила работают у всех существительных на -ka, так что, выучив их один раз, получаешь целый класс." }
  - { kind: usage, text: "Рядом живёт почти синоним POKRYWKA, и в кухонном смысле они взаимозаменяемы. Но в переносном «ширма» употребляют именно PRZYKRYWKĘ, а pokrywka остаётся при кастрюле. Разницу задаёт приставка: przy- «при-, рядом» против po- «по-, поверх»." }
collocations:
