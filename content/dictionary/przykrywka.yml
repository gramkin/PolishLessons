family:
  - { pl: "przykryć", ru: "накрыть", relation: root, id: przykryc }
  - { pl: "pokrywka", ru: "крышка", relation: root }
  - { pl: "kryć", ru: "крыть, скрывать", relation: root, id: kryc }
etymology: "От przykryć «накрыть», из kryć «крыть, скрывать» — того же корня, что русские «крыть», «крышка», «покрывало». Разбор совпадает морфема в морфему: przy-kryw-ka и «при-кры-тие». Оба значения, кухонное и переносное, выросли из одного образа: то, что кладут сверху, чтобы не было видно, что внутри."
memory: "Одно слово на две русские вещи: przykrywka — и «крышка» на кастрюле, и «прикрытие» для тёмных дел. А падежи как у matka: w przykrywce, kilka przykrywek."
idioms:
