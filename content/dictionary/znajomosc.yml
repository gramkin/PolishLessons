notes:
  - { kind: false-friend, text: "Слово покрывает два русских сразу, и это надо держать в голове. ZNAJOMOŚĆ — это «знакомство» с человеком: ZAWARLIŚMY ZNAJOMOŚĆ «мы завели знакомство». И это же слово значит «знание, владение» предметом: ZNAJOMOŚĆ JĘZYKA ANGIELSKIEGO «знание английского языка», и именно так пишут в объявлениях о работе. Русское «знание» в этом смысле по-польски будет не WIEDZA, а именно ZNAJOMOŚĆ, если речь о практическом владении; WIEDZA — это знание как совокупность сведений. Во множественном числе ZNAJOMOŚCI часто означает «связи»: MIEĆ ZNAJOMOŚCI «иметь связи», и оттенок тут тот же, что в русском." }
  - { kind: usage, text: "Существительные на -OŚĆ имеют в польском шесть форм, и одна из них работает за пятерых: ZNAJOMOŚCI покрывает родительный, дательный и местный единственного, а также именительный, винительный и родительный множественного. Остаются ZNAJOMOŚĆ для именительного и винительного единственного, ZNAJOMOŚCIĄ для творительного и три формы множественного — ZNAJOMOŚCIOM, ZNAJOMOŚCIACH, ZNAJOMOŚCIAMI. Выучив этот набор один раз, его можно переносить на любое слово типа: WOLNOŚĆ, MIŁOŚĆ, PRYWATNOŚĆ, LOJALNOŚĆ. Сравните с GARŚĆ, у которой семь форм, потому что она конкретная и имеет отдельный именительный множественного GARŚCIE." }
  - { kind: government, text: "Женский род. С кем знакомство — предлог Z с творительным: ZNAJOMOŚĆ Z SĄSIADEM. Чего знание — родительный: ZNAJOMOŚĆ JĘZYKA, ZNAJOMOŚĆ PRZEPISÓW, ZNAJOMOŚĆ TEMATU. Частотные глаголы: ZAWRZEĆ ZNAJOMOŚĆ «завести знакомство», ODNOWIĆ ZNAJOMOŚĆ «возобновить знакомство», ZERWAĆ ZNAJOMOŚĆ «прекратить знакомство». В объявлениях стоит формула WYMAGANA ZNAJOMOŚĆ JĘZYKA ANGIELSKIEGO «требуется знание английского». Прилагательное ZNAJOMY значит «знакомый» и употребляется как существительное: MÓJ ZNAJOMY «мой знакомый»." }
  - { kind: pronunciation, text: "Читается «знаё́мосьць», четыре слога, ударение на предпоследнем. Сочетание JO даёт «ё». Конечное -ŚĆ это два мягких согласных подряд, «сьць», произносимых слитно и коротко. В форме ZNAJOMOŚCI конечное -I смягчает предшествующее сочетание: «знаё́мосьци». Начальное ZN выговаривается без гласной между з и н. Буква O в третьем слоге произносится полно, как «о»." }
