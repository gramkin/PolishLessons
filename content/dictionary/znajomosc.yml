etymology: "От ZNAJOMY «знакомый», а то — от ZNAĆ, из праславянского *znati, того же корня, что русские «знать», «знакомый», «знамя». Суффикс -OŚĆ, восходящий к праславянскому *-ostь, образует отвлечённые существительные и отвечает русскому -ОСТЬ без исключений: ZNAJOMOŚĆ и «знакомость»? В русском от «знакомого» образовано «знакомство» с другим суффиксом, -СТВО, и это единственное расхождение в паре. То есть корень и приставочная часть общие, а суффикс отвлечённости русский выбрал иной. Второе значение, «владение предметом», развилось из первого через идею близкого знакомства с делом, и русский для этого пользуется словом «знание», образованным прямо от глагола."
memory: "Два русских слова в одном: znajomość — это и «знакомство» с человеком (zawrzeć znajomość), и «знание» предмета (znajomość języka, как в объявлениях о работе). Во множественном znajomości часто «связи». Шесть форм, и znajomości работает за пятерых: родительный, дательный, местный единственного и все три позиции множественного, кроме трёх падежей. У конкретной garść форм семь — лишняя garście."
