etymology: "Слово праславянского происхождения, связанное с корнем, означавшим обрывок, лохмотья; русское «шмотки» в разговорном языке идёт из того же круга, хотя путь его сложнее и, возможно, прошёл через польский. Прямое русское соответствие — «тряпка», от «тряпать», и образ там другой: не обрывок, а то, что трясут. Переносное значение, оценка человека как бесхарактерного, развилось в обоих языках независимо и из одного и того же образа мягкой, безвольной ткани; в русском «тряпка» о человеке звучит снисходительно, в польском SZMATA куда грубее, и это различие в силе оскорбления важнее совпадения метафоры. Уменьшительное SZMATKA вернуло слову нейтральность и употребляется о мягкой тряпочке для протирки."
memory: "В прямом значении нейтрально: szmata — «тряпка», szmata do podłogi. О человеке — грубое оскорбление, заметно резче русской «тряпки»; знать стоит, употреблять нет. Нейтральные замены: ścierka для посуды, szmatka «тряпочка». Дательный и местный szmacie с t→c, как krawacie и przynęcie. Три слова карточки дают три исхода перед одним и тем же -e: wystawie, przejażdżce, szmacie."
