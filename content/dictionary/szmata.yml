notes:
  - { kind: register, text: "В прямом значении слово вполне нейтральное: SZMATA — это тряпка, которой вытирают пол или заворачивают инструменты, и в хозяйственной речи оно обычно. Но о человеке SZMATA — грубое оскорбление, и употреблять его так не следует: о женщине это откровенно вульгарно, о мужчине значит «тряпка, бесхарактерный человек». Учащемуся полезно знать это значение, чтобы распознать его в речи и не повторить случайно. Нейтральные замены для хозяйственного смысла: ŚCIERKA «тряпка для посуды», ŚCIERECZKA, SZMATKA «тряпочка» — последнее уменьшительное и звучит мягче самого слова." }
  - { kind: usage, text: "В дательном и местном падеже единственного числа T переходит в C: SZMACIE, а не «szmatie». Это то же чередование, что в APARTAMENT и APARTAMENCIE, KRAWAT и KRAWACIE, PRZYNĘTA и PRZYNĘCIE. Родительный множественного — SZMAT, с нулевым окончанием. Карточка намеренно ставит три слова рядом: WYSTAWA даёт WYSTAWIE с простым смягчением губного, PRZEJAŻDŻKA даёт PRZEJAŻDŻCE с переходом K в C, а SZMATA даёт SZMACIE с переходом T в C. Один и тот же конечный -E, три разных исхода." }
  - { kind: government, text: "Женский род. Чем вытирать — творительный без предлога: WYTRZEĆ SZMATĄ. Из чего или во что — предлог W с местным или винительным: ZAWINĄĆ W SZMATĘ «завернуть в тряпку», W SZMACIE «в тряпке». Частотные сочетания: MOKRA SZMATA «мокрая тряпка», SZMATA DO PODŁOGI «тряпка для пола», STARE SZMATY «старые тряпки» о ветхой одежде. Устойчивое оборотное SZMATA, а не CZŁOWIEK как оценка характера, принадлежит грубому слою речи, о чём сказано в примечании о регистре." }
  - { kind: pronunciation, text: "Читается «шма́та», два слога, ударение на первом. Сочетание SZ даёт «ш». Буква A произносится полно, без редукции. Конечное -A ясное. В дательном и местном SZMACIE сочетание CIE даёт мягкое «це»: «шма́це», и на слух форма заметно отличается от именительного. В родительном множественного SZMAT слог один: «шмат», и конечное T глухое." }
