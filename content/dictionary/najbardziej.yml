lemma: "najbardziej"
rank: 597
pos: adv
pron: { cyr: "найба́рдзей" }
senses:
  - id: most
    ru: "больше всего"
    note: "Kocham cię najbardziej na świecie «Люблю тебя больше всего на свете»."
    examples:
      - pl: "Jakie kwiaty lubisz najbardziej?"
