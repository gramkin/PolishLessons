etymology: "Превосходная степень от bardzo «очень», через сравнительное bardziej. Корень тот же, что в старом bardzo «сильно», и родственен русскому «бодрый»."
memory: "najbardziej — «больше всего», но главная его работа грамматическая: длинные прилагательные в польском образуют превосходную степень аналитически, через это слово — najbardziej interesujący «самый интересный», najbardziej zaskakujący «самый удивительный». Сказать *interesującszy нельзя. Запомните весь ряд: bardzo «очень» — bardziej «более» — najbardziej «более всего»."
