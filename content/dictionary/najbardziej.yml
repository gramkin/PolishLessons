      - pl: "W niedziele jestem najbardziej zajęty."
        ru: "В воскресенье я больше всего занят."
        source: { kind: tatoeba, id: 768724 }
  - id: superlative
    ru: "najbardziej + прилагательное — самый… (аналитическая превосходная степень)"
    note: "Так образуется превосходная степень длинных прилагательных."
    examples:
      - pl: "Który grzyb jest najbardziej trujący?"
        ru: "Какой гриб самый ядовитый?"
        source: { kind: tatoeba, id: 12721025 }
      - pl: "To najbardziej interesująca książka, jaką znam."
        ru: "Это самая интересная книга, какую я знаю."
        source: { kind: authored }
      - pl: "Najbardziej zaskakujące było milczenie."
        ru: "Самым удивительным было молчание."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Главная работа слова — грамматическая: длинные прилагательные образуют превосходную степень аналитически, через najbardziej: najbardziej interesujący «самый интересный», а не *interesującszy." }
  - { kind: usage, text: "Сравнительная степень того же ряда — bardziej «более»: bardziej zmęczony «более усталый»." }
  - { kind: usage, text: "Само по себе значит «больше всего»: Jakie kwiaty lubisz najbardziej? «Какие цветы ты любишь больше всего?»" }
  - { kind: usage, text: "Ряд целиком: bardzo «очень» — bardziej «более» — najbardziej «более всего»." }
