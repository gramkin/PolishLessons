# review
id: spisac
format: 2
lemma: "spisać"
rank: 2356
pos: verb
pron: { cyr: "спи́саць" }
senses:
  - id: write-down
    ru: "записать, составить (список, протокол)"
    examples:
      - pl: "Policjant spisał nasze dane."
        ru: "Полицейский записал наши данные."
        source: { kind: authored }
      - pl: "Spisz wszystko, zanim zapomnisz."
        ru: "Запиши всё, пока не забыл."
        source: { kind: authored }
  - id: make-inventory
    ru: "переписать, составить опись"
    examples:
      - pl: "Spisali cały majątek po dziadku."
        ru: "Они переписали всё имущество после деда."
        source: { kind: authored }
      - pl: "Inwentarz spisano w dwa dni."
        ru: "Опись составили за два дня."
        source: { kind: authored }
  - id: acquit-oneself
    ru: "spisać się — проявить себя, справиться"
    examples:
      - pl: "Dobrze się spisałeś."
        ru: "Ты хорошо справился."
        source: { kind: authored }
notes:
  - { kind: pronunciation, text: "ОСНОВА НАСТОЯЩЕГО ВРЕМЕНИ МЕНЯЕТ S НА SZ — ТО ЖЕ, ЧТО У OPISAĆ. Инфинитив spisać даёт spiszę, spiszesz, spisze, spiszą, повелительное spisz. Русский делает ровно это же в паре «списать — спишу», меняя с на ш. Одно древнее чередование на два языка." }
  - { kind: false-friend, text: "Корень тот же, что в русском «писать», приставка та же, что в «списать». Но значения разошлись: польское spisać это прежде всего ЗАПИСАТЬ, составить список или протокол. Русское «списать» в школьном смысле — то есть у соседа — будет ściągnąć или odpisać, а никак не spisać." }
  - { kind: government, text: "Записывают ЧТО — винительный: spisać dane, protokół, listę, majątek. С кого — od с родительным либо просто винительный лица: policjant spisał kierowcę «полицейский записал данные водителя». Возвратное spisać się значит «показать себя»: dobrze się spisał." }
  - { kind: usage, text: "Вид совершенный, несовершенная пара — spisywać. Отсюда деепричастие spisawszy и отсутствие причастия настоящего времени. Существительное spis значит «список, перепись»: spis powszechny «всеобщая перепись населения», spis treści «оглавление». Оборот spisać na straty — «списать в убыток, махнуть рукой»." }
collocations:
  - { pl: "spisać protokół", ru: "составить протокол" }
  - { pl: "spis powszechny", ru: "перепись населения" }
  - { pl: "spisać na straty", ru: "списать со счетов" }
family:
  - { pl: "pisać", ru: "писать", relation: root, id: pisac }
  - { pl: "opisać", ru: "описать", relation: derived, id: opisac }
  - { pl: "spis", ru: "список, перепись", relation: derived }
  - { pl: "przepis", ru: "рецепт; правило", relation: derived, id: przepis }
etymology: "Приставка s- плюс pisać, из праславянского *pisati «писать, наносить знаки» — того же корня, что русское «писать». Приставка s- даёт значение «свести воедино», отсюда список: спи́санное в одно место. Русское «списать» собрано из тех же частей. Отсюда spis, spisywać, podpis и zapisać."
memory: "spisać — «записать, составить список», от pisać. Основа настоящего меняет s на sz: spiszę, spiszesz — как русское «спишу». Осторожно: списать у соседа это ściągnąć, не spisać. А spis powszechny значит «перепись населения»."
idioms:
  - { pl: "spisać na straty", ru: "списать со счетов" }
  - { pl: "dobrze się spisać", ru: "хорошо себя проявить" }
