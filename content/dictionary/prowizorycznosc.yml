        ru: "Инженер обратил внимание на то, что проводка сделана временно."
        source: { kind: authored }
  - id: unsettledness
    ru: "неустроенность, жизнь «на чемоданах»"
    examples:
      - pl: "Męczyła ją prowizoryczność życia w wynajętych pokojach."
        ru: "Её утомляла неустроенность жизни в съёмных комнатах."
        source: { kind: authored }
      - pl: "Po latach przeprowadzek przywykł do prowizoryczności."
        ru: "За годы переездов он привык к неустроенности."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "К русскому «провизор» (аптекарь) слово отношения не имеет. PROWIZORYCZNY — «временный, сделанный наспех, до лучших времён», а PROWIZORYCZNOŚĆ — само это свойство. Русский обычно передаёт его не существительным, а оборотом: «то, что это временно», «временный характер»." }
  - { kind: register, text: "Слово книжное, из газет и отчётов. В разговоре то же самое называют PROWIZORKA — «временщина, времянка»: TO JEST PROWIZORKA «это сделано на живую нитку». PROWIZORYCZNOŚĆ звучит как оценка со стороны, PROWIZORKA — как ворчание." }
  - { kind: usage, text: "Женский род на -OŚĆ, склоняется как RADOŚĆ: родительный, дательный и предложный совпадают — PROWIZORYCZNOŚCI, творительный — PROWIZORYCZNOŚCIĄ. Отвлечённое существительное: множественного числа на деле нет." }
  - { kind: pronunciation, text: "Читается «провизоры́чносьць»: ударение на предпоследнем слоге RYCZ, CZ твёрдое, конечное ŚĆ — «сьць»." }
