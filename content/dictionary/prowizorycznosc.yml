pos: noun
pron: { cyr: "провизоры́чносьць" }
senses:
  - id: makeshift
    ru: "временный характер, сделанность на скорую руку"
    examples:
      - pl: "Prowizoryczność tego rozwiązania nikomu nie przeszkadzała."
        ru: "Временный характер этого решения никому не мешал."
