etymology: "Образовано от прилагательного PROWIZORYCZNY суффиксом -OŚĆ. Само прилагательное восходит к латинскому PROVISORIUS «предварительный», от PROVIDERE «заранее позаботиться»."
memory: "Prowizoryczność — не «провизор», а «временность»: всё, что сделано до лучших времён. В разговоре — prowizorka."
