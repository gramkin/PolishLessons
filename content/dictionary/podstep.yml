notes:
  - { kind: false-friend, text: "PODSTĘP — «хитрость, уловка», и русскому оно не подсказка, хотя корень знакомый: STĄPAĆ — «ступать». Буквально PODSTĘP — «подступ», скрытый обходной шаг. PODSTĘPNY — «коварный»: PODSTĘPNY PLAN, PODSTĘPNY WRÓG. Творительный PODSTĘPEM — «хитростью, обманом»: ZDOBYĆ COŚ PODSTĘPEM." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. В местном падеже P перед IE смягчается: W PODSTĘPIE. Ę в корне сохраняется во всех формах." }
  - { kind: government, text: "Хитростью — PODSTĘPEM, творительный без предлога. Прибегнуть к хитрости — UCIEC SIĘ DO PODSTĘPU, DO с родительным. Раскусить уловку — PRZEJRZEĆ PODSTĘP, винительный." }
  - { kind: pronunciation, text: "Читается «по́тстэмп», два слога, ударение на первом. D перед S оглушается в «т», Ę перед P звучит «эм», конечное P глухое. В форме PODSTĘPU: «потстэ́мпу»." }
  - { kind: register, text: "Слово книжное и литературное: PODSTĘP часто встречается в сказках, исторических романах и детективах. Троянский конь — классический PODSTĘP. В быту говорят и проще: SZTUCZKA, «трюк»." }
collocations:
  - { pl: "sprytny podstęp", ru: "хитроумная уловка" }
  - { pl: "uciec się do podstępu", ru: "прибегнуть к хитрости" }
  - { pl: "przejrzeć podstęp", ru: "раскусить уловку" }
family:
  - { pl: "stąpać", ru: "ступать", relation: root }
  - { pl: "podstępny", ru: "коварный", relation: derived }
  - { pl: "podstępnie", ru: "коварно, исподтишка", relation: derived }
etymology: "От PODSTĄPIĆ «подступить, подойти тайком», от STĄPAĆ «ступать». Польские Ą и Ę на месте русского «у» — одно соответствие: STĄPAĆ и «ступать». Хитрость — это шаг, сделанный исподтишка."
memory: "Podstęp — хитрость, уловка. Читается «по́тстэмп». Podstępem — хитростью. Podstępny — коварный. Корень как в stąpać — «ступать»: шаг исподтишка."
idioms:
