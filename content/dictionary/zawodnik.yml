notes:
  - { kind: false-friend, text: "Корень тут обманывает дважды, и оба раза крупно. Польское ZAWÓD — это не «завод»: оно значит «профессия» и, во втором значении, «разочарование». Фабрика по-польски FABRYKA или ZAKŁAD. А ZAWODY, во множественном числе, значит «соревнования», и отсюда ZAWODNIK — участник соревнований, спортсмен. Получается цепочка, в которой русский не угадает ни одного звена: ZAWÓD профессия, SPRAWIĆ ZAWÓD разочаровать, ZAWODY соревнования, ZAWODNIK спортсмен. Выучить её стоит целиком, потому что все четыре слова частотны." }
  - { kind: pronunciation, text: "Читается «заво́дник», ударение на предпоследнем слоге. Звучит почти как русское «заводник», и это созвучие как раз и создаёт ловушку: слово не имеет к заводам отношения. Во множественном числе ZAWODNICY согласная K переходит в C и смягчается: «заво́дницы». Это обязательное чередование у мужско-личных существительных на -K: ROBOTNIK и ROBOTNICY, URZĘDNIK и URZĘDNICY, ROLNIK и ROLNICY. Форма ZAWODNIKI для людей неправильна." }
  - { kind: government, text: "Существительное мужского рода одушевлённое, разряда мужско-личного, и из этого следуют два правила. Винительный единственного совпадает с родительным: WIDZĘ ZAWODNIKA. Именительный множественного получает окончание -Y с переходом K в C: ZAWODNICY. Принадлежность к команде вводится предлогом Z с родительным: ZAWODNIK Z POLSKI, а дисциплина — предлогом W с местным: ZAWODNIK W BIEGU NA SETKĘ. При отрицании винительный остаётся родительным, как и был: NIE WIDZĘ ZAWODNIKA." }
  - { kind: usage, text: "Слово нейтральное и официальное: так пишут в протоколах и говорят комментаторы. Женская форма — ZAWODNICZKA, и она употребляется свободно, без всякой пометы. Для командных игр чаще скажут PIŁKARZ «футболист», KOSZYKARZ «баскетболист», а ZAWODNIK годится для любого вида и потому удобен как общее слово. Смежные: UCZESTNIK «участник» в широком смысле, не обязательно состязания, и SPORTOWIEC «спортсмен» как человек, занимающийся спортом вообще, не обязательно соревнующийся." }
