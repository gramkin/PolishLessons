etymology: "От ZAWODY «соревнования», а то — от ZAWÓD, которое само идёт от ZAWODZIĆ, буквально «заводить, уводить куда-то». Исходный образ — состязание, в котором участников «заводят» на дорожку, то есть выводят на поле. Отсюда же старое значение ZAWÓD как «ряд, черёд, попытка», сохранившееся в обороте ZA PIERWSZYM ZAWODEM «с первого раза». Из «попытки» выросли оба современных смысла: с одной стороны — ремесло, то, чем человек занимается постоянно, с другой — ZAWÓD как обманутое ожидание, SPRAWIĆ KOMUŚ ZAWÓD «разочаровать кого-то». Русский «завод» идёт от того же глагола «заводить», но закрепился на производстве, то есть на том, что «заведено», запущено в ход. Один корень, три разных итога."
memory: "Не от «завода»! zawód — профессия, а во втором значении разочарование; zawody — соревнования; zawodnik — спортсмен. Фабрика — fabryka или zakład. Во множественном k переходит в c: zawodnicy, как robotnicy. Корень от zawodzić «заводить»: участников заводят на дорожку."
idioms:
