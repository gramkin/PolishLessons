senses:
  - id: cheese
    ru: "сыр"
    examples:
      - pl: "Jem ser."
        ru: "Я ем сыр."
        source: { kind: translated, id: 3031846 }
      - pl: "Tom lubi ser."
        ru: "Том любит сыр."
