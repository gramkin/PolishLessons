      - pl: "Ser jest żółty."
        ru: "Сыр жёлтый."
        source: { kind: translated, id: 11600464 }
      - pl: "Myszy lubią ser."
        ru: "Мыши любят сыр."
        source: { kind: translated, id: 4169753 }
      - pl: "Ten ser jest smaczny."
        ru: "Этот сыр вкусный."
        source: { kind: tatoeba, id: 11211144 }
      - pl: "Ten ser jest zrobiony z owczego mleka."
        ru: "Этот сыр изготовлен из овечьего молока."
        source: { kind: tatoeba, id: 2151405 }
  - id: with-cheese
    ru: "с сыром, сыра (родительный)"
    examples:
      - pl: "Jem kanapkę z serem."
        ru: "Я ем бутерброд с сыром."
        source: { kind: tatoeba, id: 12949360 }
      - pl: "Uwielbiam pizzę z serem."
        ru: "Я обожаю пиццу с сыром."
        source: { kind: translated, id: 6313934 }
      - pl: "Tom nie lubi sera."
        ru: "Том не любит сыр."
        source: { kind: translated, id: 567001 }
notes:
  - { kind: false-friend, text: "ser значит и «сыр», и «творог»: твёрдый сыр — ser żółty, творог — ser biały или twaróg." }
  - { kind: usage, text: "Перед фотографией по-польски говорят Powiedz ser! — буквально «Скажи сыр», как английское say cheese." }
  - { kind: usage, text: "Родительный падеж sera нужен после отрицания и количества: nie jem sera «я не ем сыра», kawałek sera «кусок сыра»." }
collocations:
  - { pl: "kanapka z serem", ru: "бутерброд с сыром" }
  - { pl: "ser żółty", ru: "твёрдый сыр" }
  - { pl: "kawałek sera", ru: "кусок сыра" }
etymology: "Праславянское *syrъ. Русское «сыр» — то же самое слово; польское e на месте русского ы объясняется обычным развитием этого гласного."
memory: "ser — и «сыр», и «творог»: ser żółty «твёрдый сыр», ser biały «творог». А перед фотоаппаратом поляки говорят Powiedz ser!"
idioms:
  - { pl: "kanapka z serem", ru: "бутерброд с сыром" }
  - { pl: "ser żółty", ru: "твёрдый сыр" }
  - { pl: "powiedz ser", ru: "скажи «сыр»" }
