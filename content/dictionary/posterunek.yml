# review
id: posterunek
format: 2
lemma: "posterunek"
rank: 1969
pos: noun
pron: { cyr: "постэру́нэк" }
senses:
  - id: police-station
    ru: "отделение полиции, полицейский участок"
    examples:
      - pl: "Czy pan wie, gdzie jest posterunek policji?"
        ru: "Вы не знаете, где находится отделение полиции?"
        source: { kind: translated, id: 982472 }
      - pl: "Gdzie jest najbliższy posterunek?"
        ru: "Где ближайший участок?"
        source: { kind: translated, id: 2586929 }
      - pl: "Jak dojść do posterunku policji?"
        ru: "Как пройти к отделению полиции?"
        source: { kind: translated, id: 568270 }
      - pl: "Zapytaj na tamtym posterunku policji."
        ru: "Спроси в том отделении полиции."
        source: { kind: translated, id: 1591864 }
      - pl: "Straż pożarna jest zaraz przy posterunku policji."
        ru: "Пожарная часть находится прямо рядом с отделением полиции."
        source: { kind: translated, id: 712351 }
  - id: post
    ru: "пост, место несения службы"
    examples:
      - pl: "W żadnym wypadku nie możesz opuszczać swojego posterunku."
        ru: "Ты ни в коем случае не можешь покидать свой пост."
        source: { kind: translated, id: 959139 }
      - pl: "Wartownik stał na posterunku całą noc."
        ru: "Часовой простоял на посту всю ночь."
        source: { kind: authored }
notes:
  - { kind: usage, text: "posterunek policji — «отделение полиции». Идти туда — na posterunek (винительный), находиться там — na posterunku (предложный)." }
  - { kind: usage, text: "Второе значение — «пост, место службы»: stać na posterunku «стоять на посту», opuścić posterunek «покинуть пост»." }
  - { kind: false-friend, text: "Не путайте с posterunkowy — это человек, полицейский низшего чина, а не место." }
collocations:
  - { pl: "posterunek policji", ru: "отделение полиции" }
  - { pl: "na posterunku", ru: "на посту; в отделении" }
  - { pl: "najbliższy posterunek", ru: "ближайшее отделение" }
etymology: "Из немецкого Posten «пост, место службы» (в конечном счёте от латинского positus «поставленный») с польским суффиксом -unek. Русское «пост» — то же самое слово, пришедшее другим путём."
memory: "posterunek — сразу и «пост», и «отделение полиции». Gdzie jest posterunek policji? «Где отделение полиции?», но stać na posterunku «стоять на посту»."
idioms:
  - { pl: "posterunek policji", ru: "отделение полиции" }
  - { pl: "stać na posterunku", ru: "стоять на посту" }
  - { pl: "opuścić posterunek", ru: "покинуть пост" }
formExamplesSkip:
  - { form: "posterunku", cell: "Звательный", reason: "звательный падеж: для неодушевлённого существительного он практически не употребляется" }
