notes:
  - { kind: usage, text: "Как и UPAŚĆ в недавней партии, LEW — это два слова с одним именительным падежом, и различаются они по основе. Лев-зверь теряет гласную: LEW, но LWA, LWU, LWEM, LWY. Лев-монета гласную сохраняет: LEW, LEWA, LEWOWI, LEWEM, LEWY. Поэтому WIDZIAŁEM LWA — «я видел льва», а NIE MAM LEWA — «у меня нет лева». Совпадает только именительный падеж единственного числа, дальше формы расходятся полностью." }
  - { kind: pronunciation, text: "Читается «лэф»: конечное w оглушается, как в польском всегда на конце слова. В косвенных падежах звучит «лва», «лву», «лвэм» — польское l твёрдое, мягкости русского «льва» здесь нет, и это стоит повторять отдельно, потому что русская привычка смягчать очень сильна. Гласная в LEW открытая, «э», а не «е»." }
  - { kind: false-friend, text: "Редкий случай полного согласия: русский ведёт себя точно так же. Русское «лев» тоже теряет гласную в косвенных падежах — «льва», «льву», — а болгарская монета тоже её сохраняет: «лев», «лева», «левов». То есть различие основ в польском и русском устроено одинаково, и запоминать надо не новое правило, а то, что знакомое правило здесь работает. Ловушка только в мягкости: по-русски «льва» с мягким л, по-польски LWA твёрдо." }
  - { kind: government, text: "Существительное мужского рода. Лев-зверь одушевлённый, поэтому винительный падеж совпадает с родительным: WIDZĘ LWA. Лев-монета неодушевлённый, и его винительный совпадает с именительным: MAM JEDEN LEW. Это ещё один способ их различить. При числительных от пяти и выше — родительный множественного: PIĘĆ LWÓW «пять львов» и PIĘĆ LEWÓW «пять левов», и эти две формы тоже не путаются." }
collocations:
  - { pl: "lwia część", ru: "львиная доля" }
