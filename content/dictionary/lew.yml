etymology: "Из греческого слова, означавшего льва, через латинское LEO в праславянское *lьvъ, где в корне стоял редуцированный ь. Этот ь и объясняет всё поведение слова: под ударением он прояснился в e, давая LEW, а в косвенных падежах исчез, давая LWA. Русское «лев — льва» прошло тот же путь, только там ь сохранился на письме как мягкий знак. Болгарская монета названа в честь льва с государственного герба, и польский заимствовал её уже готовым словом, в девятнадцатом веке, поэтому чередования она не получила: основа LEW- держится во всех падежах. Так что две парадигмы — это одно слово, взятое дважды: один раз в глубокой древности, другой раз совсем недавно."
memory: "Зверь теряет гласную: lew — lwa, lwy. Монета её держит: lew — lewa, lewy. Точно как в русском «льва» против «лева». Но польское l твёрдое: lwa — «лва», не «льва»."
idioms:
