notes:
  - { kind: usage, text: "Слово принадлежит к классу на -CJA, и этот класс даёт форму, которая русского сбивает: в родительном, дательном и местном падеже единственного числа все три падежа совпадают в OBSERWACJI. BEZ OBSERWACJI, POD OBSERWACJĄ, O OBSERWACJI — следите за окончаниями, они разные, но родительный, дательный и местный дают одно и то же слово. Тот же разбор у PRODUKCJA и PRODUKCJI, DYSKUSJA и DYSKUSJI, RELIGIA и RELIGII. Родительный множественного OBSERWACYJ — старая книжная форма, в современной речи говорят OBSERWACJI и там." }
  - { kind: pronunciation, text: "Читается «обсэрва́цья», ударение на предпоследнем слоге, то есть на -WA-. Сочетание CJA даёт «цья», в один слог, а не «ция» в два: слово четырёхсложное, OB-SER-WA-CJA. Буква E звучит «э» и предыдущую согласную не смягчает, поэтому «сэр», а не «сер». Начальное OB перед глухим S оглушается, и B звучит как «п»: на слух выходит «опсэрва́цья», хотя пишется OB-." }
  - { kind: government, text: "Женский род на -A. Винительный на -Ę: PROWADZIĆ OBSERWACJĘ. Самое частое сочетание — POD OBSERWACJĄ, с творительным после POD: BYĆ POD OBSERWACJĄ «быть под наблюдением», и русский строит это точно так же. Предмет наблюдения вводится предлогом NAD с творительным: OBSERWACJA NAD ZACHOWANIEM PTAKÓW, или родительным без предлога: OBSERWACJA PTAKÓW. При отрицании винительный уходит в родительный: NIE PROWADZILI OBSERWACJI." }
  - { kind: false-friend, text: "Значение совпадает с русским «наблюдением», но распределение слов разное. Русский пользуется одним словом «наблюдение» и для процесса, и для высказанного замечания. Польский тоже, но при этом у него есть и своё, незаимствованное слово для процесса — NADZÓR «надзор, присмотр», и оно уместнее там, где речь о контроле: NADZÓR BUDOWLANY «строительный надзор». А медицинское «под наблюдением» будет именно POD OBSERWACJĄ. Так что выбирать надо по смыслу: слежение и врачебный присмотр — OBSERWACJA, служебный контроль — NADZÓR." }
