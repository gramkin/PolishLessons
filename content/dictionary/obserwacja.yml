etymology: "Из латинского OBSERVATIO «наблюдение, соблюдение», от OBSERVARE: приставка OB- «при, около» и SERVARE «сохранять, сторожить». Исходно слово значило не столько смотреть, сколько сторожить, оберегать, и этот оттенок сохранился в английском OBSERVE «соблюдать» и в польском OBSERWOWAĆ в значении «следить, присматривать». Русское «наблюдение» построено из своих частей, от «блюсти» — то есть «хранить, соблюдать», — и это буквальная калька того же латинского образа: приставка плюс глагол сохранения. Так что польское и русское слова значат одно и собраны по одной схеме, только польский взял латинское целиком, а русский перевёл по частям, как и в случае REGUŁA и «правила»."
memory: "Класс на -cja: родительный, дательный и местный совпадают в obserwacji, как produkcji и dyskusji. Старая форма родительного множественного — obserwacyj. Под наблюдением — pod obserwacją, с творительным. Служебный контроль лучше назвать nadzór. От латинского observare «сторожить», а русское «наблюдение» — калька того же образа, от «блюсти»."
