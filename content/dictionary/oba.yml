# review
id: oba
format: 2
lemma: "oba"
rank: 353
pos: num
pron: { cyr: "о́ба" }
senses:
  - id: both-masc
    ru: "оба (о мужчинах и о предметах мужского рода)"
    note: "obaj — о мужчинах, oba — о предметах; формы различаются по роду."
    examples:
      - pl: "Obaj bracia są muzykami."
        ru: "Оба брата - музыканты."
        source: { kind: tatoeba, id: 2974955 }
      - pl: "Obaj są w tym samym wieku."
        ru: "Они оба одного возраста."
        source: { kind: tatoeba, id: 6995442 }
      - pl: "Obaj mężczyźni zostali uratowani."
        ru: "Оба мужчины были спасены."
        source: { kind: tatoeba, id: 6396835 }
  - id: both-mixed
    ru: "обе — obie; оба (он и она) — oboje"
    examples:
      - pl: "Obie wiemy, co trzeba zrobić."
        ru: "Мы обе знаем, что нужно сделать."
        source: { kind: tatoeba, id: 8661251 }
      - pl: "Oboje wiemy, że to nieprawda."
        ru: "Мы оба знаем, что это неправда."
        source: { kind: tatoeba, id: 6603316 }
      - pl: "Dziękuję wam obojgu."
        ru: "Спасибо вам обоим."
        source: { kind: tatoeba, id: 6154782 }
notes:
  - { kind: usage, text: "Главное отличие от русского: там два слова («оба», «обе»), а в польском три. obaj — о мужчинах, obie — о женщинах, oba — о вещах, oboje — о смешанной паре: Oboje wiemy «Мы оба (он и она) знаем»." }
  - { kind: usage, text: "Косвенные падежи тоже двойные: obu / obojga (родительный), obu / obojgu (дательный), oboma / obiema / obojgiem (творительный)." }
  - { kind: usage, text: "obiema rękami — «обеими руками»; po obu stronach — «по обе стороны»." }
collocations:
  - { pl: "obaj bracia", ru: "оба брата" }
  - { pl: "obie siostry", ru: "обе сестры" }
  - { pl: "oboje rodzice", ru: "оба родителя" }
  - { pl: "po obu stronach", ru: "по обе стороны" }
etymology: "Праславянское *oba — то же слово, что русское «оба»; польский сохранил больше родовых форм."
memory: "В польском три формы там, где в русском две: obaj — о мужчинах, obie — о женщинах, oboje — о смешанной паре. Oboje wiemy значит «мы оба, он и она, знаем»."
idioms:
  - { pl: "po obu stronach", ru: "по обе стороны" }
  - { pl: "obiema rękami", ru: "обеими руками" }
  - { pl: "oboje rodzice", ru: "оба родителя" }
formExamplesSkip:
  - { form: "obaj", cell: "Звательный", reason: "звательный падеж: в обращении это слово не употребляется" }
