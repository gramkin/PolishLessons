notes:
  - { kind: false-friend, text: "Самая дорогая ловушка этой карточки — соседний глагол WYŁĄCZYĆ, который значит «выключить». Два польских слова похожи на вид, но корни у них разные: WYKLUCZYĆ собран из KLUCZ «ключ», а WYŁĄCZYĆ из ŁĄCZYĆ «соединять». Поэтому WYŁĄCZ ŚWIATŁO это «выключи свет», а WYKLUCZ GO Z LISTY «исключи его из списка». Русская пара «исключить — выключить» путается точно так же, так что проверять приходится обоим." }
  - { kind: government, text: "Управление совпадает с русским полностью. Кого исключают — винительный, откуда — предлог Z с родительным: WYKLUCZYĆ KOGOŚ Z KLUBU «исключить кого-то из клуба». Во втором значении дополнением становится сама возможность, тоже в винительном: WYKLUCZYĆ MOŻLIWOŚĆ, WYKLUCZYĆ ZAPALENIE PŁUC. Очень частая конструкция с отрицанием и союзом ŻE: NIE WYKLUCZAM, ŻE SIĘ SPÓŹNIĘ — «не исключаю, что опоздаю»." }
  - { kind: pronunciation, text: "Читается «выклу́чычь», четыре слога, ударение на третьем от начала, то есть на предпоследнем. Первая Y звучит как «ы», вторая тоже: начало «вык», конец «чычь». Буква U в середине даёт «у». Сочетание CZ твёрдое «ч», конечное Ć мягкое «чь». В страдательном причастии WYKLUCZONY слышно «выклучо́ны», а в существительном WYKLUCZENIE «выклучэ́не»." }
  - { kind: usage, text: "Пятьдесят три формы — подпись переходного глагола совершенного вида: есть деепричастие на -WSZY и полное страдательное причастие, действительного на -ĄCY нет. Мужско-личная форма WYKLUCZENI здесь совершенно нормальна, потому что исключают именно людей: OSOBY WYKLUCZONE «исключённые лица», WYKLUCZENIE SPOŁECZNE «социальное исключение». Видовой партнёр — WYKLUCZAĆ, и в значении «не исключаю» употребляется почти только он." }
  - { kind: register, text: "Слово нейтральное, но тяготеет к официальной речи: уставы, медицинские заключения, спортивные регламенты, социология. В разговоре чаще всего слышно одно слово WYKLUCZONE в роли отказа: это ровно русское «исключено». Частые обороты: WYKLUCZYĆ MOŻLIWOŚĆ «исключить возможность», WYKLUCZYĆ Z GRY «исключить из игры», NIE WYKLUCZAM «не исключаю», WYKLUCZENIE SPOŁECZNE." }
collocations:
  - { pl: "wykluczyć możliwość", ru: "исключить возможность" }
  - { pl: "wykluczyć z gry", ru: "исключить из игры" }
