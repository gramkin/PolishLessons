etymology: "Приставка WY- плюс KLUCZ «ключ», от праславянского *kľučь, откуда и русское «ключ». Образ прямой: запереть дверь на ключ так, чтобы человек остался снаружи. Русское «исключить» собрано из тех же частей тем же способом: из + ключ + ить. Оба слова не выросли сами по себе, а переведены по частям с латинского EXCLUDERE, где EX- значит «вне», а CLAUDERE «запирать». Каждый язык взял своё слово для ключа и свою приставку, и получились два почти одинаковых по устройству глагола. Из того же гнезда WŁĄCZYĆ и WYŁĄCZYĆ не происходят: там корень ŁĄCZYĆ «соединять»."
memory: "Устроено как русское «исключить», часть в часть: wy- это из-, klucz это ключ, и оба слова переведены по частям с латинского excludere «запереть снаружи». Управление тоже совпадает: wykluczyć kogoś z klubu. Главная ловушка — похожий с виду wyłączyć «выключить», у которого совсем другой корень, łączyć «соединять». Одно слово стоит запомнить целиком: WYKLUCZONE значит «исключено» и работает как готовый отказ."
idioms:
  - { pl: "to wykluczone", ru: "это исключено" }
