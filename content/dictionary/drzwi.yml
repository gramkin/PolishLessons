# review
id: drzwi
format: 2
lemma: "drzwi"
rank: 324
pos: noun
pron: { cyr: "джви" }
senses:
  - id: door
    ru: "дверь (всегда во множественном числе)"
    note: "To są drzwi буквально «Это двери», но значит «Это дверь»."
    examples:
      - pl: "To są drzwi."
        ru: "Это дверь."
        source: { kind: tatoeba, id: 12824929 }
      - pl: "Drzwi są czerwone."
        ru: "Дверь красная."
        source: { kind: tatoeba, id: 2144802 }
      - pl: "Otwórz drzwi."
        ru: "Открой дверь."
        source: { kind: tatoeba, id: 6602603 }
  - id: door-phrases
    ru: "дверь (в оборотах)"
    examples:
      - pl: "Drzwi były otwarte."
        ru: "Дверь была открыта."
        source: { kind: tatoeba, id: 3802823 }
      - pl: "Nie otwieraj drzwi."
        ru: "Не открывай двери."
        source: { kind: tatoeba, id: 12470002 }
      - pl: "Otworzyła drzwi."
        ru: "Она открыла дверь."
        source: { kind: tatoeba, id: 998634 }
notes:
  - { kind: false-friend, text: "Главное отличие от русского: drzwi всегда во множественном числе, даже когда дверь одна. To są drzwi значит «Это дверь», Drzwi są czerwone — «Дверь красная»." }
  - { kind: usage, text: "Поэтому и считаются они собирательными числительными: jedne drzwi «одна дверь», dwoje drzwi «две двери», troje drzwi «три двери»." }
  - { kind: usage, text: "w drzwiach — «в дверях», za drzwiami — «за дверью», przy drzwiach — «у двери»." }
  - { kind: usage, text: "pokazać komuś drzwi значит «указать на дверь», то есть выгнать." }
collocations:
  - { pl: "otworzyć drzwi", ru: "открыть дверь" }
  - { pl: "zamknąć drzwi", ru: "закрыть дверь" }
  - { pl: "w drzwiach", ru: "в дверях" }
  - { pl: "za drzwiami", ru: "за дверью" }
etymology: "Праиндоевропейское *dʰwer- «дверь»; то же слово, что русское «дверь» и санскритское dvāra. Множественное число — след старой двустворчатой двери."
memory: "drzwi всегда множественного числа, даже об одной двери: To są drzwi значит «Это дверь». И считаются собирательно: jedne drzwi, dwoje drzwi."
idioms:
  - { pl: "pokazywać drzwi", ru: "указать на дверь" }
  - { pl: "drzwi otwarte", ru: "день открытых дверей" }
  - { pl: "walić drzwiami i oknami", ru: "ломиться во все двери" }
