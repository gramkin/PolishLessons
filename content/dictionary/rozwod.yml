# review
id: rozwod
format: 2
lemma: "rozwód"
rank: 2159
pos: noun
pron: { cyr: "ро́звут" }
senses:
  - id: divorce
    ru: "развод (расторжение брака)"
    examples:
      - pl: "Wzięli rozwód po dwudziestu latach."
        ru: "Они развелись после двадцати лет."
        source: { kind: authored }
      - pl: "Pozew o rozwód złożyła w marcu."
        ru: "Иск о разводе она подала в марте."
        source: { kind: authored }
      - pl: "Po rozwodzie wrócił do rodzinnego miasta."
        ru: "После развода он вернулся в родной город."
        source: { kind: authored }
  - id: proceedings
    ru: "бракоразводный процесс"
    examples:
      - pl: "Rozwód ciągnął się dwa lata."
        ru: "Развод тянулся два года."
        source: { kind: authored }
      - pl: "Rozwody bez orzekania o winie idą szybciej."
        ru: "Разводы без установления вины идут быстрее."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ПОЛЬСКОЕ СЛОВО УЖЕ РУССКОГО. Rozwód собран как «развод» — roz- это раз-, корень тот же, что в wodzić «водить», — но значит только расторжение брака. Русский «развод» несёт ещё два смысла, которых у польского нет: военный «развод караула» (по-польски zmiana warty) и разговорное «развод» в смысле обмана, «развести на деньги» (по-польски naciąganie, oszustwo). Переводя с русского, каждый раз проверяйте, о чём речь." }
  - { kind: pronunciation, text: "ó держится только в закрытом слоге: rozwód, но rozwodu, rozwody, rozwodzie. Правило уже знакомо по ogród/ogrodu и głód/głodu. Конечное d при этом оглушается, и слово звучит «ро́звут». В предложном падеже d смягчается в dzi: w rozwodzie — как ogród даёт w ogrodzie, а lud даёт w ludzie." }
  - { kind: usage, text: "Глагол rozwodzić się значит не только «разводиться». В обороте rozwodzić się NAD czymś он значит «распространяться, разглагольствовать о чём-то»: nie rozwodź się nad tym «не распространяйся об этом». Смысл различает предлог: się z kimś — развод, się nad czymś — многословие." }
collocations:
  - { pl: "wziąć rozwód", ru: "развестись" }
  - { pl: "pozew o rozwód", ru: "иск о разводе" }
  - { pl: "po rozwodzie", ru: "после развода" }
family:
  - { pl: "rozwieść się", ru: "развестись", relation: derived }
  - { pl: "rozwodnik", ru: "разведённый мужчина", relation: derived }
  - { pl: "rozwódka", ru: "разведённая женщина", relation: derived }
  - { pl: "wodzić", ru: "водить", relation: root, id: wodzic }
etymology: "Приставка roz- (русское раз-) плюс корень wod-, тот же, что в wodzić «водить» и wieść. Буквально «разведение в стороны» — русское «развод» собрано из тех же частей тем же способом. Отсюда rozwieść się, rozwodnik, rozwódka и rozwodowy «бракоразводный»."
memory: "rozwód — «развод», но только о браке: караул по-польски не разводят, и на деньги тоже. Запомните чередование: rozwód, но rozwodu и w rozwodzie — ó держится лишь в закрытом слоге, а d перед -e смягчается в dzi."
idioms:
  - { pl: "wziąć rozwód", ru: "развестись" }
  - { pl: "rozwodzić się nad czymś", ru: "распространяться о чём-л." }
