# review
id: nadejscie
format: 2
lemma: "nadejście"
rank: 6070
pos: noun
pron: { cyr: "надэ́йсьце" }
senses:
  - id: coming
    ru: "наступление, приход (времени года, события)"
    examples:
      - pl: "Z nadejściem zimy dni stają się coraz krótsze."
        ru: "С наступлением зимы дни становятся всё короче."
        source: { kind: translated, id: 980581 }
      - pl: "Wszyscy czekali na nadejście wiosny."
        ru: "Все ждали прихода весны."
        source: { kind: authored }
      - pl: "Przed nadejściem burzy zrobiło się ciemno."
        ru: "Перед началом грозы стемнело."
        source: { kind: authored }
  - id: arrival
    ru: "прибытие, поступление (письма, посылки, человека)"
    examples:
      - pl: "Po nadejściu przesyłki prosimy o potwierdzenie."
        ru: "После получения посылки просим подтвердить."
        source: { kind: authored }
      - pl: "Nadejście listu zmieniło wszystko."
        ru: "Пришедшее письмо всё изменило."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Отглагольное от NADEJŚĆ, «наступить, прийти». Чаще всего о времени и погоде: nadejście wiosny, zimy, nocy, burzy; Z NADEJŚCIEM — «с наступлением» (творительный, как в русском). О почте — «поступление»: nadejście przesyłki. Употребляется в единственном числе." }
  - { kind: false-friend, text: "Русскому «надежда» созвучно, но NADEJŚCIE к ней не относится: это NA- + DEJŚĆ, «дойти, прийти». Надежда — NADZIEJA." }
  - { kind: pronunciation, text: "«надэ́йсьце»: J слышится как «й», ŚCIE — «сьце». Ударение на предпоследнем слоге DEJ." }
  - { kind: register, text: "Книжное и нейтрально-письменное: в новостях, прогнозах, официальных письмах. В разговоре чаще глагол: jak przyjdzie zima, «когда придёт зима»." }
collocations:
  - { pl: "nadejście wiosny", ru: "приход весны" }
  - { pl: "z nadejściem", ru: "с наступлением" }
  - { pl: "czekać na nadejście", ru: "ждать наступления" }
family:
  - { pl: "nadejść", ru: "наступить, прийти", relation: root, id: nadejsc }
  - { pl: "nadchodzić", ru: "приближаться, наступать", relation: root }
  - { pl: "nadchodzący", ru: "наступающий, грядущий", relation: derived }
etymology: "От NADEJŚĆ: приставка NA- и -DEJŚĆ, форма корня IŚĆ, «идти», та же, что в ODEJŚĆ, PODEJŚĆ. В русском той же мысли отвечает «наступление»: время «наступает», а в польском «приходит»."
memory: "Nadejście — приход, наступление: от nadejść. Z nadejściem zimy — с наступлением зимы. Не надежда (nadzieja)! Только в единственном числе."
idioms:
  - { pl: "z nadejściem nocy", ru: "с наступлением ночи" }
