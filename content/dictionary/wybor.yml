pos: noun
pron: { cyr: "вы́бур" }
senses:
  - id: choice
    ru: "выбор"
    examples:
      - pl: "Jaki mam wybór?"
        ru: "Какой у меня выбор?"
        source: { kind: tatoeba, id: 6602822 }
      - pl: "Nie mamy wyboru."
        ru: "У нас нет выбора."
        source: { kind: tatoeba, id: 3143859 }
      - pl: "Obawiam się, że nie mam wyboru."
        ru: "Боюсь, у меня нет выбора."
        source: { kind: tatoeba, id: 3787743 }
  - id: elections
    ru: "выборы (во множественном числе)"
    examples:
      - pl: "Wybory były w listopadzie."
        ru: "Выборы были в ноябре."
        source: { kind: tatoeba, id: 12259373 }
      - pl: "Na kogo głosowałeś w wyborach?"
        ru: "За кого ты голосовал на выборах?"
        source: { kind: translated, id: 4755968 }
      - pl: "W większości wyborów, kandydat który dostaje większość głosów, wygrywa wybory."
        ru: "Как правило кандидат, получивший большинство голосов, выигрывает выборы."
        source: { kind: tatoeba, id: 3777849 }
notes:
  - { kind: usage, text: "Множественное wybory значит «выборы» — политические: Wybory były w listopadzie «Выборы были в ноябре»." }
  - { kind: usage, text: "nie mieć wyboru — «не иметь выбора»; z wyboru — «по собственному выбору»." }
  - { kind: usage, text: "Чередование ó/o при склонении: wybór, но wyboru, wyborem, w wyborze." }
  - { kind: usage, text: "Слово от wybrać «выбрать», ровно как русское «выбор» от «выбрать»." }
collocations:
  - { pl: "nie mieć wyboru", ru: "не иметь выбора" }
  - { pl: "z wyboru", ru: "по собственному выбору" }
  - { pl: "wybory parlamentarne", ru: "парламентские выборы" }
  - { pl: "duży wybór", ru: "большой выбор" }
etymology: "От wybrać «выбрать», из wy- + brać. Русское «выбор» собрано ровно из тех же частей."
memory: "wybór — «выбор», а во множественном wybory — уже «выборы». Помните чередование ó/o: wybór, но wyboru, w wyborze."
idioms:
