etymology: "Из латинского caritas, «дороговизна; любовь, милосердие», от carus «дорогой, милый». Через церковную латынь слово стало обозначать христианскую любовь к ближнему. CARITAS POLSKA и сейчас — название крупнейшей католической благотворительной организации в Польше. От того же carus — французское cher и английское charity."
memory: "Charytatywny — благотворительный: koncert charytatywny, cele charytatywne. Из латинского caritas, милосердие. Charytatywnie — безвозмездно. Читается «харытаты́вны», ры и ты твёрдые."
