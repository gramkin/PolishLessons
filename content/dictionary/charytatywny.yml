notes:
  - { kind: false-friend, text: "Русскому CHARYTATYWNY непонятно: в русском «харитативный» не прижилось, а говорят «благотворительный». Польское слово пришло из латыни, caritas, «милосердие, любовь к ближнему», и в быту оно основное. Синоним DOBROCZYNNY звучит старомодно: TOWARZYSTWO DOBROCZYNNOŚCI. Благотворительность как явление — DZIAŁALNOŚĆ CHARYTATYWNA." }
  - { kind: usage, text: "Относительное прилагательное, степеней сравнения нет. Формы для мужчин-людей CHARYTATYWNI в карточке нет: благотворительными бывают концерты и фонды, а людей называют DARCZYŃCY или WOLONTARIUSZE. Остальные десять форм живые." }
  - { kind: government, text: "Ставится после существительного: KONCERT CHARYTATYWNY, AUKCJA CHARYTATYWNA, ZBIÓRKA CHARYTATYWNA. На благотворительность — NA CELE CHARYTATYWNE, NA с винительным. Наречие CHARYTATYWNIE, «бесплатно, на благотворительных началах»: GRAĆ CHARYTATYWNIE." }
  - { kind: pronunciation, text: "Читается «харытаты́вны», пять слогов, ударение на предпоследнем. CH даёт «х», RY — твёрдое «ры», TY — твёрдое «ты». Никакого мягкого «ри» и «ти», как в русском «харизма»." }
  - { kind: register, text: "Нейтральное слово, из новостей и объявлений. В Польше всем известна WIELKA ORKIESTRA ŚWIĄTECZNEJ POMOCY, огромная ежегодная благотворительная акция: в январе по всей стране собирают деньги в коробки с красным сердечком. Слово CHARYTATYWNY поляк слышит каждый год с детства." }
