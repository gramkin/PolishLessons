# review
id: nazwac
format: 2
lemma: "nazwać"
rank: 668
pos: verb
aspect: perf
aspectPair: nazywac
pron: { cyr: "на́зваць" }
senses:
  - id: call-someone
    ru: "назвать кого-л. кем-л. (винительный + творительный)"
    note: "nazwał mnie tchórzem — управление совпадает с русским."
    examples:
      - pl: "Mój przyjaciel nazwał mnie tchórzem."
        ru: "Мой друг назвал меня трусом."
        source: { kind: tatoeba, id: 2145981 }
      - pl: "Nazwał cię wręcz hipokrytą."
        ru: "Он прямо назвал тебя лицемером."
        source: { kind: translated, id: 551590 }
      - pl: "Trudno go nazwać dżentelmenem."
        ru: "Его трудно назвать джентльменом."
        source: { kind: translated, id: 411554 }
  - id: give-a-name
    ru: "дать имя, назвать"
    examples:
      - pl: "Nazwali psa Shiro."
        ru: "Они назвали пса Широ."
        source: { kind: translated, id: 368392 }
      - pl: "Nazwali statek Mayflower."
        ru: "Они назвали корабль «Мэйфлауэр»."
        source: { kind: translated, id: 760244 }
      - pl: "Nazwałem kota \"Tama\"."
        ru: "Я назвал кота «Тама»."
        source: { kind: translated, id: 5489387 }
  - id: named
    ru: "nazwany — названный"
    examples:
      - pl: "Dziecko zostało nazwane John, po swym wujku."
        ru: "Ребёнка назвали Джоном, в честь дяди."
        source: { kind: translated, id: 643797 }
      - pl: "Klaczkę nazwano \"Kometa\", ponieważ była bardzo szybka."
        ru: "Кобылку назвали «Комета», потому что она была очень быстрой."
        source: { kind: translated, id: 12470206 }
      - pl: "Mary otrzymała nagrodę za swoją kompozycję nazwaną \"Sekretna miłość\"."
        ru: "Мэри получила награду за композицию под названием «Тайная любовь»."
        source: { kind: translated, id: 4225509 }
  - id: call-it
    ru: "Nazwij to jak chcesz — называй как хочешь"
    examples:
      - pl: "Nazwij to jak chcesz."
        ru: "Называй это как хочешь."
        source: { kind: tatoeba, id: 6109745 }
      - pl: "Nazwijmy rzeczy po imieniu."
        ru: "Назовём вещи своими именами."
        source: { kind: translated, id: 7362450 }
      - pl: "\"Skąd taki przesąd?\" \"Nazwijmy to mądrością ludową.\""
        ru: "Назовём это народной мудростью."
        source: { kind: translated, id: 501978 }
notes:
  - { kind: government, text: "nazwać kogoś KIMŚ — винительный плюс творительный: nazwał mnie tchórzem «назвал меня трусом». Здесь польский и русский совпадают полностью." }
  - { kind: false-friend, text: "Главная ловушка не в самом глаголе, а в омонимии: формы nazwie, nazwę, nazwą совпадают с падежами существительного nazwa «название», и в тексте вам гораздо чаще попадётся именно оно — pod nazwą, o nazwie ambient, zmienić nazwę pliku." }
  - { kind: usage, text: "Несовершенный вид — nazywać, а возвратное nazywać się значит «называться, зваться»: Jak się nazywasz? «Как тебя зовут?»." }
  - { kind: usage, text: "Оборот nazwać rzeczy po imieniu «назвать вещи своими именами» — калька того же выражения." }
collocations:
  - { pl: "nazwać rzeczy po imieniu", ru: "назвать вещи своими именами" }
  - { pl: "Jak się nazywasz?", ru: "Как тебя зовут?" }
  - { pl: "nazwać kogoś kimś", ru: "назвать кого-либо кем-либо" }
  - { pl: "pod nazwą", ru: "под названием" }
family:
  - { pl: "nazywać", ru: "называть", relation: aspect }
  - { pl: "zwać", ru: "звать", relation: root }
  - { pl: "nazwa", ru: "название", relation: derived }
  - { pl: "nazwisko", ru: "фамилия", relation: derived }
etymology: "Приставка na- плюс zwać «звать», праславянское *zъvati — то же слово, что русское «звать». «Назвать» собрано тем же способом."
memory: "nazwać — «назвать», и собрано оно как русское: na- плюс zwać. Управление совпадает: nazwać kogoś KIMŚ, винительный плюс творительный — nazwał mnie tchórzem. Главная ловушка не в глаголе, а в омонимии: формы nazwie, nazwę, nazwą совпадают с падежами существительного nazwa «название», и в тексте вам чаще попадётся именно оно — pod nazwą, zmienić nazwę pliku. Несовершенный вид — nazywać, а nazywać się значит «зваться»."
idioms:
  - { pl: "nazwać rzeczy po imieniu", ru: "назвать вещи своими именами" }
  - { pl: "Jak się nazywasz?", ru: "Как тебя зовут?" }
  - { pl: "pod nazwą", ru: "под названием" }
