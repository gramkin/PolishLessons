notes:
  - { kind: false-friend, text: "SKARPETKA — «носок» на ногу. Носок ботинка — NOSEK. Толстый, грубый носок — SKARPETA. Колготки — RAJSTOPY, гольфы — PODKOLANÓWKI." }
  - { kind: usage, text: "Девять живых форм, женский род. Обычно во множественном: SKARPETKI. Перед E K переходит в C: W SKARPETCE. Родительный множественного — SKARPETEK. Звательный не даётся." }
  - { kind: government, text: "Пара носков — PARA SKARPETEK, родительный. В носках — W SKARPETKACH, местный. Надеть носки — ZAŁOŻYĆ SKARPETKI." }
  - { kind: pronunciation, text: "Читается «скарпэ́тка», ударение на предпоследнем слоге. PE — твёрдое «пэ»." }
collocations:
  - { pl: "para skarpetek", ru: "пара носков" }
  - { pl: "ciepłe skarpetki", ru: "тёплые носки" }
  - { pl: "chodzić w skarpetkach", ru: "ходить в носках" }
family:
