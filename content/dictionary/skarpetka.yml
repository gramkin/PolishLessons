  - { pl: "skarpeteczka", ru: "носочек", relation: derived }
  - { pl: "skarpety nie do pary", ru: "непарные носки", relation: derived }
etymology: "Из итальянского слова со значением «башмачок», уменьшительного от слова «обувь». В польском значение сместилось с обуви на носок."
memory: "Skarpetka — носок; skarpetki — носки. Читается «скарпэ́тка». Para skarpetek — пара носков. Rajstopy — колготки."
idioms:
  - { pl: "nie do pary", ru: "непарный, без пары" }
