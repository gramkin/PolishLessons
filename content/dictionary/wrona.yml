# review
id: wrona
format: 2
lemma: "wrona"
rank: 2526
pos: noun
pron: { cyr: "вро́на" }
senses:
  - id: crow
    ru: "ворона"
    examples:
      - pl: "Wrony są czarne."
        ru: "Вороны чёрные."
        source: { kind: tatoeba, id: 5489369 }
      - pl: "To nie wrona, tylko kawka."
        ru: "Это не ворона, а галка."
        source: { kind: translated, id: 12206626 }
      - pl: "To nie jest kruk, wrona ani sroka. To jest gawron."
        ru: "Это не ворон, не ворона и не сорока. Это грач."
        source: { kind: translated, id: 3416285 }
  - id: proverb
    ru: "ворона (в пословице о чужом обычае)"
    examples:
      - pl: "Kiedy wejdziesz między wrony, musisz krakać jak i one."
        ru: "Попав к воронам, каркай как они."
        source: { kind: translated, id: 353190 }
      - pl: "Jeśli wejdziesz między wrony, musisz krakać jak i one."
        ru: "Если попал к воронам, надо каркать как они."
        source: { kind: translated, id: 442940 }
notes:
  - { kind: false-friend, text: "Русская «ворона» и польское wrona — одно слово, опять с полногласием: wrona/ворона, как krowa/корова." }
  - { kind: government, text: "Женский род: ta wrona, tej wrony." }
  - { kind: usage, text: "Пословица Kiedy wejdziesz między wrony, musisz krakać jak i one — польский вариант русского «С волками жить — по-волчьи выть»." }
  - { kind: usage, text: "Не путайте с kruk «ворон», gawron «грач» и kawka «галка» — в корпусе они прямо противопоставлены." }
collocations:
  - { pl: "czarny jak wrona", ru: "чёрный как ворона" }
etymology: "Праславянское *vorna; русская «ворона» — то же слово, с полногласием."
