  - id: in-corridor
    ru: "коридор (в коридоре, по коридору)"
    examples:
      - pl: "Jej głos wybrzmiewał w korytarzu."
        ru: "Её голос звучал в коридоре."
        source: { kind: translated, id: 8755272 }
      - pl: "Ivan spotkał Rimę w głównym korytarzu."
        ru: "Иван встретил Риму в главном коридоре."
        source: { kind: translated, id: 12060439 }
      - pl: "Bieganie po korytarzach jest zabronione."
        ru: "Бегать по коридорам запрещено."
        source: { kind: translated, id: 11012044 }
notes:
  - { kind: government, text: "В коридоре — w korytarzu (предложный падеж); по коридору — korytarzem (творительный): szła korytarzem «она шла по коридору»." }
  - { kind: usage, text: "na końcu korytarza — «в конце коридора», обычный ориентир в доме или гостинице." }
  - { kind: usage, text: "Слово мужского рода: ten korytarz, długi korytarz." }
  - { kind: false-friend, text: "Русское «коридор» и польское korytarz — одно слово из итальянского, но польское получило суффикс -arz, как piekarz «пекарь»." }
  - { kind: government, text: "Родительный падеж множественного числа — korytarzy. Существительные на -arz дают -y (lekarzy, pisarzy), а не -ów." }
collocations:
  - { pl: "w korytarzu", ru: "в коридоре" }
  - { pl: "na końcu korytarza", ru: "в конце коридора" }
  - { pl: "iść korytarzem", ru: "идти по коридору" }
family:
  - { pl: "korytarzyk", ru: "коридорчик", relation: root }
  - { pl: "pokój", ru: "комната", relation: root, id: pokoj }
  - { pl: "drzwi", ru: "дверь", relation: root, id: drzwi }
etymology: "Из итальянского corridoio через немецкий, с польским суффиксом -arz. Русское «коридор» пришло тем же путём, но без суффикса."
memory: "korytarz — «коридор»: w korytarzu «в коридоре», iść korytarzem «идти по коридору», na końcu korytarza «в конце коридора»."
idioms:
  - { pl: "w korytarzu", ru: "в коридоре" }
  - { pl: "na końcu korytarza", ru: "в конце коридора" }
  - { pl: "iść korytarzem", ru: "идти по коридору" }
formExamplesSkip:
  - { form: "korytarzów", reason: "существительные на -arz образуют родительный падеж множественного числа на -y: lekarzy, pisarzy, korytarzy. Вариант на -ów у этого слова не употребляется" }
