notes:
  - { kind: government, text: "В коридоре — w korytarzu (предложный падеж); по коридору — korytarzem (творительный): szła korytarzem «она шла по коридору»." }
  - { kind: usage, text: "na końcu korytarza — «в конце коридора», обычный ориентир в доме или гостинице." }
  - { kind: usage, text: "Слово мужского рода: ten korytarz, długi korytarz." }
  - { kind: false-friend, text: "Русское «коридор» и польское korytarz — одно слово из итальянского, но польское получило суффикс -arz, как piekarz «пекарь»." }
