notes:
  - { kind: false-friend, text: "ОДНО польское слово на ДВА русских. Naturalny покрывает и «натуральный» — о материалах и продуктах (naturalny sok, naturalna wełna), — и «естественный» — о процессах, причинах и поведении (naturalny proces, śmierć naturalna, to naturalne). Русский держит здесь пару: заимствованное «натуральный» и своё «естественный». Польский обходится одним словом, поэтому перевод выбирается по тому, о чём речь: о вещи или о ходе дел." }
  - { kind: usage, text: "Запомните обороты. To naturalne — «это естественно», очень частая формула: to naturalne, że się boisz. Naturalnej wielkości — «в натуральную величину». Naturalni rodzice — «биологические родители», в отличие от rodzice przysposabiający «приёмные»." }
  - { kind: government, text: "Прилагательное склоняется полностью и даёт три степени: naturalny — naturalniejszy — najnaturalniejszy. Мужско-личная форма множественного — naturalni. Степени здесь образуются обычным суффиксом -szy, без чередований, в отличие от niski — niższy." }
  - { kind: pronunciation, text: "Прилагательное даёт три степени, и каждая склоняется полностью: положительная, сравнительная и превосходная с приставкой naj-. Поэтому различных форм здесь 33, а не одиннадцать. Тот же образец уже разобран на карточках niski и żałosny." }
collocations:
  - { pl: "naturalny sok", ru: "натуральный сок" }
  - { pl: "śmierć naturalna", ru: "естественная смерть" }
  - { pl: "naturalnej wielkości", ru: "в натуральную величину" }
family:
  - { pl: "natura", ru: "природа; натура", relation: root, id: natura }
  - { pl: "naturalnie", ru: "естественно, конечно", relation: derived }
  - { pl: "sztuczny", ru: "искусственный", relation: antonym }
etymology: "Из латинского naturalis, от natura «природа». Русский взял из того же латинского источника «натуральный», но сохранил и своё «естественный», от «естество». Поэтому там, где русский выбирает между заимствованием и родным словом, польский держится одного naturalny — и именно это различие приходится держать в голове при переводе."
memory: "naturalny — и «натуральный» (sok, wełna), и «естественный» (proces, śmierć). Русский делит это на два слова, польский — нет. Запомните формулу to naturalne «это естественно» и naturalni rodzice «биологические родители»."
idioms:
  - { pl: "to naturalne", ru: "это естественно" }
  - { pl: "naturalnej wielkości", ru: "в натуральную величину" }
formExamplesSkip:
