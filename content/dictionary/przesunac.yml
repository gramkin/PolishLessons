      - pl: "Termin został przesunięty na marzec."
        ru: "Срок перенесён на март."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Глагол совершенного вида, пара к несовершенному PRZESUWAĆ. Формы przesunę, przesuniesz, przesunie означают будущее: «передвину», «передвинешь». Кроме прямого смысла, этот глагол переносит сроки: przesunąć spotkanie, przesunąć termin, przesunąć wyjazd. Русский в этом месте меняет приставку на «пере-», а польский обходится одним словом для обоих значений." }
  - { kind: pronunciation, text: "Главная примета класса на -nąć — чередование ą и ę в прошедшем времени. В мужском роде единственного числа стоит ą: PRZESUNĄŁ. Во всех остальных формах прошедшего — ę: przesunęła, przesunęło, przesunęli, przesunęły. Правило простое: ą только перед ł мужского рода, дальше везде ę. Русскому уху разница почти не слышна, а на письме ошибка бросается в глаза." }
  - { kind: usage, text: "Страдательное причастие здесь на -ty, а не на -ony: PRZESUNIĘTY, przesunięta, przesunięte. Так устроен весь класс на -nąć, тогда как глаголы на -ić дают -ony: podnosić — podnoszony. Выбор суффикса зависит от класса глагола, а не от значения, и запоминать его надо вместе с инфинитивом." }
collocations:
  - { pl: "przesunąć termin", ru: "перенести срок" }
  - { pl: "przesunąć meble", ru: "передвинуть мебель" }
  - { pl: "przesunąć spotkanie", ru: "перенести встречу" }
family:
  - { pl: "przesuwać", ru: "передвигать", relation: aspect }
  - { pl: "sunąć", ru: "скользить, двигаться", relation: root }
  - { pl: "przesunięcie", ru: "сдвиг, перенос", relation: derived }
etymology: "Приставка prze- «пере-» и глагол sunąć, из праславянского *sunǫti. Это тот же корень, что в русских «сунуть» и «совать», и даже суффикс совпадает: польское -ną- отвечает русскому -ну-. Так что przesunąć разбирается на знакомые части и читается как «пересунуть», а значение у него ровно такое."
memory: "ą только в мужском роде: przesunął, но przesunęła и przesunęli. И причастие на -ty: przesunięty, потому что весь класс на -nąć такой."
idioms:
