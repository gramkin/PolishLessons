        ru: "Передвинь кресло ближе к камину."
        source: { kind: authored }
  - id: reschedule
    ru: "перенести (срок, встречу)"
    examples:
      - pl: "Musimy przesunąć spotkanie na piątek."
        ru: "Мы должны перенести встречу на пятницу."
