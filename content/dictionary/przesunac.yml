rank: 2633
pos: verb
pron: { cyr: "пшэсу́нонць" }
senses:
  - id: move
    ru: "передвинуть, сдвинуть"
    examples:
      - pl: "Trzeba przesunąć szafę pod okno."
        ru: "Надо передвинуть шкаф к окну."
        source: { kind: authored }
      - pl: "Przesunął szafę i znalazł zgubiony klucz."
        ru: "Он передвинул шкаф и нашёл потерянный ключ."
        source: { kind: authored }
