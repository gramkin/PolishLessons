# review
id: zapytac
format: 2
lemma: "zapytać"
rank: 468
pos: verb
aspect: perf
pron: { cyr: "запы́таць" }
senses:
  - id: ask
    ru: "спросить"
    examples:
      - pl: "Zapytałem, dokąd iść."
        ru: "Я спросил, куда идти."
        source: { kind: tatoeba, id: 722382 }
      - pl: "Zapytałem go, gdzie mieszka."
        ru: "Я спросил его, где он живет."
        source: { kind: tatoeba, id: 4644254 }
      - pl: "Jutro go zapytam."
        ru: "Завтра я его спрошу."
        source: { kind: tatoeba, id: 975961 }
  - id: enquire
    ru: "спросить, обратиться с вопросом"
    examples:
      - pl: "Zapytajmy ich."
        ru: "Спросим их."
        source: { kind: tatoeba, id: 13830858 }
      - pl: "Zapytaj."
        ru: "Спроси."
        source: { kind: translated, id: 12359635 }
      - pl: "Wiedziałem, że Tom się zapyta."
        ru: "Я знал, что Том спросит."
        source: { kind: translated, id: 8326965 }
notes:
  - { kind: false-friend, text: "Русское «пытать» — то же праславянское слово, но значения разошлись: в польском pytać сохранило исходное «спрашивать». Zapytał mnie o drogę значит просто «Он спросил у меня дорогу»." }
  - { kind: usage, text: "Спрашивают о чём-то с предлогом o и винительным падежом: zapytać o cenę «спросить о цене», zapytać o radę «спросить совета»." }
  - { kind: usage, text: "Существительное zapytanie значит «запрос», а обычный «вопрос» — это pytanie." }
  - { kind: usage, text: "Несовершенный вид — pytać. Есть и возвратное zapytać się с тем же смыслом, чуть разговорнее." }
collocations:
  - { pl: "zapytać o radę", ru: "спросить совета" }
  - { pl: "zapytać o drogę", ru: "спросить дорогу" }
  - { pl: "zapytać o cenę", ru: "спросить о цене" }
  - { pl: "zapytaj go", ru: "спроси его" }
etymology: "Из za- + pytać, праславянское *pytati «расспрашивать». Русское «пытать» — то же самое слово, но у нас оно ушло к пытке, а в польском сохранило исходное значение."
memory: "zapytać — «спросить», и корень тот же, что в русском «пытать»: у поляков он остался мирным. Спрашивают с предлогом o: zapytać o drogę. А zapytanie это «запрос», обычный вопрос — pytanie."
idioms:
  - { pl: "zapytać o radę", ru: "спросить совета" }
  - { pl: "zapytać o drogę", ru: "спросить дорогу" }
  - { pl: "zapytać o cenę", ru: "спросить о цене" }
