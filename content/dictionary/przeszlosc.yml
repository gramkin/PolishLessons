senses:
  - id: past
    ru: "прошлое, прошедшее"
    examples:
      - pl: "Zostaw przeszłość za sobą."
        ru: "Оставь прошлое позади."
        source: { kind: tatoeba, id: 6154828 }
      - pl: "Przeszłość można znać, ale nie zmienić. Przyszłość można zmienić, ale nie znać."
        ru: "Прошлое можно только знать, но не изменять. Будущее можно только изменять, но не знать."
        source: { kind: tatoeba, id: 869647 }
      - pl: "Nie możemy zmienić przeszłości."
        ru: "Мы не можем изменить прошлое."
        source: { kind: translated, id: 3718733 }
  - id: in-past
    ru: "w przeszłości — в прошлом"
    examples:
      - pl: "Trzeba przedstawiać historię w szkolę tak, aby dzieci były dumne ze swojej przeszłości."
        ru: "Надо преподавать историю в школе так, чтобы дети гордились своим прошлым."
        source: { kind: tatoeba, id: 10115728 }
      - pl: "Często żałujemy przeszłości."
        ru: "Мы часто жалеем о прошлом."
        source: { kind: translated, id: 823853 }
      - pl: "W przeszłości bywało gorzej."
        ru: "В прошлом бывало хуже."
        source: { kind: authored }
  - id: live-in
    ru: "żyć przeszłością — жить прошлым"
    examples:
      - pl: "Musisz przestać żyć przeszłością."
        ru: "Тебе надо перестать жить прошлым."
        source: { kind: translated, id: 10698174 }
      - pl: "Nie martw się przeszłością."
        ru: "Не переживай о прошлом."
        source: { kind: translated, id: 6373396 }
      - pl: "Jestem twoją przeszłością."
        ru: "Я твоё прошлое."
        source: { kind: translated, id: 2148628 }
notes:
  - { kind: usage, text: "Тройка времён строится прозрачно: przeszłość «прошлое», teraźniejszość «настоящее», przyszłość «будущее». Различайте przeszłość и przyszłość — они похожи на письме, но значат противоположное." }
  - { kind: usage, text: "Слово образовано от przejść «пройти» с суффиксом -ość, как русское «прошлое» от «пройти». Прилагательное — przeszły «прошлый»: w przeszłym roku «в прошлом году»." }
  - { kind: government, text: "w przeszłości «в прошлом» — предложный падеж; żyć przeszłością «жить прошлым» — творительный, ровно как в русском." }
  - { kind: usage, text: "Множественного числа у слова практически нет: это отвлечённое понятие, как и русское «прошлое»." }
