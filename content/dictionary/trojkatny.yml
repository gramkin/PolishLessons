notes:
  - { kind: pronunciation, text: "Читается «труйко́нтны». Ó звучит как «у», J — как «й», а Ą перед T даёт «он»: KĄT — «конт», TRÓJKĄT — «тру́йконт». В прилагательном ударение сдвигается на предпоследний слог: TRÓJKĄTNY — «труйко́нтны». Двойное -TN- произносится полностью, без выпадения «т»." }
  - { kind: usage, text: "Слово описывает форму и не сравнивается: «более треугольного» не бывает, поэтому степеней сравнения нет и форм одиннадцать. Мужско-личная форма TRÓJKĄTNI существует только в таблице: треугольными бывают знаки, окна, паруса и косынки, а не люди. Для первой помощи важен термин CHUSTA TRÓJKĄTNA — треугольная косынка для перевязки руки." }
  - { kind: false-friend, text: "Корень KĄT значит «угол», а не «кант» и не «кат». Русское «треугольный» построено из «тре-» и «угол», польское TRÓJKĄTNY — из TRÓJ- «трёх-» и KĄT «угол». Само слово KĄT родственно русскому «кут», которое живёт в «закутке» и в выражении «красный кут» — угол избы." }
collocations:
