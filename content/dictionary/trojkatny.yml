etymology: "От TRÓJKĄT «треугольник», сложения TRÓJ- «трёх-» и KĄT «угол». KĄT родственно русскому «кут» (ср. «закуток»): польское Ą на месте русского «у» — след праславянского носового гласного."
memory: "KĄT — «кут», то есть «угол»; TRÓJKĄT — «трёхуголье», треугольник; TRÓJKĄTNY — «треугольный». Польский дорожный знак «Внимание» как раз треугольный: ZNAK TRÓJKĄTNY."
idioms:
  - { pl: "chusta trójkątna", ru: "косынка для перевязки (в аптечке первой помощи)" }
formExamplesSkip:
  - { form: "trójkątni", reason: "мужско-личная форма множественного числа: треугольными бывают предметы, а не люди, и естественного существительного-лица мужского рода при этом прилагательном нет" }
