notes:
  - { kind: false-friend, text: "PARTNERKA — «партнёрша», и в личной жизни это нейтральное слово для гражданской жены или подруги: MÓJ PARTNER, MOJA PARTNERKA. Жена — ŻONA, девушка — DZIEWCZYNA." }
  - { kind: usage, text: "Девять форм, женский род. В дательном и местном K переходит в C: O PARTNERCE. Родительный множественного — PARTNEREK. Звательный PARTNERKO не учим." }
