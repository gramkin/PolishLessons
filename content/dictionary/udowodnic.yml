# review
id: udowodnic
format: 2
lemma: "udowodnić"
rank: 1046
pos: verb
aspect: perf
pron: { cyr: "удово́дниць" }
senses:
  - id: prove
    ru: "доказать"
    examples:
      - pl: "Mogę to udowodnić."
        ru: "Я могу доказать это."
        source: { kind: tatoeba, id: 2495918 }
      - pl: "Możesz to udowodnić?"
        ru: "Можешь это доказать?"
        source: { kind: translated, id: 1604046 }
      - pl: "Udowodnił, że jest szpiegiem."
        ru: "Он доказал, что тот шпион."
        source: { kind: translated, id: 3848133 }
  - id: prove-to
    ru: "udowodnić komuś — доказать кому-то"
    examples:
      - pl: "Udowodnij mi to."
        ru: "Докажи мне это."
        source: { kind: translated, id: 8725828 }
      - pl: "Udowodnię ci, że się nie mylę."
        ru: "Я докажу тебе, что не ошибаюсь."
        source: { kind: translated, id: 6316951 }
  - id: proven
    ru: "udowodniony — доказанный"
    examples:
      - pl: "Udowodniono, że jest złodziejem."
        ru: "Было доказано, что он вор."
        source: { kind: tatoeba, id: 8675092 }
      - pl: "Tłumaczenie to cenne doświadczenie, nauka o udowodnionej skuteczności."
        ru: "Перевод — ценный опыт, наука с доказанной эффективностью."
        source: { kind: translated, id: 13035426 }
notes:
  - { kind: usage, text: "Страдательное причастие относится к делу, а не к человеку: udowodniona wina, udowodnione zarzuty. Мужско-личной формы udowodnieni не бывает — доказать можно вину, но не людей, поэтому эта форма осталась без примеров." }
  - { kind: government, text: "udowodnić coś komuś — винительный плюс дательный, ровно как русское «доказать что-то кому-то»: Udowodnij mi to «Докажи мне это»." }
  - { kind: usage, text: "Несовершенный вид — udowadniać. Корень — dowód «доказательство», от dowodzić «доказывать, командовать»." }
  - { kind: usage, text: "С союзом że: Udowodnił, że jest szpiegiem «Он доказал, что тот шпион»." }
  - { kind: usage, text: "Причастие udowodniony значит «доказанный»: udowodniona wina «доказанная вина», o udowodnionej skuteczności «с доказанной эффективностью»." }
collocations:
  - { pl: "udowodnić coś komuś", ru: "доказать кому-то" }
  - { pl: "udowodnić winę", ru: "доказать вину" }
  - { pl: "udowodniona skuteczność", ru: "доказанная эффективность" }
family:
  - { pl: "udowadniać", ru: "доказывать (несовершенный вид)", relation: aspect }
  - { pl: "dowód", ru: "доказательство", relation: root }
  - { pl: "dowodzić", ru: "доказывать; командовать", relation: root }
etymology: "Приставка u- плюс dowodzić «доказывать», от dowód «доказательство». Русское «доказать» собрано похоже, от «казать» плюс «до-»."
memory: "udowodnić — «доказать», совершенный вид к udowadniać. Управление как в русском: udowodnić coś komuś, винительный плюс дательный. Причастие udowodniony значит «доказанный»."
idioms:
  - { pl: "udowodnić winę", ru: "доказать вину" }
  - { pl: "udowodniona skuteczność", ru: "доказанная эффективность" }
formExamplesSkip:
  - { form: "udowodnieni", reason: "страдательное причастие относится к делу: udowodniona wina, udowodnione zarzuty, но не к человеку" }
  - { form: "udowodniwszy", reason: "книжное деепричастие прошедшего времени; в живой речи не употребляется" }
