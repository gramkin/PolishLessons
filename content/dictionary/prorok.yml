# review
id: prorok
format: 2
lemma: "prorok"
rank: 5145
pos: noun
pron: { cyr: "про́рок" }
senses:
  - id: prophet
    ru: "пророк"
    examples:
      - pl: "Mojżesz był wielkim prorokiem."
        ru: "Моисей был великим пророком."
        source: { kind: authored }
      - pl: "Prorok zapowiadał nadejście kary."
        ru: "Пророк предвещал наступление кары."
        source: { kind: authored }
      - pl: "Księgi proroków czyta się w kościele."
        ru: "Книги пророков читают в церкви."
        source: { kind: authored }
  - id: forecaster
    ru: "предсказатель (перен.)"
    examples:
      - pl: "Nie jestem prorokiem, nie wiem, co będzie."
        ru: "Я не пророк, не знаю, что будет."
        source: { kind: authored }
      - pl: "Obym był złym prorokiem."
        ru: "Типун мне на язык."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Десять форм, мужской род, лицо. Во множественном K переходит в C: PROROK, но PROROCY. Винительный равен родительному: SŁUCHAĆ PROROKA, WIDZIEĆ PROROKA." }
  - { kind: register, text: "OBYM BYŁ ZŁYM PROROKIEM, «лишь бы мне оказаться плохим пророком», говорят после мрачного прогноза, как наше «типун мне на язык». NIKT NIE JEST PROROKIEM WE WŁASNYM KRAJU — «нет пророка в своём отечестве», почти дословно. В газетах PROROK часто иронично: PROROCY GIEŁDY — «биржевые пророки»." }
  - { kind: government, text: "Быть пророком — BYĆ PROROKIEM, творительный. Книга пророка — KSIĘGA PROROKA, родительный. Пророчить что-то — PROROKOWAĆ COŚ, винительный." }
  - { kind: pronunciation, text: "Читается «про́рок», два слога, ударение на первом, тогда как у нас «проро́к». Во множественном PROROCY ударение на втором: «проро́цы»." }
collocations:
  - { pl: "fałszywy prorok", ru: "лжепророк" }
  - { pl: "księga proroka", ru: "книга пророка" }
  - { pl: "prorok Eliasz", ru: "пророк Илья" }
family:
  - { pl: "prorokować", ru: "пророчить", relation: derived }
  - { pl: "proroctwo", ru: "пророчество", relation: derived }
  - { pl: "proroczy", ru: "пророческий", relation: derived }
etymology: "Слово общеславянское, общее с русским «пророк»: приставка «про-» и корень со значением «говорить», то есть «тот, кто говорит наперёд». В польский оно пришло вместе с церковным языком, поэтому совпадает с русским почти полностью, кроме ударения."
memory: "Prorok — «пророк», но ударение на первом слоге: «про́рок». Во множественном prorocy. Obym był złym prorokiem — типун мне на язык. Nikt nie jest prorokiem we własnym kraju — нет пророка в своём отечестве."
idioms:
  - { pl: "obym był złym prorokiem", ru: "типун мне на язык" }
  - { pl: "nikt nie jest prorokiem we własnym kraju", ru: "нет пророка в своём отечестве" }
