notes:
  - { kind: false-friend, text: "KAMIZELKA — «жилет», хотя слово родня русскому «камзол». Спасательный жилет — KAMIZELKA RATUNKOWA, бронежилет — KAMIZELKA KULOODPORNA, светоотражающий — KAMIZELKA ODBLASKOWA." }
  - { kind: usage, text: "Девять живых форм, женский род. Перед E K переходит в C: W KAMIZELCE. Родительный множественного — KAMIZELEK. Звательный не даётся." }
  - { kind: government, text: "В жилете — W KAMIZELCE, местный. Жилет от костюма — KAMIZELKA OD GARNITURU, OD с родительным. Надеть жилет — ZAŁOŻYĆ KAMIZELKĘ." }
  - { kind: pronunciation, text: "Читается «камизэ́лька», ударение на предпоследнем слоге. ZE — твёрдое «зэ», L перед K мягкое." }
collocations:
  - { pl: "kamizelka ratunkowa", ru: "спасательный жилет" }
  - { pl: "kamizelka kuloodporna", ru: "бронежилет" }
  - { pl: "kamizelka odblaskowa", ru: "светоотражающий жилет" }
family:
