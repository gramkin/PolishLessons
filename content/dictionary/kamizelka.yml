etymology: "Из французского слова со значением «кофточка, нательная рубашка», через немецкий. Русское «камзол» — то же слово, пришедшее другим путём."
memory: "Kamizelka — жилет (родня «камзола»). Читается «камизэ́лька». Kamizelka ratunkowa — спасательный жилет, kuloodporna — бронежилет."
idioms:
