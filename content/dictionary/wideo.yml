notes:
  - { kind: government, text: "Слово не изменяется вовсе: одна форма на все рода, числа и падежи. KASETA WIDEO, KASETY WIDEO, KASETOM WIDEO — WIDEO остаётся как есть. И второе: оно стоит после существительного, а не перед ним. По-польски KAMERA WIDEO, ROZMOWA WIDEO, NAGRANIE WIDEO, и порядок обратный русскому, где «видео-» прирастает к слову спереди: «видеокамера», «видеозвонок», «видеозапись». Поэтому WIDEO KAMERA — ошибка, и притом естественная для русскоговорящего. Как существительное WIDEO тоже не склоняется и означает и запись, и устройство: OGLĄDAĆ WIDEO." }
  - { kind: false-friend, text: "Значение то же, что у русского «видео», и ловушки в смысле нет, зато есть две в форме. Первая — порядок слов, описанный выше. Вторая важнее для общей картины: польский обычно втягивает заимствования в склонение там, где русский оставляет их застывшими — ECHO, KASYNO, ZOMBI все склоняются. WIDEO из этого правила выпадает и ведёт себя как русское слово, то есть не склоняется. Поэтому правило «польский склоняет всё» надо помнить с оговоркой: заимствования на -EO и -IO остаются неизменными, как RADIO в части форм и STUDIO в разговорной речи." }
  - { kind: pronunciation, text: "Читается «виде́о», ударение на предпоследнем слоге из трёх, то есть на «де». Буква W даёт «в». Сочетание IE читается «е» с мягким предшествующим согласным, а конечное O — полным «о», без редукции. Русское «ви́део» ударяется на первый слог, польское на второй, и это расхождение слышно сразу. Все три гласные произносятся отчётливо, слово не стягивается." }
  - { kind: usage, text: "Частотные сочетания: KASETA WIDEO, KAMERA WIDEO, ROZMOWA WIDEO «видеозвонок», NAGRANIE WIDEO, MATERIAŁ WIDEO, WIDEO NA ŻYCZENIE «видео по запросу». В разговорной речи WIDEO как существительное значит и запись, и видеомагнитофон: NAGRAĆ NA WIDEO «записать на видео». Приставочные сложения в польском тоже встречаются, WIDEOROZMOWA и WIDEOKONFERENCJA, и они пишутся слитно — но в этих случаях WIDEO уже часть слова, а не определение после существительного." }
