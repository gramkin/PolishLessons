etymology: "Из латинского VIDEO «вижу», первого лица от VIDERE «видеть» — того же корня, что WIDZIEĆ и русское «видеть». Слово пришло в оба языка через английское VIDEO, где оно появилось как название сигнала изображения по образцу AUDIO «слышу». Так что польское WIDEO и польское WIDZIEĆ — родственники, разошедшиеся на тысячи лет и встретившиеся снова через латынь и английский, и это редкий случай, когда заимствование и своё слово в одном языке восходят к одному корню. Неизменяемость объясняется формой: конечное -EO не укладывается ни в один польский тип склонения, и язык оставил слово как есть, вместе с RADIO и STUDIO."
memory: "Не изменяется вовсе — одна форма, и это исключение из правила, по которому польский склоняет заимствования: echo, kasyno и zombi склоняются, wideo нет. Второе: стоит после существительного — kamera wideo, rozmowa wideo, тогда как русский приставляет «видео-» спереди. Wideo kamera — ошибка. Ударение на втором слоге, виде́о, против русского ви́део. От латинского video «вижу», родственного widzieć."
