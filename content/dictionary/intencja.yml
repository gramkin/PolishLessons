lemma: "intencja"
rank: 4837
pos: noun
pron: { cyr: "интэ́нцья" }
senses:
  - id: intention
    ru: "намерение, умысел"
    examples:
      - pl: "Miał dobre intencje."
        ru: "У него были добрые намерения."
        source: { kind: authored }
      - pl: "Nie znam jego prawdziwych intencji."
        ru: "Я не знаю его истинных намерений."
        source: { kind: authored }
      - pl: "Zrobiła to w najlepszej intencji."
        ru: "Она сделала это из лучших побуждений."
        source: { kind: authored }
  - id: prayer
    ru: "молитвенное намерение (W INTENCJI — за кого)"
    examples:
      - pl: "Zamówiła mszę w intencji zmarłego ojca."
        ru: "Она заказала мессу за упокой отца."
        source: { kind: authored }
      - pl: "Modlimy się w intencji chorych."
        ru: "Мы молимся за больных."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "INTENCJA — «намерение», шире, чем русская «интенция». Частое DOBRE INTENCJE — «добрые намерения». В церковном языке W INTENCJI — «за кого-то»: MSZA W INTENCJI OJCA, «месса за отца»." }
  - { kind: usage, text: "Женский род. Родительный, дательный и местный — INTENCJI. Множественное — INTENCJE, особенно DOBRE INTENCJE. Звательный и архаичное INTENCYJ не используем." }
  - { kind: government, text: "Из лучших побуждений — W NAJLEPSZEJ INTENCJI, местный. Молиться за кого — MODLIĆ SIĘ W INTENCJI и родительный. Без злого умысла — BEZ ZŁYCH INTENCJI." }
  - { kind: pronunciation, text: "Читается «интэ́нцья»: TE — твёрдое «тэ», CJA — «цья». Ударение на предпоследнем слоге." }
collocations:
  - { pl: "dobre intencje", ru: "добрые намерения" }
  - { pl: "w dobrej intencji", ru: "с добрыми намерениями" }
  - { pl: "msza w intencji", ru: "месса за кого-то" }
family:
  - { pl: "zamiar", ru: "намерение", relation: root, id: zamiar }
  - { pl: "cel", ru: "цель", relation: root, id: cel }
  - { pl: "msza", ru: "месса", relation: root }
etymology: "Из латинского INTENTIO «стремление», от INTENDERE «направлять». Русское «интенция» — книжное слово того же корня."
memory: "Intencja — намерение. Dobre intencje — добрые намерения. Msza w intencji ojca — месса за отца. Читается «интэ́нцья»."
idioms:
  - { pl: "mieć czyste intencje", ru: "иметь честные намерения, действовать без задней мысли" }
formExamplesSkip:
