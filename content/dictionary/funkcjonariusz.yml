notes:
  - { kind: false-friend, text: "Русский «функционер» и польский FUNKCJONARIUSZ — ложные друзья, и ошибка здесь обидная. По-русски «функционер» значит партийного или аппаратного деятеля, и слово несёт оттенок пренебрежения. Польское FUNKCJONARIUSZ совершенно нейтрально и официально: это сотрудник службы, прежде всего полицейский. FUNKCJONARIUSZ POLICJI есть обычное обозначение полицейского в протоколе и в новостях, а FUNKCJONARIUSZ PUBLICZNY — юридический термин, «должностное лицо», с особой ответственностью по уголовному кодексу. Назвать польского полицейского «функционером» по-русски значит его оскорбить, а перевести русского «функционера» словом FUNKCJONARIUSZ значит снять оценку, которая в слове была." }
  - { kind: usage, text: "Слово канцелярское и газетное, в живой речи о полицейском скажут POLICJANT. FUNKCJONARIUSZ появляется там, где нужна точность: в протоколе, в законе, в сообщении для прессы, и покрывает сотрудников нескольких служб сразу — полиции, пограничной охраны, тюремной службы, таможни. Родительный множественного только FUNKCJONARIUSZY, формы на -ÓW у этого слова нет. Женская форма FUNKCJONARIUSZKA существует и употребляется, хотя в документах чаще пишут FUNKCJONARIUSZ без изменения." }
  - { kind: pronunciation, text: "Читается «функцёна́рюш», ударение на предпоследнем слоге, то есть на -NA-. Слово длинное, пять слогов: FUNK-CJO-NA-RIUSZ — четыре, если считать строго, потому что CJO даёт один слог «цё», а RIUSZ — один «рюш». Сочетание SZ на конце звучит «ш». Проговорить стоит по частям, потому что длина и стечение согласных делают слово трудным даже для поляков, которые в быту предпочитают короткое POLICJANT." }
  - { kind: government, text: "Существительное мужского рода одушевлённое, мужско-личного разряда. Винительный единственного равен родительному: WIDZIAŁ FUNKCJONARIUSZA. Именительный множественного на -E: FUNKCJONARIUSZE. Какой службы — родительный без предлога: FUNKCJONARIUSZ POLICJI, FUNKCJONARIUSZ STRAŻY GRANICZNEJ. Юридический термин согласуется как прилагательное с существительным: FUNKCJONARIUSZ PUBLICZNY, FUNKCJONARIUSZE PUBLICZNI. При отрицании винительный остаётся родительным: NIE WIDZIAŁ FUNKCJONARIUSZA." }
