etymology: "От FUNKCJA «функция, должность», из латинского FUNCTIO, от FUNGI «исполнять, отправлять службу». То есть FUNKCJONARIUSZ есть буквально «исполняющий должность», и официальный тон слова идёт прямо из этого значения. Суффикс -ARIUSZ сохраняет латинское -ARIUS целиком, и в этом он отличается от -ARZ, в которое то же латинское окончание ужалось в более старых заимствованиях: SECRETARIUS дало SEKRETARZ, а FUNCTIONARIUS дало FUNKCJONARIUSZ. По этой разнице можно примерно судить о возрасте слова: чем короче суффикс, тем раньше слово вошло в язык. Того же ряда MISJONARZ, KOMISARZ и BIBLIOTEKARZ с коротким суффиксом, а ANTYKWARIUSZ с полным: обе дороги в языке живы."
memory: "Не «функционер»! По-русски функционер — партийный деятель, с оттенком пренебрежения; польское funkcjonariusz нейтрально и официально, прежде всего о полицейском: funkcjonariusz policji. В живой речи скажут policjant. Суффикс -ariusz сохранил латинское -arius целиком, в отличие от -arz в sekretarz: чем короче суффикс, тем старше слово."
idioms:
