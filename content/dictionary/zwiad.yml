pos: noun
pron: { cyr: "звят" }
senses:
  - id: reconnaissance
    ru: "разведка (войсковая)"
    examples:
      - pl: "Wysłano zwiad za rzekę."
        ru: "Разведку выслали за реку."
        source: { kind: authored }
      - pl: "Zwiad wrócił nad ranem."
        ru: "Разведка вернулась под утро."
        source: { kind: authored }
      - pl: "Poszli na zwiad."
        ru: "Они пошли в разведку."
        source: { kind: authored }
  - id: scouting
    ru: "разведывательная вылазка"
    examples:
      - pl: "Zwiad nie wykrył nieprzyjaciela."
        ru: "Разведка не обнаружила противника."
        source: { kind: authored }
      - pl: "Dowódca zarządził zwiad."
        ru: "Командир распорядился провести разведку."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Это военная разведка как вылазка или подразделение. Разведка как служба — wywiad, и путать их легко: wywiad значит ещё и «интервью»." }
  - { kind: government, text: "Мужской неодушевлённый; родительный — zwiadu. Пойти в разведку — iść na zwiad, винительный после na." }
  - { kind: false-friend, text: "От zwiadować «разведать», корень wiedzieć «знать». Русское «разведка» от «ведать» — ровно тот же корень и тот же ход мысли." }
  - { kind: usage, text: "Разведчик — zwiadowca. В корпусе слово не встречается, поэтому все примеры составлены вручную." }
collocations:
  - { pl: "iść na zwiad", ru: "идти в разведку" }
  - { pl: "zwiad lotniczy", ru: "воздушная разведка" }
etymology: "От zwiadować «разведать», корень wiedzieć «знать»; русское «разведка» — от «ведать», тот же ход."
memory: "zwiad — войсковая «разведка» как вылазка. Разведка-служба — wywiad, а оно же значит «интервью». Разведчик — zwiadowca."
