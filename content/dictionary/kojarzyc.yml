# review
id: kojarzyc
format: 2
lemma: "kojarzyć"
rank: 4762
pos: verb
aspect: imperf
aspectPair: skojarzyc
pron: { cyr: "коя́жыць" }
senses:
  - id: associate
    ru: "ассоциировать, связывать (что-то с чем-то); kojarzyć się — ассоциироваться, напоминать"
    examples:
      - pl: "Kolor czarny często kojarzymy ze śmiercią."
        ru: "Мы часто ассоциируем черный цвет со смертью."
        source: { kind: tatoeba, id: 365141 }
      - pl: "Z czym ci się kojarzy ta piosenka?"
        ru: "С чем у тебя ассоциируется эта песня?"
        source: { kind: tatoeba, id: 7868629 }
      - pl: "Egipt kojarzymy z Nilem."
        ru: "Египет у нас ассоциируется с Нилом."
        source: { kind: translated, id: 722180 }
  - id: recognize
    ru: "знать, помнить, узнавать (кто это, что это) — разг."
    examples:
      - pl: "Tom mnie nie kojarzy."
        ru: "Том меня не помнит."
        source: { kind: translated, id: 2403168 }
      - pl: "Wprawdzie znam ją z imienia, ale nie kojarzę jej twarzy."
        ru: "Я, правда, знаю её по имени, но лица не помню."
        source: { kind: translated, id: 2652705 }
      - pl: "Kojarzysz tę knajpę przy rynku?"
        ru: "Ты знаешь эту забегаловку у рынка?"
        source: { kind: authored }
  - id: match
    ru: "сводить, соединять (пары; животных для разведения)"
    examples:
      - pl: "Hodowca kojarzy psy z najlepszych linii."
        ru: "Заводчик сводит собак лучших линий."
        source: { kind: authored }
      - pl: "Dawniej swatki kojarzyły małżeństwa."
        ru: "Раньше свахи устраивали браки."
        source: { kind: authored }
notes:
  - { kind: government, text: "Что с чем — винительный + Z + творительный: KOJARZYĆ EGIPT Z NILEM. С SIĘ меняется конструкция: что — подлежащее, кому — дательный: TA PIOSENKA KOJARZY MI SIĘ Z WAKACJAMI «эта песня у меня ассоциируется с каникулами»." }
  - { kind: usage, text: "Несовершенный вид; совершенный — SKOJARZYĆ. В разговоре KOJARZYĆ значит просто «знать, помнить, узнавать»: KOJARZYSZ GO? «ты его знаешь?», NIE KOJARZĘ «не помню, не знаю такого». Ещё одно разговорное значение — «соображать»: SŁABO DZIŚ KOJARZĘ «плохо сегодня соображаю»." }
  - { kind: false-friend, text: "Русского родственника у KOJARZYĆ нет, и учащиеся часто пропускают разговорное значение: NIE KOJARZĘ — не «не ассоциирую», а «не знаю, не помню такого». Существительное SKOJARZENIE «ассоциация» и прилагательное ROZKOJARZONY «рассеянный» — того же корня." }
  - { kind: pronunciation, text: "Читается «коя́жыць»: J — «й», RZ — «ж», Y — «ы». Ударение на предпоследнем слоге: KOJARZĘ — «коя́жэ», KOJARZYMY — «кояжы́мы»." }
collocations:
  - { pl: "kojarzyć się z czymś", ru: "ассоциироваться с чем-то" }
  - { pl: "kojarzyć fakty", ru: "сопоставлять факты, соображать" }
  - { pl: "kojarzyć kogoś z widzenia", ru: "знать кого-то в лицо" }
  - { pl: "kojarzyć pary", ru: "сводить пары" }
family:
  - { pl: "skojarzyć", ru: "связать, ассоциировать", relation: aspect, id: skojarzyc }
  - { pl: "skojarzenie", ru: "ассоциация", relation: derived }
  - { pl: "rozkojarzony", ru: "рассеянный", relation: derived }
  - { pl: "kojarzenie", ru: "ассоциирование; сведение пар", relation: derived }
etymology: "Слово неясного происхождения, известное только в польском и кашубском; возможно, связано с KOIĆ «успокаивать». В польском засвидетельствовано с XVII века, но до XIX века было редким."
memory: "Kojarzysz? — «знаешь, помнишь?». В голове «кояжится» связь: piosenka kojarzy mi się z latem."
idioms:
  - { pl: "kojarzyć fakty", ru: "сложить два и два, соображать" }
  - { pl: "kojarzyć kogoś z widzenia", ru: "знать кого-то в лицо" }
