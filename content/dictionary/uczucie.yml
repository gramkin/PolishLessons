# review
id: uczucie
format: 2
lemma: "uczucie"
rank: 735
pos: noun
pron: { cyr: "учу́це" }
senses:
  - id: feeling
    ru: "чувство"
    examples:
      - pl: "Znam to uczucie."
        ru: "Знакомое чувство."
        source: { kind: translated, id: 7783268 }
      - pl: "To tylko uczucie."
        ru: "Это всего лишь чувство."
        source: { kind: translated, id: 3869219 }
      - pl: "Jakie to uczucie?"
        ru: "Какое это чувство?"
        source: { kind: translated, id: 5336640 }
  - id: hurt
    ru: "zranić czyjeś uczucia — задеть чьи-л. чувства"
    examples:
      - pl: "Zraniłeś uczucia Toma."
        ru: "Ты задел чувства Тома."
        source: { kind: translated, id: 3051475 }
      - pl: "Zraniłem Twoje uczucia?"
        ru: "Я задел твои чувства?"
        source: { kind: translated, id: 525904 }
      - pl: "On też ma uczucia."
        ru: "У него тоже есть чувства."
        source: { kind: translated, id: 1603734 }
  - id: express
    ru: "wyrażać uczucia — выражать чувства"
    examples:
      - pl: "Zupełnie nie potrafię wyrażać swoich uczuć."
        ru: "Я совсем не умею выражать свои чувства."
        source: { kind: tatoeba, id: 10747415 }
      - pl: "Nie okazuj uczuć."
        ru: "Не показывай чувств."
        source: { kind: translated, id: 927215 }
      - pl: "Nie sposób opisać mych uczuć."
        ru: "Моих чувств не описать."
        source: { kind: translated, id: 361301 }
  - id: reckon
    ru: "liczyć się z uczuciami — считаться с чувствами (творительный)"
    examples:
      - pl: "Czemu bawisz się moimi uczuciami?"
        ru: "Зачем ты играешь моими чувствами?"
        source: { kind: translated, id: 5492334 }
      - pl: "On mówi co myśli, nie licząc się z uczuciami innych."
        ru: "Он говорит что думает, не считаясь с чувствами других."
        source: { kind: translated, id: 725371 }
      - pl: "On zupełnie nie przejmuje się uczuciami innych ludzi."
        ru: "Он совершенно не считается с чувствами других людей."
        source: { kind: translated, id: 502957 }
notes:
  - { kind: usage, text: "Слово собрано как русское: u- + czuć «чувствовать» даёт uczucie «чувство», точно как «чувствовать» даёт «чувство»." }
  - { kind: false-friend, text: "Не путайте с czucie без приставки: это «ощущение, осязание». Nie mam czucia w palcach значит «Я не чувствую пальцев», а не «у меня нет чувств»." }
  - { kind: government, text: "zranić uczucia — винительный падеж; liczyć się z uczuciami — творительный; myśleć o uczuciach — предложный." }
  - { kind: usage, text: "У слова есть и значение «влюблённость»: Ma do niej uczucie «У него к ней чувство». Ещё ходовое — mieszane uczucia «смешанные чувства»." }
collocations:
  - { pl: "zranić uczucia", ru: "задеть чувства" }
  - { pl: "wyrażać uczucia", ru: "выражать чувства" }
  - { pl: "mieszane uczucia", ru: "смешанные чувства" }
  - { pl: "liczyć się z uczuciami", ru: "считаться с чувствами" }
family:
  - { pl: "czuć", ru: "чувствовать", relation: root }
  - { pl: "czucie", ru: "ощущение, осязание", relation: derived }
  - { pl: "uczuciowy", ru: "эмоциональный", relation: derived }
etymology: "От czuć «чувствовать» с приставкой u- — та же сборка, что русское «чувство» от «чувствовать»."
memory: "uczucie — «чувство», и собрано оно ровно как русское слово: от czuć «чувствовать». Рядом держите czucie без приставки — это «ощущение, осязание», и Nie mam czucia w palcach значит «Пальцы не чувствую». Два оборота стоит взять целиком: zranić czyjeś uczucia «задеть чьи-то чувства» и liczyć się z uczuciami «считаться с чувствами»."
idioms:
  - { pl: "zranić czyjeś uczucia", ru: "задеть чьи-либо чувства" }
  - { pl: "mieszane uczucia", ru: "смешанные чувства" }
  - { pl: "liczyć się z uczuciami", ru: "считаться с чувствами" }
