notes:
  - { kind: false-friend, text: "РЕДКИЙ СЛУЧАЙ ПОЛНОГО СОВПАДЕНИЯ СЛОВООБРАЗОВАНИЯ. Zakładnik сделан из zakład «залог, заклад» плюс -nik, а русское «заложник» — из «залог» плюс «-ник». Один корень, один суффикс, один образ: человек, оставленный в залог. Переносное значение тоже общее: zakładnik sytuacji «заложник положения»." }
  - { kind: pronunciation, text: "МУЖСКО-ЛИЧНОЕ МНОЖЕСТВЕННОЕ МЕНЯЕТ K НА C: ZAKŁADNICY. Так ведут себя все основы на -k, обозначающие людей: Polak — Polacy, rybak — rybacy, robotnik — robotnicy. В этом батче рядом стоит ekspert — eksperci, где смягчается t; два разных согласных, одно и то же правило. Ł читается как у: «закуа́дник»." }
  - { kind: usage, text: "Винительный падеж как у всех мужско-личных совпадает с родительным: uwolnili zakładnika, uwolnili zakładników. Звательный и предложный — zakładniku. Глагол: wziąć kogoś jako zakładnika «взять кого-л. в заложники», uwolnić zakładników «освободить заложников»." }
collocations:
  - { pl: "wziąć zakładnika", ru: "взять заложника" }
  - { pl: "uwolnić zakładników", ru: "освободить заложников" }
  - { pl: "zakładnik sytuacji", ru: "заложник положения" }
family:
  - { pl: "zakład", ru: "залог; предприятие; пари", relation: root, id: zaklad }
  - { pl: "założyć", ru: "заложить, основать", relation: derived, id: zalozyc }
  - { pl: "porywacz", ru: "похититель", relation: antonym }
etymology: "От zakład «залог, заклад», от założyć «заложить» — приставка za- плюс łożyć, корень тот же, что в русских «ложить», «залог», «заложник». Суффикс -nik называет лицо, как в robotnik и pracownik. Русское слово построено ровно так же, поэтому разбирается без словаря."
memory: "zakładnik — «заложник», и собрано слово точно как русское: zakład «залог» плюс -nik. Запомнить надо множественное: zakładnicy, с k переходящим в c, как Polak — Polacy."
idioms:
  - { pl: "wziąć kogoś jako zakładnika", ru: "взять кого-л. в заложники" }
  - { pl: "zakładnik własnych obietnic", ru: "заложник собственных обещаний" }
