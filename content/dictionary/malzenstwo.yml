# review
id: malzenstwo
format: 2
lemma: "małżeństwo"
rank: 820
pos: noun
pron: { cyr: "мауже́ньстфо" }
senses:
  - id: marriage
    ru: "брак, супружество (институт)"
    examples:
      - pl: "Małżeństwo to związek mężczyzny i kobiety."
        ru: "Брак — это союз мужчины и женщины."
        source: { kind: tatoeba, id: 608304 }
      - pl: "Udało mi się uzyskać zgodę rodziców na małżeństwo."
        ru: "Мне удалось получить согласие родителей на брак."
        source: { kind: tatoeba, id: 348715 }
      - pl: "Małżeństwo zmienia ludzi."
        ru: "Брак меняет людей."
        source: { kind: translated, id: 3759635 }
  - id: couple
    ru: "małżeństwo — супружеская пара"
    note: "Значения «пара» у русского «брака» нет."
    examples:
      - pl: "Jesteśmy małżeństwem."
        ru: "Мы супруги."
        source: { kind: translated, id: 393495 }
      - pl: "Jesteśmy już małżeństwem."
        ru: "Мы уже супруги."
        source: { kind: translated, id: 3038375 }
      - pl: "Nazywasz to małżeństwem?"
        ru: "Ты называешь это браком?"
        source: { kind: translated, id: 6683321 }
  - id: about
    ru: "o małżeństwie — о браке"
    examples:
      - pl: "Spotykamy się, ale myślimy o małżeństwie."
        ru: "Мы встречаемся, но думаем о браке."
        source: { kind: translated, id: 768818 }
      - pl: "Trwali w małżeństwie z myślą o dzieciach."
        ru: "Они держались в браке ради детей."
        source: { kind: translated, id: 842090 }
      - pl: "Jutro dalej porozmawiamy o twoim małżeństwie."
        ru: "Завтра продолжим разговор о твоём браке."
        source: { kind: translated, id: 11242053 }
  - id: against
    ru: "przeciwko małżeństwu — против брака (дательный)"
    examples:
      - pl: "Ojciec sprzeciwiał się naszemu małżeństwu."
        ru: "Отец был против нашего брака."
        source: { kind: translated, id: 858540 }
      - pl: "Moi rodzice byli przeciwni naszemu małżeństwu."
        ru: "Мои родители были против нашего брака."
        source: { kind: translated, id: 3584681 }
      - pl: "Tom jest przeciwko małżeństwom jednopłciowym."
        ru: "Том против однополых браков."
        source: { kind: translated, id: 10623275 }
notes:
  - { kind: false-friend, text: "Расхождение с русским идёт в обе стороны. Польское małżeństwo значит и «брак» как институт, и «супружескую пару»: Jesteśmy małżeństwem — это «Мы супруги», а не «мы брак». А русское «брак» имеет второе значение «изъян», которого у małżeństwo нет вовсе: изъян по-польски wada, а нехватка — brak." }
  - { kind: usage, text: "Супруги по отдельности — małżonek «супруг» и małżonka «супруга», вместе — małżonkowie. Слово идёт от małżonek, а то из старочешского." }
  - { kind: government, text: "zgoda na małżeństwo «согласие на брак» — винительный; być przeciwko małżeństwu — дательный; w małżeństwie «в браке» — предложный." }
  - { kind: usage, text: "Ходовые: zawrzeć małżeństwo «заключить брак», małżeństwo z rozsądku «брак по расчёту», rocznica małżeństwa «годовщина брака»." }
collocations:
  - { pl: "zawrzeć małżeństwo", ru: "заключить брак" }
  - { pl: "jesteśmy małżeństwem", ru: "мы супруги" }
  - { pl: "w małżeństwie", ru: "в браке" }
  - { pl: "zgoda na małżeństwo", ru: "согласие на брак" }
family:
  - { pl: "małżonek", ru: "супруг", relation: root }
  - { pl: "małżonka", ru: "супруга", relation: root }
  - { pl: "ślub", ru: "свадьба, венчание", relation: root }
  - { pl: "wesele", ru: "свадьба (праздник)", relation: root }
etymology: "От małżonek «супруг», а то из старочешского; в основе германское mahal «уговор, соглашение» плюс kona «женщина»."
memory: "małżeństwo расходится с русским «браком» в обе стороны. Во-первых, оно значит не только сам брак, но и супружескую пару: Jesteśmy małżeństwem — «Мы супруги». Во-вторых, у русского «брака» есть значение «изъян», которого здесь нет вовсе: изъян — это wada, а нехватка — brak. Супруги по отдельности — małżonek и małżonka."
idioms:
  - { pl: "zawrzeć małżeństwo", ru: "заключить брак" }
  - { pl: "jesteśmy małżeństwem", ru: "мы супруги" }
  - { pl: "małżeństwo z rozsądku", ru: "брак по расчёту" }
