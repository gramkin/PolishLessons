notes:
  - { kind: usage, text: "СУФФИКС -STWO ОТВЕЧАЕТ РУССКОМУ -СТВО, и это одно из самых надёжных соответствий в языке. Król «король» плюс -stwo даёт królestwo «королевство», ровно как «король» плюс «-ство». По той же мерке читаются państwo «государство», bogactwo «богатство», towarzystwo «общество», małżeństwo «брак» и сотни других. Все они среднего рода, как и русские." }
  - { kind: pronunciation, text: "Четыре слога, ударение на предпоследнем: kró-LES-two. Ó читается как у, а конечное -wo после глухого s звучит приглушённо: «крулэ́стфо». В предложном падеже w смягчается: w królestwie — «в крулэ́стфе»." }
  - { kind: false-friend, text: "Ложной дружбы тут нет: слово значит ровно то, что кажется. Полезно другое — переносное значение живо и частотно: królestwo zwierząt «царство животных», kuchnia to jej królestwo «кухня — её царство». Русское «царство» в этих оборотах ложится слово в слово." }
collocations:
  - { pl: "Zjednoczone Królestwo", ru: "Соединённое Королевство" }
  - { pl: "królestwo zwierząt", ru: "царство животных" }
  - { pl: "królestwo niebieskie", ru: "царство небесное" }
family:
  - { pl: "król", ru: "король", relation: root, id: krol }
  - { pl: "królowa", ru: "королева", relation: derived, id: krolowa }
  - { pl: "królewski", ru: "королевский", relation: derived, id: krolewski }
etymology: "От król «король» с суффиксом -stwo. А сам król — от имени Карла Великого, которое у славян стало нарицательным названием верховного правителя; тем же путём пришло и русское «король». Суффикс -stwo тот же, что русское -ство. Отсюда królowa, królewski, królewicz."
memory: "królestwo — «королевство», разбирается на части без остатка: król «король» плюс -stwo, равное русскому -ство. Запомнив это равенство, читаешь заодно państwo, bogactwo, towarzystwo. И переносно тоже работает: kuchnia to jej królestwo."
idioms:
