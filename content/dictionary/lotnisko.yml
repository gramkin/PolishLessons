        ru: "Меня задержали в аэропорту."
        source: { kind: tatoeba, id: 5376724 }
  - id: airfield
    ru: "аэродром"
    examples:
      - pl: "A jakie macie lotnisko zapasowe?"
        ru: "А запасной аэродром у вас какой?"
        source: { kind: tatoeba, id: 1736674 }
      - pl: "Czy jest autobus między hotelem a lotniskiem?"
        ru: "Есть ли автобус между гостиницей и аэропортом?"
        source: { kind: translated, id: 670321 }
notes:
  - { kind: government, text: "Предлог na, а не w: na lotnisku «в аэропорту», jadę na lotnisko «еду в аэропорт». Русский здесь говорит «в», польский — «на»." }
  - { kind: usage, text: "Средний род: lotnisko, lotniska, na lotnisku." }
  - { kind: usage, text: "Слово покрывает и «аэропорт», и «аэродром»: lotnisko wojskowe «военный аэродром»." }
  - { kind: usage, text: "Собрано из своих частей: от latać «летать» плюс суффикс места -isko, как в boisko «спортивная площадка»." }
collocations:
  - { pl: "na lotnisku", ru: "в аэропорту" }
  - { pl: "jechać na lotnisko", ru: "ехать в аэропорт" }
  - { pl: "lotnisko wojskowe", ru: "военный аэродром" }
etymology: "От latać «летать» и суффикса -isko, обозначающего место, как в boisko «площадка». Русское «аэропорт» собрано из греческих частей, так что опоры на родство здесь нет."
memory: "lotnisko — «аэропорт», и собрано из своих частей: latać «летать» плюс -isko «место». Главное — предлог: na lotnisku «в аэропорту», по-русски «в», по-польски «на»."
idioms:
  - { pl: "na lotnisku", ru: "в аэропорту" }
  - { pl: "jechać na lotnisko", ru: "ехать в аэропорт" }
  - { pl: "lotnisko wojskowe", ru: "военный аэродром" }
