    examples:
      - pl: "Jak daleko jest do lotniska?"
        ru: "Как далеко до аэропорта?"
        source: { kind: tatoeba, id: 349029 }
      - pl: "Gdzie jest lotnisko?"
        ru: "Где аэропорт?"
        source: { kind: translated, id: 3691543 }
