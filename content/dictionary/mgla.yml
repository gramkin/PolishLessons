etymology: "Праславянское слово, давшее и русскую «мглу»: это точные родственники, только у нас слово ушло в книжную речь и помрачнело, а у поляков осталось обычным названием тумана. Корень значил «мерцать, мигать», и от него же идёт русское «мгновение»: туман и миг оказались родней через образ чего-то мелькающего и неясного. А наш «туман» слово турецкое и польскому вовсе неизвестное."
memory: "Туман, а не «мгла»: слово то же, что русская «мгла», но у поляков оно повседневное, из прогноза погоды, а у нас книжное и мрачное. Читается «мгуа», один слог, где l со штрихом даёт «у» и никакого «л» не остаётся. Запомните два оборота: we mgle «в тумане», именно с we, и jak we mgle «как в тумане». Родительный множественного — mgiel, с беглым e."
idioms:
  - { pl: "jak we mgle", ru: "как в тумане" }
