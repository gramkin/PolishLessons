notes:
  - { kind: false-friend, text: "Русское соответствие есть, и это точный родственник — «мгла». Но смыслы разошлись по силе. Польское MGŁA это обычный, повседневный туман, тот самый, что по-русски «туман»: о нём говорят в прогнозе погоды. А наша «мгла» слово книжное и мрачноватое, про сумрак и темноту. Так что MGŁA переводится «туманом», а не «мглой». Нашего «тумана» в польском нет вовсе: слово это у нас турецкое." }
  - { kind: usage, text: "Десять форм, женский род. Запомните родительный множественного: MGIEŁ, с беглым E, которое появляется между G и Ł, чтобы слово можно было выговорить. Так же устроены и другие слова на -ŁA. В местном падеже MGLE, и перед ним ставится предлог WE, а не W: WE MGLE. Звательный MGŁO встречается только в стихах." }
  - { kind: government, text: "Вот самое полезное: в тумане — WE MGLE, с предлогом WE. Перед скоплением согласных поляк вставляет гласную, поэтому не W MGLE, а WE MGLE, как и WE WROCŁAWIU, WE WTOREK. Из-за тумана — PRZEZ MGŁĘ, предлог PRZEZ с винительным, где русский скажет «из-за», с родительным. Над туманом — NAD MGŁĄ, творительный." }
  - { kind: pronunciation, text: "Читается «мгуа», один слог, и поэтому знак ударения не нужен. Буква Ł даёт «у», от неё не остаётся никакого «л», и всё слово это три звука подряд без гласной в привычном месте: «м-г-уа». Для русского уха это самое непривычное в слове. В местном падеже WE MGLE звучит «вэ мгле», где L перед E даёт «ле»." }
  - { kind: register, text: "Слово нейтральное и обиходное, прежде всего из прогноза погоды: GĘSTA MGŁA «густой туман», MGŁA PORANNA «утренний туман». В переносном смысле живёт оборот JAK WE MGLE — «как в тумане», о смутном воспоминании или о спутанном сознании, и употребляется он ровно как у нас. Прилагательное MGLISTY значит и «туманный», и «смутный»." }
collocations:
  - { pl: "gęsta mgła", ru: "густой туман" }
  - { pl: "we mgle", ru: "в тумане" }
  - { pl: "mgła poranna", ru: "утренний туман" }
family:
