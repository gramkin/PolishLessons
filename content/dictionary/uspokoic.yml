# review
id: uspokoic
format: 2
lemma: "uspokoić"
rank: 713
pos: verb
aspect: perf
pron: { cyr: "успоко́иць" }
senses:
  - id: calm-self
    ru: "uspokoić się — успокоиться"
    examples:
      - pl: "Uspokoił się."
        ru: "Он успокоился."
        source: { kind: tatoeba, id: 8675074 }
      - pl: "Tom uspokoił się."
        ru: "Том успокоился."
        source: { kind: translated, id: 5636928 }
      - pl: "Musisz się uspokoić."
        ru: "Тебе надо успокоиться."
        source: { kind: translated, id: 3740688 }
  - id: calm-other
    ru: "uspokoić kogoś — успокоить кого-л."
    note: "Без się глагол переходный."
    examples:
      - pl: "Próbuję ją uspokoić."
        ru: "Я пытаюсь успокоить её."
        source: { kind: tatoeba, id: 5909108 }
      - pl: "Uspokoił płaczące dziecko."
        ru: "Он успокоил плачущего ребёнка."
        source: { kind: authored }
      - pl: "Nikt nie umiał jej uspokoić."
        ru: "Никто не сумел её успокоить."
        source: { kind: authored }
  - id: imperative
    ru: "Uspokój się! — Успокойся!"
    note: "В приказе появляется ó."
    examples:
      - pl: "Uspokój się."
        ru: "Успокойся."
        source: { kind: tatoeba, id: 547699 }
      - pl: "Usiądź i się uspokój."
        ru: "Сядь и успокойся."
        source: { kind: tatoeba, id: 13786185 }
      - pl: "Uspokójcie się."
        ru: "Успокойтесь."
        source: { kind: translated, id: 8500439 }
  - id: settle
    ru: "о море, буре, обстановке — утихнуть, улечься"
    examples:
      - pl: "Po burzy morze uspokoiło się."
        ru: "После бури море успокоилось."
        source: { kind: translated, id: 440533 }
      - pl: "Po chwili dzieci się uspokoiły."
        ru: "Через минуту дети успокоились."
        source: { kind: translated, id: 364887 }
      - pl: "Sytuacja szybko się uspokoiła."
        ru: "Ситуация быстро успокоилась."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Два режима, и разницу делает się, ровно как русское -ся: uspokoić kogoś «успокоить кого-то» и uspokoić się «успокоиться»." }
  - { kind: usage, text: "В повелительном наклонении появляется ó, которого нет в инфинитиве: uspokoić, но Uspokój się!, Uspokójcie się!, Uspokójmy się. Это самая частая форма слова." }
  - { kind: usage, text: "Несовершенный вид — uspokajać, с чередованием oi/aja: uspokajam się «я успокаиваюсь», uspokajać kogoś «успокаивать кого-то»." }
  - { kind: usage, text: "В корне сидит spokój «покой»: spokojny «спокойный», niespokojny «беспокойный», Spokojnie! «Спокойно!»." }
collocations:
  - { pl: "uspokoić się", ru: "успокоиться" }
  - { pl: "uspokoić kogoś", ru: "успокоить кого-либо" }
  - { pl: "Uspokój się!", ru: "Успокойся!" }
  - { pl: "uspokoić nerwy", ru: "успокоить нервы" }
family:
  - { pl: "spokój", ru: "покой", relation: root }
  - { pl: "spokojny", ru: "спокойный", relation: derived }
  - { pl: "uspokajać", ru: "успокаивать", relation: aspect }
  - { pl: "niespokojny", ru: "беспокойный", relation: derived }
etymology: "Приставка u- плюс spokój «покой» — тот же корень, что русские «покой», «спокойный» и «успокоить»."
memory: "В корне сидит spokój «покой», так что uspokoić — буквально «упокоить», то есть «успокоить». Разницу делает się, ровно как русское -ся: uspokoić kogoś «успокоить кого-то», uspokoić się «успокоиться». Чаще всего слово попадается в приказе, и там появляется ó, которого нет в инфинитиве: Uspokój się! Несовершенный вид — uspokajać."
idioms:
  - { pl: "Uspokój się!", ru: "Успокойся!" }
  - { pl: "uspokoić nerwy", ru: "успокоить нервы" }
  - { pl: "morze się uspokoiło", ru: "море утихло" }
