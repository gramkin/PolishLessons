# review
id: kontakt
format: 2
lemma: "kontakt"
rank: 792
pos: noun
pron: { cyr: "ко́нтакт" }
senses:
  - id: contact
    ru: "контакт, связь"
    examples:
      - pl: "On utrzymuje z nią kontakt."
        ru: "Он поддерживает с ней связь."
        source: { kind: tatoeba, id: 3605063 }
      - pl: "Mam z nim kontakt osobisty."
        ru: "У меня с ним личный контакт."
        source: { kind: translated, id: 919897 }
      - pl: "Kontakt z Tomem."
        ru: "Контакт с Томом."
        source: { kind: translated, id: 5636915 }
  - id: keep-in-touch
    ru: "być w kontakcie — быть на связи"
    examples:
      - pl: "Bądź w kontakcie."
        ru: "Будь на связи."
        source: { kind: translated, id: 3495349 }
      - pl: "Będziemy w kontakcie."
        ru: "Будем на связи."
        source: { kind: translated, id: 704010 }
      - pl: "Pozostańmy w kontakcie."
        ru: "Давайте оставаться на связи."
        source: { kind: translated, id: 1046555 }
  - id: socket
    ru: "kontakt — розетка (значения нет у русского «контакта»)"
    note: "Совершенно конкретное, бытовое значение."
    examples:
      - pl: "Wyciągnij widelec z kontaktu."
        ru: "Вытащи вилку из розетки."
        source: { kind: translated, id: 7754588 }
      - pl: "Kontakt jest za szafą."
        ru: "Розетка за шкафом."
        source: { kind: authored }
      - pl: "W tym pokoju nie ma kontaktu."
        ru: "В этой комнате нет розетки."
        source: { kind: authored }
  - id: contacts
    ru: "kontakty — контакты (в телефоне)"
    examples:
      - pl: "Wiesz jak dodać nowe kontakty do tego telefonu?"
        ru: "Ты знаешь, как в этот телефон добавить новые контакты?"
        source: { kind: tatoeba, id: 2143140 }
      - pl: "Dziękuję za dodanie mnie do swoich kontaktów."
        ru: "Спасибо, что добавил меня в свои контакты."
        source: { kind: translated, id: 2218707 }
      - pl: "Czy mógłbyś mnie dodać do swojej listy kontaktów?"
        ru: "Ты мог бы добавить меня в свой список контактов?"
        source: { kind: translated, id: 2221286 }
notes:
  - { kind: false-friend, text: "Главное отличие от русского: kontakt в быту значит «розетка». Wyciągnij widelec z kontaktu — «Вытащи вилку из розетки». У русского «контакта» такого значения нет." }
  - { kind: government, text: "być w kontakcie «быть на связи» — предложный падеж; stracić kontakt z kimś «потерять связь с кем-то» — творительный после z." }
  - { kind: usage, text: "В телефоне kontakty — это «контакты», как и по-русски: dodać do kontaktów «добавить в контакты»." }
  - { kind: usage, text: "Родня: kontaktować się «связываться», bezkontaktowy «бесконтактный». Слово пришло через немецкое Kontakt из латыни." }
collocations:
  - { pl: "być w kontakcie", ru: "быть на связи" }
  - { pl: "stracić kontakt", ru: "потерять связь" }
  - { pl: "wyciągnąć z kontaktu", ru: "вытащить из розетки" }
  - { pl: "dodać do kontaktów", ru: "добавить в контакты" }
family:
  - { pl: "kontaktować się", ru: "связываться", relation: derived }
  - { pl: "łączność", ru: "связь", relation: root }
  - { pl: "gniazdko", ru: "розетка", relation: root }
etymology: "Через немецкое Kontakt из латинского contactus «прикосновение» — то же заимствование, что русский «контакт»."
memory: "kontakt — «контакт, связь», но у слова есть значение, которого русский «контакт» не знает: в быту это «розетка». Wyciągnij widelec z kontaktu значит «Вытащи вилку из розетки». Остальное совпадает: być w kontakcie «быть на связи», dodać do kontaktów «добавить в контакты»."
idioms:
  - { pl: "być w kontakcie", ru: "быть на связи" }
  - { pl: "stracić kontakt", ru: "потерять связь" }
  - { pl: "wyciągnąć z kontaktu", ru: "вытащить из розетки" }
formExamplesSkip:
  - { form: "kontakcie", cell: "Звательный", reason: "звательный падеж: для неодушевлённого существительного он практически не употребляется" }
