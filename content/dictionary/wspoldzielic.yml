# review
id: wspoldzielic
format: 2
lemma: "współdzielić"
rank: 2595
pos: verb
pron: { cyr: "фспуудзе́лиць" }
senses:
  - id: share-resource
    ru: "совместно использовать, делить (ресурс, помещение)"
    examples:
      - pl: "Współdzielę mieszkanie z dwiema osobami."
        ru: "Я делю квартиру с двумя людьми."
        source: { kind: authored }
      - pl: "Dwóch lokatorów współdzieli jedną łazienkę."
        ru: "Двое жильцов делят одну ванную."
        source: { kind: authored }
      - pl: "To dysk współdzielony przez cały zespół."
        ru: "Это диск, которым пользуется вся команда."
        source: { kind: authored }
  - id: share-stance
    ru: "разделять (мнение, ответственность)"
    examples:
      - pl: "Nie współdzielę jego poglądów."
        ru: "Я не разделяю его взглядов."
        source: { kind: authored }
      - pl: "Współdzielisz odpowiedzialność za ten projekt."
        ru: "Ты разделяешь ответственность за этот проект."
        source: { kind: authored }
notes:
  - { kind: government, text: "współdzielić coś z kimś: предмет — в ВИНИТЕЛЬНОМ падеже, партнёр — через предлог z с ТВОРИТЕЛЬНЫМ. Współdzielę mieszkanie z bratem «я делю квартиру с братом»." }
  - { kind: government, text: "Мужсколичное причастие współdzieleni остаётся без употребления: в винительном падеже при этом глаголе стоит всегда ресурс или помещение — mieszkanie, dysk, kuchnia, odpowiedzialność, — но не человек. Людей не «используют совместно». Прочие формы причастия при этом вполне обычны: zasoby współdzielone, dysk współdzielony." }
  - { kind: usage, text: "Несовершенный вид; совершенного пары в обычном смысле нет, потому что действие длительное. Слово молодое и книжно-техническое, выросло из потребностей информатики: zasoby współdzielone «общие ресурсы», dysk współdzielony «общий диск». В бытовой речи чаще скажут dzielić mieszkanie z kimś." }
  - { kind: false-friend, text: "Корень dzielić — прямой родственник русского «делить», а приставка współ- отвечает русскому со-. Но готового русского слова «соделить» нет: współdzielić переводится описательно — «совместно использовать», «делить с кем-л.», «разделять»." }
collocations:
  - { pl: "współdzielić mieszkanie", ru: "делить квартиру" }
  - { pl: "zasoby współdzielone", ru: "общие ресурсы" }
  - { pl: "współdzielić odpowiedzialność", ru: "разделять ответственность" }
family:
  - { pl: "dzielić", ru: "делить", relation: root }
  - { pl: "podzielić", ru: "разделить", relation: derived }
  - { pl: "współdzielenie", ru: "совместное использование", relation: derived }
etymology: "Сложение префиксоида współ- «со-, вместе» и глагола dzielić, от праславянского *děliti. Русское «делить» — прямой родственник, а współ- отвечает русскому со- (как в współpraca «сотрудничество», współautor «соавтор»). Само слово współdzielić молодое: оно вошло в язык вместе с компьютерной терминологией, как калька английского to share."
memory: "współdzielić = współ- («со-») + dzielić («делить»): совместно использовать. Предмет в винительном, партнёр через z с творительным. Готового русского однословного соответствия нет — переводится «делить с кем-л.» или «совместно использовать»."
idioms:
  - { pl: "zasoby współdzielone", ru: "общие ресурсы (в информатике)" }
  - { pl: "współdzielić dach nad głową", ru: "жить под одной крышей" }
formExamplesSkip:
  - { form: "współdzieleni", reason: "Страдательное причастие мужского лица от współdzielony. В винительном падеже при współdzielić стоит всегда ресурс или помещение — mieszkanie, dysk, kuchnia, serwer, odpowiedzialność, — но никогда человек: людей не используют совместно. Повышать в мужсколичную форму нечего, поэтому она остаётся без употребления, хотя остальные формы причастия обычны (zasoby współdzielone, dysk współdzielony)." }
