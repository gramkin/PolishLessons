etymology: "В основе латинское ALTARE «жертвенник», пришедшее в польский через чешский. Русское «алтарь» — того же латинского происхождения."
memory: "Ołtarz — алтарь, читается «о́уташ». Stanąć przed ołtarzem — пойти под венец. Przy ołtarzu — у алтаря."
