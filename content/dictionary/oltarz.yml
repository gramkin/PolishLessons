notes:
  - { kind: false-friend, text: "OŁTARZ — «алтарь», но с O в начале и Ł: «о́уташ». Пойти под венец — STANĄĆ PRZED OŁTARZEM или PÓJŚĆ DO OŁTARZA. Жертвенник у язычников — тоже OŁTARZ." }
  - { kind: usage, text: "Мужской род, неодушевлённое. Родительный — OŁTARZA, местный — OŁTARZU. Родительный множественного — OŁTARZY; вариант OŁTARZÓW встречается реже." }
  - { kind: government, text: "У алтаря — PRZY OŁTARZU, местный. Перед алтарём — PRZED OŁTARZEM, творительный. Повести к алтарю — POPROWADZIĆ DO OŁTARZA, родительный." }
  - { kind: pronunciation, text: "Читается «о́уташ»: Ł — «у», RZ на конце — «ш». Ударение на первом слоге. OŁTARZA — «оута́жа»." }
collocations:
