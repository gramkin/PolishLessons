# review
id: inspiracja
format: 2
lemma: "inspiracja"
rank: 5105
pos: noun
pron: { cyr: "инспира́цья" }
senses:
  - id: inspiration
    ru: "вдохновение, источник вдохновения"
    examples:
      - pl: "Natura jest jego inspiracją."
        ru: "Природа — его вдохновение."
        source: { kind: authored }
      - pl: "Szukam inspiracji do nowej książki."
        ru: "Я ищу вдохновение для новой книги."
        source: { kind: authored }
      - pl: "Ta podróż była dla niej wielką inspiracją."
        ru: "Эта поездка стала для неё большим источником вдохновения."
        source: { kind: authored }
  - id: idea
    ru: "идея, подсказка (для дизайна, кухни)"
    examples:
      - pl: "Znajdziesz tu inspiracje do urządzenia kuchni."
        ru: "Здесь ты найдёшь идеи для обустройства кухни."
        source: { kind: authored }
      - pl: "Szukam inspiracji na obiad."
        ru: "Ищу идею для обеда."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "INSPIRACJA — «вдохновение», но и «идея, подсказка»: INSPIRACJE NA ŚWIĘTA, «идеи к праздникам». Вдохновение поэта по-польски ещё и NATCHNIENIE, книжное. Вдохновлять — INSPIROWAĆ." }
  - { kind: usage, text: "Женский род. Родительный, дательный и местный — INSPIRACJI. Множественное — INSPIRACJE, часто «идеи». Звательный и архаичное INSPIRACYJ не используем." }
  - { kind: government, text: "Искать вдохновение — SZUKAĆ INSPIRACJI, родительный. Черпать вдохновение из — CZERPAĆ INSPIRACJĘ Z и родительный. Быть вдохновением для — BYĆ INSPIRACJĄ DLA." }
  - { kind: pronunciation, text: "Читается «инспира́цья»: CJA — «цья», ударение на предпоследнем слоге." }
collocations:
  - { pl: "źródło inspiracji", ru: "источник вдохновения" }
  - { pl: "szukać inspiracji", ru: "искать вдохновение" }
  - { pl: "czerpać inspirację", ru: "черпать вдохновение" }
family:
  - { pl: "inspirować", ru: "вдохновлять", relation: derived }
  - { pl: "natchnienie", ru: "вдохновение", relation: root }
  - { pl: "pomysł", ru: "идея", relation: root, id: pomysl }
etymology: "Из латинского INSPIRATIO «вдувание», от INSPIRARE «вдыхать, вдохновлять». Русское «инспирация» — книжное слово того же корня."
memory: "Inspiracja — вдохновение и идея. Szukać inspiracji — искать вдохновение. Inspiracje na obiad — идеи для обеда. Читается «инспира́цья»."
idioms:
  - { pl: "pod wpływem inspiracji", ru: "на волне вдохновения" }
formExamplesSkip:
  - { form: "inspiracjo", reason: "звательный от отвлечённого существительного не употребляется" }
  - { form: "inspiracyj", reason: "архаичный родительный множественного, в норме INSPIRACJI" }
