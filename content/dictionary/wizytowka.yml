etymology: "От WIZYTA, взятого через французский из латинского VISITARE «навещать». Русский «визит» пришёл тем же путём, поэтому корень общий. Интересен суффикс: -ÓWKA делает из основы название вещи, и он один из самых плодовитых в польском. POCZTA даёт POCZTÓWKA «открытку», ŻAR — ŻARÓWKA «лампочку», WIZYTA — WIZYTÓWKA «визитку». Узнав этот суффикс, вы разберёте десятки слов, не заглядывая в словарь."
memory: "Визитка, от wizyta «визит». Читается «визыту́вка», где o с черточкой даёт «у». Главная ловушка в корне: wizyta это ещё и приём у врача, umowic wizyte значит «записаться на приём». Запомните суффикс -owka: он делает название предмета, отсюда pocztowka «открытка» и zarowka «лампочка». В дательном и местном k переходит в c: na wizytowce."
idioms:
  - { pl: "wizytówka miasta", ru: "визитная карточка города" }
