notes:
  - { kind: false-friend, text: "Обманывает здесь не само слово, а его корень. WIZYTA по-польски это не только визит, но и приём у врача: WIZYTA U LEKARZA значит «приём у врача», а UMÓWIĆ WIZYTĘ — «записаться на приём». По-русски так не говорят. А глагол WIZYTOWAĆ значит «инспектировать», проверять с проверкой, а не просто навещать. Само же WIZYTÓWKA совпадает с нашей «визиткой», включая переносный смысл." }
  - { kind: usage, text: "Десять форм, женский род. В дательном и местном падежах K переходит в C: WIZYTÓWKA, но NA WIZYTÓWCE. В родительном множественного появляется беглое E: WIZYTÓWEK. Обратите внимание на суффикс -ÓWKA: он делает из основы название предмета, и по этому образцу построены POCZTÓWKA «открытка», ŻARÓWKA «лампочка» и KARTKÓWKA «контрольная работа»." }
  - { kind: government, text: "На визитке — NA WIZYTÓWCE, местный падеж с переходом K в C. Вручить визитку — WRĘCZYĆ WIZYTÓWKĘ, винительный без предлога. Обменяться визитками — WYMIENIĆ SIĘ WIZYTÓWKAMI, творительный множественного после SIĘ. А записаться на приём — UMÓWIĆ WIZYTĘ, винительный, и запомните это выражение целиком, оно нужно в каждой поликлинике." }
  - { kind: pronunciation, text: "Читается «визыту́вка», четыре слога, ударение на предпоследнем. Буква Y даёт «ы», поэтому второй слог это «зы». Буква Ó даёт «у», и третий слог — «ту», а не «то». В форме WIZYTÓWCE сочетание CE даёт «це»: «визыту́вце». Буква W на конце основы перед C оглушается и звучит как «ф»: «визыту́фце»." }
  - { kind: register, text: "Слово нейтральное, из делового обихода. WRĘCZYĆ WIZYTÓWKĘ и WYMIENIĆ SIĘ WIZYTÓWKAMI — обычные выражения на любой встрече. Переносное значение живое и частое, особенно в речи о городах и о заведениях: WIZYTÓWKA MIASTA, WIZYTÓWKA FIRMY. В интернете WIZYTÓWKA значит ещё и небольшой сайт-представительство." }
collocations:
