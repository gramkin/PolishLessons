etymology: "От PAMIĘTAĆ «помнить», PAMIĘĆ «память»: дневник хранит то, что нужно помнить. Польское Ę на месте русского «я»: PAMIĘĆ — «память»."
memory: "Pamiętnik — дневник, не «памятник» (pomnik). Читается «паме́нтник». Pamiętniki — мемуары. Dziennik — школьный дневник."
idioms:
