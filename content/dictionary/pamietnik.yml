notes:
  - { kind: false-friend, text: "PAMIĘTNIK — личный «дневник», а не «памятник»! Памятник — POMNIK. Школьный дневник с оценками — DZIENNIK, сейчас обычно электронный. Во множественном PAMIĘTNIKI — «мемуары»." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Родительный на -A: PAMIĘTNIKA. Творительный — PAMIĘTNIKIEM." }
  - { kind: government, text: "Вести дневник — PROWADZIĆ PAMIĘTNIK, винительный. Писать в дневнике — PISAĆ W PAMIĘTNIKU, местный. Записать в дневник — ZAPISAĆ W PAMIĘTNIKU." }
  - { kind: pronunciation, text: "Читается «паме́нтник», ударение на предпоследнем слоге. MIĘ — «ме», как в PAMIĘĆ «па́менць», Ę перед T звучит «эн»." }
collocations:
  - { pl: "prowadzić pamiętnik", ru: "вести дневник" }
  - { pl: "pisać w pamiętniku", ru: "писать в дневнике" }
  - { pl: "pamiętniki wojenne", ru: "военные мемуары" }
family:
  - { pl: "pamięć", ru: "память", relation: root, id: pamiec }
  - { pl: "pamiętać", ru: "помнить", relation: root, id: pamietac }
