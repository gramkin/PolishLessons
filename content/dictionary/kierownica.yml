etymology: "От KIEROWAĆ «вести, управлять», взятого из средневерхненемецкого глагола со значением «поворачивать». Любопытно, что и русский на это место поставил чужое слово, только от других соседей: «руль» пришёл из голландского, из языка моряков. Два языка назвали одну вещь заимствованием, но из разных источников, и потому слова не похожи ничем. Зато польский на своём корне вырастил целое гнездо: KIEROWCA, KIEROWNIK, KIERUNEK."
memory: "Руль, от kierowac «вести, управлять». Главное — всё гнездо: kierowca это «водитель», kierownik — «руководитель, начальник», kierunek — «направление». Последнее путают чаще всего: kierownik не водитель. Читается «керовни́ца», где kie даёт «ке». За рулём — za kierownica, творительный, точно как по-русски. А «сесть за руль» — siasc za kierownice, винительный."
idioms:
