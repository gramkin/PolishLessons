notes:
  - { kind: false-friend, text: "Опасно здесь не одно слово, а всё гнездо: из одного корня польский построил пять слов, и ни одно русский не угадает. KIEROWAĆ значит «вести, управлять», KIEROWCA — «водитель», KIEROWNICA — «руль», KIERUNEK — «направление», а KIEROWNIK — «руководитель, начальник». Последнее особенно обманчиво: это не «керовник» и не водитель, а именно начальник. Русский «руль» тут вовсе ни при чём, он пришёл из голландского." }
  - { kind: usage, text: "Десять форм, женский род, основа на -CA, как у TĘTNICA и PRZECZNICA. Родительный, дательный и местный единственного числа совпадают: все три дают KIEROWNICY. В родительном множественного окончания нет: KIEROWNIC. Слово одинаково годится и для автомобильного руля, и для велосипедного." }
  - { kind: government, text: "За рулём — ZA KIEROWNICĄ, творительный падеж, и здесь польский и русский совпадают полностью, включая предлог. Сидеть за рулём — SIEDZIEĆ ZA KIEROWNICĄ. Держать руль — TRZYMAĆ KIEROWNICĘ, винительный без предлога. А «сесть за руль», с движением, — SIĄŚĆ ZA KIEROWNICĘ, уже винительный после того же ZA." }
  - { kind: pronunciation, text: "Читается «керовни́ца», четыре слога, ударение на предпоследнем. Сочетание KIE даёт «ке»: буква I здесь не читается отдельно, а только смягчает K. Буква W перед N звучит обычным «в». В форме KIEROWNICY конечное Y даёт «ы»: «керовни́цы»." }
  - { kind: register, text: "Слово нейтральное, из обиходной речи о машине и о велосипеде. ZA KIEROWNICĄ значит «за рулём» и в прямом смысле, и в разговоре о том, кто ведёт: KTO BYŁ ZA KIEROWNICĄ. В объявлениях о работе встречается PRACA ZA KIEROWNICĄ. А про велосипед говорят KIEROWNICA ROWEROWA, и регулируемые руля называют KIEROWNICE REGULOWANE." }
