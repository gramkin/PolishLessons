etymology: "От глагола ZABURZYĆ, а тот от BURZYĆ и BURZA «буря», от праславянского слова, давшего и русскую «бурю». Образ за словом стоит вещественный: нарушение — это взбаламученность, как вода в бурю. Русский посмотрел на то же понятие с противоположной стороны и построил «расстройство» от «строя», то есть от нарушенного порядка. Один язык назвал беспорядок через стихию, другой через утраченный строй. Из того же польского гнезда BURZLIWY «бурный», ROZBURZYĆ и ZBURZYĆ «снести, разрушить»."
memory: "Корень от burza «буря», и это прямая родня, но burzyć значит «разрушать», а не «бурить»: «бурить» по-польски wiercić. Отсюда и образ: zaburzenie это взбаламученность, тогда как русское «расстройство» от «строя». В медицине слово почти всегда во множественном: zaburzenia snu, zaburzenia odżywiania, как и по-русски. Читается «забуже́не», где rz это «ж», и чтение «бурзе» будет ошибкой."
