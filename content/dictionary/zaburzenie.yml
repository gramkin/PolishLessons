notes:
  - { kind: false-friend, text: "Основа этого слова подводит русский глаз дважды. BURZA значит «буря», и это прямой родственник, тут всё просто. Но BURZYĆ значит «разрушать», а не «бурить»: BURZYĆ DOM — «сносить дом». Русское «бурить» по-польски WIERCIĆ. Поэтому ZABURZENIE — это не «забуривание», а нарушение, расстройство, буквально «взбаламученность». Русский на то же понятие смотрит с другой стороны: «расстройство» от «строй», то есть нарушенный порядок, а польский от бури, то есть от взбаламученности." }
  - { kind: usage, text: "Восемь форм, средний род, родительный множественного ZABURZEŃ. В медицине слово почти всегда стоит во множественном числе, и это надо принять как данность: ZABURZENIA SNU, ZABURZENIA ODŻYWIANIA, ZABURZENIA LĘKOWE «тревожные расстройства», ZABURZENIA PSYCHICZNE. Единственное число употребляется о единичном сбое: ZABURZENIE W DOSTAWIE PRĄDU. Русский поступает так же, говоря «расстройства сна» во множественном." }
  - { kind: government, text: "Расстройство чего — родительный без предлога: ZABURZENIA SNU, ZABURZENIA MOWY, как и по-русски. Сбой в чём — предлог W с местным падежом: ZABURZENIE W DOSTAWIE, ZABURZENIA W PRACY SERCA. Тип расстройства передаётся прилагательным, а не предлогом: ZABURZENIA LĘKOWE «тревожные», ZABURZENIA AFEKTYWNE «аффективные». Глагол ZABURZYĆ управляет винительным: ZABURZYĆ RÓWNOWAGĘ «нарушить равновесие»." }
  - { kind: pronunciation, text: "Читается «забуже́не», четыре слога, ударение на третьем, то есть на предпоследнем. Сочетание RZ даёт «ж», поэтому середина слова звучит «буже», а не «бурзе». Конечное NIE — мягкое «не», где I только знак мягкости. В слове BURZA слышно «бу́жа», а в BURZYĆ — «бу́жычь». Это общее правило: RZ всегда «ж», и ни в одном положении оно не читается как «рз»." }
  - { kind: register, text: "Слово медицинское и техническое, в быту попадается в разговорах о здоровье. Частые обороты: ZABURZENIA SNU «расстройства сна», ZABURZENIA ODŻYWIANIA «расстройства питания», ZABURZENIA PSYCHICZNE «психические расстройства», ZABURZENIA RYTMU SERCA «нарушения ритма сердца». В технике и в сводках это сбой: ZABURZENIA W SIECI «сбои в сети». Прилагательное того же корня, ZABURZONY, значит «нарушенный»: ZABURZONY SEN." }
