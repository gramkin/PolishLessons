# review
id: przesliczny
format: 2
lemma: "prześliczny"
rank: 2156
pos: adj
pron: { cyr: "пшэсьли́чны" }
senses:
  - id: lovely
    ru: "прелестный, премилый"
    examples:
      - pl: "Spotkałem prześliczną dziewczynę."
        ru: "Я встретил прелестную девушку."
        source: { kind: translated, id: 968955 }
      - pl: "Mama uszyła mi prześliczną spódniczkę."
        ru: "Мама сшила мне прелестную юбочку."
        source: { kind: translated, id: 4134083 }
      - pl: "To prześliczny widok."
        ru: "Это прелестный вид."
        source: { kind: authored }
  - id: gorgeous
    ru: "очаровательный, красивейший"
    examples:
      - pl: "Miała prześliczne oczy."
        ru: "У неё были прелестные глаза."
        source: { kind: authored }
      - pl: "Kupili prześliczny dom nad jeziorem."
        ru: "Они купили прелестный дом у озера."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Приставка prze- усиливает: śliczny «прелестный» становится prześliczny «прелестнейший». Та же модель, что в przepiękny «прекраснейший», przemiły «премилый»." }
  - { kind: false-friend, text: "Русское «пре-» работает точно так же: «прекрасный», «премилый». Здесь языки совпадают в самом способе усиления." }
  - { kind: government, text: "Обычное прилагательное; согласуется по роду: prześliczny dom, prześliczna dziewczyna, prześliczne oczy." }
  - { kind: usage, text: "Слово эмоциональное и тёплое, чаще звучит о детях, вещах и видах, чем о мужчинах." }
collocations:
  - { pl: "prześliczna dziewczyna", ru: "прелестная девушка" }
etymology: "prze- + śliczny «прелестный»; приставка усиливает ровно как русское «пре-» в «прекрасный»."
memory: "prześliczny — «прелестнейший», усиление от śliczny. Приставка prze- работает как русское «пре-»: przepiękny «прекраснейший», przemiły «премилый»."
idioms:
  - { pl: "prześliczna dziewczyna", ru: "прелестная девушка" }
