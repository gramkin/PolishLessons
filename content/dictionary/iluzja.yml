etymology: "Из латинского ILLUSIO «насмешка, обман», от ILLUDERE «играть, насмехаться». Русское «иллюзия» — то же слово."
memory: "Iluzja — иллюзия, с одним l. Iluzja optyczna — оптическая иллюзия. Bez złudzeń — без иллюзий. Читается «илю́зья»."
idioms:
  - { pl: "rozwiać iluzje", ru: "развеять иллюзии" }
formExamplesSkip:
