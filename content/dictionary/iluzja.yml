id: iluzja
format: 2
lemma: "iluzja"
rank: 5084
pos: noun
pron: { cyr: "илю́зья" }
senses:
  - id: illusion
    ru: "иллюзия, заблуждение"
    examples:
      - pl: "Żyje w iluzji, że wszystko jest w porządku."
        ru: "Он живёт в иллюзии, что всё в порядке."
        source: { kind: authored }
      - pl: "To tylko iluzja bezpieczeństwa."
        ru: "Это лишь иллюзия безопасности."
        source: { kind: authored }
      - pl: "Straciła wszystkie iluzje."
        ru: "Она утратила все иллюзии."
        source: { kind: authored }
  - id: trick
    ru: "иллюзия, фокус (оптический, сценический)"
    examples:
      - pl: "Iluzja optyczna oszukuje nasz mózg."
        ru: "Оптическая иллюзия обманывает наш мозг."
        source: { kind: authored }
      - pl: "Magik pokazał niesamowitą iluzję."
        ru: "Фокусник показал невероятную иллюзию."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ILUZJA — «иллюзия», с одним L. Разочарование, «без иллюзий» — BEZ ZŁUDZEŃ: слово ZŁUDZENIE ближе к русскому «заблуждение». Иллюзионист — ILUZJONISTA." }
  - { kind: usage, text: "Женский род. Родительный, дательный и местный — ILUZJI. Множественное — ILUZJE. Звательный и архаичное ILUZYJ не используем." }
  - { kind: government, text: "Жить в иллюзии — ŻYĆ W ILUZJI, местный. Иллюзия чего — родительный: ILUZJA WOLNOŚCI. Лишиться иллюзий — STRACIĆ ILUZJE." }
  - { kind: pronunciation, text: "Читается «илю́зья»: LU — мягкое «лю», ZJA — «зья». Ударение на предпоследнем слоге." }
collocations:
  - { pl: "iluzja optyczna", ru: "оптическая иллюзия" }
  - { pl: "żyć w iluzji", ru: "жить иллюзиями" }
  - { pl: "stracić iluzje", ru: "утратить иллюзии" }
family:
