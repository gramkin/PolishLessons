# review
id: madry
format: 2
lemma: "mądry"
rank: 1026
pos: adj
pron: { cyr: "мо́ндры" }
senses:
  - id: wise
    ru: "умный, мудрый"
    examples:
      - pl: "To mądry człowiek."
        ru: "Он мудрый человек."
        source: { kind: translated, id: 989491 }
      - pl: "Władcą naszego kraju jest dobry i mądry król."
        ru: "Правитель нашей страны — добрый и мудрый король."
        source: { kind: translated, id: 441206 }
      - pl: "Ona jest bardzo mądra."
        ru: "Она очень умная."
        source: { kind: translated, id: 8722919 }
  - id: smarter
    ru: "mądrzejszy — умнее"
    examples:
      - pl: "Jestem mądrzejszy od ciebie."
        ru: "Я умнее тебя."
        source: { kind: translated, id: 5909170 }
      - pl: "On jest znacznie mądrzejszy ode mnie."
        ru: "Он намного умнее меня."
        source: { kind: translated, id: 2176447 }
      - pl: "Ona jest mądrzejsza od niego."
        ru: "Она умнее его."
        source: { kind: translated, id: 412907 }
  - id: wise-choice
    ru: "mądra decyzja, mądry wybór — умное решение, разумный выбор"
    examples:
      - pl: "To byłaby mądra decyzja."
        ru: "Это было бы разумное решение."
        source: { kind: translated, id: 12053435 }
      - pl: "Dokonałeś mądrego wyboru."
        ru: "Ты сделал разумный выбор."
        source: { kind: translated, id: 12351090 }
      - pl: "Nie wygląda na mądrego chłopaka."
        ru: "Он не похож на умного парня."
        source: { kind: translated, id: 661285 }
notes:
  - { kind: usage, text: "Степени сравнения — mądrzejszy, najmądrzejszy, с чередованием d на drz. Старая форма mędrszy сохранилась только в словарях и в живой речи не встречается." }
  - { kind: usage, text: "Мужско-личная форма множественного числа — mądrzy: Jesteście mądrzy «Вы умные». Она же субстантивируется: Mądrzy uczą się od wrogów." }
  - { kind: usage, text: "Mądry Polak po szkodzie — «поляк умён после беды», польский аналог русского «задним умом крепок»." }
  - { kind: usage, text: "Родственное существительное — mądrość «мудрость». А «мудрец» будет mędrzec, там как раз сохранился старый корень mędr-." }
collocations:
  - { pl: "mądry człowiek", ru: "умный человек" }
  - { pl: "mądra decyzja", ru: "разумное решение" }
  - { pl: "mądrzejszy od", ru: "умнее чем" }
  - { pl: "mądry wybór", ru: "разумный выбор" }
family:
  - { pl: "mądrość", ru: "мудрость", relation: derived }
  - { pl: "mędrzec", ru: "мудрец", relation: root }
  - { pl: "głupi", ru: "глупый", relation: antonym }
etymology: "Праславянское *mǫdrъ — то же слово, что русское «мудрый». Носовое ą в польском отвечает русскому «у»: mądry — «мудрый»."
memory: "mądry — «умный, мудрый». Степени идут с чередованием: mądrzejszy, najmądrzejszy, а старое mędrszy сохранилось только в слове mędrzec «мудрец». И запомните Mądry Polak po szkodzie — «задним умом крепок»."
idioms:
  - { pl: "mądry Polak po szkodzie", ru: "задним умом крепок" }
  - { pl: "mądrej głowie dość dwie słowie", ru: "умной голове довольно двух слов" }
  - { pl: "mądry przyjmie radę, głupi nią wzgardzi", ru: "умный совет примет, глупый отвергнет" }
