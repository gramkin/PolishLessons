notes:
  - { kind: false-friend, text: "За этим словом стоит звуковое соответствие, которое стоит выучить целиком: польское GW- отвечает русскому ЗВ-. GWIAZDA это «звезда», GWIZDAĆ — «свистеть», и в праславянском и там и там стояло *gv-. Польский это сочетание сохранил, а восточнославянские языки изменили его в ЗВ- и СВ-. Поэтому, увидев в польском слове GW- в начале, пробуйте подставить русское ЗВ-, и смысл часто проясняется сам. Прилагательное при этом не GWIAZDOWY, а GWIEZDNY, и о человеке-знаменитости говорят иначе — GWIAZDORSKI, от GWIAZDOR «звезда эстрады». Так одно гнездо дало два прилагательных с разными значениями." }
  - { kind: usage, text: "В основе работает чередование IA и IE: существительное GWIAZDA, но прилагательное GWIEZDNY, а не «gwiazdny». Та же замена видна в GWIEŹDZISTY «звёздчатый» и в местном падеже самого существительного — W GWIEŹDZIE. Причина историческая: старое ě перед мягким согласным дало IE, перед твёрдым IA, и в производных слово попадает в мягкое окружение. Такое же чередование у ŚWIAT и ŚWIETNY, у MIASTO и MIEJSKI. Прилагательное относительное, степеней не образует, поэтому форм одиннадцать. Мужской личный множественного GWIEZDNI употребляется редко, в основном в литературе о космических путешествиях." }
  - { kind: government, text: "Согласуется с существительным в роде, числе и падеже. Частотные сочетания: GWIEZDNE NIEBO «звёздное небо», GWIEZDNY PYŁ «звёздная пыль», GWIEZDNA MAPA «звёздная карта», GWIEZDNE SKUPISKO «звёздное скопление», ROK GWIEZDNY «звёздный год» — астрономический термин. Для переносного «звёздный» о славе нужно другое слово: звёздный час по-польски не GWIEZDNA GODZINA, а WIELKA CHWILA или ŻYCIOWY SUKCES. Прилагательное GWIEZDNY держится при астрономии и при фантастике." }
  - { kind: pronunciation, text: "Читается «гве́здны», два слога, ударение на первом. Сочетание GW произносится как «гв», слитно, и это как раз то место, где русский слышит привычное «зв» и норовит его подставить. Сочетание IE даёт мягкое «е». Группа ZDN выговаривается без вставной гласной, тремя согласными подряд. Конечное -NY это «ны», с «ы», а не «и». В форме GWIEŹDZIE буква Ź даёт мягкое «зь», а DZ — «дзь»: «гве́жьдзе»." }
