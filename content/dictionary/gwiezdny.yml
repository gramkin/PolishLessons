etymology: "От GWIAZDA, из праславянского *gvězda, от которого и русская «звезда». Исходное сочетание *gv- польский сохранил без изменений, а восточнославянские языки преобразовали его в зв-, так что GWIAZDA и «звезда» — одно слово с разным началом. То же соответствие видно в паре GWIZDAĆ и «свистеть», где польский держит GW-, а русский перешёл к св-. Суффикс -NY образует относительные прилагательные, и перед ним старое ě дало IE вместо IA, отсюда GWIEZDNY при GWIAZDA; точно так же ŚWIAT даёт ŚWIETNY, а MIASTO — MIEJSKI. Из того же гнезда идут GWIAZDKA, которое значит и «звёздочка», и Рождество, потому что праздник назван по вифлеемской звезде, и GWIAZDOR — «звезда эстрады», а в некоторых областях Польши так называют и рождественского деда."
memory: "Польское GW- отвечает русскому ЗВ-: gwiazda — «звезда», gwizdać — «свистеть». Праславянское *gv- польский сохранил, восточнославянские языки изменили. Прилагательное не «gwiazdny», а gwiezdny: ia переходит в ie перед мягким окружением, как świat/świetny и miasto/miejski. Степеней нет, форм одиннадцать. Для переносного «звёздный час» это слово не годится: нужно wielka chwila."
