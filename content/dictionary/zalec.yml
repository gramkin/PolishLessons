# review
id: zalec
format: 2
lemma: "zalec"
rank: 2277
pos: verb
aspect: perf
pron: { cyr: "за́лец" }
senses:
  - id: settle-over
    ru: "залечь, воцариться (о тишине, тумане)"
    examples:
      - pl: "Zaległa cisza."
        ru: "Воцарилась тишина."
        source: { kind: authored }
      - pl: "Nad doliną zaległa mgła."
        ru: "Над долиной залёг туман."
        source: { kind: authored }
      - pl: "Po jego słowach zaległo milczenie."
        ru: "После его слов воцарилось молчание."
        source: { kind: authored }
  - id: lie-down
    ru: "залечь, улечься"
    examples:
      - pl: "Zalegli w okopach."
        ru: "Они залегли в окопах."
        source: { kind: authored }
      - pl: "Śnieg zaległ na polach."
        ru: "Снег залёг на полях."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Чаще всего подлежащее — тишина, молчание, туман или снег: zaległa cisza «воцарилась тишина». О людях значит «залечь»." }
  - { kind: false-friend, text: "Корень lec/leżeć «лечь, лежать»; ср. русское «залечь». Несовершенный zalegać значит ещё и «иметь задолженность»: zalegać z czynszem." }
  - { kind: government, text: "Непереходный; где — w или na с предложным." }
  - { kind: usage, text: "В корпусе слово не встречается, поэтому все примеры составлены вручную." }
collocations:
  - { pl: "zaległa cisza", ru: "воцарилась тишина" }
  - { pl: "zalegać z czynszem", ru: "иметь долг по квартплате" }
etymology: "za- + lec «лечь», от leżeć «лежать»; ср. русское «залечь», «залежь»."
memory: "zalec — «залечь, воцариться»: zaległa cisza «воцарилась тишина». Несовершенный zalegać значит ещё «иметь задолженность»."
idioms:
  - { pl: "zaległa cisza", ru: "воцарилась тишина" }
