# review
id: wiedziec
format: 2
depth: deep
lemma: "wiedzieć"
rank: 21
pos: verb
aspect: imperf
pron: { cyr: "вье́дзець" }
senses:
  - id: know-fact
    ru: "знать (факт, что-либо)"
    examples:
      - pl: "Wiem."
        ru: "Знаю."
        source: { kind: tatoeba, id: 3759846 }
      - pl: "Nie wiem."
        ru: "Я не знаю."
        source: { kind: tatoeba, id: 348673 }
      - pl: "Tom wie co robić."
        ru: "Том знает, что делать."
        source: { kind: tatoeba, id: 5147953 }
  - id: be-aware
    ru: "знать, быть в курсе"
    examples:
      - pl: "Wiedział za dużo."
        ru: "Он слишком много знал."
        source: { kind: tatoeba, id: 7002370 }
      - pl: "Co wiesz?"
        ru: "Что ты знаешь?"
        source: { kind: tatoeba, id: 9679260 }
notes:
  - { kind: false-friend, text: "wiedzieć — знать факт, znać — быть знакомым с человеком или вещью: Znam Tomka, ale nie wiem, gdzie jest." }
  - { kind: usage, text: "Спряжение нерегулярное: wiem, wiesz, wie, wiemy, wiecie, wiedzą — прошедшее при этом обычное: wiedziałem." }
collocations:
  - { pl: "nie wiem", ru: "я не знаю" }
  - { pl: "o ile wiem", ru: "насколько я знаю" }
  - { pl: "kto wie", ru: "кто знает" }
etymology: "Праславянское *věděti «знать, ведать» — то же слово, что русское «ведать»; исходно «увидеть» (тот же корень, что в «видеть»)."
memory: "Держите в голове пару: wiedzieć — знать факт (Wiem, że...), znać — быть знакомым (Znam go). Настоящее время нерегулярно (wiem, wiesz, wie… wiedzą), а прошедшее совершенно обычное: wiedziałem."
idioms:
