etymology: "От WARIAT «сумасшедший», из латинского VARIARE «изменяться, бредить», с женским суффиксом -KA."
memory: "Wariatka — сумасшедшая, часто шутливо. Jak wariatka — как сумасшедшая. Ty wariatko! — ты чокнутая! Читается «варья́тка»."
