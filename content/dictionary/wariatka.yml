notes:
  - { kind: false-friend, text: "WARIATKA — «сумасшедшая», женская форма от WARIAT. В разговоре часто ласково или в шутку: POZYTYWNA WARIATKA — «весёлая безбашенная девушка». Не путайте с WARIANT — «вариант»." }
  - { kind: register, text: "Слово разговорное. Шутливо между друзьями — нормально; о реальном психическом заболевании — грубо. Нейтрально о болезни — CHORA PSYCHICZNIE." }
  - { kind: usage, text: "Женский род. В дательном и местном K переходит в C: O WARIATCE. Родительный множественного — WARIATEK. Звательный WARIATKO употребляется в шутку." }
  - { kind: pronunciation, text: "Читается «варья́тка»: RIA — «рья». Ударение на предпоследнем слоге. WARIATCE — «варья́тце»." }
collocations:
