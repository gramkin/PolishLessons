# review
id: odpuscic
format: 2
lemma: "odpuścić"
rank: 1415
pos: verb
aspect: perf
pron: { cyr: "отпу́сьциць" }
senses:
  - id: let-go
    ru: "отступиться, бросить, отстать"
    examples:
      - pl: "Nie chcę odpuścić."
        ru: "Я не хочу отступать."
        source: { kind: translated, id: 12832598 }
      - pl: "Odpuść sobie!"
        ru: "Брось!"
        source: { kind: translated, id: 8617597 }
      - pl: "Tom nie chciał odpuścić."
        ru: "Том не хотел отступать."
        source: { kind: translated, id: 6554225 }
  - id: forgive
    ru: "отпустить (грехи), простить"
    examples:
      - pl: "Jezus rzekł: Ojcze! Odpuść im, bo nie wiedzą, co czynią."
        ru: "Иисус сказал: Отче, прости им, ибо не ведают, что творят."
        source: { kind: translated, id: 13081689 }
      - pl: "Wyznany grzech jest w połowie odpuszczony."
        ru: "Исповеданный грех наполовину отпущен."
        source: { kind: translated, id: 12985633 }
  - id: skip
    ru: "odpuścić sobie coś — пропустить, не делать"
    examples:
      - pl: "Zamierzam odpuścić sobie lunch."
        ru: "Я собираюсь пропустить обед."
        source: { kind: translated, id: 6159855 }
notes:
  - { kind: register, text: "Самое частое современное значение — разговорное «отступиться, бросить, не настаивать»: Odpuść sobie! «Брось!»." }
  - { kind: usage, text: "Старое церковное значение — «отпустить грехи»: Odpuść nam nasze winy из молитвы «Отче наш»." }
  - { kind: government, text: "odpuścić komuś — «простить кого-то, отстать от кого-то», с дательным: Odpuść Tomowi. А odpuścić sobie coś — «пропустить, не делать чего-то»." }
  - { kind: usage, text: "Совершенный вид к odpuszczać." }
collocations:
  - { pl: "odpuść sobie", ru: "брось, отстань" }
  - { pl: "odpuścić grzechy", ru: "отпустить грехи" }
  - { pl: "nie odpuścić", ru: "не спустить" }
etymology: "Приставка od- и puścić «пустить» (праславянское *pustiti). Русское «отпустить» собрано из тех же частей, и старое церковное значение у обоих совпадает."
memory: "odpuścić — по-старому «отпустить грехи», а в современной речи гораздо чаще «отступиться, бросить»: Odpuść sobie! «Брось!». С дательным — «отстать от кого-то»: Odpuść Tomowi."
idioms:
  - { pl: "odpuść sobie", ru: "брось, отстань" }
  - { pl: "odpuścić grzechy", ru: "отпустить грехи" }
  - { pl: "nie odpuszczać nikomu", ru: "никому не спускать" }
