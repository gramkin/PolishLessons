notes:
  - { kind: false-friend, text: "Корень общий с русским «дивом», но прилагательное разошлось так далеко, что стало ловушкой. Польское DZIWNY значит «странный», а вовсе не «дивный»: DZIWNY CZŁOWIEK это «странный человек», TO DZIWNE — «это странно». Русское «дивный» хвалит, польское DZIWNY настораживает. Чтобы похвалить, поляк скажет CUDOWNY или WSPANIAŁY. Существительное DZIW «диво» живёт в основном в обороте DZIWY «чудеса» и в слове DZIWOLĄG «уродец, нелепица», и там оттенок тоже скорее странный, чем прекрасный." }
  - { kind: government, text: "Переходное ZDZIWIĆ KOGOŚ требует винительного: ZDZIWIŁ WSZYSTKICH «удивил всех». Возвратное ZDZIWIĆ SIĘ расходится с русским в падеже: поляк говорит ZDZIWIĆ SIĘ CZYMŚ, творительным, а русский — «удивиться чему», дательным. ZDZIWIŁ SIĘ TĄ ODPOWIEDZIĄ это «он удивился этому ответу». Запоминать стоит именно так, потому что по-русски творительный здесь звучал бы неправильно. Придаточное строится через ŻE: ZDZIWIŁO NAS, ŻE PRZYSZEDŁ SAM. Существительное даёт готовый оборот KU MOJEMU ZDZIWIENIU «к моему удивлению»." }
  - { kind: pronunciation, text: "Читается «здзи́вичь», ударение на предпоследнем слоге. Сочетание DZI перед гласной даёт мягкое «дзь», звук, которого в русском нет: это не «д» и не «з», а слитное мягкое «дзь». Поэтому DZIWNY звучит «дзи́вны», а DZIEŃ — «дзень». Конечное Ć мягкое, «чь». В причастии ZDZIWIONY слышно «здзивё́ны»: группа IO даёт «ё», а ударение снова на предпоследнем слоге." }
  - { kind: usage, text: "Пара видов — DZIWIĆ и ZDZIWIĆ, как «удивлять» и «удивить». Причастие ZDZIWIONY давно живёт самостоятельной жизнью прилагательного «удивлённый» и встречается чаще самого глагола: ZDZIWIONA MINA «удивлённое лицо», ZDZIWIONE SPOJRZENIE «удивлённый взгляд». Отглагольное существительное ZDZIWIENIE «удивление» тоже очень частотно. Пятьдесят три формы — обычная подпись переходного глагола совершенного вида, с деепричастием ZDZIWIWSZY и полным страдательным причастием." }
  - { kind: register, text: "Слово нейтральное, одинаково уместное везде. Полезный оборот — NIE MA SIĘ CZEMU DZIWIĆ «нечему удивляться», и в нём, кстати, дательный появляется и в польском, потому что управляет им DZIWIĆ SIĘ CZEMUŚ в значении «находить странным». Соседние слова того же корня: DZIWAK «чудак», DZIWACZNY «причудливый», DZIWNIE «странно». Начальное DZI- в польском регулярно отвечает русскому ДИ- или ДЕ-: DZIWNY и «дивный», DZIEŃ и «день», DZIESIĘĆ и «десять», DZIECKO и «дитя»." }
collocations:
  - { pl: "ku mojemu zdziwieniu", ru: "к моему удивлению" }
