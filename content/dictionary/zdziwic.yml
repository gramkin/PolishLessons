etymology: "Приставка Z- плюс DZIWIĆ, от праславянского *divъ «диво, чудо» и *diviti sę «дивиться». Русский сохранил и «диво», и «дивиться», и «удивить», и прилагательное «дивный» в значении «чудесный». Польский развил то же гнездо, но увёл прилагательное в сторону странности: DZIWNY это «странный», и оценка из восхищённой стала настороженной. Такой сдвиг для слов со значением «необычный» обычен, его же видно в русском «чудной» рядом с «чудесный». Начальное DZI- вместо Д- — след польского смягчения перед передним гласным, которое русский не знает: *divъ дало DZIW, *děnь дало DZIEŃ, *děti дало DZIECI."
memory: "Корень тот же, что в «диве»: dziwić «удивлять», zdziwić «удивить», zdziwienie «удивление». Но прилагательное обмануло: dziwny это «странный», а не «дивный», и похвалить им нельзя — для похвалы есть cudowny. Падеж при возвратном глаголе расходится: zdziwić się czymś, творительным, где русский просит дательного — «удивиться чему». И запомнить ряд dzi- = ди-/де-: dziwny и «дивный», dzień и «день», dziesięć и «десять»."
