notes:
  - { kind: false-friend, text: "Польская JASNOŚĆ — не только «ясность», но и «яркость, светлота»: JASNOŚĆ EKRANU — яркость экрана. Так же и JASNY: JASNY POKÓJ — «светлая комната», JASNE WŁOSY — «светлые волосы», а в разговоре JASNE! — «конечно!»." }
  - { kind: usage, text: "Существительное женского рода на -OŚĆ. Живых форм три: JASNOŚĆ, JASNOŚCI и JASNOŚCIĄ; множественного числа у слова нет." }
  - { kind: government, text: "Для ясности — DLA JASNOŚCI, родительный. Ясность чего-то — JASNOŚĆ CZEGOŚ: JASNOŚĆ MYŚLI. С ясностью — Z JASNOŚCIĄ, творительный." }
  - { kind: pronunciation, text: "Читается «я́сносьць», два слога, ударение на первом. J перед A даёт «я», конечное ŚĆ — «сьць». В форме JASNOŚCI: «ясно́сьци»." }
collocations:
  - { pl: "jasność ekranu", ru: "яркость экрана" }
  - { pl: "jasność umysłu", ru: "ясность ума" }
  - { pl: "zwiększyć jasność", ru: "увеличить яркость" }
family:
  - { pl: "jasny", ru: "светлый; ясный", relation: root, id: jasny }
  - { pl: "jaśnieć", ru: "сиять, светлеть", relation: derived }
  - { pl: "rozjaśnić", ru: "осветлить; прояснить", relation: derived }
etymology: "От JASNY «светлый, ясный», праславянского слова, общего с русским «ясный». В польском у корня сохранилось исходное значение «светлый, яркий», которое в русском слове ушло на второй план."
memory: "Jasność — яркость и ясность: jasność ekranu, jasność myśli. Читается «я́сносьць». Dla jasności — для ясности. Jasny — светлый, а jasne! — конечно!"
