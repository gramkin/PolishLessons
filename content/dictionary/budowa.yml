notes:
  - { kind: false-friend, text: "ПОЛЬСКИЙ СТРОИТ ОТ КОРНЯ, КОТОРЫЙ В РУССКОМ ОСТАЛСЯ ТОЛЬКО В «БУДКЕ». BUDOWAĆ значит «строить», и корень тот же, что в buda «будка, конура» и в русском «будка». В русском глагола от него не осталось, зато он живёт в украинском «будувати» и белорусском «будаваць». Русский взял на эту роль «строить»." }
  - { kind: usage, text: "Два значения расходятся по контексту. Про процесс и площадку — budowa domu, na budowie. Про устройство чего-либо — budowa ciała «строение тела», budowa zdania «строение предложения». Родительный множественного — BUDÓW, с ó, потому что слог стал закрытым: budowa, но budów." }
  - { kind: pronunciation, text: "Три слога, ударение на предпоследнем: bu-DO-wa. Все гласные открытые: «будо́ва». В родительном множественного ó читается как у: «буду́ф», с оглушением конечного w." }
collocations:
  - { pl: "na budowie", ru: "на стройке" }
  - { pl: "budowa ciała", ru: "строение тела" }
  - { pl: "rozpocząć budowę", ru: "начать строительство" }
family:
  - { pl: "budować", ru: "строить", relation: root, id: budowac }
  - { pl: "budynek", ru: "здание", relation: derived, id: budynek }
  - { pl: "buda", ru: "будка, конура", relation: root }
etymology: "От budować «строить», от buda «строение, шалаш», слова, вероятно, германского происхождения, родственного немецкому Bude «лавка, хибара». Русское «будка» — то же слово, но глагола от него русский не образовал. Отсюда budynek «здание» и zabudowa «застройка»."
memory: "budowa — и «стройка», и «строение»: budowa domu, но budowa ciała. Корень тот же, что в русской «будке», только по-русски от него не вышло глагола, а по-польски budować значит «строить». Родительный множественного — budów, с ó."
idioms:
  - { pl: "w budowie", ru: "в стадии строительства" }
  - { pl: "budowa ciała", ru: "телосложение" }
