notes:
  - { kind: false-friend, text: "Русская «расправа» и польская ROZPRAWA — ложная пара, хотя корень общий. ROZPRAWA значит «судебное заседание» и, во втором смысле, «научный труд, диссертация»: ROZPRAWA DOKTORSKA «докторская диссертация». Русская «расправа» в смысле самоуправства по-польски будет SAMOSĄD или ROZPRAWIENIE SIĘ Z KIMŚ. Разница в том, что польское слово нейтрально и даже официально: его печатают в повестках. Глагол ROZPRAWIAĆ значит «рассуждать, разглагольствовать», а ROZPRAWIĆ SIĘ Z KIMŚ — «расправиться с кем-то», и вот тут русское значение совпадает. Так существительное ушло в суд и в науку, а возвратный глагол остался при расправе." }
  - { kind: usage, text: "В дательном и местном падеже единственного числа W смягчается перед окончанием -IE: ROZPRAWIE. Это губной согласный, и он только смягчается, без чередования в основе — то же, что в DOSTAWA и DOSTAWIE. Родительный множественного — ROZPRAW, с нулевым окончанием и без вставной гласной. Форма ROZPRAWY покрывает родительный единственного вместе с именительным и винительным множественного. Сравните с двумя соседями по карточке, где перед тем же окончанием заднее K переходит в C: TKANKA даёт TKANCE, WÓDKA даёт WÓDCE." }
  - { kind: government, text: "Женский род. «На заседании» — предлог NA с местным: NA ROZPRAWIE. «На заседание» о движении — NA с винительным: NA ROZPRAWĘ. Частотные сочетания: ROZPRAWA SĄDOWA «судебное заседание», ROZPRAWA DOKTORSKA, ROZPRAWA HABILITACYJNA, PRZY DRZWIACH ZAMKNIĘTYCH «при закрытых дверях», ODROCZYĆ ROZPRAWĘ «отложить заседание», WYZNACZYĆ ROZPRAWĘ «назначить заседание». В научном значении слово часто во множественном: ROZPRAWY I MATERIAŁY — обычное название сборников." }
  - { kind: pronunciation, text: "Читается «роспра́ва», три слога, ударение на предпоследнем. Приставка ROZ- перед глухим P оглушается, поэтому Z звучит как «с»: не «розправа», а «роспра́ва». На письме приставка всегда ROZ-, как и в ROZKAZ. Буква W между гласными читается «в». В дательном и местном ROZPRAWIE сочетание WIE даёт мягкое «ве»: «роспра́ве». В родительном множественного ROZPRAW конечное W оглушается до «ф»: «ро́спраф»." }
