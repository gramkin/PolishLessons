etymology: "От ROZPRAWIĆ, сложенного из ROZ- и PRAWIĆ «говорить, вести речь», от PRAWO и PRAWY, из праславянского *pravъ «прямой, правильный». Исходный смысл — «разобрать дело словами», и из него выросли оба современных значения: разбор в суде и разбор в науке. Русская «расправа» построена из тех же частей, но пошла по линии силового разбора, а не словесного, и значение сузилось до самоуправства. Поэтому формы совпадают, а смыслы разошлись: польское слово осталось при речи и праве, русское ушло к насилию. Из того же корня идут PRAWO «право», PRAWDA «правда», PRAWNIK «юрист» и SPRAWA «дело», и всё это гнездо для русского вполне прозрачно."
memory: "Ложная пара с «расправой»: rozprawa — это «судебное заседание», а во втором смысле «диссертация» (rozprawa doktorska). Русская «расправа» — samosąd. Но возвратный глагол совпадает: rozprawić się z kimś — «расправиться». Приставка roz- пишется всегда так, хотя перед глухим оглушается: «роспра́ва». В дательном и местном w только смягчается: rozprawie, как dostawie — в отличие от tkance и wódce, где k переходит в c."
idioms:
