    ru: "skorzystanie — использование, обращение к чему-л."
    examples:
      - pl: "Skorzystanie z pomocy prawnika było konieczne."
        ru: "Обращение к помощи адвоката было необходимо."
        source: { kind: authored }
      - pl: "Po skorzystaniu z telefonu oddał go właścicielowi."
        ru: "Воспользовавшись телефоном, он отдал его владельцу."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Корень здесь РОДНОЙ русскому, но с перевёрнутой окраской. Польское korzyść значит нейтральную «пользу, выгоду», а русская «КОРЫСТЬ» — то же слово — испортилась до «жадности, шкурного интереса». Поэтому korzystny это «выгодный», а не «корыстный»; korzystna oferta — «выгодное предложение». Хвалить по-польски можно тем словом, которым по-русски упрекают." }
  - { kind: government, text: "ГЛАВНАЯ ловушка карточки. Пользуются ЧЕМ по-русски — творительный: «воспользоваться возможностью». По-польски — предлог Z с РОДИТЕЛЬНЫМ: skorzystać z okazji, z rady, z windy, z pomocy. Никогда не ставьте здесь творительный. Второе значение берёт na с предложным: skorzystać na zmianie «выиграть от перемены»." }
  - { kind: usage, text: "Вид совершенный, несовершенная пара — korzystać: korzystam z komputera codziennie «я пользуюсь компьютером каждый день», но dziś skorzystam z laptopa «сегодня воспользуюсь ноутбуком». Формы всего сорок две, и страдательного причастия нет: дополнение стоит в родительном с предлогом, а не в винительном, значит делать его подлежащим не из чего." }
collocations:
  - { pl: "skorzystać z okazji", ru: "воспользоваться возможностью" }
  - { pl: "skorzystać z rady", ru: "воспользоваться советом" }
  - { pl: "skorzystać na czymś", ru: "выиграть от чего-л." }
family:
  - { pl: "korzystać", ru: "пользоваться", relation: aspect, id: korzystac }
  - { pl: "korzyść", ru: "польза, выгода", relation: root }
  - { pl: "korzystny", ru: "выгодный", relation: derived }
etymology: "Приставка s- плюс korzystać, от korzyść «польза, выгода». Русская «корысть» — то же самое слово, и когда-то она тоже значила просто «прибыль», но закрепилась за прибылью неправедной, тогда как польское korzyść осталось нейтральным. Отсюда и расхождение оценок: korzystny «выгодный» против русского «корыстный»."
memory: "skorzystać — «воспользоваться», но ОБЯЗАТЕЛЬНО z плюс родительный: skorzystać z okazji, не творительный, как по-русски. Корень тот же, что в русской «корысти», только польское korzyść значит честную «выгоду»."
