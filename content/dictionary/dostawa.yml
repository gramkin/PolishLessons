notes:
  - { kind: false-friend, text: "Само слово безопасно: DOSTAWA это «доставка» или «поставка». Опасен глагол, от которого оно идёт. Польское DOSTAĆ значит «получить», а не «достать»: DOSTAŁEM LIST это «я получил письмо», DOSTAĆ PREZENT — «получить подарок», DOSTAĆ PRACĘ — «получить работу». Русское «достать» в смысле «добыть с трудом» по-польски ZDOBYĆ или ZDOBYĆ SIĘ, а в смысле «дотянуться» — SIĘGNĄĆ или DOSIĘGNĄĆ. Ошибка здесь особенно устойчива, потому что оба слова существуют и оба употребительны, так что фраза получается осмысленной, но не той. Рядом стоит DOSTAWAĆ «получать» в несовершенном виде и DOSTAWIĆ «доставить, приставить», от которого и образовано существительное." }
  - { kind: usage, text: "В дательном и местном падеже единственного числа получается DOSTAWIE, и в основе здесь ничего не чередуется: губное W просто смягчается перед окончанием -IE. Это стоит сопоставить с соседями, где основа меняется: OZNAKA даёт OZNACE с переходом K в C, AUTOSTRADA даёт AUTOSTRADZIE с переходом D в DZ, а DOSTAWA и ORGANIZM только смягчаются. Правило простое: заднеязычные и зубные перед -IE чередуются, губные нет. Родительный множественного — DOSTAW, с нулевым окончанием и без вставной гласной. Форма DOSTAWY покрывает родительный единственного вместе с именительным и винительным множественного." }
  - { kind: government, text: "Женский род. Чего поставка — родительный: DOSTAWA TOWARU, DOSTAWA WĘGLA, TERMIN DOSTAWY «срок поставки». Куда — предлог DO с родительным: DOSTAWA DO DOMU «доставка на дом», DOSTAWA DO MAGAZYNU. Частотные глаголы: ZAMÓWIĆ DOSTAWĘ «заказать доставку», PRZYJĄĆ DOSTAWĘ «принять поставку», WSTRZYMAĆ DOSTAWY «приостановить поставки», OPÓŹNIĆ DOSTAWĘ «задержать поставку». Прилагательные: DOSTAWA BEZPŁATNA «бесплатная доставка», DOSTAWA EKSPRESOWA. Поставщик — DOSTAWCA, и это слово мужского рода, несмотря на окончание -A." }
  - { kind: pronunciation, text: "Читается «доста́ва», три слога, ударение на предпоследнем. Первое O произносится полно, как «о», а не редуцируется в «а», как было бы в русском безударном слоге. Буква W между гласными звучит как «в». В дательном и местном DOSTAWIE сочетание WIE даёт мягкое «ве»: «доста́ве». В родительном множественного DOSTAW слогов два, ударение переходит на первый, а конечное W оглушается до «ф»: «до́стаф»." }
