etymology: "От DOSTAWIĆ «доставить, приставить», сложенного из приставки DO- и STAWIĆ «ставить», из праславянского *staviti, того же корня, что русские «ставить», «доставить», «поставка». Образ один и тот же: доставить — значит «поставить к месту», и русская «поставка» с «доставкой» построены на той же основе, только с другими приставками. Суффикс -A здесь образует отглагольное имя действия, как в OBSŁUGA от OBSŁUGIWAĆ. Из того же гнезда идёт DOSTAĆ, и вот оно-то и расходится с русским: польский развил у этого глагола значение «получить», тогда как русское «достать» пошло в сторону добывания и дотягивания. Так одно гнездо дало безопасное существительное и обманчивый глагол, и для учащегося полезнее помнить именно глагол."
memory: "Существительное безопасно — dostawa это «доставка», «поставка». Но глагол того же гнезда обманывает: dostać значит «получить», а не «достать». Dostałem list — «я получил письмо». Русское «достать» это zdobyć (добыть) или sięgnąć (дотянуться). В дательном и местном dostawie основа не меняется: губное w только смягчается — в отличие от oznace (k→c) и autostradzie (d→dz). Поставщик — dostawca, мужского рода при окончании -a."
