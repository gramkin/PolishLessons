etymology: "Из французского PARADE, через немецкий. Слово общее с русским «парад»; спортивное значение «отражение удара» пришло из фехтования, где французский глагол того же корня значит «отражать»."
memory: "Parada — парад, а в спорте сейв: parada bramkarza. Читается «пара́да». Wchodzić komuś w paradę — мешать, перебегать дорогу. Mieć głowę nie od parady — иметь голову на плечах. Paradować — расхаживать напоказ."
idioms:
