notes:
  - { kind: false-friend, text: "Кроме «парада», PARADA в спорте — отражение удара: PARADA BRAMKARZA — сейв вратаря. Отсюда оборот WCHODZIĆ KOMUŚ W PARADĘ, буквально «влезать кому-то в защиту», — мешать, перебегать дорогу. А MIEĆ GŁOWĘ NIE OD PARADY — «голова не для красоты», то есть человек умный." }
  - { kind: usage, text: "Десять форм в таблице, женский род. В дательном и местном падежах D смягчается в DZ: NA PARADZIE. Родительный множественного — PARAD, без окончания. Глагол PARADOWAĆ — «расхаживать напоказ»: PARADOWAŁ W NOWYM GARNITURZE. Звательная форма не нужна." }
  - { kind: government, text: "На параде — NA PARADZIE, местный. Смотреть парад — OGLĄDAĆ PARADĘ, винительный. Мешать кому-то — WCHODZIĆ KOMUŚ W PARADĘ, дательный лица." }
  - { kind: pronunciation, text: "Читается «пара́да», три слога, ударение на втором, как и в русском «пара́д». В местном падеже PARADZIE: «пара́дзе»." }
collocations:
  - { pl: "parada wojskowa", ru: "военный парад" }
  - { pl: "oglądać paradę", ru: "смотреть парад" }
  - { pl: "parada bramkarza", ru: "сейв вратаря" }
family:
