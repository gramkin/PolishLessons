notes:
  - { kind: false-friend, text: "Три глагола от одного корня KONIEC, и путать их легко. SKOŃCZYĆ — самое обычное «закончить»: SKOŃCZYŁEM PRACĘ. UKOŃCZYĆ — официальное «окончить», прежде всего про учёбу: UKOŃCZYĆ STUDIA, UKOŃCZYĆ SZKOŁĘ. А WYKOŃCZYĆ, разобранное в карточке партии 275, значит «отделать» про помещение и «доконать» про человека — и уж точно не «закончить». Так что диплом даёт UKOŃCZYĆ, ремонт — WYKOŃCZYĆ, а обед — SKOŃCZYĆ." }
  - { kind: usage, text: "Второе значение русскому придётся перестроить, потому что русский говорит об этом безлично. UKOŃCZYĆ OSIEMNAŚCIE LAT буквально «окончить восемнадцать лет», а по-русски — «исполнилось восемнадцать», где человек стоит в дательном. По-польски же человек подлежащее: ONA UKOŃCZYŁA OSIEMNAŚCIE LAT. В документах постоянно встречается оборот PO UKOŃCZENIU 18 LAT — «по достижении 18 лет», и его стоит запомнить целиком." }
  - { kind: pronunciation, text: "Повелительное UKOŃCZ — тот же случай, что WYKOŃCZ из партии 275. Отбрасываем -y от третьего лица UKOŃCZY, остаётся сочетание -ńcz, которое кажется слишком тяжёлым для конца слова. Но польские слова так кончаться могут: UKOŃCZ, SKOŃCZ, DOKOŃCZ, WYKOŃCZ — все законны, и никакого -ij не вставляется. Правило спрашивает не про длину сочетания, а про то, бывает ли такой конец у польских слов." }
  - { kind: government, text: "Переходный, винительный: UKOŃCZYĆ COŚ — ukończyć studia, szkołę, kurs, budowę. Отглагольное существительное UKOŃCZENIE почти всегда стоит с предлогом PO и предложным падежом: PO UKOŃCZENIU STUDIÓW, PO UKOŃCZENIU BUDOWY — «по окончании учёбы, стройки». Русский берёт здесь то же «по» с предложным, так что оборот переносится целиком. Несовершенной пары у глагола в обиходе нет: процесс передаёт KOŃCZYĆ." }
collocations:
  - { pl: "ukończyć studia", ru: "окончить учёбу" }
  - { pl: "po ukończeniu studiów", ru: "по окончании учёбы" }
  - { pl: "ukończyć osiemnaście lat", ru: "достичь восемнадцати лет" }
family:
  - { pl: "skończyć", ru: "закончить", relation: root, id: skonczyc }
  - { pl: "wykończyć", ru: "отделать, доконать", relation: root, id: wykonczyc }
  - { pl: "koniec", ru: "конец", relation: root, id: koniec }
etymology: "Приставка u- и KOŃCZYĆ «кончать», от KONIEC «конец», из праславянского *konьcь — то же слово, что русский «конец». Приставка u- даёт здесь полное завершение без оттенка, тогда как wy- в WYKOŃCZYĆ добавило «до конца, насквозь», а s- в SKOŃCZYĆ осталось нейтральным. Из гнезда вышли UKOŃCZENIE «окончание», ZAKOŃCZENIE «завершение, финал», NIESKOŃCZONY «бесконечный», DOKOŃCZYĆ «докончить»."
memory: "Диплом — ukończyć, ремонт — wykończyć, обед — skończyć. И запомните: ukończyła osiemnaście lat значит «ей исполнилось восемнадцать»."
