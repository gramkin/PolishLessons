# review
id: robal
format: 2
lemma: "robal"
rank: 5231
pos: noun
pron: { cyr: "ро́баль" }
senses:
  - id: bug
    ru: "разг. жук, букашка, червяк"
    examples:
      - pl: "W sałacie siedział jakiś robal."
        ru: "В салате сидела какая-то букашка."
        source: { kind: authored }
      - pl: "Dzieci zbierały robale do słoika."
        ru: "Дети собирали жуков в банку."
        source: { kind: authored }
      - pl: "Fuj, po ścianie łazi robal!"
        ru: "Фу, по стене ползёт какая-то тварь!"
        source: { kind: authored }
  - id: creep
    ru: "разг., пренебр. гнида, червь (о человеке)"
    examples:
      - pl: "Ten robal doniósł na nas szefowi."
        ru: "Эта гнида донесла на нас начальнику."
        source: { kind: authored }
      - pl: "Nie bądź takim robalem, przyznaj się."
        ru: "Не будь таким червём, признайся."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Русскому «робал» ничего не говорит, хотя корень знаком: ROBAK, «червяк, жук». ROBAL — его грубоватый разговорный вариант, как русское «букашка» с оттенком брезгливости или «тварь». В переносном значении — презрительное о человеке, как русское «червь», «гнида»." }
  - { kind: usage, text: "Мужской род, одушевлённое: винительный совпадает с родительным, ZABIĆ ROBALA. Множественное ROBALE, родительный ROBALI. В местном и звательном — ROBALU. Для жуков и червей это слово-зонтик, без уточнения вида." }
  - { kind: government, text: "Жуки в чём-то — ROBALE W + местный: ROBALE W MĄCE, «жучки в муке». Кишеть жуками — ROIĆ SIĘ OD ROBALI, OD с родительным. Само существительное падежа не требует." }
  - { kind: pronunciation, text: "Читается «ро́баль», два слога, ударение на первом. Конечная L мягкая, «ль». В ROBALA L перед гласной обычная: «роба́ла»." }
  - { kind: register, text: "Разговорное и экспрессивное слово, часто брезгливое. Нейтральное — ROBAK или OWAD, «насекомое». О человеке ROBAL — оскорбление, но не матерное; его услышишь и от школьников, и в кино." }
collocations:
  - { pl: "robale w mące", ru: "жучки в муке" }
  - { pl: "zabić robala", ru: "раздавить букашку" }
  - { pl: "roić się od robali", ru: "кишеть жуками" }
family:
  - { pl: "robak", ru: "червяк, жук", relation: root, id: robak }
  - { pl: "owad", ru: "насекомое", relation: root }
  - { pl: "robaczek", ru: "букашечка, червячок", relation: derived }
etymology: "От ROBAK «червяк, жук», с экспрессивным суффиксом -AL, тем же, что в SPRYCIARZ или NOCHAL, «носяра». Происхождение ROBAK спорно; русскому «червь» оно не родственно. Суффикс -AL придаёт слову грубоватый, увеличительный оттенок."
memory: "Robal — букашка, жук (разг., брезгливо): robal w sałacie. И о человеке — гнида. От robak. Читается «ро́баль»."
idioms:
  - { pl: "zabić robaka", ru: "заморить червячка" }
