notes:
  - { kind: register, text: "Книжное и канцелярское слово: отчёты, протоколы, исторические труды. В разговоре говорят WSPOMNIEĆ или WSPOMINAĆ. Чаще всего встречается причастие WZMIANKOWANY: WIEŚ WZMIANKOWANA W 1250 ROKU «деревня, упомянутая в 1250 году»." }
  - { kind: government, text: "Две конструкции: WZMIANKOWAĆ COŚ (винительный) и WZMIANKOWAĆ O CZYMŚ (O + предложный): WZMIANKOWAĆ O WYPADKU «упоминать об аварии». В истории городов и сёл — оборот PO RAZ PIERWSZY WZMIANKOWANY «впервые упоминаемый»." }
  - { kind: usage, text: "Несовершенный вид. Спряжение на -UJĘ: WZMIANKUJĘ, WZMIANKUJESZ, WZMIANKUJĄ, а в прошедшем -OWA-: WZMIANKOWAŁ. Глагол образован от существительного WZMIANKA «упоминание, краткая заметка»." }
  - { kind: pronunciation, text: "Читается «взмянко́ваць»: W перед звонким Z остаётся «в», IA — «я», ударение на предпоследнем слоге. WZMIANKUJE — «взмянку́е»." }
