# review
id: piatka
format: 2
lemma: "piątka"
rank: 1695
pos: noun
pron: { cyr: "пё́нтка" }
senses:
  - id: digit-grade
    ru: "пятёрка (цифра 5; школьная оценка)"
    examples:
      - pl: "Zdałem egzamin na piątkę."
        ru: "Я сдал экзамен на пятёрку."
        source: { kind: translated, id: 13657609 }
      - pl: "Dostałem piątkę z matematyki."
        ru: "Я получил пятёрку по математике."
        source: { kind: authored }
      - pl: "Napisz tu piątkę."
        ru: "Напиши здесь пятёрку."
        source: { kind: authored }
  - id: group-five
    ru: "пятёрка (группа из пяти); przybić piątkę «дать пять»"
    examples:
      - pl: "Ojciec ma piątkę rodzeństwa."
        ru: "У отца пятеро братьев и сестёр."
        source: { kind: translated, id: 3710421 }
      - pl: "Przybij piątkę!"
        ru: "Дай пять!"
        source: { kind: translated, id: 7680851 }
      - pl: "Piątka!"
        ru: "Пятёрка!"
        source: { kind: translated, id: 6160747 }
notes:
  - { kind: false-friend, text: "Формы piątek и piątki в таблице ниже совпадают с другим словом — piątek «пятница». Dziś jest piątek значит «сегодня пятница», а не «сегодня пятёрка»." }
  - { kind: usage, text: "Как школьная оценка piątka сегодня вторая сверху: высшая в польской школе — szóstka «шестёрка»." }
  - { kind: usage, text: "przybić piątkę — «дать пять», хлопнуть ладонью о ладонь." }
  - { kind: usage, text: "piątka называет и любой предмет с номером 5: автобус, трамвай, дом, размер." }
collocations:
  - { pl: "przybić piątkę", ru: "дать пять" }
  - { pl: "dostać piątkę", ru: "получить пятёрку" }
  - { pl: "piątka rodzeństwa", ru: "пятеро братьев и сестёр" }
family:
  - { pl: "pięć", ru: "пять", relation: root }
  - { pl: "piąty", ru: "пятый", relation: root }
etymology: "От pięć «пять» с суффиксом -ka — ровно как русское «пятёрка» от «пять». Слова построены одинаково."
memory: "piątka — «пятёрка»: и цифра, и оценка, и автобус номер пять, и przybić piątkę «дать пять». Осторожно: piątek — это «пятница», другое слово, хотя формы похожи."
idioms:
  - { pl: "przybić piątkę", ru: "дать пять" }
  - { pl: "dostać piątkę", ru: "получить пятёрку" }
  - { pl: "piątka z plusem", ru: "пятёрка с плюсом" }
