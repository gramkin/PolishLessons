etymology: "Из английского MAIL «почта», сокращения от E-MAIL, где E означает ELECTRONIC. Английское слово идёт от старофранцузского MALE «сумка, мешок», а то — из франкского MALHA того же значения: почта названа по сумке, в которой её носили. Любопытно, что и русское «почта» названо не по содержимому, а по способу доставки — через итальянское POSTA от латинского STATIO POSITA «установленная станция», то есть по станциям, где меняли лошадей. Польский взял английское слово в девяностые годы и немедленно встроил его в свою морфологию, дав ему полное склонение и производные MAILOWY и MAILOWAĆ; русский предпочёл обойтись своим «письмом» и описательным «электронной почтой». Это общая черта: польский охотнее склоняет свежие заимствования, чем русский, и поэтому у него MAILA и MAILEM звучат естественно."
memory: "Польский принял короткое mail и склоняет его как своё: maila, mailowi, mailem, w mailu, maile. Два родительных единственного: maila (разговорное, по образцу одушевлённых) и mailu (книжное) — как krawata/krawatu и golfa/golfu. Местный только один: w mailu. Родительный множественного maili на -i, по мягкой основе, как profili. Очень частое mailem — «по электронной почте». Читается «мэйл», с английским ai = «эй»."
