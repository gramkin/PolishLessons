notes:
  - { kind: usage, text: "У этого слова два родительных падежа единственного числа, и оба в ходу: MAILA и MAILU. Форма MAILA строится по образцу одушевлённых и в разговорной речи преобладает — WYSŁAŁ MAILA, NIE DOSTAŁEM MAILA; форма MAILU книжнее и в официальном тексте надёжнее. Это то же колебание, что у KRAWATA и KRAWATU, KARABINA и KARABINU, GOLFA и GOLFU: польский язык позволяет неодушевлённому слову взять окончание одушевлённого, если так привычнее говорить. Местный падеж при этом только один — W MAILU. Родительный множественного — MAILI, с окончанием -I по мягкой основе на -L, как PROFILI, а не «mailów»." }
  - { kind: false-friend, text: "Оба языка взяли слово из английского, но обошлись с ним по-разному. Польский принял короткую форму MAIL и склоняет её полностью, как своё: MAILA, MAILOWI, MAILEM, W MAILU, MAILE. Русский чаще говорит «письмо» или «имейл», а «мейл» звучит разговорно и склоняется неохотно. Польский пошёл дальше и образовал от слова свои производные: MAILOWY «электронный, почтовый», MAILOWAĆ «переписываться по почте», и даже глагол совершенного вида ZMAILOWAĆ. Исконные польские способы сказать то же — LIST «письмо», WIADOMOŚĆ «сообщение», POCZTA ELEKTRONICZNA; полное написание E-MAIL тоже встречается, особенно в документах." }
  - { kind: government, text: "Мужской род, неодушевлённое. «Написать письмо» — винительный: NAPISAĆ MAIL или NAPISAĆ MAILA, обе формы встречаются. «В письме» — предлог W с местным: W MAILU. «Письмом, по почте» — творительный без предлога: WYSŁAĆ MAILEM, PRZYSZŁO MAILEM, и это очень частое употребление, отвечающее русскому «по почте». Кому — дательный: NAPISAŁ MAILA SZEFOWI. Частотные сочетания: ODPOWIEDZIEĆ NA MAIL «ответить на письмо», ZAŁĄCZNIK DO MAILA «вложение к письму», SKRZYNKA MAILOWA «почтовый ящик»." }
  - { kind: pronunciation, text: "Читается «мэйл», один слог, поэтому вопрос об ударении не встаёт. Сочетание AI читается здесь по-английски, как «эй», и это редкость: обычно польский читает заимствования по своим правилам, но у этого слова английское чтение закрепилось. Конечное L звучит мягче русского твёрдого «л». В форме MAILA слогов два, ударение на первом: «мэ́йла». В местном MAILU слышно «мэ́йлу». В родительном множественного MAILI — «мэ́йли»." }
