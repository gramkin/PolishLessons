# review
id: poprzez
format: 2
lemma: "poprzez"
rank: 1739
pos: prep
pron: { cyr: "по́пшэс" }
senses:
  - id: through-space
    ru: "через, сквозь (о пространстве)"
    examples:
      - pl: "Droga wiła się poprzez pola."
        ru: "Дорога вилась через поля."
        source: { kind: translated, id: 880309 }
      - pl: "Szliśmy poprzez las."
        ru: "Мы шли через лес."
        source: { kind: authored }
      - pl: "Woda przecieka poprzez sufit."
        ru: "Вода протекает через потолок."
        source: { kind: authored }
  - id: by-means
    ru: "посредством, путём, через (о способе)"
    examples:
      - pl: "Wiedzę zyskujemy tylko poprzez naukę."
        ru: "Знания мы получаем только через учёбу."
        source: { kind: translated, id: 351935 }
      - pl: "Myśli wyrażane są poprzez słowa."
        ru: "Мысли выражаются через слова."
        source: { kind: translated, id: 7868818 }
      - pl: "Wybierasz swojego reprezentanta poprzez głosowanie."
        ru: "Ты выбираешь своего представителя голосованием."
        source: { kind: translated, id: 2767524 }
notes:
  - { kind: government, text: "poprzez требует винительного падежа, как и przez: poprzez pola, poprzez naukę." }
  - { kind: false-friend, text: "poprzez и przez значат почти одно и то же, но poprzez книжнее и подчёркивает способ или путь: wiedzę zyskujemy poprzez naukę. В обычной речи скажут przez." }
  - { kind: usage, text: "В значении «из-за» употребляется только przez: spóźnili się przez korki «они опоздали из-за пробок», но не poprzez korki." }
  - { kind: usage, text: "Предлог не склоняется и формы poprzeze в живом языке нет, хотя словарь её приводит." }
collocations:
  - { pl: "poprzez naukę", ru: "путём учёбы" }
  - { pl: "poprzez słowa", ru: "через слова" }
  - { pl: "poprzez głosowanie", ru: "путём голосования" }
family:
  - { pl: "przez", ru: "через, сквозь", relation: root, id: przez }
etymology: "Приставка po- плюс przez «через»: усиленный вариант того же предлога. Русское «через» соответствует обоим."
memory: "poprzez — «через», но книжнее, чем przez, и чаще про способ: poprzez naukę «путём учёбы». В значении «из-за» годится только przez."
idioms:
