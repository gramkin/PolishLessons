pos: noun
pron: { cyr: "попра́фка" }
senses:
  - id: amendment
    ru: "поправка, правка"
    examples:
      - pl: "Poprawka weszła w życie w styczniu."
        ru: "Поправка вступила в силу в январе."
        source: { kind: authored }
      - pl: "Zgłosili poprawkę w ostatniej chwili."
        ru: "Они внесли поправку в последний момент."
        source: { kind: authored }
      - pl: "Naniósł poprawki czerwonym długopisem."
        ru: "Он внёс правки красной ручкой."
        source: { kind: authored }
  - id: resit
    ru: "пересдача (экзамена)"
    examples:
      - pl: "Poprawka z matematyki czeka go we wrześniu."
        ru: "Пересдача по математике ждёт его в сентябре."
        source: { kind: authored }
      - pl: "Zdał poprawkę za drugim razem."
        ru: "Он сдал пересдачу со второго раза."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ВТОРОЕ ЗНАЧЕНИЕ РУССКОЙ «ПОПРАВКЕ» НЕДОСТУПНО. В польской школе POPRAWKA — это пересдача, экзамен в сентябре для тех, кто завалил предмет: mieć poprawkę z matematyki, zdać poprawkę. Русское «поправка» о законе и о тексте совпадает полностью, а вот школьный смысл придётся выучить отдельно; у нас это «пересдача» или «переэкзаменовка»." }
  - { kind: pronunciation, text: "Дательный и предложный — POPRAWCE, с переходом k в c, а родительный множественного — POPRAWEK, с беглым e. Это тот же класс, что notatka и przykrywka: оба правила работают у всех существительных на -ka сразу, и выучить их стоит один раз на весь класс." }
collocations:
  - { pl: "zgłosić poprawkę", ru: "внести поправку" }
  - { pl: "nanieść poprawki", ru: "внести правки" }
  - { pl: "poprawka z matematyki", ru: "пересдача по математике" }
family:
  - { pl: "poprawić", ru: "исправить, поправить", relation: root, id: poprawic }
  - { pl: "poprawny", ru: "правильный", relation: derived }
  - { pl: "poprawiać", ru: "исправлять", relation: root }
etymology: "От poprawić «исправить», корень *prav- тот же, что в prawy «правый», prawda и в русских «правый», «править», «поправка». Слово собрано точно как наше, приставка в приставку, поэтому юридический и редакторский смыслы совпали сами собой. Школьная пересдача — уже польское развитие: то, чем исправляют оценку."
memory: "Два значения: «поправка» как у нас — и школьная пересдача, которой у русского слова нет. А падежи как у notatka: w poprawce, kilka poprawek."
idioms:
  - { pl: "zdać poprawkę", ru: "сдать пересдачу" }
  - { pl: "poprawka do ustawy", ru: "поправка к закону" }
