# review
id: zas
format: 2
lemma: "zaś"
rank: 3747
pos: conj
pron: { cyr: "зась" }
senses:
  - id: whereas
    ru: "же, а (противопоставление)"
    examples:
      - pl: "Tom wygląda na spiętego, Mary zaś nie."
        ru: "Том выглядит напряжённым, Мэри же нет."
        source: { kind: translated, id: 12040591 }
      - pl: "Ludzie posiadają poglądy; przekonania zaś posiadają ludzi."
        ru: "Люди имеют взгляды; убеждения же имеют людей."
        source: { kind: translated, id: 354011 }
      - pl: "Ja zostaję, ty zaś jedź."
        ru: "Я остаюсь, ты же поезжай."
        source: { kind: authored }
  - id: and-then
    ru: "а, же (при перечислении)"
    examples:
      - pl: "Pierwszy przyszedł Tom, drugi zaś Piotr."
        ru: "Первым пришёл Том, вторым же Пётр."
        source: { kind: authored }
      - pl: "Ona czyta, on zaś pisze."
        ru: "Она читает, он же пишет."
        source: { kind: authored }
notes:
  - { kind: government, text: "Как и bowiem, никогда не открывает предложение: стоит вторым словом, после того, что противопоставляется. Mary zaś nie, а не Zaś Mary nie." }
  - { kind: usage, text: "Точное соответствие — русская частица «же» в том же положении: «Мэри же нет»." }
  - { kind: false-friend, text: "Не «зась» в смысле запрета (это разговорное zaś в другом значении) и не «за себя». Здесь это книжный противительный союз." }
  - { kind: usage, text: "Книжнее, чем a или natomiast, но встречается и в обычной прессе." }
collocations:
  - { pl: "on zaś", ru: "он же" }
etymology: "Праславянская частица *za-že; ср. русское «же», «зато»."
memory: "zaś — противительное «же». Как и bowiem, оно не открывает предложение, а стоит вторым: Mary zaś nie «Мэри же нет». Русское «же» ведёт себя так же."
