# review
id: tyl
format: 2
lemma: "tył"
rank: 296
pos: noun
pron: { cyr: "тыу" }
senses:
  - id: back
    ru: "зад, задняя часть"
    examples:
      - pl: "W tył zwrot!"
        ru: "Кругом!"
        source: { kind: translated, id: 6308714 }
      - pl: "Krok do tyłu."
        ru: "Шаг назад."
        source: { kind: translated, id: 5627138 }
      - pl: "Z tyłu stał samochód."
        ru: "Сзади стояла машина."
        source: { kind: authored }
  - id: rear
    ru: "тыл, задняя сторона; tyły — тылы"
    examples:
      - pl: "Uważaj na tyły."
        ru: "Береги тылы."
        source: { kind: translated, id: 12232701 }
      - pl: "Parking na tyłach szkoły jest prawie pusty."
        ru: "Парковка позади школы почти пуста."
        source: { kind: translated, id: 8178595 }
      - pl: "Wejście jest z tyłu budynku."
        ru: "Вход с задней стороны здания."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Наречные обороты: z tyłu «сзади», do tyłu «назад», w tył «назад», tyłem «задом наперёд»." }
  - { kind: usage, text: "Пара: tył «зад» — przód «перёд»; na tyłach czegoś значит «позади чего-то»." }
  - { kind: false-friend, text: "Не путайте с tyle «столько» — это другое слово: Zjedz tyle, ile chcesz «Ешь столько, сколько хочешь». Формы tył пишутся через ł." }
collocations:
  - { pl: "z tyłu", ru: "сзади" }
  - { pl: "do tyłu", ru: "назад" }
  - { pl: "na tyłach", ru: "позади" }
  - { pl: "tyłem do przodu", ru: "задом наперёд" }
etymology: "Праславянское *tylъ — то же слово, что русское «тыл»; отсюда же наречия z tyłu «сзади» и do tyłu «назад»."
memory: "tył — «зад, задняя часть», а «тылы» в военном смысле — tyły. Наречия: z tyłu «сзади», do tyłu «назад». Не путайте с tyle «столько»."
idioms:
  - { pl: "zostać w tyle", ru: "остаться позади" }
  - { pl: "iść tyłem", ru: "идти задом наперёд" }
  - { pl: "być do tyłu", ru: "отставать" }
formExamplesSkip:
  - { form: "tyle", reason: "форма слова tyle «столько» — другого слова, попавшего в этот список" }
