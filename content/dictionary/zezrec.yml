# review
id: zezrec
format: 2
lemma: "zeżreć"
rank: 5914
pos: verb
aspect: perf
pron: { cyr: "зэ́жрэць" }
senses:
  - id: devour
    ru: "сожрать (о животных)"
    examples:
      - pl: "Pies zeżarł moje buty."
        ru: "Пёс сожрал мои ботинки."
        source: { kind: translated, id: 6405902 }
      - pl: "Koza zeżarła mi kwiaty w ogrodzie."
        ru: "Коза сожрала мне цветы в саду."
        source: { kind: authored }
  - id: gobble
    ru: "разг., грубовато — сожрать, слопать (о людях)"
    examples:
      - pl: "Kto zeżarł mój jogurt z lodówki?"
        ru: "Кто сожрал мой йогурт из холодильника?"
        source: { kind: authored }
      - pl: "Zeżarłam całą paczkę chipsów."
        ru: "Я сожрала целую пачку чипсов."
        source: { kind: authored }
  - id: consume
    ru: "съесть, разъесть, поглотить (о ржавчине, моли, расходах, чувствах)"
    examples:
      - pl: "Remont zeżarł wszystkie nasze oszczędności."
        ru: "Ремонт сожрал все наши сбережения."
        source: { kind: authored }
      - pl: "Rdza zżarła stary samochód."
        ru: "Ржавчина съела старую машину."
        source: { kind: authored }
      - pl: "Mole zeżarły mój wełniany sweter."
        ru: "Моль сожрала мой шерстяной свитер."
        source: { kind: authored }
notes:
  - { kind: register, text: "О животных — обычное разговорное слово: PIES ZEŻARŁ BUTY «пёс сожрал ботинки». О людях — грубовато, как русское «сожрать, слопать». Нейтрально — ZJEŚĆ. В переносном смысле — «съесть, разъесть»: о ржавчине, моли, деньгах, чувствах." }
  - { kind: usage, text: "Совершенный вид к ŻREĆ «жрать». Спряжение неправильное: ZEŻRĘ, ZEŻRESZ, ZEŻRE, ZEŻRĄ — это будущее время «сожру, сожрёшь». В прошедшем E меняется на A: ZEŻARŁ, ZEŻARŁA, ZEŻARLI. Повелительное — ZEŻRYJ." }
  - { kind: usage, text: "У прошедшего времени и причастий есть вариант без E: ZŻARŁ, ZŻARŁA, ZŻARTY — от него же несовершенный ZŻERAĆ «разъедать, снедать». Его чаще берут для переносного смысла: RDZA ZŻARŁA KAROSERIĘ «ржавчина съела кузов», ZŻARŁA GO ZAZDROŚĆ «его съела зависть»." }
  - { kind: government, text: "Что — винительный: ZEŻREĆ OBIAD, ZEŻREĆ BUTY. Кого-то в переносном смысле — тоже винительный: SZEF MNIE ZEŻRE «начальник меня сожрёт». Чем изъедено — PRZEZ + винительный: ZEŻARTY PRZEZ MOLE." }
collocations:
  - { pl: "zeżreć obiad", ru: "сожрать обед" }
  - { pl: "zeżarty przez mole", ru: "изъеденный молью" }
  - { pl: "zżarty przez rdzę", ru: "съеденный ржавчиной" }
  - { pl: "zeżreć oszczędności", ru: "съесть сбережения" }
family:
  - { pl: "żreć", ru: "жрать", relation: aspect }
  - { pl: "zżerać", ru: "разъедать, снедать", relation: root }
  - { pl: "żarcie", ru: "жратва, еда (разг.)", relation: derived }
  - { pl: "żarłok", ru: "обжора", relation: derived }
etymology: "Приставка ZE- и ŻREĆ «жрать», праславянское *žerti; русские «жрать», «сожрать», «жерло» — того же корня."
memory: "Zeżreć — «сожрать»: Ż = Ж, и слово звучит почти по-русски — ZEŻRĘ «сожру»."
idioms:
  - { pl: "zżarła go zazdrość", ru: "его съела зависть" }
  - { pl: "zeżreć kogoś żywcem", ru: "сожрать кого-то заживо" }
