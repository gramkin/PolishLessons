etymology: "Из праславянского *nora, от глагола *nerti «нырять, проникать вглубь» — то же самое слово, что русская «нора». Из того же гнезда выросли польские nurek «ныряльщик» и nurt «течение», а у нас «нырять» и «нора» тоже оказались роднёй. Общая мысль простая: нора — это то, куда вныривают в землю."
memory: "Предложный — w NORZE, с rz, как w teatrze. Переносное значение то же, что у нас: нора как убогое жильё."
