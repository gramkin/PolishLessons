notes:
  - { kind: pronunciation, text: "Дательный и предложный — NORZE, с переходом r в rz. Это та же мена, что в teatr — w teatrze и rower — na rowerze, только здесь она попадает на женский род. Русское «в норе» звук сохраняет, поэтому форму приходится запоминать отдельно." }
  - { kind: usage, text: "Как и у нас, слово работает в переносном смысле о жилье: nora — это тесная, тёмная, запущенная квартира, и звучит это пренебрежительно. Zaszyć się w norze значит «забиться в нору», спрятаться от людей. Образ совпадает с русским полностью, так что переносное значение учить отдельно не нужно." }
collocations:
