# review
id: raport
format: 2
lemma: "raport"
rank: 898
pos: noun
pron: { cyr: "ра́порт" }
senses:
  - id: report
    ru: "отчёт, доклад, рапорт"
    examples:
      - pl: "On napisał raport."
        ru: "Он написал отчёт."
        source: { kind: translated, id: 567002 }
      - pl: "Czytałeś mój raport?"
        ru: "Ты читал мой отчёт?"
        source: { kind: translated, id: 4258126 }
      - pl: "Słyszałam raport."
        ru: "Я слышала доклад."
        source: { kind: translated, id: 4258125 }
  - id: about-report
    ru: "о содержании и точности отчёта"
    examples:
      - pl: "Wątpię w dokładność tego raportu."
        ru: "Я сомневаюсь в точности этого отчёта."
        source: { kind: translated, id: 7610525 }
      - pl: "Ma pan pewność co do tego raportu?"
        ru: "Вы уверены в этом отчёте?"
        source: { kind: translated, id: 903320 }
      - pl: "Zrób kopię tego raportu."
        ru: "Сделай копию этого отчёта."
        source: { kind: translated, id: 6385799 }
  - id: writing
    ru: "о составлении отчётов"
    examples:
      - pl: "Jest zajęta pisaniem raportów."
        ru: "Она занята написанием отчётов."
        source: { kind: translated, id: 575392 }
      - pl: "Musimy oddać raporty w poniedziałek."
        ru: "Мы должны сдать отчёты в понедельник."
        source: { kind: translated, id: 2517027 }
      - pl: "Musimy oddać nasze raporty do dzisiaj."
        ru: "Мы должны сдать наши отчёты сегодня."
        source: { kind: translated, id: 2517009 }
notes:
  - { kind: false-friend, text: "По-русски «рапорт» звучит по-военному и узко, а польское raport — это любой отчёт или доклад: raport roczny «годовой отчёт», raport z badań «отчёт об исследованиях». Переводить его надо чаще всего как «отчёт»." }
  - { kind: government, text: "pisać raport «писать отчёт» — винительный; raport Z czegoś «отчёт о чём-то» — родительный после z: raport z testów." }
  - { kind: usage, text: "Глагол — raportować «докладывать». Близкое по смыслу sprawozdanie тоже значит «отчёт», но звучит официальнее." }
  - { kind: pronunciation, text: "Ударение на первом слоге: RA-port, как и в русском." }
collocations:
  - { pl: "napisać raport", ru: "написать отчёт" }
  - { pl: "raport roczny", ru: "годовой отчёт" }
  - { pl: "raport z badań", ru: "отчёт об исследованиях" }
  - { pl: "oddać raport", ru: "сдать отчёт" }
family:
  - { pl: "raportować", ru: "докладывать", relation: derived }
etymology: "Через французское rapport «донесение, отношение», от rapporter «приносить обратно». Русское «рапорт» — то же заимствование, но в русском оно осталось военным, а в польском стало любым отчётом."
memory: "raport — это «отчёт», а не только военный «рапорт». По-польски так называют и годовой отчёт фирмы, и отчёт об исследованиях: raport roczny, raport z badań. Глагол — raportować."
idioms:
  - { pl: "napisać raport", ru: "написать отчёт" }
  - { pl: "raport roczny", ru: "годовой отчёт" }
  - { pl: "oddać raport", ru: "сдать отчёт" }
