# review
id: przekazywac
format: 2
lemma: "przekazywać"
rank: 3758
pos: verb
pron: { cyr: "пшэказы́ваць" }
senses:
  - id: pass-on
    ru: "передавать (сообщение, привет, знания)"
    examples:
      - pl: "Przekazuj pozdrowienia rodzicom!"
        ru: "Передавай привет родителям!"
        source: { kind: authored }
      - pl: "Babcia przekazuje nam rodzinne przepisy."
        ru: "Бабушка передаёт нам семейные рецепты."
        source: { kind: authored }
      - pl: "Radio przekazuje najnowsze wiadomości."
        ru: "Радио передаёт последние новости."
        source: { kind: authored }
  - id: transfer
    ru: "переводить (деньги), передавать (собственность, дела)"
    examples:
      - pl: "Co miesiąc przekazuje pieniądze na fundację."
        ru: "Каждый месяц он переводит деньги в фонд."
        source: { kind: authored }
      - pl: "Dyrektor przekazuje obowiązki zastępcy."
        ru: "Директор передаёт обязанности заместителю."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "PRZEKAZYWAĆ — «передавать», а не «пересказывать» (OPOWIADAĆ, STRESZCZAĆ) и не «приказывать» (ROZKAZYWAĆ). Типичная формула — PRZEKAŻ POZDROWIENIA «передай привет». Денежный перевод — PRZELEW, почтовый — PRZEKAZ." }
  - { kind: usage, text: "Несовершенный вид; совершенный — PRZEKAZAĆ. Спряжение на -UJĘ: PRZEKAZUJĘ, PRZEKAZUJESZ, PRZEKAZUJĄ. Отглагольное PRZEKAZYWANIE — «передача»." }
  - { kind: government, text: "Что — винительный, кому — дательный: PRZEKAZYWAĆ KOMUŚ WIADOMOŚĆ. Куда, на что — NA с винительным: PRZEKAZYWAĆ NA CELE CHARYTATYWNE. Из поколения в поколение — Z POKOLENIA NA POKOLENIE." }
  - { kind: pronunciation, text: "Читается «пшэказы́ваць»: PRZ — «пш», Y — «ы». Ударение на предпоследнем слоге. PRZEKAZUJĘ — «пшэказу́е»." }
  - { kind: register, text: "Нейтральное слово. Официальное — PRZEKAZYWAĆ DOKUMENTY «передавать документы»; бытовое — PRZEKAZYWAĆ POZDROWIENIA." }
collocations:
  - { pl: "przekazywać pozdrowienia", ru: "передавать привет" }
  - { pl: "przekazywać wiedzę", ru: "передавать знания" }
  - { pl: "z pokolenia na pokolenie", ru: "из поколения в поколение" }
family:
  - { pl: "przekazać", ru: "передать", relation: aspect, id: przekazac }
  - { pl: "przekaz", ru: "перевод, послание", relation: derived, id: przekaz }
  - { pl: "podawać", ru: "подавать, передавать", relation: root, id: podawac }
etymology: "Приставка PRZE- «пере-» плюс KAZYWAĆ, многократное от KAZAĆ «велеть, указывать». Буквально «переуказывать», затем «передавать дальше»."
memory: "Przekazywać — передавать: przekazuj pozdrowienia! Не «пересказывать»! Przekaz — перевод, послание."
idioms:
  - { pl: "przekazywać z pokolenia na pokolenie", ru: "передавать из поколения в поколение" }
