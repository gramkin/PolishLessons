notes:
  - { kind: false-friend, text: "MANNA — «манна» и «манная крупа». Манная каша — KASZA MANNA или просто MANNA: здесь MANNA стоит после KASZA как прилагательное. MANNA Z NIEBA — «манна небесная», неожиданная удача." }
  - { kind: usage, text: "Женский род. Учим единственное: MANNA, MANNY, MANNIE, MANNĘ, MANNĄ. В местном NN смягчается: W MANNIE." }
  - { kind: government, text: "Как манна небесная — JAK MANNA Z NIEBA. Манная каша на молоке — KASZA MANNA NA MLEKU. Ждать манны небесной — CZEKAĆ NA MANNĘ Z NIEBA." }
  - { kind: pronunciation, text: "Читается «ма́нна»: двойное NN звучит долго. Ударение на первом слоге." }
