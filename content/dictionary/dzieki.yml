# review
id: dzieki
format: 2
lemma: "dzięki"
rank: 133
pos: prep
pron: { cyr: "дзе́нки" }
senses:
  - id: thanks
    ru: "спасибо (разговорное)"
    note: "Вежливая форма — dziękuję; dzięki звучит по-приятельски."
    examples:
      - pl: "Dzięki!"
        ru: "Спасибо!"
        source: { kind: tatoeba, id: 3452307 }
      - pl: "Dzięki za jedzenie!"
        ru: "Спасибо за еду!"
        source: { kind: tatoeba, id: 2151427 }
      - pl: "Dzięki za kubek kawy."
        ru: "Спасибо за чашку кофе."
        source: { kind: tatoeba, id: 13784841 }
  - id: thanks-to
    ru: "благодаря (+ дательный падеж)"
    examples:
      - pl: "Jestem tu dzięki niej."
        ru: "Я здесь из-за неё."
        source: { kind: tatoeba, id: 13547137 }
      - pl: "Dzięki Bogu, że jestem ateistą."
        ru: "Слава богу, я атеист."
        source: { kind: tatoeba, id: 10481373 }
      - pl: "Dzięki tobie zdałem egzamin."
        ru: "Благодаря тебе я сдал экзамен."
        source: { kind: authored }
notes:
  - { kind: government, text: "Как предлог dzięki требует дательного падежа — как русское «благодаря»: dzięki tobie, dzięki niej, dzięki pomocy." }
  - { kind: usage, text: "dzięki говорят только о хорошем результате. О причине неприятности — przez: Przez ciebie się spóźniłem «Из-за тебя я опоздал»." }
  - { kind: register, text: "dzięki — разговорное «спасибо» между своими; в официальной обстановке — dziękuję или dziękuję bardzo." }
collocations:
  - { pl: "dzięki za pomoc", ru: "спасибо за помощь" }
  - { pl: "dzięki tobie", ru: "благодаря тебе" }
  - { pl: "wielkie dzięki", ru: "большое спасибо" }
etymology: "Заимствование через чешское díky из древневерхненемецкого denken/danken «благодарить»; русское «спасибо» («спаси бог») образовано совсем иначе."
memory: "Разговорное «спасибо» — dzięki, вежливое — dziękuję. Как предлог dzięki значит «благодаря» и требует дательного: dzięki tobie. Но о плохом говорят przez: przez ciebie «из-за тебя»."
idioms:
  - { pl: "dzięki Bogu!", ru: "слава богу!" }
  - { pl: "wielkie dzięki", ru: "большое спасибо" }
  - { pl: "dzięki z góry", ru: "заранее спасибо" }
