    ru: "Я не хочу, чтобы меня больше обходили."
    source: { kind: translated, id: 967072 }
  - form: "pomijany"
    pl: "Ten temat bywa pomijany w szkole."
    ru: "Эту тему в школе часто обходят."
    source: { kind: authored }
  - form: "pomijany"
    pl: "Czuł się pomijany przez kolegów."
    ru: "Он чувствовал, что товарищи его обходят."
    source: { kind: authored }
  - form: "pomijanych"
    pl: "Nie ma tu pomijanych spraw."
    ru: "Здесь нет обойдённых дел."
    source: { kind: authored }
  - form: "pomijanych"
    pl: "Wśród pomijanych pracowników był i on."
    ru: "Среди обойдённых работников был и он."
    source: { kind: authored }
  - form: "pomijanych"
    pl: "Od pomijanych szczegółów zależy całość."
    ru: "От опускаемых подробностей зависит целое."
    source: { kind: authored }
  - form: "pomijanym"
    pl: "W pomijanym rozdziale kryje się sedno."
    ru: "В пропускаемой главе кроется суть."
    source: { kind: authored }
  - form: "pomijanym"
    pl: "Pomijanym pracownikom należą się przeprosiny."
    ru: "Обойдённым работникам полагаются извинения."
    source: { kind: authored }
  - form: "pomijanym"
    pl: "Z pomijanym dotąd źródłem praca jest pełniejsza."
    ru: "С источником, который до сих пор пропускали, работа полнее."
    source: { kind: authored }
  - form: "pomijanymi"
    pl: "Między uwzględnianymi a pomijanymi danymi jest różnica."
    ru: "Между учитываемыми и опускаемыми данными есть разница."
    source: { kind: authored }
  - form: "pomijanymi"
    pl: "Zajmuje się pomijanymi dotąd źródłami."
    ru: "Он занимается источниками, которые до сих пор пропускали."
    source: { kind: authored }
  - form: "pomijanymi"
    pl: "Rozmawiał z pomijanymi przy awansach pracownikami."
    ru: "Он говорил с работниками, обойдёнными при повышениях."
    source: { kind: authored }
