# review
id: pomijac
format: 2
lemma: "pomijać"
rank: 2319
pos: verb
aspect: imperf
pron: { cyr: "поми́яць" }
senses:
  - id: skip
    ru: "пропускать, опускать"
    examples:
      - pl: "Tom zazwyczaj pomija śniadanie."
        ru: "Том обычно пропускает завтрак."
        source: { kind: translated, id: 10640270 }
      - pl: "Nie chcemy pomijać faktów."
        ru: "Мы не хотим замалчивать факты."
        source: { kind: translated, id: 4241892 }
      - pl: "Nie chcę być już więcej pomijany."
        ru: "Я не хочу, чтобы меня больше обходили."
        source: { kind: translated, id: 967072 }
  - id: apart-from
    ru: "не считая, если не считать (pomijając)"
    examples:
      - pl: "Pomijając kilka usterek, ta książka jest interesująca."
        ru: "Если не считать нескольких недочётов, книга интересная."
        source: { kind: translated, id: 366949 }
      - pl: "A pomijając żarty, co chcesz powiedzieć?"
        ru: "А если без шуток, что ты хочешь сказать?"
        source: { kind: translated, id: 366531 }
notes:
  - { kind: usage, text: "Деепричастие pomijając «не считая, помимо» стало самостоятельным предлогом: pomijając koszty «не считая расходов». Дополнение в винительном падеже." }
  - { kind: government, text: "Винительный падеж: pomijać fakty, pomijać śniadanie." }
  - { kind: false-friend, text: "От mijać «миновать, проходить мимо». Русское «поминать» тут ни при чём, несмотря на звуковое сходство." }
  - { kind: usage, text: "Причастие pomijany значит «обойдённый, замалчиваемый». Совершенный вид — pominąć." }
collocations:
  - { pl: "pomijając coś", ru: "не считая чего-л." }
  - { pl: "pomijać fakty", ru: "замалчивать факты" }
etymology: "po- + mijać «миновать»; ср. русское «миновать», «мимо»."
memory: "pomijać — «пропускать, опускать». Запомните pomijając coś «не считая чего-л.» — деепричастие стало предлогом. Совершенный вид — pominąć."
idioms:
  - { pl: "pomijając coś", ru: "не считая чего-л." }
