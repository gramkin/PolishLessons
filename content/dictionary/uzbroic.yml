notes:
  - { kind: government, text: "ВООРУЖАЮТ ЧЕМ-ТО ЧЕРЕЗ W С ВИНИТЕЛЬНЫМ. Русский ставит творительный без предлога — «вооружить отряд винтовками», — а поляк говорит uzbroić oddział W karabiny. Та же схема в самом частом обороте: UZBROIĆ SIĘ W CIERPLIWOŚĆ «вооружиться терпением». Творительный падеж здесь будет ошибкой, предлог w обязателен." }
  - { kind: false-friend, text: "BROŃ — ЭТО «ОРУЖИЕ», А НЕ «БРОНЯ». Броня по-польски PANCERZ. Корень общий: праславянское *bor- «бороться» дало и русскую «оборону», и польское bronić «защищать», но само имя разошлось — у нас оно ушло в защиту, у поляков в нападение. Рядом стоит ещё одна разошедшаяся пара: польское ZBROJA «доспехи» и русская «сбруя» — это одно и то же слово, только у нас оно перешло с воина на лошадь." }
  - { kind: usage, text: "Основа меняет облик трижды: инфинитив UZBROIĆ, будущее UZBROJĘ, UZBROI, повелительное UZBRÓJ с ó, а причастие и существительное — UZBROJONY, UZBROJENIE, уже с j. Вид совершенный, поэтому uzbroję значит «вооружу», а не «вооружаю»; несовершенная пара — UZBRAJAĆ. Отдельно запомни технический смысл: UZBROJENIE TERENU — это инженерные сети на участке, вода и электричество, а вовсе не оружие." }
