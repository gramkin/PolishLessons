etymology: "Приставка u- и broić от broń «оружие», из праславянского *bor- «бороться» — того же корня, что русские «бороться», «оборона», «борьба». Любопытно, куда разошлось производное имя: русская «броня» осталась защитой, а польское broń стало оружием нападения. И ещё одна пара из того же гнезда: польское zbroja «доспехи» и русская «сбруя» — одно слово, разъехавшееся с человека на коня."
memory: "uzbroić kogoś W coś — предлог w и винительный, а не творительный: uzbroić się w cierpliwość «вооружиться терпением». И помни, что broń — это «оружие»; «броня» будет pancerz."
