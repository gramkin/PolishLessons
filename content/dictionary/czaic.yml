# review
id: czaic
format: 2
lemma: "czaić"
rank: 3984
pos: verb
pron: { cyr: "ча́иць" }
senses:
  - id: lurk
    ru: "таиться, подстерегать (с się)"
    examples:
      - pl: "Kot czai się w trawie."
        ru: "Кот таится в траве."
        source: { kind: authored }
      - pl: "Niebezpieczeństwo czai się za zakrętem."
        ru: "Опасность таится за поворотом."
        source: { kind: authored }
  - id: understand-slang
    ru: "разг. понимать, соображать (без się)"
    examples:
      - pl: "Czaisz, o co chodzi?"
        ru: "Понимаешь, в чём дело?"
        source: { kind: authored }
      - pl: "Starsi nie czają tego slangu."
        ru: "Старшие не понимают этого сленга."
        source: { kind: authored }
  - id: hesitate
    ru: "медлить, тянуть (с чем-либо)"
    examples:
      - pl: "Czaiłam się z odpowiedzią do końca."
        ru: "Я медлила с ответом до конца."
        source: { kind: authored }
      - pl: "Czailiśmy się długo z decyzją."
        ru: "Мы долго медлили с решением."
        source: { kind: authored }
notes:
  - { kind: government, text: "Несовершенный вид. В значении «таиться» — только с się: kot czai się w trawie. В разговорном «понимать» — переходный, без się: czaisz to?" }
  - { kind: register, text: "Значение «понимать» — молодёжный сленг. В нейтральной речи говорят rozumieć, а разговорно — kapować." }
  - { kind: usage, text: "Совершенный вид к «таиться» — zaczaić się; отглагольное существительное czajenie «таение, выжидание»." }
  - { kind: false-friend, text: "Корень тот же, что у русского «чаять»: праславянское *čajati «ожидать». В русском он остался в «нечаянно» и «чаяние», а польский развил его в «выжидать в укрытии, таиться»." }
collocations:
  - { pl: "czaić się w trawie", ru: "таиться в траве" }
  - { pl: "czaić się za węgłem", ru: "таиться за углом" }
  - { pl: "czaisz?", ru: "сечёшь?, врубаешься?" }
family:
  - { pl: "zaczaić się", ru: "подстеречь, устроить засаду", relation: aspect }
  - { pl: "czajenie", ru: "таение, выжидание", relation: derived }
etymology: "Праславянское *čajati «ожидать, надеяться». В русском тот же корень живёт в «чаять», «нечаянно» и «чаяние»; польский развил его в «выжидать в укрытии, таиться»."
memory: "czaić się — «таиться, подстерегать», от того же корня, что русское «чаять». Без się и в сленге czaić значит «понимать»: czaisz?"
idioms:
  - { pl: "czaić się jak kot", ru: "таиться как кот" }
  - { pl: "czaisz?", ru: "сечёшь?, врубаешься?" }
