# review
id: proces
format: 2
lemma: "proces"
rank: 1073
pos: noun
pron: { cyr: "про́цэс" }
senses:
  - id: process
    ru: "процесс, ход событий"
    examples:
      - pl: "Ten proces nie jest otwarty dla publiczności."
        ru: "Этот процесс не является открытым для общественности."
        source: { kind: tatoeba, id: 356517 }
      - pl: "To powolny proces."
        ru: "Это медленный процесс."
        source: { kind: translated, id: 10667886 }
      - pl: "To jest złożony proces."
        ru: "Это сложный процесс."
        source: { kind: translated, id: 5961870 }
  - id: trial
    ru: "судебный процесс, дело"
    examples:
      - pl: "Jestem oskarżycielem w tym procesie."
        ru: "Я обвинитель в этом процессе."
        source: { kind: translated, id: 3382415 }
      - pl: "Zawieszenie procesu jest niemożliwe."
        ru: "Приостановить процесс невозможно."
        source: { kind: translated, id: 904537 }
  - id: computing
    ru: "процесс (в информатике)"
    examples:
      - pl: "W tle działa wiele procesów."
        ru: "В фоне работает много процессов."
        source: { kind: authored }
      - pl: "Wszystkie procesy zostały zatrzymane."
        ru: "Все процессы были остановлены."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Мужской род неодушевлённый: ten proces, tego procesu." }
  - { kind: usage, text: "Второе значение — судебное: proces sądowy «судебный процесс», wytoczyć komuś proces «подать на кого-то в суд»." }
  - { kind: government, text: "w procesie czegoś «в процессе чего-то» — предложный падеж, как в русском: w procesie produkcji." }
  - { kind: usage, text: "Родственное procesor значит «процессор», а proces в информатике — запущенная программа, ровно как в русском." }
collocations:
  - { pl: "proces sądowy", ru: "судебный процесс" }
  - { pl: "w procesie", ru: "в процессе" }
  - { pl: "wytoczyć proces", ru: "подать в суд" }
family:
  - { pl: "procesowy", ru: "процессуальный", relation: derived }
  - { pl: "procesor", ru: "процессор", relation: derived }
etymology: "Из латинского processus «продвижение, ход» от procedere «идти вперёд». Русский «процесс» — то же заимствование."
memory: "proces — «процесс» во всех смыслах, включая судебный: wytoczyć komuś proces значит «подать на кого-то в суд». Мужской род, родительный procesu."
idioms:
