# review
id: natrafic
format: 2
lemma: "natrafić"
rank: 6041
pos: verb
aspect: perf
pron: { cyr: "натра́фиць" }
senses:
  - id: come-across
    ru: "наткнуться, набрести (на кого-л., что-л.), случайно найти"
    note: "natrafić na kogoś / na coś — предлог na с винительным, как в русском «наткнуться на»."
    examples:
      - pl: "Natrafił w szafie na kilka starych dokumentów."
        ru: "В шкафу он наткнулся на несколько старых документов."
        source: { kind: translated, id: 551807 }
      - pl: "Wracając do domu, natrafiłem na martwą kunę, leżącą na środku chodnika."
        ru: "По пути домой я наткнулся на мёртвую куницу, лежащую посреди тротуара."
        source: { kind: tatoeba, id: 12471289 }
      - pl: "Udało mi się natrafić na rower porzucony na skraju drogi."
        ru: "Мне удалось наткнуться на велосипед, брошенный на обочине дороги."
        source: { kind: translated, id: 1473343 }
  - id: run-into
    ru: "столкнуться, натолкнуться (на трудность, сопротивление)"
    examples:
      - pl: "Natrafiliśmy na przeszkodę, ale udało nam się ją obejść."
        ru: "Мы наткнулись на препятствие, но сумели его обойти."
        source: { kind: translated, id: 13654150 }
      - pl: "Reforma natrafiła na silny opór."
        ru: "Реформа встретила сильное сопротивление."
        source: { kind: authored }
      - pl: "Śledczy natrafili na mur milczenia."
        ru: "Следователи натолкнулись на стену молчания."
        source: { kind: authored }
  - id: discover
    ru: "напасть (на след), обнаружить (при поисках, раскопках)"
    examples:
      - pl: "Policja natrafiła na ślad złodzieja."
        ru: "Полиция напала на след вора."
        source: { kind: authored }
      - pl: "Archeolodzy natrafili na rzymskie monety."
        ru: "Археологи обнаружили римские монеты."
        source: { kind: authored }
      - pl: "Podczas budowy natrafiono na szczątki."
        ru: "Во время строительства обнаружили останки."
        source: { kind: authored }
notes:
  - { kind: government, text: "NATRAFIĆ NA + винительный, как русское «наткнуться на»: natrafić na problem, natrafić na ślad. Предлог обязателен — в отличие от синонима NAPOTKAĆ, который берёт винительный без предлога: napotkać trudności, но natrafić na trudności." }
  - { kind: usage, text: "Совершенный вид: natrafię, natrafisz, natrafi — будущее время «наткнусь, наткнёшься». Несовершенный — NATRAFIAĆ: natrafiam, natrafiasz «натыкаюсь, натыкаешься»." }
  - { kind: usage, text: "Глагол непереходный, страдательного причастия у него нет. «Обнаружили» без деятеля — безличная форма NATRAFIONO: natrafiono na skarb «нашли клад». От TRAFIĆ NA он отличается оттенком: trafić na kogoś — «попасть на кого-то, застать», natrafić — именно случайная находка или препятствие." }
  - { kind: pronunciation, text: "Читается «натра́фиць»: ударение на предпоследнем слоге, конечное Ć — мягкое «ць». NATRAFIŁ — «натра́фиу», Ł читается как «у»." }
collocations:
  - { pl: "natrafić na ślad", ru: "напасть на след" }
  - { pl: "natrafić na opór", ru: "встретить сопротивление" }
  - { pl: "natrafić na trudności", ru: "столкнуться с трудностями" }
  - { pl: "natrafić na przeszkodę", ru: "наткнуться на препятствие" }
family:
  - { pl: "trafić", ru: "попасть", relation: root, id: trafic }
  - { pl: "natrafiać", ru: "натыкаться", relation: aspect }
  - { pl: "natrafienie", ru: "находка, обнаружение", relation: derived }
synonyms: ["napotkać", "natknąć się"]
etymology: "Приставка NA- и TRAFIĆ «попасть», заимствованное из средневерхненемецкого treffen «попасть, встретить». Буквально — «попасть на что-то»."
memory: "natrafić na — «наткнуться на»: и приставка NA-, и предлог NA совпадают с русскими, падеж тот же — винительный. Корень TRAFIĆ «попасть» немецкий (treffen), но сочетание собирается как русское: natrafić na ślad «напасть на след», natrafić na opór «натолкнуться на сопротивление»."
idioms:
  - { pl: "natrafić na ślad", ru: "напасть на след" }
  - { pl: "natrafić na żyłę złota", ru: "напасть на золотую жилу" }
  - { pl: "natrafić na mur", ru: "упереться в стену (встретить глухое сопротивление)" }
