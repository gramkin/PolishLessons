etymology: "От URAZIĆ «задеть, ранить», из приставки U- и корня RAZ-, того же, что в русских «разить», «поразить», «раз» и «образ». Исходный смысл — удар, и от него оба языка пошли в переносную сторону, но по-разному. Польский от одного корня произвёл и телесную травму URAZ, и душевную обиду URAZA, оставив их рядом. Русский для первой взял греческую «травму», а вторую назвал «обидой», от «обидеть», то есть от совсем другого глагола."
memory: "Одна буква решает: uraz, мужского рода, это «травма», а uraza, женского, это «обида». Оба от urazić «задеть», корень тот же, что в русском «разить». Польский держит телесное и душевное на одном корне, русский развёл их по разным словам. Управление расходится: uraza do kogoś, предлог do с родительным, где русский говорит «обида на кого-то». Частая реплика: bez urazy."
idioms:
  - { pl: "bez urazy", ru: "без обид" }
