notes:
  - { kind: false-friend, text: "Одна буква отделяет два разных слова, и оба частые. URAZ, мужского рода, это «травма»: URAZ GŁOWY, URAZ KRĘGOSŁUPA. URAZA, женского рода, это «обида»: MIEĆ URAZĘ DO KOGOŚ. Оба идут от URAZIĆ «задеть, ранить», и корень тот же, что в русских «разить» и «поразить». Русский развёл эти смыслы по далёким друг от друга словам, «травма» и «обида», и связи между ними уже не видит." }
  - { kind: usage, text: "Десять форм, женский род. В местном падеже единственного числа Z смягчается: URAZA, но W URAZIE. Родительный множественного URAZ совпадает по виду с именительным единственного слова URAZ «травма», так что BEZ URAZ может значить и «без обид», и «без травм»: различает только контекст. Второе значение чаще во множественном: DAWNE URAZY." }
  - { kind: government, text: "Обида на кого-либо — URAZA DO KOGOŚ, предлог DO с родительным, тогда как русский говорит «обида на кого-то», с предлогом «на» и винительным. Это расхождение стоит запомнить: MAM DO NIEGO URAZĘ значит «я на него обижен». Таить обиду — CHOWAĆ URAZĘ или ŻYWIĆ URAZĘ, винительный без предлога. Без обид — BEZ URAZY, предлог BEZ с родительным." }
  - { kind: pronunciation, text: "Читается «ура́за», три слога, ударение на втором. Все звуки простые, буква Z даёт обычное «з». В местном падеже URAZIE сочетание ZIE даёт мягкое «зе», и слышно «ура́зе». В родственном URAZ конечное Z оглушается до «с»: «урас». В глаголе URAZIĆ конечное Ć даёт мягкое «ць»: «ура́зиць»." }
  - { kind: register, text: "Слово нейтральное, из языка чувств и семейных разговоров: MIEĆ URAZĘ, DAWNE URAZY, URAZA DO OJCA. Самый частый оборот короткий и разговорный: BEZ URAZY, которое говорят, смягчая резкость, ровно как русское «без обид». Он стоит обычно в начале фразы: BEZ URAZY, ALE SIĘ MYLISZ. В психологии и терапии слово звучит часто и без всякой эмоции." }
