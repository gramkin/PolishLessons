  - { pl: "kurczak", ru: "курица (как еда), цыплёнок", relation: derived, id: kurczak }
  - { pl: "kogut", ru: "петух", relation: root }
etymology: "От KURA «курица», общеславянского *kura, с уменьшительным суффиксом детёнышей -Ę, тем же, что в CIELĘ, «телёнок», и в русском «-ёнок»: «цыплёнок», «телёнок». Восклицание KURCZĘ! появилось как эвфемизм грубого слова на ту же первую букву."
memory: "Kurczę — цыплёнок: kurczęta, kurcząt. Склоняется как dziecko-zwierzę: kurczęcia. И разговорное «блин!»: Kurczę, zapomniałem! Kurczę blade — ёлки-палки. Читается «ку́рчэ»."
idioms:
  - { pl: "kurczę blade", ru: "ёлки-палки, ёлы-палы" }
