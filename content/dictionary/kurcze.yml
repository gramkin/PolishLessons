notes:
  - { kind: false-friend, text: "Русскому «курча» ничего не говорит, но корень знаком: KURA, «курица». KURCZĘ — «цыплёнок», и это слово среднего рода с особым склонением, как DZIECKO и ZWIERZĘ: KURCZĘ, KURCZĘCIA, KURCZĘTA. А в разговоре KURCZĘ! — эвфемизм ругательства, как русское «блин!»: звучит похоже на грубое слово, но им не является." }
  - { kind: usage, text: "Средний род, особый тип склонения на -Ę: в косвенных падежах единственного появляется -ĘCI-: KURCZĘCIA, KURCZĘCIU, во множественном -ĘT-: KURCZĘTA, KURCZĄT. Так же склоняются CIELĘ, «телёнок», ŹREBIĘ, «жеребёнок». В значении «блин» — только KURCZĘ, неизменяемое." }
  - { kind: government, text: "Цыплята кого-то — KURCZĘTA KWOKI, родительный. В кулинарии — KURCZĘ PIECZONE, «жареный цыплёнок», хотя в магазине и меню чаще KURCZAK. Падежных требований само существительное не имеет." }
  - { kind: pronunciation, text: "Читается «ку́рчэ», два слога, ударение на первом. Конечное Ę звучит как «э», почти без носового призвука. В KURCZĘCIA: «курчэ́нця», с носовым «эн» перед Ć." }
  - { kind: register, text: "В значении «цыплёнок» — нейтральное, деревенское, детское. KURCZAK, «курица как еда», вытеснил KURCZĘ в магазинах. В значении «блин!» — разговорное, вежливый заменитель ругательства, допустимо при детях. KURCZĘ BLADE — шутливое усиление, «ёлки-палки»." }
collocations:
  - { pl: "kurczę pieczone", ru: "жареный цыплёнок" }
  - { pl: "kurczę blade", ru: "ёлки-палки (разг.)" }
