id: teraz
format: 2
lemma: "teraz"
rank: 54
pos: adv
pron: { cyr: "тэ́рас" }
senses:
  - id: now
    ru: "сейчас, теперь"
    examples:
      - pl: "Teraz rozumiem."
        ru: "Теперь я понимаю."
        source: { kind: tatoeba, id: 1477778 }
      - pl: "Śpiewam teraz."
        ru: "Я сейчас пою."
        source: { kind: tatoeba, id: 9671455 }
      - pl: "Teraz pada śnieg."
        ru: "Сейчас идёт снег."
        source: { kind: tatoeba, id: 3051141 }
  - id: now-contrast
    ru: "теперь (в противопоставлении прошлому)"
    examples:
      - pl: "Tu i teraz."
        ru: "Здесь и сейчас."
        source: { kind: tatoeba, id: 3016061 }
      - pl: "Teraz albo nigdy."
        ru: "Сейчас или никогда."
        source: { kind: authored }
notes:
  - { kind: usage, text: "teraz — «сейчас, теперь». Если речь о ближайшем будущем («сейчас приду»), поляк скажет za chwilę или zaraz." }
collocations:
  - { pl: "od teraz", ru: "отныне" }
  - { pl: "do teraz", ru: "до сих пор" }
etymology: "Сращение ten + raz, буквально «этот раз»."
memory: "Буквально «этот раз»: ten + raz → teraz. Русское «теперь» устроено похоже, так что логика знакомая. «Сейчас (сию минуту)» — zaraz."
