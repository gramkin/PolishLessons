etymology: "От глагола PORYWAĆ, приставка PO- и корень *rъv-, тот же, что в русском «рвать» и «порыв». Исходное значение прямое и грубое: рвануть, выхватить, унести силой. От него пошли оба современных смысла — похищение человека и захват чувств, потому что и то и другое есть внезапное движение, которому нельзя противиться. Русский сохранил корень в «порыве» и «рывке», но существительного для похитителя из него не построил, взяв описательное «похититель» от «хитить». Суффикс -ACZ, которым образовано польское слово, отвечает русским -ТЕЛЬ и -ЩИК, а в чистом виде он виден в парах TKACZ и «ткач», TRĘBACZ и «трубач»."
memory: "Корень тот же, что в русском «порыве» и «рвать»: porywać значит «похищать», то есть рвануть к себе. Но у того же глагола есть и переносное значение «увлекать», и porywający film это «захватывающий фильм». С русским «порывать» (разрывать отношения) связи нет. Именительный множественного porywacze на -e, потому что основа на шипящий; рядом piraci смягчает t, liderzy меняет r на rz. Суффикс -acz как русское -тель: badacz, słuchacz."
