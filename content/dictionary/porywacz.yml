notes:
  - { kind: false-friend, text: "Корень обманывает дважды. Глагол PORYWAĆ значит «похищать, уводить силой» — а русское «порывать» значит «разрывать отношения», и это совсем другое. Но тот же польский глагол имеет и второе значение, переносное: PORYWAĆ значит «увлекать, захватывать», и причастие PORYWAJĄCY FILM переводится как «захватывающий фильм», а не «похищающий». Русский знает этот корень в слове «порыв» — внезапное движение души или ветра, — и именно через «порыв» легче всего связать оба польских значения: похитить значит рвануть к себе, увлечь значит рвануть за собой." }
  - { kind: usage, text: "Одиннадцать форм, мужской род, одушевлённое лицо. Именительный множественного — PORYWACZE, с окончанием -E: его берут основы на шипящий, и потому здесь нет ни смягчения, как в PIRACI, ни мены, как в LIDERZY. Родительных множественного два: современное PORYWACZY и старое PORYWACZÓW, оба правильны. Местный и звательный единственного — PORYWACZU. Суффикс -ACZ образует названия деятеля от глагола и очень продуктивен: BADACZ «исследователь», SŁUCHACZ «слушатель», ODKURZACZ «пылесос» — то есть и о людях, и о приборах." }
  - { kind: pronunciation, text: "Читается «поры́вач», три слога, ударение на втором. Буква Y даёт «ы», поэтому второй слог звучит «ры». Конечное CZ — твёрдое «ч». В форме PORYWACZA слышно «порыва́ча». В форме PORYWACZE звучит «порыва́че», а в форме PORYWACZY — «порыва́чы», с твёрдым «ы», потому что после шипящего польский всегда пишет и произносит Y. В форме PORYWACZÓW буква Ó читается как «у»: «порыва́чуф»." }
  - { kind: register, text: "Слово нейтральное и газетное, принадлежит языку уголовной хроники. Устойчивые сочетания: PORYWACZ SAMOLOTU, ŻĄDANIA PORYWACZY «требования похитителей», NEGOCJACJE Z PORYWACZAMI. Само преступление называется PORWANIE «похищение», а жертва — ZAKŁADNIK «заложник». Переносного употребления у слова нет, в отличие от глагола, который живёт и в высоком стиле: PORWAĆ TŁUM «увлечь толпу», PORYWAJĄCA MOWA «зажигательная речь». Женское соответствие PORYWACZKA существует, но встречается редко." }
