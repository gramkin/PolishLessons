      - pl: "Dzieci zbudowały fort z poduszek."
        ru: "Дети построили крепость из подушек."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "FORT — «форт», отдельное укрепление. Большая крепость — TWIERDZA, замок — ZAMEK. В Польше много фортов XIX века вокруг Кракова, Познани и Модлина." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Родительный — FORTU. В местном T переходит в C: W FORCIE." }
  - { kind: government, text: "В форте — W FORCIE, местный. Оборонять форт — BRONIĆ FORTU, родительный: BRONIĆ требует родительного." }
  - { kind: pronunciation, text: "Читается «форт», один слог. В местном FORCIE — «фо́рце»: CI — мягкое «ць», как в CICHO." }
collocations:
