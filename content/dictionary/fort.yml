        source: { kind: authored }
  - id: stronghold
    ru: "оплот, крепость (перен.)"
    examples:
      - pl: "Kuchnia to jej fort, nikt tam nie wchodzi."
        ru: "Кухня — её крепость, туда никто не заходит."
