notes:
  - { kind: usage, text: "Женский род, склоняется как kobieta: torba, torby, torbie, torbę, torbą." }
  - { kind: usage, text: "Родительный множественного — toreb, с беглым e: pięć toreb «пять сумок»." }
  - { kind: usage, text: "Второе значение — сумка у сумчатых животных: torba kangura «сумка кенгуру»." }
  - { kind: usage, text: "pójść z torbami значит «пойти по миру, разориться» — буквально «пойти с сумками». Русское «пойти с сумой» устроено так же." }
collocations:
  - { pl: "torba na zakupy", ru: "сумка для покупок" }
  - { pl: "w torbie", ru: "в сумке" }
  - { pl: "plastikowa torba", ru: "пластиковый пакет" }
  - { pl: "pójść z torbami", ru: "пойти по миру" }
family:
  - { pl: "torebka", ru: "сумочка; пакетик", relation: derived }
  - { pl: "torbacz", ru: "сумчатое животное", relation: derived }
etymology: "Из турецкого torba «мешок». Русская «торба» — то же заимствование, но у нас оно осталось областным, а в польском стало обычным словом для сумки."
memory: "torba — «сумка, пакет», женский род. Родительный множественного с беглым e: pięć toreb. А pójść z torbami значит «разориться», ровно как русское «пойти с сумой»."
idioms:
  - { pl: "torba na zakupy", ru: "сумка для покупок" }
  - { pl: "pójść z torbami", ru: "пойти по миру" }
formExamplesSkip:
  - { form: "torbach", reason: "в корпусе нет примеров: предложный падеж множественного числа у этого слова редок" }
  - { form: "torbo", reason: "звательный падеж у этого слова в живой речи не употребляется" }
