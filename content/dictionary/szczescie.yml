# review
id: szczescie
format: 2
lemma: "szczęście"
rank: 417
pos: noun
pron: { cyr: "шчэ́ньсьце" }
senses:
  - id: happiness
    ru: "счастье"
    examples:
      - pl: "Dążymy do szczęścia."
        ru: "Мы стремимся к счастью."
        source: { kind: tatoeba, id: 5559504 }
      - pl: "Szczęścia nie kupisz za pieniądze."
        ru: "Нельзя купить счастье."
        source: { kind: tatoeba, id: 352909 }
      - pl: "Masz dziwne wyobrażenie o szczęściu."
        ru: "У тебя странное представление о счастье."
        source: { kind: tatoeba, id: 6304064 }
  - id: luck
    ru: "удача, везение"
    examples:
      - pl: "Mary miała szczęście, że znalazła klucze."
        ru: "Мэри повезло, что она нашла свои ключи."
        source: { kind: tatoeba, id: 13830856 }
      - pl: "Na szczęście zdążyłem na czas."
        ru: "К счастью, я успел вовремя."
        source: { kind: tatoeba, id: 6328201 }
      - pl: "Idę teraz na egzamin, życzcie mi szczęścia."
        ru: "Иду сейчас на экзамен, пожелайте мне удачи."
        source: { kind: tatoeba, id: 12655218 }
notes:
  - { kind: usage, text: "Одно слово покрывает и «счастье», и «удачу». mieć szczęście значит «повезти»: Miała szczęście, że znalazła klucze «Ей повезло, что она нашла ключи»." }
  - { kind: usage, text: "na szczęście — «к счастью»; życzyć szczęścia — «желать удачи»: Życzcie mi szczęścia «Пожелайте мне удачи»." }
  - { kind: usage, text: "Родительный падеж множественного числа — szczęść, и в живой речи он уцелел почти только в приветствии Szczęść Boże! «Бог в помощь!»" }
  - { kind: false-friend, text: "Русское «счастье» — то же самое слово: sъ- «с» плюс część «часть, доля». Счастливый — тот, кому досталась своя доля." }
collocations:
  - { pl: "mieć szczęście", ru: "повезти" }
  - { pl: "na szczęście", ru: "к счастью" }
  - { pl: "życzyć szczęścia", ru: "желать удачи" }
  - { pl: "szczęść Boże", ru: "Бог в помощь" }
etymology: "Праславянское *sъčęstьje: sъ- «с» плюс *čęstь «часть, доля». Русское «счастье» собрано точно так же, а польское szcz стоит на месте русского «сч»."
memory: "szczęście — это сразу «счастье» и «удача». Слово то же, что русское «счастье»: внутри «доля, часть», а szcz стоит на месте «сч». Запомните две готовые формулы: mieć szczęście «повезти» и na szczęście «к счастью»."
idioms:
  - { pl: "łut szczęścia", ru: "капля везения" }
  - { pl: "odważnym szczęście sprzyja", ru: "смелым удача сопутствует" }
  - { pl: "dziecko szczęścia", ru: "баловень судьбы" }
