etymology: "Через немецкое TORTE из итальянского TORTA, а то из позднелатинского TORTA «круглый витой хлеб», от TORQUERE «крутить, свивать». Русское «торт» пришло тем же путём и в то же время, поэтому слова совпадают до буквы. В основе образ не сладости, а формы: витой, скрученный каравай. Тот же латинский корень виден в польском TORSJA и в итальянском TORTELLINI, где тесто тоже скручивают. Разница между языками возникла позже и только в объёме значения: польский закрепил слово за праздничным многослойным изделием, а русский растянул на всякий крупный сладкий пирог."
memory: "Только многослойный праздничный торт! Домашний пирог — ciasto, пирожное — ciastko, яблочный пирог — szarlotka. Родительный двойной: tortu (нормативно) и torta (разговорно). В местном t переходит в c: na torcie, как na monecie. Корень латинский torta «витой хлеб», от torquere «крутить»."
