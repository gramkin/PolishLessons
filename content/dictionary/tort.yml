notes:
  - { kind: false-friend, text: "Русское «торт» шире польского TORT, и заказ в кондитерской легко испортить. TORT по-польски — это именно многослойный торт с кремом, праздничный, со свечками. Всё остальное, что русский назовёт тортом или пирогом, в польском распределено иначе: CIASTO — это и тесто, и домашний пирог, SZARLOTKA — яблочный пирог, CIASTKO — пирожное или печенье, а TORCIK — маленький торт или вафельная плитка. Поэтому просьба о TORT в кафе означает целый торт, а не кусок: кусок будет KAWAŁEK TORTU или просто CIASTKO." }
  - { kind: usage, text: "Родительный единственного имеет две формы, и обе живые: TORTU и TORTA. Нормативные словари предпочитают TORTU, а TORTA обычна в разговоре и в кондитерской речи. Выбирая, безопаснее сказать TORTU: KAWAŁEK TORTU, BEZ TORTU. Формы с предлогами стоит выучить блоком: NA TORCIE «на торте», DO TORTU «для торта», Z TORTEM «с тортом». Уменьшительное TORCIK значит и маленький торт, и вафельный батончик, так что по надписи на упаковке не всегда ясно, о чём речь." }
  - { kind: pronunciation, text: "Читается «торт», одним слогом, и совпадает с русским почти полностью — редкий случай, когда переучивать нечего. Внимания требует только местный падеж TORCIE: там T перед -IE переходит в C и смягчается, «то́рце». Это то же чередование, что в MONETA и MONECIE, PASZPORT и PASZPORCIE, STUDENT и STUDENCIE. Конечное T в именительном глухое и в русском, и в польском, так что оглушать ничего не нужно." }
  - { kind: government, text: "Мужской род, неодушевлённое: винительный равен именительному, UPIEKŁA TORT. При отрицании винительный уходит в родительный: NIE UPIEKŁA TORTU. Назначение вводится предлогом DO с родительным: ŚWIECZKI DO TORTU «свечи для торта», FORMA DO TORTU «форма для торта». Начинка и вкус — предлог Z с творительным: TORT Z TRUSKAWKAMI «торт с клубникой». Количество требует родительного: KAWAŁEK TORTU, POŁOWA TORTU, DWA TORTY." }
