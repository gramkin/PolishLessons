notes:
  - { kind: false-friend, text: "ŻELAZO — «железо», с Ż и полногласием ELA. Утюг — ŻELAZKO, уменьшительное! Железный — ŻELAZNY: ŻELAZNA WOLA, «железная воля». Сталь — STAL." }
  - { kind: usage, text: "Средний род, вещественное. Учим единственное: ŻELAZO, ŻELAZA, ŻELAZU, ŻELAZEM, ŻELAZIE. В местном Z смягчается: W ŻELAZIE." }
