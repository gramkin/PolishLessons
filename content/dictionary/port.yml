etymology: "Из латинского PORTUS «гавань, пристань», родственного PORTA «ворота» и глаголу PORTARE «нести»: гавань мыслилась как ворота, через которые входят в страну товары. От того же корня идут «портал», «портфель» и «импорт», то есть «внесённое внутрь», и «экспорт», «вынесенное наружу». Оба языка взяли слово из латыни через западноевропейское посредство, и потому оно совпадает. Польское словообразование при этом пошло своим путём: вместо греческого AERO- оно взяло родное прилагательное и построило PORT LOTNICZY от LOT «полёт», тогда как русский сложил греческий и латинский корни в «аэропорт». Это характерно: польский охотнее переводит, чем заимствует целиком."
memory: "То же латинское portus «гавань», что и русский «порт», родственное porta «ворота» — гавань как ворота страны, отсюда же импорт и экспорт. Главное отличие практическое: аэропорт это port lotniczy, от lot «полёт», а слова «аэропорт» в польском нет; в разговоре говорят lotnisko. Местный porcie с меной t→c, как skrócie и kredycie. И не путать с portki — это разговорные штаны."
idioms:
  - { pl: "port lotniczy", ru: "аэропорт" }
