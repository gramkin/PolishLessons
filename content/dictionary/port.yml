notes:
  - { kind: false-friend, text: "Значение совпадает с русским «портом», оба слова из латыни. Запомнить нужно одно сочетание, без которого не прочесть ни одного расписания: аэропорт по-польски официально называется PORT LOTNICZY, буквально «порт воздушный», и именно так он подписан на указателях и в документах. В разговоре говорят LOTNISKO, а слово AEROPORT в польском не употребляется вовсе. Второе: PORT в значении разъёма и в компьютерном смысле тот же, что в русском. Третье, неожиданное: PORTKI это разговорное слово для штанов, не имеющее к порту никакого отношения." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Местный единственного — PORCIE, где конечное T основы переходит в C перед окончанием -E: та же мена, что в SKRÓCIE рядом и в KREDYCIE. Родительный единственного — PORTU. Винительный равен именительному. Предлоги при слове устойчивы: DO PORTU о входе, W PORCIE о стоянке, Z PORTU о выходе. Родительный множественного — PORTÓW. Прилагательное PORTOWY даёт целый ряд: MIASTO PORTOWE, ROBOTNIK PORTOWY, DZIELNICA PORTOWA." }
  - { kind: pronunciation, text: "Читается «порт», один слог, и звучит точно как русское слово. Буква O даёт чистое «о», R раскатистое, конечное T глухое. В форме PORTU слышно «по́рту». В форме PORCIE сочетание CIE даёт мягкое «це»: «по́рце», и местный падеж на слух расходится с именительным сильнее, чем можно ожидать. В форме PORTÓW буква Ó даёт «у», а конечное W оглушается: «по́ртуф»." }
  - { kind: register, text: "Слово нейтральное. Устойчивые сочетания: PORT MORSKI, PORT RZECZNY, PORT LOTNICZY, PORT MACIERZYSTY «порт приписки», ZAWINĄĆ DO PORTU «зайти в порт». Переносное употребление книжное и слегка поэтическое: BEZPIECZNY PORT о надёжном прибежище, как и по-русски «тихая гавань». В Польше слово нагружено историей: GDYNIA и GDAŃSK — портовые города, и обороты вроде PORT W GDYNI в школьном учебнике встречаются постоянно. Звательная форма у слова не употребляется." }
