notes:
  - { kind: false-friend, text: "SNAJPER — «снайпер», через J: SNAJPER. Книжное и военное — STRZELEC WYBOROWY, «меткий стрелок». В футболе SNAJPER — бомбардир, лучший забивающий." }
  - { kind: usage, text: "Десять форм, мужской род, лицо. Множественное — SNAJPERZY: R переходит в RZ. Местный и звательный — SNAJPERZE." }
