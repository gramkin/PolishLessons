notes:
  - { kind: false-friend, text: "KOMPANIA — ловушка: в армии это «рота», а «компания друзей» по-польски обычно TOWARZYSTWO: W DOBRYM TOWARZYSTWIE. Фирма в быту — FIRMA, а KOMPANIA — только в названиях: KOMPANIA PIWOWARSKA." }
  - { kind: usage, text: "Женский род. Родительный, дательный и местный — KOMPANII. Множественное — KOMPANIE. Звательный и архаичное KOMPANIJ не используем." }
  - { kind: government, text: "Командир роты — DOWÓDCA KOMPANII, родительный. В компании кого — W KOMPANII и родительный, книжно. Служить в роте — SŁUŻYĆ W KOMPANII." }
  - { kind: pronunciation, text: "Читается «компа́нья»: NIA — «нья». Ударение на предпоследнем слоге." }
collocations:
  - { pl: "dowódca kompanii", ru: "командир роты" }
  - { pl: "doborowa kompania", ru: "отличная компания" }
