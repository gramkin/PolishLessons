# review
id: okazac
format: 2
lemma: "okazać"
rank: 921
pos: verb
aspect: perf
pron: { cyr: "ока́заць" }
senses:
  - id: turn-out
    ru: "okazać się — оказаться"
    note: "Самое частое употребление: с się и творительным падежом."
    examples:
      - pl: "Tom okazał się złodziejem."
        ru: "Том оказался вором."
        source: { kind: tatoeba, id: 3230919 }
      - pl: "Antybiotyk okazał się skuteczny."
        ru: "Антибиотик оказался эффективным."
        source: { kind: tatoeba, id: 2123308 }
      - pl: "Jego historia okazała się prawdą."
        ru: "Его история оказалась правдой."
        source: { kind: tatoeba, id: 1002581 }
  - id: show
    ru: "предъявить, показать (документ)"
    examples:
      - pl: "Proszę okazać prawo jazdy."
        ru: "Предъявите, пожалуйста, водительские права."
        source: { kind: translated, id: 12564183 }
      - pl: "Każda osoba związana z uczelnią ma prawo do korzystania z usług biblioteki, po okazaniu dowodu osobistego lub legitymacji uniwersyteckiej."
        ru: "Каждый связанный с вузом имеет право пользоваться библиотекой по предъявлении удостоверения личности или студенческого билета."
        source: { kind: translated, id: 1605575 }
      - pl: "Okaż bilet konduktorowi."
        ru: "Предъяви билет кондуктору."
        source: { kind: authored }
  - id: show-feeling
    ru: "проявить (чувство, уважение)"
    examples:
      - pl: "Okaż szacunek."
        ru: "Прояви уважение."
        source: { kind: translated, id: 8617364 }
      - pl: "Okazała mi wielką dobroć."
        ru: "Она проявила ко мне большую доброту."
        source: { kind: translated, id: 6306774 }
      - pl: "Doceniam zaufanie, jakie mi okazałeś."
        ru: "Я ценю доверие, которое ты мне оказал."
        source: { kind: translated, id: 6404056 }
notes:
  - { kind: usage, text: "Самое частое употребление — с się: okazać się «оказаться», и после него творительный падеж: Tom okazał się złodziejem «Том оказался вором». Русский строит фразу так же." }
  - { kind: government, text: "Без się глагол переходный: okazać coś «предъявить, проявить что-то» — винительный. okazać komuś szacunek «проявить к кому-то уважение» — дательный на человека." }
  - { kind: usage, text: "Несовершенный вид — okazywać. Существительное okazja значит «случай, возможность», а не «оказия» в русском смысле почты: przy okazji «кстати, заодно»." }
  - { kind: usage, text: "Формула Proszę okazać… «Предъявите, пожалуйста…» звучит в транспорте и на контроле документов." }
collocations:
  - { pl: "okazać się", ru: "оказаться" }
  - { pl: "proszę okazać", ru: "предъявите, пожалуйста" }
  - { pl: "okazać szacunek", ru: "проявить уважение" }
  - { pl: "przy okazji", ru: "кстати, заодно" }
family:
  - { pl: "okazywać", ru: "показывать, проявлять", relation: aspect }
  - { pl: "okazja", ru: "случай, возможность", relation: derived }
  - { pl: "pokazać", ru: "показать", relation: root }
etymology: "Из o- + kazać «велеть, говорить», праславянское *kazati «показывать». Тот же корень в pokazać и в русских «показать», «сказать»."
memory: "okazać — прежде всего с się: okazać się «оказаться», и после него творительный падеж — Tom okazał się złodziejem. Без się значит «предъявить, проявить»: Proszę okazać bilet, okazać szacunek. Существительное okazja это «случай, возможность»: przy okazji «кстати»."
idioms:
  - { pl: "okazać się", ru: "оказаться" }
  - { pl: "proszę okazać", ru: "предъявите, пожалуйста" }
  - { pl: "okazać szacunek", ru: "проявить уважение" }
