# review
id: cenny
format: 2
lemma: "cenny"
rank: 2266
pos: adj
pron: { cyr: "цэ́нны" }
senses:
  - id: valuable
    ru: "ценный, дорогой (по ценности)"
    examples:
      - pl: "Cenny obraz wisi w drugiej sali."
        ru: "Ценная картина висит во втором зале."
        source: { kind: authored }
      - pl: "Nie zostawiaj cennych rzeczy w aucie."
        ru: "Не оставляй ценные вещи в машине."
        source: { kind: authored }
  - id: useful
    ru: "ценный, полезный (о совете, замечании)"
    examples:
      - pl: "Dziękuję za cenną uwagę."
        ru: "Спасибо за ценное замечание."
        source: { kind: authored }
      - pl: "To cenna wskazówka."
        ru: "Это ценная подсказка."
        source: { kind: authored }
  - id: precious-time
    ru: "драгоценный (о времени, силах)"
    examples:
      - pl: "Tracimy cenny czas."
        ru: "Мы теряем драгоценное время."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Слово прозрачно: cenny от cena, как «ценный» от «цены». Различать надо не языки, а пару внутри польского: cenny значит «обладающий ценностью», drogi — «стоящий дорого». Cenny prezent это подарок, который дорог по значению; drogi prezent — дорогой по цене. Русский делит ровно так же." }
  - { kind: pronunciation, text: "Два слога, ударение на первом: CEN-ny. Польское c читается как русское ц, а двойное nn произносится долго: «цэ́нны». В сравнительной степени появляется мягкое ni: cenniejszy — «цэнне́йшы»." }
  - { kind: usage, text: "Частые сочетания: cenna uwaga, cenna rada, cenne doświadczenie, cenny nabytek. Степени сравнения обычные: cenniejszy, najcenniejszy. Существительное от того же корня — wartość «ценность, стоимость», а также cennik «прейскурант», слово, которое в магазине встречается чаще самого прилагательного." }
  - { kind: register, text: "Нейтрально. В разговоре о людях звучит слегка казённо: cenny pracownik «ценный работник» — язык отдела кадров. О вещах, советах и времени — совершенно обычно." }
collocations:
  - { pl: "cenna uwaga", ru: "ценное замечание" }
  - { pl: "cenny czas", ru: "драгоценное время" }
  - { pl: "cenne doświadczenie", ru: "ценный опыт" }
family:
  - { pl: "cena", ru: "цена", relation: root, id: cena }
  - { pl: "cenić", ru: "ценить", relation: derived }
  - { pl: "bezcenny", ru: "бесценный", relation: derived }
  - { pl: "bezwartościowy", ru: "ничего не стоящий", relation: antonym }
etymology: "От cena, из праславянского *cěna — того же слова, что русская «цена», родственного греческому poine «возмездие, плата» и латинскому poena «наказание». Исходный смысл был «плата, возмещение». Отсюда cenić «ценить», cennik «прейскурант», bezcenny «бесценный» и doceniać «ценить по достоинству»."
memory: "cenny — «ценный», от cena «цена», в точности как русская пара. Отличать надо от drogi: cenny это ценный по значению, drogi — дорогой по цене. Польский делит так же, как русский."
idioms:
