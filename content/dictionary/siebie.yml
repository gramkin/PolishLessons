# review
id: siebie
format: 2
depth: deep
lemma: "siebie"
rank: 46
pos: pron
pron: { cyr: "сье́бе" }
senses:
  - id: self
    ru: "себя, себе (возвратное местоимение)"
    examples:
      - pl: "Popatrzyli na siebie."
        ru: "Они посмотрели друг на друга."
        source: { kind: tatoeba, id: 970292 }
      - pl: "Mam cały dom dla siebie."
        ru: "Дом принадлежит мне одному."
        source: { kind: tatoeba, id: 1165159 }
      - pl: "Każdy decyduje za siebie."
        ru: "Каждый решает для себя сам."
        source: { kind: tatoeba, id: 1794051 }
      - pl: "Ona mruczy coś do siebie."
        ru: "Она что-то бормочет."
        source: { kind: tatoeba, id: 478263 }
  - id: each-other
    ru: "друг друга (во взаимном значении)"
    examples:
      - pl: "Lubimy siebie nawzajem."
        ru: "Мы нравимся друг другу."
        source: { kind: authored }
  - id: on-oneself
    ru: "в предложных оборотах: u siebie, do siebie, za siebie"
    examples:
      - pl: "Ona mruczy coś do siebie."
        ru: "Она что-то бормочет себе под нос."
        source: { kind: translated, id: 478263 }
      - pl: "Wzięła na siebie zbyt wiele pracy."
        ru: "Она взяла на себя слишком много работы."
        source: { kind: translated, id: 442864 }
notes:
  - { kind: usage, text: "Одна форма на все лица и числа, как русское «себя». Краткая безударная форма — się." }
  - { kind: false-friend, text: "Три ступени одного местоимения: się — безударная частица при глаголе (myję się), siebie — ударная форма и единственно возможная после предлога (dla siebie, do siebie), sobie — дательный (kupiłem sobie). Русское «себя» не различает их так строго." }
  - { kind: government, text: "После любого предлога ставится только siebie, никогда się: patrzy na siebie «смотрит на себя», mówi do siebie «говорит сам с собой», za siebie «за себя»." }
  - { kind: usage, text: "Оборот u siebie значит «у себя дома, на своей территории», a dojść do siebie — «прийти в себя»." }
collocations:
  - { pl: "do siebie", ru: "к себе" }
  - { pl: "u siebie", ru: "у себя" }
  - { pl: "ze sobą", ru: "с собой" }
etymology: "Праславянское *sebe — то же слово, что русское «себя»."
memory: "Различайте две формы одного местоимения: się — безударная частица при глаголе (myję się), siebie — полноударная форма, обязательная после предлога (dla siebie, do siebie)."
idioms:
  - { pl: "czuć się jak u siebie w domu", ru: "чувствовать себя как дома" }
  - { pl: "brać do siebie", ru: "принимать на свой счёт" }
  - { pl: "dochodzić do siebie", ru: "приходить в себя" }
