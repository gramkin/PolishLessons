  - { pl: "tynk się odkrusza", ru: "штукатурка осыпается" }
  - { pl: "odkruszać kawałek ciasta", ru: "отщипывать кусочек пирога" }
family:
  - { pl: "odkruszyć", ru: "отломить, отщипнуть", relation: aspect }
  - { pl: "kruszyć", ru: "крошить, дробить", relation: root }
  - { pl: "okruch", ru: "крошка, обломок", relation: root }
  - { pl: "okruszek", ru: "крошка", relation: root }
  - { pl: "kruchy", ru: "хрупкий, рассыпчатый", relation: root }
etymology: "Приставка OD- «от-» плюс KRUSZYĆ «крошить, дробить»; KRUSZYĆ восходит к праславянскому *krušiti «дробить, разбивать», откуда и русское «крушить»."
memory: "Odkruszać — «от-крошивать»: okruszek «крошка», kruszyć «крошить». Отщипываешь по крошке."
idioms:
