        ru: "Инфляция понемногу съедает наши сбережения."
        source: { kind: authored }
  - id: chip
    ru: "odkruszać się — откалываться, осыпаться (о штукатурке, камне, краске)"
    examples:
      - pl: "Tynk odkrusza się ze ścian."
        ru: "Штукатурка осыпается со стен."
