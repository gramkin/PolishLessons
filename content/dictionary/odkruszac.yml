      - pl: "Ze starych schodów odkruszają się kawałki betonu."
        ru: "Со старой лестницы откалываются куски бетона."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Несовершенный вид; совершенный — ODKRUSZYĆ. Значение — отделять маленькие кусочки, крошки: ODKRUSZAĆ CHLEB, ODKRUSZAĆ KAWAŁEK SERA. С SIĘ — «откалываться, осыпаться» о штукатурке, краске, камне: TYNK SIĘ ODKRUSZA. Мужско-личное страдательное ODKRUSZANI в карточку не включено: крошат хлеб и камень, а не людей." }
  - { kind: government, text: "Что — винительный: ODKRUSZAĆ KAWAŁEK. Откуда — OD + родительный или Z + родительный: ODKRUSZAĆ OD BOCHENKA, Z MURU. Кому, для кого — дательный: ODKRUSZAĆ PTAKOM CHLEB." }
  - { kind: usage, text: "Это слово про мелкое, по крошке. Для крупного куска — ODŁAMYWAĆ «отламывать», для камня с силой — ODŁUPYWAĆ «откалывать». В переносном смысле ODKRUSZAĆ — «понемногу отнимать»: INFLACJA ODKRUSZA OSZCZĘDNOŚCI." }
  - { kind: pronunciation, text: "Читается «откру́шаць»: D перед K оглушается в «т», SZ — твёрдое «ш», ударение на «у»." }
collocations:
