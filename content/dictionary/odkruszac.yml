pron: { cyr: "откру́шаць" }
senses:
  - id: crumble-off
    ru: "отщипывать, отламывать (кусочки, крошки)"
    examples:
      - pl: "Dziadek odkrusza chleb gołębiom."
        ru: "Дедушка крошит хлеб голубям."
