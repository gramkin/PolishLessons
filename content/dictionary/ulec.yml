# review
id: ulec
format: 2
lemma: "ulec"
rank: 3766
pos: verb
pron: { cyr: "у́лец" }
senses:
  - id: yield
    ru: "поддаться, уступить (давлению, искушению)"
    examples:
      - pl: "Uległa jego namowom."
        ru: "Она поддалась его уговорам."
        source: { kind: authored }
      - pl: "Ulegli presji opinii publicznej."
        ru: "Они уступили давлению общественного мнения."
        source: { kind: authored }
      - pl: "Nie ulegnij pokusie!"
        ru: "Не поддавайся искушению!"
        source: { kind: authored }
  - id: undergo
    ru: "подвергнуться: ULEC ZMIANIE, ZNISZCZENIU, WYPADKOWI"
    examples:
      - pl: "Uległ wypadkowi na autostradzie."
        ru: "Он попал в аварию на автостраде."
        source: { kind: authored }
      - pl: "Plan ulegnie zmianie."
        ru: "План изменится."
        source: { kind: authored }
  - id: lose-to
    ru: "проиграть (сопернику)"
    examples:
      - pl: "Mistrz uległ młodemu rywalowi."
        ru: "Чемпион проиграл молодому сопернику."
        source: { kind: authored }
      - pl: "Ulegliśmy rywalom w finale."
        ru: "Мы уступили соперникам в финале."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ULEC — «поддаться, уступить», а не «улечься»: «улечься» — POŁOŻYĆ SIĘ. ULEC WYPADKOWI — «попасть в аварию», ULEC ZMIANIE — «измениться». Всегда с дательным." }
  - { kind: usage, text: "Сорок две формы. Будущее с -N-: ULEGNĘ, ULEGNIESZ, повелительное ULEGNIJ; прошедшее — ULEGŁ, ULEGLI; деепричастие — ULEGŁSZY. Вариант инфинитива «ulegnąć» встречается редко. Несовершенный вид — ULEGAĆ." }
  - { kind: government, text: "Кому или чему — дательный: ULEC PRESJI, POKUSIE, RYWALOWI. С отглагольным существительным — тоже дательный: ULEC ZNISZCZENIU, POPRAWIE «улучшиться»." }
  - { kind: pronunciation, text: "Читается «у́лец», ударение на первом слоге. ULEGNĘ — «уле́гнэ», ULEGŁ — «у́легу»: Ł на конце — «у»." }
  - { kind: register, text: "Книжное и газетное слово. ULEC WYPADKOWI, ULEC ZNISZCZENIU — протокольные. В быту — DAĆ SIĘ NAMÓWIĆ, PRZEGRAĆ." }
collocations:
  - { pl: "ulec pokusie", ru: "поддаться искушению" }
  - { pl: "ulec wypadkowi", ru: "попасть в аварию" }
  - { pl: "ulec zmianie", ru: "измениться" }
family:
  - { pl: "uległy", ru: "покорный, уступчивый", relation: derived }
  - { pl: "ulegać", ru: "поддаваться", relation: aspect, id: ulegac }
  - { pl: "lec", ru: "лечь (книжн.)", relation: root }
etymology: "Приставка U- плюс старое LEC «лечь», праславянское *lešti, *legǫ. Исходный смысл — «лечь под кого-то», то есть уступить. Русское «лечь», «полечь» — то же гнездо."
memory: "Ulec — поддаться: uległa namowom. Ulec wypadkowi — попасть в аварию. Ulec zmianie — измениться. Всегда с дательным. Читается «у́лец»."
idioms:
  - { pl: "ulec pokusie", ru: "поддаться искушению" }
formExamplesSkip:
  - { form: "ulegnąć", reason: "редкий вариант инфинитива ULEC" }
