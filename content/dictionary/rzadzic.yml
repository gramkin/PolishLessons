# review
id: rzadzic
format: 2
lemma: "rządzić"
rank: 1524
pos: verb
aspect: imperf
pron: { cyr: "жо́ндзиць" }
senses:
  - id: rule
    ru: "править, управлять"
    examples:
      - pl: "Król rządził swoim królestwem sprawiedliwie."
        ru: "Король правил своим королевством справедливо."
        source: { kind: tatoeba, id: 10631711 }
      - pl: "Kto tutaj rządzi?"
        ru: "Кто здесь главный?"
        source: { kind: translated, id: 3127240 }
      - pl: "W Wielkiej Brytanii król panuje, ale nie rządzi."
        ru: "В Великобритании король царствует, но не управляет."
        source: { kind: tatoeba, id: 725589 }
  - id: be-in-charge
    ru: "быть главным, распоряжаться"
    examples:
      - pl: "Ty tu rządzisz."
        ru: "Ты здесь главный."
        source: { kind: translated, id: 440272 }
      - pl: "Pieniądz rządzi światem."
        ru: "Деньги правят миром."
        source: { kind: translated, id: 532754 }
notes:
  - { kind: government, text: "rządzić czym — творительный падеж: rządzić krajem «править страной», rządzić światem «править миром». Русское «править чем» совпадает." }
  - { kind: usage, text: "Только несовершенный вид. Существительные того же корня: rząd «правительство» и rządy «правление»." }
  - { kind: usage, text: "Kto tu rządzi? — «Кто здесь главный?», обиходный вопрос, не только о государстве." }
  - { kind: usage, text: "Dziel i rządź — «Разделяй и властвуй», латинское divide et impera в польском переводе." }
collocations:
  - { pl: "rządzić krajem", ru: "править страной" }
  - { pl: "kto tu rządzi", ru: "кто здесь главный" }
  - { pl: "rządzić żelazną ręką", ru: "править железной рукой" }
etymology: "От rząd «ряд, порядок, правительство» (праславянское *rędъ). Русские «ряд» и «наряд» того же корня, а «править» собрано иначе."
memory: "rządzić — «править, управлять», и падеж тот же, что в русском: творительный — rządzić krajem. Kto tu rządzi? значит «Кто здесь главный?». Отсюда же rząd «правительство»."
idioms:
  - { pl: "dziel i rządź", ru: "разделяй и властвуй" }
  - { pl: "rządzić żelazną ręką", ru: "править железной рукой" }
  - { pl: "kto tu rządzi", ru: "кто здесь главный" }
