formExamples:
  - form: "rządzą"
    pl: "Koty rządzą światem."
    ru: "Коты правят миром."
    source: { kind: tatoeba, id: 9952244 }
  - form: "rządzą"
    pl: "Pieniądze rządzą światem."
    ru: "Деньги правят миром."
    source: { kind: translated, id: 10593966 }
  - form: "rządzą"
    pl: "Tu rządzą inne zasady."
    ru: "Здесь действуют другие правила."
    source: { kind: authored }
  - form: "rządząca"
    pl: "Partia rządząca nie ma właściwie żadnego programu."
    ru: "У правящей партии по сути нет никакой программы."
    source: { kind: translated, id: 11264377 }
  - form: "rządząca"
    pl: "W nadchodzących wyborach wygra chyba partia rządząca."
    ru: "На ближайших выборах, пожалуй, победит правящая партия."
    source: { kind: translated, id: 998639 }
  - form: "rządząca"
    pl: "Partia rządząca jest skorumpowana, ale opozycja jest niewiele lepsza."
    ru: "Правящая партия коррумпирована, но оппозиция ненамного лучше."
    source: { kind: translated, id: 754207 }
  - form: "rządzących"
    pl: "Krytyka rządzących jest ostra."
    ru: "Критика правящих резкая."
    source: { kind: authored }
  - form: "rządzących"
    pl: "Wśród rządzących panuje spór."
    ru: "Среди правящих идёт спор."
    source: { kind: authored }
  - form: "rządzących"
    pl: "To lista rządzących krajem."
    ru: "Это список правящих страной."
    source: { kind: authored }
  - form: "rządzi"
    pl: "Kto tutaj rządzi?"
    ru: "Кто здесь главный?"
    source: { kind: translated, id: 3127240 }
  - form: "rządzi"
    pl: "Pieniądz rządzi światem."
    ru: "Деньги правят миром."
    source: { kind: translated, id: 532754 }
  - form: "rządzi"
    pl: "W Wielkiej Brytanii król panuje, ale nie rządzi."
    ru: "В Великобритании король царствует, но не управляет."
    source: { kind: tatoeba, id: 725589 }
  - form: "rządzić"
    pl: "Jeden, by wszystkimi rządzić."
    ru: "Одно, чтобы всеми править."
    source: { kind: translated, id: 544517 }
  - form: "rządzić"
    pl: "\"Pieniądze muszą służyć, nie rządzić.\""
    ru: "Деньги должны служить, а не править."
    source: { kind: translated, id: 5488163 }
  - form: "rządzić"
    pl: "Jaki rząd jest najlepszy? Ten, który uczy nas rządzić samym sobą."
    ru: "Какое правительство лучшее? То, которое учит нас править самими собой."
    source: { kind: translated, id: 872308 }
  - form: "rządził"
    pl: "Król rządził swoim królestwem sprawiedliwie."
    ru: "Король правил своим королевством справедливо."
    source: { kind: tatoeba, id: 10631711 }
  - form: "rządził"
    pl: "Kiedyś Napoleon Bonaparte rządził całą Francją."
    ru: "Когда-то Наполеон Бонапарт правил всей Францией."
    source: { kind: translated, id: 13429712 }
  - form: "rządził"
    pl: "Król rządził swoim ludem przez czterdzieści lat."
    ru: "Король правил своим народом сорок лет."
    source: { kind: translated, id: 3109627 }
  - form: "rządziła"
    pl: "Życiem miasta rządziła kopalnia."
    ru: "Жизнью города правила шахта."
    source: { kind: translated, id: 2288311 }
  - form: "rządziła"
    pl: "Hiszpania rządziła Kubą w tamtym czasie."
    ru: "Испания правила Кубой в то время."
    source: { kind: translated, id: 8195766 }
  - form: "rządziła"
    pl: "Tym krajem rządziła francuska arystokracja."
    ru: "Этой страной правила французская аристократия."
    source: { kind: translated, id: 982935 }
  - form: "rządzisz"
    pl: "Ty tu rządzisz."
    ru: "Ты здесь главный."
    source: { kind: translated, id: 440272 }
  - form: "rządzisz"
    pl: "Rządzisz tym domem?"
    ru: "Ты правишь этим домом?"
    source: { kind: authored }
  - form: "rządzisz"
    pl: "Nie rządzisz mną."
    ru: "Ты мной не командуешь."
    source: { kind: authored }
  - form: "rządzona"
    pl: "Birma rządzona jest przez wojskową juntę."
    ru: "Бирмой правит военная хунта."
    source: { kind: translated, id: 551572 }
  - form: "rządzona"
    pl: "Ta wyspa była rządzona przez gubernatora."
    ru: "Этим островом правил губернатор."
    source: { kind: authored }
  - form: "rządzona"
    pl: "Firma jest rządzona twardą ręką."
    ru: "Фирмой управляют твёрдой рукой."
    source: { kind: authored }
  - form: "rządzone"
    pl: "Indie były rządzone przez Wielką Brytanię przez wiele lat."
    ru: "Индией много лет правила Великобритания."
    source: { kind: translated, id: 3428167 }
  - form: "rządzone"
    pl: "Te ziemie były rządzone z daleka."
    ru: "Этими землями правили издалека."
    source: { kind: authored }
  - form: "rządzone"
    pl: "Kraje rządzone przez dyktatorów."
    ru: "Страны, управляемые диктаторами."
    source: { kind: authored }
  - form: "rządzony"
    pl: "Republika to kraj rządzony nie przez króla czy królową, ale przez prezydenta."
    ru: "Республика — это страна, управляемая не королём или королевой, а президентом."
    source: { kind: tatoeba, id: 742558 }
  - form: "rządzony"
    pl: "Kraj rządzony przez wojsko."
    ru: "Страна, управляемая военными."
    source: { kind: authored }
  - form: "rządzony"
    pl: "Był rządzony przez strach."
    ru: "Им правил страх."
    source: { kind: authored }
  - form: "rządzonym"
    pl: "Nie chcę żyć w świecie rządzonym przez bogaczy."
    ru: "Я не хочу жить в мире, которым правят богачи."
    source: { kind: translated, id: 12728326 }
  - form: "rządzonym"
    pl: "W kraju rządzonym przez prawo jest spokojniej."
    ru: "В стране, управляемой законом, спокойнее."
    source: { kind: authored }
  - form: "rządzonym"
    pl: "Mówimy o państwie rządzonym twardo."
    ru: "Мы говорим о государстве, управляемом жёстко."
    source: { kind: authored }
  - form: "rządź"
    pl: "Dziel i rządź."
    ru: "Разделяй и властвуй."
    source: { kind: translated, id: 2679394 }
  - form: "rządź"
    pl: "Dziel i rządź!"
    ru: "Разделяй и властвуй!"
    source: { kind: translated, id: 13662134 }
  - form: "rządź"
    pl: "Rządź mądrze."
    ru: "Правь мудро."
    source: { kind: authored }
