# review
id: udac
format: 2
lemma: "udać"
rank: 268
pos: verb
aspect: perf
pron: { cyr: "у́даць" }
senses:
  - id: succeed
    ru: "udać się — удаться, получиться (кому-либо)"
    note: "Безлично, с дательным: udało mi się «мне удалось»."
    examples:
      - pl: "Udało mu się."
        ru: "Ему это удалось."
        source: { kind: tatoeba, id: 401168 }
      - pl: "Prawie się udało."
        ru: "Почти получилось."
        source: { kind: tatoeba, id: 8620914 }
      - pl: "Nie udało nam się go przekonać."
        ru: "Нам не удалось его убедить."
        source: { kind: tatoeba, id: 6373129 }
  - id: set-off
    ru: "udać się куда-либо — отправиться, направиться"
    note: "Книжный оборот; в разговоре чаще pójść или pojechać."
    examples:
      - pl: "Natychmiast udali się na miejsce wypadku."
        ru: "Они немедленно отправились на место происшествия."
        source: { kind: translated, id: 751455 }
      - pl: "Udaliśmy się do górskiej chatki."
        ru: "Мы отправились в горную хижину."
        source: { kind: translated, id: 3687055 }
      - pl: "Udałem się w góry."
        ru: "Я отправился в горы."
        source: { kind: translated, id: 10202730 }
  - id: pretend
    ru: "udać kogoś / coś — притвориться, изобразить"
    examples:
      - pl: "Udał samobójstwo."
        ru: "Он инсценировал самоубийство."
        source: { kind: translated, id: 369114 }
      - pl: "Udała Greka."
        ru: "Она прикинулась дурочкой."
        source: { kind: translated, id: 695750 }
      - pl: "Może udamy, że to się nie wydarzyło?"
        ru: "Может, сделаем вид, что этого не было?"
        source: { kind: translated, id: 12710024 }
notes:
  - { kind: usage, text: "Самое частое значение — безличное udać się: Udało mi się «Мне удалось», Nie udało nam się «Нам не удалось». Лицо стоит в дательном падеже." }
  - { kind: usage, text: "Второе значение — «притвориться»: udać chorego «притвориться больным», udawać Greka «прикидываться дурачком»." }
  - { kind: usage, text: "Третье, книжное — «отправиться»: udać się do lekarza «отправиться к врачу»." }
  - { kind: usage, text: "Прилагательное udany значит «удачный»: udana impreza «удачная вечеринка», Udanej podróży! «Счастливого пути!»" }
collocations:
  - { pl: "udało mi się", ru: "мне удалось" }
  - { pl: "udanej podróży", ru: "счастливого пути" }
  - { pl: "udać się do lekarza", ru: "отправиться к врачу" }
  - { pl: "udawać Greka", ru: "прикидываться дурачком" }
etymology: "Из u- + dać «дать»; ср. русские «удаться», «удача» — та же модель с той же приставкой."
memory: "Udało mi się — «Мне удалось», с дательным падежом. Но udać kogoś значит «притвориться кем-то»: Udała Greka. А udany — «удачный»: Udanej podróży!"
idioms:
  - { pl: "udało mi się", ru: "мне удалось" }
  - { pl: "udawać Greka", ru: "прикидываться дурачком" }
  - { pl: "udanej podróży", ru: "счастливого пути" }
