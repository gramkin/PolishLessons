# review
id: kropic
format: 2
lemma: "kropić"
rank: 2310
pos: verb
aspect: imperf
pron: { cyr: "кро́пиць" }
senses:
  - id: drizzle
    ru: "моросить, накрапывать (о дожде)"
    examples:
      - pl: "Deszcz, który kropił, gdy wsiadałem do pociągu, teraz zamienił się w ulewę."
        ru: "Дождь, который накрапывал, когда я садился в поезд, теперь превратился в ливень."
        source: { kind: translated, id: 2330527 }
      - pl: "Od rana kropi."
        ru: "С утра моросит."
        source: { kind: authored }
      - pl: "Kropiło przez całą drogę."
        ru: "Всю дорогу моросило."
        source: { kind: authored }
  - id: sprinkle
    ru: "кропить, брызгать"
    examples:
      - pl: "Ksiądz kropił wiernych wodą święconą."
        ru: "Священник кропил верующих святой водой."
        source: { kind: authored }
      - pl: "Kropiła bieliznę przed prasowaniem."
        ru: "Она брызгала бельё перед глажкой."
        source: { kind: authored }
notes:
  - { kind: usage, text: "О погоде глагол безличный: kropi «моросит», kropiło «моросило» — без подлежащего, как русское «моросит»." }
  - { kind: false-friend, text: "От kropla «капля». Русское «кропить» — тот же корень, и церковное значение у обоих слов сохранилось." }
  - { kind: government, text: "В значении «кропить» — винительный падеж: kropić wodą kogoś, чем — творительным." }
  - { kind: usage, text: "Совершенный вид — pokropić. Сильный дождь — lać: leje «льёт»." }
collocations:
  - { pl: "kropić wodą święconą", ru: "кропить святой водой" }
  - { pl: "kropi deszcz", ru: "моросит дождь" }
etymology: "От kropla «капля»; русское «кропить» — тот же корень."
memory: "kropić — «моросить» о дожде (безлично: kropi «моросит») и «кропить» водой. Корень kropla «капля», как в русском «кропить»."
idioms:
  - { pl: "kropić wodą święconą", ru: "кропить святой водой" }
