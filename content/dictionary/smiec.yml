# review
id: smiec
format: 2
lemma: "śmieć"
rank: 636
pos: verb
aspect: imperf
pron: { cyr: "сьмець" }
senses:
  - id: dare
    ru: "сметь, осмеливаться"
    note: "Jak śmiesz? «Как ты смеешь?» — самая частая форма."
    examples:
      - pl: "Jak śmiesz tak mówić."
        ru: "Как ты смеешь так говорить."
        source: { kind: translated, id: 676684 }
      - pl: "Jak śmiesz prosić mnie o pomoc?"
        ru: "Как ты смеешь просить меня о помощи?"
        source: { kind: translated, id: 367680 }
      - pl: "Jak on śmie otwierać moje listy!"
        ru: "Как он смеет вскрывать мои письма!"
        source: { kind: translated, id: 2395541 }
  - id: dare-not
    ru: "nie śmieć — не сметь"
    note: "Чаще всего слово встречается именно с отрицанием."
    examples:
      - pl: "On nie śmie wyrazić swojej opinii."
        ru: "Он не смеет высказать своё мнение."
        source: { kind: translated, id: 2594000 }
      - pl: "Nie śmiałby już pokazywać tu swojej twarzy."
        ru: "Он не посмел бы больше здесь показаться."
        source: { kind: translated, id: 10999970 }
      - pl: "Nie śmiałbym sprzedawać swojej gitary."
        ru: "Я не посмел бы продать свою гитару."
        source: { kind: translated, id: 12040363 }
  - id: i-dare-say
    ru: "śmiem twierdzić, śmiem wątpić — смею утверждать, смею сомневаться"
    note: "Книжный, но живой оборот вежливого несогласия."
    examples:
      - pl: "Śmiem wątpić."
        ru: "Смею сомневаться."
        source: { kind: translated, id: 13223698 }
      - pl: "Śmiem twierdzić, że on jest niewinny."
        ru: "Смею утверждать, что он невиновен."
        source: { kind: translated, id: 7304023 }
      - pl: "Śmiem twierdzić, że to pomyłka."
        ru: "Смею утверждать, что это ошибка."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Главная трудность: śmieć «сметь» и śmiać się «смеяться» совпадают в прошедшем времени и в ряде других форм. Śmiał się radośnie — это «он радостно смеялся» (от śmiać się), а nie śmiał się odezwać — «он не смел заговорить» (от śmieć). Различают их частица się и смысл." }
  - { kind: false-friend, text: "Тот же набор букв даёт ещё и существительное: śmieć значит «мусор, хлам». To śmieć. Wyrzuć to «Это мусор. Выбрось его»." }
  - { kind: usage, text: "Глагол модальный и недостаточный: причастий, отглагольного существительного и страдательного залога у него в живой речи нет." }
  - { kind: usage, text: "Повелительное живёт в основном с отрицанием, ровно как в русском: Nie śmiej tego robić! «Не смей этого делать!»" }
  - { kind: usage, text: "Этимологически śmieć и śmiać się — разные корни, случайно сблизившиеся по звучанию; в русском «сметь» и «смеяться» разошлись заметнее." }
collocations:
  - { pl: "Jak śmiesz?", ru: "Как ты смеешь?" }
  - { pl: "śmiem twierdzić", ru: "смею утверждать" }
  - { pl: "śmiem wątpić", ru: "смею сомневаться" }
  - { pl: "nie śmieć", ru: "не сметь" }
family:
  - { pl: "ośmielić się", ru: "осмелиться", relation: derived }
  - { pl: "śmiały", ru: "смелый", relation: root }
  - { pl: "śmiałość", ru: "смелость", relation: derived }
etymology: "Праславянское *sъměti — то же слово, что русское «сметь». Созвучное śmiać się «смеяться» идёт от другого корня, *smijati sę, откуда русское «смеяться»: корни разные, а формы сблизились."
memory: "śmieć — «сметь», и главная трудность в том, что оно почти сливается с śmiać się «смеяться»: формы совпадают, различают их się и смысл. Śmiał się radośnie — «радостно смеялся», а nie śmiał się odezwać — «не смел заговорить». Тот же набор букв даёт вдобавок существительное śmieć «мусор». Сам глагол модальный и недостаточный: чаще всего вы услышите Jak śmiesz? «Как ты смеешь?», оборот śmiem twierdzić и запрет Nie śmiej tego robić!"
idioms:
  - { pl: "Jak śmiesz?", ru: "Как ты смеешь?" }
  - { pl: "śmiem twierdzić", ru: "смею утверждать" }
  - { pl: "śmiem wątpić", ru: "смею сомневаться" }
  - { pl: "Nie śmiej!", ru: "Не смей!" }
