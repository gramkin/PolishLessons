# review
id: niewinny
format: 2
lemma: "niewinny"
rank: 1027
pos: adj
pron: { cyr: "неви́нны" }
senses:
  - id: not-guilty
    ru: "невиновный"
    examples:
      - pl: "Twierdził, że jest niewinny."
        ru: "Он настаивал на том, что невиновен."
        source: { kind: translated, id: 736790 }
      - pl: "Jesteśmy niewinni."
        ru: "Мы невиновны."
        source: { kind: translated, id: 10112434 }
      - pl: "Oczywiście, niewinni ludzie zostali wypuszczeni."
        ru: "Разумеется, невиновных отпустили."
        source: { kind: translated, id: 539725 }
  - id: innocent
    ru: "невинный, простодушный"
    examples:
      - pl: "Była młoda i niewinna."
        ru: "Она была молода и невинна."
        source: { kind: translated, id: 1853815 }
      - pl: "Ona ma czyste, niewinne serce."
        ru: "У неё чистое, невинное сердце."
        source: { kind: translated, id: 765737 }
      - pl: "Jestem niewinnym człowiekiem."
        ru: "Я невинный человек."
        source: { kind: translated, id: 3127321 }
  - id: harmless
    ru: "niewinne kłamstwo — невинная ложь"
    examples:
      - pl: "Niewinne kłamstwo."
        ru: "Невинная ложь."
        source: { kind: translated, id: 753780 }
      - pl: "To było niewinne pytanie."
        ru: "Это был невинный вопрос."
        source: { kind: authored }
      - pl: "Niewinny żart nikogo nie obraził."
        ru: "Невинная шутка никого не обидела."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Одно слово на два русских: «невиновный» в суде и «невинный, простодушный» в быту. Контекст различает их сам." }
  - { kind: usage, text: "Строится прозрачно: nie + winny «виновный», от wina «вина». Русское «невиновный» собрано так же." }
  - { kind: usage, text: "niewinne kłamstwo — «невинная ложь», то есть безобидная. По-русски чаще говорят «ложь во спасение»." }
  - { kind: usage, text: "Степени сравнения в живой речи не встречаются: невиновным нельзя быть «более», чем кто-то другой." }
collocations:
  - { pl: "jestem niewinny", ru: "я невиновен" }
  - { pl: "niewinne kłamstwo", ru: "невинная ложь" }
  - { pl: "uznać za niewinnego", ru: "признать невиновным" }
  - { pl: "niewinna ofiara", ru: "невинная жертва" }
family:
  - { pl: "wina", ru: "вина", relation: root, id: wina }
  - { pl: "winny", ru: "виновный", relation: antonym }
  - { pl: "niewinność", ru: "невинность", relation: derived }
etymology: "Из nie + winny «виновный», от wina «вина». Русское «невиновный» собрано ровно так же, морфема в морфему."
memory: "niewinny покрывает сразу два русских слова: «невиновный» в суде и «невинный» в быту. Jestem niewinny значит «я невиновен», а niewinne kłamstwo — «невинная, безобидная ложь»."
