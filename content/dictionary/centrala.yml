# review
id: centrala
format: 2
lemma: "centrala"
rank: 2554
pos: noun
pron: { cyr: "цэнтра́ля" }
senses:
  - id: head-office
    ru: "головной офис, центральное управление"
    examples:
      - pl: "Centrala mieści się w Warszawie."
        ru: "Головной офис находится в Варшаве."
        source: { kind: authored }
      - pl: "Decyzję podjęto w centrali."
        ru: "Решение приняли в головном офисе."
        source: { kind: authored }
  - id: switchboard
    ru: "коммутатор, телефонная станция"
    examples:
      - pl: "Centrala telefoniczna działa całą dobę."
        ru: "Телефонная станция работает круглосуточно."
        source: { kind: authored }
      - pl: "Połączono mnie przez centralę."
        ru: "Меня соединили через коммутатор."
        source: { kind: authored }
  - id: head-offices
    ru: "центральные офисы (как сеть)"
    examples:
      - pl: "Centrale dwóch banków stoją obok siebie."
        ru: "Головные офисы двух банков стоят рядом."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ЭТО НЕ «ЦЕНТРАЛЬ» И НЕ «ЦЕНТР». CENTRALA — это головной офис фирмы в противоположность филиалам, или телефонный коммутатор. Центр города будет CENTRUM, и это слово среднего рода и несклоняемое в единственном числе. Так что centrala и centrum — два разных слова, которые русский передаёт по-разному." }
  - { kind: usage, text: "Форма CENTRALI обслуживает родительный, дательный и предложный единственного: w centrali, do centrali. Родительный множественного — CENTRAL, с нулевым окончанием. Прилагательное centralny значит «центральный», а oddział — «филиал», то есть противоположность centrali." }
  - { kind: pronunciation, text: "Четыре слога, ударение на предпоследнем: cen-TRA-la. Польское c читается как ц, e открытое, l мягкое: «цэнтра́ля». Форма centrali звучит «цэнтра́лі»." }
collocations:
  - { pl: "centrala telefoniczna", ru: "телефонный коммутатор" }
  - { pl: "w centrali", ru: "в головном офисе" }
  - { pl: "centrala firmy", ru: "головной офис фирмы" }
family:
  - { pl: "centrum", ru: "центр", relation: root, id: centrum }
  - { pl: "oddział", ru: "филиал, отделение", relation: antonym, id: oddzial }
  - { pl: "centralny", ru: "центральный", relation: derived }
etymology: "От centralny «центральный», из латинского centralis, от centrum «средоточие», а то из греческого kentron «остриё циркуля». То же слово дало русские «центр» и «центральный». Польский развил из прилагательного существительное со значением «главное учреждение»."
memory: "centrala — «головной офис» или «коммутатор», а не «центр»: центр города будет centrum. Форма centrali служит трём падежам, а родительный множественного — central."
idioms:
  - { pl: "centrala telefoniczna", ru: "телефонный коммутатор" }
  - { pl: "decyzja z centrali", ru: "решение из головного офиса" }
