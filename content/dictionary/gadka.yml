etymology: "От глагола GADAĆ, праславянское *gadati, которое означало «говорить, высказывать предположение». И вот здесь корень действительно общий с русским «гадать»: исходное значение было «строить догадки, рассуждать вслух», откуда русский развил предсказание, а польский — говорение вообще. Русский сохранил и второй побег того же корня в слове «догадка» и в «загадке», и именно они показывают связь лучше всего: догадка есть высказанное предположение. Так два языка разошлись по разным половинам исходного смысла, и обманчивым оказалось не родство, а значение. Суффикс -KA в GADKA образует название действия и его результата, как в ZABAWKA и WRÓŻBA."
memory: "Ловушка в глаголе: gadać значит «болтать», а не «гадать», которое по-польски wróżyć. Корень при этом общий — праслав. *gadati «высказывать предположение», — и русский сохранил его в «догадке» и «загадке», а предсказание развил отдельно. Gadka это болтовня или ходячий разговор, слово разговорное. Звучит «га́тка», с оглушением d перед k, как babka звучит «бапка». Падежи: gadce с меной k→c, gadek с беглым e."
