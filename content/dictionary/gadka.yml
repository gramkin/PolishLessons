notes:
  - { kind: false-friend, text: "Опасность в глаголе, от которого слово образовано. Польское GADAĆ значит «говорить, болтать», а русское «гадать» — предсказывать, ворожить, и ничего общего между ними нет: совпадение чисто звуковое. Поэтому ON CIĄGLE GADA значит «он без умолку болтает», а не «он гадает»; гадать по-польски WRÓŻYĆ. GADKA, в свою очередь, означает болтовню, пустой разговор или ходячий рассказ. Второе: слово это разговорное, и в письменном тексте вместо него стоит ROZMOWA, POGŁOSKA или PLOTKA, смотря по смыслу." }
  - { kind: usage, text: "Десять форм, женский род. Дательный и местный единственного — GADCE, с обязательной меной K в C перед окончанием -E; родительный множественного — GADEK, с беглым E. Та же пара правил работает в соседних карточках HISTORYJCE и TABLETCE, так что три слова показывают один образец. Множественное GADKI употребляется о разговорах на какую-то тему и требует предлога O с местным: GADKI O PIENIĄDZACH. Устойчивое GADKA SZMATKA — рифмованное выражение о пустой болтовне, и второе слово в нём самостоятельного значения не имеет." }
  - { kind: pronunciation, text: "Читается «га́тка», два слога, ударение на первом. Главное — оглушение: звонкое D перед глухим K превращается в «т», поэтому середина слова звучит «тк», а не «дк». То же самое происходит в BABKA, которое звучит «бапка». В форме GADCE сочетание DC читается «тц»: «га́тце». В форме GADEK беглое E возвращает звонкость D: «га́дэк». В форме GADKĄ последнее Ą даёт «он»: «га́ткон»." }
  - { kind: register, text: "Слово разговорное, с лёгким оттенком пренебрежения, и в официальном тексте неуместно. Устойчивые выражения: GADKA SZMATKA «пустая болтовня», PUSTA GADKA, SUCHA GADKA о разговоре ни о чём. Производные того же гнезда очень живые: GADAĆ, GADUŁA «болтун», GADANINA «пустословие», POGADANKA «беседа, лекция для широкой публики» — последнее слово нейтральное и школьное. Выражение NIE MA GADANIA значит «и речи быть не может» и употребляется постоянно." }
