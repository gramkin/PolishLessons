# review
id: umiejetnosc
format: 2
lemma: "umiejętność"
rank: 1970
pos: noun
pron: { cyr: "умейэ́нтносьць" }
senses:
  - id: skill
    ru: "умение, навык (приобретённый)"
    examples:
      - pl: "Człowiek posiadł umiejętność mowy."
        ru: "Человек овладел умением говорить."
        source: { kind: translated, id: 921364 }
      - pl: "Tu przydaje się umiejętność czytania między wierszami."
        ru: "Здесь пригодится умение читать между строк."
        source: { kind: translated, id: 13560500 }
      - pl: "Ta organizacja promuje umiejętność czytania i pisania na obszarach rolnych."
        ru: "Эта организация продвигает умение читать и писать в сельской местности."
        source: { kind: translated, id: 674639 }
      - pl: "Masz jakieś umiejętności?"
        ru: "У тебя есть какие-нибудь умения?"
        source: { kind: translated, id: 5105323 }
      - pl: "Umiejętności dają chleb."
        ru: "Умения дают хлеб."
        source: { kind: translated, id: 822168 }
      - pl: "Krykiet jest grą wymagającą umiejętności."
        ru: "Крикет — игра, требующая умения."
        source: { kind: translated, id: 2217755 }
  - id: skills-plural
    ru: "навыки, умения (во множественном)"
    examples:
      - pl: "Tom nie ma umiejętności społecznych."
        ru: "У Тома нет социальных навыков."
        source: { kind: translated, id: 10604125 }
      - pl: "Zbyt surowo oceniasz swoje umiejętności."
        ru: "Ты слишком строго оцениваешь свои умения."
        source: { kind: translated, id: 3760165 }
      - pl: "Mam pełne zaufanie do jego umiejętności."
        ru: "Я полностью доверяю его умениям."
        source: { kind: translated, id: 355321 }
notes:
  - { kind: usage, text: "Отличие от zdolność, у которого своя карточка: umiejętność — навык, приобретённый практикой (umiejętność czytania «умение читать»), zdolność — врождённая способность (zdolności artystyczne «художественные способности»)." }
  - { kind: usage, text: "Существительное от umieć «уметь», карточка которого уже есть. Рядом стоит и potrafić «быть в состоянии»." }
  - { kind: usage, text: "Женский род на -ość: umiejętność, umiejętności, umiejętnością — склоняется как miłość, wolność." }
collocations:
  - { pl: "umiejętność czytania", ru: "умение читать" }
  - { pl: "umiejętności społeczne", ru: "социальные навыки" }
  - { pl: "zdobyć umiejętność", ru: "приобрести навык" }
etymology: "От umieć «уметь», того же корня, что русское «уметь» и «ум». Русское «умение» построено ровно так же, от того же глагола."
memory: "umiejętność — навык, который приобретают: umiejętność czytania. А врождённая способность — это zdolność, у неё своя карточка."
idioms:
