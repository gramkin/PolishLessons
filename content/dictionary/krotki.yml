senses:
  - id: length
    ru: "короткий (о длине, размере)"
    examples:
      - pl: "Królik ma długie uszy i krótki ogon."
        ru: "У кролика длинные уши и короткий хвост."
        source: { kind: tatoeba, id: 960715 }
      - pl: "Ten przedłużacz jest za krótki."
        ru: "Этот удлинитель слишком короткий."
        source: { kind: tatoeba, id: 3751058 }
      - pl: "Ona ma krótkie włosy."
        ru: "У неё короткие волосы."
        source: { kind: tatoeba, id: 591383 }
  - id: time
    ru: "короткий, краткий (о времени)"
    note: "Как и в русском, то же слово работает и про длину, и про время: krótki ogon «короткий хвост», krótki urlop «короткий отпуск»."
    examples:
      - pl: "W lutym mieliśmy krótki urlop."
        ru: "В феврале у нас был короткий отпуск."
        source: { kind: tatoeba, id: 10115261 }
      - pl: "Życie jest bardzo krótkie."
        ru: "Жизнь очень коротка."
        source: { kind: tatoeba, id: 2987449 }
      - pl: "Życie jest za krótkie, żeby uczyć się niemieckiego."
        ru: "Жизнь слишком коротка, чтобы изучать немецкий."
        source: { kind: tatoeba, id: 716388 }
notes:
  - { kind: usage, text: "Польское -ró- отвечает русскому полногласию -оро-: krótki ~ короткий, gród ~ город, król ~ король. Узнав это соответствие, вы угадаете десятки слов." }
  - { kind: usage, text: "Степени сравнения с чередованием и без -ki: krótki → krótszy → najkrótszy. Наречие — krótko «коротко»: krótko mówiąc «короче говоря»." }
  - { kind: usage, text: "Мужско-личные формы (krótcy, krótsi) о росте человека не говорят — «низкий» будет niski. Они встречаются в переносном «немногословный»: krótki w słowach." }
collocations:
  - { pl: "krótkie włosy", ru: "короткие волосы" }
  - { pl: "w krótkim czasie", ru: "за короткое время" }
  - { pl: "na krótką metę", ru: "в краткосрочной перспективе" }
  - { pl: "krótko mówiąc", ru: "короче говоря" }
family:
  - { pl: "krótko", ru: "коротко", relation: derived }
  - { pl: "skrócić", ru: "сократить", relation: derived }
  - { pl: "skrót", ru: "сокращение", relation: derived }
etymology: "Праславянское *kortъkъ — то же слово, что русское «короткий». Русскому полногласию -оро- в польском отвечает -ró-: krótki ~ короткий, gród ~ город, król ~ король."
memory: "krótki — «короткий», и про длину, и про время. Ключ к десяткам слов: польское -ró- = русское -оро- (krótki ~ короткий, król ~ король, gród ~ город). Сравнение теряет -ki: krótszy «короче», najkrótszy «самый короткий», наречие krótko. Обороты: w krótkim czasie «за короткое время», na krótką metę «в краткосрочной перспективе», krótko mówiąc «короче говоря». О росте человека krótki не говорят — там niski."
idioms:
  - { pl: "kłamstwo ma krótkie nogi", ru: "у лжи короткие ноги" }
  - { pl: "na krótką metę", ru: "в краткосрочной перспективе" }
  - { pl: "krótko mówiąc", ru: "короче говоря" }
