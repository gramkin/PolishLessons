  - { form: "przeszkadzanie", reason: "отглагольного существительного от przeszkadzać нет; «препятствие» — это przeszkoda" }
  - { form: "przeszkadzaniem", reason: "отглагольного существительного от przeszkadzać нет; «препятствие» — это przeszkoda" }
  - { form: "przeszkadzaniu", reason: "отглагольного существительного от przeszkadzać нет; «препятствие» — это przeszkoda" }
