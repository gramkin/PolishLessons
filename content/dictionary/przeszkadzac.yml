# review
id: przeszkadzac
format: 2
lemma: "przeszkadzać"
rank: 798
pos: verb
aspect: imperf
pron: { cyr: "пшэшка́дзаць" }
senses:
  - id: disturb
    ru: "przeszkadzać KOMUŚ — мешать кому-л. (дательный)"
    note: "Управление совпадает с русским."
    examples:
      - pl: "Nie przeszkadzaj mi."
        ru: "Не мешай мне."
        source: { kind: tatoeba, id: 6154739 }
      - pl: "Przeszkadzasz mi."
        ru: "Ты мне мешаешь."
        source: { kind: translated, id: 4388683 }
      - pl: "Oni przeszkadzają mi."
        ru: "Они мне мешают."
        source: { kind: translated, id: 2842596 }
  - id: do-not-disturb
    ru: "Nie przeszkadzać! — Не беспокоить!"
    examples:
      - pl: "Nie przeszkadzać!"
        ru: "Не беспокоить!"
        source: { kind: translated, id: 11261851 }
      - pl: "Nie przeszkadzaj!"
        ru: "Не мешай!"
        source: { kind: translated, id: 716705 }
      - pl: "Nie przeszkadzajcie!"
        ru: "Не мешайте!"
        source: { kind: translated, id: 8768803 }
  - id: interfere
    ru: "przeszkadzać W czymś — мешать в чём-л."
    examples:
      - pl: "Nie pochwalam szkół. Przeszkadzają w edukacji."
        ru: "Я не одобряю школ. Они мешают образованию."
        source: { kind: tatoeba, id: 5468536 }
      - pl: "Muchy i komary przeszkadzały mu w medytacji."
        ru: "Мухи и комары мешали ему медитировать."
        source: { kind: translated, id: 742709 }
      - pl: "Jego natrętne zachowanie przeszkadzało wszystkim, ale nikt z nich nie protestował."
        ru: "Его назойливое поведение мешало всем, но никто не протестовал."
        source: { kind: translated, id: 2282952 }
  - id: proverb
    ru: "Złej baletnicy przeszkadza rąbek u spódnicy"
    examples:
      - pl: "Złej baletnicy przeszkadza rąbek u spódnicy."
        ru: "У плохого мастера всегда инструмент виноват."
        source: { kind: tatoeba, id: 13657518 }
      - pl: "Przeszkadzam?"
        ru: "Я мешаю?"
        source: { kind: translated, id: 4287105 }
      - pl: "Przepraszam, że ci tak często przeszkadzam."
        ru: "Извини, что я тебя беспокою так часто."
        source: { kind: tatoeba, id: 2417197 }
notes:
  - { kind: government, text: "przeszkadzać KOMUŚ — дательный падеж, ровно как русское «мешать кому-то»: Nie przeszkadzaj mi. А «мешать в чём-то» — przeszkadzać W czymś, с предложным: przeszkadzać w pracy." }
  - { kind: usage, text: "Nie przeszkadzać! — та самая табличка на двери, «Не беспокоить»." }
  - { kind: usage, text: "Пословица Złej baletnicy przeszkadza rąbek u spódnicy буквально значит «плохой балерине мешает подол юбки»; по-русски это «плохому танцору…» или «у плохого мастера инструмент виноват»." }
  - { kind: usage, text: "Слово собрано от szkodzić «вредить», то есть от того же корня, что szkoda. Существительное — przeszkoda «препятствие», совершенный вид — przeszkodzić." }
collocations:
  - { pl: "przeszkadzać komuś", ru: "мешать кому-либо" }
  - { pl: "nie przeszkadzać", ru: "не мешать" }
  - { pl: "przeszkadzać w pracy", ru: "мешать в работе" }
  - { pl: "przeszkoda", ru: "препятствие" }
family:
  - { pl: "szkodzić", ru: "вредить", relation: root }
  - { pl: "szkoda", ru: "вред, ущерб", relation: root }
  - { pl: "przeszkoda", ru: "препятствие", relation: derived }
  - { pl: "przeszkodzić", ru: "помешать", relation: aspect }
etymology: "prze- + szkodzić «вредить», от szkoda «вред» — то же гнездо, что карточка szkoda."
memory: "przeszkadzać — «мешать», и собрано оно от szkodzić «вредить», то есть от того же корня, что szkoda. Управление тут совпадает с русским: przeszkadzać KOMUŚ, дательный падеж — Nie przeszkadzaj mi. Существительное — przeszkoda «препятствие». А пословица Złej baletnicy przeszkadza rąbek u spódnicy — это наше «плохому танцору…»."
idioms:
  - { pl: "Nie przeszkadzać!", ru: "Не беспокоить!" }
  - { pl: "przeszkadzać komuś", ru: "мешать кому-либо" }
  - { pl: "Złej baletnicy przeszkadza rąbek u spódnicy", ru: "плохому танцору всё мешает" }
formExamplesSkip:
