# review
id: odpowiedz
format: 2
lemma: "odpowiedź"
rank: 583
pos: noun
pron: { cyr: "одпо́ведзь" }
senses:
  - id: answer
    ru: "ответ"
    note: "odpowiedź na pytanie «ответ на вопрос» — с предлогом na и винительным."
    examples:
      - pl: "Znalazłeś odpowiedź."
        ru: "Ты нашёл ответ."
        source: { kind: tatoeba, id: 4512278 }
      - pl: "Odpowiedź była pozytywna."
        ru: "Ответ был положительным."
        source: { kind: tatoeba, id: 418330 }
      - pl: "Czekam na odpowiedź."
        ru: "Я жду ответа."
        source: { kind: tatoeba, id: 8428283 }
  - id: reply
    ru: "ответ (письменный, официальный)"
    note: "otrzymać odpowiedź «получить ответ»."
    examples:
      - pl: "Jackson nie otrzymał odpowiedzi na swój list."
        ru: "Джексон не получил ответа на своё письмо."
        source: { kind: tatoeba, id: 7960817 }
      - pl: "Odpowiedzi należy zapisać w zeszycie."
        ru: "Ответы должны быть записаны в тетрадь."
        source: { kind: tatoeba, id: 2147250 }
      - pl: "Szukałem odpowiedzi na twoje pytanie."
        ru: "Я искал ответ на твой вопрос."
        source: { kind: tatoeba, id: 3152883 }
notes:
  - { kind: government, text: "odpowiedź na pytanie «ответ на вопрос» — с предлогом na и винительным, ровно как в русском." }
  - { kind: usage, text: "Склонение синкретичное: форма odpowiedzi служит сразу родительным, дательным, предложным и именительным множественного. Различает контекст." }
  - { kind: usage, text: "Глагол — odpowiedzieć «ответить», odpowiadać «отвечать»; отсюда же odpowiedzialny «ответственный»." }
  - { kind: usage, text: "Частые сочетания: czekać na odpowiedź «ждать ответа», udzielić odpowiedzi «дать ответ», brak odpowiedzi «отсутствие ответа»." }
collocations:
  - { pl: "odpowiedź na pytanie", ru: "ответ на вопрос" }
  - { pl: "czekać na odpowiedź", ru: "ждать ответа" }
  - { pl: "szybka odpowiedź", ru: "быстрый ответ" }
  - { pl: "brak odpowiedzi", ru: "нет ответа" }
family:
  - { pl: "odpowiedzieć", ru: "ответить", relation: root }
  - { pl: "odpowiadać", ru: "отвечать", relation: derived }
  - { pl: "odpowiedzialny", ru: "ответственный", relation: derived }
etymology: "От odpowiedzieć «ответить», из od- плюс powiedzieć «сказать» — буквально «сказать в ответ». Русское «ответить» собрано так же: от + вет (речь), как в «завет» и «привет»."
memory: "odpowiedź — «ответ», и управление совпадает с русским: odpowiedź na pytanie, с na и винительным. Главная особенность в склонении: форма odpowiedzi покрывает сразу четыре места — родительный, дательный, предложный и именительный множественного, — так что падеж подсказывает только контекст. Глагол — odpowiedzieć, а odpowiedzialny значит «ответственный»."
idioms:
