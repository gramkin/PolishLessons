etymology: "Образовано от глагола TRWAĆ «длиться, держаться» с суффиксом -ały, как DOJRZAŁY от DOJRZEĆ. Русскому эта основа незнакома, но в польском она очень продуктивна: PRZETRWAĆ «пережить», WYTRWAĆ «выдержать», TRWAŁOŚĆ «прочность»."
memory: "TRWAĆ «длиться» → TRWAŁY «то, что продолжает держаться», то есть прочный и стойкий. Не путать с «длительным»: это DŁUGOTRWAŁY. И не забыть про NA TRWAŁE «навсегда» и TRWAŁA «завивка»."
idioms:
