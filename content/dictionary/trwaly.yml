notes:
  - { kind: false-friend, text: "TRWAŁY не значит «длительный». Он описывает то, что держится и не разрушается: TRWAŁY POKÓJ «прочный мир», TRWAŁY KOLOR «стойкий цвет», TRWAŁE BUTY «прочные ботинки». Длительность, то есть сколько что-то тянется, передаёт DŁUGOTRWAŁY или DŁUGI: DŁUGOTRWAŁA CHOROBA «длительная болезнь». Слово образовано от глагола TRWAĆ «длиться», и отсюда ловушка: формы TRWAŁY, TRWAŁA, TRWALI совпадают с прошедшим временем этого глагола. OKLASKI TRWAŁY GODZINĘ значит «аплодисменты длились час», и это глагол, а TRWAŁY SUKCES «прочный успех» это прилагательное. Различает их только контекст: после прилагательного обычно стоит существительное или оно стоит при BYĆ." }
  - { kind: usage, text: "Прилагательное градуируется: TRWAŁY, TRWALSZY, NAJTRWALSZY. При этом Ł сменяется на L, как в BIAŁY → BIELSZY и MIŁY → MILSZY: перед окончанием -SZY твёрдое Ł всегда переходит в L. Поэтому сравнительная степень пишется и звучит с L: TRWALSZY «трва́льшы». О людях это слово почти не говорят: стойкого человека называют WYTRWAŁY, постоянного партнёра STAŁY. Поэтому мужско-личные формы множественного числа TRWALI, TRWALSI, NAJTRWALSI на карточке не иллюстрируются, а TRWALI в живой речи почти всегда прошедшее время от TRWAĆ." }
  - { kind: register, text: "Две устойчивые единицы стоит знать отдельно. TRWAŁA, субстантивированная форма женского рода, значит «химическая завивка, перманент»: ZROBIĆ SOBIE TRWAŁĄ «сделать себе завивку». ŚRODEK TRWAŁY в бухгалтерии это «основное средство», имущество, которое служит дольше года. И оборот NA TRWAŁE «навсегда, надолго»: WEJŚĆ NA TRWAŁE DO JĘZYKA «прочно войти в язык»." }
