  - { pl: "nie ma nic trwalszego niż prowizorka", ru: "нет ничего более постоянного, чем временное" }
formExamplesSkip:
  - { form: "trwali", reason: "о людях это прилагательное не говорят: стойкий человек — wytrwały, постоянный — stały. Форма trwali в речи почти всегда прошедшее время глагола trwać («они длились, пребывали»), а мужско-личная форма прилагательного естественного употребления не имеет" }
  - { form: "trwalsi", reason: "о людях это прилагательное не говорят: стойкий человек — wytrwały, постоянный — stały. Мужско-личная форма сравнительной степени естественного употребления не имеет" }
  - { form: "najtrwalsi", reason: "о людях это прилагательное не говорят: стойкий человек — wytrwały, постоянный — stały. Мужско-личная форма превосходной степени естественного употребления не имеет" }
