# review
id: koniec
format: 2
lemma: "koniec"
rank: 152
pos: noun
pron: { cyr: "ко́нец" }
senses:
  - id: end
    ru: "конец, окончание"
    examples:
      - pl: "Koniec gry."
        ru: "Конец игры."
        source: { kind: tatoeba, id: 757218 }
      - pl: "To już koniec."
        ru: "Это конец."
        source: { kind: tatoeba, id: 560174 }
      - pl: "Twój koniec jest bliski."
        ru: "Твой конец близок."
        source: { kind: tatoeba, id: 8664051 }
  - id: finally
    ru: "w końcu — наконец, в конце концов"
    examples:
      - pl: "W końcu nie przyszedł."
        ru: "В итоге он так и не пришел."
        source: { kind: tatoeba, id: 827784 }
      - pl: "W końcu się obudziłem."
        ru: "Я наконец проснулся."
        source: { kind: tatoeba, id: 12478540 }
      - pl: "W końcu poniósł porażkę."
        ru: "В конце концов он проиграл."
        source: { kind: tatoeba, id: 361066 }
notes:
  - { kind: usage, text: "Беглая гласная: koniec, но końca, końcowi, końcem — «ie» выпадает во всех падежах, кроме именительного." }
  - { kind: usage, text: "w końcu — «наконец»; do końca — «до конца»; na końcu — «в конце»; koniec końców — «в конце концов»." }
collocations:
  - { pl: "w końcu", ru: "наконец" }
  - { pl: "do końca", ru: "до конца" }
  - { pl: "na końcu", ru: "в конце" }
  - { pl: "koniec tygodnia", ru: "конец недели" }
etymology: "Праславянское *konьcь — то же слово, что русское «конец»; тот же корень, что в początek «начало» (kon- «предел»)."
memory: "Беглая гласная: koniec, но końca, końcem. Три связки: w końcu «наконец», koniec końców «в конце концов», bez końca «без конца»."
idioms:
  - { pl: "koniec końców", ru: "в конце концов" }
  - { pl: "bez końca", ru: "без конца" }
  - { pl: "każdy kij ma dwa końce", ru: "у каждой палки два конца" }
