# review
id: wszystek
format: 2
lemma: "wszystek"
rank: 77
pos: adj
pron: { cyr: "фшы́стэк" }
senses:
  - id: all
    ru: "весь, все (книжное)"
    examples:
      - pl: "To dotyczy wszystkich."
        ru: "Это касается всех."
        source: { kind: tatoeba, id: 6069713 }
      - pl: "Wszystkie psy żyją."
        ru: "Все собаки живы."
        source: { kind: tatoeba, id: 366704 }
      - pl: "Tom nie wie wszystkiego."
        ru: "Том не знает всего."
        source: { kind: tatoeba, id: 4790165 }
  - id: everyone
    ru: "wszyscy — все (о людях)"
    examples:
      - pl: "Wszyscy kłamią."
        ru: "Мы все врём."
        source: { kind: tatoeba, id: 1012418 }
      - pl: "Wszystkim wam zimno?"
        ru: "Вам всем холодно?"
        source: { kind: tatoeba, id: 6320946 }
notes:
  - { kind: usage, text: "В единственном числе слово архаично: «весь день» — cały dzień, а не wszystek dzień. Живут формы множественного: wszyscy, wszystkie, wszystkich." }
  - { kind: usage, text: "wszyscy — о людях, wszystkie — обо всём остальном." }
collocations:
  - { pl: "wszyscy razem", ru: "все вместе" }
  - { pl: "ze wszech miar", ru: "во всех отношениях" }
  - { pl: "przede wszystkim", ru: "прежде всего" }
etymology: "Праславянское *vьsь «весь» с расширением -tek; тот же корень, что в русском «весь» и «вселенная»."
memory: "В единственном числе слово почти вымерло: «весь день» — это cały dzień. Зато множественное живее всех живых, и оно раздваивается: wszyscy о людях, wszystkie обо всём остальном."
idioms:
  - { pl: "ze wszech miar", ru: "во всех отношениях" }
  - { pl: "przede wszystkim", ru: "прежде всего" }
  - { pl: "wszystkiego najlepszego", ru: "всего наилучшего!; с днём рождения!" }
