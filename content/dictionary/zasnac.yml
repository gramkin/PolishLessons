senses:
  - id: fall-asleep
    ru: "заснуть"
    examples:
      - pl: "Zasnął przy książce."
        ru: "Он заснул за книгой."
        source: { kind: authored }
      - pl: "Nie mogłem zasnąć do trzeciej."
        ru: "Я не мог заснуть до трёх."
        source: { kind: authored }
      - pl: "Dzieci zasną w samochodzie."
        ru: "Дети заснут в машине."
        source: { kind: authored }
  - id: falling-asleep
    ru: "zaśnięcie — засыпание"
    examples:
      - pl: "Przed zaśnięciem czyta dwie strony."
        ru: "Перед сном он читает две страницы."
        source: { kind: authored }
      - pl: "Do zaśnięcia potrzebuje ciszy."
        ru: "Чтобы заснуть, ему нужна тишина."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Ловушки нет: za- плюс snąć, от sen «сон», праславянское *sъpnǫti — то же слово, что русское «заснуть». Всё гнездо прозрачно: sen «сон», spać «спать», senny «сонный», usnąć «уснуть». Запоминать нечего, кроме чередования в основе." }
  - { kind: usage, text: "Объём парадигмы — 42 формы, и страдательного причастия среди них нет: глагол НЕПЕРЕХОДНЫЙ, винительного дополнения у него не бывает, значит и подлежащего для страдательного оборота взять негде. Формы вроде *zaśnięty не существует. Так же ведут себя wylądować, powrócić, śmierdzieć и dreptać." }
  - { kind: government, text: "Дополнения глагол не берёт вовсе, зато охотно присоединяет обстоятельства: zasnąć PRZY książce «заснуть за книгой», zasnąć NAD zeszytem «заснуть над тетрадью», zasnąć ZA kierownicą «заснуть за рулём». Оборот zasnąć na wieki — мягкий эвфемизм, отвечающий русскому «уснуть навеки»." }
  - { kind: pronunciation, text: "ПРАВИЛО, которое стоит усвоить один раз. В польском настоящем времени первое лицо единственного и третье лицо множественного ведут себя ОДИНАКОВО и отличаются от всех клеток между ними. Здесь: więżę и więżą с ж, но więzisz, więzi, więzimy, więzicie с зь; и zasnę, zasną с твёрдым s, но zaśniesz, zaśnie, zaśniemy, zaśniecie с сь. То же у piekę/pieką против pieczesz и wpuszczę/wpuszczą против wpuścisz. Края парадигмы держатся вместе против её середины." }
collocations:
  - { pl: "zasnąć przy książce", ru: "заснуть за книгой" }
  - { pl: "zasnąć za kierownicą", ru: "заснуть за рулём" }
  - { pl: "przed zaśnięciem", ru: "перед сном" }
family:
  - { pl: "sen", ru: "сон", relation: root, id: sen }
  - { pl: "spać", ru: "спать", relation: root, id: spac }
  - { pl: "zasypiać", ru: "засыпать", relation: aspect }
etymology: "Приставка za- плюс snąć, от праславянского *sъpnǫti «заснуть», того же корня, что sen «сон» и spać «спать». Русское «заснуть» собрано из тех же частей, и всё гнездо совпадает: «сон», «спать», «сонный», «уснуть». Расхождение только в огласовке носового: польское -ną- против русского -ну-."
memory: "zasnąć — «заснуть», от sen «сон», часть в часть. Запомните только края парадигмы: zasnę и zasną с твёрдым s, но zaśniesz, zaśnie, zaśnij с сь. Страдательного причастия у глагола нет — он непереходный."
idioms:
