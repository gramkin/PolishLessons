etymology: "От глагола KLĄĆ «клясть, заклинать», из праславянского *klęti — того же корня, что русские «клясть», «клятва», «проклятие», «заклинание». Исходное значение было обрядовым: произнести слова, которые связывают, призвав в свидетели высшую силу. Дальше корень раздвоился, и языки выбрали разные половины. Русский закрепил за ним торжественное обещание и получил «клятву», оставив проклятие за приставочным «проклятием». Польский пошёл обратным путём: KLĄTWA есть именно проклятие, а для обещания взял PRZYSIĘGA, от SIĘGAĆ «дотягиваться», буквально «протягивание руки» — тот же жест, что в русском «присяга», и слово это русскому как раз знакомо. Так что каждое из двух значений в обоих языках есть, но распределены они перекрёстно."
memory: "Не «клятва»! klątwa — это проклятие, а клятва по-польски przysięga. Корень общий, *klęti, и языки поделили его перекрёстно: русский взял обещание, польский — проклятие. Ряд для памяти: klątwa проклятие, przeklinać проклинать, przysięga клятва. Читается «кло́нтфа», с оглушением tw в «тф»."
