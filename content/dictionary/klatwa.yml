notes:
  - { kind: false-friend, text: "Это один из самых опасных ложных друзей во всём словаре, потому что слова совпадают почти буквами. Польская KLĄTWA — это ПРОКЛЯТИЕ, а не «клятва». Русская «клятва», то есть торжественное обещание, по-польски PRZYSIĘGA, а глагол «клясться» — PRZYSIĘGAĆ. При этом корень у польской KLĄTWA и русской «клятвы» действительно общий, праславянское *klęti «клясть, заклинать», и именно поэтому ошибка так естественна. Русский развил из корня идею обещания, польский — идею проклятия, и получилась ловушка, в которую попадают даже опытные. Запомнить помогает ряд: KLĄTWA — проклятие, PRZEKLINAĆ — проклинать, PRZYSIĘGA — клятва." }
  - { kind: pronunciation, text: "Читается «кло́нтфа», ударение на первом слоге из двух. Носовая ą перед t даёт «он», как в SĄD «сонт» и WĄTROBA «вонтро́ба». Дальше важная мелочь: сочетание TW на конце слога оглушается, и W звучит как «ф», поэтому не «клонтва», а «кло́нтфа». В местном и дательном падеже KLĄTWIE буква W смягчается перед -IE и звучит «ве»: «кло́нтве», и оглушения там уже нет, потому что за W идёт гласная." }
  - { kind: government, text: "Женский род на -A. Винительный на -Ę: RZUCIŁ KLĄTWĘ. Главные сочетания строятся с разными предлогами, и их стоит выучить блоком: RZUCIĆ KLĄTWĘ NA KOGOŚ «наложить проклятие на кого-то», с винительным после NA; KLĄTWA CIĄŻY NAD KIMŚ «проклятие тяготеет над кем-то», с творительным после NAD; ZDJĄĆ Z KOGOŚ KLĄTWĘ «снять с кого-то проклятие», с родительным после Z. При отрицании винительный уходит в родительный: NIE RZUCIŁ KLĄTWY." }
  - { kind: register, text: "Слово книжное и повествовательное: оно живёт в сказках, исторических романах и в церковной истории. В обиходной речи проклятие как ругательство — это PRZEKLEŃSTWO, а выругаться — PRZEKLINAĆ или KLĄĆ. Разница в том, что KLĄTWA есть нечто наложенное, с последствиями и сроком, а PRZEKLEŃSTWO — просто брошенное злое слово. В церковном смысле точный термин — KLĄTWA KOŚCIELNA или латинское EKSKOMUNIKA, и в документах употребляют второе." }
