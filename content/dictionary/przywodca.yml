notes:
  - { kind: government, text: "После być и zostać стоит в творительном падеже: jesteś urodzonym przywódcą «ты прирождённый лидер»." }
  - { kind: usage, text: "Слово мужского рода, но склоняется по женскому образцу: przywódca, przywódcy, przywódcę, przywódcą — как kolega и mężczyzna." }
  - { kind: usage, text: "Более нейтральные слова — lider (заимствование) и szef «начальник»; przywódca звучит крупнее, про вождя нации или движения." }
  - { kind: false-friend, text: "Образовано от przywodzić «приводить, возглавлять»: буквально «тот, кто ведёт впереди». Русское «предводитель» собрано тем же способом." }
