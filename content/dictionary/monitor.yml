# review
id: monitor
format: 2
lemma: "monitor"
rank: 5313
pos: noun
pron: { cyr: "мони́тор" }
senses:
  - id: screen
    ru: "монитор, экран"
    examples:
      - pl: "Kupiłem nowy monitor do komputera."
        ru: "Я купил новый монитор для компьютера."
        source: { kind: authored }
      - pl: "Siedzi przed monitorem cały dzień."
        ru: "Он весь день сидит перед монитором."
        source: { kind: authored }
      - pl: "Monitor się zepsuł."
        ru: "Монитор сломался."
        source: { kind: authored }
  - id: medical
    ru: "монитор (медицинский), прибор контроля"
    examples:
      - pl: "Monitor pokazuje tętno pacjenta."
        ru: "Монитор показывает пульс пациента."
        source: { kind: authored }
      - pl: "Pielęgniarka zerknęła na monitor."
        ru: "Медсестра взглянула на монитор."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "MONITOR — «монитор», как в русском. Экран телефона или телевизора — чаще EKRAN. MONITOR POLSKI — официальная правительственная газета, «Польский вестник»." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Родительный — MONITORA, с -A. В местном R переходит в RZ: NA MONITORZE." }
  - { kind: government, text: "На мониторе — NA MONITORZE, местный. Перед монитором — PRZED MONITOREM, творительный. Подключить монитор — PODŁĄCZYĆ MONITOR." }
  - { kind: pronunciation, text: "Читается «мони́тор», ударение на предпоследнем слоге. MONITORZE — «монито́жэ»." }
collocations:
  - { pl: "monitor komputerowy", ru: "компьютерный монитор" }
  - { pl: "na monitorze", ru: "на мониторе" }
  - { pl: "siedzieć przed monitorem", ru: "сидеть за компьютером" }
family:
  - { pl: "ekran", ru: "экран", relation: root, id: ekran }
  - { pl: "komputer", ru: "компьютер", relation: root, id: komputer }
  - { pl: "monitoring", ru: "видеонаблюдение", relation: derived, id: monitoring }
etymology: "Из латинского MONITOR «надзиратель, советчик», от MONERE «предупреждать». Русское «монитор» — то же слово."
memory: "Monitor — монитор. Na monitorze — на мониторе. Siedzieć przed monitorem — сидеть за компьютером. Читается «мони́тор»."
idioms:
  - { pl: "przyklejony do monitora", ru: "не отрывающийся от экрана" }
