etymology: "Из u- + myśl «мысль», того же корня, что myśleć «думать». Русское «умысел» — то же слово, но значение в русском ушло в сторону «намерения»."
memory: "umysł — «ум, разум». Внутри сидит myśl «мысль», а русский родственник — «умысел», хотя значение у него другое. Запомните два оборота: otwarty umysł «открытый ум» и zdrowy na umyśle «в здравом уме». Прилагательное — umysłowy."
idioms:
