        source: { kind: translated, id: 3031581 }
      - pl: "Spróbuj odtworzyć muzykę w swoim umyśle."
        ru: "Попробуй воспроизвести музыку в уме."
        source: { kind: translated, id: 12329101 }
notes:
  - { kind: usage, text: "zdrowy na umyśle — «в здравом уме»; nikt przy zdrowym umyśle «никто в здравом уме». Оба оборота очень частые." }
  - { kind: usage, text: "otwarty umysł — «открытый ум», о человеке без предрассудков: Musisz mieć otwarty umysł." }
  - { kind: usage, text: "Прилагательное — umysłowy «умственный»: praca umysłowa «умственный труд», choroba umysłowa «душевная болезнь»." }
  - { kind: usage, text: "Рядом живёт rozum «разум, рассудок» — оно ближе к практической смекалке, тогда как umysł это ум как способность мыслить." }
collocations:
