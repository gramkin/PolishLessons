# review
id: przestrzen
format: 2
lemma: "przestrzeń"
rank: 1640
pos: noun
pron: { cyr: "пшэ́стшень" }
senses:
  - id: space
    ru: "пространство"
    examples:
      - pl: "Tom patrzył w przestrzeń."
        ru: "Том смотрел в пространство."
        source: { kind: translated, id: 3960523 }
      - pl: "Słowa podróżują przez przestrzeń."
        ru: "Слова путешествуют через пространство."
        source: { kind: translated, id: 365757 }
      - pl: "Naruszasz moją przestrzeń osobistą."
        ru: "Ты нарушаешь моё личное пространство."
        source: { kind: translated, id: 5458653 }
  - id: outer-space
    ru: "przestrzeń kosmiczna — космическое пространство"
    examples:
      - pl: "Jak znajdziesz żywność w przestrzeni kosmicznej?"
        ru: "Как ты найдёшь еду в космическом пространстве?"
        source: { kind: translated, id: 600705 }
      - pl: "Pierwszy spacer w przestrzeni kosmicznej trwał 10 minut."
        ru: "Первый выход в космическое пространство длился 10 минут."
        source: { kind: translated, id: 5585133 }
      - pl: "W przestrzeni, nikt nie słyszy twojego krzyku."
        ru: "В космосе никто не услышит твоего крика."
        source: { kind: translated, id: 3031625 }
  - id: room-for
    ru: "место, простор (для чего-либо)"
    examples:
      - pl: "Powinieneś dać mu trochę przestrzeni."
        ru: "Тебе следует дать ему немного пространства."
        source: { kind: translated, id: 4101573 }
      - pl: "Zawsze jest przestrzeń na udoskonalenia."
        ru: "Всегда есть пространство для улучшений."
        source: { kind: translated, id: 13460864 }
notes:
  - { kind: usage, text: "Существительное женского рода на мягкую основу: przestrzeń, przestrzeni, przestrzenią. Родительный и предложный совпадают — przestrzeni." }
  - { kind: usage, text: "przestrzeń kosmiczna — «космическое пространство»; przestrzeń osobista — «личное пространство»." }
  - { kind: usage, text: "na przestrzeni lat значит «на протяжении лет» — пространственное слово в роли временного, как и в русском." }
  - { kind: usage, text: "Прилагательное — przestronny «просторный»; рядом стоит przestrzenny «пространственный»." }
collocations:
  - { pl: "przestrzeń kosmiczna", ru: "космическое пространство" }
  - { pl: "przestrzeń osobista", ru: "личное пространство" }
  - { pl: "na przestrzeni lat", ru: "на протяжении лет" }
etymology: "От przestronny «просторный», корень *stor-/*ster- «расстилать». Русское «пространство» построено от «простереть» — тот же корень и та же метафора протяжённости."
memory: "przestrzeń = «пространство», женского рода на мягкую основу: przestrzeni, przestrzenią. Держите сочетания: przestrzeń kosmiczna «космос», przestrzeń osobista «личное пространство», na przestrzeni lat «на протяжении лет»."
