notes:
  - { kind: government, text: "ZAOPIEKOWAĆ SIĘ KIMŚ — ТВОРИТЕЛЬНЫЙ ПАДЕЖ, БЕЗ ПРЕДЛОГА. Русское «позаботиться О ком-л.» требует предложного с предлогом, польское же ставит голый творительный: zaopiekować się dzieckiEM, babciĄ, psEM. Калька «zaopiekować się o kogoś» — ошибка. Тот же творительный у существительного в обороте OPIEKA NAD KIMŚ, но там уже появляется предлог nad." }
  - { kind: usage, text: "Глагол без SIĘ не употребляется: нельзя «zaopiekować kogoś», только zaopiekować SIĘ kimś. Отсюда и отсутствие страдательного причастия — 42 формы вместо 53. Это седьмой такой случай в словаре после współczuć, zajrzeć, wpadać, patrzeć, występować и lądować. Безличное ZAOPIEKOWANO при этом есть и тоже требует się: zaopiekowano się nim." }
  - { kind: usage, text: "Корень русскому знаком целиком: OPIEKA — «опека», OPIEKUN — «опекун», OPIEKOWAĆ SIĘ — «опекать, заботиться». Приставка za- придаёт совершенный вид и оттенок начала: zaopiekować się значит взять под опеку, а не опекать вообще. Несовершенная пара — OPIEKOWAĆ SIĘ." }
collocations:
  - { pl: "zaopiekować się dzieckiem", ru: "позаботиться о ребёнке" }
  - { pl: "zaopiekować się psem", ru: "присмотреть за собакой" }
  - { pl: "opieka nad chorym", ru: "уход за больным" }
family:
  - { pl: "opiekować się", ru: "заботиться, опекать (несов.)", relation: aspect, id: opiekowac }
  - { pl: "opieka", ru: "опека, забота", relation: root, id: opieka }
  - { pl: "opiekun", ru: "опекун", relation: root }
etymology: "Приставка za- и opiekować się, от OPIEKA, из праславянского *pekti «печься, заботиться» — того же корня, что русские «опека», «опекун», «печься о ком-л.» и даже «печаль». Исходный образ общий: заботиться значило «печься», как о хлебе в печи. Поэтому всё гнездо русскому понятно без словаря, кроме одного — падежа."
memory: "Главное — падеж: zaopiekować się KIMŚ, творительный без предлога, а не «o kogoś». И глагол без się не существует вовсе, отсюда и нет страдательного причастия."
idioms:
  - { pl: "zaopiekować się kimś jak własnym dzieckiem", ru: "позаботиться о ком-л. как о родном ребёнке" }
  - { pl: "wziąć kogoś pod opiekę", ru: "взять кого-л. под опеку" }
