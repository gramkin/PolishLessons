    examples:
      - pl: "Zaopiekuj się dziećmi przez godzinę."
        ru: "Присмотри за детьми часок."
        source: { kind: authored }
      - pl: "Zaopiekowano się porzuconym kotem tego samego dnia."
        ru: "О брошенном коте позаботились в тот же день."
