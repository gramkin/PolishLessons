notes:
  - { kind: usage, text: "Корень тот же, что в русском «заблуждении»: błądzić значит «блуждать». Ошибка мыслится как сбившийся с пути." }
  - { kind: usage, text: "być w błędzie — «заблуждаться, ошибаться»: Jesteś w błędzie «Ты ошибаешься»." }
  - { kind: false-friend, text: "czeski błąd — так поляки называют перестановку цифр или букв, вроде 12 вместо 21. К чешскому языку это отношения не имеет." }
  - { kind: usage, text: "Ошибку совершают: popełnić błąd «совершить ошибку», naprawić błąd «исправить ошибку», uczyć się na błędach «учиться на ошибках»." }
collocations:
  - { pl: "popełnić błąd", ru: "совершить ошибку" }
  - { pl: "być w błędzie", ru: "заблуждаться" }
  - { pl: "naprawić błąd", ru: "исправить ошибку" }
  - { pl: "czeski błąd", ru: "перестановка цифр" }
etymology: "От błądzić «блуждать», праславянское *blǫditi. Русские «блуждать» и «заблуждение» — то же гнездо: ошибка мыслится как сбившийся с пути."
memory: "błąd — «ошибка», и корень тот же, что в русском «заблуждении»: błądzić значит «блуждать». Ошибиться — это буквально сбиться с пути. Запомните два оборота: być w błędzie «заблуждаться» и czeski błąd — так поляки называют перестановку цифр или букв, вроде 12 вместо 21."
idioms:
  - { pl: "być w błędzie", ru: "заблуждаться" }
  - { pl: "czeski błąd", ru: "перестановка цифр" }
  - { pl: "uczyć się na błędach", ru: "учиться на ошибках" }
formExamplesSkip:
