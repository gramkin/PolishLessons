# review
id: wplyw
format: 2
lemma: "wpływ"
rank: 1359
pos: noun
pron: { cyr: "фпуы́ф" }
senses:
  - id: influence
    ru: "влияние, воздействие"
    examples:
      - pl: "Palenie ma wpływ na zdrowie."
        ru: "Курение влияет на здоровье."
        source: { kind: translated, id: 368105 }
      - pl: "Ma wielki wpływ na swój kraj."
        ru: "Он имеет большое влияние на свою страну."
        source: { kind: translated, id: 368101 }
      - pl: "Nie mają wpływu na środowisko."
        ru: "Они не влияют на окружающую среду."
        source: { kind: translated, id: 840314 }
  - id: under-influence
    ru: "pod wpływem — под воздействием, в состоянии (чего-либо)"
    examples:
      - pl: "Prowadził pod wpływem alkoholu."
        ru: "Он вёл машину в состоянии опьянения."
        source: { kind: translated, id: 461073 }
      - pl: "Bambus ugina się pod wpływem wiatru."
        ru: "Бамбук гнётся под напором ветра."
        source: { kind: translated, id: 880970 }
  - id: connections
    ru: "во множественном числе — связи, вес; поступления, доходы"
    examples:
      - pl: "On ma wpływy."
        ru: "У него есть связи."
        source: { kind: translated, id: 361246 }
      - pl: "Jego wpływy rozciągają się na cały kraj."
        ru: "Его влияние распространяется на всю страну."
        source: { kind: translated, id: 362386 }
notes:
  - { kind: government, text: "wpływ na co (винительный): wpływ na zdrowie «влияние на здоровье». Соответствующий глагол — wpływać na coś." }
  - { kind: usage, text: "pod wpływem czegoś — «под воздействием чего-либо». Особенно частое сочетание pod wpływem alkoholu «в состоянии алкогольного опьянения», в том числе в языке закона." }
  - { kind: usage, text: "Множественное wpływy часто значит не «влияния», а «связи, вес в обществе» (On ma wpływy «У него есть связи») либо «поступления, доходы» (wpływy z podatków «налоговые поступления»)." }
  - { kind: false-friend, text: "Не путайте wpływ «влияние» с wypływ «вытекание, отток» и с przypływ «прилив». Приставка меняет направление движения." }
collocations:
  - { pl: "mieć wpływ na coś", ru: "влиять на что-либо" }
  - { pl: "pod wpływem alkoholu", ru: "в состоянии опьянения" }
  - { pl: "strefa wpływów", ru: "сфера влияния" }
etymology: "От wpływać «втекать, вливаться» (w- «в» и płynąć «течь»). Русское «влияние» собрано ровно так же — «в-» и «лить», — поэтому образ в обоих языках один: нечто втекает и меняет содержимое."
memory: "wpływ — «влияние», и собрано оно как русское слово: w- плюс płynąć, «в-» плюс «лить». Влияние на что-то — wpływ na coś, винительный падеж. Pod wpływem alkoholu — «в состоянии опьянения». А во множественном wpływy — это чаще «связи»."
idioms:
  - { pl: "pod wpływem alkoholu", ru: "в состоянии алкогольного опьянения" }
  - { pl: "mieć wpływy", ru: "иметь связи, иметь вес" }
  - { pl: "strefa wpływów", ru: "сфера влияния" }
