# review
id: doskwierac
format: 2
lemma: "doskwierać"
rank: 6033
pos: verb
aspect: imperf
pron: { cyr: "доскфье́раць" }
senses:
  - id: trouble
    ru: "донимать, мучить, досаждать (о боли, жаре, холоде)"
    examples:
      - pl: "Turystom w Rzymie doskwierał nieznośny upał."
        ru: "Туристов в Риме донимала невыносимая жара."
        source: { kind: authored }
      - pl: "Od rana doskwiera mi ból głowy."
        ru: "С утра меня мучает головная боль."
        source: { kind: authored }
      - pl: "Zimą najbardziej doskwiera nam wilgoć w mieszkaniu."
        ru: "Зимой нас больше всего донимает сырость в квартире."
        source: { kind: authored }
  - id: lack
    ru: "остро ощущаться, давать себя знать (о нехватке, одиночестве)"
    examples:
      - pl: "Po śmierci żony zaczęła mu doskwierać samotność."
        ru: "После смерти жены его стало мучить одиночество."
        source: { kind: authored }
      - pl: "Firmie doskwiera brak pracowników."
        ru: "Фирма остро ощущает нехватку работников."
        source: { kind: authored }
      - pl: "Studentom doskwierają wysokie ceny mieszkań."
        ru: "Студентам досаждают высокие цены на жильё."
        source: { kind: authored }
notes:
  - { kind: government, text: "Кому — дательный, а то, что мучает, стоит в именительном и служит подлежащим: DOSKWIERA MI BÓL — дословно «мне досаждает боль». По-русски чаще наоборот: «меня мучает боль», «я страдаю от боли». Не переводите польский дательный русским винительным механически." }
  - { kind: usage, text: "Несовершенный вид, парного совершенного в живом языке практически нет. Подлежащее почти всегда неодушевлённое: боль, жара, холод, одиночество, нехватка. О человеке, который досаждает, говорят DOKUCZAĆ; формы 1-го и 2-го лица у DOSKWIERAĆ звучат шутливо или книжно." }
  - { kind: register, text: "Слово нейтрально-книжное, частое в прессе: DOSKWIERA BRAK, DOSKWIERA UPAŁ. В разговоре проще сказать MĘCZY MNIE, DOKUCZA MI." }
  - { kind: pronunciation, text: "Читается «доскфье́раць»: W после глухого K оглушается в «ф». Ударение на предпоследнем слоге." }
collocations:
  - { pl: "doskwiera upał", ru: "донимает жара" }
  - { pl: "doskwiera brak czegoś", ru: "остро не хватает чего-то" }
  - { pl: "doskwiera samotność", ru: "мучает одиночество" }
  - { pl: "dotkliwie doskwierać", ru: "сильно донимать" }
family:
  - { pl: "dokuczać", ru: "досаждать, донимать", relation: root }
  - { pl: "doskwieranie", ru: "мучение, тягость", relation: derived }
synonyms: ["dokuczać", "nękać", "dawać się we znaki"]
etymology: "Происхождение корня неясно. Обычно его сближают со звукоподражательным SKWIERCZEĆ «шипеть, скворчать»: досада, которая «жжёт и шипит»."
memory: "Doskwiera — до-скворчать: боль скворчит, как масло на сковороде, и не отпускает."
idioms:
  - { pl: "doskwiera komuś brak czegoś", ru: "кому-то остро не хватает чего-то" }
formExamplesSkip:
  - { form: "doskwierano", reason: "безличная форма на -no предполагает действующего человека, а донимают боль, жара и нехватка; живой язык этой формы не образует" }
