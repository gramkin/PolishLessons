# review
id: cien
format: 2
lemma: "cień"
rank: 1499
pos: noun
pron: { cyr: "цень" }
senses:
  - id: shadow
    ru: "тень (силуэт)"
    examples:
      - pl: "Stoję w cieniu."
        ru: "Я стою в тени."
        source: { kind: tatoeba, id: 1190330 }
      - pl: "To drzewo rzuca cień na trawnik."
        ru: "Это дерево отбрасывает тень на газон."
        source: { kind: translated, id: 768836 }
      - pl: "Boi się własnego cienia."
        ru: "Он боится собственной тени."
        source: { kind: translated, id: 12130835 }
  - id: shade
    ru: "тень (прохладное место)"
    examples:
      - pl: "Siedzieli w cieniu drzewa."
        ru: "Они сидели в тени дерева."
        source: { kind: translated, id: 366110 }
      - pl: "Drzewa zapewniają cień."
        ru: "Деревья дают тень."
        source: { kind: translated, id: 10571353 }
  - id: trace
    ru: "тень, малейший след"
    examples:
      - pl: "Jest jeszcze cień szansy, że uratujemy Toma."
        ru: "Есть ещё тень шанса, что мы спасём Тома."
        source: { kind: translated, id: 5095305 }
notes:
  - { kind: usage, text: "Мужской неодушевлённый с мягким окончанием: cień, cienia, w cieniu." }
  - { kind: usage, text: "Одно слово на два русских смысла: «тень» как силуэт и «тень» как прохладное место: rzucać cień «отбрасывать тень», siedzieć w cieniu «сидеть в тени»." }
  - { kind: usage, text: "cień szansy — «тень шанса», bez cienia wątpliwości — «без тени сомнения». Обороты совпадают с русскими." }
  - { kind: usage, text: "bać się własnego cienia — «бояться собственной тени», тоже полное совпадение." }
collocations:
  - { pl: "rzucać cień", ru: "отбрасывать тень" }
  - { pl: "w cieniu", ru: "в тени" }
  - { pl: "cień szansy", ru: "тень шанса" }
etymology: "Праславянское *těnь — то же слово, что русская «тень», с польским переходом t в ć перед мягким гласным."
memory: "cień — «тень», слово то же самое, только начальное t дало ć. Обороты совпадают: rzucać cień, bać się własnego cienia, cień szansy. Предложный — w cieniu."
idioms:
  - { pl: "bać się własnego cienia", ru: "бояться собственной тени" }
  - { pl: "cień szansy", ru: "тень шанса" }
  - { pl: "blaski i cienie", ru: "свет и тени" }
