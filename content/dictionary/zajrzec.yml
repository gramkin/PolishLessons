notes:
  - { kind: government, text: "ПРЕДЛОГ И ПАДЕЖ ДРУГИЕ, ЧЕМ В РУССКОМ. ZAJRZEĆ DO CZEGOŚ требует do плюс РОДИТЕЛЬНЫЙ: zajrzeć do pokoju, do słownika, do sąsiada. Русский говорит «заглянуть В книгу», с предлогом в и винительным. Есть и вариант ZAJRZEĆ NA coś — заглянуть куда-то мимоходом: zajrzeć na podwórko." }
  - { kind: usage, text: "У этого глагола, как и у współczuć в этой же паре карточек, НЕТ страдательного причастия, и по той же причине: он непереходный, дополнение идёт через предлог, а не в винительном. Отсюда и 42 формы вместо обычных 63. Безличное ZAJRZANO при этом есть." }
  - { kind: usage, text: "Корень -jrzeć — это старое *zьrěti «смотреть», от которого русские «зрение», «взор», «обзор» и книжное «зреть». То же гнездо: spojrzeć «взглянуть», przejrzeć «просмотреть», ujrzeć «увидеть». Прошедшее меняет e на a: инфинитив zajrzeć, но ZAJRZAŁ, как słyszeć и słyszał. Несовершенная пара — ZAGLĄDAĆ, с совсем другой основой." }
collocations:
  - { pl: "zajrzeć do słownika", ru: "заглянуть в словарь" }
  - { pl: "zajrzeć do kogoś", ru: "заглянуть к кому-л." }
  - { pl: "zajrzeć przez okno", ru: "заглянуть в окно" }
family:
  - { pl: "zaglądać", ru: "заглядывать (несов.)", relation: aspect }
  - { pl: "spojrzeć", ru: "взглянуть", relation: root, id: spojrzec }
  - { pl: "przejrzeć", ru: "просмотреть", relation: root }
etymology: "Приставка za- и корень -jrzeć, из праславянского *zьrěti «смотреть, видеть». Тот же корень дал русские «зрение», «взор», «обзор», «прозреть» и книжное «зреть». В польском он живёт широко: spojrzeć, wejrzeć, ujrzeć, przejrzeć — и везде прошедшее идёт на -ał."
memory: "zajrzeć — «заглянуть», но предлог другой: zajrzeć DO słownika, с родительным, а не «в словарь». Страдательного причастия нет, потому что глагол непереходный — отсюда 42 формы. Прошедшее zajrzał, с a. Несовершенная пара — zaglądać."
