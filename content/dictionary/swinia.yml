lemma: "świnia"
rank: 1629
pos: noun
pron: { cyr: "сьви́ня" }
senses:
  - id: pig
    ru: "свинья (животное)"
    examples:
      - pl: "Czy to prawda, że ta świnia nie jest twoja?"
        ru: "Это правда, что свинья не ваша?"
        source: { kind: tatoeba, id: 13789494 }
      - pl: "Tom nakarmił świnie."
        ru: "Том накормил свиней."
        source: { kind: translated, id: 8541047 }
      - pl: "Czy świnie są wszystkożerne?"
        ru: "Свиньи всеядны?"
        source: { kind: translated, id: 11998089 }
  - id: insult
    ru: "свинья (о человеке)"
    examples:
      - pl: "Gruby jak świnia."
        ru: "Он толстый, как свинья."
        source: { kind: tatoeba, id: 3686389 }
      - pl: "Nie bądź świnią, daj poprowadzić."
        ru: "Не будь свиньёй, дай порулить."
        source: { kind: tatoeba, id: 598710 }
      - pl: "Tom to straszna świnia ale nie chce się przyznać."
        ru: "Том страшная свинья, но не хочет признаться."
        source: { kind: translated, id: 8529959 }
notes:
  - { kind: usage, text: "Как и в русском, слово работает и как название животного, и как оскорбление: Tom to straszna świnia «Том страшная свинья»." }
  - { kind: usage, text: "Сравнения совпадают с русскими: gruby jak świnia «толстый как свинья», jeść jak świnia «есть как свинья», upić się jak świnia «напиться как свинья»." }
  - { kind: usage, text: "Существительное женского рода на -a, но о мужчине говорят так же: On jest świnią." }
  - { kind: usage, text: "Мясо свиньи — wieprzowina, а не świnina; поросёнок — prosię." }
collocations:
  - { pl: "gruby jak świnia", ru: "толстый как свинья" }
  - { pl: "jeść jak świnia", ru: "есть как свинья" }
  - { pl: "nakarmić świnie", ru: "накормить свиней" }
etymology: "Праславянское *svinьja — то же слово, что русское «свинья», с теми же переносными значениями. Совпадают даже сравнения: gruby jak świnia «толстый как свинья»."
memory: "świnia = «свинья», и животное, и ругательство — ровно как в русском, включая сравнения jeść jak świnia и upić się jak świnia. Мясо при этом называется иначе: wieprzowina."
