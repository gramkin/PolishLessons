# review
id: granica
format: 2
lemma: "granica"
rank: 931
pos: noun
pron: { cyr: "грани́ца" }
senses:
  - id: border
    ru: "граница (государственная)"
    examples:
      - pl: "Granica jest zamknięta na klucz."
        ru: "Граница на замке."
        source: { kind: tatoeba, id: 10768392 }
      - pl: "Jak daleko jest granica?"
        ru: "Далеко ли граница?"
        source: { kind: translated, id: 10761994 }
      - pl: "Chcemy dotrzeć do granicy."
        ru: "Мы хотим добраться до границы."
        source: { kind: translated, id: 10702722 }
  - id: abroad
    ru: "za granicą — за границей; za granicę — за границу"
    note: "Предложный на вопрос «где», винительный на вопрос «куда»."
    examples:
      - pl: "Byłeś za granicą?"
        ru: "Ты был за границей?"
        source: { kind: tatoeba, id: 8783702 }
      - pl: "Studiuję za granicą."
        ru: "Я учусь за границей."
        source: { kind: tatoeba, id: 531914 }
      - pl: "Wyjechała za granicę."
        ru: "Она уехала за границу."
        source: { kind: tatoeba, id: 12040200 }
  - id: limit
    ru: "граница, предел (переносно)"
    examples:
      - pl: "Wszechświat nie ma granic."
        ru: "Вселенная не имеет границ."
        source: { kind: tatoeba, id: 8096828 }
      - pl: "Granica między geniuszem a szaleńcem jest bardzo cienka."
        ru: "Граница между гением и безумцем очень тонка."
        source: { kind: translated, id: 737292 }
      - pl: "Była na granicy samobójstwa."
        ru: "Она была на грани самоубийства."
        source: { kind: translated, id: 406203 }
notes:
  - { kind: government, text: "Главная пара: za granicą «за границей» — творительный, отвечает на вопрос «где»; za granicę «за границу» — винительный, отвечает на «куда». Русский различает их точно так же, но пишет раздельно и там, и там." }
  - { kind: usage, text: "zza granicy — «из-за границы»: Wrócił zza granicy «Он вернулся из-за границы»." }
  - { kind: usage, text: "В переносном смысле — «предел»: w granicach rozsądku «в пределах разумного», przekraczać granice «переходить границы», na granicy wytrzymałości «на пределе»." }
  - { kind: usage, text: "Прилагательное — graniczny «пограничный», глагол graniczyć z czymś «граничить с чем-то»." }
collocations:
  - { pl: "za granicą", ru: "за границей" }
  - { pl: "za granicę", ru: "за границу" }
  - { pl: "przekroczyć granicę", ru: "пересечь границу" }
  - { pl: "w granicach rozsądku", ru: "в пределах разумного" }
family:
  - { pl: "graniczyć", ru: "граничить", relation: derived }
  - { pl: "graniczny", ru: "пограничный", relation: derived }
  - { pl: "grań", ru: "гребень горы", relation: root }
etymology: "От grań «гребень, ребро»: граница — это гребень, по которому проходит раздел. Русское «граница» — то же самое слово."
memory: "granica — «граница», и слово совпадает с русским. Главное запомнить пару падежей: za granicą «за границей» (где?) и za granicę «за границу» (куда?). Отдельно zza granicy «из-за границы». В переносном смысле — «предел»: w granicach rozsądku."
idioms:
