etymology: "Из латинского EXPLOSIO, от EXPLODERE: приставка EX- «вон, наружу» и PLAUDERE «хлопать, рукоплескать». Буквально это «выхлопывание», и исходно в латыни глагол означал прогнать актёра со сцены хлопками — то есть ошикать. Значение «взрыв» появилось только в новое время, когда слово попало в язык физики, и образ хлопка оказался удобным для описания резкого выброса. Тот же корень PLAUDERE дал «аплодисменты» и польское APLAUZ, так что EKSPLOZJA и APLAUZ — близкие родственники, разошедшиеся от одного хлопка. Русское «взрыв» построено от своего глагола «рвать» и описывает разрыв, а не хлопок: два языка выбрали разные стороны одного события."
memory: "По умолчанию взрыв — это wybuch, своё слово; eksplozja книжнее и чаще в переносном смысле: eksplozja demograficzna. Класс на -zja: родительный, дательный, местный и родительный множественного дают eksplozji, старая форма — eksplozyj. От латинского explodere «выхлопать со сцены», родня слову aplauz."
