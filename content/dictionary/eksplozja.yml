notes:
  - { kind: false-friend, text: "Ловушка не в самом слове, а в выборе между ним и WYBUCH. У польского для взрыва есть два слова: своё, WYBUCH, от WYBUCHNĄĆ «вспыхнуть, разразиться», и латинское EKSPLOZJA. В обиходной речи и в сводке новостей употребляют WYBUCH: WYBUCH GAZU «взрыв газа», WYBUCH WOJNY «начало войны». EKSPLOZJA звучит более книжно и техничнее, и чаще всего встречается в переносном смысле: EKSPLOZJA DEMOGRAFICZNA, EKSPLOZJA CEN. Русский обходится одним «взрывом» для всего, поэтому при переводе на польский нужно каждый раз выбирать, и выбор по умолчанию — WYBUCH." }
  - { kind: pronunciation, text: "Читается «эксплё́зья», ударение на предпоследнем слоге, то есть на -LO-. Сочетание ZJA даёт «зья», в один слог: слово трёхсложное, EKS-PLO-ZJA. Группа KS в начале произносится слитно, как в русском «экс-», а LO звучит мягко из-за следующего ZJ, отсюда «лё». Буква E в начале даёт «э»." }
  - { kind: usage, text: "Класс на -ZJA ведёт себя как класс на -CJA: родительный, дательный и местный падеж единственного числа совпадают в форме EKSPLOZJI, и она же служит родительным множественного. Старая книжная форма родительного множественного — EKSPLOZYJ, как OBSERWACYJ и PRODUKCYJ. В переносном значении слово употребляется свободно и даже охотнее, чем в прямом: EKSPLOZJA RADOŚCI «взрыв радости», EKSPLOZJA KOLORÓW «взрыв красок». Прилагательное — EKSPLOZYJNY, но о заряде скажут WYBUCHOWY." }
  - { kind: government, text: "Женский род на -A. Винительный на -Ę: USŁYSZELI EKSPLOZJĘ. Причина вводится родительным без предлога: EKSPLOZJA GAZU «взрыв газа», EKSPLOZJA BUTLI. Время после события — предлог PO с местным: PO EKSPLOZJI. Место — W или NA с местным: EKSPLOZJA W KOPALNI. При отрицании винительный уходит в родительный: NIE SŁYSZELI EKSPLOZJI, и форма совпадает с родительным единственного, что для этого класса обычно." }
