# review
id: wypic
format: 2
lemma: "wypić"
rank: 1094
pos: verb
aspect: perf
aspectPair: pic
pron: { cyr: "вы́пиць" }
senses:
  - id: drink-up
    ru: "выпить (совершенный вид от pić)"
    examples:
      - pl: "Wypił całą butelkę mleka."
        ru: "Он выпил целую бутылку молока."
        source: { kind: tatoeba, id: 416269 }
      - pl: "Dziś rano wypiłem szklankę mleka."
        ru: "Сегодня утром я выпил стакан молока."
        source: { kind: tatoeba, id: 980603 }
      - pl: "Wypij lekarstwo."
        ru: "Выпей лекарство."
        source: { kind: tatoeba, id: 6328991 }
  - id: have-a-drink
    ru: "выпить спиртного — без дополнения"
    examples:
      - pl: "Tom lubi sobie wypić."
        ru: "Том любит выпить."
        source: { kind: translated, id: 6554166 }
      - pl: "Trochę wypiliśmy i zaczęliśmy ble, ble, ble."
        ru: "Немного выпили и начали бла, бла, бла."
        source: { kind: tatoeba, id: 2238618 }
      - pl: "Za dużo wypiłaś."
        ru: "Ты слишком много выпила."
        source: { kind: translated, id: 3590091 }
  - id: toast
    ru: "wypić za coś — выпить за что-то (тост)"
    examples:
      - pl: "Wypijmy za zdrowie i szczęście!"
        ru: "Выпьем за здоровье и счастье!"
        source: { kind: translated, id: 511584 }
      - pl: "Chodź, wypijmy na mój koszt."
        ru: "Пойдём, выпьем за мой счёт."
        source: { kind: translated, id: 525780 }
      - pl: "Bądź jak ja i wypij kieliszek wina."
        ru: "Будь как я и выпей бокал вина."
        source: { kind: tatoeba, id: 5105343 }
notes:
  - { kind: usage, text: "Мужско-личной формы wypici не бывает: выпивают напиток, а не людей, поэтому эта форма оставлена без примеров. Причастие живёт в среднем и женском роде о выпитом: wypite mleko, wypita kawa." }
  - { kind: government, text: "Винительный падеж при полном объекте: wypić kawę «выпить кофе». При отрицании он меняется на родительный: nie wypił mleka «он не выпил молока»." }
  - { kind: usage, text: "Без дополнения wypić значит «выпить спиртного»: Tom lubi sobie wypić «Том любит выпить». Частица sobie как раз и подсказывает это значение." }
  - { kind: usage, text: "Тост строится с za и винительным: Wypijmy za zdrowie! «Выпьем за здоровье!»" }
  - { kind: false-friend, text: "Не путайте виды: pić — процесс («пью чай»), wypić — результат («выпил чай»). Русская пара «пить — выпить» устроена точно так же." }
collocations:
  - { pl: "wypić kawę", ru: "выпить кофе" }
  - { pl: "wypić za zdrowie", ru: "выпить за здоровье" }
  - { pl: "wypić do dna", ru: "выпить до дна" }
etymology: "Приставка wy- «вы-» и pić «пить», из праславянского *piti. Русское «выпить» собрано ровно из тех же частей, и приставка значит в нём то же самое."
memory: "wypić — совершенный вид от pić, ровно как русское «выпить» от «пить». Без дополнения значит «выпить спиртного»: Tom lubi sobie wypić. Тост — wypić za zdrowie. А при отрицании винительный меняется на родительный: nie wypił mleka."
idioms:
  - { pl: "wypić do dna", ru: "выпить до дна" }
  - { pl: "wypić za zdrowie", ru: "выпить за здоровье" }
  - { pl: "wypić jednym haustem", ru: "выпить залпом" }
formExamplesSkip:
