rank: 2501
pos: verb
pron: { cyr: "змэ́нчыць" }
senses:
  - id: tire-out
    ru: "утомить, вымотать"
    examples:
      - pl: "Ta droga mnie zmęczyła."
        ru: "Эта дорога меня утомила."
        source: { kind: authored }
      - pl: "Zmęczył się po dwóch kilometrach."
        ru: "Он устал после двух километров."
        source: { kind: authored }
  - id: tired
    ru: "усталый (о состоянии)"
    examples:
      - pl: "Jestem bardzo zmęczony."
        ru: "Я очень устал."
        source: { kind: authored }
      - pl: "Zmęczone dzieci zasnęły w autobusie."
        ru: "Усталые дети заснули в автобусе."
        source: { kind: authored }
  - id: fatigue
    ru: "усталость (о состоянии как существительном)"
    examples:
      - pl: "Zmęczenie dało o sobie znać."
        ru: "Усталость дала о себе знать."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "КОРЕНЬ ТОТ ЖЕ, ЧТО В «МУЧИТЬ», НО СИЛА СОВСЕМ ДРУГАЯ. Zmęczyć значит всего лишь «утомить», а JESTEM ZMĘCZONY — обыденное «я устал», которое поляк говорит каждый вечер. Переводить это русским «измучен» нельзя: выйдет мелодрама. Для настоящего мучения есть męczyć и udręka." }
  - { kind: usage, text: "Само MĘCZYĆ сместилось ещё и в сторону «доставать»: nie męcz mnie! значит «не доставай меня», а не «не мучь меня». Возвратное ZMĘCZYĆ SIĘ — это «устать», и именно так чаще всего и употребляется. Существительное zmęczenie — «усталость», а przewlekłe zmęczenie — медицинский термин." }
  - { kind: usage, text: "Вид совершенный, и время работает как у posprzątać: ZMĘCZĘ значит «утомлю», будущее, а не «утомляю». Есть деепричастие zmęczywszy, форм на -ąc и -ący нет. Несовершенная пара — męczyć: męczę się «я устаю», zmęczę się «я устану»." }
collocations:
  - { pl: "jestem zmęczony", ru: "я устал" }
  - { pl: "zmęczyć się", ru: "устать" }
  - { pl: "przewlekłe zmęczenie", ru: "хроническая усталость" }
family:
  - { pl: "męczyć", ru: "мучить; утомлять", relation: aspect, id: meczyc }
  - { pl: "męka", ru: "мука, мучение", relation: root }
  - { pl: "odpoczywać", ru: "отдыхать", relation: antonym }
etymology: "Приставка z- и męczyć, из праславянского *mǫčiti, от *mǫka «мука, мучение». Те же слова — русские «мучить», «мука» и «мученик», причём польское męczennik совпадает с русским полностью. Польский ослабил значение до утомления, оставив мучение приставочным и книжным формам."
memory: "zmęczyć — «утомить», а zmęczony — обычное «усталый»: jestem zmęczony. Корень тот же, что в «мучить», но сила слабее, и «измучен» тут не годится. Совершенный вид: zmęczę значит «утомлю», будущее."
idioms:
  - { pl: "zmęczony jak pies", ru: "устал как собака" }
  - { pl: "zmęczyć się na śmierć", ru: "устать до смерти" }
