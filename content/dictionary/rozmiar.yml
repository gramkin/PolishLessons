# review
id: rozmiar
format: 2
lemma: "rozmiar"
rank: 2105
pos: noun
pron: { cyr: "ро́змяр" }
senses:
  - id: size
    ru: "размер (одежды, обуви, предмета)"
    examples:
      - pl: "Jaki rozmiar pan nosi?"
        ru: "Какой размер вы носите?"
        source: { kind: authored }
      - pl: "Ta koszula jest o rozmiar za mała."
        ru: "Эта рубашка на размер меньше."
        source: { kind: authored }
      - pl: "Mamy ten model w trzech rozmiarach."
        ru: "У нас есть эта модель в трёх размерах."
        source: { kind: authored }
  - id: scale
    ru: "масштаб, размах"
    examples:
      - pl: "Rozmiary katastrofy przerosły wszystkie prognozy."
        ru: "Масштабы катастрофы превзошли все прогнозы."
        source: { kind: authored }
      - pl: "Pożar przybrał nieoczekiwane rozmiary."
        ru: "Пожар принял неожиданные размеры."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Слово собрано ровно как русское «размер»: приставка roz- — это знакомое раз-, корень тот же, что в miara «мера». Совпадают и сборка, и оба значения, бытовое и переносное: rozmiar butów «размер обуви», rozmiary klęski «масштабы бедствия». Запоминать здесь нечего — кроме одной формы, о которой ниже." }
  - { kind: pronunciation, text: "В предложном падеже r переходит в rz: rozmiar, но o rozmiarze — «о розмя́жэ». Это обычное польское чередование, то же, что siostra → o siostrze. Русскому оно незнакомо: «о размере» сохраняет р без изменений, поэтому форму rozmiarze стоит запомнить отдельно." }
  - { kind: government, text: "Размер ЧЕГО — родительный падеж: rozmiar butów, rozmiary strat. «Размером с что-то» передаётся оборотом o rozmiarze czegoś: pudełko o rozmiarze buta «коробка размером с ботинок». В магазине спрашивают коротко: Jaki rozmiar? — «Какой размер?»" }
collocations:
  - { pl: "rozmiar butów", ru: "размер обуви" }
  - { pl: "tabela rozmiarów", ru: "таблица размеров" }
  - { pl: "przybrać rozmiary", ru: "принять размеры" }
family:
  - { pl: "miara", ru: "мера", relation: root }
  - { pl: "zmierzyć", ru: "измерить", relation: derived }
  - { pl: "wymiar", ru: "измерение; размер", relation: derived, id: wymiar }
etymology: "Приставка roz- (русское раз-) плюс корень mier-/miar-, тот же, что в miara «мера» и mierzyć «мерить». Русское «размер» собрано из тех же частей и тем же способом, поэтому слова совпадают до буквы смысла. От этого корня ещё wymiar «измерение», pomiar «замер», zmierzyć «измерить»."
memory: "rozmiar — «размер», разобранный на те же части: roz- это раз-, miar- это мера. Единственная неожиданность — предложный падеж: o rozmiarze, с переходом r в rz, которого русский не знает."
idioms:
  - { pl: "przybrać rozmiary czegoś", ru: "принять размеры чего-л." }
  - { pl: "olbrzymich rozmiarów", ru: "огромных размеров" }
