# review
id: odniesc
format: 2
lemma: "odnieść"
rank: 2600
pos: verb
pron: { cyr: "о́днесьць" }
senses:
  - id: take-back
    ru: "отнести (обратно), вернуть"
    examples:
      - pl: "Odnieś książki do biblioteki."
        ru: "Отнеси книги в библиотеку."
        source: { kind: authored }
      - pl: "Odniósł narzędzia sąsiadowi tego samego dnia."
        ru: "Он отнёс инструменты соседу в тот же день."
        source: { kind: authored }
  - id: achieve
    ru: "добиться, одержать (успех, победу)"
    examples:
      - pl: "Odnieśli zwycięstwo w ostatniej minucie."
        ru: "Они одержали победу на последней минуте."
        source: { kind: authored }
      - pl: "Film odniósł sukces zupełnie niespodziewanie."
        ru: "Фильм добился успеха совершенно неожиданно."
        source: { kind: authored }
  - id: sustain
    ru: "получить (впечатление, травмы)"
    examples:
      - pl: "Odniosłem wrażenie, że coś przede mną ukrywa."
        ru: "У меня сложилось впечатление, что он что-то от меня скрывает."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ПЕРЕНОСНЫЕ ЗНАЧЕНИЯ РУССКОМУ «ОТНЕСТИ» НЕДОСТУПНЫ. ODNIEŚĆ SUKCES — «добиться успеха», ODNIEŚĆ ZWYCIĘSTWO — «одержать победу», ODNIEŚĆ WRAŻENIE — «получить впечатление», ODNIEŚĆ OBRAŻENIA — «получить травмы». Везде, где русский берёт «добиться», «одержать» или «получить», поляк обходится одним глаголом. Прямое значение при этом совпадает: odnieść książki «отнести книги». А возвратное ODNIEŚĆ SIĘ DO CZEGOŚ — это ровно наше «отнестись к чему-л.»." }
  - { kind: pronunciation, text: "Основа показывает четыре облика: ODNIEŚĆ и ODNIEŚ с мягким ś, ODNIESIE и ODNIESIONY с si, ODNIOSĘ и ODNIOSŁA с твёрдым s, а в мужском роде прошедшего времени — ODNIÓSŁ, с ó в закрытом слоге. Когда окончание открывает слог, ó уходит: odniosła, odniosło, odniosły." }
  - { kind: usage, text: "Вид совершенный, несовершенная пара — ODNOSIĆ. Отглагольное существительное ODNIESIENIE значит «ссылка, отнесение»: w odniesieniu do czegoś — «применительно к чему-л.», оборот канцелярский и очень частый. Корень nieść русскому знаком целиком: «нести», «отнести», «принести»." }
collocations:
  - { pl: "odnieść sukces", ru: "добиться успеха" }
  - { pl: "odnieść wrażenie", ru: "получить впечатление" }
  - { pl: "w odniesieniu do", ru: "применительно к" }
family:
  - { pl: "odnosić", ru: "относить (несов.)", relation: aspect }
  - { pl: "nieść", ru: "нести", relation: root }
  - { pl: "przynieść", ru: "принести", relation: root, id: przyniesc }
etymology: "Приставка od- и nieść, из праславянского *nesti — то же слово, что русское «нести». Разбор совпадает морфема в морфему с нашим «от-нести». Чередование ó/o в odniósł и odniosła — наследие древнего удлинения гласного в закрытом слоге, то самое, что дало польские nóg при noga и stół при stołu."
memory: "Один глагол на четыре русских: odnieść książki «отнести», odnieść sukces «добиться», odnieść zwycięstwo «одержать», odnieść wrażenie «получить». И помни ó в мужском роде: odniósł, но odniosła."
idioms:
  - { pl: "odnieść sukces", ru: "добиться успеха" }
  - { pl: "w odniesieniu do czegoś", ru: "применительно к чему-л." }
