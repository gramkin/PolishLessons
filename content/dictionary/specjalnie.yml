# review
id: specjalnie
format: 2
lemma: "specjalnie"
rank: 2394
pos: adv
pron: { cyr: "спэця́льне" }
senses:
  - id: on-purpose
    ru: "нарочно, специально"
    examples:
      - pl: "Zrobiłeś to specjalnie."
        ru: "Ты сделал это нарочно."
        source: { kind: authored }
      - pl: "Przyjechał specjalnie na twoje urodziny."
        ru: "Он приехал специально на твой день рождения."
        source: { kind: authored }
  - id: especially
    ru: "особенно, особо"
    examples:
      - pl: "Nie jest to specjalnie trudne."
        ru: "Это не особенно трудно."
        source: { kind: authored }
      - pl: "Nie przepadam specjalnie za tym miejscem."
        ru: "Я не особенно люблю это место."
        source: { kind: authored }
  - id: specially-made
    ru: "специально (для чего-л.)"
    examples:
      - pl: "Mebel zrobiono specjalnie na wymiar."
        ru: "Мебель сделали специально по размеру."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ВТОРОЕ ЗНАЧЕНИЕ РУССКОМУ «СПЕЦИАЛЬНО» НЕЗНАКОМО. С отрицанием specjalnie значит «НЕ ОСОБЕННО, не очень»: nie jest to specjalnie trudne «это не особо трудно», nie lubię specjalnie «не очень люблю». Перевести это словом «специально» нельзя — выйдет бессмыслица. В утвердительном предложении всё как по-русски: нарочно, с умыслом." }
  - { kind: usage, text: "Различать стоит три близких наречия. Specjalnie — с умыслом, нарочно. Szczególnie — особенно, в особенности, при выделении из ряда: szczególnie zimą. Zwłaszcza — то же, что szczególnie, но чаще в начале оборота. С отрицанием только specjalnie даёт смысл «не очень»." }
  - { kind: pronunciation, text: "Четыре слога, ударение на предпоследнем: spe-cjal-NIE — точнее spe-CJAL-nie. Cj читается слитно как «ця», конечное ni как нь: «спэця́льне». Слово не изменяется." }
collocations:
  - { pl: "zrobić coś specjalnie", ru: "сделать что-л. нарочно" }
  - { pl: "nie specjalnie", ru: "не особенно" }
  - { pl: "specjalnie dla ciebie", ru: "специально для тебя" }
family:
  - { pl: "specjalny", ru: "специальный, особый", relation: root, id: specjalny }
  - { pl: "szczególnie", ru: "особенно", relation: derived, id: szczegolnie }
  - { pl: "specjalista", ru: "специалист", relation: derived }
etymology: "От specjalny, из латинского specialis «особый, частный», от species «вид». В польский и в русский слово пришло через западные языки почти одновременно. Значение «не очень» при отрицании развилось уже на польской почве, из оттенка «не то чтобы особо»."
memory: "specjalnie — «нарочно, специально», как по-русски. Но с отрицанием оно значит «НЕ ОСОБЕННО»: nie jest to specjalnie trudne. Этого значения у русского «специально» нет."
idioms:
  - { pl: "nie specjalnie", ru: "не особо" }
  - { pl: "specjalnie dla ciebie", ru: "специально для тебя" }
