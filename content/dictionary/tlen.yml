notes:
  - { kind: false-friend, text: "TLEN значит «кислород», а не «тлен». И это тот редкий случай, когда ложный друг вырос из одного корня с обманутым словом: оба идут от праславянского *tьl- «тлеть». Польские химики девятнадцатого века назвали элемент по тому, что заставляет вещи тлеть и горсть; русский оставил при этом корне существительное распада, «тлен», а кислород назвал иначе. Русский «тлен» по-польски будет ROZKŁAD или ZGNILIZNA." }
  - { kind: usage, text: "Названия элементов в двух языках построены независимо, и сравнение поучительное. Оба отказались от латыни, но выбрали разные образы для кислорода: польский взял горение, TLEN от tlić się, а русский — кислоту, «кислород», калькируя латинское oxygenium. Для водорода образ совпал: WODÓR от woda, «водород» от воды. Węgiel у поляков и «углерод» у нас тоже сошлись." }
collocations:
  - { pl: "brak tlenu", ru: "недостаток кислорода" }
  - { pl: "butla z tlenem", ru: "баллон с кислородом" }
  - { pl: "tlen w powietrzu", ru: "кислород в воздухе" }
family:
  - { pl: "tlić się", ru: "тлеть", relation: root }
  - { pl: "tlenek", ru: "оксид", relation: derived }
  - { pl: "natleniony", ru: "насыщенный кислородом", relation: derived }
etymology: "Слово придумано польскими химиками в девятнадцатом веке от глагола TLIĆ SIĘ «тлеть», из праславянского *tьl-: кислород назвали по тому, без чего ничто не тлеет и не горит. Русский от того же корня сохранил «тлен» и «тление», а элемент назвал «кислородом», переведя латинское oxygenium как «рождающий кислоту». Один корень, две разные судьбы в двух языках."
memory: "tlen — это «кислород», а не «тлен», хотя корень один: тлеть. Русский «тлен» будет rozkład."
idioms:
