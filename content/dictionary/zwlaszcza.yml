# review
id: zwlaszcza
format: 2
lemma: "zwłaszcza"
rank: 1406
pos: conj
pron: { cyr: "зву́ашча" }
senses:
  - id: especially
    ru: "особенно, в особенности"
    examples:
      - pl: "Lubię muzykę, zwłaszcza klasyczną."
        ru: "Я люблю музыку, особенно классическую."
        source: { kind: tatoeba, id: 952124 }
      - pl: "On lubi warzywa, zwłaszcza kapustę."
        ru: "Он любит овощи, особенно капусту."
        source: { kind: translated, id: 10203152 }
      - pl: "Zawsze lubiłam czytać książki, zwłaszcza przygodowe."
        ru: "Я всегда любила читать книги, особенно приключенческие."
        source: { kind: translated, id: 13447756 }
  - id: especially-if
    ru: "особенно если, особенно когда"
    examples:
      - pl: "Niektóre składniki tego napoju są szkodliwe, zwłaszcza jeśli jesteś w ciąży."
        ru: "Некоторые составляющие этого напитка вредны, особенно если ты беременна."
        source: { kind: translated, id: 10772523 }
      - pl: "W języku łacińskim kolejność słów może się różnić, zwłaszcza w wersach wiersza."
        ru: "В латинском языке порядок слов может различаться, особенно в стихотворных строках."
        source: { kind: translated, id: 12216136 }
      - pl: "Śledzenie amerykańskiej polityki jest ciekawe, zwłaszcza podczas wyborów prezydenckich."
        ru: "Следить за американской политикой интересно, особенно во время президентских выборов."
        source: { kind: translated, id: 1351383 }
notes:
  - { kind: usage, text: "Zwłaszcza вводит уточнение после запятой: Lubię muzykę, zwłaszcza klasyczną «Я люблю музыку, особенно классическую»." }
  - { kind: usage, text: "Синонимы — szczególnie и przede wszystkim «прежде всего». Zwłaszcza чуть книжнее в письме." }
  - { kind: usage, text: "Часто стоит перед придаточным с jeśli или gdy: zwłaszcza jeśli «особенно если»." }
  - { kind: pronunciation, text: "Начальное zwł- складывается в «зву-», а szcz звучит как «щч»: зву́ашча." }
collocations:
  - { pl: "zwłaszcza jeśli", ru: "особенно если" }
  - { pl: "zwłaszcza teraz", ru: "особенно сейчас" }
  - { pl: "zwłaszcza że", ru: "тем более что" }
etymology: "Из чешского zvlášť «особо», от wlasny «собственный». Русское «особенно» построено от «особый» — та же логика выделения."
memory: "zwłaszcza — «особенно». Вводит уточнение после запятой: Lubię muzykę, zwłaszcza klasyczną. Синонимы — szczególnie и przede wszystkim. Начало складывается в «зву-»."
idioms:
