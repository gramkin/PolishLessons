# review
id: radzic
format: 2
lemma: "radzić"
rank: 1009
pos: verb
aspect: imperf
aspectPair: poradzic
pron: { cyr: "ра́дзиць" }
senses:
  - id: cope
    ru: "radzić sobie — справляться"
    note: "Самое частое употребление глагола в живой речи."
    examples:
      - pl: "Jak sobie radzisz?"
        ru: "Как ты справляешься?"
        source: { kind: translated, id: 12189083 }
      - pl: "Jako przedsiębiorca radzi sobie znakomicie."
        ru: "Как предприниматель он справляется превосходно."
        source: { kind: translated, id: 418273 }
      - pl: "Radzę sobie."
        ru: "Я справляюсь."
        source: { kind: translated, id: 12360245 }
  - id: advise
    ru: "radzić komuś — советовать кому-то"
    examples:
      - pl: "Radzę Ci wrócić do domu."
        ru: "Я советую тебе вернуться домой."
        source: { kind: translated, id: 897640 }
      - pl: "Rób co radzę."
        ru: "Делай, как я советую."
        source: { kind: translated, id: 361227 }
      - pl: "Radziłbym Ci nie kupować tego domu."
        ru: "Я посоветовал бы тебе не покупать этот дом."
        source: { kind: translated, id: 10235327 }
  - id: consult
    ru: "radzić się kogoś — советоваться с кем-то"
    examples:
      - pl: "Ona we wszystkim radzi się rodziców."
        ru: "Она во всём советуется с родителями."
        source: { kind: translated, id: 365099 }
      - pl: "Po prostu zrób, co radzi."
        ru: "Просто сделай, как он советует."
        source: { kind: translated, id: 357967 }
      - pl: "Jak mi pan radzi, co mam powiedzieć?"
        ru: "Что вы мне посоветуете сказать?"
        source: { kind: translated, id: 366536 }
notes:
  - { kind: usage, text: "radzić sobie — «справляться»: Jak sobie radzisz? «Как справляешься?». С дополнением — radzić sobie Z czymś, творительный падеж: radzić sobie ze stresem." }
  - { kind: government, text: "radzić KOMUŚ — «советовать кому-то», дательный падеж, как и в русском: Radzę ci wrócić do domu." }
  - { kind: government, text: "radzić się KOGOŚ — «советоваться с кем-то», возвратная форма плюс родительный падеж. Русский берёт предлог «с» и творительный, так что конструкцию надо запоминать целиком: radzi się rodziców «советуется с родителями»." }
  - { kind: usage, text: "Совершенный вид — poradzić. Poradzić sobie z czymś значит «справиться с чем-то» уже до конца." }
collocations:
  - { pl: "radzić sobie", ru: "справляться" }
  - { pl: "jak sobie radzisz?", ru: "как справляешься?" }
  - { pl: "radzić komuś", ru: "советовать кому-то" }
  - { pl: "radzić się kogoś", ru: "советоваться с кем-то" }
family:
  - { pl: "poradzić", ru: "посоветовать, справиться", relation: aspect, id: poradzic }
  - { pl: "rada", ru: "совет", relation: root }
  - { pl: "doradca", ru: "советник", relation: derived }
etymology: "От rada «совет», заимствованного из германского. Русское «радеть» и украинская «рада» — того же корня, но значение «советовать» сохранил именно польский."
memory: "radzić — прежде всего «справляться»: Jak sobie radzisz? Во вторую очередь «советовать» кому-то (дательный). И осторожно с третьим: radzić się KOGOŚ «советоваться с кем-то» требует родительного, а не предлога «с»."
idioms:
