notes:
  - { kind: false-friend, text: "Самое важное про это слово — ловушка внутри него. Оба языка назвали первый день «тем, что после niedziela», но сами слова разошлись: польское niedziela значит ВОСКРЕСЕНЬЕ, а русское «неделя» — семь дней. Неделя по-польски tydzień. Так что poniedziałek буквально «день после воскресенья», и это верно, а «понедельник» как «день после недели» — уже нет." }
  - { kind: government, text: "«В понедельник» — w poniedziałek, с ВИНИТЕЛЬНЫМ падежом. «По понедельникам» — w poniedziałki, тоже винительный, но множественного числа. «С понедельника» — od poniedziałku, родительный. Предлог w здесь не берёт предложного падежа, в отличие от w poniedziałku «в понедельнике» (о самом дне как предмете речи)." }
  - { kind: usage, text: "Названия дней недели в польском пишутся со СТРОЧНОЙ буквы, как и в русском: poniedziałek, wtorek, środa. Прилагательное — poniedziałkowy «понедельничный»." }
collocations:
