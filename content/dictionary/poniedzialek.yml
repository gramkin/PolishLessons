  - { pl: "od poniedziałku", ru: "с понедельника" }
  - { pl: "w poniedziałki", ru: "по понедельникам" }
family:
  - { pl: "niedziela", ru: "воскресенье", relation: root, id: niedziela }
  - { pl: "tydzień", ru: "неделя", relation: root, id: tydzien }
  - { pl: "poniedziałkowy", ru: "понедельничный", relation: derived }
etymology: "Праславянское *ponedělъkъ — «день, следующий за *nedělja». Русское «понедельник» построено точно так же и из того же материала. Но исходное *nedělja («день, когда не делают») в польском осталось названием воскресенья, а в русском перешло на весь семидневный отрезок, и потому прозрачность названия в русском утратилась, а в польском сохранилась."
memory: "poniedziałek — «день после niedziela», и niedziela это ВОСКРЕСЕНЬЕ, а не неделя. Неделя по-польски tydzień. Отсюда: w poniedziałek «в понедельник», od poniedziałku «с понедельника», w poniedziałki «по понедельникам»."
