notes:
  - { kind: false-friend, text: "KOLEŻKA — «приятель, дружок» о мужчине, хотя склоняется как существительные на -A. Нейтрально — KOLEGA. Женская форма — KOLEŻANKA, «подруга, коллега». В обращении KOLEŻKO! звучит фамильярно или с угрозой." }
  - { kind: register, text: "Разговорное, фамильярное: о приятеле или с иронией к чужому. Нейтрально — KOLEGA, близкий друг — KUMPEL, PRZYJACIEL." }
  - { kind: usage, text: "Мужской род, лицо, склоняется как женские на -A: KOLEŻKA, KOLEŻKI, KOLEŻCE, KOLEŻKĘ, KOLEŻKĄ. Звательный — KOLEŻKO. Множественное — KOLEŻKOWIE или KOLEŻKI." }
  - { kind: pronunciation, text: "Читается «колэ́жка»: LE — «лэ», Ż — «ж». Ударение на предпоследнем слоге." }
collocations:
  - { pl: "stary koleżka", ru: "старый приятель" }
