notes:
  - { kind: pronunciation, text: "Родительный пишется с двумя i — TRAGEDII. Это признак заимствованных слов на -ia: historia — historii, komedia — komedii. У исконных слов на -nia окончание одно: pustynia — pustyni, kuchnia — kuchni. Разница только на письме, произносится в обоих случаях одно долгое и, но ошибка в орфографии заметна сразу." }
  - { kind: usage, text: "Родительный множественного имеет две формы: обычную TRAGEDII, совпадающую с родительным единственного, и старую TRAGEDYJ. Такие пары есть у целой группы заимствований: konferencji и konferencyj, tradycji и tradycyj, reputacji и reputacyj. Форма на -yj сегодня книжная и встречается в старых изданиях, в живой речи её не услышишь." }
collocations:
  - { pl: "rodzinna tragedia", ru: "семейная трагедия" }
  - { pl: "przeżyć tragedię", ru: "пережить трагедию" }
  - { pl: "robić z czegoś tragedię", ru: "делать из чего-то трагедию" }
family:
  - { pl: "tragiczny", ru: "трагический", relation: derived }
  - { pl: "komedia", ru: "комедия", relation: antonym }
  - { pl: "tragizm", ru: "трагизм", relation: derived }
etymology: "Из греческого tragōidía, буквально «козлиная песнь»: trágos «козёл» и ōidḗ «песнь». Название связывают с обрядами в честь Диониса, где пели хором и приносили в жертву козла. Через латынь слово пришло и в русский, и в польский, причём в обоих языках осталось женского рода, так что согласование здесь не подводит."
memory: "Родительный с двумя i: tragedii — потому что слово заимствованное. У исконной pustynia родительный с одним: pustyni."
idioms:
  - { pl: "robić z igły widły", ru: "делать из мухи слона" }
  - { pl: "tragedia grecka", ru: "греческая трагедия" }
