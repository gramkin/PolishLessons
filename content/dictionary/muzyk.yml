notes:
  - { kind: false-friend, text: "Слово значит «музыкант», а не «музыка». Для русского глаза это неочевидно: MUZYK выглядит как усечённая «музыка», и ошибка выходит сама собой. Разводятся они так: MUZYKA — существительное женского рода «музыка», MUZYK — мужского, одушевлённое, «музыкант». Заметьте и то, что польский обошёлся без суффикса там, где русский его прибавил: «музыкант» против muzyk, как «журналист» против dziennikarz, только в обратную сторону." }
  - { kind: usage, text: "Формы двух этих слов местами совпадают, и совпадение обманчиво. MUZYK — это именительный единственного от «музыканта», но ещё и родительный множественного от MUZYKA «музыка». А MUZYKI — родительный единственного и именительный множественного от «музыки», и одновременно уничижительная форма множественного от «музыканта». Та же картина, что у пары technika и technik, разобранной в карточке KLINIKA: голый корень женского слова выглядит как именительный мужского." }
  - { kind: usage, text: "Мужская личная форма множественного — MUZYCY, с переходом k в c. Это тот же переход, что в TECHNICY и PRZECIWNICY, и тот же, что у прилагательных WŁOSCY, POLSCY, BRYTYJSCY. Звательный и местный сошлись в MUZYKU — обращение DROGI MUZYKU вполне употребимо. Родительный множественного MUZYKÓW при этом правильный и единственный, дублета на -y здесь нет." }
collocations:
  - { pl: "muzyk jazzowy", ru: "джазовый музыкант" }
  - { pl: "znany muzyk", ru: "известный музыкант" }
