  - { pl: "muzyczny", ru: "музыкальный", relation: derived }
etymology: "От MUZYKA, через латынь из греческого mousike (techne) «искусство муз», от MUZA. Польский назвал исполнителя тем же словом без всякого суффикса — muzyk, — а русский взял латинско-немецкое musicante и получил «музыканта». Корень в обоих языках один и тот же и узнаётся сразу; разошлись языки только в способе назвать человека."
memory: "Это «музыкант», а не «музыка». Множественное мужское личное muzycy: k даёт c. И форма muzyk — это ещё родительный множественного от muzyka."
idioms:
