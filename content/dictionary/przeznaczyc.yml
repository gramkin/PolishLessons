# review
id: przeznaczyc
format: 2
lemma: "przeznaczyć"
rank: 1839
pos: verb
aspect: perf
pron: { cyr: "пшэзна́чыць" }
senses:
  - id: allocate
    ru: "предназначить, выделить (средства, время)"
    examples:
      - pl: "Przeznacz pieniądze na badanie i rozwój."
        ru: "Выдели деньги на исследования и разработку."
        source: { kind: translated, id: 1630754 }
      - pl: "Przeznacz godzinę na dotarcie na lotnisko."
        ru: "Выдели час на дорогу в аэропорт."
        source: { kind: translated, id: 4328033 }
      - pl: "Fundusze zostały specjalnie przeznaczone na zakup książek do biblioteki szkolnej."
        ru: "Средства были специально выделены на покупку книг для школьной библиотеки."
        source: { kind: translated, id: 13782604 }
  - id: intended-for
    ru: "przeznaczony — предназначенный для кого-либо, чего-либо"
    examples:
      - pl: "Ten tekst przeznaczony jest dla początkujących."
        ru: "Этот текст предназначен для начинающих."
        source: { kind: translated, id: 352734 }
      - pl: "To miejsce parkingowe jest przeznaczone wyłącznie dla klientów."
        ru: "Это парковочное место предназначено только для клиентов."
        source: { kind: translated, id: 11009508 }
      - pl: "Sofa przeznaczona jest do salonu."
        ru: "Диван предназначен для гостиной."
        source: { kind: translated, id: 11816262 }
notes:
  - { kind: government, text: "Предназначить на что-то — przeznaczyć na coś (винительный с na): przeznaczyć pieniądze na badania. Предназначенный для кого-то — przeznaczony dla kogoś (родительный с dla)." }
  - { kind: usage, text: "Причастие przeznaczony — самая частая форма: ten podręcznik przeznaczony jest dla studentów." }
  - { kind: usage, text: "Существительное przeznaczenie значит «предназначение, судьба» и живёт своей жизнью: Przeznaczenia nie oszukasz «Судьбу не обманешь»." }
  - { kind: usage, text: "Совершенный вид; несовершенный — przeznaczać." }
collocations:
  - { pl: "przeznaczyć na coś", ru: "выделить на что-либо" }
  - { pl: "przeznaczony dla", ru: "предназначенный для" }
  - { pl: "miejsce przeznaczenia", ru: "место назначения" }
family:
  - { pl: "przeznaczać", ru: "предназначать", relation: root }
  - { pl: "przeznaczenie", ru: "предназначение, судьба", relation: root }
  - { pl: "cel", ru: "цель", relation: root, id: cel }
etymology: "Приставка prze- плюс znaczyć «значить, метить»: буквально «пометить для чего-то». Русское «предназначить» построено похоже, через «назначить»."
memory: "przeznaczyć — «выделить, предназначить»: przeznaczyć pieniądze na badania. Чаще всего встречается причастие przeznaczony dla «предназначенный для»."
idioms:
  - { pl: "przeznaczyć na coś", ru: "выделить на что-либо" }
  - { pl: "przeznaczony dla", ru: "предназначенный для" }
  - { pl: "miejsce przeznaczenia", ru: "место назначения" }
