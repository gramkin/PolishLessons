  - { form: "przeznaczenie", reason: "формы существительного przeznaczenie «предназначение, судьба», отдельного слова со своим значением, в статье глагола примеры не приводятся" }
  - { form: "przeznaczeniem", reason: "формы существительного przeznaczenie «предназначение, судьба», отдельного слова со своим значением, в статье глагола примеры не приводятся" }
