formExamples:
  - form: "przeznacz"
    pl: "Przeznacz pieniądze na badanie i rozwój."
    ru: "Выдели деньги на исследования и разработку."
    source: { kind: translated, id: 1630754 }
  - form: "przeznacz"
    pl: "Przeznacz godzinę na dotarcie na lotnisko."
    ru: "Выдели час на дорогу в аэропорт."
    source: { kind: translated, id: 4328033 }
  - form: "przeznacz"
    pl: "Przeznacz na to więcej czasu."
    ru: "Выдели на это больше времени."
    source: { kind: authored }
  - form: "przeznaczona"
    pl: "Sofa przeznaczona jest do salonu."
    ru: "Диван предназначен для гостиной."
    source: { kind: translated, id: 11816262 }
  - form: "przeznaczona"
    pl: "Trumna to skrzynia przeznaczona na martwe ludzkie ciało."
    ru: "Гроб — это ящик, предназначенный для мёртвого человеческого тела."
    source: { kind: translated, id: 1354583 }
  - form: "przeznaczona"
    pl: "Ta książka, choć przeznaczona dla dzieci, często bywa czytana przez dorosłych."
    ru: "Эта книга, хотя и предназначена для детей, часто читается взрослыми."
    source: { kind: translated, id: 712368 }
  - form: "przeznaczone"
    pl: "To miejsce parkingowe jest przeznaczone wyłącznie dla klientów."
    ru: "Это парковочное место предназначено только для клиентов."
    source: { kind: translated, id: 11009508 }
  - form: "przeznaczone"
    pl: "Wygodnie jest mieć przygotowane buty przeznaczone na deszczowe dni."
    ru: "Удобно иметь наготове обувь, предназначенную для дождливых дней."
    source: { kind: translated, id: 13827609 }
  - form: "przeznaczone"
    pl: "Fundusze zostały specjalnie przeznaczone na zakup książek do biblioteki szkolnej."
    ru: "Средства были специально выделены на покупку книг для школьной библиотеки."
    source: { kind: translated, id: 13782604 }
  - form: "przeznaczony"
    pl: "To łuk przeznaczony dla silnego łucznika."
    ru: "Это лук, предназначенный для сильного лучника."
    source: { kind: translated, id: 670440 }
  - form: "przeznaczony"
    pl: "Ten tekst przeznaczony jest dla początkujących."
    ru: "Этот текст предназначен для начинающих."
    source: { kind: translated, id: 352734 }
  - form: "przeznaczony"
    pl: "Ten podręcznik przeznaczony jest dla studentów z zagranicy."
    ru: "Этот учебник предназначен для иностранных студентов."
    source: { kind: translated, id: 368907 }
  - form: "przeznaczonym"
    pl: "W czasie przeznaczonym na przegląd staram się korygować wszelkie popełnione błędy."
    ru: "Во время, выделенное на проверку, я стараюсь исправить все допущенные ошибки."
    source: { kind: translated, id: 13011500 }
  - form: "przeznaczonym"
    pl: "W miejscu przeznaczonym dla dzieci jest cicho."
    ru: "В месте, предназначенном для детей, тихо."
    source: { kind: authored }
  - form: "przeznaczonym"
    pl: "Pracuje w pokoju przeznaczonym na biuro."
    ru: "Он работает в комнате, предназначенной под офис."
    source: { kind: authored }
