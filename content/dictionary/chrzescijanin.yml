etymology: "От CHRYSTUS «Христос», через чешское посредство. Тот же корень, что в CHRZEST «крещение»."
memory: "Chrześcijanin — христианин, через chrz: «хшэсьцья́нин». Chrześcijanie — христиане, chrześcijan — христиан."
idioms:
