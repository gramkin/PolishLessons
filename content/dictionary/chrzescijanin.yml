    ru: "верующий, добрый человек (книжн.)"
    examples:
      - pl: "Postąpił jak prawdziwy chrześcijanin."
        ru: "Он поступил как настоящий христианин."
        source: { kind: authored }
      - pl: "Każdy chrześcijanin powinien pomagać bliźnim."
        ru: "Каждый христианин должен помогать ближним."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "CHRZEŚCIJANIN — «христианин», с CHRZ: «хшэ», а не «хри». Христианство — CHRZEŚCIJAŃSTWO, христианский — CHRZEŚCIJAŃSKI. Крестить — CHRZCIĆ, крещение — CHRZEST: тот же корень." }
  - { kind: usage, text: "Мужской род, лицо. Множественное — CHRZEŚCIJANIE, родительный — CHRZEŚCIJAN, без -ÓW, как MIESZCZANIN — MIESZCZAN. Христианка — CHRZEŚCIJANKA." }
  - { kind: government, text: "Быть христианином — BYĆ CHRZEŚCIJANINEM, творительный. Гонения на христиан — PRZEŚLADOWANIA CHRZEŚCIJAN, родительный." }
  - { kind: pronunciation, text: "Читается «хшэсьцья́нин»: CHRZ — «хш», EŚ — «эсь», CIJA — «цья». Ударение на предпоследнем слоге." }
collocations:
  - { pl: "praktykujący chrześcijanin", ru: "практикующий христианин" }
  - { pl: "pierwsi chrześcijanie", ru: "первые христиане" }
