# review
id: wiadomosc
format: 2
lemma: "wiadomość"
rank: 357
pos: noun
pron: { cyr: "вядо́мощць" }
senses:
  - id: news
    ru: "новость, весть"
    examples:
      - pl: "Mam smutną wiadomość."
        ru: "У меня есть грустная новость."
        source: { kind: tatoeba, id: 4717724 }
      - pl: "To ciekawa wiadomość."
        ru: "Это интересная новость."
        source: { kind: tatoeba, id: 12567524 }
      - pl: "Czy ta wiadomość może być prawdą?"
        ru: "Может ли эта новость быть правдой?"
        source: { kind: tatoeba, id: 362983 }
  - id: message
    ru: "сообщение; wiadomości — новости (программа)"
    examples:
      - pl: "Brak wiadomości to dobra wiadomość."
        ru: "Отсутствие новостей - это хорошие новости."
        source: { kind: tatoeba, id: 2587042 }
      - pl: "Cieszę się, że słyszę tę wiadomość."
        ru: "Я рад услышать эту новость."
        source: { kind: tatoeba, id: 881972 }
      - pl: "Ta wiadomość sprawiła jej dużo bólu."
        ru: "Эти вести причинили ей много боли."
        source: { kind: tatoeba, id: 3460235 }
notes:
  - { kind: usage, text: "wiadomość значит и «новость», и «сообщение»: wysłać wiadomość «отправить сообщение» (SMS или письмо)." }
  - { kind: usage, text: "Во множественном wiadomości — это «новости» по радио и телевидению: oglądać wiadomości «смотреть новости»." }
  - { kind: usage, text: "przyjąć do wiadomości — «принять к сведению»; brak wiadomości to dobra wiadomość — «отсутствие новостей — хорошая новость»." }
  - { kind: usage, text: "Корень тот же, что в wiedzieć «знать» и wiadomo «известно»." }
collocations:
  - { pl: "dobra wiadomość", ru: "хорошая новость" }
  - { pl: "wysłać wiadomość", ru: "отправить сообщение" }
  - { pl: "oglądać wiadomości", ru: "смотреть новости" }
  - { pl: "przyjąć do wiadomości", ru: "принять к сведению" }
etymology: "От wiadomy «известный», а то — от wiedzieć «знать», праславянское *věděti; то же гнездо, что русские «ведать», «весть», «известие»."
memory: "wiadomość — и «новость», и «сообщение»: wysłać wiadomość. А wiadomości во множественном — «новости» по радио и телевизору. Корень тот же, что в wiedzieć."
idioms:
  - { pl: "przyjąć do wiadomości", ru: "принять к сведению" }
  - { pl: "wiadomość z ostatniej chwili", ru: "новость последней минуты" }
  - { pl: "brak wiadomości to dobra wiadomość", ru: "отсутствие новостей — хорошая новость" }
