  - { pl: "okład", ru: "компресс", relation: derived }
  - { pl: "okładzina", ru: "облицовка", relation: derived }
etymology: "От глагола OKŁADAĆ «обкладывать», от приставки O- и KŁAŚĆ «класть», слова праславянского и того же, что русское «класть». Русская «обложка» собрана точно так же, от «обложить», поэтому постройка слов совпадает целиком. Из того же гнезда идут OKŁAD «компресс», то есть то, что кладут на тело, и OKŁADZINA «облицовка», то есть то, чем обкладывают стену."
memory: "Обложка, и собрано как русское слово: от okladac «обкладывать», как «обложка» от «обложить». Читается «окуа́тка», где l со штрихом даёт «у», а dk оглушается в «тк». Выучите целиком od okladki do okladki — «от корки до корки». И не обманитесь на oklad: по-польски это компресс, а не «оклад»."
idioms:
