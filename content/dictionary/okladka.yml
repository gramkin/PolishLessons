notes:
  - { kind: false-friend, text: "Само слово собрано как русская «обложка»: от OKŁADAĆ «обкладывать», как у нас от «обложить». Ловушка в родне. OKŁAD по-польски это компресс, который кладут на больное место: ZIMNY OKŁAD значит «холодный компресс». С русским «окладом», то есть с жалованьем или с рамой иконы, оно не имеет ничего общего. А OKŁADZINA значит «облицовка»." }
  - { kind: usage, text: "Десять форм, женский род. В дательном и местном падежах K переходит в C: OKŁADKA, но NA OKŁADCE. В родительном множественного появляется беглое E: OKŁADEK. В книжном деле различают TWARDA OKŁADKA «твёрдый переплёт» и MIĘKKA OKŁADKA «мягкая обложка», и эти два сочетания стоят на каждой странице книжного магазина." }
  - { kind: government, text: "На обложке — NA OKŁADCE, местный падеж с переходом K в C. От корки до корки — OD OKŁADKI DO OKŁADKI, оба раза родительный после OD и DO, и запомните этот оборот целиком: по-русски мы говорим о корках, поляк — об обложках. Без обложки — BEZ OKŁADKI, родительный. Обложку порвал — PODARŁ OKŁADKĘ, винительный." }
  - { kind: pronunciation, text: "Читается «окуа́тка», три слога, ударение на предпоследнем. Буква Ł даёт «у», поэтому второй слог это «уа», без всякого «л». Сочетание DK оглушается и звучит «тк»: не «дка», а «тка». В форме OKŁADCE сочетание DC даёт «тц»: «окуа́тце». Это слово хорошо показывает сразу два польских правила чтения." }
  - { kind: register, text: "Слово нейтральное и книжное в прямом смысле: в магазине спросят, нужна ли TWARDA czy MIĘKKA OKŁADKA. Оборот OD OKŁADKI DO OKŁADKI значит «от корки до корки» и употребляется о книге, прочитанной целиком. В школе OKŁADKA это обложка тетради, и обклеивать её — старый школьный обычай, который помнит каждый поляк." }
collocations:
  - { pl: "twarda okładka", ru: "твёрдый переплёт" }
  - { pl: "na okładce", ru: "на обложке" }
