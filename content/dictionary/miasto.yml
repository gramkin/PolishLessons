# review
id: miasto
format: 2
lemma: "miasto"
rank: 265
pos: noun
pron: { cyr: "мя́сто" }
senses:
  - id: city
    ru: "город"
    examples:
      - pl: "Miasto śpi."
        ru: "Город спит."
        source: { kind: tatoeba, id: 5315936 }
      - pl: "To bardzo duże miasto."
        ru: "Это очень большой город."
        source: { kind: tatoeba, id: 10747481 }
      - pl: "Kocham swoje miasto."
        ru: "Я люблю свой город."
        source: { kind: tatoeba, id: 2097188 }
  - id: in-town
    ru: "город (в оборотах места)"
    examples:
      - pl: "Mieszkam w mieście."
        ru: "Я живу в городе."
        source: { kind: tatoeba, id: 359195 }
      - pl: "Po mieście biegał łoś."
        ru: "По городу бегал лось."
        source: { kind: tatoeba, id: 7960546 }
      - pl: "Oni są obrońcami miasta."
        ru: "Они защитники города."
        source: { kind: tatoeba, id: 13915539 }
notes:
  - { kind: false-friend, text: "Главная ловушка: miasto — это «город», а не «место». Русскому «место» отвечает miejsce. Слова одного гнезда: город и есть место поселения." }
  - { kind: usage, text: "Предлоги: w mieście «в городе», do miasta «в город», po mieście «по городу», za miasto «за город»." }
  - { kind: usage, text: "miasteczko — «городок»; Stare Miasto — «Старый город», исторический центр." }
collocations:
  - { pl: "w mieście", ru: "в городе" }
  - { pl: "do miasta", ru: "в город" }
  - { pl: "stare miasto", ru: "старый город" }
  - { pl: "duże miasto", ru: "большой город" }
etymology: "Слово одного гнезда с miejsce «место»: город — это место, где селились. Русское «место» сохранило исходное значение, польское miasto сузилось до «города»."
memory: "miasto — это «город», а «место» — miejsce. Не перепутайте: Mieszkam w mieście значит «Я живу в городе»."
idioms:
  - { pl: "jechać do miasta", ru: "ехать в город" }
  - { pl: "miasto widmo", ru: "город-призрак" }
  - { pl: "stare miasto", ru: "старый город" }
