etymology: "Из французского COUSIN, COUSINE, а то — из латинского CONSOBRINUS, что означало ребёнка сестры матери: приставка CON- и SOBRINUS от SOROR «сестра». Слово разошлось по Европе вместе с дворянским обиходом восемнадцатого века. Польский взял мужскую форму KUZYN и образовал женскую по своему правилу, прибавив -KA, тогда как русский заимствовал обе французские формы отдельно, «кузен» и «кузина», и обе остались в книжном слое. Исконные славянские названия при этом никуда не делись: польское SIOSTRA CIOTECZNA и русское «двоюродная сестра» — оба описательные, оба точнее заимствования, и оба в живой речи соседствуют с ним."
memory: "Одно французское слово, но разными путями: русский взял готовую «кузину», польский взял kuzyn и образовал женское своим суффиксом -ka, как sąsiad и sąsiadka. Поэтому kuzynka звучит обычно, а русская «кузина» книжно. Точнее и книжнее по-польски siostra cioteczna, дочь тёти. Падежи как у всей серии на -ka: kuzynce с меной k→c, kuzynek с беглым e. Звучит «кузы́нка», с «ы» во втором слоге."
