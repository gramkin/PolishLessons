notes:
  - { kind: false-friend, text: "Русская «кузина» и польская KUZYNKA восходят к одному французскому слову, но пришли разными путями и построены по-разному. Русский взял французское COUSINE целиком, вместе с окончанием, и слово осталось книжным, слегка старомодным: в обиходе говорят «двоюродная сестра». Польский взял мужское KUZYN и образовал от него женское своим суффиксом -KA, как от SĄSIAD даёт SĄSIADKA. Поэтому KUZYNKA звучит совершенно обычно и употребляется чаще, чем описательное SIOSTRA CIOTECZNA. Последнее, впрочем, точнее: оно указывает, что родство идёт через тётю, а не через дядю." }
  - { kind: usage, text: "Десять форм, женский род. Дательный и местный единственного — KUZYNCE, с меной K в C перед окончанием -E; родительный множественного — KUZYNEK, с беглым E. Это третий раз, когда та же пара правил встречается в этой серии, после KACZKI и TABLETKI, и повторение здесь полезно: образец один и тот же для всех слов на -KA. Родительный единственного и именительный множественного — одна форма KUZYNKI. Степень родства уточняют прилагательным: KUZYNKA CIOTECZNA, KUZYNKA STRYJECZNA, DALSZA KUZYNKA." }
  - { kind: pronunciation, text: "Читается «кузы́нка», три слога, ударение на втором. Буква Y даёт «ы», поэтому второй слог звучит «зы», а не «зи» — в отличие от русской «кузины». Буква Z звонкая. В форме KUZYNCE сочетание NC читается «нц»: «кузы́нце». В форме KUZYNEK беглое E произносится отчётливо: «кузы́нэк». В форме KUZYNKĄ последнее Ą даёт «он»: «кузы́нкон»." }
  - { kind: register, text: "Слово нейтральное и повседневное. Устойчивые сочетания: DALSZA KUZYNKA «дальняя родственница», KUZYNKA ZE STRONY MATKI, ZJAZD RODZINNY. В польской семейной терминологии различают SIOSTRA CIOTECZNA, дочь тёти, и SIOSTRA STRYJECZNA, дочь дяди по отцу, и эти слова точнее, чем KUZYNKA, но и книжнее. Мужское соответствие — KUZYN. В шутливом употреблении DALEKA KUZYNKA значит почти незнакомую родственницу, о которой вспоминают только на похоронах и свадьбах." }
