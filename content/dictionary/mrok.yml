notes:
  - { kind: false-friend, text: "Русский «мрак» точный родственник, но сильнее польского. У нас это тьма почти полная, да ещё и слово книжное. Польское MROK — обычный вечерний полумрак, сумрак в комнате или в сенях, и говорят его каждый день. Переводить его лучше «сумраком» или «темнотой». А ZMROK, из того же гнезда, значит «сумерки» как время дня: O ZMROKU — «в сумерках»." }
  - { kind: usage, text: "Девять форм, мужской род, неодушевлённое. Основа не меняется, беглых гласных нет. Множественное число MROKI существует и употребляется в переносном смысле, о невежестве и о забытом прошлом: MROKI NIEWIEDZY, MROKI ŚREDNIOWIECZA, MROKI HISTORII. О темноте в комнате говорят только в единственном числе." }
  - { kind: government, text: "В темноте — W MROKU, местный падеж. Под покровом темноты — POD OSŁONĄ MROKU, где OSŁONĄ стоит в творительном после POD, а MROKU в родительном. Стемнело — ZAPADŁ MROK, и это оборот безличный только по смыслу: подлежащее здесь MROK, а глагол стоит в прошедшем времени мужского рода. Русский в этом месте скажет просто «стемнело», без подлежащего." }
  - { kind: pronunciation, text: "Читается «мрок», один слог, и поэтому знак ударения не нужен. Сочетание MR произносится слитно, без всякой гласной между согласными: не «морок», а «мрок». В косвенных падежах появляется второй слог и ударение падает на первый: MROKU это «мро́ку», MROKIEM — «мро́кем», с мягким «ке»." }
  - { kind: register, text: "Слово слегка книжное, но вполне обиходное, особенно в описаниях. О наступлении темноты поляк скажет ZAPADŁ MROK или, ещё чаще, ZAPADŁ ZMROK. Прилагательное MROCZNY значит «мрачный» и о погоде, и о человеке, и о тайне. А ZAMROCZYĆ значит «затуманить сознание», в том числе от вина, и слово это разговорное." }
