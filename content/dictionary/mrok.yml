  - { pl: "zamroczyć", ru: "затуманить сознание", relation: derived }
etymology: "Праславянское слово, давшее и русский «мрак». И здесь видно то самое правило полногласия, только изнутри русского языка. «Мрак» — форма церковнославянская, стянутая; а наша собственная, восточнославянская, сохранилась в «мороке», «обмороке» и в глаголе «морочить». Польское MROK стоит рядом с «мраком», стянутое точно так же. Значит, «морочить голову» и MROK — одно и то же слово."
memory: "Сумрак, полумрак — обычная вечерняя темнота, а не наш книжный «мрак». Читается «мрок», один слог, без гласной между м и р. Запомните zapadl mrok «стемнело» и pod oslona mroku «под покровом темноты». Множественное mroki только переносно: mroki niewiedzy. И родня неожиданная: наше «морочить» и «обморок» — то же слово, только с полногласием."
idioms:
  - { pl: "pod osłoną mroku", ru: "под покровом темноты" }
