# review
id: latac
format: 2
lemma: "latać"
rank: 1752
pos: verb
aspect: imperf
pron: { cyr: "ля́таць" }
senses:
  - id: fly
    ru: "летать (уметь, бояться, любить)"
    examples:
      - pl: "Boję się latać."
        ru: "Я боюсь летать."
        source: { kind: tatoeba, id: 5487324 }
      - pl: "Nie umiem latać."
        ru: "Я не умею летать."
        source: { kind: tatoeba, id: 956981 }
      - pl: "Ten ptak umie latać."
        ru: "Эта птица умеет летать."
        source: { kind: tatoeba, id: 2183377 }
  - id: fly-around
    ru: "летать (о птицах, насекомых, предметах)"
    examples:
      - pl: "Jaskółki latają bardzo szybko."
        ru: "Ласточки очень быстро летают."
        source: { kind: tatoeba, id: 3746354 }
      - pl: "Czarownice latają na miotłach."
        ru: "Ведьмы летают на мётлах."
        source: { kind: tatoeba, id: 5966624 }
      - pl: "Po pokoju latała osa."
        ru: "По комнате летала оса."
        source: { kind: tatoeba, id: 10469370 }
notes:
  - { kind: false-friend, text: "Форма lata в таблице ниже почти всегда принадлежит другому слову — lata «годы», множественному от rok. Wojna trwała cztery lata значит «война длилась четыре года», а не «война летала»." }
  - { kind: usage, text: "latać — многократное действие, «летать вообще»: ptaki latają «птицы летают». Однократный полёт в одну сторону — lecieć: samolot leci do Warszawy «самолёт летит в Варшаву»." }
  - { kind: government, text: "Летать на чём-то — latać czymś (творительный падеж): latać samolotem «летать самолётом», latać helikopterem." }
  - { kind: usage, text: "Переносно latać значит «носиться, суетиться»: latać jak kot z pęcherzem «носиться как угорелый»." }
collocations:
  - { pl: "latać samolotem", ru: "летать самолётом" }
  - { pl: "bać się latać", ru: "бояться летать" }
  - { pl: "latający spodek", ru: "летающая тарелка" }
family:
  - { pl: "lecieć", ru: "лететь", relation: root, id: leciec }
  - { pl: "latanie", ru: "полёты", relation: root }
  - { pl: "samolot", ru: "самолёт", relation: root, id: samolot }
etymology: "Праславянское *letati — то же слово, что русское «летать». Пара latać и lecieć повторяет русскую «летать» и «лететь»."
memory: "latać — «летать» вообще, многократно; lecieć — «лететь» в одну сторону. На чём — творительный: latać samolotem. Осторожно: форма lata почти всегда значит «годы»."
idioms:
  - { pl: "latający spodek", ru: "летающая тарелка" }
  - { pl: "latać samolotem", ru: "летать самолётом" }
  - { pl: "latać jak kot z pęcherzem", ru: "носиться как угорелый" }
