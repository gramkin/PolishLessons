notes:
  - { kind: usage, text: "Это прилагательное часто работает существительным, и обе роли надо держать в голове. В сочетании TŁUMACZ PRZYSIĘGŁY оно определяет: «присяжный переводчик». А само по себе PRZYSIĘGŁY значит «присяжный» как член суда присяжных, и отсюда ŁAWA PRZYSIĘGŁYCH, буквально «скамья присяжных». Одиннадцать форм, степеней сравнения нет: присяжным нельзя быть в большей мере, это должность. Мужско-личная форма множественного PRZYSIĘGLI, с чередованием Ł в L, как у BIAŁY и BIALI." }
  - { kind: pronunciation, text: "В этом слове собрались сразу три польских правила, и прочесть его целиком — хорошая проверка. Сочетание PRZ даёт «пш». Буква Y звучит как «ы». Сочетание SIĘ даёт «сен», потому что Ę перед G читается как «эн», а I смягчает S. Наконец, Ł перед Y даёт «у». Вместе получается «пшисе́нгуы», с ударением на предпоследнем слоге. В существительном PRZYSIĘGA слышно «пшисе́нга»." }
  - { kind: false-friend, text: "Корень тот же, что в русском «присяга», и соответствие гласных здесь регулярно: польская Ę отвечает русской Я, как в MIĘKKI и «мягкий», PIĘĆ и «пять», IMIĘ и «имя». Но русское «присягнувший» не годится для перевода: PRZYSIĘGŁY — это не причастие о человеке, который только что дал присягу, а постоянное официальное звание. Поэтому TŁUMACZ PRZYSIĘGŁY это профессия с государственным экзаменом и печатью, а не просто переводчик, принёсший клятву." }
  - { kind: government, text: "Прилагательное согласуется, а область полномочий указывается родительным: TŁUMACZ PRZYSIĘGŁY JĘZYKA ROSYJSKIEGO «присяжный переводчик русского языка». В судебном значении слово входит в сочетание с родительным множественного: ŁAWA PRZYSIĘGŁYCH, SĄD PRZYSIĘGŁYCH. Глагол того же гнезда PRZYSIĘGAĆ управляет дательным для лица и предлогом NA для того, чем клянутся: PRZYSIĘGAM CI NA WSZYSTKO «клянусь тебе всем»." }
  - { kind: register, text: "Слово официальное и живёт в документах и в суде, но знать его русскоязычному в Польше приходится с первых недель: любой документ для учреждения требует перевода именно у TŁUMACZ PRZYSIĘGŁY, и у такого переводчика есть номер в государственном реестре и круглая печать. Частые обороты: TŁUMACZ PRZYSIĘGŁY, TŁUMACZENIE PRZYSIĘGŁE, ŁAWA PRZYSIĘGŁYCH, PIECZĘĆ TŁUMACZA PRZYSIĘGŁEGO. Разговорного употребления у слова практически нет." }
