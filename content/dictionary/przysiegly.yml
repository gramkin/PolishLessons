etymology: "От PRZYSIĘGA «присяга», а корень здесь тот же, что в SIĘGAĆ «тянуться, достигать», от праславянского *sęg- со значением «протянуть руку, коснуться». Образ за словом древний и вещественный: присягающий протягивал руку и касался чего-то священного, оружия или книги. Русский держит тот же корень в словах «посягать», «досягаемый», «присяга», и русское «присяга» собрано из тех же частей, при плюс сяг. Соответствие гласных регулярно: польская Ę отвечает русской Я, поэтому PRZYSIĘGA и «присяга» это одно слово. Из того же гнезда PRZYSIĘGAĆ «присягать» и ZAPRZYSIĄC «привести к присяге»."
memory: "Корень тот же, что в «присяге», и за ним стоит sięgać «тянуться»: присягающий протягивал руку и касался священного, как в русском «посягать». Соответствие ę и я регулярно: przysięga и «присяга», miękki и «мягкий». Но переводить надо не «присягнувший», а «присяжный»: это звание. Главное практическое знание: tłumacz przysięgły с печатью и номером в реестре нужен для любого документа в учреждение. Читается «пшисе́нгуы», где prz это «пш», ę это «эн», ł это «у»."
