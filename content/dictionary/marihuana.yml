notes:
  - { kind: false-friend, text: "MARIHUANA — «марихуана», с H, которое читается «х». Разговорно — TRAWKA, жаргонно — ZIELE. Медицинская марихуана — MARIHUANA MEDYCZNA, она в Польше разрешена по рецепту." }
  - { kind: usage, text: "Женский род. Учим единственное: MARIHUANA, MARIHUANY, MARIHUANIE, MARIHUANĘ, MARIHUANĄ. В местном N смягчается: W MARIHUANIE." }
