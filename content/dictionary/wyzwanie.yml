notes:
  - { kind: usage, text: "przyjąć wyzwanie — «принять вызов», podjąć wyzwanie — «взяться за вызов». Оба оборота частотны." }
  - { kind: usage, text: "Образовано от wyzwać «вызвать (на бой)» суффиксом -anie; исходно это вызов на поединок." }
  - { kind: usage, text: "prawda albo wyzwanie — название игры «правда или действие»." }
  - { kind: usage, text: "В корпусе слово живёт почти только в именительном и родительном: остальные падежи не встречаются." }
collocations:
  - { pl: "przyjąć wyzwanie", ru: "принять вызов" }
  - { pl: "podjąć wyzwanie", ru: "взяться за задачу" }
  - { pl: "prawdziwe wyzwanie", ru: "настоящий вызов" }
etymology: "От wyzwać «вызвать (на поединок)» (wy- + zwać «звать»). Русское «вызов» построено ровно так же: «вы-» + «звать». Совпадение полное, включая переносное значение."
memory: "wyzwanie = «вызов, испытание», буквально от wyzwać «вызвать на бой», как русское «вызов» от «вызвать». Главные обороты: przyjąć wyzwanie «принять вызов», podjąć wyzwanie «взяться за задачу»."
idioms:
