notes:
  - { kind: usage, text: "przyjąć wyzwanie — «принять вызов», podjąć wyzwanie — «взяться за вызов». Оба оборота частотны." }
  - { kind: usage, text: "Образовано от wyzwać «вызвать (на бой)» суффиксом -anie; исходно это вызов на поединок." }
  - { kind: usage, text: "prawda albo wyzwanie — название игры «правда или действие»." }
  - { kind: usage, text: "В корпусе слово живёт почти только в именительном и родительном: остальные падежи не встречаются." }
