etymology: "От глагола POŻYCZYĆ, который построен на том же корне, что ŻYCZYĆ «желать», с приставкой PO-. Первоначальный смысл был близок к «пожаловать, уступить по доброй воле», и отсюда развилось «дать попользоваться», а затем и «дать в долг». Русский на то же понятие посмотрел с другой стороны и построил слова от «долга»: «одолжить», «задолжать», «должник». Получается, что польский назвал заём через пожелание и уступку, а русский через обязательство вернуть. Из польского гнезда сюда же относятся POŻYCZKODAWCA и POŻYCZKOBIORCA, собранные по немецкому образцу."
memory: "Главное в глаголе: pożyczyć значит и «дать в долг», и «взять в долг», различает только падеж. Pożycz MI с дательным значит «дай мне», pożyczyłem OD niego с родительным значит «я взял у него». Русское «одолжить» двусмысленно так же. В родительном множественного вставляется беглое e: pożyczek, как matek и książek. Отличать от kredyt: pożyczka может быть и от брата, kredyt только от банка. Читается «пожы́чка», где ż это «ж», y это «ы»."
