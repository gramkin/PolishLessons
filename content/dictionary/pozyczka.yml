notes:
  - { kind: false-friend, text: "Самое полезное здесь — глагол, от которого слово образовано. POŻYCZYĆ значит одновременно «дать в долг» и «взять в долг», и различает их только падеж. POŻYCZ MI STO ZŁOTYCH — «одолжи мне сто злотых», то есть дай; POŻYCZYŁEM OD NIEGO STO ZŁOTYCH — «я занял у него сто злотых», то есть взял. Дательный значит, что дают тебе, предлог OD с родительным — что берёшь ты. Русское «одолжить» двусмысленно ровно так же, так что ловушка знакомая, но в польском она встречается чаще." }
  - { kind: usage, text: "Существительное женского рода, десять падежных форм. В родительном множественного появляется беглое E: POŻYCZEK, а не «pożyczk», потому что три согласные подряд на конце слова польский не терпит. Это обратная сторона того же явления, что в KABEL и KABLA, где E, наоборот, исчезает. Тот же вставной гласный в MATKA и MATEK, KSIĄŻKA и KSIĄŻEK. Запомнив правило один раз, родительный множественного у женских слов на -KA можно не заучивать." }
  - { kind: government, text: "На что берут — предлог NA с винительным: POŻYCZKA NA MIESZKANIE «ссуда на квартиру», NA DZIESIĘĆ LAT «на десять лет». У кого — предлог OD с родительным: POŻYCZKA OD BANKU, OD BRATA. Взять — WZIĄĆ POŻYCZKĘ, винительный; выплатить — SPŁACIĆ POŻYCZKĘ, тоже винительный. Русский в первых двух случаях строит так же, через «на» и «у», только «у» требует родительного, а польское OD тоже родительного, так что схема переносится целиком." }
  - { kind: pronunciation, text: "Читается «пожы́чка», три слога, ударение на предпоследнем. Буква Ż с точкой даёт «ж», буква Y — «ы», сочетание CZ — твёрдое «ч». Отсюда «по-жы-чка», и ни одного звука здесь нельзя прочесть по-русски. В глаголе POŻYCZYĆ слышно «пожы́чычь», с двумя «ы» подряд через согласную. Не путать Ż с Z: ZOBACZYĆ начинается со звонкого «з», а POŻYCZKA содержит именно «ж»." }
  - { kind: register, text: "Слово нейтральное и банковское одновременно. Частые обороты: WZIĄĆ POŻYCZKĘ «взять ссуду», SPŁACIĆ POŻYCZKĘ «выплатить ссуду», RATA POŻYCZKI «взнос по ссуде», POŻYCZKA GOTÓWKOWA «потребительский кредит». Рядом стоит KREDYT, и разница есть: KREDYT даёт только банк и обычно под залог, POŻYCZKA может быть и от частного лица. Поэтому POŻYCZKA OD BRATA звучит естественно, а KREDYT OD BRATA — нет." }
