pron: { cyr: "о́тчуць" }
senses:
  - id: feel-sensation
    ru: "почувствовать, ощутить (боль, холод, перемену)"
    examples:
      - pl: "Odczuła zimno od razu przy drzwiach."
        ru: "Она сразу почувствовала холод у двери."
        source: { kind: authored }
      - pl: "Pacjent odczuje ulgę po zastrzyku."
        ru: "Пациент почувствует облегчение после укола."
        source: { kind: authored }
  - id: experience-effects
    ru: "испытать на себе, ощутить последствия"
    examples:
      - pl: "Mieszkańcy odczują skutki suszy."
        ru: "Жители ощутят последствия засухи."
        source: { kind: authored }
      - pl: "Rolnicy odczuli suszę najdotkliwiej."
        ru: "Фермеры ощутили засуху острее всех."
        source: { kind: authored }
  - id: feel-keenly
    ru: "остро пережить (утрату, обиду)"
    examples:
      - pl: "Najmocniej odczuł stratę brata."
        ru: "Сильнее всего он переживал потерю брата."
        source: { kind: authored }
      - pl: "Dał mi to boleśnie odczuć."
        ru: "Он дал мне это болезненно почувствовать."
        source: { kind: authored }
notes:
  - { kind: government, text: "odczuć coś — ВИНИТЕЛЬНЫЙ падеж без предлога: odczuć ból, zmianę, ulgę, skutki. Прямое дополнение есть, поэтому страдательные причастия образуются свободно: odczuty ból, boleśnie odczuta strata, skutki odczute przez całe miasto." }
  - { kind: government, text: "Исключение — мужсколичная форма odczuci. Дополнением при odczuć всегда бывает ощущение, перемена или последствие, но никогда человек: «почувствовать людей» сказать нельзя. Морфологически форма образуется от odczuty, однако подставить в неё нечего, поэтому она остаётся без употребления и примеров на неё в карточке нет." }
  - { kind: false-friend, text: "Корень czuć — прямой родственник русского «чуять», но регистр разошёлся. В польском czuć «чувствовать» — обычное повседневное слово (czuję ból «я чувствую боль»), а русское «чуять» сузилось до звериного или интуитивного восприятия. Русскому «чувствовать» соответствует именно польское czuć, а не что-то более книжное." }
  - { kind: usage, text: "Совершенный вид; несовершенный — odczuwać. Отглагольное существительное odczucie давно живёт самостоятельно и значит «ощущение, впечатление»: moje odczucia «мои ощущения», w moim odczuciu «на мой взгляд»." }
collocations:
  - { pl: "odczuć ulgę", ru: "почувствовать облегчение" }
  - { pl: "odczuć skutki", ru: "ощутить последствия" }
  - { pl: "boleśnie odczuć", ru: "болезненно пережить" }
family:
  - { pl: "czuć", ru: "чувствовать", relation: root, id: czuc }
  - { pl: "odczuwać", ru: "ощущать, чувствовать", relation: aspect }
  - { pl: "odczucie", ru: "ощущение, впечатление", relation: derived }
  - { pl: "uczucie", ru: "чувство", relation: derived, id: uczucie }
etymology: "Приставка od- и глагол czuć, восходящий к праславянскому *čuti «воспринимать, чувствовать». От того же корня русские «чуять», «чутьё», «чуткий» и «чувство». Приставка od- добавляет значение отклика на что-то внешнее: не просто чувствовать, а почувствовать в ответ, испытать на себе."
memory: "odczuć — от czuć, родственного русскому «чуять». Приставка od- даёт отклик на внешнее: odczuć skutki «ощутить последствия». А существительное odczucie значит «ощущение»: w moim odczuciu — «на мой взгляд»."
idioms:
  - { pl: "w moim odczuciu", ru: "на мой взгляд, по моему ощущению" }
  - { pl: "dać komuś coś boleśnie odczuć", ru: "дать кому-л. болезненно это почувствовать" }
formExamplesSkip:
  - { form: "odczuci", reason: "Страдательное причастие мужского лица от odczuty. Дополнением глагола odczuć бывает ощущение, перемена или последствие (odczuć ból, zmianę, skutki), но никогда человек — «почувствовать людей» по-польски сказать нельзя. Поскольку лицо при этом глаголе в винительном падеже не стоит, повышать в подлежащее нечего, и мужсколичная форма остаётся без употребления." }
