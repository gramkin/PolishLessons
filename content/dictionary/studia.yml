notes:
  - { kind: false-friend, text: "STUDIA — «учёба в вузе», только во множественном числе. Студия — STUDIO, другое слово: STUDIO NAGRAŃ, «студия звукозаписи». ISĆ NA STUDIA — «поступить в вуз», а не «пойти в студию»." }
  - { kind: usage, text: "Pluralia tantum: пять форм, все множественные. Магистратура — STUDIA MAGISTERSKIE, заочное обучение — STUDIA ZAOCZNE." }
  - { kind: government, text: "Поступить в вуз — IŚĆ NA STUDIA, NA с винительным. Учиться в вузе — BYĆ NA STUDIACH, NA с местным. После учёбы — PO STUDIACH. Исследования чего — STUDIA NAD и творительный." }
  - { kind: pronunciation, text: "Читается «сту́дья», ударение на первом слоге. DI перед гласной — мягкое «дь», а IA — «ья»." }
collocations:
  - { pl: "iść na studia", ru: "поступить в вуз" }
  - { pl: "skończyć studia", ru: "окончить вуз" }
  - { pl: "studia zaoczne", ru: "заочное обучение" }
family:
