  - { pl: "studiować", ru: "учиться в вузе", relation: root, id: studiowac }
  - { pl: "studio", ru: "студия", relation: root, id: studio }
etymology: "Из латинского STUDIUM «усердие, занятие», во множественном STUDIA. Тот же корень в словах «студент» и «штудировать»."
memory: "Studia — учёба в вузе, только множественное. Iść na studia — поступить в вуз, na studiach — в институте. Studio — студия."
idioms:
