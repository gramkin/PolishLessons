# review
id: opowiesc
format: 2
lemma: "opowieść"
rank: 1751
pos: noun
pron: { cyr: "опо́весьць" }
senses:
  - id: story
    ru: "рассказ, история, повесть"
    examples:
      - pl: "To piękna opowieść."
        ru: "Это прекрасная история."
        source: { kind: translated, id: 4151808 }
      - pl: "To opowieść o kocie."
        ru: "Это рассказ о коте."
        source: { kind: translated, id: 361321 }
      - pl: "Warto przeczytać tę opowieść."
        ru: "Этот рассказ стоит прочитать."
        source: { kind: tatoeba, id: 364062 }
  - id: telling
    ru: "рассказ (слушать, заканчивать, впечатляться)"
    examples:
      - pl: "Dokończ opowieść."
        ru: "Закончи рассказ."
        source: { kind: translated, id: 999232 }
      - pl: "Byłem pod wrażeniem jego opowieści."
        ru: "Я был под впечатлением от его рассказа."
        source: { kind: translated, id: 367622 }
      - pl: "Czy jego opowieść może być prawdą?"
        ru: "Может ли его рассказ быть правдой?"
        source: { kind: tatoeba, id: 3460695 }
notes:
  - { kind: usage, text: "opowieść — это рассказанная история; opowiadanie — литературный жанр рассказа, а historia — и «история» как наука, и «история» как происшествие." }
  - { kind: government, text: "История о чём-то — opowieść o czymś (предложный падеж): opowieść o kocie «рассказ о коте»." }
  - { kind: usage, text: "Глагол того же корня — opowiadać «рассказывать»; opowiedzieć «рассказать»." }
  - { kind: false-friend, text: "Русская «повесть» как жанр по-польски тоже opowieść, но в живой речи слово значит просто «рассказ, история»." }
collocations:
  - { pl: "opowieść o czymś", ru: "рассказ о чём-либо" }
  - { pl: "piękna opowieść", ru: "прекрасная история" }
  - { pl: "dokończyć opowieść", ru: "закончить рассказ" }
family:
  - { pl: "opowiadać", ru: "рассказывать", relation: root, id: opowiadac }
  - { pl: "opowiadanie", ru: "рассказ (жанр)", relation: root }
  - { pl: "historia", ru: "история", relation: root, id: historia }
etymology: "От opowiadać «рассказывать», приставка o- плюс powiedzieć «сказать». Русская «повесть» — от «поведать», того же корня."
memory: "opowieść — «рассказ, история»: opowieść o kocie. Жанр рассказа — opowiadanie, а наука и происшествие — historia. Глагол — opowiadać."
idioms:
