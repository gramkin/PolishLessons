# review
id: minac
format: 2
lemma: "minąć"
rank: 726
pos: verb
aspect: perf
pron: { cyr: "ми́нонць" }
senses:
  - id: pass-time
    ru: "пройти, миновать (о времени)"
    examples:
      - pl: "Minęło pięć dni."
        ru: "Прошло пять дней."
        source: { kind: tatoeba, id: 13031759 }
      - pl: "Minęło 10 lat."
        ru: "Прошло 10 лет."
        source: { kind: translated, id: 362844 }
      - pl: "Ból minął."
        ru: "Боль прошла."
        source: { kind: translated, id: 1589318 }
  - id: pass-by
    ru: "пройти мимо, миновать (о месте); разминуться"
    note: "minąć coś — винительный без предлога: minąć dom «пройти мимо дома»."
    examples:
      - pl: "Minął ten dom."
        ru: "Он прошёл мимо этого дома."
        source: { kind: translated, id: 367669 }
      - pl: "Jeśli tylko miniesz tę górę, cała reszta to bułka z masłem."
        ru: "Если только минуешь эту гору, остальное — пустяки."
        source: { kind: translated, id: 503792 }
      - pl: "Minęliśmy się z nimi samochodami w pobliżu dworca."
        ru: "Мы разминулись с ними на машинах возле вокзала."
        source: { kind: translated, id: 710422 }
notes:
  - { kind: government, text: "minąć coś — винительный падеж без предлога: minąć dom, minąć przystanek. Русское «пройти мимо» требует предлога, польское — нет." }
  - { kind: usage, text: "Формы minę, miniesz, minie — БУДУЩЕЕ время: глагол совершенного вида. Несовершенный — mijać." }
  - { kind: false-friend, text: "Форма minę совпадает с винительным падежом существительного mina «выражение лица, гримаса»: Zrobił smutną minę «Он сделал грустное лицо» — это существительное, а не глагол." }
  - { kind: usage, text: "О времени глагол употребляется безлично: minęło pięć dni «прошло пять дней», minęła siódma «пробило семь». Частый вопрос: Jak minął dzień? «Как прошёл день?»." }
collocations:
  - { pl: "minąć przystanek", ru: "проехать остановку" }
  - { pl: "czas minął", ru: "время прошло" }
  - { pl: "jak minął dzień?", ru: "как прошёл день?" }
  - { pl: "najgorsze minęło", ru: "худшее позади" }
family:
  - { pl: "mijać", ru: "миновать, проходить", relation: derived }
  - { pl: "mijanka", ru: "разъезд", relation: derived }
etymology: "Праславянское *minǫti — то же слово, что русские «миновать» и «минуть». Отсюда же mijać «проходить» и существительное mijanka «разъезд»."
memory: "minąć — «миновать, пройти». Управление проще русского: minąć coś, винительный без предлога — minąć dom, minąć przystanek, тогда как по-русски нужно «пройти мимо». О времени глагол идёт безлично: minęło pięć dni, minęła siódma, Jak minął dzień? Формы minę, miniesz — будущее время. Одна ловушка: minę совпадает с винительным существительного mina «выражение лица» — Zrobił smutną minę это не глагол."
idioms:
  - { pl: "czas minął", ru: "время прошло" }
  - { pl: "najgorsze minęło", ru: "худшее позади" }
  - { pl: "minąć przystanek", ru: "проехать остановку" }
