# review
id: wzajemnie
format: 2
lemma: "wzajemnie"
rank: 3262
pos: adv
pron: { cyr: "взае́мне" }
senses:
  - id: mutually
    ru: "взаимно, друг друга"
    examples:
      - pl: "Pomagamy sobie wzajemnie."
        ru: "Мы помогаем друг другу."
        source: { kind: authored }
      - pl: "Wzajemnie się uzupełniają."
        ru: "Они дополняют друг друга."
        source: { kind: authored }
      - pl: "Obie strony wzajemnie się oskarżają."
        ru: "Обе стороны обвиняют друг друга."
        source: { kind: authored }
  - id: likewise
    ru: "и вам того же (ответ на пожелание)"
    examples:
      - pl: "Dziękuję, wzajemnie!"
        ru: "Спасибо, и вам того же!"
        source: { kind: authored }
      - pl: "Na życzenia odpowiedział krótko: wzajemnie."
        ru: "На пожелания он коротко ответил: «И вам того же»."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "WZAJEMNIE — «взаимно», и как ответ оно шире русского. На «Приятного аппетита!», «С праздником!», «Хорошего дня!» поляк отвечает WZAJEMNIE! или NAWZAJEM! — «И вам того же!». Русское «взаимно» так почти не употребляют." }
  - { kind: usage, text: "Наречие, одна форма. Часто стоит рядом с SIĘ или SOBIE: SZANUJĄ SIĘ WZAJEMNIE, «уважают друг друга». Прилагательное — WZAJEMNY: WZAJEMNA POMOC, «взаимопомощь». Существительное — WZAJEMNOŚĆ: BEZ WZAJEMNOŚCI, «без взаимности»." }
  - { kind: government, text: "Наречие ничем не управляет. Взаимность выражает пара с возвратным местоимением: SIĘ при винительном, SOBIE при дательном: POMAGAĆ SOBIE WZAJEMNIE, «помогать друг другу»." }
  - { kind: pronunciation, text: "Читается «взае́мне», ударение на предпоследнем слоге. WZ — звонкое «вз», JE — «е», NIE — «не»." }
collocations:
  - { pl: "pomagać sobie wzajemnie", ru: "помогать друг другу" }
  - { pl: "wzajemnie się szanować", ru: "уважать друг друга" }
  - { pl: "wzajemnie się wykluczać", ru: "взаимно исключать друг друга" }
family:
  - { pl: "wzajemny", ru: "взаимный", relation: root }
  - { pl: "wzajemność", ru: "взаимность", relation: root }
  - { pl: "nawzajem", ru: "друг друга; и вам того же", relation: root, id: nawzajem }
etymology: "От старого WZAJEM «взаимно, в обмен». Корень тот же, что в русских «взаём», «взаймы»: взаимность — это обмен, когда каждый и берёт, и отдаёт."
memory: "Wzajemnie — взаимно, друг друга. Читается «взае́мне». Smacznego! — Wzajemnie! (И вам того же!). Z wzajemnością — со взаимностью."
idioms:
  - { pl: "z wzajemnością", ru: "со взаимностью" }
formExamples:
  - form: "wzajemnie"
    pl: "Szanują się wzajemnie."
    ru: "Они уважают друг друга."
    source: { kind: authored }
  - form: "wzajemnie"
    pl: "Wzajemnie się wspierali przez całe życie."
    ru: "Всю жизнь они поддерживали друг друга."
    source: { kind: authored }
  - form: "wzajemnie"
    pl: "Te dwie teorie wzajemnie się wykluczają."
    ru: "Эти две теории взаимно исключают друг друга."
    source: { kind: authored }
