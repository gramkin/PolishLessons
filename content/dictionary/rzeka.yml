# review
id: rzeka
format: 2
lemma: "rzeka"
rank: 1413
pos: noun
pron: { cyr: "жэ́ка" }
senses:
  - id: river
    ru: "река"
    examples:
      - pl: "Rzeka była mała."
        ru: "Река была маленькая."
        source: { kind: tatoeba, id: 12710212 }
      - pl: "Jak nazywa się ta rzeka?"
        ru: "Как называется эта река?"
        source: { kind: tatoeba, id: 3807933 }
      - pl: "Nasza polska rzeka Wisła jest długa."
        ru: "Наша польская река Висла длинная."
        source: { kind: tatoeba, id: 732531 }
  - id: in-river
    ru: "w rzece — в реке"
    examples:
      - pl: "Często myję się w rzece."
        ru: "Я часто моюсь в реке."
        source: { kind: tatoeba, id: 12727091 }
      - pl: "Utonął w rzece."
        ru: "Он утонул в реке."
        source: { kind: translated, id: 591359 }
      - pl: "Pływam w rzece."
        ru: "Я плаваю в реке."
        source: { kind: translated, id: 6483117 }
  - id: along-river
    ru: "wzdłuż rzeki — вдоль реки"
    examples:
      - pl: "Szedłem wzdłuż rzeki."
        ru: "Я шёл вдоль реки."
        source: { kind: tatoeba, id: 6178163 }
      - pl: "On szedł wzdłuż rzeki."
        ru: "Он шел вдоль реки."
        source: { kind: tatoeba, id: 3326221 }
      - pl: "Nie ma dłuższej rzeki niż Nil."
        ru: "Ни одна река в мире не длиннее Нила."
        source: { kind: tatoeba, id: 3462979 }
notes:
  - { kind: government, text: "Три падежа по смыслу: w rzece «в реке» (предложный), nad rzeką «у реки» (творительный), wzdłuż rzeki «вдоль реки» (родительный)." }
  - { kind: usage, text: "Przepłynąć rzekę «переплыть реку» — винительный падеж без предлога." }
  - { kind: usage, text: "Названия рек склоняются вместе со словом: Wisła jest najdłuższą rzeką «Висла — самая длинная река»." }
  - { kind: pronunciation, text: "rz звучит как «ж»: жэ́ка. Ударение на первый слог." }
collocations:
  - { pl: "w rzece", ru: "в реке" }
  - { pl: "nad rzeką", ru: "у реки" }
  - { pl: "wzdłuż rzeki", ru: "вдоль реки" }
etymology: "Праславянское *rěka — то же слово, что русская «река». Польское rz на месте русского «р» перед е — регулярное соответствие."
memory: "rzeka — «река», и rz звучит как «ж»: жэ́ка. Падежи по смыслу: w rzece «в реке», nad rzeką «у реки», wzdłuż rzeki «вдоль реки», przepłynąć rzekę «переплыть реку»."
idioms:
  - { pl: "w rzece", ru: "в реке" }
  - { pl: "nad rzeką", ru: "у реки" }
  - { pl: "wzdłuż rzeki", ru: "вдоль реки" }
formExamplesSkip:
  - { form: "rzeko", reason: "звательный падеж: для неодушевлённого существительного он практически не употребляется" }
