# review
id: dojsc
format: 2
lemma: "dojść"
rank: 625
pos: verb
aspect: perf
pron: { cyr: "до́йсьць" }
senses:
  - id: reach-on-foot
    ru: "дойти (до чего-л. — do с родительным)"
    examples:
      - pl: "Zimą na wyspę można dojść po lodzie."
        ru: "Зимой до острова можно дойти по льду."
        source: { kind: tatoeba, id: 12624972 }
      - pl: "Tą drogą dojdziesz do śródmieścia."
        ru: "По этой дороге ты дойдёшь до центра."
        source: { kind: translated, id: 3143889 }
      - pl: "Idź cały czas prosto, a dojdziesz do sklepu."
        ru: "Иди всё время прямо, и дойдёшь до магазина."
        source: { kind: translated, id: 2246615 }
  - id: come-to
    ru: "dojść do wniosku, do siebie — прийти к выводу, в себя"
    examples:
      - pl: "Potrzeba mu czasu, żeby dojść do siebie."
        ru: "Ему нужно время, чтобы прийти в себя."
        source: { kind: tatoeba, id: 6313913 }
      - pl: "Doszedłem do tego samego wniosku co ty."
        ru: "Я пришёл к тому же выводу, что и ты."
        source: { kind: translated, id: 924569 }
      - pl: "Tom i Mary doszli do porozumienia."
        ru: "Том и Мэри пришли к соглашению."
        source: { kind: translated, id: 5088093 }
  - id: impersonal
    ru: "doszło DO czegoś — произошло, дошло до"
    note: "Очень частый безличный оборот."
    examples:
      - pl: "Jak doszło do wypadku drogowego?"
        ru: "Как произошла дорожная авария?"
        source: { kind: translated, id: 4620041 }
      - pl: "Tak właśnie do tego doszło."
        ru: "Вот так это и произошло."
        source: { kind: translated, id: 744150 }
      - pl: "Nie dojdzie do tego."
        ru: "До этого не дойдёт."
        source: { kind: translated, id: 10643139 }
  - id: arrive-mail
    ru: "дойти (о письме, товаре)"
    examples:
      - pl: "List nie doszedł, bo podałeś zły adres."
        ru: "Письмо не дошло, потому что ты неправильно написал адрес."
        source: { kind: tatoeba, id: 8428544 }
      - pl: "Czy towar już doszedł?"
        ru: "Товар уже дошёл?"
        source: { kind: translated, id: 781294 }
      - pl: "Doszły mnie słuchy."
        ru: "До меня дошли слухи."
        source: { kind: translated, id: 13661911 }
notes:
  - { kind: usage, text: "Прошедшее время неправильное, с той же основой, что у iść: doszedł, doszła, doszli — ровно как русское «шёл». Будущее при этом правильное: dojdę, dojdziesz, dojdzie." }
  - { kind: government, text: "Цель идёт через do с родительным: dojść do stacji, do wniosku, do porozumienia, do siebie." }
  - { kind: usage, text: "Отсюда вырос очень частый безличный оборот doszło DO czegoś «произошло»: Jak doszło do wypadku? «Как произошла авария?», nie dojdzie do tego «до этого не дойдёт»." }
  - { kind: usage, text: "Устойчивые: dojść do siebie «прийти в себя», dojść do wniosku «прийти к выводу», dojść do porozumienia «прийти к соглашению»." }
  - { kind: usage, text: "Несовершенный вид — dochodzić." }
collocations:
  - { pl: "dojść do wniosku", ru: "прийти к выводу" }
  - { pl: "dojść do siebie", ru: "прийти в себя" }
  - { pl: "doszło do czegoś", ru: "произошло что-то" }
  - { pl: "dojść do porozumienia", ru: "прийти к соглашению" }
family:
  - { pl: "dochodzić", ru: "доходить", relation: aspect }
  - { pl: "iść", ru: "идти", relation: root }
  - { pl: "dojście", ru: "подход, дорога", relation: derived }
etymology: "Приставка do- плюс iść «идти», праславянское *jьti. Прошедшее doszedł построено на той же основе, что русское «шёл»."
memory: "dojść — «дойти», и прошедшее время у него неправильное, ровно как у iść: doszedł, doszła, doszli — с той же основой, что русское «шёл». Будущее при этом правильное: dojdę, dojdziesz. Цель идёт через do с родительным, и отсюда вырос очень частый безличный оборот doszło DO czegoś «произошло»: Jak doszło do wypadku? Плюс обороты dojść do siebie «прийти в себя» и dojść do wniosku «прийти к выводу»."
idioms:
  - { pl: "dojść do wniosku", ru: "прийти к выводу" }
  - { pl: "dojść do siebie", ru: "прийти в себя" }
  - { pl: "doszło do czegoś", ru: "произошло что-то" }
