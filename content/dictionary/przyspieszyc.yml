# review
id: przyspieszyc
format: 2
lemma: "przyspieszyć"
rank: 5051
pos: verb
pron: { cyr: "пшыспе́шыць" }
senses:
  - id: speed-up
    ru: "ускорить; прибавить скорость"
    examples:
      - pl: "Kierowca przyspieszył na prostej."
        ru: "Водитель прибавил скорость на прямой."
        source: { kind: authored }
      - pl: "Przyspieszyła kroku, bo zaczęło padać."
        ru: "Она ускорила шаг, потому что начался дождь."
        source: { kind: authored }
      - pl: "Musimy przyspieszyć prace."
        ru: "Нам нужно ускорить работы."
        source: { kind: authored }
  - id: bring-forward
    ru: "перенести на более ранний срок"
    examples:
      - pl: "Przyspieszono termin wyborów."
        ru: "Выборы перенесли на более ранний срок."
        source: { kind: authored }
      - pl: "Przyspieszyliśmy wyjazd o tydzień."
        ru: "Мы перенесли отъезд на неделю раньше."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "PRZYSPIESZYĆ — «ускорить, прибавить скорость», от SPIESZYĆ SIĘ, «спешить». Важное отличие: «ускорить шаг» — PRZYSPIESZYĆ KROKU, с родительным, а не винительным. Противоположность — ZWOLNIĆ, «замедлить, сбавить скорость»." }
  - { kind: usage, text: "Пятьдесят две формы: страдательное PRZYSPIESZONY — «ускоренный»: PRZYSPIESZONY KURS, PRZYSPIESZONE WYBORY; форма для мужчин-людей PRZYSPIESZENI в карточку не включена. Деепричастие PRZYSPIESZYWSZY. Видовой партнёр — PRZYSPIESZAĆ. Вариант PRZYŚPIESZYĆ — тоже правильный." }
  - { kind: government, text: "Что — винительный: PRZYSPIESZYĆ PROCES, TERMIN. Шаг, бег, темп — родительный: PRZYSPIESZYĆ KROKU, BIEGU. На сколько — O с винительным: O TYDZIEŃ. Без дополнения — о машине: AUTO PRZYSPIESZYŁO." }
  - { kind: pronunciation, text: "Читается «пшыспе́шыць», четыре слога, ударение на предпоследнем. PRZY — «пшы», SPIE — «спе», SZ — твёрдое «ш». Конечное Ć — «ць». PRZYSPIESZENIE — «ускорение» — «пшыспеше́не»." }
  - { kind: register, text: "Нейтральное слово техники, спорта, новостей. В физике PRZYSPIESZENIE — «ускорение». В быту: PRZYSPIESZ, BO SIĘ SPÓŹNIMY, «поторопись, а то опоздаем»." }
collocations:
  - { pl: "przyspieszyć kroku", ru: "ускорить шаг" }
  - { pl: "przyspieszone wybory", ru: "досрочные выборы" }
  - { pl: "przyspieszyć proces", ru: "ускорить процесс" }
family:
  - { pl: "przyspieszać", ru: "ускорять", relation: aspect }
  - { pl: "spieszyć", ru: "спешить", relation: root }
  - { pl: "zwolnić", ru: "замедлить, сбавить скорость", relation: antonym, id: zwolnic }
etymology: "Приставка PRZY- плюс SPIESZYĆ «спешить», праславянское *spěšiti, то же, что русское «спешить», «поспешить», «спех». Польское PIE на месте русского «пе» — обычное соответствие."
memory: "Przyspieszyć — ускорить: przyspieszyć proces, termin. Przyspieszyć kroku — ускорить шаг (родительный!). Przyspieszone wybory — досрочные. Zwolnić — сбавить. Читается «пшыспе́шыць»."
idioms:
  - { pl: "przyspieszyć kroku", ru: "ускорить шаг" }
formExamplesSkip:
  - { form: "przyspieszeni", reason: "людей не «ускоряют»: формы для мужчин-людей нет" }
