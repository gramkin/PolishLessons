senses:
  - id: paper
    ru: "обклеивать (сплошь, изнутри — бумагой, плакатами, обоями)"
    examples:
      - pl: "Mój syn wylepia ściany plakatami."
        ru: "Мой сын обклеивает стены плакатами."
        source: { kind: authored }
      - pl: "Wylepiamy szuflady papierem, żeby się nie brudziły."
        ru: "Мы обклеиваем ящики бумагой, чтобы они не пачкались."
