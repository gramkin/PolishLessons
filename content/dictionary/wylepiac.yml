etymology: "Приставка WY- плюс LEPIĆ «лепить, клеить», праславянское *lěpiti; родственно русским «лепить» и «липкий». WY- здесь — «сплошь, изнутри до краёв»."
memory: "Wylepiać — залепить «вы-» всё до краёв: ściany wylepione plakatami — стены в плакатах сплошь."
idioms:
  - { pl: "wylepiać od podłogi do sufitu", ru: "обклеивать сплошь, от пола до потолка" }
formExamplesSkip:
