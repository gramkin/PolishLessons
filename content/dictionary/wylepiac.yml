notes:
  - { kind: false-friend, text: "WYLEPIAĆ — не «вылеплять фигурку» (это LEPIĆ, ULEPIĆ: ULEPIĆ BAŁWANA «слепить снеговика»), а сплошь покрывать поверхность изнутри: обклеивать (WYLEPIAĆ ŚCIANY PLAKATAMI) или обмазывать, выкладывать (WYLEPIAĆ GNIAZDO GLINĄ, FORMĘ CIASTEM)." }
  - { kind: government, text: "Что покрывают — винительный, чем — творительный без предлога: WYLEPIAĆ PUDEŁKO PAPIEREM, ŚCIANY TAPETĄ. Русское «обклеивать чем» устроено так же." }
  - { kind: usage, text: "Несовершенный вид; совершенный — WYLEPIĆ. Спряжение на -AM: WYLEPIAM, WYLEPIASZ, WYLEPIAJĄ. Причастие WYLEPIONY (от WYLEPIĆ) встречается чаще, чем WYLEPIANY: ŚCIANA WYLEPIONA ZDJĘCIAMI. Мужско-личное страдательное WYLEPIANI в карточку не включено: обклеивают стены и коробки, а не людей." }
  - { kind: pronunciation, text: "Читается «выле́пяць»: Y — «ы», L перед E — мягкое «ле», PI перед A — «пя» без отдельного «и»." }
collocations:
  - { pl: "wylepiać ściany plakatami", ru: "обклеивать стены плакатами" }
  - { pl: "wylepiać formę ciastem", ru: "выкладывать форму тестом" }
  - { pl: "wylepiać gniazdo gliną", ru: "обмазывать гнездо глиной" }
family:
  - { pl: "wylepić", ru: "обклеить, обмазать", relation: aspect }
  - { pl: "lepić", ru: "лепить, клеить", relation: root }
  - { pl: "przylepiać", ru: "приклеивать", relation: root }
  - { pl: "lepki", ru: "липкий", relation: root }
