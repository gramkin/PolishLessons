        ru: "Ученики обклеивали класс рисунками."
        source: { kind: authored }
  - id: line
    ru: "обмазывать, выкладывать (глиной, тестом)"
    examples:
      - pl: "Jaskółki wylepiają gniazda gliną."
        ru: "Ласточки обмазывают гнёзда глиной."
