# review
id: kiedys
format: 2
lemma: "kiedyś"
rank: 303
pos: adv
pron: { cyr: "ке́дысь" }
senses:
  - id: ever
    ru: "когда-нибудь (о прошлом опыте, в вопросах)"
    examples:
      - pl: "Jadłeś kiedyś indyka?"
        ru: "Ты когда-нибудь ел индейку?"
        source: { kind: tatoeba, id: 3645372 }
      - pl: "Byłeś kiedyś w Afryce?"
        ru: "Ты был когда-нибудь в Африке?"
        source: { kind: tatoeba, id: 5683544 }
      - pl: "Byłeś kiedyś za granicą?"
        ru: "Ты когда-нибудь был за границей?"
        source: { kind: tatoeba, id: 363080 }
  - id: once
    ru: "когда-то, однажды"
    examples:
      - pl: "Tom kiedyś tu mieszkał."
        ru: "Том здесь когда-то жил."
        source: { kind: tatoeba, id: 13830860 }
      - pl: "Słyszałeś kiedyś o nim?"
        ru: "Ты когда-нибудь слышал о нём?"
        source: { kind: tatoeba, id: 361206 }
      - pl: "Widział pan kiedyś kangura?"
        ru: "Вы когда-нибудь видели кенгуру?"
        source: { kind: tatoeba, id: 4474015 }
notes:
  - { kind: usage, text: "Одно слово покрывает оба русских: «когда-то» о прошлом (Kiedyś tu mieszkał) и «когда-нибудь» о будущем или об опыте (Byłeś kiedyś w Afryce?)." }
  - { kind: usage, text: "Byłeś kiedyś…? — стандартный вопрос об опыте, как английское have you ever." }
  - { kind: usage, text: "Частица -ś делает слово неопределённым, ровно как русское «-то»: kto «кто» — ktoś «кто-то», gdzie «где» — gdzieś «где-то», kiedy «когда» — kiedyś." }
collocations:
  - { pl: "byłeś kiedyś", ru: "ты когда-нибудь был" }
  - { pl: "kiedyś dawno", ru: "когда-то давно" }
  - { pl: "kiedyś to zrozumiesz", ru: "когда-нибудь ты это поймёшь" }
  - { pl: "jak kiedyś", ru: "как когда-то" }
etymology: "Из kiedy «когда» и неопределённой частицы -ś; та же модель, что в русском «когда-то»."
memory: "kiedyś — и «когда-то», и «когда-нибудь»: Byłeś kiedyś w Afryce? и Kiedyś tu mieszkał. Частица -ś работает как русское «-то»."
idioms:
  - { pl: "byłeś kiedyś", ru: "ты когда-нибудь был" }
  - { pl: "kiedyś to zrozumiesz", ru: "когда-нибудь ты поймёшь" }
  - { pl: "kiedyś dawno temu", ru: "когда-то давным-давно" }
