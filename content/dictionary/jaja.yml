# review
id: jaja
format: 2
lemma: "jaja"
rank: 1204
pos: noun
pron: { cyr: "я́я" }
senses:
  - id: eggs
    ru: "яйца (еда, биология) — множественное от jajo"
    examples:
      - pl: "Kupiłem tuzin jaj."
        ru: "Я купил дюжину яиц."
        source: { kind: tatoeba, id: 441238 }
      - pl: "Ptaki składają jaja."
        ru: "Птицы откладывают яйца."
        source: { kind: tatoeba, id: 10642397 }
      - pl: "Wieloryb nie składa jaj, bo jest ssakiem."
        ru: "Кит не откладывает яиц, потому что он млекопитающее."
        source: { kind: tatoeba, id: 4275099 }
  - id: everyday
    ru: "в бытовой речи: покупать, любить, не любить яйца"
    examples:
      - pl: "Nie lubię jaj."
        ru: "Я не люблю яйца."
        source: { kind: translated, id: 593307 }
      - pl: "Czy kupiłaś jaja?"
        ru: "Ты купила яйца?"
        source: { kind: translated, id: 10586687 }
      - pl: "Cena jaj wzrasta."
        ru: "Цена на яйца растёт."
        source: { kind: translated, id: 1258119 }
  - id: joke
    ru: "robić sobie jaja — прикалываться, разыгрывать (разговорное)"
    examples:
      - pl: "Nie rób sobie jaj!"
        ru: "Не прикалывайся!"
        source: { kind: translated, id: 590877 }
      - pl: "Jaja se robisz?"
        ru: "Ты прикалываешься?"
        source: { kind: translated, id: 13335498 }
      - pl: "Ale jaja!"
        ru: "Вот это прикол!"
        source: { kind: translated, id: 6113081 }
notes:
  - { kind: usage, text: "Jaja — множественное от jajo «яйцо». В быту яйцо на столе чаще называют jajko, множественное jajka; jaja звучит проще и грубее." }
  - { kind: register, text: "Осторожно: у слова есть и анатомическое значение «яички», поэтому оно легко звучит двусмысленно. В магазине безопаснее попросить jajka." }
  - { kind: usage, text: "Разговорные обороты: robić sobie jaja «прикалываться», Ale jaja! «вот это прикол!», mieć jaja «быть смелым»." }
  - { kind: government, text: "składać jaja «откладывать яйца» — винительный падеж. При отрицании он меняется на родительный: nie składa jaj." }
collocations:
  - { pl: "tuzin jaj", ru: "дюжина яиц" }
  - { pl: "składać jaja", ru: "откладывать яйца" }
  - { pl: "robić sobie jaja", ru: "прикалываться" }
etymology: "Множественное от jajo, из праславянского *aje — то же слово, что русское «яйцо». Уменьшительное jajko почти вытеснило jajo в бытовой речи."
memory: "jaja — «яйца», множественное от jajo. Но в магазине лучше просить jajka: jaja заодно значит «яички» и звучит грубовато. И запомните разговорное robić sobie jaja «прикалываться» и Ale jaja! «вот это прикол!»."
idioms:
  - { pl: "robić sobie jaja", ru: "прикалываться" }
  - { pl: "ale jaja!", ru: "вот это прикол!" }
  - { pl: "mieć jaja", ru: "быть смелым" }
