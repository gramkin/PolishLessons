notes:
  - { kind: usage, text: "Двенадцатая форма — ŚWIADOM — это краткое сказуемостное прилагательное, уцелевший остаток целого разряда. Оно ставится только в сказуемом и только в мужском роде единственного числа: jestem świadom, był świadom. Сказать «świadom człowiek» нельзя, там нужно świadomy. Таких слов в польском осталось четыре: świadom, zdrów, gotów, winien. Для русского это переворот привычного: у нас краткие формы живые и свободные — «здоров», «готов», «должен», — а польский сохранил горстку." }
  - { kind: government, text: "Прилагательное требует родительного падежа: ŚWIADOMY CZEGOŚ. Być świadomym ryzyka, świadom konsekwencji, świadoma własnych braków. Русское «осознающий» управляет винительным — «осознаю риск», — и подстановка винительного сюда даёт ошибку. Запоминать лучше целым оборотом: świadomy czego, а не co." }
collocations:
