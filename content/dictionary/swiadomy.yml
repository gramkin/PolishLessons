etymology: "Из праславянского *sъvědomъ, где корень *věd- «ведать, знать» — тот же, что в русских «ведать», «сведения» и устаревшем «сведомый». Приставка sъ- та же, что в нашем «сознавать». Отсюда же польские świadek «свидетель» и świadomość «сознание», а у нас от этого корня «свидетель» и «свидетельство»."
memory: "ŚWIADOM — краткая форма только для сказуемого и только мужского рода: jestem świadom. И падеж родительный: świadomy czegoś."
idioms:
