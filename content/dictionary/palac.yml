family:
  - { pl: "pałacowy", ru: "дворцовый", relation: derived }
  - { pl: "pałacyk", ru: "особняк", relation: derived }
  - { pl: "zamek", ru: "замок", relation: root, id: zamek }
etymology: "Из латинского palatium — так называли дворцы на Палатинском холме в Риме, где строились императоры. Через итальянское palazzo и немецкое Palast слово разошлось по Европе и пришло в польский. Русский для этого понятия взял своё «дворец» от «двора», но палатинский корень у нас тоже есть — в слове «палаты»."
memory: "Родительный на -u: do pałacu, а ł читается как «у»: «па́уац». Ударение при этом съезжает вправо: pa-ŁA-cu."
idioms:
  - { pl: "pałac kultury", ru: "дворец культуры" }
  - { pl: "pałac ślubów", ru: "дворец бракосочетаний" }
