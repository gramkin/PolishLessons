notes:
  - { kind: usage, text: "Родительный — PAŁACU, с окончанием -u, а не -a. Это обычный выбор для неодушевлённых мужских с отвлечённым или собирательным смыслом, как sok — soku и zysk — zysku. Та же форма pałacu работает за предложный (w pałacu) и за звательный, так что одно слово закрывает три падежа сразу." }
  - { kind: pronunciation, text: "Буква ł читается как русское «у» неслоговое, поэтому pałac звучит «па́уац», а не «палац». Ударение по-польски на предпоследнем слоге, и при удлинении слова оно переезжает: PA-łac, но pa-ŁA-cu, pa-ŁA-ca-mi. Русскому слуху привычнее держать ударение на месте, и это слышно." }
collocations:
