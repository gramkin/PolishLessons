# review
id: balwan
format: 2
lemma: "bałwan"
rank: 5678
pos: noun
pron: { cyr: "ба́уван" }
senses:
  - id: snowman
    ru: "снеговик"
    examples:
      - pl: "Kto ulepił bałwana?"
        ru: "Кто слепил снеговика?"
        source: { kind: translated, id: 524336 }
      - pl: "Jeśli jutro będzie śnieg, ulepię bałwana."
        ru: "Если завтра будет снег, я слеплю снеговика."
        source: { kind: translated, id: 1626238 }
      - pl: "Następnego ranka bałwan był całkowicie stopiony."
        ru: "На следующее утро снеговик совсем растаял."
        source: { kind: translated, id: 10992745 }
  - id: blockhead
    ru: "болван, истукан (бранно)"
    examples:
      - pl: "Cóż za bałwan ze mnie."
        ru: "Ну и болван же я."
        source: { kind: translated, id: 921533 }
      - pl: "Nie stój jak bałwan."
        ru: "Не стой как истукан."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Русский «болван» и польский bałwan — одно слово, и бранное значение общее. Но главное значение в польском другое: это СНЕГОВИК. Ulepić bałwana значит «слепить снеговика», а вовсе не обругать кого-то." }
  - { kind: government, text: "Мужской; в значении «снеговик» винительный как у одушевлённых — ulepić bałwana, а не bałwan. Это обычное дело для фигурок: lepić bałwana, narysować bałwana." }
  - { kind: usage, text: "Третье, книжное значение — «идол, истукан»: bić pokłony bałwanom «кланяться идолам». Отсюда bałwochwalstwo «идолопоклонство»." }
  - { kind: usage, text: "Ещё одно значение — большая волна: bałwany morskie «морские валы»." }
collocations:
  - { pl: "ulepić bałwana", ru: "слепить снеговика" }
  - { pl: "bałwany morskie", ru: "морские валы" }
etymology: "Праславянское *bal(ъ)vanъ «идол, чурбан»; русский «болван» — то же слово."
memory: "bałwan — прежде всего СНЕГОВИК, и только потом «болван». Ulepić bałwana значит «слепить снеговика». Винительный как у одушевлённых: bałwana."
idioms:
  - { pl: "ulepić bałwana", ru: "слепить снеговика" }
