# review
id: chwilka
format: 2
lemma: "chwilka"
rank: 1388
pos: noun
pron: { cyr: "хфи́лька" }
senses:
  - id: moment
    ru: "минутка, секундочка"
    examples:
      - pl: "Poczekaj chwilkę."
        ru: "Подожди минутку."
        source: { kind: translated, id: 559494 }
      - pl: "Poczekasz na mnie jeszcze chwilkę?"
        ru: "Подождёшь меня ещё минутку?"
        source: { kind: tatoeba, id: 11741408 }
      - pl: "Zaczekaj chwilkę."
        ru: "Погоди минутку."
        source: { kind: translated, id: 2211876 }
  - id: short-while
    ru: "короткое время, мгновение"
    examples:
      - pl: "Wyluzuj na chwilkę."
        ru: "Расслабься на минутку."
        source: { kind: translated, id: 999223 }
      - pl: "Możemy chwilkę porozmawiać?"
        ru: "Можем минутку поговорить?"
        source: { kind: translated, id: 3708381 }
notes:
  - { kind: usage, text: "Уменьшительное от chwila «мгновение, минута». Значит «минутку, секундочку» и звучит мягче и вежливее, чем chwila." }
  - { kind: usage, text: "В живой речи встречается почти только в винительном падеже: Poczekaj chwilkę «Подожди минутку», Zaczekaj chwilkę. Остальные формы возможны, но редки." }
  - { kind: register, text: "Слово разговорное и дружелюбное. В официальной речи лучше chwila: Proszę chwilę zaczekać." }
  - { kind: false-friend, text: "chwilka — это «минутка», а не «часок». «Час» по-польски godzina." }
collocations:
  - { pl: "poczekaj chwilkę", ru: "подожди минутку" }
  - { pl: "za chwilkę", ru: "через минутку" }
  - { pl: "na chwilkę", ru: "на минутку" }
etymology: "Уменьшительное от chwila «мгновение» с суффиксом -ka — ровно как русская пара «минута — минутка»."
memory: "chwilka — «минутка», уменьшительное от chwila. Живёт почти исключительно в одной форме: Poczekaj chwilkę «Подожди минутку». Звучит мягче, чем chwila, — это вежливая просьба подождать."
idioms:
  - { pl: "poczekaj chwilkę", ru: "подожди минутку" }
  - { pl: "za chwilkę", ru: "через минутку" }
  - { pl: "na chwilkę", ru: "на минутку" }
formExamplesSkip:
  - { form: "chwilko", reason: "звательная форма, в корпусе примеров нет" }
