notes:
  - { kind: pronunciation, text: "Слово показывает мену ą и ę с неожиданной стороны. Исходное существительное ŚWIĘTO «праздник» держит ę во всём единственном числе — święto, świętem, świętu, — но в родительном множественном, где окончания нет и слог закрывается согласным, появляется ą: ŚWIĄT. Это то же правило закрытого слога, что в URZĄD и URZĘDU, только перевёрнутое: там исходная форма была с ą, а здесь с ę. Значит какая из двух огласовок выглядит основной — свойство слова, а не гласной." }
  - { kind: usage, text: "А прилагательное устроено ещё интереснее. ŚWIĄTECZNY построено на той самой огласовке с ą, что в ŚWIĄT, и держит её во всех формах — świąteczna, świątecznego, świąteczni, — хотя слог здесь открытый и по правилу закрытого слога должно было бы стоять ę. Объяснение простое: позиционная мена работает внутри одной словоформы, а при образовании нового слова та огласовка, которую корень дал в момент образования, застывает навсегда. Отсюда же понятно, почему у RÓŻOWY ó стоит везде: слово образовано от основы с ó и унаследовало её." }
  - { kind: usage, text: "Форм одиннадцать, степеней сравнения нет: восьмое такое прилагательное после fizyczny, miejscowy, kredytowy, sądowy, włoski, brytyjski и podstawowy. Основа твёрдая, поэтому мужская личная форма множественного отдельная — ŚWIĄTECZNI. Полезно знать и то, что ŚWIĘTA без уточнений в Польше значит именно Рождество: JADĘ DO DOMU NA ŚWIĘTA — «еду домой на Рождество», а не на какие-нибудь праздники вообще." }
