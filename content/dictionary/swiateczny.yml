etymology: "От ŚWIĘTO «праздник», а то от ŚWIĘTY «святой», из праславянского *svętъ — того же корня, что русское «святой» и «святки». Праздник понят как день святой, выделенный из прочих. Русский для праздника взял другое слово, от «праздного», то есть незанятого делом, так что дорога к понятию у двух языков разная: польский шёл от святости, русский от праздности."
memory: "В święto стоит ę, в świąt — ą, и прилагательное взяло ą навсегда: świąteczny. Мена работает внутри форм одного слова, а при образовании нового застывает."
