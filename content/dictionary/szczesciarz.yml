notes:
  - { kind: usage, text: "Слово разговорное и тёплое, без всякой зависти в основе: так говорят о человеке, которому повезло, и часто с улыбкой. Женская форма — SZCZĘŚCIARKA, и она употребляется наравне с мужской. В ироническом употреблении слово значит обратное, как и русское «счастливчик» в той же позиции: SZCZĘŚCIARZ, DOSTAŁ DYŻUR W SYLWESTRA. Родительный множественного имеет две формы, SZCZĘŚCIARZY и SZCZĘŚCIARZÓW, и первая обычнее — тот же выбор, что в SEKRETARZY и SEKRETARZÓW." }
  - { kind: false-friend, text: "Корень здесь тот же, что в карточке NIESZCZĘŚLIWY, и связь стоит восстановить целиком, потому что она объясняет сразу несколько слов. SZCZĘŚCIE значит и счастье, и удачу, и происходит из *sъ-čęstь «хорошая доля», то есть из приставки «с-» и корня «часть». Поэтому SZCZĘŚCIARZ буквально «тот, кому досталась доля», а CZĘŚĆ «часть» ему прямая родня. Русское «счастливчик» построено от того же «счастья», собранного в русском из тех же двух частей, так что совпадение полное по смыслу и по строению." }
  - { kind: pronunciation, text: "Читается «шченьщя́ш», и слово стоит разобрать по частям, потому что оно одно из самых трудных в словаре. SZCZ даёт «шч», Ę — носовое «энь», ŚCIA — «щя», RZ на конце оглушается и звучит «ш». Ударение на предпоследнем слоге, то есть на -ŚCIA-. Проговорить стоит медленно: SZCZĘ-ŚCIA-RZ. В родительном SZCZĘŚCIARZA конечное RZ уже не оглушается, потому что за ним гласная, и звучит «ж»: «шченьщя́жа»." }
  - { kind: government, text: "Существительное мужского рода одушевлённое, мужско-личного разряда. Винительный единственного равен родительному: WIDZĘ SZCZĘŚCIARZA. Именительный множественного на -E: SZCZĘŚCIARZE. При глаголе NAZWAĆ требуется творительный: NAZWALI GO SZCZĘŚCIARZEM, и это та же модель, что в NAZWAĆ KOGOŚ IDIOTKĄ и CZAROWNICĄ, разобранная на трёх предыдущих карточках. Суффикс -ARZ здесь образует не профессию, как в PISARZ или LEKARZ, а свойство человека, и это редкий для него случай." }
