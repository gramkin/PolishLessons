etymology: "От SZCZĘŚCIE «счастье, удача», из праславянского *sъčęstьje — приставка *sъ- «с, хороший» и корень *čęstь «часть, доля». Буквально «хорошая доля», и русское «счастье» собрано из тех же двух частей тем же способом, так что польское CZĘŚĆ «часть» и SZCZĘŚCIE родственны напрямую, как «часть» и «счастье» в русском. Суффикс -ARZ в польском обычно даёт названия занятий: PISARZ, LEKARZ, KUCHARZ, SEKRETARZ, — но здесь он образовал название человека по свойству, и такие случаи редки. Русский в этом месте взял уменьшительный суффикс и получил «счастливчика», то есть пошёл другим путём при том же корне."
memory: "Корень тот же, что в nieszczęśliwy: *sъ-čęstь «хорошая доля», и часть ему родня — część. Суффикс -arz обычно даёт профессии (pisarz, lekarz), а здесь свойство человека, и это редкость. Женская форма szczęściarka. Родительный множественного двойной: szczęściarzy обычнее, чем szczęściarzów. При nazwać нужен творительный."
