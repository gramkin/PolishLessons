notes:
  - { kind: false-friend, text: "КОРЕНЬ ТОТ ЖЕ, ЧТО В РУССКОМ «ПЛЫТЬ», И ЭТО ВИДНО В ПРИЛАГАТЕЛЬНОМ. PŁYNNY значит и «жидкий», и «плавный, беглый»: mówi płynnie po polsku — «говорит по-польски бегло». Русское «плавный» от того же корня, что «плавать», так что оба языка связали текучесть воды с текучестью речи, только разными словами." }
  - { kind: usage, text: "Бытовые средства называются через płyn do czegoś: płyn do naczyń «для посуды», płyn do szyb «для стёкол», płyn do płukania «для полоскания». Русский в этих случаях говорит «средство», а не «жидкость». Предложный — w PŁYNIE, с мягким ni, и он же значит «в жидком виде»: mydło w płynie «жидкое мыло»." }
  - { kind: pronunciation, text: "Один слог: пуын. Ł читается как краткое у, y как русское ы, так что выходит «пуын», без гласной между п и у. Предложный płynie звучит «пуы́не»." }
collocations:
  - { pl: "płyn do naczyń", ru: "средство для мытья посуды" }
  - { pl: "mydło w płynie", ru: "жидкое мыло" }
  - { pl: "płyn hamulcowy", ru: "тормозная жидкость" }
family:
  - { pl: "płynąć", ru: "плыть, течь", relation: root, id: plynac }
  - { pl: "płynny", ru: "жидкий; плавный", relation: derived }
  - { pl: "ciało stałe", ru: "твёрдое тело", relation: antonym, id: staly }
etymology: "От płynąć «плыть, течь», из праславянского *plynąti, того же корня, что русское «плыть» и «плавать». Дальше он родствен греческому plein «плыть» и латинскому pluere «идти о дожде». Отсюда płynny «жидкий, плавный» и zapłynąć «заплыть»."
memory: "płyn — «жидкость», от płynąć «плыть». Бытовые средства по-польски тоже płyn: płyn do naczyń. А прилагательное płynny значит и «жидкий», и «беглый» — как русское «плавный» от «плавать»."
idioms:
  - { pl: "mydło w płynie", ru: "жидкое мыло" }
  - { pl: "płyn do naczyń", ru: "средство для посуды" }
