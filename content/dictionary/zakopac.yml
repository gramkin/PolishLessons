# review
id: zakopac
format: 2
lemma: "zakopać"
rank: 4740
pos: verb
pron: { cyr: "зако́паць" }
senses:
  - id: bury
    ru: "закопать, зарыть"
    examples:
      - pl: "Pies zakopał kość w ogrodzie."
        ru: "Пёс закопал кость в саду."
        source: { kind: authored }
      - pl: "Piraci zakopali skarb na wyspie."
        ru: "Пираты зарыли клад на острове."
        source: { kind: authored }
      - pl: "Zakop to głęboko."
        ru: "Закопай это поглубже."
        source: { kind: authored }
  - id: get-stuck
    ru: "увязнуть; зарыться (zakopać się — в снег, в работу)"
    examples:
      - pl: "Samochód zakopał się w śniegu."
        ru: "Машина увязла в снегу."
        source: { kind: authored }
      - pl: "Zakopał się w książkach na cały weekend."
        ru: "Он зарылся в книги на все выходные."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ZAKOPAĆ — «закопать», точное соответствие. Но человека хоронят не ZAKOPAĆ, а POCHOWAĆ: POCHOWAĆ DZIADKA. ZAKOPAĆ SIĘ — «увязнуть» о машине и «зарыться» в работу. Курортный город ZAKOPANE — «закопанное», поселение в лесной глуши." }
  - { kind: usage, text: "Пятьдесят три формы — подпись переходного глагола совершенного вида: страдательное ZAKOPANY и деепричастие ZAKOPAWSZY. Спряжение: ZAKOPIĘ, ZAKOPIESZ, ZAKOPIĄ; повелительное ZAKOP. Видовой партнёр — ZAKOPYWAĆ." }
  - { kind: government, text: "Что — винительный, где — W с местным: ZAKOPAĆ SKARB W OGRODZIE. Куда — W с винительным: ZAKOPAĆ W ZIEMIĘ, W PIASEK. Зарыться во что — ZAKOPAĆ SIĘ W с местным: W PAPIERACH, W ŚNIEGU." }
  - { kind: pronunciation, text: "Читается «зако́паць», три слога, ударение на предпоследнем. Конечное Ć — «ць». ZAKOPIĘ — «зако́пе»: конечное Ę звучит как «э», PI — мягкое." }
  - { kind: register, text: "Нейтральное бытовое слово. Устойчивые: ZAKOPAĆ TOPÓR WOJENNY, «зарыть топор войны». ZAKOPAĆ SIĘ W PRACY — «зарыться в работу», разговорное." }
collocations:
  - { pl: "zakopać skarb", ru: "зарыть клад" }
  - { pl: "zakopać topór wojenny", ru: "зарыть топор войны" }
  - { pl: "zakopać się w śniegu", ru: "увязнуть в снегу" }
family:
  - { pl: "zakopywać", ru: "закапывать", relation: aspect }
  - { pl: "kopać", ru: "копать; пинать", relation: root, id: kopac }
  - { pl: "pochować", ru: "похоронить", relation: root }
etymology: "Приставка ZA- плюс KOPAĆ «копать», праславянское *kopati, то же, что русское «копать», «закопать». От той же основы — название города ZAKOPANE."
memory: "Zakopać — закопать, зарыть: zakopać skarb, kość. Человека — pochować! Auto zakopało się w śniegu — увязло. Zakopać topór wojenny — зарыть топор войны. Читается «зако́паць»."
idioms:
  - { pl: "zakopać topór wojenny", ru: "зарыть топор войны" }
