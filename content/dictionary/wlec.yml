# review
id: wlec
format: 2
lemma: "wlec"
rank: 6084
pos: verb
aspect: imperf
pron: { cyr: "вле́ц" }
senses:
  - id: drag
    ru: "тащить, волочить (тяжёлое, по земле)"
    examples:
      - pl: "Wlókł za sobą ciężką walizkę."
        ru: "Он тащил за собой тяжёлый чемодан."
        source: { kind: authored }
      - pl: "Pies wlecze kość po całym ogrodzie."
        ru: "Собака таскает кость по всему саду."
        source: { kind: authored }
  - id: trudge
    ru: "wlec się — плестись, тащиться (медленно, с трудом)"
    examples:
      - pl: "Wleczesz się jak żółw."
        ru: "Ты плетёшься, как черепаха."
        source: { kind: tatoeba, id: 8627625 }
      - pl: "Wlekliśmy się noga za nogą do domu."
        ru: "Мы плелись домой нога за ногу."
        source: { kind: authored }
  - id: drag-on
    ru: "wlec się — тянуться, затягиваться (о времени, делах)"
    examples:
      - pl: "Czas wlókł się niemiłosiernie."
        ru: "Время тянулось нестерпимо долго."
        source: { kind: authored }
      - pl: "Sprawa wlecze się w sądzie od lat."
        ru: "Дело тянется в суде годами."
        source: { kind: authored }
  - id: carry-along
    ru: "перен. wlec za sobą — тянуть за собой (прошлое, последствия)"
    examples:
      - pl: "Wlecze za sobą złą opinię."
        ru: "За ним тянется дурная слава."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Чаще всего — с SIĘ: WLEC SIĘ «плестись», CZAS SIĘ WLECZE «время тянется». Без SIĘ — «тащить, волочить» что-то тяжёлое: WLEC WOREK. Совершенный вид по смыслу: ZAWLEC «затащить», DOWLEC SIĘ «дотащиться», PRZYWLEC «приволочь»." }
  - { kind: usage, text: "Спряжение с чередованием: WLOKĘ, WLECZESZ, WLECZE, WLOKĄ; прошедшее WLÓKŁ, WLOKŁA, но WLEKLI. Рядом живут варианты с E: WLEKĘ, WLEKĄ, WLEKŁ, WLEKŁA — оба ряда правильны, ряд с O чуть книжнее." }
  - { kind: false-friend, text: "Не путать с русским «влечь» — «привлекать, тянуть к себе»: WLEC — тащить тяжесть или плестись. «Влечение» — POCIĄG, «меня влечёт» — CIĄGNIE MNIE. Зато русское «волочь», «волочить» — точное соответствие." }
  - { kind: pronunciation, text: "WLEC — «влец», один слог. WLÓKŁ — «влук»: Ó — «у», а конечное Ł после К почти не слышно. WLECZE — «вле́чэ»." }
  - { kind: government, text: "Кого/что — винительный: WLEC WÓZEK. По чему — PO с предложным: WLEC PO ZIEMI. За собой — ZA SOBĄ. Куда плестись — DO с родительным: WLEC SIĘ DO DOMU." }
collocations:
  - { pl: "wlec się noga za nogą", ru: "плестись нога за ногу" }
  - { pl: "czas się wlecze", ru: "время тянется" }
  - { pl: "wlec coś po ziemi", ru: "волочить что-то по земле" }
  - { pl: "wlec za sobą", ru: "тащить за собой" }
  - { pl: "sprawa się wlecze", ru: "дело затягивается" }
family:
  - { pl: "ciągnąć", ru: "тянуть, тащить", relation: root, id: ciagnac }
  - { pl: "zwlekać", ru: "медлить, тянуть (с чем-л.)", relation: derived }
  - { pl: "odwlekać", ru: "откладывать, оттягивать", relation: derived }
  - { pl: "przewlekły", ru: "затяжной, хронический", relation: derived }
  - { pl: "włóczyć", ru: "волочить (włóczyć się — бродяжничать)", relation: derived }
  - { pl: "zawlec", ru: "затащить", relation: aspect }
synonyms: ["ciągnąć", "taszczyć", "włóczyć"]
etymology: "Праславянское *velkti, *velkǫ «тянуть, волочь». В польском — перестановка: WLEC; в русском народный вариант «волочь, волоку» с полногласием и церковнославянский «влечь, влеку». Отсюда же WŁÓCZYĆ «волочить», ZWLEKAĆ «медлить», PRZEWLEKŁY «затяжной», русское «волокита»."
memory: "WLEC = «волочь» без лишнего О. Wlokę walizkę — волоку чемодан. Wlekę się — плетусь. Czas się wlecze — время тянется, как волокита."
idioms:
  - { pl: "wlec się jak żółw", ru: "плестись как черепаха" }
  - { pl: "wlec się noga za nogą", ru: "еле плестись, нога за ногу" }
  - { pl: "choć się kara wlecze, zbrodnia przed nią nie uciecze", ru: "наказание может запоздать, но от него не уйдёшь" }
