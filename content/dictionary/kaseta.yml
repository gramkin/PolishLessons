notes:
  - { kind: false-friend, text: "Пишется с одним S! Русское «кассета» удваивает согласную, польское KASETA — нет, и это не случайность одного слова, а правило для заимствований: польский последовательно упрощает двойные согласные, которые русский сохраняет. Сравните METAL и «металл», APARAT и «аппарат», ADRES и «адрес», KLASA и «класс». Ошибка в написании выдаёт русскоязычного сразу, поэтому стоит проговорить: KASETA, одна S, и в произношении тоже один короткий звук, «касэ́та», без удлинения." }
  - { kind: pronunciation, text: "Читается «касэ́та», ударение на предпоследнем слоге, как и в русском. Буква E звучит «э» и не смягчает предыдущую согласную: «сэ», а не «се». В местном и дательном падеже KASECIE согласная T перед -IE переходит в C и смягчается: «касэ́це». Это то же чередование, что в MONETA и MONECIE, PASZPORT и PASZPORCIE, TORT и TORCIE — четвёртый случай подряд, так что правило можно считать выученным." }
  - { kind: usage, text: "Основное значение — магнитофонная или видеокассета: KASETA MAGNETOFONOWA, KASETA WIDEO. Со временем добавилось техническое: KASETA Z TUSZEM «картридж с чернилами», KASETA NA PIENIĄDZE «денежный ящик, кассета». Второе значение ближе к исходному смыслу слова — коробка, ящичек. В разговоре о музыке слово стало историческим: сегодня скажут PŁYTA или PLIK, а KASETA вспоминается как примета восьмидесятых и девяностых." }
  - { kind: government, text: "Женский род на -A, склонение правильное. Винительный на -Ę: NAGRAŁ NA KASETĘ. Обратите внимание на предлог: запись идёт NA KASETĘ, с винительным, то есть «на кассету», и здесь польский и русский совпадают. А вот содержимое вводится предлогом Z с творительным: KASETA Z TUSZEM «кассета с чернилами». Назначение — NA с винительным: KASETA NA PIENIĄDZE «кассета для денег», где русский предпочтёт «для» с родительным." }
