etymology: "Из французского CASSETTE, уменьшительного от CASSE «ящик, коробка», а то — из латинского CAPSA «ящик, футляр». Тот же латинский CAPSA стоит за польским KASA и русской «кассой»: касса — это ящик, куда складывают деньги, и KASETA, то есть «ящичек», ей прямая родня. Отсюда же KAPSUŁA и «капсула». Магнитофонное значение пришло в середине двадцатого века, когда плёнку спрятали в пластмассовую коробочку, и название дали по коробочке, а не по плёнке. Русское слово пришло тем же путём, но удвоило S по французскому написанию, а польский остался при одной согласной — как и во всех прочих заимствованиях такого рода."
memory: "Одна s! Польский упрощает двойные согласные: kaseta против «кассеты», metal против «металла», klasa против «класса». В местном t переходит в c: na kasecie, как na monecie. Родня слову kasa: оба из латинского capsa «ящик», и кассета — это буквально «ящичек»."
