# review
id: funkcjonowac
format: 2
lemma: "funkcjonować"
rank: 5253
pos: verb
pron: { cyr: "функцьёно́ваць" }
senses:
  - id: work
    ru: "работать, действовать (о системе, механизме)"
    examples:
      - pl: "System funkcjonuje bez zarzutu."
        ru: "Система работает безупречно."
        source: { kind: authored }
      - pl: "Winda znowu nie funkcjonuje."
        ru: "Лифт опять не работает."
        source: { kind: authored }
      - pl: "Jak funkcjonuje ta maszyna?"
        ru: "Как работает эта машина?"
        source: { kind: authored }
  - id: cope
    ru: "существовать, жить; держаться (о человеке)"
    examples:
      - pl: "Bez kawy rano nie funkcjonuję."
        ru: "Без утреннего кофе я не человек."
        source: { kind: authored }
      - pl: "Ta firma funkcjonuje od stu lat."
        ru: "Эта фирма существует сто лет."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "FUNKCJONOWAĆ — «функционировать», но польское слово гораздо обычнее русского: SKLEP FUNKCJONUJE DO DWUDZIESTEJ «магазин работает до восьми». Где русский скажет «работать» или «действовать», поляк часто говорит FUNKCJONOWAĆ или DZIAŁAĆ." }
  - { kind: usage, text: "Несовершенный вид, пары нет. Чаще всего в третьем лице о системах и учреждениях. О человеке — разговорное «быть в форме»: NIE FUNKCJONUJĘ BEZ SNU. Повелительное и безличное FUNKCJONOWANO в карточку не включены. FUNKCJONOWANIE — «работа, функционирование»." }
  - { kind: government, text: "Как — наречие: FUNKCJONOWAĆ SPRAWNIE, NORMALNIE. Где, в чём — W с предложным: FUNKCJONOWAĆ W SPOŁECZEŃSTWIE. Как кто, в роли — JAKO: FUNKCJONUJE JAKO MUZEUM «работает как музей»." }
  - { kind: pronunciation, text: "Читается «функцьёно́ваць»: NKCJ — «нкцьй», без вставных гласных; ударение на предпоследнем слоге. FUNKCJONUJE — «функцьёну́е»." }
  - { kind: register, text: "Нейтрально-официальное слово: техника, экономика, медицина. В разговоре чаще DZIAŁAĆ: TELEFON NIE DZIAŁA." }
collocations:
  - { pl: "sprawnie funkcjonować", ru: "исправно работать" }
  - { pl: "funkcjonować w społeczeństwie", ru: "жить в обществе" }
  - { pl: "funkcjonować jako", ru: "работать в качестве" }
family:
  - { pl: "funkcja", ru: "функция", relation: derived, id: funkcja }
  - { pl: "działać", ru: "действовать, работать", relation: root, id: dzialac }
  - { pl: "funkcjonariusz", ru: "сотрудник (полиции, службы)", relation: derived }
etymology: "От FUNKCJA «функция», из латинского FUNCTIO «исполнение», от FUNGI «исполнять». Русское «функционировать» — то же слово через французское."
memory: "Funkcjonować — работать, действовать: winda nie funkcjonuje. О себе: bez kawy nie funkcjonuję."
idioms:
  - { pl: "nie funkcjonować bez kawy", ru: "быть не человеком без кофе" }
