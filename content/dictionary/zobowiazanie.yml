# review
id: zobowiazanie
format: 2
lemma: "zobowiązanie"
rank: 4151
pos: noun
pron: { cyr: "зобовёнза́не" }
senses:
  - id: obligation
    ru: "обязательство"
    examples:
      - pl: "Firma nie wywiązała się ze zobowiązań."
        ru: "Фирма не выполнила своих обязательств."
        source: { kind: authored }
      - pl: "Kredyt to poważne zobowiązanie."
        ru: "Кредит — серьёзное обязательство."
        source: { kind: authored }
      - pl: "Podpisał zobowiązanie do zachowania tajemnicy."
        ru: "Он подписал обязательство о неразглашении."
        source: { kind: authored }
      - pl: "Mam wiele zobowiązań wobec rodziny."
        ru: "У меня много обязательств перед семьёй."
        source: { kind: authored }
      - pl: "Spłacił wszystkie zobowiązania."
        ru: "Он погасил все долги."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ZOBOWIĄZANIE — «обязательство», от WIĄZAĆ «вязать»: связать себя словом. В финансах ZOBOWIĄZANIA — «долги, задолженность». А JESTEM ZOBOWIĄZANY — «я обязан» и вежливое «я вам признателен»." }
  - { kind: usage, text: "Восемь форм, средний род на -ANIE. Родительный множественного — ZOBOWIĄZAŃ. Часто во множественном: SPŁACIĆ ZOBOWIĄZANIA." }
  - { kind: government, text: "Обязательство перед кем — ZOBOWIĄZANIE WOBEC, и родительный. Выполнить обязательство — WYWIĄZAĆ SIĘ ZE ZOBOWIĄZANIA, родительный. Обязательство сделать что-то — ZOBOWIĄZANIE DO, и родительный." }
  - { kind: pronunciation, text: "Читается «зобовёнза́не», ударение на предпоследнем слоге. WIĄ — «вён», ZA — «за»." }
collocations:
  - { pl: "wywiązać się ze zobowiązań", ru: "выполнить обязательства" }
  - { pl: "zobowiązania finansowe", ru: "финансовые обязательства" }
  - { pl: "podjąć zobowiązanie", ru: "взять на себя обязательство" }
family:
  - { pl: "zobowiązać", ru: "обязать", relation: root }
  - { pl: "obowiązek", ru: "обязанность", relation: root, id: obowiazek }
  - { pl: "wiązać", ru: "вязать, связывать", relation: root, id: wiazac }
etymology: "От ZOBOWIĄZAĆ «обязать», а то — от WIĄZAĆ «вязать». Польское Ą на месте русского «я»: WIĄZAĆ — «вязать». Обязательство — то, что «связывает»."
memory: "Zobowiązanie — обязательство: от wiązać «вязать». Читается «зобовёнза́не». Wywiązać się ze zobowiązań — выполнить обязательства."
idioms:
  - { pl: "dać słowo", ru: "дать слово" }
