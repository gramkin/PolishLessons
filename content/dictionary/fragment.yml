pos: noun
pron: { cyr: "фра́гмэнт" }
senses:
  - id: excerpt
    ru: "фрагмент, отрывок"
    examples:
      - pl: "Fragment listu zachował się przypadkiem."
        ru: "Фрагмент письма сохранился случайно."
        source: { kind: authored }
      - pl: "Przeczytał fragment na głos."
        ru: "Он прочитал отрывок вслух."
        source: { kind: authored }
      - pl: "W tym fragmencie brakuje dwóch zdań."
        ru: "В этом фрагменте не хватает двух фраз."
        source: { kind: authored }
  - id: piece
    ru: "обломок, часть"
    examples:
      - pl: "Fragment muru stoi do dziś."
        ru: "Обломок стены стоит до сих пор."
        source: { kind: authored }
      - pl: "Fragmenty naczynia złożono w muzeum."
        ru: "Фрагменты сосуда собрали в музее."
        source: { kind: authored }
notes:
  - { kind: pronunciation, text: "Предложный падеж — W FRAGMENCIE, с переходом t в ci. Это четвёртое слово в словаре с этой меной, после element — elemencie, kąt — kącie и rakieta — rakiecie, и правило можно считать твёрдым: твёрдое t перед окончанием -e не стоит никогда. Русское «во фрагменте» сохраняет т, и подсказки не даёт." }
  - { kind: usage, text: "Родительный — FRAGMENTU, с окончанием -u, как у большинства неодушевлённых мужских с отвлечённым значением: elementu, kryzysu, teatru. Значения совпадают с русскими почти полностью: отрывок текста, обломок предмета, часть целого. Ходовой оборот — FRAGMENTAMI, то есть «отрывками, по частям»." }
collocations:
  - { pl: "fragment tekstu", ru: "фрагмент текста" }
  - { pl: "fragment muru", ru: "обломок стены" }
  - { pl: "we fragmentach", ru: "во фрагментах" }
family:
  - { pl: "fragmentaryczny", ru: "фрагментарный", relation: derived }
  - { pl: "fragmentarycznie", ru: "фрагментарно", relation: derived }
  - { pl: "całość", ru: "целое", relation: antonym, id: calosc }
etymology: "Из латинского fragmentum «обломок», от frangere «ломать» — того же корня, что «фракция» и «фрактура». Оба языка взяли слово из учёной латыни и сохранили оба смысла: кусок текста и кусок вещи. Ничего своего ни польский, ни русский к нему не добавили, поэтому расхождений тут нет."
memory: "Предложный с мягким ci: we fragmencie, как w elemencie. И родительный на -u: fragmentu."
idioms:
  - { pl: "we fragmentach", ru: "во фрагментах" }
  - { pl: "fragment po fragmencie", ru: "фрагмент за фрагментом" }
formExamplesSkip:
