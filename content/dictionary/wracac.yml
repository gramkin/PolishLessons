# review
id: wracac
format: 2
lemma: "wracać"
rank: 217
pos: verb
aspect: imperf
pron: { cyr: "вра́цаць" }
senses:
  - id: return
    ru: "возвращаться (домой, назад)"
    examples:
      - pl: "Właśnie wracam z pracy."
        ru: "Я как раз возвращаюсь с работы."
        source: { kind: tatoeba, id: 6154935 }
      - pl: "Czas wracać do domu."
        ru: "Пора возвращаться домой."
        source: { kind: tatoeba, id: 3745023 }
      - pl: "Nie wracam."
        ru: "Я не вернусь."
        source: { kind: tatoeba, id: 349175 }
  - id: go-back
    ru: "возвращаться к чему-либо; иди обратно"
    examples:
      - pl: "Wracajcie do pracy!"
        ru: "Возвращайтесь к работе!"
        source: { kind: tatoeba, id: 10747426 }
      - pl: "Wracaj tam, skąd przyszłaś."
        ru: "Возвращайся туда, откуда пришла."
        source: { kind: tatoeba, id: 12949438 }
      - pl: "I już tu więcej nie wracaj!"
        ru: "И больше сюда не возвращайся!"
        source: { kind: tatoeba, id: 6328180 }
notes:
  - { kind: usage, text: "Несовершенный вид к wrócić: Wracam co wieczór «Возвращаюсь каждый вечер» — Wróciłem późno «Я вернулся поздно»." }
  - { kind: usage, text: "Направление: wracać do domu «возвращаться домой» (do + родительный), wracać z pracy «возвращаться с работы» (z + родительный)." }
  - { kind: usage, text: "Существительное — powrót «возвращение», а не «wracanie»: droga powrotna «обратный путь»." }
collocations:
  - { pl: "wracać do domu", ru: "возвращаться домой" }
  - { pl: "wracać do zdrowia", ru: "выздоравливать" }
  - { pl: "wracać do tematu", ru: "возвращаться к теме" }
  - { pl: "wracaj!", ru: "возвращайся!" }
etymology: "Приставка w- + racać, многократная форма к wrócić; существительное к обоим — powrót «возвращение»."
memory: "wracać — несовершенный вид, wrócić — совершенный: Wracam co dzień, но Wróciłem wczoraj. Существительное не «wracanie», а powrót."
idioms:
  - { pl: "wracać do zdrowia", ru: "выздоравливать" }
  - { pl: "wracać do tematu", ru: "возвращаться к теме" }
  - { pl: "wracaj cały i zdrowy", ru: "возвращайся целым и невредимым" }
