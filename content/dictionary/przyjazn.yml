etymology: "От PRZYJACIEL, а то от старого глагола PRZYJAĆ «благоволить, быть расположенным», с приставкой PRZY-. Корень тот же, что в русском «приять», сохранившемся в «приятный» и «приятель»: приятель — тот, к кому расположены. Польский развил на этом корне более сильное слово: PRZYJACIEL это близкий друг, а не просто приятель, и PRZYJAŹŃ — полноценная дружба. Русский, напротив, оставил «приятеля» в слабом значении и для сильного взял «друга», от «другой», то есть второй, спутник. Два языка поделили поле иначе, и потому пара PRZYJACIEL и «приятель» обманчива. Суффикс -ŹŃ образует отвлечённые существительные от прилагательных и глаголов, как в BOJAŹŃ «боязнь» и BLIŹNI «ближний», и русскому отвечает -ЗНЬ: PRZYJAŹŃ и «боязнь» построены одинаково."
memory: "Корень как в русском «приятный, приятель», но сила другая: przyjaciel это «друг», а не «приятель» — приятель будет kolega, знакомый znajomy. Значит przyjaźń — полноценная «дружба». Семь форм, а не шесть: у этого -ŚĆ-слова есть отдельный именительный множественного przyjaźnie, как garście у garść. Суффикс -źń отвечает русскому -знь (bojaźń «боязнь»). И не говорят mamy przyjaźń — говорят jesteśmy przyjaciółmi."
