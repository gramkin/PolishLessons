notes:
  - { kind: false-friend, text: "Корень тот же, что в русском «приятель»: PRZYJACIEL значит «друг», а не «приятель», и это различие важное. По-русски «приятель» слабее «друга», а польское PRZYJACIEL — именно близкий друг; знакомый будет ZNAJOMY, а приятель в русском смысле — KOLEGA. Соответственно PRZYJAŹŃ это «дружба» в полном смысле. Слово образовано от PRZYJAĆ, старого глагола «благоволить», родственного русскому «приять» в «приятный»: друг — тот, кто благоволит. Прилагательное PRZYJAZNY значит «дружелюбный, приветливый», а PRZYJACIELSKI — «дружеский»." }
  - { kind: usage, text: "Семь форм, и это особый случай среди существительных на -ŚĆ. Обычно такие слова дают шесть форм, потому что одна совпадает сразу с пятью позициями, но у PRZYJAŹŃ отдельно стоит именительный множественного PRZYJAŹNIE, и потому форм семь — как у GARŚĆ с её GARŚCIE. Множественное число употребляется редко и означает «дружеские связи»: ZAWIERAĆ PRZYJAŹNIE «заводить дружбу». Родительный единственного PRZYJAŹNI совпадает с дательным и местным, и это та самая форма, которая покрывает несколько позиций сразу. Женский род, поэтому все согласования женские: DŁUGA PRZYJAŹŃ, SZCZERA PRZYJAŹŃ." }
  - { kind: pronunciation, text: "Читается «пшыя́зьнь», три слога, ударение на предпоследнем. Начальное PRZY звучит «пшы»: RZ после глухого P оглушается в «ш», а Y это «ы». Буква Ź даёт мягкое «зь», Ń — мягкое «нь», и на конце слова они идут подряд: «зьнь». Это сочетание русскоязычным даётся с трудом, и разделять его вставным гласным нельзя. В форме PRZYJAŹNI мягкость сохраняется: «пшыя́зьни». В форме PRZYJAŹNIĄ последнее Ą даёт «он»: «пшыя́зьнён»." }
  - { kind: register, text: "Слово нейтральное и уместно в любом контексте, от разговора до официального текста: TRAKTAT O PRZYJAŹNI «договор о дружбе». Но обороты с ним требуют осторожности. Сказать о приятельских отношениях MAMY PRZYJAŹŃ нельзя — это звучит тяжело и книжно; говорят JESTEŚMY PRZYJACIÓŁMI «мы друзья». Для лёгкого знакомства PRZYJAŹŃ слишком сильно, там нужно ZNAJOMOŚĆ. И отдельно: PRZYJAŹŃ не употребляют о романтических отношениях, в отличие от русского, где «дружба» иногда так обыгрывается." }
