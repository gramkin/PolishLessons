# review
id: krolewski
format: 2
lemma: "królewski"
rank: 1777
pos: adj
pron: { cyr: "круле́фски" }
senses:
  - id: royal
    ru: "королевский"
    examples:
      - pl: "Pałac królewski zbudowano na wzgórzu."
        ru: "Королевский дворец был построен на холме."
        source: { kind: tatoeba, id: 366592 }
      - pl: "Zszargałeś królewski majestat."
        ru: "Ты опозорил королевское величие."
        source: { kind: translated, id: 2236587 }
      - pl: "Jego Królewska Mość czeka."
        ru: "Его Королевское Величество ждёт."
        source: { kind: translated, id: 10571190 }
  - id: royal-fig
    ru: "королевский (роскошный, шахматный)"
    examples:
      - pl: "Miał iście królewskie rysy twarzy."
        ru: "У него были поистине королевские черты лица."
        source: { kind: tatoeba, id: 12476653 }
      - pl: "Według Tarrascha najlepszą figurą atakującą jest goniec królewski."
        ru: "По Тарражу лучшая атакующая фигура — королевский слон."
        source: { kind: translated, id: 12134677 }
      - pl: "Woda królewska jest zdolna do rozpuszczenia złota."
        ru: "Царская водка способна растворить золото."
        source: { kind: translated, id: 4004083 }
notes:
  - { kind: usage, text: "Jego Królewska Mość — «Его Королевское Величество», стандартный титул." }
  - { kind: usage, text: "В шахматах królewski значит «со стороны короля»: goniec królewski «королевский слон»." }
  - { kind: false-friend, text: "woda królewska — это не «королевская вода», а «царская водка», смесь кислот, растворяющая золото. Русский называет её царской, поляк королевской." }
  - { kind: usage, text: "Существительные — król «король» и królowa «королева»; страна королей — Królestwo «королевство»." }
collocations:
  - { pl: "pałac królewski", ru: "королевский дворец" }
  - { pl: "Jego Królewska Mość", ru: "Его Королевское Величество" }
  - { pl: "woda królewska", ru: "царская водка" }
family:
  - { pl: "król", ru: "король", relation: root, id: krol }
  - { pl: "królowa", ru: "королева", relation: root, id: krolowa }
  - { pl: "królestwo", ru: "королевство", relation: root }
etymology: "От król «король», которое восходит к имени Карла Великого — как и русское «король». Слова однокоренные."
memory: "królewski — «королевский»: pałac królewski, Jego Królewska Mość. А woda królewska — это «царская водка»: поляк зовёт её королевской, русский царской."
