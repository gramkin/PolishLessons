etymology: "Словари возводят слово к немецкому TAND «безделушки, побрякушки, мишура»; в польском оно стало означать дешёвый товар и дешёвый вкус."
memory: "Tandeta — дешёвка, барахло и безвкусица разом. Chińska tandeta — китайский ширпотреб. Прилагательное tandetny: tandetny prezent «копеечный подарок»."
