        source: { kind: authored }
      - pl: "Nie kupuj tandety, szybko się zepsuje."
        ru: "Не покупай барахло, оно быстро сломается."
        source: { kind: authored }
  - id: kitsch
    ru: "безвкусица, пошлость (об искусстве, оформлении)"
    examples:
      - pl: "Ten film to tandeta dla mas."
        ru: "Этот фильм — безвкусица для массового зрителя."
        source: { kind: authored }
      - pl: "Wnętrze hotelu ociekało tandetą."
        ru: "Интерьер отеля так и сочился безвкусицей."
        source: { kind: authored }
      - pl: "W tej piosence nie ma ani grama tandety."
        ru: "В этой песне нет ни грамма пошлости."
        source: { kind: authored }
notes:
  - { kind: usage, text: "TANDETA — женский род, слово собирательное: «дешёвка, барахло» как масса вещей, поэтому множественного числа у него нет. В дательном и предложном T смягчается в C: W TANDECIE «в барахле». Прилагательное — TANDETNY «дешёвый, безвкусный»: TANDETNY PREZENT «копеечный подарок», TANDETNA PIOSENKA «пошлая песенка»; наречие — TANDETNIE." }
  - { kind: register, text: "Слово оценочное и пренебрежительное, но не грубое: его можно встретить и в газетной рецензии. Ряд синонимов: BUBEL «бракованная вещь», CHŁAM и SZMELC «хлам», KICZ «китч» — о безвкусице в искусстве. TANDETA объединяет оба смысла: и плохо сделанная вещь, и дешёвый вкус." }
  - { kind: pronunciation, text: "Читается «танде́та»: AN здесь обычное «ан», а не носовой гласный, потому что буква A, а не Ą. Ударение на предпоследнем слоге. В TANDECIE сочетание CIE звучит «це»: «танде́це»." }
collocations:
