notes:
  - { kind: false-friend, text: "ОСТОРОЖНО с однокоренным существительным. Польское powrót значит «ВОЗВРАЩЕНИЕ», а русское «поворот» — совсем другое, по-польски zakręt или skręt. Корень у них общий, праславянское *vortiti («воротить»), но смыслы разошлись: польский пошёл от «повернуть назад» к «вернуться», русский остался при самом повороте. Так что bilet powrotny — «обратный билет», а не «поворотный»." }
  - { kind: government, text: "Вернуться КУДА и К ЧЕМУ — предлог DO с РОДИТЕЛЬНЫМ: powrócić do domu, do kraju, do tematu, do zdrowia. Русский здесь берёт дательный с «к» («вернуться к теме»), поэтому падеж приходится менять. Корень при этом узнаваем: «воротить», «вернуть»." }
  - { kind: register, text: "Powrócić — книжный и торжественный вариант; в обиходной речи говорят wrócić. Разница как между русскими «возвратиться» и «вернуться»: смысл тот же, но powrócić уместнее в письме, в докладе или о чём-то значительном (powrócić do kraju, powrócić do zdrowia), чем о походе в магазин." }
  - { kind: pronunciation, text: "Обратите внимание на объём парадигмы: у этого глагола 42 формы, а не 53, как у большинства совершенных. Причина грамматическая — глагол НЕПЕРЕХОДНЫЙ, дополнения в винительном у него нет, а значит некого делать подлежащим страдательного оборота. Поэтому страдательного причастия (вроде *wylądowany, *powrócony) не существует вовсе — это не пропуск в словаре, а свойство самого глагола. Так же ведут себя dreptać и другие непереходные." }
collocations:
  - { pl: "powrócić do zdrowia", ru: "поправиться, выздороветь" }
  - { pl: "powrócić do tematu", ru: "вернуться к теме" }
  - { pl: "bilet powrotny", ru: "обратный билет" }
family:
  - { pl: "wrócić", ru: "вернуться", relation: aspect, id: wrocic }
  - { pl: "powrót", ru: "возвращение", relation: derived, id: powrot }
  - { pl: "wracać", ru: "возвращаться", relation: aspect, id: wracac }
etymology: "Приставка po- плюс wrócić, от праславянского *vortiti «воротить, поворачивать» — того же корня, что русские «воротить», «вернуть», «поворот». Смысл разошёлся: польский развил «повернуть назад» в «вернуться», и отсюда powrót «возвращение», тогда как русский «поворот» остался при изменении направления. Из того же гнезда wracać и polski zwrot «оборот»."
memory: "powrócić — «вернуться», от того же корня, что «воротить» и «вернуть». Но powrót значит «возвращение», а НЕ «поворот» (это zakręt). И возвращаются DO czegoś в родительном, а не «к чему-то» в дательном."
idioms:
