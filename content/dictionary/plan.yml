# review
id: plan
format: 2
lemma: "plan"
rank: 320
pos: noun
pron: { cyr: "плян" }
senses:
  - id: plan
    ru: "план, замысел"
    examples:
      - pl: "Mam plan."
        ru: "У меня есть план."
        source: { kind: tatoeba, id: 3031578 }
      - pl: "To dobry plan."
        ru: "Это хороший план."
        source: { kind: tatoeba, id: 553142 }
      - pl: "Taki miałem plan."
        ru: "Это был мой план."
        source: { kind: tatoeba, id: 3460836 }
  - id: plans
    ru: "планы (намерения); план, схема"
    examples:
      - pl: "Mam inne plany."
        ru: "У меня другие планы."
        source: { kind: tatoeba, id: 6406151 }
      - pl: "Nie mam żadnych planów."
        ru: "У меня нет никаких планов."
        source: { kind: tatoeba, id: 6406154 }
      - pl: "Nie wiem, jaki ma plan."
        ru: "Я не знаю, какой у него план."
        source: { kind: tatoeba, id: 6406158 }
notes:
  - { kind: usage, text: "mieć plan — «иметь план», zmienić plany — «изменить планы», według planu — «по плану»." }
  - { kind: usage, text: "plan значит и «чертёж, схема»: plan miasta «карта города», plan zajęć «расписание занятий»." }
  - { kind: usage, text: "na pierwszym planie — «на переднем плане», na dalszym planie — «на заднем плане»." }
collocations:
  - { pl: "mieć plan", ru: "иметь план" }
  - { pl: "plan miasta", ru: "карта города" }
  - { pl: "plan zajęć", ru: "расписание" }
  - { pl: "zmienić plany", ru: "изменить планы" }
etymology: "Из латинского planum «плоскость» через французское и немецкое посредство; в русский «план» пришёл тем же путём."
memory: "plan — «план» во всех смыслах: mam plan, plan miasta «карта города», plan zajęć «расписание». А na pierwszym planie — «на переднем плане»."
idioms:
  - { pl: "być na pierwszym planie", ru: "быть на переднем плане" }
  - { pl: "zgodnie z planem", ru: "по плану" }
  - { pl: "zmienić plany", ru: "изменить планы" }
