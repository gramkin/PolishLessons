# review
id: drwic
format: 2
lemma: "drwić"
rank: 2452
pos: verb
aspect: imperf
pron: { cyr: "дрвиць" }
senses:
  - id: mock
    ru: "насмехаться, издеваться (над кем-л.)"
    examples:
      - pl: "Przestań ze mnie drwić."
        ru: "Перестань надо мной насмехаться."
        source: { kind: translated, id: 7005708 }
      - pl: "Słyszysz, mamo - chłopcy znów ze mnie drwią."
        ru: "Слышишь, мама - мальчики опять надо мною смеются!"
        source: { kind: tatoeba, id: 3660685 }
      - pl: "Marek drwi."
        ru: "Марек насмехается."
        source: { kind: translated, id: 12195103 }
  - id: scoff
    ru: "глумиться, потешаться"
    examples:
      - pl: "Drwili z jego akcentu."
        ru: "Они потешались над его акцентом."
        source: { kind: authored }
      - pl: "Nie drwij z cudzego nieszczęścia."
        ru: "Не глумись над чужим несчастьем."
        source: { kind: authored }
notes:
  - { kind: government, text: "Насмехаться НАД кем-л. — drwić Z kogoś, с предлогом z и РОДИТЕЛЬНЫМ падежом. Русское «над» с творительным здесь не работает: drwić ze mnie «надо мной»." }
  - { kind: usage, text: "Перед местоимением mnie предлог удлиняется: ze mnie, а не z mnie." }
  - { kind: false-friend, text: "Одна семья с drwina «насмешка». А вот drwal «дровосек» — чужое слово, от drwa «дрова»: сходство написания случайное." }
  - { kind: usage, text: "Совершенный вид — zadrwić. Близкие по смыслу: kpić z kogoś, wyśmiewać się z kogoś — оба тоже с родительным." }
collocations:
  - { pl: "drwić z kogoś", ru: "насмехаться над кем-л." }
  - { pl: "ze mnie", ru: "надо мной" }
etymology: "Родственно drwina «насмешка»; праславянский корень со значением «дразнить»."
memory: "drwić z kogoś — «насмехаться над кем-л.», но с РОДИТЕЛЬНЫМ падежом, а не с «над». И помните ze mnie «надо мной» с удлинённым предлогом. Совершенный вид — zadrwić."
idioms:
  - { pl: "drwić z kogoś", ru: "насмехаться над кем-л." }
