# review
id: specjalny
format: 2
lemma: "specjalny"
rank: 811
pos: adj
pron: { cyr: "спэцья́льны" }
senses:
  - id: special
    ru: "специальный, особый"
    examples:
      - pl: "Miałem specjalny bilet."
        ru: "У меня был специальный билет."
        source: { kind: translated, id: 836380 }
      - pl: "Dzisiaj jest specjalny dzień."
        ru: "Сегодня особый день."
        source: { kind: translated, id: 4116372 }
      - pl: "Na importowane samochody został nałożony specjalny podatek."
        ru: "На импортные автомобили наложили специальный налог."
        source: { kind: translated, id: 3127334 }
  - id: nothing-special
    ru: "nic specjalnego — ничего особенного"
    note: "Очень ходовой ответ."
    examples:
      - pl: "Nic specjalnego."
        ru: "Ничего особенного."
        source: { kind: translated, id: 532329 }
      - pl: "To nic specjalnego."
        ru: "Это ничего особенного."
        source: { kind: translated, id: 13655449 }
      - pl: "To jest coś specjalnego."
        ru: "Это нечто особенное."
        source: { kind: translated, id: 2251829 }
  - id: special-place
    ru: "specjalne miejsce — особое место"
    examples:
      - pl: "W piekle jest specjalne miejsce dla tych, którzy jedzą w kinie."
        ru: "В аду есть специальное место для тех, кто ест в кинотеатре."
        source: { kind: tatoeba, id: 5706090 }
      - pl: "Mamy danie specjalne."
        ru: "У нас есть фирменное блюдо."
        source: { kind: translated, id: 440513 }
      - pl: "Tom miał z tego specjalne szkolenie."
        ru: "У Тома была по этому специальная подготовка."
        source: { kind: translated, id: 8617855 }
  - id: someone-special
    ru: "ktoś specjalny — кто-то особенный"
    examples:
      - pl: "Ona ma wielu przyjaciół, ale ten chłopak jest kimś specjalnym."
        ru: "У неё много друзей, но этот парень — кто-то особенный."
        source: { kind: translated, id: 366572 }
      - pl: "Ona piecze chleb specjalnym sposobem."
        ru: "Она печёт хлеб особым способом."
        source: { kind: translated, id: 661304 }
      - pl: "Ten program został przerwany specjalnym wydaniem programu informacyjnego."
        ru: "Эту программу прервали специальным выпуском новостей."
        source: { kind: translated, id: 510040 }
notes:
  - { kind: usage, text: "Слово покрывает и «специальный», и «особый»: specjalny podatek «специальный налог», но specjalny dzień «особый день». Русский в этих двух местах берёт разные слова." }
  - { kind: usage, text: "nic specjalnego — «ничего особенного», один из самых ходовых ответов на вопрос «как дела» или «что нового»." }
  - { kind: government, text: "specjalny DLA kogoś «специальный для кого-то» — родительный с dla: specjalna cena dla rodzin." }
  - { kind: usage, text: "Наречие — specjalnie «специально, нарочно»: Zrobił to specjalnie «Он сделал это нарочно». Существительное — specjalność «специальность»." }
collocations:
  - { pl: "nic specjalnego", ru: "ничего особенного" }
  - { pl: "specjalna cena", ru: "специальная цена" }
  - { pl: "specjalny dzień", ru: "особый день" }
  - { pl: "agent specjalny", ru: "спецагент" }
family:
  - { pl: "specjalnie", ru: "специально, нарочно", relation: derived }
  - { pl: "specjalność", ru: "специальность", relation: derived }
  - { pl: "specjalista", ru: "специалист", relation: derived }
  - { pl: "szczególny", ru: "особый", relation: root }
etymology: "Через французское spécial из латинского specialis, от species «вид» — то же заимствование, что русский «специальный»."
memory: "specjalny покрывает сразу и «специальный», и «особый»: specjalny podatek «специальный налог», но specjalny dzień «особый день» — русский в этих местах берёт разные слова. Запомните готовый ответ nic specjalnego «ничего особенного» и наречие specjalnie, которое значит ещё и «нарочно»: Zrobił to specjalnie."
idioms:
  - { pl: "nic specjalnego", ru: "ничего особенного" }
  - { pl: "specjalna cena", ru: "специальная цена" }
  - { pl: "agent specjalny", ru: "спецагент" }
