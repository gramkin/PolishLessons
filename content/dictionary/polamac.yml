# review
id: polamac
format: 2
lemma: "połamać"
rank: 5042
pos: verb
pron: { cyr: "поуа́маць" }
senses:
  - id: break-up
    ru: "поломать, разломать (на куски), переломать"
    examples:
      - pl: "Wichura połamała drzewa w parku."
        ru: "Ураган переломал деревья в парке."
        source: { kind: authored }
      - pl: "Połam czekoladę na kawałki."
        ru: "Разломай шоколад на кусочки."
        source: { kind: authored }
      - pl: "Dzieci połamały wszystkie kredki."
        ru: "Дети переломали все карандаши."
        source: { kind: authored }
  - id: injure
    ru: "переломать (кости)"
    examples:
      - pl: "Połamał sobie żebra, spadając z drabiny."
        ru: "Он сломал себе рёбра, упав с лестницы."
        source: { kind: authored }
      - pl: "Uważaj, bo połamiesz nogi na tym lodzie."
        ru: "Осторожно, переломаешь ноги на этом льду."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "POŁAMAĆ — «разломать на куски, переломать много», а не русское «поломать» в смысле «испортить механизм». Сломать часы или машину — ZEPSUĆ: ZEPSUŁ ZEGAREK. Сломать одну ногу или палку — ZŁAMAĆ: ZŁAMAŁ RĘKĘ." }
  - { kind: usage, text: "Пятьдесят три формы, включая POŁAMANI: о людях с переломами, POŁAMANI NARCIARZE. Будущее с мягким M: POŁAMIĘ, POŁAMIESZ, POŁAMIĄ. Несовершенный вид — ŁAMAĆ. С SIĘ — «сломаться, разломиться»: GAŁĄŹ SIĘ POŁAMAŁA." }
  - { kind: government, text: "Что — винительный: POŁAMAĆ GAŁĘZIE. На что — NA с винительным: POŁAMAĆ NA KAWAŁKI. Кому — дательный или SOBIE: POŁAMAĆ SOBIE NOGI. На чём обломать зубы — NA с предложным: POŁAMAĆ SOBIE ZĘBY NA ZADANIU." }
  - { kind: pronunciation, text: "Читается «поуа́маць»: Ł — «у», ударение на предпоследнем слоге. POŁAMIĘ — «поуа́мье», POŁAM — «по́уам»." }
  - { kind: register, text: "Нейтральное слово. POŁAMANIA NÓG! — шутливое пожелание удачи перед экзаменом или спектаклем, как русское «ни пуха ни пера». POŁAMAĆ SOBIE ZĘBY — разговорное «обломать зубы»." }
collocations:
  - { pl: "połamać gałęzie", ru: "наломать веток" }
  - { pl: "połamać sobie nogi", ru: "переломать себе ноги" }
  - { pl: "połamać na kawałki", ru: "разломать на куски" }
family:
  - { pl: "łamać", ru: "ломать", relation: root, id: lamac }
  - { pl: "złamać", ru: "сломать", relation: derived, id: zlamac }
  - { pl: "połamany", ru: "сломанный, поломанный", relation: derived }
etymology: "Приставка PO- плюс ŁAMAĆ «ломать», праславянское *lomati. Польское Ł на месте русского «л»: ŁAMAĆ — «ломать»."
memory: "Połamać — разломать, переломать: wichura połamała drzewa. Zepsuć — сломать механизм. Połamania nóg! — ни пуха ни пера. Читается «поуа́маць»."
idioms:
  - { pl: "połamania nóg!", ru: "ни пуха ни пера!" }
