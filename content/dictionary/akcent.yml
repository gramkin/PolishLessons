etymology: "Из латинского ACCENTUS «придыхание, напев», которое само было калькой греческого PROSODIA: AD- «к» плюс CANTUS «пение», то есть то, что поётся при слове. В польский слово пришло через латинские учебники грамматики в шестнадцатом веке и сразу в значении «ударение», потому что именно эту работу оно делало в описании латинского стиха. Русский взял то же слово позже и через французский, где ACCENT уже означал и выговор, и потому в русском закрепилось прежде всего значение «особенность речи», а для ударения было взято собственное слово от «ударять». Так одно латинское слово поделило работу между двумя языками по-разному, и польское AKCENT оказалось шире русского."
memory: "Польское akcent покрывает и «ударение», и «акцент», и в учебниках значит прежде всего ударение: akcent pada na przedostatnią sylabę. Русский для этих двух понятий держит два слова. Главная форма для запоминания — местный падеж akcencie: перед -e буква t переходит в c, как в apartamencie и konflikcie. И само слово — удобная иллюстрация правила: akcent, akcentu, akcentami — ударение всегда на предпоследнем слоге."
