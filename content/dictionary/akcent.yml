notes:
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Местный падеж единственного — AKCENCIE, и это главный урок карточки: перед окончанием -E заднеязычный T переходит в C, как в APARTAMENCIE от APARTAMENT и KONFLIKCIE от KONFLIKT. Эта мена обязательна и встречается у всех существительных мужского рода на -T. Дательный — AKCENTOWI, родительный множественного — AKCENTÓW. Слово покрывает оба русских значения, «ударение» и «акцент», и различать их приходится по контексту: AKCENT WYRAZOWY это «словесное ударение», а OBCY AKCENT — «иностранный акцент»." }
  - { kind: false-friend, text: "Русское «акцент» в школьном смысле означает только манеру речи, а «ударение» — отдельное слово. Польское AKCENT покрывает оба понятия, и в учебниках языка оно значит именно «ударение»: AKCENT PADA NA PRZEDOSTATNIĄ SYLABĘ. Поэтому фразу о польском акценте надо читать внимательно: речь может идти о правиле ударения, а не о выговоре. Третье значение — «акцент» в смысле выделения, подчёркивания: POŁOŻYĆ AKCENT NA CZYMŚ «сделать акцент на чём-то», и здесь русский и польский совпадают. Прилагательное AKCENTOWY относится к ударению, а не к выговору." }
  - { kind: pronunciation, text: "Читается «а́кцэнт», два слога, ударение на первом — и это слово, которое само себя иллюстрирует, потому что в нём ударение стоит на предпоследнем слоге по общему польскому правилу. Буква C даёт «ц», буква E — «э», без смягчения предыдущего согласного: «цэ», а не «це». Конечное T твёрдое. В местном падеже AKCENCIE сочетание CIE даёт мягкое «це»: «акце́нце», и мягкость здесь слышна отчётливо. В родительном множественного AKCENTÓW конечное W оглушается: «акце́нтуф»." }
  - { kind: stress, text: "Слово показывает польское правило на себе, и этим стоит пользоваться при объяснении. AKCENT — два слога, ударение на первом, то есть на предпоследнем. AKCENTU — три слога, ударение переезжает на второй, снова предпоследний. AKCENTAMI — четыре слога, ударение на третьем. AKCENTOWI — четыре слога, ударение на третьем. Правило не знает исключений в этом слове ни в одной форме, и его удобно показывать ученику именно на нём: само название ударения ведёт себя по описываемому правилу." }
