# review
id: tracic
format: 2
lemma: "tracić"
rank: 1004
pos: verb
aspect: imperf
aspectPair: stracic
pron: { cyr: "тра́циць" }
senses:
  - id: lose
    ru: "терять"
    examples:
      - pl: "On nigdy nie traci nadziei."
        ru: "Он никогда не теряет надежду."
        source: { kind: translated, id: 348731 }
      - pl: "Nienawidzę tracić pieniędzy."
        ru: "Ненавижу терять деньги."
        source: { kind: translated, id: 5993158 }
      - pl: "Uważasz, że tracę czas?"
        ru: "Ты считаешь, что я теряю время?"
        source: { kind: translated, id: 959716 }
  - id: lose-control
    ru: "tracić cierpliwość, kontrolę — терять терпение, контроль"
    examples:
      - pl: "Zaczynam tracić cierpliwość."
        ru: "Я начинаю терять терпение."
        source: { kind: translated, id: 7868710 }
      - pl: "Tom traci kontrolę."
        ru: "Том теряет контроль."
        source: { kind: translated, id: 6598881 }
      - pl: "Tom zaczyna tracić nad sobą kontrolę."
        ru: "Том начинает терять над собой контроль."
        source: { kind: translated, id: 6546497 }
  - id: miss-out
    ru: "nie wiesz, co tracisz — ты не знаешь, что упускаешь"
    examples:
      - pl: "Nie wiesz co tracisz."
        ru: "Ты не знаешь, что теряешь."
        source: { kind: translated, id: 2265025 }
      - pl: "Ci, którzy nigdy nie próbowali sushi, nie wiedzą co tracą."
        ru: "Те, кто никогда не пробовал суши, не знают, что теряют."
        source: { kind: translated, id: 11750270 }
      - pl: "Tracisz tylko czas i energię."
        ru: "Ты только теряешь время и силы."
        source: { kind: translated, id: 13657488 }
notes:
  - { kind: false-friend, text: "Главная ловушка: tracić значит «терять», а не «тратить». Tracić pieniądze — это «терять деньги», а «тратить деньги» будет wydawać pieniądze. Корень общий с русским «тратить», значение разошлось." }
  - { kind: usage, text: "tracić czas — «терять время, тратить время впустую»: Nie trać czasu «Не теряй времени», Tracisz tylko czas i energię." }
  - { kind: usage, text: "Nie trać nadziei! «Не теряй надежды!» — устойчивое ободрение, как и Nie trać głowy! «Не теряй головы!»." }
  - { kind: usage, text: "Совершенный вид — stracić. Tracił czas «терял время» о процессе, stracił pracę «потерял работу» о результате." }
collocations:
  - { pl: "tracić czas", ru: "терять время" }
  - { pl: "tracić nadzieję", ru: "терять надежду" }
  - { pl: "tracić cierpliwość", ru: "терять терпение" }
  - { pl: "tracić panowanie nad sobą", ru: "терять самообладание" }
family:
  - { pl: "stracić", ru: "потерять", relation: aspect, id: stracic }
  - { pl: "strata", ru: "потеря, утрата", relation: derived }
  - { pl: "utracić", ru: "утратить", relation: derived }
etymology: "Праславянское *tratiti, родственное trzeć «тереть». Русское «тратить» — то же слово, но значения разошлись: поляк теряет, русский расходует."
memory: "tracić — «терять», а НЕ «тратить». Tracić pieniądze значит «терять деньги»; «тратить деньги» будет wydawać pieniądze. Запомните Nie trać nadziei! и tracić czas «терять время»."
idioms:
