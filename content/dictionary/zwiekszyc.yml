senses:
  - id: increase
    ru: "увеличить, повысить"
    examples:
      - pl: "Kierowca zwiększył prędkość."
        ru: "Водитель увеличил скорость."
        source: { kind: translated, id: 527590 }
      - pl: "Algieria musi zwiększyć produktywność."
        ru: "Алжир должен повысить производительность."
