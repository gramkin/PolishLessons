  - id: grow
    ru: "увеличиться (zwiększyć się)"
    examples:
      - pl: "Zwiększyła się ilość firm zbierających dane osobowe."
        ru: "Увеличилось число фирм, собирающих личные данные."
        source: { kind: translated, id: 13561653 }
      - pl: "Gdyby jej gorączka zwiększyła się, poślij po lekarza."
        ru: "Если бы у неё поднялась температура, пошли за врачом."
        source: { kind: translated, id: 513459 }
      - pl: "Liczba uczestników zwiększyła się dwukrotnie."
        ru: "Число участников увеличилось вдвое."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Совершенный вид к zwiększać. Одно действие, доведённое до результата: zwiększył prędkość «увеличил скорость» — и она стала больше." }
  - { kind: government, text: "Винительный падеж: zwiększyć produkcję, zwiększyć dawkę, zwiększyć ryzyko." }
  - { kind: usage, text: "Без się переходный «увеличить», с się непереходный «увеличиться». Русский различает их так же: -ся." }
  - { kind: usage, text: "Будущее время простое, как у всех совершенных: zwiększę, zwiększysz, zwiększy. Конструкции będę zwiększyć не существует — będę бывает только у несовершенного zwiększać." }
  - { kind: false-friend, text: "От większy «больший», сравнительной степени от duży: буквально «сделать бо́льшим». Противоположность — zmniejszyć «уменьшить»." }
  - { kind: usage, text: "Отглагольное существительное zwiększenie «увеличение» употребляется свободно: plan zwiększenia wydajności «план повышения производительности»." }
collocations:
  - { pl: "zwiększyć prędkość", ru: "увеличить скорость" }
  - { pl: "zwiększyć dawkę", ru: "увеличить дозу" }
  - { pl: "zwiększyć się", ru: "увеличиться" }
etymology: "Приставка z- + większy «больший» (сравнительная степень от duży) — буквально «сделать бо́льшим». Тот же корень в większość «большинство» и zwiększenie «увеличение»; противоположность — zmniejszyć от mniejszy."
memory: "zwiększyć — «увеличить» за один раз (несовершенный — zwiększać). От większy «больший»: сделать бо́льшим. С się — «увеличиться»."
idioms:
