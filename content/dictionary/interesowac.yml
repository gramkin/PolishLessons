# review
id: interesowac
format: 2
lemma: "interesować"
rank: 749
pos: verb
aspect: imperf
pron: { cyr: "интэрэсо́ваць" }
senses:
  - id: interest
    ru: "интересовать (кого-л.)"
    note: "Без się глагол переходный: подлежащее — то, что интересует, дополнение в винительном."
    examples:
      - pl: "Interesuje mnie muzyka."
        ru: "Я интересуюсь музыкой."
        source: { kind: tatoeba, id: 1612710 }
      - pl: "Uczennicy nic nie interesuje."
        ru: "Ученицу ничего не интересует."
        source: { kind: tatoeba, id: 6769180 }
      - pl: "Interesują Pana kwiaty?"
        ru: "Вас интересуют цветы?"
        source: { kind: tatoeba, id: 531892 }
  - id: be-interested
    ru: "interesować się czymś — интересоваться чем-л."
    note: "Требует творительного падежа, как и русское «интересоваться музыкой»."
    examples:
      - pl: "Tom interesuje się matematyką."
        ru: "Том интересуется математикой."
        source: { kind: tatoeba, id: 4658256 }
      - pl: "Czym się interesujesz?"
        ru: "Чем ты интересуешься?"
        source: { kind: tatoeba, id: 360256 }
      - pl: "Interesuję się pływaniem."
        ru: "Меня интересует плавание."
        source: { kind: tatoeba, id: 1623015 }
  - id: interesting
    ru: "interesujący — интересный (причастие стало прилагательным)"
    note: "Самое частое употребление слова в живой речи."
    examples:
      - pl: "To szalenie interesująca książka."
        ru: "Это ужасно интересная книга."
        source: { kind: tatoeba, id: 1133682 }
      - pl: "To znacznie bardziej interesujące."
        ru: "Это намного интереснее."
        source: { kind: tatoeba, id: 8428498 }
      - pl: "Wstąpiłem do księgarni i kupiłem interesującą książkę."
        ru: "Я заглянул в книжный и купил интересную книгу."
        source: { kind: tatoeba, id: 502251 }
notes:
  - { kind: government, text: "interesować się требует творительного падежа: interesuję się muzyką «интересуюсь музыкой». Падеж совпадает с русским." }
  - { kind: usage, text: "Без się глагол переворачивается: Interesuje mnie muzyka «Меня интересует музыка» — подлежащее muzyka, а mnie стоит в винительном." }
  - { kind: usage, text: "Причастие interesujący давно лексикализовалось в прилагательное «интересный»: interesująca książka, To interesujące! Это самое частое употребление слова." }
  - { kind: usage, text: "Совершенный вид — zainteresować: zainteresował się «заинтересовался», zainteresowany «заинтересованный». Страдательное причастие interesowany морфология образует, но живой язык его не употребляет." }
collocations:
  - { pl: "interesować się czymś", ru: "интересоваться чем-либо" }
  - { pl: "To interesujące!", ru: "Это интересно!" }
  - { pl: "interesujący film", ru: "интересный фильм" }
  - { pl: "nie interesuje mnie to", ru: "меня это не интересует" }
family:
  - { pl: "interes", ru: "дело; интерес", relation: root }
  - { pl: "zainteresować", ru: "заинтересовать", relation: derived }
  - { pl: "zainteresowanie", ru: "интерес", relation: derived }
etymology: "Из латинского interesse «быть между, иметь значение» через interes; то же слово, что русское «интерес»."
memory: "interesować się требует творительного падежа — interesuję się muzyką, ровно как русское «интересуюсь музыкой»: падеж тот же. Но без się глагол переворачивается: Interesuje mnie muzyka «Меня интересует музыка», где muzyka — подлежащее, а mnie стоит в винительном. И помните, что причастие interesujący давно стало просто прилагательным «интересный»: To interesujące!"
idioms:
  - { pl: "To interesujące!", ru: "Это интересно!" }
  - { pl: "interesować się czymś", ru: "интересоваться чем-либо" }
  - { pl: "nic mnie to nie interesuje", ru: "меня это совершенно не интересует" }
