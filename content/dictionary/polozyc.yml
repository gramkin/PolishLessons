  - id: lie-down
    ru: "położyć się — лечь, прилечь"
    note: "С się глагол становится непереходным: Muszę się położyć «Мне надо прилечь»."
    examples:
      - pl: "Położył się do łózka."
        ru: "Он лёг спать."
        source: { kind: tatoeba, id: 2849231 }
      - pl: "Muszę się położyć."
        ru: "Мне надо прилечь."
        source: { kind: translated, id: 8730452 }
      - pl: "Jestem zmęczony, więc chyba już się położę."
        ru: "Я устал, так что, пожалуй, уже лягу."
        source: { kind: translated, id: 410745 }
  - id: situated
    ru: "położony — расположенный, находящийся (о месте)"
    note: "Страдательное причастие живёт самостоятельно: Francja jest położona na zachodzie «Франция расположена на западе»."
    examples:
      - pl: "Francja jest położona na zachodzie Europy."
        ru: "Франция находится на западе Европы."
        source: { kind: tatoeba, id: 12678627 }
      - pl: "Miasto położone jest na zachód od Londynu."
        ru: "Город находится западнее Лондона."
        source: { kind: tatoeba, id: 351388 }
      - pl: "Mój dom jest wygodnie położony – blisko dworca."
        ru: "Мой дом удобно расположен — рядом с вокзалом."
        source: { kind: translated, id: 349478 }
notes:
  - { kind: usage, text: "Формы położę, położysz, położy — БУДУЩЕЕ время: глагол совершенного вида. Несовершенный вид — kłaść: Kładę książkę na stole." }
  - { kind: usage, text: "С się смысл меняется на непереходный «лечь»: położyć dziecko «уложить ребёнка», но położyć się «лечь самому». Тот же механизм, что в uczyć / uczyć się." }
  - { kind: false-friend, text: "Причастие położony чаще всего значит не «положенный», а «расположенный»: miasto położone nad rzeką «город, расположенный у реки». Существительное położenie — «положение, местоположение», в том числе переносно: trudne położenie «трудное положение»." }
  - { kind: usage, text: "Устойчивое położyć kres czemuś значит «положить конец чему-то» — оборот совпадает с русским дословно." }
collocations:
  - { pl: "położyć na stole", ru: "положить на стол" }
  - { pl: "położyć się spać", ru: "лечь спать" }
  - { pl: "położyć kres", ru: "положить конец" }
  - { pl: "być położonym", ru: "быть расположенным" }
family:
  - { pl: "kłaść", ru: "класть", relation: derived }
  - { pl: "położenie", ru: "положение", relation: derived }
  - { pl: "łóżko", ru: "кровать", relation: derived }
etymology: "Приставка po- плюс łożyć/kłaść «класть», от праславянского *ložiti — то же слово, что русское «положить». Отсюда же łóżko «кровать» и łoże «ложе»."
memory: "położyć — «положить», совершенный вид от kłaść. С частицей się смысл становится непереходным: położyć dziecko «уложить ребёнка», но położyć się «лечь самому» — Muszę się położyć. Отдельно запомните причастие: położony чаще значит не «положенный», а «расположенный» — miasto położone nad rzeką, а położenie — «положение, местоположение», в том числе переносное trudne położenie. Оборот położyć kres czemuś «положить конец чему-то» совпадает с русским дословно."
idioms:
  - { pl: "położyć kres", ru: "положить конец" }
  - { pl: "położyć się spać", ru: "лечь спать" }
  - { pl: "położyć rękę na czymś", ru: "наложить руку на что-то" }
