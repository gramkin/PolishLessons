        ru: "Он ударил его кинжалом в спину."
        source: { kind: authored }
  - id: stab
    ru: "удар в спину, предательство (перен.)"
    examples:
      - pl: "Jego słowa były jak sztylet."
        ru: "Его слова были как нож."
        source: { kind: authored }
      - pl: "Ta zdrada to sztylet w serce."
        ru: "Это предательство — нож в сердце."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "SZTYLET — «кинжал, стилет», узкий клинок для удара. Обычный нож — NÓŻ, меч — MIECZ. Туфли на шпильке — SZPILKI, не «стилеты». WBIĆ SZTYLET W PLECY — «вонзить нож в спину»." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Родительный — SZTYLETU. В местном T переходит в C: W SZTYLECIE." }
  - { kind: government, text: "Ударить кинжалом — UGODZIĆ SZTYLETEM, творительный. Вонзить кинжал во что — WBIĆ SZTYLET W и винительный." }
  - { kind: pronunciation, text: "Читается «шты́лет»: SZ — «ш», TY — «ты». Ударение на первом слоге. SZTYLECIE — «штыле́це»." }
collocations:
  - { pl: "wbić sztylet", ru: "вонзить кинжал" }
  - { pl: "ostry sztylet", ru: "острый кинжал" }
  - { pl: "sztylet w plecy", ru: "нож в спину" }
family:
  - { pl: "nóż", ru: "нож", relation: root, id: noz }
  - { pl: "miecz", ru: "меч", relation: root, id: miecz }
  - { pl: "broń", ru: "оружие", relation: root, id: bron }
etymology: "Из итальянского STILETTO «стилет», уменьшительного от STILO «стержень». Польское SZT- передаёт итальянское ST- по-своему."
memory: "Sztylet — кинжал, стилет. Wbić sztylet w plecy — вонзить нож в спину. Читается «шты́лет»."
idioms:
