# review
id: powodzenie
format: 2
lemma: "powodzenie"
rank: 968
pos: noun
pron: { cyr: "поводзе́не" }
senses:
  - id: good-luck
    ru: "Powodzenia! — Удачи!"
    note: "Родительный падеж, застывший в пожелание. Это самое частое употребление слова."
    examples:
      - pl: "Powodzenia"
        ru: "Удачи"
        source: { kind: translated, id: 674876 }
      - pl: "Powodzenia!"
        ru: "Удачи!"
        source: { kind: translated, id: 1110181 }
      - pl: "Powodzenia."
        ru: "Удачи."
        source: { kind: translated, id: 674877 }
  - id: success
    ru: "успех, удача"
    examples:
      - pl: "Wątpię w jego powodzenie."
        ru: "Я сомневаюсь в его успехе."
        source: { kind: translated, id: 921392 }
      - pl: "Zasługujesz na powodzenie."
        ru: "Ты заслуживаешь успеха."
        source: { kind: translated, id: 12351189 }
      - pl: "Zasługujecie na powodzenie."
        ru: "Вы заслуживаете успеха."
        source: { kind: translated, id: 12351191 }
  - id: with-success
    ru: "z powodzeniem — успешно, с успехом"
    examples:
      - pl: "Wypełniliśmy misję z powodzeniem."
        ru: "Мы успешно выполнили миссию."
        source: { kind: translated, id: 929484 }
      - pl: "Jego próba ucieczki zakończyła się powodzeniem."
        ru: "Его попытка побега увенчалась успехом."
        source: { kind: translated, id: 898799 }
      - pl: "O ile znam swoje dzieci, z powodzeniem zdadzą egzaminy."
        ru: "Насколько я знаю своих детей, они успешно сдадут экзамены."
        source: { kind: translated, id: 2290696 }
notes:
  - { kind: usage, text: "Powodzenia! — «Удачи!» — это застывший родительный падеж, как и русское «Удачи!». Именно в этой форме слово встречается чаще всего." }
  - { kind: usage, text: "z powodzeniem — «успешно, с успехом»: zakończyć się powodzeniem «завершиться успехом»." }
  - { kind: usage, text: "Глагол powodzić się безличный: Jak ci się powodzi? «Как у тебя дела?». Форма powodzi mi się dobrze значит «у меня всё хорошо»." }
  - { kind: usage, text: "mieć powodzenie у людей значит «пользоваться успехом», в том числе у противоположного пола: Ma powodzenie u kobiet." }
collocations:
  - { pl: "powodzenia!", ru: "удачи!" }
  - { pl: "z powodzeniem", ru: "успешно" }
  - { pl: "mieć powodzenie", ru: "пользоваться успехом" }
  - { pl: "jak ci się powodzi?", ru: "как дела?" }
family:
  - { pl: "powodzić się", ru: "везти, удаваться", relation: root }
  - { pl: "udać się", ru: "удаться", relation: root, id: udac }
etymology: "От powodzić się «везти, удаваться», от wodzić «водить»: изначально «то, как ведутся дела». Русское «поводить» того же корня, но значение разошлось."
memory: "powodzenie — «успех», но чаще всего слово встречается в одной застывшей форме: Powodzenia! «Удачи!». Это родительный падеж, ровно как в русском пожелании. Запомните и z powodzeniem «успешно», и вопрос Jak ci się powodzi? «Как дела?»."
idioms:
  - { pl: "powodzenia!", ru: "удачи!" }
  - { pl: "z powodzeniem", ru: "успешно" }
  - { pl: "jak ci się powodzi?", ru: "как дела?" }
