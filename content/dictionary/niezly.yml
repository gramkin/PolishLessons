# review
id: niezly
format: 2
lemma: "niezły"
rank: 458
pos: adj
pron: { cyr: "не́зуы" }
senses:
  - id: not-bad
    ru: "неплохой, недурной"
    examples:
      - pl: "Myślę, że mam całkiem niezły pomysł."
        ru: "Кажется, у меня есть неплохая идея."
        source: { kind: tatoeba, id: 3430551 }
      - pl: "To niezły film."
        ru: "Это неплохой фильм."
        source: { kind: authored }
      - pl: "Masz niezły pomysł."
        ru: "У тебя неплохая идея."
        source: { kind: authored }
  - id: considerable
    ru: "изрядный, порядочный (усилительно)"
    examples:
      - pl: "Mam w pokoju niezły burdel."
        ru: "В моей комнате - полный бардак."
        source: { kind: tatoeba, id: 348630 }
      - pl: "Zrobił się niezły bałagan."
        ru: "Получился изрядный беспорядок."
        source: { kind: authored }
      - pl: "To był niezły wyczyn."
        ru: "Это был изрядный подвиг."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Слово построено как литота: nie + zły «не плохой». Русское «неплохой» устроено точно так же." }
  - { kind: usage, text: "В разговоре niezły часто не смягчает, а усиливает: niezły bałagan значит «изрядный бардак», niezła afera — «порядочный скандал»." }
  - { kind: usage, text: "Мужско-личное множественное — nieźli, с чередованием ł → ź: niezły → nieźli." }
  - { kind: usage, text: "Nieźle! — одобрительная реплика «Недурно!»." }
collocations:
  - { pl: "niezły pomysł", ru: "неплохая идея" }
  - { pl: "nieźle!", ru: "недурно!" }
  - { pl: "niezła robota", ru: "неплохая работа" }
  - { pl: "niezły bałagan", ru: "изрядный беспорядок" }
etymology: "Из nie + zły «плохой», праславянское *zъlъ — то же, что русское «злой». Буквально «не плохой», и русское «неплохой» собрано тем же способом."
memory: "niezły — «неплохой», литота, собранная как русская: nie + zły. Но в разговоре она часто усиливает, а не смягчает: niezły bałagan это «изрядный бардак». Множественное — nieźli, с мягким ź."
idioms:
  - { pl: "nieźle!", ru: "недурно!" }
  - { pl: "niezły numer", ru: "тот ещё фрукт" }
  - { pl: "niezła afera", ru: "изрядный скандал" }
