# review
id: porwac
format: 2
lemma: "porwać"
rank: 1007
pos: verb
aspect: perf
pron: { cyr: "по́рваць" }
senses:
  - id: kidnap
    ru: "похитить, угнать"
    examples:
      - pl: "Porwali mnie."
        ru: "Меня похитили."
        source: { kind: translated, id: 2282534 }
      - pl: "Syn króla został porwany."
        ru: "Сын короля был похищен."
        source: { kind: tatoeba, id: 10631714 }
      - pl: "Szczerze mówiąc, przybyliśmy tu by cię porwać."
        ru: "Честно говоря, мы пришли сюда, чтобы тебя похитить."
        source: { kind: translated, id: 1350265 }
  - id: tear
    ru: "порвать, разорвать"
    examples:
      - pl: "Gwóźdź porwał jego kurtkę."
        ru: "Гвоздь порвал его куртку."
        source: { kind: translated, id: 10593824 }
      - pl: "Płótno było porwane w trzech miejscach."
        ru: "Полотно было порвано в трёх местах."
        source: { kind: translated, id: 10592795 }
  - id: sweep
    ru: "унести (о стихии); увлечь (публику)"
    examples:
      - pl: "Silny wiatr porwał dom."
        ru: "Сильный ветер унёс дом."
        source: { kind: translated, id: 831728 }
      - pl: "Ten most został porwany przez powódź."
        ru: "Этот мост снесло наводнением."
        source: { kind: translated, id: 557749 }
notes:
  - { kind: usage, text: "В одном глаголе сошлись два: совершенный вид к porywać «похищать» и к rwać «рвать». Различает только контекст." }
  - { kind: government, text: "porwać kogoś — винительный падеж без предлога, как русское «похитить кого-то»." }
  - { kind: usage, text: "porwać samolot значит «угнать самолёт», а porwanie — «похищение, угон»." }
  - { kind: usage, text: "Переносно — «увлечь»: porwać publiczność «увлечь публику», porwać tłum «захватить толпу»." }
collocations:
  - { pl: "porwać dziecko", ru: "похитить ребёнка" }
  - { pl: "porwać samolot", ru: "угнать самолёт" }
  - { pl: "zostać porwanym", ru: "быть похищенным" }
  - { pl: "porwać publiczność", ru: "увлечь публику" }
family:
  - { pl: "porywać", ru: "похищать (несовершенный вид)", relation: aspect }
  - { pl: "rwać", ru: "рвать", relation: root }
  - { pl: "porywacz", ru: "похититель, угонщик", relation: derived }
etymology: "Приставка po- плюс rwać «рвать» — то же слово, что русское «рвать». Значение «похитить» выросло из «вырвать, выхватить», ровно как в русском «урвать»."
memory: "porwać — сразу «похитить» и «порвать»: в одном глаголе сошлись совершенные виды от porywać и от rwać. Porwali dziecko «Ребёнка похитили», но Gwóźdź porwał kurtkę «Гвоздь порвал куртку»."
idioms:
  - { pl: "porwać samolot", ru: "угнать самолёт" }
  - { pl: "porwać publiczność", ru: "увлечь публику" }
formExamplesSkip:
  - { form: "porwawszy", reason: "книжное деепричастие прошедшего времени; в живой речи не употребляется" }
