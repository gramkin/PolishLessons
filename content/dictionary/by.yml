# review
id: by
format: 2
depth: deep
lemma: "by"
rank: 53
pos: conj
pron: { cyr: "бы" }
senses:
  - id: in-order-to
    ru: "чтобы (с инфинитивом или прошедшим временем)"
    examples:
      - pl: "Chcę, by Tom wrócił."
        ru: "Я хочу, чтобы Том вернулся."
        source: { kind: tatoeba, id: 5907105 }
      - pl: "Narodziliśmy się by umrzeć."
        ru: "Мы родились, чтобы умереть."
        source: { kind: tatoeba, id: 2218893 }
  - id: conditional
    ru: "бы (частица сослагательного наклонения)"
    examples:
      - pl: "Co by zrobił Jezus?"
        ru: "Что бы сделал Иисус?"
        source: { kind: tatoeba, id: 12712228 }
      - pl: "Tomowi by się spodobało."
        ru: "Тому бы понравилось."
        source: { kind: tatoeba, id: 12564131 }
      - pl: "Kto by pomyślał?"
        ru: "Кто бы подумал?"
        source: { kind: authored }
  - id: purpose-clause
    ru: "чтобы (цель при другом подлежащем и в безличных оборотах)"
    examples:
      - pl: "Ryzykował życiem, by ją uratować."
        ru: "Он рисковал жизнью, чтобы спасти её."
        source: { kind: tatoeba, id: 364812 }
      - pl: "Czytam, by się czegoś dowiedzieć."
        ru: "Я читаю, чтобы что-нибудь узнать."
        source: { kind: tatoeba, id: 951307 }
      - pl: "Ważne jest, by jeździć ostrożnie."
        ru: "Важно водить аккуратно."
        source: { kind: translated, id: 368080 }
notes:
  - { kind: usage, text: "В сослагательном наклонении by обычно срастается с глаголом: zrobiłbym «я бы сделал». Отдельно стоит в союзах by, żeby, aby." }
  - { kind: usage, text: "Личные окончания приклеиваются к by, а не к глаголу: zrobiłbym «я бы сделал», zrobiłbyś «ты бы сделал», zrobilibyśmy «мы бы сделали». Русское «бы» неизменяемо, и это главное расхождение." }
  - { kind: usage, text: "Частица подвижна: она может отойти к первому ударному слову — Ja bym tego nie zrobił наряду с Ja nie zrobiłbym tego. Дважды её ставить нельзя." }
  - { kind: false-friend, text: "by как союз цели равнозначно żeby и aby: Chcę, by wrócił = Chcę, żeby wrócił. После него глагол стоит в форме прошедшего времени, а не в инфинитиве, если подлежащие разные." }
collocations:
  - { pl: "żeby", ru: "чтобы" }
  - { pl: "aby", ru: "чтобы" }
etymology: "Праславянское *by — старая форма аориста глагола «быть», та же, что русское «бы»."
memory: "by = «бы» и по происхождению, и по работе. Разница в написании: с глаголом оно срастается (zrobiłby, chciałbym), а как союз пишется отдельно. Союз «чтобы» — żeby, то есть że + by."
idioms:
  - { pl: "kto by pomyślał", ru: "кто бы мог подумать" }
  - { pl: "by nie powiedzieć", ru: "чтобы не сказать" }
  - { pl: "jak by nie było", ru: "как бы то ни было" }
