  - id: conditional
    ru: "бы (частица сослагательного наклонения)"
    examples:
      - pl: "Co by zrobił Jezus?"
        ru: "Что бы сделал Иисус?"
        source: { kind: tatoeba, id: 12712228 }
      - pl: "Tomowi by się spodobało."
        ru: "Тому бы понравилось."
        source: { kind: tatoeba, id: 12564131 }
      - pl: "Kto by pomyślał?"
        ru: "Кто бы подумал?"
        source: { kind: authored }
notes:
  - { kind: usage, text: "В сослагательном наклонении by обычно срастается с глаголом: zrobiłbym «я бы сделал». Отдельно стоит в союзах by, żeby, aby." }
collocations:
  - { pl: "żeby", ru: "чтобы" }
  - { pl: "aby", ru: "чтобы" }
etymology: "Праславянское *by — старая форма аориста глагола «быть», та же, что русское «бы»."
memory: "by = «бы» и по происхождению, и по работе. Разница в написании: с глаголом оно срастается (zrobiłby, chciałbym), а как союз пишется отдельно. Союз «чтобы» — żeby, то есть że + by."
idioms:
