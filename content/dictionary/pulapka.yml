# review
id: pulapka
format: 2
lemma: "pułapka"
rank: 1668
pos: noun
pron: { cyr: "пууа́пка" }
senses:
  - id: trap
    ru: "ловушка, западня"
    examples:
      - pl: "To pułapka!"
        ru: "Это ловушка!"
        source: { kind: translated, id: 6308724 }
      - pl: "Może to pułapka."
        ru: "Может, это ловушка."
        source: { kind: translated, id: 1857357 }
      - pl: "To może być pułapka. Uważajcie."
        ru: "Это может быть ловушка. Будьте осторожны."
        source: { kind: translated, id: 4353969 }
  - id: set-trap
    ru: "ставить ловушку, попасть в ловушку"
    examples:
      - pl: "Tom zastawił pułapkę."
        ru: "Том поставил ловушку."
        source: { kind: translated, id: 2605149 }
      - pl: "Złapali lisa w pułapkę."
        ru: "Они поймали лису в ловушку."
        source: { kind: translated, id: 563499 }
      - pl: "Tym razem ona wpadła w pułapkę."
        ru: "На этот раз она попала в ловушку."
        source: { kind: translated, id: 947985 }
notes:
  - { kind: government, text: "«В ловушке» — w pułapce (предложный), «в ловушку» — w pułapkę (винительный): wpaść w pułapkę «попасть в ловушку», być w pułapce «быть в ловушке»." }
  - { kind: usage, text: "zastawić pułapkę — «поставить ловушку»; zwabić w pułapkę — «заманить в ловушку»." }
  - { kind: usage, text: "Переносно тоже живо: To pułapka! «Это ловушка!» — о подвохе в разговоре или ситуации." }
  - { kind: usage, text: "Происходит от łapać «ловить» — тот же корень, что в łapa «лапа» и złapać «поймать»." }
collocations:
  - { pl: "wpaść w pułapkę", ru: "попасть в ловушку" }
  - { pl: "zastawić pułapkę", ru: "поставить ловушку" }
  - { pl: "być w pułapce", ru: "быть в ловушке" }
etymology: "От łapać «ловить» с приставкой pu-, вариант старого po-. Русская «ловушка» построена от «ловить» ровно тем же способом, так что слова параллельны по образованию."
memory: "pułapka = «ловушка», от łapać «ловить». Падежи: wpaść w pułapkę «попасть в ловушку» (винительный), но być w pułapce «быть в ловушке» (предложный)."
idioms:
  - { pl: "wpaść w pułapkę", ru: "попасть в ловушку" }
  - { pl: "zastawić pułapkę", ru: "поставить ловушку" }
  - { pl: "to pułapka!", ru: "это ловушка!" }
formExamplesSkip:
