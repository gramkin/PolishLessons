# review
id: poleciec
format: 2
lemma: "polecieć"
rank: 1650
pos: verb
aspect: perf
aspectPair: leciec
pron: { cyr: "поле́цець" }
senses:
  - id: fly
    ru: "полететь (самолётом)"
    examples:
      - pl: "Polecę tam samolotem."
        ru: "Я полечу туда самолётом."
        source: { kind: tatoeba, id: 4716807 }
      - pl: "Poleciał do Paryża."
        ru: "Он полетел в Париж."
        source: { kind: translated, id: 364130 }
      - pl: "Tom poleciał wczoraj do Bostonu."
        ru: "Том вчера полетел в Бостон."
        source: { kind: tatoeba, id: 4837619 }
  - id: fly-to
    ru: "полететь куда-либо"
    examples:
      - pl: "Chcę polecieć na księżyc."
        ru: "Я хочу полететь на Луну."
        source: { kind: translated, id: 6360121 }
      - pl: "Musiałem polecieć do Ameryki."
        ru: "Мне пришлось полететь в Америку."
        source: { kind: translated, id: 642590 }
      - pl: "Kosmonauci polecieli na Księżyc w rakiecie."
        ru: "Космонавты вылетели на Луну в ракете."
        source: { kind: tatoeba, id: 732892 }
notes:
  - { kind: false-friend, text: "Рядом живёт почти одинаковый глагол polecić «порекомендовать, поручить»: Co mi polecisz? «Что ты мне порекомендуешь?». Он отличается одной буквой, и его формы легко спутать с формами polecieć." }
  - { kind: false-friend, text: "Существительное polecenie «поручение, команда» тоже входит в эту путаницу: Musisz wykonywać polecenia «Ты должен выполнять поручения» — это не от polecieć." }
  - { kind: usage, text: "Несовершенный вид — lecieć «лететь»; polecieć значит однократное «полететь, вылететь»." }
  - { kind: usage, text: "Переносно polecieć na coś значит «повестись на что-то»: poleciał na jej urodę «он повёлся на её красоту»." }
collocations:
  - { pl: "polecieć samolotem", ru: "полететь самолётом" }
  - { pl: "polecieć do Paryża", ru: "полететь в Париж" }
  - { pl: "polecieć na Księżyc", ru: "полететь на Луну" }
etymology: "Приставка po- + lecieć «лететь», праславянское *letěti. Русское «полететь» — то же слово с той же приставкой, соответствие полное."
memory: "polecieć = «полететь», несовершенный вид — lecieć. Главная ловушка: рядом стоит polecić «порекомендовать», отличающееся одной буквой, и существительное polecenie «поручение» — их формы легко спутать."
