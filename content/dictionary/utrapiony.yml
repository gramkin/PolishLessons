        ru: "Я не узнал измученного соседа."
        source: { kind: authored }
  - id: tiresome
    ru: "докучливый, надоедливый"
    examples:
      - pl: "Ten utrapiony kaszel nie mija."
        ru: "Этот докучливый кашель не проходит."
        source: { kind: authored }
      - pl: "Pomagali utrapionym rodzicom."
        ru: "Они помогали измученным родителям."
        source: { kind: authored }
notes:
  - { kind: usage, text: "По форме причастие от utrapić «измучить», но работает как обычное прилагательное — так же, как wzruszony." }
  - { kind: government, text: "В словаре слово записано как существительное, и его парадигма поэтому мужско-личная: utrapiony, utrapionego, utrapieni. Женские формы вроде utrapiona существуют в языке, но в эту парадигму не входят." }
  - { kind: false-friend, text: "Корень trapić «мучить, донимать»; существительное utrapienie значит «мучение, докука»." }
  - { kind: usage, text: "Слово книжноватое; в корпусе не встречается, поэтому все примеры составлены вручную." }
collocations:
