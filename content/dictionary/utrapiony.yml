# review
id: utrapiony
format: 2
lemma: "utrapiony"
rank: 5563
pos: adj
pron: { cyr: "утрапё́ны" }
senses:
  - id: troubled
    ru: "измученный, удручённый"
    examples:
      - pl: "Wrócił utrapiony i milczący."
        ru: "Он вернулся удручённый и молчаливый."
        source: { kind: authored }
      - pl: "Utrapiony ojciec siedział przy łóżku."
        ru: "Измученный отец сидел у кровати."
        source: { kind: authored }
      - pl: "Nie poznałem utrapionego sąsiada."
        ru: "Я не узнал измученного соседа."
        source: { kind: authored }
  - id: tiresome
    ru: "докучливый, надоедливый"
    examples:
      - pl: "Ten utrapiony kaszel nie mija."
        ru: "Этот докучливый кашель не проходит."
        source: { kind: authored }
      - pl: "Pomagali utrapionym rodzicom."
        ru: "Они помогали измученным родителям."
        source: { kind: authored }
notes:
  - { kind: usage, text: "По форме причастие от utrapić «измучить», но работает как обычное прилагательное — так же, как wzruszony." }
  - { kind: government, text: "Склоняется как обычное прилагательное: utrapiony, utrapiona, utrapione, мн. ч. utrapieni (о мужчинах) и utrapione." }
  - { kind: false-friend, text: "Корень trapić «мучить, донимать»; существительное utrapienie значит «мучение, докука»." }
  - { kind: usage, text: "Слово книжноватое; в корпусе не встречается, поэтому все примеры составлены вручную." }
collocations:
  - { pl: "utrapiony wyraz twarzy", ru: "измученное выражение лица" }
  - { pl: "utrapienie", ru: "мучение, докука" }
etymology: "Причастие от utrapić «измучить», от trapić «мучить, донимать»."
memory: "utrapiony — «измученный», а о вещах «докучливый». По форме причастие, по работе прилагательное. Существительное — utrapienie «мучение»."
idioms:
  - { pl: "utrapiony wyraz twarzy", ru: "измученное выражение лица" }
