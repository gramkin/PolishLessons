# review
id: matka
format: 2
lemma: "matka"
rank: 199
pos: noun
pron: { cyr: "ма́тка" }
senses:
  - id: mother
    ru: "мать"
    examples:
      - pl: "To jest moja matka."
        ru: "Это моя мать."
        source: { kind: tatoeba, id: 1550565 }
      - pl: "Gdzie jest twoja matka?"
        ru: "Где твоя мать?"
        source: { kind: tatoeba, id: 8774127 }
      - pl: "Moja matka uwielbia muzykę."
        ru: "Моя мама любит музыку."
        source: { kind: tatoeba, id: 2422742 }
  - id: as-mother
    ru: "мать (в роли, в сравнении, в обращении)"
    examples:
      - pl: "Jesteś dobrą matką."
        ru: "Ты хорошая мать."
        source: { kind: tatoeba, id: 4438786 }
      - pl: "Tak, jestem jego matką."
        ru: "Да, я его мать."
        source: { kind: tatoeba, id: 12888733 }
      - pl: "Jest podobna do matki."
        ru: "Она похожа на мать."
        source: { kind: tatoeba, id: 757266 }
notes:
  - { kind: usage, text: "matka — нейтральное и чуть официальное слово, mama — тёплое и разговорное. Разница та же, что между русскими «мать» и «мама»." }
  - { kind: usage, text: "O matko! — восклицание удивления, «О господи!», а не обращение к матери." }
  - { kind: usage, text: "Dzień Matki в Польше отмечают 26 мая." }
collocations:
  - { pl: "moja matka", ru: "моя мать" }
  - { pl: "zostać matką", ru: "стать матерью" }
  - { pl: "Dzień Matki", ru: "День матери" }
  - { pl: "matka chrzestna", ru: "крёстная мать" }
etymology: "Праславянское *mati с уменьшительным суффиксом -ka; то же слово, что русское «мать», а польское mama — как русское «мама»."
memory: "matka — «мать» (нейтрально), mama — «мама» (тепло). А восклицание O matko! значит «О господи!» и к матери отношения не имеет."
idioms:
  - { pl: "matka Polka", ru: "мать-полька, самоотверженная мать" }
  - { pl: "powtarzać jak za panią matką", ru: "повторять как попугай" }
  - { pl: "matka chrzestna", ru: "крёстная мать" }
