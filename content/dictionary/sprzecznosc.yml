    ru: "расхождение, несовместимость"
    examples:
      - pl: "Sprzeczności są częścią rzeczywistości."
        ru: "Противоречия — часть действительности."
        source: { kind: translated, id: 10470384 }
      - pl: "Zachodzi sprzeczność między słowami a czynami."
        ru: "Между словами и делами есть противоречие."
        source: { kind: authored }
notes:
  - { kind: government, text: "sprzeczność między czymś a czymś «противоречие между чем-л. и чем-л.» — обратите внимание на a, а не i, между частями." }
  - { kind: usage, text: "w sprzeczności z czymś «в противоречии с чем-л.» — с творительным падежом." }
  - { kind: false-friend, text: "Корень przeczyć «противоречить», та же семья, что zaprzeczyć «отрицать»; ср. русское «перечить», «противоречие»." }
  - { kind: government, text: "Женский род на -ść: ta sprzeczność, tej sprzeczności." }
collocations:
  - { pl: "sprzeczność między", ru: "противоречие между" }
  - { pl: "w sprzeczności z", ru: "в противоречии с" }
etymology: "От sprzeczny «противоречивый», от przeczyć «противоречить»; ср. русское «перечить», «противоречие»."
memory: "sprzeczność — «противоречие». Управление с ловушкой: sprzeczność między A a B, где части соединяет a, а не i."
