# review
id: bozy
format: 2
lemma: "boży"
rank: 1382
pos: adj
pron: { cyr: "бо́жы" }
senses:
  - id: divine
    ru: "божий, Божий"
    examples:
      - pl: "Panie Jezu Chryste, Synu Boży, zmiłuj się nade mną, grzesznikiem."
        ru: "Господи Иисусе Христе, Сыне Божий, помилуй меня, грешного."
        source: { kind: translated, id: 6637566 }
      - pl: "Nie testuj Bożej cierpliwości!"
        ru: "Не испытывай Божье терпение!"
        source: { kind: tatoeba, id: 968932 }
      - pl: "W wierze chrześcijańskiej, wierzący myślą, że jest tylko jeden Bóg, a Jezus Chrystus to syn Boży."
        ru: "В христианской вере верующие полагают, что есть только один Бог, а Иисус Христос — Сын Божий."
        source: { kind: translated, id: 570486 }
  - id: christmas
    ru: "Boże Narodzenie — Рождество"
    examples:
      - pl: "Chcecie coś dać Tomowi na Boże Narodzenie?"
        ru: "Вы собираетесь что-то дарить Тому на Рождество?"
        source: { kind: tatoeba, id: 13784850 }
      - pl: "Szczęśliwego Bożego Narodzenia."
        ru: "Счастливого Рождества."
        source: { kind: translated, id: 2951429 }
      - pl: "Do Bożego Narodzenia zostały cztery dni!"
        ru: "До Рождества осталось четыре дня!"
        source: { kind: translated, id: 1182242 }
notes:
  - { kind: usage, text: "Boże Narodzenie «Рождество» — буквально «Божье Рождение». Склоняется целиком: do Bożego Narodzenia «до Рождества», przed Bożym Narodzeniem «перед Рождеством»." }
  - { kind: false-friend, text: "Форма boże совпадает со звательной формой существительного Bóg: O Boże! «О боже!», Boże, chroń Ukrainę! Это обращение к Богу, а не прилагательное. Прилагательное boże — средний род: Boże Narodzenie." }
  - { kind: usage, text: "Прилагательное живёт прежде всего в устойчивых сочетаниях: syn Boży «Сын Божий», palec boży «перст божий», sąd boży «божий суд»." }
  - { kind: usage, text: "Пишется со строчной в общем значении (boży świat) и с прописной, когда относится к христианскому Богу: Syn Boży, Boże Narodzenie." }
collocations:
  - { pl: "Boże Narodzenie", ru: "Рождество" }
  - { pl: "syn Boży", ru: "Сын Божий" }
  - { pl: "palec boży", ru: "перст божий" }
etymology: "От Bóg «Бог» с суффиксом -y, ровно как русское «божий» от «бог». Соответствие прямое, вплоть до чередования g/ż — в русском ему отвечает г/ж: «бог — божий»."
memory: "boży = «божий», от Bóg. Главное сочетание — Boże Narodzenie «Рождество», буквально «Божье Рождение». И различайте: boże в Boże Narodzenie — прилагательное, а O Boże! — звательная форма существительного Bóg."
idioms:
  - { pl: "Boże Narodzenie", ru: "Рождество" }
  - { pl: "palec boży", ru: "перст божий" }
  - { pl: "co dzień boży", ru: "каждый божий день" }
