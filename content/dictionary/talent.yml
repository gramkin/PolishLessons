# review
id: talent
format: 2
lemma: "talent"
rank: 1709
pos: noun
pron: { cyr: "та́лент" }
senses:
  - id: gift
    ru: "талант, дарование"
    examples:
      - pl: "Masz talent."
        ru: "У тебя есть талант."
        source: { kind: translated, id: 8523859 }
      - pl: "Ma talent do malarstwa."
        ru: "У него талант к живописи."
        source: { kind: translated, id: 355545 }
      - pl: "Ona ma wrodzony talent muzyczny."
        ru: "У неё врождённый музыкальный талант."
        source: { kind: translated, id: 403731 }
  - id: talented-person
    ru: "талант (о самом одарённом человеке); нехватка таланта"
    examples:
      - pl: "Nie mam talentu."
        ru: "У меня нет таланта."
        source: { kind: translated, id: 8718746 }
      - pl: "On jest prawdziwym talentem."
        ru: "Он настоящий талант."
        source: { kind: translated, id: 6443098 }
notes:
  - { kind: usage, text: "Множественное число — talenty. Форма talenta устарела: так склоняли в XIX веке (ср. старые akta, grunta), и сегодня она не употребляется, поэтому оставлена без примеров." }
  - { kind: government, text: "Талант к чему-то — talent do czegoś, с предлогом do и родительным падежом: talent do matematyki, talent do języków." }
  - { kind: usage, text: "Прилагательное — utalentowany «талантливый»; łowca talentów — «охотник за талантами»." }
  - { kind: usage, text: "Словарь помнит и древнюю меру веса и денег; сегодня это значение живёт только в евангельской притче о талантах." }
  - { kind: false-friend, text: "talent называет и способность, и самого способного человека: on jest prawdziwym talentem «он настоящий талант»." }
collocations:
  - { pl: "talent do matematyki", ru: "талант к математике" }
  - { pl: "mieć talent", ru: "иметь талант" }
  - { pl: "brak talentu", ru: "отсутствие таланта" }
family:
  - { pl: "utalentowany", ru: "талантливый", relation: root }
  - { pl: "zdolność", ru: "способность", relation: root }
etymology: "Из греческого tálanton «вес, мера» через латынь: по евангельской притче о талантах слово стало значить дарование. Русское «талант» прошло ровно тот же путь."
memory: "talent — «талант», слово в слово. Предлог do: mieć talent do języków «иметь талант к языкам». И talent — это ещё и сам одарённый человек."
idioms:
  - { pl: "łowca talentów", ru: "охотник за талантами" }
  - { pl: "mieć talent do czegoś", ru: "иметь талант к чему-либо" }
  - { pl: "brak talentu", ru: "отсутствие таланта" }
formExamplesSkip:
  - { form: "talenta", reason: "в корпусе нет примеров для этой формы" }
