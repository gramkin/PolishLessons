notes:
  - { kind: false-friend, text: "WSPÓLNOTA — «сообщество, община», а также «общность»: WSPÓLNOTA INTERESÓW, «общность интересов». От WSPÓLNY «общий». В быту WSPÓLNOTA — чаще всего WSPÓLNOTA MIESZKANIOWA, объединение владельцев квартир в доме, аналог русского ТСЖ." }
  - { kind: usage, text: "Десять форм, женский род. В местном падеже T переходит в C: WSPÓLNOCIE. Родительный множественного — WSPÓLNOT. Звательный встречается в проповедях: DROGA WSPÓLNOTO." }
  - { kind: government, text: "В сообществе — WE WSPÓLNOCIE: перед W предлог W получает E. Принадлежать к сообществу — NALEŻEĆ DO WSPÓLNOTY. Общность чего — родительный: WSPÓLNOTA LOSU, «общность судьбы»." }
  - { kind: pronunciation, text: "Читается «фспульно́та», ударение на предпоследнем слоге. W перед S оглушается в «ф», Ó — «у», L перед N мягкое, как в WSPÓLNY «фспу́льны»." }
  - { kind: register, text: "Слово нейтральное и слегка официальное. Церковное: WSPÓLNOTA PARAFIALNA. Политическое: WSPÓLNOTA EUROPEJSKA, предшественница Евросоюза. Жилищное: ZARZĄD WSPÓLNOTY, «правление товарищества»." }
