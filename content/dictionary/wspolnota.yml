etymology: "От WSPÓLNY «общий»: W- + SPÓŁ- «вместе», тот же элемент, что в SPÓŁKA «компания». WSPÓLNOTA — буквально «то, что у людей вместе». Суффикс -OTA, как в DOBROTA «доброта»."
memory: "Wspólnota — сообщество, община: wspólny «общий». Читается «фспульно́та». Wspólnota mieszkaniowa — ТСЖ. We wspólnocie — с «we»."
