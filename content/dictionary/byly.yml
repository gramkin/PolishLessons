# review
id: byly
format: 2
lemma: "były"
rank: 1478
pos: adj
pron: { cyr: "бы́уы" }
senses:
  - id: former
    ru: "бывший (о должности, роли, отношениях)"
    examples:
      - pl: "Tom ma trzy byłe żony."
        ru: "У Тома три бывшие жены."
        source: { kind: translated, id: 4829982 }
      - pl: "Pewnego dnia spotkałem w mieście byłego sąsiada."
        ru: "Однажды я встретил в городе бывшего соседа."
        source: { kind: translated, id: 1603601 }
      - pl: "Tom jest byłym studentem Marii."
        ru: "Том — бывший студент Марии."
        source: { kind: translated, id: 8949297 }
  - id: ex-partner
    ru: "бывший, бывшая (как существительное — о партнёре)"
    note: "Очень живое разговорное употребление: mój były «мой бывший», moja była «моя бывшая»."
    examples:
      - pl: "Tom jest jej byłym."
        ru: "Том - её бывший."
        source: { kind: tatoeba, id: 13784400 }
      - pl: "Mary jest moją byłą dziewczyną."
        ru: "Мэри - моя бывшая девушка."
        source: { kind: tatoeba, id: 4716976 }
      - pl: "Ona tęskni za swoim byłym."
        ru: "Она скучает по своему бывшему."
        source: { kind: translated, id: 11350251 }
notes:
  - { kind: usage, text: "Осторожно: był, była, było, byli, były — это ещё и формы прошедшего времени глагола być. Drzwi były otwarte значит «Дверь была открыта» (глагол), а byłe żony — «бывшие жёны» (прилагательное). Различает только позиция при существительном." }
  - { kind: usage, text: "Степеней сравнения нет — это относительное прилагательное: «более бывший» сказать нельзя." }
  - { kind: usage, text: "В разговорной речи субстантивируется: mój były «мой бывший», moja była «моя бывшая», zszedł się ze swoją byłą «сошёлся со своей бывшей»." }
  - { kind: usage, text: "Перед должностью ставится прямо: były prezydent «бывший президент», były mąż «бывший муж», byli klienci «бывшие клиенты»." }
collocations:
  - { pl: "były mąż", ru: "бывший муж" }
  - { pl: "była żona", ru: "бывшая жена" }
  - { pl: "były prezydent", ru: "бывший президент" }
  - { pl: "mój były", ru: "мой бывший" }
family:
  - { pl: "być", ru: "быть", relation: derived, id: byc }
  - { pl: "byt", ru: "бытие, существование", relation: derived }
  - { pl: "dawny", ru: "прежний, давний", relation: derived }
etymology: "Причастие прошедшего времени глагола być «быть», застывшее как прилагательное: «тот, который был». Русское «бывший» образовано ровно так же — от «быть»."
memory: "były — «бывший»: były mąż, była żona, byli klienci. Главная трудность не в значении, а в омонимии: był, była, było, byli, były — это ещё и прошедшее время глагола być. Drzwi były otwarte — «Дверь была открыта» (глагол), byłe żony — «бывшие жёны» (прилагательное); различает позиция при существительном. Степеней сравнения нет. В разговоре слово легко становится существительным: mój były «мой бывший», moja była «моя бывшая»."
idioms:
  - { pl: "były mąż", ru: "бывший муж" }
  - { pl: "mój były", ru: "мой бывший" }
  - { pl: "w byłym ZSRR", ru: "в бывшем СССР" }
