notes:
  - { kind: false-friend, text: "ZARĘCZYNY — «помолвка», и только во множественном числе. Корень — RĘKA «рука»: жених и невеста «соединяют руки», ZARĘCZAJĄ SIĘ. А «жених» и «невеста» до свадьбы — NARZECZONY и NARZECZONA, слова другого корня, от старого «нарекать». Жениха на самой свадьбе называют PAN MŁODY." }
  - { kind: usage, text: "Пять форм, только множественное число, как DRZWI или URODZINY. Глагол при нём тоже во множественном: ZARĘCZYNY BYŁY UDANE. Родительный — ZARĘCZYN, без окончания." }
  - { kind: government, text: "На помолвку — NA ZARĘCZYNY, NA с винительным. На помолвке — NA ZARĘCZYNACH, местный. После помолвки — PO ZARĘCZYNACH, местный. Годовщина помолвки — ROCZNICA ZARĘCZYN, родительный." }
  - { kind: pronunciation, text: "Читается «зарэнчы́ны», четыре слога, ударение на третьем. Ę перед CZ звучит как «эн», как в RĘKA «рэ́нка». CZY — «чы»." }
collocations:
  - { pl: "ogłosić zaręczyny", ru: "объявить о помолвке" }
  - { pl: "przyjęcie zaręczynowe", ru: "вечеринка в честь помолвки" }
  - { pl: "rocznica zaręczyn", ru: "годовщина помолвки" }
family:
  - { pl: "ręka", ru: "рука", relation: root, id: reka }
  - { pl: "zaręczyć", ru: "обручиться (zaręczyć się)", relation: derived }
  - { pl: "zareczynowy", ru: "помолвочный", relation: derived }
etymology: "От ZARĘCZYĆ SIĘ «обручиться», буквально «соединить руки», от RĘKA «рука». Русское «обручиться» устроено так же: «об-руч-», от «рука». Так польские ZARĘCZYNY стоят ближе к русскому «обручению», чем к «помолвке»."
memory: "Zaręczyny — помолвка, только во множественном: zaręczyny były udane. Читается «зарэнчы́ны». От ręka — как русское «обручиться». Жених и невеста до свадьбы — narzeczony i narzeczona."
idioms:
