# review
id: stawic
format: 2
lemma: "stawić"
rank: 2053
pos: verb
aspect: perf
aspectPair: stawiac
pron: { cyr: "ста́виць" }
senses:
  - id: face
    ru: "встретить лицом к лицу (stawić czoła)"
    examples:
      - pl: "Musisz stawić czoła rzeczywistości."
        ru: "Ты должен взглянуть в лицо реальности."
        source: { kind: translated, id: 3782686 }
      - pl: "Był gotów stawić czoła losowi."
        ru: "Он был готов взглянуть в лицо судьбе."
        source: { kind: translated, id: 365389 }
      - pl: "Stawił czoła losowi i wygrał."
        ru: "Он взглянул в лицо судьбе и победил."
        source: { kind: translated, id: 960946 }
  - id: appear
    ru: "явиться (stawić się)"
    examples:
      - pl: "Trzeba się stawić osobiście."
        ru: "Нужно явиться лично."
        source: { kind: translated, id: 493160 }
  - id: resist
    ru: "оказать (сопротивление)"
    examples:
      - pl: "Stawili opór najeźdźcy."
        ru: "Они оказали сопротивление захватчику."
        source: { kind: translated, id: 355927 }
notes:
  - { kind: usage, text: "Глагол живёт почти только в устойчивых оборотах: stawić czoła «взглянуть в лицо, противостоять», stawić opór «оказать сопротивление», stawić się «явиться»." }
  - { kind: government, text: "stawić czoła czemuś — дательный падеж: stawić czoła losowi «взглянуть в лицо судьбе»." }
  - { kind: false-friend, text: "Форма повелительного наклонения staw совпадает с существительным staw «пруд; сустав» — это разные слова, и в корпусе staw чаще всего именно «пруд»." }
  - { kind: usage, text: "Несовершенный вид — stawiać, у которого значение шире: «ставить»." }
collocations:
  - { pl: "stawić czoła", ru: "взглянуть в лицо" }
  - { pl: "stawić opór", ru: "оказать сопротивление" }
  - { pl: "stawić się", ru: "явиться" }
etymology: "От stawić, к stać «стоять»; ср. русское «ставить», «поставить»."
memory: "stawić живёт в оборотах: stawić czoła «взглянуть в лицо», stawić opór «оказать сопротивление», stawić się «явиться». Осторожно: staw — это ещё и «пруд», и «сустав»."
idioms:
