# review
id: mucha
format: 2
lemma: "mucha"
rank: 2173
pos: noun
pron: { cyr: "му́ха" }
senses:
  - id: fly
    ru: "муха"
    examples:
      - pl: "W kawie jest mucha."
        ru: "В кофе муха."
        source: { kind: tatoeba, id: 12721006 }
      - pl: "Kelner, w mojej zupie pływa mucha!"
        ru: "Официант, в моём супе плавает муха!"
        source: { kind: tatoeba, id: 2277691 }
      - pl: "Na ścianie siedziała ogromna mucha."
        ru: "На стене сидела огромная муха."
        source: { kind: tatoeba, id: 12478684 }
  - id: idioms
    ru: "в оборотах: robić z muchy słonia «делать из мухи слона»"
    examples:
      - pl: "A ty jak zwykle robisz z muchy słonia."
        ru: "А ты, как обычно, делаешь из мухи слона."
        source: { kind: tatoeba, id: 8617779 }
      - pl: "Ma muchy w nosie."
        ru: "Он не в духе."
        source: { kind: translated, id: 6406236 }
      - pl: "Nie skrzywdziłby muchy."
        ru: "Он и мухи не обидит."
        source: { kind: translated, id: 6328171 }
  - id: bow-tie
    ru: "бабочка (галстук)"
    examples:
      - pl: "Założył krawat zamiast muchy."
        ru: "Он надел галстук вместо бабочки."
        source: { kind: translated, id: 8617775 }
      - pl: "Dirk miał na swoim ślubie muchę."
        ru: "На свадьбе у Дирка была бабочка."
        source: { kind: translated, id: 14015956 }
      - pl: "Do smokingu pasuje mucha."
        ru: "К смокингу подходит бабочка."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Второе значение — «галстук-бабочка»: krawat «галстук», а mucha или muszka «бабочка»." }
  - { kind: usage, text: "Идиома robić z muchy słonia «делать из мухи слона» совпадает с русской дословно." }
  - { kind: usage, text: "Mieć muchy w nosie значит «быть не в духе», буквально «иметь мух в носу»." }
  - { kind: false-friend, text: "Форма musze в корпусе — это почти всегда muszę «я должен» без огонка, то есть глагол musieć, а не предложный падеж от mucha." }
collocations:
  - { pl: "robić z muchy słonia", ru: "делать из мухи слона" }
  - { pl: "mieć muchy w nosie", ru: "быть не в духе" }
  - { pl: "packa na muchy", ru: "мухобойка" }
etymology: "Праславянское *mucha — то же слово, что русская «муха». Отсюда же muszka «мушка, бабочка»."
memory: "mucha — «муха», а заодно «галстук-бабочка». Идиома robić z muchy słonia совпадает с русской дословно. Осторожно: форма musze в текстах обычно значит muszę «я должен»."
idioms:
  - { pl: "robić z muchy słonia", ru: "делать из мухи слона" }
  - { pl: "mieć muchy w nosie", ru: "быть не в духе" }
  - { pl: "nie skrzywdziłby muchy", ru: "и мухи не обидит" }
formExamplesSkip:
