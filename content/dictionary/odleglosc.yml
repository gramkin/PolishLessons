notes:
  - { kind: government, text: "РУССКИЙ ГОВОРИТ «НА РАССТОЯНИИ», ПОЛЬСКИЙ — W ODLEGŁOŚCI, С ПРЕДЛОГОМ W. Запомни оборот целиком: w odległości stu metrów od domu. Выбор предлога тут не выводится из логики, и na odległości будет ошибкой. Зато «на расстоянии» в смысле дистанционно — na odległość, с винительным." }
  - { kind: usage, text: "Шестая карточка класса на -ość, и формы ровно те же, что у wolność и całość: odległość, odległości разом на родительный, дательный и предложный, odległością. Корень — leg-, тот же, что в leżeć «лежать», так что odległy буквально «лежащий в стороне»." }
  - { kind: pronunciation, text: "Четыре слога, ударение на предпоследнем: od-le-GŁOŚĆ. Ł читается как краткое у, ść как мягкое щць: «одлэ́гуощць». Начальное od перед глухим оглушается до «от»." }
collocations:
  - { pl: "w odległości", ru: "на расстоянии" }
  - { pl: "na odległość", ru: "дистанционно, на расстоянии" }
  - { pl: "zachować odległość", ru: "соблюдать дистанцию" }
family:
  - { pl: "odległy", ru: "отдалённый", relation: root }
  - { pl: "leżeć", ru: "лежать", relation: root, id: lezec }
  - { pl: "bliskość", ru: "близость", relation: antonym }
etymology: "От odległy «отдалённый», от od- «от» и корня leg-, того же, что в leżeć «лежать» и русском «лежать», «залежь». Буквально «лежание в стороне». Суффикс -ość равен русскому -ость, как в wolność «вольность»."
memory: "odległość — «расстояние», и главное тут предлог: W odległości stu metrów, а не na. Шесть форм, как у всего класса на -ость. Корень leg- тот же, что в «лежать»: odległy — «лежащий в стороне»."
idioms:
