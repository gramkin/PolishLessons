# review
id: ruch
format: 2
lemma: "ruch"
rank: 592
pos: noun
pron: { cyr: "рух" }
senses:
  - id: traffic
    ru: "движение (уличное, транспортное)"
    note: "ruch uliczny «уличное движение», ruch prawostronny «правостороннее движение»."
    examples:
      - pl: "W USA jest ruch prawostronny."
        ru: "В США движение правостороннее."
        source: { kind: tatoeba, id: 982364 }
      - pl: "Nie lubię ruchu ulicznego."
        ru: "Я не люблю уличное движение."
        source: { kind: translated, id: 362940 }
      - pl: "W godzinach szczytu ruch jest ogromny."
        ru: "В час пик движение огромное."
        source: { kind: authored }
  - id: exercise
    ru: "движение как физическая активность"
    note: "więcej ruchu «больше двигаться», Ruch to zdrowie «Движение — это здоровье»."
    examples:
      - pl: "Lekarz zalecił mi więcej ruchu, częstsze przebywanie na świeżym powietrzu i zdrowe odżywianie."
        ru: "Врач порекомендовал мне больше двигаться, чаще бывать на свежем воздухе и правильно питаться."
        source: { kind: tatoeba, id: 13786634 }
      - pl: "Ruch to zdrowie."
        ru: "Движение — это здоровье."
        source: { kind: translated, id: 7891521 }
      - pl: "On leży bez ruchu."
        ru: "Он лежит без движения."
        source: { kind: translated, id: 7483561 }
  - id: move
    ru: "ход (в игре); движение (жест)"
    note: "Twój ruch «Твой ход»; ruchy magika «движения фокусника»."
    examples:
      - pl: "Twój ruch."
        ru: "Твой ход."
        source: { kind: translated, id: 550670 }
      - pl: "Wszyscy patrzyli na ruchy magika."
        ru: "Все смотрели на движения фокусника."
        source: { kind: translated, id: 355979 }
      - pl: "Nie wykonuj gwałtownych ruchów."
        ru: "Не делай резких движений."
        source: { kind: translated, id: 3743602 }
notes:
  - { kind: usage, text: "Слово покрывает сразу несколько русских: «движение» транспортное (ruch uliczny), физическую активность (więcej ruchu), ход в игре (Twój ruch) и общественное движение (ruch ekologiczny)." }
  - { kind: government, text: "bez ruchu «без движения» — с родительным: leżeć bez ruchu «лежать без движения»." }
  - { kind: usage, text: "Ruch to zdrowie — расхожая присказка «Движение — это здоровье»." }
  - { kind: usage, text: "Глагол — ruszać się «двигаться», ruszyć «тронуться»; прилагательное — ruchomy «подвижный»." }
collocations:
  - { pl: "ruch uliczny", ru: "уличное движение" }
  - { pl: "Twój ruch", ru: "твой ход" }
  - { pl: "bez ruchu", ru: "без движения" }
  - { pl: "więcej ruchu", ru: "больше движения" }
family:
  - { pl: "ruszać", ru: "двигать", relation: root }
  - { pl: "ruchomy", ru: "подвижный", relation: derived }
  - { pl: "poruszyć", ru: "сдвинуть", relation: derived }
etymology: "От праславянского *ruxъ «движение, суета» — то же слово, что русское «рух» в «рухнуть» и «переполох»; отсюда же ruszać «двигать»."
memory: "ruch — «движение», но покрывает оно сразу несколько русских слов: ruch uliczny «уличное движение», więcej ruchu «больше двигаться» (о здоровье), Twój ruch «твой ход» в игре и ruch ekologiczny «экологическое движение». Оборот bez ruchu «без движения» идёт с родительным. И запомните присказку: Ruch to zdrowie."
idioms:
  - { pl: "ruch uliczny", ru: "уличное движение" }
  - { pl: "Twój ruch", ru: "твой ход" }
  - { pl: "Ruch to zdrowie", ru: "Движение — это здоровье" }
