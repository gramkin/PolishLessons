etymology: "Из праславянского *slava, от корня *slu- «слышать» — того же, что в польском SŁUCHAĆ, SŁYNĄĆ и SŁYSZEĆ и в русских «слух», «слушать», «слыть». То есть слава есть буквально «то, что о тебе слышно», молва, и первоначальный смысл был нейтральным: не похвала, а известность, как и в современном польском. Русское «слава» сдвинулось в сторону хвалы и торжества, и поэтому для нейтральной известности русскому приходится брать другие слова. Польское CHWAŁA, занявшее освободившееся место, происходит от другого корня, *xvala, не родственного славе, и именно поэтому два польских слова не смешиваются. Любопытно, что корень *slu- дал и SŁOWO: слово и слава — об одном и том же, о том, что слышно."
memory: "Русская «слава» делится на два: sława — известность, молва о человеке, а chwała — хвала, слава воинская и божественная. Chwała Bogu, не «sława Bogu». Второе значение sława — сама знаменитость: on jest światową sławą. Читается «суа́ва», ł даёт «у». Корень *slu- «слышать»: слава есть то, что слышно, отсюда же słowo."
