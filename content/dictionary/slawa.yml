notes:
  - { kind: false-friend, text: "Русская «слава» покрывает два понятия, которые польский держит отдельно, и это главная трудность карточки. SŁAWA — это известность, широкая молва о человеке: ZDOBYĆ SŁAWĘ, ŚWIATOWA SŁAWA. А «слава» в смысле воинской или божественной хвалы — это CHWAŁA: CHWAŁA BOGU «слава Богу», POLEC W CHWALE «пасть со славой», NA CHWAŁĘ OJCZYZNY «во славу отечества». Сказать SŁAWA BOGU нельзя, это ошибка, которую поляк заметит сразу. Запомнить просто: SŁAWA есть то, что о тебе говорят, CHWAŁA есть то, что тебе воздают." }
  - { kind: pronunciation, text: "Читается «суа́ва», ударение на предпоследнем слоге. Буква Ł даёт «у», а не «л», поэтому слово звучит совсем не как русское «слава»: не «слава», а «суа́ва». Это та же ловушка, что в WYSIŁEK «выси́уэк» и POSŁAĆ «по́суаць», и слово удобно для её отработки, потому что русский аналог так знаком, что рука сама тянется прочитать Ł как Л. В дательном и местном падеже SŁAWIE буква W смягчается: «суа́ве»." }
  - { kind: usage, text: "Второе значение стоит отметить особо: SŁAWA может означать самого человека, знаменитость. ON JEST ŚWIATOWĄ SŁAWĄ значит «он мировое имя, мировой авторитет», и по-русски так не скажешь — нужно «знаменитость» или «светило». Во множественном числе SŁAWY значит именно знаменитостей. Устойчивые сочетания: OKRYĆ SIĘ SŁAWĄ «покрыться славой», ZŁA SŁAWA «дурная репутация», CIESZYĆ SIĘ SŁAWĄ «пользоваться известностью». Прилагательное SŁAWNY значит «знаменитый», а SŁYNNY — то же самое и частотнее." }
  - { kind: government, text: "Женский род на -A, склонение правильное. Винительный на -Ę: ZDOBYŁ SŁAWĘ. Чем прославился — предлог DZIĘKI с дательным или родительный без предлога: SŁAWA WIELKIEGO LEKARZA. Пользоваться известностью — CIESZYĆ SIĘ с творительным: CIESZY SIĘ SŁAWĄ. При отрицании винительный уходит в родительный: NIE ZDOBYŁ SŁAWY. В значении «знаменитость» слово остаётся женского рода независимо от пола человека: ON JEST ŚWIATOWĄ SŁAWĄ, с женским согласованием при мужчине." }
