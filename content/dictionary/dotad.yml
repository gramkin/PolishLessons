# review
id: dotad
format: 2
lemma: "dotąd"
rank: 2345
pos: adv
pron: { cyr: "до́тонт" }
senses:
  - id: until-now
    ru: "до сих пор"
    examples:
      - pl: "Dotąd nie dostaliśmy odpowiedzi."
        ru: "До сих пор мы не получили ответа."
        source: { kind: authored }
      - pl: "Dotąd wszystko szło gładko."
        ru: "До сих пор всё шло гладко."
        source: { kind: authored }
  - id: up-to-here
    ru: "досюда (о месте)"
    examples:
      - pl: "Woda sięgała dotąd."
        ru: "Вода доходила досюда."
        source: { kind: authored }
      - pl: "Przeczytaj dotąd i przerwij."
        ru: "Прочитай досюда и остановись."
        source: { kind: authored }
  - id: until
    ru: "dotąd..., dopóki... — до тех пор, пока"
    examples:
      - pl: "Nie wyjdziesz dotąd, dopóki nie zjesz."
        ru: "Ты не выйдешь до тех пор, пока не поешь."
        source: { kind: authored }
notes:
  - { kind: usage, text: "СЛОВО ВХОДИТ В ЗАКРЫТЫЙ РЯД НА -ĄD, И ЕГО СТОИТ ВЫУЧИТЬ ЦЕЛИКОМ. Stąd «отсюда», dotąd «досюда, до сих пор», odtąd «отныне, отсюда», potąd «по это место», zewsząd «отовсюду». Все они указывают на точку в пространстве или во времени и не изменяются. Русские соответствия разнородны, поэтому ряд запоминается только как ряд." }
  - { kind: false-friend, text: "Русское «доселе» того же устройства — до плюс указательная основа, — но давно ушло в книжный слог. Польское dotąd совершенно обиходно: dotąd nie wiem «до сих пор не знаю». Переводить его надо оборотом «до сих пор», а не архаизмом." }
  - { kind: pronunciation, text: "Два слога, ударение на первом: DO-tąd. Носовое ą перед d звучит как «он», конечное d оглушается до т: «до́тонт». Слово не изменяется." }
  - { kind: register, text: "Нейтрально во всех трёх значениях. Временное — самое частое. Пространственное требует жеста или контекста: показывают рукой и говорят dotąd. Парный оборот dotąd... dopóki... принадлежит скорее к письменной речи; в разговоре чаще просто dopóki nie." }
collocations:
  - { pl: "dotąd nie wiem", ru: "до сих пор не знаю" }
  - { pl: "od dawna dotąd", ru: "издавна и доныне" }
  - { pl: "dotąd i ani kroku dalej", ru: "досюда и ни шагу дальше" }
family:
  - { pl: "stąd", ru: "отсюда", relation: derived, id: stad }
  - { pl: "odtąd", ru: "отныне, отсюда", relation: derived, id: odtad }
  - { pl: "dopóki", ru: "пока", relation: derived, id: dopoki }
etymology: "Сращение предлога do «до» с древней указательной основой -tąd, той же, что в stąd и odtąd. Исходно эти слова указывали только на место, значение времени пришло позже — обычный путь для указательных наречий. Русское «доселе» построено так же, но из других частей."
memory: "dotąd — «до сих пор», а в пространстве «досюда». Входит в ряд, который стоит выучить разом: stąd «отсюда», odtąd «отныне», dotąd «досюда», zewsząd «отовсюду». Не изменяется."
idioms:
  - { pl: "dotąd i ani kroku dalej", ru: "досюда и ни шагу дальше" }
  - { pl: "dotąd nie wiadomo", ru: "до сих пор неизвестно" }
formExamples:
