    pl: "Dotąd nie dostaliśmy odpowiedzi."
    ru: "До сих пор мы не получили ответа."
    source: { kind: authored }
  - form: "dotąd"
    pl: "Woda sięgała dotąd, pokazał na ścianie."
    ru: "Вода доходила досюда, показал он на стене."
    source: { kind: authored }
  - form: "dotąd"
    pl: "Nie wyjdziesz dotąd, dopóki nie zjesz."
    ru: "Ты не выйдешь до тех пор, пока не поешь."
    source: { kind: authored }
