# review
id: slyszec
format: 2
lemma: "słyszeć"
rank: 141
pos: verb
aspect: imperf
pron: { cyr: "слы́шэць" }
senses:
  - id: hear
    ru: "слышать (воспринимать слухом)"
    examples:
      - pl: "Słyszysz?"
        ru: "Слышишь?"
        source: { kind: tatoeba, id: 2406005 }
      - pl: "Słyszę coś."
        ru: "Я что-то слышу."
        source: { kind: tatoeba, id: 635807 }
      - pl: "Źle słyszę."
        ru: "Я плохо слышу."
        source: { kind: tatoeba, id: 2146070 }
  - id: hear-about
    ru: "слышать о чём-либо, знать понаслышке"
    examples:
      - pl: "Słyszałem."
        ru: "Я слышал."
        source: { kind: tatoeba, id: 4719256 }
      - pl: "Co słyszysz?"
        ru: "Что слышишь?"
        source: { kind: tatoeba, id: 8771187 }
      - pl: "Słyszałem o tym wypadku."
        ru: "Я слышал об этом происшествии."
        source: { kind: authored }
notes:
  - { kind: usage, text: "słyszeć — «слышать» (непроизвольно), słuchać — «слушать» (намеренно): Słyszę muzykę «Слышу музыку», но Słucham muzyki «Слушаю музыку»." }
  - { kind: government, text: "słyszeć управляет винительным падежом (słyszę muzykę), а słuchać — родительным (słucham muzyki). Это частая ошибка." }
  - { kind: usage, text: "ze słyszenia — «понаслышке»; Nie słyszę — «Мне не слышно»." }
collocations:
  - { pl: "słyszeć o kimś", ru: "слышать о ком-то" }
  - { pl: "ze słyszenia", ru: "понаслышке" }
  - { pl: "dobrze słyszeć", ru: "хорошо слышать" }
  - { pl: "nic nie słyszę", ru: "я ничего не слышу" }
etymology: "Праславянское *slyšati от того же корня, что słuch и русское «слышать»; родственно słowo и sława."
memory: "Пара как в русском: słyszeć «слышать» (непроизвольно) — słuchać «слушать» (намеренно). Но падежи разные: słyszę muzykę (винительный), słucham muzyki (родительный)."
idioms:
  - { pl: "ze słyszenia", ru: "понаслышке" }
  - { pl: "nie chcę o tym słyszeć", ru: "слышать об этом не хочу" }
  - { pl: "ludzie piszą, jak słyszą", ru: "люди пишут, как слышат" }
