notes:
  - { kind: usage, text: "Родительный единственного имеет две формы, и обе нормативны: PATROLU и PATROLA. Словари предпочитают PATROLU, когда речь о дежурстве, то есть о действии, и допускают PATROLA, когда речь о группе людей — но различение это нестрогое, и безопаснее всегда говорить PATROLU. Такой же выбор уже встречался в карточке TORT, с формами TORTU и TORTA, и правило там то же: нормативная форма короче и надёжнее. Устойчивые сочетания: PATROL POLICYJNY, PATROL DROGOWY «дорожный патруль», BYĆ NA PATROLU." }
  - { kind: pronunciation, text: "Читается «па́троль», ударение на первом слоге из двух. Конечное L мягкое, как всегда в польском, поэтому слово звучит «патроль», а не «патрол» — и это отличает его от русского «патруль», где мягкость даёт отдельный знак. Гласная A в первом слоге открытая и не редуцируется. В местном падеже PATROLU ударение остаётся на первом слоге: «па́тролю»." }
  - { kind: false-friend, text: "Русское «патруль» и польское PATROL значат одно и то же, но различаются гласной во втором слоге: по-русски «патрУль», по-польски PATROL. Причина в пути заимствования: польский взял слово из французского PATROUILLE через немецкое PATROULLE с сохранением O, а русский получил форму с У. Поэтому на письме слова почти совпадают, а на слух расходятся, и русскоязычный склонен сказать PATRUL, чего в польском нет. Проговорить стоит пару: русское «патруль» и польское «па́троль»." }
  - { kind: government, text: "Мужской род, неодушевлённое. Винительный равен именительному: WYSŁALI PATROL. Нахождение на дежурстве — предлог NA с местным: NA PATROLU «в патруле, на дежурстве». Возвращение — Z с родительным: Z PATROLU. Состав группы вводится предлогом W с местным: W PATROLU BYŁO DWÓCH FUNKCJONARIUSZY. При отрицании винительный уходит в родительный: NIE WYSŁALI PATROLU." }
