etymology: "Из французского PATROUILLE, от старофранцузского PATOUILLER «шлёпать по грязи, топтаться», от PATTE «лапа». То есть исходный образ совсем не торжественный: патруль есть те, кто месит грязь, обходя посты. Слово попало в польский через немецкое военное посредство в семнадцатом веке, вместе с другими терминами наёмного строя, и сохранило французское O. Русский «патруль» пришёл позже и иным путём, с гласной У. Французское происхождение у слова общее для обоих языков, и это главное, что стоит помнить."
memory: "По-польски «па́троль» с О и с мягким конечным l, а не «патруль»: разные пути заимствования из французского patrouille. Родительный двойной: patrolu (нормативно) и patrola, как tortu и torta. На дежурстве — na patrolu с местным, с дежурства — z patrolu. Исходный образ французский и невоенный: те, кто месит грязь, обходя посты."
