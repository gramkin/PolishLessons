notes:
  - { kind: false-friend, text: "GWIAZDKA — «звёздочка», но с прописной GWIAZDKA — Рождество и подарок к нему: NA GWIAZDKĘ, «на Рождество». В сочельник ужин начинают, когда на небе покажется первая звезда. GWIAZDKA FILMOWA — молодая «звёздочка» кино." }
  - { kind: usage, text: "Девять живых форм, женский род. Перед E K переходит в C: NA GWIAZDCE. Родительный множественного — GWIAZDEK. Звательный не даётся." }
  - { kind: government, text: "Подарок на Рождество — PREZENT NA GWIAZDKĘ, NA с винительным. Отель «пять звёзд» — HOTEL PIĘCIOGWIAZDKOWY." }
  - { kind: pronunciation, text: "Читается «гвя́здка», ударение на первом слоге. GW — «гв», WIA — «вя»." }
collocations:
  - { pl: "pierwsza gwiazdka", ru: "первая звезда (в сочельник)" }
  - { pl: "prezent na Gwiazdkę", ru: "подарок на Рождество" }
  - { pl: "gwiazdka filmowa", ru: "восходящая звезда кино" }
family:
  - { pl: "gwiazda", ru: "звезда", relation: root, id: gwiazda }
  - { pl: "gwiaździsty", ru: "звёздный", relation: derived }
  - { pl: "gwiazdor", ru: "звезда (о человеке)", relation: root }
etymology: "Уменьшительное от GWIAZDA «звезда». Польское GW на месте русского «зв»: GWIAZDA — «звезда». Значение «Рождество» — от первой звезды в сочельник."
memory: "Gwiazdka — звёздочка и Рождество: na Gwiazdkę — на Рождество. Читается «гвя́здка». Gwiazda — звезда (gw = зв)."
idioms:
