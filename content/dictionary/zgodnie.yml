# review
id: zgodnie
format: 2
lemma: "zgodnie"
rank: 1389
pos: adv
pron: { cyr: "зго́дне" }
senses:
  - id: according-to
    ru: "согласно чему-либо, в соответствии с чем-либо"
    examples:
      - pl: "Należy wówczas postępować zgodnie z zaleceniami lekarza."
        ru: "В этом случае следуйте указаниям врача."
        source: { kind: tatoeba, id: 1759004 }
      - pl: "Wszystko szło zgodnie z planem."
        ru: "Всё шло согласно плану."
        source: { kind: translated, id: 589872 }
      - pl: "Postępuję zgodnie z poleceniami."
        ru: "Я действую согласно распоряжениям."
        source: { kind: translated, id: 4735424 }
  - id: harmoniously
    ru: "дружно, в согласии; единогласно"
    examples:
      - pl: "Zwierzęta działają zgodnie z instynktem."
        ru: "Животные действуют согласно инстинкту."
        source: { kind: translated, id: 527638 }
      - pl: "Żyją zgodnie od lat."
        ru: "Они много лет живут в согласии."
        source: { kind: authored }
notes:
  - { kind: government, text: "zgodnie z czymś — «согласно чему-либо», с творительным падежом и предлогом z: zgodnie z planem, zgodnie z prawem. Русское «согласно» требует дательного без предлога, поэтому это частая ошибка." }
  - { kind: usage, text: "Второе значение — «дружно, в согласии»: Żyją zgodnie «Они живут дружно»." }
  - { kind: usage, text: "Третье — «единогласно»: Zgodnie uznali, że projekt jest dobry." }
  - { kind: usage, text: "Наречие от прилагательного zgodny «согласный, соответствующий»; существительное — zgoda «согласие»." }
collocations:
  - { pl: "zgodnie z planem", ru: "согласно плану" }
  - { pl: "zgodnie z prawem", ru: "в соответствии с законом" }
  - { pl: "żyć zgodnie", ru: "жить в согласии" }
etymology: "От zgoda «согласие», а то — от godzić «мирить, улаживать»; русские «угодить» и «годиться» того же корня."
memory: "zgodnie z czymś — «согласно чему-либо», и главное тут падеж: по-русски «согласно плану» (дательный), по-польски zgodnie z planem (творительный с предлогом z). Второе значение — «дружно»: Żyją zgodnie."
idioms:
  - { pl: "zgodnie z planem", ru: "согласно плану" }
  - { pl: "zgodnie z prawem", ru: "в соответствии с законом" }
  - { pl: "żyć zgodnie", ru: "жить в согласии" }
formExamplesSkip:
