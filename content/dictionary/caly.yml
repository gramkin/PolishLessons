formExamples:
  - form: "cali"
    pl: "Wrócili z gór cali i zdrowi."
    ru: "Они вернулись с гор целыми и невредимыми."
    source: { kind: authored }
  - form: "cali"
    pl: "Wszyscy pasażerowie są cali."
    ru: "Все пассажиры целы."
    source: { kind: authored }
  - form: "cali"
    pl: "Cali i zdrowi stanęli w drzwiach."
    ru: "Целые и невредимые, они встали в дверях."
    source: { kind: authored }
  - form: "cała"
    pl: "Wilk syty i owca cała."
    ru: "Охраняемую овцу и волк опасается."
    source: { kind: tatoeba, id: 3520418 }
  - form: "cała"
    pl: "Była piękniejsza niż cała reszta."
    ru: "Она была красивее, чем все другие."
    source: { kind: tatoeba, id: 1473509 }
  - form: "cała"
    pl: "Cała jego rodzina została rozstrzelana przez Niemców."
    ru: "Всю его семью расстреляли немцы."
    source: { kind: tatoeba, id: 3599503 }
  - form: "całą"
    pl: "Płakała całą noc."
    ru: "Она рыдала всю ночь."
    source: { kind: tatoeba, id: 352530 }
  - form: "całą"
    pl: "Całą noc padał śnieg."
    ru: "Всю ночь шёл снег."
    source: { kind: tatoeba, id: 531623 }
  - form: "całą"
    pl: "Psy szczekały całą noc."
    ru: "Собаки лаяли всю ночь."
    source: { kind: tatoeba, id: 10698013 }
  - form: "całe"
    pl: "Boli mnie całe ciało."
    ru: "У меня болит всё тело."
    source: { kind: tatoeba, id: 1188563 }
  - form: "całe"
    pl: "Całe miasto było w ogniu."
    ru: "Весь город был в огне."
    source: { kind: tatoeba, id: 2164558 }
  - form: "całe"
    pl: "Całe miasto pokryte było żółtym pyłem."
    ru: "Весь город был покрыт жёлтой пылью."
    source: { kind: tatoeba, id: 8666083 }
  - form: "całego"
    pl: "Zabawmy się na całego."
    ru: "Погуляем на всю катушку."
    source: { kind: translated, id: 367609 }
  - form: "całego"
    pl: "Dziękuję z całego serca."
    ru: "Благодарю от всего сердца."
    source: { kind: translated, id: 933113 }
  - form: "całego"
    pl: "Bawiliśmy się na całego."
    ru: "Мы веселились на всю катушку."
    source: { kind: translated, id: 12076173 }
  - form: "całej"
    pl: "Szukam mapy nie Polski, a całej Europy."
    ru: "Я ищу карту не Польши, а всей Европы."
    source: { kind: tatoeba, id: 4790288 }
  - form: "całej"
    pl: "Dlaczego ludzie opuścili Afrykę i zaczęli rozprzestrzeniać się po całej planecie?"
    ru: "Почему человек покинул Африку и начал расселяться по планете?"
    source: { kind: tatoeba, id: 13014661 }
  - form: "całej"
    pl: "Mary była jedną z najpiękniejszych dziewczyn w całej szkole. Ale mimo tego nigdy nie miała chłopaka."
    ru: "Мэри — одна из самых красивых девчонок во всей школе. Но несмотря на это, у неё никогда не было парня."
    source: { kind: tatoeba, id: 4719310 }
  - form: "całemu"
    pl: "Tomek chciał wykrzyczeć całemu światu, że kocha się w Marii."
    ru: "Томек хотел прокричать всему миру, что влюблён в Марию."
    source: { kind: translated, id: 3656241 }
  - form: "całemu"
    pl: "Dzięki całemu zespołowi projekt się udał."
    ru: "Благодаря всей команде проект удался."
    source: { kind: authored }
  - form: "całemu"
    pl: "Przyglądam się całemu temu zamieszaniu."
    ru: "Я смотрю на всю эту суматоху."
    source: { kind: authored }
  - form: "cały"
    pl: "Śnieg padał cały dzień."
    ru: "Снег шёл весь день."
    source: { kind: tatoeba, id: 675373 }
  - form: "cały"
    pl: "Cały tydzień pracowałem."
    ru: "Я всю неделю работал."
    source: { kind: tatoeba, id: 12950803 }
  - form: "cały"
    pl: "Mam cały dom dla siebie."
    ru: "Дом принадлежит мне одному."
    source: { kind: tatoeba, id: 1165159 }
  - form: "całych"
    pl: "Biegł z całych sił."
    ru: "Он бежал во всю прыть."
    source: { kind: tatoeba, id: 661292 }
  - form: "całych"
    pl: "Starała się z całych sił, ale nie udało się/, ale na próżno."
    ru: "Она старалась изо всех сил, и у неё не получилось."
    source: { kind: tatoeba, id: 1355023 }
  - form: "całych"
    pl: "Gnał z całych sił."
    ru: "Он мчался изо всех сил."
    source: { kind: translated, id: 416249 }
  - form: "całym"
    pl: "Miał ochotę podzielić się swoim żalem z całym światem."
    ru: "Ему хотелось поделиться своим горем со всем миром."
    source: { kind: tatoeba, id: 12624949 }
  - form: "całym"
    pl: "Miał ochotę podzielić się swoim smutkiem z całym światem."
    ru: "Ему хотелось поделиться своим горем со всем миром."
    source: { kind: tatoeba, id: 12624951 }
  - form: "całym"
    pl: "Miał ochotę podzielić się swoją radością z całym światem."
    ru: "Ему хотелось поделиться своей радостью со всем миром."
    source: { kind: tatoeba, id: 12624954 }
  - form: "całymi"
    pl: "Całymi dniami płaczę."
    ru: "Я целыми днями плачу."
    source: { kind: translated, id: 12955969 }
  - form: "całymi"
    pl: "Tłumaczę całymi dniami."
    ru: "Я целыми днями перевожу."
    source: { kind: translated, id: 6305633 }
  - form: "całymi"
    pl: "Skóra odpada całymi płatami."
    ru: "Кожа сходит целыми лоскутами."
    source: { kind: translated, id: 3743858 }
