# review
id: caly
format: 2
lemma: "cały"
rank: 96
pos: adj
pron: { cyr: "ца́уы" }
senses:
  - id: whole
    ru: "целый, весь"
    examples:
      - pl: "Śnieg padał cały dzień."
        ru: "Снег шёл весь день."
        source: { kind: tatoeba, id: 675373 }
      - pl: "Boli mnie całe ciało."
        ru: "У меня болит всё тело."
        source: { kind: tatoeba, id: 1188563 }
      - pl: "Płakała całą noc."
        ru: "Она рыдала всю ночь."
        source: { kind: tatoeba, id: 352530 }
  - id: intact
    ru: "целый, невредимый"
    examples:
      - pl: "Wilk syty i owca cała."
        ru: "Охраняемую овцу и волк опасается."
        source: { kind: tatoeba, id: 3520418 }
      - pl: "Szukam mapy nie Polski, a całej Europy."
        ru: "Я ищу карту не Польши, а всей Европы."
        source: { kind: tatoeba, id: 4790288 }
notes:
  - { kind: usage, text: "Русское «весь» в значении «целиком» — это cały: cały dzień «весь день», całe miasto «весь город». Книжное wszystek в единственном числе почти не употребляется." }
  - { kind: usage, text: "Степеней сравнения у cały нет: нельзя сказать «calszy»." }
collocations:
  - { pl: "cały dzień", ru: "весь день" }
  - { pl: "całe szczęście", ru: "к счастью" }
  - { pl: "z całych sił", ru: "изо всех сил" }
etymology: "Праславянское *cělъ «целый, невредимый» — то же слово, что русское «целый»; отсюда же «исцелить»."
memory: "cały покрывает оба русских значения: «целый» и «весь». Именно оно переводит «весь день» — cały dzień, а книжное wszystek в единственном числе почти мертво. Степеней сравнения у слова нет."
idioms:
  - { pl: "całe szczęście", ru: "к счастью" }
  - { pl: "cały i zdrowy", ru: "цел и невредим" }
  - { pl: "na całej linii", ru: "по всем статьям" }
  - { pl: "szukać dziury w całym", ru: "придираться" }
