notes:
  - { kind: government, text: "В первом значении дополнение в винительном: ZALICZYĆ EGZAMIN, ZALICZYĆ KURS, ZALICZYĆ ĆWICZENIA. Можно и с дательным лица: ZALICZYLI MI NIEOBECNOŚĆ «мне засчитали пропуск». Во втором значении работает схема ZALICZYĆ KOGOŚ DO CZEGOŚ — предлог DO с родительным: ZALICZYŁ GO DO SWOICH PRZYJACIÓŁ. Русский здесь берёт «к» с дательным, «причислил к своим друзьям», и эта замена повторяется во многих польских глаголах приближения и отнесения. Запоминать удобнее парой: русское «к» плюс дательный отвечает польскому DO плюс родительный." }
  - { kind: false-friend, text: "Существительное ZALICZENIE — это ровно русский «зачёт» в университетском смысле: форма проверки без оценки, которую надо получить, чтобы попасть на экзамен. BEZ ZALICZENIA NIE PODEJDZIESZ DO EGZAMINU звучит знакомо любому, кто учился. Но сам глагол шире русского «зачесть»: ZALICZYĆ EGZAMIN значит «сдать экзамен», а не «зачесть» его, и говорится о студенте, а не о преподавателе. Если засчитывает преподаватель, по-русски это «зачесть», и польский тут не меняет глагола." }
  - { kind: usage, text: "Корень тот же, что в LICZYĆ «считать», и приставка ZA- даёт значение «внести в счёт, принять в зачёт». Несовершенный партнёр — ZALICZAĆ. В разговорной речи глагол оброс переносными значениями, иногда шутливыми: ZALICZYĆ WPADKĘ «сесть в лужу», ZALICZYĆ GLEBĘ «растянуться на земле», ZALICZYĆ SPÓŹNIENIE «заработать опоздание». Общая мысль одна — «записать себе в список», пусть и не всегда к чести. Пятьдесят три формы — подпись переходного глагола совершенного вида." }
  - { kind: pronunciation, text: "Читается «зали́чычь», три слога, ударение на предпоследнем. Сочетание CZ даёт твёрдое «ч», а следующая за ним Y — звук «ы», поэтому конец слова звучит как «чычь», с твёрдым и сразу мягким «ч». Та же трудность встречалась в POLICZYĆ. В причастии ZALICZONY буква C перед O читается как «ц»: «залицо́ны». В формах прошедшего времени Ł звучит как «у»: ZALICZYŁEM это «зали́чыуэм»." }
  - { kind: register, text: "Слово нейтральное, но прочно связано с учёбой и бухгалтерией. Студенческие обороты: ZALICZYĆ SESJĘ «сдать сессию», ZALICZENIE Z ĆWICZEŃ «зачёт по практическим», ZALICZYĆ PRZEDMIOT «сдать предмет». В бухгалтерии ZALICZYĆ WPŁATĘ значит «засчитать платёж», а ZALICZKA — это «аванс», слово очень ходовое и стоит отдельного внимания. Переносные разговорные употребления вроде ZALICZYĆ GLEBĘ принадлежат молодёжной речи и в письменном тексте неуместны." }
collocations:
  - { pl: "zaliczyć egzamin", ru: "сдать экзамен" }
  - { pl: "zaliczenie z ćwiczeń", ru: "зачёт по практическим занятиям" }
