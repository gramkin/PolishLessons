  - { pl: "zaliczać", ru: "засчитывать", relation: aspect }
  - { pl: "zaliczenie", ru: "зачёт", relation: derived }
etymology: "Приставка ZA- плюс LICZYĆ, от того же праславянского корня *lik-, что и в POLICZYĆ. Корень означал счёт и число, и русский сохранил его вокруг этой идеи: «наличие», «количество», «перекличка», «отличаться». Приставка ZA- здесь работает как в русском «записать, занести»: внести нечто в счёт, поставить в список выполненного. Отсюда и ZALICZENIE «зачёт» — буквально внесение в счёт, и ZALICZKA «аванс» — часть, внесённая вперёд. Русское «зачесть» и «зачёт» построены точно так же, только на корне «чет», и сравнение двух рядов показывает, что языки пришли к одному понятию разными корнями с одинаковой приставкой."
memory: "Корень тот же, что в policzyć: liczyć «считать», а приставка za- значит «внести в счёт». Отсюда zaliczenie — ровно университетский «зачёт», и zaliczka «аванс». Глагол шире русского «зачесть»: zaliczyć egzamin говорит студент, и значит это «сдать экзамен». Во втором значении запомнить схему zaliczyć kogoś do czegoś, где польское do с родительным отвечает русскому «к» с дательным."
idioms:
  - { pl: "zaliczyć wpadkę", ru: "сесть в лужу, опростоволоситься" }
