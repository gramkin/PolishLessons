notes:
  - { kind: usage, text: "СЛОВО ГОВОРИТСЯ ТОЛЬКО О МУЖЧИНЕ — И РУССКИЙ УСТРОЕН ТАК ЖЕ. Żonaty значит «женатый», от żona «жена»; о женщине так сказать нельзя, для неё есть zamężna, от za mąż «замуж». Это ровно русская пара «женат» / «замужем», и перенести её можно без поправок." }
  - { kind: government, text: "ПОЧЕМУ ЖЕ В ТАБЛИЦЕ ЕСТЬ ЖЕНСКИЕ ФОРМЫ. Żonata и żonate выглядят невозможными, раз слово только о мужчинах, но они живут в канцелярском языке: польское osoba «лицо» — женского рода, а множественное osoby — немужского, и прилагательное обязано согласоваться с грамматикой, а не со смыслом. Отсюда совершенно правильные osoba żonata «женатое лицо» и osoby żonate. Самый частый оборот именно такой: jest osobą żonatą." }
  - { kind: pronunciation, text: "Три слога, ударение на предпоследнем: żo-NA-ty. Ż читается как твёрдое ж: «жона́ты». Корень тот же, что в żona «жена» — «жо́на», с о, а не с е." }
  - { kind: register, text: "Нейтрально во всех регистрах, от анкеты до разговора. В канцелярском языке стоит рядом с zamężna, rozwiedziony, wdowiec; в разговорном часто заменяется оборотом ma żonę «у него жена»." }
collocations:
  - { pl: "jest żonaty", ru: "он женат" }
  - { pl: "osoba żonata", ru: "женатое лицо" }
  - { pl: "żonaty mężczyzna", ru: "женатый мужчина" }
family:
  - { pl: "żona", ru: "жена", relation: root, id: zona }
  - { pl: "ożenić się", ru: "жениться", relation: derived, id: ozenic }
  - { pl: "zamężna", ru: "замужняя", relation: antonym }
etymology: "От żona «жена», из праславянского *žena — того же слова, что русское «жена», и дальнего родственника греческого gyne «женщина». Суффикс -aty даёт значение «обладающий»: żonaty «имеющий жену», как brodaty «бородатый» или rogaty «рогатый». Отсюда ożenić się и żonkoś «женатик»."
memory: "żonaty — «женатый», и только о мужчине, от żona «жена»; женщина zamężna, от za mąż. Польская пара в точности повторяет русскую «женат / замужем». А суффикс -aty тот же, что в «бородатый»: żonaty буквально «женатый, обладающий женой»."
idioms:
