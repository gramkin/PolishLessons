etymology: "Приставка ZA- и глагол CHWYCIĆ «схватить», от CHWYT «хват, захват», из праславянского *chvatiti. Восхищение понято здесь как схватывание: то, что захватывает человека целиком. Русское «восхитить» собрано тем же способом из «вос-» и «хитить» — старого глагола со значением «хватать, похищать», который остался в «похитить», «хищник», «хищный». Поэтому польское ZACHWYT и русское «восхищение» это не просто переводы друг друга, а две независимые сборки одной метафоры из одного праславянского гнезда. Чередование O и E в причастии, ZACHWYCONY против ZACHWYCENI, то же, что у SPŁACONY и SPŁACENI: оно восходит к древнему различию твёрдого и мягкого окружения и охватывает целый класс глаголов."
memory: "Собрано как русское «восхитить»: za- плюс chwycić «схватить», ровно как «вос-» плюс «хитить» — то, что захватывает. Отсюда zachwyt «восхищение». Совершенный вид: zachwycę значит «восхищу»; процесс — zachwycać. Кого — винительный, чем — творительный; возвратное zachwycić się czymś «восхититься чем-то». В причастии o переходит в e: zachwycony, но zachwyceni, как spłacony и spłaceni. Zachwycony значит «восхищённый», а не «схваченный»."
