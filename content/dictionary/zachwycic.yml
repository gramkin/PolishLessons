notes:
  - { kind: government, text: "Совершенный вид, несовершенный — ZACHWYCAĆ. Поэтому ZACHWYCĘ, ZACHWYCISZ, ZACHWYCI это будущее время: «восхищу», а не «восхищаю». Кого восхищают — винительный без предлога: ZACHWYCIĆ PUBLICZNOŚĆ, ZACHWYCIĆ KOGOŚ. Чем — творительный: ZACHWYCIĆ GRĄ, ZACHWYCIĆ GŁOSEM. Возвратная форма ZACHWYCIĆ SIĘ значит «восхититься» и требует творительного: ZACHWYCIŁ SIĘ TYM WIDOKIEM. Страдательное причастие ведёт себя как у SPŁACIĆ: ZACHWYCONY в мужском роде единственного, но ZACHWYCENI в мужском лице множественного, с O, переходящим в E." }
  - { kind: false-friend, text: "Прямого созвучия с русским нет, зато есть точное совпадение образа, и оно помогает запомнить слово навсегда. ZACHWYCIĆ собрано из приставки ZA- и глагола CHWYCIĆ «схватить»: восхитить значит буквально «захватить». Русское «восхитить» устроено так же — «вос-» плюс «хитить», старый глагол со значением «хватать, похищать», сохранившийся в «похитить» и «хищник». Так два языка независимо построили восторг на схватывании, и польское ZACHWYT отвечает русскому «восхищению» и по смыслу, и по способу сборки. Осторожнее с причастием: ZACHWYCONY значит «восхищённый», а не «схваченный» — для этого есть SCHWYTANY." }
  - { kind: pronunciation, text: "Читается «захвы́циць», ударение на предпоследнем слоге из трёх. Сочетание CHW даёт «хв», и буква CH здесь обычное «х», а не «ч». Гласная Y звучит «ы». Конечное -Ć мягкое, «ць». В страдательном причастии ZACHWYCONY слышно «захвыцо́ны», четыре слога, ударение на предпоследнем. В форме ZACHWYCENI — «захвыце́ни». В деепричастии ZACHWYCIWSZY сочетание WSZ оглушается: «захвыци́фшы»." }
  - { kind: usage, text: "Частотные сочетания: ZACHWYCIĆ PUBLICZNOŚĆ, ZACHWYCIĆ SIĘ CZYMŚ «восхититься чем-то», BYĆ ZACHWYCONYM «быть в восторге», ZACHWYT NAD CZYMŚ «восхищение чем-то». Причастие ZACHWYCONY употребляется чаще самого глагола и ведёт себя как обычное прилагательное: JESTEM ZACHWYCONY «я в восторге», и это одна из самых частых формул похвалы в польском. Отрицание NIEZACHWYCONY звучит иронически и означает сдержанное неодобрение. Существительное ZACHWYT уже есть в словаре, и с ним идёт оборот WPRAWIĆ W ZACHWYT «привести в восторг»." }
