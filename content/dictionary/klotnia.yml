# review
id: klotnia
format: 2
lemma: "kłótnia"
rank: 2644
pos: noun
pron: { cyr: "ку́тня" }
senses:
  - id: quarrel
    ru: "ссора, перебранка"
    examples:
      - pl: "Kłótnia wybuchła przy kolacji."
        ru: "Ссора вспыхнула за ужином."
        source: { kind: authored }
      - pl: "Po kłótni nie odzywali się tydzień."
        ru: "После ссоры они не разговаривали неделю."
        source: { kind: authored }
      - pl: "Kłótnie zdarzają się w każdej rodzinie."
        ru: "Ссоры случаются в каждой семье."
        source: { kind: authored }
  - id: dispute
    ru: "размолвка, конфликт"
    examples:
      - pl: "Kłótnie o pieniądze są najczęstsze."
        ru: "Ссоры из-за денег самые частые."
        source: { kind: authored }
      - pl: "Wdali się w kłótnię o drobiazg."
        ru: "Они ввязались в ссору из-за мелочи."
        source: { kind: authored }
notes:
  - { kind: pronunciation, text: "Родительный единственного и родительный множественного совпадают в одной короткой форме KŁÓTNI, с одним i. Так устроены исконные слова на -nia: pustynia — pustyni, kuchnia — kuchni. Заимствования на -ia пишут два i: tragedia — tragedii, historia — historii. Разница видна только на письме, но именно её чаще всего и путают." }
  - { kind: usage, text: "Слово описывает ссору между людьми, с повышенными голосами. Спокойный спор по существу — это DYSKUSJA или SPÓR, и подменять их нельзя: kłótnia звучит как упрёк. Глагол при нём возвратный — KŁÓCIĆ SIĘ z kimś o coś, с предлогом o на предмете раздора." }
collocations:
  - { pl: "kłótnia rodzinna", ru: "семейная ссора" }
  - { pl: "wdać się w kłótnię", ru: "ввязаться в ссору" }
  - { pl: "kłótnia o pieniądze", ru: "ссора из-за денег" }
family:
  - { pl: "kłócić się", ru: "ссориться", relation: root, id: klocic }
  - { pl: "kłótliwy", ru: "сварливый", relation: derived }
  - { pl: "zgoda", ru: "согласие", relation: antonym, id: zgoda }
etymology: "От глагола kłócić, у которого старое значение было «мутить, взбалтывать»: kłócić wodę — мутить воду. Ссора по этой логике есть взбаламученный покой, и образ совпадает с русским «мутить воду» и со словом «смута», выросшим из «смутить». Оба языка назвали раздор через помутнение прозрачного."
memory: "Родительный и единственного, и множественного — KŁÓTNI, с одним i, потому что слово исконное. У заимствованной tragedia было бы два: tragedii."
idioms:
