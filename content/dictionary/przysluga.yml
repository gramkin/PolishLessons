# review
id: przysluga
format: 2
lemma: "przysługa"
rank: 1190
pos: noun
pron: { cyr: "пшысуу́га" }
senses:
  - id: favour
    ru: "услуга, одолжение"
    examples:
      - pl: "Zrób mi przysługę."
        ru: "Сделай мне одолжение."
        source: { kind: translated, id: 8113675 }
      - pl: "Zrobiłem im przysługę."
        ru: "Я оказал им услугу."
        source: { kind: tatoeba, id: 13785420 }
      - pl: "On poprosił mnie o przysługę."
        ru: "Он попросил меня об одолжении."
        source: { kind: tatoeba, id: 3660785 }
  - id: need
    ru: "potrzebuję przysługi — мне нужно одолжение"
    examples:
      - pl: "Potrzebuję przysługi."
        ru: "Мне нужно одолжение."
        source: { kind: translated, id: 8113677 }
      - pl: "Zadzwoniłem do ciebie ponieważ potrzebuje przysługi."
        ru: "Я позвонил тебе, потому что мне нужно одолжение."
        source: { kind: translated, id: 8132112 }
  - id: owe
    ru: "być winnym przysługę — быть должным услугу"
    examples:
      - pl: "Jestem ci winien przysługę."
        ru: "Я должен тебе услугу."
        source: { kind: translated, id: 8113680 }
      - pl: "Zrobię ci przysługę."
        ru: "Я окажу тебе услугу."
        source: { kind: translated, id: 3787876 }
notes:
  - { kind: false-friend, text: "Различайте przysługa и usługa: przysługa — дружеское одолжение, бесплатное, а usługa — коммерческая услуга, за деньги. Русское «услуга» покрывает оба." }
  - { kind: government, text: "zrobić komuś przysługę «оказать кому-то услугу» — дательный падеж лица плюс винительный самой услуги." }
  - { kind: usage, text: "niedźwiedzia przysługa «медвежья услуга» — оборот совпадает с русским дословно." }
  - { kind: usage, text: "Женский род: ta przysługa, tej przysługi. В корпусе слово живёт почти только в винительном и родительном." }
collocations:
  - { pl: "zrobić przysługę", ru: "оказать услугу" }
  - { pl: "prosić o przysługę", ru: "просить об одолжении" }
  - { pl: "niedźwiedzia przysługa", ru: "медвежья услуга" }
family:
  - { pl: "przysługiwać", ru: "полагаться, причитаться", relation: derived }
  - { pl: "usługa", ru: "услуга (платная)", relation: derived }
etymology: "Приставка przy- плюс służyć «служить» — буквально «прислуга, услужение». Русская «услуга» собрана из того же «служить», только с другой приставкой."
memory: "przysługa — «услуга, одолжение», но именно дружеское и бесплатное. Платная услуга — это usługa. Оказывают её zrobić komuś przysługę, а niedźwiedzia przysługa значит «медвежья услуга»."
idioms:
  - { pl: "zrobić przysługę", ru: "оказать услугу" }
  - { pl: "niedźwiedzia przysługa", ru: "медвежья услуга" }
formExamplesSkip:
  - { form: "przysługo", reason: "звательный падеж у этого слова в живой речи не употребляется" }
