senses:
  - id: paradise
    ru: "рай (религ.)"
    examples:
      - pl: "Wierzył, że po śmierci trafi do raju."
        ru: "Он верил, что после смерти попадёт в рай."
        source: { kind: authored }
      - pl: "Adam i Ewa zostali wygnani z raju."
        ru: "Адама и Еву изгнали из рая."
        source: { kind: authored }
  - id: bliss
    ru: "рай, блаженное место"
    examples:
      - pl: "Ta wyspa to prawdziwy raj."
        ru: "Этот остров — настоящий рай."
        source: { kind: authored }
      - pl: "Dla wędkarzy to raj na ziemi."
        ru: "Для рыбаков это рай на земле."
        source: { kind: authored }
  - id: heaven-for
    ru: "раздолье, рай для кого-л."
    examples:
      - pl: "Miasto jest rajem dla rowerzystów."
        ru: "Город — рай для велосипедистов."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Редкий случай полного совпадения: raj и «рай» — одно слово, один корень, одно значение. Расходится только управление. По-польски говорят RAJ DLA kogoś с предлогом dla и родительным: raj dla dzieci, где русский чаще берёт дательный без предлога — «раздолье детям»." }
  - { kind: usage, text: "Предложный падеж — W RAJU, и он же служит родительным: wygnani z raju, mieszkać w raju. Прилагательное rajski значит «райский»: rajski ptak «райская птица», rajskie jabłuszko «райское яблочко», то есть мелкий декоративный сорт." }
  - { kind: pronunciation, text: "Один слог: рай. Звучит и пишется почти как по-русски, только конечное j произносится отчётливее. Множественное raje читается «рае», родительный rajów — «райув»." }
collocations:
  - { pl: "raj na ziemi", ru: "рай на земле" }
  - { pl: "rajski ptak", ru: "райская птица" }
  - { pl: "raj dla turystów", ru: "рай для туристов" }
family:
  - { pl: "rajski", ru: "райский", relation: derived }
  - { pl: "piekło", ru: "ад", relation: antonym, id: pieklo }
  - { pl: "niebo", ru: "небо; небеса", relation: root, id: niebo }
etymology: "Из праславянского *rajь, как русское «рай». Слово, вероятно, иранское по происхождению — от авестийского rāy- «богатство, блаженство», родственного санскритскому rayi-. Пришло к славянам задолго до христианства и уже потом приняло библейское значение."
memory: "raj — «рай», одно из тех слов, где польский и русский совпадают целиком. Запомни управление: raj DLA kogoś, с предлогом. И форму w raju — она же родительный: z raju."
idioms:
  - { pl: "raj na ziemi", ru: "рай на земле" }
  - { pl: "żyć jak w raju", ru: "жить как в раю" }
