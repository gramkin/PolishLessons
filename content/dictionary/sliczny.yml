# review
id: sliczny
format: 2
lemma: "śliczny"
rank: 1896
pos: adj
pron: { cyr: "сьли́чны" }
senses:
  - id: pretty
    ru: "прелестный, хорошенький, миловидный"
    examples:
      - pl: "Mary jest śliczna."
        ru: "Мэри прелестна."
        source: { kind: translated, id: 3603521 }
      - pl: "Jakie śliczne dziecko!"
        ru: "Какой прелестный ребёнок!"
        source: { kind: translated, id: 7891502 }
      - pl: "Masz śliczne oczy."
        ru: "У тебя прелестные глаза."
        source: { kind: translated, id: 587571 }
  - id: lovely
    ru: "чудесный, восхитительный (о вещи, погоде, дне)"
    examples:
      - pl: "To najśliczniejsza rzecz, jaką kiedykolwiek widziałem."
        ru: "Это самая прелестная вещь, какую я когда-либо видел."
        source: { kind: translated, id: 1349388 }
      - pl: "Mamy dziś śliczną pogodę."
        ru: "У нас сегодня чудесная погода."
        source: { kind: authored }
      - pl: "To był śliczny dzień."
        ru: "Это был чудесный день."
        source: { kind: authored }
notes:
  - { kind: usage, text: "śliczny сильнее, чем ładny «красивый»: это «прелестный, хорошенький», с оттенком умиления. Шкала идёт ładny → śliczny → przepiękny." }
  - { kind: usage, text: "Чаще всего слышится в восклицаниях: Ale śliczna! «Какая прелесть!», Jakie śliczne dziecko! «Какой прелестный ребёнок!»." }
  - { kind: usage, text: "Наречие ślicznie живёт в вежливом ślicznie dziękuję «большое спасибо» — оборот очень частый в разговорной речи." }
  - { kind: usage, text: "Синтетическое сравнение (śliczniejszy) правильно, но громоздко; в речи чаще усиливают: taki śliczny, jeszcze śliczniejszy." }
collocations:
  - { pl: "śliczna dziewczyna", ru: "прелестная девушка" }
  - { pl: "śliczne oczy", ru: "прелестные глаза" }
  - { pl: "ale śliczna!", ru: "какая прелесть!" }
  - { pl: "ślicznie dziękuję", ru: "большое спасибо" }
family:
  - { pl: "ślicznie", ru: "прелестно", relation: derived }
  - { pl: "śliczność", ru: "прелесть", relation: derived }
  - { pl: "oblicze", ru: "лик, облик", relation: derived }
etymology: "От праславянского *lice «лицо, облик» с усилительной приставкой (ś- из *sь-): буквально «пригожий лицом». Та же основа в oblicze «лик» и в русских «лицо», «личный»."
memory: "śliczny — это не просто ładny «красивый», а «прелестный, хорошенький», с умилением: śliczne dziecko, śliczne oczy. Шкала запоминается целиком: ładny → śliczny → przepiękny. В основе лежит lice «лицо» — то же слово, что русское «лицо», так что śliczny буквально «пригожий лицом». Чаще всего слово слышится в восклицаниях (Ale śliczna!) и в вежливом ślicznie dziękuję «большое спасибо»."
idioms:
  - { pl: "ale śliczna!", ru: "какая прелесть!" }
  - { pl: "śliczna jak obrazek", ru: "хорошенькая как картинка" }
  - { pl: "ślicznie dziękuję", ru: "большое спасибо" }
