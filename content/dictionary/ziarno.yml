etymology: "Праславянское слово, то же, что русское «зерно», и родственное латинскому GRANUM и английскому CORN. Значение за тысячу лет не сдвинулось ни в одном из языков, и переносный смысл крупицы развился в обоих одинаково. Польское ZIA- на месте русского ЗЕ- восходит к древнему чередованию, и та же пара видна в ZIEMIA и «земле», ZIELONY и «зелёном»."
memory: "То же слово, что русское «зерно», и даже переносные обороты те же: ziarno prawdy это «доля истины», oddzielić ziarno od plew это «отделить зёрна от плевел». Прячет родство только чтение: zia даёт «зя» в один приём, и слово звучит «зя́рно». Та же пара в ziemia и «земле». Два родительных множественного, ziaren с беглым e и ziarn без него, оба правильны."
idioms:
  - { pl: "oddzielić ziarno od plew", ru: "отделить зёрна от плевел" }
