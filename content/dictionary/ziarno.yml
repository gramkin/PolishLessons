notes:
  - { kind: false-friend, text: "Слово то же, что русское «зерно», и значения совпадают целиком, включая переносное. ZIARNO PRAWDY это «доля истины», а ODDZIELIĆ ZIARNO OD PLEW — «отделить зёрна от плевел», и оба оборота у нас есть в том же виде. Прячет родство только начало: сочетание ZIA даёт «зя», в один приём, поэтому слово звучит «зя́рно», а не «зиарно»." }
  - { kind: usage, text: "Десять форм, средний род. Любопытны два родительных множественного: ZIAREN, с беглым E, и ZIARN, без него. Оба правильны и оба в ходу, причём ZIAREN звучит чуть традиционнее. В местном падеже ZIARNIE, с обычным смягчением. Уменьшительные ZIARNKO и ZIARENKO значат «зёрнышко» и употребляются чаще самого слова, когда речь об одном зерне." }
  - { kind: government, text: "Отделить зерно от плевел — ODDZIELIĆ ZIARNO OD PLEW, предлог OD с родительным, как и по-русски. Доля истины в чём-либо — ZIARNO PRAWDY W CZYMŚ, предлог W с местным падежом. Сеять зерно — SIAĆ ZIARNO, винительный без предлога. Горсть зёрен — GARŚĆ ZIAREN, родительный множественного без предлога." }
  - { kind: pronunciation, text: "Читается «зя́рно», два слога, ударение на первом. Сочетание ZIA даёт «зя», то есть мягкое «з» и сразу «а», в один приём, а не в два: именно это и уводит слово от русского «зерна» на слух. В местном падеже ZIARNIE сочетание NIE даёт мягкое «не», и слышно «зя́рне». В родительном множественного ZIAREN беглое E звучит отчётливо." }
  - { kind: register, text: "Слово нейтральное и деревенское в прямом значении: ZIARNO PSZENICY, SIAĆ ZIARNO, SKUP ZIARNA. В кофейном деле оно тоже обиходно: ZIARNO KAWY, KAWA ZIARNISTA «кофе в зёрнах». Переносный пласт книжный и частый в публицистике: ZIARNO PRAWDY, ZIARNO NIEZGODY «семя раздора», ZIARNO WĄTPLIWOŚCI. Все три оборота есть и в русском." }
