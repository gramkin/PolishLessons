# review
id: bac
format: 2
lemma: "bać"
rank: 294
pos: verb
aspect: imperf
pron: { cyr: "бачь" }
senses:
  - id: fear
    ru: "бояться (кого-либо, чего-либо)"
    note: "Всегда с się и с родительным падежом, как в русском."
    examples:
      - pl: "Boję się psów."
        ru: "Я боюсь собак."
        source: { kind: tatoeba, id: 591364 }
      - pl: "Boisz się go."
        ru: "Ты боишься его."
        source: { kind: tatoeba, id: 2145931 }
      - pl: "Boję się Putina."
        ru: "Я боюсь Путина."
        source: { kind: tatoeba, id: 4998988 }
  - id: afraid-to
    ru: "бояться (что-либо сделать)"
    examples:
      - pl: "Boisz się?"
        ru: "Боишься?"
        source: { kind: tatoeba, id: 3657565 }
      - pl: "Boję się latać."
        ru: "Я боюсь летать."
        source: { kind: tatoeba, id: 5487324 }
      - pl: "Boisz się mnie?"
        ru: "Ты меня боишься?"
        source: { kind: tatoeba, id: 6328130 }
notes:
  - { kind: usage, text: "Глагол употребляется только с się: bać się. Формы без него не существует." }
  - { kind: usage, text: "Спряжение неправильное и его надо выучить: boję się, boisz się, boi się, boimy się, boicie się, boją się." }
  - { kind: usage, text: "Прошедшее время правильное: bałem się, bałam się, bał się, bali się. Повелительное — Nie bój się! «Не бойся!»" }
  - { kind: usage, text: "Управление родительным, как в русском: bać się psów «бояться собак», bać się ciemności «бояться темноты»." }
collocations:
  - { pl: "nie bój się", ru: "не бойся" }
  - { pl: "bać się ciemności", ru: "бояться темноты" }
  - { pl: "boję się", ru: "я боюсь" }
  - { pl: "bać się o kogoś", ru: "бояться за кого-то" }
etymology: "Праславянское *bojati sę — то же слово, что русское «бояться»."
memory: "bać się — «бояться», всегда с się. Спряжение неправильное: boję się, boisz się, boją się, а прошедшее — bałem się. Nie bój się! — «Не бойся!»."
idioms:
  - { pl: "nie bój się", ru: "не бойся" }
  - { pl: "bać się własnego cienia", ru: "бояться собственной тени" }
  - { pl: "bać się o kogoś", ru: "бояться за кого-то" }
