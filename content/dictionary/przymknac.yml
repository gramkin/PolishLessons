# review
id: przymknac
format: 2
lemma: "przymknąć"
rank: 5107
pos: verb
pron: { cyr: "пшы́мкнонць" }
senses:
  - id: half-close
    ru: "прикрыть (дверь, окно, глаза)"
    examples:
      - pl: "Przymknął oczy ze zmęczenia."
        ru: "Он прикрыл глаза от усталости."
        source: { kind: authored }
      - pl: "Przymknij okno, jest zimno."
        ru: "Прикрой окно, холодно."
        source: { kind: authored }
      - pl: "Przymknął drzwi za sobą."
        ru: "Он прикрыл за собой дверь."
        source: { kind: authored }
  - id: arrest
    ru: "разг. посадить, упечь (за решётку)"
    examples:
      - pl: "Policja przymknęła całą szajkę."
        ru: "Полиция пересажала всю шайку."
        source: { kind: authored }
      - pl: "Przymknęli go za jazdę po pijanemu."
        ru: "Его посадили за езду в пьяном виде."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "PRZYMKNĄĆ — «прикрыть», а не «примкнуть». Русское «примкнуть к кому-то» — PRZYŁĄCZYĆ SIĘ. Закрыть полностью — ZAMKNĄĆ. PRZYMKNĄĆ OKO NA COŚ — «закрыть глаза на что-то», хотя буквально «прикрыть один глаз»." }
  - { kind: usage, text: "Пятьдесят три формы, включая PRZYMKNIĘCI — разговорное «задержанные, посаженные». Будущее: PRZYMKNĘ, PRZYMKNIESZ, повелительное PRZYMKNIJ. Несовершенный вид — PRZYMYKAĆ." }
  - { kind: government, text: "Что — винительный: PRZYMKNĄĆ DRZWI. На что закрыть глаза — NA с винительным: PRZYMKNĄĆ OKO NA SPÓŹNIENIE. Кого, за что — винительный и ZA с винительным: PRZYMKNĄĆ ZŁODZIEJA ZA KRADZIEŻ." }
  - { kind: pronunciation, text: "Читается «пшы́мкнонць»: PRZ — «пш», конечное ĄĆ — «онць», ударение на первом слоге. PRZYMKNĘ — «пшы́мкнэ»." }
  - { kind: register, text: "О дверях и глазах — нейтральное. «Посадить, упечь» — разговорное. PRZYMKNĄĆ OKO — устойчивое и нейтральное, встречается и в газетах." }
collocations:
  - { pl: "przymknąć oczy", ru: "прикрыть глаза" }
  - { pl: "przymknąć drzwi", ru: "прикрыть дверь" }
  - { pl: "przymknąć złodzieja", ru: "посадить вора" }
family:
  - { pl: "zamknąć", ru: "закрыть", relation: derived, id: zamknac }
  - { pl: "otworzyć", ru: "открыть", relation: antonym, id: otworzyc }
  - { pl: "przymykać", ru: "прикрывать", relation: aspect }
etymology: "Приставка PRZY- «при-» плюс MKNĄĆ — корень *mъk-, тот же, что в ZAMKNĄĆ «закрыть» и русском «замкнуть», «сомкнуть»."
memory: "Przymknąć — прикрыть: przymknij okno. Przymknąć oko na coś — закрыть глаза на что-то. Разг. przymknąć kogoś — посадить. Читается «пшы́мкнонць»."
idioms:
  - { pl: "przymknąć oko na coś", ru: "закрыть глаза на что-то, посмотреть сквозь пальцы" }
