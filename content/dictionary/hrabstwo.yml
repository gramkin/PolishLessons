notes:
  - { kind: false-friend, text: "HRABSTWO — «графство», от HRABIA, «граф». Польское H на месте русского Г: HRABIA — «граф», HISTORIA — «история». В Польше графств нет: там WOJEWÓDZTWO, «воеводство», и POWIAT, «повят, район»." }
  - { kind: usage, text: "Девять форм, средний род. В местном W перед IE остаётся: W HRABSTWIE. Родительный множественного — HRABSTW, без окончания." }
