# review
id: zbytnio
format: 2
lemma: "zbytnio"
rank: 3704
pos: adv
pron: { cyr: "збы́тньо" }
senses:
  - id: overly
    ru: "слишком, чересчур"
    examples:
      - pl: "Zbytnio się przejmujesz."
        ru: "Ты слишком переживаешь."
        source: { kind: authored }
      - pl: "Nie należy zbytnio ufać reklamom."
        ru: "Не стоит слишком доверять рекламе."
        source: { kind: authored }
      - pl: "Był zbytnio pewny siebie."
        ru: "Он был чересчур самоуверен."
        source: { kind: authored }
  - id: not-particularly
    ru: "не особо, не очень (NIE ZBYTNIO)"
    examples:
      - pl: "Nie zbytnio mi się to podoba."
        ru: "Мне это не очень нравится."
        source: { kind: authored }
      - pl: "Nie znam go zbytnio."
        ru: "Я его не особо знаю."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ZBYTNIO — «слишком», от ZBYTEK «излишек», а не от русского «сбыт». Чаще всего слово стоит при отрицании и смягчает его: NIE ZBYTNIO, «не особо». В утвердительной фразе обычнее ZBYT или ZA: ZBYT DUŻO, ZA DUŻO." }
  - { kind: usage, text: "Наречие, одна форма, без степеней. В разговоре NIE ZBYTNIO звучит как вежливое «не очень»: LUBISZ JAZZ? NIE ZBYTNIO." }
  - { kind: government, text: "Наречие ничем не управляет. Ставится перед глаголом или прилагательным, к которому относится: ZBYTNIO SIĘ STARAĆ, ZBYTNIO PEWNY." }
  - { kind: pronunciation, text: "Читается «збы́тньо», ударение на первом слоге. Y — «ы», NIO — «ньо» с мягким Н." }
collocations:
  - { pl: "nie zbytnio", ru: "не особо" }
  - { pl: "zbytnio się przejmować", ru: "слишком переживать" }
  - { pl: "nie zbytnio lubić", ru: "не очень любить" }
family:
  - { pl: "zbyt", ru: "слишком", relation: root, id: zbyt }
  - { pl: "zbytek", ru: "излишек; роскошь", relation: root }
  - { pl: "zbyteczny", ru: "излишний", relation: root }
etymology: "От ZBYTNI «излишний», а то — от ZBYTEK «излишек»: Z + BYĆ, «то, что сверх нужного». Русское «избыток» построено так же — из «из» и «быть»."
memory: "Zbytnio — слишком; nie zbytnio — не особо. Читается «збы́тньо». Zbytek — излишек, как русское «избыток»."
idioms:
  - { pl: "bez zbytniego pośpiechu", ru: "без особой спешки" }
formExamples:
  - form: "zbytnio"
    pl: "Nie przejmuj się zbytnio."
    ru: "Не переживай слишком."
    source: { kind: authored }
  - form: "zbytnio"
    pl: "Film nie był zbytnio ciekawy."
    ru: "Фильм был не особо интересным."
    source: { kind: authored }
  - form: "zbytnio"
    pl: "Zbytnio się nie starał."
    ru: "Он не очень-то старался."
    source: { kind: authored }
