# review
id: detektyw
format: 2
lemma: "detektyw"
rank: 633
pos: noun
pron: { cyr: "дэтэ́ктыф" }
senses:
  - id: detective
    ru: "детектив, сыщик (только человек)"
    note: "Жанр и книга по-польски — kryminał, не detektyw."
    examples:
      - pl: "Jestem detektywem."
        ru: "Я детектив."
        source: { kind: tatoeba, id: 4735390 }
      - pl: "On jest detektywem."
        ru: "Он детектив."
        source: { kind: translated, id: 6309255 }
      - pl: "Powiedziała, że on jest detektywem."
        ru: "Она сказала, что он детектив."
        source: { kind: translated, id: 2493625 }
  - id: private-eye
    ru: "prywatny detektyw — частный детектив"
    note: "wynająć detektywa «нанять детектива»."
    examples:
      - pl: "Wynajęła prywatnego detektywa."
        ru: "Она наняла частного детектива."
        source: { kind: translated, id: 3026087 }
      - pl: "Zatrudniła prywatnego detektywa, żeby śledzić męża."
        ru: "Она наняла частного детектива, чтобы следить за мужем."
        source: { kind: translated, id: 919650 }
      - pl: "Tom chciał zatrudnić detektywa."
        ru: "Том хотел нанять детектива."
        source: { kind: translated, id: 8809841 }
  - id: plural
    ru: "detektywi — детективы"
    note: "Мужское личное склонение: винительный совпадает с родительным."
    examples:
      - pl: "Detektywi uważają, że Tom działał sam."
        ru: "Детективы считают, что Том действовал один."
        source: { kind: translated, id: 12832276 }
      - pl: "Dwóch detektywów podążało za podejrzanym."
        ru: "Двое детективов следовали за подозреваемым."
        source: { kind: translated, id: 4769066 }
      - pl: "Do zbadania tej dziwnej sprawy zatrudniono prywatnych detektywów."
        ru: "Для расследования этого странного дела наняли частных детективов."
        source: { kind: translated, id: 629936 }
notes:
  - { kind: government, text: "«Быть кем-то» по-польски требует творительного падежа, и в настоящем времени тоже: jestem detektywem, on jest detektywem. Русский в настоящем времени обходится именительным — «он детектив», — и это самая частая ошибка." }
  - { kind: false-friend, text: "detektyw — только человек. Детектив как жанр или книга по-польски kryminał либо powieść kryminalna: Czytam kryminał «Читаю детектив»." }
  - { kind: usage, text: "Мужское личное склонение: винительный совпадает с родительным (wynajęła detektywa), именительный множественного — detektywi." }
  - { kind: usage, text: "Сочетания: prywatny detektyw «частный детектив», detektyw policyjny «полицейский детектив», agencja detektywistyczna «детективное агентство»." }
collocations:
  - { pl: "prywatny detektyw", ru: "частный детектив" }
  - { pl: "wynająć detektywa", ru: "нанять детектива" }
  - { pl: "być detektywem", ru: "быть детективом" }
  - { pl: "detektywi", ru: "детективы" }
family:
  - { pl: "detektywistyczny", ru: "детективный", relation: derived }
  - { pl: "śledczy", ru: "следователь", relation: root }
  - { pl: "kryminał", ru: "детектив (книга)", relation: derived }
etymology: "Из латинского detegere «раскрывать» через английское detective — то же заимствование, что и русское «детектив»."
memory: "detektyw — «детектив», но только человек: книгу или жанр поляк назовёт kryminał. И запомните творительный падеж, потому что русский здесь подводит: on jest detektywem, jestem detektywem — там, где по-русски достаточно сказать «он детектив», поляк обязан поставить творительный."
idioms:
  - { pl: "prywatny detektyw", ru: "частный детектив" }
  - { pl: "wynająć detektywa", ru: "нанять детектива" }
  - { pl: "być detektywem", ru: "быть детективом" }
