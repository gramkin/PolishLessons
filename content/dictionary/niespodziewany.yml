# review
id: niespodziewany
format: 2
lemma: "niespodziewany"
rank: 2213
pos: adj
pron: { cyr: "несподзева́ны" }
senses:
  - id: unexpected
    ru: "неожиданный, внезапный"
    examples:
      - pl: "To całkiem niespodziewane."
        ru: "Это совершенно неожиданно."
        source: { kind: translated, id: 12351021 }
      - pl: "Natknął się na niespodziewane trudności."
        ru: "Он столкнулся с неожиданными трудностями."
        source: { kind: translated, id: 2342423 }
      - pl: "Mieliśmy niespodziewanych gości."
        ru: "У нас были неожиданные гости."
        source: { kind: translated, id: 4169883 }
  - id: sudden
    ru: "нежданный (о визите, расходах)"
    examples:
      - pl: "Pani Young nie miała nic przeciwko mojej niespodziewanej wizycie."
        ru: "Пани Янг не возражала против моего неожиданного визита."
        source: { kind: translated, id: 360348 }
      - pl: "Dla Toma, zwolnienie było niespodziewanym szokiem."
        ru: "Для Тома увольнение стало неожиданным ударом."
        source: { kind: translated, id: 777723 }
notes:
  - { kind: false-friend, text: "Собрано из nie + spodziewać się «ожидать»: буквально «неожидаемый». Русское «неожиданный» устроено так же, от «ждать»." }
  - { kind: government, text: "Обычное прилагательное; наречие — niespodziewanie «неожиданно»." }
  - { kind: usage, text: "Рядом стоит существительное niespodzianka «сюрприз», у которого своя карточка, — но niespodziewany нейтрален, а niespodzianka обычно приятна." }
  - { kind: usage, text: "Пишется слитно, как все прилагательные с nie-." }
collocations:
  - { pl: "niespodziewany gość", ru: "нежданный гость" }
  - { pl: "niespodziewany obrót", ru: "неожиданный поворот" }
etymology: "nie + spodziewać się «ожидать»; русское «неожиданный» от «ждать» собрано тем же способом."
memory: "niespodziewany — «неожиданный», буквально «неожидаемый». Рядом существительное niespodzianka «сюрприз»: прилагательное нейтрально, существительное обычно приятно."
idioms:
  - { pl: "niespodziewany gość", ru: "нежданный гость" }
