# review
id: obrona
format: 2
lemma: "obrona"
rank: 1199
pos: noun
pron: { cyr: "обро́на" }
senses:
  - id: military
    ru: "оборона, защита от нападения"
    examples:
      - pl: "Chociaż obrona nieprzyjaciela była silna, próbowaliśmy się przedrzeć."
        ru: "Хотя оборона противника была сильной, мы пытались прорваться."
        source: { kind: translated, id: 675513 }
      - pl: "Nasze wojsko przebiło się przez obronę wroga."
        ru: "Наше войско прорвалось через оборону врага."
        source: { kind: translated, id: 12179054 }
      - pl: "Najlepszą obroną jest atak."
        ru: "Лучшая оборона — нападение."
        source: { kind: translated, id: 360488 }
  - id: legal
    ru: "защита (в суде); obrona konieczna «необходимая оборона»"
    examples:
      - pl: "Nigdy nie myślałem, że moje umiejętności prawnicze posłużą do obrony Toma."
        ru: "Я никогда не думал, что мои юридические навыки послужат защите Тома."
        source: { kind: translated, id: 1560139 }
      - pl: "Podczas procesu utrzymywał, że działał w ramach obrony koniecznej, i został oczyszczony z zarzutów."
        ru: "На процессе он утверждал, что действовал в рамках необходимой обороны, и был оправдан."
        source: { kind: translated, id: 3749353 }
      - pl: "Tom stanął w mojej obronie."
        ru: "Том встал на мою защиту."
        source: { kind: translated, id: 13659510 }
  - id: sport
    ru: "защита (в спорте)"
    examples:
      - pl: "W futbolu amerykańskim obrona ma specjalne zadania."
        ru: "В американском футболе у защиты особые задачи."
        source: { kind: translated, id: 921453 }
      - pl: "Nasz zespół piłkarski miał niezłą obronę."
        ru: "У нашей футбольной команды была неплохая защита."
        source: { kind: translated, id: 366937 }
      - pl: "Praktykował naturalny styl obrony."
        ru: "Он практиковал естественный стиль защиты."
        source: { kind: translated, id: 6534491 }
notes:
  - { kind: usage, text: "Одно слово на несколько русских контекстов: военная оборона, защита в суде, защита в спорте и obrona pracy «защита диплома»." }
  - { kind: government, text: "stanąć w czyjejś obronie «встать на чью-то защиту» — предлог w с предложным падежом. А родственный глагол bronić требует родительного: bronić kraju «защищать страну»." }
  - { kind: usage, text: "obrona konieczna — юридический термин «необходимая оборона», точная калька русского." }
  - { kind: usage, text: "Рядом стоит всё гнездо: глагол bronić «защищать», возвратное bronić się «защищаться» и broń «оружие»." }
collocations:
  - { pl: "obrona konieczna", ru: "необходимая оборона" }
  - { pl: "stanąć w obronie", ru: "встать на защиту" }
  - { pl: "obrona pracy", ru: "защита диплома" }
etymology: "От bronić «защищать», из праславянского *borniti при *bornь «оружие, борьба». Русские «оборона», «броня» и «борьба» — из того же гнезда."
memory: "obrona — и военная оборона, и защита в суде, и защита в спорте, и obrona pracy «защита диплома». Оборот stanąć w czyjejś obronie значит «встать на чью-то защиту». Глагол рядом — bronić, оружие — broń."
