# review
id: naiwny
format: 2
lemma: "naiwny"
rank: 4537
pos: adj
pron: { cyr: "наи́вны" }
senses:
  - id: naive
    ru: "наивный, доверчивый"
    examples:
      - pl: "Nie bądź naiwny, on cię oszukuje."
        ru: "Не будь наивным, он тебя обманывает."
        source: { kind: authored }
      - pl: "Była naiwna i wierzyła w każdą obietnicę."
        ru: "Она была наивной и верила каждому обещанию."
        source: { kind: authored }
      - pl: "To najnaiwniejszy człowiek, jakiego znam."
        ru: "Это самый наивный человек, какого я знаю."
        source: { kind: authored }
  - id: simplistic
    ru: "наивный, упрощённый (о взгляде, искусстве)"
    examples:
      - pl: "To naiwne wyobrażenie o polityce."
        ru: "Это наивное представление о политике."
        source: { kind: authored }
      - pl: "Lubi malarstwo naiwne."
        ru: "Он любит наивную живопись."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Совпадение с русским «наивный» полное. Есть и термин: SZTUKA NAIWNA, «наивное искусство», живопись самоучек, и самый знаменитый польский художник-примитивист — Никифор из Крыницы. В разговоре синоним — ŁATWOWIERNY, «легковерный»." }
  - { kind: usage, text: "Полная парадигма: NAIWNY, NAIWNIEJSZY, NAJNAIWNIEJSZY. Все степени живые. Форма для мужчин-людей: NAIWNI, NAIWNIEJSI, NAJNAIWNIEJSI. Существительное — NAIWNIAK, «простачок»." }
  - { kind: government, text: "Наивно думать — NAIWNIE JEST SĄDZIĆ, наречием. Наивный в чём-то — NAIWNY W + местный: NAIWNY W SPRAWACH PIENIĘDZY. Само прилагательное падежа не требует." }
  - { kind: pronunciation, text: "Читается «наи́вны», три слога, ударение на предпоследнем: «на-и́в-ны». A и I не сливаются. В NAIWNIEJSZY: «наивне́йшы»." }
  - { kind: register, text: "Нейтральное слово, обычно с лёгким осуждением или снисходительной улыбкой. Как комплимент — редко, о детской непосредственности. Поговорка NAIWNYCH NIE SIEJĄ, SAMI SIĘ RODZĄ — «наивных не сеют, они сами родятся»." }
collocations:
  - { pl: "naiwne pytanie", ru: "наивный вопрос" }
  - { pl: "sztuka naiwna", ru: "наивное искусство" }
  - { pl: "nie bądź naiwny", ru: "не будь наивным" }
family:
  - { pl: "naiwność", ru: "наивность", relation: derived }
  - { pl: "naiwniak", ru: "простачок", relation: derived }
  - { pl: "łatwowierny", ru: "легковерный", relation: root }
etymology: "Через французское naïf из латинского nativus, «природный, врождённый». Наивный — такой, каким родился, без хитрости. Тот же латинский корень в польском NATURA и в русском «натура»."
memory: "Naiwny — наивный: nie bądź naiwny! Naiwniejszy, najnaiwniejszy. Sztuka naiwna — наивное искусство. Naiwnych nie sieją, sami się rodzą. Читается «наи́вны»."
idioms:
  - { pl: "naiwnych nie sieją", ru: "наивные сами родятся (простаков не сеют)" }
