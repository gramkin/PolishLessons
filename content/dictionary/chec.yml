  - { pl: "chętnie", ru: "охотно", relation: root, id: chetnie }
etymology: "От chcieć «хотеть», как русское «хотение» от «хотеть». В польском на месте русского «о» стоит носовое ę."
memory: "chęć — «желание»: mieć chęć «иметь желание», z chęcią «охотно». В повседневной речи то же самое чаще скажут через ochota: mam ochotę na kawę."
