senses:
  - id: desire
    ru: "желание, охота"
    examples:
      - pl: "Nie mam chęci do pracy."
        ru: "У меня нет желания работать."
        source: { kind: translated, id: 13780426 }
      - pl: "Straciłem chęć do życia."
        ru: "Я потерял желание жить."
        source: { kind: translated, id: 4328060 }
      - pl: "Ja też mam chęć pograć."
        ru: "Мне тоже хочется поиграть."
        source: { kind: translated, id: 13064100 }
  - id: willingly
    ru: "z chęcią — охотно, с удовольствием"
    examples:
      - pl: "Robię to z miłą chęcią."
        ru: "Я делаю это с удовольствием."
        source: { kind: translated, id: 11433081 }
      - pl: "Z chęcią bym się trochę przespał."
        ru: "Я бы с удовольствием немного поспал."
        source: { kind: translated, id: 6554136 }
notes:
  - { kind: usage, text: "mieć chęć na coś или mieć chęć coś zrobić — «иметь желание». В живой речи то же самое чаще скажут через ochota: mam ochotę na kawę." }
  - { kind: usage, text: "z chęcią — «охотно, с удовольствием»: z chęcią pomogę «охотно помогу»." }
  - { kind: government, text: "Желание чего-то — chęć czegoś, родительный падеж: chęć ucieczki «желание убежать»; желание к чему-то — chęć do czegoś: chęć do pracy." }
  - { kind: usage, text: "dobre chęci — «добрые намерения»: Dobrymi chęciami piekło jest wybrukowane — «Благими намерениями вымощена дорога в ад»." }
collocations:
  - { pl: "mieć chęć", ru: "иметь желание" }
  - { pl: "z chęcią", ru: "охотно" }
  - { pl: "chęć do życia", ru: "желание жить" }
family:
  - { pl: "chcieć", ru: "хотеть", relation: root, id: chciec }
