# review
id: dziac
format: 2
lemma: "dziać"
rank: 309
pos: verb
aspect: imperf
pron: { cyr: "дзяць" }
senses:
  - id: happen
    ru: "dziać się — происходить, твориться"
    note: "Употребляется почти только в 3-м лице: Co się dzieje? «Что происходит?»"
    examples:
      - pl: "Nic się nie dzieje."
        ru: "Ничего не происходит."
        source: { kind: tatoeba, id: 1896367 }
      - pl: "Wiecie co się tam dzieje?"
        ru: "Вы знаете, что там происходит?"
        source: { kind: tatoeba, id: 4328093 }
      - pl: "Co tu się dzieje?"
        ru: "Что здесь происходит?"
        source: { kind: authored }
  - id: knit
    ru: "вязать, плести (о трикотаже)"
    note: "Отсюда dziany «вязаный» и dzianina «трикотаж»."
    examples:
      - pl: "Działa swetry na drutach."
        ru: "Она вязала свитера на спицах."
        source: { kind: authored }
      - pl: "Dziany sweter jest cieplejszy."
        ru: "Вязаный свитер теплее."
        source: { kind: authored }
      - pl: "Dziany szalik grzeje lepiej."
        ru: "Вязаный шарф греет лучше."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Главное употребление — безличное dziać się: Co się dzieje? «Что происходит?», Nic się nie dzieje «Ничего не происходит», Co się działo? «Что происходило?»" }
  - { kind: false-friend, text: "Не путайте с działać «действовать, работать»: Telewizor nie działa значит «Телевизор не работает» — это другой глагол, хотя формы похожи." }
  - { kind: usage, text: "Второе значение — «вязать»: отсюда dziany «вязаный» и dzianina «трикотаж»." }
  - { kind: usage, text: "Форма dzieli в этот список попала по ошибке — она принадлежит глаголу dzielić «делить»." }
collocations:
  - { pl: "co się dzieje?", ru: "что происходит?" }
  - { pl: "nic się nie dzieje", ru: "ничего не происходит" }
  - { pl: "dziany sweter", ru: "вязаный свитер" }
  - { pl: "niech się dzieje", ru: "будь что будет" }
etymology: "Праславянское *děti «класть, делать», из праиндоевропейского *dheh₁-; то же гнездо, что русские «деть», «дело», «одежда»."
memory: "Главное — безличное dziać się: Co się dzieje? «Что происходит?». Не путайте с działać «работать»: Telewizor nie działa. А второе значение — «вязать», отсюда dziany «вязаный»."
idioms:
  - { pl: "niech się dzieje co chce", ru: "будь что будет" }
  - { pl: "co się dzieje?", ru: "что происходит?" }
  - { pl: "źle się dzieje", ru: "дела плохи" }
formExamplesSkip:
  - { form: "dzieli", reason: "форма глагола dzielić «делить» — другого слова, попавшего в этот список" }
