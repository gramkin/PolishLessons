pron: { cyr: "несамови́ты" }
senses:
  - id: amazing
    ru: "потрясающий, невероятный (восхищение)"
    note: "Jesteś niesamowity! «Ты потрясающий!»"
    examples:
      - pl: "Jesteś niesamowity."
        ru: "Ты потрясающий."
        source: { kind: translated, id: 5558341 }
      - pl: "Byłeś niesamowity."
        ru: "Ты был потрясающий."
        source: { kind: translated, id: 2680561 }
      - pl: "Ona była niesamowita."
        ru: "Она была потрясающая."
        source: { kind: translated, id: 8502035 }
  - id: uncanny
    ru: "жуткий, необъяснимый"
    note: "niesamowita cisza «жуткая тишина» — исходный оттенок слова."
    examples:
      - pl: "Panowała niesamowita cisza."
        ru: "Стояла жуткая тишина."
        source: { kind: translated, id: 8727174 }
      - pl: "To była niesamowita bitwa."
        ru: "Это была невероятная битва."
        source: { kind: translated, id: 8529700 }
      - pl: "Panował niesamowity nastrój."
        ru: "Царила жутковатая атмосфера."
        source: { kind: authored }
  - id: exclamation
    ru: "Niesamowite! — Невероятно! Потрясающе!"
    note: "Чаще всего слово звучит как отдельное восклицание в среднем роде."
    examples:
      - pl: "Niesamowite!"
        ru: "Невероятно!"
        source: { kind: translated, id: 6160312 }
      - pl: "To niesamowite."
        ru: "Это невероятно."
        source: { kind: translated, id: 5558334 }
      - pl: "To było niesamowite."
        ru: "Это было невероятно."
        source: { kind: translated, id: 3510116 }
notes:
  - { kind: usage, text: "Разбирается прозрачно: nie + samowity, старое прилагательное от sam со значением «обычный, сам собой разумеющийся». Буквально «необыкновенный», отсюда и два живых оттенка." }
  - { kind: usage, text: "Два оттенка легко спутать: восхищение (Jesteś niesamowity! «Ты потрясающий!») и жутковатость (niesamowita cisza «жуткая тишина»). Понять помогает только контекст." }
  - { kind: usage, text: "Мужское личное множественное — niesamowici: Jesteście niesamowici! «Вы потрясающие!»" }
  - { kind: usage, text: "Степени сравнения у этого длинного прилагательного описательные: bardziej niesamowity, najbardziej niesamowity. Простые формы вроде niesamowitszy теоретически строятся, но в живой речи почти не встречаются." }
collocations:
