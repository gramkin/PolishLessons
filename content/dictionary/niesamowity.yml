etymology: "Из nie- «не» плюс samowity — старого прилагательного от sam «сам» со значением «обычный, сам собой разумеющийся». Буквально «необыкновенный»."
memory: "niesamowity — «потрясающий, невероятный», и разбирается оно прозрачно: nie + samowity, где samowity значило «обычный». Отсюда два оттенка, которые различает только контекст: восхищение (Jesteś niesamowity! «Ты потрясающий!») и жутковатость (niesamowita cisza «жуткая тишина»). Чаще всего слово звучит отдельным восклицанием в среднем роде — Niesamowite! А степени сравнения у него описательные: bardziej niesamowity."
