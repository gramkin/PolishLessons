notes:
  - { kind: false-friend, text: "LORNETKA — это «бинокль», а не «лорнет». Русский лорнет — очки на ручке — к биноклю отношения не имеет. Большой полевой или морской бинокль — LORNETA." }
  - { kind: government, text: "Смотреть в бинокль — PATRZEĆ PRZEZ LORNETKĘ, буквально «через бинокль», а не «в». Так же говорят о подзорной трубе и окне: PRZEZ LUNETĘ, PRZEZ OKNO." }
  - { kind: usage, text: "Женский род, хотя «бинокль» мужского: TA LORNETKA, NOWA LORNETKA. K перед E смягчается в C: W LORNETCE. Родительный множественного — LORNETEK с беглым E. Звательный LORNETKO не употребляется." }
collocations:
  - { pl: "patrzeć przez lornetkę", ru: "смотреть в бинокль" }
  - { pl: "lornetka teatralna", ru: "театральный бинокль" }
  - { pl: "mocna lornetka", ru: "сильный бинокль" }
family:
