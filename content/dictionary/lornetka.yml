synonyms: ["lorneta"]
etymology: "Через немецкое LORNETTE из французского LORGNETTE «зрительная трубка», от LORGNER «поглядывать, коситься». Русский «лорнет» того же происхождения, но значит другое."
memory: "Lornetka — бинокль, а не лорнет. Смотрят PRZEZ lornetkę — «через» неё."
