notes:
  - { kind: usage, text: "Приставка po- тут не меняет направление действия, а ограничивает его по времени: PRACOWAĆ — «работать», POPRACOWAĆ — «поработать», то есть немного, какое-то время и хватит. Русский делает то же самое и той же приставкой, так что переводится слово один в один. Образец этот в польском продуктивен и работает как в русском: POCZYTAĆ «почитать», POSPAĆ «поспать», POSIEDZIEĆ «посидеть», POCHODZIĆ «походить», POMILCZEĆ «помолчать». Запомнив один глагол, вы получаете целый ряд." }
  - { kind: usage, text: "Сорок две формы — совершенный непереходный, как DOMYŚLIĆ SIĘ из партии 267: сорок одна основная форма плюс деепричастие POPRACOWAWSZY. Страдательных причастий нет, потому что глагол непереходный и винительного дополнения не берёт; действительного причастия нет, потому что вид совершенный. Безличное POPRACOWANO при этом есть и в карточке приведено. Это самая малая из четырёх клеток таблицы форм." }
  - { kind: false-friend, text: "Корень обманчив, и это стоит знать. PRACA значит «работа», но русскому слову «работа» она не родня: «работа» идёт от праславянского *orbota, а польское PRACA — от *pratja, того же корня, что PRAĆ «стирать». Родственник PRACY в русском есть, только неожиданный — это «прачка», от устаревшего «прать» «стирать, бить». То есть польская PRACA и русская «прачка» вышли из одного гнезда, а русская «работа» стоит в стороне. Но тут нужна оговорка: слово ROBOTA в польском тоже есть и русскому «работе» оно как раз родня. Только значит оно работу тяжёлую, грубую или подённую — CIĘŻKA ROBOTA, ROBOTY DROGOWE «дорожные работы», — а нейтральное «работа» это всё-таки PRACA. Так что оба слова в польском живут, просто делят между собой разные полки." }
  - { kind: government, text: "В первом значении глагол непереходный и берёт обстоятельства времени: POPRACOWAĆ GODZINĘ, DO ZMROKU, CAŁY DZIEŃ. Во втором берёт предлог NAD с творительным: POPRACOWAĆ NAD CZYMŚ — popracować nad akcentem, nad tekstem, nad sobą. Русский берёт здесь тот же предлог «над» с тем же падежом, так что управление переносится без поправок. Глагол из класса на -OWAĆ: в настоящем времени POPRACUJĘ, POPRACUJE, повелительное POPRACUJ." }
