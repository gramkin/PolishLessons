etymology: "Приставка po- с ограничительным значением «немного, какое-то время» и PRACOWAĆ «работать», от PRACA «работа», из праславянского *pratja — того же корня, что PRAĆ «стирать», исходно «бить, колотить». Русское «работа» этому корню не родня, зато родня русская «прачка» от «прать». Приставка po- в таком значении продуктивна в обоих языках одинаково: POCZYTAĆ, POSPAĆ, POSIEDZIEĆ при «почитать, поспать, посидеть»."
memory: "po- значит «немного», ровно как в «поработать». Но praca русской «работе» не родня: родня ей «прачка», от «прать» — стирать."
