id: skrotowo
format: 2
lemma: "skrótowo"
rank: 5952
pos: adv
pron: { cyr: "скруто́во" }
senses:
  - id: briefly
    ru: "кратко, вкратце, в общих чертах"
    examples:
      - pl: "Opowiedz mi skrótowo, co się stało."
        ru: "Расскажи мне вкратце, что случилось."
        source: { kind: authored }
