        ru: "Автор кратко описывает историю города."
        source: { kind: authored }
      - pl: "Przedstawię to bardzo skrótowo."
        ru: "Я изложу это очень кратко."
        source: { kind: authored }
      - pl: "Ujęła to skrótowo, ale trafnie."
        ru: "Она сформулировала это кратко, но метко."
        source: { kind: authored }
  - id: abbreviated
    ru: "сокращённо (о записи, названии)"
    examples:
      - pl: "Notatki z wykładu zawsze piszę skrótowo."
        ru: "Конспекты лекций я всегда пишу сокращённо."
        source: { kind: authored }
      - pl: "Na mapie nazwy ulic zapisano skrótowo."
        ru: "На карте названия улиц записаны сокращённо."
