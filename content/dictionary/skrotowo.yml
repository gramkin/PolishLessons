notes:
  - { kind: false-friend, text: "Не «скоро»! SKRÓTOWO — от SKRÓT «сокращение», а тот от KRÓTKI «короткий». «Скоро» по-польски — WKRÓTCE или ZARAZ." }
  - { kind: usage, text: "Чаще в письменной и деловой речи. В разговоре обычно говорят W SKRÓCIE «вкратце» или KRÓTKO. Степеней сравнения у слова нет." }
  - { kind: pronunciation, text: "Читается «скруто́во»: Ó — это «у». Ударение на предпоследнем слоге: skró-TO-wo." }
collocations:
