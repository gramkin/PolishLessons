notes:
  - { kind: pronunciation, text: "Главная трудность — чередование основы: именительный książę, но косвенные księcia, księciu, księciem, уже без носового." }
  - { kind: usage, text: "Одно слово покрывает русские «князь», «принц» и «герцог». Разницу подсказывает только контекст." }
  - { kind: usage, text: "Książę z bajki — «принц из сказки», ровно как русский оборот. А książę ciemności — «князь тьмы»." }
  - { kind: usage, text: "Женская пара — księżniczka «принцесса» или księżna «княгиня». Княжество — księstwo." }
collocations:
  - { pl: "książę z bajki", ru: "принц из сказки" }
  - { pl: "książę ciemności", ru: "князь тьмы" }
  - { pl: "syn księcia", ru: "сын князя" }
etymology: "Праславянское *kъnęžę «молодой сын правителя», уменьшительное от *kъnędzь «князь». Русское «князь» — то же слово, а польское książę сохранило уменьшительную форму."
memory: "książę — и «князь», и «принц». Главная трудность — чередование: именительный książę, но косвенные księcia, księciem, księciu, без носового. Женская пара — księżniczka, княжество — księstwo."
