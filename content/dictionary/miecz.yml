id: miecz
format: 2
lemma: "miecz"
rank: 1430
pos: noun
pron: { cyr: "меч" }
senses:
  - id: sword
    ru: "меч"
    examples:
      - pl: "Chcę miecz!"
        ru: "Я хочу меч!"
        source: { kind: tatoeba, id: 1362061 }
      - pl: "Daj mi swój miecz."
        ru: "Дай мне свой меч."
        source: { kind: tatoeba, id: 7818289 }
      - pl: "To miecz obosieczny."
        ru: "Это обоюдоострый меч."
        source: { kind: tatoeba, id: 2205818 }
  - id: figurative
    ru: "меч в переносном и устойчивом употреблении"
    examples:
      - pl: "Kto mieczem wojuje, od miecza ginie."
        ru: "Кто мечом воюет, от меча и погибнет."
        source: { kind: translated, id: 998632 }
      - pl: "Miecz Damoklesa wisi nad nim."
        ru: "Дамоклов меч висит над ним."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Не путайте miecz «меч» с mecz «матч»: разница в одной букве, и произносятся они по-разному — «меч» и «мэч»." }
  - { kind: usage, text: "Мужской неодушевлённый: miecz, miecza, mieczem. Родительный множественного — mieczy или mieczów, оба правильны." }
  - { kind: usage, text: "miecz obosieczny — «обоюдоострый меч», и в переносном смысле то же, что по-русски: нечто, способное обернуться против тебя." }
  - { kind: usage, text: "po mieczu значит «по мужской линии» (о родстве), а po kądzieli — «по женской». В русском таких оборотов нет." }
collocations:
  - { pl: "miecz obosieczny", ru: "обоюдоострый меч" }
  - { pl: "wyciągnąć miecz", ru: "вытащить меч" }
  - { pl: "po mieczu", ru: "по мужской линии" }
etymology: "Праславянское *mečь — то же самое слово, что русский «меч». Совпадение полное."
memory: "miecz — «меч», слово то же самое. Но осторожно: mecz без i это «матч», совсем другое слово. И запомните po mieczu «по мужской линии» — оборот, которого в русском нет."
idioms:
  - { pl: "kto mieczem wojuje, od miecza ginie", ru: "кто с мечом придёт, от меча и погибнет" }
  - { pl: "miecz Damoklesa", ru: "дамоклов меч" }
  - { pl: "po mieczu", ru: "по мужской линии" }
