notes:
  - { kind: pronunciation, text: "Читается «монэ́та», в три слога, с ударением на предпоследнем. Буква e даёт «э», а не «е», поэтому не «монета», а «монэ́та». Главное место — предложный и дательный падежи единственного числа: MONECIE, где t переходит в c перед окончанием -IE, и звучит это «моне́це». Такое чередование t в c обязательно для всех существительных женского рода на -TA: KOBIETA даёт KOBIECIE, GAZETA даёт GAZECIE." }
  - { kind: government, text: "Чем платят — творительный падеж без предлога: PŁACIĆ MONETĄ, PŁACIĆ TĄ SAMĄ MONETĄ. В чём выражено — предлог W с предложным: W MONECIE OBCEJ. Родительный множественного — MONET, без окончания, как у всех женских на -a. И отдельно стоит запомнить оборот BRAĆ COŚ ZA DOBRĄ MONETĘ, где после ZA стоит винительный падеж." }
  - { kind: false-friend, text: "Само слово ложным другом не является: «монета» значит то же и там, и тут. Зато расходится идиома, и расходится интересно. По-польски говорят BRAĆ COŚ ZA DOBRĄ MONETĘ — «принимать за хорошую монету», а по-русски «принимать за чистую монету». Образ один, монета фальшивая или настоящая, но определение разное: польский хвалит качество, русский — чистоту. Второе выражение совпадает полностью: PŁACIĆ TĄ SAMĄ MONETĄ и «платить той же монетой»." }
  - { kind: usage, text: "Первое значение обиходное, о кружочке металла: MONETA DWUZŁOTOWA, WRZUCIĆ MONETĘ. Второе книжное и собирательное, о денежной единице страны: MONETA OBCA, MONETA KRUSZCOWA. В современной речи для валюты чаще скажут WALUTA, а MONETA во втором значении осталась в исторических и экономических текстах. Разговорное слово для мелочи — BILON или DROBNE." }
