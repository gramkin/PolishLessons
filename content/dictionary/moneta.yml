etymology: "Из латинского MONETA, которое было прозвищем богини Юноны: при её храме на Капитолии стоял римский монетный двор, и слово от имени храма перешло на то, что в нём делали. Оттуда же английское MONEY и польское MENNICA «монетный двор». В польский слово пришло через латынь в средние века, в русский — позже и тем же путём, поэтому формы совпали почти полностью. Любопытно, что имя богини значило «предостерегающая», от MONERE «напоминать, предупреждать»: деньги получили имя от предупреждения."
memory: "Монета и «монета» совпадают. Запомнить надо чередование: MONETA, но w MONECIE, с t в c перед -IE, как KOBIETA и KOBIECIE. И идиома расходится определением: brać za DOBRĄ monetę против русского «за чистую монету»."
idioms:
  - { pl: "brać coś za dobrą monetę", ru: "принимать что-то за чистую монету" }
  - { pl: "płacić tą samą monetą", ru: "платить той же монетой" }
