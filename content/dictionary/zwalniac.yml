etymology: "Приставка Z- плюс WALNIAĆ, от прилагательного WOLNY, праславянское *volьnъ, а оно — от *volja «воля». Русский сохранил и «волю», и «вольный», и глагол «позволить», который в польском звучит POZWOLIĆ, почти неотличимо. Развитие значения «медленный» из «свободного» легко проследить: свободный значит ничем не стеснённый, а оттуда недалеко до неторопливого. Русский знает этот же переход в военной команде «вольно», которая снимает напряжение строя. Из того же гнезда идут WOLNOŚĆ «свобода», DOWOLNY «произвольный», POWOLI «медленно» и NIEWOLA «неволя»."
memory: "Ключ ко всему глаголу — прилагательное wolny, которое значит и «свободный», и «медленный». Отсюда zwalniać это «делать wolnym», то есть либо замедлять, либо освобождать и увольнять; один польский глагол против трёх русских. Управление одно для обоих значений: zwalniać kogoś z czegoś, предлог z с родительным. Шестьдесят три формы — несовершенный вид, и лишние одиннадцать это причастие на -ący, которого у совершенного вида не бывает."
idioms:
  - { pl: "być na zwolnieniu", ru: "быть на больничном" }
