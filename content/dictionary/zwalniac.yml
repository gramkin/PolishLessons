notes:
  - { kind: false-friend, text: "Чтобы понять этот глагол, надо знать одно свойство прилагательного WOLNY: оно значит сразу «свободный» и «медленный». WOLNY POKÓJ это «свободный номер», а WOLNY KROK — «медленный шаг». Русское «вольный» сохранило только первую половину. Отсюда и весь разброс значений глагола: ZWALNIAĆ буквально «делать wolnym», то есть либо замедлять, либо освобождать. Поэтому один польский глагол отвечает сразу трём русским — «замедлять», «увольнять» и «освобождать», — и выбирать между ними приходится по смыслу фразы." }
  - { kind: government, text: "В значении замедления глагол часто идёт без дополнения: KIEROWCA ZWALNIA. С дополнением он берёт винительный: ZWALNIAĆ TEMPO, ZWALNIAĆ KROK. В значении увольнения работает схема ZWALNIAĆ KOGOŚ Z CZEGOŚ — винительный на лицо и предлог Z с родительным: ZWALNIAĆ KOGOŚ Z PRACY, Z OBOWIĄZKU, Z LEKCJI. Русский в первом случае говорит так же, «увольнять с работы», а во втором переходит на «от»: «освобождать от обязанности». Польский обходится одним предлогом Z для обоих случаев, и это упрощает дело." }
  - { kind: usage, text: "Шестьдесят три формы — подпись переходного глагола несовершенного вида. Лишних одиннадцать по сравнению с совершенным видом дают действительное причастие на -ĄCY: ZWALNIAJĄCY, ZWALNIAJĄCA и далее по падежам. Такого причастия у совершенного вида не бывает, и это надёжный признак при чтении парадигмы. Видовой партнёр — ZWOLNIĆ, и у него пятьдесят три формы. Деепричастие настоящего времени ZWALNIAJĄC отвечает русскому «замедляя» и «увольняя», смотря по значению." }
  - { kind: register, text: "Слово нейтральное, но стоит знать существительное ZWOLNIENIE, потому что оно значит сразу несколько важных вещей. Это и «увольнение», и «освобождение от обязанности», и — чаще всего в быту — больничный лист: ZWOLNIENIE LEKARSKIE, BYĆ NA ZWOLNIENIU «быть на больничном». Рядом живут ZWOLNIENIA GRUPOWE «массовые увольнения» и ZWOLNIENIE Z WUEFU «освобождение от физкультуры», знакомое каждому школьнику. В дорожном контексте частотно ZWALNIAĆ PRZED PRZEJŚCIEM." }
  - { kind: pronunciation, text: "Читается «звальня́чь», три слога, ударение на предпоследнем. Начальное ZW произносится слитно и звонко. Сочетание NI перед гласной даёт мягкое «нь», поэтому середина слова звучит «ня», а не «ни-а». Конечное Ć мягкое, «чь». В формах настоящего времени ударение остаётся на том же слоге: ZWALNIAM это «зва́льням», ZWALNIAJĄ — «звальня́йон», с носовым Ą на конце." }
