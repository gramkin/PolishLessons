notes:
  - { kind: false-friend, text: "CYGARO — «сигара», но среднего рода и через C: TO CYGARO. Сигарета — PAPIEROS. CYGARETKA — тонкая сигарка или сигарета в разговоре." }
  - { kind: usage, text: "Девять форм, средний род. В местном R переходит в RZ: W CYGARZE. Родительный множественного — CYGAR, без окончания." }
