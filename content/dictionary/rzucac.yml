# review
id: rzucac
format: 2
lemma: "rzucać"
rank: 1353
pos: verb
aspect: imperf
aspectPair: rzucic
pron: { cyr: "жу́цаць" }
senses:
  - id: throw
    ru: "бросать, кидать"
    examples:
      - pl: "Nie rzucaj kamieniem w kota."
        ru: "Не бросай камнем в кота."
        source: { kind: translated, id: 524362 }
      - pl: "Dzieci rzucały kamieniami w psy."
        ru: "Дети бросали камни в собак."
        source: { kind: translated, id: 742542 }
      - pl: "Tom rzucał kamieniami w twojego psa."
        ru: "Том бросал камни в твою собаку."
        source: { kind: translated, id: 8773871 }
  - id: quit
    ru: "бросать, оставлять (занятие, привычку, человека)"
    examples:
      - pl: "Rzucam palenie."
        ru: "Я бросаю курить."
        source: { kind: translated, id: 1465636 }
      - pl: "Rzucam pracę."
        ru: "Я бросаю работу."
        source: { kind: translated, id: 8608776 }
      - pl: "Rzucam palenie od jutra."
        ru: "Я бросаю курить с завтрашнего дня."
        source: { kind: authored }
  - id: cast
    ru: "отбрасывать (тень), бросать (взгляд)"
    examples:
      - pl: "To drzewo rzuca cień na trawnik."
        ru: "Это дерево отбрасывает тень на газон."
        source: { kind: translated, id: 768836 }
      - pl: "Rzucała spojrzenia w jego kierunku."
        ru: "Она бросала взгляды в его сторону."
        source: { kind: translated, id: 1471327 }
notes:
  - { kind: government, text: "Два управления с разным смыслом: rzucać coś (винительный) — «бросать что-то, оставлять»: rzucać pracę, rzucać palenie. rzucać czymś (творительный) — «бросаться чем-то»: rzucać kamieniami. Русский различает их так же: «бросить работу», но «бросаться камнями»." }
  - { kind: usage, text: "Несовершенный вид к rzucić: rzucać — «бросать вообще, многократно», rzucić — «бросить один раз». Rzucam palenie «Я бросаю курить» — процесс, Rzuciłem palenie «Я бросил курить» — результат." }
  - { kind: usage, text: "rzucać się w oczy — «бросаться в глаза», выражение собрано буквально так же, как русское. Tom rzuca się w oczy «Том бросается в глаза»." }
  - { kind: usage, text: "rzucać okiem na coś — «взглянуть, пробежать глазами»: Przed śniadaniem zawsze rzucam okiem na gazetę." }
collocations:
  - { pl: "rzucać kamieniami", ru: "бросаться камнями" }
  - { pl: "rzucać palenie", ru: "бросать курить" }
  - { pl: "rzucać się w oczy", ru: "бросаться в глаза" }
  - { pl: "rzucać cień", ru: "отбрасывать тень" }
etymology: "Праславянское *rjutiti «валить, сбрасывать»; тот же корень виден в русском «рушить, обрушить». Приставочные польские глаголы того же гнезда — porzucić «покинуть», odrzucić «отвергнуть»."
memory: "rzucać — «бросать», и главное тут падеж: rzucać pracę «бросать работу» (винительный), но rzucać kamieniami «бросаться камнями» (творительный) — ровно как в русском. rzucać — многократно, rzucić — один раз. И запомните rzucać się w oczy «бросаться в глаза»."
idioms:
  - { pl: "rzucać się w oczy", ru: "бросаться в глаза" }
  - { pl: "rzucać kłody pod nogi", ru: "вставлять палки в колёса" }
  - { pl: "rzucać perły przed wieprze", ru: "метать бисер перед свиньями" }
  - { pl: "rzucać pieniądze w błoto", ru: "бросать деньги на ветер" }
  - { pl: "rzucać mięsem", ru: "ругаться матом" }
