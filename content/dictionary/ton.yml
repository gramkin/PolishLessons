# review
id: ton
format: 2
lemma: "ton"
rank: 952
pos: noun
pron: { cyr: "тон" }
senses:
  - id: tone-voice
    ru: "тон (голоса, речи)"
    examples:
      - pl: "Miękkim tonem zwrócił się do publiczności."
        ru: "Он обратился к публике мягким тоном."
        source: { kind: tatoeba, id: 3877999 }
      - pl: "Nie będę tolerować tego tonu!"
        ru: "Я не потерплю такого тона!"
        source: { kind: translated, id: 3882204 }
      - pl: "Proszę, spuść z tonu."
        ru: "Пожалуйста, сбавь тон."
        source: { kind: translated, id: 10581902 }
      - pl: "Nie chcę mówić nigdy niczego w ostrym tonie."
        ru: "Я не хочу никогда говорить ничего резким тоном."
        source: { kind: translated, id: 2220062 }
      - pl: "Powiedział to spokojnym tonem."
        ru: "Он сказал это спокойным тоном."
        source: { kind: authored }
      - pl: "Nie podoba mi się ten ton."
        ru: "Мне не нравится этот тон."
        source: { kind: authored }
  - id: tone-sound
    ru: "тон (звук, оттенок звучания)"
    examples:
      - pl: "Ten instrument ma ciepły ton."
        ru: "У этого инструмента тёплый тон."
        source: { kind: authored }
      - pl: "Rozpoznał ton po pierwszym dźwięku."
        ru: "Он узнал тон по первому звуку."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Осторожно с формами: ton чаще всего оказывается родительным падежом от tona «тонна» (dziesięć ton «десять тонн»), а tonie почти всегда — форма глагола tonąć «тонуть» (Statek tonie «Корабль тонет»). Существительное «тон» живёт прежде всего в формах tonem и tonu." }
  - { kind: usage, text: "Оборот spuścić z tonu значит «сбавить тон», nadawać ton — «задавать тон»." }
  - { kind: usage, text: "Значений несколько: тон голоса, музыкальный тон и принятый стиль поведения (dobry ton «хороший тон»)." }
collocations:
  - { pl: "ostry ton", ru: "резкий тон" }
  - { pl: "spuścić z tonu", ru: "сбавить тон" }
  - { pl: "nadawać ton", ru: "задавать тон" }
etymology: "Из латинского tonus, от греческого tonos «натяжение, звук». Русский «тон» — то же заимствование, поэтому слова совпадают."
memory: "ton — «тон» голоса или звука. Но будьте внимательны: форма ton в текстах чаще значит «тонн» (от tona), а tonie почти всегда — глагол tonąć «тонуть»."
idioms:
  - { pl: "ostry ton", ru: "резкий тон" }
  - { pl: "spuścić z tonu", ru: "сбавить тон" }
  - { pl: "dobry ton", ru: "хороший тон" }
formExamplesSkip:
