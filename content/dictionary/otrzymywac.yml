# review
id: otrzymywac
format: 2
lemma: "otrzymywać"
rank: 3873
pos: verb
pron: { cyr: "отшымы́ваць" }
senses:
  - id: receive
    ru: "получать"
    examples:
      - pl: "Codziennie otrzymuję dziesiątki maili."
        ru: "Каждый день я получаю десятки писем."
        source: { kind: authored }
      - pl: "Pracownicy otrzymują premię co kwartał."
        ru: "Сотрудники получают премию каждый квартал."
        source: { kind: authored }
      - pl: "Otrzymywał listy z całego świata."
        ru: "Он получал письма со всего мира."
        source: { kind: authored }
  - id: obtain
    ru: "получать (в результате, в процессе)"
    examples:
      - pl: "Z mleka otrzymuje się ser."
        ru: "Из молока получают сыр."
        source: { kind: authored }
      - pl: "Dodając te liczby, otrzymujemy sto."
        ru: "Складывая эти числа, мы получаем сто."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "OTRZYMYWAĆ — «получать», книжный синоним DOSTAWAĆ. Не путать с UTRZYMYWAĆ «содержать, поддерживать»: слова отличаются одной буквой. В быту говорят DOSTAWAĆ, в письмах и документах — OTRZYMYWAĆ." }
  - { kind: usage, text: "Несовершенный вид; совершенный — OTRZYMAĆ. Спряжение на -UJĘ: OTRZYMUJĘ, OTRZYMUJESZ, OTRZYMUJĄ. Повелительное и мужско-личное страдательное OTRZYMYWANI в карточку не включены." }
  - { kind: government, text: "Что — винительный: OTRZYMYWAĆ NAGRODĘ. От кого — OD с родительным: OD KLIENTÓW. Из чего (в химии, кулинарии) — Z с родительным: Z ROPY, Z MLEKA. Безлично — OTRZYMUJE SIĘ «получают»." }
  - { kind: pronunciation, text: "Читается «отшымы́ваць»: TRZ — «тш», Y — «ы». Ударение на предпоследнем слоге. OTRZYMUJĘ — «отшыму́е»." }
  - { kind: register, text: "Книжно-официальное слово: письма, отчёты, новости. В разговоре — DOSTAWAĆ." }
collocations:
  - { pl: "otrzymywać wynagrodzenie", ru: "получать вознаграждение" }
  - { pl: "otrzymywać listy", ru: "получать письма" }
  - { pl: "otrzymywać wsparcie", ru: "получать поддержку" }
family:
  - { pl: "otrzymać", ru: "получить", relation: aspect, id: otrzymac }
  - { pl: "dostawać", ru: "получать", relation: root, id: dostawac }
  - { pl: "odbiorca", ru: "получатель", relation: derived }
etymology: "От TRZYMAĆ «держать» с приставкой: буквально «удержать, заполучить». Русское «держать» — родственный корень."
memory: "Otrzymywać — получать (книжно): otrzymuję maile. В быту — dostawać."
idioms:
  - { pl: "otrzymywać coś na tacy", ru: "получать что-то на блюдечке" }
formExamplesSkip:
  - { form: "otrzymuj", reason: "повелительное не употребляется" }
