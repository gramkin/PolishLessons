# review
id: nakrecic
format: 2
lemma: "nakręcić"
rank: 4688
pos: verb
pron: { cyr: "накрэ́нциць" }
senses:
  - id: film
    ru: "снять (фильм, видео)"
    examples:
      - pl: "Nakręcił film o wojnie."
        ru: "Он снял фильм о войне."
        source: { kind: authored }
      - pl: "Nakręciła dokument o uchodźcach."
        ru: "Она сняла документальный фильм о беженцах."
        source: { kind: authored }
      - pl: "Nakręć mi filmik, jak skaczę."
        ru: "Сними меня на видео, как я прыгаю."
        source: { kind: authored }
  - id: wind
    ru: "завести (часы, механизм)"
    examples:
      - pl: "Nakręcił zegarek przed snem."
        ru: "Он завёл часы перед сном."
        source: { kind: authored }
      - pl: "Nakręć pozytywkę, dziecko zaśnie."
        ru: "Заведи музыкальную шкатулку, ребёнок уснёт."
        source: { kind: authored }
  - id: work-up
    ru: "разг. завести, взвинтить; с SIĘ — завестись, загореться"
    examples:
      - pl: "Nakręcił kolegów przeciwko szefowi."
        ru: "Он настроил коллег против шефа."
        source: { kind: authored }
      - pl: "Nakręciła się na tę podróż."
        ru: "Она загорелась этой поездкой."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "NAKRĘCIĆ — «завести (часы)» и «снять (фильм)». Русское «накрутить волосы» — ZAKRĘCIĆ WŁOSY. NAKRĘCIĆ KOGOŚ — разговорное «завести, взвинтить»; NAKRĘCONY — «заведённый, на взводе»." }
  - { kind: usage, text: "Пятьдесят три формы, включая NAKRĘCENI — «заведённые, взвинченные». Будущее: NAKRĘCĘ, NAKRĘCISZ, повелительное NAKRĘĆ. Несовершенный вид — NAKRĘCAĆ." }
  - { kind: government, text: "Что — винительный: NAKRĘCIĆ FILM, ZEGAREK. Кого против кого — PRZECIWKO с дательным: NAKRĘCIĆ KOGOŚ PRZECIWKO SZEFOWI. С SIĘ — NA с винительным: NAKRĘCIĆ SIĘ NA WYJAZD." }
  - { kind: pronunciation, text: "Читается «накрэ́нциць»: Ę перед C — носовое «эн», CI — «ци», ударение на предпоследнем слоге. NAKRĘĆ — «на́крэнць»." }
  - { kind: register, text: "О кино — нейтральное: NAKRĘCIĆ FILM, SERIAL. «Завести кого-то» и NAKRĘCONY — разговорные. NAKRĘCIĆ KONIUNKTURĘ — газетное «разогнать спрос»." }
collocations:
  - { pl: "nakręcić film", ru: "снять фильм" }
  - { pl: "nakręcić zegarek", ru: "завести часы" }
  - { pl: "nakręcić kogoś przeciwko komuś", ru: "настроить кого-то против кого-то" }
family:
  - { pl: "kręcić", ru: "крутить; снимать (кино)", relation: root, id: krecic }
  - { pl: "pokręcić", ru: "покрутить", relation: derived, id: pokrecic }
  - { pl: "nakręcać", ru: "заводить; снимать", relation: aspect }
etymology: "Приставка NA- плюс KRĘCIĆ «крутить», праславянское *krǫtiti. Значение «снимать фильм» — от ручки старой кинокамеры, которую крутили."
memory: "Nakręcić film — снять фильм. Nakręcić zegarek — завести часы. Nakręcony — заведённый, на взводе. Читается «накрэ́нциць»."
idioms:
  - { pl: "być nakręconym jak sprężyna", ru: "быть заведённым как пружина, на взводе" }
