notes:
  - { kind: false-friend, text: "РЕДКИЙ СЛУЧАЙ ПОЛНОГО СОВПАДЕНИЯ: modlitwa и «молитва» — одно слово, один корень, одно значение. Глагол MODLIĆ SIĘ отвечает русскому «молиться» и управляется так же: modlić się DO kogoś «молиться кому-то» и modlić się O coś «молиться о чём-то». Тут можно переводить прямо." }
  - { kind: usage, text: "Дательный и предложный — MODLITWIE, с мягким twi: w modlitwie. Родительный множественного — MODLITW, с нулевым окончанием и глухим ф на конце. Ударение во всех формах остаётся на предпоследнем слоге." }
  - { kind: pronunciation, text: "Три слога, ударение на предпоследнем: mo-dli-TWA, точнее mo-DLI-twa. Tw перед гласной звучит как тф на конце слова и как тв внутри: «модлі́тфа». Форма modlitwie читается «модлі́тфе»." }
collocations:
  - { pl: "odmówić modlitwę", ru: "прочитать молитву" }
  - { pl: "w modlitwie", ru: "в молитве" }
  - { pl: "poranna modlitwa", ru: "утренняя молитва" }
family:
  - { pl: "modlić się", ru: "молиться", relation: root, id: modlic }
  - { pl: "kościół", ru: "костёл, церковь", relation: root, id: kosciol }
  - { pl: "świątynia", ru: "храм", relation: root, id: swiatynia }
etymology: "От modlić się «молиться», из праславянского *modliti — того же, что русские «молить», «молиться» и «молитва». Суффикс -twa образует названия действий, как в bitwa «битва». Соответствие с русским здесь полное, вплоть до суффикса."
memory: "modlitwa — «молитва», слово совпадает целиком, включая суффикс: как bitwa и «битва». Глагол modlić się управляется как русский: do kogoś, o coś. Предложный — w modlitwie."
idioms:
