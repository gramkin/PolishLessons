# review
id: urwac
format: 2
lemma: "urwać"
rank: 5099
pos: verb
pron: { cyr: "у́рваць" }
senses:
  - id: tear-off
    ru: "оторвать, сорвать"
    examples:
      - pl: "Urwał guzik od płaszcza."
        ru: "Он оторвал пуговицу от пальто."
        source: { kind: authored }
      - pl: "Urwała kwiatek i dała mamie."
        ru: "Она сорвала цветок и подарила маме."
        source: { kind: authored }
      - pl: "Urwij kartkę z kalendarza."
        ru: "Оторви листок от календаря."
        source: { kind: authored }
  - id: break-off
    ru: "оборвать (речь); с SIĘ — оборваться"
    examples:
      - pl: "Urwał w pół zdania."
        ru: "Он оборвал себя на полуслове."
        source: { kind: authored }
      - pl: "Rozmowa nagle się urwała."
        ru: "Разговор вдруг оборвался."
        source: { kind: authored }
  - id: slip-away
    ru: "разг. с SIĘ — улизнуть, вырваться (с работы, урока)"
    examples:
      - pl: "Urwał się z pracy na mecz."
        ru: "Он улизнул с работы на матч."
        source: { kind: authored }
      - pl: "Urwijmy się z tej nudnej imprezy."
        ru: "Давайте сбежим с этой скучной вечеринки."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "URWAĆ — «оторвать», а не «урвать» в смысле «ухватить себе». Русское «урвать» по-польски — CAPNĄĆ или ZGARNĄĆ. Зато URWAĆ SIĘ — «вырваться, улизнуть»: URWAĆ SIĘ Z LEKCJI — «сбежать с урока»." }
  - { kind: usage, text: "Пятьдесят три формы, включая URWANI — в шутке URWANI Z CHOINKI «свалившиеся с луны». Будущее: URWĘ, URWIESZ, повелительное URWIJ. Несовершенный вид — URYWAĆ." }
  - { kind: government, text: "Что — винительный, от чего — OD с родительным: URWAĆ UCHO OD KUBKA; откуда — Z с родительным: URWAĆ KARTKĘ Z ZESZYTU. Кому — дательный: URWAĆ KOMUŚ GŁOWĘ «оторвать голову». С SIĘ — Z чего: Z PRACY." }
  - { kind: pronunciation, text: "Читается «у́рваць», ударение на первом слоге. URWĘ — «у́рвэ», URWIJ — «у́рвий»." }
  - { kind: register, text: "В прямом смысле — нейтральное. URWAĆ SIĘ Z PRACY — разговорное. URWANIE GŁOWY — разговорное «запарка, сумасшедший дом». URWAĆ SIĘ Z CHOINKI — шутливое «свалиться с луны»." }
collocations:
  - { pl: "urwać guzik", ru: "оторвать пуговицу" }
  - { pl: "urwać w pół zdania", ru: "оборвать на полуслове" }
  - { pl: "urwać się z lekcji", ru: "сбежать с урока" }
family:
  - { pl: "zerwać", ru: "сорвать; порвать", relation: derived, id: zerwac }
  - { pl: "wyrwać", ru: "вырвать", relation: derived, id: wyrwac }
  - { pl: "rwać", ru: "рвать", relation: root }
etymology: "Приставка U- плюс RWAĆ «рвать», праславянское *rъvati. Русское «урвать», «оборвать» — тот же корень, но значения разошлись."
memory: "Urwać — оторвать: urwał guzik. Urwać się z pracy — улизнуть. Urwanie głowy — запарка. Читается «у́рваць»."
idioms:
  - { pl: "urwanie głowy", ru: "запарка, суматоха, сумасшедший дом" }
