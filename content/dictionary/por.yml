etymology: "Два слова совпали: POR «порей» — из латинского PORRUM, как русское «порей»; POR «пора» — из греческого POROS «проход», как русское «пора»."
memory: "Por — порей и пора на коже: zupa z porem, pory skóry. Время — pora, женский род."
