notes:
  - { kind: false-friend, text: "POR — два слова: «порей» и «пора» на коже. Русское «пора» о времени по-польски — PORA, женского рода, и это уже другое слово: PORA ROKU «время года». Польский POR мужского рода в обоих значениях." }
  - { kind: usage, text: "Мужской род, неодушевлённое. Родительный — PORA (совпадает с PORA «время»), именительный множественного — PORY (совпадает с PORY «времена»). Предложный — PORZE: R чередуется с RZ. Различает только контекст." }
  - { kind: government, text: "Сколько — родительный: KILO PORA, PĘCZEK PORA. Через что — PRZEZ с винительным: PRZEZ PORY SKÓRY. Чем — творительный: ZUPA Z POREM." }
  - { kind: pronunciation, text: "Читается «пор», один слог. PORZE — «по́же»: RZ — «ж». PORÓW — «по́руф»." }
  - { kind: register, text: "Нейтральное слово: в кулинарии — порей, в косметике — пора." }
