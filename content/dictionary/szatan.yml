etymology: "Из древнееврейского ŚĀṬĀN «противник, обвинитель» — слово обозначало должность обвинителя на суде, а не имя. Через греческое SATANAS и латинское SATANAS оно разошлось по всей Европе. Русский получил его прямо из греческого через церковнославянский и сохранил начальное С и греческое окончание -А. Польский принял слово через латынь западной церкви и немецкое посредство, где начальный звук в этом положении произносился как «ш», и записал его через SZ. Поэтому разница в первой букве — не случайная описка, а след двух разных путей христианизации: восточного, через Византию, и западного, через Рим. Та же пара видна в SZABAT против «субботы»."
memory: "Одно слово с русской «сатаной», от древнееврейского śāṭān «противник на суде». Разница в пути: русский взял через греческий и Византию, польский через латынь и немцев, откуда ś вместо с и ударение на первом слоге — «ша́тан». Главное в парадигме: два именительных множественного. Szatani обычная мужская-личная форма, а szatany — деприциативная, которой польский отказывает лицу в уважении, как chłopy против chłopi; в русском такой категории нет."
