notes:
  - { kind: false-friend, text: "Слово то же, что русская «сатана», и восходит к одному источнику, но различий три, и все заметные. Первое — начальный звук: по-польски SZ, то есть «ш», а по-русски «с». Второе — род и склонение: польское SZATAN мужского рода и склоняется как обычное название лица, тогда как русская «сатана» имеет окончание -А и склоняется по женскому образцу при мужском значении, как «воевода». Третье — ударение: в польском оно на первом слоге, «ша́тан», в русском на последнем. Значение при этом совпадает полностью, и чёрт в обоих языках называется отдельным словом: DIABEŁ." }
  - { kind: usage, text: "Одиннадцать форм, мужской род, одушевлённое лицо. Именительных множественного два, и разница между ними грамматическая, а не стилистическая мелочь. SZATANI — обычная мужская-личная форма, та же, что в POLACY и STUDENCI. SZATANY — так называемая деприциативная форма, которую польский образует у названий лиц, когда говорящий отказывает им в уважении или говорит о них как о предметах; то же самое даёт CHŁOPY рядом с CHŁOPI и PROFESORY рядом с PROFESOROWIE. В русском такой категории нет вовсе, и передать её можно только интонацией или словом." }
  - { kind: pronunciation, text: "Читается «ша́тан», два слога, ударение на первом. Буквосочетание SZ даёт твёрдое «ш». Буква A в обоих слогах чистая. Конечное N твёрдое. В форме SZATANA слышно «шата́на», с ударением на втором слоге, как и во всех трёхсложных формах. В форме SZATANIE сочетание NIE даёт мягкое «не»: «шата́не». В форме SZATANÓW буква Ó читается как «у», а конечное W оглушается: «шата́нуф»." }
  - { kind: register, text: "Слово книжное и религиозное, но вполне обиходное в переносном употреблении. Устойчивые сочетания: SZATAŃSKI PLAN «сатанинский замысел», SZATAŃSKA MOC, OPĘTANY PRZEZ SZATANA «одержимый». В разговоре о человеке SZATAN значит скорее восхищение ловкостью, чем осуждение: TO SZATAN, NIE CZŁOWIEK. Слово пишется со строчной буквы как имя нарицательное и с прописной, когда употреблено как имя собственное. Для бытовой чертовщины поляк чаще скажет DIABEŁ, CZART или BIES, и последние два звучат фольклорно." }
