# review
id: oczekiwac
format: 2
lemma: "oczekiwać"
rank: 744
pos: verb
aspect: imperf
pron: { cyr: "очеки́ваць" }
senses:
  - id: expect
    ru: "ожидать, рассчитывать (на что-л.) — родительный падеж"
    note: "Требует родительного, в отличие от czekać na + винительный."
    examples:
      - pl: "Oczekiwałem od niej listu."
        ru: "Я ждал от неё письма."
        source: { kind: translated, id: 3049159 }
      - pl: "Tom wiedział czego oczekiwać."
        ru: "Том знал, чего ожидать."
        source: { kind: translated, id: 4953271 }
      - pl: "Zbyt wiele oczekujesz od niej."
        ru: "Ты слишком многого от неё ждёшь."
        source: { kind: tatoeba, id: 3704161 }
  - id: expect-that
    ru: "oczekiwać, że — ожидать, что"
    examples:
      - pl: "Nie oczekuję, że odpowiesz."
        ru: "Я не жду, что вы ответите."
        source: { kind: tatoeba, id: 5975472 }
      - pl: "Nikt nie oczekiwał, że wygramy."
        ru: "Никто не ожидал, что мы выиграем."
        source: { kind: translated, id: 4953266 }
      - pl: "Maria oczekiwała, że Tom ją pocałuje."
        ru: "Мария ожидала, что Том её поцелует."
        source: { kind: translated, id: 5383081 }
  - id: noun
    ru: "oczekiwania — ожидания; oczekiwanie — ожидание"
    examples:
      - pl: "Spełniła nasze oczekiwania."
        ru: "Она оправдала наши ожидания."
        source: { kind: translated, id: 1611652 }
      - pl: "Jakie są twoje oczekiwania?"
        ru: "Каковы твои ожидания?"
        source: { kind: translated, id: 6729673 }
      - pl: "Oczekiwanie jest często lepsze niż posiadanie."
        ru: "Ожидание часто лучше обладания."
        source: { kind: translated, id: 821078 }
notes:
  - { kind: government, text: "Главное отличие от czekać: oczekiwać требует родительного падежа без предлога — oczekiwać listu «ждать письма», oczekiwać pomocy «ждать помощи». А czekać строится с предлогом: czekać NA list. Путать их легко, потому что по-русски оба «ждать»." }
  - { kind: usage, text: "oczekiwać od kogoś czegoś — «ожидать от кого-то чего-то»: Oczekują od ciebie współpracy «От тебя ждут сотрудничества»." }
  - { kind: usage, text: "Существительные: oczekiwanie «ожидание» и oczekiwania «ожидания, надежды» — spełnić oczekiwania «оправдать ожидания»." }
  - { kind: usage, text: "Слово книжнее, чем czekać, и часто значит не «стоять и ждать», а «рассчитывать, предполагать»: Nie oczekuję, że odpowiesz «Я не жду, что ты ответишь»." }
collocations:
  - { pl: "oczekiwać pomocy", ru: "ждать помощи" }
  - { pl: "spełnić oczekiwania", ru: "оправдать ожидания" }
  - { pl: "oczekiwać od kogoś", ru: "ожидать от кого-то" }
  - { pl: "nie oczekuj cudów", ru: "не жди чудес" }
family:
  - { pl: "czekać", ru: "ждать", relation: root, id: czekac }
  - { pl: "oczekiwanie", ru: "ожидание", relation: derived }
  - { pl: "oczekiwany", ru: "ожидаемый", relation: derived }
etymology: "Из o- + czekać «ждать». Приставка добавила книжности и, главное, сменила управление: czekać требует предлога na, а oczekiwać — чистого родительного."
memory: "oczekiwać — «ожидать», но управление другое, чем у czekać: oczekiwać listu без предлога, тогда как czekać NA list. По-русски оба «ждать», поэтому пару легко перепутать. Существительные — oczekiwanie «ожидание» и oczekiwania «ожидания»."
idioms:
  - { pl: "spełnić oczekiwania", ru: "оправдать ожидания" }
  - { pl: "nie oczekuj cudów", ru: "не жди чудес" }
  - { pl: "oczekiwać od kogoś", ru: "ожидать от кого-то" }
