notes:
  - { kind: usage, text: "Глагол употребляется только с SIĘ и только несовершенного вида, пара к совершенному ZATROSZCZYĆ SIĘ. Форм у него пятьдесят две, и это число само себя объясняет, если сравнить с podnosić, у которого шестьдесят три. Разница ровно в одиннадцати формах страдательного причастия: podnoszony, podnoszona и так далее. Возвратный глагол ничего не передаёт наружу, страдать по нему нечему, поэтому причастия нет вовсе. То же у współczuć, zajrzeć и nalegać, но здесь это видно прямо по арифметике." }
  - { kind: government, text: "Падеж после предлога не тот, что по-русски. TROSZCZYĆ SIĘ O KOGOŚ, O COŚ — предлог o с винительным: troszczę się o dzieci, o zdrowie, o dom. Русское «заботиться о детях» ставит предложный, и подстановка предложного сюда даёт ошибку. Запоминать надо целиком: troszczyć się o kogo, а не o kim." }
  - { kind: false-friend, text: "Корень обманчив. Существительное TROSKA значит «забота, беспокойство», а вовсе не «тоска». Слова эти родня, оба из праславянского *tъska, но русский увёл своё к душевной тяжести, а польский оставил при хлопотах. Русская «тоска» по-польски называется TĘSKNOTA или SMUTEK, и путаница здесь особенно обидна: troskliwa matka — заботливая мать, а не тоскующая." }
collocations:
  - { pl: "troszczyć się o dzieci", ru: "заботиться о детях" }
  - { pl: "troszczyć się o zdrowie", ru: "заботиться о здоровье" }
  - { pl: "nie troszczyć się o nic", ru: "ни о чём не заботиться" }
family:
  - { pl: "troska", ru: "забота", relation: root }
  - { pl: "troskliwy", ru: "заботливый", relation: derived }
  - { pl: "zatroszczyć się", ru: "позаботиться", relation: aspect }
etymology: "От существительного TROSKA, из праславянского *tъska. Русская «тоска» — то же слово, и первоначальный смысл был общий: стеснение, тягота. Польский развернул его к хлопотам о ком-то, русский к сердечной тяжести. Поэтому troska o dziecko — это забота о ребёнке, а наша тоска передаётся словом tęsknota."
memory: "Пятьдесят две формы вместо шестидесяти трёх: страдательного причастия нет, потому что глагол возвратный. И падеж винительный: troszczyć się O KOGOŚ."
