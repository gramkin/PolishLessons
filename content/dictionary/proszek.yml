notes:
  - { kind: false-friend, text: "Польское PROCH — сразу и «порох», и «прах», и «пыль»: PROCH STRZELNICZY, PROCHY ZMARŁEGO. От него PROSZEK, буквально «пылинка», и неожиданное PROCHOWIEC — не пороховница, а лёгкий плащ от пыли. В разговоре PROSZEK значит ещё и таблетку: WZIĄĆ PROSZEK OD BÓLU GŁOWY — «выпить таблетку от головы»." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Беглое E: PROSZEK, но PROSZKU, PROSZKI. В родительном две формы, PROSZKU и PROSZKA, первая обычнее. Оборот BYĆ W PROSZKU значит, что дело ещё и не начато: PROJEKT JEST W PROSZKU — «по проекту конь не валялся»." }
  - { kind: government, text: "Порошок для чего-то — PROSZEK DO CZEGOŚ, DO с родительным: DO PRANIA, DO PIECZENIA. Таблетка от чего-то — PROSZEK OD CZEGOŚ: OD BÓLU GŁOWY. В виде порошка — W PROSZKU, местный падеж: MLEKO W PROSZKU." }
  - { kind: pronunciation, text: "Читается «про́шэк», два слога, ударение на первом. SZ даёт «ш», и E после него звучит твёрдо, «э». В формах без беглого E получается сочетание SZK: PROSZKU — «про́шку»." }
  - { kind: register, text: "Слово бытовое: на кухне, в ванной, в аптеке. Значение «таблетка» разговорное и немного старомодное: в аптеке скажут TABLETKA, а дома — PROSZEK." }
collocations:
  - { pl: "proszek do prania", ru: "стиральный порошок" }
  - { pl: "proszek do pieczenia", ru: "разрыхлитель" }
  - { pl: "mleko w proszku", ru: "сухое молоко" }
family:
  - { pl: "proch", ru: "порох; прах; пыль", relation: root, id: proch }
  - { pl: "proszkowy", ru: "порошковый", relation: derived }
  - { pl: "prochowiec", ru: "лёгкий плащ", relation: derived }
etymology: "От PROCH «пыль, прах» с уменьшительным суффиксом -EK: PROSZEK — «пылинка», мелко растёртое вещество. CH перед суффиксом переходит в SZ, как в MUCHA и MUSZKA. Русские «порох» и «прах» — тот же корень, но русский разделил его на два слова, народное полногласное «порох» и книжное «прах», а польский оставил одно PROCH на всё."
memory: "Proszek — «порошок», от proch, который у поляков и «порох», и «прах», и «пыль». Proszek do prania — стиральный порошок. В разговоре proszek — это и таблетка. А być w proszku — быть совсем не готовым. Prochowiec — плащ, а не пороховница."
idioms:
  - { pl: "być w proszku", ru: "быть совсем не готовым; конь не валялся" }
formExamplesSkip:
  - { form: "proszku", cell: "Звательный", reason: "звательный падеж: для неодушевлённого существительного он практически не употребляется" }
