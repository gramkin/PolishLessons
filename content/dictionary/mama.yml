# review
id: mama
format: 2
lemma: mama
rank: 101
pos: noun
pron: { cyr: "ма́ма" }
senses:
  - id: mother
    ru: "мама, мать"
    examples:
      - pl: "Mama ma zawsze rację."
        ru: "Мама всегда права."
        source: { kind: tatoeba, id: 2216928 }
      - pl: "On mieszka z mamą."
        ru: "Он живёт с мамой."
        source: { kind: tatoeba, id: 4716828 }
      - pl: "Zostały mamami tego samego dnia."
        ru: "Они стали мамами в один и тот же день."
        source: { kind: tatoeba, id: 7960589 }
      - pl: "Kocham mamę."
        ru: "Я люблю маму."
        source: { kind: translated, id: 12182512 }
      - pl: "Wieczorem pomagam mamie."
        ru: "Вечером я помогаю маме."
        source: { kind: translated, id: 566264 }
  - id: address
    ru: "обращение к маме: mamo!"
    note: "При обращении используется звательный падеж."
    examples:
      - pl: "Dobranoc, mamo."
        ru: "Спокойной ночи, мама."
        source: { kind: tatoeba, id: 351928 }
notes:
  - kind: usage
    text: "Обращаясь к маме, поляки используют звательный падеж: mamo! (как в старом русском «мати»). Форма mama в обращении звучит неестественно."
  - kind: false-friend
    text: "Формы mam (род. п. мн. ч.) и mamy (им. п. мн. ч.) совпадают с формами глагола mieć: mam «у меня есть», mamy «у нас есть». Смысл определяется контекстом."
collocations:
  - { pl: "moja mama", ru: "моя мама" }
  - { pl: "mama i tata", ru: "мама и папа" }
  - { pl: "przyszła mama", ru: "будущая мама" }
family:
  - { pl: "mamusia", ru: "мамочка", relation: derived }
  - { pl: "matka", ru: "мать", relation: root }
etymology: "Праславянское *mama — из детского лепета: слог «ма», повторённый дважды. Тот же источник у русского «мама», как и у tata / «папа»; слова этого класса почти не меняются со временем."
memory: "Главная ловушка не в значении, а в омонимии: mam и mamy — это ещё и формы глагола mieć. Mam mamę означает «у меня есть мама», а не «мам»; mamy — либо «у нас есть», либо родительный падеж «мамы». Различайте по контексту: перед существительным в винительном — это глагол."
idioms:
  - { pl: "jak mamę kocham", ru: "честное слово (букв. как маму люблю)" }
  - { pl: "kocia mama", ru: "наседка, тот кто над всеми хлопочет" }
  - { pl: "na złość mamie odmrozić sobie uszy", ru: "назло маме отморозить уши" }
  - { pl: "tata z mamą", ru: "папа с мамой" }
