# review
id: cierpiec
format: 2
lemma: "cierpieć"
rank: 711
pos: verb
aspect: imperf
pron: { cyr: "це́рпець" }
senses:
  - id: suffer
    ru: "страдать"
    examples:
      - pl: "Tom będzie cierpieć."
        ru: "Том будет страдать."
        source: { kind: tatoeba, id: 9532992 }
      - pl: "Cierpię."
        ru: "Я страдаю."
        source: { kind: translated, id: 10222143 }
      - pl: "On cierpi."
        ru: "Он страдает."
        source: { kind: translated, id: 10222176 }
  - id: suffer-from
    ru: "cierpieć NA coś — страдать чем-л. (о болезни)"
    examples:
      - pl: "Moja babcia cierpi na osteoporozę."
        ru: "Моя бабушка страдает от остеопороза."
        source: { kind: tatoeba, id: 3460233 }
      - pl: "Cierpisz na choroby, które wymagają podawania leków?"
        ru: "Страдаете ли вы заболеваниями, требующими приема лекарств?"
        source: { kind: tatoeba, id: 10695709 }
      - pl: "Czy cierpisz na brak apetytu?"
        ru: "Ты страдаешь отсутствием аппетита?"
        source: { kind: translated, id: 3416047 }
  - id: hate
    ru: "nie cierpieć CZEGOŚ — терпеть не могу, ненавижу"
    note: "С дополнением в родительном падеже отрицание значит «ненавидеть»."
    examples:
      - pl: "Nie cierpię kawy."
        ru: "Ненавижу кофе."
        source: { kind: translated, id: 5927604 }
      - pl: "Nie cierpię hałasu."
        ru: "Терпеть не могу шума."
        source: { kind: authored }
      - pl: "Nie cierpię, kiedy się spóźniasz."
        ru: "Терпеть не могу, когда ты опаздываешь."
        source: { kind: authored }
  - id: suffering
    ru: "cierpienie — страдание"
    examples:
      - pl: "Jego serce było pełne cierpienia."
        ru: "Его сердце наполнено печалью."
        source: { kind: tatoeba, id: 368925 }
      - pl: "Lepsza śmierć niż takie cierpienia."
        ru: "Лучше смерть, чем такие страдания."
        source: { kind: translated, id: 773081 }
      - pl: "Lekarz złagodził jego cierpienie."
        ru: "Врач облегчил его страдание."
        source: { kind: translated, id: 734152 }
notes:
  - { kind: false-friend, text: "Главная ловушка слова — отрицание. Nie cierpię kawy значит не «я не страдаю от кофе», а «ненавижу кофе». Правило точное: nie cierpieć с дополнением в родительном падеже = «терпеть не могу». Без дополнения отрицание читается буквально: Czy Tom cierpiał? — «Том страдал?»." }
  - { kind: government, text: "Болезнь вводится предлогом na с винительным: cierpieć na bezsenność «страдать бессонницей». Причина — z powodu с родительным: cierpieć z powodu suszy «страдать из-за засухи»." }
  - { kind: usage, text: "Корень тот же, что в русском «терпеть», и всё гнездо об этом напоминает: cierpliwy «терпеливый», cierpliwość «терпение», cierpienie «страдание»." }
  - { kind: usage, text: "Книжный оборот nie cierpieć zwłoki значит «не терпеть отлагательства»: Sprawa nie cierpi zwłoki." }
collocations:
  - { pl: "cierpieć na coś", ru: "страдать чем-либо" }
  - { pl: "nie cierpieć czegoś", ru: "терпеть не мочь" }
  - { pl: "cierpieć z powodu", ru: "страдать из-за" }
  - { pl: "cierpliwość", ru: "терпение" }
family:
  - { pl: "cierpliwy", ru: "терпеливый", relation: derived }
  - { pl: "cierpliwość", ru: "терпение", relation: derived }
  - { pl: "cierpienie", ru: "страдание", relation: derived }
  - { pl: "ścierpieć", ru: "стерпеть", relation: aspect }
etymology: "Праславянское *sьrpěti «переносить, терпеть» — то же слово, что русское «терпеть»; перестановка согласных дала польское cierp- там, где русский даёт «терп-»."
memory: "cierpieć — «страдать», а корень тот же, что в русском «терпеть»: отсюда cierpliwy «терпеливый» и cierpliwość «терпение». Главная ловушка — отрицание: nie cierpię kawy значит «ненавижу кофе», а вовсе не «не страдаю от кофе». Правило точное: nie cierpieć с дополнением в родительном = «терпеть не могу». Болезнь вводится предлогом na: cierpieć na bezsenność."
idioms:
  - { pl: "nie cierpieć czegoś", ru: "терпеть не мочь чего-либо" }
  - { pl: "cierpieć na coś", ru: "страдать чем-либо" }
  - { pl: "nie cierpieć zwłoki", ru: "не терпеть отлагательства" }
