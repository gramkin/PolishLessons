# review
id: swietowac
format: 2
lemma: "świętować"
rank: 2231
pos: verb
pron: { cyr: "щвентова́ць" }
senses:
  - id: celebrate
    ru: "праздновать, отмечать"
    examples:
      - pl: "Świętowali zwycięstwo do rana."
        ru: "Они праздновали победу до утра."
        source: { kind: authored }
      - pl: "Świętujemy dziś rocznicę ślubu."
        ru: "Мы сегодня отмечаем годовщину свадьбы."
        source: { kind: authored }
  - id: observe-holiday
    ru: "отмечать праздник, соблюдать праздник"
    examples:
      - pl: "W tym domu świętuje się Wigilię hucznie."
        ru: "В этом доме Сочельник отмечают шумно."
        source: { kind: authored }
      - pl: "Nie świętują Nowego Roku."
        ru: "Они не отмечают Новый год."
        source: { kind: authored }
  - id: rejoice
    ru: "торжествовать, радоваться"
    examples:
      - pl: "Za wcześnie świętujesz."
        ru: "Ты рано торжествуешь."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ПРАЗДНИК ИЗ «СВЯТОГО» ПРОТИВ ПРАЗДНИКА ИЗ «ПУСТОГО». Świętować построено на święty «святой» и święto «праздник». Русский взял другой корень: «праздник» от «праздный», то есть пустой, незанятый — день без работы. Оба слова честные, но мысль в них разная: по-польски день посвящён, по-русски день свободен. Глагола «святовать» в русском нет, поэтому опереться не на что — слово надо просто выучить." }
  - { kind: pronunciation, text: "Четыре слога, ударение на предпоследнем: świę-to-WAĆ. Начальное św звучит как «щв» — ś мягкое, ближе к щ; ę перед t даёт «эн»: «щвентова́ць». В настоящем времени ę сохраняется: świętuję — «щвенту́е»." }
  - { kind: usage, text: "ТИПИЧНЫЙ ГЛАГОЛ НА -OWAĆ: ОСНОВА НАСТОЯЩЕГО ВРЕМЕНИ НА -UJ-. Инфинитив świętować даёт świętuję, świętujesz, świętuje, świętują — ровно как pracować даёт pracuję. От той же основы образованы причастие świętujący и деепричастие świętując, а от инфинитивной — страдательное świętowany и существительное świętowanie. Вид несовершенный, поэтому формы на -wszy нет вовсе." }
  - { kind: government, text: "Празднуют ЧТО — винительный без предлога: świętować zwycięstwo, rocznicę, urodziny. Можно и без дополнения: dziś świętujemy. С кем — z и творительный: świętować z rodziną. Рядом стоит obchodzić, тоже «отмечать», но более официальное: obchodzić rocznicę powstania." }
collocations:
  - { pl: "świętować zwycięstwo", ru: "праздновать победу" }
  - { pl: "świętować urodziny", ru: "отмечать день рождения" }
  - { pl: "za wcześnie świętować", ru: "рано торжествовать" }
family:
  - { pl: "święto", ru: "праздник", relation: root, id: swieto }
  - { pl: "święty", ru: "святой", relation: root, id: swiety }
  - { pl: "świętowanie", ru: "празднование", relation: derived }
etymology: "От święto «праздник», а то — от święty «святой», из праславянского *svętъ, того же, что русское «святой». Праздник был днём посвящённым. Русский на той же ступени выбрал другое слово: «праздник» восходит к «праздный» «пустой, незанятый». Отсюда świętować, świętowanie, świątynia «храм» и Wielkanoc."
memory: "świętować — «праздновать», от święto «праздник», от święty «святой». По-польски праздник — день СВЯТОЙ, по-русски — день ПРАЗДНЫЙ, то есть свободный; корни разошлись, хотя «святой» и «święty» — одно слово. Спряжение обычное для -ować: świętuję, świętujesz."
idioms:
  - { pl: "za wcześnie świętować", ru: "рано торжествовать" }
  - { pl: "świętować zwycięstwo", ru: "праздновать победу" }
