pos: noun
pron: { cyr: "кампа́ня" }
senses:
  - id: campaign
    ru: "кампания (политическая, рекламная)"
    examples:
      - pl: "Kampania kończy się w poniedziałek."
        ru: "Кампания заканчивается в понедельник."
        source: { kind: tatoeba, id: 6155029 }
      - pl: "Kampania prezydencka zaczyna nabierać szybkości. Wszystkie chwyty będą dozwolone. Rozleje się krew!"
        ru: "Президентская кампания начинает набирать скорость."
        source: { kind: translated, id: 1165228 }
      - pl: "Dzięki kampanii reklamowej do firmy trafiło dużo zleceń."
        ru: "Благодаря рекламной кампании в фирму пришло много заказов."
        source: { kind: translated, id: 766487 }
  - id: drive
    ru: "кампания, акция (общественная)"
    examples:
      - pl: "Rozpoczęli kampanię zbierania funduszy na cele charytatywne."
        ru: "Они начали кампанию по сбору средств на благотворительные цели."
        source: { kind: translated, id: 521483 }
      - pl: "Studenci stanęli na czele kampanii przeciw zanieczyszczeniu środowiska."
        ru: "Студенты возглавили кампанию против загрязнения."
        source: { kind: translated, id: 731914 }
notes:
  - { kind: false-friend, text: "Ловушки нет: kampania и «кампания» — одно слово из французского campagne. Но не путайте с kompania «рота, компания (войсковая)» — там o, и это другое слово." }
  - { kind: government, text: "Женский род: ta kampania, tej kampanii. Кампания против чего-л. — przeciw с дательным." }
  - { kind: usage, text: "kampania wyborcza «предвыборная кампания», kampania reklamowa «рекламная кампания»." }
  - { kind: usage, text: "Русское «компания» в смысле «фирма» по-польски firma, а «компания друзей» — towarzystwo." }
collocations:
  - { pl: "kampania wyborcza", ru: "предвыборная кампания" }
  - { pl: "kampania reklamowa", ru: "рекламная кампания" }
etymology: "Из французского campagne «поход, кампания», от латинского campus «поле»; русское «кампания» пришло тем же путём."
memory: "kampania — «кампания» выборная или рекламная. Не путайте с kompania «рота»: там o. А «компания-фирма» по-польски firma."
