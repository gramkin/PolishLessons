# review
id: widmo
format: 2
lemma: "widmo"
rank: 6004
pos: noun
pron: { cyr: "ви́дмо" }
senses:
  - id: ghost
    ru: "призрак, привидение (книжн.)"
    examples:
      - pl: "W starym zamku podobno straszy widmo."
        ru: "Говорят, в старом замке бродит призрак."
        source: { kind: authored }
      - pl: "Widmo krąży po Europie - widmo komunizmu."
        ru: "Призрак бродит по Европе — призрак коммунизма."
        source: { kind: translated, id: 735894 }
  - id: threat
    ru: "угроза, призрак (чего-то плохого в будущем)"
    examples:
      - pl: "Nad krajem zawisło widmo wojny."
        ru: "Над страной нависла угроза войны."
        source: { kind: authored }
      - pl: "Widmo bankructwa nie daje mu spać."
        ru: "Призрак банкротства не даёт ему спать."
        source: { kind: authored }
  - id: spectrum
    ru: "спектр (физ.)"
    examples:
      - pl: "Pryzmat rozszczepia światło na widmo."
        ru: "Призма раскладывает свет в спектр."
        source: { kind: authored }
      - pl: "Naukowcy badali widmo światła gwiazdy."
        ru: "Учёные изучали спектр света звезды."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "WIDMO не «видимо» и не «видно»: это призрак, а в физике — спектр. Обычное «привидение» в разговоре — DUCH; WIDMO звучит книжно." }
  - { kind: usage, text: "Чаще всего в переносном смысле: WIDMO WOJNY, WIDMO KRYZYSU, WIDMO BEZROBOCIA — «угроза войны, кризиса, безработицы». Как приложение не склоняется: STATEK WIDMO «корабль-призрак», MIASTO WIDMO «город-призрак», W MIEŚCIE WIDMO." }
  - { kind: register, text: "В значении «призрак» слово литературное, в значении «спектр» — научный термин (WIDMO ŚWIATŁA, WIDMO EMISYJNE); в быту для спектра говорят и SPEKTRUM." }
collocations:
  - { pl: "widmo wojny", ru: "угроза войны" }
  - { pl: "widmo kryzysu", ru: "призрак кризиса" }
  - { pl: "widmo światła", ru: "спектр света" }
