family:
  - { pl: "widmowy", ru: "призрачный; спектральный", relation: derived, id: widmowy }
  - { pl: "widzieć", ru: "видеть", relation: root, id: widziec }
synonyms: ["zjawa", "upiór", "duch", "spektrum"]
etymology: "Того же корня, что WIDZIEĆ «видеть»: буквально «то, что видится», как русское «видение»."
memory: "Widmo — «видение»: призрак в замке, призрак войны, а в физике — спектр, который «видно» в призме."
idioms:
