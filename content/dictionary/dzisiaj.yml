# review
id: dzisiaj
format: 2
lemma: "dzisiaj"
rank: 267
pos: adv
pron: { cyr: "дзи́сяй" }
senses:
  - id: today
    ru: "сегодня"
    examples:
      - pl: "Dzisiaj jest środa."
        ru: "Сегодня среда."
        source: { kind: tatoeba, id: 4449152 }
      - pl: "Dzisiaj pada śnieg."
        ru: "Сегодня идёт снег."
        source: { kind: tatoeba, id: 776368 }
      - pl: "Deszczowo dzisiaj."
        ru: "Сегодня дождливо."
        source: { kind: tatoeba, id: 5927975 }
  - id: today-phrases
    ru: "сегодня (в оборотах)"
    examples:
      - pl: "Wystarczy na dzisiaj."
        ru: "На сегодня хватит."
        source: { kind: tatoeba, id: 565545 }
      - pl: "Co zrobiła dzisiaj?"
        ru: "Что она сегодня сделала?"
        source: { kind: tatoeba, id: 2108478 }
      - pl: "Dzisiaj jest piątek."
        ru: "Сегодня пятница."
        source: { kind: tatoeba, id: 4449159 }
notes:
  - { kind: usage, text: "dzisiaj и dziś — одно и то же слово; dziś короче и чаще встречается на письме, dzisiaj — в разговоре." }
  - { kind: usage, text: "Обороты: na dzisiaj «на сегодня», od dzisiaj «с сегодняшнего дня», do dzisiaj «до сих пор»." }
  - { kind: usage, text: "Прилагательное — dzisiejszy «сегодняшний»: dzisiejsza gazeta «сегодняшняя газета»." }
collocations:
  - { pl: "na dzisiaj", ru: "на сегодня" }
  - { pl: "od dzisiaj", ru: "с сегодняшнего дня" }
  - { pl: "do dzisiaj", ru: "до сих пор" }
  - { pl: "dzisiaj rano", ru: "сегодня утром" }
etymology: "Праславянское *dьnьsь — «сей день»; то же самое спрятано в старом русском «днесь»."
memory: "dzisiaj = dziś «сегодня». Внутри спрятано «сей день», как в старом русском «днесь». Прилагательное — dzisiejszy «сегодняшний»."
idioms:
  - { pl: "dzisiaj tu, jutro tam", ru: "сегодня здесь, завтра там" }
  - { pl: "dzisiaj bal, jutro żal", ru: "сегодня бал, завтра жаль" }
  - { pl: "na dzisiaj wystarczy", ru: "на сегодня хватит" }
formExamples:
