# review
id: poznawac
format: 2
lemma: "poznawać"
rank: 1919
pos: verb
aspect: imperf
aspectPair: poznac
pron: { cyr: "позна́ваць" }
senses:
  - id: recognise
    ru: "узнавать (кого-либо в лицо)"
    examples:
      - pl: "Poznajesz go?"
        ru: "Ты его узнаёшь?"
        source: { kind: translated, id: 7868978 }
      - pl: "Poznajesz mnie?"
        ru: "Ты меня узнаёшь?"
        source: { kind: translated, id: 3759897 }
      - pl: "Nie poznaję ich."
        ru: "Я их не узнаю."
        source: { kind: translated, id: 3034171 }
      - pl: "Teraz cię poznaję."
        ru: "Теперь я тебя узнаю."
        source: { kind: translated, id: 4010200 }
      - pl: "Poznaję tego chłopaka."
        ru: "Я узнаю этого парня."
        source: { kind: translated, id: 7904561 }
      - pl: "Tom udawał, że nie poznaje Marii."
        ru: "Том делал вид, что не узнаёт Марию."
        source: { kind: translated, id: 5227442 }
  - id: get-to-know
    ru: "знакомиться, узнавать (новое)"
    examples:
      - pl: "Tom chce podróżować i poznawać ludzi z całego świata."
        ru: "Том хочет путешествовать и знакомиться с людьми со всего мира."
        source: { kind: translated, id: 11264450 }
      - pl: "Pierwszego roku dzieciaki poznają wszystkie litery alfabetu."
        ru: "В первый год дети узнают все буквы алфавита."
        source: { kind: translated, id: 11251925 }
      - pl: "Na początku nie byliśmy sobie bliscy. Dopiero z czasem poznawaliśmy się wzajemnie."
        ru: "Сначала мы не были близки. Только со временем мы узнавали друг друга."
        source: { kind: translated, id: 2439510 }
  - id: proverb
    ru: "в пословицах: познаётся, распознаётся"
    examples:
      - pl: "Prawdziwych przyjaciół poznaje się w biedzie."
        ru: "Настоящие друзья познаются в беде."
        source: { kind: translated, id: 516422 }
      - pl: "Prawdę poznajemy nie tylko rozumem, ale również sercem."
        ru: "Истину мы познаём не только разумом, но и сердцем."
        source: { kind: translated, id: 903420 }
notes:
  - { kind: usage, text: "Несовершенный вид к poznać. В корпусе главное значение — «узнавать в лицо»: Poznajesz mnie? «Ты меня узнаёшь?»." }
  - { kind: usage, text: "Возвратное poznawać się значит «знакомиться друг с другом»; poznawać się na czymś — «разбираться в чём-либо»." }
  - { kind: usage, text: "Формы настоящего времени идут от другой основы: poznaję, poznajesz, poznaje — без -wa-, которое есть в инфинитиве poznawać." }
  - { kind: usage, text: "Пословица Prawdziwych przyjaciół poznaje się w biedzie — точный двойник русского «Друзья познаются в беде»." }
collocations:
  - { pl: "poznajesz mnie?", ru: "ты меня узнаёшь?" }
  - { pl: "poznawać ludzi", ru: "знакомиться с людьми" }
  - { pl: "nie poznaję", ru: "я не узнаю" }
etymology: "po- + znawać, многократная форма от znać «знать». Русское «познавать» — то же самое слово, но в русском оно книжное, а польское poznawać значит прежде всего обыденное «узнавать в лицо»."
memory: "poznawać — несовершенный вид к poznać. Чаще всего это «узнавать в лицо»: Poznajesz mnie? Настоящее время идёт от другой основы: poznaję, poznajesz, poznaje."
idioms:
  - { pl: "poznajesz mnie?", ru: "ты меня узнаёшь?" }
  - { pl: "prawdziwych przyjaciół poznaje się w biedzie", ru: "друзья познаются в беде" }
  - { pl: "poznawać się na czymś", ru: "разбираться в чём-либо" }
