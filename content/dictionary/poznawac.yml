    pl: "Po tym, ile ktoś jest skłonny poświęcić czemuś czasu, poznajemy, jak bardzo to dla niego ważne."
    ru: "По тому, сколько времени кто-то готов чему-то посвятить, мы узнаём, насколько это для него важно."
