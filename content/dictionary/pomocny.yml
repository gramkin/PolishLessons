etymology: "От POMOC «помощь», а то — от MOC «сила, мощь» с приставкой PO-, из праславянского *mogti «мочь». Буквально это «при-силье»: помощь есть приложение силы к чужому делу. Русское «помощь» собрано из тех же частей и того же корня, только с иным исходом согласного: там, где польский дал c, русский дал щ, по разному развитию праславянского *tj. Отсюда вся пара соответствий: MOC и «мощь», POMOC и «помощь», NOC и «ночь». Правило простое и работает в обе стороны: польское c на конце корня часто отвечает русскому щ или ч."
memory: "От pomoc «помощь», от moc «мощь». Польское c отвечает русскому щ/ч: moc — мощь, noc — ночь. Читается «помо́цны», с «ц». И не путать с pomocniczy «вспомогательный»: о человеке — pomocny."
