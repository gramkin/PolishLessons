notes:
  - { kind: false-friend, text: "Ловушка внутри польского, и она близкая. POMOCNY значит «полезный, готовый помочь», а POMOCNICZY — «вспомогательный»: CZASOWNIK POMOCNICZY «вспомогательный глагол», PERSONEL POMOCNICZY «вспомогательный персонал». Слова различаются одним слогом, но смешивать их нельзя: о человеке говорят POMOCNY, о роли и функции — POMOCNICZY. В русском прямой пары нет вовсе, слова «помочный» не существует, так что опереться на знакомое не получится — зато POMOC «помощь» узнаётся сразу." }
  - { kind: usage, text: "Прилагательное качественное, и степени сравнения у него есть: POMOCNIEJSZY и описательное BARDZIEJ POMOCNY, оба употребительны. В этом черновике их форм нет, написаны только одиннадцать форм положительной степени, но это особенность выборки, а не языка. О человеке слово звучит как похвала: BYŁ BARDZO POMOCNY — «он очень помог, был очень отзывчив». О вещи оно ближе к «полезный»: POMOCNA KSIĄŻKA, POMOCNE NARZĘDZIE." }
  - { kind: pronunciation, text: "Читается «помо́цны», в три слога, с ударением на предпоследнем, то есть на MOC. Буква c здесь даёт «ц», а не «ч» и не «к»: POMOCNY — «помо́цны», как и POMOC — «по́моц». Это стоит отметить отдельно, потому что русский корень «помощь» со щ подталкивает произнести мягко. Мужско-личная форма POMOCNI звучит «помо́цни», с мягким ni." }
  - { kind: government, text: "Чем или в чём полезен — предлог W с предложным падежом: POMOCNY W NAUCE, POMOCNY W PRACY. Кому полезен — дательный без предлога: BYŁ MI BARDZO POMOCNY «он мне очень помог». Есть и оборот с PRZY и предложным, когда речь о сопутствующем деле: POMOCNA PRZY GOTOWANIU. Русский в первом случае требует предлога «в» с предложным, так что перенос прямой, а вот дательный без предлога по-русски передаётся иначе: не «полезен мне», а «помог мне»." }
