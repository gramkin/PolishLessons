# review
id: otaczac
format: 2
lemma: "otaczać"
rank: 2332
pos: verb
aspect: imperf
pron: { cyr: "ота́чаць" }
senses:
  - id: surround
    ru: "окружать"
    examples:
      - pl: "Otaczają mnie wrogowie."
        ru: "Меня окружают враги."
        source: { kind: translated, id: 12077631 }
      - pl: "Liny otaczają to miejsce."
        ru: "Канаты окружают это место."
        source: { kind: translated, id: 562244 }
      - pl: "Staw otaczały drzewa."
        ru: "Пруд окружали деревья."
        source: { kind: translated, id: 914934 }
  - id: envelop
    ru: "окружать (заботой, любовью)"
    examples:
      - pl: "Tę dziewczynę otacza miłość jej rodziny."
        ru: "Эту девочку окружает любовь её семьи."
        source: { kind: translated, id: 758410 }
      - pl: "Lubię otaczać się pająkami."
        ru: "Я люблю окружать себя пауками."
        source: { kind: translated, id: 9463293 }
notes:
  - { kind: government, text: "Винительный падеж: otaczać dom, otaczać kogoś opieką «окружать кого-л. заботой» — чем, творительным." }
  - { kind: false-friend, text: "От taczać «катать», корень тот же, что в toczyć «катить». Окружать — значит «обкатывать вокруг». Русское «окружать» построено на круге, польское — на катании." }
  - { kind: usage, text: "Причастие otaczający значит «окружающий»: środowisko otaczające «окружающая среда», хотя чаще говорят środowisko naturalne." }
  - { kind: usage, text: "Совершенный вид — otoczyć. С się — «окружать себя»: otaczać się ludźmi." }
collocations:
  - { pl: "otaczać opieką", ru: "окружать заботой" }
  - { pl: "otaczać się kimś", ru: "окружать себя кем-л." }
etymology: "От taczać «катать», родня toczyć «катить»: окружать — «обкатывать вокруг»."
memory: "otaczać — «окружать», винительный падеж; чем окружают — творительный: otaczać opieką «окружать заботой». Совершенный вид — otoczyć."
idioms:
  - { pl: "otaczać opieką", ru: "окружать заботой" }
