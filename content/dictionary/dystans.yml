notes:
  - { kind: false-friend, text: "Слово покрывает две области, и вторая русскому непривычна. В прямом смысле DYSTANS — это спортивная дистанция и расстояние между предметами, и здесь оно совпадает с русским. Но есть и переносное: MIEĆ DYSTANS DO SIEBIE значит «уметь смеяться над собой», относиться к себе без лишней важности, и это одно из самых частых польских похвальных выражений. Русское «дистанция по отношению к себе» так не звучит, и переводить приходится описательно. Обычное физическое расстояние чаще называют ODLEGŁOŚĆ." }
  - { kind: government, text: "Дистанция до чего — предлог DO с родительным: DYSTANS DO METY. Между чем — предлог MIĘDZY с творительным: DYSTANS MIĘDZY AUTAMI, как и по-русски. Держать дистанцию по отношению к кому — TRZYMAĆ DYSTANS WOBEC KOGOŚ, предлог WOBEC с родительным, тогда как русский говорит «с кем-то» или «по отношению к». А в переносном обороте предлог другой: DYSTANS DO SIEBIE, с родительным после DO." }
  - { kind: usage, text: "Одиннадцать форм, мужской род неодушевлённый. В местном падеже появляется смягчение: NA DYSTANSIE, а не «na dystansu», и это обычное чередование S и SI перед окончанием -E. Множественное число живёт в спорте: DYSTANSE KRÓTKIE I DŁUGIE «короткие и длинные дистанции». В переносном значении слово остаётся в единственном, потому что речь о свойстве, а не о мере." }
  - { kind: pronunciation, text: "Читается «ды́станс», два слога, ударение на первом. Буква Y звучит как «ы», поэтому начало слова «ды», а не «ди», и это главное отличие от русского. Конечное S остаётся глухим. В местном падеже DYSTANSIE слышно «дыста́нсе», с мягким «с» перед «е» и с ударением на предпоследнем слоге, как всегда в польском." }
  - { kind: register, text: "Слово нейтральное, частое в спорте, на дороге и в разговорах о характере. Частые обороты: DYSTANS DO METY «дистанция до финиша», ZACHOWAĆ DYSTANS «соблюдать дистанцию», TRZYMAĆ DYSTANS «держать дистанцию», MIEĆ DYSTANS DO SIEBIE «уметь смеяться над собой». Последнее стоит выучить целиком: это устойчивая похвала, и ею описывают человека, который не принимает себя слишком всерьёз." }
collocations:
