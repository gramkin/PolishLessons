etymology: "Из латинского DISTANTIA «расстояние», от DISTARE «стоять врозь», через французское DISTANCE. В русский слово пришло из того же источника и тем же путём, поэтому значения совпадают почти целиком. Расходятся языки только в переносном слое: польский развил из идеи расстояния понятие внутренней сдержанности и самоиронии, и оборот DYSTANS DO SIEBIE стал похвалой. Для простого физического расстояния у польского есть и своё слово, ODLEGŁOŚĆ, от LEŻEĆ, буквально «отлёглость», и в быту оно встречается чаще латинского."
memory: "Прямое значение как в русском, но читается «ды́станс», через «ы». Для обычного расстояния поляк чаще скажет odległość, своё слово от leżeć. Главное, чего в русском нет: mieć dystans do siebie значит «уметь смеяться над собой», и это устойчивая похвала. Управление поправить: trzymać dystans WOBEC kogoś с родительным. В местном падеже смягчение, na dystansie."
idioms:
