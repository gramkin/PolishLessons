notes:
  - { kind: false-friend, text: "DZIEKAN — «декан», но с DZIE: «дзе́кан». Деканат как учреждение — DZIEKANAT: IŚĆ DO DZIEKANATU, «идти в деканат». Ректор — REKTOR, факультет — WYDZIAŁ." }
  - { kind: usage, text: "Десять форм, мужской род, лицо. Множественное — DZIEKANI. Местный и звательный — DZIEKANIE: PANIE DZIEKANIE." }
  - { kind: government, text: "Декан факультета — DZIEKAN WYDZIAŁU, родительный. Идти к декану — IŚĆ DO DZIEKANA. Обращение — PANIE DZIEKANIE или PANI DZIEKAN." }
  - { kind: pronunciation, text: "Читается «дзе́кан»: DZIE — мягкое «дзе». Ударение на первом слоге. DZIEKANIE — «дзека́не»." }
collocations:
  - { pl: "dziekan wydziału", ru: "декан факультета" }
  - { pl: "prodziekan", ru: "заместитель декана" }
  - { pl: "panie dziekanie", ru: "господин декан" }
family:
