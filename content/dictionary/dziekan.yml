        ru: "Мне нужно идти к декану по поводу экзамена."
        source: { kind: authored }
  - id: church
    ru: "декан, благочинный (церк.)"
    examples:
      - pl: "Dziekan odprawił mszę w katedrze."
        ru: "Декан отслужил мессу в соборе."
