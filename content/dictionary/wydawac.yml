# review
id: wydawac
format: 2
lemma: "wydawać"
rank: 278
pos: verb
aspect: imperf
pron: { cyr: "выда́ваць" }
senses:
  - id: seem
    ru: "wydawać się — казаться"
    note: "Wydaje mi się, że… — «Мне кажется, что…», безлично и с дательным."
    examples:
      - pl: "Wydaje mi się, że tak."
        ru: "Мне кажется, да."
        source: { kind: tatoeba, id: 5516891 }
      - pl: "Tylko ci się tak wydaje."
        ru: "Только тебе так кажется."
        source: { kind: tatoeba, id: 6328309 }
      - pl: "To trudniejsze, niż się wydaje."
        ru: "Это труднее, чем кажется."
        source: { kind: tatoeba, id: 3518439 }
  - id: spend
    ru: "тратить (деньги)"
    examples:
      - pl: "Oni łatwo wydają pieniądze."
        ru: "Они легко тратят деньги."
        source: { kind: translated, id: 728445 }
      - pl: "Może wydawać pieniądze na co chce."
        ru: "Он может тратить деньги на что хочет."
        source: { kind: translated, id: 900862 }
      - pl: "Zaprzestań wydawania pieniędzy na głupie rzeczy."
        ru: "Перестань тратить деньги на глупости."
        source: { kind: translated, id: 13309811 }
  - id: emit-publish
    ru: "издавать (звук, книгу, журнал)"
    examples:
      - pl: "Trąbka wydawała jasny dźwięk."
        ru: "Труба издавала ясный звук."
        source: { kind: translated, id: 3744932 }
      - pl: "Prawie każde czasopismo jest wydawane w stolicy."
        ru: "Почти каждый журнал издаётся в столице."
        source: { kind: translated, id: 2772105 }
      - pl: "Jej mąż planuje wydawanie nowego miesięcznika."
        ru: "Её муж планирует издавать новый ежемесячник."
        source: { kind: translated, id: 903531 }
notes:
  - { kind: usage, text: "Самое частое — безличное wydaje mi się «мне кажется»: Wydaje mi się, że tak. Лицо стоит в дательном падеже." }
  - { kind: usage, text: "wydawać pieniądze значит «тратить деньги» — не «выдавать»: Wydaje za dużo «Он слишком много тратит»." }
  - { kind: usage, text: "Третье значение — «издавать»: wydawać dźwięk «издавать звук», wydawać książkę «издавать книгу»." }
  - { kind: usage, text: "Совершенный вид — wydać: Wydałem wszystkie pieniądze." }
collocations:
  - { pl: "wydaje mi się", ru: "мне кажется" }
  - { pl: "wydawać pieniądze", ru: "тратить деньги" }
  - { pl: "wydawać dźwięk", ru: "издавать звук" }
  - { pl: "wydawać książkę", ru: "издавать книгу" }
etymology: "Из wy- + dawać «давать»; ср. русское «выдавать», но значения разошлись: в польском это ещё и «казаться», и «тратить»."
memory: "Главное — Wydaje mi się, że… «Мне кажется, что…». Кроме того wydawać значит «тратить» (pieniądze) и «издавать» (dźwięk, książkę)."
idioms:
  - { pl: "wydaje mi się", ru: "мне кажется" }
  - { pl: "wydawać pieniądze", ru: "тратить деньги" }
  - { pl: "wydawać na świat", ru: "производить на свет" }
