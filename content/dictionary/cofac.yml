# review
id: cofac
format: 2
lemma: "cofać"
rank: 2545
pos: verb
pron: { cyr: "цо́фаць" }
senses:
  - id: back-up
    ru: "подавать назад, отодвигать назад"
    examples:
      - pl: "Cofam samochód do garażu."
        ru: "Я подаю машину назад в гараж."
        source: { kind: authored }
      - pl: "Kierowca cofa autobus na przystanek."
        ru: "Водитель подаёт автобус назад к остановке."
        source: { kind: authored }
  - id: retract
    ru: "отменять, отзывать (слово, решение, подпись)"
    examples:
      - pl: "Cofam swoje słowa."
        ru: "Я беру свои слова назад."
        source: { kind: authored }
      - pl: "Cofamy wniosek z powodu błędu."
        ru: "Мы отзываем заявление из-за ошибки."
        source: { kind: authored }
  - id: retreat
    ru: "cofać się — отступать, отходить назад"
    examples:
      - pl: "Rzeka cofa się od brzegu."
        ru: "Река отступает от берега."
        source: { kind: authored }
      - pl: "Lodowce cofają się z roku na rok."
        ru: "Ледники отступают год от года."
        source: { kind: authored }
notes:
  - { kind: government, text: "cofać coś — ВИНИТЕЛЬНЫЙ падеж: cofać samochód, zegarek, słowo, decyzję. Возвратное cofać się значит «отступать, отходить»: woda cofa się, tłum cofa się. Дополнением бывает и человек, поэтому мужсколичное cofani существует — PoliMorf даёт ему помету ppas:pl:nom.voc:m1.p1 — например об учениках, оставленных на второй год." }
  - { kind: usage, text: "Несовершенный вид; совершенный — cofnąć (cofnąć słowo «отозвать слово»). Существительное cofanie — обычный термин из правил дорожного движения: cofanie na autostradzie jest zabronione." }
  - { kind: false-friend, text: "Одного русского слова для cofać нет: в зависимости от контекста это «подавать назад» (о машине), «отодвигать» (о предмете), «переводить назад» (о часах), «отзывать» или «отменять» (о решении) и «отступать» (с się). Запоминать приходится не слово, а набор соответствий." }
  - { kind: usage, text: "Надёжной этимологии у этого глагола нет, и родственника в русском тоже, так что опоры для запоминания корень не даёт — зато набор конструкций устойчив и предсказуем." }
collocations:
  - { pl: "cofać samochód", ru: "подавать машину назад" }
  - { pl: "cofać słowo", ru: "брать слово назад" }
  - { pl: "cofać się", ru: "отступать, отходить назад" }
family:
  - { pl: "cofnąć", ru: "отодвинуть назад; отозвать", relation: aspect, id: cofnac }
  - { pl: "cofanie", ru: "движение задним ходом", relation: derived }
etymology: "Происхождение этого глагола надёжно не установлено: убедительной праславянской основы для него нет, родственников в русском тоже. В черновике карточки стояла пометка «niem. zaufen», но такого немецкого слова нет, и повторять эту догадку я не стал. Внутри польского слово вполне обжилось: от него идут cofnąć, cofanie и cofka."
memory: "cofać — «подавать назад» в самом широком смысле: машину, часы, решение, слово. С się — «отступать». Родственного русского слова нет, так что держитесь за конструкции: cofać coś (винительный), cofać się."
idioms:
  - { pl: "cofać słowo", ru: "брать слово назад" }
  - { pl: "nie ma co cofać", ru: "отступать некуда" }
