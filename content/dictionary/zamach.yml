# review
id: zamach
format: 2
lemma: "zamach"
rank: 2194
pos: noun
pron: { cyr: "за́мах" }
senses:
  - id: coup
    ru: "покушение; переворот (zamach stanu)"
    examples:
      - pl: "Próba zamachu stanu została udaremniona w ostatnim momencie."
        ru: "Попытка государственного переворота была сорвана в последний момент."
        source: { kind: translated, id: 675536 }
      - pl: "Zamachy stanu to coś normalnego w krajach afrykańskich."
        ru: "Государственные перевороты — обычное дело в африканских странах."
        source: { kind: translated, id: 13335435 }
      - pl: "Proces przeciwko osobom, które próbowały dokonać zamachu stanu, nie jest polowaniem na czarownice."
        ru: "Процесс против тех, кто пытался совершить государственный переворот."
        source: { kind: translated, id: 13456764 }
  - id: swing
    ru: "размах, взмах"
    examples:
      - pl: "Zabić dwie muchy za jednym zamachem."
        ru: "Убить двух зайцев одним махом."
        source: { kind: translated, id: 7891533 }
      - pl: "Jednym zamachem ściął gałąź."
        ru: "Одним махом он срубил ветку."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Два далёких значения: физический «размах, взмах» и политическое «покушение, переворот». Второе почти всегда в составе zamach stanu «государственный переворот» или zamach na kogoś «покушение на кого-л.»." }
  - { kind: government, text: "Покушение на кого — na с винительным: zamach na prezydenta. Одним махом — za jednym zamachem, с творительным." }
  - { kind: false-friend, text: "Корень machać «махать» — ср. русское «махать», «замах». Русское «замах» сохранило только физический смысл." }
  - { kind: usage, text: "Za jednym zamachem «одним махом» — точный аналог русской идиомы, в корпусе про двух мух вместо зайцев." }
collocations:
  - { pl: "zamach stanu", ru: "государственный переворот" }
  - { pl: "za jednym zamachem", ru: "одним махом" }
etymology: "От machać «махать»; ср. русское «махать», «замах». Политическое значение развилось из образа занесённой руки."
memory: "zamach — и «размах» (za jednym zamachem «одним махом»), и «покушение, переворот» (zamach stanu). Русское «замах» оставило только первое."
idioms:
  - { pl: "zamach stanu", ru: "государственный переворот" }
  - { pl: "za jednym zamachem", ru: "одним махом" }
