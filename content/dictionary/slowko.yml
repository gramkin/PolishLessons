notes:
  - { kind: usage, text: "Уменьшительное от SŁOWO, и при этом происходит повышение гласной: O переходит в Ó, отсюда SŁÓWKO, а не «słowko». Это регулярное польское явление: закрытый слог тянет за собой Ó, и то же видно в STÓŁ при STOŁU, в DÓŁ при DOŁU, в MÓJ при MOJEGO. Второе: суффикс -KO несёт беглую гласную, которая появляется в родительном множественного — SŁÓWEK, а не «słówk». Третье: дательный и местный единственного совпадают, SŁÓWKU. Итого восемь форм. Любопытно, что в самом SŁOWO никакого Ó нет, и появляется оно только в уменьшительном, потому что слог там закрывается согласным W." }
  - { kind: false-friend, text: "Значение то же, что у русского «словечка», но употребление шире, и одно из них учащемуся понадобится сразу. SŁÓWKA в школьном и курсовом языке означают «слова для заучивания», лексику: POWTARZAĆ SŁÓWKA «повторять слова», ZESZYT DO SŁÓWEK «тетрадь для слов». По-русски в этом смысле говорят просто «слова», и уменьшительное звучало бы странно. Второе употребление — оборот NA SŁÓWKO: MOŻNA NA SŁÓWKO? значит «можно на пару слов?», и это стандартная вежливая формула, когда отзывают человека в сторону. Третье: DOBRE SŁÓWKO значит «доброе слово», ходатайство за кого-то." }
  - { kind: government, text: "Средний род. Чьё словечко — родительный или притяжательное: ANI SŁÓWKA OD NIEGO «ни словечка от него». «На пару слов» — предлог NA с винительным: NA SŁÓWKO. Частотные обороты: ANI SŁÓWKA «ни словечка», PARĘ SŁÓWEK «пара словечек», POWTARZAĆ SŁÓWKA «повторять слова», WTRĄCIĆ SŁÓWKO «вставить словечко». Отрицание требует родительного: NIE POWIEDZIAŁ ANI SŁÓWKA, и это то же правило, что в русском «не сказал ни словечка»." }
  - { kind: pronunciation, text: "Читается «су́фко», два слога, ударение на первом. Буква Ł даёт неслоговое «у», а Ó — тоже «у», поэтому начало слова звучит сдвоенным «су». Буква W перед глухим K оглушается до «ф», и получается «суфко», без всякого «л» и «в». Это слово удобно для проверки сразу двух правил: Ł никогда не «л», а W перед глухим — «ф». В родительном множественного SŁÓWEK слышно «су́фэк». В форме SŁÓWKIEM — «су́фкем»." }
