etymology: "Уменьшительное от SŁOWO, из праславянского *slovo, того же слова, что русское «слово». Суффикс -KO образует уменьшительные от средних существительных и отвечает русскому -ЧКО и -ЕЧКО: SŁÓWKO и «словечко», OKIENKO и «окошко». Повышение O в Ó объясняется историей долгих гласных: в закрытом слоге старое o удлинилось и перешло в звук, который сегодня читается как «у», а на письме обозначается Ó. Поэтому Ó появляется именно в уменьшительном, где слог закрывается согласным W, и отсутствует в исходном SŁOWO с открытым слогом. Из того же гнезда идут SŁOWNIK «словарь», SŁOWNY «словесный; человек слова» и PRZYSŁOWIE «пословица», где виден тот же корень, что в русском."
memory: "Уменьшительное от słowo, но с повышением гласной: słówko, не «słowko» — закрытый слог тянет ó, как stół при stołu. Беглая e в родительном множественного: słówek. Читается «су́фко»: ł это «у», ó это «у», а w перед глухим k даёт «ф» — ни «л», ни «в» в слове не слышно. В курсах słówka означает «слова для заучивания», а na słówko — «на пару слов»."
