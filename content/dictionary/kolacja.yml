# review
id: kolacja
format: 2
lemma: "kolacja"
rank: 594
pos: noun
pron: { cyr: "коля́цья" }
senses:
  - id: supper
    ru: "ужин"
    note: "Ложный друг: это именно вечерняя еда, а не «коллация»."
    examples:
      - pl: "Kolacja jest prawie gotowa."
        ru: "Ужин почти готов."
        source: { kind: tatoeba, id: 704028 }
      - pl: "Kolacja wkrótce będzie gotowa."
        ru: "Ужин скоро будет готов."
        source: { kind: tatoeba, id: 2151503 }
      - pl: "Kolacja gotowa."
        ru: "Ужин готов."
        source: { kind: translated, id: 442772 }
  - id: have-supper
    ru: "jeść kolację — ужинать"
    note: "robić kolację «готовить ужин», na kolację «на ужин»."
    examples:
      - pl: "Jemy kolację."
        ru: "Мы ужинаем."
        source: { kind: tatoeba, id: 12940598 }
      - pl: "Właśnie robię kolację."
        ru: "Я как раз готовлю ужин."
        source: { kind: tatoeba, id: 6109618 }
      - pl: "Co dziś na kolację?"
        ru: "Что сегодня на ужин?"
        source: { kind: tatoeba, id: 402651 }
  - id: after-before
    ru: "po kolacji / przed kolacją — после ужина / перед ужином"
    note: "po с предложным, przed с творительным."
    examples:
      - pl: "Po kolacji poszedł spać."
        ru: "После ужина он пошёл спать."
        source: { kind: tatoeba, id: 359364 }
      - pl: "Kto pozmywa naczynia po kolacji?"
        ru: "Кто будет мыть посуду после ужина?"
        source: { kind: tatoeba, id: 13789513 }
      - pl: "Muszę skończyć zadanie domowe przed kolacją."
        ru: "Мне надо закончить домашнее задание перед ужином."
        source: { kind: translated, id: 359832 }
notes:
  - { kind: false-friend, text: "Ложный друг: kolacja — это «ужин», вечерняя еда. Русская «коллация» — редкое книжное слово совсем о другом, а польское значение самое будничное." }
  - { kind: government, text: "po kolacji «после ужина» — предложный падеж; przed kolacją «перед ужином» — творительный; na kolację «на ужин» — винительный." }
  - { kind: usage, text: "Три приёма пищи: śniadanie «завтрак», obiad «обед», kolacja «ужин». Obiad при этом ближе к раннему вечеру, чем русский обед." }
  - { kind: usage, text: "Глагол — jeść kolację или kolacjować (реже); «приглашать на ужин» — zaprosić na kolację." }
collocations:
  - { pl: "jeść kolację", ru: "ужинать" }
  - { pl: "na kolację", ru: "на ужин" }
  - { pl: "po kolacji", ru: "после ужина" }
  - { pl: "przed kolacją", ru: "перед ужином" }
family:
  - { pl: "śniadanie", ru: "завтрак", relation: derived }
  - { pl: "obiad", ru: "обед", relation: derived }
  - { pl: "kolacyjny", ru: "ужинный", relation: derived }
etymology: "Из латинского collatio «складчина, совместная трапеза» через позднелатинское значение вечерней монастырской еды. Русская «коллация» пришла оттуда же, но осталась книжным редким словом."
memory: "kolacja — ложный друг: по-польски это просто «ужин», самая будничная вечерняя еда, тогда как русская «коллация» — редкое книжное слово. Падежи расходятся по предлогам: po kolacji «после ужина» с предложным, przed kolacją «перед ужином» с творительным, na kolację «на ужин» с винительным. И помните весь ряд: śniadanie, obiad, kolacja."
idioms:
  - { pl: "jeść kolację", ru: "ужинать" }
  - { pl: "na kolację", ru: "на ужин" }
  - { pl: "zaprosić na kolację", ru: "пригласить на ужин" }
formExamplesSkip:
  - { form: "kolacyj", reason: "архаичный вариант родительного множественного; современная форма — kolacji, и в корпусе нет ни одного примера" }
