notes:
  - { kind: false-friend, text: "POPRAWA — «улучшение» или «исправление», а не «поправка». Поправка к закону или тексту — POPRAWKA, и тем же словом называют пересдачу экзамена: MAM POPRAWKĘ Z MATEMATYKI. А POPRAWNY — «правильный, корректный»: POPRAWNA ODPOWIEDŹ." }
  - { kind: usage, text: "Десять форм в таблице, но живут пять, в единственном числе. В дательном и местном падежах W смягчается: PO POPRAWIE. Множественное и звательная форма почти не употребляются." }
  - { kind: government, text: "Улучшение чего-то — POPRAWA CZEGOŚ, родительный: POPRAWA ZDROWIA. Ждать улучшения — CZEKAĆ NA POPRAWĘ, NA с винительным. Для поднятия настроения — NA POPRAWĘ HUMORU." }
  - { kind: pronunciation, text: "Читается «попра́ва», три слога, ударение на втором. В форме POPRAWIE: «попра́ве»." }
  - { kind: register, text: "Слово нейтральное, частое в новостях: POPRAWA KONIUNKTURY, POPRAWA BEZPIECZEŃSTWA. Пиво или шоколадка NA POPRAWĘ HUMORU — шутливо «для настроения»." }
collocations:
  - { pl: "wyraźna poprawa", ru: "заметное улучшение" }
  - { pl: "poprawa wyników", ru: "улучшение результатов" }
  - { pl: "poprawa warunków", ru: "улучшение условий" }
family:
  - { pl: "poprawić", ru: "улучшить, исправить", relation: root, id: poprawic }
  - { pl: "poprawka", ru: "поправка; пересдача", relation: derived, id: poprawka }
  - { pl: "poprawny", ru: "правильный, корректный", relation: derived }
etymology: "От POPRAWIĆ «исправить, улучшить», того же корня, что PRAWY «правый, правильный» и русские «править», «поправить». Русская «поправка» и польская POPRAWA — родня, но значения разошлись."
memory: "Poprawa — улучшение, исправление; поправка — poprawka. Читается «попра́ва». Obiecać poprawę — обещать исправиться. Na poprawę humoru — для поднятия настроения."
idioms:
  - { pl: "obiecać poprawę", ru: "обещать исправиться" }
  - { pl: "na poprawę humoru", ru: "для поднятия настроения" }
