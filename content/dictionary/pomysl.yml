# review
id: pomysl
format: 2
lemma: "pomysł"
rank: 322
pos: noun
pron: { cyr: "по́мысу" }
senses:
  - id: idea
    ru: "идея, замысел, задумка"
    examples:
      - pl: "Mam inny pomysł."
        ru: "У меня есть другая идея."
        source: { kind: tatoeba, id: 8658874 }
      - pl: "To był mój pomysł."
        ru: "Это была моя идея."
        source: { kind: tatoeba, id: 8770353 }
      - pl: "To jest ciekawy pomysł."
        ru: "Это интересная мысль."
        source: { kind: tatoeba, id: 13223696 }
  - id: ideas
    ru: "идея (мысль, предложение)"
    examples:
      - pl: "Pomysłów nie brakuje."
        ru: "В идеях недостатка нет."
        source: { kind: tatoeba, id: 744241 }
      - pl: "On jest pełen nowych pomysłów."
        ru: "Он полон новых идей."
        source: { kind: tatoeba, id: 357013 }
      - pl: "Nie podsuwaj mu żadnych pomysłów."
        ru: "Не подавай ему никаких идей."
        source: { kind: tatoeba, id: 3499750 }
notes:
  - { kind: false-friend, text: "pomysł — «идея, задумка», а не «помысел». Русскому «мысль» отвечает myśl, а pomysł — то, что придумали." }
  - { kind: usage, text: "wpaść na pomysł значит «придумать»: Wpadłem na pomysł «Мне пришла идея»." }
  - { kind: usage, text: "dobry pomysł — «хорошая идея», mieć pomysł na coś — «иметь идею насчёт чего-то»." }
collocations:
  - { pl: "dobry pomysł", ru: "хорошая идея" }
  - { pl: "wpaść na pomysł", ru: "придумать, додуматься" }
  - { pl: "mieć pomysł", ru: "иметь идею" }
  - { pl: "żaden pomysł", ru: "никакая идея" }
etymology: "Из po- + myśl «мысль», праславянское *myslь; то же гнездо, что русские «мысль», «помысел», «замысел»."
memory: "pomysł — «идея, задумка», а не «помысел». Просто myśl — «мысль», а pomysł — то, что придумали. Wpaść na pomysł значит «придумать»."
idioms:
  - { pl: "dobry pomysł", ru: "хорошая идея" }
  - { pl: "wpaść na pomysł", ru: "придумать, додуматься" }
  - { pl: "nie mam pomysłu", ru: "ничего не приходит в голову, без понятия" }
