# review
id: domowy
format: 2
lemma: "domowy"
rank: 1329
pos: adj
pron: { cyr: "домо́вы" }
senses:
  - id: homework
    ru: "praca domowa, zadanie domowe — домашнее задание"
    examples:
      - pl: "Zrobię zadanie domowe."
        ru: "Я сделаю домашнее задание."
        source: { kind: tatoeba, id: 1564697 }
      - pl: "Czy skończyłeś już zadanie domowe?"
        ru: "Ты уже закончил домашнее задание?"
        source: { kind: tatoeba, id: 575611 }
      - pl: "Mam pracę domową."
        ru: "У меня есть домашнее задание."
        source: { kind: translated, id: 4735427 }
  - id: home-adj
    ru: "домашний, связанный с домом"
    examples:
      - pl: "To są moje kapcie domowe."
        ru: "Это мои домашние тапочки."
        source: { kind: tatoeba, id: 13789502 }
      - pl: "W tym hotelu panuje domowa atmosfera."
        ru: "В этой гостинице домашняя атмосфера."
        source: { kind: translated, id: 349308 }
      - pl: "Jaki jest twój adres domowy?"
        ru: "Какой у тебя домашний адрес?"
        source: { kind: translated, id: 564062 }
  - id: homemade
    ru: "домашнего приготовления; домашний бюджет"
    examples:
      - pl: "Kiedy ostatnio jadłeś domowy obiad?"
        ru: "Когда ты последний раз ел домашний обед?"
        source: { kind: translated, id: 1453908 }
      - pl: "Czy ktoś wie jak zrobić domowy majonez?"
        ru: "Кто-нибудь знает, как сделать домашний майонез?"
        source: { kind: translated, id: 13239037 }
      - pl: "Nasz domowy budżet w zeszłym miesiącu zszedł pod kreskę."
        ru: "Наш домашний бюджет в прошлом месяце ушёл в минус."
        source: { kind: translated, id: 924610 }
notes:
  - { kind: usage, text: "Praca domowa и zadanie domowe оба значат «домашнее задание». Глагол — odrabiać pracę domową «делать домашнее задание»." }
  - { kind: usage, text: "Wojna domowa — «гражданская война», буквально «домашняя». Areszt domowy — «домашний арест»." }
  - { kind: false-friend, text: "Форма domowi принадлежит существительному dom «дом» (дательный падеж), карточка которого уже есть, а не этому прилагательному." }
  - { kind: usage, text: "Zwierzę domowe — «домашнее животное», kura domowa — шутливо о домохозяйке." }
collocations:
  - { pl: "praca domowa", ru: "домашнее задание" }
  - { pl: "zadanie domowe", ru: "домашнее задание" }
  - { pl: "wojna domowa", ru: "гражданская война" }
  - { pl: "zwierzę domowe", ru: "домашнее животное" }
etymology: "От dom «дом» с суффиксом -owy, из праславянского *domovъ. Русское «домовый» и «домашний» — из того же гнезда."
memory: "domowy — «домашний». Praca domowa и zadanie domowe оба значат «домашнее задание». Wojna domowa — это «гражданская война». Осторожно: форма domowi принадлежит существительному dom."
idioms:
  - { pl: "praca domowa", ru: "домашнее задание" }
  - { pl: "wojna domowa", ru: "гражданская война" }
  - { pl: "zwierzę domowe", ru: "домашнее животное" }
formExamplesSkip:
  - { form: "domowi", reason: "в корпусе эта форма принадлежит существительному dom «дом» в дательном падеже (карточка dom), а не прилагательному" }
