        ru: "Это смертный грех, а не обыденный."
        source: { kind: authored }
notes:
  - { kind: pronunciation, text: "Прилагательное держит твёрдое t, хотя существительное, от которого оно образовано, кончается на мягкое ć: ŚMIERĆ, но ŚMIERTELNY, ŚMIERTELNIK. И это не прихоть: мягкое ć в śmierć появилось позже, перед мягким окончанием, а прилагательное сохранило старую основу *sъmьrt-. Русский не смягчал её вовсе, поэтому «смерть» и «смертельный» выглядят одинаково твёрдыми. Здесь консервативен как раз русский, а польское ć — новшество." }
  - { kind: usage, text: "Слово покрывает два русских сразу. ŚMIERTELNY — это и «смертельный»: dawka śmiertelna, śmiertelny cios, wypadek śmiertelny, — и «смертный»: wszyscy jesteśmy śmiertelni, grzech śmiertelny. Существительное ŚMIERTELNIK значит «смертный» о человеке. Выбор русского перевода подсказывает только существительное рядом." }
collocations:
  - { pl: "dawka śmiertelna", ru: "смертельная доза" }
  - { pl: "wypadek śmiertelny", ru: "смертельный случай" }
  - { pl: "grzech śmiertelny", ru: "смертный грех" }
family:
  - { pl: "śmierć", ru: "смерть", relation: root, id: smierc }
  - { pl: "śmiertelnik", ru: "смертный", relation: derived }
  - { pl: "nieśmiertelny", ru: "бессмертный", relation: antonym }
etymology: "От ŚMIERĆ, из праславянского *sъmьrtь — то же слово, что русская «смерть». Прилагательное образовано от старой основы на твёрдое t, и потому в нём t сохранилось: śmiertelny, как и наше «смертельный». Мягкое ć у существительного развилось уже в польском, перед мягким окончанием, так что пара śmierć и śmiertelny выглядит неровно только на первый взгляд."
memory: "Существительное мягкое, śmierć, а прилагательное твёрдое, śmiertelny — как наши «смерть» и «смертельный». И значит оно сразу «смертельный» и «смертный»."
