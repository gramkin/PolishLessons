notes:
  - { kind: false-friend, text: "CZOŁG — «танк». Слово TANK в польском тоже есть, но это «цистерна, бак»: TANKOWIEC — «танкер». Танкист — CZOŁGISTA. От глагола CZOŁGAĆ SIĘ — «ползти»." }
  - { kind: usage, text: "Девять форм, мужской род, неодушевлённое. Родительный — CZOŁGU. Множественное — CZOŁGI: G перед I смягчается в произношении." }
  - { kind: government, text: "В танке — W CZOŁGU, местный. Ехать на танке — JECHAĆ CZOŁGIEM, творительный. Бороться с танками — WALCZYĆ Z CZOŁGAMI." }
  - { kind: pronunciation, text: "Читается «чоук», один слог: Ł — «у», конечное G оглушается в «к». CZOŁGU — «чо́угу», CZOŁGI — «чо́уги»." }
collocations:
  - { pl: "kolumna czołgów", ru: "танковая колонна" }
  - { pl: "czołg bojowy", ru: "боевой танк" }
  - { pl: "jak czołg", ru: "напролом, как танк" }
family:
  - { pl: "czołgać się", ru: "ползти", relation: root }
  - { pl: "czołgista", ru: "танкист", relation: derived }
  - { pl: "wojsko", ru: "армия", relation: root, id: wojsko }
etymology: "От глагола CZOŁGAĆ SIĘ «ползти»: танк ползёт по земле. Русские взяли английское TANK, а поляки создали своё слово."
memory: "Czołg — танк: ползёт, как czołgać się — ползти. Читается «чоук». Tank — цистерна. Czołgista — танкист."
idioms:
  - { pl: "iść jak czołg", ru: "переть напролом" }
