notes:
  - { kind: false-friend, text: "Пара обманчива до предела. Русская «щека» и польское SZCZĘKA — настоящие родственники и звучат почти одинаково, но значат разное: SZCZĘKA это челюсть, а не щека. Щека по-польски POLICZEK. Поэтому UDERZYŁ GO W SZCZĘKĘ значит «ударил его в челюсть», и ошибка здесь меняет всю картину. Исходный смысл корня был «лязг», и он сохранился в слове SZCZĘK «лязг»." }
  - { kind: usage, text: "Десять форм, женский род. В дательном и местном падежах K переходит в C: SZCZĘKA, но W SZCZĘCE. В родительном множественного окончания нет: SZCZĘK, и эта форма совпадает с существительным SZCZĘK «лязг», от того же корня. Множественное SZCZĘKI значит и обе челюсти, и губки тисков или клещей." }
  - { kind: government, text: "В челюсть, с ударом — W SZCZĘKĘ, винительный, потому что есть движение внутрь. А «в челюсти», о том, что внутри, — W SZCZĘCE, местный падеж. Сжать челюсти — ZACISNĄĆ SZCZĘKI, винительный множественного. Под челюстью — POD SZCZĘKĄ, творительный. Это та же пара падежей, что в TRAFIĆ W SEDNO против W SEDNIE." }
  - { kind: pronunciation, text: "Читается «шчэ́нка», два слога, ударение на первом. Сочетание SZCZ даёт «шч», два шипящих подряд, и это самое трудное место для русского языка: не «щ», а именно «шч». Носовой Ę перед K даёт «эн». В форме SZCZĘCE сочетание CE даёт «це»: «шчэ́нце»." }
  - { kind: register, text: "Слово нейтральное, из языка врача и из обиходной речи сразу. У стоматолога это SZCZĘKA GÓRNA и SZCZĘKA DOLNA. В разговоре живёт оборот SZCZĘKA MI OPADŁA — «у меня челюсть отвисла», от удивления, и говорят его постоянно. В технике SZCZĘKI это губки тисков, а SZCZĘKI HAMULCOWE — тормозные колодки." }
