etymology: "Праславянское слово от корня со значением «лязгать, щёлкать»: челюсть назвали по звуку, который она издаёт, когда зубы сходятся. Этот первый смысл в польском жив до сих пор в слове SZCZĘK «лязг». Русская «щека» — тот же корень, но у нас он переехал с челюсти на мягкую часть лица, а челюсть получила своё название от «чела». Отсюда и ловушка: слова родные, а значат разное."
memory: "Челюсть, а не «щека»: щека по-польски policzek. Слова при этом родня, и корень их значил «лязг» — челюсть назвали по стуку зубов, а след остался в szczek «лязг». Читается «шчэ́нка», где szcz даёт «шч», а не «щ». В местном падеже k переходит в c: w szczece. И запомните szczeka mi opadla — «у меня челюсть отвисла»."
