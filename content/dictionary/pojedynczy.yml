etymology: "Сложено из приставки PO- и основы JEDYN-, от JEDEN «один», которому в русском отвечает «один», а в книжном слое «един». Смысл прозрачен: взятый по одному, отдельный. Из того же гнезда POJEDYNEK «поединок, дуэль», и здесь совпадение с русским полное, часть за частью: по плюс един плюс суффикс, то есть бой один на один. Русское «поединок» и польское POJEDYNEK — одно и то же слово, собранное двумя языками независимо из общего материала. Рядом стоят JEDYNY «единственный», JEDNAK «однако» и JEDNOCZEŚNIE «одновременно»."
memory: "Десять форм, а не одиннадцать, и причина грамматическая: у прилагательных на -czy мужско-личное множественное совпадает с именительным единственного, pojedynczy в двух клетках. Главная ловушка: «единственное число» это liczba POJEDYNCZA, хотя «единственный» это jedyny; pojedynczy сам по себе значит «единичный, одиночный». Родня: pojedynek это русское «поединок», часть за частью. Читается «поеды́нчы», с двумя «ы»."
