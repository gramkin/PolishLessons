notes:
  - { kind: usage, text: "У этого прилагательного десять форм, а не одиннадцать, и это не пропуск в черновике. Прилагательные с основой на отвердевшую согласную — CZ, RZ, SZ, Ż, C, DZ — образуют мужско-личное множественное на -Y, то есть ровно так же, как именительный единственного мужского рода. Поэтому у POJEDYNCZY форма POJEDYNCZY работает в двух клетках сразу, и разных форм остаётся десять. Та же схема у ŚLEDCZY «следственный» и у всех прилагательных на -CZY. Если в черновике ровно десять форм, причина почти всегда эта." }
  - { kind: false-friend, text: "Русское «единственное число» заставляет ждать слова JEDYNY, ведь JEDYNY и значит «единственный». Но грамматический термин строится иначе: LICZBA POJEDYNCZA, через POJEDYNCZY, которое в обычной речи значит «единичный, одиночный». Держать надо оба: JEDYNA SZANSA это «единственный шанс», а LICZBA POJEDYNCZA — «единственное число». Ещё одно соседство: POJEDYNEK значит «поединок, дуэль» и устроено из тех же частей, что русское слово, PO плюс JEDYN плюс суффикс." }
  - { kind: pronunciation, text: "Читается «поеды́нчы», четыре слога, ударение на предпоследнем. Буква Y звучит как «ы» дважды: в DYN и в конце слова, отсюда «дынчы», а не «динчи». Сочетание CZ даёт твёрдое «ч». Буква J в начале второго слога читается как русское «й», сливаясь с предыдущим O: «по-е». В существительном POJEDYNEK ударение падает на DY: «поеды́нэк»." }
  - { kind: government, text: "Прилагательное только согласуется с существительным и падежом не управляет. Но в грамматическом значении оно входит в устойчивое сочетание с управлением: W LICZBIE POJEDYNCZEJ, предлог W с местным падежом, и так же W LICZBIE MNOGIEJ. Русский говорит то же самое и тем же способом, «в единственном числе», так что эту конструкцию переносить не нужно. В значении «одиночный» прилагательное часто стоит после существительного, как в термине: GRA POJEDYNCZA «одиночная игра» в теннисе." }
  - { kind: register, text: "Слово нейтральное, с уклоном в официальный и технический язык: статистика, медицина, спорт, грамматика. Частые обороты: POJEDYNCZE PRZYPADKI «единичные случаи», LICZBA POJEDYNCZA «единственное число», POKÓJ POJEDYNCZY «одноместный номер», BILET POJEDYNCZY «одиночный билет». Наречие POJEDYNCZO значит «по одному, по отдельности»: WCHODZIĆ POJEDYNCZO «входить по одному». В разговоре вместо прилагательного часто скажут проще, JEDEN или POJEDYNCZO." }
