# review
id: wywolac
format: 2
lemma: "wywołać"
rank: 2304
pos: verb
pron: { cyr: "выво́уаць" }
senses:
  - id: call-out
    ru: "вызвать (позвать)"
    examples:
      - pl: "Nauczyciel wywołał go do tablicy."
        ru: "Учитель вызвал его к доске."
        source: { kind: authored }
      - pl: "Wywołaj lekarza, to pilne."
        ru: "Вызови врача, это срочно."
        source: { kind: authored }
  - id: cause
    ru: "вызвать (реакцию, чувство)"
    examples:
      - pl: "Jego słowa wywołały śmiech."
        ru: "Его слова вызвали смех."
        source: { kind: authored }
      - pl: "Decyzja wywołała burzę w mediach."
        ru: "Решение вызвало бурю в СМИ."
        source: { kind: authored }
  - id: develop-film
    ru: "проявить (плёнку, снимки)"
    examples:
      - pl: "Wywołał zdjęcia dopiero po roku."
        ru: "Он проявил снимки только через год."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ТРЕТЬЕ ЗНАЧЕНИЕ РУССКОМУ НЕЗНАКОМО. Wywołać zdjęcia значит «ПРОЯВИТЬ снимки»: плёнку в фотолаборатории именно wywołuje się. По-русски «вызвать фотографии» сказать нельзя. Первые два значения совпадают полностью: вызвать человека и вызвать реакцию." }
  - { kind: government, text: "Вызывают КОГО или ЧТО — винительный без предлога: wywołać ucznia, wywołać panikę, wywołać zdjęcia. КУДА — do с родительным: wywołać do tablicy, do gabinetu. У КОГО вызывают чувство — дательный или u с родительным: wywołać u kogoś uśmiech." }
  - { kind: pronunciation, text: "Три слога, ударение на предпоследнем: wy-WO-łać. Ł читается как краткое у, так что середина звучит «воу»: «выво́уаць». В прошедшем времени ударение остаётся предпоследним: wywołaliśmy — «выво́уали́шмы»." }
  - { kind: usage, text: "КОРЕНЬ WOŁAĆ «ЗВАТЬ» РУССКОГО СООТВЕТСТВИЯ НЕ ИМЕЕТ — И ЭТО ПЕРЕКРЁСТ. Повседневное польское wołać «звать» в русском не удержалось; зато русское «звать» отвечает польскому zwać, которое стало книжным и живёт в nazywać, nazwa, nazwisko. Два языка поделили корни: один взял в обиход wołać, другой — «звать». Вид совершенный, несовершенная пара — wywoływać." }
collocations:
  - { pl: "wywołać do tablicy", ru: "вызвать к доске" }
  - { pl: "wywołać zdjęcia", ru: "проявить снимки" }
  - { pl: "wywołać burzę", ru: "вызвать бурю" }
family:
  - { pl: "wołać", ru: "звать", relation: root }
  - { pl: "wywoływać", ru: "вызывать", relation: aspect }
  - { pl: "zawołać", ru: "позвать", relation: derived, id: zawolac }
  - { pl: "nazywać", ru: "называть", relation: derived, id: nazywac }
etymology: "Приставка wy- плюс wołać «звать», из праславянского *volati. Русский этот корень в обиходе утратил, оставив «звать» — а оно отвечает польскому zwać, от которого nazwa и nazwisko. Значение «проявить снимки» выросло из образа: проявитель как бы ВЫЗЫВАЕТ изображение из пустой бумаги. Отсюда wywoływacz «проявитель», wywołanie, odwołać."
memory: "wywołać — «вызвать»: człowieka, reakcję — и, неожиданно, ZDJĘCIA: wywołać zdjęcia значит «проявить снимки». Корень wołać «звать» русский утратил; русское «звать» отвечает польскому zwać, которое уцелело в nazwa и nazwisko."
idioms:
  - { pl: "wywołać wilka z lasu", ru: "накликать беду, помянуть к ночи" }
  - { pl: "wywołać do tablicy", ru: "вызвать к доске" }
