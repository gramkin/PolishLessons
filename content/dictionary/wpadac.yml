notes:
  - { kind: false-friend, text: "РУССКОЕ «ВПАДАТЬ» ПОКРЫВАЕТ ТОЛЬКО ОДНО ИЗ ТРЁХ ЗНАЧЕНИЙ. WPADAĆ это и «впадать» о реке — Wisła wpada do Bałtyku, — и «забегать, заглядывать» в гости: wpadnij do mnie. И третье: «влипать, попадаться» — wpaść w kłopoty, wpaść na egzaminie. Последние два русскому «впадать» чужды совсем, так что перевод каждый раз выбирается заново." }
  - { kind: usage, text: "ОБРАЗ В ИДИОМЕ ИДЁТ В ОБРАТНУЮ СТОРОНУ, ЧЕМ В РУССКОМ. WPAŚĆ NA POMYSŁ значит «придумать», но буквально «наткнуться на мысль»: движется человек. Русская «мысль пришла в голову» движет саму мысль. Запомни ещё WPAŚĆ W OKO — «приглянуться», и WPAŚĆ W PANIKĘ — «впасть в панику», где совпадение есть." }
  - { kind: usage, text: "Страдательного причастия у глагола нет, и это свойство самого слова: он непереходный, дополнение идёт через предлог — wpadać DO czegoś, W coś, NA coś. Отсюда 52 формы вместо обычных 63, как у współczuć и zajrzeć. Безличное WPADANO при этом есть. Совершенная пара — WPAŚĆ." }
collocations:
  - { pl: "wpaść na pomysł", ru: "придумать, надумать" }
  - { pl: "wpaść w kłopoty", ru: "попасть в неприятности" }
  - { pl: "wpadnij do nas", ru: "забегай к нам" }
family:
  - { pl: "wpaść", ru: "забежать; попасть (сов.)", relation: aspect, id: wpasc }
  - { pl: "padać", ru: "падать", relation: root, id: padac }
  - { pl: "wypadać", ru: "выпадать", relation: root }
etymology: "Приставка w- и padać «падать», из праславянского *pasti — того же корня, что русские «падать» и «впадать». Значения «забежать» и «влипнуть» выросли из того же образа внезапного попадания внутрь: человек как бы вваливается на минуту или в беду."
memory: "wpadać — не только «впадать» о реке, но и «забегать» в гости, и «влипать» в неприятности. И запомни wpaść na pomysł: по-польски человек натыкается на мысль, а по-русски мысль приходит в голову — движение в разные стороны."
idioms:
  - { pl: "wpaść na pomysł", ru: "придумать" }
  - { pl: "wpaść komuś w oko", ru: "приглянуться кому-л." }
