notes:
  - { kind: false-friend, text: "Русскому «неловкий» польское NIEZRĘCZNY соответствует почти полностью, и корень знакомый: RĘKA, «рука». ZRĘCZNY — «ловкий, умелый», буквально «с руками». NIEZRĘCZNY — «неловкий», и о движениях, и о ситуации. Синоним о ситуации — KRĘPUJĄCY, «стеснительный, неудобный»." }
  - { kind: usage, text: "Полная парадигма: NIEZRĘCZNY, NIEZRĘCZNIEJSZY, NAJNIEZRĘCZNIEJSZY. Степени живые: CORAZ NIEZRĘCZNIEJ. Мужское-личное: NIEZRĘCZNI, NIEZRĘCZNIEJSI, NAJNIEZRĘCZNIEJSI." }
  - { kind: government, text: "Неловко кому-то — KOMUŚ JEST NIEZRĘCZNIE, наречие с дательным: BYŁO MI NIEZRĘCZNIE, «мне было неловко». Неловкий в чём-то — NIEZRĘCZNY W + местный." }
  - { kind: pronunciation, text: "Читается «незрэ́нчны», три слога, ударение на предпоследнем. ZRĘ — «зрэн», носовое Ę перед CZ. CZ — «ч»." }
  - { kind: register, text: "Нейтральное слово. NIEZRĘCZNA CISZA, NIEZRĘCZNA SYTUACJA — устойчивые сочетания из разговора и литературы. О человеке — мягче, чем NIEZDARA, «растяпа»." }
collocations:
  - { pl: "niezręczna cisza", ru: "неловкая тишина" }
  - { pl: "niezręczna sytuacja", ru: "неловкая ситуация" }
  - { pl: "niezręczne pytanie", ru: "неудобный вопрос" }
family:
  - { pl: "zręczny", ru: "ловкий", relation: root }
  - { pl: "ręka", ru: "рука", relation: root, id: reka }
  - { pl: "niezręcznie", ru: "неловко", relation: derived }
etymology: "От ZRĘCZNY «ловкий», от RĘKA «рука», общеславянского *rǫka. Польское Ę на месте русского «у»: RĘKA — «рука». Ловкий — тот, у кого всё в руках, а неловкий — у кого из рук валится. Русское «сноровка» и «ловкий» построены иначе, но смысл тот же."
memory: "Niezręczny — неловкий: niezręczna cisza, niezręczne pytanie, niezręczny ruch. От ręka — рука. Było mi niezręcznie — мне было неловко. Читается «незрэ́нчны»."
idioms:
  - { pl: "niezręczna cisza", ru: "неловкая тишина" }
