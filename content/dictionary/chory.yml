# review
id: chory
format: 2
lemma: "chory"
rank: 624
pos: adj
pron: { cyr: "хо́ры" }
senses:
  - id: ill
    ru: "больной"
    note: "chory na coś «болен чем-то» — с na и винительным, а не с творительным."
    examples:
      - pl: "Tom jest chory."
        ru: "Том болен."
        source: { kind: tatoeba, id: 5795229 }
      - pl: "Wczoraj byłem chory."
        ru: "Вчера я был болен."
        source: { kind: tatoeba, id: 354017 }
      - pl: "Myślę, że jesteś chora."
        ru: "По-моему, ты больна."
        source: { kind: tatoeba, id: 12470537 }
  - id: patient
    ru: "chory — больной (как существительное)"
    note: "Прилагательное свободно работает существительным: zająć się chorym."
    examples:
      - pl: "Ktoś musi zająć się chorym."
        ru: "Кто-то должен заняться больным."
        source: { kind: translated, id: 702878 }
      - pl: "To lekarstwo zwiększy przeżywalność chorych."
        ru: "Это лекарство повысит выживаемость больных."
        source: { kind: translated, id: 1324959 }
      - pl: "Towarzyszyła choremu mężowi."
        ru: "Она сопровождала больного мужа."
        source: { kind: translated, id: 355834 }
  - id: crazy
    ru: "To chore! — Это ненормально! (разговорное)"
    note: "Как русское «это больное»."
    examples:
      - pl: "To chore!"
        ru: "Это ненормально!"
        source: { kind: translated, id: 2809445 }
      - pl: "Jesteście chore psychicznie."
        ru: "Вы психически больны."
        source: { kind: translated, id: 12935164 }
      - pl: "Udaje chorego."
        ru: "Он притворяется больным."
        source: { kind: translated, id: 12036981 }
notes:
  - { kind: government, text: "chory NA coś — «болен чем-то», с предлогом na и винительным: chory na grypę «болен гриппом». Русский ставит здесь творительный, так что предлог приходится помнить." }
  - { kind: usage, text: "Прилагательное свободно работает существительным: chory «больной (человек)», chorzy «больные», zająć się chorym." }
  - { kind: usage, text: "Разговорное To chore! значит «Это ненормально!» — ровно как русское «это больное»." }
  - { kind: usage, text: "Степени аналитические: bardziej chory, najbardziej chory. Болезнь — choroba, болеть — chorować." }
collocations:
  - { pl: "chory na grypę", ru: "болен гриппом" }
  - { pl: "zająć się chorym", ru: "заняться больным" }
  - { pl: "udawać chorego", ru: "притворяться больным" }
  - { pl: "To chore!", ru: "Это ненормально!" }
family:
  - { pl: "choroba", ru: "болезнь", relation: derived }
  - { pl: "chorować", ru: "болеть", relation: derived }
  - { pl: "chorobliwy", ru: "болезненный", relation: derived }
etymology: "От праславянского *xvorъ — то же слово, что русское «хворый»; русское «больной» пришло от другого корня, а «хворать» сохранило этот."
memory: "chory — «больной», и корень тот же, что в русских «хворый» и «хворать». Главное отличие в управлении: chory NA coś, с предлогом na и винительным — chory na grypę «болен гриппом», — тогда как русский ставит творительный. Слово свободно работает существительным: zająć się chorym «заняться больным», chorzy «больные». А разговорное To chore! значит «Это ненормально!». Болезнь — choroba."
idioms:
  - { pl: "chory na grypę", ru: "болен гриппом" }
  - { pl: "To chore!", ru: "Это ненормально!" }
  - { pl: "udawać chorego", ru: "притворяться больным" }
