# review
id: zywy
format: 2
lemma: "żywy"
rank: 763
pos: adj
pron: { cyr: "жы́вы" }
senses:
  - id: alive
    ru: "живой, не мёртвый"
    examples:
      - pl: "Nie było tam żywej duszy."
        ru: "Там не было ни одной живой души."
        source: { kind: tatoeba, id: 350720 }
      - pl: "Ten biedny kot był ledwo żywy z głodu."
        ru: "Этот бедный кот был еле жив от голода."
        source: { kind: translated, id: 361037 }
      - pl: "Myślałem, że nigdy nie wydostaniemy się żywi z płonącego budynku."
        ru: "Я думал, мы никогда не выберемся живыми из горящего здания."
        source: { kind: translated, id: 3786137 }
  - id: lively
    ru: "живой, оживлённый; яркий (о красках, речи, воспоминании)"
    note: "Второе значение полностью совпадает с русским переносным «живой»: żywa rozmowa «оживлённый разговор», żywe kolory «яркие краски»."
    examples:
      - pl: "Nie wiem czemu, ale wieczorami czuję się najżywszy."
        ru: "Почему-то по ночам я бодрее."
        source: { kind: tatoeba, id: 351394 }
      - pl: "Ulica była pełna żywych kolorów."
        ru: "Улица была полна ярких красок."
        source: { kind: authored }
      - pl: "Rozmowa stała się bardzo żywa."
        ru: "Разговор стал очень оживлённым."
        source: { kind: authored }
notes:
  - { kind: usage, text: "żywy покрывает оба русских смысла «живой»: jeszcze żywy «ещё живой» и żywa rozmowa «оживлённый разговор», żywe kolory «яркие краски»." }
  - { kind: false-friend, text: "Осторожно с омонимом: żywi — это и мужско-личная форма прилагательного («живые»), и форма глагола żywić «кормить». Bydło żywi się trawą значит «Скот кормится травой», а не «скот живой»." }
  - { kind: usage, text: "Краткая форма żyw осталась в устойчивых оборотах и книжной речи: ledwo żyw «еле жив», ani żyw, ani martwy «ни жив ни мёртв». В обычной речи берите żywy." }
  - { kind: usage, text: "Гнездо прозрачно и полностью совпадает с русским: życie «жизнь», żyć «жить», żywo «живо», żywność «продукты»." }
collocations:
  - { pl: "żywy człowiek", ru: "живой человек" }
  - { pl: "żywe kolory", ru: "яркие краски" }
  - { pl: "żywa rozmowa", ru: "оживлённый разговор" }
  - { pl: "ani żywej duszy", ru: "ни живой души" }
family:
  - { pl: "życie", ru: "жизнь", relation: derived, id: zycie }
  - { pl: "żyć", ru: "жить", relation: derived, id: zyc }
  - { pl: "żywo", ru: "живо", relation: derived, id: zywo }
  - { pl: "żywić", ru: "кормить", relation: derived }
etymology: "Праславянское *živъ — то же слово, что русское «живой»: польскому ży- отвечает русское жи-. Отсюда życie «жизнь», żyć «жить», żywność «продукты»."
memory: "żywy — «живой» в обоих русских смыслах: jeszcze żywy «ещё живой» и żywe kolory «яркие краски», żywa rozmowa «оживлённый разговор». Гнездо узнаётся сразу: życie, żyć, żywo. Главная ловушка — омоним żywi: это либо «живые» (wrócili żywi), либо глагол żywić «кормить» (Bydło żywi się trawą «Скот кормится травой»). Краткая форма żyw сидит в оборотах: ledwo żyw «еле жив», ani żyw, ani martwy."
idioms:
  - { pl: "ani żywej duszy", ru: "ни живой души" }
  - { pl: "ledwo żywy", ru: "еле живой" }
  - { pl: "dotknąć do żywego", ru: "задеть за живое" }
