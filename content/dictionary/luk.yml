etymology: "Праславянское слово с носовым гласным, давшее и русский «лук» в значении оружия. Носовой в обоих языках исчез, но по-разному: русский дал «у», польский тоже «у», зато начальное L у поляков перешло в Ł, которое читается как «у». Отсюда и неузнаваемость на слух. Русский «лук» как овощ слово совсем другое, германского происхождения, и в польском ему отвечает CEBULA, из латыни."
memory: "То же слово, что русский «лук» в смысле оружия, но прочесть его трудно: ł даёт «у» и никакого «л» не остаётся, поэтому łuk звучит просто «ук». Второе значение дуга или арка, łuk triumfalny. Важно: лук как овощ по-польски cebula, и ŁUK в этом смысле не употребляется никогда. Гнездо прозрачное: łucznik «лучник», łucznictwo «стрельба из лука»."
idioms:
  - { pl: "łuk triumfalny", ru: "триумфальная арка" }
