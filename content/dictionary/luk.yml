notes:
  - { kind: false-friend, text: "Слово то же, что русский «лук» в значении оружия, и оба потеряли древний носовой звук. Но русский «лук» это ещё и овощ, а польский ŁUK никогда: лук как еда по-польски CEBULA. Так что ŁUK это только оружие и только дуга или арка. Второе значение русскому тоже знакомо, в «луке» свода и в дугах бровей, но у нас оно книжное, а по-польски обычное." }
  - { kind: usage, text: "Девять форм, мужской род, неодушевлённое. Основа не меняется ни в одном падеже, беглых гласных нет. В местном падеже ŁUKU, без всякого смягчения. Оба значения живут в одном слове и различаются определением: ŁUK TRIUMFALNY это арка, a ŁUK I STRZAŁY — оружие. Прилагательное ŁUKOWY значит «дуговой», а ŁUCZNIK — «лучник»." }
  - { kind: government, text: "Стрелять из лука — STRZELAĆ Z ŁUKU, предлог Z с родительным, как и по-русски. Натянуть лук — NAPIĄĆ ŁUK, винительный без предлога. Заворачивать дугой — ZAKRĘCAĆ ŁUKIEM, творительный без предлога, тогда как русский говорит «дугой» тоже творительным. Триумфальная арка — ŁUK TRIUMFALNY, и порядок слов здесь закреплён, прилагательное после существительного." }
  - { kind: pronunciation, text: "Читается «ук», один слог, и это самое удивительное в слове: буква Ł даёт «у», и от неё не остаётся никакого «л». Поэтому ŁUK звучит просто «ук», а русское «лук» на слух совсем другое слово. В косвенных падежах то же: ŁUKU это «у́ку», ŁUKIEM — «у́кем», с мягким «ке». Для русского уха это один из самых непривычных случаев чтения Ł." }
  - { kind: register, text: "Слово нейтральное в обоих значениях. В спорте и в истории это оружие: ŁUK I STRZAŁY, ŁUCZNICTWO «стрельба из лука», ZAWODY ŁUCZNICZE. В архитектуре и в геометрии это дуга: ŁUK TRIUMFALNY, ŁUK GOTYCKI «готическая арка», ŁUK OKRĘGU «дуга окружности». В анатомии ŁUK BRWIOWY это «бровная дуга», и так говорят врачи." }
