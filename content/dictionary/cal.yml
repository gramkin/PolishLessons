etymology: "Из немецкого Zoll «дюйм», того же корня, что английское toll «пошлина»: исходно зарубка, отметка. Польский взял слово через торговлю и плотницкое дело. С cały «целый» и с cel «цель» не связано, несмотря на сходство букв."
memory: "cal — «дюйм», и его легко спутать с cel «цель»: разница в одной гласной. Родительный множественного cali, с мягким и. Этим словом в Польше меряют экраны, трубы и рост."
