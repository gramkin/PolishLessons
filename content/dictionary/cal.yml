notes:
  - { kind: false-friend, text: "ГЛАВНАЯ ЛОВУШКА ЗДЕСЬ — СОСЕДНЕЕ СЛОВО. Cal это «дюйм», а CEL, отличающийся одной буквой, это «цель». Одна гласная меняет всё: mam cel «у меня есть цель», mam cala нет вовсе. Русское «цаль» в литературном языке отсутствует, так что опереться на похожее звучание нельзя." }
  - { kind: usage, text: "Единица английская, но в польском быту живая: ею меряют экраны (ekran pięćdziesiąt cali), трубы, доски и рост. Русский в тех же случаях чаще берёт сантиметры, и переводить надо по смыслу, а не по единице. Родительный множественного — CALI, с мягким и, а не calów." }
  - { kind: pronunciation, text: "Один слог: цаль. Конечное l мягкое, как русское ль, поэтому слово звучит коротко и мягко. Во множественном cale читается «цале», а cali — «цали»." }
