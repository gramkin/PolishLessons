formExamples:
  - form: "toczy"
    pl: "Życie nie zawsze toczy się po naszej myśli."
    ru: "Жизнь не всегда идёт по-нашему."
    source: { kind: translated, id: 357696 }
  - form: "toczy"
    pl: "Bądź miła, bo każdy, kogo spotykasz, toczy trudną bitwę."
    ru: "Будь добра, ведь каждый, кого ты встречаешь, ведёт трудную битву."
    source: { kind: translated, id: 11253833 }
