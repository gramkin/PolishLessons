# review
id: toczyc
format: 2
lemma: "toczyć"
rank: 2204
pos: verb
aspect: imperf
pron: { cyr: "то́чиць" }
senses:
  - id: unfold
    ru: "идти, разворачиваться (toczyć się)"
    examples:
      - pl: "Życie nie zawsze toczy się po naszej myśli."
        ru: "Жизнь не всегда идёт по-нашему."
        source: { kind: translated, id: 357696 }
      - pl: "Nikt nie może żyć przeszłością. Życie toczy się tu i teraz."
        ru: "Никто не может жить прошлым. Жизнь идёт здесь и сейчас."
        source: { kind: translated, id: 13330582 }
      - pl: "Zebranie toczyło się w ten sposób."
        ru: "Собрание шло таким образом."
        source: { kind: translated, id: 1359760 }
  - id: wage
    ru: "вести (войну, борьбу, спор)"
    examples:
      - pl: "Przez dwadzieścia lat Kartagińczycy toczyli wojnę z Rzymianami."
        ru: "Двадцать лет карфагеняне вели войну с римлянами."
        source: { kind: translated, id: 12323300 }
      - pl: "Nasz zespół toczył wyrównaną walkę z zespołem S."
        ru: "Наша команда вела равную борьбу с командой S."
        source: { kind: translated, id: 982416 }
notes:
  - { kind: government, text: "Без się — переходный «вести»: toczyć wojnę, toczyć walkę, toczyć spór, всегда винительный. С się — непереходный «идти, разворачиваться» о событиях." }
  - { kind: usage, text: "Русское «вести войну» совпадает по конструкции, но русское «течь» и польское toczyć się разошлись: życie się toczy это «жизнь идёт», а не «течёт»." }
  - { kind: false-friend, text: "Корень тот же, что в русском «точить» и «ток»: исходный смысл — катить, приводить в движение." }
  - { kind: usage, text: "Совершенный вид — potoczyć się «покатиться, пойти»." }
collocations:
  - { pl: "toczyć wojnę", ru: "вести войну" }
  - { pl: "życie się toczy", ru: "жизнь идёт" }
etymology: "Праславянское *točiti «катить, приводить в движение»; ср. русское «точить», «ток», «течь»."
memory: "toczyć — «вести» (wojnę, spór), а с się «идти, разворачиваться»: życie się toczy «жизнь идёт». Совершенный вид — potoczyć się."
idioms:
  - { pl: "toczyć wojnę", ru: "вести войну" }
  - { pl: "życie się toczy", ru: "жизнь идёт" }
