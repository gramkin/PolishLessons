  - { pl: "oszczędnie", ru: "экономно", relation: derived }
  - { pl: "rozrzutność", ru: "расточительность", relation: antonym }
synonyms: ["gospodarność", "zapobiegliwość", "skromność"]
etymology: "От OSZCZĘDNY «бережливый», а тот — от OSZCZĘDZAĆ «беречь, экономить»; старое SZCZĘDZIĆ того же корня, что русское «щадить»."
memory: "Oszczędność — от «щадить» (szczędzić): кто щадит деньги, тот бережлив. Oszczędności во множественном — сбережения."
