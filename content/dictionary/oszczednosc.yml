notes:
  - { kind: usage, text: "Во множественном числе OSZCZĘDNOŚCI — это «сбережения», накопленные деньги: ODKŁADAĆ OSZCZĘDNOŚCI «откладывать сбережения». В новостях OSZCZĘDNOŚCI — ещё и «меры экономии», сокращения расходов." }
  - { kind: government, text: "Экономия чего — родительный, как в русском: OSZCZĘDNOŚĆ CZASU, ENERGII, PALIWA. Глагол — OSZCZĘDZAĆ «экономить, копить» (OSZCZĘDZAĆ NA CZYMŚ «экономить на чём-то»)." }
  - { kind: pronunciation, text: "Читается «ошчэ́ндносьць»: SZCZ — «шч», Ę перед D — «эн». Ударение на предпоследнем слоге." }
collocations:
  - { pl: "oszczędność energii", ru: "экономия энергии" }
  - { pl: "całe oszczędności", ru: "все сбережения" }
  - { pl: "odkładać oszczędności", ru: "откладывать сбережения" }
  - { pl: "szukać oszczędności", ru: "искать, на чём сэкономить" }
family:
