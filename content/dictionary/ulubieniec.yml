# review
id: ulubieniec
format: 2
lemma: "ulubieniec"
rank: 2338
pos: noun
pron: { cyr: "улубе́нец" }
senses:
  - id: favourite
    ru: "любимец, любимчик"
    examples:
      - pl: "Jesteś ulubieńcem Toma."
        ru: "Ты любимец Тома."
        source: { kind: translated, id: 5966635 }
      - pl: "Jest ulubieńcem całej klasy."
        ru: "Он любимец всего класса."
        source: { kind: translated, id: 368970 }
      - pl: "On jest moim ulubieńcem."
        ru: "Он мой любимец."
        source: { kind: translated, id: 3437737 }
  - id: pet
    ru: "фаворит, баловень"
    examples:
      - pl: "Nie lubię jak ktoś ma ulubieńców."
        ru: "Не люблю, когда у кого-то есть любимчики."
        source: { kind: translated, id: 13339187 }
      - pl: "Był ulubieńcem publiczności."
        ru: "Он был любимцем публики."
        source: { kind: authored }
notes:
  - { kind: government, text: "Мужской ЛИЧНЫЙ род: мн. ч. ulubieńcy, родительный мн. ulubieńców. Обратите внимание на чередование c/ć: ulubieniec, но ulubieńca." }
  - { kind: false-friend, text: "От lubić «любить» и ulubiony «любимый» — оба уже есть в словаре. Приставка u- здесь усилительная." }
  - { kind: usage, text: "Женское соответствие — ulubienica." }
  - { kind: usage, text: "О домашнем животном скажут скорее pupil или zwierzak; ulubieniec — прежде всего о человеке." }
collocations:
  - { pl: "ulubieniec publiczności", ru: "любимец публики" }
  - { pl: "ulubieniec klasy", ru: "любимец класса" }
etymology: "От lubić «любить» с приставкой u-; родня — ulubiony «любимый»."
memory: "ulubieniec — «любимец». Род мужской ЛИЧНЫЙ: ulubieńcy, ulubieńców, с чередованием c/ć. Женский вариант — ulubienica."
idioms:
