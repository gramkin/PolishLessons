# review
id: pojecie
format: 2
lemma: "pojęcie"
rank: 752
pos: noun
pron: { cyr: "пойэ́ньце" }
senses:
  - id: concept
    ru: "понятие, представление"
    examples:
      - pl: "To pojęcie ma wiele znaczeń."
        ru: "Это понятие имеет много значений."
        source: { kind: translated, id: 2246838 }
      - pl: "Masz o tym jakieś pojęcie?"
        ru: "Ты имеешь об этом хоть какое-то представление?"
        source: { kind: translated, id: 6157245 }
      - pl: "Jaka jest różnica między tymi pojęciami?"
        ru: "В чём разница между этими понятиями?"
        source: { kind: translated, id: 11627635 }
  - id: no-idea
    ru: "nie mieć pojęcia — не иметь понятия"
    note: "Требует родительного падежа."
    examples:
      - pl: "Nie mam pojęcia."
        ru: "Понятия не имею."
        source: { kind: tatoeba, id: 350147 }
      - pl: "Nie mam zielonego pojęcia."
        ru: "Не имею ни малейшего понятия."
        source: { kind: authored }
      - pl: "Nie miał pojęcia, co robić."
        ru: "Он понятия не имел, что делать."
        source: { kind: authored }
  - id: abstract
    ru: "pojęcie abstrakcyjne — абстрактное понятие"
    examples:
      - pl: "Dla niego głód był pojęciem abstrakcyjnym. Zawsze miał wystarczająco jedzenia."
        ru: "Для него голод был абстрактным понятием. Еды у него всегда хватало."
        source: { kind: translated, id: 1693332 }
      - pl: "To pojęcie jest trudne do zdefiniowania."
        ru: "Это понятие трудно определить."
        source: { kind: authored }
      - pl: "Między tymi pojęciami jest różnica."
        ru: "Между этими понятиями есть разница."
        source: { kind: authored }
  - id: beyond
    ru: "przechodzić ludzkie pojęcie — уму непостижимо"
    examples:
      - pl: "To przechodzi ludzkie pojęcie."
        ru: "Это уму непостижимо."
        source: { kind: authored }
      - pl: "Jego upór przechodzi ludzkie pojęcie."
        ru: "Его упрямство уму непостижимо."
        source: { kind: authored }
      - pl: "Takie okrucieństwo przechodzi ludzkie pojęcie."
        ru: "Такая жестокость уму непостижима."
        source: { kind: authored }
notes:
  - { kind: government, text: "nie mieć pojęcia требует родительного падежа: Nie mam pojęcia «Понятия не имею». Усилитель — zielonego: nie mam zielonego pojęcia «не имею ни малейшего понятия»." }
  - { kind: usage, text: "Перед придаточным ставится запятая, в отличие от того, как это часто пишут в сети: Nie mam pojęcia, gdzie jestem." }
  - { kind: usage, text: "Родня прозрачная: pojąć «понять, постичь», pojętny «понятливый», niepojęty «непостижимый»." }
  - { kind: usage, text: "przechodzić ludzkie pojęcie — «уму непостижимо», буквально «превосходит человеческое понятие»." }
collocations:
  - { pl: "nie mieć pojęcia", ru: "не иметь понятия" }
  - { pl: "pojęcie abstrakcyjne", ru: "абстрактное понятие" }
  - { pl: "podstawowe pojęcia", ru: "основные понятия" }
family:
  - { pl: "pojąć", ru: "понять, постичь", relation: root }
  - { pl: "pojętny", ru: "понятливый", relation: derived }
  - { pl: "niepojęty", ru: "непостижимый", relation: derived }
etymology: "От pojąć «постичь», а это po + jąć «взять» — ровно та же сборка, что в русском «по-нятие» от «по-нять»."
memory: "pojęcie собрано в точности как русское «понятие»: po + jąć «взять», то есть «по-нять». Главная фраза — nie mam pojęcia «понятия не имею», с родительным падежом и усилителем zielonego: nie mam zielonego pojęcia. А przechodzić ludzkie pojęcie значит «уму непостижимо»."
idioms:
  - { pl: "nie mieć zielonego pojęcia", ru: "не иметь ни малейшего понятия" }
  - { pl: "nie mam pojęcia", ru: "понятия не имею" }
  - { pl: "przechodzić ludzkie pojęcie", ru: "уму непостижимо" }
