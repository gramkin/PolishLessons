notes:
  - { kind: usage, text: "Одно польское слово покрывает три русских, и выбор подсказывает только окружение. ZWROT PIENIĘDZY — «возврат денег», ZWROT W LEWO — «поворот влево», ZWROT GRZECZNOŚCIOWY — «вежливое выражение, оборот речи». Русский развёл эти смыслы по трём разным словам с тремя приставками — «возврат», «поворот», «оборот», — а польский обошёлся одним. Поэтому переводить надо не слово, а словосочетание целиком." }
  - { kind: usage, text: "Местный падеж — ZWROCIE: t переходит в ć. Это восьмой случай подряд после elemencie, kącie, rakiecie, fragmencie, asystencie, produkcie и komendancie. Родительный при этом ZWROTU с окончанием -u, и формы не сливаются — местный отличается от родительного, в отличие от bagażu из этой же партии, где они совпали." }
  - { kind: usage, text: "Корень прозрачен через русское «поворот»: ZWROT от ZWRÓCIĆ, а то от WRÓCIĆ «вернуть», из праславянского *vortiti — того же корня, что «воротить», «вращать», «поворот». Отсюда и самое нужное выражение ZWROT AKCJI «поворот сюжета», и ZWRÓCIĆ UWAGĘ «обратить внимание», где тот же глагол значит уже не «вернуть», а «обратить»." }
collocations:
  - { pl: "zwrot pieniędzy", ru: "возврат денег" }
  - { pl: "zwrot grzecznościowy", ru: "вежливое выражение" }
  - { pl: "zwrot w prawo", ru: "поворот направо" }
family:
  - { pl: "zwrócić", ru: "вернуть; обратить", relation: root, id: zwrocic }
  - { pl: "wrócić", ru: "вернуться", relation: root, id: wrocic }
  - { pl: "zwrotny", ru: "возвратный", relation: derived }
etymology: "От ZWRÓCIĆ, приставочного к WRÓCIĆ «вернуть», из праславянского *vortiti «поворачивать» — того же корня, что русские «воротить», «вращать», «поворот» и «ворот». Три значения слова выросли из одного движения: вернуть означает повернуть назад, оборот речи есть поворот мысли, а поворот — он и есть поворот. Русский на том же корне построил три отдельных слова, польский оставил одно."
memory: "Три русских слова в одном: возврат, поворот, оборот речи. Местный zwrocie — t даёт ć, восьмой случай."
idioms:
  - { pl: "zwrot akcji", ru: "поворот сюжета" }
  - { pl: "zwrot kosztów", ru: "возмещение расходов" }
