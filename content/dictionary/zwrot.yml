        ru: "Резкий поворот влево удивил водителя."
        source: { kind: authored }
      - pl: "W zwrocie akcji była cała siła filmu."
        ru: "В повороте сюжета была вся сила фильма."
        source: { kind: authored }
  - id: phrase
    ru: "оборот речи, выражение"
    examples:
      - pl: "To zwrot grzecznościowy, nie obietnica."
        ru: "Это вежливое выражение, а не обещание."
        source: { kind: authored }
