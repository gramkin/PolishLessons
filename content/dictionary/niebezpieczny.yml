notes:
  - { kind: false-friend, text: "Разберите слово по частям: bezpieczny — это bez + piecza «забота, попечение», буквально «без забот», то есть «безопасный». А русское «беспечный» собрано ровно так же, но значит «беззаботный, легкомысленный». Значения разошлись полностью, и это одна из самых коварных пар." }
  - { kind: usage, text: "Сравнительная степень образуется аналитически: bardziej niebezpieczny «более опасный». Синтетическое niebezpieczniejszy почти не встречается, зато превосходное najniebezpieczniejszy живёт и употребляется." }
  - { kind: government, text: "niebezpieczny DLA kogoś «опасный для кого-то» — с родительным падежом: niebezpieczny dla dzieci, niebezpieczny dla zdrowia." }
  - { kind: usage, text: "Родня: bezpieczny «безопасный», bezpieczeństwo «безопасность», niebezpieczeństwo «опасность», наречие niebezpiecznie." }
collocations:
