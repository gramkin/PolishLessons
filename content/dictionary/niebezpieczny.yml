  - { pl: "piecza", ru: "попечение", relation: root }
etymology: "nie + bezpieczny, а bezpieczny — из bez + piecza «попечение»: буквально «без забот». Русское «беспечный» собрано так же, но значение разошлось."
memory: "Разберите слово по частям: bezpieczny — это bez + piecza «забота», буквально «без забот», то есть «безопасный». Русское «беспечный» собрано ровно так же, но значит «беззаботный» — расхождение полное. Соответственно niebezpieczny значит «опасный». Сравнительная степень аналитическая: bardziej niebezpieczny, зато превосходная najniebezpieczniejszy вполне живёт."
