# review
id: morda
format: 2
lemma: "morda"
rank: 2782
pos: noun
pron: { cyr: "мо́рда" }
senses:
  - id: animal-muzzle
    ru: "морда, пасть (о животном) — нейтрально"
    examples:
      - pl: "Pies położył mordę na kolanach."
        ru: "Пёс положил морду на колени."
        source: { kind: authored }
      - pl: "Konie wyciągały mordy przez ogrodzenie."
        ru: "Кони вытягивали морды через ограду."
        source: { kind: authored }
      - pl: "Krowa otarła mordę o słupek."
        ru: "Корова потёрла морду о столбик."
        source: { kind: authored }
  - id: face-rude
    ru: "морда, рожа (о человеке) — грубо"
    examples:
      - pl: "Zamknij mordę i słuchaj."
        ru: "Заткнись и слушай."
        source: { kind: authored }
      - pl: "Dostał w mordę przed klubem."
        ru: "Он получил в морду перед клубом."
        source: { kind: authored }
notes:
  - { kind: register, text: "Два значения — две разные обстановки. О животном MORDA совершенно нейтральна: так пишут и в книге о собаках, и в ветеринарной карте. О человеке это грубость: ZAMKNIJ MORDĘ значит «заткнись», DAĆ W MORDĘ — «дать в морду». Бранью это не считается, но сказанное незнакомому человеку звучит вызывающе, а в письменном тексте неуместно вовсе. Нейтральные замены для человека: TWARZ «лицо», для животного также PYSK, которое чуть мягче MORDY." }
  - { kind: false-friend, text: "Редкий случай полного совпадения, включая оттенок. Русское «морда» ведёт себя точно так же: нейтрально о животном, грубо о человеке, и даже оборот «дать в морду» совпадает с польским DAĆ W MORDĘ слово в слово. Так что запоминать здесь нечего, нужно только не поддаться обычному подозрению, что похожее слово окажется ловушкой. Единственное, чего в русском нет, — польский оборот MORDA W KUBEŁ, буквально «морда в ведро», со значением «молчи»." }
  - { kind: pronunciation, text: "Читается «мо́рда», в два слога, с ударением на первом — ровно как по-русски, и это один из немногих случаев, когда и ударение, и звуки совпадают полностью. Внимания требует только предложный падеж: MORDZIE звучит «мо́рдзе», где dzi даёт мягкое «дзь». Сравните с русским «морде», где д остаётся твёрдым перед е; по-польски здесь обязательна мягкость." }
  - { kind: government, text: "Куда ударили — предлог W с винительным: DAĆ W MORDĘ, DOSTAĆ W MORDĘ. По чему — предлог PO с предложным: PO MORDZIE. Приказ молчать — винительный без предлога: ZAMKNIJ MORDĘ. Родительный множественного — MORD, без окончания, как у всех существительных женского рода на -a, и форма эта совпадает с родительным от MORD «убийство», хотя слова эти разные; различает их только контекст." }
collocations:
  - { pl: "zamknij mordę", ru: "заткнись" }
  - { pl: "dać w mordę", ru: "дать в морду" }
  - { pl: "morda psa", ru: "морда собаки" }
family:
  - { pl: "pysk", ru: "пасть, морда (о животном)", relation: root }
  - { pl: "twarz", ru: "лицо", relation: root, id: twarz }
  - { pl: "gęba", ru: "рожа, рот (разговорное)", relation: root, id: geba }
etymology: "Происхождение слова не вполне ясно, и это стоит сказать прямо, а не придумывать. Надёжно известно лишь то, что MORDA есть в польском, русском, украинском и белорусском в одном и том же значении и с одним и тем же оттенком, а в более старых памятниках встречается редко, — значит, слово разошлось по славянским языкам сравнительно поздно, вероятнее всего из одного источника, но какого именно, спорно: предполагают и романское, и финно-угорское посредство. На похожее по виду MORD «убийство», пришедшее из немецкого MORD, его возводить нельзя: совпадение корней здесь внешнее, и смыслы между собой не связаны."
memory: "Нейтрально о животном, грубо о человеке — точно как по-русски, вплоть до оборота «дать в морду» и DAĆ W MORDĘ. Предложный падеж мягкий: w mordzie — «мо́рдзе», не «морде». О человеке лучше twarz, о животном мягче pysk."
idioms:
  - { pl: "zamknij mordę", ru: "заткнись (грубое)" }
  - { pl: "dać komuś w mordę", ru: "дать кому-то в морду" }
