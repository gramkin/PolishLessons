# review
id: licencja
format: 2
lemma: "licencja"
rank: 4092
pos: noun
pron: { cyr: "лице́нцья" }
senses:
  - id: licence
    ru: "лицензия"
    examples:
      - pl: "Sklep stracił licencję na sprzedaż alkoholu."
        ru: "Магазин лишился лицензии на продажу алкоголя."
        source: { kind: authored }
      - pl: "Kupiłem licencję na program."
        ru: "Я купил лицензию на программу."
        source: { kind: authored }
      - pl: "Firma działa bez licencji."
        ru: "Фирма работает без лицензии."
        source: { kind: authored }
  - id: certificate
    ru: "свидетельство, допуск (профессиональный)"
    examples:
      - pl: "Zdobył licencję pilota."
        ru: "Он получил свидетельство пилота."
        source: { kind: authored }
      - pl: "Licencja przewodnika górskiego wymaga egzaminu."
        ru: "Для допуска горного гида нужен экзамен."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "LICENCJA — «лицензия» и профессиональный «допуск»: LICENCJA PILOTA. Водительские права — не LICENCJA, а PRAWO JAZDY. И не путайте с LICENCJAT — это степень бакалавра." }
  - { kind: usage, text: "Восемь живых форм, женский род на -CJA. Родительный, дательный и местный — LICENCJI. Архаичная форма LICENCYJ и звательный не даются." }
  - { kind: government, text: "Лицензия на что — LICENCJA NA, и винительный: LICENCJA NA SPRZEDAŻ ALKOHOLU, NA PROGRAM. Без лицензии — BEZ LICENCJI." }
  - { kind: pronunciation, text: "Читается «лице́нцья», ударение на предпоследнем слоге. CE — «це», CJA — «цья»." }
collocations:
  - { pl: "licencja na program", ru: "лицензия на программу" }
  - { pl: "licencja pilota", ru: "свидетельство пилота" }
  - { pl: "stracić licencję", ru: "лишиться лицензии" }
family:
  - { pl: "licencjonowany", ru: "лицензированный", relation: derived }
  - { pl: "licencjat", ru: "бакалавриат, степень бакалавра", relation: derived }
  - { pl: "licencja pilota", ru: "свидетельство пилота", relation: derived }
etymology: "Из латинского слова со значением «разрешение, свобода». От того же корня LICENCJAT — диплом, «дающий право» работать."
memory: "Licencja — лицензия, допуск; licencjat — бакалавр; prawo jazdy — права. Читается «лице́нцья». Licencja na program — лицензия на программу."
idioms:
  - { pl: "dostać zielone światło", ru: "получить зелёный свет" }
formExamplesSkip:
  - { form: "licencyj", reason: "архаичная форма родительного множественного; сейчас говорят LICENCJI" }
  - { form: "licencjo", reason: "звательный падеж у этого слова не употребляется" }
