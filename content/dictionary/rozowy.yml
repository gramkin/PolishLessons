etymology: "От RÓŻA «роза», пришедшей из латинского rosa через немецкий. Русское «розовый» построено от «розы» тем же способом и в то же время, так что слова совпадают и по корню, и по устройству. Любопытная родня у формы RÓŻ: это и родительный множественного от róża «роз», и отдельное существительное róż «румяна, розовая краска» — то же, что французское rouge, тоже «красный» по происхождению."
memory: "Прозрачное слово: róża → różowy, как «роза» → «розовый». ó корневое и не исчезает. В сравнительной степени мужское личное różowsi, а не różowszi."
