notes:
  - { kind: usage, text: "Слово прозрачное: оно образовано от RÓŻA «роза» точно так же, как русское «розовый» от «розы». Угадывать здесь нечего, и это редкий отдых среди ложных друзей. Полезно другое: буква ó тут корневая. Она стоит и в RÓŻA, и в RÓŻY, и во всех формах — różowego, różowszy, najróżowszą, — и никуда не уходит. Этим она отличается от позиционного ó в WZÓR, которое превращается в o, едва слог откроется: wzoru. Если ó есть у однокоренного слова во всех падежах, оно корневое и останется." }
  - { kind: usage, text: "Синтетические степени у слова есть: RÓŻOWSZY и NAJRÓŻOWSZY. У названий цвета польский в этом месте непоследователен, и соседние карточки это показывают: у ŻÓŁTY формы żółtszy и najżółtszy обычны, а у CZERWONY в ходу описательные bardziej czerwony и najbardziej czerwony. Так что правила «цвета не градуируются» нет — надо смотреть на слово, а в сомнении говорить bardziej różowy: описательная степень верна всегда." }
  - { kind: usage, text: "Мужская личная форма множественного меняется по степеням: RÓŻOWI в положительной, но RÓŻOWSI в сравнительной и NAJRÓŻOWSI в превосходной. Суффикс -sz- смягчается в -ś- перед окончанием -i — третий случай после TYPOWSI и KOMPLETNIEJSI из партии 222. И помните, что мужская личная форма годится только для людей: różowi chłopcy сказать можно, а про фламинго будет różowe flamingi, потому что животные в эту форму не попадают." }
  - { kind: pronunciation, text: "Читается «ружо́вы»: ó звучит как у, а ż — как ж. Отсюда ловушка на письме: на слух różowy и несуществующее ruzowy неразличимы совершенно, и выбрать нужную букву можно только по родству — ó оправдано словом RÓŻA. То же и с ż: оно здесь не из rz, а из самого корня róża, где ж стоит и в русском «роза»… вернее, стоит з, но чередование з/ж знакомо по «роза — розовый» в других словах этого типа." }
