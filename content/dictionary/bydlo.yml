lemma: "bydło"
rank: 4847
pos: noun
pron: { cyr: "бы́дуо" }
senses:
  - id: cattle
    ru: "скот, крупный рогатый скот"
    examples:
      - pl: "Na łące pasło się bydło."
        ru: "На лугу пасся скот."
        source: { kind: authored }
      - pl: "Rolnik hoduje bydło mleczne."
        ru: "Фермер разводит молочный скот."
        source: { kind: authored }
      - pl: "Bydło zapędzono do obory."
        ru: "Скот загнали в хлев."
        source: { kind: authored }
  - id: herd
    ru: "скот, быдло (груб., о людях)"
    examples:
      - pl: "Traktowali więźniów jak bydło."
        ru: "С заключёнными обращались как со скотом."
        source: { kind: authored }
      - pl: "Pasażerowie czuli się jak bydło w wagonie."
        ru: "Пассажиры чувствовали себя как скот в вагоне."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Главная ловушка: польское BYDŁO — нейтральное «скот, крупный рогатый скот»: HODOWLA BYDŁA — скотоводство. Русское «быдло» — только оскорбление; в польском этот грубый смысл тоже есть, но он второстепенный. Одно животное — BYDLĘ, а говядина — WOŁOWINA." }
  - { kind: usage, text: "Собирательное существительное среднего рода: BYDŁO PASIE SIĘ. Живых форм пять, все в единственном числе; формы множественного в таблице почти не встречаются. В местном падеже Ł переходит в L: O BYDLE." }
  - { kind: government, text: "Стадо скота — STADO BYDŁA, родительный. Разводить скот — HODOWAĆ BYDŁO, винительный. Обращаться как со скотом — TRAKTOWAĆ JAK BYDŁO." }
  - { kind: pronunciation, text: "Читается «бы́дуо», два слога, ударение на первом. Ł — короткое «у», как в MYDŁO «мы́дуо». В местном падеже BYDLE: «бы́дле»." }
  - { kind: register, text: "В сельском хозяйстве слово нейтральное и официальное. О людях BYDŁO — грубое оскорбление, как и у нас. Учить стоит прежде всего первое значение." }
collocations:
  - { pl: "bydło mleczne", ru: "молочный скот" }
  - { pl: "bydło mięsne", ru: "мясной скот" }
  - { pl: "stado bydła", ru: "стадо скота" }
family:
  - { pl: "bydlę", ru: "скотина (одно животное)", relation: derived }
  - { pl: "bydlęcy", ru: "скотский, бычий", relation: derived }
  - { pl: "bydlak", ru: "скотина (груб., о человеке)", relation: derived }
etymology: "Слово праславянское, от корня «быть» в старом значении «имущество, то, что есть»: скот был главным богатством крестьянина. Русское «быдло» пришло как раз из польского и сохранило только презрительный оттенок."
memory: "Bydło — скот, крупный рогатый: stado bydła, hodowla bydła. Читается «бы́дуо». Русское «быдло» пришло из польского, но в Польше это прежде всего нейтральное «скот». Говядина — wołowina."
idioms:
  - { pl: "traktować jak bydło", ru: "обращаться как со скотом" }
  - { pl: "cudze bydło dojniejsze", ru: "в чужих руках ломоть шире" }
