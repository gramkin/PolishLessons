# review
id: zamierzac
format: 2
lemma: "zamierzać"
rank: 382
pos: verb
aspect: imperf
pron: { cyr: "заме́жаць" }
senses:
  - id: intend
    ru: "собираться, намереваться"
    examples:
      - pl: "Dziś zamierzamy zostać w domu."
        ru: "Сегодня мы собираемся остаться дома."
        source: { kind: tatoeba, id: 3462995 }
      - pl: "Mój syn zamierza być nauczycielem."
        ru: "Мой сын собирается быть учителем."
        source: { kind: tatoeba, id: 3460259 }
      - pl: "Czy on zamierza to zjeść?"
        ru: "Он будет это есть?"
        source: { kind: tatoeba, id: 12574268 }
  - id: not-intend
    ru: "собираться (чаще всего в отрицании — «не собираться»)"
    examples:
      - pl: "On nie zamierza tego jeść."
        ru: "Он это есть не будет."
        source: { kind: tatoeba, id: 12574257 }
      - pl: "Ona nie zamierza tego jeść."
        ru: "Она это есть не будет."
        source: { kind: tatoeba, id: 12574256 }
      - pl: "Zamierzałeś to wszystko sam zjeść?"
        ru: "Ты всё это один съесть собирался?"
        source: { kind: tatoeba, id: 5907112 }
notes:
  - { kind: usage, text: "За zamierzać идёт инфинитив: Zamierzam iść «Я собираюсь идти», Zamierzamy zostać w domu «Мы собираемся остаться дома»." }
  - { kind: usage, text: "Особенно часто слышно в отрицании, с оттенком твёрдого отказа: Nie zamierzam «Я не собираюсь» — это почти «и не подумаю»." }
  - { kind: usage, text: "Совершенный вид zamierzyć в этом значении почти не употребляется, зато zamierzyć się значит «замахнуться»." }
  - { kind: false-friend, text: "Не путайте zamierzać «намереваться» с zmierzać «направляться» и mierzyć «мерить» — все три от одного корня, но значения разошлись." }
collocations:
  - { pl: "nie zamierzam", ru: "я не собираюсь" }
  - { pl: "co zamierzasz?", ru: "что ты собираешься делать?" }
  - { pl: "zamierzać coś zrobić", ru: "собираться что-либо сделать" }
etymology: "Из za- + mierzyć «мерить» — буквально «отмерить заранее». Русское «намереваться» собрано из того же корня «мера», так что логика слова знакома."
memory: "zamierzać — «собираться, намереваться», и внутри сидит mierzyć «мерить», ровно как «мера» внутри русского «намереваться». За глаголом идёт инфинитив, а чаще всего вы услышите его в отказе: Nie zamierzam."
idioms:
  - { pl: "nie zamierzam", ru: "я не собираюсь" }
  - { pl: "co zamierzasz?", ru: "что ты собираешься делать?" }
  - { pl: "zamierzyć się na kogoś", ru: "замахнуться на кого-либо" }
