notes:
  - { kind: false-friend, text: "Значение то же, что у русской «фантазии», и расхождений нет; важнее здесь не значение, а класс. Слова на -CJA, -ZJA и -SJA отвечают русским на -ЦИЯ, -ЗИЯ и -СИЯ один в один: FANTAZJA и «фантазия», STACJA и «станция», LEKCJA и «лекция», DYSKUSJA и «дискуссия». Правило это почти без исключений, и оно даёт сразу несколько сотен слов. Вторая половина подсказки — согласные: там, где русский пишет двойную, польский обходится одной. KOLEKCJA против «коллекции», DYSKUSJA против «дискуссии», KLASA против «класса». Поэтому угадывать слово можно, а списывать русское написание нельзя." }
  - { kind: government, text: "Женский род на -JA. Родительный, дательный и местный единственного совпадают в форме FANTAZJI, и она же служит родительным множественного — так ведут себя все слова этого класса. Рядом существует вторая, старая форма родительного множественного на -YJ: FANTAZYJ, и в текстах до середины двадцатого века она была основной. Сегодня она книжная и встречается в стилизации, но знать её нужно, потому что в старых изданиях она попадается постоянно. Винительный на -Ę: ROZWIJAĆ FANTAZJĘ. Творительный на -Ą: Z FANTAZJĄ." }
  - { kind: pronunciation, text: "Читается «фанта́зья», ударение на предпоследнем слоге из трёх. Сочетание ZJ даёт «зь» с последующим «я», то есть звучит как русское «зья», а не как «зя»: буква J здесь полноценный согласный. То же в KOLEKCJA «колэ́кцья» и STACJA «ста́цья». В родительном FANTAZJI конечное -JI читается «зьи» одним слогом: «фанта́зьи». В старой форме FANTAZYJ ударение остаётся на предпоследнем слоге: «фанта́зый»." }
  - { kind: usage, text: "Частотные сочетания: MIEĆ FANTAZJĘ «иметь фантазию», PUŚCIĆ WODZE FANTAZJI «дать волю фантазии», WYTWÓR FANTAZJI «плод фантазии», Z FANTAZJĄ «с фантазией, изобретательно». Прилагательное FANTAZYJNY значит «причудливый, фантазийный», а FANTASTYCZNY — и «фантастический», и разговорно «замечательный», ровно как русское «фантастический». Существительное FANTASTA это мечтатель, а не писатель; писателя зовут FANTASTA только в сочетании PISARZ FANTASTA." }
