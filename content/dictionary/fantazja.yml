etymology: "Из латинского PHANTASIA, а оно из греческого PHANTASIA «представление, видение», от PHAINEIN «показывать, являть» — того же корня, что PHANTOM и «фантом». Русская «фантазия» пришла тем же книжным путём, через латынь и западноевропейское посредство, поэтому слова совпадают. Интереснее судьба окончания: греческое -IA дало в польском -JA, а в русском -ИЯ, и это соответствие работает на всём классе, от STACJA и «станции» до REWOLUCJA и «революции». Старая польская форма родительного множественного FANTAZYJ сохраняет более раннее состояние, когда -JA ещё склонялось как -IJA, и потому в текстах девятнадцатого века видно STACYJ, LEKCYJ, KOLEKCYJ — ряд, который сегодня заменён формами на -JI."
memory: "Класс важнее слова: польские -cja, -zja, -sja отвечают русским -ция, -зия, -сия почти без исключений — stacja, lekcja, dyskusja. Но согласная одна там, где русский удваивает: kolekcja против «коллекции». Родительный, дательный и местный единственного совпадают: fantazji, и это же родительный множественного; старая форма fantazyj встречается в книгах до середины двадцатого века. Читается «фанта́зья», с j как полноценным согласным."
