etymology: "Общеславянское слово: старославянское СОЧЕВИЦА; русское ЧЕЧЕВИЦА — то же слово с изменённым первым слогом."
memory: "Soczewica — чечевица: начало другое (со-/че-), конец тот же. Soczewka — линза, похожая на зёрнышко чечевицы."
