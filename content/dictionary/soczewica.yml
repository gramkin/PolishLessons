notes:
  - { kind: false-friend, text: "SOCZEWKA по форме уменьшительное, но значит «линза» (в том числе контактная), а не «чечевичка». Стёкла назвали по сходству с зерном чечевицы, как и латинское LENS." }
  - { kind: usage, text: "Женский род, склоняется как ULICA: SOCZEWICY, SOCZEWICĘ, SOCZEWICĄ. Обычно в единственном числе, как и русское слово; множественное SOCZEWICE — о сортах." }
  - { kind: pronunciation, text: "Читается «сочэви́ца»: CZ — твёрдое «ч», после него «э». Ударение на предпоследнем слоге." }
collocations:
