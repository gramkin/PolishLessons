# review
id: kanal
format: 2
lemma: "kanał"
rank: 1807
pos: noun
pron: { cyr: "ка́нау" }
senses:
  - id: channel-tv
    ru: "канал (телевизионный)"
    examples:
      - pl: "To jest kanał dwujęzyczny."
        ru: "Это двуязычный канал."
        source: { kind: translated, id: 11475371 }
      - pl: "To jest RTL2, niemiecki kanał TV."
        ru: "Это RTL2, немецкий телеканал."
        source: { kind: translated, id: 2487570 }
      - pl: "On się rozzłościł dlatego, że zmieniono kanał."
        ru: "Он разозлился из-за того, что переключили канал."
        source: { kind: translated, id: 525295 }
  - id: channel-water
    ru: "канал (водный), пролив"
    examples:
      - pl: "Kanał Panamski łączy Atlantyk z Pacyfikiem."
        ru: "Панамский канал соединяет Атлантику с Тихим океаном."
        source: { kind: translated, id: 765671 }
      - pl: "Kanał płynął pomiędzy dwoma rzędami domów."
        ru: "Канал тёк между двумя рядами домов."
        source: { kind: translated, id: 3855138 }
      - pl: "Brytania jest oddzielona od kontynentu kanałem La Manche."
        ru: "Британия отделена от континента проливом Ла-Манш."
        source: { kind: translated, id: 12378829 }
notes:
  - { kind: usage, text: "Одно слово покрывает телеканал, водный канал, пролив и канализацию: kanał telewizyjny, Kanał Panamski, kanał La Manche, kanał ściekowy." }
  - { kind: government, text: "На канале — na kanale (предложный падеж): film na drugim kanale. По каналу — kanałem (творительный)." }
  - { kind: false-friend, text: "Пролив Ла-Манш по-польски называется kanał La Manche: там, где русский говорит «пролив», поляк говорит kanał." }
  - { kind: usage, text: "Разговорное wpuścić kogoś w kanał значит «подставить, обмануть кого-то»." }
collocations:
  - { pl: "kanał telewizyjny", ru: "телеканал" }
  - { pl: "Kanał Panamski", ru: "Панамский канал" }
  - { pl: "zmienić kanał", ru: "переключить канал" }
family:
  - { pl: "kanalizacja", ru: "канализация", relation: root }
  - { pl: "telewizja", ru: "телевидение", relation: root, id: telewizja }
  - { pl: "rzeka", ru: "река", relation: root, id: rzeka }
etymology: "Из латинского canalis «труба, жёлоб» через немецкий; русское «канал» пришло тем же путём. Значения совпадают почти полностью."
memory: "kanał — «канал» во всех смыслах сразу: телеканал, водный канал, пролив и канализация. Ла-Манш по-польски — kanał La Manche."
idioms:
  - { pl: "zmienić kanał", ru: "переключить канал" }
  - { pl: "Kanał Panamski", ru: "Панамский канал" }
  - { pl: "wpuścić w kanał", ru: "подставить, обмануть" }
