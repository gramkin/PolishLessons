        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Русское «современный» по-польски два разных слова. NOWOCZESNY — «новейший, передовой», о технике, дизайне и взглядах: NOWOCZESNA KUCHNIA, NOWOCZESNY SAMOLOT. WSPÓŁCZESNY — «относящийся к нашему времени», об эпохе и искусстве: SZTUKA WSPÓŁCZESNA. Скажете NOWOCZESNA HISTORIA — получится «модная история», а не «новейшая»." }
  - { kind: usage, text: "Полная парадигма: NOWOCZESNY, NOWOCZEŚNIEJSZY, NAJNOWOCZEŚNIEJSZY. Перед окончанием -IEJSZY и в мужском-личном S смягчается в Ś: NOWOCZEŚNI, NOWOCZEŚNIEJSI, NAJNOWOCZEŚNIEJSI. Простые степени совершенно обычны: NAJNOWOCZEŚNIEJSZY SPRZĘT." }
  - { kind: government, text: "Ставится и до, и после существительного: NOWOCZESNY DOM, DOM NOWOCZESNY. Современный для своего времени — NOWOCZESNY JAK NA SWOJE CZASY, JAK NA с винительным. В сравнении — NIŻ или OD с родительным." }
  - { kind: pronunciation, text: "Читается «новочэ́сны», четыре слога, ударение на предпоследнем. Все O чёткие, без аканья. CZE — твёрдое «чэ». В NOWOCZEŚNIEJSZY S становится мягким «сь»: «новочэсьне́йшы»." }
  - { kind: register, text: "Нейтральное слово, частое в рекламе, архитектуре и политике: NOWOCZESNA POLSKA, NOWOCZESNE TECHNOLOGIE. О человеке — похвала, но с оттенком: NOWOCZESNY RODZIC — родитель, который не запрещает телефон. NOWOCZESNA — ещё и название польской партии." }
collocations:
  - { pl: "nowoczesny sprzęt", ru: "современное оборудование" }
  - { pl: "nowoczesne technologie", ru: "современные технологии" }
  - { pl: "nowoczesna architektura", ru: "современная архитектура" }
family:
  - { pl: "współczesny", ru: "современный (о нашем времени)", relation: root, id: wspolczesny }
  - { pl: "nowy", ru: "новый", relation: root, id: nowy }
  - { pl: "nowoczesność", ru: "современность", relation: derived }
etymology: "Сложение NOWY «новый» и CZAS «время»: «нового времени». Русского аналога у этой модели нет, «новочасный» не говорят. Сравните с WSPÓŁCZESNY, где тот же CZAS соединён с WSPÓŁ «со»: «того же времени». Поляк разделил то, что русский называет одним словом."
memory: "Nowoczesny — современный, новейший: nowoczesny sprzęt, nowoczesna kuchnia. А современный по эпохе — współczesny. Nowy + czas. Nowocześniejszy, najnowocześniejszy. Читается «новочэ́сны»."
idioms:
  - { pl: "nowoczesny jak na swoje czasy", ru: "передовой для своего времени" }
