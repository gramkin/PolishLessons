notes:
  - kind: usage
    text: "Форма зависит от рода: dwa (м. р. и ср. р.: dwa kwiaty), dwie (ж. р.: dwie córki), dwaj или dwóch (мужчины: dwaj bracia / dwóch braci)."
  - kind: usage
    text: "Собирательное dwoje употребляется с детьми, парными предметами и словами среднего рода на -ę: dwoje dzieci, dwoje uszu."
collocations:
  - { pl: "dwa razy", ru: "два раза, дважды" }
  - { pl: "we dwoje", ru: "вдвоём" }
family:
  - { pl: "dwoje", ru: "двое", relation: derived }
  - { pl: "dwanaście", ru: "двенадцать", relation: root }
  - { pl: "dwójka", ru: "двойка", relation: derived }
etymology: "Праславянское *dъva из праиндоевропейского *dwoh₁ — то же слово, что русское «два». Одно из древнейших числительных: родственники есть и в латинском duo, и в английском two."
memory: "Род различается как в русском: dwa okna, dwie córki. Но есть третья форма, которой в русском нет прямого аналога — dwoje: она нужна для смешанных групп (dwoje dzieci, dwoje ludzi) и для слов вроде drzwi. Для мужчин-лиц отдельно стоит dwaj chłopcy или dwóch chłopców."
idioms:
  - { pl: "bez dwóch zdań", ru: "без всяких сомнений" }
  - { pl: "dwa kroki stąd", ru: "в двух шагах отсюда" }
  - { pl: "upiec dwie pieczenie przy jednym ogniu", ru: "убить двух зайцев одним выстрелом" }
  - { pl: "trzymać dwie sroki za ogon", ru: "гнаться за двумя зайцами" }
  - { pl: "na dwoje babka wróżyła", ru: "бабушка надвое сказала" }
