# review
id: wszelki
format: 2
lemma: "wszelki"
rank: 1176
pos: adj
pron: { cyr: "фшэ́льки" }
senses:
  - id: any
    ru: "всякий, любой"
    examples:
      - pl: "Chcemy wygrać za wszelką cenę!"
        ru: "Мы хотим выиграть любой ценой!"
        source: { kind: tatoeba, id: 4786718 }
      - pl: "Muszę jej pomóc za wszelką cenę."
        ru: "Я должен помочь ей любой ценой."
        source: { kind: tatoeba, id: 2146238 }
      - pl: "Stracił wszelką nadzieję."
        ru: "Он потерял всякую надежду."
        source: { kind: translated, id: 3649409 }
  - id: just-in-case
    ru: "na wszelki wypadek — на всякий случай"
    examples:
      - pl: "Na wszelki wypadek lepiej weź parasol."
        ru: "На всякий случай лучше возьми зонт."
        source: { kind: translated, id: 364515 }
      - pl: "Lepiej wykupić ubezpieczenie, tak na wszelki wypadek."
        ru: "Лучше оформить страховку, так, на всякий случай."
        source: { kind: translated, id: 3457744 }
  - id: every-effort
    ru: "dołożyć wszelkich starań — приложить все усилия"
    examples:
      - pl: "Dołóż wszelkich starań."
        ru: "Приложи все усилия."
        source: { kind: translated, id: 536536 }
      - pl: "Dołożę wszelkich starań, aby to skończyć."
        ru: "Я приложу все усилия, чтобы это закончить."
        source: { kind: translated, id: 510111 }
notes:
  - { kind: usage, text: "na wszelki wypadek «на всякий случай» — самый частый оборот со словом, и совпадает с русским дословно." }
  - { kind: usage, text: "za wszelką cenę значит «любой ценой»: Musimy wygrać za wszelką cenę." }
  - { kind: usage, text: "dołożyć wszelkich starań — «приложить все усилия», устойчивое сочетание с родительным множественного." }
  - { kind: false-friend, text: "Различайте wszelki «всякий, любой» и wszystek «весь, целиком»: wszelka nadzieja «всякая надежда», но wszystkie książki «все книги»." }
collocations:
  - { pl: "na wszelki wypadek", ru: "на всякий случай" }
  - { pl: "za wszelką cenę", ru: "любой ценой" }
  - { pl: "dołożyć wszelkich starań", ru: "приложить все усилия" }
family:
  - { pl: "wszystko", ru: "всё", relation: root, id: wszystko }
  - { pl: "wszędzie", ru: "везде", relation: derived, id: wszedzie }
etymology: "От того же корня, что wszystko «всё» и wszędzie «везде», плюс суффикс -ki. Русское «всякий» собрано из того же «весь»."
memory: "wszelki — «всякий, любой». Главный оборот — na wszelki wypadek «на всякий случай», слово в слово как по-русски. А za wszelką cenę значит «любой ценой»."
idioms:
  - { pl: "na wszelki wypadek", ru: "на всякий случай" }
  - { pl: "za wszelką cenę", ru: "любой ценой" }
formExamplesSkip:
