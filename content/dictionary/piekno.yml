# review
id: piekno
format: 2
lemma: "piękno"
rank: 1401
pos: noun
pron: { cyr: "пе́нкно" }
senses:
  - id: beauty
    ru: "красота, прекрасное (как понятие)"
    examples:
      - pl: "My kochamy piękno."
        ru: "Мы любим прекрасное."
        source: { kind: tatoeba, id: 718983 }
      - pl: "Piękno przemija."
        ru: "Красота проходит."
        source: { kind: translated, id: 4469918 }
      - pl: "Piękno wymaga poświęceń."
        ru: "Красота требует жертв."
        source: { kind: translated, id: 10581241 }
  - id: someones-beauty
    ru: "чья-либо красота"
    examples:
      - pl: "Piękno Mary było nie do opisania."
        ru: "Красота Мэри была неописуема."
        source: { kind: tatoeba, id: 12567501 }
      - pl: "Jego córka obdarzona jest pięknem i wdziękiem."
        ru: "Его дочь одарена красотой и обаянием."
        source: { kind: translated, id: 543500 }
notes:
  - { kind: usage, text: "Существительное среднего рода: piękno, piękna, pięknu, pięknem. Обозначает красоту как понятие, а не красивую вещь." }
  - { kind: false-friend, text: "Форма piękna двусмысленна: это и родительный падеж от piękno «красоты», и женский род прилагательного piękny «красивая». Jesteś piękna — «Ты красивая», прилагательное." }
  - { kind: usage, text: "Похожая ловушка с pięknie: почти всегда это наречие «красиво» (Pięknie śpiewa «Он красиво поёт»), а не форма существительного." }
  - { kind: usage, text: "Гнездо слова: piękny «красивый», pięknie «красиво», piękność «красавица»." }
collocations:
  - { pl: "piękno natury", ru: "красота природы" }
  - { pl: "kochać piękno", ru: "любить прекрасное" }
  - { pl: "zachwycać się pięknem", ru: "восхищаться красотой" }
etymology: "От прилагательного piękny «красивый» (праславянское *pěknъ). Прямого русского родственника у корня нет, поэтому слово запоминается отдельно от «красоты»."
memory: "piękno — «красота» как понятие, средний род. Осторожно с формой piękna: это и родительный падеж от piękno, и женский род прилагательного piękny «красивая». А pięknie почти всегда наречие «красиво»."
idioms:
  - { pl: "piękno przemija", ru: "красота проходит" }
  - { pl: "piękno wymaga poświęceń", ru: "красота требует жертв" }
  - { pl: "piękno natury", ru: "красота природы" }
formExamplesSkip:
  - { form: "piękien", reason: "такой формы у существительного нет; словарь форм даёт её ошибочно" }
  - { form: "piękn", reason: "такой формы у существительного нет; словарь форм даёт её ошибочно" }
