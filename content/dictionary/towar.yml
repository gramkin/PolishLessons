# review
id: towar
format: 2
lemma: "towar"
rank: 1455
pos: noun
pron: { cyr: "то́вар" }
senses:
  - id: goods
    ru: "товар"
    examples:
      - pl: "Czy w tym sklepie są towary wolnocłowe?"
        ru: "Есть ли в этом магазине беспошлинные товары?"
        source: { kind: tatoeba, id: 744242 }
      - pl: "Ten towar jest na sprzedaż."
        ru: "Этот товар продаётся."
        source: { kind: translated, id: 823185 }
      - pl: "Wczoraj była dostawa towarów."
        ru: "Вчера была поставка товаров."
        source: { kind: translated, id: 1086498 }
  - id: merchandise
    ru: "товар как предмет торговли вообще"
    examples:
      - pl: "Dobry towar nie potrzebuje reklamy."
        ru: "Хороший товар не нуждается в рекламе."
        source: { kind: translated, id: 368128 }
      - pl: "Ten sklep sprzedaje towary importowane."
        ru: "Этот магазин продаёт импортные товары."
        source: { kind: translated, id: 999385 }
notes:
  - { kind: usage, text: "Мужской неодушевлённый: towar, towaru, o towarze. Русское «товар» — то же самое слово." }
  - { kind: usage, text: "Родственники по корню: towarzysz «товарищ» и towarzystwo «общество, компания». Изначально это те, кто вместе везёт товар." }
  - { kind: register, text: "В разговорной речи towar может значить «наркотики», а в грубой — о человеке. В нейтральном языке это просто «товар»." }
  - { kind: usage, text: "Ходовые сочетания: towary wolnocłowe «беспошлинные товары», dostawa towarów «поставка товаров»." }
collocations:
  - { pl: "dobry towar", ru: "хороший товар" }
  - { pl: "dostawa towarów", ru: "поставка товаров" }
  - { pl: "towary wolnocłowe", ru: "беспошлинные товары" }
etymology: "Праславянское заимствование из тюркского tavar «имущество, скот». Русский «товар» пришёл тем же путём, и польское towarzysz «товарищ» — от того же корня."
memory: "towar — «товар», слово то же самое. Держите в голове связь с карточкой towarzystwo: towarzysz «товарищ» и towarzystwo «общество» идут от этого же корня — изначально те, кто вместе везёт товар."
idioms:
  - { pl: "towary wolnocłowe", ru: "беспошлинные товары" }
  - { pl: "dobry towar", ru: "хороший товар" }
  - { pl: "żywy towar", ru: "живой товар" }
