# review
id: trakt
format: 2
lemma: "trakt"
rank: 1788
pos: noun
pron: { cyr: "тракт" }
senses:
  - id: during
    ru: "w trakcie czegoś — во время, в ходе чего-либо"
    examples:
      - pl: "Zasnąłem głęboko w trakcie wykładu."
        ru: "Я крепко заснул во время лекции."
        source: { kind: translated, id: 2093829 }
      - pl: "Dzwonek zadzwonił w trakcie posiłku."
        ru: "Звонок прозвенел во время еды."
        source: { kind: translated, id: 2093826 }
      - pl: "Nie czytaj w trakcie chodzenia."
        ru: "Не читай на ходу."
        source: { kind: translated, id: 5095327 }
  - id: in-progress
    ru: "w trakcie — в процессе, идёт"
    examples:
      - pl: "Badania w trakcie."
        ru: "Исследования идут."
        source: { kind: translated, id: 2829979 }
      - pl: "Wszyscy są w trakcie jedzenia."
        ru: "Все сейчас едят."
        source: { kind: translated, id: 4836980 }
      - pl: "Sprawa jest w trakcie rozpoznawania."
        ru: "Дело находится в стадии рассмотрения."
        source: { kind: translated, id: 713471 }
notes:
  - { kind: usage, text: "В корпусе слово живёт только в обороте w trakcie «во время, в ходе». Существительное trakt «тракт, старая дорога» существует, но встречается почти только в исторических текстах и названиях." }
  - { kind: government, text: "w trakcie требует родительного падежа: w trakcie wykładu «во время лекции», w trakcie rozmowy «в ходе разговора»." }
  - { kind: usage, text: "Само по себе w trakcie значит «в процессе», без дополнения: badania w trakcie «исследования идут»." }
  - { kind: false-friend, text: "Близкий оборот podczas тоже значит «во время» и тоже требует родительного; w trakcie чуть более подчёркивает длящийся процесс." }
collocations:
  - { pl: "w trakcie", ru: "во время, в процессе" }
  - { pl: "w trakcie rozmowy", ru: "в ходе разговора" }
  - { pl: "w trakcie wykładu", ru: "во время лекции" }
family:
  - { pl: "droga", ru: "дорога", relation: root, id: droga }
  - { pl: "traktować", ru: "трактовать, обращаться", relation: root }
etymology: "Из латинского tractus «протяжение, путь» через немецкий. Русское «тракт» пришло тем же путём, но в польском живым остался прежде всего оборот w trakcie."
memory: "trakt в живой речи держится оборотом w trakcie «во время, в ходе»: w trakcie wykładu. Требует родительного падежа, как и близкое podczas."
idioms:
  - { pl: "w trakcie", ru: "во время, в процессе" }
  - { pl: "w trakcie rozmowy", ru: "в ходе разговора" }
  - { pl: "w trakcie wykładu", ru: "во время лекции" }
