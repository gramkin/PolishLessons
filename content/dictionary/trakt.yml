etymology: "Из латинского tractus «протяжение, путь» через немецкий. Русское «тракт» пришло тем же путём, но в польском живым остался прежде всего оборот w trakcie."
memory: "trakt в живой речи держится оборотом w trakcie «во время, в ходе»: w trakcie wykładu. Требует родительного падежа, как и близкое podczas."
