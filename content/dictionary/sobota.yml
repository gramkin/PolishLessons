notes:
  - { kind: government, text: "Когда — w sobotę (винительный падеж): przyjdziesz w sobotę? По субботам — w soboty, тоже винительный, но множественное число." }
  - { kind: usage, text: "Названия дней недели по-польски пишутся со строчной буквы, как и по-русски: sobota, niedziela." }
  - { kind: usage, text: "Множественное soboty значит «субботы» вообще, регулярно: nie pracuję w soboty «я не работаю по субботам»." }
  - { kind: false-friend, text: "Слово то же, что русское «суббота», только с одним «б»: sobota. Из еврейского шаббат, как и русское." }
collocations:
  - { pl: "w sobotę", ru: "в субботу" }
  - { pl: "w soboty", ru: "по субботам" }
  - { pl: "do zobaczenia w sobotę", ru: "до встречи в субботу" }
family:
  - { pl: "niedziela", ru: "воскресенье", relation: root }
  - { pl: "tydzień", ru: "неделя", relation: root, id: tydzien }
  - { pl: "sobotni", ru: "субботний", relation: root }
etymology: "Из еврейского шаббат через греческий и латынь — тем же путём, что русское «суббота». Разница только в написании: по-польски одно b."
memory: "sobota — «суббота». В субботу — w sobotę, по субботам — w soboty. Дни недели пишутся со строчной буквы, как и в русском."
idioms:
