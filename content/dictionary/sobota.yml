notes:
  - { kind: government, text: "Когда — w sobotę (винительный падеж): przyjdziesz w sobotę? По субботам — w soboty, тоже винительный, но множественное число." }
  - { kind: usage, text: "Названия дней недели по-польски пишутся со строчной буквы, как и по-русски: sobota, niedziela." }
  - { kind: usage, text: "Множественное soboty значит «субботы» вообще, регулярно: nie pracuję w soboty «я не работаю по субботам»." }
  - { kind: false-friend, text: "Слово то же, что русское «суббота», только с одним «б»: sobota. Из еврейского шаббат, как и русское." }
collocations:
