# review
id: niepostrzezenie
format: 2
lemma: "niepostrzeżenie"
rank: 5855
pos: adv
pron: { cyr: "непостшэжэ́не" }
senses:
  - id: unnoticed
    ru: "незаметно, украдкой"
    note: "так, что никто не увидел"
    examples:
      - pl: "Wymknął się niepostrzeżenie z sali."
        ru: "Он незаметно выскользнул из зала."
        source: { kind: authored }
      - pl: "Złodziej wszedł do domu niepostrzeżenie."
        ru: "Вор проник в дом незаметно."
        source: { kind: authored }
      - pl: "Udało jej się niepostrzeżenie schować list."
        ru: "Ей удалось незаметно спрятать письмо."
        source: { kind: authored }
  - id: imperceptibly
    ru: "незаметно, неуловимо"
    note: "о времени, постепенных переменах"
    examples:
      - pl: "Całe lato minęło niepostrzeżenie."
        ru: "Всё лето пролетело незаметно."
        source: { kind: authored }
      - pl: "Nasze dzieci rosną niepostrzeżenie."
        ru: "Наши дети растут незаметно."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Буквально «незамеченно»: от POSTRZEC «заметить». Два случая: кто-то делает что-то украдкой (WYMKNĄĆ SIĘ NIEPOSTRZEŻENIE «незаметно ускользнуть») и время или перемены идут неуловимо (CZAS MIJA NIEPOSTRZEŻENIE)." }
  - { kind: register, text: "Слово скорее книжное. В разговоре чаще говорят PO CICHU «тихонько» или NIEZAUWAŻENIE «незамеченно»." }
  - { kind: pronunciation, text: "Читается «непостшэжэ́не»: RZ после глухого T оглушается в «ш», а Ż — звонкое «ж». Ударение на предпоследний слог, ŻE." }
collocations:
  - { pl: "wymknąć się niepostrzeżenie", ru: "незаметно ускользнуть" }
  - { pl: "niepostrzeżenie zniknąć", ru: "незаметно исчезнуть" }
  - { pl: "minąć niepostrzeżenie", ru: "пройти незаметно" }
family:
  - { pl: "spostrzec", ru: "заметить", relation: root, id: spostrzec }
  - { pl: "postrzegać", ru: "воспринимать", relation: root }
  - { pl: "spostrzeżenie", ru: "наблюдение, замечание", relation: root }
etymology: "Отрицание NIE- и наречие от причастия POSTRZEŻONY «замеченный», от POSTRZEC «заметить»."
memory: "nie + postrzeżony «не замеченный» = niepostrzeżenie — «незаметно». Spostrzec — заметить."
idioms:
  - { pl: "czas mija niepostrzeżenie", ru: "время летит незаметно" }
