# review
id: ucieczka
format: 2
lemma: "ucieczka"
rank: 1493
pos: noun
pron: { cyr: "уце́чка" }
senses:
  - id: escape
    ru: "побег, бегство"
    examples:
      - pl: "Ucieczka to nie jest odpowiedź."
        ru: "Побег — это не ответ."
        source: { kind: translated, id: 999302 }
      - pl: "Jego ucieczka z więzienia była dobrze przemyślana."
        ru: "Его побег из тюрьмы был хорошо продуман."
        source: { kind: translated, id: 13343180 }
      - pl: "Planowali ucieczkę."
        ru: "Они планировали побег."
        source: { kind: translated, id: 3743815 }
  - id: flight-from
    ru: "бегство от чего-либо, уход"
    examples:
      - pl: "Sami rzucił się do ucieczki."
        ru: "Сами бросился бежать."
        source: { kind: translated, id: 7969950 }
      - pl: "Tom czuł wielką chęć ucieczki."
        ru: "Том почувствовал сильное желание сбежать."
        source: { kind: translated, id: 4148440 }
notes:
  - { kind: false-friend, text: "ucieczka — это «побег, бегство», а не «утечка». «Утечка» по-польски wyciek: wyciek gazu «утечка газа»." }
  - { kind: usage, text: "От uciekać «убегать», которое уже есть карточкой. Женский род, предложный с чередованием k→c: w ucieczce." }
  - { kind: usage, text: "rzucić się do ucieczki — «броситься бежать», устойчивый оборот." }
  - { kind: usage, text: "Второе значение — уход от неприятного: ucieczka od rzeczywistości «бегство от реальности»." }
collocations:
  - { pl: "ucieczka z więzienia", ru: "побег из тюрьмы" }
  - { pl: "rzucić się do ucieczki", ru: "броситься бежать" }
  - { pl: "droga ucieczki", ru: "путь к отступлению" }
etymology: "От uciekać «убегать»: приставка u- и корень, родственный слову ciec «течь». Русский «побег» собран иначе, а созвучие с «утечкой» — ложная опора."
memory: "ucieczka — «побег, бегство», от uciekać «убегать». Осторожно: это НЕ «утечка», утечка по-польски wyciek. Предложный с чередованием: w ucieczce."
idioms:
  - { pl: "rzucić się do ucieczki", ru: "броситься бежать" }
  - { pl: "ucieczka od rzeczywistości", ru: "бегство от реальности" }
  - { pl: "droga ucieczki", ru: "путь к отступлению" }
