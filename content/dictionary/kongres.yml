etymology: "Из латинского слова со значением «встреча, сходка». Русский «конгресс» — то же слово, а польское ZJAZD — его славянский синоним."
memory: "Kongres — конгресс, съезд; na kongresie — на конгрессе. Читается «ко́нгрэс». Zjazd — то же по-славянски."
