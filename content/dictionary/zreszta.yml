# review
id: zreszta
format: 2
lemma: "zresztą"
rank: 2024
pos: part
pron: { cyr: "зрэ́штон" }
senses:
  - id: besides
    ru: "впрочем, к тому же"
    examples:
      - pl: "Jestem marnym biegaczem, zresztą pływakiem również."
        ru: "Я плохой бегун, впрочем, и пловец тоже."
        source: { kind: translated, id: 365594 }
      - pl: "On jest im bardzo wdzięczny, zresztą słusznie."
        ru: "Он им очень благодарен, и вполне справедливо."
        source: { kind: translated, id: 354698 }
      - pl: "Nie mogę tam iść, zresztą wcale nie chcę."
        ru: "Я не могу туда пойти, впрочем, я и не хочу."
        source: { kind: translated, id: 536133 }
  - id: anyway
    ru: "да и вообще, как бы то ни было"
    examples:
      - pl: "Zresztą to nieważne."
        ru: "Впрочем, это неважно."
        source: { kind: authored }
      - pl: "Zresztą sam zobaczysz."
        ru: "Впрочем, сам увидишь."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Вводное слово: добавляет оговорку или уточнение, как русское «впрочем»." }
  - { kind: usage, text: "Обычно выделяется запятыми и стоит в начале предложения или перед уточнением." }
  - { kind: false-friend, text: "Не «зря» и не «сразу». Буквально «с остатком»: z + reszta «остаток»." }
  - { kind: usage, text: "Близкие по смыслу: poza tym «кроме того», w dodatku «вдобавок»." }
collocations:
  - { pl: "zresztą nieważne", ru: "впрочем, неважно" }
etymology: "z + resztą, творительный падеж от reszta «остаток» (через немецкое Rest): буквально «с остатком» → «в остальном, впрочем»."
memory: "zresztą = «впрочем». Буквально «с остатком»: z + reszta. Ставится в запятых, ровно как русское «впрочем»."
idioms:
