# review
id: spoznic
format: 2
lemma: "spóźnić"
rank: 709
pos: verb
aspect: perf
pron: { cyr: "спу́зьниць" }
senses:
  - id: be-late
    ru: "spóźnić się — опоздать"
    note: "Глагол живёт только с się."
    examples:
      - pl: "Tom spóźnił się do pracy."
        ru: "Том опоздал на работу."
        source: { kind: tatoeba, id: 8160905 }
      - pl: "Nikt się nie spóźnił."
        ru: "Никто не опоздал."
        source: { kind: tatoeba, id: 351950 }
      - pl: "Spóźnili się."
        ru: "Они опоздали."
        source: { kind: translated, id: 10593307 }
  - id: late-for
    ru: "spóźnić się NA coś — опоздать на что-л. (винительный)"
    examples:
      - pl: "Spóźnili się na ostatni pociąg."
        ru: "Они опоздали на последний поезд."
        source: { kind: tatoeba, id: 3457091 }
      - pl: "Spóźniliśmy się na tramwaj."
        ru: "Мы опоздали на трамвай."
        source: { kind: tatoeba, id: 10138136 }
      - pl: "Postaraj się nie spóźnić na kolację."
        ru: "Постарайся не опоздать к ужину."
        source: { kind: tatoeba, id: 3195709 }
  - id: delay
    ru: "spóźnienie — опоздание"
    examples:
      - pl: "Wybacz spóźnienie."
        ru: "Прости за опоздание."
        source: { kind: translated, id: 613359 }
      - pl: "Przeprosił za spóźnienie."
        ru: "Он извинился за опоздание."
        source: { kind: translated, id: 1626577 }
      - pl: "Pociąg miał 10 minut spóźnienia."
        ru: "Поезд опоздал на десять минут."
        source: { kind: translated, id: 365217 }
  - id: late-adj
    ru: "spóźniony — опоздавший; Jestem spóźniony «Я опаздываю»"
    note: "Там, где русский ставит глагол, поляк ставит причастие."
    examples:
      - pl: "Jestem spóźniony."
        ru: "Я опаздываю."
        source: { kind: translated, id: 5662097 }
      - pl: "Jesteś spóźniony."
        ru: "Ты опаздываешь."
        source: { kind: translated, id: 10593308 }
      - pl: "Jesteśmy spóźnieni."
        ru: "Мы опаздываем."
        source: { kind: translated, id: 2913190 }
notes:
  - { kind: government, text: "Два управления, и их надо развести. Опоздать НА что-то — spóźnić się NA coś, с винительным: spóźnić się na pociąg, na lekcję. Опоздать КУДА-то — spóźnić się DO czegoś, с родительным: spóźnić się do pracy, do szkoły." }
  - { kind: usage, text: "Глагол употребляется только с się: spóźnić się. Формы без частицы не существует." }
  - { kind: usage, text: "Причастие spóźniony работает сказуемым: Jestem spóźniony буквально значит «я опоздавший», то есть «я опаздываю». Русский в этом месте ставит глагол, польский — причастие." }
  - { kind: usage, text: "Существительное spóźnienie очень ходовое: Przepraszam za spóźnienie «Извините за опоздание», Pociąg ma dziesięć minut spóźnienia «Поезд опаздывает на десять минут». Несовершенный вид — spóźniać się." }
collocations:
  - { pl: "spóźnić się na pociąg", ru: "опоздать на поезд" }
  - { pl: "spóźnić się do pracy", ru: "опоздать на работу" }
  - { pl: "przepraszam za spóźnienie", ru: "извините за опоздание" }
  - { pl: "być spóźnionym", ru: "опаздывать" }
family:
  - { pl: "późny", ru: "поздний", relation: root }
  - { pl: "późno", ru: "поздно", relation: root }
  - { pl: "spóźniać się", ru: "опаздывать", relation: aspect }
  - { pl: "spóźnienie", ru: "опоздание", relation: derived }
etymology: "От późny «поздний» с приставкой s- — то же гнездо, что русские «поздний» и «опоздать»."
memory: "spóźnić się — «опоздать», от późny «поздний», ровно как русское «опоздать» от «поздно». Глагол живёт только с się. Управление надо развести: spóźnić się NA pociąg «опоздать на поезд» — винительный, но spóźnić się DO pracy «опоздать на работу» — родительный. И запомните Jestem spóźniony: буквально «я опоздавший» — там, где русский ставит глагол, поляк ставит причастие."
idioms:
  - { pl: "przepraszam za spóźnienie", ru: "извините за опоздание" }
  - { pl: "spóźnić się na pociąg", ru: "опоздать на поезд" }
  - { pl: "być spóźnionym", ru: "опаздывать" }
