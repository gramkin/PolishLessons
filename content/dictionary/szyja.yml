      - pl: "Złapał mnie za szyję."
        ru: "Он схватил меня за шею."
        source: { kind: translated, id: 410741 }
      - pl: "Mary objęła Toma za szyję."
        ru: "Мэри обняла Тома за шею."
        source: { kind: translated, id: 6547815 }
      - pl: "Dziewczynka ma na szyi szalik."
        ru: "У девочки на шее шарф."
        source: { kind: translated, id: 720150 }
notes:
  - { kind: false-friend, text: "Формы szyje и szyję совпадают с глаголом szyć «шить»: ona szyje значит «она шьёт», а powiedz jej, że szyję — «скажи ей, что я шью»." }
  - { kind: government, text: "На шее — na szyi (предложный падеж); за шею — za szyję (винительный): złapał mnie za szyję." }
  - { kind: usage, text: "na łeb na szyję — «сломя голову», буквально «на голову на шею»." }
  - { kind: usage, text: "Горлышко бутылки — szyjka, уменьшительное от szyja; а горло как орган — gardło." }
collocations:
  - { pl: "na szyi", ru: "на шее" }
  - { pl: "za szyję", ru: "за шею" }
  - { pl: "na łeb na szyję", ru: "сломя голову" }
family:
  - { pl: "szyjka", ru: "шейка, горлышко", relation: root }
  - { pl: "gardło", ru: "горло", relation: root, id: gardlo }
  - { pl: "głowa", ru: "голова", relation: root, id: glowa }
etymology: "Праславянское *šija — то же слово, что русское «шея». Родственно szyć «шить» лишь по звучанию, не по происхождению."
memory: "szyja — «шея»: na szyi «на шее», za szyję «за шею». Осторожно: szyje и szyję совпадают с формами глагола szyć «шить»."
idioms:
  - { pl: "na łeb na szyję", ru: "сломя голову" }
  - { pl: "na szyi", ru: "на шее" }
  - { pl: "rzucić się komuś na szyję", ru: "броситься кому-то на шею" }
