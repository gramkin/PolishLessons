etymology: "Праславянское *šija — то же слово, что русское «шея». Родственно szyć «шить» лишь по звучанию, не по происхождению."
memory: "szyja — «шея»: na szyi «на шее», za szyję «за шею». Осторожно: szyje и szyję совпадают с формами глагола szyć «шить»."
