# review
id: watpic
format: 2
lemma: "wątpić"
rank: 1164
pos: verb
aspect: imperf
pron: { cyr: "во́нтпиць" }
senses:
  - id: doubt
    ru: "сомневаться"
    examples:
      - pl: "Wątpię."
        ru: "Сомневаюсь."
        source: { kind: tatoeba, id: 12564164 }
      - pl: "Wątpię w to."
        ru: "Я в этом сомневаюсь."
        source: { kind: translated, id: 3005175 }
      - pl: "Policja wątpi w moje alibi."
        ru: "Полиция сомневается в моём алиби."
        source: { kind: translated, id: 739251 }
  - id: doubt-that
    ru: "wątpić, czy — сомневаться, что что-то произойдёт"
    examples:
      - pl: "Wątpię, czy zadziała."
        ru: "Сомневаюсь, что сработает."
        source: { kind: translated, id: 362004 }
      - pl: "Wątpię, że przyjdzie punktualnie."
        ru: "Сомневаюсь, что он придёт вовремя."
        source: { kind: translated, id: 597853 }
  - id: without-doubt
    ru: "bez wątpienia — без сомнения"
    examples:
      - pl: "Bez wątpienia."
        ru: "Без сомнения."
        source: { kind: translated, id: 8705104 }
      - pl: "Bez wątpienia Wszechświat jest nieskończony."
        ru: "Нет сомненья: вселенная бесконечна."
        source: { kind: tatoeba, id: 349109 }
notes:
  - { kind: government, text: "wątpić W coś — предлог w с винительным падежом: wątpić w sukces «сомневаться в успехе». Русское «сомневаться в» требует предложного, так что падеж другой." }
  - { kind: usage, text: "С придаточным идёт czy или że: Wątpię, czy przyjdzie «Сомневаюсь, что он придёт»." }
  - { kind: usage, text: "Отглагольное wątpienie живёт прежде всего в обороте bez wątpienia «без сомнения», очень частом в речи." }
  - { kind: usage, text: "Несовершенный вид; совершенного у глагола практически нет. Родственное wątpliwość значит «сомнение»." }
collocations:
  - { pl: "wątpić w coś", ru: "сомневаться в чём-то" }
  - { pl: "bez wątpienia", ru: "без сомнения" }
  - { pl: "wątpię, czy", ru: "сомневаюсь, что" }
family:
  - { pl: "wątpliwość", ru: "сомнение", relation: derived }
  - { pl: "wątpliwy", ru: "сомнительный", relation: derived }
etymology: "Праславянское *vątpiti, от *vątъ «слабый, сомнительный». Русское «сомневаться» собрано иначе, от «мнить»."
memory: "wątpić — «сомневаться», и падеж другой: wątpić W coś, предлог w с винительным, а по-русски «сомневаться в» — предложный. Самый частый оборот со словом — bez wątpienia «без сомнения»."
idioms:
  - { pl: "bez wątpienia", ru: "без сомнения" }
  - { pl: "wątpić w siebie", ru: "сомневаться в себе" }
