# review
id: oszukac
format: 2
lemma: "oszukać"
rank: 2569
pos: verb
pron: { cyr: "ошу́каць" }
senses:
  - id: cheat
    ru: "обмануть, надуть (кого-л.)"
    examples:
      - pl: "Oszukał nas na kilka tysięcy."
        ru: "Он обманул нас на несколько тысяч."
        source: { kind: authored }
      - pl: "Sprzedawca oszukał go na wadze."
        ru: "Продавец обманул его на весе."
        source: { kind: authored }
  - id: deceive-senses
    ru: "обмануть (чувства, ожидания)"
    examples:
      - pl: "Pamięć mnie oszukała."
        ru: "Память меня обманула."
        source: { kind: authored }
      - pl: "Oszukaj głód, napij się wody."
        ru: "Обмани голод, выпей воды."
        source: { kind: authored }
  - id: cheat-at-game
    ru: "сжульничать, смухлевать"
    examples:
      - pl: "Chłopcy oszukali w kartach."
        ru: "Мальчики сжульничали в картах."
        source: { kind: authored }
      - pl: "Widać, że oszukałeś w rachunku."
        ru: "Видно, что ты сжульничал в счёте."
        source: { kind: authored }
notes:
  - { kind: government, text: "oszukać kogoś — ВИНИТЕЛЬНЫЙ падеж, и дополнением здесь обычно бывает именно человек: oszukać klienta, oszukać wspólnika. Поэтому мужсколичное страдательное причастие oszukani «обманутые» совершенно обычно — это как раз тот случай, когда обманывают людей, а не вещи." }
  - { kind: usage, text: "Совершенный вид; несовершенный — oszukiwać. Разница привычная: oszukał mnie raz «обманул меня один раз», oszukiwał mnie latami «обманывал меня годами»." }
  - { kind: usage, text: "Не смешивайте oszukać и okłamać. okłamać kogoś — «солгать кому-л., сказать неправду», а oszukać kogoś — «обмануть, провести», обычно ради выгоды. Можно okłamać, никого при этом не обманув, и можно oszukać без единого слова." }
  - { kind: false-friend, text: "Внутри oszukać виден глагол szukać «искать», родственный украинскому «шукати» и диалектному русскому «шукать»; литературное русское соответствие — «искать». Но связь между «искать» и «обмануть» в современном языке уже не ощущается, и переводить oszukać как «разыскать» нельзя." }
collocations:
  - { pl: "oszukać klienta", ru: "обмануть клиента" }
  - { pl: "oszukać na wadze", ru: "обмануть на весе" }
  - { pl: "czuć się oszukanym", ru: "чувствовать себя обманутым" }
family:
  - { pl: "oszukiwać", ru: "обманывать", relation: aspect }
  - { pl: "oszust", ru: "мошенник, обманщик", relation: derived }
  - { pl: "oszustwo", ru: "обман, мошенничество", relation: derived }
  - { pl: "szukać", ru: "искать", relation: root, id: szukac }
etymology: "Приставка o- и глагол szukać «искать», восходящий к праславянскому *šukati. Живой родственник этого корня — украинское «шукати» и диалектное русское «шукать»; в литературном русском ему отвечает «искать». Современный польский связи между двумя значениями уже не чувствует: oszukać значит только «обмануть». Из того же гнезда oszust «мошенник» и oszustwo «обман»."
memory: "oszukać kogoś — обмануть кого-то, дополнение в винительном и почти всегда человек. Внутри слова спрятан szukać «искать», но переводить его так нельзя. Рядом стоят oszust «мошенник» и oszustwo «обман»."
idioms:
  - { pl: "oszukać głód", ru: "обмануть голод, заморить червячка" }
  - { pl: "czuć się oszukanym", ru: "чувствовать себя обманутым" }
