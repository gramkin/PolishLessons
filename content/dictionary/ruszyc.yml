# review
id: ruszyc
format: 2
lemma: "ruszyć"
rank: 888
pos: verb
aspect: perf
aspectPair: ruszac
pron: { cyr: "ру́шыць" }
senses:
  - id: set-off
    ru: "тронуться, двинуться"
    examples:
      - pl: "Pociąg już ruszył."
        ru: "Поезд уже тронулся."
        source: { kind: translated, id: 771941 }
      - pl: "Ruszyli prosto do celu."
        ru: "Они двинулись прямо к цели."
        source: { kind: translated, id: 404546 }
      - pl: "Ruszyliśmy o szóstej."
        ru: "Мы тронулись в шесть."
        source: { kind: translated, id: 713457 }
  - id: budge
    ru: "ruszyć się — пошевелиться, сдвинуться"
    examples:
      - pl: "Nie mogę się ruszyć."
        ru: "Я не могу пошевелиться."
        source: { kind: translated, id: 357820 }
      - pl: "Tom nie mógł się ruszyć."
        ru: "Том не мог пошевелиться."
        source: { kind: translated, id: 8807778 }
      - pl: "Nikt się nie ruszył."
        ru: "Никто не пошевелился."
        source: { kind: translated, id: 10596033 }
  - id: touch
    ru: "тронуть, сдвинуть с места"
    examples:
      - pl: "Mój ojciec w domu nie ruszy nawet palcem."
        ru: "Мой отец дома палец о палец не ударит."
        source: { kind: translated, id: 362399 }
      - pl: "Ten słoń nie ruszy nawet na krok."
        ru: "Этот слон и шагу не сделает."
        source: { kind: translated, id: 349593 }
      - pl: "Niedźwiedź nie ruszy martwego ciała."
        ru: "Медведь не тронет мёртвое тело."
        source: { kind: translated, id: 1353299 }
notes:
  - { kind: false-friend, text: "Корень тот же, что в русском «рушить», но значения разошлись полностью: польское ruszyć — «тронуться, сдвинуть», а «рушить» будет burzyć или niszczyć." }
  - { kind: usage, text: "Совершенный вид к ruszać. Pociąg rusza «поезд трогается» — pociąg ruszył «поезд тронулся»." }
  - { kind: usage, text: "Возвратное ruszyć się «пошевелиться, сдвинуться» — самое частое в разговоре: Rusz się! «Шевелись!», Nie mogę się ruszyć «Я не могу пошевелиться»." }
  - { kind: usage, text: "nie ruszyć palcem — «палец о палец не ударить», а ruszyć głową — «пошевелить мозгами»." }
collocations:
  - { pl: "ruszyć w drogę", ru: "тронуться в путь" }
  - { pl: "rusz się!", ru: "шевелись!" }
  - { pl: "nie ruszyć palcem", ru: "палец о палец не ударить" }
  - { pl: "ruszyć głową", ru: "пошевелить мозгами" }
family:
  - { pl: "ruszać", ru: "двигать, трогать", relation: aspect, id: ruszac }
  - { pl: "ruch", ru: "движение", relation: root }
  - { pl: "poruszyć", ru: "тронуть, затронуть", relation: derived }
etymology: "Праславянское *rušiti «двигать, сокрушать» — тот же корень, что русское «рушить». Значения разошлись: поляк трогается с места, русский ломает."
memory: "ruszyć — «тронуться, двинуться»: Pociąg ruszył. Возвратное ruszyć się значит «пошевелиться»: Nie mogę się ruszyć. Корень тот же, что в «рушить», но смысл совсем другой — это ложный друг."
idioms:
  - { pl: "ruszyć głową", ru: "пошевелить мозгами" }
  - { pl: "nie ruszyć palcem", ru: "палец о палец не ударить" }
  - { pl: "ruszyć z kopyta", ru: "рвануть с места" }
