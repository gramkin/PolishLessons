notes:
  - { kind: false-friend, text: "SINIAK — «синяк», и это редкий случай полного совпадения. Но прилагательное SINY — не «синий»: «синий» по-польски NIEBIESKI или GRANATOWY, а SINY — «синюшный, посиневший»: SINE USTA — посиневшие губы. Книжный синоним SINIAKA — SINIEC." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. В винительном две формы: SINIAK и разговорная SINIAKA: MAM SINIAKA. Родительный — SINIAKA." }
  - { kind: government, text: "Синяк на чём-то — SINIAK NA CZYMŚ, местный: NA KOLANIE. Мазь от синяков — MAŚĆ NA SINIAKI, NA с винительным. Без синяков — BEZ SINIAKÓW, родительный." }
  - { kind: pronunciation, text: "Читается «сьи́няк», два слога, ударение на первом. SI даёт мягкое «сьи», как в SIŁA «сьи́уа», а NIA — «ня». В форме SINIAKA: «сьиня́ка»." }
collocations:
  - { pl: "duży siniak", ru: "большой синяк" }
  - { pl: "maść na siniaki", ru: "мазь от синяков" }
  - { pl: "siniak na ręce", ru: "синяк на руке" }
family:
  - { pl: "siny", ru: "синюшный, посиневший", relation: root }
  - { pl: "siniec", ru: "синяк, кровоподтёк (книжн.)", relation: derived }
  - { pl: "zsinieć", ru: "посинеть", relation: derived }
etymology: "От SINY «синюшный», праславянского слова, общего с русским «синий». Значения разошлись: в русском «синий» — цвет неба, в польском SINY — болезненная синюшность. А SINIAK и русский «синяк» — одно слово с одинаковым смыслом."
memory: "Siniak — синяк: mam siniaka na kolanie. Читается «сьи́няк». Siniaki pod oczami — синяки под глазами. Но siny — не «синий», а «посиневший»; синий — niebieski."
idioms:
  - { pl: "siniaki pod oczami", ru: "синяки под глазами" }
  - { pl: "nabić sobie siniaka", ru: "набить себе синяк" }
formExamplesSkip:
