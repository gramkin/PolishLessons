# review
id: opor
format: 2
lemma: "opór"
rank: 2698
pos: noun
pron: { cyr: "о́пур" }
senses:
  - id: resistance
    ru: "сопротивление"
    examples:
      - pl: "Opór był krótki, ale zacięty."
        ru: "Сопротивление было коротким, но упорным."
        source: { kind: authored }
      - pl: "Nie stawiał żadnego oporu."
        ru: "Он не оказывал никакого сопротивления."
        source: { kind: authored }
      - pl: "Opór elektryczny mierzy się w omach."
        ru: "Электрическое сопротивление измеряют в омах."
        source: { kind: authored }
  - id: reluctance
    ru: "нежелание, колебания"
    examples:
      - pl: "Z oporem zgodził się na wyjazd."
        ru: "С неохотой он согласился на поездку."
        source: { kind: authored }
      - pl: "Bez oporów przyjął propozycję."
        ru: "Без колебаний он принял предложение."
        source: { kind: authored }
notes:
  - { kind: pronunciation, text: "Это слово повторяет правило, показанное на wzór, буква в букву. В закрытом слоге пишется ó: OPÓR и родительный множественного OPORÓW. В открытом остаётся o: opo-ru, opo-rze, opo-ry, opo-rom. Окончание -ów всегда несёт ó, поэтому форма множественного выглядит как исключение, хотя подчиняется тому же правилу. Предложный заодно смягчает r в rz: W OPORZE." }
  - { kind: usage, text: "Слово короткое и ходовое там, где русский берёт длинное «сопротивление»: STAWIAĆ OPÓR, opór powietrza, opór elektryczny. Множественное число живёт своей жизнью и означает внутренние колебания: mieć opory znaczy «стесняться, не решаться», a Z OPORAMI — «с трудом, нехотя». Это уже не физика, а характер." }
collocations:
  - { pl: "stawiać opór", ru: "оказывать сопротивление" }
  - { pl: "opór elektryczny", ru: "электрическое сопротивление" }
  - { pl: "z oporami", ru: "с трудом, нехотя" }
family:
  - { pl: "oprzeć się", ru: "опереться; воспротивиться", relation: root }
  - { pl: "oporny", ru: "упорный, непокорный", relation: derived }
  - { pl: "podpora", ru: "опора", relation: root }
etymology: "От OPRZEĆ SIĘ, из праславянского корня *per-/*por- «переть, упирать». Это тот же корень, что в русских «опора», «упор» и «подпереть»: сопротивляться значит упереться во что-то. Русское «сопротивление» собрано из других частей, но мысль та же, и родня у польского слова на русской стороне хорошо видна."
memory: "ó в закрытом слоге: opór, oporów. o в открытом: oporu, oporze. И множественное значит другое: mieć opory — стесняться."
idioms:
