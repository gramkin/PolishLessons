# review
id: udo
format: 2
lemma: "udo"
rank: 2590
pos: noun
pron: { cyr: "у́до" }
senses:
  - id: thigh
    ru: "бедро (часть ноги от колена до бедра)"
    examples:
      - pl: "Uderzył się w udo o krawędź stołu."
        ru: "Он ударился бедром об край стола."
        source: { kind: authored }
      - pl: "Lekarz zbadał mu prawe udo."
        ru: "Врач осмотрел ему правое бедро."
        source: { kind: authored }
      - pl: "Tatuaż ma na udzie."
        ru: "Татуировка у него на бедре."
        source: { kind: authored }
  - id: meat-cut
    ru: "бедро, окорочок (в кулинарии)"
    examples:
      - pl: "Na obiad były uda z kurczaka."
        ru: "На обед были куриные бёдра."
        source: { kind: authored }
      - pl: "Kupiła dwa uda indyka."
        ru: "Она купила два бедра индейки."
        source: { kind: authored }
notes:
  - { kind: government, text: "Средний род: udo, uda, udu, udem, udzie. Множественное число обычное: uda, ud, udach." }
  - { kind: usage, text: "Анатомически udo — только от колена до бедра; само бедро как сустав и кость — biodro." }
  - { kind: usage, text: "В кулинарии uda z kurczaka «куриные бёдра» — обычный ценник в магазине." }
  - { kind: false-friend, text: "Не путайте с формами глагола udać się «удаться»: mi się uda значит «у меня получится» и к бедру отношения не имеет." }
collocations:
  - { pl: "uda z kurczaka", ru: "куриные бёдра" }
  - { pl: "mięsień uda", ru: "мышца бедра" }
  - { pl: "na udzie", ru: "на бедре" }
family:
  - { pl: "udko", ru: "бёдрышко, окорочок", relation: derived }
  - { pl: "udowy", ru: "бедренный", relation: derived }
etymology: "Праславянское слово со значением «член, часть тела». Прямое русское соответствие — устаревшее «уд» в том же значении; в современном языке оно вышло из употребления, поэтому udo приходится запоминать отдельно."
memory: "udo — «бедро» от колена вверх, а сустав это biodro. Осторожно с омонимией: uda это и «бёдра», и «удастся» от udać się."
idioms:
  - { pl: "uda z kurczaka", ru: "куриные бёдра" }
