  - { pl: "dietetyczna cola", ru: "диетическая кола" }
etymology: "От названия африканского дерева кола: его орехи входили в первоначальный рецепт напитка. Русское «кола» — то же слово и тот же путь через английский."
memory: "Poproszę colę — «Мне, пожалуйста, колу». Запомните родительный coli: butelka coli «бутылка колы», fan coli «любитель колы»."
