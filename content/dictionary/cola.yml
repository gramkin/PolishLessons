pos: noun
pron: { cyr: "ко́ля" }
senses:
  - id: drink
    ru: "кола (напиток)"
    examples:
      - pl: "Piją colę."
        ru: "Они пьют колу."
        source: { kind: translated, id: 818710 }
      - pl: "Poproszę colę."
        ru: "Мне, пожалуйста, колу."
        source: { kind: translated, id: 361162 }
      - pl: "Nie jestem fanem coli."
        ru: "Я не фанат колы."
        source: { kind: translated, id: 12455207 }
      - pl: "Kiedyś piłem dużo coli, teraz piję tylko wodę."
        ru: "Раньше я пил много колы, а теперь пью только воду."
        source: { kind: translated, id: 969900 }
      - pl: "Laurie nie lubi dietetycznej coli."
        ru: "Лори не любит диетическую колу."
        source: { kind: translated, id: 4043903 }
      - pl: "Duże frytki i dwie średnie cole."
        ru: "Большую картошку фри и две средние колы."
        source: { kind: translated, id: 1348380 }
notes:
  - { kind: usage, text: "Чаще всего слово встречается в винительном падеже (Poproszę colę «Мне, пожалуйста, колу») и в родительном (butelka coli «бутылка колы»)." }
  - { kind: usage, text: "Словари дают основным написание kola; форма cola закрепилась под влиянием марки Coca-Cola. В живых текстах встречаются оба варианта." }
  - { kind: pronunciation, text: "Польское l мягче русского «л»: cola звучит ближе к «коля», чем к «кола»." }
  - { kind: usage, text: "Множественное число считает порции: dwie cole «две колы», nie mam już col «колы больше нет». Так же ведут себя другие названия напитков — dwa piwa, trzy herbaty." }
collocations:
  - { pl: "poproszę colę", ru: "мне, пожалуйста, колу" }
  - { pl: "butelka coli", ru: "бутылка колы" }
  - { pl: "dietetyczna cola", ru: "диетическая кола" }
etymology: "От названия африканского дерева кола: его орехи входили в первоначальный рецепт напитка. Русское «кола» — то же слово и тот же путь через английский."
memory: "Poproszę colę — «Мне, пожалуйста, колу». Запомните родительный coli: butelka coli «бутылка колы», fan coli «любитель колы»."
idioms:
