# review
id: powiazac
format: 2
lemma: "powiązać"
rank: 1990
pos: verb
pron: { cyr: "повё́нзаць" }
senses:
  - id: tie-together
    ru: "связать (вместе, в связки)"
    examples:
      - pl: "Powiązał gazety sznurkiem."
        ru: "Он связал газеты бечёвкой."
        source: { kind: authored }
      - pl: "Powiążcie te paczki po dwie."
        ru: "Свяжите эти свёртки по две."
        source: { kind: authored }
      - pl: "Powiązane snopy stały na polu."
        ru: "Связанные снопы стояли в поле."
        source: { kind: authored }
  - id: link
    ru: "увязать, соотнести (факты, события)"
    examples:
      - pl: "Powiązał fakty i wszystko zrozumiał."
        ru: "Он связал факты и всё понял."
        source: { kind: authored }
      - pl: "Te dwie sprawy łatwo powiązać."
        ru: "Эти два дела легко увязать."
        source: { kind: authored }
  - id: connections
    ru: "powiązanie — связь, взаимосвязь; powiązania — связи"
    examples:
      - pl: "Powiązania między firmami okazały się bliskie."
        ru: "Связи между фирмами оказались тесными."
        source: { kind: authored }
      - pl: "Powiązania z tą grupą wyszły na jaw."
        ru: "Связи с этой группой вышли наружу."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "КОРЕНЬ УЖЕ БЫЛ НА ДРУГОЙ КАРТОЧКЕ: польское wiązać — это русское «вязать», и то же гнездо дало więzień «узник», węzeł «узел», związek «связь, союз». Соответствие тут wię-/wią- при русском «вя-/у-». Приставка po- работает как русская «по-/с-»: powiązać значит «связать»." }
  - { kind: government, text: "Связывают ЧТО С ЧЕМ — z с ТВОРИТЕЛЬНЫМ, в точности как по-русски: powiązać fakty Z zeznaniami, powiązać nazwisko Z firmą. Чем связывают — тоже творительный, но без предлога: powiązać gazety sznurkiem «связать газеты бечёвкой». Обе модели совпадают с родным языком." }
  - { kind: usage, text: "Вид совершенный, несовершенная пара — powiązywać, но куда чаще скажут просто wiązać. Существительное во множественном числе — powiązania — значит «связи» в смысле знакомств и зависимостей, часто с душком: powiązania biznesowe, powiązania ze światem przestępczym." }
  - { kind: pronunciation, text: "Носовой ą держится во всей парадигме: powiązać, powiązał, powiążę, powiązany — чередования с ę тут нет, в отличие от глаголов на -nąć вроде płynąć. Перед ż носовой читается как «он»: «повё́нзаць», «повёнжэ»." }
collocations:
  - { pl: "powiązać fakty", ru: "связать факты" }
  - { pl: "powiązania biznesowe", ru: "деловые связи" }
  - { pl: "ściśle powiązany", ru: "тесно связанный" }
family:
  - { pl: "wiązać", ru: "вязать, связывать", relation: root }
  - { pl: "związek", ru: "связь, союз", relation: root, id: zwiazek }
  - { pl: "węzeł", ru: "узел", relation: root }
etymology: "Приставка po- плюс wiązać «вязать», от праславянского *vęzati — того же корня, что русские «вязать», «узел», «узник», «связь». Польский сохранил носовой: wiązać при «вязать», węzeł при «узле», więzień при «узнике». Отсюда же związek «союз» и obowiązek «обязанность», буквально «то, чем обвязан»."
memory: "powiązać — «связать», от wiązać «вязать»: тот же корень, что в węzeł «узел» и więzień «узник». Управление родное: powiązać coś Z czymś, творительный. А powiązania во множественном — это «связи», чаще всего сомнительные."
idioms:
  - { pl: "powiązać fakty", ru: "связать факты воедино" }
  - { pl: "powiązania ze światem przestępczym", ru: "связи с преступным миром" }
