etymology: "Из итальянского PASSAPORTO, собранного из PASSARE «проходить» и PORTO «порт, ворота»: буквально «проходи порт», разрешение пройти в гавань. Через французский PASSEPORT слово разошлось по всей Европе, и русское «паспорт» и польское PASZPORT — один и тот же путешественник, только польский записал середину по-своему, через SZ. Первая часть родственна польскому PASOWAĆ и русскому «пассаж», вторая — латинскому PORTUS, от которого и «порт», и «портал», и польское PORT. Образ морских ворот объясняет и смысл: документ нужен был не вообще для жизни, а чтобы тебя впустили и выпустили."
memory: "Это заграничный паспорт! Внутренний документ в Польше — dowód osobisty, и именно его просят в банке и у врача. В местном падеже t переходит в c: w paszporcie, как na monecie. Из итальянского passaporto — «пройди порт», разрешение войти в гавань."
