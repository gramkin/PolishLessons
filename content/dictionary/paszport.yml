notes:
  - { kind: false-friend, text: "Полного совпадения с русским «паспортом» здесь нет, и это важно для быта. PASZPORT в польском — это документ для выезда за границу, то есть русский «загранпаспорт». Внутренний документ, который в России называют просто паспортом, в Польше не существует в таком виде: его роль играет DOWÓD OSOBISTY, буквально «личное удостоверение», и именно его спрашивают в банке, на почте и у врача. Поэтому вопрос CZY MA PAN PASZPORT? на границе и просьба POPROSZĘ DOWÓD в аптеке — о разных документах, и путать их не стоит." }
  - { kind: pronunciation, text: "Читается «па́шпорт», ударение на первом слоге из двух. Сочетание SZ даёт «ш», так что начало звучит «паш-», а не «пас-». В местном падеже PASZPORCIE согласная T перед -IE переходит в C и смягчается: «пашпо́рце». Это сквозное польское чередование, то же, что в MONETA и MONECIE, STUDENT и STUDENCIE, TORT и TORCIE. Конечное T глухое, оглушать не нужно." }
  - { kind: usage, text: "Устойчивые сочетания стоит выучить блоком, потому что в них разные предлоги: WYROBIĆ PASZPORT «оформить паспорт», WAŻNY PASZPORT «действительный паспорт», PASZPORT WYGASŁ «паспорт просрочен», KONTROLA PASZPORTOWA «паспортный контроль». Прилагательное PASZPORTOWY образуется суффиксом -OWY и не имеет степеней сравнения, как все относительные прилагательные. В переносном смысле слово работает так же, как в русском: PASZPORT DO KARIERY «паспорт в карьеру», то есть пропуск куда-то." }
  - { kind: government, text: "Мужской род, неодушевлённое: винительный равен именительному, ZGUBIŁ PASZPORT. При отрицании — родительный: NIE MA PASZPORTU. Родительный единственного на -U, как у большинства неодушевлённых: BEZ PASZPORTU. Местный на -IE с чередованием: W PASZPORCIE. Предлог Z с творительным для сопровождения: Z PASZPORTEM W RĘKU «с паспортом в руке». Существительное неодушевлённое, поэтому множественное число совершенно правильное: PASZPORTY, PASZPORTÓW." }
