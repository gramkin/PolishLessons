# review
id: mierzyc
format: 2
lemma: "mierzyć"
rank: 4638
pos: verb
pron: { cyr: "ме́жыць" }
senses:
  - id: measure
    ru: "мерить, измерять"
    examples:
      - pl: "Mierzę temperaturę dziecku."
        ru: "Я меряю ребёнку температуру."
        source: { kind: authored }
      - pl: "Krawiec mierzy długość rękawa."
        ru: "Портной измеряет длину рукава."
        source: { kind: authored }
      - pl: "Ten zegarek mierzy puls."
        ru: "Эти часы измеряют пульс."
        source: { kind: authored }
  - id: try-on
    ru: "примерять; целиться (MIERZYĆ DO KOGOŚ); MIERZYĆ WYSOKO — метить высоко"
    examples:
      - pl: "Mierzy sukienkę w przymierzalni."
        ru: "Она примеряет платье в примерочной."
        source: { kind: authored }
      - pl: "Policjant mierzy do złodzieja z pistoletu."
        ru: "Полицейский целится в вора из пистолета."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "MIERZYĆ — «мерить», и в польском, как в русском, это и «измерять», и «примерять»: MIERZYĆ BUTY. Но у польского есть третье значение — «целиться»: MIERZYĆ DO KOGOŚ Z BRONI. Рост человека — MIERZYĆ, а вот вес — WAŻYĆ." }
  - { kind: usage, text: "Несовершенный вид; совершенный — ZMIERZYĆ (измерить) или PRZYMIERZYĆ (примерить). Спряжение: MIERZĘ, MIERZYSZ, MIERZĄ. Безличное ILE MIERZYSZ? — «какой у тебя рост?»: MIERZĘ METR OSIEMDZIESIĄT." }
  - { kind: government, text: "Что — винительный: MIERZYĆ POKÓJ, CIŚNIENIE. Кому — дательный: MIERZYĆ KOMUŚ GORĄCZKĘ. Чем — творительный: MIERZYĆ LINIJKĄ. В кого целиться — DO с родительным: MIERZYĆ DO CELU. Кого чем мерить — MIERZYĆ KOGOŚ WZROKIEM «мерить взглядом»." }
  - { kind: pronunciation, text: "Читается «ме́жыць»: IE — «е», RZ — «ж». Ударение на первом слоге. MIERZĘ — «ме́жэ»." }
  - { kind: register, text: "Нейтральное слово. MIERZYĆ SIŁY NA ZAMIARY — книжное «соизмерять силы с намерениями»." }
collocations:
  - { pl: "mierzyć temperaturę", ru: "мерить температуру" }
  - { pl: "mierzyć sukienkę", ru: "примерять платье" }
  - { pl: "mierzyć wysoko", ru: "метить высоко" }
family:
  - { pl: "zmierzyć", ru: "измерить", relation: aspect, id: zmierzyc }
  - { pl: "miara", ru: "мера", relation: root, id: miara }
  - { pl: "przymierzać", ru: "примерять", relation: derived }
etymology: "От MIARA «мера», праславянское *měra, как русское «мерить», «мера». Польское IE на месте русского Е и RZ на месте Р — обычные соответствия."
memory: "Mierzyć — мерить: mierzę temperaturę, mierzę sukienkę. Mierzyć do kogoś — целиться. Ile mierzysz? — какой у тебя рост?"
idioms:
  - { pl: "mierzyć siły na zamiary", ru: "соизмерять силы с намерениями" }
