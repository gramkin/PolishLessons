etymology: "От того же праславянского корня, что KROPLA «капля» и KROPIĆ «кропить», с образом мелкой капли, оставляющей след. Русский от этого корня произвёл «крапать», «крапинку» и «кропить», но для знака препинания взял «точку», от «ткнуть», то есть от укола пером. Поляк же назвал знак по капле. Оба образа говорят об одном: о самом маленьком следе, какой можно оставить на бумаге."
memory: "Корень общий с русскими «крапинкой», «крапать» и «кропить», а рядом стоит kropla «капля»: поляк назвал точку по капле, русский по уколу пером. Запоминать лучше парой с kratka: sukienka w kropki это «платье в горошек», koszula w kratkę это «рубашка в клетку». Оборот i kropka работает как русское «и точка». В дательном и местном k переходит в c: w kropce."
