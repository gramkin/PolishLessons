notes:
  - { kind: false-friend, text: "Корень русскому знаком, хотя слово на первый взгляд чужое: KROPKA одного гнезда с «крапинкой», «крапать» и «кропить». Рядом стоит KROPLA «капля», и обе восходят к одному образу мелкого следа от упавшей влаги. Выучив KROPKA и KRATKA вместе, вы получаете сразу два узора: SUKIENKA W KROPKI это «платье в горошек», а KOSZULA W KRATKĘ — «рубашка в клетку»." }
  - { kind: usage, text: "Десять форм, женский род. В дательном и местном падеже единственного числа K переходит в C: KROPKA, но W KROPCE. Родительный множественного KROPEK с беглым E. Множественное KROPKI значит и несколько точек, и узор в горошек, причём во втором случае слово почти всегда стоит с предлогом W: W KROPKI, как и W KRATKĘ, W PASKI." }
  - { kind: government, text: "Поставить точку — POSTAWIĆ KROPKĘ, винительный без предлога. В горошек — предлог W с винительным множественного: SUKIENKA W KROPKI, та же конструкция, что для всякого узора. Точка над i — KROPKA NAD I, предлог NAD с творительным, и буква I здесь не склоняется. В конце предложения — NA KOŃCU ZDANIA, предлог NA с местным падежом." }
  - { kind: pronunciation, text: "Читается «кро́пка», два слога, ударение на первом. Все согласные твёрдые, никаких носовых. В дательном и местном падеже KROPCE сочетание PC произносится слитно, и слышно «кро́пце». В родительном множественного KROPEK беглое E звучит отчётливо: «кро́пэк». Родственное KROPLA звучит «кро́пля», с мягким «ль» перед A." }
  - { kind: register, text: "Слово нейтральное и повседневное: POSTAWIĆ KROPKĘ, KROPKA NAD I, SUKIENKA W KROPKI. Оборот I KROPKA в конце фразы работает ровно как русское «и точка»: NIE IDZIESZ I KROPKA значит «не идёшь, и точка». В разговоре он слышен постоянно и звучит безапелляционно. Выражение POSTAWIĆ KROPKĘ NAD I употребляют и буквально, и в смысле «договорить до конца»." }
