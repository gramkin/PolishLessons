notes:
  - { kind: false-friend, text: "ANOMALIA — «аномалия», с одним L: ANOMALIA. Погодные аномалии — ANOMALIE POGODOWE. Аномальный — ANOMALNY. В разговоре проще: DZIWACTWO, WYJĄTEK." }
  - { kind: usage, text: "Женский род. Родительный, дательный и местный — ANOMALII. Множественное — ANOMALIE. Звательный и архаичное ANOMALIJ не используем." }
  - { kind: government, text: "Аномалия в чём — ANOMALIA W и местный. Аномалия чего — родительный: ANOMALIA RYNKU. Обнаружить аномалию — WYKRYĆ ANOMALIĘ." }
  - { kind: pronunciation, text: "Читается «анома́лья»: LIA — «лья». Ударение на предпоследнем слоге." }
collocations:
  - { pl: "anomalia pogodowa", ru: "погодная аномалия" }
  - { pl: "wykryć anomalię", ru: "обнаружить аномалию" }
  - { pl: "anomalia genetyczna", ru: "генетическая аномалия" }
family:
  - { pl: "anomalny", ru: "аномальный", relation: derived }
