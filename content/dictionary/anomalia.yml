etymology: "Из греческого ANŌMALIA «неровность», от A- «не» и HOMALOS «ровный». Русское «аномалия» — то же слово."
memory: "Anomalia — аномалия, одно l. Anomalia pogodowa — погодная аномалия. Читается «анома́лья»."
