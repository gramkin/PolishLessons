etymology: "Слово из детской, няньковой речи, и надёжного древнего корня у него нет: такие слова рождаются из звуков, которыми взрослые разговаривают с младенцами, и потому их история обычно обрывается. В русском тот же слой дал «бука», «баю» и «ляля». От BUZIA польский успел произвести целое гнездо: BUZIAK «поцелуйчик», BUZIACZEK, BUŹKA, которое сегодня означает ещё и смайлик в переписке. Нейтральное TWARZ, напротив, слово древнее и общеславянское."
memory: "Русского однословного соответствия нет: buzia это ласковое личико и ротик разом, прежде всего детские. Запоминать надо не слово, а лестницу: twarz нейтральное «лицо», buzia ласковое, gęba грубоватое «морда», morda откровенно грубое. Zamknij buzię ребёнку это мягко, zamknij gębę это уже ссора. Читается «бу́зя», zi даёт мягкое «зь». Оборот dać buzi «поцеловать» стоит в родительном падеже."
idioms:
  - { pl: "dać buzi", ru: "поцеловать, чмокнуть" }
