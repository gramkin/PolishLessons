notes:
  - { kind: false-friend, text: "Прямого русского соответствия у слова нет, и это важнее любого сходства. BUZIA это ласковое название лица или рта, прежде всего детского: по-русски пришлось бы выбирать между «личиком», «мордашкой» и «ротиком» по обстановке. Поляк обходится одним словом и употребляет его постоянно, разговаривая с ребёнком. Переводить BUZIA как «лицо» почти всегда значит потерять всю теплоту: нейтральное лицо это TWARZ." }
  - { kind: register, text: "Слово стоит на лестнице из четырёх ступеней, и её стоит выучить целиком. TWARZ — нейтральное «лицо». BUZIA — ласковое, детское, и о взрослой женщине тоже, с оттенком симпатии. GĘBA — грубоватое «морда», примерно как русская «рожа». MORDA — откровенно грубое. Сказать ZAMKNIJ BUZIĘ ребёнку мягко и обычно, а ZAMKNIJ GĘBĘ это уже ссора. Ошибка на этой лестнице слышна сразу." }
  - { kind: usage, text: "Одиннадцать форм, женский род, мягкая основа на -IA, как CIOCIA и BABCIA. Родительный, дательный и местный падежи единственного числа совпадают в BUZI. Два звательных: BUZIO и ласковое BUZIU, причём второе в обращении к ребёнку звучит чаще. Родительный множественного BUŹ с мягким Ź вместо ZI, форма редкая и для русского уха неожиданная." }
  - { kind: government, text: "В рот — предлог DO с родительным: WŁOŻYĆ DO BUZI, тогда как русский говорит «в рот», с винительным. На личике — предлог NA с местным падежом: NA BUZI. С полным ртом — творительный без предлога после Z: Z PEŁNĄ BUZIĄ. В обороте DAĆ BUZI слово стоит в родительном, хотя по смыслу это прямое дополнение: буквально «дать поцелуя», и родительный здесь застыл с давних времён." }
  - { kind: pronunciation, text: "Читается «бу́зя», два слога, ударение на первом. Сочетание ZI даёт мягкое «зь», поэтому BUZIA это «бу́зя», а не «бу́зиа» и не «бу́жа». В форме BUZIĘ конечное Ę звучит почти как чистое «э», так что слышно «бу́зе». Родительный множественного BUŹ произносится «бусь», с оглушением конечного Ź: мягкое «зь» на конце слова теряет голос и превращается в «сь»." }
