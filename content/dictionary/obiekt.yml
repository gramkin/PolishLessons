# review
id: obiekt
format: 2
lemma: "obiekt"
rank: 1988
pos: noun
pron: { cyr: "о́бект" }
senses:
  - id: object-thing
    ru: "объект, предмет"
    examples:
      - pl: "Zobaczyliśmy na niebie dziwny obiekt."
        ru: "Мы увидели в небе странный объект."
        source: { kind: translated, id: 968949 }
      - pl: "Widziałam dziwny obiekt poruszający się na niebie."
        ru: "Я видела странный объект, движущийся в небе."
        source: { kind: translated, id: 2610504 }
      - pl: "Czy możesz powiedzieć, jaki jest ten obiekt?"
        ru: "Ты можешь сказать, что это за объект?"
        source: { kind: translated, id: 2610502 }
      - pl: "Co oznacza NOL? Przypuszczam, że \"Niezidentyfikowany Obiekt Latający\"."
        ru: "Что значит NOL? Полагаю, «Неопознанный летающий объект»."
        source: { kind: translated, id: 591956 }
      - pl: "Używamy teleskopów, aby widzieć odległe obiekty."
        ru: "Мы пользуемся телескопами, чтобы видеть далёкие объекты."
        source: { kind: translated, id: 10794047 }
      - pl: "Emitując światło, obiekt odleciał na południe."
        ru: "Излучая свет, объект улетел на юг."
        source: { kind: translated, id: 2610506 }
  - id: object-of
    ru: "объект (чьих-либо чувств, внимания)"
    examples:
      - pl: "Jack był obiektem drwin wszystkich chłopaków."
        ru: "Джек был объектом насмешек всех мальчишек."
        source: { kind: translated, id: 1857350 }
      - pl: "Jej sukces sprawił, że stała się obiektem zazdrości."
        ru: "Её успех сделал её объектом зависти."
        source: { kind: translated, id: 951374 }
      - pl: "Miasto ma doskonałe obiekty sportowe."
        ru: "В городе отличные спортивные объекты."
        source: { kind: translated, id: 1354196 }
notes:
  - { kind: usage, text: "Слово совпадает с русским «объект» и по форме, и по обоим значениям: физический предмет и объект чьих-то чувств." }
  - { kind: usage, text: "Третье значение — сооружение, площадка: obiekty sportowe «спортивные объекты», obiekt zabytkowy «памятник архитектуры»." }
  - { kind: usage, text: "Творительный падеж вводит роль: stać się obiektem zazdrości «стать объектом зависти»." }
collocations:
  - { pl: "obiekt latający", ru: "летающий объект" }
  - { pl: "obiekt zazdrości", ru: "объект зависти" }
  - { pl: "obiekty sportowe", ru: "спортивные объекты" }
etymology: "Из латинского obiectum «брошенное навстречу, представшее перед». Русский «объект» — то же заимствование, поэтому слова совпадают полностью."
memory: "obiekt — «объект» во всех смыслах сразу: niezidentyfikowany obiekt latający «НЛО», obiekt zazdrości «объект зависти», obiekty sportowe «спортивные объекты»."
idioms:
  - { pl: "obiekt latający", ru: "летающий объект" }
  - { pl: "obiekt zazdrości", ru: "объект зависти" }
  - { pl: "obiekty sportowe", ru: "спортивные объекты" }
