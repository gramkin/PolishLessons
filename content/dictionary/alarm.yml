# review
id: alarm
format: 2
lemma: "alarm"
rank: 1672
pos: noun
pron: { cyr: "а́лярм" }
senses:
  - id: alarm-signal
    ru: "сигнал тревоги, тревога"
    examples:
      - pl: "Czerwony alarm!"
        ru: "Красная тревога!"
        source: { kind: translated, id: 12232651 }
      - pl: "Nagle rozbrzmiał alarm pożarowy."
        ru: "Внезапно зазвучала пожарная тревога."
        source: { kind: translated, id: 3421579 }
      - pl: "Uruchomił się alarm przeciwpożarowy."
        ru: "Сработала пожарная сигнализация."
        source: { kind: translated, id: 12567527 }
  - id: alarm-device
    ru: "сигнализация, будильник (устройство)"
    examples:
      - pl: "Wyłącz alarm."
        ru: "Выключи сигнализацию."
        source: { kind: translated, id: 676905 }
      - pl: "Ten samochód ma alarm."
        ru: "У этой машины есть сигнализация."
        source: { kind: translated, id: 4359803 }
      - pl: "Ktoś wyłączył alarm."
        ru: "Кто-то выключил сигнализацию."
        source: { kind: translated, id: 3868166 }
notes:
  - { kind: usage, text: "Слово покрывает и сигнал, и устройство: alarm pożarowy «пожарная сигнализация», włączyć alarm «включить сигнализацию»." }
  - { kind: usage, text: "bić na alarm — «бить тревогу», устойчивое выражение, как и в русском." }
  - { kind: usage, text: "Заимствование из итальянского all’arme «к оружию», пришедшее через французский и немецкий — тем же путём, что и русское «алярм, тревога»." }
  - { kind: usage, text: "В корпусе слово почти всегда в именительном падеже; косвенные формы почти не встречаются." }
collocations:
  - { pl: "alarm pożarowy", ru: "пожарная сигнализация" }
  - { pl: "wyłączyć alarm", ru: "выключить сигнализацию" }
  - { pl: "bić na alarm", ru: "бить тревогу" }
etymology: "Из итальянского all’arme «к оружию» через французский и немецкий. Русское «тревога» — славянское слово, но заимствованное «алярм» в русском тоже известно, так что источник общий."
memory: "alarm = «сигнал тревоги» и «сигнализация» разом: alarm pożarowy «пожарная сигнализация», wyłączyć alarm «выключить сигнализацию». И то же выражение, что в русском: bić na alarm «бить тревогу»."
idioms:
  - { pl: "alarm pożarowy", ru: "пожарная сигнализация" }
  - { pl: "wyłączyć alarm", ru: "выключить сигнализацию" }
  - { pl: "bić na alarm", ru: "бить тревогу" }
