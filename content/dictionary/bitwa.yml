# review
id: bitwa
format: 2
lemma: "bitwa"
rank: 1649
pos: noun
pron: { cyr: "би́тва" }
senses:
  - id: battle
    ru: "битва, сражение"
    examples:
      - pl: "Bitwa była krótka."
        ru: "Битва была короткой."
        source: { kind: translated, id: 10736608 }
      - pl: "To była niesamowita bitwa."
        ru: "Это была невероятная битва."
        source: { kind: translated, id: 8529700 }
      - pl: "Bitwa pod Waterloo była ostatnią bitwą Napoleona Bonapartego."
        ru: "Битва при Ватерлоо была последней битвой Наполеона Бонапарта."
        source: { kind: tatoeba, id: 440265 }
  - id: fight-in
    ru: "битва (участвовать, погибнуть, выиграть)"
    examples:
      - pl: "Wygraliśmy bitwę."
        ru: "Мы выиграли битву."
        source: { kind: translated, id: 536927 }
      - pl: "Został ranny w bitwie."
        ru: "Он был ранен в битве."
        source: { kind: translated, id: 711039 }
      - pl: "Dziś ruszamy do bitwy."
        ru: "Сегодня мы идём в бой."
        source: { kind: translated, id: 12454784 }
notes:
  - { kind: usage, text: "«В битве» — w bitwie (предложный), «в битву» — do bitwy (родительный с do): ruszamy do bitwy «идём в бой»." }
  - { kind: usage, text: "pole bitwy — «поле битвы»; bitwa pod Waterloo — «битва при Ватерлоо», предлог pod с творительным для названий сражений." }
  - { kind: false-friend, text: "Отличайте bitwa «сражение» от walka «борьба, бой» и wojna «война»: bitwa — это одно конкретное столкновение внутри войны." }
  - { kind: usage, text: "Переносно тоже употребляется: bitwa na śnieżki «игра в снежки», polityka to bitwa idei «политика — битва идей»." }
collocations:
  - { pl: "pole bitwy", ru: "поле битвы" }
  - { pl: "wygrać bitwę", ru: "выиграть битву" }
  - { pl: "bitwa pod", ru: "битва при" }
etymology: "От bić «бить», праславянское *biti. Русская «битва» — то же слово с тем же суффиксом, соответствие полное."
memory: "bitwa = «битва, сражение», от bić «бить», как и русское слово. Падежи: w bitwie «в битве», do bitwy «в бой». Названия сражений идут с pod: bitwa pod Waterloo."
idioms:
  - { pl: "pole bitwy", ru: "поле битвы" }
  - { pl: "wygrać bitwę", ru: "выиграть битву" }
  - { pl: "bitwa pod Grunwaldem", ru: "битва при Грюнвальде" }
