  - { pl: "mistrzowskie wykonanie", ru: "мастерское исполнение" }
etymology: "От mistrz «мастер; чемпион», из немецкого Meister; ср. русское «мастер»."
memory: "mistrzowski — и «мастерский», и «чемпионский», потому что mistrz значит и «мастер», и «чемпион». Русский разводит это на два слова."
