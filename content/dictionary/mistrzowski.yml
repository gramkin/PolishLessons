senses:
  - id: masterly
    ru: "мастерский, виртуозный"
    examples:
      - pl: "Miłość jest mistrzowską grą na instrumencie, który nazywa się człowiek."
        ru: "Любовь — это мастерская игра на инструменте, который зовётся…"
