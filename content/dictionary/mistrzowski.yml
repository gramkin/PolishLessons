      - pl: "To mistrzowski ruch."
        ru: "Это мастерский ход."
        source: { kind: authored }
  - id: championship
    ru: "чемпионский (о титуле, матче)"
    examples:
      - pl: "Zdobyli mistrzowski tytuł."
        ru: "Они завоевали чемпионский титул."
        source: { kind: authored }
      - pl: "To mistrzowski mecz sezonu."
        ru: "Это чемпионский матч сезона."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Два значения по двум смыслам слова mistrz: «мастер» и «чемпион». Отсюда и «мастерский», и «чемпионский»." }
  - { kind: false-friend, text: "Русское «мастерский» покрывает только первое. Чемпионский титул по-русски отдельным словом, а по-польски это тот же mistrzowski." }
  - { kind: government, text: "Обычное прилагательное; наречие — mistrzowsko «мастерски»." }
  - { kind: usage, text: "Корень mistrz, у которого уже есть карточка; слово заимствовано из немецкого Meister." }
collocations:
