# review
id: parking
format: 2
lemma: "parking"
rank: 2357
pos: noun
pron: { cyr: "па́ркинк" }
senses:
  - id: car-park
    ru: "парковка, стоянка (место)"
    examples:
      - pl: "Parking przed sklepem jest pełny."
        ru: "Парковка перед магазином заполнена."
        source: { kind: authored }
      - pl: "Zostawił auto na parkingu."
        ru: "Он оставил машину на парковке."
        source: { kind: authored }
  - id: paid-parking
    ru: "платная стоянка"
    examples:
      - pl: "Parking strzeżony kosztuje dziesięć złotych."
        ru: "Охраняемая стоянка стоит десять злотых."
        source: { kind: authored }
      - pl: "Wjazd na parking jest od podwórza."
        ru: "Въезд на стоянку со двора."
        source: { kind: authored }
  - id: car-parks-plural
    ru: "парковки (мн. ч.)"
    examples:
      - pl: "Parkingi podziemne buduje się pod blokami."
        ru: "Подземные парковки строят под домами."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "РУССКАЯ «ПАРКОВКА» — ЭТО И МЕСТО, И ДЕЙСТВИЕ; ПОЛЬСКИЙ PARKING ТОЛЬКО МЕСТО. Площадка, где стоят машины, называется parking; само действие — parkowanie: parkowanie równoległe «параллельная парковка». Сказать «parking zajął mi pięć minut» нельзя, нужно parkowanie." }
  - { kind: pronunciation, text: "Два слога, ударение на первом: PAR-king. Конечное g оглушается до к: «па́ркинк». В косвенных падежах звонкость возвращается: parkingu — «па́ркингу», parkingiem — «па́ркингем», с мягким г перед i." }
  - { kind: usage, text: "Родительный и предложный единственного совпадают: parkingu, отсюда девять форм вместо десяти. Частые виды: parking strzeżony «охраняемая стоянка», parking podziemny «подземная», parking bezpłatny «бесплатная». Глагол parkować, однократно zaparkować." }
collocations:
  - { pl: "parking strzeżony", ru: "охраняемая стоянка" }
  - { pl: "zostawić auto na parkingu", ru: "оставить машину на парковке" }
  - { pl: "parking podziemny", ru: "подземная парковка" }
family:
  - { pl: "parkować", ru: "парковать", relation: derived }
  - { pl: "parkowanie", ru: "парковка (действие)", relation: derived }
  - { pl: "garaż", ru: "гараж", relation: root }
etymology: "Из английского parking, от park — слова, которое само пришло в английский из старофранцузского parc «огороженное место». В польский и в русский термин попал в двадцатом веке вместе с автомобилем. Польский закрепил его за площадкой, оставив действию отдельное слово parkowanie."
memory: "parking — только МЕСТО: площадка для машин. Действие называется parkowanie. Русская «парковка» значит и то и другое, отсюда ошибка. Конечное g оглушается: пишется parking, слышится «па́ркинк»."
idioms:
  - { pl: "parking strzeżony", ru: "охраняемая стоянка" }
  - { pl: "miejsce na parkingu", ru: "место на парковке" }
