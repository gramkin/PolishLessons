# review
id: rzad
format: 2
lemma: "rząd"
rank: 755
pos: noun
pron: { cyr: "жонт" }
senses:
  - id: government
    ru: "правительство (склоняется через rząd-)"
    examples:
      - pl: "Każde państwo ma swój rząd."
        ru: "У каждого государства есть своё правительство."
        source: { kind: tatoeba, id: 11517749 }
      - pl: "Stworzyli rząd."
        ru: "Они создали правительство."
        source: { kind: translated, id: 826726 }
      - pl: "Tego chce rząd."
        ru: "Этого хочет правительство."
        source: { kind: translated, id: 3941173 }
  - id: rule
    ru: "rządy — правление, власть"
    examples:
      - pl: "Demokracja jest formą rządów."
        ru: "Демократия — это форма правления."
        source: { kind: tatoeba, id: 363747 }
      - pl: "Demokracja to rządy ludu, przez lud i dla ludu."
        ru: "Демократия — это правление народа, народом и для народа."
        source: { kind: translated, id: 852281 }
      - pl: "Oligarchia oznacza „rządy nielicznych”."
        ru: "Олигархия означает «правление немногих»."
        source: { kind: translated, id: 11518134 }
  - id: row
    ru: "ряд (склоняется через rzęd-)"
    note: "Тот же именительный, другая гласная в остальных падежах."
    examples:
      - pl: "Stali w rzędzie."
        ru: "Они стояли в ряд."
        source: { kind: translated, id: 9677489 }
      - pl: "Mam kilka biletów w 15 rzędzie."
        ru: "У меня несколько билетов в пятнадцатом ряду."
        source: { kind: translated, id: 554247 }
      - pl: "Ten samochód ma trzy rzędy siedzeń i może pomieścić ośmiu pasażerów."
        ru: "В этой машине три ряда сидений, и она вмещает восемь пассажиров."
        source: { kind: translated, id: 364669 }
  - id: in-a-row
    ru: "z rzędu — подряд"
    examples:
      - pl: "Padało przez trzy dni z rzędu."
        ru: "Дождь шёл три дня подряд."
        source: { kind: translated, id: 3029822 }
      - pl: "Tak! Wygrałem dwa razy z rzędu!"
        ru: "Да! Я выиграл два раза подряд!"
        source: { kind: translated, id: 10545315 }
      - pl: "Przegrał cztery mecze z rzędu."
        ru: "Он проиграл четыре матча подряд."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Главное о слове: в именительном это одна форма, а в остальных падежах — два разных слова, и различает их гласная в корне. «Правительство» идёт через rząd-: rządu, rządowi, rządem, w rządzie. «Ряд» идёт через rzęd-: rzędu, rzędowi, rzędem, w rzędzie." }
  - { kind: usage, text: "Проверка — родительный падеж: rządu значит «правительства», а rzędu — «ряда». Если в тексте стоит rzędu, речь точно не о власти." }
  - { kind: usage, text: "z rzędu значит «подряд» и встречается постоянно: trzy dni z rzędu «три дня подряд», dwa razy z rzędu «два раза подряд»." }
  - { kind: usage, text: "Множественное rządy чаще значит не «правительства», а «правление, власть»: rządy ludu «правление народа», pod rządami kogoś «под чьей-то властью»." }
  - { kind: usage, text: "w pierwszym rzędzie значит и «в первом ряду», и переносно «в первую очередь»." }
collocations:
  - { pl: "z rzędu", ru: "подряд" }
  - { pl: "w rzędzie", ru: "в ряду" }
  - { pl: "szef rządu", ru: "глава правительства" }
  - { pl: "forma rządów", ru: "форма правления" }
family:
  - { pl: "rządzić", ru: "править", relation: derived }
  - { pl: "rządowy", ru: "правительственный", relation: derived }
  - { pl: "porządek", ru: "порядок", relation: root }
  - { pl: "szereg", ru: "ряд, шеренга", relation: root }
etymology: "Праславянское *rędъ «порядок, ряд» — то же слово, что русский «ряд»; значение «правительство» выросло из «порядок, управление». Из этого же гнезда «обряд», «наряд» и «порядок»."
memory: "В именительном это одна форма, а дальше — два разных слова, и различает их гласная. «Правительство» склоняется через rząd-: rządu, w rządzie. «Ряд» — через rzęd-: rzędu, w rzędzie. Родительный и есть проверка: rządu — правительства, rzędu — ряда. Отсюда ходовое z rzędu «подряд»: trzy dni z rzędu."
idioms:
  - { pl: "z rzędu", ru: "подряд" }
  - { pl: "w pierwszym rzędzie", ru: "в первую очередь" }
  - { pl: "konia z rzędem temu, kto…", ru: "полцарства тому, кто…" }
