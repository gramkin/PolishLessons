# review
id: mur
format: 2
lemma: "mur"
rank: 2101
pos: noun
pron: { cyr: "мур" }
senses:
  - id: wall
    ru: "стена (каменная, кирпичная)"
    examples:
      - pl: "Mur runął."
        ru: "Стена рухнула."
        source: { kind: translated, id: 12191463 }
      - pl: "Tom buduje mur."
        ru: "Том строит стену."
        source: { kind: translated, id: 6554164 }
      - pl: "Ken przeskoczył przez mur."
        ru: "Кен перепрыгнул через стену."
        source: { kind: translated, id: 631085 }
  - id: walls
    ru: "стены, ограда (переносно — о городе, тюрьме)"
    examples:
      - pl: "Miasto jest otoczone murem."
        ru: "Город окружён стеной."
        source: { kind: tatoeba, id: 3658240 }
      - pl: "Mury mają uszy."
        ru: "У стен есть уши."
        source: { kind: translated, id: 2139015 }
notes:
  - { kind: false-friend, text: "mur — это каменная или кирпичная стена снаружи; внутренняя стена комнаты — ściana. Русская «стена» покрывает оба случая, поэтому ошибиться легко." }
  - { kind: government, text: "Мужской неодушевлённый; родительный — muru. Прислонить к стене — oprzeć o mur, винительный после o." }
  - { kind: usage, text: "Оборот przyprzeć kogoś do muru «припереть к стене» совпадает с русским дословно. А stać za kimś murem значит «стоять за кого-то горой» — образ стены, а не горы." }
  - { kind: usage, text: "Пословица Mury mają uszy «У стен есть уши» — та же, что в русском." }
collocations:
  - { pl: "przyprzeć do muru", ru: "припереть к стене" }
  - { pl: "stać za kimś murem", ru: "стоять за кого-л. горой" }
etymology: "Из латинского murus через немецкий. Русская «стена» — слово другого корня."
memory: "mur — каменная стена снаружи; стена комнаты — ściana. Запомните stać za kimś murem «стоять горой» и przyprzeć do muru «припереть к стене»."
idioms:
  - { pl: "przyprzeć do muru", ru: "припереть к стене" }
  - { pl: "stać za kimś murem", ru: "стоять горой" }
