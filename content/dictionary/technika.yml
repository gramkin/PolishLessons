pos: noun
pron: { cyr: "тэ́хника" }
senses:
  - id: technique
    ru: "техника, способ, приём"
    examples:
      - pl: "Pianista ma doskonałą technikę."
        ru: "У пианиста превосходная техника."
        source: { kind: authored }
      - pl: "Uczymy się nowej techniki oddychania."
        ru: "Мы учимся новой технике дыхания."
        source: { kind: authored }
      - pl: "Ta technika malowania jest bardzo stara."
        ru: "Эта техника живописи очень старая."
        source: { kind: authored }
  - id: technology
    ru: "техника, технология (область)"
    examples:
      - pl: "Postęp techniki zmienił świat."
        ru: "Прогресс техники изменил мир."
        source: { kind: authored }
      - pl: "Muzeum techniki jest w Warszawie."
        ru: "Музей техники находится в Варшаве."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "TECHNIKA — «техника» как способ и как область знаний. Но бытовая техника — SPRZĘT, а не TECHNIKA: SPRZĘT AGD, «бытовая техника». Техник — TECHNIK, технология — TECHNOLOGIA." }
  - { kind: usage, text: "Женский род. В дательном и местном K переходит в C: W TECHNICE. Родительный множественного TECHNIK совпадает со словом TECHNIK «техник», его не учим. Звательный не употребляется." }
  - { kind: government, text: "Техника чего — родительный: TECHNIKA GRY. Владеть техникой — OPANOWAĆ TECHNIKĘ, винительный. В технике — W TECHNICE, местный." }
  - { kind: pronunciation, text: "Читается «тэ́хника»: ударение на третьем слоге с конца, как во всех словах на -IKA. CH — «х». TECHNICE — «тэ́хнице»." }
collocations:
  - { pl: "technika gry", ru: "техника игры" }
  - { pl: "postęp techniki", ru: "технический прогресс" }
  - { pl: "nowoczesna technika", ru: "современная техника" }
family:
  - { pl: "technik", ru: "техник", relation: root, id: technik }
  - { pl: "technologia", ru: "технология", relation: root, id: technologia }
  - { pl: "techniczny", ru: "технический", relation: derived, id: techniczny }
etymology: "Из греческого TECHNIKĒ «искусство, мастерство», от TECHNĒ «ремесло». Русское «техника» — то же слово."
memory: "Technika — техника (способ и область); бытовая техника — sprzęt. W technice — в технике. Читается «тэ́хника»."
idioms:
