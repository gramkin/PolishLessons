pos: conj
pron: { cyr: "гдыш" }
senses:
  - id: because-formal
    ru: "так как, потому что, ибо (книжное)"
    examples:
      - pl: "Nie mogę przyjść, gdyż jestem chory."
        ru: "Я не могу прийти, так как болен."
        source: { kind: authored }
      - pl: "Wniosek odrzucono, gdyż brakowało podpisu."
        ru: "Заявление отклонили, так как не хватало подписи."
        source: { kind: authored }
      - pl: "Spotkanie przeniesiono, gdyż sala była zajęta."
        ru: "Встречу перенесли, так как зал был занят."
        source: { kind: authored }
  - id: justify-claim
    ru: "ибо, поскольку (вводит обоснование)"
    examples:
      - pl: "Decyzja była słuszna, gdyż innego wyjścia nie było."
        ru: "Решение было верным, ибо другого выхода не было."
        source: { kind: authored }
      - pl: "Trzeba się pospieszyć, gdyż termin mija w piątek."
        ru: "Надо поторопиться, поскольку срок истекает в пятницу."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Книжный союз, в разговоре почти не встречается: там говорят BO, реже PONIEWAŻ. GDYŻ живёт в статьях, документах, судебных решениях. И у него есть твёрдое позиционное правило: GDYŻ никогда не начинает предложение. Он всегда идёт после главной части, через запятую: NIE MOGĘ PRZYJŚĆ, GDYŻ JESTEM CHORY. Сказать GDYŻ JESTEM CHORY, NIE MOGĘ PRZYJŚĆ нельзя — для начала предложения нужен PONIEWAŻ. Этим GDYŻ отличается и от русского «так как», которое в начале стоять может." }
  - { kind: false-friend, text: "Самая коварная пара в польском для русского глаза, потому что слова различаются одной буквой, а значения не пересекаются вовсе. GDY значит «когда»: GDY WRÓCIŁ, BYŁO CIEMNO — «когда он вернулся, было темно». GDYŻ значит «так как, потому что»: NIE WRÓCIŁ, GDYŻ BYŁO CIEMNO — «он не вернулся, так как было темно». Перепутать их легко, и смысл переворачивается: время вместо причины. Проверяйте по ż на конце: есть ż — значит причина." }
  - { kind: pronunciation, text: "Читается «гдыш», одним слогом: y — это «ы», а конечное ż оглушается в «ш», как всякий звонкий согласный на конце польского слова. Поэтому на слух GDYŻ и GDY различаются именно этим «ш» в конце. Слово неизменяемое, других форм у него нет, и об ударении говорить не приходится — слог всего один." }
  - { kind: government, text: "Союз на падежи не влияет и ничем не управляет: он соединяет две части сложного предложения. Запятая перед ним ставится всегда, без исключений, потому что он вводит придаточную часть. Порядок слов внутри придаточной части обычный, без инверсии: GDYŻ BRAKOWAŁO PODPISU, а не GDYŻ PODPISU BRAKOWAŁO, хотя второе и возможно для выделения. В официальных текстах часто встречается пара GDYŻ W PRZECIWNYM RAZIE — «так как в противном случае»." }
collocations:
