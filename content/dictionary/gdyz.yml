etymology: "Сложение союза GDY «когда» и усилительной частицы -Ż, той же самой, что в JEDNAKŻE из недавней партии и в польских IDŹŻE, CZEMUŻ; она родственна русскому «же». Исходно GDYŻ значил «когда же», и причинное значение выросло из временного: то, что случилось тогда-то, стало объяснением. Русский проделал тот же путь другими словами: «коли» и «коль» тоже были временными, прежде чем стать условно-причинными. Так что одна буква ż отделяет здесь время от причины не случайно — она и есть след того перехода."
memory: "Книжное «так как». Одна буква отличает его от gdy «когда», а смысл противоположный: есть ż — значит причина. Никогда не стоит в начале предложения: для этого нужен ponieważ. Читается «гдыш», с оглушением на конце."
