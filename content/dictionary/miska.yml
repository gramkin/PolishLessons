notes:
  - { kind: usage, text: "Десять форм, женский род. В дательном и местном падежах K переходит в C: W MISCE. В родительном множественного появляется беглое E: MISEK. Мисочка — MISECZKA, а большое блюдо для подачи — PÓŁMISEK." }
  - { kind: false-friend, text: "Слово то же, что русское «миска», но гнездо уходит в стороны. MISA — большая чаша, в том числе церковная или фонтанная. PÓŁMISEK — не «полмиски», а плоское блюдо, на котором подают мясо или рыбу. MISECZKA — ещё и чашечка бюстгальтера. А MISKA KLOZETOWA и MISKA OLEJOWA — технические детали: чаша унитаза и масляный картер." }
  - { kind: government, text: "Налить в миску — NALAĆ DO MISKI, DO с родительным. В миске — W MISCE, местный с переходом K в C. Миска супа — MISKA ZUPY, родительный. Положено по праву — NALEŻY SIĘ JAK PSU MISKA, с дательным PSU: «как собаке миска»." }
  - { kind: pronunciation, text: "Читается «ми́ска», два слога, ударение на первом. MI мягкое, как в русском. В форме MISCE сочетание SC даёт «сц»: «ми́сце»." }
  - { kind: register, text: "Слово бытовое. NALEŻY SIĘ JAK PSU MISKA — разговорный оборот о том, что положено без всяких сомнений: PODWYŻKA NALEŻY MI SIĘ JAK PSU MISKA — «прибавка мне положена по праву»." }
collocations:
  - { pl: "miska zupy", ru: "миска супа" }
  - { pl: "miska dla psa", ru: "собачья миска" }
  - { pl: "miska olejowa", ru: "масляный картер" }
family:
  - { pl: "misa", ru: "чаша, большая миска", relation: root }
  - { pl: "miseczka", ru: "мисочка; чашечка бюстгальтера", relation: derived }
  - { pl: "półmisek", ru: "блюдо для подачи", relation: derived }
etymology: "Из латинского MENSA «стол», через древневерхненемецкое слово со значением «блюдо». Польская MISA и уменьшительная MISKA пришли тем же путём, что и русские «миса» и «миска». PÓŁMISEK образован от MISA, а не от MISKA, отсюда и значение: это половина большой чаши, плоское блюдо."
memory: "Miska — «миска», в местном падеже w misce. Misa — большая чаша, półmisek — блюдо для подачи. Należy się jak psu miska — положено по праву, буквально «как собаке миска»."
idioms:
  - { pl: "należy się jak psu miska", ru: "положено по праву, само собой положено" }
