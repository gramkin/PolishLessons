# review
id: entuzjasta
format: 2
lemma: "entuzjasta"
rank: 5518
pos: noun
pron: { cyr: "энтузя́ста" }
senses:
  - id: enthusiast
    ru: "энтузиаст, любитель"
    examples:
      - pl: "Jest dużo większym entuzjastą golfa niż ja."
        ru: "Он гораздо больший любитель гольфа, чем я."
        source: { kind: translated, id: 1354016 }
      - pl: "Jest entuzjastą kolei."
        ru: "Он энтузиаст железных дорог."
        source: { kind: authored }
      - pl: "Entuzjasta gór wyruszył o świcie."
        ru: "Любитель гор отправился на рассвете."
        source: { kind: authored }
  - id: fan
    ru: "поклонник, увлечённый человек"
    examples:
      - pl: "Zebrali się entuzjaści starych aut."
        ru: "Собрались любители старых автомобилей."
        source: { kind: authored }
      - pl: "Nie jestem entuzjastą tego pomysłu."
        ru: "Я не в восторге от этой идеи."
        source: { kind: authored }
notes:
  - { kind: government, text: "Чего именно энтузиаст — родительный падеж: entuzjasta golfa «любитель гольфа», как в русском." }
  - { kind: usage, text: "Мужской род, но склоняется по женскому типу в единственном числе: entuzjasta, entuzjasty, entuzjastę — как kolega и spadkobierca." }
  - { kind: usage, text: "nie być entuzjastą czegoś «не быть в восторге от чего-л.» — вежливая форма несогласия." }
  - { kind: false-friend, text: "Слово общее с русским, из греческого enthousiasmos «богово­дохновение». Женская форма — entuzjastka." }
collocations:
  - { pl: "entuzjasta golfa", ru: "любитель гольфа" }
  - { pl: "nie być entuzjastą", ru: "не быть в восторге" }
etymology: "Из греческого enthousiasmos «боговдохновение» через латынь; русское «энтузиаст» — то же слово."
memory: "entuzjasta — «энтузиаст, любитель», с родительным падежом: entuzjasta golfa. Род мужской, а склонение женское, как у kolega."
idioms:
  - { pl: "entuzjasta golfa", ru: "любитель гольфа" }
