etymology: "Из латинского RESULTARE «отскакивать, отражаться», собранного из RE- «назад» и SALTARE «прыгать», от SALIRE «скакать». Исходный образ — отскок: результат есть то, что отскочило назад от действия, его отдача. Тот же корень SALIRE виден в словах SALTO и REZULTAT, а также в итальянском SALTARE «прыгать», и русское «результат» пришло той же дорогой, через латынь и немецкий. Польское WYNIK устроено совсем иначе и прозрачнее: от WYNIKAĆ «вытекать, следовать», то есть результат как то, что вытекло из причины. Два образа — отскок и истечение — и польский держит оба слова рядом, отдавая первое книжной речи, а второе обиходной."
memory: "Рядом со своим словом wynik, и в живой речи побеждает wynik: wynik meczu, wynik badania. Rezultat книжнее и держится в обороте w rezultacie «в итоге». Та же пара, что eksplozja и wybuch. В местном t переходит в c: w rezultacie, восьмой случай после monecie и odwrocie. От латинского resultare «отскакивать»."
