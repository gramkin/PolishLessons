notes:
  - { kind: false-friend, text: "Ловушка не в значении, а в выборе между двумя польскими словами. REZULTAT и WYNIK значат одно и то же, но WYNIK — слово своё, от WYNIKAĆ «следовать, вытекать», и оно частотнее во всех обиходных случаях: WYNIK MECZU «результат матча», WYNIK BADANIA «результат обследования», WYNIK WYBORÓW. REZULTAT звучит книжнее и официальнее, и чаще всего попадается в обороте W REZULTACIE «в результате». Это та же пара, что EKSPLOZJA и WYBUCH: латинское слово рядом со своим, и своё берёт верх в живой речи. Русский обходится одним «результатом», поэтому выбирать приходится каждый раз заново, и выбор по умолчанию — WYNIK." }
  - { kind: pronunciation, text: "Читается «рэзульта́т», ударение на предпоследнем слоге. Буква E даёт «э» и согласную не смягчает: «рэ», а не «ре». Буква L мягкая, как всегда, отсюда «зуль». В местном падеже REZULTACIE согласная T переходит в C и смягчается: «рэзульта́це». Это восьмой случай того же чередования в словаре, после MONECIE, PASZPORCIE, TORCIE, KASECIE, INSTYNKCIE, FRONCIE и ODWROCIE, так что правило можно считать выученным окончательно." }
  - { kind: government, text: "Мужской род, неодушевлённое. Винительный равен именительному: OGŁOSILI REZULTAT. Родительный на -U: BEZ REZULTATU, и при отрицании винительный уходит туда же: NIE OGŁOSILI REZULTATU. Чего результат — родительный без предлога: REZULTAT BADANIA, REZULTAT ROZMÓW. Главный оборот — W REZULTACIE, с местным, и он употребляется и самостоятельно, в значении «в итоге», и с родительным: W REZULTACIE ZMIAN «в результате изменений»." }
  - { kind: usage, text: "Устойчивые сочетания стоит держать рядом, различая стиль: W REZULTACIE «в результате, в итоге» нейтрально и частотно, BEZ REZULTATU «безрезультатно», OSIĄGNĄĆ REZULTAT «достичь результата» звучит официально, а в разговоре скажут OSIĄGNĄĆ WYNIK или просто UDAŁO SIĘ. Прилагательное от REZULTAT не образуют; там, где русский скажет «результативный», польский возьмёт SKUTECZNY «действенный» от SKUTEK «следствие», и это слово в польском заметно частотнее." }
