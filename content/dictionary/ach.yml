notes:
  - { kind: usage, text: "Междометие, не склоняется и не меняется. Прямое соответствие русскому «ах», и употребляется так же широко." }
  - { kind: usage, text: "ach tak — реакция на понимание, «ах так, вот оно что». Интонация решает, звучит это удивлённо или обиженно." }
  - { kind: pronunciation, text: "ch читается как х, поэтому ach звучит ровно как русское «ах»." }
  - { kind: usage, text: "Рядом живёт och «ох», у него своя карточка. Вместе они дают устойчивое achy i ochy «охи да ахи»." }
collocations:
