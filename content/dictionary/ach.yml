  - { pl: "ach, nie", ru: "ах, нет" }
  - { pl: "achy i ochy", ru: "охи да ахи" }
etymology: "Праславянское *achъ — звукоподражание, то же самое слово, что русское «ах». За тысячу лет оно не изменилось ни в одном из двух языков."
memory: "ach — «ах», междометие один в один как русское. Главный оборот — ach tak «ах так, вот оно что», а вместе с och получается achy i ochy «охи да ахи»."
