      - pl: "Nie współpracuję z konkurencją."
        ru: "Я не сотрудничаю с конкурентами."
        source: { kind: authored }
  - id: partner
    ru: "współpracujący — сотрудничающий, партнёрский"
    examples:
      - pl: "Współpracujące firmy podzieliły się rynkiem."
        ru: "Сотрудничающие фирмы поделили рынок."
        source: { kind: authored }
      - pl: "Współpracujący z nami prawnik odszedł."
        ru: "Сотрудничавший с нами юрист ушёл."
        source: { kind: authored }
  - id: cooperation
    ru: "współpracowanie — сотрудничество (как действие)"
    examples:
      - pl: "Współpracowanie z urzędem bywa męczące."
        ru: "Сотрудничество с учреждением бывает утомительным."
        source: { kind: authored }
      - pl: "Po latach współpracowania rozstali się bez żalu."
        ru: "После лет сотрудничества они расстались без сожаления."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ПРИСТАВКА, КОТОРАЯ ОКУПАЕТСЯ ДЕСЯТКИ РАЗ: польское współ- отвечает русскому «СО-». Współpraca — «сотрудничество», współczesny — «современный», współczucie — «сочувствие», współautor — «соавтор», współmieszkaniec — «сосед по квартире». Увидев współ-, подставляйте «со-» и смотрите, что получится. Но учтите: сам корень praca русскому «работе» не родня — для этого у поляка есть отдельное слово robota." }
  - { kind: government, text: "Сотрудничают С кем — предлог z с ТВОРИТЕЛЬНЫМ, как по-русски: współpracować z kolegą, z firmą, ze szkołą. Над чем — nad с творительным: współpracować nad projektem. Расхождений с русским нет ни в одном из двух случаев." }
  - { kind: usage, text: "ПОЧЕМУ НЕТ СТРАДАТЕЛЬНЫХ ФОРМ. Дополнение у глагола стоит в предложной группе (z kimś), а не в винительном падеже, значит превращать в подлежащее нечего — и причастий вроде *współpracowany не существует. Ровно по той же причине их нет у skorzystać (z czegoś) и у gapić się (na coś). Это одно правило, а не три отдельных пропуска." }
  - { kind: register, text: "Слово нейтрально-деловое и в обиходе частое: współpraca z firmą, umowa o współpracy. Но в разговоре о прошлом оно может звучать тяжело — współpracował z reżimem значит «сотрудничал с режимом», с тем же обвинительным оттенком, что и по-русски." }
collocations:
  - { pl: "współpracować z kimś", ru: "сотрудничать с кем-л." }
  - { pl: "współpraca międzynarodowa", ru: "международное сотрудничество" }
  - { pl: "umowa o współpracy", ru: "договор о сотрудничестве" }
family:
  - { pl: "współpraca", ru: "сотрудничество", relation: root }
  - { pl: "pracować", ru: "работать", relation: root, id: pracowac }
  - { pl: "współczesny", ru: "современный", relation: derived }
etymology: "Приставка współ- «со-, вместе» плюс pracować «работать». Współ- восходит к предлогу z/ze и в точности отвечает русской приставке «со-»: współpraca — «сотрудничество», współczucie — «сочувствие». Корень praca, однако, русской «работе» не родня: у него своя история, а русскому слову отвечает польское robota."
memory: "współpracować — «сотрудничать», с z и творительным, как по-русски. Главное запомнить приставку: współ- это «со-», и она работает везде — współczesny «современный», współczucie «сочувствие», współautor «соавтор»."
idioms:
  - { pl: "współpracować z reżimem", ru: "сотрудничать с режимом" }
  - { pl: "owocna współpraca", ru: "плодотворное сотрудничество" }
