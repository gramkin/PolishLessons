rank: 1895
pos: verb
pron: { cyr: "фспуупрацо́ваць" }
senses:
  - id: cooperate
    ru: "сотрудничать (współpracować z kimś)"
    examples:
      - pl: "Współpracujemy z nimi od dziesięciu lat."
