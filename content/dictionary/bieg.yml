# review
id: bieg
format: 2
lemma: "bieg"
rank: 1936
pos: noun
pron: { cyr: "бек" }
senses:
  - id: run
    ru: "бег, забег"
    examples:
      - pl: "Wygrała bieg na sto metrów."
        ru: "Она выиграла забег на сто метров."
        source: { kind: translated, id: 691835 }
      - pl: "Ścigaliśmy się w biegu na sto metrów."
        ru: "Мы соревновались в беге на сто метров."
        source: { kind: translated, id: 460704 }
      - pl: "On jest bez tchu po biegu."
        ru: "Он запыхался после бега."
        source: { kind: translated, id: 359930 }
      - pl: "Po tym biegu byłem wyczerpany."
        ru: "После этого забега я был измотан."
        source: { kind: translated, id: 1186843 }
      - pl: "Serce mi waliło po niewielkim biegu."
        ru: "Сердце колотилось после небольшой пробежки."
        source: { kind: translated, id: 403175 }
      - pl: "Przed biegiem robię kilka ćwiczeń rozluźniających."
        ru: "Перед забегом я делаю несколько расслабляющих упражнений."
        source: { kind: translated, id: 364107 }
  - id: course
    ru: "ход, течение (событий)"
    examples:
      - pl: "Po prostu obserwuj bieg wydarzeń."
        ru: "Просто наблюдай за ходом событий."
        source: { kind: translated, id: 2658160 }
      - pl: "Podróżnik w czasie przypadkowo zmienił bieg historii."
        ru: "Путешественник во времени случайно изменил ход истории."
        source: { kind: translated, id: 13584363 }
      - pl: "Moja mama jest zawsze w biegu."
        ru: "Моя мама всегда в бегах."
        source: { kind: translated, id: 3470886 }
  - id: gear
    ru: "передача (в машине)"
    examples:
      - pl: "Często hamuję, zanim zmienię bieg na niższy."
        ru: "Я часто торможу, прежде чем перейти на пониженную передачу."
        source: { kind: translated, id: 12062008 }
      - pl: "Tomasz nie umie prowadzić na manualnej skrzyni biegów."
        ru: "Томаш не умеет водить машину с механической коробкой передач."
        source: { kind: translated, id: 3743398 }
notes:
  - { kind: usage, text: "Три значения сразу: «бег», «ход событий» (bieg wydarzeń) и «передача» в коробке (skrzynia biegów «коробка передач»)." }
  - { kind: usage, text: "Наречное biegiem значит «бегом»: Biegiem, bo się spóźnisz! «Бегом, а то опоздаешь!»." }
  - { kind: usage, text: "Оборот z biegiem czasu — «с течением времени», w biegu — «на бегу, второпях»." }
  - { kind: usage, text: "Глагол того же корня — biec «бежать», у него своя карточка." }
collocations:
  - { pl: "bieg wydarzeń", ru: "ход событий" }
  - { pl: "skrzynia biegów", ru: "коробка передач" }
  - { pl: "w biegu", ru: "на бегу" }
etymology: "От biec «бежать», праславянское *běgъ. Русское «бег» — то же самое слово и тот же корень."
memory: "bieg — «бег», но ещё «ход событий» (bieg wydarzeń) и «передача» в машине (skrzynia biegów). А biegiem значит «бегом»."
idioms:
  - { pl: "bieg wydarzeń", ru: "ход событий" }
  - { pl: "skrzynia biegów", ru: "коробка передач" }
  - { pl: "z biegiem czasu", ru: "с течением времени" }
