notes:
  - { kind: false-friend, text: "РУССКИЙ ДЕЛИТ ТО, ЧТО ПОЛЬСКИЙ ДЕРЖИТ ВМЕСТЕ. По-русски «романтический» относится к эпохе и литературе, а «романтичный» — к настроению и чувствам. Польское romantyczny покрывает оба: poeta romantyczny это «романтический поэт» эпохи Мицкевича, а romantyczna kolacja — «романтичный ужин». Русское слово приходится выбирать по контексту каждый раз заново." }
  - { kind: usage, text: "Прилагательное градуируемое, и парадигма полная — тридцать три формы, как у seksowny и genialny. Сравните с nagły и niewiarygodny в этой же группе: у них по одиннадцать, потому что степеней сравнения нет. Три числа — 33, 11 и 10 — исчерпывают почти все польские прилагательные." }
  - { kind: pronunciation, text: "Четыре слога, ударение на предпоследнем: ro-man-TY-czny, «романты́чны». cz звучит как ч, y как ы. В сравнительной степени ударение уезжает дальше: ro-man-tycz-NIEJ-szy." }
  - { kind: register, text: "В Польше слово несёт культурный вес, которого в русском у него нет: romantyzm — это эпоха Мицкевича и Словацкого, национальный миф и школьная программа. Назвать кого-то romantykiem может значить и «мечтатель», и «наследник той традиции»." }
collocations:
  - { pl: "romantyczna kolacja", ru: "романтический ужин" }
  - { pl: "poeta romantyczny", ru: "поэт-романтик" }
  - { pl: "romantyczny gest", ru: "романтичный жест" }
family:
  - { pl: "romantyzm", ru: "романтизм", relation: root }
  - { pl: "romantyk", ru: "романтик", relation: derived }
  - { pl: "romans", ru: "роман, любовная связь", relation: derived, id: romans }
etymology: "От romantyzm, из французского romantique и дальше от roman «роман» — изначально «написанный на народном, романском языке», в отличие от латыни. В русский слово пришло тем же путём, но разделилось надвое: «романтический» и «романтичный». Отсюда romantyk, romantyzm и romans."
memory: "romantyczny — это и «романтический», и «романтичный»: польский обходится одним словом там, где русский держит два. Парадигма полная, тридцать три формы, потому что прилагательное градуируемое — в отличие от nagły и niewiarygodny рядом."
idioms:
