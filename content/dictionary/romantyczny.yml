# review
id: romantyczny
format: 2
lemma: "romantyczny"
rank: 2210
pos: adj
pron: { cyr: "романты́чны" }
senses:
  - id: romantic-mood
    ru: "романтичный (о настроении, жесте)"
    examples:
      - pl: "To bardzo romantyczny gest."
        ru: "Это очень романтичный жест."
