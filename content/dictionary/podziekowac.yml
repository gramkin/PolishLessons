# review
id: podziekowac
format: 2
lemma: "podziękować"
rank: 1164
pos: verb
aspect: perf
aspectPair: dziekowac
pron: { cyr: "подзенко́ваць" }
senses:
  - id: thank
    ru: "поблагодарить"
    examples:
      - pl: "Chcę podziękować Tomowi!"
        ru: "Хочу поблагодарить Тома."
        source: { kind: tatoeba, id: 3150079 }
      - pl: "Dzwonię, żeby ci podziękować."
        ru: "Я звоню, чтобы тебя поблагодарить."
        source: { kind: tatoeba, id: 9817456 }
      - pl: "Podziękuj jej za pomoc."
        ru: "Поблагодари её за помощь."
        source: { kind: tatoeba, id: 5225348 }
  - id: thank-for
    ru: "podziękować komuś za coś — поблагодарить кого-то за что-то"
    examples:
      - pl: "Podziękował za prezent."
        ru: "Он поблагодарил за подарок."
        source: { kind: translated, id: 3629759 }
      - pl: "Podziękował jej za pomoc."
        ru: "Он поблагодарил её за помощь."
        source: { kind: translated, id: 12188829 }
      - pl: "Podziękowałem mu za miły prezent."
        ru: "Я поблагодарил его за милый подарок."
        source: { kind: translated, id: 533963 }
  - id: decline
    ru: "вежливо отказаться — неожиданное второе значение"
    note: "Podziękował за предложение значит, что он его отклонил, а не что поблагодарил за него."
    examples:
      - pl: "Grzecznie podziękował za zaproszenie."
        ru: "Он вежливо отказался от приглашения."
        source: { kind: authored }
      - pl: "Zaproponowali mu wódkę, ale podziękował."
        ru: "Ему предложили водку, но он отказался."
        source: { kind: authored }
      - pl: "Musiałem podziękować za tę propozycję."
        ru: "Мне пришлось отказаться от этого предложения."
        source: { kind: authored }
notes:
  - { kind: government, text: "podziękować komuś za coś: дательный для адресата и za с винительным для причины — Podziękowałem mu za prezent «Я поблагодарил его за подарок»." }
  - { kind: usage, text: "Второе значение неожиданно: podziękować значит ещё и «вежливо отказаться». Zaproponowali mu wódkę, ale podziękował «Ему предложили водку, но он отказался»." }
  - { kind: usage, text: "Совершенный вид от dziękować. Формула благодарности в настоящем — dziękuję «спасибо»." }
  - { kind: false-friend, text: "Отглагольное существительное podziękowanie значит «благодарность» и чаще идёт во множественном: złożyć podziękowania «выразить благодарность»." }
collocations:
  - { pl: "podziękować za pomoc", ru: "поблагодарить за помощь" }
  - { pl: "podziękować komuś", ru: "поблагодарить кого-то" }
  - { pl: "złożyć podziękowania", ru: "выразить благодарность" }
etymology: "Приставка po- и dziękować, из старочешского děkovati, а оно из средневерхненемецкого denken «думать, помнить». Русское «спасибо» устроено иначе — из «спаси Бог»."
memory: "podziękować — совершенный вид от dziękować: podziękować komuś za coś «поблагодарить кого-то за что-то». Но помните второе значение — «вежливо отказаться»: podziękował за предложение значит, что он его отклонил."
idioms:
  - { pl: "podziękować za pomoc", ru: "поблагодарить за помощь" }
  - { pl: "złożyć podziękowania", ru: "выразить благодарность" }
  - { pl: "grzecznie podziękować", ru: "вежливо отказаться" }
