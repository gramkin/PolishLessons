        ru: "В её голосе была нежность."
        source: { kind: authored }
  - id: sweets
    ru: "сладкое, конфеты (мн. SŁODYCZE)"
    examples:
      - pl: "Dzieci uwielbiają słodycze."
        ru: "Дети обожают сладкое."
        source: { kind: authored }
      - pl: "Za dużo słodyczy szkodzi zębom."
        ru: "Слишком много сладкого вредит зубам."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Главное — множественное число. SŁODYCZE — просто конфеты, печенье, шоколад, «сладкое»: KUPIĆ SŁODYCZE, JEŚĆ SŁODYCZE. В единственном SŁODYCZ — вкус сладости или нежность: SŁODYCZ MIODU, SŁODYCZ JEJ UŚMIECHU. Подслащивать — SŁODZIĆ: SŁODZISZ HERBATĘ? — «тебе с сахаром?»." }
  - { kind: usage, text: "Семь форм, женский род. Родительный, дательный и местный единственного совпадают с родительным множественного: SŁODYCZY. Во множественном SŁODYCZE почти всегда значит «сладкое, кондитерские изделия»." }
  - { kind: government, text: "Магазин сладостей — SKLEP ZE SŁODYCZAMI, творительный после Z: «магазин со сладостями». Много сладкого — DUŻO SŁODYCZY, родительный. Сладость чего-то — SŁODYCZ CZEGOŚ." }
  - { kind: pronunciation, text: "Читается «суо́дыч», два слога, ударение на первом. Ł — короткое «у», CZ на конце — «ч». В форме SŁODYCZE ударение сдвигается: «суоды́чэ»." }
  - { kind: register, text: "В единственном числе слово скорее книжное и поэтическое: SŁODYCZ ZEMSTY, SŁODYCZ ŻYCIA. Во множественном — самое бытовое: BEZ SŁODYCZY PRZED OBIADEM! — «никакого сладкого до обеда!»." }
collocations:
  - { pl: "jeść słodycze", ru: "есть сладкое" }
  - { pl: "sklep ze słodyczami", ru: "кондитерская" }
  - { pl: "słodycz miodu", ru: "сладость мёда" }
family:
  - { pl: "slodki", ru: "сладкий", relation: root, id: slodki }
  - { pl: "slodzic", ru: "подслащивать", relation: derived }
  - { pl: "oslodzic", ru: "подсластить; скрасить", relation: derived }
etymology: "От SŁODKI «сладкий», праславянского слова, общего с русским. Русский взял книжную форму «сладкий», а народная полногласная сохранилась в слове «солод»; польский стянул «оло» в ŁO, как в GŁOWA и «голова»."
memory: "Słodycz — сладость; słodycze — конфеты, сладкое. Читается «суо́дыч». Sklep ze słodyczami — кондитерская. Słodzisz? — тебе с сахаром? Родня русских «сладкий» и «солод»."
idioms:
  - { pl: "słodycz zemsty", ru: "сладость мести" }
  - { pl: "słodycz zwycięstwa", ru: "сладость победы" }
