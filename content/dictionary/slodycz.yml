senses:
  - id: sweetness
    ru: "сладость (вкус; перен. нежность)"
    examples:
      - pl: "Słodycz tego wina jest wyjątkowa."
        ru: "Сладость этого вина исключительна."
        source: { kind: authored }
      - pl: "Poczuł słodycz zwycięstwa."
        ru: "Он почувствовал сладость победы."
