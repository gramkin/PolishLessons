# review
id: odpad
format: 2
lemma: "odpad"
rank: 5851
pos: noun
pron: { cyr: "о́тпат" }
senses:
  - id: waste
    ru: "отходы, мусор (обычно мн.)"
    examples:
      - pl: "Problem radioaktywnych odpadów pozostaje nierozwiązany."
        ru: "Проблема радиоактивных отходов остаётся нерешённой."
        source: { kind: translated, id: 980980 }
      - pl: "Plastik jest najbardziej rozpowszechnionym rodzajem odpadów morskich."
        ru: "Пластик — самый распространённый вид морского мусора."
        source: { kind: translated, id: 10698026 }
      - pl: "Dzięki segregacji odpady trafiają do recyklingu."
        ru: "Благодаря сортировке отходы идут на переработку."
        source: { kind: authored }
  - id: byproduct
    ru: "отход, остаток производства (в ед., термин)"
    examples:
      - pl: "Ten odpad trafia do ponownego przetworzenia."
        ru: "Этот отход идёт на повторную переработку."
        source: { kind: authored }
      - pl: "Trociny to odpad z tartaku."
        ru: "Опилки — это отход лесопилки."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Слово почти всегда во множественном: ODPADY, как и русское «отходы». ODPADY KOMUNALNE — бытовой мусор, ODPADY NIEBEZPIECZNE — опасные отходы, SEGREGACJA ODPADÓW — раздельный сбор мусора. Единственное ODPAD — канцелярский или технический термин: KAŻDY ODPAD MA SWÓJ KOD «у каждого вида отходов свой код». В быту мусор — ŚMIECI." }
  - { kind: false-friend, text: "ODPAD не имеет ничего общего с жаргонным русским «отпад!» («супер!»). Это «то, что отпало»: от глагола ODPADAĆ «отпадать». Мелкие остатки, обрезки — ODPADKI." }
  - { kind: pronunciation, text: "Читается «о́тпат»: D перед P оглушается в «т», конечное D тоже звучит как «т». Во множественном «отпа́ды»." }
collocations:
  - { pl: "odpady komunalne", ru: "бытовые отходы" }
  - { pl: "segregacja odpadów", ru: "сортировка мусора" }
  - { pl: "odpady niebezpieczne", ru: "опасные отходы" }
  - { pl: "wywóz odpadów", ru: "вывоз мусора" }
family:
  - { pl: "odpadać", ru: "отпадать", relation: root, id: odpadac }
  - { pl: "odpadek", ru: "обрезок, остаток", relation: derived }
  - { pl: "odpadowy", ru: "относящийся к отходам", relation: derived }
etymology: "От глагола ODPADAĆ «отпадать»: то, что отпало при работе. Русское «отход» устроено так же, только от глагола «отходить»."
memory: "Odpad — то, что отпало: отходы. Odpady komunalne — бытовой мусор. С жаргонным «отпад» не путать."
idioms:
  - { pl: "gospodarka odpadami", ru: "обращение с отходами (сбор, вывоз, переработка)" }
formExamplesSkip:
  - { form: "odpadzie", cell: "Звательный", reason: "звательный падеж: для неодушевлённого существительного он практически не употребляется" }
