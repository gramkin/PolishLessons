notes:
  - { kind: usage, text: "Одиннадцать форм, мужской род, одушевлённое. Во множественном числе две формы с разным смыслом. OLBRZYMI — великаны как живые существа, сказочные или люди: OLBRZYMI Z BAŚNI. OLBRZYMY — гиганты в переносном смысле, о компаниях, звёздах, деревьях: OLBRZYMY PRZEMYSŁU. Винительный единственного — OLBRZYMA, как у одушевлённого." }
  - { kind: false-friend, text: "Главное в гнезде — прилагательное OLBRZYMI, «огромный», одно из самых частых польских слов о размере: OLBRZYMI DOM, OLBRZYMIA RÓŻNICA. Русскому оно ничего не подсказывает, а форма OLBRZYMI совпадает с множественным числом существительного, «великаны». Различает их только контекст." }
  - { kind: government, text: "Колосс на глиняных ногах — OLBRZYM NA GLINIANYCH NOGACH, местный после NA. Победить великана — POKONAĆ OLBRZYMA, винительный, равный родительному. О великане — O OLBRZYMIE, местный." }
  - { kind: pronunciation, text: "Читается «о́лбжым», два слога, ударение на первом. Сочетание BRZ звучит как «бж», а Y — как «ы». В местном падеже OLBRZYMIE ударение переходит на второй слог: «олбжы́ме»." }
collocations:
  - { pl: "czerwony olbrzym", ru: "красный гигант" }
  - { pl: "olbrzym przemysłowy", ru: "промышленный гигант" }
  - { pl: "baśniowy olbrzym", ru: "сказочный великан" }
family:
  - { pl: "olbrzymi", ru: "огромный", relation: derived, id: olbrzymi }
  - { pl: "olbrzymka", ru: "великанша", relation: derived }
  - { pl: "olbrzymiość", ru: "огромность", relation: derived }
etymology: "От древнего славянского названия аваров, кочевого народа, пришедшего в Европу в шестом веке. Славяне звали их «обры», и русская летопись помнит их рослыми и гордыми: «погибоша аки обре». В польском OBRZYM превратилось в OLBRZYM и стало значить просто «великан»."
memory: "Olbrzym — великан, от «обров», аваров из русской летописи. Читается «о́лбжым». Olbrzymi — великаны, olbrzymy — гиганты-компании и звёзды. А прилагательное olbrzymi — «огромный». Olbrzym na glinianych nogach — колосс на глиняных ногах."
idioms:
  - { pl: "olbrzym na glinianych nogach", ru: "колосс на глиняных ногах" }
