etymology: "От глагола SPUŚCIĆ «спустить», собранного из приставки S- и PUŚCIĆ «пустить», от праславянского корня, давшего русские «пустить», «спустить» и «пуск». Русский «спуск» устроен совершенно так же и из тех же частей, так что слова тождественны по строению. Назвать спусковой крючок «спуском» естественно для обоих языков: он спускает курок. Техническое значение слива выросло позже, из того же «спустить воду», и в русском оно тоже есть."
memory: "Корень общий и прозрачный: spuścić это «спустить», от puścić «пустить», и spust это «спуск». Но управление ломается: русский нажимает НА спуск, поляк тянет ЗА него, pociągnąć za spust. Это главное, что надо запомнить. В местном падеже st смягчается в ście: na spuście, как miasto — w mieście. Читается «спуст», а spuście уже «спу́сьце». Второе значение техническое: spust wody «слив воды»."
