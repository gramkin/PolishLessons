notes:
  - { kind: false-friend, text: "Корень тот же, что в русском «спуске»: SPUŚCIĆ это «спустить», S- плюс PUŚCIĆ «пустить». Значения тоже совпадают, оба языка назвали спусковой крючок от глагола «спустить». Но русский потом удлинил название до «спускового крючка» и словом «спуск» пользуется всё реже, а польский так и оставил одно короткое SPUST. Переводя с польского, не хватайтесь за «спуск» механически: в быту естественнее сказать «спусковой крючок»." }
  - { kind: government, text: "Самое важное в этом слове. Русский говорит «нажать НА спуск», с предлогом «на» и винительным. Польский говорит POCIĄGNĄĆ ZA SPUST, буквально «потянуть ЗА спуск», с предлогом ZA и винительным, и это основной, самый частый вариант. Есть и NACISNĄĆ SPUST «нажать спуск», вообще без предлога. То есть меняется и глагол, и предлог: не «нажать на», а «потянуть за». Палец на крючке — PALEC NA SPUŚCIE, предлог NA с местным падежом." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое, поэтому винительный совпадает с именительным: POCIĄGNĄĆ ZA SPUST, а не ZA SPUSTU. В местном падеже проступает чередование ST в ŚCI: SPUST, но NA SPUŚCIE. Ровно то же происходит в MIASTO — W MIEŚCIE, и русский знает эту пару по «место — в месте», только без смягчения. Родительный SPUSTU с окончанием -U, как у большинства неодушевлённых." }
  - { kind: pronunciation, text: "Читается «спуст», один слог, все согласные твёрдые, U даёт «у». В форме SPUŚCIE сочетание ŚCI даёт два мягких звука подряд, «сьць», и слово звучит «спу́сьце», в два слога с ударением на первом. Это одно из самых трудных для русского уха польских сочетаний: нужно смягчить и S, и C, не превращая их в «щ». В SPUSTY слышно «спу́сты», с твёрдым «ы»." }
  - { kind: register, text: "Слово нейтральное, живёт в двух кругах. Первый оружейный и фотографический: POCIĄGNĄĆ ZA SPUST «нажать на спусковой крючок», PALEC NA SPUŚCIE «палец на крючке», и переносно SPUST APARATU «спуск фотоаппарата». Второй технический: SPUST WODY «слив воды», ZAWÓR SPUSTOWY «сливной клапан», SPUST OLEJU «слив масла». Разводит их только контекст, формы и управление одинаковы." }
