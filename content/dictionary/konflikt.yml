notes:
  - { kind: false-friend, text: "Значение совпадает с русским полностью, расходится ударение. По-польски ударение всегда на предпоследнем слоге, поэтому KONFLIKT звучит «ко́нфликт», с ударением на первом слоге, тогда как русское «конфли́кт» ударяется на последнем. Это не мелочь: на слух слово становится неузнаваемым, и привычка перенести русское ударение выдаёт говорящего сразу. То же касается всей группы заимствований на -T: INCYDENT звучит «инцы́дэнт», DOKUMENT — «докуме́нт» с ударением на ME, ARGUMENT — «аргуме́нт». Правило механическое, и проверять каждое слово не нужно: достаточно помнить, что польское ударение падает на второй слог от конца." }
  - { kind: usage, text: "В местном падеже единственного числа T переходит в C: W KONFLIKCIE, а не «w konflikcie» с твёрдым T. Это то же чередование, что в APARTAMENT и APARTAMENCIE, NAMIOT и NAMIOCIE, KRAWAT и KRAWACIE, ŚWIT и ŚWICIE. В этой карточке оно встречается трижды, потому что INCYDENT и PRZYNĘTA ведут себя точно так же — INCYDENCIE и PRZYNĘCIE. Русскому это чередование незнакомо, и ошибка в нём слышна отчётливо. Родительный единственного — KONFLIKTU на -U, родительный множественного — KONFLIKTÓW." }
  - { kind: government, text: "Мужской род, неодушевлённое. С кем или чем конфликт — предлог Z с творительным: KONFLIKT Z SĄSIADEM, KONFLIKT Z PRAWEM «конфликт с законом». «В конфликте» — W с местным: W KONFLIKCIE. Между кем — MIĘDZY с творительным: KONFLIKT MIĘDZY STRONAMI. Частотные сочетания: KONFLIKT INTERESÓW «конфликт интересов» — юридический термин, KONFLIKT ZBROJNY «вооружённый конфликт», ROZWIĄZAĆ KONFLIKT «разрешить конфликт», WEJŚĆ W KONFLIKT «вступить в конфликт». Прилагательное KONFLIKTOWY значит «конфликтный» о человеке." }
  - { kind: pronunciation, text: "Читается «ко́нфликт», два слога, ударение на первом. Оба O произносятся полно, как «о». Сочетание NFL выговаривается слитно, без вставных гласных. Конечное -KT это два глухих согласных подряд, и произносить их надо оба. В местном падеже KONFLIKCIE сочетание CIE даёт мягкое «це», и слогов становится четыре: «конфли́кце», с ударением на предпоследнем. В родительном множественного KONFLIKTÓW буква Ó читается «у», конечное W оглушается: «конфли́ктуф»." }
