etymology: "Из латинского CONFLICTUS «столкновение», от CONFLIGERE, сложенного из CON- «вместе» и FLIGERE «ударять». Буквально — «соударение». Оба наших языка взяли слово из латыни через западноевропейское посредство в девятнадцатом веке, и значения совпали без остатка. Разошлось только ударение, и расхождение системное: русский в заимствованиях обычно сохраняет ударение источника или ставит его на последний слог, польский же подчиняет любое слово своему правилу предпоследнего слога. Поэтому вся группа латинских слов на -MENT и -NKT в двух языках звучит по-разному при одинаковом написании. От того же FLIGERE происходит AFLIKCJA в старом языке и английское INFLICT, где исходный удар сохранён яснее."
memory: "Значение то же, ударение другое: «ко́нфликт», на предпоследнем слоге, а не «конфли́кт». Так со всей группой: инцыдэнт, докумэнт. Польское ударение всегда второе от конца, проверять каждое слово не нужно. В местном t→c: w konflikcie, как w apartamencie и w namiocie. Konflikt interesów — юридический «конфликт интересов», konflikt z prawem — «конфликт с законом», с предлогом z и творительным."
