# review
id: relacja
format: 2
lemma: "relacja"
rank: 2194
pos: noun
pron: { cyr: "рэля́цйа" }
senses:
  - id: relationship
    ru: "отношения (между людьми)"
    examples:
      - pl: "Relacje między nimi są napięte."
        ru: "Отношения между ними натянуты."
        source: { kind: authored }
      - pl: "Dba o dobre relacje z sąsiadami."
        ru: "Он заботится о хороших отношениях с соседями."
        source: { kind: authored }
  - id: report
    ru: "репортаж, отчёт, показания"
    examples:
      - pl: "Relacja z meczu trwała dwie godziny."
        ru: "Репортаж с матча длился два часа."
        source: { kind: authored }
      - pl: "Zdał relację z przebiegu zebrania."
        ru: "Он отчитался о ходе собрания."
        source: { kind: authored }
  - id: route
    ru: "маршрут, сообщение (о транспорте)"
    examples:
      - pl: "Pociąg relacji Kraków–Gdynia jest opóźniony."
        ru: "Поезд сообщением Краков — Гдыня задерживается."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "РУССКАЯ «РЕЛЯЦИЯ» СЮДА НЕ ГОДИТСЯ. Она существует, но звучит архаично и значит только донесение, рапорт. Польское relacja — слово повседневное и покрывает три разных поля: ОТНОШЕНИЯ между людьми (relacje międzyludzkie, dobre relacje z sąsiadami), РЕПОРТАЖ или отчёт (relacja z meczu, relacja na żywo, zdać relację) и МАРШРУТ транспорта (pociąg relacji Warszawa–Gdańsk). Ни в одном из трёх «реляция» не подходит." }
  - { kind: usage, text: "Родительный множественного имеет две формы: обычную relacji, совпадающую с единственным числом, и книжную архаичную relacyj. Такая же пара уже встречалась у sekcja с её sekcyj. Старое окончание держится в уставах, довоенных текстах и юридическом языке." }
  - { kind: pronunciation, text: "Сочетание cj читается слитно, c остаётся твёрдым, а la звучит мягче русского: «рэля́цйа», ударение на предпоследнем слоге. В длинных формах оно уезжает вправо: relacjami — «рэляцйа́ми»." }
collocations:
  - { pl: "relacje międzyludzkie", ru: "межличностные отношения" }
  - { pl: "relacja na żywo", ru: "прямой репортаж" }
  - { pl: "zdać relację", ru: "отчитаться, дать отчёт" }
family:
  - { pl: "relacjonować", ru: "освещать, докладывать", relation: derived }
  - { pl: "relatywny", ru: "относительный", relation: root }
etymology: "Из латинского relatio «перенесение, донесение», от referre «приносить назад, сообщать». В русский слово пришло тем же путём, но осело в военном языке как «реляция» и устарело. Польский развил его широко — от человеческих отношений до железнодорожных маршрутов. Отсюда relacjonować «освещать» и relatywny «относительный»."
memory: "relacja — это сразу «отношения», «репортаж» и «маршрут»: relacje z sąsiadami, relacja z meczu, pociąg relacji Warszawa–Gdańsk. Русская «реляция» не подходит ни в одном случае. И архаичный родительный множественного relacyj, как у sekcja."
idioms:
  - { pl: "relacja na żywo", ru: "прямой репортаж" }
  - { pl: "zdać relację", ru: "отчитаться" }
