    pl: "Kot wyskoczył zza kanapy."
    ru: "Кот выскочил из-за дивана."
    source: { kind: authored }
  - form: "zza"
    pl: "Zza okna dochodziła muzyka."
    ru: "Из-за окна доносилась музыка."
    source: { kind: authored }
  - form: "zza"
    pl: "Wrócił zza oceanu po dziesięciu latach."
    ru: "Он вернулся из-за океана через десять лет."
    source: { kind: authored }
