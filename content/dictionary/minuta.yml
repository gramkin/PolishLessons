# review
id: minuta
format: 2
lemma: "minuta"
rank: 270
pos: noun
pron: { cyr: "мину́та" }
senses:
  - id: minute
    ru: "минута"
    examples:
      - pl: "Czekałem dziesięć minut."
        ru: "Я ждал десять минут."
        source: { kind: tatoeba, id: 1350347 }
      - pl: "Proszę poczekać pięć minut."
        ru: "Пожалуйста, подождите пять минут."
        source: { kind: tatoeba, id: 367707 }
      - pl: "Autobus jeździ co dziesięć minut."
        ru: "Автобус ходит каждые десять минут."
        source: { kind: tatoeba, id: 363716 }
  - id: minute-time
    ru: "минута (в оборотах времени)"
    examples:
      - pl: "Zostaw ją na minutę w spokoju."
        ru: "Оставь её на минуту в покое."
        source: { kind: tatoeba, id: 13785950 }
      - pl: "Spóźniłam się tylko pięć minut."
        ru: "Я опоздала только на пять минут."
        source: { kind: tatoeba, id: 6320427 }
      - pl: "Tom spóźnił się tylko trzy minuty."
        ru: "Том опоздал всего на три минуты."
        source: { kind: tatoeba, id: 3982731 }
notes:
  - { kind: usage, text: "Счёт такой же, как в русском: jedna minuta, dwie / trzy / cztery minuty, pięć minut." }
  - { kind: usage, text: "Обороты: za minutę «через минуту», co minutę «каждую минуту», w ostatniej minucie «в последнюю минуту»." }
  - { kind: usage, text: "minuta и sekunda — латинская пара: «первая малая часть» часа и «вторая малая часть»." }
collocations:
  - { pl: "za minutę", ru: "через минуту" }
  - { pl: "pięć minut", ru: "пять минут" }
  - { pl: "co minutę", ru: "каждую минуту" }
  - { pl: "w ostatniej minucie", ru: "в последнюю минуту" }
etymology: "Из латинского pars horae minuta prima — «первая малая часть» часа; «вторая малая часть», pars minuta secunda, дала слово sekunda."
memory: "minuta — из латыни: «первая малая часть» часа, а «вторая» дала sekundę. Счёт как в русском: dwie minuty, pięć minut."
idioms:
  - { pl: "co do minuty", ru: "минута в минуту" }
  - { pl: "mieć swoje pięć minut", ru: "иметь свои пять минут славы" }
  - { pl: "w ostatniej minucie", ru: "в последнюю минуту" }
formExamplesSkip:
  - { form: "minuto", reason: "звательный падеж от этого слова в живой речи не употребляется" }
