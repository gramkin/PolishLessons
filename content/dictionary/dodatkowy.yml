# review
id: dodatkowy
format: 2
lemma: "dodatkowy"
rank: 1362
pos: adj
pron: { cyr: "додатко́вы" }
senses:
  - id: additional
    ru: "дополнительный, добавочный"
    examples:
      - pl: "Czy jest dodatkowa opłata za to?"
        ru: "За это есть дополнительная плата?"
        source: { kind: translated, id: 364674 }
      - pl: "Potrzebowali dodatkowej pomocy."
        ru: "Им нужна была дополнительная помощь."
        source: { kind: translated, id: 1349212 }
      - pl: "Nie mamy żadnych dodatkowych pieniędzy."
        ru: "У нас нет никаких лишних денег."
        source: { kind: translated, id: 2991723 }
  - id: extra
    ru: "лишний, запасной; факультативный"
    examples:
      - pl: "Dodatkowy pokój okazał się bardzo przydatny, kiedy mieliśmy gości."
        ru: "Дополнительная комната оказалась очень кстати, когда у нас были гости."
        source: { kind: translated, id: 3601864 }
      - pl: "Takie zajęcia dodatkowe dostępne są jedynie dla dziecka mającego trudności z nauką."
        ru: "Такие дополнительные занятия доступны только ребёнку, у которого трудности с учёбой."
        source: { kind: translated, id: 6207719 }
notes:
  - { kind: usage, text: "Прилагательное от dodatek «добавка, приложение, надбавка», а то — от dodać «добавить». Склоняется как обычное прилагательное на -owy." }
  - { kind: false-friend, text: "dodatek — это «добавка, приложение, надбавка», а вовсе не «дополнение» в грамматике: грамматическое дополнение по-польски dopełnienie." }
  - { kind: usage, text: "Запомните три ходовых сочетания: opłata dodatkowa «доплата», zajęcia dodatkowe «дополнительные занятия», godziny dodatkowe «сверхурочные»." }
  - { kind: usage, text: "В отличие от русского, польское прилагательное часто стоит после существительного в терминах: opłata dodatkowa, czas dodatkowy." }
collocations:
  - { pl: "opłata dodatkowa", ru: "доплата" }
  - { pl: "zajęcia dodatkowe", ru: "дополнительные занятия" }
  - { pl: "dodatkowy czas", ru: "дополнительное время" }
etymology: "От dodać «добавить» (do- «до-» и dać «дать») через существительное dodatek «добавка». Русское «добавить» собрано тем же способом, только с другой приставкой."
memory: "dodatkowy — «дополнительный», от dodać «добавить». Запомните тройку ходовых сочетаний: opłata dodatkowa «доплата», zajęcia dodatkowe «дополнительные занятия», czas dodatkowy «дополнительное время». И не путайте dodatek «добавка» с dopełnienie «дополнение» в грамматике."
idioms:
  - { pl: "opłata dodatkowa", ru: "доплата" }
  - { pl: "zajęcia dodatkowe", ru: "дополнительные занятия" }
  - { pl: "czas dodatkowy", ru: "дополнительное время" }
