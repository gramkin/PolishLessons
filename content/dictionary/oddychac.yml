# review
id: oddychac
format: 2
lemma: "oddychać"
rank: 1034
pos: verb
aspect: imperf
pron: { cyr: "одды́хаць" }
senses:
  - id: breathe
    ru: "дышать"
    examples:
      - pl: "Oddycha?"
        ru: "Дышит?"
        source: { kind: tatoeba, id: 5067794 }
      - pl: "Możesz oddychać?"
        ru: "Ты можешь дышать?"
        source: { kind: tatoeba, id: 2405996 }
      - pl: "Nie mogę oddychać."
        ru: "Я не могу дышать."
        source: { kind: translated, id: 8763171 }
  - id: imperative
    ru: "oddychaj — дыши"
    examples:
      - pl: "Oddychaj przez nos, nie przez usta."
        ru: "Дыши носом, а не ртом."
        source: { kind: tatoeba, id: 5961814 }
      - pl: "Oddychaj głęboko."
        ru: "Дыши глубоко."
        source: { kind: translated, id: 12360274 }
  - id: trouble
    ru: "problemy z oddychaniem — проблемы с дыханием"
    examples:
      - pl: "Mam problemy z oddychaniem."
        ru: "У меня проблемы с дыханием."
        source: { kind: translated, id: 8723468 }
      - pl: "Miał problemy z oddychaniem."
        ru: "У него были проблемы с дыханием."
        source: { kind: translated, id: 6534092 }
notes:
  - { kind: false-friend, text: "Осторожно: oddychać значит «дышать», а не «отдыхать». Отдыхать по-польски — odpoczywać, и спутать их очень легко." }
  - { kind: government, text: "oddychać czymś — творительный падеж: oddychać powietrzem «дышать воздухом». А через что — с предлогом przez: oddychać przez nos «дышать носом»." }
  - { kind: usage, text: "Несовершенный вид; совершенный — odetchnąć «вздохнуть, перевести дух»." }
  - { kind: usage, text: "Отглагольное oddychanie значит «дыхание»: problemy z oddychaniem «проблемы с дыханием»." }
collocations:
  - { pl: "oddychać głęboko", ru: "дышать глубоко" }
  - { pl: "oddychać przez nos", ru: "дышать носом" }
  - { pl: "problemy z oddychaniem", ru: "проблемы с дыханием" }
family:
  - { pl: "odetchnąć", ru: "вздохнуть, перевести дух", relation: aspect }
  - { pl: "oddech", ru: "дыхание, вздох", relation: root }
  - { pl: "oddychanie", ru: "дыхание", relation: derived }
etymology: "Приставка od- плюс корень dych-, тот же, что в oddech «дыхание» и в русском «дышать», «дух». Русское «отдыхать» собрано из тех же частей, но значение у него ушло в другую сторону."
memory: "oddychać — «дышать», и это главная ловушка: похожее русское «отдыхать» по-польски будет odpoczywać. Дышат czymś, творительным: oddychać powietrzem."
idioms:
  - { pl: "oddychać głęboko", ru: "дышать глубоко" }
  - { pl: "problemy z oddychaniem", ru: "проблемы с дыханием" }
