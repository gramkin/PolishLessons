# review
id: wytrzymac
format: 2
lemma: "wytrzymać"
rank: 1511
pos: verb
aspect: perf
pron: { cyr: "вытшы́маць" }
senses:
  - id: endure
    ru: "выдержать, вытерпеть, вынести"
    examples:
      - pl: "Nie mogę wytrzymać tego gorąca."
        ru: "Я не выношу эту жару."
        source: { kind: translated, id: 589868 }
      - pl: "Nie wytrzymam tego hałasu."
        ru: "Я не вынесу этого шума."
        source: { kind: translated, id: 364256 }
      - pl: "Nie może wytrzymać napięcia."
        ru: "Он не может вынести напряжения."
        source: { kind: translated, id: 12307208 }
  - id: withstand
    ru: "выдержать (о предмете, конструкции)"
    examples:
      - pl: "Ta drabina nie wytrzyma nas obojga."
        ru: "Эта лестница не выдержит нас обоих."
        source: { kind: translated, id: 10592816 }
      - pl: "Chata prawdopodobnie nie wytrzyma silnego wiatru."
        ru: "Хижина, вероятно, не выдержит сильного ветра."
        source: { kind: translated, id: 6317057 }
      - pl: "Te buty wytrzymały rok."
        ru: "Эти ботинки продержались год."
        source: { kind: translated, id: 524556 }
  - id: hold-on
    ru: "продержаться, потерпеть"
    examples:
      - pl: "Wytrzymaj!"
        ru: "Держись!"
        source: { kind: tatoeba, id: 623696 }
      - pl: "Dasz radę, jeszcze tylko trochę wytrzymaj."
        ru: "Ты справишься, потерпи ещё немного."
        source: { kind: translated, id: 368167 }
      - pl: "Zaginiony chłopiec wytrzymał do przyjścia ekipy poszukiwawczej."
        ru: "Пропавший мальчик продержался до прихода поисковой группы."
        source: { kind: translated, id: 365381 }
notes:
  - { kind: government, text: "wytrzymać требует винительного падежа: wytrzymać ból «вытерпеть боль», wytrzymać ciężar «выдержать вес»." }
  - { kind: usage, text: "Частая конструкция nie do wytrzymania значит «невыносимый»: Ból jest nie do wytrzymania «Боль невыносима»." }
  - { kind: usage, text: "wytrzymaj! — «держись!, потерпи!», обычное ободрение." }
  - { kind: false-friend, text: "Форма wytrzymały — это не только прошедшее время множественного числа («они выдержали»), но и отдельное прилагательное wytrzymały «выносливый, прочный»: Jesteś wytrzymały «Ты выносливый»." }
  - { kind: usage, text: "Несовершенный вид — wytrzymywać." }
collocations:
  - { pl: "nie do wytrzymania", ru: "невыносимый" }
  - { pl: "wytrzymać ból", ru: "вытерпеть боль" }
  - { pl: "nie wytrzymam", ru: "я не выдержу" }
etymology: "Приставка wy- + trzymać «держать» — то же строение, что русское «вы-держать»: приставка означает доведение до конца."
memory: "wytrzymać = «выдержать», буквально wy- + trzymać, как русское «вы-» + «держать». Nie wytrzymam «я не выдержу», wytrzymaj! «держись!», а nie do wytrzymania — «невыносимый»."
idioms:
  - { pl: "nie do wytrzymania", ru: "невыносимый" }
  - { pl: "wytrzymaj!", ru: "держись!" }
  - { pl: "nie wytrzymam dłużej", ru: "я больше не выдержу" }
