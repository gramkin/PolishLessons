formExamples:
  - form: "wytrzyma"
    pl: "Lód wytrzyma?"
    ru: "Лёд выдержит?"
    source: { kind: translated, id: 9348330 }
  - form: "wytrzyma"
    pl: "Ta drabina nie wytrzyma nas obojga."
    ru: "Эта лестница не выдержит нас обоих."
    source: { kind: translated, id: 10592816 }
  - form: "wytrzyma"
    pl: "Czy ona wytrzyma długą podróż?"
    ru: "Выдержит ли она долгую дорогу?"
    source: { kind: translated, id: 10319976 }
  - form: "wytrzymać"
    pl: "Nie mogę wytrzymać tego gorąca."
    ru: "Я не выношу эту жару."
    source: { kind: translated, id: 589868 }
  - form: "wytrzymać"
    pl: "Jak możesz wytrzymać ten hałas?"
    ru: "Как ты выносишь этот шум?"
    source: { kind: translated, id: 4725106 }
  - form: "wytrzymać"
    pl: "Roboty mogą wytrzymać niebezpieczne warunki."
    ru: "Роботы могут выдерживать опасные условия."
    source: { kind: translated, id: 1870660 }
  - form: "wytrzymaj"
    pl: "Wytrzymaj!"
    ru: "Держись!"
    source: { kind: tatoeba, id: 623696 }
  - form: "wytrzymaj"
    pl: "Proszę, wytrzymaj, aż skończę opowiadać."
    ru: "Пожалуйста, потерпи, пока я не закончу рассказывать."
    source: { kind: translated, id: 711037 }
  - form: "wytrzymaj"
    pl: "Dasz radę, jeszcze tylko trochę wytrzymaj."
    ru: "Ты справишься, потерпи ещё немного."
    source: { kind: translated, id: 368167 }
  - form: "wytrzymał"
    pl: "Zastanawiam się jak Tom wytrzymał z Mary aż tyle lat."
    ru: "Удивляюсь, как Том выдержал с Мэри столько лет."
    source: { kind: translated, id: 2399255 }
  - form: "wytrzymał"
    pl: "Zaginiony chłopiec wytrzymał do przyjścia ekipy poszukiwawczej."
    ru: "Пропавший мальчик продержался до прихода поисковой группы."
    source: { kind: translated, id: 365381 }
  - form: "wytrzymał"
    pl: "Że on to wytrzymał ponad dziesięć lat, jest prawie cudem."
    ru: "То, что он выдержал это больше десяти лет, — почти чудо."
    source: { kind: translated, id: 11272529 }
  - form: "wytrzymała"
    pl: "Gdyby jeszcze trochę wytrzymała, dopięłaby swego."
    ru: "Если бы она ещё немного продержалась, она добилась бы своего."
    source: { kind: translated, id: 837056 }
  - form: "wytrzymała"
    pl: "Lina wytrzymała ciężar."
    ru: "Верёвка выдержала вес."
    source: { kind: authored }
  - form: "wytrzymała"
    pl: "Nie wytrzymała napięcia i zapłakała."
    ru: "Она не выдержала напряжения и заплакала."
    source: { kind: authored }
  - form: "wytrzymały"
    pl: "Te buty wytrzymały rok."
    ru: "Эти ботинки продержались год."
    source: { kind: translated, id: 524556 }
  - form: "wytrzymały"
    pl: "Mury wytrzymały oblężenie."
    ru: "Стены выдержали осаду."
    source: { kind: authored }
  - form: "wytrzymały"
    pl: "Buty wytrzymały całą zimę."
    ru: "Ботинки выдержали всю зиму."
    source: { kind: authored }
  - form: "wytrzymam"
    pl: "Nie wytrzymam dłużej!"
    ru: "Я не могу больше терпеть."
    source: { kind: tatoeba, id: 352506 }
  - form: "wytrzymam"
    pl: "Nie wytrzymam tego."
    ru: "Я этого не выдержу."
    source: { kind: translated, id: 8496091 }
  - form: "wytrzymam"
    pl: "Nie wytrzymam dłużej tego hałasu."
    ru: "Я больше не вынесу этого шума."
    source: { kind: translated, id: 353928 }
  - form: "wytrzymania"
    pl: "Ten ból w żołądka jest nie do wytrzymania."
    ru: "Эта боль в животе невыносима."
    source: { kind: tatoeba, id: 3460212 }
  - form: "wytrzymania"
    pl: "Ból jest nie do wytrzymania."
    ru: "Боль невыносима."
    source: { kind: translated, id: 3649410 }
  - form: "wytrzymania"
    pl: "Jej szef jest trudny do wytrzymania."
    ru: "Её начальник невыносим."
    source: { kind: translated, id: 352707 }
