# review
id: zyczyc
format: 2
lemma: "życzyć"
rank: 818
pos: verb
aspect: imperf
pron: { cyr: "жы́чыць" }
senses:
  - id: wish
    ru: "желать (кому-л. чего-л.): дательный + родительный"
    note: "Человек в дательном, желаемое в родительном — как в русском «желать тебе счастья»."
    examples:
      - pl: "Życzę sukcesów w pracy."
        ru: "Желаю успехов в работе."
        source: { kind: tatoeba, id: 13041610 }
      - pl: "Życzę Ci zdrowia."
        ru: "Желаю тебе здоровья."
        source: { kind: translated, id: 1866777 }
      - pl: "Życzyłem mu miłej podróży."
        ru: "Я пожелал ему приятного путешествия."
        source: { kind: translated, id: 3410626 }
  - id: wish-sobie
    ru: "życzyć sobie — желать, хотеть (вежливо)"
    examples:
      - pl: "Ile talerzy pan sobie życzy?"
        ru: "Сколько ты хочешь тарелок?"
        source: { kind: tatoeba, id: 730432 }
      - pl: "Czego pan sobie życzy?"
        ru: "Что вы желаете?"
        source: { kind: translated, id: 8772621 }
      - pl: "Jak sobie życzysz."
        ru: "Как пожелаешь."
        source: { kind: translated, id: 4131980 }
  - id: noun
    ru: "życzenie — желание, пожелание"
    examples:
      - pl: "Jedynym jego życzeniem było zobaczyć syna po raz ostatni."
        ru: "Его единственным желанием было увидеть своего сына в последний раз."
        source: { kind: tatoeba, id: 2475883 }
      - pl: "Najlepsze życzenia!"
        ru: "Наилучшие пожелания!"
        source: { kind: translated, id: 4683827 }
      - pl: "Powiedz życzenie."
        ru: "Загадай желание."
        source: { kind: translated, id: 991313 }
notes:
  - { kind: government, text: "Двойное управление: человек в дательном, желаемое в родительном. Życzę ci zdrowia «Желаю тебе здоровья», życzył rodzicom dobrej nocy «пожелал родителям спокойной ночи». Русский строит фразу точно так же." }
  - { kind: usage, text: "Życz mi szczęścia — «Пожелай мне удачи». Ещё говорят Powodzenia! «Удачи!» — это уже готовая формула без глагола." }
  - { kind: usage, text: "życzyć sobie значит «желать, хотеть» и звучит вежливо-отстранённо: Czego pan sobie życzy? «Что вы желаете?», Jak sobie życzysz «Как пожелаешь»." }
  - { kind: usage, text: "Существительное życzenie — «желание, пожелание»: najlepsze życzenia «наилучшие пожелания», masz trzy życzenia «у тебя три желания». Прилагательное życzliwy значит «доброжелательный»." }
collocations:
  - { pl: "życzyć szczęścia", ru: "желать счастья" }
  - { pl: "życz mi szczęścia", ru: "пожелай мне удачи" }
  - { pl: "czego pan sobie życzy?", ru: "что вы желаете?" }
  - { pl: "najlepsze życzenia", ru: "наилучшие пожелания" }
family:
  - { pl: "życzenie", ru: "желание", relation: derived }
  - { pl: "życzliwy", ru: "доброжелательный", relation: derived }
  - { pl: "życzliwość", ru: "доброжелательность", relation: derived }
etymology: "Старое славянское слово того же гнезда, что pożyczyć «одолжить»: исходное значение — «наделять». В русском прямого родственника нет, «желать» слово другого корня."
memory: "życzyć — «желать», и управление в точности русское: человек в дательном, желаемое в родительном — Życzę ci zdrowia. Запомните Życz mi szczęścia «Пожелай мне удачи» и вежливое Czego pan sobie życzy? «Что вы желаете?». Существительное — życzenie."
idioms:
  - { pl: "życz mi szczęścia", ru: "пожелай мне удачи" }
  - { pl: "czego pan sobie życzy?", ru: "что вы желаете?" }
  - { pl: "najlepsze życzenia", ru: "наилучшие пожелания" }
