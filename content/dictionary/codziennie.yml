# review
id: codziennie
format: 2
lemma: "codziennie"
rank: 1343
pos: adv
pron: { cyr: "цодзе́нне" }
senses:
  - id: daily
    ru: "каждый день, ежедневно"
    examples:
      - pl: "Biegam codziennie."
        ru: "Я бегаю каждый день."
        source: { kind: tatoeba, id: 547878 }
      - pl: "Jeżdżę do Tokio codziennie."
        ru: "Я каждый день езжу в Токио."
        source: { kind: tatoeba, id: 362401 }
      - pl: "Codziennie mówię po angielsku."
        ru: "Я говорю по-английски каждый день."
        source: { kind: tatoeba, id: 531876 }
  - id: habit
    ru: "в советах и привычках: каждый день"
    examples:
      - pl: "Postaram się ćwiczyć codziennie."
        ru: "Буду стараться каждый день делать физические упражнения."
        source: { kind: tatoeba, id: 366961 }
      - pl: "Musisz codziennie uczyć się angielskiego."
        ru: "Ты должен изучать английский каждый день."
        source: { kind: tatoeba, id: 364264 }
      - pl: "Codziennie ćwiczę."
        ru: "Я тренируюсь каждый день."
        source: { kind: translated, id: 2205155 }
notes:
  - { kind: usage, text: "Codziennie — «каждый день». Прилагательное — codzienny «ежедневный, повседневный»: życie codzienne «повседневная жизнь»." }
  - { kind: usage, text: "Собрано из co «каждый» и dzień «день». По той же модели строятся co tydzień «каждую неделю» и co roku «каждый год»." }
  - { kind: usage, text: "Второе значение — «буднично, как обычно»: ubrany codziennie «одет по-будничному»." }
  - { kind: pronunciation, text: "dzi звучит мягко, «дзе-»: цодзе́нне. Ударение на предпоследний слог." }
collocations:
  - { pl: "codziennie rano", ru: "каждое утро" }
  - { pl: "prawie codziennie", ru: "почти каждый день" }
  - { pl: "życie codzienne", ru: "повседневная жизнь" }
etymology: "Из co «каждый» и dzień «день» плюс наречный суффикс. Русское «ежедневно» собрано из тех же частей, только с «еже-»."
memory: "codziennie — «каждый день», из co «каждый» и dzień «день». Прилагательное — codzienny: życie codzienne «повседневная жизнь». По той же модели строятся co tydzień и co roku."
