# review
id: gracz
format: 2
lemma: "gracz"
rank: 2148
pos: noun
pron: { cyr: "грач" }
senses:
  - id: player
    ru: "игрок (в игре, в спорте)"
    examples:
      - pl: "To najlepszy gracz sezonu."
        ru: "Это лучший игрок сезона."
        source: { kind: authored }
      - pl: "Gracze zajęli miejsca przy stole."
        ru: "Игроки заняли места за столом."
        source: { kind: authored }
      - pl: "Wymienili gracza w przerwie meczu."
        ru: "Они заменили игрока в перерыве матча."
        source: { kind: authored }
  - id: market-player
    ru: "перен. игрок (на рынке, в политике)"
    examples:
      - pl: "Na tym rynku liczy się trzech graczy."
        ru: "На этом рынке в счёт идут трое игроков."
        source: { kind: authored }
      - pl: "Stał się poważnym graczem w branży."
        ru: "Он стал серьёзным игроком в отрасли."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ЗДЕСЬ НАЧАЛЬНЫЙ ЗВУК ПОТЕРЯЛ УЖЕ ПОЛЬСКИЙ. Gracz образован от gra «игра», а gra — это русская «игра» без начального и-: праславянское *jьgra дало и то, и другое. Доказательство прячется внутри самого польского: igrzyska «игрища, Олимпийские игры» начальное i- сохранило. Само слово gracz русский не повторяет — там «игрок», с другим суффиксом." }
  - { kind: pronunciation, text: "Один слог, cz звучит как ч: «грач». Для русского уха это совпадает с названием птицы, и совпадение чистое — родства никакого. В косвенных падежах появляется второй слог: gracza — «гра́ча»." }
  - { kind: usage, text: "Родительный множественного двойной, graczy и graczów, как у tchórz и kapelusz. Переносное значение очень живое: gracz это человек расчётливый и ловкий — niezły z niego gracz «тот ещё игрок», poważny gracz na rynku «серьёзный игрок на рынке»." }
collocations:
  - { pl: "najlepszy gracz", ru: "лучший игрок" }
  - { pl: "gracz zespołowy", ru: "командный игрок" }
  - { pl: "gracz na rynku", ru: "игрок на рынке" }
family:
  - { pl: "gra", ru: "игра", relation: root, id: gra }
  - { pl: "grać", ru: "играть", relation: derived, id: grac }
  - { pl: "igrzyska", ru: "игры, игрища", relation: derived }
  - { pl: "rozgrywka", ru: "розыгрыш, тур", relation: derived }
etymology: "От gra «игра», из праславянского *jьgra — того же слова, что русская «игра», только польский потерял начальное и-. Что оно там было, видно по igrzyska «игрища», где i- уцелело. Отсюда grać «играть», zagrać, rozgrywka «тур, розыгрыш» и сам gracz с суффиксом деятеля -acz."
memory: "gracz — «игрок», от gra, а gra это «игра» без начального и-. Если забудете — вспомните igrzyska olimpijskie, там i- на месте. И звучит слово в точности как русский «грач», хотя общего у них ничего."
idioms:
  - { pl: "niezły gracz", ru: "тот ещё игрок, ловкач" }
  - { pl: "gracz zespołowy", ru: "командный игрок" }
