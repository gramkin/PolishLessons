# review
id: zjechac
format: 2
lemma: "zjechać"
rank: 4570
pos: verb
pron: { cyr: "зье́хаць" }
senses:
  - id: drive-down
    ru: "съехать, спуститься (на транспорте)"
    examples:
      - pl: "Zjechaliśmy windą na parter."
        ru: "Мы спустились на лифте на первый этаж."
        source: { kind: authored }
      - pl: "Zjechał na nartach ze stoku."
        ru: "Он съехал на лыжах со склона."
        source: { kind: authored }
      - pl: "Zjedź na pobocze i zatrzymaj się."
        ru: "Съезжай на обочину и остановись."
        source: { kind: authored }
  - id: criticise
    ru: "раскритиковать, разнести (разг.); съехаться (zjechać się)"
    examples:
      - pl: "Szef zjechał mnie za spóźnienie."
        ru: "Шеф отчитал меня за опоздание."
        source: { kind: authored }
      - pl: "Na święta zjechała się cała rodzina."
        ru: "На праздники съехалась вся семья."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ZJECHAĆ — не «съесть»: съесть — ZJEŚĆ, и формы похожи: ZJEM, «съем», но ZJADĘ, «съеду». Прямое значение — «съехать, спуститься»: ZJECHAĆ Z GÓRY, NA DÓŁ, Z AUTOSTRADY. В разговоре ZJECHAĆ KOGOŚ — «разнести, отчитать», а ZJECHANY — «вымотанный»: JESTEM ZJECHANY PO PRACY." }
  - { kind: usage, text: "Пятьдесят три формы: глагол движения, но переходный в разговорных значениях, отсюда ZJECHANY и деепричастие ZJECHAWSZY. Спряжение как у JECHAĆ: ZJADĘ, ZJEDZIESZ, ZJADĄ; повелительное ZJEDŹ. Видовой партнёр — ZJEŻDŻAĆ." }
  - { kind: government, text: "Откуда — Z с родительным: Z GÓRY, Z DROGI. Куда — NA с винительным или DO с родительным: NA POBOCZE, DO GARAŻU, NA DÓŁ. Съехаться — ZJECHAĆ SIĘ: GOŚCIE ZJECHALI SIĘ Z CAŁEJ POLSKI." }
  - { kind: pronunciation, text: "Читается «зье́хаць», два слога, ударение на первом. ZJ — «зь» плюс «е», без отдельного «й». CH — «х». Будущее ZJADĘ — «зья́дэ», ZJEDŹ — «зьедзь»." }
  - { kind: register, text: "Прямое значение нейтрально: водители, лыжники, лифты. ZJECHAĆ KOGOŚ и ZJECHANY — разговорные. ZJECHAĆ CAŁĄ EUROPĘ — «объездить всю Европу», тоже разговорное." }
collocations:
  - { pl: "zjechać na pobocze", ru: "съехать на обочину" }
  - { pl: "zjechać windą", ru: "спуститься на лифте" }
  - { pl: "zjechać się z całego kraju", ru: "съехаться со всей страны" }
family:
  - { pl: "zjeżdżać", ru: "съезжать, спускаться", relation: aspect }
  - { pl: "jechać", ru: "ехать", relation: root, id: jechac }
  - { pl: "zjazd", ru: "спуск; съезд", relation: derived, id: zjazd }
etymology: "Приставка Z- «с-, вниз» плюс JECHAĆ «ехать», праславянское *jěchati, то же, что русское «ехать». ZJAZD — «съезд» и «спуск», как в русском: и съезд партии, и съезд с трассы."
memory: "Zjechać — съехать, спуститься: zjechać z góry, na pobocze, windą. Не zjeść — съесть! Zjechać kogoś — отчитать. Zjechany — вымотанный. Читается «зье́хаць»."
idioms:
  - { pl: "zjechać kogoś od góry do dołu", ru: "разнести кого-то в пух и прах" }
