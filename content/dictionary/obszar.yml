# review
id: obszar
format: 2
lemma: "obszar"
rank: 1942
pos: noun
pron: { cyr: "о́бшар" }
senses:
  - id: area
    ru: "территория, площадь, район"
    examples:
      - pl: "Sprawdzamy cały obszar."
        ru: "Мы проверяем всю территорию."
        source: { kind: authored }
      - pl: "Na obszarze parku nie wolno palić."
        ru: "На территории парка нельзя курить."
        source: { kind: authored }
      - pl: "Obszary wiejskie się wyludniają."
        ru: "Сельские территории обезлюдевают."
        source: { kind: authored }
  - id: field
    ru: "область (знания, деятельности)"
    examples:
      - pl: "Obszar badań znacznie się powiększył."
        ru: "Область исследований значительно расширилась."
        source: { kind: authored }
      - pl: "W tym obszarze nauki pracuje niewielu."
        ru: "В этой области науки работают немногие."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Предложный падеж — obszarze, с чередованием r → rz: na obszarze miasta. Это общее правило для существительных на -r (ср. rower — na rowerze)." }
  - { kind: false-friend, text: "Одно польское слово покрывает три русских: «территория», «площадь» (как пространство) и «область» (как сфера деятельности). Поэтому obszar переводят по контексту: obszar wiejski «сельская территория», но obszar badań «область исследований»." }
  - { kind: government, text: "Чего именно область — в РОДИТЕЛЬНОМ: obszar parku, obszar badań. «На территории» — na obszarze с предложным. Однокоренное obszarnik значит «помещик», слово с историческим и неодобрительным оттенком." }
collocations:
  - { pl: "na obszarze", ru: "на территории" }
  - { pl: "obszar wiejski", ru: "сельская территория" }
  - { pl: "obszar badań", ru: "область исследований" }
family:
  - { pl: "obszarnik", ru: "помещик", relation: derived }
  - { pl: "obszerny", ru: "обширный, просторный", relation: derived }
etymology: "Слово пришло из немецкого и долго меняло облик: старопольские записи дают abszar, habszar, oberszar. Исходно так называли излишек земли за пределами отмеренного лана — надбавку к хозяйству. Отсюда и современное «территория, площадь». Русского родственника у слова нет: там на эти смыслы пошли «территория», «площадь» и «область»."
memory: "obszar — «территория» и «область» в одном слове, от немецкого заимствования, которое старопольский записывал как abszar. Предложный с чередованием: na obszarze."
idioms:
  - { pl: "na całym obszarze", ru: "на всей территории" }
  - { pl: "obszar działania", ru: "область деятельности" }
formExamplesSkip:
  - { form: "obszarze", cell: "Звательный", reason: "звательный падеж: для неодушевлённого существительного он практически не употребляется" }
