etymology: "Приставка PRZY- плюс TULIĆ, от праславянского *tuliti «прижимать, успокаивать». Русский сохранил этот корень в разговорном «притулиться» — «пристроиться, прижаться», и в областном «тулить» со значением «прижимать, прятать»; украинское ТУЛИТИСЯ живо и сегодня. В польском гнездо гораздо шире и вполне литературно: TULIĆ «прижимать, баюкать», PRZYTULIĆ «обнять», PRZYTULNY «уютный», PRZYTULANKA «мягкая игрушка», PRZYTULISKO «приют». Значение развивалось от простого прижимания к идее защищённого, тёплого места, и польское PRZYTULNY прошло этот путь до конца, а русское «притулиться» остановилось на первом шаге."
memory: "Корень тот же, что в разговорном «притулиться»: tulić «прижимать», przytulić «обнять». Отсюда же przytulny «уютный» — уютно там, где можно прижаться. Главное отличие в управлении: направление идёт через do с родительным, przytulić do serca, przytulić się do matki, тогда как русский берёт «к» с дательным. И произношение: prz звучит как «пш», отсюда «пшыту́личь»."
