notes:
  - { kind: government, text: "Переходное PRZYTULIĆ KOGOŚ требует винительного: PRZYTULIŁ CÓRKĘ «обнял дочь». А вот направление выражается иначе, чем в русском: PRZYTULIĆ KOGOŚ DO SIEBIE, DO PIERSI, DO SERCA — предлог DO с родительным, тогда как русский берёт «к» с дательным, «прижать к себе, к груди». Возвратное PRZYTULIĆ SIĘ строится так же: PRZYTULIŁA SIĘ DO NIEGO «она прижалась к нему», DO MATKI «к матери». Пара DO плюс родительный вместо «к» плюс дательный повторяется во многих польских глаголах движения и приближения, и запоминать её удобнее сразу целиком." }
  - { kind: false-friend, text: "Прилагательное того же корня, PRZYTULNY, значит «уютный»: PRZYTULNY POKÓJ «уютная комната», PRZYTULNA KAWIARNIA «уютное кафе». Русское ухо связи не улавливает, потому что «уютный» идёт от совсем другого корня, а наше родственное слово здесь — «притулиться». Поэтому запоминать стоит через образ: уютно там, где можно прижаться. Существительное PRZYTULANKA означает мягкую игрушку, а PRZYTULISKO — приют, место, где можно приткнуться; последнее слово редкое и книжное." }
  - { kind: pronunciation, text: "Читается «пшыту́личь», ударение на предпоследнем слоге. Сочетание PRZ даёт «пш»: звонкое RZ после глухого P оглушается, поэтому PRZYTULIĆ начинается как «пшы», а не «пржи». Это общее правило, оно же работает в PRZEZ «пшэс» и PRZYJACIEL «пшыя́чель». Буква Y звучит как русское «ы». В причастии PRZYTULONY слышно «пшытулё́ны», где группа IO даёт «ё»." }
  - { kind: usage, text: "Несовершенный партнёр — PRZYTULAĆ, и чередование I с A в основе здесь обычное: PRZYTULIĆ и PRZYTULAĆ, как ZAPROSIĆ и ZAPRASZAĆ. Пятьдесят три формы — подпись переходного глагола совершенного вида, с деепричастием PRZYTULIWSZY и полным страдательным причастием PRZYTULONY. Причастие часто работает как описание положения тела: SPAŁ PRZYTULONY DO PODUSZKI «он спал, прижавшись к подушке», и по-русски здесь естественнее деепричастие, а не причастие." }
  - { kind: register, text: "Слово тёплое и домашнее, без всякого оттенка высокого стиля; его одинаково свободно говорят детям, близким и друзьям. Частые сочетания: PRZYTULIĆ DO SERCA «прижать к сердцу», MOCNO PRZYTULIĆ «крепко обнять», PRZYTULIĆ NA POŻEGNANIE «обнять на прощание». Для формального объятия при встрече поляк скорее скажет UŚCISNĄĆ, а UŚCISK DŁONI означает рукопожатие. Отглагольное существительное PRZYTULENIE «объятие» звучит нейтрально и часто встречается в разговоре о детях." }
