    ru: "возбудить, начать (дело, расследование, процедуру)"
    examples:
      - pl: "Prokuratura wdrożyła śledztwo w tej sprawie."
        ru: "Прокуратура возбудила расследование по этому делу."
        source: { kind: authored }
  - id: get-used
    ru: "втянуться, освоиться (wdrożyć się do czegoś)"
    examples:
      - pl: "Szybko wdrożyła się do nowej pracy."
        ru: "Она быстро втянулась в новую работу."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "WDROŻYĆ звучит похоже на русское «внедрить» и значит почти то же: WDROŻYĆ SYSTEM «внедрить систему», WDROŻENIE «внедрение». Но корень другой, и у польского слова есть значения, которых нет у «внедрить»: «приучить кого-то» (WDROŻYĆ DO PRACY) и «возбудить дело» (WDROŻYĆ POSTĘPOWANIE)." }
  - { kind: government, text: "Что внедрить — винительный: WDROŻYĆ PROJEKT. Кого к чему приучить — винительный и DO + родительный: WDROŻYĆ KOGOŚ DO PRACY. Возвратное WDROŻYĆ SIĘ DO CZEGOŚ — «втянуться во что-то»." }
  - { kind: usage, text: "Совершенный вид; несовершенный — WDRAŻAĆ (чередование O → A). Будущее: WDROŻĘ, WDROŻYSZ, WDROŻĄ. Повелительное с Ó: WDRÓŻ, WDRÓŻMY, WDRÓŻCIE — как POŁÓŻ от POŁOŻYĆ; формы с O в карточку не включены." }
  - { kind: register, text: "Деловое и канцелярское слово: проекты, ИТ, менеджмент, юриспруденция. WDROŻENIE — частый термин в объявлениях о работе: «внедрение», «адаптация нового сотрудника»." }
collocations:
  - { pl: "wdrożyć system", ru: "внедрить систему" }
  - { pl: "wdrożyć w życie", ru: "воплотить в жизнь" }
  - { pl: "wdrożyć postępowanie", ru: "возбудить производство (по делу)" }
  - { pl: "wdrożyć kogoś do pracy", ru: "ввести кого-л. в курс работы" }
family:
  - { pl: "wdrażać", ru: "внедрять; приучать", relation: aspect }
  - { pl: "wdrożenie", ru: "внедрение; адаптация", relation: derived }
  - { pl: "droga", ru: "дорога", relation: root, id: droga }
etymology: "Приставка W- и старопольское DROŻYĆ (праславянское *doržiti), по-видимому, связанное со словом DROGA «дорога»: исходно «направить, вывести на путь». Сходство с русским «внедрить» случайно."
memory: "Wdrożyć ≈ «внедрить»: звучит похоже и значит то же. Wdrożenie systemu — внедрение системы; wdróż! — внедри!"
idioms:
