# review
id: zobaczyc
format: 2
lemma: "zobaczyć"
rank: 103
pos: verb
aspect: perf
aspectPair: widziec
pron: { cyr: "зоба́чыць" }
senses:
  - id: see
    ru: "увидеть, посмотреть"
    examples:
      - pl: "Chcę go zobaczyć."
        ru: "Я хочу его увидеть."
        source: { kind: tatoeba, id: 5397496 }
      - pl: "Zobacz! Grzyby!"
        ru: "Смотри! Грибы!"
        source: { kind: tatoeba, id: 12721015 }
      - pl: "Zobaczył mysz."
        ru: "Он увидел мышку."
        source: { kind: tatoeba, id: 3093115 }
  - id: meet
    ru: "увидеться, встретиться"
    examples:
      - pl: "Zobaczę ich jutro."
        ru: "Я увижу их завтра."
        source: { kind: tatoeba, id: 12959974 }
      - pl: "Zobaczymy się w przyszłą środę."
        ru: "Увидимся в следующую среду."
        source: { kind: tatoeba, id: 6313342 }
notes:
  - { kind: usage, text: "Видовая пара: widzieć «видеть» — zobaczyć «увидеть»." }
  - { kind: usage, text: "Формула прощания do zobaczenia буквально значит «до увидения» — ср. русское «до свидания»." }
collocations:
  - { pl: "do zobaczenia", ru: "до свидания" }
  - { pl: "zobaczymy", ru: "посмотрим" }
  - { pl: "zobacz sam", ru: "посмотри сам" }
etymology: "Приставочное от старого baczyć «смотреть, примечать» (ср. baczny «внимательный», baczność «внимание») с приставкой zo-."
memory: "Образовано не от widzieć, а от baczyć «примечать» — отсюда и baczność! «внимание!». Видовая пара: widzieć «видеть» → zobaczyć «увидеть», а прощание do zobaczenia буквально «до увидения»."
idioms:
  - { pl: "do zobaczenia", ru: "до свидания" }
  - { pl: "pożyjemy, zobaczymy", ru: "поживём — увидим" }
  - { pl: "zobaczymy", ru: "посмотрим" }
