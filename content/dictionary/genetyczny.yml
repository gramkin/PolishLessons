notes:
  - { kind: false-friend, text: "Ловушки в значении нет: GENETYCZNY — «генетический». Ловушка в форме: русский суффикс -ическ- польский передаёт как -YCZN-, и так у сотен слов: ENERGETYCZNY, KOSMETYCZNY, POLITYCZNY. Запомните одно правило, а не каждое слово: «-ический» даёт «-yczny» после T, D, R, S, Z (GENETYCZNY, KLASYCZNY, FIZYCZNY) и «-iczny» после остальных (LOGICZNY, TECHNICZNY)." }
  - { kind: usage, text: "Относительное прилагательное, степеней сравнения нет, все одиннадцать форм живые. Форма для мужчин-людей GENETYCZNI встречается в языке семейного права и медицины: RODZICE GENETYCZNI, OJCOWIE GENETYCZNI, то есть биологические родители в отличие от приёмных. Обратите внимание на чередование: GENETYCZNY, но GENETYCZNI." }
  - { kind: government, text: "Ставится обычно после существительного: BADANIE GENETYCZNE, KOD GENETYCZNY, CHOROBA GENETYCZNA. Перед существительным встречается реже, в описаниях: GENETYCZNE PODOBIEŃSTWO. По генетическим причинам — Z PRZYCZYN GENETYCZNYCH, Z с родительным." }
  - { kind: pronunciation, text: "Читается «гэнэты́чны», четыре слога, ударение на предпоследнем. G и N перед E твёрдые, «гэ» и «нэ», как в GEN «гэн». TY даёт твёрдое «ты», CZ — «ч». Русское «генети́ческий» ударяет тот же слог." }
  - { kind: register, text: "Научное слово, но оно вышло из лаборатории в быт: о генетических анализах говорят в новостях, в суде и на кухне. В разговоре о наследственности часто говорят проще: TO MA W GENACH, «это у него в генах»." }
