etymology: "Из GENETYKA, а то от греческого génesis, «происхождение, рождение». Сам термин «генетика» ввёл англичанин Уильям Бейтсон в 1905 году, и оттуда он разошёлся по всем языкам. Русский оформил прилагательное суффиксом -ическ-, польский -yczn-, но под ними один греческий -ikos."
memory: "Genetyczny — генетический: badanie genetyczne, kod genetyczny. Русское -ический — польское -yczny. Rodzice genetyczni — биологические родители. Читается «гэнэты́чны»."
idioms:
  - { pl: "mieć coś w genach", ru: "иметь что-то в крови, в генах" }
