# review
id: ludzki
format: 2
lemma: "ludzki"
rank: 789
pos: adj
pron: { cyr: "лю́цки" }
senses:
  - id: human
    ru: "человеческий"
    examples:
      - pl: "Ludzki mózg jest zadziwiający."
        ru: "Человеческий мозг удивителен."
        source: { kind: translated, id: 6406216 }
      - pl: "Z daleka ten kamień wygląda jak ludzka twarz."
        ru: "Издалека этот камень похож на человеческое лицо."
        source: { kind: tatoeba, id: 3116521 }
      - pl: "To jest ludzka tragedia."
        ru: "Это человеческая трагедия."
        source: { kind: translated, id: 4481147 }
  - id: human-nature
    ru: "Błądzić jest rzeczą ludzką — человеку свойственно ошибаться"
    examples:
      - pl: "Błądzić jest rzeczą ludzką."
        ru: "Ошибаться — дело человеческое."
        source: { kind: translated, id: 2186422 }
      - pl: "Mylić się jest rzeczą ludzką."
        ru: "Ошибаться свойственно человеку."
        source: { kind: translated, id: 12141495 }
      - pl: "Błądzenie to rzecz ludzka."
        ru: "Блуждать — дело человеческое."
        source: { kind: translated, id: 13560527 }
  - id: humane
    ru: "ludzki — человечный, гуманный"
    note: "Второе значение, которого русское «человеческий» не несёт."
    examples:
      - pl: "Jestem ludzki."
        ru: "Я человечен."
        source: { kind: translated, id: 3629899 }
      - pl: "Szef okazał się bardzo ludzki."
        ru: "Начальник оказался очень человечным."
        source: { kind: authored }
      - pl: "To bardzo ludzki gest."
        ru: "Это очень человечный жест."
        source: { kind: authored }
  - id: beyond
    ru: "przechodzić ludzkie pojęcie — уму непостижимо"
    examples:
      - pl: "Czy mogę mieć proste ludzkie pragnienia?"
        ru: "Могут у меня быть простые человеческие желания?"
        source: { kind: tatoeba, id: 13781661 }
      - pl: "Człowiekiem jestem i nic co ludzkie nie jest mi obce."
        ru: "Я человек, и ничто человеческое мне не чуждо."
        source: { kind: tatoeba, id: 13472044 }
      - pl: "To przechodzi ludzkie pojęcie."
        ru: "Это уму непостижимо."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Прилагательное работает в двух смыслах: «человеческий» (ludzki mózg) и «человечный, гуманный» (ludzki szef «человечный начальник»). От него же наречие po ludzku «по-человечески»: Potraktuj go po ludzku." }
  - { kind: usage, text: "Błądzić jest rzeczą ludzką — польский перевод латинского errare humanum est, «человеку свойственно ошибаться»." }
  - { kind: usage, text: "przechodzić ludzkie pojęcie «уму непостижимо» и przechodzić ludzki rozum — оба про то, что не укладывается в голове. Первый оборот разобран в карточке pojęcie." }
  - { kind: usage, text: "Родня прозрачная: lud «народ», ludzie «люди», ludzkość «человечество», człowiek «человек»." }
collocations:
  - { pl: "ludzki mózg", ru: "человеческий мозг" }
  - { pl: "po ludzku", ru: "по-человечески" }
  - { pl: "istota ludzka", ru: "человеческое существо" }
  - { pl: "ludzkie uczucia", ru: "человеческие чувства" }
family:
  - { pl: "ludzie", ru: "люди", relation: root }
  - { pl: "lud", ru: "народ", relation: root }
  - { pl: "ludzkość", ru: "человечество", relation: derived }
  - { pl: "człowiek", ru: "человек", relation: root }
etymology: "От lud «народ» и ludzie «люди» — то же гнездо, что русские «люди» и «людской»."
memory: "ludzki значит и «человеческий», и «человечный»: ludzki mózg «человеческий мозг», но ludzki szef «человечный начальник». От него же наречие po ludzku «по-человечески». И запомните Błądzić jest rzeczą ludzką: это польское errare humanum est, «человеку свойственно ошибаться»."
idioms:
  - { pl: "Błądzić jest rzeczą ludzką", ru: "человеку свойственно ошибаться" }
  - { pl: "po ludzku", ru: "по-человечески" }
  - { pl: "przechodzić ludzkie pojęcie", ru: "уму непостижимо" }
