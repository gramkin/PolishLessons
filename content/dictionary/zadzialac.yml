# review
id: zadzialac
format: 2
lemma: "zadziałać"
rank: 1311
pos: verb
aspect: perf
aspectPair: dzialac
pron: { cyr: "задзя́уаць" }
senses:
  - id: will-work
    ru: "сработать, подействовать"
    examples:
      - pl: "Myślałem, że to zadziała."
        ru: "Я думал, это сработает."
        source: { kind: tatoeba, id: 5907119 }
      - pl: "To zadziała."
        ru: "Это сработает."
        source: { kind: translated, id: 8213690 }
      - pl: "To nie zadziała."
        ru: "Это не сработает."
        source: { kind: translated, id: 531028 }
  - id: it-worked
    ru: "zadziałało — сработало"
    examples:
      - pl: "Zadziałało!"
        ru: "Сработало!"
        source: { kind: translated, id: 6308752 }
      - pl: "To nie zadziałało."
        ru: "Это не сработало."
        source: { kind: translated, id: 3997772 }
      - pl: "Lekarstwo zupełnie nie zadziałało."
        ru: "Лекарство совершенно не подействовало."
        source: { kind: translated, id: 670339 }
  - id: plan-medicine
    ru: "о планах, лекарствах, устройствах"
    examples:
      - pl: "Twój plan zadziałał."
        ru: "Твой план сработал."
        source: { kind: translated, id: 2218895 }
      - pl: "Lek zadziałał."
        ru: "Лекарство подействовало."
        source: { kind: translated, id: 8903271 }
      - pl: "Nasza idea w praktyce nie zadziałała."
        ru: "Наша идея на практике не сработала."
        source: { kind: translated, id: 352423 }
notes:
  - { kind: usage, text: "Самое частое употребление — о планах, лекарствах и устройствах: To zadziała «Это сработает», Lek zadziałał «Лекарство подействовало»." }
  - { kind: usage, text: "Безличное Zadziałało! «Сработало!» — готовая реплика." }
  - { kind: usage, text: "Вид совершенный; несовершенный — działać, карточка уже есть. Приставка za- здесь значит «начать и дать результат»." }
  - { kind: government, text: "zadziałać na kogoś «подействовать на кого-то» — предлог na с винительным падежом." }
collocations:
  - { pl: "to zadziała", ru: "это сработает" }
  - { pl: "plan zadziałał", ru: "план сработал" }
  - { pl: "lek zadziałał", ru: "лекарство подействовало" }
etymology: "Приставка za- и działać «действовать», от dzieło «дело». Русские «сработать» и «подействовать» передают то же самое другими корнями."
memory: "zadziałać — «сработать, подействовать»: To zadziała, Lek zadziałał. Готовая реплика — Zadziałało! «Сработало!». Несовершенный вид — działać."
idioms:
