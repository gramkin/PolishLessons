# review
id: swiadczyc
format: 2
lemma: "świadczyć"
rank: 2458
pos: verb
aspect: imperf
pron: { cyr: "сьвя́дчыць" }
senses:
  - id: testify-to
    ru: "свидетельствовать, говорить (о чём-л.)"
    examples:
      - pl: "Zapominanie o zadaniach domowych świadczy o nieuwadze."
        ru: "Забывание домашних заданий говорит о невнимательности."
        source: { kind: translated, id: 357318 }
      - pl: "Uroda w żaden sposób nie świadczy o charakterze człowieka."
        ru: "Красота никак не свидетельствует о характере человека."
        source: { kind: translated, id: 4327920 }
      - pl: "Jego twarz świadczyła przeciw niemu."
        ru: "Его лицо свидетельствовало против него."
        source: { kind: translated, id: 2279761 }
  - id: testify-court
    ru: "давать показания, свидетельствовать (в суде)"
    examples:
      - pl: "Nigdy bym nie świadczył przeciwko swojej żonie."
        ru: "Я никогда не стал бы свидетельствовать против своей жены."
        source: { kind: translated, id: 972892 }
      - pl: "Ten dowód świadczył na jego korzyść."
        ru: "Это доказательство свидетельствовало в его пользу."
        source: { kind: translated, id: 814634 }
notes:
  - { kind: government, text: "Свидетельствовать О чём-л. — świadczyć O czymś, с предложным падежом. Свидетельствовать против — przeciwko komuś, с творительным; в пользу — na czyjąś korzyść." }
  - { kind: usage, text: "Очень частый оборот: to świadczy o tym, że… «это говорит о том, что…». Он точно повторяет русскую конструкцию." }
  - { kind: false-friend, text: "От świadek «свидетель», которое уже есть в словаре. Корень тот же, что в русском «ведать», «сведущий»." }
  - { kind: usage, text: "Есть и значение «оказывать»: świadczyć usługi «оказывать услуги». Отглагольное имя świadczenie значит «услуга, пособие»." }
collocations:
  - { pl: "świadczyć o czymś", ru: "свидетельствовать о чём-л." }
  - { pl: "świadczyć usługi", ru: "оказывать услуги" }
etymology: "От świadek «свидетель»; корень тот же, что в русском «ведать», «сведущий»."
memory: "świadczyć o czymś — «свидетельствовать о чём-л.», с предложным падежом; оборот to świadczy o tym, że… повторяет русский дословно. Второе значение — «оказывать»: świadczyć usługi."
idioms:
  - { pl: "świadczyć o czymś", ru: "свидетельствовать о чём-л." }
  - { pl: "świadczyć usługi", ru: "оказывать услуги" }
