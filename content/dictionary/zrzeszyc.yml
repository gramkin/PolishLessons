# review
id: zrzeszyc
format: 2
lemma: "zrzeszyć"
rank: 6052
pos: verb
aspect: perf
pron: { cyr: "зжэ́шыць" }
senses:
  - id: unite
    ru: "объединить (людей, организации) в союз, ассоциацию"
    examples:
      - pl: "Nowa federacja zrzeszyła wszystkie kluby w regionie."
        ru: "Новая федерация объединила все клубы региона."
        source: { kind: authored }
      - pl: "Chcemy zrzeszyć rolników z całego powiatu."
        ru: "Мы хотим объединить фермеров со всего повята."
        source: { kind: authored }
      - pl: "Stowarzyszenie zrzeszyło ponad tysiąc tłumaczy."
        ru: "Ассоциация объединила больше тысячи переводчиков."
        source: { kind: authored }
  - id: unite-oneself
    ru: "zrzeszyć się — объединиться, вступить в объединение"
    examples:
      - pl: "Pracownicy zrzeszyli się w związku zawodowym."
        ru: "Работники объединились в профсоюз."
        source: { kind: authored }
      - pl: "Mieszkańcy osiedla zrzeszyli się, żeby bronić parku."
        ru: "Жители района объединились, чтобы защитить парк."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Совершенный вид, пара — ZRZESZAĆ. Обычно о формальном объединении: в союз, ассоциацию, федерацию, профсоюз. ZRZESZYĆ SIĘ W + предложный: zrzeszyć się w związku, «объединиться в союз», — где русский берёт «в» с винительным, польский ставит предложный." }
  - { kind: government, text: "Кого — винительный: zrzeszyć rolników. Во что — W + предложный: w stowarzyszeniu, w federacji; реже W + винительный: zrzeszyć się w związek. Результат — ZRZESZENIE, «объединение»: zrzeszenie prawników." }
  - { kind: pronunciation, text: "«зжэ́шыць»: ZRZ — «зж», SZ — «ш», Y — «ы», конечное Ć — «ць». Ударение на первом слоге: ZRZE-szyć." }
  - { kind: register, text: "Официально-деловое: уставы, новости о профсоюзах, спорте, бизнесе. В разговоре проще ZJEDNOCZYĆ SIĘ, POŁĄCZYĆ SIĘ, ZAPISAĆ SIĘ DO." }
collocations:
  - { pl: "zrzeszyć się w związku", ru: "объединиться в союз" }
  - { pl: "zrzeszyć członków", ru: "объединить членов" }
  - { pl: "prawo do zrzeszania się", ru: "право на объединение" }
family:
  - { pl: "zrzeszać", ru: "объединять", relation: aspect }
  - { pl: "zrzeszony", ru: "состоящий в организации", relation: derived, id: zrzeszony }
  - { pl: "zrzeszenie", ru: "объединение, ассоциация", relation: derived }
etymology: "От RZESZA, «множество людей, масса; община», древнего слова, близкого к RZECZ, «дело, вещь», через значение «общее дело». С приставкой Z-, «вместе», — «собрать в одну rzeszę». Слово стало термином в XIX веке, когда поляки создавали общества и союзы под чужой властью."
memory: "Zrzeszyć — собрать в одну rzeszę, «массу»: объединить в союз. Zrzeszyć się w związku — объединиться в профсоюз (предложный!). Пара — zrzeszać; результат — zrzeszenie."
idioms:
  - { pl: "wolność zrzeszania się", ru: "свобода объединений" }
