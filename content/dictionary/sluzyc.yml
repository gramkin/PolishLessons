# review
id: sluzyc
format: 2
lemma: "służyć"
rank: 1162
pos: verb
aspect: imperf
pron: { cyr: "слу́жыць" }
senses:
  - id: serve
    ru: "служить (кому-то, где-то)"
    examples:
      - pl: "Polityk powinien służyć narodowi."
        ru: "Политик должен служить народу."
        source: { kind: translated, id: 10604881 }
      - pl: "W czasie wojny służył w armii."
        ru: "Во время войны он служил в армии."
        source: { kind: translated, id: 709383 }
      - pl: "Dobrze mi służył ten nóż."
        ru: "Этот нож мне хорошо служил."
        source: { kind: translated, id: 349117 }
  - id: purpose
    ru: "służyć do czegoś — служить для чего-то"
    examples:
      - pl: "Czemu to służy?"
        ru: "Чему это служит?"
        source: { kind: translated, id: 751510 }
      - pl: "Do czego to służy?"
        ru: "Для чего это?"
        source: { kind: translated, id: 3099492 }
  - id: servant
    ru: "służący, służąca — слуга, служанка"
    examples:
      - pl: "Służąca sprzątnęła podłogę."
        ru: "Служанка подмела пол."
        source: { kind: translated, id: 358854 }
      - pl: "Jaki władca, taki służący."
        ru: "Каков господин, таков и слуга."
        source: { kind: translated, id: 440676 }
notes:
  - { kind: government, text: "służyć komuś — дательный падеж, как в русском: służyć narodowi «служить народу». А назначение вводится предлогом do с родительным: służyć do czegoś «служить для чего-то»." }
  - { kind: usage, text: "Причастия służący и służąca давно живут как существительные «слуга» и «служанка», и почти все примеры корпуса — именно они, а не формы глагола." }
  - { kind: usage, text: "Czym mogę służyć? — стандартная фраза продавца и официанта, «Чем могу помочь?». Ответ Służę pomocą значит «Охотно помогу»." }
  - { kind: false-friend, text: "Безличное nie służy mi значит «мне не на пользу, мне вредно»: Wieprzowina mi nie służy «Свинина мне не на пользу». У русского «служить» такого значения нет." }
collocations:
  - { pl: "służyć w wojsku", ru: "служить в армии" }
  - { pl: "służyć do czegoś", ru: "служить для чего-то" }
  - { pl: "czym mogę służyć", ru: "чем могу помочь" }
  - { pl: "nie służy mi", ru: "мне не на пользу" }
family:
  - { pl: "służba", ru: "служба", relation: root }
  - { pl: "usługa", ru: "услуга", relation: derived }
  - { pl: "przysługa", ru: "одолжение", relation: derived, id: przysluga }
etymology: "Праславянское *služiti — то же слово, что русское «служить», от *sluga «слуга». Значения разошлись мало."
memory: "służyć — «служить», с дательным: służyć narodowi. Назначение идёт через do: służyć do czegoś. Причастия służący и służąca давно стали существительными «слуга» и «служанка», а nie służy mi значит «мне не на пользу»."
idioms:
  - { pl: "czym mogę służyć", ru: "чем могу помочь" }
  - { pl: "nie służy mi", ru: "мне не на пользу" }
  - { pl: "służyć w wojsku", ru: "служить в армии" }
