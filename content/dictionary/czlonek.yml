# review
id: czlonek
format: 2
lemma: "członek"
rank: 1000
pos: noun
pron: { cyr: "чўо́нэк" }
senses:
  - id: member
    ru: "член (организации, клуба)"
    examples:
      - pl: "Ile osób może zaprosić członek klubu?"
        ru: "Сколько человек может пригласить член клуба?"
        source: { kind: translated, id: 751488 }
      - pl: "Członek tajnej organizacji popełnił samobójstwo."
        ru: "Член тайной организации покончил с собой."
        source: { kind: translated, id: 10836576 }
      - pl: "Tom jest członkiem komitetu."
        ru: "Том — член комитета."
        source: { kind: translated, id: 4467956 }
  - id: of-family
    ru: "член семьи, участник группы"
    examples:
      - pl: "Ten kot to właściwie członek naszej rodziny."
        ru: "Этот кот, по сути, член нашей семьи."
        source: { kind: translated, id: 780324 }
      - pl: "Jesteś członkiem zespołu."
        ru: "Ты член команды."
        source: { kind: translated, id: 13030390 }
      - pl: "Zostałem wybrany na członka drużyny."
        ru: "Меня выбрали в состав команды."
        source: { kind: translated, id: 3041709 }
  - id: plural
    ru: "członkowie — члены (о людях)"
    note: "Множественное мужского лица — członkowie, а не «członki»."
    examples:
      - pl: "Członkowie klubu zebrali się w sali konferencyjnej."
        ru: "Члены клуба собрались в конференц-зале."
        source: { kind: tatoeba, id: 369051 }
      - pl: "Wszyscy członkowie byli obecni."
        ru: "Все члены присутствовали."
        source: { kind: translated, id: 6635704 }
      - pl: "Komitet liczy 15 członków."
        ru: "В комитете пятнадцать членов."
        source: { kind: translated, id: 592356 }
notes:
  - { kind: usage, text: "Множественное число мужского лица — członkowie «члены (люди)». Форма członki к людям не относится: так называют части чего-либо, например механизма." }
  - { kind: government, text: "После być и zostać — творительный падеж: jest członkiem komitetu «он член комитета», został wybrany na członka «его выбрали членом» — тут винительный после na." }
  - { kind: usage, text: "У слова есть и анатомическое значение, как у русского «член», но в корпусе оно не встречается ни разу: в обиходе słowo значит прежде всего «участник, член организации»." }
  - { kind: usage, text: "Женская пара — członkini «член (о женщине)». Членство — członkostwo, а отдельная часть чего-то — człon." }
collocations:
  - { pl: "członek klubu", ru: "член клуба" }
  - { pl: "członek rodziny", ru: "член семьи" }
  - { pl: "członkowie komitetu", ru: "члены комитета" }
  - { pl: "członkostwo", ru: "членство" }
family:
  - { pl: "członkini", ru: "член (о женщине)", relation: derived }
  - { pl: "członkostwo", ru: "членство", relation: derived }
  - { pl: "człon", ru: "звено, часть", relation: root }
etymology: "От człon «звено, часть», праславянское *čelnъ. Русское «член» — то же слово, и оба языка развили из «части» значение «участник»."
memory: "członek — «член» организации, клуба, семьи. Множественное мужского лица — członkowie, а не «członki»: последнее относится к частям механизма. После być — творительный: jest członkiem komitetu. Женская пара — członkini."
idioms:
