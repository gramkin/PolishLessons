pos: noun
pron: { cyr: "ту́ркот" }
senses:
  - id: rumble
    ru: "грохот, стук (колёс, повозки)"
    examples:
      - pl: "Turkot wozu obudził wieś."
        ru: "Грохот телеги разбудил деревню."
        source: { kind: authored }
      - pl: "Słychać było turkot kół."
        ru: "Был слышен стук колёс."
        source: { kind: authored }
      - pl: "Turkot ucichł za zakrętem."
        ru: "Грохот стих за поворотом."
        source: { kind: authored }
  - id: clatter
    ru: "дребезжание, тарахтение"
    examples:
      - pl: "Turkot tramwaju niesie się daleko."
        ru: "Дребезжание трамвая разносится далеко."
        source: { kind: authored }
      - pl: "Obudził mnie turkot ciężarówki."
        ru: "Меня разбудило тарахтение грузовика."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Звук катящихся колёс по мостовой — слово из литературного и старого городского обихода." }
  - { kind: false-friend, text: "Не связано с «турком» или «туркотанием» голубей, хотя созвучие есть. Это звукоподражание." }
  - { kind: government, text: "Мужской неодушевлённый; родительный — turkotu." }
  - { kind: usage, text: "В корпусе слово не встречается, поэтому все примеры составлены вручную. Родственный глагол — turkotać «громыхать»." }
collocations:
  - { pl: "turkot kół", ru: "стук колёс" }
  - { pl: "turkot wozu", ru: "грохот телеги" }
etymology: "Звукоподражательное, от turkotać «громыхать, тарахтеть»."
memory: "turkot — стук и грохот колёс по мостовой, звукоподражание. Глагол — turkotać «громыхать»."
