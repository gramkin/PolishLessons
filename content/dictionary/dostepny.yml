etymology: "От существительного DOSTĘP «доступ», а оно от глагола DOSTĄPIĆ «приступить, подойти», из приставки DO- и корня *stęp-, того же, что в STĄPAĆ «ступать», STOPA «ступня», STOPIEŃ «ступень». Русский построил «доступ» и «доступный» из тех же частей и того же корня: «до-» плюс «ступить», и связь со «ступнёй» и «ступенью» там видна так же. Носовой Ę в польском стоит там, где русский даёт У: DOSTĘP и «доступ», STĄPAĆ и «ступать», и это соответствие регулярно. Суффикс -NY образует качественные прилагательные, и именно поэтому слово имеет степени сравнения — в отличие от SPORTOWY, где суффикс -OWY даёт относительное прилагательное без степеней."
memory: "Качественное прилагательное: тридцать три формы, со степенями dostępniejszy и najdostępniejszy — втрое больше, чем у относительного sportowy с его одиннадцатью. Суффикс решает: -ny даёт качественное со степенями, -owy относительное без них. Шире русского в одном месте: dostępny значит и «есть в наличии» о товаре и билетах. Ę перед P звучит «эм»: «досте́мпны». Корень тот же, что в «доступе», и носовой стоит на месте русского у."
idioms:
