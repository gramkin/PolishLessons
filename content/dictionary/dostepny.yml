notes:
  - { kind: government, text: "Прилагательное качественное, и отсюда тридцать три формы: одиннадцать в положительной степени, одиннадцать в сравнительной DOSTĘPNIEJSZY и одиннадцать в превосходной NAJDOSTĘPNIEJSZY. Это ровно втрое больше, чем у относительного SPORTOWY с его одиннадцатью, и разница не случайна: качественное прилагательное называет свойство, которое бывает в большей и меньшей мере, а относительное — отношение к предмету, которое степеней не имеет. Для кого доступно — предлог DLA с родительным: DOSTĘPNY DLA WSZYSTKICH. Без чего — предлог BEZ с родительным: DOSTĘPNY BEZ RECEPTY. Сравнение предлогом OD с родительным или союзом NIŻ." }
  - { kind: false-friend, text: "Прямое соответствие русскому «доступному», и корень тот же: DOSTĘP «доступ», от DOSTĄPIĆ, как «доступ» от «доступить». Расходятся языки в одном частом употреблении. По-польски DOSTĘPNY значит и «имеющийся в наличии», о товаре и о билетах: LEK DOSTĘPNY BEZ RECEPTY, BILETY DOSTĘPNE OD PONIEDZIAŁKU. По-русски в этих случаях чаще говорят «есть в наличии», «продаётся», «открыта продажа», а «доступен» звучит канцелярски. Поэтому польское слово употребляется шире и нейтральнее, чем русское, и переводить его надо по обстановке, а не буквально." }
  - { kind: pronunciation, text: "Читается «досте́мпны», ударение на предпоследнем слоге из трёх. Буква Ę перед P звучит «эм», а не «эн»: носовой уподобляется следующему губному, и это общее правило — так же в KĘPA и в ZĘBY. Конечное -Y даёт «ы». В сравнительной степени DOSTĘPNIEJSZY слогов становится пять, сочетание SZ читается «ш», и ударение идёт на предпоследний: «достэмпне́йшы». В превосходной NAJDOSTĘPNIEJSZY шесть слогов и ударение снова на предпоследнем." }
  - { kind: usage, text: "Частотные сочетания: DOSTĘPNY BEZ RECEPTY, OGÓLNIE DOSTĘPNY «общедоступный», DOSTĘPNY DLA WSZYSTKICH, ŁATWO DOSTĘPNY «легкодоступный», DOSTĘPNY ONLINE. В значении приспособленности для людей с инвалидностью употребляется оборот DOSTĘPNY DLA OSÓB Z NIEPEŁNOSPRAWNOŚCIAMI, и слово DOSTĘPNOŚĆ стало в этом смысле термином. Отрицание NIEDOSTĘPNY частотно и означает и «недоступный», и «недосягаемый» о человеке. Существительное DOSTĘP входит в оборот MIEĆ DOSTĘP DO CZEGOŚ «иметь доступ к чему-то», где польский берёт предлог DO с родительным, как и русский." }
