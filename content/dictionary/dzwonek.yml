etymology: "Уменьшительное от DZWON «колокол», а то — праславянское слово, давшее и русский «звон», и «звонить». Начальное DZ в польском — позднейшая надстройка: исходный корень начинался просто со «з», и русское слово его сохранило. Поэтому DZWON и «звон» одно слово, только польское обросло лишней буквой. Запомнив эту пару, вы узнаете и DZWONIĆ в «звонить», и DZWONNICA в «звоннице»."
memory: "Звонок — дверной, школьный, велосипедный, а ещё колокольчик на лугу. Читается «дзво́нэк», где dz даёт один слитный звук. Беглое e выпадает: dzwonek, но dzwonka. Запомните, что dzwon это колокол, сам предмет, а русский «звон» только звук. И выучите целиком ostatni dzwonek — это и последний школьный звонок, и «крайний срок»."
idioms:
  - { pl: "ostatni dzwonek", ru: "последний звонок; крайний срок" }
formExamplesSkip:
