notes:
  - { kind: false-friend, text: "Расходятся языки в большом слове, а не в уменьшительном. DZWON по-польски это колокол, сам предмет, а русский «звон» — только звук, который он издаёт: наши колокола по-польски DZWONY. DZWONEK же уменьшительное от него и значит звонок — дверной, школьный, велосипедный, а ещё колокольчик на лугу. Заметьте и лишнюю букву: польское слово начинается с DZ, а русское просто со «з»." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. В основе беглое E, которое выпадает во всех косвенных падежах: DZWONEK, но DZWONKA, DZWONKIEM, DZWONKU. Так же устроены PRZYSTANEK и NAPIWEK. Множественное DZWONKI значит и звонки, и колокольчики-цветы, и различает их только смысл: NIEBIESKIE DZWONKI это, конечно, цветы." }
  - { kind: government, text: "Звонок в дверь — DZWONEK DO DRZWI, предлог DO с родительным, тогда как русский скажет «в дверь», с винительным. Нажать звонок — NACISNĄĆ DZWONEK, винительный без предлога. До звонка — DO DZWONKA, родительный. А «звонок на урок» — DZWONEK NA LEKCJĘ, предлог NA с винительным, как и у нас." }
  - { kind: pronunciation, text: "Читается «дзво́нэк», два слога, ударение на первом. Сочетание DZ даёт слитное «дз», один звук, а не два: не «д-з», а «дз». Конечная E даёт «э», поэтому слово кончается на «нэк». В косвенных падежах беглое E пропадает и остаётся два слога: DZWONKA звучит «дзво́нка», DZWONKIEM — «дзво́нкем»." }
  - { kind: register, text: "Слово нейтральное и повседневное. Главный оборот стоит выучить целиком: OSTATNI DZWONEK значит и школьный последний звонок, и «самый последний момент», как в TO JUŻ OSTATNI DZWONEK — «это уже крайний срок». В обоих языках образ один и тот же. А DZWONEK в смысле цветка — обычное название, которое знает каждый, кто бывал на лугу." }
