notes:
  - { kind: false-friend, text: "ДВА ГЛАГОЛА, КОТОРЫЕ РУССКИЙ РАЗЛИЧАЕТ ТАК ЖЕ, НО ОШИБИТЬСЯ ЛЕГКО. Zdawać egzamin значит «СДАВАТЬ», то есть сидеть и писать; zdać egzamin значит «СДАТЬ», то есть выдержать. Jutro zdaję egzamin — завтра я его пишу; zdałem egzamin — я его выдержал. Провалить экзамен — oblać egzamin или nie zdać. Логика видов та же, что в русском, но пара слышится почти одинаково." }
  - { kind: pronunciation, text: "Четыре слога, ударение на предпоследнем: eg-ZA-min. Латинское x польский передаёт через gz: egzamin, egzotyczny, egzekucja — там, где русский пишет «кз» или «кс». Звучит «эгза́мин», с ясным г." }
  - { kind: usage, text: "Экзамен СДАЮТ по предмету: egzamin z matematyki, z polskiego — предлог z с родительным, как русское «по». Устный и письменный: egzamin ustny, egzamin pisemny. Выпускной экзамен в Польше называется matura, и это слово в разговоре встречается чаще, чем egzamin." }
collocations:
  - { pl: "zdać egzamin", ru: "сдать экзамен" }
  - { pl: "oblać egzamin", ru: "провалить экзамен" }
  - { pl: "egzamin z matematyki", ru: "экзамен по математике" }
family:
  - { pl: "egzaminować", ru: "экзаменовать", relation: derived }
  - { pl: "matura", ru: "выпускной экзамен", relation: derived, id: matura }
  - { pl: "zaliczenie", ru: "зачёт", relation: root }
etymology: "Из латинского examen «взвешивание, язычок весов», от exigere «взвешивать, проверять». Корень тот же образ, что в ważyć: проверить значило взвесить. В русский слово пришло тем же путём и в то же время, через латынь и немецкий. Отсюда egzaminować, egzaminator и egzaminacyjny."
memory: "egzamin — «экзамен», только латинское x пишется как gz: egzamin, egzotyczny. И следи за видом: zdawać egzamin значит «сдавать», zdać egzamin — «сдать, выдержать». Провалить — oblać."
idioms:
  - { pl: "zdać egzamin", ru: "сдать экзамен; выдержать испытание" }
  - { pl: "oblać egzamin", ru: "провалить экзамен" }
