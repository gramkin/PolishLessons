notes:
  - { kind: usage, text: "Глагол живёт только с SIĘ: ODZYWAĆ без SIĘ в польском не употребляется, поэтому все пятьдесят две формы в карточке даны с SIĘ. Склад тот же, что у PODCHODZIĆ из партии 268: несовершенный непереходный — сорок одна основная форма, десять форм действительного причастия и деепричастие ODZYWAJĄC. Страдательных причастий нет, и причины сразу две: глагол и возвратный, и непереходный." }
  - { kind: usage, text: "Самое частое употребление — отрицательное, и русскому его стоит запомнить целиком. NIE ODZYWAJ SIĘ! значит «молчи, не лезь». NIE ODZYWAMY SIĘ DO SIEBIE — «мы не разговариваем друг с другом», то есть в ссоре. ODEZWIJ SIĘ, JAK DOJEDZIESZ — «дай знать, как доедешь». То есть глагол покрывает и «подать голос», и «быть на связи», и по-русски на его месте стоят разные слова." }
  - { kind: government, text: "Управление расходится с русским: ODZYWAĆ SIĘ DO KOGOŚ, предлог DO с родительным. NIE ODZYWA SIĘ DO MNIE значит «он со мной не разговаривает» — там, где русский берёт предлог «с» с творительным, польский берёт DO с родительным, то есть и предлог, и падеж другие. Та же картина, что у PODCHODZIĆ DO OKNA против «к окну». Правило для русского одно и то же: управление надо смотреть по карточке, а не переносить." }
  - { kind: pronunciation, text: "Пара видов меняет не только приставку, но и место гласной в корне, и это стоит заметить. Несовершенный ODZYWAĆ SIĘ держит ODZYW-, а совершенный ODEZWAĆ SIĘ держит ODEZW-: ODZYWAM SIĘ против ODEZWĘ SIĘ. Повелительное совершенного вида даёт ODEZWIJ SIĘ, с вставкой -ij, потому что основой ODEZW- польское слово закончиться не может, — тот же случай, что WALNIJ из прошлой партии. А у несовершенного вида повелительное выходит просто: ODZYWAJ SIĘ, из третьего лица ODZYWA плюс -j." }
collocations:
  - { pl: "odzywać się do kogoś", ru: "разговаривать с кем-либо" }
  - { pl: "nie odzywać się", ru: "молчать, не подавать голоса" }
  - { pl: "odezwij się", ru: "дай знать, объявись" }
family:
  - { pl: "odezwać", ru: "отозваться, объявиться", relation: aspect, id: odezwac }
  - { pl: "zwać", ru: "звать, называть", relation: root, id: zwac }
  - { pl: "odzew", ru: "отклик, отзыв", relation: derived }
etymology: "Приставка od- и ZYWAĆ, многократная форма от ZWAĆ «звать», из праславянского *zъvati — то же слово, что русское «звать». Буквально «откликнуться на зов», и русское «отзываться» собрано из тех же частей, включая многократный -зыв- против -зв-: «отзываться» при «отозваться», как ODZYWAĆ SIĘ при ODEZWAĆ SIĘ. Соответствие полное. Из гнезда вышли ODZEW «отклик», ODEZWA «обращение, прокламация», NAZWAĆ «назвать», WEZWAĆ «вызвать»."
memory: "od- плюс zywać от zwać «звать»: «отзываться» часть за частью, даже чередование -зыв-/-зв- то же. Но предлог другой: odzywać się DO kogoś, не «с кем-то»."
idioms:
  - { pl: "nie odzywać się do siebie", ru: "не разговаривать друг с другом, быть в ссоре" }
  - { pl: "odezwij się, jak dojedziesz", ru: "дай знать, как доедешь" }
