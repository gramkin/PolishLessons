# review
id: masarz
format: 2
lemma: "masarz"
rank: 5541
pos: noun
pron: { cyr: "ма́саш" }
senses:
  - id: butcher
    ru: "колбасник, мясник (изготовитель колбас)"
    examples:
      - pl: "Pracuje jako masarz."
        ru: "Он работает колбасником."
        source: { kind: translated, id: 12949535 }
      - pl: "Masarz wyrabia wędliny."
        ru: "Колбасник делает колбасные изделия."
        source: { kind: authored }
      - pl: "Dobry masarz zna się na mięsie."
        ru: "Хороший колбасник разбирается в мясе."
        source: { kind: authored }
  - id: trade
    ru: "работник мясного цеха"
    examples:
      - pl: "Masarz zaczyna pracę o świcie."
        ru: "Колбасник начинает работу на рассвете."
        source: { kind: authored }
      - pl: "W rodzinie od pokoleń każdy był masarzem."
        ru: "В семье поколениями все были колбасниками."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Одна буква отделяет его от masaż «массаж», и слова совершенно разные: masarz — мясник-колбасник, masażysta — массажист." }
  - { kind: usage, text: "Не всякий мясник: rzeźnik забивает и разделывает, masarz делает колбасы и ветчину. Его цех — masarnia." }
  - { kind: government, text: "Мужско-личный род; винительный совпадает с родительным." }
  - { kind: usage, text: "Корень mięso «мясо» в старой форме; в корпусе слово встречается один раз." }
  - { kind: government, text: "Родительный множественного — masarzy, как lekarzy и pisarzy: у существительных на -arz это окончание -y. Форма masarzów устарела." }
collocations:
  - { pl: "pracować jako masarz", ru: "работать колбасником" }
etymology: "От mięso «мясо» в старой основе; ср. русское «мясо», «мясник»."
memory: "masarz — колбасник, тот кто делает wędliny. Не путайте с masaż «массаж»: разница в одну букву. Мясник-забойщик — rzeźnik, цех — masarnia."
idioms:
  - { pl: "pracować jako masarz", ru: "работать колбасником" }
formExamplesSkip:
  - { form: "masarzów", reason: "родительный падеж множественного числа у существительных на -arz оканчивается на -y: masarzy, как lekarzy, pisarzy, malarzy. Вариант на -ów от этого типа основ нормой не признаётся" }
