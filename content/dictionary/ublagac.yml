# review
id: ublagac
format: 2
lemma: "ubłagać"
rank: 2159
pos: verb
aspect: perf
aspectPair: blagac
pron: { cyr: "убуа́гаць" }
senses:
  - id: beg-successfully
    ru: "вымолить, упросить"
    examples:
      - pl: "Ubłagał ojca, by go puścił."
        ru: "Он упросил отца отпустить его."
        source: { kind: authored }
      - pl: "Nie dało się jej ubłagać."
        ru: "Её невозможно было упросить."
        source: { kind: authored }
      - pl: "Ubłagali sędziego o litość."
        ru: "Они вымолили у судьи милость."
        source: { kind: authored }
  - id: implore
    ru: "умолить (добиться мольбой)"
    examples:
      - pl: "Ubłagam go, choćby to trwało wieki."
        ru: "Я его умолю, даже если это займёт века."
        source: { kind: authored }
      - pl: "Matka ubłagała lekarza."
        ru: "Мать умолила врача."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Совершенный вид к błagać «умолять»: błagać — просить, ubłagać — упросить, то есть добиться своего. Приставка u- даёт результат." }
  - { kind: government, text: "Винительный падеж лица: ubłagać kogoś. О чём просят — o с винительным: ubłagać o litość." }
  - { kind: false-friend, text: "Родственное прилагательное nieubłagany значит «неумолимый» — оно и попало в корпус вместо самого глагола." }
  - { kind: usage, text: "В корпусе для глагола нет ни одного примера, поэтому все примеры составлены вручную." }
collocations:
  - { pl: "ubłagać kogoś", ru: "упросить кого-л." }
  - { pl: "nie dać się ubłagać", ru: "быть неумолимым" }
etymology: "u- + błagać «умолять»; приставка u- даёт достигнутый результат, как русское «у-» в «упросить»."
memory: "ubłagać — «упросить, вымолить», совершенный вид к błagać «умолять». Приставка u- означает, что мольба удалась. Отсюда nieubłagany «неумолимый»."
idioms:
  - { pl: "nie dać się ubłagać", ru: "быть неумолимым" }
