# review
id: wskazywac
format: 2
lemma: "wskazywać"
rank: 1707
pos: verb
aspect: imperf
pron: { cyr: "фсказы́ваць" }
senses:
  - id: point
    ru: "указывать, показывать (направление, место)"
    examples:
      - pl: "Kompas wskazuje północ."
        ru: "Компас указывает на север."
        source: { kind: translated, id: 6371473 }
      - pl: "Strzałka wskazuje drogę do Tokio."
        ru: "Стрелка указывает дорогу в Токио."
        source: { kind: translated, id: 10999954 }
      - pl: "Mary wskazuje lustro."
        ru: "Мэри указывает на зеркало."
        source: { kind: translated, id: 12053418 }
  - id: indicate
    ru: "указывать на, свидетельствовать о"
    examples:
      - pl: "Gorączka wskazuje na chorobę."
        ru: "Температура указывает на болезнь."
        source: { kind: translated, id: 7352238 }
      - pl: "Jak wskazują sondaże, większość popiera nową ustawę."
        ru: "Как показывают опросы, большинство поддерживает новый закон."
        source: { kind: translated, id: 701616 }
notes:
  - { kind: government, text: "В значении «свидетельствовать» — с na и винительным: gorączka wskazuje na chorobę. Прямое указание идёт без предлога: kompas wskazuje północ." }
  - { kind: usage, text: "palec wskazujący — «указательный палец»: застывшее причастие, которое стало частью названия." }
  - { kind: usage, text: "Совершенный вид — wskazać «указать»." }
  - { kind: false-friend, text: "Русское «показывать» вообще — это pokazywać; wskazywać значит именно «указывать», точечно, на что-то одно." }
collocations:
  - { pl: "wskazywać drogę", ru: "указывать дорогу" }
  - { pl: "palec wskazujący", ru: "указательный палец" }
  - { pl: "wskazywać na coś", ru: "указывать на что-либо" }
family:
  - { pl: "wskazać", ru: "указать", relation: aspect }
  - { pl: "pokazywać", ru: "показывать", relation: root, id: pokazywac }
  - { pl: "wskazówka", ru: "стрелка, подсказка", relation: root }
etymology: "Приставка w- + skazywać, того же корня, что русское «сказать» и «указать»: wskazywać и «указывать» — почти одно слово."
memory: "wskazywać — «указывать»: kompas wskazuje północ. В значении «свидетельствовать» — с na: gorączka wskazuje na chorobę. И запомните palec wskazujący «указательный палец»."
idioms:
  - { pl: "palec wskazujący", ru: "указательный палец" }
  - { pl: "wskazywać drogę", ru: "указывать дорогу" }
  - { pl: "wszystko wskazuje na to", ru: "всё указывает на то" }
