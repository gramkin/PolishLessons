formExamples:
  - form: "wskazuj"
    pl: "Nie wskazuj mnie bronią."
    ru: "Не указывай на меня оружием."
    source: { kind: translated, id: 1011727 }
  - form: "wskazuj"
    pl: "Nie wskazuj palcem na ludzi."
    ru: "Не указывай на людей пальцем."
    source: { kind: authored }
  - form: "wskazuj"
    pl: "Wskazuj mi drogę."
    ru: "Указывай мне дорогу."
    source: { kind: authored }
  - form: "wskazują"
    pl: "Jak wskazują sondaże, większość popiera nową ustawę."
    ru: "Как показывают опросы, большинство поддерживает новый закон."
    source: { kind: translated, id: 701616 }
  - form: "wskazują"
    pl: "Nasze kalkulacje wskazują, że rakieta jest poza swoim kursem."
    ru: "Наши расчёты показывают, что ракета сошла с курса."
    source: { kind: translated, id: 3706683 }
  - form: "wskazują"
    pl: "Dane wskazują, że optymalna długość wykładu powinna wynosić 30 zamiast 60 minut."
    ru: "Данные показывают, что оптимальная длина лекции должна составлять 30, а не 60 минут."
    source: { kind: translated, id: 597696 }
  - form: "wskazujący"
    pl: "Wziął motyla między kciuk a palec wskazujący."
    ru: "Он взял бабочку между большим и указательным пальцем."
    source: { kind: translated, id: 10781013 }
  - form: "wskazujący"
    pl: "Oparzyłem się w palec wskazujący szczypcami do ogniska."
    ru: "Я обжёг указательный палец щипцами для костра."
    source: { kind: translated, id: 728602 }
  - form: "wskazujący"
    pl: "To jest palec wskazujący."
    ru: "Это указательный палец."
    source: { kind: authored }
  - form: "wskazującym"
    pl: "Złapał motyla kciukiem i palcem wskazującym."
    ru: "Он поймал бабочку большим и указательным пальцем."
    source: { kind: translated, id: 10781015 }
  - form: "wskazującym"
    pl: "Pokazał na mapie palcem wskazującym."
    ru: "Он показал на карте указательным пальцем."
    source: { kind: authored }
  - form: "wskazującym"
    pl: "Dotknął ekranu palcem wskazującym."
    ru: "Он коснулся экрана указательным пальцем."
    source: { kind: authored }
  - form: "wskazuje"
    pl: "Kompas wskazuje północ."
    ru: "Компас указывает на север."
    source: { kind: translated, id: 6371473 }
  - form: "wskazuje"
    pl: "Strzałka wskazuje drogę do Tokio."
    ru: "Стрелка указывает дорогу в Токио."
    source: { kind: translated, id: 10999954 }
  - form: "wskazuje"
    pl: "Mary wskazuje lustro."
    ru: "Мэри указывает на зеркало."
    source: { kind: translated, id: 12053418 }
  - form: "wskazywało"
    pl: "Wszystko wskazywało na tę odpowiedź."
    ru: "Всё указывало на этот ответ."
    source: { kind: translated, id: 5105320 }
  - form: "wskazywało"
    pl: "Nic nie wskazywało na kłopoty."
    ru: "Ничто не указывало на неприятности."
    source: { kind: authored }
  - form: "wskazywało"
    pl: "Wszystko wskazywało na jego winę."
    ru: "Всё указывало на его вину."
    source: { kind: authored }
