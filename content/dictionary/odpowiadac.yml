# review
id: odpowiadac
format: 2
lemma: "odpowiadać"
rank: 949
pos: verb
aspect: imperf
aspectPair: odpowiedziec
pron: { cyr: "отповя́даць" }
senses:
  - id: answer
    ru: "отвечать (на вопрос, на звонок)"
    examples:
      - pl: "Dlaczego Mary nie odpowiada na moje telefony?"
        ru: "Почему Мэри не отвечает на мои звонки?"
        source: { kind: tatoeba, id: 5924081 }
      - pl: "Dlaczego przestała mi odpowiadać?"
        ru: "Почему она перестала мне отвечать?"
        source: { kind: tatoeba, id: 11264114 }
      - pl: "Dlaczego nie odpowiadasz?"
        ru: "Почему ты не отвечаешь?"
        source: { kind: translated, id: 10616061 }
  - id: suit
    ru: "odpowiadać komuś — подходить, устраивать кого-л."
    note: "Совсем не «отвечать»: речь о том, что нечто устраивает."
    examples:
      - pl: "Ta książka odpowiada twoim potrzebom."
        ru: "Эта книга отвечает твоим потребностям."
        source: { kind: tatoeba, id: 352484 }
      - pl: "Nie potrafię znaleźć pracy, która by mi odpowiadała."
        ru: "Я не могу найти работу, которая бы мне подходила."
        source: { kind: translated, id: 6441531 }
      - pl: "Towarzystwo Toma mi odpowiadało."
        ru: "Общество Тома меня устраивало."
        source: { kind: translated, id: 10698017 }
  - id: responsible
    ru: "odpowiadać za coś — отвечать за что-л., нести ответственность"
    examples:
      - pl: "Za małoletnie dzieci odpowiadają rodzice."
        ru: "Родители несут ответственность за несовершеннолетних детей."
        source: { kind: tatoeba, id: 12016252 }
      - pl: "Nie odpowiadam za to, co zrobił Tom."
        ru: "Я не отвечаю за то, что сделал Том."
        source: { kind: translated, id: 7905726 }
      - pl: "Odpowiadał za konserwację świątyni."
        ru: "Он отвечал за содержание храма."
        source: { kind: translated, id: 13091025 }
notes:
  - { kind: government, text: "Три разных управления, и путать их нельзя. odpowiadać NA coś «отвечать на что-то» — винительный после na. odpowiadać komuś «устраивать кого-то» — дательный без предлога. odpowiadać ZA coś «отвечать за что-то» — винительный после za." }
  - { kind: false-friend, text: "Значение «устраивать, подходить» для русского уха неожиданно: Ta książka odpowiada twoim potrzebom значит «Эта книга отвечает твоим потребностям», а Towarzystwo Toma mi odpowiadało — «Общество Тома меня устраивало»." }
  - { kind: usage, text: "Совершенный вид — odpowiedzieć, но только в значении «ответить». Для «устраивать» и «отвечать за» пара не образуется: это состояния." }
  - { kind: usage, text: "Однокоренные вам уже знакомы: odpowiedź «ответ», odpowiedni «подходящий», odpowiedzialny «ответственный». Все три смысла глагола видны в этом гнезде." }
collocations:
  - { pl: "odpowiadać na pytanie", ru: "отвечать на вопрос" }
  - { pl: "to mi odpowiada", ru: "это мне подходит" }
  - { pl: "odpowiadać za coś", ru: "отвечать за что-то" }
  - { pl: "odpowiedzialny", ru: "ответственный" }
family:
  - { pl: "odpowiedzieć", ru: "ответить", relation: aspect, id: odpowiedziec }
  - { pl: "odpowiedź", ru: "ответ", relation: root, id: odpowiedz }
  - { pl: "odpowiedni", ru: "подходящий", relation: root, id: odpowiedni }
etymology: "Из od- + powiadać «говорить», того же корня, что powiedzieć «сказать». Русское «отвечать» собрано иначе, от «вет» — «слово, совет», но мысль та же."
memory: "odpowiadać — не только «отвечать». Три управления, три смысла: odpowiadać NA pytanie «отвечать на вопрос», odpowiadać komuś «устраивать кого-то» (To mi odpowiada «Мне это подходит») и odpowiadać ZA coś «отвечать за что-то». Совершенный вид — odpowiedzieć, но только для первого значения."
idioms:
  - { pl: "odpowiadać na pytanie", ru: "отвечать на вопрос" }
  - { pl: "to mi odpowiada", ru: "это мне подходит" }
  - { pl: "odpowiadać za coś", ru: "отвечать за что-то" }
