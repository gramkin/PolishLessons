# review
id: zniechecic
format: 2
lemma: "zniechęcić"
rank: 2403
pos: verb
aspect: perf
pron: { cyr: "зьнехэ́нциць" }
senses:
  - id: discourage
    ru: "отбить охоту, обескуражить"
    examples:
      - pl: "Tom nie chce zniechęcić Mary."
        ru: "Том не хочет отбивать у Мэри охоту."
        source: { kind: translated, id: 4547002 }
      - pl: "Niepowodzenie go zniechęciło."
        ru: "Неудача отбила у него охоту."
        source: { kind: authored }
      - pl: "Nie chcę nikogo zniechęcić."
        ru: "Я не хочу никого обескуражить."
        source: { kind: authored }
  - id: lose-heart
    ru: "пасть духом, утратить охоту (zniechęcić się)"
    examples:
      - pl: "Tom się zniechęcił."
        ru: "Том пал духом."
        source: { kind: translated, id: 3510095 }
      - pl: "Zniechęciła się po pierwszej porażce."
        ru: "Она пала духом после первой неудачи."
        source: { kind: authored }
notes:
  - { kind: government, text: "Отбить охоту к чему-л. — zniechęcić kogoś DO czegoś, с предлогом do и родительным. С się — «пасть духом»." }
  - { kind: false-friend, text: "z- + niechęć «неохота», корень chęć «желание, охота». Русское «обескуражить» — от французского courage, образ совсем другой." }
  - { kind: usage, text: "Причастие zniechęcony «павший духом» стало самостоятельным прилагательным, и у него отдельная карточка." }
  - { kind: usage, text: "Несовершенный вид — zniechęcać. Противоположность — zachęcić «побудить, воодушевить»." }
collocations:
  - { pl: "zniechęcić kogoś do czegoś", ru: "отбить у кого-л. охоту к чему-л." }
  - { pl: "zniechęcić się", ru: "пасть духом" }
etymology: "z- + niechęć «неохота», корень chęć «желание». Русское «обескуражить» — от французского courage."
memory: "zniechęcić — «отбить охоту»: zniechęcić kogoś DO czegoś. С się — «пасть духом». Противоположность — zachęcić «воодушевить»."
idioms:
  - { pl: "zniechęcić się", ru: "пасть духом" }
