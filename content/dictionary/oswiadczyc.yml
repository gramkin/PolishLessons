formExamples:
  - form: "oświadczenia"
    pl: "Po zakończeniu szczytu prezydent Mitterand odciął się od tego oświadczenia."
    ru: "После окончания саммита президент Миттеран отмежевался от заявления."
    source: { kind: translated, id: 351929 }
  - form: "oświadczenia"
    pl: "Czekamy na treść oświadczenia."
    ru: "Мы ждём текста заявления."
    source: { kind: authored }
  - form: "oświadczenia"
    pl: "Nie ma jeszcze oświadczenia rządu."
    ru: "Заявления правительства ещё нет."
    source: { kind: authored }
  - form: "oświadczenie"
    pl: "Prezydent jutro wygłosi oświadczenie."
    ru: "Президент завтра выступит с заявлением."
    source: { kind: translated, id: 354014 }
  - form: "oświadczenie"
    pl: "Wyda pan jakieś oświadczenie?"
    ru: "Вы сделаете какое-нибудь заявление?"
    source: { kind: translated, id: 530535 }
  - form: "oświadczenie"
    pl: "Oświadczenie przesadziło z liczbą ofiar."
    ru: "Заявление преувеличило число жертв."
    source: { kind: translated, id: 722396 }
  - form: "oświadczyć"
    pl: "Ośmielił się jej oświadczyć."
    ru: "Он осмелился сделать ей предложение."
    source: { kind: translated, id: 351491 }
  - form: "oświadczyć"
    pl: "Tom postanowił się oświadczyć Mary."
    ru: "Том решил сделать Мэри предложение."
    source: { kind: translated, id: 10584114 }
  - form: "oświadczyć"
    pl: "Co go podkusiło, żeby się jej oświadczyć?"
    ru: "Что его дёрнуло сделать ей предложение?"
    source: { kind: translated, id: 351516 }
  - form: "oświadczył"
    pl: "Oświadczył się młodej kobiecie."
    ru: "Он сделал предложение молодой женщине."
    source: { kind: translated, id: 676837 }
  - form: "oświadczył"
    pl: "Czy on ci się oświadczył?"
    ru: "Он сделал тебе предложение?"
    source: { kind: translated, id: 587521 }
  - form: "oświadczył"
    pl: "Oświadczył się jej w Wigilię."
    ru: "Он сделал ей предложение в сочельник."
    source: { kind: authored }
  - form: "oświadczyłbym"
    pl: "Na twoim miejscu oświadczyłbym się jej."
    ru: "На твоём месте я сделал бы ей предложение."
    source: { kind: translated, id: 11241838 }
  - form: "oświadczyłbym"
    pl: "Gdybym miał więcej odwagi, oświadczyłbym się Mary."
    ru: "Будь у меня больше смелости, я сделал бы Мэри предложение."
    source: { kind: translated, id: 2412246 }
  - form: "oświadczyłbym"
    pl: "Oświadczyłbym się, gdybym miał pierścionek."
    ru: "Я сделал бы предложение, будь у меня кольцо."
    source: { kind: authored }
