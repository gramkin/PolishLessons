# review
id: oswiadczyc
format: 2
lemma: "oświadczyć"
rank: 2269
pos: verb
aspect: perf
pron: { cyr: "осьвя́дчиць" }
senses:
  - id: propose
    ru: "сделать предложение (oświadczyć się)"
    examples:
      - pl: "Ośmielił się jej oświadczyć."
        ru: "Он осмелился сделать ей предложение."
        source: { kind: translated, id: 351491 }
      - pl: "Tom postanowił się oświadczyć Mary."
        ru: "Том решил сделать Мэри предложение."
        source: { kind: translated, id: 10584114 }
      - pl: "Oświadczył się młodej kobiecie."
        ru: "Он сделал предложение молодой женщине."
        source: { kind: translated, id: 676837 }
  - id: statement
    ru: "заявление (существительное oświadczenie)"
    examples:
      - pl: "Prezydent jutro wygłosi oświadczenie."
        ru: "Президент завтра выступит с заявлением."
        source: { kind: translated, id: 354014 }
      - pl: "Wyda pan jakieś oświadczenie?"
        ru: "Вы сделаете какое-нибудь заявление?"
        source: { kind: translated, id: 530535 }
notes:
  - { kind: usage, text: "Без się значит «заявить», но в живой речи куда чаще встречается oświadczyć się «сделать предложение руки и сердца»." }
  - { kind: government, text: "Кому делают предложение — дательный падеж: oświadczyć się Mary, oświadczyć się jej." }
  - { kind: false-friend, text: "Корень świadek «свидетель», świadczyć «свидетельствовать»; ср. русское «свидетель», «свидетельствовать». Заявить — значит призвать в свидетели." }
  - { kind: usage, text: "Существительное oświadczenie «заявление» частотнее глагола в официальных текстах." }
collocations:
  - { pl: "oświadczyć się komuś", ru: "сделать кому-л. предложение" }
  - { pl: "wygłosić oświadczenie", ru: "выступить с заявлением" }
etymology: "o- + świadczyć «свидетельствовать», от świadek «свидетель»; ср. русское «свидетель», «засвидетельствовать»."
memory: "oświadczyć się komuś — «сделать предложение руки и сердца», с дательным падежом. Без się значит «заявить», отсюда oświadczenie «заявление»."
idioms:
  - { pl: "oświadczyć się komuś", ru: "сделать кому-л. предложение" }
