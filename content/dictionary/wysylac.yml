# review
id: wysylac
format: 2
lemma: "wysyłać"
rank: 1463
pos: verb
aspect: imperf
aspectPair: wyslac
pron: { cyr: "высы́уаць" }
senses:
  - id: send
    ru: "отправлять, посылать (вещь, сообщение)"
    examples:
      - pl: "Nie wysyłaj mi więcej niż jedną."
        ru: "Больше одной мне не присылай."
        source: { kind: tatoeba, id: 13785842 }
      - pl: "Wysyłam Ci książkę."
        ru: "Я посылаю тебе книгу."
        source: { kind: translated, id: 10542553 }
      - pl: "Wysyłam książkę pocztą."
        ru: "Я отправляю книгу почтой."
        source: { kind: translated, id: 766154 }
  - id: send-someone
    ru: "посылать, отправлять (человека куда-либо)"
    examples:
      - pl: "Japonia wysyła zawodników na igrzyska olimpijskie od roku 1912."
        ru: "Япония посылает спортсменов на Олимпийские игры с тысяча девятьсот двенадцатого года."
        source: { kind: translated, id: 368916 }
      - pl: "Wysyłam syna do szkoły."
        ru: "Я отправляю сына в школу."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Несовершенный вид к wysłać." }
  - { kind: government, text: "wysyłać coś komuś — винительный вещи и дательный лица: Wysyłam ci książkę. Куда — do с родительным или na с винительным." }
  - { kind: usage, text: "Современные сочетания: wysyłać SMS-y, e-maile, wiadomości. Для смс есть и отдельный глагол esemesować." }
  - { kind: false-friend, text: "Различайте wysyłać «отправлять» и posyłać «посылать (человека)»: первое чаще о вещах и сообщениях." }
collocations:
  - { pl: "wysyłać list", ru: "отправлять письмо" }
  - { pl: "wysyłać wiadomość", ru: "отправлять сообщение" }
  - { pl: "wysyłać pocztą", ru: "отправлять почтой" }
etymology: "Приставка wy- и syłać, многократная основа от słać «слать» (праславянское *sъlati). Русское «высылать» собрано из тех же частей."
memory: "wysyłać — «отправлять, посылать»: wy- плюс słać, как русское «высылать». Совершенный вид — wysłać. Управление: wysyłać coś komuś — винительный вещи и дательный лица."
idioms:
  - { pl: "wysyłać list", ru: "отправлять письмо" }
  - { pl: "wysyłać pocztą", ru: "отправлять почтой" }
  - { pl: "wysyłać wiadomość", ru: "отправлять сообщение" }
