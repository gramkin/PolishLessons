# review
id: przechodzic
format: 2
lemma: "przechodzić"
rank: 1053
pos: verb
aspect: imperf
aspectPair: przejsc
pron: { cyr: "пшэхо́дзиць" }
senses:
  - id: cross
    ru: "переходить (через что-то)"
    examples:
      - pl: "Staruszka przechodzi przez ulicę."
        ru: "Старушка переходит дорогу."
        source: { kind: tatoeba, id: 2962770 }
      - pl: "To niebezpieczne, aby tu przechodzić przez ulicę."
        ru: "Опасно переходить улицу здесь."
        source: { kind: tatoeba, id: 13785418 }
      - pl: "Właśnie przechodził przez ulicę."
        ru: "Он как раз переходил улицу."
        source: { kind: translated, id: 936369 }
  - id: pass-by
    ru: "проходить мимо, проходить (через место)"
    examples:
      - pl: "Codziennie przechodzę koło tego kościoła."
        ru: "Каждый день я прохожу мимо этой церкви."
        source: { kind: translated, id: 1059765 }
      - pl: "Przechodziłem wczoraj koło niej."
        ru: "Вчера я проходил мимо неё."
        source: { kind: translated, id: 366989 }
  - id: undergo
    ru: "проходить через что-то, переживать (болезнь, период, осмотр)"
    examples:
      - pl: "Przechodzimy trudny okres, ale mamy nadzieję, że wkrótce sytuacja się poprawi."
        ru: "Мы переживаем трудный период, но надеемся, что скоро ситуация улучшится."
        source: { kind: translated, id: 13482994 }
      - pl: "Pojazdy przechodzą przegląd co najmniej raz na kwartał."
        ru: "Машины проходят техосмотр не реже раза в квартал."
        source: { kind: translated, id: 900914 }
  - id: switch
    ru: "переходить на что-то (на диету, на пенсию)"
    examples:
      - pl: "Muszę zrzucić nadwagę, więc przechodzę na dietę."
        ru: "Мне нужно сбросить вес, поэтому я перехожу на диету."
        source: { kind: translated, id: 1987748 }
      - pl: "Nie zarabiał dużo, kiedy przechodził na emeryturę."
        ru: "Он немного зарабатывал, когда выходил на пенсию."
        source: { kind: translated, id: 3191471 }
notes:
  - { kind: government, text: "przechodzić przez coś «переходить через что-то» — предлог przez с винительным падежом. Улицу переходят przez ulicę, а не «улицу» без предлога, как по-русски." }
  - { kind: usage, text: "Несовершенный вид к przejść «перейти». Обе формы от chodzić/iść, отсюда и разные основы: przechodzę, но przejdę." }
  - { kind: usage, text: "przechodzić na coś значит «переходить на что-то»: przechodzić na dietę «садиться на диету», przechodzić na emeryturę «выходить на пенсию» — по-русски здесь «выходить», а не «переходить»." }
  - { kind: usage, text: "С прямым дополнением глагол значит «проходить, переживать»: przechodzić chorobę «болеть», przechodzić przegląd «проходить техосмотр», przechodzić trudny okres «переживать трудный период»." }
collocations:
  - { pl: "przechodzić przez ulicę", ru: "переходить улицу" }
  - { pl: "przechodzić na emeryturę", ru: "выходить на пенсию" }
  - { pl: "przechodzić przegląd", ru: "проходить техосмотр" }
  - { pl: "przechodzić obok", ru: "проходить мимо" }
family:
  - { pl: "przejść", ru: "перейти", relation: aspect, id: przejsc }
  - { pl: "przechodzień", ru: "прохожий", relation: derived }
  - { pl: "chodzić", ru: "ходить", relation: root, id: chodzic }
etymology: "Приставка prze- «пере-» плюс chodzić «ходить» — собрано ровно как русское «переходить». Корень тот же, что в русском «ход»."
memory: "przechodzić — несовершенный вид к przejść. Улицу здесь переходят przez ulicę, с предлогом przez и винительным падежом. И запомните przechodzić na emeryturę: по-польски «переходят» на пенсию, а по-русски «выходят»."
idioms:
  - { pl: "przechodzić do historii", ru: "входить в историю" }
  - { pl: "przechodzić z rąk do rąk", ru: "переходить из рук в руки" }
  - { pl: "przechodzić ludzkie pojęcie", ru: "быть выше человеческого понимания" }
formExamplesSkip:
  - { form: "przechodzeni", reason: "страдательное причастие мужского лица у этого глагола не употребляется: przechodzić не берёт человека прямым дополнением" }
  - { form: "przechodziwszy", reason: "книжное деепричастие прошедшего времени; в живой речи не употребляется" }
  - { form: "przechodzona", reason: "страдательного причастия у этого глагола по сути нет. Основание то же, по которому в карточке оставлена без примеров форма przechodzeni: przechodzić chorobę или przechodzić przegląd значит «переживать, проходить через», и такое дополнение по-польски в страдательный залог не ставится. А в прямом значении «переходить» прямого дополнения нет вовсе — переходят przez ulicę, через предлог" }
