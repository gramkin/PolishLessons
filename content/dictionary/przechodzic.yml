formExamples:
  - form: "przechodzą"
    pl: "Oni nie przechodzą."
    ru: "Они не переходят."
    source: { kind: translated, id: 3969543 }
  - form: "przechodzą"
    pl: "Nie śmiej się tak. Ciarki mnie przechodzą."
    ru: "Не смейся так. У меня мурашки по коже."
    source: { kind: translated, id: 713544 }
  - form: "przechodzą"
    pl: "Pojazdy przechodzą przegląd co najmniej raz na kwartał."
    ru: "Машины проходят техосмотр не реже раза в квартал."
    source: { kind: translated, id: 900914 }
  - form: "przechodząc"
    pl: "Nie można być za ostrożnym, przechodząc przez ulicę."
    ru: "Нельзя быть слишком осторожным, переходя улицу."
    source: { kind: translated, id: 1014398 }
  - form: "przechodząc"
    pl: "Przechodząc obok, zajrzał przez okno."
    ru: "Проходя мимо, он заглянул в окно."
    source: { kind: authored }
  - form: "przechodząc"
    pl: "Uważaj, przechodząc przez tory."
    ru: "Будь осторожен, переходя через пути."
    source: { kind: authored }
  - form: "przechodząca"
    pl: "Mało prawdopodobne, by następna osoba przechodząca przez te drzwi, miała na sobie krótkie spodenki."
    ru: "Вряд ли следующий человек, проходящий через эту дверь, будет в шортах."
    source: { kind: translated, id: 989512 }
  - form: "przechodząca"
    pl: "Kobieta przechodząca przez ulicę machnęła nam ręką."
    ru: "Женщина, переходившая улицу, махнула нам рукой."
    source: { kind: authored }
  - form: "przechodząca"
    pl: "Burza przechodząca nad miastem zerwała dachy."
    ru: "Гроза, проходившая над городом, сорвала крыши."
    source: { kind: authored }
  - form: "przechodzące"
    pl: "Dzieci przechodzące przez jezdnię muszą uważać."
    ru: "Дети, переходящие проезжую часть, должны быть внимательны."
    source: { kind: authored }
  - form: "przechodzące"
    pl: "Chmury przechodzące nad górami przyniosły deszcz."
    ru: "Облака, проходившие над горами, принесли дождь."
    source: { kind: authored }
  - form: "przechodzące"
    pl: "Auta przechodzące przegląd stoją na parkingu."
    ru: "Машины, проходящие техосмотр, стоят на парковке."
    source: { kind: authored }
  - form: "przechodzących"
    pl: "Te drzewa powinny osłonić nasz nowy dom od wzroku przechodzących na zewnątrz ludzi."
    ru: "Эти деревья должны закрыть наш новый дом от взглядов проходящих снаружи людей."
    source: { kind: translated, id: 722220 }
  - form: "przechodzących"
    pl: "Nie widać stąd przechodzących ludzi."
    ru: "Отсюда не видно проходящих людей."
    source: { kind: authored }
  - form: "przechodzących"
    pl: "Liczba przechodzących przez most samochodów rośnie."
    ru: "Число проходящих по мосту машин растёт."
    source: { kind: authored }
  - form: "przechodzenia"
    pl: "Unikaj przechodzenia przez ulicę gdy pada deszcz."
    ru: "Избегай перехода через улицу, когда идёт дождь."
    source: { kind: translated, id: 527264 }
  - form: "przechodzenia"
    pl: "Nie można być za ostrożnym podczas przechodzenia ulicy."
    ru: "Нельзя быть слишком осторожным при переходе улицы."
    source: { kind: translated, id: 664778 }
  - form: "przechodzenia"
    pl: "Dzieci mają tendencję do przechodzenia przez okres buntu."
    ru: "Дети склонны проходить через период бунта."
    source: { kind: translated, id: 960816 }
  - form: "przechodzenie"
    pl: "Przechodzenie przez tę ulicę jest bardzo niebezpieczne."
    ru: "Переходить эту улицу очень опасно."
    source: { kind: translated, id: 765829 }
  - form: "przechodzenie"
    pl: "Przechodzenie na czerwonym jest zabronione."
    ru: "Переход на красный запрещён."
    source: { kind: authored }
  - form: "przechodzenie"
    pl: "Przechodzenie na dietę wymaga cierpliwości."
    ru: "Переход на диету требует терпения."
    source: { kind: authored }
  - form: "przechodzę"
    pl: "Codziennie przechodzę koło tego kościoła."
    ru: "Каждый день я прохожу мимо этой церкви."
    source: { kind: translated, id: 1059765 }
  - form: "przechodzę"
    pl: "Muszę zrzucić nadwagę, więc przechodzę na dietę."
    ru: "Мне нужно сбросить вес, поэтому я перехожу на диету."
    source: { kind: translated, id: 1987748 }
  - form: "przechodzę"
    pl: "Przechodzę przez ulicę na zielonym."
    ru: "Я перехожу улицу на зелёный."
    source: { kind: authored }
  - form: "przechodzi"
    pl: "Staruszka przechodzi przez ulicę."
    ru: "Старушка переходит дорогу."
    source: { kind: tatoeba, id: 2962770 }
  - form: "przechodzi"
    pl: "Ich dom przechodzi przebudowę."
    ru: "Их дом переживает перестройку."
    source: { kind: translated, id: 723641 }
  - form: "przechodzi"
    pl: "Widziałem, jak przechodzi przez ulicę."
    ru: "Я видел, как он переходит улицу."
    source: { kind: translated, id: 614467 }
  - form: "przechodzić"
    pl: "To niebezpieczne, aby tu przechodzić przez ulicę."
    ru: "Опасно переходить улицу здесь."
    source: { kind: tatoeba, id: 13785418 }
  - form: "przechodzić"
    pl: "Bałem się nawet przechodzić koło niego."
    ru: "Я боялся даже проходить мимо него."
    source: { kind: translated, id: 351469 }
  - form: "przechodzić"
    pl: "Tom nie ma ochoty przechodzić drugi raz tego samego."
    ru: "Тому не хочется проходить через то же самое второй раз."
    source: { kind: translated, id: 3207402 }
