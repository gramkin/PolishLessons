senses:
  - id: lose
    ru: "проиграть (матч, игру)"
    examples:
      - pl: "Nasza drużyna przegrała."
        ru: "Наша команда проиграла."
        source: { kind: translated, id: 415213 }
      - pl: "Tom przegrał."
        ru: "Том проиграл."
        source: { kind: translated, id: 5629681 }
      - pl: "Kto walczy, może przegrać. Kto nie walczy - już przegrał."
        ru: "Кто борется, может проиграть. Кто не борется - уже проиграл."
        source: { kind: tatoeba, id: 2421546 }
  - id: lose-bet
    ru: "проиграть (пари, спор)"
    examples:
      - pl: "Przegrał zakład."
        ru: "Он проиграл пари."
        source: { kind: tatoeba, id: 7881238 }
      - pl: "Przegrałem zakład."
        ru: "Я проиграл пари."
        source: { kind: translated, id: 3452662 }
      - pl: "Tom przegrał zakład."
        ru: "Том проиграл пари."
        source: { kind: translated, id: 8512422 }
  - id: lose-war
    ru: "проиграть (войну, дело)"
    examples:
      - pl: "Przegrali wojnę secesyjną."
        ru: "Они проиграли Гражданскую войну."
        source: { kind: translated, id: 2216901 }
      - pl: "Przegrali wojnę na froncie wschodnim."
        ru: "Они проиграли войну на восточном фронте."
        source: { kind: translated, id: 728590 }
      - pl: "Przegraliśmy trzy do zera."
        ru: "Мы проиграли три-ноль."
        source: { kind: translated, id: 593424 }
notes:
  - { kind: government, text: "przegrać coś «проиграть что-то» — винительный: przegrać mecz, przegrać zakład. А «проиграть кому-то» — przegrać z kimś, с творительным: Przegrała z nim w tenisa." }
  - { kind: usage, text: "Счёт передаётся конструкцией с do: przegraliśmy trzy do zera «мы проиграли три-ноль»." }
  - { kind: usage, text: "Вид совершенный; несовершенный — przegrywać. Антоним — wygrać «выиграть», и вся пара построена от grać «играть»." }
  - { kind: false-friend, text: "У przegrać есть и техническое значение «переписать, перезаписать» плёнку или диск, но в обиходе оно редкое." }
collocations:
  - { pl: "przegrać mecz", ru: "проиграть матч" }
  - { pl: "przegrać zakład", ru: "проиграть пари" }
  - { pl: "przegrać z kimś", ru: "проиграть кому-то" }
etymology: "Приставка prze- и grać «играть»: буквально «про-играть», ровно как в русском. Пара — wygrać «выиграть», с приставкой wy- «вы-»."
memory: "przegrać — «проиграть», от grać «играть» с приставкой prze-, точно как русское «про-играть». Антоним — wygrać. Управление двойное: przegrać mecz (винительный), но przegrać z kimś (творительный)."
idioms:
