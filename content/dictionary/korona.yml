notes:
  - { kind: false-friend, text: "Одно польское слово отвечает трём русским. KORONA — это «корона» на голове монарха; «крона» дерева: KORONA DRZEWA, KORONY DRZEW SPLOTŁY SIĘ NAD DROGĄ; «крона» как денежная единица: KORONA CZESKA, KORONA SZWEDZKA; и наконец «коронка» у зубного врача: KORONA PORCELANOWA. Русский развёл первые два значения по двум словам, «короне» и «кроне», а для третьего завёл уменьшительное «коронку». Поэтому при переводе с польского выбирать нужно по предмету, и ошибка здесь не грамматическая, а предметная: KORONA DRZEWA это не «корона дерева». Историческое KORONA POLSKA означает Польскую Корону как государство, и это тоже переводится «Короной»." }
  - { kind: usage, text: "В дательном и местном падеже единственного числа N смягчается перед окончанием -IE: KORONIE. Так же у всех женских основ на N: ŚCIANA даёт ŚCIANIE, ŻONA — ŻONIE, DOLINA — DOLINIE. Родительный множественного — KORON, с нулевым окончанием и без вставной гласной, потому что группа RN выговаривается легко. Форма KORONY покрывает родительный единственного вместе с именительным и винительным множественного — три позиции одной формой, как у большинства женских слов на -A. Чередований в основе нет." }
  - { kind: government, text: "Женский род. Чья корона или чего — родительный: KORONA KRÓLA, KORONA DRZEWA, KORONA ZĘBA. «Под кроной» — предлог POD с творительным: POD KORONĄ STAREJ LIPY. «В короне» — W с местным: W KORONIE BRAKOWAŁO DWÓCH KAMIENI. Частотные глаголы: WŁOŻYĆ KORONĘ «надеть корону», ZDOBYĆ KORONĘ «завоевать корону», PRZYCIĄĆ KORONĘ «подрезать крону». Прилагательное KORONNY значит «коронный, главный»: KORONNY ARGUMENT «главный довод», и это выражение частотно в споре." }
  - { kind: pronunciation, text: "Читается «коро́на», три слога, ударение на предпоследнем. Все три O произносятся полно, как «о», без редукции: по-русски первый слог стал бы «ка», и именно это выдаёт акцент. Буква R одиночная, раскатистая. В дательном и местном KORONIE сочетание NIE даёт мягкое «не»: «коро́не». В родительном множественного KORON слогов два, ударение переходит на первый: «ко́рон»." }
