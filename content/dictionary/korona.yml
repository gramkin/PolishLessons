etymology: "Из латинского CORONA «венок, венец», а то — из греческого ΚΟΡΏΝΗ «изогнутое, кольцо». Оба наших языка взяли слово из латыни через церковный и государственный обиход, и первичное значение у них общее: венец монарха. Дальше развитие пошло по-разному. Польский распространил слово на всё, что имеет вид венца сверху: крону дерева, коронку зуба, а также на денежную единицу тех стран, где монета носила изображение короны. Русский для дерева взял отдельное слово «крона» — из немецкого KRONE, то есть из того же латинского источника, но вторым заходом и с другой огласовкой. Получилось, что «корона» и «крона» в русском — одно и то же слово, пришедшее дважды, а в польском оно так и осталось одним. Для зуба русский воспользовался уменьшительным «коронкой»."
memory: "Одно слово на три русских: korona — «корона» монарха, «крона» дерева (korona drzewa), «крона» как валюта (korona czeska) и «коронка» у зубного. Русские «корона» и «крона» — это одно латинское слово, пришедшее дважды; польский обошёлся одним. Дательный и местный koronie: n смягчается, как ściana/ścianie. Koronny argument — «главный довод»."
