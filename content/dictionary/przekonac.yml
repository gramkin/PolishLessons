# review
id: przekonac
format: 2
lemma: "przekonać"
rank: 598
pos: verb
aspect: perf
pron: { cyr: "пшэко́наць" }
senses:
  - id: persuade
    ru: "убедить, уговорить (przekonać kogoś do czegoś)"
    note: "Лицо — в винительном, предмет — через do + родительный: przekonać go do wyjazdu."
    examples:
      - pl: "Przekonał mnie."
        ru: "Он меня убедил."
        source: { kind: translated, id: 5153224 }
      - pl: "Trudno przekonać Jacka."
        ru: "Трудно убедить Яцека."
        source: { kind: translated, id: 361193 }
      - pl: "Przekonałem ją, by za niego wyszła."
        ru: "Я убедил её выйти за него."
        source: { kind: translated, id: 367178 }
  - id: become-convinced
    ru: "przekonać się — убедиться, удостовериться самому"
    note: "Частица się переворачивает направление: не «убедить кого-то», а «убедиться самому»."
    examples:
      - pl: "Jeśli mi nie wierzysz, idź i przekonaj się sam."
        ru: "Если не веришь мне, пойди и убедись сам."
        source: { kind: translated, id: 392999 }
      - pl: "Osadnicy przekonali się, że ziemia w dolinie jest żyzna."
        ru: "Поселенцы убедились, что земля в долине плодородна."
        source: { kind: translated, id: 525447 }
      - pl: "Zaraz się przekonasz, że mam rację."
        ru: "Сейчас ты убедишься, что я прав."
        source: { kind: translated, id: 629901 }
notes:
  - { kind: government, text: "przekonać kogoś (винительный) do czegoś (do + родительный): przekonał mnie do wyjazdu «он уговорил меня поехать». Можно и przekonać kogoś, żeby... — «уговорить, чтобы...»." }
  - { kind: usage, text: "С się смысл переворачивается: przekonać się «убедиться самому». Przekonasz się sam «Сам убедишься». Это тот же механизм, что в uczyć «учить» → uczyć się «учиться»." }
  - { kind: usage, text: "Формы przekonam, przekonasz, przekona — БУДУЩЕЕ время: глагол совершенного вида. Несовершенный вид — przekonywać." }
  - { kind: usage, text: "Причастие przekonany живёт как самостоятельное прилагательное «убеждён, уверен»: Nie jestem przekonany «Я не уверен» — фраза, которую слышишь постоянно. Существительное przekonanie — «убеждение»." }
collocations:
  - { pl: "przekonać kogoś do czegoś", ru: "убедить кого-то в чём-то" }
  - { pl: "przekonać się", ru: "убедиться" }
  - { pl: "nie jestem przekonany", ru: "я не уверен" }
  - { pl: "z przekonaniem", ru: "с убеждением" }
family:
  - { pl: "przekonanie", ru: "убеждение", relation: derived }
  - { pl: "przekonywać", ru: "убеждать", relation: derived }
  - { pl: "przekonany", ru: "убеждённый", relation: derived }
etymology: "Приставка prze- плюс старое konać «доводить до конца, совершать» (от *konъ «предел, начало»). Буквально «довести спор до конца». Та же основа в koniec «конец» и в русских «конец», «кон»."
memory: "przekonać — «убедить». Управление: przekonać kogoś (винительный) do czegoś (do + родительный) — przekonał mnie do wyjazdu «он уговорил меня поехать»; можно и przekonać kogoś, żeby... С частицей się направление переворачивается: przekonać się — «убедиться самому», Przekonasz się sam. Причастие przekonany живёт самостоятельно: Nie jestem przekonany «Я не уверен» — фраза на каждый день. И помните, что przekonam, przekonasz — это будущее время."
idioms:
  - { pl: "przekonać się na własnej skórze", ru: "убедиться на собственной шкуре" }
  - { pl: "nie jestem przekonany", ru: "я не уверен" }
  - { pl: "z pełnym przekonaniem", ru: "с полным убеждением" }
