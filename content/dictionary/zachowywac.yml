# review
id: zachowywac
format: 2
lemma: "zachowywać"
rank: 702
pos: verb
aspect: imperf
aspectPair: zachowac
pron: { cyr: "заховы́ваць" }
senses:
  - id: behave
    ru: "zachowywać się — вести себя"
    note: "Разницу между «вести себя» и «сохранять» делает się."
    examples:
      - pl: "Nie możemy po prostu zachowywać się tak jakby nic się nie stało."
        ru: "Мы просто не можем вести себя так, как будто ничего не случилось."
        source: { kind: tatoeba, id: 10115293 }
      - pl: "Nie możesz się tak zachowywać."
        ru: "Ты не можешь так себя вести."
        source: { kind: translated, id: 2689896 }
      - pl: "On dziwnie się zachowuje."
        ru: "Он странно себя ведёт."
        source: { kind: translated, id: 4617238 }
  - id: behave-imp
    ru: "Zachowuj się! — Веди себя прилично!"
    examples:
      - pl: "Jeśli jesteś mężczyzną, to zachowuj się po męsku."
        ru: "Если ты мужчина, веди себя по-мужски."
        source: { kind: tatoeba, id: 12574273 }
      - pl: "Jeśli jesteś królem, to zachowuj się po królewsku."
        ru: "Если ты король, веди себя по-королевски."
        source: { kind: tatoeba, id: 12574272 }
      - pl: "Zachowujcie się."
        ru: "Ведите себя прилично."
        source: { kind: translated, id: 10596287 }
  - id: keep
    ru: "zachowywać coś — сохранять, хранить"
    examples:
      - pl: "Ona zachowuje sekrety."
        ru: "Она хранит секреты."
        source: { kind: translated, id: 550695 }
      - pl: "Cały czas zachowywała spokój."
        ru: "Она всё время сохраняла спокойствие."
        source: { kind: translated, id: 929183 }
      - pl: "Nasza pamięć jest zdolnością umysłu do zachowywania informacji w celu późniejszego ich użycia."
        ru: "Наша память — способность разума сохранять информацию для последующего использования."
        source: { kind: translated, id: 2265243 }
  - id: aspect
    ru: "zachowywać — процесс; zachować — один раз"
    examples:
      - pl: "Tom źle się zachowywał."
        ru: "Том плохо себя вёл."
        source: { kind: translated, id: 8716649 }
      - pl: "Zachowywał się uprzejmie."
        ru: "Он вёл себя вежливо."
        source: { kind: translated, id: 919205 }
      - pl: "Poprosiłem Toma i Mary, żeby zachowywali się jak należy."
        ru: "Я попросил Тома и Мэри вести себя как следует."
        source: { kind: translated, id: 7164900 }
notes:
  - { kind: usage, text: "Глагол работает в двух режимах, и разницу делает się. С się — «вести себя»: Zachowuj się! «Веди себя прилично!», Dziwnie się zachowuje «Он странно себя ведёт». Без się — «сохранять»: zachowywać spokój, zachowywać tajemnicę." }
  - { kind: government, text: "zachowywać się JAK ktoś «вести себя как кто-то»: Zachowujesz się jak dziecko. И zachowywać się WOBEC kogoś «вести себя по отношению к кому-то»." }
  - { kind: usage, text: "Совершенный вид — zachować, а существительное zachowanie значит «поведение»: Jego zachowanie było dziwne." }
  - { kind: usage, text: "Корень тот же, что в chować «прятать, хранить», и то же гнездо, что у chronić и ochrona. zachować zimną krew — «сохранить хладнокровие», буквально «холодную кровь»." }
collocations:
  - { pl: "zachowywać się dobrze", ru: "вести себя хорошо" }
  - { pl: "zachowywać spokój", ru: "сохранять спокойствие" }
  - { pl: "zachowywać tajemnicę", ru: "хранить тайну" }
  - { pl: "zachować zimną krew", ru: "сохранить хладнокровие" }
family:
  - { pl: "zachować", ru: "сохранить", relation: aspect }
  - { pl: "zachowanie", ru: "поведение", relation: derived }
  - { pl: "chować", ru: "прятать, хранить", relation: root }
  - { pl: "ochrona", ru: "охрана", relation: root }
etymology: "za- + chowywać, от chować «прятать, хранить» — то же гнездо, что русские «хоронить» и «хранить», и то же, что в chronić и ochrona."
memory: "zachowywać работает в двух режимах, и разницу делает się. С się это «вести себя»: Zachowuj się! «Веди себя прилично!». Без się — «сохранять»: zachowywać spokój, zachowywać tajemnicę. Совершенный вид — zachować, а существительное zachowanie значит «поведение». Корень тот же, что в chronić и ochrona."
idioms:
