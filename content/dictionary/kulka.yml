notes:
  - { kind: pronunciation, text: "Дательный и предложный — KULCE, с переходом k в c, а родительный множественного — KULEK, с беглой e. Это обычное устройство уменьшительных на -ka, уже знакомое по kostka — kostce — kostek и szafka — szafce — szafek. Две приметы сразу, и обе на одном слове." }
  - { kind: usage, text: "KULKA — уменьшительное от KULA, а у того значений два: шар и пуля. Русское «пуля» и есть это польское слово, заимствованное в одном, военном смысле; так что наше слово — польское, суженное до одного значения. Сама kulka осталась при малом шаре: kulka lodów, kulka śniegu, kulki do gry, kulka w łożysku." }
collocations:
  - { pl: "kulka lodów", ru: "шарик мороженого" }
  - { pl: "kulka śniegu", ru: "снежок" }
  - { pl: "kulki do gry", ru: "шарики для игры" }
family:
  - { pl: "kula", ru: "шар, пуля", relation: root, id: kula }
  - { pl: "kuleczka", ru: "шарик", relation: derived }
  - { pl: "kulisty", ru: "шаровидный", relation: derived }
etymology: "Уменьшительное от KULA с суффиксом -ka. Само kula означает и шар, и пулю, и именно во втором значении слово попало в русский: «пуля» — заимствование из польского. Получается, что русское слово пришло отсюда, но взяло лишь половину смысла, а kulka осталась при шарике, от мороженого до подшипника."
memory: "Дательный KULCE с k → c, родительный множественного KULEK с беглой e — как у kostka. А наше «пуля» и есть польская kula."
