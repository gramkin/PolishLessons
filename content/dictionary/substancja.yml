etymology: "Из латинского слова со значением «сущность, основа». Русская «субстанция» — книжное слово того же корня, а польская SUBSTANCJA стала бытовым «веществом»."
memory: "Substancja — вещество (не «субстанция»). Читается «субста́нцья». Substancja czynna — действующее вещество. Substancje zakazane — запрещённые вещества."
