notes:
  - { kind: false-friend, text: "SUBSTANCJA — обычное «вещество», а не книжная «субстанция». SUBSTANCJA CZYNNA — «действующее вещество» лекарства, SUBSTANCJE ZAKAZANE — «запрещённые вещества», допинг и наркотики." }
  - { kind: usage, text: "Восемь живых форм, женский род на -CJA. Родительный, дательный и местный — SUBSTANCJI. Архаичная форма SUBSTANCYJ и звательный не даются." }
  - { kind: government, text: "Содержать вещество — ZAWIERAĆ SUBSTANCJĘ, винительный. Без вредных веществ — BEZ SZKODLIWYCH SUBSTANCJI. Утечка вещества — WYCIEK SUBSTANCJI, родительный." }
  - { kind: pronunciation, text: "Читается «субста́нцья», ударение на предпоследнем слоге. CJA — «цья»." }
collocations:
  - { pl: "substancja czynna", ru: "действующее вещество" }
  - { pl: "substancja chemiczna", ru: "химическое вещество" }
