# review
id: rokowac
format: 2
lemma: "rokować"
rank: 2210
pos: verb
aspect: imperf
pron: { cyr: "роко́ваць" }
senses:
  - id: promise
    ru: "сулить, подавать надежды"
    examples:
      - pl: "Sytuacja mieszkaniowa raczej nie rokowała nadziei na poprawę."
        ru: "Жилищное положение не сулило надежд на улучшение."
        source: { kind: translated, id: 1459962 }
      - pl: "Chory dobrze rokuje."
        ru: "Больной подаёт хорошие надежды."
        source: { kind: authored }
      - pl: "Ten projekt źle rokuje."
        ru: "Этот проект не сулит ничего хорошего."
        source: { kind: authored }
  - id: negotiate
    ru: "вести переговоры (rokowania)"
    examples:
      - pl: "Rokowania zakończone."
        ru: "Переговоры завершены."
        source: { kind: translated, id: 365750 }
      - pl: "Strony rokowały przez tydzień."
        ru: "Стороны вели переговоры неделю."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Два круга: медицинско-прогностический (chory dobrze rokuje «больной подаёт надежды») и дипломатический, где живёт существительное rokowania «переговоры»." }
  - { kind: government, text: "Сулить что-л. — винительный: rokować nadzieję. С наречием — rokować dobrze/źle." }
  - { kind: false-friend, text: "Корень rok, но не в значении «год»: здесь старое значение «срок, назначенное слово», откуда и «уговор, переговоры»." }
  - { kind: usage, text: "Существительное rokowania употребляется только во множественном числе, как русские «переговоры»." }
collocations:
  - { pl: "dobrze rokować", ru: "подавать надежды" }
  - { pl: "rokowania pokojowe", ru: "мирные переговоры" }
etymology: "От rok в старом значении «срок, назначенное слово»; ср. русское «урок», «зарок», «изрекать»."
memory: "rokować — «сулить, подавать надежды» (chory dobrze rokuje) и «вести переговоры». Существительное rokowania «переговоры» — только во множественном, как в русском."
idioms:
  - { pl: "dobrze rokować", ru: "подавать надежды" }
  - { pl: "rokowania pokojowe", ru: "мирные переговоры" }
