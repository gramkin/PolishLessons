# review
id: uwielbiac
format: 2
lemma: "uwielbiać"
rank: 651
pos: verb
aspect: imperf
pron: { cyr: "увье́льбяць" }
senses:
  - id: adore
    ru: "обожать, очень любить (что-л. — винительный)"
    note: "Шкала: lubić «нравиться» — uwielbiać «обожать» — kochać «любить»."
    examples:
      - pl: "Anna uwielbia czekoladę."
        ru: "Анна обожает шоколад."
        source: { kind: tatoeba, id: 2563935 }
      - pl: "Uwielbiam czosnek."
        ru: "Я люблю чеснок."
        source: { kind: tatoeba, id: 8743615 }
      - pl: "Uwielbiam śnieg."
        ru: "Я люблю снег."
        source: { kind: tatoeba, id: 5989623 }
  - id: love-doing
    ru: "uwielbiać + инфинитив — обожать что-л. делать"
    examples:
      - pl: "Dzieci uwielbiają śpiewać."
        ru: "Дети обожают петь."
        source: { kind: translated, id: 1515178 }
      - pl: "Uwielbiamy śpiewać."
        ru: "Мы обожаем петь."
        source: { kind: translated, id: 5011934 }
      - pl: "Fadil uwielbiał pisać wiersze."
        ru: "Фадиль обожал писать стихи."
        source: { kind: translated, id: 6159969 }
  - id: adored
    ru: "uwielbiany — обожаемый"
    note: "Страдательные формы здесь обычны."
    examples:
      - pl: "Mary jest uwielbiana przez ludzi."
        ru: "Мэри обожают люди."
        source: { kind: translated, id: 11264616 }
      - pl: "Ten słoń jest uwielbiany przez małe dzieci."
        ru: "Этого слона обожают маленькие дети."
        source: { kind: translated, id: 728433 }
      - pl: "Wszystkie dziewczyny go uwielbiały."
        ru: "Все девушки его обожали."
        source: { kind: translated, id: 7333814 }
  - id: worship
    ru: "славить, величать (в церковном языке)"
    note: "Исходное значение: корень тот же, что в wielki «великий»."
    examples:
      - pl: "Uwielbiamy Cię, Chryste."
        ru: "Славим Тебя, Христе."
        source: { kind: translated, id: 6014639 }
      - pl: "Uwielbiamy Boga w pieśniach."
        ru: "Мы славим Бога в песнопениях."
        source: { kind: authored }
      - pl: "Lud uwielbiał swego króla."
        ru: "Народ величал своего короля."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Выстраивается шкала силы: lubić «нравиться», uwielbiać «обожать», kochać «любить». Про вещи и занятия говорят uwielbiać, про людей чаще kochać." }
  - { kind: government, text: "Прямое дополнение в винительном: uwielbiam czosnek, uwielbia książki. Можно и с инфинитивом: uwielbiają śpiewać." }
  - { kind: usage, text: "Корень неожиданный: wielbić «славить, величать» от wielki «великий». Отсюда церковное Uwielbiamy Cię, Chryste «Славим Тебя, Христе» — то же слово, что и в Uwielbiam czosnek." }
  - { kind: usage, text: "Совершенного вида у глагола нет: обожание длится, а не завершается." }
collocations:
  - { pl: "uwielbiać coś", ru: "обожать что-либо" }
  - { pl: "być uwielbianym", ru: "быть обожаемым" }
  - { pl: "uwielbiać robić coś", ru: "обожать что-либо делать" }
  - { pl: "kochać", ru: "любить" }
family:
  - { pl: "wielbić", ru: "славить", relation: root }
  - { pl: "wielki", ru: "великий", relation: root }
  - { pl: "uwielbienie", ru: "обожание", relation: derived }
  - { pl: "kochać", ru: "любить", relation: root }
etymology: "Приставка u- плюс wielbić «славить, величать», от wielki «великий» — то же гнездо, что русские «великий» и «величать»."
memory: "uwielbiać — «обожать», и корень у него неожиданный: wielki «великий», то есть буквально «величать». Отсюда церковное Uwielbiamy Cię, Chryste «Славим Тебя» — то же самое слово, что и в Uwielbiam czosnek. В обиходе выстраивается шкала: lubić «нравиться», uwielbiać «обожать», kochać «любить», причём про вещи и занятия берут uwielbiać, а про людей чаще kochać. Управление простое, винительный."
idioms:
  - { pl: "uwielbiać coś", ru: "обожать что-либо" }
  - { pl: "być uwielbianym", ru: "быть обожаемым" }
  - { pl: "Uwielbiamy Cię", ru: "Славим Тебя" }
