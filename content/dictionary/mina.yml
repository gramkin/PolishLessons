etymology: "Из французского mine «выражение лица» — отсюда же русская «мина» в обоих значениях. Взрывное устройство названо по подкопу, слово другого происхождения."
memory: "mina — прежде всего «выражение лица»: robić minę «строить мину», kwaśna mina «кислая мина». Осторожно: minie и miną — это формы глагола minąć «миновать»."
idioms:
