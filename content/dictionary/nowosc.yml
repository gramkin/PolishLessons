notes:
  - { kind: false-friend, text: "NOWOŚĆ — «новинка» или «новизна», а не «новость»! Новость — WIADOMOŚĆ или NOWINA: DOBRA WIADOMOŚĆ, «хорошая новость». NOWOŚCI WYDAWNICZE — «книжные новинки»." }
  - { kind: usage, text: "Женский род, мягкая основа. NOWOŚCI — и родительный единственного, и именительный множественного. Множественное частое: NOWOŚCI W SKLEPIE." }
  - { kind: government, text: "Новинка на рынке — NOWOŚĆ NA RYNKU, местный. Для меня это новость — TO DLA MNIE NOWOŚĆ, «это для меня новое». Новинки сезона — NOWOŚCI SEZONU." }
  - { kind: pronunciation, text: "Читается «но́восьць»: OŚĆ — «осьць», ударение на первом слоге." }
collocations:
  - { pl: "nowość na rynku", ru: "новинка на рынке" }
  - { pl: "nowości wydawnicze", ru: "книжные новинки" }
  - { pl: "urok nowości", ru: "очарование новизны" }
family:
  - { pl: "nowy", ru: "новый", relation: root, id: nowy }
  - { pl: "nowina", ru: "новость, весть", relation: root, id: nowina }
  - { pl: "innowacja", ru: "инновация", relation: root }
etymology: "От NOWY «новый» с суффиксом -OŚĆ. Русские «новизна», «новинка» того же корня, а «новость» по-польски — WIADOMOŚĆ."
memory: "Nowość — новинка, новизна; новость — wiadomość. Nowość na rynku — новинка на рынке. Читается «но́восьць»."
idioms:
  - { pl: "to dla mnie nowość", ru: "это для меня новость, впервые слышу" }
