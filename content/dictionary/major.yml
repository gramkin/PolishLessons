etymology: "Из латинского maior «больший, старший» через немецкий военный язык. Русский «майор» пришёл тем же путём, поэтому слова совпадают полностью."
memory: "major — «майор», звание то же и на том же месте иерархии: выше капитана, ниже подполковника. В обращении — panie majorze. Слово одушевлённое: widzę majora."
