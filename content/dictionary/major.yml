notes:
  - { kind: usage, text: "Офицерское звание, стоящее там же, где и русское: выше капитана, ниже подполковника." }
  - { kind: usage, text: "Мужской одушевлённый, поэтому винительный совпадает с родительным: widzę majora. Лично-мужское множественное — majorowie." }
  - { kind: usage, text: "В обращении — звательная форма majorze: Tak jest, panie majorze!" }
