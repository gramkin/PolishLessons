# review
id: major
format: 2
lemma: "major"
rank: 1441
pos: noun
pron: { cyr: "ма́йор" }
senses:
  - id: rank
    ru: "майор (офицерское звание)"
    examples:
      - pl: "Major jest starszy stopniem od kapitana."
        ru: "Майор выше по званию, чем капитан."
        source: { kind: translated, id: 12450181 }
      - pl: "Major dowodzi batalionem."
        ru: "Майор командует батальоном."
        source: { kind: authored }
      - pl: "Awansował na majora."
        ru: "Он получил звание майора."
        source: { kind: authored }
  - id: address
    ru: "майор как обращение и как лицо"
    examples:
      - pl: "Tak jest, panie majorze!"
        ru: "Так точно, господин майор!"
        source: { kind: authored }
      - pl: "Major Kowalski wszedł do sali."
        ru: "Майор Ковальский вошёл в зал."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Две формы требуют оговорки. Majoru оставлена без примеров: major одушевлённый, и родительный у него majora; окончание -u берут неодушевлённые, а неодушевлённого major в польском нет (музыкальный мажор — dur). А majory — это не ошибка, а уничижительное множественное (forma deprecjatywna): te majory звучит пренебрежительно, как русское «эти майоры». Нейтральные формы — majorzy и majorowie." }
  - { kind: usage, text: "Офицерское звание, стоящее там же, где и русское: выше капитана, ниже подполковника." }
  - { kind: usage, text: "Мужской одушевлённый, поэтому винительный совпадает с родительным: widzę majora. Лично-мужское множественное — majorowie." }
  - { kind: usage, text: "В обращении — звательная форма majorze: Tak jest, panie majorze!" }
  - { kind: false-friend, text: "Не путайте major «майор» с majowy «майский» (от maj «май»): созвучие случайное." }
collocations:
  - { pl: "panie majorze", ru: "господин майор" }
  - { pl: "stopień majora", ru: "звание майора" }
  - { pl: "awansować na majora", ru: "получить звание майора" }
etymology: "Из латинского maior «больший, старший» через немецкий военный язык. Русский «майор» пришёл тем же путём, поэтому слова совпадают полностью."
memory: "major — «майор», звание то же и на том же месте иерархии: выше капитана, ниже подполковника. В обращении — panie majorze. Слово одушевлённое: widzę majora."
idioms:
  - { pl: "panie majorze", ru: "господин майор" }
  - { pl: "stopień majora", ru: "звание майора" }
  - { pl: "awansować na majora", ru: "получить звание майора" }
