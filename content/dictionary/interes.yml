# review
id: interes
format: 2
lemma: "interes"
rank: 533
pos: noun
pron: { cyr: "интэ́рэс" }
senses:
  - id: business
    ru: "дело, бизнес"
    note: "prowadzić interes «держать своё дело», robić interesy «вести дела»."
    examples:
      - pl: "To dobry interes."
        ru: "Это хорошая сделка."
        source: { kind: tatoeba, id: 1006965 }
      - pl: "Prowadzi niezależny interes."
        ru: "Он ведёт независимое дело."
        source: { kind: translated, id: 936047 }
      - pl: "Postanowił przekazać interesy synowi."
        ru: "Он решил передать дело сыну."
        source: { kind: translated, id: 358885 }
  - id: benefit
    ru: "интерес, выгода"
    note: "w czyimś interesie «в чьих-либо интересах»."
    examples:
      - pl: "Nie mówię tego w moim własnym interesie."
        ru: "Я говорю это не в своих интересах."
        source: { kind: translated, id: 4769680 }
      - pl: "Łączą ich wspólne interesy."
        ru: "Их связывают общие интересы."
        source: { kind: translated, id: 1179744 }
      - pl: "Ten bank zawsze pilnuje własnych interesów."
        ru: "Этот банк всегда блюдёт собственные интересы."
        source: { kind: translated, id: 8175373 }
  - id: affair
    ru: "дело (чьё-либо личное)"
    note: "To nie twój interes — «Не твоё дело», резко, но обычно."
    examples:
      - pl: "Nie twój interes."
        ru: "Не твоё дело."
        source: { kind: translated, id: 915193 }
      - pl: "To nie twój interes."
        ru: "Это не твоё дело."
        source: { kind: translated, id: 357754 }
      - pl: "Jedziesz tam w interesach?"
        ru: "Ты едешь туда по делам?"
        source: { kind: translated, id: 3041407 }
notes:
  - { kind: false-friend, text: "Ложный друг: interes — это прежде всего «дело, бизнес», а не «интерес» в смысле любопытства. «Интересно» будет ciekawe или interesujące, а «меня это интересует» — interesuje mnie to." }
  - { kind: usage, text: "Частые обороты: prowadzić interes «держать своё дело», robić interesy «вести дела», jechać w interesach «ехать по делам»." }
  - { kind: usage, text: "Второе значение — «выгода, интерес»: w interesie całej społeczności «в интересах всего общества», działać wbrew czyimś interesom «действовать вопреки чьим-то интересам»." }
  - { kind: usage, text: "To nie twój interes значит «Не твоё дело» и звучит довольно резко." }
collocations:
  - { pl: "robić interesy", ru: "вести дела" }
  - { pl: "prowadzić interes", ru: "держать своё дело" }
  - { pl: "w interesach", ru: "по делам" }
  - { pl: "to nie twój interes", ru: "не твоё дело" }
family:
  - { pl: "interesować", ru: "интересовать", relation: derived }
  - { pl: "interesowny", ru: "корыстный", relation: derived }
  - { pl: "bezinteresowny", ru: "бескорыстный", relation: derived }
etymology: "Из латинского interesse «быть между, иметь значение» через немецкое Interesse — то же слово, что русское «интерес», но значение в польском ушло в сторону «дела»."
memory: "interes — ложный друг: это прежде всего «дело, бизнес», а не «интерес» в смысле любопытства. Prowadzić interes значит «держать своё дело», robić interesy — «вести дела», jechać w interesach — «ехать по делам», а To nie twój interes — «Не твоё дело». Значение «выгода» тоже есть: w moim interesie «в моих интересах». А вот «интересно» будет ciekawe или interesujące — от глагола interesować."
idioms:
  - { pl: "to nie twój interes", ru: "не твоё дело" }
  - { pl: "robić interesy", ru: "вести дела" }
  - { pl: "w czyimś interesie", ru: "в чьих-либо интересах" }
