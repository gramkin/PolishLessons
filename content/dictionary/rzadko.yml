# review
id: rzadko
format: 2
lemma: "rzadko"
rank: 5904
pos: adv
pron: { cyr: "жа́тко" }
senses:
  - id: rarely
    ru: "редко"
    note: "о частоте"
    examples:
      - pl: "Mój dziadek rzadko wychodzi z domu."
        ru: "Мой дедушка редко выходит из дома."
        source: { kind: authored }
      - pl: "Nasz pies rzadko gryzie."
        ru: "Наша собака редко кусается."
        source: { kind: tatoeba, id: 610817 }
      - pl: "Rzadko mamy tu śnieg."
        ru: "У нас здесь редко бывает снег."
        source: { kind: tatoeba, id: 1479207 }
      - pl: "On rzadko chodzi do kościoła."
        ru: "Он редко ходит в церковь."
        source: { kind: tatoeba, id: 587522 }
  - id: sparsely
    ru: "редко, далеко друг от друга"
    note: "о расположении"
    examples:
      - pl: "Na tym polu drzewa rosną bardzo rzadko."
        ru: "На этом поле деревья растут очень редко."
        source: { kind: authored }
      - pl: "Domy stały rzadko, daleko od siebie."
        ru: "Дома стояли редко, далеко друг от друга."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Сравнительная степень — RZADZIEJ «реже» (DK чередуется с DZ), превосходная — NAJRZADZIEJ «реже всего». CORAZ RZADZIEJ — «всё реже»." }
  - { kind: usage, text: "Обороты: JAK RZADKO KTO «как мало кто», JAK RZADKO KIEDY «как редко когда», Z RZADKA «изредка». Антоним — CZĘSTO «часто»." }
  - { kind: pronunciation, text: "Читается «жа́тко»: RZ — «ж», D перед глухим K оглушается в «т». Польское RZ здесь на месте русского мягкого Р: rzadko — «редко»." }
collocations:
  - { pl: "bardzo rzadko", ru: "очень редко" }
  - { pl: "coraz rzadziej", ru: "всё реже" }
  - { pl: "rzadko kiedy", ru: "редко когда" }
family:
  - { pl: "rzadki", ru: "редкий", relation: derived, id: rzadki }
  - { pl: "rzadkość", ru: "редкость", relation: root }
  - { pl: "rzednąć", ru: "редеть", relation: root }
  - { pl: "często", ru: "часто", relation: antonym, id: czesto }
etymology: "От RZADKI «редкий». Праславянское *rědъkъ, отсюда же русское «редкий»; польское RZ возникло из мягкого Р перед древним Ě."
memory: "rzadko = редко: RZ — польский след мягкого Р. Rzadziej — реже, najrzadziej — реже всего."
idioms:
  - { pl: "jak rzadko kto", ru: "как мало кто" }
  - { pl: "jak rzadko kiedy", ru: "как редко когда, как никогда" }
  - { pl: "gdzie cię widzą rzadziej, tam cię mają radziej", ru: "где тебя реже видят, там тебе больше рады" }
formExamples:
