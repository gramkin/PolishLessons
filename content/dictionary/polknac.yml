id: polknac
format: 2
lemma: "połknąć"
rank: 4293
pos: verb
pron: { cyr: "по́укнонць" }
senses:
  - id: swallow
    ru: "проглотить"
    examples:
      - pl: "Połknął tabletkę bez wody."
        ru: "Он проглотил таблетку без воды."
        source: { kind: authored }
      - pl: "Pies połknął skarpetkę."
        ru: "Собака проглотила носок."
        source: { kind: authored }
      - pl: "Dziecko połknęło monetę."
        ru: "Ребёнок проглотил монету."
        source: { kind: authored }
  - id: devour
    ru: "перен. проглотить (книгу, обиду)"
    examples:
      - pl: "Połknęła książkę w jeden wieczór."
        ru: "Она проглотила книгу за один вечер."
        source: { kind: authored }
      - pl: "Trudno połknąć taką zniewagę."
        ru: "Трудно проглотить такое оскорбление."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "POŁKNĄĆ — «проглотить». Не путать с ŁYKNĄĆ — «глотнуть, отпить»: ŁYKNĄĆ KAWY. «Поглотить» о компании — WCHŁONĄĆ, хотя и POŁKNĄĆ так тоже говорят." }
  - { kind: usage, text: "Пятьдесят две формы: страдательное POŁKNIĘTY — о таблетках, костях, монетах; форма для мужчин-людей POŁKNIĘCI в карточку не включена. Будущее: POŁKNĘ, POŁKNIESZ, повелительное POŁKNIJ. Несовершенный вид — POŁYKAĆ." }
  - { kind: government, text: "Что — винительный: POŁKNĄĆ TABLETKĘ, POŁKNĄĆ OŚĆ. Чем запить — другой глагол: POPIĆ WODĄ. Переносно — POŁKNĄĆ DUMĘ «смирить гордость», POŁKNĄĆ ŁZY «сдержать слёзы»." }
  - { kind: pronunciation, text: "Читается «по́укнонць»: Ł — «у», конечное ĄĆ — «онць», ударение на первом слоге. POŁKNĘ — «по́укнэ», POŁKNIĘTY — «поукне́нты»." }
  - { kind: register, text: "Нейтральное слово. POŁKNĄĆ KSIĄŻKĘ — разговорное «проглотить книгу». POŁKNĄĆ BAKCYLA — разговорное «заразиться увлечением»." }
collocations:
  - { pl: "połknąć tabletkę", ru: "проглотить таблетку" }
  - { pl: "połknąć książkę", ru: "проглотить книгу" }
  - { pl: "połknąć dumę", ru: "смирить гордость" }
family:
  - { pl: "łykać", ru: "глотать", relation: root }
  - { pl: "łyk", ru: "глоток", relation: derived }
  - { pl: "połykać", ru: "проглатывать", relation: aspect }
etymology: "Приставка PO- плюс корень ŁYK- «глотать», праславянское *lykati; отсюда же ŁYK «глоток». Русское «глотать» — другой корень."
memory: "Połknąć — проглотить: połknął tabletkę. Połknąć książkę — проглотить книгу. Połknąć bakcyla — заразиться увлечением. Читается «по́укнонць»."
idioms:
  - { pl: "połknąć bakcyla", ru: "подцепить вирус увлечения, «заболеть» чем-то" }
formExamplesSkip:
  - { form: "połknięci", reason: "людей обычно не глотают: формы для мужчин-людей нет" }
