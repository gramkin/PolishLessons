# review
id: mowic
format: 2
lemma: "mówić"
rank: 39
pos: verb
aspect: imperf
aspectPair: powiedziec
pron: { cyr: "му́виць" }
senses:
  - id: speak
    ru: "говорить (на языке), уметь говорить"
    examples:
      - pl: "Mówię po angielsku."
        ru: "Я говорю по-английски."
        source: { kind: tatoeba, id: 535134 }
      - pl: "Mówisz po polsku?"
        ru: "Ты говоришь по-польски?"
        source: { kind: tatoeba, id: 4744563 }
      - pl: "Dobrze mówi."
        ru: "Он хорошо говорит."
        source: { kind: tatoeba, id: 610651 }
  - id: tell
    ru: "говорить, рассказывать кому-л."
    examples:
      - pl: "Możesz mówić."
        ru: "Ты можешь говорить."
        source: { kind: tatoeba, id: 13785926 }
      - pl: "Mówiłem mu już o tym."
        ru: "Я ему уже говорил об этом."
        source: { kind: tatoeba, id: 6137538 }
notes:
  - { kind: government, text: "mówić po polsku «говорить по-польски», mówić o czymś «говорить о чём-то», mówić do kogoś «обращаться к кому-то»." }
  - { kind: usage, text: "Видовая пара: mówić «говорить» — powiedzieć «сказать»." }
collocations:
  - { pl: "mówić po polsku", ru: "говорить по-польски" }
  - { pl: "szczerze mówiąc", ru: "честно говоря" }
  - { pl: "mówić prawdę", ru: "говорить правду" }
etymology: "Праславянское *mъlviti «говорить» — то же слово, что русское «молвить»; отсюда же «молва»."
memory: "Русская зацепка — «молвить» и «молва». Управление знакомое: mówić po polsku «говорить по-польски», mówić o czymś «говорить о чём-то». Совершенный вид берётся от другого корня: powiedzieć."
idioms:
  - { pl: "szczerze mówiąc", ru: "честно говоря" }
  - { pl: "mówić jak do ściany", ru: "говорить как об стену" }
  - { pl: "mówić do rzeczy", ru: "говорить по делу" }
