# review
id: wielebny
format: 2
lemma: "wielebny"
rank: 3905
pos: adj
pron: { cyr: "веле́бны" }
senses:
  - id: reverend
    ru: "преподобный (титул священника)"
    examples:
      - pl: "Wielebny ojciec odprawił mszę."
        ru: "Преподобный отец отслужил мессу."
        source: { kind: authored }
      - pl: "Wielebny Kowalski przyjedzie jutro."
        ru: "Преподобный Ковальский приедет завтра."
        source: { kind: authored }
      - pl: "Proszę wybaczyć, wielebny ojcze."
        ru: "Простите, преподобный отец."
        source: { kind: authored }
  - id: venerable
    ru: "почтенный, достопочтенный (устар., ирон.)"
    examples:
      - pl: "Wielebna matka przełożona wezwała nowicjuszkę."
        ru: "Почтенная мать-настоятельница вызвала послушницу."
        source: { kind: authored }
      - pl: "Wielebne grono profesorów zasiadło przy stole."
        ru: "Почтенный круг профессоров уселся за стол."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "WIELEBNY — не «великий» и не «великолепный», хотя корень WIEL- знаком: великий — WIELKI, великолепный — WSPANIAŁY. WIELEBNY — церковный титул, «преподобный»: WIELEBNY OJCIEC, WIELEBNA MATKO. Русское «преподобный» о святом монахе — по-польски обычно ŚWIĘTY, не WIELEBNY." }
  - { kind: usage, text: "Одиннадцать форм без степеней: титул не сравнивают. Для мужчин-людей — главная форма множественного: WIELEBNI OJCOWIE. В обращении — звательный от существительного: WIELEBNY OJCZE, WIELEBNA MATKO. О протестантском пасторе в переводах с английского: WIELEBNY JOHNSON." }
  - { kind: government, text: "Стоит перед титулом или фамилией: WIELEBNY KSIĄDZ, WIELEBNY KOWALSKI. В письмах — с большой буквы: WIELEBNY KSIĘŻE. Католического священника в быту зовут PROSZĘ KSIĘDZA, и WIELEBNY тут не нужен." }
  - { kind: pronunciation, text: "Читается «веле́бны», три слога, ударение на предпоследнем. IE после W — «ве», L перед E — «ле», B перед N звонкое." }
  - { kind: register, text: "Книжный и торжественный титул, частый в переводной литературе и кино. В шутку — о чём-то важном и старом: WIELEBNE GRONO, «почтенное собрание». В живой речи о священнике говорят KSIĄDZ." }
collocations:
  - { pl: "wielebny ojciec", ru: "преподобный отец" }
  - { pl: "wielebna matka", ru: "преподобная мать (настоятельница)" }
  - { pl: "wielebne grono", ru: "почтенное собрание (ирон.)" }
family:
  - { pl: "wielki", ru: "великий, большой", relation: root, id: wielki }
  - { pl: "przewielebny", ru: "высокопреподобный", relation: derived }
  - { pl: "ksiądz", ru: "ксёндз, священник", relation: root }
etymology: "От старопольского WIELEBIĆ «почитать, восхвалять», с корнем WIEL- «великий». Буквально «тот, кого величают»; ср. русское «величать»."
memory: "Wielebny — преподобный, церковный титул: wielebny ojciec, wielebna matko. Не wielki — великий. Как «величать»: тот, кого величают. Читается «веле́бны»."
idioms:
