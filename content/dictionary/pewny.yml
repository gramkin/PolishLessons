# review
id: pewny
format: 2
lemma: "pewny"
rank: 129
pos: adj
pron: { cyr: "пэ́вны" }
senses:
  - id: sure
    ru: "уверенный (в чём-либо); надёжный, верный"
    examples:
      - pl: "Jesteś pewna?"
        ru: "Ты уверена?"
        source: { kind: tatoeba, id: 532870 }
      - pl: "Czy jesteś pewien?"
        ru: "Ты уверен?"
        source: { kind: tatoeba, id: 6327965 }
      - pl: "Jestem prawie pewien."
        ru: "Я почти уверен."
        source: { kind: tatoeba, id: 4735336 }
  - id: certain
    ru: "некий, некоторый (pewien + существительное)"
    note: "В этом значении обычно стоит краткая форма pewien: pewien człowiek «некий человек»."
    examples:
      - pl: "Spotkamy się pewnego dnia."
        ru: "Когда-нибудь мы увидимся снова."
        source: { kind: tatoeba, id: 1354337 }
      - pl: "Pewien człowiek czekał przed domem."
        ru: "Некий человек ждал перед домом."
        source: { kind: authored }
      - pl: "W pewnym sensie masz rację."
        ru: "В некотором смысле ты прав."
        source: { kind: authored }
notes:
  - { kind: usage, text: "В мужском роде именительного падежа две формы: jestem pewien и jestem pewny. Первая частотнее в значении «уверен», вторая — в значении «надёжный»." }
  - { kind: false-friend, text: "Наречие pewnie в разговоре значит «наверное», а не «уверенно»: Pewnie przyjdzie «Наверное, придёт». «Наверняка» — na pewno." }
  - { kind: government, text: "Уверенность в чём-либо передаётся родительным падежом: Jestem pewien swojej racji «Я уверен в своей правоте»." }
collocations:
  - { pl: "jestem pewien", ru: "я уверен" }
  - { pl: "na pewno", ru: "наверняка" }
  - { pl: "pewnego dnia", ru: "однажды" }
  - { pl: "pewny siebie", ru: "уверенный в себе" }
etymology: "Праславянское *pьvьnъ от *pьvati «доверять, уповать»; в русском от этого корня осталось книжное «уповать»."
memory: "Два лица одного слова: jestem pewien «я уверен» и pewien człowiek «некий человек». И держите в голове пару pewnie «наверное» — na pewno «наверняка»: они не синонимы."
idioms:
  - { pl: "pewny siebie", ru: "уверенный в себе" }
  - { pl: "na pewno", ru: "наверняка" }
  - { pl: "pewne jak w banku", ru: "верное дело" }
