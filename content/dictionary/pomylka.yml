# review
id: pomylka
format: 2
lemma: "pomyłka"
rank: 1690
pos: noun
pron: { cyr: "помы́ука" }
senses:
  - id: mistake
    ru: "ошибка"
    examples:
      - pl: "Pomyłka!"
        ru: "Ошибка!"
        source: { kind: translated, id: 11261869 }
      - pl: "To nie jest pomyłka."
        ru: "Это не ошибка."
        source: { kind: translated, id: 1410289 }
      - pl: "Tom nie wiedział, że to była pomyłka."
        ru: "Том не знал, что это была ошибка."
        source: { kind: translated, id: 4359730 }
  - id: by-mistake
    ru: "przez pomyłkę — по ошибке"
    examples:
      - pl: "Przez pomyłkę wziąłem twój parasol."
        ru: "Я по ошибке взял твой зонт."
        source: { kind: tatoeba, id: 353197 }
      - pl: "Ktoś przez pomyłkę włożył moje buty."
        ru: "Кто-то по ошибке взял мои туфли."
        source: { kind: tatoeba, id: 1834116 }
      - pl: "Uderzył mnie przez pomyłkę."
        ru: "Он ударил меня по ошибке."
        source: { kind: translated, id: 933078 }
notes:
  - { kind: usage, text: "przez pomyłkę — «по ошибке», застывший оборот с винительным падежом: Przez pomyłkę wziąłem twój parasol «Я по ошибке взял твой зонт»." }
  - { kind: false-friend, text: "Различайте pomyłka «ошибка по невнимательности» и błąd «ошибка» вообще, в том числе в знаниях: błąd gramatyczny «грамматическая ошибка», но przez pomyłkę «по ошибке»." }
  - { kind: usage, text: "Второе значение — «не туда попали» по телефону: Przepraszam, to pomyłka «Извините, я ошибся номером»." }
  - { kind: usage, text: "Глагол — pomylić się «ошибиться»: pomyliłem się «я ошибся»." }
collocations:
  - { pl: "przez pomyłkę", ru: "по ошибке" }
  - { pl: "to pomyłka", ru: "это ошибка" }
  - { pl: "popełnić pomyłkę", ru: "совершить ошибку" }
etymology: "От pomylić się «ошибиться», от mylić «путать». Русское «ошибка» идёт от «ошибиться, шибать» — другой корень, но оба языка строят слово от глагола."
memory: "pomyłka = «ошибка», прежде всего по невнимательности. Главный оборот — przez pomyłkę «по ошибке». Для ошибки в знаниях чаще говорят błąd: błąd gramatyczny."
idioms:
