notes:
  - { kind: pronunciation, text: "Это слово показывает правило ó и o нагляднее прочих. В закрытом слоге пишется ó: WZÓR и родительный множественного WZORÓW. В открытом — обычное o: wzo-ru, wzo-rze, wzo-ry, wzo-rom. Правило простое: ó появляется там, где слог закрыт согласным, и исчезает, как только за ним открывается гласная. Окончание -ów, кстати, всегда с ó." }
  - { kind: false-friend, text: "WZÓR и русский «взор» — одно праславянское слово *vъzorъ, от корня «зреть, смотреть». Но смысл разошёлся: польское wzór означает образец, узор или формулу, а наш «взор» остался взглядом. Ближе всего по значению русское «узор», и оно из того же гнезда. Сказать по-польски «wzór pełen smutku» о взгляде нельзя, там нужно SPOJRZENIE." }
collocations:
  - { pl: "wzór matematyczny", ru: "математическая формула" }
  - { pl: "brać z kogoś wzór", ru: "брать с кого-то пример" }
  - { pl: "wzór do naśladowania", ru: "образец для подражания" }
family:
  - { pl: "wzorowy", ru: "образцовый", relation: derived }
  - { pl: "wzorzec", ru: "эталон", relation: derived }
  - { pl: "wzorować się", ru: "брать пример", relation: derived }
etymology: "Из праславянского *vъzorъ: приставка vъz- «вз-» и корень *zьr- «зреть, смотреть». Буквально это «то, на что смотрят». Русский оставил «взор» при взгляде, а польский перенёс слово на то, что разглядывают и повторяют: на образец, узор и формулу. Наш «узор» собран из того же корня с другой приставкой и значением совпал с польским почти точно."
memory: "ó в закрытом слоге: wzór, wzorów. o в открытом: wzoru, wzorze, wzory. И это не «взор», а образец или узор."
idioms:
  - { pl: "brać z kogoś wzór", ru: "брать с кого-то пример" }
  - { pl: "wzór do naśladowania", ru: "образец для подражания" }
