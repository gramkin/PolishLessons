# review
id: spacer
format: 2
lemma: "spacer"
rank: 2200
pos: noun
pron: { cyr: "спа́цэр" }
senses:
  - id: walk
    ru: "прогулка"
    examples:
      - pl: "Poszli na spacer po kolacji."
        ru: "Они пошли на прогулку после ужина."
        source: { kind: authored }
      - pl: "Codzienny spacer dobrze robi na serce."
        ru: "Ежедневная прогулка полезна для сердца."
        source: { kind: authored }
  - id: on-foot
    ru: "spacerem — пешком"
    examples:
      - pl: "Do centrum idziemy spacerem."
        ru: "В центр мы идём пешком."
        source: { kind: authored }
      - pl: "Wrócił spacerem, bo zgubił bilet."
        ru: "Он вернулся пешком, потому что потерял билет."
        source: { kind: authored }
      - pl: "Na spacerze spotkali całą rodzinę sąsiadów."
        ru: "На прогулке они встретили всю семью соседей."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Прозрачного русского родственника нет: «прогулка» идёт от «гулять», совсем другой корень. Польское слово пришло из немецкого spazieren, а туда — из итальянского. Самую частую фразу стоит запомнить целиком: iść na spacer «идти гулять», pójść na spacer, wybrać się na spacer." }
  - { kind: pronunciation, text: "ЛОВУШКА В ПРЕДЛОЖНОМ ПАДЕЖЕ. r переходит в rz: spacer, но na spacerze — «на спаце́жэ». То же чередование, что rozmiar → o rozmiarze и aktor → o aktorze. В именительном ударение на первом слоге, «спа́цэр», а в предложном уезжает вправо." }
  - { kind: usage, text: "Творительный падеж spacerem работает как наречие и значит «пешком»: iść spacerem, wrócić spacerem. Глагол spacerować значит «гулять, прогуливаться», а spacerniak — разговорное название тюремного прогулочного двора." }
collocations:
  - { pl: "iść na spacer", ru: "идти на прогулку" }
  - { pl: "wieczorny spacer", ru: "вечерняя прогулка" }
  - { pl: "wrócić spacerem", ru: "вернуться пешком" }
family:
  - { pl: "spacerować", ru: "гулять, прогуливаться", relation: derived }
  - { pl: "spacerowy", ru: "прогулочный", relation: derived }
etymology: "Из немецкого spazieren «прогуливаться», а туда — из итальянского spaziare, от латинского spatiari «ходить, расхаживать», от spatium «пространство». Русская «прогулка» построена от другого корня, опереться не на что. Отсюда spacerować, spacerowy и spacerniak."
memory: "spacer — «прогулка», родства с русским словом нет, зато фраза запоминается сразу: iść na spacer. Предложный падеж с переходом r в rz: na spacerze, как aktor даёт o aktorze. А spacerem значит «пешком»."
idioms:
  - { pl: "iść na spacer", ru: "идти на прогулку" }
  - { pl: "wrócić spacerem", ru: "вернуться пешком" }
