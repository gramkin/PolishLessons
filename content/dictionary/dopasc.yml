id: dopasc
format: 2
lemma: "dopaść"
rank: 2014
pos: verb
pron: { cyr: "до́пасьць" }
senses:
  - id: catch-up
    ru: "догнать, настигнуть, поймать"
    examples:
      - pl: "Dopadli go na granicy po trzech dniach."
        ru: "Его настигли на границе через три дня."
        source: { kind: authored }
      - pl: "Policja dopadła sprawcę w nocy."
        ru: "Полиция настигла преступника ночью."
        source: { kind: authored }
      - pl: "Został dopadnięty w porcie."
        ru: "Его настигли в порту."
        source: { kind: authored }
  - id: reach-lunge
    ru: "дорваться, добраться (до чего-то)"
    examples:
      - pl: "Dopadł do telefonu i zadzwonił po pomoc."
        ru: "Он дорвался до телефона и позвонил за помощью."
        source: { kind: authored }
      - pl: "Dzieci dopadły do stołu, zanim ktokolwiek usiadł."
        ru: "Дети дорвались до стола, прежде чем кто-либо сел."
        source: { kind: authored }
  - id: overtake-illness
    ru: "настигнуть (о болезни, тоске, усталости)"
    examples:
      - pl: "Dopadła go grypa w samym środku sesji."
        ru: "Его настиг грипп в самый разгар сессии."
        source: { kind: authored }
      - pl: "Pod wieczór dopadło ją zmęczenie."
        ru: "К вечеру её настигла усталость."
        source: { kind: authored }
  - id: graze-finish
    ru: "докормить скот на выпасе — другой глагол с тем же инфинитивом"
    examples:
      - pl: "Dopaśli bydło przed pierwszym śniegiem."
        ru: "Они докормили скот на выпасе до первого снега."
        source: { kind: authored }
      - pl: "Owce dopasione na ściernisku wróciły syte."
        ru: "Овцы, докормленные на стерне, вернулись сытыми."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Пятый член семьи и устроен как NAPAŚĆ: основа DOPADN-/DOPAD- значит «догнать, настигнуть», основа DOPAS- значит «докормить скот на выпасе». Первый глагол переходный, поэтому у него полный ряд страдательных причастий DOPADNIĘTY и 53 формы, как у NAPAŚĆ, а не 42, как у непереходных UPAŚĆ и WYPAŚĆ. Внутри первого глагола три значения: догнать человека, дорваться до вещи и — о болезни или чувстве — свалиться на человека." }
  - { kind: government, text: "Здесь самое важное на карточке, потому что управление различает значения. Догнать человека — винительный падеж без предлога: DOPADŁA GO POLICJA, DOPADLI ZŁODZIEJA. Дорваться до вещи — предлог DO с родительным: DOPAŚĆ DO TELEFONU, DOPAŚĆ DO DRZWI. Сравните с NAPAŚĆ из прошлой партии, которая берёт NA с винительным: NAPAŚĆ NA KOGOŚ. Три родственных глагола, три разных предлога — их стоит заучивать не по отдельности, а парами с управлением." }
  - { kind: pronunciation, text: "Читается «до́пасьць», ударение на приставке, как у всех двусложных глаголов этой семьи: «у́пасьць», «вы́пасьць», «пше́пасьць», «на́пасьць», «до́пасьць». Повелительное наклонение различает два глагола: DOPADNIJ против DOPAŚ. Причастие DOPADNIĘTY звучит «допадне́нты», с носовой ę перед t, а деепричастие DOPADŁSZY — «допа́душы», где ł читается как «у»." }
  - { kind: false-friend, text: "Русского «допасть» не существует, поэтому прямого ложного друга нет, но есть ловушка перевода. Третье значение по-русски требует смены подлежащего: DOPADŁA GO GRYPA буквально «грипп догнал его», и по-русски так и говорят — «его настиг грипп», — а вот калька «грипп допал его» невозможна. Ещё одно: DOPADAĆ в несовершенном виде часто значит «добираться, дорываться» и о чувствах, и оттенок у него навязчивый, почти угрожающий: WSPOMNIENIA DOPADAJĄ GO NOCAMI." }
  - { kind: false-friend, text: "Отдельная ловушка внутри польского, и она близкая. DOPASIONY значит «докормленный на выпасе» и идёт от глагола выпаса. А DOPASOWANY значит «подогнанный, прилаженный» и идёт от совсем другого глагола, DOPASOWAĆ. Слова различаются одним сочетанием букв, но родства между ними нет никакого: одно о скоте, другое о деталях и одежде. По-русски это «докормленный» и «подогнанный». Если в тексте речь о размере или форме, нужное слово DOPASOWANY, а DOPASIONY там будет ошибкой." }
collocations:
  - { pl: "dopaść kogoś", ru: "настигнуть кого-то" }
  - { pl: "dopaść do telefonu", ru: "дорваться до телефона" }
