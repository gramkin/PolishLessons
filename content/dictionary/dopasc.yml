family:
  - { pl: "paść", ru: "пасть, упасть; пасти", relation: root, id: pasc }
  - { pl: "napaść", ru: "напасть; напасти", relation: root, id: napasc }
  - { pl: "dopadać", ru: "настигать; дорываться", relation: aspect }
  - { pl: "upaść", ru: "упасть; откормить", relation: root, id: upasc }
etymology: "Та же пара праславянских корней, что во всей семье: *pad-ti «падать» и *pas-ti «пасти», давшие одно польское -ŚĆ. Приставка DO- отвечает русскому «до-» и несёт идею достижения предела: догнать — значит падать вслед, пока не достигнешь. Отсюда и управление: с предлогом DO, который этимологически та же приставка, оторвавшаяся и ставшая самостоятельным словом, — поэтому DOPAŚĆ DO DRZWI содержит до- дважды, в приставке и в предлоге. Для глагола выпаса та же приставка означает доведение до конца: докормить скот до нужного состояния, как в русском «докормить», «допасти»."
memory: "Пятый в семье: dopadn- «настигнуть», dopas- «докормить». Переходный, отсюда dopadnięty и 53 формы. Управление различает смысл: человека — винительным без предлога (dopadła go policja), вещь — через DO (dopaść DO telefonu). Ударение на приставке, «до́пасьць»."
idioms:
  - { pl: "dopaść do telefonu", ru: "дорваться до телефона" }
  - { pl: "dopadła go grypa", ru: "его настиг грипп" }
  - { pl: "wspomnienia go dopadają", ru: "воспоминания его настигают" }
