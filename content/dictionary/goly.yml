etymology: "Праславянское слово, то же, что русское «голый», и значение за тысячу лет почти не сдвинулось. Разошлись только производные и переносные смыслы. Польский добавил разговорное «без денег», русский того же хода не сделал, зато завёл «голь» и «голытьбу», которых нет у поляков. Буква Ł на месте русского «л» — обычное соответствие для этого корня, и читается она «у», так что на слух родство слышно хуже, чем видно на письме."
memory: "Корень тот же, что в русском «голом», но писать и читать надо врозь: goły звучит «го́уы», потому что ł это «у», а не «л». В мужско-личной форме ł переходит в l: goli, как miły — mili. Разговорное значение русскому незнакомо: jestem goły значит «я на мели», а не «я раздет». Главный оборот gołym okiem «невооружённым глазом». Для «голой правды» поляк возьмёт другое слово, naga prawda."
idioms:
  - { pl: "gołym okiem", ru: "невооружённым глазом" }
