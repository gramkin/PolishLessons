notes:
  - { kind: false-friend, text: "Корень общий, и GOŁY это русское «голый» во всех прямых смыслах. Но у польского слова есть разговорное значение, которого русский не знает: «без денег, на мели». JESTEM GOŁY значит не «я раздет», а «я без гроша». Рядом живёт NAGI, тоже «голый», но книжное и торжественное: NAGA PRAWDA «голая правда», NAGIE FAKTY. Там, где по-русски «голая правда», поляк скажет NAGA, а не GOŁA." }
  - { kind: usage, text: "Одиннадцать форм. В мужско-личной форме множественного числа Ł переходит в L и исчезает на слух: GOŁY, но GOLI. То же чередование в MIŁY — MILI «милые» и в BIAŁY — BIALI «белые», и запомнить его стоит сразу для всего разряда. Кроме того, GOLI свободно работает как существительное: PO WYPŁACIE WSZYSCY SĄ GOLI. Степени сравнения у слова есть, но в ходу редко." }
  - { kind: government, text: "Невооружённым глазом — творительный без предлога: GOŁYM OKIEM, и русский строит оборот так же. Голыми руками — GOŁYMI RĘKAMI, снова творительный множественного. На голой земле — предлог NA с местным падежом: NA GOŁEJ ZIEMI. Прилагательное в этих оборотах, в отличие от относительных, стоит перед существительным, потому что оно качественное." }
  - { kind: pronunciation, text: "Читается «го́уы», два слога, ударение на первом. Буква Ł даёт «у», а не «л»: это главное правило польского произношения для русского уха, и здесь оно слышно особенно отчётливо, потому что русский родственник соблазняет сказать «голы». В мужско-личной форме GOLI буква уже обычная L, и слово звучит «го́ли». В творительном GOŁYM слышно «го́уым», в GOŁYMI — «го́уыми»." }
  - { kind: register, text: "Прямое значение нейтральное: GOŁE ŚCIANY «голые стены», GOŁE DRZEWA «голые деревья», GOŁE FAKTY «голые факты». Разговорное значение про деньги частое и совершенно обиходное, без грубости: JESTEM GOŁY JAK ŚWIĘTY TURECKI — поговорка с тем же смыслом, «гол как сокол». Оборот GOŁYM OKIEM нейтрален и встречается и в науке, и в быту: WIDAĆ GOŁYM OKIEM «видно невооружённым глазом»." }
