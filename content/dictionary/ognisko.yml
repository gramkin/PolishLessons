etymology: "От OGIEŃ «огонь», от праславянского *ognь, то есть от того же слова, что русский «огонь», с суффиксом -ISKO, обозначающим место. Буквально «огнище», и такое слово в русских говорах есть, но в литературном языке для той же вещи закрепился «очаг», заимствованный из турецкого OCAK. Получилось, что поляк называет очаг своим словом от огня, а русский чужим, хотя слово «огонь» у него то же самое. Суффикс -ISKO работает широко: BOISKO «игровое поле», LOTNISKO «аэродром», MROWISKO «муравейник»."
memory: "Понятие общее, а слово своё: ognisko это ogień «огонь» плюс суффикс -isko «место», буквально «огнище», тогда как русский «очаг» заимствован из турецкого. Три значения: костёр, домашний очаг, очаг болезни, и все одинаково живые. Суффикс -isko стоит запомнить отдельно, он означает место: boisko, lotnisko, mrowisko. Поправить предлог: przy ognisku с местным падежом, где русский говорит «у костра» с родительным. Читается «огни́ско»."
