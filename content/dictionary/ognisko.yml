notes:
  - { kind: false-friend, text: "Понятие совпадает с русским, а материал слова нет, и это стоит знать. Русский «очаг» — заимствование из турецкого, а польское OGNISKO построено из своего: OGIEŃ «огонь» плюс суффикс -ISKO, который делает названия мест. То есть буквально «место огня». Поэтому OGNISKO DOMOWE значит «домашний очаг», OGNISKO ZAPALNE — «очаг воспаления», а третье значение, костёр, русскому надо запоминать отдельно, потому что «костёр» в русском слово другого корня." }
  - { kind: usage, text: "Восемь форм, средний род, родительный множественного OGNISK без окончания. Все три значения живут полноценно, и переносное медицинское не реже прямого: OGNISKO ZAPALNE, OGNISKO CHOROBY, OGNISKO EPIDEMII. Суффикс -ISKO здесь тот же, что в BOISKO «поле», LOTNISKO «аэропорт», MROWISKO «муравейник»: он всюду означает место, где что-то происходит или находится. Запомнив суффикс, эти слова можно разбирать сразу." }
  - { kind: government, text: "Жечь костёр — PALIĆ OGNISKO, винительный. У костра — PRZY OGNISKU, предлог PRZY с местным падежом, и русский ставит здесь предлог «у» с родительным, так что конструкцию надо менять. Очаг чего — родительный без предлога: OGNISKO CHOROBY, OGNISKO EPIDEMII, как и по-русски. Разжечь — ROZPALIĆ OGNISKO, а потушить — ZGASIĆ OGNISKO, оба с винительным." }
  - { kind: pronunciation, text: "Читается «огни́ско», три слога, ударение на втором. Сочетание GN звучит слитно, «гн», без гласной между согласными. Буква I после N только знак мягкости, поэтому слышно «ни», а не «ний». Конечное O чистое. В слове OGIEŃ, от которого образовано, слышно «о́гень», с мягким «нь» на конце, и это полезно сравнить: там Ń, а здесь обычное N." }
  - { kind: register, text: "Слово нейтральное и частое во всех трёх значениях. Частые обороты: PALIĆ OGNISKO «жечь костёр», PRZY OGNISKU «у костра», OGNISKO DOMOWE «домашний очаг», OGNISKO ZAPALNE «очаг воспаления». Отдельно стоит школьное значение: OGNISKO MUZYCZNE — это музыкальная школа при доме культуры, а OGNISKO HARCERSKIE — сбор у костра у скаутов. Прилагательное OGNISKOWY значит «очаговый» и «фокусный»: ODLEGŁOŚĆ OGNISKOWA «фокусное расстояние»." }
