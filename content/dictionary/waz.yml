id: waz
format: 2
lemma: "wąż"
rank: 1983
pos: noun
pron: { cyr: "вонш" }
senses:
  - id: snake
    ru: "змея"
    examples:
      - pl: "Wąż syczy."
        ru: "Змея шипит."
        source: { kind: translated, id: 6170140 }
      - pl: "Wąż mnie ukąsił."
        ru: "Меня укусила змея."
        source: { kind: translated, id: 6441638 }
      - pl: "Wąż zmienił skórę."
        ru: "Змея сменила кожу."
        source: { kind: translated, id: 357238 }
      - pl: "Wąż pełznie przez pustynię."
        ru: "Змея ползёт через пустыню."
        source: { kind: tatoeba, id: 12692269 }
      - pl: "Węże to gady."
        ru: "Змеи — пресмыкающиеся."
        source: { kind: translated, id: 6170139 }
      - pl: "Niektóre węże są jadowite."
        ru: "Некоторые змеи ядовиты."
        source: { kind: tatoeba, id: 360468 }
  - id: fear-snakes
    ru: "о страхе перед змеями"
    examples:
      - pl: "Boję się węży."
        ru: "Я боюсь змей."
        source: { kind: translated, id: 13459512 }
      - pl: "On boi się węży."
        ru: "Он боится змей."
        source: { kind: translated, id: 525999 }
      - pl: "On zupełnie nie boi się węży."
        ru: "Он совсем не боится змей."
        source: { kind: tatoeba, id: 363822 }
  - id: hose
    ru: "шланг"
    examples:
      - pl: "Potrzebujemy węża ogrodowego."
        ru: "Нам нужен садовый шланг."
        source: { kind: translated, id: 5966618 }
      - pl: "Fred spryskał Billy'ego wężem ogrodowym."
        ru: "Фред обрызгал Билли садовым шлангом."
        source: { kind: tatoeba, id: 11252524 }
notes:
  - { kind: usage, text: "Второе значение — «шланг»: wąż ogrodowy «садовый шланг». Русское «шланг» и «змея» — разные слова, а польский обходится одним." }
  - { kind: pronunciation, text: "Носовой ą перед ż читается как «он»: wąż ≈ «вонш», с оглушением конечного ż." }
  - { kind: usage, text: "В косвенных падежах ą чередуется с ę: wąż, но węża, wężem, węży." }
  - { kind: usage, text: "Оборот mieć węża w kieszeni значит «быть скупым», буквально «держать змею в кармане»." }
  - { kind: government, text: "При склонении ą переходит в ę: wąż, ale węża, wężowi, wężem. То же чередование, что в mąż и męża." }
collocations:
  - { pl: "bać się węży", ru: "бояться змей" }
  - { pl: "wąż ogrodowy", ru: "садовый шланг" }
  - { pl: "jadowity wąż", ru: "ядовитая змея" }
etymology: "Праславянское *ǫžь, того же корня, что русский «уж» — неядовитая змея. Русское «змея» происходит от другого корня, поэтому польское слово узнаётся не сразу."
memory: "wąż — «змея», и заодно «шланг»: wąż ogrodowy. В косвенных падежах ą меняется на ę: węża, wężem, węży."
idioms:
  - { pl: "bać się węży", ru: "бояться змей" }
  - { pl: "wąż ogrodowy", ru: "садовый шланг" }
  - { pl: "mieć węża w kieszeni", ru: "быть скупым" }
formExamplesSkip:
