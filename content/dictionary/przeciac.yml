# review
id: przeciac
format: 2
lemma: "przeciąć"
rank: 5295
pos: verb
pron: { cyr: "пшэ́цёнць" }
senses:
  - id: cut-through
    ru: "разрезать, перерезать"
    examples:
      - pl: "Przetnij sznurek nożyczkami."
        ru: "Перережь верёвку ножницами."
        source: { kind: authored }
      - pl: "Burmistrz przeciął wstęgę."
        ru: "Мэр перерезал ленточку."
        source: { kind: authored }
      - pl: "Przeciął jabłko na pół."
        ru: "Он разрезал яблоко пополам."
        source: { kind: authored }
  - id: cross
    ru: "пересечь; пресечь (спор, слухи)"
    examples:
      - pl: "Nasze drogi się przecięły w Paryżu."
        ru: "Наши пути пересеклись в Париже."
        source: { kind: authored }
      - pl: "Szef przeciął dyskusję jednym zdaniem."
        ru: "Шеф пресёк дискуссию одной фразой."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "PRZECIĄĆ — «перерезать, разрезать»: PRZECIĄĆ SZNUR, WSTĘGĘ. А ещё «пересечь»: NASZE DROGI SIĘ PRZECIĘŁY, «наши пути пересеклись», и «пресечь»: PRZECIĄĆ PLOTKI. От этого глагола — прилагательное PRZECIĘTNY, «средний», буквально «рассечённый пополам»." }
  - { kind: usage, text: "Пятьдесят две формы: страдательное PRZECIĘTY — о вещах, «разрезанный»; форма для мужчин-людей PRZECIĘCI в карточку не включена. Спряжение нерегулярное: PRZETNĘ, PRZETNIESZ, PRZETNĄ; повелительное PRZETNIJ; прошедшее PRZECIĄŁ, PRZECIĘŁA. Видовой партнёр — PRZECINAĆ." }
  - { kind: government, text: "Что — винительный, чем — творительный: PRZECIĄĆ KABEL NOŻEM. На что — NA с винительным: NA PÓŁ, NA KAWAŁKI. Возвратное PRZECIĄĆ SIĘ — «пересечься»: LINIE SIĘ PRZECINAJĄ." }
  - { kind: pronunciation, text: "Читается «пшэ́цёнць», два слога, ударение на первом. PRZE — «пшэ», CIĄ — «цён», Ć — «ць». PRZETNĘ — «пшэ́тнэ», PRZECIĄŁ — «пшэ́цёу»." }
  - { kind: register, text: "Нейтральное слово. PRZECIĄĆ WSTĘGĘ — «торжественно открыть». Книжное PRZECIĄĆ SPEKULACJE — «положить конец домыслам». В геометрии PRZECIĘCIE — «пересечение»." }
collocations:
  - { pl: "przeciąć wstęgę", ru: "перерезать ленточку" }
  - { pl: "przeciąć na pół", ru: "разрезать пополам" }
  - { pl: "przeciąć plotki", ru: "пресечь слухи" }
family:
  - { pl: "przecinać", ru: "разрезать, пересекать", relation: aspect }
  - { pl: "ciąć", ru: "резать", relation: root, id: ciac }
  - { pl: "przeciętny", ru: "средний, обычный", relation: derived, id: przecietny }
etymology: "Приставка PRZE- «пере-» плюс CIĄĆ «резать», праславянское *tęti «рубить». В русском этот глагол не сохранился; в польском от него целое гнездо: CIĄĆ, PRZECINAĆ, PRZECIĘTNY."
memory: "Przeciąć — перерезать: sznurek, wstęgę, na pół. Drogi się przecięły — пути пересеклись. Przetnę, przeciął — нерегулярно. Przeciętny — средний. Читается «пшэ́цёнць»."
idioms:
  - { pl: "przeciąć wstęgę", ru: "открыть торжественно, перерезав ленточку" }
formExamplesSkip:
  - { form: "przecięci", reason: "людей не «разрезают»: формы для мужчин-людей нет" }
