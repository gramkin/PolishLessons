# review
id: rozny
format: 2
lemma: "różny"
rank: 718
pos: adj
pron: { cyr: "ру́жны" }
senses:
  - id: different
    ru: "разный, различный"
    examples:
      - pl: "Chrześcijaństwo i islam to dwie różne religie."
        ru: "Христианство и ислам - две разные религии."
        source: { kind: tatoeba, id: 12682174 }
      - pl: "Te zdania w języku polskim mają różne znaczenia."
        ru: "Эти предложения в польском языке имеют разные значения."
        source: { kind: tatoeba, id: 12198101 }
      - pl: "Ile różnych figur jest w japońskich szachach?"
        ru: "Сколько разных фигур в японских шахматах?"
        source: { kind: tatoeba, id: 545382 }
  - id: various
    ru: "różne rzeczy — разные вещи, всякое"
    examples:
      - pl: "Rozmawiali o różnych rzeczach."
        ru: "Они говорили о разных вещах."
        source: { kind: translated, id: 844826 }
      - pl: "Korzystaj z różnych okazji."
        ru: "Пользуйся разными случаями."
        source: { kind: translated, id: 350157 }
      - pl: "Z wiekiem zacząłem inaczej patrzeć na różne sprawy."
        ru: "Я стал старше, поэтому я стал смотреть на вещи по-другому."
        source: { kind: tatoeba, id: 351536 }
  - id: homograph
    ru: "różni «разные» ≠ różni się «отличается»"
    note: "Одна и та же форма у прилагательного и у глагола."
    examples:
      - pl: "Oni są różni."
        ru: "Они разные."
        source: { kind: translated, id: 11557474 }
      - pl: "Ci ludzie są różni."
        ru: "Эти люди разные."
        source: { kind: authored }
      - pl: "Jesteśmy różni, ale się lubimy."
        ru: "Мы разные, но нравимся друг другу."
        source: { kind: authored }
  - id: superlative
    ru: "najróżniejszy — всевозможный, самый разнообразный"
    examples:
      - pl: "Kolekcjonował najróżniejsze informacje."
        ru: "Он собирал самые разные сведения."
        source: { kind: translated, id: 7970862 }
      - pl: "Uczniowie tej szkoły językowej popełniają najróżniejsze błędy."
        ru: "Ученики этой языковой школы делают самые разные ошибки."
        source: { kind: translated, id: 12324452 }
      - pl: "Jest w kontakcie z najróżniejszymi ludźmi."
        ru: "Он общается с самыми разными людьми."
        source: { kind: translated, id: 4797437 }
notes:
  - { kind: false-friend, text: "Ловушка-омоним: różni — это и прилагательное «разные» (о мужчинах), и глагол różnić się «отличаться» в третьем лице. Oni są różni «Они разные», но Tom nie różni się od innych «Том не отличается от других»." }
  - { kind: usage, text: "Сравнительной степени у слова нет: różniejszy не говорят — «более разным» быть нельзя. Зато превосходная najróżniejszy живёт и значит не «самый разный», а «всевозможный»: najróżniejsze informacje «самые разные сведения»." }
  - { kind: government, text: "różny od czegoś «отличный от чего-либо» — с родительным падежом: Meksykański język migowy jest różny od hiszpańskiego." }
  - { kind: usage, text: "Родня: różnica «разница», różnić się «отличаться», różnorodny «разнообразный». Ходовое наречное сочетание — na różne sposoby «по-разному»." }
collocations:
  - { pl: "różne rzeczy", ru: "разные вещи" }
  - { pl: "różny od czegoś", ru: "отличный от чего-либо" }
  - { pl: "na różne sposoby", ru: "по-разному" }
  - { pl: "najróżniejsze", ru: "всевозможные" }
family:
  - { pl: "różnica", ru: "разница", relation: derived }
  - { pl: "różnić się", ru: "отличаться", relation: derived }
  - { pl: "różnorodny", ru: "разнообразный", relation: derived }
etymology: "Праславянское *rōznъ — то же слово, что русские «разный» и «рознь»."
memory: "różny — «разный», слово то же самое. Держите в голове две вещи. Омоним: różni — это и «разные» (Oni są różni), и глагол różnić się «отличаться» (Tom nie różni się od innych). И степени: różniejszy не существует вовсе, а najróżniejszy значит не «самый разный», а «всевозможный» — najróżniejsze informacje."
idioms:
