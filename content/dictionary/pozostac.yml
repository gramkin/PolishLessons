# review
id: pozostac
format: 2
lemma: "pozostać"
rank: 826
pos: verb
aspect: perf
pron: { cyr: "позо́стаць" }
senses:
  - id: remain
    ru: "остаться"
    examples:
      - pl: "Oni chcieliby pozostać w domu."
        ru: "Они хотели бы остаться дома."
        source: { kind: tatoeba, id: 4454168 }
      - pl: "Marzenie powinno pozostać marzeniem."
        ru: "Мечта должна оставаться мечтой."
        source: { kind: tatoeba, id: 12760592 }
      - pl: "Pozostał bez słów."
        ru: "Он остался без слов."
        source: { kind: translated, id: 10708011 }
  - id: stay-state
    ru: "остаться каким-л. (+ творительный или прилагательное)"
    examples:
      - pl: "Pozostała niezamężna aż do śmierci."
        ru: "Она осталась незамужней до самой смерти."
        source: { kind: translated, id: 524658 }
      - pl: "Po wygraniu nagrody Nobla pozostała równie skromna jak dotychczas."
        ru: "После Нобелевской премии она осталась такой же скромной, как и прежде."
        source: { kind: translated, id: 1351258 }
      - pl: "Pozostałem spokojny i skoncentrowany."
        ru: "Я остался спокойным и сосредоточенным."
        source: { kind: translated, id: 9684422 }
  - id: the-rest
    ru: "pozostali — остальные, прочие"
    note: "Причастие в роли существительного."
    examples:
      - pl: "Tom postanowił się nie odzywać, dopóki wszyscy pozostali nie wygłoszą swoich opinii."
        ru: "Том решил не отзываться, пока все остальные не выразят свои мнения."
        source: { kind: tatoeba, id: 4573263 }
      - pl: "Kim są pozostali?"
        ru: "Кто остальные?"
        source: { kind: translated, id: 8734649 }
      - pl: "Pozostały tylko dwa dni."
        ru: "Осталось только два дня."
        source: { kind: translated, id: 941978 }
notes:
  - { kind: usage, text: "Несовершенный вид — pozostawać. Близкий по смыслу zostać тоже значит «остаться», но pozostać звучит книжнее и подчёркивает, что состояние сохранилось: Pozostał spokojny «Он остался спокоен»." }
  - { kind: government, text: "После pozostać имя сказуемого стоит в творительном: pozostać przyjaciółmi «остаться друзьями», pozostać tajemnicą «остаться тайной». С прилагательным — именительный: pozostał spokojny." }
  - { kind: usage, text: "Форма pozostali значит ещё и «остальные, прочие»: Kim są pozostali? «Кто остальные?». Это причастие, ставшее существительным." }
  - { kind: usage, text: "Безличное pozostaje значит «остаётся (только)»: Pozostało nam tylko czekanie «Нам осталось только ждать»." }
collocations:
  - { pl: "pozostać w kontakcie", ru: "оставаться на связи" }
  - { pl: "pozostali", ru: "остальные" }
  - { pl: "pozostać tajemnicą", ru: "остаться тайной" }
  - { pl: "niech to pozostanie między nami", ru: "пусть это останется между нами" }
family:
  - { pl: "zostać", ru: "остаться, стать", relation: root, id: zostac }
  - { pl: "pozostały", ru: "оставшийся", relation: derived }
  - { pl: "pozostałość", ru: "остаток", relation: derived }
etymology: "Из po- + zostać «остаться», от stać «стоять». Русское «остаться» собрано от того же корня, так что слова прозрачно соответствуют друг другу."
memory: "pozostać — «остаться», книжнее, чем zostać, и с упором на то, что состояние сохранилось: Pozostał spokojny. После глагола творительный падеж: pozostać przyjaciółmi. И запомните pozostali «остальные» — причастие, ставшее существительным."
idioms:
  - { pl: "pozostać w kontakcie", ru: "оставаться на связи" }
  - { pl: "niech to pozostanie między nami", ru: "пусть это останется между нами" }
  - { pl: "pozostali", ru: "остальные" }
