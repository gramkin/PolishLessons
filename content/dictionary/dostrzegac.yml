etymology: "Приставка DO- плюс STRZEGAĆ, многократная форма от STRZEC, праславянское *sterg-ti «стеречь, охранять». Русский сохранил корень полностью: «стеречь», «сторож», «сторожить», «осторожный», «стража». Польское STRZ- на месте русского СТОР-/СТЕР- получилось закономерно, через выпадение беглого гласного и отвердение, и такое же соответствие видно в парах STRZAŁA и «стрела», ŚRODA и «среда». Значение «замечать» выросло из «стеречь» через промежуточное «пристально смотреть»: кто стережёт, тот и видит первым. Приставка DO- добавила завершённость взгляда, то есть попадание в цель."
memory: "Корень тот же, что в «стеречь»: strzec «стеречь», stróż «сторож», ostrożny «осторожный», straż «стража». Отсюда и значение — кто стережёт, тот первым и замечает. Полезнее всего запомнить strażak «пожарный», от straż pożarna. Произношение трудное: strz звучит как «стш», потому что rz после глухого t оглушается. И помнить про обязательный родительный при отрицании: nie dostrzegał własnych błędów."
idioms:
