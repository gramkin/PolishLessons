notes:
  - { kind: false-friend, text: "Корень тот же, что в русском «стеречь», и всё гнездо русскому понятно, если его показать: STRZEC значит «стеречь, охранять», STRÓŻ — «сторож», OSTROŻNY — «осторожный», STRAŻ — «стража». Самое полезное слово этого гнезда неожиданное: STRAŻAK значит «пожарный», буквально «стражник», потому что пожарная команда по-польски STRAŻ POŻARNA. Русское «страж» звучит книжно и высоко, а польское STRAŻ совершенно обиходно, и путать уровни не стоит." }
  - { kind: usage, text: "Развитие значения стоит проследить: от «стеречь» через «пристально смотреть» к «заметить». Тот же путь прошёл русский глагол «усмотреть» от «смотреть». Шестьдесят три формы — подпись переходного глагола несовершенного вида, с действительным причастием на -ĄCY. Видовой партнёр — DOSTRZEC, и у него основа короче: DOSTRZEGAĆ при DOSTRZEC, как STRZEGAĆ при STRZEC. Очень близкий по смыслу глагол ZAUWAŻAĆ употребляется чаще в разговоре, а DOSTRZEGAĆ звучит чуть книжнее и предполагает усилие." }
  - { kind: government, text: "Прямое дополнение в винительном: DOSTRZEGAĆ RÓŻNICĘ, DOSTRZEGAĆ ZMIANY, DOSTRZEGAĆ SZCZEGÓŁY. Придаточное строится через ŻE: DOSTRZEGAM, ŻE SIĘ ZMIENIŁEŚ. При отрицании дополнение, как всегда в польском, переходит в родительный: NIE DOSTRZEGAŁ WŁASNYCH BŁĘDÓW, а не BŁĘDY. Это общее правило польского языка, и русскому оно знакомо лишь отчасти, потому что у нас родительный при отрицании необязателен. Здесь же он обязателен без исключений." }
  - { kind: pronunciation, text: "Читается «достше́гачь», три слога, ударение на предпоследнем. Сочетание STRZ самое трудное: RZ после глухого T оглушается и звучит как «ш», поэтому слышно «стше», а не «стже». Это одно из тех польских стечений, которые русскому даются с трудом, и проговаривать его стоит медленно. Конечное Ć мягкое, «чь». В формах настоящего времени звучит «достше́гам», «достше́гаш»." }
  - { kind: register, text: "Слово нейтральное, слегка книжное. Частые сочетания: DOSTRZEGAĆ RÓŻNICĘ «замечать разницу», DOSTRZEGAĆ PROBLEM «видеть проблему», NIE DOSTRZEGAĆ CZEGOŚ «не замечать чего-то». В публицистике живёт оборот DOSTRZEGAĆ ŚWIATŁO W TUNELU «видеть свет в конце туннеля». Отглагольное существительное DOSTRZEGANIE редкое; вместо него обычно говорят SPOSTRZEŻENIE «наблюдение, замечание». В быту чаще скажут ZAUWAŻAĆ." }
