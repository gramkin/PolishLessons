etymology: "От WYBIĆ SIĘ «выбиться, выделиться»: выдающийся — тот, кто выбился над остальными. Корень тот же, что в русском «бить» и «выбиться в люди»."
memory: "Wybitny — тот, кто «выбился» над остальными, то есть выдающийся. С N — выдающийся, без N (wybity) — выбитый. Wybitny naukowiec — выдающийся учёный."
idioms:
