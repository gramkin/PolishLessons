      - pl: "Jest bodaj najwybitniejszym fizykiem w historii."
        ru: "Он, пожалуй, самый выдающийся физик в истории."
        source: { kind: translated, id: 367614 }
  - id: marked
    ru: "значительный, ярко выраженный (книжн.)"
    examples:
      - pl: "Stwierdzono wybitną poprawę wyników."
        ru: "Отмечено значительное улучшение результатов."
        source: { kind: authored }
      - pl: "Wykazał wybitne zdolności matematyczne."
        ru: "Он проявил выдающиеся математические способности."
        source: { kind: translated, id: 368153 }
notes:
  - { kind: false-friend, text: "WYBITNY — не «выбитый». «Выбитый» по-польски WYBITY, без N: WYBITA SZYBA «выбитое стекло», WYBITY ZĄB «выбитый зуб». WYBITNY значит «выдающийся» — тот, кто выбился над остальными, от WYBIJAĆ SIĘ «выделяться»." }
  - { kind: usage, text: "Тридцать три формы — одиннадцать клеток в трёх степенях: WYBITNY, WYBITNIEJSZY, NAJWYBITNIEJSZY. Сравнительная степень встречается реже положительной; в речи её часто заменяют на BARDZIEJ WYBITNY. Мужско-личное множественное — WYBITNI: WYBITNI NAUKOWCY. Наречие WYBITNIE значит «исключительно»: WYBITNIE UZDOLNIONY «исключительно одарённый»." }
  - { kind: register, text: "Слово оценочное и скорее книжное: так говорят о науке, искусстве, спорте. WYBITNY — о качестве и таланте, SŁYNNY — о славе, ZNAKOMITY — «превосходный» в похвале. Человек может быть WYBITNY и при этом не SŁYNNY." }
  - { kind: pronunciation, text: "Читается «выби́тны»: WY — «вы», конечное Y — «ы». Ударение на предпоследнем слоге, в сравнительной степени оно сдвигается: WYBITNIEJSZY — «выбитне́йшы»." }
