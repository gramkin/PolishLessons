notes:
  - { kind: false-friend, text: "Прозрачного русского соответствия нет: «снаряд» и «пуля» — слова совсем других корней. Зато корень польского слова знаком. Pocisk построен на ciskać «швырять, метать», а ci- здесь отвечает русскому т- по уже знакомому закону: ciągnąć — «тянуть», ciało — «тело», cichy — «тихий». Так что ciskać роднится с русскими «тискать» и «тиснуть», а pocisk — это буквально «то, что метнули»." }
  - { kind: pronunciation, text: "Два слога, ударение на первом: PO-cisk, «по́циск». ci читается мягко. Родительный, предложный и звательный единственного числа слились в одной форме pocisku, поэтому форм девять, а не десять — так же устроены trening и domek." }
  - { kind: usage, text: "Слово покрывает весь диапазон метательных снарядов: pocisk artyleryjski «артиллерийский снаряд», pocisk rakietowy «ракета», но и обычная пуля — pocisk kalibru dziewięć milimetrów. В разговоре про пулю чаще скажут kula, а pocisk остаётся словом военных сводок и протоколов." }
collocations:
  - { pl: "pocisk artyleryjski", ru: "артиллерийский снаряд" }
  - { pl: "pocisk rakietowy", ru: "ракетный снаряд" }
  - { pl: "wyjąć pocisk", ru: "извлечь пулю" }
family:
  - { pl: "ciskać", ru: "швырять, метать", relation: root }
  - { pl: "cisnąć", ru: "швырнуть; жать", relation: derived }
  - { pl: "pociskowy", ru: "снарядный", relation: derived }
etymology: "Приставка po- плюс корень cisk-, тот же, что в ciskać «швырять» и cisnąć. Польское ci- отвечает здесь русскому т-, как в ciągnąć и «тянуть», так что ближайшая русская родня — «тискать» и «тиснуть». Буквально pocisk значит «брошенное, метнутое». Отсюда pociskowy и przeciwpancerny pocisk."
memory: "pocisk — «снаряд» или «пуля», и русского двойника у слова нет. Зато корень узнаваем через закон ci/т: ciskać «швырять» роднится с «тискать», а pocisk — это буквально «то, что метнули»."
idioms:
