notes:
  - { kind: false-friend, text: "Ловушки нет: слово международное и совпадает с русским во всех значениях. Полезнее знать соседа: само finanse — существительное ТОЛЬКО ВО МНОЖЕСТВЕННОМ числе, как русские «финансы» и как польские drzwi и spodnie. Единственного «finans» не бывает." }
  - { kind: usage, text: "Частые сочетания: rok finansowy «финансовый год», sprawozdanie finansowe «финансовый отчёт», środki finansowe «денежные средства», wsparcie finansowe «финансовая помощь». Рядом живёт pieniężny «денежный»: kara pieniężna «денежный штраф», где finansowy не подойдёт." }
  - { kind: pronunciation, text: "Четыре слога, ударение на предпоследнем: fi-nan-SO-wy. Все гласные чистые, без редукции: «финансо́вы», а не «финансавы». В женском роде ударение там же: fi-nan-SO-wa." }
  - { kind: register, text: "Степеней сравнения нет: прилагательное относительное, как wojenny, narodowy и światowy, отсюда одиннадцать форм. Регистр деловой; в разговоре о личных деньгах чаще скажут просто nie mam pieniędzy, чем mam problemy finansowe." }
collocations:
  - { pl: "rok finansowy", ru: "финансовый год" }
  - { pl: "kryzys finansowy", ru: "финансовый кризис" }
  - { pl: "wsparcie finansowe", ru: "финансовая поддержка" }
family:
  - { pl: "finanse", ru: "финансы", relation: root }
  - { pl: "finansować", ru: "финансировать", relation: derived }
  - { pl: "pieniężny", ru: "денежный", relation: derived }
etymology: "От finanse, из французского finances, а то — от средневекового латинского finare «уплачивать, завершать расчёт», от finis «конец». Платёж был завершением дела, отсюда и значение. В польский и в русский слово пришло через французский в одно время, поэтому совпадает полностью."
memory: "finansowy — «финансовый», совпадает с русским во всём. Запомнить стоит существительное: finanse бывают только во множественном, как русские «финансы» и как польские drzwi."
