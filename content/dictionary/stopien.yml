# review
id: stopien
format: 2
lemma: "stopień"
rank: 1187
pos: noun
pron: { cyr: "сто́пень" }
senses:
  - id: step
    ru: "ступень, ступенька (лестницы)"
    examples:
      - pl: "Uwaga stopień."
        ru: "Осторожно, ступенька."
        source: { kind: translated, id: 8608435 }
      - pl: "Biegłem po schodach pod górę po dwa stopnie."
        ru: "Я бежал вверх по лестнице через две ступеньки."
        source: { kind: translated, id: 719676 }
      - pl: "Jestem zmęczony chodzeniem po tylu stopniach do góry."
        ru: "Я устал подниматься по стольким ступенькам."
        source: { kind: translated, id: 13239072 }
  - id: degree
    ru: "градус (температуры, угла)"
    examples:
      - pl: "Wczoraj temperatura spadła do minus pięciu stopni Celsjusza."
        ru: "Вчера температура упала до минус пяти градусов по Цельсию."
        source: { kind: tatoeba, id: 12478710 }
      - pl: "Nauczyciel powiedział nam, że woda wrze przy 100 stopniach."
        ru: "Наш учитель сказал, что вода кипит при ста градусах по Цельсию."
        source: { kind: tatoeba, id: 362839 }
      - pl: "Siedem stopni na plusie."
        ru: "Семь градусов тепла."
        source: { kind: translated, id: 13008554 }
  - id: extent
    ru: "степень, мера — в оборотах do pewnego stopnia, w dużym stopniu"
    examples:
      - pl: "Do pewnego stopnia masz słuszność."
        ru: "В какой-то степени вы правы."
        source: { kind: tatoeba, id: 960863 }
      - pl: "Ta pogłoska jest do pewnego stopnia prawdą."
        ru: "Этот слух в некоторой степени правда."
        source: { kind: tatoeba, id: 712401 }
      - pl: "W dużym stopniu się z tobą zgadzam."
        ru: "Я в значительной степени с тобой согласен."
        source: { kind: translated, id: 7868974 }
  - id: rank
    ru: "звание, чин (воинский)"
    examples:
      - pl: "Ma stopień pułkownika."
        ru: "У него звание полковника."
        source: { kind: translated, id: 12450172 }
      - pl: "Major jest starszy stopniem od kapitana."
        ru: "Майор старше капитана по званию."
        source: { kind: translated, id: 12450181 }
      - pl: "Rozumiesz stopnie wojskowe?"
        ru: "Ты разбираешься в воинских званиях?"
        source: { kind: translated, id: 12069300 }
  - id: grade
    ru: "отметка, оценка (школьная)"
    examples:
      - pl: "Dostała najwyższy stopień bo nauczyła się całej lekcji na pamięć."
        ru: "Она получила высшую оценку, потому что выучила весь урок наизусть."
        source: { kind: translated, id: 4788986 }
      - pl: "Moje stopnie są powyżej średniej."
        ru: "Мои оценки выше среднего."
        source: { kind: translated, id: 603576 }
      - pl: "Próbowałem otrzymywać dobre stopnie."
        ru: "Я старался получать хорошие оценки."
        source: { kind: translated, id: 600405 }
notes:
  - { kind: usage, text: "Одно польское слово покрывает пять русских: ступенька лестницы, градус, степень, воинское звание и школьная отметка. Что именно имеется в виду, всегда подсказывает контекст." }
  - { kind: government, text: "В значении «степень» слово живёт в устойчивых оборотах с предлогом: do pewnego stopnia «до определённой степени» (родительный), w dużym stopniu «в большой степени» (предложный)." }
  - { kind: false-friend, text: "Школьные оценки по-польски — stopnie, а не «степени». Dobre stopnie значит «хорошие отметки», а не «хорошие степени»." }
  - { kind: usage, text: "Родительный падеж множественного числа — stopni, без окончания: Ile mamy dzisiaj stopni? «Сколько сегодня градусов?»" }
collocations:
  - { pl: "do pewnego stopnia", ru: "до определённой степени" }
  - { pl: "w dużym stopniu", ru: "в большой степени" }
  - { pl: "stopień naukowy", ru: "учёная степень" }
  - { pl: "dobre stopnie", ru: "хорошие отметки" }
etymology: "Праславянское *stopenь от *stopa «стопа, след» — то же гнездо, что русские «ступень» и «стопа». Лестничная ступенька дала все переносные значения: градус, степень, звание, отметка."
memory: "stopień — это «ступень» в самом широком смысле: ступенька лестницы, градус на термометре, степень (do pewnego stopnia), воинское звание и школьная отметка. Родительный множественного — stopni: Ile mamy dzisiaj stopni?"
idioms:
  - { pl: "do pewnego stopnia", ru: "до определённой степени" }
  - { pl: "w najwyższym stopniu", ru: "в высшей степени" }
  - { pl: "stopień naukowy", ru: "учёная степень" }
