notes:
  - { kind: false-friend, text: "Ловушка в написании и в ударении, а не в значении. По-польски METAL пишется с одним l, по-русски «металл» с двумя: польский взял слово через немецкое посредство и упростил, русский держится латинского METALLUM. Это тот же случай, что APARAT против «аппарата», и правило общее для целого ряда заимствований. Ударение тоже расходится: по-польски «мэ́тал», на первом слоге, по-русски «мета́лл», на последнем. Польское ударение почти всегда предпоследнее, и у двусложных заимствований это значит сдвиг влево относительно русского." }
  - { kind: pronunciation, text: "Читается «мэ́тал», в два слога, с ударением на первом. Буква e даёт «э», поэтому не «металл», а «мэ́тал». Конечное l — обычное польское твёрдое l, без смягчения: «мэ́тал», не «мэ́таль». В формах METALU и METALEM ударение остаётся на первом слоге, пока слогов три: «мэта́лу» — нет, «мэ́талу», потому что предпоследний слог теперь TA. Проверяйте по правилу, а не на слух." }
  - { kind: government, text: "Родительный падеж единственного числа имеет два варианта: METALU, обычный для вещества, и METALA, встречающийся реже и скорее о конкретном предмете или о музыкальном жанре. В письменной речи выбирайте METALU. Из чего сделано — предлог Z с родительным: Z METALU. Родительный множественного — METALI. Для музыкального значения употребляются те же формы, но множественное число в нём почти не встречается." }
  - { kind: usage, text: "Два значения расходятся далеко, и второе для русского привычно: METAL о музыке значит ровно то же, что русское «метал», и сочетания совпадают — CIĘŻKI METAL «тяжёлый метал». В значении вещества слово употребляется и собирательно, METAL JEST DROŻSZY OD PLASTIKU, и в множественном числе о разных металлах, METALE SZLACHETNE, METALE KOLOROWE. Прилагательное METALOWY покрывает оба смысла: BRAMA METALOWA «металлические ворота» и ZESPÓŁ METALOWY «метал-группа»." }
collocations:
  - { pl: "metale szlachetne", ru: "благородные металлы" }
  - { pl: "z metalu", ru: "из металла" }
  - { pl: "ciężki metal", ru: "тяжёлый метал" }
family:
