etymology: "Из греческого METALLON «рудник, копь», затем «металл», через латинское METALLUM. В польский слово пришло в шестнадцатом веке через немецкое METALL и по дороге потеряло одно l, как это обычно бывало с латинскими двойными согласными в польском. Русский взял слово позже и ближе к латинскому написанию, поэтому сохранил оба l. Греческое исходное значение, «рудник», напоминает, что металл сначала был местом, откуда его добывают, а уже потом веществом, — тот же ход, что в польском KRUSZEC, где слово о руде стало словом о ценном металле."
memory: "Пишется с одним l, в отличие от русского «металл»: тот же класс, что APARAT против «аппарата». Ударение на первом слоге, «мэ́тал», против русского «мета́лл». Родительный — metalu (metala реже). И METAL о музыке значит то же, что по-русски."
idioms:
