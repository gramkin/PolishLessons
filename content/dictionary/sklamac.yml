etymology: "Приставка s- и глагол KŁAMAĆ, слово западнославянское, у которого прямого русского соответствия нет. Зато рядом в польском стоит ŁGAĆ, из праславянского *lъgati — то самое слово, что наше «лгать», только по стилю грубое. Языки разошлись в выборе нейтрального: русский оставил при деле «лгать», а польский выдвинул kłamać и отодвинул łgać в брань."
memory: "Будущее мягкое — skłamię, а повелительное голое и твёрдое — SKŁAM. И «лгать» по-польски kłamać, потому что łgać звучит грубо."
idioms:
  - { pl: "skłamać w oczy", ru: "соврать в глаза" }
  - { pl: "nieskłamana radość", ru: "непритворная радость" }
formExamplesSkip:
  - { form: "skłamani", reason: "Мужская личная форма страдательного причастия. Глагол skłamać непереходный и управляет дательным падежом: skłamać KOMUŚ. Польский страдательный залог поднимает в подлежащее винительный объект, а дательный поднять не может, поэтому настоящего страдания у этого глагола нет. Формы skłamany, skłamana, skłamane живут как прилагательные о содержании лжи — skłamany życiorys, skłamane zeznania, — но содержание не бывает мужским лицом, и для skłamani осмысленного употребления не остаётся." }
