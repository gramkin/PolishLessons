notes:
  - { kind: usage, text: "Вид совершенный, пара к несовершенному KŁAMAĆ. В будущем времени в основе появляется мягкость: SKŁAMIĘ, skłamiesz, skłamie, skłamią. Повелительное наклонение, напротив, обходится голой основой и остаётся твёрдым: SKŁAM, skłammy, skłamcie, без всякого -ij, которого здесь ожидать естественно. Управление дательным, как и по-русски: skłamać KOMUŚ, солгать кому-то." }
  - { kind: false-friend, text: "Глаголов для лжи в польском два, и знакомый русскому — не тот, который нужен. ŁGAĆ действительно родня нашему «лгать», из праславянского *lъgati, но в польском это слово грубое и резкое, вроде нашего «брехать». Нейтральное, повседневное слово — KŁAMAĆ, и у него русского соответствия нет вовсе. Отсюда же kłamstwo «ложь» и kłamca «лжец»." }
  - { kind: usage, text: "Страдательное причастие существует, но живёт почти только в отрицательной форме: NIESKŁAMANY значит «непритворный, искренний», как в nieskłamana radość. Утвердительное skłamany встречается о содержании лжи, а не о человеке: skłamany życiorys, skłamane zeznania. Это причастие, которое проще встретить с приставкой nie-, чем без неё." }
collocations:
  - { pl: "skłamać komuś", ru: "солгать кому-то" }
  - { pl: "skłamać w oczy", ru: "соврать в глаза" }
  - { pl: "nieskłamana radość", ru: "непритворная радость" }
