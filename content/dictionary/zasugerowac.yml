id: zasugerowac
format: 2
lemma: "zasugerować"
rank: 4652
pos: verb
pron: { cyr: "засугеро́ваць" }
senses:
  - id: suggest
    ru: "предложить, подсказать"
    examples:
      - pl: "Zasugerował, żebyśmy wyjechali wcześniej."
        ru: "Он предложил, чтобы мы выехали раньше."
        source: { kind: authored }
      - pl: "Lekarz zasugerował zmianę diety."
        ru: "Врач посоветовал сменить диету."
        source: { kind: authored }
      - pl: "Czy mogę coś zasugerować?"
        ru: "Можно я кое-что предложу?"
        source: { kind: authored }
  - id: imply
    ru: "намекнуть; повлиять, внушить (zasugerować się — поддаться)"
    examples:
      - pl: "Zasugerowała, że kłamię."
        ru: "Она намекнула, что я лгу."
        source: { kind: authored }
      - pl: "Nie zasugeruj się opinią innych."
        ru: "Не поддавайся чужому мнению."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ZASUGEROWAĆ — не «внушить» гипнозом, а прежде всего «предложить, подсказать»: ZASUGEROWAĆ ROZWIĄZANIE. Второе значение — «намекнуть»: ZASUGEROWAĆ, ŻE. Возвратное ZASUGEROWAĆ SIĘ CZYMŚ — «поддаться влиянию»: ZASUGEROWAŁ SIĘ REKLAMĄ." }
  - { kind: usage, text: "Пятьдесят три формы — подпись переходного глагола совершенного вида: страдательное ZASUGEROWANY и деепричастие ZASUGEROWAWSZY. ZASUGEROWANY — ещё и «под влиянием»: BYŁ ZASUGEROWANY TYTUŁEM. Видовой партнёр — SUGEROWAĆ: SUGERUJE ZMIANY." }
  - { kind: government, text: "Кому что — дательный и винительный: ZASUGEROWAĆ KOMUŚ ROZWIĄZANIE. С придаточным — ŻE или ŻEBY: ZASUGEROWAĆ, ŻEBY ZOSTAŁ. Возвратное ZASUGEROWAĆ SIĘ — с творительным: CZYIMŚ ZDANIEM." }
  - { kind: pronunciation, text: "Читается «засугеро́ваць», пять слогов, ударение на предпоследнем. GE звучит «ге», как в русском «герой». Будущее ZASUGERUJĘ — «засугеру́е»." }
  - { kind: register, text: "Вежливое и немного книжное слово: в разговоре чаще ZAPROPONOWAĆ или PODPOWIEDZIEĆ. В переговорах: SUGERUJĘ PRZERWĘ — мягкий способ предложить. ZASUGEROWAĆ SIĘ — обычное о влиянии рекламы и чужих мнений." }
collocations:
  - { pl: "zasugerować rozwiązanie", ru: "предложить решение" }
  - { pl: "zasugerować się czymś", ru: "поддаться влиянию чего-то" }
  - { pl: "zasugerować zmianę", ru: "предложить изменение" }
family:
  - { pl: "sugerować", ru: "предлагать, намекать", relation: aspect, id: sugerowac }
  - { pl: "sugestia", ru: "предложение, внушение", relation: root, id: sugestia }
  - { pl: "zaproponować", ru: "предложить", relation: root }
etymology: "Приставка ZA- плюс SUGEROWAĆ, из латинского SUGGERERE «подкладывать, подсказывать». То же слово, что русское «суггестия»; русскому «сугерировать» соответствия в быту нет."
memory: "Zasugerować — предложить, подсказать: zasugerować rozwiązanie. Намекнуть: zasugerowała, że kłamię. Zasugerować się — поддаться влиянию. Читается «засугеро́ваць»."
idioms:
  - { pl: "nie dać się zasugerować", ru: "не поддаться чужому влиянию" }
