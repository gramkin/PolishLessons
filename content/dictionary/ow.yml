# review
id: ow
format: 2
lemma: "ów"
rank: 1368
pos: adj
pron: { cyr: "у́ф" }
senses:
  - id: that
    ru: "тот, тот самый (о ком уже шла речь)"
    examples:
      - pl: "Ów jest moim dzieckiem."
        ru: "Тот — мой ребёнок."
        source: { kind: translated, id: 2826473 }
      - pl: "Owe skrzynki są zrobione z tworzywa sztucznego."
        ru: "Те ящики сделаны из пластмассы."
        source: { kind: translated, id: 10699577 }
      - pl: "Ów człowiek nigdy nie wrócił."
        ru: "Тот человек так и не вернулся."
        source: { kind: authored }
  - id: some-or-other
    ru: "в оборотах ten czy ów «тот или иной», to i owo «кое-что»"
    examples:
      - pl: "Ten czy ów zawsze narzeka."
        ru: "Тот или иной всегда жалуется."
        source: { kind: authored }
      - pl: "To i owo już wiem."
        ru: "Кое-что я уже знаю."
        source: { kind: authored }
notes:
  - { kind: register, text: "Книжное и литературное местоимение «тот». В обиходной речи его почти всегда заменяет ten; ów живёт в книгах, документах и устойчивых оборотах." }
  - { kind: usage, text: "Род различается окончанием: ów (мужской), owa (женский), owo (средний). Множественное — owi для лично-мужских и owe для остальных." }
  - { kind: usage, text: "Устойчивые обороты, в которых слово встречается чаще всего: ten czy ów «тот или иной», to i owo «кое-что», ni to, ni owo «ни то ни сё»." }
  - { kind: false-friend, text: "Не путайте местоимение ów «тот» с окончанием родительного множественного -ów (domów, stołów). Совпадение написания случайное, но при поиске по текстам оно сильно мешает." }
collocations:
  - { pl: "ten czy ów", ru: "тот или иной" }
  - { pl: "to i owo", ru: "кое-что" }
  - { pl: "w owym czasie", ru: "в то время" }
etymology: "Праславянское *ovъ «этот, тот». В русском тот же корень сохранился в устаревшем «оный», которое и по смыслу, и по книжности точно соответствует польскому ów."
memory: "ów — книжное «тот»; в живой речи его место занимает ten. Запомните тройку по родам: ów, owa, owo. И обороты, в которых слово до сих пор живо: ten czy ów «тот или иной», to i owo «кое-что», ni to, ni owo «ни то ни сё»."
idioms:
  - { pl: "ten czy ów", ru: "тот или иной" }
  - { pl: "to i owo", ru: "кое-что" }
  - { pl: "ni to, ni owo", ru: "ни то ни сё" }
formExamplesSkip:
  - { form: "owy", reason: "такой формы у местоимения ów нет; словарь форм даёт её ошибочно" }
