# review
id: cieply
format: 2
lemma: "ciepły"
rank: 1692
pos: adj
pron: { cyr: "це́пуы" }
senses:
  - id: warm
    ru: "тёплый (о температуре)"
    examples:
      - pl: "Woda jest ciepła."
        ru: "Вода тёплая."
        source: { kind: translated, id: 8715266 }
      - pl: "Dzień był ciepły."
        ru: "День был тёплый."
        source: { kind: translated, id: 4660185 }
      - pl: "Ostatnio jest ciepła pogoda."
        ru: "В последнее время тёплая погода."
        source: { kind: translated, id: 956738 }
  - id: warm-clothes
    ru: "тёплый (об одежде, укрывающий)"
    examples:
      - pl: "Zimą noś ciepłe ubrania."
        ru: "Зимой носи тёплую одежду."
        source: { kind: translated, id: 827728 }
      - pl: "Ten płaszcz jest ciepły."
        ru: "Это пальто тёплое."
        source: { kind: translated, id: 8627418 }
  - id: warm-kind
    ru: "тёплый, сердечный"
    examples:
      - pl: "Dzięki za ciepłe słowa."
        ru: "Спасибо за тёплые слова."
        source: { kind: translated, id: 1086059 }
notes:
  - { kind: usage, text: "Сравнительная степень — cieplejszy «теплее», превосходная — najcieplejszy «самый тёплый»: Która pora roku jest najcieplejsza?" }
  - { kind: false-friend, text: "Форма ciepła — это и «тёплая» (woda jest ciepła), и родительный падеж существительного ciepło «тепло»: z ciepła słonecznego «от солнечного тепла». Различить помогает только контекст." }
  - { kind: usage, text: "ciepłe kraje — «тёплые края», куда улетают птицы: bocian odleciał do ciepłych krajów." }
  - { kind: register, text: "В разговорной речи ciepły о мужчине — грубое обозначение гомосексуальности. Про сердечного человека нейтральнее сказать serdeczny." }
collocations:
  - { pl: "ciepła woda", ru: "тёплая вода" }
  - { pl: "ciepłe ubranie", ru: "тёплая одежда" }
  - { pl: "ciepłe kraje", ru: "тёплые края" }
family:
  - { pl: "ciepło", ru: "тепло", relation: root }
  - { pl: "ocieplenie", ru: "потепление", relation: root }
  - { pl: "cieplarnia", ru: "теплица", relation: root }
etymology: "Праславянское *teplъ — то же слово, что русское «тёплый»; польское ci- на месте русского «т» повторяется и в других парах: ciało «тело», ciemny «тёмный»."
memory: "ciepły — «тёплый», и узнать его легко: польское ci- на месте русского «т», как в ciało «тело». Сравнительная степень cieplejszy. Осторожно с формой ciepła: это и «тёплая», и родительный падеж от ciepło «тепло»."
idioms:
  - { pl: "ciepłe kraje", ru: "тёплые края" }
  - { pl: "ciepłe kluchy", ru: "размазня, мямля" }
  - { pl: "ciepła posadka", ru: "тёплое местечко" }
