id: cieply
format: 2
lemma: "ciepły"
rank: 1692
pos: adj
pron: { cyr: "це́пуы" }
senses:
  - id: warm
    ru: "тёплый (о температуре)"
    examples:
      - pl: "Woda jest ciepła."
        ru: "Вода тёплая."
        source: { kind: translated, id: 8715266 }
      - pl: "Dzień był ciepły."
        ru: "День был тёплый."
        source: { kind: translated, id: 4660185 }
