etymology: "От CHIŃCZYK «китаец»: игра пришла в Европу как вариант индийской игры пачиси и в Польше получила «китайское» название, видимо, из-за экзотики. Немецкое название Mensch ärgere Dich nicht, русское «Не сердись, приятель» или «лудо» из английского. Забегаловка — тоже метонимия: «у китайца»."
memory: "chińczyk со строчной — игра лудо: grać w chińczyka. И разговорно — китайская забегаловка: iść do chińczyka. Chińczyk с заглавной — китаец, мн. Chińczycy. Читается «хи́ньчык»."
