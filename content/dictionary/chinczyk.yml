notes:
  - { kind: false-friend, text: "Главная ловушка — заглавная буква. CHIŃCZYK с большой буквы — «китаец», с мужским-личным множественным CHIŃCZYCY. А chińczyk со строчной — настольная игра «лудо», и его множественное CHIŃCZYKI, как у вещей. Разговорно chińczyk со строчной — ещё и «китайская забегаловка»: IŚĆ DO CHIŃCZYKA." }
  - { kind: usage, text: "Мужской род, неодушевлённое по смыслу, но в винительном, как у многих названий игр и заведений, — форма родительного: GRAĆ W CHIŃCZYKA, IŚĆ DO CHIŃCZYKA. Множественное CHIŃCZYKI — коробки с игрой или забегаловки. Местный — CHIŃCZYKU." }
  - { kind: government, text: "Играть в лудо — GRAĆ W CHIŃCZYKA, W с винительным, совпадающим с родительным. Пойти в китайскую забегаловку — IŚĆ DO CHIŃCZYKA, DO с родительным. Еда из забегаловки — JEDZENIE Z CHIŃCZYKA." }
  - { kind: pronunciation, text: "Читается «хи́ньчык», два слога, ударение на первом. CH — «х», Ń — мягкое «нь». В CHIŃCZYKA: «хиньчы́ка»." }
  - { kind: register, text: "В значении игры — нейтральное, детское и семейное: CHIŃCZYK есть почти в каждом польском доме. В значении забегаловки — разговорное, иногда снисходительное. О человеке со строчной буквы писать нельзя: это ошибка и может прозвучать пренебрежительно." }
