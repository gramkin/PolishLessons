notes:
  - { kind: false-friend, text: "RESZTKI — «остатки», только во множественном. Сдача в магазине — RESZTA: RESZTY NIE TRZEBA, «сдачи не надо». RESZTKI — то, что осталось: еда, силы, деньги." }
  - { kind: usage, text: "Pluralia tantum: пять форм, все множественные. Родительный — RESZTEK, с беглым E. В единственном RESZTKA встречается редко: RESZTKA ZUPY." }
