  - id: grievance
    ru: "обида, упрёк (чаще в мн. ч. żale)"
    examples:
      - pl: "Mam głęboki żal."
        ru: "У меня глубокая обида."
        source: { kind: authored }
      - pl: "Wylewał swoje żale przez godzinę."
        ru: "Он изливал свои жалобы час."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Корень прямо отвечает русскому «жаль», «жалость», «жалеть» — но распределение смыслов другое. Польское żal это и «сожаление», и ОБИДА: mieć żal do kogoś значит «держать обиду на кого-л.», а не «жалеть кого-л.». Множественное żale — это «упрёки, жалобы»." }
  - { kind: government, text: "Два разных управления. Безличное żal mi kogoś «мне жаль кого-л.» требует РОДИТЕЛЬНОГО: żal mi go. А оборот обиды — mieć żal DO kogoś O coś: предлог do с родительным для человека и o с винительным для причины." }
  - { kind: usage, text: "Из того же корня żałować «жалеть, сожалеть», żałoba «траур» и żałosny «жалкий, плачевный». Русское «жалкий» и польское żałosny — родственники, но польское слово сильнее отдаёт презрением." }
collocations:
  - { pl: "żal mi go", ru: "мне его жаль" }
  - { pl: "mieć żal do kogoś", ru: "держать обиду на кого-л." }
  - { pl: "bez żalu", ru: "без сожаления" }
family:
  - { pl: "żałować", ru: "жалеть, сожалеть", relation: derived, id: zalowac }
  - { pl: "żałoba", ru: "траур", relation: derived }
  - { pl: "żałosny", ru: "жалкий, плачевный", relation: derived }
etymology: "Праславянское *žalь «страдание, боль», от индоевропейского корня со значением «колоть, жгучая боль». Русские «жаль», «жалость», «жалеть» — прямые родственники. Отсюда же польские żałoba «траур» и żałosny «жалкий»."
memory: "żal — русское «жаль», тот же корень. Но помните второй смысл: mieć żal do kogoś это «держать обиду», а żale — «упрёки». Безличное żal mi + родительный: żal mi go."
idioms:
  - { pl: "żal mi go", ru: "мне его жаль" }
  - { pl: "mieć żal do kogoś", ru: "держать обиду на кого-л." }
formExamplesSkip:
