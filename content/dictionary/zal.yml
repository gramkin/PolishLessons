senses:
  - id: sorrow
    ru: "сожаление, горе"
    examples:
      - pl: "Zrobił to bez żalu."
        ru: "Он сделал это без сожаления."
        source: { kind: authored }
      - pl: "Nie kryła żalu po stracie."
        ru: "Она не скрывала горя после утраты."
        source: { kind: authored }
      - pl: "Patrzył na nią z żalem."
