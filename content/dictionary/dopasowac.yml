notes:
  - { kind: false-friend, text: "Корень PASOWAĆ русскому знаком, но не тем смыслом, которым нужен. По-польски PASOWAĆ значит прежде всего «подходить, быть впору»: TA KOSZULA MI PASUJE — «эта рубашка мне впору», TO MI NIE PASUJE — «это мне не подходит, не устраивает». Русское же «пасовать» значит «сдаваться, отступать», и в польском этот смысл у PASOWAĆ есть только карточный, за игровым столом. Так что встретив PASUJE, думайте «подходит», а не «пасует»." }
  - { kind: government, text: "Управление требует предлога DO с родительным: DOPASOWAĆ COŚ DO CZEGOŚ — dopasować drzwi do framugi, dopasować kolor do zasłon, dopasować program do systemu. Русский берёт здесь предлог «к» с дательным или «под» с винительным: «подогнать к наличнику», «подобрать под занавески». То есть меняются и предлог, и падеж. Это та же картина, что у PODCHODZIĆ DO OKNA против «к окну» из партии 268." }
  - { kind: pronunciation, text: "Глагол из класса на -OWAĆ, разобранного в карточке DOPILNOWAĆ: в настоящем времени -owa- сменяется на -uj-. DOPASOWAĆ даёт DOPASUJĘ, DOPASUJESZ, DOPASUJE, DOPASUJĄ, повелительное DOPASUJ. Всё прошедшее время и причастия при этом держат -owa-: DOPASOWAŁ, DOPASOWANY, DOPASOWANIE. Так что основа ведёт себя как у всех глаголов этого класса, и запомнить достаточно одну пару: DOPASOWAĆ при DOPASUJĘ." }
  - { kind: usage, text: "Страдательное причастие стало обычным прилагательным и в магазине одежды слышно постоянно: DOPASOWANY значит «облегающий, по фигуре». DOPASOWANA KOSZULA — рубашка по фигуре, в отличие от LUŹNA «свободной». В переносном смысле то же слово значит «подходящий друг другу»: DOBRZE DOPASOWANA PARA — «хорошо подобранная пара». Существительное DOPASOWANIE — «подгонка, соответствие», и в технических текстах оно стоит там, где русский скажет «подгонка» или «адаптация»." }
