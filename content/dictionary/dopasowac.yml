etymology: "Приставка do- со значением «до нужной меры» и PASOWAĆ, из немецкого passen «подходить, быть впору», пришедшего в польский через ремесленную речь. Русское «пасовать» — из того же немецкого гнезда, но через французское passer и карточную игру, поэтому смыслы разошлись: польский взял «подходить», русский «уступать». Приставка do- здесь та же, что в DOPILNOWAĆ и DOKOŃCZYĆ: доводит действие до нужного результата."
memory: "pasować — это «подходить, быть впору», а не «пасовать». И управление с DO: dopasować drzwi DO framugi, а не «к наличнику»."
idioms:
  - { pl: "dobrze dopasowana para", ru: "хорошо подобранная пара" }
  - { pl: "to mi nie pasuje", ru: "это мне не подходит" }
