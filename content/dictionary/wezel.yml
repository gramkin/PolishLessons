etymology: "От праславянского корня со значением вязания, того же, что дал русские «узел», «узы» и «вязать». Носовой гласный, который в польском сохранился как Ę, в русском дал У: WĘZEŁ и «узел», WĄŻ и «уж», WIĘZIENIE и «узилище». Это одно из самых полезных соответствий между языками, потому что носовые в польском остались на виду, а в русском исчезли, и зная правило, можно восстановить родство почти всегда."
memory: "Родственник русского «узла», хотя на вид непохож: носовой ę польского отвечает русскому у. Węzeł и «узел», wąż и «уж», wiązać и «вязать». Значения совпадают целиком, вплоть до морского узла как меры скорости. Беглое e выпадает: węzeł, но węzła, а в местном падеже основа смягчается до w węźle. Читается «вэ́нзэу», потому что ł это «у», а не «л». Węzeł gordyjski знают оба языка."
idioms:
