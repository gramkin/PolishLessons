notes:
  - { kind: false-friend, text: "Слово родственно русскому «узлу», хотя на вид это незаметно. Оба идут от глагола вязать: польское WIĄZAĆ и русское «вязать», и носовой гласный польского отвечает русскому У или Я. WĘZEŁ и «узел», WIĄZAĆ и «вязать», WĄŻ и «уж», PIĘĆ и «пять». Это соответствие стоит запомнить целиком: оно превращает десятки непонятных польских слов в узнаваемые. Значения совпадают полностью, включая морскую меру скорости." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Беглое E выпадает в косвенных падежах: WĘZEŁ, но WĘZŁA, WĘZŁEM. В местном падеже вдобавок смягчается основа и Ł переходит в Ź: WĘZEŁ, но W WĘŹLE. Это чередование для русского уха неожиданно, потому что в русском «узел — в узле» ничего подобного не происходит, и форму WĘŹLE приходится просто запомнить." }
  - { kind: government, text: "Завязать узел — ZAWIĄZAĆ WĘZEŁ, винительный без предлога. Развязать — ROZWIĄZAĆ WĘZEŁ, и тот же глагол значит «решить задачу», как и русское «разрешить». На узле — предлог NA с местным падежом: NA WĘŹLE KOLEJOWYM. О скорости говорят родительным множественного после числительного: DWADZIEŚCIA WĘZŁÓW «двадцать узлов»." }
  - { kind: pronunciation, text: "Читается «вэ́нзэу», два слога, ударение на первом. Носовое Ę перед Z даёт «эн», а конечное Ł даёт «у», так что слово кончается не на «л». В родительном WĘZŁA слышно «вэ́нзуа», с тем же «у» в середине. А в местном падеже WĘŹLE буква Ź даёт мягкое «зь», и получается «вэ́ньзле», совсем непохоже на именительный." }
  - { kind: register, text: "Слово нейтральное и работает сразу в нескольких областях. В быту и у моряков это узел на верёвке: ZAWIĄZAĆ WĘZEŁ, WĘZEŁ MARYNARSKI. В транспорте это узел дорог: WĘZEŁ KOLEJOWY, WĘZEŁ AUTOSTRADOWY «развязка». В мореплавании это мера скорости, одна морская миля в час. Переносно WĘZEŁ GORDYJSKI означает задачу, которую нельзя распутать и приходится разрубать, и оборот этот знают оба языка." }
