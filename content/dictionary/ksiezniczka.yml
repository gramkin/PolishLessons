# review
id: ksiezniczka
format: 2
lemma: "księżniczka"
rank: 1571
pos: noun
pron: { cyr: "ксьенжни́чка" }
senses:
  - id: princess
    ru: "принцесса, княжна (дочь короля или князя)"
    examples:
      - pl: "Córka króla to księżniczka."
        ru: "Дочь короля - принцесса."
        source: { kind: tatoeba, id: 6154730 }
      - pl: "Dawno, dawno temu żyła sobie piękna księżniczka."
        ru: "Давным-давно жила-была прекрасная принцесса."
        source: { kind: translated, id: 712367 }
      - pl: "Księżniczka leżała z zamkniętymi oczami."
        ru: "Принцесса лежала с закрытыми глазами."
        source: { kind: translated, id: 3099735 }
  - id: like-princess
    ru: "принцесса (в сравнении и в обращении)"
    examples:
      - pl: "Czuję się jak księżniczka z bajki."
        ru: "Я чувствую себя как принцесса из сказки."
        source: { kind: translated, id: 6156327 }
      - pl: "Naprawdę jesteś księżniczką?"
        ru: "Ты правда принцесса?"
        source: { kind: translated, id: 10570422 }
      - pl: "Księżniczko, nie pij tego napoju."
        ru: "Принцесса, не пей этот напиток."
        source: { kind: translated, id: 930400 }
notes:
  - { kind: usage, text: "Образовано от książę «князь, принц». Мужская пара — książę, а жена князя — księżna, тогда как księżniczka — его дочь." }
  - { kind: usage, text: "Склоняется как существительное на -ka: księżniczki, księżniczce, księżniczkę." }
  - { kind: usage, text: "Звательная форма księżniczko используется в обращении: Księżniczko, nie pij tego napoju." }
  - { kind: false-friend, text: "Русские «княжна» и «принцесса» покрываются в польском одним словом księżniczka; разницу видно только из контекста." }
collocations:
  - { pl: "piękna księżniczka", ru: "прекрасная принцесса" }
  - { pl: "księżniczka z bajki", ru: "принцесса из сказки" }
  - { pl: "rola księżniczki", ru: "роль принцессы" }
etymology: "От książę «князь» (праславянское *kъnędzь — то же слово, что русское «князь»), через księżna «княгиня». Русское «княжна» построено от того же корня тем же способом."
memory: "księżniczka = «принцесса, княжна» — дочь князя или короля. Держите цепочку родственников: książę «князь, принц» → księżna «княгиня» → księżniczka «княжна». Обращение — księżniczko!"
idioms:
  - { pl: "księżniczka z bajki", ru: "принцесса из сказки" }
  - { pl: "śpiąca księżniczka", ru: "спящая красавица" }
  - { pl: "czuć się jak księżniczka", ru: "чувствовать себя принцессой" }
