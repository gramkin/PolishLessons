notes:
  - { kind: false-friend, text: "NAWYK это «привычка», а не «навык». Русский навык, то есть умение, по-польски UMIEJĘTNOŚĆ или WPRAWA. Корень при этом общий и подсказывает верно: WYK-, тот же, что в русских «привыкнуть» и «привычка». Польские NAWYKAĆ и PRZYWYKNĄĆ значат именно «привыкать», так что от глагола смысл восстанавливается точно, а от существительного ведёт в сторону." }
  - { kind: usage, text: "Девять форм, мужской род, неодушевлённое. Беглого E нет, основа держится целиком. Множественное NAWYKI очень частое, потому что о привычках обычно говорят во множественном: NAWYKI ŻYWIENIOWE «пищевые привычки», DOBRE NAWYKI. Оборот Z NAWYKU, с родительным, работает как наречие и значит «по привычке»." }
  - { kind: government, text: "По привычке — Z NAWYKU, предлог Z с родительным, тогда как русский говорит «по привычке», с дательным. Это расхождение стоит запомнить, потому что оборот очень частый. Выработать привычку — WYROBIĆ NAWYK, винительный без предлога. Привычка к чему-либо — NAWYK CZEGOŚ, родительный: NAWYK CZYTANIA «привычка к чтению»." }
  - { kind: pronunciation, text: "Читается «на́вык», два слога, ударение на первом, и звучит почти как русский «навык», что и делает ловушку такой удобной. Буква Y даёт «ы», а W между гласными остаётся звонким «в». В местном падеже NAWYKU слышно «на́выку». В глаголе PRZYWYKNĄĆ носовое Ą даёт «он»: «пшивы́кнонць»." }
  - { kind: register, text: "Слово нейтральное и частое, особенно в разговоре о здоровье и воспитании: DOBRE NAWYKI, ZŁE NAWYKI, NAWYKI ŻYWIENIOWE, WYROBIĆ NAWYK. В педагогике и медицине оно стоит в каждом втором тексте. Оборот Z NAWYKU описывает действие, сделанное не думая, и звучит он слегка оправдательно: ZROBIŁEM TO Z NAWYKU." }
