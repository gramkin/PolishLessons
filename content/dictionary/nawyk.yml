etymology: "От NAWYKNĄĆ «привыкнуть», от праславянского корня, давшего русские «привыкнуть», «привычку», «обычай» и сам «навык». Корень один, а существительные разошлись: русский закрепил за «навыком» умение, то есть результат обучения, а польский — привычку, то есть результат повторения. Разница тонкая и потому опасная: и то и другое приходит от повторяемого действия, но говорят об этом разными словами."
memory: "Ловушка близкая и потому опасная: nawyk это «привычка», а не «навык». Навык в смысле умения по-польски umiejętność или wprawa. Корень общий, wyk-, и глаголы подсказывают верно: nawykać и przywyknąć значат «привыкать». Управление расходится: z nawyku, родительный, где русский говорит «по привычке», с дательным. Читается «на́вык», почти как русское слово."
idioms:
  - { pl: "z nawyku", ru: "по привычке" }
