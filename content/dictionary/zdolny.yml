# review
id: zdolny
format: 2
lemma: "zdolny"
rank: 1736
pos: adj
pron: { cyr: "здо́льны" }
senses:
  - id: talented
    ru: "способный, одарённый"
    examples:
      - pl: "Tom jest bardzo zdolny."
        ru: "Том очень способный."
        source: { kind: translated, id: 2209883 }
      - pl: "Był młody, ale zdolny."
        ru: "Он был молод, но способен."
        source: { kind: translated, id: 356559 }
      - pl: "Józef jest zdolnym ekonomistą."
        ru: "Джозеф — способный экономист."
        source: { kind: tatoeba, id: 3661094 }
  - id: capable-of
    ru: "способный на что-либо, к чему-либо"
    examples:
      - pl: "Jesteś zdolny do wszystkiego."
        ru: "Ты способен на всё."
        source: { kind: translated, id: 4458152 }
      - pl: "Ona nie jest zdolna do oszustwa."
        ru: "Она не способна на обман."
        source: { kind: translated, id: 814243 }
      - pl: "On jest zdolny do kradzieży."
        ru: "Он способен на кражу."
        source: { kind: translated, id: 739320 }
notes:
  - { kind: government, text: "Способный на что-то — zdolny do czegoś, с предлогом do и родительным падежом: zdolny do wszystkiego «способен на всё». Русское «способен на» требует винительного — это расхождение." }
  - { kind: usage, text: "Без дополнения слово значит «одарённый»: zdolny uczeń «способный ученик», zdolny prawnik «способный юрист»." }
  - { kind: usage, text: "Превосходная степень — najzdolniejszy: najzdolniejsza dziewczynka w szkole, nawet najzdolniejsi studenci." }
  - { kind: usage, text: "Существительное — zdolność «способность»; глагол umieć «уметь»." }
  - { kind: usage, text: "zdolen — короткая сказуемостная форма, книжная и слегка устаревшая: nie był zdolen do pracy. В обычной речи говорят zdolny. Тот же ряд, что wesół, zdrów, gotów." }
collocations:
  - { pl: "zdolny uczeń", ru: "способный ученик" }
  - { pl: "zdolny do wszystkiego", ru: "способен на всё" }
  - { pl: "bardzo zdolny", ru: "очень способный" }
family:
  - { pl: "zdolność", ru: "способность", relation: root }
  - { pl: "umieć", ru: "уметь", relation: root, id: umiec }
  - { pl: "talent", ru: "талант", relation: root, id: talent }
etymology: "От zdolać «осилить», того же корня, что dola «доля, участь». Русское «способный» построено от «способ» — образ другой, смысл тот же."
memory: "zdolny — «способный»: zdolny uczeń. На что-то — zdolny do czegoś, с родительным падежом, где русский говорит «способен на»."
idioms:
  - { pl: "zdolny uczeń", ru: "способный ученик" }
  - { pl: "zdolny do wszystkiego", ru: "способен на всё" }
  - { pl: "bardzo zdolny", ru: "очень способный" }
