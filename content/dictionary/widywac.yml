pron: { cyr: "виды́ваць" }
senses:
  - id: see-occasionally
    ru: "видеть время от времени, видать"
    examples:
      - pl: "Widuję go w parku co rano."
        ru: "Я вижу его в парке каждое утро."
        source: { kind: authored }
      - pl: "Widywał ją na targu w piątki."
        ru: "Он видел её на базаре по пятницам."
        source: { kind: authored }
      - pl: "Widywano go w tej kawiarni."
        ru: "Его видели в этом кафе."
        source: { kind: authored }
  - id: meet-regularly
    ru: "widywać się z kimś — видеться с кем-л."
    examples:
      - pl: "Widujemy się raz w roku."
        ru: "Мы видимся раз в год."
        source: { kind: authored }
      - pl: "Przestali się widywać po tej kłótni."
        ru: "Они перестали видеться после той ссоры."
        source: { kind: authored }
  - id: seen-rarely
    ru: "widywany — изредка видимый, встречающийся"
    examples:
      - pl: "Te ptaki są rzadko widywane w mieście."
        ru: "Эти птицы редко встречаются в городе."
        source: { kind: authored }
      - pl: "Był widywany z nią w parku."
        ru: "Его видели с ней в парке."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Это МНОГОКРАТНЫЙ глагол, и в этом вся его суть. Польский образует от widzieć особую форму на -ywa- со значением «видеть не раз, время от времени»: widuję go czasem. Русский такой формы в нейтральном слое не имеет — ближайшее «видать» и «видаться» звучат разговорно, — поэтому по-русски приходится добавлять наречие: «иногда вижу», «видимся редко». Поляку хватает одного слова." }
  - { kind: false-friend, text: "Корень прозрачен: widzieć отвечает русскому «видеть», праславянское *viděti. И многократное «видать» — тот же приём, что польское widywać, только в русском оно осталось в разговорном слое, а в польском совершенно нейтрально. Так что widywać переводится как «видать» по образованию, но как «иногда видеть» по стилю." }
  - { kind: government, text: "Видят КОГО — винительный: widywać kogoś. Видеться С КЕМ — возвратное się плюс z с ТВОРИТЕЛЬНЫМ: widywać się Z kimś, в точности как русское «видеться с кем-то». Безличное widywano go значит «его видели» — и подразумевает неоднократность." }
  - { kind: pronunciation, text: "Основа настоящего времени меняется: -ywa- уступает место -uj-, то есть widywać, но widuję, widujesz. Тот же образец, что у poszukiwać — poszukuję и wykorzystywać — wykorzystuję. Польский строит такие многократные глаголы охотно: bywać «бывать», jadać «есть время от времени», sypiać «спать», czytywać «почитывать»." }
collocations:
  - { pl: "widywać się z kimś", ru: "видеться с кем-л." }
  - { pl: "rzadko widywany", ru: "редко встречающийся" }
  - { pl: "widywano go", ru: "его видели" }
family:
  - { pl: "widzieć", ru: "видеть", relation: root, id: widziec }
  - { pl: "bywać", ru: "бывать", relation: derived }
  - { pl: "widok", ru: "вид", relation: derived, id: widok }
etymology: "Многократная форма от widzieć, праславянское *viděti — то же слово, что русское «видеть». Суффикс -ywa- придаёт повторяемость, и русский знает тот же приём в слове «видать». Польский строит такие глаголы целым рядом: bywać, jadać, sypiać, czytywać — и все они значат «делать время от времени»."
memory: "widywać — «видеть время от времени», многократная форма от widzieć. По-русски нужно наречие («иногда вижу»), по-польски хватает слова. Основа меняется: widuję, как poszukuję. И запомните родню: bywać, jadać, sypiać — тот же приём."
idioms:
  - { pl: "widywać się z kimś", ru: "видеться с кем-л." }
  - { pl: "rzadko widywany gość", ru: "редкий гость" }
