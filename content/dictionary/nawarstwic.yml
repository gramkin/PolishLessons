senses:
  - id: pile-up
    ru: "nawarstwić się: накопиться, наслоиться (о проблемах, долгах, обидах)"
    examples:
      - pl: "Przez ostatni rok nawarstwiło się dużo problemów."
        ru: "За последний год накопилось много проблем."
        source: { kind: authored }
      - pl: "Między nimi nawarstwiły się stare urazy."
        ru: "Между ними накопились старые обиды."
        source: { kind: authored }
      - pl: "W firmie nawarstwiły się długi."
        ru: "У фирмы накопились долги."
        source: { kind: authored }
  - id: layer
    ru: "наложить слоями, наслоить"
    examples:
      - pl: "Malarz nawarstwił farbę bardzo grubo."
        ru: "Художник наложил краску очень толстым слоем."
        source: { kind: authored }
      - pl: "Rzeka przez wieki nawarstwiła tu muł i piasek."
        ru: "Река за века наслоила здесь ил и песок."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Совершенный вид; несовершенный — NAWARSTWIAĆ. Чаще всего глагол употребляется с SIĘ: PROBLEMY SIĘ NAWARSTWIŁY «проблемы накопились, навалились одна на другую». Без SIĘ — «наложить слоями»: NAWARSTWIĆ FARBĘ, NAWARSTWIĆ ZIEMIĘ." }
  - { kind: government, text: "Без SIĘ — что: винительный (NAWARSTWIĆ FARBĘ). С SIĘ подлежащее — то, что копится: ZALEGŁOŚCI SIĘ NAWARSTWIŁY. Мужско-личное страдательное NAWARSTWIENI в карточку не включено: наслаивают краску, землю, проблемы, а не людей." }
  - { kind: pronunciation, text: "Читается «нава́рстфиць»: W после глухого T оглушается в «ф». Повелительное — NAWARSTW, NAWARSTWCIE, как UŁATW от UŁATWIĆ; вариант NAWARSTWIJ в карточку не включён." }
