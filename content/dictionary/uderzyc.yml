# review
id: uderzyc
format: 2
lemma: "uderzyć"
rank: 612
pos: verb
aspect: perf
pron: { cyr: "удэ́жыць" }
senses:
  - id: hit
    ru: "ударить (кого-л. — винительный)"
    note: "Место удара — через w с винительным: uderzyć kogoś w twarz."
    examples:
      - pl: "Uderzył go płazem miecza."
        ru: "Он ударил его плашмя мечом."
        source: { kind: tatoeba, id: 6155798 }
      - pl: "Uderzyłem Toma."
        ru: "Я ударил Тома."
        source: { kind: translated, id: 2774722 }
      - pl: "Uderzyła go."
        ru: "Она его ударила."
        source: { kind: translated, id: 9671821 }
  - id: strike-into
    ru: "uderzyć w coś — удариться обо что-л., врезаться"
    note: "Uderzył grom «Грянул гром» — буквально «ударил гром»."
    examples:
      - pl: "Uderzył grom."
        ru: "Грянул гром."
        source: { kind: translated, id: 711043 }
      - pl: "Uderzyliśmy w coś?"
        ru: "Мы во что-то врезались?"
        source: { kind: translated, id: 3743286 }
      - pl: "Tajfun nie powinien uderzyć przed rankiem."
        ru: "Тайфун не должен ударить раньше утра."
        source: { kind: translated, id: 989513 }
  - id: blow
    ru: "uderzenie — удар"
    note: "odporny na uderzenia «ударопрочный»."
    examples:
      - pl: "On ma znakomite uderzenie."
        ru: "У него отличный удар."
        source: { kind: translated, id: 359175 }
      - pl: "Ten zegarek jest odporny na uderzenia."
        ru: "Эти часы ударопрочные."
        source: { kind: translated, id: 1185402 }
      - pl: "Po drugim uderzeniu rozpłakałem się."
        ru: "После второго удара я расплакался."
        source: { kind: translated, id: 765777 }
notes:
  - { kind: government, text: "Бьют кого — винительный: uderzył go. А место удара поляки вводят через w с винительным: uderzyć kogoś w twarz, w głowę, w brzuch. Русский здесь берёт предлог «по» с дательным — «ударить по лицу», так что и предлог, и падеж приходится менять." }
  - { kind: usage, text: "Несовершенный вид — uderzać: uderzał go raz za razem." }
  - { kind: usage, text: "Без прямого дополнения значит «врезаться, ударить»: auto uderzyło w drzewo «машина врезалась в дерево», uderzył grom «грянул гром», tajfun uderzy nad ranem." }
  - { kind: usage, text: "Существительное — uderzenie «удар»: jednym uderzeniem «одним ударом», odporny na uderzenia «ударопрочный»." }
collocations:
  - { pl: "uderzyć w twarz", ru: "ударить по лицу" }
  - { pl: "uderzyć w stół", ru: "ударить по столу" }
  - { pl: "uderzenie pioruna", ru: "удар молнии" }
  - { pl: "odporny na uderzenia", ru: "ударопрочный" }
family:
  - { pl: "uderzać", ru: "ударять", relation: aspect }
  - { pl: "uderzenie", ru: "удар", relation: derived }
  - { pl: "uderzenie pioruna", ru: "удар молнии", relation: derived }
etymology: "Приставка u- плюс старый корень *der- «бить, драть» — тот же, что в русском «ударить» и «удар». Слова соответствуют друг другу напрямую."
memory: "uderzyć — «ударить», и само слово узнаётся сразу. Разница прячется в управлении: место удара поляк вводит через w с винительным — uderzyć kogoś w twarz, w głowę, w brzuch, — тогда как русский берёт «по» с дательным, «ударить по лицу». Несовершенный вид — uderzać. И запомните uderzył grom «грянул гром»: по-польски гром буквально ударяет."
idioms:
  - { pl: "uderz w stół, a nożyce się odezwą", ru: "на воре шапка горит" }
  - { pl: "uderzyć do głowy", ru: "ударить в голову" }
  - { pl: "uderzyć w czuły punkt", ru: "задеть за живое" }
