etymology: "От KOMPLET, из латинского completus «наполненный», причастия от complere «наполнять» — приставка com- и plere «полнить», родственное полному и «полному» по корню через индоевропейское *pel-. Русский взял из того же латинского источника «комплект» и «комплектный», но оставил их при вещах и составах, тогда как польский пустил слово в усилители и говорит kompletny idiota там, где русский скажет «полный»."
memory: "В быту это усилитель: kompletny idiota, kompletna cisza — «полный», а не «комплектный». И множественное мужское личное: kompletniejsi, с -ejś-."
