        ru: "Это полная чушь."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Самое частое употребление — усилительное: KOMPLETNY IDIOTA «полный идиот», KOMPLETNA CISZA «полная тишина», KOMPLETNY BAŁAGAN «полный бардак». Русское «комплектный» сюда не подходит ни разу: оно узкотехническое, а польское слово в быту значит «совершенный, абсолютный» и ставится перед любым существительным, которое хочется усилить. Техническое значение «полный по составу» у слова тоже есть — kompletny zestaw, — но в разговоре оно уступает первому." }
  - { kind: usage, text: "Тридцать три формы, то есть степени KOMPLETNIEJSZY и NAJKOMPLETNIEJSZY морфология образует. Смысл им, однако, сопротивляется: полное полнее не бывает. Поэтому живут они там, где слово значит «более обстоятельный, более исчерпывающий» — kompletniejszy katalog, — или в спортивном смысле «разносторонний»: kompletny zawodnik. Сравните WIECZNY: смысл столь же предельный, но там и морфология отказывается, одиннадцать форм без степеней вовсе. Значит смысловая предельность и морфологическая градуируемость независимы друг от друга — словарь способен построить степень, которой значение сопротивляется, и наоборот." }
  - { kind: usage, text: "Мужская личная форма множественного — KOMPLETNI в положительной степени, но KOMPLETNIEJSI в сравнительной: суффикс -ejsz- смягчается в -ejś- перед окончанием -i. Ровно то же у typowszy — TYPOWSI из этой же партии и у starszy — STARSI. Написания kompletniejszi не бывает." }
