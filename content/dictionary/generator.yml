pron: { cyr: "гэнэра́тор" }
senses:
  - id: generator
    ru: "генератор (электрический)"
    examples:
      - pl: "Po awarii włączono generator."
        ru: "После аварии включили генератор."
        source: { kind: authored }
      - pl: "Szpital ma własny generator prądu."
        ru: "У больницы есть собственный генератор."
        source: { kind: authored }
      - pl: "Generator hałasował całą noc."
        ru: "Генератор шумел всю ночь."
        source: { kind: authored }
  - id: source
    ru: "генератор, источник (идей, кодов)"
    examples:
      - pl: "Generator haseł tworzy bezpieczne hasła."
        ru: "Генератор паролей создаёт надёжные пароли."
        source: { kind: authored }
      - pl: "Był prawdziwym generatorem pomysłów."
        ru: "Он был настоящим генератором идей."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "GENERATOR — «генератор», как в русском, читается «гэнэра́тор» с твёрдыми E. Агрегат на стройке — AGREGAT PRĄDOTWÓRCZY, в разговоре просто GENERATOR. Не путайте с GENERAŁ — «генерал»." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Родительный — GENERATORA, с -A. В местном R переходит в RZ: W GENERATORZE." }
  - { kind: government, text: "Включить генератор — WŁĄCZYĆ GENERATOR, винительный. Работать от генератора — DZIAŁAĆ NA GENERATORZE, местный. Генератор чего — родительный: GENERATOR PRĄDU." }
  - { kind: pronunciation, text: "Читается «гэнэра́тор»: GE и NE — твёрдые «гэ», «нэ». Ударение на предпоследнем слоге. GENERATORZE — «гэнэрато́жэ»." }
collocations:
  - { pl: "generator prądu", ru: "электрогенератор" }
  - { pl: "włączyć generator", ru: "включить генератор" }
  - { pl: "generator pomysłów", ru: "генератор идей" }
family:
  - { pl: "prąd", ru: "ток, электричество", relation: root, id: prad }
  - { pl: "silnik", ru: "двигатель", relation: root, id: silnik }
  - { pl: "energia", ru: "энергия", relation: root, id: energia }
etymology: "Из латинского GENERATOR «производитель», от GENERARE «порождать». Русское «генератор» — то же слово."
