id: grill
format: 2
lemma: "grill"
rank: 4364
pos: noun
pron: { cyr: "гриль" }
senses:
  - id: grill
    ru: "гриль, мангал"
    examples:
      - pl: "Rozpaliliśmy grill w ogrodzie."
        ru: "Мы разожгли гриль в саду."
        source: { kind: authored }
      - pl: "Kiełbaski z grilla są najlepsze."
        ru: "Колбаски с гриля — самые вкусные."
        source: { kind: authored }
      - pl: "Kupiłem nowy grill gazowy."
        ru: "Я купил новый газовый гриль."
        source: { kind: authored }
  - id: party
    ru: "шашлыки, вечеринка с грилем"
    examples:
      - pl: "W sobotę robimy grilla u sąsiadów."
        ru: "В субботу у соседей жарим шашлыки."
        source: { kind: authored }
      - pl: "Zaprosili nas na grilla."
        ru: "Нас позвали на шашлыки."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "GRILL — и сам гриль, и встреча у гриля: IŚĆ NA GRILLA — «пойти на шашлыки». Это главный польский летний ритуал. Шашлык на шампуре — SZASZŁYK, но вечеринка — всё равно GRILL." }
  - { kind: usage, text: "Мужской род, неодушевлённое. Винительный в значении «вечеринка» — GRILLA, как у названий событий: ROBIĆ GRILLA. Родительный множественного — GRILLI или GRILLÓW; учим GRILLÓW." }
  - { kind: government, text: "Пойти на шашлыки — IŚĆ NA GRILLA, NA с винительным. С гриля — Z GRILLA, родительный. На гриле — NA GRILLU, местный." }
  - { kind: pronunciation, text: "Читается «гриль», один слог: двойное LL звучит как одно мягкое «ль»." }
collocations:
  - { pl: "rozpalić grilla", ru: "разжечь гриль" }
  - { pl: "iść na grilla", ru: "пойти на шашлыки" }
  - { pl: "z grilla", ru: "жаренный на гриле" }
family:
  - { pl: "grillować", ru: "жарить на гриле", relation: derived }
  - { pl: "kiełbasa", ru: "колбаса", relation: root }
  - { pl: "ognisko", ru: "костёр", relation: root, id: ognisko }
etymology: "Из английского GRILL, а оно из французского GRIL «решётка», от латинского CRATICULA «маленькая решётка»."
memory: "Grill — гриль и шашлыки. Iść na grilla — пойти на шашлыки. Na grillu — на гриле. Читается «гриль»."
idioms:
  - { pl: "robić grilla", ru: "устраивать шашлыки" }
formExamplesSkip:
  - { form: "grilli", reason: "вариант родительного множественного, учим GRILLÓW" }
  - { form: "grillu", cell: "Звательный", reason: "звательный падеж: для неодушевлённого существительного он практически не употребляется" }
