# review
id: zgasic
format: 2
lemma: "zgasić"
rank: 2252
pos: verb
aspect: perf
pron: { cyr: "зга́сиць" }
senses:
  - id: turn-off
    ru: "погасить, потушить (свет, огонь)"
    examples:
      - pl: "Tom zgasił światło."
        ru: "Том погасил свет."
        source: { kind: tatoeba, id: 8108746 }
      - pl: "Możesz zgasić światło?"
        ru: "Можешь погасить свет?"
        source: { kind: translated, id: 360356 }
      - pl: "Zgaś światło."
        ru: "Погаси свет."
        source: { kind: translated, id: 352854 }
  - id: put-out
    ru: "затушить; осадить (кого-л.)"
    examples:
      - pl: "On zgasił ogień."
        ru: "Он потушил огонь."
        source: { kind: translated, id: 528065 }
      - pl: "Mary zgasiła Toma jednym spojrzeniem."
        ru: "Мэри осадила Тома одним взглядом."
        source: { kind: translated, id: 6534522 }
notes:
  - { kind: government, text: "Винительный падеж: zgasić światło «погасить свет», zgasić ogień «потушить огонь»." }
  - { kind: usage, text: "Переносное «осадить, поставить на место» тоже живо: zgasiła go jednym spojrzeniem. Причастие zgaszony значит «подавленный, потухший» о человеке." }
  - { kind: false-friend, text: "Корень gasić «гасить» — ср. русское «гасить», «погасить». Здесь языки совпадают." }
  - { kind: usage, text: "Несовершенный вид — gasić. Непереходное «гаснуть» — gasnąć." }
collocations:
  - { pl: "zgasić światło", ru: "погасить свет" }
  - { pl: "zgasić ogień", ru: "потушить огонь" }
etymology: "z- + gasić «гасить», праславянское *gasiti; ср. русское «гасить», «погасить»."
memory: "zgasić — «погасить, потушить». Переносно значит «осадить»: zgasiła go spojrzeniem. Причастие zgaszony о человеке — «подавленный». Несовершенный вид — gasić."
idioms:
  - { pl: "zgasić światło", ru: "погасить свет" }
