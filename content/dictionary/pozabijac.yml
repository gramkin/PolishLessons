# review
id: pozabijac
format: 2
lemma: "pozabijać"
rank: 5203
pos: verb
pron: { cyr: "позаби́яць" }
senses:
  - id: kill-all
    ru: "перебить, убить многих (всех)"
    examples:
      - pl: "Pozabijał wszystkie komary w namiocie."
        ru: "Он перебил всех комаров в палатке."
        source: { kind: authored }
      - pl: "Lis pozabijał kury."
        ru: "Лиса передушила кур."
        source: { kind: authored }
      - pl: "Mrozy pozabijały owady."
        ru: "Морозы погубили насекомых."
        source: { kind: authored }
  - id: board-up
    ru: "заколотить (все, одно за другим)"
    examples:
      - pl: "Pozabijali okna i opuścili dom."
        ru: "Они заколотили окна и покинули дом."
        source: { kind: authored }
      - pl: "Pozabijaj okna deskami przed huraganem."
        ru: "Заколоти окна досками перед ураганом."
        source: { kind: authored }
  - id: fight
    ru: "разг. с SIĘ — поубивать друг друга (преувеличение)"
    examples:
      - pl: "Pozabijają się o ostatni kawałek pizzy."
        ru: "Они поубивают друг друга из-за последнего куска пиццы."
        source: { kind: authored }
      - pl: "Prawie się pozabijali o pieniądze."
        ru: "Они чуть не поубивали друг друга из-за денег."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "POZABIJAĆ — «перебить многих, всех», а не «позабыть»: «позабыть» — ZAPOMNIEĆ. Ещё — «заколотить»: POZABIJAĆ OKNA DESKAMI. Одного — ZABIĆ." }
  - { kind: usage, text: "Пятьдесят три формы. Совершенный вид с распределительным значением «одного за другим, всех». Спряжение на -AM: POZABIJAM, POZABIJASZ, POZABIJAJĄ; повелительное POZABIJAJ. POZABIJANI — о многих убитых, обычно в историческом тексте." }
  - { kind: government, text: "Кого или что — винительный: POZABIJAĆ MUCHY, OKNA. Чем — творительный: POZABIJAĆ DESKAMI, PACKĄ. С SIĘ — из-за чего: O с винительным: O PIENIĄDZE." }
  - { kind: pronunciation, text: "Читается «позаби́яць»: BIJ — «бий», ударение на предпоследнем слоге. POZABIJAM — «позаби́ям»." }
  - { kind: register, text: "Разговорное слово. POZABIJAJĄ SIĘ — шутливое преувеличение «передерутся». В книжной речи о людях — WYMORDOWAĆ, WYBIĆ." }
collocations:
  - { pl: "pozabijać komary", ru: "перебить комаров" }
  - { pl: "pozabijać okna deskami", ru: "заколотить окна досками" }
  - { pl: "pozabijać się o coś", ru: "передраться из-за чего-то" }
family:
  - { pl: "zabić", ru: "убить; забить", relation: root, id: zabic }
  - { pl: "zabijać", ru: "убивать; забивать", relation: derived, id: zabijac }
  - { pl: "bić", ru: "бить", relation: root, id: bic }
etymology: "Приставка PO- плюс ZABIJAĆ «убивать; забивать», от BIĆ «бить», праславянское *biti. Приставка PO- придаёт смысл «многих, одного за другим», как в русском «поубивать», «позабивать»."
memory: "Pozabijać — перебить всех: pozabijał komary. Pozabijać okna — заколотить окна. Pozabijają się — передерутся. Читается «позаби́яць»."
idioms:
  - { pl: "pozabijać się o coś", ru: "передраться насмерть из-за чего-то" }
