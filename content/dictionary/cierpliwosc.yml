notes:
  - { kind: government, text: "Женский род на -ść: ta cierpliwość, tej cierpliwości." }
  - { kind: usage, text: "Возглас Cierpliwości! «Терпение!» стоит в родительном падеже — это старая форма призыва, а не именительный." }
  - { kind: false-friend, text: "Корень cierpieć «терпеть, страдать» — ровно как русское «терпение» от «терпеть»." }
  - { kind: usage, text: "stracić cierpliwość «потерять терпение», uzbroić się w cierpliwość «вооружиться терпением»." }
  - { kind: government, text: "Слово называет свойство и множественного числа не имеет: терпение не считают. Живёт единственное — mieć cierpliwość, uzbroić się w cierpliwość." }
collocations:
