# review
id: plus
format: 2
lemma: "plus"
rank: 2315
pos: noun
pron: { cyr: "плюс" }
senses:
  - id: plus-sign
    ru: "плюс (знак)"
    examples:
      - pl: "Postaw plus przy poprawnej odpowiedzi."
        ru: "Поставь плюс у правильного ответа."
        source: { kind: authored }
      - pl: "Dwa plus dwa równa się cztery."
        ru: "Два плюс два равно четыре."
        source: { kind: authored }
  - id: advantage
    ru: "плюс, преимущество"
    examples:
      - pl: "To duży plus tej oferty."
        ru: "Это большой плюс этого предложения."
        source: { kind: authored }
      - pl: "Wymieniła same plusy, ani jednego minusa."
        ru: "Она перечислила одни плюсы, ни одного минуса."
        source: { kind: authored }
  - id: in-the-black
    ru: "na plus — в плюс"
    examples:
      - pl: "Firma wyszła na plus po dwóch latach."
        ru: "Фирма вышла в плюс через два года."
        source: { kind: authored }
notes:
  - { kind: pronunciation, text: "РОДИТЕЛЬНЫЙ НА -A, ХОТЯ СЛОВО НЕОДУШЕВЛЁННОЕ. Говорят plusa, а не «plusu»: bez plusa, postawić plusa. Так ведут себя многие конкретные предметы мужского рода в польском — те, что можно взять в руки или увидеть: mam laptopa, zjadłem banana. Русский такого не делает, и форма с -a поначалу режет слух." }
  - { kind: false-friend, text: "Значения совпадают с русскими полностью: знак, преимущество, положительное число. Запомнить стоит обороты: na plus «в плюс, в пользу», plus minus «примерно, плюс-минус», wyjść na plus «выйти в плюс». Все три переносятся на русский дословно." }
  - { kind: usage, text: "Прилагательное plusowy «плюсовой», наречие plusowo. Антоним minus склоняется так же: minusa, minusy. В школьной речи plus это ещё и поощрительная отметка: dostać plusa za aktywność «получить плюс за активность»." }
collocations:
  - { pl: "na plus", ru: "в плюс, в пользу" }
  - { pl: "plus minus", ru: "примерно, плюс-минус" }
  - { pl: "wyjść na plus", ru: "выйти в плюс" }
family:
  - { pl: "minus", ru: "минус", relation: antonym }
  - { pl: "plusowy", ru: "плюсовой", relation: derived }
  - { pl: "zaleta", ru: "достоинство", relation: root }
etymology: "Из латинского plus «больше», сравнительной степени от multus «многий» — того же корня, что plural и plus-quam-perfectum. В оба языка слово пришло как математический знак и только потом стало значить преимущество. Отсюда plusowy, plusik и oborot plus minus."
memory: "plus — «плюс» во всех смыслах. Главная неожиданность в склонении: родительный plusa, с окончанием одушевлённых, хотя предмет неодушевлённый — как mam laptopa и zjadłem banana. Обороты переносятся дословно: na plus, plus minus."
idioms:
  - { pl: "plus minus", ru: "плюс-минус, примерно" }
  - { pl: "wyjść na plus", ru: "выйти в плюс" }
