etymology: "Из nie + spodziewać się «ожидать»: буквально «то, чего не ожидали». Русское «сюрприз» — заимствование из французского, а польский собрал слово из своих частей."
memory: "niespodzianka — «сюрприз», и слово разбирается прозрачно: nie + spodziewać się. Запомните управление: zrobić komuś niespodziankę «сделать кому-то сюрприз» с дательным, и pełen niespodzianek «полный неожиданностей» с родительным."
