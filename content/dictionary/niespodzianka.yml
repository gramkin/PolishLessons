notes:
  - { kind: usage, text: "zrobić komuś niespodziankę — «сделать кому-то сюрприз», с дательным падежом: Chciałbym jej zrobić niespodziankę." }
  - { kind: usage, text: "pełen niespodzianek — «полный неожиданностей», с родительным падежом множественного числа." }
  - { kind: usage, text: "przyjęcie-niespodzianka — «вечеринка-сюрприз». Слово при этом склоняется целиком: na przyjęciu-niespodziance." }
  - { kind: usage, text: "Слово прозрачно разбирается: nie + spodziewać się «ожидать» — буквально «то, чего не ожидали». Русское «сюрприз» — французское заимствование, а поляки построили своё слово от глагола." }
