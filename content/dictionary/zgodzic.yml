# review
id: zgodzic
format: 2
lemma: "zgodzić"
rank: 694
pos: verb
aspect: perf
aspectPair: zgadzac
pron: { cyr: "зго́дзиць" }
senses:
  - id: agree
    ru: "zgodzić się — согласиться"
    note: "Глагол живёт почти только с się."
    examples:
      - pl: "Zgodził się pomóc staruszce."
        ru: "Он согласился помочь старухе."
        source: { kind: tatoeba, id: 2246656 }
      - pl: "Tom się zgodził."
        ru: "Том согласился."
        source: { kind: translated, id: 5629959 }
      - pl: "Wszyscy się zgodzili."
        ru: "Все согласились."
        source: { kind: translated, id: 7556776 }
  - id: agree-to
    ru: "zgodzić się NA coś — согласиться на что-л. (винительный)"
    examples:
      - pl: "Zgodziłem się na propozycję."
        ru: "Я согласился на это предложение."
        source: { kind: tatoeba, id: 580590 }
      - pl: "Nie zgodziła się na propozycję."
        ru: "Она не согласилась на предложение."
        source: { kind: translated, id: 364048 }
      - pl: "Zgodziliśmy się na ten plan."
        ru: "Мы согласились на этот план."
        source: { kind: translated, id: 358759 }
  - id: agree-with
    ru: "zgodzić się Z kimś — согласиться с кем-л. (творительный)"
    note: "Два разных предлога для двух разных смыслов."
    examples:
      - pl: "Nie mogę się z tobą zgodzić."
        ru: "Я не могу с тобой согласиться."
        source: { kind: tatoeba, id: 596515 }
      - pl: "Zgodził się ze mną."
        ru: "Он согласился со мной."
        source: { kind: translated, id: 719688 }
      - pl: "Zgodziła się z moim zdaniem."
        ru: "Она согласилась с моим мнением."
        source: { kind: translated, id: 448855 }
  - id: wont-agree
    ru: "nie zgodzić się — не согласиться, отказать"
    examples:
      - pl: "Obawiam się, że się nie zgodzi."
        ru: "Боюсь, он не согласится."
        source: { kind: tatoeba, id: 4649114 }
      - pl: "Oni nigdy się nie zgodzą!"
        ru: "Они никогда не согласятся!"
        source: { kind: translated, id: 6904721 }
      - pl: "Nie zgodzą się na twoją propozycję."
        ru: "Они не согласятся на твоё предложение."
        source: { kind: translated, id: 356985 }
notes:
  - { kind: government, text: "Два предлога для двух смыслов, и их стоит держать парой. Согласиться НА что-то — zgodzić się NA coś, с винительным: zgodził się na propozycję. Согласиться С кем-то — zgodzić się Z kimś, с творительным: nie mogę się z tobą zgodzić." }
  - { kind: usage, text: "Глагол живёт практически только с się: zgodzić się. Без частицы он почти не употребляется." }
  - { kind: usage, text: "Несовершенный вид — zgadzać się: zgadzam się «согласен», одна из самых частых реплик в разговоре." }
  - { kind: usage, text: "Родня: zgoda «согласие», zgodny «согласный, дружный», Zgoda! «Договорились!»." }
collocations:
  - { pl: "zgodzić się na coś", ru: "согласиться на что-либо" }
  - { pl: "zgodzić się z kimś", ru: "согласиться с кем-либо" }
  - { pl: "zgadzam się", ru: "я согласен" }
  - { pl: "Zgoda!", ru: "Договорились!" }
family:
  - { pl: "zgadzać się", ru: "соглашаться", relation: aspect }
  - { pl: "zgoda", ru: "согласие", relation: derived }
  - { pl: "zgodny", ru: "согласный, дружный", relation: derived }
etymology: "Приставка z- плюс godzić «мирить, ладить», от zgoda «согласие» — то же гнездо, что русские «угодить», «годный» и «год»."
memory: "zgodzić się — «согласиться», и живёт глагол почти только с się. Развести надо два предлога: согласиться НА что-то — zgodzić się NA coś с винительным (zgodził się na propozycję), а согласиться С кем-то — zgodzić się Z kimś с творительным (nie mogę się z tobą zgodzić). Несовершенный вид zgadzać się даёт одну из самых частых реплик разговора: Zgadzam się «Согласен»."
idioms:
  - { pl: "zgodzić się na coś", ru: "согласиться на что-либо" }
  - { pl: "zgodzić się z kimś", ru: "согласиться с кем-либо" }
  - { pl: "zgadzam się", ru: "я согласен" }
