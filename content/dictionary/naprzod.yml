# review
id: naprzod
format: 2
lemma: "naprzód"
rank: 1617
pos: adv
pron: { cyr: "на́пшут" }
senses:
  - id: forward
    ru: "вперёд"
    examples:
      - pl: "Naprzód."
        ru: "Вперёд."
        source: { kind: translated, id: 8745399 }
      - pl: "Krok naprzód."
        ru: "Шаг вперёд."
        source: { kind: translated, id: 5652428 }
      - pl: "Zrobiła krok naprzód, by uścisnąć mu dłoń."
        ru: "Она сделала шаг вперёд, чтобы пожать ему руку."
        source: { kind: translated, id: 956819 }
  - id: in-advance
    ru: "заранее, вперёд (о времени)"
    examples:
      - pl: "Zarezerwowałem pokój trzy tygodnie naprzód."
        ru: "Я забронировал номер за три недели вперёд."
        source: { kind: translated, id: 365787 }
      - pl: "Muszę przesunąć zegarek o dwie minuty naprzód."
        ru: "Мне нужно перевести часы на две минуты вперёд."
        source: { kind: translated, id: 359986 }
      - pl: "To jest wielki krok naprzód."
        ru: "Это большой шаг вперёд."
        source: { kind: translated, id: 4484457 }
notes:
  - { kind: usage, text: "Наречие не склоняется. Значит и «вперёд» в пространстве, и «заранее» во времени: zarezerwować trzy tygodnie naprzód «забронировать за три недели вперёд»." }
  - { kind: usage, text: "krok naprzód — «шаг вперёд», в том числе переносно: to wielki krok naprzód «это большой шаг вперёд»." }
  - { kind: usage, text: "cała naprzód — морская команда «полный вперёд»." }
  - { kind: usage, text: "Разговорный синоним — do przodu; naprzód звучит книжнее и торжественнее." }
collocations:
  - { pl: "krok naprzód", ru: "шаг вперёд" }
  - { pl: "cała naprzód", ru: "полный вперёд" }
  - { pl: "iść naprzód", ru: "идти вперёд" }
etymology: "Из na + przód «перёд». Русское «вперёд» собрано тем же способом, только с предлогом «в»: предлог плюс «перёд». Совпадают и оба значения — пространственное и временное."
memory: "naprzód = «вперёд» и «заранее»: krok naprzód «шаг вперёд», но zarezerwować naprzód «забронировать заранее». Разговорный синоним — do przodu."
