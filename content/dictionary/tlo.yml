pos: noun
pron: { cyr: "туо" }
senses:
  - id: background
    ru: "фон, задний план"
    examples:
      - pl: "Na tym zdjęciu w tle widać zamek."
        ru: "На этом снимке на заднем плане виден замок."
        source: { kind: translated, id: 536926 }
      - pl: "Zróbmy sobie zdjęcie z morzem w tle."
        ru: "Давай сфотографируемся с морем на заднем плане."
        source: { kind: translated, id: 594804 }
      - pl: "Pozostanę w tle."
        ru: "Я останусь в тени."
        source: { kind: translated, id: 9686893 }
  - id: backdrop
    ru: "фон, подоплёка (событий)"
    examples:
      - pl: "Świat jest tylko tłem dla naszej wyobraźni."
        ru: "Мир — лишь фон для нашего воображения."
        source: { kind: translated, id: 1605945 }
      - pl: "Powieść ma tło historyczne."
        ru: "У романа исторический фон."
        source: { kind: authored }
notes:
  - { kind: government, text: "Устойчивый оборот w tle «на заднем плане, в тени» — предложный падеж. Pozostać w tle значит «держаться в тени»." }
  - { kind: false-friend, text: "Не «тело»! Тело по-польски ciało. tło — это фон." }
  - { kind: usage, text: "Переносно — «подоплёка»: tło wydarzeń «подоплёка событий», na tle czegoś «на фоне чего-л.»." }
  - { kind: government, text: "Средний род: to tło, tego tła, w tle." }
collocations:
  - { pl: "w tle", ru: "на заднем плане" }
  - { pl: "na tle czegoś", ru: "на фоне чего-л." }
etymology: "Праславянское *tьlo «дно, основание»; ср. русское «тло» в обороте «дотла»."
memory: "tło — «фон», не «тело» (это ciało). Запомните w tle «на заднем плане» и na tle czegoś «на фоне чего-л.»."
