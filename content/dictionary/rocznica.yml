notes:
  - { kind: false-friend, text: "Слово прозрачно, если увидеть в нём ROK «год»: ROCZNICA это «годовщина». Оба языка построили имя от слова «год», только разными суффиксами — польский взял -NICA, русский -ОВЩИНА. Но помнить надо две соседние ловушки. Первая: сам ROK по-польски «год», а русское «рок» это LOS или FATUM, так что всё гнездо начинается с расхождения. Вторая: ROCZNIK это не «годовщина», а «ежегодник», «год выпуска» или «класс» в школе — ROCZNIK 1980 значит «рождения 1980 года». А прилагательное ROCZNY значит «годовой» или «годовалый»: DZIECKO ROCZNE «годовалый ребёнок», SPRAWOZDANIE ROCZNE «годовой отчёт»." }
  - { kind: government, text: "Женский род. Чего годовщина — родительный: ROCZNICA ŚLUBU, ROCZNICA ŚMIERCI, ROCZNICA POWSTANIA. «В годовщину» требует винительного с предлогом W, а не местного: W ROCZNICĘ ŚMIERCI, W PIĄTĄ ROCZNICĘ. Это стоит заметить отдельно, потому что W с датами обычно идёт с местным. Частотные глаголы: OBCHODZIĆ ROCZNICĘ «отмечать годовщину», ŚWIĘTOWAĆ ROCZNICĘ, UPAMIĘTNIĆ ROCZNICĘ «ознаменовать годовщину». Порядковое числительное согласуется: DZIESIĄTA ROCZNICA «десятая годовщина»." }
  - { kind: usage, text: "Основа мягкая, на -CA, и это упрощает склонение: родительный, дательный и местный единственного совпадают в одной форме ROCZNICY. Три падежа, одна форма — и никакого чередования, в отличие от твёрдых основ, где K переходит в C (DAWKA и DAWCE) или G в DZ (FLAGA и FLADZE). Родительный множественного — ROCZNIC, с нулевым окончанием и без вставной гласной, потому что скопления согласных не возникает. Именительный и винительный множественного — ROCZNICE. Так весь набор сводится к десяти формам, из которых запомнить надо, по сути, две." }
  - { kind: pronunciation, text: "Читается «рочни́ца», три слога, ударение на предпоследнем. Сочетание CZ даёт «ч», а следующее NI — мягкое «ни», поэтому середина слова звучит «чни», слитно. Конечное CA это «ца», с твёрдым ц. В форме ROCZNICY слышно «рочни́цы», где Y даёт «ы». В родительном множественного ROCZNIC слогов остаётся два, ударение переходит на первый: «ро́чниц»." }
