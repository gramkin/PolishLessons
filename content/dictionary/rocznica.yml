etymology: "От ROK «год», из праславянского *rokъ, и суффикса -NICA, образующего названия дат и мест. При присоединении суффикса заднее K переходит в CZ — это первая палатализация, древнейшее славянское чередование, то же, что в RĘKA и RĘCZNY, в OKO и OCZNY, в РУКА и РУЧНОЙ. Поэтому ROK даёт ROCZNY и ROCZNICA, а не «рокница». Русский с тем же корнем поступил иначе дважды: во-первых, само слово *rokъ у него значит не «год», а «рок, судьба» — исходный смысл был «срок, назначенное время», и польский развил его в «год», а русский в «назначенную судьбу»; во-вторых, для годовщины русский взял слово «год» и суффикс -ОВЩИНА. Так два языка назвали одну вещь от двух разных слов для года, и общий корень тут скорее мешает, чем помогает."
memory: "Видеть в слове rok «год»: rocznica — «годовщина». При суффиксе k переходит в cz — первая палатализация, как ręka/ręczny, рука/ручной. Ловушки рядом: польское rok — «год», а русское «рок» — это los; rocznik — не годовщина, а «ежегодник» или «год выпуска»; roczny — «годовой» или «годовалый». «В годовщину» — винительный: w rocznicę, не w rocznicy. Родительный, дательный и местный единственного — одна форма rocznicy."
idioms:
  - { pl: "w rocznicę czegoś", ru: "в годовщину чего-то — винительный падеж" }
  - { pl: "okrągła rocznica", ru: "круглая годовщина" }
