rank: 3939
pos: verb
pron: { cyr: "пшэба́чыць" }
senses:
  - id: forgive
    ru: "простить"
    examples:
      - pl: "Przebaczyła mu zdradę."
        ru: "Она простила ему измену."
        source: { kind: authored }
      - pl: "Nigdy sobie tego nie przebaczę."
        ru: "Я никогда себе этого не прощу."
        source: { kind: authored }
      - pl: "Ojciec przebaczył synowi wszystko."
        ru: "Отец простил сыну всё."
        source: { kind: authored }
  - id: pardon
    ru: "отпустить (грехи), помиловать (книжн.)"
    examples:
      - pl: "Król przebaczył buntownikom."
        ru: "Король помиловал мятежников."
        source: { kind: authored }
      - pl: "Ksiądz powiedział, że Bóg przebaczy każdemu, kto żałuje."
        ru: "Ксёндз сказал, что Бог простит каждого, кто раскаивается."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "PRZEBACZYĆ — «простить». В русском однокоренного глагола нет, поэтому слово кажется чужим, хотя корень знакомый: тот же, что в ZOBACZYĆ, «увидеть». Синоним WYBACZYĆ — частотнее и проще; PRZEBACZYĆ — глубже и торжественнее: о предательстве, грехах, обидах на всю жизнь." }
  - { kind: usage, text: "Пятьдесят две формы: страдательное PRZEBACZONY есть, но только о вине, а не о человеке — PRZEBACZONE WINY, «прощённые вины». Поэтому форма для мужчин-людей PRZEBACZENI в карточку не включена: человека не «прощают» в винительном. Видовой партнёр — PRZEBACZAĆ. Существительное PRZEBACZENIE — «прощение»." }
  - { kind: government, text: "Кому — дательный, что — винительный: PRZEBACZYĆ KOMUŚ WINĘ, ZDRADĘ, KŁAMSTWO. Без дополнения: NIE UMIEM PRZEBACZAĆ, «я не умею прощать». Себе — SOBIE: NIE PRZEBACZĘ SOBIE. С отрицанием вещь — в родительном: NIE PRZEBACZYŁ MU TEGO." }
  - { kind: pronunciation, text: "Читается «пшэба́чыць», три слога, ударение на предпоследнем. PRZE — «пшэ»: RZ после P оглушается. CZ твёрдое, поэтому «чы». Конечное Ć — «ць». Повелительное PRZEBACZ — «пшэ́бач»." }
  - { kind: register, text: "Слово возвышенное, частое в молитвах, литературе и серьёзных разговорах: PRZEBACZ MI, «прости меня». В быту при мелкой вине говорят PRZEPRASZAM или WYBACZ. PRZEBACZENIE — ключевое слово христианской проповеди." }
collocations:
  - { pl: "przebaczyć komuś winę", ru: "простить кому-то вину" }
  - { pl: "prosić o przebaczenie", ru: "просить прощения" }
  - { pl: "nigdy sobie nie przebaczę", ru: "никогда себе не прощу" }
family:
  - { pl: "przebaczać", ru: "прощать", relation: aspect }
  - { pl: "wybaczyć", ru: "простить, извинить", relation: root, id: wybaczyc }
  - { pl: "przebaczenie", ru: "прощение", relation: derived }
etymology: "Приставка PRZE- плюс старое BACZYĆ «обращать внимание, видеть», то же, что в ZOBACZYĆ «увидеть». Буквально «перестать замечать, посмотреть мимо» — то есть простить."
memory: "Przebaczyć — простить, всерьёз: przebaczyła mu zdradę. Komuś coś: дательный и винительный. Prosić o przebaczenie — просить прощения. Корень как в zobaczyć: «посмотреть мимо». Читается «пшэба́чыць»."
idioms:
  - { pl: "przebaczyć i zapomnieć", ru: "простить и забыть" }
formExamplesSkip:
  - { form: "przebaczeni", reason: "прощают вину, а не человека: формы для мужчин-людей нет" }
