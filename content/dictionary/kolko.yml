# review
id: kolko
format: 2
lemma: "kółko"
rank: 2112
pos: noun
pron: { cyr: "ку́уко" }
senses:
  - id: small-circle
    ru: "кружок; колёсико"
    examples:
      - pl: "Narysuj kółko na kartce."
        ru: "Нарисуй кружок на листке."
        source: { kind: authored }
      - pl: "Moja mysz nie ma kółka."
        ru: "У моей мыши нет колёсика."
        source: { kind: authored }
  - id: club
    ru: "кружок, секция (по интересам)"
    examples:
      - pl: "Zapisał się na kółko teatralne."
        ru: "Он записался в театральный кружок."
        source: { kind: authored }
      - pl: "Po lekcjach działają kółka zainteresowań."
        ru: "После уроков работают кружки по интересам."
        source: { kind: authored }
  - id: in-circles
    ru: "в обороте w kółko — по кругу, без конца"
    examples:
      - pl: "Chodzili w kółku wokół choinki."
        ru: "Они ходили кружком вокруг ёлки."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Уменьшительное от koło «круг, колесо», образованное суффиксом -ko. Обратите внимание: форма kółka — это и родительный единственного («nie ma kółka»), и именительный множественного («kółka zainteresowań»); различает их только контекст." }
  - { kind: false-friend, text: "Корень koło — прямой родственник русских «колесо», «кольцо» и предлога «около», от праславянского *kolo. Но значения разошлись: польское koło это и «круг», и «колесо», а kółko вдобавок «кружок по интересам», как и русское «кружок»." }
  - { kind: government, text: "Оборот w kółko значит «по кругу, без конца»: mówić w kółko o tym samym «твердить одно и то же». Не путайте его с w kółku «в кружке, в секции» — предложный падеж того же слова, но смысл совсем другой." }
collocations:
  - { pl: "kółko zainteresowań", ru: "кружок по интересам" }
  - { pl: "w kółko", ru: "по кругу, без конца" }
  - { pl: "krzesło na kółkach", ru: "стул на колёсиках" }
family:
  - { pl: "koło", ru: "круг; колесо", relation: root, id: kolo }
  - { pl: "kolisty", ru: "круглый, круговой", relation: derived }
etymology: "Уменьшительное от koło «круг, колесо» с суффиксом -ko. Корень праславянский *kolo и прямо отвечает русским «колесо», «кольцо», «около» — всем словам, построенным на идее круга. Значение «кружок по интересам» развилось так же, как в русском: люди сидят кругом."
memory: "kółko — уменьшительное от koło, корень как в русских «колесо» и «около». Отсюда и кружок на бумаге, и колёсико у чемодана, и школьный кружок. А w kółko значит «без конца»."
idioms:
  - { pl: "w kółko o tym samym", ru: "одно и то же без конца" }
  - { pl: "kółko zainteresowań", ru: "кружок по интересам" }
