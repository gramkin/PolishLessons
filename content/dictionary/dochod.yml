# review
id: dochod
format: 2
lemma: "dochód"
rank: 4447
pos: noun
pron: { cyr: "до́хут" }
senses:
  - id: income
    ru: "доход"
    examples:
      - pl: "Jego miesięczny dochód wzrósł."
        ru: "Его месячный доход вырос."
        source: { kind: authored }
      - pl: "Żyją z jednego dochodu."
        ru: "Они живут на один доход."
        source: { kind: authored }
      - pl: "Dochód z wynajmu wystarcza na kredyt."
        ru: "Дохода от аренды хватает на кредит."
        source: { kind: authored }
  - id: proceeds
    ru: "доходы, поступления, выручка (мн.)"
    examples:
      - pl: "Dochody z koncertu przekazano na szpital."
        ru: "Выручку с концерта передали больнице."
        source: { kind: authored }
      - pl: "Firma odnotowała rekordowe dochody."
        ru: "Фирма зафиксировала рекордные доходы."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "DOCHÓD — «доход», и слово то же. Тонкость в экономике: DOCHÓD — то, что остаётся, а PRZYCHÓD — «выручка, поступления» до вычета расходов. DOCHODOWY — «доходный, прибыльный»: DOCHODOWY BIZNES. А PODATEK DOCHODOWY — «подоходный налог»." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Ó в корне чередуется с O: DOCHÓD, но DOCHODU, DOCHODZIE, как ZACHÓD и ZACHODU. Во множественном DOCHODY — «доходы, поступления»." }
  - { kind: government, text: "Доход с чего-то — DOCHÓD Z CZEGOŚ, Z с родительным: DOCHÓD Z WYNAJMU. Жить на доход — ŻYĆ Z DOCHODU, Z с родительным. Доход на человека — DOCHÓD NA OSOBĘ, NA с винительным." }
  - { kind: pronunciation, text: "Читается «до́хут», два слога, ударение на первом. Ó — «у», конечное D оглушается в «т», как в ZACHÓD «за́хут». В форме DOCHODZIE: «дохо́дзе»." }
  - { kind: register, text: "Слово деловое и налоговое: ZEZNANIE O DOCHODACH — налоговая декларация, PRÓG DOCHODOWY — порог дохода. В разговоре о деньгах проще: ZAROBKI, «заработки»." }
collocations:
  - { pl: "wysoki dochód", ru: "высокий доход" }
  - { pl: "dochód na osobę", ru: "доход на человека" }
  - { pl: "dochody budżetu", ru: "доходы бюджета" }
family:
  - { pl: "dochodzic", ru: "доходить", relation: root, id: dochodzic }
  - { pl: "dochodowy", ru: "доходный, прибыльный; подоходный", relation: derived }
  - { pl: "przychod", ru: "выручка, поступления", relation: derived }
etymology: "От DOCHODZIĆ «доходить»: доход — то, что «доходит» до человека. Русское «доход» устроено так же, слово общее. Польское Ó на месте русского «о» в закрытом слоге — обычное соответствие: DOCHÓD и «доход»."
memory: "Dochód — доход: miesięczny dochód. Читается «до́хут». Podatek dochodowy — подоходный налог. Żyć z dochodu — жить на доход. Przychód — выручка до вычета расходов."
idioms:
  - { pl: "podatek dochodowy", ru: "подоходный налог" }
  - { pl: "źródło dochodu", ru: "источник дохода" }
