notes:
  - { kind: false-friend, text: "Различайте два слова: podejrzliwość — это свойство характера, склонность подозревать, а podejrzenie — конкретное подозрение по конкретному поводу." }
  - { kind: government, text: "Женский род на -ść: ta podejrzliwość, tej podejrzliwości. С подозрительностью — z podejrzliwością, творительный." }
  - { kind: usage, text: "Прилагательное podejrzliwy «подозрительный» о человеке, тогда как podejrzany значит «подозрительный» в смысле «вызывающий подозрение»." }
  - { kind: usage, text: "Карточка podejrzany уже есть — эти два прилагательных легко перепутать." }
collocations:
  - { pl: "z podejrzliwością", ru: "с подозрительностью" }
etymology: "От podejrzliwy «подозрительный», от podejrzeć «подсмотреть»; ср. русское «подозревать», «зреть»."
