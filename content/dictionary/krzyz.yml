notes:
  - { kind: false-friend, text: "У этого слова есть второе значение, которого в русском нет совсем: KRZYŻ — это ещё и поясница, нижняя часть спины. BÓL W KRZYŻU и BÓL KRZYŻA значат «боль в пояснице», и в кабинете врача это слово услышишь чаще, чем в костёле. Поэтому KRZYŻ MNIE BOLI не имеет отношения к религии. Русское «крест» такого значения не имеет, а польское KRZYŻ в анатомическом смысле совершенно обиходно. Из того же гнезда идёт KRZYŻÓWKA, и это не «крестик», а «кроссворд»; есть и KRZYŻÓWKA в биологии — «гибрид». Наречное NA KRZYŻ значит «крест-накрест»." }
  - { kind: usage, text: "Основа кончается на Ż, и родительный множественного получает окончание -Y: KRZYŻY, а не «krzyżów». Это отличает его от основ на -SZ, где возможны оба варианта (SOJUSZY и SOJUSZÓW), и от основ на -RZ с тем же колебанием (RYCERZY и RYCERZÓW). Здесь колебания нет. Родительный единственного — KRZYŻA, местный — KRZYŻU, то есть эти два падежа различаются, в отличие от многих мужских слов, где они совпадают. Именительный множественного — KRZYŻE." }
  - { kind: government, text: "Мужской род, неодушевлённое. «На кресте» — предлог NA с местным: NA KRZYŻU. «В пояснице» — W с местным: W KRZYŻU. Чей крест или чего — родительный: KRZYŻ PRZY DRODZE через предлог, KRZYŻ ZASŁUGI «Крест заслуги» — польский орден. Частотные сочетания: KRZYŻ PRZYDROŻNY «придорожный крест», ZNAK KRZYŻA «крестное знамение», NA KRZYŻ «крест-накрест», BÓL W KRZYŻU «боль в пояснице». Глагол KRZYŻOWAĆ значит «скрещивать», а KRZYŻOWAĆ SIĘ — «пересекаться»." }
  - { kind: pronunciation, text: "Читается «кшыш», один слог. Начальное KRZ произносится «кш», потому что RZ после глухого K оглушается. Буква Y даёт «ы». Конечное Ż тоже оглушается, до «ш», поэтому слово и начинается, и кончается на «ш». Как только добавляется гласная, звонкость возвращается: KRZYŻA читается «кшы́жа», KRZYŻEM — «кшы́жэм», KRZYŻU — «кшы́жу». Так одно короткое слово показывает оглушение дважды и его отмену трижды." }
