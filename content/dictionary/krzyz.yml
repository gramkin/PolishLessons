etymology: "Через древнечешское KŘÍŽ из латинского CRUX, винительный CRUCEM, вероятно при посредстве древневерхненемецкого; русское «крест» пришло из того же латинского слова, но другим путём, через греческое и южнославянское посредство, и потому звучит иначе. Значение «поясница» развилось в польском из названия той части спины, где позвоночник и кости образуют крестообразную фигуру; тем же образом объясняется анатомический термин KOŚĆ KRZYŻOWA, по-русски «крестцовая кость», и здесь русский сохранил тот же образ, только в специальном слове. Поэтому второе значение польского KRZYŻ для русского не совсем чужое: оно спрятано в «крестце». Из того же гнезда идут KRZYŻÓWKA «кроссворд», названная по пересечению слов, и KRZYŻOWAĆ «скрещивать»."
memory: "Два значения: krzyż — «крест» и «поясница». Boli mnie krzyż — «у меня болит поясница», и в этом смысле слово слышишь чаще. Опора в русском есть: «крестец» и «крестцовая кость» хранят тот же образ. Krzyżówka — не «крестик», а «кроссворд». Родительный множественного только krzyży, без колебания, в отличие от sojuszy/sojuszów. Читается «кшыш»: krz даёт «кш», конечное ż оглушается."
