notes:
  - { kind: usage, text: "Юридическое и книжное слово: в законах ustęp — это пункт статьи. В обычном тексте абзац чаще называют akapit." }
  - { kind: false-friend, text: "У слова есть и устаревшее разговорное значение «уборная», так что в живой речи для абзаца лучше сказать akapit." }
  - { kind: government, text: "Мужской неодушевлённый; родительный — ustępu." }
  - { kind: usage, text: "Корень ustąpić «уступить, отступить»: отрывок — то, что отступает от предыдущего." }
collocations:
  - { pl: "ustęp ustawy", ru: "пункт закона" }
etymology: "От ustąpić «уступить, отступить»; ср. русское «уступ», «отступ» — абзац как отступ в тексте."
