# review
id: zdumiewac
format: 2
lemma: "zdumiewać"
rank: 2158
pos: verb
aspect: imperf
pron: { cyr: "здуме́ваць" }
senses:
  - id: amaze
    ru: "изумлять, поражать"
    examples:
      - pl: "Zdumiewa mnie jej nieodpowiedzialność."
        ru: "Меня изумляет её безответственность."
        source: { kind: translated, id: 1133691 }
      - pl: "Jego nieodpowiedzialność mnie zdumiewa."
        ru: "Его безответственность меня изумляет."
        source: { kind: translated, id: 3933410 }
      - pl: "Zdumiewa mnie, jak często pragniemy rzeczy, których wcale nie potrzebujemy."
        ru: "Меня изумляет, как часто мы желаем вещей, которые нам вовсе не нужны."
        source: { kind: translated, id: 10780165 }
  - id: amazing
    ru: "изумительный (причастие zdumiewający)"
    examples:
      - pl: "Zdumiewające, prawda?"
        ru: "Изумительно, правда?"
        source: { kind: translated, id: 6067358 }
      - pl: "Międzynarodowa Stacja Kosmiczna to zdumiewające osiągnięcie inżynieryjne."
        ru: "Международная космическая станция — изумительное достижение."
        source: { kind: translated, id: 10698858 }
notes:
  - { kind: government, text: "Винительный падеж: zdumiewa mnie «меня изумляет». Подлежащим обычно бывает не человек, а факт или свойство." }
  - { kind: usage, text: "Причастие zdumiewający «изумительный, поразительный» встречается не реже самого глагола." }
  - { kind: usage, text: "Совершенный вид — zdumieć; возвратное zdumiewać się «изумляться»." }
  - { kind: false-friend, text: "Корень duma, но не в значении «дума»: польское duma значит «гордость». Здесь работает старое значение «мысль», как в русском «думать»." }
collocations:
  - { pl: "zdumiewa mnie", ru: "меня изумляет" }
  - { pl: "zdumiewające osiągnięcie", ru: "изумительное достижение" }
etymology: "z- + dumiewać, от dumać «размышлять»; ср. русское «думать», «раздумье». Польское duma значит «гордость», но корень тот же."
memory: "zdumiewać — «изумлять», с винительным: zdumiewa mnie. Причастие zdumiewający «изумительный» встречается не реже. Совершенный вид — zdumieć."
idioms:
  - { pl: "zdumiewa mnie", ru: "меня изумляет" }
