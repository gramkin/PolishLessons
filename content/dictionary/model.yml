id: model
format: 2
lemma: "model"
rank: 2377
pos: noun
pron: { cyr: "мо́дэль" }
senses:
  - id: type
    ru: "модель (тип изделия)"
    examples:
      - pl: "Ten model wycofano z produkcji."
        ru: "Эту модель сняли с производства."
        source: { kind: authored }
      - pl: "Nowego modelu jeszcze nie ma w sklepach."
        ru: "Новой модели ещё нет в магазинах."
        source: { kind: authored }
  - id: person
    ru: "модель, натурщик (человек)"
    examples:
      - pl: "Zatrudnili modela do sesji."
        ru: "Они наняли модель для съёмки."
        source: { kind: authored }
      - pl: "Malarz szukał modela o wyrazistej twarzy."
        ru: "Художник искал натурщика с выразительным лицом."
        source: { kind: authored }
  - id: scale-model
    ru: "макет, модель (уменьшенная)"
    examples:
      - pl: "Model statku stoi w gablocie."
        ru: "Модель корабля стоит в витрине."
        source: { kind: authored }
notes:
  - { kind: usage, text: "ОДНО СЛОВО, ДВА РОДИТЕЛЬНЫХ — И ВЫБИРАЕТ ИХ ОДУШЕВЛЁННОСТЬ. Если речь о ЧЕЛОВЕКЕ, родительный MODELA: szukam modela. Если о ВЕЩИ, типе или макете — MODELU: nie ma tego modelu. Та же основа, разные окончания, и перепутать их значит превратить человека в предмет. Это крайний случай той же логики, что в kupić banana и postawić plusa." }
  - { kind: false-friend, text: "Значения совпадают с русскими, но род в человеческом смысле другой. По-русски «модель» о женщине и о мужчине одинаково, женского рода; по-польски мужчина это model, женщина — modelka. Сказать o tej model нельзя: либо ten model o мужчине, либо ta modelka о женщине." }
  - { kind: pronunciation, text: "Два слога, ударение на первом: MO-del. Конечное l мягкое, как в portfel: «мо́дэль». Родительный множественного тоже двойной: modeli и modelów, обе формы правильны." }
collocations:
  - { pl: "nowy model", ru: "новая модель" }
  - { pl: "model do składania", ru: "сборная модель" }
  - { pl: "praca modela", ru: "работа натурщика" }
family:
  - { pl: "modelka", ru: "модель (женщина)", relation: derived }
  - { pl: "modelowy", ru: "образцовый, модельный", relation: derived }
  - { pl: "wzór", ru: "образец", relation: root }
etymology: "Из итальянского modello «образец, форма», от латинского modulus «мерка», уменьшительного от modus «мера». В польский и в русский слово пришло через французский и немецкий почти одновременно. Тот же корень в словах moda, modus, modulacja и moduł."
memory: "model — «модель». Главное в склонении: о ЧЕЛОВЕКЕ родительный modela, о ВЕЩИ — modelu. И женщина-модель называется modelka, не model."
idioms:
  - { pl: "model do składania", ru: "сборная модель" }
  - { pl: "najnowszy model", ru: "новейшая модель" }
