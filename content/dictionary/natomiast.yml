# review
id: natomiast
format: 2
lemma: "natomiast"
rank: 4381
pos: conj
pron: { cyr: "нато́мяст" }
senses:
  - id: whereas
    ru: "а, же, зато (противопоставление)"
    examples:
      - pl: "On pracuje, ona natomiast studiuje."
        ru: "Он работает, а она учится."
        source: { kind: authored }
      - pl: "W mieście pada, natomiast na wsi świeci słońce."
        ru: "В городе идёт дождь, а в деревне светит солнце."
        source: { kind: authored }
      - pl: "Teoria jest prosta, praktyka natomiast trudna."
        ru: "Теория простая, а вот практика трудная."
        source: { kind: authored }
      - pl: "Ceny wzrosły, natomiast pensje stoją w miejscu."
        ru: "Цены выросли, а зарплаты стоят на месте."
        source: { kind: authored }
      - pl: "Natomiast co do terminu, musimy jeszcze porozmawiać."
        ru: "Что же касается срока, нам ещё надо поговорить."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "NATOMIAST — «а, же, зато», противопоставление двух частей: JA LUBIĘ KAWĘ, ON NATOMIAST HERBATĘ, «я люблю кофе, а он — чай». Ближайший русский аналог — частица «же»: «он же предпочитает чай». К русскому «немедленно» или «на том месте» слово сегодня отношения не имеет." }
  - { kind: usage, text: "Одна форма. Часто стоит не первым, а после первого слова второй части: PRAKTYKA NATOMIAST TRUDNA. Сочетание A NATOMIAST считается ошибкой: союз A и NATOMIAST значат одно и то же, достаточно одного." }
  - { kind: government, text: "Слово ничем не управляет. Перед NATOMIAST, соединяющим две части предложения, ставится запятая: W MIEŚCIE PADA, NATOMIAST NA WSI ŚWIECI SŁOŃCE." }
  - { kind: pronunciation, text: "Читается «нато́мяст», ударение на предпоследнем слоге. MIA — «мя», как в MIASTO «мя́сто»." }
  - { kind: register, text: "Слово нейтральное, но больше письменное: статьи, доклады, отчёты. В разговоре чаще просто A: JA PRACUJĘ, A ON STUDIUJE." }
collocations:
  - { pl: "ja natomiast", ru: "а я" }
  - { pl: "natomiast teraz", ru: "а теперь" }
  - { pl: "natomiast w Polsce", ru: "а в Польше" }
family:
  - { pl: "zamiast", ru: "вместо", relation: root, id: zamiast }
  - { pl: "miasto", ru: "город; (стар.) место", relation: root, id: miasto }
  - { pl: "miejsce", ru: "место", relation: root, id: miejsce }
etymology: "Из сочетания NA TO MIASTO, «на то место», то есть «вместо того». В старопольском MIASTO значило «место», отсюда и ZAMIAST «вместо». Значение «вместо этого» со временем ослабло до простого «а, зато»."
memory: "Natomiast — а, же, зато: ja lubię kawę, on natomiast herbatę. Читается «нато́мяст». Не пишут «a natomiast». Zamiast — вместо, тот же корень."
idioms:
  - { pl: "zamiast tego", ru: "вместо этого" }
formExamples:
  - form: "natomiast"
    pl: "Ja lubię morze, natomiast mój mąż woli góry."
    ru: "Я люблю море, а мой муж предпочитает горы."
    source: { kind: authored }
  - form: "natomiast"
    pl: "Zima była łagodna, wiosna natomiast bardzo zimna."
    ru: "Зима была мягкой, а весна — очень холодной."
    source: { kind: authored }
  - form: "natomiast"
    pl: "Pierwszy film mi się podobał, drugi natomiast był nudny."
    ru: "Первый фильм мне понравился, а второй был скучным."
    source: { kind: authored }
