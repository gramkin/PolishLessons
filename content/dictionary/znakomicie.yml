id: znakomicie
format: 2
lemma: "znakomicie"
rank: 4581
pos: adv
pron: { cyr: "знакоми́це" }
senses:
  - id: excellently
    ru: "превосходно, отлично"
    examples:
      - pl: "Zagrał znakomicie."
        ru: "Он сыграл превосходно."
        source: { kind: authored }
      - pl: "Bawiliśmy się znakomicie."
