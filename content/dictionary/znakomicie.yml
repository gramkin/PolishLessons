  - id: great
    ru: "отлично! (возглас)"
    examples:
      - pl: "Znakomicie, to zaczynamy!"
        ru: "Отлично, тогда начинаем!"
        source: { kind: authored }
      - pl: "Zdałeś? Znakomicie!"
        ru: "Сдал? Превосходно!"
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ZNAKOMICIE — «превосходно», а не «знакомо». «Знакомый» по-польски — ZNAJOMY. Прилагательное ZNAKOMITY — «превосходный, выдающийся»: ZNAKOMITY AKTOR, «выдающийся актёр»." }
  - { kind: usage, text: "Наречие. Степени сравнения формально есть, но на практике не употребляются: превосходное не бывает превосходнее. Часто служит одобрительным ответом: ZNAKOMICIE!" }
  - { kind: government, text: "Наречие ничем не управляет. Частые сочетания — с глаголами самочувствия и результата: CZUĆ SIĘ ZNAKOMICIE, ZNAKOMICIE SIĘ SPISAĆ, «отлично себя показать»." }
  - { kind: pronunciation, text: "Читается «знакоми́це», ударение на предпоследнем слоге. CIE — «це»." }
collocations:
  - { pl: "znakomicie się bawić", ru: "отлично повеселиться" }
  - { pl: "czuć się znakomicie", ru: "чувствовать себя превосходно" }
  - { pl: "znakomicie zagrać", ru: "превосходно сыграть" }
family:
  - { pl: "znakomity", ru: "превосходный, выдающийся", relation: root }
  - { pl: "znak", ru: "знак", relation: root, id: znak }
  - { pl: "znakomitość", ru: "знаменитость", relation: root }
etymology: "От ZNAKOMITY «видный, выдающийся», а то — от ZNAK «знак»: отмеченный знаком, заметный. Русское «знаменитый» построено похоже — от «знамя»."
memory: "Znakomicie — превосходно, не «знакомо» (znajomy — знакомый). Читается «знакоми́це». Znakomity aktor — выдающийся актёр."
idioms:
