      - pl: "On ma podwójną osobowość."
        ru: "У него двойная личность."
        source: { kind: translated, id: 944074 }
notes:
  - { kind: usage, text: "podwójne życie — «двойная жизнь»; podwójne znaczenie — «двойной смысл»; podwójne łóżko — «двуспальная кровать»." }
  - { kind: usage, text: "В гостинице спрашивают pokój pojedynczy czy podwójny? — «номер одноместный или двухместный?»" }
  - { kind: usage, text: "Poproszę podwójną — «двойную, пожалуйста», о порции кофе или спиртного, без называния самого слова." }
  - { kind: false-friend, text: "Образовано от dwa «два» с приставкой po-, как русское «двойной» от «два». Глагол — podwoić «удвоить»." }
collocations:
  - { pl: "podwójne życie", ru: "двойная жизнь" }
  - { pl: "podwójne łóżko", ru: "двуспальная кровать" }
  - { pl: "podwójne znaczenie", ru: "двойной смысл" }
family:
  - { pl: "dwa", ru: "два", relation: root, id: dwa }
  - { pl: "podwoić", ru: "удвоить", relation: root }
  - { pl: "pojedynczy", ru: "одиночный", relation: root }
etymology: "От dwa «два» с приставкой po-, как русское «двойной» от «два». Слова построены одинаково."
memory: "podwójny — «двойной»: podwójne życie, podwójne łóżko «двуспальная кровать». В гостинице — pokój podwójny «двухместный номер»."
idioms:
