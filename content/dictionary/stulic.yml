# review
id: stulic
format: 2
lemma: "stulić"
rank: 4892
pos: verb
pron: { cyr: "сту́лиць" }
senses:
  - id: fold
    ru: "прижать, сложить (уши, крылья, лепестки)"
    examples:
      - pl: "Pies stulił uszy."
        ru: "Собака прижала уши."
        source: { kind: authored }
      - pl: "Ptak stulił skrzydła."
        ru: "Птица сложила крылья."
        source: { kind: authored }
      - pl: "Wieczorem kwiaty stulą płatki."
        ru: "Вечером цветы сомкнут лепестки."
        source: { kind: authored }
  - id: shut-up
    ru: "STUL DZIÓB / STUL PYSK — заткнись (грубо)"
    examples:
      - pl: "Stul dziób!"
        ru: "Закрой клюв!"
        source: { kind: authored }
      - pl: "Stulcie wreszcie dzioby!"
        ru: "Да заткнитесь вы наконец!"
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "STULIĆ — «прижать, сложить, сомкнуть», а не «стулить» и не «стул» (KRZESŁO). Корень тот же, что TULIĆ «прижимать» и PRZYTULIĆ «обнять». Грубое STUL DZIÓB! / STUL PYSK! — «заткнись!»." }
  - { kind: usage, text: "Совершенный вид; несовершенный — STULAĆ. Спряжение: STULĘ, STULISZ, STULĄ. Причастие STULONY — «прижатый»: STULONE USZY. Форма STULMY, мужско-личное STULENI, безличное STULONO и отглагольное существительное в карточку не включены." }
  - { kind: government, text: "Что — винительный: STULIĆ USZY, RAMIONA, SKRZYDŁA. Как — творительный: STULIĆ SIĘ W KŁĘBEK «свернуться клубком». С SIĘ — «съёжиться»." }
  - { kind: pronunciation, text: "Читается «сту́лиць»: LI — мягкое «ли», ударение на первом слоге. STUL — «стуль»." }
  - { kind: register, text: "О животных и цветах — нейтральное. STUL DZIÓB / STUL PYSK — грубые выражения, их нужно понимать, но употреблять осторожно." }
collocations:
  - { pl: "stulić uszy", ru: "прижать уши" }
  - { pl: "stulić skrzydła", ru: "сложить крылья" }
  - { pl: "stul dziób", ru: "заткнись (грубо)" }
family:
  - { pl: "przytulić", ru: "обнять, прижать к себе", relation: root, id: przytulic }
  - { pl: "tulić", ru: "прижимать, обнимать", relation: root }
  - { pl: "stulać", ru: "прижимать, складывать", relation: aspect }
etymology: "Приставка S- плюс TULIĆ «прижимать», праславянское *tuliti, родственное русскому «притулиться». Буквально «прижать вместе»."
memory: "Stulić — прижать, сложить: pies stulił uszy. Stul dziób! — грубое «заткнись!». Корень tulić, как в przytulić."
idioms:
  - { pl: "z podkulonym ogonem i stulonymi uszami", ru: "поджав хвост и прижав уши" }
formExamplesSkip:
  - { form: "stulmy", reason: "повелительное «давайте сложим» не употребляется" }
  - { form: "stuleni", reason: "мужско-личная форма: прижимают уши и крылья, а не людей" }
  - { form: "stulono", reason: "безличная форма не употребляется" }
  - { form: "stulenie", reason: "отглагольное существительное не употребляется" }
  - { form: "stulenia", reason: "отглагольное существительное не употребляется" }
  - { form: "stuleniu", reason: "отглагольное существительное не употребляется" }
  - { form: "stuleniem", reason: "отглагольное существительное не употребляется" }
