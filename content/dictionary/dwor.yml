notes:
  - { kind: false-friend, text: "Русский «двор» покрывает три вещи сразу: место у дома, королевскую свиту и помещичье хозяйство. Польский развёл их по разным словам. DWÓR — это усадьба или королевский двор, а место у дома называется PODWÓRKO. И главное: оборот NA DWORZE значит «на улице, снаружи» — JEST ZIMNO NA DWORZE «на улице холодно», DZIECI SĄ NA DWORZE «дети на улице». Русский, услышав na dworze, представит двор у дома, а речь идёт просто о том, что снаружи, под открытым небом." }
  - { kind: pronunciation, text: "В слове разом видны две мены. Буква ó стоит только в именительном и винительном — DWÓR, — а дальше на её месте o: DWORU, DWOREM, DWORY. Это позиционное ó, как в WZÓR и NAPÓJ: оно держится в закрытом конечном слоге и уходит, когда слог открывается. Вторая мена согласная: в местном падеже r переходит в rz — DWORZE, как teatrze, zegarze, kulturze. То же сочетание двух изменений в одном слове даёт URZĄD: там ą переходит в ę и d в dź." }
  - { kind: usage, text: "От этого корня польский построил слово, которое русскому не угадать: DWORZEC значит «вокзал» — dworzec kolejowy, dworzec autobusowy. Связь через двор как место сбора и подъезда. Русский же назвал вокзал по лондонскому Vauxhall, то есть по имени собственному, и родства с «двором» там нет никакого. Так что dwór, podwórko и dworzec — три ветви одного корня, и только первая отзывается в русском «дворе»." }
collocations:
  - { pl: "dwór królewski", ru: "королевский двор" }
  - { pl: "na dworze", ru: "на улице, снаружи" }
  - { pl: "dwór szlachecki", ru: "шляхетская усадьба" }
family:
  - { pl: "podwórko", ru: "двор у дома", relation: derived }
  - { pl: "dworzec", ru: "вокзал", relation: derived, id: dworzec }
etymology: "Из праславянского *dvorъ — того же слова, что русский «двор», в родстве с «дверью» и латинским forum: исходно это огороженное место перед входом. Русский оставил одно слово на все смыслы, польский развёл их: dwór стал усадьбой и королевским двором, podwórko — местом у дома, dworzec — вокзалом. А выражение na dworze ушло ещё дальше и значит просто «снаружи»."
memory: "ó только в dwór; откроется слог — станет o: dworu, dworem. В местном r даёт rz: dworze. И na dworze — это «на улице», а двор у дома — podwórko."
idioms:
