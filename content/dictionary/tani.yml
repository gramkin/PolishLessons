  - id: cheaper
    ru: "tańszy — дешевле, более дешёвый"
    examples:
      - pl: "Pociąg jest tańszy niż samolot."
        ru: "Поезд дешевле самолёта."
        source: { kind: authored }
      - pl: "Szukali tańszej opcji."
        ru: "Они искали вариант подешевле."
        source: { kind: authored }
  - id: cheap-trick
    ru: "перен. дешёвый, низкопробный (tanie chwyty)"
    examples:
      - pl: "To tanie chwyty, nie argumenty."
        ru: "Это дешёвые приёмы, а не доводы."
        source: { kind: authored }
      - pl: "Tani sentymentalizm nikogo nie wzruszył."
        ru: "Дешёвая сентиментальность никого не тронула."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ОСТОРОЖНО с похожим словом: taniec значит «танец» и к дешевизне отношения не имеет — оно пришло из немецкого Tanz. Tani и taniec лишь случайно похожи. Русского родственника у tani нет вовсе, так что опереться не на что: слово придётся запомнить напрямую, зато его производные прозрачны — tanio «дёшево», tanieć «дешеветь»." }
  - { kind: usage, text: "Переносное значение совпадает с русским почти буква в букву: tanie chwyty «дешёвые приёмы», tani sentymentalizm «дешёвая сентиментальность», tania sensacja «дешёвая сенсация». Там, где по-русски «дёшево» звучит упрёком, по-польски тоже." }
  - { kind: pronunciation, text: "ТРИ РАЗМЕРА ПАРАДИГМЫ, И У КАЖДОГО СВОЯ ПРИЧИНА. Одиннадцать форм — степеней сравнения нет вовсе (południowy, magiczny). Тридцать три — полный набор из трёх степеней по одиннадцати форм (rzadki: rzadki, rzadszy, najrzadszy). Тридцать две — тоже три степени, но у прилагательных с мягкой основой именительный падеж мужского рода единственного числа совпадает с мужско-личным множественного: tani hotel и tani sprzedawcy, одна форма на две клетки. Так же устроены głupi и tutejszy." }
collocations:
