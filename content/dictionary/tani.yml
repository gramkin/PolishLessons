  - { pl: "tania siła robocza", ru: "дешёвая рабочая сила" }
  - { pl: "tanie chwyty", ru: "дешёвые приёмы" }
family:
  - { pl: "tanio", ru: "дёшево", relation: derived, id: tanio }
  - { pl: "tanieć", ru: "дешеветь", relation: derived, id: taniec }
  - { pl: "drogi", ru: "дорогой", relation: antonym }
etymology: "Слово общеславянское по происхождению, но в русском его потомок не удержался, так что опоры в родном языке здесь нет — в отличие от большинства карточек. Зато гнездо прозрачно: tanio «дёшево», tanieć «дешеветь», potanieć «подешеветь». Похожее taniec «танец» к нему не относится: оно немецкое, от Tanz."
memory: "tani — «дешёвый», и русского родственника у него нет, запоминайте напрямую. Не путайте с taniec «танец» — слова лишь созвучны. Сравнительная степень с чередованием: tani, tańszy, najtańszy."
