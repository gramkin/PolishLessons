# review
id: doswiadczenie
format: 2
lemma: "doświadczenie"
rank: 2361
pos: noun
pron: { cyr: "досьвядче́не" }
senses:
  - id: experience
    ru: "опыт (жизненный, профессиональный)"
    examples:
      - pl: "Mam doświadczenie."
        ru: "У меня есть опыт."
        source: { kind: translated, id: 10564900 }
      - pl: "Czy masz doświadczenie zawodowe?"
        ru: "У тебя есть профессиональный опыт?"
        source: { kind: tatoeba, id: 610649 }
      - pl: "Doświadczenie jest najlepszym nauczycielem."
        ru: "Опыт — лучший учитель."
        source: { kind: translated, id: 578738 }
  - id: experiment
    ru: "опыт, эксперимент"
    examples:
      - pl: "On przeprowadza doświadczenia w swojej pracowni."
        ru: "Он проводит опыты в своей лаборатории."
        source: { kind: tatoeba, id: 349359 }
      - pl: "W tym doświadczeniu potrzeba absolutnej próżni."
        ru: "В этом опыте нужен абсолютный вакуум."
        source: { kind: translated, id: 817213 }
      - pl: "W tym doświadczeniu wykonała to, czego nauczyła się na lekcji."
        ru: "В этом опыте она сделала то, чему научилась на уроке."
        source: { kind: translated, id: 368117 }
  - id: lived-event
    ru: "переживание, испытание"
    examples:
      - pl: "Wypadek samochodowy był dla niej strasznym doświadczeniem."
        ru: "Автомобильная авария была для неё страшным переживанием."
        source: { kind: translated, id: 360506 }
      - pl: "Uniwersytet był wspaniałym doświadczeniem."
        ru: "Университет был прекрасным опытом."
        source: { kind: translated, id: 909194 }
notes:
  - { kind: usage, text: "Одно слово покрывает и «опыт» (жизненный), и «опыт» (эксперимент): doświadczenie zawodowe «профессиональный опыт», но przeprowadzać doświadczenia «проводить опыты»." }
  - { kind: usage, text: "Для научного эксперимента есть и eksperyment, но doświadczenie звучит по-польски привычнее." }
  - { kind: government, text: "«Человек с опытом» — osoba z doświadczeniem (творительный); «не хватает опыта» — brakuje doświadczenia (родительный)." }
  - { kind: usage, text: "Образовано от doświadczyć «испытать, изведать» суффиксом -enie; корень — świadczyć «свидетельствовать»." }
collocations:
  - { pl: "doświadczenie zawodowe", ru: "профессиональный опыт" }
  - { pl: "z doświadczeniem", ru: "с опытом" }
  - { pl: "brak doświadczenia", ru: "отсутствие опыта" }
etymology: "От doświadczyć «изведать, испытать», от świadczyć «свидетельствовать» (корень *svěd- — тот же, что в wiedzieć «знать» и в русских «ведать», «свидетель»). Русское «опыт» идёт от «пытать» — другая метафора, но итог тот же."
memory: "doświadczenie = и «опыт» (жизненный, профессиональный), и «опыт» (эксперимент). Запомните управление: osoba z doświadczeniem «человек с опытом», но brak doświadczenia «отсутствие опыта»."
idioms:
  - { pl: "doświadczenie zawodowe", ru: "профессиональный опыт" }
  - { pl: "z własnego doświadczenia", ru: "по собственному опыту" }
  - { pl: "bagaż doświadczeń", ru: "багаж опыта" }
