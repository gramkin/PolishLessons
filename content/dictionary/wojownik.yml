# review
id: wojownik
format: 2
lemma: "wojownik"
rank: 1831
pos: noun
pron: { cyr: "воё́вник" }
senses:
  - id: warrior
    ru: "воин, боец"
    examples:
      - pl: "On ma silny instynkt wojownika."
        ru: "У него сильный инстинкт воина."
        source: { kind: translated, id: 730562 }
      - pl: "Bóg stworzył człowieka na swoje podobieństwo, Bóg jest wojownikiem."
        ru: "Бог создал человека по своему подобию, Бог — воин."
        source: { kind: translated, id: 1152470 }
      - pl: "Bogini dała wojownikowi miecz i tarczę."
        ru: "Богиня дала воину меч и щит."
        source: { kind: translated, id: 11582380 }
  - id: warrior-more
    ru: "воин (о людях древности, о духе)"
    examples:
      - pl: "Był dzielnym wojownikiem."
        ru: "Он был отважным воином."
        source: { kind: authored }
      - pl: "Wojownicy wrócili z bitwy."
        ru: "Воины вернулись с битвы."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Слово книжное: про воинов древности, племён, легенд. Современный солдат — żołnierz." }
  - { kind: government, text: "Быть воином — być wojownikiem (творительный падеж); дать воину — dać wojownikowi (дательный)." }
  - { kind: usage, text: "Образовано от wojować «воевать», от wojna «война». Русское «воин» построено от того же корня." }
  - { kind: usage, text: "Корпус даёт слово очень скупо: четыре примера на десять форм, поэтому часть примеров в карточке составлена, а не взята из корпуса." }
collocations:
  - { pl: "dzielny wojownik", ru: "отважный воин" }
  - { pl: "instynkt wojownika", ru: "инстинкт воина" }
  - { pl: "być wojownikiem", ru: "быть воином" }
family:
  - { pl: "wojna", ru: "война", relation: root }
  - { pl: "wojować", ru: "воевать", relation: root }
  - { pl: "żołnierz", ru: "солдат", relation: root, id: zolnierz }
etymology: "От wojować «воевать», от wojna «война» — тот же корень, что в русском «воин» и «война»."
memory: "wojownik — «воин», слово книжное, про древность и легенды. Современный солдат — żołnierz. Быть воином — być wojownikiem, творительный падеж."
