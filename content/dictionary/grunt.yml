notes:
  - { kind: false-friend, text: "Русский «грунт» и польское GRUNT — одно немецкое слово, GRUND «дно, основание», взятое обоими языками. Но русский оставил его почти только почве и подмалёвку, а польский развернул широко. GRUNT это и почва, и земельный участок в документах, и, самое неожиданное, «главное»: GRUNT TO ZDROWIE значит «главное — здоровье». Услышав GRUNT в начале фразы, не ищите землю: скорее всего, говорящий переходит к сути." }
  - { kind: usage, text: "Одиннадцать форм, мужской род, неодушевлённое. Особенность в двух множественных: обычное GRUNTY и старое GRUNTA, которое сегодня встречается в документах давних лет и в сельской речи. В местном падеже T смягчается в CI: GRUNT, но W GRUNCIE. То же чередование в русском отсутствует, зато поляку оно привычно по парам вроде ŚWIAT — W ŚWIECIE." }
  - { kind: government, text: "На почве, в области — предлог NA с местным падежом: NA GRUNCIE PRAWA «с точки зрения права». В сущности — устойчивое W GRUNCIE RZECZY, предлог W с местным падежом и родительный от RZECZ. До основания — DO GRUNTU, предлог DO с родительным, и это прямая калька русского «до основания». В обороте GRUNT TO ZDROWIE слово стоит в именительном и работает как сказуемое." }
  - { kind: pronunciation, text: "Читается «грунт», один слог, в точности как русское слово. В местном падеже GRUNCIE сочетание NCI даёт два мягких звука, и слышно «гру́ньце», в два слога с ударением на первом. В GRUNTY конечное Y даёт «ы»: «гру́нты». Старая форма GRUNTA звучит «гру́нта». Ударение во всех формах на первом слоге, кроме многосложных GRUNTAMI «грунта́ми» и GRUNTACH «гру́нтах»." }
  - { kind: register, text: "В значении почвы и участка слово официальное, из языка кадастра: GRUNTY ORNE «пахотные земли», KSIĘGA WIECZYSTA GRUNTU «поземельная книга». В переносном смысле оно, наоборот, насквозь разговорное: GRUNT TO ZDROWIE, GRUNT, ŻEBY SIĘ NIE SPÓŹNIĆ «главное, не опоздать». Оборот W GRUNCIE RZECZY «в сущности» нейтрален и одинаково уместен в разговоре и в статье." }
collocations:
  - { pl: "grunt to zdrowie", ru: "главное — здоровье" }
  - { pl: "grunty orne", ru: "пахотные земли" }
  - { pl: "na gruncie prawa", ru: "с точки зрения права" }
family:
  - { pl: "gruntowny", ru: "основательный", relation: derived }
  - { pl: "gruntowac", ru: "грунтовать", relation: derived }
  - { pl: "ugruntowac", ru: "укрепить, упрочить", relation: derived }
etymology: "Из немецкого GRUND «дно, основание, земля», пришедшего в польский в средние века вместе с городским и земельным правом. Русский взял то же слово позже и в узком техническом смысле, поэтому «грунт» у нас это почва или первый слой краски, и ничего больше. Польский же пошёл за немецким значением «основание» до конца, и отсюда GRUNTOWNY «основательный», UGRUNTOWAĆ «упрочить» и обороты W GRUNCIE RZECZY «в сущности» и GRUNT TO «главное»."
memory: "Одно немецкое слово Grund на два языка, но польский развернул его шире. Русский «грунт» это только почва, а польский grunt это ещё и земельный участок, и, главное, само слово «главное»: grunt to zdrowie «главное — здоровье», w gruncie rzeczy «в сущности». Услышав grunt в начале фразы, ищите суть, а не землю. В местном падеже t смягчается: w gruncie, «гру́ньце». Два множественных: grunty и старое grunta."
idioms:
  - { pl: "w gruncie rzeczy", ru: "в сущности, по сути" }
