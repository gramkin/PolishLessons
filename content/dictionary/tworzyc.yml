# review
id: tworzyc
format: 2
lemma: "tworzyć"
rank: 1305
pos: verb
aspect: imperf
aspectPair: stworzyc
pron: { cyr: "тво́жыць" }
senses:
  - id: create
    ru: "создавать, творить"
    examples:
      - pl: "Dlatego właśnie mogę tworzyć muzykę."
        ru: "Именно поэтому я могу создавать музыку."
        source: { kind: translated, id: 357045 }
      - pl: "Ludzie są stworzeni, by tworzyć."
        ru: "Люди созданы, чтобы творить."
        source: { kind: translated, id: 1570358 }
      - pl: "Tworzę własną grę komputerową."
        ru: "Я создаю собственную компьютерную игру."
        source: { kind: translated, id: 13008716 }
  - id: constitute
    ru: "составлять, образовывать"
    examples:
      - pl: "Aminokwasy tworzą białka."
        ru: "Аминокислоты образуют белки."
        source: { kind: tatoeba, id: 8669025 }
      - pl: "Wasza trójka tworzy świetną drużynę."
        ru: "Вы втроём составляете отличную команду."
        source: { kind: translated, id: 3817526 }
      - pl: "Tworzymy dobry zespół."
        ru: "Мы составляем хорошую команду."
        source: { kind: translated, id: 12040913 }
notes:
  - { kind: usage, text: "Несовершенный вид к stworzyć: tworzyć — «создавать вообще», stworzyć — «создать до конца»." }
  - { kind: usage, text: "Второе значение — «составлять, образовывать»: Atomy tworzą molekuły «Атомы образуют молекулы», Tworzymy dobry zespół «Мы составляем хорошую команду»." }
  - { kind: government, text: "tworzyć co, винительный: tworzyć muzykę, plany, nowe słowa." }
  - { kind: false-friend, text: "Осторожно с похожими глаголами: tworzyć «создавать» и otworzyć «открыть» различает только приставка o-, а выглядят они почти одинаково." }
collocations:
  - { pl: "tworzyć muzykę", ru: "создавать музыку" }
  - { pl: "tworzyć plany", ru: "строить планы" }
  - { pl: "tworzyć całość", ru: "составлять целое" }
etymology: "Праславянское *tvoriti — то же самое слово, что русское «творить». Совпадение полное, включая переносные значения."
memory: "tworzyć — «творить, создавать», прямое соответствие русскому «творить». Совершенный вид — stworzyć. Держите в голове второе значение — «составлять»: Tworzymy dobry zespół «Мы составляем хорошую команду»."
idioms:
  - { pl: "tworzyć historię", ru: "творить историю" }
  - { pl: "tworzyć od podstaw", ru: "создавать с нуля" }
  - { pl: "tworzyć całość", ru: "составлять единое целое" }
