        ru: "Кухонная рукавица защищает от ожога."
        source: { kind: authored }
  - id: challenge
    ru: "вызов (перен.)"
    examples:
      - pl: "Opozycja rzuciła rządowi rękawicę."
        ru: "Оппозиция бросила правительству вызов."
