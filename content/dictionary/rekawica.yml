pos: noun
pron: { cyr: "рэнкави́ца" }
senses:
  - id: mitt
    ru: "рукавица; рабочая или боксёрская перчатка"
    examples:
      - pl: "Założył grube rękawice robocze."
        ru: "Он надел толстые рабочие рукавицы."
