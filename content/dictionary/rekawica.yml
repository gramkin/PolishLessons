notes:
  - { kind: false-friend, text: "Обычная перчатка по-польски — RĘKAWICZKA, уменьшительное: SKÓRZANE RĘKAWICZKI — кожаные перчатки. RĘKAWICA — что-то большое и грубое: рабочая рукавица, боксёрская или вратарская перчатка, кухонная прихватка. Варежку с одним пальцем называют RĘKAWICZKA Z JEDNYM PALCEM." }
  - { kind: usage, text: "Десять форм, женский род. Родительный, дательный и местный падежи совпадают: RĘKAWICY. Родительный множественного — RĘKAWIC, без окончания. Обычно слово стоит во множественном числе, потому что рукавиц две: ZAŁOŻYĆ RĘKAWICE." }
  - { kind: government, text: "Бросить вызов кому-то — RZUCIĆ KOMUŚ RĘKAWICĘ, дательный лица и винительный. Принять вызов — PODJĄĆ RĘKAWICĘ, винительный. В рукавицах — W RĘKAWICACH, местный падеж." }
  - { kind: pronunciation, text: "Читается «рэнкави́ца», четыре слога, ударение на третьем. Ę перед K звучит как «эн», а C даёт «ц»." }
collocations:
  - { pl: "rękawice robocze", ru: "рабочие рукавицы" }
  - { pl: "rękawice bokserskie", ru: "боксёрские перчатки" }
  - { pl: "para rękawic", ru: "пара рукавиц" }
family:
  - { pl: "reka", ru: "рука", relation: root, id: reka }
  - { pl: "rekawiczka", ru: "перчатка", relation: derived }
  - { pl: "rekaw", ru: "рукав", relation: derived, id: rekaw }
etymology: "От RĘKA «рука» с суффиксом, как русская «рукавица». Польское Ę на месте русского «у» — то же соответствие, что в RĘKA и «рука», MĘKA и «мука». Отсюда и RĘKAW «рукав». Оборот RZUCIĆ RĘKAWICĘ пришёл из рыцарского обычая, как наше «бросить перчатку»."
memory: "Rękawica — рукавица или грубая перчатка; обычная перчатка — rękawiczka. Читается «рэнкави́ца». Польское ę — русское «у», как ręka и «рука». Rzucić rękawicę — бросить вызов, podjąć rękawicę — принять его."
idioms:
  - { pl: "rzucić rękawicę", ru: "бросить перчатку, бросить вызов" }
  - { pl: "podjąć rękawicę", ru: "принять вызов" }
