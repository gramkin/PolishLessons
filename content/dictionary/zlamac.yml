# review
id: zlamac
format: 2
lemma: "złamać"
rank: 719
pos: verb
aspect: perf
pron: { cyr: "зуа́маць" }
senses:
  - id: break
    ru: "сломать (кость, предмет)"
    examples:
      - pl: "Złamał rękę."
        ru: "Он сломал руку."
        source: { kind: translated, id: 9348264 }
      - pl: "Złamałem rękę."
        ru: "Я сломал руку."
        source: { kind: translated, id: 1185376 }
      - pl: "Złamałam nogę."
        ru: "Я сломала ногу."
        source: { kind: translated, id: 9348290 }
  - id: violate
    ru: "нарушить (закон, правило, обещание)"
    note: "Очень частое значение: złamać prawo, złamać obietnicę, złamać zasady."
    examples:
      - pl: "Złamałaś prawo."
        ru: "Ты нарушила закон."
        source: { kind: tatoeba, id: 3409984 }
      - pl: "On nigdy nie złamie danej obietnicy."
        ru: "Он никогда не нарушает данных обещаний."
        source: { kind: tatoeba, id: 416735 }
      - pl: "Złamał zasady."
        ru: "Он нарушил правила."
        source: { kind: translated, id: 9348284 }
  - id: heartbreak
    ru: "разбить (сердце); сломить (человека)"
    examples:
      - pl: "Naprawdę chcesz złamać mi serce?"
        ru: "Ты действительно хочешь разбить мне сердце?"
        source: { kind: tatoeba, id: 2145668 }
      - pl: "Ma złamane serce."
        ru: "У него разбито сердце."
        source: { kind: translated, id: 3452317 }
      - pl: "Ta wiadomość złamała jej serce."
        ru: "Эта новость разбила ей сердце."
        source: { kind: translated, id: 3239716 }
notes:
  - { kind: usage, text: "Формы złamię, złamiesz, złamie — БУДУЩЕЕ время: глагол совершенного вида. Несовершенный — łamać." }
  - { kind: usage, text: "Три значения держатся вместе, как и в русском: сломать кость (złamać nogę), нарушить правило (złamać prawo) и разбить сердце (złamać serce)." }
  - { kind: usage, text: "Причастие złamany значит и «сломанный», и «разбитый», и «сломленный»: złamana noga, złamane serce, człowiek złamany nieszczęściem." }
  - { kind: usage, text: "Обороты: na złamanie karku «сломя голову», złamać hasło «взломать пароль», nie dać złamanego grosza «не дать ни гроша»." }
collocations:
  - { pl: "złamać nogę", ru: "сломать ногу" }
  - { pl: "złamać prawo", ru: "нарушить закон" }
  - { pl: "złamać obietnicę", ru: "нарушить обещание" }
  - { pl: "złamać serce", ru: "разбить сердце" }
family:
  - { pl: "łamać", ru: "ломать", relation: derived }
  - { pl: "złamanie", ru: "перелом", relation: derived }
  - { pl: "łamigłówka", ru: "головоломка", relation: derived }
etymology: "Приставка z- плюс łamać «ломать», от праславянского *lomiti — то же слово, что русское «сломать». Отсюда złamanie «перелом» и łamigłówka «головоломка»."
memory: "złamać — «сломать», и три русских значения держатся вместе, как и у нас: złamać nogę «сломать ногу», złamać prawo «нарушить закон», złamać serce «разбить сердце». Формы złamię, złamiesz — будущее время, несовершенный вид — łamać. Причастие złamany покрывает все три: złamana noga, złamane serce, człowiek złamany nieszczęściem. Обороты: na złamanie karku «сломя голову», nie dać złamanego grosza «не дать ни гроша»."
idioms:
  - { pl: "złamać serce", ru: "разбить сердце" }
  - { pl: "na złamanie karku", ru: "сломя голову" }
  - { pl: "nie dać złamanego grosza", ru: "не дать ни гроша" }
