# review
id: plynac
format: 2
lemma: "płynąć"
rank: 1958
pos: verb
pron: { cyr: "пуы́нонць" }
senses:
  - id: swim
    ru: "плыть (в одну сторону, один раз)"
    examples:
      - pl: "Płyniemy do brzegu."
        ru: "Мы плывём к берегу."
        source: { kind: authored }
      - pl: "Statek płynął całą noc."
        ru: "Корабль плыл всю ночь."
        source: { kind: authored }
      - pl: "Płyń powoli, nie męcz się."
        ru: "Плыви медленно, не утомляйся."
        source: { kind: authored }
  - id: flow
    ru: "течь (о реке, времени, крови)"
    examples:
      - pl: "Rzeka płynie przez całe miasto."
        ru: "Река течёт через весь город."
        source: { kind: authored }
      - pl: "Czas płynie szybciej, niż się wydaje."
        ru: "Время течёт быстрее, чем кажется."
        source: { kind: authored }
  - id: flowing
    ru: "płynięcie — плавание, течение (как действие)"
    examples:
      - pl: "Płynięcie pod prąd kosztuje więcej sił."
        ru: "Плыть против течения стоит больше сил."
        source: { kind: authored }
      - pl: "Po godzinie płynięcia zobaczyli brzeg."
        ru: "Через час плавания они увидели берег."
        source: { kind: authored }
notes:
  - { kind: usage, text: "ТА ЖЕ РАЗВИЛКА, ЧТО У BIEGAĆ, И ОНА ЕСТЬ В РУССКОМ. Płynąć — «плыть»: один раз, в одну сторону, сейчас. Pływać — «плавать»: вообще, не раз, в разные стороны. Pływam co sobotę значит «я плаваю по субботам», а płynę do brzegu — «я плыву к берегу». Правило выбора у поляка и русского одно, так что переносите его из родного языка целиком, как и в парах chodzić/iść, jeździć/jechać." }
  - { kind: pronunciation, text: "ЧЕРЕДОВАНИЕ НОСОВЫХ в прошедшем времени: płynął, но płynęła, płynęło, płynęli. У глаголов на -nąć в мужском роде единственного числа стоит ą, а во всех остальных формах — ę. Так же zasnął/zasnęła и utknął/utknęła. Ошибиться тут легко, потому что на слух разница невелика." }
  - { kind: government, text: "Плывут КУДА — do с родительным (płynąć do brzegu) или w stronę с родительным. А вот «по течению» строится иначе: поляк говорит płynąć Z PRĄDEM, с предлогом z и творительным, буквально «с течением»; против течения — pod prąd, с винительным. Русское «по течению» сюда не переносится." }
  - { kind: register, text: "Переносные значения совпадают с русскими: czas płynie «время течёт», łzy płyną «слёзы текут», pieniądze płyną szerokim strumieniem «деньги текут рекой». Глагол непереходный, поэтому страдательного причастия у него нет вовсе." }
collocations:
  - { pl: "płynąć z prądem", ru: "плыть по течению" }
  - { pl: "płynąć pod prąd", ru: "плыть против течения" }
  - { pl: "czas płynie", ru: "время течёт" }
family:
  - { pl: "pływać", ru: "плавать (вообще)", relation: aspect }
  - { pl: "płyn", ru: "жидкость", relation: root }
  - { pl: "płynny", ru: "жидкий; плавный", relation: derived }
etymology: "Общеславянский корень, тот же, что в русских «плыть», «плавать», «плот», «половодье». Польское płynąć и русское «плыть» — одно слово; от него же płyn «жидкость» и płynny «жидкий, плавный». Пара płynąć/pływać в точности повторяет русскую «плыть/плавать»."
memory: "płynąć — «плыть», и важна не форма, а пара: płynąć это «плыть» (раз, в одну сторону), pływać — «плавать» (вообще). Выбирают как в русском. И следите за носовыми: płynął, но płynęła."
idioms:
  - { pl: "płynąć z prądem", ru: "плыть по течению" }
  - { pl: "czas płynie", ru: "время течёт" }
