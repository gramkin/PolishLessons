etymology: "Причастие от глагола PRZEWODNICZYĆ «председательствовать», а тот — от PRZEWODZIĆ «водить, предводительствовать», из приставки PRZE- «через, впереди» и корня WODZIĆ, того же, что в русском «водить», «вождь», «воевода». То есть польская должность названа по ведению: председательствующий есть тот, кто ведёт собрание. Русское «председатель» построено совсем иначе — это калька латинского PRAESES, от PRAE- «перед» и SEDERE «сидеть», то есть «сидящий впереди». Получается красивая пара: латынь и русский усаживают ведущего во главе стола, а польский заставляет его вести за собой. От того же корня WODZIĆ происходит и PRZEWODNIK, которое значит и проводника в горах, и путеводитель, и электрический проводник: всё это то, что проводит."
memory: "Причастие в роли должности, и склоняется как прилагательное: przewodniczącego, przewodniczącemu, как dobrego, dobremu. Женская форма przewodnicząca свободна, в отличие от pani prezes. Разделение: przewodniczący ведёт заседание комиссии или совета, prezes стоит во главе фирмы. От wodzić «водить» — тот, кто ведёт, тогда как «председатель» — тот, кто сидит впереди."
