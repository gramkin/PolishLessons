notes:
  - { kind: usage, text: "Это причастие, ставшее названием должности, и потому оно склоняется как прилагательное, а не как существительное: PRZEWODNICZĄCY, PRZEWODNICZĄCEGO, PRZEWODNICZĄCEMU — ровно так же, как DOBRY, DOBREGO, DOBREMU. Русское «председатель» есть обычное существительное, и эта разница в типе склонения — главная трудность карточки. Таких названий ролей в польском целый ряд, и все они причастия, а значит склоняются по-прилагательному: OSKARŻONY «обвиняемый», ZATRUDNIONY «работник», POSZKODOWANY «потерпевший», UBEZPIECZONY «застрахованный»." }
  - { kind: government, text: "Чего председатель — родительный без предлога: PRZEWODNICZĄCY KOMISJI, PRZEWODNICZĄCY RADY, PRZEWODNICZĄCY ZESPOŁU. Женская форма PRZEWODNICZĄCA образуется и употребляется совершенно свободно, в отличие от PANI PREZES, где существительное остаётся мужским. Обращение в звательном совпадает с именительным, потому что у прилагательных звательный равен именительному: PANIE PRZEWODNICZĄCY «господин председатель». Это удобно: формы запоминать не надо." }
  - { kind: pronunciation, text: "Читается «пшэводничо́нцы», ударение на предпоследнем слоге, то есть на -CZĄ-. Начальное PRZE даёт «пшэ», с оглушением r в «ш». Носовая ą перед c звучит «он», как в SĄD и WĄTROBA. Сочетание CZĄ выходит «чон», а конечное -CY — «цы». Слово длинное, пять слогов, и проговорить его стоит по частям: PRZE-WOD-NI-CZĄ-CY." }
  - { kind: false-friend, text: "Ловушка в том, что русское «председатель» покрывает и PRZEWODNICZĄCY, и PREZES, а польский их различает по области. PRZEWODNICZĄCY ведёт заседание: комиссии, совета, парламента, то есть собрание людей. PREZES стоит во главе организации: фирмы, клуба, партии. Главу Сейма, впрочем, называют третьим словом — MARSZAŁEK, — а PRZEWODNICZĄCY бывает у комиссий, советов и рабочих групп. В компании же начальник — PREZES ZARZĄDU, и назвать его PRZEWODNICZĄCY будет ошибкой." }
