# review
id: poprosic
format: 2
lemma: "poprosić"
rank: 466
pos: verb
aspect: perf
pron: { cyr: "попро́сиць" }
senses:
  - id: ask
    ru: "попросить"
    examples:
      - pl: "Poprosiła mnie o pomoc."
        ru: "Она обратилась ко мне за помощью."
        source: { kind: tatoeba, id: 1270111 }
      - pl: "Tom poprosił o pieniądze."
        ru: "Том попросил денег."
        source: { kind: tatoeba, id: 5947930 }
      - pl: "Poprosiła go o pomoc."
        ru: "Она попросила его о помощи."
        source: { kind: translated, id: 3452375 }
  - id: order
    ru: "Poproszę… — вежливая формула заказа"
    examples:
      - pl: "Poproszę o sól."
        ru: "Пожалуйста, соль."
        source: { kind: tatoeba, id: 1604367 }
      - pl: "Poproszę herbatę z cytryną."
        ru: "Чай с лимоном, пожалуйста."
        source: { kind: tatoeba, id: 12586569 }
      - pl: "Poproszę dwie małe butelki."
        ru: "Две маленькие бутылки, пожалуйста."
        source: { kind: tatoeba, id: 6322301 }
notes:
  - { kind: usage, text: "Poproszę… — стандартная вежливая формула в магазине и кафе: Poproszę herbatę z cytryną «Чай с лимоном, пожалуйста». Буквально это «попрошу»." }
  - { kind: usage, text: "Просят о чём-то с предлогом o и винительным падежом: poprosić o pomoc «попросить о помощи», poprosić o sól «попросить соль»." }
  - { kind: usage, text: "Несовершенный вид — prosić. Само proszę значит сразу три вещи: «прошу», «пожалуйста» и «пожалуйста» в ответ на спасибо." }
  - { kind: usage, text: "poprosić o rękę — «попросить руки», сделать предложение." }
collocations:
  - { pl: "poproszę", ru: "будьте добры" }
  - { pl: "poprosić o pomoc", ru: "попросить о помощи" }
  - { pl: "poprosić o rękę", ru: "сделать предложение" }
  - { pl: "poproś go", ru: "попроси его" }
etymology: "Из po- + prosić, праславянское *prositi; русское «попросить» собрано ровно из тех же частей."
memory: "poprosić — «попросить», слово буква в букву русское. Но выучить надо формулу Poproszę…: так поляк заказывает в кафе и магазине. Просят с предлогом o: poproszę o sól."
idioms:
  - { pl: "poproszę", ru: "будьте добры, дайте" }
  - { pl: "poprosić o rękę", ru: "сделать предложение" }
  - { pl: "poprosić o pomoc", ru: "попросить о помощи" }
