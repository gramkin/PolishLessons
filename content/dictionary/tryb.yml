  - id: mood
    ru: "наклонение (грам.)"
    examples:
      - pl: "Tryb rozkazujący wyraża polecenie."
        ru: "Повелительное наклонение выражает приказ."
        source: { kind: authored }
      - pl: "W tym zdaniu jest tryb przypuszczający."
        ru: "В этом предложении сослагательное наклонение."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "TRYB — «режим, порядок», а в грамматике — «наклонение»: TRYB ROZKAZUJĄCY, «повелительное». Образ жизни — TRYB ŻYCIA. W TRYBIE PILNYM — «в срочном порядке». Шестерёнка — TRYBIK." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Родительный — TRYBU. В местном B смягчается: W TRYBIE." }
  - { kind: government, text: "В каком порядке — W TRYBIE и родительный или прилагательное: W TRYBIE NATYCHMIASTOWYM. Перейти в режим — PRZEJŚĆ W TRYB, винительный." }
  - { kind: pronunciation, text: "Читается «трып», один слог: Y — «ы», конечное B оглушается в «п». TRYBIE — «тры́бе»." }
collocations:
  - { pl: "tryb życia", ru: "образ жизни" }
  - { pl: "w trybie pilnym", ru: "в срочном порядке" }
  - { pl: "tryb rozkazujący", ru: "повелительное наклонение" }
family:
  - { pl: "sposób", ru: "способ", relation: root, id: sposob }
  - { pl: "reżim", ru: "режим", relation: root }
  - { pl: "trybik", ru: "шестерёнка, винтик", relation: derived }
etymology: "Из немецкого TRIEB «привод, движущая сила». В польском значение расширилось до «порядка, режима»."
memory: "Tryb — режим, порядок; tryb życia — образ жизни; tryb rozkazujący — повелительное наклонение. Читается «трып»."
idioms:
  - { pl: "być trybikiem w maszynie", ru: "быть винтиком в системе" }
