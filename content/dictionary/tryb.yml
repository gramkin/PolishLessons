pos: noun
pron: { cyr: "трып" }
senses:
  - id: mode
    ru: "режим, порядок"
    examples:
      - pl: "Telefon jest w trybie samolotowym."
        ru: "Телефон в авиарежиме."
        source: { kind: authored }
      - pl: "Sprawę załatwiono w trybie pilnym."
        ru: "Дело решили в срочном порядке."
        source: { kind: authored }
      - pl: "Zmienił tryb życia na zdrowszy."
        ru: "Он сменил образ жизни на более здоровый."
