# review
id: odzyskac
format: 2
lemma: "odzyskać"
rank: 856
pos: verb
aspect: perf
pron: { cyr: "одзы́скаць" }
senses:
  - id: regain
    ru: "вернуть себе, получить обратно"
    examples:
      - pl: "Straconego czasu nie da się odzyskać."
        ru: "Потерянного времени не вернуть."
        source: { kind: tatoeba, id: 12727200 }
      - pl: "Odzyskałem od niego pieniądze."
        ru: "Я вернул у него деньги."
        source: { kind: translated, id: 973258 }
      - pl: "Odzyskałaś swoje pieniądze?"
        ru: "Ты вернула свои деньги?"
        source: { kind: translated, id: 3584728 }
  - id: recover
    ru: "о здоровье и чувствах: odzyskać wzrok, przytomność"
    examples:
      - pl: "Tom odzyskał wzrok."
        ru: "Том вернул себе зрение."
        source: { kind: translated, id: 12180515 }
      - pl: "Tom odzyskał równowagę."
        ru: "Том восстановил равновесие."
        source: { kind: translated, id: 1627149 }
      - pl: "Zemdlała, ale szybko odzyskała świadomość."
        ru: "Она потеряла сознание, но быстро пришла в себя."
        source: { kind: translated, id: 669633 }
  - id: recovered
    ru: "odzyskany — возвращённый, найденный"
    examples:
      - pl: "Policja odzyskała skradzioną biżuterię."
        ru: "Полиция вернула украденные драгоценности."
        source: { kind: translated, id: 735871 }
      - pl: "Skradziony kamień musi zostać odzyskany za wszelką cenę."
        ru: "Украденный камень должен быть возвращён любой ценой."
        source: { kind: translated, id: 13561813 }
      - pl: "Odzyskamy ją."
        ru: "Мы её вернём."
        source: { kind: translated, id: 6315410 }
notes:
  - { kind: government, text: "odzyskać coś «вернуть себе что-то» — винительный падеж; odzyskać coś OD kogoś «получить обратно от кого-то» — родительный после od: Odzyskałem od niego pieniądze." }
  - { kind: usage, text: "Несовершенный вид — odzyskiwać. Пара работает как в русском: «возвращать себе» — «вернуть себе»." }
  - { kind: usage, text: "С названиями состояний глагол переводится по-русски разными словами: odzyskać wzrok «вернуть зрение», odzyskać przytomność «прийти в сознание», odzyskać równowagę «восстановить равновесие», odzyskać wolność «обрести свободу»." }
  - { kind: usage, text: "Корень тот же, что в zysk «прибыль» и zyskać «получить, приобрести». Приставка od- добавляет значение возврата, ровно как русское «от-» в «отвоевать»." }
collocations:
  - { pl: "odzyskać przytomność", ru: "прийти в сознание" }
  - { pl: "odzyskać wolność", ru: "обрести свободу" }
  - { pl: "odzyskać pieniądze", ru: "вернуть деньги" }
  - { pl: "odzyskać równowagę", ru: "восстановить равновесие" }
family:
  - { pl: "odzyskiwać", ru: "возвращать себе", relation: aspect }
  - { pl: "zysk", ru: "прибыль", relation: root }
  - { pl: "zyskać", ru: "приобрести", relation: root }
etymology: "Из od- + zyskać «приобрести», от zysk «прибыль». Приставка od- означает возврат, как русское «от-» в «отвоевать»: odzyskać — «получить обратно»."
memory: "odzyskać — «вернуть себе, получить обратно». Внутри сидит zysk «прибыль», а приставка od- отвечает за возврат. По-русски переводится по-разному в зависимости от дополнения: odzyskać przytomność «прийти в сознание», odzyskać wzrok «вернуть зрение», odzyskać wolność «обрести свободу»."
idioms:
  - { pl: "odzyskać przytomność", ru: "прийти в сознание" }
  - { pl: "odzyskać wolność", ru: "обрести свободу" }
  - { pl: "odzyskać równowagę", ru: "восстановить равновесие" }
