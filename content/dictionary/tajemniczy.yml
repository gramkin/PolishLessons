family:
  - { pl: "tajemnica", ru: "тайна", relation: root, id: tajemnica }
  - { pl: "tajny", ru: "тайный, секретный", relation: derived, id: tajny }
  - { pl: "taić", ru: "таить, скрывать", relation: root }
etymology: "От tajemnica «тайна», а та — от праславянского *tajiti «таить», того же корня, что русские «таить», «тайна», «втайне». Суффикс -iczy придал значение «окутанный тайной», поэтому вышло не «тайный», а «таинственный». Русское «таинственный» построено по той же логике, от «таинство»."
memory: "tajemniczy — «таинственный», от tajemnica «тайна», корень тот же, что в русском «таить». Не путайте с tajny «секретный»: tajny документ скрывают, tajemniczy — не понимают."
