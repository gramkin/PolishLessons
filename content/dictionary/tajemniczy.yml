notes:
  - { kind: false-friend, text: "Корень слову русский глаз узнаёт сразу: tajemnica — «тайна», и оба слова идут от праславянского *tajiti «таить». Но перевод не «тайный», а ТАИНСТВЕННЫЙ: tajny и tajemniczy в польском различаются, как «тайный» и «таинственный» в русском. Tajny dokument — секретный документ, tajemniczy dokument — загадочный, непонятный." }
  - { kind: usage, text: "Мужско-личная форма множественного совпадает с именительным единственного: и «таинственный мужчина», и «таинственные мужчины» будут tajemniczy. Различает только согласование: tajemniczy mężczyzna против tajemniczy mężczyźni. Это обычное для прилагательных на -czy, -szy, -ży." }
  - { kind: government, text: "Вторым значением слово описывает манеру: tajemniczym tonem, z tajemniczą miną — творительный падеж без предлога, как в русском «загадочным тоном»." }
  - { kind: pronunciation, text: "Прилагательное склоняется полностью, но многие падежи совпадают по форме, поэтому различных написаний всего десять-одиннадцать, а не двадцать пять. Примеры в каждом слоте нарочно взяты из разных падежей, чтобы видно было весь охват формы." }
collocations:
  - { pl: "tajemnicza mina", ru: "загадочное лицо" }
