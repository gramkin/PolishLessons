# review
id: pokoj
format: 2
lemma: "pokój"
rank: 266
pos: noun
pron: { cyr: "по́куй" }
senses:
  - id: room
    ru: "комната; номер (в гостинице)"
    examples:
      - pl: "To mój pokój."
        ru: "Это моя комната."
        source: { kind: tatoeba, id: 2194298 }
      - pl: "Lubię ten pokój."
        ru: "Мне нравится эта комната."
        source: { kind: tatoeba, id: 4735323 }
      - pl: "W pokoju stoi stół."
        ru: "В комнате стоит стол."
        source: { kind: tatoeba, id: 2116628 }
  - id: peace
    ru: "мир (отсутствие войны), покой"
    note: "То же слово, что русское «покой»: мир и есть покой."
    examples:
      - pl: "Pokój z wami."
        ru: "Мир вам."
        source: { kind: tatoeba, id: 3460229 }
      - pl: "Traktat pokoju podpisano w maju."
        ru: "Мирный договор подписали в мае."
        source: { kind: authored }
      - pl: "Żyjemy w pokoju."
        ru: "Мы живём в мире."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Одно слово значит и «комната», и «мир»: pokój dziecięcy «детская комната», но pokój na świecie «мир на земле». Русское «покой» — то же слово, только значение сузилось." }
  - { kind: usage, text: "В гостинице pokój значит «номер»: pokój jednoosobowy «одноместный номер», Ile kosztuje pokój? «Сколько стоит номер?»" }
  - { kind: usage, text: "У родительного множественного две формы: pokoi и pokojów, обе правильные." }
collocations:
  - { pl: "pokój dziecięcy", ru: "детская комната" }
  - { pl: "wolny pokój", ru: "свободный номер" }
  - { pl: "pokój z wami", ru: "мир вам" }
  - { pl: "w pokoju", ru: "в комнате, в мире" }
etymology: "Праславянское *pokojь — то же слово, что русское «покой»; мир и есть покой, а комната — место покоя."
memory: "pokój — и «комната», и «мир». Русское «покой» — то же слово: мир и есть покой. А в гостинице pokój значит «номер»."
idioms:
  - { pl: "fajka pokoju", ru: "трубка мира" }
  - { pl: "gołąbek pokoju", ru: "голубь мира" }
  - { pl: "pokój z wami", ru: "мир вам" }
formExamplesSkip:
