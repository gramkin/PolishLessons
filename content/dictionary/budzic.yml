        ru: "Он вызывает доверие с первой минуты."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Корень общий и прямое значение совпадает: budzić это «будить», из того же праславянского *buditi. Совпадает и производное: budzik отвечает русскому «будильнику», собранному тем же способом. Расходится переносное употребление, и оно у польского шире: budzić zaufanie, budzić wątpliwości, budzić podziw — по-русски тут почти всегда нужно «ВЫЗЫВАТЬ», а не «будить»." }
  - { kind: government, text: "Будят КОГО — винительный падеж: budzić dziecko, gości, pacjenta. Чем — творительный без предлога: budzić kogoś telefonem, hałasem. Возвратное budzić się значит «просыпаться» и дополнения не требует. В переносном значении дополнение тоже винительное: budzić zaufanie, budzić niepokój." }
  - { kind: pronunciation, text: "dz перед i читается мягко, как дзь: budzić звучит «бу́дзиць», budzę — «бу́дзэн». В повелительном наклонении от основы остаётся только мягкость: budź, «будзь»." }
  - { kind: usage, text: "Вид несовершенный, совершенная пара — obudzić. Страдательное причастие budzony образовано по правилу «-ić даёт -ony», но в мужско-личном множественном выходит budzeni, а не «budzoni»: то же чередование, что у pomówiony → pomówieni и powiadomiony → powiadomieni." }
collocations:
