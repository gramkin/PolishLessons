etymology: "Из праславянского *buditi — того же слова, что русское «будить», и от того же корня, что czuwać, а в русском «бдеть» и «бодрый». Отсюда budzik «будильник», obudzić «разбудить», pobudka «подъём» и przebudzenie «пробуждение»."
memory: "budzić — «будить», корень общий, и budzik это «будильник». Запомнить надо переносное значение: budzić zaufanie, budzić wątpliwości по-русски будет «ВЫЗЫВАТЬ доверие, сомнения», а не «будить». И мужско-личное причастие budzeni, а не «budzoni»."
