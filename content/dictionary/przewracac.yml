# review
id: przewracac
format: 2
lemma: "przewracać"
rank: 5913
pos: verb
aspect: imperf
aspectPair: przewrocic
pron: { cyr: "пшэвра́цаць" }
senses:
  - id: knock-over
    ru: "опрокидывать, валить"
    examples:
      - pl: "Wiatr przewraca drzewa w parku."
        ru: "Ветер валит деревья в парке."
        source: { kind: authored }
      - pl: "Kot ciągle przewraca kubki na stole."
        ru: "Кот постоянно опрокидывает кружки на столе."
        source: { kind: authored }
  - id: turn-over
    ru: "переворачивать (на другую сторону)"
    examples:
      - pl: "Przewracałem stronę za stroną."
        ru: "Я переворачивал страницу за страницей."
        source: { kind: translated, id: 837074 }
      - pl: "Tom zaczął szybciej przewracać strony."
        ru: "Том начал быстрее переворачивать страницы."
        source: { kind: translated, id: 3690488 }
      - pl: "Babcia zręcznie przewraca naleśniki."
        ru: "Бабушка ловко переворачивает блины."
        source: { kind: authored }
  - id: fall
    ru: "przewracać się — падать, опрокидываться; ворочаться"
    examples:
      - pl: "Przez całą noc przewracał się z boku na bok."
        ru: "Всю ночь он ворочался в постели."
        source: { kind: tatoeba, id: 728585 }
      - pl: "Małe dzieci często się przewracają."
        ru: "Маленькие дети часто падают."
        source: { kind: authored }
      - pl: "Moja dawna nauczycielka angielskiego musi się teraz przewracać w grobie."
        ru: "Моя бывшая учительница английского, должно быть, сейчас переворачивается в гробу."
        source: { kind: translated, id: 758420 }
notes:
  - { kind: false-friend, text: "PRZEWRACAĆ — «опрокидывать, переворачивать», а не «превращать». «Превращать» по-польски — ZAMIENIAĆ, PRZEMIENIAĆ. PRZE- здесь соответствует русскому «пере-», WRAC — «ворот»: PRZEWRACAĆ STRONY «переворачивать страницы»." }
  - { kind: usage, text: "Несовершенный вид; совершенный — PRZEWRÓCIĆ. Спряжение на -AM: PRZEWRACAM, PRZEWRACASZ, PRZEWRACAJĄ. С SIĘ — «падать, опрокидываться»: DZIECKO SIĘ PRZEWRACA; PRZEWRACAĆ SIĘ Z BOKU NA BOK — «ворочаться»." }
  - { kind: government, text: "Что — винительный: PRZEWRACAĆ KRZESŁO, NALEŚNIKI, STRONY. На что — NA + винительный: PRZEWRACAĆ NA DRUGĄ STRONĘ. Падать обо что — O + винительный: PRZEWRACAĆ SIĘ O KAMIEŃ." }
  - { kind: pronunciation, text: "Читается «пшэвра́цаць»: PRZ — «пш», C — «ц». Ударение на предпоследнем слоге: PRZEWRACAM — «пшэвра́цам»." }
collocations:
  - { pl: "przewracać strony", ru: "переворачивать страницы" }
  - { pl: "przewracać naleśniki", ru: "переворачивать блины" }
  - { pl: "przewracać się z boku na bok", ru: "ворочаться с боку на бок" }
  - { pl: "przewracać do góry nogami", ru: "переворачивать вверх дном" }
family:
  - { pl: "przewrócić", ru: "опрокинуть, перевернуть", relation: aspect, id: przewrocic }
  - { pl: "wracać", ru: "возвращаться", relation: root, id: wracac }
  - { pl: "odwracać", ru: "отворачивать, переворачивать", relation: root, id: odwracac }
  - { pl: "wywracać", ru: "опрокидывать, выворачивать", relation: root }
  - { pl: "przewrót", ru: "переворот", relation: derived }
etymology: "Приставка PRZE- «пере-» и WRACAĆ «вертеть, возвращать». Корень тот же, что в русских «ворот», «воротить», «вращать»."
memory: "Przewracać — «переворачивать», не «превращать»: PRZE = пере-, WRAC = ворот."
idioms:
  - { pl: "przewracać się w grobie", ru: "переворачиваться в гробу" }
  - { pl: "przewracać oczami", ru: "закатывать глаза" }
