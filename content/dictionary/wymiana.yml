etymology: "От WYMIENIAĆ, приставочного к MIENIĆ «менять», из праславянского *měniti — того же корня, что русские «менять», «обмен», «замена» и «измена». Слово прозрачно насквозь: приставка wy- отвечает русской «об-» или «за-» по смыслу, а корень тот же. Любопытно, что русская «измена» и польская wymiana восходят к одному гнезду: предательство есть подмена, обмен верности на выгоду."
memory: "Дательный и местный wymianie: n даёт ni. А в родительном множественного wymian гласная не меняется — в отличие от mód, потому что долгое a в польском не выжило."
