notes:
  - { kind: usage, text: "Дательный и местный — WYMIANIE: n переходит в ń, которое перед гласной пишется ni. Рядом в этой же партии стоит OGON с местным OGONIE — то же самое изменение. Добавьте это к таблице из карточки MODA, и выйдет, что перед окончанием -e смягчается решительно всё: t даёт ć, d даёт dź, s даёт ś, r даёт rz, k даёт c, m даёт mi, n даёт ń. Проще считать, что твёрдых согласных перед -e в польском не бывает вовсе, и исключений не искать." }
  - { kind: pronunciation, text: "Родительный множественного — WYMIAN, голая основа без окончания, и гласная при этом не меняется. Сравните MÓD от MODA из партии 229, где в точно такой же позиции o превратилось в ó. Разница историческая: старопольский удлинял гласную в закрытом конечном слоге, но следы этого удлинения сохранились в письме только у двух гласных — долгое o дало ó, долгий носовой дал ą. Долгие á и é к девятнадцатому веку слились с краткими и исчезли без следа. Поэтому moda — mód показывает чередование, а wymiana — wymian показать его не может: удлинялась здесь a, а её долгий вариант не выжил." }
  - { kind: usage, text: "Русский делит это понятие на два слова, польский — нет. WYMIANA значит и «обмен» (wymiana walut, wymiana zdań, wymiana doświadczeń), и «замена» (wymiana oleju, wymiana opon, wymiana żarówki). Выбор перевода подсказывает только дополнение: меняют одно на другое — обмен; ставят новое вместо старого — замена. Само польское слово разницы не чувствует." }
