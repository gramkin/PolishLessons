etymology: "Два значения из разных источников: «тара» как вес — из итальянского TARA, а оно из арабского TARḤ «вычет»; «стиральная доска», вероятно, связано с TRZEĆ «тереть»."
memory: "Tara — стиральная доска: prać na tarze. На весах — тара, вес упаковки. Ящики и коробки — opakowania."
idioms:
  - { pl: "grać na tarze", ru: "играть на стиральной доске (в народном оркестре)" }
