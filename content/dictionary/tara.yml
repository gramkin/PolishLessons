notes:
  - { kind: false-friend, text: "TARA — прежде всего «стиральная доска». Русская «тара» в смысле «упаковка, ящики» по-польски — OPAKOWANIA; польское TARA значит только вес упаковки, на весах и в торговле: TARA, NETTO, BRUTTO." }
  - { kind: usage, text: "Женский род на -A. Дательный и предложный — TARZE: R чередуется с RZ. Родительный множественного — TAR. Звательная форма в карточку не включена. Кнопка обнуления на кухонных весах тоже называется TARA." }
  - { kind: government, text: "На чём стирать — NA с предложным: PRAĆ NA TARZE. Без чего — BEZ с родительным: WAGA BEZ TARY." }
  - { kind: pronunciation, text: "Читается «та́ра», ударение на первом слоге. TARZE — «та́же»: RZ — «ж»." }
  - { kind: register, text: "Нейтральное слово, но стиральная доска сегодня — предмет старины или народный музыкальный инструмент." }
collocations:
  - { pl: "prać na tarze", ru: "стирать на стиральной доске" }
  - { pl: "waga bez tary", ru: "вес без тары" }
  - { pl: "tara do prania", ru: "стиральная доска" }
family:
  - { pl: "prać", ru: "стирать", relation: root, id: prac }
