# review
id: trafic
format: 2
lemma: "trafić"
rank: 592
pos: verb
aspect: perf
pron: { cyr: "тра́фиць" }
senses:
  - id: hit
    ru: "попасть (в цель)"
    note: "trafić w coś — предлог w с винительным: trafić w cel."
    examples:
      - pl: "Trafił w cel."
        ru: "Он попал в цель."
        source: { kind: translated, id: 349220 }
      - pl: "Strzała trafiła w cel."
        ru: "Стрела попала в цель."
        source: { kind: tatoeba, id: 12470619 }
      - pl: "Trafiłeś w środek tarczy."
        ru: "Ты попал в середину мишени."
        source: { kind: tatoeba, id: 5704996 }
  - id: get-there
    ru: "попасть, добраться, оказаться где-либо"
    note: "Здесь другое управление: trafić do czegoś — trafić do szpitala «попасть в больницу»."
    examples:
      - pl: "Przepraszam, którędy trafię na dworzec kolejowy?"
        ru: "Извините, как мне попасть на вокзал?"
        source: { kind: translated, id: 2378476 }
      - pl: "Pod żadnym pozorem nie chcę trafić do więzienia."
        ru: "Я ни в коем случае не хочу попасть в тюрьму."
        source: { kind: translated, id: 4104326 }
      - pl: "W końcu trafiliśmy na tę obskurną knajpę."
        ru: "В конце концов мы набрели на эту убогую забегаловку."
        source: { kind: translated, id: 982391 }
notes:
  - { kind: government, text: "Два управления, и они различают смысл: trafić w coś «попасть во что-то» (w + винительный) — trafić w cel; и trafić do czegoś «попасть куда-то» — trafić do szpitala, trafić do więzienia." }
  - { kind: false-friend, text: "Существительное traf значит «случай, случайность»: szczęśliwy traf «счастливая случайность». Пишется оно так же, как повелительное наклонение traf «попади», но это разные слова." }
  - { kind: usage, text: "Формы trafię, trafisz, trafi — БУДУЩЕЕ время: глагол совершенного вида. Несовершенный вид — trafiać." }
  - { kind: usage, text: "Слово заимствовано из немецкого treffen «попасть, встретить», поэтому русской опоры у него нет — в отличие от большинства соседей по словарю его приходится просто запомнить." }
collocations:
  - { pl: "trafić w cel", ru: "попасть в цель" }
  - { pl: "trafić do szpitala", ru: "попасть в больницу" }
  - { pl: "trafić w sedno", ru: "попасть в точку" }
  - { pl: "na chybił trafił", ru: "наугад" }
family:
  - { pl: "trafiać", ru: "попадать", relation: derived }
  - { pl: "trafienie", ru: "попадание", relation: derived }
  - { pl: "traf", ru: "случайность", relation: derived }
  - { pl: "trafny", ru: "меткий", relation: derived }
  - { pl: "natrafić", ru: "наткнуться", relation: derived, id: natrafic }
etymology: "Заимствование из средневерхненемецкого treffen «попасть, встретить» — того же корня, что немецкое Treffer «попадание». Русского соответствия у слова нет."
memory: "trafić — «попасть», и управление различает два смысла: trafić w coś «попасть во что-то» (w + винительный) — trafić w cel; trafić do czegoś «попасть куда-то» — trafić do szpitala, trafić do więzienia. Слово немецкого происхождения (treffen), так что русской опоры нет — зато обороты запоминаются сразу: trafić w sedno «попасть в точку», trafić w dziesiątkę, na chybił trafił «наугад», trafić kulą w płot «попасть пальцем в небо». И не путайте глагол с существительным traf «случайность»: szczęśliwy traf «счастливый случай»."
idioms:
  - { pl: "trafić w sedno", ru: "попасть в точку" }
  - { pl: "na chybił trafił", ru: "наугад" }
  - { pl: "trafić kulą w płot", ru: "попасть пальцем в небо" }
