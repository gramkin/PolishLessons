# review
id: wiadomo
format: 2
lemma: "wiadomo"
rank: 1374
pos: adv
pron: { cyr: "вядо́мо" }
senses:
  - id: known
    ru: "известно, ясно — безличное"
    examples:
      - pl: "A smoki, jak wiadomo, odżywiają do stu lat."
        ru: "А драконы, как известно, доживают до ста лет."
        source: { kind: tatoeba, id: 6018576 }
      - pl: "Nie wiadomo, czy się zgodzi, czy nie."
        ru: "Неизвестно, согласится он или нет."
        source: { kind: tatoeba, id: 13784830 }
      - pl: "Nie wiadomo, co będzie."
        ru: "Неизвестно, что будет."
        source: { kind: translated, id: 900920 }
  - id: as-far-as
    ru: "o ile mi wiadomo — насколько мне известно"
    examples:
      - pl: "O ile mi wiadomo, takie słowo nie istnieje."
        ru: "Насколько я знаю, такого слова не существует."
        source: { kind: tatoeba, id: 2707304 }
      - pl: "Pana Jonesa, o ile mi wiadomo, tu nie było."
        ru: "Господина Джонса, насколько мне известно, здесь не было."
        source: { kind: tatoeba, id: 960883 }
      - pl: "Nigdy nie wiadomo, co szykuje nam przyszłość."
        ru: "Никогда не знаешь, что готовит нам будущее."
        source: { kind: tatoeba, id: 5909082 }
notes:
  - { kind: government, text: "Слово безличное: подлежащего при нём не бывает, а носитель знания стоит в дательном падеже — o ile mi wiadomo «насколько мне известно»." }
  - { kind: usage, text: "Nie wiadomo «неизвестно» — самая частая форма: Nie wiadomo, co będzie «Неизвестно, что будет»." }
  - { kind: usage, text: "Вводное jak wiadomo значит «как известно»: A smoki, jak wiadomo, żyją do stu lat." }
  - { kind: usage, text: "Nigdy nie wiadomo — готовая фраза «никогда не знаешь», о непредсказуемости." }
collocations:
  - { pl: "nie wiadomo", ru: "неизвестно" }
  - { pl: "o ile mi wiadomo", ru: "насколько мне известно" }
  - { pl: "jak wiadomo", ru: "как известно" }
etymology: "От wiadomy «известный», от wiedzieć «знать», из праславянского *věděti. Русское «ведомо» — то же слово, и оборот o ile mi wiadomo точно отвечает устаревшему «насколько мне ведомо»."
memory: "wiadomo — безличное «известно»: Nie wiadomo, co będzie «Неизвестно, что будет». Носитель знания стоит в дательном: o ile mi wiadomo «насколько мне известно». Русское «ведомо» — то же самое слово."
idioms:
