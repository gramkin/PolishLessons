notes:
  - { kind: false-friend, text: "РУССКОГО СООТВЕТСТВИЯ У КОРНЯ НЕТ — ЕГО НАДО УЧИТЬ ЦЕЛИКОМ. Kierować значит «руководить, управлять, вести», и корень этот заимствован из немецкого; в русском от него ничего не осталось. Зато гнездо внутри польского прозрачно и стоит выучить разом: kierunek «направление», kierowca «ВОДИТЕЛЬ», kierownik «РУКОВОДИТЕЛЬ», kierownica «руль», kierownictwo «руководство»." }
  - { kind: usage, text: "ДВА СУФФИКСА РАЗВОДЯТ ДВЕ ПРОФЕССИИ ОТ ОДНОГО КОРНЯ. Kierowca, с суффиксом -ca, ведёт машину; kierownik, с суффиксом -nik, ведёт отдел. Перепутать легко, а разница велика. Мужско-личное множественное: kierownicy, с k переходящим в c, как niewolnicy и zakładnicy." }
  - { kind: pronunciation, text: "Четыре слога, ударение на предпоследнем: kie-row-NIK — точнее kie-ROW-nik. Ki мягкое, w перед n звонкое: «керо́вник». Звательный и предложный: kierowniku." }
