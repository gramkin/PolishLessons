  - { pl: "kierunek", ru: "направление", relation: derived, id: kierunek }
etymology: "От kierować «направлять, руководить», а то — от kier «направление», заимствованного из средневекового немецкого. Суффикс -nik называет лицо, как в robotnik и pracownik. Русский этот корень не взял, поэтому опереться можно только на внутрипольское гнездо: kierunek, kierowca, kierownica, kierownictwo."
memory: "kierownik — «руководитель, заведующий». Корень kierować русской родни не имеет, учить надо гнездом: kierunek «направление», kierowca «ВОДИТЕЛЬ», kierownik «НАЧАЛЬНИК». Множественное kierownicy, с k переходящим в c."
