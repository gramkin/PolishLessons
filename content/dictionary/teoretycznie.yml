notes:
  - { kind: false-friend, text: "TEORETYCZNIE — «теоретически», но в разговоре это часто «по идее», с намёком, что на деле может выйти иначе: TEORETYCZNIE TO DZIAŁA, «по идее, это работает». Пара к нему — W PRAKTYCE или PRAKTYCZNIE." }
  - { kind: usage, text: "Наречие, одна форма, без степеней. Нередко противопоставляется практике в одной фразе: TEORETYCZNIE TAK, ALE W PRAKTYCE NIE." }
  - { kind: government, text: "Наречие ничем не управляет. Стоит обычно в начале фразы, задавая оговорку для всего высказывания." }
  - { kind: pronunciation, text: "Читается «тэорэты́чне», ударение на предпоследнем слоге. TE и RE твёрдые: «тэ», «рэ». TY — «ты»." }
collocations:
  - { pl: "teoretycznie możliwe", ru: "теоретически возможно" }
  - { pl: "teoretycznie i praktycznie", ru: "в теории и на практике" }
  - { pl: "teoretycznie tak", ru: "в принципе да" }
family:
  - { pl: "teoria", ru: "теория", relation: root, id: teoria }
  - { pl: "teoretyczny", ru: "теоретический", relation: root }
  - { pl: "teoretyk", ru: "теоретик", relation: root }
etymology: "От TEORETYCZNY, из греческого слова со значением «созерцание, рассмотрение». Русское «теоретически» — из того же источника."
memory: "Teoretycznie — теоретически и «по идее». Читается «тэорэты́чне». Teoretycznie tak, ale w praktyce nie — в теории да, на деле нет."
idioms:
  - { pl: "w teorii", ru: "в теории" }
