# review
id: wszyscy
format: 2
lemma: "wszyscy"
rank: 287
pos: noun
pron: { cyr: "фшы́сцы" }
senses:
  - id: everyone
    ru: "все (о людях)"
    note: "Лично-мужская форма: о людях wszyscy, об остальном wszystkie."
    examples:
      - pl: "Wszyscy kłamią."
        ru: "Мы все врём."
        source: { kind: tatoeba, id: 1012418 }
      - pl: "Wszyscy to wiedzą."
        ru: "Все это знают."
        source: { kind: tatoeba, id: 565340 }
      - pl: "Wszyscy poszli."
        ru: "Все пошли."
        source: { kind: tatoeba, id: 4837803 }
  - id: everyone-cases
    ru: "все (в косвенных падежах)"
    examples:
      - pl: "Wszystkim wam zimno?"
        ru: "Вам всем холодно?"
        source: { kind: tatoeba, id: 6320946 }
      - pl: "To dotyczy wszystkich."
        ru: "Это касается всех."
        source: { kind: tatoeba, id: 6069713 }
      - pl: "Wszyscy oszaleli."
        ru: "Все сошли с ума."
        source: { kind: tatoeba, id: 4491103 }
notes:
  - { kind: usage, text: "wszyscy — лично-мужская форма «все» и употребляется о людях: wszyscy ludzie, wszyscy przyszli. Для всего остального — wszystkie: wszystkie książki, wszystkie dzieci." }
  - { kind: usage, text: "Склонение: wszyscy, wszystkich, wszystkim, wszystkimi, o wszystkich." }
  - { kind: false-friend, text: "Не путайте wszyscy «все» и wszystko «всё»: Wszyscy wiedzą «Все знают», но Wszystko wiem «Я всё знаю»." }
collocations:
  - { pl: "wszyscy wiedzą", ru: "все знают" }
  - { pl: "dla wszystkich", ru: "для всех" }
  - { pl: "wszyscy razem", ru: "все вместе" }
  - { pl: "ze wszystkich", ru: "из всех" }
etymology: "Форма местоимения wszystek, праславянское *vьsь — то же слово, что русское «весь», «все»."
memory: "wszyscy — «все» о людях, а wszystkie — «все» об остальном: wszyscy ludzie, но wszystkie książki. И не путайте с wszystko «всё»."
idioms:
