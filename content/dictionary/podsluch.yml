notes:
  - { kind: false-friend, text: "Одна буква отделяет это слово от совсем другого. PODSŁUCH — прослушка, подслушивающее устройство. POSŁUCH, без D, значит «авторитет, послушание»: MIEĆ POSŁUCH U LUDZI — «иметь авторитет у людей», а NIE MA POSŁUCHU W KLASIE — «его в классе не слушают». Слова не родственны по смыслу и путать их нельзя. Сам же корень знаком: SŁUCH это «слух», SŁUCHAĆ «слушать», и PODSŁUCHAĆ отвечает русскому «подслушать» часть за частью, под плюс слух." }
  - { kind: pronunciation, text: "Читается «по́тсуух», и в этом коротком слове сошлись два правила. Первое: D перед глухой S оглушается, поэтому слышно «пот», а не «под». Второе: Ł даёт «у», а за ней стоит ещё одна U, тоже «у», так что вторая половина слова звучит «суух», с двумя «у» подряд. Конечное CH — это «х». Ударение на первом слоге. В глаголе PODSŁUCHAĆ картина та же: «потсуу́хачь»." }
  - { kind: government, text: "Поставить прослушку — ZAŁOŻYĆ PODSŁUCH, винительный падеж. Быть на прослушке — BYĆ NA PODSŁUCHU, предлог NA с местным, и это совпадает с русским оборотом. Запись с прослушки — NAGRANIE Z PODSŁUCHU, предлог Z с родительным. Глагол PODSŁUCHAĆ управляет винительным прямо: PODSŁUCHAŁ ROZMOWĘ «он подслушал разговор», а если подслушивают человека, то тоже винительный: PODSŁUCHAŁ SĄSIADÓW." }
  - { kind: usage, text: "Существительное мужского рода неодушевлённое, девять падежных форм, а не десять, потому что родительный и местный единственного числа совпали в PODSŁUCHU. Это обычное дело у существительных на -CH: по форме не отличить ZE PODSŁUCHU от NA PODSŁUCHU, различает только предлог. Множественное число совершенно обычно и означает отдельные установленные устройства: PODSŁUCHY ZAŁOŻONO W CZTERECH BIURACH." }
  - { kind: register, text: "Слово из языка полиции, суда и газет, и в бытовой речи попадается только в разговорах о политике. Частые обороты: ZAŁOŻYĆ PODSŁUCH «установить прослушку», BYĆ NA PODSŁUCHU «быть на прослушке», NAGRANIA Z PODSŁUCHÓW «записи с прослушек», PODSŁUCH TELEFONICZNY. Рядом стоит INWIGILACJA «слежка», слово более общее и более официальное. Разговорное название человека, который доносит, — KABEL, буквально «кабель»." }
