etymology: "Сложено из приставки POD- и существительного SŁUCH «слух», от праславянского корня, давшего русские «слух», «слушать», «слышать». Приставка работает точно как русская «под-» в словах «подслушать» и «подсмотреть»: действие исподтишка, снизу, незаметно. Русский построил от того же корня и той же приставки глагол «подслушать», но существительного «подслух» не сделал и для устройства взял другое слово, «прослушка», от «прослушивать». Так что разошлись языки не в корне и не в приставке, а только в том, какое производное закрепилось за техникой."
memory: "Корень знакомый: słuch это «слух», podsłuchać это «подслушать», часть за частью. Но существительного «подслух» в русском нет, там «прослушка». Читается «по́тсуух»: d перед глухой s оглушается в «т», а ł и u дают два «у» подряд. Девять форм, потому что родительный и местный совпали в podsłuchu, различает только предлог. И главное: posłuch без d это совсем другое слово, «авторитет», mieć posłuch."
