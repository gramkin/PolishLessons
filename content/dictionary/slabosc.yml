notes:
  - { kind: false-friend, text: "РЕДКИЙ СЛУЧАЙ ПОЛНОГО СОВПАДЕНИЯ, ВКЛЮЧАЯ ОБОРОТ. Słabość значит и телесную слабость, и пристрастие: MIEĆ SŁABOŚĆ DO CZEGOŚ — «иметь слабость к чему-то», с тем же предлогом do плюс родительный, что и русское «к» с дательным. Оба языка развили переносный смысл одинаково, так что переводить можно прямо." }
  - { kind: usage, text: "Ещё одно существительное класса на -ość, и форм у него шесть: słabość, słabości разом на родительный, дательный и предложный, słabością. Прилагательное — SŁABY «слабый», наречие SŁABO «слабо». Множественное słabości значит «слабые стороны», как русские «слабости»." }
  - { kind: pronunciation, text: "Три слога, ударение на предпоследнем: sła-BOŚĆ. Ł читается как краткое у, ść как мягкое щць: «суа́бощць». Начальное sł звучит «су», без гласной между ними." }
collocations:
  - { pl: "mieć słabość do", ru: "иметь слабость к" }
  - { pl: "chwila słabości", ru: "минута слабости" }
  - { pl: "ludzkie słabości", ru: "человеческие слабости" }
family:
  - { pl: "słaby", ru: "слабый", relation: root, id: slaby }
  - { pl: "siła", ru: "сила", relation: antonym, id: sila }
  - { pl: "wolność", ru: "свобода", relation: root, id: wolnosc }
etymology: "От słaby «слабый», из праславянского *slabъ — того же, что русское «слабый». Суффикс -ość равен русскому -ость, так что słabość и «слабость» собраны одинаково, деталь в деталь. Отсюда osłabienie «ослабление» и słabnąć «слабеть»."
memory: "słabość — «слабость» во всех смыслах сразу: и в ногах, и к сладкому. Оборот mieć słabość DO czegoś строится с do и родительным. Шесть форм, как у всего класса на -ość."
idioms:
