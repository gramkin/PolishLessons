# review
id: ryj
format: 2
lemma: "ryj"
rank: 4877
pos: noun
pron: { cyr: "рый" }
senses:
  - id: snout
    ru: "рыло, пятачок (свиньи, кабана)"
    examples:
      - pl: "Świnia ryła ryjem w błocie."
        ru: "Свинья рылась рылом в грязи."
        source: { kind: authored }
      - pl: "Dzik ma silny ryj."
        ru: "У кабана сильное рыло."
        source: { kind: authored }
      - pl: "Prosiak wsadził ryj do koryta."
        ru: "Поросёнок сунул рыло в корыто."
        source: { kind: authored }
  - id: mug
    ru: "груб. морда, рожа (о лице человека)"
    examples:
      - pl: "Zamknij ryj!"
        ru: "Закрой рот!"
        source: { kind: authored }
      - pl: "Dostał w ryj w barze."
        ru: "Ему дали по морде в баре."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Русское «рыло» и польское RYJ — родня, оба от «рыть». Свиное рыло — RYJ, и в переносном смысле RYJ — грубое «морда» о человеке. Польское «рыло» тоже есть, RYŁO, но звучит книжно. Рядом стоят другие грубые слова для лица: GĘBA, MORDA, PYSK; RYJ — один из самых грубых." }
  - { kind: usage, text: "Мужской род, неодушевлённое. Родительный RYJA, местный RYJU. Множественное RYJE, родительный RYJÓW. Самые частые выражения — с винительным: DAĆ W RYJ, «дать по морде», и повелительным: ZAMKNIJ RYJ, «заткнись»." }
  - { kind: government, text: "Дать по морде — DAĆ W RYJ, W с винительным. Получить по морде — DOSTAĆ W RYJ. Рыться рылом — RYĆ RYJEM, творительный." }
  - { kind: pronunciation, text: "Читается «рый», один слог. RY — твёрдое «ры», J — «й». В RYJA: «ры́я»." }
  - { kind: register, text: "О животных — нейтральное. О человеке — очень грубое, на грани мата: ZAMKNIJ RYJ значит «заткни пасть». В кругу друзей бывает шутливым, при посторонних недопустимо. Мягче — BUZIA у детей, TWARZ нейтрально." }
collocations:
  - { pl: "świński ryj", ru: "свиное рыло" }
  - { pl: "dać w ryj", ru: "дать по морде" }
  - { pl: "zamknij ryj", ru: "заткнись (груб.)" }
family:
  - { pl: "ryć", ru: "рыть", relation: root }
  - { pl: "twarz", ru: "лицо", relation: root, id: twarz }
  - { pl: "świnia", ru: "свинья", relation: root, id: swinia }
etymology: "От RYĆ «рыть», общеславянского *ryti, того же, что русское «рыть» и «рыло». Рыло — то, чем роют землю. Польский оставил короткую форму RYJ, русский — форму с суффиксом «рыло»."
memory: "Ryj — рыло свиньи; груб. — морда: dać w ryj, zamknij ryj. От ryć — рыть. Читается «рый»."
idioms:
  - { pl: "zamknij ryj", ru: "заткнись, закрой пасть (груб.)" }
