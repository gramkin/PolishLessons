# review
id: autograf
format: 2
lemma: "autograf"
rank: 4879
pos: noun
pron: { cyr: "ауто́граф" }
senses:
  - id: autograph
    ru: "автограф"
    examples:
      - pl: "Poprosiłem piłkarza o autograf."
        ru: "Я попросил у футболиста автограф."
        source: { kind: authored }
      - pl: "Mam autograf mojego ulubionego pisarza."
        ru: "У меня есть автограф моего любимого писателя."
        source: { kind: authored }
      - pl: "Aktorka rozdawała autografy przed kinem."
        ru: "Актриса раздавала автографы у кинотеатра."
        source: { kind: authored }
  - id: manuscript
    ru: "рукопись, автограф (текст, написанный рукой автора)"
    examples:
      - pl: "Muzeum kupiło autograf poematu Mickiewicza."
        ru: "Музей купил автограф поэмы Мицкевича."
        source: { kind: authored }
      - pl: "Autograf utworu zaginął w czasie wojny."
        ru: "Рукопись произведения пропала во время войны."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "AUTOGRAF — «автограф», но через AU: AUTOGRAF, как AUTOBUS, AUTO. Подпись в документе — PODPIS, а не AUTOGRAF. В науке AUTOGRAF — рукопись автора." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Родительный — AUTOGRAFU. В местном F смягчается: W AUTOGRAFIE." }
  - { kind: government, text: "Попросить автограф — POPROSIĆ O AUTOGRAF, O с винительным. Раздавать автографы — ROZDAWAĆ AUTOGRAFY. Автограф кого — родительный: AUTOGRAF AKTORA." }
  - { kind: pronunciation, text: "Читается «ауто́граф»: AU — дифтонг, как в AUTO. Ударение на предпоследнем слоге. AUTOGRAFIE — «аутогра́фе»." }
collocations:
  - { pl: "poprosić o autograf", ru: "попросить автограф" }
  - { pl: "rozdawać autografy", ru: "раздавать автографы" }
  - { pl: "autograf z dedykacją", ru: "автограф с посвящением" }
family:
  - { pl: "podpis", ru: "подпись", relation: root, id: podpis }
  - { pl: "gwiazda", ru: "звезда", relation: root, id: gwiazda }
  - { pl: "fan", ru: "фанат", relation: root, id: fan }
etymology: "Из греческого AUTOS «сам» и GRAPHEIN «писать»: написанное собственной рукой. Русское «автограф» — то же слово."
memory: "Autograf — автограф, через au. Poprosić o autograf — попросить автограф. Podpis — подпись. Читается «ауто́граф»."
idioms:
  - { pl: "polowanie na autografy", ru: "охота за автографами" }
