# review
id: ciekawy
format: 2
lemma: "ciekawy"
rank: 623
pos: adj
pron: { cyr: "цека́вы" }
senses:
  - id: interesting
    ru: "интересный, занимательный"
    examples:
      - pl: "To jest ciekawy pomysł."
        ru: "Это интересная мысль."
        source: { kind: tatoeba, id: 13223696 }
      - pl: "To ciekawa wiadomość."
        ru: "Это интересная новость."
        source: { kind: tatoeba, id: 12567524 }
      - pl: "Ten nauczyciel prowadzi ciekawe zajęcia."
        ru: "Этот учитель проводит интересные занятия."
        source: { kind: tatoeba, id: 12564135 }
  - id: curious
    ru: "любопытный; jestem ciekaw «мне интересно, хотелось бы знать»"
    note: "Во втором значении чаще всего встречается краткая форма в сказуемом: jestem ciekaw / jestem ciekawa."
    examples:
      - pl: "Jestem bardzo ciekawa."
        ru: "Я очень любопытна."
        source: { kind: tatoeba, id: 1441231 }
      - pl: "Jestem ciekaw kto to wymyślił."
        ru: "Интересно, кто это изобрёл."
        source: { kind: tatoeba, id: 1352177 }
      - pl: "Ciekaw jestem, dlaczego jestem taki senny."
        ru: "Хотелось бы мне знать, почему я такой сонный."
        source: { kind: tatoeba, id: 13783062 }
notes:
  - { kind: usage, text: "Краткая форма ciekaw живёт только в сказуемом: jestem ciekaw «мне интересно, хотелось бы знать». У женского рода краткой формы нет — jestem ciekawa." }
  - { kind: usage, text: "Безличное ciekawe отвечает русскому «интересно»: Ciekawe, kto wygra «Интересно, кто выиграет», Ciekawe, czy przyjdzie «Интересно, придёт ли он»." }
  - { kind: false-friend, text: "Не путайте прилагательное и глагол: ciekawi mnie to «меня это интересует» — здесь ciekawi форма глагола ciekawić, а не мужско-личная форма прилагательного." }
  - { kind: usage, text: "Степени сравнения: ciekawy → ciekawszy → najciekawszy (можно и bardziej ciekawy). Наречие — ciekawie." }
collocations:
  - { pl: "ciekawa książka", ru: "интересная книга" }
  - { pl: "jestem ciekaw", ru: "мне интересно, любопытно" }
  - { pl: "ciekawe, czy...", ru: "интересно, ...ли" }
  - { pl: "ciekawy świata", ru: "любознательный" }
family:
  - { pl: "ciekawie", ru: "интересно", relation: derived }
  - { pl: "ciekawość", ru: "любопытство", relation: derived }
  - { pl: "ciekawić", ru: "интересовать", relation: derived }
etymology: "Праславянское *cěkavъ, которое связывают с *čekati «ждать, высматривать»: «тот, кто высматривает» → «любопытный», а уже отсюда — «интересный». Русское «любопытный» устроено иначе, поэтому прямой пары нет."
memory: "ciekawy держит сразу оба русских слова: ciekawa książka «интересная книга» и ciekawe dziecko «любопытный ребёнок». Главное, что надо выучить, — краткая форма: jestem ciekaw «мне интересно, хотелось бы знать», только в сказуемом и только у мужского рода (женский — jestem ciekawa). Безличное ciekawe, czy... = «интересно, ...ли». И ловушка: в ciekawi mnie to это глагол ciekawić «интересовать», а не прилагательное."
idioms:
  - { pl: "ciekawe, czy...", ru: "интересно, ...ли" }
  - { pl: "jestem ciekaw", ru: "мне интересно, любопытно" }
  - { pl: "ciekawy świata", ru: "любознательный" }
