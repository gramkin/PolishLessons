notes:
  - { kind: false-friend, text: "СЛОВО СОВПАДАЕТ С РУССКИМ, НО НЕ ВО ВСЕХ СЛУЧАЯХ. Konkurs — это состязание или отбор по заявкам: konkurs pianistyczny, konkurs na dyrektora. А вот поступление в вуз по конкурсу называется REKRUTACJA, и сказать konkurs na studia нельзя. Спортивные соревнования — тоже не konkurs, а ZAWODY." }
  - { kind: usage, text: "Предложный — w KONKURSIE, с мягким si: brać udział w konkursie. Управление запоминай парами: KONKURS NA coś, когда речь об отборе на должность, и ZGŁOSIĆ SIĘ DO konkursu, когда подаёшь заявку. Прилагательное konkursowy значит «конкурсный»." }
  - { kind: pronunciation, text: "Два слога, ударение на первом: KON-kurs. Все согласные твёрдые, u читается как у: «ко́нкурс». Предложный konkursie звучит «конку́рще», с мягким щ." }
