  - { pl: "nagroda", ru: "награда", relation: root, id: nagroda }
  - { pl: "konkurencja", ru: "конкуренция", relation: root }
etymology: "Из латинского concursus «стечение, сбегание вместе», от concurrere «сбегаться, состязаться». То же слово дало русский «конкурс» и «конкуренцию». Корень curr- «бежать» виден в «курсе», «курьере» и «экскурсии»."
memory: "konkurs — «конкурс», но не всякий: поступление в вуз это rekrutacja, а спортивные соревнования — zawody. Предложный w konkursie. Управление: konkurs NA coś, zgłosić się DO konkursu."
