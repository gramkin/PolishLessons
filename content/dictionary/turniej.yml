pos: noun
pron: { cyr: "ту́рней" }
senses:
  - id: tournament
    ru: "турнир, соревнование"
    examples:
      - pl: "Nasza drużyna wygrała turniej."
        ru: "Наша команда выиграла турнир."
        source: { kind: authored }
      - pl: "W turnieju bierze udział szesnaście zespołów."
