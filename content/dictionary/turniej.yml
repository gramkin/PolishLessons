        ru: "В замке проходит рыцарский турнир."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "TURNIEJ — «турнир», с -EJ на конце. Соревнования вообще — ZAWODY, чемпионат — MISTRZOSTWA. TURNIEJ — скорее серия матчей по сетке: TURNIEJ TENISOWY, TURNIEJ SZACHOWY." }
  - { kind: usage, text: "Мужской род, неодушевлённое. Родительный — TURNIEJU, множественное — TURNIEJE, TURNIEJÓW. Форма TURNIEI — устаревший родительный множественного." }
  - { kind: government, text: "Участвовать в турнире — BRAĆ UDZIAŁ W TURNIEJU, местный. Выиграть турнир — WYGRAĆ TURNIEJ, винительный. Турнир по чему — TURNIEJ W и винительный: TURNIEJ W SZACHY." }
  - { kind: pronunciation, text: "Читается «ту́рней», ударение на первом слоге. NIEJ — мягкое «ней»." }
collocations:
  - { pl: "turniej tenisowy", ru: "теннисный турнир" }
  - { pl: "wygrać turniej", ru: "выиграть турнир" }
  - { pl: "turniej rycerski", ru: "рыцарский турнир" }
family:
  - { pl: "mecz", ru: "матч", relation: root, id: mecz }
  - { pl: "zawody", ru: "соревнования", relation: root }
  - { pl: "mistrzostwa", ru: "чемпионат", relation: root }
etymology: "Из старофранцузского TORNEI, от TOURNER «поворачивать»: рыцари разворачивали коней для новой сшибки. Русское «турнир» пришло тем же путём через немецкий."
memory: "Turniej — турнир. W turnieju — в турнире. Turniej szachowy — шахматный турнир. Читается «ту́рней»."
idioms:
  - { pl: "turniej rycerski", ru: "рыцарский турнир" }
