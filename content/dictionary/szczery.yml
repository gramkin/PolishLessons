format: 2
lemma: "szczery"
rank: 1140
pos: adj
pron: { cyr: "шчэ́ры" }
senses:
  - id: sincere
    ru: "искренний, откровенный"
    examples:
      - pl: "Jest bardzo szczery."
        ru: "Он очень искренний."
        source: { kind: translated, id: 12184187 }
      - pl: "Jego słowa były szczere."
        ru: "Его слова были искренними."
        source: { kind: translated, id: 1552411 }
      - pl: "Czy mogę prosić o pana szczerą opinię?"
        ru: "Могу я попросить вашего искреннего мнения?"
        source: { kind: translated, id: 3437487 }
  - id: pure
    ru: "чистый, без примесей (о золоте, правде)"
    note: "Исходное значение — «чистый, беспримесный»: szczere złoto «чистое золото», szczera prawda «чистая правда»."
    examples:
      - pl: "To szczere złoto."
        ru: "Это чистое золото."
        source: { kind: authored }
      - pl: "Mówię szczerą prawdę."
        ru: "Я говорю чистую правду."
        source: { kind: authored }
      - pl: "Mam szczerą nadzieję, że niedługo ci się ułoży."
        ru: "Я искренне надеюсь, что у тебя скоро всё наладится."
        source: { kind: translated, id: 3696377 }
notes:
  - { kind: usage, text: "Исходный смысл — «чистый, без примесей» (szczere złoto «чистое золото»), отсюда и «искренний»: тот, в ком нет примеси притворства. Так же устроена szczera prawda «чистая правда»." }
  - { kind: false-friend, text: "Мужско-личная форма szczerzy совпадает по написанию с формой глагола szczerzyć się «скалиться»: Tom szczerzy się «Том скалится» — это глагол, а не прилагательное." }
  - { kind: usage, text: "Сравнение с чередованием r → rz: szczery → szczerszy → najszczerszy. Наречие — szczerze, существительное — szczerość «искренность»." }
  - { kind: usage, text: "Очень частый оборот szczerze mówiąc «откровенно говоря» и mam szczerą nadzieję «я искренне надеюсь»." }
collocations:
  - { pl: "szczera prawda", ru: "чистая правда" }
  - { pl: "szczere złoto", ru: "чистое золото" }
  - { pl: "szczerze mówiąc", ru: "откровенно говоря" }
  - { pl: "mam szczerą nadzieję", ru: "искренне надеюсь" }
family:
  - { pl: "szczerze", ru: "искренне, откровенно", relation: derived }
  - { pl: "szczerość", ru: "искренность", relation: derived }
etymology: "Праславянское *ščirъ «чистый, беспримесный, целый». Исходное значение сохранилось в szczere złoto «чистое золото», а переносное дало «искренний» — тот, в ком нет примеси притворства."
memory: "szczery — «искренний», а исходно «чистый, без примеси»: szczere złoto «чистое золото», szczera prawda «чистая правда». Эта картинка и есть ключ: искренний человек — беспримесный. Сравнение с чередованием r → rz: szczerszy, najszczerszy. Ловушка на письме: szczerzy — это и мужско-личная форма прилагательного (bądźmy szczerzy «будем откровенны»), и форма глагола szczerzyć się «скалиться» (Tom szczerzy się)."
idioms:
  - { pl: "szczera prawda", ru: "чистая правда" }
  - { pl: "szczerze mówiąc", ru: "откровенно говоря" }
  - { pl: "ze szczerego serca", ru: "от чистого сердца" }
