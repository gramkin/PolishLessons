notes:
  - { kind: false-friend, text: "ZWYCIĘŻYĆ — «победить», с прямым дополнением: ZWYCIĘŻYĆ WROGA; «победить в» — ZWYCIĘŻYĆ W KONKURSIE. В спорте и быту чаще WYGRAĆ «выиграть» и POKONAĆ «одолеть». Русское «завоевать» — ZDOBYĆ." }
  - { kind: usage, text: "Пятьдесят три формы, включая ZWYCIĘŻENI — «побеждённые». Будущее: ZWYCIĘŻĘ, ZWYCIĘŻYSZ, повелительное ZWYCIĘŻ. Несовершенный вид — ZWYCIĘŻAĆ." }
  - { kind: government, text: "Кого или что — винительный: ZWYCIĘŻYĆ RYWALA, ZWYCIĘŻYĆ CHOROBĘ. В чём — W с предложным: W WYBORACH, W TURNIEJU. Чем — творительный: ZWYCIĘŻYĆ ODWAGĄ." }
  - { kind: pronunciation, text: "Читается «звыце́нжыць»: ZW — «зв», CIĘ перед Ż — «цен», ударение на предпоследнем слоге. ZWYCIĘŻĘ — «звыце́нжэ»." }
  - { kind: register, text: "Книжное, торжественное слово; в спортивных новостях — нейтральное: ZWYCIĘŻYŁ W MARATONIE. В быту говорят WYGRAĆ." }
collocations:
  - { pl: "zwyciężyć w wyborach", ru: "победить на выборах" }
  - { pl: "zwyciężyć strach", ru: "одолеть страх" }
  - { pl: "zwyciężył rozsądek", ru: "победил здравый смысл" }
family:
  - { pl: "zwycięstwo", ru: "победа", relation: derived, id: zwyciestwo }
  - { pl: "zwycięzca", ru: "победитель", relation: derived, id: zwyciezca }
  - { pl: "zwyciężać", ru: "побеждать", relation: aspect }
etymology: "Связано с ZWYCIĘZCA «победитель» и ZWYCIĘSTWO «победа». Корень, по распространённой версии, тот же, что в русском «витязь», праславянское *vitędzь."
memory: "Zwyciężyć — победить: zwyciężył w wyborach. Zwycięstwo — победа, zwycięzca — победитель. Biada zwyciężonym — горе побеждённым. Читается «звыце́нжыць»."
idioms:
  - { pl: "biada zwyciężonym", ru: "горе побеждённым" }
