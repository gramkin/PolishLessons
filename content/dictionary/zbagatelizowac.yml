notes:
  - { kind: usage, text: "Совершенный вид; несовершенный — BAGATELIZOWAĆ: NIE BAGATELIZUJ TEGO «не преуменьшай этого», а ZBAGATELIZOWAŁ OBJAWY «он не придал значения симптомам». Спряжение на -UJĘ: ZBAGATELIZUJĘ, ZBAGATELIZUJESZ, ZBAGATELIZUJĄ — форм с -OW- в будущем времени нет." }
  - { kind: government, text: "Что — винительный: ZBAGATELIZOWAĆ PROBLEM, OSTRZEŻENIE, OBJAWY. Кого — тоже винительный: ZBAGATELIZOWAĆ PACJENTA «не принять пациента всерьёз»; отсюда и ZBAGATELIZOWANI «те, кого не приняли всерьёз». В русском часто нужен другой оборот: «не придать значения чему-то», «отмахнуться от чего-то»." }
  - { kind: register, text: "Книжное и газетное слово: о врачах, властях, предупреждениях. В разговоре чаще говорят ZLEKCEWAŻYĆ «пренебречь» или грубовато OLAĆ «наплевать»." }
  - { kind: pronunciation, text: "Читается «збагатэлизо́ваць»: TE — «тэ», LI — «ли», ударение на предпоследнем слоге ZO. ZBAGATELIZUJĘ — «збагатэлизу́е»." }
collocations:
  - { pl: "zbagatelizować problem", ru: "преуменьшить проблему" }
  - { pl: "zbagatelizować objawy", ru: "не придать значения симптомам" }
  - { pl: "zbagatelizować ostrzeżenie", ru: "пропустить мимо ушей предупреждение" }
  - { pl: "nie można tego zbagatelizować", ru: "этим нельзя пренебречь" }
family:
  - { pl: "bagatelizować", ru: "преуменьшать, не придавать значения", relation: aspect }
