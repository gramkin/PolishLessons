etymology: "Приставка Z- плюс BAGATELIZOWAĆ, от BAGATELA «пустяк»; слово пришло через французское bagatelle из итальянского bagattella — то же, что русская «багатель»."
memory: "Bagatela — пустяк: zbagatelizować — объявить пустяком. Zbagatelizował kaszel — отмахнулся от кашля как от пустяка."
idioms:
