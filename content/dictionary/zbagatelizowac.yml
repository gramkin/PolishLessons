aspect: perf
pron: { cyr: "збагатэлизо́ваць" }
senses:
  - id: downplay
    ru: "преуменьшить, не придать значения (проблеме, симптомам)"
    examples:
      - pl: "Lekarz zbagatelizował jej objawy."
