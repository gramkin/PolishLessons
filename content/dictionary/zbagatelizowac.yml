        ru: "Правительство преуменьшило масштаб кризиса."
        source: { kind: authored }
  - id: brush-off
    ru: "отмахнуться, не принять всерьёз (предупреждение, человека)"
    examples:
      - pl: "Kierowca zbagatelizował ostrzeżenie i pojechał dalej."
        ru: "Водитель отмахнулся от предупреждения и поехал дальше."
