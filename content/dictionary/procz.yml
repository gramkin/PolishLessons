# review
id: procz
format: 2
lemma: "prócz"
rank: 4812
pos: prep
pron: { cyr: "пруч" }
senses:
  - id: except
    ru: "кроме, за исключением"
    examples:
      - pl: "Prócz niego nikt nie przyszedł."
        ru: "Кроме него никто не пришёл."
        source: { kind: authored }
      - pl: "Wszyscy prócz mnie wiedzieli."
        ru: "Все, кроме меня, знали."
        source: { kind: authored }
      - pl: "Nie mam nic prócz tego płaszcza."
        ru: "У меня нет ничего, кроме этого плаща."
        source: { kind: authored }
  - id: besides
    ru: "кроме того, помимо"
    examples:
      - pl: "Prócz pensji dostał premię."
        ru: "Помимо зарплаты он получил премию."
        source: { kind: authored }
      - pl: "Prócz tego trzeba kupić chleb."
        ru: "Кроме того, нужно купить хлеб."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "PRÓCZ — «кроме», а не «прочий» (INNY, POZOSTAŁY) и не «прочь» (PRECZ). Это краткий вариант OPRÓCZ, который звучит обычнее; PRÓCZ — книжнее." }
  - { kind: usage, text: "Предлог с родительным. Два значения, как у русского «кроме»: исключение (WSZYSCY PRÓCZ MNIE) и добавление (PRÓCZ PENSJI DOSTAŁ PREMIĘ). Оборот PRÓCZ TEGO — «кроме того»." }
  - { kind: government, text: "Только родительный: PRÓCZ NIEGO, PRÓCZ MATKI, PRÓCZ TEGO. Как в русском «кроме него». После PRÓCZ местоимения берут форму с N-: PRÓCZ NIEJ, PRÓCZ NICH." }
  - { kind: pronunciation, text: "Читается «пруч», один слог: Ó — «у», CZ — твёрдое «ч»." }
  - { kind: register, text: "Книжно-нейтральное. В разговоре почти всегда OPRÓCZ или POZA: POZA TYM «кроме того»." }
collocations:
  - { pl: "prócz tego", ru: "кроме того" }
  - { pl: "wszyscy prócz", ru: "все кроме" }
  - { pl: "nic prócz", ru: "ничего кроме" }
family:
  - { pl: "oprócz", ru: "кроме", relation: derived, id: oprocz }
  - { pl: "poza", ru: "кроме, вне", relation: root, id: poza }
  - { pl: "precz", ru: "прочь", relation: root }
etymology: "Из старопольского PROCZ «прочь, в стороне», того же корня, что PRECZ и русское «прочь», «прочий». Значение «кроме» — «то, что в стороне»."
memory: "Prócz — кроме, как oprócz: wszyscy prócz mnie. Родительный, как в русском. Prócz tego — кроме того."
idioms:
  - { pl: "nic prócz prawdy", ru: "ничего, кроме правды" }
formExamples:
  - form: "prócz"
    pl: "Prócz niego nikt nie przyszedł."
    ru: "Кроме него никто не пришёл."
    source: { kind: authored }
  - form: "prócz"
    pl: "Prócz tego trzeba kupić chleb."
    ru: "Кроме того, нужно купить хлеб."
    source: { kind: authored }
  - form: "prócz"
    pl: "Nie widzę tu nikogo prócz ciebie."
    ru: "Я не вижу здесь никого, кроме тебя."
    source: { kind: authored }
