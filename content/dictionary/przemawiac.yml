# review
id: przemawiac
format: 2
lemma: "przemawiać"
rank: 3941
pos: verb
pron: { cyr: "пшэма́вяць" }
senses:
  - id: speak-publicly
    ru: "выступать с речью, говорить (публично)"
    examples:
      - pl: "Prezydent przemawia do narodu."
        ru: "Президент обращается к народу."
        source: { kind: authored }
      - pl: "Przemawiał na wiecu przez godzinę."
        ru: "Он выступал на митинге целый час."
        source: { kind: authored }
      - pl: "Nie lubię przemawiać publicznie."
        ru: "Я не люблю выступать публично."
        source: { kind: authored }
  - id: argue-for
    ru: "говорить в пользу (PRZEMAWIAĆ ZA); убеждать (PRZEMAWIAĆ DO)"
    examples:
      - pl: "Wszystko przemawia za tym planem."
        ru: "Всё говорит в пользу этого плана."
        source: { kind: authored }
      - pl: "Te argumenty do mnie nie przemawiają."
        ru: "Эти доводы меня не убеждают."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "PRZEMAWIAĆ — «выступать с речью», а не «переговаривать» или «переубеждать». Корень MÓWIĆ, но значение — публичная речь. Два важных оборота: PRZEMAWIAĆ ZA CZYMŚ «говорить в пользу чего-то» и TO DO MNIE NIE PRZEMAWIA «меня это не убеждает»." }
  - { kind: usage, text: "Несовершенный вид; совершенный — PRZEMÓWIĆ. Спряжение на -AM: PRZEMAWIAM, PRZEMAWIASZ, PRZEMAWIAJĄ. Речь — PRZEMÓWIENIE, оратор — MÓWCA." }
  - { kind: government, text: "К кому — DO с родительным: PRZEMAWIAĆ DO NARODU, DO TŁUMU. За что — ZA с творительным: PRZEMAWIAĆ ZA ROZWIĄZANIEM. Против — PRZECIWKO с дательным: PRZEMAWIAĆ PRZECIWKO WOJNIE. Где — NA с предложным: NA WIECU, NA KONFERENCJI." }
  - { kind: pronunciation, text: "Читается «пшэма́вяць»: PRZ — «пш», WIA — «вя». Ударение на предпоследнем слоге. PRZEMAWIA — «пшэма́вя»." }
  - { kind: register, text: "Нейтрально-официальное слово: политика, церемонии, суд. В переносном смысле — книжное: FAKTY PRZEMAWIAJĄ SAME ZA SIEBIE «факты говорят сами за себя»." }
collocations:
  - { pl: "przemawiać do narodu", ru: "обращаться к народу" }
  - { pl: "przemawiać za czymś", ru: "говорить в пользу чего-то" }
  - { pl: "fakty przemawiają same za siebie", ru: "факты говорят сами за себя" }
family:
  - { pl: "przemówić", ru: "заговорить, выступить", relation: aspect, id: przemowic }
  - { pl: "przemówienie", ru: "речь, выступление", relation: derived }
  - { pl: "mówić", ru: "говорить", relation: root, id: mowic }
etymology: "Приставка PRZE- плюс MAWIAĆ, многократное от MÓWIĆ. Буквально «проговаривать вслух перед людьми». Тот же корень в MÓWCA «оратор» и PRZEMOWA «речь»."
memory: "Przemawiać — выступать с речью: prezydent przemawia do narodu. Przemawiać za — говорить в пользу; to do mnie nie przemawia — меня не убеждает."
idioms:
  - { pl: "fakty przemawiają same za siebie", ru: "факты говорят сами за себя" }
