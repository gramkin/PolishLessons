# review
id: chylkiem
format: 2
lemma: "chyłkiem"
rank: 5918
pos: adv
pron: { cyr: "хы́укем" }
senses:
  - id: stealthily
    ru: "украдкой, тайком, крадучись"
    examples:
      - pl: "Kot chyłkiem przemknął do kuchni."
        ru: "Кот крадучись прошмыгнул на кухню."
        source: { kind: authored }
      - pl: "Chłopcy chyłkiem uciekli z lekcji."
        ru: "Мальчишки тайком сбежали с урока."
        source: { kind: authored }
      - pl: "Po kłótni wymknął się chyłkiem z domu."
        ru: "После ссоры он тайком ускользнул из дома."
        source: { kind: authored }
  - id: on-the-quiet
    ru: "втихую, без огласки"
    note: "о поступках, которые стараются провести незаметно"
    examples:
      - pl: "Firma chyłkiem podniosła ceny."
        ru: "Фирма втихую подняла цены."
        source: { kind: authored }
      - pl: "Rząd chyłkiem wycofał się z obietnicy."
        ru: "Правительство втихую отказалось от своего обещания."
        source: { kind: authored }
      - pl: "Nowe przepisy wprowadzono chyłkiem, bez żadnej dyskusji."
        ru: "Новые правила ввели втихую, без всякого обсуждения."
        source: { kind: authored }
notes:
  - { kind: usage, text: "По форме это творительный падеж старого существительного CHYŁEK, застывший как наречие, — так же, как русские «тайком», «бегом», «шагом». Изменяемых форм и степеней сравнения нет." }
  - { kind: register, text: "Книжное и публицистическое слово. В газетах часто звучит с упрёком: CHYŁKIEM PODNIEŚLI CENY «втихую подняли цены». В разговоре чаще говорят UKRADKIEM или CICHACZEM." }
  - { kind: pronunciation, text: "Читается «хы́укем»: Ł — это «у», а не «л»; KIE — мягкое «ке». Ударение на первом слоге." }
collocations:
  - { pl: "wymknąć się chyłkiem", ru: "тайком ускользнуть" }
  - { pl: "chyłkiem uciec", ru: "тайком сбежать" }
  - { pl: "chyłkiem wycofać się", ru: "втихую отступить" }
family:
  - { pl: "chylić", ru: "клонить, склонять", relation: root }
  - { pl: "pochylić", ru: "наклонить", relation: root, id: pochylic }
  - { pl: "schyłek", ru: "закат, конец (эпохи)", relation: root }
synonyms: ["ukradkiem", "cichaczem", "potajemnie", "niepostrzeżenie"]
etymology: "Творительный падеж от CHYŁEK, производного от CHYLIĆ «клонить», то есть исходно «пригнувшись». Того же корня SCHYŁEK «закат, конец»."
memory: "Chyłkiem — пригнувшись, как вор: от chylić «клонить». Kot chyłkiem przemknął — кот прошмыгнул крадучись."
idioms:
  - { pl: "wymknąć się chyłkiem", ru: "улизнуть потихоньку" }
