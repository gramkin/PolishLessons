etymology: "От GŁOS «голос», из праславянского *golsъ, того же, что дало русский «голос» и книжный «глас». Польская форма с ŁO на месте русского ОЛО — это обычное соответствие, как GŁOWA и «голова», MŁODY и «молодой». От этого корня в польском выросло целое гнездо, и часть его русскому знакома до буквы: GŁOSKA «звук речи», SAMOGŁOSKA «гласный» и SPÓŁGŁOSKA «согласный» — ровно как русские «гласный» и «согласный», и в обоих языках это калька латинских VOCALIS и CONSONANS, «звучащий сам» и «звучащий вместе». Громкость же выражена через голос потому, что голос и был первой меркой громкости; русский для той же мысли взял гром, и два языка разошлись в образе, сойдясь в значении."
memory: "Громкий, но построено от głos «голос», а не от грома: тот же корень, что в русских «глас», «гласный», «согласный». Отсюда głośnik «динамик» и samogłoska с spółgłoską — точные соответствия «гласного» и «согласного». Ś стоит во всех тридцати трёх формах, без чередования, и в этом отличие от bolesny, где положительная степень идёт с твёрдым s. Тихий — не niegłośny, а cichy."
