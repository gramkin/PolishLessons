notes:
  - { kind: false-friend, text: "Прямого соответствия в русском нет, потому что языки взяли для этого понятия разные корни. Польский построил «громкий» от GŁOS «голос», русский — от «грома»: GŁOŚNY и «громкий» значат одно, а устроены по-разному. Зато русскому знаком тот же корень в другом месте: «глас», «гласный», «согласный», «огласить». Поэтому GŁOŚNIK это не «гласник», а «громкоговоритель, динамик», буквально «то, что делает громко». Второе значение совпадает полностью: GŁOŚNA SPRAWA это именно «громкое дело», известное всем, и переносный ход в двух языках оказался одинаковым." }
  - { kind: usage, text: "В значении звука слово обиходно: GŁOŚNY HUK, GŁOŚNA MUZYKA, ZA GŁOŚNY «слишком громкий». Наречие GŁOŚNO «громко» частотнее самого прилагательного, и с ним идут нужные обороты: MÓW GŁOŚNIEJ «говори громче», CZYTAĆ NA GŁOS «читать вслух» — здесь уже существительное GŁOS в винительном, а не прилагательное. Второе значение, «получивший известность», сочетается с словами о событиях: GŁOŚNA SPRAWA, GŁOŚNY PROCES, GŁOŚNA PREMIERA. Отрицание CICHY «тихий» это не NIEGŁOŚNY: тихий по-польски именно CICHY, и это отдельное слово." }
  - { kind: pronunciation, text: "Читается «гло́шны», ударение на предпоследнем слоге. Начальное GŁ это как раз то место, где Ł даёт «у» и пропадает перед согласным почти без следа: получается «гл» с лёгким огублением, а не «гль». Буква Ś перед N читается «сь», но перед твёрдым N звучание ближе к «ш», и в беглой речи слышно «гло́шны»; в сочетании ŚNI оно явно мягкое: GŁOŚNI «гло́сьни». В степенях сравнения появляется SZ, которое читается «ш»: GŁOŚNIEJSZY «глосьне́йшы», NAJGŁOŚNIEJSZY «найглосьне́йшы»." }
  - { kind: government, text: "Прилагательное, тридцать три формы, и в отличие от BOLESNY никакого чередования здесь нет: Ś стоит во всех тридцати трёх, включая мужское лицо множественного GŁOŚNI и всю сравнительную степень. Два слова стоит держать рядом именно поэтому: BOLESNY с твёрдым S в положительной степени и GŁOŚNY с мягким Ś везде. Для кого громко — предлог DLA с родительным: ZA GŁOŚNY DLA DZIECKA. Сравнение предлогом OD с родительным или союзом NIŻ: GŁOŚNIEJSZY OD POPRZEDNIEGO, GŁOŚNIEJSZY NIŻ POPRZEDNI." }
