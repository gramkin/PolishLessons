# review
id: wypogodzic
format: 2
lemma: "wypogodzić"
rank: 6047
pos: verb
aspect: perf
pron: { cyr: "выпого́дзиць" }
senses:
  - id: clear-up
    ru: "wypogodzić się — проясниться, разгуляться (о погоде, небе); безл. wypogodziło się"
    examples:
      - pl: "Wypogodziło się."
        ru: "Прояснилось."
        source: { kind: translated, id: 349233 }
      - pl: "Wkrótce się wypogodzi."
        ru: "Скоро прояснится."
        source: { kind: translated, id: 714996 }
      - pl: "Padało, kiedy się obudziłem, ale po południu wypogodziło się i zaświeciło słońce."
        ru: "Когда я проснулся, шёл дождь, но после обеда прояснилось и выглянуло солнце."
        source: { kind: translated, id: 2140620 }
      - pl: "My jeszcze trochę w chmurach, ale tutaj już troszeczkę nam się wypogodziło."
        ru: "Мы ещё немного в облаках, но здесь у нас уже чуть-чуть прояснилось."
        source: { kind: authored }
  - id: brighten
    ru: "перен. просветлеть, повеселеть (о лице, человеке); wypogodzić twarz — книжн. просветлеть лицом"
    examples:
      - pl: "Na widok wnuków twarz babci się wypogodziła."
        ru: "При виде внуков лицо бабушки просветлело."
        source: { kind: authored }
      - pl: "Po dobrej wiadomości wypogodził się i zaczął żartować."
        ru: "После хорошей новости он повеселел и начал шутить."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Почти всегда с SIĘ и чаще всего безлично, в среднем роде: wypogodziło się, «прояснилось», wypogodzi się, «прояснится». Подлежащим может быть небо или погода: niebo się wypogodziło. Синоним — ROZPOGODZIĆ SIĘ, он чуть употребительнее; оба значат и «распогодиться», и «повеселеть»." }
  - { kind: false-friend, text: "Русское «распогодиться» близко и по смыслу, и по корню POGODA. Но польское POGODA — это и «погода», и «ясная погода, вёдро»: WY-POGODZIĆ — «сделать погоду ясной». POGODNY — «ясный» и «жизнерадостный», отсюда и переносное значение о лице." }
  - { kind: pronunciation, text: "«выпого́дзиць»: DZI — «дзи», мягкое, конечное Ć — «ць». Ударение на предпоследнем слоге GO. В будущем: wypogodzi się — «выпого́дзи сье»." }
  - { kind: register, text: "Разговорно-нейтральное: прогноз погоды, рассказы о прогулках. Личные формы (wypogodziłem się) — только в переносном смысле «повеселел» и звучат шутливо." }
collocations:
  - { pl: "wypogodziło się", ru: "прояснилось" }
  - { pl: "niebo się wypogodziło", ru: "небо прояснилось" }
  - { pl: "twarz mu się wypogodziła", ru: "его лицо просветлело" }
family:
  - { pl: "pogoda", ru: "погода; ясная погода", relation: root, id: pogoda }
  - { pl: "rozpogodzić się", ru: "распогодиться, повеселеть", relation: root }
  - { pl: "pogodny", ru: "ясный; жизнерадостный", relation: derived }
etymology: "От POGODA, «ясная погода», праславянского *pogoda, «удобное, подходящее время» (от *goditi, «подходить, годиться», того же корня, что русское «годный», «угодить»). Хорошей погодой считали «подходящую» — отсюда и польское POGODNY, «ясный, весёлый». WY- — «до конца»: полностью прояснить."
memory: "Wypogodzić się — проясниться: wypogodziło się, «прояснилось». От pogoda = ясная погода. И о лице: twarz się wypogodziła — просветлело. Синоним — rozpogodzić się."
idioms:
  - { pl: "twarz mu się wypogodziła", ru: "он просветлел лицом, повеселел" }
