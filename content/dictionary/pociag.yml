# review
id: pociag
format: 2
lemma: "pociąg"
rank: 1145
pos: noun
pron: { cyr: "по́цёнк" }
senses:
  - id: train
    ru: "поезд"
    examples:
      - pl: "Czekam na pociąg."
        ru: "Я жду поезд."
        source: { kind: tatoeba, id: 705304 }
      - pl: "Gdzie jest pociąg?"
        ru: "Где поезд?"
        source: { kind: tatoeba, id: 4412297 }
      - pl: "Pociąg odjeżdża z dworca."
        ru: "Поезд отходит от станции."
        source: { kind: tatoeba, id: 11264419 }
  - id: by-train
    ru: "jechać pociągiem — ехать на поезде"
    examples:
      - pl: "Jechałem pociągiem dwanaście godzin."
        ru: "Я ехал на поезде двенадцать часов."
        source: { kind: tatoeba, id: 668738 }
      - pl: "Pojedźmy pociągiem."
        ru: "Поедем поездом."
        source: { kind: translated, id: 3446230 }
  - id: attraction
    ru: "влечение, тяга (pociąg do czegoś)"
    examples:
      - pl: "Ma pociąg do hazardu."
        ru: "У него тяга к азартным играм."
        source: { kind: authored }
      - pl: "Czuł do niej pociąg."
        ru: "Он чувствовал к ней влечение."
        source: { kind: authored }
notes:
  - { kind: government, text: "jechać pociągiem «ехать на поезде» — творительный падеж без предлога. Русское «на поезде» требует предлога, польское нет." }
  - { kind: usage, text: "Опоздать — spóźnić się na pociąg, успеть — zdążyć na pociąg: предлог na с винительным, как в русском." }
  - { kind: usage, text: "Второе значение — «влечение, тяга»: pociąg do alkoholu «тяга к алкоголю», pociąg fizyczny «физическое влечение»." }
  - { kind: usage, text: "Мужской род неодушевлённый: ten pociąg, tego pociągu, tym pociągiem." }
collocations:
  - { pl: "jechać pociągiem", ru: "ехать на поезде" }
  - { pl: "spóźnić się na pociąg", ru: "опоздать на поезд" }
  - { pl: "rozkład pociągów", ru: "расписание поездов" }
  - { pl: "pociąg do czegoś", ru: "тяга к чему-то" }
family:
  - { pl: "pociągać", ru: "притягивать, привлекать", relation: root }
  - { pl: "ciągnąć", ru: "тянуть", relation: root }
  - { pl: "pociągowy", ru: "тяговый", relation: derived }
etymology: "От pociągać «тянуть, притягивать» — буквально «то, что тянут». Русский «поезд» собран от «ездить»: картинка другая, а вещь та же. Отсюда же второе значение «влечение»."
memory: "pociąg — «поезд», и ездят на нём jechać pociągiem, творительный падеж без предлога. Второе значение — «влечение, тяга»: pociąg do czegoś. Оба идут от pociągać «притягивать»."
idioms:
  - { pl: "jechać pociągiem", ru: "ехать на поезде" }
  - { pl: "spóźnić się na pociąg", ru: "опоздать на поезд" }
  - { pl: "ostatni pociąg", ru: "последний поезд" }
formExamplesSkip:
