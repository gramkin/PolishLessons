senses:
  - id: time
    ru: "пора, время (делать что-л.)"
    note: "Pora wstawać «Пора вставать» — с инфинитивом, как в русском."
    examples:
      - pl: "Pora wstawać."
        ru: "Пора вставать."
        source: { kind: tatoeba, id: 4917222 }
      - pl: "Pora spać."
        ru: "Пора спать."
        source: { kind: tatoeba, id: 4930737 }
      - pl: "Pora iść do domu."
        ru: "Пора идти домой."
        source: { kind: authored }
  - id: season
    ru: "pora roku — время года"
    note: "Четыре pory roku: wiosna, lato, jesień, zima."
    examples:
      - pl: "Lato to moja ulubiona pora roku."
        ru: "Лето — моё любимое время года."
        source: { kind: tatoeba, id: 5917012 }
      - pl: "Pierwszą porą roku jest wiosna."
        ru: "Первое время года — весна."
        source: { kind: translated, id: 827812 }
      - pl: "Moją ulubioną porą roku jest jesień."
        ru: "Моё любимое время года — осень."
        source: { kind: translated, id: 5222099 }
  - id: right-time
    ru: "w samą porę — как раз вовремя"
    note: "Застывший оборот с винительным."
    examples:
      - pl: "Przyszedłeś w samą porę."
        ru: "Ты пришёл как раз вовремя."
        source: { kind: tatoeba, id: 12567517 }
      - pl: "W samą porę."
        ru: "Как раз вовремя."
        source: { kind: translated, id: 8617195 }
      - pl: "Przyjdź o każdej porze po dziewiątej."
        ru: "Приходи в любое время после девяти."
        source: { kind: translated, id: 10556215 }
notes:
  - { kind: usage, text: "Pora плюс инфинитив значит «пора что-то делать»: pora wstawać, pora spać — ровно как русское «пора вставать»." }
  - { kind: usage, text: "pora roku — «время года»; pora deszczowa — «сезон дождей»; pora lunchu — «обеденное время»." }
  - { kind: usage, text: "Застывшие обороты: w samą porę «как раз вовремя», do tej pory «до сих пор», o każdej porze «в любое время»." }
  - { kind: false-friend, text: "Русское «пора» и польское pora совпадают в значении времени, но польское слово гораздо шире: оно обозначает и сезон, и час дня." }
collocations:
  - { pl: "pora roku", ru: "время года" }
  - { pl: "w samą porę", ru: "как раз вовремя" }
  - { pl: "do tej pory", ru: "до сих пор" }
  - { pl: "pora spać", ru: "пора спать" }
family:
  - { pl: "porą", ru: "порой", relation: derived }
  - { pl: "wczesny", ru: "ранний", relation: root }
etymology: "От праславянского *pora «сила, время» — то же слово, что русское «пора»; отсюда же wczesny «ранний» и dopóty «до тех пор»."
memory: "pora — «пора, время», и с инфинитивом работает точно как русское: Pora wstawać «Пора вставать», Pora spać. Но значение шире: pora roku — это «время года» (их четыре: wiosna, lato, jesień, zima), а pora deszczowa — «сезон дождей». Три оборота стоит запомнить целиком: w samą porę «как раз вовремя», do tej pory «до сих пор» и o każdej porze «в любое время»."
idioms:
  - { pl: "pora roku", ru: "время года" }
  - { pl: "w samą porę", ru: "как раз вовремя" }
  - { pl: "do tej pory", ru: "до сих пор" }
