# review
id: porozmawiac
format: 2
lemma: "porozmawiać"
rank: 249
pos: verb
aspect: perf
aspectPair: rozmawiac
pron: { cyr: "порозма́вяць" }
senses:
  - id: talk
    ru: "поговорить (с кем-либо)"
    note: "porozmawiać z kimś — с творительным падежом после z."
    examples:
      - pl: "Porozmawiaj z kimś!"
        ru: "Поговори с кем-нибудь!"
        source: { kind: tatoeba, id: 2836302 }
      - pl: "Mogę porozmawiać z Piotrem?"
        ru: "Я могу поговорить с Петром?"
        source: { kind: tatoeba, id: 599375 }
      - pl: "Czy mogę z tobą porozmawiać?"
        ru: "Могу я с тобой поговорить?"
        source: { kind: tatoeba, id: 6401537 }
  - id: talk-about
    ru: "поговорить (о чём-либо)"
    examples:
      - pl: "Porozmawiamy jutro."
        ru: "Завтра поговорим."
        source: { kind: tatoeba, id: 6154749 }
      - pl: "Możemy porozmawiać jutro?"
        ru: "Мы можем поговорить завтра?"
        source: { kind: tatoeba, id: 3708379 }
      - pl: "Możemy o tym porozmawiać?"
        ru: "Мы можем поговорить об этом?"
        source: { kind: tatoeba, id: 3708380 }
notes:
  - { kind: usage, text: "Приставка po- работает точно как русская: rozmawiać «разговаривать» → porozmawiać «поговорить», то есть разок и недолго." }
  - { kind: usage, text: "Управление: porozmawiać z kimś o czymś. После z — творительный падеж: z tobą, z Tomem, z nimi." }
  - { kind: usage, text: "Czy mogę z tobą porozmawiać? — стандартная вежливая просьба о разговоре." }
collocations:
  - { pl: "porozmawiać z kimś", ru: "поговорить с кем-то" }
  - { pl: "porozmawiajmy", ru: "давай поговорим" }
  - { pl: "porozmawiać o czymś", ru: "поговорить о чём-то" }
  - { pl: "musimy porozmawiać", ru: "нам надо поговорить" }
etymology: "Из po- + rozmawiać, а то — из roz- + mówić «говорить»; ср. русские «молвить», «размолвка»."
memory: "Приставка po- работает как русская: rozmawiać «разговаривать» → porozmawiać «поговорить». И предлог с творительным: porozmawiać z kimś."
idioms:
  - { pl: "porozmawiajmy", ru: "давай поговорим" }
  - { pl: "porozmawiać na osobności", ru: "поговорить наедине" }
  - { pl: "mamy o czym porozmawiać", ru: "нам есть о чём поговорить" }
