notes:
  - { kind: usage, text: "Согласный t переходит в ć дважды: KANDYDACIE в местном и звательном, KANDYDACI в мужской личной форме множественного. Так же ведут себя ASYSTENT, KOMENDANT и PRODUCENT — у всех слов на -ent и -at эта пара форм устроена одинаково, и запоминать их стоит вместе. Уничижительная форма у слова своя, KANDYDATY, и она отличается от KANDYDACI, что согласуется с правилом из карточки PRODUCENT." }
  - { kind: government, text: "Предлог зависит от того, куда человек метит. KANDYDAT NA COŚ с винительным — когда речь о должности, которую займут: kandydat na prezydenta, kandydat na dyrektora. KANDYDAT DO CZEGOŚ с родительным — когда речь о месте или организации: kandydat do pracy, kandydat do Sejmu, kandydat do nagrody. Русский в обоих случаях говорит «кандидат в» или «кандидат на», и соответствие не однозначное, так что предлог приходится выбирать по смыслу, а не по русскому образцу." }
  - { kind: usage, text: "Женская пара к слову — KANDYDATKA, с обычным суффиксом -ka, и в объявлениях о работе пишут обе формы рядом: kandydaci i kandydatki. Производные тоже нужны в быту: KANDYDOWAĆ значит «выдвигаться, быть кандидатом» — kandyduje na burmistrza, — а KANDYDATURA значит «кандидатура», и ZGŁOSIĆ KANDYDATURĘ есть «выдвинуть кандидатуру»." }
