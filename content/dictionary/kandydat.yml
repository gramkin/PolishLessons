etymology: "Из латинского CANDIDATUS «одетый в белое», от candidus «белый, блестящий»: в Риме соискатель должности выходил к народу в выбеленной тоге, чтобы его было видно издалека. Русское «кандидат» пришло из того же латинского слова через немецкий, так что слова совпадают целиком. Тот же корень виден в «кандиде» и в английском candid «откровенный» — белое значило ещё и чистое, незапятнанное."
memory: "t даёт ć дважды: kandydacie, kandydaci. Предлог по смыслу: na prezydenta о должности, do pracy о месте. От латинского «одетый в белое»."
