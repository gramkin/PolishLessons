notes:
  - { kind: usage, text: "Корень слова для русского поучителен. ROZRYWKA образована от ROZERWAĆ «разорвать», ROZRYWAĆ «разрывать», и буквально значит «разрыв» — перерыв в работе, отвлечение от дела. Русское «развлечение» построено на том же образе, только другим корнем: от «развлечь», а то от «влечь», то есть «оттянуть в сторону». Оба языка назвали отдых тем, что отрывает человека от труда, и совпадение это не случайное, а общее для всей Европы: английское distraction и французское divertissement устроены точно так же." }
  - { kind: usage, text: "Дательный и местный — ROZRYWCE, с переходом k в c; родительный множественного — ROZRYWEK, с беглым e. Пара эта у женских слов на -ka неразлучна, и в этой же партии её повторяет SZKLANKA со своими szklance и szklanek. Множественное число у слова живое и означает отдельные развлечения по счёту: tanie rozrywki, brak rozrywek." }
  - { kind: usage, text: "Самое частое сочетание — PRZEMYSŁ ROZRYWKOWY «индустрия развлечений», и в нём стоит заметить слово PRZEMYSŁ, разобранное в карточке MYŚL: оно значит «промышленность», хотя выглядит как русский «промысел». Другое нужное выражение — DLA ROZRYWKI «для развлечения», с родительным падежом после предлога dla, как и в русском." }
collocations:
  - { pl: "dla rozrywki", ru: "для развлечения" }
  - { pl: "przemysł rozrywkowy", ru: "индустрия развлечений" }
  - { pl: "tania rozrywka", ru: "дешёвое развлечение" }
family:
  - { pl: "rozerwać", ru: "разорвать", relation: root }
  - { pl: "rozrywkowy", ru: "развлекательный", relation: derived }
etymology: "От ROZRYWAĆ «разрывать», приставочного к RWAĆ «рвать», из праславянского *rъvati — того же корня, что русское «рвать». Развлечение понято как разрыв в череде дел, перерыв, отвлечение. Русское «развлечение» собрано по тому же образцу, но от «влечь»: тоже оттягивание в сторону от работы. Разные корни, одна и та же метафора."
memory: "От rozerwać «разорвать»: развлечение есть разрыв в работе — тот же образ, что в русском «развлечении» от «влечь». Местный rozrywce, родительный множественного rozrywek."
idioms:
  - { pl: "dla rozrywki", ru: "для развлечения" }
  - { pl: "przemysł rozrywkowy", ru: "индустрия развлечений" }
