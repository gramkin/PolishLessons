# review
id: metoda
format: 2
lemma: "metoda"
rank: 2166
pos: noun
pron: { cyr: "мэто́да" }
senses:
  - id: method
    ru: "метод, способ"
    examples:
      - pl: "Ta metoda sprawdza się od lat."
        ru: "Этот метод оправдывает себя годами."
        source: { kind: authored }
      - pl: "Opracowali nową metodę."
        ru: "Они разработали новый метод."
        source: { kind: authored }
      - pl: "Pracuje metodą prób i błędów."
        ru: "Он работает методом проб и ошибок."
        source: { kind: authored }
  - id: approach
    ru: "методика, подход"
    examples:
      - pl: "Jego metody budzą wątpliwości."
        ru: "Его методы вызывают сомнения."
        source: { kind: authored }
      - pl: "Zmienili metodę nauczania."
        ru: "Они сменили методику обучения."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ГЛАВНОЕ ОТЛИЧИЕ — РОД. Русский «метод» мужского рода, польская metoda — ЖЕНСКОГО, и согласование меняется целиком: ta nowa metoda, skuteczna metoda, а не «этот новый метод». Греческое methodos было женского рода, польский это сохранил, а русский слово омужествил. Расхождение не единичное и работает в обе стороны: польский temat мужского рода против русской «темы», program — против «программы»." }
  - { kind: pronunciation, text: "В дательном и предложном падеже d смягчается в dzi: metoda, но w metodzie — «в мэто́дзе». То же чередование, что в rozwód → w rozwodzie и lud → w ludzie." }
  - { kind: usage, text: "Родительный множественного — голая основа metod, безо всякой вставки. Сравните с paczek и marynarek: там между согласными пришлось вставить e, потому что -czk- и -rk- на конце слова не выговорить, а -tod произносится спокойно." }
collocations:
  - { pl: "metoda prób i błędów", ru: "метод проб и ошибок" }
  - { pl: "skuteczna metoda", ru: "действенный метод" }
  - { pl: "zmienić metodę", ru: "сменить метод" }
family:
  - { pl: "metodyka", ru: "методика", relation: derived }
  - { pl: "metodyczny", ru: "методичный", relation: derived }
  - { pl: "metodologia", ru: "методология", relation: derived }
etymology: "Из греческого methodos «путь исследования», буквально «путь вслед за чем-то», через латынь. В русский слово пришло тем же путём, но сменило род на мужской; польский сохранил исходный женский. Отсюда metodyka, metodyczny «методичный» и metodologia."
memory: "metoda — «метод», но ЖЕНСКОГО рода: ta nowa metoda, а не «этот новый метод». Греческое слово было женским, польский это сохранил, русский нет. И предложный падеж с мягким dzi: w metodzie."
idioms:
  - { pl: "metoda prób i błędów", ru: "метод проб и ошибок" }
  - { pl: "metodą gospodarczą", ru: "хозяйственным способом, своими силами" }
formExamplesSkip:
