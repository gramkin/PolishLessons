# review
id: kombinacja
format: 2
lemma: "kombinacja"
rank: 5342
pos: noun
pron: { cyr: "комбина́цья" }
senses:
  - id: combination
    ru: "комбинация, сочетание"
    examples:
      - pl: "To ciekawa kombinacja smaków."
        ru: "Это интересное сочетание вкусов."
        source: { kind: authored }
      - pl: "Zapomniałem kombinacji do sejfu."
        ru: "Я забыл комбинацию от сейфа."
        source: { kind: authored }
      - pl: "Piłkarze ćwiczyli kombinacje na treningu."
        ru: "Футболисты отрабатывали комбинации на тренировке."
        source: { kind: authored }
  - id: scheme
    ru: "махинация, хитрая комбинация (разг.)"
    examples:
      - pl: "To jakaś podejrzana kombinacja."
        ru: "Это какая-то подозрительная махинация."
        source: { kind: authored }
      - pl: "Wymyślił sprytną kombinację, żeby nie płacić."
        ru: "Он придумал хитрую комбинацию, чтобы не платить."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "KOMBINACJA — «комбинация, сочетание», а в разговоре и «махинация». Глагол KOMBINOWAĆ — «хитрить, мудрить»: NIE KOMBINUJ! — «не хитри!». Женское бельё «комбинация» — HALKA." }
  - { kind: usage, text: "Женский род. Родительный, дательный и местный — KOMBINACJI. Множественное — KOMBINACJE. Звательный и архаичное KOMBINACYJ не используем." }
  - { kind: government, text: "Комбинация чего — родительный: KOMBINACJA KOLORÓW. Комбинация к сейфу — KOMBINACJA DO SEJFU, DO с родительным. В сочетании с — W KOMBINACJI Z." }
  - { kind: pronunciation, text: "Читается «комбина́цья»: CJA — «цья». Ударение на предпоследнем слоге." }
collocations:
  - { pl: "kombinacja kolorów", ru: "сочетание цветов" }
  - { pl: "kombinacja do sejfu", ru: "код сейфа" }
  - { pl: "sprytna kombinacja", ru: "хитрая комбинация" }
family:
  - { pl: "kombinować", ru: "хитрить, мудрить", relation: derived }
  - { pl: "połączenie", ru: "соединение, сочетание", relation: root, id: polaczenie }
  - { pl: "zestaw", ru: "набор", relation: root, id: zestaw }
etymology: "Из позднелатинского COMBINATIO «соединение по два». Русское «комбинация» — то же слово."
memory: "Kombinacja — комбинация, сочетание и махинация. Kombinować — хитрить. Halka — комбинация-бельё. Читается «комбина́цья»."
idioms:
  - { pl: "nie kombinuj", ru: "не хитри, не мудри" }
formExamplesSkip:
  - { form: "kombinacjo", reason: "звательный не употребляется" }
  - { form: "kombinacyj", reason: "архаичный родительный множественного" }
