# review
id: trudny
format: 2
lemma: "trudny"
rank: 388
pos: adj
pron: { cyr: "тру́дны" }
senses:
  - id: hard
    ru: "трудный, сложный"
    examples:
      - pl: "To jest trudne."
        ru: "Это трудно."
        source: { kind: tatoeba, id: 869125 }
      - pl: "To trudne pytanie."
        ru: "Это трудный вопрос."
        source: { kind: tatoeba, id: 4716849 }
      - pl: "Nauczyciel zadał mi trudne pytanie."
        ru: "Учитель задал мне сложный вопрос."
        source: { kind: tatoeba, id: 720178 }
  - id: difficult-person
    ru: "трудный (о человеке, об отношениях)"
    examples:
      - pl: "Uważany jest za osobę trudną."
        ru: "Его считают трудным человеком."
        source: { kind: translated, id: 358048 }
      - pl: "Tom ma trudną relację ze swoim ojcem."
        ru: "У Тома сложные отношения с отцом."
        source: { kind: tatoeba, id: 12466814 }
      - pl: "Niektórzy ludzie są trudni do usatysfakcjonowania."
        ru: "Некоторым людям трудно угодить."
        source: { kind: translated, id: 4791021 }
notes:
  - { kind: usage, text: "Степени сравнения регулярные: trudny → trudniejszy → najtrudniejszy." }
  - { kind: usage, text: "О человеке trudny значит «тяжёлый в общении»: trudny charakter «трудный характер»." }
  - { kind: usage, text: "Trudno! — отдельная реплика «Ну что ж, ничего не поделаешь». Это очень частое польское пожатие плечами." }
  - { kind: false-friend, text: "Прилагательное совпадает с русским, а существительное расходится: «труд» по-польски praca, а trud — это «усилие, тягота»." }
collocations:
  - { pl: "trudne pytanie", ru: "трудный вопрос" }
  - { pl: "trudna sytuacja", ru: "трудная ситуация" }
  - { pl: "trudny charakter", ru: "трудный характер" }
  - { pl: "trudno!", ru: "ну что ж!" }
etymology: "Праславянское *trudьnъ от *trudъ «усилие, тягота»; русское «трудный» — то же самое слово."
memory: "trudny — «трудный», прилагательное совпадает с русским. А вот существительное расходится: «труд» по-польски praca, trud же значит «усилие, тягота». И запомните реплику Trudno! — «Ну что ж, ничего не поделаешь»."
idioms:
  - { pl: "dla chcącego nic trudnego", ru: "для желающего нет ничего трудного" }
  - { pl: "trudny charakter", ru: "трудный характер" }
  - { pl: "trudno!", ru: "ну что ж, ничего не поделаешь!" }
