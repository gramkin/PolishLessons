notes:
  - { kind: false-friend, text: "FILIŻANKA — «чашка» с ручкой и блюдцем, для кофе и чая. Кружка — KUBEK, стакан — SZKLANKA. В Польше чай часто пьют из стакана — SZKLANKA HERBATY, а кофе — из FILIŻANKA." }
  - { kind: usage, text: "Девять форм, женский род. В дательном и местном K переходит в C: W FILIŻANCE. Родительный множественного — FILIŻANEK, с беглым E." }
  - { kind: government, text: "Чашка чего — родительный: FILIŻANKA KAWY. Пить из чашки — PIĆ Z FILIŻANKI. Что-то в чашке — W FILIŻANCE, местный." }
  - { kind: pronunciation, text: "Читается «филижа́нка»: Ż — «ж», ударение на предпоследнем слоге. FILIŻANCE — «филижа́нце»." }
collocations:
  - { pl: "filiżanka kawy", ru: "чашка кофе" }
  - { pl: "filiżanka ze spodkiem", ru: "чашка с блюдцем" }
  - { pl: "porcelanowa filiżanka", ru: "фарфоровая чашка" }
family:
  - { pl: "kubek", ru: "кружка", relation: root, id: kubek }
  - { pl: "szklanka", ru: "стакан", relation: root, id: szklanka }
  - { pl: "spodek", ru: "блюдце", relation: root }
etymology: "Восточное заимствование: в основе турецкое FİNCAN «чашка», через венгерский. В польском слово закрепилось вместе с модой на кофе."
memory: "Filiżanka — чашка с блюдцем. Kubek — кружка, szklanka — стакан. Filiżanka kawy — чашка кофе. Читается «филижа́нка»."
idioms:
  - { pl: "zaprosić na filiżankę kawy", ru: "пригласить на чашечку кофе, позвать поговорить" }
