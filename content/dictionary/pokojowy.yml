etymology: "От POKÓJ, от праславянского корня со значением покоя, того же, что в русских «покой», «успокоить» и «почить». Путь значений красивый: сперва покой как состояние, затем мир как отсутствие войны, затем комната как место покоя. Русский прошёл тот же путь лишь наполовину: «покой» у нас это спокойствие и, в устаревшем смысле, комната, как в «палатах и покоях», а для отсутствия войны взялось отдельное слово «мир». Польский сохранил все три ветви на одном корне."
memory: "Ключ в существительном: pokój это разом и «мир», и «комната», потому что в основе лежит покой. Прилагательное взяло оба значения: rozwiązanie pokojowe «мирное решение» и roślina pokojowa «комнатное растение». Отсюда же pokojówka «горничная», убирающая комнаты. Русский «покой» прошёл половину того же пути и остановился. Читается «покойо́вы», а само pokój звучит «по́куй», потому что ó это всегда «у»."
