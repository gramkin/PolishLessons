notes:
  - { kind: false-friend, text: "Чтобы понять это слово, надо вспомнить, что POKÓJ по-польски значит сразу и «мир», и «комната». Оба значения живы, и прилагательное унаследовало оба: ROZWIĄZANIE POKOJOWE это «мирное решение», а ROŚLINA POKOJOWA это «комнатное растение». Русский держит для этого два разных корня, мир и комната, и потому связи не видит. Из того же гнезда вышла POKOJÓWKA «горничная», то есть та, кто убирает комнаты, а вовсе не миротворица." }
  - { kind: usage, text: "Одиннадцать форм, относительное прилагательное, степеней сравнения нет. Мужско-личная форма множественного числа POKOJOWI вполне обиходна в первом значении: POKOJOWI DEMONSTRANCI «мирные демонстранты», POKOJOWI MEDIATORZY. Во втором значении, о комнатах, мужско-личная форма почти не встречается: комнатные растения и термометры людьми не бывают. Это обычная судьба прилагательного с двумя значениями." }
  - { kind: government, text: "Прилагательное согласуется с существительным и в устойчивых сочетаниях чаще стоит после него: UKŁAD POKOJOWY «мирный договор», ROZMOWY POKOJOWE «мирные переговоры». Но в названии премии порядок обратный и закреплён: POKOJOWA NAGRODA NOBLA. В мирных переговорах — предлог W с местным падежом: W ROZMOWACH POKOJOWYCH. Прийти к мирному решению — DOJŚĆ DO ROZWIĄZANIA POKOJOWEGO, предлог DO с родительным." }
  - { kind: pronunciation, text: "Читается «покойо́вы», четыре слога, ударение на предпоследнем. Буква J здесь даёт «й», и сочетание OJO звучит «ойо», в два слога, а не одним звуком. Конечное Y даёт «ы». В женской форме POKOJOWA слышно «покойо́ва». В самом слове POKÓJ буква Ó читается как «у», поэтому оно звучит «по́куй», и это полезно помнить: Ó в польском всегда «у»." }
  - { kind: register, text: "Слово нейтральное и частое в обоих значениях, но в разных кругах. В новостях оно о мире: UKŁAD POKOJOWY, MISJA POKOJOWA «миротворческая миссия», POKOJOWA NAGRODA NOBLA, DEMONSTRACJA POKOJOWA. В быту и в магазине оно о комнате: ROŚLINY POKOJOWE «комнатные растения», TERMOMETR POKOJOWY. Путаницы между ними не возникает никогда, потому что существительное рядом сразу говорит, о чём речь." }
