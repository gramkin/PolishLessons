notes:
  - { kind: false-friend, text: "Одно польское слово на два русских, и оба русских от того же корня. POBUDKA это и «подъём», сигнал вставать, и, во множественном числе, «побуждения, мотивы». Корень БУД- общий: BUDZIĆ «будить», POBUDZIĆ «побудить». Русский развёл эти смыслы по разным словам, «подъём» и «побуждение», и связь между ними потерял, хотя она прямо перед глазами." }
  - { kind: usage, text: "Десять форм, женский род. В дательном и местном падеже единственного числа K переходит в C: POBUDKA, но PO POBUDCE. Родительный множественного POBUDEK с беглым E. Второе значение почти никогда не встречается в единственном числе: говорят POBUDKI, а не POBUDKA, когда речь о мотивах, и именно поэтому форма Z NISKICH POBUDEK звучит так привычно." }
  - { kind: government, text: "Из низменных побуждений — Z NISKICH POBUDEK, предлог Z с родительным множественного, и это устойчивая формула приговоров, слово в слово как русская. После подъёма — PO POBUDCE, предлог PO с местным падежом. Сыграть подъём — ZAGRAĆ POBUDKĘ, винительный без предлога. Действовать из каких-то побуждений — DZIAŁAĆ Z POBUDEK, снова Z с родительным." }
  - { kind: pronunciation, text: "Читается «побу́тка», три слога, ударение на втором. Буква D перед глухим K оглушается и звучит как «т», поэтому слышно «бутка», а не «будка»: это важно, потому что польское BUDKA с настоящим «д» значит «будка». В дательном и местном падеже POBUDCE оглушение остаётся: «побу́тце». В глаголе BUDZIĆ сочетание DZI даёт мягкое «дзь»." }
  - { kind: register, text: "Первое значение армейское и лагерное: POBUDKA O PIĄTEJ, TRĘBACZ ZAGRAŁ POBUDKĘ. В обиходе слово звучит и в шутку, когда будят домашних: POBUDKA, WSTAWAĆ! Второе значение, наоборот, юридическое и книжное: DZIAŁAŁ Z NISKICH POBUDEK стоит в приговорах, SZLACHETNE POBUDKI — в характеристиках. Спутать регистры трудно, их разводит число." }
collocations:
  - { pl: "zagrać pobudkę", ru: "сыграть подъём" }
  - { pl: "z niskich pobudek", ru: "из низменных побуждений" }
  - { pl: "szlachetne pobudki", ru: "благородные побуждения" }
family:
  - { pl: "budzić", ru: "будить", relation: root, id: budzic }
  - { pl: "obudzić", ru: "разбудить", relation: root, id: obudzic }
  - { pl: "budzik", ru: "будильник", relation: derived }
etymology: "От POBUDZIĆ «побудить, разбудить», от BUDZIĆ, от праславянского корня BUD-, давшего русские «будить», «побудка», «побуждение» и «бодрый». Оба значения польского слова растут из одного образа пробуждения: сперва буквального, затем внутреннего, когда человека что-то поднимает на поступок. Русский сохранил оба, но раздал их разным словам, и потому связь между подъёмом и побуждением в нём не чувствуется."
memory: "Одно слово на два русских, и оба от общего корня буд-: pobudka это и «подъём» по сигналу, и, во множественном, «побуждения». Русский развёл их по словам, поляк оставил вместе. Число разводит смыслы: pobudka это подъём, pobudki это мотивы. Юридическая формула z niskich pobudek совпадает с русской слово в слово. Читается «побу́тка», где d перед k оглушается до «т»."
idioms:
  - { pl: "z niskich pobudek", ru: "из низменных побуждений" }
