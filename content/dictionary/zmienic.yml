# review
id: zmienic
format: 2
lemma: "zmienić"
rank: 253
pos: verb
aspect: perf
pron: { cyr: "зме́ниць" }
senses:
  - id: change
    ru: "изменить, поменять, сменить"
    examples:
      - pl: "Zmienimy to."
        ru: "Мы это изменим."
        source: { kind: tatoeba, id: 10801644 }
      - pl: "Tom może to zmienić."
        ru: "Том может это изменить."
        source: { kind: tatoeba, id: 8948296 }
      - pl: "Nie mogę tego zmienić."
        ru: "Я не могу этого изменить."
        source: { kind: tatoeba, id: 5528872 }
  - id: change-self
    ru: "zmienić się — измениться"
    examples:
      - pl: "Co się zmieniło?"
        ru: "Что изменилось?"
        source: { kind: tatoeba, id: 6155087 }
      - pl: "Zmieniłyście się."
        ru: "Вы изменились."
        source: { kind: tatoeba, id: 13786256 }
      - pl: "Tom zmienił się na twarzy."
        ru: "Том изменился в лице."
        source: { kind: tatoeba, id: 6534023 }
notes:
  - { kind: usage, text: "Возвратное zmienić się значит «измениться»: Zmieniłeś się «Ты изменился», Co się zmieniło? «Что изменилось?»" }
  - { kind: usage, text: "zmienić zdanie значит «передумать» — буквально «изменить мнение»; zmienić temat — «сменить тему»." }
  - { kind: usage, text: "Несовершенный вид — zmieniać: Zmieniam plany co tydzień." }
  - { kind: usage, text: "Корень mienić родствен русскому «менять», «мена»: приставка z- работает как русская «из-» в «изменить»." }
collocations:
  - { pl: "zmienić zdanie", ru: "передумать" }
  - { pl: "zmienić temat", ru: "сменить тему" }
  - { pl: "zmienić się", ru: "измениться" }
  - { pl: "zmienić plany", ru: "изменить планы" }
etymology: "Из z- + mienić, от miana «мена»; тот же корень, что в русских «менять», «мена», «изменить»."
memory: "zmienić — «изменить, сменить», корень как в русском «менять». zmienić zdanie значит «передумать», а zmienić się — «измениться»."
idioms:
  - { pl: "zmienić zdanie", ru: "передумать" }
  - { pl: "zmienić temat", ru: "сменить тему" }
  - { pl: "zmienić śpiewkę", ru: "запеть по-другому" }
