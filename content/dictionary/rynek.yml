# review
id: rynek
format: 2
lemma: "rynek"
rank: 1973
pos: noun
pron: { cyr: "ры́нэк" }
senses:
  - id: marketplace
    ru: "рынок, базар; рыночная площадь"
    examples:
      - pl: "Idę na rynek."
        ru: "Я иду на рынок."
        source: { kind: translated, id: 2734033 }
      - pl: "Idziesz na rynek?"
        ru: "Ты идёшь на рынок?"
        source: { kind: translated, id: 2734036 }
      - pl: "Mama poszła na rynek."
        ru: "Мама пошла на рынок."
        source: { kind: tatoeba, id: 2734062 }
      - pl: "W tym miasteczku jest rynek."
        ru: "В этом городке есть рыночная площадь."
        source: { kind: translated, id: 832617 }
      - pl: "Sprzedają na rynku kalarepę."
        ru: "На рынке продают кольраби."
        source: { kind: translated, id: 12935583 }
      - pl: "Jutro na rynku będzie pchli targ."
        ru: "Завтра на площади будет блошиный рынок."
        source: { kind: translated, id: 8627647 }
  - id: market-economy
    ru: "рынок (экономический)"
    examples:
      - pl: "Duzi gracze kontrolują rynek."
        ru: "Крупные игроки контролируют рынок."
        source: { kind: translated, id: 366280 }
      - pl: "Mamy 20% udziałów w rynku."
        ru: "У нас двадцать процентов рынка."
        source: { kind: translated, id: 1645329 }
      - pl: "On jest moim konkurentem na rynku."
        ru: "Он мой конкурент на рынке."
        source: { kind: translated, id: 508864 }
notes:
  - { kind: usage, text: "В польских городах Rynek с прописной — это центральная площадь Старого города, например Rynek Główny в Кракове. Русское «рынок» такого значения не имеет." }
  - { kind: usage, text: "Экономическое значение совпадает с русским: wolny rynek «свободный рынок», czarny rynek «чёрный рынок», udział w rynku «доля рынка»." }
  - { kind: usage, text: "Беглое e в основе: rynek, но rynku, na rynku." }
collocations:
  - { pl: "iść na rynek", ru: "идти на рынок" }
  - { pl: "wolny rynek", ru: "свободный рынок" }
  - { pl: "na rynku", ru: "на рынке" }
etymology: "Из средневерхненемецкого ring «круг, площадь» — площадь в средневековом городе была окружена домами. Русское «рынок» пришло через польский, поэтому слова совпадают."
memory: "rynek — и «рынок», и центральная площадь города: Rynek Główny в Кракове. Беглое e: rynek, но na rynku."
idioms:
  - { pl: "wolny rynek", ru: "свободный рынок" }
  - { pl: "na rynku", ru: "на рынке" }
  - { pl: "czarny rynek", ru: "чёрный рынок" }
