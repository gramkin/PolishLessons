        ru: "Он мой конкурент на рынке."
        source: { kind: translated, id: 508864 }
notes:
  - { kind: usage, text: "В польских городах Rynek с прописной — это центральная площадь Старого города, например Rynek Główny в Кракове. Русское «рынок» такого значения не имеет." }
  - { kind: usage, text: "Экономическое значение совпадает с русским: wolny rynek «свободный рынок», czarny rynek «чёрный рынок», udział w rynku «доля рынка»." }
  - { kind: usage, text: "Беглое e в основе: rynek, но rynku, na rynku." }
  - { kind: government, text: "При склонении e выпадает: rynek, ale rynku, rynkiem, rynki. То же чередование, что в łeb и łba." }
collocations:
  - { pl: "iść na rynek", ru: "идти на рынок" }
  - { pl: "wolny rynek", ru: "свободный рынок" }
  - { pl: "na rynku", ru: "на рынке" }
etymology: "Из средневерхненемецкого ring «круг, площадь» — площадь в средневековом городе была окружена домами. Русское «рынок» пришло через польский, поэтому слова совпадают."
memory: "rynek — и «рынок», и центральная площадь города: Rynek Główny в Кракове. Беглое e: rynek, но na rynku."
idioms:
  - { pl: "wolny rynek", ru: "свободный рынок" }
  - { pl: "na rynku", ru: "на рынке" }
  - { pl: "czarny rynek", ru: "чёрный рынок" }
formExamplesSkip:
