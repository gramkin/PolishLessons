# review
id: ksiega
format: 2
lemma: "księga"
rank: 1994
pos: noun
pron: { cyr: "кще́нга" }
senses:
  - id: tome
    ru: "книга (большая, старинная); том"
    examples:
      - pl: "Koran jest świętą księgą muzułmanów."
        ru: "Коран — священная книга мусульман."
        source: { kind: tatoeba, id: 1266745 }
      - pl: "Świętą księgą muzułmanów jest Koran."
        ru: "Священная книга мусульман — Коран."
        source: { kind: translated, id: 524414 }
      - pl: "Czytanie z pierwszej księgi Samuela."
        ru: "Чтение из первой книги Самуила."
        source: { kind: translated, id: 1357205 }
      - pl: "Na stole leżała stara księga."
        ru: "На столе лежала старая книга."
        source: { kind: authored }
      - pl: "Ta księga liczy tysiąc stron."
        ru: "В этой книге тысяча страниц."
        source: { kind: authored }
      - pl: "Otworzył księgę na pierwszej stronie."
        ru: "Он открыл книгу на первой странице."
        source: { kind: authored }
  - id: register
    ru: "книга записей, реестр"
    examples:
      - pl: "Gdzie jest księga skarg."
        ru: "Где книга жалоб?"
        source: { kind: translated, id: 13041686 }
      - pl: "Nowi goście muszą się wpisać do księgi hotelowej."
        ru: "Новые гости должны вписаться в гостиничную книгу."
        source: { kind: translated, id: 1659853 }
notes:
  - { kind: false-friend, text: "Рядом с карточкой książka: książka — обычная книга, которую читают, księga — толстый том, священное писание или официальный реестр. Русское «книга» покрывает оба." }
  - { kind: usage, text: "В канцелярском языке: księga skarg «книга жалоб», księga gości «книга гостей», księgi wieczyste «поземельная книга»." }
  - { kind: usage, text: "Оборот czytać jak w otwartej księdze — «читать как в открытой книге», о человеке, которого легко понять." }
collocations:
  - { pl: "święta księga", ru: "священная книга" }
  - { pl: "księga skarg", ru: "книга жалоб" }
  - { pl: "jak w otwartej księdze", ru: "как в открытой книге" }
etymology: "Праславянское *kъniga, то же слово, что русская «книга». Польское księga сохранило значение большого тома, а обычную книгу назвали уменьшительным książka."
memory: "księga — толстый том, священное писание или реестр, а обычная книга — książka. Święta księga «священная книга», księga skarg «книга жалоб»."
