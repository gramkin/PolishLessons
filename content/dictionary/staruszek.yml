        ru: "Я встретил двух старичков у фонтана."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Самая опасная форма этого слова — родительный и винительный staruszka. Он пишется в точности как женское существительное staruszka «старушка». Поэтому Odprowadziłem staruszka значит «я проводил СТАРИЧКА», а не старушку, хотя русскому глазу слово кажется женским. Различает только согласование и контекст: tego staruszka (мужской) против ta staruszka (женский)." }
  - { kind: usage, text: "Слово ласковое, уменьшительное от stary «старый»; нейтральное название — starszy pan, а грубое — starzec. Предложный и звательный — staruszku. Именительный множественного — staruszkowie, по образцу названий мужчин (ср. panowie, ojcowie)." }
  - { kind: government, text: "Winowajcą путаницы служит одушевлённость: у одушевлённых существительных мужского рода винительный падеж совпадает с родительным, отсюда и widzę staruszka. Забота о кем-то — предлог nad с творительным: opieka nad staruszkiem." }
collocations:
  - { pl: "siwy staruszek", ru: "седой старичок" }
  - { pl: "poczciwy staruszek", ru: "добрый старичок" }
  - { pl: "opieka nad staruszkiem", ru: "забота о старичке" }
family:
  - { pl: "stary", ru: "старый", relation: root, id: stary }
  - { pl: "staruszka", ru: "старушка", relation: derived }
  - { pl: "starzec", ru: "старец, старик", relation: derived }
etymology: "Уменьшительное от stary «старый», праславянское *starъ — то же слово, что русское «старый». Русское «старичок» построено точно так же: корень плюс ласковый суффикс. Разошлись только суффиксы: польский взял -uszek, русский -ичок."
memory: "staruszek — «старичок», ласковое от stary. Главная ловушка: родительный и винительный staruszka совпадает по написанию с женским словом staruszka «старушка», так что widzę staruszka — это про старичка."
idioms:
  - { pl: "siwy staruszek", ru: "седой старичок" }
  - { pl: "poczciwy staruszek", ru: "добрый старичок" }
