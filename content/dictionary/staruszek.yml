        source: { kind: authored }
  - id: old-folk
    ru: "в мн. ч. старички, пожилые люди"
    examples:
      - pl: "Staruszkowie siedzieli na ławce."
        ru: "Старички сидели на лавке."
        source: { kind: authored }
