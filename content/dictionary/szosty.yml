notes:
  - { kind: usage, text: "ПОРЯДКОВОЕ ЧИСЛИТЕЛЬНОЕ МЕНЯЕТ ГЛАСНУЮ, А РУССКОЕ НЕТ. Количественное — SZEŚĆ «шесть», с e, а порядковое — SZÓSTY «шестой», с ó. Русский обходится одним «ше-»: шесть, шестой. Та же пара видна в sześćdziesiąt «шестьдесят» и szesnaście «шестнадцать», где e сохраняется." }
  - { kind: usage, text: "Женская форма SZÓSTA, как и DRUGA, служит названием времени: jest szósta «шесть часов», o szóstej «в шесть». В таблице этой карточки её нет — она идёт отдельной статьёй, как и druga. Запомни оборот o szóstej rano." }
  - { kind: pronunciation, text: "Два слога, ударение на первом: SZÓ-sty. Sz читается как ш, ó как у: «шу́сты». Не путай с szesnasty «шестнадцатый», где звучит «шэ»." }
collocations:
  - { pl: "szósty zmysł", ru: "шестое чувство" }
  - { pl: "na szóstym piętrze", ru: "на шестом этаже" }
  - { pl: "o szóstej", ru: "в шесть часов" }
family:
  - { pl: "sześć", ru: "шесть", relation: root, id: szesc }
  - { pl: "szóstka", ru: "шестёрка", relation: derived }
  - { pl: "piąty", ru: "пятый", relation: root, id: piaty }
etymology: "От sześć «шесть», из праславянского *šestь — того же, что русское «шесть». Порядковая форма *šestъjь дала szósty, где e перед закрытым слогом перешло в ó, как в naród и stół. Русский этого перехода не знает, поэтому «шестой» остался с е."
memory: "szósty — «шестой», но с ó, хотя sześć «шесть» идёт с e. Русский такой смены не делает. И помни, что szósta — это ещё и шесть часов: o szóstej rano."
