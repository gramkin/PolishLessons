# review
id: snic
format: 2
lemma: "śnić"
rank: 1862
pos: verb
pron: { cyr: "сьниць" }
senses:
  - id: dream-of
    ru: "сниться (śnić się komuś)"
    examples:
      - pl: "Śnił mi się dom z dzieciństwa."
        ru: "Мне снился дом из детства."
        source: { kind: authored }
      - pl: "Śni mi się to samo od tygodnia."
        ru: "Мне снится одно и то же неделю."
        source: { kind: authored }
      - pl: "Śniło jej się, że spóźniła się na pociąg."
        ru: "Ей снилось, что она опоздала на поезд."
        source: { kind: authored }
  - id: long-for
    ru: "мечтать, грезить (śnić o czymś)"
    examples:
      - pl: "Śnił o podróży do Włoch przez całe życie."
        ru: "Он всю жизнь мечтал о поездке в Италию."
        source: { kind: authored }
      - pl: "Śnimy o własnym domu."
        ru: "Мы мечтаем о собственном доме."
        source: { kind: authored }
  - id: dreaming
    ru: "śnienie — сновидение, грёзы"
    examples:
      - pl: "Śnienie na jawie nikomu nie szkodzi."
        ru: "Грезить наяву никому не вредит."
        source: { kind: authored }
      - pl: "O śnieniu i pamięci napisał książkę."
        ru: "О сновидениях и памяти он написал книгу."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "КОРЕНЬ У ВАС УЖЕ ЕСТЬ: польское sen — это русский «СОН», а śnić — «сниться». Начальное ś- вышло из мягкого s, отсюда разница в виде при полном родстве. Из того же гнезда sennik «сонник», senny «сонный», marzenie senne «сновидение»." }
  - { kind: government, text: "ПАДЕЖ СОВПАДАЕТ ТАМ, ГДЕ ЭТО ВАЖНЕЕ ВСЕГО. Снится КОМУ — ДАТЕЛЬНЫЙ, и по-польски так же: śni mi się, śniło jej się, śnił nam się dom. Строить фразу можно прямо по русскому образцу. Мечтают О чём — предлог o с предложным: śnić o podróży. А переходное śnić coś значит «видеть что-то во сне»: śnić koszmary." }
  - { kind: usage, text: "Вид несовершенный; совершенная пара для «присниться» — przyśnić się: śniło mi się to co noc «мне снилось это каждую ночь», но przyśnił mi się raz «приснился один раз». Безличный оборот śni mi się употребляется гораздо чаще личного." }
  - { kind: register, text: "Страдательные формы śniony принадлежат переходному употреблению (śnić sen «видеть сон») и звучат книжно, почти поэтически: śniony od lat obraz «образ, годами являвшийся во сне». В обиходе их не услышишь, но в литературе они обычны, поэтому карточка их сохраняет." }
collocations:
  - { pl: "śni mi się", ru: "мне снится" }
  - { pl: "śnić o czymś", ru: "мечтать о чём-л." }
  - { pl: "śnić na jawie", ru: "грезить наяву" }
family:
  - { pl: "sen", ru: "сон", relation: root, id: sen }
  - { pl: "senny", ru: "сонный", relation: derived }
  - { pl: "marzyć", ru: "мечтать", relation: derived, id: marzyc }
etymology: "От sen «сон», праславянское *sъnъ — ровно русский «сон». Глагол *sъniti дал польское śnić, где начальное ś- развилось из мягкого s перед утраченным редуцированным. Русское «сниться» построено от того же корня, и даже управление дательным падежом у обоих языков общее."
memory: "śnić — «сниться», от sen «сон». Самое ценное тут управление: śni MI się, дательный, слово в слово как «мне снится». А śnić o czymś — уже «мечтать о чём-то»."
idioms:
  - { pl: "śnić na jawie", ru: "грезить наяву" }
  - { pl: "nawet mi się nie śniło", ru: "мне и не снилось" }
