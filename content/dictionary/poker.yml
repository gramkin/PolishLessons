notes:
  - { kind: false-friend, text: "POKER — «покер», как в русском. Но «играть в покер» — GRAĆ W POKERA: винительный, который у названий игр совпадает с родительным, как GRAĆ W TENISA, GRAĆ W BRYDŻA." }
  - { kind: usage, text: "Мужской род, неисчисляемое: учим единственное. Винительный — POKERA, по образцу одушевлённых: так ведут себя многие названия игр и танцев." }
  - { kind: government, text: "Играть в покер — GRAĆ W POKERA, W с винительным. В покере — W POKERZE, местный. Выиграть в покер — WYGRAĆ W POKERA." }
  - { kind: register, text: "POKERFACE, KAMIENNA TWARZ — «покерфейс», бесстрастное лицо. В политике и бизнесе говорят о GRZE W POKERA — блефе и рискованной игре." }
