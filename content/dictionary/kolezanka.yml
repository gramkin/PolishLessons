family:
  - { pl: "kolega", ru: "приятель, коллега", relation: root, id: kolega }
  - { pl: "przyjaciółka", ru: "близкая подруга", relation: derived, id: przyjaciolka }
  - { pl: "znajoma", ru: "знакомая", relation: derived }
etymology: "Женская форма от kolega, из латинского collega «сотоварищ по должности», от con- «вместе» и legare «поручать». В польский слово пришло через латынь школ и университетов и расширилось до любого товарища; в русский — через канцелярию, и осталось при службе. Суффикс -anka образует женские пары, как в mieszkanka и Amerykanka."
memory: "koleżanka — прежде всего ПРИЯТЕЛЬНИЦА, не только «коллега»: koleżanka ze szkoły. Близкая подруга — przyjaciółka. И слово только женское: мужчина это kolega. Склонение как у paczka: koleżance, koleżanek."
idioms:
  - { pl: "koleżanka z pracy", ru: "коллега по работе" }
  - { pl: "po koleżeńsku", ru: "по-товарищески" }
