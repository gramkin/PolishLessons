notes:
  - { kind: false-friend, text: "РУССКАЯ «КОЛЛЕГА» УЖЕ ПОЛЬСКОЙ KOLEŻANKI. По-русски коллега — только по работе. Польское koleżanka это прежде всего ПРИЯТЕЛЬНИЦА, подруга: koleżanka ze szkoły, koleżanka z podwórka. Рабочий смысл есть, но его уточняют: koleżanka z pracy. И слово обязательно женское — мужчина это kolega, тогда как русское «коллега» одно на оба пола." }
  - { kind: usage, text: "ПОЛЬСКИЙ РАЗЛИЧАЕТ ДВЕ СТУПЕНИ БЛИЗОСТИ, КАК И РУССКИЙ. Przyjaciółka — близкая подруга, та, кому доверяют; koleżanka — просто знакомая, с которой учатся или работают. Назвать przyjaciółką едва знакомую женщину так же странно, как по-русски назвать «подругой» коллегу по отделу." }
  - { kind: pronunciation, text: "ДВА ИЗМЕНЕНИЯ, УЖЕ ЗНАКОМЫЕ ПО PACZKA. Дательный и предложный меняют k на c: koleżance. Родительный множественного вставляет беглое e: koleżanek. Так же ведут себя walizka, koszulka, porażka и kurtka. Ż читается как ж: «колежа́нка»." }
collocations:
