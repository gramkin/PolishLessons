# review
id: herbata
format: 2
lemma: "herbata"
rank: 1234
pos: noun
pron: { cyr: "хэрба́та" }
senses:
  - id: tea
    ru: "чай (напиток)"
    examples:
      - pl: "Pijesz herbatę."
        ru: "Ты пьёшь чай."
        source: { kind: tatoeba, id: 2739737 }
      - pl: "On pije herbatę bez mleka."
        ru: "Он пьёт чай без молока."
        source: { kind: tatoeba, id: 1583716 }
      - pl: "Poproszę herbatę z cytryną."
        ru: "Чай с лимоном, пожалуйста."
        source: { kind: tatoeba, id: 12586569 }
  - id: some-tea
    ru: "napić się herbaty — выпить чаю (родительный при частичном объекте)"
    examples:
      - pl: "Więcej herbaty?"
        ru: "Ещё чаю?"
        source: { kind: tatoeba, id: 10805930 }
      - pl: "Proszę napić się herbaty."
        ru: "Пожалуйста, выпейте чаю."
        source: { kind: tatoeba, id: 1356565 }
      - pl: "Napijemy się herbaty?"
        ru: "Почаёвничаем?"
        source: { kind: tatoeba, id: 10465182 }
  - id: kind
    ru: "сорт чая; травяной или фруктовый настой"
    examples:
      - pl: "Często pijemy zieloną herbatę."
        ru: "Мы часто пьём зелёный чай."
        source: { kind: tatoeba, id: 13784395 }
      - pl: "Ta herbata zwana jest zieloną herbatą."
        ru: "Этот чай называется зелёным чаем."
        source: { kind: translated, id: 479918 }
      - pl: "Herbaty dzielą się na sześć gatunków: zielone, białe, żółte, oolongi, czarne i postfermentowane."
        ru: "Чаи делятся на шесть видов: зелёные, белые, жёлтые, улуны, чёрные и постферментированные."
        source: { kind: tatoeba, id: 3632669 }
notes:
  - { kind: government, text: "Ключевое различие падежей: pić herbatę «пить чай» (винительный, весь объект), но napić się herbaty «выпить чаю» (родительный, часть). Русский делает ровно то же самое: «чай» и «чаю»." }
  - { kind: usage, text: "Kawa czy herbata? «Кофе или чай?» — стандартный вопрос хозяина. Ответ: Poproszę herbatę «Чай, пожалуйста»." }
  - { kind: usage, text: "Herbata значит не только чай из чайного листа, но и любой травяной или фруктовый настой: herbata miętowa «мятный чай»." }
  - { kind: pronunciation, text: "h произносится как русское «х», а e как «э»: хэрба́та. Ударение на предпоследний слог." }
collocations:
  - { pl: "pić herbatę", ru: "пить чай" }
  - { pl: "zielona herbata", ru: "зелёный чай" }
  - { pl: "herbata z cytryną", ru: "чай с лимоном" }
  - { pl: "napić się herbaty", ru: "выпить чаю" }
etymology: "Из новолатинского herba thea «трава тея», где thea через нидерландское thee восходит к южноминьскому tê. Русское «чай» пришло сухопутным путём из северокитайского chá — оттого слова так не похожи."
memory: "herbata — «чай». Запомните падежную пару: pić herbatę «пить чай», но napić się herbaty «выпить чаю» — ровно как русские «чай» и «чаю». И herbata покрывает любой настой, включая мятный и фруктовый."
idioms:
  - { pl: "kawa czy herbata?", ru: "кофе или чай?" }
  - { pl: "zielona herbata", ru: "зелёный чай" }
  - { pl: "po herbacie", ru: "дело сделано, поздно" }
formExamplesSkip:
  - { form: "herbato", reason: "звательный падеж: для неодушевлённого существительного он практически не употребляется" }
