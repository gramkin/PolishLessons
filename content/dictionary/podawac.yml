lemma: "podawać"
rank: 1924
pos: verb
pron: { cyr: "пода́ваць" }
senses:
  - id: hand
    ru: "подавать, передавать"
    examples:
      - pl: "W tym domu zupę podaje się pierwszą."
        ru: "В этом доме суп подают первым."
        source: { kind: authored }
      - pl: "Podaję ci rękę na zgodę."
        ru: "Подаю тебе руку в знак примирения."
        source: { kind: authored }
      - pl: "Obiad podawano o drugiej."
        ru: "Обед подавали в два."
        source: { kind: authored }
  - id: report
    ru: "сообщать, приводить (сведения)"
    examples:
      - pl: "Gazety podają, że śledztwo trwa."
        ru: "Газеты сообщают, что следствие продолжается."
        source: { kind: authored }
      - pl: "Podawane dane okazały się nieścisłe."
        ru: "Приводимые данные оказались неточными."
        source: { kind: authored }
  - id: serving
    ru: "podawanie — подача, раздача"
    examples:
      - pl: "Podawanie do stołu należało do najmłodszych."
        ru: "Подача на стол была делом младших."
        source: { kind: authored }
      - pl: "Przy podawaniu leku trzeba uważać na dawkę."
        ru: "При подаче лекарства надо следить за дозой."
        source: { kind: authored }
notes:
  - { kind: pronunciation, text: "ДВА СУФФИКСА ВТОРИЧНОГО НЕСОВЕРШЕННОГО ВИДА, И НАСТОЯЩЕЕ ВРЕМЯ У НИХ РАЗНОЕ. Глаголы на -awać теряют -wa- и берут -aj-: podawać даёт podaję, podajesz; так же dawać — daję, wstawać — wstaję, sprzedawać — sprzedaję. Глаголы на -ywać и -ować берут -uj-: zatrzymywać даёт zatrzymuję, pracować — pracuję. Зная окончание неопределённой формы, настоящее время можно построить не угадывая." }
  - { kind: false-friend, text: "Сам глагол совпадает с русским «подавать», но ДВА производных расходятся, и оба частотны. Podanie — это не «подаяние», а ЗАЯВЛЕНИЕ: podanie o pracę «заявление о приёме на работу». А podawać się ZA kogoś значит «ВЫДАВАТЬ себя за кого-то»: podawał się za lekarza. Русский в обоих случаях берёт другие слова." }
  - { kind: government, text: "Подают ЧТО КОМУ — винительный плюс дательный, как и по-русски: podać komuś rękę, podać dziecku wodę. В значении «сообщать» дополнение тоже винительное: gazety podają nazwiska. Возвратное podawać się za kogoś требует za с ВИНИТЕЛЬНЫМ." }
  - { kind: usage, text: "Вид несовершенный, совершенная пара — podać: kelner podawał dania przez godzinę «официант подавал блюда час», но podał mi rękę «он подал мне руку». Страдательное причастие podawany употребляется широко: lek podawany dożylnie «лекарство, вводимое внутривенно»." }
collocations:
  - { pl: "podać rękę", ru: "подать руку" }
  - { pl: "podawać do stołu", ru: "подавать на стол" }
  - { pl: "podawać się za kogoś", ru: "выдавать себя за кого-л." }
family:
  - { pl: "podać", ru: "подать", relation: aspect, id: podac }
  - { pl: "dawać", ru: "давать", relation: root, id: dawac }
  - { pl: "podanie", ru: "заявление", relation: derived }
etymology: "Приставка pod- плюс dawać «давать» — ровно то же сложение, что в русском «подавать». Корень общеславянский и совпадает буква в букву. Расхождения начинаются только в производных: польское podanie закрепилось за канцелярским «заявлением», а русское «подаяние» ушло к милостыне."
memory: "podawać — «подавать», слово в слово. Главное тут настоящее время: -awać теряет -wa-, и выходит podaję, podajesz, а не «podawam». И два расхождения: podanie это «заявление», а podawać się za kogoś — «выдавать себя за кого-то»."
idioms:
  - { pl: "podać komuś rękę", ru: "подать кому-л. руку" }
  - { pl: "podawać w wątpliwość", ru: "подвергать сомнению" }
