# review
id: odwazny
format: 2
lemma: "odważny"
rank: 2250
pos: adj
pron: { cyr: "одва́жны" }
senses:
  - id: brave
    ru: "отважный, смелый"
    examples:
      - pl: "Odważny strażak wszedł do płonącego domu."
        ru: "Отважный пожарный вошёл в горящий дом."
        source: { kind: authored }
      - pl: "Trzeba być odważnym, żeby się przyznać."
        ru: "Надо быть смелым, чтобы признаться."
        source: { kind: authored }
  - id: bold-decision
    ru: "смелый (о решении, поступке)"
    examples:
      - pl: "To była odważna decyzja."
        ru: "Это было смелое решение."
        source: { kind: authored }
      - pl: "Zadał odważne pytanie."
        ru: "Он задал смелый вопрос."
        source: { kind: authored }
  - id: daring
    ru: "дерзкий, рискованный"
    examples:
      - pl: "Projekt jest odważny, może za bardzo."
        ru: "Проект смелый, может быть, слишком."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "РУССКОЕ «ОТВАЖНЫЙ» — ЭТО И ЕСТЬ ЭТО СЛОВО, ЗАИМСТВОВАННОЕ ИЗ ПОЛЬСКОГО. Внутри него спрятана waga «вес»: odważyć się значит буквально «взвесить и решиться». Тот же корень дал ważny «важный» — и его русский тоже взял у поляков. Так что odważny, «важный» и «отважный» — одна семья, выросшая из слова «вес»." }
  - { kind: usage, text: "Говорят и о человеке, и о поступке, и о замысле: odważny człowiek, odważna decyzja, odważny projekt. В третьем значении слово может звучать предостережением: odważny pomysł иногда вежливый способ сказать «рискованный». Наречие odważnie, существительное odwaga «отвага, смелость»." }
  - { kind: pronunciation, text: "Три слога, ударение на предпоследнем: od-WAŻ-ny. Ż читается как твёрдое ж, приставка od перед звонким w остаётся звонкой: «одва́жны». В сравнительной степени ż оказывается перед мягким ni: odważniejszy — «одважне́йшы»." }
  - { kind: register, text: "Нейтрально во всех регистрах. Степени сравнения образуются обычным способом и употребляются часто: odważniejszy «смелее», najodważniejszy «самый смелый». Отсюда полная парадигма в тридцать три формы, в отличие от относительных прилагательных вроде wojenny, у которых их одиннадцать." }
collocations:
  - { pl: "odważna decyzja", ru: "смелое решение" }
  - { pl: "bądź odważny", ru: "будь смелым" }
  - { pl: "odważny czyn", ru: "отважный поступок" }
family:
  - { pl: "odwaga", ru: "отвага, смелость", relation: derived, id: odwaga }
  - { pl: "odważyć się", ru: "отважиться, решиться", relation: root }
  - { pl: "waga", ru: "вес, весы", relation: root, id: waga }
  - { pl: "tchórzliwy", ru: "трусливый", relation: antonym, id: tchorzliwy }
etymology: "От odważyć się «решиться», а то — от ważyć «весить», от waga «вес». Решиться значило взвесить риск и всё-таки пойти. Русское «отважный» не родное: оно целиком заимствовано из польского, как и «важный» от ważny. Отсюда odwaga, odważnie и ważyć się na coś."
memory: "odważny — «отважный», и русское слово заимствовано отсюда же. Внутри сидит waga «вес»: odważyć się значит взвесить и решиться. Одна семья: waga, ważny, odważny — вес, важность, отвага."
idioms:
