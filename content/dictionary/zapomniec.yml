# review
id: zapomniec
format: 2
lemma: "zapomnieć"
rank: 256
pos: verb
aspect: perf
pron: { cyr: "запо́мнець" }
senses:
  - id: forget
    ru: "забыть (что-либо)"
    note: "После zapomnieć часто идёт родительный падеж: Zapomniałem hasła."
    examples:
      - pl: "Zapomniałeś?"
        ru: "Ты забыл?"
        source: { kind: tatoeba, id: 6602998 }
      - pl: "Zapomniałem hasła."
        ru: "Я забыл пароль."
        source: { kind: tatoeba, id: 13400702 }
      - pl: "Zapomniał nakarmić psa."
        ru: "Он забыл покормить собаку."
        source: { kind: tatoeba, id: 2153670 }
  - id: forget-about
    ru: "забыть о чём-либо (zapomnieć o czymś)"
    examples:
      - pl: "Zapomnij o tym."
        ru: "Забудь про это."
        source: { kind: tatoeba, id: 2147222 }
      - pl: "Nie zapomnij umyć rąk."
        ru: "Не забудь помыть руки."
        source: { kind: tatoeba, id: 3864810 }
      - pl: "Zapomniałem go zapytać."
        ru: "Я забыл его спросить."
        source: { kind: tatoeba, id: 356527 }
notes:
  - { kind: usage, text: "Два управления: zapomnieć o czymś «забыть о чём-то» и zapomnieć czegoś — с родительным падежом: Zapomniałem hasła «Я забыл пароль», Zapomniałem pieniędzy «Я забыл деньги»." }
  - { kind: usage, text: "С инфинитивом значит «забыть сделать»: Zapomniałem go zapytać «Я забыл его спросить», Nie zapomnij umyć rąk." }
  - { kind: usage, text: "Несовершенный вид — zapominać: Ciągle zapominam «Я постоянно забываю»." }
  - { kind: usage, text: "Корень pomnieć родствен русскому «помнить»; приставка za- даёт тот же сдвиг, что в «запамятовать»." }
collocations:
  - { pl: "zapomnieć o czymś", ru: "забыть о чём-то" }
  - { pl: "zapomnij o tym", ru: "забудь об этом" }
  - { pl: "nie zapomnij", ru: "не забудь" }
  - { pl: "zapomniałem hasła", ru: "я забыл пароль" }
etymology: "Из za- + pomnieć «помнить», праславянское *pomьněti; тот же корень, что в русских «помнить», «память», «запамятовать»."
memory: "zapomnieć — «забыть»; корень pomnieć родня русскому «помнить». Управление двойное: zapomnieć o czymś и zapomnieć czegoś с родительным — Zapomniałem hasła."
idioms:
  - { pl: "zapomnieć języka w gębie", ru: "язык проглотить" }
  - { pl: "zapomnieć o całym świecie", ru: "забыть обо всём на свете" }
  - { pl: "zapomnieć na śmierć", ru: "забыть начисто" }
