# review
id: wiek
format: 2
lemma: "wiek"
rank: 555
pos: noun
pron: { cyr: "век" }
senses:
  - id: age
    ru: "возраст"
    note: "w wieku + родительный числительного: w wieku siedemnastu lat."
    examples:
      - pl: "Wiek uczestników bez ograniczeń."
        ru: "Возраст участников без ограничений."
        source: { kind: tatoeba, id: 2484460 }
      - pl: "W twoim wieku byłem już żonaty."
        ru: "В твоём возрасте я уже был женат."
        source: { kind: tatoeba, id: 3516174 }
      - pl: "Wyszła za mąż w wieku siedemnastu lat."
        ru: "Она вышла замуж в семнадцать лет."
        source: { kind: tatoeba, id: 525166 }
  - id: century
    ru: "век, столетие"
    note: "Przed piętnastym wiekiem «до пятнадцатого века»."
    examples:
      - pl: "Przed piętnastym wiekiem wierzono, iż Ziemia jest centrum wszechświata."
        ru: "До пятнадцатого века считалось, что Земля - центр Вселенной."
        source: { kind: tatoeba, id: 3154584 }
      - pl: "Wszystko zaczęło się w początkach XII wieku."
        ru: "Всё началось в начале XII века."
        source: { kind: tatoeba, id: 1350207 }
      - pl: "Żyjemy w dwudziestym pierwszym wieku."
        ru: "Мы живём в двадцать первом веке."
        source: { kind: authored }
  - id: ages
    ru: "wieki — целая вечность (разговорное)"
    note: "Wieki cię nie widziałem «Сто лет тебя не видел»."
    examples:
      - pl: "Wieki cię nie widziałem."
        ru: "Сто лет тебя не видел."
        source: { kind: translated, id: 984506 }
      - pl: "Wieki się nie widzieliśmy."
        ru: "Мы сто лет не виделись."
        source: { kind: translated, id: 6320731 }
      - pl: "Od wieków go nie widziałem."
        ru: "Я сто лет его не видел."
        source: { kind: translated, id: 7184949 }
notes:
  - { kind: usage, text: "Два значения, как и в русском: «возраст» (w twoim wieku «в твоём возрасте») и «век» (XX wiek «двадцатый век»)." }
  - { kind: government, text: "Возраст с числом строится через w wieku плюс родительный: wyszła za mąż w wieku siedemnastu lat «она вышла замуж в семнадцать лет»." }
  - { kind: usage, text: "Множественное wieki в разговоре значит «целую вечность»: Wieki cię nie widziałem, od wieków «испокон веков»." }
  - { kind: usage, text: "Прилагательные расходятся: wiekowy — «престарелый; вековой», а wieczny — «вечный»." }
collocations:
  - { pl: "w twoim wieku", ru: "в твоём возрасте" }
  - { pl: "w wieku dwudziestu lat", ru: "в двадцать лет" }
  - { pl: "XX wiek", ru: "двадцатый век" }
  - { pl: "od wieków", ru: "испокон веков" }
family:
  - { pl: "wieczny", ru: "вечный", relation: derived }
  - { pl: "wiekowy", ru: "престарелый; вековой", relation: derived }
  - { pl: "wiecznie", ru: "вечно", relation: derived }
etymology: "От праславянского *vekъ — то же слово, что русское «век»; оба совмещают значения «возраст» и «столетие»."
memory: "wiek — и «возраст», и «век», ровно как в русском: w twoim wieku «в твоём возрасте», но XX wiek «двадцатый век». Возраст с числом идёт через w wieku плюс родительный: w wieku siedemnastu lat «в семнадцать лет». А множественное wieki в разговоре значит «целую вечность»: Wieki cię nie widziałem «Сто лет тебя не видел», od wieków «испокон веков»."
idioms:
  - { pl: "Wieki cię nie widziałem", ru: "Сто лет тебя не видел" }
  - { pl: "od wieków", ru: "испокон веков" }
  - { pl: "w twoim wieku", ru: "в твоём возрасте" }
