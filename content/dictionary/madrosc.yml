notes:
  - { kind: false-friend, text: "Поправка касается не существительного, а прилагательного, от которого оно образовано, и она важная. Польское MĄDRY — это в первую очередь «умный», обычное повседневное слово: MĄDRE DZIECKO значит «умный ребёнок», а не «мудрый ребёнок». Русское «мудрый» звучит гораздо торжественнее и о ребёнке так не скажут. Отсюда и MĄDROŚĆ бывает проще русской «мудрости»: ZĄB MĄDROŚCI это просто «зуб мудрости», анатомический термин. А вот MĄDRZYĆ SIĘ значит «умничать» и звучит с насмешкой." }
  - { kind: pronunciation, text: "Читается «мо́ндросьчь», два слога, ударение на первом. Носовая Ą перед D звучит как «он», поэтому начало слова «мон», а не «ман» и не «мун». Это то же правило, что в ZĄB «зомп» и DĄB «домп». Конец слова, -ŚĆ, это два мягких звука подряд, «сьчь», слитно. В прилагательном MĄDRY слышно «мо́ндры», с «ы» на конце." }
  - { kind: usage, text: "Шесть форм, разряд женских существительных на -OŚĆ, и суффикс отвечает русскому -ОСТЬ. Множественное число совершенно обычно и означает отдельные мудрые изречения: MĄDROŚCI LUDOWE «народные мудрости», ZŁOTE MĄDROŚCI «золотые истины». В этом смысле слово часто звучит с лёгкой иронией, когда речь о чужих поучениях. Отдельно стоит анатомический термин ZĄB MĄDROŚCI, где родительный падеж уже застыл и менять его нельзя." }
  - { kind: government, text: "Чья мудрость — родительный без предлога: MĄDROŚĆ STARYCH LUDZI. В чём мудрость — предлог W с предложным: MĄDROŚĆ W POSTĘPOWANIU. Прилагательное MĄDRY управляет предлогом W с предложным в значении области: MĄDRY W INTERESACH «умный в делах». Возвратный глагол MĄDRZYĆ SIĘ требует предлога NA с предложным или вовсе обходится без дополнения: NIE MĄDRZ SIĘ «не умничай»." }
  - { kind: register, text: "Слово нейтральное, с уклоном в книжное и поучительное. Частые обороты: MĄDROŚĆ LUDOWA «народная мудрость», MĄDROŚĆ ŻYCIOWA «житейская мудрость», ZĄB MĄDROŚCI «зуб мудрости», KSIĘGA MĄDROŚCI как название библейской книги. В живой речи вместо существительного почти всегда скажут прилагательным: TO MĄDRE «это умно», BĄDŹ MĄDRY «будь умным». Наречие MĄDRZE значит «умно»: POSTĄPIŁ MĄDRZE." }
