etymology: "От прилагательного MĄDRY, от праславянского *mǫdrъ, то есть от того же слова, что русское «мудрый». Носовая Ą отвечает здесь русскому «у», и это соответствие регулярно: MĄDRY и «мудрый», ZĄB и «зуб», DĄB и «дуб», MĄŻ и «муж». Суффикс -OŚĆ точно отвечает русскому -ОСТЬ, так что MĄDROŚĆ и «мудрость» собраны из одинаковых частей. Разошлись языки только в стилистике: польский оставил прилагательное в повседневном слое со значением «умный», а русский увёл «мудрый» в высокий слой и завёл для обычного случая отдельное слово «умный»."
memory: "Соответствие носового регулярно: ą отвечает русскому у, mądry и «мудрый», ząb и «зуб», dąb и «дуб». Но стиль разный: польское mądry это обычное «умный», mądre dziecko, а русское «мудрый» звучит торжественно. Читается «мо́ндросьчь», где ą перед d даёт «он». Множественное mądrości значит «мудрые изречения», часто с иронией. Два готовых оборота: mądrość ludowa «народная мудрость» и ząb mądrości «зуб мудрости». И mądrzyć się значит «умничать»."
