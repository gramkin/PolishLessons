notes:
  - { kind: usage, text: "Мужской вариант — pielęgniarz «медбрат». Слово образовано от pielęgnować «ухаживать, заботиться»." }
  - { kind: government, text: "После być и zostać название профессии стоит в творительном падеже: jest pielęgniarką, została pielęgniarką — точно как в русском «работает медсестрой»." }
  - { kind: false-friend, text: "В больнице к медсестре обращаются siostro, как и в русском «сестра», но название профессии всё-таки pielęgniarka, а не siostra." }
  - { kind: pronunciation, text: "Четыре слога: pie-lęg-niar-ka, ударение на niar. Сочетание gni читается мягко — «гня»." }
collocations:
  - { pl: "zostać pielęgniarką", ru: "стать медсестрой" }
  - { pl: "pielęgniarka dyplomowana", ru: "дипломированная медсестра" }
