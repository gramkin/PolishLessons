  - { pl: "pielęgnować", ru: "ухаживать, заботиться", relation: root }
  - { pl: "pielęgniarstwo", ru: "сестринское дело", relation: root }
etymology: "От pielęgnować «ухаживать», заимствованного из немецкого pflegen «заботиться». Русское «медсестра» — сокращение от «медицинская сестра», построенное совсем иначе."
memory: "pielęgniarka — «медсестра», от pielęgnować «ухаживать». Мужчина — pielęgniarz. И помните творительный падеж: ona jest pielęgniarką, chcę zostać pielęgniarką."
