# review
id: lecz
format: 2
lemma: "lecz"
rank: 1973
pos: conj
pron: { cyr: "лэч" }
senses:
  - id: but
    ru: "но, а (книжный противительный союз)"
    examples:
      - pl: "Nie jestem lekarzem, lecz nauczycielem."
        ru: "Я не доктор, а учитель."
        source: { kind: tatoeba, id: 3704149 }
      - pl: "To nie ślepota wrodzona, lecz nabyta."
        ru: "Это не врождённая слепота, а приобретённая."
        source: { kind: tatoeba, id: 13798037 }
      - pl: "Płakała i płakała, lecz nikt nie przyszedł jej pocieszyć."
        ru: "Она плакала и плакала, но никто не пришёл, чтобы её утешить."
        source: { kind: tatoeba, id: 775968 }
  - id: literary
    ru: "но (в литературной речи, на месте разговорного ale)"
    examples:
      - pl: "Odwróciłem się pewien, że ujrzę doktora Mortimera, lecz ku mojemu zdziwieniu, zobaczyłem nieznajomego."
        ru: "Я обернулся, уверенный, что увижу доктора Мортимера, но, к моему удивлению, увидел незнакомца."
        source: { kind: authored }
      - pl: "Lecz fakty są faktami."
        ru: "Но факты есть факты."
        source: { kind: authored }
      - pl: "Powtarzam ci: ta piękna dama jest nie siostrą, lecz żoną Stapletona."
        ru: "Повторяю тебе: эта красивая дама — не сестра, а жена Стэплтона."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Конструкция nie X, lecz Y — «не X, а Y»: Nie jestem lekarzem, lecz nauczycielem «Я не врач, а учитель». Это самое частое употребление." }
  - { kind: register, text: "lecz — книжный вариант союза ale. В разговоре почти всегда говорят ale, поэтому lecz звучит как признак письменной и литературной речи." }
  - { kind: usage, text: "Русские «но» и «а» оба передаются через ale или lecz: выбор между ними — вопрос регистра, а не смысла." }
  - { kind: usage, text: "В отличие от ale, союз lecz не начинает реплику: переспрашивают Ale co? «Но что?», а не *Lecz co?" }
collocations:
  - { pl: "nie tylko..., lecz także", ru: "не только..., но и" }
  - { pl: "lecz jednak", ru: "но всё же" }
  - { pl: "nie X, lecz Y", ru: "не X, а Y" }
etymology: "Старый противительный союз, родственный ale. В современном языке закрепился как книжный вариант, а в разговорной речи его почти полностью вытеснило ale."
memory: "lecz — книжное «но». Главное, что стоит запомнить, — конструкция nie X, lecz Y «не X, а Y»: Nie jestem lekarzem, lecz nauczycielem. В живой речи на его месте почти всегда ale, поэтому lecz сразу выдаёт письменный или литературный стиль."
idioms:
  - { pl: "nie tylko..., lecz także", ru: "не только..., но и" }
  - { pl: "nie X, lecz Y", ru: "не X, а Y" }
  - { pl: "lecz oto", ru: "но вот" }
