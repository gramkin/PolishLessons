        ru: "У него очень консервативные взгляды на семью."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Ловушки в значении нет: TRADYCYJNY — «традиционный». Но во втором значении польское слово шире русского: TRADYCYJNA POCZTA — это обычная бумажная почта в отличие от электронной, TRADYCYJNY SKLEP — обычный магазин в отличие от интернет-магазина. Русский тут скажет «обычный», а поляк по привычке — TRADYCYJNY." }
  - { kind: usage, text: "Прилагательное без собственных степеней сравнения: «более традиционный» — BARDZIEJ TRADYCYJNY. Все одиннадцать форм живые. Форма для мужчин-людей TRADYCYJNI встречается о людях с консервативными взглядами: TRADYCYJNI KATOLICY, TRADYCYJNI WYBORCY." }
  - { kind: government, text: "Может стоять и до, и после существительного: TRADYCYJNA KUCHNIA и KUCHNIA TRADYCYJNA. Перед существительным звучит естественнее в описании, после — в названиях: MEDYCYNA TRADYCYJNA. Традиционным способом — TRADYCYJNIE или W TRADYCYJNY SPOSÓB, W с винительным." }
  - { kind: pronunciation, text: "Читается «традыцы́йны», четыре слога, ударение на предпоследнем. DY даёт твёрдое «ды», а не «ди»: русскому уху это непривычно. CY — «цы», за ним J — «й». Конечная Y — «ы»." }
  - { kind: register, text: "Нейтральное слово, очень частое в рекламе: TRADYCYJNY SMAK, TRADYCYJNA RECEPTURA, «традиционный вкус», «традиционный рецепт» — обещание домашнего качества. В политике TRADYCYJNE WARTOŚCI, «традиционные ценности», — лозунг правых партий." }
collocations:
  - { pl: "tradycyjna kuchnia", ru: "традиционная кухня" }
  - { pl: "tradycyjne wartości", ru: "традиционные ценности" }
  - { pl: "tradycyjny przepis", ru: "традиционный рецепт" }
family:
