pos: adj
pron: { cyr: "традыцы́йны" }
senses:
  - id: traditional
    ru: "традиционный (по традиции)"
    examples:
      - pl: "Na Wigilię jemy tradycyjny barszcz z uszkami."
        ru: "В сочельник мы едим традиционный борщ с ушками."
        source: { kind: authored }
      - pl: "Wesele było tradycyjne, z oczepinami."
