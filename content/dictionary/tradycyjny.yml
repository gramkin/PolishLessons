  - { pl: "tradycyjnie", ru: "традиционно, по традиции", relation: derived }
  - { pl: "tradycjonalista", ru: "традиционалист", relation: derived }
etymology: "От TRADYCJA, из латинского traditio, «передача», от tradere «передавать». Традиция — то, что передают из рук в руки. От того же латинского глагола и английское traitor, «предатель»: тот, кто передал врагу. Польское -YJNY — обычное окончание прилагательных от слов на -CJA: AKCJA, AKCYJNY; STACJA, STACYJNY."
memory: "Tradycyjny — традиционный: tradycyjna kuchnia, tradycyjne wartości. А ещё «обычный» в противовес новому: tradycyjna poczta — бумажная. Читается «традыцы́йны», ды твёрдое."
idioms:
