        source: { kind: authored }
      - pl: "Ta tradycyjna kuchnia góralska jest bardzo tłusta."
        ru: "Эта традиционная горская кухня очень жирная."
        source: { kind: authored }
  - id: conventional
    ru: "обычный, привычный, консервативный"
    examples:
      - pl: "Wolę tradycyjne książki od czytników."
        ru: "Я предпочитаю обычные книги электронным."
        source: { kind: authored }
