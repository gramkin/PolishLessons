etymology: "От DZIEŁO «деяние, произведение», из праславянского *dělo — того же слова, что русское «дело». Прилагательное значило исходно «способный к делу, деятельный», и из этой способности в двух языках выросли разные качества: польский увидел в ней готовность к поступку и пришёл к храбрости, русский — умение вести дело и пришёл к толковости, откуда «дельный». Из того же корня идут польские DZIAŁAĆ «действовать», DZIAŁ «отдел», DZIELIĆ «делить» и русские «делать», «доля», «делить» — последние через значение разделения, которое в этом гнезде соседствует с деянием ещё с праславянского. Поэтому DZIELNICA «район» и DZIELNY «храбрый» действительно родственники, хотя связь между ними сегодня не прочитывается."
memory: "Не «дельный», а «храбрый»: русское «дельный» по-польски rzeczowy или praktyczny. Корень один, *dělo «дело», и оба языка построили от него прилагательное — польский к способности на поступок, русский к умению вести дело. Родство настоящее, перевод через него ошибочный. Тридцать три формы, качественное. В похвале ребёнку ближе русское «молодец»: dzielnie się trzymać. Dzi читается одним мягким «дзь»."
idioms:
