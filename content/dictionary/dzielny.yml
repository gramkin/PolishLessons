notes:
  - { kind: false-friend, text: "Созвучие с русским «дельным» полное, а значение другое, и это тот самый случай, когда родство сбивает сильнее, чем его отсутствие. DZIELNY значит «храбрый, доблестный»: DZIELNY ŻOŁNIERZ, DZIELNA DZIEWCZYNKA. Русское «дельный» значит «толковый, практичный», и по-польски это RZECZOWY или PRAKTYCZNY. Корень при этом один — праславянское *dělo, «дело», — и оба языка построили прилагательное от него, только пошли в разные стороны: польский к способности на поступок, то есть к смелости, русский к способности разбираться в деле, то есть к толковости. Так что родство настоящее, а перевод через него ошибочный." }
  - { kind: government, text: "Прилагательное качественное, тридцать три формы: одиннадцать в положительной степени, одиннадцать в сравнительной DZIELNIEJSZY и одиннадцать в превосходной NAJDZIELNIEJSZY. Это стандартная таблица качественного прилагательного, та же, что у DOSTĘPNY, и отличающаяся от одиннадцати форм относительного SPORTOWY втрое. Сравнение строится предлогом OD с родительным или союзом NIŻ: DZIELNIEJSZY OD BRATA, DZIELNIEJSZY NIŻ BRAT. В чём храбрый — предлог W с местным: DZIELNY W BOJU. Наречие DZIELNIE «храбро, стойко»." }
  - { kind: pronunciation, text: "Читается «дзе́льны», ударение на предпоследнем слоге из двух. Сочетание DZI даёт один слитный мягкий звук «дзь», для русского непривычный: это не «дж» и не «з». Буква L мягкая, отсюда «ль». Конечное -Y звучит «ы». В форме мужского лица множественного DZIELNI слышно «дзе́льни». В сравнительной степени DZIELNIEJSZY четыре слога и ударение на предпоследнем: «дзельне́йшы»." }
  - { kind: usage, text: "Частотные сочетания: DZIELNY ŻOŁNIERZ, DZIELNA DZIEWCZYNKA, DZIELNIE SIĘ TRZYMAĆ «держаться молодцом», DZIELNY CHŁOPIEC. В обращении к ребёнку или к больному слово звучит как похвала за стойкость, и русское «молодец» передаёт его точнее, чем «храбрый». Существительное DZIELNOŚĆ означает доблесть и входит в формулу ZA DZIELNOŚĆ «за доблесть» на орденах. Не путать с DZIELNICA «район города» и DZIELIĆ «делить»: те идут от того же корня, но через значение разделения, а не деяния." }
