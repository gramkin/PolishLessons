    pl: "Wypadki będą się zdarzać."
    ru: "Несчастные случаи будут случаться."
    source: { kind: translated, id: 594016 }
  - form: "zdarzać"
    pl: "Takie rzeczy mogą się zdarzać."
    ru: "Такие вещи могут случаться."
    source: { kind: translated, id: 4939080 }
  - form: "zdarzać"
    pl: "To nie powinno się zdarzać."
    ru: "Такого не должно случаться."
    source: { kind: authored }
  - form: "zdarzają"
    pl: "Zdarzają się wyjątki."
    ru: "Бывают исключения."
    source: { kind: translated, id: 2265279 }
  - form: "zdarzają"
    pl: "Pomyłki się zdarzają."
    ru: "Ошибки случаются."
    source: { kind: translated, id: 10542043 }
  - form: "zdarzają"
    pl: "Wypadki zdarzają się codziennie."
    ru: "Аварии случаются каждый день."
    source: { kind: translated, id: 366561 }
  - form: "zdarzając"
    pl: "Zdarzając się rzadko, takie błędy nie budzą niepokoju."
    ru: "Случаясь редко, такие ошибки не тревожат."
    source: { kind: authored }
  - form: "zdarzając"
    pl: "Wypadki, zdarzając się coraz częściej, zmusiły miasto do działania."
    ru: "Аварии, случаясь всё чаще, заставили город действовать."
    source: { kind: authored }
  - form: "zdarzając"
    pl: "Zdarzając się raz na sto lat, powódź i tak zaskakuje."
    ru: "Случаясь раз в сто лет, наводнение всё равно застаёт врасплох."
    source: { kind: authored }
  - form: "zdarzająca"
    pl: "Zdarzająca się raz na sto lat powódź zniszczyła most."
    ru: "Наводнение, случающееся раз в сто лет, разрушило мост."
    source: { kind: authored }
  - form: "zdarzająca"
    pl: "To awaria zdarzająca się rzadko."
    ru: "Это авария, случающаяся редко."
    source: { kind: authored }
  - form: "zdarzająca"
    pl: "Zdarzająca się co roku burza zrywa dachy."
    ru: "Гроза, случающаяся каждый год, срывает крыши."
    source: { kind: authored }
  - form: "zdarzającą"
    pl: "Znam awarię zdarzającą się rzadko."
    ru: "Я знаю аварию, случающуюся редко."
    source: { kind: authored }
  - form: "zdarzającą"
    pl: "Opisał powódź zdarzającą się raz na sto lat."
    ru: "Он описал наводнение, случающееся раз в сто лет."
    source: { kind: authored }
  - form: "zdarzającą"
    pl: "Badali usterkę zdarzającą się co zimę."
    ru: "Они изучали неисправность, случающуюся каждую зиму."
    source: { kind: authored }
  - form: "zdarzające"
    pl: "Zdarzające się rzadko wyjątki potwierdzają regułę."
    ru: "Исключения, случающиеся редко, подтверждают правило."
    source: { kind: authored }
  - form: "zdarzające"
    pl: "To błędy zdarzające się każdemu."
    ru: "Это ошибки, случающиеся с каждым."
    source: { kind: authored }
  - form: "zdarzające"
    pl: "Zdarzające się co roku burze zrywają dachy."
    ru: "Грозы, случающиеся каждый год, срывают крыши."
    source: { kind: authored }
  - form: "zdarzającego"
    pl: "Dotyczy to wyjątku zdarzającego się rzadko."
    ru: "Это касается исключения, случающегося редко."
    source: { kind: authored }
  - form: "zdarzającego"
    pl: "Nie ma tu błędu zdarzającego się często."
    ru: "Здесь нет ошибки, случающейся часто."
    source: { kind: authored }
  - form: "zdarzającego"
    pl: "Koszt wypadku zdarzającego się raz na rok jest niski."
    ru: "Цена аварии, случающейся раз в год, невелика."
    source: { kind: authored }
