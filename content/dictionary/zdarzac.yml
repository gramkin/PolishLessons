# review
id: zdarzac
format: 2
lemma: "zdarzać"
rank: 1356
pos: verb
aspect: imperf
aspectPair: zdarzyc
pron: { cyr: "зда́жаць" }
senses:
  - id: happen
    ru: "случаться, происходить, бывать"
    examples:
      - pl: "Tak, to się czasem zdarza."
        ru: "Да, время от времени такое случается."
        source: { kind: tatoeba, id: 886272 }
      - pl: "Zdarza się."
        ru: "Бывает."
        source: { kind: translated, id: 826581 }
      - pl: "Wypadki zdarzają się codziennie."
        ru: "Аварии случаются каждый день."
        source: { kind: translated, id: 366561 }
  - id: occur
    ru: "встречаться, иметь место (об исключениях, ошибках)"
    examples:
      - pl: "Zdarzają się wyjątki."
        ru: "Бывают исключения."
        source: { kind: translated, id: 2265279 }
      - pl: "Rzadko zdarza mu się pracować."
        ru: "Ему редко случается работать."
        source: { kind: translated, id: 440579 }
notes:
  - { kind: government, text: "Подлежащее у zdarzać się — событие, а не человек: zdarza się wypadek «случается авария». Форм 1-го и 2-го лица (zdarzam się, będę się zdarzać) в языке нет, поэтому будущее время дано только в третьем лице." }
  - { kind: usage, text: "Почти всегда с się: zdarza się «случается», zdarzają się «случаются». Без się глагол значит «причинять» и в живой речи почти не встречается." }
  - { kind: usage, text: "Несовершенный вид к zdarzyć się. Zdarza się — «бывает, случается вообще», zdarzyło się — «случилось однажды»." }
  - { kind: government, text: "Часто с дательным лица: zdarza mi się «мне случается», zdarzyło mu się «ему довелось». Rzadko zdarza mu się pracować «Ему редко случается работать»." }
  - { kind: usage, text: "Безличное Zdarza się — готовый ответ на извинение, ровно как русское «Бывает»." }
collocations:
  - { pl: "zdarza się", ru: "бывает, случается" }
  - { pl: "wypadki się zdarzają", ru: "аварии случаются" }
  - { pl: "zdarzają się wyjątki", ru: "бывают исключения" }
etymology: "Приставка z- и darzyć «одарять, приносить» (от dar «дар»). Образ тот же, что в русском «выпасть на долю»: случившееся — это то, что кому-то досталось."
memory: "zdarzać się — «случаться, бывать», и почти всегда с się. Zdarza się — «Бывает», готовый ответ на чужую оплошность. Несовершенный вид к zdarzyć się, часто с дательным: zdarza mi się «мне случается»."
idioms:
  - { pl: "zdarza się", ru: "бывает, всякое бывает" }
  - { pl: "to się zdarza najlepszym", ru: "это случается и с лучшими" }
  - { pl: "cuda się zdarzają", ru: "чудеса случаются" }
