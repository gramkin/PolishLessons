notes:
  - { kind: pronunciation, text: "Читается «и́гуа», ударение на первом слоге из двух. Буква Ł даёт «у», поэтому не «игла», а «и́гуа» — и это одна из самых наглядных пар в словаре, потому что русское слово известно каждому и рука сама тянется прочитать Ł как Л. В дательном и местном падеже IGLE буква Ł переходит в мягкое L и звучит «ле»: «и́гле». А в родительном множественного IGIEŁ появляется вставная гласная IE: «и́геу». Три формы стоит проговорить подряд: IGŁA, IGLE, IGIEŁ." }
  - { kind: false-friend, text: "Значение совпадает с русской «иглой» полностью, и слова действительно родственны: праславянское *jьgъla дало и то, и другое. Ловушка только в чтении, разобранном выше, и во вставной гласной родительного множественного, которой русский не ожидает: IGIEŁ, а не «IGŁ». Уменьшительное IGIEŁKA строится от той же основы со вставкой. Русская «иголка» тоже имеет вставку, но в другом месте, и потому подсказкой не служит." }
  - { kind: usage, text: "Устойчивые выражения стоит выучить, они частотны: SZUKAĆ IGŁY W STOGU SIANA «искать иглу в стоге сена», полный аналог русского, и IGŁA DO SZYCIA «швейная игла», IGŁA JEDNORAZOWA «одноразовая игла». В медицине слово обязательно: WKŁUĆ IGŁĘ «ввести иглу». В ботанике иглы хвойных деревьев — IGŁY или IGLIWIE, и последнее означает опавшую хвою как материал. Прилагательное IGLASTY значит «хвойный»: LAS IGLASTY «хвойный лес», и это слово для русского неожиданно, потому что по корню связано с иглой, а не с хвоей." }
  - { kind: government, text: "Женский род на -A, склонение правильное. Винительный на -Ę: WKŁUĆ IGŁĘ. Назначение вводится предлогом DO с родительным: IGŁA DO SZYCIA, IGŁY DO MASZYNY. Вдевать нитку — WDZIEWAĆ NITKĘ W IGŁĘ, с предлогом W и винительным. При отрицании винительный уходит в родительный: NIE MA IGŁY. Родительный множественного IGIEŁ требуется после числительных выше четырёх: PIĘĆ IGIEŁ." }
collocations:
  - { pl: "igła do szycia", ru: "швейная игла" }
