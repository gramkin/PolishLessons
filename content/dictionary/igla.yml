etymology: "Из праславянского *jьgъla, и русская «игла» — то же слово. Корень, по-видимому, связан с индоевропейским названием острия, и родственники есть в литовском YLA «шило». Польский сохранил Ł на месте старого твёрдого Л, и потому слово звучит «и́гуа», а русский держит «л». Вставная гласная в родительном множественного, IGIEŁ, появилась по общему польскому правилу: когда окончание исчезает, скопление GŁ на конце слова разбивается гласной, как в DESKA и DESEK, CZAPKA и CZAPEK. Производное IGLASTY «хвойный» показывает, что для поляка хвоя есть прежде всего иглы, и русское «хвойный» от «хвоя» такой связи не даёт."
memory: "То же слово, что русская «игла», но читается «и́гуа»: ł даёт «у». Три формы подряд: igła, igle (ł переходит в мягкое l), igieł (вставная гласная в родительном множественного). Хвойный лес — las iglasty, от иглы, а не от хвои. Идиома szukać igły w stogu siana переводится дословно."
idioms:
  - { pl: "szukać igły w stogu siana", ru: "искать иглу в стоге сена" }
  - { pl: "las iglasty", ru: "хвойный лес" }
