senses:
  - id: strict
    ru: "строгий (о диете, правилах)"
    examples:
      - pl: "Doktor zalecił jej przejście na ścisłą dietę."
        ru: "Врач предписал ей перейти на строгую диету."
        source: { kind: translated, id: 1461440 }
      - pl: "To ważne przestrzegać ścisłej diety."
        ru: "Важно соблюдать строгую диету."
        source: { kind: translated, id: 7890980 }
