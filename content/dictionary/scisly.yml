        ru: "Том на строгой веганской диете."
        source: { kind: translated, id: 11730963 }
  - id: exact
    ru: "точный; тесный"
    examples:
      - pl: "To niezupełnie ścisłe."
        ru: "Это не совсем точно."
        source: { kind: translated, id: 351333 }
      - pl: "Nauki ścisłe są nomotetyczne, a humanistyczne - idiograficzne."
        ru: "Точные науки номотетичны, а гуманитарные — идиографичны."
        source: { kind: translated, id: 833033 }
notes:
  - { kind: usage, text: "nauki ścisłe «точные науки» — устойчивый термин: математика, физика, химия." }
  - { kind: usage, text: "Три типичных сочетания: ścisła dieta «строгая диета», ścisły związek «тесная связь», ścisła tajemnica «строгая тайна»." }
  - { kind: false-friend, text: "Корень ścisnąć «сжать» — ср. русское «стиснуть», «тесный». Сжатое и есть точное." }
  - { kind: government, text: "Обычное прилагательное; наречие — ściśle «строго, точно»." }
collocations:
  - { pl: "nauki ścisłe", ru: "точные науки" }
  - { pl: "ścisła dieta", ru: "строгая диета" }
etymology: "От ścisnąć «сжать», тот же корень, что в русском «стиснуть», «тесный»."
memory: "ścisły — «точный» и «строгий» сразу: сжатое и есть точное (ścisnąć «стиснуть»). Запомните nauki ścisłe «точные науки»."
