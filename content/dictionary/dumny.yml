# review
id: dumny
format: 2
lemma: "dumny"
rank: 870
pos: adj
pron: { cyr: "ду́мны" }
senses:
  - id: proud-of
    ru: "dumny Z kogoś, czegoś — гордящийся кем-л., чем-л."
    note: "Управление через z с родительным, а не через творительный, как в русском."
    examples:
      - pl: "Jestem dumny z brata."
        ru: "Я горжусь своим братом."
        source: { kind: tatoeba, id: 846248 }
      - pl: "Tom jest dumny z Mary."
        ru: "Том гордится Мэри."
        source: { kind: tatoeba, id: 3696478 }
      - pl: "Są dumni ze swego mostu."
        ru: "Они гордятся своим мостом."
        source: { kind: tatoeba, id: 766185 }
  - id: she
    ru: "dumna — гордая, гордится"
    examples:
      - pl: "Jest dumna z siebie."
        ru: "Она гордится собой."
        source: { kind: translated, id: 10586664 }
      - pl: "Jest dumna ze swego syna."
        ru: "Она гордится своим сыном."
        source: { kind: translated, id: 364872 }
      - pl: "Nie ma drugiej tak dumnej kobiety jak ona."
        ru: "Нет другой такой гордой женщины, как она."
        source: { kind: translated, id: 415246 }
  - id: haughty
    ru: "гордый, горделивый (о нраве, осанке)"
    examples:
      - pl: "Trzeba przedstawiać historię w szkolę tak, aby dzieci były dumne ze swojej przeszłości."
        ru: "Надо преподавать историю в школе так, чтобы дети гордились своим прошлым."
        source: { kind: tatoeba, id: 10115728 }
      - pl: "Bostońskie gołębie są tłuste i dumne."
        ru: "Бостонские голуби толстые и важные."
        source: { kind: translated, id: 1611376 }
      - pl: "Szedł dumny jak paw."
        ru: "Он шёл гордый как павлин."
        source: { kind: authored }
notes:
  - { kind: government, text: "Главное отличие от русского: dumny Z czegoś — предлог z и родительный падеж. Jestem dumny z brata «Я горжусь братом», где русский требует творительного без предлога. Ошибка «dumny bratem» выдаёт иностранца сразу." }
  - { kind: usage, text: "Существительное — duma «гордость», наречие — dumnie «гордо». Глагола «гордиться» как такового нет: говорят być dumnym z czegoś." }
  - { kind: usage, text: "Степень сравнения образуется аналитически: bardziej dumny, najbardziej dumny. Формы dumniejszy в живой речи не встречаются." }
  - { kind: usage, text: "Устойчивое сравнение — dumny jak paw «гордый как павлин», ровно как в русском." }
collocations:
  - { pl: "dumny z syna", ru: "гордящийся сыном" }
  - { pl: "być dumnym", ru: "гордиться" }
  - { pl: "duma", ru: "гордость" }
  - { pl: "dumny jak paw", ru: "гордый как павлин" }
family:
  - { pl: "duma", ru: "гордость", relation: root }
  - { pl: "dumnie", ru: "гордо", relation: derived }
etymology: "От duma «гордость», праславянское *duma. В русском «дума» пошла по другому пути — «мысль, совет», — а в польском осталась «гордость»."
memory: "dumny — «гордый», но управление другое: dumny Z czegoś, с предлогом z и родительным. Jestem dumny z brata «Я горжусь братом» — русский творительный тут не работает. Существительное duma значит «гордость», а не «дума»: это ложный друг."
idioms:
  - { pl: "dumny jak paw", ru: "гордый как павлин" }
  - { pl: "być dumnym z", ru: "гордиться" }
  - { pl: "duma narodowa", ru: "национальная гордость" }
