notes:
  - { kind: usage, text: "В названиях пишется с прописной: Ocean Spokojny «Тихий океан», Ocean Atlantycki «Атлантический океан». Обратите внимание, что польский зовёт Тихий океан «спокойным»." }
  - { kind: usage, text: "Рядом с карточкой morze «море»: morze меньше и ближе, ocean — мировой." }
  - { kind: usage, text: "Оборот kropla w oceanie — «капля в море», по-польски «капля в океане»." }
collocations:
  - { pl: "Ocean Spokojny", ru: "Тихий океан" }
  - { pl: "w oceanie", ru: "в океане" }
  - { pl: "dno oceanu", ru: "дно океана" }
etymology: "Из латинского oceanus, от греческого Ὠκεανός — имени божества мирового потока. Русское «океан» пришло тем же путём, поэтому слова совпадают почти полностью."
memory: "ocean — «океан». Запомните название: Ocean Spokojny — это Тихий океан, по-польски «спокойный». И kropla w oceanie — «капля в море»."
idioms:
