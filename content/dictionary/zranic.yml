# review
id: zranic
format: 2
lemma: "zranić"
rank: 1750
pos: verb
aspect: perf
pron: { cyr: "зра́ниць" }
senses:
  - id: wound
    ru: "ранить, поранить (физически)"
    examples:
      - pl: "Zranił się w lewą rękę."
        ru: "Он поранил левую руку."
        source: { kind: translated, id: 6154860 }
      - pl: "Wczoraj zranił się nożem."
        ru: "Вчера он поранился ножом."
        source: { kind: translated, id: 936193 }
      - pl: "Zraniłam się w stopę."
        ru: "Я поранила ногу."
        source: { kind: translated, id: 12188917 }
  - id: hurt-feelings
    ru: "ранить, обидеть (чувства)"
    examples:
      - pl: "Tom zranił uczucia Mary."
        ru: "Том ранил чувства Мэри."
        source: { kind: translated, id: 3933791 }
      - pl: "Tom już nigdy nikogo nie zrani."
        ru: "Том никогда больше никого не обидит."
        source: { kind: tatoeba, id: 6602321 }
      - pl: "Jego słowa zraniły moje uczucia."
        ru: "Его слова ранили мои чувства."
        source: { kind: translated, id: 404018 }
notes:
  - { kind: usage, text: "Совершенный вид; несовершенный — ranić. Возвратное zranić się значит «пораниться»: zranił się w rękę." }
  - { kind: government, text: "Ранить во что-то — zranić się w coś (винительный падеж): zraniłem się w stopę «я поранил ногу»." }
  - { kind: false-friend, text: "Слово одинаково работает и про тело, и про чувства, как русское «ранить»: zranić uczucia «ранить чувства»." }
  - { kind: usage, text: "Причастие zraniony значит и «раненый», и «обиженный»: ona czuje się zraniona «она чувствует себя обиженной»." }
collocations:
  - { pl: "zranić uczucia", ru: "ранить чувства" }
  - { pl: "zranić się w rękę", ru: "поранить руку" }
  - { pl: "zostać zranionym", ru: "быть раненым" }
family:
  - { pl: "ranić", ru: "ранить", relation: root }
  - { pl: "rana", ru: "рана", relation: root, id: rana }
  - { pl: "skrzywdzić", ru: "обидеть, причинить вред", relation: root, id: skrzywdzic }
etymology: "Приставка z- плюс ranić «ранить», от rana «рана» — то же слово, что русское «ранить»."
memory: "zranić — «ранить», и про тело, и про чувства: zranił się w rękę «поранил руку», zranił uczucia «ранил чувства». Несовершенный вид — ranić."
idioms:
  - { pl: "zranić uczucia", ru: "ранить чувства" }
  - { pl: "zranić się w rękę", ru: "поранить руку" }
  - { pl: "czuć się zranionym", ru: "чувствовать себя обиженным" }
