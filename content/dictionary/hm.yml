# review
id: hm
format: 2
lemma: "hm"
rank: 1216
pos: interj
pron: { cyr: "хм" }
senses:
  - id: thinking
    ru: "хм — раздумье, пауза перед ответом"
    examples:
      - pl: "Hm, tak, tutejsza podłoga jest zrobiona z podłogi."
        ru: "Хм, да, пол здесь сделан из пола."
        source: { kind: tatoeba, id: 11154774 }
      - pl: "Hm, ja chyba zostanę w domu."
        ru: "Хм, я, пожалуй, останусь дома."
        source: { kind: translated, id: 368023 }
      - pl: "Hm, czy jest spokojny pokój?"
        ru: "Хм, а есть тихий номер?"
        source: { kind: translated, id: 8176854 }
  - id: hesitation
    ru: "неуверенность: хм, не знаю"
    examples:
      - pl: "Hm, nie jestem pewien."
        ru: "Хм, я не уверен."
        source: { kind: authored }
      - pl: "Hm, muszę się zastanowić."
        ru: "Хм, мне нужно подумать."
        source: { kind: authored }
      - pl: "Hm, to ciekawe pytanie."
        ru: "Хм, это интересный вопрос."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Междометие раздумья, ровно как русское «хм». Стоит в начале реплики и отделяется запятой: Hm, ja chyba zostanę w domu." }
  - { kind: pronunciation, text: "Слогообразующее m: звучит как протяжное «хмм», без гласного." }
  - { kind: register, text: "Нейтрально и в речи, и в переписке. Более выразительные соседи — no «ну» и cóż «что ж»." }
  - { kind: usage, text: "В польском обычно пишут одно m — hm, хотя встречается и hmm." }
collocations:
  - { pl: "hm, nie wiem", ru: "хм, не знаю" }
  - { pl: "hm, może", ru: "хм, может быть" }
  - { pl: "hm, zobaczmy", ru: "хм, посмотрим" }
etymology: "Звукоподражание, а не заимствование: то же междометие независимо возникло и в русском «хм», и в английском hmm."
memory: "hm — «хм», междометие раздумья. Стоит в начале реплики и отделяется запятой: Hm, ja chyba zostanę w domu «Хм, я, пожалуй, останусь дома»."
