  - { pl: "nadziemny", ru: "надземный", relation: derived }
etymology: "Сложение из приставки POD- и ZIEMIA, слова праславянского и того же, что русская «земля». Постройка прозрачна в обоих языках и совпадает целиком. Из того же гнезда идут ZIEMNY «земляной» и NADZIEMNY «надземный». А вот существительное PODZIEMIE пошло своим путём и стало значить «подполье», в том числе политическое, тогда как русская «подземка» ушла в сторону метро."
memory: "Подземный, собрано как русское слово: pod плюс ziemia. Главное — przejscie podziemne «подземный переход» и garaz podziemny «подземный паркинг», второе встречается в каждом объявлении о квартире. Читается «подзе́мны», где dzi даёт мягкое «дзь». В гнезде осторожно: podziemie это «подполье», а наша «подземка», то есть метро, по-польски просто metro."
idioms:
  - { pl: "przejście podziemne", ru: "подземный переход" }
formExamplesSkip:
