notes:
  - { kind: false-friend, text: "Прилагательное отвечает русскому «подземный» точно, но существительное того же гнезда переводится иначе, чем кажется. PODZIEMIE это «подполье» — и подвал, и политическое подполье, как в ARMIA PODZIEMNA. А наша «подземка», то есть метро, по-польски просто METRO, и сказать KOLEJ PODZIEMNA о варшавском метро нельзя: так не говорят." }
  - { kind: usage, text: "В таблице одиннадцать форм, но живых десять. Одиннадцатая — PODZIEMNI, именительный множественного для мужчин-людей, и её не употребляют: прилагательное относительное, оно описывает переход, воду или гараж, а не человека. Подпольщиков называют ŻOŁNIERZE PODZIEMIA или KONSPIRATORZY, существительными. Примеров к этой форме в карточке поэтому нет." }
  - { kind: government, text: "В подземном переходе — W PRZEJŚCIU PODZIEMNYM, местный падеж, и обратите внимание, что PRZEJŚCIE даёт PRZEJŚCIU. Без подземного гаража — BEZ GARAŻU PODZIEMNEGO, предлог BEZ с родительным. Прилагательное стоит после существительного и порядок закреплён: PRZEJŚCIE PODZIEMNE, GARAŻ PODZIEMNY, WODY PODZIEMNE." }
  - { kind: pronunciation, text: "Читается «подзе́мны», три слога, ударение на предпоседнем. Сочетание DZI даёт мягкое «дзь», которое вместе с последующей E звучит как «дзе»: «по-дзе-мны». Это не «подзи» и не «подзе» с твёрдым «з». Конечная Y даёт «ы». В женском роде PODZIEMNA это «подзе́мна», в среднем PODZIEMNE — «подзе́мнэ»." }
  - { kind: register, text: "Слово нейтральное и городское. В городе это PRZEJŚCIE PODZIEMNE «подземный переход» и GARAŻ PODZIEMNY «подземный паркинг», в объявлениях о жилье второе встречается постоянно. В географии — WODY PODZIEMNE и RZEKA PODZIEMNA. В истории — ARMIA PODZIEMNA и PAŃSTWO PODZIEMNE о польском подполье военных лет, и это выражения, которые знает каждый." }
