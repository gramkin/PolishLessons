# review
id: wkurzyc
format: 2
lemma: "wkurzyć"
rank: 1796
pos: verb
aspect: perf
pron: { cyr: "фку́жыць" }
senses:
  - id: annoy
    ru: "разозлить, взбесить"
    examples:
      - pl: "Tom mnie wkurzył."
        ru: "Том меня разозлил."
        source: { kind: translated, id: 4151820 }
      - pl: "Ona wkurzyła nas swoimi uwagami."
        ru: "Она разозлила нас своими замечаниями."
        source: { kind: translated, id: 7493689 }
      - pl: "Coś wkurzyło Toma."
        ru: "Что-то разозлило Тома."
        source: { kind: translated, id: 2289974 }
  - id: get-angry
    ru: "wkurzyć się — разозлиться, взбеситься"
    examples:
      - pl: "Wkurzył się."
        ru: "Он разозлился."
        source: { kind: translated, id: 6309248 }
      - pl: "W tym momencie się wkurzyła."
        ru: "В этот момент она разозлилась."
        source: { kind: translated, id: 479903 }
      - pl: "Wkurzył się i wyszedł."
        ru: "Он разозлился и вышел."
        source: { kind: translated, id: 440585 }
notes:
  - { kind: register, text: "Слово разговорное и довольно резкое, но не бранное: примерно как русское «взбесить, разозлить». В нейтральной речи лучше сказать zdenerwować." }
  - { kind: government, text: "Разозлиться на кого-то — wkurzyć się na kogoś (винительный с na): wkurzył się na mnie." }
  - { kind: usage, text: "Причастие wkurzony значит «злой, раздражённый»: jestem wkurzony «я злой». Это самая частая форма слова." }
  - { kind: false-friend, text: "Есть и более грубый вариант того же корня, которого стоит избегать; wkurzyć — его смягчённая, допустимая в обычном разговоре форма." }
collocations:
  - { pl: "wkurzyć się na kogoś", ru: "разозлиться на кого-либо" }
  - { pl: "jestem wkurzony", ru: "я злой" }
  - { pl: "wkurzyć kogoś", ru: "разозлить кого-либо" }
family:
  - { pl: "wkurzony", ru: "злой, раздражённый", relation: root }
  - { pl: "zdenerwować", ru: "разозлить", relation: root, id: zdenerwowac }
  - { pl: "zły", ru: "злой", relation: root, id: zly }
etymology: "Приставка w- плюс kurzyć «пылить, дымить»: буквально «довести до дыма». Русское «взбесить» построено от «бес» — образ другой, смысл тот же."
memory: "wkurzyć — разговорное «разозлить, взбесить»; возвратное wkurzyć się — «разозлиться». На кого — na kogoś. Нейтральный вариант — zdenerwować."
idioms:
  - { pl: "wkurzyć się na kogoś", ru: "разозлиться на кого-либо" }
  - { pl: "jestem wkurzony", ru: "я злой" }
  - { pl: "wkurzony do granic", ru: "злой до предела" }
