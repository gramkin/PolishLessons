notes:
  - { kind: usage, text: "Из английского baronet, от baron с уменьшительным суффиксом -et. Русское «баронет» — то же заимствование." }
  - { kind: usage, text: "Слово мужского лично-мужского рода, поэтому во множественном именительном — baroneci." }
  - { kind: usage, text: "К баронету обращаются sir с именем: sir Henryk. Титул наследственный, но в палату лордов не даёт входа." }
  - { kind: usage, text: "Примеров в корпусе Tatoeba нет: все предложения здесь составлены вручную и ждут проверки." }
