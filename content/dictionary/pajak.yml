notes:
  - { kind: false-friend, text: "Русский «паук» и польское pająk — одно слово: носовое ą отвечает русскому у, как в dąb/дуб." }
  - { kind: government, text: "Мужской ЖИВОТНЫЙ род: винительный совпадает с родительным — widzę pająka «вижу паука». Родительный мн. — pająków." }
  - { kind: usage, text: "Паутина — pajęczyna, с чередованием ą/ę. Pajęczyna jest potrzebna pająkom «паутина нужна паукам»." }
  - { kind: usage, text: "Боязнь пауков — arachnofobia; в корпусе слово очень частотно." }
collocations:
  - { pl: "sieć pająka", ru: "паутина" }
  - { pl: "bać się pająków", ru: "бояться пауков" }
etymology: "Праславянское *pajǫkъ; русский «паук» — то же слово, носовое ą отвечает русскому у."
memory: "pająk — «паук», читается «па́йонк». Род животный: widzę pająka. Паутина — pajęczyna, с чередованием ą/ę."
