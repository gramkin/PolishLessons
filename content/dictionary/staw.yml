etymology: "От праславянского корня STAV-, того же, что в STAWIAĆ «ставить» и в русских «ставить», «став», «сустав». Образ один для обоих значений: поставленное, устроенное. Пруд это поставленная запрудой вода, сустав это поставленные друг к другу кости. Русский для воды взял «пруд», от «прудить», а старое «ставок» оставил говорам и украинскому, зато в «суставе» корень сохранил полностью."
memory: "Второе значение узнаётся через русское слово: «сустав» это су- плюс -став, тот же корень. Поэтому staw это и «пруд», и «сустав»: в основе образ поставленного, устроенного. Русский «ставок» в значении пруда живёт в говорах и в украинском. Различает значения определение: staw rybny против staw kolanowy. Читается «стаф», с оглушением конечного w. Боль в суставах: ból stawów, родительный без предлога."
idioms:
  - { pl: "zapalenie stawów", ru: "воспаление суставов" }
