notes:
  - { kind: false-friend, text: "Второе значение русскому кажется чужим, а на самом деле оно у нас перед глазами: «сустав» это СУ- плюс -СТАВ, и корень в нём тот же. STAW значит и «пруд», и «сустав», потому что в основе лежит образ поставленного, устроенного: вода, поставленная запрудой, и косточки, поставленные друг к другу. Русский «ставок» в значении пруда сохранился в южных говорах и в украинском." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. В местном падеже STAWIE, с обычным смягчением. Оба значения живут в одном слове и путаницы не создают, потому что их разводит определение: STAW RYBNY это пруд, STAW KOLANOWY — коленный сустав. Множественное STAWY в медицинском смысле употребляют почти всегда: BOLĄ MNIE STAWY «у меня болят суставы»." }
  - { kind: government, text: "Над прудом — предлог NAD с творительным: NAD STAWEM. В пруду — W STAWIE, предлог W с местным падежом. Боль в суставах — BÓL STAWÓW, родительный без предлога, тогда как русский вставляет предлог «в». Это общее для польского правило при названиях боли: BÓL GŁOWY, BÓL ZĘBÓW, BÓL STAWÓW, всюду родительный." }
  - { kind: pronunciation, text: "Читается «стаф», один слог. Конечное W оглушается до «ф», и слово звучит коротко и твёрдо. В косвенных падежах оглушения нет, потому что W оказывается перед гласной: STAWU звучит «ста́ву», STAWEM — «ста́вэм». В местном падеже STAWIE сочетание WIE даёт мягкое «ве»: «ста́ве»." }
  - { kind: register, text: "В значении пруда слово деревенское и повседневное: STAW RYBNY, HODOWLA KARPI W STAWACH, и в Польше такие пруды встречаются в каждом втором селе. В медицинском значении оно звучит в каждом кабинете: ZAPALENIE STAWÓW «воспаление суставов», STAW BIODROWY «тазобедренный сустав», ZWICHNĄĆ STAW. Оба употребления нейтральны." }
