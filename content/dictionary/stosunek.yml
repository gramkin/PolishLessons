# review
id: stosunek
format: 2
lemma: "stosunek"
rank: 1954
pos: noun
pron: { cyr: "стосу́нэк" }
senses:
  - id: attitude
    ru: "отношение (к кому-либо, к чему-либо)"
    examples:
      - pl: "On miał do mnie krytyczny stosunek."
        ru: "Он относился ко мне критически."
        source: { kind: translated, id: 529050 }
      - pl: "Chcę, żebyś poprawił swój stosunek do pracy."
        ru: "Я хочу, чтобы ты изменил своё отношение к работе."
        source: { kind: translated, id: 13560291 }
      - pl: "On ma najbardziej lekceważący stosunek do kobiet, jaki kiedykolwiek widziałem."
        ru: "У него самое пренебрежительное отношение к женщинам, какое я когда-либо видел."
        source: { kind: translated, id: 1165135 }
  - id: relations
    ru: "отношения (между людьми, странами)"
    examples:
      - pl: "Jesteśmy z nimi w dobrych stosunkach."
        ru: "Мы с ними в хороших отношениях."
        source: { kind: tatoeba, id: 5225012 }
      - pl: "Jest z nią w przyjacielskich stosunkach."
        ru: "Он с ней в дружеских отношениях."
        source: { kind: tatoeba, id: 368842 }
      - pl: "Są w dobrych stosunkach z sąsiadami."
        ru: "Они в хороших отношениях с соседями."
        source: { kind: translated, id: 352400 }
      - pl: "Mają dobre stosunki z sąsiadami."
        ru: "У них хорошие отношения с соседями."
        source: { kind: translated, id: 675507 }
      - pl: "Japonię i Chiny łączą stosunki dyplomatyczne."
        ru: "Японию и Китай связывают дипломатические отношения."
        source: { kind: translated, id: 718934 }
  - id: ratio
    ru: "соотношение; по отношению к"
    examples:
      - pl: "Zapewniamy stosunek jakości do ceny."
        ru: "Мы обеспечиваем соотношение цены и качества."
        source: { kind: translated, id: 6935773 }
      - pl: "Kurs jena wzrósł w stosunku do dolara."
        ru: "Курс иены вырос по отношению к доллару."
        source: { kind: translated, id: 361155 }
      - pl: "On jest bardzo przyjacielski w stosunku do mnie."
        ru: "Он очень дружелюбен по отношению ко мне."
        source: { kind: translated, id: 529549 }
notes:
  - { kind: usage, text: "Самая частая конструкция — w stosunku do «по отношению к»: kurs wzrósł w stosunku do dolara «курс вырос по отношению к доллару»." }
  - { kind: usage, text: "Во множественном числе stosunki значит «отношения» между людьми или странами: być w dobrych stosunkach «быть в хороших отношениях»." }
  - { kind: usage, text: "Ещё одно значение — «соотношение»: stosunek jakości do ceny «соотношение цены и качества»." }
  - { kind: register, text: "В медицинском и юридическом языке stosunek (płciowy) означает половой акт. В обычной речи это значение само по себе не всплывает, но знать о нём стоит." }
collocations:
  - { pl: "w stosunku do", ru: "по отношению к" }
  - { pl: "dobre stosunki", ru: "хорошие отношения" }
  - { pl: "stosunek do pracy", ru: "отношение к работе" }
etymology: "Образовано от stosować się do «относиться к чему-либо, соотноситься с чем-либо». Русское «отношение» построено по той же модели — от глагола «относиться»."
memory: "stosunek — это «отношение» сразу во всех смыслах: stosunek do pracy «отношение к работе», dobre stosunki «хорошие отношения», w stosunku do «по отношению к»."
idioms:
  - { pl: "w stosunku do", ru: "по отношению к" }
  - { pl: "być w dobrych stosunkach", ru: "быть в хороших отношениях" }
  - { pl: "stosunek jakości do ceny", ru: "соотношение цены и качества" }
formExamplesSkip:
  - { form: "stosunku", cell: "Звательный", reason: "звательный падеж: для неодушевлённого существительного он практически не употребляется" }
