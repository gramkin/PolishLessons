# review
id: wbic
format: 2
lemma: "wbić"
rank: 3913
pos: verb
pron: { cyr: "вбиць" }
senses:
  - id: drive-in
    ru: "вбить, воткнуть"
    examples:
      - pl: "Wbił gwóźdź w ścianę."
        ru: "Он вбил гвоздь в стену."
        source: { kind: authored }
      - pl: "Wbiła łopatę w ziemię."
        ru: "Она воткнула лопату в землю."
        source: { kind: authored }
      - pl: "Wbij pal głęboko w ziemię."
        ru: "Вбей кол глубоко в землю."
        source: { kind: authored }
  - id: enter
    ru: "ввести (код, PIN); забить (гол) (разг.)"
    examples:
      - pl: "Wbij PIN i zatwierdź."
        ru: "Введи PIN и подтверди."
        source: { kind: authored }
      - pl: "Napastnik wbił dwa gole."
        ru: "Нападающий забил два гола."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "WBIĆ — «вбить», но в разговоре значение шире. WBIĆ KOD, WBIĆ PIN — «ввести код». WBIĆ GOLA — «забить гол». WBIĆ NA IMPREZĘ — сленг «завалиться на вечеринку». А WBIĆ SOBIE DO GŁOWY — «вбить себе в голову», совсем как по-русски. Убить — ZABIĆ, не WBIĆ." }
  - { kind: usage, text: "Пятьдесят три формы — подпись переходного глагола совершенного вида: страдательное WBITY, «вбитый», и деепричастие WBIWSZY. Спряжение как у BIĆ: WBIJĘ, WBIJESZ, WBIJĄ; повелительное WBIJ. Видовой партнёр — WBIJAĆ." }
  - { kind: government, text: "Что — винительный, во что — W с винительным: WBIĆ GWÓŹDŹ W DESKĘ, WBIĆ NÓŻ W PLECY. Кому — дательный: WBIĆ KOMUŚ DO GŁOWY, «вдолбить кому-то». Возвратное WBIĆ SIĘ — «втиснуться, впиться»: WBIĆ SIĘ W SPODNIE, KOLEC WBIŁ SIĘ W PALEC." }
  - { kind: pronunciation, text: "Читается «вбиць», один слог. W перед B звонкое «в», конечное Ć — «ць». WBIJĘ — «вби́е»: конечное Ę на конце слова звучит как «э». WBITY — «вби́ты»." }
  - { kind: register, text: "Прямое значение нейтрально. WBIĆ PIN, WBIĆ GOLA — разговорные и очень частые. WBIĆ KOMUŚ NÓŻ W PLECY — «вонзить нож в спину», то есть предать. WBIĆ NA IMPREZĘ — молодёжный сленг." }
collocations:
  - { pl: "wbić gwóźdź", ru: "вбить гвоздь" }
  - { pl: "wbić kod", ru: "ввести код" }
  - { pl: "wbić sobie do głowy", ru: "вбить себе в голову" }
family:
  - { pl: "wbijac", ru: "вбивать", relation: aspect }
  - { pl: "bic", ru: "бить", relation: root, id: bic }
  - { pl: "zabic", ru: "убить", relation: root, id: zabic }
etymology: "Приставка W- «в-» плюс BIĆ «бить», праславянское *biti, то же, что русское «бить». Польское WBIĆ и русское «вбить» совпадают полностью; польские разговорные значения «ввести код» и «забить гол» выросли из того же образа удара."
memory: "Wbić — вбить: wbić gwóźdź. В разговоре: wbić PIN — ввести код, wbić gola — забить гол. Wbić sobie do głowy — как по-русски. Убить — zabić! Читается «вбиць»."
idioms:
  - { pl: "wbić komuś nóż w plecy", ru: "вонзить кому-то нож в спину" }
