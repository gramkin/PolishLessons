etymology: "Приставка prze- и прилагательное długi «длинный, долгий», от праславянского *dьlgъ. Русское «долгий» — прямой родственник, и русский глагол «продлить» сложен из того же корня с приставкой про-, которая и есть соответствие польского prze-. Существительное dług «долг» восходит к другому праславянскому слову и к длине отношения не имеет — ровно так же, как в русском расходятся «долгий» и «долг»."
memory: "przedłużyć = prze- + długi, то же, что русское «продлить» = про- + длинный: приставки и корни отвечают друг другу. Продлевают вещь (винительный), а человеку (дательный): przedłużyć komuś wizę."
idioms:
  - { pl: "przedłużyć sobie życie", ru: "продлить себе жизнь" }
  - { pl: "przedłużenie alei", ru: "продолжение проспекта" }
formExamplesSkip:
  - { form: "przedłużeni", reason: "Страдательное причастие мужского лица от przedłużony. В винительном падеже при przedłużyć стоит всегда срок, документ или линия — umowa, wiza, termin, trasa, — а человек, которому что-то продлевают, стоит в дательном и в подлежащее не повышается. Продлевают не людей, поэтому подставить в мужсколичную форму нечего. Остальные формы причастия при этом обычны: termin przedłużony, umowa przedłużona." }
