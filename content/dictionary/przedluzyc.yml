notes:
  - { kind: government, text: "przedłużyć coś komuś: продлеваемое — в ВИНИТЕЛЬНОМ падеже, человек — в ДАТЕЛЬНОМ. Lekarz przedłużył mu zwolnienie «врач продлил ему больничный». Русское «продлить» управляет так же." }
  - { kind: government, text: "В винительном падеже стоит всегда срок, документ или линия — umowa, wiza, termin, trasa, — но не человек. Поэтому мужсколичное причастие przedłużeni остаётся без употребления: продлевают не людей, а то, что у них есть, и сам человек стоит в дательном. Прочие формы причастия обычны: termin przedłużony, umowa przedłużona." }
  - { kind: false-friend, text: "Корень тот же, что в русском «долгий»: польское długi значит «длинный, долгий». Русский строит глагол из того же материала — «продлить», про- + длить, — а польский берёт приставку prze-, родственную русскому про-. Но осторожно: польское dług «долг» — совсем другое слово, в точности как русские «долгий» и «долг» различаются между собой." }
  - { kind: usage, text: "Совершенный вид; несовершенный — przedłużać. Существительное przedłużenie значит и «продление», и «продолжение» в пространстве: ta ulica jest przedłużeniem alei «эта улица — продолжение проспекта»." }
collocations:
