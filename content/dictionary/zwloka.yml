notes:
  - { kind: false-friend, text: "Самое важное в этом слове — то, что во множественном числе его формы совпадают с формами совсем другого слова. ZWŁOKA значит промедление, отсрочку; ZWŁOKI, только во множественном, значит останки, труп. Поэтому SEKCJA ZWŁOK это вскрытие, а BEZ ZWŁOK W DOSTAWACH — «без задержек в поставках», и различает их исключительно смысл фразы. Русского соответствия у первого слова почти нет: ближе всего «проволочка», от того же корня, что и польское ZWŁOKA, — оба от идеи волочения, тянущегося времени. Во втором значении русский говорит «останки» или «тело»." }
  - { kind: usage, text: "Десять форм, женский род. Дательный и местный единственного — ZWŁOCE, с меной K в C перед окончанием -E; родительный множественного — ZWŁOK, с нулевым окончанием. Устойчивое BEZ ZWŁOKI значит «без промедления» и стоит в единственном числе, тогда как BEZ ZWŁOK — «без задержек» или, в другом смысле, «без тела». В юридическом языке слово требует предлога W с местным: ZWŁOKA W PŁATNOŚCI, ZWŁOKA W WYKONANIU UMOWY, и такая конструкция означает просрочку обязательства." }
  - { kind: pronunciation, text: "Читается «звуо́ка», три слога, ударение на втором. Буква Ł даёт «у» неслоговое, поэтому начало звучит «звуо», а не «звло» — та же ловушка, что в PŁOMIEŃ и WYPŁATA. В форме ZWŁOCE сочетание CE читается «це»: «звуо́це». В форме ZWŁOKĘ конечное Ę звучит как чистое «э». В форме ZWŁOK конечное K глухое, а ударение переходит на первый слог: «зву́ок»." }
  - { kind: register, text: "В значении промедления слово книжное и юридическое: в разговоре скорее скажут OPÓŹNIENIE. Устойчивые сочетания: BEZ ZWŁOKI «безотлагательно», ODSETKI ZA ZWŁOKĘ «пени за просрочку», ZWŁOKA W PŁATNOŚCI. В значении останков слово принадлежит языку протокола и медицины: SEKCJA ZWŁOK «вскрытие», IDENTYFIKACJA ZWŁOK. В бытовой речи о умершем скажут CIAŁO, а ZWŁOKI звучит отчуждённо и официально, примерно как русское «труп» в милицейском протоколе." }
