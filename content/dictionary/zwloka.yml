etymology: "От глагола ZWLEKAĆ «медлить, затягивать», а тот — от WLEC «волочить», праславянское *vlěkti, то же, что русское «волочить» и «влечь». Образ прямой: медлить значит волочить время. Русский построил от того же корня «проволочку», и это ближайшее соответствие польскому слову. Второе значение, останки, идёт от того же гнезда, но от другой приставочной формы, ZWLEC «стащить, снять»: так назвали то, с чего жизнь стащена, как с человека снимают одежду. Объяснение это старое и, вероятно, верное, хотя словари отмечают его с осторожностью. Так одно гнездо дало слова о времени и о смерти."
memory: "Два слова в одной парадигме: zwłoka в единственном значит промедление, а zwłoki только во множественном — останки. Отсюда sekcja zwłok «вскрытие» против bez zwłok w dostawach «без задержек». Корень общий с русским «волочить» и «влечь», и ближайшее соответствие первого значения — «проволочка»: медлить значит волочить время. Звук: ł это «у», слово звучит «звуо́ка». Падежи: zwłoce с меной k→c, zwłok с нулевым окончанием."
