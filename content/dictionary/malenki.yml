notes:
  - { kind: false-friend, text: "Ловушка для русского: MALEŃKI звучит как «маленький», но это не нейтральное слово, а уменьшительно-ласкательное, «крохотный, малюсенький». Обычное русское «маленький» по-польски MAŁY: MAŁY POKÓJ, MAŁE DZIECKO. Скажете MALEŃKI POKÓJ — прозвучит умилённо или с иронией: «комнатушечка»." }
  - { kind: usage, text: "Степеней сравнения нет: слово уже уменьшительное. Все одиннадцать форм живые. Форма для мужчин-людей MALEŃCY нужна о маленьких мальчиках или в шутку: MALEŃCY CHŁOPCY, NASI MALEŃCY BOHATEROWIE. Чередование: K перед мужским-личным -I превращается в C: MALEŃKI, но MALEŃCY." }
  - { kind: government, text: "Ставится перед существительным: MALEŃKI DOMEK, MALEŃKA RĄCZKA. Часто сочетается с уменьшительными существительными: MALEŃKI KOTEK, MALEŃKA DZIEWCZYNKA, и двойная ласка тут естественна. Падежных требований нет." }
  - { kind: pronunciation, text: "Читается «мале́ньки», три слога, ударение на предпоследнем. Ń — мягкое «нь», KI — мягкое «ки». В форме MALEŃCY: «мале́ньцы». Звучит почти как русское «маленький», только без последнего «й»." }
  - { kind: register, text: "Тёплое, разговорное, детское слово. Его говорят о младенцах, котятах, цветочках. В деловом тексте неуместно. Ещё более ласковые ступени — MALUSIEŃKI и MACIUPEŃKI, обе тоже из речи взрослых, обращённой к детям." }
collocations:
  - { pl: "maleńkie dziecko", ru: "крохотный ребёнок, младенец" }
  - { pl: "maleńka prośba", ru: "малюсенькая просьба" }
