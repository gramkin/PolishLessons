etymology: "От MAŁY «маленький» с ласкательным суффиксом -EŃKI, тем же, что в русском «-енький»: «маленький», «беленький». Польский суффикс менее продуктивен, чем русский: от MAŁY он дал MALEŃKI, а от большинства прилагательных польский предпочитает -UTKI: CICHUTKI, MALUTKI."
memory: "Maleńki — крохотный, малюсенький, ласково. Обычное «маленький» — mały! Maleńkie dziecko — младенец. Читается «мале́ньки». Мн. ч. для мужчин — maleńcy."
idioms:
  - { pl: "maleńka prośba", ru: "малюсенькая просьба, пустяковое одолжение" }
