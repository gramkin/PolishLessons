# review
id: sezon
format: 2
lemma: "sezon"
rank: 1837
pos: noun
pron: { cyr: "сэ́зон" }
senses:
  - id: season-time
    ru: "сезон (пора чего-либо)"
    examples:
      - pl: "Teraz jest sezon na grzyby."
        ru: "Сейчас грибной сезон."
        source: { kind: tatoeba, id: 12721022 }
      - pl: "Teraz jest sezon na truskawki."
        ru: "Сейчас сезон клубники."
        source: { kind: translated, id: 440628 }
      - pl: "Sezon narciarski minął"
        ru: "Лыжный сезон прошёл."
        source: { kind: translated, id: 1453195 }
  - id: season-series
    ru: "сезон (спортивный, сериала)"
    examples:
      - pl: "Nasza drużyna wygrała ligę w tym sezonie."
        ru: "Наша команда выиграла лигу в этом сезоне."
        source: { kind: translated, id: 731946 }
      - pl: "Ostatnio zacząłem oglądać 5 sezon tego serialu."
        ru: "Недавно я начал смотреть пятый сезон этого сериала."
        source: { kind: translated, id: 6154933 }
      - pl: "Jaki jest twój ulubiony epizod z sezonu drugiego?"
        ru: "Какая твоя любимая серия из второго сезона?"
        source: { kind: translated, id: 1351761 }
notes:
  - { kind: government, text: "В сезоне — w sezonie (предложный падеж); вне сезона — poza sezonem (творительный): poza sezonem miejsca w hotelach są tańsze." }
  - { kind: usage, text: "sezon ogórkowy — буквально «огуречный сезон», то есть мёртвый сезон в новостях, летнее затишье. Русский называет это «сезоном отпусков»." }
  - { kind: usage, text: "martwy sezon — «мёртвый сезон»; szczyt sezonu — «разгар сезона»." }
  - { kind: false-friend, text: "Слово покрывает и пору года, и спортивный сезон, и сезон сериала — ровно как русское «сезон»." }
collocations:
  - { pl: "w sezonie", ru: "в сезоне" }
  - { pl: "poza sezonem", ru: "вне сезона" }
  - { pl: "sezon turystyczny", ru: "туристический сезон" }
family:
  - { pl: "sezonowy", ru: "сезонный", relation: root }
  - { pl: "rok", ru: "год", relation: root, id: rok }
etymology: "Из французского saison через немецкий; русское «сезон» пришло тем же путём. Значения совпадают полностью."
memory: "sezon — «сезон»: и пора года, и спортивный сезон, и сезон сериала. В сезоне — w sezonie, вне сезона — poza sezonem."
idioms:
  - { pl: "sezon ogórkowy", ru: "мёртвый сезон в новостях" }
  - { pl: "poza sezonem", ru: "вне сезона" }
  - { pl: "szczyt sezonu", ru: "разгар сезона" }
