etymology: "Из французского saison через немецкий; русское «сезон» пришло тем же путём. Значения совпадают полностью."
memory: "sezon — «сезон»: и пора года, и спортивный сезон, и сезон сериала. В сезоне — w sezonie, вне сезона — poza sezonem."
