notes:
  - { kind: usage, text: "Это слово принадлежит к типу на -IA, и у него есть особенность, которой в русском нет. Родительный, дательный и местный единственного — CEREMONII, с двойным I, и та же форма служит родительным множественного. Но рядом с ней существует старая форма родительного множественного на -IJ: CEREMONIJ. В современных текстах она звучит книжно или архаично, однако встречается, и в документах девятнадцатого века она была нормой. То же у всех слов этого типа: FANTAZJA даёт FANTAZYJ, KOLEKCJA — KOLEKCYJ, DEPRESJA — DEPRESYJ. Иначе говоря, у таких существительных два родительных множественного, современный и старый, и различать их полезно при чтении старых книг." }
  - { kind: false-friend, text: "Значение совпадает с русским полностью: CEREMONIA это «церемония», оба слова из латинского CAERIMONIA. Расходится написание, и расхождение регулярное. Польский передаёт латинское CAE через CE и читает его как «цэ»; русский передал то же сочетание через «це». Дальше польский пишет -IA там, где русский пишет -ИЯ, и это общее правило для целого разряда слов: CEREMONIA и «церемония», HISTORIA и «история», LINIA и «линия». Зная его, можно переносить в польский почти любое русское слово на -ИЯ, заменив окончание на -IA, и ошибка будет редкой." }
  - { kind: government, text: "Женский род. Чего церемония — родительный: CEREMONIA OTWARCIA «церемония открытия», CEREMONIA ZAMKNIĘCIA, CEREMONIA ŚLUBNA через прилагательное. Частотные глаголы: ODPRAWIĆ CEREMONIĘ «провести церемонию», PROWADZIĆ CEREMONIĘ «вести церемонию», PRZENIEŚĆ CEREMONIĘ «перенести церемонию». Устойчивое BEZ CEREMONII значит «без церемоний, без обиняков», и употребляется так же, как по-русски: POWIEDZIAŁ BEZ CEREMONII. Прилагательное CEREMONIALNY «церемониальный», а CEREMONIAŁ — «церемониал, протокол»." }
  - { kind: pronunciation, text: "Читается «цэрэмо́ня», четыре слога, ударение на предпоследнем. Буква C перед E даёт «ц», а само E — «э», поэтому начало слова звучит «цэрэ», а не «цере». Конечное -IA произносится как «я», одним слогом, сливаясь с предшествующим N в мягкое «ня». В родительном CEREMONII двойное I читается как долгое «и»: «цэрэмо́ни». В старой форме родительного множественного CEREMONIJ конечное J даёт «й»: «цэрэмо́ний»." }
