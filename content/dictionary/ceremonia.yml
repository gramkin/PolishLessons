etymology: "Из латинского CAERIMONIA «священный обряд, культовое действие», слова неясного происхождения уже для самих римлян; античные авторы связывали его с этрусским городом Caere, но надёжного подтверждения этому нет. В европейские языки слово вошло через церковную и придворную латынь, и оба наших языка взяли его из одного источника, поэтому значения совпадают без остатка. Польское написание сохраняет латинское -IA, русское передаёт его как -ИЯ, и это соответствие работает для всего разряда: HISTORIA и «история», LINIA и «линия», ARMIA и «армия». Старый родительный множественного на -IJ, CEREMONIJ, отражает более раннее состояние польской орфографии, когда окончание писалось и произносилось полнее; он сохранился в текстах и в поэзии, а в современной норме уступил место форме CEREMONII."
memory: "Полное совпадение значений, и за ним правило: польское -ia равно русскому -ия — ceremonia, historia, linia, armia. Читается «цэрэмо́ня»: c перед e даёт «ц», e даёт «э». Родительный, дательный и местный единственного — одна форма ceremonii, и она же родительный множественного. Рядом с ней живёт старая форма ceremonij, как fantazyj и kolekcyj: у слов этого типа два родительных множественного, современный и архаичный. Bez ceremonii — «без церемоний»."
