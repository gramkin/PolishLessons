# review
id: sekunda
format: 2
lemma: "sekunda"
rank: 673
pos: noun
pron: { cyr: "сэку́нда" }
senses:
  - id: second
    ru: "секунда"
    note: "После 2–4 именительный (trzy sekundy), после 5 и больше родительный (pięć sekund)."
    examples:
      - pl: "To zajmie pięć sekund."
        ru: "Это займёт пять секунд."
        source: { kind: tatoeba, id: 11268995 }
      - pl: "Masz trzydzieści sekund."
        ru: "У тебя тридцать секунд."
        source: { kind: translated, id: 11581569 }
      - pl: "Masz trzy sekundy."
        ru: "У тебя три секунды."
        source: { kind: translated, id: 12716104 }
  - id: moment
    ru: "секундочка, минутка (разговорное)"
    note: "Zaczekaj sekundę! — ровно как русское «Подожди секунду!»."
    examples:
      - pl: "Zaczekaj sekundę."
        ru: "Подожди секунду."
        source: { kind: translated, id: 3960517 }
      - pl: "Daj mi sekundę."
        ru: "Дай мне секунду."
        source: { kind: translated, id: 8773804 }
      - pl: "Poczekaj tu sekundę."
        ru: "Подожди тут секунду."
        source: { kind: translated, id: 11581591 }
  - id: unit
    ru: "единица измерения времени"
    examples:
      - pl: "Sekunda jest podstawową jednostką miary."
        ru: "Секунда — основная единица измерения."
        source: { kind: translated, id: 4512738 }
      - pl: "Każda sekunda się liczyła."
        ru: "Каждая секунда была на счету."
        source: { kind: translated, id: 11581562 }
      - pl: "Komputery potrafią wykonywać skomplikowaną pracę w ułamku sekundy."
        ru: "Компьютеры способны выполнять сложную работу за долю секунды."
        source: { kind: translated, id: 712410 }
notes:
  - { kind: government, text: "Управление числительными такое же, как в русском: dwie, trzy, cztery sekundy — именительный множественного, а pięć, dziesięć, trzydzieści sekund — родительный." }
  - { kind: usage, text: "Обиходное Zaczekaj sekundę! значит ровно «Подожди секунду!», как и по-русски." }
  - { kind: usage, text: "Чередование в дательном и предложном: sekunda, но w sekundzie — d переходит в dz." }
  - { kind: usage, text: "Устойчивое w ułamku sekundy «в доли секунды»." }
collocations:
  - { pl: "Zaczekaj sekundę!", ru: "Подожди секунду!" }
  - { pl: "w ułamku sekundy", ru: "в доли секунды" }
  - { pl: "pięć sekund", ru: "пять секунд" }
  - { pl: "każda sekunda się liczy", ru: "каждая секунда на счету" }
family:
  - { pl: "sekundnik", ru: "секундная стрелка", relation: derived }
  - { pl: "minuta", ru: "минута", relation: root }
  - { pl: "chwila", ru: "мгновение", relation: root }
etymology: "Из латинского secunda «вторая (часть часа)» через западноевропейские языки — то же заимствование, что и русская «секунда»."
memory: "sekunda — «секунда», и ведёт себя слово как русское. Управление числительными то же: trzy sekundy, но pięć sekund. Обиходное Zaczekaj sekundę! значит ровно «Подожди секунду!». Следите только за чередованием в предложном: w sekundzie, с dz вместо d."
idioms:
  - { pl: "Zaczekaj sekundę!", ru: "Подожди секунду!" }
  - { pl: "w ułamku sekundy", ru: "в доли секунды" }
  - { pl: "każda sekunda się liczy", ru: "каждая секунда на счету" }
formExamplesSkip:
  - { form: "sekundo", reason: "звательный падеж неодушевлённого существительного: к секунде по-польски не обращаются, форма остаётся только в таблице" }
