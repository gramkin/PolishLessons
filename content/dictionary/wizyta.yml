# review
id: wizyta
format: 2
lemma: "wizyta"
rank: 1207
pos: noun
pron: { cyr: "визы́та" }
senses:
  - id: visit
    ru: "визит, посещение"
    examples:
      - pl: "Nasza wizyta była wspaniała."
        ru: "Наш визит был замечательным."
        source: { kind: translated, id: 457348 }
      - pl: "Czy to jest pani pierwsza wizyta?"
        ru: "Это ваш первый визит?"
        source: { kind: translated, id: 6729751 }
      - pl: "Czy to twoja pierwsza wizyta w Bostonie?"
        ru: "Это твой первый визит в Бостон?"
        source: { kind: translated, id: 3032350 }
  - id: appointment
    ru: "приём у врача, запись на приём"
    examples:
      - pl: "Mam umówioną wizytę u lekarza."
        ru: "У меня встреча с доктором."
        source: { kind: tatoeba, id: 6313405 }
      - pl: "Mam wizytę u lekarza."
        ru: "У меня приём у врача."
        source: { kind: translated, id: 6173320 }
      - pl: "To moja pierwsza wizyta u dentysty."
        ru: "Это мой первый визит к стоматологу."
        source: { kind: translated, id: 980967 }
  - id: with-visit
    ru: "z wizytą — с визитом, в гости"
    examples:
      - pl: "Chętnie przyszedłbym z wizytą."
        ru: "Я бы с удовольствием пришёл в гости."
        source: { kind: translated, id: 973098 }
      - pl: "Jak tylko będę miał okazję, wpadnę z wizytą."
        ru: "Как только будет возможность, я загляну в гости."
        source: { kind: translated, id: 959169 }
      - pl: "Nie musisz wybierać się do niego z wizytą."
        ru: "Тебе не обязательно идти к нему с визитом."
        source: { kind: translated, id: 668704 }
notes:
  - { kind: government, text: "Три ходовых сочетания: wizyta u lekarza «приём у врача» (u с родительным), przyjść z wizytą «прийти с визитом» (z с творительным), podczas wizyty «во время визита» (родительный)." }
  - { kind: usage, text: "У врача wizyta значит «приём»: Mam wizytę u lekarza «Мне назначен приём». Записаться — umówić wizytę." }
  - { kind: usage, text: "Dziękuję za wizytę «Спасибо, что зашли» — обычная формула при прощании с гостем." }
  - { kind: pronunciation, text: "Оба y читаются как «ы»: визы́та. Ударение на предпоследний слог." }
collocations:
  - { pl: "wizyta u lekarza", ru: "приём у врача" }
  - { pl: "przyjść z wizytą", ru: "прийти с визитом" }
  - { pl: "umówić wizytę", ru: "записаться на приём" }
  - { pl: "cel wizyty", ru: "цель визита" }
etymology: "Из французского visite, от латинского visitare «навещать». Русское «визит» пришло тем же путём."
memory: "wizyta — это и «визит», и «приём у врача»: Mam wizytę u lekarza. Запомните предлоги: u lekarza «у врача», z wizytą «с визитом», podczas wizyty «во время визита». И формулу Dziękuję za wizytę «спасибо, что зашли»."
idioms:
  - { pl: "wizyta u lekarza", ru: "приём у врача" }
  - { pl: "przyjść z wizytą", ru: "прийти с визитом" }
  - { pl: "dziękuję za wizytę", ru: "спасибо, что зашли" }
