notes:
  - { kind: false-friend, text: "РУССКОГО РОДСТВЕННИКА НЕТ ВОВСЕ, И ЧЕСТНЕЕ СКАЗАТЬ ЭТО СРАЗУ. «Обезьяна» пришла в русский из персидского через тюркские языки, а польская małpa — из немецкого. Общего у слов нет ничего, опереться не на что. Зато второе значение запоминается с первого раза: значок @ по-польски зовётся małpa или małpka — там, где русский говорит «собака»." }
  - { kind: pronunciation, text: "ł звучит как короткое у: «ма́упа». В дательном и предложном падеже p смягчается в pi: o małpie — «о ма́упе». Та же мягкость, что в płyta → na płycie, только согласный другой." }
  - { kind: usage, text: "Родительный множественного — голая основа małp. Уменьшительное małpka значит сразу три вещи: «обезьянка», значок @ и, в разговорной речи, маленькую бутылочку водки на сто граммов. А глагол małpować собран ровно как русское «обезьянничать» и значит то же самое — передразнивать, копировать." }
collocations:
  - { pl: "małpa w klatce", ru: "обезьяна в клетке" }
  - { pl: "znak małpy", ru: "знак @" }
  - { pl: "małpka wódki", ru: "сотка водки" }
family:
  - { pl: "małpka", ru: "обезьянка; значок @; сотка водки", relation: derived }
  - { pl: "małpi", ru: "обезьяний", relation: derived }
  - { pl: "małpować", ru: "обезьянничать, передразнивать", relation: derived }
etymology: "Из средневерхненемецкого, родня немецкому Affe «обезьяна» с приставным mal-. Русское «обезьяна» пришло совсем другой дорогой, из персидского через тюркские языки, поэтому слова не схожи ни звуком, ни составом. От польского гнезда: małpka, małpi «обезьяний» и małpować «обезьянничать»."
memory: "małpa — «обезьяна», слово немецкого происхождения, с русским общего ничего. Зато второе значение запомнится сразу: значок @ поляки зовут małpa, а русские — «собака». И małpować — это точь-в-точь «обезьянничать»."
idioms:
  - { pl: "małpi gaj", ru: "обезьянник" }
  - { pl: "małpować kogoś", ru: "обезьянничать, передразнивать кого-л." }
