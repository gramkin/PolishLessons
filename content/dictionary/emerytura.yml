notes:
  - { kind: false-friend, text: "САМАЯ ОПАСНАЯ ПАРА В ЭТОЙ ТЕМЕ: PENSJA ЗНАЧИТ «ЗАРПЛАТА». Пенсия по-польски EMERYTURA, а слово pensja, которое русское ухо принимает за пенсию, означает месячное жалованье работающего человека: dostałem pensję «я получил зарплату». Сказать пенсионеру о его pensji — значит сказать, что он ещё работает." }
  - { kind: pronunciation, text: "ПРЕДЛОЖНЫЙ ПАДЕЖ МЕНЯЕТ R НА RZ: NA EMERYTURZE. Это уже пятый случай того же правила в словаре: aktor — aktorze, rozmiar — rozmiarze, spacer — spacerze, garnitur — garniturze, telewizor — telewizorze. Rz читается как ж: «эмэрыту́же»." }
  - { kind: usage, text: "Выходят на пенсию оборотом przejść NA emeryturę, с винительным; находятся на ней — być NA emeryturze, с предложным. Пенсионер — emeryt, пенсионерка — emerytka, досрочная пенсия — wcześniejsza emerytura. Пенсия по инвалидности называется иначе: renta." }
collocations:
  - { pl: "przejść na emeryturę", ru: "выйти на пенсию" }
  - { pl: "być na emeryturze", ru: "быть на пенсии" }
  - { pl: "wcześniejsza emerytura", ru: "досрочная пенсия" }
family:
  - { pl: "emeryt", ru: "пенсионер", relation: derived }
  - { pl: "renta", ru: "пенсия по инвалидности", relation: derived }
  - { pl: "pensja", ru: "зарплата", relation: antonym }
etymology: "Из латинского emeritus «отслуживший, заслуженный» — так в Риме называли отставного солдата, выслужившего срок. Через западные языки слово пришло в польский уже как название содержания по старости. Русский взял для этого другое латинское слово, pensio «платёж», и оттого вышла путаница: польское pensja — это как раз платёж работающему."
memory: "emerytura — «пенсия», а PENSJA это ЗАРПЛАТА: запомнить надо обе разом, иначе ошибка неизбежна. Выходят на пенсию: przejść na emeryturę; находятся на ней: na emeryturze, с r переходящим в rz."
idioms:
  - { pl: "przejść na emeryturę", ru: "выйти на пенсию" }
  - { pl: "żyć z emerytury", ru: "жить на пенсию" }
