# review
id: uroczy
format: 2
lemma: "uroczy"
rank: 1257
pos: adj
pron: { cyr: "уро́чы" }
senses:
  - id: charming
    ru: "очаровательный, прелестный"
    examples:
      - pl: "Ona jest urocza!"
        ru: "Она очаровательна!"
        source: { kind: translated, id: 1348516 }
      - pl: "Nancy jest z natury pogodna i urocza."
        ru: "Нэнси по натуре весёлая и очаровательная."
        source: { kind: translated, id: 730530 }
      - pl: "Jesteś uroczy."
        ru: "Ты очарователен."
        source: { kind: translated, id: 5664988 }
  - id: cute
    ru: "милый (о животных, детях, вещах)"
    examples:
      - pl: "Sowy są urocze."
        ru: "Совы милые."
        source: { kind: translated, id: 12470083 }
      - pl: "Koale są urocze."
        ru: "Коалы милые."
        source: { kind: translated, id: 3423487 }
      - pl: "Mam uroczego pieska."
        ru: "У меня милый пёсик."
        source: { kind: translated, id: 761302 }
  - id: lovely-place
    ru: "прелестный (о месте, языке, вещи)"
    examples:
      - pl: "Ten dom jest uroczy."
        ru: "Этот дом прелестный."
        source: { kind: translated, id: 691941 }
      - pl: "Nowoczesna greka to uroczy język."
        ru: "Современный греческий — прелестный язык."
        source: { kind: translated, id: 11571017 }
      - pl: "Ależ uroczy kwiatek!"
        ru: "Какой прелестный цветочек!"
        source: { kind: translated, id: 412918 }
notes:
  - { kind: usage, text: "Uroczy покрывает и «очаровательный» о человеке, и «милый» о животных и вещах. Русский тут делит на два слова." }
  - { kind: usage, text: "Urocze! как отдельная реплика значит «Как мило!»." }
  - { kind: usage, text: "Образовано от urok «обаяние, чары». Отсюда же czarujący «чарующий» — более книжный синоним." }
  - { kind: pronunciation, text: "Ударение на предпоследний слог: уро́чы. Конечное y звучит как «ы»." }
collocations:
  - { pl: "urocza dziewczyna", ru: "очаровательная девушка" }
  - { pl: "uroczy kotek", ru: "милый котёнок" }
  - { pl: "urocze miejsce", ru: "прелестное место" }
etymology: "От urok «обаяние, чары», от rzec «речь, говорить»: обаяние понималось как наговор. Русское «урок» — то же слово, но значение разошлось полностью."
memory: "uroczy — и «очаровательный» о человеке, и «милый» о животных и вещах: русский тут делит на два слова. Urocze! значит «Как мило!». От urok «обаяние» — родственно русскому «уроку», только значения разошлись."
idioms:
  - { pl: "urocza dziewczyna", ru: "очаровательная девушка" }
  - { pl: "uroczy kotek", ru: "милый котёнок" }
  - { pl: "urocze miejsce", ru: "прелестное место" }
