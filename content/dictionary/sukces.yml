# review
id: sukces
format: 2
lemma: "sukces"
rank: 1404
pos: noun
pron: { cyr: "су́кцэс" }
senses:
  - id: success
    ru: "успех, удача"
    examples:
      - pl: "Osiągnęła sukces dzięki ciężkiej pracy."
        ru: "Она достигла успеха тяжёлым трудом."
        source: { kind: tatoeba, id: 531882 }
      - pl: "Koncert był sukcesem."
        ru: "Концерт прошёл с успехом."
        source: { kind: translated, id: 359115 }
      - pl: "Odnieśliśmy sukces."
        ru: "Мы добились успеха."
        source: { kind: translated, id: 10602701 }
  - id: achievements
    ru: "во множественном числе — успехи, достижения"
    examples:
      - pl: "Życzę sukcesów w pracy."
        ru: "Желаю успехов в работе."
        source: { kind: tatoeba, id: 13041610 }
      - pl: "Tom odnosi sukcesy, prawda?"
        ru: "Том добивается успехов, правда?"
        source: { kind: translated, id: 9573558 }
notes:
  - { kind: government, text: "Глагол при этом слове другой, чем в русском: odnieść sukces или osiągnąć sukces «добиться успеха». Буквального «иметь успех» польский не говорит." }
  - { kind: usage, text: "Мужской неодушевлённый: sukces, sukcesu, o sukcesie." }
  - { kind: usage, text: "odnoszący sukcesy — польский способ сказать «успешный» о человеке: odnoszący sukcesy architekt «успешный архитектор». Отдельного прилагательного для этого нет." }
  - { kind: usage, text: "Życzę sukcesów — «Желаю успехов», стандартная формула пожелания." }
collocations:
  - { pl: "odnieść sukces", ru: "добиться успеха" }
  - { pl: "życzę sukcesów", ru: "желаю успехов" }
  - { pl: "klucz do sukcesu", ru: "ключ к успеху" }
etymology: "Из латинского successus «продвижение, результат» через европейские языки. Русское «успех» — своё слово, от «успеть», так что совпадает только значение, но не корень."
memory: "sukces — «успех», но глагол при нём другой: odnieść sukces «добиться успеха», а не «иметь». И запомните оборот odnoszący sukcesy — это польский способ сказать «успешный человек»."
idioms:
  - { pl: "odnieść sukces", ru: "добиться успеха" }
  - { pl: "życzę sukcesów", ru: "желаю успехов" }
  - { pl: "klucz do sukcesu", ru: "ключ к успеху" }
