notes:
  - { kind: false-friend, text: "Русского существительного с этим значением нет: «тем временем» по-русски только оборот, а по-польски есть слово. W MIĘDZYCZASIE значит именно «тем временем, в промежутке», и это самое частое употребление. Но у слова спорная репутация: оно калька немецкого ZWISCHENZEIT, и языковеды долго советовали говорить TYMCZASEM, которое и короче, и своё. В живой речи W MIĘDZYCZASIE победило окончательно, и в разговоре оно нейтрально, а в тщательном письме предпочтут TYMCZASEM. Второе значение, спортивное, возражений не вызывает ни у кого: MIĘDZYCZAS это промежуточное время на дистанции." }
  - { kind: government, text: "Мужской род, неодушевлённое. Почти всегда употребляется в местном падеже с предлогом W: W MIĘDZYCZASIE, и в этой форме слово выступает как наречный оборот, отвечая на вопрос «когда». Родительный на -U: BEZ MIĘDZYCZASU. Винительный равен именительному: WYKORZYSTAĆ MIĘDZYCZAS. Остальные падежи возможны, но редки, и в спортивном значении чаще всего встречается множественное число MIĘDZYCZASY. Состоит слово из предлога MIĘDZY «между» и существительного CZAS «время», соединённых напрямую, без гласной." }
  - { kind: pronunciation, text: "Читается «мендзы́час», ударение на предпоследнем слоге из трёх. Буква Ę перед DZ звучит «эн», и начальное MIĘ даёт «мен» с мягким м. Сочетание DZY читается «дзы», одним слитным звуком «дз». Буква CZ даёт «ч». В местном падеже MIĘDZYCZASIE буква S смягчается перед -IE и слогов становится четыре: «мендзычасе», и ударение переходит на предпоследний, то есть на третий." }
  - { kind: usage, text: "Главное сочетание одно и покрывает почти все случаи: W MIĘDZYCZASIE «тем временем». Рядом стоит TYMCZASEM с тем же значением, и оно безупречно с точки зрения пуристов, потому что образовано из своих частей, TYM и CZASEM. Третий вариант, W TYM CZASIE «в это время», годится, когда речь о совпадении, а не о заполненном промежутке. В спортивных трансляциях MIĘDZYCZAS и MIĘDZYCZASY звучат постоянно и означают промежуточное время. Прилагательного от слова нет." }
