etymology: "Сложение предлога MIĘDZY «между» и существительного CZAS «время», то есть буквально «междувременье». Образовано оно не самостоятельно, а по образцу немецкого ZWISCHENZEIT, из ZWISCHEN «между» и ZEIT «время», и это калька часть за частью. Именно поэтому слово долго считалось нежелательным: польские языковеды двадцатого века указывали, что для той же мысли есть своё TYMCZASEM, и что калька лишняя. Спор решился употреблением, и сегодня W MIĘDZYCZASIE встречается чаще, чем TYMCZASEM. Русский калькировать не стал и обошёлся оборотом «тем временем», поэтому существительного с этим значением в русском нет, и при переводе приходится менять часть речи."
memory: "Существительное там, где русский обходится оборотом: w międzyczasie — «тем временем», и отдельного слова в русском нет. Калька немецкого Zwischenzeit, за что слово долго ругали, советуя своё tymczasem; в живой речи победила калька, в тщательном письме предпочтут tymczasem. Второе значение спортивное и бесспорное: międzyczas — промежуточное время на дистанции. Из między плюс czas, напрямую, без соединительной гласной."
