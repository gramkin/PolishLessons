etymology: "От звукоподражательного KACZEĆ «крякать», откуда KACZKA и KACZOR; корень не праславянский, а собственно польский, выросший из подражания крику птицы. Русская «утка» происходит от праславянского *ǫty, родственного латинскому ANAS и немецкому ENTE, то есть принадлежит к древнему индоевропейскому слою. Поэтому два слова, означающих одну птицу, в польском и русском неродственны вовсе — редкий случай для обиходной лексики. Зато переносное значение пришло в оба языка одним путём и в одно время: из немецкого ZEITUNGSENTE «газетная утка», которое сами немцы объясняют сокращением NT, то есть NON TESTATUM «не проверено», ставившимся у непроверенных известий. Так метафора оказалась общей, хотя слова разные."
memory: "Редкий случай: слова неродственны — русская «утка» от праслав. *ǫty, польская kaczka от подражания кряканью (отсюда kaczor «селезень»). Зато переносное значение общее, оба взяли из немецкого: kaczka dziennikarska — «газетная утка». Два правила склонения на одном слове: k→c в дательном kaczce (как dawce, wódce) и беглое e в родительном множественного kaczek (как dawek). И осторожно: в больнице kaczka значит подкладное судно."
idioms:
  - { pl: "kaczka dziennikarska", ru: "газетная утка" }
