notes:
  - { kind: false-friend, text: "Значение совпадает полностью, включая переносное: KACZKA DZIENNIKARSKA — это русская «газетная утка», и метафора в двух языках одна, оба взяли её из немецкого. Расходятся только слова: русская «утка» и польская KACZKA неродственны. Польское слово происходит от KACZEĆ, звукоподражания кряканью, как и KACZOR «селезень»; русское — от праславянского *ǫty. Поэтому опереться на русский корень нельзя, зато переносное значение переносится без оговорок. Отдельно: польское KACZKA не употребляется о человеке, тогда как русская «утка» в разговоре может быть и о походке." }
  - { kind: usage, text: "Десять форм, женский род. Карточка держится на двух правилах сразу. Первое: дательный и местный единственного — KACZCE, где перед окончанием -E заднеязычное K переходит в C. Это та же мена, что в CÓRECZCE, DAWCE, WÓDCE и TROSCE, и она обязательна. Второе: родительный множественного — KACZEK, с беглым E, которого нет в основе: польский не терпит скопления согласных на конце, и вставляет гласный, как в DAWEK и TKANEK. Звательный KACZKO существует и употребляется в детской речи и в сказках. Селезень — KACZOR, утёнок — KACZĄTKO или PISKLĘ." }
  - { kind: pronunciation, text: "Читается «ка́чка», два слога, ударение на первом. Буквосочетание CZ даёт твёрдое «ч», как в русском «что» при беглом произношении. Конечное A — чистое «а». В дательном KACZCE сочетание CZC произносится «чц»: «ка́чце», и три согласных идут подряд без вставного гласного. В родительном множественного KACZEK появляется беглое E: «ка́чэк». В творительном KACZKĄ последнее Ą даёт «он»: «ка́чкон»." }
  - { kind: register, text: "В прямом значении слово нейтральное и бытовое. В переносном — журналистское и слегка пренебрежительное: KACZKA или KACZKA DZIENNIKARSKA о выдуманной новости, PUŚCIĆ KACZKĘ «запустить утку». Есть и третье, медицинское значение: KACZKA — подкладное судно для лежачих больных, и в больничном контексте слово понимают именно так, поэтому в разговоре с медиками двусмысленности лучше избегать. Уменьшительное KACZUSZKA ласковое и детское. Блюдо называется KACZKA Z JABŁKAMI, и это стандартная формула меню." }
