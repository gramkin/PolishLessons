# review
id: okazja
format: 2
lemma: "okazja"
rank: 552
pos: noun
pron: { cyr: "ока́зья" }
senses:
  - id: opportunity
    ru: "случай, возможность"
    note: "wykorzystać okazję «воспользоваться случаем», zmarnować okazję «упустить случай»."
    examples:
      - pl: "Lepiej wykorzystaj okazję."
        ru: "Лучше воспользуйся случаем."
        source: { kind: translated, id: 3041384 }
      - pl: "Nie zmarnuj okazji."
        ru: "Не упусти случай."
        source: { kind: translated, id: 946649 }
      - pl: "Zmarnował wszelkie okazje, jakie mu dałem."
        ru: "Он упустил все возможности, которые я ему дал."
        source: { kind: translated, id: 945786 }
  - id: occasion
    ru: "повод"
    note: "z okazji czegoś «по случаю чего-либо» — с родительным."
    examples:
      - pl: "Z jakiej okazji?"
        ru: "По какому поводу?"
        source: { kind: tatoeba, id: 2819134 }
      - pl: "Przyjmij moje serdeczne gratulacje z okazji twojego dzisiejszego sukcesu."
        ru: "Прими мои сердечные поздравления по случаю твоего сегодняшнего успеха."
        source: { kind: tatoeba, id: 442702 }
      - pl: "Z okazji urodzin dostał zegarek."
        ru: "По случаю дня рождения он получил часы."
        source: { kind: authored }
  - id: bargain
    ru: "выгодная покупка, выгодное предложение"
    note: "В магазине okazja значит «скидка, выгодное предложение»."
    examples:
      - pl: "To niezła okazja."
        ru: "Это неплохая возможность."
        source: { kind: translated, id: 364667 }
      - pl: "Okazja czyni złodzieja."
        ru: "Случай делает вора."
        source: { kind: translated, id: 403734 }
      - pl: "W sklepie czekały na nas prawdziwe okazje."
        ru: "В магазине нас ждали настоящие выгодные покупки."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Ложный друг: русская «оказия» — редкое слово про удобный случай что-то передать, а польское okazja намного шире: «случай, возможность, повод» и даже «выгодная покупка»." }
  - { kind: government, text: "z okazji czegoś — по случаю чего-либо, с родительным: z okazji urodzin «по случаю дня рождения»." }
  - { kind: usage, text: "Пара глаголов: wykorzystać okazję «воспользоваться случаем» и zmarnować okazję «упустить случай»." }
  - { kind: usage, text: "przy okazji значит «кстати, заодно»: Przy okazji, dzwonił Tomek." }
collocations:
  - { pl: "wykorzystać okazję", ru: "воспользоваться случаем" }
  - { pl: "z okazji", ru: "по случаю" }
  - { pl: "przy okazji", ru: "кстати, заодно" }
  - { pl: "zmarnować okazję", ru: "упустить случай" }
family:
  - { pl: "okazyjny", ru: "случайный; выгодный", relation: derived }
  - { pl: "okazjonalny", ru: "приуроченный", relation: derived }
etymology: "Из латинского occasio «случай» через немецкое Okkasion — то же слово, что русская «оказия», но значение в польском ушло гораздо шире."
memory: "okazja — ложный друг: русская «оказия» это редкий «удобный случай что-то передать», а польское okazja значит «случай, возможность, повод» и вдобавок «выгодную покупку». Z jakiej okazji? — «По какому поводу?», с z и родительным. Запомните пару глаголов: wykorzystać okazję «воспользоваться случаем» и zmarnować okazję «упустить случай». А przy okazji — это «кстати, заодно»."
idioms:
  - { pl: "przy okazji", ru: "кстати, заодно" }
  - { pl: "z okazji", ru: "по случаю" }
  - { pl: "Okazja czyni złodzieja", ru: "Случай делает вора" }
formExamplesSkip:
  - { form: "okazyj", reason: "архаичный вариант родительного множественного; современная форма — okazji, и в корпусе нет ни одного примера" }
