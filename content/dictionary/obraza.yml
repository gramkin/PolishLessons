etymology: "От OBRAZIĆ «обидеть», которое сложено из OB- и RAZIĆ «поражать, бить», из праславянского *raziti; тот же корень в русских «разить», «поразить», «раз». Исходный смысл — «ударить, задеть», и обида названа ударом, как и в русском «обида» от «обидеть», где корень *vid- даёт идею «обойти взглядом, пренебречь». То есть образы разные: польский бьёт, русский пренебрегает. Слово OBRAZ «картина» идёт от того же OB- плюс RAZIĆ, но через значение «вырезать, отпечатать», отсюда «изображение»; поэтому два слова этимологически родственны и разошлись в значениях, сохранив почти одинаковые формы. Русское «образ» принадлежит той же ветви, что польское OBRAZ, и означает то же."
memory: "Одна буква и три общие формы: obraza — «обида, оскорбление», obraz — «картина, образ». Совпадают местный obrazie, именительный множественного obrazy и родительный множественного obraz, который равен именительному другого слова. Различают только род и согласование: ta obraza против ten obraz. Bez obrazy — «без обид». Глагол obrazić się NA kogoś, как и в русском, с винительным."
