notes:
  - { kind: false-friend, text: "Пара OBRAZA и OBRAZ различается одной буквой, а значит совершенно разное: OBRAZA это «обида, оскорбление», а OBRAZ — «картина» и «образ». Хуже того, три формы у них совпадают. Родительный множественного от OBRAZA — это OBRAZ, то есть именительный другого слова. Местный падеж OBRAZIE одинаков у обоих. Именительный множественного OBRAZY тоже общий. Поэтому W OBRAZIE может значить и «в картине», и «в обиде», а различает только смысл фразы и согласование прилагательных: TA OBRAZA женского рода, TEN OBRAZ мужского. Русское «образ» отвечает польскому OBRAZ, а «обида» — OBRAZA, и в русском эти два слова не похожи вовсе." }
  - { kind: usage, text: "Женское существительное на -A, склонение обычное, но перекличка с OBRAZ требует внимания. В дательном и местном Z смягчается перед -IE: OBRAZIE. Родительный множественного — OBRAZ, с нулевым окончанием, и эта форма полностью совпадает с именительным единственного слова OBRAZ. Чтобы отличить, смотрите на согласуемые слова: WIELE OBRAZ «много обид» против TEN OBRAZ «эта картина». Форма OBRAZY покрывает родительный единственного и именительный с винительным множественного у нашего слова, а у OBRAZ это именительный множественного." }
  - { kind: government, text: "Женский род. Чья обида или чего — родительный: OBRAZA HONORU «оскорбление чести», OBRAZA UCZUĆ RELIGIJNYCH, OBRAZA FUNKCJONARIUSZA. Устойчивое BEZ OBRAZY значит «без обид» и вставляется перед неприятной правдой, точно как по-русски. Глагол того же корня — OBRAZIĆ «обидеть, оскорбить», с винительным: OBRAZIŁ MNIE; и возвратное OBRAZIĆ SIĘ NA KOGOŚ «обидеться на кого-то», с предлогом NA и винительным, как и в русском. Прилагательное OBRAŹLIWY значит «оскорбительный», а OBRAŻONY — «обиженный»." }
  - { kind: pronunciation, text: "Читается «обра́за», три слога, ударение на предпоследнем. Оба O произносятся полно, как «о», без редукции. Буква Z между гласными звучит «з». В дательном и местном OBRAZIE сочетание ZIE даёт мягкое «зе»: «обра́зе». В родительном множественного OBRAZ слогов два, ударение переходит на первый, а конечное Z оглушается до «с»: «о́брас». Именно в этой форме слово звучит как мужское OBRAZ в именительном, и различить их на слух нельзя." }
