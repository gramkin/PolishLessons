notes:
  - { kind: usage, text: "Местный падеж — OGONIE, с переходом n в ń, который перед гласной пишется ni. Рядом в этой же партии так же ведёт себя WYMIANA — WYMIANIE. Родительный при этом OGONA с окончанием -a, хотя слово неодушевлённое: напоминаю, что у мужских неодушевлённых выбор между -a и -u лексический, и ogon вместе с zegarem и dziennikiem взял -a, а plik, dym, podpis, produkt, zwrot и bagaż взяли -u." }
  - { kind: usage, text: "Русское «хвост» и польское OGON — слова разного происхождения, но корень польского русскому знаком. OGON идёт от GONIĆ «гнать», из праславянского *goniti, и буквально значит «то, чем отгоняют»: хвост отмахивается от мух. Русский этот корень знает прекрасно — «гнать», «гон», «погоня», «погонять», — но хвост назвал иначе. Так что запоминать слово лучше через «гон», а не через «хвост»." }
  - { kind: pronunciation, text: "Уменьшительное от этого слова стоит знать отдельно: OGONEK значит «хвостик» — и именно так по-польски называется крючок под буквами ą и ę. Когда поляк говорит «a z ogonkiem», он имеет в виду ą. Название точное: крючок и есть маленький хвост, подвешенный к букве. Полезно и для разговора о правописании, и как мнемоника — ą и ę отличаются от a и e ровно хвостиком." }
collocations:
  - { pl: "ogon psa", ru: "хвост собаки" }
  - { pl: "merdać ogonem", ru: "вилять хвостом" }
  - { pl: "ogon samolotu", ru: "хвост самолёта" }
family:
  - { pl: "ogonek", ru: "хвостик; крючок под ą и ę", relation: derived }
  - { pl: "gonić", ru: "гнать, гнаться", relation: root, id: gonic }
etymology: "Из праславянского *ogonъ, от goniti «гнать»: хвост понят как орудие, которым животное отгоняет насекомых. Русский знает тот же корень в «гнать», «гоне» и «погоне», но для хвоста взял другое слово — «хвост», из праславянского *xvostъ. Отсюда и уменьшительное OGONEK «хвостик», которым в польском зовут крючок под ą и ę."
memory: "Не похоже на «хвост», зато корень знакомый: ogon от gonić «гнать». А ogonek — это и хвостик, и крючок под ą, ę."
idioms:
