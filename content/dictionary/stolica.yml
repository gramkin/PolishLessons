notes:
  - { kind: false-friend, text: "Значение совпадает с русской «столицей» полностью, и слово построено из того же корня тем же способом — от названия престола. Ловушки лежат рядом, в соседних словах с тем же корнем, и их три. STÓŁ значит «стол», как в русском. STOŁEK — табурет, то есть стул без спинки, а также переносно должность. А вот STOLEC в современном польском языке означает стул в медицинском смысле, то есть кал, и этим словом ни в коем случае нельзя назвать мебель: обычный стул — KRZESŁO. Старое значение STOLEC как «престол» сохранилось только в исторических текстах." }
  - { kind: usage, text: "Десять форм, женский род, основа на -C. Форма STOLICY несёт родительный, дательный и местный единственного сразу — три падежа, как у OWCY и KROPLI. Именительный и винительный множественного — STOLICE, родительный множественного — STOLIC с нулевым окончанием и без вставного гласного. Винительный единственного — STOLICĘ, творительный — STOLICĄ. С названием страны слово ставится в родительном: STOLICA POLSKI, STOLICA NIEMIEC. Устойчивое STOLICA APOSTOLSKA пишется с двух прописных и означает Святой Престол, то есть Ватикан как институт." }
  - { kind: pronunciation, text: "Читается «столи́ца», три слога, ударение на втором — то есть на том же слоге, что и в русском, и это редкая удача. Буква C даёт «ц», сочетание LI звучит с мягким L: «ли». В форме STOLICĘ конечное Ę читается как чистое «э»: «столи́цэ». В форме STOLICĄ последнее Ą даёт «он»: «столи́цон». В форме STOLIC конечное C остаётся твёрдым, а ударение переходит на первый слог: «сто́лиц», потому что в двусложном слове предпоследний слог — первый." }
  - { kind: register, text: "Слово нейтральное и частое. В разговоре поляка STOLICA без уточнения всегда означает Варшаву, как русское «столица» — Москву. Устойчивые сочетания: STOLICA KRAJU, STOLICA REGIONU, а в административном языке — MIASTO STOŁECZNE WARSZAWA, официальное название города. Прилагательное STOŁECZNY «столичный» употребляется широко: STOŁECZNY RATUSZ, STOŁECZNE KORKI. Переносное употребление вроде STOLICA LETNICH FESTIWALI «столица летних фестивалей» встречается в газетах и звучит так же, как по-русски. Звательная форма STOLICO живёт только в стихах и песнях." }
