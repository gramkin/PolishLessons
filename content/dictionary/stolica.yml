etymology: "От праславянского *stolъ, означавшего не стол, а сиденье, престол: тот, кто сидел на столе, то есть на троне, правил землёй. Отсюда и русская «столица», и польское STOLICA — город, где стоит престол. Русский сохранил старое значение в словах «престол» и «стольный град», а обиходное «стол» перевёл на мебель; польский сделал ровно то же самое со STÓŁ. След исходного смысла остался в польском STOLEC, которое означало престол ещё в шестнадцатом веке, а в современном языке сузилось до медицинского термина — редкий пример того, как слово падает из высокого стиля в самый низкий. Суффикс -ICA в STOLICA тот же, что в русской «столице», и образует он название места."
memory: "Полное соответствие русской «столице», и даже ударение совпадает: оба слова от праслав. *stolъ «престол», а не от стола-мебели. Город, где стоит престол. Осторожно с соседями: stół это стол, stołek табурет и должность, krzesło стул, а stolec в современном языке — медицинский термин, кал. Форма stolicy делает три падежа. Stolica Apostolska значит Святой Престол."
idioms:
  - { pl: "Stolica Apostolska", ru: "Святой Престол, Ватикан" }
