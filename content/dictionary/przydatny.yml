# review
id: przydatny
format: 2
lemma: "przydatny"
rank: 4353
pos: adj
pron: { cyr: "пшыда́тны" }
senses:
  - id: useful
    ru: "полезный, пригодный"
    examples:
      - pl: "To bardzo przydatna aplikacja."
        ru: "Это очень полезное приложение."
        source: { kind: authored }
      - pl: "Te rady okazały się przydatne."
        ru: "Эти советы оказались полезными."
        source: { kind: authored }
      - pl: "Najprzydatniejszy prezent to dobry nóż."
        ru: "Самый полезный подарок — хороший нож."
        source: { kind: authored }
  - id: handy
    ru: "нужный, сгодившийся (о человеке, вещи в деле)"
    examples:
      - pl: "Był przydatny w każdej sytuacji."
        ru: "Он пригождался в любой ситуации."
        source: { kind: authored }
      - pl: "Data przydatności jest na opakowaniu, a jogurt jest przydatny do spożycia do piątku."
        ru: "Срок годности указан на упаковке: йогурт годен до пятницы."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Русскому PRZYDATNY почти понятен: «придаться, пригодиться». Это «полезный, пригодный». PRZYDATNY DO SPOŻYCIA — «годен к употреблению», надпись на продуктах. Синоним UŻYTECZNY звучит книжнее. Глагол PRZYDAĆ SIĘ — «пригодиться»: TO SIĘ PRZYDA." }
  - { kind: usage, text: "Полная парадигма: PRZYDATNY, PRZYDATNIEJSZY, NAJPRZYDATNIEJSZY. Все степени живые. Форма для мужчин-людей: PRZYDATNI, PRZYDATNIEJSI, NAJPRZYDATNIEJSI — о работниках, игроках, помощниках." }
  - { kind: government, text: "Полезный для чего-то — PRZYDATNY DO + родительный: PRZYDATNY DO PRACY, DO GOTOWANIA. Полезный кому-то — PRZYDATNY DLA KOGOŚ. Годен к употреблению — PRZYDATNY DO SPOŻYCIA." }
  - { kind: pronunciation, text: "Читается «пшыда́тны», три слога, ударение на предпоследнем. PRZY — «пшы». TN — без гласной между ними. В PRZYDATNIEJSZY: «пшыдатне́йшы»." }
  - { kind: register, text: "Нейтральное повседневное слово. В заголовках статей — на каждом шагу: PRZYDATNE PORADY, «полезные советы», PRZYDATNE LINKI, «полезные ссылки»." }
collocations:
  - { pl: "przydatne porady", ru: "полезные советы" }
  - { pl: "przydatny do spożycia", ru: "годен к употреблению" }
  - { pl: "przydatna aplikacja", ru: "полезное приложение" }
family:
  - { pl: "przydać się", ru: "пригодиться", relation: root, id: przydac }
  - { pl: "przydatność", ru: "пригодность", relation: derived }
  - { pl: "użyteczny", ru: "полезный", relation: root }
etymology: "От PRZYDAĆ SIĘ «пригодиться», буквально «придаться, добавиться», от DAĆ «дать». Полезное — то, что можно придать делу. Русское «придать» собрано так же, но значения «пригодиться» у него нет."
memory: "Przydatny — полезный: przydatne porady, przydatna aplikacja. Przydatny do spożycia — годен к употреблению. От przydać się — пригодиться. Читается «пшыда́тны»."
idioms:
  - { pl: "przydatny do spożycia", ru: "годен к употреблению" }
