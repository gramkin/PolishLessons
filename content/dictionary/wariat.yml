notes:
  - { kind: usage, text: "jak wariat «как сумасшедший» — самый частый оборот: prowadzić jak wariat, biegać jak wariat." }
  - { kind: usage, text: "dom wariatów «сумасшедший дом» работает и буквально, и как оценка беспорядка, ровно как в русском." }
  - { kind: false-friend, text: "Из латинского varius «переменчивый» через немецкий; ср. русское «вариант», «варьировать» — тот же корень, но значение разошлось далеко." }
  - { kind: government, text: "Мужско-личный род: винительный совпадает с родительным — robić z kogoś wariata." }
collocations:
  - { pl: "jak wariat", ru: "как сумасшедший" }
  - { pl: "dom wariatów", ru: "сумасшедший дом" }
etymology: "Из латинского varius «переменчивый» через немецкий; ср. русское «вариант» — тот же корень, разошедшийся по смыслу."
memory: "wariat — «сумасшедший». Главные обороты: jak wariat «как сумасшедший» и dom wariatów «сумасшедший дом», оба как в русском."
idioms:
