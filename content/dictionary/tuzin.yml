notes:
  - { kind: false-friend, text: "Значение то же, что у русской «дюжины», а слова не родственны: оба заимствованы, но разными путями. Польский взял немецкое DUTZEND, русский — французское DOUZAINE, и за обоими стоит латинское DUODECIM «двенадцать». Поэтому опереться на русский облик слова нельзя совсем: TUZIN не похож на «дюжину» ни одной буквой. Зато в польском есть и прямое числительное DWANAŚCIE, и в современной речи оно вытеснило TUZIN почти везде, кроме торговли мелким товаром. Прилагательное TUZINKOWY значит «заурядный, шаблонный», и это переносное значение в русском отсутствует." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Местный единственного — TUZINIE, где конечное N основы смягчается в NI перед окончанием -E: та же мена, что в SYNIE от SYN и в OGRODZIE от OGRÓD по соседнему правилу. Считаемое ставится в родительном множественного: TUZIN JAJ «дюжина яиц», TUZIN GUZIKÓW. Творительный множественного TUZINAMI работает как наречие «дюжинами», то есть во множестве. Устойчивое PRZED TUZINEM LAT значит «лет двенадцать назад» и звучит слегка старомодно." }
  - { kind: pronunciation, text: "Читается «ту́зин», два слога, ударение на первом. Буква U даёт «у», Z — звонкое «з», а конечное N твёрдое. В форме TUZINIE сочетание NIE звучит «не» с мягким N: «тузи́не». В форме TUZINEM слышно «тузи́нэм», с чистым «э». В форме TUZINÓW буква Ó даёт «у», а конечное W оглушается в «ф»: «тузи́нуф». Ударение во всех формах предпоследнее и потому переезжает вправо вместе с окончанием." }
  - { kind: register, text: "Слово слегка устаревшее и торговое: сегодня его услышишь в магазине мелкого товара, в кулинарном рецепте и в разговоре о посуде, а в обычном счёте скажут DWANAŚCIE. Устойчивые сочетания: TUZIN JAJ, CAŁY TUZIN, PÓŁ TUZINA «полдюжины». Переносное TUZINAMI значит «во множестве» и несёт оттенок пренебрежения: TAKICH KSIĄŻEK WYCHODZI TUZINAMI. Прилагательное TUZINKOWY в современном языке гораздо живее самого существительного и значит «ничем не примечательный», как русское «дюжинный», только употребляется чаще." }
