etymology: "Из немецкого DUTZEND, которое немцы получили из старофранцузского DOZEINE, а то — из латинского DUODECIM «двенадцать», сложения DUO «два» и DECEM «десять». Русская «дюжина» идёт из того же латинского источника, но через французское DOUZAINE напрямую, и потому звучит иначе: немецкий по дороге переделал начало слова до неузнаваемости. Так одно латинское числительное дало двум соседним языкам два непохожих слова, и это обычная история для торговой лексики, которая шла в Польшу через немецкие города, а в Россию — через французский двор. Счёт дюжинами пришёл из той же торговли: двенадцать делится на два, три, четыре и шесть, и потому им было удобно отмерять мелкий товар."
memory: "Значение как у «дюжины», но слова неродственны: польское tuzin из немецкого Dutzend, русская «дюжина» из французского douzaine, а исток один — латинское duodecim «двенадцать». Сегодня слово торговое и слегка старомодное, в обычном счёте говорят dwanaście. Зато прилагательное tuzinkowy «заурядный» очень живое. Местный tuzinie со смягчением n→ni. Tuzinami значит «во множестве»."
idioms:
  - { pl: "pół tuzina", ru: "полдюжины" }
