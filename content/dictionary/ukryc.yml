# review
id: ukryc
format: 2
lemma: "ukryć"
rank: 637
pos: verb
aspect: perf
pron: { cyr: "у́крыць" }
senses:
  - id: hide-something
    ru: "спрятать, скрыть (что-либо)"
    examples:
      - pl: "Ukryj pieniądze!"
        ru: "Спрячь деньги!"
        source: { kind: translated, id: 8732631 }
      - pl: "Ukrył ten fakt przede mną."
        ru: "Он скрыл этот факт от меня."
        source: { kind: translated, id: 362914 }
      - pl: "Próbowała ukryć fakty."
        ru: "Она пыталась скрыть факты."
        source: { kind: translated, id: 403565 }
  - id: hide-oneself
    ru: "ukryć się — спрятаться, укрыться"
    note: "С się глагол становится непереходным: Muszę się ukryć «Мне надо спрятаться»."
    examples:
      - pl: "Tom ukrył się w jaskini."
        ru: "Том спрятался в пещере."
        source: { kind: tatoeba, id: 12710236 }
      - pl: "Wstrzymała oddech i ukryła się za drzwiami."
        ru: "Она пряталась за дверью, затаив дыхание."
        source: { kind: tatoeba, id: 2585294 }
      - pl: "Muszę się ukryć."
        ru: "Мне надо спрятаться."
        source: { kind: translated, id: 13046033 }
notes:
  - { kind: usage, text: "Формы ukryję, ukryjesz, ukryje — БУДУЩЕЕ время: глагол совершенного вида. Несовершенный — ukrywać." }
  - { kind: usage, text: "С się смысл становится непереходным: ukryć coś «спрятать что-то», но ukryć się «спрятаться самому». Тот же механизм, что в uczyć / uczyć się." }
  - { kind: usage, text: "Разбирается прозрачно: u- + kryć «крыть, скрывать» — та же основа, что в русском «крыть», «скрыть». Рядом стоит odkryć «открыть, обнаружить» с противоположной приставкой." }
  - { kind: usage, text: "Причастие ukryty значит «скрытый, потайной»: ukryta kamera «скрытая камера», ukryte drzwi «потайная дверь». Оборот w ukryciu — «в укрытии, тайком»." }
collocations:
  - { pl: "ukryć się", ru: "спрятаться" }
  - { pl: "ukryta kamera", ru: "скрытая камера" }
  - { pl: "nie mam nic do ukrycia", ru: "мне нечего скрывать" }
  - { pl: "w ukryciu", ru: "в укрытии" }
family:
  - { pl: "ukrywać", ru: "скрывать", relation: derived }
  - { pl: "kryć", ru: "крыть, скрывать", relation: root }
  - { pl: "odkryć", ru: "открыть, обнаружить", relation: derived, id: odkryc }
  - { pl: "kryjówka", ru: "укрытие", relation: derived }
etymology: "Приставка u- плюс kryć «крыть, скрывать», от праславянского *kryti — то же слово, что русское «крыть, скрыть». Рядом стоит odkryć с противоположной приставкой: «открыть, обнаружить»."
memory: "ukryć — «спрятать, скрыть». С частицей się глагол становится непереходным: ukryć coś «спрятать что-то», но ukryć się «спрятаться самому» — Muszę się ukryć. Формы ukryję, ukryjesz — будущее время, несовершенный вид — ukrywać. Причастие ukryty значит «скрытый, потайной»: ukryta kamera, ukryte drzwi. И запомните оборот nie mam nic do ukrycia «мне нечего скрывать»."
idioms:
  - { pl: "nie mam nic do ukrycia", ru: "мне нечего скрывать" }
  - { pl: "ukryta kamera", ru: "скрытая камера" }
  - { pl: "w ukryciu", ru: "в укрытии" }
