notes:
  - { kind: false-friend, text: "MINISTERSTWO — «министерство», перевод прямой. В газетах вместо него часто пишут RESORT — «ведомство», а не «курорт»: RESORT ZDROWIA, «министерство здравоохранения»." }
  - { kind: usage, text: "Девять форм, средний род на -STWO. Местный падеж — W MINISTERSTWIE. Родительный множественного — MINISTERSTW." }
  - { kind: government, text: "Министерство чего — родительный: MINISTERSTWO ZDROWIA, MINISTERSTWO EDUKACJI. В министерстве — W MINISTERSTWIE. Обратиться в министерство — ZWRÓCIĆ SIĘ DO MINISTERSTWA." }
  - { kind: pronunciation, text: "Читается «министэ́рстфо», ударение на предпоследнем слоге. TE — твёрдое «тэ», W после T оглушается в «ф»." }
