# review
id: odkryc
format: 2
lemma: "odkryć"
rank: 837
pos: verb
aspect: perf
pron: { cyr: "о́ткрыць" }
senses:
  - id: discover
    ru: "открыть, обнаружить"
    examples:
      - pl: "Mówią, że wikingowie odkryli Amerykę jeszcze przed Kolumbem."
        ru: "Говорят, что викинги открыли Америку ещё до Колумба."
        source: { kind: tatoeba, id: 1863913 }
      - pl: "Odkrył sekret."
        ru: "Он раскрыл секрет."
        source: { kind: translated, id: 6554275 }
      - pl: "Odkryto tam złoto."
        ru: "Там обнаружили золото."
        source: { kind: translated, id: 8819903 }
  - id: find-out
    ru: "выяснить, узнать (правду, тайну)"
    examples:
      - pl: "Odkryłem nowy i ciekawy świat."
        ru: "Я открыл новый и интересный мир."
        source: { kind: tatoeba, id: 5488007 }
      - pl: "Tom odkrył prawdę."
        ru: "Том узнал правду."
        source: { kind: translated, id: 2205813 }
      - pl: "Odkryłem, że mnie obgadujesz."
        ru: "Я узнал, что ты обо мне сплетничаешь."
        source: { kind: translated, id: 10574756 }
notes:
  - { kind: usage, text: "Формы odkryję, odkryjesz, odkryje — БУДУЩЕЕ время: глагол совершенного вида. Несовершенный — odkrywać." }
  - { kind: usage, text: "Разбирается прозрачно: od- + kryć «крыть, скрывать» — буквально «раскрыть». Русское «открыть» собрано так же, от «крыть»." }
  - { kind: false-friend, text: "Осторожно: «открыть дверь» — это otworzyć drzwi, а не odkryć. odkryć значит «обнаружить, раскрыть»: odkryć prawdę, odkryć Amerykę." }
  - { kind: usage, text: "Причастие odkryty работает и как прилагательное «открытый» в смысле «не крытый»: basen odkryty «открытый бассейн», odkryta głowa «непокрытая голова»." }
collocations:
  - { pl: "odkryć prawdę", ru: "узнать правду" }
  - { pl: "odkryć Amerykę", ru: "открыть Америку" }
  - { pl: "basen odkryty", ru: "открытый бассейн" }
  - { pl: "dokonać odkrycia", ru: "совершить открытие" }
family:
  - { pl: "odkrywać", ru: "открывать", relation: derived }
  - { pl: "odkrycie", ru: "открытие", relation: derived }
  - { pl: "odkrywca", ru: "первооткрыватель", relation: derived }
etymology: "Приставка od- плюс kryć «крыть, скрывать» — буквально «раскрыть». Русское «открыть» собрано точно так же, от «крыть», и значения совпадают почти полностью."
memory: "odkryć — «открыть» в смысле «обнаружить, раскрыть»: odkryć prawdę, odkryć Amerykę, odkryto tam złoto. А вот «открыть дверь» — это otworzyć, не odkryć: две разные приставки, od- «рас-» и ot- «от-». Формы odkryję, odkryjesz — будущее время, несовершенный вид — odkrywać. Причастие odkryty живёт и как прилагательное «открытый, не крытый»: basen odkryty. Идиома совпадает с русской буквально: odkryć Amerykę «открыть Америку» — сказать общеизвестное."
idioms:
  - { pl: "odkryć Amerykę", ru: "открыть Америку" }
  - { pl: "odkryć karty", ru: "раскрыть карты" }
  - { pl: "dokonać odkrycia", ru: "совершить открытие" }
