etymology: "Из латинского INFORMATOR «придающий форму, образующий», от INFORMARE, сложения IN- и FORMA: сообщить значило придать мысли форму, вложить её в чужую голову как в готовую рамку. От того же корня идут «форма», «формальный», «реформа» и польское FORMA. Оба языка взяли слово из латыни канцелярий, но польский дополнительно пустил его на названия печатных изданий — путём, обычным для него: так же LICZNIK значит и счётчик-прибор, и считающего. Различение по форме множественного числа при этом чисто польское: язык воспользовался противопоставлением одушевлённости, которого в русском для этого слова нет."
memory: "Шире русского: informator это и осведомитель, и печатный справочник — informator turystyczny «путеводитель». И самое изящное: два значения различаются формой множественного числа, informatorzy о людях против informatory о книжках, как satelici против satelity. Местный informatorze с меной r→rz, как liderze. Из латинского informare «придать форму», от forma — сообщить значило вложить мысль в готовую рамку."
idioms:
