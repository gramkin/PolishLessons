notes:
  - { kind: false-friend, text: "Русский «информатор» — только человек. Польское INFORMATOR значит и человека, и печатную книжку: INFORMATOR DLA KANDYDATÓW это справочник для абитуриентов, INFORMATOR TURYSTYCZNY — путеводитель. И вот что замечательно: два значения разошлись в грамматике. Именительный множественного для людей — INFORMATORZY, с мужским-личным окончанием, а для книжек — INFORMATORY, с неодушевлённым. То есть сам язык различает, о ком или о чём речь, и выбор формы снимает двусмысленность, которой в русском пришлось бы помогать словами. Та же пара была у SATELITA: SATELICI и SATELITY." }
  - { kind: usage, text: "Одиннадцать форм, мужской род. Две формы именительного множественного распределены по одушевлённости: INFORMATORZY о людях, INFORMATORY о предметах; родительный множественного у обоих один, INFORMATORÓW. Местный единственного — INFORMATORZE, с переходом R в RZ, как в LIDERZE и SEKTORZE. Винительный единственного для человека равен родительному, INFORMATORA, а для книжки — именительному, INFORMATOR. Суффикс -TOR образует названия деятеля от латинских основ и очень продуктивен: ORGANIZATOR, REDAKTOR, LIKWIDATOR." }
  - { kind: pronunciation, text: "Читается «информа́тор», четыре слога, ударение на третьем — как и в русском. Буква O в каждом слоге чистая, R раскатистое. В форме INFORMATORZE буквосочетание RZ даёт «ж»: «информа́тоже». В форме INFORMATORZY слышно «информа́тожы», с твёрдым «ы» на конце. В форме INFORMATORY звучит «информа́торы», с обычным «р» — и на слух именно это различает людей от книжек. В форме INFORMATORÓW буква Ó даёт «у»." }
  - { kind: register, text: "В значении человека слово нейтральное в языке полиции и прессы, но в разговоре о прошлом несёт тяжёлый оттенок: INFORMATOR SŁUŻB значит доносчика, и рядом стоят слова KONFIDENT и DONOSICIEL, оба отчётливо осуждающие. В значении справочника слово совершенно нейтральное и канцелярское. Устойчивые сочетания: TAJNY INFORMATOR, SIEĆ INFORMATORÓW, INFORMATOR TURYSTYCZNY, INFORMATOR DLA KANDYDATÓW. Женская форма INFORMATORKA существует и встречается в обоих значениях, кроме книжного." }
