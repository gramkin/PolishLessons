etymology: "Приставка PO- плюс BAWIĆ, а тот восходит к праславянскому *baviti — побудительной форме от *byti «быть», то есть буквально «заставлять быть, задерживать». Отсюда два расходящихся пути. Один дал значение «задерживать, развлекать»: польское BAWIĆ, русское «забава» и «забавный». Другой сохранил чистое «прибавлять к бытию» и дал русские «добавить», «прибавить», «убавить», «избавить». Поэтому польское WYBAWIĆ отвечает русскому «избавить», а ZBAWICIEL — «Спаситель»: детская игра и спасение души оказались одним корнем. Польское PRZEBYWAĆ «находиться» хранит исходное значение почти нетронутым."
memory: "Приставка po- работает точно как русская: pobawić się «поиграть», poczytać «почитать», pospać «поспать» — «немного поделать». Управление тоже совпадает: игрушка в творительном (pobawić się lalką «поиграть куклой»), игра через w с винительным (pobawić się w chowanego «поиграть в прятки»). Корень тот же, что в «забаве», но он же дал «избавить» и «Спасителя»: польское wybawić «избавить», Zbawiciel «Спаситель»."
idioms:
