notes:
  - { kind: usage, text: "Приставка PO- здесь та же, что в русском «поиграть»: она ограничивает действие по времени, «немного, недолго». Русскоязычному это не надо учить заново, достаточно узнать: POBAWIĆ SIĘ «поиграть», POCZYTAĆ «почитать», POSPAĆ «поспать», POCHODZIĆ «походить», POSIEDZIEĆ «посидеть». Образец один и тот же в обоих языках, и он живой: от почти любого несовершенного глагола так можно получить «немного поделать». Пятьдесят три формы — обычная подпись переходного глагола совершенного вида." }
  - { kind: false-friend, text: "BAWIĆ SIĘ — самое будничное польское слово для детской игры, ровно русское «играть»: DZIECI BAWIĄ SIĘ W OGRODZIE «дети играют в саду». Русское «забавляться» того же корня, но звучит книжно и слегка насмешливо, так что переводить им нельзя. Существительное ZABAWA значит не только «забава», но и «вечеринка, танцы»: IŚĆ NA ZABAWĘ это «пойти на танцы». А ZABAWKA — «игрушка». Зато про спорт и музыку поляк скажет GRAĆ, как и русский «играть»: GRAĆ W PIŁKĘ, GRAĆ NA GITARZE." }
  - { kind: government, text: "Переходное POBAWIĆ KOGOŚ требует винительного: POBAWIŁ DZIECI «он позабавил детей». Возвратное POBAWIĆ SIĘ строит дополнение двояко, и ровно так же, как русский. Про игрушку — творительный без предлога: POBAWIĆ SIĘ LALKĄ, KLOCKAMI, как «поиграть куклой, кубиками». Про игру — предлог W с винительным: POBAWIĆ SIĘ W CHOWANEGO «поиграть в прятки», W BERKA «в салки», W DOM «в дочки-матери». Партнёр по игре идёт с Z и творительным: POBAWIĆ SIĘ Z BRATEM." }
  - { kind: pronunciation, text: "Читается «поба́вичь», три слога, ударение на втором, как и положено в польском — на предпоследнем. Конечное Ć даёт мягкое «чь», а не «ть»: в этом главное отличие от русского инфинитива. В формах прошедшего времени Ł звучит как «у»: POBAWIŁ это «поба́виу», POBAWIŁEM — «поба́виуэм». В страдательном причастии POBAWIONY слышно «побавё́ны», с ударением на третьем слоге, потому что оно опять предпоследнее." }
  - { kind: register, text: "Слово нейтральное и совершенно домашнее: так говорят с детьми и о детях. Самые частые обороты — DOBRZE SIĘ POBAWIĆ «хорошо повеселиться», POBAWIĆ SIĘ CHWILĘ «поиграть немного», IDŹ SIĘ POBAWIĆ «иди поиграй». Гнездо корня очень широкое и местами неожиданное: ZABAWNY «забавный», ROZBAWIĆ «рассмешить», WYBAWIĆ «избавить, выручить», ZBAWIĆ «спасти», ZBAWICIEL «Спаситель». Последние два показывают, как далеко от детской игры ушёл тот же корень." }
