notes:
  - { kind: false-friend, text: "KLEJNOT — «драгоценность», а не «клеймо» и не «клей». KLEJNOTY KORONNE — «королевские регалии». В переносном смысле — «жемчужина»: KLEJNOT ARCHITEKTURY. Бижутерия, украшения вообще — BIŻUTERIA." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Родительный — KLEJNOTU. В местном T переходит в C: W KLEJNOCIE." }
