formExamples:
  - form: "przedsięwziąć"
    pl: "Trzeba przedsięwziąć odpowiednie kroki."
    ru: "Нужно предпринять соответствующие шаги."
    source: { kind: authored }
  - form: "przedsięwziąć"
    pl: "Postanowili przedsięwziąć wyprawę."
    ru: "Они решили предпринять экспедицию."
    source: { kind: authored }
  - form: "przedsięwziąć"
    pl: "Nie wiedział, co przedsięwziąć."
    ru: "Он не знал, что предпринять."
    source: { kind: authored }
  - form: "przedsięwzięcia"
    pl: "Czerpała z tego przedsięwzięcia liczne korzyści."
    ru: "Она извлекла из этого предприятия немалую выгоду."
    source: { kind: translated, id: 448864 }
  - form: "przedsięwzięcia"
    pl: "Wszystkie jego przedsięwzięcia kończyły się bardziej lub mniej spektakularnymi porażkami."
    ru: "Все его начинания кончались более или менее громкими провалами."
    source: { kind: translated, id: 4156286 }
  - form: "przedsięwzięcia"
    pl: "Koszty przedsięwzięcia rosły."
    ru: "Расходы на начинание росли."
    source: { kind: authored }
  - form: "przedsięwzięcie"
    pl: "To jest ogromne przedsięwzięcie."
    ru: "Это огромное начинание."
    source: { kind: translated, id: 7707263 }
  - form: "przedsięwzięcie"
    pl: "To przedsięwzięcie chyba nie przyniesie zysku."
    ru: "Это начинание вряд ли принесёт прибыль."
    source: { kind: translated, id: 956717 }
  - form: "przedsięwzięcie"
    pl: "Przedsięwzięcie było od początku skazane na porażkę."
    ru: "Начинание было с самого начала обречено на провал."
    source: { kind: translated, id: 7707267 }
