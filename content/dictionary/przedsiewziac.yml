# review
id: przedsiewziac
format: 2
lemma: "przedsięwziąć"
rank: 2361
pos: verb
aspect: perf
pron: { cyr: "пшэтсе́нвзьонць" }
senses:
  - id: undertake
    ru: "предпринять"
    examples:
      - pl: "Trzeba przedsięwziąć odpowiednie kroki."
        ru: "Нужно предпринять соответствующие шаги."
        source: { kind: authored }
      - pl: "Przedsięwzięli śmiałą wyprawę."
        ru: "Они предприняли смелую экспедицию."
        source: { kind: authored }
      - pl: "Nic nie przedsięwzięto."
        ru: "Ничего не было предпринято."
        source: { kind: authored }
  - id: undertaking
    ru: "начинание, предприятие (przedsięwzięcie)"
    examples:
      - pl: "To jest ogromne przedsięwzięcie."
        ru: "Это огромное начинание."
        source: { kind: translated, id: 7707263 }
      - pl: "Czerpała z tego przedsięwzięcia liczne korzyści."
        ru: "Она извлекла из этого предприятия немалую выгоду."
        source: { kind: translated, id: 448864 }
notes:
  - { kind: government, text: "Винительный падеж: przedsięwziąć kroki «предпринять шаги», przedsięwziąć środki «принять меры»." }
  - { kind: usage, text: "Отглагольное существительное przedsięwzięcie «начинание, предприятие» встречается гораздо чаще самого глагола — в корпусе только оно и попадается." }
  - { kind: false-friend, text: "przed- + się + wziąć «взять», и wziąć уже есть в словаре. Русское «предпринять» собрано так же: «пред» + «принять»." }
  - { kind: usage, text: "Не путайте przedsięwzięcie «начинание» с przedsiębiorstwo «предприятие как фирма» — это разные слова." }
collocations:
  - { pl: "przedsięwziąć kroki", ru: "предпринять шаги" }
  - { pl: "śmiałe przedsięwzięcie", ru: "смелое начинание" }
etymology: "przed- + się + wziąć «взять»; русское «предпринять» собрано тем же способом."
memory: "przedsięwziąć — «предпринять», но в текстах чаще встречается имя przedsięwzięcie «начинание». Не путайте его с przedsiębiorstwo «фирма»."
