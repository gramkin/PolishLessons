# review
id: przedsiewziac
format: 2
lemma: "przedsięwziąć"
rank: 5645
pos: verb
aspect: perf
pron: { cyr: "пшэтсе́нвзьонць" }
senses:
  - id: undertake
    ru: "предпринять"
    examples:
      - pl: "Trzeba przedsięwziąć odpowiednie kroki."
        ru: "Нужно предпринять соответствующие шаги."
        source: { kind: authored }
      - pl: "Przedsięwzięli śmiałą wyprawę."
        ru: "Они предприняли смелую экспедицию."
        source: { kind: authored }
      - pl: "Nic nie przedsięwzięto."
        ru: "Ничего не было предпринято."
        source: { kind: authored }
  - id: undertaking
    ru: "начинание, предприятие (przedsięwzięcie)"
    examples:
      - pl: "To jest ogromne przedsięwzięcie."
        ru: "Это огромное начинание."
        source: { kind: translated, id: 7707263 }
      - pl: "Czerpała z tego przedsięwzięcia liczne korzyści."
        ru: "Она извлекла из этого предприятия немалую выгоду."
        source: { kind: translated, id: 448864 }
notes:
  - { kind: government, text: "Винительный падеж: przedsięwziąć kroki «предпринять шаги», przedsięwziąć środki «принять меры»." }
  - { kind: usage, text: "Отглагольное существительное przedsięwzięcie «начинание, предприятие» встречается гораздо чаще самого глагола — в корпусе только оно и попадается." }
  - { kind: false-friend, text: "przed- + się + wziąć «взять», и wziąć уже есть в словаре. Русское «предпринять» собрано так же: «пред» + «принять»." }
  - { kind: usage, text: "Не путайте przedsięwzięcie «начинание» с przedsiębiorstwo «предприятие как фирма» — это разные слова." }
  - { kind: government, text: "Повелительное наклонение — przedsięweź, от weź: формы przedsięweźmij в современном языке нет." }
collocations:
  - { pl: "przedsięwziąć kroki", ru: "предпринять шаги" }
  - { pl: "śmiałe przedsięwzięcie", ru: "смелое начинание" }
etymology: "przed- + się + wziąć «взять»; русское «предпринять» собрано тем же способом."
memory: "przedsięwziąć — «предпринять», но в текстах чаще встречается имя przedsięwzięcie «начинание». Не путайте его с przedsiębiorstwo «фирма»."
idioms:
  - { pl: "przedsięwziąć kroki", ru: "предпринять шаги" }
formExamplesSkip:
  - { form: "przedsięweźmij", reason: "форма образована генератором по ошибке. Глагол собран как przed- + się + wziąć, о чём говорит примечание к карточке, а повелительное наклонение от wziąć — weź, а не weźmij: правильная форма przedsięweź. На -weźmij опирается устаревший вариант" }
  - { form: "przedsięweźmijcie", reason: "форма образована генератором по ошибке. Глагол собран как przed- + się + wziąć, о чём говорит примечание к карточке, а повелительное наклонение от wziąć — weź, а не weźmij: правильная форма przedsięweź. На -weźmij опирается устаревший вариант" }
  - { form: "przedsięweźmijmy", reason: "форма образована генератором по ошибке. Глагол собран как przed- + się + wziąć, о чём говорит примечание к карточке, а повелительное наклонение от wziąć — weź, а не weźmij: правильная форма przedsięweź. На -weźmij опирается устаревший вариант" }
  - { form: "przedsięwzięci", reason: "страдательное причастие мужского лица, а предпринимают шаги, меры или экспедицию: примечание к карточке даёт przedsięwziąć kroki, przedsięwziąć środki. Человека не предпринимают, поэтому формы нет" }
