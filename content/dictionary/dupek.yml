# review
id: dupek
format: 2
lemma: "dupek"
rank: 820
pos: noun
pron: { cyr: "ду́пэк" }
senses:
  - id: jerk
    ru: "мудак, козёл, придурок"
    examples:
      - pl: "Dupek!"
        ru: "Козёл!"
        source: { kind: translated, id: 6160564 }
      - pl: "To dupek."
        ru: "Это козёл."
        source: { kind: translated, id: 12060519 }
      - pl: "Co za dupek!"
        ru: "Вот козёл!"
        source: { kind: translated, id: 497404 }
      - pl: "Nie bądź dupkiem."
        ru: "Не будь козлом."
        source: { kind: translated, id: 5487851 }
      - pl: "Mój szef jest dupkiem."
        ru: "Мой начальник — козёл."
        source: { kind: translated, id: 11717127 }
      - pl: "Ty nadęty dupku!"
        ru: "Ты надутый козёл!"
        source: { kind: translated, id: 6533113 }
  - id: self-deprecating
    ru: "о себе: дурак, ничтожество"
    examples:
      - pl: "Może jestem dupkiem."
        ru: "Может, я и козёл."
        source: { kind: translated, id: 4441323 }
      - pl: "Jestem bezużytecznym dupkiem."
        ru: "Я никчёмный дурак."
        source: { kind: translated, id: 547921 }
      - pl: "To dupek, ale i tak go kocham."
        ru: "Он козёл, но я всё равно его люблю."
        source: { kind: translated, id: 12567518 }
notes:
  - { kind: register, text: "Грубое ругательство о человеке, примерно как русские «мудак» и «козёл». Образовано от dupa, но обозначает уже не часть тела, а человека." }
  - { kind: usage, text: "Звательный падеж dupku живёт в прямом обращении: Ty nadęty dupku! «Ты надутый козёл!»." }
  - { kind: usage, text: "Nie bądź dupkiem «Не будь козлом» — обычная реплика в ссоре, чуть мягче прямого оскорбления." }
collocations:
  - { pl: "co za dupek", ru: "вот козёл" }
  - { pl: "nie bądź dupkiem", ru: "не будь козлом" }
  - { pl: "ty dupku", ru: "ты козёл" }
etymology: "Уменьшительное от dupa «жопа» с суффиксом -ek, переосмысленное как обозначение человека. Русское «жопа» такого производного не дало — ближайшие соответствия «мудак» и «козёл» образованы иначе."
memory: "dupek — «мудак, козёл», от dupa. В прямом обращении — звательный: Ty dupku!"
idioms:
  - { pl: "co za dupek", ru: "вот козёл" }
  - { pl: "nie bądź dupkiem", ru: "не будь козлом" }
  - { pl: "ty dupku", ru: "ты козёл" }
