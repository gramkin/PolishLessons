# review
id: wzglad
format: 2
lemma: "wzgląd"
rank: 1040
pos: noun
pron: { cyr: "взглонт" }
senses:
  - id: because-of
    ru: "ze względu na — из-за, ради, с учётом"
    examples:
      - pl: "Zostałem w domu ze względu na pogodę."
        ru: "Я остался дома из-за погоды."
        source: { kind: translated, id: 8668754 }
      - pl: "Jestem tutaj tylko ze względu na ciebie."
        ru: "Я здесь только ради тебя."
        source: { kind: translated, id: 13694061 }
      - pl: "Nie mogliśmy wyjść ze względu na deszcz."
        ru: "Мы не могли выйти из-за дождя."
        source: { kind: translated, id: 1971881 }
  - id: regardless
    ru: "bez względu na — несмотря на, независимо от"
    examples:
      - pl: "Zrobię to bez względu na konsekwencje."
        ru: "Я сделаю это, невзирая на последствия."
        source: { kind: translated, id: 2679715 }
      - pl: "Nie wolno dyskryminować ludzi ze względu na płeć."
        ru: "Нельзя дискриминировать людей по признаку пола."
        source: { kind: translated, id: 352661 }
      - pl: "Ze względów bezpieczeństwa i prywatności nie mam Facebook na swoim telefonie."
        ru: "По соображениям безопасности и приватности у меня нет фейсбука в телефоне."
        source: { kind: translated, id: 12211795 }
  - id: in-respect
    ru: "pod tym względem — в этом отношении"
    examples:
      - pl: "Pod tym względem różnimy się."
        ru: "В этом отношении мы различаемся."
        source: { kind: translated, id: 852772 }
      - pl: "Jest perfekcyjna pod każdym względem."
        ru: "Она безупречна во всех отношениях."
        source: { kind: translated, id: 4145058 }
      - pl: "Pod pewnymi względami jest mądry."
        ru: "В некоторых отношениях он умён."
        source: { kind: translated, id: 758310 }
notes:
  - { kind: usage, text: "Слово почти не употребляется само по себе: оно живёт в застывших оборотах. Главные три — ze względu na, bez względu na, pod tym względem." }
  - { kind: government, text: "ze względu NA coś «из-за чего-то, ради чего-то» — предлог na с винительным. А bez względu na coś значит «несмотря на»." }
  - { kind: usage, text: "pod tym względem «в этом отношении», pod każdym względem «во всех отношениях», pod wieloma względami «во многих отношениях»." }
  - { kind: usage, text: "w tym względzie — «в этом вопросе», книжный вариант того же оборота: Zgadzam się z tobą w tym względzie." }
collocations:
  - { pl: "ze względu na", ru: "из-за, ради" }
  - { pl: "bez względu na", ru: "несмотря на" }
  - { pl: "pod tym względem", ru: "в этом отношении" }
  - { pl: "pod każdym względem", ru: "во всех отношениях" }
family:
  - { pl: "względny", ru: "относительный", relation: derived }
  - { pl: "uwzględnić", ru: "учесть", relation: derived }
etymology: "От glądać «смотреть» — того же корня, что русское «взгляд» и «оглядываться». Но польское слово ушло в служебные обороты и почти утратило самостоятельность."
memory: "wzgląd сам по себе почти не употребляется — он живёт в трёх оборотах: ze względu na «из-за, ради», bez względu na «несмотря на» и pod tym względem «в этом отношении». Их и надо учить целиком."
idioms:
  - { pl: "ze względu na", ru: "из-за, ради" }
  - { pl: "bez względu na", ru: "несмотря на" }
  - { pl: "pod każdym względem", ru: "во всех отношениях" }
formExamplesSkip:
