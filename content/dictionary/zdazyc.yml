# review
id: zdazyc
format: 2
lemma: "zdążyć"
rank: 1817
pos: verb
aspect: perf
pron: { cyr: "здо́нжыць" }
senses:
  - id: make-it
    ru: "успеть (на транспорт, к сроку)"
    examples:
      - pl: "Wstałam wcześnie by zdążyć na pociąg."
        ru: "Я встал пораньше, чтобы успеть на поезд."
        source: { kind: tatoeba, id: 3461123 }
      - pl: "Zdążyłem na pociąg."
        ru: "Я успел на поезд."
        source: { kind: translated, id: 749247 }
      - pl: "Zdążył na lekcję."
        ru: "Он успел на урок."
        source: { kind: translated, id: 958922 }
  - id: not-make-it
    ru: "не успеть (в отрицании)"
    examples:
      - pl: "Nie zdążyłem."
        ru: "Я не успел."
        source: { kind: tatoeba, id: 9427026 }
      - pl: "Niestety nie zdążyłam na czas."
        ru: "К сожалению, я не успела вовремя."
        source: { kind: tatoeba, id: 6328203 }
      - pl: "Nie zdążysz tam na czas."
        ru: "Ты не успеешь туда вовремя."
        source: { kind: translated, id: 527499 }
notes:
  - { kind: government, text: "Успеть на что-то — zdążyć na coś (винительный с na): zdążyć na pociąg «успеть на поезд», zdążyć na czas «успеть вовремя»." }
  - { kind: usage, text: "Очень часто в отрицании: nie zdążę «я не успею», nie zdążysz «ты не успеешь». Это одно из самых ходовых слов о времени." }
  - { kind: usage, text: "Перед инфинитивом значит «успеть сделать»: nie zdążyłem wykonać ćwiczenia «я не успел сделать упражнение»." }
  - { kind: false-friend, text: "Не путайте с zdarzyć się «случиться»: слова различаются одной буквой, а значения не пересекаются вовсе." }
collocations:
  - { pl: "zdążyć na pociąg", ru: "успеть на поезд" }
  - { pl: "zdążyć na czas", ru: "успеть вовремя" }
  - { pl: "nie zdążę", ru: "я не успею" }
family:
  - { pl: "zdążać", ru: "поспевать", relation: root }
  - { pl: "spóźnić się", ru: "опоздать", relation: root, id: spoznic }
  - { pl: "zdarzyć się", ru: "случиться", relation: root, id: zdarzyc }
etymology: "Приставка z- плюс dążyć «стремиться, направляться»: буквально «достичь вовремя». Русское «успеть» построено от «спеть, поспеть» — образ близкий."
memory: "zdążyć — «успеть»: zdążyć na pociąg, zdążyć na czas. Очень часто в отрицании: nie zdążę. Не путайте с zdarzyć się «случиться»."
