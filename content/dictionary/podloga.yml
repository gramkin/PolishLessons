notes:
  - { kind: false-friend, text: "Главная ловушка: podłoga — это только «пол» как поверхность. «Пол» в смысле мужской или женский — płeć, совсем другое слово. Русское «пол» покрывает оба значения, польский их разводит." }
  - { kind: usage, text: "Женский род, и в предложном падеже чередование g→dz: na podłodze «на полу»." }
  - { kind: usage, text: "Ходовые сочетания: myć podłogę «мыть пол», zamiatać podłogę «подметать пол», spać na podłodze «спать на полу»." }
  - { kind: usage, text: "Не путайте с родственным podłoże «основание, подоплёка»: podłoże konfliktu «подоплёка конфликта»." }
collocations:
  - { pl: "na podłodze", ru: "на полу" }
  - { pl: "myć podłogę", ru: "мыть пол" }
  - { pl: "drewniana podłoga", ru: "деревянный пол" }
etymology: "Приставка pod- и корень со значением «лежать»: буквально «то, что подложено под ноги». Русское «пол» — совсем другое слово, так что опоры на родство здесь нет."
memory: "podłoga — «пол», но только как поверхность: «пол» мужской или женский это płeć, отдельное слово. Предложный с чередованием: na podłodze."
idioms:
