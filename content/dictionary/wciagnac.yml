notes:
  - { kind: usage, text: "Глагол относится к классу на -NĄĆ, и у него суффикс в прошедшем времени сохраняется: WCIĄGNĄŁ, WCIĄGNĘŁA, WCIĄGNĘLI. Так же ведут себя PRZESUNĄĆ и POCIĄGNĄĆ. Исключением в этом классе оказывается PĘKNĄĆ, которое суффикс теряет и даёт PĘKŁ, а не pęknął. То есть сохранение суффикса здесь правило, а утрата — особенность отдельных глаголов, и помнить надо именно их." }
  - { kind: pronunciation, text: "Мена ą и ę видна в двух местах сразу. В прошедшем времени WCIĄGNĄŁ стоит с ą, потому что слог закрыт согласным ł, а WCIĄGNĘŁA и WCIĄGNĘLI — с ę, потому что за ł идёт гласная. И в страдательном причастии стоит ę: WCIĄGNIĘTY, WCIĄGNIĘTA. Это четвёртый случай позиционной мены в словаре после URZĄD, ŚWIĘTO и UJĄĆ, и правило всюду одно: закрытый слог даёт ą, открытый ę." }
  - { kind: usage, text: "Повелительное наклонение по инфинитиву не угадывается, и три совершенных глагола из последних партий дают три разных образца. ZYSKAĆ даёт ZYSKAJ с -aj, PRZYŁĄCZYĆ даёт PRZYŁĄCZ без всякой гласной, а WCIĄGNĄĆ даёт WCIĄGNIJ с -ij. Вид у всех трёх один и тот же, значит дело не в нём, а в спряжении. Выводится она, однако, не из инфинитива, а из третьего лица единственного числа настоящего или будущего: wciągnie даёт wciągnij. Правило разобрано в карточке KARMIĆ." }
  - { kind: government, text: "Управление двойное и смыслы расходятся. WCIĄGNĄĆ COŚ с винительным значит физически втянуть: wciągnąć linę, wciągnąć łódź, wciągnąć brzuch, wciągnąć powietrze «вдохнуть». WCIĄGNĄĆ KOGOŚ W COŚ, тоже с винительным после w, значит «вовлечь»: wciągnąć kogoś w spór, w aferę, w rozmowę. Корень при этом русскому знаком насквозь: CIĄGNĄĆ отвечает русскому «тянуть», а wciągnąć — «втянуть», приставка в приставку." }
collocations:
  - { pl: "wciągnąć powietrze", ru: "вдохнуть" }
  - { pl: "wciągnąć brzuch", ru: "втянуть живот" }
  - { pl: "wciągnąć kogoś do rozmowy", ru: "вовлечь в разговор" }
family:
  - { pl: "ciągnąć", ru: "тянуть", relation: root, id: ciagnac }
  - { pl: "wciągać", ru: "втягивать", relation: aspect }
etymology: "Приставка w- и CIĄGNĄĆ «тянуть», из праславянского *tęgnǫti — того же корня, что русские «тянуть», «тяга» и «втянуть». Соответствие полное и по корню, и по приставке: wciągnąć это в точности «втянуть», и переносное значение «вовлечь» у обоих языков тоже совпадает. Такие слова стоит отмечать: учить в них нечего, кроме чередования ą и ę в прошедшем времени."
memory: "Суффикс -ną- в прошедшем сохраняется: wciągnął, wciągnęła — не как pękł. Повелительное wciągnij с -ij, а не zyskaj с -aj. И корень тот же, что «тянуть»."
idioms:
