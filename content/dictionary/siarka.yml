notes:
  - { kind: government, text: "Женский род: ta siarka, tej siarki. Как название вещества обычно без множественного числа." }
  - { kind: false-friend, text: "Корень общий с русским «серый»: сера названа по цвету. Но польское siarka и русское «сера» разошлись в написании до неузнаваемости." }
  - { kind: usage, text: "Прилагательное siarkowy: kwas siarkowy «серная кислота»." }
  - { kind: usage, text: "Химический символ S, элемент номер 16." }
collocations:
