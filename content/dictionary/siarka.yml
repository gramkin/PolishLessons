  - { pl: "ogień i siarka", ru: "огонь и сера" }
etymology: "Праславянское *sěra, по цвету — ср. русское «серый», «сера»."
memory: "siarka — «сера». Корень тот же, что в русском «серый»: вещество названо по цвету. Kwas siarkowy — «серная кислота»."
