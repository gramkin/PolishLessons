# review
id: czarny
format: 2
lemma: "czarny"
rank: 513
pos: adj
pron: { cyr: "ча́рны" }
senses:
  - id: colour
    ru: "чёрный (цвет)"
    examples:
      - pl: "Wrony są czarne."
        ru: "Вороны чёрные."
        source: { kind: tatoeba, id: 5489369 }
      - pl: "Kawa jest czarna."
        ru: "Кофе чёрный."
        source: { kind: tatoeba, id: 8768769 }
      - pl: "Twój kot jest czarny."
        ru: "Твой кот чёрный."
        source: { kind: tatoeba, id: 3239452 }
  - id: figurative
    ru: "чёрный в переносном смысле: мрачный, тяжёлый"
    examples:
      - pl: "To był czarny dzień."
        ru: "Это был чёрный день."
        source: { kind: authored }
      - pl: "Czarne myśli nie dają mi spać."
        ru: "Чёрные мысли не дают мне спать."
        source: { kind: authored }
      - pl: "Odkłada pieniądze na czarną godzinę."
        ru: "Он откладывает деньги на чёрный день."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Откладывают na czarną godzinę — по-польски «на чёрный час», а не «на чёрный день». Русское выражение считает днями, польское — часами." }
  - { kind: false-friend, text: "czarny charakter — это «злодей» в пьесе или фильме, а не «чёрный характер»." }
  - { kind: usage, text: "Степени сравнения образуются обычным способом: czarny — czarniejszy — najczarniejszy, как русские «чёрный — чернее — самый чёрный»." }
  - { kind: usage, text: "Как и в русском, цвет напитков передаётся тем же словом: czarna kawa «чёрный кофе», czarna herbata «чёрный чай». А czarni как существительное значит «чернокожие»." }
collocations:
  - { pl: "czarna kawa", ru: "чёрный кофе" }
  - { pl: "czarna godzina", ru: "чёрный день" }
  - { pl: "czarny charakter", ru: "злодей" }
  - { pl: "czarne myśli", ru: "чёрные мысли" }
etymology: "Праславянское *čьrnъ; русское «чёрный» — то же самое слово, ср. чешское černý и сербохорватское crn."
memory: "czarny — «чёрный», слово прозрачное, но обороты расходятся. Откладывают na czarną godzinę — по-польски «на чёрный час», а не «на чёрный день». А czarny charakter — это «злодей» в пьесе или фильме. Степени сравнения обычные: czarny — czarniejszy — najczarniejszy."
idioms:
  - { pl: "czarna godzina", ru: "чёрный день" }
  - { pl: "czarny charakter", ru: "злодей" }
  - { pl: "czarny jak smoła", ru: "чёрный как смоль" }
