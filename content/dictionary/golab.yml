notes:
  - { kind: false-friend, text: "Слово то же, что русский «голубь», но на письме и на слух родство спрятано. Ł читается как «у», а носовое Ą перед B даёт «ом», поэтому GOŁĄB звучит «го́уомп», с оглушением конечного B. В косвенных падежах носовое меняется на Ę: GOŁĄB, но GOŁĘBIA. Это то же чередование, что в ZĄB — ZĘBY и DĄB — DĘBY, и знать его стоит для всего разряда." }
  - { kind: usage, text: "Десять форм, мужской род. Чередование Ą и Ę делит парадигму надвое: именительный GOŁĄB стоит особняком, а все остальные формы идут от основы GOŁĘBI-. Винительный единственного GOŁĘBIA совпадает с родительным, потому что птицы в польском одушевлённые. Прилагательное GOŁĘBI значит «голубиный», а GOŁĘBIE SERCE — «голубиное сердце», о кротком человеке." }
  - { kind: government, text: "Кормить голубей — KARMIĆ GOŁĘBIE, винительный множественного без предлога, как и по-русски. Сыпать голубям — SYPAĆ GOŁĘBIOM, дательный без предлога. Голубь мира — GOŁĄB POKOJU, родительный без предлога. Над голубями — NAD GOŁĘBIAMI, предлог NAD с творительным множественного." }
  - { kind: pronunciation, text: "Читается «го́уомп», два слога, ударение на первом, и от написания остаётся мало. Ł даёт «у», носовое Ą перед губным B даёт «ом», а конечное B оглушается до «п». В косвенных падежах всё меняется: GOŁĘBIA звучит «гоуе́мбя», потому что Ę перед B даёт «эм», а BI даёт мягкое «бя». Две формы одного слова на слух почти не связаны." }
  - { kind: register, text: "Слово нейтральное и повседневное: GOŁĘBIE NA RYNKU, KARMIĆ GOŁĘBIE, GOŁĘBNIK «голубятня». Разведение почтовых голубей в Польше настоящее народное увлечение, особенно в Силезии, и слово HODOWCA GOŁĘBI звучит с уважением. Оборот GOŁĄB POKOJU принадлежит языку плакатов и газет, а GOŁĘBIE SERCE звучит ласково и слегка старомодно." }
