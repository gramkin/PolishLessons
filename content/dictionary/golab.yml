etymology: "Праславянское слово, то же, что русский «голубь», и восходит оно к названию цвета: голубой, сизый. Корень тот же, что в русском «голубом», и птица названа по окраске перьев. Польское Ł на месте русского «л» обычно для этого корня, а чередование носовых Ą и Ę в парадигме чисто польское: в русском носовые исчезли, и мы говорим «голубь — голубя» без всяких перемен."
memory: "То же слово, что русский «голубь», и названы оба по цвету, от того же корня, что «голубой». Но прочесть его трудно: ł даёт «у», ą перед b даёт «ом», конечное b оглушается, и выходит «го́уомп». В косвенных падежах носовое меняется на ę: gołębia, «гоуе́мбя». Это то же чередование, что в ząb — zęby. Оборот gołąb pokoju совпадает с русским."
idioms:
  - { pl: "gołąb pokoju", ru: "голубь мира" }
