etymology: "От MASA, взятого через латинское MASSA из греческого, где слово значило «тесто, комок». Русская «масса» пришла тем же путём, поэтому корень общий. На нём оба языка построили похожие гнёзда, но с разными смыслами на концах: польское MASÓWKA это сходка, а русская «массовка» — люди в кадре. Один суффикс, два совсем разных образа одной толпы."
memory: "Массовый, корень тот же, что в «массе». Читается «масо́вы». Главное сочетание разберите по частям: srodki masowego przekazu это «средства массовой информации», где masowego согласуется с przekazu. И не обманитесь на masowka: по-польски это митинг, сходка, а наша киношная «массовка» — statysci."
idioms:
