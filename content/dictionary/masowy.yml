notes:
  - { kind: false-friend, text: "Прилагательное отвечает русскому «массовый», а вот в гнезде спрятана настоящая ловушка. MASÓWKA по-польски — это массовое собрание, митинг, сходка, а вовсе не наша «массовка» в кино: киношную массовку поляки называют STATYŚCI. И запомните разговорное MASA в значении «уйма»: MASA LUDZI значит «уйма народу», совсем как у нас «масса народу»." }
  - { kind: usage, text: "В таблице одиннадцать форм, но живых десять. Одиннадцатая — MASOWI, именительный множественного для мужчин-людей, и её не употребляют: прилагательное относительное, оно описывает производство, культуру или мероприятие, а не человека. Примеров к этой форме в карточке поэтому нет. Прилагательное стоит после существительного: PRODUKCJA MASOWA, KULTURA MASOWA." }
  - { kind: government, text: "Самое важное сочетание разберите по частям: ŚRODKI MASOWEGO PRZEKAZU, буквально «средства массовой передачи», где MASOWEGO стоит в родительном и согласуется с PRZEKAZU, а не со ŚRODKI. Поляки сокращают это до трёх букв, ŚMP, но чаще говорят просто MEDIA. В массовом масштабе — NA MASOWĄ SKALĘ, предлог NA с винительным." }
  - { kind: pronunciation, text: "Читается «масо́вы», три слога, ударение на предпоследнем. Буква S между гласными не озвончается, поэтому середина слова это «со», а не «зо». Конечная Y даёт «ы». В женском роде MASOWA это «масо́ва», в среднем MASOWE — «масо́вэ», с «э» на конце, а MASOWĄ звучит «масо́вон», с носовым на конце." }
  - { kind: register, text: "Слово нейтральное, из языка экономики, социологии и новостей. Частые сочетания — PRODUKCJA MASOWA, KULTURA MASOWA, TURYSTYKA MASOWA, WYDARZENIE MASOWE «массовое мероприятие», и последнее стоит в законе о безопасности таких мероприятий. Наречие MASOWO значит «массово, толпами»: LUDZIE WYJEŻDŻAJĄ MASOWO значит «люди уезжают массово»." }
