  - { kind: pronunciation, text: "Читается по-английски, через ш: «шика́го». Написание при этом остаётся английским." }
  - { kind: usage, text: "Слово среднего рода, поэтому согласование идёт по среднему: całe Chicago «весь Чикаго»." }
  - { kind: usage, text: "В Польше Чикаго знают как город с огромной польской диаспорой — одну из крупнейших в мире." }
