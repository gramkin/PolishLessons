# review
id: zebrac
format: 2
lemma: "zebrać"
rank: 1032
pos: verb
aspect: perf
pron: { cyr: "зэ́браць" }
senses:
  - id: gather-things
    ru: "собрать (вещи, информацию, урожай)"
    examples:
      - pl: "Musimy zebrać informacje."
        ru: "Нам надо собрать информацию."
        source: { kind: translated, id: 3856287 }
      - pl: "Zebrał kosz grzybów."
        ru: "Он собрал корзину грибов."
        source: { kind: translated, id: 12721024 }
      - pl: "Zebrała kwiaty."
        ru: "Она собрала цветы."
        source: { kind: translated, id: 10600856 }
  - id: gather-people
    ru: "zebrać się — собраться (о людях)"
    examples:
      - pl: "Uczący się zebrali się przed szkołą."
        ru: "Учащиеся собрались перед школой."
        source: { kind: translated, id: 5907122 }
      - pl: "Członkowie klubu zebrali się w sali konferencyjnej."
        ru: "Члены клуба собрались в конференц-зале."
        source: { kind: translated, id: 369051 }
      - pl: "Zebrało się dużo ludzi."
        ru: "Собралось много людей."
        source: { kind: translated, id: 868617 }
  - id: future-stem
    ru: "будущее время: zbiorę, zbierzesz, zbierze"
    note: "Основа меняется с zebr- на zbier-/zbior-."
    examples:
      - pl: "Zbiorę swoją pszenicę w lipcu."
        ru: "Я соберу свою пшеницу в июле."
        source: { kind: translated, id: 2809469 }
      - pl: "Jak posiejesz, tak zbierzesz."
        ru: "Что посеешь, то и пожнёшь."
        source: { kind: translated, id: 525128 }
      - pl: "Ziarnko do ziarnka i zbierze się miarka."
        ru: "Зёрнышко к зёрнышку — и наберётся мерка."
        source: { kind: translated, id: 1349343 }
notes:
  - { kind: usage, text: "Основа в будущем времени меняется полностью: инфинитив zebrać, но zbiorę, zbierzesz, zbierze, zbierzemy, zbiorą. Эти две основы надо запомнить вместе." }
  - { kind: usage, text: "Возвратное zebrać się значит «собраться» о людях: Zebrało się dużo ludzi «Собралось много народу». О себе — «собраться с силами»: zebrać myśli «собраться с мыслями»." }
  - { kind: usage, text: "Несовершенный вид — zbierać. Отсюда же zbiór «сбор, урожай» и zbiórka «сбор средств»." }
  - { kind: usage, text: "Jak posiejesz, tak zbierzesz — «что посеешь, то и пожнёшь». Пословица совпадает с русской дословно." }
collocations:
  - { pl: "zebrać informacje", ru: "собрать информацию" }
  - { pl: "zebrać się", ru: "собраться" }
  - { pl: "zebrać myśli", ru: "собраться с мыслями" }
  - { pl: "zebrać podpisy", ru: "собрать подписи" }
family:
  - { pl: "zbierać", ru: "собирать", relation: aspect }
  - { pl: "zbiór", ru: "сбор, урожай", relation: derived }
  - { pl: "brać", ru: "брать", relation: root }
etymology: "Приставка ze- + brać «брать», праславянское *bьrati. Русское «собрать» собрано ровно так же: «с-» плюс «брать»."
memory: "zebrać — «собрать», но основа в будущем меняется целиком: zebrać, а вот zbiorę, zbierzesz, zbierze. Возвратное zebrać się значит «собраться». И пословица: Jak posiejesz, tak zbierzesz."
idioms:
  - { pl: "zebrać myśli", ru: "собраться с мыслями" }
  - { pl: "jak posiejesz, tak zbierzesz", ru: "что посеешь, то и пожнёшь" }
  - { pl: "ziarnko do ziarnka, a zbierze się miarka", ru: "с миру по нитке" }
