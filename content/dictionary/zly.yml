# review
id: zly
format: 2
lemma: "zły"
rank: 145
pos: adj
pron: { cyr: "злы" }
senses:
  - id: bad
    ru: "плохой, дурной"
    examples:
      - pl: "Mam dla was złe wieści."
        ru: "У меня для вас плохие новости."
        source: { kind: tatoeba, id: 3743820 }
      - pl: "Może się stać coś złego."
        ru: "Может случиться что-то плохое."
        source: { kind: tatoeba, id: 6154990 }
      - pl: "To zły pomysł."
        ru: "Это плохая идея."
        source: { kind: authored }
  - id: angry
    ru: "злой, сердитый (zły na kogoś — на кого-либо)"
    examples:
      - pl: "Jesteś zły?"
        ru: "Ты сердишься?"
        source: { kind: tatoeba, id: 975963 }
      - pl: "Byłem zły na Toma."
        ru: "Я был зол на Тома."
        source: { kind: tatoeba, id: 10747406 }
      - pl: "Jesteś zła na Toma?"
        ru: "Ты злишься на Тома?"
        source: { kind: tatoeba, id: 6554170 }
  - id: wrong
    ru: "не тот, неправильный"
    note: "Там, где русский говорит «не тот», польский обходится словом zły."
    examples:
      - pl: "Wybrałeś zły numer."
        ru: "Ты набрал не тот номер."
        source: { kind: authored }
      - pl: "To zła droga."
        ru: "Это не та дорога."
        source: { kind: authored }
      - pl: "Wsiadłem do złego autobusu."
        ru: "Я сел не в тот автобус."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Одно польское слово покрывает три русских: «плохой» (zła pogoda), «злой» (zły na mnie) и «не тот» (zły numer)." }
  - { kind: government, text: "Злость на кого-то — zły na kogoś, с предлогом na и винительным падежом: Jestem zły na brata." }
  - { kind: usage, text: "Степени сравнения супплетивные: zły — gorszy — najgorszy, как русское «плохой — хуже — худший»." }
collocations:
  - { pl: "zła pogoda", ru: "плохая погода" }
  - { pl: "zły humor", ru: "плохое настроение" }
  - { pl: "zły numer", ru: "не тот номер" }
  - { pl: "nic złego", ru: "ничего плохого" }
etymology: "Праславянское *zъlъ — то же слово, что русское «злой», но в польском первое значение «плохой». Степени сравнения от другого корня: gorszy, как русское «хуже»."
memory: "Одно слово вместо трёх русских: zły — «плохой» (zła pogoda), «злой» (zły na mnie) и «не тот» (zły numer). Цепочка неправильная: zły — gorszy — najgorszy."
idioms:
  - { pl: "brać coś za złe", ru: "обижаться на что-либо" }
  - { pl: "być złej myśli", ru: "ждать худшего" }
  - { pl: "zły jak osa", ru: "злой как оса" }
