pron: { cyr: "вє́чне" }
senses:
  - id: forever
    ru: "вечно, навсегда"
    examples:
      - pl: "Nic nie trwa wiecznie."
        ru: "Ничто не длится вечно."
        source: { kind: authored }
      - pl: "Będę ci wiecznie wdzięczny."
        ru: "Я буду тебе вечно благодарен."
        source: { kind: authored }
  - id: constantly
    ru: "вечно, постоянно (с укором)"
    examples:
      - pl: "Wiecznie się spóźnia."
        ru: "Он вечно опаздывает."
        source: { kind: authored }
      - pl: "Wiecznie narzeka na pogodę."
        ru: "Он вечно жалуется на погоду."
        source: { kind: authored }
  - id: eternally
    ru: "вечно (о неизменном)"
    examples:
      - pl: "Pozostał wiecznie młody duchem."
        ru: "Он остался вечно молод душой."
        source: { kind: authored }
notes:
  - { kind: usage, text: "У НАРЕЧИЯ ТОТ ЖЕ УПРЁК, ЧТО У РУССКОГО. Wiecznie się spóźnia значит не «всегда», а именно «вечно», с досадой: привычка, которая раздражает. В нейтральном смысле «всегда» говорят ZAWSZE, а «навсегда» — NA ZAWSZE. Wiecznie держится между торжественным и ворчливым." }
  - { kind: false-friend, text: "Корень общий и прозрачный: wieczny от wiek «век», как русское «вечный» от «века». Но польское WIEK значит ещё и «возраст»: w jego wieku — «в его возрасте». Так что wiek это и век, и возраст, а русский различает их двумя словами." }
  - { kind: pronunciation, text: "Три слога, ударение на предпоследнем: wiecz-NIE, точнее WIECZ-nie. Wie читается как «вє», cz как ч, ni как нь: «вє́чне». Прилагательное wieczny звучит «вє́чны»." }
