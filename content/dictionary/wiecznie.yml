etymology: "От wieczny «вечный», от wiek «век», из праславянского *věkъ. Русские «век» и «вечный» — те же слова. Исходное значение корня — «сила, жизненный срок», отсюда и латышское veikt «успевать», и немецкое Weile «время»."
memory: "wiecznie — «вечно», и с тем же укором, что по-русски: wiecznie się spóźnia. Нейтральное «всегда» будет zawsze. Корень тот же, что в wiek «век», только польское wiek значит ещё и «возраст»."
