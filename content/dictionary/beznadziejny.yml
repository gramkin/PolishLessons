notes:
  - { kind: false-friend, text: "Редкий случай, когда слово разбирается на части одинаково в двух языках. BEZ отвечает русскому «без», NADZIEJA — «надежда», суффикс -NY — «-ный»: BEZNADZIEJNY и «безнадёжный» собраны из одних и тех же трёх частей в одном порядке. Совпадает и первое значение. Расходится второе: по-польски слово сильно обытовилось и значит просто «ужасный, никуда не годный», причём о чём угодно — POGODA BEZNADZIEJNA, FILM BEZNADZIEJNY, JESTEM BEZNADZIEJNY W MATEMATYCE. Русское «безнадёжный» так не употребляется, там нужно «ужасный» или «никакой»." }
  - { kind: usage, text: "Два значения различает предмет. О положении, болезни, деле — прямое «безнадёжный»: SYTUACJA BEZNADZIEJNA, PRZYPADEK BEZNADZIEJNY. О погоде, фильме, собственных способностях — разговорное «ужасный»: и в этом смысле слово употребляется постоянно, особенно о себе, JESTEM BEZNADZIEJNY W CZYMŚ. В черновике одиннадцать форм, то есть одна положительная степень; формы BEZNADZIEJNIEJSZY и NAJBARDZIEJ BEZNADZIEJNY в языке возможны, но редки, потому что само значение уже предельное." }
  - { kind: pronunciation, text: "Читается «безнадзе́йны», с ударением на предпоследнем слоге. Главное место — сочетание dzi, которое даёт мягкое «дзь»: не «безнадейны» и не «безнадзийны», а «безнадзе́йны». Русское «надежда» имеет в этом месте ж, польское NADZIEJA — dz, и это регулярное соответствие: там, где русский дал ж из праславянского *dj, польский дал dz. Сравните CUDZY и «чужой», MIEDZA и «межа»." }
  - { kind: government, text: "В чём безнадёжен — предлог W с предложным падежом: BEZNADZIEJNY W MATEMATYCE, BEZNADZIEJNY W GOTOWANIU. Русский тут говорит то же, «безнадёжен в математике», так что перенос прямой. Прилагательное согласуется с существительным и своего управления не имеет. Наречие — BEZNADZIEJNIE, и оно употребляется как усилитель: BEZNADZIEJNIE ZAKOCHANY «безнадёжно влюблённый», где оба языка совпадают целиком." }
