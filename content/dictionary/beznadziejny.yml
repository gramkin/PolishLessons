etymology: "Сложение предлога BEZ и существительного NADZIEJA с суффиксом -NY: буквально «тот, в котором нет надежды». NADZIEJA восходит к праславянскому *na-děja, от корня со значением «ставить, полагать», — надежда есть то, на что полагаются. Русское «надежда» того же корня, только с церковнославянским жд вместо исконного ж; народная форма «надёжа» показывает исходный вид. Польское dz на этом месте — закономерный исход того же праславянского *dj, поэтому NADZIEJA и «надежда» отличаются ровно одним согласным. Всё слово целиком — калька, собранная в обоих языках независимо из одних частей."
memory: "Разбирается как русское: bez плюс nadzieja плюс -ny. Но второе значение шире — разговорное «ужасный»: pogoda beznadziejna, jestem beznadziejny w matematyce. Соответствие согласных: польское dz — русское ж, nadzieja и «надежда», cudzy и «чужой»."
