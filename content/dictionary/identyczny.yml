# review
id: identyczny
format: 2
lemma: "identyczny"
rank: 4626
pos: adj
pron: { cyr: "идэнты́чны" }
senses:
  - id: identical
    ru: "одинаковый, идентичный, точно такой же"
    examples:
      - pl: "Mamy identyczne kurtki."
        ru: "У нас одинаковые куртки."
        source: { kind: authored }
      - pl: "Jego podpis jest identyczny jak ojca."
        ru: "Его подпись точно такая же, как у отца."
        source: { kind: authored }
      - pl: "Oba domy są identyczne, różnią się tylko kolorem."
        ru: "Оба дома одинаковые, отличаются только цветом."
        source: { kind: authored }
  - id: same-as
    ru: "тот же самый (совпадающий с образцом)"
    examples:
      - pl: "Kopia musi być identyczna z oryginałem."
        ru: "Копия должна совпадать с оригиналом."
        source: { kind: authored }
      - pl: "Wynik był identyczny z poprzednim."
        ru: "Результат совпал с предыдущим."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Русское «идентичный» — слово книжное, в быту говорят «одинаковый». Польское IDENTYCZNY вполне разговорное: MAMY IDENTYCZNE BUTY, «у нас одинаковые ботинки». Есть и чисто польское JEDNAKOWY и TAKI SAM. IDENTYCZNY подчёркивает полное совпадение до мелочей." }
  - { kind: usage, text: "Степеней сравнения нет. Все одиннадцать форм живые. Форма для мужчин-людей IDENTYCZNI встречается о близнецах и двойниках: BLIŹNIACY SĄ IDENTYCZNI, «близнецы совершенно одинаковые». Наречие IDENTYCZNIE — «одинаково, точно так же»." }
  - { kind: government, text: "Идентичный чему-то — IDENTYCZNY Z CZYMŚ, Z с творительным: IDENTYCZNY Z ORYGINAŁEM. В разговоре часто IDENTYCZNY JAK, с именительным: IDENTYCZNY JAK MÓJ. Русское «идентичный чему» с дательным в польском не работает." }
  - { kind: pronunciation, text: "Читается «идэнты́чны», четыре слога, ударение на предпоследнем. DE даёт твёрдое «дэ», TY — твёрдое «ты», CZ — «ч». Русское «иденти́чный» ударяет тот же слог." }
  - { kind: register, text: "Нейтральное слово на все случаи, от разговора до юридических документов. В документах IDENTYCZNY Z ORYGINAŁEM, «соответствует оригиналу», пишут на заверенных копиях. В разговоре его часто усиливают: KUBEK W KUBEK IDENTYCZNY, «точь-в-точь»." }
collocations:
  - { pl: "identyczny z oryginałem", ru: "соответствующий оригиналу" }
  - { pl: "identyczny jak", ru: "точно такой же, как" }
  - { pl: "w identyczny sposób", ru: "точно так же" }
family:
  - { pl: "identycznie", ru: "одинаково, точно так же", relation: derived }
  - { pl: "tożsamość", ru: "идентичность, личность", relation: root, id: tozsamosc }
  - { pl: "jednakowy", ru: "одинаковый", relation: root }
etymology: "Из позднелатинского identicus, от idem «тот же самый». Тот же корень в слове «идентификация» и в польском IDENTYFIKATOR, «бейдж». Польский суффикс -YCZNY, как обычно, на месте русского -ичн-. Своё польское слово с тем же значением, TOŻSAMY, «тот же самый», сохранилось в книжном языке и в TOŻSAMOŚĆ, «личность»."
memory: "Identyczny — одинаковый, точно такой же: identyczne kurtki. Identyczny z czymś — с творительным, или identyczny jak. Читается «идэнты́чны»."
idioms:
  - { pl: "kubek w kubek", ru: "точь-в-точь, как две капли воды" }
