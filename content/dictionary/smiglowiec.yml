        source: { kind: authored }
notes:
  - { kind: register, text: "ŚMIGŁOWIEC — слово официальное: так говорят военные, спасатели, новости. В быту чаще HELIKOPTER. Значат они одно и то же — «вертолёт»." }
  - { kind: usage, text: "Мужской род, E беглое: ŚMIGŁOWIEC — ŚMIGŁOWCA, ŚMIGŁOWCEM, множественное ŚMIGŁOWCE. В винительном единственного встречаются обе формы: WIDZĘ ŚMIGŁOWIEC и WIDZĘ ŚMIGŁOWCA. «Лететь на вертолёте» — LECIEĆ ŚMIGŁOWCEM, творительный без предлога." }
  - { kind: pronunciation, text: "Читается «сьмигуо́вец»: Ś — «сь», Ł — «у», WIE — «ве», конечное C — «ц». Ударение на предпоследнем слоге GŁO." }
collocations:
  - { pl: "śmigłowiec ratunkowy", ru: "санитарный, спасательный вертолёт" }
  - { pl: "lecieć śmigłowcem", ru: "лететь на вертолёте" }
  - { pl: "lądowisko dla śmigłowców", ru: "вертолётная площадка" }
family:
  - { pl: "śmigło", ru: "винт, пропеллер", relation: root }
  - { pl: "śmigać", ru: "мелькать, носиться", relation: root, id: smigac }
synonyms:
  - "helikopter"
etymology: "Образовано от ŚMIGŁO «воздушный винт» суффиксом -OWIEC, буквально «винтовой». Само ŚMIGŁO — от ŚMIGAĆ «быстро мелькать, проноситься». Описательное слово, как и русский «вертолёт»."
memory: "Śmigłowiec — машина со śmigło, винтом: śmiga, мелькает над головой. По-русски тоже описательно — «верто-лёт»."
idioms:
