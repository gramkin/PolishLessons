# review
id: reakcja
format: 2
lemma: "reakcja"
rank: 1866
pos: noun
pron: { cyr: "рэа́кцья" }
senses:
  - id: reaction
    ru: "реакция (отклик)"
    examples:
      - pl: "Reakcja Toma mnie zaskoczyła."
        ru: "Реакция Тома меня удивила."
        source: { kind: translated, id: 12069082 }
      - pl: "Nauczyciela zdumiała moja reakcja."
        ru: "Учителя изумила моя реакция."
        source: { kind: translated, id: 6534525 }
      - pl: "Miałam podobną reakcję."
        ru: "У меня была похожая реакция."
        source: { kind: translated, id: 10458884 }
  - id: reaction-chemical
    ru: "реакция (химическая, скорость реакции)"
    examples:
      - pl: "Po wejściu kwasu w kontakt z metalem powstaje reakcja chemiczna."
        ru: "При контакте кислоты с металлом возникает химическая реакция."
        source: { kind: translated, id: 12058148 }
      - pl: "Z wiekiem spada nasza szybkość reakcji."
        ru: "С возрастом скорость нашей реакции падает."
        source: { kind: translated, id: 6309680 }
      - pl: "Wywołało to reakcję łańcuchową."
        ru: "Это вызвало цепную реакцию."
        source: { kind: translated, id: 6542043 }
notes:
  - { kind: government, text: "Реакция на что-то — reakcja na coś (винительный с na): reakcja na tę wiadomość «реакция на эту новость»." }
  - { kind: usage, text: "wywołać reakcję — «вызвать реакцию»; reakcja łańcuchowa — «цепная реакция»." }
  - { kind: usage, text: "szybkość reakcji — «скорость реакции», и о человеке, и о химии." }
  - { kind: false-friend, text: "Слово то же, что русское «реакция», из латыни; значения совпадают, включая политическое." }
collocations:
  - { pl: "reakcja na coś", ru: "реакция на что-либо" }
  - { pl: "wywołać reakcję", ru: "вызвать реакцию" }
  - { pl: "reakcja łańcuchowa", ru: "цепная реакция" }
family:
  - { pl: "reagować", ru: "реагировать", relation: root }
  - { pl: "odpowiedź", ru: "ответ", relation: root, id: odpowiedz }
etymology: "Из латинского reactio «противодействие» через западные языки; русская «реакция» пришла тем же путём."
memory: "reakcja — «реакция»: reakcja na coś «реакция на что-то», с винительным падежом. И химическая тоже: reakcja łańcuchowa «цепная реакция»."
idioms:
