# review
id: wczoraj
format: 2
lemma: "wczoraj"
rank: 424
pos: noun
pron: { cyr: "фчо́рай" }
senses:
  - id: yesterday
    ru: "вчера"
    examples:
      - pl: "Wczoraj padało."
        ru: "Вчера шёл дождь."
        source: { kind: tatoeba, id: 552513 }
      - pl: "Wczoraj byłem chory."
        ru: "Вчера я был болен."
        source: { kind: tatoeba, id: 354017 }
      - pl: "Wczoraj była niedziela."
        ru: "Вчера было воскресенье."
        source: { kind: tatoeba, id: 354019 }
  - id: yesterday-events
    ru: "вчера (о событиях прошедшего дня)"
    examples:
      - pl: "Gdzie wczoraj poszedłeś?"
        ru: "Куда ты вчера ходил?"
        source: { kind: tatoeba, id: 351498 }
      - pl: "Pomogłem wczoraj ojcu."
        ru: "Я вчера помог отцу."
        source: { kind: tatoeba, id: 366962 }
      - pl: "Zaspałem wczoraj."
        ru: "Я вчера проспал."
