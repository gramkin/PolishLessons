notes:
  - { kind: usage, text: "Наречие, не склоняется. Рядом стоит вся тройка: wczoraj «вчера», dziś «сегодня», jutro «завтра», а ещё przedwczoraj «позавчера»." }
  - { kind: usage, text: "wczoraj wieczorem — «вчера вечером», wczoraj rano — «вчера утром»." }
  - { kind: usage, text: "Оборот na wczoraj значит «срочно, нужно было ещё вчера»: Potrzebuję tego na wczoraj." }
  - { kind: usage, text: "nie od wczoraj — «не со вчерашнего дня», то есть «давно»: Znamy się nie od wczoraj." }
collocations:
  - { pl: "wczoraj wieczorem", ru: "вчера вечером" }
  - { pl: "wczoraj rano", ru: "вчера утром" }
  - { pl: "na wczoraj", ru: "срочно" }
  - { pl: "nie od wczoraj", ru: "давно" }
etymology: "Праславянское *vьčera; русское «вчера» — то же самое слово, буква в букву."
memory: "wczoraj — «вчера», слово совпадает с русским. Запоминайте его вместе со всей тройкой: wczoraj — dziś — jutro. А na wczoraj значит «срочно»: нужно было ещё вчера."
idioms:
  - { pl: "na wczoraj", ru: "срочно, ещё вчера" }
  - { pl: "wczoraj wieczorem", ru: "вчера вечером" }
  - { pl: "nie od wczoraj", ru: "давно, не со вчерашнего дня" }
