# review
id: typ
format: 2
lemma: "typ"
rank: 1019
pos: noun
pron: { cyr: "тып" }
senses:
  - id: kind
    ru: "тип, вид, разновидность"
    examples:
      - pl: "Są trzy typy klimatu: kontynentalny, oceaniczny i śródziemnomorski."
        ru: "Есть три типа климата: континентальный, океанический и средиземноморский."
        source: { kind: translated, id: 12466841 }
      - pl: "On nie może wykonywać pracy tego typu i ona również."
        ru: "Он не может выполнять работу такого рода, и она тоже."
        source: { kind: translated, id: 3660773 }
      - pl: "Możemy wyleczyć pewne typy raka."
        ru: "Мы можем вылечить некоторые типы рака."
        source: { kind: translated, id: 1589027 }
  - id: person
    ru: "тип, субъект (о человеке, обычно неодобрительно)"
    examples:
      - pl: "Co to za typ?"
        ru: "Кто этот тип?"
        source: { kind: translated, id: 6313794 }
      - pl: "Co z ciebie za typ!"
        ru: "Что ты за человек!"
        source: { kind: translated, id: 984681 }
      - pl: "Nie znoszę takich typów."
        ru: "Терпеть не могу таких типов."
        source: { kind: translated, id: 608838 }
  - id: taste
    ru: "być w czyimś typie — быть в чьём-то вкусе"
    examples:
      - pl: "To nie mój typ."
        ru: "Это не мой тип."
        source: { kind: translated, id: 526570 }
      - pl: "Jesteś w moim typie."
        ru: "Ты в моём вкусе."
        source: { kind: translated, id: 349118 }
      - pl: "On zupełnie nie jest w moim typie."
        ru: "Он совсем не в моём вкусе."
        source: { kind: authored }
notes:
  - { kind: usage, text: "tego typu — «такого рода», с родительным падежом: tego typu praca «работа такого рода», tego typu błędy «ошибки такого рода»." }
  - { kind: usage, text: "Родительный падеж различает два значения: typu — «вида, разновидности» (tego typu praca), а разговорное typa — о человеке (nie znam tego typa «я не знаю этого типа»)." }
  - { kind: register, text: "О человеке слово почти всегда неодобрительное: wstrętny typ «мерзкий тип», podstępny typ «коварный тип». Нейтрально о человеке говорят facet или człowiek." }
  - { kind: usage, text: "To nie mój typ «Это не в моём вкусе» и Jesteś w moim typie «Ты в моём вкусе» — устойчивые фразы о симпатии." }
collocations:
  - { pl: "tego typu", ru: "такого рода" }
  - { pl: "typ człowieka", ru: "тип человека" }
  - { pl: "nie mój typ", ru: "не в моём вкусе" }
  - { pl: "różne typy", ru: "разные типы" }
family:
  - { pl: "typowy", ru: "типичный", relation: derived }
  - { pl: "typować", ru: "прочить, назначать", relation: derived }
etymology: "Через латинское typus из греческого τύπος «отпечаток, образец». Русское «тип» пришло тем же путём, поэтому основное значение совпадает полностью."
memory: "typ — «тип, вид», как и в русском. Но о человеке это почти всегда неодобрительно: wstrętny typ «мерзкий тип». И запомните родительный: tego typu praca «работа такого рода», но tego typa «этого субъекта»."
idioms:
  - { pl: "typ spod ciemnej gwiazdy", ru: "тёмная личность" }
  - { pl: "tego typu", ru: "такого рода" }
  - { pl: "nie w moim typie", ru: "не в моём вкусе" }
formExamplesSkip:
  - { form: "typom", reason: "дательный падеж множественного числа встречается крайне редко" }
  - { form: "typowie", reason: "мужско-личное множественное: о людях говорят te typy, форма typowie не употребляется" }
