etymology: "Отрицание nie- плюс grzeczny, а то — сращение оборота «k rzeczy», буквально «к делу, по делу». Сказанное по делу считалось уместным, уместное — приличным, приличное — вежливым; так «дельный» стал «вежливым». Корень rzecz «вещь, дело» тот же, что в русском «речь». С «грехом» слово не связано вовсе: «грешный» по-польски grzeszny."
memory: "niegrzeczny — «невежливый», а о ребёнке «непослушный». Корень не «грех», а rzecz: grzeczny вырос из «k rzeczy», «по делу» — то есть уместный, приличный. «Грешный» это grzeszny, через sz, и их стоит запомнить парой."
