notes:
  - { kind: false-friend, text: "ГЛАВНАЯ ЛОВУШКА — ПОХОЖЕЕ «ГРЕШНЫЙ». Русское ухо слышит в grzeczny корень «грех», но это другое слово: «грешный» по-польски grzeszny, через sz. А grzeczny значит «ВЕЖЛИВЫЙ», и niegrzeczny — «невежливый, непослушный». Пара grzeczny / grzeszny различается одной буквой и ничем больше, так что её стоит заучить вдвоём." }
  - { kind: usage, text: "О взрослом слово значит «невежливый, грубый»: niegrzeczna odpowiedź, niegrzeczne pytanie. О ребёнке и о собаке — «непослушный, нехороший», и это самое частое употребление: bądź grzeczny! говорят ребёнку, как русское «веди себя хорошо». Степени сравнения образуются обычным способом: niegrzeczniejszy, najniegrzeczniejszy." }
  - { kind: pronunciation, text: "Четыре слога, ударение на предпоследнем: nie-GRZECZ-ny. Rz читается как ж, но после глухого g оглушается до ш: «негже́чны» звучит ближе к «негжэ́чны». В сравнительной степени ударение сдвигается вправе: niegrzeczniejszy — «негжэчне́йшы»." }
  - { kind: register, text: "Слово мягче русского «грубый»: взрослому его говорят с лёгким упрёком, не в ссоре. Для настоящей грубости есть chamski и ordynarny. Детское употребление нейтрально и повседневно." }
