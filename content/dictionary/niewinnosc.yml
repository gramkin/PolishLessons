notes:
  - { kind: false-friend, text: "Слово прозрачно, а вот его основа таит сразу три разных значения, и путать их дорого. WINNY значит «виновный»: JEST WINNY TEGO BŁĘDU. То же слово значит «должен» в денежном смысле, только в мужской форме WINIEN: JESTEM CI WINIEN STO ZŁOTYCH — «я тебе должен сто злотых». И третье, совсем отдельное: WINNY значит «винный», от WINO: OCET WINNY «винный уксус». Различает их только контекст, и потому отрицательное NIEWINNY однозначно только в первом смысле, «невиновный, невинный»." }
  - { kind: government, text: "Чья невиновность — родительный без предлога: NIEWINNOŚĆ OSKARŻONEGO. Доказать — DOWIEŚĆ NIEWINNOŚCI, с родительным, тогда как русский говорит «доказать невиновность» с винительным, так что падеж приходится менять. Верить во что — WIERZYĆ W NIEWINNOŚĆ, предлог W с винительным, и здесь схема совпадает с русской. Прилагательное NIEWINNY управляет предлогом в значении причастности: NIEWINNY TEJ ZBRODNI, родительный." }
  - { kind: pronunciation, text: "Читается «неви́нносьчь», три слога, ударение на втором. Приставка NIE звучит «не», без всякого носового оттенка, потому что E здесь обычное. Двойное NN произносится долго, как в русском «длинный», и проглатывать его нельзя. Конец слова, -ŚĆ, это два мягких звука подряд, «сьчь». В прилагательном NIEWINNY слышно «неви́нны», с «ы» на конце." }
  - { kind: usage, text: "Шесть форм, разряд женских существительных на -OŚĆ, суффикс отвечает русскому -ОСТЬ. Множественное число практически не употребляется: отвлечённое качество не считают. Юридический оборот DOMNIEMANIE NIEWINNOŚCI отвечает русской «презумпции невиновности» и стоит в польской конституции, так что встречается часто. Русский в двух значениях этого слова пользуется двумя словами, «невиновность» для суда и «невинность» для нравов, а польский обходится одним." }
  - { kind: register, text: "В юридическом значении слово официальное и частое: DOMNIEMANIE NIEWINNOŚCI, DOWIEŚĆ NIEWINNOŚCI, WIERZYĆ W NIEWINNOŚĆ. В нравственном значении оно книжное и чуть сентиментальное, и в живой речи вместо него скажут прилагательным: ONA JEST NIEWINNA. Отдельно стоит отметить, что NIEWINNIE значит «невинно» и в обороте NIEWINNIE SKAZANY — «невинно осуждённый», это устойчивое выражение газетного языка." }
collocations:
