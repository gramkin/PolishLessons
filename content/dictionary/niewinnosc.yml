etymology: "Сложено из отрицания NIE и основы WIN-, от WINA «вина», и это то же праславянское слово, что русская «вина». Суффикс -OŚĆ отвечает русскому -ОСТЬ, так что NIEWINNOŚĆ и «невиновность» собраны из одинаковых частей и в одинаковом порядке. Любопытно, что слово WINA и слово WINO при всём сходстве не родственны: второе пришло из латинского VINUM, а первое своё, славянское. Именно поэтому WINNY значит и «виновный», и «винный», и эти два значения в польском просто совпали по звучанию."
memory: "Собрано как русское «невиновность», часть в часть: nie плюс wina плюс суффикс -ość. Но покрывает оба русских слова сразу, и юридическую «невиновность», и нравственную «невинность». Поправить падеж: dowieść niewinności родительным, где русский ставит винительный. Главная ловушка в основе: winny значит «виновный», winien значит «должен» о деньгах, а winny от wino значит «винный», и это три разных слова, совпавших по звучанию. Читается «неви́нносьчь»."
