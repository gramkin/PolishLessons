# review
id: trudno
format: 2
lemma: "trudno"
rank: 2968
pos: adv
pron: { cyr: "тру́дно" }
senses:
  - id: difficult
    ru: "трудно, сложно"
    examples:
      - pl: "Trudno mi wyrazić myśli słowami."
        ru: "Мне сложно выразить свои мысли словами."
        source: { kind: tatoeba, id: 859018 }
      - pl: "Trudno jest zrozumieć co on bełkocze."
        ru: "Трудно понять, что он бормочет."
        source: { kind: tatoeba, id: 2250174 }
      - pl: "W takiej sytuacji bardzo trudno zachować twarz."
        ru: "В такой ситуации очень трудно сохранить лицо."
        source: { kind: tatoeba, id: 13784967 }
  - id: never-mind
    ru: "Trudno! — ничего не поделаешь, ну и ладно"
    examples:
      - pl: "Nie udało się? Trudno."
        ru: "Не получилось? Ну и ладно."
        source: { kind: authored }
      - pl: "Trudno, musimy zacząć od nowa."
        ru: "Ничего не поделаешь, надо начинать заново."
        source: { kind: authored }
      - pl: "Trudno o większego entuzjastę i maniaka."
        ru: "Трудно найти большего энтузиаста и маньяка."
        source: { kind: authored }
notes:
  - { kind: government, text: "Строится с дательным падежом и инфинитивом: Trudno mi wyrazić myśli «Мне трудно выразить мысли»." }
  - { kind: usage, text: "Trudno! отдельной репликой значит «Ну и ладно!», «Ничего не поделаешь!» — это не жалоба, а принятие." }
  - { kind: usage, text: "Оборот trudno o coś значит «трудно найти что-то»: Trudno o lepszy przykład «Лучшего примера не найти»." }
  - { kind: usage, text: "Внутри trud «труд, тягота»; русское «труд» — то же слово, поэтому trudno и «трудно» совпадают и по форме, и по смыслу." }
collocations:
  - { pl: "trudno mi", ru: "мне трудно" }
  - { pl: "trudno o…", ru: "трудно найти…" }
  - { pl: "trudno powiedzieć", ru: "трудно сказать" }
  - { pl: "trudno!", ru: "ничего не поделаешь!" }
etymology: "Наречие от trudny «трудный», внутри которого trud «труд, тягота», праславянское *trudъ. Русское «труд» — то же самое слово."
memory: "trudno — «трудно», и внутри сидит trud «труд, тягота», то же слово, что русский «труд». Строится с дательным: Trudno mi wyrazić «Мне трудно выразить». Два оборота стоит запомнить отдельно: trudno o coś «трудно найти что-то» и реплику Trudno! — «Ну и ладно, ничего не поделаешь»."
idioms:
  - { pl: "trudno!", ru: "ничего не поделаешь!" }
  - { pl: "trudno o…", ru: "трудно найти…" }
  - { pl: "trudno i darmo", ru: "делать нечего" }
