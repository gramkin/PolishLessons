# review
id: ucieszyc
format: 2
lemma: "ucieszyć"
rank: 3816
pos: verb
pron: { cyr: "уце́шыць" }
senses:
  - id: please
    ru: "обрадовать"
    examples:
      - pl: "Ta wiadomość ucieszyła wszystkich."
        ru: "Эта новость всех обрадовала."
        source: { kind: authored }
      - pl: "Ucieszył mamę dobrą oceną."
        ru: "Он обрадовал маму хорошей оценкой."
        source: { kind: authored }
      - pl: "Kwiaty ucieszyły mamę."
        ru: "Цветы обрадовали маму."
        source: { kind: authored }
  - id: be-glad
    ru: "с SIĘ — обрадоваться"
    examples:
      - pl: "Ucieszył się z prezentu."
        ru: "Он обрадовался подарку."
        source: { kind: authored }
      - pl: "Ucieszyła się jak dziecko."
        ru: "Она обрадовалась как ребёнок."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "UCIESZYĆ — «обрадовать», а не «утешить». «Утешить» — POCIESZYĆ. UCIESZYĆ SIĘ Z CZEGOŚ — «обрадоваться чему-то» (с родительным!), а UCIESZYĆ SIĘ NA COŚ — «радоваться предстоящему»." }
  - { kind: usage, text: "Пятьдесят три формы. Страдательное UCIESZONY — «обрадованный»: BYŁ UCIESZONY. Будущее: UCIESZĘ, UCIESZYSZ, повелительное UCIESZ. Несовершенный вид — CIESZYĆ." }
  - { kind: government, text: "Кого чем — винительный и творительный: UCIESZYĆ MAMĘ PREZENTEM. С SIĘ — Z с родительным: Z PREZENTU; NA с винительным: NA WAKACJE; NA WIDOK кого-то — «при виде»." }
  - { kind: pronunciation, text: "Читается «уце́шыць»: CIE — «це», SZY — «шы», ударение на предпоследнем слоге. UCIESZĘ — «уце́шэ»." }
  - { kind: register, text: "Нейтральное, тёплое слово. UCIESZYĆ SIĘ JAK DZIECKO — разговорное «обрадоваться как ребёнок»." }
collocations:
  - { pl: "ucieszyć się z prezentu", ru: "обрадоваться подарку" }
  - { pl: "ucieszyć kogoś wiadomością", ru: "обрадовать кого-то новостью" }
  - { pl: "ucieszyć się na widok", ru: "обрадоваться при виде" }
family:
  - { pl: "cieszyć", ru: "радовать; с SIĘ — радоваться", relation: root, id: cieszyc }
  - { pl: "pocieszyć", ru: "утешить", relation: derived, id: pocieszyc }
  - { pl: "uciecha", ru: "радость, веселье", relation: derived }
etymology: "Приставка U- плюс CIESZYĆ «радовать», праславянское *těšiti «успокаивать, утешать». Русское «тешить», «утешить» — то же слово, но значение в польском сдвинулось к «радовать»."
memory: "Ucieszyć się z czegoś — обрадоваться: ucieszył się z prezentu. «Утешить» — pocieszyć. Читается «уце́шыць»."
idioms:
  - { pl: "ucieszyć się jak dziecko", ru: "обрадоваться как ребёнок" }
