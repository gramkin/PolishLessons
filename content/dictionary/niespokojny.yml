# review
id: niespokojny
format: 2
lemma: "niespokojny"
rank: 2282
pos: adj
pron: { cyr: "неспоко́йны" }
senses:
  - id: uneasy
    ru: "беспокойный, тревожный"
    examples:
      - pl: "Jesteś niespokojny."
        ru: "Ты беспокоен."
        source: { kind: translated, id: 5665355 }
      - pl: "Wydajesz się niespokojny."
        ru: "Ты кажешься встревоженным."
        source: { kind: translated, id: 3051124 }
      - pl: "Tom jest niespokojny."
        ru: "Том встревожен."
        source: { kind: translated, id: 8725864 }
  - id: restless
    ru: "неспокойный (о людях, времени)"
    examples:
      - pl: "Ona robi się niespokojna w towarzystwie obcych."
        ru: "Она становится беспокойной в обществе незнакомых."
        source: { kind: translated, id: 952182 }
      - pl: "Na wieść o tym wypadku ludzie zrobili się niespokojni."
        ru: "Узнав об этом происшествии, люди забеспокоились."
        source: { kind: translated, id: 364729 }
notes:
  - { kind: false-friend, text: "Собрано как русское: nie + spokojny «спокойный». Полное совпадение модели." }
  - { kind: government, text: "Обычное прилагательное; наречие — niespokojnie." }
  - { kind: usage, text: "О времени значит «смутный»: niespokojne czasy «смутные времена»." }
  - { kind: usage, text: "Карточки spokojny и spokój уже есть — стоит держать их рядом." }
collocations:
  - { pl: "niespokojne czasy", ru: "смутные времена" }
  - { pl: "niespokojny sen", ru: "беспокойный сон" }
etymology: "nie + spokojny «спокойный», от spokój «покой»; русское «неспокойный» собрано так же."
memory: "niespokojny — «беспокойный», и о времени «смутный»: niespokojne czasy. Собрано ровно как русское слово."
idioms:
  - { pl: "niespokojne czasy", ru: "смутные времена" }
