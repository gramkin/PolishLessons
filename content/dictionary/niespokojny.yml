# review
id: niespokojny
format: 2
lemma: "niespokojny"
rank: 5590
pos: adj
pron: { cyr: "неспоко́йны" }
senses:
  - id: uneasy
    ru: "беспокойный, тревожный"
    examples:
      - pl: "Jesteś niespokojny."
        ru: "Ты беспокоен."
        source: { kind: translated, id: 5665355 }
