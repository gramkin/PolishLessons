notes:
  - { kind: usage, text: "Форм десять, а не одиннадцать, как у прочих прилагательных без степеней, и причина строгая. Основа у LETNI мягкая, и мужская личная форма множественного совпала с именительным единственного: LETNI значит и «летний», и «летние» о мужчинах — LETNI TURYŚCI. У твёрдых основ эти формы расходятся: typowy даёт typowi, włoski даёт włoscy, sądowy даёт sądowi. Отсюда правило счёта: у прилагательного без степеней одиннадцать форм при твёрдой основе и десять при мягкой. Форма LETNIM при этом работает втройне — творительный и местный единственного плюс дательный множественного." }
  - { kind: false-friend, text: "Второе значение по-русски неожиданно: LETNI значит ещё и «тепловатый», причём именно о том, что должно быть горячим или холодным, а оказалось ни тем ни другим. LETNIA WODA — тёплая вода, LETNIA HERBATA — остывший чай. Русское «летний» так не умеет никогда. Связь между смыслами прямая: летняя вода — та, что сама собой стала не горячей и не холодной, и язык перенёс название на любую такую." }
  - { kind: pronunciation, text: "Корень тот же, что у LATO «лето», но при образовании прилагательного корневая a переходит в e: LATO — LETNI. Русский в этой паре ничего не меняет, «лето» и «летний» звучат с одной гласной, так что мену надо запомнить отдельно. Та же a/e видна в lata «годы» — letni «многолетний» в сложениях вроде dziesięcioletni «десятилетний»." }
collocations:
  - { pl: "letnia woda", ru: "тёплая вода" }
  - { pl: "letnie wakacje", ru: "летние каникулы" }
  - { pl: "czas letni", ru: "летнее время" }
family:
  - { pl: "lato", ru: "лето", relation: root, id: lato }
  - { pl: "letnisko", ru: "дачное место", relation: derived }
etymology: "От LATO «лето», из праславянского *lěto — того же слова, что русское «лето», которое изначально значило «год» и в этом смысле осталось в польском LATA «годы» и в русских «пяти летах». Прилагательное меняет корневую гласную: lato, но letni. Значение «тепловатый» выросло из летнего тепла — то, что ни горячо, ни холодно, по-польски именно letnie, и этого смысла у русского «летнего» нет."
memory: "Десять форм, не одиннадцать: мягкая основа, и letni — это и единственное мужское, и множественное мужское личное. А второе значение — «тепловатый»: letnia woda."
idioms:
