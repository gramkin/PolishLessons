notes:
  - { kind: false-friend, text: "Одно польское слово держит два смысла, и второй русский не угадает никогда. SPADEK CEN это «падение цен», тут всё понятно. Но SPADEK PO BABCI значит «наследство от бабушки», а вовсе не её упадок. Образ прост: имущество «падает» наследнику, достаётся ему сверху. Русский назвал это иначе, от «следовать»: «наследство», «наследник». Поэтому SPADKOBIERCA, дословно «тот, кто берёт упавшее», это именно наследник." }
  - { kind: usage, text: "Девять форм, мужской род, неодушевлённое. В основе беглое E, которое выпадает во всех косвенных падежах: SPADEK, но SPADKU, SPADKIEM, SPADKOWI. Так же устроены DZWONEK и PRZYSTANEK. Оба значения живут в одном слове и различаются только дополнением: SPADEK CEN против SPADEK PO OJCU." }
  - { kind: government, text: "Запомните управление: наследство от кого-то — SPADEK PO KIMŚ, предлог PO с местным падежом, тогда как русский скажет «от кого-то», с родительным. SPADEK PO DZIADKU, SPADEK PO CIOTCE. Получить в наследство — DOSTAĆ W SPADKU, местный падеж после W. Принять наследство — PRZYJĄĆ SPADEK, винительный без предлога." }
  - { kind: pronunciation, text: "Читается «спа́дэк», два слога, ударение на первом. Сочетание SP произносится слитно. Конечная E даёт «э», поэтому слово кончается на «дэк». В косвенных падежах беглое E пропадает: SPADKU звучит «спа́дку», SPADKIEM — «спа́дкем», с мягким «ке»." }
  - { kind: register, text: "Слово нейтральное и сразу в двух мирах. В суде и у нотариуса это наследство: PRZYJĄĆ SPADEK, ODRZUCIĆ SPADEK «отказаться от наследства», PODATEK OD SPADKU. В новостях о хозяйстве — спад: SPADEK CEN, SPADEK BEZROBOCIA, SPADEK NAPIĘCIA. Путаницы в живой речи не бывает, потому что дополнение всё решает." }
collocations:
  - { pl: "spadek po dziadku", ru: "наследство от деда" }
  - { pl: "spadek cen", ru: "падение цен" }
  - { pl: "przyjąć spadek", ru: "принять наследство" }
family:
  - { pl: "spadać", ru: "падать", relation: root, id: spadac }
  - { pl: "upadek", ru: "падение, упадок", relation: derived, id: upadek }
  - { pl: "spadkobierca", ru: "наследник", relation: derived, id: spadkobierca }
etymology: "От глагола SPADAĆ, от приставки S- и PADAĆ «падать», слова праславянского и того же, что русское «падать». Смысл «наследство» вырос из образа: имущество падает наследнику, достаётся ему как бы сверху. Тот же образ был и в латыни, где HEREDITAS CADUCA значило «выпавшее наследство». Русский пошёл другим путём, от «следовать»: наследник идёт следом за умершим. Два языка, два образа, одно дело."
memory: "Два смысла в одном слове: spadek cen это «падение цен», а spadek po babci — «наследство от бабушки». Образ один: имущество падает наследнику, отсюда и spadkobierca, «берущий упавшее». Читается «спа́дэк», беглое e выпадает: spadku. И запомните управление: наследство от кого-то — spadek po kims, с местным падежом, а не «от», как у нас."
idioms:
  - { pl: "dostać w spadku", ru: "получить в наследство" }
