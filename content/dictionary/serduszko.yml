notes:
  - { kind: government, text: "Средний род, уменьшительное от serce: serduszko, serduszka, serduszku. Множественное — serduszka, serduszek." }
  - { kind: usage, text: "Два употребления: ласковое о настоящем сердце, особенно детском, и о значке-сердечке." }
  - { kind: usage, text: "Как обращение moje serduszko значит «сердечко моё, милый мой»." }
  - { kind: false-friend, text: "Здесь ложных друзей нет: русское «сердечко» совпадает и по смыслу, и по уменьшительному суффиксу." }
