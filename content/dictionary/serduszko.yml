etymology: "Уменьшительное от serce с суффиксом -uszko. Само serce восходит к праславянскому *sŕdьce и прямо совпадает с русским «сердце», чешским srdce и украинским «серце», а дальше — с латинским cor и немецким Herz."
memory: "serduszko — «сердечко»: serce плюс уменьшительное -uszko, ровно как русское «сердце» плюс «-ечко». И про орган, и про значок, и как нежное обращение."
idioms:
  - { pl: "moje serduszko", ru: "сердечко моё" }
