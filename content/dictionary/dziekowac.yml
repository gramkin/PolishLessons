# review
id: dziekowac
format: 2
lemma: "dziękować"
rank: 102
pos: verb
aspect: imperf
pron: { cyr: "дзенко́вaць" }
senses:
  - id: thank
    ru: "благодарить"
    examples:
      - pl: "Dziękuję!"
        ru: "Спасибо!"
        source: { kind: tatoeba, id: 382586 }
      - pl: "Dziękuję."
        ru: "Благодарю."
        source: { kind: tatoeba, id: 1414772 }
      - pl: "Bardzo dziękuję!"
        ru: "Большое спасибо!"
        source: { kind: tatoeba, id: 365185 }
  - id: decline
    ru: "вежливо отказываться (dziękuję — «спасибо, не надо»)"
    examples:
      - pl: "Dziękuję, nie jestem głodny."
        ru: "Спасибо, я не голоден."
        source: { kind: authored }
      - pl: "Nie musisz mi dziękować."
        ru: "Не нужно меня благодарить."
        source: { kind: authored }
notes:
  - { kind: government, text: "dziękować komuś za coś — дательный адресата и za с винительным: Dziękuję ci za pomoc." }
  - { kind: false-friend, text: "В ответ на предложение dziękuję часто значит вежливый отказ, а не согласие — как русское «спасибо, не надо»." }
collocations:
  - { pl: "dziękuję bardzo", ru: "большое спасибо" }
  - { pl: "dziękować za pomoc", ru: "благодарить за помощь" }
  - { pl: "nie ma za co", ru: "не за что" }
etymology: "От dzięki «благодаря, спасибо», заимствованного из германского (ср. немецкое Dank); русское «спасибо» устроено иначе — из «спаси Бог»."
memory: "Управление отличается от русского: dziękować komuś za coś — кого благодарим, стоит в дательном (Dziękuję ci), а за что — с предлогом za. И помните вежливый отказ: на предложение dziękuję чаще значит «спасибо, не надо»."
idioms:
  - { pl: "dziękuję bardzo", ru: "большое спасибо" }
  - { pl: "nie ma za co", ru: "не за что" }
  - { pl: "dzięki Bogu", ru: "слава богу" }
