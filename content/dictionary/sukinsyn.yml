notes:
  - { kind: usage, text: "Мужско-личное множественное — sukinsynowie, как у syn — synowie: это слово наследует окончание -owie от своей второй части. Формы sukinsyni не бывает, поэтому она оставлена без примеров." }
  - { kind: register, text: "Грубое ругательство, точный двойник русского «сукин сын» — и по составу, и по силе." }
  - { kind: usage, text: "В отличие от русского, пишется слитно, одним словом, и склоняется как одушевлённое существительное мужского рода." }
  - { kind: usage, text: "Звательный падеж sukinsynu — в прямом обращении." }
collocations:
  - { pl: "co za sukinsyn", ru: "вот сукин сын" }
  - { pl: "ty sukinsynu", ru: "ты сукин сын" }
  - { pl: "stary sukinsyn", ru: "старый сукин сын" }
etymology: "Сращение suki «суки» и syn «сын». Русское «сукин сын» — та же самая калька, только по-русски она пишется раздельно."
memory: "sukinsyn — «сукин сын», буквально и по смыслу. Разница только в письме: по-польски одним словом."
idioms:
