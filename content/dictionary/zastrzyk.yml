notes:
  - { kind: false-friend, text: "Русского однокоренного слова нет: ZASTRZYK значит «укол, инъекция», а образовано оно от ZASTRZYKNĄĆ «впрыснуть», с корнем STRZYK-, который в русском самостоятельного соответствия не имеет. Поэтому слово надо запомнить целиком. Переносное употребление, однако, совпадает с русским полностью: ZASTRZYK GOTÓWKI это «денежная инъекция», ZASTRZYK ENERGII — «инъекция энергии», и метафора в двух языках одна. Рядом стоит INIEKCJA, слово книжное и медицинское, точный аналог русской «инъекции»; в живой речи поляк скажет именно ZASTRZYK. Шприц — STRZYKAWKA, от того же корня." }
  - { kind: usage, text: "Основа кончается на K, поэтому местный падеж берёт окончание -U, а не -IE: W ZASTRZYKU. Форма ZASTRZYKU покрывает сразу родительный и местный единственного — два падежа одной формой, как у WYROK с WYROKU и STEK с STEKU. Никаких чередований в основе не происходит, и в этом слово удобно противопоставить двум соседям по карточке: URZĄDZENIE усекает родительный множественного до URZĄDZEŃ, SŁÓWKO повышает гласную до Ó и вставляет беглую E, а ZASTRZYK не делает ничего. Родительный множественного — ZASTRZYKÓW, именительный множественного — ZASTRZYKI." }
  - { kind: government, text: "Мужской род, неодушевлённое. Куда укол — предлог W с винительным: ZASTRZYK W RAMIĘ, ZASTRZYK W POŚLADEK. От чего — PRZECIW с дательным или NA с винительным: ZASTRZYK PRZECIW TĘŻCOWI «прививка от тетануса», ZASTRZYK NA BÓL. Частотные глаголы: ZROBIĆ ZASTRZYK «сделать укол» — по-польски глагол ZROBIĆ, а не DAĆ; DOSTAĆ ZASTRZYK «получить укол»; BAĆ SIĘ ZASTRZYKÓW «бояться уколов», с родительным множественного. В переносном значении: ZASTRZYK GOTÓWKI, ZASTRZYK ENERGII, с родительным." }
  - { kind: pronunciation, text: "Читается «за́стшык», два слога, ударение на первом. Группа STRZ — три согласных подряд, и RZ после глухого T оглушается, поэтому слышно «стш», а не «стж». Буква Y даёт «ы». Конечное K глухое. В родительном и местном ZASTRZYKU слогов три, ударение переходит на предпоследний: «застшы́ку». Группа STRZ встречается в польском часто, и проговаривать её стоит медленно: с-т-ш, без гласных между согласными." }
