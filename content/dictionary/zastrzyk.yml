etymology: "От ZASTRZYKNĄĆ «впрыснуть», от корня STRZYK-, связанного со STRZYKAĆ «брызгать, прыскать»; тот же корень в STRZYKAWKA «шприц». В русском этого корня в свободном виде нет, и для инъекции язык взял либо своё «укол», от «колоть», либо латинское «инъекцию», так что опоры для догадки нет совсем: польский назвал процедуру по брызганью, русский по уколу, латынь по вбрасыванию. Приставка ZA- означает здесь введение внутрь, как в ZALAĆ «залить». Переносное значение в обоих языках пришло из одного источника, из языка экономических статей двадцатого века, и калькирует английское INJECTION OF CASH; поэтому ZASTRZYK GOTÓWKI и «денежная инъекция» появились почти одновременно и независимо."
memory: "Однокоренной опоры в русском нет: zastrzyk «укол» от zastrzyknąć «впрыснуть», корень тот же, что в strzykawka «шприц». Русский назвал процедуру по уколу, польский по брызганью. Зато переносный смысл совпадает: zastrzyk gotówki — «денежная инъекция». Глагол нужен zrobić, а не dać: zrobić zastrzyk. Местный на -u: w zastrzyku, как w wyroku. Группа strz читается «стш»."
idioms:
