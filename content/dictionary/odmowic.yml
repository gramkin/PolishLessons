# review
id: odmowic
format: 2
lemma: "odmówić"
rank: 1480
pos: verb
aspect: perf
pron: { cyr: "одму́виць" }
senses:
  - id: refuse
    ru: "отказаться, отказать"
    examples:
      - pl: "Muszę odmówić."
        ru: "Я должен отказаться."
        source: { kind: translated, id: 2893170 }
      - pl: "Tom odmówił."
        ru: "Том отказался."
        source: { kind: translated, id: 5636927 }
      - pl: "Odmówiła."
        ru: "Она отказалась."
        source: { kind: translated, id: 12225621 }
  - id: refuse-something
    ru: "отказать в чём-либо, отказаться от чего-либо"
    examples:
      - pl: "Odmówił przyjęcia łapówki."
        ru: "Он отказался принять взятку."
        source: { kind: tatoeba, id: 814578 }
      - pl: "On odmówił płacenia rachunków."
        ru: "Он отказался оплачивать счета."
        source: { kind: tatoeba, id: 12959990 }
      - pl: "Musiałem odmówić jego prośbie."
        ru: "Мне пришлось отказать его просьбе."
        source: { kind: translated, id: 924612 }
notes:
  - { kind: government, text: "«Отказать кому-то в чём-то» — odmówić komuś czegoś: дательный плюс родительный. «Отказаться сделать» — odmówić zrobienia czegoś, тоже родительный." }
  - { kind: usage, text: "Несовершенный вид — odmawiać. Существительное odmowa значит «отказ»." }
  - { kind: usage, text: "odmówić posłuszeństwa — «отказать в повиновении»; про ноги и руки говорят так же: nogi odmówiły mu posłuszeństwa «ноги его не слушались»." }
  - { kind: false-friend, text: "Второе значение того же глагола — «прочитать молитву»: odmówić pacierz «прочитать молитву». В корпусе оно не встречается." }
collocations:
  - { pl: "odmówić prośbie", ru: "отказать в просьбе" }
  - { pl: "stanowczo odmówić", ru: "решительно отказаться" }
  - { pl: "odmówić posłuszeństwa", ru: "отказать в повиновении" }
etymology: "Приставка od- + mówić «говорить» — буквально «отговорить, отказать словом». Русское «отказать» построено от «казать, сказать» — та же метафора речи, только другой корень."
memory: "odmówić = «отказать, отказаться». Управление сложное: odmówić komuś czegoś — дательный плюс родительный. Несовершенный вид — odmawiać, существительное — odmowa «отказ»."
idioms:
  - { pl: "odmówić prośbie", ru: "отказать в просьбе" }
  - { pl: "stanowczo odmówić", ru: "решительно отказаться" }
  - { pl: "odmówić posłuszeństwa", ru: "отказать в повиновении" }
formExamplesSkip:
  - { form: "odmówieni", reason: "мужско-личной страдательной формы у этого глагола не бывает: odmówić komuś czegoś ставит человека в дательный падеж, а вещь — в родительный, поэтому человек никогда не бывает прямым дополнением и не может стать подлежащим страдательного оборота. Отказывают просьбе, заявлению, помощи: odmówiona prośba, odmówiony wniosek — эти формы в карточке есть с примерами" }
  - { form: "odmówiwszy", reason: "книжное деепричастие прошедшего времени; в живой речи не употребляется. То же основание, по которому в словаре оставлены без примеров doczekawszy, dołączywszy и sprowadziwszy" }
