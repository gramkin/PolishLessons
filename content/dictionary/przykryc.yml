# review
id: przykryc
format: 2
lemma: "przykryć"
rank: 2079
pos: verb
aspect: perf
pron: { cyr: "пшы́крыць" }
senses:
  - id: cover
    ru: "накрыть, покрыть"
    examples:
      - pl: "Ten dywan jest dość duży, by przykryć całą podłogę."
        ru: "Этот ковёр достаточно велик, чтобы покрыть весь пол."
        source: { kind: translated, id: 352143 }
      - pl: "Przykryj to."
        ru: "Накрой это."
        source: { kind: translated, id: 3084391 }
      - pl: "Góra Fuji była przykryta śniegiem."
        ru: "Гора Фудзи была покрыта снегом."
        source: { kind: tatoeba, id: 2918375 }
  - id: covered
    ru: "покрытый (причастие przykryty)"
    examples:
      - pl: "Wszystko było przykryte kurzem."
        ru: "Всё было покрыто пылью."
        source: { kind: translated, id: 8950088 }
      - pl: "Łóżko Toma jest przykryte kocem z Pikachu."
        ru: "Кровать Тома накрыта пледом с Пикачу."
        source: { kind: translated, id: 10798977 }
notes:
  - { kind: government, text: "Чем накрыто — творительный падеж без предлога: przykryty śniegiem «покрытый снегом», как в русском." }
  - { kind: usage, text: "Несовершенный вид — przykrywać." }
  - { kind: false-friend, text: "Корень kryć «крыть, прятать» — ср. русское «крыть», «покрыть», «укрытие»." }
  - { kind: usage, text: "Причастие przykryty встречается чаще личных форм: ściany przykryte bluszczem «стены, покрытые плющом»." }
collocations:
  - { pl: "przykryć stół", ru: "накрыть стол" }
  - { pl: "przykryty śniegiem", ru: "покрытый снегом" }
etymology: "przy- + kryć «крыть, прятать», праславянское *kryti; ср. русское «крыть», «покрыть»."
memory: "przykryć — «накрыть, покрыть», от kryć «крыть». Чем накрыто — творительным падежом, как в русском: przykryty śniegiem."
idioms:
