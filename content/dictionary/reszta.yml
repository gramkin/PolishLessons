# review
id: reszta
format: 2
lemma: "reszta"
rank: 448
pos: noun
pron: { cyr: "рэ́шта" }
senses:
  - id: rest
    ru: "остальное, остаток"
    examples:
      - pl: "Była piękniejsza niż cała reszta."
        ru: "Она была красивее, чем все другие."
        source: { kind: tatoeba, id: 1473509 }
      - pl: "Weź resztę róż i wstaw ich w wodę."
        ru: "Возьми остальные розы и поставь их в воду."
        source: { kind: translated, id: 3660667 }
      - pl: "Pamiętaj o miłości i zapomnij o reszcie."
        ru: "Помни о любви и забудь об остальном."
        source: { kind: translated, id: 2842148 }
  - id: change
    ru: "сдача (деньги)"
    examples:
      - pl: "Zatrzymaj resztę."
        ru: "Оставь сдачу себе."
        source: { kind: translated, id: 11680101 }
      - pl: "Reszty nie trzeba."
        ru: "Сдачи не надо."
        source: { kind: translated, id: 357350 }
      - pl: "Reszta!"
        ru: "Сдача!"
        source: { kind: translated, id: 1157670 }
notes:
  - { kind: usage, text: "В магазине и такси reszta значит «сдача»: Reszty nie trzeba «Сдачи не надо», Zatrzymaj resztę «Оставьте сдачу себе». Это самая полезная фраза со словом." }
  - { kind: usage, text: "cała reszta — «все остальные», reszta świata — «остальной мир»." }
  - { kind: usage, text: "bez reszty — «целиком, без остатка»: Oddał się pracy bez reszty." }
  - { kind: false-friend, text: "Слово заимствованное: через немецкое Rest из латинского restare «оставаться». Славянского родственника в русском у него нет." }
collocations:
  - { pl: "reszty nie trzeba", ru: "сдачи не надо" }
  - { pl: "zatrzymaj resztę", ru: "оставь сдачу" }
  - { pl: "cała reszta", ru: "все остальные" }
  - { pl: "bez reszty", ru: "целиком" }
etymology: "Заимствование: через немецкое Rest из латинского restare «оставаться». Тот же латинский корень виден в «реставрации»."
memory: "reszta — «остальное», но в магазине это «сдача»: Reszty nie trzeba «Сдачи не надо». Слово пришло из латинского restare «оставаться», так что славянского двойника у него нет."
idioms:
  - { pl: "reszty nie trzeba", ru: "сдачи не надо" }
  - { pl: "bez reszty", ru: "целиком, без остатка" }
  - { pl: "cała reszta", ru: "все остальные" }
formExamples:
  - form: "reszcie"
    pl: "Wolność wyboru, którą nam dano, nie wyklucza naszych prób zmiany, według ludzkich „praw chciwości”, tego, co jest określone jedynie wolą Wszechmogącego. Rosja od stulecia usiłuje wykorzystać tę okoliczność w swojej polityce, tym samym pokazując reszcie świata marność, bezsensowność i grzeszność tej pożądliwej namiętności."
    ru: "Свобода выбора, дарованная нам, не исключает и наших попыток изменить по человеческим «законам алчности» то, что определяется только волей Всевышнего. Россия в течение целого века стремится задействовать это обстоятельство в своей политике, тем самым показывая остальному миру тщетность, бессмысленность и греховность этой вожделенной страсти."
    source: { kind: tatoeba, id: 13786623 }
