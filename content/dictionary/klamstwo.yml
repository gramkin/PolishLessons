# review
id: klamstwo
format: 2
lemma: "kłamstwo"
rank: 992
pos: noun
pron: { cyr: "куа́мство" }
senses:
  - id: lie
    ru: "ложь, враньё"
    examples:
      - pl: "To oczywiście kłamstwo."
        ru: "Это явная ложь."
        source: { kind: translated, id: 4717689 }
      - pl: "To kłamstwo!"
        ru: "Это ложь!"
        source: { kind: translated, id: 3041456 }
      - pl: "Nienawidził kłamstwa."
        ru: "Он ненавидел ложь."
        source: { kind: translated, id: 3085212 }
  - id: turn-out
    ru: "okazać się kłamstwem — оказаться ложью"
    examples:
      - pl: "Jego słowa okazały się kłamstwem."
        ru: "Его слова оказались ложью."
        source: { kind: translated, id: 361017 }
      - pl: "To co powiedział okazało się kłamstwem."
        ru: "То, что он сказал, оказалось ложью."
        source: { kind: translated, id: 2006051 }
      - pl: "Powiedział, że nie zna człowieka, co było kłamstwem."
        ru: "Он сказал, что не знает этого человека, и это была ложь."
        source: { kind: translated, id: 1351117 }
  - id: enough
    ru: "mieć dość kłamstw — устать от лжи"
    examples:
      - pl: "Dość tych kłamstw!"
        ru: "Хватит этой лжи!"
        source: { kind: translated, id: 7053937 }
      - pl: "Mam dość jej wszystkich kłamstw."
        ru: "Мне надоела вся её ложь."
        source: { kind: translated, id: 982779 }
      - pl: "Nie mów kłamstw."
        ru: "Не говори неправды."
        source: { kind: translated, id: 10542830 }
notes:
  - { kind: usage, text: "Слово образовано от kłamać «лгать» суффиксом -stwo. Прямого родственника в современном русском нет: «ложь» и «врать» — другие корни." }
  - { kind: usage, text: "mieć dość kłamstw «устать от лжи» — с родительным падежом множественного числа: Mam dość twoich kłamstw." }
  - { kind: usage, text: "okazać się kłamstwem «оказаться ложью» — творительный падеж, как и в русском." }
  - { kind: usage, text: "Пословица kłamstwo ma krótkie nogi переводится дословно: «у лжи короткие ноги». Совпадение полное, запоминается сразу." }
collocations:
  - { pl: "to kłamstwo!", ru: "это ложь!" }
  - { pl: "mieć dość kłamstw", ru: "устать от лжи" }
  - { pl: "okazać się kłamstwem", ru: "оказаться ложью" }
  - { pl: "same kłamstwa", ru: "сплошная ложь" }
family:
  - { pl: "kłamać", ru: "лгать", relation: root, id: klamac }
  - { pl: "prawda", ru: "правда", relation: antonym, id: prawda }
  - { pl: "kłamca", ru: "лжец", relation: derived }
etymology: "От kłamać «лгать» с суффиксом -stwo. В современном русском родственного слова не осталось: «ложь» и «врать» идут от других корней."
memory: "kłamstwo — «ложь», от kłamać «лгать». Запомните mieć dość kłamstw «устать от лжи» с родительным и пословицу kłamstwo ma krótkie nogi — «у лжи короткие ноги», слово в слово как по-русски."
idioms:
  - { pl: "kłamstwo ma krótkie nogi", ru: "у лжи короткие ноги" }
  - { pl: "lepsza gorzka prawda niż słodkie kłamstwo", ru: "лучше горькая правда, чем сладкая ложь" }
  - { pl: "to kłamstwo!", ru: "это ложь!" }
formExamplesSkip:
