  - { form: "kłamstwie", reason: "предложный падеж единственного числа встречается редко: обычно берут творительный kłamstwem" }
  - { form: "kłamstwom", reason: "дательный падеж множественного числа встречается крайне редко" }
  - { form: "kłamstwu", reason: "дательный падеж единственного числа в живой речи почти не встречается" }
