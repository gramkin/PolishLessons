etymology: "От глагола SPRZEDAWAĆ «продавать», собранного из приставки S- , PRZED «перед» и DAĆ «дать»: буквально «отдать вперёд, передать». Русское «продавать» построено похоже, из «про» и «давать», и образ в обоих случаях один — передача из рук в руки за плату. Суффикс -CA образует названия действующих лиц от глаголов и очень продуктивен: SPRZEDAWCA, WYKONAWCA «исполнитель», DORADCA «советник», ZABÓJCA «убийца», OBROŃCA «защитник». По нему незнакомое слово читается как «тот, кто делает», и именно этот суффикс тянет за собой женские окончания, потому что исторически -CA было существительным женского склонения."
memory: "Мужской род с женскими окончаниями, второй такой случай после obrońca: sprzedawcy, sprzedawcę, sprzedawcą, но dobry sprzedawca. Весь разряд: kolega, kierowca, sprzedawca, obrońca, mężczyzna — как русские «дядя» и «судья». Женская форма sprzedawczyni. Суффикс -ca даёт действующих лиц: wykonawca, doradca, zabójca."
