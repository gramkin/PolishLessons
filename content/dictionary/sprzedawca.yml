notes:
  - { kind: usage, text: "Это второе в словаре существительное мужского рода с женскими окончаниями, после OBROŃCA, и класс стоит считать подтверждённым: родительный, дательный и местный единственного — SPRZEDAWCY, винительный — SPRZEDAWCĘ, творительный — SPRZEDAWCĄ, звательный — SPRZEDAWCO. Согласование при этом мужское: DOBRY SPRZEDAWCA, а не DOBRA. Весь разряд: KOLEGA, KIEROWCA, SPRZEDAWCA, OBROŃCA, MĘŻCZYZNA, и русский знает то же устройство в словах «дядя» и «судья». Женская форма — SPRZEDAWCZYNI, с особым суффиксом -YNI, и она употребляется наравне с мужской." }
  - { kind: government, text: "Что продаёт — родительный без предлога: SPRZEDAWCA SAMOCHODÓW «продавец автомобилей», SPRZEDAWCA GAZET. Где работает — предлог W с местным: SPRZEDAWCA W PIEKARNI. Именительный множественного SPRZEDAWCY совпадает с родительным единственного, и различать их приходится по контексту: SPRZEDAWCY PRZYSZLI «продавцы пришли», но BEZ SPRZEDAWCY «без продавца». В юридическом смысле слово образует пару с KUPUJĄCY «покупатель», причастием в роли существительного, как PRZEWODNICZĄCY." }
  - { kind: pronunciation, text: "Читается «спшэда́фца», ударение на предпоследнем слоге. Начальное SPRZ даёт «спш»: R после P оглушается и переходит в «ш», отсюда непривычное для русского стечение трёх согласных. Буква E звучит «э». Сочетание WC на конце основы оглушается, и W становится «ф»: «да́фца», а не «да́вца». Слово четырёхсложное: SPRZE-DAW-CA — точнее трёхсложное, и ударение падает на -DAW-." }
  - { kind: false-friend, text: "Значение совпадает с русским «продавцом» полностью, в обоих смыслах — и работник магазина, и сторона договора. Ловушка только в склонении, разобранном выше: русский склоняет «продавца» по мужскому типу, а польский по женскому, и формы SPRZEDAWCY, SPRZEDAWCĘ выглядят для русского как женские. Запомнить помогает сравнение с «дядей»: мы тоже говорим «дяди», «дядю», не меняя мужского рода слова. Разница лишь в том, что в польском таких существительных заметно больше." }
