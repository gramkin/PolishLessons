etymology: "Из средневековой латыни totalis, от totus «весь, целый». В двадцатом веке слово стало политическим: «тотальная война» Людендорфа, «тоталитарное государство». Польский разговорный усилитель — уже конец двадцатого века, под влиянием английского totally, и в этом польский опередил русский."
memory: "Totalny — в разговоре просто «полный»: totalny chaos, totalna porażka, totalny idiota. В книгах — тотальный: wojna totalna. Читается «тота́льны», о без аканья."
idioms:
  - { pl: "totalny odlot", ru: "полный улёт, полный отпад" }
