senses:
  - id: total-colloquial
    ru: "разг. полный, совершенный (усилитель)"
    examples:
      - pl: "To był totalny chaos."
        ru: "Это был полный хаос."
        source: { kind: authored }
      - pl: "Czuję się jak totalny idiota."
        ru: "Я чувствую себя полным идиотом."
        source: { kind: authored }
      - pl: "Ta impreza to totalna porażka."
        ru: "Эта вечеринка — полный провал."
        source: { kind: authored }
  - id: total
    ru: "тотальный, всеобъемлющий"
    examples:
      - pl: "Wojna totalna nie oszczędza nikogo."
        ru: "Тотальная война никого не щадит."
        source: { kind: authored }
      - pl: "Rząd ogłosił totalną mobilizację."
        ru: "Правительство объявило тотальную мобилизацию."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Русское «тотальный» — слово книжное и мрачное: «тотальная война», «тотальный контроль». Польское TOTALNY в этом смысле тоже есть, но в разговоре оно служит обычным усилителем, как русское «полный» или молодёжное «тотально»: TOTALNY ODLOT, «полный улёт», TOTALNA KASZANA, «полная каша». Не переводите его в бытовой речи как «тотальный» — прозвучит странно." }
  - { kind: usage, text: "Степеней сравнения нет. Все одиннадцать форм живые. Форма для мужчин-людей TOTALNI держится в разговорном значении: TOTALNI AMATORZY, TOTALNI IGNORANCI, то есть «полные дилетанты, полные невежды». Наречие TOTALNIE, «совершенно», в молодёжной речи встречается на каждом шагу." }
  - { kind: government, text: "Как усилитель прилагательное стоит перед существительным: TOTALNY CHAOS, TOTALNA PORAŻKA. В терминах — после: WOJNA TOTALNA, OPOZYCJA TOTALNA. Требований к падежу нет." }
  - { kind: pronunciation, text: "Читается «тота́льны», три слога, ударение на предпоследнем. Оба O чёткие, без русского аканья: «то-та», а не «та-та». L перед N мягкая, «ль», как и в наречии TOTALNIE «тота́льне»." }
  - { kind: register, text: "Во втором значении слово нейтральное и книжное. В первом — разговорное и молодёжное, в официальном письме его лучше избегать: вместо TOTALNA PORAŻKA напишите CAŁKOWITA PORAŻKA или ZUPEŁNA PORAŻKA. В политике OPOZYCJA TOTALNA, «тотальная оппозиция», — ярлык для оппозиции, которая против всего." }
collocations:
  - { pl: "totalny chaos", ru: "полный хаос" }
  - { pl: "totalna porażka", ru: "полный провал" }
