# review
id: przerwac
format: 2
lemma: "przerwać"
rank: 1465
pos: verb
pron: { cyr: "пшэ́рваць" }
senses:
  - id: interrupt-activity
    ru: "прервать, прекратить (что-л.)"
    examples:
      - pl: "Musimy przerwać spotkanie."
        ru: "Нам надо прервать встречу."
        source: { kind: authored }
      - pl: "Deszcz przerwał mecz."
        ru: "Дождь прервал матч."
        source: { kind: authored }
      - pl: "Przerwano mecz z powodu burzy."
        ru: "Матч прервали из-за грозы."
        source: { kind: authored }
  - id: interrupt-person
    ru: "перебить (кого-л. — с ДАТЕЛЬНЫМ)"
    examples:
      - pl: "Przerwał mi w pół słowa."
        ru: "Он перебил меня на полуслове."
        source: { kind: authored }
      - pl: "Przerwij mi, kiedy się pomylę."
        ru: "Перебей меня, когда я ошибусь."
        source: { kind: authored }
  - id: breaking-off
    ru: "przerwanie — прерывание, прекращение"
    examples:
      - pl: "Przerwanie dostaw sparaliżowało miasto."
        ru: "Прекращение поставок парализовало город."
        source: { kind: authored }
      - pl: "Domagali się przerwania prac."
        ru: "Они требовали прекращения работ."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Слово прямо отвечает русскому «прервать»: prze- плюс rwać, то есть «пре-» плюс «рвать». Совпадает и производное: przerwa — это «перерыв». Но есть одно расхождение, и оно важное, см. ниже про падеж при человеке." }
  - { kind: government, text: "ГЛАВНОЕ отличие от русского. Прервать ДЕЛО — винительный, как по-русски: przerwać pracę, przerwać ciszę, przerwać mecz. Но перебить ЧЕЛОВЕКА — ДАТЕЛЬНЫЙ: przerwać MI, przerwać MU, przerwać KOMUŚ. По-русски здесь винительный («перебить меня»), по-польски нельзя: przerwać mnie — ошибка." }
  - { kind: usage, text: "Глагол совершенного вида, поэтому формы настоящего времени (przerwę, przerwiesz, przerwie) значат будущее. Несовершенная пара — przerywać. Отглагольное существительное przerwanie склоняется как обычное существительное среднего рода." }
collocations:
  - { pl: "przerwać milczenie", ru: "прервать молчание" }
  - { pl: "przerwać komuś w pół słowa", ru: "перебить кого-л. на полуслове" }
  - { pl: "przerwać pracę", ru: "прервать работу" }
family:
  - { pl: "przerwa", ru: "перерыв, пауза", relation: derived, id: przerwa }
  - { pl: "rwać", ru: "рвать", relation: root }
  - { pl: "przerywać", ru: "прерывать", relation: aspect }
etymology: "Приставка prze- плюс rwać, праславянское *rъvati «рвать». Русское «прервать» собрано из тех же частей — «пре-» и «рвать», — поэтому слова совпадают и по форме, и по смыслу. Из того же гнезда przerwa «перерыв», буквально «разрыв», и русское «перерыв» построено так же."
memory: "przerwać — «прервать», prze- + rwać, часть в часть. Запомните единственное расхождение: дело прерывают в винительном (przerwać pracę), а человека перебивают в ДАТЕЛЬНОМ — przerwać mi, не przerwać mnie."
idioms:
  - { pl: "przerwać milczenie", ru: "прервать молчание" }
  - { pl: "przerwać komuś w pół słowa", ru: "перебить кого-л. на полуслове" }
formExamplesSkip:
  - { form: "przerwani", reason: "Мужско-личная форма страдательного причастия. Глагол przerwać требует винительного падежа только для действий (przerwać pracę), а человека ставит в ДАТЕЛЬНЫЙ (przerwać komuś). Винительного дополнения-лица у него нет, поэтому превратить человека в подлежащее страдательного оборота не получается — грамматического подлежащего для этой формы просто не существует." }
