# review
id: dokonczyc
format: 2
lemma: "dokończyć"
rank: 1873
pos: verb
aspect: perf
pron: { cyr: "доко́нчыць" }
senses:
  - id: finish
    ru: "закончить, договорить, доделать"
    examples:
      - pl: "Dokończ robotę."
        ru: "Закончи работу."
        source: { kind: translated, id: 8182289 }
      - pl: "Dokończ opowieść."
        ru: "Закончи рассказ."
        source: { kind: translated, id: 999232 }
      - pl: "Chcę dokończyć pracę."
        ru: "Я хочу закончить работу."
        source: { kind: translated, id: 13561609 }
  - id: let-finish
    ru: "дать договорить, доделать"
    examples:
      - pl: "Pozwól mi dokończyć."
        ru: "Дай мне договорить."
        source: { kind: translated, id: 10595523 }
      - pl: "Pozwól mu dokończyć."
        ru: "Дай ему договорить."
        source: { kind: translated, id: 6487954 }
      - pl: "Nie dałeś mi dokończyć zdania."
        ru: "Ты не дал мне закончить предложение."
        source: { kind: translated, id: 4953333 }
notes:
  - { kind: usage, text: "Приставка do- значит «до конца»: dokończyć — довести до конца то, что уже начато. Просто «закончить» — skończyć." }
  - { kind: government, text: "Закончить что-то — dokończyć coś (винительный падеж): dokończ robotę, dokończ opowieść." }
  - { kind: usage, text: "Pozwól mi dokończyć — «дай мне договорить», частая реплика в споре." }
  - { kind: usage, text: "Совершенный вид; несовершенный — dokańczać. Существительное dokończenie «завершение»." }
collocations:
  - { pl: "dokończyć pracę", ru: "закончить работу" }
  - { pl: "pozwól mi dokończyć", ru: "дай мне договорить" }
  - { pl: "dokończyć zdanie", ru: "закончить предложение" }
family:
  - { pl: "skończyć", ru: "закончить", relation: root, id: skonczyc }
  - { pl: "zakończyć", ru: "завершить", relation: root, id: zakonczyc }
  - { pl: "koniec", ru: "конец", relation: root }
etymology: "Приставка do- «до конца» плюс kończyć «кончать», от koniec «конец». Русское «докончить» построено ровно так же."
memory: "dokończyć — «довести до конца» уже начатое: dokończ robotę. Просто «закончить» — skończyć. И Pozwól mi dokończyć «дай мне договорить»."
idioms:
