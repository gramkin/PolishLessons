pron: { cyr: "кна́йпа" }
senses:
  - id: pub
    ru: "забегаловка, кафе, бар (разг.)"
    examples:
      - pl: "Spotkajmy się w knajpie na rogu."
        ru: "Давай встретимся в кафешке на углу."
        source: { kind: authored }
      - pl: "W tej knajpie dają świetne pierogi."
        ru: "В этой забегаловке дают отличные вареники."
        source: { kind: authored }
      - pl: "Po pracy poszli do knajpy."
        ru: "После работы они пошли в бар."
        source: { kind: authored }
  - id: dive
    ru: "кабак, притон (пренебр.)"
    examples:
      - pl: "To podła knajpa pełna pijaków."
        ru: "Это гнусный кабак, полный пьяниц."
        source: { kind: authored }
      - pl: "Spędza całe noce po knajpach."
        ru: "Он проводит целые ночи по кабакам."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "KNAJPA — разговорное «кафе, бар, ресторанчик», любое заведение, где едят и пьют. Не обязательно плохое: KLIMATYCZNA KNAJPA — «уютное заведение с атмосферой». Нейтрально — LOKAL, RESTAURACJA, BAR." }
  - { kind: register, text: "Слово разговорное. Оттенок зависит от прилагательного: FAJNA KNAJPA — хвалят, PODŁA KNAJPA — ругают. Ходить по барам — CHODZIĆ PO KNAJPACH." }
  - { kind: usage, text: "Девять форм, женский род. В местном и дательном P смягчается: W KNAJPIE. Родительный множественного — KNAJP. Звательный KNAJPO не употребляется." }
  - { kind: pronunciation, text: "Читается «кна́йпа»: KN в начале произносится слитно, без гласной. Ударение на первом слоге." }
collocations:
  - { pl: "klimatyczna knajpa", ru: "уютное заведение" }
  - { pl: "iść do knajpy", ru: "пойти в бар" }
  - { pl: "chodzić po knajpach", ru: "ходить по барам" }
family:
  - { pl: "knajpka", ru: "кафешка", relation: derived }
  - { pl: "restauracja", ru: "ресторан", relation: root, id: restauracja }
  - { pl: "lokal", ru: "заведение", relation: root, id: lokal }
etymology: "Из немецкого KNEIPE «пивная, кабак». В русском прямого соответствия нет: по смыслу «кафешка», «кабак»."
memory: "Knajpa — кафе, бар, забегаловка; разговорное. W knajpie — в баре. Chodzić po knajpach — ходить по барам. Читается «кна́йпа»."
idioms:
  - { pl: "chodzić po knajpach", ru: "шататься по барам" }
formExamplesSkip:
