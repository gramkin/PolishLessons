# review
id: przedstawiac
format: 2
lemma: "przedstawiać"
rank: 2365
pos: verb
aspect: imperf
aspectPair: przedstawic
pron: { cyr: "пшэтста́вяць" }
senses:
  - id: depict
    ru: "изображать, представлять (на картине)"
    examples:
      - pl: "Co przedstawia ten obraz?"
        ru: "Что изображает эта картина?"
        source: { kind: translated, id: 991243 }
      - pl: "Obraz przedstawia wyobrażenie bogini płodności."
        ru: "Картина изображает образ богини плодородия."
        source: { kind: translated, id: 6304079 }
      - pl: "Namalował obraz przedstawiający różę."
        ru: "Он написал картину, изображающую розу."
        source: { kind: translated, id: 366521 }
  - id: introduce
    ru: "представлять (кого-л. кому-л.)"
    examples:
      - pl: "Przedstawiam ci pana Tanakę."
        ru: "Представляю тебе господина Танаку."
        source: { kind: translated, id: 13264480 }
      - pl: "Uczniowie wstawali po jednym i przedstawiali się."
        ru: "Ученики вставали по одному и представлялись."
        source: { kind: translated, id: 717364 }
notes:
  - { kind: government, text: "Представить кого-л. кому-л. — przedstawić kogoś komuś: винительный и дательный. С się — «представиться»: przedstawić się." }
  - { kind: false-friend, text: "przed- + stawiać «ставить»: поставить перед. Русское «представлять» собрано ровно так же, от «ставить»." }
  - { kind: usage, text: "Третье частое значение — «подавать, предъявлять»: przedstawiać raport «представлять отчёт»." }
  - { kind: usage, text: "Совершенный вид — przedstawić. Причастие przedstawiający «изображающий» часто заменяет придаточное: obraz przedstawiający różę." }
collocations:
  - { pl: "przedstawić kogoś komuś", ru: "представить кого-л. кому-л." }
  - { pl: "przedstawiać się", ru: "представляться" }
etymology: "przed- + stawiać «ставить»; русское «представлять» собрано так же."
memory: "przedstawiać — «изображать» и «представлять» кого-л. кому-л.: винительный плюс дательный. С się — «представляться». Совершенный вид — przedstawić."
idioms:
  - { pl: "przedstawić kogoś komuś", ru: "представить кого-л. кому-л." }
