formExamples:
  - form: "przedstawia"
    pl: "Co przedstawia ten obraz?"
    ru: "Что изображает эта картина?"
    source: { kind: translated, id: 991243 }
  - form: "przedstawia"
    pl: "Obraz przedstawia wyobrażenie bogini płodności."
    ru: "Картина изображает образ богини плодородия."
    source: { kind: translated, id: 6304079 }
  - form: "przedstawia"
    pl: "Ten wykres przedstawia wyniki."
    ru: "Этот график представляет результаты."
    source: { kind: authored }
  - form: "przedstawiać"
    pl: "Trzeba przedstawiać fakty rzetelnie."
    ru: "Факты нужно представлять добросовестно."
    source: { kind: authored }
  - form: "przedstawiać"
    pl: "Nie chcę się przedstawiać."
    ru: "Я не хочу представляться."
    source: { kind: authored }
  - form: "przedstawiać"
    pl: "Zaczął przedstawiać swoją wersję."
    ru: "Он начал излагать свою версию."
    source: { kind: authored }
  - form: "przedstawiają"
    pl: "Co przedstawiają te kropki na mapie?"
    ru: "Что изображают эти точки на карте?"
    source: { kind: translated, id: 13824091 }
  - form: "przedstawiają"
    pl: "Rysunki przedstawiają zwierzęta."
    ru: "Рисунки изображают животных."
    source: { kind: authored }
  - form: "przedstawiają"
    pl: "Przedstawiają nowy projekt."
    ru: "Они представляют новый проект."
    source: { kind: authored }
  - form: "przedstawiający"
    pl: "Namalował obraz przedstawiający różę."
    ru: "Он написал картину, изображающую розу."
    source: { kind: translated, id: 366521 }
  - form: "przedstawiający"
    pl: "Obraz przedstawiający morze wisi w holu."
    ru: "Картина, изображающая море, висит в холле."
    source: { kind: authored }
  - form: "przedstawiający"
    pl: "Film przedstawiający wojnę zdobył nagrodę."
    ru: "Фильм, изображающий войну, получил награду."
    source: { kind: authored }
  - form: "przedstawiali"
    pl: "Uczniowie wstawali po jednym i przedstawiali się."
    ru: "Ученики вставали по одному и представлялись."
    source: { kind: translated, id: 717364 }
  - form: "przedstawiali"
    pl: "Przedstawiali nam swoje plany."
    ru: "Они представляли нам свои планы."
    source: { kind: authored }
  - form: "przedstawiali"
    pl: "Goście przedstawiali się po kolei."
    ru: "Гости представлялись по очереди."
    source: { kind: authored }
  - form: "przedstawiał"
    pl: "Przedstawiał mi ciebie, nie pamiętasz?"
    ru: "Он представлял мне тебя, не помнишь?"
    source: { kind: translated, id: 3031923 }
  - form: "przedstawiał"
    pl: "Ale mój rysunek nie przedstawiał kapelusza."
    ru: "Но мой рисунок изображал не шляпу."
    source: { kind: translated, id: 11011565 }
  - form: "przedstawiał"
    pl: "Przedstawiał sprawę bardzo rzeczowo."
    ru: "Он излагал дело очень по существу."
    source: { kind: authored }
  - form: "przedstawiam"
    pl: "Przedstawiam ci pana Tanakę."
    ru: "Представляю тебе господина Танаку."
    source: { kind: translated, id: 13264480 }
  - form: "przedstawiam"
    pl: "Przedstawiam państwu nowego dyrektora."
    ru: "Представляю вам нового директора."
    source: { kind: authored }
  - form: "przedstawiam"
    pl: "Przedstawiam wyniki badania."
    ru: "Я представляю результаты исследования."
    source: { kind: authored }
  - form: "przedstawiamy"
    pl: "Zgodnie z żądaniem, przedstawiamy nasz końcowy raport."
    ru: "Согласно требованию, мы представляем наш окончательный отчёт."
    source: { kind: translated, id: 6178919 }
  - form: "przedstawiamy"
    pl: "Przedstawiamy nowy produkt."
    ru: "Мы представляем новый продукт."
    source: { kind: authored }
  - form: "przedstawiamy"
    pl: "Przedstawiamy się na początku rozmowy."
    ru: "Мы представляемся в начале разговора."
    source: { kind: authored }
  - form: "przedstawiane"
    pl: "Wyniki są przedstawiane co kwartał."
    ru: "Результаты представляются ежеквартально."
    source: { kind: authored }
  - form: "przedstawiane"
    pl: "Dane bywają przedstawiane w tabeli."
    ru: "Данные иногда представляются в таблице."
    source: { kind: authored }
  - form: "przedstawiane"
    pl: "Sztuki są przedstawiane wieczorem."
    ru: "Пьесы представляются вечером."
    source: { kind: authored }
  - form: "przedstawiania"
    pl: "Ten agitator ma tendencję do przedstawiania trywialnych spraw w wyolbrzymiony sposób."
    ru: "У этого агитатора есть склонность представлять пустяковые дела в раздутом виде."
    source: { kind: translated, id: 1829507 }
  - form: "przedstawiania"
    pl: "Unikał przedstawiania szczegółów."
    ru: "Он избегал изложения подробностей."
    source: { kind: authored }
  - form: "przedstawiania"
    pl: "Nie lubię przedstawiania się obcym."
    ru: "Я не люблю представляться незнакомым."
    source: { kind: authored }
  - form: "przedstawiany"
    pl: "Bywa przedstawiany jako bohater."
    ru: "Его представляют как героя."
    source: { kind: authored }
  - form: "przedstawiany"
    pl: "Projekt jest przedstawiany radzie."
    ru: "Проект представляется совету."
    source: { kind: authored }
  - form: "przedstawiany"
    pl: "Był przedstawiany wszystkim gościom."
    ru: "Его представляли всем гостям."
    source: { kind: authored }
