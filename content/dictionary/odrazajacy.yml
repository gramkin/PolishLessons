notes:
  - { kind: false-friend, text: "Русскому ODRAŻAJĄCY не подсказывает, хотя корень знакомый: «отражать», то есть «отталкивать». ODRAŻAĆ — «вызывать отвращение, отталкивать», и ODRAŻAJĄCY — «отталкивающий, омерзительный». С русским «отражающий», о зеркале, связи нет: зеркало по-польски ODBIJA." }
  - { kind: usage, text: "Сравнивается описательно: BARDZIEJ ODRAŻAJĄCY. В карточке десять форм: мужское-личное множественное ODRAŻAJĄCY совпадает с именительным единственного. Сильное слово, сильнее, чем OBRZYDLIWY и WSTRĘTNY; о людях говорят с крайним осуждением." }
  - { kind: government, text: "Отвратительный для кого-то — ODRAŻAJĄCY DLA KOGOŚ, DLA с родительным. Глагол ODRAŻAĆ берёт винительный: TO MNIE ODRAŻA, «это меня отталкивает». Прилагательное чаще стоит перед существительным." }
  - { kind: pronunciation, text: "Читается «одража́йонцы», пять слогов, ударение на предпоследнем. RZ — «ж», J перед Ą — «й», Ą перед C — «он». Конечное CY — твёрдое «цы»." }
  - { kind: register, text: "Книжное и газетное слово, частое в судебной хронике и в рецензиях: ODRAŻAJĄCA ZBRODNIA. В быту о запахе или еде скорее скажут OBRZYDLIWY или OHYDNY. Для разговорной брезгливости есть FUJ! и BLEE!" }
collocations:
  - { pl: "odrażający zapach", ru: "омерзительный запах" }
  - { pl: "odrażająca zbrodnia", ru: "чудовищное преступление" }
  - { pl: "odrażający widok", ru: "отвратительное зрелище" }
family:
  - { pl: "odrażać", ru: "отталкивать, вызывать отвращение", relation: root }
  - { pl: "obrzydliwy", ru: "противный, мерзкий", relation: root, id: obrzydliwy }
  - { pl: "wstrętny", ru: "отвратительный", relation: root, id: wstretny }
etymology: "От ODRAŻAĆ «отталкивать», от старого RAZIĆ «бить, поражать», того же, что русское «разить» и «поразить». ODRAŻAĆ — «отбивать охоту», отталкивать. Русское «отражать» собрано из тех же частей, но ушло к зеркалам и ударам, а польское — к отвращению."
memory: "Odrażający — омерзительный, отталкивающий: odrażający zapach, odrażająca zbrodnia. Не «отражающий»! От odrażać — отталкивать. Читается «одража́йонцы»."
idioms:
  - { pl: "odrażająca zbrodnia", ru: "чудовищное злодеяние" }
