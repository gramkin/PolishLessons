  - { pl: "strzelec", ru: "стрелок", relation: derived, id: strzelec }
  - { pl: "bieganina", ru: "беготня", relation: derived }
etymology: "От STRZELAĆ «стрелять», а то — от STRZAŁA «стрела», из праславянского *strěla, откуда и русская «стрела». Корень общий и значение прозрачное: стрелять значит пускать стрелы. Суффикс -ANINA составной: сначала от глагола получается отглагольное существительное на -ANIE, STRZELANIE «стрельба», затем добавляется -INA, которое и приносит оттенок беспорядочной множественности. Русский строит такие слова иначе, через «-отня», но исходная логика та же: взять действие и показать, что его слишком много и оно утомляет."
memory: "Суффикс -ANINA = долгое беспорядочное действие, с неодобрением: strzelanina, bieganina «беготня», gadanina «болтовня». По-русски отвечает «-отня». Начальное strz читается «стш», три согласных слитно. Газетный оборот: doszło do strzelaniny."
idioms:
