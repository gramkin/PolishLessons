notes:
  - { kind: usage, text: "Самое полезное здесь — суффикс, потому что он правило, а не частность. Польское -ANINA образует существительные от глаголов и означает действие долгое, беспорядочное, надоедливое: STRZELAĆ даёт STRZELANINA «перестрелка», BIEGAĆ даёт BIEGANINA «беготня», GADAĆ даёт GADANINA «болтовня», PISAĆ даёт PISANINA «писанина». Оттенок почти всегда неодобрительный: это не одно действие, а сумятица из многих. Русский отвечает ему суффиксами «-отня» и «-овня»: «беготня», «болтовня», «трескотня», — и оценка в них та же." }
  - { kind: pronunciation, text: "Читается «стшэлани́на», в четыре слога, с ударением на предпоследнем, то есть на NI. Начальное strz — это три согласных подряд, «стш»: s, t и rz, где rz даёт «ж», но после глухого t оглушается в «ш». Отсюда «стш», а не «стж». Такое же начало в STRZAŁ «стшау» и STRZELEC. Русскому это скопление непривычно, но разбивать его гласной не нужно — три согласных произносятся слитно." }
  - { kind: false-friend, text: "Русского слова «стрелянина» нет, так что прямой пары не существует, и это как раз удобно: слово приходится переводить по смыслу. STRZELANINA — это «перестрелка», когда стреляют друг в друга, и «стрельба», когда стреляют долго и беспорядочно. Для одного выстрела есть STRZAŁ, для прицельной стрельбы как занятия — STRZELANIE. Так что STRZELANINA всегда подразумевает многократность и некоторый хаос, а нейтральное «стрельба» на стрельбище будет STRZELANIE." }
  - { kind: government, text: "Где — предлог W с предложным падежом: ZGINĄĆ W STRZELANINIE, RANNY W STRZELANINIE. Начало события передаётся оборотом DOSZŁO DO с родительным: DOSZŁO DO STRZELANINY «дошло до перестрелки», и это самый частый газетный оборот с этим словом. Форма родительного множественного — STRZELANIN, без окончания, как у всех существительных женского рода на -a: SERIA STRZELANIN «серия перестрелок»." }
collocations:
  - { pl: "doszło do strzelaniny", ru: "дошло до перестрелки" }
