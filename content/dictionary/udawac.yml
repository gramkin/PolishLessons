# review
id: udawac
format: 2
lemma: "udawać"
rank: 661
pos: verb
aspect: imperf
pron: { cyr: "уда́ваць" }
senses:
  - id: pretend
    ru: "притворяться, изображать (кого-л.)"
    note: "Переходное: udawać kogoś — винительный. udawał lekarza «выдавал себя за врача»."
    examples:
      - pl: "Udawał lekarza."
        ru: "Он выдавал себя за врача."
        source: { kind: translated, id: 718976 }
      - pl: "Tom udawał, że śpi."
        ru: "Том притворялся, что спит."
        source: { kind: translated, id: 3687049 }
      - pl: "Przestań udawać głupka!"
        ru: "Перестань валять дурака!"
        source: { kind: tatoeba, id: 3463016 }
  - id: succeed
    ru: "udać się — удаться, получиться"
    note: "Безлично с дательным: udało mi się «мне удалось»."
    examples:
      - pl: "Nieprzemyślane małżeństwa rzadko się udają."
        ru: "Необдуманные браки редко удаются."
        source: { kind: translated, id: 2571037 }
      - pl: "Zwykle mu się udawało."
        ru: "Обычно ему удавалось."
        source: { kind: translated, id: 3739648 }
      - pl: "Nie udawało mu się to za pierwszym razem."
        ru: "Ему это не удавалось с первого раза."
        source: { kind: authored }
  - id: head-for
    ru: "udawać się dokądś — направляться куда-либо"
    note: "Книжный оттенок: udać się do sądu «обратиться в суд»."
    examples:
      - pl: "Dokąd się udajesz?"
        ru: "Куда ты направляешься?"
        source: { kind: translated, id: 6554340 }
      - pl: "Obywatele udają się do sądu po sprawiedliwość."
        ru: "Граждане обращаются в суд за справедливостью."
        source: { kind: translated, id: 12072480 }
      - pl: "Udawali się do stolicy co miesiąc."
        ru: "Они ездили в столицу каждый месяц."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Три значения расходятся далеко, и различает их частица się: udawać kogoś «притворяться кем-то» (переходное), udać się «удаться» (безлично, с дательным), udawać się dokądś «направляться»." }
  - { kind: usage, text: "Совершенный вид — udać: udało się «удалось», udał lekarza «изобразил врача». Безличное udało mi się очень частое." }
  - { kind: usage, text: "Идиома udawać Greka значит «прикидываться дурачком», буквально «изображать грека» — русского аналога с греком нет." }
  - { kind: usage, text: "Причастие udawany значит «притворный, наигранный»: udawana sympatia «притворная симпатия»." }
collocations:
  - { pl: "udawać Greka", ru: "прикидываться дурачком" }
  - { pl: "udało mi się", ru: "мне удалось" }
  - { pl: "udawać, że...", ru: "притворяться, что..." }
  - { pl: "udać się do lekarza", ru: "обратиться к врачу" }
family:
  - { pl: "udać", ru: "удаться; изобразить", relation: derived }
  - { pl: "udany", ru: "удачный", relation: derived }
  - { pl: "udawanie", ru: "притворство", relation: derived }
etymology: "Приставка u- плюс dawać «давать», от праславянского *dati. Значение «удаться» выросло из «выйти, получиться», а «притворяться» — из «выдавать себя за кого-то»."
memory: "udawać — три значения, и различает их частица się. Без неё — «притворяться, изображать»: udawał lekarza, udawaj, że śpisz. С się безлично — «удаваться»: udało mi się «мне удалось», rzadko się udają. И с się же, но книжно, — «направляться»: udać się do lekarza «обратиться к врачу», dokąd się udajesz? Совершенный вид — udać. Идиома udawać Greka значит «прикидываться дурачком»."
idioms:
  - { pl: "udawać Greka", ru: "прикидываться дурачком" }
  - { pl: "udało mi się", ru: "мне удалось" }
  - { pl: "udać się do lekarza", ru: "обратиться к врачу" }
