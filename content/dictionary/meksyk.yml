pos: noun
pron: { cyr: "мэ́ксык" }
senses:
  - id: mexico
    ru: "Мексика"
    examples:
      - pl: "Kanada i Meksyk mają wspólną granicę z USA."
        ru: "Канада и Мексика имеют общую границу с США."
        source: { kind: translated, id: 2059013 }
      - pl: "Zarówno Kanada jak i Meksyk graniczą ze Stanami Zjednoczonymi."
        ru: "И Канада, и Мексика граничат с Соединёнными Штатами."
        source: { kind: translated, id: 669642 }
      - pl: "Teksas graniczy z Meksykiem."
        ru: "Техас граничит с Мексикой."
        source: { kind: translated, id: 5225129 }
      - pl: "Urodziła się w Meksyku."
        ru: "Она родилась в Мексике."
        source: { kind: translated, id: 2587250 }
      - pl: "Czy byłeś kiedykolwiek w Meksyku?"
        ru: "Ты когда-нибудь был в Мексике?"
        source: { kind: translated, id: 2973241 }
      - pl: "W Meksyku używa się hiszpańskiego."
        ru: "В Мексике используют испанский."
        source: { kind: translated, id: 744151 }
  - id: to-mexico
    ru: "в Мексику, из Мексики"
    examples:
      - pl: "Pojechała sama do Meksyku."
        ru: "Она поехала в Мексику одна."
        source: { kind: translated, id: 527531 }
      - pl: "Polecieliśmy samolotem do Meksyku."
        ru: "Мы полетели в Мексику на самолёте."
        source: { kind: translated, id: 3683882 }
      - pl: "Przełożyła swój wyjazd do Meksyku."
        ru: "Она отложила свою поездку в Мексику."
        source: { kind: translated, id: 933318 }
notes:
  - { kind: usage, text: "Пишется с прописной буквы: Meksyk. Прилагательное — meksykański «мексиканский», жительница — Meksykanka." }
  - { kind: usage, text: "Название столицы совпадает с названием страны, как и в русском: Meksyk — и страна, и город." }
  - { kind: usage, text: "Предложный падеж w Meksyku «в Мексике», винительный направления do Meksyku «в Мексику» с родительным после do." }
  - { kind: false-friend, text: "В разговорной речи meksyk со строчной буквы иногда значит «бардак, неразбериха». Это сленг, и в учебных текстах он не встречается." }
  - { kind: usage, text: "Как и другие названия стран, слово живёт в единственном числе: форм вроде Meksyki или Meksykom в обычной речи нет." }
collocations:
  - { pl: "w Meksyku", ru: "в Мексике" }
  - { pl: "do Meksyku", ru: "в Мексику" }
  - { pl: "graniczyć z Meksykiem", ru: "граничить с Мексикой" }
etymology: "Из испанского México, от названия ацтекской столицы Mēxihco. Русское «Мексика» пришло тем же путём, поэтому слова почти совпадают, только польский сохранил ударение на первом слоге."
memory: "Meksyk — «Мексика», и страна, и её столица. Предложный: w Meksyku «в Мексике», направление: do Meksyku «в Мексику»."
