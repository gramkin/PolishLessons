etymology: "Приставка PO- плюс LICZYĆ, от праславянского корня *lik-, обозначавшего счёт, число и собрание. В русском этот корень сохранился не в самом глаголе счёта, а вокруг него: «наличие», «количество», «перекличка», «отличаться», «наличные». Особенно ясно исходное значение видно в «перекличке» — это счёт людей по именам. Польский же сделал корень основным: LICZYĆ «считать», LICZBA «число», LICZNY «многочисленный». Тот же *likъ дал русские «лик» и «личина», где значение ушло к внешнему виду. Приставочное PO- здесь работает ровно как русское «по-» в «посчитать», обозначая доведённое до конца действие."
memory: "Корень живёт в русском вокруг счёта, а не в нём самом: «перекличка», «наличие», «количество» — это он. Польский сделал его главным: liczyć «считать», liczba «число», policzyć «посчитать». Ловушка рядом: policzek значит «щека» и «пощёчина» и происходит от lice «лицо», а не от счёта. Произношение конца слова непривычное — «чычь», твёрдое «ч» и сразу мягкое. И помнить liczyć na kogoś «рассчитывать на кого-то»."
idioms:
