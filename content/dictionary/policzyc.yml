notes:
  - { kind: false-friend, text: "Рядом с этим глаголом стоит слово-ловушка. POLICZEK значит «щека», а в переносном смысле «пощёчина»: DAĆ KOMUŚ POLICZEK — «дать пощёчину». К счёту оно отношения не имеет, хотя выглядит как родственник: POLICZEK идёт от PO плюс LICE, то есть от русского «лица», а POLICZYĆ — от LICZYĆ «считать». Совпадение чисто внешнее, и путать их не стоит. Само LICZYĆ отвечает русскому «считать», а LICZBA — «числу»; русское «считать» в польском звучало бы как CZYTAĆ, что значит «читать»." }
  - { kind: government, text: "Прямое дополнение в винительном: POLICZYĆ GŁOSY, POLICZYĆ PIENIĄDZE, POLICZYĆ OBECNYCH. Счёт до числа идёт через DO с родительным, как и по-русски: POLICZYĆ DO DZIESIĘCIU «сосчитать до десяти». Во втором значении схема другая: POLICZYĆ KOMUŚ ZA COŚ — дательный на лицо и ZA с винительным на предмет: POLICZYLI MI ZA DWIE NOCE «с меня взяли за две ночи». Оборот POLICZYĆ COŚ KOMUŚ ZA BŁĄD значит «засчитать кому-то в ошибку», и здесь русский тоже берёт дательный." }
  - { kind: usage, text: "Несовершенный партнёр — LICZYĆ, и приставка PO- придаёт действию завершённость, как русское «по-» в «посчитать». Разница с русским в том, что POLICZYĆ покрывает и «посчитать», и «сосчитать», и «пересчитать»; для подчёркнутого пересчёта есть PRZELICZYĆ. Пятьдесят три формы — подпись переходного глагола совершенного вида, с деепричастием POLICZYWSZY и полным страдательным причастием POLICZONY. В основе работает чередование CZ и C: POLICZYĆ, но причастие POLICZONY и существительное POLICZENIE." }
  - { kind: pronunciation, text: "Читается «поли́чычь», три слога, ударение на предпоследнем. Сочетание CZ даёт твёрдое «ч», а Y после него — звук «ы», поэтому конец слова звучит как «чычь», с твёрдым «ч» и мягким «чь» подряд. Это сочетание для русского уха непривычно, и проговаривать его стоит медленно. В причастии POLICZONY буква C перед O читается как «ц»: «полицо́ны». В формах прошедшего времени Ł звучит как «у»: POLICZYŁEM это «поли́чыуэм»." }
  - { kind: register, text: "Слово нейтральное и очень частотное, одинаково уместное в быту и в документе. Из гнезда стоит знать LICZBA «число», LICZNY «многочисленный», LICZNIK «счётчик», OBLICZYĆ «вычислить», PRZELICZYĆ «пересчитать», ROZLICZYĆ SIĘ «рассчитаться». Отдельно живёт LICZYĆ NA KOGOŚ «рассчитывать на кого-то», и это значение от счёта уже оторвалось: LICZĘ NA CIEBIE «я на тебя рассчитываю»." }
collocations:
