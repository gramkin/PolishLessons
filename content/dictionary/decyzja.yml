# review
id: decyzja
format: 2
lemma: "decyzja"
rank: 560
pos: noun
pron: { cyr: "дэцы́зья" }
senses:
  - id: decision
    ru: "решение"
    note: "Решение не «берут», а подejmują: podjąć decyzję «принять решение»."
    examples:
      - pl: "Mogę podejmować niezależne decyzje."
        ru: "Я могу принимать самостоятельные решения."
        source: { kind: tatoeba, id: 2495852 }
      - pl: "Podjąłem decyzję."
        ru: "Я принял решение."
        source: { kind: translated, id: 526736 }
      - pl: "Tom z trudnością podejmuje decyzje."
        ru: "Тому трудно принимать решения."
        source: { kind: translated, id: 1355955 }
  - id: ruling
    ru: "решение (официальное, судебное)"
    note: "decyzja zapadła «решение принято» — безлично."
    examples:
      - pl: "Decyzja zapadła."
        ru: "Решение принято."
        source: { kind: translated, id: 818006 }
      - pl: "Opinia publiczności pokryła się z decyzją jury."
        ru: "Мнение публики совпало с решением жюри."
        source: { kind: translated, id: 2317642 }
      - pl: "Decyzja należy do czytelnika."
        ru: "Решение за читателем."
        source: { kind: translated, id: 367597 }
notes:
  - { kind: government, text: "Решение «принимают» глаголом podjąć: podjąć decyzję. Сочетания *wziąć decyzję в польском нет." }
  - { kind: usage, text: "Безличный оборот decyzja zapadła значит «решение принято»." }
  - { kind: government, text: "Соглашаются с решением через творительный: zgadzam się z tą decyzją «я согласен с этим решением»." }
  - { kind: usage, text: "Родственные глаголы: decydować «решать», zdecydować «решить», zdecydować się «решиться»." }
collocations:
  - { pl: "podjąć decyzję", ru: "принять решение" }
  - { pl: "decyzja zapadła", ru: "решение принято" }
  - { pl: "zmienić decyzję", ru: "изменить решение" }
  - { pl: "decyzja należy do ciebie", ru: "решение за тобой" }
family:
  - { pl: "decydować", ru: "решать", relation: root }
  - { pl: "zdecydować", ru: "решить", relation: derived }
  - { pl: "decyzyjny", ru: "решающий", relation: derived }
etymology: "Из латинского decisio «решение» через немецкое Dezision. Корень тот же, что в русском «децизия» старых канцелярских текстов."
memory: "decyzja — «решение», и главное здесь глагол: решение не «берут», его podejmuje się — podjąć decyzję «принять решение». Второй оборот безличный: decyzja zapadła «решение принято». Соглашаются с решением через творительный: zgadzam się z tą decyzją. Родственные глаголы — decydować «решать» и zdecydować się «решиться»."
idioms:
  - { pl: "podjąć decyzję", ru: "принять решение" }
  - { pl: "decyzja zapadła", ru: "решение принято" }
  - { pl: "decyzja należy do ciebie", ru: "решение за тобой" }
formExamplesSkip:
  - { form: "decyzyj", reason: "архаичный вариант родительного множественного; современная форма — decyzji, и в корпусе нет ни одного примера" }
