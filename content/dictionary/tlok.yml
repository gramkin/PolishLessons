# review
id: tlok
format: 2
lemma: "tłok"
rank: 6015
pos: noun
pron: { cyr: "туо́к" }
senses:
  - id: crowd
    ru: "давка, толчея, теснота"
    examples:
      - pl: "W pociągu był tłok."
        ru: "В поезде была давка."
        source: { kind: translated, id: 1170387 }
      - pl: "W autobusie był straszliwy tłok."
        ru: "В автобусе была страшная давка."
        source: { kind: translated, id: 365686 }
      - pl: "W pociągu był taki tłok, że całą drogę musiałem stać."
        ru: "В поезде была такая давка, что всю дорогу мне пришлось стоять."
        source: { kind: translated, id: 366635 }
  - id: piston
    ru: "поршень"
    examples:
      - pl: "Tłok porusza się w cylindrze."
        ru: "Поршень движется в цилиндре."
        source: { kind: authored }
      - pl: "Mechanik wymienił zużyty tłok."
        ru: "Механик заменил изношенный поршень."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Два родительных по значению: TŁOKU — «давки» (NIE MA TŁOKU «нет давки»), TŁOKA — «поршня» (RUCH TŁOKA «ход поршня»). «Давка» не имеет множественного числа: TŁOKI, TŁOKÓW — это только поршни." }
  - { kind: usage, text: "Где русский скажет «людно», «народу битком», поляк говорит JEST TŁOK: W SKLEPIE JEST TŁOK «в магазине толчея». Тесниться, толпиться — TŁOCZYĆ SIĘ." }
  - { kind: pronunciation, text: "Читается «туо́к» в один слог: Ł — краткое «у», слитно с T. Не «тлок»." }
collocations:
  - { pl: "tłok w autobusie", ru: "давка в автобусе" }
  - { pl: "panuje tłok", ru: "стоит толчея" }
  - { pl: "stać w tłoku", ru: "стоять в давке" }
  - { pl: "tłok silnika", ru: "поршень двигателя" }
family:
  - { pl: "tłoczyć", ru: "давить, штамповать", relation: root }
  - { pl: "tłoczyć się", ru: "толпиться, тесниться", relation: root }
  - { pl: "natłok", ru: "наплыв, скопление", relation: root }
  - { pl: "tłokowy", ru: "поршневой", relation: derived }
synonyms: ["ścisk", "natłok"]
etymology: "Тот же корень, что в глаголе TŁOCZYĆ «давить, теснить»: TŁOK — и то место, где давят, и деталь, которая давит."
memory: "Tłok — где все толкаются: давка. И деталь, которая давит: поршень. W autobusie tłok — в автобусе давка."
idioms:
  - { pl: "stać w tłoku", ru: "толкаться в толпе" }
