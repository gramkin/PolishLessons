notes:
  - { kind: false-friend, text: "Значение близко к русскому «начальнику», но объём уже. NACZELNIK — это должность с названием: NACZELNIK WYDZIAŁU, NACZELNIK URZĘDU SKARBOWEGO, NACZELNIK STACJI. Начальник вообще, то есть всякий, кто над тобой стоит, называется SZEF в разговоре и KIEROWNIK или PRZEŁOŻONY в официальной речи. Поэтому сказать о своём непосредственном руководителе MÓJ NACZELNIK можно только если он действительно носит этот титул. Корни у двух слов разные: польское идёт от CZOŁO «лоб, чело» через NA CZELE «во главе», русское — от «начала»." }
  - { kind: usage, text: "Десять форм, мужской род, одушевлённое лицо. Именительный множественного — NACZELNICY, где заднеязычное K переходит в C перед окончанием -Y: это обязательное смягчение для названий лиц, и по нему же идут ROBOTNICY, URZĘDNICY, ROLNICY. Местный и звательный единственного — NACZELNIKU, с окончанием -U, потому что основа кончается на K. Отсюда обращение PANIE NACZELNIKU, построенное так же, как PANIE INŻYNIERZE, но с другим окончанием. Винительный единственного равен родительному, NACZELNIKA." }
  - { kind: pronunciation, text: "Читается «начэ́льник», три слога, ударение на втором. Буквосочетание CZ даёт твёрдое «ч», а E после него звучит как «э», без смягчения: не «че», а «чэ». Сочетание LN произносится с мягким L, отсюда «льн». В форме NACZELNICY конечное C это «ц», и слово звучит «начэ́льницы», с твёрдым «ы». В форме NACZELNIKIEM слышно «начэ́льникем». В форме NACZELNIKÓW буква Ó даёт «у», а конечное W оглушается: «начэ́льникуф»." }
  - { kind: register, text: "Слово официальное и канцелярское, принадлежит языку учреждений. Устойчивые сочетания: NACZELNIK WYDZIAŁU, NACZELNIK URZĘDU SKARBOWEGO «начальник налоговой инспекции», NACZELNIK WIĘZIENIA. Обращение PANIE NACZELNIKU употребляется в учреждении постоянно. В истории слово имеет особый вес: NACZELNIK PAŃSTWA было официальным титулом главы государства в двадцатых годах, а NACZELNIK в восстании восемнадцатого века означал главнокомандующего. В разговоре о работе чаще скажут SZEF, и это слово нейтральное, а не фамильярное." }
