etymology: "От прилагательного NACZELNY «главный», а оно — от оборота NA CZELE «во главе», где CZOŁO значит «лоб, чело». То есть начальник у поляков — тот, кто стоит во главе, буквально «челом вперёд». Русское «начальник» построено от другого корня, от «начала»: начальник — тот, кто начинает, кто первый. Мысль похожа, а образ разный, и это хорошо видно в соседних словах: польское NA CZELE отвечает русскому «во главе», и русский знает корень в словах «чело» и «челобитная». Суффикс -NIK в обоих языках один и тот же и образует названия лиц по признаку: PRACOWNIK, ROLNIK, URZĘDNIK, ровно как «работник», «начальник», «чиновник»."
memory: "Похоже на «начальника», но корень другой: от na czele «во главе», где czoło это «чело, лоб», тогда как русское слово от «начала». И объём уже: naczelnik это титул должности, naczelnik wydziału, а начальник вообще — szef или kierownik. Именительный множественного naczelnicy с меной k→c, как robotnicy и urzędnicy. Обращение в учреждении: panie naczelniku."
