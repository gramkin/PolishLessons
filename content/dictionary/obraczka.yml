notes:
  - { kind: false-friend, text: "Образ здесь тот же, что у нас, только упакован иначе. OBRĄCZKA это уменьшительное от OBRĘCZ «обруч», и русское «обручальное» идёт от того же «обруча». Но поляку хватает одного слова там, где нам нужно два. И запомните разведение: OBRĄCZKA это только венчальное кольцо, гладкое, а всякое другое, с камнем или узором, называется PIERŚCIONEK. Русское «кольцо» покрывает оба." }
  - { kind: usage, text: "Десять форм, женский род. В дательном и местном падежах K переходит в C: OBRĄCZKA, но NA OBRĄCZCE. В родительном множественного появляется беглое E: OBRĄCZEK. Носовой Ą держится во всех формах. Звательный OBRĄCZKO встречается только в стихах. Самая частая форма — винительный OBRĄCZKĘ, потому что кольцо чаще всего носят, снимают и теряют." }
  - { kind: government, text: "Носить кольцо — NOSIĆ OBRĄCZKĘ, винительный без предлога. На кольце — NA OBRĄCZCE, местный падеж с переходом K в C. С кольцом на пальце — Z OBRĄCZKĄ NA PALCU, творительный после Z и местный после NA. Снять кольцо — ZDJĄĆ OBRĄCZKĘ, винительный. Обратите внимание, что по-польски кольцо носят NA PALCU, как и по-русски «на пальце»." }
  - { kind: pronunciation, text: "Читается «обро́нчка», три слога, ударение на предпоследнем. Носовой Ą перед CZ даёт «он», поэтому середина слова это «рон». Сочетание CZ даёт «ч». В форме OBRĄCZCE сочетание CC читается как «цэ»: «обро́нцце». Буква B перед R не оглушается, начало слова это «обр», а не «опр»." }
  - { kind: register, text: "Слово нейтральное и обиходное, из разговора о свадьбе: OBRĄCZKI ŚLUBNE покупают парой, и в польском венчании их приносит DRUŻBA, шафер. Второе значение техническое, из языка птицеловов и биологов: ptaki OBRĄCZKUJE SIĘ, то есть кольцуют, чтобы следить за перелётами, и глагол OBRĄCZKOWAĆ значит именно это." }
