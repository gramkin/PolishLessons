etymology: "Уменьшительное от OBRĘCZ «обруч», а то — праславянское слово с носовым, от приставки OB- и корня «рука»: обруч это то, что обхватывает, как рука. Русский «обруч» собран ровно так же, и в нём тот же корень. Работает здесь и правило носовых: где поляк пишет Ę, у нас стоит У, отсюда OBRĘCZ при «обруче», как RĘKA при «руке». Значит, кольцо, рука и обруч — одна семья."
memory: "Обручальное кольцо, уменьшительное от obrecz «обруч», и русское «обручальное» идёт от того же корня. Читается «обро́нчка», где a с хвостиком перед cz даёт «он». Запомните разведение: obraczka это только гладкое венчальное кольцо, а всякое другое — pierscionek. В дательном и местном k переходит в c: na obraczce. И корень в обруче тот же, что в руке."
