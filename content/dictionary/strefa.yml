# review
id: strefa
format: 2
lemma: "strefa"
rank: 1751
pos: noun
pron: { cyr: "стрэ́фа" }
senses:
  - id: zone
    ru: "зона, полоса"
    examples:
      - pl: "To strefa turystyczna."
        ru: "Это туристическая зона."
        source: { kind: translated, id: 13335481 }
      - pl: "W tej strefie nie ma plaż."
        ru: "В этой зоне нет пляжей."
        source: { kind: translated, id: 3633674 }
      - pl: "W dzisiejszych czasach strefa bezpieczeństwa nie zawsze jest bezpieczna."
        ru: "В наше время зона безопасности не всегда безопасна."
        source: { kind: translated, id: 597912 }
  - id: zone-time
    ru: "зона, пояс (часовой, валютный)"
    examples:
      - pl: "Rosja ma 11 stref czasowych."
        ru: "В России 11 часовых поясов."
        source: { kind: translated, id: 13627084 }
      - pl: "Czy Grecja opuści strefę euro?"
        ru: "Покинет ли Греция зону евро?"
        source: { kind: translated, id: 2278934 }
notes:
  - { kind: usage, text: "strefa czasowa — «часовой пояс» (буквально «временная зона»), strefa euro — «зона евро»." }
  - { kind: usage, text: "szara strefa — «теневая экономика», буквально «серая зона»." }
  - { kind: government, text: "Где — w strefie (предложный падеж), куда — do strefy (родительный): mieszkam w innej strefie czasowej." }
  - { kind: false-friend, text: "У польского strefa нет тюремных оттенков русской «зоны»: это нейтральное слово, просто выделенный участок." }
collocations:
  - { pl: "strefa czasowa", ru: "часовой пояс" }
  - { pl: "strefa euro", ru: "зона евро" }
  - { pl: "szara strefa", ru: "теневая экономика" }
family:
  - { pl: "strefowy", ru: "зональный", relation: root }
etymology: "Заимствование со значением «полоса, пояс». Русское «зона» пришло из греческого другим путём, хотя значения совпали."
memory: "strefa — «зона, полоса»: strefa czasowa «часовой пояс», strefa euro «зона евро», szara strefa «теневая экономика». Предлог w с предложным падежом: w tej strefie."
idioms:
  - { pl: "szara strefa", ru: "теневая экономика" }
