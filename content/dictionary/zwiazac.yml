# review
id: zwiazac
format: 2
lemma: "związać"
rank: 1171
pos: verb
aspect: perf
pron: { cyr: "звьо́нзаць" }
senses:
  - id: tie
    ru: "связать, завязать"
    examples:
      - pl: "Związała go."
        ru: "Она его связала."
        source: { kind: tatoeba, id: 11623700 }
      - pl: "Związała włosy gumką."
        ru: "Она завязала волосы резинкой."
        source: { kind: translated, id: 355302 }
      - pl: "Związała włosy wstążką."
        ru: "Она завязала волосы лентой."
        source: { kind: translated, id: 440611 }
  - id: hands-tied
    ru: "mieć związane ręce — быть связанным по рукам"
    examples:
      - pl: "Mam związane ręce."
        ru: "У меня руки связаны."
        source: { kind: tatoeba, id: 8705115 }
      - pl: "Mamy teraz związane ręce."
        ru: "Теперь у нас связаны руки."
        source: { kind: translated, id: 13655290 }
      - pl: "Ręce Toma były związane za jego plecami."
        ru: "Руки Тома были связаны за спиной."
        source: { kind: translated, id: 3084373 }
  - id: related
    ru: "związany z czymś — связанный с чем-то"
    examples:
      - pl: "Ustalali sprawy związane z piknikiem."
        ru: "Они улаживали дела, связанные с пикником."
        source: { kind: translated, id: 943605 }
      - pl: "Interesy pracowników są ściśle związane z interesami przedsiębiorstwa."
        ru: "Интересы работников тесно связаны с интересами предприятия."
        source: { kind: translated, id: 368972 }
      - pl: "Sam zna się na sprawach związanych z Japonią."
        ru: "Сам разбирается в делах, связанных с Японией."
        source: { kind: translated, id: 773018 }
notes:
  - { kind: government, text: "związać coś «связать что-то» — винительный. А związany z czymś «связанный с чем-то» требует творительного с предлогом z." }
  - { kind: usage, text: "Страдательное причастие związany гораздо частотнее личных форм: sprawy związane z czymś «дела, связанные с чем-то»." }
  - { kind: usage, text: "Оборот mieć związane ręce «быть связанным по рукам» совпадает с русским дословно." }
  - { kind: usage, text: "Związać koniec z końcem — «свести концы с концами», та же картинка, что в русском." }
collocations:
  - { pl: "związać ręce", ru: "связать руки" }
  - { pl: "związany z czymś", ru: "связанный с чем-то" }
  - { pl: "związać koniec z końcem", ru: "свести концы с концами" }
etymology: "Приставка z- и wiązać «вязать», из праславянского *vęzati. Русское «связать» собрано ровно теми же частями."
memory: "związać — «связать». Но в живой речи гораздо чаще встречается причастие związany z czymś «связанный с чем-то», с творительным падежом. И оборот mieć związane ręce «быть связанным по рукам»."
idioms:
  - { pl: "związać ręce", ru: "связать руки" }
  - { pl: "związany z czymś", ru: "связанный с чем-то" }
  - { pl: "związać koniec z końcem", ru: "свести концы с концами" }
