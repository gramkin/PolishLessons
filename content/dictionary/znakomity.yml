etymology: "От старопольского ZNAKOMITY, «заметный, отмеченный знаком», от ZNAK «знак». Русское «знаменитый» собрано по той же модели, от «знамя», «знамение». Польское слово сместилось от «известный» к «превосходный»."
memory: "Znakomity — превосходный, выдающийся, НЕ «знакомый» (znajomy)! Znakomity pomysł, znakomity aktor. Znakomitszy, najznakomitszy; мн. ч. znakomici. Читается «знакоми́ты»."
