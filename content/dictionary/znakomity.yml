  - id: eminent
    ru: "выдающийся, знаменитый (о человеке)"
    examples:
      - pl: "Spotkał znakomitego pisarza."
        ru: "Он встретил выдающегося писателя."
        source: { kind: authored }
      - pl: "Znakomici naukowcy przyjechali na konferencję."
        ru: "На конференцию приехали выдающиеся учёные."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Опасная ловушка: ZNAKOMITY — не «знакомый», а «превосходный, выдающийся». Знакомый по-польски — ZNAJOMY. ZNAKOMITY OBIAD — «превосходный обед», ZNAKOMITY AKTOR — «выдающийся актёр». Русское «знаменитый» ближе по смыслу: и то, и другое — «отмеченный знаком»." }
  - { kind: usage, text: "Полная парадигма: ZNAKOMITY, ZNAKOMITSZY, NAJZNAKOMITSZY. Превосходная степень обычна в превосходных оценках: NAJZNAKOMITSI ARTYŚCI. Мужское-личное множественное: ZNAKOMICI, с чередованием T на C; в степенях — ZNAKOMITSI, NAJZNAKOMITSI." }
  - { kind: government, text: "Ставится перед существительным: ZNAKOMITY POMYSŁ, ZNAKOMITY LEKARZ. Отлично в чём-то — ZNAKOMITY W + местный: ZNAKOMITY W SWOIM FACHU, «превосходный в своём деле»." }
  - { kind: pronunciation, text: "Читается «знакоми́ты», четыре слога, ударение на предпоследнем. TY — твёрдое «ты». В ZNAKOMICI: «знакоми́ци», T перед I становится «ць»." }
  - { kind: register, text: "Нейтральное слово с оттенком похвалы и лёгкой торжественности. В разговоре чаще ŚWIETNY или SUPER. В рецензиях и речах ZNAKOMITY — стандарт: ZNAKOMITA KREACJA, «превосходная роль»." }
collocations:
  - { pl: "znakomity pomysł", ru: "превосходная идея" }
  - { pl: "znakomity aktor", ru: "выдающийся актёр" }
