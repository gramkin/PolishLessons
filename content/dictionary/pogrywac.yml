# review
id: pogrywac
format: 2
lemma: "pogrywać"
rank: 4319
pos: verb
pron: { cyr: "погры́ваць" }
senses:
  - id: play-sometimes
    ru: "поигрывать, играть время от времени"
    examples:
      - pl: "W weekendy pogrywa w tenisa."
        ru: "По выходным он поигрывает в теннис."
        source: { kind: authored }
      - pl: "Czasem pogrywam na gitarze."
        ru: "Иногда я играю на гитаре."
        source: { kind: authored }
      - pl: "Dziadek pogrywał w szachy z sąsiadem."
        ru: "Дедушка поигрывал в шахматы с соседом."
        source: { kind: authored }
  - id: toy-with
    ru: "играть с кем-то, водить за нос (POGRYWAĆ Z KIMŚ)"
    examples:
      - pl: "Nie pogrywaj ze mną!"
        ru: "Не играй со мной!"
        source: { kind: authored }
      - pl: "Ona tylko z nim pogrywa."
        ru: "Она просто с ним играет."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "POGRYWAĆ — «поигрывать», то есть играть время от времени, без серьёзных целей. Второе значение — «играть с кем-то, водить за нос»: NIE POGRYWAJ ZE MNĄ! Это не POGRZEBAĆ «покопаться» и не POGRYŹĆ «погрызть»." }
  - { kind: usage, text: "Несовершенный вид, многократное от GRAĆ. Спряжение на -AM: POGRYWAM, POGRYWASZ, POGRYWAJĄ. Повелительное живёт только в NIE POGRYWAJ ZE MNĄ «не играй со мной»; остальные формы повелительного, безличное POGRYWANO и отглагольное существительное в карточку не включены." }
  - { kind: government, text: "Во что — W с винительным: POGRYWAĆ W KARTY. На чём — NA с предложным: NA PIANINIE. С кем — Z с творительным: POGRYWAĆ Z KIMŚ. Где — W с предложным: W KLUBIE." }
  - { kind: pronunciation, text: "Читается «погры́ваць»: Y — «ы», ударение на предпоследнем слоге. POGRYWAM — «погры́вам»." }
  - { kind: register, text: "Разговорное слово. POGRYWAĆ Z KIMŚ — с оттенком неодобрения: «играть чужими чувствами»." }
collocations:
  - { pl: "pogrywać w tenisa", ru: "поигрывать в теннис" }
  - { pl: "pogrywać na gitarze", ru: "поигрывать на гитаре" }
  - { pl: "pogrywać z kimś", ru: "играть с кем-то, водить за нос" }
family:
  - { pl: "grać", ru: "играть", relation: root, id: grac }
  - { pl: "pograć", ru: "поиграть", relation: root, id: pograc }
  - { pl: "gra", ru: "игра", relation: root, id: gra }
etymology: "Многократное от GRAĆ с приставкой PO-: «поигрывать». Русское «поигрывать» построено так же."
memory: "Pogrywać — поигрывать: pogrywa w tenisa. Pogrywać z kimś — водить за нос: nie pogrywaj ze mną!"
