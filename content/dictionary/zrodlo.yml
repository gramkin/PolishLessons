# review
id: zrodlo
format: 2
lemma: "źródło"
rank: 1235
pos: noun
pron: { cyr: "зьру́дло" }
senses:
  - id: spring
    ru: "источник, родник"
    examples:
      - pl: "To ciepłe źródło dobrze ci zrobi."
        ru: "Этот горячий источник пойдёт тебе на пользу."
        source: { kind: translated, id: 539737 }
      - pl: "Ta rzeka ma źródła w górach Nagano."
        ru: "Эта река берёт начало в горах Нагано."
        source: { kind: translated, id: 822142 }
      - pl: "Aby dojść do źródła, trzeba płynąć pod prąd."
        ru: "Чтобы дойти до источника, нужно плыть против течения."
        source: { kind: translated, id: 980629 }
  - id: cause
    ru: "источник, причина"
    examples:
      - pl: "Pieniądze to źródło wszelkiego zła."
        ru: "Деньги — источник всякого зла."
        source: { kind: translated, id: 592702 }
      - pl: "Światło słoneczne jest głównym źródłem witaminy D."
        ru: "Солнечный свет — это основной источник витамина D."
        source: { kind: tatoeba, id: 4270779 }
      - pl: "To jest dla niego ważne źródło dochodu."
        ru: "Для него это важный источник дохода."
        source: { kind: tatoeba, id: 5201398 }
  - id: information
    ru: "источник (информации)"
    examples:
      - pl: "Reporter odmówił ujawnienia źródeł."
        ru: "Репортёр отказался раскрыть источники."
        source: { kind: translated, id: 365133 }
      - pl: "Dowiedziałem się tego z wiarygodnego źródła."
        ru: "Я узнал это из надёжного источника."
        source: { kind: translated, id: 445426 }
      - pl: "Nie dodawaj zdań ze źródeł objętych prawami autorskimi."
        ru: "Не добавляйте предложения из источников, защищённых авторским правом."
        source: { kind: tatoeba, id: 877682 }
notes:
  - { kind: government, text: "z wiarygodnego źródła «из надёжного источника» — предлог z с родительным. Być źródłem czegoś «быть источником чего-то» требует творительного." }
  - { kind: usage, text: "Gorące źródła «горячие источники» — частая туристическая тема. Źródło dochodu «источник дохода», źródło informacji «источник информации»." }
  - { kind: usage, text: "Во множественном źródła значит ещё и «исходный код» в программировании." }
  - { kind: pronunciation, text: "Начальное ź мягкое, «зь», а ó читается как «у»: зьру́дло." }
collocations:
  - { pl: "źródło informacji", ru: "источник информации" }
  - { pl: "źródło dochodu", ru: "источник дохода" }
  - { pl: "gorące źródła", ru: "горячие источники" }
etymology: "Праславянское *žerdlo «горло, устье» — то же слово, что русское «жерло». Источник назван по тому, как вода выжимается из земли."
memory: "źródło — «источник» во всех смыслах: родник, причина и источник информации. Русский родственник неожиданный — «жерло». Запомните z wiarygodnego źródła «из надёжного источника»."
idioms:
  - { pl: "źródło informacji", ru: "источник информации" }
  - { pl: "gorące źródła", ru: "горячие источники" }
  - { pl: "źródło dochodu", ru: "источник дохода" }
