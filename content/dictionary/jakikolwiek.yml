# review
id: jakikolwiek
format: 2
lemma: "jakikolwiek"
rank: 1402
pos: adj
pron: { cyr: "якико́львек" }
senses:
  - id: any-whatsoever
    ru: "какой-либо, какой бы то ни было, любой"
    examples:
      - pl: "Wykonam jakikolwiek rodzaj pracy."
        ru: "Я выполню любой вид работы."
        source: { kind: translated, id: 4523774 }
      - pl: "Wyszedł bez jakiegokolwiek powodu."
        ru: "Он ушёл без какой-либо причины."
        source: { kind: translated, id: 4886970 }
      - pl: "Może być jakiekolwiek czasopismo."
        ru: "Подойдёт любой журнал."
        source: { kind: translated, id: 348784 }
  - id: any-comparison
    ru: "любой (в сравнениях: «чем любой другой»)"
    examples:
      - pl: "Tokio jest większe niż jakiekolwiek inne miasto w Japonii."
        ru: "Токио больше любого другого города в Японии."
        source: { kind: translated, id: 4768651 }
      - pl: "Myślę, że film jest ciekawszy niż jakakolwiek książka."
        ru: "Я думаю, что фильм интереснее, чем любая книга."
        source: { kind: translated, id: 363620 }
notes:
  - { kind: usage, text: "Сложено из jaki «какой» и частицы -kolwiek «-либо». Склоняется только первая часть: jakiegokolwiek, jakimkolwiek — -kolwiek не меняется никогда." }
  - { kind: usage, text: "Особенно часто после отрицания и после предлога bez: bez jakiegokolwiek powodu «без всякой причины»." }
  - { kind: usage, text: "В сравнениях значит «любой»: większe niż jakiekolwiek inne miasto «больше любого другого города»." }
  - { kind: false-friend, text: "Не путайте jakikolwiek «какой-либо, безразлично какой» с jakiś «какой-то». jakiś указывает на конкретный, но неназванный предмет, jakikolwiek — на любой без разбора." }
collocations:
  - { pl: "bez jakiegokolwiek powodu", ru: "без всякой причины" }
  - { pl: "w jakikolwiek sposób", ru: "каким-либо образом" }
  - { pl: "jakiekolwiek pytania", ru: "какие-либо вопросы" }
etymology: "Сложение jaki «какой» и старой частицы -kolwiek со значением «-либо, угодно». Русское «какой-либо» собрано ровно тем же способом, из вопросительного слова и частицы."
memory: "jakikolwiek — «какой-либо, любой». Склоняется только первая половина: jakiegokolwiek, jakimkolwiek, а -kolwiek остаётся неизменной всегда. Чаще всего встречается после bez и после отрицания: bez jakiegokolwiek powodu «без всякой причины»."
idioms:
  - { pl: "bez jakiegokolwiek powodu", ru: "без всякой причины" }
  - { pl: "w jakikolwiek sposób", ru: "каким-либо образом" }
  - { pl: "jakikolwiek by nie był", ru: "каким бы он ни был" }
