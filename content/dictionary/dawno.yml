# review
id: dawno
format: 2
lemma: "dawno"
rank: 1926
pos: adv
pron: { cyr: "да́вно" }
senses:
  - id: long-ago
    ru: "давно (в далёком прошлом)"
    examples:
      - pl: "To było dawno temu."
        ru: "Это было давно."
        source: { kind: translated, id: 4719433 }
      - pl: "Tom zmarł dawno temu."
        ru: "Том умер давно."
        source: { kind: translated, id: 3695170 }
      - pl: "Dawno temu był milionerem."
        ru: "Давно он был миллионером."
        source: { kind: translated, id: 3781485 }
  - id: not-for-long
    ru: "давно (уже долгое время не)"
    examples:
      - pl: "Dawno nie jadłem mięsa."
        ru: "Я давно не ел мяса."
        source: { kind: tatoeba, id: 8213738 }
      - pl: "Dawno cię nie widziałem."
        ru: "Я давно тебя не видел."
        source: { kind: translated, id: 1643943 }
      - pl: "Dawno się nie widzieliśmy."
        ru: "Мы давно не виделись."
        source: { kind: translated, id: 1896240 }
  - id: formerly
    ru: "dawniej — раньше, прежде"
    examples:
      - pl: "Dawniej tu kursowały tramwaje."
        ru: "Раньше здесь ходили трамваи."
        source: { kind: tatoeba, id: 10138151 }
      - pl: "Dawniej sądzono, że Ziemia jest płaska."
        ru: "Раньше считали, что Земля плоская."
        source: { kind: translated, id: 713429 }
      - pl: "Jak dawniej nazywało się to miasto?"
        ru: "Как раньше назывался этот город?"
        source: { kind: tatoeba, id: 12624952 }
notes:
  - { kind: usage, text: "Сравнительная степень dawniej значит «раньше, прежде»: Dawniej tu kursowały tramwaje «Раньше здесь ходили трамваи»." }
  - { kind: usage, text: "Сказочный зачин — dawno, dawno temu «давным-давно», точно как в русском." }
  - { kind: usage, text: "Конструкция dawno temu «давно» обязательно требует temu: To było dawno temu, а не просто dawno." }
collocations:
  - { pl: "dawno temu", ru: "давным-давно" }
  - { pl: "dawno nie widzieliśmy się", ru: "давно не виделись" }
  - { pl: "jak dawniej", ru: "как раньше" }
etymology: "От dawny «давний», праславянское *davьnъ. Русское «давно» — то же самое слово и тот же корень."
memory: "dawno — «давно». Помните две связки: dawno temu «давным-давно» и сравнительную dawniej «раньше, прежде»."
idioms:
  - { pl: "dawno temu", ru: "давным-давно" }
  - { pl: "dawno, dawno temu", ru: "давным-давно (зачин сказки)" }
  - { pl: "jak dawniej", ru: "как раньше" }
formExamplesSkip:
  - { form: "najdawniej", reason: "превосходная степень; в корпусе примеров нет" }
