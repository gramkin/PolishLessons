        ru: "Он использовал любую возможность, чтобы практиковать английский."
        source: { kind: translated, id: 361816 }
  - id: exercise-noun
    ru: "ćwiczenie — упражнение"
    examples:
      - pl: "Ćwiczenie czyni mistrza."
        ru: "Упражнение делает мастера."
        source: { kind: translated, id: 13453506 }
      - pl: "Bieganie to dobre ćwiczenie."
        ru: "Бег — хорошее упражнение."
        source: { kind: translated, id: 392989 }
      - pl: "Ćwiczenia wzmacniają twoje ciało."
        ru: "Упражнения укрепляют твоё тело."
        source: { kind: translated, id: 3759765 }
notes:
  - { kind: usage, text: "Глагол покрывает и спорт, и отработку навыка: ćwiczę na siłowni «занимаюсь в спортзале», ćwiczy grę na skrzypcach «отрабатывает игру на скрипке»." }
  - { kind: usage, text: "Отглагольное существительное ćwiczenie значит «упражнение»: robić ćwiczenia «делать упражнения»." }
  - { kind: usage, text: "Поговорка Ćwiczenie czyni mistrza — точный двойник русского «Повторение — мать учения» по смыслу, хотя буквально «упражнение делает мастера»." }
  - { kind: usage, text: "Рядом с карточкой uczyć się: uczyć się — учиться чему-то новому, ćwiczyć — отрабатывать уже известное." }
  - { kind: usage, text: "Отглагольное существительное ćwiczenie зажило своей жизнью и значит «упражнение»: zrobić ćwiczenie, ćwiczenia z gramatyki." }
collocations:
  - { pl: "ćwiczyć na siłowni", ru: "заниматься в спортзале" }
  - { pl: "robić ćwiczenia", ru: "делать упражнения" }
  - { pl: "ćwiczenie czyni mistrza", ru: "упражнение делает мастера" }
etymology: "От ćwik «опытный человек», из средневерхненемецкого zwicken «щипать, muштровать». Русское «упражняться» — другой корень, так что здесь родство не помогает."
memory: "ćwiczyć — и «заниматься спортом», и «отрабатывать навык»: ćwiczę na siłowni, ćwiczy grę na skrzypcach. А ćwiczenie — «упражнение»."
