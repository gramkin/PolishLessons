# review
id: tymczasem
format: 2
lemma: "tymczasem"
rank: 3503
pos: adv
pron: { cyr: "тымча́сэм" }
senses:
  - id: meanwhile
    ru: "тем временем, пока"
    examples:
      - pl: "Tymczasem w kuchni zagotowała się woda."
        ru: "Тем временем на кухне закипела вода."
        source: { kind: authored }
      - pl: "Ty odpocznij, a ja tymczasem zrobię herbatę."
        ru: "Ты отдохни, а я пока сделаю чай."
        source: { kind: authored }
      - pl: "Tymczasem minęła północ."
        ru: "Тем временем наступила полночь."
        source: { kind: authored }
  - id: whereas
    ru: "а между тем, однако"
    examples:
      - pl: "Mówił, że jest chory, a tymczasem poszedł na mecz."
        ru: "Он говорил, что болен, а между тем пошёл на матч."
        source: { kind: authored }
      - pl: "Wszyscy myśleli, że przegra, tymczasem wygrał."
        ru: "Все думали, что он проиграет, а он выиграл."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "TYMCZASEM — «тем временем», а не «временно». «Временно» — TYMCZASOWO, «временный» — TYMCZASOWY. Буквально TYM CZASEM — творительный «тем временем», где CZAS значит «время»." }
  - { kind: usage, text: "Наречие, одна форма, два значения. Первое — одновременность: «тем временем, пока». Второе — противопоставление: A TYMCZASEM, «а между тем», когда действительность расходится с ожиданием." }
  - { kind: government, text: "Наречие ничем не управляет. Обычно стоит в начале предложения или после союза A: A TYMCZASEM. Запятая перед ним нужна, когда оно соединяет две части: WSZYSCY CZEKALI, TYMCZASEM ON PRZYJECHAŁ." }
  - { kind: pronunciation, text: "Читается «тымча́сэм», ударение на предпоследнем слоге. Y — «ы», CZ — «ч», SE — твёрдое «сэ»." }
collocations:
  - { pl: "a tymczasem", ru: "а между тем" }
  - { pl: "tymczasem w domu", ru: "тем временем дома" }
  - { pl: "a ja tymczasem", ru: "а я пока" }
family:
  - { pl: "czas", ru: "время", relation: root, id: czas }
  - { pl: "tymczasowy", ru: "временный", relation: root, id: tymczasowy }
  - { pl: "tymczasowo", ru: "временно", relation: root }
etymology: "Застывший творительный падеж TYM CZASEM, «тем временем». CZAS — «время», родня русскому «час»: значение у польского слова шире."
memory: "Tymczasem — тем временем, а между тем; tymczasowo — временно. Читается «тымча́сэм». A ja tymczasem zrobię herbatę — а я пока сделаю чай."
idioms:
  - { pl: "póki czas", ru: "пока не поздно" }
formExamples:
  - form: "tymczasem"
    pl: "Tymczasem zaczęło padać."
    ru: "Тем временем пошёл дождь."
    source: { kind: authored }
  - form: "tymczasem"
    pl: "Ja gotowałem, a tymczasem dzieci sprzątały."
    ru: "Я готовил, а дети тем временем убирали."
    source: { kind: authored }
  - form: "tymczasem"
    pl: "Wszyscy czekali na autobus, tymczasem on przyjechał taksówką."
    ru: "Все ждали автобуса, а он приехал на такси."
    source: { kind: authored }
