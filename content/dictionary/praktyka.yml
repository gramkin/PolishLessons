etymology: "Из греческого PRAKTIKE, от PRASSEIN «делать, совершать» — того же корня, что PRAGMATYCZNY «прагматичный» и PRAKSEOLOGIA. Через латинское PRACTICA слово разошлось по европейским языкам, и русский взял его тем же путём, поэтому значения совпадают почти целиком. Исходное греческое значение было именно «деятельная сторона» в противоположность умозрительной, и противопоставление PRAKTYKA — TEORIA сохранило эту пару в точности, потому что TEORIA тоже греческая, от THEOREIN «созерцать, рассматривать». Так что два слова этой пары противопоставлены уже в греческом: делание против созерцания. Чередование K в C перед -E это славянское правило, приложенное к заимствованию, и то же самое происходит в GALAKTYCE."
memory: "Как русская «практика», читать Y как «ы». Дательный и местный — praktyce, k→c, и главный оборот стоит именно так: w praktyce «на практике». Стажировка обычно во множественном: iść na praktyki — по-русски «пойти на практику», в единственном. Praktyki religijne — это обряды, а не опыт. Пара praktyka — teoria противопоставлена уже в греческом: делание против созерцания."
