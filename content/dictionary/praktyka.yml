notes:
  - { kind: government, text: "Женский род на -KA, с тем же чередованием K в C, что у GALAKTYKA: дательный и местный единственного дают PRAKTYCE. Главный оборот языка стоит именно в этой форме — W PRAKTYCE «на практике», и он частотнее всех остальных. Винительный на -Ę: ODBYĆ PRAKTYKĘ. Родительный множественного PRAKTYK, без окончания. В значении стажировки слово обычно употребляется во множественном: PRAKTYKI STUDENCKIE, IŚĆ NA PRAKTYKI, и русский в этом случае говорит в единственном — «пойти на практику». Где проходят — предлог W с местным: PRAKTYKA W SZPITALU." }
  - { kind: false-friend, text: "Значения совпадают с русской «практикой» почти полностью: и опыт, и применение, и стажировка. Расхождение в числе и в одном обороте. Стажировка по-польски чаще во множественном, PRAKTYKI, тогда как русский говорит «практика» в единственном: IŚĆ NA PRAKTYKI это «пойти на практику». И второе: PRAKTYKI RELIGIJNE означает религиозные обряды, соблюдение религии, а не «религиозную практику» в смысле опыта — русский здесь скажет «religiozne обряды» или «исполнение обрядов». Врачебная практика совпадает: PRAKTYKA LEKARSKA, PRYWATNA PRAKTYKA." }
  - { kind: pronunciation, text: "Читается «практы́ка», ударение на предпоследнем слоге из трёх. Гласная Y звучит «ы», и в этом отличие от русского слова с его «и». Сочетание KT произносится раздельно, без выпадения. В дательном и местном PRAKTYCE буква K переходит в C и читается «ц»: «практы́це». В родительном множественного PRAKTYK два слога: «пра́ктык». Начальное PR без призвука, как в русском." }
  - { kind: usage, text: "Частотные сочетания: W PRAKTYCE «на практике», W PRAKTYCE OZNACZA TO, ŻE NIKT TEGO NIE SPRAWDZA — оборот канцелярский и очень частый; PRAKTYKA LEKARSKA, PRYWATNA PRAKTYKA, ODBYĆ PRAKTYKĘ, PRAKTYKI STUDENCKIE, PRAKTYKA CZYNI MISTRZA «практика делает мастером», отвечающее русскому «повторение — мать учения». Прилагательное PRAKTYCZNY значит «практичный» и «практический», оба смысла, как в русском. Наречие PRAKTYCZNIE значит и «практически», и «фактически»: PRAKTYCZNIE NIKT NIE PRZYSZEDŁ «практически никто не пришёл»." }
