notes:
  - { kind: usage, text: "Слово длинное, но разбирается на знакомые части: CZĘSTO «часто» плюс суффиксы, и в итоге буквально «частотность». Шесть форм, обычный разряд женских существительных на -OŚĆ, где суффикс отвечает русскому -ОСТЬ. Множественное число совершенно обычно, потому что частот бывает много: CZĘSTOTLIWOŚCI RADIOWE «радиочастоты». Рядом живёт более короткое CZĘSTOŚĆ, и разделение между ними есть: CZĘSTOTLIWOŚĆ употребляют в физике и технике, а CZĘSTOŚĆ в статистике и медицине, о частоте случаев." }
  - { kind: false-friend, text: "Прилагательное, лежащее в основе, русскому знакомо: CZĘSTY это «частый», и носовая Ę отвечает здесь русскому «я», как в MIĘSO и «мясо». А вот наречие CZĘSTO «часто» прячет ловушку в сравнительной степени: CZĘŚCIEJ значит «чаще», и его легко спутать с CZĘŚCIĄ, творительным падежом от CZĘŚĆ «часть». Два слова, CZĘSTY «частый» и CZĘŚĆ «часть», в польском исторически родственны, и именно поэтому так похожи." }
  - { kind: government, text: "На какой частоте — предлог NA с предложным: NA TEJ CZĘSTOTLIWOŚCI, и русский строит так же. Частота чего — родительный без предлога: CZĘSTOTLIWOŚĆ KONTROLI «частота проверок». В чём измеряется — предлог W с местным падежом: MIERZY SIĘ W HERCACH. Прилагательное CZĘSTOTLIWOŚCIOWY существует, но громоздко, и вместо него обычно говорят описательно: ZAKRES CZĘSTOTLIWOŚCI «диапазон частот»." }
  - { kind: pronunciation, text: "Читается «ченстотли́восьчь», пять слогов, ударение на предпоследнем. Сочетание CZ даёт твёрдое «ч», а носовая Ę перед S звучит как «эн», поэтому начало слова «ченс». Дальше всё читается по буквам: «тотли», и конец -ŚĆ это два мягких звука подряд, «сьчь». В наречии CZĘSTO слышно «че́нсто», и начало там то же самое." }
  - { kind: register, text: "Слово техническое и статистическое, в быту редкое. Частые обороты: CZĘSTOTLIWOŚĆ RADIOWA «радиочастота», ZAKRES CZĘSTOTLIWOŚCI «диапазон частот», NA TEJ CZĘSTOTLIWOŚCI «на этой частоте», CZĘSTOTLIWOŚĆ ODŚWIEŻANIA «частота обновления» о мониторе. В разговоре о том, как часто что-то бывает, поляк предпочтёт наречие: JAK CZĘSTO TO SIĘ ZDARZA значит «как часто это бывает», и существительное тут не нужно." }
