etymology: "От наречия CZĘSTO «часто» и прилагательного CZĘSTY «частый», от праславянского *čęstъ, то есть от того же слова, что русское «частый». Носовая Ę отвечает здесь русскому «я», и соответствие это регулярно: CZĘSTY и «частый», MIĘSO и «мясо», PIĘĆ и «пять». Длинная середина слова, -OTLIW-, — это двойной суффикс, какого в русском соответствии нет: русский обошёлся коротким «частота», а польский построил громоздкое CZĘSTOTLIWOŚĆ, оставив краткое CZĘSTOŚĆ для другой области. Исторически тот же корень связан с CZĘŚĆ «часть»."
memory: "Разобрать на части проще, чем запомнить целиком: często «часто» плюс суффиксы, буквально «частотность». Корень знаком, czesty это «частый», и ę отвечает русскому я, как в mięso и «мясо». Два слова делят работу: częstotliwość в физике и технике, częstość в статистике и медицине. Читается «ченстотли́восьчь», пять слогов, ę перед s даёт «эн». Управление как в русском: na tej częstotliwości с предложным."
