# review
id: zegnac
format: 2
lemma: "żegnać"
rank: 1332
pos: verb
aspect: imperf
pron: { cyr: "же́гнаць" }
senses:
  - id: farewell
    ru: "żegnaj! — прощай!"
    examples:
      - pl: "Żegnaj!"
        ru: "Прощай!"
        source: { kind: translated, id: 6308800 }
      - pl: "Żegnaj, Kuba."
        ru: "Прощай, Куба."
        source: { kind: tatoeba, id: 5336743 }
      - pl: "Żegnaj na zawsze."
        ru: "Прощай навсегда."
        source: { kind: translated, id: 528564 }
  - id: without-goodbye
    ru: "nie żegnając się — не прощаясь"
    examples:
      - pl: "Wyszedł nie żegnając się ze mną."
        ru: "Он ушёл, не попрощавшись со мной."
        source: { kind: translated, id: 369083 }
      - pl: "Wyszedł z domu nie żegnając się nawet."
        ru: "Он вышел из дома, даже не попрощавшись."
        source: { kind: translated, id: 3176984 }
      - pl: "Wyszła nie żegnając się nawet z przyjaciółmi."
        ru: "Она ушла, даже не попрощавшись с друзьями."
        source: { kind: translated, id: 361892 }
  - id: plural
    ru: "żegnajcie! — прощайте!"
    examples:
      - pl: "Żegnajcie!"
        ru: "Прощайте!"
        source: { kind: translated, id: 1349107 }
      - pl: "Żegnajcie i dziękuję za wszystko."
        ru: "Прощайте, и спасибо вам за всё."
        source: { kind: tatoeba, id: 13784383 }
      - pl: "Powiedział: \"Żegnajcie, moi przyjaciele\" i odszedł."
        ru: "Он сказал: «Прощайте, друзья мои» — и ушёл."
        source: { kind: translated, id: 524560 }
notes:
  - { kind: usage, text: "Żegnaj! — «Прощай!», окончательное прощание. Обычное «до свидания» — do widzenia, а «пока» — cześć или na razie." }
  - { kind: government, text: "Возвратное żegnać się z kimś «прощаться с кем-то» требует предлога z и творительного падежа." }
  - { kind: usage, text: "Третье значение — «креститься»: żegnać się значит ещё и «осенять себя крестным знамением»." }
  - { kind: usage, text: "Вид несовершенный; совершенный — pożegnać. Существительное — pożegnanie «прощание»." }
collocations:
  - { pl: "żegnaj", ru: "прощай" }
  - { pl: "żegnać się z kimś", ru: "прощаться с кем-то" }
  - { pl: "nie żegnając się", ru: "не прощаясь" }
etymology: "Из праславянского *žegnati, а оно из латинского signare «осенять знаком» через немецкий segnen «благословлять». Отсюда и второе значение «креститься»."
memory: "żegnać — «прощаться». Żegnaj! значит «Прощай!» окончательно, а обычное «до свидания» — do widzenia. Возвратное żegnać się z kimś требует z с творительным. Совершенный вид — pożegnać."
idioms:
  - { pl: "żegnaj", ru: "прощай" }
  - { pl: "żegnajcie", ru: "прощайте" }
  - { pl: "nie żegnając się", ru: "не прощаясь" }
