# review
id: podac
format: 2
lemma: "podać"
rank: 486
pos: verb
aspect: perf
pron: { cyr: "по́даць" }
senses:
  - id: hand
    ru: "подать, передать"
    examples:
      - pl: "Podaj mi gwoździe."
        ru: "Подай мне гвозди."
        source: { kind: tatoeba, id: 4264319 }
      - pl: "Podasz mi sól?"
        ru: "Передашь мне соль?"
        source: { kind: tatoeba, id: 357622 }
      - pl: "Podajcie mi mój miecz."
        ru: "Подайте мне мой меч."
        source: { kind: tatoeba, id: 6302003 }
  - id: state
    ru: "сообщить, привести (данные, пример)"
    examples:
      - pl: "Podam wam jeszcze jeden przykład."
        ru: "Я приведу вам ещё один пример."
        source: { kind: tatoeba, id: 8658860 }
      - pl: "Powiedział, że później poda wynik egzaminu."
        ru: "Он сказал, что позже сообщит результат экзамена."
        source: { kind: translated, id: 361717 }
      - pl: "Mógłby mi pan podać pański adres?"
        ru: "Не могли бы вы сказать мне ваш адрес?"
        source: { kind: tatoeba, id: 839175 }
notes:
  - { kind: false-friend, text: "Существительное podanie значит не «подача», а «заявление»: Złożyła podanie o wizę «Она подала заявление на визу»." }
  - { kind: usage, text: "podać rękę — «подать руку, поздороваться»: Odmówił podania ręki «Он отказался подать руку»." }
  - { kind: usage, text: "О еде: Kawa będzie podana po posiłku «Кофе подадут после еды»; podać do stołu — «подать на стол»." }
  - { kind: usage, text: "Несовершенный вид — podawać. Второе значение — «сообщить, назвать»: podać adres «назвать адрес»." }
collocations:
  - { pl: "podać rękę", ru: "подать руку" }
  - { pl: "złożyć podanie", ru: "подать заявление" }
  - { pl: "podać do stołu", ru: "подать на стол" }
  - { pl: "podaj mi", ru: "подай мне" }
etymology: "Из po- + dać; русское «подать» собрано ровно из тех же двух частей."
memory: "podać — «подать, передать», слово буква в букву русское. Но существительное podanie значит «заявление», а не «подача»: złożyć podanie o wizę «подать заявление на визу»."
idioms:
  - { pl: "podać rękę", ru: "подать руку" }
  - { pl: "złożyć podanie", ru: "подать заявление" }
  - { pl: "podać do stołu", ru: "подать на стол" }
