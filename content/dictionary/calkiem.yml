# review
id: calkiem
format: 2
lemma: "całkiem"
rank: 498
pos: adv
pron: { cyr: "ца́укем" }
senses:
  - id: quite
    ru: "довольно, весьма (смягчает)"
    examples:
      - pl: "Myślę, że mam całkiem niezły pomysł."
        ru: "Кажется, у меня довольно неплохая идея."
        source: { kind: translated, id: 3430551 }
      - pl: "Obcokrajowcy całkiem dobrze mówią po japońsku."
        ru: "Иностранцы довольно хорошо говорят по-японски."
        source: { kind: translated, id: 1273569 }
      - pl: "Całkiem możliwe."
        ru: "Вполне возможно."
        source: { kind: translated, id: 5508378 }
  - id: completely
    ru: "совсем, полностью (усиливает)"
    examples:
      - pl: "Cóż, to nie całkiem tak."
        ru: "Хм, это не совсем так."
        source: { kind: translated, id: 6313104 }
      - pl: "Zapomniałem o tym całkiem."
        ru: "Я совсем об этом забыл."
        source: { kind: authored }
      - pl: "To całkiem inna sprawa."
        ru: "Это совсем другое дело."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "У слова два значения, тянущих в разные стороны: усилительное «совсем, полностью» (całkiem zapomniałem «совсем забыл») и смягчающее «довольно, весьма» (całkiem niezły «довольно неплохой»). Различает только контекст." }
  - { kind: usage, text: "nie całkiem — «не совсем»: To nie całkiem tak «Это не совсем так»." }
  - { kind: usage, text: "В смягчающем значении całkiem можно заменить на dość: całkiem dobrze = dość dobrze «довольно хорошо»." }
  - { kind: usage, text: "Разговорный оборот całkiem, całkiem — одобрительное «очень даже ничего»." }
collocations:
  - { pl: "całkiem możliwe", ru: "вполне возможно" }
  - { pl: "całkiem niezły", ru: "довольно неплохой" }
  - { pl: "nie całkiem", ru: "не совсем" }
  - { pl: "całkiem inny", ru: "совсем другой" }
etymology: "От cały «целый» с наречным суффиксом -kiem. Русское «целиком» построено по той же модели от того же корня."
memory: "całkiem растёт из cały «целый», как русское «целиком». Но значений два, и они тянут в разные стороны: całkiem zapomniałem «совсем забыл» — усиление, а całkiem niezły «довольно неплохой» — смягчение. Различает только контекст. И запомните nie całkiem «не совсем»."
idioms:
  - { pl: "całkiem możliwe", ru: "вполне возможно" }
  - { pl: "nie całkiem", ru: "не совсем" }
  - { pl: "całkiem, całkiem", ru: "очень даже ничего" }
