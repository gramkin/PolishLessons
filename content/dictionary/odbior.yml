# review
id: odbior
format: 2
lemma: "odbiór"
rank: 1867
pos: noun
pron: { cyr: "о́дбюр" }
senses:
  - id: pickup
    ru: "получение, приём (вещи, заказа)"
    examples:
      - pl: "Proszę potwierdzić odbiór!"
        ru: "Пожалуйста, подтвердите получение!"
        source: { kind: translated, id: 8778930 }
      - pl: "Czy możliwy jest odbiór osobisty?"
        ru: "Возможен ли самовывоз?"
        source: { kind: translated, id: 3799097 }
      - pl: "Możliwy jest odbiór osobisty zakupionych książek w jednym z naszych sklepów."
        ru: "Возможен самовывоз купленных книг в одном из наших магазинов."
        source: { kind: translated, id: 3799099 }
  - id: baggage-claim
    ru: "выдача, приём (багажа); восприятие"
    examples:
      - pl: "Będę czekał przy odbiorze bagażu."
        ru: "Я буду ждать у выдачи багажа."
        source: { kind: translated, id: 363037 }
      - pl: "Odbiór osobisty byłby dla mnie najwygodniejszą opcją."
        ru: "Личный самовывоз был бы для меня самым удобным вариантом."
        source: { kind: translated, id: 3799098 }
notes:
  - { kind: usage, text: "odbiór osobisty — «самовывоз», стандартная опция в интернет-магазинах." }
  - { kind: usage, text: "potwierdzić odbiór — «подтвердить получение», формула в переписке и на почте." }
  - { kind: government, text: "При получении — przy odbiorze (предложный падеж): płatność przy odbiorze «оплата при получении»." }
  - { kind: usage, text: "Слово значит и качество радио- или телесигнала: dobry odbiór «хороший приём»." }
