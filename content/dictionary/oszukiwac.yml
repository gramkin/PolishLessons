  - { pl: "oszust", ru: "мошенник", relation: derived }
  - { pl: "oszustwo", ru: "мошенничество, обман", relation: derived }
etymology: "Приставка o- плюс szukać «искать»: исходно «обойти кругом, подловить в поисках». Русский этим путём не пошёл — там «обманывать» от «манить», — а сам глагол szukać уцелел в русском лишь диалектным «шукать». От польского гнезда: oszukać, oszust «мошенник», oszustwo «мошенничество», oszukańczy «обманный»."
memory: "oszukiwać — «обманывать», и опереться на русский тут не на что: слово выросло из szukać «искать». Зато грамматика уже знакома по przyznawać — инфинитив на -ywa-, настоящее на -uj-: oszukuję. И запомните разговорное nie oszukujmy się, «не будем себя обманывать»."
idioms:
  - { pl: "oszukiwać samego siebie", ru: "обманывать самого себя" }
  - { pl: "nie oszukujmy się", ru: "не будем себя обманывать" }
