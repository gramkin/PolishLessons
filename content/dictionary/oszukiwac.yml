notes:
  - { kind: false-friend, text: "ПРОЗРАЧНОГО РУССКОГО РОДСТВЕННИКА НЕТ, И ЛУЧШЕ ЗНАТЬ ЭТО СРАЗУ. Русское «обманывать» идёт от «манить», а польское oszukiwać построено на szukać «искать»: o- плюс szukać, то есть буквально «обойти, подловить». Само szukać русскому знакомо разве что по диалектному «шукать» и украинскому «шукати». Опереться здесь не на что, слово надо выучить вместе с гнездом: oszust «мошенник», oszustwo «мошенничество»." }
  - { kind: usage, text: "ТА ЖЕ ДВОЙНАЯ ОСНОВА, ЧТО У PRZYZNAWAĆ. Инфинитив и прошедшее идут на -ywa-: oszukiwać, oszukiwał. Настоящее переходит на -uj-: oszukuję, oszukujesz, oszukuje. Причастия делятся по тому же шву: действительное и деепричастие от настоящей основы (oszukujący, oszukując), страдательное и отглагольное существительное от инфинитивной (oszukiwany, oszukiwanie). Вид несовершенный, пара — oszukać." }
  - { kind: government, text: "Обманывают КОГО — винительный падеж: oszukiwać klienta, wspólnika, samego siebie. В чём именно — na с предложным: oszukiwać na wadze, na cenie, na metrażu. Возвратное oszukiwać się значит «обманывать себя», и оборот nie oszukujmy się «не будем себя обманывать» в разговоре встречается постоянно." }
  - { kind: pronunciation, text: "sz читается как ш: «ошуки́ваць». Ударение, как всегда, на предпоследнем слоге, и при переходе к настоящему времени оно там и остаётся, хотя основа меняется целиком: oszukuję — «ошуку́йэ»." }
collocations:
  - { pl: "oszukiwać klientów", ru: "обманывать клиентов" }
  - { pl: "oszukiwać na wadze", ru: "обманывать на весе" }
