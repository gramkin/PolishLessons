notes:
  - { kind: false-friend, text: "Два языка назвали одну службу по разным признакам. Русский назвал её по быстроте: «скорая помощь», и в быту осталось одно прилагательное — «скорая». Польский назвал её по готовности: POGOTOWIE образовано от GOTOWY «готовый» и буквально значит «состояние готовности», а полное название — POGOTOWIE RATUNKOWE «спасательная готовность». Поэтому WEZWAĆ POGOTOWIE это «вызвать скорую», и ничего общего со скоростью в слове нет. Отдельно предупреждение для русского глаза: POGOTOWIE не имеет отношения к POGODA «погода», хотя начало слов совпадает. Исходный смысл готовности жив в обороте BYĆ W POGOTOWIU «быть наготове»." }
  - { kind: government, text: "Средний род. «Вызвать скорую» — винительный: WEZWAĆ POGOTOWIE, ZADZWONIĆ PO POGOTOWIE с предлогом PO. «Машина скорой» — родительный: KARETKA POGOTOWIA. «В скорой» о работе — местный: PRACOWAĆ W POGOTOWIU. Полное название POGOTOWIE RATUNKOWE, и прилагательное согласуется по среднему роду. Рядом существуют POGOTOWIE GAZOWE «газовая аварийная служба», POGOTOWIE WODOCIĄGOWE, POGOTOWIE ENERGETYCZNE — то есть слово стало общим названием для всякой круглосуточной аварийной службы, чего русская «скорая» не умеет." }
  - { kind: usage, text: "Среднее существительное на -IE, и склонение у этого типа короче обычного: восемь форм вместо десяти. Родительный, дательный и местный единственного — POGOTOWIA, POGOTOWIU, POGOTOWIU, причём дательный и местный совпадают. Родительный множественного — POGOTOWI, где конечное -IE усекается до -I; это общее свойство средних на -IE, как ZDJĘCIE даёт ZDJĘĆ, а ZEBRANIE даёт ZEBRAŃ. Множественное число у слова есть и употребляется, когда речь о нескольких службах или станциях, но в бытовой речи встречается редко." }
  - { kind: pronunciation, text: "Читается «погото́ве», четыре слога, ударение на предпоследнем. Все три O произносятся полно, как «о», без редукции — в русском первые два стали бы «а», и именно это выдаёт акцент сильнее всего. Сочетание WIE на конце даёт мягкое «ве». В местном падеже POGOTOWIU слышно «погото́ву» с мягким в: «погото́вю». В родительном множественного POGOTOWI слогов остаётся четыре, ударение на предпоследнем: «погото́ви»." }
