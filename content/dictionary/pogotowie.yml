etymology: "От GOTOWY «готовый», из праславянского *gotovъ, того же корня, что русское «готовый», «готовить». Приставка PO- и суффикс -IE дают отвлечённое имя состояния: POGOTOWIE — «состояние готовности», и в этом смысле слово употреблялось задолго до того, как появились санитарные кареты. Когда в девятнадцатом веке службы скорой помощи начали создавать, польский взял готовое слово и прибавил уточнение: POGOTOWIE RATUNKOWE, «спасательная готовность». Русский в тот же момент выбрал другой признак и назвал службу по быстроте — «скорая помощь». Оба названия потом сократились до одного слова, но до разных: польский оставил существительное POGOTOWIE, русский — прилагательное «скорая». Польское слово оказалось удачнее по охвату: от него пошли POGOTOWIE GAZOWE и POGOTOWIE ENERGETYCZNE, тогда как «скорая» к газу не прикладывается."
memory: "Русский назвал службу по быстроте — «скорая», польский по готовности: pogotowie от gotowy, буквально «состояние готовности», полностью pogotowie ratunkowe. Wezwać pogotowie — «вызвать скорую». Не путать с pogoda «погода». Исходный смысл жив в być w pogotowiu «быть наготове». Слово годится для любой аварийной службы: pogotowie gazowe. Среднее на -ie, восемь форм; родительный множественного усекает -ie до -i: pogotowi."
