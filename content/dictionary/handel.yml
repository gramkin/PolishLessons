  - id: trafficking
    ru: "торговля (незаконная)"
    examples:
      - pl: "Handel ludźmi jest zbrodnią."
        ru: "Торговля людьми — преступление."
        source: { kind: authored }
      - pl: "Za handel bronią grozi więzienie."
        ru: "За торговлю оружием грозит тюрьма."
        source: { kind: authored }
notes:
  - { kind: pronunciation, text: "Гласная e беглая, и держится только в именительном: HANDEL, но HANDLU, handlem, handle. Родительный множественного — HANDLI, с окончанием -i, а не -ów, потому что основа кончается мягко: так же устроен pierścień — pierścieni. Слово, стало быть, теряет гласную и берёт мягкое окончание сразу." }
  - { kind: usage, text: "Это немецкое заимствование, Handel, которое польский взял, а русский нет: у нас для того же понятия своё слово, «торговля», от «торга». Поэтому угадать польское слово не удастся, зато вся семья от него строится правильно и предсказуемо: HANDLOWAĆ «торговать», HANDLOWY «торговый», HANDLARZ «торговец», HANDEL LUDŹMI «торговля людьми»." }
collocations:
  - { pl: "handel zagraniczny", ru: "внешняя торговля" }
  - { pl: "wolny handel", ru: "свободная торговля" }
  - { pl: "handel ludźmi", ru: "торговля людьми" }
family:
  - { pl: "handlować", ru: "торговать", relation: root }
  - { pl: "handlowy", ru: "торговый", relation: derived }
  - { pl: "handlarz", ru: "торговец", relation: derived }
etymology: "Из средневерхненемецкого handel «дело, торговля», от handeln «действовать, вести дела» и в конечном счёте от Hand «рука». Польский взял слово вместе с ганзейской торговлей, а русский обошёлся своим «торгом» и «торговлей». Корень руки виден и в немецком, и в самом понятии: торговля как то, что делается руками."
memory: "Беглая e: handel, но do handlu. А родительный множественного мягкий: HANDLI, не «handlów»."
idioms:
  - { pl: "handel ludźmi", ru: "торговля людьми" }
  - { pl: "wolny handel", ru: "свободная торговля" }
formExamplesSkip:
