notes:
  - { kind: false-friend, text: "Русский «выпад» это удар, нападки или движение в фехтовании. Польское WYPAD в живой речи значит совсем другое: короткую поездку, вылазку за город, выход куда-нибудь. WYPAD ZA MIASTO это «поехать за город на день». Военное значение у слова тоже есть, но оно второе и книжное. А гнездо рядом полно ловушек: WYPADEK значит «случай» и «ДТП», PRZYPADEK — «случай» и «падеж», а WYPADAĆ — и «выпадать», и «приходиться»." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. В местном падеже D переходит в DZI: WYPAD, но NA WYPADZIE. Множественное WYPADY употребляется едва ли не чаще единственного, потому что вылазки обычно повторяются: WEEKENDOWE WYPADY. Беглых гласных в основе нет, она не меняется." }
  - { kind: government, text: "Вылазка за город — WYPAD ZA MIASTO, предлог ZA с винительным, потому что есть движение. На вылазке — NA WYPADZIE, местный падеж. Поехать на вылазку — POJECHAĆ NA WYPAD, предлог NA с винительным. А «вылазка в горы» — WYPAD W GÓRY, предлог W с винительным множественного." }
  - { kind: pronunciation, text: "Читается «вы́пат», два слога, ударение на первом. Буква Y даёт «ы». Конечная D оглушается и звучит «т», поэтому слово кончается на «пат», а не «пад». В местном падеже появляется мягкое DZI: WYPADZIE звучит «вы́падзе», и оглушения там уже нет." }
  - { kind: register, text: "Слово разговорное и бодрое, из речи о свободном времени: WYPAD NA WEEKEND, WYPAD DO KINA, WYPAD W GÓRY. В объявлениях туристических фирм оно стоит постоянно. Военное значение живёт в книгах о войне. А в школьной речи WYPAD! значит просто «вон отсюда», и это уже грубое употребление того же слова." }
