  - { pl: "wypadek", ru: "случай; авария", relation: derived, id: wypadek }
  - { pl: "przypadek", ru: "случай; падеж", relation: derived, id: przypadek }
etymology: "От глагола WYPADAĆ, от приставки WY- и PADAĆ «падать», слова праславянского и того же, что русское «падать». Первым было военное значение: вылазка из осаждённого города, когда защитники «выпадают» наружу. Потом слово обмякло и стало означать всякий недолгий выход из дому. Русский «выпад» удержал только первый, резкий смысл, а гнездо в польском разошлось далеко: WYPADEK стал и случаем, и аварией."
memory: "Не «выпад», а короткая поездка, вылазка: wypad za miasto значит «поехать за город». Военное значение второе и книжное. Читается «вы́пат», с оглушением конечной d. В местном падеже d переходит в dzi: na wypadzie. И запомните родню, она вся обманчива: wypadek это «случай» и «ДТП», przypadek — «случай» и «падеж», wypadac — «выпадать» и «приходиться»."
idioms:
  - { pl: "wypad za miasto", ru: "вылазка за город" }
