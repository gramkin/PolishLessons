etymology: "Из английского SAFE «надёжный, безопасный», которое само пришло в английский из старофранцузского SAUF и далее из латинского SALVUS «целый, невредимый». Тот же латинский корень дал «салют», польское SALUT, и слово SALWA, а в медицине SALUS «здоровье». Любопытно, что исходно это прилагательное, а не существительное: SAFE значило «безопасный», и лишь потом так назвали несгораемый шкаф — «безопасный ящик». Русское «сейф» прошло ту же дорогу и в то же время, в конце девятнадцатого века, когда такие шкафы появились в банках. Польская орфография передала английское звучание своими буквами, и получился редкий для польского вид слова: с конечной F."
memory: "Из английского safe «безопасный», и за словом стоит латинское salvus «невредимый», родня «салюту». Записано на слух, отсюда редкая для польского конечная f. Падежи: внутрь — do sejfu с родительным, внутри — w sejfie с местным, то есть польский меняет и предлог, где русский меняет только падеж. Банковская ячейка — тоже sejf."
