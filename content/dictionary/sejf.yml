notes:
  - { kind: pronunciation, text: "Читается «сэйф», один слог. Начальное SE даёт «сэ», без смягчения, а сочетание JF на конце произносится слитно и глухо. Конечная F — буква для польского нечастая: исконных слов с ней почти нет, и все они заимствованные, отсюда ощущение чужеродности, которое у слова и в русском. Во множественном числе SEJFY читается «сэ́йфы», в местном SEJFIE — «сэ́йфе», с мягким f перед i." }
  - { kind: usage, text: "Самые частые сочетания стоит выучить блоком: SEJF PANCERNY «бронированный сейф», SEJF ŚCIENNY «встроенный в стену сейф», SEJF HOTELOWY, WYNAJĄĆ SEJF «снять ячейку», ZAMEK SZYFROWY «кодовый замок». Банковская ячейка — тоже SEJF, и отдельного слова для неё нет, так что контекст решает. Содержимое вводится предлогом W с местным: W SEJFIE LEŻAŁY DOKUMENTY, а помещение внутрь — предлогом DO с родительным: SCHOWAĆ DO SEJFU." }
  - { kind: government, text: "Мужской род, неодушевлённое: винительный равен именительному, OTWORZYLI SEJF. Родительный на -U, как у большинства неодушевлённых заимствований: NIE MA SEJFU, BEZ SEJFU. Местный на -IE со смягчением: W SEJFIE. Обратите внимание на пару предлогов: DO SEJFU с родительным, когда предмет кладут внутрь, и W SEJFIE с местным, когда он там лежит. Русский в обоих случаях скажет «в сейф» и «в сейфе», меняя падеж при одном предлоге, а польский меняет и предлог." }
  - { kind: false-friend, text: "Ложной дружбы нет, значение полностью совпадает, но происхождение слов разное по дороге. Польский взял слово из английского SAFE и записал его фонетически, SEJF, по тому же принципу, по которому из английского FOOTBALL вышло польское FUTBOL. Русский «сейф» тоже английский и тоже записан на слух. Так что совпадение здесь не родственное, а параллельное: два языка независимо подобрали свои буквы под один английский звук." }
