notes:
  - { kind: false-friend, text: "WRAK — «обломки, остов», а не «враг»: враг — WRÓG. О старой машине — «развалюха»: TEN SAMOCHÓD TO WRAK. О человеке — «развалина»: WRAK CZŁOWIEKA." }
  - { kind: usage, text: "Мужской род, неодушевлённое. Родительный — WRAKU; разговорное WRAKA не учим. Множественное — WRAKI." }
  - { kind: government, text: "Обломки чего — родительный: WRAK STATKU. Чувствовать себя развалиной — CZUĆ SIĘ JAK WRAK. Быть развалиной — BYĆ WRAKIEM, творительный." }
  - { kind: pronunciation, text: "Читается «врак», один слог. W — «в»." }
