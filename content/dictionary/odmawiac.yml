        ru: "Молитву читали по-латыни."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Второе значение способно поставить в тупик. ODMAWIAĆ RÓŻANIEC — это не «отказываться от розария», а «читать розарий»; ODMAWIAĆ MODLITWĘ значит «читать молитву». Два противоположных смысла в одном слове выросли из одной приставки: od- плюс MAWIAĆ, то есть «говорить», дало и «отговорить, отказать», и «проговорить от начала до конца, прочесть». Различает падеж: с винительным это молитва (ODMAWIA MODLITWĘ), с дательным и родительным — отказ (ODMAWIA MU POMOCY)." }
  - { kind: government, text: "Управление расходится с русским ровно так же, как у OBWINIAĆ из прошлой партии, только в другую сторону. По-польски ODMAWIAĆ KOMUŚ CZEGOŚ: человек в дательном, а предмет отказа в родительном. ODMÓWIŁ MI POMOCY значит «он отказал мне в помощи» — там, где русский берёт предлог «в» с предложным падежом, польский берёт чистый родительный, без предлога вовсе. И в возвратном обороте то же: ODMAWIAĆ SOBIE CZEGOŚ — «отказывать себе в чём-то», откуда NIE ODMAWIA SOBIE NICZEGO «он ни в чём себе не отказывает»." }
  - { kind: usage, text: "Шестьдесят три формы, несовершенный переходный. Одна форма пропущена, и причина та же, что у POPEŁNIANI в партии 252: мужская личная форма множественного ODMAWIANI требует, чтобы в винительном падеже стояли люди. А здесь винительный занят молитвой, человек же стоит в дательном. Отказывают человеку, а не человека — поэтому форма в таблице есть, а употребить её не в чем. Зато остальные десять страдательных причастий живые: ODMAWIANA MODLITWA, ODMAWIANE PROŚBY." }
  - { kind: usage, text: "Основа одна на все формы: ODMAWIAM, ODMAWIA, ODMAWIAJĄ, ODMAWIAŁ, ODMAWIANY. Повелительное ODMAWIAJ выходит из третьего лица ODMAWIA прибавлением -j. Совершенная пара ODMÓWIĆ, и у неё повелительное ODMÓW — из третьего лица ODMÓWI отбрасыванием -i, то есть правило карточки KARMIĆ работает на обоих членах пары. Существительное отказа — ODMOWA, и оно встречается в речи чаще самого глагола: SPOTKAŁ SIĘ Z ODMOWĄ «он получил отказ»." }
collocations:
  - { pl: "odmawiać komuś pomocy", ru: "отказывать кому-либо в помощи" }
  - { pl: "odmawiać modlitwę", ru: "читать молитву" }
  - { pl: "odmawiać sobie czegoś", ru: "отказывать себе в чём-либо" }
family:
  - { pl: "odmówić", ru: "отказать", relation: aspect, id: odmowic }
  - { pl: "mówić", ru: "говорить", relation: root, id: mowic }
  - { pl: "odmowa", ru: "отказ", relation: derived }
etymology: "Приставка od- и MAWIAĆ — многократная форма от MÓWIĆ «говорить», из праславянского *mъlviti, того же корня, что русские «молвить» и «молва». Буквально «отговорить», откуда «отказать». Второе значение пришло от другого прочтения той же приставки: od- как «от начала до конца», то есть «проговорить целиком», отсюда «читать молитву». Русское «отговорить» сохранило первую ветку, а второй не дало вовсе, и именно поэтому ODMAWIAĆ RÓŻANIEC звучит для русского уха наоборот."
memory: "od- плюс «молвить»: отговорить значит отказать. Но молитву «проговаривают» от начала до конца, и это тоже odmawiać. Падеж различает: винительный — молитва, дательный с родительным — отказ."
idioms:
  - { pl: "nie odmawiać sobie niczego", ru: "ни в чём себе не отказывать" }
  - { pl: "odmawiać różaniec", ru: "читать розарий" }
formExamplesSkip:
  - { form: "odmawiani", reason: "Мужская личная форма множественного числа у страдательного причастия требует, чтобы в винительном падеже стояли люди. У ODMAWIAĆ винительный занят предметом отказа или молитвой (ODMAWIA MODLITWĘ), а человек стоит в дательном (ODMAWIA MU). Отказывают человеку, а не человека, поэтому форма в таблице есть, а употребить её не в чем. То же устройство, что у POPEŁNIANI в партии 252." }
