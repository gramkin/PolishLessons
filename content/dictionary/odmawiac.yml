rank: 2825
pos: verb
pron: { cyr: "одмавья́ць" }
senses:
  - id: refuse
    ru: "отказывать, отказываться"
    examples:
      - pl: "Odmawiam udziału w tej rozmowie."
        ru: "Я отказываюсь от участия в этом разговоре."
