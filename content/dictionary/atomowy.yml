notes:
  - { kind: false-friend, text: "Ловушки в значении нет, но рядом стоит синоним. Атомную тему польский называет двумя словами: ATOMOWY и JĄDROWY, буквально «ядерный». В быту и в газете — ATOMOWY: BOMBA ATOMOWA, ELEKTROWNIA ATOMOWA. В науке и в официальных документах — JĄDROWY: ENERGETYKA JĄDROWA, FIZYKA JĄDROWA. Русское «ядерный» и «атомный» распределены похоже, только у нас граница проходит чуть иначе: русские говорят «ядерное оружие», а поляк скажет и BROŃ ATOMOWA, и BROŃ JĄDROWA." }
  - { kind: usage, text: "Относительное прилагательное, степеней сравнения нет. Форма для мужчин-людей ATOMOWI в карточку не включена: атомными бывают бомбы, станции и лодки, а не люди. Учёных-атомщиков называют FIZYCY JĄDROWI." }
  - { kind: government, text: "Ставится после существительного: BOMBA ATOMOWA, ELEKTROWNIA ATOMOWA, OKRĘT ATOMOWY. Перед существительным — только в образных оборотах: ATOMOWA SIŁA, «атомная мощь». В эпоху атома — W EPOCE ATOMU, родительный существительного, без прилагательного." }
  - { kind: pronunciation, text: "Читается «атомо́вы», четыре слога, ударение на предпоследнем, тогда как в русском «а́томный» оно на первом. Все O чёткие, без русского аканья: «а-то-мо-вы». Конечная Y — «ы»." }
  - { kind: register, text: "Нейтральное слово с оттенком публицистики. Учёный или инженер чаще выберет JĄDROWY, журналист и обыватель — ATOMOWY. Разговорно об атомной электростанции говорят просто ATOMÓWKA." }
