etymology: "От ATOM, из греческого átomos, «неделимый»: a- «не» и temnein «резать». Греки так назвали мельчайшую частицу вещества, и ирония в том, что именно расщепление этой «неделимой» частицы дало бомбу. Суффикс -OWY польский, тот же, что в METALOWY и DOMOWY."
memory: "Atomowy — атомный: bomba atomowa, elektrownia atomowa. В науке говорят jądrowy — ядерный. Ударение на «мо»: атомо́вы, а не а́томный."
idioms:
