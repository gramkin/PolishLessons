notes:
  - { kind: usage, text: "Слово срослось из отрицания: nie + legalny. В отличие от обычного отрицания, здесь nie пишется ВМЕСТЕ и даёт самостоятельное прилагательное, как в русском «нелегальный». Положительная пара legalny существует отдельно и имеет свою статью." }
  - { kind: false-friend, text: "Ловушки нет: nielegalny и «нелегальный» — одно и то же латинское слово с одинаковым отрицанием. Стоит лишь помнить, что по-польски оно чаще значит именно «незаконный» в юридическом смысле, и в переводе часто лучше звучит «незаконный», чем «нелегальный»: nielegalna wycinka — «незаконная вырубка»." }
  - { kind: government, text: "Мужско-личная форма множественного — nielegalni (о людях): nielegalni pracownicy. О вещах будет nielegalne: nielegalne wysypiska. Это различие в польском обязательно и влияет на глагол в прошедшем времени." }
  - { kind: pronunciation, text: "Прилагательное склоняется полностью, но многие падежи совпадают по форме, поэтому различных написаний всего десять-одиннадцать, а не двадцать пять. Примеры в каждом слоте нарочно взяты из разных падежей, чтобы видно было весь охват формы." }
collocations:
  - { pl: "nielegalny imigrant", ru: "нелегальный иммигрант" }
  - { pl: "nielegalna działalność", ru: "незаконная деятельность" }
  - { pl: "nielegalne zatrudnienie", ru: "незаконное трудоустройство" }
family:
  - { pl: "legalny", ru: "легальный, законный", relation: antonym }
  - { pl: "nielegalnie", ru: "нелегально, незаконно", relation: derived }
etymology: "Отрицательная приставка nie- плюс legalny, а то — из латинского legalis «законный», от lex «закон». Русское «нелегальный» собрано точно так же и из того же латинского корня, так что слова совпадают полностью, вплоть до приставки."
memory: "nielegalny — «нелегальный», буквально nie + legalny, с тем же латинским lex «закон». Запомните только, что о людях будет nielegalni, а о вещах nielegalne."
