# review
id: oddech
format: 2
lemma: "oddech"
rank: 1714
pos: noun
pron: { cyr: "о́ддэх" }
senses:
  - id: breath
    ru: "дыхание, вдох"
    examples:
      - pl: "Wstrzymał oddech."
        ru: "Он задержал дыхание."
        source: { kind: translated, id: 951419 }
      - pl: "Wstrzymała oddech i ukryła się za drzwiami."
        ru: "Она пряталась за дверью, затаив дыхание."
        source: { kind: tatoeba, id: 2585294 }
      - pl: "Chłopcu wrócił oddech."
        ru: "К мальчику вернулось дыхание."
        source: { kind: translated, id: 951154 }
  - id: breath-other
    ru: "дыхание (запах изо рта); нехватка дыхания"
    examples:
      - pl: "Mam nieświeży oddech."
        ru: "У меня несвежее дыхание."
        source: { kind: translated, id: 8379986 }
      - pl: "On biegł tak szybko, że zabrakło mu oddechu."
        ru: "Он бежал так быстро, что у него перехватило дыхание."
        source: { kind: translated, id: 749444 }
notes:
  - { kind: usage, text: "wstrzymać oddech — «задержать дыхание» и «затаить дыхание», ровно как по-русски." }
  - { kind: usage, text: "Глагол — oddychać «дышать», прилагательное — oddechowy «дыхательный»." }
  - { kind: usage, text: "nieświeży oddech — «несвежее дыхание», то есть запах изо рта." }
  - { kind: government, text: "Не хватать дыхания — brakuje oddechu, родительный падеж: zabrakło mu oddechu «ему не хватило дыхания»." }
collocations:
  - { pl: "wstrzymać oddech", ru: "задержать дыхание" }
  - { pl: "nieświeży oddech", ru: "несвежее дыхание" }
  - { pl: "brak oddechu", ru: "нехватка дыхания" }
family:
  - { pl: "oddychać", ru: "дышать", relation: root, id: oddychac }
  - { pl: "oddechowy", ru: "дыхательный", relation: root }
etymology: "Приставка od- плюс dech «дух, дыхание» — того же корня, что русское «дух» и «вздох». Русское «дыхание» образовано от «дышать», из того же круга слов."
memory: "oddech — «дыхание»: wstrzymać oddech «задержать дыхание». Глагол — oddychać. И запомните nieświeży oddech «несвежее дыхание»."
idioms:
  - { pl: "wstrzymać oddech", ru: "затаить дыхание" }
  - { pl: "złapać oddech", ru: "перевести дух" }
  - { pl: "nieświeży oddech", ru: "несвежее дыхание" }
