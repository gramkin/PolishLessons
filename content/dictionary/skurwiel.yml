notes:
  - { kind: register, text: "Очень грубое ругательство о мужчине, сильнее, чем dupek. Русские соответствия — «ублюдок», «мразь». В приличной речи неуместно совершенно." }
  - { kind: usage, text: "Образовано от kurwa с приставкой s-; всё гнездо этого корня относится к самой грубой лексике польского языка." }
  - { kind: usage, text: "В корпусе встречается почти исключительно в именительном падеже: Co za skurwiel!" }
  - { kind: usage, text: "Форма skurwielu в примерах стоит только как предложный падеж (o tym skurwielu), но не как обращение: в обращении это прямое оскорбление. Так же построены карточки chuj и kutas." }
  - { kind: government, text: "Множественное число у слова обычное: skurwiele в именительном, skurwieli в родительном — как nauczyciele и nauczycieli. Уничижительной формы, как у kutasy, здесь выбирать не приходится." }
collocations:
  - { pl: "co za skurwiel", ru: "вот мразь" }
  - { pl: "arogancki skurwiel", ru: "наглый ублюдок" }
  - { pl: "zimny skurwiel", ru: "хладнокровный ублюдок" }
etymology: "От kurwa «шлюха», праславянское *kurъva, с приставкой s-. Русское «курва» — то же слово, но в современном русском оно областное и устаревшее."
memory: "skurwiel — «ублюдок, мразь», очень грубо. Того же корня, что kurwa, и это одно из самых сильных ругательств."
