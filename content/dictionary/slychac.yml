# review
id: slychac
format: 2
lemma: "słychać"
rank: 1335
pos: verb
aspect: imperf
pron: { cyr: "суы́хаць" }
senses:
  - id: whats-up
    ru: "Co słychać? — Как дела? Что слышно?"
    examples:
      - pl: "Co słychać?"
        ru: "Как дела?"
        source: { kind: translated, id: 402712 }
      - pl: "Dobry wieczór, co słychać u pana?"
        ru: "Добрый вечер, как у вас дела?"
        source: { kind: translated, id: 382417 }
      - pl: "Co słychać u was?"
        ru: "Как у вас дела?"
        source: { kind: translated, id: 11698068 }
  - id: can-be-heard
    ru: "безлично: слышно, доносится"
    examples:
      - pl: "Słychać mnie?"
        ru: "Меня слышно?"
        source: { kind: translated, id: 357385 }
      - pl: "Słychać było, jak płacze."
        ru: "Было слышно, как она плачет."
        source: { kind: translated, id: 4132028 }
      - pl: "Tom starał się, żeby nie było słychać szumu."
        ru: "Том старался, чтобы шума не было слышно."
        source: { kind: translated, id: 13660055 }
notes:
  - { kind: usage, text: "Co słychać? — «Как дела?», одна из самых частых фраз приветствия. Буквально «Что слышно?», как русское «Что слыхать?»." }
  - { kind: government, text: "Глагол безличный: подлежащего при нём нет, а объект стоит в винительном — Słychać muzykę «Слышно музыку». При отрицании — родительный." }
  - { kind: usage, text: "Дефектный глагол: в живой речи употребляется практически только сама форма słychać, без спряжения." }
  - { kind: usage, text: "Не путайте со słyszeć «слышать», у которого есть полное спряжение: słyszę, słyszysz. Карточка słyszec уже есть." }
collocations:
  - { pl: "co słychać", ru: "как дела" }
  - { pl: "nic nie słychać", ru: "ничего не слышно" }
  - { pl: "słychać muzykę", ru: "слышно музыку" }
etymology: "От słyszeć «слышать», из праславянского *slyšati. Русское «слыхать» — то же слово, и оборот «что слыхать?» совпадает с польским дословно."
memory: "słychać — безличное «слышно». Главное здесь Co słychać? «Как дела?», буквально «Что слышно?» — ровно как русское «Что слыхать?». Глагол дефектный: кроме самой формы słychać, других почти нет."
idioms:
  - { pl: "co słychać", ru: "как дела" }
  - { pl: "nic nie słychać", ru: "ничего не слышно" }
  - { pl: "słychać muzykę", ru: "слышно музыку" }
