  - id: the-public
    ru: "общество, население"
    examples:
      - pl: "Społeczeństwo oczekuje zmian."
        ru: "Общество ожидает перемен."
        source: { kind: authored }
      - pl: "W społeczeństwie polskim rodzina odgrywa dużą rolę."
        ru: "В польском обществе семья играет большую роль."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Не путайте społeczeństwo и towarzystwo. Первое — общество как целое, народ, социум; второе — общество как компания людей, с которыми вы вместе («w dobrym towarzystwie»). Русское «общество» покрывает оба смысла, польский их развёл." }
  - { kind: government, text: "Предлоги те же, что в русском: w społeczeństwie «в обществе» (предложный), dla społeczeństwa «для общества» (родительный), rządzić społeczeństwem «управлять обществом» (творительный)." }
  - { kind: usage, text: "Прилагательное społeczny «общественный, социальный»; społecznik — «общественник», человек, работающий для других. Оборот społeczeństwo obywatelskie значит «гражданское общество»." }
collocations:
  - { pl: "nowoczesne społeczeństwo", ru: "современное общество" }
  - { pl: "w społeczeństwie", ru: "в обществе" }
  - { pl: "społeczeństwo obywatelskie", ru: "гражданское общество" }
family:
  - { pl: "społeczny", ru: "общественный, социальный", relation: derived, id: spoleczny }
  - { pl: "wspólny", ru: "общий, совместный", relation: root, id: wspolny }
etymology: "От społeczny, а то — от наречия społem «сообща, вместе», родственного wspólny «общий». Русское «общество» построено на той же мысли, но от другого корня — от «общий». То есть оба языка назвали социум «тем, что вместе», просто взяли для этого разные слова."
memory: "społeczeństwo — «общество» как целое, от społem «сообща». А «общество» как компания — это towarzystwo. Русское слово покрывает оба смысла, польское только первый."
idioms:
  - { pl: "społeczeństwo obywatelskie", ru: "гражданское общество" }
  - { pl: "rak społeczeństwa", ru: "язва общества" }
