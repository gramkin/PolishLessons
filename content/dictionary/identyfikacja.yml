  - { kind: false-friend, text: "IDENTYFIKACJA — «идентификация, опознание». Удостоверение личности — DOWÓD OSOBISTY, личность — TOŻSAMOŚĆ: USTALIĆ TOŻSAMOŚĆ, «установить личность». Бейдж — IDENTYFIKATOR." }
