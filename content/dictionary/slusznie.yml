        ru: "Правильнее всего будет отложить решение."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Три формы — и это всё слово целиком. Наречие по падежам не изменяется вовсе, у него есть только степени сравнения: SŁUSZNIE, SŁUSZNIEJ, NAJSŁUSZNIEJ. Сравнительная образуется суффиксом -ej на месте -ie, превосходная прибавляет naj-. Это правильный, предсказуемый образец, и ему следует большинство польских наречий на -ie: ładnie — ładniej — najładniej, trudno — trudniej — najtrudniej." }
  - { kind: usage, text: "Правильность этого образца стоит отметить отдельно, потому что самые частые польские наречия как раз неправильны и их приходится заучивать: DOBRZE даёт LEPIEJ, ŹLE даёт GORZEJ, DUŻO даёт WIĘCEJ, MAŁO даёт MNIEJ, WYSOKO даёт WYŻEJ, DALEKO даёт DALEJ. Русский ведёт себя точно так же — «хорошо — лучше», «плохо — хуже», — так что неправильные пары в обоих языках неправильны одинаково, а вот правильные совпадают только по устройству: słusznie — słuszniej, как «верно — вернее»." }
  - { kind: usage, text: "Само слово часто стоит отдельной репликой: SŁUSZNIE! значит «верно!», «справедливо!», «так и надо» — согласие с только что сказанным. Есть и оборот I SŁUSZNIE «и правильно», которым подтверждают чужое решение. От того же корня идёт существительное SŁUSZNOŚĆ, и выражение MIEĆ SŁUSZNOŚĆ значит «быть правым» — наряду с MIEĆ RACJĘ. Заметьте, что słuszność принадлежит к разряду на -ość, разобранному в карточке OSOBOWOŚĆ, и склоняется так же, в шесть форм." }
