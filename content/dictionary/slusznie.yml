etymology: "От прилагательного SŁUSZNY «справедливый, правильный», от которого наречие образовано обычным для польского способом — окончанием -ie. Русского слова того же корня в этом значении нет, и ближайшие переводы — «верно», «справедливо», «правильно» — идут от других корней, так что наречие приходится запоминать само по себе. Зато производное SŁUSZNOŚĆ входит в прозрачный разряд на -ość, где суффиксу отвечает русское -ость."
memory: "Три формы и больше ничего: наречие не склоняется. Сравнительная -ej вместо -ie: słusznie — słuszniej — najsłuszniej. И mieć słuszność значит «быть правым»."
