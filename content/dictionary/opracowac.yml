# review
id: opracowac
format: 2
lemma: "opracować"
rank: 4844
pos: verb
pron: { cyr: "опрацо́ваць" }
senses:
  - id: develop
    ru: "разработать"
    examples:
      - pl: "Naukowcy opracowali nową szczepionkę."
        ru: "Учёные разработали новую вакцину."
        source: { kind: authored }
      - pl: "Musimy opracować plan działania."
        ru: "Нам нужно разработать план действий."
        source: { kind: authored }
      - pl: "Firma opracowała własny system."
        ru: "Фирма разработала собственную систему."
        source: { kind: authored }
  - id: prepare
    ru: "подготовить, составить (текст, отчёт); обработать (данные)"
    examples:
      - pl: "Opracowała raport na podstawie ankiet."
        ru: "Она составила отчёт на основе анкет."
        source: { kind: authored }
      - pl: "Dane opracowano statystycznie."
        ru: "Данные обработали статистически."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "OPRACOWAĆ — не «обработать» в смысле «отработать смену», а «разработать, подготовить»: OPRACOWAĆ PLAN, METODĘ, LEK. Корень PRAC-, как в PRACA, «работа»: буквально «обработать трудом». OPRACOWANIE — «разработка; монография, справочник»: OPRACOWANIE NAUKOWE." }
  - { kind: usage, text: "Пятьдесят две формы: страдательное OPRACOWANY есть — о планах, текстах, данных; форма для мужчин-людей OPRACOWANI в карточку не включена: людей не «разрабатывают». Спряжение на -UJĘ: OPRACUJĘ, OPRACUJESZ. Видовой партнёр — OPRACOWYWAĆ." }
  - { kind: government, text: "Что — винительный: OPRACOWAĆ STRATEGIĘ, PROJEKT. Для кого — DLA с родительным: OPRACOWAĆ PROGRAM DLA SZKÓŁ. На основе чего — NA PODSTAWIE с родительным: NA PODSTAWIE BADAŃ." }
  - { kind: pronunciation, text: "Читается «опрацо́ваць», четыре слога, ударение на предпоследнем. C — «ц», W перед A — «в». Конечное Ć — «ць». OPRACUJĘ — «опрацу́е»." }
  - { kind: register, text: "Деловое и научное слово: отчёты, проекты, учёба. Студент OPRACOWUJE ZAGADNIENIA — «готовит вопросы к экзамену». В быту о планах проще WYMYŚLIĆ, PRZYGOTOWAĆ." }
collocations:
  - { pl: "opracować plan", ru: "разработать план" }
  - { pl: "opracować dane", ru: "обработать данные" }
  - { pl: "opracowanie naukowe", ru: "научная монография" }
family:
  - { pl: "opracowywać", ru: "разрабатывать", relation: aspect }
  - { pl: "praca", ru: "работа", relation: root, id: praca }
  - { pl: "pracować", ru: "работать", relation: root, id: pracowac }
etymology: "Приставка O- плюс PRACOWAĆ «работать», от PRACA «работа, труд». Русскому слову «работа» он не родствен; ближайшая родня — чешское PRÁCE и украинское «праця»."
memory: "Opracować — разработать: opracować plan, szczepionkę, system. Opracować dane — обработать данные. Opracowanie — разработка, монография. Читается «опрацо́ваць»."
idioms:
  - { pl: "opracować coś w najdrobniejszych szczegółach", ru: "разработать что-то до мелочей" }
formExamplesSkip:
  - { form: "opracowani", reason: "людей не «разрабатывают»: формы для мужчин-людей нет" }
