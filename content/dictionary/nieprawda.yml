etymology: "Прозрачно из nie + prawda, праславянское *nepravьda — ровно как русское «неправда»."
memory: "nieprawda — «неправда», и склоняется почти только в двух формах. Главное же — вопрос-переспрос: Ładnie tu, nieprawda? По-русски здесь стоит утвердительное «правда?», по-польски отрицательное."
