# review
id: nieprawda
format: 2
lemma: "nieprawda"
rank: 1107
pos: noun
pron: { cyr: "непра́вда" }
senses:
  - id: untruth
    ru: "неправда"
    examples:
      - pl: "Oboje wiemy, że to nieprawda."
        ru: "Мы оба знаем, что это неправда."
        source: { kind: translated, id: 6603316 }
      - pl: "Nieprawda."
        ru: "Неправда."
        source: { kind: translated, id: 6160620 }
      - pl: "Jeśli to brzmi zbyt dobrze, żeby to mogła być prawda, prawdopodobnie to nieprawda."
        ru: "Если это звучит слишком хорошо, чтобы быть правдой, вероятно, это неправда."
        source: { kind: translated, id: 4716823 }
  - id: tag
    ru: "nieprawda? — правда?, не так ли? (вопрос-переспрос)"
    note: "Русский берёт утвердительное «правда?», польский — отрицательное."
    examples:
      - pl: "Jest tu bardzo przytulnie, nieprawda?"
        ru: "Тут очень уютно, правда?"
        source: { kind: translated, id: 11318571 }
      - pl: "Ładnie dziś, nieprawda?"
        ru: "Сегодня хорошо, правда?"
        source: { kind: authored }
      - pl: "Znasz go, nieprawda?"
        ru: "Ты его знаешь, не так ли?"
        source: { kind: authored }
  - id: turn-out
    ru: "okazać się nieprawdą — оказаться неправдой"
    examples:
      - pl: "Jej słowa okazały się nieprawdą."
        ru: "Её слова оказались неправдой."
        source: { kind: translated, id: 818729 }
      - pl: "Plotka okazała się nieprawdą."
        ru: "Слух оказался неправдой."
        source: { kind: translated, id: 7713564 }
      - pl: "To, co mówił, okazało się nieprawdą."
        ru: "То, что он говорил, оказалось неправдой."
        source: { kind: translated, id: 2493600 }
notes:
  - { kind: usage, text: "Как отдельное слово встречается прежде всего в двух формах: именительном nieprawda «неправда» и творительном nieprawdą в обороте okazać się nieprawdą «оказаться неправдой»." }
  - { kind: usage, text: "Вопрос-переспрос строится отрицательно: Ładnie tu, nieprawda? «Тут красиво, правда?». Русский в том же месте ставит утвердительное «правда?», и это стоит запомнить." }
  - { kind: usage, text: "Как реплика Nieprawda! значит «Неправда!, Враньё!» — резкое возражение." }
  - { kind: usage, text: "Слово прозрачно: nie + prawda, ровно как русское «не» + «правда»." }
collocations:
  - { pl: "to nieprawda", ru: "это неправда" }
  - { pl: "nieprawda?", ru: "правда?, не так ли?" }
  - { pl: "okazać się nieprawdą", ru: "оказаться неправдой" }
  - { pl: "dawno i nieprawda", ru: "давно и неправда" }
