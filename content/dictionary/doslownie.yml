# review
id: doslownie
format: 2
lemma: "dosłownie"
rank: 2339
pos: adv
pron: { cyr: "досуо́вне" }
senses:
  - id: literally
    ru: "дословно, буквально (о переводе)"
    examples:
      - pl: "Przetłumaczył zdanie dosłownie."
        ru: "Он перевёл фразу дословно."
        source: { kind: authored }
      - pl: "Nie bierz tego dosłownie."
        ru: "Не понимай это буквально."
        source: { kind: authored }
  - id: intensifier
    ru: "буквально (усиление)"
    examples:
      - pl: "Dosłownie wszyscy o tym wiedzą."
        ru: "Буквально все об этом знают."
        source: { kind: authored }
      - pl: "Czekaliśmy dosłownie pięć minut."
        ru: "Мы ждали буквально пять минут."
        source: { kind: authored }
  - id: word-for-word
    ru: "слово в слово"
    examples:
      - pl: "Powtórzył to dosłowniej, niż trzeba było."
        ru: "Он повторил это дословнее, чем следовало."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "РУССКОЕ «ДОСЛОВНО» — ПОМОРФЕМНЫЙ ДВОЙНИК. Do plus słowo plus -nie против «до» плюс «слов» плюс «-но»: одно и то же слово, собранное из одних частей. Совпадает и второе, разговорное значение — усилительное «буквально»: dosłownie wszyscy, «буквально все». Редкий случай, когда можно довериться родному языку целиком." }
  - { kind: usage, text: "ТРИ ФОРМЫ, А НЕ ОДНА: У НАРЕЧИЯ ЕСТЬ СТЕПЕНИ СРАВНЕНИЯ. Dosłownie, dosłowniej, najdosłowniej — как dobrze, lepiej, najlepiej. Так ведут себя наречия, образованные от качественных прилагательных: dosłowny даёт dosłownie. У относительных, вроде wojenny, наречий вообще не бывает." }
  - { kind: pronunciation, text: "Три слога, ударение на предпоследнем: do-SŁOW-nie. Ł читается как краткое у, так что słow звучит «суов»: «досуо́вне». В сравнительной степени ударение смещается: dosłowniej — «досуо́вней»." }
collocations:
  - { pl: "tłumaczyć dosłownie", ru: "переводить дословно" }
  - { pl: "nie bierz tego dosłownie", ru: "не понимай буквально" }
  - { pl: "dosłownie wszyscy", ru: "буквально все" }
family:
  - { pl: "dosłowny", ru: "дословный, буквальный", relation: root }
  - { pl: "słowo", ru: "слово", relation: root, id: slowo }
  - { pl: "przenośnie", ru: "переносно", relation: antonym }
etymology: "От dosłowny, а то — от оборота do słowa «до слова», от słowo — того же слова, что русское «слово». Русское «дословно» собрано из тех же частей тем же способом; оба языка перевели латинское ad litteram независимо друг от друга, но одинаково."
memory: "dosłownie — «дословно, буквально», и слово собрано точь-в-точь как русское: do + słowo + -nie. Второе значение тоже общее: dosłownie wszyscy значит «буквально все». Формы три: dosłownie, dosłowniej, najdosłowniej."
idioms:
  - { pl: "nie bierz tego dosłownie", ru: "не понимай это буквально" }
  - { pl: "dosłownie i w przenośni", ru: "буквально и в переносном смысле" }
