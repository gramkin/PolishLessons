formExamples:
  - form: "przestaje"
    pl: "Deszcz nie przestaje padać."
    ru: "Дождь не перестаёт идти."
    source: { kind: authored }
  - form: "przestaje"
    pl: "Kto z kim przestaje, takim się staje."
    ru: "С кем поведёшься, от того и наберёшься."
    source: { kind: authored }
  - form: "przestaje"
    pl: "Telefon nie przestaje dzwonić."
    ru: "Телефон не перестаёт звонить."
    source: { kind: authored }
  - form: "przestajecie"
    pl: "Kiedy przestajecie na dziś?"
    ru: "Когда вы заканчиваете на сегодня?"
    source: { kind: authored }
  - form: "przestajecie"
    pl: "Przestajecie czytać zbyt wcześnie."
    ru: "Вы перестаёте читать слишком рано."
    source: { kind: authored }
  - form: "przestajecie"
    pl: "Czy przestajecie z nimi rozmawiać?"
    ru: "Вы перестаёте с ними разговаривать?"
    source: { kind: authored }
  - form: "przestajemy"
    pl: "Przestajemy pracować o szóstej."
    ru: "Мы перестаём работать в шесть."
    source: { kind: authored }
  - form: "przestajemy"
    pl: "Nie przestajemy próbować."
    ru: "Мы не перестаём пробовать."
    source: { kind: authored }
  - form: "przestajemy"
    pl: "Przestajemy z tą firmą współpracować."
    ru: "Мы перестаём сотрудничать с этой фирмой."
    source: { kind: authored }
  - form: "przestajesz"
    pl: "Dlaczego przestajesz w połowie?"
    ru: "Почему ты перестаёшь на середине?"
    source: { kind: authored }
  - form: "przestajesz"
    pl: "Przestajesz czytać po dwóch stronach."
    ru: "Ты перестаёшь читать после двух страниц."
    source: { kind: authored }
  - form: "przestajesz"
    pl: "Jeśli przestajesz z nimi, powiedz wprost."
    ru: "Если ты перестаёшь с ними общаться, скажи прямо."
    source: { kind: authored }
  - form: "przestają"
    pl: "Ludzie przestają wierzyć w takie obietnice."
    ru: "Люди перестают верить в такие обещания."
    source: { kind: authored }
  - form: "przestają"
    pl: "Maszyny nie przestają pracować w nocy."
    ru: "Машины не перестают работать ночью."
    source: { kind: authored }
  - form: "przestają"
    pl: "Przestają z nim rozmawiać po tej historii."
    ru: "Они перестают с ним разговаривать после этой истории."
    source: { kind: authored }
  - form: "przestając"
    pl: "Przestając palić, przybrał na wadze."
    ru: "Перестав курить, он прибавил в весе."
    source: { kind: authored }
  - form: "przestając"
    pl: "Nie przestając mówić, otworzył drzwi."
    ru: "Не переставая говорить, он открыл дверь."
    source: { kind: authored }
  - form: "przestając"
    pl: "Przestając z nimi, stracił pół znajomych."
    ru: "Перестав с ними общаться, он потерял половину знакомых."
    source: { kind: authored }
  - form: "przestająca"
    pl: "Praca nie przestająca męczyć nie ma sensu."
    ru: "Работа, не перестающая изматывать, бессмысленна."
    source: { kind: authored }
  - form: "przestająca"
    pl: "Kobieta nie przestająca wierzyć doczekała się."
    ru: "Женщина, не перестающая верить, дождалась."
    source: { kind: authored }
  - form: "przestająca"
    pl: "Maszyna nie przestająca pracować wreszcie padła."
    ru: "Машина, не перестающая работать, наконец сломалась."
    source: { kind: authored }
  - form: "przestające"
    pl: "Dziecko nie przestające płakać zasnęło nad ranem."
    ru: "Ребёнок, не перестающий плакать, уснул к утру."
    source: { kind: authored }
  - form: "przestające"
    pl: "Telefony nie przestające dzwonić wyłączono."
    ru: "Телефоны, не перестающие звонить, отключили."
    source: { kind: authored }
  - form: "przestające"
    pl: "Te pytania, nie przestające wracać, męczą."
    ru: "Эти вопросы, не перестающие возвращаться, изматывают."
    source: { kind: authored }
  - form: "przestającego"
    pl: "Nie znam nikogo nie przestającego pytać."
    ru: "Я не знаю никого, кто не перестаёт спрашивать."
    source: { kind: authored }
  - form: "przestającego"
    pl: "Od deszczu nie przestającego padać uciekli do domu."
    ru: "От дождя, не перестающего идти, они убежали домой."
    source: { kind: authored }
  - form: "przestającego"
    pl: "Szukali pracownika nie przestającego próbować."
    ru: "Они искали работника, не перестающего пробовать."
    source: { kind: authored }
  - form: "przestającej"
    pl: "O pracy nie przestającej męczyć lepiej milczeć."
    ru: "О работе, не перестающей изматывать, лучше молчать."
    source: { kind: authored }
  - form: "przestającej"
    pl: "Nie ma mowy o maszynie nie przestającej pracować."
    ru: "О машине, не перестающей работать, и речи нет."
    source: { kind: authored }
  - form: "przestającej"
    pl: "Pomogli kobiecie nie przestającej szukać syna."
    ru: "Они помогли женщине, не перестающей искать сына."
    source: { kind: authored }
  - form: "przestającemu"
    pl: "Uczniowi nie przestającemu pytać dano stypendium."
    ru: "Ученику, не перестающему спрашивать, дали стипендию."
    source: { kind: authored }
  - form: "przestającemu"
    pl: "Przyglądał się dziecku nie przestającemu płakać."
    ru: "Он смотрел на ребёнка, не перестающего плакать."
    source: { kind: authored }
  - form: "przestającemu"
    pl: "Dzięki pracownikowi nie przestającemu próbować skończyli w terminie."
    ru: "Благодаря работнику, не перестающему пробовать, они закончили в срок."
    source: { kind: authored }
  - form: "przestający"
    pl: "Człowiek nie przestający pytać dojdzie dalej."
    ru: "Человек, не перестающий спрашивать, дойдёт дальше."
    source: { kind: authored }
  - form: "przestający"
    pl: "Deszcz nie przestający padać zalał pola."
    ru: "Дождь, не перестающий идти, залил поля."
    source: { kind: authored }
  - form: "przestający"
    pl: "Przestający z nimi uczeń zmienił się szybko."
    ru: "Ученик, общающийся с ними, быстро изменился."
    source: { kind: authored }
  - form: "przestających"
    pl: "Nie ma tu ludzi nie przestających pytać."
    ru: "Здесь нет людей, не перестающих спрашивать."
    source: { kind: authored }
  - form: "przestających"
    pl: "Wśród uczniów przestających z nimi byli najlepsi."
    ru: "Среди учеников, общавшихся с ними, были лучшие."
    source: { kind: authored }
  - form: "przestających"
    pl: "Lista maszyn nie przestających pracować jest krótka."
    ru: "Список машин, не перестающих работать, короткий."
    source: { kind: authored }
  - form: "przestającym"
    pl: "W uczniu nie przestającym pytać widzieli talent."
    ru: "В ученике, не перестающем спрашивать, они видели талант."
    source: { kind: authored }
  - form: "przestającym"
    pl: "Okazał się człowiekiem nie przestającym próbować."
    ru: "Он оказался человеком, не перестающим пробовать."
    source: { kind: authored }
  - form: "przestającym"
    pl: "Przestającym z nimi uczniom rodzice nie wierzyli."
    ru: "Ученикам, общавшимся с ними, родители не верили."
    source: { kind: authored }
  - form: "przestającymi"
    pl: "Między ludźmi nie przestającymi próbować a resztą jest różnica."
    ru: "Между людьми, не перестающими пробовать, и остальными есть разница."
    source: { kind: authored }
  - form: "przestającymi"
    pl: "Zajął się uczniami przestającymi z tą grupą."
    ru: "Он занялся учениками, общавшимися с той группой."
    source: { kind: authored }
  - form: "przestającymi"
    pl: "Rozmawiał z pracownikami nie przestającymi narzekać."
    ru: "Он говорил с работниками, не перестающими жаловаться."
    source: { kind: authored }
  - form: "przestającą"
    pl: "Znają pracę nie przestającą męczyć."
    ru: "Они знают работу, не перестающую изматывать."
    source: { kind: authored }
  - form: "przestającą"
    pl: "Uznali ją za osobę nie przestającą szukać."
    ru: "Её сочли человеком, не перестающим искать."
    source: { kind: authored }
  - form: "przestającą"
    pl: "Zastąpili maszynę nie przestającą się psuć."
    ru: "Они заменили машину, не перестающую ломаться."
    source: { kind: authored }
  - form: "przestaję"
    pl: "Przestaję o tym myśleć."
    ru: "Я перестаю об этом думать."
    source: { kind: authored }
  - form: "przestaję"
    pl: "Nigdy nie przestaję się dziwić."
    ru: "Я никогда не перестаю удивляться."
    source: { kind: authored }
  - form: "przestaję"
    pl: "Przestaję z nimi rozmawiać o polityce."
    ru: "Я перестаю говорить с ними о политике."
    source: { kind: authored }
  - form: "przestawaj"
    pl: "Nie przestawaj mówić, słucham."
    ru: "Не переставай говорить, я слушаю."
    source: { kind: authored }
