# review
id: przestawac
format: 2
lemma: "przestawać"
rank: 2285
pos: verb
pron: { cyr: "пшэстава́ць" }
senses:
  - id: stop
    ru: "переставать, прекращать"
    examples:
      - pl: "Przestaję o tym myśleć."
        ru: "Я перестаю об этом думать."
        source: { kind: authored }
      - pl: "Deszcz nie przestaje padać."
        ru: "Дождь не перестаёт идти."
        source: { kind: authored }
      - pl: "Przestawał pracować dopiero o ósmej."
        ru: "Он переставал работать только в восемь."
        source: { kind: authored }
  - id: associate
    ru: "общаться, водиться (с кем-л.)"
    examples:
      - pl: "Kto z kim przestaje, takim się staje."
        ru: "С кем поведёшься, от того и наберёшься."
        source: { kind: authored }
      - pl: "Przestawał z ludźmi, których rodzice nie znosili."
        ru: "Он водился с людьми, которых родители терпеть не могли."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Главное в этом глаголе — две основы, и они поделены строго. PRZESTAJ- берёт настоящее время и действительное причастие: PRZESTAJĘ, PRZESTAJESZ, PRZESTAJE, PRZESTAJĄ, PRZESTAJĄCY, PRZESTAJĄC. PRZESTAW- берёт всё остальное: инфинитив, прошедшее, условное, отглагольное существительное и, что важнее всего, повелительное — PRZESTAWAJ. Семнадцать форм на первой основе, тридцать пять на второй." }
  - { kind: usage, text: "И это настоящее исключение из правила карточки KARMIĆ. Там сказано, что повелительное выводится из третьего лица единственного: KARMI даёт KARM. Здесь третье лицо PRZESTAJE, и правило предсказало бы небывалое PRZESTAJEJ. На деле повелительное идёт от инфинитива: PRZESTAWA- плюс -j даёт PRZESTAWAJ. Исключение не одиночное, а классовое: все глаголы на -AWAĆ ведут себя так — DAWAĆ даёт DAWAJ при DAJE, WSTAWAĆ даёт WSTAWAJ. Карточка KARMIĆ исправлена вместе с выпуском этой." }
  - { kind: usage, text: "Русскому тут радоваться: польское исключение есть русское правило. «Переставать» точно так же теряет -ва- в настоящем времени — «перестаю, перестаёшь, перестаёт, перестают», — и повелительное точно так же идёт от инфинитива: «переставай», а не «перестаюй». То же у «давать»: настоящее «даю», а повелительное «давай». Так что запоминать здесь нечего: достаточно проверить себя русским глаголом того же устройства." }
  - { kind: false-friend, text: "Второе значение в русский не переводится напрямую и потому опасно. PRZESTAWAĆ Z KIMŚ значит не «переставать с кем-то», а «общаться, водиться с кем-то»: PRZESTAWAŁ Z ARTYSTAMI — «он водился с художниками». Отсюда и пословица KTO Z KIM PRZESTAJE, TAKIM SIĘ STAJE, в точности русская «с кем поведёшься, от того и наберёшься». Различать просто по управлению: с инфинитивом — «переставать» (PRZESTAJE PADAĆ), с предлогом Z и творительным — «общаться» (PRZESTAJE Z NIMI)." }
  - { kind: government, text: "В первом значении берёт инфинитив: PRZESTAŃ MÓWIĆ, PRZESTAJE PADAĆ, PRZESTAWAŁ PALIĆ. Винительного дополнения не берёт никогда, и именно поэтому одиннадцать страдательных причастий из таблицы в карточке пропущены: страдательному залогу нужно дополнение в винительном, чтобы сделать его подлежащим, а у этого глагола его нет. Безличное PRZESTAWANO при этом возможно. Совершенная пара PRZESTAĆ, и в обиходе резкое PRZESTAŃ! значит ровно «перестань!»." }
collocations:
  - { pl: "przestawać padać", ru: "переставать идти (о дожде)" }
  - { pl: "przestawać pracować", ru: "переставать работать" }
  - { pl: "przestawać z kimś", ru: "общаться с кем-либо" }
family:
  - { pl: "przestać", ru: "перестать", relation: aspect, id: przestac }
  - { pl: "stawać", ru: "становиться, вставать", relation: root, id: stawac }
  - { pl: "zostawać", ru: "оставаться", relation: root, id: zostawac }
etymology: "Приставка prze- и STAWAĆ, от праславянского *stati «стать, встать» — того же корня, что русские «стать», «ставать», «вставать». Польское PRZESTAWAĆ и русское «переставать» собраны из одних и тех же частей в одном и том же порядке, включая двойственность основы. Значение «общаться» выросло из «стоять рядом, бывать вместе» и в русском этой ветки не дало, хотя «обстоять» и «состоять» того же гнезда."
memory: "Две основы: przestaj- в настоящем, przestaw- во всём прочем, включая повелительное PRZESTAWAJ. Как русское «перестаю» при «переставай». А przestawać z kimś — это «водиться с кем-то»."
idioms:
  - { pl: "kto z kim przestaje, takim się staje", ru: "с кем поведёшься, от того и наберёшься" }
  - { pl: "przestań!", ru: "перестань!, прекрати!" }
