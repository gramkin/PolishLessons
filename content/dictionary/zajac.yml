# review
id: zajac
format: 2
lemma: "zająć"
rank: 181
pos: verb
aspect: perf
pron: { cyr: "за́йонць" }
senses:
  - id: occupy
    ru: "занять (место, время)"
    examples:
      - pl: "Jak długo to zajmie?"
        ru: "Сколько времени это займёт?"
        source: { kind: tatoeba, id: 579550 }
      - pl: "To zajmie pięć minut."
        ru: "Это займёт пять минут."
        source: { kind: authored }
      - pl: "Zajął pierwsze miejsce."
        ru: "Он занял первое место."
        source: { kind: authored }
  - id: take-up
    ru: "zająć się czymś — заняться чем-либо"
    note: "Управление как в русском: zająć się + творительный падеж."
    examples:
      - pl: "Zajmij się tym."
        ru: "Занимайся."
        source: { kind: tatoeba, id: 11617632 }
      - pl: "Zajmę się obiadem."
        ru: "Я займусь обедом."
        source: { kind: authored }
      - pl: "Zajmij się swoimi sprawami."
        ru: "Занимайся своими делами."
        source: { kind: authored }
  - id: busy
    ru: "zajęty — занятый, занят"
    examples:
      - pl: "Czy jesteś zajęty?"
        ru: "Ты занят?"
        source: { kind: tatoeba, id: 531002 }
      - pl: "Jestem bardzo zajęty."
        ru: "Я очень занят."
        source: { kind: tatoeba, id: 529679 }
      - pl: "Tom jest zbyt zajęty."
        ru: "Том слишком занят."
        source: { kind: tatoeba, id: 4491102 }
notes:
  - { kind: government, text: "zająć się czymś — с творительным падежом, как русское «заняться чем-то»: Zajmę się tym «Я этим займусь»." }
  - { kind: usage, text: "Причастие zajęty значит «занят» и о человеке, и о месте: Jestem zajęty «Я занят», Zajęte! «Занято!»." }
  - { kind: usage, text: "Несовершенный вид — zajmować: Zajmuję się tym od lat «Занимаюсь этим годами»." }
collocations:
  - { pl: "zająć miejsce", ru: "занять место" }
  - { pl: "zająć się czymś", ru: "заняться чем-то" }
  - { pl: "zajęty", ru: "занят" }
  - { pl: "zająć pierwsze miejsce", ru: "занять первое место" }
etymology: "Приставка za- + jąć «взять» (праславянское *jęti); то же строение, что у русского «занять» (за + ять)."
memory: "zająć miejsce — «занять место», zająć się czymś — «заняться чем-то», с творительным, как в русском. А Zajęte! значит «Занято!»."
idioms:
  - { pl: "zająć pierwsze miejsce", ru: "занять первое место" }
  - { pl: "zajęte!", ru: "занято!" }
  - { pl: "zająć się sobą", ru: "заняться собой" }
