notes:
  - { kind: usage, text: "Это существительное МУЖСКОГО рода, но склоняется в единственном числе по женскому образцу: kłamca, kłamcy, kłamcę, kłamcą. При этом согласование мужское: ten kłamca, patologiczny kłamca. Тот же класс — sprzedawca «продавец», kierowca «водитель», mężczyzna «мужчина»." }
  - { kind: false-friend, text: "Родственника в русском у корня kłam- нет: русское «лжец» идёт от «лгать», совсем другого корня. Зато суффикс -ca узнаваем по функции — он образует имя исполнителя, как русские -ец и -тель: sprzedawca «продавец», wykonawca «исполнитель», kłamca «лжец»." }
  - { kind: government, text: "Сказуемое с этим словом ставится в ТВОРИТЕЛЬНОМ падеже: być kłamcą «быть лжецом», nazwać kogoś kłamcą «назвать кого-л. лжецом», okazał się kłamcą «оказался лжецом». Это общее правило польского для «быть кем-л.»." }
collocations:
  - { pl: "patologiczny kłamca", ru: "патологический лжец" }
  - { pl: "nazwać kogoś kłamcą", ru: "назвать кого-л. лжецом" }
  - { pl: "być kłamcą", ru: "быть лжецом" }
family:
  - { pl: "kłamać", ru: "лгать, врать", relation: root, id: klamac }
  - { pl: "kłamstwo", ru: "ложь", relation: derived, id: klamstwo }
  - { pl: "kłamliwy", ru: "лживый", relation: derived }
etymology: "От kłamać «лгать» с суффиксом исполнителя -ca, как в sprzedawca «продавец» и wykonawca «исполнитель». Корень kłam- западнославянский (ср. чешское klamat): надёжного русского родственника у него нет, русское «лжец» идёт от «лгать». Из того же гнезда kłamstwo «ложь» и kłamliwy «лживый»."
memory: "kłamca — «лжец», от kłamać «лгать» плюс суффикс -ca, как в sprzedawca. Главная неожиданность — склонение: слово мужское, но в единственном числе склоняется по женскому образцу (kłamcy, kłamcę, kłamcą)."
idioms:
  - { pl: "patologiczny kłamca", ru: "патологический лжец" }
  - { pl: "kłamca i oszust", ru: "лжец и мошенник" }
