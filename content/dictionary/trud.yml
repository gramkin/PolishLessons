# review
id: trud
format: 2
lemma: "trud"
rank: 3270
pos: noun
pron: { cyr: "трут" }
senses:
  - id: effort
    ru: "труд, усилие"
    examples:
      - pl: "Dziękuję za trud."
        ru: "Спасибо за труд."
        source: { kind: translated, id: 7783260 }
      - pl: "Cały trud poszedł na marne."
        ru: "Весь труд пропал даром."
        source: { kind: translated, id: 951338 }
      - pl: "Każdy trud zasługuje na nagrodę."
        ru: "Всякий труд заслуживает награды."
        source: { kind: translated, id: 12351058 }
  - id: with-difficulty
    ru: "трудность (в оборотах z trudem, bez trudu)"
    examples:
      - pl: "Zwycięstwo przyszło nam z wielkim trudem."
        ru: "Победа далась нам с большим трудом."
        source: { kind: tatoeba, id: 3459003 }
      - pl: "Rozwiązałem ten problem bez trudu."
        ru: "Для меня не составило труда решить эту проблему."
        source: { kind: tatoeba, id: 933157 }
notes:
  - { kind: government, text: "Два оборота наизусть: z trudem «с трудом», с творительным, и bez trudu «без труда», с родительным. Оба совпадают с русскими дословно." }
  - { kind: false-friend, text: "Прямая родня русскому «труд», но значения разошлись: польское trud — это усилие и тягота, а «труд» как работа — praca. Nie ma za co trudu не скажут; спасибо за работу — dziękuję za pracę." }
  - { kind: usage, text: "Zadać sobie trud «взять на себя труд» — вежливый оборот: Zadał sobie trud, żeby przyjść." }
  - { kind: usage, text: "Мужской неодушевлённый; родительный — trudu. Прилагательное trudny «трудный» и наречие trudno уже есть в словаре." }
collocations:
  - { pl: "z trudem", ru: "с трудом" }
  - { pl: "bez trudu", ru: "без труда" }
  - { pl: "zadać sobie trud", ru: "взять на себя труд" }
etymology: "Праславянское *trudъ; русское «труд» — то же слово, но в польском оно осталось при значении «усилие, тягота»."
memory: "trud — «труд» в смысле усилия, а работа — praca. Два оборота: z trudem «с трудом» (творительный) и bez trudu «без труда» (родительный)."
idioms:
  - { pl: "z trudem", ru: "с трудом" }
  - { pl: "bez trudu", ru: "без труда" }
  - { pl: "zadać sobie trud", ru: "взять на себя труд" }
formExamplesSkip:
  - { form: "trudzie", cell: "Звательный", reason: "звательный падеж: для неодушевлённого существительного он практически не употребляется" }
