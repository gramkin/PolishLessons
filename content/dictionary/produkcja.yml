etymology: "Из латинского PRODUCTIO «выведение вперёд, произведение», от PRODUCERE — приставка PRO- «вперёд» и DUCERE «вести». Буквально производить значит выводить наружу, и русское «производить» собрано точно так же, из «про-» и «водить». Два языка перевели латинское слово по частям, каждый своими, и получили одно значение. Суффикс -CJA отвечает латинскому -TIO и русскому «-ция» без исключений: PRODUKCJA, OPERACJA, STACJA, SYTUACJA. Старая форма родительного множественного PRODUKCYJ сохраняет тот вид, какой был у всего класса до двадцатого века."
memory: "Класс на -CJA: родительный и предложный — PRODUKCJI, с c и i, против русской «продукции» с одним и. Читается «проду́кцья», -cja как «цья». Два значения: производство и фильм или постановка. Архаический родительный множественного — produkcyj, как biblij и strategij."
idioms:
