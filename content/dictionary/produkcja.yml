notes:
  - { kind: pronunciation, text: "Читается «проду́кцья», с ударением на предпоследнем слоге. Окончание -CJA произносится «цья», одним слогом: не «про-дук-ци-я», а «про-ду́к-цья». Это тот же класс, что BIBLIA и STRATEGIA, только с c перед j. Родительный и предложный падежи единственного числа — PRODUKCJI, и там на письме два знака, c и i: русское «продукции» имеет одно и, и это самая частая ошибка." }
  - { kind: usage, text: "Два значения различает область. В промышленности это процесс и его результат: PRODUKCJA SAMOCHODÓW, WSTRZYMAĆ PRODUKCJĘ, PRODUKCJA ROCZNA. В культуре это снятый фильм или поставленный спектакль: PRODUKCJA AMERYKAŃSKA, NOWE PRODUKCJE. Второе значение даёт множественное число свободно, первое почти всегда стоит в единственном. Для товара как такового есть отдельное слово WYRÓB, а для продукции в смысле ассортимента — ASORTYMENT." }
  - { kind: government, text: "Чего производство — родительный падеж без предлога: PRODUKCJA SAMOCHODÓW, PRODUKCJA ENERGII. Где — предлог W с предложным: W PRODUKCJI, PRACOWAĆ W PRODUKCJI. На сколько изменилась — предлог O с винительным: ZWIĘKSZYĆ PRODUKCJĘ O TRZYDZIEŚCI PROCENT, и этот оборот с O совпадает с русским «увеличить на тридцать процентов», хотя предлоги разные: польское O против русского «на»." }
  - { kind: false-friend, text: "Значения совпадают, но стоит заметить архаическую форму родительного множественного, которая ещё держится в черновиках и старых текстах: PRODUKCYJ рядом с нынешним PRODUKCJI. Это тот же след, что BIBLIJ у BIBLIA и STRATEGIJ у STRATEGIA: раньше все слова на -CJA и -IA образовывали родительный множественного на -IJ или -YJ. В современном языке выбирайте PRODUKCJI, а PRODUKCYJ узнавайте при чтении старых документов." }
