    ru: "свёрток (о запелёнатом младенце)"
    examples:
      - pl: "Trzymała zawiniątko z niemowlęciem."
        ru: "Она держала свёрток с младенцем."
        source: { kind: authored }
      - pl: "Zostawili zawiniątko pod drzwiami."
        ru: "Они оставили свёрток под дверью."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Уменьшительное, всегда с оттенком чего-то небольшого и наскоро связанного: узелок странника, свёрток с пожитками." }
  - { kind: false-friend, text: "От zawinąć «завернуть», корень winąć «вить». Русский «узелок» назван по узлу, польский — по завёртыванию." }
  - { kind: government, text: "Средний род: to zawiniątko, tego zawiniątka." }
  - { kind: usage, text: "В корпусе слово не встречается, поэтому все примеры составлены вручную. Нейтральное «свёрток» — paczka или zawinięcie." }
collocations:
  - { pl: "nieść zawiniątko", ru: "нести узелок" }
etymology: "От zawinąć «завернуть», корень winąć «вить». Русский «узелок» — от узла, польское слово — от завёртывания."
memory: "zawiniątko — «узелок, свёрток», уменьшительное от zawinąć «завернуть». Оттенок — что-то небольшое, связанное наскоро."
idioms:
  - { pl: "nieść zawiniątko", ru: "нести узелок" }
