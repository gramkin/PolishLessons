# review
id: niezle
format: 2
lemma: "nieźle"
rank: 576
pos: adv
pron: { cyr: "не́зле" }
senses:
  - id: not-bad
    ru: "неплохо, недурно"
    note: "Оценка чуть выше нейтральной."
    examples:
      - pl: "Nieźle."
        ru: "Неплохо."
        source: { kind: tatoeba, id: 705258 }
      - pl: "Nieźle zarabia."
        ru: "Он неплохо зарабатывает."
        source: { kind: translated, id: 674640 }
      - pl: "Nieźle wyglądasz."
        ru: "Ты неплохо выглядишь."
        source: { kind: translated, id: 3011980 }
  - id: wow
    ru: "ничего себе! (как восклицание)"
    note: "Nieźle…! — реакция на что-то впечатляющее."
    examples:
      - pl: "Nieźle...!"
        ru: "Ничего себе!"
        source: { kind: tatoeba, id: 349165 }
      - pl: "Nieźle! Nie spodziewałem się tego."
        ru: "Ничего себе! Я этого не ожидал."
        source: { kind: authored }
      - pl: "Nieźle sobie radzisz."
        ru: "Ты неплохо справляешься."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Собрано из nie + źle «плохо» — буквально «не плохо», ровно как русское «неплохо»." }
  - { kind: usage, text: "Как восклицание Nieźle! значит «Ничего себе!» и выражает приятное удивление." }
  - { kind: usage, text: "Степени берутся от dobrze: nieźle — lepiej — najlepiej; своей сравнительной у слова нет." }
  - { kind: usage, text: "Прилагательное — niezły «неплохой»: niezły film «неплохой фильм»." }
collocations:
  - { pl: "nieźle wygląda", ru: "неплохо выглядит" }
  - { pl: "nieźle zarabia", ru: "неплохо зарабатывает" }
  - { pl: "nieźle sobie radzi", ru: "неплохо справляется" }
  - { pl: "Nieźle!", ru: "Ничего себе!" }
family:
  - { pl: "źle", ru: "плохо", relation: root }
  - { pl: "niezły", ru: "неплохой", relation: derived }
  - { pl: "dobrze", ru: "хорошо", relation: derived }
etymology: "Из nie + źle «плохо» — буквально «не плохо», ровно как русское «неплохо» собрано из «не» и «плохо»."
memory: "nieźle — «неплохо», и устроено оно как русское: nie + źle. Оценка при этом чуть выше нейтральной: nieźle zarabia «неплохо зарабатывает». А отдельным возгласом Nieźle! значит «Ничего себе!». Своей сравнительной степени у слова нет — берут от dobrze: lepiej, najlepiej. Прилагательное — niezły «неплохой»."
idioms:
