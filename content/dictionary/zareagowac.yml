etymology: "От REAGOWAĆ, из латинского RE- «обратно, в ответ» и AGERE «действовать, вести» — то есть буквально «действовать в ответ». Слово пришло в польский через немецкое REAGIEREN в девятнадцатом веке, вместе с языком химии и физики, и оттуда разошлось на человеческое поведение. Русский «реагировать» взят тем же путём и в то же время, поэтому значения совпадают целиком. Корень AGERE знаком по целому ряду: AKCJA и «акция», AGENT и «агент», REAKCJA и «реакция», AKTYWNY и «активный» — всюду действие. Приставка ZA- добавляет завершённость однократного поступка, и получается совершенный вид к несовершенному REAGOWAĆ, ровно как русское «отреагировать» к «реагировать»."
memory: "Сорок две формы, и это базовое число для польского глагола: страдательного причастия нет, потому что глагол непереходный — реагируют на что-то, с предлогом na и винительным, прямого дополнения не бывает. Прибавьте одиннадцать форм за переходность и десять за несовершенный вид, и получите остальные размеры: patrzyć 52, spłacić 53, wkładać 63. Будущее на -uj-: zareaguję, а не zareagowam, как у zaryzykować. Из латинского re- плюс agere «действовать в ответ»."
