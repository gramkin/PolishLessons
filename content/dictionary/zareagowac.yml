notes:
  - { kind: government, text: "На что реагируют — предлог NA с винительным: ZAREAGOWAĆ NA ALARM, ZAREAGOWAĆ NA LIST. Это совпадает с русским «отреагировать на что-то», тоже с винительным. Прямого дополнения у глагола нет вовсе, и отсюда главная особенность его таблицы: страдательного причастия не существует — нет формы ZAREAGOWANY, — потому что раз нет винительного без предлога, то и нечего делать подлежащим. Поэтому форм у глагола сорок две, а не пятьдесят три. Совершенный вид, несовершенный — REAGOWAĆ. Как кто реагирует — наречие или предлог Z с творительным: ZAREAGOWAĆ Z OPÓŹNIENIEM «отреагировать с опозданием»." }
  - { kind: false-friend, text: "Значение совпадает с русским «отреагировать», и ловушка не в смысле, а в двух местах формы. Первое: будущее время строится на -UJ-, а не на -OWA-. ZAREAGUJĘ, ZAREAGUJESZ, ZAREAGUJE — формы ZAREAGOWAM не существует, и это тот же класс, что ZARYZYKOWAĆ и PRACOWAĆ. Русский делает то же со своими глаголами на -овать: «реагировать — реагирую». Второе: русскоговорящий ожидает страдательное причастие, потому что в русском есть «отреагированный»? Такого слова в русском тоже нет, и это как раз помогает: оба языка отказывают этому глаголу в страдательной форме по одной причине — он непереходный." }
  - { kind: pronunciation, text: "Читается «зареаго́ваць», ударение на предпоследнем слоге из пяти. Сочетание EA в середине не стягивается: гласные произносятся раздельно, «ре-а», и это для русского самое трудное место, потому что русское «реагировать» звучит так же, но пишется иначе. Конечное -Ć мягкое, «ць». В будущем ZAREAGUJĘ пять слогов, ударение на предпоследнем: «зареагу́е», и конечное -Ę на конце слова теряет носовой призвук. В деепричастии ZAREAGOWAWSZY сочетание WSZ оглушается в «фш»." }
  - { kind: usage, text: "Частотные сочетания: ZAREAGOWAĆ NATYCHMIAST «отреагировать немедленно», ZAREAGOWAĆ NA ALARM, ZAREAGOWAĆ Z OPÓŹNIENIEM, NIE ZAREAGOWAĆ WCALE «не отреагировать вовсе». Существительное REAKCJA «реакция» принадлежит к классу на -CJA и ведёт себя как DEPRESJA: REAKCJI на три падежа единственного. Несовершенный REAGOWAĆ описывает общее свойство или повторяющееся действие: REAGUJE NA KAŻDY HAŁAS «он реагирует на каждый шум», тогда как ZAREAGOWAĆ это один поступок в ответ на одно событие." }
