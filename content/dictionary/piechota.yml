  - id: on-foot
    ru: "пешком (PIECHOTĄ)"
    examples:
      - pl: "Do szkoły chodzę piechotą."
        ru: "В школу я хожу пешком."
        source: { kind: authored }
      - pl: "Autobus nie przyjechał, więc poszliśmy piechotą."
        ru: "Автобус не пришёл, так что мы пошли пешком."
