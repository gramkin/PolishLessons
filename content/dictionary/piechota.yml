notes:
  - { kind: false-friend, text: "PIECHOTA — «пехота», но творительный PIECHOTĄ — это обычное «пешком»: IŚĆ PIECHOTĄ, «идти пешком». В разговоре говорят и NA PIECHOTĘ. Нейтральный синоним — PIESZO." }
  - { kind: usage, text: "Девять живых форм, женский род. В местном падеже T переходит в C: W PIECHOCIE. Форма PIECHOTĄ работает как наречие. Звательный не даётся." }
  - { kind: government, text: "Служить в пехоте — SŁUŻYĆ W PIECHOCIE, местный. Пешком — PIECHOTĄ, творительный без предлога, или NA PIECHOTĘ." }
  - { kind: pronunciation, text: "Читается «пехо́та», ударение на предпоследнем слоге. PIE — «пе», CH — «х»." }
collocations:
  - { pl: "iść piechotą", ru: "идти пешком" }
  - { pl: "piechota morska", ru: "морская пехота" }
  - { pl: "na piechotę", ru: "пешком (разг.)" }
family:
  - { pl: "pieszy", ru: "пеший; пешеход", relation: root }
  - { pl: "pieszo", ru: "пешком", relation: root }
  - { pl: "piechur", ru: "пехотинец; ходок", relation: derived }
etymology: "От PIESZY «пеший»; русская «пехота» — того же корня. Творительный PIECHOTĄ, «пехотой», стал наречием «пешком»."
memory: "Piechota — пехота, а piechotą — пешком: iść piechotą. Читается «пехо́та». Pieszo — тоже «пешком». Pieszy — пешеход."
idioms:
  - { pl: "iść na piechotę", ru: "идти пешком" }
formExamplesSkip:
