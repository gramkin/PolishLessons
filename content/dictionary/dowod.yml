# review
id: dowod
format: 2
lemma: "dowód"
rank: 434
pos: noun
pron: { cyr: "до́вут" }
senses:
  - id: proof
    ru: "доказательство, довод"
    examples:
      - pl: "Chcę dowodów."
        ru: "Я хочу доказательств."
        source: { kind: translated, id: 9518759 }
      - pl: "Mam dowody."
        ru: "У меня есть доказательства."
        source: { kind: translated, id: 4735354 }
      - pl: "Porównanie nie jest dowodem."
        ru: "Сравнение не является доказательством."
        source: { kind: translated, id: 4653166 }
  - id: id-card
    ru: "удостоверение личности (dowód osobisty)"
    examples:
      - pl: "Dowód jest?"
        ru: "Документ есть?"
        source: { kind: translated, id: 6305482 }
      - pl: "Pokaż dowód osobisty."
        ru: "Покажи удостоверение личности."
        source: { kind: authored }
      - pl: "Zgubiłem dowód."
        ru: "Я потерял удостоверение."
        source: { kind: authored }
notes:
  - { kind: usage, text: "dowód osobisty — «удостоверение личности», главный документ поляка. В разговоре его сокращают до dowód: Poproszę dowód «Предъявите документ»." }
  - { kind: usage, text: "Чередование ó/o при склонении: dowód, но dowodu, dowodem, dowodzie — как и в других словах на -ód (powód → powodu)." }
  - { kind: usage, text: "Первое значение — «доказательство, довод»: dowód w sprawie «доказательство по делу», bez dowodów «без доказательств»." }
  - { kind: false-friend, text: "Русское «довод» — то же слово, но поляки расширили его до документа. Услышав Poproszę dowód, не ищите аргументов: у вас просят паспорт." }
collocations:
  - { pl: "dowód osobisty", ru: "удостоверение личности" }
  - { pl: "bez dowodów", ru: "без доказательств" }
  - { pl: "na dowód", ru: "в доказательство" }
  - { pl: "mieć dowody", ru: "иметь доказательства" }
etymology: "Из do- + wód, от wieść «вести»: буквально «то, что доводит до вывода». Русское «довод» — то же самое слово."
memory: "dowód — и «доказательство», и «удостоверение личности». Русское «довод» то же слово, но поляки расширили его до документа: Poproszę dowód значит «Предъявите паспорт». И чередование ó/o: dowód, но dowodu."
idioms:
  - { pl: "dowód osobisty", ru: "удостоверение личности" }
  - { pl: "bez dowodów", ru: "без доказательств" }
  - { pl: "na dowód", ru: "в доказательство" }
formExamplesSkip:
  - { form: "dowodzie", cell: "Звательный", reason: "звательный падеж: для неодушевлённого существительного он практически не употребляется" }
