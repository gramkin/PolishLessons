# review
id: chwila
format: 2
lemma: "chwila"
rank: 161
pos: noun
pron: { cyr: "хви́ля" }
senses:
  - id: moment
    ru: "минута, мгновение, момент"
    examples:
      - pl: "Jedną chwilę"
        ru: "Одну минуту."
        source: { kind: tatoeba, id: 531861 }
      - pl: "Odszedłem na chwilę."
        ru: "Я отошёл ненадолго."
        source: { kind: tatoeba, id: 3476651 }
      - pl: "Można zostać jeszcze chwilę?"
        ru: "Можно остаться тут немножко подольше?"
        source: { kind: tatoeba, id: 350733 }
  - id: in-a-moment
    ru: "момент в устойчивых оборотах (w tej chwili, w każdej chwili)"
    examples:
      - pl: "Mogę zacząć w każdej chwili."
        ru: "Я могу начать в любую минуту."
        source: { kind: tatoeba, id: 3750229 }
      - pl: "Masz chwilę, żeby pogadać?"
        ru: "У тебя есть минутка поговорить?"
        source: { kind: tatoeba, id: 12567470 }
      - pl: "Ciesz się tą chwilą!"
        ru: "Наслаждайся мгновением!"
        source: { kind: tatoeba, id: 937236 }
notes:
  - { kind: usage, text: "za chwilę — «через минуту», w tej chwili — «сейчас, сию минуту», lada chwila — «вот-вот», na chwilę — «ненадолго»." }
  - { kind: usage, text: "chwila и moment взаимозаменимы, но chwila звучит по-польски естественнее." }
collocations:
  - { pl: "za chwilę", ru: "через минуту" }
  - { pl: "w tej chwili", ru: "сейчас" }
  - { pl: "na chwilę", ru: "ненадолго" }
  - { pl: "chwila moment", ru: "минуточку" }
etymology: "Заимствование из средневерхненемецкого hwīle; родственно немецкому Weile и английскому while. В русском соответствия нет — «минута» пришла из латыни."
memory: "chwila — «минутка»: za chwilę «через минуту», w tej chwili «сию минуту», lada chwila «вот-вот», na chwilę «ненадолго»."
idioms:
  - { pl: "w tej chwili", ru: "сию минуту" }
  - { pl: "lada chwila", ru: "вот-вот" }
  - { pl: "w ostatniej chwili", ru: "в последний момент" }
formExamples:
