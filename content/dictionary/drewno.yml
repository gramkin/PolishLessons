notes:
  - { kind: false-friend, text: "Русское «дерево» значит и растение, и материал; польский делит это на два слова, и путать их нельзя. DRZEWO это растущее дерево: WYSOKIE DRZEWO, DRZEWO OWOCOWE. DREWNO это материал: MEBLE Z DREWNA «мебель из дерева», DREWNO NA OPAŁ «дрова». Сказать MEBLE Z DRZEWA будет ошибкой, это прозвучит как «мебель из растения». Русский для материала имеет слово «древесина», и вот оно точно соответствует DREWNO; беда в том, что в живой русской речи вместо «древесины» обычно говорят «дерево», и эта привычка переносится на польский неверно." }
  - { kind: government, text: "Средний род на -O. Именительный и винительный совпадают, как у всех средних: KUPIŁ DREWNO. Родительный на -A: Z DREWNA, BEZ DREWNA. Местный на -IE: W DREWNIE «в дереве». Материал изделия вводится предлогом Z с родительным: STÓŁ Z DREWNA «стол из дерева», и это главная конструкция. Чем топят — творительный без предлога: OPALAĆ DREWNEM. Множественное число употребляется редко и означает отдельные куски или породы; родительный множественного DREWIEN, со вставной гласной перед конечной группой согласных, как OKIEN от OKNO." }
  - { kind: pronunciation, text: "Читается «дрэ́вно», ударение на предпоследнем слоге, то есть на первом из двух. Буква W звучит «в», а не «у»: это не Ł. Буква E в корне даёт чистое «э». В местном падеже DREWNIE буква N смягчается перед -IE: «дрэ́вне». В родительном множественного DREWIEN появляется вставная E, и слово читается «дрэ́вен», ударение по-прежнему на предпоследнем слоге. Сочетание DR в начале без призвука, как в русском «дрова»." }
  - { kind: usage, text: "Сочетания, которые стоит знать целиком: DREWNO NA OPAŁ «дрова», DREWNO OPAŁOWE то же самое официально, DREWNO LITE «массив», DREWNO IGLASTE и DREWNO LIŚCIASTE о хвойных и лиственных породах. Прилагательное DREWNIANY значит «деревянный» и относится к материалу: DREWNIANY DOM. Для дров есть и отдельное старое слово DRWA, только во множественном числе, но в современной речи чаще говорят DREWNO. Производное DREWNIAKI это деревянные башмаки или сабо." }
