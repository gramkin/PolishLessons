etymology: "От праславянского *dervo, того же корня, что русское «дерево» и книжное «древо», а также «древесина» и «деревянный». Польский развёл один корень на два слова с разными суффиксами: DRZEWO сохранило значение растения, а DREWNO с суффиксом -NO закрепилось за материалом — ровно то же распределение, что между русскими «дерево» и «древесина», только в польском оно обязательное, а в русском нет. Польское DRZE- на месте русского ДЕРЕ- это обычное соответствие, как DRZEMAĆ и «дремать», и объясняется разной судьбой древнего сочетания с R между согласными. Отсюда же DREWNIANY «деревянный» и DRWA «дрова», где корень сократился до одного слога."
memory: "Материал, а не растение: drzewo — растущее дерево, drewno — древесина. Meble z drewna «мебель из дерева», но wysokie drzewo «высокое дерево»; meble z drzewa — ошибка. Точное русское соответствие — «древесина», и запоминать надо через неё, потому что привычка говорить по-русски «дерево» о материале сбивает. Родительный множественного drewien со вставной гласной, как okien от okno."
