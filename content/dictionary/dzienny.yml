etymology: "От DZIEŃ «день», от праславянского корня, давшего и русский «день». Корень общий и совершенно прозрачный, а вот производные разошлись. Польское DZIENNIK означает сразу три вещи: дневник, газету и классный журнал, тогда как русский держит для них три разных слова. DZIENNIKARZ от того же корня это «журналист», буквально «газетчик», и к дневнику он отношения не имеет. Так одно общее слово обросло в двух языках разной роднёй."
memory: "Корень тот же, что в русском «дне», но различать надо две пары. Первая: dzienny «дневной» против codzienny «ежедневный, повседневный». Вторая учебная: studia dzienne это очное обучение, studia zaoczne заочное, причём второе слово почти совпало с русским. Главный оборот na porządku dziennym значит не «на повестке», а «в порядке вещей, сплошь и рядом». Читается «дзе́нны», dzi даёт «дзе», а двойное nn произносится долго."
idioms:
  - { pl: "na porządku dziennym", ru: "в порядке вещей, сплошь и рядом" }
