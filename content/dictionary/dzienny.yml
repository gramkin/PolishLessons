notes:
  - { kind: false-friend, text: "Два слова от одного корня, и русский различает их так же, но перепутать легко. DZIENNY это «дневной»: о светлом времени суток и о сутках как мере, ŚWIATŁO DZIENNE, DAWKA DZIENNA. CODZIENNY это «ежедневный, повседневный», о том, что повторяется каждый день: CODZIENNE OBOWIĄZKI «повседневные обязанности». Сказать CODZIENNE ŚWIATŁO вместо ŚWIATŁO DZIENNE значит сказать «ежедневный свет»." }
  - { kind: usage, text: "Одиннадцать форм, относительное прилагательное, степеней сравнения нет. Мужско-личная форма множественного числа DZIENNI живая и обиходная: STUDENCI DZIENNI «студенты очного отделения», DZIENNI PRACOWNICY «работники дневной смены». Отдельно стоит запомнить пару STUDIA DZIENNE и STUDIA ZAOCZNE: русский строит её от «очей», очное и заочное, а поляк от дня, дневное и «за-очное», причём второе слово у них совпало почти буквально." }
  - { kind: government, text: "В порядке вещей — устойчивое NA PORZĄDKU DZIENNYM, предлог NA с местным падежом. При дневном свете — W ŚWIETLE DZIENNYM, предлог W с местным. В дневную смену — NA ZMIANIE DZIENNEJ, снова NA с местным, тогда как русский говорит «в дневную смену», с винительным. Это расхождение стоит отметить: о сменах и дежурствах польский предпочитает NA с местным падежом." }
  - { kind: pronunciation, text: "Читается «дзе́нны», три слога, ударение на первом. Сочетание DZI даёт слитное мягкое «дзь», и перед E получается «дзе»: тот же звук, что в начале GRUDZIEŃ. Двойное NN произносится долго, как в русском «длинный», и это слышно. В женской форме DZIENNA слышно «дзе́нна», в мужско-личной DZIENNI — «дзе́нни», с мягким окончанием." }
  - { kind: register, text: "Слово нейтральное и частое в деловой и учебной речи: PORZĄDEK DZIENNY «повестка дня», LIMIT DZIENNY «дневной лимит», ROZKŁAD DZIENNY «распорядок дня», STUDIA DZIENNE «очное обучение». Оборот NA PORZĄDKU DZIENNYM означает уже не повестку, а «сплошь и рядом, в порядке вещей», и в разговоре слышен чаще прямого значения: TAKIE SPÓŹNIENIA SĄ TU NA PORZĄDKU DZIENNYM." }
