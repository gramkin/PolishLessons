notes:
  - { kind: false-friend, text: "NIEBIOSA — «небеса», только во множественном и только в высоком стиле. Обычное «небо» — NIEBO. Главное выражение: WYCHWALAĆ POD NIEBIOSA — «превозносить до небес»." }
  - { kind: usage, text: "Pluralia tantum, средний род: NIEBIOSA, NIEBIOS, NIEBIOSOM, NIEBIOSAMI, NIEBIOSACH. Формы NIEBIOSÓW, NIEBIOSY и NIEBIESIECH устарели." }
  - { kind: government, text: "Превозносить до небес — WYCHWALAĆ POD NIEBIOSA, POD с винительным. К небесам — KU NIEBIOSOM, дательный. В небесах — W NIEBIOSACH, местный." }
  - { kind: pronunciation, text: "Читается «небьо́са»: BIO — «бьо». Ударение на предпоследнем слоге." }
collocations:
  - { pl: "pod niebiosa", ru: "до небес" }
  - { pl: "ku niebiosom", ru: "к небесам" }
  - { pl: "Królestwo Niebios", ru: "Царство Небесное" }
family:
