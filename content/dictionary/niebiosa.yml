  - { pl: "raj", ru: "рай", relation: root, id: raj }
etymology: "Старое множественное число от NIEBO с основой NIEBIOS-, как в русском «небеса» от «небо». Сохранилось в религиозном и высоком стиле."
memory: "Niebiosa — небеса (высокий стиль). Wychwalać pod niebiosa — превозносить до небес. Обычное небо — niebo. Читается «небьо́са»."
