# review
id: niezaleznie
format: 2
lemma: "niezależnie"
rank: 3476
pos: adv
pron: { cyr: "незале́жне" }
senses:
  - id: independently
    ru: "независимо, самостоятельно"
    examples:
      - pl: "Dwaj naukowcy niezależnie doszli do tego samego wniosku."
        ru: "Два учёных независимо друг от друга пришли к одному выводу."
        source: { kind: authored }
      - pl: "Każdy moduł działa niezależnie."
        ru: "Каждый модуль работает самостоятельно."
        source: { kind: authored }
      - pl: "Od lat żyje niezależnie od rodziców."
        ru: "Он много лет живёт отдельно от родителей."
        source: { kind: authored }
  - id: regardless
    ru: "независимо от, вне зависимости (NIEZALEŻNIE OD)"
    examples:
      - pl: "Niezależnie od tego, co powiesz, pojadę."
        ru: "Что бы ты ни сказал, я поеду."
        source: { kind: authored }
      - pl: "Bilet kosztuje tyle samo niezależnie od wieku."
        ru: "Билет стоит одинаково независимо от возраста."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "NIEZALEŻNIE — «независимо», но образ другой: польское ZALEŻEĆ, «зависеть», буквально «залегать за кем-то», от LEŻEĆ «лежать», а русское «зависеть» — от «висеть». Осторожно с ZALEŻY MI: это не «зависит от меня», а «мне важно»." }
  - { kind: usage, text: "Наречие, одна форма. Два значения: «самостоятельно» и «невзирая на» с OD. Прилагательное — NIEZALEŻNY: NIEZALEŻNA PRASA. Существительное — NIEZALEŻNOŚĆ, а польский День независимости — ŚWIĘTO NIEPODLEGŁOŚCI, от другого корня." }
  - { kind: government, text: "Независимо от чего — NIEZALEŻNIE OD с родительным, как в русском: NIEZALEŻNIE OD POGODY. Перед придаточным нужно TEGO: NIEZALEŻNIE OD TEGO, CZY PRZYJDZIE, «независимо от того, придёт ли он»." }
  - { kind: pronunciation, text: "Читается «незале́жне», ударение на предпоследнем слоге. Ż — «ж», ŻNIE — «жне», как в ZALEŻEĆ «зале́жэць»." }
collocations:
  - { pl: "niezależnie od pogody", ru: "в любую погоду" }
  - { pl: "niezależnie od wieku", ru: "независимо от возраста" }
  - { pl: "działać niezależnie", ru: "действовать самостоятельно" }
family:
  - { pl: "niezależny", ru: "независимый", relation: root }
  - { pl: "zależeć", ru: "зависеть; быть важным", relation: root, id: zalezec }
  - { pl: "niezależność", ru: "независимость", relation: root }
etymology: "NIE + ZALEŻNIE, от ZALEŻEĆ «зависеть», а то — от LEŻEĆ «лежать»: зависимое лежит «за» чем-то. Русское «зависеть» построено от «висеть», но приставка та же."
memory: "Niezależnie — независимо; niezależnie od pogody — в любую погоду. Читается «незале́жне». Zależeć — зависеть, от leżeć «лежать». To zależy — смотря как."
idioms:
  - { pl: "to zależy", ru: "смотря как, это зависит" }
formExamples:
  - form: "niezależnie"
    pl: "Niezależnie od wyniku jestem z ciebie dumny."
    ru: "Независимо от результата я тобой горжусь."
    source: { kind: authored }
  - form: "niezależnie"
    pl: "Pracuje niezależnie od reszty zespołu."
    ru: "Он работает отдельно от остальной команды."
    source: { kind: authored }
  - form: "niezależnie"
    pl: "Codziennie biega niezależnie od pogody."
    ru: "Он бегает каждый день в любую погоду."
    source: { kind: authored }
