# review
id: stad
format: 2
lemma: "stąd"
rank: 224
pos: adv
pron: { cyr: "стонт" }
senses:
  - id: from-here
    ru: "отсюда (из этого места)"
    examples:
      - pl: "Spadaj stąd!"
        ru: "Проваливай отсюда!"
        source: { kind: tatoeba, id: 5909111 }
      - pl: "Zabierz mnie stąd."
        ru: "Забери меня отсюда."
        source: { kind: tatoeba, id: 3460273 }
      - pl: "Idź stąd, nikt cię tu nie lubi."
        ru: "Уходи отсюда, ты никому здесь не нравишься."
        source: { kind: tatoeba, id: 13786887 }
      - pl: "Zacznij stąd."
        ru: "Начни отсюда."
        source: { kind: tatoeba, id: 6313997 }
      - pl: "Niewygodnie mi stąd jeździć do pracy."
        ru: "Мне отсюда неудобно ездить на работу."
        source: { kind: authored }
      - pl: "Maria i Tom wzięli ślub w kościele niedaleko stąd."
        ru: "Мэри и Том поженились в церкви недалеко отсюда."
        source: { kind: tatoeba, id: 3679915 }
  - id: hence
    ru: "отсюда (о причине или выводе); поэтому"
    examples:
      - pl: "Nikt nie odbiera telefonu. Stąd wniosek, że nikogo nie ma w domu."
        ru: "Никто не берёт трубку. Отсюда вывод, что дома никого нет."
        source: { kind: authored }
      - pl: "Ceny wzrosły o połowę, stąd tak mało klientów."
        ru: "Цены выросли наполовину, отсюда так мало покупателей."
        source: { kind: authored }
      - pl: "Mieszkał długo w Rosji, stąd jego dobry rosyjski."
        ru: "Он долго жил в России, отсюда его хороший русский."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Тройка наречий места: skąd «откуда» — stąd «отсюда» — stamtąd «оттуда»." }
  - { kind: usage, text: "stąd может вводить вывод: Stąd wniosek, że się mylimy «Отсюда вывод, что мы ошибаемся»." }
collocations:
  - { pl: "daleko stąd", ru: "далеко отсюда" }
  - { pl: "niedaleko stąd", ru: "недалеко отсюда" }
  - { pl: "wynoś się stąd", ru: "убирайся отсюда" }
  - { pl: "stąd wniosek", ru: "отсюда вывод" }
etymology: "Из s + tąd «этим путём»; тот же ряд, что skąd «откуда» и stamtąd «оттуда»."
memory: "Запомните тройку: skąd «откуда», stąd «отсюда», stamtąd «оттуда». И stąd умеет вводить вывод: Stąd wniosek…"
idioms:
  - { pl: "ani stąd, ani zowąd", ru: "ни с того ни с сего" }
  - { pl: "daleko stąd", ru: "далеко отсюда" }
  - { pl: "wynoś się stąd", ru: "убирайся отсюда" }
formExamples:
  - form: "stąd"
    pl: "Daleko stąd do dworca?"
    ru: "Далеко отсюда до вокзала?"
    source: { kind: authored }
  - form: "stąd"
    pl: "Wynoś się stąd!"
    ru: "Убирайся отсюда!"
    source: { kind: authored }
  - form: "stąd"
    pl: "Stąd wniosek, że się mylimy."
    ru: "Отсюда вывод, что мы ошибаемся."
    source: { kind: authored }
