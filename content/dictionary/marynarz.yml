pos: noun
pron: { cyr: "мары́наш" }
senses:
  - id: sailor
    ru: "моряк, матрос"
    examples:
      - pl: "Marynarz zawiązał linę."
        ru: "Матрос завязал канат."
        source: { kind: authored }
      - pl: "Jej mąż jest marynarzem."
        ru: "Её муж — моряк."
        source: { kind: authored }
      - pl: "Marynarze wrócili z rejsu."
        ru: "Моряки вернулись из рейса."
        source: { kind: authored }
      - pl: "Marynarz spędza miesiące na morzu."
        ru: "Моряк проводит месяцы в море."
        source: { kind: authored }
      - pl: "Statek potrzebuje doświadczonych marynarzy."
        ru: "Кораблю нужны опытные моряки."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "MARYNARZ — «моряк, матрос». Главная ловушка — родственное MARYNARKA: это «пиджак», а ещё «флот»: MARYNARKA WOJENNA — «военно-морской флот». Купить MARYNARKĘ — купить пиджак, а не тельняшку." }
  - { kind: usage, text: "Одиннадцать форм, мужской род, лицо. Именительный множественного — MARYNARZE, как LEKARZE. В родительном множественного две формы: MARYNARZY и MARYNARZÓW." }
  - { kind: government, text: "Стать моряком — ZOSTAĆ MARYNARZEM, творительный. Ходить в море матросом — PŁYWAĆ JAKO MARYNARZ. Морской волк — STARY WILK MORSKI." }
  - { kind: pronunciation, text: "Читается «мары́наш», ударение на предпоследнем слоге. Y — «ы», конечное RZ оглушается в «ш». В форме MARYNARZE: «марына́жэ»." }
collocations:
  - { pl: "marynarz handlowy", ru: "моряк торгового флота" }
  - { pl: "mundur marynarza", ru: "матросская форма" }
  - { pl: "zostać marynarzem", ru: "стать моряком" }
family:
  - { pl: "marynarka", ru: "пиджак; флот", relation: root, id: marynarka }
  - { pl: "marynarski", ru: "матросский, морской", relation: derived }
  - { pl: "marynarka wojenna", ru: "военно-морской флот", relation: root }
etymology: "Из латинского слова со значением «морской», от слова «море». Отсюда родство с польским MORZE и русским «море». Пиджак MARYNARKA назван по морской форменной куртке."
memory: "Marynarz — моряк, матрос; marynarka — пиджак и флот. Читается «мары́наш». Marynarze — моряки. Stary wilk morski — морской волк."
idioms:
  - { pl: "stary wilk morski", ru: "морской волк" }
