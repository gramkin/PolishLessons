notes:
  - { kind: usage, text: "Всё гнездо этого слова переносится на русский часть в часть, и знать это выгоднее, чем заучивать слова по одному. Приставка PRZE- отвечает русской «пре-», а корень STĄP- и STĘP- отвечает русскому «ступ-». Отсюда: PRZESTĄPIĆ и «преступить», PRZESTĘPSTWO и «преступление», PRZESTĘPCA и «преступник», PRZESTĘPCZY и «преступный», PRZESTĘPCZOŚĆ и «преступность». Образ у обоих языков один и тот же: переступить черту. Тот же корень уже встречался в POSTĘPOWAĆ «поступать» и WYSTĄPIĆ «выступить»." }
  - { kind: government, text: "Борьба с преступностью — WALKA Z PRZESTĘPCZOŚCIĄ, предлог Z с творительным, ровно как по-русски. Преступность где — предлог W с местным падежом: PRZESTĘPCZOŚĆ W MIEŚCIE. Рост чего — родительный без предлога: WZROST PRZESTĘPCZOŚCI. Глагол PRZESTĄPIĆ управляет винительным: PRZESTĄPIĆ PRÓG «переступить порог», а в переносном смысле берёт предлог: PRZESTĄPIĆ Z NOGI NA NOGĘ «переступить с ноги на ногу»." }
  - { kind: pronunciation, text: "Читается «пшесте́мпчосьчь», три слога, ударение на втором. Сочетание PRZ даёт «пш», как всегда в польском. Носовая Ę перед P звучит как «эм», а не «эн», потому что следующий звук губной, поэтому слышно «темп». Дальше CZ даёт твёрдое «ч», а конец, -ŚĆ, это два мягких звука подряд, «сьчь». В слове PRZESTĘPCA слышно «пшесте́мпца»." }
  - { kind: false-friend, text: "Поправка касается соседнего слова и календаря. PRZESTĘPNY значит «переступающий» и живёт в одном устойчивом выражении: ROK PRZESTĘPNY — «високосный год», то есть год, переступающий обычную меру. С преступностью это слово не связано вовсе, хотя корень тот же. Русское «високосный» пришло из греческого через латынь и никакого отношения к «преступлению» не имеет, так что польская пара здесь прозрачнее русской." }
  - { kind: register, text: "Слово официальное: статистика, полицейские отчёты, газеты, криминология. Частые обороты: PRZESTĘPCZOŚĆ ZORGANIZOWANA «организованная преступность», WALKA Z PRZESTĘPCZOŚCIĄ «борьба с преступностью», WZROST PRZESTĘPCZOŚCI «рост преступности», PRZESTĘPCZOŚĆ NIELETNICH «преступность несовершеннолетних». В разговоре вместо отвлечённого слова скажут конкретнее: DUŻO SIĘ TU KRADNIE «здесь много воруют»." }
