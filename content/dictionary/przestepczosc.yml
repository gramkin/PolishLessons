etymology: "Сложено из приставки PRZE- и корня STĘP-, от праславянского *stǫpiti «ступить», и русское «преступность» собрано из тех же частей: пре + ступ + ность. Совпадение полное, вплоть до образа: преступник — тот, кто переступил черту, границу дозволенного. Соответствия здесь регулярны и работают на целом разряде слов: польское PRZE- отвечает русскому «пре-» и «пере-», а чередование Ą и Ę в корне отвечает русскому «у» и «е»: PRZESTĄPIĆ при PRZESTĘPSTWO, как «преступить» при «преступление». Из того же гнезда POSTĘP «прогресс» и USTĘPSTWO «уступка»."
memory: "Всё гнездо переносится часть в часть: prze- это «пре-», stęp- это «ступ-», отсюда przestąpić «преступить», przestępstwo «преступление», przestępca «преступник», przestępczość «преступность». Образ общий: переступить черту. Тот же корень в postępować «поступать». Управление совпадает: walka Z przestępczością творительным. Читается «пшесте́мпчосьчь», где prz это «пш», а ę перед p даёт «эм». И не путать с przestępny: rok przestępny это «високосный год»."
