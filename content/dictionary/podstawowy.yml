etymology: "От PODSTAWA «основа», а та от PODSTAWIĆ — приставка pod- и STAWIĆ «ставить», из праславянского *staviti, того же корня, что русское «ставить». Основа понята буквально как подставленное снизу, то, на чём стоит остальное. Русский от этого же корня произвёл «подставку» и «подстановку», но для основы взял другое слово, так что прозрачность здесь обманчива: части знакомы, а смысл сложился иначе."
memory: "Szkoła podstawowa — начальная школа, разговорно podstawówka. Одиннадцать форм, степеней нет; мужское личное множественное podstawowi."
