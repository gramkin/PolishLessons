notes:
  - { kind: usage, text: "Самое нужное здесь — готовое выражение: SZKOŁA PODSTAWOWA значит «начальная школа», и в Польше так называется вся первая ступень обучения, восемь классов. Разговорное название у неё своё — PODSTAWÓWKA. Без этого словосочетания не обойтись ни в разговоре о детях, ни в документах, и переводить его по частям бессмысленно: «основная школа» по-русски не значит ничего." }
  - { kind: usage, text: "Форм одиннадцать, степеней сравнения нет: слово относит к разряду, а не измеряет качество. Это седьмое такое прилагательное после fizyczny, miejscowy, kredytowy, sądowy, włoski и brytyjski. Одиннадцать, а не десять, потому что основа твёрдая и мужская личная форма множественного отдельная — PODSTAWOWI; у мягкой основы, как у LETNI, она совпала бы с именительным единственного и форм было бы десять." }
  - { kind: false-friend, text: "Корень слова — PODSTAWA «основа, основание», от PODSTAWIĆ «подставить». Русское однокоренное «подставка» значит совсем другое — предмет, на который ставят, — а «основу» русский назвал от другого корня. Поэтому podstawa переводится как «основа» или «база», но никогда как «подставка», и обратно: русскую «подставку» по-польски назовут PODSTAWKA или STOJAK. Разница в одном суффиксе, а смысл расходится далеко." }
