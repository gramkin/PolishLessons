notes:
  - { kind: false-friend, text: "ОДИН ПОЛЬСКИЙ ГЛАГОЛ ПОКРЫВАЕТ ДВА РУССКИХ. ZRUJNOWAĆ DOM — «разрушить дом», это совпадает. Но ZRUJNOWAĆ KOGOŚ значит «разорить», довести до нищеты: zrujnowała go jedna inwestycja. По-русски «разрушить человека» так не скажешь, нужен другой глагол. Третий случай — ZRUJNOWAĆ ZDROWIE «подорвать здоровье». Выбор русского слова каждый раз диктует дополнение." }
  - { kind: usage, text: "Спряжение даётся даром: -ować даёт -uję, как и русское -ировать даёт -ирую. Zrujnować — zrujnuję, zrujnujesz. Вид совершенный, поэтому zrujnuję значит «разрушу», а не «разрушаю»; несовершенная пара — RUJNOWAĆ. Причастие ZRUJNOWANY годится для всех трёх значений: zrujnowany dom, zrujnowany człowiek, zrujnowane zdrowie." }
  - { kind: usage, text: "Возвратное ZRUJNOWAĆ SIĘ значит «разориться», потратиться сверх меры, и часто звучит шутливо: nie zrujnuj się «не разорись», когда речь о недорогой покупке. Существительное от корня — RUINA, и во множественном RUINY это «руины, развалины», как у нас." }
collocations:
  - { pl: "zrujnować dom", ru: "разрушить дом" }
  - { pl: "zrujnować komuś życie", ru: "разрушить кому-л. жизнь" }
  - { pl: "zrujnować zdrowie", ru: "подорвать здоровье" }
family:
  - { pl: "rujnować", ru: "разрушать, разорять (несов.)", relation: aspect }
  - { pl: "ruina", ru: "руина, развалина", relation: root }
  - { pl: "odbudować", ru: "отстроить заново", relation: antonym }
etymology: "Из латинского ruina «обвал, падение», от ruere «рушиться», через немецкий и французский. Русская «руина» пришла той же дорогой, так что корень общий; разошлось производное: поляки сделали от него глагол на -ować и нагрузили его ещё и денежным смыслом, а русский для разорения взял своё слово от «зоря, разорять»."
memory: "Три русских перевода на один польский глагол, и подсказывает дополнение: zrujnować dom — «разрушить», zrujnować kogoś — «разорить», zrujnować zdrowie — «подорвать»."
idioms:
  - { pl: "zrujnować komuś życie", ru: "разрушить кому-л. жизнь" }
  - { pl: "nie zrujnuj się", ru: "не разорись (шутл.)" }
