notes:
  - { kind: false-friend, text: "ПОЛЬСКОЕ ARESZT НАЗЫВАЕТ И МЕРУ, И МЕСТО. Русский «арест» — это только действие или состояние: «его взяли под арест», «домашний арест». Само помещение мы зовём иначе: изолятор, КПЗ, камера. Польское слово покрывает оба смысла сразу, поэтому ARESZT ŚLEDCZY — это учреждение, следственный изолятор, а siedzieć w areszcie значит «сидеть в изоляторе», а не «находиться в состоянии ареста»." }
  - { kind: pronunciation, text: "Предложный падеж — ARESZCIE, с переходом t в c. То же чередование уже встречалось в procent — procencie, student — studencie, brat — bracie. Правило общее для основ на -t, и русское «аресте» мягкости не знает." }
  - { kind: usage, text: "Родительный единственного — ARESZTU, с окончанием -u, как soku и cukru. Для неодушевлённых мужского рода выбор между -a и -u приходится запоминать отдельно для каждого слова; отвлечённые понятия чаще берут -u, и areszt идёт именно этим путём." }
collocations:
  - { pl: "areszt śledczy", ru: "следственный изолятор" }
  - { pl: "areszt domowy", ru: "домашний арест" }
  - { pl: "wyjść z aresztu", ru: "выйти из-под ареста" }
family:
  - { pl: "aresztować", ru: "арестовать", relation: root, id: aresztowac }
  - { pl: "aresztowanie", ru: "арест, задержание", relation: root }
  - { pl: "wolność", ru: "свобода", relation: antonym, id: wolnosc }
etymology: "Из латинского arrestare «останавливать, задерживать», через немецкий Arrest. Русский «арест» пришёл той же дорогой и в то же время, так что корень общий целиком. Разошлось употребление: немецкое слово означало и задержание, и помещение, и польский сохранил оба смысла, а русский второй отдал другим словам."
memory: "areszt — это и мера, и место: areszt śledczy значит «следственный изолятор», целое учреждение. И падежи: родительный aresztU, предложный areszCIE с мягким c."
