        source: { kind: authored }
  - id: honour
    ru: "честь, удовольствие"
    examples:
      - pl: "To dla mnie przywilej pracować z panem."
        ru: "Для меня честь работать с вами."
        source: { kind: authored }
      - pl: "Mieliśmy przywilej poznać autora."
        ru: "Нам выпала честь познакомиться с автором."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "PRZYWILEJ — «привилегия», хотя звучит совсем иначе: латинское PRIVILEGIUM в старопольском переделали на свой лад. Привилегированный — UPRZYWILEJOWANY. Льгота в быту — ULGA: ULGA PODATKOWA." }
  - { kind: usage, text: "Мужской род, неодушевлённое. Родительный — PRZYWILEJU. Множественное — PRZYWILEJE, PRZYWILEJÓW. Старая форма PRZYWILEI устарела." }
  - { kind: government, text: "Иметь привилегию — MIEĆ PRZYWILEJ, винительный. Лишить привилегий — POZBAWIĆ PRZYWILEJÓW, родительный. Честь сделать что — PRZYWILEJ и инфинитив." }
  - { kind: pronunciation, text: "Читается «пшыви́лей»: PRZ — «пш», LEJ — «лей». Ударение на предпоследнем слоге." }
collocations:
  - { pl: "przywileje podatkowe", ru: "налоговые льготы" }
  - { pl: "stracić przywileje", ru: "лишиться привилегий" }
  - { pl: "mieć przywilej", ru: "иметь честь, привилегию" }
family:
  - { pl: "uprzywilejowany", ru: "привилегированный", relation: derived }
  - { pl: "prawo", ru: "право", relation: root, id: prawo }
  - { pl: "ulga", ru: "льгота", relation: root, id: ulga }
etymology: "Из латинского PRIVILEGIUM «закон для одного человека». В старопольском заимствование изменилось до неузнаваемости и стало PRZYWILEJ."
memory: "Przywilej — привилегия, из латинского privilegium. Przywileje podatkowe — налоговые льготы. Uprzywilejowany — привилегированный. Читается «пшыви́лей»."
idioms:
  - { pl: "przywilej młodości", ru: "привилегия молодости" }
formExamplesSkip:
