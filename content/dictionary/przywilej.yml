# review
id: przywilej
format: 2
lemma: "przywilej"
rank: 4729
pos: noun
pron: { cyr: "пшыви́лей" }
senses:
  - id: privilege
    ru: "привилегия, льгота"
    examples:
      - pl: "Posłowie mają wiele przywilejów."
        ru: "У депутатов много привилегий."
        source: { kind: authored }
      - pl: "Darmowy parking to przywilej pracowników."
        ru: "Бесплатная парковка — льгота для сотрудников."
