notes:
  - { kind: government, text: "Самое важное здесь — два предлога, и выбор между ними. От чего защищает — PRZED с творительным падежом: OSŁONA PRZED SŁOŃCEM, OSŁONA PRZED DESZCZEM. Или OD с родительным, когда речь о направлении, откуда идёт угроза: OSŁONA OD WIATRU. Русский в оба случая ставит «от» с родительным, поэтому PRZED с творительным приходится запоминать отдельно: это общее польское правило для защиты и страха, как BAĆ SIĘ CZEGOŚ, но CHRONIĆ PRZED CZYMŚ. Чего кожух — родительный: OSŁONA SILNIKA." }
  - { kind: pronunciation, text: "Читается «осуо́на», с ударением на предпоследнем слоге. Буква ł даёт «у», и поскольку перед ней стоит s, получается сочетание «су»: не «ослона», а «осуо́на». В предложном падеже OSŁONIE — «осуо́не». Родительный множественного — OSŁON, без окончания, как у всех существительных женского рода на -a, и там конечное n остаётся твёрдым." }
  - { kind: usage, text: "Два значения различает конкретность. Первое предметное: кожух, щиток, крышка, то, что надевают или ставят, OSŁONA SILNIKA, OSŁONA ŁAŃCUCHA. Второе отвлечённое: защита как состояние или место, SZUKAĆ OSŁONY, POD OSŁONĄ NOCY «под покровом ночи». Последнее сочетание устойчиво и совпадает с русским образом. Глагол — OSŁONIĆ «прикрыть, заслонить», и от него же OSŁONIĘTY. Рядом стоит ZASŁONA «занавеска, штора», отличающаяся только приставкой: ZA- закрывает наглухо, O- прикрывает кругом." }
  - { kind: false-friend, text: "Ложной пары нет, но соседнее слово легко подставить. ZASŁONA — это «занавеска, штора» или «завеса», а OSŁONA — «защита, прикрытие». Приставки разводят их по смыслу: ZA- значит «закрыть, задвинуть», O- значит «обойти кругом, окружить». Поэтому ZASŁONA W OKNIE — шторы на окне, а OSŁONA NA SILNIK — кожух на двигатель. Перепутать их в речи легко, а смысл выйдет совсем другой." }
