etymology: "От глагола OSŁONIĆ, составленного из приставки O- и корня SŁON-, того же, что в SŁONIĆ и ZASŁONIĆ, из праславянского *sloniti «прислонять, укрывать». Русские родственники — «заслонить», «заслон», «прислонить», Корень тот же, что в русском «заслонить», и образ один: поставить нечто между угрозой и тем, что берегут. Приставка O- даёт охват кругом, отсюда «прикрытие со всех сторон», тогда как ZA- даёт закрытие наглухо, отсюда ZASŁONA «занавеска». Так одна и та же основа с двумя приставками поделила между собой защиту и шторы."
memory: "Защита, кожух, прикрытие — не «занавеска»: та zasłona, с приставкой za-. От чего защищает — PRZED с творительным, не «от» с родительным: osłona PRZED słońcem. Читается «осуо́на», ł даёт «у». И pod osłoną nocy значит «под покровом ночи»."
idioms:
  - { pl: "pod osłoną nocy", ru: "под покровом ночи" }
  - { pl: "szukać osłony", ru: "искать укрытие" }
