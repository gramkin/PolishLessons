# review
id: zastanowic
format: 2
lemma: "zastanowić"
rank: 1856
pos: verb
pron: { cyr: "застано́виць" }
senses:
  - id: ponder
    ru: "задуматься, поразмыслить (zastanowić się nad czymś)"
    examples:
      - pl: "Zastanów się, zanim odpowiesz."
        ru: "Подумай, прежде чем отвечать."
        source: { kind: authored }
      - pl: "Zastanowił się nad propozycją przez noc."
        ru: "Он обдумывал предложение всю ночь."
        source: { kind: authored }
      - pl: "Muszę się zastanowić."
        ru: "Мне надо подумать."
        source: { kind: authored }
  - id: puzzle
    ru: "озадачить, заставить задуматься (кого-л.)"
    examples:
      - pl: "Zastanowiła mnie jego reakcja."
        ru: "Меня озадачила его реакция."
        source: { kind: authored }
      - pl: "To pytanie zastanowiło wszystkich."
        ru: "Этот вопрос заставил всех задуматься."
        source: { kind: authored }
  - id: reflection
    ru: "zastanowienie — размышление, раздумье"
    examples:
      - pl: "Po chwili zastanowienia zgodził się."
        ru: "После минутного раздумья он согласился."
        source: { kind: authored }
      - pl: "Bez zastanowienia podpisał umowę."
        ru: "Не раздумывая, он подписал договор."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "КОРЕНЬ ВЫ УЖЕ ЗНАЕТЕ, только по другому слову. Stan- здесь тот же, что в русском «остановиться», «становиться», «стан». Zastanowić się буквально значит «привести себя к остановке» — и отсюда «задуматься». Образ точный: человек останавливается, чтобы подумать. Русское «остановиться» сохранило только физический смысл, польское ушло целиком в умственный." }
  - { kind: government, text: "Раздумывают НАД чем — предлог nad с ТВОРИТЕЛЬНЫМ: zastanowić się nad propozycją, nad sobą, nad przyszłością. Русское «задуматься над чем-то» устроено точно так же, расхождений нет. Можно и zastanowić się, czy… «подумать, стоит ли…»." }
  - { kind: usage, text: "Почти всегда с się. Без się глагол переходный и значит «озадачить кого-то»: zastanowiła mnie jego reakcja. Несовершенная пара — zastanawiać się: zastanawiam się nad tym od tygodnia «я думаю об этом неделю». Страдательного причастия в парадигме нет: возвратному глаголу продвигать в подлежащие нечего." }
  - { kind: pronunciation, text: "ЧЕРЕДОВАНИЕ o и ó в повелительном наклонении: zastanowić, но zastanów, zastanówmy, zastanówcie. Правило общее для польского — в закрытом последнем слоге o переходит в ó, а читается ó как «у»: «застану́ф». Так же ведут себя robić/rób и mówić/mów." }
collocations:
  - { pl: "zastanów się", ru: "подумай" }
  - { pl: "bez zastanowienia", ru: "не раздумывая" }
  - { pl: "po chwili zastanowienia", ru: "после минутного раздумья" }
family:
  - { pl: "zastanawiać", ru: "раздумывать", relation: aspect, id: zastanawiac }
  - { pl: "stanąć", ru: "встать, остановиться", relation: root, id: stanac }
  - { pl: "zastanowienie", ru: "раздумье", relation: derived }
etymology: "Приставка za- плюс корень stan-, тот же, что в stanąć «встать» и в русских «остановиться», «становиться», «стан». Исходный образ — остановить себя; из него развилось «задуматься», потому что думающий человек замирает. Русский оставил корню телесный смысл, польский передал ему умственный."
memory: "zastanowić się — «задуматься», и корень тот же, что в русском «остановиться»: остановить себя, чтобы подумать. Управление совпадает: nad с творительным, как «над чем-то». Следите за ó в повелительном: zastanów się."
idioms:
  - { pl: "bez zastanowienia", ru: "не раздумывая, сгоряча" }
  - { pl: "zastanów się dobrze", ru: "подумай хорошенько" }
