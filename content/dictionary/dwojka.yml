notes:
  - { kind: usage, text: "dwójka dzieci — «двое детей»; после dwójka идёт родительный падеж множественного числа." }
  - { kind: usage, text: "we dwójkę значит «вдвоём»: popływać we dwójkę «поплавать вдвоём»." }
  - { kind: usage, text: "Второе значение — школьная оценка «двойка», как в русском; третье — цифра 2, четвёртое — двухместный номер." }
  - { kind: usage, text: "Слово образовано от dwa «два» суффиксом -ka, ровно как русская «двойка» от «два»." }
collocations:
  - { pl: "dwójka dzieci", ru: "двое детей" }
  - { pl: "we dwójkę", ru: "вдвоём" }
  - { pl: "nasza dwójka", ru: "мы двое" }
etymology: "От dwa «два» с суффиксом -ka, ровно как русская «двойка» от «два». Совпадают и словообразование, и школьное значение оценки."
memory: "dwójka = «двое, пара»: dwójka dzieci «двое детей», we dwójkę «вдвоём». Как и русская «двойка», слово значит ещё и цифру 2, и школьную оценку."
