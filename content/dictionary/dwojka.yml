# review
id: dwojka
format: 2
lemma: "dwójka"
rank: 1637
pos: noun
pron: { cyr: "дву́йка" }
senses:
  - id: two-people
    ru: "двое, пара (о людях)"
    examples:
      - pl: "Mamy dwójkę dzieci."
        ru: "У нас двое детей."
        source: { kind: translated, id: 3125655 }
      - pl: "Jestem żonaty i mam dwójkę dzieci."
        ru: "Я женат, и у меня двое детей."
        source: { kind: translated, id: 3649825 }
      - pl: "On jest ojcem dwójki dzieci."
        ru: "Он отец двоих детей."
        source: { kind: translated, id: 1181570 }
  - id: the-two
    ru: "эти двое, вы двое"
    examples:
      - pl: "Wasza dwójka wygląda na zajętych."
        ru: "Вы двое выглядите занятыми."
        source: { kind: translated, id: 7938089 }
      - pl: "Nie chcę cały czas się wtrącać, gdy ta dwójka się kłóci."
        ru: "Я не хочу всё время вмешиваться, когда эти двое ссорятся."
        source: { kind: translated, id: 10781117 }
notes:
  - { kind: usage, text: "dwójka dzieci — «двое детей»; после dwójka идёт родительный падеж множественного числа." }
  - { kind: usage, text: "we dwójkę значит «вдвоём»: popływać we dwójkę «поплавать вдвоём»." }
  - { kind: usage, text: "Второе значение — школьная оценка «двойка», как в русском; третье — цифра 2, четвёртое — двухместный номер." }
  - { kind: usage, text: "Слово образовано от dwa «два» суффиксом -ka, ровно как русская «двойка» от «два»." }
collocations:
  - { pl: "dwójka dzieci", ru: "двое детей" }
  - { pl: "we dwójkę", ru: "вдвоём" }
  - { pl: "nasza dwójka", ru: "мы двое" }
etymology: "От dwa «два» с суффиксом -ka, ровно как русская «двойка» от «два». Совпадают и словообразование, и школьное значение оценки."
memory: "dwójka = «двое, пара»: dwójka dzieci «двое детей», we dwójkę «вдвоём». Как и русская «двойка», слово значит ещё и цифру 2, и школьную оценку."
idioms:
  - { pl: "dwójka dzieci", ru: "двое детей" }
  - { pl: "we dwójkę", ru: "вдвоём" }
  - { pl: "dostać dwójkę", ru: "получить двойку" }
