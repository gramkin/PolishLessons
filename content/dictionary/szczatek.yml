# review
id: szczatek
format: 2
lemma: "szczątek"
rank: 2327
pos: noun
pron: { cyr: "шчо́нтэк" }
senses:
  - id: remains
    ru: "останки, обломки (обычно мн. szczątki)"
    examples:
      - pl: "Szczątki wraku porozrzucane są na olbrzymim obszarze."
        ru: "Обломки затонувшего судна разбросаны на огромной площади."
        source: { kind: translated, id: 674693 }
      - pl: "Szczątki samolotu znaleziono w górach."
        ru: "Обломки самолёта нашли в горах."
        source: { kind: authored }
      - pl: "Odnaleziono szczątki zaginionych."
        ru: "Нашли останки пропавших."
        source: { kind: authored }
  - id: fragment
    ru: "остаток, обрывок"
    examples:
      - pl: "Ze szczątków ułożono całość."
        ru: "Из обломков сложили целое."
        source: { kind: authored }
      - pl: "Zachowały się tylko szczątki rękopisu."
        ru: "Сохранились только обрывки рукописи."
        source: { kind: authored }
notes:
  - { kind: usage, text: "На практике слово употребляется почти всегда во множественном: szczątki «останки, обломки». Единственное szczątek звучит книжно и редко." }
  - { kind: government, text: "Мужской неодушевлённый; родительный мн. — szczątków." }
  - { kind: false-friend, text: "Корень szczet, сохранившийся в обороте do szczętu «дочиста». Ср. русское «вчистую», «дотла» — по смыслу, не по корню." }
  - { kind: usage, text: "О человеческих останках — szczątki ludzkie; об аварии — szczątki wraku «обломки судна»." }
collocations:
  - { pl: "szczątki samolotu", ru: "обломки самолёта" }
  - { pl: "szczątki ludzkie", ru: "человеческие останки" }
etymology: "От корня szczet «остаток», сохранившегося в обороте do szczętu «дочиста»."
memory: "szczątek — «остаток», но в жизни вы встретите почти только множественное szczątki «останки, обломки». Единственное число звучит книжно."
idioms:
  - { pl: "szczątki samolotu", ru: "обломки самолёта" }
