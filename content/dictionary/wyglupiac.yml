# review
id: wyglupiac
format: 2
lemma: "wygłupiać"
rank: 4691
pos: verb
pron: { cyr: "выгуу́пяць" }
senses:
  - id: fool-around
    ru: "дурачиться, валять дурака (WYGŁUPIAĆ SIĘ)"
    examples:
      - pl: "Nie wygłupiaj się, mówię poważnie."
        ru: "Не дурачься, я серьёзно."
        source: { kind: authored }
      - pl: "Dzieci wygłupiają się na podwórku."
        ru: "Дети дурачатся во дворе."
        source: { kind: authored }
      - pl: "Przestań się wygłupiać!"
        ru: "Перестань валять дурака!"
        source: { kind: authored }
  - id: be-silly
    ru: "глупить, говорить глупости (NIE WYGŁUPIAJ SIĘ — «да ну, брось»)"
    examples:
      - pl: "Nie wygłupiaj się, przecież to nic nie kosztuje."
        ru: "Да брось, это же ничего не стоит."
        source: { kind: authored }
      - pl: "Wygłupiasz się, nikt cię nie wyrzuci z pracy."
        ru: "Глупости говоришь, никто тебя не уволит."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "WYGŁUPIAĆ SIĘ — «дурачиться», корень GŁUPI «глупый». Частое NIE WYGŁUPIAJ SIĘ! значит не только «не дурачься», но и «брось, не говори глупостей», когда кто-то зря отказывается или переживает. Совершенный вид WYGŁUPIĆ SIĘ — «сморозить глупость, опозориться»." }
  - { kind: usage, text: "Несовершенный вид, только с SIĘ. Спряжение на -AM: WYGŁUPIAM SIĘ, WYGŁUPIASZ SIĘ, WYGŁUPIAJĄ SIĘ. Безличное WYGŁUPIANO в карточку не включено." }
  - { kind: government, text: "Без дополнения. С кем — Z с творительным: WYGŁUPIAĆ SIĘ Z KOLEGAMI. Где — W или NA с предложным: NA LEKCJI, W SZKOLE." }
  - { kind: pronunciation, text: "Читается «выгуу́пяць»: Ł — «у», PIA — «пя». Ударение на предпоследнем слоге. WYGŁUPIAJ SIĘ — «выгуу́пяй сен»." }
  - { kind: register, text: "Разговорное, дружеское слово. NIE WYGŁUPIAJ SIĘ звучит тепло, без обиды." }
collocations:
  - { pl: "nie wygłupiaj się", ru: "не дурачься; брось" }
  - { pl: "wygłupiać się na lekcji", ru: "дурачиться на уроке" }
  - { pl: "przestać się wygłupiać", ru: "перестать валять дурака" }
family:
  - { pl: "głupi", ru: "глупый", relation: root, id: glupi }
  - { pl: "głupiec", ru: "глупец", relation: root, id: glupiec }
  - { pl: "żartować", ru: "шутить", relation: root, id: zartowac }
etymology: "От GŁUPI «глупый», праславянское *glupъ, как русское «глупый», с приставкой WY- и SIĘ: «выставлять себя глупым»."
memory: "Wygłupiać się — дурачиться: dzieci się wygłupiają. Nie wygłupiaj się! — не дурачься / брось, не говори глупостей."
idioms:
  - { pl: "nie wygłupiaj się", ru: "брось, не говори глупостей" }
formExamplesSkip:
