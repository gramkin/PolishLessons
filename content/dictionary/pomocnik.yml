pos: noun
pron: { cyr: "помо́цник" }
senses:
  - id: helper
    ru: "помощник"
    examples:
      - pl: "Mam w kuchni małego pomocnika."
        ru: "У меня на кухне маленький помощник."
        source: { kind: authored }
      - pl: "Pomocnik stolarza przyniósł deski."
