notes:
  - { kind: false-friend, text: "POMOCNIK — «помощник», а в футболе — «полузащитник». Нападающий — NAPASTNIK, защитник — OBROŃCA. Помощник руководителя в офисе — ASYSTENT." }
  - { kind: usage, text: "Одиннадцать форм, мужской род, лицо. Во множественном K переходит в C: POMOCNICY. Форма POMOCNIKI встречается о вещах-помощниках, о людях не говорят. Творительный — POMOCNIKIEM." }
  - { kind: government, text: "Чей помощник — родительный: POMOCNIK KUCHARZA. Быть помощником — BYĆ POMOCNIKIEM, творительный. Работать подручным — PRACOWAĆ JAKO POMOCNIK." }
  - { kind: pronunciation, text: "Читается «помо́цник», ударение на предпоследнем слоге. C — «ц»." }
collocations:
  - { pl: "pomocnik kucharza", ru: "помощник повара" }
  - { pl: "mały pomocnik", ru: "маленький помощник" }
  - { pl: "defensywny pomocnik", ru: "опорный полузащитник" }
family:
  - { pl: "pomoc", ru: "помощь", relation: root, id: pomoc-2 }
  - { pl: "pomagać", ru: "помогать", relation: root, id: pomagac }
  - { pl: "pomocny", ru: "полезный, услужливый", relation: derived, id: pomocny }
etymology: "От POMOC «помощь», а то — от MOC «сила»: помогать — давать силу. Русское «помощник» построено так же."
memory: "Pomocnik — помощник и полузащитник. Читается «помо́цник». Pomocnicy — помощники. Napastnik — нападающий, obrońca — защитник."
idioms:
  - { pl: "podać komuś pomocną dłoń", ru: "протянуть кому-то руку помощи" }
