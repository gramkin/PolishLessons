        ru: "Он показал пупок."
        source: { kind: authored }
  - id: centre-of-world
    ru: "пуп (в обороте pępek świata)"
    examples:
      - pl: "On naprawdę uważa się za pępek świata."
        ru: "Он и правда считает себя пупом земли."
        source: { kind: translated, id: 1181516 }
      - pl: "Myśli, że jest pępkiem świata."
        ru: "Он думает, что он пуп земли."
        source: { kind: translated, id: 3857231 }
notes:
  - { kind: false-friend, text: "Русский «пуп, пупок» и польское pępek — одно слово: носовое ę отвечает русскому у." }
  - { kind: government, text: "Мужской неодушевлённый; родительный — pępka, с выпадением e." }
  - { kind: usage, text: "Pępek świata — «пуп земли», буквально «пуп мира». Русский говорит о земле, поляк о мире." }
  - { kind: usage, text: "Пуповина — pępowina." }
collocations:
  - { pl: "pępek świata", ru: "пуп земли" }
etymology: "Праславянское *pǫpъkъ; русский «пупок» — то же слово, носовое ę отвечает русскому у."
memory: "pępek — «пупок», читается «пэ́мпэк». Оборот pępek świata значит «пуп земли» — но по-польски именно «мира»."
