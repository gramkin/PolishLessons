senses:
  - id: navel
    ru: "пупок"
    examples:
      - pl: "Ona przekłuła sobie pępek."
        ru: "Она проколола себе пупок."
        source: { kind: translated, id: 6170173 }
      - pl: "Ma na sobie swój zielony kostium kąpielowy z dziurą wokół pępka."
        ru: "На ней зелёный купальник с дыркой вокруг пупка."
