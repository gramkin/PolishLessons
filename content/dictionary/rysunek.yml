notes:
  - { kind: false-friend, text: "RYSUNEK — «рисунок», с Y: RYSOWAĆ — «рисовать». Узор на ткани — WZÓR, а не RYSUNEK. Черчение в школе — RYSUNEK TECHNICZNY." }
  - { kind: usage, text: "Девять форм, мужской род, неодушевлённое, без звательного. Беглое E: RYSUNEK, но RYSUNKU, RYSUNKI. Творительный — RYSUNKIEM: K перед I смягчается." }
  - { kind: government, text: "На рисунке — NA RYSUNKU, местный. Рисунок чего — родительный: RYSUNEK DOMU. Рисунок карандашом — RYSUNEK OŁÓWKIEM, творительный." }
  - { kind: pronunciation, text: "Читается «рысу́нэк», ударение на предпоследнем слоге. Y — «ы», NE — твёрдое «нэ»." }
collocations:
  - { pl: "rysunek ołówkiem", ru: "рисунок карандашом" }
  - { pl: "rysunek techniczny", ru: "черчение, технический чертёж" }
  - { pl: "na rysunku", ru: "на рисунке" }
family:
  - { pl: "rysować", ru: "рисовать", relation: root }
  - { pl: "narysować", ru: "нарисовать", relation: root }
  - { pl: "rysownik", ru: "рисовальщик, карикатурист", relation: derived }
etymology: "От RYSOWAĆ «рисовать», заимствованного из немецкого слова со значением «чертить, набрасывать». Русское «рисовать» и «рисунок» пришли в русский как раз через польский."
memory: "Rysunek — рисунок; rysować — рисовать. Читается «рысу́нэк». Na rysunku — на рисунке. Rysunek techniczny — черчение."
idioms:
  - { pl: "rysować się w jasnych barwach", ru: "видеться в светлых тонах" }
formExamplesSkip:
  - { form: "rysunku", cell: "Звательный", reason: "звательный падеж: для неодушевлённого существительного он практически не употребляется" }
