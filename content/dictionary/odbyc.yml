# review
id: odbyc
format: 2
lemma: "odbyć"
rank: 2111
pos: verb
pron: { cyr: "о́дбыць" }
senses:
  - id: conduct
    ru: "провести, совершить (разговор, поездку, обучение)"
    examples:
      - pl: "Odbyli długą rozmowę o przyszłości."
        ru: "Они провели долгий разговор о будущем."
        source: { kind: authored }
      - pl: "Odbył podróż dookoła Bałtyku."
        ru: "Он совершил путешествие вокруг Балтики."
        source: { kind: authored }
      - pl: "Musisz odbyć obowiązkowe szkolenie."
        ru: "Ты должен пройти обязательное обучение."
        source: { kind: authored }
  - id: take-place
    ru: "odbyć się — состояться, пройти"
    examples:
      - pl: "Finał odbędzie się na stadionie."
        ru: "Финал состоится на стадионе."
        source: { kind: authored }
      - pl: "Zebranie odbyło się bez prezesa."
        ru: "Собрание прошло без председателя."
        source: { kind: authored }
  - id: serve
    ru: "отбыть (наказание), отслужить"
    examples:
      - pl: "Odbył karę w całości."
        ru: "Он отбыл наказание полностью."
        source: { kind: authored }
      - pl: "Odbyła służbę w jednostce pod Gdańskiem."
        ru: "Она отслужила в части под Гданьском."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "СОВПАДАЕТ ТОЛЬКО НАПОЛОВИНУ. Русское «отбыть» значит либо «уехать», либо «отбыть срок». Польское odbyć первое значение потеряло начисто — «уехать» будет wyjechać или odjechać, — зато второе разрослось: odbyć rozmowę «провести разговор», odbyć podróż «совершить поездку», odbyć szkolenie «пройти обучение», odbyć praktyki «пройти практику». Полностью совпадают только odbyć karę и odbyć służbę. А возвратного «отбыться» в русском нет вовсе, хотя odbyć się — самое ходовое значение." }
  - { kind: usage, text: "ВСЯ ПАРАДИГМА — ЭТО BYĆ С ПРИСТАВКОЙ. Если вы знаете спряжение być, вы уже знаете odbyć, учить нечего: będę даёт odbędę, będziesz даёт odbędziesz, bądź даёт odbądź, był даёт odbył. Достаточно приставить od-. Вид совершенный, несовершенная пара — odbywać." }
  - { kind: government, text: "Проводят ЧТО — винительный падеж: odbyć rozmowę, podróż, karę, służbę. Возвратное odbyć się дополнения не требует и ставит подлежащим само событие: Koncert się odbył, Wybory odbędą się jesienią. Это обычный польский способ сказать «состоится», и переводить его русским «отбудется» нельзя — только «состоится», «пройдёт»." }
  - { kind: pronunciation, text: "Приставка od- перед звонким b голоса не теряет: «о́дбыць». В будущем времени ударение, как всегда, садится на предпоследний слог, а слогов становится больше: odbędzie звучит «одбэ́ндзе», odbędziemy — «одбэндзе́мы»." }
collocations:
  - { pl: "odbyć rozmowę", ru: "провести разговор" }
  - { pl: "odbyć podróż", ru: "совершить поездку" }
  - { pl: "odbyć karę", ru: "отбыть наказание" }
family:
  - { pl: "być", ru: "быть", relation: root, id: byc }
  - { pl: "odbywać", ru: "проводить; проходить", relation: aspect }
  - { pl: "odbycie", ru: "прохождение, проведение", relation: derived }
etymology: "Приставка od- плюс być «быть» — буквально «от-быть». Русское «отбыть» собрано из тех же двух частей, но разошлось с польским в значении: там остались «уехать» и «отбыть срок», а здесь выросло широкое «провести, совершить». Отсюда odbywać, odbycie и возвратное odbyć się «состояться»."
memory: "odbyć — вся его таблица это być с приставкой od-: będę даёт odbędę, bądź даёт odbądź, był даёт odbył. Значение же шире русского «отбыть»: odbyć rozmowę — провести разговор, а Koncert się odbył — концерт состоялся."
idioms:
  - { pl: "odbyć karę", ru: "отбыть наказание" }
  - { pl: "odbyć służbę wojskową", ru: "отслужить в армии" }
  - { pl: "odbyć się bez przeszkód", ru: "пройти без помех" }
formExamplesSkip:
  - { form: "odbyci", reason: "Мужско-личная форма множественного числа страдательного причастия. Odbyty описывает то, что «проводят» или «отбывают», — staż, karę, podróż, rozmowę; человек в эту роль не попадает, поэтому формы для лиц мужского пола у этого причастия нет употребления." }
