# review
id: zrozumiec
format: 2
lemma: "zrozumieć"
rank: 295
pos: verb
aspect: perf
pron: { cyr: "зрозу́мець" }
senses:
  - id: understand
    ru: "понять"
    examples:
      - pl: "Zrozumiałam."
        ru: "Я поняла."
        source: { kind: tatoeba, id: 3759810 }
      - pl: "Tom zrozumiał, że umiera."
        ru: "Том понял, что умирает."
        source: { kind: tatoeba, id: 6895143 }
      - pl: "Prawidłowo zrozumiałeś."
        ru: "Правильно понял."
        source: { kind: tatoeba, id: 1735719 }
  - id: never-understand
    ru: "понять (о будущем, в отрицании)"
    examples:
      - pl: "Nigdy nie zrozumiem."
        ru: "Я никогда не пойму."
        source: { kind: tatoeba, id: 3430139 }
      - pl: "Nigdy cię nie zrozumiem."
        ru: "Я никогда тебя не пойму."
        source: { kind: tatoeba, id: 3707292 }
      - pl: "Za dzień zrozumiesz."
        ru: "Через день ты поймёшь."
        source: { kind: tatoeba, id: 13781657 }
notes:
  - { kind: usage, text: "Совершенный вид к rozumieć: Rozumiem «Я понимаю» — Zrozumiałem «Я понял»." }
  - { kind: usage, text: "Nie zrozum mnie źle — «Не пойми меня неправильно»; źle kogoś zrozumieć — «неправильно кого-то понять»." }
  - { kind: usage, text: "Zrozumiano! — армейское и рабочее «Понял!»; Zrozumiałeś? — «Понял?»" }
  - { kind: usage, text: "Существительное zrozumienie значит «понимание»: Dziękuję za zrozumienie «Спасибо за понимание»." }
collocations:
  - { pl: "nie zrozum mnie źle", ru: "не пойми меня неправильно" }
  - { pl: "zrozumiałem", ru: "я понял" }
  - { pl: "trudny do zrozumienia", ru: "трудный для понимания" }
  - { pl: "dziękuję za zrozumienie", ru: "спасибо за понимание" }
etymology: "Из z- + rozumieć, от rozum «разум»; то же гнездо, что русские «разум», «разуметь», «уразуметь»."
memory: "zrozumieć — совершенный вид к rozumieć: Rozumiem «Понимаю» — Zrozumiałem «Понял». Запомните Nie zrozum mnie źle «Не пойми меня неправильно»."
idioms:
  - { pl: "nie zrozum mnie źle", ru: "не пойми меня неправильно" }
  - { pl: "zrozumieć na opak", ru: "понять наоборот" }
  - { pl: "dziękuję za zrozumienie", ru: "спасибо за понимание" }
