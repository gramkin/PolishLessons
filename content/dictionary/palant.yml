notes:
  - { kind: register, text: "БРАНЬ УМЕРЕННОЙ СИЛЫ — ПРИМЕРНО КАК РУССКОЕ «ПРИДУРОК». Слово обидное, но не нецензурное: его скажут в сердцах за рулём или в ссоре, напечатают в газете при цитировании и не скажут начальнику. Нейтрально то же выразят словами głupiec «глупец» или, мягче, gamoń «растяпа»." }
  - { kind: usage, text: "ДВА МНОЖЕСТВЕННЫХ ЧИСЛА — И ВЫБОР МЕЖДУ НИМИ ВЫРАЗИТЕЛЕН. Мужско-личная форма palanci относится к людям по правилам грамматики; немужско-личная palanty формально предназначена для не-лиц, и именно поэтому звучит презрительнее: te palanty как бы выводит их из числа людей. Польский пользуется этим приёмом и с другими бранными словами." }
  - { kind: false-friend, text: "На русское «палант» слово не похоже, потому что такого слова нет; зато есть «палица» и «палка» — и они тут ни при чём. Польское palant это прежде всего старинная игра битой по мячу, вроде лапты, и уже от неё пошло ругательство. Русская лапта — ближайший родственник по сути, а не по звуку." }
  - { kind: pronunciation, text: "Два слога, ударение на первом: PA-lant. Конечное t глухое: «па́лант». В предложном и звательном падеже t смягчается в ci: o palancie, ty palancie — «паля́нце», тот же переход, что в ekspert — ekspercie." }
collocations:
  - { pl: "ty palancie", ru: "ты придурок" }
  - { pl: "grać w palanta", ru: "играть в палант" }
  - { pl: "zachowywać się jak palant", ru: "вести себя как придурок" }
family:
  - { pl: "głupiec", ru: "глупец", relation: root, id: glupiec }
  - { pl: "lapta", ru: "лапта", relation: root }
  - { pl: "baseball", ru: "бейсбол", relation: derived }
etymology: "Название игры старше ругательства: palant известен в Польше с шестнадцатого века, а слово возводят к романскому корню со значением «мяч», тому же, что в итальянском palla. Бранный смысл вырос позже — так бывает с названиями игр и игроков. Русская лапта — та же игра, но слово у неё своё."
memory: "palant — «придурок», брань умеренной силы; изначально это название старинной игры с битой, польской лапты. Два множественных: palanci по правилам, а презрительное palanty выводит их из числа людей."
idioms:
  - { pl: "ty palancie", ru: "ты придурок" }
  - { pl: "grać w palanta", ru: "играть в палант" }
