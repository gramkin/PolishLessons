notes:
  - { kind: false-friend, text: "SAMIEC — «самец», от SAM, как и в русском. Самка — SAMICA. О мужчине — иронично или грубо: SAMIEC ALFA. Мужской пол у животных — PŁEĆ MĘSKA, а SAMCZY — «самцовый»." }
  - { kind: usage, text: "Мужской род, одушевлённый. E беглое: SAMIEC, но SAMCA. Множественное о животных — SAMCE; форма SAMCY о мужчинах шутливо-презрительная, её не учим. Местный — SAMCU." }
  - { kind: government, text: "Самец кого — родительный: SAMIEC LWA. Крупнее самца — WIĘKSZY OD SAMCA. Отличить самца от самки — ODRÓŻNIĆ SAMCA OD SAMICY." }
  - { kind: pronunciation, text: "Читается «са́мец»: MIE — мягкое «ме». Ударение на первом слоге. SAMCA — «са́мца»." }
