# review
id: poprzedni
format: 2
lemma: "poprzedni"
rank: 1075
pos: adj
pron: { cyr: "попшэ́дни" }
senses:
  - id: previous
    ru: "предыдущий, прошлый"
    examples:
      - pl: "O czym był poprzedni e-mail?"
        ru: "О чём было предыдущее письмо?"
        source: { kind: translated, id: 4717736 }
      - pl: "Poprzedni najemca bardzo dbał o mieszkanie."
        ru: "Предыдущий жилец очень заботился о квартире."
        source: { kind: translated, id: 350165 }
      - pl: "Kioto to poprzednia stolica Japonii."
        ru: "Киото — прежняя столица Японии."
        source: { kind: translated, id: 722279 }
  - id: last-time
    ru: "poprzedniego dnia, poprzedniej nocy — накануне, прошлой ночью"
    examples:
      - pl: "Spotkałem go poprzedniego dnia."
        ru: "Я встретил его накануне."
        source: { kind: translated, id: 402629 }
      - pl: "Umarła poprzedniej nocy."
        ru: "Она умерла прошлой ночью."
        source: { kind: translated, id: 3756827 }
      - pl: "Zgubiłem zegarek, który kupiłem poprzedniego dnia."
        ru: "Я потерял часы, которые купил накануне."
        source: { kind: translated, id: 4144962 }
  - id: last-month
    ru: "w poprzednim miesiącu, roku — в прошлом месяце, году"
    examples:
      - pl: "Carol była w Bostonie w poprzednim miesiącu."
        ru: "В прошлом месяце Кэрол была в Бостоне."
        source: { kind: translated, id: 585546 }
      - pl: "Przeszedłem na emeryturę w poprzednim roku."
        ru: "Я вышел на пенсию в прошлом году."
        source: { kind: translated, id: 550687 }
      - pl: "Oni wyjechali do USA w poprzednim miesiącu."
        ru: "Они уехали в США в прошлом месяце."
        source: { kind: translated, id: 675648 }
notes:
  - { kind: usage, text: "Синоним — ubiegły и zeszły. О времени чаще говорят w zeszłym roku «в прошлом году», а poprzedni подчёркивает порядок: тот, что был перед этим." }
  - { kind: usage, text: "poprzedniego dnia — «накануне», буквально «предыдущего дня». Это родительный падеж в роли обстоятельства времени, как и poprzedniej nocy «прошлой ночью»." }
  - { kind: usage, text: "stan poprzedni — «прежнее состояние»: przywrócić stan poprzedni «вернуть всё как было»." }
  - { kind: usage, text: "Степеней сравнения слово не образует: предыдущее не бывает «более предыдущим»." }
collocations:
  - { pl: "poprzedni raz", ru: "предыдущий раз" }
  - { pl: "poprzedniego dnia", ru: "накануне" }
  - { pl: "w poprzednim roku", ru: "в прошлом году" }
  - { pl: "stan poprzedni", ru: "прежнее состояние" }
family:
  - { pl: "poprzedzić", ru: "предшествовать", relation: root }
  - { pl: "następny", ru: "следующий", relation: antonym }
etymology: "От poprzedzić «предшествовать», из po- + przed «перед». Русское «предыдущий» построено от той же идеи «идти перед»."
memory: "poprzedni — «предыдущий, прежний». Запомните обстоятельства времени в родительном падеже: poprzedniego dnia «накануне», poprzedniej nocy «прошлой ночью». Противоположность — następny «следующий»."
idioms:
