# review
id: poprzedni
format: 2
lemma: "poprzedni"
rank: 1049
pos: adj
pron: { cyr: "попшэ́дни" }
senses:
  - id: previous
    ru: "предыдущий, прошлый"
    examples:
      - pl: "O czym był poprzedni e-mail?"
        ru: "О чём было предыдущее письмо?"
        source: { kind: translated, id: 4717736 }
      - pl: "Poprzedni najemca bardzo dbał o mieszkanie."
        ru: "Предыдущий жилец очень заботился о квартире."
