notes:
  - { kind: false-friend, text: "PARANOJA — «паранойя», но в разговоре прежде всего «бред, абсурд»: TO JAKAŚ PARANOJA! — «это какой-то маразм!». Подозрительность — PODEJRZLIWOŚĆ." }
  - { kind: usage, text: "Женский род. Учим единственное: PARANOJA, PARANOI, PARANOJĘ, PARANOJĄ. Родительный, дательный и местный — PARANOI. Звательный не употребляется." }
  - { kind: government, text: "Страдать паранойей — CIERPIEĆ NA PARANOJĘ, NA с винительным. Впасть в паранойю — POPAŚĆ W PARANOJĘ. Граничить с паранойей — GRANICZYĆ Z PARANOJĄ." }
  - { kind: pronunciation, text: "Читается «парано́я»: JA — «я». Ударение на предпоследнем слоге. PARANOI — «парано́и»." }
collocations:
