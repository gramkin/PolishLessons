notes:
  - { kind: false-friend, text: "Главное значение польской KARMA — «корм», еда для животных: KARMA DLA KOTA, SUCHA KARMA. Слово идёт от KARMIĆ «кормить». Значение «карма», судьба по делам, пришло позже из санскрита и звучит в обороте KARMA WRACA. Кормушка для птиц — KARMNIK." }
  - { kind: usage, text: "Десять форм в таблице, женский род. Родительный — KARMY. В дательном и местном падежах M смягчается: KARMIE. Множественное KARMY значит «виды корма»: KARMY DLA PSÓW. Родительный множественного — KARM, без окончания. Звательная форма не нужна." }
  - { kind: government, text: "Корм для кого-то — KARMA DLA KOGOŚ, DLA с родительным. Насыпать корма — NASYPAĆ KARMY, родительный части. Кормить сухим кормом — KARMIĆ SUCHĄ KARMĄ, творительный." }
  - { kind: pronunciation, text: "Читается «ка́рма», два слога, ударение на первом. В форме KARMIE M перед IE смягчается: «ка́рме»." }
collocations:
  - { pl: "karma dla psa", ru: "корм для собаки" }
  - { pl: "sucha karma", ru: "сухой корм" }
  - { pl: "mokra karma", ru: "влажный корм" }
family:
  - { pl: "karmić", ru: "кормить", relation: root, id: karmic }
  - { pl: "karmnik", ru: "кормушка", relation: derived }
  - { pl: "karmienie", ru: "кормление", relation: derived }
etymology: "KARMA «корм» — от глагола KARMIĆ, родственного русскому «кормить». Совпавшее с ним по звучанию слово «карма» в смысле «судьба» пришло из санскрита и родственником не является: два разных слова слились в польском в одно."
memory: "Karma — прежде всего корм: karma dla kota, sucha karma. От karmić — кормить; кормушка — karmnik. Читается «ка́рма». Karma wraca — что посеешь, то и пожнёшь."
idioms:
  - { pl: "karma wraca", ru: "что посеешь, то и пожнёшь" }
