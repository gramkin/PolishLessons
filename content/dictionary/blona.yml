# review
id: blona
format: 2
lemma: "błona"
rank: 5919
pos: noun
pron: { cyr: "буо́на" }
senses:
  - id: film
    ru: "плёнка, тонкий слой"
    examples:
      - pl: "Na powierzchni mleka zrobiła się cienka błona."
        ru: "На поверхности молока образовалась тонкая плёнка."
        source: { kind: authored }
      - pl: "Dziadek przechowywał stare błony fotograficzne w pudełku."
        ru: "Дедушка хранил старые фотоплёнки в коробке."
        source: { kind: authored }
      - pl: "Szyby pokryła tłusta błona brudu."
        ru: "Стёкла покрыла жирная плёнка грязи."
        source: { kind: authored }
  - id: membrane
    ru: "перепонка, оболочка, мембрана (биол.)"
    examples:
      - pl: "Wydrze w pływaniu pomaga błona między palcami."
        ru: "Выдре в плавании помогает перепонка между пальцами."
        source: { kind: authored }
      - pl: "Każdą komórkę otacza błona komórkowa."
        ru: "Каждую клетку окружает клеточная мембрана."
        source: { kind: authored }
      - pl: "Głośny huk może uszkodzić błonę bębenkową."
        ru: "Громкий хлопок может повредить барабанную перепонку."
        source: { kind: authored }
notes:
  - { kind: usage, text: "BŁONA — живая или природная плёнка: на молоке, на ране, между пальцами у утки, вокруг клетки. Пищевая и упаковочная плёнка — FOLIA, кинолента — TAŚMA FILMOWA. Старая фотоплёнка в книжном языке — BŁONA FOTOGRAFICZNA." }
  - { kind: pronunciation, text: "Ł читается как «у»: «буо́на». Русскому уху слово кажется странным, но это родственник диалектного русского «болона»: польское ŁO на месте русского ОЛО, как GŁOWA — голова." }
  - { kind: usage, text: "Женский род на -A. В дательном и местном N смягчается: NA BŁONIE. Родительный множественного без окончания: BŁON. Звательный BŁONO не употребляется." }
collocations:
  - { pl: "błona komórkowa", ru: "клеточная мембрана" }
  - { pl: "błona bębenkowa", ru: "барабанная перепонка" }
  - { pl: "błona śluzowa", ru: "слизистая оболочка" }
  - { pl: "błona pławna", ru: "плавательная перепонка" }
family:
  - { pl: "błonka", ru: "плёночка, тонкая оболочка", relation: derived }
  - { pl: "nabłonek", ru: "эпителий", relation: derived }
  - { pl: "błoniasty", ru: "перепончатый", relation: derived }
  - { pl: "skóra", ru: "кожа", relation: root, id: skora }
etymology: "Исконно славянское слово (праславянское *bolna). Русское соответствие с полногласием — диалектное «болона» «плёнка, оболочка»."
memory: "Błona — плёнка, перепонка, оболочка. Błona bębenkowa — барабанная перепонка. Читается «буо́на»."
idioms:
  - { pl: "błona śluzowa", ru: "слизистая оболочка" }
formExamplesSkip:
  - { form: "błono", reason: "звательная форма, а błona — это плёнка или перепонка. Обращаться к ней некому, поэтому форма остаётся только в таблице склонения" }
