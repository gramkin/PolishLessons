notes:
  - { kind: usage, text: "Три ступени: dziewczynka «девочка», dziewczyna «девушка», kobieta «женщина». Вежливое обращение — pani." }
  - { kind: usage, text: "Dzień Kobiet — 8 марта; обращение kobieto! звучит фамильярно, почти как окрик." }
collocations:
  - { pl: "młoda kobieta", ru: "молодая женщина" }
  - { pl: "Dzień Kobiet", ru: "Женский день" }
  - { pl: "kobieta sukcesu", ru: "успешная женщина" }
  - { pl: "kobieta pracująca", ru: "работающая женщина" }
etymology: "Происхождение спорно: слово связывают со старопольским kob «хлев» или koba «кобыла». Русского родственника у него нет."
memory: "Три ступени: dziewczynka «девочка», dziewczyna «девушка», kobieta «женщина». Обращаться лучше вежливым pani — kobieto! звучит как окрик."
idioms:
  - { pl: "kobieta zmienną jest", ru: "женщина непостоянна" }
  - { pl: "kobieta fatalna", ru: "роковая женщина" }
  - { pl: "kobieta sukcesu", ru: "успешная женщина" }
