# review
id: kon
format: 2
lemma: "koń"
rank: 757
pos: noun
pron: { cyr: "конь" }
senses:
  - id: horse
    ru: "конь, лошадь"
    examples:
      - pl: "Ile zębów ma koń?"
        ru: "Сколько зубов у лошади?"
        source: { kind: tatoeba, id: 5416829 }
      - pl: "Gdzie jest mój koń?"
        ru: "Где моя лошадь?"
        source: { kind: tatoeba, id: 8774126 }
      - pl: "Koń stary, ale zdrowy."
        ru: "Конь старый, но здоровый."
        source: { kind: tatoeba, id: 5909117 }
  - id: horses
    ru: "konie — лошади"
    examples:
      - pl: "Konie jedzą trawę."
        ru: "Лошади едят траву."
        source: { kind: tatoeba, id: 6305758 }
      - pl: "Konie szybko biegają."
        ru: "Лошади быстро бегают."
        source: { kind: tatoeba, id: 12470076 }
      - pl: "Koty, psy i konie są zwierzętami."
        ru: "Собаки, кошки и лошади — животные."
        source: { kind: tatoeba, id: 6322219 }
  - id: on-horse
    ru: "na koniu — верхом"
    examples:
      - pl: "Prawdę mówiąc, chciałabym być księżniczką i żyć w wierzy, strzeżonej przez siedem smoków, i żeby książę na białym koniu odciął smokom głowy, żeby mnie uwolnić."
        ru: "На самом деле, я хотела быть принцессой и жить в башне, охраняемой семью драконами, и чтобы принц на белом коне отрубил драконам головы и освободил меня."
        source: { kind: tatoeba, id: 12586577 }
      - pl: "On dobrze jeździ na koniu."
        ru: "Он хорошо ездит верхом."
        source: { kind: translated, id: 502241 }
      - pl: "Mary kocha jeździć na swoim koniu."
        ru: "Мэри любит кататься на своей лошади."
        source: { kind: translated, id: 6935644 }
  - id: proverbs
    ru: "Darowanemu koniowi nie patrzy się w zęby"
    note: "Пословица переносится дословно."
    examples:
      - pl: "Darowanemu koniowi nie patrzy się w zęby."
        ru: "Дарёному коню в зубы не смотрят."
        source: { kind: translated, id: 539970 }
      - pl: "Nie stawiać wozu przed koniem."
        ru: "Не ставить телегу впереди лошади."
        source: { kind: translated, id: 943621 }
      - pl: "Koń trojański to podstęp."
        ru: "Троянский конь — это уловка."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Главная пословица переносится дословно: Darowanemu koniowi nie patrzy się w zęby — «Дарёному коню в зубы не смотрят». И ещё одна: nie stawiać wozu przed koniem «не ставить телегу впереди лошади»." }
  - { kind: usage, text: "Ходовые обороты: koń trojański «троянский конь», czarny koń «тёмная лошадка», koń by się uśmiał «курам на смех», robić kogoś w konia «дурачить кого-то»." }
  - { kind: usage, text: "В шахматах фигура тоже koń, как и по-русски. А konia z rzędem temu, kto… значит «полцарства тому, кто…» — оборот разобран в карточке rząd." }
  - { kind: government, text: "na koniu «верхом» — предложный падеж; z koniem «с конём» — творительный; jeździć konno «ездить верхом» — наречие, без существительного." }
collocations:
  - { pl: "na koniu", ru: "верхом" }
  - { pl: "jeździć konno", ru: "ездить верхом" }
  - { pl: "koń trojański", ru: "троянский конь" }
  - { pl: "czarny koń", ru: "тёмная лошадка" }
family:
  - { pl: "konny", ru: "конный", relation: derived }
  - { pl: "konno", ru: "верхом", relation: derived }
  - { pl: "stajnia", ru: "конюшня", relation: root }
  - { pl: "źrebak", ru: "жеребёнок", relation: root }
etymology: "Общеславянское *konjь — то же слово, что русский «конь»; дальше этимология неясна."
memory: "koń — «конь», слово то же самое, и главная пословица переносится дословно: Darowanemu koniowi nie patrzy się w zęby. Возьмите ещё czarny koń «тёмная лошадка», koń trojański «троянский конь» и koń by się uśmiał «курам на смех». А konia z rzędem temu, kto… — это «полцарства тому, кто…»."
idioms:
