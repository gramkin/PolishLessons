notes:
  - { kind: false-friend, text: "SZTAB — «штаб», через SZ. Как и в русском, это и военный орган, и любая команда управления: SZTAB WYBORCZY, SZTAB KRYZYSOWY. Генштаб — SZTAB GENERALNY." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Родительный — SZTABU. В местном B смягчается: W SZTABIE." }
  - { kind: government, text: "В штабе — W SZTABIE, местный. Начальник штаба — SZEF SZTABU, родительный. Штаб кого — родительный: SZTAB KANDYDATA." }
  - { kind: pronunciation, text: "Читается «штап», один слог: SZ — «ш», конечное B оглушается в «п». SZTABIE — «шта́бе»." }
collocations:
  - { pl: "sztab wyborczy", ru: "предвыборный штаб" }
  - { pl: "sztab kryzysowy", ru: "антикризисный штаб" }
  - { pl: "szef sztabu", ru: "начальник штаба" }
family:
  - { pl: "dowództwo", ru: "командование", relation: root, id: dowodztwo }
  - { pl: "wojsko", ru: "армия", relation: root, id: wojsko }
  - { pl: "kwatera", ru: "квартира, штаб-квартира", relation: root, id: kwatera }
etymology: "Из немецкого STAB «посох, жезл»: жезл — знак командования, затем — люди при командире. Русское «штаб» взято из того же слова."
memory: "Sztab — штаб. W sztabie — в штабе. Sztab wyborczy — предвыборный штаб. Szef sztabu — начальник штаба. Читается «штап»."
