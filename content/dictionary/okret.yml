# review
id: okret
format: 2
lemma: "okręt"
rank: 1947
pos: noun
pron: { cyr: "о́крэнт" }
senses:
  - id: warship
    ru: "корабль (военный)"
    examples:
      - pl: "Okręt zniknął za horyzontem."
        ru: "Корабль исчез за горизонтом."
        source: { kind: translated, id: 1170271 }
      - pl: "Kilka amerykańskich okrętów wojennych zostało wysłanych do Panamy."
        ru: "Несколько американских военных кораблей было отправлено в Панаму."
        source: { kind: translated, id: 3031562 }
      - pl: "Na tych okrętach byli żołnierze."
        ru: "На этих кораблях были солдаты."
        source: { kind: translated, id: 982497 }
      - pl: "Duże okręty podwodne mają małe okna."
        ru: "У больших подводных лодок маленькие окна."
        source: { kind: translated, id: 11367224 }
      - pl: "Okręt wojenny wpłynął do portu."
        ru: "Военный корабль вошёл в порт."
        source: { kind: authored }
      - pl: "Na pokładzie okrętu było sto osób."
        ru: "На борту корабля было сто человек."
        source: { kind: authored }
  - id: figurative
    ru: "в устойчивых оборотах"
    examples:
      - pl: "Szczury uciekają z tonącego okrętu."
        ru: "Крысы бегут с тонущего корабля."
        source: { kind: translated, id: 365385 }
      - pl: "Można powiedzieć, że wielbłąd to okręt pustyni."
        ru: "Можно сказать, что верблюд — корабль пустыни."
        source: { kind: translated, id: 780322 }
notes:
  - { kind: usage, text: "Рядом с карточкой statek: statek — судно вообще, okręt — военный корабль. Гражданское судно okrętem не называют." }
  - { kind: usage, text: "Подводная лодка — okręt podwodny, буквально «подводный корабль»." }
  - { kind: usage, text: "Оборот uciekać jak szczury z tonącego okrętu — «бежать как крысы с тонущего корабля», точный двойник русского." }
collocations:
  - { pl: "okręt wojenny", ru: "военный корабль" }
  - { pl: "okręt podwodny", ru: "подводная лодка" }
  - { pl: "tonący okręt", ru: "тонущий корабль" }
etymology: "Из средневерхненемецкого anker «якорь» через старопольское okręt, с переосмыслением по глаголу okręcić «обвязать». Русский «корабль» — другой корень, поэтому слово нужно запомнить отдельно."
memory: "okręt — военный корабль, а гражданское судно — statek. Подводная лодка тоже okręt: okręt podwodny."
idioms:
  - { pl: "okręt wojenny", ru: "военный корабль" }
  - { pl: "okręt podwodny", ru: "подводная лодка" }
  - { pl: "szczury uciekają z tonącego okrętu", ru: "крысы бегут с тонущего корабля" }
