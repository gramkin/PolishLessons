# review
id: zabojczy
format: 2
lemma: "zabójczy"
rank: 3724
pos: adj
pron: { cyr: "забу́йчы" }
senses:
  - id: deadly
    ru: "смертельный, смертоносный"
    examples:
      - pl: "To zabójczy wirus."
        ru: "Это смертоносный вирус."
        source: { kind: authored }
      - pl: "Dawka okazała się zabójcza."
        ru: "Доза оказалась смертельной."
        source: { kind: authored }
      - pl: "Upał bywa zabójczy dla starszych ludzi."
        ru: "Жара бывает смертельно опасна для пожилых людей."
        source: { kind: authored }
  - id: killer
    ru: "разг. убийственный, сногсшибательный"
    examples:
      - pl: "Miała zabójczy uśmiech."
        ru: "У неё была убийственная улыбка."
        source: { kind: authored }
      - pl: "Tempo pracy było zabójcze."
        ru: "Темп работы был убийственным."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Русское «убийственный» и польское ZABÓJCZY совпадают в обоих смыслах: и «смертельный», и «сногсшибательный». Но корень разный на слух: польское ZABÓJCZY от ZABÓJCA, «убийца», а не от ZABIĆ напрямую. Русское «забойный» (о скоте, о шахте) — ложный друг: польское ZABÓJCZY с бойней не связано." }
  - { kind: usage, text: "Сравнивается описательно: BARDZIEJ ZABÓJCZY. В карточке десять форм: мужское-личное множественное ZABÓJCZY совпадает с именительным единственного. Людей так называют редко, в шутку: ZABÓJCZO PRZYSTOJNY, «убийственно красив», — тут работает наречие." }
  - { kind: government, text: "Смертельный для кого-то — ZABÓJCZY DLA KOGOŚ, DLA с родительным: ZABÓJCZY DLA PSÓW. Само прилагательное падежа не требует. Ставится и до, и после существительного: ZABÓJCZY CIOS, BROŃ ZABÓJCZA." }
  - { kind: pronunciation, text: "Читается «забу́йчы», три слога, ударение на предпоследнем. Ó — «у», J — «й», CZY — твёрдое «чы». Сравните с ZABÓJCA «забу́йца»." }
  - { kind: register, text: "В первом значении нейтральное и газетное: ZABÓJCZA CHOROBA, ZABÓJCZY UPAŁ. Во втором — разговорное, восторженное или ироничное: ZABÓJCZA KIECKA, «сногсшибательное платье», ZABÓJCZE KORKI, «убийственные пробки»." }
collocations:
  - { pl: "zabójczy wirus", ru: "смертоносный вирус" }
  - { pl: "zabójczy uśmiech", ru: "убийственная улыбка" }
  - { pl: "zabójcze tempo", ru: "убийственный темп" }
family:
  - { pl: "zabójca", ru: "убийца", relation: root, id: zabojca }
  - { pl: "zabić", ru: "убить", relation: root, id: zabic }
  - { pl: "zabójstwo", ru: "убийство", relation: derived, id: zabojstwo }
etymology: "От ZABÓJCA «убийца», а то от ZABIĆ «убить» с приставкой ZA- и корнем BIĆ, «бить». Русское «убить» и польское ZABIĆ собраны из одного корня с разными приставками. Польское Ó в ZABÓJCA — обычное чередование с O: BÓJ «бой», но BOJU."
memory: "Zabójczy — смертельный: zabójczy wirus, dawka zabójcza. И убийственный: zabójczy uśmiech. От zabójca — убийца. Читается «забу́йчы»."
idioms:
  - { pl: "zabójczo przystojny", ru: "убийственно красив" }
