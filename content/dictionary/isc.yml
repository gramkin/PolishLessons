# review
id: isc
format: 2
lemma: "iść"
rank: 69
pos: verb
aspect: imperf
pron: { cyr: "исьць" }
senses:
  - id: walk
    ru: "идти (пешком, в одном направлении)"
    examples:
      - pl: "Idę."
        ru: "Я пойду."
        source: { kind: tatoeba, id: 349055 }
      - pl: "Możesz iść."
        ru: "Ты можешь идти."
        source: { kind: tatoeba, id: 524744 }
      - pl: "Patrz, on idzie."
        ru: "Смотри, он идёт."
        source: { kind: tatoeba, id: 524703 }
  - id: go-on
    ru: "идти (о делах, времени, событиях)"
    examples:
      - pl: "jak idzie biznes?"
        ru: "Как идет бизнес?"
        source: { kind: tatoeba, id: 4748315 }
      - pl: "Czas szybko idzie."
        ru: "Время быстро идёт."
        source: { kind: authored }
notes:
  - { kind: usage, text: "iść — однонаправленное движение «сейчас»; регулярное движение передаёт chodzić: Idę do szkoły «иду (сейчас)», Chodzę do szkoły «хожу в школу»." }
  - { kind: usage, text: "Прошедшее время образуется от другой основы: szedł, szła, szli — как русское «шёл, шла, шли»." }
collocations:
  - { pl: "iść do domu", ru: "идти домой" }
  - { pl: "iść pieszo", ru: "идти пешком" }
  - { pl: "jak idzie?", ru: "как дела?" }
etymology: "Старопольское ić из праславянского *jьti «идти» — то же слово, что русское «идти»; прошедшее время идёт от другой основы *šьd- (ср. «шёл»)."
memory: "Супплетивность та же, что в русском: iść → szedł, szła, szli («идти → шёл, шла, шли»). И держите в голове пару: iść — движение сейчас и в одну сторону, chodzić — регулярное. Idę do szkoły «иду», Chodzę do szkoły «хожу»."
idioms:
  - { pl: "iść jak po maśle", ru: "идти как по маслу" }
  - { pl: "iść na całość", ru: "идти ва-банк" }
  - { pl: "iść do diabła", ru: "идти к чёрту" }
  - { pl: "jak idzie?", ru: "как дела?" }
