notes:
  - { kind: usage, text: "Форм одиннадцать, степеней сравнения нет: слово относит к стране, а не измеряет качество. Это шестое такое прилагательное после fizyczny, miejscowy, kredytowy, sądowy и włoski. Напомню различие, которое вывела карточка LETNI: одиннадцать форм бывает у твёрдой основы, десять у мягкой, потому что у мягкой мужская личная форма множественного совпадает с именительным единственного. Здесь основа твёрдая, и формы расходятся." }
  - { kind: usage, text: "Мужская личная форма множественного — BRYTYJSCY: сочетание -ski даёт -scy, то есть k переходит в c. Так же POLSKI даёт POLSCY, WŁOSKI даёт WŁOSCY, RUSKI даёт RUSCY. У прилагательных на -ski это правило работает без исключений, и его стоит выучить как единое целое: -ski во множественном мужском личном всегда -scy." }
  - { kind: false-friend, text: "Польский различает BRYTYJSKI и ANGIELSKI строже, чем русский обиходный язык. Brytyjski относится к Великобритании целиком, angielski — только к Англии: brytyjski premier возглавляет всё королевство, angielska herbata пьётся в Англии. Русский сплошь говорит «английский» и про британское, и про английское, и эта привычка переносится в польский как ошибка. Отметьте и правописание: прилагательное пишется со строчной — brytyjski, — тогда как существительное BRYTYJCZYK «британец» с заглавной, как и все названия народов." }
