etymology: "От BRYTANIA, из латинского Britannia — названия, которым римляне обозначили остров, услышав его от местных кельтских племён. Русское «британский» пришло тем же книжным путём и из того же латинского источника, так что слова совпадают. Разница только в употреблении: польский держит границу между brytyjski и angielski, а русский в быту ею пренебрегает."
memory: "Одиннадцать форм, степеней нет. Мужское личное множественное brytyjscy: -ski даёт -scy, как polscy, włoscy. И brytyjski — не то же, что angielski."
