notes:
  - { kind: usage, text: "Форм одиннадцать, собственной сравнительной степени нет: «мокрее» передаётся описательно, BARDZIEJ MOKRY. Но причина здесь не та, что у fizyczny или kredytowy. Те относят предмет к разряду и сравнению не поддаются вовсе; mokry — обычное качественное прилагательное, просто синтетических степеней у него не образовалось. Число форм само по себе ничего не говорит о причине, её надо читать по значению слова." }
  - { kind: pronunciation, text: "Мужская личная форма множественного — MOKRZY, с переходом r в rz. Та же мена, что в bystry — bystrzy и в предложном teatrze: смягчает r любое переднее -i или -e, которое за ним встаёт. Остальные формы r сохраняют: mokrych, mokrym, mokrymi." }
collocations:
  - { pl: "mokre włosy", ru: "мокрые волосы" }
  - { pl: "mokra podłoga", ru: "мокрый пол" }
  - { pl: "mokry od deszczu", ru: "мокрый от дождя" }
family:
  - { pl: "mokro", ru: "мокро", relation: derived }
  - { pl: "moknąć", ru: "мокнуть", relation: root }
  - { pl: "suchy", ru: "сухой", relation: antonym, id: suchy }
etymology: "Из праславянского *mokrъ — то же слово, что русское «мокрый», без расхождений ни в форме, ни в значении. От него же moknąć «мокнуть» и mokro «мокро». Польский отличает mokry «мокрый» от WILGOTNY «влажный» так же, как и мы, так что пара переносится напрямую."
memory: "Одиннадцать форм, потому что нет синтетических степеней: «мокрее» будет bardziej mokry. А мужская личная форма — mokrzy, с rz, как bystrzy."
idioms:
  - { pl: "mokra robota", ru: "мокрое дело" }
  - { pl: "mokry jak mysz", ru: "мокрый как мышь" }
