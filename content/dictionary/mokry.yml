senses:
  - id: wet
    ru: "мокрый"
    examples:
      - pl: "Mokry płaszcz wisi w przedpokoju."
        ru: "Мокрый плащ висит в прихожей."
        source: { kind: authored }
      - pl: "Podłoga jest jeszcze mokra."
