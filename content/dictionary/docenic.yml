# review
id: docenic
format: 2
lemma: "docenić"
rank: 4504
pos: verb
pron: { cyr: "доце́ниць" }
senses:
  - id: appreciate
    ru: "оценить по достоинству, признать"
    examples:
      - pl: "Szef docenił moją pracę."
        ru: "Шеф оценил мою работу по достоинству."
        source: { kind: authored }
      - pl: "Docenisz to, kiedy dorośniesz."
        ru: "Ты оценишь это, когда вырастешь."
        source: { kind: authored }
      - pl: "Krytycy docenili jego debiut."
        ru: "Критики оценили его дебют."
        source: { kind: authored }
  - id: underestimate
    ru: "недооценить (nie docenić)"
    examples:
      - pl: "Nie doceniłem przeciwnika."
        ru: "Я недооценил противника."
        source: { kind: authored }
      - pl: "Nie doceniła powagi sytuacji."
        ru: "Она недооценила серьёзность ситуации."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "DOCENIĆ — именно русское «оценить» в смысле «по достоинству»: DOCENIĆ CZYJĄŚ POMOC, «оценить чью-то помощь». OCENIĆ — «поставить оценку». С отрицанием NIE DOCENIĆ — «недооценить»: NIE DOCENIŁ RYWALA. Обратное «переоценить» — PRZECENIĆ." }
  - { kind: usage, text: "Пятьдесят три формы — подпись переходного глагола совершенного вида: страдательное DOCENIONY и деепричастие DOCENIWSZY. Повелительное DOCEŃ — с мягким Ń. Видовой партнёр — DOCENIAĆ: DOCENIAM TWOJĄ SZCZEROŚĆ, «я ценю твою искренность»." }
  - { kind: government, text: "Что или кого — винительный: DOCENIĆ WYSIŁEK, DOCENIĆ PRACOWNIKA. С отрицанием — родительный: NIE DOCENIŁ ZAGROŻENIA. За что — ZA с винительным: DOCENIĆ KOGOŚ ZA ODWAGĘ." }
  - { kind: pronunciation, text: "Читается «доце́ниць», три слога, ударение на предпоследнем. C — «ц», NI — мягкое «ни», конечное Ć — «ць». DOCEŃ — «до́цень»." }
  - { kind: register, text: "Нейтральное и тёплое слово благодарности и признания: BARDZO TO DOCENIAM, «я очень это ценю». NIEDOCENIONY — «недооценённый»: NIEDOCENIONY ARTYSTA." }
collocations:
  - { pl: "docenić czyjąś pracę", ru: "оценить чью-то работу" }
  - { pl: "nie docenić przeciwnika", ru: "недооценить противника" }
  - { pl: "niedoceniony artysta", ru: "недооценённый художник" }
family:
  - { pl: "doceniać", ru: "ценить, признавать", relation: aspect, id: doceniac }
  - { pl: "ocenić", ru: "оценить, дать оценку", relation: root, id: ocenic }
  - { pl: "cena", ru: "цена", relation: root, id: cena }
etymology: "Приставка DO- «до-, вполне» плюс CENIĆ «ценить», от CENA «цена». Буквально «доценить» — оценить до конца, полностью, по достоинству."
memory: "Docenić — оценить по достоинству: docenić pomoc. Nie docenić — недооценить. Ocenić — поставить оценку. Doceniam — ценю. Читается «доце́ниць»."
idioms:
  - { pl: "nie docenić przeciwnika", ru: "недооценить противника" }
