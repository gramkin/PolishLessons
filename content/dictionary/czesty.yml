etymology: "Общеславянское *čęstъ, «густой, частый», того же корня, что русское «частый» и «часто». Польское носовое Ę на месте русского «а» — постоянное соответствие: CZĘSTY — «частый», PIĘĆ — «пять». Польский утратил значение «густой», отдав его GĘSTY."
memory: "Częsty — частый: częsty gość, częsty błąd. Częstszy, najczęstszy: najczęstsze pytania — FAQ. Густой — gęsty, не częsty. Читается «чэ́нсты»."
