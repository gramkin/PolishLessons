notes:
  - { kind: false-friend, text: "Совпадение с русским «частый» почти полное, и корень тот же, только с носовым Ę: CZĘSTY — «частый». Но русское «частый» ещё значит «густой»: «частый лес», «частый гребень». Польское CZĘSTY так не говорят: густой лес — GĘSTY LAS. Не путайте и с CZYSTY, «чистый»: разница в одной гласной." }
  - { kind: usage, text: "Полная парадигма с простыми степенями: CZĘSTY, CZĘSTSZY, NAJCZĘSTSZY. Превосходная степень очень частотна: NAJCZĘSTSZY BŁĄD, NAJCZĘSTSZE PYTANIA. Форма для мужчин-людей положительной степени, CZĘŚCI, в карточку не включена: она совпадает с формами CZĘŚĆ, «часть», и о людях почти не употребляется. CZĘSTSI и NAJCZĘSTSI возможны: NAJCZĘSTSI GOŚCIE." }
  - { kind: government, text: "Ставится перед существительным: CZĘSTY GOŚĆ, CZĘSTE PYTANIA. В сравнении: CZĘSTSZY NIŻ, CZĘSTSZY OD. Наречие CZĘSTO, «часто», ещё частотнее прилагательного." }
  - { kind: pronunciation, text: "Читается «чэ́нсты», два слога, ударение на первом. Ę перед S звучит «эн». В CZĘSTSZY скопление согласных STSZ: «чэ́нстшы», и T выговаривается коротко." }
  - { kind: register, text: "Нейтральное слово на все случаи. В интернете NAJCZĘSTSZE PYTANIA, сокращённо FAQ, — «часто задаваемые вопросы». В медицине CZĘSTE ODDAWANIE MOCZU, «частое мочеиспускание», — стандартный термин." }
