etymology: "Из латинского CAMINATA «комната с камином», через итальянский. Русское «комната» — то же слово, но в польском оно стало книжным, а место заняло POKÓJ."
memory: "Komnata — покои во дворце; комната в квартире — pokój. Komnaty królewskie — королевские покои. Читается «комна́та»."
