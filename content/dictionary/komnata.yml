        source: { kind: authored }
  - id: vault
    ru: "тайная комната, зала (в сказках, играх)"
    examples:
      - pl: "Skarb był ukryty w tajnej komnacie."
        ru: "Сокровище было спрятано в потайной комнате."
        source: { kind: authored }
      - pl: "Harry Potter i Komnata Tajemnic to druga część serii."
        ru: "«Гарри Поттер и Тайная комната» — вторая часть серии."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "KOMNATA — не обычная «комната»! Комната в квартире — POKÓJ. KOMNATA — «покои, палата» во дворце или замке, книжное и сказочное слово. KOMNATY KRÓLEWSKIE — «королевские покои»." }
  - { kind: usage, text: "Девять форм, женский род. В местном T переходит в C: W KOMNACIE. Родительный множественного — KOMNAT. Звательный KOMNATO не употребляется." }
  - { kind: government, text: "В покоях — W KOMNACIE, местный. Войти в покои — WEJŚĆ DO KOMNATY, родительный. Королевские покои — KOMNATY KRÓLEWSKIE." }
  - { kind: pronunciation, text: "Читается «комна́та», ударение на предпоследнем слоге, как в русском. KOMNACIE — «комна́це»." }
collocations:
  - { pl: "komnaty królewskie", ru: "королевские покои" }
  - { pl: "tajna komnata", ru: "потайная комната" }
  - { pl: "komnata tortur", ru: "пыточная" }
