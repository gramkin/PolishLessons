# review
id: plecy
format: 2
lemma: "plecy"
rank: 1066
pos: noun
pron: { cyr: "пле́цы" }
senses:
  - id: back
    ru: "спина"
    note: "Слово существует только во множественном числе."
    examples:
      - pl: "Bolą ją plecy."
        ru: "У неё болит спина."
        source: { kind: tatoeba, id: 3743792 }
      - pl: "Leżałam na plecach i patrzyłam na chmury."
        ru: "Я лежала на спине и смотрела на облака."
        source: { kind: tatoeba, id: 6300556 }
      - pl: "Tom narzekał na ból pleców."
        ru: "Том жаловался на боль в спине."
        source: { kind: translated, id: 8823029 }
  - id: behind
    ru: "za plecami — за спиной, тайком"
    examples:
      - pl: "Nie obgaduj go za plecami."
        ru: "Не обсуждай его за спиной."
        source: { kind: translated, id: 758349 }
      - pl: "Usłyszeli hałas za plecami."
        ru: "Они услышали шум за спиной."
        source: { kind: translated, id: 411510 }
  - id: backing
    ru: "mieć plecy — иметь связи, покровителей"
    examples:
      - pl: "On ma mocne plecy w ministerstwie."
        ru: "У него крепкие связи в министерстве."
        source: { kind: authored }
      - pl: "Bez pleców nic tu nie załatwisz."
        ru: "Без связей здесь ничего не добьёшься."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Главная ловушка: plecy — это «спина», а не «плечи». Русские «плечи» по-польски ramiona или barki." }
  - { kind: usage, text: "Слово только множественного числа: plecy, pleców, plecach. Единственного числа у него нет, в отличие от русской «спины»: Bolą mnie plecy «У меня болит спина»." }
  - { kind: usage, text: "za plecami значит «за спиной, тайком»: Nie obgaduj go za plecami «Не обсуждай его за спиной»." }
  - { kind: usage, text: "mieć plecy — «иметь покровителей, связи». Переносного значения у русской «спины» нет, зато есть у «руки»: «по блату»." }
collocations:
  - { pl: "ból pleców", ru: "боль в спине" }
  - { pl: "za plecami", ru: "за спиной" }
  - { pl: "na plecach", ru: "на спине" }
  - { pl: "mieć plecy", ru: "иметь связи" }
family:
  - { pl: "plecak", ru: "рюкзак", relation: derived }
  - { pl: "plecowy", ru: "спинной", relation: derived }
etymology: "Праславянское *pletje, родственное русским «плечам». Значения разошлись: польское plecy — это «спина», а «плечи» по-польски ramiona."
memory: "plecy — «спина», и только во множественном числе: Bolą mnie plecy «У меня болит спина». Не путайте с русскими «плечами» — те по-польски ramiona. А mieć plecy значит «иметь связи»."
idioms:
  - { pl: "za plecami", ru: "за спиной" }
  - { pl: "mieć mocne plecy", ru: "иметь крепкие связи" }
  - { pl: "wbić nóż w plecy", ru: "вонзить нож в спину" }
