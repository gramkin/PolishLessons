# review
id: wyciagac
format: 2
lemma: "wyciągać"
rank: 2540
pos: verb
pron: { cyr: "выцё́нгаць" }
senses:
  - id: pull-out
    ru: "вытаскивать, вынимать"
    examples:
      - pl: "Wyciągał z kieszeni garść drobnych."
        ru: "Он вытаскивал из кармана горсть мелочи."
        source: { kind: authored }
      - pl: "Strażacy wyciągali rannych z wraku."
        ru: "Пожарные вытаскивали раненых из обломков."
        source: { kind: authored }
  - id: stretch
    ru: "протягивать (руку)"
    examples:
      - pl: "Wyciągała rękę po sól, nie wstając od stołu."
        ru: "Она тянулась рукой за солью, не вставая из-за стола."
        source: { kind: authored }
      - pl: "Dziecko wyciąga ręce do matki."
        ru: "Ребёнок протягивает руки к матери."
        source: { kind: authored }
  - id: conclude
    ru: "делать (выводы)"
    examples:
      - pl: "Nie wyciągaj pochopnych wniosków."
        ru: "Не делай поспешных выводов."
        source: { kind: authored }
notes:
  - { kind: government, text: "РУКУ ПРОТЯГИВАЮТ PO COŚ — С ВИНИТЕЛЬНЫМ. Wyciągnąć rękę PO sól, PO chleb, PO nagrodę. Русский в этом месте ставит творительный с предлогом «за»: «протянуть руку ЗА солью». А вот к человеку рука тянется DO kogoś: wyciągać ręce DO matki «протягивать руки к матери». Три предлога на один русский жест, и ни один не совпадает буквально." }
  - { kind: usage, text: "WYCIĄGAĆ WNIOSKI — «делать выводы». Поляк вывод вытаскивает, русский его делает, и калька «robić wnioski» звучит по-польски неправильно. Так же работает wyciągnąć kogoś z opresji «вытащить кого-л. из беды» — тут образы как раз совпадают." }
  - { kind: usage, text: "Вид несовершенный, так что WYCIĄGAM — это настоящее «вытаскиваю», а не будущее. Совершенная пара WYCIĄGNĄĆ с -ną-: wyciągnę, wyciągnął. Разница та же, что между «вытаскивать» и «вытащить», и видна прямо в суффиксе." }
collocations:
  - { pl: "wyciągać rękę", ru: "протягивать руку" }
  - { pl: "wyciągać wnioski", ru: "делать выводы" }
  - { pl: "wyciągać z kieszeni", ru: "вытаскивать из кармана" }
family:
  - { pl: "wyciągnąć", ru: "вытащить (сов.)", relation: aspect, id: wyciagnac }
  - { pl: "ciągnąć", ru: "тянуть", relation: root, id: ciagnac }
  - { pl: "pociągać", ru: "притягивать, привлекать", relation: root }
etymology: "Приставка wy- «вы-» и ciągnąć, из праславянского *tęgnǫti «тянуть». Русское «тянуть» и польское ciągnąć — одно слово: праславянское t перед носовым ę дало в польском ć, отсюда ciąg при русской «тяге». Так что wyciągać буквально разбирается как «вы-тягивать», морфема в морфему."
memory: "wyciągać wnioski — выводы по-польски вытаскивают, а не делают: «robić wnioski» сказать нельзя. И запомни предлог: рука тянется PO coś с винительным (wyciągnąć rękę po sól), а не «за» чем-то."
idioms:
  - { pl: "wyciągać wnioski", ru: "делать выводы" }
  - { pl: "wyciągnąć kogoś z opresji", ru: "вытащить кого-л. из беды" }
