notes:
  - { kind: false-friend, text: "ПОЛЬСКОЕ CHWAŁA — ЭТО «СЛАВА», А НЕ «ХВАЛА». Chwała Bogu значит «слава Богу», wieczna chwała — «вечная слава». Русская «хвала» уже и книжнее: это похвала, одобрение. А польское SŁAWA смещено в сторону «известности, репутации», так что пара слов как бы поменялась местами." }
  - { kind: usage, text: "Дательный и предложный — CHWALE, с переходом ł→l: w chwale, służyć chwale. Так же ведут себя szkoła → szkole и siła → sile. Это тот же тип чередования, что в stół → stole, только в женском склонении." }
  - { kind: pronunciation, text: "Два слога, ударение на первом: CHWA-ła. Ch читается как х, и следующее w перед ним оглушается до ф, поэтому выходит «хфа́уа», а не «хва́ла». Конечное ł — краткое у." }
collocations:
  - { pl: "Chwała Bogu", ru: "слава Богу" }
  - { pl: "wieczna chwała", ru: "вечная слава" }
  - { pl: "okryć się chwałą", ru: "покрыться славой" }
family:
  - { pl: "chwalić", ru: "хвалить", relation: root }
  - { pl: "sława", ru: "известность, слава", relation: root }
  - { pl: "hańba", ru: "позор", relation: antonym, id: hanba }
etymology: "Из праславянского *xvala, того же, что русское «хвала» и «хвалить». Значение в польском расширилось от «похвалы» до «славы», особенно в церковном языке, где chwała переводило латинское gloria. Отсюда chwalić «хвалить» и pochwała «похвала»."
memory: "chwała — «слава», а не «хвала»: Chwała Bogu «слава Богу». Корень тот же, что в русском «хвалить». Дательный и предложный — chwale, с ł→l, как szkoła → szkole."
