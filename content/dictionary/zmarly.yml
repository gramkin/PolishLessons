notes:
  - { kind: false-friend, text: "Ловушки нет, есть прямое родство: zmarły — причастие от zemrzeć «умереть», корень тот же, что в русских «умереть», «мёртвый», «смерть», «мор». Так что слово читается как «умерший», и в роли прилагательного его точнее переводить «покойный»: zmarły ojciec — «покойный отец»." }
  - { kind: usage, text: "Слово свободно превращается в существительное: zmarły значит не только «умерший», но и «покойный, усопший» само по себе, без опоры на другое слово. Отсюда rodzina zmarłego «семья покойного» и Dzień Zmarłych «День поминовения усопших». В русском такая субстантивация тоже есть («покойный», «усопшие»), так что модель знакома." }
  - { kind: government, text: "Мужско-личная форма множественного — zmarli (о людях), остальные формы множественного дают zmarłe. Поминать кого-то — за кого: modlić się za zmarłych (винительный с za), а говорить о кому — o zmarłym, o zmarłych (предложный)." }
  - { kind: pronunciation, text: "Буква ł звучит как русское неслоговое «у» (почти как w в английском), поэтому zmarły — это «зма́руы», а не «змарлы». Конечное y передаётся русским «ы»." }
collocations:
  - { pl: "zmarły ojciec", ru: "покойный отец" }
  - { pl: "rodzina zmarłego", ru: "семья покойного" }
  - { pl: "Dzień Zmarłych", ru: "День поминовения усопших" }
family:
  - { pl: "umrzeć", ru: "умереть", relation: root, id: umrzec }
  - { pl: "śmierć", ru: "смерть", relation: root, id: smierc }
  - { pl: "umarły", ru: "умерший", relation: derived }
etymology: "Причастие прошедшего времени от zemrzeć «умереть», от mrzeć, праславянское *merti. Это тот же корень, что в русских «умереть», «мёртвый», «смерть» и «мор», и далее в латинском mors и mortalis. Польская форма сохранила чередование, видное и в русском: умирать — умерший, umierać — zmarły."
memory: "zmarły — «покойный, умерший», от того же корня *merti, что русские «умереть» и «смерть». Помните, что слово само работает как существительное: rodzina zmarłego «семья покойного». И ł читается как «у»: «зма́руы»."
idioms:
  - { pl: "Dzień Zmarłych", ru: "День поминовения усопших" }
  - { pl: "o zmarłych tylko dobrze", ru: "о покойных только хорошее" }
