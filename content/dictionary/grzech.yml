notes:
  - { kind: usage, text: "grzech pierworodny — «первородный грех»; siedem grzechów głównych — «семь смертных грехов». Обратите внимание: по-польски они główne «главные», а не «смертные»." }
  - { kind: usage, text: "Отдельно есть grzech śmiertelny «смертный грех» — грех, ведущий к гибели души." }
  - { kind: false-friend, text: "Разговорное Grzech narzekać значит не «жаловаться грешно перед Богом», а просто «грех жаловаться», то есть «жаловаться не на что»." }
  - { kind: government, text: "Каяться в грехах — spowiadać się z grzechów (родительный падеж с предлогом z); искупить грех — odpokutować za grzech (винительный с za)." }
collocations:
