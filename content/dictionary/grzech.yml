etymology: "Праславянское *grěxъ — то же слово, что русское «грех»; польское rz здесь выросло из мягкого r перед старым ě, как в rzeka «река»."
memory: "grzech — «грех», слово в слово. Запомните только rz на месте русского «р»: грех → grzech, как «река» → rzeka. И что семь смертных грехов по-польски siedem grzechów głównych — «главных»."
