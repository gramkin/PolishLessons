notes:
  - { kind: false-friend, text: "SIATKA — «сетка» во всех смыслах: забор, теннисная сетка, сетка от комаров. В быту это ещё сумка для покупок, наша «авоська», а сегодня и любой пакет: WEŹ SIATKĘ — «возьми пакет». По правилу -ÓWKA от неё образовано SIATKÓWKA — и «волейбол», игра через сетку, и «сетчатка» глаза. Волейболист — SIATKARZ." }
  - { kind: usage, text: "Десять форм в таблице, женский род. В дательном и местном падежах K переходит в C: NA SIATCE. В родительном множественного беглое E: SIATEK. Звательная форма не нужна." }
  - { kind: government, text: "Попасть в сетку — TRAFIĆ W SIATKĘ, W с винительным. Огородить сеткой — OGRODZIĆ SIATKĄ, творительный. Сумка для покупок — SIATKA NA ZAKUPY, NA с винительным." }
  - { kind: pronunciation, text: "Читается «ся́тка», два слога, ударение на первом. SIA сливается в мягкое «ся», как в SIEĆ «сець». В форме SIATCE: «ся́тце»." }
  - { kind: register, text: "SIATKA BEZPIECZEŃSTWA — «страховочная сетка», и в цирке, и в экономике: о пособиях, которые не дают человеку упасть. SIATKA SZPIEGOWSKA — шпионская сеть, газетное." }
collocations:
  - { pl: "siatka na zakupy", ru: "сумка для покупок" }
  - { pl: "siatka ogrodzeniowa", ru: "сетка для забора" }
  - { pl: "siatka połączeń", ru: "сетка маршрутов" }
family:
  - { pl: "sieć", ru: "сеть", relation: root, id: siec }
  - { pl: "siatkówka", ru: "волейбол; сетчатка", relation: derived }
  - { pl: "siatkarz", ru: "волейболист", relation: derived }
etymology: "Уменьшительное от SIEĆ «сеть», праславянского слова, общего с русским. Польское SIA на месте «се» — то же чередование, что в SIEDZIEĆ и SIADAĆ: перед твёрдым согласным E переходит в A."
memory: "Siatka — сетка и авоська: siatka na zakupy. Читается «ся́тка». Siatkówka — волейбол и сетчатка, siatkarz — волейболист. Siatka bezpieczeństwa — страховочная сетка."
idioms:
  - { pl: "siatka bezpieczeństwa", ru: "страховочная сетка, подстраховка" }
  - { pl: "siatka szpiegowska", ru: "шпионская сеть" }
formExamplesSkip:
