senses:
  - id: net
    ru: "сетка (ограждение, в спорте, от комаров)"
    examples:
      - pl: "Ogród otoczono siatką."
        ru: "Сад огородили сеткой."
        source: { kind: authored }
      - pl: "Piłka trafiła w siatkę."
