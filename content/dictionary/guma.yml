notes:
  - { kind: usage, text: "Слово покрывает всё резиновое сразу, и уточняет назначение определение: GUMA DO ŻUCIA «жевательная резинка», GUMA DO WŁOSÓW «резинка для волос». Ластик называется иначе, уменьшительным: GUMKA, и различие стоит запомнить отдельно — GUMKA всегда предмет, GUMA чаще материал. Идиома ZŁAPAĆ GUMĘ значит «проколоть шину», буквально «схватить резину», и она уже встречалась в карточке OPONA. В разговоре GUMA без уточнения чаще всего значит жвачку." }
  - { kind: pronunciation, text: "Читается «гу́ма», ударение на первом слоге из двух. Буква G даёт твёрдое «г», как в русском. В дательном и местном падеже GUMIE согласная M смягчается перед -IE и звучит «ме»: «гу́ме». Все гласные открытые, без редукции: конечное A звучит полным «а», а не «ъ». Слово короткое и для русского лёгкое, поэтому отрабатывать стоит только мягкое M в местном падеже." }
  - { kind: government, text: "Женский род на -A, склонение правильное. Винительный на -Ę: ZŁAPAŁ GUMĘ. Назначение вводится предлогом DO с родительным: GUMA DO ŻUCIA, GUMA DO WŁOSÓW, и это общая польская модель для предметов по назначению, та же, что в DESKA DO KROJENIA. Материал — предлог Z с родительного: Z GUMY «из резины». При отрицании винительный уходит в родительный: NIE ZŁAPAŁ GUMY. Уменьшительное GUMKA склоняется по тому же образцу и даёт местный GUMCE, с переходом K в C." }
  - { kind: false-friend, text: "Русского однокоренного слова нет: русский в этом поле выбрал «резину», от латинского RESINA «смола», а польский взял GUMA, от латинского GUMMI и дальше от египетского названия древесной смолы. Поэтому обиходные слова не родственны, хотя оба пришли через латынь. Русское «гуммиарабик» сохраняет тот же корень, что польское GUMA, и через него связь можно восстановить, но в обиходной речи соответствия нет." }
collocations:
  - { pl: "guma do żucia", ru: "жевательная резинка" }
