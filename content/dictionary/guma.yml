etymology: "Из латинского GUMMI, а то из греческого KOMMI, которое само пришло из египетского названия древесной смолы. То есть слово старое и восточное по происхождению, и в Европу оно попало вместе с самим веществом — смолой акации, из которой делали клей. Русский в этом поле пошёл другим путём и взял «резину», от латинского RESINA «смола», так что соответствия между словами нет, хотя оба в конечном счёте латинские. След общего корня в русском остался в слове «гуммиарабик», буквально «арабская гумма», и именно через него связь с польским GUMA восстанавливается. Современное значение, резина как материал, появилось в девятнадцатом веке, когда вещество научились вулканизировать."
memory: "Покрывает всё резиновое: guma do żucia «жвачка», guma do włosów «резинка для волос». Ластик — gumka, уменьшительное: gumka всегда предмет, guma чаще материал. Идиома złapać gumę «проколоть шину», как в карточке opona. Русского родственника нет: русский взял «резину» от resina «смола», польский — gummi."
