notes:
  - { kind: false-friend, text: "Слово то же, что русский «темп», оба из итальянского TEMPO, но род разный, и это меняет всё склонение. Польское TEMPO — среднего рода и кончается на -O, поэтому согласуется по среднему: SZYBKIE TEMPO, TO TEMPO, а не «szybki tempo». Русский сделал слово мужским, «быстрый темп». Отсюда и формы расходятся: польский склоняет TEMPO как среднее существительное — TEMPA, TEMPU, TEMPEM, — а русский как мужское. Второе расхождение в числе: там, где русский говорит «темпы роста», польский обычно оставляет единственное, TEMPO WZROSTU. Множественное TEMPA в польском есть, но употребляется, когда темпов действительно несколько, например в музыке." }
  - { kind: government, text: "Средний род. Чего темп — родительный: TEMPO PRACY, TEMPO WZROSTU, TEMPO REFORM. «В таком темпе» — предлог W с местным: W TYM TEMPIE, W SZYBKIM TEMPIE. Частотные глаголы: NARZUCIĆ TEMPO «задать темп», UTRZYMAĆ TEMPO «удержать темп», ZWOLNIĆ TEMPO «сбавить темп», PRZYSPIESZYĆ TEMPO «ускорить темп». Прилагательные обычные: TEMPO SZYBKIE, WOLNE, RÓWNE, ZMIENNE. Выражение W ZAWROTNYM TEMPIE значит «в головокружительном темпе»." }
  - { kind: usage, text: "Склоняется как обычное среднее на -O, без чередований: TEMPO, TEMPA, TEMPU, TEMPO, TEMPEM, TEMPIE. Обратить внимание стоит на две вещи. Первая: форма TEMPA покрывает сразу родительный единственного и именительный с винительным множественного — одна форма, три позиции, как у всех средних на -O. Вторая: родительный множественного — TEMP, с нулевым окончанием, и это единственная форма, где слово выглядит непривычно коротко; вставная гласная не нужна, потому что MP на конце выговаривается легко. Местный TEMPIE смягчает P перед -IE." }
  - { kind: pronunciation, text: "Читается «тэ́мпо», два слога, ударение на первом. Буква E даёт «э» без смягчения предшествующего согласного, поэтому начало слова звучит «тэ», а не «те». Конечное O произносится полно, как «о», и не редуцируется до «а», как было бы в русском безударном слоге — это один из самых заметных признаков русского акцента в польском. В местном падеже TEMPIE сочетание PIE даёт мягкое «пе»: «тэ́мпе». В родительном множественного TEMP слог один: «тэмп», и звучит оно точно как русское «темп»." }
