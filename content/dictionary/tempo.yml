etymology: "Из итальянского TEMPO «время, такт», а то — из латинского TEMPUS «время», родительный TEMPORIS. Слово пришло в оба языка через музыкальную терминологию в восемнадцатом и девятнадцатом веках, и в обоих сохранило сначала музыкальный, а потом и общий смысл скорости. Разошлись языки в роде: польский принял итальянское слово как есть, с конечным -O, и потому отнёс его к среднему роду, куда в польском попадают почти все существительные на -O. Русский конечное -O отбросил и получил мужское «темп». Это общее правило при заимствованиях: польский чаще сохраняет исходную форму слова и приспосабливает к ней род, русский чаще приспосабливает слово к своему роду. От латинского TEMPUS в польском есть и прямые потомки через учёный путь: TEMPORALNY «временной». Сюда же относится TEMPEROWAĆ «точить карандаш», от латинского TEMPERARE «соразмерять»."
memory: "Оба языка взяли итальянское tempo, но польский оставил конечное -o и сделал слово средним: szybkie tempo, to tempo — не «szybki tempo». Русский отбросил -o и получил мужское «темп». Где русский говорит «темпы роста», польский обычно оставляет единственное: tempo wzrostu. Форма tempa покрывает родительный единственного и именительный с винительным множественного. Родительный множественного — короткое temp."
