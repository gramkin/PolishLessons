notes:
  - { kind: false-friend, text: "FEDERACJA — «федерация», как в русском. Но спортивную федерацию в Польше часто зовут ZWIĄZEK: POLSKI ZWIĄZEK PIŁKI NOŻNEJ, «Польский футбольный союз». Федеральный — FEDERALNY." }
  - { kind: usage, text: "Женский род. Родительный, дательный и местный — FEDERACJI. Множественное — FEDERACJE. Звательный и архаичное FEDERACYJ не используем." }
  - { kind: government, text: "Входить в федерацию — WCHODZIĆ W SKŁAD FEDERACJI, родительный. Федерация чего — родительный: FEDERACJA ZWIĄZKÓW. В федерации — W FEDERACJI." }
  - { kind: pronunciation, text: "Читается «фэдэра́цья»: оба E — твёрдые «э», CJA — «цья». Ударение на предпоследнем слоге." }
collocations:
