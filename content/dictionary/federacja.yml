etymology: "Из латинского FOEDERATIO «союз», от FOEDUS «договор». Русское «федерация» — то же слово."
memory: "Federacja — федерация. Federacja sportowa — спортивная федерация; часто związek. Federalny — федеральный. Читается «фэдэра́цья»."
