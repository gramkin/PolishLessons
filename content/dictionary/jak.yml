notes:
  - { kind: usage, text: "jak = «как» и в вопросе, и в сравнении. Конструкция jak najszybciej значит «как можно быстрее»." }
  - { kind: false-friend, text: "В словарной парадигме этого слова лежат формы животного jak («як») и прилагательного jaki («какой») — к союзу они отношения не имеют." }
collocations:
  - { pl: "jak długo", ru: "как долго" }
  - { pl: "jak najszybciej", ru: "как можно быстрее" }
  - { pl: "tak jak", ru: "так же как" }
etymology: "Праславянское *jakъ «какой, как» — тот же корень, что в русском «как» и украинском «як»."
memory: "jak = «как»: Jak się masz? «Как дела?», biały jak śnieg «белый как снег». Оборот jak najszybciej значит «как можно быстрее» — приставка naj- усиливает, как русское «наи-»."
