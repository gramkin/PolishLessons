  - { pl: "dopóty... dopóki", ru: "до тех пор... пока" }
etymology: "Из do + póki, а póki восходит к тому же корню, что русские «пока» и «покуда»."
memory: "dopóki — «пока, до тех пор пока», и почти всегда идёт с nie: dopóki nie wróci «пока он не вернётся». Внутри слова póki, родня русскому «пока»."
