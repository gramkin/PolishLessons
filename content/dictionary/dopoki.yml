# review
id: dopoki
format: 2
lemma: "dopóki"
rank: 477
pos: conj
pron: { cyr: "допу́ки" }
senses:
  - id: until
    ru: "пока не, до тех пор пока не"
    examples:
      - pl: "Poczekajmy tu dopóki nie wróci."
        ru: "Давайте подождём здесь, пока он не вернётся."
        source: { kind: tatoeba, id: 6155019 }
      - pl: "Zatrzymaj się, dopóki nie jest za późno."
        ru: "Остановиться, пока не поздно!"
        source: { kind: tatoeba, id: 6017147 }
      - pl: "Tom postanowił się nie odzywać, dopóki wszyscy pozostali nie wygłoszą swoich opinii."
        ru: "Том решил не отзываться, пока все остальные не выразят свои мнения."
        source: { kind: tatoeba, id: 4573263 }
  - id: while
    ru: "пока, покуда (без отрицания)"
    examples:
      - pl: "Dopóki nie skończysz osiemnastu lat, jestem za ciebie odpowiedzialny."
        ru: "Пока тебе нет восемнадцати, я несу за тебя ответственность."
        source: { kind: tatoeba, id: 12016271 }
      - pl: "Dopóki żyję, mam nadzieję."
        ru: "Пока живу, надеюсь."
        source: { kind: authored }
      - pl: "Dopóki jesteś tu, nic ci nie grozi."
        ru: "Пока ты здесь, тебе ничего не грозит."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Самая частая конструкция — dopóki nie «пока не»: Poczekajmy, dopóki nie wróci «Подождём, пока он не вернётся». Отрицание nie тут обязательно, как и в русском." }
  - { kind: usage, text: "Без nie слово значит просто «пока, покуда»: Dopóki żyję, mam nadzieję." }
  - { kind: usage, text: "Есть парный союз: dopóty… dopóki «до тех пор… пока»." }
  - { kind: usage, text: "Слово собрано из do + póki, а само póki родственно русскому «пока» и «покуда»." }
collocations:
