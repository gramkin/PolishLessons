# review
id: dzwonic
format: 2
lemma: "dzwonić"
rank: 338
pos: verb
aspect: imperf
aspectPair: zadzwonic
pron: { cyr: "дзво́ниць" }
senses:
  - id: call
    ru: "звонить (по телефону)"
    note: "Управление то же, что у zadzwonić: dzwonić do kogoś."
    examples:
      - pl: "Dzwonię do ciebie."
        ru: "Я тебе звоню."
        source: { kind: tatoeba, id: 13106668 }
      - pl: "Tom dzwoni do Mary."
        ru: "Том звонит Мэри."
        source: { kind: tatoeba, id: 12359936 }
      - pl: "On często do mnie dzwoni."
        ru: "Он мне часто звонит."
        source: { kind: tatoeba, id: 3649616 }
  - id: ring
    ru: "звонить, звенеть (о телефоне, колоколе)"
    examples:
      - pl: "Telefon przestał dzwonić."
        ru: "Телефон перестал звонить."
        source: { kind: translated, id: 3853638 }
      - pl: "Usłyszałem dzwoniący telefon."
        ru: "Я услышал звонящий телефон."
        source: { kind: translated, id: 596804 }
      - pl: "Tom usłyszał dzwony dzwoniące w oddali."
        ru: "Том услышал колокола, звонящие вдали."
        source: { kind: translated, id: 4848803 }
notes:
  - { kind: usage, text: "Управление: dzwonić do kogoś — буквально «звонить к кому-то», как и у совершенного zadzwonić." }
  - { kind: usage, text: "Совершенный вид — zadzwonić: Dzwonię codziennie «Звоню каждый день», но Zadzwonię jutro «Позвоню завтра»." }
  - { kind: usage, text: "Глагол описывает и сам звук: Telefon dzwoni «Телефон звонит», dzwony dzwonią «колокола звонят»." }
  - { kind: usage, text: "Корень dzwon «колокол» — родня русскому «звон»." }
collocations:
  - { pl: "dzwonić do kogoś", ru: "звонить кому-то" }
  - { pl: "telefon dzwoni", ru: "телефон звонит" }
  - { pl: "dzwoń do mnie", ru: "звони мне" }
  - { pl: "dzwonić na policję", ru: "звонить в полицию" }
etymology: "Праславянское *zvonìti, от dzwon «колокол»; то же гнездо, что русские «звон», «звонить»."
memory: "dzwonić — «звонить», сов. zadzwonić. Предлог тот же: dzwonić do kogoś. А корень dzwon «колокол» — родня русскому «звон»."
idioms:
  - { pl: "dzwonić na trwogę", ru: "бить тревогу" }
  - { pl: "telefon dzwoni", ru: "телефон звонит" }
  - { pl: "słyszy, że dzwonią, ale nie wie w którym kościele", ru: "слышал звон, да не знает, где он" }
