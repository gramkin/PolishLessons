# review
id: zjesc
format: 2
lemma: "zjeść"
rank: 477
pos: verb
aspect: perf
pron: { cyr: "зйесьць" }
senses:
  - id: eat-up
    ru: "съесть"
    examples:
      - pl: "Zjadła jedno jabłko."
        ru: "Она съела одно яблоко."
        source: { kind: tatoeba, id: 2810259 }
      - pl: "Tom zjadł swój obiad."
        ru: "Том съел свой обед."
        source: { kind: tatoeba, id: 4491090 }
      - pl: "Coś zjadłeś?"
        ru: "Ты что-то съел?"
        source: { kind: tatoeba, id: 13131058 }
  - id: have-meal
    ru: "съесть, поесть (о приёме пищи)"
    examples:
      - pl: "Zjedliście już obiad?"
        ru: "Вы уже пообедали?"
        source: { kind: translated, id: 8768521 }
      - pl: "Zjesz coś?"
        ru: "Съешь что-нибудь?"
        source: { kind: translated, id: 997663 }
      - pl: "Zjem rybę."
        ru: "Я съем рыбу."
        source: { kind: translated, id: 3846627 }
notes:
  - { kind: usage, text: "Совершенный вид к jeść. Будущее берёт ту же основу, что jeść: zjem, zjesz, zje — как jem, jesz, je." }
  - { kind: usage, text: "Поляк говорит zjeść śniadanie «съесть завтрак», zjeść obiad «съесть обед» там, где русский обходится одним глаголом «позавтракать», «пообедать»." }
  - { kind: usage, text: "zjeść konia z kopytami — «съесть коня с копытами», то есть быть страшно голодным." }
  - { kind: usage, text: "zjeść tę żabę — «проглотить эту жабу», взяться наконец за неприятное дело." }
collocations:
  - { pl: "zjeść obiad", ru: "пообедать" }
  - { pl: "zjeść śniadanie", ru: "позавтракать" }
  - { pl: "zjesz coś?", ru: "съешь что-нибудь?" }
  - { pl: "zjedzmy", ru: "давай поедим" }
etymology: "Из z- + jeść, праславянское *ěsti; русское «съесть» собрано ровно из тех же частей."
memory: "zjeść — «съесть», слово буква в букву русское. Но поляк говорит zjeść śniadanie «съесть завтрак» там, где русский обходится одним словом «позавтракать». Будущее — zjem, zjesz, как jem, jesz."
idioms:
  - { pl: "zjeść konia z kopytami", ru: "съесть коня с копытами" }
  - { pl: "zjeść tę żabę", ru: "взяться за неприятное дело" }
  - { pl: "zjeść zęby na czymś", ru: "собаку съесть на чём-либо" }
