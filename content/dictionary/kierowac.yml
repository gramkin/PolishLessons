formExamples:
  - form: "kierować"
    pl: "Czy potrafisz kierować autem?"
    ru: "Ты умеешь водить машину?"
    source: { kind: translated, id: 3621955 }
  - form: "kierować"
    pl: "Ty jeszcze nie umiesz kierować samochodem."
    ru: "Ты ещё не умеешь водить машину."
    source: { kind: translated, id: 1581265 }
  - form: "kierować"
    pl: "On chce żeby ona nauczyła się kierować samochodem."
    ru: "Он хочет, чтобы она научилась водить машину."
    source: { kind: translated, id: 1581267 }
  - form: "kierował"
    pl: "Kierował firmą w czasie choroby ojca."
    ru: "Он руководил фирмой во время болезни отца."
    source: { kind: translated, id: 908271 }
  - form: "kierował"
    pl: "Kierował zespołem przez dziesięć lat."
    ru: "Он руководил командой десять лет."
    source: { kind: authored }
  - form: "kierował"
    pl: "Nie kierował tego dnia samochodem."
    ru: "В тот день он не был за рулём."
    source: { kind: authored }
  - form: "kieruj"
    pl: "Kieruj się gwiazdami."
    ru: "Ориентируйся по звёздам."
    source: { kind: translated, id: 982985 }
  - form: "kieruj"
    pl: "Kieruj się na południe."
    ru: "Направляйся на юг."
    source: { kind: translated, id: 10596312 }
  - form: "kieruj"
    pl: "Gdzie się tak, do diabła, spieszysz? Mamy czas, kieruj ostrożnie."
    ru: "Куда ты так спешишь? У нас есть время, веди осторожно."
    source: { kind: translated, id: 1836141 }
  - form: "kierują"
    pl: "Tajfuny ogólnie kierują się w stronę Japonii."
    ru: "Тайфуны обычно направляются в сторону Японии."
    source: { kind: translated, id: 875542 }
  - form: "kierują"
    pl: "Kierują projektem od roku."
    ru: "Они руководят проектом уже год."
    source: { kind: authored }
  - form: "kierują"
    pl: "Kierują się na północ."
    ru: "Они направляются на север."
    source: { kind: authored }
  - form: "kieruje"
    pl: "Teraz Tom wszystkim kieruje."
    ru: "Теперь всем руководит Том."
    source: { kind: translated, id: 12359940 }
  - form: "kieruje"
    pl: "Statek kieruje się do portu."
    ru: "Корабль направляется в порт."
    source: { kind: translated, id: 2246689 }
  - form: "kieruje"
    pl: "Ona kieruje się wymogami mody."
    ru: "Она руководствуется требованиями моды."
    source: { kind: translated, id: 659697 }
  - form: "kierujemy"
    pl: "Kierujemy się na północ."
    ru: "Мы направляемся на север."
    source: { kind: tatoeba, id: 3793986 }
  - form: "kierujemy"
    pl: "Kierujemy się do wyjścia."
    ru: "Мы направляемся к выходу."
    source: { kind: authored }
  - form: "kierujemy"
    pl: "Kierujemy tą szkołą razem."
    ru: "Мы руководим этой школой вместе."
    source: { kind: authored }
  - form: "kierujesz"
    pl: "Gdzie się kierujesz?"
    ru: "Куда ты направляешься?"
    source: { kind: translated, id: 6554341 }
  - form: "kierujesz"
    pl: "Nie wyjeżdżaj z Polski bez powiadamiania ambasady kraju, do którego się kierujesz."
    ru: "Не выезжай из Польши, не уведомив посольство страны, в которую направляешься."
    source: { kind: translated, id: 10696051 }
  - form: "kierujesz"
    pl: "Kierujesz całym zespołem?"
    ru: "Ты руководишь всей командой?"
    source: { kind: authored }
  - form: "kieruję"
    pl: "Ja kieruję."
    ru: "Я за рулём."
    source: { kind: translated, id: 8352054 }
  - form: "kieruję"
    pl: "Kieruję małą firmą."
    ru: "Я руковожу маленькой фирмой."
    source: { kind: authored }
  - form: "kieruję"
    pl: "Nie kieruję po ciemku."
    ru: "Я не вожу в темноте."
    source: { kind: authored }
