# review
id: kierowac
format: 2
lemma: "kierować"
rank: 1805
pos: verb
aspect: imperf
pron: { cyr: "керо́ваць" }
senses:
  - id: drive
    ru: "водить (машину), управлять (транспортом)"
    examples:
      - pl: "Czy potrafisz kierować autem?"
        ru: "Ты умеешь водить машину?"
        source: { kind: translated, id: 3621955 }
      - pl: "Ty jeszcze nie umiesz kierować samochodem."
        ru: "Ты ещё не умеешь водить машину."
        source: { kind: translated, id: 1581265 }
      - pl: "Ja kieruję."
        ru: "Я за рулём."
        source: { kind: translated, id: 8352054 }
  - id: lead-direct
    ru: "руководить; направляться"
    examples:
      - pl: "Teraz Tom wszystkim kieruje."
        ru: "Теперь всем руководит Том."
        source: { kind: translated, id: 12359940 }
      - pl: "Kierował firmą w czasie choroby ojca."
        ru: "Он руководил фирмой во время болезни отца."
        source: { kind: translated, id: 908271 }
      - pl: "Kierujemy się na północ."
        ru: "Мы направляемся на север."
        source: { kind: tatoeba, id: 3793986 }
notes:
  - { kind: government, text: "Управлять чем-то — kierować czymś (творительный падеж): kierować samochodem «водить машину», kierować firmą «руководить фирмой». Это главное отличие от русского «водить что-то»." }
  - { kind: usage, text: "Возвратное kierować się значит «направляться»: statek kieruje się do portu «корабль направляется в порт»." }
  - { kind: usage, text: "kieruj się gwiazdami — «ориентируйся по звёздам»; в этом значении kierować się тоже с творительным." }
  - { kind: false-friend, text: "Русское «командировать» тут ни при чём: kierować — это «направлять, руководить», от kierunek «направление»." }
collocations:
  - { pl: "kierować samochodem", ru: "водить машину" }
  - { pl: "kierować firmą", ru: "руководить фирмой" }
  - { pl: "kierować się", ru: "направляться" }
family:
  - { pl: "kierunek", ru: "направление", relation: root, id: kierunek }
  - { pl: "kierowca", ru: "водитель", relation: root }
  - { pl: "prowadzić", ru: "вести", relation: root, id: prowadzic }
etymology: "От kierunek «направление», из немецкого kehren «поворачивать». Русское «направлять» построено от «править» — образ тот же."
memory: "kierować требует творительного падежа: kierować samochodem «водить машину», kierować firmą «руководить фирмой». Возвратное kierować się — «направляться»."
idioms:
  - { pl: "kierować samochodem", ru: "водить машину" }
  - { pl: "kierować firmą", ru: "руководить фирмой" }
  - { pl: "kierować się", ru: "направляться" }
