etymology: "От глагола KRYĆ «крыть, скрывать», из праславянского *kryti, откуда русские «крыть», «скрыть», «крыша». Суффикс -ÓWKA составной: он вырос из прилагательного на -OWY и уменьшительного -KA, то есть исходно это было «крыёвая вещь», «та, которая для укрытия». Такое сращение прилагательного с существительным дало польскому очень удобный способ называть предметы по их назначению, и суффикс до сих пор живой: новые слова на -ÓWKA возникают постоянно. Русский в этой роли чаще пользуется суффиксом «-ка» прямо от глагола, без прилагательного посередине."
memory: "Суффикс -ÓWKA делает вещь или место из глагола: kryć — kryjówka, żarzyć — żarówka «лампочка», poczta — pocztówka «открытка», stół — stołówka «столовая». Читается «крыю́фка»: ó — это «у», w перед k даёт «ф». В предложном — w kryjówce, с k в c."
idioms:
