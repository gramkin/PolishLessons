notes:
  - { kind: usage, text: "Полезнее самого слова здесь суффикс. Польское -ÓWKA очень производительно и делает из глаголов и существительных названия конкретных вещей и мест: KRYĆ «скрывать» даёт KRYJÓWKĘ, ŻARZYĆ даёт ŻARÓWKĘ «лампочку», POCZTA даёт POCZTÓWKĘ «открытку», WIZYTA даёт WIZYTÓWKĘ «визитку», STÓŁ даёт STOŁÓWKĘ «столовую». Единого соответствия в русском нет: там и «-ка», и «-овка», и вовсе другие слова. Поэтому запоминать стоит сам приём: увидев -ÓWKA, ищите глагол или существительное, от которого слово образовано, и смысл обычно становится ясен." }
  - { kind: pronunciation, text: "Читается «крыю́фка», в три слога, с ударением на предпоследнем, то есть на JÓW. Буква ó даёт «у», а w перед глухим k оглушается в «ф» — отсюда «юф», а не «юв». Сочетание ry в начале звучит твёрдо, «ры». В предложном падеже KRYJÓWCE — «крыю́фце», где k переходит в c перед окончанием -E, как во всех существительных на -KA: MATKA даёт MATCE, RĘKA даёт RĘCE." }
  - { kind: government, text: "Где — предлог W с предложным падежом: W KRYJÓWCE. Откуда выйти — предлог Z с родительным: WYJŚĆ Z KRYJÓWKI. Что искать — винительный: SZUKAĆ KRYJÓWKI требует родительного, потому что SZUKAĆ всегда берёт родительный, а ZNALEŹĆ KRYJÓWKĘ — винительного. Эта пара, SZUKAĆ с родительным и ZNALEŹĆ с винительным, русскому непривычна: по-русски оба глагола берут винительный, «искать укрытие» и «найти укрытие»." }
  - { kind: false-friend, text: "Ложной пары нет, зато есть близкие слова, которые стоит развести. KRYJÓWKA — это укрытие или тайник, место, где прячутся или прячут. SCHRON — это бомбоубежище, сооружение: SCHRON PRZECIWLOTNICZY. UKRYCIE — скорее состояние, «укрытость»: WYJŚĆ Z UKRYCIA значит «выйти из подполья», в том числе переносно. По-русски все три часто сводятся к «укрытию», поэтому при переводе на польский нужно решать, речь о месте, о сооружении или о состоянии." }
