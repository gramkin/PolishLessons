notes:
  - { kind: false-friend, text: "GRAWITACJA — «гравитация, тяготение». В быту говорят и PRZYCIĄGANIE ZIEMSKIE, «земное притяжение». Невесомость — NIEWAŻKOŚĆ, а не «антигравитация»." }
  - { kind: usage, text: "Женский род. Учим единственное: GRAWITACJA, GRAWITACJI, GRAWITACJĘ, GRAWITACJĄ. Родительный, дательный и местный совпадают — GRAWITACJI." }
