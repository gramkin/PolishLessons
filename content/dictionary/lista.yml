id: lista
format: 2
lemma: "lista"
rank: 463
pos: noun
pron: { cyr: "ли́ста" }
senses:
  - id: list
    ru: "список, перечень"
    examples:
      - pl: "Była lista dostępnych kandydatów."
        ru: "Был список доступных кандидатов."
        source: { kind: translated, id: 7886518 }
      - pl: "Mam listę."
        ru: "У меня есть список."
        source: { kind: translated, id: 3418619 }
      - pl: "Lista jest długa."
        ru: "Список длинный."
        source: { kind: authored }
  - id: list-uses
    ru: "список (в устойчивых оборотах)"
    examples:
      - pl: "Wpisz mnie na listę."
        ru: "Запиши меня в список."
        source: { kind: authored }
      - pl: "Czarna lista wciąż rośnie."
        ru: "Чёрный список всё растёт."
        source: { kind: authored }
      - pl: "Skreśl go z listy."
        ru: "Вычеркни его из списка."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Три разных слова сходятся в одних и тех же формах: lista «список» (женский род), list «письмо» (мужской) и liść «лист». Liście są żółte значит «Листья жёлтые», а вовсе не что-то про список." }
  - { kind: false-friend, text: "Родительный падеж множественного от lista — list, и он совпадает с именительным слова list «письмо». Различает только контекст." }
  - { kind: usage, text: "czarna lista — «чёрный список»; lista obecności — «список присутствующих»; lista zakupów — «список покупок»." }
  - { kind: usage, text: "wpisać się na listę — «записаться в список»; skreślić z listy — «вычеркнуть из списка»." }
collocations:
  - { pl: "czarna lista", ru: "чёрный список" }
  - { pl: "lista zakupów", ru: "список покупок" }
  - { pl: "lista obecności", ru: "список присутствующих" }
  - { pl: "być na liście", ru: "быть в списке" }
etymology: "lista «список» — заимствование из итальянского lista «полоса, перечень» через немецкий. А созвучные list «письмо» и liść «лист» — славянские и родственны друг другу и русскому «листу»: письмо когда-то писали на листе."
memory: "lista — «список», итальянское заимствование. Но берегитесь: в тех же формах прячутся два других слова — list «письмо» и liść «лист», родня русскому «листу». Liście są żółte значит «Листья жёлтые»."
idioms:
  - { pl: "czarna lista", ru: "чёрный список" }
  - { pl: "lista obecności", ru: "список присутствующих" }
  - { pl: "być na liście", ru: "быть в списке" }
