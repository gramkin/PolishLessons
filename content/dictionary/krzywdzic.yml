notes:
  - { kind: false-friend, text: "Корень здесь KRZYWY — русское «кривой», и образ в польском прозрачен: KRZYWDA это «обида, несправедливость», буквально кривизна, нечто сделанное не по прямой. Отсюда KRZYWDZIĆ «обижать, поступать несправедливо», POKRZYWDZONY «потерпевший», KRZYWDZĄCY «несправедливый». Русский назвал то же самое от другого корня: «обида» от «обидеть», где древнее значение — «обвести взглядом, оглядеть с презрением». Поэтому связь между «кривым» и «обидой» видна только с польской стороны, и держать её стоит через знакомое KRZYWY: кривое решение и есть обида. Внимание: KRZYWDZIĆ не значит «кривить» — это KRZYWIĆ, без D." }
  - { kind: usage, text: "Несовершенный вид, переходный, шестьдесят три формы: сорок две от глагола, десять от действительного причастия KRZYWDZĄCY, одиннадцать от страдательного KRZYWDZONY. Совершенная пара — SKRZYWDZIĆ. Существительное KRZYWDA очень частое и входит в устойчивые обороты: WYRZĄDZIĆ KOMUŚ KRZYWDĘ «причинить кому-то обиду», BEZ KRZYWDY DLA KOGOŚ «без ущерба для кого-то», POCZUĆ SIĘ POKRZYWDZONYM «почувствовать себя обиженным». В юридическом языке POKRZYWDZONY — это процессуальный термин «потерпевший», и его стоит знать отдельно от бытового значения." }
  - { kind: government, text: "Переходный: обижать кого — винительный без предлога, KRZYWDZIĆ DZIECI, KRZYWDZIĆ SŁABSZYCH. Русское управление то же, «обижать кого-то», так что ошибиться трудно. Отрицание переводит дополнение в родительный: NIE KRZYWDŹ NIKOGO, с формой NIKOGO вместо NIKT. Существительное KRZYWDA управляет иначе и требует внимания: WYRZĄDZIĆ KRZYWDĘ KOMUŚ, то есть пострадавший стоит в дательном, а сама обида — в винительном. Устойчивое NIE MA W TYM KRZYWDY значит «в этом нет ничего обидного»." }
  - { kind: pronunciation, text: "Читается «кшы́вдзиць», два слога, ударение на первом. Начальное KRZ звучит «кш»: RZ после глухого K оглушается в «ш», как и в PRZE- после P. Буква Y это «ы». Буквосочетание DZI даёт мягкое «дзь», один слитный звук. Конечное Ć — мягкое «ць». В существительном KRZYWDA два слога и ударение на первом: «кшы́вда». В причастии KRZYWDZĄCY три слога, ударение на предпоследнем: «кшывдзо́нцы»." }
