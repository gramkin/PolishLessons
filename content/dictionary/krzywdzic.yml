etymology: "От KRZYWDA, а та от KRZYWY «кривой», из праславянского *krivъ, того же, что русское «кривой». Логика образования прозрачна: обида — это кривизна, поступок не по прямой, перекос. Русский построил понятие иначе, от «обидеть», и связь с кривизной утратил, хотя корень «кривой» сохранил полностью. Поэтому для русскоязычного эта карточка — случай, когда знакомый корень открывает незнакомое абстрактное слово: зная KRZYWY, можно вывести KRZYWDA. Внутри польского гнездо широкое: KRZYWDZIĆ, SKRZYWDZIĆ, POKRZYWDZONY, KRZYWDZĄCY, а также KRZYWIĆ «кривить» и KRZYWA «кривая» в математике. Разделять KRZYWDZIĆ и KRZYWIĆ приходится по смыслу: первое о людях, второе о линиях и лицах."
memory: "Корень krzywy = «кривой», и отсюда krzywda — «обида», буквально кривизна, поступок не по прямой. Русский строит это от «обиды», так что метафора видна только с польской стороны: зная krzywy, выводишь krzywda. Гнездо: krzywdzić «обижать», skrzywdzić «обидеть», pokrzywdzony «потерпевший» (юридический термин). Не путать с krzywić «кривить» — без d. Управление как в русском: krzywdzić kogoś, винительный. Но krzywda требует дательного: wyrządzić krzywdę komuś. Звук KRZ это «кш»."
