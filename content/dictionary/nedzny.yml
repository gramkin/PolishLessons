pron: { cyr: "не́ндзны" }
senses:
  - id: wretched
    ru: "жалкий, убогий, нищенский"
    examples:
      - pl: "Mieszkali w nędznej chacie."
        ru: "Они жили в убогой хижине."
        source: { kind: authored }
      - pl: "Dostaje nędzną pensję."
        ru: "Он получает жалкую зарплату."
        source: { kind: authored }
      - pl: "To najnędzniejsza dzielnica miasta."
        ru: "Это самый убогий район города."
        source: { kind: authored }
  - id: vile
    ru: "жалкий, ничтожный (о человеке, поступке)"
    examples:
      - pl: "Ty nędzny tchórzu!"
        ru: "Ты жалкий трус!"
        source: { kind: authored }
      - pl: "To był nędzny podstęp."
        ru: "Это была жалкая уловка."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Русское «нуждающийся» и польское NĘDZNY — одного корня: NĘDZA, «нищета, нужда». Но значение сместилось к «жалкий, убогий». NĘDZNA PENSJA — «нищенская зарплата», NĘDZNY TCHÓRZ — «жалкий трус». Русскому «нудный» слово не родня." }
  - { kind: usage, text: "Полная парадигма: NĘDZNY, NĘDZNIEJSZY, NAJNĘDZNIEJSZY. Степени чаще в книжной речи. Мужское-личное: NĘDZNI, NĘDZNIEJSI, NAJNĘDZNIEJSI — о жалких, низких людях." }
  - { kind: government, text: "Ставится перед существительным: NĘDZNE WARUNKI, NĘDZNA PŁACA. Как оскорбление — в обращении со звательным: TY NĘDZNY ROBAKU! Наречие NĘDZNIE — «убого, скверно»." }
  - { kind: pronunciation, text: "Читается «не́ндзны», два слога, ударение на первом. Ę перед DZ звучит «эн», DZ — «дз». В NĘDZNIEJSZY: «нендзне́йшы»." }
  - { kind: register, text: "Книжное и экспрессивное слово, часто презрительное. В литературе — о бедности и о моральном падении. В разговоре проще MARNY или KIEPSKI, «паршивый»." }
collocations:
  - { pl: "nędzna pensja", ru: "нищенская зарплата" }
  - { pl: "nędzne warunki", ru: "убогие условия" }
  - { pl: "nędzny tchórz", ru: "жалкий трус" }
family:
  - { pl: "nędza", ru: "нищета, нужда", relation: root, id: nedza }
  - { pl: "nędzarz", ru: "нищий", relation: derived }
  - { pl: "marny", ru: "жалкий, плохой", relation: root, id: marny }
etymology: "От NĘDZA «нищета», общеславянского *nǫdja, того же, что русское «нужда». Польское Ę на месте русского «у» и DZ на месте «ж» — постоянные соответствия. NĘDZNY — буквально «нуждающийся», а потом «жалкий»."
memory: "Nędzny — жалкий, убогий: nędzna pensja, nędzna chata, nędzny tchórz. От nędza — нищета, родня «нужды». Nędzniejszy, najnędzniejszy. Читается «не́ндзны»."
idioms:
  - { pl: "nędzne grosze", ru: "жалкие гроши" }
