# review
id: wytrzec
format: 2
lemma: "wytrzeć"
rank: 5772
pos: verb
pron: { cyr: "вы́тшець" }
senses:
  - id: wipe
    ru: "вытереть, протереть"
    examples:
      - pl: "Trzeba wytrzeć stół po śniadaniu."
        ru: "Надо вытереть стол после завтрака."
        source: { kind: authored }
      - pl: "Wytarł okulary chusteczką."
        ru: "Он протёр очки платком."
        source: { kind: authored }
  - id: dry-off
    ru: "вытереть насухо (руки, посуду, ребёнка)"
    examples:
      - pl: "Wytrzyj ręce, zanim usiądziesz."
        ru: "Вытри руки, прежде чем сесть."
        source: { kind: authored }
      - pl: "Mama wytarła dziecku buzię."
        ru: "Мама вытерла ребёнку лицо."
        source: { kind: authored }
  - id: worn-out
    ru: "потёртый, затёртый (о причастии wytarty)"
    examples:
      - pl: "Dywan jest stary i wytarty."
        ru: "Ковёр старый и потёртый."
        source: { kind: authored }
      - pl: "To wytarty frazes, nic więcej."
        ru: "Это затёртая фраза, не более."
        source: { kind: authored }
notes:
  - { kind: government, text: "wytrzeć coś — ВИНИТЕЛЬНЫЙ падеж: wytrzeć stół, ręce, szybę. Дополнением бывает и человек, когда его вытирают насухо: wytrzeć dziecko ręcznikiem. Поэтому мужсколичное причастие wytarci существует: wytarci do sucha, usiedli przy kominku." }
  - { kind: pronunciation, text: "Основа меняет гласный: в настоящем и будущем времени -trze- (wytrę, wytrzesz, wytrze), а в прошедшем -tar- (wytarł, wytarła, wytarli). Запоминать надо обе основы: wytrzeć — wytarł." }
  - { kind: usage, text: "Деепричастие прошедшего времени здесь оканчивается не на -wszy, а на -łszy: wytarłszy. Это правило общее — после основы на согласный берётся -łszy (wytarłszy, niósłszy), после основы на гласный -wszy (zrobiwszy)." }
  - { kind: false-friend, text: "Корень trzeć — прямой родственник русского «тереть», и wytrzeć отвечает русскому «вытереть» приставка в приставку. Но причастие wytarty ушло дальше русского: кроме «вытертый» оно значит ещё «потёртый, изношенный» (wytarte dżinsy) и «затёртый, избитый» (wytarty frazes)." }
collocations:
  - { pl: "wytrzeć ręce", ru: "вытереть руки" }
  - { pl: "wytrzeć kurz", ru: "вытереть пыль" }
  - { pl: "wytarty frazes", ru: "затёртая фраза" }
family:
  - { pl: "wycierać", ru: "вытирать", relation: aspect }
  - { pl: "trzeć", ru: "тереть", relation: root }
  - { pl: "ręcznik", ru: "полотенце", relation: derived }
etymology: "Приставка wy- и глагол trzeć, от праславянского *terti. Русское «тереть» — прямой родственник, и «вытереть» сложено из тех же двух частей. Чередование основ trze-/tar- тоже общеславянское: ср. русское «тереть» — «тёр». Отсюда же tarcie «трение» и tarka «тёрка»."
memory: "wytrzeć = wy- + trzeć, буквально русское «вытереть», корень тот же, что в «тереть». Две основы: wytrę, но wytarł. А wytarty значит не только «вытертый», но и «потёртый»: wytarte dżinsy."
idioms:
  - { pl: "wytrzeć coś do sucha", ru: "вытереть что-л. насухо" }
  - { pl: "wytarty frazes", ru: "затёртая фраза, избитое выражение" }
