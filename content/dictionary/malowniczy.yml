# review
id: malowniczy
format: 2
lemma: "malowniczy"
rank: 5954
pos: adj
pron: { cyr: "маловни́чы" }
senses:
  - id: picturesque
    ru: "живописный (о месте, виде)"
    examples:
      - pl: "Neapol to malownicze miasto."
        ru: "Неаполь — живописный город."
        source: { kind: translated, id: 1541611 }
      - pl: "Mieszkają w malowniczej wiosce w górach."
        ru: "Они живут в живописной деревне в горах."
        source: { kind: authored }
      - pl: "Widok z okna był naprawdę malowniczy."
        ru: "Вид из окна был поистине живописным."
        source: { kind: authored }
  - id: colourful
    ru: "красочный, колоритный (о рассказе, языке, людях)"
    examples:
      - pl: "Napisał malowniczą relację z podróży."
        ru: "Он написал красочный рассказ о путешествии."
        source: { kind: authored }
      - pl: "Malowniczym językiem opisał swoją wyprawę."
        ru: "Красочным языком он описал свою экспедицию."
        source: { kind: authored }
notes:
  - { kind: usage, text: "MALOWNICZY — это русское «живописный» в обоих смыслах: MALOWNICZY KRAJOBRAZ «живописный пейзаж» и MALOWNICZA OPOWIEŚĆ «красочный рассказ». Но прилагательное к самой живописи как искусству другое: MALARSKI, MALARSTWO «живопись», SZKOŁA MALARSKA «школа живописи»." }
  - { kind: usage, text: "Форм десять: мужско-личное множественное совпадает с мужским единственным, MALOWNICZY GÓRALE «колоритные горцы» и MALOWNICZY ZAKĄTEK «живописный уголок» пишутся одинаково. Так ведут себя все прилагательные на -CZY. Сравнительной формы на -SZY нет, степени строят описательно: BARDZIEJ MALOWNICZY, NAJBARDZIEJ MALOWNICZY." }
  - { kind: pronunciation, text: "Читается «маловни́чы», ударение на предпоследнем слоге NI. L перед O твёрдое, как русское «л». CZ всегда твёрдое «ч», поэтому после него Y звучит как «ы»: «-чы», а не «-чи»." }
collocations:
  - { pl: "malowniczy krajobraz", ru: "живописный пейзаж" }
  - { pl: "malownicza okolica", ru: "живописная местность" }
  - { pl: "malownicze położenie", ru: "живописное расположение" }
family:
