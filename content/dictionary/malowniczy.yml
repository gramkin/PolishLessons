  - { pl: "malarz", ru: "художник; маляр", relation: root }
  - { pl: "malowniczo", ru: "живописно", relation: derived }
  - { pl: "malowniczość", ru: "живописность", relation: derived }
synonyms: ["barwny", "urokliwy", "obrazowy"]
etymology: "Образовано от MALOWAĆ «писать красками»; глагол пришёл в польский через чешский из немецкого MALEN. Тот же источник у русского «малевать»."
memory: "Malować — рисовать красками, malowniczy — такой, что просится на картину, живописный: malowniczy krajobraz. Русское «малевать» подскажет корень."
