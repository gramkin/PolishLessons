notes:
  - { kind: usage, text: "В словаре лемма стоит во множественном числе, потому что слово почти всегда так и употребляется: Okoliczności się zmieniły. Единственное okoliczność существует, но встречается редко." }
  - { kind: usage, text: "zbieg okoliczności — «совпадение», буквально «стечение обстоятельств». Самый частый оборот со словом." }
  - { kind: usage, text: "w tajemniczych okolicznościach — «при таинственных обстоятельствах», газетная формула." }
  - { kind: usage, text: "Родственное okolica «окрестность» уже есть карточкой: общий корень koło «круг»." }
collocations:
  - { pl: "zbieg okoliczności", ru: "совпадение" }
  - { pl: "w tych okolicznościach", ru: "при этих обстоятельствах" }
  - { pl: "okoliczności łagodzące", ru: "смягчающие обстоятельства" }
etymology: "От okoliczny «окрестный», в основе koło «круг»: буквально «то, что стоит вокруг дела». Русское «обстоятельство» собрано так же, и оба языка скалькировали латинское circumstantia."
memory: "okoliczności — «обстоятельства», и слово почти всегда во множественном числе. Запомните zbieg okoliczności «совпадение». Оба языка скалькировали латинское circumstantia — «то, что стоит вокруг»."
