senses:
  - id: circumstances
    ru: "обстоятельства"
    examples:
      - pl: "Okoliczności były sprzyjające."
        ru: "Обстоятельства были благоприятствующими."
        source: { kind: tatoeba, id: 6327798 }
      - pl: "Okoliczności się zmieniły."
