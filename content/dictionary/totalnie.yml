etymology: "От TOTALNY, из латыни, от слова TOTUS «весь, целый». В разговорном польском значение ослабло до простого усилителя «совсем»."
memory: "Totalnie — совсем, напрочь (разг.): totalnie zapomniałem. Читается «тота́льне». Нейтрально — całkowicie, zupełnie."
