notes:
  - { kind: false-friend, text: "TOTALNIE — разговорное «совсем, абсолютно», а не книжное русское «тотально». Поляк скажет TOTALNIE ZAPOMNIAŁEM, «я напрочь забыл», там, где русский «тотально» не употребит." }
  - { kind: usage, text: "Наречие, одна форма, без степеней. Усилитель при прилагательных, глаголах и даже при отрицании: TOTALNIE NIE TAK, «совершенно не так»." }
  - { kind: government, text: "Наречие ничем не управляет. Нейтральные синонимы — CAŁKOWICIE, ZUPEŁNIE, KOMPLETNIE." }
  - { kind: pronunciation, text: "Читается «тота́льне», ударение на предпоследнем слоге. L перед N мягкое." }
  - { kind: register, text: "Слово разговорное, особенно молодёжное. В деловом письме лучше CAŁKOWICIE или W PEŁNI." }
collocations:
