etymology: "От SŁUŻBA, а то — от SŁUŻYĆ, слова праславянского и того же, что русские «служить» и «слуга». Корень общий и узнаётся сразу, вся трудность в сочетании: PODRÓŻ SŁUŻBOWA там, где русский говорит «командировка», слово французское по корню, от «командировать». Из того же польского гнезда идёт USŁUGA «услуга» и USŁUGOWY о сфере услуг."
memory: "Служебный, от sluzba и sluzyc, корень тот же, что в русском «служить». Главное — podroz sluzbowa, то есть «командировка»: одним словом по-польски не скажешь. Читается «суужбо́вы», с двумя «у» подряд, потому что сначала l со штрихом даёт «у», а потом идёт обычная u, в точности как в dlugi «дуу́ги». В командировку — w podroz sluzbowa, винительный; в командировке — w podrozy sluzbowej, местный."
idioms:
  - { pl: "podróż służbowa", ru: "командировка" }
formExamplesSkip:
