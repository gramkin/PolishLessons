notes:
  - { kind: false-friend, text: "Русское «служебный» отвечает польскому почти везде, но одно сочетание надо запомнить отдельно: PODRÓŻ SŁUŻBOWA это «командировка». У нас на это есть одно слово, у поляков — два, и слова «командировка» в польском просто нет. Запомните и то, что SŁUŻBA, кроме службы, по-старому значит «прислуга», а русская «услуга» отвечает польскому USŁUGA." }
  - { kind: usage, text: "В таблице одиннадцать форм, но живых десять. Одиннадцатая — SŁUŻBOWI, именительный множественного для мужчин-людей, и её не употребляют: прилагательное относительное, оно описывает телефон, машину или поездку, а не человека. Примеров к этой форме в карточке поэтому нет. Прилагательное стоит после существительного: TELEFON SŁUŻBOWY, PODRÓŻ SŁUŻBOWA." }
  - { kind: government, text: "Поехать в командировку — WYJECHAĆ W PODRÓŻ SŁUŻBOWĄ, предлог W с винительным, потому что есть движение. А «быть в командировке» — BYĆ W PODRÓŻY SŁUŻBOWEJ, тот же предлог, но местный падеж. Это та же пара, что в TRAFIĆ W SEDNO против W SEDNIE, и различать её надо по движению. По служебным делам — W SPRAWACH SŁUŻBOWYCH, местный падеж множественного." }
  - { kind: pronunciation, text: "Читается «суужбо́вы», четыре слога, ударение на предпоследнем. Начало слова выглядит неожиданно: Ł даёт «у», а следующая U — тоже «у», и получается два «у» подряд, «суу». Так и надо: ровно то же видно в DŁUGI «дуу́ги». Заметьте, что однокоренные SŁUŻBA и SŁUŻYĆ в словаре записаны через «л», и это несогласованность в самих тех карточках, а не правило." }
  - { kind: register, text: "Слово канцелярское и конторское, из языка учреждений. Самые частые сочетания — PODRÓŻ SŁUŻBOWA «командировка», TELEFON SŁUŻBOWY, SAMOCHÓD SŁUŻBOWY, LEGITYMACJA SŁUŻBOWA «служебное удостоверение», DROGA SŁUŻBOWA о порядке обращения по инстанциям. В разговоре о командировке поляки часто говорят просто DELEGACJA." }
