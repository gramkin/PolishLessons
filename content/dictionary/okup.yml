# review
id: okup
format: 2
lemma: "okup"
rank: 4673
pos: noun
pron: { cyr: "о́куп" }
senses:
  - id: ransom
    ru: "выкуп (за заложника)"
    examples:
      - pl: "Porywacze zażądali okupu."
        ru: "Похитители потребовали выкуп."
        source: { kind: authored }
      - pl: "Rodzina zapłaciła okup."
        ru: "Семья заплатила выкуп."
        source: { kind: authored }
      - pl: "Okup wynosił milion euro."
        ru: "Выкуп составлял миллион евро."
        source: { kind: authored }
  - id: price-of-peace
    ru: "выкуп, откуп (перен.)"
    examples:
      - pl: "Hakerzy żądają okupu za odblokowanie danych."
        ru: "Хакеры требуют выкуп за разблокировку данных."
        source: { kind: authored }
      - pl: "Prezent był okupem za spóźnienie."
        ru: "Подарок был выкупом за опоздание."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "OKUP — «выкуп» за похищенного человека или за что-то ценное: ŻĄDAĆ OKUPU, ZAPŁACIĆ OKUP. Не путайте с OKUPACJA, «оккупация», — это совсем другое, латинское слово. Глагол OKUPIĆ — «поплатиться, заплатить дорогой ценой»: OKUPIĆ SUKCES ZDROWIEM — «заплатить за успех здоровьем»." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Родительный — OKUPU. Требовать выкупа — с родительным: ŻĄDAĆ OKUPU, как у нас «требовать денег»." }
  - { kind: government, text: "Требовать выкупа — ŻĄDAĆ OKUPU, родительный. Заплатить выкуп — ZAPŁACIĆ OKUP, винительный. Выкуп за кого-то — OKUP ZA KOGOŚ, ZA с винительным." }
  - { kind: pronunciation, text: "Читается «о́куп», два слога, ударение на первом. В форме OKUPIE: «оку́пе»." }
  - { kind: register, text: "Слово из криминальной хроники: PORWANIE DLA OKUPU — «похищение ради выкупа». В переносном смысле — шутливо о подарке «за мир»: CZEKOLADA TO OKUP ZA SPÓŹNIENIE." }
collocations:
  - { pl: "wysoki okup", ru: "большой выкуп" }
  - { pl: "żądanie okupu", ru: "требование выкупа" }
  - { pl: "przekazać okup", ru: "передать выкуп" }
family:
  - { pl: "kupić", ru: "купить", relation: root, id: kupic }
  - { pl: "wykup", ru: "выкуп, погашение", relation: derived }
  - { pl: "okupić", ru: "поплатиться, заплатить дорогой ценой", relation: derived }
etymology: "От KUPIĆ «купить» с приставкой O-: «откупиться», то есть купить себе свободу. Тот же корень в русских «купить», «откуп», «выкуп», так что слово легко узнать."
memory: "Okup — выкуп: żądać okupu, zapłacić okup. Читается «о́куп». От kupić — купить. Okupić coś zdrowiem — заплатить за что-то здоровьем. Оккупация — okupacja, другое слово."
idioms:
  - { pl: "zażądać okupu", ru: "потребовать выкуп" }
  - { pl: "porwanie dla okupu", ru: "похищение ради выкупа" }
