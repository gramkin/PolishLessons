# review
id: brac
format: 2
lemma: "brać"
rank: 233
pos: verb
aspect: imperf
aspectPair: wziac
pron: { cyr: "брачь" }
senses:
  - id: take
    ru: "брать"
    examples:
      - pl: "Bierz!"
        ru: "Бери!"
        source: { kind: tatoeba, id: 12569794 }
      - pl: "Lepiej jest dawać, niż brać."
        ru: "Лучше давать, чем брать."
        source: { kind: tatoeba, id: 12564333 }
      - pl: "Bierz, co chcesz."
        ru: "Бери, что хочешь."
        source: { kind: authored }
  - id: set-phrases
    ru: "принимать, участвовать — в устойчивых оборотах"
    note: "brać kąpiel «принимать ванну», brać udział «участвовать», brać ślub «вступать в брак»."
    examples:
      - pl: "On bierze kąpiel każdego ranka."
        ru: "Он принимает ванну каждое утро."
        source: { kind: tatoeba, id: 524343 }
      - pl: "Zawsze biorę kąpiel przed snem."
        ru: "Я всегда принимаю ванну перед сном."
        source: { kind: tatoeba, id: 1645409 }
      - pl: "Nie bierz tego na serio. Tylko żartuję."
        ru: "Не воспринимайте это всерьёз. Я же шучу."
        source: { kind: tatoeba, id: 361216 }
notes:
  - { kind: usage, text: "Настоящее время чередуется точно как в русском: biorę «беру», bierzesz «берёшь», bierze, bierzemy, bierzecie, biorą." }
  - { kind: usage, text: "Совершенный вид — совсем другое слово: wziąć, wezmę, weźmiesz. Пара brać/wziąć такая же неожиданная, как русская «брать/взять»." }
  - { kind: usage, text: "Устойчивые обороты: brać udział w czymś «участвовать в чём-то», brać kąpiel / prysznic «принимать ванну / душ», brać lekarstwa «принимать лекарства», brać ślub «вступать в брак»." }
  - { kind: usage, text: "brać się do czegoś значит «браться за что-то»: Bierzmy się do roboty «Возьмёмся за работу»." }
collocations:
  - { pl: "brać udział", ru: "участвовать" }
  - { pl: "brać ślub", ru: "вступать в брак" }
  - { pl: "brać prysznic", ru: "принимать душ" }
  - { pl: "brać się do roboty", ru: "браться за работу" }
etymology: "Праславянское *bьrati — то же слово, что русское «брать»; чередование в настоящем времени (biorę — bierzesz) в точности повторяет русское «беру — берёшь»."
memory: "brać — «брать», и настоящее время чередуется как в русском: biorę «беру», bierzesz «берёшь». Но совершенный вид — совсем другое слово: wziąć, wezmę — ровно как русская пара «брать / взять»."
idioms:
  - { pl: "brać udział", ru: "участвовать" }
  - { pl: "brać do siebie", ru: "принимать на свой счёт" }
  - { pl: "brać za dobrą monetę", ru: "принимать за чистую монету" }
