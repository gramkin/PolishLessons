# review
id: ujecie
format: 2
lemma: "ujęcie"
rank: 5997
pos: noun
pron: { cyr: "уе́ньце" }
senses:
  - id: capture
    ru: "задержание, поимка"
    examples:
      - pl: "Policja wyznaczyła nagrodę za ujęcie sprawcy."
        ru: "Полиция назначила награду за поимку преступника."
        source: { kind: authored }
      - pl: "Po ujęciu złodzieja policja odzyskała pieniądze."
        ru: "После задержания вора полиция вернула деньги."
        source: { kind: authored }
  - id: shot
    ru: "кадр, план, дубль (в кино, на фото)"
    examples:
      - pl: "To ujęcie trzeba nakręcić jeszcze raz."
        ru: "Этот кадр нужно переснять."
        source: { kind: authored }
      - pl: "Reżyser lubi długie ujęcia bez cięć."
        ru: "Режиссёр любит длинные планы без склеек."
        source: { kind: authored }
  - id: approach
    ru: "подход, трактовка, ракурс"
    examples:
      - pl: "W ujęciu historycznym ten problem wygląda inaczej."
        ru: "В историческом ракурсе эта проблема выглядит иначе."
        source: { kind: authored }
  - id: intake
    ru: "водозабор (ujęcie wody)"
    examples:
      - pl: "Miasto ma nowe ujęcie wody."
        ru: "У города новый водозабор."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Четыре далёких друг от друга значения, все от UJĄĆ «схватить; охватить, сформулировать»: UJĘCIE SPRAWCY — поимка преступника, UJĘCIE W FILMIE — кадр, W UJĘCIU HISTORYCZNYM — в историческом ключе, UJĘCIE WODY — водозабор. Значение подсказывает контекст." }
  - { kind: false-friend, text: "С русским «уйти» не связано: U- здесь приставка, -JĘ- — корень «взять», как в «изъять», «понять». Отрезок съёмки без остановки камеры — UJĘCIE; польское KADR — отдельное неподвижное изображение, а KADRA — «кадры, персонал»." }
  - { kind: pronunciation, text: "Читается «уе́ньце»: Ę перед Ć звучит как «энь». Родительный множественного — UJĘĆ «у́еньць»." }
collocations:
  - { pl: "ujęcie sprawcy", ru: "задержание преступника" }
  - { pl: "w ujęciu historycznym", ru: "в историческом аспекте" }
  - { pl: "ujęcie wody", ru: "водозабор" }
  - { pl: "długie ujęcie", ru: "длинный план (в кино)" }
family:
  - { pl: "ująć", ru: "схватить; сформулировать", relation: root, id: ujac }
  - { pl: "ujmować", ru: "охватывать; излагать; очаровывать", relation: root }
  - { pl: "ujmujący", ru: "обаятельный", relation: root }
etymology: "Отглагольное существительное от UJĄĆ (U- + JĄĆ «взять»); корень тот же, что в русских «взять», «изъять»."
memory: "Ujęcie — то, что «ujęto», схватили: преступника (поимка), сцену камерой (кадр), тему словами (подход), воду из-под земли (водозабор)."
idioms:
  - { pl: "w ujęciu…", ru: "в … аспекте, с точки зрения…" }
