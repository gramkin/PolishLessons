# review
id: dach
format: 2
lemma: "dach"
rank: 1418
pos: noun
pron: { cyr: "дах" }
senses:
  - id: roof
    ru: "крыша"
    examples:
      - pl: "Dach przecieka."
        ru: "Крыша протекает."
        source: { kind: tatoeba, id: 4716919 }
      - pl: "Widzę ptaka na dachu."
        ru: "Я вижу на крыше птицу."
        source: { kind: tatoeba, id: 660346 }
      - pl: "Dach został uszkodzony podczas burzy."
        ru: "Крыша была повреждена штормом."
        source: { kind: tatoeba, id: 363024 }
  - id: shelter
    ru: "кров, жильё (dach nad głową)"
    examples:
      - pl: "On nie miał dachu nad głową."
        ru: "У него не было крыши над головой."
        source: { kind: tatoeba, id: 2677073 }
      - pl: "Byliśmy zbyt różni i pod jednym dachem prowadziliśmy odrębne życie."
        ru: "Мы были слишком разные и под одной крышей жили каждый своей жизнью."
        source: { kind: translated, id: 2982002 }
notes:
  - { kind: usage, text: "Мужской неодушевлённый. Предложный падеж на -u: na dachu «на крыше», родительный — dachu." }
  - { kind: usage, text: "dach nad głową — «крыша над головой»; выражение совпадает с русским буквально, включая порядок слов." }
  - { kind: usage, text: "pod jednym dachem — «под одной крышей». А pod dachem может значить просто «в помещении, не под открытым небом»: gry pod dachem «игры в помещении»." }
  - { kind: false-friend, text: "У польского dach нет переносного значения «крыша» как покровительство, знакомого по русскому жаргону. Это только постройка." }
collocations:
  - { pl: "dach nad głową", ru: "крыша над головой" }
  - { pl: "na dachu", ru: "на крыше" }
  - { pl: "pod jednym dachem", ru: "под одной крышей" }
etymology: "Заимствовано из немецкого Dach «крыша». Русское «крыша» — своё слово, от «крыть», поэтому здесь родства нет и dach приходится запоминать отдельно."
memory: "dach — «крыша», слово немецкое и на русское не похоже, так что его надо просто выучить. Зато выражения совпадают буквально: dach nad głową «крыша над головой», pod jednym dachem «под одной крышей». Предложный — na dachu."
idioms:
  - { pl: "dach nad głową", ru: "крыша над головой" }
  - { pl: "pod jednym dachem", ru: "под одной крышей" }
  - { pl: "dach świata", ru: "крыша мира" }
formExamplesSkip:
  - { form: "dachu", cell: "Звательный", reason: "звательный падеж: для неодушевлённого существительного он практически не употребляется" }
