notes:
  - { kind: false-friend, text: "Прямой родственник русского «дно», и значение совпадает полностью — включая разговорное «это дно» о чём-то очень плохом. Один из тех случаев, где запоминать нечего, кроме склонения." }
  - { kind: usage, text: "Склонение с чередованиями, которые стоит выучить: родительный множественного den (без гласной в основе), предложный единственного dnie, а дательный единственного dnu. Пара dnie/dnu различает «на дне» и «дну»." }
  - { kind: government, text: "Устойчивое do dna означает «до самого низа» и как тост «до дна» — в точности как по-русски. Оборот sięgnąć dna значит «достичь дна», и тоже переносно: о человеке, которому хуже некуда." }
collocations:
  - { pl: "na dnie", ru: "на дне" }
  - { pl: "do dna", ru: "до дна" }
  - { pl: "podwójne dno", ru: "двойное дно" }
family:
  - { pl: "denny", ru: "донный; разг. ужасный", relation: derived }
  - { pl: "bezdenny", ru: "бездонный", relation: derived }
etymology: "Праславянское *dъno, восходящее к индоевропейскому корню со значением «выдолбленный, глубокий». Русское «дно» — прямой родственник, и даже чередование основы совпадает: как русское «дно» даёт «дон» в «бездонный», так польское dno даёт den в родительном множественном и bezdenny «бездонный»."
memory: "dno — русское «дно», слово в слово. Запоминать надо только склонение: den в родительном множественном, dnie «на дне», dnu «дну». И тост do dna! тот же, что русское «до дна!»."
idioms:
  - { pl: "Do dna!", ru: "До дна! (тост)" }
  - { pl: "sięgnąć dna", ru: "достичь дна, опуститься до предела" }
