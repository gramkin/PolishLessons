etymology: "Старое слово, давшее и существительное lada «прилавок», и частицу со значением «какой угодно, любой». В русском прямого соответствия нет."
memory: "lada — частица «вот-вот»: lada chwila, lada moment, lada dzień. А оборот nie lada значит «незаурядный»: to nie lada problem."
