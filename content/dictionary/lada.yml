# review
id: lada
format: 2
lemma: "lada"
rank: 1757
pos: part
pron: { cyr: "ля́да" }
senses:
  - id: any-moment
    ru: "lada chwila, lada moment — вот-вот, с минуты на минуту"
    examples:
      - pl: "Powinien wrócić lada chwila."
        ru: "Он должен вернуться с минуты на минуту."
        source: { kind: translated, id: 760409 }
      - pl: "Moja taksówka powinna być lada moment."
        ru: "Моё такси должно быть с минуты на минуту."
        source: { kind: translated, id: 3881842 }
      - pl: "Pociąg przyjedzie lada chwila."
        ru: "Поезд придёт с минуты на минуту."
        source: { kind: authored }
  - id: not-just-any
    ru: "nie lada — незаурядный, немалый"
    examples:
      - pl: "To nie lada problem."
        ru: "Это немалая проблема."
        source: { kind: translated, id: 1825328 }
      - pl: "To nie lada wyczyn."
        ru: "Это незаурядное достижение."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Все падежные формы — lady, ladzie, ladę, ladą, lad, ladom, ladami, ladach — принадлежат существительному lada «прилавок», а не частице, которой посвящена эта карточка. Частица не склоняется вовсе, поэтому примеров к этим формам здесь нет. Живое употребление существительного — оборот kupić coś spod lady." }
  - { kind: usage, text: "В словаре заглавное слово — существительное lada «прилавок», но в корпусе живёт частица: lada chwila, lada moment, lada dzień «вот-вот, со дня на день». Карточка описывает именно её." }
  - { kind: usage, text: "Оборот nie lada значит «незаурядный, немалый»: to nie lada problem «это немалая проблема», nie lada gratka «редкая удача»." }
  - { kind: government, text: "Частица не склоняется и стоит перед словом времени: lada chwila, lada moment, lada dzień." }
  - { kind: false-friend, text: "Существительное lada «прилавок» тоже существует: kupić spod lady «купить из-под прилавка», о дефиците времён ПНР." }
collocations:
