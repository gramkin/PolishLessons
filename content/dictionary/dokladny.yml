notes:
  - { kind: false-friend, text: "DOKŁADNY — ЭТО «ТОЧНЫЙ», А НЕ «ДОКЛАДНОЙ». Русское «докладная записка» связана с докладом, а польское dokładny значит «точный, тщательный»: dokładny adres, dokładne dane, dokładny człowiek. Корень общий, праславянское *klad- «класть»: по-польски доложено ровно, впритык, отсюда точность, а по-русски доложено начальству, отсюда доклад. Русское «докладной» будет по-польски służbowy: notatka służbowa." }
  - { kind: usage, text: "Наречие от этого прилагательного — DOKŁADNIE, и оно живее самого прилагательного: dokładnie tak «именно так», dokładnie o ósmej «ровно в восемь». В ответ на вопрос «именно?» поляк скажет просто DOKŁADNIE, как мы говорим «вот именно». Это одно из самых частых слов разговора." }
  - { kind: pronunciation, text: "Мужско-личное множественное — DOKŁADNI, без чередований: основа на -n просто берёт -i, как konkretni. Заднеязычные бы смягчились (susi от suchy), а здесь смягчать нечего. Степени сравнения правильные и живые: dokładniejszy, najdokładniejszy." }
collocations:
  - { pl: "dokładny adres", ru: "точный адрес" }
  - { pl: "dokładne dane", ru: "точные данные" }
  - { pl: "dokładnie tak", ru: "именно так" }
family:
  - { pl: "dokładnie", ru: "точно, именно", relation: derived, id: dokladnie }
  - { pl: "dokładać", ru: "добавлять, прикладывать", relation: root }
  - { pl: "niedokładny", ru: "неточный", relation: antonym }
etymology: "От dokładać «прикладывать, добавлять», корень *klad- тот же, что в русских «класть», «клад», «доклад». Образ прост: положено точно, вплотную — отсюда точность. Русский от того же корня построил «доклад» и «докладную», то есть то, что кладут перед начальством. Одно гнездо, два разных развития."
memory: "dokładny — «точный», а не «докладной»; докладная записка будет notatka służbowa. И запомни наречие DOKŁADNIE «именно, ровно» — его услышишь чаще самого прилагательного."
idioms:
  - { pl: "dokładnie tak", ru: "вот именно" }
  - { pl: "co do joty dokładny", ru: "точный до йоты" }
