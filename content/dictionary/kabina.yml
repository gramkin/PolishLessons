notes:
  - { kind: false-friend, text: "KABINA — «кабина» и «кабинка»: примерочная — KABINA или PRZYMIERZALNIA, душевая — KABINA PRYSZNICOWA, кабинка для голосования — KABINA WYBORCZA. Каюта на судне — тоже KABINA." }
