notes:
  - { kind: pronunciation, text: "ДВА ЧЕРЕДОВАНИЯ СРАЗУ, ОБА УЖЕ ЗНАКОМЫЕ. В именительном слог закрыт, и пишется ó: naród, читается «на́рут» с оглушением d. Как только появляется окончание, слог открывается и ó уступает o: narodu, narodem, narody — ровно как ogród/ogrodu и rozwód/rozwodu. А предложный вдобавок смягчает d в dzi: w narodzie, как w ogrodzie и o rozwodzie." }
  - { kind: false-friend, text: "РУССКОЕ «НАРОД» ШИРЕ. По-русски «народу было много» значит просто «людей было много». Польское naród так не употребляется: это НАЦИЯ, народ как историческая и политическая общность. Людей в толпе называют ludzie: było dużo ludzi. А простонародье — lud, слово отдельное." }
  - { kind: usage, text: "Родительный множественного narodów частотен в названиях: Organizacja Narodów Zjednoczonych «Организация Объединённых Наций». Прилагательное narodowy «национальный» — осторожно, оно не значит «народный» в смысле фольклорном: для этого есть ludowy." }
collocations:
  - { pl: "Organizacja Narodów Zjednoczonych", ru: "Организация Объединённых Наций" }
  - { pl: "losy narodu", ru: "судьба народа" }
  - { pl: "narody świata", ru: "народы мира" }
family:
  - { pl: "narodowy", ru: "национальный", relation: derived }
  - { pl: "ród", ru: "род", relation: root }
  - { pl: "lud", ru: "народ, простонародье", relation: derived, id: lud }
  - { pl: "narodowość", ru: "национальность", relation: derived }
etymology: "Приставка na- плюс ród «род», от rodzić «рождать» — то же строение, что в русском «народ»: на-род, то, что нарождается. Корень тот же, что в rodzina «семья», rodzic «родитель» и русских «род», «родить», «природа». Чередование ó и o отражает древнюю долготу гласного."
memory: "naród — «народ», но в смысле НАЦИЯ; «людей много» будет dużo ludzi, не narodu. Собрано как русское слово: na- плюс ród. И два чередования: ó в закрытом слоге (naród), o в открытом (narodu), плюс предложный w narodzie."
idioms:
  - { pl: "Organizacja Narodów Zjednoczonych", ru: "Организация Объединённых Наций" }
  - { pl: "losy narodu", ru: "судьба народа" }
