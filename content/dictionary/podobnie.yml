# review
id: podobnie
format: 2
lemma: "podobnie"
rank: 1836
pos: adv
pron: { cyr: "подо́бне" }
senses:
  - id: similarly
    ru: "похоже, подобным образом"
    examples:
      - pl: "Brzmi podobnie."
        ru: "Звучит похоже."
        source: { kind: translated, id: 1085479 }
      - pl: "Wygląda podobnie."
        ru: "Выглядит похоже."
        source: { kind: translated, id: 1085480 }
      - pl: "Tom zareagował podobnie."
        ru: "Том отреагировал похоже."
        source: { kind: translated, id: 7783247 }
  - id: likewise
    ru: "podobnie jak — так же как, подобно"
    examples:
      - pl: "On jest niewysoki, podobnie jak ja."
        ru: "Он невысокий, так же как и я."
        source: { kind: translated, id: 403033 }
      - pl: "Wieloryb jest ssakiem, podobnie jak koń."
        ru: "Кит — млекопитающее, так же как и лошадь."
        source: { kind: translated, id: 415341 }
      - pl: "Jest podobnie zajęta jak Tom."
        ru: "Она занята так же, как Том."
        source: { kind: translated, id: 943595 }
notes:
  - { kind: usage, text: "Оборот podobnie jak значит «так же как, подобно»: wieloryb jest ssakiem, podobnie jak koń. Это основное употребление." }
  - { kind: usage, text: "Само по себе podobnie значит «похоже»: brzmi podobnie «звучит похоже»." }
  - { kind: false-friend, text: "Русское «подобно» книжное, а польское podobnie совершенно обычное, повседневное слово." }
  - { kind: usage, text: "Прилагательное — podobny «похожий»; być podobnym do kogoś «быть похожим на кого-то»." }
  - { kind: false-friend, text: "Не путайте najpodobniej «более всего похоже» с najprawdopodobniej «вероятнее всего»: второе образовано от другого наречия, prawdopodobnie." }
collocations:
  - { pl: "podobnie jak", ru: "так же как" }
  - { pl: "brzmi podobnie", ru: "звучит похоже" }
  - { pl: "wygląda podobnie", ru: "выглядит похоже" }
family:
  - { pl: "podobny", ru: "похожий", relation: root, id: podobny }
  - { pl: "podobieństwo", ru: "сходство", relation: root }
etymology: "От podobny «похожий», того же корня, что русское «подобный» и «подобие». Слова прямо родственны."
memory: "podobnie — «похоже»: brzmi podobnie. А главный оборот — podobnie jak «так же как»: podobnie jak koń. Прилагательное — podobny."
idioms:
