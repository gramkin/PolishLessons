  - { kind: usage, text: "Основное употребление техническое: łączność radiowa «радиосвязь», stracić łączność «потерять связь»." }
  - { kind: government, text: "Женский род на -ść: ta łączność, tej łączności." }
  - { kind: usage, text: "Корень łączyć «соединять»; отсюда же połączenie «соединение, рейс»." }
