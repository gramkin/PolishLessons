# review
id: zawiesic
format: 2
lemma: "zawiesić"
rank: 2494
pos: verb
pron: { cyr: "завє́щиць" }
senses:
  - id: hang-up
    ru: "повесить, подвесить"
    examples:
      - pl: "Zawiesił obraz na ścianie."
        ru: "Он повесил картину на стену."
        source: { kind: authored }
      - pl: "Zawieś lampę nad stołem."
        ru: "Повесь лампу над столом."
        source: { kind: authored }
  - id: suspend
    ru: "приостановить, отстранить"
    examples:
      - pl: "Zawieszono go na trzy mecze."
        ru: "Его отстранили на три матча."
        source: { kind: authored }
      - pl: "Firma zawiesiła działalność."
        ru: "Фирма приостановила деятельность."
        source: { kind: authored }
  - id: freeze-computer
    ru: "зависнуть (о программе)"
    examples:
      - pl: "Komputer zawiesił się na dobre."
        ru: "Компьютер завис окончательно."
        source: { kind: authored }
notes:
  - { kind: usage, text: "В ОСНОВЕ ПРОИСХОДИТ s→sz, И ЭТО ВИДНО ВО МНОГИХ ФОРМАХ. Инфинитив zawiesić, но первое лицо ZAWIESZĘ, третье множественного ZAWIESZĄ, страдательное причастие ZAWIESZONY и отглагольное ZAWIESZENIE. Так же ведут себя opisać → opiszę и prosić → proszę. А вот повелительное сохраняет мягкое ś: zawieś." }
  - { kind: false-friend, text: "КОМПЬЮТЕРНОЕ ЗНАЧЕНИЕ СОВПАЛО С РУССКИМ БУКВАЛЬНО. Komputer się zawiesił — «компьютер завис», и метафора та же: программа как бы повисла в воздухе. Это тот редкий случай, когда новое техническое выражение пришло в оба языка одинаково, и переводить можно слово в слово." }
  - { kind: usage, text: "Существительное ZAWIESZENIE покрывает сразу три вещи: приостановление (zawieszenie działalności), автомобильную подвеску и перемирие — ZAWIESZENIE BRONI, буквально «подвешивание оружия». Вид совершенный: есть zawiesiwszy, форм на -ąc и -ący нет, несовершенная пара — zawieszać." }
collocations:
  - { pl: "zawiesić obraz", ru: "повесить картину" }
  - { pl: "zawieszenie broni", ru: "перемирие" }
  - { pl: "zawiesić działalność", ru: "приостановить деятельность" }
family:
  - { pl: "wieszać", ru: "вешать", relation: aspect }
  - { pl: "wisieć", ru: "висеть", relation: root, id: wisiec }
  - { pl: "zawieszenie", ru: "приостановление; подвеска", relation: derived }
etymology: "Приставка za- и wiesić, из праславянского *věsiti «вешать», того же корня, что русские «вешать», «висеть» и «вес». Чередование s/sz в основе старое и общее для этого класса. Отсюда zawieszenie, wieszak «вешалка» и zawiasy «петли»."
memory: "zawiesić — «повесить» и «приостановить». В основе s→sz: zawieszę, zawieszony, zawieszenie, но повелительное zawieś с мягким ś. И запомни zawieszenie broni — «перемирие», и komputer się zawiesił — «компьютер завис»."
idioms:
  - { pl: "zawieszenie broni", ru: "перемирие" }
  - { pl: "zawiesić coś na kołku", ru: "забросить что-л." }
