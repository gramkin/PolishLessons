  - { pl: "amerykański", ru: "американский", relation: derived, id: amerykanski }
  - { pl: "Rosjanin", ru: "русский (о человеке)", relation: root, id: rosjanin }
etymology: "От AMERYKA, названия, данного по имени Америго Веспуччи, с суффиксом -ANIN, как в ROSJANIN и MIESZCZANIN."
memory: "Amerykanin — американец, с суффиксом -anin: Amerykanie, но Amerykanów. On jest Amerykaninem — творительный."
