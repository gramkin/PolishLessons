notes:
  - { kind: false-friend, text: "AMERYKANIN — «американец», но с суффиксом -ANIN, как ROSJANIN, а не -EC. Во множественном -IN отпадает: AMERYKANIE. Но родительный множественного — AMERYKANÓW, а не «Amerykan», как ROSJAN." }
  - { kind: usage, text: "Пишется с большой буквы, как все названия людей по национальности; прилагательное AMERYKAŃSKI — с маленькой. Женская форма — AMERYKANKA. Местный единственного — O AMERYKANINIE, именительный множественного — AMERYKANIE." }
  - { kind: government, text: "Мужской личный род: винительный равен родительному, WIDZIAŁEM AMERYKANINA. «Он американец» — ON JEST AMERYKANINEM, с творительным." }
  - { kind: pronunciation, text: "Читается «амэрыка́нин»: Y — «ы», ударение на предпоследнем слоге. AMERYKANIE — «амэрыка́не», AMERYKANÓW — «амэрыка́нуф»." }
  - { kind: register, text: "Нейтральное слово. Разговорное JANKES «янки» звучит иронично. Гражданин США в документах — OBYWATEL USA." }
collocations:
  - { pl: "być Amerykaninem", ru: "быть американцем" }
  - { pl: "typowy Amerykanin", ru: "типичный американец" }
