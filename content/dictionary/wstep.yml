notes:
  - { kind: false-friend, text: "Одно польское слово делит работу между двумя русскими, и выбор зависит от того, где оно стоит. На табличке и на билете WSTĘP значит «вход»: WSTĘP WOLNY «вход свободный», WSTĘP WZBRONIONY «вход запрещён», WSTĘP PŁATNY «вход платный». В книге то же слово значит «введение, вступление»: WSTĘP DO KSIĄŻKI. Русское «вступление» для входа не годится, а «вход» не годится для книги, так что держать в голове надо оба перевода. Отдельно: WSTĘPNY значит «предварительный», как в UMOWA WSTĘPNA «предварительный договор»." }
  - { kind: pronunciation, text: "Здесь сразу два правила, и оба стоят дороже самого слова. Первое: W перед глухой согласной оглушается, поэтому начало читается «фс», а не «вс». Второе: Ę перед P звучит как «эм», а не «эн», потому что следующий звук губной. Вместе получается «фстэмп». То же в WSTĘPIE, где перед мягким звучит «фстэ́мпе». Сравните KĘPA «кэмпа» и KĄPAĆ «компаць»: носовой всегда подстраивается под следующую согласную." }
  - { kind: government, text: "Обе схемы стоит запомнить отдельно. Куда вход — предлог NA с винительным: WSTĘP NA KONCERT, NA WYSTAWĘ, NA STADION. Введение к чему — предлог DO с родительным: WSTĘP DO KSIĄŻKI, DO MATEMATYKI. Русский в первом случае тоже ставит «на», а во втором говорит «к» с дательным, так что падеж приходится менять. Запрет оформляется прилагательным, а не отрицанием: WSTĘP WZBRONIONY, буквально «вход запрещённый»." }
  - { kind: usage, text: "Существительное мужского рода неодушевлённое, десять падежных форм. В значении «вход» оно живёт почти только в единственном числе, потому что говорит о доступе вообще, а не о проёме: дверной проём это WEJŚCIE. Множественное число принадлежит второму значению и совершенно обычно: WSTĘPY DO OBU TOMÓW «введения к обоим томам». Местный падеж WSTĘPIE требует предлога WE, а не W, потому что слово начинается с двух согласных: WE WSTĘPIE." }
  - { kind: register, text: "Слово нейтральное, живёт на табличках, в билетах и в книгах. Частые обороты: WSTĘP WOLNY «вход свободный», WSTĘP WZBRONIONY «вход запрещён», BEZ WSTĘPÓW «без предисловий», в смысле «давай сразу к делу». В разговоре вместо второго значения часто скажут PRZEDMOWA «предисловие». Глагол того же гнезда WSTĄPIĆ значит «зайти на минуту»: WSTĄPIĘ DO CIEBIE PO PRACY «зайду к тебе после работы»." }
