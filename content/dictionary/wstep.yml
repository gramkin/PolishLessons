etymology: "Сложено из приставки W- «в» и корня STĘP-, того же, что в STĄPAĆ «ступать» и WSTĄPIĆ «вступить». Русское «вступление» собрано из тех же частей и в том же порядке: в + ступ + ление, так что родство слышно сразу, стоит только отбросить польский носовой. Корень идёт от праславянского *stǫpiti, откуда русские «ступать», «ступень», «поступок», «наступить». В польском он даёт целое гнездо с разными приставками: WSTĄPIĆ «зайти», POSTĘPOWAĆ «поступать», USTĘPOWAĆ «уступать», NASTĘPNY «следующий». Запомнив соответствие STĘP равно «ступ», русскоязычный разбирает все эти слова без словаря."
memory: "Два перевода на одно слово: на табличке wstęp это «вход», в книге «введение». Wstęp wolny значит «вход свободный», wstęp do książki «введение к книге». Читается «фстэмп», и здесь сразу два правила: w перед глухой даёт «ф», а ę перед губной p даёт «эм», а не «эн». Управление разное: wstęp NA coś с винительным о входе, wstęp DO czegoś с родительным о книге. Корень stęp это русское «ступ», как в postępować «поступать» и wstąpić «зайти»."
