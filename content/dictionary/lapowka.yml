notes:
  - { kind: false-friend, text: "ŁAPÓWKA — «взятка», от ŁAPAĆ, «хватать»: то, что «хапают». Брать взятки — BRAĆ ŁAPÓWKI, давать — DAWAĆ ŁAPÓWKĘ. Взяточник — ŁAPÓWKARZ. Коррупция — KORUPCJA." }
  - { kind: usage, text: "Девять форм, женский род. В дательном и местном K переходит в C: W ŁAPÓWCE. Родительный множественного — ŁAPÓWEK. Звательный ŁAPÓWKO не употребляется." }
  - { kind: government, text: "Дать взятку кому — DAĆ ŁAPÓWKĘ и дательный: DAĆ ŁAPÓWKĘ URZĘDNIKOWI. Обвинить во взяточничестве — OSKARŻYĆ O PRZYJĘCIE ŁAPÓWKI." }
  - { kind: pronunciation, text: "Читается «уапу́фка»: Ł — «у», Ó — «у», W перед K оглушается в «ф». Ударение на предпоследнем слоге." }
collocations:
  - { pl: "wziąć łapówkę", ru: "взять взятку" }
  - { pl: "dać łapówkę", ru: "дать взятку" }
  - { pl: "afera łapówkarska", ru: "коррупционный скандал" }
family:
  - { pl: "łapać", ru: "ловить, хватать", relation: root, id: lapac }
  - { pl: "łapówkarz", ru: "взяточник", relation: derived }
  - { pl: "korupcja", ru: "коррупция", relation: root }
etymology: "От ŁAPAĆ «хватать, ловить»: взятку «хватают». В русском близко по образу «хапать», «брать на лапу»."
memory: "Łapówka — взятка, от łapać — хватать. Wziąć łapówkę — взять взятку. Читается «уапу́фка»."
idioms:
