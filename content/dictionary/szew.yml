family:
  - { pl: "szyć", ru: "шить", relation: root }
  - { pl: "zaszyć", ru: "зашить", relation: root }
  - { pl: "szwaczka", ru: "швея", relation: derived }
etymology: "От SZYĆ «шить», от праславянского корня, давшего и русский «шов», и «шить», и «швею». Беглый гласный в обоих языках ведёт себя одинаково: польское SZEW — SZWU отвечает русскому «шов — шва». Из того же гнезда идут SZWACZKA «швея» и SZWALNIA «швейная мастерская», слова, которые русский узнаёт сразу. Хирургическое значение позднее и в обоих языках развилось независимо, из того же образа соединённых краёв."
memory: "То же слово, что русский «шов», от szyć «шить», и беглое e ведёт себя так же: szew, но szwu, как «шов — шва». Главное на слух: конечное w оглушается, поэтому szew звучит «шэф». Оборот pękać w szwach совпадает с «трещать по швам», и о куртке, и о переполненном зале, только предлог другой: w с местным падежом вместо «по» с дательным."
idioms:
  - { pl: "pękać w szwach", ru: "трещать по швам; быть переполненным" }
formExamplesSkip:
  - { form: "szwie", cell: "Звательный", reason: "звательный падеж: для неодушевлённого существительного он практически не употребляется" }
