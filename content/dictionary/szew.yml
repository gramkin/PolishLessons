notes:
  - { kind: false-friend, text: "Слово то же, что русский «шов», и корень тот же: SZYĆ «шить». Беглое E прячет родство в парадигме: SZEW, но SZWU, SZWEM, ровно как русское «шов — шва». Оборот PĘKAĆ W SZWACH совпадает с «трещать по швам» целиком, в обоих смыслах: о порвавшейся куртке и о переполненном зале. SALA PĘKAŁA W SZWACH значит, что зал был битком." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Беглое E выпадает во всех косвенных падежах, и основа сокращается до SZW-: SZEW, SZWU, SZWOWI, SZWEM, SZWIE. Из трёх букв остаются две согласные подряд, что для русского уха непривычно, хотя в русском происходит то же самое в паре «шов — шва». Множественное SZWY работает и о портняжных, и о хирургических швах." }
  - { kind: government, text: "Наложить швы — ZAŁOŻYĆ SZWY, винительный без предлога, тогда как русский говорит «наложить швы» тоже винительным, так что схема совпадает. Снять швы — ZDJĄĆ SZWY. Трещать по швам — PĘKAĆ W SZWACH, предлог W с местным падежом множественного, а русский берёт «по» с дательным. В шве — W SZWIE, предлог W с местным." }
  - { kind: pronunciation, text: "Читается «шэф», один слог. Сочетание SZ даёт «ш», а конечное W оглушается до «ф»: это общее польское правило, и оно сильно меняет слово на слух. В косвенных падежах оглушения нет, потому что W оказывается перед гласной: SZWU звучит «шву», SZWEM — «швэм». В местном падеже SZWIE сочетание WIE даёт мягкое «ве»: «шве»." }
  - { kind: register, text: "Слово нейтральное и работает в двух ремёслах. В портновском: SZEW BOCZNY «боковой шов», ROZPRUĆ SZEW «распороть шов», SZWALNIA «швейная мастерская». В медицинском: ZAŁOŻYĆ SZWY, ZDJĄĆ SZWY, SZWY CHIRURGICZNE. Переносное PĘKAĆ W SZWACH слышно постоянно о переполненных залах, автобусах и школах, и звучит оно совершенно обиходно." }
collocations:
  - { pl: "założyć szwy", ru: "наложить швы" }
  - { pl: "zdjąć szwy", ru: "снять швы" }
