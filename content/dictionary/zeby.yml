  - id: purpose
    ru: "чтобы (с целью)"
    examples:
      - pl: "Masz chwilę, żeby pogadać?"
        ru: "У тебя есть минутка поговорить?"
        source: { kind: tatoeba, id: 12567470 }
      - pl: "Uczę się, żeby zdać egzamin."
        ru: "Я учусь, чтобы сдать экзамен."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Если подлежащие разные, żeby принимает личные окончания: żebym, żebyś, żebyśmy — и глагол ставится в прошедшем времени: Chcę, żebyś przyszedł." }
collocations:
  - { pl: "po to, żeby", ru: "для того чтобы" }
  - { pl: "żeby tylko", ru: "лишь бы" }
etymology: "Сложение że + by — буквально «что бы», ровно как русское «чтобы»."
memory: "Разбирается на части так же, как русское слово: że + by ↔ что + бы. Особенность польского — личные формы: żebym poszedł «чтобы я пошёл», żebyś poszedł «чтобы ты пошёл»."
idioms:
