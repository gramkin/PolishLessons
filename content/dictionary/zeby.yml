pos: conj
pron: { cyr: "жэ́бы" }
senses:
  - id: in-order-to
    ru: "чтобы"
    examples:
      - pl: "Chcę, żeby znała prawdę."
        ru: "Я хочу, чтобы она знала правду."
        source: { kind: tatoeba, id: 11268997 }
      - pl: "Nie ma krzesła, żeby usiąść."
