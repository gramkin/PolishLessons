# review
id: kontra
format: 2
lemma: "kontra"
rank: 4357
pos: noun
pron: { cyr: "ко́нтра" }
senses:
  - id: counterattack
    ru: "контратака (в спорте)"
    examples:
      - pl: "Gol padł po szybkiej kontrze."
        ru: "Гол забили после быстрой контратаки."
        source: { kind: authored }
      - pl: "Drużyna gra z kontry."
        ru: "Команда играет от обороны, на контратаках."
        source: { kind: authored }
      - pl: "Wyprowadzili kontrę w ostatniej minucie."
        ru: "Они провели контратаку на последней минуте."
        source: { kind: authored }
  - id: double
    ru: "контра (в бридже, преферансе)"
    examples:
      - pl: "Partner dał kontrę na cztery piki."
        ru: "Партнёр сказал «контра» на четыре пики."
        source: { kind: authored }
      - pl: "Po kontrze stawka się podwaja."
        ru: "После контры ставка удваивается."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Русское «контра» — разговорное «контрреволюция», «враг»: «ты что, контра?». Польское KONTRA — прежде всего спортивная «контратака» и карточная «контра». Как предлог KONTRA значит «против»: POLSKA KONTRA NIEMCY, «Польша против Германии», — это уже другое, несклоняемое слово." }
  - { kind: usage, text: "Женский род, неодушевлённое. В местном и дательном R чередуется с RZ: PO KONTRZE. Множественное KONTRY, родительный KONTR. Звательный KONTRO не употребляется." }
  - { kind: government, text: "Играть от контратак — GRAĆ Z KONTRY, Z с родительным. После контратаки — PO KONTRZE, местный. Провести контратаку — WYPROWADZIĆ KONTRĘ, винительный." }
  - { kind: pronunciation, text: "Читается «ко́нтра», два слога, ударение на первом. O чёткое, без аканья. В PO KONTRZE: «по ко́нтшэ», RZ после T оглушается в «ш»." }
  - { kind: register, text: "Спортивный и карточный жаргон, нейтральный в своей области. Футбольные комментаторы говорят KONTRA, KONTRATAK и GRA Z KONTRY постоянно. В бридже KONTRA и REKONTRA — официальные термины." }
collocations:
  - { pl: "szybka kontra", ru: "быстрая контратака" }
  - { pl: "grać z kontry", ru: "играть на контратаках" }
  - { pl: "wyprowadzić kontrę", ru: "провести контратаку" }
family:
  - { pl: "kontratak", ru: "контратака", relation: derived }
  - { pl: "atak", ru: "атака", relation: root, id: atak }
  - { pl: "przeciw", ru: "против", relation: root, id: przeciw }
etymology: "Из латинского contra «против», через итальянский и французский. В спорте — сокращение от KONTRATAK, в картах — от французского contre. Русское «контра» — то же латинское слово, но в русском оно стало сокращением от «контрреволюция»."
memory: "Kontra — контратака: gol po kontrze, grać z kontry. В картах — контра. Не «враг»! Po kontrze — r→rz. Читается «ко́нтра»."
idioms:
  - { pl: "grać z kontry", ru: "играть от обороны, на контратаках" }
formExamplesSkip:
  - { form: "kontro", reason: "звательный не употребляется" }
  - { form: "kontry", cell: "Звательный", reason: "звательный падеж: к предмету или понятию не обращаются" }
