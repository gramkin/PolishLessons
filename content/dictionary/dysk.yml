etymology: "Из латинского DISCUS «диск, метательный круг», а то из греческого DISKOS, от DIKEIN «метать». Русское «диск» пришло тем же путём, поэтому слова совпадают, и различается только написание гласной. Исходным было именно спортивное значение: диск метали на греческих состязаниях, и это самое старое употребление слова в обоих языках. Круглая форма дала потом и медицинский диск, и носитель данных. Любопытно, что тот же латинский DISCUS через другое ответвление дал слово «диск» в смысле блюда — итальянское DISCO и немецкое TISCH «стол», родственное польскому DESKA через значение столешницы, так что DYSK и DESKA из предыдущей партии оказываются дальними родственниками."
memory: "Через Y, не через I: dysk, читается «дыск», как dyskusja «дыскусья» и system «сы́стэм». Родительный и местный совпадают: bez dysku и na dysku — девять форм, как у wysiłek и pośpiech. Музыкальная пластинка — не dysk, а płyta. Из латинского discus «метательный круг», откуда и спортивное значение."
