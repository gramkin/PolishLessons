notes:
  - { kind: false-friend, text: "Пишется через Y, а не через I: DYSK, не «диск». Это сквозное правило для заимствований: польский ставит Y там, где русский пишет «и» после твёрдой согласной, и выговаривает её как русское «ы». Сравните DYSKUSJA и «дискуссия», SYSTEM и «система», DYSCYPLINA и «дисциплина», FIZYKA и «физика». Поэтому слово читается «дыск», с твёрдым Д и гласной «ы», а не «диск». Ошибка в одной букве делает слово неузнаваемым на слух, поэтому стоит проговорить вслух оба варианта и услышать разницу." }
  - { kind: government, text: "Мужской род, неодушевлённое, и парадигма у него той же экономной формы, что у WYSIŁEK и POŚPIECH: родительный и местный падеж единственного числа совпадают в одной форме DYSKU. Поэтому BEZ DYSKU «без диска» и NA DYSKU «на диске» выглядят одинаково, а в таблице девять форм, а не десять. Это третий случай подряд в последних партиях, так что совпадение можно считать типичным для неодушевлённых на согласную. Запись идёт NA DYSK с винительным: SKOPIOWAŁ NA DYSK, а хранение — NA DYSKU с местным." }
  - { kind: usage, text: "Значений три, и они не пересекаются. Первое и самое частое — носитель данных: DYSK TWARDY «жёсткий диск», DYSK ZEWNĘTRZNY «внешний диск», DYSK W CHMURZE «облачный диск». Второе — спортивный снаряд: RZUT DYSKIEM «метание диска». Третье — медицинское: межпозвоночный диск, и отсюда DYSKOPATIA, а в разговоре WYPADŁ MI DYSK «у меня выпал диск». Музыкальная пластинка диском не называется: это PŁYTA, и PŁYTA CD тоже, несмотря на круглую форму." }
  - { kind: pronunciation, text: "Читается «дыск», один слог. Главное — гласная Y: она произносится как русское «ы», и перед ней согласная остаётся твёрдой. Конечное SK звучит глухо и отчётливо, без призвука. В формах с окончанием слово остаётся двусложным: DYSKU «ды́ску», DYSKIEM «ды́скем», где KIE даёт мягкое «ке». Во множественном DYSKI читается «ды́ски», и здесь KI тоже смягчается — то есть сама буква I после K работает как знак мягкости, в отличие от Y." }
