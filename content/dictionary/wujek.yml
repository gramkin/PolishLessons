# review
id: wujek
format: 2
lemma: "wujek"
rank: 809
pos: noun
pron: { cyr: "ву́ек" }
senses:
  - id: uncle
    ru: "дядя"
    examples:
      - pl: "Czy twój wujek nadal jest zagranicą?"
        ru: "Твой дядя всё ещё за границей?"
        source: { kind: tatoeba, id: 3427709 }
      - pl: "Słyszałem, że mój wujek zmarł na raka."
        ru: "Я слышал, что мой дядя умер от рака."
        source: { kind: tatoeba, id: 5097510 }
      - pl: "To jest mój wujek."
        ru: "Это мой дядя."
        source: { kind: translated, id: 10701995 }
  - id: at-uncle
    ru: "u wujka — у дяди"
    examples:
      - pl: "Stad do mojego wujka są dwie godziny drogi samochodem."
        ru: "Отсюда до моего дяди два часа езды на автомобиле."
        source: { kind: tatoeba, id: 393322 }
      - pl: "On nocuje u wujka."
        ru: "Он ночует у дяди."
        source: { kind: translated, id: 1480706 }
      - pl: "Mam bogatego wujka."
        ru: "У меня есть богатый дядя."
        source: { kind: translated, id: 6670455 }
  - id: be-uncle
    ru: "być wujkiem — быть дядей (творительный)"
    examples:
      - pl: "Będę wujkiem."
        ru: "Я стану дядей."
        source: { kind: translated, id: 8769100 }
      - pl: "On jest moim wujkiem."
        ru: "Он мой дядя."
        source: { kind: translated, id: 1104910 }
      - pl: "Chcę rozmawiać z twoim wujkiem."
        ru: "Я хочу поговорить с твоим дядей."
        source: { kind: translated, id: 3286093 }
  - id: idioms
    ru: "wujek dobra rada — советчик"
    examples:
      - pl: "Znowu z ciebie wujek dobra rada."
        ru: "Ты опять из себя советчика строишь."
        source: { kind: authored }
      - pl: "Zapytaj wujka Google."
        ru: "Спроси у дяди Гугла."
        source: { kind: authored }
      - pl: "Mam z sześciu wujków."
        ru: "У меня около шести дядей."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Беглое e работает как в budynek и palec: wujek, но wujka, wujkiem, wujków. Гласная живёт только в именительном." }
  - { kind: usage, text: "wujek — уменьшительное от wuj, и сегодня именно оно обычное слово для дяди. Строго говоря, wuj — брат матери, а stryj — брат отца, но в живой речи различие почти стёрлось." }
  - { kind: government, text: "u wujka «у дяди» — родительный падеж; być wujkiem «быть дядей» — творительный; do wujka «к дяде» — родительный." }
  - { kind: usage, text: "Шутливые обороты: wujek dobra rada — «советчик», тот, кто раздаёт советы без спроса; wujek Google i ciocia Wiki — о поиске в интернете." }
collocations:
  - { pl: "u wujka", ru: "у дяди" }
  - { pl: "być wujkiem", ru: "быть дядей" }
  - { pl: "wujek dobra rada", ru: "советчик" }
  - { pl: "do wujka", ru: "к дяде" }
family:
  - { pl: "wuj", ru: "дядя (брат матери)", relation: root }
  - { pl: "stryj", ru: "дядя (брат отца)", relation: root }
  - { pl: "ciocia", ru: "тётя", relation: root }
  - { pl: "siostrzeniec", ru: "племянник", relation: root }
etymology: "Уменьшительное от wuj «дядя (брат матери)», праславянское *ujь — то же гнездо, что русское «уй, вуй» в старых текстах."
memory: "wujek — «дядя», и беглое e тут работает как в budynek и palec: wujek, но wujka, wujkiem, pięciu wujków. Строго говоря, wuj — брат матери, а stryj — брат отца, но в живой речи различие почти стёрлось. А wujek dobra rada — это «советчик», тот, кто раздаёт советы без спроса."
idioms:
  - { pl: "wujek dobra rada", ru: "советчик" }
  - { pl: "u wujka", ru: "у дяди" }
  - { pl: "być wujkiem", ru: "быть дядей" }
