  - id: join
    ru: "вступить (в организацию)"
    examples:
      - pl: "Wstąpił do partii w tysiąc dziewięćset osiemdziesiątym roku."
        ru: "Он вступил в партию в тысяча девятьсот восьмидесятом году."
        source: { kind: authored }
      - pl: "Wstąpiła do zakonu po studiach."
        ru: "Она вступила в монашеский орден после учёбы."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Два значения, и русский узнаёт только одно. WSTĄPIĆ DO PARTII, DO ZAKONU, DO WOJSKA — это «вступить», всё как по-русски. Но самое частое употребление другое: WSTĄPIĆ DO KOGOŚ или DO SKLEPU значит «ЗАЙТИ НА МИНУТУ», забежать по пути. WSTĄPIĘ DO CIEBIE — это «я к тебе зайду», а не «я в тебя вступлю». Русское «вступить» этого смысла не имеет вовсе, и подставлять его тут нельзя: по-русски скажут «зайду», «забегу», «заскочу»." }
  - { kind: government, text: "Оба значения требуют предлога DO с родительным: WSTĄPIĆ DO SKLEPU, DO CIEBIE, DO PARTII, DO WOJSKA. Это удобно — конструкция одна, различает только дополнение: учреждение и организация читаются как вступление, лавка и человек как заход. Зачем зайти — предлог NA с винительным: WSTĄPIĆ NA KAWĘ, NA CHWILĘ, NA PIWO. Непереходный глагол, страдательных причастий нет, и форм сорок две: сорок одна основная и деепричастие WSTĄPIWSZY." }
  - { kind: usage, text: "Несовершенная пара — WSTĘPOWAĆ, и у неё та же двойственность. Для захода в разговоре чаще берут WPADNĄĆ («WPADNĘ DO CIEBIE») или ZAJRZEĆ, а WSTĄPIĆ звучит чуть мягче и старомоднее, как русское «загляну». В значении вступления существительное — WSTĄPIENIE, но для приёма в организацию обычно говорят PRZYJĘCIE. А WSTĘP значит «вступление, введение» и ещё «вход»: WSTĘP WOLNY — «вход свободный»." }
  - { kind: pronunciation, text: "Носовая ą читается как «он» перед твёрдым согласным, поэтому WSTĄPIĆ звучит «фсто́нпиць», а начальное WS перед глухим оглушается до «фс». В отличие от глаголов на -ĄĆ вроде WPŁYNĄĆ, здесь мены ą/ę нет вовсе: основа держит ą во всех формах — WSTĄPIŁ, WSTĄPIŁA, WSTĄPILI, WSTĄPIŁY. Повелительное WSTĄP оканчивается на твёрдый p." }
collocations:
  - { pl: "wstąpić do sklepu", ru: "зайти в магазин" }
  - { pl: "wstąpić na kawę", ru: "зайти на кофе" }
  - { pl: "wstąpić do partii", ru: "вступить в партию" }
family:
  - { pl: "wstępować", ru: "заходить; вступать", relation: aspect }
  - { pl: "stąpać", ru: "ступать", relation: root }
  - { pl: "wstęp", ru: "вступление; вход", relation: derived }
etymology: "Приставка w- «в» и STĄPIĆ, из праславянского *stǫpiti «ступить» — то же слово, что русское «ступить», с тем же корнем, что в «ступень», «поступь», «наступить». Польское гнездо широкое: STĄPAĆ «ступать», PRZYSTĄPIĆ «приступить», ODSTĄPIĆ «отступить», WYSTĄP «выступление», WSTĘP «вступление». Приставка w- делает то же, что русская «в-», и буквальное значение — «ступить внутрь». Отсюда оба современных смысла: ступить в организацию, то есть вступить, и ступить в чью-то дверь, то есть зайти."
memory: "wstąpić — чаще всего «зайти на минуту», а не «вступить»: wstąpię do ciebie значит «зайду к тебе». Вступление в партию — то же слово, различает дополнение."
idioms:
  - { pl: "wstąpić na kawę", ru: "зайти на кофе" }
  - { pl: "wstęp wolny", ru: "вход свободный" }
