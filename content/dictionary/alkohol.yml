senses:
  - id: drink
    ru: "алкоголь (напиток)"
    examples:
      - pl: "Piję alkohol."
        ru: "Я пью алкоголь."
        source: { kind: translated, id: 8522076 }
      - pl: "Pijesz alkohol."
        ru: "Ты пьёшь алкоголь."
        source: { kind: tatoeba, id: 8507644 }
