lemma: "alkohol"
rank: 1570
pos: noun
pron: { cyr: "алько́холь" }
senses:
  - id: drink
    ru: "алкоголь (напиток)"
    examples:
      - pl: "Piję alkohol."
        ru: "Я пью алкоголь."
        source: { kind: translated, id: 8522076 }
      - pl: "Pijesz alkohol."
        ru: "Ты пьёшь алкоголь."
        source: { kind: tatoeba, id: 8507644 }
      - pl: "Alkohol nie rozwiązuje żadnych problemów."
        ru: "Алкоголь не решает никаких проблем."
        source: { kind: tatoeba, id: 2603476 }
  - id: content
    ru: "спирт, содержание спирта"
    examples:
      - pl: "To piwo zawiera 5% alkoholu."
        ru: "Это пиво содержит 5% алкоголя."
        source: { kind: tatoeba, id: 12710211 }
      - pl: "Macie może coś bez alkoholu?"
        ru: "У вас есть что-нибудь безалкогольное?"
        source: { kind: tatoeba, id: 2210687 }
      - pl: "Prowadził pod wpływem alkoholu."
        ru: "Он вёл машину под воздействием алкоголя."
        source: { kind: translated, id: 461073 }
notes:
  - { kind: usage, text: "Множественное alkohole значит «спиртные напитки» или «спирты» (химические): mocne alkohole «крепкие напитки»." }
  - { kind: government, text: "«Пить алкоголь» — pić alkohol (винительный); «без алкоголя» — bez alkoholu (родительный)." }
  - { kind: usage, text: "Устойчиво: pod wpływem alkoholu «под воздействием алкоголя», problem z alkoholem «проблема с алкоголем»." }
  - { kind: usage, text: "Прилагательное — alkoholowy, а «безалкогольный» — bezalkoholowy." }
collocations:
  - { pl: "pić alkohol", ru: "пить алкоголь" }
  - { pl: "pod wpływem alkoholu", ru: "под воздействием алкоголя" }
  - { pl: "problem z alkoholem", ru: "проблема с алкоголем" }
etymology: "Из арабского al-kuhl «сурьмяной порошок» через латынь алхимиков — тем же путём, что и русское «алкоголь». Слова заимствованы из одного источника."
memory: "alkohol = «алкоголь», заимствование из арабского через латынь, как и русское слово. Множественное alkohole значит «спиртные напитки»: mocne alkohole «крепкие напитки»."
