# review
id: oblac
format: 2
lemma: "oblać"
rank: 2126
pos: verb
aspect: perf
pron: { cyr: "о́блаць" }
senses:
  - id: fail-exam
    ru: "провалить (экзамен), завалить"
    examples:
      - pl: "Oblał egzamin i pogrążył się w rozpaczy."
        ru: "Он провалился на экзамене и погрузился в отчаяние."
        source: { kind: tatoeba, id: 359166 }
      - pl: "Oblał egzamin."
        ru: "Он провалил экзамен."
        source: { kind: translated, id: 410092 }
      - pl: "Co zrobisz, jeśli oblejesz egzamin?"
        ru: "Что ты будешь делать, если провалишь экзамен?"
        source: { kind: translated, id: 917876 }
  - id: pour-over
    ru: "облить, окатить"
    examples:
      - pl: "Tom oblał się zimną wodą, żeby się obudzić."
        ru: "Том облился холодной водой, чтобы проснуться."
        source: { kind: tatoeba, id: 3991042 }
      - pl: "Mary oblała się czerwienią."
        ru: "Мэри залилась краской."
        source: { kind: translated, id: 6160210 }
notes:
  - { kind: usage, text: "В корпусе слово почти всегда про экзамены: oblać egzamin «провалить экзамен», oblać test «завалить тест». Буквальное «облить» встречается реже." }
  - { kind: government, text: "Винительный падеж в обоих значениях. Возвратное oblać się czymś «облиться чем-л.» — с творительным: oblać się rumieńcem «залиться румянцем»." }
  - { kind: false-friend, text: "Русское «облить» существует, но значения «провалить экзамен» у него нет — это чисто польское употребление." }
  - { kind: usage, text: "Несовершенный вид — oblewać. Отсюда же oblewać nowe mieszkanie «обмывать новую квартиру»." }
collocations:
  - { pl: "oblać egzamin", ru: "провалить экзамен" }
  - { pl: "oblać się rumieńcem", ru: "залиться румянцем" }
etymology: "o- + lać «лить», праславянское *lьjati; ср. русское «облить», «обливать»."
memory: "oblać — буквально «облить», но в живой речи это прежде всего «провалить экзамен»: oblać egzamin. Значения «завалить экзамен» у русского «облить» нет. Несовершенный вид — oblewać."
idioms:
  - { pl: "oblać egzamin", ru: "провалить экзамен" }
  - { pl: "oblać się rumieńcem", ru: "залиться румянцем" }
