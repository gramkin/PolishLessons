    source: { kind: authored }
  - form: "żywionym"
    pl: "Żywionym resztkami psom brakuje sił."
    ru: "Псам, которых кормят объедками, не хватает сил."
    source: { kind: authored }
  - form: "żywionym"
    pl: "Z dobrze żywionym koniem podróż jest szybsza."
