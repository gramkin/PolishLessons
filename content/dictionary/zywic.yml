    pl: "Był żywiony przez rodzinę."
    ru: "Его кормила семья."
    source: { kind: authored }
  - form: "żywiony"
    pl: "Pies nie był żywiony resztkami."
    ru: "Пса не кормили объедками."
    source: { kind: authored }
  - form: "żywiony"
    pl: "Żywiony nadzieją, czekał dalej."
    ru: "Питаемый надеждой, он ждал дальше."
    source: { kind: authored }
  - form: "żywionych"
    pl: "Nie ma tu źle żywionych zwierząt."
    ru: "Здесь нет плохо кормленых животных."
    source: { kind: authored }
  - form: "żywionych"
    pl: "Wśród żywionych z łaski był i on."
    ru: "Среди тех, кого кормили из милости, был и он."
    source: { kind: authored }
  - form: "żywionych"
    pl: "Od żywionych sianem krów zależy mleko."
    ru: "От коров, кормленых сеном, зависит молоко."
    source: { kind: authored }
  - form: "żywionym"
    pl: "W żywionym z łaski domu panował smutek."
