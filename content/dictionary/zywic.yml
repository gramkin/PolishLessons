# review
id: zywic
format: 2
lemma: "żywić"
rank: 2274
pos: verb
aspect: imperf
pron: { cyr: "жы́виць" }
senses:
  - id: feed-on
    ru: "питаться (żywić się czymś)"
    examples:
      - pl: "Bydło żywi się trawą."
        ru: "Скот кормится травой."
        source: { kind: tatoeba, id: 3188007 }
      - pl: "Owce żywią się trawą."
        ru: "Овцы питаются травой."
        source: { kind: tatoeba, id: 6154817 }
      - pl: "Małpy żywią się owadami, owocami i korzeniami."
        ru: "Обезьяны питаются насекомыми, фруктами и кореньями."
        source: { kind: tatoeba, id: 6692581 }
  - id: nourish
    ru: "кормить, содержать; питать (чувство)"
    examples:
      - pl: "Japończycy żywią się ryżem."
        ru: "Японцы питаются рисом."
        source: { kind: translated, id: 759591 }
      - pl: "Ona się żywi warzywami i brązowym ryżem."
        ru: "Она питается овощами и бурым рисом."
        source: { kind: translated, id: 411526 }
notes:
  - { kind: government, text: "Питаться чем-л. — żywić się czymś, ТВОРИТЕЛЬНЫЙ падеж, как в русском «питаться чем»." }
  - { kind: usage, text: "Без się значит «кормить, содержать»: żywić rodzinę «кормить семью». Переносно — żywić nadzieję «питать надежду», żywić urazę «держать обиду»." }
  - { kind: false-friend, text: "Корень żyć «жить», żywy «живой» — обе карточки уже есть; ср. русское «живить», «пища»." }
  - { kind: usage, text: "Несовершенный вид; совершенный — nakarmić для еды, wyżywić для содержания." }
collocations:
  - { pl: "żywić się czymś", ru: "питаться чем-л." }
  - { pl: "żywić nadzieję", ru: "питать надежду" }
etymology: "От żyć «жить», żywy «живой»; ср. русское «живить», «пища», «нажива»."
memory: "żywić się czymś — «питаться чем-л.», с творительным как в русском. Без się значит «кормить», а переносно żywić nadzieję «питать надежду»."
idioms:
  - { pl: "żywić się czymś", ru: "питаться чем-л." }
  - { pl: "żywić nadzieję", ru: "питать надежду" }
