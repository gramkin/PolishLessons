etymology: "От того же корня, что DRZEĆ «драть, рвать», из праславянского *derti — родственного русским «драть», «дерюга», «дёрн». Исходное значение было материальным: грубая ткань, то, что надрано и сшито наспех, и отсюда конская попона, которую делали именно из такой ткани. Русская «дерюга» сохранила значение самой ткани, польская DERKA перешла на изделие. Любопытная развязка выходит с карточкой OPONA: русская «попона», тоже конская, происходит от «натянуть вокруг» и отвечает польской OPONA, которая стала шиной. То есть в каждом языке один из двух корней ушёл к шине, а другой остался при коне, и выбор оказался зеркальным."
memory: "Родня русской «дерюге» и глаголу «драть»: грубая ткань, отсюда конская попона. По-русски нужна «попона». И зеркальная развязка с карточкой opona: польская opona, шина, отвечает русской «попоне», а польская derka, попона, отвечает русской «дерюге». В дательном и местном k переходит в c: derce. Городское одеяло — kołdra или koc."
