notes:
  - { kind: false-friend, text: "Русский родственник у слова есть, и он помогает: DERKA родственна русской «дерюге» и глаголу «драть», то есть названа по грубой, рваной ткани. Отсюда и значение: это не нежное одеяло, а грубое покрывало, прежде всего конская попона. По-русски в первом значении нужна именно «попона», и тут стоит вспомнить карточку OPONA: польская OPONA, шина, происходит от «натянутого вокруг» и родственна русской «попоне», а польская DERKA, попона, родственна русской «дерюге». Два слова поменялись местами между языками, и это стоит проговорить, чтобы не спутать." }
  - { kind: pronunciation, text: "Читается «дэ́рка», ударение на первом слоге из двух. Буква E даёт «э» и предыдущую согласную не смягчает: «дэ», а не «де». В дательном и местном падеже DERCE согласная K переходит в C: «дэ́рце». Это то же чередование, что в CZAPKA и CZAPCE, BÓJKA и BÓJCE. В родительном множественного DEREK появляется вставная гласная E между R и K, как в CZAPEK и DESEK." }
  - { kind: usage, text: "Слово бытовое и слегка деревенское, с ясным кругом употребления: конюшня, дача, старый диван. В городской квартире одеяло называют KOŁDRA, покрывало — KOCA или NARZUTA, а DERKA звучит нарочито просто, почти с нежностью к старой вещи. В конном деле это основной термин: DERKA ZIMOWA, DERKA PRZECIWDESZCZOWA, и в каталогах для верховой езды слово стоит рядом с SIODŁO и UZDA. Уменьшительное DERECZKA употребляется о детских покрывальцах." }
  - { kind: government, text: "Женский род на -A, склонение правильное. Винительный на -Ę: ZARZUĆ DERKĘ. Накрывать чем-то — глагол PRZYKRYĆ с творительным: PRZYKRYĆ DERKĄ, и русский строит это так же. Из какого материала — предлог Z с родительным: DERKA Z WEŁNY. При отрицании винительный уходит в родительный: NIE ZARZUCIŁ DERKI. Родительный множественного DEREK требуется после числительных выше четырёх: PIĘĆ DEREK." }
