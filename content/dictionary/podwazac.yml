# review
id: podwazac
format: 2
lemma: "podważać"
rank: 5827
pos: verb
aspect: imperf
pron: { cyr: "подва́жаць" }
senses:
  - id: undermine
    ru: "подрывать, ставить под сомнение, оспаривать"
    examples:
      - pl: "Premier podważa reputację głowy państwa."
        ru: "Премьер подрывает репутацию главы государства."
        source: { kind: translated, id: 2979786 }
      - pl: "Podważasz moją decyzję?"
        ru: "Ты оспариваешь моё решение?"
        source: { kind: translated, id: 5510760 }
      - pl: "Nowe badania podważają tę teorię."
        ru: "Новые исследования ставят эту теорию под сомнение."
        source: { kind: authored }
      - pl: "Nie podważaj autorytetu nauczyciela przy dzieciach."
        ru: "Не подрывай авторитет учителя при детях."
        source: { kind: authored }
  - id: pry
    ru: "поддевать, приподнимать (рычагом, ножом)"
    examples:
      - pl: "Złodziej podważał okno łomem."
        ru: "Вор поддевал окно ломом."
        source: { kind: authored }
      - pl: "Podważam wieczko słoika nożem."
        ru: "Я поддеваю крышку банки ножом."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "PODWAŻAĆ — не «подвешивать» и не «взвешивать» (взвешивать — WAŻYĆ). Буквально это «поддевать снизу рычагом», а переносно — «подрывать, оспаривать»: PODWAŻAĆ ZAUFANIE «подрывать доверие», PODWAŻAĆ WIARYGODNOŚĆ «ставить под сомнение достоверность»." }
  - { kind: usage, text: "Несовершенный вид; совершенный — PODWAŻYĆ. Спряжение на -AM: PODWAŻAM, PODWAŻASZ, PODWAŻAJĄ. Отсюда NIEPODWAŻALNY «неоспоримый». Мужско-личное страдательное PODWAŻANI в карточку не включено: под сомнение ставят решения и доводы, а не людей." }
  - { kind: government, text: "Что — винительный: PODWAŻAĆ DECYZJĘ, PODWAŻAĆ SENS. После отрицания — родительный: NIE PODWAŻAM TWOJEJ DECYZJI. Чем поддевают — творительный: PODWAŻAĆ ŁOMEM, NOŻEM." }
collocations:
  - { pl: "podważać autorytet", ru: "подрывать авторитет" }
  - { pl: "podważać zaufanie", ru: "подрывать доверие" }
  - { pl: "podważać decyzję", ru: "оспаривать решение" }
  - { pl: "podważać sens", ru: "ставить под сомнение смысл" }
family:
  - { pl: "podważyć", ru: "поддеть; подорвать, оспорить", relation: aspect }
  - { pl: "ważyć", ru: "весить, взвешивать", relation: root, id: wazyc }
  - { pl: "niepodważalny", ru: "неоспоримый", relation: derived }
  - { pl: "podważanie", ru: "подрыв, оспаривание", relation: derived }
etymology: "Приставка POD- «под» плюс корень WAŻ-, тот же, что в WAŻYĆ «весить» и WAGA «весы»."
memory: "Podważać — поддеть рычагом снизу: и крышку, и чужой авторитет. Niepodważalny — то, что не поддеть, «неоспоримый»."
idioms:
  - { pl: "podważać fundamenty", ru: "подрывать основы" }
formExamplesSkip:
