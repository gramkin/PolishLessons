# review
id: przyniesc
format: 2
lemma: "przynieść"
rank: 386
pos: verb
aspect: perf
pron: { cyr: "пшы́несьць" }
senses:
  - id: bring
    ru: "принести"
    examples:
      - pl: "Przynieś mi kawę."
        ru: "Принеси мне кофе."
        source: { kind: tatoeba, id: 12680513 }
      - pl: "Przynieś mi moje okulary."
        ru: "Принеси мне мои очки."
        source: { kind: tatoeba, id: 659097 }
      - pl: "Przynieś coś do czytania!"
        ru: "Принеси чего-нибудь почитать!"
        source: { kind: tatoeba, id: 3743736 }
  - id: yield
    ru: "принести (результат, плоды, перемену)"
    examples:
      - pl: "Twoje badania przyniosą owoce."
        ru: "Твои исследования принесут плоды."
        source: { kind: translated, id: 357978 }
      - pl: "Jego odkrycie przyniosło rewolucję w transporcie."
        ru: "Его открытие принесло революцию в транспорте."
        source: { kind: translated, id: 415221 }
      - pl: "Jaki wynik przyniosły nasze obrady?"
        ru: "Какой результат принесли наши переговоры?"
        source: { kind: translated, id: 881976 }
notes:
  - { kind: usage, text: "Прошедшее время мужского рода — przyniósł, с ó, а женского — przyniosła, с обычным o. Это то же чередование, что в русском «нёс — несла»." }
  - { kind: usage, text: "Будущее берёт другую основу: przyniosę, przyniesiesz, przyniesie." }
  - { kind: usage, text: "Несовершенный вид — przynosić: Przynosi mi kawę codziennie «Он приносит мне кофе каждый день»." }
  - { kind: usage, text: "gadać, co ślina na język przyniesie — «молоть что на язык придёт», о бессвязной болтовне." }
collocations:
  - { pl: "przynieść kawę", ru: "принести кофе" }
  - { pl: "przynieść owoce", ru: "принести плоды" }
  - { pl: "przynieś mi", ru: "принеси мне" }
etymology: "Из przy- + nieść «нести»; русское «принести» собрано ровно из тех же двух частей."
memory: "przynieść — «принести», слово буква в букву русское. Ловушка в прошедшем времени: przyniósł (он) с ó, но przyniosła (она) с обычным o — точно как русское «нёс — несла»."
idioms:
  - { pl: "gadać, co ślina na język przyniesie", ru: "молоть что на язык придёт" }
  - { pl: "przynieść owoce", ru: "принести плоды" }
  - { pl: "co przyniesie los", ru: "что принесёт судьба" }
