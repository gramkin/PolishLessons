# review
id: program
format: 2
lemma: "program"
rank: 681
pos: noun
pron: { cyr: "про́грам" }
senses:
  - id: tv-show
    ru: "программа, передача (телевизионная)"
    examples:
      - pl: "Oglądałeś ten program?"
        ru: "Ты смотрел эту передачу?"
        source: { kind: translated, id: 12564149 }
      - pl: "Popularność tego programu rośnie."
        ru: "Популярность этой передачи растёт."
        source: { kind: translated, id: 749174 }
      - pl: "Lubię telewizyjne programy informacyjne."
        ru: "Я люблю телевизионные новостные программы."
        source: { kind: translated, id: 817895 }
  - id: software
    ru: "программа (компьютерная)"
    examples:
      - pl: "Zainstalowała program."
        ru: "Она установила программу."
        source: { kind: translated, id: 5370006 }
      - pl: "Usunąłem pięć programów."
        ru: "Я удалил пять программ."
        source: { kind: translated, id: 3743956 }
      - pl: "Ten program działa szybciej."
        ru: "Эта программа работает быстрее."
        source: { kind: authored }
  - id: plan
    ru: "программа, план (обучения, мероприятия)"
    note: "w programie «в программе, в передаче»."
    examples:
      - pl: "David dołączył do programu."
        ru: "Давид присоединился к программе."
        source: { kind: translated, id: 12053408 }
      - pl: "Rząd zapewni firmom uczestniczącym w programie, kredyty wolne od odsetek."
        ru: "Правительство обеспечит участвующим в программе фирмам беспроцентные кредиты."
        source: { kind: translated, id: 1465581 }
      - pl: "W programie został zapowiedziany jako Romeo."
        ru: "В программе его объявили как Ромео."
        source: { kind: translated, id: 403532 }
notes:
  - { kind: usage, text: "Род не совпадает: польское program мужского рода (ten program, tego programu), а русская «программа» — женского." }
  - { kind: usage, text: "Слово покрывает ровно те же смыслы, что русское: телепередача (program telewizyjny), компьютерная программа (zainstalować program), план обучения (program nauczania)." }
  - { kind: government, text: "Предложный — w programie: wystąpić w programie «выступить в передаче», uczestniczyć w programie «участвовать в программе»." }
  - { kind: usage, text: "Родня: programować «программировать», programista «программист», oprogramowanie «программное обеспечение»." }
collocations:
  - { pl: "program telewizyjny", ru: "телепрограмма" }
  - { pl: "zainstalować program", ru: "установить программу" }
  - { pl: "w programie", ru: "в программе" }
  - { pl: "program nauczania", ru: "учебная программа" }
family:
  - { pl: "programować", ru: "программировать", relation: derived }
  - { pl: "programista", ru: "программист", relation: derived }
  - { pl: "oprogramowanie", ru: "программное обеспечение", relation: derived }
etymology: "Из греческого prógramma «написанное впереди, объявление» через западноевропейские языки — то же заимствование, что и русская «программа»."
memory: "program — «программа», и покрывает оно ровно те же смыслы, что русское слово: телепередача, компьютерная программа, план обучения. Разница одна, но постоянная: польское program мужского рода — ten program, tego programu, — тогда как русская «программа» женского. Предложный падеж — w programie: wystąpić w programie."
idioms:
  - { pl: "program telewizyjny", ru: "телепрограмма" }
  - { pl: "zainstalować program", ru: "установить программу" }
  - { pl: "w programie", ru: "в программе" }
formExamplesSkip:
  - { form: "programie", cell: "Звательный", reason: "звательный падеж: для неодушевлённого существительного он практически не употребляется" }
