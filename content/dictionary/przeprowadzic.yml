# review
id: przeprowadzic
format: 2
lemma: "przeprowadzić"
rank: 1522
pos: verb
aspect: perf
pron: { cyr: "пшэпрова́дзиць" }
senses:
  - id: conduct
    ru: "провести (исследование, эксперимент, разговор)"
    examples:
      - pl: "Przeprowadzili nowy eksperyment chemiczny."
        ru: "Они провели новый химический эксперимент."
        source: { kind: translated, id: 362576 }
      - pl: "Policja chciała przeprowadzić gruntowne śledztwo."
        ru: "Полиция хотела провести тщательное расследование."
        source: { kind: translated, id: 735422 }
      - pl: "Dzisiaj przeprowadzimy doświadczenie dotyczące prawa Ohma."
        ru: "Сегодня мы проведём опыт по закону Ома."
        source: { kind: translated, id: 6683322 }
  - id: move-house
    ru: "переехать (с się)"
    examples:
      - pl: "Kilka dni temu się przeprowadziliśmy."
        ru: "Несколько дней назад мы переехали."
        source: { kind: tatoeba, id: 6320393 }
      - pl: "Przeprowadziłem się do Bostonu."
        ru: "Я переехал в Бостон."
        source: { kind: translated, id: 5879336 }
      - pl: "Rodzina Smithów przeprowadziła się do Ohio."
        ru: "Семья Смитов переехала в Огайо."
        source: { kind: translated, id: 827321 }
  - id: lead-across
    ru: "перевести (через что-л.), осуществить (план)"
    examples:
      - pl: "Dariusz przeprowadził armię z Azji do Europy."
        ru: "Дарий перевёл армию из Азии в Европу."
        source: { kind: translated, id: 820858 }
      - pl: "Nie mógł przeprowadzić swojego planu."
        ru: "Он не смог осуществить свой план."
        source: { kind: translated, id: 561281 }
notes:
  - { kind: usage, text: "Без się — «провести, осуществить» (przeprowadzić badanie «провести исследование»), с się — «переехать» (przeprowadzić się do Bostonu «переехать в Бостон»). Это две разные жизни одного глагола." }
  - { kind: government, text: "Без się требует винительного падежа: przeprowadzić eksperyment. С się направление задаётся предлогом do с родительным: przeprowadzić się do Warszawy." }
  - { kind: usage, text: "Несовершенный вид — przeprowadzać (się). Существительное przeprowadzka значит «переезд»." }
  - { kind: usage, text: "Безличная форма przeprowadzono «провели» частотна в отчётах: Przeprowadzono eksperyment «Провели эксперимент»." }
collocations:
  - { pl: "przeprowadzić się", ru: "переехать" }
  - { pl: "przeprowadzić badanie", ru: "провести исследование" }
  - { pl: "przeprowadzić rozmowę", ru: "провести разговор" }
etymology: "Приставка prze- + prowadzić «вести» (от wodzić, то же, что русское «водить»). Русские «провести» и «перевести» собраны из того же корня и той же логики приставки."
memory: "przeprowadzić без się = «провести, осуществить»: przeprowadzić badanie. С się = «переехать»: przeprowadziłem się do Bostonu. Несовершенный вид — przeprowadzać, а существительное przeprowadzka значит «переезд»."
idioms:
