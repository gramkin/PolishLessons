# review
id: wierzyc
format: 2
lemma: "wierzyć"
rank: 226
pos: verb
aspect: imperf
aspectPair: uwierzyc
pron: { cyr: "ве́жыць" }
senses:
  - id: believe-someone
    ru: "верить кому-либо (с дательным падежом)"
    note: "wierzyć komuś — как русское «верить кому-то»."
    examples:
      - pl: "Nie wierz mu."
        ru: "Не верь ему."
        source: { kind: tatoeba, id: 357827 }
      - pl: "Nie wierzę mu."
        ru: "Я ему не верю."
        source: { kind: tatoeba, id: 6328301 }
      - pl: "Czemu ci wierzę?"
        ru: "Почему я тебе верю?"
        source: { kind: tatoeba, id: 6602637 }
  - id: believe-in
    ru: "верить во что-либо (wierzyć w + винительный)"
    examples:
      - pl: "Wierzę w ciebie."
        ru: "Я верю в тебя."
        source: { kind: tatoeba, id: 6328305 }
      - pl: "Wierzymy w Boga."
        ru: "Мы верим в бога."
        source: { kind: tatoeba, id: 361318 }
      - pl: "Wierzę w przyjaźń."
        ru: "Я верю в дружбу."
        source: { kind: tatoeba, id: 644050 }
notes:
  - { kind: usage, text: "Два управления, и оба совпадают с русскими: wierzyć komuś «верить кому-то» (дательный) и wierzyć w coś «верить во что-то» (винительный). Nie wierzę mu, ale wierzę w niego — «не верю ему, но верю в него»." }
  - { kind: usage, text: "Совершенный вид — uwierzyć: Nie mogę w to uwierzyć «Я не могу в это поверить»." }
  - { kind: usage, text: "Причастие wierzący значит «верующий»: Czy jesteś wierzący? «Ты верующий?»" }
  - { kind: usage, text: "wierzyć na słowo — «верить на слово»; nie wierzyć własnym oczom — «не верить своим глазам»." }
collocations:
  - { pl: "wierzyć komuś", ru: "верить кому-то" }
  - { pl: "wierzyć w Boga", ru: "верить в бога" }
  - { pl: "wierz mi", ru: "поверь мне" }
  - { pl: "trudno uwierzyć", ru: "трудно поверить" }
etymology: "От wiara «вера», праславянское *věra — то же слово, что русские «вера» и «верить»."
memory: "Оба управления совпадают с русскими: wierzyć komuś «верить кому-то» и wierzyć w coś «верить во что-то». Nie wierzę mu, ale wierzę w niego."
idioms:
  - { pl: "nie wierzyć własnym oczom", ru: "не верить своим глазам" }
  - { pl: "wierzyć na słowo", ru: "верить на слово" }
  - { pl: "wierzyć się nie chce", ru: "не верится" }
