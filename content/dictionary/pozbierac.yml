# review
id: pozbierac
format: 2
lemma: "pozbierać"
rank: 5279
pos: verb
pron: { cyr: "позбе́раць" }
senses:
  - id: gather
    ru: "собрать (разбросанное), подобрать"
    examples:
      - pl: "Pozbieraj zabawki z podłogi."
        ru: "Собери игрушки с пола."
        source: { kind: authored }
      - pl: "Pozbierała rozsypane monety."
        ru: "Она подобрала рассыпанные монеты."
        source: { kind: authored }
      - pl: "Pozbieraliśmy śmieci w lesie."
        ru: "Мы собрали мусор в лесу."
        source: { kind: authored }
  - id: recover
    ru: "прийти в себя (pozbierać się)"
    examples:
      - pl: "Długo nie mógł się pozbierać po rozstaniu."
        ru: "Он долго не мог прийти в себя после расставания."
        source: { kind: authored }
      - pl: "Pozbierała się i wróciła do pracy."
        ru: "Она собралась с силами и вернулась на работу."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "POZBIERAĆ — «собрать то, что разбросано, по одному»: POZBIERAĆ KLOCKI, LIŚCIE, MYŚLI. Отличие от ZEBRAĆ: ZEBRAĆ — «собрать, накопить» вообще, а POZBIERAĆ — подобрать много мелкого. POZBIERAĆ SIĘ — «прийти в себя, собраться» после удара судьбы." }
  - { kind: usage, text: "Пятьдесят две формы: страдательное POZBIERANY — о вещах, «собранный»; форма для мужчин-людей POZBIERANI в карточку не включена — о людях говорят ZEBRANI. Спряжение на -AM, -ASZ: POZBIERAM, POZBIERASZ. Видовой партнёр — ZBIERAĆ." }
  - { kind: government, text: "Что — винительный: POZBIERAĆ GRZYBY, OKRUCHY. Откуда — Z с родительным: Z PODŁOGI, ZE STOŁU. После чего прийти в себя — PO с местным: POZBIERAĆ SIĘ PO CHOROBIE." }
  - { kind: pronunciation, text: "Читается «позбе́раць», три слога, ударение на предпоследнем. ZB звонкие, IE после B — мягкое «бе». Конечное Ć — «ць». POZBIERAJ — «позбе́рай»." }
  - { kind: register, text: "Разговорное бытовое слово. Частая просьба к детям: POZBIERAJ ZABAWKI! Переносное POZBIERAĆ MYŚLI — «собраться с мыслями», POZBIERAĆ SIĘ DO KUPY — «собраться в кучу», грубовато-разговорное." }
collocations:
  - { pl: "pozbierać zabawki", ru: "собрать игрушки" }
  - { pl: "pozbierać myśli", ru: "собраться с мыслями" }
  - { pl: "pozbierać się po stracie", ru: "прийти в себя после потери" }
family:
  - { pl: "zbierać", ru: "собирать", relation: aspect, id: zbierac }
  - { pl: "zebrać", ru: "собрать", relation: root, id: zebrac }
  - { pl: "brać", ru: "брать", relation: root }
etymology: "Приставка PO- плюс ZBIERAĆ «собирать», от BRAĆ «брать», праславянское *bьrati, то же, что русское «брать», «собирать». Приставка PO- придаёт значение «по одному, всё по очереди»."
memory: "Pozbierać — собрать разбросанное: pozbieraj zabawki! Pozbierać myśli — собраться с мыслями. Pozbierać się — прийти в себя. Читается «позбе́раць»."
idioms:
  - { pl: "pozbierać się do kupy", ru: "собраться, взять себя в руки" }
formExamplesSkip:
  - { form: "pozbierani", reason: "о людях говорят ZEBRANI: формы для мужчин-людей нет" }
