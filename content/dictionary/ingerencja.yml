id: ingerencja
format: 2
lemma: "ingerencja"
rank: 5966
pos: noun
pron: { cyr: "ингерэ́нцья" }
senses:
  - id: interference
    ru: "вмешательство (в чужие дела, в чью-то жизнь)"
    examples:
      - { pl: "Rząd ostro skrytykował ingerencję w wewnętrzne sprawy kraju.", ru: "Правительство резко раскритиковало вмешательство во внутренние дела страны.", source: { kind: authored } }
      - { pl: "Nie życzę sobie żadnej ingerencji w moje życie.", ru: "Я не желаю никакого вмешательства в мою жизнь.", source: { kind: authored } }
      - { pl: "Sędzia musi działać bez ingerencji polityków.", ru: "Судья должен действовать без вмешательства политиков.", source: { kind: authored } }
  - id: intervention
    ru: "вмешательство (медицинское, техническое), воздействие"
    examples:
      - { pl: "Lekarze uznali, że ingerencja chirurgiczna jest konieczna.", ru: "Врачи решили, что хирургическое вмешательство необходимо.", source: { kind: authored } }
      - { pl: "Każda ingerencja w kod może zepsuć program.", ru: "Любое вмешательство в код может сломать программу.", source: { kind: authored } }
notes:
  - { kind: government, text: "INGERENCJA W + винительный: INGERENCJA W SPRAWY, W ŻYCIE, W PRZYRODĘ. Предлог совпадает с русским «вмешательство в». Глагол — INGEROWAĆ W COŚ «вмешиваться во что-то»." }
  - { kind: register, text: "Книжное, официальное слово: право, политика, медицина, газеты. В быту говорят WTRĄCANIE SIĘ: NIE WTRĄCAJ SIĘ! — «не вмешивайся!»." }
  - { kind: usage, text: "Склоняется как STACJA: INGERENCJI в родительном, дательном и предложном, INGERENCJĘ в винительном, INGERENCJĄ в творительном. Старая форма родительного множественного INGERENCYJ устарела, звательная INGERENCJO не употребляется." }
  - { kind: pronunciation, text: "G перед E читается как «г», а не «ж», как во французском или английском: «ингерэ́нцья». Ударение на предпоследнем слоге, CJA — один слог." }
collocations:
  - { pl: "ingerencja w sprawy wewnętrzne", ru: "вмешательство во внутренние дела" }
  - { pl: "ingerencja chirurgiczna", ru: "хирургическое вмешательство" }
  - { pl: "bez ingerencji z zewnątrz", ru: "без вмешательства извне" }
  - { pl: "ingerencja państwa", ru: "вмешательство государства" }
family:
  - { pl: "ingerować", ru: "вмешиваться", relation: root }
synonyms: ["interwencja", "wtrącanie się"]
etymology: "Из латинского INGERERE «вносить, навязывать» (IN- «в» + GERERE «нести»). Отсюда же глагол INGEROWAĆ."
memory: "Ingerencja — вмешательство; ingerencja W coś, как «вмешательство В». Книжное слово, в быту — wtrącanie się."
idioms:
