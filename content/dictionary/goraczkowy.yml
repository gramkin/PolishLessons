notes:
  - { kind: government, text: "Обычное прилагательное; наречие — gorączkowo «лихорадочно»." }
  - { kind: false-friend, text: "От gorączka «жар, лихорадка», а та от gorący «горячий», которое уже есть в словаре. Русское «лихорадочный» — от «лихо радеть», образ совсем другой." }
  - { kind: usage, text: "Переносное значение встречается чаще прямого: gorączkowy pośpiech «лихорадочная спешка», gorączkowe poszukiwania «лихорадочные поиски»." }
  - { kind: usage, text: "В корпусе прилагательное не встречается, поэтому все примеры составлены вручную." }
collocations:
  - { pl: "gorączkowy pośpiech", ru: "лихорадочная спешка" }
etymology: "От gorączka «жар», от gorący «горячий»."
memory: "gorączkowy — «лихорадочный», от gorączka «жар» и gorący «горячий». Переносно: gorączkowy pośpiech «лихорадочная спешка»."
