  - { kind: usage, text: "Переносное значение встречается чаще прямого: gorączkowy pośpiech «лихорадочная спешка», gorączkowe poszukiwania «лихорадочные поиски»." }
  - { kind: usage, text: "В корпусе прилагательное не встречается, поэтому все примеры составлены вручную." }
