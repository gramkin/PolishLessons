# review
id: duzo
format: 2
lemma: "dużo"
rank: 120
pos: adv
pron: { cyr: "ду́жо" }
senses:
  - id: much
    ru: "много (+ родительный падеж)"
    note: "После dużo существительное стоит в родительном падеже: dużo ludzi, dużo czasu."
    examples:
      - pl: "Dużo czytam."
        ru: "Я читал много."
        source: { kind: tatoeba, id: 8771729 }
      - pl: "Mam dużo ziemi."
        ru: "У меня много земли."
        source: { kind: tatoeba, id: 404061 }
      - pl: "Ona dużo mówi."
        ru: "Она много говорит."
        source: { kind: tatoeba, id: 633704 }
  - id: more
    ru: "więcej — больше; najwięcej — больше всего"
    examples:
      - pl: "Więcej herbaty?"
        ru: "Ещё чаю?"
        source: { kind: tatoeba, id: 10805930 }
      - pl: "Chcę wiedzieć więcej."
        ru: "Я хочу знать больше."
        source: { kind: authored }
      - pl: "Najwięcej czasu zajmuje początek."
        ru: "Больше всего времени занимает начало."
        source: { kind: authored }
notes:
  - { kind: government, text: "dużo, więcej и najwięcej требуют родительного падежа — как русское «много»: dużo pracy «много работы», więcej wody «больше воды»." }
  - { kind: usage, text: "О считаемых предметах чаще говорят wiele (wiele osób), о неисчисляемом — dużo (dużo czasu); в разговорной речи dużo вытесняет wiele." }
collocations:
  - { pl: "za dużo", ru: "слишком много" }
  - { pl: "dużo więcej", ru: "намного больше" }
  - { pl: "jak dużo?", ru: "сколько?" }
etymology: "От прилагательного duży «большой»; степени сравнения образуются от другого корня: dużo — więcej — najwięcej, как в русском «много — больше»."
memory: "Цепочка dużo — więcej — najwięcej («много — больше — больше всего»), и после каждой ступени идёт родительный падеж: dużo ludzi, więcej czasu, najwięcej pracy."
idioms:
  - { pl: "za dużo", ru: "слишком много" }
  - { pl: "co za dużo, to niezdrowo", ru: "хорошего понемножку" }
  - { pl: "dużo szczęścia!", ru: "удачи!" }
formExamples:
  - form: "dużo"
    pl: "Tom dużo pije."
    ru: "Том много пьёт."
    source: { kind: tatoeba, id: 6554167 }
  - form: "dużo"
    pl: "Za dużo wiem."
    ru: "Я знаю слишком много."
    source: { kind: tatoeba, id: 3645370 }
  - form: "dużo"
    pl: "Dużo się nauczyłem."
    ru: "Я многому научился."
    source: { kind: authored }
  - form: "najwięcej"
    pl: "Kto miał najwięcej punktów?"
    ru: "У кого было больше всего очков?"
    source: { kind: translated, id: 3610612 }
  - form: "najwięcej"
    pl: "Kto zarabia najwięcej?"
    ru: "Кто зарабатывает больше всего?"
    source: { kind: authored }
  - form: "najwięcej"
    pl: "Najwięcej ludzi przychodzi w piątek."
    ru: "Больше всего людей приходит в пятницу."
    source: { kind: authored }
  - form: "więcej"
    pl: "Pij więcej wody."
    ru: "Пей больше воды."
    source: { kind: tatoeba, id: 6463997 }
  - form: "więcej"
    pl: "Powiedz mi więcej."
    ru: "Расскажи мне больше."
    source: { kind: authored }
  - form: "więcej"
    pl: "Nie mam więcej pytań."
    ru: "У меня больше нет вопросов."
    source: { kind: authored }
