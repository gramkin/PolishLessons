formExamples:
  - form: "przysłał"
    pl: "Kto je przysłał?"
    ru: "Кто их прислал?"
    source: { kind: translated, id: 6306764 }
  - form: "przysłał"
    pl: "Tom przysłał mnie tutaj."
    ru: "Том прислал меня сюда."
    source: { kind: translated, id: 8500412 }
  - form: "przysłał"
    pl: "Przysłał mi kartkę urodzinową."
    ru: "Он прислал мне открытку на день рождения."
    source: { kind: translated, id: 593937 }
  - form: "przysłał"
    pl: "Reporter przysłał korespondencję z Moskwy."
    ru: "Репортёр прислал корреспонденцию из Москвы."
    source: { kind: translated, id: 711435 }
  - form: "przysłała"
    pl: "Przysłała mi tą książkę."
    ru: "Она послала мне эту книгу."
    source: { kind: tatoeba, id: 980623 }
  - form: "przysłała"
    pl: "Ciotka przysłała mi prezent urodzinowy."
    ru: "Тётя прислала мне подарок на день рождения."
    source: { kind: translated, id: 362510 }
  - form: "przysłała"
    pl: "Przysłała mi prezent w zamian za moją radę."
    ru: "Она прислала мне подарок в благодарность за совет."
    source: { kind: translated, id: 540072 }
  - form: "przysłałeś"
    pl: "Czytałem list, który mi przysłałeś."
    ru: "Я читал письмо, которое ты мне прислал."
    source: { kind: translated, id: 907967 }
  - form: "przysłałeś"
    pl: "Dziękuję za zdjęcia, które przysłałeś."
    ru: "Спасибо за фотографии, которые ты прислал."
    source: { kind: authored }
  - form: "przysłałeś"
    pl: "Nie przysłałeś mi adresu."
    ru: "Ты не прислал мне адрес."
    source: { kind: authored }
  - form: "przyślę"
    pl: "Przyślę ci link."
    ru: "Я пришлю тебе ссылку."
    source: { kind: translated, id: 3806049 }
  - form: "przyślę"
    pl: "Przyślę ci rachunek."
    ru: "Я пришлю тебе счёт."
    source: { kind: translated, id: 6553806 }
  - form: "przyślę"
    pl: "Przyślę ci zdjęcia jutro."
    ru: "Я пришлю тебе фотографии завтра."
    source: { kind: authored }
  - form: "przyślij"
    pl: "Przyślij Toma."
    ru: "Пришли Тома."
    source: { kind: translated, id: 10542375 }
  - form: "przyślij"
    pl: "Przyślij mi dziś mailem swoje zdjęcie."
    ru: "Пришли мне сегодня по почте свою фотографию."
    source: { kind: translated, id: 601710 }
  - form: "przyślij"
    pl: "Proszę przyślij mi list jak tylko dotrzesz do celu."
    ru: "Пожалуйста, пришли мне письмо, как только доберёшься."
    source: { kind: translated, id: 2139077 }
