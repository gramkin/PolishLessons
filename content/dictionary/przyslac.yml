# review
id: przyslac
format: 2
lemma: "przysłać"
rank: 1337
pos: verb
aspect: perf
pron: { cyr: "пшы́суаць" }
senses:
  - id: send
    ru: "прислать (к говорящему)"
    examples:
      - pl: "Kto je przysłał?"
        ru: "Кто их прислал?"
        source: { kind: translated, id: 6306764 }
      - pl: "Przysłał mi kartkę urodzinową."
        ru: "Он прислал мне открытку на день рождения."
        source: { kind: translated, id: 593937 }
      - pl: "Przysłała mi tą książkę."
        ru: "Она послала мне эту книгу."
        source: { kind: tatoeba, id: 980623 }
  - id: imperative
    ru: "przyślij — пришли"
    examples:
      - pl: "Przyślij Toma."
        ru: "Пришли Тома."
        source: { kind: translated, id: 10542375 }
      - pl: "Przyślij mi dziś mailem swoje zdjęcie."
        ru: "Пришли мне сегодня по почте свою фотографию."
        source: { kind: translated, id: 601710 }
      - pl: "Proszę przyślij mi list jak tylko dotrzesz do celu."
        ru: "Пожалуйста, пришли мне письмо, как только доберёшься."
        source: { kind: translated, id: 2139077 }
  - id: will-send
    ru: "przyślę — пришлю"
    examples:
      - pl: "Przyślę ci link."
        ru: "Я пришлю тебе ссылку."
        source: { kind: translated, id: 3806049 }
      - pl: "Przyślę ci rachunek."
        ru: "Я пришлю тебе счёт."
        source: { kind: translated, id: 6553806 }
      - pl: "Czytałem list, który mi przysłałeś."
        ru: "Я читал письмо, которое ты мне прислал."
        source: { kind: translated, id: 907967 }
notes:
  - { kind: usage, text: "Глагол słać живёт в польском двумя разными спряжениями: «слать» — ślę, ślesz, и «стелить» — ścielę, ścielesz (posłać łóżko «постелить постель» — pościelę). Формы на przyściel- (przyścielę, przyścielesz, przyściele, przyścielą, przyściel) идут от второго и к przysłać «прислать» отношения не имеют, поэтому оставлены без примеров. Будущее от przysłać — przyślę, przyślesz, przyśle, przyślą, повелительное — przyślij." }
  - { kind: government, text: "przysłać komuś coś «прислать кому-то что-то» — дательный и винительный, ровно как в русском." }
  - { kind: usage, text: "Основа чередуется резко: przysłać и przysłał, но przyślę и przyślij в будущем и повелительном." }
  - { kind: false-friend, text: "Отличайте от wysłać «отправить»: przysłać значит «прислать сюда», в сторону говорящего." }
  - { kind: usage, text: "Вид совершенный; несовершенный — przysyłać. Przyślij mi mailem «пришли мне по почте» — творительный падеж средства." }
collocations:
  - { pl: "przysłać list", ru: "прислать письмо" }
  - { pl: "przyślij mi", ru: "пришли мне" }
  - { pl: "przysłać mailem", ru: "прислать по почте" }
etymology: "Приставка przy- и słać «слать», из праславянского *sъlati. Русское «прислать» собрано ровно теми же частями и значит то же самое."
memory: "przysłać — «прислать», к говорящему, в отличие от wysłać «отправить». Основа чередуется: przysłał, но przyślę, przyślij. Несовершенный вид — przysyłać."
idioms:
  - { pl: "przyślij mi", ru: "пришли мне" }
  - { pl: "przysłać mailem", ru: "прислать по почте" }
  - { pl: "przysłać list", ru: "прислать письмо" }
