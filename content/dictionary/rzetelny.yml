notes:
  - { kind: usage, text: "Одно слово покрывает три русских: о человеке и фирме — «добросовестный, надёжный» (RZETELNY PRACOWNIK, RZETELNA FIRMA), о работе и знаниях — «основательный, тщательный» (RZETELNA PRACA, RZETELNA WIEDZA), об информации — «достоверный, объективный» (RZETELNA INFORMACJA, RZETELNE ŹRÓDŁO). Общий смысл один: без обмана и без халтуры. Антоним NIERZETELNY: NIERZETELNA FIRMA «ненадёжная фирма», NIERZETELNY DZIENNIKARZ «недобросовестный журналист»." }
  - { kind: pronunciation, text: "Читается «жэтэ́льны». RZ звучит как «ж», а не «рж». L стоит перед согласным N и звучит мягко, «ль». Ударение на предпоследнем слоге, на TEL. В сравнительной степени ударение сдвигается: RZETELNIEJSZY, «жэтэльне́йшы»." }
  - { kind: usage, text: "Степени образуются регулярно: RZETELNY, RZETELNIEJSZY, NAJRZETELNIEJSZY, итого тридцать три формы. Описательные BARDZIEJ RZETELNY и NAJBARDZIEJ RZETELNY тоже правильны и в речи встречаются не реже. Наречие RZETELNIE значит «на совесть» или «достоверно»: RZETELNIE PRACOWAĆ, RZETELNIE INFORMOWAĆ." }
  - { kind: register, text: "Слово нейтральное, но слегка деловое: его любят отзывы, рекламы и газеты. RZETELNA FIRMA в отзыве клиента — высшая похвала, а RZETELNE DZIENNIKARSTWO — профессиональный стандарт. В разговоре о человеке чаще скажут SOLIDNY или SUMIENNY." }
