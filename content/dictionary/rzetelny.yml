  - { pl: "nierzetelny", ru: "недобросовестный, недостоверный", relation: antonym }
synonyms: ["solidny", "sumienny", "wiarygodny"]
etymology: "Старое польское слово, давно закрепившееся в значении «настоящий, честный, без обмана». Обычно его сближают с чешским ZŘETELNÝ «отчётливый, явный», так что исходный смысл, вероятно, «явный, несомненный»."
memory: "Rzetelny — «без обмана и без халтуры»: о мастере — добросовестный, о работе — основательная, об информации — достоверная. Rzetelna firma — лучшая похвала в отзыве. Читать «жэтэ́льны»: RZ — «ж»."
idioms:
