        ru: "После свадьбы они уехали в деревню."
        source: { kind: authored }
notes:
  - { kind: government, text: "ГЛАВНОЕ достоинство этого слова: один винительный падеж вместо двух русских конструкций. Поляк говорит poślubić KOGOŚ — и о мужчине, и о женщине: on poślubił ją, ona poślubiła go. Русский же вынужден выбирать: «жениться НА ком-то» (предложный) для мужчины и «выйти замуж ЗА кого-то» (винительный с «за») для женщины. Польский обходится без этого различия." }
  - { kind: register, text: "Слово книжное и торжественное — язык газетных объявлений, хроник и романов. В живой речи говорят иначе: мужчина ożenił się z kimś, женщина wyszła za mąż za kogoś, а о паре нейтрально — wzięli ślub «они поженились». Так что poślubić лучше узнавать, чем употреблять в разговоре." }
  - { kind: false-friend, text: "Корень узнаваем, хотя не сразу: ślub значит «брак, венчание», и происходит от ślubować «давать обет», праславянское *sъljubiti — из того же гнезда, что lubić «любить» и русское «слюбиться». То есть ślub это буквально «обет по любви». С русским «слюбиться» родство прямое, а вот ошибочной связи со «слюбовью» или «шлюбом» искать не стоит: современный русский этого слова не имеет." }
  - { kind: usage, text: "Страдательное причастие идёт по знакомому ряду -ony/-eni: poślubiony, но мужско-личное множественное poślubieni — та же мена, что в zatrudniony/zatrudnieni и odrzucony/odrzuceni. Несовершенной пары у глагола практически нет: о процессе говорят brać ślub." }
collocations:
  - { pl: "wziąć ślub", ru: "пожениться" }
  - { pl: "poślubić z miłości", ru: "жениться по любви" }
  - { pl: "świeżo poślubieni", ru: "молодожёны" }
family:
  - { pl: "ślub", ru: "брак, венчание, свадьба", relation: root, id: slub }
  - { pl: "ślubować", ru: "давать обет, клясться", relation: derived }
  - { pl: "lubić", ru: "любить, нравиться", relation: root, id: lubic }
etymology: "Приставка po- плюс ślub «брак», от ślubować «давать обет», праславянское *sъljubiti — то же гнездо, что lubić «любить» и русское «слюбиться». Буквально poślubić значит «связать себя обетом по согласию», и русское «слюбиться» хранит ту же логику. Отсюда же obiecać ślub и выражение ślubna obrączka «обручальное кольцо»."
memory: "poślubić — «взять в супруги», от ślub «брак» (корень тот же, что в lubić и русском «слюбиться»). Главное: ОДИН винительный на оба пола, poślubić kogoś, тогда как русский делит на «жениться на» и «выйти замуж за». Слово книжное; в речи — wziąć ślub."
idioms:
  - { pl: "świeżo poślubieni", ru: "молодожёны" }
  - { pl: "poślubić z miłości", ru: "жениться по любви" }
