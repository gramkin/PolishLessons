        ru: "Поженившиеся в прошлом году уехали за границу."
        source: { kind: authored }
      - pl: "Poślubiona w pośpiechu para szybko się rozstała."
        ru: "Поспешно поженившаяся пара быстро разошлась."
        source: { kind: authored }
  - id: wedding
    ru: "poślubienie — заключение брака, венчание"
    examples:
      - pl: "Poślubienie cudzoziemki wymagało dokumentów."
        ru: "Брак с иностранкой требовал документов."
        source: { kind: authored }
