# review
id: prad
format: 2
lemma: "prąd"
rank: 2140
pos: noun
pron: { cyr: "пронт" }
senses:
  - id: electricity
    ru: "электричество, электрический ток"
    examples:
      - pl: "Miedź dobrze przewodzi prąd."
        ru: "Медь хорошо проводит электричество."
        source: { kind: tatoeba, id: 2577370 }
      - pl: "Ten klimatyzator zużywa dużo prądu."
        ru: "Этот кондиционер потребляет много электричества."
        source: { kind: tatoeba, id: 351448 }
      - pl: "W dzisiejszych czasach życie bez prądu jest niewyobrażalne."
        ru: "В наше время невозможно себе представить жизнь без электричества."
        source: { kind: tatoeba, id: 5138620 }
  - id: current
    ru: "течение, поток (воды, воздуха)"
    examples:
      - pl: "Płynęli pod prąd."
        ru: "Они плыли против течения."
        source: { kind: translated, id: 952135 }
      - pl: "Biała łódka płynęła z prądem."
        ru: "Белая лодка плыла по течению."
        source: { kind: translated, id: 760358 }
notes:
  - { kind: usage, text: "Два значения сразу: бытовое «электричество» (nie ma prądu «нет света») и «течение» — воды, воздуха, а также направления в искусстве." }
  - { kind: false-friend, text: "Русское «ток» и «течение» — два слова, польское prąd одно. А «прут» по-польски pręt, не prąd." }
  - { kind: government, text: "Мужской неодушевлённый; родительный — prądu. pod prąd «против течения», z prądem «по течению»." }
  - { kind: usage, text: "porażenie prądem «поражение электрическим током» — стандартный оборот." }
collocations:
  - { pl: "nie ma prądu", ru: "нет электричества" }
  - { pl: "pod prąd", ru: "против течения" }
  - { pl: "porażenie prądem", ru: "удар током" }
etymology: "Праславянское *prǫdъ «стремительное течение»; ср. русское «пруд» — то же слово, но значение разошлось."
memory: "prąd — и «электричество», и «течение». Nie ma prądu «нет света», pod prąd «против течения». Родственно русскому «пруд», хотя значения разошлись."
idioms:
  - { pl: "nie ma prądu", ru: "нет электричества" }
  - { pl: "pod prąd", ru: "против течения" }
formExamplesSkip:
  - { form: "prądzie", cell: "Звательный", reason: "звательный падеж: для неодушевлённого существительного он практически не употребляется" }
