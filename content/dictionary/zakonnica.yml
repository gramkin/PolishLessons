etymology: "От ZAKON «монашеский орден, устав». В старопольском ZAKON значило «закон, вера»; русское «закон» — то же слово с другой судьбой."
memory: "Zakonnica — монахиня, от zakon — орден, не «закон». Siostro! — обращение. Klasztor — монастырь. Читается «законни́ца»."
