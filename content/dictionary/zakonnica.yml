notes:
  - { kind: false-friend, text: "ZAKONNICA — «монахиня», от ZAKON — «монашеский орден», а не «закон». Закон — PRAWO или USTAWA. К монахине обращаются SIOSTRO: «сестра». Синоним — MNISZKA, чаще о буддийских или православных монахинях." }
  - { kind: usage, text: "Женский род. Множественное — ZAKONNICE, родительный — ZAKONNIC. Родительный единственного — ZAKONNICY. Звательный ZAKONNICO не используется: говорят SIOSTRO." }
  - { kind: government, text: "Стать монахиней — ZOSTAĆ ZAKONNICĄ, творительный. Монастырь монахинь — KLASZTOR ZAKONNIC, родительный." }
  - { kind: pronunciation, text: "Читается «законни́ца»: двойное NN звучит долго. Ударение на предпоследнем слоге." }
collocations:
  - { pl: "zostać zakonnicą", ru: "постричься в монахини" }
  - { pl: "habit zakonnicy", ru: "одеяние монахини" }
  - { pl: "klasztor zakonnic", ru: "женский монастырь" }
