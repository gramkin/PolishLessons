notes:
  - { kind: false-friend, text: "Ловушки в значении нет: MEKSYKAŃSKI — «мексиканский». Но обратите внимание на запись: польский пишет KS, а не X, — MEKSYK, MEKSYKAŃSKI; буква X в польском встречается только в заимствованиях. Прилагательные от стран пишутся со строчной буквы: meksykański, а жители — с заглавной: MEKSYKANIN, MEKSYKANKA." }
  - { kind: usage, text: "Относительное прилагательное, степеней сравнения нет. Все одиннадцать форм живые. Форма для мужчин-людей MEKSYKAŃSCY частая: MEKSYKAŃSCY PIŁKARZE, MEKSYKAŃSCY ROBOTNICY. Чередование: SKI в мужском-личном даёт SCY." }
  - { kind: government, text: "Обычно стоит после существительного, если называет происхождение: KUCHNIA MEKSYKAŃSKA, KAKTUS MEKSYKAŃSKI. Перед существительным — в описаниях: MEKSYKAŃSKI KAPELUSZ. Падежных требований нет." }
  - { kind: pronunciation, text: "Читается «мэксыка́ньски», четыре слога, ударение на предпоследнем. ME — твёрдое «мэ», KSY — «ксы» с твёрдым «ы», AŃ — «ань» с мягким «нь». Сравните с MEKSYK «мэ́ксык»." }
  - { kind: register, text: "Нейтральное слово. В Польше MEKSYKAŃSKA FALA, «мексиканская волна», — так называют волну на стадионе. MEKSYKAŃSKI SERIAL — нарицательное для бесконечной мелодрамы, сюжета со слезами и интригами." }
collocations:
  - { pl: "kuchnia meksykańska", ru: "мексиканская кухня" }
  - { pl: "meksykańska fala", ru: "волна на стадионе" }
  - { pl: "meksykański serial", ru: "бесконечная мелодрама (ирон.)" }
family:
  - { pl: "Meksyk", ru: "Мексика", relation: root, id: meksyk }
  - { pl: "Meksykanin", ru: "мексиканец", relation: derived }
  - { pl: "Meksykanka", ru: "мексиканка", relation: derived }
etymology: "От MEKSYK, названия страны и города, из языка науатль: Mēxihco, место народа мешиков. Испанцы записали название через X, который тогда читался как «ш». Позже испанский звук сменился, а польский передал название по-своему, через KS, как и русский через «кс»."
memory: "Meksykański — мексиканский: kuchnia meksykańska. Ks, а не x. Meksykański serial — бесконечная мелодрама. Читается «мэксыка́ньски»."
idioms:
  - { pl: "meksykański serial", ru: "бесконечная мелодрама, мыльная опера" }
