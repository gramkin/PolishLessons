# review
id: czyn
format: 2
lemma: "czyn"
rank: 2529
pos: noun
pron: { cyr: "чын" }
senses:
  - id: deed
    ru: "поступок, деяние"
    examples:
      - pl: "Nie jest łatwo przekuć idee w czyn."
        ru: "Не так легко воплотить идею в реальность."
        source: { kind: tatoeba, id: 925780 }
      - pl: "Jego czyn jest godny pochwały."
        ru: "Его поступок достоин похвалы."
        source: { kind: translated, id: 909245 }
      - pl: "Jego odważny czyn zyskał mu szacunek."
        ru: "Его смелый поступок снискал ему уважение."
        source: { kind: translated, id: 527435 }
  - id: deeds-not-words
    ru: "дела (в противопоставлении словам)"
    examples:
      - pl: "Ważne są czyny, nie słowa."
        ru: "Важны дела, а не слова."
        source: { kind: translated, id: 357745 }
      - pl: "Czyny mówią głośniej niż słowa."
        ru: "Дела говорят громче слов."
        source: { kind: translated, id: 930091 }
notes:
  - { kind: usage, text: "Противопоставление czyny — słowa «дела — слова» очень частотно и совпадает с русским: Czyny, nie słowa «Дела, а не слова»." }
  - { kind: government, text: "Мужской неодушевлённый; родительный — czynu. Воплотить в дело — przekuć w czyn, винительный падеж." }
  - { kind: false-friend, text: "От czynić «делать». Русский «чин» — то же праславянское слово, но значение разошлось полностью: польское czyn — это поступок, а не ранг. Русское «учинить» сохраняет исходный смысл." }
  - { kind: usage, text: "Człowiek czynu «человек дела». Существительное czynność значит «действие, операция»." }
collocations:
  - { pl: "czyny, nie słowa", ru: "дела, а не слова" }
  - { pl: "człowiek czynu", ru: "человек дела" }
  - { pl: "przekuć w czyn", ru: "воплотить в дело" }
etymology: "От czynić «делать». Русский «чин» — то же праславянское слово, но значение разошлось; «учинить» сохраняет исходное."
memory: "czyn — «поступок, дело», а не «чин». Запомните противопоставление Czyny, nie słowa «Дела, а не слова» и оборот człowiek czynu «человек дела»."
idioms:
  - { pl: "czyny, nie słowa", ru: "дела, а не слова" }
  - { pl: "człowiek czynu", ru: "человек дела" }
formExamplesSkip:
  - { form: "czynie", cell: "Звательный", reason: "звательный падеж: для неодушевлённого существительного он практически не употребляется" }
