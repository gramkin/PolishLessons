# review
id: rozsypac
format: 2
lemma: "rozsypać"
rank: 2329
pos: verb
aspect: perf
pron: { cyr: "россы́паць" }
senses:
  - id: spill
    ru: "рассыпать, просыпать"
    examples:
      - pl: "Na stole była rozsypana mąka."
        ru: "На столе была рассыпана мука."
        source: { kind: tatoeba, id: 7053623 }
      - pl: "Rozsypał cukier na podłogę."
        ru: "Он рассыпал сахар на пол."
        source: { kind: authored }
      - pl: "Uważaj, rozsypiesz sól."
        ru: "Осторожно, рассыплешь соль."
        source: { kind: authored }
  - id: scatter
    ru: "рассыпаться, развалиться (rozsypać się)"
    examples:
      - pl: "Trzy worki piasku wypadły z ciężarówki i rozsypały się na drodze."
        ru: "Три мешка с песком выпали из грузовика и рассыпались по дороге."
        source: { kind: tatoeba, id: 10713722 }
      - pl: "Stary mur rozsypał się w pył."
        ru: "Старая стена рассыпалась в пыль."
        source: { kind: authored }
notes:
  - { kind: usage, text: "С się глагол значит «рассыпаться, развалиться» — и о сыпучем, и переносно о том, что разваливается: firma się rozsypała «фирма развалилась»." }
  - { kind: false-friend, text: "roz- + sypać «сыпать». Полное соответствие русскому «рассыпать», включая приставку." }
  - { kind: government, text: "Винительный падеж: rozsypać mąkę. Куда — на + винительный: na podłogę." }
  - { kind: usage, text: "Несовершенный вид — rozsypywać. Не путайте с созвучным rozespać się «разоспаться»: корни разные." }
collocations:
  - { pl: "rozsypać się w pył", ru: "рассыпаться в прах" }
  - { pl: "rozsypać mąkę", ru: "рассыпать муку" }
etymology: "roz- + sypać «сыпать»; полное соответствие русскому «рассыпать»."
memory: "rozsypać — «рассыпать», а с się «рассыпаться, развалиться», в том числе переносно: firma się rozsypała. Приставка и корень совпадают с русскими."
idioms:
  - { pl: "rozsypać się w pył", ru: "рассыпаться в прах" }
