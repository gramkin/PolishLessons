notes:
  - { kind: false-friend, text: "Ловушки в смысле нет, зато есть в звучании, и она того же рода, что в GŁOWA и MLEKO. Русское «серебро» держит полный набор гласных, «ере» посередине, а польское SREBRO их стянуло: SRE- вместо «сере-». Это то самое правило полногласия: где у нас «оло», «оро» или «ере», у поляка стянутый слог. Отсюда GŁOWA при «голове», MLEKO при «молоке», WROTA при «воротах» и SREBRO при «серебре»." }
  - { kind: usage, text: "Девять форм, средний род. В местном падеже R переходит в RZ: SREBRO, но W SREBRZE, ровно как ŻEBRO даёт W ŻEBRZE. Множественное SREBRA значит уже не металл, а изделия: столовое серебро, посуду и приборы. Родительный множественного — SREBER, с беглым E. В спорте SREBRO значит серебряную медаль." }
  - { kind: government, text: "Из серебра — ZE SREBRA, родительный падеж, и предлог здесь ZE, а не Z, потому что дальше идёт скопление согласных. В серебре — W SREBRZE, местный падеж с переходом R в RZ. Серебром — SREBREM, творительный без предлога. Над серебром — NAD SREBREM, тоже творительный, но с предлогом." }
  - { kind: pronunciation, text: "Читается «срэ́бро», два слога, ударение на первом. Сочетание SRE даёт «срэ», с твёрдым «э», а сочетание BR произносится слитно. Никакой гласной между С и Р нет, и это главное отличие от русского «серебра». В местном падеже SREBRZE сочетание RZ даёт «ж»: «срэ́бже»." }
  - { kind: register, text: "Слово нейтральное. О металле говорят CZYSTE SREBRO и PRÓBA SREBRA «проба серебра». О посуде — SREBRO STOŁOWE и SREBRA RODZINNE, и последнее выражение почти всегда стоит во множественном числе. В спорте ZDOBYĆ SREBRO значит «взять серебро», и это самое частое употребление слова в новостях." }
