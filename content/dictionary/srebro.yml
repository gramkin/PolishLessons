etymology: "Праславянское слово, давшее и русское «серебро». Разошлись языки только в слоге: русский сохранил полногласие, «сере-», а польский стянул его в SRE-. Это одно из самых надёжных соответствий между нашими языками, и действует оно на целом ряде слов: GŁOWA при «голове», MLEKO при «молоке», BRODA при «бороде», ZŁOTO при «золоте». Узнав его, вы угадаете десятки польских слов с первого взгляда."
memory: "Серебро, и слово то же, что русское, только стянутое: наше «сере-» в польском дало sre-. Это правило полногласия, и оно работает на десятках слов — glowa при «голове», mleko при «молоке», zloto при «золоте». Читается «срэ́бро», без гласной между с и р. В местном падеже r переходит в rz: w srebrze. Множественное srebra значит столовое серебро, а в спорте srebro — серебряную медаль."
