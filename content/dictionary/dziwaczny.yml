notes:
  - { kind: false-friend, text: "Русскому «дивный» и «диковинный» польское DZIWACZNY родня, но значение другое: «странный, чудной», с оттенком нелепости. Нейтральное «странный» — DZIWNY. DZIWACZNY сильнее и оценочнее: DZIWACZNY STRÓJ — «нелепый наряд». О человеке — DZIWAK, «чудак»." }
  - { kind: usage, text: "Полная парадигма: DZIWACZNY, DZIWACZNIEJSZY, NAJDZIWACZNIEJSZY. Все степени живые: CORAZ DZIWACZNIEJSZE POMYSŁY. Мужское-личное: DZIWACZNI, DZIWACZNIEJSI, NAJDZIWACZNIEJSI." }
  - { kind: government, text: "Ставится перед существительным: DZIWACZNY POMYSŁ, DZIWACZNE ZACHOWANIE. Странный на вид — DZIWACZNY Z WYGLĄDU, Z с родительным. Наречие DZIWACZNIE — «чудно, нелепо»." }
  - { kind: pronunciation, text: "Читается «дзива́чны», три слога, ударение на предпоследнем. DZI — мягкое «дзи», CZ — «ч». В DZIWACZNIEJSZY: «дзивачне́йшы»." }
  - { kind: register, text: "Нейтральное, но оценочное слово, с лёгкой иронией. В рецензиях — DZIWACZNY FILM, «чудной фильм»; в быту — о моде, привычках, соседях." }
