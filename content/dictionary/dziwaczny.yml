memory: "Dziwaczny — странный, чудной, нелепый: dziwaczny kapelusz, dziwaczny pomysł. Сильнее, чем dziwny. Dziwak — чудак. Dziwaczniejszy, najdziwaczniejszy. Читается «дзива́чны»."
