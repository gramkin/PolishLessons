# review
id: tekst
format: 2
lemma: "tekst"
rank: 1910
pos: noun
pron: { cyr: "тэкст" }
senses:
  - id: text
    ru: "текст"
    examples:
      - pl: "To mój tekst!"
        ru: "Это мой текст!"
        source: { kind: translated, id: 362925 }
      - pl: "Przetłumacz ten tekst."
        ru: "Переведи этот текст."
        source: { kind: translated, id: 3868185 }
      - pl: "Tekst jest zbyt długi."
        ru: "Текст слишком длинный."
        source: { kind: translated, id: 2410159 }
      - pl: "Proszę dokończyć ten tekst."
        ru: "Допиши, пожалуйста, этот текст."
        source: { kind: translated, id: 716807 }
      - pl: "Przetłumaczenie tego tekstu będzie bardzo łatwe."
        ru: "Перевести этот текст будет очень легко."
        source: { kind: translated, id: 969101 }
      - pl: "Nie wszystkie teksty zasługują na publikację."
        ru: "Не все тексты заслуживают публикации."
        source: { kind: tatoeba, id: 5909134 }
  - id: lyrics
    ru: "текст песни; слова роли"
    examples:
      - pl: "Tom lubi pisać wiersze i teksty piosenek."
        ru: "Том любит писать стихи и тексты песен."
        source: { kind: translated, id: 1589366 }
      - pl: "Najbardziej na świecie bał się zapomnieć tekstu."
        ru: "Больше всего на свете он боялся забыть текст."
        source: { kind: tatoeba, id: 5659799 }
      - pl: "Nie potrafię sobie przypomnieć tekstu."
        ru: "Я не могу вспомнить текст."
        source: { kind: translated, id: 8915529 }
notes:
  - { kind: usage, text: "Второе частое значение — «слова песни» и «текст роли»: teksty piosenek «тексты песен», zapomnieć tekstu «забыть текст роли»." }
  - { kind: usage, text: "edytor tekstów «текстовый редактор» — устойчивое сочетание с родительным множественного." }
  - { kind: usage, text: "Разговорное stały tekst значит «дежурная фраза, обычная отговорка»." }
collocations:
  - { pl: "przetłumacz tekst", ru: "переведи текст" }
  - { pl: "edytor tekstów", ru: "текстовый редактор" }
  - { pl: "tekst piosenki", ru: "текст песни" }
etymology: "Из латинского textus «ткань, сплетение» — от texere «ткать». Русское «текст» пришло от того же латинского слова, поэтому и звучит, и значит почти одинаково."
memory: "tekst — «текст», слово-близнец русского. Помните второе значение: tekst piosenki «текст песни», а zapomniał tekstu — «он забыл слова роли»."
idioms:
  - { pl: "edytor tekstów", ru: "текстовый редактор" }
  - { pl: "tekst piosenki", ru: "текст песни" }
  - { pl: "stały tekst", ru: "дежурная фраза" }
