# review
id: posiadac
format: 2
lemma: "posiadać"
rank: 904
pos: verb
aspect: imperf
pron: { cyr: "посяда́ць" }
senses:
  - id: own
    ru: "обладать, иметь (официально)"
    note: "Книжный и деловой заменитель глагола mieć."
    examples:
      - pl: "Mieszkanie posiada również mały balkon."
        ru: "В квартире есть также небольшой балкон."
        source: { kind: tatoeba, id: 13785431 }
      - pl: "Posiadam komputer."
        ru: "У меня есть компьютер."
        source: { kind: translated, id: 4837583 }
      - pl: "Posiada pan broń?"
        ru: "У вас есть оружие?"
        source: { kind: translated, id: 11624954 }
  - id: possess-qualities
    ru: "о свойствах и сведениях: обладать чем-л."
    examples:
      - pl: "Oni posiadają mnóstwo informacji."
        ru: "Они обладают множеством сведений."
        source: { kind: translated, id: 2331030 }
      - pl: "Rozgwiazdy to zwierzęta nie posiadające mózgu."
        ru: "Морские звёзды — животные, не обладающие мозгом."
        source: { kind: translated, id: 982949 }
      - pl: "Czy posiadają państwo kartę kredytową?"
        ru: "У вас есть кредитная карта?"
        source: { kind: translated, id: 2587014 }
  - id: beside-oneself
    ru: "nie posiadać się z radości — быть вне себя от радости"
    note: "Только с отрицанием и только в этом обороте."
    examples:
      - pl: "Nie posiadali się z radości."
        ru: "Они были вне себя от радости."
        source: { kind: translated, id: 790640 }
      - pl: "Nie posiadaliśmy się z radości."
        ru: "Мы были вне себя от радости."
        source: { kind: translated, id: 717354 }
      - pl: "Nie posiadał się z radości."
        ru: "Он был вне себя от радости."
        source: { kind: translated, id: 1614944 }
notes:
  - { kind: register, text: "Это официальный, деловой глагол. В обычной речи говорят mieć: Mam komputer «У меня есть компьютер». Posiadam komputer звучит как строка из анкеты. Русское «обладать» рядом с «иметь» ведёт себя похоже." }
  - { kind: government, text: "posiadać coś «обладать чем-то» — винительный падеж, а не творительный, как у русского «обладать»: posiada dom «владеет домом»." }
  - { kind: usage, text: "Оборот nie posiadać się z radości значит «быть вне себя от радости». Он живёт только с отрицанием: сказать posiadać się нельзя." }
  - { kind: usage, text: "Существительное posiadanie — «обладание, владение»: posiadanie broni «владение оружием». Владелец — posiadacz, поместье — posiadłość." }
collocations:
  - { pl: "posiadać dom", ru: "владеть домом" }
  - { pl: "nie posiadać się z radości", ru: "быть вне себя от радости" }
  - { pl: "posiadanie broni", ru: "владение оружием" }
  - { pl: "posiadacz", ru: "владелец" }
family:
  - { pl: "siadać", ru: "садиться", relation: root }
  - { pl: "posiadłość", ru: "владение, поместье", relation: derived }
  - { pl: "posiadacz", ru: "владелец", relation: derived }
etymology: "Из po- + siadać «садиться»: изначально «сидеть на чём-то», отсюда «владеть». Русское «обладать» построено иначе, но смысловой ход тот же — «держать под собой»."
memory: "posiadać — «обладать, владеть», но слово деловое: в обычной речи скажут mieć. Posiadam komputer звучит как строка анкеты, а Mam komputer — как живая речь. Управление винительным, не творительным: posiada dom. И запомните оборот nie posiadać się z radości «быть вне себя от радости»."
idioms:
  - { pl: "nie posiadać się z radości", ru: "быть вне себя от радости" }
  - { pl: "posiadanie broni", ru: "владение оружием" }
  - { pl: "posiadać dom", ru: "владеть домом" }
formExamplesSkip:
  - { form: "posiadawszy", reason: "деепричастия на -wszy у глаголов несовершенного вида не бывает; для posiadać это posiadając" }
  - { form: "posiadani", reason: "страдательное причастие мужского лица от «обладать» в современном языке не употребляется: людьми не «обладают»" }
