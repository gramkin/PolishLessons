# review
id: zagrac
format: 2
lemma: "zagrać"
rank: 963
pos: verb
aspect: perf
aspectPair: grac
pron: { cyr: "за́граць" }
senses:
  - id: play-game
    ru: "сыграть (в игру)"
    examples:
      - pl: "Chcę zagrać w szachy."
        ru: "Я хочу сыграть в шахматы."
        source: { kind: translated, id: 3897624 }
      - pl: "Zagrasz ze mną?"
        ru: "Сыграешь со мной?"
        source: { kind: translated, id: 623156 }
      - pl: "Zagrajmy w karty."
        ru: "Сыграем в карты."
        source: { kind: translated, id: 368478 }
  - id: play-music
    ru: "сыграть (на инструменте, произведение)"
    examples:
      - pl: "Potrafię zagrać Chopina."
        ru: "Я умею сыграть Шопена."
        source: { kind: translated, id: 980987 }
      - pl: "Zagrała sonatę."
        ru: "Она сыграла сонату."
        source: { kind: translated, id: 527604 }
      - pl: "Zagram ci sonatę."
        ru: "Я сыграю тебе сонату."
        source: { kind: translated, id: 355492 }
  - id: play-role
    ru: "сыграть (роль), сняться"
    examples:
      - pl: "Olivier zagrał Hamleta."
        ru: "Оливье сыграл Гамлета."
        source: { kind: translated, id: 364625 }
      - pl: "Moja siostra zagrała główną rolę."
        ru: "Моя сестра сыграла главную роль."
        source: { kind: translated, id: 921387 }
      - pl: "Ona zagrała w tej sztuce."
        ru: "Она сыграла в этой пьесе."
        source: { kind: translated, id: 349208 }
notes:
  - { kind: government, text: "Об игре — zagrać W coś, предлог w с винительным падежом: zagrać w karty, w szachy, w tenisa. Об инструменте — zagrać NA czymś, предлог na с предложным: zagrać na pianinie, na gitarze." }
  - { kind: usage, text: "Совершенный вид к grać. Grał godzinę «он играл час» — о процессе; zagrał sonatę «он сыграл сонату» — о результате." }
  - { kind: usage, text: "zagrać rolę «сыграть роль», а zagrać w filmie значит «сняться в фильме»: Chcesz zagrać w filmie?" }
  - { kind: usage, text: "Отглагольное существительное zagranie живёт своей жизнью и значит «приём, ход» в спорте и картах: sprytne zagranie «хитрый ход»." }
collocations:
  - { pl: "zagrać w karty", ru: "сыграть в карты" }
  - { pl: "zagrać na pianinie", ru: "сыграть на пианино" }
  - { pl: "zagrać rolę", ru: "сыграть роль" }
  - { pl: "zagrać mecz", ru: "сыграть матч" }
family:
  - { pl: "grać", ru: "играть", relation: aspect, id: grac }
  - { pl: "gra", ru: "игра", relation: root }
  - { pl: "przegrać", ru: "проиграть", relation: derived }
etymology: "Приставка za- + grać «играть». Русское «сыграть» устроено точно так же: приставка совершенного вида плюс «играть», только приставка другая."
memory: "zagrać — совершенный вид к grać. Об игре говорят zagrać W coś (w karty, w szachy), об инструменте — zagrać NA czymś (na pianinie). А zagrać w filmie значит «сняться в фильме»."
idioms:
  - { pl: "zagrać na nosie", ru: "оставить в дураках, показать нос" }
  - { pl: "zagrać va banque", ru: "пойти ва-банк" }
  - { pl: "zagrać komuś na nerwach", ru: "подействовать кому-то на нервы" }
