notes:
  - { kind: false-friend, text: "KANCELARIA — не «канцелярия» с бумагами и скрепками! В быту — «адвокатская контора»: KANCELARIA ADWOKACKA, KANCELARIA PRAWNA. Канцтовары — ARTYKUŁY BIUROWE или PAPIERNICZE. Государственная KANCELARIA — аппарат президента или премьера." }
  - { kind: usage, text: "Женский род. Родительный, дательный и местный — KANCELARII. Множественное — KANCELARIE. Звательный и архаичное KANCELARYJ не используем." }
  - { kind: government, text: "Работать в конторе — PRACOWAĆ W KANCELARII, местный. Канцелярия кого — родительный: KANCELARIA PREMIERA. Обратиться в контору — ZWRÓCIĆ SIĘ DO KANCELARII." }
  - { kind: pronunciation, text: "Читается «канцэля́рья»: CE — «цэ», RIA — «рья». Ударение на предпоследнем слоге." }
