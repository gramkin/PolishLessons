etymology: "От KONIEC, от праславянского корня, давшего и русский «конец», и «кон», и «начать» через чередование. Корень общий и древний, а производные разошлись в объёме: польская KOŃCÓWKA взяла на себя и концовку, и грамматическое окончание, и наконечник провода, тогда как русский развёл эти смыслы по трём словам. Само KOŃCOWY построено обычным способом, корень плюс суффикс -OWY, тем же, что в русском «конечный» стоит -Н-."
memory: "Прилагательное переводится прямо, «конечный» или «итоговый», и ловушки в нём нет. Ловушка в соседе: końcówka это сразу «концовка», «окончание» в грамматике и «наконечник». Мужско-личная форма końcowi живая: odbiorcy końcowi «конечные потребители». Читается «коньцо́вы»: ń даёт мягкое «нь», и первый слог звучит как русский «конь». В трамвае услышите przystanek końcowy «конечная остановка»."
idioms:
