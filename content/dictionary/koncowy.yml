notes:
  - { kind: false-friend, text: "Само прилагательное прозрачно, а вот ближайший его родственник ставит ловушку. KOŃCÓWKA это сразу три русских слова: «концовка» у фильма, «окончание» у слова в грамматике и «наконечник» у провода. Польский обошёлся одним, русский держит три. Поэтому фраза KOŃCÓWKA -AMI значит «окончание -ами», а вовсе не «концовка». Само KOŃCOWY переводится ровно как «конечный» или «итоговый» и подвоха не содержит." }
  - { kind: usage, text: "Одиннадцать форм, относительное прилагательное, степеней сравнения нет. Мужско-личная форма множественного числа KOŃCOWI живая и вполне деловая: ODBIORCY KOŃCOWI «конечные потребители», KOŃCOWI UŻYTKOWNICY «конечные пользователи». Это нынешний язык договоров и инструкций, где прилагательное стоит после существительного. Рядом держится наречный оборот W KOŃCU «наконец, в конце концов», который слышен в разговоре постоянно." }
  - { kind: government, text: "До конечной остановки — предлог DO с родительным: DO PRZYSTANKU KOŃCOWEGO. На конечном этапе — предлог W с местным падежом: W FAZIE KOŃCOWEJ, и здесь русский предпочитает «на», а польский «w». В итоговом отчёте — W RAPORCIE KOŃCOWYM, снова W с местным. Прилагательное в устойчивых сочетаниях почти всегда идёт после существительного: WYNIK KOŃCOWY, EGZAMIN KOŃCOWY." }
  - { kind: pronunciation, text: "Читается «коньцо́вы», три слога, ударение на втором. Буква Ń даёт мягкое «нь», поэтому первый слог звучит «конь», как русское слово «конь». Буква C даёт «ц», и дальше идёт «цо». Конечное Y даёт «ы». В существительном KONIEC мягкость стоит в другом месте, перед беглым E, и оно звучит «ко́нец», почти как русское слово." }
  - { kind: register, text: "Слово нейтральное, из делового и школьного языка: WYNIK KOŃCOWY «итоговый результат», RAPORT KOŃCOWY «итоговый отчёт», ROZLICZENIE KOŃCOWE «окончательный расчёт», EGZAMIN KOŃCOWY «выпускной экзамен», PRZYSTANEK KOŃCOWY «конечная остановка». Последнее объявляют в каждом польском трамвае, и услышать его придётся всякому. В технических текстах часто встретится ODBIORCA KOŃCOWY, калька английского термина." }
