notes:
  - { kind: usage, text: "Два оборота покрывают почти всё употребление слова, и оба стоит выучить целиком. W POŚPIECHU значит «в спешке, торопливо»: W POŚPIECHU ZAPOMNIAŁ PASZPORTU. NIE MA POŚPIECHU — «спешить некуда», вежливая формула, которой успокаивают собеседника, и в разговоре она слышится чаще самого существительного. Третий частый оборот — BEZ POŚPIECHU «не спеша». Множественное число у слова есть в таблице, но в живой речи почти не встречается: понятие неисчисляемое, как и русская «спешка»." }
  - { kind: pronunciation, text: "Читается «по́сьпех», ударение на первом слоге из двух. Буква Ś даёт мягкое «сь», а сочетание PIE — «пе» с мягким p. Конечное CH звучит как «х». Орфография допускает два написания: POŚPIECH и POSPIECH, оба нормативны, и то же касается глагола ŚPIESZYĆ SIĘ и SPIESZYĆ SIĘ. Написание с Ś встречается чаще и считается основным, но увидеть в тексте можно оба, и это не опечатка." }
  - { kind: government, text: "Мужской род, неодушевлённое, и парадигма у него той же редкой формы, что у WYSIŁEK: родительный и местный падеж единственного числа совпадают в одной форме POŚPIECHU. Поэтому BEZ POŚPIECHU «без спешки» и W POŚPIECHU «в спешке» выглядят одинаково, хотя падежи разные, и в таблице у слова девять форм, а не десять. Отрицание переводит винительный в родительный по общему правилу: NIE MA POŚPIECHU. Причина вводится предлогом Z с родительным: Z POŚPIECHU «от спешки, из-за спешки»." }
  - { kind: register, text: "Слово нейтральное и годится и для разговора, и для документа. Разница с русским в том, что русская «спешка» слегка разговорна, а книжное «поспешность» звучит укоризненно; польское POŚPIECH ровно посередине и упрёка в себе не несёт. Если нужно именно осудить торопливость, поляк скажет POCHOPNOŚĆ или добавит прилагательное: NIEPOTRZEBNY POŚPIECH «ненужная спешка». Глагол — ŚPIESZYĆ SIĘ «спешить», и в повелительном NIE ŚPIESZ SIĘ «не спеши»." }
collocations:
  - { pl: "w pośpiechu", ru: "в спешке, торопливо" }
  - { pl: "bez pośpiechu", ru: "не спеша" }
  - { pl: "nie ma pośpiechu", ru: "спешить некуда" }
