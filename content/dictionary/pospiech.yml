etymology: "От приставки PO- и корня, который виден в ŚPIESZYĆ SIĘ «спешить», из праславянского *spěxъ. И вот здесь языки разошлись поучительно: тот же самый корень дал русскому сразу два слова — «успех» и «спешку». Исходное *spěti значило «поспевать, преуспевать, удаваться», и русский развил из него идею удачи, а заодно сохранил идею торопливости в «спехе» и «не к спеху». Польский пошёл только по второй дороге: POŚPIECH — это исключительно спешка, а для удачи взял чужое слово, SUKCES, или своё POWODZENIE. Поэтому родство «успеха» и «спешки» для русского ощутимо, а поляку его надо объяснять — и наоборот, русскому стоит помнить, что POŚPIECH никогда не значит «успех»."
memory: "Тот же корень *spěxъ, что в русских «успех» и «спешка», но польский взял только спешку: pośpiech — это спешка, а успех по-польски sukces или powodzenie. Два оборота покрывают почти всё: w pośpiechu «в спешке» и nie ma pośpiechu «спешить некуда». Родительный и местный совпадают: pośpiechu, девять форм, как у wysiłek."
idioms:
  - { pl: "w pośpiechu", ru: "в спешке, торопливо" }
  - { pl: "nie ma pośpiechu", ru: "спешить некуда" }
