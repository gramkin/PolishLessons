# review
id: pracowac
format: 2
lemma: "pracować"
rank: 164
pos: verb
aspect: imperf
pron: { cyr: "працо́ваць" }
senses:
  - id: work
    ru: "работать, трудиться"
    examples:
      - pl: "Pracuję."
        ru: "Я работаю."
        source: { kind: tatoeba, id: 360969 }
      - pl: "Gdzie pracujesz?"
        ru: "Где ты работаешь?"
        source: { kind: tatoeba, id: 553536 }
      - pl: "Nie pracuję."
        ru: "Я не работаю."
        source: { kind: tatoeba, id: 531782 }
  - id: work-as
    ru: "работать кем-либо; работать над чем-либо"
    note: "Профессия вводится словом jako и именительным падежом: pracuję jako nauczyciel."
    examples:
      - pl: "Lubię pracować."
        ru: "Я люблю работать."
        source: { kind: tatoeba, id: 362817 }
      - pl: "Pracuje jako nauczyciel."
        ru: "Он работает учителем."
        source: { kind: authored }
      - pl: "Pracuję nad nową książką."
        ru: "Я работаю над новой книгой."
        source: { kind: authored }
notes:
  - { kind: government, text: "Кем работать — pracować jako ktoś, причём после jako стоит именительный падеж: pracuję jako lekarz. Русский здесь ставит творительный: «работаю врачом»." }
  - { kind: usage, text: "Над чем работать — pracować nad czymś, с творительным: pracuję nad projektem. Эта конструкция совпадает с русской." }
  - { kind: usage, text: "Существительное — praca: iść do pracy «идти на работу». Формы вроде «pracowanie» не употребляются." }
collocations:
  - { pl: "pracować jako", ru: "работать кем-то" }
  - { pl: "pracować nad czymś", ru: "работать над чем-то" }
  - { pl: "ciężko pracować", ru: "тяжело работать" }
  - { pl: "pracować na pełen etat", ru: "работать на полную ставку" }
etymology: "От praca «работа» — заимствования из старочешского; поэтому и глагол звучит иначе, чем русское «работать»."
memory: "Кем работать — через jako и именительный: pracuję jako nauczyciel, тогда как в русском «работаю учителем». А над чем — pracować nad czymś, как в русском."
idioms:
  - { pl: "pracować jak wół", ru: "работать как вол" }
  - { pl: "pracować na czarno", ru: "работать нелегально" }
  - { pl: "kto nie pracuje, ten nie je", ru: "кто не работает, тот не ест" }
formExamplesSkip:
  - { form: "pracowania", reason: "отглагольное существительное не употребляется: в этом значении говорят praca" }
  - { form: "pracowanie", reason: "отглагольное существительное не употребляется: в этом значении говорят praca" }
  - { form: "pracowaniem", reason: "отглагольное существительное не употребляется: в этом значении говорят praca" }
  - { form: "pracowaniu", reason: "отглагольное существительное не употребляется: в этом значении говорят praca" }
