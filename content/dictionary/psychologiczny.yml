etymology: "От PSYCHOLOGIA, сложения греческих psychḗ «душа» и lógos «слово, учение». Само слово «психология» сложили гуманисты шестнадцатого века, а в науку его ввёл немецкий философ Христиан Вольф в восемнадцатом. Польское -ICZNY, как обычно, на месте русского -ическ-."
memory: "Psychologiczny — психологический: pomoc psychologiczna, thriller psychologiczny, bariera psychologiczna. Не путать с psychiczny — психический. Читается «псыхологи́чны»."
idioms:
  - { pl: "gra psychologiczna", ru: "психологическая игра, игра на нервах" }
