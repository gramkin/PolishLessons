notes:
  - { kind: false-friend, text: "Ловушки в значении нет: PSYCHOLOGICZNY — «психологический». Но рядом стоят PSYCHICZNY, «психический», и PSYCHIATRYCZNY, «психиатрический». PSYCHOLOGICZNY — о науке и о том, как работает душа: TEST PSYCHOLOGICZNY, PORTRET PSYCHOLOGICZNY. PSYCHICZNY — о самом состоянии: ZDROWIE PSYCHICZNE. Русская тройка устроена так же." }
  - { kind: usage, text: "Относительное прилагательное, степеней сравнения нет. Формы для мужчин-людей PSYCHOLOGICZNI в карточке нет: людей так не описывают, о специалистах говорят PSYCHOLOGOWIE. Остальные десять форм живые. Суффикс -ICZNY после G, как у LOGICZNY и BIOLOGICZNY." }
  - { kind: government, text: "Ставится после существительного: POMOC PSYCHOLOGICZNA, TEST PSYCHOLOGICZNY, WOJNA PSYCHOLOGICZNA. Перед существительным — редко, в оценках: PSYCHOLOGICZNA GRA. Падежных требований нет." }
  - { kind: pronunciation, text: "Читается «псыхологи́чны», шесть слогов, ударение на предпоследнем. PSY — твёрдое «псы», GI — мягкое «ги», как в русском. Сравните с PSYCHOLOG «псыхо́лок»: там конечное G оглушается в «к»." }
  - { kind: register, text: "Нейтральное слово из науки, медицины и спорта. Спортивные комментаторы любят PRZEWAGA PSYCHOLOGICZNA, «психологическое преимущество». В быту говорят и шутливо: TO CZYSTO PSYCHOLOGICZNE, «это чистая психология»." }
