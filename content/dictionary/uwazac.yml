# review
id: uwazac
format: 2
lemma: "uważać"
rank: 194
pos: verb
aspect: imperf
pron: { cyr: "ува́жаць" }
senses:
  - id: consider
    ru: "считать, полагать (uważać kogoś za kogoś)"
    note: "Конструкция с za и винительным падежом, а не с творительным, как в русском."
    examples:
      - pl: "Nie uważam tak."
        ru: "Я так не считаю."
        source: { kind: tatoeba, id: 1002841 }
      - pl: "Uważam, że nie."
        ru: "Думаю, что нет."
        source: { kind: tatoeba, id: 6327911 }
      - pl: "Też tak uważam."
        ru: "Я тоже так считаю."
        source: { kind: tatoeba, id: 6327913 }
      - pl: "Uważaliśmy go za geniusza."
        ru: "Мы считали его гением."
        source: { kind: tatoeba, id: 5518192 }
  - id: be-careful
    ru: "быть внимательным, осторожным; uważać na coś — следить за чем-либо"
    examples:
      - pl: "Uważaj gdzie idziesz!"
        ru: "Смотри куда идешь!"
        source: { kind: tatoeba, id: 2265392 }
      - pl: "Uważaj na samochody."
        ru: "Осторожно, машины."
        source: { kind: authored }
      - pl: "Uważaj na siebie."
        ru: "Береги себя."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "uważać — это «считать» и «быть внимательным», а вовсе не «уважать». Русское «уважать» по-польски szanować." }
  - { kind: government, text: "«Считать кого-то кем-то» строится с za и винительным: Uważam go za przyjaciela. В русском здесь творительный падеж." }
  - { kind: usage, text: "uważać na coś значит «следить за чем-то, беречься»: Uważaj na schody! «Осторожно, ступеньки!». Существительное — uwaga «внимание»." }
collocations:
  - { pl: "uważaj!", ru: "осторожно!" }
  - { pl: "uważać na siebie", ru: "беречь себя" }
  - { pl: "uważać kogoś za", ru: "считать кого-то кем-то" }
  - { pl: "uważam, że", ru: "я считаю, что" }
etymology: "Из u- + ważyć «взвешивать»: буквально «взвешивать в уме». Русское «уважать» пошло от того же корня, но в другую сторону значения."
memory: "Ложный друг: uważać — «считать» и «быть внимательным», а «уважать» — szanować. И конструкция иная: uważam go za przyjaciela «считаю его другом», с za и винительным."
idioms:
  - { pl: "uważaj na siebie", ru: "береги себя" }
  - { pl: "uważać za stosowne", ru: "счесть нужным" }
  - { pl: "uważaj!", ru: "осторожно!" }
formExamplesSkip:
  - { form: "uważania", reason: "отглагольное существительное не употребляется: в этом значении говорят uwaga" }
  - { form: "uważanie", reason: "отглагольное существительное не употребляется: в этом значении говорят uwaga" }
  - { form: "uważaniem", reason: "отглагольное существительное не употребляется: в этом значении говорят uwaga" }
  - { form: "uważaniu", reason: "отглагольное существительное не употребляется: в этом значении говорят uwaga" }
