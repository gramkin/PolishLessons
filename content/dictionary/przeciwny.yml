notes:
  - { kind: false-friend, text: "ГЛАВНАЯ ЛОВУШКА ЭТОЙ КАРТОЧКИ. Польское przeciwny НИКОГДА не значит «противный» в смысле «мерзкий, отвратительный». Оно значит «противоположный» или «возражающий». Мерзкое по-польски — obrzydliwy, wstrętny. Русское «противный» в старом смысле «противоположный» уцелело только в оборотах «в противном случае» и «противная сторона» — и ровно эти два оборота в польском совершенно живые: w przeciwnym razie, strona przeciwna." }
  - { kind: government, text: "ВНИМАНИЕ НА ПАДЕЖ, ОН ДРУГОЙ. Przeciwny требует ДАТЕЛЬНОГО: jestem przeciwny temu pomysłowi, byli przeciwni budowie. Русское «против» идёт с родительным — «против этой идеи», — и калькировать его нельзя: сказать przeciwny tego pomysłu по-польски невозможно. С предлогом przeciw и przeciwko тоже дательный: przeciwko wszystkim, przeciw ustawie." }
  - { kind: usage, text: "Прилагательное относительное, степеней сравнения у него нет — отсюда всего одиннадцать форм, как у kosmiczny. «Более противоположным» быть нельзя. Оборот w przeciwnym razie переводится на русский дословно, «в противном случае», и встречается в польском постоянно, от разговора до документа." }
  - { kind: pronunciation, text: "Три слога, ударение на предпоследнем: prze-CIW-ny, «пшэци́вны». rz после глухого p звучит как ш, а ci — это мягкое ць с последующим и." }
collocations:
  - { pl: "przeciwny kierunek", ru: "противоположное направление" }
  - { pl: "być przeciwnym czemuś", ru: "быть против чего-л." }
  - { pl: "po przeciwnej stronie", ru: "на противоположной стороне" }
family:
  - { pl: "przeciw", ru: "против", relation: root, id: przeciw }
  - { pl: "przeciwnik", ru: "противник", relation: derived }
  - { pl: "przeciwieństwo", ru: "противоположность", relation: derived }
  - { pl: "sprzeciwiać się", ru: "возражать, противиться", relation: derived }
etymology: "От предлога przeciw «против», из праславянского *protivъ — того же, что русские «против» и «противный». Дальше пути разошлись: русский увёл «противный» в сторону «отвратительного», польский сохранил исходное «противоположный». Отсюда przeciwnik «противник», przeciwieństwo «противоположность», sprzeciwiać się «возражать» и przeciwko «против»."
memory: "przeciwny — «противоположный», но НЕ «противный»: мерзкое по-польски obrzydliwy. И падеж не тот, которого ждёшь: przeciwny TEMU pomysłowi, дательный, а не родительный как в «против этой идеи». Зато w przeciwnym razie — это «в противном случае» слово в слово."
