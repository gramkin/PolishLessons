# review
id: misja
format: 2
lemma: "misja"
rank: 883
pos: noun
pron: { cyr: "ми́сья" }
senses:
  - id: mission
    ru: "миссия, задание"
    examples:
      - pl: "Tajna misja."
        ru: "Тайная миссия."
        source: { kind: translated, id: 13030192 }
      - pl: "Misja wykonana."
        ru: "Миссия выполнена."
        source: { kind: translated, id: 10600741 }
      - pl: "Nasza misja się powiodła."
        ru: "Наша миссия удалась."
        source: { kind: translated, id: 12470103 }
  - id: entrusted
    ru: "о порученном задании"
    examples:
      - pl: "Zlecono mi ważną misję."
        ru: "Мне поручили важную миссию."
        source: { kind: translated, id: 6135081 }
      - pl: "Powierzono mu ważną misję."
        ru: "Ему доверили важную миссию."
        source: { kind: translated, id: 1896365 }
      - pl: "Zakończyli swoją misję."
        ru: "Они завершили свою миссию."
        source: { kind: translated, id: 1782506 }
  - id: calling
    ru: "миссия как призвание, предназначение"
    examples:
      - pl: "Wierzyłam, że wszystko wokół mnie było znakiem jakiejś boskiej misji."
        ru: "Я верила, что всё вокруг меня было знаком некой божественной миссии."
        source: { kind: translated, id: 10476976 }
      - pl: "Bez wahania zaoferowałem siebie do tej misji."
        ru: "Я без колебаний предложил себя для этой миссии."
        source: { kind: translated, id: 2310480 }
      - pl: "Czy podjął się tej misji?"
        ru: "Он взялся за эту миссию?"
        source: { kind: translated, id: 365727 }
notes:
  - { kind: usage, text: "Слово заимствованное и с русским совпадает: misja specjalna «специальная миссия», misja wykonana «миссия выполнена»." }
  - { kind: government, text: "podjąć się misji «взяться за миссию» — родительный падеж после podjąć się; powierzyć komuś misję «поручить кому-то миссию» — дательный и винительный." }
  - { kind: usage, text: "Производные прозрачны: misjonarz «миссионер», misyjny «миссионерский». Дипломатическое представительство тоже misja." }
  - { kind: pronunciation, text: "Сочетание -sja читается мягко, «мисья», а не «мисия»: в польском j после согласной смягчает её." }
collocations:
  - { pl: "tajna misja", ru: "тайная миссия" }
  - { pl: "misja wykonana", ru: "миссия выполнена" }
  - { pl: "powierzyć misję", ru: "поручить миссию" }
  - { pl: "misja specjalna", ru: "специальная миссия" }
family:
  - { pl: "misjonarz", ru: "миссионер", relation: derived }
  - { pl: "misyjny", ru: "миссионерский", relation: derived }
etymology: "Из латинского missio «отправление, посылка», от mittere «посылать». Русское «миссия» — то же заимствование, так что слова совпадают полностью."
memory: "misja — «миссия», слово международное и ловушек не содержит. Запомните misja wykonana «миссия выполнена» и произношение: -sja звучит мягко, «мисья». Миссионер — misjonarz."
idioms:
  - { pl: "tajna misja", ru: "тайная миссия" }
  - { pl: "misja wykonana", ru: "миссия выполнена" }
  - { pl: "powierzyć misję", ru: "поручить миссию" }
formExamplesSkip:
  - { form: "misyj", reason: "устаревший вариант родительного множественного; сегодняшняя норма — misji" }
