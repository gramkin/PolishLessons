  - { kind: false-friend, text: "Корень przykry «неприятный, досадный» — ср. русское «прикрый» в диалектах. Приставка s- даёт «стать неприятным»." }
  - { kind: usage, text: "В корпусе слово не встречается, поэтому все примеры составлены вручную." }
  - { kind: government, text: "Ни страдательного причастия, ни повелительного наклонения у глагола нет: дополнения в винительном падеже он не берёт, а приказать чему-то надоесть нельзя. Зато подлежащим бывает и человек: sprzykrzyłeś mi się «ты мне надоел»." }
collocations:
  - { pl: "sprzykrzyć się komuś", ru: "надоесть кому-л." }
etymology: "s- + przykry «неприятный, досадный»: стать неприятным."
