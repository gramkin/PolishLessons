# review
id: udzial
format: 2
lemma: "udział"
rank: 967
pos: noun
pron: { cyr: "у́дзяў" }
senses:
  - id: take-part
    ru: "brać udział — принимать участие"
    note: "Устойчивое сочетание с глаголом brać, а не «принимать»."
    examples:
      - pl: "Weźmiemy udział w maratonie."
        ru: "Мы будем участвовать в марафоне."
        source: { kind: tatoeba, id: 758401 }
      - pl: "Czy związek brał udział w demonstracji?"
        ru: "Профсоюз принимал участие в демонстрации?"
        source: { kind: tatoeba, id: 960716 }
      - pl: "Nie brałem udziału w rozmowie."
        ru: "Я не участвовал в разговоре."
        source: { kind: translated, id: 440321 }
  - id: participation
    ru: "участие, доля"
    examples:
      - pl: "Nie mogę wziąć udziału."
        ru: "Я не могу принять участие."
        source: { kind: translated, id: 7868561 }
      - pl: "Nie będę brał udziału w imprezie."
        ru: "Я не буду участвовать в вечеринке."
        source: { kind: translated, id: 892026 }
      - pl: "W czasie trwania projektu biorące udział kraje i regiony będą porównywać i wymieniać doświadczenia w celu ulepszenia kompetencji społecznych ludności i współpracowników służby zdrowia."
        ru: "В течение срока действия проекта участвующие страны и регионы смогут сравнить и обменяться опытом в области национальных и региональных стратегий для улучшения социальной компетенции населения и сотрудников здравоохранения."
        source: { kind: tatoeba, id: 1846963 }
  - id: share
    ru: "udziały — доли, паи (в фирме)"
    examples:
      - pl: "Mamy 20% udziałów w rynku."
        ru: "У нас двадцать процентов доли рынка."
        source: { kind: translated, id: 1645329 }
      - pl: "Dam ci połowę moich udziałów."
        ru: "Я отдам тебе половину своих долей."
        source: { kind: translated, id: 7977918 }
      - pl: "Łacina to język z dużym udziałem fleksji."
        ru: "Латынь - это язык с высокой степенью флективности."
        source: { kind: tatoeba, id: 352492 }
notes:
  - { kind: government, text: "brać udział W czymś «принимать участие в чём-то» — предлог w и предложный падеж. Глагол именно brać «брать», а не «принимать»: wziąć udział w maratonie." }
  - { kind: usage, text: "z udziałem kogoś — «с участием кого-то»: wypadek z udziałem motocyklisty «авария с участием мотоциклиста»." }
  - { kind: usage, text: "Во множественном числе udziały значит «доли, паи» в фирме: mamy 20% udziałów w rynku. Акции же — akcje." }
  - { kind: usage, text: "Слово от dział «раздел, отдел» и dzielić «делить»: участие — это когда тебе достаётся доля. Русское «удел» того же корня." }
collocations:
  - { pl: "brać udział", ru: "принимать участие" }
  - { pl: "wziąć udział w", ru: "принять участие в" }
  - { pl: "z udziałem", ru: "с участием" }
  - { pl: "udziały w firmie", ru: "доли в фирме" }
family:
  - { pl: "dzielić", ru: "делить", relation: root }
  - { pl: "dział", ru: "отдел, раздел", relation: root }
  - { pl: "uczestnik", ru: "участник", relation: derived }
etymology: "От dzielić «делить» через dział «раздел»: участие — это доля, которая тебе досталась. Русское «удел» того же корня и той же мысли."
memory: "udział — «участие», и главное тут сочетание: brać udział W czymś, с глаголом brać «брать», а не «принимать». Wziąć udział w maratonie «принять участие в марафоне». Во множественном udziały значит «доли, паи» — акции же будут akcje."
idioms:
