notes:
  - { kind: false-friend, text: "Значение совпадает с русским «нервом» полностью, и оба языка взяли слово из латыни. Расходится звучание: конечное W оглушается, и слово читается «нэрф», совсем не похоже на русское «нерв». Разделение значений по числу тоже общее: единственное число анатомическое, множественное NERWY — о душевном состоянии, как и по-русски. Устойчивое DZIAŁAĆ KOMUŚ NA NERWY отвечает русскому «действовать кому-то на нервы» слово в слово. Отличается производное: невроз по-польски NERWICA, а не NEUROZA, и слово это в обиходе очень частое." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Местный единственного — NERWIE, где конечное W основы смягчается в WI перед окончанием -E: рядом с соседними карточками видно весь ряд, POSADZIE смягчает D, NERWIE смягчает W, ZAPISIE смягчает S. Родительный единственного — NERWU. Винительный равен именительному. Во множественном слово почти всегда стоит в переносном значении: MIEĆ MOCNE NERWY, STRACIĆ NERWY «потерять самообладание», NERWY ZE STALI. Анатомические термины строятся прилагательным: NERW WZROKOWY, NERW BŁĘDNY." }
  - { kind: pronunciation, text: "Читается «нэрф», один слог. Буква E после N звучит как «э», без смягчения предыдущего согласного, а конечное W оглушается в «ф» — поэтому именительный падеж на слух совсем не похож на русское «нерв». В формах с окончанием звонкость возвращается: NERWU читается «не́рву», NERWEM — «не́рвэм», NERWY — «не́рвы». В форме NERWIE сочетание WIE даёт мягкое «ве»: «не́рве». В форме NERWÓW буква Ó даёт «у», а конечное W снова оглушается: «не́рвуф»." }
  - { kind: register, text: "Слово нейтральное, одинаково уместное у врача и за столом. Устойчивые сочетания: DZIAŁAĆ NA NERWY, STRACIĆ NERWY, MIEĆ MOCNE NERWY, NERWY ZE STALI, W NERWACH «на нервах, сгоряча». Производные: NERWOWY «нервный», NERWICA «невроз», NERWUS о человеке вспыльчивом и дёрганом — слово разговорное и слегка насмешливое, русского однословного соответствия у него нет. Медицинские обороты UKŁAD NERWOWY «нервная система» и ZAPALENIE NERWU «неврит» встречаются в обычном разговоре о здоровье." }
