etymology: "Из латинского NERVUS «жила, сухожилие, тетива», родственного греческому NEURON с тем же значением, откуда идут «неврология» и «нейрон». Первоначально словом называли всякую крепкую волокнистую нить в теле, и лишь медицина нового времени закрепила его за проводником ощущения; старое значение осталось в выражениях о натянутой тетиве и в переносном NERW WALKI «боевой задор». Польский и русский взяли слово одним и тем же путём, через латынь учёных книг, поэтому совпадение полное. Разошлось только производное для болезни: польский построил NERWICA на своей почве, с суффиксом -ICA, как в BIAŁACZKA, а русский взял готовое греческое «невроз»."
memory: "Полное соответствие русскому «нерву», оба из латинского nervus «жила, тетива» — отсюда же греческое neuron и «неврология». Но звучит иначе: конечное w оглушается, выходит «нэрф». Разделение по числу как в русском: nerw анатомический, nerwy о состоянии, działać na nerwy. Невроз это nerwica, не «невроз». Местный nerwie со смягчением w→wi."
idioms:
  - { pl: "działać komuś na nerwy", ru: "действовать кому-либо на нервы" }
