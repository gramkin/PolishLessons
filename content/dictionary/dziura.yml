# review
id: dziura
format: 2
lemma: "dziura"
rank: 1299
pos: noun
pron: { cyr: "дзю́ра" }
senses:
  - id: hole
    ru: "дыра, отверстие"
    examples:
      - pl: "W wiadrze jest dziura."
        ru: "В ведре дыра."
        source: { kind: translated, id: 679133 }
      - pl: "W jego skarpetce jest dziura."
        ru: "В его носке дыра."
        source: { kind: translated, id: 3285537 }
      - pl: "Szczur zrobił dziurę w ścianie."
        ru: "Крыса прогрызла дыру в стене."
        source: { kind: tatoeba, id: 5491774 }
  - id: dig
    ru: "яма, нора — выкопать"
    examples:
      - pl: "Wykopałam dziurę."
        ru: "Я выкопала яму."
        source: { kind: translated, id: 12450223 }
      - pl: "Wykop głęboką dziurę."
        ru: "Выкопай глубокую яму."
        source: { kind: translated, id: 527383 }
      - pl: "Borsuki wykopują głębokie dziury."
        ru: "Барсуки вырывают глубокие норы."
        source: { kind: tatoeba, id: 5947057 }
  - id: backwater
    ru: "захолустье, дыра; чёрная дыра"
    examples:
      - pl: "Czarna dziura nie jest czarna."
        ru: "Чёрная дыра не чёрная."
        source: { kind: translated, id: 13054846 }
      - pl: "Poza lisami i borsukami pewnie mało kto pojawia się w tej dziurze zabitej dechami."
        ru: "Кроме лис и барсуков, в этой глухой дыре вряд ли кто-то появляется."
        source: { kind: translated, id: 6157053 }
      - pl: "Nie szukaj dziury w całym."
        ru: "Не придирайся по мелочам."
        source: { kind: translated, id: 2397560 }
notes:
  - { kind: usage, text: "Dziura — и дыра в одежде, и яма в дороге, и захолустье: dziura zabita dechami «глухая дыра»." }
  - { kind: usage, text: "Устойчивое szukać dziury w całym «придираться по мелочам», буквально «искать дыру в целом»." }
  - { kind: usage, text: "Терминологические сочетания: czarna dziura «чёрная дыра», dziura ozonowa «озоновая дыра», dziura budżetowa «дыра в бюджете»." }
  - { kind: government, text: "dziura w czymś «дыра в чём-то» — предлог w с предложным падежом: dziura w ścianie." }
collocations:
  - { pl: "dziura w ścianie", ru: "дыра в стене" }
  - { pl: "czarna dziura", ru: "чёрная дыра" }
  - { pl: "wykopać dziurę", ru: "выкопать яму" }
  - { pl: "szukać dziury w całym", ru: "придираться по мелочам" }
etymology: "Праславянское *dura — то же слово, что русское «дыра». Из того же гнезда и глагол «драть»."
memory: "dziura — «дыра» во всех смыслах: в носке, в дороге, в бюджете и даже чёрная дыра. Идиома szukać dziury w całym «придираться по мелочам». Русское «дыра» — то же праславянское слово."
idioms:
  - { pl: "czarna dziura", ru: "чёрная дыра" }
  - { pl: "szukać dziury w całym", ru: "придираться по мелочам" }
  - { pl: "dziura zabita dechami", ru: "глухая дыра" }
formExamplesSkip:
  - { form: "dziuro", reason: "звательный падеж: для неодушевлённого существительного он практически не употребляется" }
