        source: { kind: translated, id: 5909136 }
  - id: offer
    ru: "Napijesz się? — Выпьешь?"
    examples:
      - pl: "Napijesz się czegoś?"
        ru: "Выпьешь чего-нибудь?"
        source: { kind: translated, id: 2146146 }
      - pl: "Napije się pan?"
        ru: "Не желаете ли выпить?"
        source: { kind: translated, id: 8755773 }
      - pl: "Napijemy się herbaty?"
        ru: "Чаю попьём?"
        source: { kind: translated, id: 10465182 }
  - id: lets-drink
    ru: "Napijmy się — давай выпьем"
    examples:
      - pl: "Napijmy się."
        ru: "Давай выпьем."
        source: { kind: translated, id: 7880404 }
      - pl: "Napijmy się herbaty."
        ru: "Давай выпьем чаю."
        source: { kind: translated, id: 3750120 }
      - pl: "Napijmy się kawy w tamtej kawiarni."
        ru: "Давай выпьем кофе в той кофейне."
        source: { kind: translated, id: 826338 }
notes:
  - { kind: government, text: "Глагол употребляется только с się и требует родительного падежа: napić się WODY, HERBATY, KAWY. Русское «выпить воды» — тоже родительный, так что совпадает." }
  - { kind: usage, text: "Совершенный вид к pić. Pił wodę «пил воду» о процессе, napił się wody «выпил воды» о результате." }
  - { kind: usage, text: "Napijesz się? — «Выпьешь?», самое обычное приглашение. Вежливо: Napije się pan? «Не желаете ли выпить?»." }
  - { kind: usage, text: "Без дополнения глагол обычно значит «выпить спиртного»: Czas się napić «Пора выпить», Muszę się napić." }
collocations:
  - { pl: "napić się wody", ru: "выпить воды" }
  - { pl: "napić się herbaty", ru: "выпить чаю" }
