  - { pl: "napój", ru: "напиток", relation: derived }
  - { pl: "wypić", ru: "выпить (до дна)", relation: derived }
etymology: "Приставка na- + pić «пить». Русское «напиться» устроено так же, но по-польски napić się значит просто «выпить», без оттенка опьянения."
memory: "napić się — «выпить», и только с się: napić się WODY, с родительным падежом. Napijesz się? «Выпьешь?» — обычное приглашение. Без дополнения обычно значит «выпить спиртного»."
