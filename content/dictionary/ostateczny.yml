etymology: "От ostatek «остаток, конец», от ostać się «остаться», из праславянского *stati — того же корня, что русские «стать», «остаться», «остаток». Окончательным назвали то, что остаётся в конце, когда всё прочее отпало. Русское «остаточный» пошло от «остатка» в прямом смысле, отсюда и расхождение."
memory: "ostateczny — «ОКОНЧАТЕЛЬНЫЙ», а не «остаточный», хотя корень один: от ostatek «конец». Оборот w ostateczności значит «в крайнем случае», а наречие ostatecznie — «в конце концов»."
