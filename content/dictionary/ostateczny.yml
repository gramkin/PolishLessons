notes:
  - { kind: false-friend, text: "КОРЕНЬ ТОТ ЖЕ, ЧТО В РУССКОМ «ОСТАТОК», НО ЗНАЧЕНИЕ РАЗОШЛОСЬ. Ostateczny от ostatek «остаток, конец» и значит «ОКОНЧАТЕЛЬНЫЙ, последний». Русское «остаточный» от того же корня значит «оставшийся, побочный» — ostateczny wynik это окончательный итог, а не остаточный. Переводить надо словом «окончательный»." }
  - { kind: usage, text: "Существительное ostateczność живёт в обороте w ostateczności «в крайнем случае», а наречие ostatecznie значит и «окончательно», и «в конце концов, в общем-то»: ostatecznie zgodził się «в конце концов он согласился». Рядом стоит ostatni «последний по счёту» — это другое слово и другая мысль." }
  - { kind: register, text: "Степени сравнения в таблице есть, но в живой речи почти не встречаются: окончательное трудно сделать ещё окончательнее. Формы ostateczniejszy и najostateczniejszy звучат книжно и употребляются разве что в рассуждении о степени бесповоротности. Само слово нейтрально и частотно в деловом языке." }
  - { kind: pronunciation, text: "Четыре слога, ударение на предпоследнем: os-ta-TECZ-ny. Cz читается как твёрдое ч: «остатэ́чны». В сравнительной степени появляется мягкое ni: ostateczniejszy — «остатэчне́йшы»." }
