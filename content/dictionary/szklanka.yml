notes:
  - { kind: usage, text: "Слово завершает троицу, начатую в карточке SZYBA. Русское «стекло» по-польски распадается на два слова: SZKŁO — это стекло как вещество, SZYBA — лист стекла в окне или в машине. А SZKLANKA — это стакан, из которого пьют, то есть предмет, названный по материалу. Русский же для стакана взял слово совсем другого происхождения, так что из трёх польских слов по-русски узнаётся только одно." }
  - { kind: usage, text: "Дательный и местный — SZKLANCE, с переходом k в c, а родительный множественного — SZKLANEK, с беглым e. Обе черты у женских слов на -ka идут вместе и работают без исключений, как в kostce и kostek, działce и działek, stawce и stawek, rozrywce и rozrywek из этой же партии. Это одна из самых надёжных закономерностей польского склонения." }
  - { kind: usage, text: "В рецептах слово служит мерой, ровно как русский «стакан»: SZKLANKA MĄKI, DWIE SZKLANKI MLEKA. Польская мерная шклянка — это двести пятьдесят миллилитров, то есть чуть больше русского граненого стакана в двести. А выражение BURZA W SZKLANCE WODY совпадает с русской «бурей в стакане воды» дословно, вместе с предлогом и падежом." }
collocations:
  - { pl: "szklanka wody", ru: "стакан воды" }
  - { pl: "szklanka herbaty", ru: "стакан чая" }
  - { pl: "szklanka mąki", ru: "стакан муки" }
family:
  - { pl: "szkło", ru: "стекло", relation: root }
  - { pl: "szklany", ru: "стеклянный", relation: derived }
etymology: "От SZKŁO «стекло», из праславянского *stьklo — того же слова, что русское «стекло», которое само пришло к славянам из готского stikls «кубок». Стакан назван по материалу, из которого сделан. Русский же взял для этого предмета тюркское слово — «стакан» идёт от «тостакана», — так что szklanka и «стакан» не родственны вовсе, хотя обозначают одно и то же."
memory: "Троица вместо русского «стекла»: szkło — вещество, szyba — лист в окне, szklanka — стакан. Местный szklance, родительный множественного szklanek."
idioms:
  - { pl: "burza w szklance wody", ru: "буря в стакане воды" }
  - { pl: "szklanka wody", ru: "стакан воды" }
