notes:
  - { kind: false-friend, text: "Русскому «вероятный» польское WIARYGODNY созвучно, но значит другое: «достоверный, заслуживающий веры». Вероятный по-польски — PRAWDOPODOBNY. Собрано WIARYGODNY из WIARA «вера» и GODNY «достойный»: «достойный веры». Банковское «кредитоспособность» — ZDOLNOŚĆ KREDYTOWA, а WIARYGODNOŚĆ — «надёжность, репутация»." }
  - { kind: usage, text: "Полная парадигма: WIARYGODNY, WIARYGODNIEJSZY, NAJWIARYGODNIEJSZY. Все степени живые. Мужское-личное: WIARYGODNI, WIARYGODNIEJSI, NAJWIARYGODNIEJSI — о свидетелях, экспертах, партнёрах." }
  - { kind: government, text: "Надёжный для кого-то — WIARYGODNY DLA KOGOŚ, DLA с родительным. Ставится и до, и после существительного: WIARYGODNE ŹRÓDŁO, ŚWIADEK WIARYGODNY. Наречие WIARYGODNIE — «достоверно, убедительно»." }
  - { kind: pronunciation, text: "Читается «вярыго́дны», четыре слога, ударение на предпоследнем. WIA — мягкое «вя», RY — твёрдое «ры». В WIARYGODNIEJSZY: «вярыгодне́йшы»." }
  - { kind: register, text: "Нейтральное слово, частое в журналистике, праве и бизнесе: WIARYGODNE ŹRÓDŁO, WIARYGODNY ŚWIADEK. В разговоре проще PEWNY, «надёжный»." }
collocations:
  - { pl: "wiarygodne źródło", ru: "достоверный источник" }
  - { pl: "wiarygodny świadek", ru: "надёжный свидетель" }
  - { pl: "wiarygodny partner", ru: "надёжный партнёр" }
family:
  - { pl: "wiara", ru: "вера", relation: root, id: wiara }
  - { pl: "godny", ru: "достойный", relation: root }
  - { pl: "wiarygodność", ru: "достоверность, надёжность", relation: derived }
etymology: "Сложение WIARA «вера» и GODNY «достойный», то есть «достойный веры». Русское «достоверный» собрано похоже: «до» плюс «вера». Модель «существительное плюс GODNY» продуктивна в польском: GODNY ZAUFANIA, «заслуживающий доверия», GODNY UWAGI, «достойный внимания»."
memory: "Wiarygodny — достоверный, заслуживающий доверия: wiarygodne źródło, wiarygodny świadek. Не «вероятный» (prawdopodobny)! Wiara + godny. Читается «вярыго́дны»."
