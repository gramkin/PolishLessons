        ru: "Он забыл свой зонтик в автобусе."
        source: { kind: tatoeba, id: 1448930 }
      - pl: "W autobusie był straszliwy tłok."
        ru: "В автобусе была страшная давка."
        source: { kind: translated, id: 365686 }
      - pl: "Tom zasnął w autobusie."
        ru: "Том заснул в автобусе."
        source: { kind: translated, id: 2991728 }
notes:
  - { kind: government, text: "Ключевая пара падежей: jechać autobusem «ехать на автобусе» — творительный без предлога, но w autobusie «в автобусе» — предложный с w. Русский в обоих случаях ставит предлог." }
  - { kind: usage, text: "wsiąść do autobusu «сесть в автобус» — предлог do с родительным, wysiąść z autobusu «выйти из автобуса» — z с родительным." }
  - { kind: usage, text: "Kierowca autobusu — «водитель автобуса». О расписании говорят Autobusy jeżdżą co dziesięć minut «Автобусы ходят каждые десять минут»." }
  - { kind: pronunciation, text: "Сочетание au читается в два звука: ауто́бус. Ударение на предпоследний слог." }
collocations:
  - { pl: "jechać autobusem", ru: "ехать на автобусе" }
  - { pl: "w autobusie", ru: "в автобусе" }
  - { pl: "kierowca autobusu", ru: "водитель автобуса" }
  - { pl: "wsiąść do autobusu", ru: "сесть в автобус" }
etymology: "Собрано из automobil и omnibus — ровно так же, как русский «автобус». Латинское omnibus значит «для всех»."
memory: "autobus — «автобус». Главное здесь падежи: jechać autobusem «ехать на автобусе» — творительный без предлога, но w autobusie «в автобусе» — предложный. Садятся wsiąść do autobusu, выходят wysiąść z autobusu."
idioms:
