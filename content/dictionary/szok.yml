notes:
  - { kind: false-friend, text: "Ловушки нет: слово международное и в оба языка пришло одинаково, через французский. Полезно знать обороты: być w szoku «быть в шоке», przeżyć szok «пережить потрясение», co za szok «вот это да». Разговорное szok! как восклицание значит примерно «с ума сойти»." }
  - { kind: pronunciation, text: "Один слог, пишется через sz: «шок». Конечное k глухое и в именительном, и в винительном. В косвенных падежах появляется второй слог: szoku — «шо́ку», szokiem — «шо́кем», с мягким к перед i." }
  - { kind: usage, text: "Прилагательное szokujący «шокирующий», глагол szokować «шокировать». Предложный оборот w szoku очень частотен: jestem w szoku. Медицинские термины строятся как в русском: szok pourazowy, szok anafilaktyczny, szok termiczny." }
collocations:
  - { pl: "być w szoku", ru: "быть в шоке" }
  - { pl: "przeżyć szok", ru: "пережить потрясение" }
  - { pl: "szok pourazowy", ru: "травматический шок" }
family:
  - { pl: "szokować", ru: "шокировать", relation: derived }
  - { pl: "szokujący", ru: "шокирующий", relation: derived }
  - { pl: "wstrząs", ru: "потрясение, толчок", relation: root }
etymology: "Из французского choc «удар, столкновение», от choquer «сталкивать». В оба языка слово пришло в девятнадцатом веке сначала как медицинский термин, потом разошлось в обиход. Польское написание sz передаёт французское ch. Отсюда szokować, szokujący и szokowy."
memory: "szok — «шок», слово в слово, только пишется через sz. Самый частый оборот: jestem w szoku «я в шоке». Прилагательное szokujący, глагол szokować."
idioms:
