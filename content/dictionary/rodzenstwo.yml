etymology: "От RODZIĆ «рождать», того же корня, что RÓD, RODZINA и русские «род», «родня». Суффикс -EŃSTWO собирает людей в одно целое, как MAŁŻEŃSTWO — «супружество, супруги»."
memory: "Rodzeństwo — братья и сёстры одним словом. Читается «родзэ́ньстфо». Masz rodzeństwo? — у тебя есть братья или сёстры? Mam troje rodzeństwa. Единственный ребёнок — jedynak."
