notes:
  - { kind: false-friend, text: "RODZEŃSTWO — одно слово для «братьев и сестёр» вместе, которого в русском нет. MASZ RODZEŃSTWO? — «у тебя есть братья или сёстры?». Число считают собирательными числительными: MAM TROJE RODZEŃSTWA — «у меня трое братьев и сестёр». Единственный ребёнок — JEDYNAK, JEDYNACZKA." }
  - { kind: usage, text: "Собирательное существительное среднего рода, глагол при нём стоит в единственном числе: RODZEŃSTWO PRZYJECHAŁO. Живых форм пять; формы множественного числа в таблице на деле не нужны. После числительного — родительный: TROJE RODZEŃSTWA." }
  - { kind: government, text: "С братьями и сёстрами — Z RODZEŃSTWEM, творительный. Нет братьев и сестёр — NIE MA RODZEŃSTWA, родительный. Сколько их — ILE MASZ RODZEŃSTWA?, тоже родительный." }
  - { kind: pronunciation, text: "Читается «родзэ́ньстфо», три слога, ударение на втором. DZ — «дз», Ń перед согласным — мягкое «нь», а W после T оглушается в «ф»." }
  - { kind: register, text: "Слово нейтральное, и в анкетах, и в разговоре. RODZEŃSTWO PRZYRODNIE — «сводные братья и сёстры». О близнецах — RODZEŃSTWO BLIŹNIACZE." }
collocations:
  - { pl: "starsze rodzeństwo", ru: "старшие братья и сёстры" }
  - { pl: "młodsze rodzeństwo", ru: "младшие братья и сёстры" }
  - { pl: "rodzeństwo bliźniacze", ru: "близнецы (брат и сестра, братья, сёстры)" }
family:
