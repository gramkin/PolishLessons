# review
id: spuscic
format: 2
lemma: "spuścić"
rank: 4343
pos: verb
pron: { cyr: "спу́сьциць" }
senses:
  - id: lower
    ru: "опустить, спустить"
    examples:
      - pl: "Spuściła wzrok ze wstydu."
        ru: "Она опустила глаза от стыда."
        source: { kind: authored }
      - pl: "Spuść rolety, słońce razi."
        ru: "Опусти жалюзи, солнце слепит."
        source: { kind: authored }
      - pl: "Spuścili łódź na wodę."
        ru: "Они спустили лодку на воду."
        source: { kind: authored }
  - id: release
    ru: "спустить, выпустить (воду, собаку)"
    examples:
      - pl: "Nie zapomnij spuścić wody w toalecie."
        ru: "Не забудь смыть воду в туалете."
        source: { kind: authored }
      - pl: "Spuścił psa ze smyczy."
        ru: "Он спустил собаку с поводка."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "SPUŚCIĆ — «спустить, опустить», и с русским совпадает почти полностью: SPUŚCIĆ PSA ZE SMYCZY, SPUŚCIĆ ŁÓDŹ NA WODĘ. Но «спустить деньги» — PRZEPUŚCIĆ, PRZEPUŚCIĆ PIENIĄDZE, а «спуститься по лестнице» — ZEJŚĆ. SPUŚCIĆ WODĘ — «смыть унитаз»." }
  - { kind: usage, text: "Пятьдесят три формы — подпись переходного глагола совершенного вида: страдательное SPUSZCZONY и деепричастие SPUŚCIWSZY. Чередование ŚĆ → SZCZ: SPUŚCIĆ, но SPUSZCZĘ, SPUSZCZONY. Видовой партнёр — SPUSZCZAĆ: NIE SPUSZCZAŁ Z NIEJ OKA." }
  - { kind: government, text: "Что — винительный: SPUŚCIĆ GŁOWĘ, ZASŁONY. Откуда — Z с родительным: SPUŚCIĆ ZE SMYCZY, Z ŁAŃCUCHA. Куда — NA с винительным: SPUŚCIĆ NA WODĘ, NA DÓŁ. Не спускать глаз — NIE SPUSZCZAĆ Z OKA." }
  - { kind: pronunciation, text: "Читается «спу́сьциць», два слога, ударение на первом. ŚCI — мягкие «сьци», конечное Ć — «ць». SPUSZCZĘ — «спу́шчэ», с твёрдыми «шч»." }
  - { kind: register, text: "Нейтральный бытовой глагол. Устойчивые: SPUŚCIĆ GŁOWĘ, SPUŚCIĆ NOS NA KWINTĘ, «повесить нос». SPUŚCIĆ Z TONU — «сбавить тон, присмиреть». SPUŚCIĆ KOMUŚ LANIE — «задать трёпку» (разг.)." }
collocations:
  - { pl: "spuścić wzrok", ru: "опустить глаза" }
  - { pl: "spuścić wodę", ru: "смыть (в туалете)" }
  - { pl: "spuścić psa ze smyczy", ru: "спустить собаку с поводка" }
family:
  - { pl: "spuszczac", ru: "спускать, опускать", relation: aspect }
  - { pl: "puscic", ru: "пустить, отпустить", relation: root, id: puscic }
  - { pl: "upuscic", ru: "уронить", relation: root, id: upuscic }
etymology: "Приставка S- плюс PUŚCIĆ «пустить», праславянское *pustiti, то же, что русское «спустить». Польское ŚCI на месте русского «сти» — обычное смягчение."
memory: "Spuścić — спустить, опустить: spuścić wzrok, spuścić psa ze smyczy, spuścić wodę. Spuścić nos na kwintę — повесить нос. Spuszczę — с SZCZ. Читается «спу́сьциць»."
idioms:
  - { pl: "spuścić nos na kwintę", ru: "повесить нос" }
