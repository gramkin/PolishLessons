# review
id: zapewne
format: 2
lemma: "zapewne"
rank: 1629
pos: part
pron: { cyr: "запэ́внэ" }
senses:
  - id: probably
    ru: "наверное, вероятно"
    examples:
      - pl: "Ten wypadek miał zapewne związek ze śnieżycami."
        ru: "Эта авария, вероятно, была связана со снегопадом."
        source: { kind: tatoeba, id: 349628 }
      - pl: "Domyślasz się zapewne, co się stało."
        ru: "Ты, наверно, догадываешься, что случится."
        source: { kind: tatoeba, id: 364808 }
      - pl: "Prędzej czy później zapewne poznasz prawdę."
        ru: "Рано или поздно ты, вероятно, узнаешь правду."
        source: { kind: translated, id: 2160340 }
  - id: assumption
    ru: "наверняка (о догадке говорящего)"
    examples:
      - pl: "Masz zapewne rację."
        ru: "Ты, наверное, прав."
        source: { kind: translated, id: 5988865 }
      - pl: "Tom zapewne nie przyjdzie na czas."
        ru: "Том, вероятно, не придёт вовремя."
        source: { kind: translated, id: 12567474 }
      - pl: "Tom zapewne to słyszał."
        ru: "Том, наверное, это слышал."
        source: { kind: translated, id: 5879305 }
notes:
  - { kind: usage, text: "Частица не склоняется — одна форма. Обычно стоит после глагола или подлежащего: Masz zapewne rację «Ты, наверное, прав»." }
  - { kind: usage, text: "Шкала уверенности: może «может быть» (слабее всего), chyba «пожалуй», zapewne «наверное», na pewno «наверняка, точно»." }
  - { kind: false-friend, text: "Не путайте zapewne «наверное» с na pewno «наверняка, точно»: zapewne оставляет сомнение, na pewno его снимает." }
  - { kind: usage, text: "Образовано от pewny «уверенный, верный» — тот же корень, что в pewnie и na pewno." }
collocations:
  - { pl: "zapewne masz rację", ru: "ты, наверное, прав" }
  - { pl: "zapewne nie", ru: "наверное, нет" }
  - { pl: "zapewne tak", ru: "наверное, да" }
etymology: "Из za + pewne, от pewny «верный, уверенный». Русское «наверное» собрано тем же способом — предлог плюс форма слова «верный», — так что совпадает и логика, и результат."
memory: "zapewne = «наверное», от pewny «уверенный», как русское «наверное» от «верный». Держите шкалу: może «может быть» → chyba «пожалуй» → zapewne «наверное» → na pewno «наверняка»."
