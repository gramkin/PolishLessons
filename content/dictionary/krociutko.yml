# review
id: krociutko
format: 2
lemma: "króciutko"
rank: 6020
pos: adv
pron: { cyr: "круцю́тко" }
senses:
  - id: very-briefly
    ru: "коротенько, совсем недолго"
    examples:
      - pl: "Opowiem ci króciutko, co się stało."
        ru: "Я тебе коротенько расскажу, что случилось."
        source: { kind: authored }
      - pl: "Byliśmy u nich tylko króciutko."
        ru: "Мы были у них совсем недолго."
        source: { kind: authored }
      - pl: "Zdrzemnąłem się króciutko po obiedzie."
        ru: "После обеда я ненадолго вздремнул."
        source: { kind: authored }
      - pl: "Odpisz mi chociaż króciutko."
        ru: "Ответь мне хотя бы коротенько."
        source: { kind: authored }
  - id: very-short
    ru: "совсем коротко (о стрижке, длине)"
    examples:
      - pl: "Fryzjer obciął mi włosy króciutko."
        ru: "Парикмахер подстриг мне волосы совсем коротко."
        source: { kind: authored }
      - pl: "Latem strzygę psa bardzo króciutko."
        ru: "Летом я стригу собаку совсем коротко."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Уменьшительно-ласкательная форма от KRÓTKO «коротко», как русское «коротенько». Звучит мягко, по-домашнему; в официальной речи говорят KRÓTKO. Степеней сравнения нет." }
  - { kind: pronunciation, text: "Читается «круцю́тко»: Ó — «у», CIU — «цю». Ударение на предпоследнем слоге: kró-CIUT-ko." }
  - { kind: usage, text: "Так же образованы другие ласковые наречия: MALUTKO, CIEPLUTKO. Прилагательное — KRÓCIUTKI «коротенький»." }
collocations:
  - { pl: "króciutko ostrzyżony", ru: "коротко-коротко стриженный" }
  - { pl: "tylko króciutko", ru: "совсем ненадолго" }
  - { pl: "opowiedzieć króciutko", ru: "коротенько рассказать" }
family:
