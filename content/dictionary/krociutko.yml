  - { pl: "króciutki", ru: "коротенький", relation: derived }
  - { pl: "skrót", ru: "сокращение", relation: root, id: skrot }
synonyms: ["krótko", "zwięźle"]
etymology: "Уменьшительное от KRÓTKO «коротко» (от KRÓTKI) с ласкательным суффиксом -UTKO; ср. русское «коротенько»."
memory: "Króciutko — «коротенько»: krótko с ласковым -utko. Opowiem ci króciutko — «расскажу коротенько»."
idioms:
