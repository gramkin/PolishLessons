# review
id: bywac
format: 2
lemma: "bywać"
rank: 1880
pos: verb
pron: { cyr: "бы́ваць" }
senses:
  - id: happen
    ru: "бывать, случаться время от времени"
    examples:
      - pl: "Bywa, że pociąg się spóźnia."
        ru: "Бывает, что поезд опаздывает."
        source: { kind: authored }
      - pl: "Tak bywa w każdej rodzinie."
        ru: "Так бывает в каждой семье."
        source: { kind: authored }
      - pl: "Bywały lata chudsze i tłustsze."
        ru: "Бывали годы и похуже, и получше."
        source: { kind: authored }
  - id: frequent
    ru: "бывать где-л., наведываться"
    examples:
      - pl: "Bywa u nas co niedzielę."
        ru: "Он бывает у нас каждое воскресенье."
        source: { kind: authored }
      - pl: "Rzadko bywam w teatrze."
        ru: "Я редко бываю в театре."
        source: { kind: authored }
  - id: being
    ru: "bywanie — посещение, хождение куда-л."
    examples:
      - pl: "Bywanie na salonach go nużyło."
        ru: "Хождение по салонам его утомляло."
        source: { kind: authored }
      - pl: "Po latach bywania w tym domu znał tam każdy kąt."
        ru: "После лет хождения в этот дом он знал там каждый угол."
        source: { kind: authored }
notes:
  - { kind: usage, text: "ЭТО ТОТ САМЫЙ ЧАСТОТНЫЙ ГЛАГОЛ, о котором говорилось в карточке widywać. Польский строит от обычных глаголов отдельные «повторительные» формы с суффиксом -wa-/-ywa-: być даёт bywać, jeść даёт jadać, spać даёт sypiać, czytać даёт czytywać, widzieć даёт widywać. Все они значат «делать время от времени». Русский здесь скуп: «бывать» есть, а «едать» и «сыпать» в этом смысле почти вымерли, так что чаще нужно наречие — «иногда ем», «временами сплю»." }
  - { kind: false-friend, text: "Редкий случай полного совпадения: bywać и «бывать» — одно слово с одинаковыми значениями, и даже обороты накладываются. Bywa, że… — «бывает, что…»; jak to bywa — «как это бывает»; bywały człowiek — «бывалый человек». Опирайтесь на русский смело." }
  - { kind: government, text: "О месте — предлог w или u с нужным падежом: bywać w teatrze (предложный), bywać u rodziców (родительный), bywać na koncertach (предложный). Безличное bywa, że… ставится без подлежащего, как и русское «бывает, что…»." }
  - { kind: register, text: "Повелительное bywaj в живой речи работает прощанием, примерно как русское «бывай»: немного старомодно и по-свойски. Отсюда и устойчивое bywaj zdrów «будь здоров»." }
collocations:
  - { pl: "bywa, że", ru: "бывает, что" }
  - { pl: "jak to bywa", ru: "как это бывает" }
  - { pl: "bywać u kogoś", ru: "бывать у кого-л." }
family:
  - { pl: "być", ru: "быть", relation: root, id: byc }
  - { pl: "bywały", ru: "бывалый", relation: derived }
  - { pl: "widywać", ru: "видеться время от времени", relation: derived, id: widywac }
etymology: "Частотная форма от być «быть», образованная суффиксом -wa-, который и придаёт значение повторяемости. Русское «бывать» сделано ровно так же и от того же корня, поэтому слова совпадают и по форме, и по смыслу. В том же ряду стоят польские jadać, sypiać, czytywać, widywać."
memory: "bywać — «бывать», полное совпадение с русским, включая обороты: bywa, że… значит «бывает, что…». Это частотный глагол от być, из той же семьи, что jadać, sypiać и widywać: все они о действии, которое повторяется время от времени."
idioms:
  - { pl: "bywaj zdrów", ru: "будь здоров, бывай" }
  - { pl: "jak to bywa", ru: "как это бывает" }
  - { pl: "bywały człowiek", ru: "бывалый человек" }
