notes:
  - { kind: false-friend, text: "РУССКОЕ «ПРЕДЛОЖИТЬ» — ПОМОРФЕМНЫЙ ПЕРЕВОД ЭТОГО ЖЕ СЛОВА. Латинское proponere собрано из pro- «вперёд» и ponere «класть». Русский перевёл обе части: «пред-» плюс «-ложить». Польский взял латинское слово целиком. Так что proponować и «предложить» — одна и та же мысль, выраженная двумя способами, и значение совпадает полностью." }
  - { kind: usage, text: "ДЕСЯТЫЙ ГЛАГОЛ НА -OWAĆ В СЛОВАРЕ: ОСНОВА НАСТОЯЩЕГО НА -UJ-. Инфинитив zaproponować даёт zaproponuję, zaproponujesz, zaproponuje, zaproponują, повелительное zaproponuj — ровно как pracować и świętować. Вид совершенный, поэтому есть деепричастие zaproponowawszy и нет причастия настоящего времени." }
  - { kind: government, text: "Предлагают ЧТО — винительный: zaproponować cenę, pomoc, rozwiązanie. КОМУ — дательный: zaproponował mi pracę. Предложить СДЕЛАТЬ что-то — через żeby с прошедшим временем: zaproponował, żebyśmy poszli. Кандидатуру предлагают с na и винительным: zaproponować kogoś na prezesa." }
  - { kind: pronunciation, text: "Пять слогов, ударение на предпоследнем: za-pro-po-NO-wać. Все o чистые, без редукции в «а»: «запропонова́ць». В формах настоящего времени ударение тоже предпоследнее: zaproponuję — «запропону́е»." }
collocations:
  - { pl: "zaproponować pomoc", ru: "предложить помощь" }
  - { pl: "zaproponować cenę", ru: "предложить цену" }
  - { pl: "zaproponować komuś pracę", ru: "предложить кому-л. работу" }
family:
  - { pl: "proponować", ru: "предлагать", relation: aspect }
  - { pl: "propozycja", ru: "предложение", relation: derived, id: propozycja }
  - { pl: "odmówić", ru: "отказать", relation: antonym, id: odmowic }
etymology: "Из латинского proponere «выставлять вперёд, предлагать» — из pro- «вперёд» и ponere «класть», того же корня, что pozycja, komponent и depozyt. Русское «предложить» — калька этого же слова по частям. Отсюда propozycja, propozycyjny и zaproponowanie."
memory: "zaproponować — «предложить», и это буквально то же слово: латинское pro- плюс ponere, которое русский перевёл как «пред-» плюс «-ложить». Спряжение обычное для -ować: zaproponuję, zaproponujesz. Существительное propozycja «предложение»."
idioms:
  - { pl: "zaproponować komuś pomoc", ru: "предложить кому-л. помощь" }
  - { pl: "nie do odrzucenia", ru: "от которого нельзя отказаться" }
