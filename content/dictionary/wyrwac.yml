notes:
  - { kind: false-friend, text: "СОВПАДАЕТ ПОЧТИ ПОЛНОСТЬЮ — КРОМЕ ОДНОГО. Wyrwać собрано как русское «вырвать»: wy- это вы-, rwać это «рвать». Сходятся и прямой смысл (wyrwać ząb, kartkę, drzewo), и переносный (wyrwać z kontekstu, wyrwać ze snu), и возвратное wyrwać się «вырваться». Но одного русского значения у польского глагола НЕТ: «его вырвало» в смысле тошноты по-польски будет zwymiotować, а грубо — rzygać. Про рвоту wyrwać не говорят никогда." }
  - { kind: pronunciation, text: "КРАЯ ПАРАДИГМЫ ВЕДУТ СЕБЯ ОСОБО, И ЭТО УЖЕ ЗНАКОМО. В первом лице единственного и в третьем множественного основа кончается твёрдым w: wyrwę, wyrwą. Во всех клетках между ними появляется мягкое wi: wyrwiesz, wyrwie, wyrwiemy, wyrwiecie. То же устройство, что у piekę и pieką против pieczesz: края таблицы ведут себя одинаково и отличаются от середины." }
  - { kind: government, text: "Вырывают ЧТО — винительный: wyrwać ząb, kartkę, chwast. У КОГО — дательный: wyrwać komuś coś z rąk. ОТКУДА — z с родительным: wyrwać z notesu, z kontekstu, ze snu. Все три модели совпадают с русскими. Возвратное wyrwać się идёт либо с z (wyrwać się z miasta), либо вовсе без дополнения: wyrwę się na godzinę." }
  - { kind: usage, text: "Вид совершенный, несовершенная пара — wyrywać. Существительное wyrwa значит «пробоина, брешь» и работает как русская «брешь» в обоих смыслах: wyrwa w murze и wyrwa w budżecie. Деепричастие wyrwawszy возможно только у совершенного вида." }
collocations:
