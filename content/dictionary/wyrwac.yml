  - { pl: "wyrywać", ru: "вырывать", relation: aspect }
  - { pl: "wyrwa", ru: "пробоина, брешь", relation: derived }
  - { pl: "zerwać", ru: "сорвать", relation: derived, id: zerwac }
etymology: "Приставка wy- плюс rwać «рвать», от общеславянского корня. Русское «вырвать» собрано из тех же двух частей, и совпадение здесь полное, вплоть до переносных употреблений. От того же гнезда rwać się «рваться», zerwać «сорвать», przerwać «прервать», urwać «оторвать» и существительное wyrwa «пробоина»."
memory: "wyrwać — «вырвать», слово в слово: wy- плюс rwać. Исключение ровно одно: про тошноту так не говорят, там zwymiotować. И посмотрите на края таблицы — wyrwę и wyrwą с твёрдым w, но wyrwiesz и wyrwie с мягким wi."
idioms:
