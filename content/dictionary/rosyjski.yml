# review
id: rosyjski
format: 2
lemma: "rosyjski"
rank: 2518
pos: adj
pron: { cyr: "росы́йски" }
senses:
  - id: russian-adj
    ru: "русский, российский"
    examples:
      - pl: "Tom zna rosyjski."
        ru: "Том знает русский."
        source: { kind: tatoeba, id: 12696711 }
      - pl: "Tom znał rosyjski lepiej niż angielski."
        ru: "Том русский знал лучше, чем английский."
        source: { kind: tatoeba, id: 10768443 }
      - pl: "Mówił po esperancku z silnym rosyjskim akcentem."
        ru: "Он говорил на эсперанто с сильным русским акцентом."
        source: { kind: tatoeba, id: 836976 }
  - id: russian-lang
    ru: "русский язык"
    examples:
      - pl: "Mam samouczek języka rosyjskiego."
        ru: "У меня самоучитель русского языка."
        source: { kind: tatoeba, id: 2122433 }
      - pl: "W języku rosyjskim istnieją słowa z dwoma poprawnymi wariantami akcentowania."
        ru: "В русском языке есть слова с двумя правильными вариантами постановки ударения."
        source: { kind: tatoeba, id: 13784834 }
notes:
  - { kind: usage, text: "Как и polski, само по себе rosyjski часто значит «русский язык»: uczyć się rosyjskiego. «По-русски» — po rosyjsku." }
  - { kind: government, text: "Польский не различает «русский» и «российский» — оба будут rosyjski. Различие приходится передавать описательно." }
  - { kind: false-friend, text: "Пишется с маленькой буквы, в отличие от страны Rosja. Житель — Rosjanin, и вот он уже с большой." }
  - { kind: usage, text: "Мужской ЛИЧНЫЙ род во мн. ч.: rosyjscy żołnierze «русские солдаты», но rosyjskie filmy «русские фильмы»." }
collocations:
  - { pl: "po rosyjsku", ru: "по-русски" }
  - { pl: "język rosyjski", ru: "русский язык" }
etymology: "От Rosja «Россия»; прилагательное пишется с маленькой буквы."
memory: "rosyjski — и «русский», и «российский»: польский их не различает. Само по себе часто значит «русский язык». По-русски — po rosyjsku."
idioms:
