etymology: "Из сицилийского MAFIA, слова, происхождение которого спорно до сих пор: его связывают и с арабским MAHYAS «бахвальство», и с сицилийским прилагательным MAFIUSU «дерзкий, бравый», которое первоначально было похвалой. В общее употребление слово вошло в тысяча восемьсот шестидесятых годах после пьесы о палермской тюрьме, и оттуда разошлось по всей Европе. Оба языка взяли его через итальянский и в одно время, поэтому совпадение полное, вплоть до ударения. Польский лишь подчинил слово своему склонению на -IA, по образцу ARMIA и LINIA, и получил вместе с ним архаичный родительный множественного MAFIJ."
memory: "Значение и ударение совпадают с русской «мафией», включая переносное: mafia urzędnicza это «чиновничья мафия». Из сицилийского, где слово было скорее похвалой — дерзкий, бравый. Запоминать нужно склонение: основа на -ia, форма mafii делает четыре падежа, а рядом живёт архаичное mafij, как amunicyj и egzekucyj. Читается в два слога: fia это «фья», буква i только смягчает f."
