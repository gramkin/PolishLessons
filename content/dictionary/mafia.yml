notes:
  - { kind: false-friend, text: "Значение совпадает с русской «мафией», и переносное употребление тоже: по-польски MAFIA URZĘDNICZA или MAFIA MIESZKANIOWA означают сплочённую группу, действующую сообща и не по закону, точно как русское «чиновничья мафия». Запомнить стоит не смысл, а склонение: слово на -IA, и форма MAFII покрывает сразу четыре клетки, а рядом с ней живёт старый родительный множественного MAFIJ. Ударение в польском на первом слоге, «ма́фья», тогда как русское «мафия» ударяется на «а» первого слога тоже — здесь языки совпадают, и это редкость среди заимствований." }
  - { kind: usage, text: "Десять форм, женский род, основа на -IA. Форма MAFII несёт родительный, дательный и местный единственного и служит обычным родительным множественного. Рядом стоит архаичная форма MAFIJ, с нулевым окончанием: она принадлежит книжному слою, как AMUNICYJ, EGZEKUCYJ и LOKALIZACYJ, и в современном тексте выглядит нарочито. Именительный и винительный множественного — MAFIE. Множественное число употребляется, когда речь о нескольких организациях: MAFIE WŁOSKIE, MAFIE NARKOTYKOWE." }
  - { kind: pronunciation, text: "Читается «ма́фья», два слога, ударение на первом. Буквосочетание FIA даёт «фья» в один слог: буква I здесь знак мягкости, а не гласная, и потому слово короче русского «мафия» на слог. В форме MAFII слышно «ма́фьи». В форме MAFIĄ последнее Ą звучит «он»: «ма́фьон». В форме MAFIĘ конечное Ę даёт чистое «э». В форме MAFIJ буква J на конце произносится как «й»: «ма́фий»." }
  - { kind: register, text: "Слово нейтральное в газетном языке и сильное в разговоре. Устойчивые сочетания: MAFIA NARKOTYKOWA, MAFIA PALIWOWA «топливная мафия», SZEF MAFII, POWIĄZANIA Z MAFIĄ «связи с мафией». Переносное употребление очень частое и всегда обвиняющее: назвать группу MAFIA значит сказать, что она действует сообща и вне закона. Прилагательное MAFIJNY относится к устройству: UKŁAD MAFIJNY «мафиозная структура». Слово MAFIOSO в польском тоже есть и означает члена мафии." }
