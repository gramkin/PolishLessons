# review
id: zakres
format: 2
lemma: "zakres"
rank: 6003
pos: noun
pron: { cyr: "за́крэс" }
senses:
  - id: scope
    ru: "объём, круг, сфера, рамки"
    examples:
      - pl: "Poszerzył zakres swych badań."
        ru: "Он расширил круг своих исследований."
        source: { kind: translated, id: 368881 }
      - pl: "Jest autorytetem w zakresie prawa karnego."
        ru: "Он авторитет в области уголовного права."
        source: { kind: translated, id: 2680589 }
      - pl: "To wykracza poza zakres ludzkiej wiedzy."
        ru: "Это выходит за пределы человеческого знания."
        source: { kind: translated, id: 3586651 }
  - id: range
    ru: "диапазон (значений, частот)"
    examples:
      - pl: "Ten mikrofon ma szeroki zakres częstotliwości."
        ru: "У этого микрофона широкий диапазон частот."
        source: { kind: authored }
      - pl: "Temperatura mieści się w zakresie od zera do dziesięciu stopni."
        ru: "Температура держится в диапазоне от нуля до десяти градусов."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ZAKRES не связан с «закрыть» (это ZAMKNĄĆ). Корень — KRES «предел»: ZAKRES — то, что лежит внутри пределов, то есть объём, круг, диапазон." }
  - { kind: government, text: "W ZAKRESIE + родительный — «в области, по части»: W ZAKRESIE INFORMATYKI «по информатике». POZA ZAKRESEM — «за рамками», WYKRACZAĆ POZA ZAKRES — «выходить за пределы»." }
  - { kind: usage, text: "Мужской род, родительный на -U: ZAKRESU. Типичные сочетания: ZAKRES OBOWIĄZKÓW «круг обязанностей», SZEROKI ZAKRES «широкий спектр»." }
collocations:
  - { pl: "w zakresie czegoś", ru: "в области чего-либо" }
  - { pl: "zakres obowiązków", ru: "круг обязанностей" }
  - { pl: "szeroki zakres", ru: "широкий спектр" }
  - { pl: "poza zakresem", ru: "за рамками" }
family:
  - { pl: "kres", ru: "предел, конец", relation: root, id: kres }
  - { pl: "zakresowy", ru: "относящийся к объёму, диапазону", relation: derived }
synonyms: ["obszar", "zasięg", "dziedzina"]
etymology: "Образовано от KRES «предел, граница» с приставкой ZA-: то, что очерчено границами."
memory: "Kres — предел; za-kres — всё, что внутри пределов: объём, круг, диапазон. W zakresie prawa — в области права."
idioms:
