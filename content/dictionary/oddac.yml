# review
id: oddac
format: 2
lemma: "oddać"
rank: 407
pos: verb
aspect: perf
pron: { cyr: "о́ддаць" }
senses:
  - id: give-back
    ru: "отдать, вернуть"
    examples:
      - pl: "Oddaj mi telefon."
        ru: "Отдай мне телефон."
        source: { kind: tatoeba, id: 6320990 }
      - pl: "Oddaj jej ten list, kiedy przyjdzie."
        ru: "Отдай ей это письмо, когда она придет."
        source: { kind: tatoeba, id: 3660856 }
      - pl: "Proszę oddać arkusze."
        ru: "Сдайте, пожалуйста, листы."
        source: { kind: translated, id: 2516497 }
  - id: hand-over
    ru: "сдать, передать"
    examples:
      - pl: "Oddał krew, by ratować swoją siostrę."
        ru: "Он сдал кровь, чтобы спасти свою сестру."
        source: { kind: tatoeba, id: 2607544 }
      - pl: "Jej piękna nie dało się oddać słowami."
        ru: "Её красоту было невозможно передать словами."
        source: { kind: tatoeba, id: 4101497 }
      - pl: "Oddałem jej słownik."
        ru: "Я отдал ей словарь."
        source: { kind: translated, id: 1409679 }
notes:
  - { kind: false-friend, text: "Форма oddali чаще всего вообще не глагол, а родительный падеж существительного oddal «даль»: Widziałem domy z oddali «Я видел дома издали»." }
  - { kind: usage, text: "Круг значений широкий: oddać książkę «вернуть книгу», oddać pracę domową «сдать домашнее задание», oddać krew «сдать кровь», oddać głos «отдать голос»." }
  - { kind: usage, text: "Причастие oddany живёт и как самостоятельное прилагательное «преданный»: On jest oddanym przyjacielem «Он преданный друг»." }
  - { kind: usage, text: "oddać słowami — «передать словами»: Jej piękna nie dało się oddać słowami." }
collocations:
  - { pl: "oddać książkę", ru: "вернуть книгу" }
  - { pl: "oddać krew", ru: "сдать кровь" }
  - { pl: "oddać głos", ru: "отдать голос" }
  - { pl: "oddany przyjaciel", ru: "преданный друг" }
etymology: "Из od- + dać «дать»; русское «отдать» собрано ровно из тех же двух частей."
memory: "oddać — «отдать, вернуть», слово буква в букву русское: od- + dać. Но берегитесь формы oddali: чаще всего это не глагол, а «издали» — z oddali. А oddany живёт отдельной жизнью и значит «преданный»."
idioms:
  - { pl: "oddać duszę Bogu", ru: "отдать Богу душу" }
  - { pl: "oddać honory", ru: "отдать почести" }
  - { pl: "oddać głos", ru: "отдать голос" }
