notes:
  - { kind: government, text: "Женский род на -ŚĆ, и это самый экономный тип склонения в польском: из одиннадцати возможных форм остаётся шесть, потому что форма POSIADŁOŚCI покрывает сразу пять — родительный, дательный и местный единственного, а также именительный, винительный и родительный множественного. Запоминать стоит не список, а это свойство: у всех существительных на -OŚĆ склонение одинаковое. Винительный единственного равен именительному: KUPIŁ POSIADŁOŚĆ. Творительный единственного POSIADŁOŚCIĄ, дательный множественного POSIADŁOŚCIOM, творительный множественного POSIADŁOŚCIAMI, местный множественного POSIADŁOŚCIACH." }
  - { kind: usage, text: "Суффикс -OŚĆ отвечает русскому -ОСТЬ один в один, и это даёт готовый ключ к сотням слов: WOLNOŚĆ и «вольность», RADOŚĆ и «радость», MOŻLIWOŚĆ и «возможность», WŁASNOŚĆ и «собственность». Все они женского рода и склоняются как POSIADŁOŚĆ. Само слово книжное и чаще встречается в текстах об истории, праве и недвижимости: POSIADŁOŚĆ ZIEMSKA «земельное владение», POSIADŁOŚCI KOLONIALNE «колониальные владения». В обиходном разговоре о доме с участком скажут скорее DZIAŁKA или NIERUCHOMOŚĆ." }
  - { kind: pronunciation, text: "Читается «пося́дуосьць», ударение на предпоследнем слоге из трёх. Буква Ł даёт «у», а не «л», и это главное место ошибки: не «посядлость». Сочетание SIA читается «ся» с мягким сь. Конечное -ŚĆ это два мягких согласных подряд, «сьць», и произносится одним движением, без гласной между ними. В формах на -ŚCI смягчение сохраняется: POSIADŁOŚCI «посядуосьци». Слово длинное, но читается по общим правилам без исключений." }
  - { kind: false-friend, text: "Слово прозрачно по частям, но собрано иначе, чем русское. Русское «владение» идёт от «власти», то есть от господства; польское POSIADŁOŚĆ идёт от POSIADAĆ «обладать», а POSIADAĆ собрано из PO- и SIADAĆ «садиться». Для поляка обладать значит буквально «усесться на чём-то», и образ этот не случаен: латинское POSSIDERE устроено точно так же, из POTIS «способный» и SEDERE «сидеть». Два языка независимо выразили владение через сидение, а русский выбрал власть. Поэтому POSIADAĆ стоит запоминать не через «владеть», а через «обладать», где и в русском есть похожая сборка из приставки и корня." }
