etymology: "От POSIADAĆ «обладать», которое собрано из приставки PO- и глагола SIADAĆ «садиться», плюс суффикс -OŚĆ, отвечающий русскому -ОСТЬ. Буквально это «усаженность», свойство того, кто уселся на чём-то и тем закрепил за собой. Образ не польская причуда: латинское POSSIDERE «владеть», откуда английское POSSESS, устроено из POTIS «способный» и SEDERE «сидеть», то есть «сидеть хозяином». Русский для этого понятия взял другой образ, властный: «владеть», «владение», от той же основы, что «власть». Так три языка выразили одно через разное, и польский с латынью случайно совпали в выборе сидения."
memory: "Владение, поместье; от posiadać «обладать», а то — из po- и siadać «садиться»: обладать значит «усесться на чём-то», ровно как латинское possidere из potis и sedere. Склонение самое экономное: шесть форм, потому что posiadłości покрывает пять падежей сразу. Суффикс -ość отвечает русскому -ость точно: wolność, radość, możliwość, własność — все женского рода и склоняются так же. Ł читается «у»: «посядуосьць»."
