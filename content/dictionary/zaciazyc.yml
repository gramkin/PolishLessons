senses:
  - id: weigh-on
    ru: "тяжело сказаться, лечь бременем (на ком-то, на чём-то)"
    examples:
      - pl: "Ten błąd zaciążył na całej jego karierze."
        ru: "Эта ошибка тяжело сказалась на всей его карьере."
        source: { kind: authored }
      - pl: "Wojna zaciążyła na losach całego pokolenia."
        ru: "Война наложила отпечаток на судьбы целого поколения."
        source: { kind: authored }
      - pl: "Nowe długi zaciążą na budżecie miasta."
        ru: "Новые долги лягут бременем на бюджет города."
        source: { kind: authored }
  - id: hang-over
    ru: "нависнуть (над кем-то, над чем-то)"
    examples:
      - pl: "Nad rodziną zaciążyło fatum."
        ru: "Над семьёй навис злой рок."
        source: { kind: authored }
      - pl: "Nad miastem zaciążyła groźba powodzi."
        ru: "Над городом нависла угроза наводнения."
        source: { kind: authored }
  - id: grow-heavy
    ru: "отяжелеть, стать тяжёлым (кому-то)"
    examples:
      - pl: "Po godzinie marszu plecak zaciążył mi okropnie."
        ru: "Через час ходьбы рюкзак ужасно отяготил мне плечи."
        source: { kind: authored }
      - pl: "Powieki mu zaciążyły i zasnął przy stole."
        ru: "Веки у него отяжелели, и он заснул за столом."
        source: { kind: authored }
notes:
  - { kind: government, text: "Лечь бременем на кого-что — NA с предложным падежом: ZACIĄŻYĆ NA LOSIE, NA KARIERZE. Нависнуть — NAD с творительным: ZACIĄŻYĆ NAD RODZINĄ. Отяжелеть кому — дательный: POWIEKI MU ZACIĄŻYŁY." }
  - { kind: usage, text: "Подлежащее у ZACIĄŻYĆ — ошибка, решение, долг, прошлое, груз или веки, но не человек. Поэтому живут только формы третьего лица немужского рода: ZACIĄŻY, ZACIĄŻĄ, ZACIĄŻYŁ, ZACIĄŻYŁA, ZACIĄŻYŁO, ZACIĄŻYŁY. Форм первого и второго лица, мужско-личных форм и повелительного наклонения у глагола нет." }
  - { kind: false-friend, text: "Не путать с ZAJŚĆ W CIĄŻĘ «забеременеть»: корень CIĄŻ- в ZACIĄŻYĆ — это «тяжесть» (CIĘŻAR, CIĘŻKI), а не CIĄŻA «беременность». ZACIĄŻYĆ значит только «лечь тяжестью, отяжелеть»." }
  - { kind: usage, text: "Совершенный вид от CIĄŻYĆ «тяготить»: CIĄŻY MI TA SPRAWA «меня тяготит это дело», а ZACIĄŻYŁA NA MNIE TA SPRAWA «это дело легло на меня тяжестью». Слово книжное, частое в публицистике." }
collocations:
  - { pl: "zaciążyć na losie", ru: "сказаться на судьбе" }
