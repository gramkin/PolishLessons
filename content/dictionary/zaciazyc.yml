etymology: "Приставка ZA- плюс CIĄŻYĆ «тяготить», от CIĘŻAR «тяжесть», CIĘŻKI «тяжёлый»; ср. русское «тяжесть», «отяготить»."
memory: "Zaciążyć — «затяжелить»: błąd zaciążył na karierze, ошибка повисла на карьере тяжёлой гирей."
