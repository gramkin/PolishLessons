# review
id: porzadny
format: 2
lemma: "porządny"
rank: 2203
pos: adj
pron: { cyr: "пожо́ндны" }
senses:
  - id: decent-person
    ru: "порядочный, честный (о человеке)"
    examples:
      - pl: "Jesteś porządny."
        ru: "Ты порядочный."
        source: { kind: translated, id: 5665308 }
      - pl: "Wygląda na porządnego faceta."
        ru: "Он выглядит порядочным человеком."
        source: { kind: translated, id: 6316971 }
      - pl: "On może okazać się porządnym człowiekiem."
        ru: "Он может оказаться порядочным человеком."
        source: { kind: translated, id: 643815 }
  - id: proper-thing
    ru: "приличный, добротный (о вещи)"
    examples:
      - pl: "Czy masz porządny garnitur?"
        ru: "У тебя есть приличный костюм?"
        source: { kind: translated, id: 12188861 }
      - pl: "Tom był nie do poznania: był gładko ogolony, miał porządną fryzurę, nosił garnitur szyty na miarę i polerowane buty, nie śmierdział potem, a za to pachniał i zachowywał się bardzo dżentelmeńsko, zwłaszcza wobec Mary."
        ru: "Тома было не узнать: гладко выбрит, в приличном костюме."
        source: { kind: translated, id: 10483258 }
notes:
  - { kind: usage, text: "Два круга значений, и они разошлись: о человеке — «порядочный, честный», о вещи — «приличный, добротный». Porządny garnitur это хороший костюм, а не нравственный." }
  - { kind: false-friend, text: "Русское «порядочный» покрывает оба смысла, так что здесь языки совпадают, в отличие от наречия: porządnie значит «как следует», а не «порядочно» в нравственном смысле." }
  - { kind: government, text: "Обычное прилагательное; наречие — porządnie, у которого своя карточка." }
  - { kind: usage, text: "Корень porządek «порядок», тоже отдельная карточка." }
collocations:
  - { pl: "porządny człowiek", ru: "порядочный человек" }
  - { pl: "porządny garnitur", ru: "приличный костюм" }
etymology: "От porządek «порядок»; ср. русское «порядок», «порядочный»."
memory: "porządny — «порядочный» о человеке и «приличный, добротный» о вещи. Наречие porządnie при этом значит «как следует», а не «порядочно»."
idioms:
