# review
id: wewnetrzny
format: 2
lemma: "wewnętrzny"
rank: 1895
pos: adj
pron: { cyr: "вэвнэ́нтшны" }
senses:
  - id: inner
    ru: "внутренний (находящийся внутри)"
    examples:
      - pl: "Ukradziono mi portfel z wewnętrznej kieszeni."
        ru: "У меня украли кошелёк из внутреннего кармана."
        source: { kind: translated, id: 404478 }
      - pl: "Obawiam się, że mam wewnętrzne krwawienie."
        ru: "Боюсь, у меня внутреннее кровотечение."
        source: { kind: translated, id: 8534024 }
      - pl: "Drzwi mają wewnętrzny zamek."
        ru: "У двери внутренний замок."
        source: { kind: authored }
  - id: domestic
    ru: "внутренний (о делах страны, организации)"
    examples:
      - pl: "Żadne państwo nie powinno mieszać się w sprawy wewnętrzne innego państwa."
        ru: "Ни одно государство не должно вмешиваться во внутренние дела другого государства."
        source: { kind: tatoeba, id: 691330 }
      - pl: "Obecnie polityka zagraniczna i wewnętrzna są ze sobą ściśle powiązane."
        ru: "Сейчас внешняя и внутренняя политика тесно связаны между собой."
        source: { kind: translated, id: 983058 }
  - id: psychological
    ru: "внутренний (о душевном состоянии)"
    examples:
      - pl: "Poinformowałem ją o moim konflikcie wewnętrznym."
        ru: "Я сообщил ей о моём внутреннем конфликте."
        source: { kind: translated, id: 2895020 }
      - pl: "Czuję wewnętrzną pustkę."
        ru: "Я чувствую внутреннюю пустоту."
        source: { kind: translated, id: 8534027 }
notes:
  - { kind: usage, text: "wewnętrzny совпадает с русским «внутренний» во всех трёх употреблениях: пространственном (wewnętrzna kieszeń), государственном (sprawy wewnętrzne) и душевном (konflikt wewnętrzny)." }
  - { kind: usage, text: "Держите пару: wewnętrzny — zewnętrzny «внешний», ровно как русскую «внутренний — внешний»." }
  - { kind: usage, text: "Синтетические степени сравнения (wewnętrzniejszy) книжные и почти не встречаются: говорят bardziej wewnętrzny, najbardziej wewnętrzny — как в обороте najbardziej wewnętrzna planeta «самая внутренняя планета»." }
  - { kind: usage, text: "Гнездо: wnętrze «нутро, интерьер», wewnątrz «внутри», wewnętrznie «внутренне». Основа та же, что в русском «внутрь», «нутро»." }
collocations:
  - { pl: "sprawy wewnętrzne", ru: "внутренние дела" }
  - { pl: "wewnętrzna kieszeń", ru: "внутренний карман" }
  - { pl: "konflikt wewnętrzny", ru: "внутренний конфликт" }
  - { pl: "organy wewnętrzne", ru: "внутренние органы" }
family:
  - { pl: "wnętrze", ru: "нутро, интерьер", relation: derived }
  - { pl: "wewnątrz", ru: "внутри", relation: derived }
  - { pl: "zewnętrzny", ru: "внешний", relation: derived }
etymology: "От wewnątrz «внутри», в основе праславянское *vъn-ǫtrь — та же основа, что в русских «внутрь» и «нутро». Пара с zewnętrzny «внешний» устроена как русская «внутренний — внешний»."
memory: "wewnętrzny — «внутренний», и все три русских употребления совпадают: wewnętrzna kieszeń «внутренний карман», sprawy wewnętrzne «внутренние дела», konflikt wewnętrzny «внутренний конфликт». Держите пару wewnętrzny — zewnętrzny «внешний». В основе wnętrze «нутро» и wewnątrz «внутри» — та же основа, что в русском «внутрь». Синтетические степени сравнения почти не употребляются: говорят bardziej wewnętrzny."
idioms:
  - { pl: "sprawy wewnętrzne", ru: "внутренние дела" }
  - { pl: "głos wewnętrzny", ru: "внутренний голос" }
  - { pl: "od wewnątrz", ru: "изнутри" }
