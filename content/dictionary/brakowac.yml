# review
id: brakowac
format: 2
lemma: "brakować"
rank: 832
pos: verb
aspect: imperf
pron: { cyr: "брако́ваць" }
senses:
  - id: lacking
    ru: "brakuje czegoś — не хватает чего-л. (родительный)"
    note: "Глагол безличный: подлежащего нет, форма всегда 3-го лица единственного числа."
    examples:
      - pl: "Dwóch brakuje."
        ru: "Двух не хватает."
        source: { kind: tatoeba, id: 13084370 }
      - pl: "Brakuje serwetki."
        ru: "Не хватает салфетки."
        source: { kind: tatoeba, id: 6305686 }
      - pl: "Tego brakowało."
        ru: "Этого не хватало."
        source: { kind: translated, id: 5223389 }
  - id: miss
    ru: "brakuje mi kogoś — скучать по кому-л."
    examples:
      - pl: "Będzie mi brakować Mołdawii."
        ru: "Буду скучать по Молдове."
        source: { kind: tatoeba, id: 3296282 }
      - pl: "Kiedy wyjedziecie, nam wszystkim będzie was brakować."
        ru: "Нам всем будет вас не хватать, когда вы уедете."
        source: { kind: tatoeba, id: 1728735 }
      - pl: "Brakowało mi tego."
        ru: "Мне этого не хватало."
        source: { kind: tatoeba, id: 6327920 }
  - id: missing
    ru: "brakujący — недостающий, отсутствующий"
    examples:
      - pl: "Brakujący element znalazł się w szufladzie."
        ru: "Недостающая деталь нашлась в ящике."
        source: { kind: authored }
      - pl: "Uzupełnij brakujące słowa."
        ru: "Дополни недостающие слова."
        source: { kind: authored }
      - pl: "Znaleźli brakującą część."
        ru: "Они нашли недостающую часть."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Будущее время у этого глагола есть только в одной форме — безличной będzie brakować: Będzie brakować czasu «Будет не хватать времени». О человеке говорят через средний род: będzie nam jej brakowało «нам её будет не хватать». Форм będę brakować, będziesz brakował или będą brakować не существует: у безличного глагола нет ни 1-го и 2-го лица, ни множественного числа, ни мужского и женского рода." }
  - { kind: government, text: "Конструкция безличная: brakuje + родительный падеж, а тот, кому не хватает, стоит в дательном. Brakuje mi czasu «Мне не хватает времени». Русский строит фразу точно так же." }
  - { kind: usage, text: "Личных форм у глагола нет: нельзя сказать «я не хватаю». Всегда 3-е лицо единственного числа: brakuje, brakowało, będzie brakować." }
  - { kind: usage, text: "Będzie mi ciebie brakować — «Я буду по тебе скучать». Очень частый оборот, и заменить его глаголом «скучать» нельзя: tęsknić требует другой конструкции." }
  - { kind: false-friend, text: "Существительное brak значит «нехватка, отсутствие», а не «брак» в смысле супружества (это małżeństwo). С русским «браком» как дефектом слово всё же в родстве: оба из немецкого." }
collocations:
  - { pl: "brakuje mi czasu", ru: "мне не хватает времени" }
  - { pl: "będzie mi brakować", ru: "я буду скучать" }
  - { pl: "brakujący element", ru: "недостающий элемент" }
  - { pl: "brak", ru: "нехватка, отсутствие" }
family:
  - { pl: "brak", ru: "нехватка, отсутствие", relation: root }
  - { pl: "zabraknąć", ru: "не хватить", relation: aspect }
  - { pl: "brakujący", ru: "недостающий", relation: derived }
etymology: "От brak «нехватка», а то — из немецкого Brack «отбросы, негодное». Русское «брак» (дефект) — то же заимствование, только значение разошлось."
memory: "brakować — «не хватать», и глагол безличный: подлежащего у него нет, только 3-е лицо единственного числа. Brakuje mi czasu «Мне не хватает времени» — родительный на то, чего не хватает, дательный на того, кому. И запомните Będzie mi ciebie brakować «Я буду по тебе скучать»."
idioms:
  - { pl: "brakuje mi czasu", ru: "мне не хватает времени" }
  - { pl: "będzie mi ciebie brakować", ru: "я буду по тебе скучать" }
  - { pl: "brakujące ogniwo", ru: "недостающее звено" }
