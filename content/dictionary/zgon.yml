etymology: "Слово принадлежит к деловому языку и живёт в паре с глаголом UMRZEĆ «умереть», которым описывают то же событие в обычной речи. Русский для документов не заводил отдельного слова и пишет «смерть», оставив «кончину» высокому стилю, так что польская пара zgon и śmierć разделена резче, чем русская «смерть» и «кончина». Переводить zgon лучше по месту: в бумаге — «смерть», в сочувственной фразе — «кончина»."
memory: "Слово из документов: akt zgonu, przyczyna zgonu. В разговоре — śmierć. И помните пару ogon/ogona против zgon/zgonu — родительные разные."
idioms:
  - { pl: "akt zgonu", ru: "свидетельство о смерти" }
  - { pl: "stwierdzić zgon", ru: "констатировать смерть" }
