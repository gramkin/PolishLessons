notes:
  - { kind: register, text: "Слово официальное и держится своей сферы: ZGON пишут в документах, говорят врачи и юристы — AKT ZGONU «свидетельство о смерти», DATA ZGONU, PRZYCZYNA ZGONU, STWIERDZIĆ ZGON. В обычной речи о смерти говорят ŚMIERĆ, и подменять одно другим нельзя: zgon в разговоре о близком человеке звучит бездушно, как протокол. Русский в бумагах обходится той же «смертью», а для высокого или мягкого тона берёт «кончину», так что ближайшее соответствие по окраске — именно «кончина»." }
  - { kind: usage, text: "Слово даёт идеальную пару к OGON из партии 230: оба мужские неодушевлённые, оба кончаются на -on, различаются одной первой буквой, а родительный у них разный — OGONA с окончанием -a против ZGONU с окончанием -u. Лучшего доказательства, что выбор между -a и -u не вычисляется из вида слова, не придумать: вычислять нечего, надо знать. Местный падеж при этом у обоих одинаковый — OGONIE и ZGONIE, с переходом n в ń перед окончанием -e." }
  - { kind: usage, text: "Множественное число употребляется по-деловому и означает отдельные случаи: ZGONY — это смерти по счёту, как в статистике, LICZBA ZGONÓW «число смертей», REJESTR ZGONÓW «реестр смертей». Русский так тоже умеет, но в обиходе предпочитает единственное или описательный оборот «случаи смерти», поэтому польское zgony в переводе часто разворачивается в несколько слов." }
