        ru: "Каждый виток катушки нужно посчитать."
        source: { kind: authored }
  - id: ganglion
    ru: "нервный узел, ганглий; разг. ZWOJE MÓZGOWE — «извилины»"
    examples:
      - pl: "Lekarz mówił o zwoju nerwowym."
        ru: "Врач говорил о нервном узле."
        source: { kind: authored }
      - pl: "Rusz trochę zwojami, to zrozumiesz."
        ru: "Пошевели немного извилинами, и поймёшь."
        source: { kind: authored }
notes:
  - { kind: usage, text: "ZWÓJ — всё, что свёрнуто или намотано: моток проволоки, рулон ткани, бухта каната, свиток. Отдельный оборот спирали — тоже ZWÓJ, по-русски «виток». Русского «звой» нет, ближе всего «свиток» и «вить»: корень тот же." }
  - { kind: government, text: "Мужской род, неодушевлённое. Ó только в закрытом слоге: ZWÓJ, но ZWOJU, ZWOJEM, ZWOJE — как ROZWÓJ, ROZWOJU. Родительный и местный ед. ч. совпадают: ZWOJU." }
  - { kind: usage, text: "Родительный мн. ч. двоякий: ZWOJÓW и ZWOI. ZWOJÓW обычнее (DZIESIĘĆ ZWOJÓW), ZWOI звучит книжно, но тоже правильно." }
  - { kind: usage, text: "В анатомии ZWÓJ NERWOWY — нервный узел, ганглий. ZWOJE MÓZGOWE — разговорное «извилины»; научный термин для извилин — ZAKRĘTY MÓZGU." }
  - { kind: pronunciation, text: "Читается «звуй», один слог: Ó = «у», J — краткое «й». W после Z звонкое, не оглушается." }
collocations:
  - { pl: "zwój drutu", ru: "моток проволоки" }
  - { pl: "zwój liny", ru: "бухта каната, моток верёвки" }
  - { pl: "zwój papirusu", ru: "папирусный свиток" }
  - { pl: "zwój nerwowy", ru: "нервный узел" }
family:
  - { pl: "zwinąć", ru: "свернуть, смотать", relation: root }
  - { pl: "zwijać", ru: "сворачивать, сматывать", relation: root }
  - { pl: "zwitek", ru: "свёрточек, скатанный комок", relation: root }
  - { pl: "rozwój", ru: "развитие", relation: root, id: rozwoj }
  - { pl: "zwojowy", ru: "относящийся к витку или ганглию", relation: derived }
etymology: "Праславянское *sъvojь «то, что свито», от *sъviti «свить, скрутить» — корень польского WIĆ и русского «вить». Тот же корень с той же Ó в ROZWÓJ «развитие» и POWÓJ «вьюнок»."
memory: "ZWÓJ — то, что ZWINIĘTE, свито: «свиток» и «виток» в одном слове. Ó в закрытом слоге, как в ROZWÓJ: zwój, но zwoje."
idioms:
  - { pl: "zwoje mózgowe", ru: "извилины (шутл.: ум, соображение)" }
  - { pl: "Zwoje znad Morza Martwego", ru: "Кумранские рукописи, свитки Мёртвого моря" }
formExamplesSkip:
