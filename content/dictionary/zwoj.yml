  - id: scroll
    ru: "свиток"
    examples:
      - pl: "Kapłan czytał ze starego zwoju."
        ru: "Жрец читал по старому свитку."
        source: { kind: authored }
      - pl: "W jaskini znaleziono zwoje pergaminu."
        ru: "В пещере нашли пергаментные свитки."
