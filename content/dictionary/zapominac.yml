# review
id: zapominac
format: 2
lemma: "zapominać"
rank: 1685
pos: verb
aspect: imperf
aspectPair: zapomniec
pron: { cyr: "запоми́наць" }
senses:
  - id: forget
    ru: "забывать, переставать помнить"
    examples:
      - pl: "Ojciec zawsze wszystkiego zapomina."
        ru: "Отец всегда всё забывает."
        source: { kind: tatoeba, id: 695771 }
      - pl: "Słoń nigdy nie zapomina."
        ru: "Слон никогда не забывает."
        source: { kind: translated, id: 10460354 }
      - pl: "Nigdy nie zapominaj, kim jesteś."
        ru: "Никогда не забывай, кто ты!"
        source: { kind: tatoeba, id: 4716838 }
  - id: leave-behind
    ru: "забывать, оставлять (вещь где-либо)"
    examples:
      - pl: "Ona często zapomina parasola."
        ru: "Она часто забывает зонт."
        source: { kind: translated, id: 363060 }
      - pl: "Rzadko zapominam kluczy."
        ru: "Я редко забываю ключи."
        source: { kind: translated, id: 3296934 }
      - pl: "Nie zapominaj swoich rzeczy."
        ru: "Не забывай свои вещи."
        source: { kind: translated, id: 840225 }
notes:
  - { kind: usage, text: "Пара по виду: zapominać (несовершенный) — zapomnieć (совершенный). Nie zapominaj! — «Не забывай!», Nie zapomnij! — «Не забудь!»" }
  - { kind: government, text: "Забыть о чём-то — zapominać o czymś (предложный падеж): nie zapominaj o nas. Забыть вещь — zapominać coś (винительный): zapomina parasola. При отрицании родительный: rzadko zapominam kluczy." }
  - { kind: false-friend, text: "«Забыть сделать» строится без предлога: zawsze zapominam oddychać «я всегда забываю дышать», а не zapominam o oddychaniu." }
  - { kind: usage, text: "Возвратное zapominać się значит «забываться, терять меру», а не «быть забытым»." }
collocations:
  - { pl: "zapominać o czymś", ru: "забывать о чём-либо" }
  - { pl: "nie zapominaj", ru: "не забывай" }
  - { pl: "zapominać imiona", ru: "забывать имена" }
family:
  - { pl: "zapomnieć", ru: "забыть", relation: aspect, id: zapomniec }
  - { pl: "pamiętać", ru: "помнить", relation: root, id: pamietac }
  - { pl: "zapomnienie", ru: "забвение", relation: root }
etymology: "Приставка za- + -pominać, того же корня, что pamięć «память» и русское «помнить»: буквально «запамятовать». Русское «забывать» построено от «быть» — совсем другой образ."
memory: "zapominać — «забывать», совершенный вид zapomnieć. О чём-то — o czymś: nie zapominaj o mnie. А вещь прямо в винительном: zapomniałem parasola «я забыл зонт»."
idioms:
  - { pl: "nie zapominaj o mnie", ru: "не забывай обо мне" }
  - { pl: "zapominać się", ru: "забываться, терять меру" }
  - { pl: "nie zapominajmy", ru: "не будем забывать" }
