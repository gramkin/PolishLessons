formExamples:
  - form: "zapomina"
    pl: "Słoń nigdy nie zapomina."
    ru: "Слон никогда не забывает."
    source: { kind: translated, id: 10460354 }
  - form: "zapomina"
    pl: "On wciąż o czymś zapomina."
    ru: "Он всё время о чём-нибудь забывает."
    source: { kind: translated, id: 587585 }
  - form: "zapomina"
    pl: "Ona często zapomina parasola."
    ru: "Она часто забывает зонт."
    source: { kind: translated, id: 363060 }
  - form: "zapominać"
    pl: "Nie powinieneś o tym zapominać."
    ru: "Тебе не следует об этом забывать."
    source: { kind: translated, id: 3817528 }
  - form: "zapominać"
    pl: "Nie wolno zapominać, że palenie jest szkodliwe dla zdrowia."
    ru: "Нельзя забывать, что курение вредно для здоровья."
    source: { kind: translated, id: 771776 }
  - form: "zapominać"
    pl: "Nie wolno zapominać, że zwierzęta też bywają „ludzkie”."
    ru: "Нельзя забывать, что животные тоже бывают человечными."
    source: { kind: translated, id: 3433441 }
  - form: "zapominaj"
    pl: "Nie zapominaj o nas!"
    ru: "Не забывай о нас!"
    source: { kind: translated, id: 349435 }
  - form: "zapominaj"
    pl: "Nie zapominaj o śmierci."
    ru: "Не забывай о смерти."
    source: { kind: translated, id: 6635702 }
  - form: "zapominaj"
    pl: "Nie zapominaj swoich rzeczy."
    ru: "Не забывай свои вещи."
    source: { kind: translated, id: 840225 }
  - form: "zapominając"
    pl: "Pójdę przez życie zapominając o tobie."
    ru: "Я пройду по жизни, забывая о тебе."
    source: { kind: translated, id: 12926280 }
  - form: "zapominając"
    pl: "Wyszedł, zapominając o parasolu."
    ru: "Он вышел, забыв про зонт."
    source: { kind: authored }
  - form: "zapominając"
    pl: "Mówił godzinę, zapominając o czasie."
    ru: "Он говорил час, забыв о времени."
    source: { kind: authored }
  - form: "zapominajcie"
    pl: "Nie zapominajcie o tym."
    ru: "Не забывайте об этом."
    source: { kind: tatoeba, id: 6320204 }
  - form: "zapominajcie"
    pl: "Nie zapominajcie, że jest kobietą!"
    ru: "Не забывайте, что она женщина!"
    source: { kind: tatoeba, id: 10747420 }
  - form: "zapominajcie"
    pl: "Nie zapominajcie o rodzicach."
    ru: "Не забывайте о родителях."
    source: { kind: authored }
  - form: "zapominajmy"
    pl: "Nie zapominajmy o naszych mamach."
    ru: "Не будем забывать о наших мамах."
    source: { kind: translated, id: 6155977 }
  - form: "zapominajmy"
    pl: "Co do uścisków ręki, to mam ostatnią radę - nie zapominajmy o uśmiechu."
    ru: "Что до рукопожатий, у меня есть последний совет — не будем забывать об улыбке."
    source: { kind: translated, id: 1606041 }
  - form: "zapominajmy"
    pl: "Nie zapominajmy o tych, którzy pomogli."
    ru: "Не будем забывать о тех, кто помог."
    source: { kind: authored }
  - form: "zapominał"
    pl: "Zapominał swojego parasola."
    ru: "Он забывал свой зонт."
    source: { kind: translated, id: 3108161 }
  - form: "zapominał"
    pl: "Tom był tak zaangażowany w pracę, że zapominał o jedzeniu."
    ru: "Том был настолько погружен в работу, что забывал есть."
    source: { kind: tatoeba, id: 501940 }
  - form: "zapominał"
    pl: "Dziadek często zapominał o lekarstwach."
    ru: "Дедушка часто забывал о лекарствах."
    source: { kind: authored }
  - form: "zapominam"
    pl: "Rzadko zapominam kluczy."
    ru: "Я редко забываю ключи."
    source: { kind: translated, id: 3296934 }
  - form: "zapominam"
    pl: "Nigdy nie zapominam twarzy."
    ru: "Я никогда не забываю лиц."
    source: { kind: translated, id: 8522519 }
  - form: "zapominam"
    pl: "Nie zapominam o moich przyjaciołach."
    ru: "Я не забываю о своих друзьях."
    source: { kind: translated, id: 3085084 }
  - form: "zapominamy"
    pl: "Zbyt często zapominamy o tym fakcie."
    ru: "Мы слишком часто забываем об этом факте."
    source: { kind: translated, id: 823855 }
  - form: "zapominamy"
    pl: "Kiedy mamy zdrowie, często zapominamy o jego wartości."
    ru: "Когда мы здоровы, мы часто забываем о ценности здоровья."
    source: { kind: translated, id: 836447 }
  - form: "zapominamy"
    pl: "Łatwo zapominamy, że ruch fizyczny to klucz do zdrowia."
    ru: "Мы легко забываем, что движение — ключ к здоровью."
    source: { kind: translated, id: 823845 }
  - form: "zapominasz"
    pl: "Ty zawsze zapominasz."
    ru: "Ты вечно забываешь."
    source: { kind: translated, id: 2605129 }
  - form: "zapominasz"
    pl: "Nie zapominasz o czymś?"
    ru: "Ты ни о чём не забываешь?"
    source: { kind: translated, id: 6554064 }
  - form: "zapominasz"
    pl: "Czy ty czasem o czymś nie zapominasz?"
    ru: "Ты, случаем, ни о чём не забываешь?"
    source: { kind: translated, id: 6554068 }
