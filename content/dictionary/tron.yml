etymology: "Из греческого THRONOS «седалище, высокое кресло», через латинское THRONUS, и в этом виде слово разошлось по всей Европе. Польский взял его прямо из латыни, книжным путём, а русский «трон» пришёл позже и через французское TRÔNE, отчего в русском и нет начального придыхания, которое греческий звук θ мог бы дать. Греческое THRONOS родственно словам о подпирании и поддержке, то есть исходно это просто устойчивое сиденье, без всякой власти; властное значение наросло на нём в христианской латыни, где THRONUS стал местом епископа и государя. От того же греческого корня идёт и слово «тронный», и церковное «престол» как перевод того же понятия."
memory: "Как русский «трон», ловушки нет; следить надо за падежами: родительный tronu на -u, местный na tronie. Движение к власти — wstąpić na tron с винительным, положение — siedzieć na tronie с местным. Następca tronu «наследник престола». Слово книжное, в живой речи почти только в шутку или переносно. Из греческого thronos через латынь, тогда как русский взял его через французское trône."
