notes:
  - { kind: register, text: "Слово книжное и историческое, и в обиходной речи встречается почти только в переносном смысле или в шутку: TRON DZIADKA о любимом кресле. В прямом значении оно живёт в текстах об истории и монархии, где и набирает свою частотность. Переносное употребление совпадает с русским: WSTĄPIĆ NA TRON «вступить на трон», STRACIĆ TRON, WALKA O TRON. В церковном контексте TRON BISKUPI это «епископская кафедра», и здесь русский скажет не «трон», а «кафедра» или «престол», так что переносить слово буквально не стоит." }
  - { kind: government, text: "Мужской род, неодушевлённое, и винительный равен именительному: ZAJĄĆ TRON. Родительный на -U: ZRZEC SIĘ TRONU, BEZ TRONU. Местный на -IE: NA TRONIE «на троне». Главные конструкции с предлогами: WSTĄPIĆ NA TRON с винительным, о движении к власти, и SIEDZIEĆ NA TRONIE с местным, о положении — то же различение направления и места, что в русском «встать на трон» и «стоять на троне». Отказ от власти — ZRZEC SIĘ с родительным: ZRZEKŁ SIĘ TRONU." }
  - { kind: pronunciation, text: "Читается «трон», ударение падать некуда, слог один. Начальное TR без всякого призвука, как в русском. В местном падеже TRONIE буква N смягчается перед -IE: «тро́не», и слогов становится два, ударение на первом. В родительном множественного TRONÓW буква Ó звучит «у»: «тро́нуф», и конечное W оглушается в «ф». Слово для русского фонетически простое, и перестраивать в нём нечего." }
  - { kind: usage, text: "Устойчивые сочетания стоит выучить целиком: WSTĄPIĆ NA TRON «вступить на престол», ZRZEC SIĘ TRONU «отречься от трона», NASTĘPCA TRONU «наследник престола», WALKA O TRON. Последнее употребляется и в переносном смысле, о борьбе за должность. Прилагательное от слова не образуется, вместо него берут родительный: SALA TRONOWA «тронный зал» идёт от TRONOWY, и это единственное производное, которое встречается часто. Уменьшительное TRONIK шутливое." }
