# review
id: stamtad
format: 2
lemma: "stamtąd"
rank: 1220
pos: adv
pron: { cyr: "ста́мтонт" }
senses:
  - id: from-there
    ru: "оттуда"
    examples:
      - pl: "Właśnie stamtąd przyszedłem."
        ru: "Я как раз оттуда пришёл."
        source: { kind: translated, id: 6554165 }
      - pl: "Wyszliśmy stamtąd o jedenastej."
        ru: "Мы вышли оттуда в одиннадцать."
        source: { kind: translated, id: 3427551 }
      - pl: "Zabierz stamtąd książki."
        ru: "Забери оттуда книги."
        source: { kind: translated, id: 12211450 }
  - id: away
    ru: "прочь оттуда: złaź stamtąd! «слезай оттуда!»"
    examples:
      - pl: "Złaź stamtąd!"
        ru: "Слезай оттуда!"
        source: { kind: translated, id: 364880 }
      - pl: "Jakoś udało mi się stamtąd uciec."
        ru: "Мне как-то удалось оттуда сбежать."
        source: { kind: translated, id: 5518011 }
      - pl: "Wybiegłem stamtąd i złapałem taksówkę."
        ru: "Я выбежал оттуда и поймал такси."
        source: { kind: translated, id: 3034135 }
notes:
  - { kind: usage, text: "Ряд указательных наречий места: tu или tutaj «здесь», tam «там», stąd «отсюда», stamtąd «оттуда»." }
  - { kind: usage, text: "Отвечает на вопрос skąd? «откуда?»: Skąd przyszedłeś? — Stamtąd." }
  - { kind: government, text: "Это наречие, предлог при нём не нужен: не «z stamtąd», а просто stamtąd." }
  - { kind: pronunciation, text: "ą перед d звучит как «он», а конечное d оглушается: ста́мтонт." }
collocations:
  - { pl: "właśnie stamtąd", ru: "как раз оттуда" }
  - { pl: "uciec stamtąd", ru: "сбежать оттуда" }
  - { pl: "złaź stamtąd", ru: "слезай оттуда" }
etymology: "Собрано из s- «из» плюс tam «там» плюс -ąd, ровно как stąd из s- и tu. Русское «оттуда» устроено так же: «от» плюс «туда»."
memory: "stamtąd — «оттуда», пара к stąd «отсюда». Отвечает на вопрос skąd? «откуда?». Предлог не нужен: просто stamtąd, без z."
idioms:
  - { pl: "złaź stamtąd!", ru: "слезай оттуда!" }
  - { pl: "właśnie stamtąd", ru: "как раз оттуда" }
  - { pl: "uciec stamtąd", ru: "сбежать оттуда" }
