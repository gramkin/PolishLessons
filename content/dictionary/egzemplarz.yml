# review
id: egzemplarz
format: 2
lemma: "egzemplarz"
rank: 2061
pos: noun
pron: { cyr: "эгзэ́мпляш" }
senses:
  - id: copy
    ru: "экземпляр (книги, газеты, документа)"
    examples:
      - pl: "Poproszę jeden egzemplarz tej książki."
        ru: "Дайте, пожалуйста, один экземпляр этой книги."
        source: { kind: translated, id: 6329798 }
      - pl: "Książki Stanisława Lema zostały przetłumaczone na 41 języków i osiągnęły łączny nakład ponad 30 mln egzemplarzy."
        ru: "Книги Станислава Лема были переведены на 41 язык и выпущены общим тиражом более 30 миллионов экземпляров."
        source: { kind: tatoeba, id: 1585827 }
      - pl: "Ta gazeta sprzedaje coraz mniej egzemplarzy."
        ru: "Эта газета продаёт всё меньше экземпляров."
        source: { kind: translated, id: 719667 }
  - id: duplicate
    ru: "экземпляр, дубликат (вещи)"
    examples:
      - pl: "Masz drugi egzemplarz tego klucza?"
        ru: "У тебя есть второй экземпляр этого ключа?"
        source: { kind: translated, id: 959570 }
      - pl: "Żądali, by wszystkie egzemplarze książki zostały zniszczone."
        ru: "Они требовали уничтожить все экземпляры книги."
        source: { kind: translated, id: 1640783 }
notes:
  - { kind: false-friend, text: "Здесь ловушки нет: egzemplarz и «экземпляр» — одно и то же латинское слово, пришедшее через немецкий." }
  - { kind: government, text: "Мужской неодушевлённый; родительный — egzemplarza, множественное — egzemplarze." }
  - { kind: usage, text: "w dwóch egzemplarzach «в двух экземплярах» — канцелярская формула, как в русском." }
  - { kind: usage, text: "В разговорной речи о человеке звучит иронически: niezły egzemplarz «ну и экземпляр»." }
  - { kind: government, text: "Родительный падеж множественного числа — egzemplarzy. Существительные на -arz дают -y (lekarzy, pisarzy), а не -ów." }
collocations:
  - { pl: "egzemplarz książki", ru: "экземпляр книги" }
  - { pl: "drugi egzemplarz", ru: "второй экземпляр" }
etymology: "Из латинского exemplar через немецкое Exemplar; русское «экземпляр» — то же слово и тот же путь."
memory: "egzemplarz — «экземпляр», слово в обоих языках одно и то же. Запомните канцелярское w dwóch egzemplarzach «в двух экземплярах»."
idioms:
  - { pl: "w dwóch egzemplarzach", ru: "в двух экземплярах" }
formExamplesSkip:
  - { form: "egzemplarzów", reason: "существительные на -arz дают родительный падеж множественного числа на -y: lekarzy, pisarzy, egzemplarzy. Вариант на -ów у этого слова не употребляется" }
