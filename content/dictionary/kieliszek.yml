notes:
  - { kind: false-friend, text: "Польская посуда для питья делится иначе, чем русская, и четыре слова стоит запомнить вместе. KIELISZEK — это рюмка или бокал на ножке, для водки и для вина. SZKLANKA — стакан, в том числе чайный. KUBEK — кружка, и вот здесь главная ловушка: русский «кубок» значит приз или старинную чашу, а по-польски приз это PUCHAR. FILIŻANKA — чашка с блюдцем, для кофе и чая. Ошибка в этом ряду слышна сразу, потому что речь о предметах, которые подают и просят каждый день." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Беглое E исчезает во всех косвенных формах: KIELISZEK, но KIELISZKA, KIELISZKOWI, KIELISZKIEM, KIELISZKU — как в PASEK, KOREK и OŚRODEK. Местный единственного — KIELISZKU, с окончанием -U, потому что основа кончается на заднеязычный K. Назначение выражается предлогом DO с родительным: KIELISZEK DO WINA, KIELISZEK DO WÓDKI; а содержимое — родительным без предлога: KIELISZEK WINA «бокал вина». Эти две конструкции различают сосуд и порцию." }
  - { kind: pronunciation, text: "Читается «кели́шэк», три слога, ударение на втором. Буквосочетание KIE даёт мягкое «ке», SZ — твёрдое «ш», а E в последнем слоге — чистое «э». В косвенных формах беглое E пропадает и слово становится короче: KIELISZKA звучит «кели́шка», KIELISZKIEM — «кели́шкем», KIELISZKU — «кели́шку». В форме KIELISZKÓW буква Ó читается как «у», а конечное W оглушается: «кели́шкуф»." }
  - { kind: register, text: "Слово нейтральное и ежедневное. Устойчивые сочетания: KIELISZEK DO WINA, KIELISZEK WÓDKI, KIELISZEK SZAMPANA, WZNIEŚĆ KIELISZEK «поднять бокал». Переносное ZAGLĄDAĆ DO KIELISZKA значит «заглядывать в рюмку», то есть выпивать, и звучит мягко-осуждающе, как и русский оборот. Уменьшительное KIELISZECZEK ласковое и шутливое. Исходное KIELICH означает большую чашу и прежде всего церковную, литургическую, и в этом значении оно торжественное." }
