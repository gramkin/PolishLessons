etymology: "Уменьшительное от KIELICH, а то — из немецкого KELCH, восходящего к латинскому CALIX «чаша, кубок», родственному греческому KYLIX. Слово пришло вместе с церковной утварью: KIELICH в костёле означает чашу для вина, и от неё уменьшительное перешло на бытовую рюмку, как русская «чарка» от «чары». Русский в этом ряду взял другие слова: «бокал» из французского BOCAL, «рюмку» из немецкого RÖMER, «стакан» из тюркского. Поэтому вся посудная лексика двух языков заимствована, но из разных источников, и ни одно слово не подсказывает другого — их приходится учить списком."
memory: "Уменьшительное от kielich «чаша», из немецкого Kelch и латинского calix. Ряд посуды запоминать вместе: kieliszek рюмка и бокал на ножке, szklanka стакан, kubek кружка, filiżanka чашка с блюдцем. Главная ловушка — kubek: русский «кубок» это приз, а по-польски приз puchar. Беглое e пропадает: kieliszek, но kieliszka; местный kieliszku на -u. Сосуд и порция различаются конструкцией: kieliszek do wina против kieliszek wina."
idioms:
  - { pl: "zaglądać do kieliszka", ru: "заглядывать в рюмку, выпивать" }
