# review
id: zainteresowac
format: 2
lemma: "zainteresować"
rank: 1114
pos: verb
aspect: perf
aspectPair: interesowac
pron: { cyr: "заинтэрэсо́ваць" }
senses:
  - id: interest
    ru: "заинтересовать кого-то"
    examples:
      - pl: "Zainteresowała mnie twoja uwaga."
        ru: "Меня заинтересовало твоё замечание."
        source: { kind: translated, id: 11722802 }
      - pl: "To mnie zainteresowało."
        ru: "Меня это заинтересовало."
        source: { kind: translated, id: 3750063 }
      - pl: "Pomyślałam, że cię to zainteresuje."
        ru: "Я подумала, что тебя это заинтересует."
        source: { kind: translated, id: 6156589 }
  - id: become-interested
    ru: "zainteresować się — заинтересоваться"
    examples:
      - pl: "Mój syn wcześnie zainteresował się polityką."
        ru: "Мой сын рано заинтересовался политикой."
        source: { kind: translated, id: 366184 }
      - pl: "Zainteresowałem się ostatnio szachami."
        ru: "Я в последнее время заинтересовался шахматами."
        source: { kind: translated, id: 539332 }
  - id: interested
    ru: "zainteresowany — заинтересованный"
    examples:
      - pl: "Nie jestem zainteresowany."
        ru: "Мне это неинтересно."
        source: { kind: translated, id: 459111 }
      - pl: "Mary jest zainteresowana polityką."
        ru: "Мэри интересуется политикой."
        source: { kind: translated, id: 625139 }
notes:
  - { kind: government, text: "zainteresować się CZYMŚ — творительный падеж: zainteresował się polityką «он заинтересовался политикой». Русское «заинтересоваться чем-то» тоже творительный, так что здесь языки совпадают." }
  - { kind: usage, text: "Совершенный вид к interesować. Приставка za- здесь только завершает действие." }
  - { kind: usage, text: "Причастие zainteresowany значит «заинтересованный» и очень часто стоит в отрицании: Nie jestem zainteresowany «Мне неинтересно, я не заинтересован»." }
  - { kind: usage, text: "Отглагольное zainteresowanie значит и «интерес», и во множественном «увлечения, хобби»: Jakie masz zainteresowania?" }
collocations:
  - { pl: "zainteresować się czymś", ru: "заинтересоваться чем-то" }
  - { pl: "nie jestem zainteresowany", ru: "мне неинтересно" }
  - { pl: "wzbudzić zainteresowanie", ru: "вызвать интерес" }
family:
  - { pl: "interesować", ru: "интересовать", relation: aspect, id: interesowac }
  - { pl: "zainteresowanie", ru: "интерес; увлечение", relation: derived }
  - { pl: "interesujący", ru: "интересный", relation: derived }
etymology: "Приставка za- плюс interesować, из латинского interesse «быть между, иметь значение». Русское «заинтересовать» собрано из тех же частей."
memory: "zainteresować — совершенный вид к interesować. С się и творительным: zainteresował się polityką, ровно как по-русски. Причастие zainteresowany чаще всего звучит в отрицании: Nie jestem zainteresowany."
idioms:
  - { pl: "zainteresować się czymś", ru: "заинтересоваться чем-то" }
  - { pl: "nie jestem zainteresowany", ru: "мне неинтересно" }
formExamplesSkip:
