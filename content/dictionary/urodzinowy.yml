# review
id: urodzinowy
format: 2
lemma: "urodzinowy"
rank: 3537
pos: adj
pron: { cyr: "уродзино́вы" }
senses:
  - id: birthday
    ru: "праздничный, ко дню рождения"
    examples:
      - pl: "Upiekła tort urodzinowy z dziesięcioma świeczkami."
        ru: "Она испекла торт ко дню рождения с десятью свечками."
        source: { kind: authored }
      - pl: "Dostałem kartkę urodzinową od babci."
        ru: "Я получил открытку ко дню рождения от бабушки."
        source: { kind: authored }
      - pl: "Przyjęcie urodzinowe zaczyna się o piątej."
        ru: "Праздник по случаю дня рождения начинается в пять."
        source: { kind: authored }
  - id: birthday-gift
    ru: "подаренный на день рождения"
    examples:
      - pl: "To mój urodzinowy prezent od żony."
        ru: "Это мой подарок на день рождения от жены."
        source: { kind: authored }
      - pl: "Urodzinowy rower stał w przedpokoju."
        ru: "Велосипед, подаренный на день рождения, стоял в прихожей."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "В русском нет прилагательного от «день рождения»: говорят «торт на день рождения», «открытка ко дню рождения». Польский делает из URODZINY прилагательное: TORT URODZINOWY, PREZENT URODZINOWY, PRZYJĘCIE URODZINOWE. Само URODZINY — только во множественном числе, как русские «именины»." }
  - { kind: usage, text: "Относительное прилагательное, степеней сравнения нет. Формы для мужчин-людей URODZINOWI в карточке нет: о людях так не говорят, а именинник — SOLENIZANT или JUBILAT. Остальные десять форм живые." }
  - { kind: government, text: "Ставится после существительного: TORT URODZINOWY, KARTKA URODZINOWA, PRZYJĘCIE URODZINOWE. Перед существительным — в разговоре: URODZINOWY PREZENT. На день рождения — NA URODZINY, NA с винительным существительного." }
  - { kind: pronunciation, text: "Читается «уродзино́вы», пять слогов, ударение на предпоследнем. DZI даёт мягкое «дзи», как в URODZINY «уродзи́ны». Все O чёткие, без аканья." }
  - { kind: register, text: "Нейтральное бытовое слово. Поздравление: WSZYSTKIEGO NAJLEPSZEGO Z OKAZJI URODZIN, «всего наилучшего по случаю дня рождения», или коротко STO LAT!, по названию песни. URODZINOWY в поздравлении не нужен, он живёт в названиях вещей." }
collocations:
  - { pl: "tort urodzinowy", ru: "торт на день рождения" }
  - { pl: "prezent urodzinowy", ru: "подарок на день рождения" }
  - { pl: "przyjęcie urodzinowe", ru: "праздник по случаю дня рождения" }
family:
  - { pl: "urodziny", ru: "день рождения", relation: root, id: urodziny }
  - { pl: "urodzić się", ru: "родиться", relation: root, id: urodzic }
  - { pl: "imieninowy", ru: "именинный", relation: derived }
etymology: "От URODZINY «день рождения», от URODZIĆ SIĘ «родиться», общеславянского корня *rod-. Русское «рождение», «родиться» — из того же корня. Поляки празднуют и URODZINY, и IMIENINY, «именины», и у второго есть своё прилагательное IMIENINOWY."
memory: "Urodzinowy — ко дню рождения: tort urodzinowy, prezent urodzinowy. Русского прилагательного нет. От urodziny. Читается «уродзино́вы»."
idioms:
  - { pl: "sto lat", ru: "многая лета (польская песня-поздравление)" }
formExamplesSkip:
