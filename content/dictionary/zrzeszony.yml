# review
id: zrzeszony
format: 2
lemma: "zrzeszony"
rank: 6051
pos: adj
pron: { cyr: "зжэшо́ны" }
senses:
  - id: affiliated
    ru: "объединённый (в организацию), состоящий (в союзе)"
    examples:
      - pl: "Rolnicy zrzeszeni w związku protestowali przed ministerstwem."
        ru: "Фермеры, состоящие в союзе, протестовали перед министерством."
        source: { kind: authored }
      - pl: "Jest zrzeszony w izbie adwokackiej."
        ru: "Он состоит в адвокатской палате."
        source: { kind: authored }
      - pl: "Wszystkie zrzeszone kluby płacą składki."
        ru: "Все клубы, входящие в объединение, платят взносы."
        source: { kind: authored }
  - id: organised
    ru: "организованный, членский (в противоположность неорганизованному, одиночке)"
    examples:
      - pl: "Pracownicy zrzeszeni mają lepszą ochronę niż niezrzeszeni."
        ru: "Работники, состоящие в профсоюзе, защищены лучше, чем несостоящие."
        source: { kind: authored }
      - pl: "Zrzeszony sportowiec może startować w zawodach ligi."
        ru: "Спортсмен, состоящий в клубе, может выступать в соревнованиях лиги."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Причастие от ZRZESZYĆ, «объединить в организацию», ставшее прилагательным. Почти всегда с W + предложный: zrzeszony w związku, w stowarzyszeniu, w izbie — «состоящий в союзе, обществе, палате». Отрицание пишется слитно: NIEZRZESZONY, «не состоящий в организации»." }
  - { kind: false-friend, text: "Русского «сржешённый» нет; ближе всего «объединённый», но ZRZESZONY — только о членстве в организации: о странах, силах, людях вообще говорят ZJEDNOCZONY, POŁĄCZONY. Существительное — ZRZESZENIE, «объединение, ассоциация»." }
  - { kind: pronunciation, text: "«зжэшо́ны»: ZRZ — «зж», RZ после Z звучит как «ж», SZ — «ш». Ударение на предпоследнем слоге SZO." }
  - { kind: register, text: "Официально-деловое: уставы, профсоюзы, спорт, юриспруденция. В разговоре: należy do związku, «состоит в профсоюзе»." }
collocations:
  - { pl: "zrzeszony w związku", ru: "состоящий в союзе" }
  - { pl: "zrzeszone organizacje", ru: "входящие в объединение организации" }
  - { pl: "członkowie zrzeszeni", ru: "члены объединения" }
family:
  - { pl: "zrzeszyć", ru: "объединить в организацию", relation: root, id: zrzeszyc }
  - { pl: "zrzeszenie", ru: "объединение, ассоциация", relation: derived }
  - { pl: "niezrzeszony", ru: "не состоящий в организации", relation: antonym }
etymology: "Причастие от ZRZESZYĆ, а то от RZESZA, «множество, масса людей», старого слова для «народа, общины» (ср. Rzesza Niemiecka, «Германская империя»). ZRZESZYĆ — буквально «собрать в одну rzeszę»."
memory: "Zrzeszony — состоящий в организации: zrzeszony w związku. От rzesza, «масса людей»: zrzeszyć — собрать в одну массу. Не в организации — niezrzeszony."
idioms:
  - { pl: "zrzeszony w związku zawodowym", ru: "состоящий в профсоюзе" }
