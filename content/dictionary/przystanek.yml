family:
  - { pl: "stać", ru: "стоять", relation: root, id: stac }
  - { pl: "przystanac", ru: "остановиться, приостановиться", relation: root }
  - { pl: "postoj", ru: "стоянка", relation: derived }
etymology: "От глагола PRZYSTANĄĆ «остановиться», а тот — от STAĆ, слова праславянского и того же, что русские «стать» и «стоять». Русская «остановка» собрана из того же корня, только с другой приставкой: у нас «о-», у поляков PRZY-. Поэтому слова и значат одно, и выглядят непохоже. Из того же гнезда идёт POSTÓJ «стоянка», где приставка PO- даёт уже третий оттенок того же стояния."
memory: "Остановка автобуса или трамвая. Запомните разведение: przystanek это остановка, stacja — железнодорожная станция, dworzec — вокзал, postoj — стоянка такси. Читается «пшыста́нэк», где prz даёт «пш», без всякого «р». Беглое e выпадает: przystanek, но na przystanku. И «через две остановки» — za dwa przystanki, с предлогом za."
idioms:
