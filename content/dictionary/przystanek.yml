notes:
  - { kind: false-friend, text: "Русская «остановка» годится на всё, а польский развёл три слова. PRZYSTANEK это остановка автобуса или трамвая. STACJA — железнодорожная станция. DWORZEC — вокзал, большое здание с кассами. А POSTÓJ это стоянка, прежде всего такси: POSTÓJ TAKSÓWEK. Сказать STACJA AUTOBUSU нельзя, и наоборот PRZYSTANEK о поезде тоже не скажут." }
  - { kind: usage, text: "Девять форм, мужской род, неодушевлённое. В основе беглое E, которое выпадает во всех косвенных падежах: PRZYSTANEK, но PRZYSTANKU, PRZYSTANKIEM, PRZYSTANKOWI. Так же устроены POCZĄTEK и NAPIWEK. Самое частое сочетание — NA PRZYSTANKU «на остановке», и именно в этой форме слово слышно чаще всего." }
  - { kind: government, text: "На остановке — NA PRZYSTANKU, местный падеж, как и по-русски. Выйти на остановке — WYSIĄŚĆ NA PRZYSTANKU, тоже местный, потому что речь о месте, а не о движении внутрь. До остановки — DO PRZYSTANKU, предлог DO с родительным. А «через две остановки» — ZA DWA PRZYSTANKI, предлог ZA с винительным, и русский здесь скажет совсем иначе." }
  - { kind: pronunciation, text: "Читается «пшыста́нэк», четыре слога, ударение на предпоследнем. Сочетание PRZ даёт «пш»: это самое непривычное место в слове, потому что никакого «р» в нём не слышно. Буква Y даёт «ы», а конечная E — «э», поэтому слово кончается на «нэк». В косвенных падежах беглое E пропадает: PRZYSTANKU звучит «пшыста́нку»." }
  - { kind: register, text: "Слово нейтральное и повседневное, одно из первых, какие нужны в городе. На табличке написано PRZYSTANEK, а ниже — название и номера линий. Объявление в автобусе звучит NASTĘPNY PRZYSTANEK, «следующая остановка». А PRZYSTANEK NA ŻĄDANIE «остановка по требованию» отмечают особым знаком, и водителю надо подать знак рукой." }
collocations:
  - { pl: "przystanek autobusowy", ru: "автобусная остановка" }
  - { pl: "na przystanku", ru: "на остановке" }
