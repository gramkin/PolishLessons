# review
id: usnac
format: 2
lemma: "usnąć"
rank: 2249
pos: verb
aspect: perf
pron: { cyr: "у́снонць" }
senses:
  - id: fall-asleep
    ru: "уснуть, заснуть"
    examples:
      - pl: "Usnął, czytając książkę."
        ru: "Он уснул за книгой."
        source: { kind: translated, id: 364136 }
      - pl: "Nie mogłem usnąć przez ten hałas."
        ru: "Я не мог уснуть из-за этого шума."
        source: { kind: translated, id: 820794 }
      - pl: "Było tak nudno, że usnąłem."
        ru: "Было так скучно, что я уснул."
        source: { kind: translated, id: 352475 }
  - id: drift-off
    ru: "задремать, забыться сном"
    examples:
      - pl: "Dziecko usnęło, zmęczone płaczem."
        ru: "Ребёнок уснул, утомлённый плачем."
        source: { kind: translated, id: 711042 }
      - pl: "Usnęła nie zdejmując swetra."
        ru: "Она уснула, не сняв свитер."
        source: { kind: translated, id: 415315 }
notes:
  - { kind: government, text: "Непереходный, совершенный вид. Несовершенного от того же корня нет: пару ему составляет zasypiać «засыпать»." }
  - { kind: usage, text: "Книжнее, чем zasnąć, но значит то же самое. В разговорной речи чаще zasnąć." }
  - { kind: false-friend, text: "Корень тот же, что в русском «уснуть», «сон». Приставка u- та же." }
  - { kind: usage, text: "Эвфемизм usnąć na zawsze «уснуть навеки» работает как в русском." }
collocations:
  - { pl: "nie móc usnąć", ru: "не мочь уснуть" }
etymology: "u- + snąć, от sen «сон»; ср. русское «уснуть», «сон», «засыпать»."
memory: "usnąć — «уснуть», книжнее чем zasnąć. Пару по виду ему составляет zasypiać «засыпать». Эвфемизм usnąć na zawsze работает как русский."
idioms:
  - { pl: "nie móc usnąć", ru: "не мочь уснуть" }
