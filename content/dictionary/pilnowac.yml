# review
id: pilnowac
format: 2
lemma: "pilnować"
rank: 1318
pos: verb
aspect: imperf
pron: { cyr: "пильно́ваць" }
senses:
  - id: guard
    ru: "сторожить, присматривать (с родительным падежом)"
    examples:
      - pl: "Pies pilnuje domu."
        ru: "Собака сторожит дом."
        source: { kind: translated, id: 12940773 }
      - pl: "Tamten chłopiec pilnuje owiec."
        ru: "Тот мальчик пасёт овец."
        source: { kind: translated, id: 8166770 }
      - pl: "Pilnuję domu."
        ru: "Я сторожу дом."
        source: { kind: translated, id: 10587077 }
  - id: mind-business
    ru: "pilnuj swojego nosa — не лезь не в своё дело"
    examples:
      - pl: "Pilnuj swego nosa!"
        ru: "Не лезь не в своё дело!"
        source: { kind: translated, id: 416244 }
      - pl: "Pilnuj swoich spraw."
        ru: "Занимайся своими делами."
        source: { kind: translated, id: 363535 }
      - pl: "Pilnuj, szewcze, kopyta."
        ru: "Всяк сверчок знай свой шесток."
        source: { kind: tatoeba, id: 359880 }
  - id: keep-to
    ru: "следить за чем-то, соблюдать"
    examples:
      - pl: "Zawsze pilnuję terminów."
        ru: "Я всегда соблюдаю сроки."
        source: { kind: translated, id: 982574 }
      - pl: "Ten bank zawsze pilnuje własnych interesów."
        ru: "Этот банк всегда блюдёт свои интересы."
        source: { kind: translated, id: 8175373 }
      - pl: "Pilnuj swoich finansów."
        ru: "Следи за своими финансами."
        source: { kind: translated, id: 12260912 }
notes:
  - { kind: government, text: "pilnować czegoś «сторожить что-то» требует родительного падежа, а не винительного: pilnować domu, pilnować dzieci." }
  - { kind: usage, text: "Идиома pilnuj swojego nosa — «не лезь не в своё дело», буквально «следи за своим носом»." }
  - { kind: usage, text: "Вид несовершенный; совершенный — przypilnować. Отглагольное существительное — pilnowanie." }
  - { kind: usage, text: "О сроках и правилах значит «соблюдать»: pilnować terminów «соблюдать сроки»." }
collocations:
  - { pl: "pilnować domu", ru: "сторожить дом" }
  - { pl: "pilnuj swojego nosa", ru: "не лезь не в своё дело" }
  - { pl: "pilnować terminów", ru: "соблюдать сроки" }
etymology: "От pilny «прилежный, срочный», из праславянского *pilьnъ. Прямого русского родственника нет, но в старых текстах «пильно» значило «усердно»."
memory: "pilnować czegoś — «сторожить, присматривать», и требует родительного падежа: pilnować domu. Идиома pilnuj swojego nosa значит «не лезь не в своё дело». Совершенный вид — przypilnować."
idioms:
  - { pl: "pilnuj swojego nosa", ru: "не лезь не в своё дело" }
  - { pl: "pilnować jak oka w głowie", ru: "беречь как зеницу ока" }
  - { pl: "pilnować terminów", ru: "соблюдать сроки" }
