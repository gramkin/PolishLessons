etymology: "Праславянское *kъto из праиндоевропейского *kʷis — то же слово, что русское «кто»."
memory: "Падежи зеркалят русские: kogo «кого», komu «кому», kim «кем». Вопрос о профессии или личности строится через kim: Kim jesteś? «Кто ты?»."
