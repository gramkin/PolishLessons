notes:
  - { kind: false-friend, text: "Русское «племянница» по-польски делится надвое. SIOSTRZENICA — дочь сестры, BRATANICA — дочь брата. Так же с «племянником»: SIOSTRZENIEC и BRATANEK. На «сестрицу» слово не похоже по смыслу: сестрёнка — SIOSTRZYCZKA." }
  - { kind: usage, text: "Десять форм, женский род, лицо. Родительный, дательный и местный единственного совпадают: SIOSTRZENICY. Родительный множественного — SIOSTRZENIC, без окончания: MAM PIĘĆ SIOSTRZENIC." }
  - { kind: government, text: "Чья племянница — родительный, как по-русски: SIOSTRZENICA MOJEJ ŻONY. Быть чьей-то племянницей — BYĆ CZYJĄŚ SIOSTRZENICĄ, творительный: JEST MOJĄ SIOSTRZENICĄ." }
  - { kind: pronunciation, text: "Читается «сьостшэни́ца», ударение на предпоследнем слоге. SI — «сьо», как в SIOSTRA. TRZ — «тш»: RZ после глухого T оглушается." }
  - { kind: register, text: "Слово нейтральное, но длинное, поэтому в разговоре его часто заменяют описанием: CÓRKA MOJEJ SIOSTRY. Дети к племяннице, конечно, обращаются по имени." }
collocations:
  - { pl: "mała siostrzenica", ru: "маленькая племянница" }
  - { pl: "ukochana siostrzenica", ru: "любимая племянница" }
  - { pl: "siostrzenica żony", ru: "племянница жены" }
family:
  - { pl: "siostra", ru: "сестра", relation: root, id: siostra }
  - { pl: "siostrzeniec", ru: "племянник (сын сестры)", relation: derived }
  - { pl: "siostrzany", ru: "сестринский", relation: derived }
etymology: "От SIOSTRA «сестра». Перед E твёрдое R смягчается в RZ, поэтому TR становится TRZ: SIOSTRA, SIOSTRZE, SIOSTRZENICA. Пара по брату строится так же: BRAT, BRATANICA."
memory: "Siostrzenica — дочь сестры, siostra. Bratanica — дочь брата, brat. Читается «сьостшэни́ца». Mam pięć siostrzenic — у меня пять племянниц."
idioms:
