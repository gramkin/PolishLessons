# review
id: komorka
format: 2
lemma: "komórka"
rank: 1045
pos: noun
pron: { cyr: "кому́рка" }
senses:
  - id: phone
    ru: "мобильный телефон (разг.)"
    examples:
      - pl: "Czy masz komórkę?"
        ru: "У тебя есть мобильный?"
        source: { kind: translated, id: 545824 }
      - pl: "Moja komórka jest zupełnie wyładowana."
        ru: "Мой мобильный совсем разрядился."
        source: { kind: translated, id: 3743885 }
      - pl: "Tom wyjął komórkę."
        ru: "Том достал мобильный."
        source: { kind: translated, id: 6534494 }
  - id: cell
    ru: "клетка (биологическая)"
    examples:
      - pl: "Wszystkie organizmy składają się z komórek."
        ru: "Все организмы состоят из клеток."
        source: { kind: translated, id: 4514863 }
      - pl: "Każda komórka pochodzi z komórki."
        ru: "Каждая клетка происходит от клетки."
        source: { kind: translated, id: 11604876 }
      - pl: "Komórki tworzą tkankę."
        ru: "Клетки образуют ткань."
        source: { kind: translated, id: 8737494 }
  - id: room
    ru: "каморка, чулан"
    examples:
      - pl: "Zamknąć go w komórce. Ale jak?"
        ru: "Запереть его в чулане. Но как?"
        source: { kind: translated, id: 2178467 }
      - pl: "Trzyma narzędzia w komórce."
        ru: "Он держит инструменты в чулане."
        source: { kind: authored }
      - pl: "Komórka na węgiel jest pusta."
        ru: "Чулан для угля пуст."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Уменьшительное от komora «камера, кладовая», отсюда сразу три значения: «каморка», «клетка» в биологии и — разговорно — «мобильный телефон»." }
  - { kind: usage, text: "В значении «мобильный» это сокращение от telefon komórkowy «сотовый телефон», буквально «клеточный»: сеть делится на соты-клетки." }
  - { kind: usage, text: "Биологическое значение калькировано с латинского cellula «клеточка» — точно так же, как русская «клетка»." }
  - { kind: usage, text: "Разговорное mam nową komórkę «у меня новый мобильный» встречается чаще, чем полное telefon komórkowy." }
collocations:
  - { pl: "mieć komórkę", ru: "иметь мобильный" }
  - { pl: "telefon komórkowy", ru: "сотовый телефон" }
  - { pl: "komórki nerwowe", ru: "нервные клетки" }
  - { pl: "naładować komórkę", ru: "зарядить мобильный" }
family:
  - { pl: "komora", ru: "камера, кладовая", relation: root }
  - { pl: "komórkowy", ru: "сотовый, клеточный", relation: derived }
  - { pl: "telefon", ru: "телефон", relation: root, id: telefon }
etymology: "Уменьшительное от komora «кладовая», из латинского camera. Биологическое значение калькировано с cellula, а «мобильный» — сокращение от telefon komórkowy."
memory: "komórka — сразу три вещи: «каморка», «клетка» в биологии и разговорное «мобильный». Последнее чаще всего: Masz komórkę? «У тебя есть мобильный?» — это сокращение от telefon komórkowy."
idioms:
  - { pl: "mieć komórkę", ru: "иметь мобильный" }
  - { pl: "telefon komórkowy", ru: "сотовый телефон" }
  - { pl: "komórki macierzyste", ru: "стволовые клетки" }
formExamplesSkip:
  - { form: "komórko", reason: "звательный падеж: к телефону и клетке не обращаются, форма не употребляется" }
