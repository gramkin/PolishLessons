notes:
  - { kind: usage, text: "Предлоги: do szkoły «в школу» (направление), w szkole «в школе» (место), ze szkoły «из школы»." }
  - { kind: usage, text: "szkoła podstawowa — «начальная школа», szkoła średnia — «средняя»; szkoła wyższa — «вуз»." }
  - { kind: usage, text: "szkoła życia — «школа жизни»; zielona szkoła — выезд класса на природу с уроками." }
collocations:
  - { pl: "do szkoły", ru: "в школу" }
  - { pl: "w szkole", ru: "в школе" }
  - { pl: "szkoła podstawowa", ru: "начальная школа" }
  - { pl: "szkoła życia", ru: "школа жизни" }
etymology: "Из латинского schola, а то — из греческого σχολή «досуг»: учились на досуге. В русский «школа» пришла тем же путём."
memory: "szkoła — «школа», из греческого σχολή «досуг»: учились на досуге. Идут do szkoły, а находятся w szkole."
idioms:
  - { pl: "szkoła życia", ru: "школа жизни" }
  - { pl: "dać szkołę", ru: "задать жару" }
  - { pl: "mieć do szkoły pod górkę", ru: "иметь трудную дорогу в школу" }
formExamplesSkip:
