# review
id: wypadac
format: 2
lemma: "wypadać"
rank: 4283
pos: verb
pron: { cyr: "выпа́даць" }
senses:
  - id: fall-out
    ru: "выпадать (из чего-то); выпадать (о волосах, зубах)"
    examples:
      - pl: "Wypadają mi włosy."
        ru: "У меня выпадают волосы."
        source: { kind: authored }
      - pl: "Z torby wypadają książki."
        ru: "Из сумки вываливаются книги."
        source: { kind: authored }
      - pl: "Mleczne zęby wypadają w wieku sześciu lat."
        ru: "Молочные зубы выпадают в шесть лет."
        source: { kind: authored }
  - id: be-proper
    ru: "WYPADA / NIE WYPADA — подобает, прилично / неприлично; выпадать (о дате)"
    examples:
      - pl: "Nie wypada tak mówić do starszych."
        ru: "Неприлично так говорить со старшими."
        source: { kind: authored }
      - pl: "W tym roku Wigilia wypada w środę."
        ru: "В этом году сочельник выпадает на среду."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "WYPADAĆ — «выпадать», но с двумя важными польскими значениями. Безличное WYPADA, NIE WYPADA — «прилично», «неприлично»: NIE WYPADA SPÓŹNIAĆ SIĘ. И разговорное «выскакивать, заскакивать»: WYPADAM DO SKLEPU «я сбегаю в магазин». WYPADEK — «несчастный случай», а не «выпадение»." }
  - { kind: usage, text: "Несовершенный вид; совершенный — WYPAŚĆ. Спряжение на -AM: WYPADAM, WYPADASZ, WYPADAJĄ. Безличное WYPADANO в карточку не включено. WYPADANIE WŁOSÓW — «выпадение волос», частое в медицине и рекламе." }
  - { kind: government, text: "Откуда — Z с родительным: WYPADAĆ Z RĄK, Z OKNA. На какой день — NA с винительным или W с винительным: WYPADA NA PONIEDZIAŁEK, W ŚRODĘ. Безличное с инфинитивом: NIE WYPADA PYTAĆ «неприлично спрашивать». Кому — дательный: WYPADAJĄ MI WŁOSY." }
  - { kind: pronunciation, text: "Читается «выпа́даць»: Y — «ы», ударение на предпоследнем слоге. WYPADA — «выпа́да»." }
  - { kind: register, text: "Нейтральное слово. NIE WYPADA — вежливое, чуть старомодное напоминание о приличиях. WYPADAJ STĄD! — грубое «вали отсюда!»." }
collocations:
  - { pl: "wypadają mi włosy", ru: "у меня выпадают волосы" }
  - { pl: "nie wypada", ru: "неприлично" }
  - { pl: "wypadać z rąk", ru: "валиться из рук" }
family:
  - { pl: "wypaść", ru: "выпасть", relation: aspect, id: wypasc }
  - { pl: "wypadek", ru: "несчастный случай", relation: derived, id: wypadek }
  - { pl: "padać", ru: "падать; идти (о дожде)", relation: root, id: padac }
etymology: "Приставка WY- плюс PADAĆ «падать», праславянское *padati, как русское «выпадать». Значение «подобает» — «так выпадает по обычаю»."
memory: "Wypadać — выпадать: wypadają mi włosy. Nie wypada — неприлично. Wypadam do sklepu — сбегаю в магазин. Wypadek — несчастный случай!"
idioms:
  - { pl: "jak wypada", ru: "как полагается, как подобает" }
formExamplesSkip:
  - { form: "wypadano", reason: "безличная форма не употребляется" }
