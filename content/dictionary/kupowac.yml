# review
id: kupowac
format: 2
lemma: "kupować"
rank: 1347
pos: verb
aspect: imperf
aspectPair: kupic
pron: { cyr: "купо́ваць" }
senses:
  - id: buy
    ru: "покупать (повторно, регулярно)"
    examples:
      - pl: "Kupuje książki w księgarni."
        ru: "Она покупает книги в книжном магазине."
        source: { kind: tatoeba, id: 6324458 }
      - pl: "Ona zawsze kupuje drogie ubrania."
        ru: "Она всегда покупает дорогую одежду."
        source: { kind: tatoeba, id: 2983812 }
      - pl: "Kupują warzywa w supermarkecie."
        ru: "Они покупают овощи в супермаркете."
        source: { kind: translated, id: 1006947 }
  - id: dont-buy
    ru: "nie kupuj — не покупай"
    examples:
      - pl: "Nie kupuj dziecku żółwia."
        ru: "Не покупай ребёнку черепаху."
        source: { kind: tatoeba, id: 6156005 }
      - pl: "Nie kupuj na kredyt."
        ru: "Не покупай в кредит."
        source: { kind: translated, id: 1611425 }
      - pl: "Nie kupuj kota w worku."
        ru: "Не покупай кота в мешке."
        source: { kind: translated, id: 13669879 }
  - id: buy-into
    ru: "переносно: покупаться, верить"
    examples:
      - pl: "Kupujesz to wyjaśnienie?"
        ru: "Ты покупаешься на это объяснение?"
        source: { kind: translated, id: 570456 }
      - pl: "Odnoszę wrażenie, że ludzie nie wiedzą co kupują."
        ru: "У меня впечатление, что люди не знают, что покупают."
        source: { kind: translated, id: 2178509 }
      - pl: "Kupujesz czy sprzedajesz?"
        ru: "Ты покупаешь или продаёшь?"
        source: { kind: translated, id: 13553764 }
notes:
  - { kind: usage, text: "Kupować — о повторяющейся покупке, kupić — об одной: Zawsze kupuję tu chleb «Я всегда покупаю тут хлеб», но Kupiłem chleb «Я купил хлеб»." }
  - { kind: government, text: "kupować coś «покупать что-то» — винительный. Kupować komuś coś «покупать кому-то что-то» — плюс дательный." }
  - { kind: usage, text: "Идиома kupować kota w worku — «покупать кота в мешке», совпадает с русской дословно." }
  - { kind: usage, text: "Переносное значение «поверить, купиться»: Kupujesz to wyjaśnienie? «Ты покупаешься на это объяснение?»" }
collocations:
  - { pl: "kupować chleb", ru: "покупать хлеб" }
  - { pl: "kupować kota w worku", ru: "покупать кота в мешке" }
  - { pl: "nie kupuj", ru: "не покупай" }
etymology: "Приставки нет: kupować — многократная форма от kupić «купить», из праславянского *kupiti, а оно из германского kaufen. Русское «покупать» — то же гнездо."
memory: "kupować — «покупать» повторно, в отличие от kupić «купить» один раз. Идиома kupować kota w worku совпадает с русской дословно. Переносно значит «купиться»: Kupujesz to wyjaśnienie?"
idioms:
  - { pl: "kupować kota w worku", ru: "покупать кота в мешке" }
  - { pl: "nie kupuj", ru: "не покупай" }
  - { pl: "kupować chleb", ru: "покупать хлеб" }
