# review
id: nalac
format: 2
lemma: "nalać"
rank: 4832
pos: verb
pron: { cyr: "на́лаць" }
senses:
  - id: pour
    ru: "налить"
    examples:
      - pl: "Nalał mi lampkę wina."
        ru: "Он налил мне бокал вина."
        source: { kind: authored }
      - pl: "Nalej wody do czajnika."
        ru: "Налей воды в чайник."
        source: { kind: authored }
      - pl: "Nalała herbaty do kubków."
        ru: "Она разлила чай по кружкам."
        source: { kind: authored }
  - id: fill
    ru: "наполнить (ванну, бак)"
    examples:
      - pl: "Nalała wody do wanny."
        ru: "Она набрала воды в ванну."
        source: { kind: authored }
      - pl: "Nalał paliwa do pełna."
        ru: "Он заправил полный бак."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "NALAĆ — «налить», как в русском. С родительным — «налить сколько-то»: NALAĆ WODY; с винительным — определённое количество: NALAĆ HERBATĘ DO KUBKA. NALEWKA — «домашняя настойка, наливка»." }
  - { kind: usage, text: "Пятьдесят две формы: формы для мужчин-людей NALANI нет, разговорный вариант NALELI не включён. Будущее: NALEJĘ, NALEJESZ, повелительное NALEJ. Несовершенный вид — NALEWAĆ." }
  - { kind: government, text: "Чего — родительный: NALAĆ WINA. Куда — DO с родительным: DO SZKLANKI, DO WANNY. Кому — дательный: NALAĆ KOMUŚ ZUPY." }
  - { kind: pronunciation, text: "Читается «на́лаць», ударение на первом слоге. NALEJĘ — «нале́е», NALAŁ — «на́лау»." }
  - { kind: register, text: "Нейтральное бытовое слово. NALEJ MI KIELISZEK — разговорное «налей рюмочку». NALANA TWARZ — разговорное «одутловатое лицо»." }
collocations:
  - { pl: "nalać wody", ru: "налить воды" }
  - { pl: "nalać komuś wina", ru: "налить кому-то вина" }
  - { pl: "nalać do pełna", ru: "налить до краёв" }
family:
  - { pl: "lać", ru: "лить", relation: root, id: lac }
  - { pl: "wylać", ru: "вылить", relation: derived, id: wylac }
  - { pl: "nalewka", ru: "настойка", relation: derived }
etymology: "Приставка NA- плюс LAĆ «лить», праславянское *liti, *lějati. Русское «налить» — то же слово."
memory: "Nalać — налить: nalał mi wina. Nalej wody! — налей воды! Nalewka — настойка. Читается «на́лаць»."
idioms:
  - { pl: "nalać do pełna", ru: "налить до краёв, заправить полный бак" }
formExamplesSkip:
  - { form: "nalani", reason: "формы для мужчин-людей нет" }
  - { form: "naleli", reason: "разговорный вариант NALALI" }
