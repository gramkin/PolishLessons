# review
id: pachniec
format: 2
lemma: "pachnieć"
rank: 1949
pos: verb
pron: { cyr: "па́хньець" }
senses:
  - id: smell
    ru: "пахнуть, издавать запах"
    examples:
      - pl: "W kuchni pachnie chlebem."
        ru: "На кухне пахнет хлебом."
        source: { kind: authored }
      - pl: "Pachniało wiosną."
        ru: "Пахло весной."
        source: { kind: authored }
      - pl: "Te kwiaty pachną najmocniej wieczorem."
        ru: "Эти цветы пахнут сильнее всего вечером."
        source: { kind: authored }
  - id: bode
    ru: "перен. пахнуть чем-л. (предвещать)"
    examples:
      - pl: "To pachnie kłopotami."
        ru: "Это пахнет неприятностями."
        source: { kind: authored }
      - pl: "Cała sprawa pachniała oszustwem."
        ru: "Всё дело пахло обманом."
        source: { kind: authored }
  - id: fragrance
    ru: "pachnienie — благоухание"
    examples:
      - pl: "Pachnienie lipy niosło się po całym podwórku."
        ru: "Благоухание липы разносилось по всему двору."
        source: { kind: authored }
      - pl: "O pachnieniu bzu pisali poeci."
        ru: "О благоухании сирени писали поэты."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Корень общий с русским «пахнуть», но ОЦЕНКА РАЗНАЯ. Русское «пахнуть» само по себе нейтрально: пахнуть может и хорошо, и дурно. Польское pachnieć по умолчанию значит «пахнуть ПРИЯТНО»: Ładnie pachnie — похвала, Ale tu pachnie! — одобрение. Для дурного запаха есть отдельный глагол śmierdzieć «вонять». Сказать по-польски pachnie zepsutym mięsem можно, но звучит это странно — там нужен śmierdzieć." }
  - { kind: government, text: "Пахнут ЧЕМ — творительный падеж, как и по-русски: pachnieć chlebem, wiosną, perfumami. Расхождений нет совсем. В переносном значении так же: pachnieć kłopotami «пахнуть неприятностями»." }
  - { kind: pronunciation, text: "ЧЕРЕДОВАНИЕ a и e В ПРОШЕДШЕМ ВРЕМЕНИ. У глаголов на -eć в прошедшем пишется a перед твёрдым согласным и e перед мягким: pachniał, но pachnieli. Точно так же widział — widzieli, miał — mieli, słyszał — słyszeli. Мужско-личная форма множественного числа всегда тянет за собой e." }
  - { kind: usage, text: "Глагол непереходный, поэтому страдательного причастия у него нет: пахнуть можно только самому. Действительное причастие pachnący «пахучий, душистый» употребляется очень широко: pachnące mydło, pachnąca pościel." }
collocations:
  - { pl: "ładnie pachnieć", ru: "приятно пахнуть" }
  - { pl: "pachnieć kłopotami", ru: "пахнуть неприятностями" }
  - { pl: "pachnące mydło", ru: "душистое мыло" }
family:
  - { pl: "zapach", ru: "запах", relation: root, id: zapach }
  - { pl: "wąchać", ru: "нюхать", relation: derived }
  - { pl: "śmierdzieć", ru: "вонять", relation: antonym, id: smierdziec }
etymology: "Общеславянский корень, тот же, что в русских «пахнуть», «запах», «пахучий». Исходно он связан с движением воздуха — отсюда и «веять», и «пахать» в старом смысле «мести, развеивать». Польский закрепил за ним приятный запах, а для неприятного завёл отдельное śmierdzieć."
memory: "pachnieć — «пахнуть», корень тот же. Но помните перекос: по-польски pachnieć значит пахнуть ХОРОШО, а вонять будет śmierdzieć. Управление родное: pachnieć chlebem, творительный, как в «пахнет хлебом»."
idioms:
  - { pl: "to pachnie kłopotami", ru: "это пахнет неприятностями" }
  - { pl: "pachnieć wiosną", ru: "пахнуть весной" }
