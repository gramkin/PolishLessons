# review
id: prokurator
format: 2
lemma: "prokurator"
rank: 1669
pos: noun
pron: { cyr: "прокура́тор" }
senses:
  - id: prosecutor
    ru: "прокурор"
    examples:
      - pl: "Ten prokurator jest w istocie tylko widzem, nie prowadzi żadnych dochodzeń."
        ru: "Этот прокурор по сути лишь зритель, он не ведёт никаких расследований."
        source: { kind: translated, id: 13463532 }
      - pl: "Prokurator wniósł akt oskarżenia."
        ru: "Прокурор внёс обвинительный акт."
        source: { kind: authored }
      - pl: "Prokurator zażądał kary więzienia."
        ru: "Прокурор потребовал тюремного наказания."
        source: { kind: authored }
  - id: in-court
    ru: "прокурор (в суде)"
    examples:
      - pl: "Prokurator i adwokat spierali się długo."
        ru: "Прокурор и адвокат долго спорили."
        source: { kind: authored }
      - pl: "Prokurator przedstawił dowody."
        ru: "Прокурор представил доказательства."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Слово редкое в корпусе: единственный пример приходится на именительный падеж, остальные девять форм пусты." }
  - { kind: usage, text: "Судебный набор: sędzia «судья», adwokat «адвокат», prokurator «прокурор», sąd «суд» — все четыре стоит учить вместе." }
  - { kind: usage, text: "Женщина-прокурор тоже prokurator; форма prokuratorka существует, но считается разговорной." }
  - { kind: usage, text: "Существительное мужское одушевлённое: prokurator, prokuratora, prokuratorem, множественное prokuratorzy." }
collocations:
  - { pl: "prokurator generalny", ru: "генеральный прокурор" }
  - { pl: "prokurator i adwokat", ru: "прокурор и адвокат" }
  - { pl: "wniosek prokuratora", ru: "ходатайство прокурора" }
etymology: "Из латинского procurator «управляющий, поверенный», от procurare «заботиться, вести дела». Русский «прокурор» пришёл из того же латинского источника через французский, так что слова прямо родственны."
memory: "prokurator = «прокурор», латинское заимствование, как и русское слово. Учите четвёркой: sąd «суд», sędzia «судья», adwokat «адвокат», prokurator «прокурор»."
