pos: noun
pron: { cyr: "кава́лер" }
senses:
  - id: bachelor
    ru: "холостяк; холост (в анкете)"
    examples:
      - pl: "Mój brat jest wciąż kawalerem."
        ru: "Мой брат всё ещё холостяк."
        source: { kind: authored }
      - pl: "Stary kawaler mieszka sam z kotem."
        ru: "Старый холостяк живёт один с котом."
        source: { kind: authored }
      - pl: "W ankiecie zaznaczył: kawaler."
        ru: "В анкете он отметил: холост."
        source: { kind: authored }
  - id: knight-suitor
    ru: "кавалер (ордена); ухажёр"
    examples:
      - pl: "Został kawalerem Orderu Orła Białego."
        ru: "Он стал кавалером ордена Белого орла."
        source: { kind: authored }
      - pl: "Na bal przyszła z nowym kawalerem."
        ru: "На бал она пришла с новым кавалером."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Главное значение польского KAWALER — холостяк, и в анкете KAWALER значит «не женат». Русский «кавалер» сохранился в польском в сочетании KAWALER ORDERU — «кавалер ордена» — и в старомодном значении «ухажёр». Незамужняя женщина — PANNA. А KAWALERKA — не холостячка, а однокомнатная квартира, «холостяцкое жильё»." }
  - { kind: usage, text: "Одиннадцать форм, мужской род, лицо. Во множественном две формы: KAWALEROWIE — обычная, KAWALERZY — тоже правильная. В местном падеже R переходит в RZ: O KAWALERZE. Винительный равен родительному: ZNALAZŁA KAWALERA." }
  - { kind: government, text: "Быть холостяком — BYĆ KAWALEREM, творительный, как русское «быть кем». Кавалер ордена — KAWALER ORDERU, родительный. Мальчишник — WIECZÓR KAWALERSKI, с прилагательным." }
  - { kind: pronunciation, text: "Читается «кава́лер», три слога, ударение на втором. L перед E звучит как русское «л» в слове «лес». В местном падеже KAWALERZE сочетание RZ даёт «ж»: «кавале́жэ»." }
  - { kind: register, text: "В анкетах и документах KAWALER — нейтральный термин семейного положения. STARY KAWALER звучит шутливо или с лёгким сожалением. KAWALER DO WZIĘCIA — «завидный жених», о холостяке, которого стоит заполучить." }
collocations:
  - { pl: "wieczór kawalerski", ru: "мальчишник" }
  - { pl: "kawaler orderu", ru: "кавалер ордена" }
  - { pl: "młody kawaler", ru: "молодой холостяк" }
family:
  - { pl: "kawalerka", ru: "однокомнатная квартира", relation: derived }
  - { pl: "kawalerski", ru: "холостяцкий", relation: derived }
  - { pl: "kawaleria", ru: "кавалерия", relation: root }
etymology: "Из итальянского CAVALIERE «всадник, рыцарь», от латинского слова для коня. Рыцарь обычно был молод и не женат, и в польском значение сдвинулось к «холостяку». Тот же корень у KAWALERIA, «кавалерия»."
memory: "Kawaler — холостяк, а в анкете «не женат»; незамужняя — panna. Читается «кава́лер». Kawalerka — однокомнатная квартира, wieczór kawalerski — мальчишник. Kawaler orderu — кавалер ордена, как у нас."
idioms:
