lemma: "porcja"
rank: 4919
pos: noun
pron: { cyr: "по́рцья" }
senses:
  - id: portion
    ru: "порция (еды)"
    examples:
      - pl: "Zamówiłem dużą porcję frytek."
        ru: "Я заказал большую порцию картошки фри."
        source: { kind: authored }
      - pl: "Ta porcja wystarczy dla dwóch osób."
        ru: "Этой порции хватит на двоих."
        source: { kind: authored }
      - pl: "Dziecko nie zjadło całej porcji."
        ru: "Ребёнок не съел всю порцию."
        source: { kind: authored }
  - id: dose
    ru: "доля, порция чего-то (перен.)"
    examples:
      - pl: "Dostał porcję dobrych wiadomości."
        ru: "Он получил порцию хороших новостей."
        source: { kind: authored }
      - pl: "Wieczorem czeka nas porcja emocji."
        ru: "Вечером нас ждёт порция эмоций."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Десять форм в таблице, женский род. Родительный, дательный и местный единственного и родительный множественного совпадают: PORCJI. Старинная форма PORCYJ и звательная PORCJO сегодня не нужны." }
  - { kind: false-friend, text: "Слово то же, что русское «порция», и значения совпадают. Запомните оборот ŻELAZNA PORCJA, «железная порция», — наш «неприкосновенный запас»: шоколадка на чёрный день или деньги, которые не трогают. А «добавка» в столовой — не PORCJA, а DOKŁADKA." }
  - { kind: government, text: "Порция чего-то — PORCJA CZEGOŚ, родительный: PORCJA LODÓW. Порция для кого-то — PORCJA DLA KOGOŚ. Съесть всю порцию — ZJEŚĆ CAŁĄ PORCJĘ, винительный." }
  - { kind: pronunciation, text: "Читается «по́рцья», два слога, ударение на первом: CJA в конце звучит одним слогом, «цья», как в STACJA «ста́цья». В форме PORCJI: «по́рцьи»." }
collocations:
  - { pl: "podwójna porcja", ru: "двойная порция" }
  - { pl: "porcja lodów", ru: "порция мороженого" }
  - { pl: "mała porcja", ru: "маленькая порция" }
family:
  - { pl: "porcjować", ru: "делить на порции", relation: derived }
  - { pl: "porcyjka", ru: "порцийка", relation: derived }
  - { pl: "porcjowany", ru: "порционный, расфасованный", relation: derived }
etymology: "Из латинского PORTIO «доля, часть». Русский и польский взяли одно слово; польский сохранил латинское окончание -CJA, а русский переделал его в «-ция»."
memory: "Porcja — «порция», читается «по́рцья». Porcja lodów — порция мороженого. Żelazna porcja — неприкосновенный запас. Добавка — dokładka."
idioms:
  - { pl: "żelazna porcja", ru: "неприкосновенный запас" }
formExamplesSkip:
  - { form: "porcyj", reason: "архаичная форма родительного множественного; сейчас PORCJI" }
  - { form: "porcjo", reason: "звательная форма; на практике не употребляется" }
