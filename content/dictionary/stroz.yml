notes:
  - { kind: false-friend, text: "Польский STRÓŻ — и «сторож», и «страж»: русский различает бытовое и высокое слово, польский обходится одним. NOCNY STRÓŻ — ночной сторож, STRÓŻ PRAWA — страж закона, ANIOŁ STRÓŻ — ангел-хранитель. В гнезде: STRZEC — «беречь, охранять», STRAŻ — «охрана», а STRAŻ POŻARNA — пожарная команда." }
  - { kind: usage, text: "Двенадцать форм, мужской род, лицо. Во множественном две формы: STRÓŻE — обычная, STRÓŻOWIE — торжественная, о стражах закона. В родительном множественного тоже две: STRÓŻÓW и STRÓŻY. Винительный равен родительному: ZAWOŁAĆ STRÓŻA." }
  - { kind: government, text: "Страж закона — STRÓŻ PRAWA, родительный. Быть сторожем — BYĆ STRÓŻEM, творительный. Сторожка — BUDKA STRÓŻA, «будка сторожа»." }
  - { kind: pronunciation, text: "Читается «струш», один слог. Ó звучит как «у», конечное Ż оглушается в «ш». В косвенных формах Ż снова звонкое: STRÓŻA — «стру́жа»." }
  - { kind: register, text: "Слово нейтральное в значении «сторож» и высокое в STRÓŻ PRAWA. Шутливое WYSTROIĆ SIĘ JAK STRÓŻ W BOŻE CIAŁO, «нарядиться, как сторож на праздник Тела Господня», говорят о человеке, разодетом слишком торжественно." }
collocations:
  - { pl: "nocny stróż", ru: "ночной сторож" }
  - { pl: "stróż parkingu", ru: "сторож парковки" }
  - { pl: "budka stróża", ru: "сторожка" }
family:
  - { pl: "strzec", ru: "беречь, охранять", relation: root, id: strzec }
  - { pl: "straż", ru: "охрана, стража", relation: derived, id: straz }
  - { pl: "strażnik", ru: "охранник, стражник", relation: derived, id: straznik }
etymology: "От праславянского корня со значением «стеречь», того же, что в русских «стеречь», «сторож» и «стража». Польское Ó на месте русского «оро» — след полногласия, сжатого в один слог: STRÓŻ и «сторож», как GŁOWA и «голова»."
memory: "Stróż — и сторож, и страж. Читается «струш». Польское stró- отвечает русскому «сторо-», как głowa и «голова». Anioł stróż — ангел-хранитель, stróż prawa — страж закона. Straż pożarna — пожарная команда."
idioms:
  - { pl: "anioł stróż", ru: "ангел-хранитель" }
  - { pl: "stróż prawa", ru: "страж закона" }
  - { pl: "wystroić się jak stróż w Boże Ciało", ru: "разрядиться в пух и прах" }
