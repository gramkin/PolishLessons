# review
id: smigac
format: 2
lemma: "śmigać"
rank: 5973
pos: verb
aspect: imperf
pron: { cyr: "сьми́гаць" }
senses:
  - id: dash
    ru: "разг. носиться, мчаться, гонять (быстро и ловко)"
    examples:
      - pl: "Dzieci śmigają po parku na hulajnogach."
        ru: "Дети гоняют по парку на самокатах."
        source: { kind: authored }
      - pl: "Jaskółki śmigały nisko nad łąką."
        ru: "Ласточки носились низко над лугом."
        source: { kind: authored }
      - pl: "Zimą śmigam na nartach w Zakopanem."
        ru: "Зимой я гоняю на лыжах в Закопане."
        source: { kind: authored }
  - id: run-well
    ru: "разг. работать быстро, «летать» (о технике)"
    examples:
      - pl: "Po naprawie samochód śmiga jak nowy."
        ru: "После ремонта машина летает как новая."
        source: { kind: authored }
      - pl: "Nowy laptop śmiga, aż miło."
        ru: "Новый ноутбук летает — любо-дорого."
        source: { kind: authored }
notes:
  - { kind: register, text: "Разговорное слово с одобрительным оттенком: быстро, ловко, легко. В нейтральной речи — PĘDZIĆ, BIEC, о технике — DZIAŁAĆ SPRAWNIE. ŚMIGAJ! — «беги, давай быстро!»." }
  - { kind: usage, text: "Несовершенный вид; однократное — ŚMIGNĄĆ «промелькнуть, метнуться». Глагол непереходный: страдательных причастий (ŚMIGANY и т. п.) в карточке нет; безличное ŚMIGANO возможно: PO LODZIE ŚMIGANO NA ŁYŻWACH." }
  - { kind: government, text: "На чём — NA + предложный: ŚMIGAĆ NA ROWERZE, NA NARTACH. По чему — PO + предложный: ŚMIGAĆ PO MIEŚCIE. Куда — DO, NA + винительный: ŚMIGAM DO SKLEPU «сгоняю в магазин»." }
  - { kind: pronunciation, text: "Ś — мягкое «сь»: ŚMIGAĆ — «сьми́гаць». Ударение на предпоследнем слоге: ŚMIGAJĄ — «сьмига́йоу̃»." }
collocations:
  - { pl: "śmigać na rowerze", ru: "гонять на велосипеде" }
  - { pl: "śmigać na nartach", ru: "гонять на лыжах" }
  - { pl: "śmigać po mieście", ru: "носиться по городу" }
family:
  - { pl: "śmignąć", ru: "метнуться, промелькнуть", relation: aspect }
  - { pl: "śmigło", ru: "пропеллер, винт", relation: derived }
  - { pl: "śmigłowiec", ru: "вертолёт", relation: derived }
synonyms: ["pędzić", "mknąć"]
etymology: "Звукоподражательный корень быстрого движения со свистом; от него же ŚMIGŁO «пропеллер» и ŚMIGŁOWIEC «вертолёт»."
memory: "Śmigło — «пропеллер», śmigłowiec — «вертолёт»: śmigać — носиться, как пропеллер крутится."
idioms:
  - { pl: "śmigać, aż miło", ru: "летать — любо-дорого (о быстрой езде или технике)" }
