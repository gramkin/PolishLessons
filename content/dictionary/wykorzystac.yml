# review
id: wykorzystac
format: 2
lemma: "wykorzystać"
rank: 1082
pos: verb
aspect: perf
pron: { cyr: "выкожы́стаць" }
senses:
  - id: use
    ru: "использовать, воспользоваться (совершенный вид)"
    examples:
      - pl: "Powinieneś wykorzystać tę szansę."
        ru: "Тебе следует использовать этот шанс."
        source: { kind: translated, id: 362502 }
      - pl: "Jak i do czego można wykorzystać mąkę ryżową?"
        ru: "Как и для чего можно использовать рисовую муку?"
        source: { kind: tatoeba, id: 6155983 }
      - pl: "Wykorzystałem tę szansę."
        ru: "Я использовал этот шанс."
        source: { kind: translated, id: 364067 }
  - id: exploit
    ru: "использовать кого-то в своих целях"
    examples:
      - pl: "Zostałem wykorzystany."
        ru: "Меня использовали."
        source: { kind: translated, id: 8762740 }
      - pl: "Ja nie chcę być wykorzystany."
        ru: "Я не хочу, чтобы меня использовали."
        source: { kind: translated, id: 1370910 }
  - id: seize
    ru: "wykorzystać okazję — воспользоваться случаем"
    examples:
      - pl: "Lepiej wykorzystaj okazję."
        ru: "Лучше используй случай."
        source: { kind: translated, id: 3041384 }
      - pl: "Nie wykorzystała okazji."
        ru: "Она не воспользовалась случаем."
        source: { kind: translated, id: 404059 }
notes:
  - { kind: government, text: "Падеж другой, чем в русском: wykorzystać coś — винительный без предлога, а русское «воспользоваться» требует творительного. Wykorzystać okazję «воспользоваться случаем»." }
  - { kind: usage, text: "Несовершенный вид — wykorzystywać. Собрано из wy- плюс korzystać «пользоваться», от korzyść «польза, выгода»." }
  - { kind: usage, text: "У слова есть и отрицательный оттенок, когда речь о людях: zostałem wykorzystany «меня использовали»." }
  - { kind: usage, text: "Отглагольное существительное wykorzystanie значит «использование»: wykorzystanie energii słonecznej." }
collocations:
  - { pl: "wykorzystać okazję", ru: "воспользоваться случаем" }
  - { pl: "wykorzystać szansę", ru: "использовать шанс" }
  - { pl: "zostać wykorzystanym", ru: "быть использованным" }
  - { pl: "wykorzystanie czegoś", ru: "использование чего-то" }
family:
  - { pl: "wykorzystywać", ru: "использовать (несовершенный вид)", relation: aspect }
  - { pl: "korzystać", ru: "пользоваться", relation: root }
  - { pl: "korzyść", ru: "польза, выгода", relation: root }
etymology: "Приставка wy- плюс korzystać «пользоваться», от korzyść «польза, выгода». Русское «использовать» собрано из других частей, но korzyść — прямая родня русской «корысти», только без отрицательного оттенка."
memory: "wykorzystać — «использовать, воспользоваться». Падеж другой, чем в русском: wykorzystać okazję — винительный без предлога, а «воспользоваться случаем» требует творительного. И помните про оттенок: zostałem wykorzystany значит «меня использовали»."
idioms:
  - { pl: "wykorzystać okazję", ru: "воспользоваться случаем" }
  - { pl: "wykorzystać szansę", ru: "использовать шанс" }
