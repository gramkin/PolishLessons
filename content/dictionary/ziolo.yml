# review
id: ziolo
format: 2
lemma: "zioło"
rank: 4527
pos: noun
pron: { cyr: "зё́уо" }
senses:
  - id: herb
    ru: "трава, лекарственное растение"
    examples:
      - pl: "Bazylia to zioło, bazylika to kościół."
        ru: "Базилик — это трава, базилика — это церковь."
        source: { kind: translated, id: 13417162 }
      - pl: "To zioło leczy kaszel."
        ru: "Эта трава лечит кашель."
        source: { kind: authored }
      - pl: "Każde zioło ma swoją porę."
        ru: "У каждой травы своё время."
        source: { kind: authored }
  - id: herbs
    ru: "травы (обычно во множественном числе)"
    examples:
      - pl: "Zbierała zioła w lesie."
        ru: "Она собирала травы в лесу."
        source: { kind: authored }
      - pl: "Herbata z ziół jest zdrowa."
        ru: "Чай из трав полезен."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Чаще всего во множественном числе: zioła «травы, лекарственные травы». Отсюда herbata ziołowa «травяной чай»." }
  - { kind: false-friend, text: "Не путайте со zło «зло» — разные слова. zioło это растение." }
  - { kind: government, text: "Средний род: to zioło, tego zioła, te zioła." }
  - { kind: usage, text: "В разговорной речи zioło значит ещё и марихуану — ровно как русское «трава». Именно в этом значении слово попадается в корпусе." }
collocations:
  - { pl: "lecznicze zioła", ru: "лекарственные травы" }
  - { pl: "herbata z ziół", ru: "травяной чай" }
etymology: "Праславянское *zelo «трава, зелье»; ср. русское «зелье» и «зелёный»."
memory: "zioło — «трава» лекарственная, чаще во множественном: zioła. Корень тот же, что в русском «зелье», «зелёный». Не путайте со zło «зло»."
idioms:
  - { pl: "lecznicze zioła", ru: "лекарственные травы" }
