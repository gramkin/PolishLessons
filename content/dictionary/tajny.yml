# review
id: tajny
format: 2
lemma: "tajny"
rank: 1400
pos: adj
pron: { cyr: "та́йны" }
senses:
  - id: secret
    ru: "тайный, секретный"
    examples:
      - pl: "To jest tajne."
        ru: "Это секретно."
        source: { kind: translated, id: 600352 }
      - pl: "Mieliśmy tajne spotkanie."
        ru: "У нас была тайная встреча."
        source: { kind: translated, id: 6554269 }
      - pl: "Tajna misja."
        ru: "Тайная миссия."
        source: { kind: translated, id: 13030192 }
  - id: classified
    ru: "ściśle tajne — совершенно секретно"
    examples:
      - pl: "W normalnych okolicznościach było by to ściśle tajne."
        ru: "При обычных обстоятельствах это было бы совершенно секретно."
        source: { kind: translated, id: 13030168 }
      - pl: "Czy to jakiś rodzaj tajnego kodu?"
        ru: "Это какой-то тайный код?"
        source: { kind: translated, id: 13081141 }
      - pl: "Tom pracuje nad czymś tajnym."
        ru: "Том работает над чем-то секретным."
        source: { kind: translated, id: 3778884 }
notes:
  - { kind: usage, text: "Форма tajniejsi оставлена без примеров: tajny не градуируется — документ либо секретный, либо нет, «более секретным» он не бывает. При необходимости говорят ściśle tajny «совершенно секретный». Живая мужско-личная форма — tajni: tajni współpracownicy «тайные сотрудники»." }
  - { kind: usage, text: "Ściśle tajne — «совершенно секретно», стандартный гриф на документах." }
  - { kind: usage, text: "Прилагательное от tajemnica «тайна», карточка которой уже есть. Рядом стоит tajemniczy «таинственный»." }
  - { kind: false-friend, text: "Tajny — «секретный, закрытый для посторонних», а tajemniczy — «загадочный, таинственный». Русское «тайный» покрывает оба." }
  - { kind: pronunciation, text: "Ударение на первый слог: та́йны. Сочетание -jn- произносится как «-йн-»." }
collocations:
  - { pl: "ściśle tajne", ru: "совершенно секретно" }
  - { pl: "tajna misja", ru: "тайная миссия" }
  - { pl: "tajne spotkanie", ru: "тайная встреча" }
etymology: "От tajemnica «тайна», из праславянского *tajьnъ. Русское «тайный» — то же слово."
memory: "tajny — «тайный, секретный»: ściśle tajne «совершенно секретно». Не путайте с tajemniczy «таинственный, загадочный» — русское «тайный» покрывает оба смысла, а польский их разводит."
idioms:
  - { pl: "ściśle tajne", ru: "совершенно секретно" }
  - { pl: "tajna misja", ru: "тайная миссия" }
  - { pl: "tajne spotkanie", ru: "тайная встреча" }
