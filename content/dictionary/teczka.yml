etymology: "Уменьшительное от TEKA «папка, портфель», из греческого слова «хранилище». Тот же корень в словах «библиотека» и «аптека»: хранилище книг и лекарств."
memory: "Teczka — папка, портфель, досье. Читается «тэ́чка». Teczka na dokumenty — папка для документов. Teka ministra — министерский портфель."
idioms:
  - { pl: "teka ministra", ru: "министерский портфель" }
