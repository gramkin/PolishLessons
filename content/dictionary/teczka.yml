notes:
  - { kind: false-friend, text: "TECZKA — «папка» или «портфель», а не «тачка» (тачка — TACZKA). В новейшей истории Польши TECZKA — ещё и досье тайной полиции: MIEĆ TECZKĘ, «иметь досье»." }
  - { kind: usage, text: "Девять живых форм, женский род. Перед E K переходит в C: W TECZCE. Родительный множественного — TECZEK. Звательный не даётся." }
  - { kind: government, text: "Папка для документов — TECZKA NA DOKUMENTY, NA с винительным, где в русском «для». В папке — W TECZCE. Личное дело — TECZKA OSOBOWA." }
  - { kind: pronunciation, text: "Читается «тэ́чка», ударение на первом слоге. TE — твёрдое «тэ», CZ — «ч»." }
collocations:
  - { pl: "teczka na dokumenty", ru: "папка для документов" }
  - { pl: "skórzana teczka", ru: "кожаный портфель" }
  - { pl: "teczka osobowa", ru: "личное дело" }
family:
