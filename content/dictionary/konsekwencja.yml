notes:
  - { kind: false-friend, text: "ОДНО ПОЛЬСКОЕ СЛОВО НА ДВА РУССКИХ, И РУССКОГО «КОНСЕКВЕНЦИИ» В ОБИХОДЕ НЕТ. KONSEKWENCJA значит и «последствие» — ponieść konsekwencje, — и «последовательность, настойчивость» — działać z konsekwencją. Выбирать приходится по контексту: если за поступком следует расплата, это последствие; если речь о характере, это последовательность." }
  - { kind: usage, text: "Ещё одно существительное класса на -ja, как komisja и obsesja, и родительный множественного у него тоже двойной: обычное KONSEKWENCJI и старое книжное KONSEKWENCYJ. Прилагательное konsekwentny значит «последовательный», а не «вытекающий»." }
  - { kind: pronunciation, text: "Пять слогов, ударение на предпоследнем: kon-se-kwen-CJA, точнее kon-se-KWEN-cja. Kw читается как кв, cj как «ць» с проскальзывающим й: «консэквэ́нця»." }
collocations:
  - { pl: "ponieść konsekwencje", ru: "понести последствия" }
  - { pl: "z konsekwencją", ru: "последовательно" }
  - { pl: "wyciągnąć konsekwencje", ru: "сделать выводы" }
family:
  - { pl: "konsekwentny", ru: "последовательный", relation: derived }
  - { pl: "skutek", ru: "следствие, результат", relation: root, id: skutek }
  - { pl: "wynik", ru: "результат", relation: root, id: wynik }
etymology: "Из латинского consequentia «следование», от consequi «следовать за чем-то», сложения con- «вместе» и sequi «следовать». Отсюда и значение последствия, и значение последовательности: оба выросли из идеи следования. Корень sequi виден в «секвенции» и «консенсусе»."
memory: "konsekwencja — и «последствие», и «последовательность»: ponieść konsekwencje против działać z konsekwencją. Русского «консеквенции» в обиходе нет, так что выбирай по смыслу. Родительный множественного двойной: konsekwencji и konsekwencyj."
idioms:
