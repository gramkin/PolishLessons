# review
id: przypominac
format: 2
lemma: "przypominać"
rank: 862
pos: verb
aspect: imperf
pron: { cyr: "пшыпоми́наць" }
senses:
  - id: remind
    ru: "напоминать (кому-л. о чём-л.)"
    examples:
      - pl: "Czy to coś ci przypomina?"
        ru: "Это тебе о чём-то напоминает?"
        source: { kind: tatoeba, id: 6114719 }
      - pl: "Dlaczego muszę ci przypominać o pracy domowej?"
        ru: "Почему я должен напоминать тебе о домашнем задании?"
        source: { kind: translated, id: 968977 }
      - pl: "Nie przypominaj mi."
        ru: "Не напоминай мне."
        source: { kind: translated, id: 2202242 }
  - id: resemble
    ru: "быть похожим, напоминать (кого-л., что-л.) — винительный без предлога"
    note: "Тут предлога нет вовсе: przypominam matkę «я похож на мать»."
    examples:
      - pl: "Twój szczeniak przypomina pluszowego misia."
        ru: "Твой щенок похож на плюшевого мишку."
        source: { kind: tatoeba, id: 13547188 }
      - pl: "Przypominam moją matkę."
        ru: "Я похож на свою мать."
        source: { kind: translated, id: 524645 }
      - pl: "Z daleka, ta skała przypominała ludzką twarz."
        ru: "Издалека эта скала напоминала человеческое лицо."
        source: { kind: translated, id: 892354 }
  - id: recall
    ru: "przypominać sobie — вспоминать"
    examples:
      - pl: "Nie przypominam sobie."
        ru: "Я не припоминаю."
        source: { kind: translated, id: 5927581 }
      - pl: "Dlaczego przypominasz sobie o tym właśnie teraz?"
        ru: "Почему ты об этом вспомнила именно сейчас?"
        source: { kind: tatoeba, id: 12680429 }
      - pl: "Zaczynam sobie przypominać."
        ru: "Я начинаю вспоминать."
        source: { kind: translated, id: 538488 }
notes:
  - { kind: government, text: "Два разных управления, и их легко перепутать. «Напоминать кому-то о чём-то» — przypominać komuś O czymś, с дательным и предложным. «Быть похожим на кого-то» — przypominać kogoś, чистый винительный без предлога: Przypominasz mi kogoś «Ты мне кого-то напоминаешь»." }
  - { kind: usage, text: "Русское «напоминать на» невозможно: там, где русский скажет «похож НА мать», поляк скажет просто przypomina matkę." }
  - { kind: usage, text: "przypominać sobie значит «вспоминать»: Nie przypominam sobie «Я не припоминаю». Без sobie этого значения нет." }
  - { kind: usage, text: "Совершенный вид — przypomnieć. Существительное przypomnienie «напоминание», а корень тот же, что в pamięć «память»." }
collocations:
  - { pl: "przypominać sobie", ru: "вспоминать" }
  - { pl: "przypominasz mi kogoś", ru: "ты мне кого-то напоминаешь" }
  - { pl: "przypominać o czymś", ru: "напоминать о чём-то" }
  - { pl: "nie przypominam sobie", ru: "не припоминаю" }
family:
  - { pl: "przypomnieć", ru: "напомнить", relation: aspect }
  - { pl: "przypomnienie", ru: "напоминание", relation: derived }
  - { pl: "pamięć", ru: "память", relation: root }
etymology: "Из przy- + pominać, от того же корня, что pamięć «память» и pomnieć «помнить». Русское «напоминать» собрано так же, от «помнить»."
memory: "przypominać — и «напоминать», и «быть похожим». Управление при этом разное: przypominać komuś O czymś «напоминать кому-то о чём-то», но przypominać kogoś «быть похожим на кого-то» — без всякого предлога. Przypominam moją matkę значит «Я похож на свою мать». А с sobie глагол значит «вспоминать»."
idioms:
  - { pl: "przypominać sobie", ru: "вспоминать" }
  - { pl: "nie przypominam sobie", ru: "не припоминаю" }
  - { pl: "przypominasz mi kogoś", ru: "ты мне кого-то напоминаешь" }
