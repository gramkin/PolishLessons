etymology: "От SZCZEGÓŁ «деталь, частность», из праславянского корня со значением «отдельный, расщеплённый». Логика та же, что в русском «частный» от «часть»: то, что выделено из целого, становится особым. Отсюда и два расходящихся потомка — szczególny «выделяющийся, особый» и szczegółowy «идущий по деталям, подробный»."
memory: "Не путай пару: SZCZEGÓLNY — «особый», SZCZEGÓŁOWY — «подробный». И запомни готовый оборот W SZCZEGÓLNOŚCI «в частности», ради которого это слово чаще всего и встречается."
idioms:
