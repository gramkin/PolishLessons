notes:
  - { kind: false-friend, text: "ГЛАВНАЯ ОПАСНОСТЬ НЕ В РУССКОМ, А ВНУТРИ ПОЛЬСКОГО. Рядом стоят два почти одинаковых слова от корня SZCZEGÓŁ «деталь»: SZCZEGÓLNY значит «особый, особенный», а SZCZEGÓŁOWY — «подробный, детальный». Szczegółowy raport — подробный отчёт; szczególny raport — отчёт необычный, выделяющийся. Перепутать их легко, а смысл меняется полностью." }
  - { kind: usage, text: "W SZCZEGÓLNOŚCI — «в частности», устойчивый оборот канцелярского и научного языка, едва ли не самая частая встреча с этим корнем. Формально это уже не прилагательное, а предложный падеж производного существительного SZCZEGÓLNOŚĆ «особенность», поэтому в таблице форм szczególny его не ищи. Рядом живёт SZCZEGÓLNIE «особенно»: szczególnie zimą «особенно зимой». Оба держатся на одном прилагательном, и оба стоит выучить как готовые формулы." }
  - { kind: usage, text: "Степени сравнения SZCZEGÓLNIEJSZY и NAJSZCZEGÓLNIEJSZY грамматически существуют, и словарь форм их даёт, но в живой речи они почти не встречаются: признак «особый» плохо поддаётся градации. Поляк скорее скажет BARDZIEJ SZCZEGÓLNY или подберёт другое слово. Знать их стоит, употреблять — осторожно." }
