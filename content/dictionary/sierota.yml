notes:
  - { kind: usage, text: "Слово устроено так же странно, как SŁUGA, и так же странно, как русская «сирота»: род мужской или женский по человеку, а склонение женское. Говорят BIEDNY SIEROTA о мальчике и BIEDNA SIEROTA о девочке, но падежи в обоих случаях женские: SIEROTY, SIEROCIE, SIEROTĘ, SIEROTĄ. Русский делает ровно то же самое, «бедный сирота» при «сироты, сироте, сироту», так что заучивать нечего. Двенадцать форм, и среди них два родительных множественного, SIEROT и устаревшее SIERÓT." }
  - { kind: false-friend, text: "Значение совпадает с русским полностью, а вот разговорное употребление удивляет. NIE BĄDŹ SIEROTĄ значит не «не будь сиротой», а «не раскисай, не строй из себя беспомощного», и это обычный дружеский упрёк. В том же духе звучит SIEROTA ŻYCIOWA — человек, не умеющий устроиться в жизни. Русское «сирота» такого оттенка почти не имеет, кроме устойчивого «сирота казанская», и именно это выражение ближе всего по тону." }
  - { kind: government, text: "Сирота после кого — предлог PO с местным падежом: SIEROTA PO ŻOŁNIERZU «сирота погибшего солдата», и это официальная формула в документах. Воспитываться у кого — WYCHOWYWAĆ SIĘ U KOGOŚ, предлог U с родительным, как и по-русски. Дом для сирот — DOM DLA SIEROT, предлог DLA с родительным, хотя современное официальное название другое: DOM DZIECKA, буквально «дом ребёнка»." }
  - { kind: pronunciation, text: "Читается «серо́та», три слога, ударение на втором. Сочетание SIE даёт мягкое «се», где I только знак мягкости, а не отдельный гласный, поэтому слогов три, а не четыре. В предложном SIEROCIE появляется мягкое «че»: «серо́че», потому что T перед окончанием -E переходит в CI. Это то же чередование, что в KOBIETA и KOBIECIE." }
  - { kind: register, text: "В прямом значении слово нейтральное, но слегка книжное: в современных документах пишут DZIECKO OSIEROCONE или просто говорят о DOM DZIECKA. В разговорном значении слово живое и чуть насмешливое: NIE BĄDŹ SIEROTĄ. Прилагательное SIEROCY значит «сиротский»: SIEROCY LOS «сиротская доля». Глагол OSIEROCIĆ значит «осиротить», а OSIEROCONY — «осиротевший»." }
