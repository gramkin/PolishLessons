etymology: "От праславянского *sirota, то есть то же слово, что русская «сирота», и значение не сдвинулось. Общим оказался и грамматический курьёз: существительное обозначает человека любого пола, согласуется по полу, а склоняется по женскому образцу. Оба языка унаследовали эту схему от праславянского и сохранили её до сих пор, и по той же схеме идут SŁUGA и «слуга», KALEKA и «калека». Корень связан с прилагательным, означавшим «одинокий, лишённый», и от него же SIEROCY и OSIEROCIĆ."
memory: "То же слово, что «сирота», и с тем же курьёзом: род по человеку, а склонение женское, biedny sierota но sieroty, sierocie, sierotę. Русский делает так же, так что запоминать нечего; та же схема у sługa. Двенадцать форм, два родительных множественного, sierot и устаревшее sierót. Разговорное значение неожиданное: nie bądź sierotą значит «не раскисай». Читается «серо́та», где sie это один слог «се»."
idioms:
  - { pl: "nie bądź sierotą", ru: "не раскисай" }
