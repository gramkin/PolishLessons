        ru: "Лифт зажал нас между этажами."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Корень здесь тот же, что в русском «вязать», и это стоит заметить, потому что иначе слово кажется совсем чужим. WIĘZIĆ — «держать в неволе», WIĘZIEŃ — «узник, заключённый», WIĘZIENIE — «тюрьма», а WIĄZAĆ — «вязать, связывать». То есть узник — это буквально «связанный», как и русское «узник» от «узы». Русскому помогает именно эта пара: «узы» и «вязать» того же корня, и польское WIĘZIENIE встаёт в тот же ряд." }
  - { kind: pronunciation, text: "Первое лицо единственного числа меняет z на ż: UWIĘZIĆ даёт UWIĘŻĘ, тогда как остальные личные формы держат z — UWIĘZISZ, UWIĘZI, UWIĘZIMY. Это та же мена, что у NOSIĆ (NOSZĘ при NOSISZ) и WOZIĆ (WOŻĘ при WOZISZ), то есть класс основ на ś, ź, ść, źdź, суженный в карточке ZŁOŚCIĆ. Корень вдобавок играет двумя носовыми: WIĄZAĆ с ą, но WIĘZIĆ, WIĘZIEŃ, WIĘZIENIE с ę. Это старое чередование долгих и кратких носовых, и в русском ему отвечает мена «вяз-» и «уз-». Сама носовая ę перед z читается как «эн»: UWIĘZIĆ звучит «уве́нзиць». Повелительное UWIĘŹ оканчивается на мягкий ź." }
  - { kind: government, text: "Кого — винительный: UWIĘZIĆ KOGOŚ. Где — предлог W с местным: W PIWNICY, W WIĘZIENIU, W SCHRONIE. На сколько — винительный без предлога: NA DWA LATA берёт предлог NA, а DWA LATA без него тоже встречается. В значении завала подлежащее неодушевлённое: LAWINA UWIĘZIŁA ICH, WINDA UWIĘZIŁA NAS — и русский строит так же, «лавина заперла их»." }
  - { kind: usage, text: "Слово книжное и газетное: в быту о тюрьме скажут SIEDZI или POSIEDZIAŁ, как разбиралось в карточке POSIEDZIEĆ, а UWIĘZIĆ встречается в репортаже, в истории, в юридическом тексте. Несовершенная пара — WIĘZIĆ. Зато производные совершенно обиходны: WIĘZIENIE «тюрьма», WIĘZIEŃ «заключённый», и оборот UWIĘZIONY W WINDZIE — готовая фраза из новостей." }
collocations:
  - { pl: "uwięzić w piwnicy", ru: "запереть в подвале" }
  - { pl: "uwięziony w windzie", ru: "запертый в лифте" }
  - { pl: "trafić do więzienia", ru: "попасть в тюрьму" }
family:
  - { pl: "więzić", ru: "держать в неволе", relation: aspect, id: wiezic }
  - { pl: "więzienie", ru: "тюрьма", relation: derived, id: wiezienie }
  - { pl: "wiązać", ru: "вязать, связывать", relation: root }
etymology: "Приставка u- и WIĘZIĆ, из праславянского *vęziti «держать в узах», от того же корня *vęz-, что WIĄZAĆ «вязать» и русские «вязать», «узы», «узник». Связь прямая и старая: узник — связанный, а тюрьма — место, где держат в узах, откуда польское WIĘZIENIE. Русский развёл эти слова по двум огласовкам, «вяз-» и «уз-», польский сохранил одну, więz-/wiąz-, и потому его гнездо выглядит стройнее: WIĄZAĆ, WIĘZIĆ, WIĘZIEŃ, WIĘZIENIE, WIĘŹ «связь»."
memory: "Корень тот же, что «вязать» и «узы»: więzień — буквально «связанный», więzienie — «тюрьма». И чередование ą/ę: wiązać, но więzić."
idioms:
