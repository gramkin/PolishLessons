notes:
  - { kind: false-friend, text: "BANKNOT — «банкнота, купюра», но мужского рода: TEN BANKNOT. Монета — MONETA, наличные — GOTÓWKA. В разговоре купюру часто зовут по номиналу: STÓWA, «сотка»." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Родительный — BANKNOTU. В местном T переходит в C: NA BANKNOCIE." }
  - { kind: government, text: "Заплатить купюрой — ZAPŁACIĆ BANKNOTEM, творительный. Купюра в сто злотых — BANKNOT STUZŁOTOWY или BANKNOT O NOMINALE STU ZŁOTYCH." }
  - { kind: pronunciation, text: "Читается «ба́нкнот», ударение на первом слоге. BANKNOCIE — «банкно́це»." }
collocations:
