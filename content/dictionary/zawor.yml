# review
id: zawor
format: 2
lemma: "zawór"
rank: 2093
pos: noun
pron: { cyr: "за́вур" }
senses:
  - id: valve
    ru: "вентиль, клапан"
    examples:
      - pl: "Zamknąłeś ten zawór?"
        ru: "Ты закрыл этот вентиль?"
        source: { kind: translated, id: 3960460 }
      - pl: "Zawór bezpieczeństwa zadziałał."
        ru: "Предохранительный клапан сработал."
        source: { kind: authored }
      - pl: "Trzeba wymienić zawór."
        ru: "Нужно заменить клапан."
        source: { kind: authored }
  - id: outlet
    ru: "отдушина, клапан (переносное)"
    examples:
      - pl: "Sport to dla niego zawór bezpieczeństwa."
        ru: "Спорт для него — предохранительный клапан."
        source: { kind: authored }
      - pl: "Potrzebny jest jakiś zawór dla emocji."
        ru: "Нужна какая-то отдушина для эмоций."
        source: { kind: authored }
notes:
  - { kind: government, text: "Мужской неодушевлённый; родительный — zaworu. В корне ó, которое в косвенных падежах переходит в o: zawór, zaworu." }
  - { kind: false-friend, text: "Не «завор» и не «затвор». Слово от zawierać «закрывать, содержать», корень wrzeć/wór — тот же, что в отворить, затвор." }
  - { kind: usage, text: "zawór bezpieczeństwa «предохранительный клапан» работает и буквально, и переносно — как русская «отдушина»." }
  - { kind: usage, text: "В корпусе встречается один раз, поэтому большинство примеров составлено вручную." }
collocations:
  - { pl: "zawór bezpieczeństwa", ru: "предохранительный клапан" }
  - { pl: "zamknąć zawór", ru: "закрыть вентиль" }
etymology: "От zawierać «закрывать», корень *werti «запирать»; ср. русское «затвор», «отворить»."
memory: "zawór — «вентиль, клапан», от zawierać «закрывать». Чередование ó/o: zawór, но zaworu. Оборот zawór bezpieczeństwa работает и буквально, и как «отдушина»."
idioms:
  - { pl: "zawór bezpieczeństwa", ru: "предохранительный клапан" }
