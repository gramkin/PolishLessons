notes:
  - { kind: government, text: "Мужской неодушевлённый; родительный — zaworu. В корне ó, которое в косвенных падежах переходит в o: zawór, zaworu." }
  - { kind: false-friend, text: "Не «завор» и не «затвор». Слово от zawierać «закрывать, содержать», корень wrzeć/wór — тот же, что в отворить, затвор." }
  - { kind: usage, text: "zawór bezpieczeństwa «предохранительный клапан» работает и буквально, и переносно — как русская «отдушина»." }
  - { kind: usage, text: "В корпусе встречается один раз, поэтому большинство примеров составлено вручную." }
collocations:
