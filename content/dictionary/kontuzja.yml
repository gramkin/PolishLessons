# review
id: kontuzja
format: 2
lemma: "kontuzja"
rank: 5744
pos: noun
pron: { cyr: "конту́зья" }
senses:
  - id: injury
    ru: "травма"
    examples:
      - pl: "Kontuzja wykluczyła go z meczu."
        ru: "Травма исключила его из матча."
        source: { kind: authored }
      - pl: "Kontuzja okazała się poważna."
        ru: "Травма оказалась серьёзной."
        source: { kind: authored }
      - pl: "Wrócił do gry po kontuzji."
        ru: "Он вернулся в игру после травмы."
