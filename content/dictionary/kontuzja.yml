  - id: sports-injury
    ru: "спортивное повреждение"
    examples:
      - pl: "Uległ kontuzji na treningu."
        ru: "Он получил травму на тренировке."
        source: { kind: authored }
      - pl: "Lekka kontuzja nie wymaga operacji."
        ru: "Лёгкая травма не требует операции."
        source: { kind: authored }
notes:
  - { kind: government, text: "Женский род: kontuzja, kontuzji, kontuzję. Оборот ulec kontuzji «получить травму» требует дательного падежа после ulec." }
  - { kind: usage, text: "Чаще всего о спорте и о теле: kontuzja kolana, barku, nogi." }
  - { kind: usage, text: "Частые глаголы: ulec kontuzji, mieć kontuzję, wrócić po kontuzji, leczyć kontuzję." }
  - { kind: false-friend, text: "Ложный друг: русское «контузия» — поражение взрывной волной, а польское kontuzja это любая травма, чаще всего спортивная. Перевод «контузия» здесь почти всегда ошибка." }
collocations:
  - { pl: "ulec kontuzji", ru: "получить травму" }
  - { pl: "poważna kontuzja", ru: "серьёзная травма" }
  - { pl: "kontuzja kolana", ru: "травма колена" }
family:
  - { pl: "kontuzjowany", ru: "травмированный", relation: derived }
  - { pl: "ciało", ru: "тело", relation: root, id: cialo }
etymology: "Через латинское contusio «ушиб» от contundere «разбивать». Русское «контузия» — то же слово, но русский сузил его до поражения взрывной волной, а польский сохранил общее значение «травма»."
memory: "kontuzja — любая травма, чаще спортивная, а не «контузия» в русском смысле. Ulec kontuzji «получить травму» идёт с дательным падежом."
idioms:
  - { pl: "ulec kontuzji", ru: "получить травму" }
formExamplesSkip:
  - { form: "kontuzyj", reason: "дореформенный родительный падеж множественного числа: до 1936 года на месте нынешнего -ii/-ji писали -yj после c, s, z. Нормой остаётся kontuzji, а kontuzyj встречается только в старых текстах. По этому же основанию отказано формам teoryj, racyj, seryj и reakcyj" }
