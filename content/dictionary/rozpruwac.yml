notes:
  - { kind: usage, text: "Несовершенный вид; совершенный — ROZPRUĆ: ROZPRUŁA SZEW «распорола шов». Спряжение на -AM: ROZPRUWAM, ROZPRUWASZ, ROZPRUWAJĄ. Мужско-личное страдательное ROZPRUWANI в карточку не включено: распарывают швы, мешки и сейфы, а не людей." }
  - { kind: false-friend, text: "Корень PRUĆ — русское «пороть» в значении «распарывать шов», а не «сечь розгами». «Пороть ребёнка» по-польски — LAĆ, BIĆ PASEM. ROZPRUWAĆ — «распарывать, вспарывать»." }
  - { kind: government, text: "Что — винительный: ROZPRUWAĆ SZEW, PODSZEWKĘ, WOREK. Чем — творительный: ROZPRUWAĆ NOŻYCZKAMI, NOŻEM. С SIĘ — «расползаться по шву»: SPODNIE SIĘ ROZPRUWAJĄ." }
  - { kind: pronunciation, text: "Читается «роспру́ваць»: Z перед P оглушается в «с». Ударение на предпоследнем слоге: ROZPRUWAM — «роспру́вам»." }
collocations:
  - { pl: "rozpruwać szew", ru: "распарывать шов" }
  - { pl: "rozpruwać podszewkę", ru: "распарывать подкладку" }
  - { pl: "rozpruwać worek", ru: "вспарывать мешок" }
family:
  - { pl: "rozpruć", ru: "распороть, вспороть", relation: aspect }
  - { pl: "pruć", ru: "пороть, распарывать", relation: root }
  - { pl: "rozpruwacz", ru: "взломщик сейфов, медвежатник", relation: derived }
  - { pl: "szew", ru: "шов", relation: root, id: szew }
etymology: "Приставка ROZ- «рас-» плюс PRUĆ «пороть (шов)», праславянское *porti, то же, что русское «пороть», «распороть»."
memory: "Roz- = рас-, pruć = пороть: rozpruwać — распарывать. Krawcowa rozpruwa szew."
