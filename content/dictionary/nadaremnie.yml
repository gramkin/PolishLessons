        source: { kind: authored }
notes:
  - { kind: usage, text: "Слово книжное. В обычной речи скажут na próżno или bez skutku." }
  - { kind: false-friend, text: "От daremny «напрасный», а тот от darmo «даром, бесплатно». Русское «даром» и «задаром» — та же семья, и значение «впустую» развилось одинаково." }
  - { kind: government, text: "Наречие, не изменяется. Прилагательное — nadaremny." }
  - { kind: usage, text: "Знакомая формула из заповеди: nie wzywaj imienia Bożego nadaremnie. В корпусе наречие не встречается, примеры составлены вручную." }
