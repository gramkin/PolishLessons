etymology: "От daremny «напрасный», от darmo «даром»; русское «даром, задаром» — та же семья."
memory: "nadaremnie — книжное «напрасно, тщетно». В разговоре скажут na próżno. Корень darmo «даром», как в русском «задаром»."
