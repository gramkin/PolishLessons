# review
id: oficjalnie
format: 2
lemma: "oficjalnie"
rank: 2451
pos: adv
pron: { cyr: "офіця́льне" }
senses:
  - id: officially
    ru: "официально"
    examples:
      - pl: "Oficjalnie nic się nie stało."
        ru: "Официально ничего не произошло."
        source: { kind: authored }
      - pl: "Wyniki ogłoszono oficjalnie."
        ru: "Результаты объявили официально."
        source: { kind: authored }
  - id: formally
    ru: "официально, холодно, по-казённому"
    examples:
      - pl: "Przywitał nas bardzo oficjalnie."
        ru: "Он поздоровался с нами очень официально."
        source: { kind: authored }
      - pl: "Zabrzmiało to oficjalniej, niż chciał."
        ru: "Это прозвучало официальнее, чем он хотел."
        source: { kind: authored }
  - id: on-the-record
    ru: "официально, для протокола"
    examples:
      - pl: "Oficjalnie potwierdzono datę wyborów."
        ru: "Официально подтвердили дату выборов."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "У ПОЛЬСКОГО СЛОВА ЕСТЬ ВТОРОЙ, НЕПРИЯТНЫЙ ОТТЕНОК. Oficjalnie значит не только «официально», но и «сухо, натянуто, без тепла»: przywitał się oficjalnie означает, что человек держал дистанцию. Русское «официально» такого упрёка почти не несёт, и эту краску легко не услышать." }
  - { kind: usage, text: "Степени сравнения oficjalniej и najoficjalniej работают только во втором смысле — о манере. Нельзя быть «официальнее» в смысле юридической силы, зато можно держаться официальнее. Противоположность в этом смысле — serdecznie «радушно», а не nieoficjalnie." }
  - { kind: pronunciation, text: "Четыре слога, ударение на предпоследнем: o-fi-cjal-NIE, точнее o-fi-CJAL-nie. Cj читается как «ць» с проскальзывающим й, ni как нь: «офіця́льне»." }
collocations:
  - { pl: "oficjalnie potwierdzić", ru: "официально подтвердить" }
  - { pl: "oficjalnie ogłosić", ru: "официально объявить" }
  - { pl: "zachowywać się oficjalnie", ru: "держаться официально" }
family:
  - { pl: "oficjalny", ru: "официальный", relation: root }
  - { pl: "urząd", ru: "ведомство, учреждение", relation: root }
  - { pl: "serdecznie", ru: "радушно, сердечно", relation: antonym }
etymology: "От oficjalny, из латинского officialis «служебный», от officium «служба, долг». То же слово дало русское «официальный». Латинское officium — сращение opus «дело» и facere «делать», буквально «делание дела»."
memory: "oficjalnie — «официально», но держи в уме второй смысл: «сухо, натянуто». Przywitał się oficjalnie значит, что человек держал дистанцию. Степени oficjalniej и najoficjalniej относятся только к манере."
idioms:
  - { pl: "oficjalnie rzecz biorąc", ru: "официально говоря" }
  - { pl: "tylko oficjalnie", ru: "лишь формально" }
