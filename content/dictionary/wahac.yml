# review
id: wahac
format: 2
lemma: "wahać"
rank: 2229
pos: verb
aspect: imperf
pron: { cyr: "ва́хаць" }
senses:
  - id: hesitate
    ru: "колебаться, медлить (wahać się)"
    examples:
      - pl: "Wahał się czy powiedzieć jej prawdę."
        ru: "Он колебался, сказать ли ей правду."
        source: { kind: tatoeba, id: 7303731 }
      - pl: "Kto się waha, przegrywa."
        ru: "Кто колеблется, тот проигрывает."
        source: { kind: translated, id: 713557 }
      - pl: "Nie wahaj się. Powiedz!"
        ru: "Не колеблись. Говори!"
        source: { kind: translated, id: 1169104 }
  - id: fluctuate
    ru: "колебаться (о цене, температуре)"
    examples:
      - pl: "Cena złota waha się każdego dnia."
        ru: "Цена золота колеблется каждый день."
        source: { kind: translated, id: 12562316 }
      - pl: "Koszty wycieczki wahają się w granicach od 1000 do 2000 dolarów."
        ru: "Стоимость поездки колеблется от 1000 до 2000 долларов."
        source: { kind: translated, id: 676781 }
notes:
  - { kind: government, text: "Всегда с się. Колебаться, делать ли что-то — czy с придаточным: wahał się, czy powiedzieć. Колебаться между — między с творительным." }
  - { kind: usage, text: "Оба значения — человеческое сомнение и физическое колебание величины — совпадают с русским «колебаться»." }
  - { kind: usage, text: "bez wahania «без колебания» — очень частый оборот с родительным падежом." }
  - { kind: false-friend, text: "Корень тот же, что в wahadło «маятник»; ср. русское «вахать»? Нет — русское соответствие «колебаться» иного корня, но образ качания общий." }
collocations:
  - { pl: "wahać się", ru: "колебаться" }
  - { pl: "bez wahania", ru: "без колебания" }
etymology: "От wahadło «маятник», образ качания; русское «колебаться» несёт тот же образ."
memory: "wahać się — «колебаться», и о человеке, и о цене. Запомните bez wahania «без колебания» с родительным падежом."
idioms:
  - { pl: "wahać się", ru: "колебаться" }
  - { pl: "bez wahania", ru: "без колебания" }
