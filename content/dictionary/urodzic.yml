# review
id: urodzic
format: 2
lemma: "urodzić"
rank: 882
pos: verb
aspect: perf
pron: { cyr: "уро́дзиць" }
senses:
  - id: be-born
    ru: "urodzić się — родиться"
    note: "В этом значении глагол всегда с się."
    examples:
      - pl: "Gdzie się pan urodził?"
        ru: "Где вы родились?"
        source: { kind: tatoeba, id: 706923 }
      - pl: "Urodził się w Szwajcarii."
        ru: "Он родился в Швейцарии."
        source: { kind: tatoeba, id: 2998329 }
      - pl: "Gdzie się urodziłeś?"
        ru: "Где ты родился?"
        source: { kind: tatoeba, id: 623160 }
  - id: give-birth
    ru: "родить (кого-л.)"
    examples:
      - pl: "Ona wkrótce urodzi."
        ru: "Она скоро родит."
        source: { kind: translated, id: 4735266 }
      - pl: "Kiedyś wyjdę za mąż i urodzę, ale na razie chcę żyć dla siebie."
        ru: "Когда-нибудь я выйду замуж и рожу, но пока хочу пожить для себя."
        source: { kind: translated, id: 3005177 }
      - pl: "Tomowi urodziło się dziecko."
        ru: "У Тома родился ребёнок."
        source: { kind: tatoeba, id: 12470091 }
  - id: born-adj
    ru: "urodzony — прирождённый, урождённый"
    examples:
      - pl: "Człowiek urodzony w Hiszpanii to Hiszpan."
        ru: "Человек, родившийся в Испании - испанец."
        source: { kind: tatoeba, id: 1576489 }
      - pl: "To urodzony poeta."
        ru: "Это прирождённый поэт."
        source: { kind: translated, id: 818772 }
      - pl: "Tom jest urodzonym artystą."
        ru: "Том прирождённый артист."
        source: { kind: translated, id: 4017719 }
notes:
  - { kind: usage, text: "«Родиться» — всегда с się: Gdzie się urodziłeś? «Где ты родился?». Без się глагол переходный и значит «родить»: urodziła syna «она родила сына»." }
  - { kind: usage, text: "Существительное urodzenie «рождение» частое: data urodzenia «дата рождения», od urodzenia «с рождения». А «день рождения» — urodziny, слово только множественного числа." }
  - { kind: usage, text: "Причастие urodzony значит «прирождённый»: urodzony przywódca «прирождённый лидер», urodzony artysta. По-русски получается то же самое." }
  - { kind: usage, text: "Повелительного наклонения у глагола нет: формы urodź и уж тем более устаревшая uródź в живой речи не встречаются. Несовершенный вид — rodzić." }
collocations:
  - { pl: "urodzić się", ru: "родиться" }
  - { pl: "data urodzenia", ru: "дата рождения" }
  - { pl: "od urodzenia", ru: "с рождения" }
  - { pl: "urodzony artysta", ru: "прирождённый артист" }
family:
  - { pl: "rodzić", ru: "рожать", relation: aspect }
  - { pl: "urodziny", ru: "день рождения", relation: derived }
  - { pl: "urodzenie", ru: "рождение", relation: derived }
  - { pl: "ród", ru: "род", relation: root }
etymology: "Из u- + rodzić «рожать», от ród «род». Русское «родить» — то же слово, и корень совпадает полностью."
memory: "urodzić — «родить», а с się «родиться»: Gdzie się urodziłeś? Корень тот же, что в русском. Запомните data urodzenia «дата рождения», od urodzenia «с рождения» и urodziny «день рождения» — последнее только во множественном числе. Причастие urodzony значит «прирождённый»."
idioms:
  - { pl: "urodzić się", ru: "родиться" }
  - { pl: "data urodzenia", ru: "дата рождения" }
  - { pl: "urodzony artysta", ru: "прирождённый артист" }
