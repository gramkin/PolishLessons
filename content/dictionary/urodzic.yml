  - { form: "uródź", reason: "повелительного наклонения у этого глагола нет; вариант uródź к тому же устарел" }
  - { form: "uródźcie", reason: "повелительного наклонения у этого глагола нет; вариант uródź к тому же устарел" }
  - { form: "uródźmy", reason: "повелительного наклонения у этого глагола нет; вариант uródź к тому же устарел" }
