# review
id: panikowac
format: 2
lemma: "panikować"
rank: 4169
pos: verb
pron: { cyr: "панико́ваць" }
senses:
  - id: panic
    ru: "паниковать"
    examples:
      - pl: "Nie panikuj, wszystko będzie dobrze."
        ru: "Не паникуй, всё будет хорошо."
        source: { kind: authored }
      - pl: "Ludzie panikowali, gdy zgasło światło."
        ru: "Люди паниковали, когда погас свет."
        source: { kind: authored }
      - pl: "Zawsze panikuję przed egzaminem."
        ru: "Я всегда паникую перед экзаменом."
        source: { kind: authored }
  - id: overreact
    ru: "зря паниковать, раздувать"
    examples:
      - pl: "Mama panikuje z byle powodu."
        ru: "Мама паникует по любому поводу."
        source: { kind: authored }
      - pl: "Media panikują, a nic się nie dzieje."
        ru: "СМИ паникуют, а ничего не происходит."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "PANIKOWAĆ — «паниковать», полное совпадение. Совершенный вид — SPANIKOWAĆ «запаниковать». Не путать с PANIKARZ «паникёр»: суффикс -ARZ, как в русском -АРЬ." }
  - { kind: usage, text: "Несовершенный вид. Спряжение на -UJĘ: PANIKUJĘ, PANIKUJESZ, PANIKUJĄ. Самая частая форма — NIE PANIKUJ! «не паникуй!». Безличное PANIKOWANO в карточку не включено." }
  - { kind: government, text: "Из-за чего — Z POWODU или PRZEZ с винительным: PANIKOWAĆ Z POWODU EGZAMINU, PANIKOWAĆ PRZEZ BYLE CO. Перед чем — PRZED с творительным: PRZED EGZAMINEM." }
  - { kind: pronunciation, text: "Читается «панико́ваць»: ударение на предпоследнем слоге. PANIKUJ — «пани́куй»." }
  - { kind: register, text: "Разговорное, но нейтральное слово. В книжной речи — WPADAĆ W PANIKĘ «впадать в панику»." }
collocations:
  - { pl: "nie panikuj", ru: "не паникуй" }
  - { pl: "panikować z byle powodu", ru: "паниковать по любому поводу" }
  - { pl: "panikować przed egzaminem", ru: "паниковать перед экзаменом" }
family:
  - { pl: "panika", ru: "паника", relation: derived, id: panika }
  - { pl: "spanikować", ru: "запаниковать", relation: aspect }
  - { pl: "panikarz", ru: "паникёр", relation: derived }
etymology: "От PANIKA, из греческого PANIKOS «вызванный богом Паном»: внезапный страх, который, по поверью, наводил Пан. Русское «паника» — то же слово."
memory: "Panikować — паниковать: nie panikuj! Запаниковать — spanikować. Паникёр — panikarz."
idioms:
  - { pl: "nie panikuj", ru: "не паникуй, спокойно" }
