  - { kind: government, text: "Неизменяемое наречие; степени — sympatyczniej, najsympatyczniej." }
  - { kind: false-friend, text: "Русское «симпатично» чаще о внешности, а польское sympatycznie — о манере и впечатлении: sympatyczny człowiek значит «приятный человек», а не «красивый»." }
collocations:
