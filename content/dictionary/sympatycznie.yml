etymology: "От sympatyczny, через латинское sympathia из греческого sympatheia «сочувствие». Русское «симпатичный» — то же заимствование, но оно сузилось до внешности, тогда как польское осталось о характере и впечатлении."
memory: "sympatycznie — о манере, а не о внешности: «приветливо, мило». Польское sympatyczny człowiek — «приятный человек», а не «красивый»."
