      - pl: "Brak urozmaicenia nuży."
        ru: "Отсутствие разнообразия утомляет."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Отглагольное существительное от urozmaicić «разнообразить». Слово книжноватое; в разговоре скажут odmiana «перемена»." }
  - { kind: false-friend, text: "Корень rozmaity «разный, разнообразный» — ср. русское «размаиты» в старых текстах. Современное русское соответствие — «разнообразие»." }
  - { kind: government, text: "Средний род: to urozmaicenie, tego urozmaicenia." }
  - { kind: usage, text: "Карточка odmiana покрывает близкий смысл «перемена, разнообразие» — их стоит держать рядом." }
collocations:
  - { pl: "miłe urozmaicenie", ru: "приятное разнообразие" }
etymology: "От urozmaicić «разнообразить», от rozmaity «разный»; ср. русское «разнообразие»."
memory: "urozmaicenie — «разнообразие», от rozmaity «разный». Слово книжное; в разговоре чаще odmiana."
