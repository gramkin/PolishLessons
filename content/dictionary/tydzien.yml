# review
id: tydzien
format: 2
lemma: "tydzień"
rank: 239
pos: noun
pron: { cyr: "ты́дзень" }
senses:
  - id: week
    ru: "неделя"
    examples:
      - pl: "Tydzień ma siedem dni."
        ru: "В неделе семь дней."
        source: { kind: tatoeba, id: 623122 }
      - pl: "Cały tydzień pracowałem."
        ru: "Я всю неделю работал."
        source: { kind: tatoeba, id: 12950803 }
      - pl: "Planujemy zostać tam tydzień."
        ru: "Мы планируем остаться на неделю."
        source: { kind: tatoeba, id: 363123 }
  - id: week-time
    ru: "неделя (в оборотах времени)"
    examples:
      - pl: "Myje rower co tydzień."
        ru: "Он моет велосипед каждую неделю."
        source: { kind: tatoeba, id: 12191534 }
      - pl: "Mylą mi się już dni tygodnia."
        ru: "Я уже запутался в днях недели."
        source: { kind: tatoeba, id: 8675017 }
      - pl: "On myje rower co tydzień."
        ru: "Он моет велосипед каждую неделю."
        source: { kind: tatoeba, id: 610637 }
notes:
  - { kind: false-friend, text: "Главная ловушка: tydzień — «неделя», а niedziela — «воскресенье». Русское «неделя» и польское niedziela — одно слово («день, когда не делают»), но значения разошлись." }
  - { kind: usage, text: "Основа меняется: tydzień, но tygodnia, tygodniowi, tygodnie, tygodni." }
  - { kind: usage, text: "co tydzień — «каждую неделю»; w tygodniu — «в будни, среди недели»; za tydzień — «через неделю»." }
collocations:
  - { pl: "co tydzień", ru: "каждую неделю" }
  - { pl: "za tydzień", ru: "через неделю" }
  - { pl: "w zeszłym tygodniu", ru: "на прошлой неделе" }
  - { pl: "dni tygodnia", ru: "дни недели" }
etymology: "Из «ten dzień» — «тот же день»: день, который повторяется через один и тот же срок. Русское «неделя» устроено иначе — «день, когда не делают»."
memory: "tydzień — «неделя», а niedziela — «воскресенье». Не перепутайте: они выглядят похоже на русские слова, но значат разное. И основа меняется: tydzień, но w tygodniu."
idioms:
  - { pl: "tydzień w tydzień", ru: "неделя за неделей" }
  - { pl: "z tygodnia na tydzień", ru: "с недели на неделю" }
  - { pl: "w tygodniu", ru: "в будни, среди недели" }
