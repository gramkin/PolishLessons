        ru: "Следующая встреча состоится двадцатого октября."
        source: { kind: tatoeba, id: 12454212 }
  - id: in-sequence
    ru: "очередной (в перечислении, о повторе)"
    examples:
      - pl: "Kraje zjednoczyły się, aby zapobiec kolejnej globalnej wojnie."
        ru: "Страны объединились, чтобы не допустить новой глобальной войны."
        source: { kind: tatoeba, id: 12893263 }
      - pl: "Rada Miejska Lwowa po raz kolejny zwraca uwagę na fałszywe informacje o zamiarze wprowadzenia zakazu rozmów we Lwowie w języku rosyjskim."
        ru: "Львовский городской совет ещё раз обращает ваше внимание на ложную информацию относительно намерения запретить разговаривать во Львове по-русски."
