# review
id: kolejny
format: 2
lemma: "kolejny"
rank: 349
pos: adj
pron: { cyr: "коле́йны" }
senses:
  - id: another
    ru: "очередной, ещё один"
    note: "kolejny — то, что идёт чередой; następny — просто «следующий по порядку»."
    examples:
      - pl: "Dostaniemy kolejną szansę."
        ru: "Мы получим еще один шанс."
        source: { kind: tatoeba, id: 3313321 }
      - pl: "Czy mogę zadać kolejne pytanie?"
        ru: "Могу я задать следующий вопрос?"
        source: { kind: tatoeba, id: 10609197 }
      - pl: "Kolejne spotkanie odbędzie się 20 października."
        ru: "Следующая встреча состоится двадцатого октября."
        source: { kind: tatoeba, id: 12454212 }
  - id: in-sequence
    ru: "очередной (в перечислении, о повторе)"
    examples:
      - pl: "Kraje zjednoczyły się, aby zapobiec kolejnej globalnej wojnie."
        ru: "Страны объединились, чтобы не допустить новой глобальной войны."
        source: { kind: tatoeba, id: 12893263 }
      - pl: "Rada Miejska Lwowa po raz kolejny zwraca uwagę na fałszywe informacje o zamiarze wprowadzenia zakazu rozmów we Lwowie w języku rosyjskim."
        ru: "Львовский городской совет ещё раз обращает ваше внимание на ложную информацию относительно намерения запретить разговаривать во Львове по-русски."
        source: { kind: tatoeba, id: 2146285 }
      - pl: "Po raz kolejny się spóźnił."
        ru: "Он в очередной раз опоздал."
        source: { kind: authored }
notes:
  - { kind: usage, text: "kolejny значит «очередной, ещё один» — то, что идёт чередой: kolejna próba «очередная попытка». Просто «следующий по порядку» — następny." }
  - { kind: usage, text: "po raz kolejny — «в очередной раз»; kolejny raz — то же самое." }
  - { kind: usage, text: "Образовано от kolej «очередь, черёд»; то же слово значит и «железная дорога»." }
collocations:
  - { pl: "kolejny raz", ru: "очередной раз" }
  - { pl: "po raz kolejny", ru: "в очередной раз" }
  - { pl: "kolejna szansa", ru: "ещё один шанс" }
  - { pl: "kolejne pytanie", ru: "следующий вопрос" }
etymology: "От kolej «очередь, черёд», а то — от koło «колесо»: то, что идёт по кругу, чередой. Тем же словом называется и железная дорога."
memory: "kolejny — «очередной, ещё один», от kolej «очередь». А następny — просто «следующий». Po raz kolejny значит «в очередной раз»."
idioms:
  - { pl: "po raz kolejny", ru: "в очередной раз" }
  - { pl: "kolejna próba", ru: "очередная попытка" }
  - { pl: "kolejny raz", ru: "ещё раз" }
