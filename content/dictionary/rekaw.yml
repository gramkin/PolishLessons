notes:
  - { kind: false-friend, text: "Слово собрано ровно как русское: RĘKA «рука» плюс суффикс, то есть то, что надевают на руку. Оба языка пришли к одному решению, и второе значение тоже совпало: RĘKAW RZEKI это «рукав реки». Прячет родство только носовое: Ę перед K даёт «эн», а конечное W оглушается, поэтому RĘKAW звучит «ре́нкаф», совсем непохоже на «рукав»." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Носовое Ę держится во всех падежах, основа не меняется. В местном падеже RĘKAWIE, с обычным смягчением. Из того же гнезда идут два слова, которые легко спутать: RĘKAWICA это «рукавица», а RĘKAWICZKA, уменьшительное от неё, значит уже «перчатка», то есть с отдельными пальцами." }
  - { kind: government, text: "Подвернуть рукава — PODWINĄĆ RĘKAWY или ZAKASAĆ RĘKAWY, винительный множественного без предлога. Второй оборот значит ещё и «взяться за дело», как русское «закатать рукава». В рукаве — W RĘKAWIE, предлог W с местным падежом, и оборот MIEĆ COŚ W RĘKAWIE значит «иметь что-то в запасе», ровно как русский. Вытереть рукавом — OTRZEĆ RĘKAWEM, творительный без предлога." }
  - { kind: pronunciation, text: "Читается «ре́нкаф», два слога, ударение на первом. Носовое Ę перед K даёт «эн», как в RĘKA «ре́нка», а конечное W оглушается до «ф». В косвенных падежах оглушения нет: RĘKAWA звучит «ренка́ва», RĘKAWEM — «ренка́вэм». В местном падеже RĘKAWIE сочетание WIE даёт мягкое «ве»." }
  - { kind: register, text: "Слово нейтральное и повседневное: KRÓTKI RĘKAW «короткий рукав», DŁUGI RĘKAW, KOSZULA Z KRÓTKIM RĘKAWEM. Переносные обороты частые и совпадают с русскими: ZAKASAĆ RĘKAWY значит взяться за работу, MIEĆ COŚ W RĘKAWIE — держать козырь в запасе. В аэропорту RĘKAW это телескопический трап, и слово это звучит в каждом объявлении." }
