etymology: "От RĘKA «рука», от праславянского корня, давшего и русскую «руку». Носовое Ę польского отвечает русскому У, и та же пара видна в WĘZEŁ и «узле», ZĄB и «зубе». Слово построено тем же способом, что русский «рукав»: от названия части тела, с суффиксом предмета. Из того же гнезда выросли RĘKAWICA «рукавица» и RĘKAWICZKA, где уменьшительный суффикс дал уже «перчатку»."
memory: "Собрано как русское слово: rękaw от ręka «рука», и даже второе значение то же, rękaw rzeki. Прячет родство носовое: ę перед k даёт «эн», конечное w оглушается, и выходит «ре́нкаф». Та же пара в węzeł и «узле». Обороты переносятся целиком: zakasać rękawy это «закатать рукава», mieć coś w rękawie — «иметь в запасе». Осторожно: rękawiczka это «перчатка», а не рукавичка."
idioms:
  - { pl: "zakasać rękawy", ru: "закатать рукава, взяться за дело" }
