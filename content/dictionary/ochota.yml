# review
id: ochota
format: 2
lemma: "ochota"
rank: 1220
pos: noun
pron: { cyr: "охо́та" }
senses:
  - id: desire
    ru: "желание, охота"
    examples:
      - pl: "Mam ochotę na coś słodkiego."
        ru: "Мне хочется чего-нибудь сладкого."
        source: { kind: tatoeba, id: 8493344 }
      - pl: "Masz ochotę na coś mocniejszego?"
        ru: "Хочешь чего-нибудь покрепче?"
        source: { kind: tatoeba, id: 6320842 }
      - pl: "Możesz przyjść, jeśli masz ochotę."
        ru: "Можешь прийти, если есть желание."
        source: { kind: tatoeba, id: 931120 }
  - id: no-desire
    ru: "nie mam ochoty — мне не хочется"
    examples:
      - pl: "Nie mam ochoty tańczyć."
        ru: "Мне не хочется танцевать."
        source: { kind: translated, id: 5985111 }
      - pl: "Już nie mam ochoty na słodycze."
        ru: "Мне уже не хочется сладкого."
        source: { kind: tatoeba, id: 357974 }
  - id: feel-like
    ru: "mieć ochotę na coś — хотеть чего-то"
    examples:
      - pl: "Miał ochotę podzielić się ze wszystkimi swoim żalem."
        ru: "Ему хотелось поделиться со всеми своим горем."
        source: { kind: tatoeba, id: 12624947 }
      - pl: "Tom nie miał ochoty spotkać się z Mary."
        ru: "У Тома не было желания встречаться с Мэри."
        source: { kind: tatoeba, id: 6017180 }
notes:
  - { kind: government, text: "mieć ochotę NA coś «хотеть чего-то» — предлог na с винительным: Mam ochotę na kawę «Мне хочется кофе». С глаголом идёт инфинитив: Nie mam ochoty tańczyć." }
  - { kind: false-friend, text: "Осторожно: ochota — это «желание», а не «охота» на зверя. Охота как промысел по-польски polowanie, а охотник — myśliwy." }
  - { kind: usage, text: "Женский род: ta ochota, tej ochoty. Множественного числа в живой речи практически не образует." }
  - { kind: usage, text: "z ochotą значит «охотно, с удовольствием», а ochotnik — «доброволец»." }
collocations:
  - { pl: "mieć ochotę na coś", ru: "хотеть чего-то" }
  - { pl: "nie mam ochoty", ru: "мне не хочется" }
  - { pl: "z ochotą", ru: "охотно" }
family:
  - { pl: "ochotnik", ru: "доброволец", relation: derived }
  - { pl: "chętny", ru: "охотный, готовый", relation: root }
  - { pl: "polowanie", ru: "охота (промысел)", relation: antonym }
etymology: "Праславянское *ochota «желание, рвение» — то же слово, что русская «охота» в значении «желание» (охота мне это делать). Значение «промысел» развилось только в русском."
memory: "ochota — «желание», а не «охота» на зверя: та будет polowanie. Главный оборот — mieć ochotę NA coś, предлог na с винительным: Mam ochotę na kawę «Мне хочется кофе»."
idioms:
  - { pl: "mieć ochotę na coś", ru: "хотеть чего-то" }
  - { pl: "z ochotą", ru: "охотно" }
formExamplesSkip:
  - { form: "ochoto", reason: "звательный падеж у этого слова в живой речи не употребляется" }
  - { form: "ochot", reason: "слово отвлечённое; множественного числа в живой речи не образует" }
  - { form: "ochotach", reason: "слово отвлечённое; множественного числа в живой речи не образует" }
  - { form: "ochotami", reason: "слово отвлечённое; множественного числа в живой речи не образует" }
  - { form: "ochotom", reason: "слово отвлечённое; множественного числа в живой речи не образует" }
formExamples:
  - form: "ochocie"
    pl: "O jego ochocie do pracy krążą legendy."
    ru: "О его охоте к работе ходят легенды."
    source: { kind: authored }
  - form: "ochocie"
    pl: "Dzięki ochocie do nauki szybko nadrobił zaległości."
    ru: "Благодаря охоте к учёбе он быстро наверстал упущенное."
    source: { kind: authored }
  - form: "ochocie"
    pl: "Po jego ochocie widać było, że się cieszy."
    ru: "По его охоте видно было, что он радуется."
    source: { kind: authored }
  - form: "ochota"
    pl: "W sercu człowieka kryją się dwa sprzeczne ze sobą uczucia. Oczywiście nie ma osoby, która nie współczułaby bliźniemu w nieszczęściu. Jeśli jednak jest ona w stanie położyć kres jego niedoli, czuje się, jakby czegoś jej brakowało. Trochę hiperbolizując, można powiedzieć, że nachodzi ją ochota, by wpędzić tego człowieka ponownie w te same kłopoty. Co prawda nie jest tego świadoma, jednak ostatecznie zaczyna czuć do niego pewną wrogość."
    ru: "В сердце человека кроются два противоречащих друг другу чувства. Конечно, нет человека, который не сочувствовал бы ближнему в несчастье. Но если он в состоянии положить конец его беде, ему начинает казаться, будто чего-то не хватает. Слегка преувеличивая, можно сказать, что его охватывает охота вновь ввергнуть этого человека в те же неприятности. Он этого, правда, не осознаёт, но в конце концов начинает чувствовать к нему некоторую враждебность."
    source: { kind: translated, id: 3433417 }
