notes:
  - { kind: false-friend, text: "Ловушки в смысле нет вовсе: RYBA это «рыба», RYBKA — «рыбка», и даже сказка та же, ZŁOTA RYBKA исполняет три желания. Зато есть ловушка на слух. Буква B перед K оглушается, и слово читается «ры́пка», хотя пишется через B. То же правило в BABKA «ба́пка» и в TORBKA. Пишем B, говорим «п», и запомнить это надо сразу, иначе слово на слух не узнать." }
  - { kind: usage, text: "Десять форм, женский род, уменьшительное от RYBA. В дательном и местном падежах K переходит в C: RYBKA, но RYBCE. В родительном множественного появляется беглое E: RYBEK. Множественное RYBKI значит прежде всего аквариумных рыбок, а рыбу как еду и как улов называют RYBY, без уменьшительного." }
  - { kind: government, text: "Кормить рыбок — KARMIĆ RYBKI, винительный без предлога. В аквариуме — W AKWARIUM, и само AKWARIUM в единственном числе не склоняется. Рыбке надо менять воду — RYBCE TRZEBA ZMIENIAĆ WODĘ, дательный падеж при TRZEBA. Без рыбки — BEZ RYBKI, родительный." }
  - { kind: pronunciation, text: "Читается «ры́пка», два слога, ударение на первом. Буква Y даёт «ы». Буква B перед K оглушается и звучит «п»: «рып». В форме RYBCE оглушение остаётся и сочетание даёт «пц»: «ры́пце». А вот в RYBY, где после B идёт гласная, оглушения нет: «ры́бы»." }
  - { kind: register, text: "Слово домашнее и детское. RYBKI W AKWARIUM есть в половине польских домов с детьми, и KARMIĆ RYBKI — обычная детская обязанность. ZŁOTA RYBKA известна по той же сказке, что и у нас. А в ласковом обращении RYBKO звучит как наше «рыбка моя», и услышать его можно и от бабушки, и в кафе от официантки." }
