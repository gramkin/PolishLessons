etymology: "Уменьшительное от RYBA, слова праславянского и того же, что русская «рыба». Родство полное и без всяких оговорок, вплоть до уменьшительного суффикса: наша «рыбка» собрана точно так же. Из того же гнезда идут RYBAK «рыбак» и RYBNY «рыбный», и всё это узнаётся с первого взгляда. Единственная трудность в слове не смысловая, а звуковая: B перед K оглушается."
memory: "Рыбка, и слово наше целиком: ryba это «рыба», zlota rybka — та же золотая рыбка с тремя желаниями. Трудность только на слух: b перед k оглушается, и rybka читается «ры́пка», как babka — «ба́пка». Пишем b, говорим «п». В дательном и местном k переходит в c: rybce, «ры́пце». А в ryby, где дальше гласная, оглушения нет."
idioms:
  - { pl: "złota rybka", ru: "золотая рыбка" }
