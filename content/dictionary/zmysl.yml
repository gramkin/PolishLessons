notes:
  - { kind: false-friend, text: "ZMYSŁ — ЭТО «ЧУВСТВО», А НЕ «СМЫСЛ». Пять чувств по-польски pięć zmysłów, а русский «смысл» будет SENS или ZNACZENIE. Слова при этом собраны одинаково: наше «с-мысл» и польское «z-mysł» — та же приставка и тот же корень myśl «мысль». Разошлись значения: у нас вышло то, что мыслится, у поляков — то, чем воспринимают. Ошибка «to nie ma zmysłu» вместо to nie ma sensu слышна сразу." }
  - { kind: pronunciation, text: "Предложный падеж — ZMYŚLE, со смягчением sł в śl. То же чередование в masło — maśle, krzesło — krześle, wiosło — wiośle. Русскому уху мягкость здесь непривычна, а ошибка «zmysłe» выдаёт иностранца мгновенно." }
  - { kind: usage, text: "Множественное ZMYSŁY значит не только «органы чувств», но и «чувственность»: rozkosze zmysłów. Отсюда прилагательное ZMYSŁOWY «чувственный». А POSTRADAĆ ZMYSŁY — «лишиться рассудка», то есть именно утратить способность воспринимать; русское «лишиться чувств» значит другое — упасть в обморок, по-польски ZEMDLEĆ." }
collocations:
  - { pl: "pięć zmysłów", ru: "пять чувств" }
  - { pl: "szósty zmysł", ru: "шестое чувство" }
  - { pl: "zmysł obserwacji", ru: "наблюдательность" }
family:
  - { pl: "myśl", ru: "мысль", relation: root }
  - { pl: "zmysłowy", ru: "чувственный", relation: derived }
  - { pl: "sens", ru: "смысл", relation: antonym, id: sens }
etymology: "Приставка z- и myśl «мысль», из праславянского *myslь. Русский «смысл» собран из тех же двух частей, и когда-то оба слова значили примерно «замысел, разумение». Потом пути разошлись: польский отдал слово восприятию, а русский — значению. Поэтому zmysł и «смысл» родственники, которых нельзя переводить друг другом."
memory: "zmysł — это «чувство», орган восприятия: pięć zmysłów. «Смысл» по-польски sens. И предложный мягкий: w zmyśle, как w maśle."
idioms:
