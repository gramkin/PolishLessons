# review
id: grob
format: 2
lemma: "grób"
rank: 1935
pos: noun
pron: { cyr: "груп" }
senses:
  - id: grave
    ru: "могила"
    examples:
      - pl: "To jest grób Toma."
        ru: "Это могила Тома."
        source: { kind: translated, id: 10589367 }
      - pl: "Odwiedziłem grób ojca."
        ru: "Я посетил могилу отца."
        source: { kind: translated, id: 817203 }
      - pl: "Kopie własny grób."
        ru: "Он роет себе могилу."
        source: { kind: translated, id: 9040051 }
      - pl: "Dlaczego nie przyszedłeś odwiedzić grobu?"
        ru: "Почему ты не пришёл навестить могилу?"
        source: { kind: translated, id: 13951078 }
      - pl: "Muzułmanie grzebią martwych w grobach."
        ru: "Мусульмане хоронят умерших в могилах."
        source: { kind: translated, id: 5186356 }
      - pl: "Dawid położył kamień na grobie Ruty."
        ru: "Давид положил камень на могилу Руты."
        source: { kind: translated, id: 12960442 }
  - id: figurative
    ru: "в устойчивых оборотах"
    examples:
      - pl: "Milczał jak grób."
        ru: "Он молчал как могила."
        source: { kind: translated, id: 13659481 }
      - pl: "Jest jedną nogą w grobie."
        ru: "Он одной ногой в могиле."
        source: { kind: translated, id: 415408 }
      - pl: "Moja dawna nauczycielka angielskiego musi się teraz przewracać w grobie."
        ru: "Моя бывшая учительница английского сейчас, наверное, в гробу переворачивается."
        source: { kind: translated, id: 758420 }
notes:
  - { kind: usage, text: "Чередование ó и o в основе: именительный grób, но родительный grobu, предложный grobie. Такое же чередование в stół — stołu." }
  - { kind: usage, text: "Milczeć jak grób — «молчать как могила», точный двойник русского выражения." }
  - { kind: usage, text: "Рядом с карточками pogrzeb «похороны» и śmierć «смерть»." }
collocations:
  - { pl: "grób ojca", ru: "могила отца" }
  - { pl: "milczeć jak grób", ru: "молчать как могила" }
  - { pl: "jedną nogą w grobie", ru: "одной ногой в могиле" }
etymology: "Праславянское *grobъ, от grzebać «копать, рыть». Русское «гроб» — то же слово, но значения разошлись: польское grób — это могила, а не ящик, который по-польски trumna."
memory: "grób — «могила», а не «гроб»: гроб по-польски trumna. Помните чередование: grób, но grobu, w grobie."
idioms:
  - { pl: "milczeć jak grób", ru: "молчать как могила" }
  - { pl: "jedną nogą w grobie", ru: "одной ногой в могиле" }
  - { pl: "kopać sobie grób", ru: "рыть себе могилу" }
