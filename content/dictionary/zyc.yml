# review
id: zyc
format: 2
lemma: "żyć"
rank: 70
pos: verb
aspect: imperf
pron: { cyr: "жыць" }
senses:
  - id: live
    ru: "жить, быть живым"
    examples:
      - pl: "Chcę żyć."
        ru: "Я хочу жить."
        source: { kind: tatoeba, id: 360459 }
      - pl: "Ona żyje!"
        ru: "Она жива!"
        source: { kind: tatoeba, id: 3460717 }
      - pl: "Ryby żyją w morzu."
        ru: "Рыбы живут в море."
        source: { kind: tatoeba, id: 359222 }
  - id: live-somewhere
    ru: "жить (где-л., как-л.)"
    examples:
      - pl: "Żyjemy w pięknym mieście."
        ru: "Мы живем в прекрасном городе."
        source: { kind: tatoeba, id: 6714450 }
      - pl: "Żyję na planecie Sakura."
        ru: "Я живу на планете Сакура."
        source: { kind: tatoeba, id: 5138640 }
notes:
  - { kind: usage, text: "Различайте żyć «быть живым, существовать» и mieszkać «проживать где-то»: Mieszkam w Krakowie, ale żyję skromnie." }
  - { kind: usage, text: "Пожелание Niech żyje! значит «Да здравствует!»." }
collocations:
  - { pl: "niech żyje", ru: "да здравствует" }
  - { pl: "żyć długo i szczęśliwie", ru: "жить долго и счастливо" }
  - { pl: "zarabiać na życie", ru: "зарабатывать на жизнь" }
etymology: "Праславянское *žiti — то же слово, что русское «жить»; отсюда же życie «жизнь», как «житие» от «жить»."
memory: "Различайте пару, которой в русском нет: żyć — «быть живым, существовать», mieszkać — «проживать где-то». Mieszkam w Warszawie, ale żyję skromnie. И знаменитое Niech żyje! — «Да здравствует!»."
idioms:
  - { pl: "niech żyje!", ru: "да здравствует!" }
  - { pl: "żyć długo i szczęśliwie", ru: "жить долго и счастливо" }
  - { pl: "żyć z dnia na dzień", ru: "жить одним днём" }
formExamplesSkip:
  - { form: "żyto", reason: "В список форм попало существительное żyto «рожь»: к глаголу żyć оно отношения не имеет, и безличной формы на -to этот глагол не образует." }
