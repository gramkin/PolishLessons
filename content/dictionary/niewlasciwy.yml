formExamples:
  - form: "niewłaściwa"
    pl: "To była niewłaściwa osoba."
    ru: "Это был не тот человек."
    source: { kind: authored }
  - form: "niewłaściwa"
    pl: "Niewłaściwa odpowiedź kosztowała go punkt."
    ru: "Неверный ответ стоил ему балла."
    source: { kind: authored }
  - form: "niewłaściwa"
    pl: "Ta pora jest niewłaściwa."
    ru: "Время неподходящее."
    source: { kind: authored }
  - form: "niewłaściwą"
    pl: "Zadarł z niewłaściwą osobą."
    ru: "Он связался не с тем человеком."
    source: { kind: translated, id: 6308160 }
  - form: "niewłaściwą"
    pl: "Tom celowo dał Mary niewłaściwą książkę."
    ru: "Том нарочно дал Мэри не ту книгу."
    source: { kind: translated, id: 3070597 }
  - form: "niewłaściwą"
    pl: "Jesteśmy przekonani, że policja aresztowała niewłaściwą kobietę."
    ru: "Мы убеждены, что полиция арестовала не ту женщину."
    source: { kind: translated, id: 1790711 }
  - form: "niewłaściwe"
    pl: "Niewłaściwe słowo lub wyrażenie."
    ru: "Неподходящее слово или выражение."
    source: { kind: translated, id: 6553735 }
  - form: "niewłaściwe"
    pl: "Wiem, że to niewłaściwe."
    ru: "Я знаю, что это неправильно."
    source: { kind: translated, id: 12188839 }
  - form: "niewłaściwe"
    pl: "To niewłaściwe zachowanie."
    ru: "Это неподобающее поведение."
    source: { kind: authored }
  - form: "niewłaściwego"
    pl: "To lekarstwo, w przypadku niewłaściwego użycia, może być trujące."
    ru: "Это лекарство при неправильном применении может быть опасным."
    source: { kind: translated, id: 749137 }
  - form: "niewłaściwego"
    pl: "Nie znam niewłaściwego użycia tego słowa."
    ru: "Я не знаю неправильного употребления этого слова."
    source: { kind: authored }
  - form: "niewłaściwego"
    pl: "Unikaj niewłaściwego tonu."
    ru: "Избегай неподобающего тона."
    source: { kind: authored }
  - form: "niewłaściwej"
    pl: "Wysiadł na niewłaściwej stacji."
    ru: "Он вышел не на той станции."
    source: { kind: authored }
  - form: "niewłaściwej"
    pl: "Szukamy niewłaściwej odpowiedzi w teście."
    ru: "Мы ищем неверный ответ в тесте."
    source: { kind: authored }
  - form: "niewłaściwej"
    pl: "Po niewłaściwej uwadze zapadła cisza."
    ru: "После неуместного замечания повисла тишина."
    source: { kind: authored }
  - form: "niewłaściwemu"
    pl: "Przyjrzyj się niewłaściwemu wpisowi."
    ru: "Присмотрись к неверной записи."
    source: { kind: authored }
  - form: "niewłaściwemu"
    pl: "Niewłaściwemu adresatowi list nie pomoże."
    ru: "Не тому адресату письмо не поможет."
    source: { kind: authored }
  - form: "niewłaściwemu"
    pl: "Nie ufaj niewłaściwemu numerowi."
    ru: "Не доверяй неверному номеру."
    source: { kind: authored }
  - form: "niewłaściwi"
    pl: "Niewłaściwi ludzie dowiedzieli się pierwsi."
    ru: "Не те люди узнали первыми."
    source: { kind: authored }
  - form: "niewłaściwi"
    pl: "To byli niewłaściwi adresaci."
    ru: "Это были не те адресаты."
    source: { kind: authored }
  - form: "niewłaściwi"
    pl: "Niewłaściwi świadkowie tylko zaszkodzili."
    ru: "Не те свидетели только навредили."
    source: { kind: authored }
  - form: "niewłaściwy"
    pl: "Wybrał niewłaściwy moment."
    ru: "Он выбрал неподходящий момент."
    source: { kind: authored }
  - form: "niewłaściwy"
    pl: "To niewłaściwy numer."
    ru: "Это не тот номер."
    source: { kind: authored }
  - form: "niewłaściwy"
    pl: "Niewłaściwy klucz nie otworzy drzwi."
    ru: "Не тот ключ дверь не откроет."
    source: { kind: authored }
  - form: "niewłaściwych"
    pl: "Nie ma tu niewłaściwych odpowiedzi."
    ru: "Здесь нет неверных ответов."
    source: { kind: authored }
  - form: "niewłaściwych"
    pl: "Wśród niewłaściwych wpisów był i ten."
    ru: "Среди неверных записей была и эта."
    source: { kind: authored }
  - form: "niewłaściwych"
    pl: "Od niewłaściwych ludzi trzymaj się z daleka."
    ru: "От не тех людей держись подальше."
    source: { kind: authored }
  - form: "niewłaściwym"
    pl: "Wyszedłem na niewłaściwym przystanku."
    ru: "Я не на той остановке вышел."
    source: { kind: tatoeba, id: 13084382 }
  - form: "niewłaściwym"
    pl: "Twoje buty są w niewłaściwym rozmiarze."
    ru: "Твои ботинки не того размера."
    source: { kind: translated, id: 6320664 }
  - form: "niewłaściwym"
    pl: "Obawiam się, że połączył się pan z niewłaściwym numerem."
    ru: "Боюсь, вы дозвонились не по тому номеру."
    source: { kind: translated, id: 527735 }
  - form: "niewłaściwymi"
    pl: "Zajmujemy się niewłaściwymi wpisami."
    ru: "Мы занимаемся неверными записями."
    source: { kind: authored }
  - form: "niewłaściwymi"
    pl: "Między właściwymi a niewłaściwymi odpowiedziami jest różnica."
    ru: "Между верными и неверными ответами есть разница."
    source: { kind: authored }
  - form: "niewłaściwymi"
    pl: "Z niewłaściwymi narzędziami pracy nie skończysz."
    ru: "Не теми инструментами работу не закончишь."
    source: { kind: authored }
