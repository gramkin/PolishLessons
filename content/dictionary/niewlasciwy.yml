# review
id: niewlasciwy
format: 2
lemma: "niewłaściwy"
rank: 2183
pos: adj
pron: { cyr: "невуасьци́вы" }
senses:
  - id: wrong
    ru: "не тот, неверный"
    examples:
      - pl: "Wyszedłem na niewłaściwym przystanku."
        ru: "Я не на той остановке вышел."
        source: { kind: tatoeba, id: 13084382 }
      - pl: "Zadarł z niewłaściwą osobą."
        ru: "Он связался не с тем человеком."
        source: { kind: translated, id: 6308160 }
      - pl: "Twoje buty są w niewłaściwym rozmiarze."
        ru: "Твои ботинки не того размера."
        source: { kind: translated, id: 6320664 }
  - id: improper
    ru: "неподобающий, неправильный"
    examples:
      - pl: "Niewłaściwe słowo lub wyrażenie."
        ru: "Неподходящее слово или выражение."
        source: { kind: translated, id: 6553735 }
      - pl: "Wiem, że to niewłaściwe."
        ru: "Я знаю, что это неправильно."
        source: { kind: translated, id: 12188839 }
notes:
  - { kind: usage, text: "Чаще всего значит именно «не тот»: niewłaściwy przystanek «не та остановка», niewłaściwy numer «не тот номер». Русское «неправильный» тут звучало бы слишком сильно." }
  - { kind: false-friend, text: "Положительная пара właściwy «подходящий, надлежащий» уже есть в словаре. Корень własny «собственный»: właściwy — тот, что принадлежит делу по праву." }
  - { kind: government, text: "Обычное прилагательное; наречие — niewłaściwie." }
  - { kind: usage, text: "Пишется слитно, как и другие прилагательные с nie-." }
collocations:
  - { pl: "niewłaściwy numer", ru: "не тот номер" }
  - { pl: "niewłaściwa osoba", ru: "не тот человек" }
etymology: "nie + właściwy «подходящий, надлежащий», от własny «собственный»."
memory: "niewłaściwy чаще всего значит «не тот»: niewłaściwy przystanek «не та остановка». Положительная пара — właściwy."
idioms:
  - { pl: "niewłaściwy numer", ru: "не тот номер" }
