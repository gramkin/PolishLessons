# review
id: przepyszny
format: 2
lemma: "przepyszny"
rank: 5349
pos: adj
pron: { cyr: "пшэпы́шны" }
senses:
  - id: delicious
    ru: "превкусный, объедение"
    examples:
      - pl: "Obiad był przepyszny."
        ru: "Обед был превкусный."
        source: { kind: authored }
      - pl: "Upiekła przepyszne ciasto."
        ru: "Она испекла превкусный пирог."
        source: { kind: authored }
      - pl: "Zupa wyszła przepyszna."
        ru: "Суп вышел превкусным."
        source: { kind: authored }
  - id: splendid
    ru: "роскошный, великолепный (о виде, убранстве)"
    examples:
      - pl: "Sala miała przepyszny wystrój."
        ru: "У зала было роскошное убранство."
        source: { kind: authored }
      - pl: "Nosiła przepyszną biżuterię."
        ru: "Она носила роскошные украшения."
        source: { kind: authored }
notes:
  - { kind: government, text: "Обычное прилагательное: przepyszny, przepyszna, przepyszne. Степеней сравнения не образует — усилитель уже внутри слова." }
  - { kind: usage, text: "Чаще всего о еде: przepyszny obiad, przepyszne ciasto. Второе значение — «роскошный» о виде и убранстве." }
  - { kind: usage, text: "Наречие przepysznie «превкусно»: zjedliśmy przepysznie." }
  - { kind: false-friend, text: "Исходное pyszny значит и «вкусный», и «надменный» — от pycha «гордыня». У przepyszny остаётся только «вкусный, роскошный», надменности в нём нет." }
collocations:
  - { pl: "przepyszny obiad", ru: "превкусный обед" }
  - { pl: "przepyszne ciasto", ru: "превкусный пирог" }
  - { pl: "przepyszny wystrój", ru: "роскошное убранство" }
family:
  - { pl: "pyszny", ru: "вкусный; надменный", relation: root }
  - { pl: "pycha", ru: "гордыня", relation: root }
etymology: "Приставка prze- в усилительном значении плюс pyszny «вкусный; надменный», которое идёт от pycha «гордыня». Усилитель встроен в само слово, поэтому степеней сравнения оно не образует."
memory: "przepyszny — «превкусный»: prze- усиливает pyszny. Раз усилитель уже внутри, степеней нет; «ещё превкуснее» по-польски не говорят."
idioms:
  - { pl: "przepyszny obiad", ru: "превкусный обед" }
