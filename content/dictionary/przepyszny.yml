formExamples:
  - form: "przepyszna"
    pl: "Zupa wyszła przepyszna."
    ru: "Суп вышел превкусным."
    source: { kind: authored }
  - form: "przepyszna"
    pl: "Przepyszna szarlotka zniknęła w minutę."
    ru: "Превкусная шарлотка исчезла за минуту."
    source: { kind: authored }
  - form: "przepyszna"
    pl: "Ta kawa jest przepyszna."
    ru: "Этот кофе превкусный."
    source: { kind: authored }
  - form: "przepyszne"
    pl: "Upiekła przepyszne ciasto."
    ru: "Она испекла превкусный пирог."
    source: { kind: authored }
  - form: "przepyszne"
    pl: "Przepyszne pierogi podają tu codziennie."
    ru: "Превкусные вареники подают здесь каждый день."
    source: { kind: authored }
  - form: "przepyszne"
    pl: "Śniadanie było przepyszne."
    ru: "Завтрак был превкусный."
    source: { kind: authored }
  - form: "przepysznego"
    pl: "Nie jadłem nic przepysznego od tygodnia."
    ru: "Я неделю не ел ничего превкусного."
    source: { kind: authored }
  - form: "przepysznego"
    pl: "Szukali czegoś przepysznego na deser."
    ru: "Они искали что-нибудь превкусное на десерт."
    source: { kind: authored }
  - form: "przepysznego"
    pl: "Dotyczy to przepysznego wystroju sali."
    ru: "Это касается роскошного убранства зала."
    source: { kind: authored }
  - form: "przepysznej"
    pl: "Dotyczy to przepysznej szarlotki od sąsiadki."
    ru: "Это касается превкусной шарлотки от соседки."
    source: { kind: authored }
  - form: "przepysznej"
    pl: "Po przepysznej kolacji nikt nie chciał wstawać."
    ru: "После превкусного ужина никто не хотел вставать."
    source: { kind: authored }
  - form: "przepysznej"
    pl: "Nie znalazł przepysznej kawy w tym mieście."
    ru: "Он не нашёл превкусного кофе в этом городе."
    source: { kind: authored }
  - form: "przepysznemu"
    pl: "Przepysznemu obiadowi towarzyszyło dobre wino."
    ru: "Превкусному обеду сопутствовало хорошее вино."
