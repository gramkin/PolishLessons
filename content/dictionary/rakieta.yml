notes:
  - { kind: pronunciation, text: "Дательный и предложный — RAKIECIE, с переходом t в ci. Правило к этому месту можно считать твёрдым: твёрдое t перед окончанием -e не стоит никогда, отсюда element — elemencie, kąt — kącie, brat — bracie, świat — na świecie. Родительный множественного — RAKIET, без окончания." }
  - { kind: usage, text: "Два значения этого слова исторически два разных слова, случайно сошедшихся в польском облике. Ракета пришла из итальянского rocchetta «шпулька», названной по форме; ракетка — из арабского rāḥat «ладонь» через французское raquette. Русский удержал их врозь суффиксом, «ракета» и «ракетка», а польскому приходится полагаться на контекст: rakieta nośna — это носитель, rakieta tenisowa — ракетка." }
collocations:
  - { pl: "rakieta tenisowa", ru: "теннисная ракетка" }
  - { pl: "wystrzelić rakietę", ru: "запустить ракету" }
  - { pl: "rakieta nośna", ru: "ракета-носитель" }
family:
  - { pl: "rakietowy", ru: "ракетный", relation: derived }
  - { pl: "rakietnica", ru: "ракетница", relation: derived }
  - { pl: "rakietka", ru: "ракетка", relation: derived }
etymology: "В значении ракеты — из итальянского rocchetta, уменьшительного от rocca «прялка, шпулька»: первые ракеты назвали по вытянутой форме. В значении ракетки — совсем другой путь: арабское rāḥat «ладонь» дало французское raquette, а оттуда слово разошлось по Европе. Польский свёл обе линии в одну форму, русский развёл суффиксом."
memory: "Предложный с мягким ci: w rakiecie, как w elemencie. И одно слово на ракету и ракетку — различает только контекст."
idioms:
