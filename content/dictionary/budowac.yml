  - id: build-abstract
    ru: "строить (перен.: доверие, отношения)"
    examples:
      - pl: "Zaufanie buduje się latami."
        ru: "Доверие строится годами."
        source: { kind: authored }
      - pl: "Budowali relacje z klientami od zera."
        ru: "Они строили отношения с клиентами с нуля."
        source: { kind: authored }
  - id: uplifting
    ru: "budujący — ободряющий, воодушевляющий"
    examples:
      - pl: "To budująca historia."
        ru: "Это воодушевляющая история."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Русского глагола с этим корнем нет: «строить» — слово совсем другое. Зато корень знаком по существительному. Budować идёт от buda «будка, шалаш», а это то же немецкое заимствование, что русская «БУДКА». Выходит, buda и «будка» — одно слово, а глагол от него построили только поляки и украинцы: budować, «будувати»." }
  - { kind: usage, text: "Настоящее время по правилу -ować: buduję, budujesz, buduje — тот же ряд, что pracuję и zaakceptuję. Вид несовершенный, пара — zbudować. Причастие budujący живёт и в переносном значении «ободряющий, воодушевляющий»: budująca historia, budujący widok." }
  - { kind: government, text: "Строят ЧТО — винительный падеж: budować dom, most, zaufanie. ИЗ ЧЕГО — z с родительным: budować z cegły, z kamienia, z drewna. НА ЧЁМ — na с предложным: budować na piasku, na skale. Все три модели совпадают с русскими, так что фразу можно строить по родному образцу." }
  - { kind: pronunciation, text: "Три слога в инфинитиве, ударение на предпоследнем: bu-DO-wać, «будо́ваць». В настоящем времени оно остаётся на том же слоге основы: buduję — «буду́йэ»." }
collocations:
  - { pl: "budować dom", ru: "строить дом" }
  - { pl: "budować od podstaw", ru: "строить с нуля" }
  - { pl: "budować zaufanie", ru: "строить доверие" }
family:
  - { pl: "zbudować", ru: "построить", relation: aspect, id: zbudowac }
  - { pl: "budowa", ru: "стройка, строительство", relation: derived }
  - { pl: "budynek", ru: "здание", relation: derived, id: budynek }
  - { pl: "buda", ru: "будка, шалаш", relation: root }
etymology: "От buda «будка, шалаш», из средневерхненемецкого buode — того же источника, что русская «будка». Глагол от этого корня построили только западные соседи: польское budować, украинское «будувати». Русский взял существительное, но обошёлся своим «строить». Отсюда budowa «стройка», budynek «здание», budowla и budowniczy."
memory: "budować — «строить», и глагола-двойника в русском нет. Зато есть существительное: buda это та самая «будка», одно и то же немецкое слово. Спряжение по правилу -ować: buduję. И запомните идиому: zamki na lodzie, замки на льду, там, где русский строит воздушные."
idioms:
  - { pl: "budować od podstaw", ru: "строить с нуля" }
  - { pl: "budować zamki na lodzie", ru: "строить воздушные замки" }
formExamplesSkip:
  - { form: "budowani", reason: "Мужско-личная форма множественного числа страдательного причастия. Budować значит «строить», и объектом бывает дом, дорога, доверие — но не человек. Лица в эту роль не попадают, поэтому у формы budowani нет употребления, хотя генератор её и строит." }
