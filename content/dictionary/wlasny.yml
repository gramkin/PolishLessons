# review
id: wlasny
format: 2
lemma: "własny"
rank: 305
pos: adj
pron: { cyr: "вуа́сны" }
senses:
  - id: own
    ru: "собственный, свой"
    examples:
      - pl: "To mój własny rower."
        ru: "Это мой собственный велосипед."
        source: { kind: tatoeba, id: 951375 }
      - pl: "Masz swój własny pokój?"
        ru: "У тебя есть собственная комната?"
        source: { kind: tatoeba, id: 3793993 }
      - pl: "Chciałbym mieć własny pokój."
        ru: "Я бы хотел свою собственную комнату."
        source: { kind: tatoeba, id: 12470101 }
  - id: own-emphatic
    ru: "свой (при подчёркивании принадлежности)"
    examples:
      - pl: "Chciałbym to zobaczyć na własne oczy."
        ru: "Я хочу увидеть это своими глазами."
        source: { kind: tatoeba, id: 5495877 }
      - pl: "Chcesz otworzyć własną restaurację?"
        ru: "Ты хочешь открыть свой ресторан?"
        source: { kind: tatoeba, id: 13206443 }
      - pl: "Tanguci mieli własne pismo ideograficzne."
        ru: "У тангутов была собственная идеографическая письменность."
        source: { kind: tatoeba, id: 952153 }
notes:
  - { kind: usage, text: "własny усиливает принадлежность, как русское «собственный»: mój własny pokój «моя собственная комната»." }
  - { kind: usage, text: "Не путайте со swój: swój указывает на подлежащее (Wziął swój płaszcz), а własny подчёркивает, что вещь своя, а не чужая." }
  - { kind: usage, text: "Частые обороты: na własną rękę «самостоятельно, на свой страх и риск», na własne oczy «своими глазами», z własnej woli «по своей воле»." }
collocations:
  - { pl: "własny dom", ru: "собственный дом" }
  - { pl: "na własną rękę", ru: "самостоятельно, на свой страх и риск" }
  - { pl: "na własne oczy", ru: "своими глазами" }
  - { pl: "własnymi siłami", ru: "своими силами" }
etymology: "Из старочешского vlastní, вытеснившего старопольское włosny; корень тот же, что в русских «власть», «владеть» — исходно «то, чем владеешь»."
memory: "własny — «собственный», усиление к swój: mój własny pokój. Запомните na własną rękę «самостоятельно» и na własne oczy «своими глазами»."
idioms:
  - { pl: "na własną rękę", ru: "самостоятельно, на свой страх и риск" }
  - { pl: "bać się własnego cienia", ru: "бояться собственной тени" }
  - { pl: "na własne oczy", ru: "своими глазами" }
