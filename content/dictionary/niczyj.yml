id: niczyj
format: 2
lemma: "niczyj"
rank: 4981
pos: adj
pron: { cyr: "ни́чый" }
senses:
  - id: nobodys
    ru: "ничей"
    examples:
      - pl: "Ten pies jest niczyj, błąka się po wsi."
        ru: "Эта собака ничья, бродит по деревне."
        source: { kind: authored }
      - pl: "To niczyja wina, tak wyszło."
        ru: "Это ничья не вина, так получилось."
        source: { kind: authored }
      - pl: "Na strychu leżały niczyje rzeczy."
        ru: "На чердаке лежали ничьи вещи."
        source: { kind: authored }
  - id: no-mans
    ru: "ничейный, нейтральный (о земле, территории)"
    examples:
      - pl: "Między granicami był pas ziemi niczyjej."
        ru: "Между границами была полоса ничейной земли."
        source: { kind: authored }
      - pl: "Ta wyspa długo była niczyja."
        ru: "Этот остров долго был ничейным."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Совпадение с русским «ничей» почти полное: NICZYJ PIES — «ничья собака». Но русское существительное «ничья» в спорте по-польски совсем другое слово: REMIS. MECZ ZAKOŃCZYŁ SIĘ REMISEM, «матч закончился вничью». NICZYJA как существительное в польском спорте не используется." }
  - { kind: usage, text: "Местоименное прилагательное, степеней сравнения нет. Склоняется как CZYJ: NICZYJEGO, NICZYJEMU, NICZYJĄ. Форма для мужчин-людей NICZYI в карточке не включена: о людях говорят с отрицанием глагола — NIE NALEŻY DO NIKOGO. Ударение остаётся на NI: «ни́чыя»." }
  - { kind: government, text: "Ставится и до, и после существительного: NICZYJA ZIEMIA и ZIEMIA NICZYJA. В значении сказуемого — с BYĆ: TEN DOM JEST NICZYJ. Падежных требований нет. Двойного отрицания не нужно: NICZYJ уже отрицание, глагол без NIE: TO NICZYJA WINA." }
  - { kind: pronunciation, text: "Читается «ни́чый», два слога, ударение на первом. NI — мягкое «ни», CZY — твёрдое «чы», J — «й». Сравните с CZYJ «чый»." }
  - { kind: register, text: "Нейтральное слово. ZIEMIA NICZYJA, «ничейная земля», — устойчивый образ: так называют и пограничную полосу, и что-то промежуточное, неопределённое. NICZYJE DZIECKO — грустное «ничейный ребёнок», брошенный." }
collocations:
  - { pl: "ziemia niczyja", ru: "ничейная земля" }
  - { pl: "niczyja wina", ru: "ничья вина" }
  - { pl: "niczyje dziecko", ru: "ничейный ребёнок" }
family:
  - { pl: "czyj", ru: "чей", relation: root, id: czyj }
  - { pl: "nikt", ru: "никто", relation: root, id: nikt }
  - { pl: "remis", ru: "ничья (в спорте)", relation: root }
etymology: "Сложение отрицательного NI- и CZYJ «чей», общеславянского *čijь. Русское «ничей» собрано так же, морфема в морфему. Так же построены NIKT «никто», NIC «ничего», NIGDY «никогда»: польская приставка NI- — то же, что русская «ни-»."
memory: "Niczyj — ничей: niczyj pies, ziemia niczyja. Склоняется как czyj. А «ничья» в спорте — remis! Читается «ни́чый»."
idioms:
  - { pl: "ziemia niczyja", ru: "ничейная земля, нейтральная полоса" }
formExamplesSkip:
