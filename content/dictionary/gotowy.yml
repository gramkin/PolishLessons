# review
id: gotowy
format: 2
lemma: "gotowy"
rank: 232
pos: adj
pron: { cyr: "гото́вы" }
senses:
  - id: ready
    ru: "готовый, готов (к чему-либо)"
    examples:
      - pl: "Jestem gotowa."
        ru: "Я готова."
        source: { kind: tatoeba, id: 3326942 }
      - pl: "Jestem gotowy."
        ru: "Я готов."
        source: { kind: tatoeba, id: 361233 }
      - pl: "Jestem już gotowy."
        ru: "Я уже готов."
        source: { kind: tatoeba, id: 4735563 }
  - id: finished
    ru: "готов, закончен; краткая форма gotów"
    examples:
      - pl: "Gotów!"
        ru: "Готов!"
        source: { kind: tatoeba, id: 730542 }
      - pl: "Obiad gotów."
        ru: "Обед готов."
        source: { kind: tatoeba, id: 356494 }
      - pl: "Wszyscy gotowi."
        ru: "Все готовы."
        source: { kind: tatoeba, id: 12569800 }
notes:
  - { kind: usage, text: "У этого прилагательного есть краткая форма мужского рода gotów: Jestem gotów = Jestem gotowy, Obiad gotów." }
  - { kind: usage, text: "Управление: gotowy na coś «готов к чему-то (что может случиться)» и gotowy do czegoś «готов к чему-то (к делу)»." }
  - { kind: usage, text: "От того же корня gotówka — «наличные деньги», а gotować — «готовить, варить»." }
collocations:
  - { pl: "gotowy na wszystko", ru: "готов на всё" }
  - { pl: "gotowy do drogi", ru: "готов в путь" }
  - { pl: "danie gotowe", ru: "готовое блюдо" }
  - { pl: "jestem gotów", ru: "я готов" }
etymology: "Праславянское *gotovъ — то же слово, что русское «готовый»."
memory: "gotowy — прозрачное «готовый», но запомните краткую форму gotów: Obiad gotów. И родственное gotówka — «наличные»."
idioms:
  - { pl: "przyjść na gotowe", ru: "прийти на готовенькое" }
  - { pl: "gotowy na wszystko", ru: "готов на всё" }
  - { pl: "mieć na wszystko gotową odpowiedź", ru: "иметь на всё готовый ответ" }
