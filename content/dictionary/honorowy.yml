etymology: "Из латинского HONOR «честь, почесть», через средневековую латынь и французский. Русский взял тот же корень дважды и разными путями: «гонор» в значении спеси, через польский, и «гонорар» через немецкий, от HONORARIUM, то есть платы в честь оказанной услуги. Польский же сохранил HONOR в прямом и высоком смысле чести, а вокруг него вырастил HONOROWY, HONOROWO и HONOROWAĆ. Последний отошёл дальше всех и означает теперь «принимать к оплате»."
memory: "Корень латинский, но гнездо шире русского. Honorowy это «почётный» (gość honorowy) и «благородный» (człowiek honorowy). Главный сюрприз в глаголе: honorować значит не «чтить», а «принимать», и табличка honorujemy karty płatnicze означает «принимаем карты». Honorarium это «гонорар», из того же корня. Читается «хоноро́вы»: h даёт «х», и оба o звучат отчётливо, без русской редукции в «а»."
