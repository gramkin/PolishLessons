notes:
  - { kind: false-friend, text: "Корень латинский и русскому знакомый, но гнездо разошлось сильно. HONOROWY это «почётный» и «благородный». А вот глагол HONOROWAĆ значит не «чтить», а «принимать, признавать»: табличка HONORUJEMY KARTY PŁATNICZE в магазине значит «принимаем банковские карты». И HONORARIUM, то есть «гонорар», тоже сюда: русский взял это слово из того же латинского корня, но через немецкое посредство и с другим ударением." }
  - { kind: usage, text: "Одиннадцать форм. Мужско-личная форма множественного числа HONOROWI обиходна и частотна: HONOROWI GOŚCIE «почётные гости», HONOROWI DAWCY KRWI «почётные доноры». Прилагательное в первом значении почти всегда стоит после существительного: GOŚĆ HONOROWY, OBYWATEL HONOROWY, WARTA HONOROWA. Во втором значении, о человеке чести, оно, наоборот, может идти и перед ним." }
  - { kind: government, text: "Стать почётным гражданином — ZOSTAĆ с творительным: ZOSTAĆ OBYWATELEM HONOROWYM, тогда как русский говорит «стать кем-то» тоже творительным, так что схема совпадает. Под почётным патронатом — POD PATRONATEM HONOROWYM, предлог POD с творительным. В почётном карауле — W WARCIE HONOROWEJ, предлог W с местным падежом. Поступить благородно — POSTĄPIĆ W SPOSÓB HONOROWY или просто HONOROWO." }
  - { kind: pronunciation, text: "Читается «хоноро́вы», четыре слога, ударение на предпоследнем. Буква H даёт «х», ровно как CH, и никакого придыхания на русский лад тут не нужно: поляк произносит её так же, как в слове HERBATA «чай». Обе буквы O звучат отчётливо, без редукции в «а», и это главная трудность для русского: не «ханаро́вы», а именно «хоноро́вы». Конечное Y даёт «ы»." }
  - { kind: register, text: "Слово нейтральное, часто встречается в официальных и праздничных контекстах: GOŚĆ HONOROWY, OBYWATEL HONOROWY MIASTA «почётный гражданин города», WARTA HONOROWA «почётный караул», PATRONAT HONOROWY «почётное покровительство», HONOROWY DAWCA KRWI, у которого в Польше есть настоящие льготы на проезд. Во втором значении, о человеке, оно звучит слегка старомодно и благородно: CZŁOWIEK HONOROWY." }
