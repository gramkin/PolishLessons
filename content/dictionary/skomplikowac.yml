# review
id: skomplikowac
format: 2
lemma: "skomplikować"
rank: 4834
pos: verb
pron: { cyr: "скомплико́ваць" }
senses:
  - id: complicate
    ru: "усложнить, осложнить"
    examples:
      - pl: "Deszcz skomplikował nasze plany."
        ru: "Дождь осложнил наши планы."
        source: { kind: authored }
      - pl: "Jego przyjazd skomplikował sytuację."
        ru: "Его приезд осложнил ситуацию."
        source: { kind: authored }
      - pl: "Ta decyzja może wszystko skomplikować."
        ru: "Это решение может всё усложнить."
        source: { kind: authored }
  - id: get-complicated
    ru: "с SIĘ — осложниться, запутаться"
    examples:
      - pl: "Sprawa się skomplikowała."
        ru: "Дело осложнилось."
        source: { kind: authored }
      - pl: "Sytuacja skomplikowała się po wyborach."
        ru: "После выборов ситуация осложнилась."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "SKOMPLIKOWAĆ — «усложнить», а не «скомплектовать»: «скомплектовать» — SKOMPLETOWAĆ. SKOMPLIKOWANY — «сложный»: SKOMPLIKOWANA SPRAWA. «Комплимент» — KOMPLEMENT, это другое слово." }
  - { kind: usage, text: "Пятьдесят три формы, включая SKOMPLIKOWANI — о «сложных» людях. Спряжение на -UJĘ: SKOMPLIKUJĘ, SKOMPLIKUJESZ, повелительное SKOMPLIKUJ. Несовершенный вид — KOMPLIKOWAĆ: NIE KOMPLIKUJ! «не усложняй!»." }
  - { kind: government, text: "Что — винительный: SKOMPLIKOWAĆ SPRAWĘ. Кому — дательный: SKOMPLIKOWAĆ KOMUŚ ŻYCIE. С SIĘ — без дополнения: SPRAWA SIĘ SKOMPLIKOWAŁA." }
  - { kind: pronunciation, text: "Читается «скомплико́ваць», ударение на предпоследнем слоге KO. SKOMPLIKUJĘ — «скомплику́е»." }
  - { kind: register, text: "Нейтральное слово, книжное и разговорное. SKOMPLIKOWAĆ KOMUŚ ŻYCIE — разговорное «усложнить жизнь». Запрет «не усложняй» обычно в несовершенном виде: NIE KOMPLIKUJ." }
collocations:
  - { pl: "skomplikować sytuację", ru: "осложнить ситуацию" }
  - { pl: "skomplikować komuś życie", ru: "усложнить кому-то жизнь" }
  - { pl: "sprawa się skomplikowała", ru: "дело осложнилось" }
family:
  - { pl: "skomplikowany", ru: "сложный", relation: derived, id: skomplikowany }
  - { pl: "komplikacja", ru: "осложнение, сложность", relation: derived }
  - { pl: "komplikować", ru: "усложнять", relation: aspect }
etymology: "Приставка S- плюс KOMPLIKOWAĆ, из латинского complicare «сплетать, складывать вместе». Буквально — «сплести вместе»."
memory: "Skomplikować — усложнить: deszcz skomplikował plany. Skomplikowany — сложный. Nie komplikuj! — не усложняй! Читается «скомплико́ваць»."
