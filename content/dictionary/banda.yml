  - id: gangs-plural
    ru: "банды (мн. ч.)"
    examples:
      - pl: "Bandy grasowały na przedmieściach."
        ru: "Банды орудовали на окраинах."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ПО-РУССКИ «БАНДА» ВСЕГДА ПРЕСТУПНАЯ — ПО-ПОЛЬСКИ НЕ ВСЕГДА. Первое значение общее: шайка преступников. Но в разговоре banda часто значит просто шумную компанию, и ничего дурного в этом нет: nasza banda, banda przyjaciół, banda dzieciaków. Сказать по-русски «наша банда» о друзьях можно только в шутку, по-польски — буднично." }
  - { kind: pronunciation, text: "ПРЕДЛОЖНЫЙ ПАДЕЖ СМЯГЧАЕТ D В DZI: W BANDZIE. Тот же ряд уже встречался: naród — w narodzie, wygląd — w wyglądzie, ogród — w ogrodzie, metoda — w metodzie. Два слога, ударение на первом: BAN-da." }
  - { kind: usage, text: "Уменьшительное bandziorek шутливо, а bandzior — это уже «бандюга», грубо. Прилагательное bandycki «бандитский», существительное bandyta «бандит» — последнее, кстати, мужского рода с женским склонением, как zwycięzca i kolega." }
collocations:
  - { pl: "banda przyjaciół", ru: "компания друзей" }
  - { pl: "rozbić bandę", ru: "разгромить банду" }
  - { pl: "cała banda", ru: "вся компания" }
family:
  - { pl: "bandyta", ru: "бандит", relation: derived }
  - { pl: "bandycki", ru: "бандитский", relation: derived }
  - { pl: "grupa", ru: "группа", relation: root, id: grupa }
etymology: "Из итальянского banda «отряд, знамя», через немецкий Bande — того же корня, что немецкое Band «лента» и английское band. В русский слово пришло тем же путём, но закрепилось только за преступной шайкой; польский сохранил и нейтральный оттенок отряда, откуда разговорное «компания»."
memory: "banda — «банда», но в разговоре часто просто КОМПАНИЯ: nasza banda, banda przyjaciół, безо всякого осуждения. Предложный смягчает d: w bandzie, как w narodzie."
idioms:
  - { pl: "cała banda", ru: "вся компания" }
  - { pl: "rozbić bandę", ru: "разгромить банду" }
