pos: noun
pron: { cyr: "ба́нда" }
senses:
  - id: gang
    ru: "банда, шайка"
    examples:
      - pl: "Bandę rozbito po roku."
        ru: "Банду разгромили через год."
        source: { kind: authored }
      - pl: "Banda napadła na transport."
        ru: "Банда напала на транспорт."
        source: { kind: authored }
  - id: crowd-friendly
    ru: "компания, ватага (разг., без осуждения)"
    examples:
      - pl: "Przyszła cała nasza banda."
        ru: "Пришла вся наша компания."
        source: { kind: authored }
      - pl: "Banda dzieciaków biegała po podwórku."
        ru: "Ватага детей бегала по двору."
