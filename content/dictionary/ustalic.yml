# review
id: ustalic
format: 2
lemma: "ustalić"
rank: 1597
pos: verb
aspect: perf
pron: { cyr: "уста́лиць" }
senses:
  - id: establish
    ru: "установить, определить"
    examples:
      - pl: "Próbujemy to ustalić."
        ru: "Мы пытаемся это установить."
        source: { kind: translated, id: 12061881 }
      - pl: "Policja ustaliła, gdzie przebywał w czasie zajścia zbrodni."
        ru: "Полиция установила, где он был во время преступления."
        source: { kind: translated, id: 524630 }
      - pl: "Już ustalono odległość między księżycem a Ziemią."
        ru: "Расстояние между Луной и Землёй уже установлено."
        source: { kind: translated, id: 2310323 }
  - id: agree
    ru: "договориться, условиться"
    examples:
      - pl: "Ustalili czas i miejsce wesela."
        ru: "Они назначили время и место свадьбы."
        source: { kind: translated, id: 357700 }
      - pl: "Ustaliliśmy datę kolejnego spotkania."
        ru: "Мы назначили дату следующей встречи."
        source: { kind: translated, id: 739261 }
      - pl: "Przyszłam sama, tak jak ustaliliśmy."
        ru: "Я пришла одна, как мы и договорились."
        source: { kind: translated, id: 7558646 }
notes:
  - { kind: government, text: "Требует винительного падежа: ustalić cenę «установить цену», ustalić datę «назначить дату»." }
  - { kind: usage, text: "Несовершенный вид — ustalać. Существительное ustalenie значит «установление», а во множественном ustalenia — «договорённости»." }
  - { kind: usage, text: "Безличное ustalono «установили» частотно в отчётах: Już ustalono odległość «Расстояние уже установлено»." }
  - { kind: usage, text: "Причастие ustalony значит «установленный, оговорённый»: w ustalonym terminie «в оговорённый срок»." }
collocations:
  - { pl: "ustalić datę", ru: "назначить дату" }
  - { pl: "ustalić cenę", ru: "установить цену" }
  - { pl: "ustalić zasady", ru: "установить правила" }
etymology: "Приставка u- + stalić, от stały «постоянный» (и далее от stać «стоять»). Русское «установить» собрано тем же способом: у- + «стан-/став-» от «стоять». Логика совпадает полностью."
memory: "ustalić = «установить, назначить, договориться»: ustalić datę «назначить дату». Несовершенный вид — ustalać, а ustalenia во множественном значит «договорённости»."
idioms:
  - { pl: "ustalić datę", ru: "назначить дату" }
  - { pl: "ustalić zasady", ru: "установить правила" }
  - { pl: "w ustalonym terminie", ru: "в оговорённый срок" }
