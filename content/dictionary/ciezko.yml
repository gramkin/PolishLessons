pos: adv
pron: { cyr: "це́нжко" }
senses:
  - id: hard
    ru: "тяжело, трудно"
    examples:
      - pl: "Ciężko mi to powiedzieć."
        ru: "Мне тяжело это сказать."
        source: { kind: authored }
      - pl: "Pracował ciężko przez trzydzieści lat."
        ru: "Он тяжело работал тридцать лет."
        source: { kind: authored }
