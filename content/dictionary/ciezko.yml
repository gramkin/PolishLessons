  - id: ill
    ru: "тяжело (о болезни)"
    examples:
      - pl: "Jest ciężko chory."
        ru: "Он тяжело болен."
        source: { kind: authored }
      - pl: "Po wypadku był ciężko ranny."
        ru: "После аварии он был тяжело ранен."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Форм всего три, и это не ошибка: наречие не изменяется ни по падежам, ни по родам, у него есть только степени. CIĘŻKO, CIĘŻEJ, NAJCIĘŻEJ — положительная, сравнительная и превосходная. Сравнительная при этом короче исходной формы: -ko отпадает, а на его место приходит -ej. Так же устроены szybko — szybciej, daleko — dalej, dużo — więcej." }
  - { kind: usage, text: "Самая частая конструкция безличная, с дательным: CIĘŻKO MI «мне тяжело», ciężko mu było, będzie wam ciężko. Подлежащего в ней нет вовсе, ровно как в русском. Отдельно стоит значение степени при прилагательном: ciężko chory «тяжело больной», ciężko ranny «тяжело раненный», где по-русски тоже стоит наречие." }
collocations:
  - { pl: "ciężko pracować", ru: "тяжело работать" }
  - { pl: "ciężko chory", ru: "тяжело больной" }
  - { pl: "ciężko mi", ru: "мне тяжело" }
family:
  - { pl: "ciężki", ru: "тяжёлый", relation: root, id: ciezki }
  - { pl: "ciężar", ru: "груз, тяжесть", relation: derived }
  - { pl: "lekko", ru: "легко", relation: antonym }
etymology: "От прилагательного CIĘŻKI, из праславянского *tęžькъ — то же слово, что русское «тяжкий» и «тяжёлый». Начальное t перед носовым гласным дало в польском ć, отсюда непохожесть на первый взгляд. Русское «тяжело» построено от того же прилагательного тем же способом, так что пара ciężki/ciężko точно отвечает нашей «тяжёлый/тяжело»."
memory: "Три формы, потому что наречие: ciężko, ciężej, najciężej. Сравнительная короче исходной, как szybko — szybciej."
idioms:
