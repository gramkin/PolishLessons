# review
id: przyprowadzic
format: 2
lemma: "przyprowadzić"
rank: 1201
pos: verb
aspect: perf
pron: { cyr: "пшыпрова́дзиць" }
senses:
  - id: bring-person
    ru: "привести (кого-либо куда-либо)"
    examples:
      - pl: "Czy możemy przyprowadzić Toma?"
        ru: "Мы можем привести Тома?"
        source: { kind: tatoeba, id: 2405977 }
      - pl: "Tom przyprowadził mnie do domu."
        ru: "Том привёл меня домой."
        source: { kind: translated, id: 6441652 }
      - pl: "Przyprowadź Toma."
        ru: "Приведи Тома."
        source: { kind: translated, id: 8750969 }
  - id: bring-along
    ru: "привести с собой, взять с собой (человека, животное)"
    examples:
      - pl: "Mogę przyprowadzić znajomych?"
        ru: "Можно я приведу друзей?"
        source: { kind: translated, id: 4953043 }
      - pl: "Czemu nie przyprowadziłeś żony na imprezę?"
        ru: "Почему ты не привёл жену на вечеринку?"
        source: { kind: translated, id: 3064053 }
notes:
  - { kind: false-friend, text: "Глагол только о тех, кого ведут своим ходом. Вещь приносят — przynieść, на транспорте привозят — przywieźć. По-русски все три случая покрывает «привести/принести/привезти» так же раздельно." }
  - { kind: government, text: "przyprowadzić kogo (винительный) и куда: przyprowadzić dzieci do szkoły «отвести детей в школу», przyprowadzić kogoś do domu «привести кого-то домой»." }
  - { kind: usage, text: "Приставка przy- означает движение к говорящему: prowadzić «вести» — przyprowadzić «привести». Ср. odprowadzić «проводить, отвести», wyprowadzić «вывести», doprowadzić «довести»." }
  - { kind: usage, text: "Совершенный вид; несовершенная пара — przyprowadzać." }
collocations:
  - { pl: "przyprowadzić dzieci", ru: "привести детей" }
  - { pl: "przyprowadzić ze sobą", ru: "привести с собой" }
  - { pl: "przyprowadzić do domu", ru: "привести домой" }
etymology: "Приставка przy- «при-» и prowadzić «вести» (праславянское *voditi). Русское «привести» собрано из тех же двух частей, поэтому слово разбирается насквозь."
memory: "przyprowadzić — «привести», przy- плюс prowadzić, ровно как русское «при-» плюс «вести». Главное ограничение: только о живых, которых ведут. Вещь — przynieść, на машине — przywieźć."
idioms:
  - { pl: "przyprowadzić ze sobą", ru: "привести с собой" }
  - { pl: "przyprowadzić dzieci do szkoły", ru: "отвести детей в школу" }
  - { pl: "przyprowadzić wsparcie", ru: "привести подмогу" }
