# review
id: trzeba
format: 2
lemma: "trzeba"
rank: 252
pos: adv
pron: { cyr: "тше́ба" }
senses:
  - id: must
    ru: "надо, нужно"
    examples:
      - pl: "Trzeba działać!"
        ru: "Надо действовать!"
        source: { kind: tatoeba, id: 3744786 }
      - pl: "Co trzeba zrobić?"
        ru: "Что нужно сделать?"
        source: { kind: tatoeba, id: 4964716 }
      - pl: "Tutaj trzeba wstawić myślnik."
        ru: "Здесь нужно тире."
        source: { kind: tatoeba, id: 13547062 }
  - id: should-have
    ru: "trzeba było — надо было; nie trzeba — не надо"
    examples:
      - pl: "Nie trzeba ich odprowadzać."
        ru: "Их не нужно провожать."
        source: { kind: tatoeba, id: 403222 }
      - pl: "Trzeba było tam pójść samemu."
        ru: "Надо было самому туда зайти."
        source: { kind: tatoeba, id: 2148492 }
      - pl: "Czy to naprawdę trzeba zrobić?"
        ru: "Это действительно нужно сделать?"
        source: { kind: tatoeba, id: 12046659 }
notes:
  - { kind: usage, text: "trzeba безлично и всегда идёт с инфинитивом: Trzeba iść «Надо идти». Лица у него нет." }
  - { kind: usage, text: "Прошедшее время образуется просто добавлением było: trzeba było iść «надо было идти». Будущее — trzeba będzie." }
  - { kind: usage, text: "Когда нужно назвать, кому надо, ставят дательный: trzeba mi odpocząć. Но в живой речи чаще говорят muszę odpocząć." }
collocations:
  - { pl: "trzeba było", ru: "надо было" }
  - { pl: "nie trzeba", ru: "не надо" }
  - { pl: "jak trzeba", ru: "как надо" }
  - { pl: "trzeba przyznać", ru: "надо признать" }
etymology: "От праславянского *terbъ «нужный, потребный» — то же гнездо, что русские «требовать», «потребность», «треба»."
memory: "trzeba — «надо», безлично и всегда с инфинитивом: Trzeba iść. Прошедшее время делается одним словом: trzeba było. Корень тот же, что в русском «требовать»."
idioms:
