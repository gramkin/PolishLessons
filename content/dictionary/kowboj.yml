etymology: "Из английского COWBOY, буквально «коровий парень»: COW «корова» и BOY «мальчик, парень». Слово пришло в Европу вместе с американским кино в двадцатом веке и всюду сохранило значение, но не написание. Польский записал его по произношению — KOWBOJ, — потому что польская орфография последовательно передаёт звучание, и оставить английский вид слова значило бы читать его неправильно. Так же поступили с DŻUNGLA, DŻEM, MECZ и WEEKEND, который в польском пишется ещё по-английски, но склоняется по-польски: WEEKENDU, WEEKENDEM. Русский действует так же, и совпадение тут не случайное: обе орфографии фонетические, просто польская пользуется латиницей и потому её работа заметнее."
memory: "Английское cowboy, записанное по звучанию: kowboj. В этом весь урок — польский переписывает заимствования по своим правилам чтения, как dżinsy, keczup, biznes, lider. Множественное kowboje, не kowbojowie: окончание -owie польский держит за родством и титулами. Рядом с соседними карточками видно весь набор: widzowie, cywile, kowboje. Два родительных множественного: kowbojów и реже kowboi."
