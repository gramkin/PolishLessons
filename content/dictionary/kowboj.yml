notes:
  - { kind: false-friend, text: "Значение то же, что в русском, и источник тот же — английское COWBOY. Расходится написание, и в этом весь урок. Польский переписывает заимствования по своим правилам чтения: KOWBOJ, а не COWBOY, как DŻINSY вместо JEANS, KECZUP вместо KETCHUP, BIZNES вместо BUSINESS и LIDER вместо LEADER. Русский делает то же самое, но ему помогает другая азбука, и потому разница не бросается в глаза. Для читающего по-польски это важно: английское слово в тексте почти наверняка будет выглядеть иначе, чем в оригинале, и узнавать его придётся на слух, а не на глаз." }
  - { kind: usage, text: "Одиннадцать форм, мужской род, одушевлённое лицо. Именительный множественного — KOWBOJE, по образцу слов на -J, а не KOWBOJOWIE: окончание -OWIE польский держит за словами родства и за титулами, и к недавним заимствованиям оно не идёт. Родительных множественного два: KOWBOJÓW и KOWBOI, и оба правильны, хотя первое заметно употребительнее. Винительный единственного равен родительному, KOWBOJA. Местный и звательный единственного — KOWBOJU. В сравнении с соседними карточками видно всё разнообразие: WIDZOWIE, CYWILE, KOWBOJE — три разных окончания у трёх названий лиц." }
  - { kind: pronunciation, text: "Читается «ко́вбой», два слога, ударение на первом. Буква W здесь звучит как «в», потому что следом идёт звонкий B. Сочетание OJ на конце даёт «ой», как в русском. В форме KOWBOJA слышно «ковбо́я», в форме KOWBOJEM — «ковбо́ем», в форме KOWBOJU — «ковбо́ю». Родительный KOWBOI читается «ковбо́и», а KOWBOJÓW — «ковбо́юф», где Ó даёт «у», а конечное W оглушается в «ф»." }
  - { kind: register, text: "Слово нейтральное и в прямом значении довольно редкое, зато очень живое в разговоре о кино и в детской игре: BAWIĆ SIĘ W KOWBOJÓW I INDIAN. Прилагательное KOWBOJSKI входит в частые сочетания: KOWBOJSKI KAPELUSZ «ковбойская шляпа», KOWBOJSKIE BUTY «ковбойские сапоги», FILM KOWBOJSKI, хотя сам жанр чаще называют WESTERN. В переносном значении слово изредка употребляют о человеке, который действует лихо и не считается с правилами, и тогда оно звучит с лёгким осуждением, как и русское «ковбой» в похожем обороте." }
