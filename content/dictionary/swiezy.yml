      - pl: "Chciałbym zjeść świeżą rybkę."
        ru: "Я хотел бы съесть свежей рыбки."
        source: { kind: translated, id: 759572 }
  - id: fresh-air
    ru: "свежий (о воздухе, красках, впечатлениях)"
    examples:
      - pl: "John jest przekonany, że świeże powietrze to dobra rzecz."
        ru: "Джон уверен, что свежий воздух - это хорошая вещь."
        source: { kind: tatoeba, id: 840177 }
      - pl: "Potrzebujemy świeżego powietrza."
        ru: "Нам нужен свежий воздух."
        source: { kind: translated, id: 930256 }
      - pl: "Spędziliśmy dzień na świeżym powietrzu."
        ru: "Мы провели день на свежем воздухе."
        source: { kind: translated, id: 3884202 }
notes:
  - { kind: usage, text: "na świeżym powietrzu — «на свежем воздухе», самое частое сочетание: spędzać czas na świeżym powietrzu." }
  - { kind: usage, text: "Степени сравнения: świeższy «свежее», najświeższy «самый свежий». Есть и книжная лично-мужская форма świeżsi." }
  - { kind: usage, text: "Наречие — świeżo: świeżo upieczony «свежеиспечённый», а в переносном смысле «новоиспечённый»." }
  - { kind: false-friend, text: "О краске świeża farba значит «непросохшая краска», а не «недавно купленная». Объявление Świeżo malowane! — это русское «Окрашено!»." }
collocations:
  - { pl: "świeże powietrze", ru: "свежий воздух" }
  - { pl: "świeży chleb", ru: "свежий хлеб" }
  - { pl: "świeżo malowane", ru: "окрашено" }
etymology: "Праславянское *svěžь — то же самое слово, что русское «свежий». Совпадение полное."
memory: "świeży — «свежий», слово то же самое. Главное сочетание: na świeżym powietrzu «на свежем воздухе». И запомните объявление Świeżo malowane! — это «Окрашено!», а не «недавно покрашено на продажу»."
idioms:
