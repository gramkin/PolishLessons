format: 2
lemma: "świeży"
rank: 1441
pos: adj
pron: { cyr: "сьве́жы" }
senses:
  - id: fresh-food
    ru: "свежий (о продуктах)"
    examples:
      - pl: "Chleb jest świeży."
        ru: "Хлеб свежий."
        source: { kind: tatoeba, id: 3034883 }
      - pl: "W czasie ciepłych pór roku świeża żywność szybko się psuje."
        ru: "В тёплое время года свежие продукты быстро портятся."
