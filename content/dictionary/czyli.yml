# review
id: czyli
format: 2
lemma: "czyli"
rank: 558
pos: part
pron: { cyr: "чы́ли" }
senses:
  - id: that-is
    ru: "то есть, а именно"
    note: "Соединяет два названия одного и того же."
    examples:
      - pl: "Jest siostrą mojego ojca, czyli moją ciotką."
        ru: "Она сестра моего отца, то есть моя тётя."
        source: { kind: tatoeba, id: 1920855 }
      - pl: "Uśmiechnęła się, czyli nam wybaczyła."
        ru: "Она улыбнулась, то есть простила нас."
        source: { kind: translated, id: 841676 }
      - pl: "\"Czyli to książki?\" \"Alicji.\""
        ru: "«То есть это книги?» — «Алисины.»"
        source: { kind: translated, id: 495076 }
  - id: so
    ru: "значит, итак (в разговоре)"
    note: "Открывает вывод: Czyli znasz odpowiedź?"
    examples:
      - pl: "Czyli znasz odpowiedź?"
        ru: "Значит, ты знаешь ответ?"
        source: { kind: translated, id: 493178 }
      - pl: "Trochę - czyli ile?"
        ru: "Немного — то есть сколько?"
        source: { kind: translated, id: 10707151 }
      - pl: "Czyli jednak przyjdziesz?"
        ru: "Значит, ты всё-таки придёшь?"
        source: { kind: authored }
notes:
  - { kind: usage, text: "czyli поясняет: одно и то же названо дважды — Jest siostrą mojego ojca, czyli moją ciotką «Она сестра моего отца, то есть моя тётя»." }
  - { kind: usage, text: "В разговоре им начинают вывод: Czyli znasz odpowiedź? «Значит, ты знаешь ответ?»" }
  - { kind: false-friend, text: "Не путайте с albo «или»: albo предлагает выбор, а czyli поясняет уже сказанное." }
  - { kind: usage, text: "Перед czyli ставится запятая, после — нет: …, czyli moją ciotką." }
collocations:
  - { pl: "czyli co?", ru: "то есть как?" }
  - { pl: "czyli że", ru: "то есть, значит" }
  - { pl: "to znaczy", ru: "то есть" }
  - { pl: "czyli jednak", ru: "значит, всё-таки" }
family:
  - { pl: "czy", ru: "ли, разве", relation: root }
  - { pl: "albo", ru: "или", relation: derived }
etymology: "Из czy «ли, разве» плюс частица -li — та же, что в русском «ли». Буквально «что ли»."
memory: "czyli — «то есть», и служит оно пояснению: одно и то же названо дважды. Jest siostrą mojego ojca, czyli moją ciotką. В разговоре с него начинают вывод: Czyli znasz odpowiedź? «Значит, ты знаешь ответ?» А вот с albo «или» его путать не стоит: albo даёт выбор, czyli только поясняет."
idioms:
