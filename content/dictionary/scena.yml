# review
id: scena
format: 2
lemma: "scena"
rank: 1069
pos: noun
pron: { cyr: "сцэ́на" }
senses:
  - id: stage
    ru: "сцена (в театре)"
    examples:
      - pl: "On stoi na scenie."
        ru: "Он стоит на сцене."
        source: { kind: translated, id: 440679 }
      - pl: "Tom zszedł ze sceny."
        ru: "Том сошёл со сцены."
        source: { kind: translated, id: 5377697 }
      - pl: "Gdzie jest wejście na scenę?"
        ru: "Где вход на сцену?"
        source: { kind: translated, id: 4735288 }
  - id: episode
    ru: "сцена, эпизод (в фильме, пьесе)"
    examples:
      - pl: "To była okropna scena."
        ru: "Это была ужасная сцена."
        source: { kind: translated, id: 2263213 }
      - pl: "Scena została pokazana w zwolnionym tempie."
        ru: "Сцену показали в замедленном темпе."
        source: { kind: translated, id: 6404016 }
      - pl: "Zagrajmy czwartą scenę."
        ru: "Сыграем четвёртую сцену."
        source: { kind: translated, id: 3882879 }
  - id: make-scene
    ru: "robić sceny — устраивать сцены"
    examples:
      - pl: "Nie rób scen na oczach wszystkich!"
        ru: "Не устраивай сцен у всех на глазах!"
        source: { kind: translated, id: 1348799 }
      - pl: "Nie rób scen w miejscu publicznym."
        ru: "Не устраивай сцен в общественном месте."
        source: { kind: translated, id: 3545500 }
      - pl: "Nie rób sceny w publicznym miejscu."
        ru: "Не устраивай сцену в общественном месте."
        source: { kind: translated, id: 1110142 }
notes:
  - { kind: government, text: "Место — na scenie с предложным: stoi na scenie «стоит на сцене». Движение — na scenę с винительным: wejście na scenę «вход на сцену»." }
  - { kind: usage, text: "robić sceny — «устраивать сцены», совпадает с русским выражением до буквы." }
  - { kind: usage, text: "scena zbrodni — «место преступления», буквально «сцена преступления». Русский тут берёт другое слово." }
  - { kind: usage, text: "Слово латинское, из греческого σκηνή, как и русская «сцена», поэтому первые два значения совпадают полностью." }
collocations:
  - { pl: "na scenie", ru: "на сцене" }
  - { pl: "zejść ze sceny", ru: "сойти со сцены" }
  - { pl: "robić sceny", ru: "устраивать сцены" }
  - { pl: "scena zbrodni", ru: "место преступления" }
family:
  - { pl: "sceniczny", ru: "сценический", relation: derived }
  - { pl: "scenariusz", ru: "сценарий", relation: derived }
etymology: "Из латинского scaena, от греческого σκηνή «шатёр, подмостки» — тем же путём, что и русская «сцена»."
memory: "scena — «сцена» и в театре, и в фильме, как в русском. Запомните падежи: stoi NA scenie (предложный), но wejście NA scenę (винительный). И robić sceny — «устраивать сцены»."
idioms:
  - { pl: "na scenie", ru: "на сцене" }
  - { pl: "robić sceny", ru: "устраивать сцены" }
  - { pl: "scena zbrodni", ru: "место преступления" }
formExamplesSkip:
  - { form: "sceno", reason: "звательный падеж: к сцене не обращаются, форма не употребляется" }
