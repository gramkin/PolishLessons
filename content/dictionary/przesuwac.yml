# review
id: przesuwac
format: 2
lemma: "przesuwać"
rank: 6035
pos: verb
aspect: imperf
aspectPair: przesunac
pron: { cyr: "пшэсу́ваць" }
senses:
  - id: move
    ru: "передвигать, сдвигать, двигать (по поверхности)"
    examples:
      - pl: "Co wieczór przesuwam stół pod okno."
        ru: "Каждый вечер я передвигаю стол к окну."
        source: { kind: authored }
      - pl: "Przesuwaj palcem po ekranie w lewo."
        ru: "Проводи пальцем по экрану влево."
        source: { kind: authored }
      - pl: "Lodowiec przesuwa się powoli."
        ru: "Ледник медленно движется."
        source: { kind: translated, id: 13561535 }
  - id: reschedule
    ru: "переносить (срок, встречу), откладывать"
    examples:
      - pl: "Szef znowu przesuwa termin oddania projektu."
        ru: "Начальник опять переносит срок сдачи проекта."
        source: { kind: authored }
      - pl: "Przesuwamy spotkanie na przyszły tydzień."
        ru: "Мы переносим встречу на следующую неделю."
        source: { kind: authored }
  - id: transfer
    ru: "переводить, перемещать (людей, деньги, ресурсы)"
    examples:
      - pl: "Firma przesuwa pracowników do nowego działu."
        ru: "Фирма переводит сотрудников в новый отдел."
        source: { kind: authored }
      - pl: "Rząd przesuwa pieniądze z jednego budżetu do drugiego."
        ru: "Правительство перебрасывает деньги из одного бюджета в другой."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "PRZESUWAĆ — «передвигать, сдвигать», а не «пересовывать». Корень SUW- тот же, что в русском «совать», «сувать», но в польском он значит именно «двигать скольжением»: PRZESUWAĆ SZAFĘ — «передвигать шкаф». Второе частое значение — «переносить срок»: PRZESUWAĆ TERMIN, PRZESUWAĆ SPOTKANIE." }
  - { kind: usage, text: "Несовершенный вид; совершенный — PRZESUNĄĆ (PRZESUNĘ, PRZESUNĄŁ). Спряжение на -AM: PRZESUWAM, PRZESUWASZ, PRZESUWAJĄ. Возвратное PRZESUWAĆ SIĘ — «двигаться, сдвигаться»: KOLEJKA PRZESUWA SIĘ POWOLI." }
  - { kind: government, text: "Что — винительный: PRZESUWAĆ STÓŁ. Куда — NA + винительный или DO + родительный: PRZESUWAĆ NA PIĄTEK, PRZESUWAĆ DO KĄTA. Срок «на сколько» — O + винительный: PRZESUWAĆ O TYDZIEŃ." }
  - { kind: pronunciation, text: "Читается «пшэсу́ваць»: PRZ — «пш», ударение на предпоследнем слоге. PRZESUWAMY — «пшэсува́мы»." }
collocations:
  - { pl: "przesuwać termin", ru: "переносить срок" }
  - { pl: "przesuwać meble", ru: "передвигать мебель" }
  - { pl: "przesuwać granice", ru: "раздвигать границы" }
  - { pl: "przesuwać się w kolejce", ru: "продвигаться в очереди" }
family:
  - { pl: "przesunąć", ru: "передвинуть, перенести", relation: aspect, id: przesunac }
  - { pl: "przesunięcie", ru: "сдвиг, перенос", relation: derived }
  - { pl: "sunąć", ru: "скользить, плыть", relation: root }
  - { pl: "przesuwny", ru: "раздвижной, сдвижной", relation: derived }
synonyms: ["przekładać", "posuwać"]
etymology: "Приставка PRZE- «пере-» плюс SUWAĆ, многократное от SUNĄĆ «скользить, двигаться»; родственно русскому «совать»."
memory: "Przesuwać — пере-совывать: сдвигать шкаф, переносить срок. Drzwi przesuwne — раздвижные двери."
idioms:
  - { pl: "przesuwać granice możliwości", ru: "раздвигать границы возможного" }
