# review
id: krwawic
format: 2
lemma: "krwawić"
rank: 1900
pos: verb
aspect: imperf
pron: { cyr: "крфа́виць" }
senses:
  - id: bleed
    ru: "кровоточить, истекать кровью"
    examples:
      - pl: "Tom krwawi."
        ru: "Том истекает кровью."
        source: { kind: translated, id: 8750923 }
      - pl: "Jego palec krwawi."
        ru: "У него кровоточит палец."
        source: { kind: translated, id: 2216999 }
      - pl: "Moje kolano krwawi."
        ru: "У меня кровоточит колено."
        source: { kind: translated, id: 8903230 }
      - pl: "Rana zaczęła krwawić."
        ru: "Рана начала кровоточить."
        source: { kind: translated, id: 10599132 }
      - pl: "Jego nos krwawił."
        ru: "У него шла кровь из носа."
        source: { kind: translated, id: 10605237 }
      - pl: "Krwawisz."
        ru: "У тебя идёт кровь."
        source: { kind: translated, id: 5665212 }
  - id: figurative
    ru: "в переносном смысле: сердце кровью обливается"
    examples:
      - pl: "Serce mi krwawi."
        ru: "У меня сердце кровью обливается."
        source: { kind: translated, id: 13654137 }
      - pl: "Serce krwawi, gdy patrzę na te zdjęcia."
        ru: "Сердце кровью обливается, когда я смотрю на эти снимки."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Непереходный глагол: кровоточит сам орган или человек. Moje kolano krwawi «У меня кровоточит колено», буквально «моё колено кровоточит»." }
  - { kind: usage, text: "Отглагольное существительное krwawienie «кровотечение» встречается не реже самого глагола: zatrzymać krwawienie «остановить кровотечение»." }
  - { kind: usage, text: "Русское «у меня идёт кровь» по-польски передаётся подлежащим: Krwawię «Я кровоточу» или Krwawi mi nos «У меня идёт кровь из носа»." }
  - { kind: government, text: "Раз глагол непереходный, страдательного причастия у него нет: форм krwawiony или krwawieni в языке не существует. Зато действительное причастие обычно — krwawiąca rana «кровоточащая рана»." }
collocations:
  - { pl: "krwawić z nosa", ru: "кровоточить из носа" }
  - { pl: "zatrzymać krwawienie", ru: "остановить кровотечение" }
  - { pl: "serce krwawi", ru: "сердце кровью обливается" }
etymology: "От krew «кровь» (праславянское *kry), того же корня, что русское «кровь» и «кровоточить». Польское krwawić и русское «кровоточить» построены от одного и того же существительного."
memory: "krwawić — «кровоточить», от krew «кровь». Обратите внимание на постановку: Moje kolano krwawi, буквально «моё колено кровоточит», а не «у меня кровоточит колено»."
idioms:
  - { pl: "serce krwawi", ru: "сердце кровью обливается" }
  - { pl: "zatrzymać krwawienie", ru: "остановить кровотечение" }
  - { pl: "krwawić z nosa", ru: "кровоточить из носа" }
