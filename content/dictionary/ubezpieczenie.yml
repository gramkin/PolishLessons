  - { pl: "ubezpieczyć", ru: "застраховать", relation: derived }
  - { pl: "ryzyko", ru: "риск", relation: root, id: ryzyko }
etymology: "От ubezpieczyć «застраховать», от bezpieczny «безопасный», а то из bez «без» и piecza «попечение, забота». Русское «беспечный» собрано из тех же двух частей, но пошло по другому пути: «без заботы» стало «неосторожный». Корень piecz- тот же, что в русском «печься о ком-то» и «опека»."
memory: "ubezpieczenie — «страховка», от bezpieczny «безопасный». А bezpieczny это bez плюс piecza «забота»: по-польски «без забот» значит безопасный, по-русски из тех же частей вышло «беспечный». Смыслы разошлись в противоположные стороны."
idioms:
