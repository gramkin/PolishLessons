notes:
  - { kind: false-friend, text: "КОРЕНЬ ЭТОГО СЛОВА — ТОТ ЖЕ, ЧТО В РУССКОМ «БЕСПЕЧНЫЙ», НО СМЫСЛ РАЗОШЁЛСЯ НА ПРОТИВОПОЛОЖНЫЙ. BEZPIECZNY это bez плюс piecza «попечение», то есть «без забот», и польский понял это как «безопасный»: не о чем беспокоиться. Русский из тех же частей вывел «беспечный», то есть беззаботный и неосторожный. Одна сборка, два противоположных итога." }
  - { kind: usage, text: "Это отглагольное существительное на -enie от ubezpieczyć, и формы у него те же, что у всего класса: восемь, среднего рода. Виды страхования запоминай готовыми: ubezpieczenie zdrowotne «медицинское», na życie «жизни», OC — обязательное автострахование. Взносы собирает ZUS, Zakład Ubezpieczeń Społecznych." }
  - { kind: pronunciation, text: "Пять слогов, ударение на предпоследнем: u-bez-pie-CZE-nie. Z перед глухим p оглушается до с, cz читается как ч: «убэспєчэ́не». Родительный множественного — ubezpieczeń, с мягким нь на конце." }
collocations:
