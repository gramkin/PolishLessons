# review
id: wypietrzenie
format: 2
lemma: "wypiętrzenie"
rank: 5861
pos: noun
pron: { cyr: "выпе́нтшэне" }
senses:
  - id: uplift
    ru: "поднятие (земной коры), возвышенность (геол.)"
    examples:
      - pl: "Tatry powstały w wyniku wypiętrzenia skorupy ziemskiej."
        ru: "Татры возникли в результате поднятия земной коры."
        source: { kind: authored }
      - pl: "Wypiętrzenie Alp trwało miliony lat."
        ru: "Поднятие Альп длилось миллионы лет."
        source: { kind: authored }
      - pl: "Na mapie widać rozległe wypiętrzenie terenu."
        ru: "На карте видна обширная возвышенность."
        source: { kind: authored }
  - id: bulge
    ru: "вспучивание, вздутие (покрытия, пола)"
    examples:
      - pl: "Mróz spowodował wypiętrzenie asfaltu na drodze."
        ru: "Мороз вызвал вспучивание асфальта на дороге."
        source: { kind: authored }
      - pl: "Panele źle ułożono i powstało wypiętrzenie."
        ru: "Ламинат плохо уложили, и образовалось вздутие."
        source: { kind: authored }
notes:
  - { kind: register, text: "Книжное слово, прежде всего геологический термин: WYPIĘTRZENIE GÓR «поднятие гор», WYPIĘTRZENIE SKORUPY ZIEMSKIEJ «поднятие земной коры». В быту его можно услышать от строителей и дорожников — о вспученном асфальте или вздувшемся полу." }
  - { kind: usage, text: "Отглагольное существительное от WYPIĘTRZYĆ SIĘ «вздыбиться, подняться», средний род на -ENIE. Склоняется как PYTANIE: WYPIĘTRZENIA, W WYPIĘTRZENIU; родительный множественного — WYPIĘTRZEŃ. Обозначает и сам процесс, и его результат — возвышение." }
  - { kind: pronunciation, text: "Читается «выпе́нтшэне»: Ę перед T звучит как «эн», RZ после T оглушается в «ш», так что TRZ — «тш». Ударение на предпоследнем слоге." }
collocations:
  - { pl: "wypiętrzenie gór", ru: "поднятие гор" }
  - { pl: "wypiętrzenie skorupy ziemskiej", ru: "поднятие земной коры" }
  - { pl: "wypiętrzenie terenu", ru: "возвышенность" }
family:
  - { pl: "wypiętrzyć", ru: "поднять, вздыбить", relation: root }
  - { pl: "wypiętrzać", ru: "поднимать, вздымать", relation: root }
  - { pl: "piętro", ru: "этаж, ярус", relation: root, id: pietro }
etymology: "Отглагольное существительное от WYPIĘTRZYĆ (SIĘ) «вздыбиться», буквально «надстроиться ярусом»: в основе PIĘTRO «этаж, ярус»."
memory: "Wy-PIĘTRZ-enie: земля вырастает ещё на один «этаж» (piętro) — поднятие."
idioms:
  - { pl: "wypiętrzenie skorupy ziemskiej", ru: "поднятие земной коры" }
