# review
id: mylic
format: 2
lemma: "mylić"
rank: 819
pos: verb
aspect: imperf
pron: { cyr: "мы́лиць" }
senses:
  - id: be-wrong
    ru: "mylić się — ошибаться"
    examples:
      - pl: "Nie mylę się."
        ru: "Я не ошибаюсь."
        source: { kind: tatoeba, id: 3656751 }
      - pl: "Możliwe, że się mylę."
        ru: "Возможно, я ошибаюсь."
        source: { kind: tatoeba, id: 3865329 }
      - pl: "Mylisz się."
        ru: "Ты ошибаешься."
        source: { kind: translated, id: 525586 }
  - id: confuse
    ru: "mylić coś Z czymś — путать что-л. с чем-л. (творительный)"
    note: "Без się глагол переходный."
    examples:
      - pl: "Nie myl „dare” z „dear”."
        ru: "Не путай «dare» с «dear»."
        source: { kind: translated, id: 756520 }
      - pl: "Nie myl opinii z faktami."
        ru: "Не путай мнения с фактами."
        source: { kind: translated, id: 3847068 }
      - pl: "Nie mylmy samotności z izolacją. To dwie różne rzeczy."
        ru: "Не будем путать одиночество с изоляцией. Это разные вещи."
        source: { kind: translated, id: 440629 }
  - id: human
    ru: "Mylić się to rzecz ludzka — человеку свойственно ошибаться"
    examples:
      - pl: "Mylić się to rzecz ludzka."
        ru: "Ошибаться — дело человеческое."
        source: { kind: translated, id: 1480697 }
      - pl: "Mogę się mylić."
        ru: "Я могу ошибаться."
        source: { kind: translated, id: 3865332 }
      - pl: "Wszyscy się mylicie, żaden z was nie ma racji!"
        ru: "Вы все ошибаетесь, никто из вас не прав!"
        source: { kind: tatoeba, id: 5095931 }
  - id: misleading
    ru: "mylący — обманчивый, сбивающий с толку"
    examples:
      - pl: "To jest mylące."
        ru: "Это сбивает с толку."
        source: { kind: translated, id: 8715262 }
      - pl: "To jest trochę mylące."
        ru: "Это немного сбивает с толку."
        source: { kind: translated, id: 3006950 }
      - pl: "Często jestem mylony z młodszym bratem."
        ru: "Меня часто путают с младшим братом."
        source: { kind: translated, id: 10319974 }
notes:
  - { kind: false-friend, text: "Не поддавайтесь на сходство с русским «мылить»: связи нет никакой. Зато есть настоящая омонимия внутри польского — форма myli принадлежит и глаголу mylić «ошибаться», и глаголу myć «мыть»: Gdybyś ty mył sobie ręce значит «если бы ты мыл руки», а Ona się myli — «она ошибается». Различает контекст и się." }
  - { kind: government, text: "mylić coś Z czymś «путать что-то с чем-то» — творительный после z: nie myl opinii z faktami. А «ошибаться» — всегда с się: mylę się." }
  - { kind: usage, text: "Существительные — pomyłka и omyłka «ошибка», а отглагольное mylenie почти не употребляется. Совершенный вид — pomylić się «ошибиться»." }
  - { kind: usage, text: "Причастие mylący значит «обманчивый, сбивающий с толку»: To jest mylące «Это сбивает с толку»." }
collocations:
  - { pl: "mylić się", ru: "ошибаться" }
  - { pl: "mylić coś z czymś", ru: "путать что-то с чем-то" }
  - { pl: "to mylące", ru: "это сбивает с толку" }
  - { pl: "pomyłka", ru: "ошибка" }
family:
  - { pl: "pomylić się", ru: "ошибиться", relation: aspect }
  - { pl: "pomyłka", ru: "ошибка", relation: derived }
  - { pl: "omyłka", ru: "ошибка, описка", relation: derived }
  - { pl: "mylny", ru: "ошибочный", relation: derived }
etymology: "От mylny «ошибочный», праславянское *mylъ. С русским «мылить» связи нет: там корень «мыл-» от «мыло»."
memory: "mylić — «ошибаться, путать», и на сходство с русским «мылить» поддаваться не надо: связи нет. Зато есть настоящая омонимия внутри польского: форма myli принадлежит и mylić «ошибаться», и myć «мыть». Различает контекст и się: Ona się myli «Она ошибается», но Ona myje ręce «Она моет руки». Управление: mylić coś Z czymś, с творительным."
idioms:
  - { pl: "mylić się", ru: "ошибаться" }
  - { pl: "mylić coś z czymś", ru: "путать что-то с чем-то" }
  - { pl: "Mylić się to rzecz ludzka", ru: "человеку свойственно ошибаться" }
formExamplesSkip:
