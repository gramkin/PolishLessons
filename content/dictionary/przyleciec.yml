etymology: "Из приставки PRZY- и праславянского *letěti, от которого русское «лететь». Приставка отвечает русской «при-» и значит то же: движение к говорящему, прибытие. Поэтому PRZYLECIEĆ и «прилететь» совпадают до морфемы. Из того же корня польский построил SAMOLOT, и это та же калька, что русский «самолёт»: SAM плюс LOT, «сам» плюс «лёт». Оба языка сохранили и древнее противопоставление однонаправленного глагола многократному: LECIEĆ против LATAĆ, как «лететь» против «летать», и это противопоставление в обоих языках живое, а не книжное. Чередование IA и IE в прошедшем времени — польская черта: старое долгое ě дало перед твёрдым согласным IA, а перед мягким IE, отсюда PRZYLECIAŁ рядом с PRZYLECIELI. Русский это чередование утратил, выровняв формы по одной гласной."
memory: "przyleciał, но przylecieli: в мужском личном множественном ia переходит в ie. Так же widział/widzieli, słyszał/słyszeli, musiał/musieli — учить сразу парой. Корень тот же, что в «лететь», и пара lecieć/latać точно отвечает «лететь»/«летать». Samolot — это «самолёт» морфема за морфемой. Разговорно przylecieć значит просто «примчаться». Сорок две формы, потому что непереходный: страдательного причастия нет."
