notes:
  - { kind: usage, text: "В прошедшем времени этого глагола работает чередование IA и IE, и оно обязательно. Во всех формах, кроме мужского личного множественного, стоит IA: PRZYLECIAŁ, PRZYLECIAŁA, PRZYLECIAŁO, PRZYLECIAŁY, PRZYLECIAŁEM. А в мужском личном множественном IA переходит в IE: PRZYLECIELI, PRZYLECIELIŚMY, PRZYLECIELIŚCIE, и в условном PRZYLECIELIBY. Так ведёт себя весь класс глаголов на -IEĆ: WIDZIAŁ, но WIDZIELI; SŁYSZAŁ, но SŁYSZELI; LECIAŁ, но LECIELI; MUSIAŁ, но MUSIELI. Запоминать стоит сразу пару форм, потому что по одной угадать нельзя, а ошибка слышна отчётливо." }
  - { kind: false-friend, text: "Корень тот же, что в русском «лететь», и значение совпадает: PRZYLECIEĆ это «прилететь». Больше того, польский сохранил ту же пару, что и русский: LECIEĆ значит «лететь», однонаправленно и один раз, а LATAĆ — «летать», туда и обратно или вообще. Это редкий случай полного совпадения системы, и пользоваться им можно смело: SAMOLOT LECI DO WARSZAWY как «самолёт летит в Варшаву», PTAKI LATAJĄ как «птицы летают». Одно расхождение всё же есть, и бытовое: PRZYLECIEĆ в разговорной речи значит просто «примчаться, прибежать», без всякого самолёта — PRZYLECIAŁA DO MNIE Z PŁACZEM это «прибежала ко мне в слезах»." }
  - { kind: government, text: "Непереходный, совершенного вида, и именно поэтому в таблице сорок две формы, а не пятьдесят три: страдательного причастия у него нет, потому что нет прямого объекта. Куда — DO с родительным для места или человека (PRZYLECIEĆ DO WARSZAWY, DO CIEBIE) или NA с винительным для события (NA KONFERENCJĘ, NA ŚLUB). Откуда — Z с родительным: Z LONDYNU. Чем — творительный без предлога: PRZYLECIEĆ SAMOLOTEM, PIERWSZYM REJSEM. Пара по виду: PRZYLATYWAĆ несовершенный, PRZYLECIEĆ совершенный. Отглагольное существительное PRZYLECENIE склоняется обычно, но в живой речи о прилёте чаще говорят PRZYLOT." }
  - { kind: pronunciation, text: "Читается «пшыле́цець», три слога, ударение на предпоследнем. Начальное PRZ звучит глухо, «пш». Буква Y это «ы», отдельный звук, а не «и». Сочетание CIE даёт мягкое «це», а конечное Ć — «ць». В форме PRZYLECIELI сочетание CIE тоже даёт мягкое «це»: «пшылеце́ли». В существительном PRZYLECENIE сочетание NIE даёт «не»: «пшылеце́не»." }
