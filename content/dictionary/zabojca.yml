# review
id: zabojca
format: 2
lemma: "zabójca"
rank: 794
pos: noun
pron: { cyr: "забу́йца" }
senses:
  - id: killer
    ru: "убийца"
    examples:
      - pl: "Zabójca został uznany winnym i otrzymał wyrok dożywocia."
        ru: "Убийцу признали виновным и приговорили к пожизненному."
        source: { kind: translated, id: 901425 }
      - pl: "On jest zabójcą."
        ru: "Он убийца."
        source: { kind: translated, id: 9313027 }
      - pl: "Nie jesteś zabójcą i ja również nie."
        ru: "Ты не убийца, и я тоже."
        source: { kind: translated, id: 3743067 }
  - id: be-killer
    ru: "być zabójcą — быть убийцей (творительный)"
    examples:
      - pl: "Nie jest zabójcą."
        ru: "Он не убийца."
        source: { kind: authored }
      - pl: "Okazał się zabójcą."
        ru: "Он оказался убийцей."
        source: { kind: authored }
      - pl: "Nazwali go zabójcą."
        ru: "Его назвали убийцей."
        source: { kind: authored }
  - id: declension
    ru: "мужской род, женское склонение: ten zabójca, tego zabójcy"
    note: "Как kolega, mężczyzna и разговорное glina."
    examples:
      - pl: "Tego zabójcy nigdy nie znaleziono."
        ru: "Этого убийцу так и не нашли."
        source: { kind: authored }
      - pl: "Szukali zabójcy przez rok."
        ru: "Убийцу искали год."
        source: { kind: authored }
      - pl: "Policja aresztowała zabójcę."
        ru: "Полиция арестовала убийцу."
        source: { kind: authored }
  - id: killers
    ru: "zabójcy — убийцы"
    examples:
      - pl: "Słyszałem, że Tom spędzał czas z dilerami narkotyków i zabójcami."
        ru: "Я слышал, что Том водился с наркоторговцами и убийцами."
        source: { kind: translated, id: 3116564 }
      - pl: "Zabójcy zostali skazani."
        ru: "Убийцы были осуждены."
        source: { kind: authored }
      - pl: "Nie ma tu zabójców."
        ru: "Убийц здесь нет."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Слово мужского рода по смыслу, но склоняется по женскому образцу: ten zabójca, tego zabójcy, tego zabójcę, z tym zabójcą. Так же ведут себя kolega, mężczyzna и разговорное glina." }
  - { kind: usage, text: "Разбирается прозрачно: zabić «убить» плюс суффикс -ca, как morderca «убийца», sprzedawca «продавец», wykonawca «исполнитель»." }
  - { kind: government, text: "być zabójcą «быть убийцей» — творительный падеж; szukać zabójcy «искать убийцу» — родительный." }
  - { kind: usage, text: "Синоним — morderca. Родня: zabić «убить», zabójstwo «убийство», zabójczy «убийственный»." }
collocations:
  - { pl: "być zabójcą", ru: "быть убийцей" }
  - { pl: "szukać zabójcy", ru: "искать убийцу" }
