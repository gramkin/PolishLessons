  - { pl: "morderca", ru: "убийца", relation: root }
etymology: "От zabić «убить» с суффиксом -ca, как morderca, sprzedawca, wykonawca."
memory: "zabójca — «убийца», и слово собрано прозрачно: zabić «убить» плюс -ca. Грамматическая особенность та же, что у разговорного glina: слово мужского рода по смыслу, но склоняется по женскому образцу — ten zabójca, tego zabójcy, z tym zabójcą. Так же ведут себя kolega и mężczyzna."
