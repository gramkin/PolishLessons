senses:
  - id: thin
    ru: "тонкий"
    examples:
      - pl: "Pokrój chleb na cienkie kromki."
        ru: "Нарежь хлеб тонкими ломтиками."
        source: { kind: authored }
      - pl: "Lód jest za cienki, nie wchodź."
        ru: "Лёд слишком тонкий, не выходи на него."
        source: { kind: authored }
      - pl: "To najcieńszy telefon na rynku."
