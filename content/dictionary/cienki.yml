        source: { kind: authored }
  - id: weak
    ru: "разг. слабый, жидкий, неважный (о качестве, умениях)"
    examples:
      - pl: "Kawa jest cienka jak woda."
        ru: "Кофе жидкий, как вода."
        source: { kind: authored }
      - pl: "Jest cienki z matematyki."
        ru: "Он слаб в математике."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Совпадение с русским «тонкий» в прямом смысле полное: CIENKI PAPIER, CIENKA NITKA. Но переносные значения разошлись. Русское «тонкий» о человеке — «чуткий, проницательный»: «тонкий ум». Польское CIENKI о человеке — разговорное «слабый, неважный»: CIENKI Z FIZYKI, «слаб в физике». CIENKI GŁOS — «тонкий, писклявый голос», а «тонкий намёк» — DELIKATNA ALUZJA." }
  - { kind: usage, text: "Полная парадигма с неправильной сравнительной степенью: CIENKI, CIEŃSZY, NAJCIEŃSZY. K выпадает, а N становится мягким Ń. Мужское-личное: CIENCY в положительной степени, CIEŃSI в сравнительной. Положительная степень берёт -ICH, -IM: CIENKICH, CIENKIM." }
  - { kind: government, text: "Слаб в чём-то — CIENKI Z + родительный: CIENKI Z ANGIELSKIEGO, «слаб в английском». Тонкий как что-то — CIENKI JAK PAPIER, JAK NITKA. Наречие CIENKO — «тонко»; CIENKO PRZĘŚĆ, «еле сводить концы с концами»." }
  - { kind: pronunciation, text: "Читается «це́нки», два слога, ударение на первом. CIE — мягкое «це», KI — мягкое «ки». В CIEŃSZY: «це́ньшы», Ń — мягкое «нь»." }
  - { kind: register, text: "Нейтральное слово в прямом значении. В переносном «слабый» — разговорное и чуть насмешливое. CIENKO PRZĄŚĆ, «тонко прясть», — идиома о бедности: «еле концы с концами сводить»." }
