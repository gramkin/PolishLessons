etymology: "Общеславянское *tьnъkъ, того же, что русское «тонкий». Польское CIE на месте русского «то» — результат смягчения: Т перед мягким гласным дало Ć. Степень CIEŃSZY сохранила старую основу без K, как и русское «тоньше»."
memory: "Cienki — тонкий: cienki lód, cienkie kromki. Разг. — слабый: cienki z matematyki, cienka kawa. Cieńszy, najcieńszy — без k! Читается «це́нки»."
idioms:
  - { pl: "cienko prząść", ru: "еле сводить концы с концами" }
