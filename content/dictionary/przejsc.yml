# review
id: przejsc
format: 2
lemma: "przejść"
rank: 347
pos: verb
aspect: perf
pron: { cyr: "пшэйсьць" }
senses:
  - id: cross
    ru: "перейти, пройти"
    note: "В прошедшем времени основа меняется: przeszedłem, przeszłam, przeszli."
    examples:
      - pl: "Przeszedł przez ulicę."
        ru: "Он перешёл улицу."
        source: { kind: tatoeba, id: 827754 }
      - pl: "Przeszliśmy około sześciu kilometrów."
        ru: "Мы прошли пешком около шести километров."
        source: { kind: tatoeba, id: 722344 }
      - pl: "Przeszła ulewa."
        ru: "Прошёл ливень."
        source: { kind: tatoeba, id: 2563916 }
  - id: go-through
    ru: "перейти (к другому состоянию); пережить, пройти через что-либо"
    examples:
      - pl: "Tom przeszedł na emeryturę w październiku."
        ru: "Том вышел на пенсию в октябре."
        source: { kind: tatoeba, id: 10602888 }
      - pl: "Opowiadał nam, że przeszedł liczne trudności."
        ru: "Он рассказал нам, что прошёл через многочисленные трудности."
        source: { kind: tatoeba, id: 899490 }
      - pl: "Jakoś niezauważalnie przeszliśmy na \"ty\"."
        ru: "Как-то незаметно мы перешли на \"ты\"."
        source: { kind: tatoeba, id: 4719307 }
notes:
  - { kind: usage, text: "Прошедшее время надо выучить целиком, как у wejść и odejść: przeszedłem «я прошёл», przeszłam «я прошла», przeszli «они прошли»." }
  - { kind: usage, text: "przejść na emeryturę — «выйти на пенсию»; przejść na ty — «перейти на ты»; przejść na dietę — «сесть на диету»." }
  - { kind: usage, text: "przejść przez coś значит и «перейти через что-то», и «пережить»: Wiem, przez co przeszedłeś." }
  - { kind: usage, text: "Существительное przejście — «переход, проход»: Tu nie ma przejścia «Здесь нет прохода»." }
collocations:
  - { pl: "przejść przez ulicę", ru: "перейти улицу" }
  - { pl: "przejść na emeryturę", ru: "выйти на пенсию" }
  - { pl: "przejść się", ru: "прогуляться" }
  - { pl: "nie ma przejścia", ru: "прохода нет" }
etymology: "Из prze- + iść «идти»; ср. русское «перейти». В прошедшем времени всплывает старый корень: przeszedł — как русское «шёл»."
memory: "przejść — «перейти, пройти», и прошедшее меняется так же, как у wejść и odejść: przeszedłem, przeszłam, przeszli. А przejść na emeryturę значит «выйти на пенсию»."
idioms:
  - { pl: "przejść do porządku dziennego", ru: "махнуть рукой" }
  - { pl: "przejść na emeryturę", ru: "выйти на пенсию" }
  - { pl: "nie ma przejścia", ru: "прохода нет" }
