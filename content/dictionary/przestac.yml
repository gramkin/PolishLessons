# review
id: przestac
format: 2
lemma: "przestać"
rank: 170
pos: verb
aspect: perf
pron: { cyr: "пшэ́стаць" }
senses:
  - id: stop-doing
    ru: "перестать (делать что-либо)"
    note: "После przestać идёт инфинитив несовершенного вида: przestań palić «брось курить»."
    examples:
      - pl: "Przestań!"
        ru: "Прекрати!"
        source: { kind: tatoeba, id: 1014383 }
      - pl: "Przestał czytać gazetę."
        ru: "Он перестал читать газету."
        source: { kind: tatoeba, id: 1850875 }
      - pl: "Przestań udawać głupka!"
        ru: "Перестань валять дурака!"
        source: { kind: tatoeba, id: 3463016 }
  - id: cease
    ru: "прекратиться, перестать (о явлении)"
    examples:
      - pl: "Już przestało padać."
        ru: "Дождь уже перестал."
        source: { kind: tatoeba, id: 3702200 }
      - pl: "Przestali śmiać się."
        ru: "Они перестали смеяться."
        source: { kind: tatoeba, id: 10623376 }
      - pl: "Przestały śmiać się."
        ru: "Они перестали смеяться."
        source: { kind: tatoeba, id: 10623377 }
notes:
  - { kind: usage, text: "Несовершенный вид — przestawać: Przestaję rozumieć «Перестаю понимать» — Przestałem rozumieć «Я перестал понимать»." }
  - { kind: usage, text: "Резкое Przestań! значит «Прекрати!», а Przestańcie! — «Прекратите!»." }
  - { kind: usage, text: "Будущее образуется от основы -stanę: przestanę, przestaniesz, przestanie — как русское «перестану»." }
collocations:
  - { pl: "przestań!", ru: "прекрати!" }
  - { pl: "przestać palić", ru: "бросить курить" }
  - { pl: "przestało padać", ru: "дождь перестал" }
  - { pl: "nie przestawać", ru: "не переставать" }
etymology: "Приставка prze- + stać; то же строение, что у русского «перестать» (пере + стать). Отсюда и будущее przestanę — «перестану»."
memory: "przestać + инфинитив несовершенного вида: przestań palić «брось курить». Несовершенный вид самого глагола — przestawać, а резкое Przestań! значит «Прекрати!»."
idioms:
  - { pl: "przestań!", ru: "прекрати!" }
  - { pl: "przestać się liczyć", ru: "перестать считаться" }
  - { pl: "nie przestawać", ru: "не переставать" }
