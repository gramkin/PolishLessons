notes:
  - { kind: register, text: "РЕГИСТР РАЗГОВОРНЫЙ, КАК И В РУССКОМ, НО ЧУТЬ МЯГЧЕ. Нейтральное слово для женщины — kobieta; baba в городской речи звучит грубовато или насмешливо, в деревенской — вполне буднично. В официальном разговоре его не употребляют. Stara baba — явная грубость, а moja baba «моя жена» — фамильярность мужского разговора." }
  - { kind: false-friend, text: "Значение почти совпадает с русским, и это редкий случай, когда можно довериться слуху. Расходится одно: польское baba чаще русского значит выпечку. Baba wielkanocna — пасхальный кулич, baba drożdżowa — дрожжевой кекс, baba ze śmietaną — ромовая баба. На праздничном столе слово звучит без всякой насмешки." }
  - { kind: pronunciation, text: "ДАТЕЛЬНЫЙ И ПРЕДЛОЖНЫЙ: B СМЯГЧАЕТСЯ В BI. Baba даёт babie — «ба́бе». Тот же ряд уже знаком: p переходит в pi (małpa — małpie), g в dz (waga — wadze), k в c (fabryka — fabryce), t в ci (płyta — płycie). Звательный падеж babo употребляется в обращении и в фольклоре." }
  - { kind: usage, text: "Производные разошлись по смыслам и регистрам: babcia «бабушка» — тёплое и нейтральное, babka — и «бабушка», и «кекс», и разговорно «девушка», baba — разговорное «женщина». Прилагательное babi живёт в обороте babie lato «бабье лето», совпадающем с русским слово в слово." }
collocations:
  - { pl: "baba wielkanocna", ru: "пасхальный кулич" }
  - { pl: "stara baba", ru: "старуха (груб.)" }
  - { pl: "babie lato", ru: "бабье лето" }
family:
  - { pl: "babcia", ru: "бабушка", relation: derived, id: babcia }
  - { pl: "babka", ru: "бабушка; кекс", relation: derived }
  - { pl: "kobieta", ru: "женщина", relation: root, id: kobieta }
etymology: "Праславянское *baba, слово детской речи с удвоенным слогом, как мама и тата. Исходно означало старуху и бабушку, потом расширилось до женщины вообще, а по сходству формы — и до высокой круглой выпечки. Русское «баба» — то же самое слово с той же историей. Отсюда babcia, babka, babi и babie lato."
memory: "baba — «баба», разговорное слово для женщины; нейтральное — kobieta. Второе значение русскому почти незнакомо: baba wielkanocna это пасхальный кулич. А дательный с предложным смягчают b: babie. Пословица совпадает дословно: baba z wozu, koniom lżej."
idioms:
  - { pl: "Baba z wozu, koniom lżej.", ru: "Баба с возу — кобыле легче." }
  - { pl: "babie lato", ru: "бабье лето" }
