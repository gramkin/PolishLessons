# review
id: osobiscie
format: 2
lemma: "osobiście"
rank: 1317
pos: adv
pron: { cyr: "особи́сьце" }
senses:
  - id: in-person
    ru: "лично, сам, без посредников"
    examples:
      - pl: "Przyszła osobiście."
        ru: "Она пришла лично."
        source: { kind: translated, id: 10558564 }
      - pl: "Poszedł tam osobiście."
        ru: "Он пошёл туда сам."
        source: { kind: translated, id: 572002 }
      - pl: "Lepiej porozmawiaj z nim osobiście."
        ru: "Будет лучше, если ты поговоришь с ним лично."
        source: { kind: tatoeba, id: 997696 }
  - id: personally
    ru: "вводное «лично я»"
    examples:
      - pl: "Osobiście nigdy nie widziałem UFO."
        ru: "Лично я никогда не видел НЛО."
        source: { kind: tatoeba, id: 366956 }
      - pl: "Znasz Toma osobiście?"
        ru: "Ты знаешь Тома лично?"
        source: { kind: translated, id: 3781360 }
      - pl: "Byłem tam osobiście."
        ru: "Я был там лично."
        source: { kind: translated, id: 3238110 }
notes:
  - { kind: usage, text: "Два употребления: «сам, во плоти» (Przyszła osobiście «Она пришла сама») и вводное «лично я» в начале фразы (Osobiście uważam, że…)." }
  - { kind: usage, text: "Знать кого-то лично — znać kogoś osobiście, ровно как в русском." }
  - { kind: government, text: "Это наречие и потому не изменяется. Прилагательное — osobisty «личный»: sprawa osobista «личное дело»." }
  - { kind: pronunciation, text: "Конечное -ście звучит как «-сьце», ударение на предпоследний слог: особи́сьце." }
collocations:
  - { pl: "znać osobiście", ru: "знать лично" }
  - { pl: "przyjść osobiście", ru: "прийти лично" }
  - { pl: "osobiście uważam", ru: "лично я считаю" }
etymology: "От osoba «лицо, особа», из праславянского *osoba. Русские «особа» и «лично» тоже построены от слова, означающего человека."
memory: "osobiście — «лично». Два употребления: «сам» (Przyszła osobiście «Она пришла сама») и вводное «лично я» (Osobiście uważam, że… «Лично я считаю, что…»). От osoba «особа, лицо»."
idioms:
  - { pl: "znać kogoś osobiście", ru: "знать кого-то лично" }
  - { pl: "osobiście uważam", ru: "лично я считаю" }
  - { pl: "przyjść osobiście", ru: "прийти лично" }
