# review
id: atakowac
format: 2
lemma: "atakować"
rank: 1982
pos: verb
pron: { cyr: "атако́ваць" }
senses:
  - id: attack
    ru: "атаковать, нападать"
    examples:
      - pl: "Wojska atakowały o świcie."
        ru: "Войска атаковали на рассвете."
        source: { kind: authored }
      - pl: "Pies zaatakował listonosza — atakuje każdego obcego."
        ru: "Собака напала на почтальона — она нападает на каждого чужого."
        source: { kind: authored }
      - pl: "Atakowane miasto broniło się tydzień."
        ru: "Атакуемый город оборонялся неделю."
        source: { kind: authored }
  - id: criticise
    ru: "нападать, критиковать (в печати, в споре)"
    examples:
      - pl: "Gazety atakują rząd od miesiąca."
        ru: "Газеты нападают на правительство месяц."
        source: { kind: authored }
      - pl: "Atakowany ze wszystkich stron, podał się do dymisji."
        ru: "Атакуемый со всех сторон, он подал в отставку."
        source: { kind: authored }
  - id: attacking
    ru: "atakowanie — нападение, атака (как действие)"
    examples:
      - pl: "Atakowanie słabszych nikogo nie zdobi."
        ru: "Нападать на слабых никого не красит."
        source: { kind: authored }
      - pl: "Po godzinie atakowania bramki padł gol."
        ru: "После часа атак на ворота забили гол."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Слово заимствованное, и в оба языка оно пришло одним путём — из французского attaquer через немецкий. Поэтому atakować и «атаковать» совпадают и по форме, и по смыслу, и разбирать тут нечего: славянского корня в нём нет. Это тот редкий случай, когда помогает не родство, а общее заимствование." }
  - { kind: pronunciation, text: "Настоящее время по правилу -ować: atakuję, atakujesz, atakuje — как pracuję и marnuję. Ударение, как всегда, на предпоследнем слоге: atako-WA-ć даёт «атако́ваць», а в atakuje ударение уходит на -ku-." }
  - { kind: government, text: "Атакуют КОГО или ЧТО — винительный, без предлога: atakować wroga, miasto, rywala. Русское «нападать НА кого-то» требует предлога, а польское atakować обходится без него — это и есть главное расхождение. Сравните: gazety atakują rząd «газеты нападают на правительство»." }
  - { kind: usage, text: "Совершенная пара — zaatakować. Расширенное употребление выходит за военное: grypa atakuje «грипп свирепствует», korozja atakuje metal «коррозия разъедает металл». По-русски в этих случаях чаще скажут не «атакует», а «одолевает» или «разъедает»." }
collocations:
  - { pl: "atakować wroga", ru: "атаковать врага" }
  - { pl: "atakować rząd", ru: "нападать на правительство" }
  - { pl: "grypa atakuje", ru: "грипп свирепствует" }
family:
  - { pl: "atak", ru: "атака; приступ", relation: root, id: atak }
  - { pl: "zaatakować", ru: "атаковать, напасть", relation: aspect, id: zaatakowac }
  - { pl: "napadać", ru: "нападать", relation: derived }
etymology: "Заимствование из французского attaquer, пришедшее в польский через немецкий attackieren; русское «атаковать» проделало тот же путь. Общего славянского корня здесь нет, зато есть общий источник, поэтому слова совпадают почти буква в букву. Отсюда же atak «атака» и в переносном смысле «приступ»: atak serca «сердечный приступ»."
memory: "atakować — «атаковать», слово заимствованное и совпадает с русским. Запомните одно: по-польски атакуют БЕЗ предлога — atakować rząd, тогда как русский говорит «нападать НА правительство». И настоящее время по правилу -ować: atakuję."
idioms:
  - { pl: "atak serca", ru: "сердечный приступ" }
  - { pl: "atakować z zaskoczenia", ru: "атаковать внезапно" }
