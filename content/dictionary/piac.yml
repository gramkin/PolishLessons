# review
id: piac
format: 2
lemma: "piąć"
rank: 5847
pos: verb
aspect: imperf
pron: { cyr: "пёнць" }
senses:
  - id: climb
    ru: "карабкаться, взбираться (медленно, с трудом)"
    note: "Только с się: piąć się pod górę, po skałach."
    examples:
      - pl: "Małpy pną się po drzewach."
        ru: "Обезьяны карабкаются по деревьям."
        source: { kind: translated, id: 10595934 }
      - pl: "Powoli pięliśmy się pod stromą górę."
        ru: "Мы медленно взбирались на крутую гору."
        source: { kind: authored }
      - pl: "Ścieżka pnie się wąsko między skałami."
        ru: "Тропа узко поднимается между скалами."
        source: { kind: authored }
  - id: twine
    ru: "виться вверх (о растениях)"
    examples:
      - pl: "To pnącze pnie się po drzewach."
        ru: "Это вьющееся растение взбирается по деревьям."
        source: { kind: translated, id: 643759 }
      - pl: "Bluszcz piął się po ścianie domu."
        ru: "Плющ вился по стене дома."
        source: { kind: authored }
  - id: rise
    ru: "подниматься, продвигаться (по службе, в рейтинге)"
    examples:
      - pl: "Szybko piął się po szczeblach kariery."
        ru: "Он быстро поднимался по карьерной лестнице."
        source: { kind: authored }
      - pl: "Piosenka pnie się w górę listy przebojów."
        ru: "Песня поднимается в хит-параде."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Употребляется только с SIĘ: PIĄĆ SIĘ «карабкаться, виться вверх». Без SIĘ глагол в современном языке не встречается, поэтому страдательных причастий у него нет." }
  - { kind: usage, text: "Основы меняются, как в русском «распять — распну»: инфинитив PIĄĆ, настоящее PNĘ, PNIESZ, PNIE, PNĄ, прошедшее PIĄŁ, но PIĘŁA, PIĘLI. Повелительное — PNIJ SIĘ." }
  - { kind: false-friend, text: "PNIE SIĘ «карабкается» — форма глагола; PNIE без SIĘ обычно множественное от PIEŃ «пень, ствол». PIĘCIU и PIĘCIE совпадают с формами числительного PIĘĆ и слова PIĘTA «пятка»: PIĘCIE SIĘ W GÓRĘ, но NA PIĘCIE «на пятке»." }
  - { kind: register, text: "Слово скорее книжное и описательное: о тропах, дорогах, растениях, карьере. О человеке в горах в разговоре чаще скажут WCHODZIĆ или WSPINAĆ SIĘ." }
collocations:
  - { pl: "piąć się pod górę", ru: "карабкаться в гору" }
  - { pl: "piąć się w górę", ru: "подниматься вверх" }
  - { pl: "piąć się po ścianie", ru: "виться по стене" }
  - { pl: "róża pnąca", ru: "плетистая роза" }
family:
  - { pl: "wspiąć", ru: "взобраться", relation: derived, id: wspiac }
  - { pl: "pnącze", ru: "вьющееся растение, лиана", relation: derived }
  - { pl: "zapiąć", ru: "застегнуть", relation: root, id: zapiac }
  - { pl: "spiąć", ru: "скрепить, сколоть", relation: root, id: spiac }
etymology: "Праславянское *pęti, *pьnǫ «натягивать»; тот же глагол в русском «распять — распну» и в польских ZAPIĄĆ, SPIĄĆ, NAPIĄĆ."
memory: "Piąć się — pnę się: как русское «распять — распну». Pnącze — то, что «пнётся» вверх по стене."
idioms:
  - { pl: "piąć się po szczeblach kariery", ru: "подниматься по карьерной лестнице" }
