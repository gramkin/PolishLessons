notes:
  - { kind: usage, text: "Формы множественного числа (Paryże, Paryżów, Paryżom, Paryżami, Paryżach) оставлены без примеров: город один, и во множественном числе его не склоняют. Живые формы — w Paryżu, do Paryża, nad Paryżem, Paryżowi." }
  - { kind: usage, text: "Направление — do Paryża, с родительным; местонахождение — w Paryżu, с предложным: Jadę do Paryża, ale mieszkam w Paryżu." }
  - { kind: usage, text: "Мужской неодушевлённый, склоняется как обычное существительное: Paryż, Paryża, Paryżem, w Paryżu. Пишется с прописной." }
  - { kind: usage, text: "Прилагательное — paryski «парижский»: paryska moda. Житель — paryżanin, жительница — paryżanka." }
  - { kind: pronunciation, text: "Ударение на первый слог: PA-ryż, а не как в русском «Пари́ж». Конечное ż оглушается и звучит как ш." }
collocations:
  - { pl: "w Paryżu", ru: "в Париже" }
  - { pl: "do Paryża", ru: "в Париж" }
  - { pl: "paryska moda", ru: "парижская мода" }
etymology: "Через латинское Parisii — имя галльского племени, жившего на месте города. Русский «Париж» пришёл через польское посредство: отсюда и конечное «ж», которого во французском Paris нет вовсе."
memory: "Paryż — «Париж», и русская форма с «ж» на конце пришла как раз через польский: по-французски город называется Paris, безо всякого ж. Ударение на первый слог. Направление — do Paryża, место — w Paryżu."
idioms:
