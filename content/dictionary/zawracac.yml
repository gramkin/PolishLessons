notes:
  - { kind: false-friend, text: "Простой глагол этого гнезда, WRACAĆ, значит «возвращаться», и начинающему он доставляет хлопоты из-за созвучия с русским «врать». WRACAM DO DOMU это «я возвращаюсь домой», а никак не «я вру»; врать по-польски — KŁAMAĆ. Созвучие случайное, корни разные. Сам корень родствен русскому «воротить» и «возвращать»: WRACAĆ и «воротиться» это одно слово, а POWRÓT отвечает «повороту» по составу и «возвращению» по смыслу." }
  - { kind: usage, text: "Шестьдесят три формы — подпись переходного глагола несовершенного вида, с действительным причастием на -ĄCY. Видовой партнёр — ZAWRÓCIĆ, и чередование A и Ó в корне здесь закономерное: ZAWRACAĆ при ZAWRÓCIĆ, как WRACAĆ при WRÓCIĆ. В значении разворота глагол чаще всего непереходный и идёт без дополнения: KIEROWCA ZAWRACA. Переходным он становится во втором значении и в речи о транспорте, который разворачивают принудительно: ZAWRACANO TRANSPORTY Z GRANICY." }
  - { kind: government, text: "В значении разворота дополнения обычно нет, а место указывается предлогами: ZAWRACAĆ PRZED MOSTEM, NA SKRZYŻOWANIU, DO DOMU. Во втором значении работает жёсткая схема ZAWRACAĆ KOMUŚ GŁOWĘ — дательный на лицо и винительный на голову, дословно «поворачивать кому-то голову». Русский говорит «морочить голову» с тем же дательным, так что падежи совпадают, хотя образ разный: поляк крутит голову, русский её морочит. Отглагольное ZAWRACANIE GŁOWY значит «морока, пустая болтовня»." }
  - { kind: pronunciation, text: "Читается «завра́цачь», три слога, ударение на предпоследнем. Буква C перед A читается как «ц», а не как «ч»: конец инфинитива звучит «цачь». В формах настоящего времени то же самое: ZAWRACAM это «завра́цам». Зато перед I буква C смягчается, и в родственном ZAWRÓCIĆ слышно «завру́чичь». Буква R твёрдая и раскатистая. Приставка ZA- всегда безударна." }
  - { kind: register, text: "Первое значение нейтральное и дорожное: ZAKAZ ZAWRACANIA «разворот запрещён» — надпись с каждого второго знака. Второе значение разговорное и слегка раздражённое: NIE ZAWRACAJ MI GŁOWY звучит резче, чем «не отвлекай», и близко к русскому «не морочь мне голову». Существительное ZAWRACANIE GŁOWY употребляется и как упрёк, и как оценка чужой затеи: TO JAKIEŚ ZAWRACANIE GŁOWY «это какая-то морока». В вежливой речи лучше сказать NIE PRZESZKADZAJ." }
