etymology: "Приставка ZA- плюс WRACAĆ, от праславянского *vortiti «поворачивать». Русский сохранил этот корень богато: «воротить», «возвращать», «ворот», «воротник», «поворот», «обратно». Польское WRACAĆ отвечает русскому «воротиться», только у нас это слово отошло в просторечие, а в польском осталось единственным обычным способом сказать «возвращаться». Исходное значение было именно «повернуть», и оттуда развилось «вернуться»: повернуть назад и значит пойти обратно. Приставка ZA- вернула глаголу первоначальный смысл поворота, и потому ZAWRACAĆ это «разворачиваться», а не «возвращаться»."
memory: "Корень тот же, что в «воротить» и «повороте»: wracać «возвращаться», zawracać «разворачиваться». Беречься созвучия: wracam значит «я возвращаюсь», а не «я вру»; врать это kłamać. Второе значение запоминается целиком: zawracać komuś głowę «морочить кому-то голову», дательный и винительный, как по-русски, хотя образ другой — поляк голову крутит. И знать дорожный знак zakaz zawracania «разворот запрещён»."
idioms:
  - { pl: "zawracać komuś głowę", ru: "морочить кому-то голову" }
