lemma: "zwężka"
rank: 2097
pos: noun
pron: { cyr: "звэ́ншка" }
senses:
  - id: reducer
    ru: "переходник, сужающая насадка"
    examples:
      - pl: "Zwężka łączy dwie rury."
        ru: "Переходник соединяет две трубы."
        source: { kind: authored }
      - pl: "Potrzebna jest zwężka do węża."
        ru: "Нужен переходник для шланга."
        source: { kind: authored }
      - pl: "Ta zwężka jest za mała."
        ru: "Этот переходник слишком мал."
        source: { kind: authored }
  - id: venturi
    ru: "сужение, диафрагма (в трубопроводе)"
    examples:
      - pl: "Zwężka mierzy przepływ wody."
        ru: "Сужение измеряет поток воды."
        source: { kind: authored }
      - pl: "Ciśnienie spada na zwężce."
        ru: "Давление падает на сужении."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Технический термин: деталь, сужающая сечение трубы, — переходник или измерительная диафрагма." }
  - { kind: false-friend, text: "Не «связка» и не «вязка». Корень wąski «узкий», глагол zwęzić «сузить»." }
  - { kind: government, text: "Женский род: ta zwężka, tej zwężki." }
  - { kind: usage, text: "В корпусе слово не встречается, поэтому все примеры составлены вручную." }
collocations:
  - { pl: "zwężka rury", ru: "переходник трубы" }
etymology: "От zwęzić «сузить», от wąski «узкий», праславянское *ǫzъkъ; ср. русское «узкий», «сузить»."
memory: "zwężka — «переходник, сужение» в трубе. Корень wąski «узкий» = русское «узкий». Со «связкой» ничего общего."
