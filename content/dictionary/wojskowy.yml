# review
id: wojskowy
format: 2
lemma: "wojskowy"
rank: 1613
pos: adj
pron: { cyr: "войско́вы" }
senses:
  - id: military
    ru: "военный (относящийся к армии)"
    examples:
      - pl: "W Myanmarze rządzi dyktatura wojskowa."
        ru: "В Мьянме правит военная диктатура."
        source: { kind: translated, id: 551571 }
      - pl: "Wielka Brytania ma dwie bazy wojskowe na Cyprze."
        ru: "У Великобритании две военные базы на Кипре."
        source: { kind: translated, id: 3127701 }
      - pl: "Niedaleko domu jest szpital wojskowy."
        ru: "Недалеко от дома есть военный госпиталь."
        source: { kind: translated, id: 6308498 }
  - id: service
    ru: "военный (о службе, академии)"
    examples:
      - pl: "Służba wojskowa to także obowiązek patriotyczny."
        ru: "Военная служба — это также патриотический долг."
        source: { kind: translated, id: 11350904 }
      - pl: "Studiowałam na akademii wojskowej."
        ru: "Я училась в военной академии."
        source: { kind: translated, id: 12240051 }
      - pl: "Podczas służby wojskowej podlegał surowej dyscyplinie."
        ru: "Во время военной службы он подчинялся суровой дисциплине."
        source: { kind: translated, id: 511579 }
notes:
  - { kind: usage, text: "Прилагательное от wojsko «войско, армия»: służba wojskowa «военная служба», baza wojskowa «военная база»." }
  - { kind: usage, text: "В значении существительного wojskowy значит «военный, военнослужащий»: Tom jest dzieckiem wojskowego «Том — ребёнок военного»." }
  - { kind: usage, text: "Лично-мужская форма множественного — wojskowi «военные»; в корпусе она не встречается." }
  - { kind: false-friend, text: "Различайте wojskowy «военный (армейский)» и wojenny «военный (относящийся к войне)»: baza wojskowa «военная база», но zbrodnia wojenna «военное преступление»." }
collocations:
  - { pl: "służba wojskowa", ru: "военная служба" }
  - { pl: "baza wojskowa", ru: "военная база" }
  - { pl: "akademia wojskowa", ru: "военная академия" }
etymology: "От wojsko «войско, армия», а то — от wojna «война». Русское «военный» идёт прямо от «войны», поэтому в польском различаются два прилагательных там, где в русском одно."
memory: "wojskowy = «военный» в смысле «армейский»: służba wojskowa, baza wojskowa. Отличайте от wojenny «военный» в смысле «относящийся к войне»: zbrodnia wojenna «военное преступление». В русском оба — «военный»."
idioms:
