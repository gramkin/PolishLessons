# review
id: wynikac
format: 2
lemma: "wynikać"
rank: 2001
pos: verb
aspect: imperf
aspectPair: wyniknac
pron: { cyr: "выни́каць" }
senses:
  - id: follow
    ru: "следовать, вытекать (о выводе, следствии)"
    examples:
      - pl: "Ich spór wynika z nieporozumienia."
        ru: "Их спор проистекает из недоразумения."
        source: { kind: translated, id: 1604015 }
      - pl: "Z niewiedzy wynika wiele przesądów."
        ru: "Из незнания рождается много предрассудков."
        source: { kind: translated, id: 2009253 }
      - pl: "Z tego wynika, że się myliśmy."
        ru: "Из этого следует, что мы ошибались."
        source: { kind: authored }
  - id: arise
    ru: "возникать, проистекать (о причине)"
    examples:
      - pl: "Problemy wynikają z braku pieniędzy."
        ru: "Проблемы возникают из-за нехватки денег."
        source: { kind: authored }
      - pl: "Konflikty wynikają z nieporozumień."
        ru: "Конфликты возникают из недоразумений."
        source: { kind: authored }
notes:
  - { kind: government, text: "Будущее время дано только в третьем лице: подлежащее у wynikać — вывод, следствие, проблема, но не человек (z tego wynika, że…). Форм wynikam или będę wynikać язык не знает, как нет и мужско-личной będą wynikali: подлежащим не может быть группа людей." }
  - { kind: government, text: "Всегда с предлогом z и родительным падежом: wynikać z czegoś «вытекать из чего-л.»." }
  - { kind: usage, text: "Самый частый оборот — безличный: z tego wynika, że… «из этого следует, что…»." }
  - { kind: false-friend, text: "Не «выныривать». Корень -nikać тот же, что в przenikać «проникать» и wnikać «вникать»." }
  - { kind: usage, text: "Совершенный вид — wyniknąć: z tego wyniknął spór «из этого вышел спор»." }
  - { kind: usage, text: "Отглагольное существительное wynikanie — термин логики: wynikanie logiczne «логическое следование». В обычной речи почти не встречается." }
collocations:
  - { pl: "wynikać z czegoś", ru: "вытекать из чего-л." }
  - { pl: "z tego wynika", ru: "из этого следует" }
etymology: "wy- + -nikać, тот же корень, что в przenikać «проникать» и wnikać «вникать»; ср. русское «проникать», «вникать»."
memory: "wynikać z czegoś — «вытекать, следовать из чего-л.», всегда с предлогом z. Запомните оборот z tego wynika, że… «из этого следует, что…». Совершенный вид — wyniknąć."
idioms:
  - { pl: "z tego wynika", ru: "из этого следует" }
  - { pl: "co z tego wynika?", ru: "что из этого следует?" }
