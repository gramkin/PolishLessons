# review
id: oznaczyc
format: 2
lemma: "oznaczyć"
rank: 2054
pos: verb
aspect: perf
aspectPair: oznaczac
pron: { cyr: "озна́чиць" }
senses:
  - id: mark
    ru: "пометить, обозначить, разметить"
    examples:
      - pl: "Sprawdź i oznacz, proszę."
        ru: "Проверь и отметь, пожалуйста."
        source: { kind: translated, id: 3481696 }
      - pl: "Kościoły na mapie oznaczone są krzyżem."
        ru: "Церкви на карте обозначены крестом."
        source: { kind: translated, id: 3401023 }
      - pl: "Oznaczyli parcelę pod dom układając kamienie."
        ru: "Они разметили участок под дом, разложив камни."
        source: { kind: translated, id: 349360 }
  - id: label
    ru: "пометить как, отметить (ярлыком)"
    examples:
      - pl: "Odpowiedź została oznaczona jako błędna."
        ru: "Ответ был помечен как ошибочный."
        source: { kind: translated, id: 3884236 }
      - pl: "Szlak nie był wyraźnie oznaczony."
        ru: "Тропа не была чётко размечена."
        source: { kind: translated, id: 12044129 }
notes:
  - { kind: usage, text: "Внимание на пару видов: oznaczyć значит только «пометить, обозначить», а несовершенный oznaczać имеет ещё и второе значение — «означать»." }
  - { kind: government, text: "Винительный падеж: oznaczyć trasę «разметить маршрут»." }
  - { kind: false-friend, text: "Корень znak «знак» — ср. русское «обозначить», «означить»." }
  - { kind: usage, text: "Причастие oznaczony «помеченный, обозначенный» встречается чаще личных форм." }
  - { kind: usage, text: "В современной речи глагол берёт и человека: oznaczyć kogoś na zdjęciu «отметить кого-то на фото», zostali oznaczeni w systemie." }
collocations:
  - { pl: "oznaczyć trasę", ru: "разметить маршрут" }
  - { pl: "oznaczyć na mapie", ru: "обозначить на карте" }
etymology: "o- + znaczyć «значить», от znak «знак»; ср. русское «обозначить»."
memory: "oznaczyć — «пометить, обозначить», от znak «знак». Не путайте с несовершенным oznaczać: у того есть и значение «означать»."
idioms:
  - { pl: "oznaczyć na mapie", ru: "обозначить на карте" }
