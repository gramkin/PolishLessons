  - { pl: "zaniedbywać", ru: "запускать, пренебрегать", relation: root }
  - { pl: "zaniedbanie", ru: "запущенность, упущение", relation: derived }
  - { pl: "niedbały", ru: "небрежный", relation: root }
etymology: "Причастие от глагола ZANIEDBAĆ, который состоит из ZA-, NIE «не» и DBAĆ «заботиться». Буквально «тот, о ком перестали заботиться»."
memory: "DBAĆ «заботиться» → NIE DBAĆ «не заботиться» → ZANIEDBANY «тот, о ком не заботились», то есть запущенный. Запущенный сад, неухоженный человек, брошенный ребёнок."
idioms:
  - { pl: "wyglądać na zaniedbanego", ru: "выглядеть неухоженным, опустившимся" }
