notes:
  - { kind: usage, text: "По происхождению это страдательное причастие от ZANIEDBAĆ «запустить, пренебречь», которое стало обычным прилагательным. Глагол переходный и требует винительного: ZANIEDBAĆ DOM, ZANIEDBAĆ OBOWIĄZKI «пренебречь обязанностями», ZANIEDBAĆ DZIECKO. Отсюда и три значения прилагательного: о месте «запущенный», о человеке «неухоженный», о ребёнке или больном «оставленный без заботы». Сравнительной степени в таблице нет; когда она нужна, говорят BARDZIEJ ZANIEDBANY." }
  - { kind: false-friend, text: "Корень DBAĆ «заботиться» русскому незнаком, и слово легко принять за родственника «небрежного». Небрежный, то есть делающий что-то кое-как, по-польски NIEDBAŁY. ZANIEDBANY же описывает результат: то, о чём перестали заботиться. Небрежный почерк это NIEDBAŁE PISMO, а запущенный сад ZANIEDBANY OGRÓD. Близкие разговорные синонимы: ZAPUSZCZONY «запущенный» и о месте ZAPYZIAŁY «захолустный, обшарпанный»." }
  - { kind: pronunciation, text: "Читается «занедба́ны»: NIE звучит как русское «не», D перед B остаётся звонким, ударение на предпоследнем слоге. Y на конце это «ы»." }
collocations:
  - { pl: "zaniedbany ogród", ru: "запущенный сад" }
  - { pl: "zaniedbane dziecko", ru: "ребёнок, оставленный без заботы" }
