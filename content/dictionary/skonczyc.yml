# review
id: skonczyc
format: 2
lemma: "skończyć"
rank: 184
pos: verb
aspect: perf
pron: { cyr: "ско́ньчыць" }
senses:
  - id: finish
    ru: "закончить, кончить (что-либо делать)"
    examples:
      - pl: "Prawie skończyłem."
        ru: "Я почти закончил."
        source: { kind: tatoeba, id: 361335 }
      - pl: "Prawie skończyliśmy."
        ru: "Мы почти закончили."
        source: { kind: tatoeba, id: 3657267 }
      - pl: "Na czym skończyliśmy?"
        ru: "На чем мы остановились?"
        source: { kind: tatoeba, id: 623688 }
  - id: run-out
    ru: "skończyć się — закончиться, кончиться"
    examples:
      - pl: "Sól się skończyła."
        ru: "Соль закончилась."
        source: { kind: tatoeba, id: 6684233 }
      - pl: "Lato się skończyło."
        ru: "Лето закончилось."
        source: { kind: tatoeba, id: 393348 }
      - pl: "Skończyła się benzyna."
        ru: "Бензин кончился."
        source: { kind: tatoeba, id: 6154727 }
notes:
  - { kind: usage, text: "Как в русском: skończyć coś «закончить что-то» (винительный) и skończyć się «закончиться». Несовершенный вид — kończyć." }
  - { kind: usage, text: "skończyć studia значит «окончить вуз», а Skończyłem trzydzieści lat — «Мне исполнилось тридцать»." }
  - { kind: usage, text: "To się źle skończy — «Это плохо кончится»; skończyć z czymś — «покончить с чем-то»." }
collocations:
  - { pl: "skończyć pracę", ru: "закончить работу" }
  - { pl: "skończyć studia", ru: "окончить вуз" }
  - { pl: "skończyć się", ru: "закончиться" }
  - { pl: "skończyć z czymś", ru: "покончить с чем-то" }
etymology: "Приставка s- + koniec «конец»; ср. русское «скончать, кончить». Несовершенный вид — kończyć."
memory: "skończyć coś — «закончить что-то», skończyć się — «закончиться», как в русском. Плюс две связки: skończyć studia «окончить вуз» и Skończyłem trzydzieści lat «Мне исполнилось тридцать»."
idioms:
  - { pl: "skończyć z czymś", ru: "покончить с чем-то" }
  - { pl: "to się źle skończy", ru: "это плохо кончится" }
  - { pl: "skończyć się na niczym", ru: "кончиться ничем" }
