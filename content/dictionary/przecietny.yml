format: 2
lemma: "przeciętny"
rank: 5285
pos: adj
pron: { cyr: "пшэце́нтны" }
senses:
  - id: average
    ru: "средний (статистически, обычный)"
    examples:
      - pl: "Przeciętny Polak czyta jedną książkę rocznie."
        ru: "Средний поляк читает одну книгу в год."
        source: { kind: authored }
      - pl: "Przeciętna pensja wzrosła o pięć procent."
        ru: "Средняя зарплата выросла на пять процентов."
        source: { kind: authored }
      - pl: "To przeciętna rodzina z miasta."
        ru: "Это обычная городская семья."
        source: { kind: authored }
  - id: mediocre
    ru: "посредственный, заурядный"
    examples:
      - pl: "Film był przeciętny."
        ru: "Фильм был посредственным."
        source: { kind: authored }
      - pl: "To przeciętny uczeń, ani dobry, ani zły."
        ru: "Это средний ученик, ни хороший, ни плохой."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Русскому «пресечённый» польское PRZECIĘTNY созвучно, но корни разные: польское слово от PRZECIĄĆ, «рассечь, разрезать». Но значит оно «средний»: то, что получается, если «рассечь» всё пополам. Синоним ŚREDNI тоже «средний», но о величинах: ŚREDNIA TEMPERATURA. PRZECIĘTNY — о людях и типичности: PRZECIĘTNY KOWALSKI, «средний поляк, обыватель». И часто — «посредственный»." }
  - { kind: usage, text: "Полная парадигма: PRZECIĘTNY, PRZECIĘTNIEJSZY, NAJPRZECIĘTNIEJSZY. Степени редки и звучат иронично: NAJPRZECIĘTNIEJSZY FILM ROKU, «самый заурядный фильм года». Мужское-личное: PRZECIĘTNI, PRZECIĘTNIEJSI, NAJPRZECIĘTNIEJSI." }
  - { kind: government, text: "Ставится перед существительным: PRZECIĘTNY CZŁOWIEK, PRZECIĘTNA PŁACA. В среднем — PRZECIĘTNIE или ŚREDNIO, наречием. Ниже среднего — PONIŻEJ PRZECIĘTNEJ, где PRZECIĘTNA выступает как существительное." }
  - { kind: pronunciation, text: "Читается «пшэце́нтны», четыре слога, ударение на предпоследнем. PRZE — «пшэ», CIĘ — «цен», носовое Ę перед T. В PRZECIĘTNIEJSZY: «пшэцентне́йшы»." }
  - { kind: register, text: "Нейтральное слово в статистике и журналистике: PRZECIĘTNE WYNAGRODZENIE — официальный термин ГУС. В оценках — сдержанная критика: «средненько, ничего особенного»." }
collocations:
  - { pl: "przeciętne wynagrodzenie", ru: "средняя зарплата" }
  - { pl: "przeciętny człowiek", ru: "средний человек, обыватель" }
  - { pl: "powyżej przeciętnej", ru: "выше среднего" }
family:
  - { pl: "przeciętnie", ru: "в среднем; посредственно", relation: derived }
  - { pl: "średni", ru: "средний", relation: root, id: sredni }
  - { pl: "przeciąć", ru: "разрезать, рассечь", relation: root }
etymology: "От PRZECIĄĆ «разрезать, рассечь», от CIĄĆ «резать». Средняя величина — та, что «рассекает» ряд пополам. По смыслу слово повторяет латинское mediocris, «средний, посредственный»: и там, и тут «среднее» легко становится «посредственным»."
memory: "Przeciętny — средний; посредственный: przeciętny Polak, przeciętna pensja, film był przeciętny. Powyżej przeciętnej — выше среднего. Читается «пшэце́нтны»."
idioms:
