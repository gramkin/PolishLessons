# review
id: umrzec
format: 2
lemma: "umrzeć"
rank: 308
pos: verb
aspect: perf
pron: { cyr: "у́мжець" }
senses:
  - id: die
    ru: "умереть"
    examples:
      - pl: "Czy Tom umarł?"
        ru: "Том умер?"
        source: { kind: tatoeba, id: 6603011 }
      - pl: "Nikt nie umarł."
        ru: "Никто не умер."
        source: { kind: tatoeba, id: 3516161 }
      - pl: "Lincoln umarł w 1865."
        ru: "Линкольн умер в 1865."
        source: { kind: tatoeba, id: 555197 }
  - id: will-die
    ru: "умереть (о будущем, о неизбежном)"
    examples:
      - pl: "Wiem, że umrę."
        ru: "Я знаю, что умру."
        source: { kind: tatoeba, id: 1634950 }
      - pl: "Czy Tom umrze?"
        ru: "Том умрёт?"
        source: { kind: tatoeba, id: 2587174 }
      - pl: "Oni muszą umrzeć."
        ru: "Они должны умереть."
        source: { kind: tatoeba, id: 4916187 }
notes:
  - { kind: usage, text: "Основа меняется так же, как в русском: umrzeć — umarłem «умер», umarła «умерла». Сравните: «умереть — умер»." }
  - { kind: usage, text: "Несовершенный вид — umierać: Umieram z głodu «Умираю с голоду»." }
  - { kind: usage, text: "От болезни умирают «на»: umrzeć na raka «умереть от рака», umrzeć na zawał «умереть от инфаркта». По другой причине — z powodu czegoś." }
  - { kind: usage, text: "Книжный вариант — zemrzeć, от которого в живой речи остались прежде всего формы прошедшего времени: zmarł, zmarła, zmarli «скончался, скончалась, скончались». Они звучат официальнее, чем umarł, и обычны в некрологах." }
collocations:
  - { pl: "umrzeć na coś", ru: "умереть от чего-то" }
  - { pl: "umrzeć ze starości", ru: "умереть от старости" }
  - { pl: "umrzeć młodo", ru: "умереть молодым" }
  - { pl: "boję się umrzeć", ru: "боюсь умереть" }
etymology: "Из u- + mrzeć, от праславянского *merti; то же гнездо, что русские «умереть», «мёртвый», «смерть»."
memory: "umrzeć — «умереть», и основа меняется точно как в русском: umrzeć → umarłem, как «умереть → умер». От болезни умирают «на»: umrzeć na raka."
idioms:
  - { pl: "umarł w butach", ru: "умер внезапно, не успев ничего" }
  - { pl: "umarł król, niech żyje król", ru: "король умер, да здравствует король" }
  - { pl: "umrzeć ze śmiechu", ru: "умереть со смеху" }
