# review
id: poszczegolny
format: 2
lemma: "poszczególny"
rank: 6069
pos: adj
pron: { cyr: "пошчэгу́льны" }
senses:
  - id: individual
    ru: "отдельный, каждый в отдельности"
    examples:
      - pl: "Całość jest większa niż suma poszczególnych części."
        ru: "Целое больше суммы отдельных частей."
        source: { kind: translated, id: 1997160 }
      - pl: "Białe światło można rozszczepić na poszczególne fale o różnych barwach."
        ru: "Белый свет можно разложить на отдельные волны разных цветов."
        source: { kind: translated, id: 13560979 }
      - pl: "Poszczególni uczniowie dostali różne zadania."
        ru: "Отдельные ученики получили разные задания."
        source: { kind: authored }
  - id: respective
    ru: "соответствующий, свой у каждого (в перечислении)"
    examples:
      - pl: "Pod koniec istnienia Cesarstwa Rzymskiego, co nastąpiło w 476 r., łacina rozwijała się inaczej w poszczególnych regionach Zachodu."
        ru: "К концу существования Римской империи, наступившему в 476 году, латынь развивалась по-разному в разных областях Запада."
        source: { kind: translated, id: 13006764 }
      - pl: "Ceny w poszczególnych sklepach bardzo się różnią."
        ru: "Цены в разных магазинах сильно различаются."
        source: { kind: authored }
notes:
  - { kind: usage, text: "POSZCZEGÓLNY почти всегда во множественном: poszczególne części, poszczególni pracownicy — «отдельные, каждый по отдельности». Значит не «некоторые», а «все, но по одному»: w poszczególnych klasach — «в каждом классе в отдельности». Наречие — POSZCZEGÓLNIE, редкое; чаще Z OSOBNA, «по отдельности»." }
  - { kind: false-friend, text: "Русскому «отдельные люди» часто значит «некоторые, немногие» с оттенком осуждения: «отдельные товарищи». Польское POSZCZEGÓLNI ludzie этого оттенка не несёт: это каждый человек в отдельности. «Некоторые» — NIEKTÓRZY." }
  - { kind: pronunciation, text: "«пошчэгу́льны»: SZCZ — «шч», как русское «щ», но твёрже; Ó — «у»; L перед N — «ль». Ударение на предпоследнем слоге GÓL." }
  - { kind: register, text: "Нейтрально-книжное: отчёты, учебники, инструкции. В разговоре — każdy z osobna, różne." }
collocations:
  - { pl: "poszczególne części", ru: "отдельные части" }
  - { pl: "w poszczególnych przypadkach", ru: "в отдельных случаях" }
  - { pl: "poszczególni członkowie", ru: "отдельные члены" }
family:
  - { pl: "szczegół", ru: "подробность, деталь", relation: root, id: szczegol }
  - { pl: "szczególny", ru: "особый", relation: root, id: szczegolny }
  - { pl: "poszczególnie", ru: "по отдельности", relation: derived }
etymology: "От SZCZEGÓŁ, «подробность, частность», старопольского SZCZEGÓLNY, «единичный, отдельный», с приставкой PO-, распределительной, как в «по одному». Корень *ščeg- — «отдельный, единичный»; в русском не сохранился."
memory: "Poszczególny — отдельный, каждый по одному: od szczegół, «деталь». Poszczególni uczniowie — каждый ученик в отдельности, а не «некоторые» (niektórzy)."
idioms:
  - { pl: "w poszczególnych przypadkach", ru: "в отдельных случаях" }
