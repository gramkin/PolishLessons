senses:
  - id: calm-person
    ru: "спокойный (о человеке)"
    examples:
      - pl: "Jestem spokojny."
        ru: "Я спокоен."
        source: { kind: translated, id: 1660212 }
      - pl: "Tom jest spokojny."
        ru: "Том спокоен."
