    ru: "тихий, спокойный (о месте, времени)"
    examples:
      - pl: "Miasto jest spokojne nocą."
        ru: "Ночью город спокоен."
        source: { kind: translated, id: 12977077 }
      - pl: "Była spokojna noc."
        ru: "Была спокойная ночь."
