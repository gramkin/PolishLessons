        ru: "Море спокойное."
        source: { kind: translated, id: 6305585 }
      - pl: "Morze było spokojne."
        ru: "Море было спокойным."
        source: { kind: translated, id: 12755786 }
      - pl: "Ocean był spokojny."
        ru: "Океан был спокойным."
        source: { kind: translated, id: 530596 }
notes:
  - { kind: usage, text: "Рядом с карточкой spokój «спокойствие»: spokojny — прилагательное от него. Соседнее cichy значит «тихий» в смысле отсутствия звука, а spokojny — отсутствия волнения." }
  - { kind: usage, text: "Ocean Spokojny — «Тихий океан»: польский называет его «спокойным». В этом сочетании слово пишется с прописной и работает как часть имени собственного." }
  - { kind: usage, text: "Bądź spokojny «Будь спокоен» — обычная форма утешения, с родовым согласованием: spokojna для женщины." }
  - { kind: usage, text: "Сравнительная степень — spokojniejszy «спокойнее», превосходная — najspokojniejszy." }
collocations:
  - { pl: "bądź spokojny", ru: "будь спокоен" }
  - { pl: "spokojna noc", ru: "спокойная ночь" }
  - { pl: "spokojne morze", ru: "спокойное море" }
etymology: "От spokój «спокойствие», праславянское *pokojь «покой». Русское «спокойный» построено от того же корня, только с приставкой «с-», а польское — с «s-» в самом существительном."
memory: "spokojny — «спокойный». Соседнее cichy — «тихий» про звук, spokojny — про отсутствие волнения. И запомните Ocean Spokojny «Тихий океан»."
