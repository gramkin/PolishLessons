rank: 1426
pos: noun
pron: { cyr: "вы́дзяу" }
senses:
  - id: faculty
    ru: "факультет"
    examples:
      - pl: "Jestem absolwentem wydziału biologii."
        ru: "Я выпускник биологического факультета."
        source: { kind: translated, id: 2350740 }
