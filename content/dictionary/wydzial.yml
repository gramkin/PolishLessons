      - pl: "Pracuje w wydziale kadr."
        ru: "Он работает в отделе кадров."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Два значения: «факультет» в университете (wydział prawa) и «отдел» в учреждении (wydział kadr «отдел кадров»)." }
  - { kind: usage, text: "Учатся na wydziale, с предлогом na и предложным падежом, а не w wydziale." }
  - { kind: false-friend, text: "Различайте три родственных слова: wydział «факультет, отдел», dział «раздел, отдел магазина» и oddział «отделение, филиал». Все три от dzielić «делить»." }
  - { kind: usage, text: "Мужской неодушевлённый: wydział, wydziału, na wydziale." }
collocations:
  - { pl: "wydział prawa", ru: "юридический факультет" }
  - { pl: "wydział kadr", ru: "отдел кадров" }
  - { pl: "dziekan wydziału", ru: "декан факультета" }
etymology: "Приставка wy- и dział «раздел», от dzielić «делить» (праславянское *dělъ). Русский «отдел» собран из тех же частей, только с другой приставкой."
memory: "wydział — и «факультет», и «отдел»: wydział prawa «юридический факультет», wydział kadr «отдел кадров». Предлог na: studiuję na wydziale. И различайте wydział, dział и oddział — все от dzielić «делить»."
