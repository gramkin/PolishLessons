notes:
  - { kind: false-friend, text: "Корень здесь обманчив. Польское GUBIĆ значит «терять», а не «губить»: zgubić klucze — потерять ключи, zgubić się — заблудиться. Русское «губить» и «загубить» передаются по-польски через NISZCZYĆ или ZMARNOWAĆ. Слова всё же родня, оба из праславянского *gubiti, но польский остановился на утрате вещи, а русский дошёл до уничтожения." }
  - { kind: usage, text: "Форм одиннадцать, и причина здесь третья по счёту. У fizyczny их столько же, потому что он относит к разряду; у mokry — потому что синтетических степеней просто не сложилось; у zagubiony — потому что это причастие, а причастия степеней не образуют вовсе. Три разных слова, одно и то же число форм, три разные причины. Для сравнения, starożytny из этой же подборки имеет все тридцать три." }
  - { kind: pronunciation, text: "Мужская личная форма множественного — ZAGUBIENI, с заменой -ony на -eni. Так ведут себя все причастия на -ony: podnoszony — podnoszeni, zaproszony — zaproszeni, uruchomiony — uruchomieni. Гласная меняется вместе с согласной, и форма выглядит дальше от исходной, чем на самом деле." }
collocations:
  - { pl: "zagubiony klucz", ru: "потерянный ключ" }
  - { pl: "czuć się zagubionym", ru: "чувствовать себя потерянным" }
  - { pl: "zagubiona wieś", ru: "затерянная деревня" }
family:
  - { pl: "zgubić", ru: "потерять", relation: root, id: zgubic }
  - { pl: "gubić", ru: "терять", relation: root }
  - { pl: "zguba", ru: "пропажа", relation: derived }
etymology: "Причастие от ZAGUBIĆ, из праславянского *gubiti. Русский «губить» — то же слово, и первоначальный смысл был общий: довести до утраты. Польский удержался на утрате предмета, русский пошёл дальше, к уничтожению живого. Поэтому zgubiony portfel — это потерянный кошелёк, а не загубленный."
memory: "gubić — это «терять», а не «губить». И одиннадцать форм здесь потому, что это причастие, а причастия не сравниваются."
