notes:
  - { kind: false-friend, text: "Корень тот же, что в русском «лице» и «облике»: OBLICZE построено от LICE с приставкой OB-. Но употребление другое. Обычное, повседневное «лицо» по-польски TWARZ, и именно его говорят о человеке: UMYŁ TWARZ «умыл лицо». OBLICZE — слово высокое и книжное, уместное о святых на иконах, о лике эпохи, о внешнем виде города: OBLICZE MIASTA. Русское «обличье» ближе по стилю, но у него есть оттенок маски или личины, которого у польского слова нет. Самое важное — устойчивый оборот W OBLICZU плюс родительный падеж: «перед лицом чего-то», и в официальном польском он встречается постоянно: W OBLICZU KRYZYSU, W OBLICZU ZAGROŻENIA." }
  - { kind: usage, text: "Среднее существительное на -E, и в родительном множественного у него две формы: OBLICZ с нулевым окончанием и OBLICZY с окончанием -Y. Обе правильны, OBLICZY звучит чуть книжнее. Это полезно сравнить с соседями по типу: WNĘTRZE даёт только WNĘTRZ, с нулевым окончанием, а OSTRZE — только OSTRZY, с -Y. Три слова одного типа, три разных родительных множественного, и выбор не выводится из окончания именительного. Форма OBLICZA покрывает родительный единственного вместе с именительным и винительным множественного, как у всех средних на -E." }
  - { kind: government, text: "Средний род. Чей лик или чего — родительный: OBLICZE STARCA, OBLICZE MIASTA, OBLICZE EPOKI. Главный оборот — W OBLICZU плюс родительный: W OBLICZU WOJNY «перед лицом войны», W OBLICZU PRAWA «перед лицом закона». По-русски здесь нужен предлог «перед» с творительным, по-польски — W с местным, и эта разница устойчиво сбивает. Второй частотный оборот: STANĄĆ W OBLICZU CZEGOŚ «оказаться перед чем-то». Прилагательное OBLICZONY к этому слову не относится: оно от OBLICZYĆ «подсчитать»." }
  - { kind: pronunciation, text: "Читается «обли́че», три слога, ударение на предпоследнем. Начальное O произносится полно. Сочетание CZ даёт «ч», твёрдое. Конечное -E звучит как «е», коротко и ясно, без редукции до «и». В местном падеже OBLICZU слышно «обли́чу». В родительном множественного OBLICZ слогов два, ударение переходит на первый: «о́блич». Во второй форме родительного множественного OBLICZY конечное -Y это «ы»: «обли́чы»." }
