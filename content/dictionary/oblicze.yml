etymology: "От LICE «лицо» с приставкой OB-, означающей здесь охват, обращённость вокруг: буквально «то, что обращено наружу». Корень праславянский, *lice, и русское «лицо» — то же слово; русское «облик» и «обличье» построены той же приставкой на том же корне, так что соответствие полное по составу и лишь частичное по стилю. Польский развил у приставочной формы высокое значение и оставил бытовое за TWARZ, которое идёт от другого корня, связанного с *tvoriti «творить, придавать вид». Русский поступил наоборот: бытовым стало «лицо», а приставочные «облик» и «обличье» ушли в книжный и отчасти неодобрительный слой. Оборот W OBLICZU, скорее всего, калька с латинского IN FACIE через канцелярский язык, и в русском ему отвечает «перед лицом» с тем же происхождением."
memory: "Корень тот же, что в «лице»: oblicze от lice с приставкой ob-. Но обычное «лицо» — это twarz, а oblicze высокое и книжное: oblicze miasta, лики святых. Главное — оборот w obliczu плюс родительный: «перед лицом чего-то», W OBLICZU KRYZYSU; по-русски «перед» с творительным, по-польски W с местным. Два родительных множественного: oblicz и obliczy."
