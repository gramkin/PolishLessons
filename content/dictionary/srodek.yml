# review
id: srodek
format: 2
lemma: "środek"
rank: 330
pos: noun
pron: { cyr: "сьро́дэк" }
senses:
  - id: middle
    ru: "середина, центр"
    examples:
      - pl: "Trafiłeś w środek tarczy."
        ru: "Ты попал в середину мишени."
        source: { kind: tatoeba, id: 5704996 }
      - pl: "Na środku drogi stoi ciężarówka."
        ru: "Посреди дороги стоит грузовик."
        source: { kind: tatoeba, id: 751840 }
      - pl: "Zasnąłem w środku wykładu."
        ru: "Я заснул в середине доклада."
        source: { kind: tatoeba, id: 5704990 }
  - id: means
    ru: "средство, мера"
    examples:
      - pl: "Cel uświęca środki"
        ru: "Цель оправдывает средства."
        source: { kind: translated, id: 13517879 }
      - pl: "Jakim środkiem lokomocji pojedziemy?"
        ru: "Каким транспортом поедем?"
        source: { kind: translated, id: 364895 }
      - pl: "Będę korzystać z wszelkich środków, aby wygrać."
        ru: "Я буду использовать все средства, чтобы победить."
        source: { kind: translated, id: 3148510 }
notes:
  - { kind: usage, text: "Два значения расходятся далеко: «середина, центр» (na środku drogi «посреди дороги») и «средство, мера» (środki płatnicze «платёжные средства»)." }
  - { kind: usage, text: "w środku значит «внутри», do środka — «внутрь»: Czy mogę wejść do środka? «Можно войти внутрь?»" }
  - { kind: usage, text: "środek nocy — «среди ночи», środek tygodnia — «середина недели»." }
  - { kind: false-friend, text: "Гнездо общее с русским, но слова разошлись: środek — «середина, средство», środa — «среда» (день недели), a środowisko — «окружающая среда»." }
collocations:
  - { pl: "na środku", ru: "посередине" }
  - { pl: "w środku", ru: "внутри" }
  - { pl: "złoty środek", ru: "золотая середина" }
  - { pl: "środki płatnicze", ru: "платёжные средства" }
etymology: "Праславянское *serdъkъ от *serda «середина». Это то же гнездо, что русские «середина», «сердце» и «среда»: польское ro стоит на месте русского «ере»."
memory: "środek — «середина» и «средство» сразу. Польское ro на месте русского «ере», так что środek — это почти «средок», родня «середине». И запомните пару w środku «внутри» / do środka «внутрь»."
idioms:
  - { pl: "złoty środek", ru: "золотая середина" }
  - { pl: "cel uświęca środki", ru: "цель оправдывает средства" }
  - { pl: "w środku nocy", ru: "среди ночи" }
