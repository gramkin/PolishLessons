# review
id: wprost
format: 2
lemma: "wprost"
rank: 1587
pos: part
pron: { cyr: "впрост" }
senses:
  - id: directly
    ru: "прямо, напрямик (о движении и речи)"
    examples:
      - pl: "Zapytałem go wprost."
        ru: "Я спросил его напрямик."
        source: { kind: translated, id: 566472 }
      - pl: "Podszedł wprost do mnie."
        ru: "Он подошёл прямо ко мне."
        source: { kind: translated, id: 705298 }
      - pl: "Powiedz wprost, o co chodzi!"
        ru: "Скажи прямо, в чём дело!"
        source: { kind: translated, id: 3679906 }
  - id: bluntly
    ru: "прямо, без обиняков (об отказе, вопросе)"
    examples:
      - pl: "Wprost odmówiła mojej prośbie."
        ru: "Она прямо отказала моей просьбе."
        source: { kind: translated, id: 440644 }
      - pl: "Sąsiad zapytał mnie o to wprost."
        ru: "Сосед спросил меня об этом напрямик."
        source: { kind: translated, id: 933347 }
      - pl: "Zrobił to wprost na moich oczach."
        ru: "Он сделал это прямо у меня на глазах."
        source: { kind: translated, id: 843565 }
notes:
  - { kind: usage, text: "Слово не склоняется — одна форма. Значит «прямо, напрямик» и о движении (podszedł wprost do mnie), и о речи (powiedz wprost)." }
  - { kind: usage, text: "Третье значение — усилительное «прямо-таки»: To wprost niemożliwe «Это прямо-таки невозможно»." }
  - { kind: false-friend, text: "Не путайте с prosto «прямо» (о направлении, «не сворачивая»): idź prosto «иди прямо», но powiedz wprost «скажи прямо, откровенно»." }
  - { kind: usage, text: "Разбирается прозрачно: w + prost- (prosty «прямой»), как русское «в-прямь» и «напрямик»." }
collocations:
  - { pl: "powiedzieć wprost", ru: "сказать прямо" }
  - { pl: "zapytać wprost", ru: "спросить напрямик" }
  - { pl: "wprost przeciwnie", ru: "прямо наоборот" }
etymology: "Из w + prosty «прямой» — буквально «впрямь, напрямую». Русские «впрямь» и «напрямик» собраны из того же корня тем же способом."
memory: "wprost = «прямо, напрямик», и о ходьбе, и о речи: powiedz wprost «скажи прямо». Не путайте с prosto «прямо» в смысле направления: idź prosto «иди прямо, не сворачивая»."
