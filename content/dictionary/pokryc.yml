notes:
  - { kind: pronunciation, text: "Этот глагол добавляет третий тип страдательного причастия, и теперь набор виден целиком. Глаголы на -IĆ дают -ony: KARMIĆ при KARMIONY. Глаголы на -NĄĆ дают -ęty: WALNĄĆ при WALNIĘTY. А глаголы с основой на гласную, как POKRYĆ, дают простое -ty: POKRYTY, POKRYTA, POKRYTE, мужская личная форма множественного POKRYCI. Отглагольное существительное идёт за причастием: POKRYCIE, как WALNIĘCIE при WALNIĘTY и KARMIENIE при KARMIONY." }
  - { kind: usage, text: "Корень русскому прозрачен: KRYĆ — это «крыть», из того же праславянского корня. Отсюда POKRYĆ «покрыть», ODKRYĆ «открыть», ZAKRYĆ «закрыть», UKRYĆ «укрыть, спрятать», KRYĆ SIĘ «скрываться», KRYJÓWKA «укрытие», POKRYWKA «крышка». Соответствие приставок почти полное, но одно место стоит отметить: польское ODKRYĆ значит «открыть» в смысле обнаружить, сделать открытие, а «открыть дверь» — это OTWORZYĆ. Так что ODKRYĆ AMERYKĘ да, ODKRYĆ DRZWI нет." }
  - { kind: government, text: "В прямом значении берёт винительный плюс творительный на материале: POKRYĆ DACH BLACHĄ, POKRYĆ ŚCIANĘ FARBĄ, POKRYĆ PODŁOGĘ LAKIEREM — ровно как русское «покрыть крышу жестью». Во втором значении дополнение — расходы или убытки: POKRYĆ KOSZTY, STRATY, SZKODĘ, и русский говорит точно так же. Существительное POKRYCIE при этом живёт двойной жизнью: POKRYCIE DACHOWE — «кровельное покрытие», а в финансах POKRYCIE значит «обеспечение»: CZEK BEZ POKRYCIA — «чек без покрытия»." }
  - { kind: usage, text: "Пятьдесят три формы — совершенный переходный: сорок одна основная, одиннадцать страдательных причастий и деепричастие POKRYWSZY. Повелительное POKRYJ выходит из третьего лица POKRYJE отбрасыванием -e, и основа на -j слово закончить может, так что никакого -ij не вставляется. Несовершенная пара — POKRYWAĆ, и у неё настоящее время POKRYWAM, то есть -YWA- здесь сохраняется, в отличие от класса на -YWAĆ с меной на -uj-." }
