etymology: "Приставка po- и KRYĆ «крыть», из праславянского *kryti — то же слово, что русское «крыть». Гнездо совпадает с русским почти целиком: POKRYĆ «покрыть», ZAKRYĆ «закрыть», UKRYĆ «укрыть», ODKRYĆ «открыть, обнаружить», SKRYTY «скрытный», KRYJÓWKA «укрытие», POKRYWKA «крышка». Расходится только ODKRYĆ, которое значит «обнаружить», а не «отворить»: дверь открывают глаголом OTWORZYĆ."
memory: "kryć — это «крыть», и всё гнездо читается само. Причастие тут на -ty: pokryty, в отличие от karmiony и walnięty. А czek bez pokrycia — «чек без покрытия»."
