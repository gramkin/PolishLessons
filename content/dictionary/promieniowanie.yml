etymology: "От глагола PROMIENIOWAĆ, а тот от PROMIEŃ «луч», от праславянского корня, давшего и украинское «промінь». Русский для луча взял другое слово, «луч», родственное латинскому LUX «свет», поэтому корни в двух языках разошлись, хотя способ постройки совпал: и «излучение», и PROMIENIOWANIE это «испускание лучей», собранное от названия луча. Суффикс -ANIE в польском отвечает русскому -АНИЕ и -ЕНИЕ и образует названия действий от любого глагола."
memory: "Строение слова подсказывает смысл, даже когда корень чужой: promień это «луч» (украинское «промінь»), а русский для того же взял «луч» другого корня. Promieniowanie значит «излучение». Суффикс -anie отвечает русским -ание и -ение и работает на сотнях слов: czytanie, spotkanie, mieszkanie. Читается «промьеньова́не», и конец звучит «не», а не «ние». Управление расходится: ochrona przed promieniowaniem, творительный после przed."
