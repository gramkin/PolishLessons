notes:
  - { kind: false-friend, text: "Образ в обоих языках один, а слова разные. PROMIENIOWANIE построено от PROMIEŃ «луч», как русское «излучение» от «луча»: нечто испускает лучи. Но сам корень не совпадает. Польское PROMIEŃ отвечает украинскому «променю», а русский взял для этого «луч», слово другого корня. Поэтому носителю русского подсказывает не корень, а устройство слова: PROMIEŃ плюс суффикс даёт ровно то же, что «луч» плюс приставка и суффикс." }
  - { kind: usage, text: "Восемь форм, средний род. Это отглагольное существительное от PROMIENIOWAĆ, и суффикс -ANIE отвечает русскому -АНИЕ или -ЕНИЕ: CZYTANIE «чтение», SPOTKANIE «встреча», MIESZKANIE «жильё». Правило работает на сотнях слов, и по нему от любого польского глагола можно построить название действия. Множественное число употребляют физики, когда речь о нескольких видах излучения сразу: PROMIENIOWANIA RÓŻNYCH TYPÓW." }
  - { kind: government, text: "Доза чего-либо — родительный без предлога: DAWKA PROMIENIOWANIA. Защищаться от — CHRONIĆ przed с творительным: CHRONIĆ PRZED PROMIENIOWANIEM, тогда как русский говорит «защищать от», с родительным. Это расхождение стоит запомнить: польский PRZED требует творительного, и в обороте OCHRONA PRZED PROMIENIOWANIEM иначе быть не может. В излучении — предлог W с местным падежом: W PROMIENIOWANIU KOSMICZNYM." }
  - { kind: pronunciation, text: "Читается «промьеньова́не», пять слогов, ударение на предпоследнем, то есть на WA. Сочетание MIE даёт мягкое «мье», а NIO мягкое «ньо», так что середина слова для русского уха непривычно мягкая. Конечное -NIE звучит «не», без всякого «ние»: это общее правило для всех слов на -ANIE, и говорить «промениованийэ» нельзя. В PROMIEŃ конечное Ń мягкое, «про́мень»." }
  - { kind: register, text: "Слово из научного и газетного языка, но вполне известное всякому: PROMIENIOWANIE SŁONECZNE «солнечное излучение», PROMIENIOWANIE UV, DAWKA PROMIENIOWANIA «доза излучения». После Чернобыля оно вошло и в бытовую речь. Термин PROMIENIOWANIE JONIZUJĄCE «ионизирующее излучение» стоит в каждом учебнике и на каждой предупреждающей табличке. В разговоре о радиации поляк скажет и короче, RADIACJA, но официальный язык предпочитает PROMIENIOWANIE." }
