notes:
  - { kind: government, text: "Женский род к sąsiad «сосед», который уже есть в словаре. Творительный — sąsiadką: Jestem twoją sąsiadką «Я твоя соседка»." }
  - { kind: usage, text: "В польском род соседа называют всегда: о женщине скажут sąsiadka, а не sąsiad. Русский часто обходится общим «сосед»." }
  - { kind: false-friend, text: "Корень siedzieć «сидеть» с приставкой są- «со-»: буквально «сидящий рядом», как русское «сосед»." }
  - { kind: usage, text: "Прилагательное — sąsiedzki «соседский», существительное sąsiedztwo «соседство»." }
collocations:
  - { pl: "nasza sąsiadka", ru: "наша соседка" }
  - { pl: "iść do sąsiadki", ru: "идти к соседке" }
etymology: "Женское к sąsiad «сосед», из są- «со-» и siedzieć «сидеть»: буквально «сидящий рядом» — ровно как русское «сосед»."
memory: "sąsiadka — «соседка». Польский всегда называет род: о женщине только sąsiadka. Корень тот же, что в русском «сосед» — «сидящий рядом»."
idioms:
  - { pl: "nasza sąsiadka", ru: "наша соседка" }
