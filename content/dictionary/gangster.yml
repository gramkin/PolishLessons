notes:
  - { kind: false-friend, text: "GANGSTER — «гангстер», как в русском. Но в польском слово шире и часто значит просто «бандит, член банды». Банда — GANG или BANDA, бандит-одиночка — BANDYTA." }
  - { kind: usage, text: "Десять форм, мужской род, лицо. Во множественном R переходит в RZ: GANGSTERZY. Местный и звательный единственного — GANGSTERZE." }
  - { kind: government, text: "Играть гангстера — GRAĆ GANGSTERA, винительный. Стать гангстером — ZOSTAĆ GANGSTEREM, творительный. Фильм о гангстерах — FILM O GANGSTERACH, местный." }
  - { kind: pronunciation, text: "Читается «га́нгстэр», ударение на первом слоге. N перед G звучит носово, как в «гонг». TE — твёрдое «тэ»." }
