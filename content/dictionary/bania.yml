notes:
  - { kind: false-friend, text: "Слово читается в точности как русская «баня» — «ба́ня», — и значит совсем другое. Польская BANIA — это большая круглая посудина, бутыль, баллон, а также шар или купол: bania z kwasem, bania cerkwi. Никакого помещения для мытья она не обозначает. Баня по-польски называется ŁAŹNIA, а финская — SAUNA. Фраза idę do bani никакого смысла не имеет, и спросить дорогу к бане этим словом нельзя." }
  - { kind: usage, text: "Родительный множественного существует в двух видах: BANI и BAŃ. Это первый женский дублет в словаре — все прежние были мужские: bagaży и bagażów, ochroniarzy и ochroniarzów, napoi и napojów. Значит колебание в родительном множественного не привязано к мужскому роду, оно шире. Различаются эти две формы сильнее, чем обычная пара окончаний: BANI сохраняет -i, а BAŃ оставляет голую основу с мягким ń на конце." }
  - { kind: usage, text: "Форма BANI делает четыре работы сразу: родительный, дательный и местный единственного плюс один из двух родительных множественного. Это обычное дело для женских слов на -ia и -nia: у них мягкая основа складывает падежи плотно, как у PUSTYNIA и KŁÓTNIA. Отдельно запомните разговорное выражение BYĆ NA BANI — «быть под хмельком»; к посуде оно отношения уже не имеет, хотя выросло явно из неё." }
collocations:
  - { pl: "bania z kwasem", ru: "бутыль с квасом" }
  - { pl: "bania cerkwi", ru: "купол церкви" }
  - { pl: "być na bani", ru: "быть под хмельком" }
family:
  - { pl: "bańka", ru: "пузырь, баночка", relation: derived }
etymology: "Из праславянского *banja, а то — из народнолатинского balneum «купальня», откуда и русская «баня». Слово у двух языков одно, а смыслы разошлись далеко: русский удержал исходное значение помещения для мытья, польский же перешёл на круглую посудину и на купол, то есть на форму предмета, а не на его назначение. Отсюда и ловушка: звучание совпадает полностью, смысл — ни в чём."
memory: "Звучит как «баня», а значит «бутыль» или «купол». Баня по-польски — łaźnia. Родительный множественного двойной: bani и bań."
idioms:
  - { pl: "być na bani", ru: "быть под хмельком" }
  - { pl: "bania z kwasem", ru: "бутыль с квасом" }
