family:
  - { pl: "podejrzewać", ru: "подозревать", relation: derived }
  - { pl: "podejrzenie", ru: "подозрение", relation: derived }
  - { pl: "podejrzliwy", ru: "недоверчивый", relation: derived }
etymology: "Страдательное причастие от podejrzewać «подозревать» (pod- + старое źrzeć «смотреть»), то есть «тот, на кого посмотрели искоса». Русское «подозревать» сложено ровно так же: под- + зреть."
memory: "podejrzany — причастие от podejrzewać, и оно закрывает сразу два русских слова: «подозрительный» о вещи (podejrzane źródło) и «подозреваемый» о человеке (podejrzanego zatrzymano). Степеней сравнения нет — только bardziej podejrzany. Главное не спутать с podejrzliwy: podejrzany — тот, кого подозревают, podejrzliwy — тот, кто сам всех подозревает."
idioms:
  - { pl: "podejrzany typ", ru: "подозрительный тип" }
  - { pl: "coś jest podejrzanej czystości", ru: "дело нечисто" }
  - { pl: "nic podejrzanego", ru: "ничего подозрительного" }
