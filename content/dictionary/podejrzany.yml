  - id: suspect
    ru: "подозреваемый (в юридическом языке — как существительное)"
    note: "В этом значении слово склоняется как существительное: podejrzany, podejrzanego, podejrzanemu."
    examples:
      - pl: "Podejrzany pozostaje na wolności."
        ru: "Подозреваемый остаётся на свободе."
        source: { kind: tatoeba, id: 3677187 }
      - pl: "Policja zaaresztowała podejrzanego w sprawie."
        ru: "Полиция арестовала подозреваемого по делу."
        source: { kind: tatoeba, id: 5909131 }
      - pl: "Podejrzanego zatrzymano na lotnisku."
        ru: "Подозреваемого задержали в аэропорту."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Это страдательное причастие от podejrzewać «подозревать», ставшее прилагательным. Отсюда оба русских перевода: «подозрительный» (о вещи) и «подозреваемый» (о человеке)." }
  - { kind: false-friend, text: "Не путайте podejrzany и podejrzliwy. podejrzany — тот, кого подозревают; podejrzliwy — тот, кто сам всех подозревает, «недоверчивый»: podejrzliwy staruszek «недоверчивый старик»." }
  - { kind: usage, text: "Степеней сравнения у причастия нет: «более подозрительный» будет bardziej podejrzany, «самый подозрительный» — najbardziej podejrzany." }
  - { kind: usage, text: "В юридическом языке podejrzany «подозреваемый» — ещё не oskarżony «обвиняемый»: обвинение предъявляют позже." }
