senses:
  - id: suspicious
    ru: "подозрительный, вызывающий подозрения"
    examples:
      - pl: "Jego zachowanie było podejrzane."
        ru: "Его поведение было подозрительным."
        source: { kind: authored }
      - pl: "Kupił towar z podejrzanego źródła."
        ru: "Он купил товар из подозрительного источника."
        source: { kind: authored }
      - pl: "W ciemnym zaułku stał podejrzany człowiek."
        ru: "В тёмном переулке стоял подозрительный человек."
        source: { kind: authored }
  - id: suspect
    ru: "подозреваемый (в юридическом языке — как существительное)"
    note: "В этом значении слово склоняется как существительное: podejrzany, podejrzanego, podejrzanemu."
    examples:
      - pl: "Podejrzany pozostaje na wolności."
        ru: "Подозреваемый остаётся на свободе."
        source: { kind: tatoeba, id: 3677187 }
      - pl: "Policja zaaresztowała podejrzanego w sprawie."
        ru: "Полиция арестовала подозреваемого по делу."
        source: { kind: tatoeba, id: 5909131 }
      - pl: "Podejrzanego zatrzymano na lotnisku."
        ru: "Подозреваемого задержали в аэропорту."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Это страдательное причастие от podejrzewać «подозревать», ставшее прилагательным. Отсюда оба русских перевода: «подозрительный» (о вещи) и «подозреваемый» (о человеке)." }
  - { kind: false-friend, text: "Не путайте podejrzany и podejrzliwy. podejrzany — тот, кого подозревают; podejrzliwy — тот, кто сам всех подозревает, «недоверчивый»: podejrzliwy staruszek «недоверчивый старик»." }
  - { kind: usage, text: "Степеней сравнения у причастия нет: «более подозрительный» будет bardziej podejrzany, «самый подозрительный» — najbardziej podejrzany." }
  - { kind: usage, text: "В юридическом языке podejrzany «подозреваемый» — ещё не oskarżony «обвиняемый»: обвинение предъявляют позже." }
collocations:
  - { pl: "podejrzany typ", ru: "подозрительный тип" }
  - { pl: "podejrzane źródło", ru: "подозрительный источник" }
  - { pl: "zatrzymać podejrzanego", ru: "задержать подозреваемого" }
  - { pl: "coś jest podejrzane", ru: "что-то подозрительно" }
family:
  - { pl: "podejrzewać", ru: "подозревать", relation: derived }
  - { pl: "podejrzenie", ru: "подозрение", relation: derived }
  - { pl: "podejrzliwy", ru: "недоверчивый", relation: derived }
etymology: "Страдательное причастие от podejrzewać «подозревать» (pod- + старое źrzeć «смотреть»), то есть «тот, на кого посмотрели искоса». Русское «подозревать» сложено ровно так же: под- + зреть."
memory: "podejrzany — причастие от podejrzewać, и оно закрывает сразу два русских слова: «подозрительный» о вещи (podejrzane źródło) и «подозреваемый» о человеке (podejrzanego zatrzymano). Степеней сравнения нет — только bardziej podejrzany. Главное не спутать с podejrzliwy: podejrzany — тот, кого подозревают, podejrzliwy — тот, кто сам всех подозревает."
idioms:
  - { pl: "podejrzany typ", ru: "подозрительный тип" }
  - { pl: "coś jest podejrzanej czystości", ru: "дело нечисто" }
  - { pl: "nic podejrzanego", ru: "ничего подозрительного" }
