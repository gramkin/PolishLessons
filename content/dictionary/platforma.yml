notes:
  - { kind: false-friend, text: "PLATFORMA — «платформа» в широком смысле, но перрон на вокзале — PERON, а не PLATFORMA. PLATFORMA — это буровая, грузовая, смотровая площадка или онлайн-сервис: PLATFORMA STREAMINGOWA." }
  - { kind: usage, text: "Девять форм, женский род. В местном M смягчается: NA PLATFORMIE. Звательный PLATFORMO не употребляется." }
  - { kind: government, text: "На платформе — NA PLATFORMIE, местный. Платформа для чего — PLATFORMA DO и родительный: PLATFORMA DO NAUKI. Смотровая площадка — PLATFORMA WIDOKOWA." }
  - { kind: pronunciation, text: "Читается «платфо́рма», ударение на предпоследнем слоге. PLATFORMIE — «платфо́рме»." }
collocations:
  - { pl: "platforma widokowa", ru: "смотровая площадка" }
