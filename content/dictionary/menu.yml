  - { pl: "restauracja", ru: "ресторан", relation: root, id: restauracja }
  - { pl: "kelner", ru: "официант", relation: root, id: kelner }
etymology: "Из французского MENU «подробный список», от латинского MINUTUS «мелкий». Русское «меню» взято тем же путём, но польское читается с «у»."
memory: "Menu — меню, читается «мэ́ну», не склоняется. W menu — в меню. В ресторане чаще говорят karta."
idioms:
  - { pl: "menu do wyboru", ru: "выбор блюд, богатое меню" }
