notes:
  - { kind: false-friend, text: "MENU — «меню», но в ресторане в Польше часто говорят KARTA: POPROSZĘ KARTĘ. Блюдо дня, бизнес-ланч — DANIE DNIA, ZESTAW DNIA. MENU DEGUSTACYJNE — дегустационное меню." }
  - { kind: usage, text: "Средний род, не склоняется: TO MENU, W MENU, Z MENU. Прилагательные — в среднем роде: NOWE MENU." }
  - { kind: government, text: "В меню — W MENU, местный, форма та же. Выбрать из меню — WYBRAĆ Z MENU. Попросить меню — PROSIĆ O MENU, O с винительным." }
  - { kind: pronunciation, text: "Читается «мэ́ну»: E — твёрдое «э», а U на конце — «у», не французское «ю». Ударение на первом слоге." }
collocations:
  - { pl: "menu dnia", ru: "меню дня" }
  - { pl: "menu dla dzieci", ru: "детское меню" }
  - { pl: "wybrać z menu", ru: "выбрать из меню" }
family:
