# review
id: blyszczec
format: 2
lemma: "błyszczeć"
rank: 5320
pos: verb
pron: { cyr: "буы́шчэць" }
senses:
  - id: shine
    ru: "блестеть, сверкать"
    examples:
      - pl: "Gwiazdy błyszczą na niebie."
        ru: "Звёзды сверкают на небе."
        source: { kind: authored }
      - pl: "Podłoga błyszczy po myciu."
        ru: "Пол блестит после мытья."
        source: { kind: authored }
      - pl: "Oczy jej błyszczały z radości."
        ru: "Её глаза блестели от радости."
        source: { kind: authored }
  - id: stand-out
    ru: "блистать (талантом, красотой)"
    examples:
      - pl: "Na balu błyszczała najbardziej."
        ru: "На балу она блистала ярче всех."
        source: { kind: authored }
      - pl: "Błyszczy w każdej roli."
        ru: "Он блистает в каждой роли."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "BŁYSZCZEĆ — «блестеть», «блистать»: корень тот же, что в BŁYSK «вспышка» и русском «блеск». Но польское слово шире: о чистой посуде, о звёздах, о глазах и о человеке на сцене — везде BŁYSZCZEĆ." }
  - { kind: usage, text: "Несовершенный вид; однократный совершенный — ZABŁYSZCZEĆ или BŁYSNĄĆ. Спряжение: BŁYSZCZĘ, BŁYSZCZYSZ, BŁYSZCZĄ. Повелительное, безличное BŁYSZCZANO и отглагольное существительное не употребляются и в карточку не включены. Прилагательное BŁYSZCZĄCY — «блестящий»." }
  - { kind: government, text: "От чего — OD или Z с родительным: BŁYSZCZEĆ OD CZYSTOŚCI, Z RADOŚCI. Чем — творительный: BŁYSZCZEĆ TALENTEM, DOWCIPEM. Где — NA с предложным: NA SCENIE." }
  - { kind: pronunciation, text: "Читается «буы́шчэць»: BŁ — «бу», SZCZ — «шч», ударение на первом слоге. BŁYSZCZY — «буы́шчы»." }
  - { kind: register, text: "Нейтральное слово. В переносном смысле о людях — книжно-похвальное: BŁYSZCZAŁ W TOWARZYSTWIE «он блистал в обществе». Пословица: NIE WSZYSTKO ZŁOTO, CO SIĘ ŚWIECI." }
collocations:
  - { pl: "błyszczeć od czystości", ru: "блестеть от чистоты" }
  - { pl: "oczy błyszczą", ru: "глаза блестят" }
  - { pl: "błyszczeć na scenie", ru: "блистать на сцене" }
family:
  - { pl: "blask", ru: "блеск, сияние", relation: root, id: blask }
  - { pl: "błyszczący", ru: "блестящий", relation: derived }
  - { pl: "świecić", ru: "светить, сиять", relation: root, id: swiecic }
etymology: "От BŁYSK «вспышка», праславянское *blьskъ, как русское «блеск», «блистать». Польское ŁY на месте русского ЛЕ — обычное соответствие."
memory: "Błyszczeć — блестеть, блистать: podłoga błyszczy, ona błyszczy na scenie. Корень błysk — «блеск»."
idioms:
  - { pl: "nie wszystko złoto, co się świeci", ru: "не всё то золото, что блестит" }
