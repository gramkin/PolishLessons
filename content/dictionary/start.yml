# review
id: start
format: 2
lemma: "start"
rank: 1871
pos: noun
pron: { cyr: "старт" }
senses:
  - id: start
    ru: "старт, запуск"
    examples:
      - pl: "Start!"
        ru: "Старт!"
        source: { kind: translated, id: 12211771 }
      - pl: "Na miejsca, gotowi, start!"
        ru: "На старт, внимание, марш!"
        source: { kind: translated, id: 818765 }
      - pl: "Start rakiety odbył się zgodnie z planem."
        ru: "Старт ракеты прошёл по плану."
        source: { kind: translated, id: 754219 }
  - id: takeoff
    ru: "взлёт, начало (самолёта, жизни)"
    examples:
      - pl: "Jestem gotów do startu."
        ru: "Я готов к старту."
        source: { kind: translated, id: 359351 }
      - pl: "Proszę zapiąć pasy i przygotować się do startu."
        ru: "Пристегните ремни и приготовьтесь к взлёту."
        source: { kind: translated, id: 713503 }
      - pl: "Zdenerwowanie w momencie startu samolotu to rzecz normalna."
        ru: "Волнение в момент взлёта самолёта — дело обычное."
        source: { kind: translated, id: 410015 }
notes:
  - { kind: usage, text: "Na miejsca, gotowi, start! — «На старт, внимание, марш!», стандартная команда." }
  - { kind: government, text: "К старту — do startu (родительный падеж): gotów do startu «готов к старту»." }
  - { kind: usage, text: "О самолёте слово значит «взлёт»: start samolotu «взлёт самолёта», противоположность — lądowanie «посадка»." }
  - { kind: false-friend, text: "Форма starty в таблице ниже принадлежит не этому слову, а причастию «стёртый» от zetrzeć; а starcie чаще значит «схватка»." }
collocations:
  - { pl: "gotowi, start", ru: "внимание, марш" }
  - { pl: "do startu", ru: "к старту" }
  - { pl: "start samolotu", ru: "взлёт самолёта" }
family:
  - { pl: "startować", ru: "стартовать", relation: root }
  - { pl: "początek", ru: "начало", relation: root, id: poczatek }
  - { pl: "zacząć", ru: "начать", relation: root, id: zaczac }
etymology: "Из английского start через немецкий; русское «старт» пришло тем же путём."
memory: "start — «старт» и «взлёт»: gotów do startu, start samolotu. Осторожно: starty бывает причастием «стёртый», а starcie значит «схватка»."
idioms:
  - { pl: "na miejsca, gotowi, start", ru: "на старт, внимание, марш" }
  - { pl: "do startu", ru: "к старту" }
  - { pl: "start samolotu", ru: "взлёт самолёта" }
