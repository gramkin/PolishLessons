# review
id: widoczny
format: 2
lemma: "widoczny"
rank: 4713
pos: adj
pron: { cyr: "видо́чны" }
senses:
  - id: visible
    ru: "видимый, видный, заметный"
    examples:
      - pl: "Z okna widoczny jest zamek."
        ru: "Из окна виден замок."
        source: { kind: authored }
      - pl: "Ślad był ledwo widoczny."
        ru: "След был едва заметен."
        source: { kind: authored }
      - pl: "Najwidoczniejszy znak stoi przy wjeździe."
        ru: "Самый заметный знак стоит при въезде."
        source: { kind: authored }
  - id: evident
    ru: "явный, очевидный"
    examples:
      - pl: "Widoczna poprawa nastąpiła po tygodniu."
        ru: "Явное улучшение наступило через неделю."
        source: { kind: authored }
      - pl: "Jego zmęczenie było widoczne dla wszystkich."
        ru: "Его усталость была видна всем."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Русскому «видный» и «видимый» по-польски соответствует WIDOCZNY. Но польское слово не значит «видный» в смысле «важный, представительный»: видный учёный — WYBITNY NAUKOWIEC. А наречие WIDOCZNIE двузначно: «заметно» и «по-видимому»: WIDOCZNIE ZAPOMNIAŁ, «он, видимо, забыл»." }
  - { kind: usage, text: "Полная парадигма: WIDOCZNY, WIDOCZNIEJSZY, NAJWIDOCZNIEJSZY. Сравнительная степень часто: CORAZ WIDOCZNIEJSZY, «всё заметнее». Мужское-личное: WIDOCZNI, WIDOCZNIEJSI, NAJWIDOCZNIEJSI — о людях на виду." }
  - { kind: government, text: "Видный откуда-то — WIDOCZNY Z + родительный: WIDOCZNY Z DALEKA. Видный кому-то — WIDOCZNY DLA KOGOŚ. Без связки часто стоит в начале: WIDOCZNY JEST ZAMEK, «виден замок»." }
  - { kind: pronunciation, text: "Читается «видо́чны», три слога, ударение на предпоследнем. WI — мягкое «ви», CZ — «ч». В WIDOCZNIEJSZY: «видочне́йшы»." }
  - { kind: register, text: "Нейтральное слово. В технике и рекламе — на каждом шагу: WIDOCZNY Z DALEKA, DOBRZE WIDOCZNY. В медицине WIDOCZNA POPRAWA — «видимое улучшение»." }
collocations:
  - { pl: "widoczny z daleka", ru: "видный издалека" }
  - { pl: "ledwo widoczny", ru: "едва заметный" }
  - { pl: "widoczna poprawa", ru: "явное улучшение" }
family:
  - { pl: "widać", ru: "видно", relation: root, id: widac }
  - { pl: "widocznie", ru: "видимо; заметно", relation: derived, id: widocznie }
  - { pl: "niewidoczny", ru: "невидимый", relation: derived }
etymology: "От WIDOK «вид», от WIDZIEĆ «видеть», общеславянского корня *vid-, того же, что в русском «вид», «видеть», «видный». K в WIDOK перед суффиксом -NY превращается в CZ: WIDOK — WIDOCZNY, как ROK — ROCZNY."
memory: "Widoczny — видимый, заметный: widoczny z daleka, ledwo widoczny. Widocznie — видимо; заметно. Видный учёный — wybitny. Читается «видо́чны»."
idioms:
  - { pl: "widoczny gołym okiem", ru: "видный невооружённым глазом" }
