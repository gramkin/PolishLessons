formExamples:
  - form: "potrwa"
    pl: "Ile to potrwa?"
    ru: "Сколько это продлится?"
    source: { kind: translated, id: 508885 }
  - form: "potrwa"
    pl: "To nie potrwa długo."
    ru: "Это не продлится долго."
    source: { kind: translated, id: 612305 }
  - form: "potrwa"
    pl: "Wycieczka potrwa co najmniej osiem godzin."
    ru: "Экскурсия продлится не менее восьми часов."
    source: { kind: tatoeba, id: 351530 }
  - form: "potrwać"
    pl: "Może to potrwać dłużej, niż się spodziewaliśmy."
    ru: "Это может продлиться дольше, чем мы ожидали."
    source: { kind: translated, id: 12296011 }
  - form: "potrwać"
    pl: "Choćby miało to potrwać trzy lata, musisz osiągnąć swój cel."
    ru: "Пусть даже это займёт три года, ты должен достичь своей цели."
    source: { kind: translated, id: 361657 }
  - form: "potrwać"
    pl: "To może potrwać kilka dni."
    ru: "Это может занять несколько дней."
    source: { kind: authored }
  - form: "potrwają"
    pl: "Rozmowy potrwają kilka dni."
    ru: "Переговоры продлятся несколько дней."
    source: { kind: authored }
  - form: "potrwają"
    pl: "Prace potrwają do jesieni."
    ru: "Работы продлятся до осени."
    source: { kind: authored }
  - form: "potrwają"
    pl: "Zmiany potrwają dłużej, niż obiecywano."
    ru: "Перемены затянутся дольше обещанного."
    source: { kind: authored }
  - form: "potrwał"
    pl: "Koncert potrwał dwie godziny."
    ru: "Концерт продлился два часа."
    source: { kind: authored }
  - form: "potrwał"
    pl: "Remont potrwał całe lato."
    ru: "Ремонт продлился всё лето."
    source: { kind: authored }
  - form: "potrwał"
    pl: "Film potrwał krócej, niż myślałem."
    ru: "Фильм оказался короче, чем я думал."
    source: { kind: authored }
  - form: "potrwała"
    pl: "Podróż potrwała tydzień."
    ru: "Поездка продлилась неделю."
    source: { kind: authored }
  - form: "potrwała"
    pl: "Cisza potrwała chwilę."
    ru: "Тишина продлилась мгновение."
    source: { kind: authored }
  - form: "potrwała"
    pl: "Rozmowa potrwała do wieczora."
    ru: "Разговор продлился до вечера."
    source: { kind: authored }
  - form: "potrwałaby"
    pl: "Naprawa potrwałaby tydzień, gdyby były części."
    ru: "Ремонт длился бы неделю, если бы были детали."
    source: { kind: authored }
  - form: "potrwałaby"
    pl: "Rozprawa potrwałaby do wieczora."
    ru: "Заседание длилось бы до вечера."
    source: { kind: authored }
  - form: "potrwałaby"
    pl: "Bez przerw podróż potrwałaby dobę."
    ru: "Без перерывов поездка длилась бы сутки."
    source: { kind: authored }
  - form: "potrwałby"
    pl: "Remont potrwałby rok, gdyby nie brak pieniędzy."
    ru: "Ремонт длился бы год, если бы не нехватка денег."
    source: { kind: authored }
  - form: "potrwałby"
    pl: "Proces potrwałby jeszcze dwa lata."
    ru: "Процесс длился бы ещё два года."
    source: { kind: authored }
  - form: "potrwałby"
    pl: "Bez opóźnień lot potrwałby trzy godziny."
    ru: "Без задержек полёт длился бы три часа."
    source: { kind: authored }
  - form: "potrwało"
    pl: "Dużo czasu potrwało, zanim zrozumiał, o co jej chodzi."
    ru: "Прошло много времени, прежде чем он понял, о чём она."
    source: { kind: translated, id: 977277 }
  - form: "potrwało"
    pl: "Potrwało kilka tygodni, póki nie otrząsnął się z szoku."
