# review
id: potrwac
format: 2
lemma: "potrwać"
rank: 1610
pos: verb
aspect: perf
aspectPair: trwac
pron: { cyr: "по́трваць" }
senses:
  - id: last
    ru: "продлиться, занять время"
    examples:
      - pl: "Ile to potrwa?"
        ru: "Сколько это продлится?"
        source: { kind: translated, id: 508885 }
      - pl: "To nie potrwa długo."
        ru: "Это не продлится долго."
        source: { kind: translated, id: 612305 }
      - pl: "Wycieczka potrwa co najmniej osiem godzin."
        ru: "Экскурсия продлится не менее восьми часов."
        source: { kind: tatoeba, id: 351530 }
  - id: take-long
    ru: "занять (о времени, долго)"
    examples:
      - pl: "Może to potrwać dłużej, niż się spodziewaliśmy."
        ru: "Это может продлиться дольше, чем мы ожидали."
        source: { kind: translated, id: 12296011 }
      - pl: "Dużo czasu potrwało, zanim zrozumiał, o co jej chodzi."
        ru: "Прошло много времени, прежде чем он понял, о чём она."
        source: { kind: translated, id: 977277 }
      - pl: "Potrwało kilka tygodni, póki nie otrząsnął się z szoku."
        ru: "Прошло несколько недель, пока он не оправился от шока."
        source: { kind: translated, id: 730590 }
notes:
  - { kind: usage, text: "Совершенный вид от trwać «длиться»: trwa «длится» (процесс), potrwa «продлится» (с указанием срока)." }
  - { kind: usage, text: "Самый частый вопрос — Jak długo to potrwa? «Как долго это продлится?» и Ile to potrwa? «Сколько это займёт?»." }
  - { kind: usage, text: "Глагол безличный по употреблению: подлежащее — это само действие или событие, а не человек." }
  - { kind: usage, text: "В прошедшем времени обычно средний род: potrwało «продлилось»." }
collocations:
  - { pl: "jak długo to potrwa", ru: "как долго это продлится" }
  - { pl: "nie potrwa długo", ru: "это ненадолго" }
  - { pl: "może potrwać", ru: "может занять" }
etymology: "Приставка po- + trwać «длиться», от праславянского *trъvati. Русское «продлиться» построено иначе (про- + «длить»), но совершенный вид образован тем же способом — приставкой."
memory: "potrwać = «продлиться, занять время», совершенный вид от trwać. Держите в голове два вопроса: Jak długo to potrwa? «Как долго это продлится?» и Ile to potrwa? «Сколько это займёт?»."
idioms:
  - { pl: "jak długo to potrwa", ru: "как долго это продлится" }
  - { pl: "nie potrwa długo", ru: "это ненадолго" }
  - { pl: "może potrwać lata", ru: "может занять годы" }
