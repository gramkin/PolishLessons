# review
id: emocje
format: 2
lemma: "emocje"
rank: 1946
pos: noun
pron: { cyr: "эмо́цйе" }
senses:
  - id: emotions
    ru: "эмоции, чувства"
    examples:
      - pl: "Trudno ukryć takie emocje."
        ru: "Такие эмоции трудно скрыть."
        source: { kind: authored }
      - pl: "Mecz dostarczył wielu emocji."
        ru: "Матч доставил много эмоций."
        source: { kind: authored }
      - pl: "Staraj się opanować emocje."
        ru: "Старайся обуздать эмоции."
        source: { kind: authored }
      - pl: "To była decyzja podjęta pod wpływem emocji."
        ru: "Это было решение, принятое под влиянием эмоций."
        source: { kind: authored }
      - pl: "Dzieci uczą się nazywać emocje."
        ru: "Дети учатся называть эмоции."
        source: { kind: authored }
notes:
  - { kind: usage, text: "В словаре это слово стоит во МНОЖЕСТВЕННОМ числе, и так оно и употребляется чаще всего: emocje, emocji, emocjom, emocjami, emocjach. Единственное число emocja существует и склоняется обычно, но в живой речи встречается заметно реже — как и русское «эмоции» против «эмоция»." }
  - { kind: government, text: "Запомните управление устойчивых оборотов: panować NAD emocjami «владеть собой» требует творительного с предлогом nad, а pod wpływem emocji «под влиянием эмоций» — родительного. Русские соответствия строятся теми же предлогами." }
  - { kind: false-friend, text: "Ловушки нет: польское emocje и русское «эмоции» — одно и то же латинское заимствование, пришедшее в оба языка через западноевропейские. Совпадает и значение, и число, в котором слово обычно живёт." }
collocations:
  - { pl: "silne emocje", ru: "сильные эмоции" }
  - { pl: "panować nad emocjami", ru: "владеть своими эмоциями" }
  - { pl: "bez emocji", ru: "без эмоций" }
family:
  - { pl: "emocja", ru: "эмоция", relation: root }
  - { pl: "emocjonalny", ru: "эмоциональный", relation: derived }
etymology: "Латинское emotio «движение души», от emovere «выводить из равновесия» (e- «из» + movere «двигать»). В польский пришло через западноевропейские языки, в русский — тем же путём, поэтому emocje и «эмоции» совпадают почти буква в букву. Из того же корня emocjonalny «эмоциональный»."
memory: "emocje — «эмоции», и слово живёт во множественном числе в обоих языках. Главное — предлоги: panować NAD emocjami, pod wpływem emocji."
idioms:
  - { pl: "panować nad emocjami", ru: "владеть своими эмоциями" }
  - { pl: "pod wpływem emocji", ru: "под влиянием эмоций" }
