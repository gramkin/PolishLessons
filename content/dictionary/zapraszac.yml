# review
id: zapraszac
format: 2
lemma: "zapraszać"
rank: 1682
pos: verb
aspect: imperf
aspectPair: zaprosic
pron: { cyr: "запра́шаць" }
senses:
  - id: invite
    ru: "приглашать (в гости, к себе)"
    examples:
      - pl: "Zapraszam cię."
        ru: "Я тебя приглашаю."
        source: { kind: translated, id: 5025715 }
      - pl: "Tom nie chciał zapraszać Mary."
        ru: "Том не хотел приглашать Мэри."
        source: { kind: translated, id: 10040303 }
      - pl: "Nie zapraszaj go, nie przyjdzie przecież."
        ru: "Не приглашай его, он всё равно не придёт."
        source: { kind: translated, id: 2233988 }
  - id: invite-offer
    ru: "приглашать, предлагать (воспользоваться чем-либо)"
    examples:
      - pl: "Zapraszamy do zadawania pytań."
        ru: "Приглашаем задавать вопросы."
        source: { kind: translated, id: 11573332 }
      - pl: "Zapraszamy, proszę wejść."
        ru: "Проходите, пожалуйста."
        source: { kind: translated, id: 742548 }
      - pl: "Zapraszamy też dzieci do wzięcia udziału."
        ru: "Приглашаем и детей принять участие."
        source: { kind: translated, id: 13782774 }
notes:
  - { kind: usage, text: "Пара по виду: zapraszać (несовершенный) — zaprosić (совершенный). Zapraszam cię na kawę «приглашаю тебя на кофе»." }
  - { kind: government, text: "zapraszać kogoś (винительный) na coś (винительный) или do czegoś (родительный): zapraszam cię na obiad, zapraszam do stołu." }
  - { kind: usage, text: "Zapraszam! и Zapraszamy! сами по себе — формула «Прошу! Проходите! Добро пожаловать!», без дополнения." }
  - { kind: false-friend, text: "Ja zapraszam в ресторане значит не «я приглашаю», а «я плачу, я угощаю»." }
collocations:
  - { pl: "zapraszać na kawę", ru: "приглашать на кофе" }
  - { pl: "zapraszać do stołu", ru: "приглашать к столу" }
  - { pl: "zapraszamy ponownie", ru: "приходите ещё" }
family:
  - { pl: "zaprosić", ru: "пригласить", relation: aspect, id: zaprosic }
  - { pl: "zaproszenie", ru: "приглашение", relation: root }
  - { pl: "prosić", ru: "просить", relation: root }
etymology: "Приставка za- + prosić «просить»: буквально «запросить к себе». Русское «пригласить» построено от «глас, голос» — другой образ, тот же смысл."
memory: "zapraszać — «приглашать», совершенный вид zaprosić. Само по себе Zapraszam! значит «Прошу, проходите!», а в ресторане Ja zapraszam — «Я угощаю»."
idioms:
  - { pl: "zapraszać do stołu", ru: "приглашать к столу" }
  - { pl: "ja zapraszam", ru: "я угощаю" }
  - { pl: "zapraszamy ponownie", ru: "приходите ещё" }
