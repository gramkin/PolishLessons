    ru: "Приглашать гостей стоит времени и денег."
    source: { kind: authored }
  - form: "zapraszaniem"
    pl: "Zajmuje się zapraszaniem gości."
    ru: "Он занимается приглашением гостей."
    source: { kind: authored }
  - form: "zapraszaniem"
    pl: "Między zapraszaniem a przyjmowaniem jest różnica."
    ru: "Между тем чтобы пригласить и принять, есть разница."
    source: { kind: authored }
  - form: "zapraszaniem"
    pl: "Zmęczył się zapraszaniem wszystkich naraz."
    ru: "Он устал приглашать всех сразу."
    source: { kind: authored }
  - form: "zapraszaniu"
    pl: "W zapraszaniu gości liczy się wyczucie."
    ru: "В приглашении гостей важен такт."
    source: { kind: authored }
  - form: "zapraszaniu"
    pl: "Po zapraszaniu przyszła pora na sprzątanie."
    ru: "После приглашений пришло время уборки."
    source: { kind: authored }
  - form: "zapraszaniu"
    pl: "O zapraszaniu sąsiadów nikt nie pomyślał."
    ru: "О приглашении соседей никто не подумал."
    source: { kind: authored }
  - form: "zapraszano"
    pl: "Zapraszano nas na obiady."
    ru: "Нас приглашали на обеды."
    source: { kind: authored }
  - form: "zapraszano"
    pl: "Zapraszano do stołu bez ceremonii."
    ru: "К столу приглашали без церемоний."
    source: { kind: authored }
  - form: "zapraszano"
    pl: "Zapraszano gości z daleka."
    ru: "Гостей приглашали издалека."
    source: { kind: authored }
  - form: "zapraszany"
    pl: "Nieczęsto jestem zapraszany na imprezy."
    ru: "Меня нечасто приглашают на вечеринки."
    source: { kind: translated, id: 3589512 }
  - form: "zapraszany"
    pl: "Jest często zapraszany do telewizji."
    ru: "Его часто приглашают на телевидение."
    source: { kind: authored }
  - form: "zapraszany"
    pl: "Nie byłem zapraszany na takie spotkania."
    ru: "На такие встречи меня не приглашали."
    source: { kind: authored }
  - form: "zapraszanych"
    pl: "Nie ma tu stale zapraszanych gości."
    ru: "Постоянно приглашаемых гостей тут нет."
    source: { kind: authored }
  - form: "zapraszanych"
    pl: "Z zapraszanych ekspertów przyszła połowa."
    ru: "Из приглашаемых экспертов пришла половина."
    source: { kind: authored }
  - form: "zapraszanych"
    pl: "Lista zapraszanych osób jest długa."
    ru: "Список приглашаемых длинный."
    source: { kind: authored }
  - form: "zapraszanym"
    pl: "Podziękował regularnie zapraszanym gościom."
    ru: "Он поблагодарил регулярно приглашаемых гостей."
    source: { kind: authored }
  - form: "zapraszanym"
    pl: "W zapraszanym gronie panuje swoboda."
    ru: "В приглашаемом кругу царит непринуждённость."
    source: { kind: authored }
  - form: "zapraszanym"
    pl: "Chętnie zapraszanym ekspertom płacą honoraria."
    ru: "Охотно приглашаемым экспертам платят гонорары."
    source: { kind: authored }
  - form: "zapraszanymi"
    pl: "Opiekuje się zapraszanymi gośćmi."
