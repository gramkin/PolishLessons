# review
id: rozwazyc
format: 2
lemma: "rozważyć"
rank: 3424
pos: verb
aspect: perf
pron: { cyr: "розва́жыць" }
senses:
  - id: consider
    ru: "обдумать, взвесить (приняв решение)"
    examples:
      - pl: "Jego teorię warto rozważyć."
        ru: "Его теорию стоит рассмотреть."
        source: { kind: tatoeba, id: 12478535 }
      - pl: "Powinieneś to rozważyć."
        ru: "Тебе следует это обдумать."
        source: { kind: translated, id: 7886546 }
      - pl: "Warto rozważyć ten problem."
        ru: "Эту задачу стоит рассмотреть."
        source: { kind: translated, id: 720185 }
      - pl: "Rozważmy to jeszcze raz."
        ru: "Давайте обдумаем это ещё раз."
        source: { kind: translated, id: 6554098 }
  - id: examine
    ru: "рассмотреть (предложение, вопрос)"
    examples:
      - pl: "Ta oferta jest warta rozważenia."
        ru: "Это предложение стоит рассмотреть."
        source: { kind: translated, id: 3049241 }
      - pl: "Rozważmy konkretny przykład."
        ru: "Рассмотрим конкретный пример."
        source: { kind: translated, id: 7551412 }
      - pl: "Dobrze to rozważył i postanowił nie jechać."
        ru: "Он хорошо это обдумал и решил не ехать."
        source: { kind: translated, id: 827816 }
  - id: weigh-out
    ru: "развесить, разделить по весу (редкое, прямое значение)"
    examples:
      - pl: "Musi rozważyć mięso na trzy porcje."
        ru: "Ему нужно развесить мясо на три порции."
        source: { kind: authored }
      - pl: "Sprzedawca rozważył towar na porcje."
        ru: "Продавец развесил товар на порции."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Совершенный вид: результат обдумывания. Формы настоящего времени означают будущее — rozważę «обдумаю», rozważysz «обдумаешь». Несовершенный вид — rozważać." }
  - { kind: government, text: "Переходный: rozważyć co (винительный падеж) — rozważyć propozycję. Отглагольное существительное требует родительного: po rozważeniu sprawy «обдумав дело»." }
  - { kind: false-friend, text: "Не «разважить». Это roz- + ważyć «взвешивать»: буквальное значение «развесить по частям», переносное — «взвесить, обдумать», ровно как русское «взвесить все за и против»." }
  - { kind: usage, text: "Однокоренные: rozwaga «рассудительность», rozważny «рассудительный», rozważnie «обдуманно». Все они о взвешенности решения, а не о весе." }
collocations:
  - { pl: "rozważyć propozycję", ru: "рассмотреть предложение" }
  - { pl: "rozważyć możliwość", ru: "обдумать возможность" }
  - { pl: "warto rozważyć", ru: "стоит обдумать" }
  - { pl: "po rozważeniu", ru: "обдумав, по рассмотрении" }
family:
  - { pl: "rozważać", ru: "обдумывать, рассматривать", relation: aspect }
  - { pl: "ważyć", ru: "взвешивать", relation: root }
  - { pl: "rozwaga", ru: "рассудительность", relation: derived }
  - { pl: "rozważny", ru: "рассудительный", relation: derived }
  - { pl: "uwaga", ru: "внимание", relation: root, id: uwaga }
  - { pl: "poważny", ru: "серьёзный", relation: root, id: powazny }
etymology: "roz- + ważyć «взвешивать», от waga «вес» (заимствование из средневерхненемецкого wâge). Прямое значение — «развесить по частям», переносное — «обдумать»: тот же образ, что в русском «взвесить все за и против». Того же корня uwaga «внимание» и poważny «серьёзный»."
memory: "rozważyć — буквально «взвесить»: roz- + ważyć. Совершенный вид, несовершенный — rozważać; форма настоящего времени rozważę значит «обдумаю»."
idioms:
  - { pl: "rozważyć wszystkie za i przeciw", ru: "взвесить все за и против" }
  - { pl: "warto rozważyć", ru: "стоит обдумать" }
  - { pl: "wszystko rozważywszy", ru: "взвесив всё" }
formExamplesSkip:
  - { form: "rozważeni", reason: "мужско-личной страдательной формы у этого глагола не бывает: обдумывают предложение, возможность, вопрос — вещь или мысль, а не человека. Остальные формы причастия в карточке есть с примерами: propozycja rozważona przez komisję, wniosek rozważony na zebraniu" }
  - { form: "rozważywszy", reason: "книжное деепричастие прошедшего времени; в живой речи не употребляется. Ту же мысль польский передаёт оборотом с отглагольным существительным, который карточка приводит среди устойчивых сочетаний: po rozważeniu sprawy" }
