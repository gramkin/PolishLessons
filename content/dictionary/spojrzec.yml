# review
id: spojrzec
format: 2
lemma: "spojrzeć"
rank: 219
pos: verb
aspect: perf
pron: { cyr: "спу́йжець" }
senses:
  - id: look
    ru: "посмотреть, взглянуть"
    note: "Повелительное наклонение неправильное: spójrz! — с ó."
    examples:
      - pl: "Spójrz w dół."
        ru: "Посмотри вниз."
        source: { kind: tatoeba, id: 8745529 }
      - pl: "Spójrz na ten dym."
        ru: "Посмотри на тот дым."
        source: { kind: tatoeba, id: 348712 }
      - pl: "Spójrz na ten dom."
        ru: "Посмотри на этот дом."
        source: { kind: tatoeba, id: 827404 }
  - id: glance
    ru: "spojrzenie — взгляд"
    examples:
      - pl: "Rzuciła mu wyzywające spojrzenie."
        ru: "Она бросила на него вызывающий взгляд."
        source: { kind: tatoeba, id: 12470177 }
      - pl: "Rzucił mi szybkie spojrzenie."
        ru: "Он бросил на меня быстрый взгляд."
        source: { kind: authored }
      - pl: "Wystarczyło jedno spojrzenie."
        ru: "Хватило одного взгляда."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Повелительное наклонение пишется через ó: Spójrz! «Посмотри!», Spójrzcie! «Посмотрите!», Spójrzmy «Посмотрим». Формы с o (spojrzyj) книжные и редкие." }
  - { kind: usage, text: "Управление: spojrzeć na coś «посмотреть на что-то», spojrzeć w oczy «посмотреть в глаза», spojrzeć w górę / w dół «посмотреть вверх / вниз»." }
  - { kind: usage, text: "Несовершенный вид — patrzeć «смотреть» или spoglądać «поглядывать»." }
  - { kind: usage, text: "Существительное spojrzenie значит «взгляд»: jednym spojrzeniem «одним взглядом»." }
collocations:
  - { pl: "spójrz na mnie", ru: "посмотри на меня" }
  - { pl: "spojrzeć w oczy", ru: "посмотреть в глаза" }
  - { pl: "rzucić spojrzenie", ru: "бросить взгляд" }
  - { pl: "spojrzeć w górę", ru: "посмотреть вверх" }
etymology: "Из s- + pojrzeć, где корень -jrz- (старое zrzeć «зреть»); ср. русские «зреть», «взор», «взгляд»."
memory: "Повелительное наклонение пишется через ó: Spójrz! «Посмотри!», Spójrzcie! А существительное spojrzenie значит «взгляд». Корень -jrz- родня русскому «зреть», «взор»."
idioms:
  - { pl: "spojrzeć prawdzie w oczy", ru: "посмотреть правде в глаза" }
  - { pl: "bać się spojrzeć w oczy", ru: "бояться посмотреть в глаза" }
  - { pl: "jednym spojrzeniem", ru: "одним взглядом" }
