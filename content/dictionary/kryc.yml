# review
id: kryc
format: 2
lemma: "kryć"
rank: 2374
pos: verb
aspect: imperf
pron: { cyr: "крыць" }
senses:
  - id: conceal
    ru: "скрывать, прятать"
    examples:
      - pl: "Nie kryje, że jest gejem."
        ru: "Он не скрывает, что он гей."
        source: { kind: translated, id: 2707326 }
      - pl: "Ona nie kryje wobec mnie wrogości."
        ru: "Она не скрывает от меня враждебности."
        source: { kind: translated, id: 438405 }
      - pl: "Kiedy wybuchł skandal, popierający go posłowie nie kryli wściekłości."
        ru: "Когда разразился скандал, поддерживавшие его депутаты не скрывали ярости."
        source: { kind: translated, id: 716874 }
  - id: lie-hidden
    ru: "крыться, таиться (kryć się)"
    examples:
      - pl: "W jego słowach kryje się jakaś zagadka."
        ru: "В его словах кроется какая-то загадка."
        source: { kind: tatoeba, id: 448856 }
      - pl: "Nie zauważył, że za tą pochwałą kryła się ironia."
        ru: "Он не заметил, что за этой похвалой крылась ирония."
        source: { kind: translated, id: 914709 }
notes:
  - { kind: government, text: "Винительный падеж: kryć prawdę. С się значит «крыться, прятаться»: co się za tym kryje «что за этим кроется» — оборот совпадает с русским." }
  - { kind: false-friend, text: "Прямая родня русскому «крыть», «скрывать», «крыша». Значения совпадают почти полностью." }
  - { kind: usage, text: "Военное Kryć się! «В укрытие!» и Kryj mnie! «Прикрой меня!» — устойчивые команды." }
  - { kind: usage, text: "Причастие kryty значит «крытый»: kryty basen «крытый бассейн». Совершенный вид — ukryć." }
collocations:
  - { pl: "kryć się za czymś", ru: "крыться за чем-л." }
  - { pl: "kryty basen", ru: "крытый бассейн" }
etymology: "Праславянское *kryti; прямая родня русским «крыть», «скрывать», «крыша»."
memory: "kryć — «скрывать», а kryć się — «крыться»: co się za tym kryje совпадает с русским «что за этим кроется». Команды: Kryj mnie! «Прикрой меня!», Kryć się! «В укрытие!»"
idioms:
  - { pl: "kryć się za czymś", ru: "крыться за чем-л." }
  - { pl: "kryty basen", ru: "крытый бассейн" }
