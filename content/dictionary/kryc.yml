formExamples:
  - form: "kryć"
    pl: "Kryć się!"
    ru: "В укрытие!"
    source: { kind: translated, id: 5652093 }
  - form: "kryć"
    pl: "Nie zdawałem sobie sprawy, jak wiele kunsztu może kryć się w kanapce."
    ru: "Я не представлял, сколько мастерства может крыться в бутерброде."
    source: { kind: translated, id: 12040951 }
  - form: "kryć"
    pl: "Nie ma czego kryć."
    ru: "Скрывать нечего."
    source: { kind: authored }
  - form: "kryj"
    pl: "Kryj mnie."
    ru: "Прикрой меня."
    source: { kind: translated, id: 10597453 }
  - form: "kryj"
    pl: "Nie kryj prawdy."
    ru: "Не скрывай правду."
    source: { kind: authored }
  - form: "kryj"
    pl: "Kryj się za murem."
    ru: "Прячься за стеной."
    source: { kind: authored }
  - form: "kryją"
    pl: "Piramidy wciąż kryją wiele tajemnic."
    ru: "Пирамиды до сих пор скрывают много тайн."
    source: { kind: translated, id: 8756129 }
  - form: "kryją"
    pl: "Ciemność i cisza nocy kryją w sobie najskrytsze myśli."
    ru: "Тьма и тишина ночи скрывают самые тайные мысли."
    source: { kind: translated, id: 8756135 }
  - form: "kryją"
    pl: "Chmury kryją szczyt góry."
    ru: "Облака скрывают вершину горы."
    source: { kind: authored }
  - form: "kryje"
    pl: "W jego słowach kryje się jakaś zagadka."
    ru: "В его словах кроется какая-то загадка."
    source: { kind: tatoeba, id: 448856 }
  - form: "kryje"
    pl: "Nie kryje, że jest gejem."
    ru: "Он не скрывает, что он гей."
    source: { kind: translated, id: 2707326 }
  - form: "kryje"
    pl: "Słońce kryje się za zachodnim horyzontem."
    ru: "Солнце скрывается за западным горизонтом."
    source: { kind: translated, id: 367639 }
  - form: "kryli"
    pl: "Kiedy wybuchł skandal, popierający go posłowie nie kryli wściekłości."
    ru: "Когда разразился скандал, поддерживавшие его депутаты не скрывали ярости."
    source: { kind: translated, id: 716874 }
  - form: "kryli"
    pl: "Nie kryli zdziwienia."
    ru: "Они не скрывали удивления."
    source: { kind: authored }
  - form: "kryli"
    pl: "Kryli się w piwnicy."
    ru: "Они прятались в подвале."
    source: { kind: authored }
  - form: "kryła"
    pl: "Nie zauważył, że za tą pochwałą kryła się ironia."
    ru: "Он не заметил, что за этой похвалой крылась ирония."
    source: { kind: translated, id: 914709 }
  - form: "kryła"
    pl: "Kryła twarz w dłoniach."
    ru: "Она прятала лицо в ладонях."
    source: { kind: authored }
  - form: "kryła"
    pl: "Mgła kryła całą dolinę."
    ru: "Туман скрывал всю долину."
    source: { kind: authored }
  - form: "kryło"
    pl: "W jej oczach kryło się współczucie."
    ru: "В её глазах таилось сочувствие."
    source: { kind: translated, id: 440616 }
  - form: "kryło"
    pl: "Coś się za tym kryło."
    ru: "Что-то за этим крылось."
    source: { kind: authored }
  - form: "kryło"
    pl: "Niebo kryło się za chmurami."
    ru: "Небо скрывалось за облаками."
    source: { kind: authored }
  - form: "kryty"
    pl: "Czy w tym mieście jest kryty basen?"
    ru: "В этом городе есть крытый бассейн?"
    source: { kind: translated, id: 1351006 }
  - form: "kryty"
    pl: "To kryty dziedziniec."
    ru: "Это крытый двор."
    source: { kind: authored }
  - form: "kryty"
    pl: "Wóz był kryty płótnem."
    ru: "Повозка была крыта холстом."
    source: { kind: authored }
