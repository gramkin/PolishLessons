# review
id: podszyc
format: 2
lemma: "podszyć"
rank: 2574
pos: verb
pron: { cyr: "по́тшыць" }
senses:
  - id: line-garment
    ru: "подшить, подбить (подкладкой, мехом)"
    examples:
      - pl: "Trzeba podszyć te spodnie."
        ru: "Надо подшить эти брюки."
        source: { kind: authored }
      - pl: "Krawiec podszył płaszcz jedwabiem."
        ru: "Портной подшил пальто шёлком."
        source: { kind: authored }
  - id: hem
    ru: "подшить, укоротить (подол, рукава)"
    examples:
      - pl: "Podszyj spodnie, są za długie."
        ru: "Подшей брюки, они слишком длинные."
        source: { kind: authored }
      - pl: "Podszyłam sukienkę o dwa centymetry."
        ru: "Я подшила платье на два сантиметра."
        source: { kind: authored }
  - id: pervaded-by
    ru: "перен. быть пронизанным чем-л. (о причастии podszyty)"
    examples:
      - pl: "Jego spokój był podszyty strachem."
        ru: "Его спокойствие было пронизано страхом."
        source: { kind: authored }
      - pl: "Jej uprzejmość była podszyta ironią."
        ru: "Её вежливость была пронизана иронией."
        source: { kind: authored }
notes:
  - { kind: government, text: "podszyć coś czymś: предмет — в ВИНИТЕЛЬНОМ падеже, материал — в ТВОРИТЕЛЬНОМ. Podszyć płaszcz futrem «подшить пальто мехом». Русская конструкция совпадает полностью." }
  - { kind: government, text: "Мужсколичное причастие podszyci живёт за счёт переносного значения: podszyci strachem «пронизанные страхом», podszyci niepokojem. Подшить человека нельзя, но «пронизанным чувством» он быть может, и этого достаточно, чтобы форма работала." }
  - { kind: usage, text: "Совершенный вид; несовершенный — podszywać. Отдельно запомните возвратное podszywać się pod kogoś «выдавать себя за кого-л.» — значение совсем другое, хотя глагол тот же." }
  - { kind: false-friend, text: "Корень szyć — прямой родственник русского «шить», и podszyć отвечает русскому «подшить» буквально, приставка в приставку. Но существительное podszycie значит не только «подшивка»: podszycie leśne — это лесной подлесок." }
collocations:
  - { pl: "podszyć płaszcz futrem", ru: "подшить пальто мехом" }
  - { pl: "podszyty strachem", ru: "пронизанный страхом" }
  - { pl: "podszewka płaszcza", ru: "подкладка пальто" }
family:
  - { pl: "podszywać", ru: "подшивать", relation: aspect }
  - { pl: "szyć", ru: "шить", relation: root }
  - { pl: "podszewka", ru: "подкладка", relation: derived }
etymology: "Приставка pod- и глагол szyć, от праславянского *šiti. Русское «шить» — прямой родственник, а «подшить» построено из тех же двух частей, что и польское podszyć. Отсюда же podszewka «подкладка» — то, что подшито изнутри; переносное podszyty strachem «подбитый страхом» родилось из той же картины: страх как подкладка под внешним спокойствием."
memory: "podszyć coś czymś — подшить что-л. чем-л., винительный плюс творительный, как по-русски. Образ подкладки даёт и переносное podszyty strachem «пронизанный страхом»: страх подшит изнутри, как подкладка."
idioms:
  - { pl: "podszyty strachem", ru: "пронизанный страхом, трусоватый" }
  - { pl: "podszywać się pod kogoś", ru: "выдавать себя за кого-л." }
