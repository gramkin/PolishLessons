  - id: meal
    ru: "стол (еда, угощение); накрывать на стол"
    examples:
      - pl: "Po kolacji posprzątała ze stołu."
        ru: "После обеда она убрала со стола."
        source: { kind: tatoeba, id: 440564 }
      - pl: "Nakryj do stołu, proszę."
        ru: "Накрой на стол, пожалуйста."
        source: { kind: authored }
      - pl: "Zaprosili nas do stołu."
        ru: "Нас пригласили к столу."
        source: { kind: authored }
  - id: figurative
    ru: "стол переговоров; «на столе» о вопросе"
    examples:
      - pl: "Usiedli do stołu rokowań."
        ru: "Они сели за стол переговоров."
        source: { kind: authored }
      - pl: "Sprawa wróciła na stół."
        ru: "Вопрос снова на столе."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Чередование ó/o: именительный stół с ó, а во всех остальных падежах o — stołu, stole, stołem, stoły. Это регулярное польское чередование в закрытом слоге." }
  - { kind: government, text: "Предлоги другие, чем в русском: nakryć do stołu «накрыть на стол», siąść do stołu «сесть за стол» — предлог do с родительным. А «за столом» — przy stole, предложный." }
  - { kind: usage, text: "Уменьшительное stolik значит «столик», в том числе ресторанный: Zarezerwowałem stolik «Я забронировал столик»." }
  - { kind: usage, text: "okrągły stół «круглый стол» — и мебель, и переговоры, ровно как в русском." }
collocations:
  - { pl: "nakryć do stołu", ru: "накрыть на стол" }
  - { pl: "przy stole", ru: "за столом" }
  - { pl: "pod stołem", ru: "под столом" }
  - { pl: "okrągły stół", ru: "круглый стол" }
family:
  - { pl: "stolik", ru: "столик", relation: derived }
  - { pl: "stołowy", ru: "столовый", relation: derived }
  - { pl: "stolarz", ru: "столяр", relation: derived }
etymology: "Праславянское *stolъ, первоначально «то, что постелено», от *stьlati «стелить». Русское «стол» — то же слово; в русском от него осталось ещё и «престол»."
memory: "stół — «стол», но следите за чередованием: stół с ó, а дальше везде o — stołu, stole, stołem. И предлоги другие: nakryć do stołu «накрыть на стол», siąść do stołu «сесть за стол», но przy stole «за столом»."
idioms:
  - { pl: "nakryć do stołu", ru: "накрыть на стол" }
  - { pl: "okrągły stół", ru: "круглый стол" }
  - { pl: "pod stołem", ru: "под столом" }
