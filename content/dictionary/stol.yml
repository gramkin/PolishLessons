# review
id: stol
format: 2
lemma: "stół"
rank: 1074
pos: noun
pron: { cyr: "стуу" }
senses:
  - id: furniture
    ru: "стол (мебель)"
    examples:
      - pl: "To jest stół."
        ru: "Это стол."
        source: { kind: tatoeba, id: 356394 }
      - pl: "Na stole był kot."
        ru: "На столе был кот."
