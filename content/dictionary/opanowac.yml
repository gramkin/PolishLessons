notes:
  - { kind: government, text: "Главное расхождение с русским — падеж. Польское OPANOWAĆ берёт ВИНИТЕЛЬНЫЙ: OPANOWAĆ JĘZYK, PROGRAM, MIASTO, GNIEW. Русское «овладеть» требует творительного: «овладеть языком», «овладеть городом». Поэтому OPANOWAŁ POLSKI — это «овладел польским», хотя по форме выглядит как «овладел польский». Ошибку эту делают постоянно и в обе стороны. Возвратное OPANOWAĆ SIĘ — «совладать с собой», и оно идёт без дополнения вовсе." }
  - { kind: false-friend, text: "Корень тут — PAN, то самое слово, которым поляки обращаются друг к другу: PAN значит «господин», и это обиходная вежливая форма, а не историзм, как русское «пан». От него PANOWAĆ «царствовать, господствовать», а с приставкой o- — OPANOWAĆ, буквально «взять под свою власть». Русское «овладеть» построено ровно так же, от «власть», так что мысль одна и та же, только корни разные: польский пошёл от «господина», русский от «власти»." }
  - { kind: usage, text: "Три значения различаются дополнением и все частотны. Навык: OPANOWAĆ JĘZYK, OPANOWAĆ RZEMIOSŁO — это язык объявлений и резюме. Положение: OPANOWAĆ POŻAR, OPANOWAĆ SYTUACJĘ, где по-русски скорее «справиться с» или «взять под контроль». И себя: OPANOWAĆ SIĘ, OPANOWAĆ GNIEW. Прилагательное OPANOWANY значит «сдержанный, владеющий собой» — это похвала, а не упрёк: ON JEST BARDZO OPANOWANY." }
  - { kind: pronunciation, text: "Глагол класса на -OWAĆ, и настоящее время у него на -UJ-, как разбиралось в карточке SPAKOWAĆ: OPANOWAĆ даёт OPANUJĘ, OPANUJESZ, OPANUJE, OPANUJĄ. Повелительное OPANUJ от той же основы, и возвратное OPANUJ SIĘ — готовая фраза. Русскому правило знакомо: «-овать» даёт «-ую», и тут оно работает буква в букву." }
collocations:
  - { pl: "opanować język", ru: "овладеть языком" }
  - { pl: "opanować się", ru: "совладать с собой" }
  - { pl: "opanować pożar", ru: "справиться с пожаром" }
family:
  - { pl: "opanowywać", ru: "овладевать, осваивать", relation: aspect }
  - { pl: "panować", ru: "царствовать, господствовать", relation: root, id: panowac }
  - { pl: "pan", ru: "господин; вы", relation: root, id: pan }
etymology: "Приставка o- «вокруг, об-» и PANOWAĆ, от PAN «господин», из праславянского *gъpanъ — слова, которое в польском осталось живым обращением, а в русском сузилось до исторического «пана». Буквально OPANOWAĆ значит «обхватить своей властью», откуда и овладение языком, и захват города, и власть над собой. Русское «овладеть» устроено по той же мысли, но от другого корня — от «власть», — так что сходится не форма, а логика. Отсюда же OPANOWANY «сдержанный» и NIEOPANOWANY «несдержанный»."
memory: "opanować берёт винительный: opanował polski — «овладел польским», не «польский». А корень — pan «господин», то же слово, которым к вам обращаются."
idioms:
  - { pl: "opanuj się", ru: "соберись, владей собой" }
  - { pl: "opanować sytuację", ru: "взять ситуацию под контроль" }
