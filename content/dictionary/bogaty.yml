# review
id: bogaty
format: 2
lemma: "bogaty"
rank: 1135
pos: adj
pron: { cyr: "бога́ты" }
senses:
  - id: rich
    ru: "богатый (о человеке)"
    examples:
      - pl: "Mój brat jest bogaty."
        ru: "Мой брат богат."
        source: { kind: tatoeba, id: 1801373 }
      - pl: "Jest bogata."
        ru: "Она богата."
        source: { kind: tatoeba, id: 11956041 }
      - pl: "Mój ojciec jest bogaty."
        ru: "Мой отец богатый."
        source: { kind: tatoeba, id: 4716844 }
  - id: rich-in
    ru: "bogaty w coś — богатый чем-то"
    examples:
      - pl: "Chiny są bogate w surowce naturalne."
        ru: "Китай богат природными ресурсами."
        source: { kind: tatoeba, id: 1352079 }
      - pl: "Awokado jest bogate w składniki odżywcze."
        ru: "Авокадо богато питательными веществами."
        source: { kind: translated, id: 8973467 }
  - id: richest
    ru: "najbogatszy — самый богатый"
    examples:
      - pl: "Mówią, że Japonia to najbogatszy kraj na świecie."
        ru: "Говорят, что Япония - богатейшая страна в мире."
        source: { kind: tatoeba, id: 6314008 }
      - pl: "Kto jest najbogatszym człowiekiem na świecie?"
        ru: "Кто самый богатый человек в мире?"
        source: { kind: tatoeba, id: 12720696 }
notes:
  - { kind: government, text: "bogaty W coś «богатый чем-то» — предлог w с винительным падежом: bogaty w surowce «богатый сырьём». Русское «богатый чем-то» идёт с творительным без предлога." }
  - { kind: usage, text: "Степени сравнения обычные: bogaty — bogatszy — najbogatszy. Мужское лицо множественного — bogaci: Bogaci nie zawsze są szczęśliwi." }
  - { kind: usage, text: "Как существительное bogaci значит «богатые», biedni — «бедные»: Bogaci czasem pogardzają biednymi." }
  - { kind: usage, text: "Корень тот же, что в Bóg «Бог» и bogactwo «богатство»: изначально «наделённый долей, одарённый»." }
collocations:
  - { pl: "bogaty człowiek", ru: "богатый человек" }
  - { pl: "bogaty w coś", ru: "богатый чем-то" }
  - { pl: "najbogatszy na świecie", ru: "самый богатый в мире" }
family:
  - { pl: "bogactwo", ru: "богатство", relation: derived }
  - { pl: "wzbogacić", ru: "обогатить", relation: derived }
  - { pl: "biedny", ru: "бедный", relation: antonym, id: biedny }
etymology: "Праславянское *bogatъ, от корня *bog- «доля, достаток», того же, что в Bóg «Бог». Русское «богатый» — то же слово с той же историей."
memory: "bogaty — «богатый», и падеж другой: bogaty W coś, предлог w с винительным, а по-русски «богатый чем-то», творительный. Степени обычные: bogatszy, najbogatszy."
idioms:
  - { pl: "bogaty w coś", ru: "богатый чем-то" }
  - { pl: "najbogatszy na świecie", ru: "самый богатый в мире" }
