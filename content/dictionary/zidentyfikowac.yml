notes:
  - { kind: false-friend, text: "Слово общее, из латыни, и значение то же. Расходится употребление: русское «идентифицировать» звучит книжно и технично, а польское zidentyfikować совершенно обиходно — так говорят в полиции, в больнице и в сервисе. Там, где по-русски естественнее «опознать» или «установить», поляк скажет zidentyfikować: zidentyfikować zwłoki, zidentyfikować sprawcę, zidentyfikować usterkę." }
  - { kind: usage, text: "Вид совершенный, несовершенная пара — identyfikować. Настоящее-будущее по правилу -ować: zidentyfikuję, zidentyfikujesz, zidentyfikuje — тот же ряд, что pracuję и zaakceptuję. Обратите внимание: правило это почти всегда верно, но у chować оно НЕ работает, там chowam. Проверять стоит по словарю." }
  - { kind: pronunciation, text: "Шесть слогов, ударение на предпоследнем: zi-den-ty-fi-KO-wać, «зидэнтыфико́ваць». z перед i смягчается, y звучит как ы, e как э. В формах настоящего времени ударение переезжает: zidentyfikuję — «зидэнтыфику́йэ»." }
  - { kind: government, text: "Опознают КОГО или ЧТО — винительный падеж: zidentyfikować sprawcę, ciało, przyczynę. По чему — po с предложным: zidentyfikować kogoś po głosie, po tatuażu. Возвратное zidentyfikować się Z kimś значит «отождествить себя с кем-то» и идёт с творительным." }
collocations:
  - { pl: "zidentyfikować sprawcę", ru: "опознать преступника" }
  - { pl: "zidentyfikować przyczynę", ru: "установить причину" }
  - { pl: "zidentyfikować po głosie", ru: "опознать по голосу" }
family:
  - { pl: "identyfikować", ru: "идентифицировать, опознавать", relation: aspect }
  - { pl: "identyfikacja", ru: "идентификация, опознание", relation: derived }
  - { pl: "identyczny", ru: "идентичный", relation: derived }
etymology: "Приставка z- плюс identyfikować, из позднелатинского identificare, от idem «тот же самый». В русский слово пришло тем же путём и в ту же эпоху, поэтому «идентифицировать» и zidentyfikować совпадают по составу. Отсюда identyfikacja, identyczny «идентичный» и tożsamość «идентичность» — последнее уже чисто польское, от ten sam."
memory: "zidentyfikować — «опознать, установить»: слово то же, что русское «идентифицировать», только куда более обиходное. Спряжение по знакомому правилу -ować: zidentyfikuję. И помните контраст — chować этому правилу не подчиняется."
idioms:
  - { pl: "zidentyfikować zwłoki", ru: "опознать тело" }
  - { pl: "zidentyfikować się z kimś", ru: "отождествить себя с кем-л." }
