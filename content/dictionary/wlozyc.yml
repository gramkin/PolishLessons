aspect: perf
pron: { cyr: "вуо́жыць" }
senses:
  - id: put-in
    ru: "положить внутрь, вложить, вставить"
    examples:
      - pl: "Włożył klucz do zamka."
        ru: "Он вставил ключ в замок."
        source: { kind: translated, id: 598280 }
      - pl: "Włożyłem to do szuflady."
        ru: "Я положил это в ящик."
        source: { kind: translated, id: 366163 }
      - pl: "Włóż kartę."
        ru: "Вставь карту."
        source: { kind: translated, id: 524345 }
  - id: put-on
    ru: "надеть (одежду, обувь)"
    examples:
      - pl: "Tom włożył płaszcz."
        ru: "Том надел пальто."
        source: { kind: translated, id: 3156268 }
      - pl: "Włożyła płaszcz."
        ru: "Она надела пальто."
        source: { kind: translated, id: 404469 }
  - id: invest
    ru: "вложить (усилия, душу)"
    examples:
      - pl: "Włożyłem w to całe serce."
        ru: "Я вложил в это всю душу."
        source: { kind: translated, id: 13654064 }
      - pl: "Dziękuję za włożony trud."
        ru: "Спасибо за приложенный труд."
        source: { kind: translated, id: 749238 }
notes:
  - { kind: false-friend, text: "Ключевое расхождение с русским: włożyć значит и «положить внутрь», и «надеть». Włożył płaszcz — это «Он надел пальто», а вовсе не «положил пальто»." }
  - { kind: usage, text: "Совершенный вид к wkładać." }
  - { kind: government, text: "włożyć co do czego: винительный плюс do с родительным — włożyć list do koperty «вложить письмо в конверт»." }
  - { kind: usage, text: "Переносно — «вложить усилия»: włożyć w coś całe serce «вложить во что-то всю душу», włożyć wiele trudu «приложить много труда»." }
collocations:
  - { pl: "włożyć płaszcz", ru: "надеть пальто" }
  - { pl: "włożyć do koperty", ru: "вложить в конверт" }
  - { pl: "włożyć całe serce", ru: "вложить всю душу" }
etymology: "Приставка w- «в» и łożyć «класть» (праславянское *loziti, то же гнездо, что kłaść). Русское «вложить» собрано из тех же частей."
memory: "włożyć — «вложить, положить внутрь», но ещё и «надеть»: Włożył płaszcz «Он надел пальто». Это главное расхождение с русским. Несовершенный вид — wkładać. И переносное: włożyć w coś całe serce."
idioms:
