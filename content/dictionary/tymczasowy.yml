notes:
  - { kind: false-friend, text: "Слово построено на CZAS, и здесь прячется один из самых известных польско-русских капканов: CZAS значит «время», а не «час». Час по-польски GODZINA. Поэтому TYMCZASOWY это «временный», от TYMCZASEM «пока, между тем», буквально «тем временем». Русский построил «временный» от «времени», то есть оба языка взяли слово для времени, только разное: польский CZAS, русский «время». Польское WRZESIEŃ к «времени» отношения не имеет, а вот CZASOWY значит «временной» и «срочный», CZASOWNIK — «глагол», а NA CZAS — «вовремя». Запомнив, что CZAS это «время», вы получаете сразу целое гнездо." }
  - { kind: usage, text: "Прилагательное относительное: степеней сравнения не образует, потому что временным нельзя быть в большей или меньшей мере — это указание на срок, а не качество. Отсюда и одиннадцать форм вместо тридцати трёх. Мужской личный именительный множественного — TYMCZASOWI, с мягким окончанием -I, и он отличается от остальных форм множественного: TYMCZASOWI PRACOWNICY о людях, но TYMCZASOWE ROZWIĄZANIA о вещах. Наречие от того же корня — TYMCZASOWO «временно», и оно употребляется не реже прилагательного: ZATRUDNIONY TYMCZASOWO «принят на работу временно»." }
  - { kind: government, text: "Согласуется с существительным в роде, числе и падеже. Частотные сочетания: TYMCZASOWE ROZWIĄZANIE «временное решение», TYMCZASOWY ZARZĄD «временное правление», TYMCZASOWE ARESZTOWANIE «предварительное заключение» — это юридический термин, и переводить его как «временный арест» неверно, по-русски говорят «заключение под стражу». TYMCZASOWY DOWÓD OSOBISTY «временное удостоверение личности». Близкое по смыслу PROWIZORYCZNY значит «временный, сделанный на скорую руку», с оттенком непрочности, которого у TYMCZASOWY нет." }
  - { kind: pronunciation, text: "Читается «тымчасо́вы», четыре слога, ударение на предпоследнем, то есть на SO. Буква Y в первом слоге даёт «ы»: начало звучит «тым», а не «тим». Сочетание CZ произносится «ч». Конечное -WY это «вы», и опять с «ы», а не «и». В форме TYMCZASOWI конечное -I мягкое, и предшествующее W смягчается: «тымчасо́ви». В форме TYMCZASOWĄ носовое Ą даёт «он»: «тымчасо́вон»." }
