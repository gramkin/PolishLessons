etymology: "От наречия TYMCZASEM, которое сложилось из указательного TYM и существительного CZASEM, творительного от CZAS, то есть буквально «тем временем». CZAS идёт из праславянского *časъ, и русское «час» — то же слово, но значения разошлись: польский сохранил широкое «время», русский сузил до шестидесяти минут, а для широкого смысла взял «время» от *vermę, родственного «вертеть». Поэтому пара CZAS и «час» — расхождение не формы, а объёма значения, и ошибка в ней одна из самых частых. Суффикс -OWY образует относительные прилагательные от существительных, как в SPORTOWY от SPORT и PORANNY от PORANEK; русскому он отвечает в -ОВЫЙ и -НЫЙ. Из того же гнезда идут CZASOWY «временной», CZASOWNIK «глагол», CZASOPISMO «журнал», и все они понятны сразу, если помнить про «время»."
memory: "Слово стоит на czas, а czas — это «время», не «час»: час по-польски godzina. Tymczasowy от tymczasem «тем временем» — «временный». Отсюда же czasownik «глагол» и czasopismo «журнал». Степеней нет, форм одиннадцать; мужской личный множественного — tymczasowi (о людях), против tymczasowe (о вещах). Юридическое tymczasowe aresztowanie — это «заключение под стражу», а не «временный арест»."
