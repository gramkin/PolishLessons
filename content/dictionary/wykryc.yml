etymology: "Из праславянского *kryti, того же, что русское «крыть», с приставкой WY-, означающей движение наружу. Буквально WYKRYĆ — «выкрыть», то есть вынуть из укрытия то, что было закрыто, и именно этот образ лежит в значении «обнаружить». Русский из того же корня построил «открыть», «закрыть», «скрыть», «укрыть», «прикрыть», и все они имеют польских двойников один в один, но комбинации WY- с этим корнем русский не образовал, а польский образовал и сделал её основным словом для выявления скрытого. Поэтому пара языков здесь показывает не расхождение корней, а разную продуктивность приставок: одно и то же гнездо дало в двух языках разные наборы готовых слов, и переводить приходится не корнем, а смыслом. От несовершенного WYKRYWAĆ образовано WYKRYWACZ по модели на -ACZ, которая отвечает русскому -ТЕЛЬ или -ИК в названиях приборов."
memory: "Корень kryć — это «крыть», и почти всё гнездо совпадает: odkryć «открыть», zakryć «закрыть», ukryć «скрыть», przykryć «прикрыть». Но wykryć выпадает: «выкрыть» по-русски не говорят, и перевод — «обнаружить, выявить», а о преступлении «раскрыть». Правило выбора: odkryć о неизвестном прежде (odkryć Amerykę), wykryć о скрытом (wykryć błąd). Совершенный вид, 53 формы: деепричастие только прошедшее (wykrywszy), формы на -ąc нет. Несовершенное wykrywać дало wykrywacz «детектор»: wykrywacz metali, wykrywacz kłamstw."
