notes:
  - { kind: false-friend, text: "Корень KRY- это русское «крыть», и приставочное гнездо почти целиком совпадает: ODKRYĆ «открыть», ZAKRYĆ «закрыть», UKRYĆ «скрыть, укрыть», PRZYKRYĆ «прикрыть», NAKRYĆ «накрыть». Но именно WYKRYĆ в этот ряд не ложится: русского глагола «выкрыть» нет, и переводить приходится другими словами — «обнаружить», «выявить», а о преступлении «раскрыть». Обратная ошибка тоже встречается: ODKRYĆ значит и «открыть» в смысле открытия (ODKRYĆ AMERYKĘ), и «раскрыть, обнажить», но не «обнаружить дефект» — там нужен WYKRYĆ. Короткое правило: ODKRYĆ о том, чего раньше не знали вообще, WYKRYĆ о том, что было скрыто." }
  - { kind: usage, text: "Совершенный вид, пятьдесят три формы: сорок две от глагола, одна у деепричастия прошедшего времени WYKRYWSZY, которое бывает только у совершенного вида, и одиннадцать у страдательного причастия WYKRYTY. Настоящего времени у совершенного вида нет: WYKRYJĘ и WYKRYJESZ значат будущее, «обнаружу», «обнаружишь». Деепричастия на -ĄC нет вовсе, и формы WYKRYWAJĄC в этом наборе быть не может. Несовершенная пара — WYKRYWAĆ, и от неё образовано очень употребительное существительное WYKRYWACZ «детектор»: WYKRYWACZ METALI «металлоискатель», WYKRYWACZ KŁAMSTW «детектор лжи», WYKRYWACZ DYMU «дымовой датчик»." }
  - { kind: government, text: "Переходный: обнаружить что или кого — винительный без предлога, WYKRYĆ BŁĄD, WYKRYĆ WADĘ, WYKRYĆ SPRAWCĘ. Часто вводит придаточное с ŻE: WYKRYLI, ŻE DANE BYŁY FAŁSZYWE «обнаружили, что данные были ложными». В медицине и технике употребляется с предлогом U и родительным о человеке: WYKRYTO U NIEGO ANEMIĘ «у него обнаружили анемию», и это калькирует русскую конструкцию точно. Безличная форма WYKRYTO употребляется в официальных текстах чаще личной: WYKRYTO NIEPRAWIDŁOWOŚCI «обнаружены нарушения», и для русскоязычного это привычно, потому что русский в таких отчётах тоже уходит от подлежащего." }
  - { kind: pronunciation, text: "Читается «вы́крыць», два слога, ударение на первом. Обе буквы Y читаются как «ы», поэтому слово звучит «выкрыць», а не «викрич». Сочетание KR произносится твёрдо и слитно. Конечное Ć это мягкое «ць». В формах будущего времени появляется J: WYKRYJĘ звучит «выкры́е» с лёгким носовым на конце, WYKRYJESZ — «выкры́еш». В деепричастии WYKRYWSZY три слога, ударение на предпоследнем: «выкры́фшы», где W перед S оглушается в «ф». В причастии WYKRYTY ударение тоже предпоследнее: «выкры́ты»." }
