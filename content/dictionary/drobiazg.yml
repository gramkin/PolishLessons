        source: { kind: translated, id: 12360347 }
      - pl: "Kupiłem kilka drobiazgów."
        ru: "Я купил несколько мелочей."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Drobiazg! — обычный вежливый ответ на «спасибо»: «Пустяки!»" }
  - { kind: false-friend, text: "Корень drobny «мелкий» — ср. русское «дробный», «дробить»." }
  - { kind: government, text: "Мужской неодушевлённый; множественное — drobiazgi." }
  - { kind: usage, text: "Во множественном числе часто значит «мелкие вещи, безделушки», а не только «пустяки»." }
collocations:
  - { pl: "to drobiazg", ru: "это пустяк" }
  - { pl: "kupić drobiazgi", ru: "купить мелочи" }
etymology: "От drobny «мелкий»; ср. русское «дробить», «дробный»."
memory: "drobiazg — «мелочь, пустяк», от drobny «мелкий». Запомните ответ на благодарность: Drobiazg! «Пустяки!»"
idioms:
  - { pl: "drobiazg!", ru: "пустяки!" }
