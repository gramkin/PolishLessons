senses:
  - id: trifle
    ru: "мелочь, пустяк"
    examples:
      - pl: "Nie przejmuj się takimi drobiazgami."
        ru: "Не переживай из-за таких мелочей."
        source: { kind: translated, id: 2242248 }
      - pl: "To drobiazg."
        ru: "Это пустяк."
        source: { kind: authored }
