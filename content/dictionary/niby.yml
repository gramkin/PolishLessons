# review
id: niby
format: 2
lemma: "niby"
rank: 914
pos: part
pron: { cyr: "ни́бы" }
senses:
  - id: supposedly
    ru: "якобы, вроде бы (с недоверием)"
    note: "Говорящий пересказывает чужие слова и сам в них сомневается."
    examples:
      - pl: "Tom niby nie miał tego robić."
        ru: "Том вроде бы не должен был этого делать."
        source: { kind: translated, id: 11464759 }
      - pl: "Niby wszystko w porządku, ale coś mi nie pasuje."
        ru: "Вроде всё в порядке, но что-то мне не нравится."
        source: { kind: authored }
      - pl: "Niby go znam, a jednak nie."
        ru: "Вроде я его знаю, и всё же нет."
        source: { kind: authored }
  - id: like
    ru: "будто, словно (в сравнении)"
    examples:
      - pl: "Był sobie chłopczyk, imieniem Janek, na pozór skromny niby baranek."
        ru: "Жил-был мальчик по имени Ваня, на вид скромный, будто барашек."
        source: { kind: tatoeba, id: 7840563 }
      - pl: "Stał nieruchomo, niby posąg."
        ru: "Он стоял неподвижно, словно статуя."
        source: { kind: authored }
      - pl: "Biały niby śnieg."
        ru: "Белый как снег."
        source: { kind: authored }
  - id: indignant
    ru: "в раздражённом вопросе: «это как же?», «с чего бы?»"
    examples:
      - pl: "Jak mam niby jeść?"
        ru: "И как мне это есть?"
        source: { kind: translated, id: 3432979 }
      - pl: "A skąd ja niby mam to wiedzieć?"
        ru: "А откуда мне это знать?"
        source: { kind: translated, id: 947943 }
      - pl: "Co ja niby mam zrobić?"
        ru: "И что мне прикажешь делать?"
        source: { kind: authored }
notes:
  - { kind: usage, text: "Основное значение — недоверие: niby «якобы, вроде бы». Tom niby nie miał tego robić значит «Том вроде бы не должен был этого делать» — говорящий передаёт чужие слова и сам в них сомневается." }
  - { kind: usage, text: "В сравнении niby работает как jak или jakby: biały niby śnieg «белый как снег». Это употребление книжное, в разговоре чаще скажут jak." }
  - { kind: usage, text: "В вопросе слово добавляет раздражение: Co ja niby mam zrobić? «И что мне прикажешь делать?», A skąd ja niby mam to wiedzieć? «А откуда мне это знать?»." }
  - { kind: usage, text: "na niby значит «понарошку, не всерьёз»: bawić się na niby «играть понарошку». Противоположность — naprawdę «по-настоящему»." }
collocations:
  - { pl: "na niby", ru: "понарошку" }
  - { pl: "niby nic", ru: "вроде бы ничего" }
  - { pl: "niby przypadkiem", ru: "как бы случайно" }
  - { pl: "niby tak", ru: "вроде бы да" }
family:
  - { pl: "jakby", ru: "как будто", relation: root }
etymology: "Сращение ni + by, буквально «не бы». Русское «небось» собрано похожим образом, но значение у польского слова другое — «якобы»."
memory: "niby — «якобы, вроде бы», слово недоверия: говорящий передаёт чужие слова и сам в них сомневается. В сравнении значит «словно»: biały niby śnieg. В вопросе добавляет раздражение: Co ja niby mam zrobić? А na niby — «понарошку»."
idioms:
