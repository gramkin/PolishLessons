# review
id: zsiadac
format: 2
lemma: "zsiadać"
rank: 2107
pos: verb
aspect: imperf
pron: { cyr: "зся́даць" }
senses:
  - id: dismount
    ru: "слезать, спешиваться"
    examples:
      - pl: "Zsiadać z konia trzeba powoli."
        ru: "Слезать с коня надо медленно."
        source: { kind: authored }
      - pl: "Zsiada z roweru przed bramą."
        ru: "Он слезает с велосипеда перед воротами."
        source: { kind: authored }
      - pl: "Nie zsiadaj w biegu!"
        ru: "Не слезай на ходу!"
        source: { kind: authored }
  - id: curdle
    ru: "сворачиваться, скисать (о молоке)"
    examples:
      - pl: "Mleko zsiada się na słońcu."
        ru: "Молоко сворачивается на солнце."
        source: { kind: authored }
      - pl: "Śmietana zsiadała się powoli."
        ru: "Сметана медленно сворачивалась."
        source: { kind: authored }
notes:
  - { kind: government, text: "Слезать откуда-л. — предлог z с родительным падежом: zsiadać z konia «слезать с коня», zsiadać z roweru «слезать с велосипеда»." }
  - { kind: usage, text: "Второе значение неожиданно для русского уха: о молоке zsiadać się значит «сворачиваться, скисать». Отсюда zsiadłe mleko «простокваша» — застывшее прилагательное, а не форма этого глагола." }
  - { kind: false-friend, text: "Корень siadać «садиться» — ср. русское «садиться», «сесть». Приставка z- означает движение вниз, как русское «с-» в «слезать»." }
  - { kind: usage, text: "Совершенный вид — zsiąść. В корпусе для этого глагола нет ни одного примера, поэтому все примеры составлены вручную." }
collocations:
  - { pl: "zsiadać z konia", ru: "слезать с коня" }
  - { pl: "zsiadłe mleko", ru: "простокваша" }
etymology: "z- + siadać «садиться», праславянское *sěsti; ср. русское «садиться», «слезать»."
memory: "zsiadać — «слезать» (z konia, z roweru), а о молоке «сворачиваться». Отсюда zsiadłe mleko «простокваша». Совершенный вид — zsiąść."
idioms:
