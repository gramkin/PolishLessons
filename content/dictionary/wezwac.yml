# review
id: wezwac
format: 2
lemma: "wezwać"
rank: 786
pos: verb
aspect: perf
pron: { cyr: "вэ́зваць" }
senses:
  - id: call
    ru: "вызвать (службу, человека)"
    examples:
      - pl: "Proszę wezwać pogotowie."
        ru: "Вызовите скорую, пожалуйста."
        source: { kind: tatoeba, id: 4716812 }
      - pl: "Musimy wezwać pomoc."
        ru: "Мы должны вызвать помощь."
        source: { kind: translated, id: 3757018 }
      - pl: "Tom wezwał lekarza."
        ru: "Том вызвал врача."
        source: { kind: translated, id: 3633700 }
  - id: call-imp
    ru: "Wezwij pogotowie! — Вызови скорую!"
    examples:
      - pl: "Wezwij pogotowie, proszę."
        ru: "Вызови скорую, пожалуйста."
        source: { kind: tatoeba, id: 4716813 }
      - pl: "Wezwij pomoc."
        ru: "Вызови помощь."
        source: { kind: translated, id: 3933303 }
      - pl: "Wezwijcie lekarza!"
        ru: "Вызовите врача!"
        source: { kind: translated, id: 6157951 }
  - id: summoned
    ru: "zostać wezwanym — быть вызванным"
    examples:
      - pl: "Został wezwany do wojska."
        ru: "Его призвали в армию."
        source: { kind: translated, id: 415388 }
      - pl: "Zostałem wezwany zaraz po nim."
        ru: "Меня вызвали сразу после него."
        source: { kind: translated, id: 732923 }
      - pl: "Uczniowie zebrali się na wezwanie dyrektora szkoły."
        ru: "Ученики собрались по зову директора школы."
        source: { kind: translated, id: 759577 }
  - id: security
    ru: "wezwać ochronę, policję — вызвать охрану, полицию"
    examples:
      - pl: "Niech ktoś wezwie ochronę!"
        ru: "Пусть кто-нибудь вызовет охрану!"
        source: { kind: translated, id: 8617222 }
      - pl: "Wezwijcie ochronę!"
        ru: "Вызовите охрану!"
        source: { kind: translated, id: 8617218 }
      - pl: "Jeśli nie skończycie walczyć, wezwę policję."
        ru: "Если не прекратите драться, я вызову полицию."
        source: { kind: translated, id: 3093192 }
notes:
  - { kind: usage, text: "Это глагол про вызов служб и людей: wezwać pogotowie «вызвать скорую», wezwać lekarza, wezwać policję, wezwać ochronę, wezwać taksówkę." }
  - { kind: government, text: "Кого вызвать — винительный: wezwać lekarza. Куда — do с родительным: wezwać do sądu «вызвать в суд». Зачем — na с винительным: wezwać na pomoc." }
  - { kind: usage, text: "wezwać na dywanik — «вызвать на ковёр»: идиома совпадает с русской дословно, вплоть до ковра." }
  - { kind: usage, text: "Существительное wezwanie значит «вызов, повестка»: wezwanie do sądu. Несовершенный вид — wzywać." }
collocations:
  - { pl: "wezwać pogotowie", ru: "вызвать скорую" }
  - { pl: "wezwać lekarza", ru: "вызвать врача" }
  - { pl: "wezwać policję", ru: "вызвать полицию" }
  - { pl: "wezwać na dywanik", ru: "вызвать на ковёр" }
family:
  - { pl: "wzywać", ru: "вызывать", relation: aspect }
  - { pl: "zwać", ru: "звать", relation: root }
  - { pl: "wezwanie", ru: "вызов, повестка", relation: derived }
  - { pl: "nazwa", ru: "название", relation: root }
etymology: "wez- (= wy-) + zwać «звать», праславянское *zъvati — то же слово, что русские «звать» и «вызвать»."
memory: "wezwać — «вызвать», от zwać «звать», ровно как русское «вы-звать» от «звать». Это глагол про службы: wezwać pogotowie, wezwać lekarza, wezwać policję, wezwać ochronę. Идиома переносится дословно, вплоть до ковра: wezwać na dywanik значит «вызвать на ковёр». Несовершенный вид — wzywać."
idioms:
  - { pl: "wezwać pogotowie", ru: "вызвать скорую" }
  - { pl: "wezwać na dywanik", ru: "вызвать на ковёр" }
  - { pl: "wezwanie do sądu", ru: "повестка в суд" }
