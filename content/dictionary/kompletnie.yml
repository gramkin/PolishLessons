etymology: "От kompletny «полный», из латинского completus «завершённый». Русское «комплектно» пришло тем же путём, но значение разошлось."
memory: "kompletnie — «совершенно, полностью»: kompletnie pijany, kompletnie wyczerpany. Близкие слова — zupełnie и całkowicie."
