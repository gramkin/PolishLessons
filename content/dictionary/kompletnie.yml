# review
id: kompletnie
format: 2
lemma: "kompletnie"
rank: 1810
pos: adv
pron: { cyr: "комплэ́тне" }
senses:
  - id: completely
    ru: "полностью, совершенно, начисто"
    examples:
      - pl: "Był kompletnie pijany."
        ru: "Он был совершенно пьян."
        source: { kind: translated, id: 352967 }
      - pl: "To kompletnie szalone."
        ru: "Это совершенно безумно."
        source: { kind: translated, id: 4437761 }
      - pl: "Jestem kompletnie wyczerpany."
        ru: "Я совершенно измотан."
        source: { kind: translated, id: 565332 }
  - id: completely-agree
    ru: "совершенно (с глаголом и причастием)"
    examples:
      - pl: "Kompletnie się zgadzam"
        ru: "Я совершенно согласен."
        source: { kind: translated, id: 7556779 }
      - pl: "Jestem kompletnie zmieszany."
        ru: "Я совершенно сбит с толку."
        source: { kind: translated, id: 4642275 }
      - pl: "On jest kompletnie wykończony."
        ru: "Он совершенно вымотан."
        source: { kind: translated, id: 540136 }
notes:
  - { kind: usage, text: "Наречие усиливает прилагательное или причастие: kompletnie pijany «совершенно пьяный», kompletnie wyczerpany «совершенно измотанный»." }
  - { kind: usage, text: "Близкие по смыслу — zupełnie и całkowicie «полностью». kompletnie чуть разговорнее и часто окрашено эмоцией." }
  - { kind: false-friend, text: "Русское «комплектно» по-польски тоже kompletnie, но это значение сегодня редкое: в живой речи слово значит «полностью, совершенно»." }
  - { kind: usage, text: "Прилагательное — kompletny «полный, законченный»: kompletny idiota «полный идиот»." }
  - { kind: usage, text: "Наречие не образует степеней сравнения: полнота либо есть, либо нет. Формы kompletniej в языке не существует." }
collocations:
