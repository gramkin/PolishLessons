  - id: incomplete
    ru: "неполный, не целый"
    examples:
      - pl: "Został mu niecały chleb, ktoś odkroił kawałek."
        ru: "У него остался неполный каравай: кто-то отрезал кусок."
        source: { kind: authored }
      - pl: "Dostał niecałą pensję za ten miesiąc."
        ru: "Он получил неполную зарплату за этот месяц."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Русскому нет прямого аналога: «нецелый» не говорят. NIECAŁY чаще всего значит «без малого, неполный» перед числом или мерой: NIECAŁA GODZINA — «неполный час, меньше часа», NIECAŁE DWA LATA — «неполных два года». Русский скажет «меньше», «без малого», «нет и». Поляк ставит прилагательное, и оно согласуется с существительным." }
  - { kind: usage, text: "Степеней сравнения нет. Формы для мужчин-людей NIECALI в карточке нет: о людях так не говорят. Остальные десять форм живые, но чаще всего слово стоит в винительном перед мерой времени или расстояния: NIECAŁĄ GODZINĘ, NIECAŁY TYDZIEŃ, NIECAŁE PÓŁ ROKU." }
  - { kind: government, text: "Ставится перед числительным или существительным меры и согласуется с ним: NIECAŁY ROK, NIECAŁA MINUTA, NIECAŁE DWIE GODZINY. С числительными от пяти — NIECAŁE PIĘĆ LAT, хотя после PIĘĆ существительное стоит в родительном." }
  - { kind: pronunciation, text: "Читается «неца́уы», три слога, ударение на предпоследнем. C — «ц», Ł — «у», конечная Y — «ы»: «-ца́уы», как в CAŁY «ца́уы»." }
  - { kind: register, text: "Нейтральное повседневное слово, частое в разговоре и новостях: ZA NIECAŁE DWA TYGODNIE, «меньше чем через две недели». Синоним PRAWIE, «почти», работает как наречие: PRAWIE GODZINĘ, «почти час»." }
