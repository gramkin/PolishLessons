etymology: "От CAŁY «целый, весь», общеславянского *cělъ, родственного русскому «целый», с отрицанием NIE-. Польское A на месте русского «е» здесь — результат старого перехода ě в a перед твёрдой согласной: CAŁY — «целый», LAS — «лес»."
memory: "Niecały — неполный, без малого: niecała godzina — меньше часа, niecałe trzydzieści lat — нет и тридцати. От cały — целый. Читается «неца́уы»."
idioms:
  - { pl: "w niecałą minutę", ru: "меньше чем за минуту" }
formExamplesSkip:
  - { form: "niecali", reason: "форма для мужчин-людей: о людях так не говорят" }
