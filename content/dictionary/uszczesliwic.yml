# review
id: uszczesliwic
format: 2
lemma: "uszczęśliwić"
rank: 5209
pos: verb
pron: { cyr: "ушчэньсьли́виць" }
senses:
  - id: make-happy
    ru: "осчастливить, обрадовать"
    examples:
      - pl: "Uszczęśliwił ją pierścionkiem."
        ru: "Он осчастливил её кольцом."
        source: { kind: authored }
      - pl: "Ta wiadomość uszczęśliwiła całą rodzinę."
        ru: "Эта новость обрадовала всю семью."
        source: { kind: authored }
      - pl: "Nie da się uszczęśliwić wszystkich."
        ru: "Невозможно угодить всем."
        source: { kind: authored }
  - id: bless
    ru: "одарить (присутствием, вниманием) — часто иронично"
    examples:
      - pl: "Uszczęśliw nas swoją obecnością."
        ru: "Осчастливь нас своим присутствием."
        source: { kind: authored }
      - pl: "Uszczęśliwił nas zaproszeniem na wesele."
        ru: "Он осчастливил нас приглашением на свадьбу."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "USZCZĘŚLIWIĆ — «обрадовать, сделать счастливым», обычно всерьёз, тогда как русское «осчастливить» часто звучит иронично. USZCZĘŚLIWIONY — «сияющий, счастливый»: USZCZĘŚLIWIONA MAMA." }
  - { kind: usage, text: "Пятьдесят три формы, включая USZCZĘŚLIWIENI — «осчастливленные». Будущее: USZCZĘŚLIWIĘ, USZCZĘŚLIWISZ, повелительное USZCZĘŚLIW. Несовершенный вид — USZCZĘŚLIWIAĆ." }
  - { kind: government, text: "Кого чем — винительный и творительный: USZCZĘŚLIWIĆ DZIECKO PREZENTEM, USZCZĘŚLIWIĆ KOGOŚ WIADOMOŚCIĄ." }
  - { kind: pronunciation, text: "Читается «ушчэньсьли́виць»: SZCZ — «шч», Ę перед Ś — «энь», ŚLI — «сьли», ударение на предпоследнем слоге. USZCZĘŚLIWIĘ — «ушчэньсьли́вье»." }
  - { kind: register, text: "Нейтральное, тёплое слово. USZCZĘŚLIWIĆ KOGOŚ NA SIŁĘ — ироничное «осчастливить против воли». USZCZĘŚLIW NAS SWOJĄ OBECNOŚCIĄ — шутливо-торжественное." }
collocations:
  - { pl: "uszczęśliwić kogoś prezentem", ru: "обрадовать кого-то подарком" }
  - { pl: "uszczęśliwić dzieci", ru: "осчастливить детей" }
  - { pl: "uszczęśliwiona mina", ru: "сияющее лицо" }
family:
  - { pl: "szczęście", ru: "счастье", relation: root, id: szczescie }
  - { pl: "szczęśliwy", ru: "счастливый", relation: derived, id: szczesliwy }
  - { pl: "uszczęśliwiać", ru: "осчастливливать", relation: aspect }
etymology: "Приставка U- плюс SZCZĘŚLIWY «счастливый», от SZCZĘŚCIE «счастье», праславянское *sъčęstьje. Польское Ę соответствует русскому «а»: SZCZĘŚCIE — «счастье»."
memory: "Uszczęśliwić — обрадовать, осчастливить: uszczęśliwił ją pierścionkiem. Uszczęśliwiony — сияющий. Читается «ушчэньсьли́виць»."
idioms:
