# review
id: sciana
format: 2
lemma: "ściana"
rank: 972
pos: noun
pron: { cyr: "сьця́на" }
senses:
  - id: wall
    ru: "стена"
    examples:
      - pl: "Ściany wspierają sufit."
        ru: "Стены поддерживают потолок."
        source: { kind: tatoeba, id: 12147714 }
      - pl: "Jej pokój ma czerwone ściany."
        ru: "В её комнате красные стены."
        source: { kind: tatoeba, id: 1583712 }
      - pl: "Ściana runęła."
        ru: "Стена рухнула."
        source: { kind: translated, id: 12191462 }
  - id: on-wall
    ru: "na ścianie — на стене"
    examples:
      - pl: "Wieszam kalendarz na ścianie."
        ru: "Я вешаю календарь на стену."
        source: { kind: tatoeba, id: 2805595 }
      - pl: "Szczur zrobił dziurę w ścianie."
        ru: "Крыса прогрызла дыру в стене."
        source: { kind: tatoeba, id: 5491774 }
      - pl: "Na ścianie siedziała ogromna mucha."
        ru: "На стене сидела огромная муха."
        source: { kind: tatoeba, id: 12478684 }
  - id: pale
    ru: "blady jak ściana — бледный как стена"
    examples:
      - pl: "Była blada jak ściana."
        ru: "Она была бледна как стена."
        source: { kind: translated, id: 716883 }
      - pl: "Co jest za ścianą?"
        ru: "Что за стеной?"
        source: { kind: translated, id: 4821022 }
      - pl: "Ktoś jest za ścianą."
        ru: "Кто-то за стеной."
        source: { kind: translated, id: 1599044 }
notes:
  - { kind: usage, text: "na ścianie «на стене» — предложный падеж; na ścianę «на стену» — винительный. Русский различает их так же." }
  - { kind: usage, text: "blady jak ściana — «бледный как стена», по-русски чаще «как полотно». Ещё говорят mówić jak do ściany «говорить как со стеной»." }
  - { kind: usage, text: "Ściany mają uszy — «у стен есть уши», поговорка совпадает с русской." }
  - { kind: usage, text: "Прилагательное — ścienny «настенный»: zegar ścienny «настенные часы». А перегородка — ścianka." }
collocations:
  - { pl: "na ścianie", ru: "на стене" }
  - { pl: "blady jak ściana", ru: "бледный как стена" }
  - { pl: "mówić jak do ściany", ru: "говорить как со стеной" }
  - { pl: "ściany mają uszy", ru: "у стен есть уши" }
family:
  - { pl: "ścienny", ru: "настенный", relation: derived }
  - { pl: "ścianka", ru: "перегородка", relation: derived }
etymology: "Праславянское *stěna. Русское «стена» — то же слово, только польское ść на месте русского ст: ściana — стена, ścieżka — стезя."
memory: "ściana — «стена», слово общеславянское. Запомните пару падежей: na ścianie «на стене» и na ścianę «на стену». Поговорки совпадают с русскими: Ściany mają uszy «У стен есть уши», blady jak ściana, mówić jak do ściany."
idioms:
  - { pl: "na ścianie", ru: "на стене" }
  - { pl: "blady jak ściana", ru: "бледный как стена" }
  - { pl: "mówić jak do ściany", ru: "говорить как со стеной" }
