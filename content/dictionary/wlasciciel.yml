# review
id: wlasciciel
format: 2
lemma: "właściciel"
rank: 1209
pos: noun
pron: { cyr: "вуасьци́цель" }
senses:
  - id: owner
    ru: "владелец, хозяин, собственник"
    examples:
      - pl: "Właściciel mieszkania świetnie mówi po angielsku."
        ru: "Владелец квартиры прекрасно говорит по-английски."
        source: { kind: translated, id: 3877877 }
      - pl: "Znalazłem kota, którego właściciel bardzo długo szukał."
        ru: "Я нашёл кота, которого владелец очень долго искал."
        source: { kind: translated, id: 982580 }
      - pl: "Prawdopodobnie właściciel tego domu jest na stypendium za granicą."
        ru: "Вероятно, владелец этого дома учится по стипендии за границей."
        source: { kind: translated, id: 765607 }
  - id: be-owner
    ru: "być właścicielem — быть владельцем (творительный падеж)"
    examples:
      - pl: "Kto jest właścicielem tego domu?"
        ru: "Кто владелец этого дома?"
        source: { kind: translated, id: 552924 }
      - pl: "Jestem właścicielem tego zdania."
        ru: "Я владелец этого предложения."
        source: { kind: tatoeba, id: 12567461 }
      - pl: "On jest właścicielem tej ziemi."
        ru: "Он владелец этой земли."
        source: { kind: translated, id: 951087 }
  - id: landlord
    ru: "хозяин съёмной квартиры, арендодатель"
    examples:
      - pl: "Właściciel mieszkania mówi, że chce podwyższyć czynsz."
        ru: "Хозяин квартиры говорит, что хочет поднять квартплату."
        source: { kind: translated, id: 582828 }
      - pl: "Właściciel kazał mu się wynosić, bo nie zapłacił czynszu."
        ru: "Хозяин велел ему убираться, потому что он не заплатил за квартиру."
        source: { kind: translated, id: 404068 }
      - pl: "Kiedy właściciela nie ma, lokatorzy szaleją."
        ru: "Когда хозяина нет, жильцы распоясываются."
        source: { kind: translated, id: 780298 }
notes:
  - { kind: government, text: "Быть владельцем требует творительного падежа: Jestem właścicielem tego samochodu. И вопрос строится так же: Kto jest właścicielem tego domu?" }
  - { kind: usage, text: "Właściciel mieszkania — это и «собственник квартиры», и «хозяин съёмной квартиры», то есть арендодатель. Различает только контекст." }
  - { kind: usage, text: "Множественное число мужского лица — właściciele, родительный — właścicieli. Женская форма — właścicielka." }
  - { kind: pronunciation, text: "Начало трудное: wł-a-ś складывается в «вуась-». Ударение на предпоследний слог: вуасьци́цель." }
collocations:
  - { pl: "właściciel mieszkania", ru: "владелец квартиры" }
  - { pl: "być właścicielem", ru: "быть владельцем" }
  - { pl: "zmienić właściciela", ru: "сменить владельца" }
etymology: "От własny «собственный», из праславянского *volstь «власть, владение». Русские «власть» и «волость» — из того же гнезда, что польское własność."
memory: "właściciel — «владелец, хозяин». Быть им — творительный падеж: Jestem właścicielem. Множественное — właściciele, родительный — właścicieli. Корень тот же, что в русских «власть» и «волость»."
idioms:
