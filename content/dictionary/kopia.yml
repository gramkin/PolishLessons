notes:
  - { kind: pronunciation, text: "Родительный единственного и родительный множественного совпадают в форме KOPII, с двумя i — так пишутся заимствования на -ia: historia — historii, tragedia — tragedii. Рядом существует старая форма родительного множественного KOPIJ, и это уже пятая такая пара в словаре после konferencji и konferencyj, reputacyj, tradycyj, tragedyj. Форма на -yj книжная, из старых текстов, в живой речи её не услышишь." }
  - { kind: usage, text: "У слова есть омоним другого происхождения: KOPIA означало когда-то «копьё». Сегодня это значение живо почти только в обороте ŁAMAĆ KOPIE O COŚ — «ломать копья», спорить до упора. Падежи у обоих слов одни и те же, поэтому различать их приходится по смыслу фразы, а в современном тексте копьё встретится разве что в историческом описании." }
collocations:
  - { pl: "kopia zapasowa", ru: "резервная копия" }
  - { pl: "zrobić kopię", ru: "сделать копию" }
  - { pl: "kopia dokumentu", ru: "копия документа" }
family:
  - { pl: "kopiować", ru: "копировать", relation: derived }
  - { pl: "kopiarka", ru: "копировальный аппарат", relation: derived }
  - { pl: "oryginał", ru: "оригинал", relation: antonym }
etymology: "Из латинского copia «обилие, запас», которое в средневековой письменности стало означать переписанный текст: сделать copia значило размножить. Оба языка взяли слово в этом вторичном смысле. Омонимичное kopia «копьё» пришло другим путём и к латинской copia отношения не имеет; от него остался только оборот łamać kopie."
memory: "Родительный с двумя i: kopii, и так же в множественном. Старая форма kopij — пятая такая пара после tragedyj."
idioms:
  - { pl: "kopia zapasowa", ru: "резервная копия" }
  - { pl: "łamać kopie o coś", ru: "ломать копья из-за чего-то" }
