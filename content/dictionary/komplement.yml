# review
id: komplement
format: 2
lemma: "komplement"
rank: 3854
pos: noun
pron: { cyr: "компле́мэнт" }
senses:
  - id: compliment
    ru: "комплимент"
    examples:
      - pl: "Dziękuję za komplement!"
        ru: "Спасибо за комплимент!"
        source: { kind: authored }
      - pl: "Powiedział mi miły komplement."
        ru: "Он сказал мне приятный комплимент."
        source: { kind: authored }
      - pl: "Nie umie przyjmować komplementów."
        ru: "Она не умеет принимать комплименты."
        source: { kind: authored }
      - pl: "To nie był komplement, tylko złośliwość."
        ru: "Это был не комплимент, а колкость."
        source: { kind: authored }
      - pl: "Każdy lubi komplementy."
        ru: "Все любят комплименты."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "KOMPLEMENT — «комплимент», но пишется и произносится с E: «компле́мэнт», а не «комплимент». Русское ухо легко переносит сюда «и» — это самая частая ошибка с этим словом." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Родительный — KOMPLEMENTU, в местном T переходит в C: W KOMPLEMENCIE. Книжный оборот — PRAWIĆ KOMPLEMENTY, «рассыпаться в комплиментах»." }
  - { kind: government, text: "Сказать кому-то комплимент — POWIEDZIEĆ KOMUŚ KOMPLEMENT, дательный. Осыпать комплиментами — OBSYPAĆ KOMPLEMENTAMI, творительный. Не жалеть комплиментов — NIE SZCZĘDZIĆ KOMPLEMENTÓW, родительный." }
  - { kind: pronunciation, text: "Читается «компле́мэнт», ударение на предпоследнем слоге. LE — «ле», ME — твёрдое «мэ»." }
collocations:
  - { pl: "prawić komplementy", ru: "рассыпаться в комплиментах" }
  - { pl: "powiedzieć komplement", ru: "сказать комплимент" }
  - { pl: "przyjąć komplement", ru: "принять комплимент" }
family:
  - { pl: "komplementować", ru: "делать комплименты", relation: derived }
  - { pl: "komplemenciarz", ru: "любитель комплиментов, льстец", relation: derived }
  - { pl: "prawić komplementy", ru: "рассыпаться в комплиментах", relation: derived }
etymology: "Из французского слова со значением «любезность, приветствие», которое восходит к испанскому. Польский сохранил старое E во втором слоге, а русский перенял форму с «и»."
memory: "Komplement — комплимент, но с E: «компле́мэнт». Prawić komplementy — рассыпаться в комплиментах. Obsypać komplementami — осыпать комплиментами."
idioms:
  - { pl: "kadzić komuś", ru: "льстить кому-то, курить фимиам" }
