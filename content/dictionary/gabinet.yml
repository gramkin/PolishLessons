rank: 1854
pos: noun
pron: { cyr: "габи́нэт" }
senses:
  - id: office-room
    ru: "кабинет (комната, врачебный)"
    examples:
      - pl: "Ktoś czeka w twoim gabinecie."
        ru: "Кто-то ждёт в твоём кабинете."
