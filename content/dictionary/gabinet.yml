        ru: "Кабинет содрогнулся."
        source: { kind: translated, id: 12239920 }
notes:
  - { kind: false-friend, text: "Слово покрывает и комнату, и правительство: gabinet lekarski «врачебный кабинет», но gabinet podał się do dymisji «кабинет министров подал в отставку». Русский различает их контекстом так же." }
  - { kind: government, text: "В кабинете — w gabinecie (предложный падеж); в кабинет — do gabinetu (родительный с do)." }
  - { kind: usage, text: "gabinet lekarski, gabinet dentystyczny, gabinet kosmetyczny — так называются приёмные специалистов." }
  - { kind: usage, text: "Рабочая комната дома тоже gabinet: ojciec przerobił garaż na gabinet." }
