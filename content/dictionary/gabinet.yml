# review
id: gabinet
format: 2
lemma: "gabinet"
rank: 2054
pos: noun
pron: { cyr: "габи́нэт" }
senses:
  - id: office-room
    ru: "кабинет (комната, врачебный)"
    examples:
      - pl: "Ktoś czeka w twoim gabinecie."
        ru: "Кто-то ждёт в твоём кабинете."
        source: { kind: translated, id: 9684611 }
      - pl: "Gabinet tego lekarza jest na pierwszym piętrze."
        ru: "Кабинет этого врача на втором этаже."
        source: { kind: translated, id: 363811 }
      - pl: "Szef wezwał mnie do gabinetu."
        ru: "Начальник вызвал меня в кабинет."
        source: { kind: translated, id: 12041288 }
  - id: cabinet
    ru: "кабинет министров, правительство"
    examples:
      - pl: "Utworzyli nowy gabinet."
        ru: "Они сформировали новый кабинет."
        source: { kind: translated, id: 1615002 }
      - pl: "Gabinet podał się do dymisji."
        ru: "Кабинет подал в отставку."
        source: { kind: translated, id: 12232746 }
      - pl: "Gabinet zatrząsł się."
        ru: "Кабинет содрогнулся."
        source: { kind: translated, id: 12239920 }
notes:
  - { kind: false-friend, text: "Слово покрывает и комнату, и правительство: gabinet lekarski «врачебный кабинет», но gabinet podał się do dymisji «кабинет министров подал в отставку». Русский различает их контекстом так же." }
  - { kind: government, text: "В кабинете — w gabinecie (предложный падеж); в кабинет — do gabinetu (родительный с do)." }
  - { kind: usage, text: "gabinet lekarski, gabinet dentystyczny, gabinet kosmetyczny — так называются приёмные специалистов." }
  - { kind: usage, text: "Рабочая комната дома тоже gabinet: ojciec przerobił garaż na gabinet." }
collocations:
  - { pl: "w gabinecie", ru: "в кабинете" }
  - { pl: "gabinet lekarski", ru: "врачебный кабинет" }
  - { pl: "gabinet podał się do dymisji", ru: "кабинет подал в отставку" }
family:
  - { pl: "biuro", ru: "офис, бюро", relation: root, id: biuro }
  - { pl: "rząd", ru: "правительство", relation: root, id: rzad }
  - { pl: "pokój", ru: "комната", relation: root, id: pokoj }
etymology: "Из французского cabinet через немецкий; русское «кабинет» пришло тем же путём, включая значение «совет министров»."
memory: "gabinet — и «кабинет» как комната (gabinet lekarski), и «кабинет министров» (gabinet podał się do dymisji). В кабинете — w gabinecie."
