# review
id: narosly
format: 2
lemma: "narosły"
rank: 6066
pos: adj
pron: { cyr: "наро́суы" }
senses:
  - id: accumulated
    ru: "накопившийся, скопившийся (о долгах, проблемах)"
    examples:
      - pl: "Firma spłaciła narosłe długi."
        ru: "Фирма выплатила накопившиеся долги."
        source: { kind: authored }
      - pl: "Musimy rozwiązać narosłe przez lata problemy."
        ru: "Нам нужно решить проблемы, накопившиеся за годы."
        source: { kind: authored }
      - pl: "Narosłe zaległości nadrobimy w weekend."
        ru: "Накопившиеся долги по работе мы наверстаем в выходные."
        source: { kind: authored }
  - id: grown-on
    ru: "наросший (на поверхности: лёд, мох, накипь)"
    examples:
      - pl: "Zeskrobał z szyby narosły lód."
        ru: "Он соскрёб со стекла наросший лёд."
        source: { kind: authored }
      - pl: "Narosły na kamieniach mech był śliski."
        ru: "Наросший на камнях мох был скользким."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Причастие от NAROSNĄĆ, «нарасти, накопиться», ставшее прилагательным. Главное употребление — о том, что копилось со временем: narosłe długi, odsetki, zaległości, konflikty, emocje. Часто с PRZEZ + винительный: narosłe przez lata, «накопившиеся за годы»." }
  - { kind: false-friend, text: "«Наросший» в русском — в основном о наростах, льде, мхе; переносное «накопившиеся долги» звучит у нас иначе. Польское NAROSŁY в переносном смысле обычнее прямого. Существительное NAROŚL, «нарост», — родственное, но не форма этого прилагательного." }
  - { kind: pronunciation, text: "«наро́суы»: Ł — «у», и за ним Y — «ы»: «-суы». Ударение на предпоследнем слоге RO." }
  - { kind: register, text: "Книжно-деловое: экономика, политика, отчёты. В разговоре проще: długi, które się nazbierały." }
collocations:
  - { pl: "narosłe długi", ru: "накопившиеся долги" }
  - { pl: "narosłe przez lata", ru: "накопившиеся за годы" }
  - { pl: "narosłe odsetki", ru: "набежавшие проценты" }
family:
  - { pl: "narosnąć", ru: "нарасти, накопиться", relation: root }
  - { pl: "rosnąć", ru: "расти", relation: root, id: rosnac }
  - { pl: "narośl", ru: "нарост", relation: derived }
etymology: "Причастие прошедшего времени на -ŁY от NAROSNĄĆ, «нарасти»: NA- и ROSNĄĆ, «расти», праславянское *orsti, то же, что русское «расти», «нарастать». Как в русском «наросший», «застарелый», форма превратилась в обычное прилагательное."
memory: "Narosły — наросший, накопившийся: narosłe długi — накопившиеся долги. От narosnąć, «нарасти». Ł + y = «уы»: «наро́суы»."
idioms:
  - { pl: "narosłe przez lata", ru: "накопившиеся за долгие годы" }
formExamplesSkip:
  - { form: "narośli", reason: "мужско-личная форма: narosły говорят о долгах, проблемах, льде, а не о людях; к тому же narośli — форма существительного narośl, «нарост»" }
