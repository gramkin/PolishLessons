notes:
  - { kind: false-friend, text: "Польский PRZEMYSŁ — «промышленность», а не «промысел». Русский «промысел» по-польски чаще RZEMIOSŁO, а рыбный промысел — POŁÓW RYB. «Народные промыслы» — RĘKODZIEŁO. Корень у слов общий: «мысль, замысел», то есть «смекалка, умение»." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. В местном падеже Ł переходит в L и смягчает S: W PRZEMYŚLE. Множественное PRZEMYSŁY — «отрасли»: PRZEMYSŁY KREATYWNE — «креативные индустрии»." }
  - { kind: government, text: "Работать в промышленности — PRACOWAĆ W PRZEMYŚLE, местный. Развитие промышленности — ROZWÓJ PRZEMYSŁU, родительный. Промышленный — PRZEMYSŁOWY: MIASTO PRZEMYSŁOWE." }
  - { kind: pronunciation, text: "Читается «пшэ́мысу», два слога, ударение на первом. PRZ даёт «пш», а конечное Ł — короткое «у», как в POMYSŁ «по́мысу». В местном падеже PRZEMYŚLE: «пшэмы́сьле»." }
collocations:
  - { pl: "przemysł lekki", ru: "лёгкая промышленность" }
  - { pl: "rozwój przemysłu", ru: "развитие промышленности" }
  - { pl: "pracować w przemyśle", ru: "работать в промышленности" }
family:
  - { pl: "przemysłowy", ru: "промышленный", relation: derived }
  - { pl: "przemysłowiec", ru: "промышленник", relation: derived }
  - { pl: "uprzemysłowić", ru: "индустриализировать", relation: derived }
etymology: "От старого глагола со значением «изобретать, придумывать», того же корня, что MYŚL «мысль» и POMYSŁ «идея». Промышленность — дело «смекалки», и русское «промысел» с тем же корнем когда-то значило почти то же самое."
memory: "Przemysł — промышленность, а не промысел. Читается «пшэ́мысу». Przemysł ciężki — тяжёлая промышленность, przemysł rozrywkowy — индустрия развлечений. W przemyśle — в промышленности. Корень тот же, что в myśl и pomysł."
idioms:
  - { pl: "przemysł ciężki", ru: "тяжёлая промышленность" }
  - { pl: "przemysł rozrywkowy", ru: "индустрия развлечений" }
formExamplesSkip:
