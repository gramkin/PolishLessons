# review
id: owak
format: 2
lemma: "owak"
rank: 4870
pos: adv
pron: { cyr: "о́вак" }
senses:
  - id: either-way
    ru: "TAK CZY OWAK — так или иначе, в любом случае"
    examples:
      - pl: "Tak czy owak, musimy jechać."
        ru: "Так или иначе, нам надо ехать."
        source: { kind: authored }
      - pl: "Tak czy owak, to twoja decyzja."
        ru: "В любом случае это твоё решение."
        source: { kind: authored }
      - pl: "Wygramy czy przegramy, tak czy owak będzie zabawa."
        ru: "Выиграем или проиграем, так или иначе будет весело."
        source: { kind: authored }
  - id: this-and-that
    ru: "TAK I OWAK — то так, то этак; и так и сяк"
    examples:
      - pl: "Mówił tak i owak, a niczego nie obiecał."
        ru: "Он говорил и так и сяк, но ничего не обещал."
        source: { kind: authored }
      - pl: "Próbowali tak i owak, ale nic nie wyszło."
        ru: "Пробовали и так и этак, но ничего не вышло."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "OWAK отдельно не употребляется: это осколок старого местоимения OW «тот». Живёт только в парах TAK CZY OWAK «так или иначе» и TAK I OWAK «и так и сяк». Русское «этак» в «так и этак» — точная параллель." }
  - { kind: usage, text: "Неизменяемое наречие. Почти всегда открывает фразу и отделяется запятой: TAK CZY OWAK, MUSIMY IŚĆ «так или иначе, нам надо идти». Синонимы — W KAŻDYM RAZIE, I TAK." }
  - { kind: government, text: "Ничем не управляет. Стоит в паре с TAK: TAK CZY OWAK, TAK I OWAK, TAK LUB OWAK." }
  - { kind: pronunciation, text: "Читается «о́вак»: ударение на первом слоге, W — «в». TAK CZY OWAK произносится слитно: «так чы о́вак»." }
  - { kind: register, text: "Разговорно-нейтральное. TAK CZY OWAK — очень частая связка в живой речи и в публицистике." }
collocations:
  - { pl: "tak czy owak", ru: "так или иначе" }
  - { pl: "tak i owak", ru: "и так и сяк" }
  - { pl: "tak lub owak", ru: "так или этак" }
family:
  - { pl: "tak", ru: "так", relation: root, id: tak }
  - { pl: "inaczej", ru: "иначе", relation: root, id: inaczej }
  - { pl: "owaki", ru: "тот, этакий (в паре TAKI CZY OWAKI)", relation: derived }
etymology: "От старопольского местоимения OW «тот» с частицей -AK, как в TAK. Само OW исчезло, но осталось в OWAK, OWAKI и в книжном ÓWCZESNY «тогдашний»."
memory: "Owak живёт только в паре: tak czy owak — так или иначе. Русская параллель: «так и этак»."
idioms:
  - { pl: "tak czy owak", ru: "так или иначе, в любом случае" }
