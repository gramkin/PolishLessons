# review
id: zafrasowac
format: 2
lemma: "zafrasować"
rank: 5553
pos: verb
aspect: perf
pron: { cyr: "зафрасо́ваць" }
senses:
  - id: worry
    ru: "озаботить, опечалить (zafrasować się)"
    examples:
      - pl: "Zafrasował się tą wiadomością."
        ru: "Он озаботился этой вестью."
        source: { kind: authored }
      - pl: "Matka zafrasowała się nie na żarty."
        ru: "Мать не на шутку обеспокоилась."
        source: { kind: authored }
      - pl: "Nie ma się czym zafrasować."
        ru: "Не о чем беспокоиться."
        source: { kind: authored }
  - id: troubled
    ru: "озабоченный (причастие zafrasowany)"
    examples:
      - pl: "Wrócił zafrasowany."
        ru: "Он вернулся озабоченным."
        source: { kind: authored }
      - pl: "Miał zafrasowaną minę."
        ru: "У него было озабоченное лицо."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Книжное и устаревающее слово. В обычной речи — zmartwić się «огорчиться» или zaniepokoić się «встревожиться»." }
  - { kind: false-friend, text: "Корень frasunek «забота, печаль», из немецкого. С «фрахтом» и «фразой» ничего общего." }
  - { kind: government, text: "Чем озабочен — творительный падеж: zafrasować się wiadomością." }
  - { kind: usage, text: "Чаще всего встречается причастие zafrasowany «озабоченный». В корпусе слово не встречается совсем." }
collocations:
  - { pl: "zafrasowana mina", ru: "озабоченное лицо" }
etymology: "От frasunek «забота, печаль», заимствованного из немецкого."
memory: "zafrasować się — книжное «озаботиться, опечалиться». Чаще встречается причастие zafrasowany «озабоченный». Обиходные слова — zmartwić się, zaniepokoić się."
idioms:
  - { pl: "zafrasowana mina", ru: "озабоченное лицо" }
