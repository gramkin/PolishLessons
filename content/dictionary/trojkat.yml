etymology: "Сложение из TRÓJ-, от праславянского числительного «три», и KĄT «угол». Вторая часть восходит к праславянскому слову с носовым, давшему русское «кут» и «закуток», а не «угол». Поэтому родство слышно не сразу: польский KĄT и русский «кут» это одно слово, только у нас оно ушло в областную речь и в «закуток», а у поляков осталось главным названием угла. Соединительная часть TRÓJ- отвечает русскому «тре-» в «треугольнике» и «трёх-» в «трёхмерном»."
memory: "Собрано как «треугольник»: trój- это «тре-», kąt это «угол». Но kąt родствен не «углу», а «куту» из «закутка», и значит у поляков ещё и угол комнаты, и жильё: mieć własny kąt «иметь свой угол». Читается «тру́йконт», где ó даёт «у». В местном падеже t переходит в cie: w trójkącie, «труйко́нце». Приставка trój- складывает новые слова: trójwymiarowy «трёхмерный»."
