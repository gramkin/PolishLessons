notes:
  - { kind: false-friend, text: "Слово собрано ровно как русское «треугольник»: TRÓJ- это «тре-, трёх-», а KĄT это «угол». Понять его легко, но вторая половина обманчива. Польское KĄT родственно не русскому «углу», а слову «кут», которое мы помним по «закутку»: это угол комнаты, закоулок. И KĄT по-польски значит и геометрический угол, и угол в комнате, и в переносном смысле «угол» как жильё: MIEĆ WŁASNY KĄT «иметь свой угол»." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Основа не меняется, носовой Ą стоит во всех падежах. В местном падеже T переходит в CIE: TRÓJKĄT, но W TRÓJKĄCIE, и это обычное польское чередование, как MIASTO — W MIEŚCIE. Прилагательное TRÓJKĄTNY значит «треугольный». Приставка TRÓJ- живая и складывает новые слова: TRÓJWYMIAROWY «трёхмерный», TRÓJKOLOROWY «трёхцветный», TRÓJNÓG «тренога»." }
  - { kind: government, text: "В треугольнике — W TRÓJKĄCIE, предлог W с местным падежом, и русский строит так же. Нарисовать треугольник — NARYSOWAĆ TRÓJKĄT, винительный без предлога, совпадающий с именительным, потому что слово неодушевлённое. О треугольнике — O TRÓJKĄCIE, предлог O с местным. Сумма углов в треугольнике — SUMA KĄTÓW W TRÓJKĄCIE, где KĄTÓW это родительный множественного от KĄT." }
  - { kind: pronunciation, text: "Читается «тру́йконт», два слога, ударение на первом. Буква Ó даёт «у», и это не опечатка: Ó и U читаются в польском одинаково, а пишутся по-разному по историческим причинам. Буква J даёт «й», Ą перед согласным даёт «он». В местном падеже TRÓJKĄCIE звучит «труйко́нце», три слога, ударение переходит на предпоследний, и сочетание CIE даёт мягкое «це»." }
  - { kind: register, text: "Слово нейтральное. В школе и в математике это фигура: TRÓJKĄT RÓWNORAMIENNY «равнобедренный треугольник», TRÓJKĄT PROSTOKĄTNY «прямоугольный». В быту так называют предметы треугольной формы, прежде всего TRÓJKĄT OSTRZEGAWCZY, знак аварийной остановки, который по закону лежит в каждой машине. А TRÓJKĄT MAŁŻEŃSKI это «любовный треугольник», выражение книжное и слегка насмешливое." }
