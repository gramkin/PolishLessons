# review
id: pierwszy
format: 2
lemma: "pierwszy"
rank: 137
pos: adj
pron: { cyr: "пе́рфшы" }
senses:
  - id: first
    ru: "первый (по порядку, по счёту)"
    examples:
      - pl: "Ty pierwszy."
        ru: "Ты первый."
        source: { kind: tatoeba, id: 2830002 }
      - pl: "Pierwszy raz tu jestem."
        ru: "Я тут в первый раз."
        source: { kind: tatoeba, id: 12950794 }
      - pl: "To była jej pierwsza praca."
        ru: "Это была её первая работа."
        source: { kind: tatoeba, id: 2265379 }
      - pl: "Dzisiaj spadł pierwszy śnieg."
        ru: "Сегодня выпал первый снег."
        source: { kind: tatoeba, id: 4418130 }
  - id: date
    ru: "первое (о дате и о часе)"
    note: "Дата стоит в родительном падеже: pierwszego maja «первого мая»; час — o pierwszej «в час»."
    examples:
      - pl: "Dziś jest pierwszy września."
        ru: "Сегодня первое сентября."
        source: { kind: tatoeba, id: 2149158 }
      - pl: "Spotkajmy się o pierwszej."
        ru: "Встретимся в час."
        source: { kind: authored }
      - pl: "Wrócę pierwszego lipca."
        ru: "Я вернусь первого июля."
        source: { kind: authored }
notes:
  - { kind: usage, text: "po pierwsze — «во-первых»; na pierwszy rzut oka — «на первый взгляд»; pierwszy raz — «в первый раз»." }
  - { kind: usage, text: "Как и в русском, слово может значить «первым»: On przyszedł pierwszy «Он пришёл первым»." }
collocations:
  - { pl: "po pierwsze", ru: "во-первых" }
  - { pl: "pierwszy raz", ru: "первый раз" }
  - { pl: "na pierwszy rzut oka", ru: "на первый взгляд" }
  - { pl: "pierwsza klasa", ru: "первый класс" }
etymology: "Сравнительная степень от старопольского pierwy; праславянское *pьrvъ — то же слово, что русское «первый». Форма pierwy жила ещё в XVI веке."
memory: "Даты и часы строятся как в русском: pierwszego maja «первого мая», o pierwszej «в час». А po pierwsze — «во-первых»."
idioms:
  - { pl: "grać pierwsze skrzypce", ru: "играть первую скрипку" }
  - { pl: "miłość od pierwszego wejrzenia", ru: "любовь с первого взгляда" }
  - { pl: "kto pierwszy, ten lepszy", ru: "кто первый, тот и успел" }
