# review
id: wygrac
format: 2
lemma: "wygrać"
rank: 403
pos: verb
aspect: perf
pron: { cyr: "вы́граць" }
senses:
  - id: win
    ru: "выиграть, победить"
    examples:
      - pl: "Wygraliście?"
        ru: "Вы выиграли?"
        source: { kind: tatoeba, id: 6729534 }
      - pl: "Wygraliśmy bitwę."
        ru: "Мы выиграли битву."
        source: { kind: tatoeba, id: 536927 }
      - pl: "On nie wygra."
        ru: "Он не выиграет."
        source: { kind: translated, id: 8675045 }
  - id: win-prize
    ru: "выиграть (приз, в лотерею)"
    examples:
      - pl: "Wygrała telefon."
        ru: "Она выиграла телефон."
        source: { kind: translated, id: 9679391 }
      - pl: "Wygrał samochód w loterii."
        ru: "Он выиграл машину в лотерею."
        source: { kind: authored }
      - pl: "Ted był pewien wygranej w grze."
        ru: "Тед был уверен в выигрыше."
        source: { kind: translated, id: 524649 }
notes:
  - { kind: usage, text: "Несовершенный вид — wygrywać: wygrać значит «выиграть один раз», wygrywać — «выигрывать, побеждать регулярно»." }
  - { kind: usage, text: "wygrana — не только причастие, но и полноценное существительное «выигрыш, победа»: Wygrana to nie wszystko «Победа — это не всё»." }
  - { kind: usage, text: "dać za wygraną — «махнуть рукой, сдаться»: Nie dam za wygraną «Я не сдамся»." }
  - { kind: usage, text: "Выигрывают что-то (винительный падеж) или у кого-то — z + творительный: wygrać mecz «выиграть матч», wygrać z Niemcami «выиграть у немцев»." }
collocations:
  - { pl: "wygrać mecz", ru: "выиграть матч" }
  - { pl: "wygrać wybory", ru: "выиграть выборы" }
  - { pl: "dać za wygraną", ru: "сдаться" }
  - { pl: "wygrana", ru: "выигрыш, победа" }
etymology: "Из wy- + grać «играть». Слово собрано буква в букву как русское «выиграть»: приставка даёт тот же результативный оттенок."
memory: "wygrać — «выиграть», и собрано слово в точности как русское: wy- + grać = «вы-» + «играть». Существительное wygrana значит «выигрыш, победа», а dać za wygraną — «махнуть рукой, сдаться»."
idioms:
  - { pl: "dać za wygraną", ru: "сдаться, махнуть рукой" }
  - { pl: "wygrać los na loterii", ru: "вытянуть счастливый билет" }
  - { pl: "wygrana to nie wszystko", ru: "победа — это не всё" }
