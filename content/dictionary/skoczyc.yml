# review
id: skoczyc
format: 2
lemma: "skoczyć"
rank: 2008
pos: verb
pron: { cyr: "ско́чыць" }
senses:
  - id: jump
    ru: "прыгнуть, скакнуть"
    examples:
      - pl: "Skoczył przez płot bez rozbiegu."
        ru: "Он перепрыгнул через забор без разбега."
        source: { kind: authored }
      - pl: "Skoczyła do wody pierwsza."
        ru: "Она прыгнула в воду первой."
        source: { kind: authored }
      - pl: "Ceny skoczyły o dziesięć procent."
        ru: "Цены подскочили на десять процентов."
        source: { kind: authored }
  - id: pop-out
    ru: "разг. сбегать, сходить ненадолго"
    examples:
      - pl: "Skoczę po chleb i zaraz wracam."
        ru: "Сбегаю за хлебом и сразу вернусь."
        source: { kind: authored }
      - pl: "Skocz do apteki, zanim zamkną."
        ru: "Сбегай в аптеку, пока не закрыли."
        source: { kind: authored }
  - id: jumping
    ru: "skoczenie — прыжок (как действие)"
    examples:
      - pl: "Skoczenie z takiej wysokości to szaleństwo."
        ru: "Прыгнуть с такой высоты — безумие."
        source: { kind: authored }
      - pl: "Po skoczeniu do wody od razu zmarzł."
        ru: "Прыгнув в воду, он сразу замёрз."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Корень родной, хотя русский глагол без приставки почти не живёт: skoczyć — это «скочить», как во «ВСКОЧИТЬ», «ВЫСКОЧИТЬ», «ПОДСКОЧИТЬ». Отсюда skok «скок, прыжок» и skakać «скакать». Переносное значение тоже совпадает: ceny skoczyły — «цены подскочили»." }
  - { kind: government, text: "РАСХОЖДЕНИЕ В ПРЕДЛОГЕ, И ОНО ЧАСТОЕ. Сбегать ЗА чем-то по-польски будет skoczyć PO coś — предлог po с ВИНИТЕЛЬНЫМ: skoczyć po chleb, po gazetę, po lekarza. Русский тут ставит «за» с творительным. Прочие направления обычные: skoczyć DO wody, NA dach, PRZEZ płot." }
  - { kind: register, text: "Второе значение чисто разговорное и очень частое: skoczę po zakupy значит просто «сбегаю за покупками», безо всякого прыганья. Так же skoczyć do kogoś — «забежать к кому-то на минуту». В официальной речи лучше wstąpić или pójść." }
  - { kind: usage, text: "Вид совершенный, несовершенная пара — skakać «скакать, прыгать»: skakał przez kałuże «он прыгал через лужи», но skoczył raz «прыгнул один раз». Глагол непереходный, поэтому страдательного причастия у него нет — всего сорок две формы." }
collocations:
  - { pl: "skoczyć po chleb", ru: "сбегать за хлебом" }
  - { pl: "skoczyć do wody", ru: "прыгнуть в воду" }
  - { pl: "ceny skoczyły", ru: "цены подскочили" }
family:
  - { pl: "skakać", ru: "прыгать, скакать", relation: aspect }
  - { pl: "skok", ru: "прыжок", relation: root }
  - { pl: "podskoczyć", ru: "подскочить", relation: derived }
etymology: "Общеславянский корень *skok-, тот же, что в русских «скок», «скакать», «вскочить», «выскочить». Польский сохранил простой глагол skoczyć там, где русский обходится приставочными. Отсюда skok «прыжок», skoczek «прыгун» и skocznia «трамплин»."
memory: "skoczyć — «прыгнуть», корень как во «вскочить». Но запомните разговорное значение: skoczę po chleb — «сбегаю за хлебом», и предлог тут PO с винительным, а не русское «за» с творительным."
idioms:
  - { pl: "skoczyć komuś do gardła", ru: "вцепиться кому-л. в горло" }
  - { pl: "skoczyć po coś", ru: "сбегать за чем-л." }
