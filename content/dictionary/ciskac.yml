# review
id: ciskac
format: 2
lemma: "ciskać"
rank: 6089
pos: verb
aspect: imperf
pron: { cyr: "ци́скаць" }
senses:
  - id: hurl
    ru: "швырять, бросать с силой (часто в гневе)"
    examples:
      - pl: "Ciskał talerze o podłogę."
        ru: "Он швырял тарелки об пол."
        source: { kind: authored }
      - pl: "Demonstranci ciskali kamieniami w policję."
        ru: "Демонстранты бросали камни в полицию."
        source: { kind: authored }
      - pl: "Morze ciskało statkiem jak łupiną."
        ru: "Море швыряло корабль, как скорлупку."
        source: { kind: authored }
  - id: hurl-words
    ru: "перен. сыпать, метать (проклятия, обвинения; громы и молнии)"
    examples:
      - pl: "Szef ciska gromy na cały zespół."
        ru: "Начальник мечет громы и молнии на всю команду."
        source: { kind: authored }
      - pl: "Jej oczy ciskają błyskawice."
        ru: "Её глаза мечут молнии."
        source: { kind: authored }
  - id: rage
    ru: "разг. ciskać się — беситься, психовать; метаться, рваться"
    examples:
      - pl: "Znowu się ciskasz o drobiazg."
        ru: "Ты опять бесишься из-за мелочи."
        source: { kind: authored }
      - pl: "Psy ciskają się na łańcuchach."
        ru: "Собаки рвутся на цепях."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Не «тискать»! Русское «тискать» — сжимать, а CISKAĆ — швырять. Корень общий (*tisk- «давить, жать»), но польский развил значение «с силой пустить от себя». «Тискать» по-польски — ŚCISKAĆ, MIĘTOSIĆ." }
  - { kind: government, text: "Чем швыряют — винительный или творительный: CISKAĆ KAMIENIE и CISKAĆ KAMIENIAMI, как в русском «бросать камни» и «бросаться камнями». В кого — W с винительным: W POLICJĘ. Обо что — O с винительным: O PODŁOGĘ. На кого гневаются — NA с винительным: CISKAĆ GROMY NA KOGOŚ." }
  - { kind: usage, text: "Совершенный вид — CISNĄĆ «швырнуть»: CISNĄŁ KAMIEŃ. Но CISNĄĆ — ещё и несовершенное «жать, давить»: BUTY MNIE CISNĄ «ботинки жмут». Различает контекст. CISKAĆ SIĘ — разговорное «беситься», а о звере — «метаться, рваться»." }
  - { kind: pronunciation, text: "CI — «ци»: «ци́скаць», ударение на первом слоге. CISKAJĄ — «циска́йоу̃»." }
  - { kind: register, text: "Экспрессивнее, чем RZUCAĆ: всегда с силой, часто со злостью. Нейтрально «бросить мяч» — RZUCIĆ PIŁKĘ; CISKAĆ PIŁKĄ — швыряться мячом." }
collocations:
  - { pl: "ciskać gromy", ru: "метать громы и молнии" }
  - { pl: "ciskać kamieniami", ru: "бросаться камнями" }
  - { pl: "ciskać przekleństwa", ru: "сыпать проклятиями" }
  - { pl: "ciskać oskarżenia", ru: "бросаться обвинениями" }
  - { pl: "oczy ciskają błyskawice", ru: "глаза мечут молнии" }
family:
  - { pl: "cisnąć", ru: "швырнуть; жать, давить", relation: aspect }
  - { pl: "ściskać", ru: "сжимать", relation: derived }
  - { pl: "wyciskać", ru: "выжимать", relation: derived }
synonyms: ["rzucać", "miotać", "rzucać się"]
etymology: "Праславянское *tiskati, *tisnǫti «давить, жать»; польское TI перешло в CI. Русское «тискать», «тиснуть», «теснить» — родня. Значение «швырять» развилось в польском из «сильно толкнуть, выдавить от себя»; у CISNĄĆ сохранились оба значения."
memory: "CISKAĆ GROMY — метать громы. По-русски «тискать» значит сжимать, а поляк, наоборот, не держит: швыряет."
idioms:
