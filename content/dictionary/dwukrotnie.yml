# review
id: dwukrotnie
format: 2
lemma: "dwukrotnie"
rank: 4348
pos: adv
pron: { cyr: "двукро́тне" }
senses:
  - id: twice
    ru: "дважды"
    examples:
      - pl: "Dwukrotnie zdobył mistrzostwo Polski."
        ru: "Он дважды становился чемпионом Польши."
        source: { kind: authored }
      - pl: "Dzwoniłem do niego dwukrotnie."
        ru: "Я звонил ему дважды."
        source: { kind: authored }
      - pl: "Spotkaliśmy się dwukrotnie w tym roku."
        ru: "В этом году мы встречались дважды."
        source: { kind: authored }
  - id: twofold
    ru: "вдвое"
    examples:
      - pl: "Nowy dom jest dwukrotnie większy od starego."
        ru: "Новый дом вдвое больше старого."
        source: { kind: authored }
      - pl: "Liczba turystów dwukrotnie wzrosła."
        ru: "Число туристов выросло вдвое."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "DWUKROTNIE — и «дважды», и «вдвое»: DWUKROTNIE WYGRAŁ, «дважды выиграл», но DWUKROTNIE WIĘKSZY, «вдвое больше». Русское «двукратно» звучит книжно, а польское слово обычно для новостей и статистики." }
  - { kind: usage, text: "Наречие, одна форма. В разговоре чаще DWA RAZY: DWA RAZY WIĘKSZY. По той же модели: TRZYKROTNIE, «трижды, втрое», WIELOKROTNIE, «многократно»." }
  - { kind: government, text: "Наречие ничем не управляет. С прилагательным в сравнительной степени объект сравнения — OD с родительным или NIŻ с именительным: DWUKROTNIE WIĘKSZY OD STAREGO, DWUKROTNIE WIĘKSZY NIŻ STARY." }
  - { kind: pronunciation, text: "Читается «двукро́тне», ударение на предпоследнем слоге. DW — звонкое «дв», TNIE — «тне»." }
collocations:
  - { pl: "dwukrotnie większy", ru: "вдвое больше" }
  - { pl: "dwukrotnie wzrosnąć", ru: "вырасти вдвое" }
  - { pl: "dwukrotnie wyższy", ru: "вдвое выше" }
family:
  - { pl: "dwukrotny", ru: "двукратный", relation: derived }
  - { pl: "dwa", ru: "два", relation: root, id: dwa }
  - { pl: "wielokrotnie", ru: "многократно", relation: root }
etymology: "DWU- «двух-» + старое KROĆ «раз», родственное русскому «кратный»: двукратно, многократно. В польском осталось и в книжном TYSIĄCKROĆ, «тысячу раз»."
memory: "Dwukrotnie — дважды и вдвое: dwukrotnie wygrał, dwukrotnie większy. Читается «двукро́тне». В разговоре — dwa razy."
idioms:
  - { pl: "po raz drugi", ru: "во второй раз" }
