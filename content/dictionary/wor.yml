# review
id: wor
format: 2
lemma: "wór"
rank: 5961
pos: noun
pron: { cyr: "ву́р" }
senses:
  - id: sack
    ru: "большой мешок, куль"
    examples:
      - { pl: "Wór mąki waży pięćdziesiąt kilogramów.", ru: "Куль муки весит пятьдесят килограммов.", source: { kind: authored } }
      - { pl: "Niósł na plecach ciężki wór.", ru: "Он нёс на спине тяжёлый мешок.", source: { kind: authored } }
      - { pl: "Święty Mikołaj ma wór pełen prezentów.", ru: "У Деда Мороза мешок, полный подарков.", source: { kind: authored } }
  - id: under-eyes
    ru: "wory pod oczami — набрякшие мешки под глазами (разг.)"
    examples:
      - { pl: "Po tej nocy mam wory pod oczami.", ru: "После этой ночи у меня мешки под глазами.", source: { kind: authored } }
      - { pl: "Wory pod oczami zdradzały, że nie spał.", ru: "Мешки под глазами выдавали, что он не спал.", source: { kind: authored } }
notes:
  - { kind: usage, text: "WÓR — большой мешок, куль; обычный мешок — WOREK, мешочек — WORECZEK. Wór звучит тяжелее и грубее: WÓR ZIEMNIAKÓW, WÓR Z PREZENTAMI." }
  - { kind: pronunciation, text: "Ó есть только в именительном и винительном: WÓR, но WORA, WORZE, WORY — как STÓŁ, STOŁU. Читается «ву́р», конечное R не оглушается. В предложном R смягчается в RZ: W WORZE «в во́же»." }
  - { kind: usage, text: "В родительном единственного две формы, WORA и WORU; обе правильны. Мужской род, неодушевлённый: винительный совпадает с именительным — WIDZĘ WÓR." }
  - { kind: register, text: "WORY POD OCZAMI — разговорное и более резкое, чем нейтральное WORKI POD OCZAMI: так говорят о сильно набрякших мешках после бессонной ночи." }
collocations:
  - { pl: "wór ziemniaków", ru: "мешок картошки" }
  - { pl: "wór z prezentami", ru: "мешок с подарками" }
  - { pl: "wory pod oczami", ru: "мешки под глазами" }
family:
  - { pl: "worek", ru: "мешок", relation: derived, id: worek }
  - { pl: "woreczek", ru: "мешочек", relation: derived }
synonyms: ["worek", "sak"]
etymology: "Исконное слово; по-видимому, связано с корнем со значением «запирать, завязывать», как русские «затвор» и «отворить». От него образованы worek и woreczek."
memory: "Wór — большой куль, worek — обычный мешок. Ó только в начальной форме: wór, но wora, w worze."
idioms:
  - { pl: "wór pokutny", ru: "власяница; włożyć wór pokutny — публично каяться" }
  - { pl: "wory pod oczami", ru: "мешки под глазами" }
