notes:
  - { kind: usage, text: "СУЩЕСТВИТЕЛЬНОЕ МУЖСКОГО РОДА, А СКЛОНЯЕТСЯ ПО-ЖЕНСКИ. Zwycięzca, zwycięzcy, zwycięzcę, zwycięzcą — окончания женские, как у kobieta, хотя речь о мужчине: ten zwycięzca, nasz zwycięzca. Так ведёт себя целый класс: mężczyzna, kolega, poeta, artysta, kierowca. Русский знает то же явление по словам «мужчина», «дядя», «коллега»." }
  - { kind: pronunciation, text: "Четыре слога, ударение на предпоследнем: zwy-CIĘZ-ca. Ci читается как ць, ę перед z даёт «эн», а cz сливается в «ц»: «звыце́нзца». Во множественном числе именительный совпадает с родительным единственного: zwycięzcy." }
  - { kind: false-friend, text: "Корень родствен русскому «ВИТЯЗЬ». Zwycięstwo и zwyciężyć возводят к старому *vitędzь «герой, победитель», которое дало и русского «витязя»; само оно считается давним заимствованием из германских языков. Русское «победитель» построено иначе — от «победить», то есть «по-бедить», одолеть бедой." }
collocations:
  - { pl: "zwycięzca konkursu", ru: "победитель конкурса" }
  - { pl: "ogłosić zwycięzcę", ru: "объявить победителя" }
  - { pl: "historię piszą zwycięzcy", ru: "историю пишут победители" }
family:
  - { pl: "zwyciężyć", ru: "победить", relation: root }
  - { pl: "zwycięstwo", ru: "победа", relation: derived, id: zwyciestwo }
  - { pl: "przegrany", ru: "проигравший", relation: antonym }
etymology: "От zwyciężyć «победить», которое связывают со старым *vitędzь «витязь, победитель» — тем же словом, что русский «витязь», пришедшим к славянам, по общему мнению, из германских языков. Суффикс -ca называет деятеля, как в kierowca «водитель» и obrońca «защитник», и тянет за собой женское склонение."
memory: "zwycięzca — «победитель», мужского рода, но склоняется по-женски: zwycięzcy, zwycięzcę, zwycięzcą — как mężczyzna и kolega, как русские «мужчина» и «дядя». Корень связан с «витязем»."
idioms:
