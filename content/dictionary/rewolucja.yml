etymology: "Из латинского REVOLUTIO «поворот, обращение», от REVOLVERE «поворачивать назад», сложенного из RE- и VOLVERE «вращать». Первоначально это был астрономический термин о круговом движении светил, и лишь в семнадцатом веке, после английских событий, слово получило политический смысл. Оба наших языка взяли его через французский в восемнадцатом веке и в одном и том же значении, поэтому расхождений нет. Суффикс -CJA, которым польский передаёт латинское -TIO, отвечает русскому -ЦИЯ механически, и это соответствие охватывает несколько тысяч слов. От того же VOLVERE происходят EWOLUCJA «эволюция» и WOLUMEN «том», где исходное вращение свитка видно прямо."
memory: "Полное совпадение, и за ним правило на тысячи слов: польское -cja равно русскому -ция без исключений — rewolucja, informacja, stacja, sytuacja. Основу только не удваивать: kolekcja против «коллекции». Родительный, дательный и местный единственного — одна форма rewolucji, она же родительный множественного; архаичная рядом — rewolucyj через -yj, тогда как у слов на -ia через -ij: akademij."
