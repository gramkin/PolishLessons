notes:
  - { kind: false-friend, text: "Значение совпадает с русским полностью, и за этим совпадением стоит общее правило, которое стоит выучить раз и навсегда: польское -CJA отвечает русскому -ЦИЯ без исключений. REWOLUCJA и «революция», INFORMACJA и «информация», STACJA и «станция», SYTUACJA и «ситуация». Зная это, можно переносить в польский почти любое русское слово на -ЦИЯ, заменив окончание, и попасть точно. Отличается только написание основы: польский не удваивает согласные, поэтому KOLEKCJA против «коллекции». Прилагательное REWOLUCYJNY значит «революционный», а REWOLUCJONISTA — «революционер»." }
  - { kind: usage, text: "Родительный, дательный и местный единственного совпадают в одной форме REWOLUCJI, и она же служит родительным множественного. Рядом живёт старая форма родительного множественного REWOLUCYJ, на -YJ: она встречается в текстах девятнадцатого века и звучит сегодня архаично. Обратите внимание на разницу внутри типа: у слов на -CJA и -ZJA старая форма идёт через -YJ (REWOLUCYJ, KAUCYJ, FANTAZYJ), а у слов на -IA через -IJ (AKADEMIJ, CEREMONIJ). Решает то, стоит ли перед окончанием J или I. Именительный множественного — REWOLUCJE." }
  - { kind: government, text: "Женский род. Какая революция — прилагательное: REWOLUCJA PRZEMYSŁOWA «промышленная революция», REWOLUCJA CYFROWA «цифровая революция», REWOLUCJA FRANCUSKA. Частотные глаголы: WYBUCHNĄĆ «вспыхнуть» — REWOLUCJA WYBUCHŁA; PRZEPROWADZIĆ REWOLUCJĘ «совершить революцию»; DOKONAĆ REWOLUCJI «произвести революцию», и этот глагол требует родительного, а не винительного. Устойчивое оборотное значение: ZROBIĆ REWOLUCJĘ W CZYMŚ «устроить переворот в чём-то», например в шкафу или в расписании, и в быту это слышно чаще политического смысла." }
  - { kind: pronunciation, text: "Читается «рэволю́цья», четыре слога, ударение на предпоследнем. Буква E в первом слоге даёт «э» без смягчения, поэтому начало звучит «рэ», а не «ре». Буква W читается «в». Сочетание CJ даёт «ць» с последующим «я», то есть слитное «цья». В форме REWOLUCJI конечное -I это «и»: «рэволю́цьи». В старой форме REWOLUCYJ буква Y даёт «ы», а конечное J — «й»: «рэволю́цый»." }
