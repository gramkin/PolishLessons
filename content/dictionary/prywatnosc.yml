etymology: "От PRYWATNY, из латинского PRIVATUS «отделённый, частный», причастия глагола PRIVARE «отделять, лишать», от PRIVUS «отдельный». Исходный смысл — «изъятый из общего», и в римском праве PRIVATUS противопоставлялся PUBLICUS. Оба наших языка взяли прилагательное через западноевропейское посредство, а существительное на -OŚĆ и -ОСТЬ образовали уже сами, каждый своим суффиксом, который в обоих случаях восходит к праславянскому *-ostь. Поэтому слово наполовину латинское, наполовину славянское, и устроено в двух языках одинаково. От того же PRIVARE происходит PRYWATYZACJA «приватизация» и, через другую ветвь, DEPRYWACJA «депривация»."
memory: "Половина латинская, половина славянская: prywatny от privatus плюс наш суффикс -ość, равный русскому -ость. Но употребляется шире русской «приватности»: и юридически (ochrona prywatności), и бытово — nie mam tu żadnej prywatności «у меня нет личного пространства». Prawo DO prywatności, с родительным, тогда как по-русски «право НА». Шесть форм; prywatności работает за пятерых."
