notes:
  - { kind: false-friend, text: "Слово новое в обоих языках и построено одинаково, от латинского PRIVATUS «частный», но объём употребления разный. Польская PRYWATNOŚĆ покрывает и юридическое понятие — OCHRONA PRYWATNOŚCI «защита приватности», PRAWO DO PRYWATNOŚCI, — и бытовое «личное пространство»: NIE MAM TU ŻADNEJ PRYWATNOŚCI «у меня здесь нет никакого личного пространства». Русская «приватность» звучит более технически и в быту употребляется редко, поэтому по-русски чаще скажут «частная жизнь» или «личное пространство». Прилагательное PRYWATNY значит «частный»: PRYWATNA FIRMA «частная фирма», PRYWATNE ŻYCIE «личная жизнь», и в этом значении оно куда употребительнее русского «приватный»." }
  - { kind: usage, text: "Шесть форм, как у всех существительных на -OŚĆ, и форма PRYWATNOŚCI работает за пятерых: родительный, дательный и местный единственного плюс именительный, винительный и родительный множественного. На практике множественное число у этого слова почти не встречается, потому что понятие отвлечённое, но формы существуют и в таблице заполнены. Сравните с ZNAJOMOŚĆ, где множественное вполне живое и значит «связи», и с GARŚĆ, у которой есть отдельный именительный множественного GARŚCIE и потому семь форм. Один тип, три разных поведения в числе." }
  - { kind: government, text: "Женский род. Чья приватность — родительный или притяжательное: PRYWATNOŚĆ PACJENTA, MOJA PRYWATNOŚĆ. Частотные сочетания: OCHRONA PRYWATNOŚCI «защита приватности», PRAWO DO PRYWATNOŚCI «право на приватность» — с предлогом DO и родительным, тогда как по-русски нужен предлог «на» с винительным; NARUSZYĆ PRYWATNOŚĆ «нарушить приватность», SZANOWAĆ PRYWATNOŚĆ «уважать приватность». В документах встречается POLITYKA PRYWATNOŚCI «политика конфиденциальности», и это стандартный перевод для сайтов." }
  - { kind: pronunciation, text: "Читается «прыва́тносьць», четыре слога, ударение на предпоследнем. Буква Y в первом слоге даёт «ы», поэтому начало звучит «пры», а не «при». Буква W между гласными читается «в». Конечное -ŚĆ это «сьць», два мягких согласных подряд. В форме PRYWATNOŚCI конечное -I даёт «и» и сохраняет мягкость: «прыва́тносьци». Сочетание TN выговаривается слитно, без вставной гласной." }
