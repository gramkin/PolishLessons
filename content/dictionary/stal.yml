etymology: "Заимствование из германских языков: немецкое STAHL, и дальше к общегерманскому корню со значением «твёрдый, стойкий». Польский взял слово напрямую у немцев, с которыми граничил и торговал железом; русский получил его тем же путём через северные торговые связи, и потому два слова так похожи — это не родство, а общий источник. Славянского названия у стали не было вовсе: материал пришёл вместе с ремеслом и с его немецким именем, как HUTA от немецкого HÜTTE и BLACHA от BLECH. Весь этот слой металлургической лексики в польском германского происхождения, и русскому он знаком по тем же словам: «гута», «бляха», «шлак», «штольня»."
memory: "Совпадает с русской «сталью» во всём, включая женский род: оба слова от немецкого Stahl, вместе с целым слоем металлургических терминов (huta, blacha). Ловушка не в значении, а в омонимах: stali это и родительный от stal, и «они стояли» от stać; stale это и множественное число, и наречие «постоянно». И не путать l с ł: stał значит «он стоял» и читается «стау»."
