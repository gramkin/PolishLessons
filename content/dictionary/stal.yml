notes:
  - { kind: false-friend, text: "Слово и значение совпадают с русской «сталью», и род тоже женский, так что согласования переносятся прямо. Опасность в другом — в омонимах внутри польского. Форма STALI это не только родительный от STAL, но и прошедшее время глагола STAĆ в мужском лице множественного числа: STALI POD DRZWIAMI значит «они стояли у дверей». Форма STALE это не только именительный множественного, но и очень частое наречие «постоянно, всё время»: STALE SIĘ SPÓŹNIA «он постоянно опаздывает». Различает их только строй фразы, и для читающего это главная трудность в этом слове." }
  - { kind: usage, text: "Семь форм, женский род, старое склонение на мягкую основу — то самое, по которому идут MYŚL, SÓL и KOŚĆ. Форма STALI покрывает родительный, дательный и местный единственного и родительный множественного: ZE STALI, W STALI, DWÓCH STALI. Творительный единственного — STALĄ. Множественное STALE употребляется только в техническом значении, о марках: STALE NARZĘDZIOWE, STALE NIERDZEWNE; о стали как веществе говорят только в единственном. Материал выражается предлогом Z с родительным: MOST ZE STALI, буквально «мост из стали»." }
  - { kind: pronunciation, text: "Читается «сталь», один слог, и конечное L здесь мягкое — по-польски обычное L всегда мягче русского твёрдого «л», а на конце слова это особенно слышно. В форме STALI сочетание LI звучит «ли»: «ста́ли», с ударением на первом слоге. В форме STALĄ последнее Ą даёт «он»: «ста́лон». В форме STALE слышно «ста́ле». Важно не спутать букву L с Ł: STAŁ с перечёркнутым Ł — это «он стоял», и читается «стау», совсем иначе." }
  - { kind: register, text: "Слово нейтральное, обиходное и техническое одновременно. Устойчивые сочетания: STAL NIERDZEWNA «нержавеющая сталь», STAL NARZĘDZIOWA «инструментальная сталь», HARTOWAĆ STAL «закалять сталь». Переносное NERWY ZE STALI «стальные нервы» и прилагательное STALOWY в значении цвета — STALOWE NIEBO «стальное небо» — употребляются так же, как по-русски. В спортивных названиях STAL стоит без склонения как имя клуба. Звательная форма у слова не употребляется." }
