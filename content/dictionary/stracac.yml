      - pl: "Dziadek strącał popiół do popielniczki."
        ru: "Дед стряхивал пепел в пепельницу."
        source: { kind: authored }
  - id: shoot-down
    ru: "сбивать (самолёты, дроны, ракеты)"
    examples:
      - pl: "Prywatne samoloty oligarchów bywają strącane przez drony."
        ru: "Частные самолёты олигархов порой сбивают дроны."
        source: { kind: translated, id: 12014011 }
      - pl: "Obrona przeciwlotnicza strąca większość rakiet."
        ru: "ПВО сбивает большую часть ракет."
        source: { kind: authored }
  - id: topple
    ru: "перен. свергать, низвергать (с трона, пьедестала); понижать (в лиге)"
    examples:
      - pl: "Krytycy lubią strącać idoli z piedestału."
        ru: "Критики любят свергать кумиров с пьедестала."
        source: { kind: authored }
      - pl: "Każda porażka strącała klub niżej w tabeli."
        ru: "Каждое поражение отбрасывало клуб ниже в таблице."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "STRĄCAĆ — «сбивать, сбрасывать», от TRĄCAĆ «толкать, задевать». Не путайте с STRACIĆ «потерять, утратить» (без носового): STRĄCIĆ SAMOLOT «сбить самолёт», но STRACIĆ PIENIĄDZE «потерять деньги». Разница только в Ą." }
  - { kind: government, text: "Что — винительный, откуда — Z + родительный: STRĄCAĆ ŚNIEG Z DACHU, STRĄCAĆ KOGOŚ Z KONIA. Куда — DO + родительный: STRĄCAĆ DO WODY, STRĄCAĆ DO NIŻSZEJ LIGI." }
  - { kind: usage, text: "Несовершенный вид: процесс или повторение — STRĄCA JABŁKA KIJEM. Совершенный — STRĄCIĆ: STRĄCIŁ SAMOLOT «сбил самолёт». Спряжение на -AM: STRĄCAM, STRĄCASZ, STRĄCAJĄ." }
  - { kind: pronunciation, text: "Ą перед C читается «он»: STRĄCAĆ — «стро́нцаць», STRĄCA — «стро́нца». Без носового призвука получится STRACAĆ — такого слова нет, а рядом STRACIĆ «потерять»." }
collocations:
  - { pl: "strącać samoloty", ru: "сбивать самолёты" }
  - { pl: "strącać popiół", ru: "стряхивать пепел" }
  - { pl: "strącać śnieg z dachu", ru: "сбрасывать снег с крыши" }
  - { pl: "strącać do niższej ligi", ru: "переводить в низшую лигу" }
family:
  - { pl: "strącić", ru: "сбить, сбросить", relation: aspect }
  - { pl: "trącać", ru: "толкать, задевать", relation: root }
  - { pl: "strącenie", ru: "сбитие, низвержение", relation: derived }
synonyms: ["zrzucać", "zestrzeliwać"]
etymology: "Приставка S- «вниз, прочь» плюс TRĄCAĆ «толкать, задевать»: буквально «столкнуть вниз»."
memory: "Trącać — «толкать», strącać — «столкнуть вниз, сбить». Ą в середине — сбить, без Ą (stracić) — потерять."
idioms:
