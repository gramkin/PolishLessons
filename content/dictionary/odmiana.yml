# review
id: odmiana
format: 2
lemma: "odmiana"
rank: 2084
pos: noun
pron: { cyr: "одмя́на" }
senses:
  - id: variety
    ru: "разновидность, сорт"
    examples:
      - pl: "Jaka tam odmiana chrząszcza, to jest karakon."
        ru: "Какая там разновидность жука — это таракан."
        source: { kind: translated, id: 6155943 }
      - pl: "Przymiotniki w języku pruskim mają wiele typów odmian, dlatego jest trudno nauczyć się ich."
        ru: "Прилагательные в прусском языке имеют много типов склонения."
        source: { kind: translated, id: 2379981 }
      - pl: "Czym jest odmiana?"
        ru: "Что такое склонение?"
        source: { kind: translated, id: 12069400 }
  - id: change
    ru: "перемена, разнообразие (dla odmiany)"
    examples:
      - pl: "Może dla odmiany zjemy na mieście?"
        ru: "Может, для разнообразия поедим в городе?"
        source: { kind: translated, id: 351972 }
      - pl: "Odrobina odmiany dobrze robi."
        ru: "Немного разнообразия идёт на пользу."
        source: { kind: translated, id: 13690522 }
notes:
  - { kind: usage, text: "Грамматический термин: odmiana значит «склонение» и «спряжение» сразу — то, что русский делит на два слова. Odmiana przez osoby «спряжение по лицам»." }
  - { kind: usage, text: "dla odmiany «для разнообразия» — очень частый оборот, и именно в нём слово чаще всего встречается в живой речи." }
  - { kind: government, text: "Женский род; от глагола odmieniać «изменять, склонять»." }
  - { kind: false-friend, text: "Корень miana/mienić «менять» — ср. русское «менять», «измениться»." }
collocations:
  - { pl: "dla odmiany", ru: "для разнообразия" }
  - { pl: "odmiana przez przypadki", ru: "склонение по падежам" }
etymology: "От odmieniać «изменять, склонять», корень mienić «менять»; ср. русское «менять», «перемена»."
memory: "odmiana — «разновидность», «перемена» и грамматическое «склонение/спряжение» сразу. Запомните dla odmiany «для разнообразия»."
