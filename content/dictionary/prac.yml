notes:
  - { kind: false-friend, text: "Русский родственник у этого глагола есть, но спрятан там, где его не ищут: областное «прать» значило «стирать», и от него остались «прачка» и «прачечная». Так что польское PRAĆ и русская «прачка» — одно слово. Зато существительное PRANIE двузначно, и это ловушка: оно значит и «стирка», и само «бельё». WSTAWIŁAM PRANIE значит «я поставила стирку», а POWIEŚ PRANIE — «повесь бельё». Русское «стирка» второго значения не имеет, и переводить надо по смыслу." }
  - { kind: usage, text: "В основе работает сильное трёхчленное чередование, и запомнить его надо целиком: инфинитив PRAĆ, но первое лицо PIORĘ и третье множественное PIORĄ, а всё остальное настоящее время через PIERZ-: PIERZESZ, PIERZE, PIERZEMY, PIERZECIE. Повелительное наклонение тоже на PIERZ-: PIERZ, PIERZMY, PIERZCIE. Причина в древнем беглом гласном, который в разных окружениях дал то IO, то IE. Шестьдесят три формы — подпись переходного глагола несовершенного вида. Видовой партнёр — WYPRAĆ или UPRAĆ." }
  - { kind: government, text: "Прямое дополнение в винительном: PRAĆ KOSZULE, PRAĆ FIRANKI. Место и способ стирки идут с предлогом W и предложным: PRAĆ W PRALCE «стирать в машине», PRAĆ W RĘKU «стирать руками», PRAĆ W ZIMNEJ WODZIE. Обратите внимание на W RĘKU: поляк говорит «в руке», единственным числом, где русский берёт творительный множественного — «руками». Температура выражается просто числом: PRAĆ W TRZYDZIESTU STOPNIACH." }
  - { kind: pronunciation, text: "Инфинитив PRAĆ читается «прачь», в один слог, с твёрдым раскатистым R и мягким «чь» на конце. В личных формах всё меняется: PIORĘ звучит «пё́рэн», где PIO даёт «пё», а конечное Ę носовое; PIERZE звучит «пе́жэ», потому что RZ читается как «ж». Эта разница в звучании между PRAĆ и PIERZE сбивает с толку сильнее, чем сама таблица форм, поэтому проговаривать пару стоит вместе." }
  - { kind: register, text: "Слово нейтральное и бытовое. Из гнезда нужны прежде всего PRALKA «стиральная машина», PRALNIA «прачечная» и PRALNIA CHEMICZNA «химчистка», а также PROSZEK DO PRANIA «стиральный порошок». Переносные значения совпадают с русскими: PRAĆ PIENIĄDZE «отмывать деньги», PRANIE PIENIĘDZY «отмывание денег», PRANIE MÓZGU «промывание мозгов». Есть и разговорное PRAĆ KOGOŚ в значении «колотить», но оно просторечное и в письме неуместно." }
