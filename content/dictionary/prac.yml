etymology: "Праславянское *pьrati «бить, колотить, стирать». Исходный образ — стирка битьём, как бельё колотили вальком на речных камнях, и отсюда же развилось значение удара. Русский сохранил глагол лишь в областном «прать», но оставил на виду производные «прачка» и «прачечная», так что родство польского PRAĆ с русским словарём доказывается именно ими. Разнобой в основе — PRAĆ, PIORĘ, PIERZE — след того же древнего беглого гласного, который в русском дал «беру» и «брать»: та же пара чередований, только корень другой. Из гнезда идут PRALKA, PRALNIA и PRANIE."
memory: "Русский родственник спрятан в «прачке» и «прачечной»: областное «прать» значило «стирать», и это то же слово, что польское prać. Главная трудность — чередование в основе: prać, но piorę и piorą, а всё прочее настоящее время через pierz-: pierzesz, pierze. Существительное pranie значит и «стирку», и «бельё». Переносные значения совпадают с русскими: prać pieniądze «отмывать деньги», pranie mózgu «промывание мозгов»."
idioms:
  - { pl: "prać pieniądze", ru: "отмывать деньги" }
formExamplesSkip:
  - { form: "prani", reason: "Форма страдательного причастия мужского лица во множественном числе грамматически не может быть употреблена в значении стирки. Стирают ткань — бельё, рубашки, занавески, — и дополнением этого глагола бывает вещь, а не мужчина, поэтому подлежащего для формы PRANI в этом значении не существует. Разговорное PRAĆ KOGOŚ со значением «колотить» такую форму допускало бы, но это просторечие, и в учебной карточке оно остаётся только упомянутым." }
