notes:
  - { kind: false-friend, text: "PORADA — «совет», чаще практический или профессиональный: PORADA LEKARSKA — консультация врача, PORADA PRAWNA — юридическая консультация. Простой дружеский совет — RADA: DAM CI DOBRĄ RADĘ. А RADA ещё и «совет» как орган: RADA MIASTA — городской совет. Книга с советами — PORADNIK, «справочник, руководство»." }
  - { kind: usage, text: "Десять форм в таблице, женский род. В дательном и местном падежах D смягчается в DZ: W PORADZIE. Родительный множественного — PORAD, без окончания. Звательная форма не нужна." }
  - { kind: government, text: "Обратиться за советом — ZASIĘGNĄĆ PORADY, родительный. Дать совет — UDZIELIĆ PORADY, тоже родительный. По совету — ZA PORADĄ, творительный: ZA PORADĄ LEKARZA." }
  - { kind: pronunciation, text: "Читается «пора́да», три слога, ударение на втором. В форме PORADZIE D перед IE смягчается: «пора́дзе»." }
  - { kind: register, text: "PORADA — слово деловое и газетное: в журналах есть рубрика PORADY, а в поликлинике — PORADNIA, «консультация, диспансер». В разговоре чаще говорят RADA: DOBRA RADA." }
collocations:
  - { pl: "dobra porada", ru: "хороший совет" }
  - { pl: "udzielić porady", ru: "дать совет, проконсультировать" }
  - { pl: "porady kulinarne", ru: "кулинарные советы" }
family:
  - { pl: "rada", ru: "совет; совет (орган)", relation: root, id: rada }
  - { pl: "doradca", ru: "советник, консультант", relation: derived, id: doradca }
  - { pl: "poradnik", ru: "справочник, руководство", relation: derived }
etymology: "От RADZIĆ «советовать», того же корня, что RADA и русские «радеть» и «рада» в значении «совет», как в украинской «Верховной Раде». Приставка PO- делает из глагола результат: «то, что посоветовали»."
memory: "Porada — совет, консультация: porada lekarska, porada prawna. Читается «пора́да». Zasięgnąć porady — обратиться за советом. Poradnik — справочник. Poradnia — консультация, диспансер."
idioms:
  - { pl: "zasięgnąć porady", ru: "обратиться за советом, проконсультироваться" }
  - { pl: "porada prawna", ru: "юридическая консультация" }
formExamplesSkip:
