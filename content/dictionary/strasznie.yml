etymology: "От straszny «страшный», того же корня, что strach «страх». Русское «страшно» устроено точно так же и так же работает усилителем."
memory: "strasznie — «ужасно», и чаще всего это просто усилитель, безо всякого ужаса: Strasznie się cieszę «Я ужасно рад». Ровно как в русском. Буквальное значение тоже осталось: Tutaj strasznie śmierdzi. Гнездо знакомое: straszny, strach, straszyć."
