# review
id: strasznie
format: 2
lemma: "strasznie"
rank: 943
pos: adv
pron: { cyr: "стра́шне" }
senses:
  - id: intensifier
    ru: "ужасно, страшно (усилитель, в том числе при хорошем)"
    note: "Как и русское «ужасно рад», слово усиливает и положительное."
    examples:
      - pl: "Strasznie się cieszę."
        ru: "Я ужасно рад."
        source: { kind: tatoeba, id: 1350487 }
      - pl: "Jestem strasznie gruby."
        ru: "Я такой жирный."
        source: { kind: tatoeba, id: 502307 }
      - pl: "Strasznie mi miło."
        ru: "Мне ужасно приятно."
        source: { kind: authored }
  - id: literal
    ru: "ужасно, отвратительно (по-настоящему плохо)"
    examples:
      - pl: "Tutaj strasznie śmierdzi."
        ru: "Здесь ужасно воняет."
        source: { kind: tatoeba, id: 12470028 }
      - pl: "Zachował się strasznie."
        ru: "Он повёл себя ужасно."
        source: { kind: authored }
      - pl: "Wyglądasz strasznie, idź spać."
        ru: "Ты ужасно выглядишь, иди спать."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Чаще всего слово работает просто усилителем, как русское «ужасно» и «страшно»: Strasznie się cieszę «Я ужасно рад». Отрицательного оттенка при этом нет вовсе." }
  - { kind: usage, text: "Буквальное значение «ужасно, отвратительно» тоже живо: Tutaj strasznie śmierdzi «Здесь ужасно воняет». Различает контекст." }
  - { kind: usage, text: "Прилагательное — straszny «страшный, ужасный», существительное — strach «страх», глагол — straszyć «пугать». Всё гнездо совпадает с русским." }
  - { kind: usage, text: "В роли усилителя степеней сравнения слово не образует: сказать straszniej в этом значении нельзя, для сравнения берут bardziej." }
collocations:
