# review
id: spogladac
format: 2
lemma: "spoglądać"
rank: 5227
pos: verb
pron: { cyr: "спогло́ндаць" }
senses:
  - id: glance
    ru: "поглядывать, смотреть (на кого-то, что-то)"
    examples:
      - pl: "Co chwilę spoglądał na zegarek."
        ru: "Он то и дело поглядывал на часы."
        source: { kind: authored }
      - pl: "Spogląda przez okno na ulicę."
        ru: "Она смотрит в окно на улицу."
        source: { kind: authored }
      - pl: "Dzieci spoglądały na tort z nadzieją."
        ru: "Дети с надеждой поглядывали на торт."
        source: { kind: authored }
  - id: regard
    ru: "смотреть (на будущее, прошлое); относиться"
    examples:
      - pl: "Spoglądamy w przyszłość z optymizmem."
        ru: "Мы смотрим в будущее с оптимизмом."
        source: { kind: authored }
      - pl: "Na tę decyzję spogląda się dziś inaczej."
        ru: "На это решение сегодня смотрят иначе."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "SPOGLĄDAĆ — «поглядывать», «смотреть», от того же корня, что GLĄDAĆ и русское «глядеть». Книжнее, чем PATRZEĆ: SPOGLĄDAĆ W PRZYSZŁOŚĆ «смотреть в будущее», SPOGLĄDAĆ Z GÓRY «смотреть свысока»." }
  - { kind: usage, text: "Несовершенный вид; совершенный — SPOJRZEĆ «взглянуть». Спряжение на -AM: SPOGLĄDAM, SPOGLĄDASZ, SPOGLĄDAJĄ. Часто подчёркивает повторность: CO CHWILĘ SPOGLĄDAŁ «то и дело поглядывал». Отглагольное существительное в карточку не включено: говорят SPOJRZENIE «взгляд»." }
  - { kind: government, text: "На кого, что — NA с винительным: SPOGLĄDAĆ NA ZEGAREK. Куда, во что — W с винительным: SPOGLĄDAĆ W OKNO, W PRZYSZŁOŚĆ. Как — Z с родительным: Z NADZIEJĄ, Z ZAZDROŚCIĄ, Z GÓRY." }
  - { kind: pronunciation, text: "Читается «спогло́ндаць»: Ą перед D — «он». Ударение на предпоследнем слоге. SPOGLĄDA — «спогло́нда»." }
  - { kind: register, text: "Нейтрально-книжное слово, частое в литературе. В разговоре — ZERKAĆ «зыркать», PATRZEĆ." }
collocations:
  - { pl: "spoglądać na zegarek", ru: "поглядывать на часы" }
  - { pl: "spoglądać w przyszłość", ru: "смотреть в будущее" }
  - { pl: "spoglądać z góry", ru: "смотреть свысока" }
family:
  - { pl: "spojrzeć", ru: "взглянуть", relation: aspect, id: spojrzec }
  - { pl: "przyglądać", ru: "присматриваться (PRZYGLĄDAĆ SIĘ)", relation: root, id: przygladac }
  - { pl: "oglądać", ru: "смотреть, осматривать", relation: root, id: ogladac }
etymology: "Приставка S- плюс старопольское GLĄDAĆ «смотреть», родственное русскому «глядеть». Тот же корень в OGLĄDAĆ, PRZYGLĄDAĆ SIĘ и WYGLĄDAĆ."
memory: "Spoglądać — поглядывать: spoglądał na zegarek. Na + винительный. Spoglądać z góry — смотреть свысока."
idioms:
  - { pl: "spoglądać na kogoś z góry", ru: "смотреть на кого-то свысока" }
formExamplesSkip:
