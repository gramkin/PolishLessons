  - { form: "spoglądania", reason: "вместо отглагольного существительного говорят SPOJRZENIE" }
  - { form: "spoglądaniu", reason: "вместо отглагольного существительного говорят SPOJRZENIE" }
  - { form: "spoglądaniem", reason: "вместо отглагольного существительного говорят SPOJRZENIE" }
