# review
id: wiekszosc
format: 2
lemma: "większość"
rank: 683
pos: noun
pron: { cyr: "ве́нкшосьць" }
senses:
  - id: majority
    ru: "большинство (чего-л. — родительный)"
    note: "Глагол при нём стоит в единственном числе."
    examples:
      - pl: "Większość ludzi pisze o swoim życiu codziennym."
        ru: "Большинство людей пишет о своей повседневной жизни."
        source: { kind: tatoeba, id: 364813 }
      - pl: "Gdyby tylko jej mąż pomógł jej, większość jej problemów w domu zniknęłaby."
        ru: "Если бы ей только помогал муж, большинство домашних проблем исчезло бы."
        source: { kind: tatoeba, id: 2838209 }
      - pl: "Większość tak uważa."
        ru: "Большинство так считает."
        source: { kind: translated, id: 363178 }
  - id: most-of
    ru: "w większości — в большинстве, по большей части"
    examples:
      - pl: "Język prawniczy jest niezrozumiały dla większości nieprofesjonalistów."
        ru: "Юридическая терминология непонятна для большинства непрофессионалов."
        source: { kind: tatoeba, id: 351898 }
      - pl: "Był w większości krajów Europy."
        ru: "Он был в большинстве стран Европы."
        source: { kind: translated, id: 1605861 }
      - pl: "Przyczyną większości wypadków samochodowych jest niewyspanie."
        ru: "Причина большинства автомобильных аварий — недосып."
        source: { kind: translated, id: 361079 }
notes:
  - { kind: government, text: "Требует родительного падежа: większość ludzi «большинство людей», większość głosów «большинство голосов». Совпадает с русским." }
  - { kind: usage, text: "Глагол при этом подлежащем стоит в единственном числе: Większość ludzi pisze «Большинство людей пишет»." }
  - { kind: usage, text: "Оборот w większości значит «в большинстве, по большей части»: w większości krajów «в большинстве стран»." }
  - { kind: usage, text: "Творительный większością живёт в устойчивом większością głosów «большинством голосов»." }
