etymology: "От większy «больший», сравнительной степени от wielki «великий» — то же гнездо, что русские «больший» и «большинство»."
memory: "większość — «большинство», и управление то же, что в русском: родительный падеж, większość ludzi. Глагол при таком подлежащем стоит в единственном числе: Większość ludzi pisze. Оборот w większości значит «по большей части», а творительный живёт в формуле większością głosów. Слово отвлечённое: множественного числа у него нет."
