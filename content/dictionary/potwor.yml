# review
id: potwor
format: 2
lemma: "potwór"
rank: 1192
pos: noun
pron: { cyr: "по́твур" }
senses:
  - id: monster
    ru: "чудовище, монстр"
    examples:
      - pl: "Potwór!"
        ru: "Чудовище!"
        source: { kind: translated, id: 12201974 }
      - pl: "Tom jest potworem."
        ru: "Том - чудовище."
        source: { kind: tatoeba, id: 7998984 }
      - pl: "Potwór zawył z wściekłości."
        ru: "Чудовище взвыло от ярости."
        source: { kind: translated, id: 998553 }
  - id: person
    ru: "изверг, чудовище (о человеке)"
    examples:
      - pl: "Jesteś potworem."
        ru: "Ты чудовище."
        source: { kind: tatoeba, id: 7998985 }
      - pl: "Nie wiedziała, że ​​poślubiła potwora."
        ru: "Она не знала, что вышла замуж за чудовище."
        source: { kind: translated, id: 7999026 }
  - id: plural
    ru: "чудовища (в сказках, фильмах, играх)"
    examples:
      - pl: "Kiedy rozum śpi, budzą się potwory."
        ru: "Когда разум спит, просыпаются чудовища."
        source: { kind: translated, id: 4886949 }
      - pl: "W nocy sniły mi się potwory, aż się obudziłam."
        ru: "Ночью мне снились монстры, пока я не проснулась."
        source: { kind: tatoeba, id: 2170760 }
notes:
  - { kind: usage, text: "Мужской одушевлённый: винительный совпадает с родительным — widzę potwora «вижу чудовище»." }
  - { kind: usage, text: "Звательный potworze! работает как ругательство: Ty potworze! «Ты чудовище!»." }
  - { kind: false-friend, text: "potwór — это «чудовище», а не «повтор». Повтор по-польски powtórzenie." }
  - { kind: usage, text: "zielonooki potwór «зеленоглазое чудовище» — о ревности, оборот пришёл из Шекспира, как и русский." }
collocations:
  - { pl: "morski potwór", ru: "морское чудовище" }
  - { pl: "potwór z Loch Ness", ru: "лохнесское чудовище" }
  - { pl: "zielonooki potwór", ru: "зеленоглазое чудовище" }
family:
  - { pl: "potworny", ru: "чудовищный", relation: derived }
  - { pl: "potworność", ru: "чудовищность", relation: derived }
  - { pl: "tworzyć", ru: "творить, создавать", relation: root }
etymology: "От старого potwora, из праславянского *potvoriti «сотворить, создать» — буквально «создание, тварь». Русская «тварь» собрана ровно так же, от «творить»."
memory: "potwór — «чудовище», мужской одушевлённый: widzę potwora. Корень тот же, что в tworzyć «творить», так что буквально это «тварь». Не путайте с powtórzenie «повтор»."
idioms:
  - { pl: "zielonooki potwór", ru: "зеленоглазое чудовище (о ревности)" }
  - { pl: "potwór z Loch Ness", ru: "лохнесское чудовище" }
