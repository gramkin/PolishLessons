# review
id: doktor
format: 2
lemma: "doktor"
rank: 327
pos: noun
pron: { cyr: "до́ктор" }
senses:
  - id: physician
    ru: "доктор, врач (в обращении и разговорно)"
    examples:
      - pl: "Co pan o tym myśli, doktorze?"
        ru: "Что Вы об этом думаете, доктор?"
        source: { kind: tatoeba, id: 5907108 }
      - pl: "Jim nie jest adwokatem, on jest doktorem."
        ru: "Йим не адвокат, а врач."
        source: { kind: tatoeba, id: 1357043 }
      - pl: "Doktor przyjmuje od ósmej."
        ru: "Доктор принимает с восьми."
        source: { kind: authored }
  - id: degree
    ru: "доктор (учёная степень)"
    examples:
      - pl: "Obronił doktorat i jest doktorem nauk."
        ru: "Он защитил диссертацию и стал доктором наук."
        source: { kind: authored }
      - pl: "Doktor Kowalski wykłada na uniwersytecie."
        ru: "Доктор Ковальский преподаёт в университете."
        source: { kind: authored }
      - pl: "To doktor habilitowany."
        ru: "Это хабилитированный доктор."
        source: { kind: authored }
notes:
  - { kind: usage, text: "В обращении к врачу говорят doktorze: Dziękuję, doktorze! Но профессия называется lekarz — idę do lekarza «иду к врачу»." }
  - { kind: usage, text: "doktor — ещё и учёная степень, как в русском; сокращается dr перед фамилией." }
  - { kind: usage, text: "Множественное число двойное: doktorzy (люди) и doktorowie (торжественно, о титуле)." }
collocations:
  - { pl: "dziękuję, doktorze", ru: "спасибо, доктор" }
  - { pl: "iść do lekarza", ru: "идти к врачу" }
  - { pl: "doktor nauk", ru: "доктор наук" }
  - { pl: "potrzebuję doktora", ru: "мне нужен доктор" }
etymology: "Из латинского doctor «учитель, наставник», от docere «учить»; в русский «доктор» пришёл тем же путём."
memory: "doktor — и «врач» в обращении (Dziękuję, doktorze!), и учёная степень. Но профессия называется lekarz: idę do lekarza «иду к врачу»."
idioms:
  - { pl: "dziękuję, doktorze", ru: "спасибо, доктор" }
  - { pl: "doktor nauk", ru: "доктор наук" }
  - { pl: "potrzebuję doktora", ru: "мне нужен доктор" }
