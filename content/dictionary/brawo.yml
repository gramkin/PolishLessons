# review
id: brawo
format: 2
lemma: "brawo"
rank: 1754
pos: noun
pron: { cyr: "бра́во" }
senses:
  - id: applause
    ru: "аплодисменты; bić brawo — аплодировать"
    examples:
      - pl: "Bili brawo."
        ru: "Они аплодировали."
        source: { kind: translated, id: 12053346 }
      - pl: "Wszyscy bili brawo."
        ru: "Все аплодировали."
        source: { kind: translated, id: 8617326 }
      - pl: "Wyszedł na scenę kiedy publiczność biła brawa."
        ru: "Он вышел на сцену, когда публика аплодировала."
        source: { kind: translated, id: 7151423 }
  - id: bravo
    ru: "браво! (возглас одобрения)"
    examples:
      - pl: "Brawo!"
        ru: "Браво!"
        source: { kind: translated, id: 6160588 }
      - pl: "Brawa za znakomite osiągnięcie."
        ru: "Браво за отличное достижение."
        source: { kind: translated, id: 742386 }
notes:
  - { kind: usage, text: "Главное выражение — bić brawo «аплодировать», буквально «бить браво». Само brawo при этом стоит в винительном падеже." }
  - { kind: usage, text: "Во множественном brawa значит «аплодисменты»: otrzymał wiele braw «он получил много аплодисментов»." }
  - { kind: false-friend, text: "Русское «браво!» — только возглас, а польское brawo ещё и существительное: без него не сказать «аплодировать»." }
  - { kind: usage, text: "Синоним существительного — oklaski «аплодисменты», оно только множественное." }
collocations:
  - { pl: "bić brawo", ru: "аплодировать" }
  - { pl: "duże brawa", ru: "большие аплодисменты" }
  - { pl: "brawo!", ru: "браво!" }
family:
  - { pl: "oklaski", ru: "аплодисменты", relation: root }
  - { pl: "brawurowy", ru: "бравурный, лихой", relation: root }
etymology: "Из итальянского bravo «молодец», как и русское «браво». Но польский превратил возглас ещё и в существительное: bić brawo."
memory: "brawo — и «браво!», и «аплодисменты»: bić brawo «аплодировать», otrzymać brawa «получить аплодисменты». Русское «браво» — только возглас."
idioms:
