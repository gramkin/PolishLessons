notes:
  - { kind: usage, text: "МУЖСКО-ЛИЧНАЯ ФОРМА У ПРИЛАГАТЕЛЬНЫХ НА -SKI ИДЁТ НА -SCY. Morski даёт MORSCY: ratownicy morscy, kapitanowie morscy. Так же polski → polscy, wiejski → wiejscy. Правило простое: ski меняется на scy, и это надо узнавать, а не выводить." }
  - { kind: false-friend, text: "Названия животных совпали в двух языках, хотя оба неточны. Świnka morska это «морская свинка», и ни по-польски, ни по-русски она к морю отношения не имеет: зверёк из Южной Америки, а «морской» значило «привезённый из-за моря». Choroba morska — «морская болезнь», тоже буквально как по-русски." }
  - { kind: pronunciation, text: "Два слога, ударение на первом: MOR-ski. Польское r твёрдое и раскатистое, конечное i мягкое: «мо́рскі». В мужско-личной форме morscy слышно «мо́рсцы»." }
collocations:
  - { pl: "choroba morska", ru: "морская болезнь" }
  - { pl: "świnka morska", ru: "морская свинка" }
  - { pl: "port morski", ru: "морской порт" }
family:
  - { pl: "morze", ru: "море", relation: root, id: morze }
  - { pl: "marynarka", ru: "флот; пиджак", relation: root, id: marynarka }
  - { pl: "lądowy", ru: "наземный", relation: antonym }
etymology: "От morze «море», из праславянского *more, того же, что русское «море». Дальше корень родствен латинскому mare и немецкому Meer. Суффикс -ski образует прилагательные принадлежности, как в polski и wiejski."
memory: "morski — «морской», от morze «море». Мужско-личная форма — MORSCY, потому что ski переходит в scy, как polski → polscy. И две кальки совпали с русским: choroba morska и świnka morska."
