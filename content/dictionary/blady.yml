# review
id: blady
format: 2
lemma: "blady"
rank: 2456
pos: adj
pron: { cyr: "бла́ды" }
senses:
  - id: pale-person
    ru: "бледный (о человеке)"
    examples:
      - pl: "Jesteś blady jak duch."
        ru: "Ты бледный как привидение."
        source: { kind: tatoeba, id: 3604786 }
      - pl: "Jesteś blady."
        ru: "Ты бледный."
        source: { kind: translated, id: 569870 }
      - pl: "Była blada ze strachu."
        ru: "Она была бледная от страха."
        source: { kind: translated, id: 361789 }
  - id: pale-thing
    ru: "бледный, тусклый (о свете, красках)"
    examples:
      - pl: "Blady księżyc oświetlił jego głowę."
        ru: "Бледная луна осветила его голову."
        source: { kind: translated, id: 2256350 }
      - pl: "Jego usta były blade."
        ru: "Его губы были бледные."
        source: { kind: translated, id: 6394112 }
notes:
  - { kind: usage, text: "Устойчивые сравнения: blady jak ściana «бледный как стена» (по-русски «как полотно») и blady jak duch «бледный как привидение»." }
  - { kind: government, text: "Обычное прилагательное; сравнительная степень — bledszy, наречие — blado." }
  - { kind: false-friend, text: "Корень тот же, что в русском «бледный»; польское bl- отвечает русскому бл-, как в blask «блеск»." }
  - { kind: usage, text: "Разговорное blady strach «дикий страх»: Blady strach mnie obleciał «Меня обуял ужас»." }
collocations:
  - { pl: "blady jak ściana", ru: "бледный как полотно" }
  - { pl: "blady strach", ru: "дикий страх" }
etymology: "Праславянское *blědъ; русское «бледный» — то же самое слово."
memory: "blady — «бледный», прямой родственник русского слова. Запомните сравнение blady jak ściana: поляк бледнеет «как стена», русский — «как полотно»."
idioms:
