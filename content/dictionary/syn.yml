notes:
  - { kind: usage, text: "Множественное число — synowie «сыновья», а не «syny»: To moi synowie." }
  - { kind: usage, text: "Звательный падеж — synu!: Mój synu «Сын мой». В русском эта форма исчезла, осталась только в «сыне мой»." }
collocations:
  - { pl: "mój syn", ru: "мой сын" }
  - { pl: "syn marnotrawny", ru: "блудный сын" }
  - { pl: "jedyny syn", ru: "единственный сын" }
  - { pl: "syn i córka", ru: "сын и дочь" }
etymology: "Праславянское *synъ, из праиндоевропейского *sūnŭs; то же слово, что русское «сын», английское son и немецкое Sohn."
memory: "Множественное — synowie «сыновья», звательный — synu! И запомните syn marnotrawny «блудный сын»."
idioms:
