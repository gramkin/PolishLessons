notes:
  - { kind: pronunciation, text: "Родительный множественного — POSZUKIWAŃ, с мягким ń и без окончания. Это третье такое слово в словаре после pragnień и wydarzeń, и правило общее для существительных на -nie: мягкость сидит в основе всё время, а исчезновение окончания просто выводит её наружу." }
  - { kind: usage, text: "Русский чаще ставит это слово во множественном — «поиски», — и польский с ним согласен: POSZUKIWANIA о розысках человека или вещи звучит естественнее единственного. Единственное остаётся при отвлечённом смысле: poszukiwanie sensu, poszukiwanie prawdy. Очень ходовой оборот — W POSZUKIWANIU CZEGOŚ, «в поисках чего-то», с родительным падежом." }
collocations:
  - { pl: "poszukiwania ratownicze", ru: "спасательные поиски" }
  - { pl: "w poszukiwaniu pracy", ru: "в поисках работы" }
  - { pl: "przerwać poszukiwania", ru: "прервать поиски" }
family:
  - { pl: "poszukiwać", ru: "разыскивать", relation: root }
  - { pl: "szukać", ru: "искать", relation: root, id: szukac }
  - { pl: "poszukiwacz", ru: "искатель", relation: derived }
etymology: "Отглагольное существительное от POSZUKIWAĆ, а тот от SZUKAĆ «искать». Корень западнославянский и русскому прямо не отвечает: наше «искать» идёт от другого слова. Зато приставка и суффикс работают как у нас: po-szukiwa-nie отвечает по строению «по-иск-и», и оборот w poszukiwaniu ложится на «в поисках» один в один."
memory: "Родительный множественного POSZUKIWAŃ, с мягким ń — как pragnień. И «в поисках» будет W POSZUKIWANIU с родительным."
idioms:
  - { pl: "w poszukiwaniu czegoś", ru: "в поисках чего-то" }
  - { pl: "poszukiwania ratownicze", ru: "спасательные поиски" }
