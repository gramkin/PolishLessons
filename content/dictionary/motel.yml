notes:
  - { kind: pronunciation, text: "Читается «мо́тэль», ударение на первом слоге из двух. Буква E даёт «э» и согласную не смягчает, а конечное L мягкое, как всегда в польском, поэтому слово звучит «мо́тэль» — с твёрдым «тэ» и мягким «ль» подряд, что для русского уха непривычно, потому что русский говорит «моте́ль», со смягчением на T и с ударением на втором слоге. Перестраивать приходится и ударение, и мягкость: не «моте́ль», а «мо́тэль»." }
  - { kind: government, text: "Мужской род, неодушевлённое, и родительный с местным совпадают в одной форме MOTELU: BEZ MOTELU «без мотеля» и W MOTELU «в мотеле» выглядят одинаково. Это седьмой такой случай в словаре, после WYSIŁEK, POŚPIECH, DYSK, BLOK, PIASEK и RATUNEK, и к седьмому разу совпадение можно считать нормой для неодушевлённых на согласную. Винительный равен именительному: ZBUDOWALI MOTEL. Остановиться — ZATRZYMAĆ SIĘ W с местным: W MOTELU." }
  - { kind: usage, text: "Слово нейтральное и в польском заметно частотнее русского, потому что сама вещь распространённее: мотели вдоль трасс в Польше обычное дело. Смежные слова стоит держать рядом, потому что их легко спутать: HOTEL «гостиница», ZAJAZD «придорожный трактир, корчма с ночлегом», PENSJONAT «пансион», HOSTEL «хостел». ZAJAZD — слово старое и своё, от ZAJECHAĆ «заехать», и в современной речи означает придорожный ресторан, иногда с комнатами, то есть почти то же, что мотель, но с польской историей за плечами." }
  - { kind: false-friend, text: "Значение совпадает с русским полностью, и ловушка только в произношении, разобранном выше. Отметить стоит происхождение: MOTEL есть сложение английских MOTOR и HOTEL, то есть слово-гибрид, придуманное в Калифорнии в двадцатых годах для гостиницы, к которой подъезжают на автомобиле. Оба языка взяли его готовым, и потому ни в польском, ни в русском оно не разбирается на части без подсказки. Зная разбор, слово запоминается сразу: мотор плюс отель." }
collocations:
  - { pl: "zatrzymać się w motelu", ru: "остановиться в мотеле" }
  - { pl: "motel przy drodze", ru: "мотель у дороги" }
  - { pl: "tani motel", ru: "дешёвый мотель" }
family:
  - { pl: "hotel", ru: "гостиница", relation: root, id: hotel }
  - { pl: "zajazd", ru: "придорожный трактир", relation: root }
  - { pl: "nocleg", ru: "ночлег", relation: root }
etymology: "Из английского MOTEL, которое само есть сложение MOTOR и HOTEL, придуманное в Калифорнии в тысяча девятьсот двадцать пятом году для гостиницы при дороге. Слово-гибрид такого рода называют контаминацией, и в обоих языках оно пришло готовым, уже сращённым, поэтому ни поляк, ни русский не разбирает его на части без объяснения. Второй элемент, HOTEL, идёт от французского HÔTEL и дальше от латинского HOSPES «гость, хозяин», откуда же и HOSPITAL, и польское HOSPICJUM. Так что в одном коротком слове сошлись латинский гость и английский мотор."
memory: "Ударение на первом слоге и твёрдое «тэ» с мягким «ль»: «мо́тэль», а не русское «моте́ль». Родительный и местный совпадают в motelu — седьмой такой случай, после wysiłek, dysk, blok, piasek, ratunek. Слово-гибрид: motor плюс hotel, придумано в Калифорнии в двадцатых. Рядом стоит своё zajazd, придорожный трактир."
idioms:
  - { pl: "zatrzymać się w motelu", ru: "остановиться в мотеле" }
  - { pl: "motel przy drodze", ru: "мотель у дороги" }
