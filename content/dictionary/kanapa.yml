notes:
  - { kind: false-friend, text: "РУССКОЕ «КАНАПЕ» — ЭТО ЕДА, А НЕ МЕБЕЛЬ. Оба слова из французского canapé, но разошлись полностью: по-польски kanapa это ДИВАН, по-русски «канапе» — маленький бутерброд на шпажке. Диван по-польски тоже бывает dywan, но осторожно: dywan значит КОВЁР. Три похожих слова, три разных предмета." }
  - { kind: pronunciation, text: "Три слога, ударение на предпоследнем: ka-NA-pa. В дательном и предложном p смягчается: na kanapie — «на кана́пе». Тот же ряд, что małpa — małpie, а также farma — farmie и baba — babie." }
  - { kind: usage, text: "Уменьшительное kanapka значит не «диванчик», а БУТЕРБРОД — именно оно соответствует русскому «канапе». Так что kanapa и kanapka это диван и бутерброд, два совершенно разных предмета из одного корня. Родственные слова мебели: fotel «кресло», wersalka «диван-кровать», tapczan «тахта»." }
  - { kind: register, text: "Нейтрально. В мебельном магазине скажут kanapa или sofa; wersalka — старомодно и значит именно раскладной диван. Оборот siedzieć na kanapie обычен, а kanapowy używa się переносно: partia kanapowa «малочисленная партия, умещающаяся на диване»." }
collocations:
  - { pl: "rozkładana kanapa", ru: "раскладной диван" }
  - { pl: "siedzieć na kanapie", ru: "сидеть на диване" }
  - { pl: "kanapa w salonie", ru: "диван в гостиной" }
family:
  - { pl: "kanapka", ru: "бутерброд", relation: derived, id: kanapka }
  - { pl: "fotel", ru: "кресло", relation: root }
  - { pl: "dywan", ru: "ковёр", relation: root, id: dywan }
etymology: "Из французского canapé, а то — из латинского conopeum «полог от комаров», от греческого konops «комар». Сначала это был занавешенный лежак, потом просто мягкая мебель. Русский взял то же слово, но закрепил за закуской, которую подают на подложке. Отсюда kanapka «бутерброд» и kanapowy."
memory: "kanapa — «ДИВАН», а русское «канапе» это бутерброд, по-польски kanapka. И не путать с dywan: это КОВЁР. Предложный смягчает p: na kanapie."
idioms:
