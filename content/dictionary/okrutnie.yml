etymology: "От okrutny «жестокий», из праславянского корня со значением «крутой, суровый» — того же, что у русского «крутой». Польский развил его в «суровый, жестокий», русский — в «отвесный, резкий»."
memory: "okrutnie — «жестоко», но часто просто усилитель: okrutnie zimno «страшно холодно». Корень тот же, что у «крутой», а значение — «жестокий»."
