notes:
  - { kind: usage, text: "Наречие от okrutny «жестокий». Кроме прямого значения служит усилителем: okrutnie zimno «страшно холодно»." }
  - { kind: usage, text: "В усилительной роли взаимозаменяемо с okropnie и strasznie." }
  - { kind: government, text: "Неизменяемое наречие; степени — okrutniej, najokrutniej." }
  - { kind: false-friend, text: "Корень тот же, что в русском «крутой» — праславянское слово со значением «крутой, суровый», — но польское okrutny значит именно «жестокий»." }
