notes:
  - { kind: false-friend, text: "Корень тот же, что в русской «чести», и глагол CZCIĆ отвечает русскому «чтить», а UCZCIĆ — «почтить». Но самое неожиданное здесь другое: существительное CZEŚĆ, то есть «честь», служит в польском обычным приветствием. CZEŚĆ значит и «привет», и «пока», и это первое слово, которое приезжий слышит на улице. Русскому такое употребление незнакомо, хотя след того же порыва у него есть: устаревшее «честь имею» при прощании построено ровно на той же мысли. Так одно слово в польском держит и высокое значение, и самое будничное." }
  - { kind: government, text: "Глагол переходный и требует винительного: UCZCIĆ COŚ или UCZCIĆ KOGOŚ. Самые частые сочетания — UCZCIĆ PAMIĘĆ KOGOŚ «почтить память кого-то» и UCZCIĆ ROCZNICĘ «отметить годовщину». Способ выражается творительным без предлога: UCZCIĆ PAMIĘĆ MINUTĄ CISZY, UCZCIĆ ROCZNICĘ KONCERTEM, и здесь польский и русский совпадают. Несовершенный партнёр — CZCIĆ, и он означает длительное почитание: CZCIĆ PAMIĘĆ, CZCIĆ BOGA. Различать их стоит: UCZCIĆ это однократное действие в определённый день." }
  - { kind: usage, text: "Пятьдесят три формы — подпись переходного глагола совершенного вида: сорок одна форма основного спряжения, деепричастие прошедшего времени UCZCIWSZY и одиннадцать форм страдательного причастия UCZCZONY. Настоящего времени нет: UCZCZĘ и UCZCZĄ значат будущее. В основе работает чередование Ć и CZ: инфинитив UCZCIĆ, но будущее UCZCZĘ, UCZCZĄ и всё причастие UCZCZONY. Та же мена видна в PŁACIĆ и PŁACZĘ, в TRACIĆ и TRACĘ, и для русскоязычного она самая трудная часть этого глагола." }
  - { kind: pronunciation, text: "Читается «у́чцичь», два слога, ударение на первом. Буквосочетание CZ даёт твёрдое «ч», а CI перед гласной — мягкое «ць», так что в середине слова сходятся два близких звука. Ещё труднее формы с CZCZ: UCZCZONY звучит «уччо́ны», с двумя «ч» подряд, и такого сочетания в русском нет вовсе; проговаривать его стоит медленно. В форме UCZCZĘ слышно «у́ччэн», с носовым Ę на конце. В форме UCZCIWSZY звучит «учьчи́фшы»." }
  - { kind: register, text: "Глагол торжественный и общественный: им говорят о памяти, годовщинах, юбилеях. Устойчивые сочетания: UCZCIĆ PAMIĘĆ MINUTĄ CISZY, UCZCIĆ ROCZNICĘ, UCZCIĆ ZWYCIĘSTWO. В бытовом смысле «отметить событие» чаще скажут ŚWIĘTOWAĆ или UCZCIĆ TOASTEM. Производные того же гнезда очень живые: CZEŚĆ как приветствие, CZCIGODNY «досточтимый», CZCICIEL «почитатель», a CZCIONKA означает шрифт — слово неожиданное, но из того же корня, потому что литеру когда-то считали знаком почёта." }
