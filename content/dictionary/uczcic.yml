etymology: "Приставка U- плюс CZCIĆ, а тот — от CZEŚĆ, праславянское *čьstь, то же слово, что русская «честь». Корень *čit- означал «считать, числить, принимать во внимание», и от него же идут русские «читать», «счёт», «почитать» и польские CZYTAĆ, LICZYĆ, CZCIĆ. Мысль прямая: почитать значит принимать в расчёт, ставить высоко. Польское CZCIONKA «шрифт» принадлежит тому же гнезду и показывает, как далеко разошлись побеги одного корня. Чередование Ć и CZ в парадигме старое и правильное: перед гласными заднего ряда мягкий Ć закономерно переходил в CZ, и та же мена живёт в PŁACIĆ и PŁACZĘ."
memory: "Корень тот же, что в русской «чести»: czcić «чтить», uczcić «почтить». И самое неожиданное — существительное cześć служит обычным приветствием, «привет» и «пока» одновременно; русский след той же мысли сохранил только в устаревшем «честь имею». Управление совпадает: uczcić pamięć minutą ciszy, творительным. Главная трудность в парадигме — чередование ć и cz: uczcić, но uczczę и uczczony, где czcz звучит как два «ч» подряд."
