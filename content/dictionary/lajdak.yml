# review
id: lajdak
format: 2
lemma: "łajdak"
rank: 4540
pos: noun
pron: { cyr: "уа́йдак" }
senses:
  - id: scoundrel
    ru: "негодяй, подлец"
    examples:
      - pl: "Ten łajdak oszukał staruszkę."
        ru: "Этот негодяй обманул старушку."
        source: { kind: authored }
      - pl: "Okazał się zwykłym łajdakiem."
        ru: "Он оказался обычным подлецом."
        source: { kind: authored }
      - pl: "Nie ufaj temu łajdakowi."
        ru: "Не доверяй этому негодяю."
        source: { kind: authored }
  - id: rascal
    ru: "плут, шалопай (шутл.)"
    examples:
      - pl: "Ach ty łajdaku, znowu zjadłeś mój deser!"
        ru: "Ах ты плут, опять съел мой десерт!"
        source: { kind: authored }
      - pl: "Mały łajdak schował moje klucze."
        ru: "Маленький проказник спрятал мои ключи."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ŁAJDAK — «негодяй, подлец». Синонимы: DRAŃ, ŁOBUZ (скорее «хулиган»), SZUJA (грубее). В шутку о ребёнке или собаке — «проказник»." }
  - { kind: register, text: "Слово бранное, но не матерное: о человеке, который поступил подло. В шутливом обращении — ласково-укоризненное: TY ŁAJDAKU!" }
  - { kind: usage, text: "Мужской род, лицо. Множественное — ŁAJDACY: K переходит в C. Местный и звательный — ŁAJDAKU." }
  - { kind: pronunciation, text: "Читается «уа́йдак»: Ł — «у», AJ — «ай». Ударение на первом слоге." }
collocations:
  - { pl: "skończony łajdak", ru: "законченный подлец" }
  - { pl: "stary łajdak", ru: "старый плут" }
  - { pl: "ty łajdaku", ru: "ах ты негодник" }
family:
  - { pl: "drań", ru: "мерзавец", relation: root, id: dran }
  - { pl: "łobuz", ru: "хулиган, сорванец", relation: root }
  - { pl: "łajdactwo", ru: "подлость", relation: derived }
etymology: "Слово неясного происхождения, давно известное в польском; возможно, из венгерского или румынского. В русском прямого соответствия нет."
memory: "Łajdak — негодяй, подлец; в шутку — плут. Ty łajdaku! — ах ты негодник! Читается «уа́йдак»."
idioms:
  - { pl: "skończony łajdak", ru: "законченный подлец" }
