# review
id: watly
format: 2
lemma: "wątły"
rank: 2151
pos: adj
pron: { cyr: "во́нтуы" }
senses:
  - id: frail
    ru: "хилый, слабый (о здоровье, сложении)"
    examples:
      - pl: "Chłopiec był wątły i blady."
        ru: "Мальчик был хилым и бледным."
        source: { kind: authored }
      - pl: "Ma wątłe zdrowie."
        ru: "У него слабое здоровье."
        source: { kind: authored }
      - pl: "Mówił wątłym głosem."
        ru: "Он говорил слабым голосом."
        source: { kind: authored }
  - id: flimsy
    ru: "слабый, шаткий (о надежде, доводе)"
    examples:
      - pl: "To wątły argument."
        ru: "Это слабый довод."
        source: { kind: authored }
      - pl: "Wątła nadzieja jeszcze została."
        ru: "Слабая надежда ещё оставалась."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Одинаково годится для здоровья, телосложения, надежды и аргументов — везде значит «слабый, непрочный»." }
  - { kind: false-friend, text: "Не «ватный». И не связано с wątpić «сомневаться», хотя начало слова совпадает." }
  - { kind: government, text: "Обычное прилагательное; наречие — wątło." }
  - { kind: usage, text: "Близкие по смыслу: słaby «слабый», kruchy «хрупкий», wiotki «тонкий, гибкий»." }
collocations:
  - { pl: "wątłe zdrowie", ru: "слабое здоровье" }
  - { pl: "wątła nadzieja", ru: "слабая надежда" }
etymology: "Праславянское *vętъlъ «слабый»; прямого русского соответствия у слова нет."
memory: "wątły — «хилый, слабый»: и о здоровье, и о надежде, и о доводе. С wątpić «сомневаться» не связано, хотя начало слова совпадает."
