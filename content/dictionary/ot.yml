etymology: "Старая указательная частица, родственная OTO «вот» и русскому «вот», «от» в просторечном «от тебе и на». Сохранилась в устойчивых оборотах."
memory: "Ot tak — просто так: przyszedłem ot tak. Не предлог «от»! «От» — od."
idioms:
  - { pl: "ot tak sobie", ru: "просто так; так себе" }
