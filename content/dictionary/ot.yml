# review
id: ot
format: 2
lemma: "ot"
rank: 3654
pos: part
pron: { cyr: "от" }
senses:
  - id: just
    ru: "OT TAK — просто так, так себе"
    examples:
      - pl: "Przyszedłem ot tak, bez powodu."
        ru: "Я пришёл просто так, без причины."
        source: { kind: authored }
      - pl: "— Jak się czujesz? — Ot tak sobie."
        ru: "— Как ты себя чувствуешь? — Так себе."
        source: { kind: authored }
      - pl: "Ot tak, zniknął bez słowa."
        ru: "Вот так, взял и исчез без слова."
        source: { kind: authored }
  - id: here
    ru: "вот, ну (указание, книжно-разговорное)"
    examples:
      - pl: "Ot, i cała historia."
        ru: "Вот и вся история."
        source: { kind: authored }
      - pl: "Ot, zwykły człowiek, nic szczególnego."
        ru: "Да так, обычный человек, ничего особенного."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "OT — не предлог «от» (OD). Это частица «вот», «да так», живущая почти только в OT TAK «просто так» и OT, I WSZYSTKO «вот и всё». Русскому «от» в польском соответствует OD." }
  - { kind: usage, text: "Неизменяемая частица в начале фразы. Самое частое — OT TAK: ZROBIŁ TO OT TAK «он сделал это просто так». OT TAK SOBIE — «так себе»." }
  - { kind: government, text: "Ничем не управляет. Стоит перед TAK, I или перед описанием: OT, ZWYKŁY DZIEŃ «так, обычный день»." }
  - { kind: pronunciation, text: "Читается «от», один слог: O — полное «о», без редукции." }
  - { kind: register, text: "Разговорное, чуть старомодное слово; OT TAK — нейтральное и частое." }
collocations:
  - { pl: "ot tak", ru: "просто так" }
  - { pl: "ot tak sobie", ru: "просто так; так себе" }
  - { pl: "ot i wszystko", ru: "вот и всё" }
family:
