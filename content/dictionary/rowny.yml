# review
id: rowny
format: 2
lemma: "równy"
rank: 2102
pos: adj
depth: deep
pron: { cyr: "ру́вны" }
senses:
  - id: flat
    ru: "ровный, гладкий, плоский"
    examples:
      - pl: "Lód na jeziorze był gładki i równy."
        ru: "Лёд на озере был гладкий и ровный."
        source: { kind: authored }
      - pl: "Szukali równego miejsca na namiot."
        ru: "Они искали ровное место для палатки."
