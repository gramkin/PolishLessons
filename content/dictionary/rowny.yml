      - pl: "Po remoncie podłoga jest wreszcie równa."
        ru: "После ремонта пол наконец ровный."
        source: { kind: authored }
  - id: equal
    ru: "равный, одинаковый"
    examples:
      - pl: "Wszyscy jesteśmy równi wobec prawa."
        ru: "Все мы равны перед законом."
        source: { kind: authored }
      - pl: "Siły obu drużyn są równe."
        ru: "Силы обеих команд равны."
        source: { kind: authored }
      - pl: "Każdemu przysługuje równa część."
        ru: "Каждому полагается равная часть."
        source: { kind: authored }
  - id: steady
    ru: "ровный, равномерный (о ритме, голосе, шаге)"
    examples:
      - pl: "Puls był słaby, ale równy."
        ru: "Пульс был слабый, но ровный."
        source: { kind: authored }
      - pl: "Biegł równym tempem przez całą trasę."
        ru: "Он бежал ровным темпом всю дистанцию."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "РУССКИЙ РАЗДЕЛИЛ ТО, ЧТО ПОЛЬСКИЙ ДЕРЖИТ ВМЕСТЕ. «Ровный» и «равный» — это одно праславянское слово: русский получил и народную форму «ровный», и церковнославянскую «равный», и развёл их по разным смыслам. В польском осталось одно równy, покрывающее оба: równa droga «ровная дорога», równe prawa «равные права». Переводя, каждый раз выбирайте между «ровным» и «равным» заново — само польское слово подсказки не даёт." }
  - { kind: government, text: "Равный КОМУ — дательный падеж без предлога: jest mi równy «он мне равен», równy bogom «равный богам». Равный ЧЕМУ — тоже дательный: suma równa stu złotym «сумма, равная ста злотым». И оборот na równi z kimś «наравне с кем-то», где после z идёт творительный." }
  - { kind: register, text: "rówien — короткая, предикативная форма, сегодня книжная и живущая почти только в обороте nikt mu nie rówien «никто ему не равен». В обычной речи скажут nikt mu nie dorówna. На другом полюсе разговорное równy facet, równa babka — «свой парень», «нормальная тётка»: здесь równy значит не «ровный», а «порядочный, свойский»." }
  - { kind: usage, text: "Степени сравнения обычные: równiejszy, najrówniejszy. Самое известное их употребление пришло от Оруэлла и прижилось в польском так же прочно, как в русском: Wszyscy są równi, ale niektórzy są równiejsi — «Все равны, но некоторые равнее»." }
  - { kind: pronunciation, text: "ó читается как у: równy звучит «ру́вны». Ударение, как всегда в польском, на предпоследнем слоге, поэтому в производных оно уезжает вправо: rów-NIEJ-szy «рувне́йшы», najrów-NIEJ-szy «найрувне́йшы»." }
collocations:
  - { pl: "równa droga", ru: "ровная дорога" }
  - { pl: "równe prawa", ru: "равные права" }
  - { pl: "równym krokiem", ru: "ровным шагом" }
family:
  - { pl: "równo", ru: "ровно; поровну", relation: derived }
  - { pl: "równość", ru: "равенство", relation: derived }
  - { pl: "porównać", ru: "сравнить", relation: derived }
  - { pl: "nierówny", ru: "неровный; неравный", relation: antonym }
etymology: "Из праславянского *orvьnъ. Русский унаследовал этот корень дважды: в народной огласовке получилось «ровный», в церковнославянской — «равный», и два слова разошлись по смыслам. Польский обошёлся одним równy на оба значения. Отсюда równo, równość, równać, porównać, poziom «уровень» и nierówność «неравенство»."
memory: "równy — это сразу и «ровный», и «равный»: русский развёл народную и церковнославянскую формы одного слова, польский оставил одну. Równa droga — ровная, równe prawa — равные. А фраза Оруэлла звучит по-польски точно так же: wszyscy równi, ale niektórzy równiejsi."
idioms:
  - { pl: "na równi z kimś", ru: "наравне с кем-л." }
  - { pl: "nie mieć sobie równych", ru: "не иметь себе равных" }
  - { pl: "równy facet", ru: "свой парень, порядочный человек" }
  - { pl: "wszyscy są równi, ale niektórzy równiejsi", ru: "все равны, но некоторые равнее" }
