# review
id: ostentacyjny
format: 2
lemma: "ostentacyjny"
rank: 5965
pos: adj
pron: { cyr: "остэнтацы́йны" }
senses:
  - id: demonstrative
    ru: "демонстративный (о жесте, протесте)"
    examples:
      - pl: "Ostentacyjne wyjście z sali było protestem."
        ru: "Демонстративный уход из зала был протестом."
        source: { kind: authored }
      - pl: "Ten gest był zbyt ostentacyjny."
        ru: "Этот жест был слишком демонстративным."
        source: { kind: authored }
      - pl: "Mimo ostentacyjnego protestu ustawa przeszła."
        ru: "Несмотря на демонстративный протест, закон приняли."
        source: { kind: authored }
  - id: showy
    ru: "показной, нарочитый, кричащий (о роскоши, чувствах)"
    examples:
      - pl: "Jego ostentacyjny luksus irytował sąsiadów."
        ru: "Его показная роскошь раздражала соседей."
        source: { kind: authored }
      - pl: "Przyjął nagrodę z ostentacyjną skromnością."
        ru: "Он принял награду с показной скромностью."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Русское книжное «остентативный» почти никто не знает, а польское OSTENTACYJNY — обычное слово газет и разговоров. Оно значит «напоказ, чтобы все видели»: OSTENTACYJNE WYJŚCIE Z SALI «демонстративный уход из зала», OSTENTACYJNY LUKSUS «показная роскошь». Ещё чаще встречается наречие: OSTENTACYJNIE ZIEWNĄŁ «он демонстративно зевнул», OSTENTACYJNIE WYSZEDŁ «он демонстративно вышел»." }
  - { kind: usage, text: "Одиннадцать форм; сравнительных на -SZY нет, степени строят описательно: BARDZIEJ OSTENTACYJNY. Мужско-личное множественное OSTENTACYJNI говорят о людях, которые выставляют себя напоказ: OSTENTACYJNI BOGACZE «кичливые богачи»." }
  - { kind: pronunciation, text: "Читается «остэнтацы́йны», пять слогов, ударение на CY. E после T твёрдое, «тэ», а не «те». CYJ звучит «цый»: после C польское Y всегда «ы»." }
collocations:
  - { pl: "ostentacyjny luksus", ru: "показная роскошь" }
  - { pl: "ostentacyjny gest", ru: "демонстративный жест" }
  - { pl: "ostentacyjna obojętność", ru: "демонстративное равнодушие" }
family:
  - { pl: "ostentacja", ru: "показуха, выставление напоказ", relation: root }
  - { pl: "ostentacyjnie", ru: "демонстративно, напоказ", relation: derived }
  - { pl: "ostentacyjność", ru: "демонстративность", relation: derived }
  - { pl: "dyskretny", ru: "сдержанный, незаметный", relation: antonym }
synonyms: ["demonstracyjny", "manifestacyjny", "na pokaz", "wystawny"]
etymology: "От OSTENTACJA «выставление напоказ», из латинского OSTENTATIO, производного от OSTENDERE «показывать»."
