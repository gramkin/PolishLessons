notes:
  - { kind: false-friend, text: "Русский «пропуск» значит и документ, и пробел, пропущенное место. Польский эти смыслы развёл. PRZEPUSTKA это только документ, бумага, по которой пускают. А пробел в тексте или в знаниях — это LUKA, пропущенный урок — NIEOBECNOŚĆ. Сказать PRZEPUSTKA W PAMIĘCI нельзя. Зато у польского слова есть своё второе значение: в армии это увольнительная." }
  - { kind: usage, text: "Десять форм, женский род. В дательном и местном падежах K переходит в C: PRZEPUSTKA, но NA PRZEPUSTCE. В родительном множественного появляется беглое E: PRZEPUSTEK. Оборот BYĆ NA PRZEPUSTCE значит «быть в увольнении», и в местном падеже слово слышно чаще всего именно в этом смысле." }
  - { kind: government, text: "Предъявить пропуск — OKAZAĆ PRZEPUSTKĘ, винительный без предлога. Без пропуска — BEZ PRZEPUSTKI, родительный. В увольнении — NA PRZEPUSTCE, местный падеж. А переносное «путёвка куда-то» строится с предлогом DO и родительным: PRZEPUSTKA DO KARIERY, PRZEPUSTKA DO LEPSZEGO ŻYCIA." }
  - { kind: pronunciation, text: "Читается «пшэпу́стка», четыре слога, ударение на предпоследнем. Сочетание PRZ даёт «пш», и никакого «р» не слышно — это самое непривычное место в слове. Буква E после него даёт «э». В форме PRZEPUSTCE сочетание TC даёт «тц»: «пшэпу́стце»." }
  - { kind: register, text: "Слово официальное, из языка вахты и отдела кадров: PRZEPUSTKA JEDNORAZOWA «одноразовый пропуск», PRZEPUSTKA STAŁA «постоянный пропуск». В армии и в школе-интернате это увольнительная, и NA PRZEPUSTCE значит «в увольнении». Переносное употребление книжное и частое в газетах: TO PRZEPUSTKA DO EUROPY." }
collocations:
  - { pl: "okazać przepustkę", ru: "предъявить пропуск" }
  - { pl: "na przepustce", ru: "в увольнении" }
  - { pl: "przepustka stała", ru: "постоянный пропуск" }
family:
  - { pl: "przepuścić", ru: "пропустить", relation: root }
  - { pl: "puszczać", ru: "пускать", relation: root, id: puszczac }
  - { pl: "przepust", ru: "водопропускная труба", relation: derived }
etymology: "От глагола PRZEPUŚCIĆ «пропустить», а тот — от PUŚCIĆ, слова праславянского и того же, что русское «пустить». Русский «пропуск» собран из того же корня, только с приставкой «про-». И здесь видно полезное соответствие: польское PRZE- отвечает нашим «про-» и «пере-» — PRZEPUSTKA при «пропуске», PRZEJŚCIE при «переходе», PRZECZYTAĆ при «прочитать». Узнав эту приставку, вы разберёте сотни слов."
memory: "Пропуск, но только документ: пробел в тексте это luka, а пропущенный урок — nieobecnosc. Второе значение — увольнительная, и byc na przepustce значит «быть в увольнении». Читается «пшэпу́стка», где prz даёт «пш». Запомните приставку prze-: она отвечает русским «про-» и «пере-», отсюда przepustka при «пропуске» и przejscie при «переходе»."
idioms:
  - { pl: "przepustka do kariery", ru: "путёвка в карьеру" }
