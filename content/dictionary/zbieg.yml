notes:
  - { kind: usage, text: "ДВА МНОЖЕСТВЕННЫХ ЧИСЛА, И ВЫБИРАЕТ ИХ ЗНАЧЕНИЕ. О ЛЮДЯХ — мужско-личное zbiegowie: zbiegowie uciekli. О СТЕЧЕНИЯХ и пересечениях — немужско-личное zbiegi: zbiegi okoliczności. Одна форма на беглецов, другая на совпадения, и перепутать их нельзя. Тот же приём, что у palant, только тут его решает не насмешка, а смысл." }
  - { kind: false-friend, text: "Корень тот же, что в русском «сбежать» и «стечение»: z- плюс biec «бежать». Русский развёл эти смыслы по разным словам — «беглец» и «стечение», — а польский держит в одном. Оборот zbieg okoliczności переводится дословно: «стечение обстоятельств», где тоже «течь, бежать»." }
  - { kind: pronunciation, text: "Один слог, конечное g оглушается до к: «збек». В косвенных падежах звонкость возвращается и появляется второй слог: zbiega — «збе́га», zbiegiem — «збе́гем», с мягким г перед i." }
collocations:
  - { pl: "zbieg okoliczności", ru: "стечение обстоятельств" }
  - { pl: "na zbiegu ulic", ru: "на пересечении улиц" }
  - { pl: "schwytać zbiega", ru: "поймать беглеца" }
family:
  - { pl: "zbiec", ru: "сбежать", relation: root }
  - { pl: "biec", ru: "бежать", relation: root, id: biec }
  - { pl: "uciekinier", ru: "беженец, беглец", relation: derived }
etymology: "От zbiec «сбежать, стечь», приставка z- плюс biec «бежать», из праславянского *běgti — того же корня, что русские «бежать», «бег», «беглец». Оба значения выросли из одного образа: сбежавший человек и сбежавшиеся обстоятельства. Русское «стечение» построено на «течь», но мысль та же."
memory: "zbieg — и «беглец», и «стечение обстоятельств», от zbiec «сбежать». Множественное выбирает значение: zbiegowie о людях, zbiegi о совпадениях. Оборот zbieg okoliczności переводится дословно."
idioms:
