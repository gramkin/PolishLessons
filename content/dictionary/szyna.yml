  - id: track
    ru: "направляющая, шина (для штор, дверей)"
    examples:
      - pl: "Zasłona wyrwała się z szyny karnisza."
        ru: "Штора сорвалась с направляющей карниза."
        source: { kind: authored }
      - pl: "Drzwi szafy jeżdżą po szynie."
        ru: "Двери шкафа ездят по направляющей."
        source: { kind: authored }
  - id: splint
    ru: "шина (медицинская)"
    examples:
      - pl: "Lekarz założył mu szynę na złamany palec."
        ru: "Врач наложил ему шину на сломанный палец."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "SZYNA — прежде всего «рельс», а не автомобильная шина: шина колеса — OPONA. Общее с русской «шиной» — медицинская шина и шина в электронике." }
  - { kind: usage, text: "Девять живых форм, женский род, хотя русский «рельс» мужского. В дательном и предложном N смягчается: NA SZYNIE. Родительный множественного — SZYN: WYPAŚĆ Z SZYN «сойти с рельсов». Звательный SZYNO не употребляется." }
  - { kind: pronunciation, text: "Читается «шы́на»: SZY — «шы». Ударение на первом слоге." }
collocations:
  - { pl: "szyny tramwajowe", ru: "трамвайные рельсы" }
  - { pl: "wypaść z szyn", ru: "сойти с рельсов" }
  - { pl: "pojazd szynowy", ru: "рельсовое транспортное средство" }
  - { pl: "założyć szynę", ru: "наложить шину" }
family:
  - { pl: "szynowy", ru: "рельсовый", relation: derived }
  - { pl: "uszynienie", ru: "наложение шины", relation: derived }
  - { pl: "opona", ru: "шина колеса", relation: root, id: opona }
etymology: "Из немецкого Schiene «рельс, шина». Русская «шина» восходит к тому же немецкому слову."
memory: "Szyna — рельс; шина колеса — opona. Wypaść z szyn — сойти с рельсов. Jak po szynach — как по маслу."
idioms:
  - { pl: "jak po szynach", ru: "как по маслу, без помех" }
