pos: noun
pron: { cyr: "шы́на" }
senses:
  - id: rail
    ru: "рельс"
    examples:
      - pl: "Pociąg wypadł z szyn."
        ru: "Поезд сошёл с рельсов."
        source: { kind: authored }
      - pl: "Robotnicy wymieniają zardzewiałe szyny."
