# review
id: wynik
format: 2
lemma: "wynik"
rank: 810
pos: noun
pron: { cyr: "вы́ник" }
senses:
  - id: result
    ru: "результат"
    examples:
      - pl: "Świetny wynik!"
        ru: "Отличный результат!"
        source: { kind: translated, id: 8608316 }
      - pl: "Wynik go zadowoli."
        ru: "Результат его устроит."
        source: { kind: translated, id: 773942 }
      - pl: "Jaki wynik do przerwy?"
        ru: "Какой счёт к перерыву?"
        source: { kind: translated, id: 364072 }
  - id: results
    ru: "wyniki — результаты"
    examples:
      - pl: "I co, jakie wyniki?"
        ru: "Ну и какие результаты?"
        source: { kind: translated, id: 746123 }
      - pl: "Ważne są tylko wyniki."
        ru: "Важны только результаты."
        source: { kind: translated, id: 930285 }
      - pl: "Wyniki były następujące."
        ru: "Результаты были следующие."
        source: { kind: translated, id: 776452 }
  - id: be-result
    ru: "być wynikiem czegoś — быть результатом чего-л. (творительный)"
    examples:
      - pl: "Wiele chorób jest wynikiem nędzy."
        ru: "Многие болезни — результат нищеты."
        source: { kind: translated, id: 363014 }
      - pl: "Sukces jest wynikiem twojego wysiłku."
        ru: "Успех — результат твоего усилия."
        source: { kind: translated, id: 358870 }
      - pl: "Zdała egzamin z najlepszym wynikiem."
        ru: "Она сдала экзамен с лучшим результатом."
        source: { kind: translated, id: 3615708 }
  - id: satisfied
    ru: "zadowolony z wyników — доволен результатами (родительный)"
    examples:
      - pl: "Jesteś zadowolony z wyników?"
        ru: "Ты доволен результатами?"
        source: { kind: translated, id: 5708488 }
      - pl: "Tom był zadowolony z wyników."
        ru: "Том был доволен результатами."
        source: { kind: translated, id: 3972657 }
      - pl: "Byli zadowoleni z wyniku."
        ru: "Они были довольны результатом."
        source: { kind: translated, id: 915007 }
notes:
  - { kind: usage, text: "Слово собрано от wynikać «вытекать, следовать»: wynik — буквально «то, что вытекает». Русское «результат» — латинское заимствование и такой связи не показывает." }
  - { kind: government, text: "być wynikiem czegoś — творительный падеж; zadowolony z wyników — родительный с z; w wyniku czegoś «в результате чего-то» — тоже родительный." }
  - { kind: usage, text: "В спорте wynik значит «счёт»: Jaki wynik do przerwy? «Какой счёт к перерыву?»." }
  - { kind: usage, text: "Родня: wynikać «следовать, вытекать», skutek «следствие», rezultat «результат» (книжный синоним)." }
collocations:
  - { pl: "dobry wynik", ru: "хороший результат" }
  - { pl: "w wyniku czegoś", ru: "в результате чего-либо" }
  - { pl: "zadowolony z wyników", ru: "доволен результатами" }
  - { pl: "jaki wynik?", ru: "какой счёт?" }
family:
  - { pl: "wynikać", ru: "вытекать, следовать", relation: root }
  - { pl: "skutek", ru: "следствие", relation: root }
  - { pl: "rezultat", ru: "результат", relation: root }
etymology: "От wynikać «вытекать, следовать» — буквально «то, что вытекает». Русское «результат» пришло из латыни и такой связи не показывает."
memory: "wynik — «результат», и собрано оно от wynikać «вытекать»: буквально «то, что вытекает». В спорте это «счёт»: Jaki wynik do przerwy? Управление стоит запомнить парой: być wynikiem czegoś с творительным, но zadowolony z wyników с родительным. А w wyniku czegoś значит «в результате чего-то»."
idioms:
  - { pl: "w wyniku czegoś", ru: "в результате чего-либо" }
  - { pl: "dobry wynik", ru: "хороший результат" }
  - { pl: "zadowolony z wyników", ru: "доволен результатами" }
