pos: noun
pron: { cyr: "сэ́кцйа" }
senses:
  - id: department
    ru: "секция, отдел, подразделение"
    examples:
      - pl: "Zapisał się do sekcji szachowej."
        ru: "Он записался в шахматную секцию."
        source: { kind: authored }
      - pl: "Sekcja marketingu mieści się na drugim piętrze."
        ru: "Отдел маркетинга находится на втором этаже."
        source: { kind: authored }
      - pl: "Kieruje sekcją techniczną."
        ru: "Он руководит технической секцией."
        source: { kind: authored }
  - id: section
    ru: "раздел (документа)"
    examples:
      - pl: "Ustawa dzieli się na sekcje i podpunkty."
        ru: "Закон делится на разделы и подпункты."
        source: { kind: authored }
      - pl: "Przeczytaj trzecią sekcję umowy."
        ru: "Прочитай третий раздел договора."
        source: { kind: authored }
  - id: autopsy
    ru: "sekcja zwłok — вскрытие"
    examples:
      - pl: "Sekcja zwłok wyjaśniła przyczynę śmierci."
        ru: "Вскрытие выяснило причину смерти."
        source: { kind: authored }
      - pl: "Prokurator zarządził sekcję."
        ru: "Прокурор назначил вскрытие."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ЛОВУШКА В ТРЕТЬЕМ ЗНАЧЕНИИ. Там, где речь об отделе или кружке, sekcja и «секция» совпадают полностью: sekcja sportowa, sekcja rytmiczna, sekcja marketingu. Но sekcja zwłok значит «ВСКРЫТИЕ», и говорят часто просто sekcja: zarządzić sekcję, wyniki sekcji. Русская «секция» этого смысла не имеет никогда — там только «вскрытие»." }
  - { kind: usage, text: "Родительный множественного имеет две формы. Обычная сегодня — sekcji, совпадающая с единственным числом. Старая и книжная — sekcyj: она живёт в уставах, довоенных текстах и юридическом языке. Такая же двойная пара есть у kapelusz (kapeluszy и kapeluszów): польский нередко держит два окончания, живое и архаичное." }
  - { kind: pronunciation, text: "Сочетание cj читается слитно, c остаётся твёрдым: «сэ́кцйа». Ударение на предпоследнем слоге, то есть в двусложной форме на первом; в длинных формах оно съезжает: sekcjami — «сэкцйа́ми», sekcjach — «сэ́кцйах»." }
collocations:
  - { pl: "sekcja sportowa", ru: "спортивная секция" }
  - { pl: "sekcja zwłok", ru: "вскрытие" }
  - { pl: "kierować sekcją", ru: "руководить секцией" }
family:
  - { pl: "sektor", ru: "сектор", relation: root }
  - { pl: "sekcyjny", ru: "секционный", relation: derived }
etymology: "Из латинского sectio «разрезание, рассечение», от secare «резать». От того же корня «сектор» и «секатор». Исходный, анатомический смысл «рассечение» польский сохранил живым в обороте sekcja zwłok, а русский отдал его слову «вскрытие», оставив «секции» только переносное значение отдела."
memory: "sekcja — «секция, отдел», тут всё знакомо. Но держите в уме третье значение: sekcja zwłok это «вскрытие», и часто говорят просто sekcja. Исходный латинский смысл «рассечение» польский сберёг, а русский передал другому слову."
idioms:
  - { pl: "sekcja zwłok", ru: "вскрытие, аутопсия" }
  - { pl: "sekcja rytmiczna", ru: "ритм-секция" }
