# review
id: odpicowac
format: 2
lemma: "odpicować"
rank: 5921
pos: verb
aspect: perf
pron: { cyr: "отпицо́ваць" }
senses:
  - id: spruce-up
    ru: "разг. навести лоск, марафет; шикарно отделать (машину, квартиру)"
    examples:
      - pl: "Odpicował stare auto na zlot."
        ru: "Он навёл лоск на старую машину к слёту."
        source: { kind: authored }
      - pl: "Odpicujemy to mieszkanie przed sprzedażą."
        ru: "Мы наведём марафет в этой квартире перед продажей."
        source: { kind: authored }
      - pl: "Mama odpicowała kuchnię na święta."
        ru: "Мама навела марафет на кухне к праздникам."
        source: { kind: authored }
  - id: dress-up
    ru: "odpicować się — разг. принарядиться, расфуфыриться"
    examples:
      - pl: "Odpicowała się na wesele kuzynki."
        ru: "Она расфуфырилась на свадьбу двоюродной сестры."
        source: { kind: authored }
      - pl: "Odpicuj się, idziemy do teatru."
        ru: "Принарядись, мы идём в театр."
        source: { kind: authored }
      - pl: "Przyszedł odpicowany w nowym garniturze."
        ru: "Он пришёл разодетый, в новом костюме."
        source: { kind: authored }
notes:
  - { kind: register, text: "Разговорное, молодёжное слово, как русские «навести марафет», «расфуфыриться». В нейтральной речи — ODNOWIĆ, WYREMONTOWAĆ (о вещах) и WYSTROIĆ SIĘ (о людях). Причастие ODPICOWANY — «шикарный, разодетый, отполированный до блеска»." }
  - { kind: usage, text: "Совершенный вид; несовершенные — PICOWAĆ и ODPICOWYWAĆ. Спряжение на -OWAĆ: ODPICUJĘ, ODPICUJESZ, ODPICUJĄ — это будущее время: «наведу лоск, принаряжусь». Повелительное — ODPICUJ (SIĘ)." }
  - { kind: government, text: "Что — винительный: ODPICOWAĆ AUTO, MIESZKANIE. О себе — с SIĘ: ODPICOWAĆ SIĘ. Ради чего — NA + винительный: ODPICOWAĆ SIĘ NA WESELE, NA RANDKĘ." }
  - { kind: pronunciation, text: "Читается «отпицо́ваць»: D перед P оглушается в «т», C — «ц». ODPICUJĘ — «отпицу́йэ»." }
collocations:
  - { pl: "odpicować auto", ru: "навести лоск на машину" }
  - { pl: "odpicować mieszkanie", ru: "навести марафет в квартире" }
  - { pl: "odpicować się na wesele", ru: "принарядиться на свадьбу" }
  - { pl: "odpicowany na błysk", ru: "отполированный до блеска" }
family:
  - { pl: "picować", ru: "наводить лоск, приукрашивать", relation: aspect }
  - { pl: "odpicowywać", ru: "наводить лоск, наряжать", relation: aspect }
  - { pl: "odpicowany", ru: "шикарный, разодетый", relation: derived }
etymology: "Приставка OD- и разговорный глагол PICOWAĆ «наводить лоск, приукрашивать». Происхождение корня неясно."
memory: "Odpicować — «навести марафет»: odpicowane auto блестит, как на выставке, а odpicowana девушка — как на свадьбе."
idioms:
  - { pl: "odpicować na glanc", ru: "навести лоск, отполировать до блеска" }
