etymology: "Из PO- и STRONA «сторона» с суффиксом -NY: «находящийся в стороне». Русское «посторонний» сложено из тех же частей, поэтому слово понятно сразу."
memory: "PO + STRONA = POSTRONNY, как «по» + «сторона» = «посторонний». Табличка на стройке: OSOBOM POSTRONNYM WSTĘP WZBRONIONY."
