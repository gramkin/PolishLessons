notes:
  - { kind: false-friend, text: "Слово совпадает с русским «посторонний» и по составу, и по смыслу, но только когда речь о людях. Польское POSTRONNY почти всегда стоит при OSOBA, OBSERWATOR, ŚWIADEK или само обозначает человека: OSOBY POSTRONNE «посторонние». О предметах и звуках так не говорят. «Посторонний шум» по-польски OBCY HAŁAS или HAŁAS Z ZEWNĄTRZ, «постороннее тело» CIAŁO OBCE, «посторонние мысли» UBOCZNE MYŚLI или просто INNE MYŚLI." }
  - { kind: register, text: "Слово нейтрально-официальное: табличка OSOBOM POSTRONNYM WSTĘP WZBRONIONY «посторонним вход воспрещён» висит на каждой стройке и служебной двери. В разговоре чаще говорят OBCY «чужой» или KTOŚ Z ZEWNĄTRZ «кто-то со стороны». Оборот POSTRONNY OBSERWATOR «сторонний наблюдатель» обычен в журналистике и в рассуждениях." }
  - { kind: usage, text: "Степеней сравнения нет, одиннадцать форм. Часто употребляется без существительного, как русское «посторонние»: PROSIMY POSTRONNYCH O OPUSZCZENIE SALI «просим посторонних покинуть зал». Читается «постро́нны», двойное NN произносится долго, ударение на предпоследнем слоге." }
collocations:
