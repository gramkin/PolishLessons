# review
id: przychylny
format: 2
lemma: "przychylny"
rank: 2245
pos: adj
pron: { cyr: "пшыхы́льны" }
senses:
  - id: favourable
    ru: "благоприятный, положительный (об отзыве)"
    examples:
      - pl: "Recenzje sztuki były przeważnie przychylne."
        ru: "Отзывы о пьесе были в целом благоприятными."
        source: { kind: tatoeba, id: 822145 }
      - pl: "Wstępne recenzje nowego filmu są przychylne."
        ru: "Первые рецензии на новый фильм благоприятные."
        source: { kind: translated, id: 524974 }
      - pl: "Opinia była przychylna."
        ru: "Отзыв был благоприятным."
        source: { kind: authored }
  - id: well-disposed
    ru: "благосклонный, расположенный (к кому-л.)"
    examples:
      - pl: "Jest nam przychylny."
        ru: "Он к нам благосклонен."
        source: { kind: authored }
      - pl: "Dyrektor okazał się przychylny prośbie."
        ru: "Директор оказался благосклонен к просьбе."
        source: { kind: authored }
notes:
  - { kind: government, text: "Благосклонен к кому-л. — ДАТЕЛЬНЫЙ падеж: przychylny komuś, przychylny prośbie. Русское «благосклонный к кому» требует предлога." }
  - { kind: false-friend, text: "Корень chylić «клонить»: przychylny — буквально «склонённый к». Русское «склонный» держит тот же образ, но значит другое — «имеющий склонность»." }
  - { kind: usage, text: "О рецензиях и отзывах значит просто «положительный»." }
  - { kind: usage, text: "Существительное przychylność «благосклонность», антоним nieprzychylny." }
collocations:
  - { pl: "przychylna opinia", ru: "благоприятный отзыв" }
  - { pl: "być komuś przychylnym", ru: "быть благосклонным к кому-л." }
etymology: "przy- + chylić «клонить»: буквально «склонённый к». Ср. русское «склонить», «склонный»."
memory: "przychylny — «благосклонный», с ДАТЕЛЬНЫМ падежом: przychylny komuś. Об отзывах значит просто «положительный»."
