# review
id: spedzac
format: 2
lemma: "spędzać"
rank: 1612
pos: verb
aspect: imperf
aspectPair: spedzic
pron: { cyr: "спэ́ндзаць" }
senses:
  - id: spend-time
    ru: "проводить (время)"
    examples:
      - pl: "Ile godzin dziennie spędza Pan/Pani w pracy?"
        ru: "Сколько часов в день вы проводите на работе?"
        source: { kind: tatoeba, id: 2008934 }
      - pl: "Niedziele spędzam w domu."
        ru: "Воскресенья я провожу дома."
        source: { kind: translated, id: 1474311 }
      - pl: "Tom często spędza wolny czas na czytaniu powieści."
        ru: "Том часто проводит свободное время за чтением романов."
        source: { kind: tatoeba, id: 10475274 }
  - id: with-someone
    ru: "проводить время с кем-либо"
    examples:
      - pl: "Uwielbiam spędzać z tobą czas."
        ru: "Обожаю проводить с тобой время."
        source: { kind: translated, id: 3979018 }
      - pl: "Nie chcę spędzać czasu z Tomem."
        ru: "Я не хочу проводить время с Томом."
        source: { kind: tatoeba, id: 12359838 }
      - pl: "Chcę spędzać więcej czasu z moją rodziną."
        ru: "Я хочу проводить больше времени с моей семьёй."
        source: { kind: translated, id: 2515864 }
notes:
  - { kind: government, text: "Требует винительного падежа: spędzać czas «проводить время», spędzać wakacje «проводить каникулы»." }
  - { kind: usage, text: "Совершенный вид — spędzić. С кем — z с творительным: spędzać czas z rodziną «проводить время с семьёй»." }
  - { kind: usage, text: "spędzać sen z powiek — идиома «лишать сна, не давать покоя», буквально «сгонять сон с век»." }
  - { kind: usage, text: "Исходное значение корня — «сгонять, перегонять» (скот); отсюда и переносное «проводить время»." }
collocations:
  - { pl: "spędzać czas", ru: "проводить время" }
  - { pl: "spędzać wakacje", ru: "проводить каникулы" }
  - { pl: "spędzać sen z powiek", ru: "лишать сна" }
etymology: "Приставка s- + pędzać «гонять», от pęd «бег, гон». Исходно «сгонять» (скот), отсюда переносное «проводить время». Русское «проводить» построено от «водить» — метафора движения та же."
memory: "spędzać = «проводить (время)», винительный падеж: spędzać czas, spędzać wakacje. Совершенный вид — spędzić. И запомните идиому spędzać sen z powiek «лишать сна»."
idioms:
  - { pl: "spędzać czas", ru: "проводить время" }
  - { pl: "spędzać wakacje", ru: "проводить каникулы" }
  - { pl: "spędzać sen z powiek", ru: "лишать сна" }
