# review
id: umierac
format: 2
lemma: "umierać"
rank: 613
pos: verb
aspect: imperf
aspectPair: umrzec
pron: { cyr: "уме́раць" }
senses:
  - id: die
    ru: "умирать"
    examples:
      - pl: "Ludzie umierają każdego dnia."
        ru: "Люди умирают каждый день."
        source: { kind: tatoeba, id: 3576127 }
      - pl: "Tom zrozumiał, że umiera."
        ru: "Том понял, что умирает."
        source: { kind: tatoeba, id: 6895143 }
      - pl: "Wszyscy umierają."
        ru: "Все умирают."
        source: { kind: translated, id: 3847582 }
  - id: die-of
    ru: "umierać Z czegoś — умирать от чего-л."
    note: "Польский берёт z с родительным там, где русский говорит «от»."
    examples:
      - pl: "Umiera z głodu."
        ru: "Он умирает от голода."
        source: { kind: tatoeba, id: 12470203 }
      - pl: "Umieram z głodu!"
        ru: "Умираю с голоду!"
        source: { kind: translated, id: 352675 }
      - pl: "Umieramy z głodu."
        ru: "Мы умираем с голоду."
        source: { kind: translated, id: 8500401 }
  - id: dying
    ru: "umierający — умирающий"
    note: "Часто стоит именной частью: Pies był umierający."
    examples:
      - pl: "Pies był umierający."
        ru: "Пёс умирал."
        source: { kind: translated, id: 355263 }
      - pl: "Tom jest umierający."
        ru: "Том умирает."
        source: { kind: translated, id: 4467735 }
      - pl: "Twoja matka jest umierająca."
        ru: "Твоя мать умирает."
        source: { kind: translated, id: 357430 }
  - id: die-for
    ru: "umierać za coś, dla czegoś — умирать за что-л."
    examples:
      - pl: "Patrioci zawsze mówią o umieraniu dla kraju, a o zabijaniu innych - nigdy."
        ru: "Патриоты всегда говорят о смерти за родину и никогда — об убийстве других."
        source: { kind: translated, id: 639806 }
      - pl: "Umierali za ojczyznę."
        ru: "Они умирали за родину."
        source: { kind: authored }
      - pl: "Nie warto umierać za pieniądze."
        ru: "За деньги умирать не стоит."
        source: { kind: authored }
notes:
  - { kind: government, text: "Причина смерти идёт через z с родительным: umierać z głodu «умирать от голода», z gorąca «от жары», z nudów «от скуки». Русское «от» отвечает здесь польскому z, а не od." }
  - { kind: usage, text: "Umieram z głodu! — обиходное преувеличение, ровно как русское «умираю с голоду»." }
  - { kind: usage, text: "Совершенный вид — umrzeć: umierał długo, w końcu umarł." }
  - { kind: usage, text: "Причастие umierający «умирающий» часто стоит именной частью сказуемого: Pies był umierający «Пёс умирал»." }
  - { kind: usage, text: "«Умирать за родину» можно двояко: umierać za ojczyznę и umierać dla ojczyzny — оба оборота живы." }
collocations:
  - { pl: "umierać z głodu", ru: "умирать от голода" }
  - { pl: "Umieram z głodu!", ru: "Умираю с голоду!" }
  - { pl: "umierać za ojczyznę", ru: "умирать за родину" }
  - { pl: "umierający", ru: "умирающий" }
family:
  - { pl: "umrzeć", ru: "умереть", relation: aspect }
  - { pl: "śmierć", ru: "смерть", relation: root }
  - { pl: "umieranie", ru: "умирание", relation: derived }
etymology: "Приставка u- плюс mierać, многократное от mrzeć «мереть», праславянское *merti — то же гнездо, что русские «умирать», «мереть» и «смерть»."
memory: "umierać — «умирать», и корень тот же, что в русском. Запомнить надо предлог причины: umierać Z głodu, z gorąca, z nudów — польский берёт z с родительным там, где русский говорит «от». Обиходное Umieram z głodu! значит ровно то же, что «умираю с голоду». Совершенный вид — umrzeć, а причастие umierający «умирающий» часто стоит именной частью: Pies był umierający."
idioms:
  - { pl: "umierać z głodu", ru: "умирать от голода" }
  - { pl: "Umieram z głodu!", ru: "Умираю с голоду!" }
  - { pl: "umierać za ojczyznę", ru: "умирать за родину" }
