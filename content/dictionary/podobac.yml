# review
id: podobac
format: 2
lemma: "podobać"
rank: 311
pos: verb
aspect: imperf
pron: { cyr: "подо́баць" }
senses:
  - id: please
    ru: "нравиться (кому — дательный падеж, всегда с się)"
    examples:
      - pl: "On się jej podoba."
        ru: "Он ей нравится."
        source: { kind: tatoeba, id: 982986 }
      - pl: "Podoba ci się ktoś?"
        ru: "Тебе кто-нибудь нравится?"
        source: { kind: tatoeba, id: 13560611 }
      - pl: "Nic mi się nie podoba."
        ru: "Мне ничего не нравится."
        source: { kind: tatoeba, id: 632334 }
  - id: liked
    ru: "понравиться (о прошедшем)"
    examples:
      - pl: "Film mi się podobał."
        ru: "Фильм мне понравился."
        source: { kind: tatoeba, id: 6029706 }
      - pl: "Podobała ci się gra?"
        ru: "Тебе понравилась игра?"
        source: { kind: tatoeba, id: 2397154 }
      - pl: "Nie podobało mi się."
        ru: "Мне это не нравилось."
        source: { kind: tatoeba, id: 2405941 }
notes:
  - { kind: usage, text: "Конструкция переворачивает привычную: подлежащее — то, ЧТО нравится, а тот, кому нравится, стоит в дательном. Podoba mi się film — буквально «нравится мне фильм»." }
  - { kind: usage, text: "Глагол не употребляется без się: podobać się. Формы podobać без się просто нет." }
  - { kind: usage, text: "Согласование идёт с тем, что нравится: Podobał mi się film (м. р.), Podobała mi się książka (ж. р.), Podobało mi się (ср. р., о ситуации в целом), Podobały mi się zdjęcia (мн. ч.)." }
  - { kind: usage, text: "Глагол спрягается и по лицам: Podobam się Tomowi «Я нравлюсь Тому», Podobasz mi się «Ты мне нравишься» — последнее и есть польское признание в симпатии." }
collocations:
  - { pl: "podoba mi się", ru: "мне нравится" }
  - { pl: "podobać się komuś", ru: "нравиться кому-либо" }
  - { pl: "jak ci się podoba?", ru: "как тебе?" }
  - { pl: "podobasz mi się", ru: "ты мне нравишься" }
etymology: "От podobny «похожий», праславянское *podobati «быть подходящим, подобать». Русские «подобать» и «подобный» — то же гнездо: нравится то, что подобает."
memory: "podobać się переворачивает русскую фразу. Подлежащее — то, ЧТО нравится, а человек уходит в дательный: Podoba mi się film. И согласование идёт с предметом: Podobał mi się film, Podobała mi się książka, Podobało mi się. Признание в симпатии звучит как Podobasz mi się."
idioms:
  - { pl: "podoba mi się", ru: "мне нравится" }
  - { pl: "jak ci się podoba?", ru: "как тебе?" }
  - { pl: "rób, jak ci się podoba", ru: "делай как хочешь" }
