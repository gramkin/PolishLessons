# review
id: przeszkodzic
format: 2
lemma: "przeszkodzić"
rank: 4025
pos: verb
pron: { cyr: "пшэшко́дзиць" }
senses:
  - id: disturb
    ru: "помешать, побеспокоить"
    examples:
      - pl: "Przepraszam, że przeszkodzę."
        ru: "Извините, что помешаю."
        source: { kind: authored }
      - pl: "Hałas przeszkodził mi w pracy."
        ru: "Шум помешал мне работать."
        source: { kind: authored }
      - pl: "Nie chcę ci przeszkodzić."
        ru: "Я не хочу тебе мешать."
        source: { kind: authored }
  - id: prevent
    ru: "помешать (осуществить), не дать"
    examples:
      - pl: "Deszcz przeszkodził nam w wyjeździe."
        ru: "Дождь помешал нашей поездке."
        source: { kind: authored }
      - pl: "Nic nie przeszkodzi im w ślubie."
        ru: "Ничто не помешает их свадьбе."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "PRZESZKODZIĆ — «помешать», от PRZESZKODA, «препятствие». Вредить — SZKODZIĆ, без приставки. Управление отличается: кому — дательный, в чём — W с местным: PRZESZKODZIĆ KOMUŚ W PRACY, где по-русски «помешать работать»." }
  - { kind: usage, text: "Сорок две формы: глагол совершенного вида, без винительного дополнения, поэтому страдательного причастия нет; есть деепричастие PRZESZKODZIWSZY и безличное PRZESZKODZONO. Видовой партнёр — PRZESZKADZAĆ: NIE PRZESZKADZAJ!, «не мешай!». Чередование: PRZESZKODZĘ, PRZESZKODŹ." }
  - { kind: government, text: "Кому — дательный: PRZESZKODZIĆ SĄSIADOM. В чём — W с местным: W NAUCE, W ODPOCZYNKU. Чему — дательный действия: PRZESZKODZIĆ PLANOM, ŚLUBOWI. Вежливое PRZEPRASZAM, ŻE PRZESZKADZAM — «извините, что беспокою»." }
  - { kind: pronunciation, text: "Читается «пшэшко́дзиць», три слога, ударение на предпоследнем. PRZE — «пшэ», SZK — «шк», DZI — «дзи». Конечное Ć — «ць». PRZESZKODŹ — «пшэ́шкодзь»." }
  - { kind: register, text: "Нейтральное слово. Самые частые — вежливые формулы с несовершенным: NIE PRZESZKADZAJ, PRZEPRASZAM, ŻE PRZESZKADZAM. Совершенное PRZESZKODZIĆ — о конкретном срыве планов: COŚ MI PRZESZKODZIŁO." }
collocations:
  - { pl: "przeszkodzić komuś w pracy", ru: "помешать кому-то работать" }
  - { pl: "coś mi przeszkodziło", ru: "мне что-то помешало" }
  - { pl: "przeszkodzić planom", ru: "расстроить планы" }
family:
  - { pl: "przeszkadzać", ru: "мешать", relation: aspect, id: przeszkadzac }
  - { pl: "przeszkoda", ru: "препятствие", relation: derived, id: przeszkoda }
  - { pl: "szkodzić", ru: "вредить", relation: root }
etymology: "Приставка PRZE- плюс SZKODZIĆ «вредить», от SZKODA «вред, ущерб», того же корня, что русское «шкода», «нашкодить». Помешать — буквально «навредить делу»."
memory: "Przeszkodzić — помешать: przeszkodzić komuś w pracy (дательный + w). Coś mi przeszkodziło — мне что-то помешало. Przeszkoda — препятствие. Читается «пшэшко́дзиць»."
idioms:
  - { pl: "nic nie stoi na przeszkodzie", ru: "ничто не мешает" }
