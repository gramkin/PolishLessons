        source: { kind: authored }
      - pl: "To najskromniejszy geniusz, jakiego znam."
        ru: "Это самый скромный гений из всех, кого я знаю."
        source: { kind: authored }
  - id: humble
    ru: "скромный, небольшой (о доме, сумме, обеде)"
    examples:
      - pl: "Mieszkają w skromnym domku na wsi."
        ru: "Они живут в скромном домике в деревне."
        source: { kind: authored }
      - pl: "Dostał skromną pensję."
        ru: "Он получил скромную зарплату."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Совпадение с русским «скромный» полное, и в обоих значениях: о человеке и о достатке. Тонкость в устойчивых формулах: W MOJEJ SKROMNEJ OPINII, «по моему скромному мнению», и SKROMNY POCZĘSTUNEK, «скромное угощение», — вежливое преуменьшение, как и в русском." }
  - { kind: usage, text: "Полная парадигма с простыми степенями: SKROMNY, SKROMNIEJSZY, NAJSKROMNIEJSZY. Все степени живые: SKROMNIEJSZE WARUNKI, NAJSKROMNIEJSZY BUDŻET. Форма для мужчин-людей во всех трёх: SKROMNI, SKROMNIEJSI, NAJSKROMNIEJSI." }
  - { kind: government, text: "Скромный в чём-то — SKROMNY W + местный: SKROMNY W POTRZEBACH, «неприхотливый». В сравнении — NIŻ или OD с родительным. Само прилагательное падежа не требует." }
  - { kind: pronunciation, text: "Читается «скро́мны», два слога, ударение на первом. SKR — скопление согласных, как в русском. В SKROMNIEJSZY: «скромне́йшы»." }
  - { kind: register, text: "Нейтральное слово. О человеке — похвала. О деньгах и обстановке — вежливый эвфемизм бедности: SKROMNE WARUNKI, «скромные условия». Вежливая формула приглашения: ZAPRASZAMY NA SKROMNY POCZĘSTUNEK." }
collocations:
  - { pl: "skromna pensja", ru: "скромная зарплата" }
  - { pl: "w mojej skromnej opinii", ru: "по моему скромному мнению" }
  - { pl: "skromny poczęstunek", ru: "скромное угощение" }
family:
  - { pl: "skromność", ru: "скромность", relation: derived }
  - { pl: "skromnie", ru: "скромно", relation: derived }
  - { pl: "pokorny", ru: "смиренный", relation: root }
etymology: "Общеславянское *sъkromьnъ, родственное русскому «скромный», от корня со значением «край, граница»: скромный — тот, кто держится в пределах, не переходит меру. Польское и русское слова совпадают почти без изменений."
memory: "Skromny — скромный: skromny człowiek, skromna pensja. Skromniejszy, najskromniejszy. W mojej skromnej opinii — по моему скромному мнению. Читается «скро́мны»."
