pos: adj
pron: { cyr: "скро́мны" }
senses:
  - id: modest
    ru: "скромный (о человеке)"
    examples:
      - pl: "Mimo sukcesu został skromnym człowiekiem."
        ru: "Несмотря на успех, он остался скромным человеком."
        source: { kind: authored }
      - pl: "Jest zbyt skromna, żeby się chwalić."
