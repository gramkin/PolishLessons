notes:
  - { kind: usage, text: "Смягчающее слово: говорящий соглашается, но не до конца. Русское «в некотором роде» и «отчасти» передают его точно." }
  - { kind: false-friend, text: "Собрано из po + nie + kąd, того же ряда, что dokąd «куда», stąd «отсюда». Буквально «кое-откуда», то есть «с какой-то стороны»." }
  - { kind: government, text: "Не изменяется. Обычно стоит перед сказуемым или в начале фразы." }
  - { kind: usage, text: "Близкие по смыслу: częściowo «частично», do pewnego stopnia «до известной степени», w pewnym sensie «в некотором смысле»." }
