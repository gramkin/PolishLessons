# review
id: ledwie
format: 2
lemma: "ledwie"
rank: 2914
pos: adv
pron: { cyr: "ле́две" }
senses:
  - id: barely
    ru: "едва, еле"
    examples:
      - pl: "Ledwie go poznałem."
        ru: "Я едва его узнал."
        source: { kind: authored }
      - pl: "Ledwie zdążyli na pociąg."
        ru: "Они едва успели на поезд."
        source: { kind: authored }
      - pl: "Mówił tak cicho, że ledwie słyszałem."
        ru: "Он говорил так тихо, что я едва слышал."
        source: { kind: authored }
  - id: as-soon-as
    ru: "едва, как только"
    examples:
      - pl: "Ledwie wszedł, zadzwonił telefon."
        ru: "Едва он вошёл, зазвонил телефон."
        source: { kind: authored }
      - pl: "Ledwie usiadła, poproszono ją o taniec."
        ru: "Едва она села, её пригласили на танец."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Форма одна, а работ у неё три, и словарь помечает слово тремя разрядами сразу. Как наречие LEDWIE значит «едва, еле»: ledwie słyszałem. Как частица оно умаляет количество: ledwie kilka osób «всего несколько человек», ledwie dwa dni «всего два дня». Как союз оно начинает подчинённое предложение: ledwie wszedł, zadzwonił telefon. Различает эти три роли только место в предложении, потому что само слово не меняется." }
  - { kind: usage, text: "У слова есть полноправный вариант LEDWO, и словарь держит его отдельным словом с теми же тремя пометами. Оба правильны и взаимозаменяемы, LEDWO чуть разговорнее. От него же идёт удвоение LEDWO LEDWO, которое значит «еле-еле», и такое повторение для усиления — обычный польский приём, как в ledwo ledwo zdążyliśmy." }
  - { kind: usage, text: "Союзное употребление русскому даётся легче всего, потому что строится одинаково: LEDWIE WSZEDŁ отвечает русскому «едва он вошёл», и слово стоит на том же месте. Разница в одном: русский может добавить «как» — «едва он вошёл, как зазвонил телефон», — а польский второго слова не ставит, и после запятой идёт прямо главное предложение." }
collocations:
  - { pl: "ledwie zdążyć", ru: "едва успеть" }
  - { pl: "ledwie słyszeć", ru: "едва слышать" }
  - { pl: "ledwo ledwo", ru: "еле-еле" }
etymology: "Старое славянское словечко со значением «с трудом, чуть», родственное русскому «едва», хотя начальные звуки у них разошлись и сходство на слух не угадывается: польское слово начинается на l-, русское на je-. Полезнее запоминать не родство, а соответствие целиком: там, где по-русски «едва» или «еле», по-польски стоит ledwie или ledwo."
memory: "Одна форма, три роли: наречие «еле», частица «всего» и союз «едва». Вариант — ledwo, а ledwo ledwo значит «еле-еле»."
idioms:
  - { pl: "ledwo ledwo", ru: "еле-еле" }
  - { pl: "ledwie co", ru: "только что" }
