# review
id: poruszyc
format: 2
lemma: "poruszyć"
rank: 2466
pos: verb
aspect: perf
aspectPair: poruszac
pron: { cyr: "пору́шыць" }
senses:
  - id: move
    ru: "двинуть, пошевелить"
    examples:
      - pl: "Tom poruszył myszką."
        ru: "Том двинул мышкой."
        source: { kind: translated, id: 11261047 }
      - pl: "Poruszyłem nogami."
        ru: "Я пошевелил ногами."
        source: { kind: translated, id: 11573526 }
      - pl: "Tom próbował się poruszyć."
        ru: "Том попытался пошевелиться."
        source: { kind: translated, id: 10514861 }
  - id: touch-emotionally
    ru: "тронуть, взволновать"
    examples:
      - pl: "Byłem poruszony do łez."
        ru: "Я был растроган до слёз."
        source: { kind: tatoeba, id: 725349 }
      - pl: "Historia poruszyła mnie do łez."
        ru: "Рассказ тронул меня до слёз."
        source: { kind: tatoeba, id: 2143132 }
notes:
  - { kind: government, text: "В значении «затронуть тему» нужен винительный: poruszyć temat «затронуть тему». В значении «тронуть чувства» — тоже винительный: poruszyła mnie." }
  - { kind: usage, text: "Страдательное причастие poruszony «тронутый, взволнованный» встречается едва ли не чаще личных форм: byłem poruszony «я был тронут»." }
  - { kind: false-friend, text: "От ruszyć «двинуть», корень ruch «движение», и то и другое уже есть в словаре. Переносное значение «растрогать» совпадает с русским «тронуть» — тот же перенос от движения к чувству." }
  - { kind: usage, text: "Несовершенный вид — poruszać. С się значит «пошевелиться, сдвинуться»." }
collocations:
  - { pl: "poruszyć temat", ru: "затронуть тему" }
  - { pl: "być poruszonym", ru: "быть тронутым" }
etymology: "po- + ruszyć «двинуть», корень ruch «движение». Переносное «растрогать» — тот же ход, что в русском «тронуть»."
memory: "poruszyć — «двинуть» и «растрогать», ровно как русское «тронуть». Отдельно запомните poruszyć temat «затронуть тему» и причастие poruszony «взволнованный»."
idioms:
  - { pl: "poruszyć temat", ru: "затронуть тему" }
