formExamples:
  - form: "poruszeni"
    pl: "Byliśmy naprawdę poruszeni tą lekturą."
    ru: "Мы были по-настоящему тронуты этим чтением."
    source: { kind: translated, id: 3945567 }
  - form: "poruszeni"
    pl: "Wszyscy byli poruszeni."
    ru: "Все были взволнованы."
    source: { kind: authored }
  - form: "poruszeni"
    pl: "Poruszeni słuchacze milczeli."
    ru: "Взволнованные слушатели молчали."
    source: { kind: authored }
  - form: "poruszoną"
    pl: "Proponuję spotkanie w dogodnym dla pana terminie, by omówić sprawę poruszoną w mailu."
    ru: "Предлагаю встречу в удобное для вас время, чтобы обсудить затронутый в письме вопрос."
    source: { kind: translated, id: 3207415 }
  - form: "poruszoną"
    pl: "Omówmy sprawę poruszoną na zebraniu."
    ru: "Обсудим вопрос, затронутый на собрании."
    source: { kind: authored }
  - form: "poruszoną"
    pl: "Widziałem ją bardzo poruszoną."
    ru: "Я видел её очень взволнованной."
    source: { kind: authored }
  - form: "poruszone"
    pl: "Czy ludzkie sumienie nie jest poruszone przez tyle okropnych zbrodni, tyle wojen?"
    ru: "Неужели человеческая совесть не тронута столькими ужасными преступлениями, столькими войнами?"
    source: { kind: translated, id: 13445524 }
  - form: "poruszone"
    pl: "Te sprawy zostały poruszone wczoraj."
    ru: "Эти вопросы были затронуты вчера."
    source: { kind: authored }
  - form: "poruszone"
    pl: "Serca były poruszone."
    ru: "Сердца были тронуты."
    source: { kind: authored }
  - form: "poruszony"
    pl: "Byłem poruszony do łez."
    ru: "Я был растроган до слёз."
    source: { kind: tatoeba, id: 725349 }
  - form: "poruszony"
    pl: "Był poruszony tym widokiem."
    ru: "Он был тронут этим зрелищем."
    source: { kind: translated, id: 450214 }
  - form: "poruszony"
    pl: "Byłem głęboko poruszony jego słowami."
    ru: "Я был глубоко тронут его словами."
    source: { kind: translated, id: 914978 }
  - form: "poruszy"
    pl: "Ten widok na pewno cię poruszy."
    ru: "Это зрелище наверняка тебя тронет."
    source: { kind: translated, id: 629934 }
  - form: "poruszy"
    pl: "Ta książka cię poruszy."
    ru: "Эта книга тебя тронет."
    source: { kind: authored }
  - form: "poruszy"
    pl: "Nikt tego tematu nie poruszy."
    ru: "Никто эту тему не затронет."
    source: { kind: authored }
  - form: "poruszyć"
    pl: "Tom próbował się poruszyć."
    ru: "Том попытался пошевелиться."
    source: { kind: translated, id: 10514861 }
  - form: "poruszyć"
    pl: "Waham się poruszyć z nią ten temat."
    ru: "Я не решаюсь затронуть с ней эту тему."
    source: { kind: translated, id: 7362454 }
  - form: "poruszyć"
    pl: "Nie mogłem poruszyć ręką."
