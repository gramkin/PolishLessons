notes:
  - { kind: false-friend, text: "SWETER — «свитер», но шире: и кофта на пуговицах — ROZPINANY SWETER. Толстовка — BLUZA, водолазка — GOLF. Пишется через E: SWETER, не «свитер»." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Е беглое: SWETER, но SWETRA, SWETRY. В местном R переходит в RZ: W SWETRZE." }
  - { kind: government, text: "В свитере — W SWETRZE, местный. Надеть свитер — ZAŁOŻYĆ SWETER, винительный. Свитер из шерсти — SWETER Z WEŁNY, Z с родительным." }
  - { kind: pronunciation, text: "Читается «сфэ́тэр». W после S оглушается в «ф», оба E — твёрдые «э». Ударение на первом слоге. SWETRZE — «сфэ́тшэ»." }
collocations:
