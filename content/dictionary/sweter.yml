etymology: "Из английского SWEATER, от SWEAT «потеть»: сначала так называли одежду для спортивных тренировок. Русское «свитер» — то же слово."
memory: "Sweter — свитер, читается «сфэ́тэр». W swetrze — в свитере, e выпадает. Rozpinany sweter — кофта на пуговицах."
