notes:
  - { kind: false-friend, text: "ОДНО ПОЛЬСКОЕ СЛОВО ПОКРЫВАЕТ ДВА РУССКИХ. Powierzchnia это и «поверхность» (powierzchnia wody), и «площадь» в квадратных метрах (powierzchnia mieszkania). Русский различает их двумя словами, и сказать «поверхность квартиры» нельзя. Переводить надо по смыслу, глядя на то, измеряется ли она в метрах." }
  - { kind: usage, text: "Форма POWIERZCHNI обслуживает сразу четыре клетки: родительный, дательный и предложный единственного и ещё родительный множественного. Это обычное дело у существительных на -nia: kuchnia, cukiernia. Поэтому na powierzchni и bez powierzchni выглядят одинаково." }
  - { kind: pronunciation, text: "Четыре слога, ударение на предпоследнем: po-wierzch-NIA, точнее po-WIERZCH-nia. Rz после w звучит как ж, ch как х, ni как нь: «повє́жхня». Сочетание rzch трудное, произносится слитно." }
collocations:
  - { pl: "na powierzchni", ru: "на поверхности" }
  - { pl: "powierzchnia użytkowa", ru: "полезная площадь" }
  - { pl: "powierzchnia biurowa", ru: "офисные площади" }
family:
  - { pl: "wierzch", ru: "верх", relation: root }
  - { pl: "wierzchni", ru: "верхний", relation: derived }
  - { pl: "głębia", ru: "глубина", relation: antonym }
etymology: "От po- и wierzch «верх», из праславянского *vьrxъ, того же, что русское «верх». Русское «поверхность» собрано точно так же: «по» плюс «верх» плюс суффикс. Корень дальше родствен литовскому viršus и латинскому verruca «нарост»."
memory: "powierzchnia — это и «поверхность», и «площадь» в метрах: powierzchnia mieszkania. Собрано как русское «поверхность»: po плюс wierzch «верх». Форма powierzchni служит сразу четырём падежам."
idioms:
