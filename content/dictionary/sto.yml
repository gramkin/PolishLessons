notes:
  - { kind: usage, text: "Склонение предельно бедное: именительный и винительный — sto, все остальные падежи — stu (творительный допускает и stoma, но он книжный)." }
  - { kind: government, text: "После sto существительное стоит в родительном множественного: sto lat «сто лет», sto złotych «сто злотых». После косвенного stu идёт обычное согласование: w stu procentach." }
  - { kind: usage, text: "Sto lat! — традиционное поздравление с днём рождения, дословно «Сто лет!»; так же называется и сама застольная песня." }
  - { kind: usage, text: "na sto procent — «на сто процентов, наверняка»." }
collocations:
  - { pl: "sto lat", ru: "сто лет" }
  - { pl: "do stu", ru: "до ста" }
  - { pl: "na sto procent", ru: "на сто процентов" }
etymology: "Праславянское *sъto — то же самое слово, что русское «сто». Совпадение полное."
memory: "sto — «сто», слово то же самое. Запоминать надо только то, что на все косвенные падежи приходится одна форма: stu. Policz do stu «Посчитай до ста», w stu procentach «на сто процентов». А Sto lat! — это польское «С днём рождения!»."
idioms:
