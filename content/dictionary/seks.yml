notes:
  - { kind: false-friend, text: "Не путайте с płeć «пол» в смысле мужской или женский: в анкете графа называется płeć, а не seks. Польское seks значит только «секс»." }
  - { kind: usage, text: "Два прилагательных, которые легко смешать: seksualny «половой, сексуальный» в нейтральном смысле (edukacja seksualna «половое воспитание») и seksowny «сексуальный, привлекательный»." }
  - { kind: usage, text: "Существительное неисчисляемое: множественного числа у него нет, как и у русского «секс». Таблица строит формы механически." }
  - { kind: usage, text: "Глагольное сочетание — uprawiać seks «заниматься сексом»; само слово стилистически нейтрально и обычно для словаря." }
