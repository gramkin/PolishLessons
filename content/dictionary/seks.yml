etymology: "Из латинского sexus «пол» через западноевропейские языки — то же заимствование, что и русское «секс»."
memory: "seks — «секс», слово заимствованное и неисчисляемое: множественного числа у него нет. Не путайте его с płeć «пол» — в анкете графа будет именно płeć. И различайте два прилагательных: seksualny значит «половой» в нейтральном смысле (edukacja seksualna), а seksowny — «привлекательный»."
