# review
id: przysiegac
format: 2
lemma: "przysięgać"
rank: 892
pos: verb
aspect: imperf
pron: { cyr: "пшысе́нгаць" }
senses:
  - id: swear
    ru: "клясться, божиться"
    examples:
      - pl: "Przysięgam!"
        ru: "Клянусь!"
        source: { kind: translated, id: 6160647 }
      - pl: "Przysięgam, że ci oddam."
        ru: "Клянусь, что верну."
        source: { kind: translated, id: 3894981 }
      - pl: "Przysięgałaś, że mnie kochasz."
        ru: "Ты клялась, что любишь меня."
        source: { kind: translated, id: 4314115 }
  - id: oath
    ru: "приносить присягу, давать клятву"
    examples:
      - pl: "Czy przysięga pan mówić prawdę, całą prawdę i tylko prawdę?"
        ru: "Клянётесь ли вы говорить правду, только правду и ничего кроме правды?"
        source: { kind: translated, id: 12698472 }
      - pl: "Ta pisemna przysięga nie jest wiążąca prawnie."
        ru: "Эта письменная присяга не имеет юридической силы."
        source: { kind: translated, id: 10770946 }
      - pl: "Przysięgali przed sądem."
        ru: "Они присягали перед судом."
        source: { kind: authored }
  - id: insist
    ru: "божиться, уверять (в достоверности)"
    examples:
      - pl: "Przysięgał, że ma pamięć fotograficzną, mimo że nie pamiętał, co jadł wczoraj wieczorem na kolację."
        ru: "Он божился, что у него фотографическая память, хотя не помнил, что ел вчера на ужин."
        source: { kind: translated, id: 10777107 }
      - pl: "Przysięgałeś, że mnie kochasz."
        ru: "Ты клялся, что любишь меня."
        source: { kind: translated, id: 4314114 }
      - pl: "Przysięgam na wszystko, co święte."
        ru: "Клянусь всем святым."
        source: { kind: authored }
notes:
  - { kind: government, text: "przysięgać NA coś «клясться чем-то» — предлог na и винительный падеж: przysięgać na wszystkie świętości «клясться всем святым». Русский тут обходится творительным без предлога." }
  - { kind: usage, text: "Przysięgam! — готовая разговорная формула «Клянусь!», ею подкрепляют обещание или уверяют в правдивости." }
  - { kind: usage, text: "Существительное przysięga «присяга, клятва» пишется так же, как форма глагола 3-го лица: on przysięga «он клянётся» и ta przysięga «эта присяга». Различает контекст." }
  - { kind: usage, text: "Совершенный вид — przysiąc. Свидетель в суде składa przysięgę «приносит присягу»." }
collocations:
  - { pl: "przysięgam!", ru: "клянусь!" }
  - { pl: "przysięgać na coś", ru: "клясться чем-то" }
  - { pl: "składać przysięgę", ru: "приносить присягу" }
  - { pl: "przysięga małżeńska", ru: "брачная клятва" }
family:
  - { pl: "przysiąc", ru: "поклясться", relation: aspect }
  - { pl: "przysięga", ru: "присяга, клятва", relation: derived }
  - { pl: "sięgać", ru: "дотягиваться", relation: root }
etymology: "Из przy- + sięgać «дотягиваться»: присягающий тянулся рукой к священному предмету. Русское «присяга» и «досягать» того же корня."
memory: "przysięgać — «клясться». Управление другое, чем в русском: przysięgać NA coś, с предлогом na и винительным — przysięgać na wszystkie świętości. Запомните формулу Przysięgam! «Клянусь!». Существительное przysięga выглядит как форма глагола, различает контекст."
idioms:
