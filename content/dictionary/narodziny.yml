etymology: "От NARODZIĆ SIĘ «родиться», и дальше от праславянского *roditi, того же корня, что русские «родить», «рождение», «род», «родина». Приставка NA- отвечает русской на-, а множественное число у названий событий — черта польская: NARODZINY, URODZINY, IMIENINY, CHRZCINY, WESELE в старом употреблении. Русский для той же задачи взял отглагольное существительное единственного числа на -ЕНИЕ, и получилось «рождение». Любопытно, что форма на -ENIE в польском тоже есть и живёт отдельной жизнью: NARODZENIE употребляется почти исключительно в названии праздника BOŻE NARODZENIE, то есть «Рождество». Так один корень дал три слова с разделёнными обязанностями, и это разделение надо держать в голове целиком."
memory: "Только множественное число: единственного у слова нет, падежей пять. Тот же тип, что urodziny и imieniny. И главное — три слова на один русский корень: narodziny «рождение, событие», urodziny «день рождения», Narodzenie в Boże Narodzenie «Рождество». On ma urodziny значит «у него день рождения», не «он рождается». Дата рождения в бланках — data narodzin."
