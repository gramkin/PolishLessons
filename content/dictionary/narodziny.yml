notes:
  - { kind: government, text: "Слово употребляется только во множественном числе, формы единственного у него нет вовсе, и падежей поэтому пять: NARODZINY в именительном и винительном, NARODZIN в родительном, NARODZINOM в дательном, NARODZINAMI в творительном, NARODZINACH в местном. Это обычный для польского тип названий событий: так же ведут себя URODZINY «день рождения», IMIENINY «именины», CHRZCINY «крестины». Чьё рождение — родительный без предлога: NARODZINY DZIECKA. До и после — предлоги PRZED с творительным и PO с местным: PRZED NARODZINAMI, PO NARODZINACH." }
  - { kind: false-friend, text: "Русское «рождение» единственного числа, польские NARODZINY — множественного, и это первое, что надо переучить. Второе важнее: польский различает три слова там, где русский обходится одним корнем. NARODZINY это само рождение, событие, в том числе переносно о возникновении чего-либо. URODZINY это день рождения, годовщина, и спутать их легко: ON MA URODZINY значит «у него день рождения», а не «он рождается». А в названии праздника стоит третья форма, единственного числа: BOŻE NARODZENIE «Рождество». Так что один русский корень отвечает трём польским словам с разными функциями." }
  - { kind: pronunciation, text: "Читается «народзи́ны», ударение на предпоследнем слоге из четырёх. Сочетание DZI даёт «дзи» с мягким «дзь», одним слитным звуком. В родительном NARODZIN слогов становится три и ударение остаётся на предпоследнем: «наро́дзин». В местном NARODZINACH пять слогов и ударение снова на предпоследнем: «народзи́нах». Слово длинное, но читается по общим правилам, и всё внимание уходит на то, что единственного числа у него нет." }
  - { kind: usage, text: "Частотные сочетания: NARODZINY DZIECKA, NARODZINY SYNA, PRZED NARODZINAMI, PO NARODZINACH, DATA NARODZIN «дата рождения» в официальных бланках. В переносном значении оборот частотен в публицистике: NARODZINY RUCHU, NARODZINY LEGENDY, NARODZINY NOWEJ EPOKI. Глагол того же корня — NARODZIĆ SIĘ «родиться», книжный; обиходный вариант URODZIĆ SIĘ. Прилагательного от NARODZINY нет; для «врождённый» есть WRODZONY." }
