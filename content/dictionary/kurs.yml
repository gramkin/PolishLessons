        source: { kind: translated, id: 905908 }
notes:
  - { kind: usage, text: "Одно слово покрывает три русских «курса»: kurs językowy «языковой курс», kurs statku «курс корабля» и kurs dolara «курс доллара»." }
  - { kind: false-friend, text: "Русский «курс» в значении года обучения по-польски не kurs, а rok: студент третьего курса — student trzeciego roku." }
  - { kind: usage, text: "Разговорно kurs — это ещё и поездка на такси: Ile kosztuje kurs na lotnisko? «Сколько стоит поездка в аэропорт?»" }
  - { kind: government, text: "Записаться на курс — zapisać się na kurs (винительный падеж); учиться на курсе — na kursie (предложный)." }
collocations:
  - { pl: "kurs językowy", ru: "языковой курс" }
  - { pl: "kurs wymiany", ru: "обменный курс" }
  - { pl: "zapisać się na kurs", ru: "записаться на курс" }
family:
  - { pl: "kursować", ru: "курсировать, ходить (о транспорте)", relation: root }
  - { pl: "kursant", ru: "курсант, слушатель курсов", relation: root }
etymology: "Из латинского cursus «бег, ход» через немецкий Kurs; русское «курс» пришло тем же путём, поэтому слова совпадают почти во всём."
memory: "kurs — «курс» во всех трёх смыслах: языковой курс, курс корабля и курс валюты. Но год обучения — это rok, а не kurs: student trzeciego roku. А ещё kurs разговорно значит «поездка на такси»."
idioms:
  - { pl: "zboczyć z kursu", ru: "сбиться с курса" }
  - { pl: "kurs kolizyjny", ru: "курс на столкновение" }
  - { pl: "trzymać kurs", ru: "держать курс" }
