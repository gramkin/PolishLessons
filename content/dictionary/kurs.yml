        source: { kind: translated, id: 11882693 }
  - id: direction
    ru: "курс (направление движения судна, самолёта)"
    examples:
      - pl: "Statek zmienił kurs."
        ru: "Корабль изменил курс."
        source: { kind: translated, id: 9532985 }
      - pl: "Statek trzyma kurs na południe."
        ru: "Корабль держит курс на юг."
        source: { kind: authored }
  - id: rate
    ru: "курс (валюты, акций)"
    examples:
      - pl: "Jaki jest kurs wymiany?"
        ru: "Какой обменный курс?"
        source: { kind: translated, id: 2998227 }
