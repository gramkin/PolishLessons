etymology: "Из английского GENTLEMAN, сложенного из GENTLE «благородный» и MAN «человек»; первая часть идёт от латинского GENTILIS «родовитый», то есть принадлежащий знатному роду. В польский слово пришло в девятнадцатом веке через газеты и романы, вместе с английской модой на манеры, и было полонизировано дважды: начальное G передано через DŻ по звучанию, а трудная для польского группа согласных разбита вставным E — DŻENTELMEN. Русский в то же время взял слово через французское произношение и сохранил группу «нтльм», получив «джентльмена» на слог короче. Ироническое употребление появилось в обоих языках почти сразу и по одной причине: слово обозначало идеал, а идеалы в разговорной речи быстро становятся поводом для насмешки."
memory: "Значение как в русском, но написание длиннее: польский вставил гласную между t и l, получив dżentelmen, и мягкого знака в польском нет вовсе. Начальное dż передаёт английское G, как в dżungla и dżem. Множественное dżentelmeni с простым -i — третий тип в ряду после dilerzy (r→rz) и doktorkowie (-owie). Тон: прямое значение нейтрально, но с «наш» или «этот» почти всегда иронично, как и в русском. Прилагательное dżentelmeński, уже с мягким ń."
