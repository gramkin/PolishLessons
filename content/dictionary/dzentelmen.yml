notes:
  - { kind: register, text: "Слово заимствовано как комплимент, но в современной речи звучит двояко. В прямом значении оно уместно и нейтрально: ZACHOWAŁ SIĘ JAK DŻENTELMEN — обычная похвала. Но с притяжательным или указательным местоимением тон почти всегда иронический: NASZ DŻENTELMEN, TEN DŻENTELMEN — так говорят о человеке, который как раз повёл себя не по-джентльменски. Это та же ирония, что в русском «наш джентльмен», и русскоязычный её узнает. Устойчивое UMOWA DŻENTELMEŃSKA «джентльменское соглашение» нейтрально и употребляется в деловом языке." }
  - { kind: usage, text: "Десять форм, мужской род, одушевлённое лицо. Мужское-личное множественное — DŻENTELMENI, с простым окончанием -I и без всякого чередования: основа кончается на N, которое перед I смягчается само. Это третий тип в ряду, который стоит видеть целиком: DILERZY с переходом R в RZ, DOKTORKOWIE с уважительным -OWIE и DŻENTELMENI с простым -I. Выбор окончания зависит от конца основы и от оттенка, и единого правила нет — приходится запоминать по словам. Винительный единственного равен родительному, DŻENTELMENA, потому что лицо одушевлённое." }
  - { kind: pronunciation, text: "Читается «джэнтэ́льмэн», три слога, ударение на предпоследнем. Начальное DŻ — один слитный звук «дж», передающий английское G в GENTLEMAN; то же решение в DŻUNGLA, DŻEM и DŻINS. Буква E в польском всегда «э», поэтому слово звучит «джэнтэльмэн», а не «джентельмен»: мягкости в этих слогах нет. Буква L мягче русского твёрдого «л», отсюда «ль». Конечное N твёрдое. Во множественном DŻENTELMENI последнее I смягчает N: «джэнтэльме́ни»." }
  - { kind: false-friend, text: "Значение совпадает, расходится написание, и это стоит отметить, потому что ошибка видна на письме. Русский передал английское GENTLEMAN как «джентльмен», сохранив группу согласных «нтльм». Польский вставил гласную и получил DŻENTELMEN, с E между T и L. Поэтому польское слово на один слог длиннее русского и пишется без мягкого знака, которого в польской орфографии нет вовсе. Прилагательное — DŻENTELMEŃSKI, с мягким Ń, и в нём появляется знак мягкости, которого нет в самом существительном." }
