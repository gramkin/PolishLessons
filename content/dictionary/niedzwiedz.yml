  - { pl: "miód", ru: "мёд", relation: root }
  - { pl: "wilk", ru: "волк", relation: root, id: wilk }
etymology: "Из праславянского *medvědь «медоед», сложения *medu «мёд» и корня *ěd- «есть» — зверя не называли прямо, из боязни, и описывали по повадке. Старопольское miedźwiedź сохраняло m, как русское «медведь»; позже начальный согласный сменился на n. Корень mied- тот же, что в miód."
memory: "niedźwiedź — «медведь», то же слово, что русское: праславянское «медоед», med плюс есть. Только польский сменил начальное m на n, а старопольское miedźwiedź ещё было с м. Родительный множественного мягкий: niedźwiedzi."
idioms:
