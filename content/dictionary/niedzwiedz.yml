notes:
  - { kind: false-friend, text: "ОДНО И ТО ЖЕ СЛОВО, НО ПОЛЬСКИЙ ПОТЕРЯЛ НАЧАЛЬНОЕ М. Праславянское *medvědь значило «медоед»: med «мёд» плюс корень ěd- «есть». Русский сохранил его как «медведь», а в польском m перешло в n — старопольское MIEDŹWIEDŹ ещё хранило первоначальный звук, и только позже стало niedźwiedź. Так что это тот же медоед." }
  - { kind: usage, text: "Существительное одушевлённое мужского рода, поэтому винительный равен родительному: widzę niedźwiedzia. Родительный множественного — NIEDŹWIEDZI, мягкий и без окончания -ów. Созвездие Большая Медведица по-польски Wielka Niedźwiedzica, от женской формы." }
  - { kind: pronunciation, text: "Три слога, ударение на предпоследнем: nie-DŹWIE-dźwiedź. Сочетание dźwie читается «дзьвє», конечное dź — мягкое «дзь»: «недзьвє́дзь». Слово считается одним из труднейших для произношения, и даже поляки шутят над ним." }
collocations:
