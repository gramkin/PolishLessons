# review
id: nazajutrz
format: 2
lemma: "nazajutrz"
rank: 5694
pos: adv
pron: { cyr: "наза́ютш" }
senses:
  - id: next-day
    ru: "на следующий день, назавтра"
    examples:
      - pl: "Nazajutrz wstałem bardzo wcześnie."
        ru: "На следующий день я встал очень рано."
        source: { kind: authored }
      - pl: "Nazajutrz wszystko wyglądało inaczej."
        ru: "На следующий день всё выглядело иначе."
        source: { kind: authored }
      - pl: "Wrócił nazajutrz po południu."
        ru: "Он вернулся на следующий день после полудня."
        source: { kind: authored }
  - id: morning-after
    ru: "наутро (о следующем утре после события)"
    examples:
      - pl: "Nazajutrz po ślubie wyjechali."
        ru: "Наутро после свадьбы они уехали."
        source: { kind: authored }
      - pl: "Nazajutrz nikt o tym nie pamiętał."
        ru: "Наутро никто об этом не помнил."
        source: { kind: authored }
      - pl: "Nazajutrz przyszedł list."
        ru: "На следующий день пришло письмо."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Слово сложено из na + zajutrz; русское «назавтра» построено по той же модели." }
  - { kind: usage, text: "Всегда о прошлом: nazajutrz рассказывает, что случилось на следующий день после уже упомянутого события. О будущем говорят jutro «завтра»." }
  - { kind: register, text: "Книжное, характерное для повествования; в разговоре скажут następnego dnia." }
  - { kind: usage, text: "Частая конструкция: nazajutrz po czymś «на следующий день после чего-то»." }
collocations:
  - { pl: "nazajutrz po", ru: "на следующий день после" }
  - { pl: "następnego dnia", ru: "на следующий день" }
  - { pl: "jutro", ru: "завтра" }
etymology: "Сложение na + zajutrz, от jutro «завтра». Русское «назавтра» собрано из тех же частей."
memory: "nazajutrz — «на следующий день», и собрано оно как русское «назавтра»: na + jutro. Важная деталь: слово всегда смотрит в прошлое — рассказывает, что было на следующий день после уже упомянутого события. О будущем говорят jutro."
idioms:
  - { pl: "nazajutrz po czymś", ru: "на следующий день после чего-то" }
