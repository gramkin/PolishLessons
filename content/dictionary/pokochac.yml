etymology: "Приставка po- плюс kochać. Самое любопытное тут — распределение корней. Польское lubić и русское «любить» — одно и то же слово, из праславянского *ljubiti, но в польском оно ослабло до «нравиться». А сильное чувство взяло на себя kochać, которому в литературном русском соответствия нет: ближайшее «кохать» живёт только в украинском и говорах. Отсюда kochanek, kochanie, ukochany."
memory: "pokochać — «полюбить», приставка po- начинательная, как в русском. Главное помнить разделение: kochać о людях и о сильном чувстве, lubić о вещах — lubię kawę, не kocham. И lubić это ровно русское «любить», только ослабевшее."
