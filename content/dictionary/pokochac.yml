notes:
  - { kind: false-friend, text: "САМОЕ ВАЖНОЕ ЗДЕСЬ — ЧТО KOCHAĆ И LUBIĆ ДЕЛЯТ МЕЖДУ СОБОЙ РУССКОЕ «ЛЮБИТЬ». Kochać это любить глубоко, о людях: kocham cię. Lubić — любить в смысле «нравится», о вещах и занятиях: lubię kawę, lubię czytać. Сказать kocham kawę можно только в шутку или с нажимом. Русское «я люблю кофе» переводится через lubić, и ошибка эта очень живучая." }
  - { kind: usage, text: "ПРИСТАВКА PO- ЗДЕСЬ НАЧИНАТЕЛЬНАЯ, РОВНО КАК В РУССКОМ «ПОЛЮБИТЬ». Kochać значит «любить» как состояние, pokochać — «полюбить», то есть начать любить: pokochał ją w jeden wieczór. Та же приставка с тем же смыслом работает в polubić «понравиться, проникнуться»: polubiłem tę książkę." }
  - { kind: government, text: "Любят КОГО или ЧТО — винительный без предлога: pokochać kogoś, pokochać miasto. За что — za с винительным: pokochała go za cierpliwość. Взаимно — с się: pokochali się. Вид совершенный, несовершенная пара — kochać." }
  - { kind: pronunciation, text: "Три слога, ударение на предпоследнем: po-KO-chać. Ch читается как х, конечное -ać как «-ать» с мягким ц: «покоха́ць». В прошедшем времени ударение остаётся предпоследним: pokochaliśmy — «покохали́шмы»." }
