# review
id: ulzyc
format: 2
lemma: "ulżyć"
rank: 4975
pos: verb
pron: { cyr: "у́лжыць" }
senses:
  - id: relieve
    ru: "облегчить (боль, страдание, работу кому-то)"
    examples:
      - pl: "Lek ulżył mu w bólu."
        ru: "Лекарство облегчило ему боль."
        source: { kind: authored }
      - pl: "Pielęgniarka ulżyła mu w cierpieniu."
        ru: "Медсестра облегчила его страдания."
        source: { kind: authored }
      - pl: "Ulżyj mamie i pozmywaj."
        ru: "Помоги маме — помой посуду."
        source: { kind: authored }
  - id: feel-relief
    ru: "безл. ULŻYŁO MI — мне полегчало"
    examples:
      - pl: "Ulżyło mi, gdy usłyszałem jej głos."
        ru: "Мне полегчало, когда я услышал её голос."
        source: { kind: authored }
      - pl: "Wszystkim ulżyło."
        ru: "Все вздохнули с облегчением."
        source: { kind: authored }
  - id: vent
    ru: "ULŻYĆ SOBIE — отвести душу"
    examples:
      - pl: "Ulżył sobie przekleństwem."
        ru: "Он отвёл душу крепким словцом."
        source: { kind: authored }
      - pl: "Ulżyła sobie, płacząc."
        ru: "Она выплакалась, и стало легче."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ULŻYĆ — «облегчить», а не «улизнуть»: «улизнуть» — ZWIAĆ. ULŻYŁO MI — «мне полегчало». Корень тот же, что в LEKKI «лёгкий» и ULGA «облегчение»." }
  - { kind: usage, text: "Сорок две формы. Будущее: ULŻĘ, ULŻYSZ, повелительное ULŻYJ. Часто безлично: ULŻYŁO MU, ULŻY CI. Парного несовершенного вида в обиходе почти нет; вместо него — PRZYNOSIĆ ULGĘ." }
  - { kind: government, text: "Кому — дательный: ULŻYĆ CHOREMU. В чём — W с предложным: ULŻYĆ KOMUŚ W CIERPIENIU, W PRACY. Безлично — дательный: ULŻYŁO MAMIE." }
  - { kind: pronunciation, text: "Читается «у́лжыць»: LŻ — «лж», ŻY — «жы», ударение на первом слоге. ULŻĘ — «у́лжэ»." }
  - { kind: register, text: "Нейтральное слово. ULŻYĆ SOBIE — разговорное «отвести душу», часто бранью. ULŻYĆ SERCU — книжное." }
collocations:
  - { pl: "ulżyć w bólu", ru: "облегчить боль" }
  - { pl: "ulżyło mi", ru: "мне полегчало" }
  - { pl: "ulżyć sobie", ru: "отвести душу" }
family:
  - { pl: "ulga", ru: "облегчение; льгота", relation: derived, id: ulga }
  - { pl: "lekki", ru: "лёгкий", relation: root, id: lekki }
  - { pl: "lżejszy", ru: "более лёгкий", relation: derived }
etymology: "От LŻEJ, LŻEJSZY «легче», праславянское *lьgъkъ «лёгкий». Буквально — «сделать легче». Русское «льгота», «облегчить» — того же корня."
memory: "Ulżyć — облегчить: lek ulżył mu w bólu. Ulżyło mi — мне полегчало. Ulga — облегчение. Читается «у́лжыць»."
idioms:
  - { pl: "ulżyć sobie", ru: "отвести душу" }
