notes:
  - { kind: false-friend, text: "PRZEDSZKOLE — «детский сад», буквально «предшкола»: приставка PRZED- «перед» и SZKOŁA. Ребёнок из садика — PRZEDSZKOLAK, воспитательница — PRZEDSZKOLANKA или, по-детски, PANI Z PRZEDSZKOLA. Ясли — ŻŁOBEK. А JAK W PRZEDSZKOLU — «как в детском саду», о несерьёзном поведении взрослых." }
  - { kind: usage, text: "Восемь форм, средний род. Родительный множественного — PRZEDSZKOLI, без -ÓW. Дательный и местный падежи совпадают: PRZEDSZKOLU." }
  - { kind: government, text: "Ходить в садик — CHODZIĆ DO PRZEDSZKOLA, DO с родительным. Забрать из садика — ODEBRAĆ Z PRZEDSZKOLA, Z с родительным. В садике — W PRZEDSZKOLU, местный." }
  - { kind: pronunciation, text: "Читается «пшэтшко́ле», три слога, ударение на втором. PRZ — «пш», а D перед SZ оглушается в «т». SZK — «шк», как в SZKOŁA «шко́уа»." }
collocations:
  - { pl: "przedszkole publiczne", ru: "государственный детский сад" }
  - { pl: "zapisać do przedszkola", ru: "записать в садик" }
  - { pl: "pani z przedszkola", ru: "воспитательница" }
family:
  - { pl: "szkola", ru: "школа", relation: root, id: szkola }
  - { pl: "przedszkolak", ru: "дошкольник, малыш из садика", relation: derived }
  - { pl: "przedszkolanka", ru: "воспитательница", relation: derived }
etymology: "Сложение приставки PRZED- «перед» и SZKOŁA «школа», то есть «учреждение до школы». Русский пошёл другим путём и взял немецкую кальку «детский сад», а польский назвал садик по его месту в жизни ребёнка."
memory: "Przedszkole — детский сад, «предшкола». Читается «пшэтшко́ле». Chodzić do przedszkola — ходить в садик. Przedszkolak — малыш из садика, przedszkolanka — воспитательница. Ясли — żłobek."
idioms:
  - { pl: "jak w przedszkolu", ru: "как в детском саду" }
  - { pl: "co to za przedszkole", ru: "что за детский сад" }
