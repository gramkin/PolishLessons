etymology: "От cholera «холера» через прилагательное cholerny. Русское «чертовски» устроено так же: бранное слово превратилось в усилитель."
memory: "cholernie — «чертовски»: cholernie gorąco, cholernie dużo. Умеренно бранный усилитель, от cholera."
