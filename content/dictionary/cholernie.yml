notes:
  - { kind: register, text: "Бранный усилитель, но умеренный: «чертовски». Мягче вульгарных усилителей, однако в официальной речи неуместен." }
  - { kind: usage, text: "Ставится перед прилагательным или наречием: cholernie gorąco «чертовски жарко», cholernie dużo «чертовски много»." }
  - { kind: usage, text: "Наречие от прилагательного cholerny, у которого своя карточка. Слово неизменяемое." }
