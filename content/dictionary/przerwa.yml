# review
id: przerwa
format: 2
lemma: "przerwa"
rank: 1274
pos: noun
pron: { cyr: "пшэ́рва" }
senses:
  - id: break
    ru: "перерыв, пауза"
    examples:
      - pl: "Kiedy przerwa?"
        ru: "Когда перерыв?"
        source: { kind: translated, id: 1353374 }
      - pl: "Zrób przerwę."
        ru: "Сделай перерыв."
        source: { kind: translated, id: 8771167 }
      - pl: "Teraz zrobię małą przerwę, a potem będę dalej robić angielski."
        ru: "Сейчас я сделаю небольшую паузу, а потом продолжу заниматься английским."
        source: { kind: tatoeba, id: 13225522 }
  - id: without
    ru: "bez przerwy — без перерыва, постоянно"
    examples:
      - pl: "Padało bez przerwy."
        ru: "Дождь шёл без перерыва."
        source: { kind: translated, id: 1165281 }
      - pl: "Ona pracuje bez przerwy."
        ru: "Она работает без перерыва."
        source: { kind: translated, id: 13572605 }
  - id: school
    ru: "перемена (в школе)"
    examples:
      - pl: "Czy możemy palić na przerwie?"
        ru: "Можно нам курить на перемене?"
        source: { kind: translated, id: 3633646 }
      - pl: "W gimnazjum na sprawdziany uczyłam się na przerwach między lekcjami."
        ru: "В гимназии я готовилась к контрольным на переменах между уроками."
        source: { kind: translated, id: 11150127 }
notes:
  - { kind: usage, text: "bez przerwy значит не только «без перерыва», но и «постоянно, безостановочно»: Kłamią bez przerwy «Они врут без остановки»." }
  - { kind: usage, text: "Школьная перемена — тоже przerwa: na przerwie «на перемене». Отдельного слова вроде русской «перемены» нет." }
  - { kind: usage, text: "przerwa obiadowa «обеденный перерыв», przerwa w dostawie prądu «перебой с электричеством»." }
  - { kind: usage, text: "Женский род: ta przerwa, tej przerwy. Образовано от przerwać «прервать»." }
collocations:
  - { pl: "zrobić przerwę", ru: "сделать перерыв" }
  - { pl: "bez przerwy", ru: "без перерыва" }
  - { pl: "przerwa obiadowa", ru: "обеденный перерыв" }
  - { pl: "na przerwie", ru: "на перемене" }
family:
  - { pl: "przerwać", ru: "прервать", relation: root }
  - { pl: "przerywać", ru: "прерывать", relation: derived }
etymology: "От przerwać «прервать», приставка prze- плюс rwać «рвать». Русский «перерыв» собран из тех же частей: «пере-» плюс «рвать»."
memory: "przerwa — «перерыв», и школьная перемена тоже przerwa: na przerwie. А оборот bez przerwy значит не только «без перерыва», но и «постоянно»."
idioms:
  - { pl: "bez przerwy", ru: "без перерыва, постоянно" }
  - { pl: "zrobić przerwę", ru: "сделать перерыв" }
formExamplesSkip:
  - { form: "przerwo", reason: "звательный падеж у этого слова в живой речи не употребляется" }
  - { form: "przerwy", cell: "Звательный", reason: "звательный падеж: к предмету или понятию не обращаются" }
