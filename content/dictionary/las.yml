# review
id: las
format: 2
lemma: "las"
rank: 946
pos: noun
pron: { cyr: "ляс" }
senses:
  - id: forest
    ru: "лес"
    examples:
      - pl: "Las się pali."
        ru: "Лес горит."
        source: { kind: translated, id: 8751033 }
      - pl: "Kocham ten las."
        ru: "Я люблю этот лес."
        source: { kind: translated, id: 8734666 }
      - pl: "Szedł przez las."
        ru: "Он шёл через лес."
        source: { kind: translated, id: 362491 }
  - id: in-forest
    ru: "w lesie, do lasu — в лесу, в лес"
    note: "Предложный на вопрос «где», родительный с do на вопрос «куда»."
    examples:
      - pl: "W tym lesie nie ma borsuków."
        ru: "В этом лесу нет барсуков."
        source: { kind: tatoeba, id: 6160995 }
      - pl: "W lesie znów zrobiło się cicho."
        ru: "В лесу снова стало тихо."
        source: { kind: tatoeba, id: 3446241 }
      - pl: "Chodźmy do lasu!"
        ru: "Пойдём в лес!"
        source: { kind: translated, id: 9391386 }
  - id: plural
    ru: "lasy — леса"
    examples:
      - pl: "Borsuki występują w lasach Eurazji."
        ru: "Барсуки водятся в лесах Евразии."
        source: { kind: tatoeba, id: 6155757 }
      - pl: "Ziemia jest pokryta lasami."
        ru: "Земля покрыта лесами."
        source: { kind: tatoeba, id: 1169895 }
      - pl: "Lasy są wycinane."
        ru: "Леса вырубают."
        source: { kind: translated, id: 12187539 }
notes:
  - { kind: government, text: "Различайте do lasu «в лес» (куда) и w lesie «в лесу» (где). Предложный падеж у слова нерегулярный: не «w lasie», а w lesie, с чередованием a — e." }
  - { kind: usage, text: "Чередование это старое и встречается во всей семье: las — w lesie, leśny «лесной», leśnik «лесник». Русское «лес — в лесу» устроено похоже, но без смены гласного." }
  - { kind: usage, text: "nauka nie idzie w las — «учение не пропадает даром», буквально «наука не уходит в лес». Ещё говорят im głębiej w las, tym więcej drzew «чем дальше в лес, тем больше дров»." }
  - { kind: usage, text: "Прилагательное — leśny: leśna droga «лесная дорога». Лесник — leśniczy или leśnik." }
collocations:
  - { pl: "w lesie", ru: "в лесу" }
  - { pl: "do lasu", ru: "в лес" }
  - { pl: "leśna droga", ru: "лесная дорога" }
  - { pl: "pożar lasu", ru: "лесной пожар" }
family:
  - { pl: "leśny", ru: "лесной", relation: derived }
  - { pl: "leśnik", ru: "лесник", relation: derived }
  - { pl: "zalesić", ru: "засадить лесом", relation: derived }
etymology: "Праславянское *lěsъ. Русское «лес» — то же слово, и родственники есть во всех славянских: чешское les, украинское ліс."
memory: "las — «лес», слово общеславянское. Главное запомнить нерегулярный предложный: не «w lasie», а w lesie, с чередованием a — e. То же чередование в leśny «лесной». И различайте do lasu «в лес» и w lesie «в лесу»."
idioms:
  - { pl: "w lesie", ru: "в лесу" }
  - { pl: "do lasu", ru: "в лес" }
  - { pl: "nauka nie idzie w las", ru: "учение даром не проходит" }
  - { pl: "im głębiej w las, tym więcej drzew", ru: "чем дальше в лес, тем больше дров" }
formExamplesSkip:
