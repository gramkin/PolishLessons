notes:
  - { kind: false-friend, text: "PRZEKRĘT — «афера, махинация», разговорное. Буквально — «перекрут», от PRZEKRĘCIĆ «перекрутить». Нейтрально — OSZUSTWO, «мошенничество», AFERA, «афера». Аферист — KOMBINATOR." }
  - { kind: register, text: "Разговорное, с оттенком возмущения: TO PRZEKRĘT! — «это развод!». В официальных текстах — NADUŻYCIE, OSZUSTWO." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Родительный — PRZEKRĘTU. В местном T переходит в C: W PRZEKRĘCIE." }
  - { kind: pronunciation, text: "Читается «пшэ́крэнт»: PRZE — «пшэ», Ę перед T — «эн». Ударение на первом слоге." }
collocations:
