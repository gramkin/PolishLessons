# review
id: przetrwac
format: 2
lemma: "przetrwać"
rank: 1355
pos: verb
aspect: perf
pron: { cyr: "пшэ́трваць" }
senses:
  - id: survive
    ru: "выжить, уцелеть, продержаться"
    examples:
      - pl: "Tom przetrwa."
        ru: "Том выживет."
        source: { kind: translated, id: 10598396 }
      - pl: "Jego firma przetrwała kryzys."
        ru: "Его фирма пережила кризис."
        source: { kind: translated, id: 842083 }
      - pl: "Firma walczy o przetrwanie."
        ru: "Компания борется за выживание."
        source: { kind: tatoeba, id: 2146656 }
  - id: outlast
    ru: "пережить, сохраниться дольше чего-либо"
    examples:
      - pl: "Praca poety przetrwała próbę czasu."
        ru: "Труд поэта выдержал испытание временем."
        source: { kind: translated, id: 10472304 }
      - pl: "Poeta umarł młodo, ale jego prace przetrwały wieki."
        ru: "Поэт умер молодым, но его труды пережили века."
        source: { kind: translated, id: 6304331 }
notes:
  - { kind: government, text: "przetrwać co (винительный): przetrwać wojnę, kryzys, zimę. Может стоять и совсем без дополнения: Tom przetrwa «Том выживет»." }
  - { kind: usage, text: "Корень тот же, что в trwać «длиться, продолжаться». Приставка prze- значит «сквозь, до конца», поэтому przetrwać — буквально «протянуть насквозь»." }
  - { kind: usage, text: "Совершенный вид. Для длящегося действия берут trwać «длиться» или przetrzymywać «выдерживать»; отдельной несовершенной пары на -ywać у глагола в живой речи нет." }
  - { kind: false-friend, text: "przetrwać — «пережить, выдержать», а nie przeżyć значит «не выжить». Но przeżyć coś — это ещё и «испытать, пережить чувство»: przeżyć wielką miłość." }
collocations:
  - { pl: "przetrwać kryzys", ru: "пережить кризис" }
  - { pl: "przetrwać zimę", ru: "пережить зиму" }
  - { pl: "walczyć o przetrwanie", ru: "бороться за выживание" }
etymology: "Приставка prze- «сквозь, через» и trwać «длиться» (праславянское *trъvati). По способу сборки это точное соответствие русскому «пере-жить»: пройти сквозь что-то и остаться."
memory: "przetrwać — это prze- «пере-» плюс trwać «длиться», буквально «протянуть до конца». Firma przetrwała kryzys «Фирма пережила кризис», przetrwać próbę czasu «выдержать испытание временем». Дополнение — винительный."
idioms:
  - { pl: "przetrwać próbę czasu", ru: "выдержать испытание временем" }
  - { pl: "walczyć o przetrwanie", ru: "бороться за выживание" }
  - { pl: "przetrwać najgorsze", ru: "пережить самое худшее" }
