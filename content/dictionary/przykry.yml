# review
id: przykry
format: 2
lemma: "przykry"
rank: 1583
pos: adj
pron: { cyr: "пшы́кры" }
senses:
  - id: unpleasant
    ru: "неприятный (о запахе, вкусе, ощущении)"
    examples:
      - pl: "Małe zwierzątko wydzielało przykry zapach."
        ru: "Зверёк издавал неприятный запах."
        source: { kind: translated, id: 355565 }
      - pl: "Miał przykry smak w ustach."
        ru: "У него был неприятный привкус во рту."
        source: { kind: authored }
      - pl: "Z piwnicy szedł przykry zapach."
        ru: "Из подвала шёл неприятный запах."
        source: { kind: authored }
  - id: distressing
    ru: "досадный, огорчительный; неприятный (о человеке, известии)"
    note: "Безличное to przykre отвечает русскому «жаль, обидно»."
    examples:
      - pl: "To przykre."
        ru: "Это неприятно."
        source: { kind: translated, id: 6765456 }
      - pl: "To przykre, że nie możesz do nas dołączyć."
        ru: "Жаль, что ты не можешь к нам присоединиться."
        source: { kind: translated, id: 13561638 }
      - pl: "Jesteś przykry."
        ru: "Ты неприятный."
        source: { kind: translated, id: 5665011 }
notes:
  - { kind: usage, text: "przykry покрывает и «неприятный» для чувств (przykry zapach), и «досадный, огорчительный» (przykra wiadomość «неприятное известие»)." }
  - { kind: usage, text: "Два оборота нужно знать наизусть: przykro mi «мне жаль» и to przykre, że... «жаль, что...». Оба очень частые в разговоре." }
  - { kind: false-friend, text: "Рядом стоит глагол przykrzyć się «надоедать, наскучить»: przykrzy mi się «мне наскучило». Его форма przykrzy пишется точно так же, как мужско-личная форма прилагательного (ci ludzie są przykrzy)." }
  - { kind: usage, text: "Исходное значение основы — «крутой, резкий»; оно уцелело в редком przykry stok «крутой склон». Отсюда и «резкий для чувств»." }
collocations:
  - { pl: "przykry zapach", ru: "неприятный запах" }
  - { pl: "przykra wiadomość", ru: "неприятное известие" }
  - { pl: "przykro mi", ru: "мне жаль" }
  - { pl: "przykry obowiązek", ru: "неприятная обязанность" }
family:
  - { pl: "przykro", ru: "неприятно, жаль", relation: derived }
  - { pl: "przykrość", ru: "неприятность", relation: derived }
  - { pl: "przykrzyć się", ru: "надоедать", relation: derived }
etymology: "Праславянское *prikrъ «крутой, резкий». Исходное значение уцелело в редком przykry stok «крутой склон», а обычное развилось из «резкий для чувств» — отсюда «неприятный»."
memory: "przykry — «неприятный»: и про запах (przykry zapach), и про известие (przykra wiadomość). Исходно слово значило «крутой, резкий», отсюда «резкий для чувств». Два оборота учите наизусть: przykro mi «мне жаль» и to przykre, że... «жаль, что...». И держите в стороне глагол przykrzyć się «надоедать»: przykrzy mi się «мне наскучило», а форма przykrzy совпадает с мужско-личной формой прилагательного."
idioms:
  - { pl: "przykro mi", ru: "мне жаль" }
  - { pl: "to przykre", ru: "обидно, жаль" }
  - { pl: "przykry obowiązek", ru: "неприятная обязанность" }
