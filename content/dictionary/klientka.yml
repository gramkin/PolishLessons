etymology: "От KLIENT, из латинского CLIENS «подопечный, зависимый человек», от CLUERE «слушать, слушаться» — в Риме так называли свободного человека под покровительством патрона. Современное значение, покупатель или заказчик, развилось в западноевропейских языках и пришло в польский и русский уже готовым. Женская форма образована суффиксом -KA, из праславянского *-ъka, тем же, что в русском -КА, и обе пары строятся одинаково: KLIENT и KLIENTKA, «клиент» и «клиентка». Вставная гласная в родительном множественном KLIENTEK — след древнего редуцированного гласного, который в этой позиции прояснился, а в остальных исчез; то же явление даёт MATEK от MATKA и OKIEN от OKNO."
memory: "Как русская «клиентка», и суффикс работает так же: -ka даёт женские соответствия механически — klient/klientka, student/studentka, как «клиент/клиентка». Дательный и местный — klientce, с k→c, как praktyce. Родительный множественного klientek, со вставной e, иначе вышло бы непроизносимое klientk; так же matek от matka. В терминах пишут мужскую форму: obsługa klienta."
