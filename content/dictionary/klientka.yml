notes:
  - { kind: government, text: "Женский род на -KA, с чередованием K в C перед -E: дательный и местный единственного дают KLIENTCE. Это то же правило, что у PRAKTYKA и GALAKTYKA, только здесь перед K стоит согласная, и слово выглядит иначе. Родительный множественного KLIENTEK, со вставной гласной E перед конечной группой согласных — без неё вышло бы непроизносимое KLIENTK. Такая вставка обязательна у всех слов на -TKA и -DKA: MATKA даёт MATEK, SĄSIADKA даёт SĄSIADEK. Винительный на -Ę: OBSŁUŻYĆ KLIENTKĘ." }
  - { kind: false-friend, text: "Значение совпадает с русской «клиенткой» полностью, и карточка здесь не о ловушке, а о приёме. Суффикс -KA образует женские соответствия к названиям лиц мужского рода, и делает это почти механически: KLIENT и KLIENTKA, STUDENT и STUDENTKA, NAUCZYCIEL и NAUCZYCIELKA, SĄSIAD и SĄSIADKA. Русский пользуется тем же суффиксом -КА в тех же словах, так что пара образуется одинаково в двух языках. Отличие в объёме: в польском такие формы образуются свободнее и от названий профессий, где русский колеблется — PSYCHOLOŻKA, DYREKTORKA употребительны, тогда как русские соответствия спорны." }
  - { kind: pronunciation, text: "Читается «клье́нтка», ударение на предпоследнем слоге из трёх. Сочетание KLI даёт «кль» с мягким л, а не «кли». Буква E звучит «э». Сочетание NTK произносится полностью, все три согласных. В дательном и местном KLIENTCE буква K переходит в C: «клье́нтце», и на стыке слышны два смычных подряд. В родительном множественного KLIENTEK появляется вставная E: «клье́нтэк»." }
  - { kind: usage, text: "Частотные сочетания: STAŁA KLIENTKA «постоянная клиентка», OBSŁUGA KLIENTA «обслуживание клиента» — в этом терминологическом обороте всегда мужская форма, независимо от пола; ZADOWOLONA KLIENTKA, SKARGA KLIENTKI. В официальных бланках часто пишут KLIENT/KLIENTKA через дробь. Мужская форма KLIENT входит в оборот KLIENT NASZ PAN, отвечающий русскому «клиент всегда прав». Прилагательное KLIENCKI встречается в сочетании OBSŁUGA KLIENCKA." }
