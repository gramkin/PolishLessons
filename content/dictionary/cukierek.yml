etymology: "Уменьшительное от CUKIER «сахар», а то — из средневерхненемецкого ZUCKER, которое через итальянское ZUCCHERO и арабское SUKKAR восходит к санскритскому SARKARA «песок, крупинка». То есть за словом стоит образ песка, и русский «сахарный песок» нечаянно возвращает исходную картину. Русское «сахар» пришло тем же путём, но через греческий, отсюда и расхождение в первом звуке: польское C на месте немецкого Z, русское С на месте греческого сигмы. Суффикс -EK в польском уменьшительный и крайне продуктивный: DOMEK «домик», CHLEBEK «хлебушек», и в CUKIEREK он дал не просто «сахарок», а название отдельного предмета — то, что лингвисты называют лексикализацией уменьшительного."
memory: "Буквально «сахарок», уменьшительное от cukier: польский назвал конфету по составу, а русская «конфета» — из итальянского confetto, по способу приготовления. Родственного слова не угадать, зато корень знаком: cukier, cukiernia, cukrzyca. Беглое e выпадает: cukierka, cukierkiem. Этикеточная формула — cukierek O SMAKU, с местным."
