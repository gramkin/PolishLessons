notes:
  - { kind: false-friend, text: "Русская «конфета» и польский CUKIEREK обозначают одно и то же, а собраны из совершенно разного материала, и угадать слово нельзя. CUKIEREK — уменьшительное от CUKIER «сахар», то есть буквально «сахарок»: польский назвал конфету по составу. Русская «конфета» пришла из итальянского CONFETTO «приготовленное в сахаре», через немецкий, и называет способ изготовления. Поэтому похожего польского слова на «конфету» просто нет, а знакомый корень CUKIER помогает запомнить новое: CUKIER сахар, CUKIEREK конфета, CUKIERNIA кондитерская, CUKRZYCA диабет." }
  - { kind: usage, text: "Беглая гласная E выпадает во всех косвенных падежах: CUKIEREK, но CUKIERKA, CUKIERKIEM, CUKIERKI. Это та же механика, что в WYSIŁEK и WYSIŁKU, и из-за неё ударение переезжает, оставаясь предпоследним: «цуке́рэк», но «цуке́рка». Считают конфеты родительным после числительных выше четырёх: PIĘĆ CUKIERKÓW, но DWA CUKIERKI. В переносном значении слово значит подачку или приманку, чаще всего в политике: CUKIERKI PRZEDWYBORCZE «предвыборные подачки»." }
  - { kind: pronunciation, text: "Читается «цуке́рэк», ударение на предпоследнем слоге. Буква C в начале даёт «ц», а сочетание KIE — мягкое «ке». Оба E звучат «э», но после K смягчение уже выражено буквой I, поэтому выходит «ке», а не «кэ». В местном и звательном падеже CUKIERKU ударение остаётся на том же слоге: «цуке́рку». Русское «цукат» — родственник того же корня и помогает вспомнить начальное «ц»." }
  - { kind: government, text: "Мужской род, неодушевлённое, поэтому винительный равен именительному: ZJADŁ CUKIEREK. Родительный на -A: BEZ CUKIERKA, и при отрицании винительный уходит туда же: NIE ZJADŁ CUKIERKA. Вкус вводится предлогом O с местным: CUKIEREK O SMAKU MALINOWYM «конфета с малиновым вкусом», и это устойчивая этикеточная формула, которую стоит узнавать. Начинка — предлог Z с творительным: CUKIEREK Z NADZIENIEM." }
