# review
id: teza
format: 2
lemma: "teza"
rank: 2628
pos: noun
pron: { cyr: "тэ́за" }
senses:
  - id: thesis
    ru: "тезис, утверждение"
    examples:
      - pl: "Teza wymaga dowodu, nie powtarzania."
        ru: "Тезис требует доказательства, а не повторения."
        source: { kind: authored }
      - pl: "Postawił tezę, której nikt nie podważył."
        ru: "Он выдвинул тезис, который никто не опроверг."
        source: { kind: authored }
      - pl: "Bronił tej tezy przez dwie godziny."
        ru: "Он защищал этот тезис два часа."
        source: { kind: authored }
  - id: proposition
    ru: "положение, посылка"
    examples:
      - pl: "Teza i antyteza prowadzą do syntezy."
        ru: "Тезис и антитезис ведут к синтезу."
        source: { kind: authored }
      - pl: "Wszystkie tezy spisano na jednej kartce."
        ru: "Все положения записали на одном листке."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Род женский, в отличие от русского «тезиса», который мужской. По-польски TA teza, teza BYŁA słuszna, PIERWSZA teza. Это та же ловушка, что у analiza и zupa: смысл не страдает, а согласование выдаёт. Привычка к мужскому «тезису» тянет сказать «ten teza», и ошибка слышна сразу." }
  - { kind: pronunciation, text: "Дательный и предложный — TEZIE, со смягчением z в zi, как analiza — analizie и zaraza — zarazie. Родительный множественного — TEZ, с нулевым окончанием, по образцу analiz и zup. Форма короткая и легко путается с предлогом też «тоже», но у того другое написание и значение." }
collocations:
  - { pl: "postawić tezę", ru: "выдвинуть тезис" }
  - { pl: "bronić tezy", ru: "защищать тезис" }
  - { pl: "teza pracy", ru: "тезис работы" }
family:
  - { pl: "tezowy", ru: "тезисный", relation: derived }
  - { pl: "synteza", ru: "синтез", relation: root }
  - { pl: "hipoteza", ru: "гипотеза", relation: root }
etymology: "Из греческого thésis «положение, постановка», через латынь учёных текстов. Русский взял слово в мужском роде, как «тезис», сохранив греческое окончание; польский переделал его на свой лад в женское teza. Из того же корня hipoteza, synteza и наши «гипотеза», «синтез»."
memory: "Род женский: TA teza, в отличие от нашего мужского «тезиса». И предложный мягкий: w tezie, как w analizie."
idioms:
  - { pl: "postawić tezę", ru: "выдвинуть тезис" }
  - { pl: "teza i antyteza", ru: "тезис и антитезис" }
