# review
id: umowic
format: 2
lemma: "umówić"
rank: 1563
pos: verb
aspect: perf
pron: { cyr: "уму́виць" }
senses:
  - id: arrange
    ru: "договориться, записаться (на приём)"
    examples:
      - pl: "Mogę się umówić na badanie lekarskie?"
        ru: "Можно записаться на медосмотр?"
        source: { kind: translated, id: 355817 }
      - pl: "Dzwonię, żeby umówić się na spotkanie."
        ru: "Я звоню, чтобы договориться о встрече."
        source: { kind: translated, id: 9817460 }
      - pl: "Czy możemy umówić się na następny tydzień?"
        ru: "Можем ли мы договориться на следующую неделю?"
        source: { kind: translated, id: 8540927 }
  - id: arrange-meeting
    ru: "условиться о встрече"
    examples:
      - pl: "Umówiliśmy się tu na szóstą."
        ru: "Мы договорились здесь на шесть."
        source: { kind: translated, id: 353177 }
      - pl: "Umówiłem się z nim o siódmej."
        ru: "Я договорился с ним на семь."
        source: { kind: translated, id: 823233 }
      - pl: "Umówili spotkanie."
        ru: "Они условились о встрече."
        source: { kind: translated, id: 415308 }
  - id: have-appointment
    ru: "быть записанным, иметь назначенную встречу"
    examples:
      - pl: "Mam umówioną wizytę u lekarza."
        ru: "У меня встреча с доктором."
        source: { kind: tatoeba, id: 6313405 }
      - pl: "Niestety, jestem już umówiony."
        ru: "К сожалению, я уже занят."
        source: { kind: translated, id: 357112 }
notes:
  - { kind: usage, text: "Почти всегда с się: umówić się «договориться, условиться». Без się значит «записать кого-то»: umówić syna do dentysty «записать сына к дантисту»." }
  - { kind: usage, text: "Причастие umówiony значит «записанный, имеющий встречу»: Jestem umówiony «У меня назначено», mam umówioną wizytę «у меня назначен приём»." }
  - { kind: government, text: "С кем — z с творительным: umówić się z lekarzem «записаться к врачу». На когда — na с винительным: umówić się na szóstą «договориться на шесть»." }
  - { kind: false-friend, text: "Форма umów совпадает с родительным множественного существительного umowa «договор»: Umów należy dotrzymywać — это «договоры следует соблюдать», а вовсе не повеление." }
collocations:
  - { pl: "umówić się", ru: "договориться" }
  - { pl: "umówić się na wizytę", ru: "записаться на приём" }
  - { pl: "jestem umówiony", ru: "у меня назначено" }
etymology: "Приставка u- + mówić «говорить» — буквально «уговорить, оговорить». Русские «уговориться» и «условиться» собраны той же логикой: договорённость через речь."
memory: "umówić się = «договориться, записаться»: umówić się na wizytę «записаться на приём». Причастие umówiony значит «записан»: Jestem umówiony «У меня назначено». Осторожно: umów — это чаще родительный от umowa «договор», а не приказ."
idioms:
  - { pl: "umówić się", ru: "договориться" }
  - { pl: "jestem umówiony", ru: "у меня назначено" }
  - { pl: "umówiona wizyta", ru: "назначенный приём" }
