notes:
  - { kind: government, text: "Женский род: ta garstka, tej garstki. Дополнение в родительном: garstka ludzi «горстка людей»." }
  - { kind: false-friend, text: "Уменьшительное от garść «горсть», а то — от корня, общего с русским «горсть». Слово ręka «рука» уже есть в словаре." }
  - { kind: usage, text: "Почти всегда о людях и с оттенком «мало, меньше, чем хотелось бы»: garstka zwolenników «горстка сторонников»." }
  - { kind: usage, text: "В корпусе слово встречается один раз, поэтому большинство примеров составлено вручную." }
