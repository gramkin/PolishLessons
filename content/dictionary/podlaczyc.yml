notes:
  - { kind: government, text: "Схема одна и самая частая: PODŁĄCZYĆ COŚ DO CZEGOŚ — винительный на подключаемое и предлог DO с родительным на то, к чему подключают. PODŁĄCZYĆ PRALKĘ DO WODY, PODŁĄCZYĆ DRUKARKĘ DO KOMPUTERA. Русский на месте DO ставит «к» с дательным, и эта замена встречается в польском постоянно, не только здесь: вспомните PRZYTULIĆ SIĘ DO MATKI и ZALICZYĆ KOGOŚ DO GRONA. Проще один раз запомнить соответствие целиком: русское «к» с дательным отвечает польскому DO с родительным. Возвратное PODŁĄCZYĆ SIĘ POD COŚ с предлогом POD значит «примкнуть к чему-то»." }
  - { kind: false-friend, text: "Существительное POŁĄCZENIE значит сразу несколько вещей, которые русский называет разными словами. Это и «соединение» в технике, и «связь» по телефону — POŁĄCZENIE PRZERWANE «связь прервалась», — и «сообщение» на транспорте: POŁĄCZENIE KOLEJOWE DO KRAKOWA это «железнодорожное сообщение с Краковом», а не «соединение». Поэтому переводить POŁĄCZENIE одним словом нельзя, надо смотреть на дело. Прилагательное ŁĄCZNY означает «совокупный», а наречие ŁĄCZNIE — «в общей сложности, включая»." }
  - { kind: usage, text: "Приставка POD- отвечает русской ПОД- буквально, и PODŁĄCZYĆ ложится на «подключить» без остатка. Несовершенный партнёр — PODŁĄCZAĆ, с обычным чередованием Y и A. Пятьдесят три формы — подпись переходного глагола совершенного вида. Страдательное причастие мужского лица здесь вполне живое, PODŁĄCZENI DO SIECI, потому что подключать можно и людей, а не только приборы. Рядом полезно знать ZŁĄCZE «разъём», PRZEDŁUŻACZ «удлинитель» и WTYCZKA «вилка, штепсель»." }
  - { kind: pronunciation, text: "Читается «подуо́нчычь», три слога, ударение на предпоследнем. Буква Ł звучит как «у», а не как «л», поэтому в середине слова получается «дуо», что русскому глазу непривычно: написано ŁĄ, а слышно «уон». Носовое Ą перед CZ даёт «он». Конец слова звучит «чычь», с твёрдым и сразу мягким «ч», как в POLICZYĆ. В причастии PODŁĄCZONY слышно «подуончо́ны»." }
  - { kind: register, text: "Слово нейтральное, бытовое и техническое одновременно. Частые сочетания: PODŁĄCZYĆ PRĄD «подключить электричество», PODŁĄCZYĆ WODĘ, PODŁĄCZYĆ INTERNET, PODŁĄCZYĆ SIĘ DO WIFI. В переносном смысле PODŁĄCZYĆ SIĘ POD COŚ означает «примазаться, присоединиться к чужому начинанию», и оттенок бывает неодобрительный. В больнице говорят PODŁĄCZYĆ KROPLÓWKĘ «поставить капельницу», буквально «подключить»." }
collocations:
  - { pl: "podłączyć do prądu", ru: "подключить к электричеству" }
