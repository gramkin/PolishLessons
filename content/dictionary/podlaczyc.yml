etymology: "Приставка POD- плюс ŁĄCZYĆ, от праславянского *lǫčiti. У этого корня необычная судьба: он совмещал противоположные смыслы, разъединение и соединение, и языки разобрали их по-разному. Русский закрепил за ним прежде всего разлуку: «разлучить», «отлучить», «разлука». Польский, наоборот, оставил себе соединение: ŁĄCZYĆ «соединять», POŁĄCZENIE «связь», ŁĄCZNIK «связной». Но и русский сохранил вторую половину, причём в слове, которое никто не заподозрит: «случай» и «случиться» значат буквально «сойтись вместе», и корень там тот же. Так «разлука» и «случай» оказываются роднёй, а польское ŁĄCZYĆ стоит ровно посередине между ними."
memory: "Приставка pod- это русская под-, и podłączyć ложится на «подключить» без остатка. Управление идёт через do с родительным: podłączyć pralkę do wody, где русский просит «к» с дательным; та же замена работает в przytulić do и zaliczyć do. Ł читается как «у», отсюда «подуо́нчычь». И помнить, что połączenie значит и «соединение», и телефонную «связь», и «сообщение» на транспорте."
idioms:
  - { pl: "podłączyć się pod cudzy pomysł", ru: "примазаться к чужой затее" }
