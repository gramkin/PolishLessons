# review
id: ku
format: 2
lemma: "ku"
rank: 1839
pos: prep
pron: { cyr: "ку" }
senses:
  - id: towards
    ru: "к, по направлению к"
    examples:
      - pl: "Zaskoczenie i zachwyt - oto pierwszy krok ku zrozumieniu."
        ru: "Изумление и восторг — вот первый шаг к пониманию."
        source: { kind: translated, id: 350103 }
      - pl: "Sprawy nie idą ku lepszemu."
        ru: "Дела не идут к лучшему."
        source: { kind: translated, id: 4916389 }
      - pl: "Ku lepszym jutrom!"
        ru: "К лучшему завтра!"
        source: { kind: translated, id: 9474247 }
  - id: purpose
    ru: "к, в честь, ради (цель, повод)"
    examples:
      - pl: "Pomnik został wzniesiony ku pamięci poległych."
        ru: "Памятник был воздвигнут в память о павших."
        source: { kind: translated, id: 3188199 }
      - pl: "Ku mojemu zdziwieniu, drzwi były otwarte."
        ru: "К моему удивлению, дверь была открыта."
        source: { kind: translated, id: 502259 }
      - pl: "Wyprawili przyjęcie ku czci."
        ru: "Они устроили приём в чью-то честь."
        source: { kind: translated, id: 841704 }
notes:
  - { kind: government, text: "ku требует дательного падежа — в польском это редкость: ku pamięci, ku czci, ku memu zdziwieniu." }
  - { kind: false-friend, text: "Русское «к» обычно переводится не через ku, а через do: «иду к врачу» — idę do lekarza, «подойди ко мне» — podejdź do mnie. ku звучит книжно и живёт в основном в устойчивых оборотах." }
  - { kind: usage, text: "Самый частый оборот — ku mojemu zdziwieniu «к моему удивлению»; так же строятся ku naszemu rozczarowaniu «к нашему разочарованию» и ku radości wszystkich «к радости всех»." }
  - { kind: usage, text: "Для направления вместо ku обычно говорят w stronę: idzie w stronę rzeki «он идёт в сторону реки»." }
collocations:
  - { pl: "ku pamięci", ru: "в память" }
  - { pl: "ku czci", ru: "в честь" }
  - { pl: "ku mojemu zdziwieniu", ru: "к моему удивлению" }
etymology: "Праславянское *kъ — то же слово, что русское «к»; польское ku сохранило старый гласный на конце."
memory: "ku — это «к», но книжное: в живой речи «к врачу» будет do lekarza, а «в сторону реки» — w stronę rzeki. ku осталось в устойчивых оборотах: ku pamięci «в память», ku czci «в честь», ku mojemu zdziwieniu «к моему удивлению». И требует дательного падежа."
idioms:
  - { pl: "ku mojemu zdziwieniu", ru: "к моему удивлению" }
  - { pl: "ku pamięci", ru: "в память" }
  - { pl: "ku czci", ru: "в честь" }
