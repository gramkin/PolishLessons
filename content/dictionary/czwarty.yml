lemma: "czwarty"
rank: 1618
pos: num
pron: { cyr: "чва́рты" }
senses:
  - id: ordinal
    ru: "четвёртый (по порядку)"
    examples:
      - pl: "Gdzie jest peron czwarty?"
        ru: "Где четвёртая платформа?"
        source: { kind: translated, id: 12206680 }
      - pl: "To już czwarty raz w tym tygodniu!"
        ru: "Это уже четвёртый раз на этой неделе!"
        source: { kind: translated, id: 10849495 }
      - pl: "Opuściła na egzaminie czwarte pytanie."
        ru: "Она пропустила на экзамене четвёртый вопрос."
        source: { kind: translated, id: 406287 }
  - id: clock
    ru: "четыре часа (о времени)"
    examples:
      - pl: "Wróci o czwartej."
        ru: "Он вернётся в четыре."
        source: { kind: translated, id: 355746 }
      - pl: "Jest wpół do czwartej."
        ru: "Сейчас полчетвёртого."
        source: { kind: translated, id: 4437773 }
      - pl: "Na moim zegarku jest czwarta."
        ru: "На моих часах четыре."
        source: { kind: translated, id: 362055 }
  - id: fraction
    ru: "четверть (в дробях)"
    examples:
      - pl: "Trzy czwarte powierzchni Ziemi to woda."
        ru: "Три четверти поверхности Земли — вода."
        source: { kind: translated, id: 3656284 }
      - pl: "Jedna czwarta."
        ru: "Одна четвёртая."
        source: { kind: translated, id: 6443096 }
notes:
  - { kind: usage, text: "Порядковое числительное склоняется как прилагательное: czwarty, czwartego, czwartemu, czwartym, czwartych." }
  - { kind: usage, text: "Женский род даёт время: (godzina) czwarta «четыре часа», o czwartej «в четыре», wpół do czwartej «полчетвёртого». Польский считает часы порядковыми числительными, русский — количественными, поэтому буквальный перевод не работает." }
  - { kind: usage, text: "Средний род множественного даёт дроби: trzy czwarte «три четверти», jedna czwarta «одна четвёртая» — ровно как у trzeci: dwie trzecie «две трети»." }
  - { kind: usage, text: "В датах идёт родительный падеж, как и в русском: czwartego lipca «четвёртого июля»." }
collocations:
  - { pl: "o czwartej", ru: "в четыре часа" }
  - { pl: "trzy czwarte", ru: "три четверти" }
  - { pl: "czwarte piętro", ru: "четвёртый этаж" }
  - { pl: "czwartego lipca", ru: "четвёртого июля" }
etymology: "От cztery «четыре», праславянское *četvьrtъ — то же слово, что русское «четвёртый». Соответствие регулярное: польское czw- отвечает русскому «четв-»."
memory: "czwarty = «четвёртый», от cztery. Две ловушки: время — женский род (o czwartej «в четыре»), а дроби — средний род множественного (trzy czwarte «три четверти»). В датах родительный: czwartego lipca."
idioms:
  - { pl: "trzy czwarte", ru: "три четверти" }
  - { pl: "o czwartej", ru: "в четыре часа" }
  - { pl: "czwarta władza", ru: "четвёртая власть" }
