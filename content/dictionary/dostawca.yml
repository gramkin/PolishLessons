# review
id: dostawca
format: 2
lemma: "dostawca"
rank: 4174
pos: noun
pron: { cyr: "доста́фца" }
senses:
  - id: supplier
    ru: "поставщик; доставщик, курьер"
    examples:
      - pl: "Dostawca przywiózł towar rano."
        ru: "Поставщик привёз товар утром."
        source: { kind: authored }
      - pl: "Dostawca pizzy czekał pod drzwiami."
        ru: "Курьер с пиццей ждал у двери."
        source: { kind: authored }
      - pl: "Zmieniliśmy dostawcę prądu."
        ru: "Мы сменили поставщика электроэнергии."
        source: { kind: authored }
      - pl: "Firma szuka nowego dostawcy części."
        ru: "Фирма ищет нового поставщика запчастей."
        source: { kind: authored }
      - pl: "Dostawca spóźnił się o godzinę."
        ru: "Курьер опоздал на час."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "DOSTAWCA — и «поставщик», и «доставщик, курьер»: DOSTAWCA PIZZY. DOSTAWA — «доставка» и «поставка». Грузовой фургон — SAMOCHÓD DOSTAWCZY." }
  - { kind: usage, text: "Девять живых форм. Мужской род, но в единственном склоняется как женское на -A: DOSTAWCY, DOSTAWCĘ, DOSTAWCĄ. Множественное — DOSTAWCY, DOSTAWCÓW. Звательный не даётся." }
  - { kind: government, text: "Поставщик чего — родительный: DOSTAWCA PRĄDU, DOSTAWCA CZĘŚCI. Сменить поставщика — ZMIENIĆ DOSTAWCĘ, винительный." }
  - { kind: pronunciation, text: "Читается «доста́фца», ударение на предпоследнем слоге. W перед C оглушается в «ф»." }
collocations:
  - { pl: "dostawca pizzy", ru: "курьер с пиццей" }
  - { pl: "dostawca prądu", ru: "поставщик электроэнергии" }
  - { pl: "zmienić dostawcę", ru: "сменить поставщика" }
family:
  - { pl: "dostawa", ru: "доставка, поставка", relation: root, id: dostawa }
  - { pl: "dostarczyć", ru: "доставить", relation: root, id: dostarczyc }
  - { pl: "dostawczy", ru: "грузовой, для доставки", relation: derived }
etymology: "От DOSTAWIAĆ, DOSTAWA «доставлять, поставка», с суффиксом деятеля -CA, как KIEROWCA и SPRZEDAWCA."
memory: "Dostawca — поставщик и курьер: dostawca pizzy. Читается «доста́фца». Dostawa — доставка. Samochód dostawczy — фургон."
idioms:
  - { pl: "dostarczyć coś pod drzwi", ru: "доставить что-то к самой двери" }
formExamplesSkip:
