# review
id: sprobowac
format: 2
lemma: "spróbować"
rank: 313
pos: verb
aspect: perf
pron: { cyr: "спрубо́ваць" }
senses:
  - id: try
    ru: "попробовать, попытаться"
    examples:
      - pl: "Spróbujmy."
        ru: "Попробуй."
        source: { kind: tatoeba, id: 358751 }
      - pl: "Spróbuj ponownie."
        ru: "Попробуй ещё раз."
        source: { kind: tatoeba, id: 6373475 }
      - pl: "Spróbujmy jeszcze raz."
        ru: "Давай попробуем еще раз."
        source: { kind: tatoeba, id: 568301 }
  - id: taste
    ru: "попробовать (на вкус), отведать"
    note: "На вкус пробуют родительным падежом: spróbować zupy."
    examples:
      - pl: "Spróbowali chleba."
        ru: "Они попробовали хлеба."
        source: { kind: translated, id: 11142799 }
      - pl: "Tom spróbował ciasta."
        ru: "Том попробовал торт."
        source: { kind: translated, id: 3649921 }
      - pl: "Spróbuj tej zupy."
        ru: "Попробуй этот суп."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Два управления: spróbować czegoś — «попробовать чего-то» на вкус (родительный падеж), spróbować coś zrobić — «попытаться что-то сделать» (инфинитив)." }
  - { kind: usage, text: "Несовершенный вид — próbować: Próbuję od godziny «Я пробую уже час»." }
  - { kind: usage, text: "Spróbuj! годится и как поощрение «Попробуй!», и как вызов «Только попробуй!»." }
  - { kind: usage, text: "warto spróbować — «стоит попробовать»; nie zaszkodzi spróbować — «попробовать не повредит»." }
collocations:
  - { pl: "spróbuj jeszcze raz", ru: "попробуй ещё раз" }
  - { pl: "warto spróbować", ru: "стоит попробовать" }
  - { pl: "spróbować szczęścia", ru: "попытать счастья" }
  - { pl: "spróbować zupy", ru: "попробовать супа" }
etymology: "Из s- + próbować, от próba «проба», а то — из латинского proba; в русский «проба» и «пробовать» пришли тем же путём."
memory: "spróbować — «попробовать» и «попытаться». На вкус пробуют родительным падежом: spróbuj zupy. А с инфинитивом — «попытаться»: spróbuję to zrobić."
idioms:
  - { pl: "spróbować szczęścia", ru: "попытать счастья" }
  - { pl: "warto spróbować", ru: "стоит попробовать" }
  - { pl: "spróbuj jeszcze raz", ru: "попробуй ещё раз" }
