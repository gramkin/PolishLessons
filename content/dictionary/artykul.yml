# review
id: artykul
format: 2
lemma: "artykuł"
rank: 1771
pos: noun
pron: { cyr: "арты́куу" }
senses:
  - id: article-text
    ru: "статья (в газете, журнале)"
    examples:
      - pl: "Przeczytałem artykuł."
        ru: "Я прочитал статью."
        source: { kind: translated, id: 10602668 }
      - pl: "Czytałeś ten artykuł?"
        ru: "Ты читал эту статью?"
        source: { kind: translated, id: 393041 }
      - pl: "Przeczytałem wczoraj artykuł o kwaśnych deszczach."
        ru: "Я вчера прочитал статью про кислотные дожди."
        source: { kind: tatoeba, id: 8669039 }
  - id: article-law
    ru: "статья (закона); товар"
    examples:
      - pl: "Wierzę, że Japonia dotrzyma 9. artykułu konstytucji."
        ru: "Я верю, что Япония сохранит девятую статью конституции."
        source: { kind: translated, id: 901444 }
      - pl: "Jest autorem artykułu."
        ru: "Он автор статьи."
        source: { kind: translated, id: 4289279 }
      - pl: "Stale piszę artykuły."
        ru: "Я постоянно пишу статьи."
        source: { kind: translated, id: 416491 }
notes:
  - { kind: usage, text: "Три значения сразу: статья в газете, статья закона (artykuł 9. konstytucji) и товар (artykuły spożywcze «продовольственные товары»)." }
  - { kind: government, text: "В статье — w artykule (предложный падеж); автор статьи — autor artykułu (родительный)." }
  - { kind: false-friend, text: "Русский «артикул» как товарный номер по-польски будет numer katalogowy; польское artykuł в торговом смысле значит сам товар." }
  - { kind: usage, text: "artykuły spożywcze — «продукты питания», частая вывеска на магазинах." }
collocations:
  - { pl: "napisać artykuł", ru: "написать статью" }
  - { pl: "w artykule", ru: "в статье" }
  - { pl: "artykuły spożywcze", ru: "продовольственные товары" }
family:
  - { pl: "gazeta", ru: "газета", relation: root, id: gazeta }
  - { pl: "artykulik", ru: "статейка", relation: root }
  - { pl: "towar", ru: "товар", relation: root, id: towar }
etymology: "Из латинского articulus «сустав, членик», через которое слово пришло и в русский. Отсюда и «статья» как отдельный член текста."
memory: "artykuł — «статья»: и в газете, и в законе. А ещё «товар»: artykuły spożywcze «продукты питания». В статье — w artykule."
idioms:
  - { pl: "artykuły spożywcze", ru: "продовольственные товары" }
  - { pl: "napisać artykuł", ru: "написать статью" }
  - { pl: "artykuł wstępny", ru: "передовая статья" }
