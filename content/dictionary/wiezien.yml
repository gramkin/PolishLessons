notes:
  - { kind: usage, text: "Формы więźnie у этого существительного нет: множественное — więźniowie, więźniów, więźniom, więźniami, więźniach. Само слово więźnie существует, но принадлежит глаголу więznąć «застревать»: słowo więźnie w gardle «слово застревает в горле»." }
  - { kind: usage, text: "В основе чередование ź/z: więzień, но więźnia, więźniowi, więźniowie. В русском такого чередования нет, поэтому формы надо запоминать." }
  - { kind: usage, text: "Лично-мужское множественное — więźniowie «заключённые»; więźniów — родительный и винительный множественного." }
  - { kind: false-friend, text: "Не путайте więzień «заключённый» (человек) и więzienie «тюрьма» (место): Więzień uciekł z więzienia «Заключённый сбежал из тюрьмы»." }
  - { kind: usage, text: "więzień polityczny — «политзаключённый», устойчивое сочетание." }
collocations:
  - { pl: "więzień polityczny", ru: "политзаключённый" }
  - { pl: "zbiegły więzień", ru: "беглый заключённый" }
  - { pl: "uwolnić więźniów", ru: "освободить заключённых" }
etymology: "От więzić «держать в заключении», корень тот же, что в wiązać «вязать» и węzeł «узел» (праславянское *vęz-). Русское «узник» от «узы» — тоже от «вязать»: оба языка назвали заключённого через связывание."
memory: "więzień = «заключённый» (человек), а więzienie = «тюрьма» (место) — не путайте. В основе чередование ź/z: więzień, но więźnia, więźniowie. Корень тот же, что в wiązać «вязать», как русское «узник» от «узы»."
idioms:
  - { pl: "więzień polityczny", ru: "политзаключённый" }
  - { pl: "zbiegły więzień", ru: "беглый заключённый" }
  - { pl: "być więźniem własnych myśli", ru: "быть узником собственных мыслей" }
formExamplesSkip:
  - { form: "więźnie", reason: "такой формы у существительного нет: множественное — więźniowie; więźnie — это форма глагола więznąć «застревать»" }
