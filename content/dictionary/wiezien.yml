        ru: "Заключённого выпустили вчера."
        source: { kind: translated, id: 529519 }
  - id: captive
    ru: "пленник, узник (в том числе переносно)"
    examples:
      - pl: "Jestem więźniem."
        ru: "Я заключённый."
        source: { kind: translated, id: 8734621 }
      - pl: "Jesteś więźniem."
        ru: "Ты заключённый."
        source: { kind: translated, id: 3685500 }
