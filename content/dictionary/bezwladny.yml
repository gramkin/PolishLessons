# review
id: bezwladny
format: 2
lemma: "bezwładny"
rank: 2062
pos: adj
pron: { cyr: "безвуа́дны" }
senses:
  - id: limp
    ru: "обмякший, безжизненный"
    examples:
      - pl: "Jego ręka była bezwładna."
        ru: "Его рука была безжизненной."
        source: { kind: authored }
      - pl: "Leżał bezwładny na podłodze."
        ru: "Он лежал обмякший на полу."
        source: { kind: authored }
      - pl: "Bezwładne ciało osunęło się."
        ru: "Обмякшее тело осело."
        source: { kind: authored }
  - id: inert
    ru: "инертный (в физике)"
    examples:
      - pl: "To bezwładny mechanizm."
        ru: "Это инертный механизм."
        source: { kind: authored }
      - pl: "Masa bezwładna to pojęcie z fizyki."
        ru: "Инертная масса — понятие из физики."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Не «безвластный». Корень władać «владеть, управлять»: bezwładny — тот, кто не владеет своим движением." }
  - { kind: usage, text: "Два круга употребления: о теле — «обмякший, безжизненный», в физике — «инертный» (masa bezwładna)." }
  - { kind: government, text: "Обычное прилагательное на -y." }
  - { kind: usage, text: "Рядом стоят bezwład «паралич, бессилие» и bezwładność «инерция»." }
collocations:
  - { pl: "bezwładne ciało", ru: "обмякшее тело" }
  - { pl: "masa bezwładna", ru: "инертная масса" }
etymology: "bez + władać «владеть, управлять»; ср. русское «власть», «владеть»."
memory: "bezwładny — «обмякший, безжизненный», а в физике «инертный». Корень władać «владеть»: не владеющий движением. Не путайте с «безвластным»."
idioms:
  - { pl: "masa bezwładna", ru: "инертная масса" }
