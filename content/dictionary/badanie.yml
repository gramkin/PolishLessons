# review
id: badanie
format: 2
lemma: "badanie"
rank: 913
pos: noun
pron: { cyr: "бада́не" }
senses:
  - id: examination
    ru: "обследование, осмотр (медицинский), анализ"
    examples:
      - pl: "Przeszła szczegółowe badanie."
        ru: "Она прошла подробное обследование."
        source: { kind: translated, id: 416263 }
      - pl: "Mogę się umówić na badanie lekarskie?"
        ru: "Можно записаться на медицинское обследование?"
        source: { kind: translated, id: 355817 }
      - pl: "Badania toksykologiczne wykazały obecność diacetylomorfiny."
        ru: "Токсикологический анализ дал положительный результат на диацетилморфин."
        source: { kind: tatoeba, id: 13832458 }
  - id: research
    ru: "badania (мн. ч.) — исследования, научная работа"
    note: "Во множественном числе слово почти всегда значит «исследования»."
    examples:
      - pl: "Polscy archeolodzy prowadzą badania w Afryce."
        ru: "Польские археологи проводят исследования в Африке."
        source: { kind: tatoeba, id: 880239 }
      - pl: "Wyniki badań były całkiem zadowalające."
        ru: "Результаты исследований были вполне удовлетворительными."
        source: { kind: translated, id: 524983 }
      - pl: "Poszerzył zakres swych badań."
        ru: "Он расширил круг своих исследований."
        source: { kind: translated, id: 368881 }
  - id: study-of
    ru: "badanie czegoś — изучение чего-л."
    examples:
      - pl: "Interesuję się badaniem owadów."
        ru: "Я интересуюсь изучением насекомых."
        source: { kind: translated, id: 2770479 }
      - pl: "Zoologia i botanika zajmują się badaniem życia."
        ru: "Зоология и ботаника занимаются изучением жизни."
        source: { kind: translated, id: 1348605 }
      - pl: "Poświęcił się badaniom."
        ru: "Он посвятил себя исследованиям."
        source: { kind: translated, id: 596650 }
notes:
  - { kind: usage, text: "Единственное число чаще всего медицинское: badanie lekarskie «медицинский осмотр», badanie krwi «анализ крови». Множественное badania — «исследования, научная работа»." }
  - { kind: usage, text: "Отглагольное существительное от badać «исследовать, обследовать»: badać — badanie, ровно как pisać — pisanie." }
  - { kind: government, text: "badanie czegoś «изучение чего-то» — родительный падеж; badania NAD czymś «исследования чего-то» — творительный после nad: badania nad rakiem." }
  - { kind: usage, text: "Исследователь — badacz, а «обследовать, проверить» — zbadać: Lekarz mnie zbadał." }
collocations:
  - { pl: "badanie lekarskie", ru: "медицинский осмотр" }
  - { pl: "badanie krwi", ru: "анализ крови" }
  - { pl: "badania nad czymś", ru: "исследования чего-либо" }
  - { pl: "wyniki badań", ru: "результаты исследований" }
family:
  - { pl: "badać", ru: "исследовать", relation: root }
  - { pl: "badacz", ru: "исследователь", relation: derived }
  - { pl: "zbadać", ru: "обследовать", relation: derived }
etymology: "Отглагольное существительное от badać «исследовать, обследовать» — по той же модели, что pisać — pisanie. В русском родственника нет, слово запоминается отдельно."
memory: "badanie — отглагольное существительное от badać. В единственном числе оно чаще медицинское: badanie lekarskie «осмотр», badanie krwi «анализ крови». А во множественном badania значит «исследования»: badania nad rakiem «исследования рака»."
idioms:
  - { pl: "badanie lekarskie", ru: "медицинский осмотр" }
  - { pl: "badanie krwi", ru: "анализ крови" }
  - { pl: "wyniki badań", ru: "результаты исследований" }
formExamplesSkip:
