notes:
  - { kind: false-friend, text: "Уменьшительное понятно сразу, а вот большое слово держит сразу два русских. OBRAZ значит и «картина», и «образ»: OBRAZ MATKI BOSKIEJ это икона, а OBRAZ ŚWIATA — картина мира, мировоззрение. Русский развёл это по двум словам, польский оставил в одном. Зато WYOBRAŹNIA «воображение» построена у них от OBRAZ точно так же, как наше слово от «образа»." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. В основе беглое E, которое выпадает во всех косвенных падежах: OBRAZEK, но OBRAZKA, OBRAZKIEM, OBRAZKU. Так же устроены DZWONEK и SPADEK. ŚWIĘTY OBRAZEK это иконка, маленькая картинка со святым, какие дают детям на первое причастие, и выражение это слышно постоянно." }
  - { kind: government, text: "На картинке — NA OBRAZKU, местный падеж. Как с картинки — JAK Z OBRAZKA, предлог Z с родительным, и оборот этот значит «очень красиво», ровно как у нас. Под картинкой — POD OBRAZKIEM, творительный. Без картинки — BEZ OBRAZKA, родительный." }
  - { kind: pronunciation, text: "Читается «обра́зэк», три слога, ударение на предпоследнем. Сочетание BR произносится слитно. Буква Z между гласными звучит как «з», без оглушения. Конечная E даёт «э», отсюда «зэк». В косвенных падежах беглое E пропадает, и OBRAZKA звучит «обра́зка», где Z перед K уже оглушается в «с»: «обра́ска»." }
  - { kind: register, text: "Слово повседневное и детское сразу. OBRAZKI W ELEMENTARZU помнит каждый поляк, KSIĄŻKA Z OBRAZKAMI это книжка с картинками. ŚWIĘTY OBRAZEK принадлежит церковному обиходу. А оборот JAK Z OBRAZKA употребляют о людях и о видах: WYGLĄDA JAK Z OBRAZKA значит «выглядит как с картинки»." }
