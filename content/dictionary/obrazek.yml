etymology: "Уменьшительное от OBRAZ, слова праславянского и того же, что русский «образ». Корень в нём означал удар и резьбу: образ это то, что вырезано, отпечатано. Отсюда же и OBRAZA «обида», потому что обидеть значит ударить словом, и OBRAZIĆ SIĘ — «обидеться». Так картина и обида оказались родней, и в русском «образ» рядом с «обидой» слышно то же самое."
memory: "Картинка, уменьшительное от obraz. Главное — большое слово: obraz значит и «картина», и «образ», где русский держит два слова. От него же wyobraznia «воображение», как наше слово от «образа». Читается «обра́зэк», беглое e выпадает: obrazka, и z там оглушается в «с». Запомните jak z obrazka — «как с картинки», и swiety obrazek — «иконка»."
idioms:
  - { pl: "jak z obrazka", ru: "как с картинки" }
