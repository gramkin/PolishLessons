# review
id: gaz
format: 2
lemma: "gaz"
rank: 1535
pos: noun
pron: { cyr: "гас" }
senses:
  - id: state
    ru: "газ (состояние вещества)"
    examples:
      - pl: "Powietrze stanowi mieszaninę gazów."
        ru: "Воздух представляет собой смесь газов."
        source: { kind: translated, id: 670316 }
      - pl: "Powierzchnia Jowisza jest prawdopodobnie jak zagadkowa breja pod gęstymi, trującymi gazami."
        ru: "Поверхность Юпитера — вероятно, загадочное месиво под густыми ядовитыми газами."
        source: { kind: translated, id: 1637745 }
      - pl: "Gaz to jeden ze stanów skupienia materii."
        ru: "Газ — одно из агрегатных состояний вещества."
        source: { kind: authored }
  - id: household
    ru: "газ (бытовой)"
    examples:
      - pl: "To pachnie jak gaz."
        ru: "Пахнет газом."
        source: { kind: tatoeba, id: 3659298 }
      - pl: "Nie zapomnij wyłączyć gaz."
        ru: "Не забудь выключить газ."
        source: { kind: tatoeba, id: 5416844 }
      - pl: "Gotuje Pani na gazie czy na kuchni elektrycznej?"
        ru: "Вы готовите на газе или на электрической плите?"
        source: { kind: translated, id: 3365263 }
  - id: tear-gas
    ru: "газ (слезоточивый)"
    examples:
      - pl: "Policja użyła wobec protestujących gazu łzawiącego."
        ru: "Полиция применила против протестующих слезоточивый газ."
        source: { kind: translated, id: 11247960 }
      - pl: "Rzuć w niego granatem z gazem łzawiącym."
        ru: "Брось в него гранату со слезоточивым газом."
        source: { kind: translated, id: 8671640 }
  - id: pedal
    ru: "газ (педаль акселератора)"
    examples:
      - pl: "Wcisnął gaz do dechy."
        ru: "Он вдавил газ до упора."
        source: { kind: authored }
      - pl: "Dodaj gazu!"
        ru: "Прибавь газу!"
        source: { kind: authored }
notes:
  - { kind: usage, text: "Одно слово покрывает несколько русских «газов»: состояние вещества, бытовой газ, слезоточивый газ и педаль акселератора." }
  - { kind: false-friend, text: "Форма gazy в корпусе чаще оказывается другим словом: Strefa Gazy «сектор Газа» (имя собственное) и płaty gazy «куски марли» (от gaza «марля»). Собственно «газы» — тоже gazy, но это разные слова." }
  - { kind: usage, text: "Разговорные обороты: gaz do dechy «газ до упора», pod gazem и na gazie «подшофе»." }
  - { kind: government, text: "Родительный — gazu: nie ma gazu «нет газа»; винительный — gaz: zakręcić gaz «перекрыть газ»." }
collocations:
  - { pl: "wyłączyć gaz", ru: "выключить газ" }
  - { pl: "gaz łzawiący", ru: "слезоточивый газ" }
  - { pl: "gaz do dechy", ru: "газ в пол" }
  - { pl: "mieszanina gazów", ru: "смесь газов" }
etymology: "Слово придумал в XVII веке фламандский химик ван Гельмонт, оттолкнувшись от греческого слова «хаос». Русское «газ» пришло тем же европейским путём, так что слова — прямые родственники."
memory: "gaz — и «газ» (вещество, бытовой, слезоточивый), и «газ» как педаль: gaz do dechy «газ до упора». Осторожно с формой gazy: в корпусе это чаще Strefa Gazy «сектор Газа» или gaza «марля»."
idioms:
  - { pl: "gaz do dechy", ru: "газ в пол" }
  - { pl: "pod gazem", ru: "подшофе" }
  - { pl: "gaz łzawiący", ru: "слезоточивый газ" }
