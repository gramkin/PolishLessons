etymology: "От NORYMBERGA, давней польской переделки немецкого названия NÜRNBERG, с суффиксом -SKI, которым образуются прилагательные от названий городов: KRAKOWSKI, WARSZAWSKI."
memory: "NÜRNBERG по-польски NORYMBERGA, отсюда NORYMBERSKI. Главное сочетание: PROCES NORYMBERSKI «Нюрнбергский процесс», со строчной буквы."
