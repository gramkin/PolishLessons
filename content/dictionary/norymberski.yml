notes:
  - { kind: usage, text: "Город по-польски называется NORYMBERGA, а не «Нюрнберг»: польский давно переделал немецкое NÜRNBERG на свой лад, как MONACHIUM «Мюнхен», KOLONIA «Кёльн», AKWIZGRAN «Ахен». Прилагательное строится от польского имени: NORYMBERSKI. Пишется со строчной буквы: «proces norymberski», «ustawy norymberskie». С заглавной оно стоит только внутри собственного названия учреждения: «Trybunał Norymberski». Русский пишет «Нюрнбергский процесс» с заглавной, польский нет." }
  - { kind: usage, text: "Относительное прилагательное, степеней сравнения нет, одиннадцать форм. В мужско-личном множественном числе SK переходит в SC: NORYMBERSCY KUPCY «нюрнбергские купцы», как POLSCY, NIEMIECCY. Эта форма нужна только с названиями людей: ремесленников, купцов, судей." }
  - { kind: pronunciation, text: "Читается «норымбэ́рски»: ударение на предпоследнем слоге, Y звучит как «ы», R твёрдое, поэтому после него «э», а не мягкое «е». Сочетание MB читается как написано, без носового гласного. Русский по привычке хочет сказать «нюрн-», но польское слово начинается с чистого «но-»." }
