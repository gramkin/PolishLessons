notes:
  - { kind: pronunciation, text: "Форма WYOBRAŹNI обслуживает четыре падежа: родительный, дательный и предложный единственного плюс родительный множественного, и пишется с одним i. Так ведут себя исконные слова на -nia: pustynia — pustyni, kłótnia — kłótni. Заимствования на -ia берут два i: tragedia — tragedii, kopia — kopii. В основе здесь ещё и смягчение z в ź: obraz даёт wyobraźnia." }
  - { kind: usage, text: "Слово построено от OBRAZ «образ» так же, как русское «воображение»: wy-obraź-nia против во-об-раж-ение, и в обоих случаях названа способность создавать образы. Глагол при этом возвратный и без sobie не живёт: WYOBRAZIĆ SOBIE, «вообразить себе». Сказать wyobrazić без sobie нельзя, и это та деталь, которую русский опускает свободно." }
collocations:
  - { pl: "bujna wyobraźnia", ru: "буйное воображение" }
  - { pl: "wytwór wyobraźni", ru: "плод воображения" }
  - { pl: "puścić wodze wyobraźni", ru: "дать волю воображению" }
family:
  - { pl: "obraz", ru: "образ, картина", relation: root, id: obraz }
  - { pl: "wyobrazić sobie", ru: "вообразить", relation: root }
  - { pl: "wyobrażenie", ru: "представление", relation: derived }
etymology: "От OBRAZ «образ, картина», из праславянского *obrazъ — то же слово, что русский «образ». Приставка wy- и суффикс -nia дают название способности: то, чем выводят образы наружу. Русское «воображение» собрано иначе по приставкам, но из того же корня и с той же мыслью, так что слова отвечают друг другу часть за часть."
memory: "WYOBRAŹNI с одним i — четыре падежа сразу, потому что слово исконное; у заимствованной tragedii два. А корень тот же, что в «образе»."
idioms:
