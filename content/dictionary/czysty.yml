# review
id: czysty
format: 2
lemma: "czysty"
rank: 586
pos: adj
pron: { cyr: "чы́сты" }
senses:
  - id: clean
    ru: "чистый (не грязный)"
    note: "czysta woda «чистая вода», czyste talerze «чистые тарелки»."
    examples:
      - pl: "Woda jest czysta."
        ru: "Вода чистая."
        source: { kind: translated, id: 10473292 }
      - pl: "Nie ma czystych talerzy."
        ru: "Нет чистых тарелок."
        source: { kind: translated, id: 2213008 }
      - pl: "Daj mi czystą kartkę papieru."
        ru: "Дай мне чистый лист бумаги."
        source: { kind: translated, id: 1179749 }
  - id: pure
    ru: "чистый, беспримесный"
    note: "czyste złoto «чистое золото», czysta bawełna «чистый хлопок»."
    examples:
      - pl: "Czy to czyste złoto?"
        ru: "Это чистое золото?"
        source: { kind: tatoeba, id: 352719 }
      - pl: "Ten ręcznik jest wykonany z czystego lnu."
        ru: "Это полотенце сделано из чистого льна."
        source: { kind: translated, id: 12470224 }
      - pl: "Spróbuj tę koszulę, jest z czystej bawełny."
        ru: "Примерь эту рубашку, она из чистого хлопка."
        source: { kind: translated, id: 368476 }
  - id: sheer
    ru: "чистый (в переносном смысле)"
    note: "czysta prawda «чистая правда», czystym przypadkiem «чистой случайностью»."
    examples:
      - pl: "To czysta prawda."
        ru: "Это чистая правда."
        source: { kind: tatoeba, id: 350718 }
      - pl: "Nasze spotkanie było czystym przypadkiem."
        ru: "Наша встреча была чистой случайностью."
        source: { kind: tatoeba, id: 4725228 }
      - pl: "Dzisiejszy dzień był czystym szaleństwem!"
        ru: "Сегодняшний день был чистым безумием!"
        source: { kind: tatoeba, id: 6156024 }
notes:
  - { kind: usage, text: "Сравнительная степень двоится: морфология даёт и czystszy, и czyściejszy, но живой язык берёт czystszy — вторая ветвь в корпусе не встречается вовсе." }
  - { kind: usage, text: "Переносное значение очень частое: czysta prawda «чистая правда», czystym przypadkiem «чистой случайностью», czyste szaleństwo «чистое безумие»." }
  - { kind: false-friend, text: "Осторожно с формой czyści: как прилагательное это «чистые» о мужчинах, а как глагол — «чистит» от czyścić. Tom czyści garderobę значит «Том чистит гардероб»." }
  - { kind: usage, text: "Глагол — czyścić «чистить», существительное — czystość «чистота», наречие — czysto." }
collocations:
  - { pl: "czysta prawda", ru: "чистая правда" }
  - { pl: "czyste złoto", ru: "чистое золото" }
  - { pl: "czystym przypadkiem", ru: "чистой случайностью" }
  - { pl: "czyste sumienie", ru: "чистая совесть" }
family:
  - { pl: "czyścić", ru: "чистить", relation: root }
  - { pl: "czystość", ru: "чистота", relation: derived }
  - { pl: "oczyścić", ru: "очистить", relation: derived }
etymology: "От праславянского *čistъ — то же слово, что русское «чистый»; отсюда же czyścić «чистить» и czystość «чистота»."
memory: "czysty — «чистый», и во всех смыслах сразу: czysta woda, czyste złoto «чистое золото», czysta prawda «чистая правда», czystym przypadkiem «чистой случайностью». Главная тонкость — сравнительная степень: морфология даёт и czystszy, и czyściejszy, но живой язык берёт czystszy. И осторожнее с формой czyści: как прилагательное это «чистые» о мужчинах, а как глагол — «чистит» от czyścić."
