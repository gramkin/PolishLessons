etymology: "От ponowny «повторный», а то от nowy «новый» — буквально «за-ново». Русское «вновь» собрано так же, от «новый»."
memory: "ponownie — «снова, вновь», и собрано оно от nowy «новый», буквально «за-ново», ровно как русское «вновь». Держите в уме регистр: ponownie книжнее, чем znowu, и живёт в канцелярском и газетном языке — ponownie rozpatrzono sprawę. В разговоре скажут znowu."
