# review
id: ponownie
format: 2
lemma: "ponownie"
rank: 806
pos: adv
pron: { cyr: "поно́вне" }
senses:
  - id: again
    ru: "снова, вновь"
    examples:
      - pl: "Spróbuj ponownie."
        ru: "Попробуй ещё раз."
        source: { kind: tatoeba, id: 6373475 }
      - pl: "Wkrótce wyszła ponownie za mąż."
        ru: "Вскоре она вновь вышла замуж."
        source: { kind: tatoeba, id: 988617 }
      - pl: "Ja nie opuszczę ciebie ponownie."
        ru: "Я не покину тебя снова."
        source: { kind: tatoeba, id: 13781653 }
  - id: try-again
    ru: "spróbuj ponownie — попробуй ещё раз"
    examples:
      - pl: "Spróbuj ponownie za chwilę."
        ru: "Попробуй снова через минуту."
        source: { kind: authored }
      - pl: "Ponownie zadzwonił wieczorem."
        ru: "Он снова позвонил вечером."
        source: { kind: authored }
      - pl: "Ponownie otwarto sklep."
        ru: "Магазин снова открыли."
        source: { kind: authored }
  - id: register
    ru: "ponownie книжнее, чем znowu"
    note: "В разговоре берут znowu или jeszcze raz."
    examples:
      - pl: "Ponownie rozpatrzono sprawę."
        ru: "Дело рассмотрели повторно."
        source: { kind: authored }
      - pl: "Wniosek ponownie odrzucono."
        ru: "Заявление снова отклонили."
        source: { kind: authored }
      - pl: "Ponownie wybrano go na prezesa."
        ru: "Его снова избрали председателем."
        source: { kind: authored }
  - id: remarry
    ru: "wyjść ponownie za mąż — снова выйти замуж"
    examples:
      - pl: "Ponownie się ożenił."
        ru: "Он женился во второй раз."
        source: { kind: authored }
      - pl: "Ponownie zaczęli od zera."
        ru: "Они снова начали с нуля."
        source: { kind: authored }
      - pl: "Ponownie przeczytał list."
        ru: "Он перечитал письмо."
        source: { kind: authored }
notes:
  - { kind: usage, text: "ponownie заметно книжнее, чем znowu и jeszcze raz. В канцелярском и газетном языке берут ponownie: ponownie rozpatrzono sprawę. В разговоре — znowu." }
  - { kind: usage, text: "Слово от ponowny «повторный», а то от nowy «новый»: буквально «за-ново». Русское «вновь» устроено так же, от «новый»." }
  - { kind: usage, text: "Часто стоит перед глаголом: Ponownie zadzwonił, Ponownie otwarto sklep." }
  - { kind: usage, text: "Слово не изменяется." }
collocations:
