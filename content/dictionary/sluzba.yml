# review
id: sluzba
format: 2
lemma: "służba"
rank: 1284
pos: noun
pron: { cyr: "слу́жба" }
senses:
  - id: duty
    ru: "служба, дежурство: być na służbie «быть на дежурстве»"
    examples:
      - pl: "Tom jest na służbie."
        ru: "Том на службе."
        source: { kind: translated, id: 8772600 }
      - pl: "Kto jest dziś na służbie?"
        ru: "Кто сегодня на дежурстве?"
        source: { kind: translated, id: 6935781 }
      - pl: "Policjantom nie wolno pić na służbie."
        ru: "Полицейским нельзя пить на службе."
        source: { kind: translated, id: 1541605 }
  - id: military
    ru: "воинская служба"
    examples:
      - pl: "Służba wojskowa to także obowiązek patriotyczny."
        ru: "Воинская служба — это ещё и патриотический долг."
        source: { kind: translated, id: 11350904 }
      - pl: "Niestety mój brat zmarł podczas służby wojskowej."
        ru: "К сожалению, мой брат умер во время воинской службы."
        source: { kind: translated, id: 12720663 }
      - pl: "Podczas służby wojskowej podlegał surowej dyscyplinie."
        ru: "Во время воинской службы он подчинялся суровой дисциплине."
        source: { kind: translated, id: 511579 }
  - id: agency
    ru: "во множественном — службы, ведомства"
    examples:
      - pl: "Jeśli zarejestrujesz się na Facebooku, twoje dane otrzymają służby wywiadowcze."
        ru: "Если ты зарегистрируешься в соцсети, твои данные получат разведслужбы."
        source: { kind: translated, id: 510086 }
      - pl: "Chińskie służby medyczne podejmują działania w celu ograniczenia rozprzestrzeniania się koronawirusa."
        ru: "Китайские медицинские службы принимают меры, чтобы ограничить распространение коронавируса."
        source: { kind: translated, id: 8676717 }
      - pl: "O jakie wydarzenia bieżące pytają na egzaminie do służby cywilnej?"
        ru: "О каких текущих событиях спрашивают на экзамене в государственную службу?"
        source: { kind: translated, id: 360355 }
notes:
  - { kind: government, text: "być na służbie «быть на службе, на дежурстве» — предлог na с предложным падежом. А pełnić służbę «нести службу» требует винительного." }
  - { kind: usage, text: "Во множественном числе służby значит «службы, ведомства»: służby medyczne «медицинские службы», służby wywiadowcze «разведслужбы»." }
  - { kind: false-friend, text: "Русская «служба» в церковном смысле по-польски будет nabożeństwo или msza, а не służba." }
  - { kind: usage, text: "Родственный глагол — służyć «служить», карточка уже есть. Отсюда же usługa «услуга» и sługa «слуга»." }
collocations:
  - { pl: "na służbie", ru: "на службе, на дежурстве" }
  - { pl: "służba wojskowa", ru: "воинская служба" }
  - { pl: "pełnić służbę", ru: "нести службу" }
  - { pl: "służby medyczne", ru: "медицинские службы" }
etymology: "Праславянское *služьba от *služiti «служить». Русское «служба» — то же слово, собранное ровно теми же частями."
memory: "służba — «служба» и «дежурство»: być na służbie «быть на дежурстве». Во множественном służby значит «ведомства»: służby medyczne. А церковная служба будет nabożeństwo, не służba."
idioms:
  - { pl: "na służbie", ru: "на службе" }
  - { pl: "służba wojskowa", ru: "воинская служба" }
  - { pl: "służba nie drużba", ru: "служба службой, а дружба дружбой" }
formExamplesSkip:
  - { form: "służbo", reason: "звательный падеж: для неодушевлённого существительного он практически не употребляется" }
