# review
id: absolutnie
format: 2
lemma: "absolutnie"
rank: 1558
pos: adv
pron: { cyr: "абсолю́тне" }
senses:
  - id: completely
    ru: "абсолютно, совершенно"
    examples:
      - pl: "To absolutnie prawda."
        ru: "Это абсолютно правда."
        source: { kind: translated, id: 558464 }
      - pl: "To absolutnie niemożliwe."
        ru: "Это абсолютно невозможно."
        source: { kind: translated, id: 2282544 }
      - pl: "Czy to jest absolutnie konieczne?"
        ru: "Это абсолютно необходимо?"
        source: { kind: tatoeba, id: 5999401 }
  - id: emphatic
    ru: "абсолютно! / абсолютно нет! (усиленный ответ)"
    examples:
      - pl: "Absolutnie!"
        ru: "Абсолютно!"
        source: { kind: tatoeba, id: 404066 }
      - pl: "Absolutnie nie!"
        ru: "Абсолютно нет!"
        source: { kind: translated, id: 6308806 }
      - pl: "Wyglądasz absolutnie olśniewająco."
        ru: "Ты выглядишь абсолютно ослепительно."
        source: { kind: translated, id: 3718057 }
notes:
  - { kind: usage, text: "Наречие от absolutny «абсолютный». Усиливает прилагательные и наречия: absolutnie niemożliwe «абсолютно невозможно»." }
  - { kind: usage, text: "Отдельное Absolutnie! значит «Абсолютно!, Именно так!», а Absolutnie nie! — «Абсолютно нет!». Это самостоятельные реплики." }
  - { kind: usage, text: "Степени сравнения absolutniej и najabsolutniej есть в парадигме, но в корпусе не встречаются: слово обозначает предел и потому не градуируется." }
  - { kind: usage, text: "Синонимы — zupełnie и całkowicie «совершенно, полностью»; absolutnie звучит категоричнее." }
collocations:
  - { pl: "absolutnie nie", ru: "абсолютно нет" }
  - { pl: "absolutnie niemożliwe", ru: "абсолютно невозможно" }
  - { pl: "absolutnie konieczne", ru: "абсолютно необходимо" }
etymology: "Из латинского absolutus «завершённый, безусловный» через европейские языки. Русское «абсолютно» — то же заимствование, поэтому слова совпадают и по форме, и по значению."
memory: "absolutnie = «абсолютно», прямое соответствие русскому. Как отдельная реплика: Absolutnie! «Именно так!» и Absolutnie nie! «Абсолютно нет!». Синонимы — zupełnie и całkowicie."
idioms:
