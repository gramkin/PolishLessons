# review
id: zaszczycic
format: 2
lemma: "zaszczycić"
rank: 3896
pos: verb
pron: { cyr: "зашчы́циць" }
senses:
  - id: honour
    ru: "удостоить, почтить"
    examples:
      - pl: "Prezydent zaszczycił nas swoją obecnością."
        ru: "Президент почтил нас своим присутствием."
        source: { kind: authored }
      - pl: "Czuję się zaszczycony waszym zaproszeniem."
        ru: "Для меня большая честь ваше приглашение."
        source: { kind: authored }
      - pl: "Mistrz zaszczycił ucznia rozmową."
        ru: "Мастер удостоил ученика беседой."
        source: { kind: authored }
  - id: deign
    ru: "соизволить (ирон.)"
    examples:
      - pl: "W końcu zaszczyciłeś nas wizytą!"
        ru: "Наконец ты соизволил нас навестить!"
        source: { kind: authored }
      - pl: "Kot nie zaszczycił mnie nawet spojrzeniem."
        ru: "Кот даже не удостоил меня взглядом."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ZASZCZYCIĆ похоже на «защитить», но значит другое: защитить — OBRONIĆ, OCHRONIĆ. ZASZCZYCIĆ — от ZASZCZYT, «честь»: «оказать честь, удостоить». Самая частая форма — ZASZCZYCONY: CZUJĘ SIĘ ZASZCZYCONY, «для меня это честь»." }
  - { kind: usage, text: "Пятьдесят три формы — подпись переходного глагола совершенного вида: страдательное ZASZCZYCONY и деепричастие ZASZCZYCIWSZY. Видовой партнёр — ZASZCZYCAĆ." }
  - { kind: government, text: "Кого — винительный, чем — творительный без предлога: ZASZCZYCIĆ KOGOŚ OBECNOŚCIĄ, ROZMOWĄ, SPOJRZENIEM. С отрицанием — родительный: NIE ZASZCZYCIŁ NAS ODPOWIEDZIĄ. ZASZCZYCONY + творительный: ZASZCZYCONY ZAUFANIEM, «польщённый доверием»." }
  - { kind: pronunciation, text: "Читается «зашчы́циць», три слога, ударение на предпоследнем. SZCZ — твёрдые «шч» подряд, Y после CZ — «ы». CI — мягкое «ци», конечное Ć — «ць»." }
  - { kind: register, text: "Слово торжественное и вежливое в официальной речи: ZASZCZYCIĆ OBECNOŚCIĄ. В быту — почти всегда ирония: ZASZCZYCIŁ NAS WRESZCIE, «соизволил наконец явиться». CZUJĘ SIĘ ZASZCZYCONY — обычная вежливая формула благодарности." }
collocations:
  - { pl: "zaszczycić obecnością", ru: "почтить присутствием" }
  - { pl: "czuć się zaszczyconym", ru: "чувствовать себя польщённым" }
  - { pl: "nie zaszczycić spojrzeniem", ru: "не удостоить взглядом" }
family:
  - { pl: "zaszczyt", ru: "честь", relation: root, id: zaszczyt }
  - { pl: "zaszczycac", ru: "удостаивать", relation: aspect }
  - { pl: "zaszczytny", ru: "почётный", relation: derived }
etymology: "От ZASZCZYT «честь», старопольское ZASZCZYT — «защита, покровительство», от старого SZCZYT «щит», того же корня, что русское «щит». Значение сдвинулось от «взять под защиту» к «оказать честь»."
memory: "Zaszczycić — удостоить, почтить: zaszczycić obecnością. Czuję się zaszczycony — для меня это честь. Не «защитить»! Защитить — obronić. Читается «зашчы́циць»."
idioms:
