notes:
  - { kind: false-friend, text: "Самое важное: ОДИН польский глагол покрывает ТРИ русских. Wynająć coś OD kogoś — «снять у кого-то». Wynająć coś KOMUŚ — «сдать кому-то». Wynająć kogoś — «нанять». Русский различает эти смыслы разными словами, польский — только предлогом и падежом, поэтому wynajął mieszkanie без контекста двусмысленно: и снял, и сдал." }
  - { kind: government, text: "Схемы по порядку: od + РОДИТЕЛЬНЫЙ для того, у кого снимают (wynająć od właściciela); ДАТЕЛЬНЫЙ без предлога для того, кому сдают (wynająć studentom); ВИНИТЕЛЬНЫЙ для нанимаемого человека (wynająć fachowca). Вывеска do wynajęcia значит «сдаётся»." }
  - { kind: usage, text: "В основе лежит корень -jąć, и настоящее время прячет вставку -jm-: wynająć, но wynajmę, wynajmiesz, wynajmie. Чередование ą/ę позиционное: ą стоит в инфинитиве (wynająć), в деепричастии (wynająwszy) и в мужском единственном прошедшего с его условными формами (wynajął, wynająłem, wynająłby); во всех остальных клетках ę — wynajęła, wynajęli, wynajęty, wynajęcie." }
collocations:
  - { pl: "do wynajęcia", ru: "сдаётся" }
  - { pl: "wynająć mieszkanie", ru: "снять квартиру" }
  - { pl: "wynająć fachowca", ru: "нанять специалиста" }
family:
  - { pl: "wynajmować", ru: "снимать; сдавать", relation: aspect }
  - { pl: "najem", ru: "наём, аренда", relation: derived }
  - { pl: "zająć", ru: "занять", relation: root, id: zajac }
etymology: "Приставка wy- плюс -jąć, от праславянского *jęti «взять». Это тот же корень, что в русском «-ять» слов «занять», «изъять», «принять», и в существительном «наём», которому польское najem отвечает буква в букву. Отсюда же польские zająć «занять», wyjąć «вынуть», pojąć «постичь»."
memory: "wynająć — один глагол на три русских: снять (od kogoś), сдать (komuś) и нанять (kogoś). Корень -jąć это русское «-ять» из «занять», а в настоящем появляется -jm-: wynajmę. Вывеска do wynajęcia значит «сдаётся»."
idioms:
