notes:
  - { kind: pronunciation, text: "Дательный и предложный — ROSIE, где s пишется как si и звучит мягко. Та же мена, что в zima — zimie: перед окончанием -e согласный основы смягчается, и на письме это видно по букве i. Родительный множественного — ROS, без окончания вовсе, по образцу strzał, atmosfer и kultur." }
  - { kind: usage, text: "Слово совпадает с русским «росой» и по форме, и по смыслу, включая обороты: rosa poranna «утренняя роса», mokry od rosy «мокрый от росы», o rosie «по росе». Второе значение тоже общее — испарина на холодном стекле или бутылке. Запоминать здесь нечего, кроме мягкого предложного." }
collocations:
  - { pl: "rosa poranna", ru: "утренняя роса" }
  - { pl: "mokry od rosy", ru: "мокрый от росы" }
  - { pl: "rosa na trawie", ru: "роса на траве" }
family:
  - { pl: "rosić", ru: "моросить, орошать", relation: root }
  - { pl: "rosisty", ru: "росистый", relation: derived }
  - { pl: "orosić", ru: "оросить", relation: derived }
etymology: "Из праславянского *rosa — то же слово, что русская «роса», без всяких расхождений. От него же rosić «моросить, орошать» и rosisty «росистый», как у нас «орошать» и «росистый». Корень очень старый и за пределами славянских языков тоже узнаётся: латинское ros того же происхождения."
memory: "Предложный мягкий: w ROSIE, как w zimie. А родительный множественного совсем без окончания: kropel ros."
idioms:
