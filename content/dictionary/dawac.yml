# review
id: dawac
format: 2
lemma: "dawać"
rank: 269
pos: verb
aspect: imperf
pron: { cyr: "да́ваць" }
senses:
  - id: give
    ru: "давать"
    examples:
      - pl: "Krowa daje mleko."
        ru: "Корова даёт молоко."
        source: { kind: tatoeba, id: 739244 }
      - pl: "Daję ci ostatnią szansę."
        ru: "Я даю тебе последний шанс."
        source: { kind: tatoeba, id: 3602128 }
      - pl: "Lepiej jest dawać, niż brać."
        ru: "Лучше давать, чем брать."
        source: { kind: tatoeba, id: 12564333 }
  - id: yield
    ru: "давать (результат); в устойчивых оборотах"
    note: "Pięć plus trzy daje osiem — «даёт» в значении «равно»."
    examples:
      - pl: "Pięć plus trzy daje osiem."
        ru: "Пять плюс три получится восемь."
        source: { kind: tatoeba, id: 3659276 }
      - pl: "Krowy dają mleko."
        ru: "Коровы дают молоко."
        source: { kind: tatoeba, id: 12470075 }
      - pl: "Nie dawaj ręki lwu."
        ru: "Не давай руку льву."
        source: { kind: tatoeba, id: 1716764 }
notes:
  - { kind: usage, text: "Совершенный вид — dać, и основа у него короче: Daj mi to «Дай мне это», но Dawaj mi to codziennie." }
  - { kind: usage, text: "dawać sobie radę значит «справляться», а nie dawać rady — «не справляться»: Nie dajemy rady «Мы не справляемся». Оборот очень частый." }
  - { kind: usage, text: "dawać z siebie wszystko — «выкладываться»; dawać słowo — «давать слово»; dawać przykład — «подавать пример»." }
  - { kind: usage, text: "Разговорное Dawaj! значит «Давай!, Ну же!» — ровно как в русском." }
collocations:
  - { pl: "dawać sobie radę", ru: "справляться" }
  - { pl: "dawać słowo", ru: "давать слово" }
  - { pl: "dawać przykład", ru: "подавать пример" }
  - { pl: "nie dawać rady", ru: "не справляться" }
etymology: "Праславянское *davati — то же слово, что русское «давать»; совершенный вид dać отвечает русскому «дать»."
memory: "dawać — «давать», сов. dać. Главное запомнить dawać sobie radę «справляться» и nie dawać rady «не справляться»: Nie dajemy rady."
idioms:
  - { pl: "dawać sobie radę", ru: "справляться" }
  - { pl: "dawać z siebie wszystko", ru: "выкладываться" }
  - { pl: "nie dawać rady", ru: "не справляться" }
