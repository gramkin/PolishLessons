# review
id: zalozyc
format: 2
lemma: "założyć"
rank: 493
pos: verb
aspect: perf
pron: { cyr: "зауо́жыць" }
senses:
  - id: put-on
    ru: "надеть"
    examples:
      - pl: "Muszę założyć buty."
        ru: "Мне надо надеть ботинки."
        source: { kind: translated, id: 3439186 }
      - pl: "Założyła czapkę."
        ru: "Она надела шапку."
        source: { kind: translated, id: 368444 }
      - pl: "Załóż buty."
        ru: "Надень ботинки."
        source: { kind: translated, id: 8506864 }
  - id: found
    ru: "основать, учредить"
    examples:
      - pl: "Kiedy uniwersytet został założony?"
        ru: "Когда был основан университет?"
        source: { kind: tatoeba, id: 529689 }
      - pl: "Ta szkoła została założona w roku 1650."
        ru: "Эта школа была основана в 1650 году."
        source: { kind: tatoeba, id: 349421 }
      - pl: "Założył firmę."
        ru: "Он основал фирму."
        source: { kind: translated, id: 2246959 }
notes:
  - { kind: usage, text: "Совершенный вид к zakładać. Все значения растут из одного образа — «заложить»: наложить на себя (одежду), заложить основу (фирму), заложить мысль в основу рассуждения (предположить), заложить заклад (поспорить)." }
  - { kind: usage, text: "Предположение: Załóżmy, że to prawda «Предположим, что это правда»; существительное założenie — «предположение, допущение»." }
  - { kind: usage, text: "Спор: Założę się, że... «Спорим, что...», Chcesz się założyć? «Хочешь поспорить?» Это ровно русское «биться об заклад»." }
  - { kind: false-friend, text: "Одежду по-польски не «надевают на себя», а właśnie założyć: założyć buty, czapkę, okulary. Русское «заложить» такого значения не имеет." }
collocations:
  - { pl: "założyć firmę", ru: "основать фирму" }
  - { pl: "założyć buty", ru: "надеть ботинки" }
  - { pl: "załóżmy, że", ru: "предположим, что" }
  - { pl: "założyć się", ru: "поспорить" }
  - { pl: "z założonymi rękami", ru: "сложа руки" }
etymology: "Из za- + łożyć (kłaść «класть») — буквально «заложить»; русское «заложить» того же корня. Отсюда все значения: наложить на себя (одежду), заложить основу (фирму), заложить мысль в основание рассуждения (предположить), заложить заклад (поспорить)."
memory: "założyć — это русское «заложить», и все четыре значения расходятся из этого образа. Заложить на себя — założyć buty «надеть ботинки». Заложить основу — założyć firmę «основать фирму». Заложить в основу мысли — Załóżmy, że... «Предположим, что...». Заложить заклад — Założę się! «Спорим!», ровно как русское «биться об заклад»."
idioms:
  - { pl: "założyć się", ru: "поспорить" }
  - { pl: "siedzieć z założonymi rękami", ru: "сидеть сложа руки" }
  - { pl: "załóżmy, że...", ru: "предположим, что..." }
formExamplesSkip:
  - { form: "założeni", reason: "лично-мужское страдательное причастие: założyć «надеть, основать» к людям не применяется, поэтому в живом языке такой формы нет" }
