        source: { kind: translated, id: 921636 }
notes:
  - { kind: false-friend, text: "Русский «гусь» и польское gęś — одно слово: носовое ę отвечает русскому у. Но род женский: ta gęś, а русский «гусь» мужского рода." }
  - { kind: government, text: "Женский род на мягкую согласную: ta gęś, tej gęsi. Множественное — gęsi." }
  - { kind: usage, text: "Gęsia skórka — «гусиная кожа, мурашки», буквально то же, что в русском." }
  - { kind: usage, text: "Знаменитая фраза Reja: Polacy nie gęsi i swój język mają — «поляки не гуси и свой язык имеют»." }
collocations:
  - { pl: "gęsia skórka", ru: "мурашки по коже" }
etymology: "Праславянское *gǫsь; русский «гусь» — то же слово, носовое ę отвечает русскому у."
memory: "gęś — «гусь», но род ЖЕНСКИЙ: ta gęś, tej gęsi. Оборот gęsia skórka — «мурашки по коже»."
