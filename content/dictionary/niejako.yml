id: niejako
format: 2
lemma: "niejako"
rank: 5812
pos: part
pron: { cyr: "нея́ко" }
senses:
  - id: in-a-sense
    ru: "как бы, в некотором роде, своего рода"
    examples:
      - pl: "Pies stał się niejako członkiem rodziny."
        ru: "Собака стала как бы членом семьи."
        source: { kind: authored }
      - pl: "To był niejako nasz drugi dom."
        ru: "Это был в некотором роде наш второй дом."
        source: { kind: authored }
      - pl: "Ta książka jest niejako kontynuacją poprzedniej."
        ru: "Эта книга — своего рода продолжение предыдущей."
        source: { kind: authored }
      - pl: "Jego milczenie było niejako odpowiedzią."
        ru: "Его молчание было своего рода ответом."
        source: { kind: authored }
  - id: incidentally
    ru: "как бы само собой, между делом"
    examples:
      - pl: "Niejako przy okazji poznałem jej rodziców."
        ru: "Как бы между делом я познакомился с её родителями."
        source: { kind: authored }
      - pl: "Nauczyłem się polskiego niejako mimochodem."
        ru: "Польский я выучил как бы мимоходом."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Не «никак»! NIE- здесь не отрицание, а «некий»: NIEJAKO — «некоторым образом, как бы». «Никак» по-польски — W ŻADEN SPOSÓB или NIJAK." }
  - { kind: register, text: "Книжная частица: смягчает слово, которое стоит за ней, показывая, что оно сказано не совсем буквально. В разговоре чаще говорят JAKBY или W PEWNYM SENSIE." }
  - { kind: usage, text: "Ставится прямо перед словом, которое смягчает: BYŁ NIEJAKO GOSPODARZEM «был как бы хозяином». На падеж не влияет." }
