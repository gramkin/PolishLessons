  - id: oppression
    ru: "иго, гнёт, тяжкая зависимость"
    examples:
      - pl: "Naród wreszcie zrzucił obce jarzmo."
        ru: "Народ наконец сбросил чужеземное иго."
        source: { kind: authored }
      - pl: "Wyzwolili się spod jarzma okupanta."
        ru: "Они освободились из-под ига оккупантов."
        source: { kind: authored }
