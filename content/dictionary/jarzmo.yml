        ru: "Кредит стал для них настоящим ярмом."
        source: { kind: authored }
notes:
  - { kind: pronunciation, text: "Читается «я́жмо»: это русское «ярмо», в котором R перед M дало польское RZ — «ж». Ударение на первом слоге, в отличие от русского «ярмо́»." }
  - { kind: usage, text: "Средний род на -O. В родительном множественного две формы: JARZM и JARZEM — со вставным E, как OKIEN от OKNO. Обе правильны, JARZM встречается чаще. Звательный совпадает с именительным." }
  - { kind: government, text: "В переносном смысле — обычно с предлогами: POD JARZMEM «под игом» (творительный), SPOD JARZMA «из-под ига» (родительный). Сбросить иго — ZRZUCIĆ JARZMO, с винительным." }
  - { kind: register, text: "Буквальное значение относится к деревенскому быту прошлого, переносное — книжное, из истории и публицистики. Русскому «игу» в выражениях вроде «под игом» соответствует именно JARZMO." }
collocations:
  - { pl: "zrzucić jarzmo", ru: "сбросить ярмо, иго" }
  - { pl: "pod obcym jarzmem", ru: "под чужеземным игом" }
  - { pl: "wyzwolić się spod jarzma", ru: "освободиться из-под ига" }
family:
  - { pl: "jarzemko", ru: "маленькое ярмо; кокетка (деталь одежды)", relation: derived }
  - { pl: "wolność", ru: "свобода", relation: antonym, id: wolnosc }
synonyms:
  - "niewola"
  - "brzemię"
  - "ciężar"
etymology: "Праславянское *arьmo — то же слово, что русское «ярмо», словацкое JARMO и хорватское JARAM. Его возводят к индоевропейскому корню со значением «соединять, скреплять»."
memory: "Jarzmo — это «ярмо»: R перед M превратилось в польское RZ. Zrzucić jarzmo — сбросить иго."
idioms:
