# review
id: dogonic
format: 2
lemma: "dogonić"
rank: 5129
pos: verb
pron: { cyr: "дого́ниць" }
senses:
  - id: catch-up
    ru: "догнать"
    examples:
      - pl: "Policja dogoniła złodzieja."
        ru: "Полиция догнала вора."
        source: { kind: authored }
      - pl: "Biegnij, dogonisz autobus!"
        ru: "Беги, догонишь автобус!"
        source: { kind: authored }
      - pl: "Dogonił grupę po kilometrze."
        ru: "Он догнал группу через километр."
        source: { kind: authored }
  - id: match
    ru: "догнать, сравняться (в уровне)"
    examples:
      - pl: "Polska dogoniła Zachód pod wieloma względami."
        ru: "Польша догнала Запад во многих отношениях."
        source: { kind: authored }
      - pl: "Muszę dogonić materiał z nieobecności."
        ru: "Мне нужно нагнать пропущенный материал."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "DOGONIĆ — точное «догнать»: DOGONIĆ KOGOŚ, DOGONIĆ AUTOBUS. Переносное тоже совпадает: DOGONIĆ RÓWIEŚNIKÓW, «догнать сверстников». Но «нагнать упущенное» чаще NADROBIĆ: NADROBIĆ ZALEGŁOŚCI. GONIĆ — «гнать, гоняться», GONITWA — «погоня, гонка»." }
  - { kind: usage, text: "Пятьдесят три формы — подпись переходного глагола совершенного вида: страдательное DOGONIONY и деепричастие DOGONIWSZY. Повелительное DOGOŃ — с мягким Ń. Видовой партнёр — DOGANIAĆ: DOGANIA NAS CZAS." }
  - { kind: government, text: "Кого или что — винительный: DOGONIĆ PIESZEGO, POCIĄG. В чём — W с местным: DOGONIĆ KOGOŚ W NAUCE. С отрицанием — родительный: NIE DOGONIŁ UCIEKINIERA." }
  - { kind: pronunciation, text: "Читается «дого́ниць», три слога, ударение на предпоследнем. NI — мягкое «ни», конечное Ć — «ць». DOGOŃ — «до́гонь»." }
  - { kind: register, text: "Нейтральное бытовое и спортивное слово. Переносное «догнать по уровню» — в экономике и учёбе. Близкое по смыслу DOTRZYMAĆ KROKU — «не отставать, держаться наравне»." }
collocations:
  - { pl: "dogonić autobus", ru: "догнать автобус" }
  - { pl: "dogonić rywala", ru: "догнать соперника" }
  - { pl: "dogonić Zachód", ru: "догнать Запад" }
family:
  - { pl: "doganiać", ru: "догонять", relation: aspect }
  - { pl: "gonić", ru: "гнать, гоняться", relation: root, id: gonic }
  - { pl: "pogoń", ru: "погоня", relation: derived }
etymology: "Приставка DO- «до-» плюс GONIĆ «гнать», праславянское *goniti, то же, что русское «гнать», «гонять», «догнать»."
memory: "Dogonić — догнать: dogonić autobus, złodzieja, rówieśników. Dogoń — с Ń. Несовершенный — doganiać. Gonić — гнать. Читается «дого́ниць»."
idioms:
  - { pl: "dogonić czas", ru: "наверстать время" }
