etymology: "От DZIWNY, а то — от праславянского *divъ «диво, нечто поразительное», того же корня, что русские «диво», «дивный», «удивление», «удивить». Исходное значение было нейтральным — то, на что смотрят с изумлением, — и дальше языки разошлись в оценке: русский закрепил восхищение, польский недоумение, так что DZIWNY стало значить «странный». Суффикс -AK образует названия лиц по свойству и очень продуктивен: PROSTAK «простак», BIEDAK «бедняк». Русскому он отвечает в «чудаке» и «простаке», где тоже обозначает человека по черте характера. В именительном множественного мужских личных слов на -AK регулярно появляется C вместо K, и DZIWACY стоит в одном ряду с POLACY и RODACY."
memory: "Корень общий с «дивом», оценка обратная: dziwny — «странный», а не «дивный». Отсюда dziwak «чудак», dziwić się «удивляться», dziwnie «странно». Для «дивного» нужны cudowny или wspaniały. Именительный множественного dziwacy с k→c — как Polak/Polacy и rodak/rodacy; форма dziwaki была бы о предметах, так что выбор прямо показывает, что речь о людях."
