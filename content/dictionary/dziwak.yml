notes:
  - { kind: false-friend, text: "Корень тот же, что в русских «диво», «дивный», «удивить», но значение сдвинулось, и сдвиг системный. Польское DZIWNY значит «странный», а не «дивный»: DZIWNA SPRAWA это «странное дело», и ничего восхитительного в ней нет. Отсюда DZIWAK — «чудак, странный человек», DZIWIĆ SIĘ — «удивляться», DZIWNIE — «странно». Русский у того же корня развил восхищение, польский — недоумение. Для русского «дивного» по-польски нужны CUDOWNY или WSPANIAŁY. Поэтому, встретив в польском тексте DZIW-, подставляйте «странно», а не «дивно», и смысл сойдётся." }
  - { kind: usage, text: "Это мужское личное существительное, и в именительном множественного у него происходит чередование: K переходит в C, отсюда DZIWACY, а не «dziwaki». Так ведут себя все мужские личные слова на -K: POLAK даёт POLACY, RODAK даёт RODACY, ROBOTNIK даёт ROBOTNICY. Это та же первая палатализация, что в MATKA и MATCE, но здесь она работает не в дательном падеже женского слова, а в именительном множественного мужского личного. Если бы DZIWAK обозначал предмет, множественное было бы DZIWAKI; выбор формы прямо указывает, что речь о человеке. Винительный равен родительному: WIDZIAŁ DZIWAKA." }
  - { kind: government, text: "Мужской род, одушевлённое, лицо. Винительный равен родительному в единственном и множественном: ZNAM TEGO DZIWAKA, ZNAM TYCH DZIWAKÓW. Кем считают — творительный при NAZYWAĆ и UWAŻAĆ ZA: NAZYWANO GO DZIWAKIEM, UWAŻALI GO ZA DZIWAKA — обратите внимание, что при UWAŻAĆ ZA нужен винительный, а при NAZYWAĆ творительный. Местный единственного — DZIWAKU, с окончанием -U, потому что основа кончается на K. Женского соответствия у слова нет: о женщине скажут DZIWACZKA." }
  - { kind: pronunciation, text: "Читается «дзи́вак», два слога, ударение на первом. Сочетание DZI даёт мягкое «дзь», и первый слог звучит «дзи», слитно, одним движением. Буква W между гласными читается «в». Конечное K глухое. В именительном множественного DZIWACY сочетание CY даёт «цы» с твёрдым ц: «дзива́цы», и ударение переходит на предпоследний слог. В родительном множественного DZIWAKÓW буква Ó читается «у», конечное W оглушается: «дзива́куф»." }
