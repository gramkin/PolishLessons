notes:
  - { kind: false-friend, text: "GALERIA — и «галерея», и, в быту очень часто, «торговый центр»: GALERIA HANDLOWA. Фраза IDĘ DO GALERII обычно значит «иду в торговый центр», а не в музей. Художественная галерея — GALERIA SZTUKI." }
  - { kind: usage, text: "Восемь живых форм, женский род на -IA. Родительный, дательный и местный — GALERII. Архаичный родительный множественного GALERYJ и звательный не даются." }
  - { kind: government, text: "В галерее — W GALERII, местный. В торговый центр — DO GALERII, родительный. Галерея чего — родительный: GALERIA SZTUKI." }
  - { kind: pronunciation, text: "Читается «гале́рья», ударение на предпоследнем слоге: RIA — один слог «рья»." }
collocations:
  - { pl: "galeria sztuki", ru: "художественная галерея" }
  - { pl: "galeria handlowa", ru: "торговый центр" }
  - { pl: "iść do galerii", ru: "идти в торговый центр" }
family:
  - { pl: "galerzysta", ru: "галерист", relation: derived }
  - { pl: "galeria sztuki", ru: "художественная галерея", relation: derived }
  - { pl: "galeria handlowa", ru: "торговый центр", relation: derived }
etymology: "Из итальянского слова, обозначавшего крытый проход, а затем выставочный зал. Значение «торговый центр» — от крытых торговых пассажей."
memory: "Galeria — галерея и торговый центр (galeria handlowa). Читается «гале́рья». Idę do galerii — иду в торговый центр."
idioms:
