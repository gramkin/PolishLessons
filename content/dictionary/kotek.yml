# review
id: kotek
format: 2
lemma: "kotek"
rank: 1699
pos: noun
pron: { cyr: "ко́тэк" }
senses:
  - id: kitten
    ru: "котёнок, котик"
    examples:
      - pl: "Kotek chce spać."
        ru: "Котёнок хочет спать."
        source: { kind: translated, id: 6935857 }
      - pl: "Kotek spał głęboko."
        ru: "Котёнок крепко спал."
        source: { kind: translated, id: 3561271 }
      - pl: "Kotek nikomu nie jest potrzebny?"
        ru: "Котёнок никому не нужен?"
        source: { kind: tatoeba, id: 12478475 }
  - id: endearment
    ru: "котик (ласковое обращение)"
    examples:
      - pl: "Kotek próbuje się ukryć przed deszczem."
        ru: "Котёнок пытается спрятаться от дождя."
        source: { kind: translated, id: 3695882 }
      - pl: "On chętnie zaopiekował się kotkiem."
        ru: "Он охотно позаботился о котёнке."
        source: { kind: translated, id: 758308 }
notes:
  - { kind: false-friend, text: "Рядом живёт отдельное слово kotka «кошка» (самка), и его формы совпадают с косвенными формами kotek: Kotka śpi na stole — это «кошка спит», а kupił jej kotka — «купил ей котёнка». Различает только контекст." }
  - { kind: usage, text: "kotek — уменьшительное от kot «кот»: и «котёнок», и ласковое обращение к человеку, как русское «котик»." }
  - { kind: usage, text: "Слово мужского рода и одушевлённое, поэтому винительный совпадает с родительным: widzę kotka «вижу котёнка»." }
  - { kind: usage, text: "Звательная форма kotku используется в обращении: Cześć, kotku! «Привет, котик!»." }
collocations:
  - { pl: "mały kotek", ru: "маленький котёнок" }
  - { pl: "mój kotku", ru: "котик мой" }
  - { pl: "bawić się z kotkiem", ru: "играть с котёнком" }
etymology: "Уменьшительное от kot «кот» с суффиксом -ek, ровно как русское «котик» от «кот». Праславянский корень *kotъ общий, так что слова родственны напрямую."
memory: "kotek = «котёнок, котик», уменьшительное от kot. Осторожно: kotka — это отдельное слово «кошка» (самка), и её формы похожи на косвенные формы kotek. Обращение — kotku!"
idioms:
  - { pl: "mały kotek", ru: "маленький котёнок" }
  - { pl: "mój kotku", ru: "котик мой" }
  - { pl: "bawić się z kotkiem", ru: "играть с котёнком" }
