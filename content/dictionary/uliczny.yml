notes:
  - { kind: false-friend, text: "Слово отвечает русскому «уличный», и ULICA это наша «улица», слово праславянское. Запомните вместо этого две вещи из гнезда. ULICZKA это «улочка», уменьшительное, и поляки употребляют его постоянно, куда чаще, чем мы. А ULICZNIK значит «беспризорник, уличный мальчишка», и это существительное, а не прилагательное: человека нельзя назвать ULICZNY." }
  - { kind: usage, text: "Все одиннадцать форм живые. Форма для мужчин-людей здесь есть и употребляется, потому что MUZYK ULICZNY и SPRZEDAWCA ULICZNY — это люди, а значит бывают ULICZNI MUZYCY и ULICZNI SPRZEDAWCY. Пропускать её, как у LODOWY или PODZIEMNY, здесь нельзя. Заметьте, что в этих сочетаниях прилагательное может стоять и перед существительным." }
  - { kind: government, text: "Вот важнейшее различение, на котором спотыкаются все. Для адреса поляк говорит PRZY ULICY: MIESZKAM PRZY ULICY DŁUGIEJ значит «живу на улице Длугой». А NA ULICY значит «на улице» в смысле «под открытым небом»: SPOTKALIŚMY SIĘ NA ULICY. Сказать MIESZKAM NA ULICY можно, но это будет значить «живу на улице», то есть бездомный. Различайте PRZY и NA." }
  - { kind: pronunciation, text: "Читается «ули́чны», три слога, ударение на предпоследнем. Сочетание LI даёт «ли», и это единственный случай в польском чтении, где словарь не знает исключений: L перед I всегда «ли». Сочетание CZ даёт «ч», а конечная Y — «ы». В женском роде ULICZNA это «ули́чна», в среднем ULICZNE — «ули́чнэ»." }
  - { kind: register, text: "Слово нейтральное и городское. Частые сочетания — LATARNIA ULICZNA «уличный фонарь», OŚWIETLENIE ULICZNE, HANDEL ULICZNY, MUZYK ULICZNY. В новостях встречается WALKI ULICZNE «уличные бои». А TEATR ULICZNY в Польше явление живое и уважаемое, со своими фестивалями, так что выражение это слышно куда чаще, чем можно ожидать." }
