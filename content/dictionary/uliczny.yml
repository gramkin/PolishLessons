etymology: "От ULICA, слова праславянского и того же, что русская «улица». А корень в нём неожиданный: он значил «дыра, дупло, проход», и от того же корня идёт UL — «улей», по-русски тоже «улей». То есть улица и улей родня: и то и другое было когда-то полостью, проходом внутрь. Уменьшительное ULICZKA «улочка» в польском гораздо живее нашего и встречается в каждом описании старого города."
memory: "Уличный, и ulica это наша «улица». Читается «ули́чны», где li даёт «ли» — единственное сочетание с l, в котором словарь не знает исключений. Главное запомнить предлоги: адрес это przy ulicy, «живу на улице Длугой» — mieszkam przy ulicy Dlugiej, а na ulicy значит «под открытым небом». В родне: uliczka «улочка» и ulicznik «беспризорник». И улица родня улью, ul: оба были проходом."
idioms:
  - { pl: "walki uliczne", ru: "уличные бои" }
