# review
id: niektory
format: 2
lemma: "niektóry"
rank: 556
pos: adj
pron: { cyr: "некту́ры" }
senses:
  - id: some
    ru: "некоторые (о предметах)"
    note: "Живёт во множественном числе: niektóre węże «некоторые змеи»."
    examples:
      - pl: "Niektóre węże są jadowite."
        ru: "Некоторые змеи ядовиты."
        source: { kind: tatoeba, id: 360468 }
      - pl: "Niektóre zwierzęta zmieniają płeć."
        ru: "Некоторые животные меняют пол."
        source: { kind: tatoeba, id: 3697586 }
      - pl: "Niektóre okna były otwarte."
        ru: "Некоторые окна были открыты."
        source: { kind: tatoeba, id: 13784858 }
  - id: some-people
    ru: "niektórzy — некоторые (о людях)"
    note: "Мужская личная форма: Niektórzy uważają, że…"
    examples:
      - pl: "Niektórzy ludzie mają alergię na pszenicę."
        ru: "У некоторых людей аллергия на пшеницу."
        source: { kind: tatoeba, id: 4917259 }
      - pl: "Niektórzy to lubią."
        ru: "Некоторым это нравится."
        source: { kind: translated, id: 3747900 }
      - pl: "Niektórych studentów nie interesuje historia Japonii."
        ru: "Некоторых студентов не интересует история Японии."
        source: { kind: translated, id: 364559 }
notes:
  - { kind: usage, text: "В современном языке слово употребляется практически только во множественном числе: niektóre о вещах, niektórzy о людях. Форм единственного числа корпус не знает — отсюда пропуски в таблице." }
  - { kind: government, text: "niektórzy z nas «некоторые из нас» — с предлогом z и родительным падежом." }
  - { kind: usage, text: "Мужская личная форма niektórzy относится к людям: Niektórzy uważają, że… «Некоторые считают, что…»" }
  - { kind: usage, text: "Рядом стоят kilka «несколько», parę «пара», część «часть» — они считают, а niektóre выделяет из известного множества." }
collocations:
  - { pl: "niektórzy ludzie", ru: "некоторые люди" }
  - { pl: "niektóre z nich", ru: "некоторые из них" }
  - { pl: "niektórzy z nas", ru: "некоторые из нас" }
  - { pl: "w niektórych przypadkach", ru: "в некоторых случаях" }
family:
  - { pl: "który", ru: "который", relation: root }
  - { pl: "ktoś", ru: "кто-то", relation: derived }
etymology: "Из nie + który «который» — буквально «не который», то есть «какой-то из». Русское «некоторый» собрано точно так же: не + который."
memory: "niektóry в современном языке живёт почти только во множественном числе: niektóre «некоторые» о вещах и niektórzy «некоторые» о людях. Единственного числа корпус не знает вовсе — потому в таблице форм пропуски. Слово устроено ровно как русское: nie + który, «не + который». И запомните оборот niektórzy z nas «некоторые из нас», с z и родительным."
