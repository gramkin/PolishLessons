# review
id: ofiara
format: 2
lemma: "ofiara"
rank: 424
pos: noun
pron: { cyr: "офя́ра" }
senses:
  - id: victim
    ru: "жертва (пострадавший)"
    examples:
      - pl: "Według źródeł, nie było ofiar."
        ru: "По данным источников, жертв не было."
        source: { kind: translated, id: 10699679 }
      - pl: "Musimy okazać solidarność z ofiarami trzęsienia ziemi."
        ru: "Мы должны проявить солидарность с жертвами землетрясения."
        source: { kind: translated, id: 11577890 }
      - pl: "Dostarczali żywności ofiarom wojny."
        ru: "Они доставляли продовольствие жертвам войны."
        source: { kind: translated, id: 356883 }
  - id: offering
    ru: "жертва, пожертвование"
    examples:
      - pl: "Bóg zapłać za ofiarę."
        ru: "Спаси Бог за пожертвование."
        source: { kind: translated, id: 13031266 }
      - pl: "Idźcie, Ofiara spełniona."
        ru: "Идите, жертва совершена."
        source: { kind: translated, id: 2349224 }
      - pl: "Złożyli ofiarę na kościół."
        ru: "Они сделали пожертвование на церковь."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Слово не славянское: оно пришло через чешское ofěra из немецкого Opfer, а то — из латинского offero «приношу». Русскому «жертва» оно не родственно, хотя значит то же." }
  - { kind: usage, text: "paść ofiarą czegoś — «пасть жертвой чего-либо»: padł ofiarą oszustwa «он стал жертвой обмана»." }
  - { kind: usage, text: "Разговорное ofiara losu значит «неудачник, растяпа», а Nie zgrywaj ofiary — «Не строй из себя жертву»." }
  - { kind: usage, text: "В церковном смысле ofiara — это «пожертвование»: złożyć ofiarę «сделать пожертвование»." }
collocations:
  - { pl: "paść ofiarą", ru: "пасть жертвой" }
  - { pl: "ofiara wypadku", ru: "жертва аварии" }
  - { pl: "złożyć ofiarę", ru: "сделать пожертвование" }
  - { pl: "ofiara losu", ru: "неудачник, растяпа" }
etymology: "Через чешское ofěra из немецкого Opfer, а то — из латинского offero «приношу». Слово заимствованное: русскому «жертва» оно не родня, хотя значит ровно то же."
memory: "ofiara — «жертва», но слово пришло издалека: из латинского offero «приношу» через немецкое Opfer. Отсюда два значения — пострадавший и церковное пожертвование. А разговорное ofiara losu значит «неудачник, растяпа»."
idioms:
  - { pl: "paść ofiarą", ru: "пасть жертвой" }
  - { pl: "ofiara losu", ru: "неудачник, растяпа" }
  - { pl: "co ołtarz, to ofiara", ru: "что алтарь, то и жертва" }
