notes:
  - { kind: false-friend, text: "Русское «высоко» покрывает и буквальную высоту, и степень: «высоко прыгнул» и «высоко ценю». Польский это делит. WYSOKO отвечает за высоту физическую: SKOCZYŁ WYSOKO. WYSOCE отвечает только за степень и только при отвлечённых словах: WYSOCE PRAWDOPODOBNE «весьма вероятно», WYSOCE NIEPOKOJĄCY, WYSOCE CENIONY. Сказать WYSOCE SKOCZYŁ нельзя. Поэтому при переводе русского «высоко» надо сначала решить, о высоте речь или о мере, и только потом выбирать слово. В этом значении WYSOCE книжно и встречается в официальных и газетных текстах чаще, чем в разговоре." }
  - { kind: government, text: "Наречие, и формально у него три формы, но только первая своя: WYSOCE, а сравнительная WYŻEJ и превосходная NAJWYŻEJ принадлежат сразу и WYSOCE, и WYSOKO — у двух наречий одна общая пара степеней. Поэтому WYŻEJ CENIONY и WYŻEJ POSTAWIONY могут относиться к мере, а WYŻEJ NA PÓŁCE — к высоте, и различает только контекст. Степени строятся не от WYSOCE, а от общей основы WYŻ-, и это супплетивизм: формы берутся от другого корня, как в русском «хорошо — лучше». Сравнение идёт предлогом OD с родительным или союзом NIŻ." }
  - { kind: pronunciation, text: "Читается «высо́це», ударение на предпоследнем слоге из трёх. Гласная Y звучит «ы». Сочетание CE даёт «це», и буква C перед E читается «ц», а не «к» — то же правило, что в CELA «цэля». В сравнительной WYŻEJ буква Ż даёт «ж»: «вы́жэй», два слога, ударение на первом. В превосходной NAJWYŻEJ три слога и ударение на предпоследнем: «найвы́жэй»." }
  - { kind: usage, text: "Частотные сочетания: WYSOCE PRAWDOPODOBNE, WYSOCE CENIONY, WYSOCE WYKWALIFIKOWANY «высококвалифицированный», WYSOCE NIEPOKOJĄCY. Слово сочетается почти исключительно с прилагательными и причастиями, а не с глаголами. Оборот NAJWYŻEJ имеет и второе, обиходное значение — «максимум, самое большее»: NAJWYŻEJ POCZEKAMY DZIEŃ «максимум подождём день», и в этом смысле он к степени уже не относится. Рядом стоит BARDZO «очень», нейтральное и годное везде, где WYSOCE звучит слишком казённо." }
