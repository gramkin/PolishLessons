etymology: "От прилагательного WYSOKI «высокий», из праславянского *vysokъ, того же корня, что русское «высокий» и «высь». Суффикс -E в WYSOCE — старое окончание наречий, и буква C появилась из K по регулярному чередованию перед этим -E: WYSOKI, но WYSOCE, как DROGI и DRODZE. Рядом существует второе наречие от того же прилагательного, WYSOKO, с более поздним суффиксом -O, и язык разделил между ними обязанности: старшая форма WYSOCE взяла отвлечённую степень, младшая WYSOKO — физическую высоту. Русский такого раздвоения не сделал и оставил одно «высоко» на оба смысла, зато сохранил книжное «вы́спренне» и «весьма» для степени. Общая пара степеней WYŻEJ и NAJWYŻEJ образована от сравнительной основы WYŻ-, и это тот же супплетивизм, что в русском «выше»."
memory: "Только о степени и только при отвлечённых словах: wysoce prawdopodobne «весьма вероятно», wysoce ceniony. Физическая высота — wysoko, и wysoce skoczył сказать нельзя; русское «высоко» покрывает оба смысла, польский их делит. Степени общие у обоих наречий: wyżej и najwyżej обслуживают и wysoce, и wysoko. C из K по чередованию перед старым -e: wysoki, но wysoce, как drogi — drodze. Najwyżej значит ещё и «максимум»."
