etymology: "Приставка wy- и NAGRODZIĆ, от NAGRODA, из праславянского *na-gorda — того же слова, что русская «награда», с корнем *gord-, который виден в «город» и «ограда»: награда изначально была наделом, огороженным участком земли, который давали за службу. Польский сохранил и исходное значение в OGRÓD «сад» и GRÓD «град, крепость», и производное в NAGRODA. Приставка wy- добавляет полноту: не просто наградить, а возместить сполна, откуда и юридическое WYNAGRODZIĆ SZKODĘ."
memory: "Корень тот же, что «награда», и через «ограда» виден исходный смысл — огороженный надел за службу. А wynagrodzenie в объявлениях о работе значит «зарплата»."
idioms:
