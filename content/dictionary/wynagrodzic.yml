notes:
  - { kind: government, text: "Кому — дательный, что — винительный: WYNAGRODZIĆ KOMUŚ COŚ. То есть фирма возмещает НАМ потерянное ВРЕМЯ: WYNAGRODZIŁA NAM STRACONY CZAS. Русский строит точно так же — «возместить кому-то что-то», — так что конструкция переносится целиком. Чем вознаградить — творительный без предлога: WYNAGRODZIĆ KOGOŚ AWANSEM, PREMIĄ. Обратите внимание, что в этом втором значении дополнение становится винительным лица: WYNAGRODZILI GO." }
  - { kind: false-friend, text: "Корень NAGRODA — прямой двойник русской «награды», и всё гнездо читается без перевода: NAGRODA «награда», NAGRODZIĆ «наградить», WYNAGRODZENIE «вознаграждение, заработная плата». Последнее стоит выучить отдельно, потому что в объявлениях о работе оно встречается постоянно и значит именно «зарплата», а не «премия». А вот WYNAGRODZIĆ, в отличие от русского «вознаградить», чаще употребляется в смысле возмещения ущерба, чем похвалы." }
  - { kind: pronunciation, text: "Повелительное здесь двойное: WYNAGRODŹ и WYNAGRÓDŹ, с o и с ó, и обе формы законны — отсюда и пятьдесят шесть форм вместо обычных пятидесяти трёх. Так же ведут себя RODZIĆ (RÓDŹ при RODŹ) и NARODZIĆ из прошлых партий, то есть дублет принадлежит самому корню -RODZIĆ. Сочетание DZI читается мягко: всё слово звучит «вынагро́дзиць»." }
  - { kind: usage, text: "Несовершенная пара — WYNAGRADZAĆ, и в ней основа меняет o на a, как у OBRÓCIĆ при OBRACAĆ из партии про поворот. Существительное WYNAGRODZENIE — самое частое слово этого гнезда в быту: WYNAGRODZENIE BRUTTO «зарплата до вычетов», WYNAGRODZENIE NETTO «на руки». В юридическом тексте встречается оборот WYNAGRODZIĆ SZKODĘ — «возместить ущерб», рядом с NAPRAWIĆ SZKODĘ." }
