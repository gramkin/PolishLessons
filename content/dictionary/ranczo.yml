notes:
  - { kind: false-friend, text: "RANCZO — «ранчо», через CZ, и в отличие от русского склоняется: NA RANCZU, Z RANCZA. В шутку так называют дачу или хутор. Ферма — FARMA, хозяйство — GOSPODARSTWO." }
  - { kind: usage, text: "Средний род. Родительный — RANCZA, местный — RANCZU. Множественное — RANCZA, родительный — RANCZ." }
