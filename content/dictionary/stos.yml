# review
id: stos
format: 2
lemma: "stos"
rank: 5366
pos: noun
pron: { cyr: "стос" }
senses:
  - id: pile
    ru: "куча, стопка, штабель"
    examples:
      - pl: "Na biurku leży stos papierów."
        ru: "На столе лежит куча бумаг."
        source: { kind: authored }
      - pl: "Stos naczyń czeka na zmywanie."
        ru: "Гора посуды ждёт мытья."
        source: { kind: authored }
      - pl: "Ułożył drewno w stos."
        ru: "Он сложил дрова в штабель."
        source: { kind: authored }
  - id: stake
    ru: "костёр (для казни), погребальный костёр"
    examples:
      - pl: "Czarownicę spalono na stosie."
        ru: "Ведьму сожгли на костре."
        source: { kind: authored }
      - pl: "Giordano Bruno zginął na stosie."
        ru: "Джордано Бруно погиб на костре."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "STOS — «куча, стопка», а также «костёр для казни»: SPŁONĄĆ NA STOSIE. Обычный костёр — OGNISKO. Куча вообще — STERTA, KUPA. В программировании STOS — «стек»." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Родительный — STOSU. В местном S смягчается: NA STOSIE." }
  - { kind: government, text: "Куча чего — родительный: STOS KSIĄŻEK. Сжечь на костре — SPALIĆ NA STOSIE, местный. Сложить в кучу — UŁOŻYĆ W STOS, винительный." }
  - { kind: pronunciation, text: "Читается «стос», один слог. STOSIE — «сто́се»." }
collocations:
  - { pl: "stos papierów", ru: "куча бумаг" }
  - { pl: "spłonąć na stosie", ru: "сгореть на костре" }
  - { pl: "stos naczyń", ru: "гора посуды" }
family:
  - { pl: "sterta", ru: "куча, ворох", relation: root }
  - { pl: "ognisko", ru: "костёр", relation: root, id: ognisko }
  - { pl: "kupa", ru: "куча", relation: root, id: kupa }
etymology: "Старое славянское слово, родственное русскому «стог»: то, что сложено кучей."
memory: "Stos — куча, стопка и костёр для казни. Stos papierów — куча бумаг. Spłonąć na stosie — сгореть на костре. Читается «стос»."
idioms:
  - { pl: "rzucić na stos", ru: "отправить на костёр, предать забвению" }
