pron: { cyr: "скупя́ць" }
senses:
  - id: gather
    ru: "объединять, собирать (людей, организации)"
    examples:
      - pl: "Klub skupia miłośników jazzu."
        ru: "Клуб объединяет любителей джаза."
        source: { kind: authored }
      - pl: "Organizacja skupia ponad sto firm."
        ru: "Организация объединяет более ста фирм."
        source: { kind: authored }
  - id: focus
    ru: "сосредотачивать (внимание, силы); собирать (лучи)"
    examples:
      - pl: "Skupia całą uwagę na dziecku."
        ru: "Она сосредотачивает всё внимание на ребёнке."
        source: { kind: authored }
      - pl: "Soczewka skupia światło w jednym punkcie."
        ru: "Линза собирает свет в одной точке."
        source: { kind: authored }
  - id: concentrate
    ru: "skupiać się — сосредотачиваться; собираться (в группу)"
    examples:
      - pl: "Skupiam się na pracy."
        ru: "Я сосредотачиваюсь на работе."
        source: { kind: authored }
      - pl: "Uczniowie skupiają się wokół nauczyciela."
        ru: "Ученики собираются вокруг учителя."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "SKUPIAĆ — не «скупать» и не «скупиться». «Скупать» по-польски SKUPOWAĆ, «скупой» — SKĄPY. SKUPIAĆ значит «собирать в одно место, сосредотачивать», от KUPA «куча»." }
  - { kind: government, text: "На чём — NA с предложным: SKUPIAĆ UWAGĘ NA CZYMŚ, SKUPIAĆ SIĘ NA PRACY. Вокруг кого — WOKÓŁ с родительным: SKUPIAĆ LUDZI WOKÓŁ SIEBIE." }
  - { kind: usage, text: "Несовершенный вид; совершенный — SKUPIĆ: NIE MOGĘ SIĘ SKUPIĆ «не могу сосредоточиться». Отсюда SKUPIENIE «сосредоточенность» и SKUPISKO «скопление»." }
  - { kind: pronunciation, text: "Читается «скупя́ць»: PIA — «пя», одним слогом. Ударение на предпоследнем слоге: SKUPIAM — «ску́пям»." }
collocations:
  - { pl: "skupiać uwagę", ru: "сосредотачивать внимание" }
  - { pl: "skupiać się na czymś", ru: "сосредотачиваться на чём-то" }
  - { pl: "skupiać wokół siebie", ru: "сплачивать вокруг себя" }
family:
  - { pl: "skupić", ru: "сосредоточить, собрать", relation: aspect, id: skupic }
  - { pl: "skupienie", ru: "сосредоточенность", relation: derived }
  - { pl: "skupisko", ru: "скопление", relation: derived }
  - { pl: "kupa", ru: "куча", relation: root, id: kupa }
