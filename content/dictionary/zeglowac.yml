# review
id: zeglowac
format: 2
lemma: "żeglować"
rank: 5532
pos: verb
aspect: imperf
pron: { cyr: "жегло́ваць" }
senses:
  - id: sail
    ru: "плавать под парусом, ходить под парусами"
    examples:
      - pl: "Żeglowali wzdłuż zachodniego wybrzeża Afryki."
        ru: "Они плыли вдоль западного побережья Африки."
        source: { kind: translated, id: 2182016 }
      - pl: "Piraci żeglowali po siedmiu morzach."
        ru: "Пираты бороздили семь морей."
        source: { kind: translated, id: 3254957 }
      - pl: "Żeglujesz dziś po południu?"
        ru: "Ты сегодня днём идёшь под парусом?"
        source: { kind: translated, id: 8533971 }
  - id: sailing
    ru: "парусный спорт (существительное żeglowanie)"
    examples:
      - pl: "Żeglowanie to konieczność, życie koniecznością nie jest."
        ru: "Плавать под парусом необходимо, жить — нет."
        source: { kind: translated, id: 620860 }
      - pl: "Żeglowanie uczy cierpliwości."
        ru: "Парусный спорт учит терпению."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Именно под парусом. Плыть вообще — płynąć, а ходить на судне — pływać." }
  - { kind: false-friend, text: "Корень żagiel «парус», из немецкого Segel. Русское «жечь» тут ни при чём, хотя начало слова похоже." }
  - { kind: government, text: "Непереходный; куда — do с родительным, вдоль чего — wzdłuż с родительным." }
  - { kind: usage, text: "żeglarz «моряк, яхтсмен», żeglarstwo «парусный спорт» — из той же семьи." }
collocations:
  - { pl: "żeglować po morzu", ru: "ходить по морю под парусом" }
etymology: "От żagiel «парус», из немецкого Segel."
memory: "żeglować — «ходить под парусом», от żagiel «парус». Плыть вообще — płynąć. Отсюда żeglarz «яхтсмен» и żeglarstwo «парусный спорт»."
idioms:
  - { pl: "żeglować po morzu", ru: "ходить по морю под парусом" }
