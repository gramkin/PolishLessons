notes:
  - { kind: false-friend, text: "ГЛАВНАЯ ловушка: lustro — это ЗЕРКАЛО, а не люстра. Люстра по-польски żyrandol. Оба слова от латинского lustrare «освещать», но разошлись." }
  - { kind: government, text: "Средний род: to lustro, tego lustra. В зеркале — w lustrze, предложный; перед зеркалом — przed lustrem, творительный." }
  - { kind: usage, text: "Przeglądać się w lustrze «смотреться в зеркало», patrzeć na siebie w lustrze — то же самое." }
  - { kind: usage, text: "Зеркальце — lusterko; в машине lusterko wsteczne «зеркало заднего вида»." }
collocations:
  - { pl: "w lustrze", ru: "в зеркале" }
  - { pl: "przed lustrem", ru: "перед зеркалом" }
etymology: "Из латинского lustrare «освещать»; русская «люстра» — то же слово, но о светильнике."
memory: "lustro — это ЗЕРКАЛО, а не люстра: люстра по-польски żyrandol. В зеркале — w lustrze, перед зеркалом — przed lustrem."
idioms:
