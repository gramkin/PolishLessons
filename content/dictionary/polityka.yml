notes:
  - { kind: false-friend, text: "ДВА СЛОВА, КОТОРЫЕ ЛЕГКО СПУТАТЬ ПРЯМО ВНУТРИ ПОЛЬСКОГО. Polityka — женское, «политика». Polityk — мужское, «ПОЛИТИК», человек. Беда в том, что их формы пересекаются: polityka это и именительный «политика», и родительный от polityk «политика» (человека); а polityk — это и «политик», и родительный множественного от polityka. Различает только контекст и согласование: ta polityka против ten polityk." }
  - { kind: pronunciation, text: "ДАТЕЛЬНЫЙ И ПРЕДЛОЖНЫЙ: K ПЕРЕХОДИТ В C. Polityka даёт polityce — «политы́цэ», и это то же правило, что в fabryka — fabryce, paczka — paczce, matka — matce. Ударение везде на предпоследнем слоге: po-li-TY-ka, po-li-TY-ce." }
  - { kind: usage, text: "Второе значение, «курс, линия», в деловом языке встречается чаще первого: polityka firmy, polityka cenowa, polityka prywatności «политика конфиденциальности». Множественное polityki в этом смысле нормально: polityki publiczne «государственные политики». Прилагательное polityczny, наречие politycznie." }
  - { kind: register, text: "Звательный падеж polityko в живой речи не употребляется: обращаться к политике как к собеседнику можно только в стихах или в риторическом возгласе. В обычном разговоре вместо звательного звучит именительный." }
collocations:
  - { pl: "polityka zagraniczna", ru: "внешняя политика" }
  - { pl: "polityka prywatności", ru: "политика конфиденциальности" }
  - { pl: "wejść do polityki", ru: "прийти в политику" }
family:
  - { pl: "polityk", ru: "политик", relation: derived }
  - { pl: "polityczny", ru: "политический", relation: derived }
  - { pl: "politycznie", ru: "политически", relation: derived }
etymology: "Из греческого politikē, от polis «город-государство»: искусство управления городом. В польский слово пришло через латынь и западные языки, в русский — тем же путём и почти одновременно, так что совпадение полное. Отсюда polityk, polityczny, politykować «политиканствовать»."
memory: "polityka — «политика», женского рода; politykа через k без окончания, то есть polityk, — это «ПОЛИТИК», человек, мужского рода. Формы у них пересекаются, различает только согласование: ta polityka, ten polityk. Дательный и предложный смягчают k в c: w polityce."
idioms:
