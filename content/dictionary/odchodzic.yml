# review
id: odchodzic
format: 2
lemma: "odchodzić"
rank: 1121
pos: verb
aspect: imperf
aspectPair: odejsc
pron: { cyr: "отхо́дзиць" }
senses:
  - id: leave
    ru: "уходить, отходить"
    examples:
      - pl: "Odchodzę."
        ru: "Я ухожу."
        source: { kind: translated, id: 6771102 }
      - pl: "Szkoda, że Tom odchodzi."
        ru: "Жаль, что Том уходит."
        source: { kind: tatoeba, id: 13785966 }
      - pl: "Nie odchodź."
        ru: "Не уходи."
        source: { kind: translated, id: 1060700 }
  - id: depart
    ru: "отходить (о транспорте)"
    examples:
      - pl: "Kiedy odchodzi następny autobus do Helsinek?"
        ru: "Когда отходит следующий автобус в Хельсинки?"
        source: { kind: translated, id: 5224623 }
      - pl: "Pociąg odchodzi z drugiego peronu."
        ru: "Поезд отходит со второго пути."
        source: { kind: authored }
  - id: retire
    ru: "odchodzić na emeryturę — уходить на пенсию"
    examples:
      - pl: "Odchodzę na emeryturę za cztery lata."
        ru: "Я ухожу на пенсию через четыре года."
        source: { kind: translated, id: 6533126 }
      - pl: "Kiedy odchodził na emeryturę, dostał od firmy złoty zegarek."
        ru: "Когда он уходил на пенсию, фирма подарила ему золотые часы."
        source: { kind: translated, id: 366179 }
notes:
  - { kind: usage, text: "Несовершенный вид к odejść «уйти». Основы разные: odchodzę, но odejdę." }
  - { kind: government, text: "odchodzić od czegoś «отходить от чего-то» — предлог od с родительным: odchodzić od tematu «отходить от темы»." }
  - { kind: usage, text: "О транспорте глагол значит «отходить, отправляться»: Pociąg odchodzi o piątej." }
  - { kind: usage, text: "odchodzić od zmysłów значит «сходить с ума», а мягкое odszedł о человеке — «ушёл из жизни»." }
collocations:
  - { pl: "odchodzić na emeryturę", ru: "уходить на пенсию" }
  - { pl: "nie odchodź", ru: "не уходи" }
  - { pl: "odchodzić od tematu", ru: "отходить от темы" }
family:
  - { pl: "odejść", ru: "уйти", relation: aspect, id: odejsc }
  - { pl: "chodzić", ru: "ходить", relation: root, id: chodzic }
  - { pl: "odejście", ru: "уход", relation: derived }
etymology: "Приставка od- плюс chodzić «ходить» — ровно как русское «от-ходить». Корень тот же, что в русском «ход»."
memory: "odchodzić — несовершенный вид к odejść: «уходить, отходить». Поезда тоже odchodzą «отходят», а odchodzić na emeryturę значит «уходить на пенсию»."
idioms:
  - { pl: "odchodzić od zmysłów", ru: "сходить с ума" }
  - { pl: "nie odchodź", ru: "не уходи" }
