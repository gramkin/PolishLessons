notes:
  - { kind: pronunciation, text: "Носовой гласный меняется в зависимости от слога: ą стоит только в именительном KRĄG, а во всех остальных формах появляется ę — KRĘGU, kręgiem, kręgi, kręgów. Так устроены dąb — dęby и ząb — zęby: когда слог открывается, носовой понижается. Заодно конечное g оглушается, и слово звучит «кронк», а звонкость возвращается в kręgu." }
  - { kind: usage, text: "Рядом с кругом в прямом и переносном смысле у слова есть значение, которого у русского «круга» нет: KRĄG — это позвонок, отсюда KRĘGOSŁUP «позвоночник», буквально «столб из позвонков». По-русски позвонок называется отдельным словом, не связанным с кругом, так что это значение приходится просто запомнить." }
collocations:
  - { pl: "krąg znajomych", ru: "круг знакомых" }
  - { pl: "zamknięty krąg", ru: "замкнутый круг" }
  - { pl: "w kręgu rodziny", ru: "в кругу семьи" }
family:
  - { pl: "kręgosłup", ru: "позвоночник", relation: derived }
  - { pl: "okrąg", ru: "окружность", relation: root }
  - { pl: "okrągły", ru: "круглый", relation: derived }
etymology: "Из праславянского *krǫgъ — то же слово, что русский «круг». Носовой гласный ǫ в русском дал у, а в польском распался на ą и ę, которые теперь чередуются по слогам. Отсюда же okrąg «окружность», okrągły «круглый» и kręgosłup, где позвонки поняты как круги, нанизанные в столб."
memory: "ą только в именительном: krąg, но kręgu, kręgi, kręgów. И это ещё «позвонок»: kręgosłup — позвоночник."
idioms:
