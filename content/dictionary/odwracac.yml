# review
id: odwracac
format: 2
lemma: "odwracać"
rank: 3722
pos: verb
pron: { cyr: "одвра́цаць" }
senses:
  - id: turn
    ru: "поворачивать, переворачивать; ODWRACAĆ SIĘ — оборачиваться"
    examples:
      - pl: "Odwraca głowę, kiedy mnie widzi."
        ru: "Он отворачивается, когда меня видит."
        source: { kind: authored }
      - pl: "Odwracam kartkę i czytam dalej."
        ru: "Я переворачиваю страницу и читаю дальше."
        source: { kind: authored }
      - pl: "Ludzie odwracają się za nią na ulicy."
        ru: "Люди оборачиваются ей вслед на улице."
        source: { kind: authored }
  - id: divert
    ru: "отвлекать (ODWRACAĆ UWAGĘ); обращать вспять"
    examples:
      - pl: "Złodziej odwraca uwagę ofiary."
        ru: "Вор отвлекает внимание жертвы."
        source: { kind: authored }
      - pl: "Ten lek odwraca skutki zatrucia."
        ru: "Это лекарство снимает последствия отравления."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ODWRACAĆ — «поворачивать, переворачивать», а не «отвращать» в смысле «вызывать отвращение» (BUDZIĆ WSTRĘT). Частые обороты: ODWRACAĆ UWAGĘ «отвлекать внимание», ODWRACAĆ SIĘ PLECAMI «поворачиваться спиной», ODWRACAĆ KOTA OGONEM «переворачивать всё с ног на голову»." }
  - { kind: usage, text: "Несовершенный вид; совершенный — ODWRÓCIĆ. Спряжение на -AM: ODWRACAM, ODWRACASZ, ODWRACAJĄ. В совершенном виде A чередуется с Ó: ODWRÓCIĆ. Мужско-личное страдательное ODWRACANI в карточку не включено." }
  - { kind: government, text: "Что — винительный: ODWRACAĆ GŁOWĘ, KARTKĘ. От чего отвлекать — OD с родительным: ODWRACAĆ UWAGĘ OD PROBLEMU. От кого отворачиваться — OD с родительным: ODWRACAĆ SIĘ OD PRZYJACIÓŁ." }
  - { kind: pronunciation, text: "Читается «одвра́цаць»: W после D — «в», C — «ц». Ударение на предпоследнем слоге. ODWRACAM — «одвра́цам»." }
  - { kind: register, text: "Нейтральное слово. ODWRACAĆ KOTA OGONEM — разговорное «выворачивать всё наизнанку»." }
collocations:
  - { pl: "odwracać uwagę", ru: "отвлекать внимание" }
  - { pl: "odwracać się plecami", ru: "поворачиваться спиной" }
  - { pl: "odwracać kartkę", ru: "переворачивать страницу" }
family:
  - { pl: "odwrócić", ru: "повернуть, перевернуть", relation: aspect, id: odwrocic }
  - { pl: "obracać", ru: "вращать, поворачивать", relation: root }
  - { pl: "odwrotny", ru: "обратный", relation: derived }
etymology: "Приставка OD- плюс WRACAĆ «возвращать», праславянское *vortiti «вертеть», как русское «вращать», «отворачивать». Польское WRAC- на месте русского ВРАЩ- / ВОРОТ-."
memory: "Odwracać — поворачивать, переворачивать: odwracam kartkę. Odwracać uwagę — отвлекать. Odwracać się — оборачиваться."
idioms:
  - { pl: "odwracać kota ogonem", ru: "выворачивать всё наизнанку" }
formExamplesSkip:
  - { form: "odwracani", reason: "мужско-личная форма: переворачивают вещи, а не людей" }
