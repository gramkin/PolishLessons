# review
id: izba
format: 2
lemma: "izba"
rank: 4187
pos: noun
pron: { cyr: "и́зба" }
senses:
  - id: room
    ru: "горница, комната (устар.)"
    examples:
      - pl: "W chacie była jedna izba i kuchnia."
        ru: "В избе была одна горница и кухня."
        source: { kind: authored }
      - pl: "Rodzina siedziała w izbie przy piecu."
        ru: "Семья сидела в горнице у печи."
        source: { kind: authored }
      - pl: "Izba była czysta i jasna."
        ru: "Горница была чистой и светлой."
        source: { kind: authored }
  - id: chamber
    ru: "палата (учреждение)"
    examples:
      - pl: "Sejm to izba niższa parlamentu."
        ru: "Сейм — нижняя палата парламента."
        source: { kind: authored }
      - pl: "Pacjenta przyjęto na izbie przyjęć."
        ru: "Пациента приняли в приёмном покое."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "IZBA — не «изба», а «горница, комната» в старом доме и «палата»: IZBA WYŻSZA, «верхняя палата», IZBA HANDLOWA, «торговая палата», IZBA PRZYJĘĆ, «приёмный покой». Деревянный дом — CHATA." }
  - { kind: usage, text: "Девять живых форм, женский род. В местном падеже B перед IE смягчается: W IZBIE. Родительный множественного — IZB. Звательный не даётся." }
  - { kind: government, text: "В приёмном покое — NA IZBIE PRZYJĘĆ, с NA. Палата чего — родительный: IZBA LEKARSKA, «врачебная палата», IZBA SKARBOWA." }
  - { kind: pronunciation, text: "Читается «и́зба», ударение на первом слоге, как русское «изба»." }
collocations:
  - { pl: "izba przyjęć", ru: "приёмный покой" }
  - { pl: "izba wyższa", ru: "верхняя палата" }
  - { pl: "izba handlowa", ru: "торговая палата" }
family:
  - { pl: "izdebka", ru: "комнатка, светёлка", relation: derived }
  - { pl: "izba przyjęć", ru: "приёмный покой", relation: derived }
  - { pl: "izba lekarska", ru: "врачебная палата", relation: derived }
etymology: "Общеславянское слово, исходно «тёплое помещение»; русская «изба» — то же самое, но в русском так назвали весь дом, а в польском — комнату и затем палату."
memory: "Izba — горница, палата; chata — изба. Читается «и́зба». Izba przyjęć — приёмный покой. Izba wyższa — верхняя палата."
idioms:
  - { pl: "czuć się jak u siebie", ru: "чувствовать себя как дома" }
formExamplesSkip:
  - { form: "izbo", reason: "звательный падеж у этого слова не употребляется" }
