# review
id: cieszyc
format: 2
lemma: "cieszyć"
rank: 374
pos: verb
aspect: imperf
pron: { cyr: "це́шыць" }
senses:
  - id: be-glad
    ru: "радоваться (cieszyć się)"
    examples:
      - pl: "Strasznie się cieszę."
        ru: "Я ужасно рад."
        source: { kind: tatoeba, id: 1350487 }
      - pl: "Cieszę się, że wróciłeś."
        ru: "Я рад, что ты вернулся."
        source: { kind: tatoeba, id: 3635684 }
      - pl: "Cieszę się, że przyszedłeś."
        ru: "Я рад, что ты пришёл."
        source: { kind: tatoeba, id: 827761 }
  - id: gladden
    ru: "радовать (кого-либо)"
    examples:
      - pl: "Cieszy mnie, że pamiętasz."
        ru: "Я рада, что ты помнишь."
        source: { kind: tatoeba, id: 7905721 }
      - pl: "Cieszą mnie te wieści."
        ru: "Меня радуют эти вести."
        source: { kind: translated, id: 601384 }
      - pl: "Cieszy cię to?"
        ru: "Тебя это радует?"
        source: { kind: translated, id: 9582261 }
notes:
  - { kind: usage, text: "Cieszę się, że... — «Я рад, что...», самая ходовая формула вежливости: Cieszę się, że przyszedłeś «Рад, что ты пришёл»." }
  - { kind: usage, text: "Два направления у одного глагола: cieszyć się «радоваться самому» и cieszyć kogoś «радовать кого-то». Cieszy mnie to «Меня это радует»." }
  - { kind: usage, text: "cieszyć się czymś значит не только «радоваться чему-то», но и «обладать, пользоваться»: cieszyć się dobrym zdrowiem «обладать хорошим здоровьем»." }
  - { kind: usage, text: "Совершенный вид — ucieszyć się: Ucieszyłem się «Я обрадовался»." }
collocations:
  - { pl: "cieszę się", ru: "я рад" }
  - { pl: "cieszyć się życiem", ru: "радоваться жизни" }
  - { pl: "cieszyć się zdrowiem", ru: "обладать здоровьем" }
  - { pl: "ciesz się", ru: "радуйся" }
etymology: "Праславянское *těšiti «утешать, успокаивать» — то же слово, что русские «тешить» и «утешить». Польское cie- стоит на месте русского «те-»."
memory: "cieszyć się — «радоваться», и корень тот же, что в русских «тешить, утешить»: cie- на месте «те-». Главная формула вежливости — Cieszę się, że... «Я рад, что...». И помните вторую сторону: cieszyć kogoś значит «радовать кого-то»."
idioms:
  - { pl: "cieszę się, że...", ru: "я рад, что..." }
  - { pl: "cieszyć się dobrym zdrowiem", ru: "обладать хорошим здоровьем" }
  - { pl: "cieszyć się życiem", ru: "радоваться жизни" }
