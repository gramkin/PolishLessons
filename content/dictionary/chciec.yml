# review
id: chciec
format: 2
lemma: "chcieć"
rank: 25
pos: verb
aspect: imperf
pron: { cyr: "хце́ць" }
senses:
  - id: want
    ru: "хотеть, желать"
    examples:
      - pl: "Chcę żyć."
        ru: "Я хочу жить."
        source: { kind: tatoeba, id: 360459 }
      - pl: "Chcesz kawałek?"
        ru: "Хочешь кусочек?"
        source: { kind: tatoeba, id: 997664 }
      - pl: "Tom chce pomóc."
        ru: "Том хочет помочь."
        source: { kind: tatoeba, id: 2120152 }
  - id: would-like
    ru: "chciałbym — я хотел бы (вежливая просьба)"
    examples:
      - pl: "Chciałbym zadzwonić."
        ru: "Я бы хотел позвонить."
        source: { kind: tatoeba, id: 524710 }
      - pl: "Tomek chciał przyjść."
        ru: "Том хотел прийти."
        source: { kind: tatoeba, id: 3460699 }
notes:
  - { kind: usage, text: "chcieć сочетается с инфинитивом или с придаточным на żeby: Chcę, żebyś przyszedł «Я хочу, чтобы ты пришёл»." }
  - { kind: usage, text: "Безличный оборот chce mi się значит «мне хочется»: Chce mi się pić «Мне хочется пить»." }
collocations:
  - { pl: "chcieć powiedzieć", ru: "хотеть сказать" }
  - { pl: "chce mi się", ru: "мне хочется" }
  - { pl: "co chcesz", ru: "что хочешь" }
etymology: "Праславянское *xъtěti — то же слово, что русское «хотеть»."
memory: "Совпадает с русским и в главном, и в мелочах: chcieć + инфинитив, а безличное chce mi się — это ровно «мне хочется». Вежливая просьба строится сослагательным: chciałbym «я хотел бы»."
idioms:
  - { pl: "chcąc nie chcąc", ru: "волей-неволей" }
  - { pl: "chcieć to móc", ru: "хотеть значит мочь" }
  - { pl: "dla chcącego nic trudnego", ru: "для желающего нет ничего трудного" }
