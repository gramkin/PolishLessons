notes:
  - { kind: false-friend, text: "REJESTR — «реестр», а также «регистр» голоса и стиля. Регистратура в поликлинике — REJESTRACJA. Регистрировать — REJESTROWAĆ. Реестр судимостей — KRAJOWY REJESTR KARNY." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Родительный — REJESTRU. В местном R переходит в RZ: W REJESTRZE." }
  - { kind: government, text: "Внести в реестр — WPISAĆ DO REJESTRU, DO с родительным. Значиться в реестре — FIGUROWAĆ W REJESTRZE, местный. Вычеркнуть из реестра — WYKREŚLIĆ Z REJESTRU." }
  - { kind: pronunciation, text: "Читается «рэ́естр»: RE — твёрдое «рэ», JE — «е». Ударение на первом слоге. REJESTRZE — «рэе́стшэ»." }
collocations:
  - { pl: "wpisać do rejestru", ru: "внести в реестр" }
  - { pl: "rejestr karny", ru: "реестр судимостей" }
  - { pl: "rejestr głosu", ru: "диапазон голоса" }
family:
  - { pl: "rejestracja", ru: "регистрация, регистратура", relation: derived }
  - { pl: "rejestrować", ru: "регистрировать", relation: derived }
  - { pl: "lista", ru: "список", relation: root, id: lista }
etymology: "Из средневековой латыни REGESTRUM «список, перечень», от REGERERE «вносить, записывать». Русское «реестр» и «регистр» — то же слово."
memory: "Rejestr — реестр, регистр. Wpisać do rejestru — внести в реестр. W rejestrze — в реестре. Читается «рэ́естр»."
