  - { form: "profesorowie", reason: "в корпусе нет примеров, хотя это нормативная форма множественного числа о людях" }
  - { form: "profesorze", reason: "в корпусе нет примеров; форма живёт прежде всего в обращении panie profesorze" }
  - { form: "profesorzy", reason: "разговорный вариант множественного числа; нормой является profesorowie" }
