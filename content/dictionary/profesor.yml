# review
id: profesor
format: 2
lemma: "profesor"
rank: 1102
pos: noun
pron: { cyr: "профэ́сор" }
senses:
  - id: title
    ru: "профессор (звание, должность)"
    examples:
      - pl: "Jestem profesorem."
        ru: "Я профессор."
        source: { kind: translated, id: 4929158 }
      - pl: "Jest profesorem biologii na Harwardzie."
        ru: "Он профессор биологии в Гарварде."
        source: { kind: translated, id: 646797 }
      - pl: "Tom jest profesorem literatury chińskiej."
        ru: "Том — профессор китайской литературы."
        source: { kind: translated, id: 4917174 }
  - id: teacher
    ru: "профессор как преподаватель"
    examples:
      - pl: "Profesor uczy czeskiego."
        ru: "Профессор преподаёт чешский."
        source: { kind: translated, id: 5229176 }
      - pl: "Nudny wykład profesora usypiał mnie."
        ru: "Скучная лекция профессора меня усыпляла."
        source: { kind: translated, id: 8745948 }
      - pl: "On bardzo szanuje tego profesora."
        ru: "Он очень уважает этого профессора."
        source: { kind: translated, id: 361711 }
notes:
  - { kind: false-friend, text: "В Польше profesor шире русского: так называют не только профессора вуза, но и учителя лицея. К школьному учителю тоже обращаются panie profesorze." }
  - { kind: usage, text: "Мужской одушевлённый: винительный совпадает с родительным — widzę profesora." }
  - { kind: usage, text: "Обращение — звательный падеж: panie profesorze! По-русски здесь именительный, «господин профессор»." }
  - { kind: usage, text: "Множественное о людях — profesorowie; форма profesory звучит пренебрежительно." }
collocations:
  - { pl: "pan profesor", ru: "господин профессор" }
  - { pl: "panie profesorze", ru: "господин профессор (обращение)" }
  - { pl: "profesor uniwersytetu", ru: "профессор университета" }
  - { pl: "tytuł profesora", ru: "звание профессора" }
family:
  - { pl: "profesorski", ru: "профессорский", relation: derived }
  - { pl: "profesura", ru: "профессура", relation: derived }
etymology: "Из латинского professor «учитель, наставник», от profiteri «объявлять, преподавать». Русский «профессор» — то же заимствование."
memory: "profesor — «профессор», но в Польше слово шире: так называют и учителя лицея. Обращение — panie profesorze, звательный падеж, которого в русском уже нет."
idioms:
  - { pl: "panie profesorze", ru: "господин профессор" }
  - { pl: "profesor zwyczajny", ru: "ординарный профессор" }
formExamplesSkip:
