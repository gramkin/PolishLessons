# review
id: zachwyt
format: 2
lemma: "zachwyt"
rank: 2167
pos: noun
pron: { cyr: "за́хвыт" }
senses:
  - id: delight
    ru: "восторг, восхищение"
    examples:
      - pl: "Zaskoczenie i zachwyt - oto pierwszy krok ku zrozumieniu."
        ru: "Изумление, удивление - это первый шаг на пути к постижению."
        source: { kind: tatoeba, id: 350103 }
      - pl: "Zatrzymała się przed lustrem i patrzyła na siebie z zachwytem."
        ru: "Она остановилась перед зеркалом и смотрела на себя с восхищением."
        source: { kind: translated, id: 696430 }
      - pl: "Wpadł w zachwyt nad obrazem."
        ru: "Он пришёл в восторг от картины."
        source: { kind: authored }
  - id: admiration
    ru: "восхищение (кем-либо, чем-либо)"
    examples:
      - pl: "Patrzyli na nią z zachwytem."
        ru: "Они смотрели на неё с восхищением."
        source: { kind: authored }
      - pl: "Nie krył zachwytu."
        ru: "Он не скрывал восторга."
        source: { kind: authored }
notes:
  - { kind: government, text: "Восторгаться чем-л. — z zachwytem «с восхищением» (творительный) или zachwyt nad czymś «восторг перед чем-л.» (nad с творительным)." }
  - { kind: usage, text: "wpaść w zachwyt «прийти в восторг» — с винительным падежом после w." }
  - { kind: false-friend, text: "Корень chwytać «хватать»: восторг — то, что человека «захватывает». Русское «восхищение» от «хитить, похищать» построено на том же образе." }
  - { kind: government, text: "Мужской неодушевлённый; родительный — zachwytu." }
collocations:
  - { pl: "wpaść w zachwyt", ru: "прийти в восторг" }
  - { pl: "z zachwytem", ru: "с восхищением" }
etymology: "От zachwycić «восхитить», от chwytać «хватать»: то, что захватывает. Русское «восхищение» от «хитить» построено так же."
memory: "zachwyt — «восторг». Корень chwytać «хватать»: восторг захватывает человека, ровно как русское «восхищение» от «похитить»."
