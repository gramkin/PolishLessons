etymology: "Через немецкий из французского crétin, а то — из диалектного crestin, то есть chrétien «христианин». В альпийских долинах, где от нехватки йода рождались больные дети, их называли так из жалости: «бедная христианская душа». Со временем эвфемизм стал медицинским термином, а затем бранью. В русский слово пришло тем же путём и с той же историей."
memory: "kretyn — «кретин», слово общее и одинаково грубое в обоих языках. Запомнить стоит его происхождение: французское crétin это искажённое chrétien «христианин». И форму множественного числа: kretyni, а не «kretyny»."
idioms:
