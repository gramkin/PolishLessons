notes:
  - { kind: false-friend, text: "Ловушек нет: «кретин» и kretyn пришли в оба языка из французского и значат одно и то же, одинаково грубо. Но этимология стоит того, чтобы её знать. Французское crétin — это искажённое chrétien «христианин»: в альпийских долинах, где от нехватки йода рождались больные дети, их так называли из жалости, «бедная христианская душа». Эвфемизм стал медицинским термином, а потом бранью." }
  - { kind: usage, text: "Существительное мужско-личное, и парадигма это показывает. Именительный множественного — kretyni, с мягким окончанием, а винительный множественного совпадает с родительным: widzę kretynów, а не «kretyny». Форма kretyny существует как уничижительная, но в основную таблицу не входит." }
  - { kind: pronunciation, text: "Два слога, ударение на предпоследнем: KRE-tyn, «крэ́тын». y звучит как ы, e как э. Обратите внимание на пару kretynie и kretyni: первое — предложный и звательный единственного числа, второе — именительный множественного. На слух их различает только последний звук." }
