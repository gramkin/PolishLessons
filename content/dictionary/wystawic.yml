# review
id: wystawic
format: 2
lemma: "wystawić"
rank: 2021
pos: verb
pron: { cyr: "выста́виць" }
senses:
  - id: put-out
    ru: "выставить (наружу, на витрину)"
    examples:
      - pl: "Wystawił kwiaty na balkon."
        ru: "Он выставил цветы на балкон."
        source: { kind: authored }
      - pl: "Wystawiono nowe modele na wystawie."
        ru: "Новые модели выставили на витрине."
        source: { kind: authored }
      - pl: "Wystaw śmieci przed bramę."
        ru: "Выставь мусор за ворота."
        source: { kind: authored }
  - id: issue
    ru: "выставить, выписать (счёт, оценку, справку)"
    examples:
      - pl: "Wystawili rachunek na tysiąc złotych."
        ru: "Они выставили счёт на тысячу злотых."
        source: { kind: authored }
      - pl: "Nauczyciel wystawił oceny przed świętami."
        ru: "Учитель выставил оценки перед праздниками."
        source: { kind: authored }
  - id: stage
    ru: "поставить (спектакль); wystawić kogoś — разг. подвести"
    examples:
      - pl: "Teatr wystawił nową sztukę."
        ru: "Театр поставил новую пьесу."
        source: { kind: authored }
      - pl: "Wystawił nas do wiatru i nie przyszedł."
        ru: "Он нас подвёл и не пришёл."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Глагол разбирается по-русски без остатка: wy- это «вы-», stawić — «ставить», значит wystawić — «выставить». А вот существительное wystawa шире русского: это и «ВЫСТАВКА», и «ВИТРИНА» магазина. Oglądać wystawy значит разглядывать витрины, а не ходить по выставкам." }
  - { kind: government, text: "Выставляют ЧТО — винительный: wystawić kwiaty, rachunek, ocenę, sztukę. Куда — na с винительным (wystawić na balkon, na słońce) или przed с винительным (wystawić przed bramę). Кому выписывают — дательный: wystawić komuś rachunek, zaświadczenie. Всё как по-русски." }
  - { kind: usage, text: "Вид совершенный, несовершенная пара — wystawiać. Страдательное причастие по правилу для -ić: wystawiony, wystawieni. Канцелярские обороты встречаются постоянно: wystawić fakturę «выписать счёт-фактуру», wystawić zaświadczenie «выдать справку»." }
  - { kind: register, text: "Разговорное wystawić kogoś do wiatru значит «подвести, кинуть, оставить ни с чем» — человек ждал, а его не пришли. Русские соответствия — «кинуть» или «оставить с носом». Само wystawić kogoś без дополнения тоже понимают как «подвести»." }
collocations:
  - { pl: "wystawić rachunek", ru: "выставить счёт" }
  - { pl: "wystawić ocenę", ru: "выставить оценку" }
  - { pl: "wystawić kogoś do wiatru", ru: "подвести кого-л." }
family:
  - { pl: "stawiać", ru: "ставить", relation: root, id: stawiac }
  - { pl: "wystawa", ru: "выставка; витрина", relation: derived }
  - { pl: "wystawiać", ru: "выставлять", relation: aspect }
etymology: "Приставка wy- «вы-» плюс stawić от stać «стоять» — ровно то же сложение, что русское «вы-ставить» от «ставить». Соответствие приставок wy-/вы- сквозное: wyjść «выйти», wypić «выпить», wyrzucić «выбросить». Отсюда wystawa «выставка, витрина» и wystawca «экспонент»."
memory: "wystawić — «выставить», по частям: wy- это «вы-», stawić — «ставить». Запомните два оборота: wystawić rachunek «выставить счёт» и wystawić kogoś do wiatru «подвести». И что wystawa — это ещё и «витрина»."
idioms:
  - { pl: "wystawić kogoś do wiatru", ru: "подвести, оставить с носом" }
  - { pl: "wystawić rachunek", ru: "выставить счёт" }
