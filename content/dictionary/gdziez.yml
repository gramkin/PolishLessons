# review
id: gdziez
format: 2
lemma: "gdzież"
rank: 5628
pos: adv
pron: { cyr: "гдзеш" }
senses:
  - id: where-emph
    ru: "где же (усиленный вопрос)"
    examples:
      - pl: "Gdzież to poszła Yoko?"
        ru: "Куда же подевалась Йоко?"
        source: { kind: translated, id: 838941 }
      - pl: "Gdzież on teraz przebywa?"
        ru: "Где же он теперь находится?"
        source: { kind: authored }
      - pl: "Gdzież się podziały moje klucze?"
        ru: "Куда же подевались мои ключи?"
        source: { kind: authored }
  - id: rhetorical
    ru: "где уж там, куда там (риторическое отрицание)"
    examples:
      - pl: "Gdzież mi tam do niego!"
        ru: "Куда уж мне до него!"
        source: { kind: authored }
      - pl: "Gdzież tam, nic podobnego."
        ru: "Да где там, ничего подобного."
        source: { kind: authored }
      - pl: "Gdzież mi się z nim równać!"
        ru: "Куда уж мне с ним равняться!"
        source: { kind: authored }
notes:
  - { kind: usage, text: "Это gdzie «где» с усилительной частицей -ż. Та же модель, что в otóż, skądże, czyżby, jakże." }
  - { kind: false-friend, text: "Второе значение неожиданное: Gdzież tam! значит не «где там», а решительное «Да куда там!», «Ничего подобного!»" }
  - { kind: usage, text: "Оборот gdzież mi tam do kogoś значит «куда уж мне до кого-то»." }
  - { kind: register, text: "Слово книжное и слегка старомодное, обычное в литературе XIX–XX веков." }
collocations:
  - { pl: "gdzież tam!", ru: "да куда там!" }
  - { pl: "gdzież mi do niego", ru: "куда уж мне до него" }
  - { pl: "gdzie", ru: "где" }
etymology: "Из gdzie «где» с усилительной частицей -ż. Та же модель, что в otóż, skądże, jakże."
memory: "gdzież — усиленное gdzie «где». Но помните второе значение: Gdzież tam! — это не вопрос, а решительное «Да куда там!», «Ничего подобного!» Слово из той же семьи, что otóż, skądże и jakże."
idioms:
  - { pl: "gdzież tam!", ru: "да куда там!" }
  - { pl: "gdzież mi do niego", ru: "куда уж мне до него" }
formExamples:
