# review
id: zaraza
format: 2
lemma: "zaraza"
rank: 1656
pos: noun
pron: { cyr: "зара́за" }
senses:
  - id: plague
    ru: "эпидемия, мор, чума"
    examples:
      - pl: "Zaraza zdziesiątkowała całą wieś."
        ru: "Эпидемия выкосила всю деревню."
        source: { kind: authored }
      - pl: "Bali się zarazy bardziej niż wojny."
        ru: "Они боялись мора больше войны."
        source: { kind: authored }
      - pl: "Statki przywiozły zarazę z południa."
        ru: "Корабли привезли заразу с юга."
        source: { kind: authored }
  - id: blight
    ru: "болезнь растений"
    examples:
      - pl: "Ta zaraza niszczy ziemniaki od lipca."
        ru: "Эта болезнь губит картофель с июля."
        source: { kind: authored }
  - id: insult
    ru: "зараза (о человеке)"
    examples:
      - pl: "Ty zarazo, znowu mi to zrobiłeś!"
        ru: "Ах ты зараза, опять ты мне это сделал!"
        source: { kind: authored }
notes:
  - { kind: usage, text: "РОДИТЕЛЬНЫЙ МНОЖЕСТВЕННОГО — ZARAZ, И ЭТО ТО ЖЕ СЛОВО, ЧТО НАРЕЧИЕ «СЕЙЧАС». Польское zaraz «сейчас, сразу» — одно из самых частых слов языка, и форма kilka zaraz «несколько эпидемий» выглядит как оно. Различает только синтаксис: после числительного или в родительном это существительное, в остальных местах наречие. Ни ударением, ни написанием они не расходятся." }
  - { kind: false-friend, text: "С русской «заразой» совпадение почти полное, включая брань: ty zarazo! звучит ровно как наше «ах ты зараза!». Разница в главном значении: по-польски ZARAZA — это прежде всего эпидемия, мор, чума целого края, а не просто инфекция. Czarna zaraza — «чёрная смерть», чума XIV века. Отдельно стоит ZARAZA ZIEMNIACZANA — картофельная гниль, та самая, что выгнала ирландцев за океан." }
  - { kind: pronunciation, text: "В дательном и предложном падежах z перед окончанием смягчается: ZARAZIE, а не «zaraze». Это общее правило для существительных на -za (koza — kozie, łza — łzie), и русскому уху мягкость здесь непривычна." }
collocations:
  - { pl: "zaraza ziemniaczana", ru: "картофельная гниль" }
  - { pl: "roznosić zarazę", ru: "разносить заразу" }
  - { pl: "czarna zaraza", ru: "чёрная смерть, чума" }
family:
  - { pl: "zarazić", ru: "заразить", relation: root }
  - { pl: "zarażać", ru: "заражать", relation: root }
  - { pl: "raz", ru: "раз; удар", relation: root, id: raz }
etymology: "Приставка za- и корень *razъ «удар», от *raziti «ударять, поражать». Русская «зараза» собрана ровно так же и из тех же частей, и исходно оба слова значили «то, что поражает». Сюда же польские razić «поражать», porazić, obraza «обида» и наши «разить», «поразить», «образ»."
memory: "zaraza — это мор, эпидемия целого края, а не просто инфекция. И запомни родительный множественного: ZARAZ, буква в букву как наречие «сейчас»; отличишь только по месту в предложении."
idioms:
  - { pl: "unikać kogoś jak zarazy", ru: "избегать кого-л. как чумы" }
  - { pl: "ty zarazo!", ru: "ах ты зараза!" }
