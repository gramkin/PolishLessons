# review
id: klepisko
format: 2
lemma: "klepisko"
rank: 5898
pos: noun
pron: { cyr: "клепи́ско" }
senses:
  - id: floor
    ru: "глинобитный (земляной) пол"
    examples:
      - pl: "W chacie zamiast podłogi było klepisko."
        ru: "В хате вместо деревянного пола был глинобитный."
        source: { kind: authored }
      - pl: "Dzieci biegały boso po klepisku."
        ru: "Дети бегали босиком по земляному полу."
        source: { kind: authored }
      - pl: "Stara izba miała gliniane klepisko."
        ru: "В старой горнице был глинобитный пол."
        source: { kind: authored }
  - id: threshing-floor
    ru: "ток, гумно (место для молотьбы)"
    examples:
      - pl: "Na klepisku w stodole młócono zboże cepami."
        ru: "На току в овине молотили зерно цепами."
        source: { kind: authored }
      - pl: "Chłopi zebrali się na klepisku po żniwach."
        ru: "Крестьяне собрались на току после жатвы."
        source: { kind: authored }
notes:
  - { kind: register, text: "Слово старинное и деревенское: о быте прежней деревни, в литературе, этнографии, музеях под открытым небом (SKANSEN). В современном доме такого пола нет." }
  - { kind: usage, text: "Средний род на -ISKO, суффикс места (как BOISKO, LOTNISKO): местный NA KLEPISKU, творительный KLEPISKIEM, родительный множественного KLEPISK." }
  - { kind: pronunciation, text: "L перед E мягкое: «клепи́ско». Ударение на предпоследнем слоге." }
collocations:
  - { pl: "gliniane klepisko", ru: "глинобитный пол" }
  - { pl: "młócić na klepisku", ru: "молотить на току" }
  - { pl: "ubite klepisko", ru: "утрамбованный пол" }
family:
  - { pl: "klepać", ru: "хлопать, отбивать", relation: root }
  - { pl: "klepka", ru: "клёпка, дощечка", relation: root }
synonyms: ["gumno"]
etymology: "От KLEPAĆ «бить, отбивать»: глину для пола утрамбовывали ударами, а на току зерно выбивали цепами. Суффикс -ISKO обозначает место."
memory: "Klepisko — место, где klepią: глину отбили в пол, зерно — цепами."
idioms:
