notes:
  - { kind: false-friend, text: "Корень тот же, что в русском «знак», и оба языка построили от него слово для признака, но разными приставками: польский взял O-, русский ПРИ-. Поэтому OZNAKA это «признак», а не «означение» и не «знак». Рядом стоит глагол OZNACZAĆ «означать» и существительное OZNACZENIE «обозначение», и путать их с OZNAKA легко, потому что разница только в суффиксе. Ещё одно различение, которого русский не делает так строго: OZNAKA это признак в широком смысле, а OBJAW — симптом, слово медицинское. Врач скажет OBJAWY GRYPY «симптомы гриппа», но OZNAKI WIOSNY «признаки весны», и подменять их не следует." }
  - { kind: government, text: "Женский род. Чего признак — родительный: OZNAKA CHOROBY, OZNAKA ŻYCIA, OZNAKA ZMĘCZENIA, OZNAKA SZACUNKU. «Быть признаком чего-то» — творительный при BYĆ: MILCZENIE BYŁO OZNAKĄ ZGODY. Частотное выражение DAWAĆ OZNAKI CZEGOŚ «проявлять признаки чего-то» требует родительного: DAWAŁ OZNAKI ZNIECIERPLIWIENIA. Во множественном слово употребляется не реже, чем в единственном: BEZ OZNAK ŻYCIA «без признаков жизни» — устойчивая формула протоколов и сводок." }
  - { kind: usage, text: "Основа твёрдая, на -KA, и склонение показывает два обычных польских хода. Первый: перед окончанием -E заднее K смягчается в C, отсюда дательный и местный OZNACE, а не OZNAKIE. То же в MATKA и MATCE, RĘKA и RĘCE, PUSZKA и PUSZCE. Второй: родительный множественного — OZNAK, с нулевым окончанием и без вставной гласной, потому что ZN на конце выговаривается легко; сравните PUSZEK, где гласная понадобилась. Так одно и то же окончание -KA ведёт себя по-разному в зависимости от того, какие согласные стоят перед ним." }
  - { kind: pronunciation, text: "Читается «озна́ка», три слога, ударение на предпоследнем. Начальное O не редуцируется: произносится полное «о», а не «а», как было бы в русском безударном слоге. Это общее свойство польского, и именно на нём чаще всего слышен русский акцент. Сочетание ZN звучит слитно. В форме OZNACE сочетание CE даёт «це»: «озна́це». В родительном множественного OZNAK слогов два, ударение на первом: «о́знак»." }
