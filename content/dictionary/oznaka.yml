etymology: "От ZNAK, из праславянского *znakъ, того же корня, что русский «знак», «знать», «знамя», и с приставкой O-, означающей здесь «вокруг, при», то есть то, что сопутствует. Русский для той же мысли выбрал приставку ПРИ-: «признак» — то, что при знаке, при вещи. Значения совпали, а приставки разошлись, и это типично для приставочных образований в двух языках: одно понятие, разные предлоги. Из того же гнезда польский построил OZNACZAĆ «означать», OZNACZENIE «обозначение», ZNACZEK «марка» и ZNACZYĆ «значить» — последнее совпадает с русским полностью. Суффикс -KA здесь образует отглагольное имя результата, как в WSKAZÓWKA от WSKAZAĆ."
memory: "Тот же корень, что «знак», но приставка другая: польский O-, русский ПРИ-. Oznaka — «признак». Не путать с oznaczać «означать» и oznaczenie «обозначение». И польский различает строже, чем русский: oznaka — признак вообще, objaw — медицинский симптом. В дательном и местном k→c: oznace, как matka/matce. Родительный множественного — oznak, без вставной гласной, в отличие от puszek."
