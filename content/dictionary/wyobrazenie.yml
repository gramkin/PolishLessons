# review
id: wyobrazenie
format: 2
lemma: "wyobrażenie"
rank: 5874
pos: noun
pron: { cyr: "выображе́не" }
senses:
  - id: notion
    ru: "представление (о чём-то), понятие"
    examples:
      - { pl: "Masz dziwne wyobrażenie o szczęściu.", ru: "У тебя странное представление о счастье.", source: { kind: tatoeba, id: 6304064 } }
      - { pl: "Każdy z nas ma swoje osobiste wyobrażenie miłości.", ru: "У каждого из нас своё личное представление о любви.", source: { kind: translated, id: 6304069 } }
      - { pl: "Moje wyobrażenie na jego temat nie pokrywało się z rzeczywistością.", ru: "Моё представление о нём не совпадало с действительностью.", source: { kind: translated, id: 6304062 } }
      - { pl: "Ten widok przechodzi wszelkie wyobrażenie.", ru: "Этот вид превосходит всякое воображение.", source: { kind: authored } }
  - id: image
    ru: "изображение"
    note: "книжн."
    examples:
      - { pl: "Obraz przedstawia wyobrażenie bogini płodności.", ru: "На картине — изображение богини плодородия.", source: { kind: translated, id: 6304079 } }
      - { pl: "Na monecie widnieje wyobrażenie orła.", ru: "На монете виднеется изображение орла.", source: { kind: authored } }
notes:
  - { kind: false-friend, text: "WYOBRAŻENIE — «представление (о чём-то)», а не «воображение». Воображение как способность — WYOBRAŹNIA. Разница в одной букве: Ż или Ź." }
  - { kind: government, text: "WYOBRAŻENIE O CZYMŚ — представление о чём-то (O + предложный): WYOBRAŻENIE O PRACY. Реже с родительным без предлога: WYOBRAŻENIE MIŁOŚCI." }
  - { kind: usage, text: "Это и отглагольное существительное от WYOBRAZIĆ SOBIE: WYOBRAŻENIE SOBIE CZEGOŚ — «то, что ты себе это представил». «Понятия не имею» — чаще NIE MAM POJĘCIA, чем NIE MAM WYOBRAŻENIA." }
collocations:
  - { pl: "mieć wyobrażenie o czymś", ru: "иметь представление о чём-то" }
  - { pl: "błędne wyobrażenie", ru: "ошибочное представление" }
  - { pl: "zgodnie z wyobrażeniem", ru: "в соответствии с представлением" }
family:
  - { pl: "wyobrazić", ru: "представить", relation: root, id: wyobrazic }
  - { pl: "wyobrażać", ru: "представлять", relation: root, id: wyobrazac }
  - { pl: "wyobraźnia", ru: "воображение", relation: root, id: wyobraznia }
  - { pl: "obraz", ru: "картина, образ", relation: root, id: obraz }
etymology: "Отглагольное существительное от WYOBRAZIĆ «представить», а то — от OBRAZ «образ, картина». Русское «вообразить» построено так же."
memory: "Wyobrażenie — «представление», а воображение — wyobraźnia. Ż или Ź решает."
idioms:
  - { pl: "przechodzić wszelkie wyobrażenie", ru: "превосходить всякое воображение" }
formExamples:
