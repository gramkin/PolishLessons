notes:
  - { kind: register, text: "РАЗГОВОРНОЕ СЛОВО, И ТОЛЬКО ВО МНОЖЕСТВЕННОМ ЧИСЛЕ. Gary в значении «грязная посуда» живёт лишь в разговоре и лишь во множественном — отсюда и пять форм вместо десяти: единственного числа у этого значения просто нет. Самая частая фраза — zmywać gary «мыть посуду». В нейтральной речи скажут naczynia, в официальной — zastawa." }
  - { kind: false-friend, text: "Прозрачного русского родственника нет: «посуда» и «кастрюля» идут от других корней. Зато дальняя родня отыщется. Gar и garnek «горшок, кастрюля» восходят к корню со значением «горн, печь для обжига» — тому же, что в русских «горн», «горнило» и «гончар», где последнее буквально значит «горшечник»." }
  - { kind: usage, text: "Единственное число gar существует, но это отдельное слово со своим значением: большая кастрюля, котёл. Множественное gary в разговоре почти всегда значит именно немытую посуду целиком, а не несколько кастрюль по отдельности." }
collocations:
  - { pl: "zmywać gary", ru: "мыть посуду" }
  - { pl: "brudne gary", ru: "грязная посуда" }
  - { pl: "gary w zlewie", ru: "посуда в раковине" }
family:
  - { pl: "garnek", ru: "кастрюля, горшок", relation: root }
  - { pl: "garnuszek", ru: "кружечка", relation: derived }
etymology: "От garnek «горшок, кастрюля», восходящего к праславянскому корню со значением «горн, печь для обжига». От того же корня русские «горн», «горнило» и «гончар» — последнее буквально «горшечник». Отсюда garnek, garnuszek «кружечка» и разговорное gary."
memory: "gary — это разговорное «грязная посуда», и только во множественном числе: zmywać gary «мыть посуду». Слово родня горшку, garnek, а через него — русским «горну» и «гончару»."
idioms:
  - { pl: "zmywać gary", ru: "мыть посуду" }
  - { pl: "zostawić gary na jutro", ru: "оставить посуду на завтра" }
