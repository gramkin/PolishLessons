# review
id: trup
format: 2
lemma: "trup"
rank: 1626
pos: noun
pron: { cyr: "труп" }
senses:
  - id: corpse
    ru: "труп, мертвец"
    examples:
      - pl: "Przeraziła się na widok trupa."
        ru: "Она ужаснулась при виде трупа."
        source: { kind: translated, id: 739331 }
      - pl: "Na pustej plaży policjanci znaleźli trupa."
        ru: "На пустом пляже полицейские нашли труп."
        source: { kind: translated, id: 2808997 }
      - pl: "Gunter wyglądał i brzmiał jak żywy trup."
        ru: "Гунтер выглядел и звучал как живой труп."
        source: { kind: translated, id: 13350579 }
  - id: over-my-dead-body
    ru: "po moim trupie — только через мой труп"
    examples:
      - pl: "Po moim trupie!"
        ru: "Только через мой труп!"
        source: { kind: tatoeba, id: 735802 }
      - pl: "Po moim trupie."
        ru: "Только через мой труп."
        source: { kind: translated, id: 924607 }
notes:
  - { kind: usage, text: "po moim trupie — «только через мой труп», точное соответствие русскому обороту." }
  - { kind: false-friend, text: "zalany w trupa значит «пьяный в стельку», а не «залитый трупом»: здесь trup — просто мера степени. Оборот разговорный." }
  - { kind: usage, text: "Устойчиво: paść trupem «упасть замертво», iść po trupach «идти по трупам»." }
  - { kind: usage, text: "Нейтральное слово для тела умершего — zwłoki; trup звучит грубее и разговорнее." }
collocations:
  - { pl: "po moim trupie", ru: "только через мой труп" }
  - { pl: "paść trupem", ru: "упасть замертво" }
  - { pl: "zalany w trupa", ru: "пьяный в стельку" }
etymology: "Праславянское *trupъ — то же слово, что русское «труп», с тем же значением. Исходно корень значил «пень, обрубок», отсюда идея неподвижного тела."
memory: "trup = «труп», прямой родственник русского слова. Главный оборот — po moim trupie «только через мой труп». Осторожно: zalany w trupa значит «пьяный в стельку», а не что-то про труп."
idioms:
