notes:
  - { kind: usage, text: "НАЗВАНИЕ СТРАНЫ ВО МНОЖЕСТВЕННОМ ЧИСЛЕ: CHINY. Говорят jadę do Chin «еду в Китай», mieszkam w Chinach «живу в Китае». Это тот же разряд, что Niemcy, Włochy, Węgry, Czechy: по-русски страна в единственном, по-польски во множественном, и падежи приходится строить заново." }
  - { kind: pronunciation, text: "Три слога, ударение на предпоследнем: CHIŃ-ski. Ch читается как х, ń как нь: «хи́ньски». Мужско-личное множественное chińscy произносится «хи́ньсцы». Наречие строится особо: не chińsko, а po chińsku." }
  - { kind: false-friend, text: "Значение совпадает с русским полностью. Разойтись может сочетаемость: chińszczyzna значит и «китайская кухня», и, переносно, «тарабарщина» — примерно как русское «китайская грамота». Оборот to dla mnie chińszczyzna значит «для меня это китайская грамота»." }
  - { kind: register, text: "Степеней сравнения нет: прилагательное относительное, как niemiecki, narodowy и wojenny, отсюда одиннадцать форм. Нейтрально во всех регистрах." }
collocations:
  - { pl: "język chiński", ru: "китайский язык" }
  - { pl: "po chińsku", ru: "по-китайски" }
  - { pl: "chiński mur", ru: "китайская стена" }
family:
  - { pl: "Chiny", ru: "Китай", relation: root }
  - { pl: "Chińczyk", ru: "китаец", relation: derived }
  - { pl: "chińszczyzna", ru: "китайская кухня; тарабарщина", relation: derived }
etymology: "От Chiny, а то — через западные языки от санскритского Cīna, названия, восходящего к династии Цинь. В русский слово пришло другим путём, через тюркское посредство, поэтому «Китай» и Chiny не похожи вовсе: русское название связано с народом киданей. Два языка назвали одну страну по разным соседям."
memory: "chiński — «китайский». Запомнить надо страну: Chiny во МНОЖЕСТВЕННОМ числе, do Chin, w Chinach — как Niemcy и Włochy. А само название не похоже на русское: «Китай» от киданей, Chiny от династии Цинь."
idioms:
  - { pl: "po chińsku", ru: "по-китайски" }
  - { pl: "to dla mnie chińszczyzna", ru: "для меня это китайская грамота" }
