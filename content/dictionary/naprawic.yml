# review
id: naprawic
format: 2
lemma: "naprawić"
rank: 857
pos: verb
aspect: perf
pron: { cyr: "напра́виць" }
senses:
  - id: repair
    ru: "починить, отремонтировать"
    examples:
      - pl: "Nie sądzę, by ktokolwiek potrafił naprawić ten zegarek."
        ru: "Я не думал, что хоть кто-то сможет починить эти часы."
        source: { kind: tatoeba, id: 1353245 }
      - pl: "Napraw to."
        ru: "Почини это."
        source: { kind: translated, id: 5651996 }
      - pl: "Napraw zegar."
        ru: "Почини часы."
        source: { kind: translated, id: 10606662 }
  - id: put-right
    ru: "исправить (ошибку, положение)"
    examples:
      - pl: "Musimy naprawić swoje błędy."
        ru: "Нам надо исправить свои ошибки."
        source: { kind: tatoeba, id: 10768376 }
      - pl: "Naprawię to."
        ru: "Я это исправлю."
        source: { kind: translated, id: 4359916 }
      - pl: "Trzeba naprawić szkody."
        ru: "Надо возместить ущерб."
        source: { kind: authored }
  - id: repaired
    ru: "naprawiony — починенный, исправленный"
    examples:
      - pl: "Usterka została naprawiona."
        ru: "Неисправность была устранена."
        source: { kind: tatoeba, id: 6207847 }
      - pl: "Fontanna jest już naprawiona."
        ru: "Фонтан уже починили."
        source: { kind: tatoeba, id: 6207848 }
      - pl: "Jego samochód właśnie został naprawiony."
        ru: "Его машину только что починили."
        source: { kind: translated, id: 359241 }
notes:
  - { kind: government, text: "naprawić coś «починить что-то» — винительный падеж: naprawić zegar, naprawić samochód." }
  - { kind: usage, text: "Несовершенный вид — naprawiać. Существительное «ремонт» — naprawa (не naprawienie): oddać do naprawy «отдать в ремонт», warsztat naprawczy «ремонтная мастерская»." }
  - { kind: usage, text: "Глагол покрывает и «починить», и «исправить»: naprawić błąd «исправить ошибку», naprawić szkodę «возместить ущерб», naprawić krzywdę «загладить обиду»." }
  - { kind: usage, text: "Корень тот же, что в prawy «правый» и poprawić «поправить»: na + prawić значит буквально «сделать правильным»." }
collocations:
  - { pl: "naprawić błąd", ru: "исправить ошибку" }
  - { pl: "naprawić samochód", ru: "починить машину" }
  - { pl: "oddać do naprawy", ru: "отдать в ремонт" }
  - { pl: "naprawić szkodę", ru: "возместить ущерб" }
family:
  - { pl: "naprawiać", ru: "чинить, исправлять", relation: aspect }
  - { pl: "naprawa", ru: "ремонт", relation: derived }
  - { pl: "poprawić", ru: "поправить", relation: derived }
  - { pl: "prawy", ru: "правый", relation: root }
etymology: "Из na- + prawić, от prawy «правый, правильный» — буквально «сделать правильным». Русское «исправить» и «поправить» собраны тем же способом от того же корня."
memory: "naprawić — и «починить», и «исправить». Внутри сидит prawy «правый»: сделать вещь снова правильной. Существительное «ремонт» — naprawa, а не naprawienie: oddać do naprawy «отдать в ремонт». Несовершенный вид — naprawiać."
idioms:
  - { pl: "naprawić błąd", ru: "исправить ошибку" }
  - { pl: "oddać do naprawy", ru: "отдать в ремонт" }
  - { pl: "naprawić szkodę", ru: "возместить ущерб" }
