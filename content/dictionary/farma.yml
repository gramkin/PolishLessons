notes:
  - { kind: false-friend, text: "ПОХОЖЕ НА «ФАРМАЦИЮ», НО РОДСТВА НЕТ. Farma пришла из английского farm, а farmacja, farmaceuta, farmaceutyczny — из греческого pharmakon «лекарство, зелье». Два разных корня, случайно совпавших в первых пяти буквах. Аптекарь это farmaceuta, а фермер — farmer." }
  - { kind: usage, text: "Слово ощущается заимствованным и чаще обозначает хозяйство специализированное или заграничное: farma drobiu, farma rybna, farma wiatrowa, farma w Teksasie. Обычное польское крестьянское хозяйство — gospodarstwo, а его хозяин — rolnik или gospodarz, не farmer." }
  - { kind: pronunciation, text: "Два слога, ударение на первом: FAR-ma. В дательном и предложном m смягчается: na farmie — «на фа́рме». Тот же ряд, что в jama — w jamie, mama — o mamie." }
  - { kind: register, text: "Звательный падеж farmo в живой речи почти не встречается: у неодушевлённых существительных он остаётся книжным и годится только для обращения в стихах, в письме, в прощании с местом. В обычном разговоре вместо него говорят именительный." }
collocations:
  - { pl: "farma drobiu", ru: "птицеферма" }
  - { pl: "pracować na farmie", ru: "работать на ферме" }
  - { pl: "farma wiatrowa", ru: "ветряная электростанция" }
family:
  - { pl: "farmer", ru: "фермер", relation: derived }
  - { pl: "gospodarstwo", ru: "хозяйство", relation: root }
  - { pl: "rolnik", ru: "земледелец, фермер", relation: derived }
etymology: "Из английского farm, а то — из старофранцузского ferme «аренда, арендованная земля», от латинского firma «твёрдый договор». Через аренду слово и пришло к значению хозяйства. В русский «ферма» попала тем же путём и в то же время. С farmacja, несмотря на вид, общего нет ничего."
memory: "farma — «ферма», и слово это в польском заимствованное: обычное крестьянское хозяйство называется gospodarstwo. На farmacja похоже только по виду: farma из английского, farmacja из греческого. Предложный смягчает m: na farmie."
idioms:
  - { pl: "farma drobiu", ru: "птицеферма" }
  - { pl: "farma wiatrowa", ru: "ветряная электростанция" }
