# review
id: sypiac
format: 2
lemma: "sypiać"
rank: 2189
pos: verb
aspect: imperf
aspectPair: spac
pron: { cyr: "сы́пяць" }
senses:
  - id: sleep-habitually
    ru: "спать (обычно, регулярно)"
    examples:
      - pl: "Marnie sypiam."
        ru: "Я плохо сплю."
        source: { kind: translated, id: 730418 }
      - pl: "Tom zwykle sypia w tym pokoju."
        ru: "Том обычно спит в этой комнате."
        source: { kind: translated, id: 3985865 }
      - pl: "Prawie nigdy nie sypiam bez poduszki."
        ru: "Я почти никогда не сплю без подушки."
        source: { kind: translated, id: 9684296 }
  - id: get-sleep
    ru: "высыпаться, спать помногу"
    examples:
      - pl: "Może za mało pan sypia."
        ru: "Может, вы слишком мало спите."
        source: { kind: translated, id: 8178495 }
      - pl: "Nie sypiałem ostatnio zbyt dużo."
        ru: "Я в последнее время мало сплю."
        source: { kind: translated, id: 4828184 }
notes:
  - { kind: usage, text: "Многократный глагол: не «спать сейчас», а «спать обычно, иметь привычку спать». Spać — спать вообще, sypiać — спать регулярно." }
  - { kind: government, text: "Непереходный. Частотные наречия рядом: marnie sypiam «я плохо сплю», za mało sypiam «я мало сплю»." }
  - { kind: false-friend, text: "Не путайте с sypać «сыпать» — разные глаголы, близкие по звучанию. sypiać от spać «спать»." }
  - { kind: usage, text: "В русском такой пары нет: «сыпать» и «спать» различаются, а многократности «спать регулярно» отдельным глаголом русский не выражает." }
collocations:
  - { pl: "marnie sypiać", ru: "плохо спать" }
  - { pl: "za mało sypiać", ru: "мало спать" }
etymology: "Многократное от spać «спать», праславянское *sъpati; ср. русское «спать», «усыпить»."
memory: "sypiać — «спать регулярно, иметь привычку спать», многократное к spać. Русский такой пары не знает. И не путайте с sypać «сыпать»."
idioms:
  - { pl: "marnie sypiać", ru: "плохо спать" }
