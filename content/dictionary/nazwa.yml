# review
id: nazwa
format: 2
lemma: "nazwa"
rank: 1824
pos: noun
pron: { cyr: "на́зва" }
senses:
  - id: name-of-thing
    ru: "название"
    examples:
      - pl: "Nazwa mówi sama za siebie."
        ru: "Название говорит само за себя."
        source: { kind: tatoeba, id: 12624982 }
      - pl: "Nazwa tego miasta to Arras."
        ru: "Название этого города — Аррас."
        source: { kind: translated, id: 10468073 }
      - pl: "Nazwa pochodzi ze starożytności."
        ru: "Название происходит из древности."
        source: { kind: translated, id: 2278848 }
  - id: give-name
    ru: "название (дать, знать, изменить)"
    examples:
      - pl: "Znam nazwę tego zwierzęcia."
        ru: "Я знаю название этого животного."
        source: { kind: translated, id: 352189 }
      - pl: "Musisz zmienić nazwę pliku."
        ru: "Тебе нужно изменить название файла."
        source: { kind: translated, id: 5930859 }
      - pl: "Powiedz mi nazwę dziewiątego miesiąca."
        ru: "Скажи мне название девятого месяца."
        source: { kind: tatoeba, id: 1550600 }
notes:
  - { kind: false-friend, text: "Главное различие: nazwa — название вещи, города, фирмы; имя человека — imię, а фамилия — nazwisko. Русское «название» и «имя» делятся так же, но польское nazwisko легко спутать с nazwa." }
  - { kind: government, text: "Название чего-то — nazwa czegoś (родительный падеж): nazwa miasta, nazwa pliku. Под названием — pod nazwą (творительный)." }
  - { kind: usage, text: "nazwa użytkownika — «имя пользователя», стандартный компьютерный термин." }
  - { kind: usage, text: "Глагол — nazywać «называть»; nadać nazwę значит «дать название»." }
collocations:
  - { pl: "nazwa miasta", ru: "название города" }
  - { pl: "nazwa użytkownika", ru: "имя пользователя" }
  - { pl: "pod nazwą", ru: "под названием" }
family:
  - { pl: "nazywać", ru: "называть", relation: root, id: nazywac }
  - { pl: "nazwisko", ru: "фамилия", relation: root, id: nazwisko }
  - { pl: "imię", ru: "имя", relation: root, id: imie }
etymology: "От nazywać «называть», того же корня, что русское «название» и «звать». Слова построены одинаково."
memory: "nazwa — «название» вещи, города, файла. Имя человека — imię, фамилия — nazwisko: три разных слова там, где русский обходится двумя."
idioms:
  - { pl: "nazwa użytkownika", ru: "имя пользователя" }
  - { pl: "pod nazwą", ru: "под названием" }
  - { pl: "nazwa własna", ru: "имя собственное" }
