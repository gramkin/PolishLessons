pos: noun
pron: { cyr: "шы́пка" }
senses:
  - id: pane
    ru: "стёклышко, оконное стекло (небольшое)"
    examples:
      - pl: "Piłka wybiła szybkę w oknie."
        ru: "Мяч выбил стекло в окне."
        source: { kind: authored }
      - pl: "Szybka w drzwiach jest pęknięta."
        ru: "Стекло в двери треснуло."
        source: { kind: authored }
      - pl: "Wstawił nową szybkę."
        ru: "Он вставил новое стекло."
        source: { kind: authored }
  - id: screen-glass
    ru: "стекло (часов, телефона, маски)"
    examples:
      - pl: "Pękła mi szybka w telefonie."
        ru: "У меня треснуло стекло на телефоне."
        source: { kind: authored }
      - pl: "Szybka zegarka się porysowała."
        ru: "Стекло часов поцарапалось."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "SZYBKA — существительное «стёклышко», уменьшительное от SZYBA «оконное стекло». Совпадает по написанию с прилагательным SZYBKA «быстрая» (женский род от SZYBKI). Различает их только контекст: SZYBKA JAZDA «быстрая езда», но PĘKNIĘTA SZYBKA «треснувшее стекло»." }
  - { kind: usage, text: "Женский род на -KA. Дательный и предложный — SZYBCE: K чередуется с C. Родительный множественного — SZYBEK. Звательная форма SZYBKO совпадает с наречием «быстро» и в карточку не включена." }
  - { kind: government, text: "Чья, от чего — родительный или W с предложным: SZYBKA OKULARÓW, SZYBKA W DRZWIACH. Материал — Z с родительным: SZYBKA ZE SZKŁA HARTOWANEGO." }
  - { kind: pronunciation, text: "Читается «шы́пка»: B перед K оглушается в «п». Ударение на первом слоге. SZYBCE — «шы́пцэ»." }
  - { kind: register, text: "Нейтральное бытовое слово. Большое оконное стекло — SZYBA." }
collocations:
  - { pl: "szybka w oknie", ru: "стекло в окне" }
  - { pl: "pęknięta szybka", ru: "треснувшее стекло" }
  - { pl: "szybka ochronna", ru: "защитное стекло" }
family:
  - { pl: "szyba", ru: "оконное стекло", relation: root, id: szyba }
  - { pl: "szkło", ru: "стекло (материал)", relation: root, id: szklo }
  - { pl: "okno", ru: "окно", relation: root, id: okno }
etymology: "Уменьшительное от SZYBA, которое польский взял из немецкого SCHEIBE «диск, стекло». Русского родственного слова нет."
memory: "Szybka — стёклышко, от szyba: pękła mi szybka w telefonie. Не путать с прилагательным szybka «быстрая»."
idioms:
  - { pl: "za szybką", ru: "за стеклом, под стеклом" }
formExamplesSkip:
