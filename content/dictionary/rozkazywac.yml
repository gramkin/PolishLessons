# review
id: rozkazywac
format: 2
lemma: "rozkazywać"
rank: 3805
pos: verb
pron: { cyr: "розказы́ваць" }
senses:
  - id: order
    ru: "приказывать, командовать"
    examples:
      - pl: "Nie rozkazuj mi!"
        ru: "Не командуй мной!"
        source: { kind: authored }
      - pl: "Generał rozkazuje żołnierzom."
        ru: "Генерал отдаёт приказы солдатам."
        source: { kind: authored }
      - pl: "Lubi rozkazywać innym."
        ru: "Он любит командовать другими."
        source: { kind: authored }
  - id: boss-around
    ru: "распоряжаться, помыкать"
    examples:
      - pl: "W domu rozkazuje żona."
        ru: "Дома распоряжается жена."
        source: { kind: authored }
      - pl: "Starszy brat ciągle mi rozkazywał."
        ru: "Старший брат вечно мной помыкал."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ROZKAZYWAĆ — «приказывать», а не «рассказывать»! «Рассказывать» по-польски — OPOWIADAĆ. Это одна из самых опасных пар: корень KAZAĆ «велеть»; русское «рассказывать» восходит к тому же *kazati, но значение у него ушло к «говорить». ROZKAZ — «приказ»." }
  - { kind: usage, text: "Несовершенный вид; совершенный — ROZKAZAĆ. Спряжение на -UJĘ: ROZKAZUJĘ, ROZKAZUJESZ, ROZKAZUJĄ. Частое NIE ROZKAZUJ MI! «не командуй мной!». Форма ROZKAZUJMY в карточку не включена." }
  - { kind: government, text: "Кому — дательный: ROZKAZYWAĆ ŻOŁNIERZOM. Что сделать — инфинитив: ROZKAZAŁ IM ODEJŚĆ. По-русски «мной» — творительный («командовать мной»), по-польски — дательный: NIE ROZKAZUJ MI." }
  - { kind: pronunciation, text: "Читается «розказы́ваць»: Z — «з», Y — «ы». Ударение на предпоследнем слоге. ROZKAZUJĘ — «розказу́е»." }
  - { kind: register, text: "Нейтрально-книжное в армии и истории; в быту — с оттенком упрёка: ON CIĄGLE ROZKAZUJE «он всё время командует». Мягче — POLECAĆ, KAZAĆ." }
collocations:
  - { pl: "rozkazywać komuś", ru: "командовать кем-то" }
  - { pl: "nie rozkazuj mi", ru: "не командуй мной" }
  - { pl: "lubić rozkazywać", ru: "любить командовать" }
family:
  - { pl: "rozkaz", ru: "приказ", relation: derived, id: rozkaz }
  - { pl: "kazać", ru: "велеть", relation: root, id: kazac }
  - { pl: "polecić", ru: "поручить, велеть", relation: root, id: polecic }
etymology: "Приставка ROZ- плюс KAZYWAĆ, многократное от KAZAĆ «велеть», праславянское *kazati «показывать, указывать». Русское «приказывать», «указ» — того же корня, а «рассказывать» тоже от *kazati, но в русском значение ушло в сторону «говорить»."
memory: "Rozkazywać — приказывать, а не рассказывать! Рассказывать — opowiadać. Nie rozkazuj mi — не командуй мной, с дательным."
idioms:
  - { pl: "nie rozkazuj mi", ru: "не командуй мной" }
formExamplesSkip:
  - { form: "rozkazujmy", reason: "повелительное «давайте командовать» не употребляется" }
