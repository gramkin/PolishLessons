notes:
  - { kind: false-friend, text: "PRZESADA это «преувеличение», а вовсе не «пересадка». Пересадка в транспорте по-польски PRZESIADKA, пересадка органа PRZESZCZEP. Зато глагол PRZESADZIĆ держит оба смысла сразу: и «пересадить растение», и «переборщить, хватить через край». Образ общий и наглядный: перенести за положенное место. Русское «пересолить» устроено похоже, только от соли." }
  - { kind: usage, text: "Десять форм, женский род. В дательном и местном падеже единственного числа D переходит в DZI: PRZESADA, но W PRZESADZIE. Это то же чередование, что в WODA — W WODZIE. Множественное число PRZESADY употребляют редко и обычно о конкретных преувеличениях в чьём-то рассказе. Чаще всего слово живёт в двух готовых оборотах: BEZ PRZESADY и POPAŚĆ W PRZESADĘ." }
  - { kind: government, text: "Впасть в преувеличение — POPAŚĆ W PRZESADĘ, предлог W с винительным. Без преувеличения — BEZ PRZESADY, предлог BEZ с родительным, и этот оборот работает ещё и как реплика: BEZ PRZESADY! значит «да ладно, не преувеличивай». Преувеличение в чём-либо — PRZESADA W CZYMŚ, предлог W с местным падежом: PRZESADA W JEDZENIU." }
  - { kind: pronunciation, text: "Читается «пшеса́да», три слога, ударение на втором. Сочетание PRZ даёт «пш», а не «пр» и не «прж»: это одно из самых характерных польских сочетаний, и оно же в PRZEPRASZAM и PRZYJACIEL. Буква S между гласными остаётся глухой «с». В форме PRZESADZIE сочетание DZI даёт слитное мягкое «дзь», и слово звучит «пшеса́дзе»." }
  - { kind: register, text: "Слово нейтральное и очень частое в разговоре, прежде всего как готовая реплика: BEZ PRZESADY! произносят, когда собеседник сгущает краски, и это ближе к русскому «ну не преувеличивай» или «да брось». Остальные обороты книжнее: POPAŚĆ W PRZESADĘ «впасть в преувеличение», ODROBINA PRZESADY «капля преувеличения». В официальном тексте вместо него скажут WYOLBRZYMIENIE." }
collocations:
  - { pl: "bez przesady", ru: "без преувеличения; да брось" }
