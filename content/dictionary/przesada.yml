  - { pl: "przesadzić", ru: "преувеличить; пересадить", relation: root, id: przesadzic }
  - { pl: "sadzić", ru: "сажать", relation: root }
  - { pl: "przesadny", ru: "преувеличенный, чрезмерный", relation: derived }
etymology: "От PRZESADZIĆ, из приставки PRZE- «пере-» и SADZIĆ «сажать», от праславянского корня, давшего русские «садить», «сажать», «сад». Исходный смысл прямой: пересадить растение дальше, чем следовало. Отсюда переносный: перенести что-либо за меру, перехватить через край. Русский от того же корня переносного значения не вывел и взял для него слово «преувеличить», от «великого». Поэтому родство корней есть, а соответствие слов разошлось."
memory: "Не «пересадка», а «преувеличение». Пересадка в транспорте это przesiadka, пересадка органа przeszczep. Зато глагол przesadzić значит и «пересадить растение», и «переборщить»: образ один, перенести за положенное место. Главная реплика разговора: bez przesady! то есть «да брось, не преувеличивай». Читается «пшеса́да», где prz даёт «пш». В местном падеже d смягчается: w przesadzie."
idioms:
  - { pl: "bez przesady", ru: "без преувеличения; да брось, не преувеличивай" }
