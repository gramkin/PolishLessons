format: 2
lemma: "zniechęcać"
rank: 2404
pos: verb
aspect: imperf
pron: { cyr: "зьнехэ́нцаць" }
senses:
  - id: discourage-from
    ru: "отбивать охоту, отговаривать"
    examples:
      - pl: "Nie zniechęcaj mnie."
        ru: "Не отбивай у меня охоту."
        source: { kind: translated, id: 593435 }
      - pl: "Proszę powstrzymać się od wysyłania komentarzy mogących zniechęcać do odwiedzin tej strony."
        ru: "Просим воздержаться от комментариев, способных отбить охоту заходить на эту страницу."
        source: { kind: translated, id: 676721 }
      - pl: "Nie zniechęcam nikogo do nauki."
        ru: "Я никого не отговариваю от учёбы."
        source: { kind: authored }
  - id: dont-give-up
    ru: "не падать духом (nie zniechęcaj się)"
    examples:
      - pl: "Nie zniechęcaj się."
        ru: "Не падай духом."
        source: { kind: translated, id: 3706397 }
      - pl: "To było bardzo zniechęcające."
        ru: "Это очень обескураживало."
        source: { kind: translated, id: 12360057 }
notes:
  - { kind: government, text: "Отбивать охоту к чему-л. — zniechęcać DO czegoś, с родительным после do. С się — «падать духом»: nie zniechęcaj się «не падай духом»." }
  - { kind: usage, text: "Nie zniechęcaj się! — обычное ободрение, ровно как русское «Не падай духом!»." }
  - { kind: false-friend, text: "Несовершенный вид к zniechęcić; корень chęć «охота». Причастие zniechęcający значит «обескураживающий»: to było zniechęcające." }
  - { kind: usage, text: "Противоположность — zachęcać «побуждать, воодушевлять». Прилагательное zniechęcony имеет отдельную карточку." }
collocations:
  - { pl: "nie zniechęcaj się", ru: "не падай духом" }
  - { pl: "zniechęcać do czegoś", ru: "отбивать охоту к чему-л." }
etymology: "Несовершенный вид к zniechęcić; корень chęć «охота»."
memory: "zniechęcać — «отбивать охоту», do czegoś с родительным. Nie zniechęcaj się! значит «Не падай духом!». Противоположность — zachęcać."
