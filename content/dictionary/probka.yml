notes:
  - { kind: usage, text: "Уменьшительное от próba «проба, попытка»: próbka — это маленькая порция для исследования или показа." }
  - { kind: usage, text: "darmowa próbka — «бесплатный образец», обычное магазинное выражение." }
  - { kind: usage, text: "В медицине и лаборатории: próbka krwi «проба крови», pobrać próbkę «взять пробу»." }
  - { kind: usage, text: "Слово редкое: в корпусе всего пять примеров, и косвенные падежи почти не встречаются." }
collocations:
  - { pl: "darmowa próbka", ru: "бесплатный образец" }
  - { pl: "próbka krwi", ru: "проба крови" }
  - { pl: "pobrać próbkę", ru: "взять пробу" }
etymology: "Уменьшительное от próba «проба, попытка», заимствованного через немецкий из латинского probare «испытывать». Русская «проба» пришла тем же путём, так что слова прямо родственны."
memory: "próbka = «образец, проба», уменьшительное от próba. Главное сочетание — darmowa próbka «бесплатный образец», а в лаборатории — próbka krwi «проба крови»."
idioms:
