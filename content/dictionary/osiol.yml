notes:
  - { kind: false-friend, text: "OSIOŁ — «осёл», и как животное, и как ругательство: тут совпадение полное. Отличается произношение: Ł — «у», поэтому «о́сьоу». Обращение-ругательство — OŚLE!, «ты, осёл!»." }
  - { kind: usage, text: "Одиннадцать живых форм, мужской род, одушевлённое. Беглое O: OSIOŁ, но OSŁA, OSŁY. Дательный двойной — OSŁU и OSŁOWI. Форма OŚLE служит и местным падежом, NA OŚLE, и звательным. Личное множественное OSŁOWIE не даётся: и о людях говорят OSŁY." }
  - { kind: government, text: "Упрямый как осёл — UPARTY JAK OSIOŁ. Ехать на осле — JECHAĆ NA OŚLE, NA с местным. Выставить себя ослом — ZROBIĆ Z SIEBIE OSŁA." }
  - { kind: pronunciation, text: "Читается «о́сьоу», ударение на первом слоге. SIO — «сьо», конечное Ł — краткое «у»." }
collocations:
  - { pl: "uparty jak osioł", ru: "упрямый как осёл" }
  - { pl: "ośla ławka", ru: "последняя парта для отстающих" }
  - { pl: "jechać na ośle", ru: "ехать на осле" }
family:
  - { pl: "osiołek", ru: "ослик", relation: derived }
  - { pl: "oślica", ru: "ослица", relation: derived }
  - { pl: "ośli", ru: "ослиный", relation: derived }
etymology: "Очень давнее заимствование из латыни через германские языки; русское «осёл» — того же происхождения. В польском O чередуется с нулём: OSIOŁ, OSŁA."
memory: "Osioł — осёл, читается «о́сьоу»: osła, osły. Ośle! — ты, осёл! Ośle uszy — загнутые уголки страниц. Uparty jak osioł — упрямый как осёл."
idioms:
  - { pl: "ośle uszy", ru: "загнутые уголки страниц" }
formExamplesSkip:
  - { form: "osłowie", reason: "личное множественное; и о людях говорят OSŁY" }
