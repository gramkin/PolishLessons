        ru: "Добавь растёртые желтки в муку."
        source: { kind: authored }
notes:
  - { kind: usage, text: "По форме это страдательное причастие от UTRZEĆ «натереть, растереть», и в кухне оно так и работает: UTARTY MAK «тёртый мак», UTARTE ŻÓŁTKA Z CUKREM «желтки, растёртые с сахаром». Но чаще слово встречается как обычное прилагательное «устоявшийся, расхожий»: UTARTA OPINIA, UTARTY ZWYCZAJ, UTARTE ZWROTY. Образ тот же, что в русском «протёртый до дыр»: выражение стёрлось от частого употребления." }
  - { kind: false-friend, text: "Русское «тёртый калач» — опытный, бывалый человек, но польское UTARTY о людях не говорят. Опытного человека назовут DOŚWIADCZONY или, разговорно, STARY WYGA. Поэтому мужско-личная форма UTARCI остаётся в таблице без примеров." }
  - { kind: usage, text: "Главный устойчивый оборот — UTARTYM SZLAKIEM, UTARTYMI ŚCIEŻKAMI «проторённым путём»: CHODZIĆ UTARTYMI ŚCIEŻKAMI значит «действовать по шаблону, не искать нового». Степеней сравнения у слова нет, поэтому в таблице одиннадцать клеток, из которых в карточке работают десять." }
