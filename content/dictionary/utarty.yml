family:
  - { pl: "utrzeć", ru: "натереть, растереть", relation: root }
  - { pl: "ucierać", ru: "растирать", relation: root }
  - { pl: "trzeć", ru: "тереть", relation: root }
synonyms: ["konwencjonalny", "uznany", "zwyczajowy"]
etymology: "Причастие от UTRZEĆ «натереть, растереть», а оно от TRZEĆ «тереть», того же корня, что русское «тереть». Значение «устоявшийся» выросло из образа дороги, протёртой множеством ног."
memory: "Utarty — «протёртый»: utrzeć, trzeć, как русское «тереть». Тропа, протёртая ногами, — utarta ścieżka; фраза, протёртая языками, — utarty zwrot. Iść utartym szlakiem — идти проторённым путём."
idioms:
  - { pl: "iść utartym szlakiem", ru: "идти проторённым путём, действовать по шаблону" }
