# review
id: zrazic
format: 2
lemma: "zrazić"
rank: 5571
pos: verb
aspect: perf
pron: { cyr: "зра́зиць" }
senses:
  - id: alienate
    ru: "оттолкнуть, настроить против себя"
    examples:
      - pl: "Tom nie chciał zrazić do siebie Mary."
        ru: "Том не хотел оттолкнуть от себя Мэри."
        source: { kind: translated, id: 6304233 }
      - pl: "Nie chcę nikogo zrazić."
        ru: "Я не хочу никого оттолкнуть."
        source: { kind: authored }
      - pl: "Zraził do siebie cały zespół."
        ru: "Он настроил против себя весь коллектив."
        source: { kind: authored }
  - id: discourage
    ru: "отбить охоту, обескуражить (zrazić się)"
    examples:
      - pl: "Nie zraził się pierwszą porażką."
        ru: "Первая неудача его не обескуражила."
        source: { kind: authored }
      - pl: "Łatwo się zraził."
        ru: "Он легко пал духом."
        source: { kind: authored }
notes:
  - { kind: government, text: "Оттолкнуть кого-л. от себя — zrazić kogoś do siebie: винительный плюс do с родительным. С się значит «разочароваться, пасть духом»." }
  - { kind: usage, text: "Причастие niezrażony «неустрашимый, не обескураженный» встречается чаще самого глагола." }
  - { kind: false-friend, text: "Корень raz «удар», тот же, что в wyrazić «выразить»; ср. русское «разить», «сразить»." }
  - { kind: usage, text: "Несовершенный вид — zrażać." }
collocations:
  - { pl: "zrazić kogoś do siebie", ru: "настроить кого-л. против себя" }
  - { pl: "nie zrazić się", ru: "не пасть духом" }
etymology: "z- + razić «разить», от raz «удар»; ср. русское «сразить», «поразить»."
memory: "zrazić — «оттолкнуть, настроить против себя»: zrazić kogoś do siebie. С się значит «пасть духом». Причастие niezrażony «не обескураженный»."
idioms:
  - { pl: "zrazić kogoś do siebie", ru: "настроить кого-л. против себя" }
