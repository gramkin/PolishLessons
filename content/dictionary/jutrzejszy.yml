notes:
  - { kind: usage, text: "В мужском личном именительном множественного SZ переходит в S: JUTRZEJSI, а не «jutrzejszi». Это чередование работает у прилагательных на -SZY, которых в польском немало, потому что так же кончаются все сравнительные степени: STARSZY даёт STARSI, MŁODSZY — MŁODSI, WIĘKSZY — WIĘKSI. Значит, одно правило покрывает и этот разряд, и половину всех степеней сравнения. В остальных формах SZ сохраняется: JUTRZEJSZA, JUTRZEJSZE, JUTRZEJSZYCH. Само прилагательное относительное и степеней не образует: завтрашнее не бывает более или менее завтрашним." }
  - { kind: false-friend, text: "Прилагательное образовано от наречия JUTRO «завтра», и русского однокоренного соответствия у него нет: «завтрашний» идёт от «завтра», а польское JUTRO связано с корнем, означавшим утро, тем же, что в русской «утре». То есть польский назвал следующий день «утром», а русский «за утром» — отсюда «завтра». Поэтому JUTRO это «завтра», а не «утро»: утро по-польски RANO или RANEK, и это одна из самых частых ошибок. Сюда же POJUTRZE «послезавтра» и WCZORAJSZY «вчерашний», образованное от WCZORAJ тем же суффиксом -EJSZY." }
  - { kind: government, text: "Согласуется с существительным в роде, числе и падеже. Частотные сочетания: JUTRZEJSZY DZIEŃ «завтрашний день», JUTRZEJSZA GAZETA, JUTRZEJSZE SPOTKANIE, JUTRZEJSZY EGZAMIN. Суффикс -EJSZY образует прилагательные от наречий времени, и ряд получается полный: WCZORAJSZY «вчерашний», DZISIEJSZY «сегодняшний», JUTRZEJSZY «завтрашний», TEGOROCZNY «нынешнего года». Эти четыре слова стоит выучить разом, потому что они нужны постоянно, а по виду наречия не угадываются: DZIŚ даёт DZISIEJSZY, а не «dzisiowy»." }
  - { kind: pronunciation, text: "Читается «ютше́йшы», три слога, ударение на предпоследнем. Начальное J даёт «й», так что первый слог звучит «ю». Сочетание TRZ произносится «тш», потому что RZ после глухого T оглушается. Второе сочетание SZ даёт «ш». Конечное -Y это «ы». В мужском личном множественном JUTRZEJSI буква S обычная, и форма звучит «ютше́йси» — разница с JUTRZEJSZY слышна отчётливо, хотя на письме это одна буква." }
