etymology: "От наречия JUTRO «завтра», из праславянского *ju(s)tro «утро»; тот же корень в русском «утро» и в «завтра», которое сложилось из предлога «за» и формы «утра». Польский закрепил слово за следующим днём, русский — за частью суток, и для следующего дня построил приставочное «завтра». Поэтому пара JUTRO и «утро» — расхождение значений при общем корне, и ошибка в ней одна из самых частых: утро по-польски RANO. Суффикс -EJSZY образует прилагательные от наречий времени и места и в этой роли русскому не отвечает ничем регулярным; русский пользуется -ШНИЙ в «вчерашнем» и «сегодняшнем», что по происхождению совсем другое образование. Из того же гнезда идут POJUTRZE «послезавтра» и JUTRZENKA «утренняя заря», где исходное значение корня сохранилось полностью."
memory: "Мужской личный множественного jutrzejsi, с sz→s — и это правило покрывает все сравнительные степени: starszy/starsi, młodszy/młodsi, większy/więksi. Корень тот же, что в «утре», но jutro значит «завтра», а утро — rano; русский построил «завтра» как «за утром». Выучить четвёркой: wczorajszy, dzisiejszy, jutrzejszy, pojutrze. И jutrzenka — «утренняя заря», где смысл корня сохранился."
