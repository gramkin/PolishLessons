# review
id: zapisac
format: 2
lemma: "zapisać"
rank: 1772
pos: verb
aspect: perf
pron: { cyr: "запи́саць" }
senses:
  - id: write-down
    ru: "записать (на бумаге)"
    examples:
      - pl: "Możesz mi to zapisać?"
        ru: "Можешь это мне записать?"
        source: { kind: tatoeba, id: 10695779 }
      - pl: "Zapisał numer telefonu."
        ru: "Он записал номер телефона."
        source: { kind: translated, id: 528468 }
      - pl: "Zapisałem to."
        ru: "Я это записал."
        source: { kind: translated, id: 3865335 }
  - id: enroll-save
    ru: "записаться (куда-либо); сохранить (файл)"
    examples:
      - pl: "Zapisał się do klubu języka angielskiego."
        ru: "Он записался в клуб английского языка."
        source: { kind: translated, id: 365302 }
      - pl: "Musisz zapisać swoją pracę na płycie CD."
        ru: "Ты должен сохранить свою работу на диск CD."
        source: { kind: translated, id: 5932884 }
      - pl: "Jestem zapisany do kardiologa."
        ru: "Я записан к кардиологу."
        source: { kind: tatoeba, id: 12624990 }
notes:
  - { kind: usage, text: "Совершенный вид; несовершенный — zapisywać. Возвратное zapisać się значит «записаться»: zapisała się na kurs." }
  - { kind: government, text: "Записаться на что-то — zapisać się na coś (винительный с na); записаться к кому-то — zapisać się do kogoś." }
  - { kind: usage, text: "В компьютерном смысле zapisać значит «сохранить»: zapisz plik «сохрани файл»." }
  - { kind: false-friend, text: "Слово совпадает с русским по составу: za- плюс pisać «писать». Но «сохранить файл» по-русски не «записать», а именно «сохранить»." }
collocations:
  - { pl: "zapisać numer", ru: "записать номер" }
  - { pl: "zapisać się na kurs", ru: "записаться на курс" }
  - { pl: "zapisz plik", ru: "сохрани файл" }
family:
  - { pl: "zapisywać", ru: "записывать", relation: root }
  - { pl: "pisać", ru: "писать", relation: root, id: pisac }
  - { pl: "napisać", ru: "написать", relation: root, id: napisac }
etymology: "Приставка za- плюс pisać «писать» — точно как русское «за-писать». Совпадает и состав, и значение."
memory: "zapisać — «записать»: zapisz numer «запиши номер». Возвратное zapisać się — «записаться»: zapisała się na kurs. А в компьютере zapisać значит «сохранить»."
idioms:
  - { pl: "zapisać się na kurs", ru: "записаться на курс" }
  - { pl: "zapisz plik", ru: "сохрани файл" }
  - { pl: "zapisać się w historii", ru: "войти в историю" }
