notes:
  - { kind: government, text: "Главная схема: NARAZIĆ KOGOŚ NA COŚ — винительный на лицо и предлог NA с винительным на то, чему подвергают. NARAZIŁ NAS NA KOSZTY значит «подверг нас расходам», и здесь русский берёт дательный без предлога, так что конструкцию приходится перестраивать целиком. Причастие работает так же: BYĆ NARAŻONYM NA COŚ «быть подверженным чему-то». Возвратное NARAZIĆ SIĘ KOMUŚ берёт дательный лица и значит «навлечь на себя чей-то гнев, нарваться»: NARAZIŁEM SIĘ SZEFOWI." }
  - { kind: false-friend, text: "Корень тот же, что в русском «разить», и всё гнездо узнаваемо: RAZIĆ значит «поражать, слепить», PORAZIĆ — «поразить», ZARAZA — «зараза». Но внутри гнезда сидит ловушка в одну букву: OBRAZA значит «обида, оскорбление», а OBRAZ — «картина». Сказать PIĘKNA OBRAZA вместо PIĘKNY OBRAZ значит похвалить оскорбление. Русское «образ» отвечает польскому OBRAZ, а «обида» — польскому OBRAZA, и различать их надо твёрдо." }
  - { kind: usage, text: "Пятьдесят три формы — подпись переходного глагола совершенного вида. В будущем времени работает чередование Z и Ż, причём неровно: первое лицо единственного и третье множественного дают Ż — NARAŻĘ, NARAŻĄ, — а все прочие формы сохраняют мягкое Ź: NARAZISZ, NARAZI, NARAZIMY, NARAZICIE. Та же картина была в WCISNĄĆ с его S и Ś. Видовой партнёр — NARAŻAĆ. Причастие NARAŻONY живёт самостоятельно как прилагательное «подверженный» и встречается чаще самого глагола." }
  - { kind: pronunciation, text: "Читается «нара́зичь», три слога, ударение на предпоследнем. Буква Z перед I даёт мягкое «зь», поэтому середина слова звучит «рази», а не «ражи». Зато в формах с Ż слышно твёрдое «ж»: NARAŻĘ это «нара́жэн», NARAŻONY — «наражо́ны». Эта мена «зь» и «ж» внутри одной парадигмы сбивает с толку, и проговаривать пару NARAZISZ и NARAŻĘ стоит вместе. Конечное Ć мягкое, «чь»." }
  - { kind: register, text: "Слово нейтральное, частое в речи об опасности и ответственности: NARAZIĆ KOGOŚ NA NIEBEZPIECZEŃSTWO, NARAZIĆ ZDROWIE, NARAZIĆ FIRMĘ NA STRATY. Причастие особенно ходко в медицине и статистике: GRUPA NARAŻONA NA ZAKAŻENIE «группа, подверженная заражению». Оборот NARAZIĆ SIĘ KOMUŚ принадлежит живой речи и звучит с оттенком сожаления: NARAZIŁEM SIĘ TEŚCIOWEJ. Есть и NARAŻAĆ ŻYCIE «рисковать жизнью», где русский берёт другой глагол." }
