etymology: "Приставка NA- плюс RAZIĆ, от праславянского *raziti «бить, ударять». Русский сохранил корень широко: «разить», «поражать», «сразить», «заразить», «зараза», и даже счётное «раз» идёт отсюда же, потому что один удар и был одним разом. Польский развил то же гнездо: RAZIĆ «слепить, поражать», PORAZIĆ, OBRAZIĆ «обидеть», OBRAZA «обида», ZARAZA «зараза», RAZ «раз». Значение «подвергнуть» выросло из «подставить под удар», и образ в нём виден до сих пот прямо. Отдельно стоит слово OBRAZ «картина»: оно от того же корня, но через значение «вырезанное, отчеканенное», как русский «образ»."
memory: "Корень тот же, что в «разить»: razić «поражать», zaraza «зараза», и даже «раз» отсюда — один удар и есть один раз. Ловушка в одну букву: obraza значит «обида», а obraz — «картина». Управление надо перестраивать: narazić kogoś na coś, винительный и предлог na, где русский берёт дательный без предлога. В парадигме мена зь и ж: narazisz, но narażę и narażony."
idioms:
  - { pl: "narazić się komuś", ru: "навлечь на себя чей-то гнев, нарваться" }
