# review
id: pojawic
format: 2
lemma: "pojawić"
rank: 642
pos: verb
aspect: perf
pron: { cyr: "поя́виць" }
senses:
  - id: appear
    ru: "pojawić się — появиться"
    note: "Глагол практически всегда идёт с się."
    examples:
      - pl: "Nagle na progu pojawił się mężczyzna."
        ru: "Внезапно в дверях появился человек."
        source: { kind: tatoeba, id: 461130 }
      - pl: "On nagle pojawił się po trzyletniej nieobecności."
        ru: "Он неожиданно появился после трёх лет отсутствия."
        source: { kind: tatoeba, id: 822705 }
      - pl: "Na drzewach pojawiły się liście."
        ru: "На деревьях появились листья."
        source: { kind: translated, id: 13284116 }
  - id: turn-up
    ru: "прийти, объявиться"
    note: "Czekaliśmy długo, ale się nie pojawił."
    examples:
      - pl: "Czekaliśmy długo ale się nie pojawił."
        ru: "Мы долго ждали, но он не появился."
        source: { kind: tatoeba, id: 3481723 }
      - pl: "Czekaliśmy długo ale się nie pojawiła."
        ru: "Мы долго ждали, но она не появилась."
        source: { kind: tatoeba, id: 3481724 }
      - pl: "Pani Jackson się nie pojawiła."
        ru: "Госпожа Джексон не появилась."
        source: { kind: translated, id: 542049 }
  - id: arise
    ru: "возникнуть (о проблемах, явлениях)"
    examples:
      - pl: "Z czasem pojawiły się problemy."
        ru: "Со временем появились проблемы."
        source: { kind: translated, id: 728566 }
      - pl: "Pojawiło się nowe w pełni poprawione wydanie encyklopedii."
        ru: "Появилось новое, полностью исправленное издание энциклопедии."
        source: { kind: tatoeba, id: 2278887 }
      - pl: "Kiedy pojawiło się życie?"
        ru: "Когда появилась жизнь?"
        source: { kind: translated, id: 358769 }
  - id: appearance
    ru: "pojawienie się — появление"
    examples:
      - pl: "Jakie jest prawdopodobieństwo pojawienia się życia na ziemi?"
        ru: "Какова вероятность появления жизни на Земле?"
        source: { kind: tatoeba, id: 1351048 }
      - pl: "Byłem zdziwiony jego nagłym pojawieniem się."
        ru: "Я был удивлен его внезапным появлением."
        source: { kind: tatoeba, id: 1453933 }
      - pl: "Jego nagłe pojawienie zaskoczyło nas wszystkich."
        ru: "Его внезапное появление удивило нас всех."
        source: { kind: translated, id: 7938094 }
notes:
  - { kind: usage, text: "Глагол живёт практически только с się: pojawić się «появиться». Без частицы он почти не употребляется." }
  - { kind: usage, text: "Второе обиходное значение — «прийти, объявиться»: Czekaliśmy długo, ale się nie pojawił «Мы долго ждали, но он так и не пришёл»." }
  - { kind: usage, text: "О явлениях и проблемах значит «возникнуть»: z czasem pojawiły się problemy, na drzewach pojawiły się liście." }
  - { kind: usage, text: "Несовершенный вид — pojawiać się; отглагольное существительное — pojawienie się «появление»." }
collocations:
  - { pl: "pojawić się", ru: "появиться" }
  - { pl: "nie pojawić się", ru: "не прийти" }
  - { pl: "pojawiły się problemy", ru: "возникли проблемы" }
  - { pl: "pojawienie się", ru: "появление" }
family:
  - { pl: "pojawiać się", ru: "появляться", relation: aspect }
  - { pl: "jawny", ru: "явный", relation: root }
  - { pl: "zjawisko", ru: "явление", relation: derived }
etymology: "Приставка po- плюс jawić «являть», от jawny «явный» — то же гнездо, что русские «явиться», «явный» и «наяву»."
memory: "pojawić się — «появиться», и запоминать его надо сразу с się: без частицы глагол почти не живёт. Кроме буквального «появиться» он значит «прийти, объявиться» (Czekaliśmy długo, ale się nie pojawił) и «возникнуть» о явлениях и проблемах (z czasem pojawiły się problemy). Корень тот же, что в русских «явиться» и «явный»."
idioms:
  - { pl: "pojawić się", ru: "появиться" }
  - { pl: "nie pojawić się", ru: "не прийти" }
  - { pl: "pojawiły się problemy", ru: "возникли проблемы" }
