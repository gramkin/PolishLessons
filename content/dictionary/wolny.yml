# review
id: wolny
format: 2
lemma: "wolny"
rank: 361
pos: adj
pron: { cyr: "во́льны" }
senses:
  - id: free
    ru: "свободный"
    examples:
      - pl: "Jestem wolny."
        ru: "Я свободен."
        source: { kind: tatoeba, id: 745270 }
      - pl: "Mamy wolny czas."
        ru: "У нас есть свободное время."
        source: { kind: tatoeba, id: 3656685 }
      - pl: "Tam jest wolne siedzenie."
        ru: "Там есть свободное место."
        source: { kind: tatoeba, id: 12476428 }
  - id: slow
    ru: "медленный"
    note: "Второе значение, которого у русского «вольный» нет: wolniejsze tempo «более медленный темп»."
    examples:
      - pl: "Jego tempo było wolniejsze."
        ru: "Его темп был медленнее."
        source: { kind: translated, id: 6304024 }
      - pl: "Rozwój tego kraju jest wolniejszy niż rozwój Japonii."
        ru: "Развитие этой страны медленнее, чем развитие Японии."
        source: { kind: translated, id: 744147 }
      - pl: "Firefox to najwolniejsza przeglądarka, jakiej używałem."
        ru: "Firefox — самый медленный браузер, каким я пользовался."
        source: { kind: translated, id: 10583986 }
notes:
  - { kind: false-friend, text: "Одно слово значит и «свободный», и «медленный». Wolne miejsce «свободное место», но wolniejsze tempo «более медленный темп». Русское «вольный» покрывает только первое." }
  - { kind: usage, text: "Сравнительная степень чаще всего о скорости: wolniejszy «медленнее». О свободе обычно говорят bardziej wolny или swobodny." }
  - { kind: usage, text: "wolny czas — «свободное время», dzień wolny — «выходной», wolne miejsce — «свободное место»." }
  - { kind: usage, text: "Краткая форма wolen устарела и встречается только в старых текстах." }
collocations:
  - { pl: "wolny czas", ru: "свободное время" }
  - { pl: "wolne miejsce", ru: "свободное место" }
  - { pl: "dzień wolny", ru: "выходной" }
  - { pl: "wolne tempo", ru: "медленный темп" }
etymology: "Праславянское *volьnъ, от *volja «воля» — то же слово, что русское «вольный»; значение «медленный» развилось уже в польском."
memory: "wolny — и «свободный», и «медленный». Wolne miejsce «свободное место», но wolniejsze tempo «более медленный темп». Корень тот же, что в русском «вольный»."
idioms:
  - { pl: "wolny czas", ru: "свободное время" }
  - { pl: "dać wolną rękę", ru: "дать свободу действий" }
  - { pl: "dzień wolny", ru: "выходной день" }
