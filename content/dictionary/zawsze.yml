etymology: "Из za + wsze, где wsze — старая форма праславянского *vьсь «весь»; буквально «за всё время». Русское «всегда» построено от того же корня «весь»."
memory: "zawsze «всегда» — от того же корня, что «весь»: za + wsze. Запомните три связки: na zawsze «навсегда», jak zawsze «как всегда», raz na zawsze «раз и навсегда»."
