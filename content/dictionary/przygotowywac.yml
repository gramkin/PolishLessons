notes:
  - { kind: government, text: "ГОТОВЯТСЯ DO CZEGOŚ — РОДИТЕЛЬНЫЙ, А НЕ ДАТЕЛЬНЫЙ. Русское «готовиться К экзамену» ставит дательный, польское PRZYGOTOWYWAĆ SIĘ DO EGZAMINU — родительный с предлогом do. Так же do matury, do wyjazdu, do zimy. Калька «przygotowywać się ku» или дательный без предлога будут ошибкой. Но есть и второй оборот: PRZYGOTOWYWAĆ SIĘ NA COŚ с винительным, когда речь о том, что может случиться: przygotować się na najgorsze «готовиться к худшему»." }
  - { kind: usage, text: "Инфинитив на -YWAĆ, настоящее на -UJĘ: przygotowywać, но przygotowuję, przygotowujesz, przygotowuje. Тот же класс, что okłamywać — okłamuję. Формы «przygotowywam» нет. Зато само строение вида совпадает с русским: от совершенного PRZYGOTOWAĆ «приготовить» делают несовершенный PRZYGOTOWYWAĆ добавлением -ywa-, ровно как «приготовить — приготавливать»." }
  - { kind: false-friend, text: "Польский делит то, что русский «готовить» держит вместе. GOTOWAĆ — это только про еду и кипяток: gotować zupę «варить суп», gotować wodę «кипятить воду». Во всех остальных смыслах — «готовить доклад», «готовить ученика», «готовить почву» — нужен PRZYGOTOWYWAĆ. Сказать «gotować referat» нельзя." }
collocations:
  - { pl: "przygotowywać się do egzaminu", ru: "готовиться к экзамену" }
  - { pl: "przygotowywać obiad", ru: "готовить обед" }
  - { pl: "przygotowywać grunt", ru: "готовить почву" }
family:
  - { pl: "przygotować", ru: "приготовить, подготовить (сов.)", relation: aspect, id: przygotowac }
  - { pl: "gotowy", ru: "готовый", relation: root, id: gotowy }
  - { pl: "gotować", ru: "варить, кипятить", relation: root, id: gotowac }
etymology: "От gotowy «готовый» через gotować, из праславянского *gotovъ — того же слова, что русское «готовый». Приставка przy- здесь значит «при-, до нужного состояния», а суффикс -ywa- вторично делает глагол несовершенным. Любопытно расхождение смыслов: у нас «готовить» покрыло и кухню, и подготовку, а поляк кухню оставил за gotować, всё остальное отдал przygotowywać."
memory: "przygotowywać, но przygotowuję — суффикс -ywa- в настоящем времени уступает место -uj-. И главное: готовятся DO egzaminu, родительный падеж, а не «к экзамену». А на кухне нужен другой глагол: gotować zupę."
idioms:
  - { pl: "przygotowywać grunt pod coś", ru: "готовить почву для чего-л." }
  - { pl: "przygotowywać się na najgorsze", ru: "готовиться к худшему" }
