# review
id: biedny
format: 2
lemma: "biedny"
rank: 933
pos: adj
pron: { cyr: "бе́дны" }
senses:
  - id: poor
    ru: "бедный, неимущий"
    examples:
      - pl: "On jest biedny."
        ru: "Он беден."
        source: { kind: tatoeba, id: 610660 }
      - pl: "Byłem wówczas bardzo biedny."
        ru: "В то время я был очень беден."
        source: { kind: tatoeba, id: 8666084 }
      - pl: "Jest biedny jak mysz kościelna."
        ru: "Он беден как церковная мышь."
        source: { kind: tatoeba, id: 11111435 }
  - id: pitiable
    ru: "бедный, несчастный (о том, кого жалко)"
    note: "Как и в русском, второе значение — не про деньги, а про сочувствие: biedny kot «бедный котик»."
    examples:
      - pl: "Ten biedny kot był ledwo żywy z głodu."
        ru: "Этот бедный кот был почти мёртв от голода."
        source: { kind: tatoeba, id: 361037 }
      - pl: "Biedna dziewczynka płakała całą noc."
        ru: "Бедная девочка плакала всю ночь."
        source: { kind: authored }
      - pl: "Biedny chłopiec nie miał dokąd pójść."
        ru: "Бедному мальчику некуда было пойти."
        source: { kind: authored }
notes:
  - { kind: usage, text: "biedny совмещает те же два значения, что русское «бедный»: «неимущий» (biedna rodzina) и «несчастный, вызывающий жалость» (biedny kot)." }
  - { kind: false-friend, text: "Существительное bieda — не «беда», а «нищета, нужда»: klepać biedę «бедствовать», cierpieć biedę «терпеть нужду». Русское «беда» будет nieszczęście." }
  - { kind: usage, text: "Степени сравнения правильные: biedny → biedniejszy → najbiedniejszy. Наречие — biednie, глагол biednieć «беднеть»." }
collocations:
  - { pl: "biedny człowiek", ru: "бедняк" }
  - { pl: "biedna rodzina", ru: "бедная семья" }
  - { pl: "biedni i bogaci", ru: "бедные и богатые" }
  - { pl: "klepać biedę", ru: "бедствовать" }
family:
  - { pl: "bieda", ru: "нищета, нужда", relation: derived }
  - { pl: "biednie", ru: "бедно", relation: derived }
  - { pl: "biednieć", ru: "беднеть", relation: derived }
etymology: "Праславянское *bědьnъ, от *běda «нужда, беда» — то же слово, что русское «бедный». Значение «неимущий» выросло из «терпящий нужду»."
memory: "biedny — «бедный» сразу в двух русских смыслах: biedna rodzina «бедная семья» (про деньги) и biedny kot «бедный котик» (про жалость). Ловушка рядом: существительное bieda значит не «беда», а «нищета» — klepać biedę «бедствовать». Сравнение простое: biedniejszy «беднее», najbiedniejszy «самый бедный». Поговорка та же, что у нас: biedny jak mysz kościelna."
idioms:
  - { pl: "biedny jak mysz kościelna", ru: "беден как церковная мышь" }
  - { pl: "biednemu zawsze wiatr w oczy", ru: "бедному всегда ветер в глаза" }
  - { pl: "klepać biedę", ru: "бедствовать" }
