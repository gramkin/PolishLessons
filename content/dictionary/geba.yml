notes:
  - { kind: false-friend, text: "GĘBA и русская «губа» — одно праславянское слово *gǫba, но указывают они на разное. Польское gęba — это рот целиком или всё лицо, грубо; русская «губа» — только край рта. Губа по-польски называется WARGA. Совпадение сохранилось в другом месте: польское gąbka и наша «губка» в значении мочалки — тоже это слово, и тут языки не разошлись." }
  - { kind: register, text: "Слово грубое, и это главное, что нужно о нём знать. Нейтрально о лице говорят TWARZ, о рте — USTA, ласково о детском личике — BUZIA. Gęba годится в сердцах, в шутку между своими или в устойчивых оборотах вроде trzymać gębę na kłódkę. Сказанное всерьёз о собеседнике, оно звучит как «рожа»." }
  - { kind: pronunciation, text: "Родительный множественного имеет две формы: старую GĄB и новую GĘB. В gąb сохранилось древнее чередование ę и ą, то самое, что в ręka — rąk: в форме без окончания гласный переходит в ą. Gęb выровнено по остальной парадигме. Обе формы живые, обе словари признают. Сама ę перед b читается как «эм»: «гэ́мба»." }
collocations:
  - { pl: "dać w gębę", ru: "дать по морде" }
  - { pl: "trzymać gębę na kłódkę", ru: "держать рот на замке" }
  - { pl: "niewyparzona gęba", ru: "язык без костей" }
family:
  - { pl: "gębowy", ru: "ротовой", relation: derived }
  - { pl: "gąbka", ru: "губка, мочалка", relation: root }
  - { pl: "gębaty", ru: "горластый", relation: derived }
etymology: "Из праславянского *gǫba. Исходное значение спорят, но ближе всего «нарост, губчатое тело», откуда и гриб-губка, и край рта. Русский закрепил слово за губой, польский — за ртом и лицом целиком, причём с оттенком грубости. Общим осталось только название мочалки: gąbka и «губка»."
memory: "Это не «губа», а рот или рожа, и слово грубое. Губа будет WARGA, лицо — twarz."
idioms:
