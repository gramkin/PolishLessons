# review
id: powiesic
format: 2
lemma: "powiesić"
rank: 2427
pos: verb
pron: { cyr: "повє́щиць" }
senses:
  - id: hang-up
    ru: "повесить (на стену, на крючок)"
    examples:
      - pl: "Powiesił obraz nad kominkiem."
        ru: "Он повесил картину над камином."
        source: { kind: authored }
      - pl: "Powieś płaszcz w szafie."
        ru: "Повесь плащ в шкаф."
        source: { kind: authored }
  - id: hang-laundry
    ru: "повесить (бельё, занавески)"
    examples:
      - pl: "Powiesiła pranie na sznurku za domem."
        ru: "Она повесила бельё на верёвку за домом."
        source: { kind: authored }
      - pl: "Powieszone pranie wyschło do wieczora."
        ru: "Повешенное бельё высохло к вечеру."
        source: { kind: authored }
  - id: execute
    ru: "повесить (о казни)"
    examples:
      - pl: "Skazany został powieszony o świcie."
        ru: "Приговорённого повесили на рассвете."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "У ЭТОГО СЛОВА ЕСТЬ МРАЧНОЕ ЗНАЧЕНИЕ, КОТОРОЕ В ПОЛЬСКОМ ЧИТАЕТСЯ ПЕРВЫМ. Существительное POWIESZENIE без контекста понимается как казнь через повешение: skazany na powieszenie. Русское «повешение» такого перевеса не имеет, а «повесить» остаётся нейтральным. Поэтому powiesić kogoś значит только одно, и сказать так о человеке случайно нельзя." }
  - { kind: usage, text: "В основе то же s→sz, что у zawiesić: инфинитив powiesić, но POWIESZĘ, POWIESZĄ, POWIESZONY, POWIESZENIE. Повелительное сохраняет мягкое ś: POWIEŚ, powieście. Несовершенная пара — WIESZAĆ: wieszam obraz «я вешаю картину», powieszę obraz «я повешу картину»." }
  - { kind: usage, text: "Вид совершенный, поэтому POWIESZĘ — это будущее «повешу», а не настоящее. Есть деепричастие powiesiwszy, а форм на -ąc и -ący нет совсем. Для белья и занавесок глагол совершенно обиходный: powiesić pranie, powiesić firany." }
collocations:
  - { pl: "powiesić obraz", ru: "повесить картину" }
  - { pl: "powiesić pranie", ru: "повесить бельё" }
  - { pl: "skazany na powieszenie", ru: "приговорённый к повешению" }
family:
  - { pl: "wieszać", ru: "вешать", relation: aspect }
  - { pl: "zawiesić", ru: "подвесить; приостановить", relation: root, id: zawiesic }
  - { pl: "wieszak", ru: "вешалка", relation: derived }
etymology: "Приставка po- и wiesić, из праславянского *věsiti «вешать», того же корня, что русские «вешать», «висеть» и «вес». Чередование s/sz в основе общее для этого класса, как в zawiesić и prosić. Отсюда wieszak «вешалка» и powieszenie."
memory: "powiesić — «повесить»: картину, бельё, занавески. Но POWIESZENIE без контекста значит казнь, и это главное отличие от русского. В основе s→sz: powieszę, powieszony, а повелительное powieś с мягким ś."
idioms:
  - { pl: "powiesić pranie", ru: "повесить бельё" }
  - { pl: "powiesić coś na kołku", ru: "забросить что-л." }
