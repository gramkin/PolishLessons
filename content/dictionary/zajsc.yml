# review
id: zajsc
format: 2
lemma: "zajść"
rank: 1327
pos: verb
aspect: perf
pron: { cyr: "зайсьць" }
senses:
  - id: set
    ru: "зайти, закатиться (о солнце)"
    examples:
      - pl: "Zaraz zajdzie słońce."
        ru: "Сейчас зайдёт солнце."
        source: { kind: translated, id: 933262 }
      - pl: "Słońce już prawie zaszło."
        ru: "Солнце уже почти зашло."
        source: { kind: translated, id: 498406 }
      - pl: "Słońce zaszło za horyzont."
        ru: "Солнце зашло за горизонт."
        source: { kind: translated, id: 1186442 }
  - id: happen
    ru: "произойти, случиться"
    examples:
      - pl: "Zaszła nagła zmiana sytuacji."
        ru: "Произошла внезапная перемена ситуации."
        source: { kind: translated, id: 837210 }
      - pl: "Proszę wyjaśnić sądowi, co zaszło."
        ru: "Объясните, пожалуйста, суду, что произошло."
        source: { kind: translated, id: 959247 }
      - pl: "Policja ustaliła, gdzie przebywał w czasie zajścia zbrodni."
        ru: "Полиция установила, где он был во время происшествия."
        source: { kind: translated, id: 524630 }
  - id: get-pregnant
    ru: "zajść w ciążę — забеременеть"
    examples:
      - pl: "Zaszła w ciążę."
        ru: "Она забеременела."
        source: { kind: translated, id: 456943 }
      - pl: "Mary zaszła w ciążę w wieku czternastu lat."
        ru: "Мэри забеременела в четырнадцать лет."
        source: { kind: translated, id: 3430091 }
notes:
  - { kind: usage, text: "Три живых значения: «зайти, дойти» (Tom nie mógł zajść daleko), «зайти» о солнце (słońce zaszło) и «произойти» (zaszła zmiana). Различает подлежащее." }
  - { kind: usage, text: "zajść w ciążę — «забеременеть», устойчивое выражение с предлогом w и винительным падежом." }
  - { kind: usage, text: "Несовершенный вид — zachodzić; от того же корня существительное zachód «запад, закат»." }
  - { kind: usage, text: "zajść komuś za skórę значит «допечь кого-то», буквально «зайти под кожу»." }
collocations:
  - { pl: "słońce zaszło", ru: "солнце зашло" }
  - { pl: "zajść w ciążę", ru: "забеременеть" }
  - { pl: "zaszła zmiana", ru: "произошла перемена" }
etymology: "Приставка za- + iść «идти», праславянское *jьti. Русское «зайти» — то же слово с той же приставкой, и значение «зайти о солнце» совпадает; отсюда же zachód «запад, закат», как русское «запад» от «западать»."
memory: "zajść = «зайти», в том числе о солнце (słońce zaszło), и «произойти» (zaszła zmiana). Отдельно запомните zajść w ciążę «забеременеть». Несовершенный вид — zachodzić."
idioms:
  - { pl: "słońce zaszło", ru: "солнце зашло" }
  - { pl: "zajść w ciążę", ru: "забеременеть" }
  - { pl: "zajść komuś za skórę", ru: "допечь кого-то" }
