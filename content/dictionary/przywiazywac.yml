# review
id: przywiazywac
format: 2
lemma: "przywiązywać"
rank: 2052
pos: verb
aspect: imperf
pron: { cyr: "пшывёнзы́ваць" }
senses:
  - id: attach-importance
    ru: "придавать (значение)"
    examples:
      - pl: "Dziewczyny przywiązują wagę do mody."
        ru: "Девушки придают значение моде."
        source: { kind: translated, id: 710433 }
      - pl: "Dlaczego przywiązujesz wagę do tego zdarzenia?"
        ru: "Почему ты придаёшь значение этому событию?"
        source: { kind: translated, id: 349151 }
      - pl: "Za dużą wagę przywiązujesz do takich szczegółów."
        ru: "Ты придаёшь слишком большое значение таким деталям."
        source: { kind: translated, id: 623580 }
  - id: tie
    ru: "привязывать"
    examples:
      - pl: "On przywiązywał swojego konia do płotu."
        ru: "Он привязывал свою лошадь к забору."
        source: { kind: translated, id: 863490 }
      - pl: "Uwolnij się od łańcuchów, które cię przywiązują!"
        ru: "Освободись от цепей, которые тебя привязывают!"
        source: { kind: translated, id: 10770957 }
notes:
  - { kind: usage, text: "Самый частый оборот — przywiązywać wagę do czegoś «придавать значение чему-л.». В буквальном значении «привязывать» встречается реже." }
  - { kind: government, text: "przywiązywać coś do czegoś — предлог do с родительным падежом." }
  - { kind: usage, text: "Совершенный вид — przywiązać. Возвратное przywiązać się do kogoś значит «привязаться к кому-л.» в чувственном смысле, как и в русском." }
  - { kind: false-friend, text: "Корень wiązać «вязать» — ср. русское «вязать», «привязать», «связь»." }
collocations:
  - { pl: "przywiązywać wagę", ru: "придавать значение" }
  - { pl: "przywiązać się do kogoś", ru: "привязаться к кому-л." }
etymology: "przy- + wiązać «вязать», праславянское *vęzati; ср. русское «вязать», «привязать», «связь»."
memory: "przywiązywać — «привязывать», но чаще всего в обороте przywiązywać wagę do czegoś «придавать значение чему-л.». Совершенный вид — przywiązać."
idioms:
  - { pl: "przywiązywać wagę do czegoś", ru: "придавать значение чему-л." }
