# review
id: nudzic
format: 2
lemma: "nudzić"
rank: 3756
pos: verb
pron: { cyr: "ну́дзиць" }
senses:
  - id: bore
    ru: "наводить скуку; NUDZIĆ SIĘ — скучать"
    examples:
      - pl: "Ten film mnie nudzi."
        ru: "Этот фильм наводит на меня скуку."
        source: { kind: authored }
      - pl: "Nudzę się w domu."
        ru: "Мне скучно дома."
        source: { kind: authored }
      - pl: "Nudzi mi się na tej lekcji."
        ru: "Мне скучно на этом уроке."
        source: { kind: authored }
  - id: pester
    ru: "надоедать, ныть (NUDZIĆ O COŚ)"
    examples:
      - pl: "Dziecko nudzi o lody."
        ru: "Ребёнок канючит мороженое."
        source: { kind: authored }
      - pl: "Nie nudź, zaraz pojedziemy."
        ru: "Не ной, сейчас поедем."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "NUDZIĆ — «наводить скуку», а не «нудить» в русском смысле «ныть» — хотя второе значение близко: NUDZIĆ O COŚ «канючить, ныть». Самое частое — NUDZI MI SIĘ «мне скучно» с дательным, как в русском. Скука — NUDA, скучный — NUDNY." }
  - { kind: usage, text: "Несовершенный вид; совершенный — ZNUDZIĆ. Спряжение: NUDZĘ, NUDZISZ, NUDZĄ; повелительное — NUDŹ. Безличное NUDZI MI SIĘ — «мне скучно»." }
  - { kind: government, text: "Кого — винительный: NUDZIĆ SŁUCHACZY. Чем — творительный: NUDZIĆ OPOWIEŚCIAMI. О чём просить — O с винительным: NUDZIĆ O PIESKA. Кому скучно — дательный: NUDZI MI SIĘ." }
  - { kind: pronunciation, text: "Читается «ну́дзиць»: DZI — мягкое «дзи». Ударение на первом слоге. NUDZĘ — «ну́дзэ», NUDŹ — «нудзь»." }
  - { kind: register, text: "Разговорное, бытовое слово. NIE NUDŹ! — «не ной!», чуть резко." }
collocations:
  - { pl: "nudzi mi się", ru: "мне скучно" }
  - { pl: "nudzić się na lekcji", ru: "скучать на уроке" }
  - { pl: "nudzić o coś", ru: "канючить что-то" }
family:
  - { pl: "znudzić", ru: "наскучить", relation: aspect, id: znudzic }
  - { pl: "nuda", ru: "скука", relation: derived, id: nuda }
  - { pl: "nudny", ru: "скучный", relation: derived, id: nudny }
etymology: "От NUDA «скука», праславянское *nuda «нужда, принуждение», как русское «нудный», «понуждать». Значение «скука» — польское развитие."
memory: "Nudzić — наводить скуку: film mnie nudzi. Nudzi mi się — мне скучно. Nie nudź! — не ной!"
idioms:
  - { pl: "nudny jak flaki z olejem", ru: "скучный, как овсянка без соли" }
