  - { pl: "zacnie", ru: "достойно, славно", relation: derived }
  - { pl: "niecny", ru: "гнусный, подлый", relation: antonym }
synonyms: ["prawy", "szlachetny", "czcigodny"]
etymology: "Заимствовано из чешского VZÁCNÝ «редкий, ценный, знатный»; в польском слово сместилось от ценности к достоинству человека."
memory: "ZACNY — «почтенный»: zacne grono, zacny człowiek. Его тёмный близнец niecny — «гнусный»."
