      - pl: "Zebrało się zacne grono gości."
        ru: "Собралось почтенное общество гостей."
        source: { kind: authored }
notes:
  - { kind: register, text: "ZACNY звучит старомодно и торжественно, примерно как русское «почтенный» или «достойный муж». В современной речи его часто говорят с улыбкой: ZACNE GRONO «почтенное собрание» о компании друзей, ZACNY TRUNEK «славный напиток» о хорошей наливке. Всерьёз слово живёт в некрологах, речах и юбилейных поздравлениях: BYŁ TO CZŁOWIEK ZACNY I PRAWY." }
  - { kind: false-friend, text: "Слово не имеет отношения к русским «зачем» или «зачин», а по смыслу ближе всего к «почтенный» и «порядочный». Противоположное ему NIECNY значит не «непочтенный», а «гнусный, подлый»: NIECNE ZAMIARY — «гнусные намерения». Это пара, которую стоит запомнить вместе." }
  - { kind: usage, text: "Степени образуются регулярно: ZACNIEJSZY, NAJZACNIEJSZY, в мужско-личном множественном ZACNI, ZACNIEJSI. Сравнительная степень встречается редко и почти всегда в торжественной или шутливой речи; превосходная привычнее, особенно в обращениях и похвалах: NAJZACNIEJSI GOŚCIE «самые почётные гости»." }
  - { kind: pronunciation, text: "Читается «за́цны»: C — это «ц», Y — твёрдое «ы», ударение на первом слоге. В мужско-личной форме N смягчается: ZACNI, «за́цни»." }
collocations:
  - { pl: "zacne grono", ru: "почтенное общество" }
  - { pl: "zacny człowiek", ru: "достойный человек" }
  - { pl: "zacny trunek", ru: "славный напиток" }
family:
