      - pl: "Pochodził z zacnego rodu."
        ru: "Он происходил из почтенного рода."
        source: { kind: authored }
  - id: fine
    ru: "славный, отменный"
    note: "о вещах, часто с добродушной иронией"
    examples:
      - pl: "Zacne wino, gratuluję wyboru!"
        ru: "Отменное вино, поздравляю с выбором!"
