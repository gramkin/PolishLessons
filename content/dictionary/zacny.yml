# review
id: zacny
format: 2
lemma: "zacny"
rank: 5987
pos: adj
pron: { cyr: "за́цны" }
senses:
  - id: honourable
    ru: "почтенный, достойный, порядочный"
    note: "о людях и их поступках"
    examples:
      - pl: "To był zacny człowiek."
        ru: "Это был достойный человек."
        source: { kind: authored }
      - pl: "Zacni obywatele zebrali pieniądze na szkołę."
