# review
id: inteligencja
format: 2
lemma: "inteligencja"
rank: 3860
pos: noun
pron: { cyr: "интэлиге́нцья" }
senses:
  - id: intelligence
    ru: "интеллект, ум"
    examples:
      - pl: "Sztuczna inteligencja zmienia świat."
        ru: "Искусственный интеллект меняет мир."
        source: { kind: authored }
      - pl: "Ma wysoką inteligencję."
        ru: "У него высокий интеллект."
        source: { kind: authored }
      - pl: "Delfiny słyną z inteligencji."
        ru: "Дельфины славятся умом."
        source: { kind: authored }
  - id: intelligentsia
    ru: "интеллигенция"
    examples:
      - pl: "Polska inteligencja odegrała ważną rolę w historii."
        ru: "Польская интеллигенция сыграла важную роль в истории."
        source: { kind: authored }
      - pl: "Pochodzi z rodziny inteligencji."
        ru: "Он из семьи интеллигентов."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "INTELIGENCJA — и «интеллигенция» как слой общества, и, чаще, «интеллект, ум»: SZTUCZNA INTELIGENCJA, «искусственный интеллект», ILORAZ INTELIGENCJI, «IQ». И пишется с одним L." }
  - { kind: usage, text: "Восемь живых форм, женский род на -CJA. Родительный, дательный и местный — INTELIGENCJI. Архаичная форма INTELIGENCYJ и звательный не даются." }
  - { kind: government, text: "Коэффициент интеллекта — ILORAZ INTELIGENCJI, родительный. Отличаться умом — WYRÓŻNIAĆ SIĘ INTELIGENCJĄ, творительный." }
  - { kind: pronunciation, text: "Читается «интэлиге́нцья», ударение на предпоследнем слоге. TE — твёрдое «тэ», GE — «ге», CJA — «цья»." }
collocations:
  - { pl: "sztuczna inteligencja", ru: "искусственный интеллект" }
  - { pl: "iloraz inteligencji", ru: "коэффициент интеллекта" }
  - { pl: "polska inteligencja", ru: "польская интеллигенция" }
family:
  - { pl: "inteligentny", ru: "умный; интеллигентный", relation: root, id: inteligentny }
  - { pl: "inteligent", ru: "интеллигент", relation: derived }
  - { pl: "sztuczna inteligencja", ru: "искусственный интеллект", relation: derived }
etymology: "Из латинского слова со значением «понимание, ум». Значение «интеллигенция» как социального слоя развилось в XIX веке, в том числе в польском."
memory: "Inteligencja — ум, интеллект и интеллигенция. Читается «интэлиге́нцья», одно L. Sztuczna inteligencja — ИИ. Inteligentny — умный."
idioms:
  - { pl: "mieć głowę na karku", ru: "иметь голову на плечах" }
formExamplesSkip:
  - { form: "inteligencyj", reason: "архаичная форма родительного множественного; сейчас говорят INTELIGENCJI" }
  - { form: "inteligencjo", reason: "звательный падеж у этого слова не употребляется" }
formExamples:
