# review
id: lalka
format: 2
lemma: "lalka"
rank: 2535
pos: noun
pron: { cyr: "ля́лка" }
senses:
  - id: doll
    ru: "кукла"
    examples:
      - pl: "Lalka miała odpadniętą rękę."
        ru: "У куклы отвалилась рука."
        source: { kind: authored }
      - pl: "Dziewczynka nie rozstawała się z lalką."
        ru: "Девочка не расставалась с куклой."
        source: { kind: authored }
  - id: puppet
    ru: "кукла (театральная)"
    examples:
      - pl: "Teatr lalek gra w każdą sobotę."
        ru: "Кукольный театр играет каждую субботу."
        source: { kind: authored }
      - pl: "Lalki poruszają się na cienkich żyłkach."
        ru: "Куклы двигаются на тонких лесках."
        source: { kind: authored }
  - id: figuratively-pretty
    ru: "кукла (перен.: о внешности)"
    examples:
      - pl: "Wyglądała jak lalka w tej sukience."
        ru: "Она выглядела как кукла в этом платье."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "РУССКИЙ КОГНАТ ЕСТЬ, НО ОН ДЕТСКИЙ И РАЗГОВОРНЫЙ. Польская LALKA — обычное, нейтральное слово «кукла», его пишут на коробке в магазине. Русская «лялька» звучит по-детски или ласково, а нейтральное слово там «кукла». Корень общий — детское удвоение la-la, как в mama и tata." }
  - { kind: usage, text: "Дательный и предложный — LALCE, с переходом k→c: dał lalce nową sukienkę. Родительный множественного — LALEK, с беглым e. Кукольный театр называется TEATR LALEK, во множественном. И помни, что Lalka — ещё и название романа Prusa, одного из самых известных в польской литературе." }
  - { kind: pronunciation, text: "Два слога, ударение на первом: LAL-ka. Оба l мягкие, как русское ль: «ля́лка». Форма lalce звучит «ля́льцэ»." }
collocations:
  - { pl: "teatr lalek", ru: "кукольный театр" }
  - { pl: "bawić się lalkami", ru: "играть в куклы" }
  - { pl: "wyglądać jak lalka", ru: "выглядеть как кукла" }
family:
  - { pl: "zabawka", ru: "игрушка", relation: root, id: zabawka }
  - { pl: "dziecko", ru: "ребёнок", relation: root, id: dziecko }
  - { pl: "miś", ru: "мишка", relation: root }
etymology: "От детского la-la, удвоения с тем же устройством, что mama и tata. Тот же корень дал русские «ляля» и «лялька», только там слово осталось в детской речи, а по-польски стало нейтральным. Уменьшительный суффикс -ka здесь уже не ощущается как уменьшительный."
memory: "lalka — «кукла», слово совершенно обычное, в отличие от русской «ляльки», которая звучит по-детски. Формы с чередованиями: lalce и lalek. Кукольный театр — teatr lalek."
idioms:
  - { pl: "teatr lalek", ru: "кукольный театр" }
  - { pl: "ubrana jak lalka", ru: "одета как кукла" }
