# review
id: poslaniec
format: 2
lemma: "posłaniec"
rank: 5329
pos: noun
pron: { cyr: "посуа́нец" }
senses:
  - id: messenger
    ru: "гонец, посыльный"
    examples:
      - pl: "Posłaniec przybiegł zdyszany."
        ru: "Гонец прибежал запыхавшись."
        source: { kind: authored }
      - pl: "Wysłali posłańca z wiadomością."
        ru: "Они послали гонца с известием."
        source: { kind: authored }
      - pl: "Jako posłaniec dostarczał listy do urzędów."
        ru: "Посыльным он разносил письма по учреждениям."
        source: { kind: authored }
  - id: harbinger
    ru: "вестник, предвестник (перен.)"
    examples:
      - pl: "Jaskółka to posłaniec wiosny."
        ru: "Ласточка — вестница весны."
        source: { kind: authored }
      - pl: "Ten wiatr jest posłańcem burzy."
        ru: "Этот ветер — предвестник бури."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "POSŁANIEC — «гонец, посыльный», а не «посланник» в дипломатическом смысле. Дипломатический посланник — WYSŁANNIK или POSEŁ, а POSEŁ сегодня прежде всего «депутат Сейма». Курьер доставки — KURIER." }
  - { kind: usage, text: "Десять форм, мужской род, лицо. Беглое E, и N перед C становится Ń: POSŁANIEC, но POSŁAŃCA, POSŁAŃCY. Местный и звательный совпадают: POSŁAŃCU." }
  - { kind: government, text: "Послать гонца к кому-то — WYSŁAĆ POSŁAŃCA DO KOGOŚ: DO с родительным там, где в русском «к» с дательным. Гонец с известием — POSŁANIEC Z WIADOMOŚCIĄ, Z с творительным." }
  - { kind: pronunciation, text: "Читается «посуа́нец», ударение на предпоследнем слоге. Ł — «у», как в POSŁAĆ «по́суаць». В форме POSŁAŃCA: «посуа́ньца»." }
  - { kind: register, text: "Слово книжное и историческое: королевские гонцы, сказки, Библия, POSŁANIEC BOŻY. В переносном смысле — поэтическое: POSŁANIEC WIOSNY." }
collocations:
  - { pl: "wysłać posłańca", ru: "отправить гонца" }
  - { pl: "posłaniec z listem", ru: "гонец с письмом" }
  - { pl: "posłaniec wiosny", ru: "вестник весны" }
family:
  - { pl: "posłać", ru: "послать", relation: root, id: poslac }
  - { pl: "poseł", ru: "депутат; посол", relation: root }
  - { pl: "posłanie", ru: "послание", relation: derived }
etymology: "От POSŁAĆ «послать» с суффиксом -ANIEC, как WYGNANIEC «изгнанник» от WYGNAĆ. Польское Ł на месте русского «л»: POSŁAĆ — «послать»."
memory: "Posłaniec — гонец, от posłać «послать». Читается «посуа́нец». Poseł — депутат. Kurier — курьер. Nie zabija się posłańca — гонца не казнят."
idioms:
  - { pl: "nie zabija się posłańca", ru: "гонец не виноват в плохих вестях" }
