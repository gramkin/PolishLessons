notes:
  - { kind: false-friend, text: "rodzina — это «семья», а не «родина». Русская «родина» по-польски ojczyzna. Слова одного корня, но значения разошлись." }
  - { kind: usage, text: "zakładać rodzinę — «создавать семью»; rodzina wielodzietna — «многодетная семья»." }
  - { kind: usage, text: "Слово покрывает и узкую семью, и родню вообще: cała rodzina «вся родня»." }
collocations:
  - { pl: "moja rodzina", ru: "моя семья" }
  - { pl: "zakładać rodzinę", ru: "создавать семью" }
  - { pl: "cała rodzina", ru: "вся семья" }
  - { pl: "w rodzinie", ru: "в семье" }
etymology: "Праславянское *rodina от *rodъ «род». В польском развилось значение «семья», а в русском тот же корень дал «родину» — слова одинаковые, смысл разный."
memory: "Ложный друг: rodzina — «семья», а русская «родина» по-польски ojczyzna. Запомните zakładać rodzinę «создавать семью»."
idioms:
  - { pl: "zakładać rodzinę", ru: "создавать семью" }
  - { pl: "co w rodzinie, to nie zginie", ru: "что в семье, то не пропадёт" }
  - { pl: "z rodziną wychodzi się dobrze tylko na zdjęciu", ru: "с роднёй хорошо только на фотографии" }
formExamplesSkip:
