  - id: relatives
    ru: "семья, родня, род"
    examples:
      - pl: "Rodzina Toma kochała Mary."
        ru: "Семья Тома любила Мэри."
        source: { kind: tatoeba, id: 2403106 }
      - pl: "Bardzo tęskni za swoją rodziną."
