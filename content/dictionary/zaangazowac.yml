rank: 2613
pos: verb
pron: { cyr: "заангажо́ваць" }
senses:
  - id: hire
    ru: "нанять, принять на работу"
    examples:
      - pl: "Zaangażowali nowego księgowego."
        ru: "Они наняли нового бухгалтера."
