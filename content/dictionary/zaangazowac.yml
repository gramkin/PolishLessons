      - pl: "Teatr zaangażował ją na cały sezon."
        ru: "Театр принял её на весь сезон."
        source: { kind: authored }
  - id: involve
    ru: "вовлечь, привлечь"
    examples:
      - pl: "Zaangażowano w akcję trzy szkoły."
        ru: "В акцию вовлекли три школы."
        source: { kind: authored }
      - pl: "Nie chcę zaangażować w to dzieci."
        ru: "Я не хочу вовлекать в это детей."
        source: { kind: authored }
  - id: commit
    ru: "включиться, вложиться (się w coś)"
    examples:
      - pl: "Zaangażowała się w projekt bez reszty."
        ru: "Она включилась в проект без остатка."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "РУССКОЕ «АНГАЖИРОВАТЬ» УЖЕ И СТАРОМОДНЕЕ. У нас это слово отдаёт театром девятнадцатого века: ангажировать актрису, получить ангажемент. Польское ZAANGAŻOWAĆ — слово повседневное и канцелярское: zaangażować księgowego значит просто «нанять бухгалтера». Второе значение — «вовлечь»: zaangażować kogoś w projekt." }
  - { kind: false-friend, text: "Причастие расходится по оценке. Русское «ангажированный» почти всегда упрёк: куплен, пристрастен. Польское ZAANGAŻOWANY — наоборот, похвала: увлечённый, неравнодушный, вкладывающий себя. Zaangażowany nauczyciel — это учитель, который горит работой. В политическом смысле literatura zaangażowana значит «литература с позицией», и это тоже не ругательство." }
  - { kind: usage, text: "Возвратное ZAANGAŻOWAĆ SIĘ W COŚ идёт с винительным, и тут русский совпадает: «включиться в проект». Спряжение тоже даётся даром — -ować даёт -uję, как «-ировать» даёт «-ирую»: zaangażuję, zaangażujesz. Несовершенная пара — ANGAŻOWAĆ." }
collocations:
  - { pl: "zaangażować pracownika", ru: "нанять работника" }
  - { pl: "zaangażować się w projekt", ru: "включиться в проект" }
  - { pl: "zaangażowany nauczyciel", ru: "увлечённый учитель" }
family:
  - { pl: "angażować", ru: "нанимать, вовлекать (несов.)", relation: aspect }
  - { pl: "zaangażowanie", ru: "вовлечённость, увлечённость", relation: derived }
  - { pl: "zwolnić", ru: "уволить", relation: antonym, id: zwolnic }
etymology: "Из французского engager «нанимать, обязывать», через немецкий. Русский взял то же слово в театральном кругу и там его и оставил, а польский пустил в общий оборот, добавив родную приставку za- для совершенного вида. Отсюда и расхождение оценки у причастия: у нас ангажемент дело денежное, у поляков zaangażowanie — дело сердца."
memory: "zaangażować — это «нанять» или «вовлечь», слово обычное, а не театральное. И помни знак: zaangażowany по-польски похвала, «увлечённый», а не русское «ангажированный»."
idioms:
  - { pl: "zaangażować się bez reszty", ru: "отдаться делу без остатка" }
  - { pl: "literatura zaangażowana", ru: "литература с гражданской позицией" }
