# review
id: wykonywac
format: 2
lemma: "wykonywać"
rank: 1405
pos: verb
aspect: imperf
aspectPair: wykonac
pron: { cyr: "выконы́ваць" }
senses:
  - id: do-work
    ru: "выполнять (работу, обязанности)"
    examples:
      - pl: "Tom wykonuje dobrą pracę."
        ru: "Том выполняет хорошую работу."
        source: { kind: translated, id: 3051250 }
      - pl: "Jaką pracę pan wykonuje?"
        ru: "Какую работу вы выполняете?"
        source: { kind: translated, id: 1603680 }
      - pl: "Wykonuję całą pracę."
        ru: "Я выполняю всю работу."
        source: { kind: translated, id: 8698259 }
  - id: carry-out
    ru: "выполнять (приказы, движения, действия)"
    examples:
      - pl: "Musisz wykonywać polecenia."
        ru: "Ты должен выполнять распоряжения."
        source: { kind: translated, id: 6328155 }
      - pl: "On tylko wykonywał rozkazy."
        ru: "Он лишь выполнял приказы."
        source: { kind: tatoeba, id: 6328156 }
      - pl: "Nie wykonuj gwałtownych ruchów."
        ru: "Не делай резких движений."
        source: { kind: translated, id: 3743602 }
notes:
  - { kind: usage, text: "Мужско-личной формы wykonywani не бывает: выполняют работу, приказ или произведение, а не людей, поэтому она оставлена без примеров. Не спасает и оборот wykonywać wyrok: там дополнение — приговор, а не осуждённый. Причастие живёт при вещах: wykonywana praca, wykonywane rozkazy." }
  - { kind: usage, text: "Два спряжения настоящего времени: нормативное wykonuje, wykonują и устаревшее wykonywa, wykonywają. Поэтому niech wykonuje звучит нейтрально, а niech wykonywa — по-старинному." }
  - { kind: usage, text: "Пара по виду: wykonywać (несовершенный) — wykonać (совершенный)." }
  - { kind: government, text: "Выполнять что-то — wykonywać coś (винительный падеж): wykonywać pracę, wykonywać rozkazy." }
  - { kind: usage, text: "Jaki zawód pan wykonuje? — стандартный вопрос о профессии, буквально «какую профессию вы выполняете»." }
  - { kind: usage, text: "Слово годится и для музыки: wykonywać utwór «исполнять произведение», siostry wykonują duet «сёстры исполняют дуэт»." }
collocations:
  - { pl: "wykonywać pracę", ru: "выполнять работу" }
  - { pl: "wykonywać rozkazy", ru: "выполнять приказы" }
  - { pl: "jaki zawód pan wykonuje", ru: "кто вы по профессии" }
family:
  - { pl: "wykonać", ru: "выполнить", relation: aspect, id: wykonac }
  - { pl: "wykonanie", ru: "выполнение", relation: root }
  - { pl: "robić", ru: "делать", relation: root, id: robic }
etymology: "Приставка wy- плюс konać, старого глагола «совершать», того же корня, что koniec «конец»: довести до конца. Русское «выполнять» построено от «полный»."
memory: "wykonywać — «выполнять», совершенный вид wykonać. Про работу, приказы и музыку сразу: wykonywać pracę, wykonywać rozkazy, wykonywać utwór."
idioms:
  - { pl: "wykonywać pracę", ru: "выполнять работу" }
  - { pl: "wykonywać rozkazy", ru: "выполнять приказы" }
  - { pl: "jaki zawód pan wykonuje?", ru: "кто вы по профессии?" }
