formExamples:
  - form: "wykonuj"
    pl: "Nie wykonuj gwałtownych ruchów."
    ru: "Не делай резких движений."
    source: { kind: translated, id: 3743602 }
  - form: "wykonuj"
    pl: "Regularnie wykonuj mu lub jej kąpiel z użyciem gąbki."
    ru: "Регулярно обтирай его или её губкой."
    source: { kind: translated, id: 11215667 }
  - form: "wykonuj"
    pl: "Wykonuj polecenia dokładnie."
    ru: "Выполняй указания точно."
    source: { kind: authored }
  - form: "wykonują"
    pl: "Niech wykonują swoją pracę."
    ru: "Пусть они выполняют свою работу."
    source: { kind: translated, id: 6554158 }
  - form: "wykonują"
    pl: "Wykonują pracę w żółwim tempie."
    ru: "Они делают свою работу с черепашьей скоростью."
    source: { kind: tatoeba, id: 2154210 }
  - form: "wykonują"
    pl: "Siostry wykonują duet na skrzypce i fortepian."
    ru: "Сёстры исполняют дуэт для скрипки и фортепиано."
    source: { kind: translated, id: 13560576 }
  - form: "wykonuje"
    pl: "Jaką pracę pan wykonuje?"
    ru: "Какую работу вы выполняете?"
    source: { kind: translated, id: 1603680 }
  - form: "wykonuje"
    pl: "Tom wykonuje dobrą pracę."
    ru: "Том выполняет хорошую работу."
    source: { kind: translated, id: 3051250 }
  - form: "wykonuje"
    pl: "Samolot wykonuje perfekcyjne lądowanie."
    ru: "Самолёт выполняет безупречную посадку."
    source: { kind: translated, id: 1262545 }
  - form: "wykonujecie"
    pl: "Jaki zawód wykonujecie?"
    ru: "Кто вы по профессии?"
    source: { kind: translated, id: 3108183 }
  - form: "wykonujecie"
    pl: "Jakie zadania wykonujecie w pracy?"
    ru: "Какие задачи вы выполняете на работе?"
    source: { kind: authored }
  - form: "wykonujecie"
    pl: "Wykonujecie to razem?"
    ru: "Вы выполняете это вместе?"
    source: { kind: authored }
  - form: "wykonujesz"
    pl: "Jaki rodzaj pracy wykonujesz?"
    ru: "Какого рода работу ты выполняешь?"
    source: { kind: translated, id: 10572575 }
  - form: "wykonujesz"
    pl: "Dobrze wykonujesz swoje obowiązki."
    ru: "Ты хорошо выполняешь свои обязанности."
    source: { kind: authored }
  - form: "wykonujesz"
    pl: "Co teraz wykonujesz?"
    ru: "Что ты сейчас выполняешь?"
    source: { kind: authored }
  - form: "wykonuję"
    pl: "Wykonuję całą pracę."
    ru: "Я выполняю всю работу."
    source: { kind: translated, id: 8698259 }
  - form: "wykonuję"
    pl: "Wykonuję sporo pracy w szkolnej gazetce."
    ru: "Я выполняю немало работы в школьной газете."
    source: { kind: translated, id: 3897312 }
  - form: "wykonuję"
    pl: "Ja tylko wykonuję mój obywatelski obowiązek."
    ru: "Я лишь выполняю свой гражданский долг."
    source: { kind: translated, id: 7868681 }
  - form: "wykonywać"
    pl: "Musisz wykonywać polecenia."
    ru: "Ты должен выполнять распоряжения."
    source: { kind: translated, id: 6328155 }
  - form: "wykonywać"
    pl: "Czy zawsze trzeba wykonywać rozkazy?"
    ru: "Всегда ли нужно выполнять приказы?"
    source: { kind: translated, id: 2825944 }
  - form: "wykonywać"
    pl: "Lekarz poradził mi wykonywać więcej ćwiczeń."
    ru: "Врач посоветовал мне выполнять больше упражнений."
    source: { kind: translated, id: 3152108 }
  - form: "wykonywał"
    pl: "On tylko wykonywał rozkazy."
    ru: "Он лишь выполнял приказы."
    source: { kind: tatoeba, id: 6328156 }
  - form: "wykonywał"
    pl: "Mój robot będzie przygotowywał posiłki, sprzątał, zmywał naczynia i wykonywał inne domowe czynności."
    ru: "Мой робот будет готовить еду, убирать, мыть посуду и выполнять другие домашние дела."
    source: { kind: translated, id: 593070 }
  - form: "wykonywał"
    pl: "Wykonywał tę pracę przez lata."
    ru: "Он выполнял эту работу годами."
    source: { kind: authored }
  - form: "wykonywała"
    pl: "Mary tylko wykonywała swoją pracę."
    ru: "Мэри лишь выполняла свою работу."
    source: { kind: translated, id: 10558551 }
  - form: "wykonywała"
    pl: "Wykonywała polecenia bez słowa."
    ru: "Она выполняла указания без слов."
    source: { kind: authored }
  - form: "wykonywała"
    pl: "Ta maszyna wykonywała całą pracę."
    ru: "Эта машина выполняла всю работу."
    source: { kind: authored }
