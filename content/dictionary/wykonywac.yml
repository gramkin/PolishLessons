    source: { kind: authored }
  - form: "wykonywano"
    pl: "Wykonywano to samo ćwiczenie godzinami."
    ru: "Одно и то же упражнение выполняли часами."
    source: { kind: authored }
  - form: "wykonywany"
    pl: "Ten zawód jest wykonywany od pokoleń."
