    ru: "Работы, выполняемые вручную, стоят дороже."
    source: { kind: authored }
  - form: "wykonywanego"
    pl: "Nie ma tu zawodu wykonywanego od pokoleń."
    ru: "Ремесла, которым занимаются поколениями, тут нет."
    source: { kind: authored }
  - form: "wykonywanego"
    pl: "Szukam najczęściej wykonywanego utworu."
    ru: "Я ищу самое часто исполняемое произведение."
    source: { kind: authored }
  - form: "wykonywanego"
    pl: "Od wykonywanego pośpiesznie zadania nie ma pożytku."
    ru: "От наспех выполняемого задания пользы нет."
    source: { kind: authored }
  - form: "wykonywanej"
    pl: "Nie ma pracy wykonywanej bez wysiłku."
    ru: "Работы, выполняемой без усилий, не бывает."
    source: { kind: authored }
  - form: "wykonywanej"
    pl: "Szukam najczęściej wykonywanej arii."
    ru: "Я ищу самую часто исполняемую арию."
    source: { kind: authored }
  - form: "wykonywanej"
    pl: "Skarżył się na ilość wykonywanej pracy."
    ru: "Он жаловался на объём выполняемой работы."
    source: { kind: authored }
  - form: "wykonywanemu"
    pl: "Przyjrzyj się wykonywanemu zadaniu."
    ru: "Присмотрись к выполняемому заданию."
    source: { kind: authored }
  - form: "wykonywanemu"
    pl: "Dzięki starannie wykonywanemu ćwiczeniu uniknął kontuzji."
    ru: "Благодаря тщательно выполняемому упражнению он избежал травмы."
    source: { kind: authored }
  - form: "wykonywanemu"
    pl: "Nie dowierzał pośpiesznie wykonywanemu remontowi."
    ru: "Он не доверял наспех выполняемому ремонту."
    source: { kind: authored }
  - form: "wykonywania"
    pl: "Uczy się wykonywania prostych ruchów."
    ru: "Он учится выполнять простые движения."
    source: { kind: authored }
  - form: "wykonywania"
    pl: "Dotyczy to wykonywania zawodu lekarza."
    ru: "Это касается работы по профессии врача."
    source: { kind: authored }
  - form: "wykonywania"
    pl: "Nie ma tu zakazu wykonywania zdjęć."
    ru: "Здесь нет запрета на съёмку."
    source: { kind: authored }
  - form: "wykonywanie"
    pl: "Wykonywanie tej pracy wymaga licencji."
    ru: "Выполнение этой работы требует лицензии."
    source: { kind: authored }
  - form: "wykonywanie"
    pl: "Wykonywanie rozkazów to obowiązek żołnierza."
    ru: "Выполнение приказов — обязанность солдата."
    source: { kind: authored }
  - form: "wykonywanie"
    pl: "Wykonywanie zdjęć jest tu zakazane."
    ru: "Съёмка здесь запрещена."
    source: { kind: authored }
  - form: "wykonywaniem"
    pl: "Zajmuje się wykonywaniem mebli na zamówienie."
    ru: "Он занимается изготовлением мебели на заказ."
    source: { kind: authored }
  - form: "wykonywaniem"
    pl: "Między wykonywaniem a planowaniem jest różnica."
    ru: "Между исполнением и планированием есть разница."
    source: { kind: authored }
  - form: "wykonywaniem"
    pl: "Zmęczył się wykonywaniem tych samych czynności."
    ru: "Он устал выполнять одни и те же действия."
    source: { kind: authored }
  - form: "wykonywaniu"
    pl: "W wykonywaniu rozkazów liczy się dokładność."
    ru: "В исполнении приказов важна точность."
    source: { kind: authored }
  - form: "wykonywaniu"
    pl: "Po wykonywaniu ćwiczeń przychodzi rozciąganie."
    ru: "После выполнения упражнений идёт растяжка."
    source: { kind: authored }
  - form: "wykonywaniu"
    pl: "O wykonywaniu zawodu mówi osobny rozdział."
    ru: "Об исполнении профессиональных обязанностей говорит отдельная глава."
    source: { kind: authored }
  - form: "wykonywano"
    pl: "Wykonywano rozkazy bez pytań."
    ru: "Приказы выполняли без вопросов."
