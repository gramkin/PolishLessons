        ru: "Мы пригласили супругов Новаков."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Главная ловушка для русского: вежливое państwo требует глагола в 3-м лице МНОЖЕСТВЕННОГО числа, а не во 2-м. Państwo je chronią значит «Вы их защищаете», буквально «господа их защищают». Русское «вы» так не работает, и ошибка здесь очень заметна." }
  - { kind: usage, text: "Система вежливости тройная: pan — к мужчине, pani — к женщине, państwo — к смешанной группе или к супружеской паре. К нескольким мужчинам — panowie, к нескольким женщинам — panie." }
  - { kind: usage, text: "Родительный państwa значит «ваш, ваши»: z państwa napojami «с вашими напитками». Дательный państwu — «вам»: mówiłem państwu «я вам говорил»." }
  - { kind: usage, text: "На письме вежливое Państwo принято писать с прописной буквы: Szanowni Państwo «Уважаемые господа», Przecież mówiłem Państwu «Я же вам говорил»." }
  - { kind: usage, text: "То же слово значит «государство», и различает их только контекст: w tym państwie «в этом государстве», но mówiłem państwu «я вам говорил»." }
  - { kind: usage, text: "Устойчивое państwo młodzi — «молодожёны», а państwo Kowalscy — «супруги Ковальские». Фамилия при этом стоит во множественном числе." }
