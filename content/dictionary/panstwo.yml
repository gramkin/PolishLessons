etymology: "Из pan «господин» и суффикса -stwo: изначально «владение пана». Русское «государство» собрано ровно так же — от «государь», — так что логика словообразования полностью совпадает."
memory: "państwo — это и «государство», и вежливое «вы» к смешанной группе. Второе важнее: система pan — pani — państwo работает всюду, а глагол при państwo стоит в 3-м лице множественного числа: Państwo je chronią «Вы их защищаете». Русское «вы» так не строится, и это главная ошибка. Родительный państwa значит «ваш», дательный państwu — «вам»."
