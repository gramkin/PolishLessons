etymology: "Из праславянского *širokъ, от которого и русское «широкий»: корень общий, значение не менялось, и слово узнаётся сразу. Любопытнее сравнительная степень. В обоих языках она построена на укороченной основе, без -OK-: польское SZERSZY и русское «шире» идут от одного и того же старого образования. Такое усечение — общая черта славянских языков для нескольких частых прилагательных, и ряд легко продолжить: WYSOKI даёт WYŻSZY при русском «высокий — выше», DALEKI даёт DALSZY при «далёкий — дальше». Правило одно, и, запомнив его на одном слове, остальные узнаёшь без труда."
memory: "Сравнительная степень неправильная: szeroki — SZERSZY — najszerszy, с выпадением -ok-, ровно как русское «широкий — шире». Мужско-личные формы различаются: szerocy, но szersi. Ширина — через NA с винительным: szeroka NA sto metrów. Читается «шэро́ки»."
