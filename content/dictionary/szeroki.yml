notes:
  - { kind: usage, text: "Главное на карточке — неправильная сравнительная степень. От SZEROKI она образуется не прибавлением -SZY к целому слову, а усечением основы: отпадает -OK-, и выходит SZERSZY, а никакое SZEROKSZY. Превосходная строится уже от сравнительной: NAJSZERSZY. Меняется и мужско-личная форма множественного числа: в положительной степени SZEROCY, в сравнительной SZERSI. Русский поступает точно так же: «широкий» даёт «шире», а не «широчее», и основа там тоже укорачивается. Правило знакомое, запомнить нужно только польские формы." }
  - { kind: pronunciation, text: "Читается «шэро́ки», с ударением на предпоследнем слоге. Сочетание sz даёт «ш», а e — «э», поэтому не «широки», а «шэро́ки». В сравнительной степени SZERSZY — «шэ́ршы», с двумя «ш» через r, и слово становится двусложным, отчего ударение уходит на первый слог. Мужско-личная форма SZEROCY звучит «шэро́цы», с переходом k в c перед окончанием -Y." }
  - { kind: government, text: "Насколько широкий — предлог NA с винительным падежом: RZEKA SZEROKA NA STO METRÓW, буквально «река широкая на сто метров». Русский обходится оборотом «шириной в сто метров», так что конструкцию приходится перестраивать целиком. При сравнении — OD с родительным или NIŻ: SZERSZY OD POPRZEDNIEGO, SZERSZY NIŻ POPRZEDNI. В переносном значении обычны готовые сочетания: SZEROKIE HORYZONTY, SZEROKA PUBLICZNOŚĆ, W SZEROKIM ZNACZENIU." }
  - { kind: false-friend, text: "Ложной пары нет: слово значит то же, что русское «широкий», и переносные значения совпадают почти полностью. Расходятся лишь отдельные сочетания. SZEROKA PUBLICZNOŚĆ отвечает русской «широкой публике», а вот «человек широкой души» по-польски скажут иначе: CZŁOWIEK O SZEROKIM SERCU или просто HOJNY. И существительное SZEROKOŚĆ значит и «ширина», и «широта» географическая, тогда как русский разводит эти понятия по двум словам." }
