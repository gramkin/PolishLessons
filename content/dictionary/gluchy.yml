# review
id: gluchy
format: 2
lemma: "głuchy"
rank: 4090
pos: adj
pron: { cyr: "гу́хы" }
senses:
  - id: deaf
    ru: "глухой (не слышащий)"
    examples:
      - pl: "Dziadek jest głuchy na jedno ucho."
        ru: "Дедушка глух на одно ухо."
        source: { kind: authored }
      - pl: "Głusi porozumiewają się językiem migowym."
        ru: "Глухие общаются на языке жестов."
        source: { kind: authored }
      - pl: "Z wiekiem stał się jeszcze głuchszy."
        ru: "С возрастом он стал ещё глуше."
        source: { kind: authored }
  - id: muffled
    ru: "глухой (о звуке, месте); безучастный"
    examples:
      - pl: "Usłyszałem głuchy łoskot."
        ru: "Я услышал глухой грохот."
        source: { kind: authored }
      - pl: "Był głuchy na nasze prośby."
        ru: "Он был глух к нашим просьбам."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Совпадение с русским «глухой» почти полное, во всех смыслах: о слухе, о звуке, о равнодушии. Польская особенность — в местах: русское «глушь» по-польски скорее ODLUDZIE или ZADUPIE (грубо), а не GŁUCHE MIEJSCE. GŁUCHY TELEFON — «испорченный телефон», детская игра." }
  - { kind: usage, text: "Полная парадигма с простыми степенями: GŁUCHY, GŁUCHSZY, NAJGŁUCHSZY. Мужское-личное с чередованием CH на S: GŁUSI, в степенях — GŁUCHSI, NAJGŁUCHSI. GŁUSI без существительного — «глухие» как группа людей." }
  - { kind: government, text: "Глухой на ухо — GŁUCHY NA UCHO, NA с винительным. Глух к чему-то — GŁUCHY NA + винительный: GŁUCHY NA PROŚBY, NA ARGUMENTY. Русское «глух к чему» с дательным здесь не работает." }
  - { kind: pronunciation, text: "Читается «гу́хы», два слога, ударение на первом. Ł — «у», CHY — твёрдое «хы». В мужском-личном GŁUSI: «гу́си», с мягким «си»." }
  - { kind: register, text: "Нейтральное слово. О людях вежливее — NIESŁYSZĄCY, «неслышащий». GŁUCHA NOC, «глухая ночь», и GŁUCHA CISZA, «мёртвая тишина», — литературные. GŁUCHY TELEFON знает каждый польский ребёнок." }
collocations:
  - { pl: "głuchy na jedno ucho", ru: "глухой на одно ухо" }
  - { pl: "głucha cisza", ru: "мёртвая тишина" }
  - { pl: "głuchy telefon", ru: "испорченный телефон (игра)" }
family:
  - { pl: "słuch", ru: "слух", relation: root, id: sluch }
  - { pl: "niemy", ru: "немой", relation: root }
  - { pl: "głucho", ru: "глухо", relation: derived }
etymology: "Общеславянское *gluxъ, того же, что русское «глухой» и «глушь». Польское ŁU на месте русского «лу» — то же слово: GŁUCHY — «глухой». В степенях CH перед -SZY остаётся: GŁUCHSZY, а в мужском-личном переходит в S: GŁUSI."
memory: "Głuchy — глухой: głuchy na ucho, głuchy na prośby (na + винительный). Głucha cisza — мёртвая тишина. Głuchy telefon — испорченный телефон. Мн. ч. głusi. Читается «гу́хы»."
idioms:
  - { pl: "głuchy telefon", ru: "испорченный телефон" }
