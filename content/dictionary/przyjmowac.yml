# review
id: przyjmowac
format: 2
lemma: "przyjmować"
rank: 1884
pos: verb
aspect: imperf
aspectPair: przyjac
pron: { cyr: "пшыймо́ваць" }
senses:
  - id: accept
    ru: "принимать (предложение, приглашение, вызов)"
    examples:
      - pl: "Przyjmuję ofertę."
        ru: "Я принимаю предложение."
        source: { kind: translated, id: 3049239 }
      - pl: "Przyjmuję tę propozycję."
        ru: "Я принимаю это предложение."
        source: { kind: translated, id: 11619866 }
      - pl: "Przyjmuję to wyzwanie."
        ru: "Я принимаю этот вызов."
        source: { kind: translated, id: 8802787 }
      - pl: "Przyjmuję twoje zaproszenie z przyjemnością."
        ru: "Я с удовольствием принимаю твоё приглашение."
        source: { kind: translated, id: 8671627 }
      - pl: "Nie przyjmuję twoich przeprosin."
        ru: "Я не принимаю твоих извинений."
        source: { kind: translated, id: 983347 }
  - id: receive
    ru: "принимать (гостей, посетителей, оплату)"
    examples:
      - pl: "Czy przyjmuje pan w soboty?"
        ru: "Вы принимаете по субботам?"
        source: { kind: translated, id: 751509 }
      - pl: "Weterynarz dziś nie przyjmuje."
        ru: "Ветеринар сегодня не принимает."
        source: { kind: tatoeba, id: 13063065 }
      - pl: "Przyjmujemy czeki."
        ru: "Мы принимаем чеки."
        source: { kind: translated, id: 2212581 }
      - pl: "Przyjmujemy karty kredytowe."
        ru: "Мы принимаем кредитные карты."
        source: { kind: translated, id: 9677910 }
      - pl: "Ten dentysta przyjmuje jedynie po umówieniu się."
        ru: "Этот стоматолог принимает только по записи."
        source: { kind: translated, id: 951383 }
  - id: assume
    ru: "принимать (лекарство); предполагать"
    examples:
      - pl: "Mary dalej przyjmuje swoje lekarstwo, prawda?"
        ru: "Мэри всё ещё принимает своё лекарство, правда?"
        source: { kind: translated, id: 7166453 }
      - pl: "Przyjmuję, że nadal lubisz pić piwo."
        ru: "Предполагаю, что ты по-прежнему любишь пить пиво."
        source: { kind: translated, id: 3880081 }
      - pl: "Czy przyjmowanie 1800 kalorii dziennie wystarczy?"
        ru: "Достаточно ли принимать тысячу восемьсот калорий в день?"
        source: { kind: translated, id: 982398 }
notes:
  - { kind: usage, text: "Несовершенный вид к przyjąć: przyjmuję «принимаю» — przyjmę «приму»." }
  - { kind: usage, text: "Очень частое бытовое значение — «вести приём»: Lekarz dziś nie przyjmuje «Врач сегодня не принимает»." }
  - { kind: usage, text: "О платеже: Przyjmujemy karty kredytowe «Принимаем кредитные карты», Ta restauracja przyjmuje jedynie gotówkę «Этот ресторан принимает только наличные»." }
  - { kind: false-friend, text: "przyjmować не значит «приниматься за что-то». «Приняться за работу» по-польски zabrać się do pracy." }
collocations:
  - { pl: "przyjmować gości", ru: "принимать гостей" }
  - { pl: "przyjmować leki", ru: "принимать лекарства" }
  - { pl: "przyjmować karty", ru: "принимать карты" }
etymology: "przy- + jąć «брать» (праславянское *jęti). Русское «принимать» собрано точно так же: при- плюс старое «имать» «брать»."
memory: "przyjmować — несовершенный вид к przyjąć. Lekarz przyjmuje «врач принимает», przyjmujemy karty «принимаем карты», przyjmuję ofertę «принимаю предложение»."
idioms:
  - { pl: "przyjmować za dobrą monetę", ru: "принимать за чистую монету" }
  - { pl: "przyjmować do wiadomości", ru: "принимать к сведению" }
  - { pl: "przyjmować gości", ru: "принимать гостей" }
