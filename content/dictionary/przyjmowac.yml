formExamples:
  - form: "przyjmować"
    pl: "Jego opowieści lepiej przyjmować ostrożnie."
    ru: "Его рассказы лучше принимать осторожно."
    source: { kind: translated, id: 521474 }
  - form: "przyjmować"
    pl: "Nie wolno mi przyjmować w tym tygodniu gości."
    ru: "На этой неделе мне нельзя принимать гостей."
    source: { kind: translated, id: 3880112 }
  - form: "przyjmować"
    pl: "Nauczono go przyjmować rzeczy takimi, jakimi są."
    ru: "Его научили принимать вещи такими, какие они есть."
    source: { kind: translated, id: 968925 }
  - form: "przyjmowałem"
    pl: "Przez cały dzień tylko przyjmowałem reklamacje. Jestem wykończony."
    ru: "Весь день я только и принимал жалобы. Я вымотан."
    source: { kind: translated, id: 912630 }
  - form: "przyjmowałem"
    pl: "Dawniej przyjmowałem pacjentów w tym gabinecie."
    ru: "Раньше я принимал пациентов в этом кабинете."
    source: { kind: authored }
  - form: "przyjmowałem"
    pl: "Nie przyjmowałem żadnych leków."
    ru: "Я не принимал никаких лекарств."
    source: { kind: authored }
  - form: "przyjmowana"
    pl: "Przyjmowana przez niego diamorfina nie przyniosła żadnego efektu."
    ru: "Диаморфин, который он принял, не действовал."
    source: { kind: tatoeba, id: 13832453 }
  - form: "przyjmowana"
    pl: "Ustawa była przyjmowana bardzo długo."
    ru: "Закон принимали очень долго."
    source: { kind: authored }
  - form: "przyjmowana"
    pl: "Nowa zasada jest przyjmowana bez sprzeciwu."
    ru: "Новое правило принимается без возражений."
    source: { kind: authored }
  - form: "przyjmowanie"
    pl: "Czy przyjmowanie 1800 kalorii dziennie wystarczy?"
    ru: "Достаточно ли принимать тысячу восемьсот калорий в день?"
    source: { kind: translated, id: 982398 }
  - form: "przyjmowanie"
    pl: "Przyjmowanie gości to jej ulubione zajęcie."
    ru: "Приём гостей — её любимое занятие."
    source: { kind: authored }
  - form: "przyjmowanie"
    pl: "Przyjmowanie leków na czczo bywa szkodliwe."
    ru: "Приём лекарств натощак бывает вреден."
