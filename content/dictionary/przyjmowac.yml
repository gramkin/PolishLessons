  - form: "przyjmują"
    pl: "Stany Zjednoczone przyjmują imigrantów z wielu krajów."
    ru: "Соединённые Штаты принимают иммигрантов из многих стран."
    source: { kind: translated, id: 4917232 }
  - form: "przyjmują"
    pl: "Sklepy przyjmują karty."
    ru: "Магазины принимают карты."
