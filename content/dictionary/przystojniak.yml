etymology: "От PRZYSTOJNY «красивый, статный», от старого PRZYSTAĆ «подходить, приличествовать», с суффиксом -AK. Русское «пристойный» — того же корня, но другого смысла."
memory: "Przystojniak — красавчик; przystojny — красивый мужчина, а не «пристойный». Przystojniacy — красавчики. Читается «пшысто́йняк»."
