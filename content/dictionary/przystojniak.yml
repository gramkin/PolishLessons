notes:
  - { kind: false-friend, text: "PRZYSTOJNIAK — «красавчик», от PRZYSTOJNY, «красивый (о мужчине)». Обратите внимание: PRZYSTOJNY — это не «пристойный»! Пристойный — PRZYZWOITY. Красивая женщина — PIĘKNA, ŁADNA." }
  - { kind: register, text: "Разговорное, с одобрением или иронией. О себе в шутку: NO PROSZĘ, CO ZA PRZYSTOJNIAK. В официальной речи — PRZYSTOJNY MĘŻCZYZNA." }
  - { kind: usage, text: "Мужской род, лицо. Множественное — PRZYSTOJNIACY: K переходит в C. Местный и звательный — PRZYSTOJNIAKU." }
  - { kind: pronunciation, text: "Читается «пшысто́йняк»: PRZY — «пшы», NIAK — «няк». Ударение на предпоследнем слоге." }
collocations:
