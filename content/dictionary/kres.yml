etymology: "Слово общеславянское по происхождению, но русского продолжения у этого корня не осталось, и гнездо целиком польское: KRES «предел», KRESKA «черта», KREŚLIĆ «чертить». Образ в основе один — проведённая линия, за которую не идут. Русский для той же мысли взял «предел», от «переделить», и «край», от «кромки». Историческое KRESY получило имя как раз по этому образу: земли у черты, на рубеже."
memory: "Русского родственника у корня нет, поэтому гнездо учится целиком: kres «предел», kreska «черта», kreślić «чертить», skreślić «вычеркнуть». В основе образ проведённой линии. Зато оборот переносится слово в слово: położyć kres czemuś это «положить конец чему-то», с дательным в обоих языках. Множественное Kresy с большой буквы это восточные окраины давней Речи Посполитой."
idioms:
