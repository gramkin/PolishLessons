notes:
  - { kind: false-friend, text: "Русского родственника у корня нет, и это тот случай, когда гнездо надо выучить целиком: KRES «предел», KRESKA «черта», KREŚLIĆ «чертить», SKREŚLIĆ «вычеркнуть». Русский для предела берёт «предел», «конец» и «край», слова других корней. Зато конструкция совпадает полностью: POŁOŻYĆ KRES CZEMUŚ это «положить конец чему-то», с дательным падежом в обоих языках." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. В местном падеже KRESIE, с обычным смягчением. Отдельно и с большой буквы живёт множественное KRESY: так называют восточные земли давней Речи Посполитой, литовские, белорусские и украинские. Это слово культурное, с целой литературой за собой, и в текстах оно почти всегда пишется с большой буквы." }
  - { kind: government, text: "Положить конец чему-либо — POŁOŻYĆ KRES CZEMUŚ, дательный падеж без предлога, и русский строит оборот точно так же. Дойти до предела — DOJŚĆ DO KRESU, предлог DO с родительным. На восточных окраинах — NA KRESACH, предлог NA с местным падежом, как и русское «на окраинах». Без конца — BEZ KRESU, предлог BEZ с родительным." }
  - { kind: pronunciation, text: "Читается «крэс», один слог. Буква E даёт «э», а не «е», поэтому слово звучит твёрдо: «крэс», а не «крес». Конечное S глухое. В местном падеже KRESIE сочетание SIE даёт мягкое «се», и слышно «кре́се», уже с мягкостью. В множественном KRESY конечное Y даёт «ы»: «кре́сы»." }
  - { kind: register, text: "В прямом значении слово книжное и слегка торжественное: KRES ŻYCIA «конец жизни», KRES WĘDRÓWKI, DOJŚĆ DO KRESU SIŁ. В обиходной речи вместо него скажут KONIEC. Оборот POŁOŻYĆ KRES звучит официально и решительно, в газетах и в постановлениях. Множественное KRESY принадлежит истории и литературе, и для поляка оно окрашено ностальгией." }
