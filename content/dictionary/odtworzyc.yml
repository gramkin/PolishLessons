# review
id: odtworzyc
format: 2
lemma: "odtworzyć"
rank: 2175
pos: verb
aspect: perf
pron: { cyr: "оттво́жыць" }
senses:
  - id: play-back
    ru: "воспроизвести, проиграть (запись)"
    examples:
      - pl: "Wciśnij zielony przycisk, by odtworzyć nagranie, a czerwony, by je zatrzymać."
        ru: "Нажми зелёную кнопку, чтобы воспроизвести запись."
        source: { kind: translated, id: 4438893 }
      - pl: "Po ponownym odtworzeniu taśmy sędzia przyznał, że piłka przekroczyła linię."
        ru: "Пересмотрев запись, судья признал, что мяч был в игре."
        source: { kind: translated, id: 10477264 }
      - pl: "Odtwórz nagranie jeszcze raz."
        ru: "Воспроизведи запись ещё раз."
        source: { kind: authored }
  - id: recreate
    ru: "воссоздать, восстановить"
    examples:
      - pl: "Spróbuj odtworzyć muzykę w swoim umyśle."
        ru: "Попробуй воспроизвести музыку в уме."
        source: { kind: translated, id: 12329101 }
      - pl: "To trochę potrwa, ale w końcu damy radę to odtworzyć."
        ru: "Это займёт время, но в итоге мы сумеем это воссоздать."
        source: { kind: translated, id: 989359 }
notes:
  - { kind: usage, text: "Два круга употребления: техническое «воспроизвести запись» и книжное «воссоздать, восстановить по частям»." }
  - { kind: government, text: "Винительный падеж: odtworzyć nagranie «воспроизвести запись»." }
  - { kind: false-friend, text: "Корень tworzyć «творить, создавать» с приставкой od- «от-, вос-»: буквально «воссоздать». Русское «воспроизвести» построено на том же образе." }
  - { kind: usage, text: "Несовершенный вид — odtwarzać; существительное odtwarzacz значит «проигрыватель»." }
collocations:
  - { pl: "odtworzyć nagranie", ru: "воспроизвести запись" }
  - { pl: "odtworzyć przebieg", ru: "восстановить ход событий" }
etymology: "od- + tworzyć «творить, создавать»; ср. русское «воссоздать», «воспроизвести»."
memory: "odtworzyć — «воспроизвести» запись и «воссоздать» утраченное. Корень tworzyć «творить». Несовершенный вид — odtwarzać, проигрыватель — odtwarzacz."
