notes:
  - { kind: false-friend, text: "NACISK — «нажим, давление», от NACISKAĆ «нажимать». Главный оборот — KŁAŚĆ NACISK NA COŚ, буквально «класть нажим на что-то», то есть «делать упор, акцент». Во множественном NACISKI — давление в политике: ULEGŁ NACISKOM — «уступил давлению». Физическое давление газа или жидкости — CIŚNIENIE." }
  - { kind: usage, text: "Девять форм, мужской род, неодушевлённое. Родительный и местный — NACISKU. Множественное NACISKI говорит о давлении со стороны людей: NACISKI ZE STRONY RZĄDU." }
  - { kind: government, text: "Делать упор на что-то — KŁAŚĆ NACISK NA COŚ, NA с винительным. Под давлением — POD NACISKIEM, творительный. Уступить давлению — ULEC NACISKOM, дательный." }
  - { kind: pronunciation, text: "Читается «на́циск», два слога, ударение на первом. CI перед S даёт мягкое «ци», как в UŚCISK «у́сьциск». В форме NACISKU: «наци́ску»." }
  - { kind: register, text: "KŁAŚĆ NACISK — книжное и деловое, очень частое в докладах и школьных программах. WYWIERAĆ NACISK, «оказывать давление», — газетное." }
collocations:
  - { pl: "silny nacisk", ru: "сильное давление" }
  - { pl: "wywierać nacisk", ru: "оказывать давление" }
  - { pl: "naciski polityczne", ru: "политическое давление" }
family:
  - { pl: "cisnąć", ru: "жать, давить; швырнуть", relation: root }
  - { pl: "naciskać", ru: "нажимать, давить", relation: derived, id: naciskac }
  - { pl: "nacisnąć", ru: "нажать", relation: derived }
etymology: "От NACISKAĆ «нажимать», а тот от CISNĄĆ «жать, давить», праславянского глагола, общего с русскими «тискать» и «стискивать». Польское CI на месте русского «ти» — обычное смягчение."
memory: "Nacisk — нажим, давление. Читается «на́циск». Kłaść nacisk na coś — делать упор на чём-то. Pod naciskiem — под давлением. Давление газа — ciśnienie."
idioms:
  - { pl: "kłaść nacisk na coś", ru: "делать упор, акцент на чём-то" }
  - { pl: "pod naciskiem", ru: "под давлением" }
