# review
id: towarzysz
format: 2
lemma: "towarzysz"
rank: 2163
pos: noun
pron: { cyr: "това́жыш" }
senses:
  - id: companion
    ru: "спутник, товарищ (по пути, по делу)"
    examples:
      - pl: "Towarzysz podróży okazał się miły."
        ru: "Спутник оказался приятным."
        source: { kind: authored }
      - pl: "Znalazł wiernego towarzysza."
        ru: "Он нашёл верного спутника."
        source: { kind: authored }
      - pl: "Stracił towarzysza broni."
        ru: "Он потерял боевого товарища."
        source: { kind: authored }
  - id: comrade
    ru: "товарищ (партийное обращение)"
    examples:
      - pl: "Towarzyszu sekretarzu, mam pytanie."
        ru: "Товарищ секретарь, у меня вопрос."
        source: { kind: authored }
      - pl: "Towarzysze zebrali się w świetlicy."
        ru: "Товарищи собрались в клубе."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Слово то же, что русский «товарищ», и корень общий: towar «товар» плюс старый суффикс. Совпадает и основное значение. Но смотрите на производное: towarzystwo значит не «товарищество», а «ОБЩЕСТВО» или «компания» — towarzystwo ubezpieczeniowe «страховое общество», dobre towarzystwo «хорошее общество», dotrzymać komuś towarzystwa «составить кому-то компанию»." }
  - { kind: register, text: "Как обращение towarzysz намертво связано с эпохой ПНР — ровно как русское «товарищ» с советским временем. Сегодня так не обращаются: говорят panie kolego или proszę pana. Зато в сочетаниях towarzysz podróży, towarzysz broni, towarzysz niedoli слово совершенно живое и звучит нейтрально." }
  - { kind: pronunciation, text: "Три слога, ударение на предпоследнем: to-WA-rzysz, «това́жыш». rz звучит как ж, конечное sz как ш, а y как ы." }
collocations:
  - { pl: "towarzysz podróży", ru: "спутник в пути" }
  - { pl: "towarzysz broni", ru: "боевой товарищ" }
  - { pl: "dotrzymać towarzystwa", ru: "составить компанию" }
family:
  - { pl: "towar", ru: "товар", relation: root, id: towar }
  - { pl: "towarzystwo", ru: "общество, компания", relation: derived, id: towarzystwo }
  - { pl: "towarzyszyć", ru: "сопровождать", relation: derived }
  - { pl: "towarzyski", ru: "общительный, светский", relation: derived }
etymology: "От towar «товар» плюс древний суффикс: изначально «тот, с кем вместе возят товар», спутник в торговом пути. Русский «товарищ» собран точно так же и из того же корня. Отсюда towarzystwo «общество, компания», towarzyszyć «сопровождать» и towarzyski «общительный»."
memory: "towarzysz — «товарищ, спутник», слово общее с русским и от того же «товара». Главное — не ошибиться в производном: towarzystwo это «общество», а dotrzymać towarzystwa значит «составить компанию»."
idioms:
  - { pl: "towarzysz broni", ru: "боевой товарищ, соратник" }
  - { pl: "towarzysz niedoli", ru: "товарищ по несчастью" }
