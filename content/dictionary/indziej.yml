# review
id: indziej
format: 2
lemma: "indziej"
rank: 1559
pos: adv
pron: { cyr: "и́ндзей" }
senses:
  - id: elsewhere
    ru: "gdzie indziej — в другом месте"
    examples:
      - pl: "Chcę to zrobić gdzie indziej."
        ru: "Я хочу сделать это в другом месте."
        source: { kind: tatoeba, id: 12203655 }
      - pl: "Patrzyła gdzie indziej."
        ru: "Она смотрела в другую сторону."
        source: { kind: translated, id: 559506 }
      - pl: "Poszła na zakupy gdzie indziej."
        ru: "Она пошла за покупками в другое место."
        source: { kind: translated, id: 1940400 }
  - id: another-time
    ru: "kiedy indziej — в другой раз"
    examples:
      - pl: "Zróbmy to kiedy indziej."
        ru: "Сделаем это в другой раз."
        source: { kind: translated, id: 6554343 }
      - pl: "W szachy zagramy kiedy indziej."
        ru: "В шахматы сыграем в другой раз."
        source: { kind: translated, id: 356936 }
      - pl: "Moglibyśmy to zrobić kiedy indziej."
        ru: "Мы могли бы сделать это в другой раз."
        source: { kind: translated, id: 3718714 }
notes:
  - { kind: usage, text: "Слово несамостоятельное: оно всегда идёт после вопросительного или отрицательного слова — gdzie indziej «в другом месте», kiedy indziej «в другой раз», nigdzie indziej «нигде больше», nigdy indziej «никогда больше»." }
  - { kind: usage, text: "Порядок обратный русскому: по-польски впереди стоит вопросительное слово (gdzie indziej), а по-русски вопросительного слова нет вовсе — «в другом месте»." }
  - { kind: usage, text: "Вариант gdzieś indziej значит «где-нибудь ещё, куда-нибудь ещё»: Mógłbyś robić to gdzieś indziej? «Ты мог бы делать это где-нибудь ещё?»." }
  - { kind: usage, text: "Форма одна: слово не склоняется и не имеет степеней сравнения." }
collocations:
  - { pl: "gdzie indziej", ru: "в другом месте" }
  - { pl: "kiedy indziej", ru: "в другой раз" }
  - { pl: "nigdzie indziej", ru: "нигде больше" }
etymology: "Старая форма от inny «другой» (праславянское *jьnъ), застывшая в наречии. Русское «иной» — то же слово, но подобного наречия русский не сохранил, поэтому переводить приходится описательно."
memory: "indziej само по себе не употребляется — оно живёт только в паре: gdzie indziej «в другом месте», kiedy indziej «в другой раз», nigdzie indziej «нигде больше». Запоминайте не слово, а эти пары целиком."
idioms:
