# review
id: willa
format: 2
lemma: "willa"
rank: 1253
pos: noun
pron: { cyr: "ви́ля" }
senses:
  - id: villa
    ru: "вилла, загородный особняк"
    examples:
      - pl: "Willa stoi nad jeziorem."
        ru: "Вилла стоит у озера."
        source: { kind: authored }
      - pl: "Doszli do dzielnicy bogaczy i stanęli przed ładną willą."
        ru: "Они дошли до квартала богачей и остановились перед красивой виллой."
        source: { kind: translated, id: 2279153 }
      - pl: "Gabor mieszka w nawiedzonej willi."
        ru: "Габор живёт в вилле с привидениями."
        source: { kind: translated, id: 12040879 }
  - id: house
    ru: "отдельный дом с садом (в противоположность квартире в блоке)"
    examples:
      - pl: "Gdyby Maria wygrała dużo pieniędzy w Lotto, pewnie kupiłaby sobie willę."
        ru: "Если бы Мария выиграла много денег в лотерею, она наверняка купила бы себе виллу."
        source: { kind: translated, id: 13074641 }
      - pl: "Kupili willę z ogrodem pod miastem."
        ru: "Они купили виллу с садом за городом."
        source: { kind: authored }
      - pl: "Ta willa ma basen i duży taras."
        ru: "У этой виллы есть бассейн и большая терраса."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Willa — не просто «дом», а отдельно стоящий богатый дом с садом, обычно за городом. Обычный дом — dom, квартира в многоэтажке — mieszkanie w bloku." }
  - { kind: pronunciation, text: "Двойное ll читается как одно л: «ви́ля». Ударение на первый слог." }
  - { kind: usage, text: "Форма will в текстах почти всегда оказывается английским именем Will, а не родительным падежом множественного числа от willa." }
collocations:
  - { pl: "willa z ogrodem", ru: "вилла с садом" }
  - { pl: "mieszkać w willi", ru: "жить в вилле" }
  - { pl: "luksusowa willa", ru: "роскошная вилла" }
etymology: "Из латинского villa «загородное поместье» через итальянский и немецкий — тот же путь, каким слово пришло в русский."
memory: "willa — «вилла», отдельный богатый дом с садом за городом. Двойное ll читается как одно л: ви́ля. Осторожно: форма will в корпусе — это английское имя Will, а не форма этого слова."
idioms:
  - { pl: "willa z ogrodem", ru: "вилла с садом" }
  - { pl: "luksusowa willa", ru: "роскошная вилла" }
  - { pl: "mieszkać w willi", ru: "жить в вилле" }
formExamplesSkip:
  - { form: "willo", reason: "звательный падеж: для неодушевлённого существительного он практически не употребляется" }
