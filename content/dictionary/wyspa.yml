        ru: "На Галапагосских островах есть много видов гигантских черепах."
        source: { kind: tatoeba, id: 975080 }
notes:
  - { kind: usage, text: "Женский род: ta wyspa, tej wyspy. На острове — na wyspie, предложный; на остров — na wyspę, винительный." }
  - { kind: usage, text: "Полуостров — półwysep, и он уже мужского рода: ten półwysep." }
  - { kind: usage, text: "Названия архипелагов идут во множественном: Wyspy Brytyjskie «Британские острова», Wyspy Owcze «Фарерские острова»." }
  - { kind: usage, text: "wyspa kuchenna — «кухонный остров», та самая отдельно стоящая тумба на кухне." }
collocations:
  - { pl: "na wyspie", ru: "на острове" }
  - { pl: "bezludna wyspa", ru: "необитаемый остров" }
  - { pl: "Wyspy Brytyjskie", ru: "Британские острова" }
  - { pl: "wyspa kuchenna", ru: "кухонный остров" }
family:
  - { pl: "wyspiarz", ru: "островитянин", relation: derived }
  - { pl: "wyspiarski", ru: "островной", relation: derived }
  - { pl: "półwysep", ru: "полуостров", relation: derived }
etymology: "От приставки wy- и корня, родственного sypać «сыпать» — «намытое, нанесённое водой». Русский «остров» собран совсем иначе, от «об-текать»."
memory: "wyspa — «остров», женский род. На острове — na wyspie, на остров — na wyspę. А полуостров это półwysep, уже мужского рода."
idioms:
  - { pl: "bezludna wyspa", ru: "необитаемый остров" }
  - { pl: "Wyspy Brytyjskie", ru: "Британские острова" }
formExamplesSkip:
