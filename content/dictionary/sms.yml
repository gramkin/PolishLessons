notes:
  - { kind: usage, text: "Два написания, и оба правильные. Можно писать с дефисом, сохраняя аббревиатуру заглавными: SMS-A, SMS-EM, SMS-ÓW. Можно писать слитно и строчными, как обычное слово: SMSA, SMSEM, SMSÓW. Первый способ строже и принят в официальных текстах, второй обычен в живой речи и в интернете. Выберите один и держитесь его в пределах текста. Родительный падеж единственного числа тоже двойной: SMS-A и SMS-U, то есть всего четыре правильные формы одного падежа." }
  - { kind: false-friend, text: "Самое важное различие не в значении, а в грамматике. Русское «СМС» не склоняется вовсе: «я получил СМС», «нет СМС», «пришло две СМС» — форма одна на все падежи. Польский поступает наоборот: он принимает аббревиатуру в язык как обычное существительное мужского рода и склоняет её полностью — DOSTAŁEM SMS-A, NIE MA SMS-A, PRZYSZŁY DWA SMS-Y. Это общее польское правило, а не особенность слова: заимствованные аббревиатуры в польском получают падежные окончания." }
  - { kind: pronunciation, text: "Читается по буквам, «эсэ́мэс», с ударением на предпоследнем слоге — то есть на среднем «мэ». Польские названия букв здесь: S — «эс», M — «эм». В косвенных падежах окончание просто прибавляется к этому чтению: SMS-A — «эсэмэ́са», SMS-EM — «эсэмэ́сэм». Встречается и полностью ослитнённое написание ESEMES, которое передаёт это чтение напрямую." }
  - { kind: government, text: "Существительное мужского рода неодушевлённое, поэтому винительный падеж формально совпадает с именительным: WYŚLIJ SMS. Но в живой речи почти всегда говорят WYŚLIJ SMS-A, с окончанием родительного, — так польский обращается со многими неодушевлёнными словами, когда они обозначают нечто отдельное и исчислимое. Обе формы приняты. Способ связи передаётся творительным без предлога: SMSEM, SMS-EM «по СМС», как и MAILEM, TELEFONEM." }
