etymology: "Английская аббревиатура от SHORT MESSAGE SERVICE «служба коротких сообщений» — название технической услуги, которое в обиходе стало названием самого сообщения. В польский слово пришло в конце девяностых вместе с мобильными телефонами и сразу начало склоняться, потому что польская морфология не терпит неизменяемых слов: всё, что ведёт себя как существительное, получает падежные окончания. Отсюда и двойное написание — орфографическое правило требует дефиса, когда основа остаётся заглавной, а живая речь предпочла записывать слово строчными и слитно. Русский пошёл другим путём и оставил аббревиатуру несклоняемой."
memory: "Польский склоняет аббревиатуры: dostałem SMS-a, dwa smsy. Русский «СМС» не склоняет вовсе — это главное отличие. Два написания, SMS-a и smsa, оба верные; родительный двойной: SMS-a и SMS-u."
