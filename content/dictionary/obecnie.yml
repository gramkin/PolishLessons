# review
id: obecnie
format: 2
lemma: "obecnie"
rank: 1905
pos: adv
pron: { cyr: "обэ́цне" }
senses:
  - id: now
    ru: "сейчас, в настоящее время"
    examples:
      - pl: "Obecnie mieszkam na wsi."
        ru: "Сейчас я живу в деревне."
        source: { kind: tatoeba, id: 12569619 }
      - pl: "Obecnie pracujemy."
        ru: "Сейчас мы работаем."
        source: { kind: translated, id: 7783264 }
      - pl: "Obecnie jest w szpitalu."
        ru: "Сейчас он в больнице."
        source: { kind: translated, id: 983050 }
      - pl: "Pracuję obecnie w Bostonie."
        ru: "Сейчас я работаю в Бостоне."
        source: { kind: translated, id: 3033934 }
      - pl: "Obecnie w tym domu nikt nie mieszka."
        ru: "Сейчас в этом доме никто не живёт."
        source: { kind: tatoeba, id: 582918 }
      - pl: "Obecnie ceny stoją wysoko."
        ru: "В настоящее время цены высокие."
        source: { kind: translated, id: 605165 }
notes:
  - { kind: usage, text: "Книжнее и официальнее, чем teraz: obecnie ближе к русскому «в настоящее время», teraz — к «сейчас»." }
  - { kind: usage, text: "Неизменяемое наречие: форма всего одна, по падежам и родам не меняется." }
  - { kind: false-friend, text: "Не связано с русским «обеспечить» или «обещать». Корень тот же, что в obecny «присутствующий» и obecność «присутствие»." }
collocations:
  - { pl: "obecnie mieszkam", ru: "сейчас я живу" }
  - { pl: "obecnie pracuje", ru: "сейчас работает" }
  - { pl: "obecnie nie", ru: "в настоящее время нет" }
etymology: "От obecny «присутствующий», а то — от ob- + być «быть». Буквально «то, что есть сейчас». Русское «в настоящее время» собрано из другого материала, но говорит ровно о том же."
memory: "obecnie — «в настоящее время», книжный сосед разговорного teraz. Obecnie mieszkam na wsi «Сейчас я живу в деревне»."
idioms:
  - { pl: "obecnie nie", ru: "в настоящее время нет" }
  - { pl: "obecnie mieszkam", ru: "сейчас я живу" }
  - { pl: "jak obecnie", ru: "как сейчас" }
