id: won
format: 2
lemma: "woń"
rank: 2525
pos: noun
pron: { cyr: "вонь" }
senses:
  - id: scent
    ru: "аромат, запах (чаще приятный)"
    examples:
      - pl: "W powietrzu unosi się woń róż."
        ru: "В воздухе витает аромат роз."
        source: { kind: translated, id: 357958 }
      - pl: "Żywiczna woń dziewiczych lasów iglastych."
        ru: "Смолистый аромат девственных хвойных лесов."
        source: { kind: translated, id: 13041613 }
      - pl: "Woń kwiatów wypełniła pokój."
        ru: "Аромат цветов наполнил комнату."
        source: { kind: authored }
  - id: fragrance
    ru: "благоухание (книжное)"
    examples:
      - pl: "Czuć woń świeżego chleba."
        ru: "Чувствуется запах свежего хлеба."
        source: { kind: authored }
      - pl: "Woń kadzidła unosiła się w kościele."
        ru: "Запах ладана витал в костёле."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ГЛАВНАЯ ловушка: woń — это ПРИЯТНЫЙ запах, аромат, а русская «вонь» — наоборот. Дурной запах по-польски smród." }
  - { kind: government, text: "Женский род на мягкую согласную: ta woń, tej woni." }
  - { kind: usage, text: "Слово книжное; в обычной речи скажут zapach «запах», нейтральное." }
  - { kind: usage, text: "Осторожно: разговорное Won! значит «Вон!» — это другое слово, грубый окрик." }
collocations:
