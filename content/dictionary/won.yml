etymology: "Праславянское *vonja «запах»; русская «вонь» — то же слово, но значение стало отрицательным."
memory: "woń — это ПРИЯТНЫЙ запах, аромат, в отличие от русской «вони». Дурной запах — smród, нейтральный — zapach."
