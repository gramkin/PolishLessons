notes:
  - { kind: false-friend, text: "INSTYTUT — прежде всего научно-исследовательский институт. Русский «институт» в смысле вуза по-польски — UCZELNIA или SZKOŁA WYŻSZA. Внутри университета INSTYTUT — это крупное подразделение, вроде отделения или кафедры." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Родительный — INSTYTUTU, в местном T переходит в C: W INSTYTUCIE." }
