  - form: "łącznie"
    pl: "W konkursie wzięło udział łącznie pięćdziesiąt osób."
    ru: "В конкурсе участвовало в общей сложности пятьдесят человек."
    source: { kind: authored }
  - form: "łącznie"
    pl: "Łącznie z dziećmi było nas dziesięcioro."
    ru: "Вместе с детьми нас было десять человек."
    source: { kind: authored }
