# review
id: lacznie
format: 2
lemma: "łącznie"
rank: 4516
pos: adv
pron: { cyr: "уо́нчне" }
senses:
  - id: in-total
    ru: "в общей сложности, всего"
    examples:
      - pl: "Ile to kosztuje łącznie?"
        ru: "Сколько это стоит в сумме?"
        source: { kind: authored }
      - pl: "Pracował tam łącznie dwadzieścia lat."
        ru: "В общей сложности он проработал там двадцать лет."
        source: { kind: authored }
      - pl: "Kurs trwa łącznie sześć tygodni."
        ru: "Курс длится всего шесть недель."
        source: { kind: authored }
  - id: including
    ru: "включая, вместе с (ŁĄCZNIE Z)"
    examples:
      - pl: "Cena łącznie z podatkiem wynosi sto złotych."
        ru: "Цена с учётом налога — сто злотых."
        source: { kind: authored }
      - pl: "Wszyscy, łącznie z dyrektorem, przyszli na imprezę."
        ru: "Все, включая директора, пришли на вечеринку."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ŁĄCZNIE — «в общей сложности, всего», от ŁĄCZYĆ «соединять». На слух оно может напомнить русское «лучше», но к нему отношения не имеет: «лучше» — LEPIEJ." }
  - { kind: usage, text: "Наречие, одна форма, без степеней. Часто стоит при числах и суммах: ŁĄCZNIE STO OSÓB, ŁĄCZNIE DWA TYSIĄCE ZŁOTYCH. Прилагательное — ŁĄCZNY: ŁĄCZNA KWOTA, «общая сумма»." }
  - { kind: government, text: "Включая что-то — ŁĄCZNIE Z и творительный падеж: ŁĄCZNIE Z PODATKIEM, ŁĄCZNIE Z DZIEĆMI. В русском «включая» требует винительного, а польский оборот — буквально «вместе с»." }
  - { kind: pronunciation, text: "Читается «уо́нчне», ударение на первом слоге. Ł — «у», Ą перед CZ — «он», как в ŁĄCZYĆ «уо́нчыць»." }
collocations:
  - { pl: "łącznie z podatkiem", ru: "с учётом налога" }
  - { pl: "kosztować łącznie", ru: "стоить в сумме" }
  - { pl: "łącznie sto osób", ru: "всего сто человек" }
family:
  - { pl: "łączyć", ru: "соединять", relation: root, id: laczyc }
  - { pl: "połączenie", ru: "соединение, связь", relation: root, id: polaczenie }
  - { pl: "łączny", ru: "общий, совокупный", relation: root }
etymology: "От ŁĄCZNY «совокупный», а то — от ŁĄCZYĆ «соединять». Польское Ą на месте русского «у»: корень тот же, что в старом русском «лучить», «соединять», и в «случай», «улучить»."
memory: "Łącznie — в общей сложности; łącznie z — включая (+ творительный). Читается «уо́нчне». Łączyć — соединять."
idioms:
  - { pl: "łączyć przyjemne z pożytecznym", ru: "совмещать приятное с полезным" }
formExamples:
