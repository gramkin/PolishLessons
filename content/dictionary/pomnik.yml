# review
id: pomnik
format: 2
lemma: "pomnik"
rank: 6057
pos: noun
pron: { cyr: "по́мник" }
senses:
  - id: monument
    ru: "памятник, монумент"
    examples:
      - pl: "Pomnik został ustawiony w parku."
        ru: "Памятник установили в парке."
        source: { kind: translated, id: 1348818 }
      - pl: "Ustawili bohaterowi pomnik z brązu."
        ru: "Герою поставили бронзовый памятник."
        source: { kind: translated, id: 3655430 }
      - pl: "Pomnik został wzniesiony ku pamięci poległych."
        ru: "Памятник воздвигли в память о погибших."
        source: { kind: translated, id: 3188199 }
  - id: gravestone
    ru: "надгробие, надгробный памятник"
    examples:
      - pl: "Na grobie dziadka postawiliśmy skromny pomnik."
        ru: "На могиле дедушки мы поставили скромный памятник."
        source: { kind: authored }
      - pl: "Kamieniarz wyrył na pomniku datę śmierci."
        ru: "Каменщик выбил на надгробии дату смерти."
        source: { kind: authored }
  - id: lasting-work
    ru: "перен. памятник (о произведении, наследии)"
    examples:
      - pl: "Ta katedra to pomnik średniowiecznej architektury."
        ru: "Этот собор — памятник средневековой архитектуры."
        source: { kind: authored }
notes:
  - { kind: usage, text: "POMNIK — и «памятник на площади», и «надгробие» на кладбище: postawić pomnik na grobie. Охраняемый государством старинный объект, «памятник архитектуры» в смысле реестра, — чаще ZABYTEK: zabytek architektury. POMNIK PRZYRODY — «памятник природы», старое дерево или скала под охраной." }
  - { kind: government, text: "Кому — дательный: pomnik Mickiewiczowi, «памятник Мицкевичу», как в русском. Но в названиях обычно родительный: Pomnik Mickiewicza, Pomnik Lenina. Ku czci, ku pamięci + родительный — «в честь, в память»." }
  - { kind: pronunciation, text: "Читается «по́мник», ударение на первом слоге, M и N произносятся оба, M перед мягким N тоже смягчается. В творительном после K — -IEM: pomnikiem, «помни́кем»." }
  - { kind: register, text: "Нейтральное. Выражение ZBUDOWAĆ SOBIE POMNIK, «воздвигнуть себе памятник», книжное, как у Горация и Пушкина; PAMIĄTKA — другое слово: «сувенир, память о чём-то»." }
collocations:
  - { pl: "postawić pomnik", ru: "поставить памятник" }
  - { pl: "odsłonić pomnik", ru: "открыть памятник" }
  - { pl: "pomnik przyrody", ru: "памятник природы" }
  - { pl: "złożyć kwiaty pod pomnikiem", ru: "возложить цветы к памятнику" }
family:
  - { pl: "pomnikowy", ru: "монументальный", relation: derived }
  - { pl: "pamięć", ru: "память", relation: root, id: pamiec }
  - { pl: "wspomnienie", ru: "воспоминание", relation: root, id: wspomnienie }
etymology: "От старопольского POMNIEĆ, «помнить», тот же корень, что в русском «помнить» и в польском WSPOMNIENIE, «воспоминание». POMNIK — буквально «то, что заставляет помнить», и русское «памятник» построено по той же мысли, только от слова «память»."
memory: "Pomnik — памятник: то, что велит pomnieć, «помнить». И на площади, и на могиле. Старинное здание под охраной — zabytek. Pomnik przyrody — памятник природы."
idioms:
  - { pl: "pomnik przyrody", ru: "памятник природы (охраняемое дерево, скала)" }
  - { pl: "wystawić komuś pomnik", ru: "увековечить кого-то, воздвигнуть памятник" }
