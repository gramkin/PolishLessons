# review
id: zdradzac
format: 2
lemma: "zdradzać"
rank: 2907
pos: verb
aspect: imperf
aspectPair: zdradzic
pron: { cyr: "здра́дзаць" }
senses:
  - id: betray
    ru: "предавать; изменять (супругу)"
    examples:
      - pl: "Zdradza cię!"
        ru: "Она тебе изменяет!"
        source: { kind: translated, id: 12072953 }
      - pl: "Mąż cię zdradza."
        ru: "Муж тебе изменяет."
        source: { kind: translated, id: 6155089 }
      - pl: "Nie powinno się zdradzać przyjaciół."
        ru: "Не следует предавать друзей."
        source: { kind: translated, id: 603345 }
  - id: reveal
    ru: "выдавать, раскрывать (тайну, чувство)"
    examples:
      - pl: "Nie mam zamiaru zdradzać ci jej imienia."
        ru: "Я не собираюсь раскрывать тебе её имя."
        source: { kind: translated, id: 6155559 }
      - pl: "Jego twarz zdradzała, że był zdenerwowany."
        ru: "Его лицо выдавало, что он нервничал."
        source: { kind: translated, id: 3016103 }
notes:
  - { kind: usage, text: "Совершенный вид — zdradzić." }
  - { kind: usage, text: "Три значения сразу: «предавать», «изменять супругу» и «выдавать, раскрывать тайну»." }
  - { kind: government, text: "zdradzać kogoś — винительный падеж, тогда как русское «изменять кому» требует дательного: zdradzać żonę «изменять жене»." }
  - { kind: false-friend, text: "Корень тот же, что в украинском «зрада» и русском «предать»; но управление в польском другое." }
  - { kind: usage, text: "Второе значение — «выдавать, обнаруживать»: oczy zdradzały zmęczenie «глаза выдавали усталость», dziecko zdradzało talent «ребёнок обнаруживал талант»." }
collocations:
  - { pl: "zdradzać tajemnicę", ru: "выдавать тайну" }
  - { pl: "zdradzać żonę", ru: "изменять жене" }
etymology: "Праславянское *sъ-rada «сговор против кого-л.» → «предательство»; ср. украинское «зрада» и русское «предать»."
memory: "zdradzać — «предавать», «изменять» и «выдавать тайну» сразу. Ловушка в падеже: zdradzać żonę — винительный, а русское «изменять жене» — дательный. Совершенный вид — zdradzić."
idioms:
  - { pl: "zdradzać tajemnicę", ru: "выдавать тайну" }
