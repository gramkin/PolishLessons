# review
id: tata
format: 2
lemma: "tata"
rank: 166
pos: noun
pron: { cyr: "та́та" }
senses:
  - id: dad
    ru: "папа, отец (разговорно)"
    examples:
      - pl: "Tata jest w szpitalu."
        ru: "Папа в больнице."
        source: { kind: tatoeba, id: 12959976 }
      - pl: "Tata i mama poszli na rynek."
        ru: "Папа с мамой пошли на рынок."
        source: { kind: tatoeba, id: 2734068 }
      - pl: "Jestem waszym tatą."
        ru: "Я ваш папа."
        source: { kind: tatoeba, id: 6553627 }
  - id: vocative
    ru: "папа! (обращение — форма tato)"
    examples:
      - pl: "Tato, Mary mnie uderzyła."
        ru: "Папа, Мэри ударила меня!"
        source: { kind: tatoeba, id: 2148519 }
      - pl: "Tato, chodź tutaj!"
        ru: "Папа, иди сюда!"
        source: { kind: authored }
      - pl: "Dziękuję, tato."
        ru: "Спасибо, папа."
        source: { kind: authored }
notes:
  - { kind: usage, text: "tata склоняется как существительное женского рода: taty, tacie, tatą — хотя обозначает мужчину. Точно так же ведёт себя русское «папа»." }
  - { kind: usage, text: "Звательная форма — tato!, а не «tata!»: Tato, poczekaj! «Папа, подожди!»." }
  - { kind: register, text: "tata разговорное и тёплое; нейтральное и официальное слово — ojciec." }
collocations:
  - { pl: "mój tata", ru: "мой папа" }
  - { pl: "tata z mamą", ru: "папа с мамой" }
  - { pl: "u taty", ru: "у папы" }
  - { pl: "być tatą", ru: "быть отцом" }
etymology: "Праславянское *tata — слово из детской речи, как и русское «тятя, папа»; родственники есть в санскрите и греческом."
memory: "tata склоняется по женскому образцу (taty, tacie, tatą), хотя это мужчина, — ровно как русское «папа». Звательная форма — tato!"
idioms:
  - { pl: "tata z mamą", ru: "папа с мамой" }
  - { pl: "kochany tato", ru: "дорогой папа" }
  - { pl: "u taty", ru: "у папы" }
