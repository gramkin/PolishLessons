notes:
  - { kind: false-friend, text: "Корень тот же, что в русской «записи», и значение близко, но род другой, и это меняет каждое согласование: польское ZAPIS мужского рода — TEN ZAPIS, NOWY ZAPIS, — а русская «запись» женского. Второе различие в объёме. ZAPIS это письменная фиксация и, очень часто, пункт документа: ZAPIS USTAWY значит «положение закона», а не «запись закона». Третье: звуко- и видеозапись по-польски NAGRANIE, от NAGRAĆ, и ZAPIS в этом смысле звучит технически, о носителе. Четвёртое: ZAPIS в завещании означает отказ имущества, то есть распоряжение в пользу кого-то." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Местный единственного — ZAPISIE, где конечное S основы смягчается в SI перед окончанием -E. Вместе с POSADZIE и NERWIE это полный ряд смягчений перед -E на трёх разных согласных. Родительный единственного — ZAPISU. Винительный равен именительному. Множественное ZAPISY употребляется в двух особых значениях: положения документа и запись на курс, приём, в школу — ZAPISY NA KURS RUSZAJĄ W PONIEDZIAŁEK, и в этом смысле слово всегда во множественном." }
  - { kind: pronunciation, text: "Читается «за́пис», два слога, ударение на первом. Буква Z звонкая, «з», а конечное S глухое, «с». Буква I между P и S смягчает P: звучит «пи». В форме ZAPISU слышно «запи́су», с ударением на втором слоге. В форме ZAPISIE сочетание SIE даёт мягкое «се»: «запи́се». В форме ZAPISÓW буква Ó даёт «у», а конечное W оглушается: «запи́суф». Ударение во всех формах предпоследнее." }
  - { kind: register, text: "Слово нейтральное, но тяготеет к канцелярскому и юридическому языку. Устойчивые сочетания: ZAPIS W UMOWIE, ZAPIS USTAWOWY, ZAPIS TESTAMENTOWY «завещательный отказ», ZAPISY NA STUDIA «запись в вуз». В музыке ZAPIS NUTOWY означает нотную запись, в технике ZAPIS CYFROWY «цифровая запись». Производные: ZAPISAĆ, ZAPISEK и ZAPISKI «заметки, записки», ZAPISOBIERCA — юридический термин для того, в чью пользу сделан отказ. Разговорного или переносного употребления у слова нет." }
