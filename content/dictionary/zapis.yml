etymology: "Отглагольное существительное от ZAPISAĆ, то есть приставка ZA- и корень *pis- «писать», праславянский и общий с русским. Исходное значение корня было «резать, царапать», откуда и «писать», и «пёстрый»: писали сначала нарезая знаки. Русский построил от того же глагола существительное женского рода с нулевым суффиксом, «запись», а польский — мужского, ZAPIS, и в этом вся разница. Та же пара видна и в других словах: польское PRZEPIS «рецепт, предписание» против русского «предписания», польское PODPIS «подпись» мужского рода против русской «подписи» женского. Правило устойчивое: там, где русский даёт отглагольное имя на мягкий знак, польский чаще даёт мужское без окончания."
memory: "Корень как в «записи», но род другой: польское zapis мужского рода, ten zapis, и так же podpis «подпись», przepis «рецепт» — целый ряд, где русский даёт женское на мягкий знак, а польский мужское без окончания. Объём шире: zapis ustawy значит «положение закона». Аудио- и видеозапись это nagranie. Множественное zapisy значит ещё и запись на курс. Местный zapisie со смягчением s→si."
