  - { kind: usage, text: "Основное словарное значение — «сплав»: stop żelaza z węglem «сплав железа с углеродом»." }
  - { kind: usage, text: "Второе значение заимствованное: Stop! как команда и знак «стоп», а также non stop «без остановки»." }
