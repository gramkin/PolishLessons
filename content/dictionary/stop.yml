etymology: "В значении «сплав» — от stopić «сплавить», от topić «плавить». В значении «стоп» — заимствование из английского stop. Два разных источника сошлись в одном слове."
memory: "stop — прежде всего «сплав»: stop żelaza z węglem. Заимствованное значение — команда и знак «стоп», а также non stop. Главная ловушка: формы stopy, stopie, stopach принадлежат слову stopa «нога»."
