# review
id: prosba
format: 2
lemma: "prośba"
rank: 1928
pos: noun
pron: { cyr: "про́сьба" }
senses:
  - id: request
    ru: "просьба"
    examples:
      - pl: "Mam prośbę."
        ru: "У меня просьба."
        source: { kind: translated, id: 2680631 }
      - pl: "Mam do ciebie prośbę."
        ru: "У меня к тебе просьба."
        source: { kind: translated, id: 1180291 }
      - pl: "Mam do ciebie jedną prośbę."
        ru: "У меня к тебе есть одна просьба."
        source: { kind: tatoeba, id: 13785904 }
      - pl: "To nie była prośba."
        ru: "Это была не просьба."
        source: { kind: translated, id: 5166373 }
      - pl: "To nietypowa prośba."
        ru: "Это необычная просьба."
        source: { kind: translated, id: 6374267 }
      - pl: "Jego prośba jest uzasadniona."
        ru: "Его просьба обоснованна."
        source: { kind: translated, id: 4881832 }
  - id: refuse-request
    ru: "отказать в просьбе, отклонить просьбу"
    examples:
      - pl: "Odrzuciła moją prośbę."
        ru: "Она отклонила мою просьбу."
        source: { kind: translated, id: 368095 }
      - pl: "Odmawiam jego prośbie."
        ru: "Я отказываю в его просьбе."
        source: { kind: translated, id: 730403 }
      - pl: "Jest nam bardzo przykro, ale nie możemy spełnić Pańskiej prośby."
        ru: "Нам очень жаль, но мы не можем выполнить вашей просьбы."
        source: { kind: tatoeba, id: 4725794 }
notes:
  - { kind: government, text: "Отказать в просьбе — odmówić prośbie, с дательным падежом: odmówił jej prośbie. А отклонить просьбу — odrzucić prośbę, с винительным." }
  - { kind: usage, text: "Обратите внимание на чередование: prośba, но w prośbie, и родительный множественного próśb с ó." }
  - { kind: usage, text: "Оборот na prośbę kogoś значит «по чьей-либо просьбе»: zrobiłem to na jego prośbę." }
  - { kind: usage, text: "Существительное к карточке prosić «просить»." }
  - { kind: government, text: "Родительный падеж множественного числа — próśb, с ó и без гласной между согласными: prośba, ale nie mam próśb." }
collocations:
  - { pl: "mam prośbę", ru: "у меня просьба" }
  - { pl: "na prośbę", ru: "по просьбе" }
  - { pl: "odmówić prośbie", ru: "отказать в просьбе" }
etymology: "От prosić «просить», праславянское *prositi. Русское «просьба» образовано от того же глагола тем же суффиксом."
memory: "prośba — «просьба». Главное — падежи: odmówić prośbie «отказать в просьбе» (дательный), но odrzucić prośbę «отклонить просьбу» (винительный)."
idioms:
  - { pl: "mam prośbę", ru: "у меня просьба" }
  - { pl: "na własną prośbę", ru: "по собственной просьбе" }
  - { pl: "odmówić prośbie", ru: "отказать в просьбе" }
