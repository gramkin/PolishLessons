# review
id: wstawac
format: 2
lemma: "wstawać"
rank: 912
pos: verb
aspect: imperf
pron: { cyr: "фста́ваць" }
senses:
  - id: get-up
    ru: "вставать (с постели)"
    examples:
      - pl: "Tom wstaje o szóstej."
        ru: "Том встаёт в шесть."
        source: { kind: tatoeba, id: 4491089 }
      - pl: "Zawsze wstaję o szóstej."
        ru: "Я всегда встаю в шесть."
        source: { kind: tatoeba, id: 731912 }
      - pl: "O której wstajesz?"
        ru: "Во сколько ты встаёшь?"
        source: { kind: tatoeba, id: 545054 }
  - id: time-to
    ru: "pora wstawać — пора вставать"
    examples:
      - pl: "Pora wstawać."
        ru: "Пора вставать."
        source: { kind: tatoeba, id: 4917222 }
      - pl: "Powinieneś się wcześnie kłaść spać i wcześnie wstawać."
        ru: "Ты должен рано рано ложиться спать и рано вставать."
        source: { kind: tatoeba, id: 3603549 }
      - pl: "Wstawaj i do boju!"
        ru: "Проснись и пой!"
        source: { kind: tatoeba, id: 771763 }
  - id: noun
    ru: "wstawanie — вставание, подъём"
    examples:
      - pl: "On przywykł do wczesnego wstawania."
        ru: "Он привык рано вставать."
        source: { kind: translated, id: 644986 }
      - pl: "Tom nienawidzi wstawania wcześnie rano."
        ru: "Том ненавидит рано вставать по утрам."
        source: { kind: translated, id: 3297246 }
      - pl: "Nie mam nic przeciwko wstawaniu o szóstej."
        ru: "Я не против того, чтобы вставать в шесть."
        source: { kind: tatoeba, id: 526053 }
notes:
  - { kind: usage, text: "Настоящее время образуется не от основы инфинитива, а как у dawać: wstaję, wstajesz, wstaje, wstajemy, wstajecie, wstają. Повелительное же идёт от инфинитива: wstawaj! «вставай!»." }
  - { kind: usage, text: "Совершенный вид — wstać: Wstałem o szóstej «Я встал в шесть». Несовершенный описывает привычку: Zawsze wstaję o szóstej." }
  - { kind: usage, text: "kto rano wstaje, temu Pan Bóg daje — «кто рано встаёт, тому Бог подаёт». Пословица совпадает с русской почти дословно." }
  - { kind: usage, text: "wstawać lewą nogą — «встать не с той ноги»; по-польски нога именно левая. Существительное — wstawanie «вставание, подъём»." }
collocations:
  - { pl: "pora wstawać", ru: "пора вставать" }
  - { pl: "wstawaj!", ru: "вставай!" }
  - { pl: "wcześnie wstawać", ru: "рано вставать" }
  - { pl: "wstawać lewą nogą", ru: "встать не с той ноги" }
family:
  - { pl: "wstać", ru: "встать", relation: aspect }
  - { pl: "wstawanie", ru: "вставание", relation: derived }
  - { pl: "stać", ru: "стоять", relation: root, id: stac }
etymology: "Из w- + stawać, от stać «стоять». Русское «вставать» собрано ровно так же, и вся семья совпадает: wstać — встать, stać — стоять."
memory: "wstawać — «вставать». Спряжение идёт не от инфинитива, а как у dawać: wstaję, wstajesz, wstaje. Зато повелительное от инфинитива: wstawaj! Совершенный вид — wstać. И пословица совпадает с русской: kto rano wstaje, temu Pan Bóg daje."
idioms:
  - { pl: "pora wstawać", ru: "пора вставать" }
  - { pl: "kto rano wstaje, temu Pan Bóg daje", ru: "кто рано встаёт, тому Бог подаёт" }
  - { pl: "wstawać lewą nogą", ru: "встать не с той ноги" }
formExamplesSkip:
  - { form: "wstawano", reason: "wstawać — непереходный глагол: страдательных форм он не образует" }
