etymology: "Отрицание nie плюс daleko «далеко» — ровно как русское «недалеко». Слова собраны одинаково и пишутся слитно оба."
memory: "niedaleko — «недалеко», пишется слитно. От чего — niedaleko od czegoś. И пословица та же: Niedaleko pada jabłko od jabłoni."
idioms:
