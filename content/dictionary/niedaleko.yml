# review
id: niedaleko
format: 2
lemma: "niedaleko"
rank: 1903
pos: adv
pron: { cyr: "недале́ко" }
senses:
  - id: nearby
    ru: "недалеко, близко"
    examples:
      - pl: "To niedaleko."
        ru: "Это недалеко."
        source: { kind: tatoeba, id: 600996 }
      - pl: "Mieszkam niedaleko."
        ru: "Я живу недалеко."
        source: { kind: translated, id: 566805 }
      - pl: "Dworzec jest tu niedaleko."
        ru: "Вокзал здесь рядом."
        source: { kind: tatoeba, id: 709313 }
  - id: near-from
    ru: "недалеко от (чего-либо)"
    examples:
      - pl: "To niedaleko od Paryża."
        ru: "Это недалеко от Парижа."
        source: { kind: tatoeba, id: 352503 }
      - pl: "Maria i Tom wzięli ślub w kościele niedaleko stąd."
        ru: "Мэри и Том поженились в церкви недалеко отсюда."
        source: { kind: tatoeba, id: 3679915 }
      - pl: "Niedaleko znajduje się kościół, meczet i synagoga."
        ru: "Рядом находятся христианская церковь, мечеть и синагога."
        source: { kind: tatoeba, id: 13045922 }
notes:
  - { kind: government, text: "Недалеко от чего-то — niedaleko od czegoś или просто niedaleko czegoś, оба с родительным падежом: niedaleko od Paryża, niedaleko stąd." }
  - { kind: usage, text: "Пишется слитно: это одно слово, а не nie daleko. Противоположность — daleko «далеко»." }
  - { kind: usage, text: "niedaleko stąd — «недалеко отсюда»; tu niedaleko — «тут рядом»." }
  - { kind: false-friend, text: "Пословица Niedaleko pada jabłko od jabłoni совпадает с русской «Яблоко от яблони недалеко падает» слово в слово." }
collocations:
  - { pl: "niedaleko stąd", ru: "недалеко отсюда" }
  - { pl: "niedaleko od", ru: "недалеко от" }
  - { pl: "tu niedaleko", ru: "тут рядом" }
family:
