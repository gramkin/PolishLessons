# review
id: wyjasnic
format: 2
lemma: "wyjaśnić"
rank: 595
pos: verb
aspect: perf
pron: { cyr: "выя́сьниць" }
senses:
  - id: explain
    ru: "объяснить (что-л. кому-л.)"
    note: "wyjaśnić coś komuś — винительный плюс дательный, как в русском."
    examples:
      - pl: "Też nie mogę tego wyjaśnić."
        ru: "Я тоже не могу этого объяснить."
        source: { kind: tatoeba, id: 597335 }
      - pl: "Mógłbyś wyjaśnić mi sens tego zdania?"
        ru: "Ты мог бы мне объяснить смысл этого предложения?"
        source: { kind: tatoeba, id: 3088568 }
      - pl: "Wyjaśniłem im zasady gry."
        ru: "Я объяснил им правила игры."
        source: { kind: tatoeba, id: 546118 }
  - id: clarify
    ru: "wyjaśnić się — выясниться, проясниться"
    note: "zagadka się wyjaśniła «загадка разъяснилась»."
    examples:
      - pl: "Zagadka się wyjaśniła."
        ru: "Загадка разъяснилась."
        source: { kind: translated, id: 1350492 }
      - pl: "Przyczyna pożaru wciąż nie została wyjaśniona."
        ru: "Причина пожара до сих пор не выяснена."
        source: { kind: translated, id: 357396 }
      - pl: "Myślałem, że to wyjaśniliśmy."
        ru: "Я думал, мы это выяснили."
        source: { kind: translated, id: 2410306 }
  - id: explanation
    ru: "wyjaśnienie — объяснение"
    note: "dziękuję za wyjaśnienie «спасибо за объяснение»."
    examples:
      - pl: "Ta sprawa może mieć tylko jedno wyjaśnienie."
        ru: "Вопрос допускает только одну интерпретацию."
        source: { kind: tatoeba, id: 353180 }
      - pl: "Nie było już czasu na wyjaśnienia."
        ru: "Уже не было времени на объяснения."
        source: { kind: tatoeba, id: 516542 }
      - pl: "Dziękuję za wyjaśnienie."
        ru: "Спасибо за объяснение."
        source: { kind: translated, id: 502327 }
notes:
  - { kind: government, text: "wyjaśnić coś komuś — винительный плюс дательный, ровно как в русском: wyjaśnił mi zasady «он объяснил мне правила»." }
  - { kind: usage, text: "С się глагол поворачивается к значению «выясниться»: sprawa się wyjaśniła «дело прояснилось»." }
  - { kind: usage, text: "Несовершенный вид — wyjaśniać; существительное — wyjaśnienie «объяснение»." }
  - { kind: usage, text: "Слово собрано прозрачно: wy- плюс jasny «ясный», буквально «сделать ясным» — тем же способом, что русское «выяснить»." }
collocations:
  - { pl: "wyjaśnić komuś coś", ru: "объяснить кому-либо что-либо" }
  - { pl: "sprawa się wyjaśniła", ru: "дело прояснилось" }
  - { pl: "dziękuję za wyjaśnienie", ru: "спасибо за объяснение" }
  - { pl: "wyjaśnić nieporozumienie", ru: "уладить недоразумение" }
family:
  - { pl: "jasny", ru: "ясный", relation: root }
  - { pl: "wyjaśniać", ru: "объяснять", relation: derived }
  - { pl: "wyjaśnienie", ru: "объяснение", relation: derived }
etymology: "Приставка wy- плюс jasny «ясный», от праславянского *jasnъ — то же слово, что русское «ясный»; wyjaśnić буквально «сделать ясным», ровно как русское «выяснить»."
memory: "wyjaśnić — «объяснить», и собрано оно прозрачно: wy- плюс jasny «ясный», тем же способом, что русское «выяснить». Управление совпадает: wyjaśnić coś komuś, винительный плюс дательный — wyjaśnił mi zasady. А с się глагол поворачивается ко второму русскому значению: sprawa się wyjaśniła «дело прояснилось». Несовершенный вид — wyjaśniać, существительное — wyjaśnienie."
idioms:
  - { pl: "wyjaśnić komuś coś", ru: "объяснить кому-либо что-либо" }
  - { pl: "sprawa się wyjaśniła", ru: "дело прояснилось" }
  - { pl: "dziękuję za wyjaśnienie", ru: "спасибо за объяснение" }
