# review
id: lekarstwo
format: 2
lemma: "lekarstwo"
rank: 1643
pos: noun
pron: { cyr: "лека́рство" }
senses:
  - id: medicine
    ru: "лекарство"
    examples:
      - pl: "Wypij lekarstwo."
        ru: "Выпей лекарство."
        source: { kind: tatoeba, id: 6328991 }
      - pl: "Lekarstwo ma gorzki smak."
        ru: "У лекарства горький вкус."
        source: { kind: tatoeba, id: 4886687 }
      - pl: "To lekarstwo jest dobre na przeziębienie."
        ru: "Это лекарство хорошо при простуде."
        source: { kind: tatoeba, id: 593159 }
  - id: remedy
    ru: "лекарство, средство (в переносном смысле)"
    examples:
      - pl: "Śmiech bywa lekarstwem."
        ru: "Смех бывает лекарством."
        source: { kind: tatoeba, id: 2178499 }
      - pl: "Śmiech jest najlepszym lekarstwem."
        ru: "Смех — лучшее лекарство."
        source: { kind: translated, id: 2374166 }
      - pl: "Na śmierć nie ma lekarstwa."
        ru: "От смерти нет лекарства."
        source: { kind: translated, id: 2194132 }
notes:
  - { kind: government, text: "«Принимать лекарство» — brać lekarstwa или przyjmować lekarstwa, чаще во множественном. «Лекарство от простуды» — lekarstwo na przeziębienie, предлог na с винительным." }
  - { kind: usage, text: "Рядом живёт более короткое lek «лекарство, препарат»; lekarstwo звучит обиходнее." }
  - { kind: usage, text: "jak na lekarstwo значит «совсем мало, кот наплакал» — буквально «как на лекарство»." }
  - { kind: usage, text: "Существительное среднего рода: lekarstwo, lekarstwa, lekarstwu." }
collocations:
  - { pl: "brać lekarstwa", ru: "принимать лекарства" }
  - { pl: "lekarstwo na przeziębienie", ru: "лекарство от простуды" }
  - { pl: "przepisać lekarstwo", ru: "выписать лекарство" }
etymology: "От lek «лекарство» с суффиксом -arstwo; праславянское *lěkъ, заимствованное из германского. Русское «лекарство» и «лекарь» — то же гнездо, так что слова прямо родственны."
memory: "lekarstwo = «лекарство», от lek. Запомните предлог: lekarstwo na przeziębienie «лекарство от простуды» — na, а не «от». И оборот jak na lekarstwo значит «совсем мало»."
idioms:
  - { pl: "brać lekarstwa", ru: "принимать лекарства" }
  - { pl: "lekarstwo na przeziębienie", ru: "лекарство от простуды" }
  - { pl: "jak na lekarstwo", ru: "кот наплакал" }
