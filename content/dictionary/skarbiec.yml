etymology: "От SKARB «клад, сокровище», слова, чьё дальнее происхождение спорно и возводится обычно к германским языкам. Для нас важнее другое: русский «скарб» заимствован именно из польского, и значение при этом осело — от сокровища к домашнему хламу. Так одно слово в двух языках разошлось не по форме, а по достоинству: у поляков оно про королевские регалии, у нас про вещи, которые жалко выбросить."
memory: "Хранилище, сокровищница, от skarb «клад, сокровище». Главное — не подставлять русский «скарб», то есть барахло: наше слово взято из польского, но значение осело. В гнезде skarbnik это «казначей», skarbonka — «копилка», а urzad skarbowy — налоговая инспекция. Читается «ска́рбец», где bie даёт «бе». Беглое e выпадает: skarbiec, но skarbca."
idioms:
