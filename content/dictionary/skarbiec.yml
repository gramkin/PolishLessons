notes:
  - { kind: false-friend, text: "Вот ловушка из самых чистых. Польское SKARB значит «клад, сокровище», а русский «скарб» — домашнее барахло, скопленное добро. И слово это у нас взято как раз из польского, только смысл с тех времён сильно осел. Гнездо держит первое значение: SKARBNIK это «казначей», SKARBONKA — «копилка», а SKARB PAŃSTWA — государственная казна. Отсюда же URZĄD SKARBOWY: не кладовая, а налоговая инспекция." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. В основе беглое E, которое выпадает во всех косвенных падежах: SKARBIEC, но SKARBCA, SKARBCEM, SKARBCU. Так же устроены DZWONEK и PRZYSTANEK. Множественное SKARBCE значит хранилища вообще, а SKARBIEC KORONNY — то самое собрание королевских регалий в Кракове." }
  - { kind: government, text: "В хранилище — W SKARBCU, местный падеж. Дверь хранилища — DRZWI SKARBCA, родительный. Войти в хранилище — WEJŚĆ DO SKARBCA, предлог DO с родительным, где русский скажет «в хранилище», с винительным. Это обычное расхождение: польское DO там, где у нас «в»." }
  - { kind: pronunciation, text: "Читается «ска́рбец», два слога, ударение на первом. Сочетание BIE даёт «бе»: буква I здесь не читается сама, а только смягчает B. Конечная C даёт «ц», а не «к» и не «ч». В косвенных падежах беглое E пропадает, и SKARBCA звучит «ска́рбца», с тремя согласными подряд." }
  - { kind: register, text: "Слово нейтральное, из языка банка и музея. В банке это SKARBIEC BANKOWY, подземное хранилище, и так написано в правилах. В музее — SKARBIEC KORONNY и SKARBIEC KATEDRALNY, и в Кракове это главная достопримечательность. В переносном смысле говорят SKARBIEC WIEDZY, «сокровищница знаний», но звучит это торжественно и книжно." }
