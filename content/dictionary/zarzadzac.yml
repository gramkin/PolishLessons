notes:
  - { kind: false-friend, text: "Корень здесь обманывает дважды. RZĄD по-польски значит «правительство», а русское «ряд» ему не отвечает: ряд предметов будет RZĄD в другом значении, и оба смысла живут в одном слове, но главное для поляка — правительство. RZĄDZIĆ значит «править», а ZARZĄDZAĆ — «управлять, распоряжаться». Рядом стоит ZARZĄD «правление, администрация» и ZARZĄDZENIE «распоряжение, постановление» — последнее легко спутать с ZARZĄDZANIE «управление», хотя различаются они одной буквой и значат совсем разное: одно бумага, другое занятие." }
  - { kind: government, text: "Глагол требует творительного падежа: ZARZĄDZAĆ CZYMŚ — ZARZĄDZAĆ FIRMĄ, ZARZĄDZAĆ MAJĄTKIEM, ZARZĄDZAĆ ZESPOŁEM. Здесь польский и русский совпадают, потому что «управлять» тоже требует творительного, и это редкая удача. Зато совершенный партнёр управляется иначе: ZARZĄDZIĆ COŚ берёт винительный и значит «распорядиться о чём-то, объявить»: ZARZĄDZIĆ EWAKUACJĘ «распорядиться об эвакуации», ZARZĄDZIĆ PRZERWĘ «объявить перерыв». То есть у видовой пары разные падежи и разные значения, и подставлять одно вместо другого нельзя." }
  - { kind: usage, text: "Шестьдесят три формы, и это подпись переходного глагола несовершенного вида: сорок две формы основного спряжения, десять форм действительного причастия ZARZĄDZAJĄCY и одиннадцать форм страдательного ZARZĄDZANY. Действительное причастие на -ĄCY бывает только у несовершенного вида — у совершенного его нет вовсе, и это самый надёжный способ определить вид по словарю. Настоящее время есть: ZARZĄDZAM, ZARZĄDZA. Деепричастие настоящего времени ZARZĄDZAJĄC тоже принадлежит несовершенному виду, тогда как у совершенного было бы -WSZY." }
  - { kind: pronunciation, text: "Читается «зажо́ндзачь», три слога, ударение на втором. Буквосочетание RZ даёт «ж», и потому начало звучит «за-жо», а не «зар-з». Буква Ą перед DZ даёт носовое «он». Сочетание DZ это один звонкий звук «дз». Конечное -Ć мягкое «чь». В форме ZARZĄDZAM слышно «зажо́ндзам», в форме ZARZĄDZAJĄCY — «зажондза́ёнцы», где второе Ą перед C даёт «он», а всё слово получает ударение на предпоследнем слоге." }
  - { kind: register, text: "Глагол деловой и административный, частый в объявлениях, уставах и на визитных карточках. Устойчивые сочетания: ZARZĄDZAĆ NIERUCHOMOŚCIĄ «управлять недвижимостью», ZARZĄDZAĆ ZESPOŁEM, SPÓŁKA ZARZĄDZAJĄCA «управляющая компания», ZARZĄDZANIE ZASOBAMI LUDZKIMI «управление персоналом». Отглагольное ZARZĄDZANIE означает и занятие, и учебную дисциплину: WYDZIAŁ ZARZĄDZANIA есть почти в каждом вузе. В разговоре о доме или подъезде ZARZĄDCA — это управляющий, и слово это слышат все жильцы." }
