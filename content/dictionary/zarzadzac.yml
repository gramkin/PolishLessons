etymology: "Приставка ZA- плюс RZĄDZIĆ, а тот — от RZĄD, праславянское *rędъ «ряд, порядок», то же слово, что русский «ряд». Гнездо в обоих языках огромно и совпадает почти целиком: польские PORZĄDEK, URZĄD, NARZĄD, SZEREG и русские «порядок», «наряд», «подряд», «обряд», «рядить». Разошлось главное значение самого слова: польский закрепил за RZĄD смысл «правительство», то есть тот, кто наводит порядок, а русский оставил «ряд» при исходном пространственном значении и для правительства взял другое слово. Носовой Ą на месте русского Я здесь закономерен: *ę дало польское Ę, а *ǫ дало Ą, и RZĄD с «рядом» связывает именно эта пара."
memory: "Корень тот же, что в русском «ряде», но главное значение другое: rząd это правительство, rządzić — править, zarządzać — управлять. Рядом zarząd «правление» и две похожие формы, которые путать нельзя: zarządzenie это распоряжение-бумага, zarządzanie — само занятие. Падеж совпадает с русским: zarządzać czymś, творительный, как «управлять чем». А вот совершенный zarządzić coś берёт винительный и значит «распорядиться». Шестьдесят три формы — несовершенный переходный, с действительным причастием на -ący, которого у совершенного не бывает."
