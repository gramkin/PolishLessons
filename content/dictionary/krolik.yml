notes:
  - { kind: usage, text: "Существительное одушевлённое мужское, и винительный у него совпадает с родительным: widzę KRÓLIKA, karmię królika. У неодушевлённых мужских винительный равен именительному — widzę wzór, а не «wzoru». Одно и то же окончание -a означает здесь два разных падежа, и выбор зависит только от того, живое существо или нет." }
  - { kind: pronunciation, text: "Буква ó читается как «у»: «кру́лик». В отличие от wzór — wzoru, здесь ó не чередуется и стоит во всех формах: królika, królikiem, królików. Так же ведёт себя исходное król — króla. Два слова в одной подборке дают обе возможности разом: там, где ó историческое и долгое, оно остаётся, а где возникло от закрытия слога, оно уходит." }
collocations:
  - { pl: "hodować króliki", ru: "разводить кроликов" }
  - { pl: "królik doświadczalny", ru: "подопытный кролик" }
  - { pl: "biały królik", ru: "белый кролик" }
family:
  - { pl: "król", ru: "король", relation: root, id: krol }
  - { pl: "królowa", ru: "королева", relation: derived, id: krolowa }
  - { pl: "króliczek", ru: "крольчонок", relation: derived }
etymology: "Буквально «королёк», уменьшительное от KRÓL. Название возникло из недоразумения: средневерхненемецкое küniklīn, переделанное из латинского cuniculus «кролик», расслышали так, будто в нём сидит künik «король», и перевели по частям. Чешский дал králík, польский królik, а русский «кролик» заимствован уже из польского, так что это наше слово пришло к нам отсюда."
memory: "Винительный как родительный, потому что животное: widzę królika. И ó здесь не чередуется: królika, królikiem, в отличие от wzór — wzoru."
idioms:
