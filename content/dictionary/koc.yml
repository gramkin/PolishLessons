pos: noun
pron: { cyr: "коц" }
senses:
  - id: blanket
    ru: "плед, одеяло (шерстяное)"
    examples:
      - pl: "Przykryj się kocem, jest zimno."
        ru: "Укройся пледом, холодно."
        source: { kind: authored }
