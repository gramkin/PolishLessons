notes:
  - { kind: false-friend, text: "KOC — «плед, шерстяное одеяло». Одеяло в пододеяльнике — KOŁDRA. Пододеяльник — POSZWA. KOC набрасывают на диван, берут на пикник, им укрываются в кресле." }
  - { kind: usage, text: "Мужской род, неодушевлённое. Родительный — KOCA, местный — KOCU. Родительный множественного — KOCÓW, разговорное KOCY не учим." }
  - { kind: government, text: "Под пледом — POD KOCEM, творительный. На покрывале — NA KOCU, местный. Укрыться пледом — PRZYKRYĆ SIĘ KOCEM, творительный без предлога." }
  - { kind: pronunciation, text: "Читается «коц», один слог. C — «ц»." }
collocations:
  - { pl: "ciepły koc", ru: "тёплый плед" }
  - { pl: "koc piknikowy", ru: "покрывало для пикника" }
  - { pl: "owinąć się kocem", ru: "завернуться в плед" }
family:
  - { pl: "kocyk", ru: "одеяльце, плед (ласк.)", relation: derived }
  - { pl: "kołdra", ru: "одеяло", relation: root }
  - { pl: "poduszka", ru: "подушка", relation: root, id: poduszka }
etymology: "Старое западнославянское слово для грубой шерстяной ткани. В русском обычно «плед» — из английского — или «одеяло»."
memory: "Koc — плед, а одеяло с пододеяльником — kołdra. Pod kocem — под пледом. Na kocu — на покрывале. Читается «коц»."
idioms:
  - { pl: "kocyk bezpieczeństwa", ru: "то, что даёт чувство защищённости" }
formExamplesSkip:
  - { form: "kocy", reason: "разговорный вариант родительного множественного, в норме KOCÓW" }
  - { form: "kocu", cell: "Звательный", reason: "звательный падеж: для неодушевлённого существительного он практически не употребляется" }
