# review
id: wprawdzie
format: 2
lemma: "wprawdzie"
rank: 2211
pos: part
pron: { cyr: "впра́вдзе" }
senses:
  - id: admittedly
    ru: "правда, хотя (с последующим ale)"
    examples:
      - pl: "Jest wprawdzie inteligentny, ale nie mądry."
        ru: "Он, правда, умён, но не мудр."
        source: { kind: translated, id: 646794 }
      - pl: "Umiem wprawdzie gotować, ale bardzo słabo."
        ru: "Готовить я, правда, умею, но очень плохо."
        source: { kind: translated, id: 722157 }
      - pl: "Wprawdzie jest dzieckiem, ale jest bardzo towarzyska."
        ru: "Она, правда, ребёнок, но очень общительна."
        source: { kind: translated, id: 919489 }
  - id: though
    ru: "впрочем, хоть и"
    examples:
      - pl: "Wprawdzie padało, ale poszliśmy."
        ru: "Хотя и шёл дождь, мы пошли."
        source: { kind: authored }
      - pl: "Wprawdzie jest tanio, ale niesmacznie."
        ru: "Дёшево-то дёшево, но невкусно."
        source: { kind: authored }
notes:
  - { kind: government, text: "Почти всегда в паре: wprawdzie…, ale… Первая часть уступает, вторая возражает. Без ale предложение звучит незаконченным." }
  - { kind: usage, text: "Место свободное: может открывать предложение или стоять после подлежащего — Jest wprawdzie inteligentny." }
  - { kind: false-friend, text: "Собрано из w + prawda «правда»: буквально «по правде». Русское «правда» в роли уступки работает так же: «Умён-то он, правда, но…»." }
  - { kind: usage, text: "Более книжный синоним — co prawda." }
collocations:
  - { pl: "wprawdzie… ale", ru: "правда… но" }
etymology: "w + prawda «правда»: буквально «по правде»."
memory: "wprawdzie — «правда, хотя», и почти всегда в паре wprawdzie…, ale… Первая часть уступает, вторая возражает. Синоним — co prawda."
idioms:
