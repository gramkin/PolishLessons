etymology: "От существительного RYZYKO, которое пришло через немецкое RISIKO из итальянского RISICO, а дальше след теряется: одни выводят его из греческого RHIZA «корень, подводная скала», откуда опасность для судна, другие из арабского RIZQ «доля, то, что даровано судьбой». Русский «риск» и «рисковать» взяты из того же итальянского источника через французское и немецкое посредство, поэтому слова совпадают. Суффикс -OWAĆ в польском образует глаголы от существительных сотнями и отвечает русскому -ОВАТЬ, но спрягается он иначе: в настоящем и будущем времени -OWA- уступает место -UJ-, и это древнее чередование, то же, что в русском «рисковать — рискую» и «организовать — организую». Так что правило у двух языков общее, а ошибку делает привычка, не язык."
memory: "Совершенный вид к ryzykować. Главное — две основы: прошедшее на -owa- (zaryzykował), будущее на -uj- (zaryzykuję), и формы zaryzykowam не существует. Так ведут себя все глаголы на -ować: pracować — pracuję, kupować — kupuję, budować — buduję. Русский делает то же со своими на -овать: рисковать — рискую. Чем рискуют — творительный, как в русском: zaryzykować życiem."
idioms:
