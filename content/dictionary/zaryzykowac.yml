notes:
  - { kind: government, text: "Совершенный вид, несовершенный — RYZYKOWAĆ. И первое, что надо увидеть: будущее время строится не на -OWA-, а на -UJ-. ZARYZYKUJĘ, ZARYZYKUJESZ, ZARYZYKUJE, ZARYZYKUJEMY, ZARYZYKUJECIE, ZARYZYKUJĄ — формы ZARYZYKOWAM не существует. Это не особенность слова, а целый класс: все глаголы на -OWAĆ ведут себя так. Русский делает то же самое со своими глаголами на -овать: «рисковать» даёт «рискую», «работать» тут не в счёт, зато «организовать» даёт «организую». Управление: чем рискуют — творительный, ZARYZYKOWAĆ ŻYCIEM, как русское «рискнуть жизнью»; на что решаются — винительный, ZARYZYKOWAĆ WYJAZD, или инфинитив, ZARYZYKOWAĆ ZAPYTAĆ." }
  - { kind: false-friend, text: "Значение совпадает с русским «рискнуть», и ловушки в смысле нет. Расхождение в форме и притом системное. Русскоговорящий, увидев ZARYZYKOWAĆ, строит будущее по образцу прошедшего, то есть от основы на -OWA-, и получает несуществующее ZARYZYKOWAM. Правильно ZARYZYKUJĘ, и то же касается сотен глаголов: PRACOWAĆ даёт PRACUJĘ, KUPOWAĆ — KUPUJĘ, BUDOWAĆ — BUDUJĘ, ORGANIZOWAĆ — ORGANIZUJĘ. Прошедшее время при этом остаётся на -OWA-: PRACOWAŁEM, KUPOWAŁEM. Так что у этих глаголов две основы, и делить их надо по временам, а не по виду." }
  - { kind: pronunciation, text: "Читается «зарызыко́ваць», ударение на предпоследнем слоге из пяти. Обе буквы Y звучат «ы», и слово начинается «зары-зы», что для русского непривычно: подряд идут два «ы». Конечное -Ć мягкое, «ць». В будущем времени ZARYZYKUJĘ слогов пять, ударение на предпоследнем: «зарызыку́е», и конечное -Ę на конце слова теряет носовой призвук. В деепричастии ZARYZYKOWAWSZY сочетание WSZ оглушается в «фш»: «зарызыкова́фшы»." }
  - { kind: usage, text: "Частотные сочетания: ZARYZYKOWAĆ ŻYCIEM «рискнуть жизнью», ZARYZYKOWAĆ WSZYSTKIM «рискнуть всем», WARTO ZARYZYKOWAĆ «стоит рискнуть», NIE WARTO ZARYZYKOWAĆ. Существительное RYZYKO входит в обороты PODJĄĆ RYZYKO «пойти на риск», NA WŁASNE RYZYKO «на свой риск», GRUPA RYZYKA. Прилагательное RYZYKOWNY значит «рискованный». Несовершенный RYZYKOWAĆ описывает состояние или повторяющееся действие: RYZYKUJE CODZIENNIE «он рискует ежедневно», тогда как ZARYZYKOWAĆ это один поступок." }
