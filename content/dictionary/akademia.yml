notes:
  - { kind: false-friend, text: "Первое значение совпадает с русским: AKADEMIA это высшее учебное заведение или научное общество, AKADEMIA MEDYCZNA, AKADEMIA NAUK. Второе значения в русском нет совсем, и встречается оно чаще первого: AKADEMIA — это торжественное собрание по случаю праздника, школьная или заводская линейка с выступлениями и стихами. AKADEMIA Z OKAZJI ROCZNICY значит «торжественное собрание по случаю годовщины», и к науке это отношения не имеет. Поэтому фраза DZIECI PRZYGOTOWAŁY AKADEMIĘ означает, что дети подготовили концерт, а не основали академию. В русском этому отвечает «торжественная линейка» или «торжественное собрание»." }
  - { kind: usage, text: "Слово принадлежит к типу на -IA, и родительный, дательный и местный единственного совпадают в одной форме AKADEMII, которая служит ещё и родительным множественного. Рядом с ней существует старая форма родительного множественного AKADEMIJ, на -IJ, встречающаяся в текстах девятнадцатого века и в поэзии. То же у всех слов этого типа: CEREMONIA даёт CEREMONIJ, a KAUCJA и REWOLUCJA дают KAUCYJ и REWOLUCYJ через -YJ, потому что у них перед окончанием стоит J, а не I. Правило же самого типа простое: польское -IA отвечает русскому -ИЯ без исключений." }
  - { kind: government, text: "Женский род. Какая академия — прилагательное: AKADEMIA MEDYCZNA, AKADEMIA SZTUK PIĘKNYCH «академия изящных искусств», AKADEMIA WOJSKOWA. Чего академия — родительный: AKADEMIA NAUK «академия наук». «В академии» о учёбе и работе — предлог W с местным: W AKADEMII, STUDIOWAĆ W AKADEMII. Во втором значении частотны: AKADEMIA Z OKAZJI CZEGOŚ «собрание по случаю чего-то», PRZYGOTOWAĆ AKADEMIĘ «подготовить торжественное собрание», AKADEMIA KU CZCI KOGOŚ «собрание в честь кого-то», с предлогом KU и дательным." }
  - { kind: pronunciation, text: "Читается «акаде́мя», четыре слога, ударение на предпоследнем. Все три A произносятся полно, как «а», без редукции: первый слог звучит «а», а не «ə». Буква E даёт «э», но после D смягчения нет, поэтому третий слог звучит «дэ», и всё же в быстрой речи он ближе к «де». Конечное -IA произносится как «я», одним слогом, сливаясь с M в мягкое «мя». В форме AKADEMII двойное I читается как долгое «и»: «акаде́ми»." }
