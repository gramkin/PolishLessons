etymology: "Из латинского ACADEMIA, а то — из греческого ἈΚΑΔΉΜΕΙΑ, названия рощи под Афинами, где учил Платон; роща, в свою очередь, носила имя героя Академа. Так школа получила имя места, а место — имя человека. Оба наших языка взяли слово из латыни в значении учёного заведения, и здесь они совпадают. Второе, польское значение торжественного собрания развилось в девятнадцатом веке из обычая устраивать публичные заседания научных обществ с речами и музыкой: сначала так называли само заседание академии, потом любое торжественное собрание с программой, и в школьном языке это значение стало основным. Русский этого переноса не знал и назвал такое собрание по-своему — «торжественной линейкой»."
memory: "Первое значение как в русском, второе — нет: akademia это ещё и торжественное собрание, школьная линейка с выступлениями. Dzieci przygotowały akademię значит «подготовили концерт». Тип на -ia равен русскому -ия. Родительный, дательный и местный единственного — одна форма akademii, она же родительный множественного; рядом архаичное akademij, как ceremonij, а у слов на -cja через -yj: kaucyj, rewolucyj."
