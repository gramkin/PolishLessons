notes:
  - { kind: false-friend, text: "Корень тот же, что в русском «рвать», и приставка та же, что в «оборвать», но значения разошлись. Польское OBERWAĆ относится к тому, что обрывают с чего-то: листья, яблоки, нитки. Русское «оборвать» умеет ещё значить «прервать речь», и для этого в польском нужен другой глагол, PRZERWAĆ: PRZERWAŁ MI W POŁOWIE ZDANIA «он оборвал меня на полуслове». Зато у польского есть значение, которого нет у русского: разговорное OBERWAĆ означает «получить нагоняй или затрещину»." }
  - { kind: register, text: "Первое значение нейтральное и садово-бытовое: OBERWAĆ LIŚCIE, OBERWAĆ JABŁKA, OBERWAŁ SIĘ SZNUREK «верёвка оборвалась». Второе значение разговорное и выразительное: OBERWAĆ OD KOGOŚ «получить от кого-то», OBERWAĆ PO USZACH «получить по шее». В письменном тексте оно неуместно, но в живой речи встречается постоянно, особенно в разговоре с детьми. Отдельно стоит выражение OBERWANIE CHMURY — «проливной дождь, ливень», буквально «обрыв тучи», и оно вполне литературно." }
  - { kind: government, text: "Прямое дополнение в винительном: OBERWAĆ LIŚCIE, OBERWAĆ JABŁKA. То, с чего обрывают, вводится предлогом Z с родительным: OBERWAĆ JABŁKA Z GAŁĘZI. Во втором значении источник нагоняя идёт с предлогом OD и родительным: OBERWAĆ OD SZEFA, OD MATKI, а место удара — с предлогом PO и предложным: OBERWAĆ PO USZACH, PO GŁOWIE. Возвратное OBERWAĆ SIĘ значит «оборваться» и говорится о верёвке, пуговице, карнизе." }
  - { kind: usage, text: "Пятьдесят три формы — подпись переходного глагола совершенного вида. В будущем времени основа меняет вид: инфинитив OBERWAĆ, но OBERWĘ, OBERWIESZ, OBERWIE, и это то же чередование, что в самом RWAĆ с его RWĘ и RWIESZ. Приставка OB- отвечает русской ОБ- буквально. Несовершенный партнёр — OBRYWAĆ, с обычным для польского удлинением основы через -YWA-. Из того же гнезда идут ZERWAĆ «сорвать», PRZERWAĆ «прервать», URWAĆ «отломать» и существительное PRZERWA «перерыв», которое совпадает с русским почти буквально." }
  - { kind: pronunciation, text: "Читается «обэрва́чь», три слога, ударение на предпоследнем. Буква E звучит как твёрдое «э», без смягчения предыдущего согласного, поэтому слышно «обэр», а не «обер». Буква R твёрдая и раскатистая. Конечное Ć мягкое, «чь». В формах будущего времени появляется мягкость: OBERWIESZ звучит «обэрве́ш», где WIE даёт «ве»." }
collocations:
  - { pl: "oberwać od kogoś", ru: "получить от кого-то нагоняй" }
  - { pl: "oberwanie chmury", ru: "проливной дождь" }
