etymology: "Приставка OB- плюс RWAĆ, от праславянского *rъvati «рвать». Русский сохранил корень полностью и со всеми приставками: «рвать», «оборвать», «сорвать», «прервать», «разорвать», «перерыв». Польское гнездо устроено так же: RWAĆ, OBERWAĆ, ZERWAĆ, PRZERWAĆ, URWAĆ, и существительное PRZERWA отвечает русскому «перерыву» почти буква в букву. Чередование основы RWA- и RWI- в спряжении — след древнего беглого гласного, того же, что дал пару «беру» и «брать». Переносное значение «получить нагоняй» выросло из образа оборванного, то есть потрёпанного человека, и в русском ближайшая параллель — «ему досталось»."
memory: "Корень тот же, что в «рвать», и приставка та же, что в «оборвать»: ob- плюс rwać. Но «оборвать речь» этим глаголом не скажешь, для этого есть przerwać. Зато есть значение, которого русский не знает: разговорное oberwać od kogoś «получить нагоняй», oberwać po uszach «получить по шее». И стоит запомнить oberwanie chmury — «проливной дождь», буквально обрыв тучи."
idioms:
  - { pl: "oberwanie chmury", ru: "проливной дождь, ливень" }
