# review
id: poglad
format: 2
lemma: "pogląd"
rank: 4866
pos: noun
pron: { cyr: "по́глонт" }
senses:
  - id: opinion
    ru: "взгляд, мнение, точка зрения"
    examples:
      - pl: "Bardzo mnie interesuje twój pogląd, Nino."
        ru: "Меня крайне интересует твоя точка зрения, Нина."
        source: { kind: tatoeba, id: 2493594 }
      - pl: "Każdy pogląd to mieszanka prawdy i błędów."
        ru: "Каждое из мнений — это смесь из истины и ошибок."
        source: { kind: tatoeba, id: 908023 }
      - pl: "Ile osób, tyle poglądów."
        ru: "Сколько людей, столько мнений."
        source: { kind: translated, id: 356002 }
  - id: convictions
    ru: "взгляды, убеждения (во множественном числе)"
    examples:
      - pl: "Na tę sprawę mamy odmienne poglądy."
        ru: "На эту проблему у нас разные взгляды."
        source: { kind: tatoeba, id: 5959966 }
      - pl: "Przyjął jej poglądy."
        ru: "Он принял её взгляды."
        source: { kind: translated, id: 358049 }
notes:
  - { kind: usage, text: "Во множественном числе poglądy обычно значит уже не «мнения», а «убеждения, воззрения» — политические или религиозные: mieć skrajne poglądy «придерживаться крайних взглядов»." }
  - { kind: government, text: "Соглашаются с мнением через z и творительный: zgadzać się z czyimś poglądem. Противостоят ему через дательный: sprzeciwić się poglądowi." }
  - { kind: false-friend, text: "Корень glądać «глядеть» — тот же, что в oglądać «осматривать» и wygląd «внешний вид». Русское «взгляд» собрано ровно так же, только с другой приставкой." }
  - { kind: usage, text: "pogląd na świat — «мировоззрение», буквально «взгляд на мир»." }
collocations:
  - { pl: "wymiana poglądów", ru: "обмен мнениями" }
  - { pl: "pogląd na świat", ru: "мировоззрение" }
  - { pl: "skrajne poglądy", ru: "крайние взгляды" }
etymology: "po- + glądać «глядеть»; ср. oglądać «осматривать», wygląd «внешний вид». Русское «взгляд» построено из тех же частей."
memory: "pogląd — «взгляд, мнение», от glądać «глядеть», как русское «взгляд» от «глядеть». Во множественном числе poglądy — уже «убеждения»: skrajne poglądy «крайние взгляды»."
idioms:
  - { pl: "wymiana poglądów", ru: "обмен мнениями" }
  - { pl: "pogląd na świat", ru: "мировоззрение" }
