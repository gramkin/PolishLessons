# review
id: droga
format: 2
lemma: "droga"
rank: 199
pos: noun
pron: { cyr: "дро́га" }
senses:
  - id: road
    ru: "дорога, путь"
    examples:
      - pl: "Droga jest długa."
        ru: "Путь долог."
        source: { kind: tatoeba, id: 826566 }
      - pl: "Droga była śliska."
        ru: "Дорога была скользкая."
        source: { kind: tatoeba, id: 12274836 }
      - pl: "Na drodze jest ślisko."
        ru: "На улице скользко."
        source: { kind: tatoeba, id: 4748337 }
  - id: way
    ru: "путь, способ; в пути, по пути"
    examples:
      - pl: "Tom jest w drodze do Mary."
        ru: "Том уже на пути к Мэри."
        source: { kind: tatoeba, id: 10529875 }
      - pl: "Po drodze do domu wpadnę na pocztę."
        ru: "По дороге домой зайду на почту."
        source: { kind: tatoeba, id: 348629 }
      - pl: "Ona zna drogę do domu."
        ru: "Она знает дорогу домой."
        source: { kind: tatoeba, id: 13616081 }
notes:
  - { kind: false-friend, text: "Существительное droga «дорога» и прилагательное drogi «дорогой» пишутся почти одинаково: Ta droga jest droga «Эта дорога дорогая». В таблицах форм они перемешаны." }
  - { kind: usage, text: "w drodze — «в пути», po drodze — «по пути», Droga Mleczna — «Млечный Путь»." }
  - { kind: usage, text: "Наречие drogo значит «дорого» и принадлежит прилагательному drogi, а не этому слову." }
collocations:
  - { pl: "w drodze", ru: "в пути" }
  - { pl: "po drodze", ru: "по пути" }
  - { pl: "zejść z drogi", ru: "уйти с дороги" }
  - { pl: "droga powrotna", ru: "обратный путь" }
etymology: "Праславянское *dorga «борозда, продолговатый след»; то же слово, что русское «дорога»."
memory: "Каверза: droga — «дорога» (существительное), drogi — «дорогой» (прилагательное). Фраза Ta droga jest droga значит «Эта дорога дорогая»."
idioms:
  - { pl: "Droga Mleczna", ru: "Млечный Путь" }
  - { pl: "być na dobrej drodze", ru: "быть на верном пути" }
  - { pl: "chodzić własnymi drogami", ru: "идти своим путём" }
formExamplesSkip:
  - { form: "drogo", reason: "наречие «дорого» от прилагательного drogi; к существительному droga отношения не имеет" }
