  - { pl: "ślicznotka", ru: "красотка", relation: root }
  - { pl: "prześliczny", ru: "прелестнейший", relation: root, id: przesliczny }
etymology: "От ŚLICZNY. Исходное значение — «подобающий, пристойный», от того же корня, что LICO «лицо» и русское «приличный». Со временем «пристойное» стало «красивым»."
memory: "Ślicznie — прелестно; dziękuję ślicznie — огромное спасибо. Читается «сьли́чне». Ślicznie ci w tym — тебе очень идёт."
idioms:
  - { pl: "jak z obrazka", ru: "как с картинки" }
