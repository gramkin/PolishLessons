# review
id: slicznie
format: 2
lemma: "ślicznie"
rank: 4859
pos: adv
pron: { cyr: "сьли́чне" }
senses:
  - id: lovely
    ru: "прелестно, очень красиво"
    examples:
      - pl: "Ślicznie ci w tym kolorze."
        ru: "Тебе очень идёт этот цвет."
        source: { kind: authored }
      - pl: "Pokój był ślicznie udekorowany."
        ru: "Комната была прелестно украшена."
        source: { kind: authored }
      - pl: "Ślicznie pachnie ten bez."
        ru: "Как чудесно пахнет эта сирень."
        source: { kind: authored }
  - id: thanks
    ru: "огромное (спасибо): DZIĘKUJĘ ŚLICZNIE"
    examples:
      - pl: "Dziękuję ci ślicznie!"
        ru: "Огромное тебе спасибо!"
        source: { kind: authored }
      - pl: "Ślicznie dziękujemy za zaproszenie."
        ru: "Сердечно благодарим за приглашение."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ŚLICZNIE — «прелестно, очень красиво», к русским «слишком» и «сличать» отношения не имеет. В благодарности DZIĘKUJĘ ŚLICZNIE — тёплое «огромное спасибо». ŚLICZNY — «прелестный, хорошенький»." }
  - { kind: usage, text: "Наречие со степенями: ŚLICZNIE, ŚLICZNIEJ, NAJŚLICZNIEJ. Особенно часто — о внешности и одежде: WYGLĄDASZ ŚLICZNIE, ŚLICZNIE CI W TEJ SUKIENCE." }
  - { kind: government, text: "Наречие ничем не управляет. В обороте «тебе идёт» лицо в дательном: ŚLICZNIE CI W TYM, «тебе в этом очень красиво»." }
  - { kind: pronunciation, text: "Читается «сьли́чне», ударение на первом слоге. ŚL — «сьл», CZNIE — «чне»." }
  - { kind: register, text: "Слово ласковое и немного «женское»: комплименты, детям, благодарность. В нейтральной речи — PIĘKNIE." }
collocations:
  - { pl: "dziękuję ślicznie", ru: "огромное спасибо" }
  - { pl: "ślicznie wyglądać", ru: "прелестно выглядеть" }
  - { pl: "ślicznie śpiewać", ru: "прелестно петь" }
family:
