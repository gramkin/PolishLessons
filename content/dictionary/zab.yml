  - { pl: "dentysta", ru: "зубной врач", relation: derived }
etymology: "Праславянское *zǫbъ — то же слово, что русский «зуб». Носовое ǫ дало в польском ą, а в русском «у»."
memory: "ząb — «зуб», но гласная чередуется: ząb, а дальше zęba, zęby, zębów. В русском такого нет, и это главная ловушка. И конечное b оглушается: «зомп»."
idioms:
