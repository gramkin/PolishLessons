  - { pl: "oko za oko, ząb za ząb", ru: "око за око, зуб за зуб" }
  - { pl: "coś na ząb", ru: "чего-нибудь перекусить" }
  - { pl: "bronić zębami i pazurami", ru: "защищать руками и ногами" }
