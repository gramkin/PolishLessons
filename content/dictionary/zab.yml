notes:
  - { kind: usage, text: "Носовая гласная чередуется: в именительном ząb, но во всех остальных формах ę — zęba, zębie, zęby, zębów. Русское «зуб — зубы» такого чередования не знает, и это частая ошибка." }
  - { kind: usage, text: "ból zęba «зубная боль», pasta do zębów «зубная паста», myć zęby «чистить зубы»." }
  - { kind: usage, text: "trzymać język za zębami — «держать язык за зубами», совпадает с русским дословно. Как и oko za oko, ząb za ząb." }
  - { kind: usage, text: "Конечное b оглушается: ząb звучит как «зомп», а вот zęba — уже со звонким «б»." }
collocations:
  - { pl: "boli mnie ząb", ru: "у меня болит зуб" }
