    pl: "Rodzice często się poświęcają by zapewnić swemu dziecku edukację na wysokim poziomie."
    ru: "Родители часто жертвуют собой, чтобы обеспечить своему ребёнку образование высокого уровня."
    source: { kind: translated, id: 1480701 }
  - form: "zapewnił"
