formExamples:
  - form: "zapewni"
    pl: "Rząd zapewni firmom uczestniczącym w programie, kredyty wolne od odsetek."
    ru: "Правительство обеспечит фирмам, участвующим в программе, беспроцентные кредиты."
    source: { kind: translated, id: 1465581 }
  - form: "zapewni"
    pl: "Kto zapewni nam transport?"
    ru: "Кто обеспечит нам транспорт?"
