# review
id: zapewnic
format: 2
lemma: "zapewnić"
rank: 1859
pos: verb
aspect: perf
pron: { cyr: "запэ́вниць" }
senses:
  - id: provide
    ru: "обеспечить, предоставить"
    examples:
      - pl: "Zapewnił głodującym żywność."
        ru: "Он обеспечил голодающих едой."
        source: { kind: translated, id: 952155 }
      - pl: "Rodzice chcą zapewnić synowi jak najlepszą edukację."
        ru: "Родители хотят обеспечить сыну наилучшее образование."
        source: { kind: translated, id: 5510956 }
      - pl: "Czy zapewnicie mi państwo wszystko, czego potrzebuję?"
        ru: "Вы обеспечите меня всем необходимым?"
        source: { kind: translated, id: 982424 }
  - id: assure
    ru: "заверить, уверить"
    examples:
      - pl: "Tom zapewnił mnie, że nie będzie żadnych problemów."
        ru: "Том уверил меня, что не будет никаких проблем."
        source: { kind: tatoeba, id: 3789683 }
      - pl: "On zapewnił, że nie ma nic wspólnego z tą sprawą."
        ru: "Он заверил, что не имеет ничего общего с этим делом."
        source: { kind: translated, id: 712362 }
      - pl: "Jane zapewniła, że mówiła prawdę."
        ru: "Джейн заверила, что говорила правду."
        source: { kind: translated, id: 750372 }
notes:
  - { kind: false-friend, text: "Два значения, которые русский разводит разными словами: zapewnić komuś coś «обеспечить кого-то чем-то» и zapewnić, że… «заверить, что…». Контекст решает." }
  - { kind: government, text: "Обеспечить кому-то что-то — zapewnić komuś coś (дательный плюс винительный): zapewnić synowi edukację." }
  - { kind: usage, text: "Совершенный вид; несовершенный — zapewniać. Существительное zapewnienie значит «заверение»." }
  - { kind: usage, text: "Причастие zapewniona «обеспечена»: zapewniona jest obfitość jedzenia «изобилие еды обеспечено»." }
collocations:
  - { pl: "zapewnić komuś coś", ru: "обеспечить кого-то чем-то" }
  - { pl: "zapewnić, że", ru: "заверить, что" }
  - { pl: "zapewnić bezpieczeństwo", ru: "обеспечить безопасность" }
family:
  - { pl: "zapewniać", ru: "обеспечивать, заверять", relation: root }
  - { pl: "pewny", ru: "уверенный", relation: root, id: pewny }
  - { pl: "obiecać", ru: "обещать", relation: root, id: obiecac }
etymology: "Приставка za- плюс pewny «уверенный»: буквально «сделать уверенным». Отсюда оба значения — «заверить» и «обеспечить»."
memory: "zapewnić — и «обеспечить» (zapewnić synowi edukację), и «заверить» (zapewnił, że nie ma nic wspólnego). Русский разводит их разными словами."
idioms:
  - { pl: "zapewnić komuś coś", ru: "обеспечить кого-то чем-то" }
  - { pl: "zapewnić, że", ru: "заверить, что" }
  - { pl: "zapewnić bezpieczeństwo", ru: "обеспечить безопасность" }
