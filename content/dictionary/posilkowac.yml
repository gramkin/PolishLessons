# review
id: posilkowac
format: 2
lemma: "posiłkować"
rank: 2302
pos: verb
aspect: imperf
pron: { cyr: "посьиуко́ваць" }
senses:
  - id: avail-oneself
    ru: "пользоваться, прибегать к (чему-л. как подспорью)"
    examples:
      - pl: "Posiłkował się słownikiem."
        ru: "Он пользовался словарём."
        source: { kind: authored }
      - pl: "Posiłkujemy się danymi z raportu."
        ru: "Мы опираемся на данные из отчёта."
        source: { kind: authored }
      - pl: "Nie musisz posiłkować się tłumaczem."
        ru: "Тебе не нужно прибегать к переводчику."
        source: { kind: authored }
  - id: supplement
    ru: "подкреплять себя, дополнять (чужой помощью, цитатами)"
    examples:
      - pl: "Autor posiłkuje się cytatami z kronik."
        ru: "Автор подкрепляет себя цитатами из хроник."
        source: { kind: authored }
      - pl: "Posiłkowali się pomocą sąsiadów."
        ru: "Они пользовались помощью соседей."
        source: { kind: authored }
notes:
  - { kind: government, text: "Всегда с się и с ТВОРИТЕЛЬНЫМ падежом: posiłkować się słownikiem «пользоваться словарём». Формы без się не существует." }
  - { kind: false-friend, text: "Корень posiłek «приём пищи, подкрепление»: буквально «подкрепляться чем-л.». Русское «посильный» тут ни при чём." }
  - { kind: usage, text: "Книжное слово; в обычной речи скажут korzystać z czegoś — и обратите внимание на другое управление: z с родительным падежом." }
  - { kind: usage, text: "Однокоренное прилагательное posiłkowy живёт в грамматике: czasownik posiłkowy «вспомогательный глагол». Это не форма глагола, а отдельное слово." }
  - { kind: government, text: "Страдательного причастия у глагола нет: он идёт только с się и с творительным падежом, а без винительного дополнения причастие не образуется." }
collocations:
  - { pl: "posiłkować się czymś", ru: "пользоваться чем-л." }
  - { pl: "posiłkować się pomocą", ru: "прибегать к помощи" }
etymology: "От posiłek «подкрепление, приём пищи»; буквально «подкрепляться чем-л.»."
memory: "posiłkować się czymś — книжное «пользоваться чем-л.», с творительным падежом. Обиходный синоним korzystać z czegoś берёт родительный. Однокоренное posiłkowy — «вспомогательный», как в czasownik posiłkowy."
idioms:
  - { pl: "posiłkować się czymś", ru: "пользоваться чем-л." }
