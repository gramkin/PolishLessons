notes:
  - { kind: false-friend, text: "Одно польское слово покрывает три разных русских: «вид» в биологии, «сорт» о качестве и «жанр» в искусстве. Поэтому переводить gatunek надо по контексту, а не по привычке: gatunek chroniony — «охраняемый вид», pierwszy gatunek — «первый сорт», gatunek literacki — «литературный жанр»." }
  - { kind: government, text: "Чего именно вид или сорт — в РОДИТЕЛЬНОМ падеже: gatunek wina, gatunek ptaków, gatunek literacki (здесь прилагательное). Предлога не требуется." }
  - { kind: usage, text: "Заимствование из немецкого, поэтому родственников внутри польского у него мало: прилагательное gatunkowy и оборот w swoim gatunku «в своём роде». Русского однокоренного слова нет вовсе." }
collocations:
  - { pl: "gatunek chroniony", ru: "охраняемый вид" }
  - { pl: "gatunek literacki", ru: "литературный жанр" }
  - { pl: "pierwszy gatunek", ru: "первый сорт" }
family:
  - { pl: "gatunkowy", ru: "видовой; сортовой", relation: derived }
etymology: "Заимствование из немецкого Gattung «род, вид», от gatten «соединять, подбирать по паре». В польский слово пришло в эпоху сильного немецкого влияния на ремесленную и торговую лексику — отсюда и «сорт» как торговая характеристика. Русского родственника у него нет: там на эти смыслы пошли «вид», «сорт» и «жанр»."
memory: "gatunek — немецкое заимствование (Gattung), и одно это слово отвечает трём русским: «вид» (биол.), «сорт» (качество), «жанр» (искусство). Чего вид — родительный: gatunek wina."
idioms:
  - { pl: "gatunek chroniony", ru: "охраняемый вид" }
  - { pl: "w swoim gatunku", ru: "в своём роде" }
formExamplesSkip:
