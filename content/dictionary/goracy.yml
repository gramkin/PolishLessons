        ru: "Этот кофе для меня слишком горячий."
        source: { kind: tatoeba, id: 932845 }
      - pl: "Zupa była tak gorąca, że poparzyłem język."
        ru: "Суп был такой горячий, что я обжёг язык."
        source: { kind: tatoeba, id: 13899306 }
  - id: hot-drink
    ru: "gorąca herbata, gorąca czekolada — горячий чай, горячий шоколад"
    examples:
      - pl: "Chcę zjeść gorącą zupę."
        ru: "Хочу съесть горячий суп."
        source: { kind: translated, id: 1080743 }
      - pl: "Kto chce gorącą czekoladę?"
        ru: "Кто хочет горячий шоколад?"
        source: { kind: translated, id: 894323 }
      - pl: "Chcesz gorącą czy zimną herbatę?"
        ru: "Ты хочешь горячий чай или холодный?"
        source: { kind: translated, id: 537338 }
  - id: heated
    ru: "горячий (о спорах, чувствах)"
    examples:
      - pl: "Jego śmiały plan wywołał gorące spory."
        ru: "Его смелый план вызвал горячие споры."
        source: { kind: tatoeba, id: 440330 }
      - pl: "To był gorący dzień."
        ru: "Это был жаркий день."
        source: { kind: translated, id: 968965 }
      - pl: "To gorący temat."
        ru: "Это горячая тема."
        source: { kind: authored }
  - id: red-handed
    ru: "na gorącym uczynku — на месте преступления, с поличным"
    examples:
      - pl: "Przyłapaliśmy ją na gorącym uczynku."
        ru: "Мы поймали её с поличным."
        source: { kind: translated, id: 12567680 }
      - pl: "Tom został złapany na gorącym uczynku."
        ru: "Тома поймали с поличным."
        source: { kind: translated, id: 5535835 }
      - pl: "Jedz, póki gorące."
        ru: "Ешь, пока горячее."
        source: { kind: translated, id: 4327838 }
notes:
  - { kind: usage, text: "Идиома, которая переносится дословно: kuj żelazo, póki gorące — «куй железо, пока горячо»." }
  - { kind: usage, text: "na gorącym uczynku значит «на месте преступления, с поличным»: Złapali go na gorącym uczynku. Буквально — «на горячем поступке»." }
  - { kind: false-friend, text: "Не путайте прилагательное gorąca с существительным gorąco «жара»: Przywykłem do gorąca — это «Я привык к жаре», а не «к горячей»." }
  - { kind: usage, text: "Ещё ходовые: gorąca linia «горячая линия», gorąca głowa «горячая голова», w gorącej wodzie kąpany — о вспыльчивом человеке." }
collocations:
  - { pl: "gorąca herbata", ru: "горячий чай" }
  - { pl: "na gorącym uczynku", ru: "с поличным" }
  - { pl: "gorąca linia", ru: "горячая линия" }
  - { pl: "gorące źródła", ru: "горячие источники" }
family:
  - { pl: "gorąco", ru: "жара; жарко", relation: derived }
  - { pl: "gorączka", ru: "жар, лихорадка", relation: derived }
  - { pl: "zimny", ru: "холодный", relation: root }
etymology: "Праславянское *gorǫťь, от gorzeć «гореть» — то же гнездо, что русские «горячий», «гореть» и «жар»."
memory: "gorący — «горячий», от того же корня, что «гореть». Две вещи стоит взять целиком. Первая: kuj żelazo, póki gorące — поговорка переносится дословно, «куй железо, пока горячо». Вторая: na gorącym uczynku значит «с поличным». И не путайте прилагательное gorąca с существительным gorąco «жара»: Przywykłem do gorąca — «Я привык к жаре»."
idioms:
  - { pl: "kuj żelazo, póki gorące", ru: "куй железо, пока горячо" }
  - { pl: "na gorącym uczynku", ru: "с поличным" }
  - { pl: "w gorącej wodzie kąpany", ru: "вспыльчивый, горячая голова" }
formExamplesSkip:
