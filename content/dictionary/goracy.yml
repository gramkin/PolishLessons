id: goracy
format: 2
lemma: "gorący"
rank: 731
pos: adj
pron: { cyr: "горо́нцы" }
senses:
  - id: hot
    ru: "горячий, жаркий"
    examples:
      - pl: "Ogień jest gorący, a lód zimny."
        ru: "Огонь горячий, а лёд холодный."
        source: { kind: tatoeba, id: 12678722 }
