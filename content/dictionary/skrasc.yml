notes:
  - { kind: usage, text: "У ЭТОГО ГЛАГОЛА ДВОЙНАЯ ПАРАДИГМА, И ЭТО РЕДКОСТЬ. При одной лемме существуют два инфинитива — SKRAŚĆ и SKRADNĄĆ, два страдательных причастия — SKRADZIONY и SKRADNIĘTY — и два отглагольных существительных: SKRADZENIE и SKRADNIĘCIE. Словарь PoliMorf относит все эти формы к одной лемме skraść. В живой речи работает ряд на -dzion-: skradziony rower; ряд на -nięt- остаётся книжным и редким." }
  - { kind: false-friend, text: "САМЫЙ ОБЫЧНЫЙ СОВЕРШЕННЫЙ ГЛАГОЛ К KRAŚĆ — ЭТО UKRAŚĆ, А НЕ SKRAŚĆ. Русское «украсть» отвечает именно ukraść, и приставка у них общая. Skraść звучит чуть книжнее и чаще встречается в переносном смысле: skraść całusa, skraść komuś serce. Корень один и тот же: kraść — это «красть», kradzież — «кража»." }
  - { kind: usage, text: "Основа будущего времени идёт на -dn-: SKRADNĘ, skradniesz, skradnie, skradną, а повелительное — SKRADNIJ. Прошедшее при этом строится от -d-: skradł, skradła, skradli. Так же ведёт себя простое kraść: kradnę, но kradł. Вид совершенный: есть SKRADŁSZY, форм на -ąc и -ący нет." }
collocations:
  - { pl: "skradziony samochód", ru: "угнанная машина" }
  - { pl: "skraść całusa", ru: "украсть поцелуй" }
  - { pl: "zostać skradzionym", ru: "быть украденным" }
family:
  - { pl: "kraść", ru: "красть", relation: aspect, id: krasc }
  - { pl: "ukraść", ru: "украсть", relation: root, id: ukrasc }
  - { pl: "kradzież", ru: "кража", relation: derived, id: kradziez }
etymology: "Приставка s- и kraść, из праславянского *krasti — того же корня, что русские «красть», «украсть» и «кража». Чередование основ kradn-/krad- тоже общее: русское «краду» против «крал». Отсюда kradzież «кража» и skradziony «украденный»."
memory: "skraść — «украсть», но обычнее сказать UKRAŚĆ. Главная особенность: двойная парадигма — skraść и skradnąć, skradziony и skradnięty. Живой ряд тот, что на -dzion-. Будущее на -dn-: skradnę, но прошедшее skradł."
idioms:
  - { pl: "skraść komuś serce", ru: "украсть чьё-л. сердце" }
  - { pl: "skradziony czas", ru: "украденное время" }
