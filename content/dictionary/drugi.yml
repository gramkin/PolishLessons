# review
id: drugi
format: 2
lemma: "drugi"
rank: 222
pos: noun
pron: { cyr: "дру́ги" }
senses:
  - id: second
    ru: "второй (по порядку)"
    examples:
      - pl: "Drugie lustro wisi obok drzwi."
        ru: "Второе зеркало висит рядом с дверью."
        source: { kind: tatoeba, id: 1550617 }
      - pl: "Moje mieszkanie jest na drugim piętrze."
        ru: "Моя квартира на третьем этаже."
        source: { kind: tatoeba, id: 12564168 }
      - pl: "Tomek jest w drugim pokoju."
        ru: "Том в другой комнате."
        source: { kind: tatoeba, id: 3655846 }
  - id: other
    ru: "другой (из двух), второй из пары"
    note: "«Иной, не такой» — это inny; drugi значит «второй, другой из двух»."
    examples:
      - pl: "Jeden jest wysoki, a drugi niski."
        ru: "Один высокий, а другой низкий."
        source: { kind: tatoeba, id: 2235044 }
      - pl: "Pierwszy jest lepszy od drugiego."
        ru: "Первый лучше второго."
        source: { kind: tatoeba, id: 6794816 }
      - pl: "Zjadłem hamburgera i zamówiłem drugiego."
        ru: "Я съел гамбургер и заказал ещё один."
        source: { kind: tatoeba, id: 749237 }
notes:
  - { kind: false-friend, text: "drugi — «второй» и «другой из двух». Русское «другой» в значении «иной» — это inny: inny samochód «другая машина», drugi samochód «вторая машина»." }
  - { kind: usage, text: "Этажи считаются иначе: первый этаж называется parter, поэтому drugie piętro — это русский третий этаж." }
  - { kind: usage, text: "po drugie — «во-вторых»; z drugiej strony — «с другой стороны»." }
collocations:
  - { pl: "po drugie", ru: "во-вторых" }
  - { pl: "z drugiej strony", ru: "с другой стороны" }
  - { pl: "drugi raz", ru: "второй раз" }
  - { pl: "jeden i drugi", ru: "и тот и другой" }
etymology: "Праславянское *drugъ — то же слово, что русские «другой» и «друг»: исходное значение «спутник, второй»."
memory: "drugi — «второй» и «другой из двух», а «иной» — inny. И осторожно с этажами: drugie piętro соответствует русскому третьему, ведь первый этаж — это parter."
idioms:
  - { pl: "po drugie", ru: "во-вторых" }
  - { pl: "z drugiej strony", ru: "с другой стороны" }
  - { pl: "druga strona medalu", ru: "обратная сторона медали" }
