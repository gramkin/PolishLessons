etymology: "Праславянское *dьnьsь — сращение слов «день сей». Русское «сегодня» построено по той же логике, но из других слов: «сего дня»."
memory: "dziś и dzisiaj — одно и то же «сегодня». Буквально это «день сей», как русское «сего дня». Запомните od dziś «с сегодняшнего дня»."
idioms:
