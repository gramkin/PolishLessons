notes:
  - { kind: false-friend, text: "Значение совпадает с русским «альбомом» полностью, и ловушка здесь не в смысле, а в сопоставлении с другим латинским словом из этого же словаря. ALBUM оканчивается на -UM, как IMPERIUM, MUZEUM и LICEUM, но склоняется в единственном числе полностью: ALBUMU, ALBUMOWI, ALBUMEM, ALBUMIE. Причина в роде: ALBUM в польском мужского рода, а IMPERIUM и MUZEUM среднего, и несклоняемость в единственном числе есть свойство именно среднего разряда. Поэтому W ALBUMIE правильно, а W MUZEUM без окончания тоже правильно, и различать их надо по роду, а не по виду слова." }
  - { kind: government, text: "Мужской род, неодушевлённое. Винительный равен именительному: OTWÓRZ ALBUM. Родительный на -U: BEZ ALBUMU. Местный на -IE: W ALBUMIE, и это как раз та форма, которой у слов среднего рода на -UM не бывает. Что внутри — предлог Z с творительным: ALBUM ZE ZDJĘCIAMI, и предлог удлиняется до ZE перед скоплением согласных. При отрицании винительный уходит в родительный: NIE MA ALBUMU." }
  - { kind: pronunciation, text: "Читается «а́льбум», ударение на первом слоге из двух — и здесь польский расходится с русским, где ударение падает на второй слог, «альбо́м». Буква L мягкая, как всегда, отсюда «ль». Конечное -UM звучит «ум», без носового призвука. В местном падеже ALBUMIE буква M смягчается перед -IE, и слогов становится три: AL-BU-MIE. Ударение по общему правилу стоит на предпоследнем слоге, а предпоследним теперь оказывается второй, поэтому «альбу́ме». Это обычное дело при склонении: правило не меняется, меняется длина формы, и вместе с ней то, какой слог окажется предпоследним." }
  - { kind: usage, text: "Устойчивые сочетания стоит держать рядом: ALBUM RODZINNY «семейный альбом», ALBUM ZE ZDJĘCIAMI, ALBUM NA ZNACZKI «альбом для марок», ALBUM MUZYCZNY. В книжном деле ALBUM означает большое иллюстрированное издание, и это значение в русском тоже есть. Уменьшительное ALBUMIK употребляется о маленьких детских альбомах. Обратите внимание, что фотоальбом в разговоре часто называют просто ALBUM, без уточнения, как и в русском." }
