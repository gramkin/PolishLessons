etymology: "Из латинского ALBUM «белая доска», от ALBUS «белый»: в Риме так называли выбеленную таблицу, на которой вывешивали объявления и списки. Отсюда значение «книга для записей и собирания», а затем и музыкальное, возникшее в двадцатом веке, когда пластинки продавали в папках, похожих на альбомы для фотографий. Русский «альбом» пришёл через французское ALBUM и немецкое посредство, и значения в двух языках совпали полностью. Корень ALBUS виден и в названии реки Эльбы, и в слове ALBINOS, и в итальянском ALBA «рассвет», то есть белизна зари."
memory: "Оканчивается на -um, как imperium и muzeum, но склоняется полностью: w albumie, bez albumu. Причина в роде: album мужского рода, а imperium и muzeum среднего, и несклоняемость единственного числа — свойство среднего разряда. Ударение на первом слоге, «а́льбум», а не «альбо́м». От латинского albus «белый»: выбеленная доска для объявлений."
