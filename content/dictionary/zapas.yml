notes:
  - { kind: usage, text: "Во множественном числе у слова есть второе, совсем отдельное значение: ZAPASY — это борьба как вид спорта, а борец называется ZAPAŚNIK. Связывают это с PAS «пояс»: схватку вели, держа соперника за пояс. Русский держит «запасы» и «борьбу» врозь, так что zapasy greckie здесь означают греческую борьбу, а не греческие запасы." }
  - { kind: pronunciation, text: "Родительный — ZAPASU, с окончанием -u, предложный — ZAPASIE, со смягчением s в si. От этого же слова прилагательное ZAPASOWY «запасной»: koło zapasowe, wyjście zapasowe, klucz zapasowy. Наречный оборот NA ZAPAS значит «впрок, заранее» и винительного при себе не требует." }
collocations:
  - { pl: "zapas wody", ru: "запас воды" }
  - { pl: "koło zapasowe", ru: "запасное колесо" }
  - { pl: "na zapas", ru: "впрок, заранее" }
family:
  - { pl: "zapasowy", ru: "запасной", relation: derived }
  - { pl: "zapaśnik", ru: "борец", relation: derived }
  - { pl: "pas", ru: "пояс", relation: root, id: pas }
etymology: "Приставка za- и корень pas, тот же, что в PAS «пояс», из праславянского *pojasъ. Запас мыслился как то, что заложено за пояс, припрятано при себе; русское «запас» собрано из тех же частей и той же мыслью. Спортивное значение множественного числа связывают с той же картинкой: в схватке держали за пояс, отсюда zapasy и zapaśnik."
memory: "Множественное zapasy — это борьба, а не только запасы. И прилагательное zapasowy значит «запасной»: koło zapasowe."
idioms:
  - { pl: "na zapas", ru: "впрок, заранее" }
  - { pl: "koło zapasowe", ru: "запасное колесо" }
