# review
id: bank
format: 2
lemma: "bank"
rank: 869
pos: noun
pron: { cyr: "банк" }
senses:
  - id: bank
    ru: "банк"
    examples:
      - pl: "Gdzie jest bank?"
        ru: "Где банк?"
        source: { kind: tatoeba, id: 10586178 }
      - pl: "To poczta, a to bank."
        ru: "Это почта, а то - банк."
        source: { kind: tatoeba, id: 353936 }
      - pl: "Czy bank jest otwarty?"
        ru: "Банк открыт?"
        source: { kind: tatoeba, id: 5336340 }
  - id: in-bank
    ru: "w banku, do banku — в банке, в банк"
    examples:
      - pl: "Nie mam konta w banku."
        ru: "У меня нет счёта в банке."
        source: { kind: tatoeba, id: 12955875 }
      - pl: "Idź do banku."
        ru: "Иди в банк."
        source: { kind: translated, id: 525466 }
      - pl: "Idę do banku."
        ru: "Я иду в банк."
        source: { kind: translated, id: 2349194 }
  - id: plural
    ru: "banki — банки (как учреждения)"
    examples:
      - pl: "Banki są dzisiaj zamknięte."
        ru: "Банки сегодня закрыты."
        source: { kind: translated, id: 3637588 }
      - pl: "Banki są otwierane o dziewiątej."
        ru: "Банки открываются в девять."
        source: { kind: translated, id: 1459805 }
      - pl: "Większość dużych banków wprowadza ten system."
        ru: "Большинство крупных банков вводит эту систему."
        source: { kind: translated, id: 365084 }
notes:
  - { kind: usage, text: "Предложный падеж — w banku «в банке», винительный с do — do banku «в банк»: Idę do banku." }
  - { kind: usage, text: "Разговорное na bank значит «точно, наверняка»: Na bank przyjdzie «Он точно придёт». А mieć coś jak w banku — «быть в чём-то совершенно уверенным»." }
  - { kind: usage, text: "Производные прозрачны: bankowy «банковский», bankier «банкир», bankomat «банкомат», konto w banku «счёт в банке»." }
  - { kind: false-friend, text: "Не путайте с русским «банка» (стеклянная) — это słoik. Польское bank только финансовое учреждение." }
collocations:
  - { pl: "konto w banku", ru: "счёт в банке" }
  - { pl: "iść do banku", ru: "идти в банк" }
  - { pl: "na bank", ru: "наверняка" }
  - { pl: "bankomat", ru: "банкомат" }
family:
  - { pl: "bankowy", ru: "банковский", relation: derived }
  - { pl: "bankier", ru: "банкир", relation: derived }
  - { pl: "bankomat", ru: "банкомат", relation: derived }
etymology: "Через немецкое Bank из итальянского banco «скамья, стол менялы». Русское «банк» пришло тем же путём, так что слова совпадают."
memory: "bank — «банк», без ловушек, но не путайте со стеклянной «банкой»: та по-польски słoik. Запомните w banku «в банке» и do banku «в банк», а из разговорного — na bank «наверняка» и mieć jak w banku «быть уверенным на все сто»."
idioms:
  - { pl: "na bank", ru: "наверняка" }
  - { pl: "mieć jak w banku", ru: "быть совершенно уверенным" }
  - { pl: "konto w banku", ru: "счёт в банке" }
