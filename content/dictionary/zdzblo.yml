# review
id: zdzblo
format: 2
lemma: "źdźbło"
rank: 2381
pos: noun
pron: { cyr: "зьдзьбуо" }
senses:
  - id: blade
    ru: "травинка, былинка"
    examples:
      - pl: "Mała biedronka szła po źdźble trawy."
        ru: "Маленькая божья коровка шла по травинке."
        source: { kind: translated, id: 6155768 }
      - pl: "Źdźbło trawy drżało na wietrze."
        ru: "Травинка дрожала на ветру."
        source: { kind: authored }
      - pl: "Wziął do ust źdźbło trawy."
        ru: "Он взял в рот травинку."
        source: { kind: authored }
  - id: stalk
    ru: "стебелёк, соломинка"
    examples:
      - pl: "Na stole leżało źdźbło słomy."
        ru: "На столе лежала соломинка."
        source: { kind: authored }
      - pl: "Ani źdźbła prawdy w tym nie ma."
        ru: "В этом нет ни капли правды."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Почти всегда в сочетании źdźbło trawy «травинка» — слово trawa у нас в словаре тоже есть." }
  - { kind: false-friend, text: "Переносно ani źdźbła значит «ни капли, ни крупицы»: ani źdźbła prawdy «ни капли правды». Русский в этом обороте берёт каплю, поляк — травинку." }
  - { kind: government, text: "Средний род: to źdźbło, tego źdźbła. Множественное — źdźbła." }
  - { kind: usage, text: "Произношение трудное: źdź — это два мягких звука подряд, «зьдзь». Слово часто приводят как пример нагромождения согласных." }
collocations:
  - { pl: "źdźbło trawy", ru: "травинка" }
  - { pl: "ani źdźbła", ru: "ни капли" }
etymology: "Праславянское *stьblo, родственное «стебель»; польская форма обросла мягкими согласными."
memory: "źdźbło — «травинка», обычно źdźbło trawy. Переносно ani źdźbła «ни капли». Произносится «зьдзьбуо» — два мягких звука подряд."
idioms:
  - { pl: "źdźbło trawy", ru: "травинка" }
  - { pl: "ani źdźbła", ru: "ни капли" }
