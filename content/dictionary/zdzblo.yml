  - id: stalk
    ru: "стебелёк, соломинка"
    examples:
      - pl: "Na stole leżało źdźbło słomy."
        ru: "На столе лежала соломинка."
        source: { kind: authored }
      - pl: "Ani źdźbła prawdy w tym nie ma."
        ru: "В этом нет ни капли правды."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Почти всегда в сочетании źdźbło trawy «травинка» — слово trawa у нас в словаре тоже есть." }
  - { kind: false-friend, text: "Переносно ani źdźbła значит «ни капли, ни крупицы»: ani źdźbła prawdy «ни капли правды». Русский в этом обороте берёт каплю, поляк — травинку." }
  - { kind: government, text: "Средний род: to źdźbło, tego źdźbła. Множественное — źdźbła." }
  - { kind: usage, text: "Произношение трудное: źdź — это два мягких звука подряд, «зьдзь». Слово часто приводят как пример нагромождения согласных." }
collocations:
