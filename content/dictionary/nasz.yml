# review
id: nasz
format: 2
lemma: "nasz"
rank: 71
pos: adj
pron: { cyr: "наш" }
senses:
  - id: our
    ru: "наш, наша, наше"
    examples:
      - pl: "Nasz pies gryzie!"
        ru: "Наша собака кусается!"
        source: { kind: tatoeba, id: 513511 }
      - pl: "Oto nasza szkoła."
        ru: "Вот наша школа."
        source: { kind: tatoeba, id: 348765 }
      - pl: "To jest nasza praca."
        ru: "Это наша работа."
        source: { kind: tatoeba, id: 2252236 }
  - id: ours
    ru: "наш (в косвенных падежах)"
    examples:
      - pl: "Za naszym domem jest park."
        ru: "За нашим домом парк."
        source: { kind: tatoeba, id: 2733989 }
      - pl: "Mówimy o naszych przyjaciołach."
        ru: "Мы говорим о наших друзьях."
        source: { kind: tatoeba, id: 13783087 }
notes:
  - { kind: usage, text: "Склоняется как прилагательное: nasz, nasza, nasze, naszego…" }
  - { kind: usage, text: "Мужская личная форма множественного числа — nasi (nasi goście), остальные — nasze." }
collocations:
  - { pl: "nasz dom", ru: "наш дом" }
  - { pl: "po naszemu", ru: "по-нашему" }
etymology: "Праславянское *našь — то же слово, что русское «наш»."
memory: "nasz = «наш» и склоняется как прилагательное. Единственная неожиданность — мужская личная форма множественного числа nasi: nasi goście «наши гости», но nasze książki «наши книги»."
idioms:
  - { pl: "po naszemu", ru: "по-нашему" }
  - { pl: "tłumaczyć z polskiego na nasze", ru: "объяснять по-простому" }
