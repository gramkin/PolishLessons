# review
id: ostrzec
format: 2
lemma: "ostrzec"
rank: 1504
pos: verb
aspect: perf
pron: { cyr: "о́стшэц" }
senses:
  - id: warn
    ru: "предупредить, предостеречь"
    examples:
      - pl: "Muszę ostrzec Toma."
        ru: "Я должен предупредить Тома."
        source: { kind: translated, id: 3886578 }
      - pl: "Ostrzegłem go przed niebezpieczeństwem."
        ru: "Я предупредил его об опасности."
        source: { kind: translated, id: 349132 }
      - pl: "Nauczyciel ostrzegł nas, że test będzie trudny."
        ru: "Учитель предупредил нас, что тест будет трудным."
        source: { kind: translated, id: 3584764 }
  - id: warning
    ru: "ostrzeżenie — предупреждение"
    examples:
      - pl: "To moje ostatnie ostrzeżenie!"
        ru: "Это моё последнее предупреждение!"
        source: { kind: tatoeba, id: 8658883 }
      - pl: "Tom wyszedł bez ostrzeżenia."
        ru: "Том вышел без предупреждения."
        source: { kind: translated, id: 3941182 }
notes:
  - { kind: government, text: "ostrzec kogoś przed czymś — «предупредить кого-то о чём-то», с przed и творительным: ostrzegł mnie przed niebezpieczeństwem. Русский говорит «о», польский — «перед»." }
  - { kind: usage, text: "Совершенный вид к ostrzegać." }
  - { kind: usage, text: "Отглагольное существительное ostrzeżenie «предупреждение» очень частотно: bez ostrzeżenia «без предупреждения», ostatnie ostrzeżenie «последнее предупреждение»." }
  - { kind: usage, text: "Того же корня прилагательное ostrożny «осторожный», которое уже есть карточкой." }
collocations:
  - { pl: "ostrzec przed niebezpieczeństwem", ru: "предупредить об опасности" }
  - { pl: "bez ostrzeżenia", ru: "без предупреждения" }
  - { pl: "ostatnie ostrzeżenie", ru: "последнее предупреждение" }
etymology: "Приставка o- и strzec «стеречь, оберегать» (праславянское *stergti). Русские «стеречь» и «остерегать» того же корня."
memory: "ostrzec — «предупредить», от strzec «стеречь», как русское «остеречь». Управление: ostrzec kogoś przed czymś — предлог przed, а не «о». Существительное ostrzeżenie «предупреждение»."
idioms:
  - { pl: "bez ostrzeżenia", ru: "без предупреждения" }
  - { pl: "ostatnie ostrzeżenie", ru: "последнее предупреждение" }
  - { pl: "ostrzec przed niebezpieczeństwem", ru: "предупредить об опасности" }
