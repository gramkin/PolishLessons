        ru: "Я бы хотел поехать во Францию."
        source: { kind: tatoeba, id: 360158 }
notes:
  - { kind: government, text: "Где — we Francji (предложный падеж, предлог удлиняется перед группой согласных); куда — do Francji (родительный); откуда — z Francji." }
  - { kind: usage, text: "Обратите внимание: we Francji, а не w Francji — перед fr предлог w превращается в we, как we wszechświecie." }
  - { kind: usage, text: "Прилагательное — francuski «французский», житель — Francuz, Francuzka." }
  - { kind: false-friend, text: "Название страны женского рода и склоняется полностью: Francja, Francji, Francję, Francją — в отличие от несклоняемого Chicago." }
collocations:
  - { pl: "we Francji", ru: "во Франции" }
  - { pl: "do Francji", ru: "во Францию" }
  - { pl: "stolica Francji", ru: "столица Франции" }
family:
  - { pl: "francuski", ru: "французский", relation: root, id: francuski }
  - { pl: "Francuz", ru: "француз", relation: root }
  - { pl: "Anglia", ru: "Англия", relation: root, id: anglia }
etymology: "От названия племени франков через латинское Francia; русское «Франция» пришло тем же путём."
memory: "Francja — «Франция», склоняется полностью: do Francji, we Francji. Обратите внимание на we вместо w перед fr."
