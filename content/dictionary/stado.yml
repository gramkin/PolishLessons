notes:
  - { kind: usage, text: "Дательный и местный у слова разные: STADU в дательном, STADZIE в местном, с переходом d в dź. Это второе подтверждение правила, выведенного в карточке PISMO: у среднего рода дательный берёт -u, а местный -e со смягчением, — но только если основа не кончается на заднеязычный. У ŚRODOWISKO и CIASTKO основа на k, и там местный уходит к -u, совпадая с дательным. Здесь основа на d, и формы разошлись, как и у pismo с его pismu и piśmie." }
  - { kind: usage, text: "Переход d в dź перед окончанием -e — третий случай в словаре после URZĘDZIE и MODZIE. Ряд этот стоит держать целиком, потому что согласный на письме меняется сильно и формы выглядят непохожими на исходное слово: stado — stadzie, moda — modzie, urząd — urzędzie. Перед гласной мягкое dź пишется как dzi, отсюда и такое написание." }
  - { kind: usage, text: "Русский делит это понятие на три слова, польский обходится одним. STADO — это и стадо (stado krów, stado owiec), и стая (stado ptaków, stado wilków), и табун (stado koni). Выбор русского перевода зависит только от того, о каком животном речь, само же польское слово разницы не делает. Переносно STADO BARANÓW говорят о людях ровно так же, как русское «стадо баранов»." }
collocations:
  - { pl: "stado owiec", ru: "стадо овец" }
  - { pl: "stado ptaków", ru: "стая птиц" }
