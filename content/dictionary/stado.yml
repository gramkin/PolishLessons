etymology: "Из праславянского *stado — того же слова, что русское «стадо», в родстве с глаголом *stati «стать» и с «стадией» лишь по случайному созвучию. Слова совпадают полностью и по звучанию, и по основному смыслу, так что запоминать нечего. Разница только в охвате: польское stado покрывает ещё стаю и табун, для которых русский держит отдельные слова."
memory: "Дательный stadu, но местный stadzie: d даёт dzi. Одно слово на русские «стадо», «стая» и «табун»."
idioms:
  - { pl: "stado baranów", ru: "стадо баранов" }
  - { pl: "instynkt stadny", ru: "стадный инстинкт" }
