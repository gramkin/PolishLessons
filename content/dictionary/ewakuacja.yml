notes:
  - { kind: false-friend, text: "EWAKUACJA — «эвакуация», как в русском. Табличка WYJŚCIE EWAKUACYJNE — «запасный выход». Эвакуировать — EWAKUOWAĆ, эвакуироваться — EWAKUOWAĆ SIĘ." }
  - { kind: usage, text: "Женский род. Родительный, дательный и местный — EWAKUACJI. Множественное — EWAKUACJE, о нескольких случаях. Звательный и архаичное EWAKUACYJ не используем." }
  - { kind: government, text: "Объявить эвакуацию — ZARZĄDZIĆ EWAKUACJĘ, винительный. Во время эвакуации — PODCZAS EWAKUACJI, родительный. Эвакуация из чего — EWAKUACJA Z и родительный." }
  - { kind: pronunciation, text: "Читается «эвакуа́цья»: E — «э», U и A раздельно, CJA — «цья». Ударение на предпоследнем слоге." }
collocations:
  - { pl: "zarządzić ewakuację", ru: "объявить эвакуацию" }
