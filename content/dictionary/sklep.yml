# review
id: sklep
format: 2
lemma: "sklep"
rank: 647
pos: noun
pron: { cyr: "склэп" }
senses:
  - id: shop
    ru: "магазин, лавка"
    note: "Ложный друг: русское «склеп» — это grobowiec, а не sklep."
    examples:
      - pl: "Gdzie jest najbliższy sklep?"
        ru: "Где находится ближайший магазин?"
        source: { kind: tatoeba, id: 2143083 }
      - pl: "Gdzie jest sklep spożywczy?"
        ru: "Где продуктовый магазин?"
        source: { kind: tatoeba, id: 12678662 }
      - pl: "Na wyspie jest tylko jeden sklep."
        ru: "На острове только один магазин."
        source: { kind: tatoeba, id: 1181520 }
  - id: at-shop
    ru: "w sklepie «в магазине», do sklepu «в магазин»"
    note: "Направление — do с родительным, место — w с предложным."
    examples:
      - pl: "Idę do sklepu."
        ru: "Я иду в магазин."
        source: { kind: tatoeba, id: 656188 }
      - pl: "Byłaś w sklepie?"
        ru: "Ты была в магазине?"
        source: { kind: tatoeba, id: 6154857 }
      - pl: "W sklepie przymierzyłem trzy koszulki."
        ru: "Я померил в магазине три футболки."
        source: { kind: tatoeba, id: 12293600 }
  - id: shops
    ru: "sklepy — магазины; chodzić po sklepach «ходить по магазинам»"
    examples:
      - pl: "Wzdłuż ulicy ciągną się sklepy."
        ru: "Вдоль улицы тянутся магазины."
        source: { kind: tatoeba, id: 440515 }
      - pl: "W niedziele sklepy są zatłoczone."
        ru: "По воскресеньям в магазинах толпа."
        source: { kind: tatoeba, id: 3750078 }
      - pl: "Zabijała czas, chodząc po sklepach."
        ru: "Она убивала время, ходя по магазинам."
        source: { kind: translated, id: 676776 }
notes:
  - { kind: false-friend, text: "Самая коварная пара во всём разделе: польское sklep — это «магазин», а русский «склеп» по-польски grobowiec или krypta. Слово одно, значения разошлись." }
  - { kind: government, text: "Направление и место различаются как в русском: idę DO sklepu «иду В магазин» (do с родительным), но jestem W sklepie «я В магазине» (w с предложным)." }
  - { kind: usage, text: "Типы: sklep spożywczy «продуктовый», sklep obuwniczy «обувной», sklep internetowy «интернет-магазин»." }
  - { kind: usage, text: "«Ходить по магазинам» — chodzić po sklepach, с предложным падежом множественного числа." }
collocations:
  - { pl: "sklep spożywczy", ru: "продуктовый магазин" }
  - { pl: "do sklepu", ru: "в магазин" }
  - { pl: "w sklepie", ru: "в магазине" }
  - { pl: "chodzić po sklepach", ru: "ходить по магазинам" }
family:
  - { pl: "sklepik", ru: "лавочка", relation: derived }
  - { pl: "sklepikarz", ru: "лавочник", relation: derived }
  - { pl: "sklepowy", ru: "магазинный", relation: derived }
etymology: "От старого значения «свод, сводчатое помещение» — то же слово, что русское «склеп». Торговали в сводчатых подвалах, и название помещения перешло на лавку: русский оставил за словом погребальный свод, поляк взял торговый."
memory: "sklep — «магазин», и это одна из самых коварных пар для русского уха: по-польски «склеп» будет grobowiec, а sklep — обычная лавка. У слов общий предок со значением «сводчатый подвал», просто русский запомнил свод погребальный, а поляк торговый. Падежи как в русском: idę DO sklepu, jestem W sklepie."
idioms:
  - { pl: "sklep spożywczy", ru: "продуктовый магазин" }
  - { pl: "chodzić po sklepach", ru: "ходить по магазинам" }
  - { pl: "sklep internetowy", ru: "интернет-магазин" }
formExamplesSkip:
  - { form: "sklepie", cell: "Звательный", reason: "звательный падеж: для неодушевлённого существительного он практически не употребляется" }
