notes:
  - { kind: false-friend, text: "zwierzę — это «животное», любое, а не «зверь». Русскому «зверь» (дикий) отвечает zwierz или dzikie zwierzę. Кошка и собака тоже zwierzęta, хотя «зверями» их по-русски не назовёшь." }
  - { kind: usage, text: "Существительное среднего рода на -ę, и склоняется оно с наращением: zwierzę, zwierzęcia, zwierzęciu, zwierzęciem. Так же ведут себя imię «имя» и cielę «телёнок»." }
  - { kind: usage, text: "Множественное число — zwierzęta, родительный zwierząt: Lew jest królem zwierząt «Лев — царь зверей»." }
  - { kind: usage, text: "Прилагательное — zwierzęcy «животный»: instynkt zwierzęcy. А zwierzyna значит «дичь»." }
collocations:
  - { pl: "dzikie zwierzę", ru: "дикое животное" }
  - { pl: "domowe zwierzę", ru: "домашнее животное" }
  - { pl: "król zwierząt", ru: "царь зверей" }
  - { pl: "ogród zoologiczny", ru: "зоопарк" }
family:
  - { pl: "zwierz", ru: "зверь (дикий)", relation: root }
  - { pl: "zwierzęcy", ru: "животный", relation: derived }
  - { pl: "zwierzyna", ru: "дичь", relation: derived }
etymology: "От zwierz «зверь» с уменьшительным суффиксом -ę, как cielę «телёнок». Русское «зверь» — тот же корень, но в польском уменьшительная форма вытеснила исходную и стала обычным словом для любого животного."
memory: "zwierzę — «животное», а не «зверь»: кошка и собака тоже zwierzęta. «Зверь» в русском смысле — zwierz или dzikie zwierzę. Склоняется с наращением, как imię: zwierzę, zwierzęcia, zwierzęciem, во множественном zwierzęta, zwierząt."
idioms:
  - { pl: "król zwierząt", ru: "царь зверей" }
  - { pl: "dzikie zwierzę", ru: "дикое животное" }
  - { pl: "domowe zwierzę", ru: "домашнее животное" }
