pron: { cyr: "досьвя́дчаць" }
senses:
  - id: experience
    ru: "испытывать, переживать (что-л. — род. п.)"
    examples:
      - pl: "Francuska inteligencja doświadcza wzlotów i upadków."
        ru: "Французская интеллигенция переживает взлёты и падения."
        source: { kind: translated, id: 6029839 }
      - pl: "To dlatego lubię podróże i chciałbym doświadczać wielu różnych kultur."
        ru: "Поэтому я люблю путешествия и хотел бы узнать на себе много разных культур."
        source: { kind: translated, id: 3656277 }
      - pl: "Nigdy nie doświadczamy życia intensywniej niż podczas wielkiej miłości oraz głębokiego smutku."
        ru: "Никогда мы не переживаем жизнь острее, чем во время большой любви и глубокой печали."
        source: { kind: translated, id: 6159830 }
  - id: test
    ru: "книжн. испытывать, подвергать испытаниям (кого-л. — о судьбе, Боге)"
    examples:
      - pl: "Los ciężko doświadcza tę rodzinę."
        ru: "Судьба тяжело испытывает эту семью."
        source: { kind: authored }
      - pl: "Wojna doświadczała ludzi ponad ich siły."
        ru: "Война испытывала людей сверх их сил."
        source: { kind: authored }
notes:
  - { kind: government, text: "«Испытывать что-то» — родительный, а не винительный, как в русском: doświadczać bólu, strachu, przemocy, radości. «Tom doświadczał to» — ошибка; правильно doświadczał tego. Винительный только во втором, книжном значении: los doświadcza kogoś, «судьба испытывает кого-то»." }
  - { kind: usage, text: "Несовершенный вид, пара — DOŚWIADCZYĆ: doświadczam stresu codziennie, но doświadczyłem tego raz. Отглагольное DOŚWIADCZANIE — процесс («переживание»), а DOŚWIADCZENIE — «опыт» и «эксперимент»: mam duże doświadczenie, «у меня большой опыт»." }
  - { kind: pronunciation, text: "«досьвя́дчаць»: Ś — «сь», IA — «я», DCZ — «дч», почти «ч». Ударение на предпоследнем слоге ŚWIAD." }
  - { kind: register, text: "Книжно-нейтральное: психология, журналистика, литература. В разговоре — PRZEŻYWAĆ, CZUĆ, MIEĆ: czuję stres, «испытываю стресс»." }
collocations:
  - { pl: "doświadczać bólu", ru: "испытывать боль" }
  - { pl: "doświadczać przemocy", ru: "подвергаться насилию" }
  - { pl: "doświadczać radości", ru: "испытывать радость" }
  - { pl: "ciężko doświadczony przez los", ru: "тяжело испытанный судьбой" }
family:
  - { pl: "doświadczyć", ru: "испытать", relation: aspect, id: doswiadczyc }
  - { pl: "doświadczenie", ru: "опыт; эксперимент", relation: derived, id: doswiadczenie }
  - { pl: "doświadczony", ru: "опытный", relation: derived }
etymology: "От DO- и ŚWIADCZYĆ, «свидетельствовать», от ŚWIADEK, «свидетель», того же корня, что русское «ведать», «свидетель», «весть». DOŚWIADCZAĆ — «дойти до знания на себе», убедиться лично; отсюда и «опыт», DOŚWIADCZENIE."
memory: "Doświadczać — испытывать на себе, от świadek, «свидетель»: стать свидетелем собственной жизни. С РОДИТЕЛЬНЫМ: doświadczać bólu, radości. Пара — doświadczyć; опыт — doświadczenie."
idioms:
