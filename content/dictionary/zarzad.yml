notes:
  - { kind: false-friend, text: "Ловушка почти совершенная: ZARZĄD звучит как русское «заряд», а значит совсем другое — «правление, управление». Русскому «заряду», и электрическому, и взрывному, отвечает польское ŁADUNEK. Самое любопытное, что слова эти не просто похожи, а действительно одного строения: и ZARZĄD, и «заряд» собраны из приставки за- и корня, который в польском дал RZĄD, а в русском «ряд», оба из праславянского *rędъ «порядок, строй». Польский пошёл от «порядка» к «управлению», русский — от «рядить, снаряжать» к «заряду». Один и тот же состав, два расхождения смысла." }
  - { kind: usage, text: "Рядом стоят три слова, которые русскому легко слить в одно, а различать их нужно твёрдо. ZARZĄD — это люди или учреждение: совет, правление, управление. ZARZĄDZANIE — это деятельность, «управление» как процесс: STUDIA Z ZARZĄDZANIA «учёба по управлению». ZARZĄDZENIE — это документ, «распоряжение, приказ»: WYDAĆ ZARZĄDZENIE. По-русски все три можно передать словом «управление» или «распоряжение», и именно поэтому стоит заучить их по отдельности, с примерами." }
  - { kind: pronunciation, text: "Читается «за́жонт», в два слога, с ударением на первом. Разберём по частям: rz даёт «ж», ą даёт «он» перед согласной, а конечное d оглушается в «т». Поэтому не «зарзонд» и не «заржонд», а «за́жонт». В предложном падеже ZARZĄDZIE звучит «зажо́ндзе», с мягким дзь: d переходит в dz перед окончанием -IE, ровно как в OBIAD и W OBIEDZIE." }
  - { kind: government, text: "Чей, какой — родительный падеж без предлога: ZARZĄD SPÓŁKI, ZARZĄD DRÓG, ZARZĄD OKRĘGU. Где состоять — предлог W с предложным: ZASIADAĆ W ZARZĄDZIE, BYĆ W ZARZĄDZIE. Куда передать — предлог DO с родительным: PRZEKAZAĆ DO ZARZĄDU. Родительный множественного — ZARZĄDÓW. Обратите внимание на чередование d в dz в предложном падеже: ZARZĄD, но W ZARZĄDZIE." }
