etymology: "Приставка ZA- и корень RZĄD «порядок, строй, ряд», из праславянского *rędъ, от которого русское «ряд» и глагол «рядить». Исходно ZARZĄD значило «приведение в порядок», откуда и нынешнее «управление». Русское «заряд» собрано из тех же двух частей — за- плюс тот же корень в виде «ряд» — но пошло другой дорогой смысла: от «снаряжать, рядить» к тому, чем снаряжают оружие. Поэтому похожесть здесь не случайна и не обманчива по происхождению: обманчив только результат. Польское RZĄD сохранило оба значения исходного корня, и «правительство», и «ряд»: SIEDZIEĆ W PIERWSZYM RZĘDZIE значит «сидеть в первом ряду»."
memory: "Не «заряд»! ZARZĄD — это правление, управление; русский «заряд» по-польски ŁADUNEK. Слова при этом одного состава: за- плюс ряд. Три соседа различать твёрдо: zarząd (люди), zarządzanie (деятельность), zarządzenie (документ). Читается «за́жонт», в предложном — w zarządzie."
idioms:
  - { pl: "zasiadać w zarządzie", ru: "входить в правление" }
  - { pl: "zarząd przymusowy", ru: "принудительное управление" }
