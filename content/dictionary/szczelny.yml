  - { form: "szczelniejsi", reason: "szczelny описывает предметы (окна, крышки, ёмкости, оцепление); с личными существительными мужского рода не сочетается, и форма szczelniejsi не употребляется" }
  - { form: "najszczelniejsi", reason: "szczelny описывает предметы (окна, крышки, ёмкости, оцепление); с личными существительными мужского рода не сочетается, и форма najszczelniejsi не употребляется" }
