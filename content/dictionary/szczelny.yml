pron: { cyr: "шчэ́льны" }
senses:
  - id: airtight
    ru: "герметичный, плотный, непромокаемый"
    examples:
      - pl: "Szczelny pojemnik nie przepuszcza powietrza."
        ru: "Герметичный контейнер не пропускает воздух."
        source: { kind: authored }
      - pl: "Nowe okna są szczelne i ciepłe."
        ru: "Новые окна герметичные и тёплые."
        source: { kind: authored }
      - pl: "Kawę przechowuj w szczelnym słoiku."
        ru: "Кофе храни в герметичной банке."
        source: { kind: authored }
  - id: impenetrable
    ru: "плотный, непроницаемый, без лазеек (об оцеплении, границе, системе)"
    examples:
      - pl: "Kordon wokół budynku był szczelny."
        ru: "Оцепление вокруг здания было плотным."
        source: { kind: authored }
      - pl: "Granica była wtedy prawie szczelna."
        ru: "Граница тогда была почти непроницаемой."
        source: { kind: authored }
notes:
  - { kind: usage, text: "SZCZELNY значит «без щелей, ничего не пропускающий»: о крышке, окне, банке, палатке, часах. Русскому нужно несколько слов: «герметичный» для банки, «плотный» для окна, «непромокаемый» для мешка, «водонепроницаемый» для часов. В переносном смысле так говорят об оцеплении, границе или законе без лазеек: SZCZELNY KORDON, SZCZELNE PRZEPISY. Противоположность — NIESZCZELNY «протекающий, негерметичный»: NIESZCZELNY DACH, NIESZCZELNE OKNO." }
  - { kind: usage, text: "Прилагательное качественное и имеет степени: SZCZELNIEJSZY, NAJSZCZELNIEJSZY, всё регулярно через -IEJSZY. Описывает оно только предметы, поэтому мужско-личные формы SZCZELNI, SZCZELNIEJSI, NAJSZCZELNIEJSI хоть и значатся в таблице, в речи не встречаются. Очень частое наречие SZCZELNIE «плотно»: SZCZELNIE ZAMKNIĘTY «плотно закрытый», SZCZELNIE WYPEŁNIONA SALA «битком набитый зал»." }
  - { kind: pronunciation, text: "«шчэ́льны»: SZCZ читается как «шч», два звука подряд, а не как русское «щ». L перед согласным N звучит мягко, «ль». В сравнительной степени ударение уходит вперёд: SZCZELNIEJSZY, «шчэльне́йшы»." }
