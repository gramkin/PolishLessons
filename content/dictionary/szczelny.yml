family:
  - { pl: "szczelnie", ru: "плотно, герметично", relation: derived }
  - { pl: "nieszczelny", ru: "негерметичный, протекающий", relation: antonym }
  - { pl: "uszczelka", ru: "прокладка, уплотнитель", relation: derived }
  - { pl: "uszczelnić", ru: "уплотнить, загерметизировать", relation: derived }
etymology: "Происхождение слова не вполне ясно. Современное значение «плотный, без зазоров» в польском давнее, и от него образованы uszczelnić «уплотнить» и uszczelka «прокладка»."
memory: "Представь банку, где нет ни одной щёлочки: она szczelna. Если капает — nieszczelna. А резинка, которая не даёт ей течь, — uszczelka."
idioms:
