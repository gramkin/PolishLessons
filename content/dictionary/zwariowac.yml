# review
id: zwariowac
format: 2
lemma: "zwariować"
rank: 1889
pos: verb
aspect: perf
pron: { cyr: "зварьо́ваць" }
senses:
  - id: go-mad
    ru: "сойти с ума, помешаться"
    examples:
      - pl: "Tom zwariował!"
        ru: "Том сошёл с ума!"
        source: { kind: translated, id: 1355948 }
      - pl: "Zwariował po tym fatalnym zdarzeniu."
        ru: "Он сошёл с ума после того рокового происшествия."
        source: { kind: translated, id: 640336 }
      - pl: "Moja rodzina uważa, że zwariowałem."
        ru: "Моя семья считает, что я сошёл с ума."
        source: { kind: translated, id: 3982778 }
      - pl: "Większość ludzi sądzi, że zwariowałem."
        ru: "Большинство людей думает, что я сошёл с ума."
        source: { kind: translated, id: 532860 }
      - pl: "Zwariowała z powodu szoku."
        ru: "Она сошла с ума от потрясения."
        source: { kind: translated, id: 591072 }
      - pl: "Zwariowałeś?"
        ru: "Ты с ума сошёл?"
        source: { kind: tatoeba, id: 531813 }
  - id: crazy-about
    ru: "помешаться на чём-либо, потерять голову"
    examples:
      - pl: "Jim zwariował na punkcie swojej dziewczyny."
        ru: "Джим помешался на своей девушке."
        source: { kind: translated, id: 892460 }
      - pl: "Nie daj się zwariować na punkcie pieniędzy, włosów i ubrań."
        ru: "Не сходи с ума из-за денег, волос и одежды."
        source: { kind: translated, id: 2145266 }
notes:
  - { kind: register, text: "Разговорное, но не грубое: Zwariowałeś? «Ты с ума сошёл?» — обычная эмоциональная реакция, а не оскорбление." }
  - { kind: usage, text: "Конструкция zwariować na punkcie czegoś значит «помешаться на чём-то»: zwariował na punkcie tenisa «он помешался на теннисе»." }
  - { kind: usage, text: "Совершенный вид к wariować. Того же корня wariat «сумасшедший» и wariacki «безумный»." }
  - { kind: usage, text: "Рядом стоит oszaleć: оно ближе к «обезуметь», а zwariować — самое обиходное слово." }
  - { kind: usage, text: "Отглагольное существительное zwariowanie в языке возможно, но редко: о безумии обычно говорят szaleństwo или obłęd, а о помешательстве на чём-то — mieć bzika na punkcie czegoś." }
collocations:
  - { pl: "zwariować na punkcie", ru: "помешаться на чём-либо" }
  - { pl: "można zwariować", ru: "с ума сойти можно" }
  - { pl: "chyba zwariował", ru: "он, кажется, с ума сошёл" }
etymology: "От wariat «сумасшедший», пришедшего из латинского varius «переменчивый, пёстрый» через немецкий. В русском от того же латинского корня «вариация» и «вариант», но без всякого оттенка безумия."
memory: "Zwariowałeś? — «Ты с ума сошёл?». А zwariować na punkcie czegoś — «помешаться на чём-то»: zwariował na punkcie tenisa."
idioms:
  - { pl: "zwariować na punkcie", ru: "помешаться на чём-либо" }
  - { pl: "można zwariować", ru: "с ума сойти можно" }
  - { pl: "chyba zwariował", ru: "он, кажется, с ума сошёл" }
