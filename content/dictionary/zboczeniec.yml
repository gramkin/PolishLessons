  - id: perv-joke
    ru: "разг., шутл. пошляк"
    examples:
      - pl: "Przestań, zboczeńcu, to nie było śmieszne!"
        ru: "Перестань, пошляк, это было не смешно!"
        source: { kind: authored }
      - pl: "Mój kolega to straszny zboczeniec, wszędzie widzi podteksty."
        ru: "Мой приятель — страшный пошляк, везде видит подтекст."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Русскому «збоченец» ничего не скажет, а корень прозрачен: ZBOCZYĆ — «свернуть в сторону, отклониться», как русское «сбиться с пути». ZBOCZENIE — «отклонение, извращение», ZBOCZENIEC — «извращенец». Между друзьями слово бывает шутливым «пошляк», но о незнакомце — серьёзное обвинение." }
  - { kind: usage, text: "Мужской род, одушевлённое, мужское-личное, с беглым E и мягким Ń в косвенных падежах: ZBOCZENIEC, ZBOCZEŃCA, множественное ZBOCZEŃCY. Звательный ZBOCZEŃCU — частая форма в шутливой перепалке. Звательный ZBOCZEŃCZE из словаря в живой речи не встречается." }
  - { kind: government, text: "Предупреждать об извращенцах — OSTRZEGAĆ PRZED ZBOCZEŃCAMI, PRZED с творительным. Жертва извращенца — OFIARA ZBOCZEŃCA, родительный. Падежных требований существительное не имеет." }
  - { kind: pronunciation, text: "Читается «збочэ́нец», три слога, ударение на предпоследнем. ZB в начале звонкое. В косвенных падежах NIE превращается в мягкое «нь»: ZBOCZEŃCA — «збочэ́ньца»." }
  - { kind: register, text: "В прямом значении — разговорное и уголовное, серьёзное обвинение. Официально пишут SPRAWCA PRZESTĘPSTWA SEKSUALNEGO. В шутку между друзьями ZBOCZENIEC — «пошляк», и так его говорят даже подростки." }
collocations:
  - { pl: "stary zboczeniec", ru: "старый извращенец" }
  - { pl: "ty zboczeńcu", ru: "ты, пошляк" }
  - { pl: "ostrzegać przed zboczeńcami", ru: "предупреждать об извращенцах" }
family:
  - { pl: "zboczenie", ru: "отклонение, извращение", relation: derived }
  - { pl: "zboczony", ru: "извращённый, пошлый", relation: derived }
  - { pl: "zboczyć", ru: "свернуть, отклониться", relation: root }
etymology: "От ZBOCZYĆ «свернуть с дороги», от BOK «бок, сторона»: «уйти в сторону». ZBOCZENIE сначала значило просто «отклонение»: ZBOCZENIE Z KURSU, «отклонение от курса», и лишь потом — сексуальное отклонение. Русское «сбиться с пути» — близкий образ."
memory: "Zboczeniec — извращенец; шутливо — пошляк: ty zboczeńcu! От zboczyć — свернуть в сторону, от bok. Читается «збочэ́нец»."
idioms:
  - { pl: "ty zboczeńcu", ru: "ты пошляк (шутл.)" }
formExamplesSkip:
