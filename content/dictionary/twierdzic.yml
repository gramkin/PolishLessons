# review
id: twierdzic
format: 2
lemma: "twierdzić"
rank: 732
pos: verb
aspect: imperf
pron: { cyr: "тфе́рдзиць" }
senses:
  - id: claim
    ru: "утверждать"
    examples:
      - pl: "Twierdził, że jest niewinny."
        ru: "Он настаивал на том, что он невиновен."
        source: { kind: tatoeba, id: 736790 }
      - pl: "Twierdzi, że jest malarzem."
        ru: "Он утверждает, что он художник."
        source: { kind: translated, id: 1613954 }
      - pl: "Tom twierdził, że widział UFO."
        ru: "Том утверждал, что видел НЛО."
        source: { kind: translated, id: 5224026 }
  - id: claim-that
    ru: "twierdzić, że… — утверждать, что…"
    note: "Запятая перед że обязательна."
    examples:
      - pl: "Ona twierdzi, że była tam dwa razy, ale nie wierzę jej."
        ru: "Она утверждает, что была там два раза, но я ей не верю."
        source: { kind: tatoeba, id: 6154822 }
      - pl: "Tom i John obaj twierdzą, że całowali się z Mary."
        ru: "Том и Джон оба говорят, что целовались с Мэри."
        source: { kind: tatoeba, id: 7164752 }
      - pl: "Twierdzili, że obniżka podatków była jej zasługą."
        ru: "Они утверждали, что снижение налогов — её заслуга."
        source: { kind: translated, id: 603046 }
  - id: affirmative
    ru: "odpowiedź twierdząca — утвердительный ответ"
    examples:
      - pl: "Dał ci odpowiedź twierdzącą czy przeczącą?"
        ru: "Он дал тебе утвердительный ответ или отрицательный?"
        source: { kind: translated, id: 441244 }
      - pl: "Dał odpowiedź twierdzącą."
        ru: "Он дал утвердительный ответ."
        source: { kind: authored }
      - pl: "Oczekiwali odpowiedzi twierdzącej."
        ru: "Они ожидали утвердительного ответа."
        source: { kind: authored }
  - id: theorem
    ru: "twierdzenie — утверждение; теорема"
    examples:
      - pl: "Niezmienny rytm matematyki to definicja, twierdzenie, dowód."
        ru: "Неизменный ритм математики: определение, теорема, доказательство."
        source: { kind: translated, id: 6160498 }
      - pl: "Wykażemy teraz, jak przy pomocy tego lematu udowodnić nasze główne twierdzenie."
        ru: "Теперь покажем, как с помощью этой леммы доказать нашу главную теорему."
        source: { kind: translated, id: 367728 }
      - pl: "Oba twierdzenia są fałszywe."
        ru: "Оба утверждения ложны."
        source: { kind: translated, id: 10707663 }
notes:
  - { kind: usage, text: "Корень тот же, что в twardy «твёрдый»: утверждать — значит «стоять твёрдо». Русское «утверждать» от «твёрдый» собрано ровно так же, и из того же гнезда идёт twierdza «крепость»." }
  - { kind: government, text: "Глагол почти всегда идёт с придаточным: twierdzić, że… Запятая перед że обязательна." }
  - { kind: usage, text: "Существительное twierdzenie значит и «утверждение», и математическую «теорему»: twierdzenie Pitagorasa «теорема Пифагора»." }
  - { kind: usage, text: "Причастие twierdzący значит «утвердительный»: odpowiedź twierdząca, в противоположность przecząca «отрицательный». Совершенный вид — stwierdzić «констатировать»: stwierdzić fakt." }
collocations:
  - { pl: "twierdzić, że…", ru: "утверждать, что…" }
  - { pl: "odpowiedź twierdząca", ru: "утвердительный ответ" }
  - { pl: "twierdzenie Pitagorasa", ru: "теорема Пифагора" }
  - { pl: "stwierdzić fakt", ru: "констатировать факт" }
family:
  - { pl: "twardy", ru: "твёрдый", relation: root }
  - { pl: "twierdza", ru: "крепость", relation: derived }
  - { pl: "stwierdzić", ru: "констатировать", relation: aspect }
  - { pl: "twierdzenie", ru: "утверждение; теорема", relation: derived }
etymology: "От twardy «твёрдый» — утверждать значит «стоять твёрдо». Русское «утверждать» от «твёрдый» собрано ровно так же; из того же гнезда и twierdza «крепость»."
memory: "twierdzić — «утверждать», и корень тот же, что в twardy «твёрдый»: утверждать значит «стоять твёрдо». Русское «утверждать» от «твёрдый» устроено так же, а из того же гнезда идёт twierdza «крепость». Существительное twierdzenie значит и «утверждение», и «теорему»: twierdzenie Pitagorasa."
idioms:
  - { pl: "twierdzić, że…", ru: "утверждать, что…" }
  - { pl: "odpowiedź twierdząca", ru: "утвердительный ответ" }
  - { pl: "twierdzenie Pitagorasa", ru: "теорема Пифагора" }
