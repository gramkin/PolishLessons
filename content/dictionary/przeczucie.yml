  - id: trust-it
    ru: "доверять предчувствию"
    examples:
      - pl: "Powinieneś zaufać swojemu przeczuciu."
        ru: "Тебе стоит довериться своему предчувствию."
        source: { kind: translated, id: 9684287 }
      - pl: "Moje przeczucia są zaskakująco trafne."
        ru: "Мои предчувствия на удивление точны."
        source: { kind: translated, id: 3769033 }
notes:
  - { kind: usage, text: "Конструкция mam przeczucie, że вводит придаточное: Mam przeczucie, że będzie padać «У меня предчувствие, что будет дождь». Это самый частый оборот в корпусе." }
  - { kind: usage, text: "Złe przeczucie — «дурное предчувствие», а dobre przeczucie — «хорошее»." }
  - { kind: usage, text: "Существительное от przeczuć «предчувствовать», того же гнезда, что карточка czuć «чувствовать»." }
collocations:
  - { pl: "mam przeczucie", ru: "у меня предчувствие" }
  - { pl: "złe przeczucie", ru: "дурное предчувствие" }
  - { pl: "zaufać przeczuciu", ru: "довериться предчувствию" }
etymology: "От przeczuć «предчувствовать», prze- + czuć. Русское «предчувствие» собрано ровно так же: «пред-» плюс «чувствовать»."
memory: "przeczucie — «предчувствие». Главный оборот: Mam przeczucie, że będzie padać «У меня предчувствие, что будет дождь». Дурное предчувствие — złe przeczucie."
