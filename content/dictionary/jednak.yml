    pl: "Sprzęt wrócił z gwarancji, jednak usterka nie została naprawiona."
    ru: "Оборудование вернулось с гарантийного ремонта, однако неисправность не была устранена."
    source: { kind: tatoeba, id: 6207860 }
  - form: "jednak"
    pl: "Jednak odmówię."
    ru: "И всё-таки я откажусь."
    source: { kind: translated, id: 6729704 }
