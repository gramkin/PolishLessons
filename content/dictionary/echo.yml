notes:
  - { kind: false-friend, text: "Значение то же, что у русского «эха», а поведение — совсем другое. Русское «эхо» не склоняется вовсе: «в эхо», «об эхо», форма одна на все падежи. Польское ECHO склоняется полностью, восемь форм: ECHA, ECHU, ECHEM, и в родительном множественного ECH, без окончания. Поэтому BEZ ECHA, W ECHU, Z ECHEM — всё это нормальные польские формы, а русскоговорящий склонен оставить слово неизменным. Это общее свойство: польский втягивает в склонение заимствования, которые русский оставляет застывшими, и то же было со словом ZOMBI." }
  - { kind: government, text: "Средний род на -O. Именительный и винительный совпадают: SŁYSZAŁ ECHO. Родительный на -A: BEZ ECHA. Дательный на -U, и местный тоже на -U: W ECHU. Творительный на -EM: ECHEM, и в этой форме слово часто выступает как обстоятельство способа: WRÓCIŁY ECHEM «вернулись эхом». Родительный множественного ECH, без окончания, с конечным CH. Откуда отражается — предлог OD с родительным: ECHO OD SKAŁ. Переносное употребление требует предлога BEZ: PRZEJŚĆ BEZ ECHA «пройти незамеченным»." }
  - { kind: pronunciation, text: "Читается «э́хо», ударение на предпоследнем слоге из двух, то есть на первом, как и в русском. Начальное E звучит как чистое «э». Сочетание CH даёт «х», и это общее польское правило, а не исключение для заимствований. В родительном множественного ECH конечное CH сохраняет «х»: «эх». В творительном ECHEM слышно «э́хэм». Фонетически слово для русского совсем простое, и всё внимание уходит на склонение." }
  - { kind: usage, text: "Частотные сочетания: PRZEJŚĆ BEZ ECHA «пройти незамеченным, не вызвать отклика», ODBIĆ SIĘ ECHEM «отозваться, получить отклик», ECHA PRASOWE «отголоски в прессе». Переносное значение в польском сильнее, чем в русском: ECHA SPRAWY это именно общественный отклик, и в газетном языке оборот встречается постоянно. Прилагательное от слова не употребляется; вместо него берут родительный: EFEKT ECHA. Технический термин для эхолота — ECHOSONDA." }
collocations:
  - { pl: "przejść bez echa", ru: "пройти незамеченным" }
  - { pl: "odbić się echem", ru: "отозваться, получить отклик" }
  - { pl: "echa prasowe", ru: "отголоски в прессе" }
family:
  - { pl: "dźwięk", ru: "звук", relation: root, id: dzwiek }
