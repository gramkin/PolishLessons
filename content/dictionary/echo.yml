  - { pl: "zombi", ru: "зомби", relation: root, id: zombi }
etymology: "Из греческого ĒCHŌ «звук, отголосок», через латинское ECHO. В греческой мифологии так звалась нимфа, обречённая повторять чужие слова, и от её имени слово разошлось по всем европейским языкам в готовом виде. Русское «эхо» пришло тем же путём и в том же значении, но осталось несклоняемым, как и большинство русских заимствований на -О: «метро», «кино», «бюро». Польский поступил наоборот и подчинил слово обычному склонению среднего рода, дав ему восемь форм, включая родительный множественного ECH. Это различие в обращении с заимствованиями между двумя языками устойчиво, и ECHO здесь удобный образец: смысл один, корень один, а грамматика расходится полностью."
memory: "Склоняется, в отличие от русского «эха»: echa, echu, echem, родительный множественного ech. Русскоговорящий по привычке оставляет слово неизменным — это главная ошибка. То же было с zombi: польский втягивает в склонение то, что русский оставляет застывшим. Переносное значение сильнее русского: przejść bez echa «пройти незамеченным», odbić się echem «получить отклик». Из греческого ēchō, по имени нимфы, повторявшей чужие слова."
