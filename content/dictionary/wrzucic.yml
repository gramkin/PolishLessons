# review
id: wrzucic
format: 2
lemma: "wrzucić"
rank: 2006
pos: verb
pron: { cyr: "вжу́циць" }
senses:
  - id: throw-in
    ru: "бросить, кинуть (внутрь чего-л.)"
    examples:
      - pl: "Wrzuć list do skrzynki."
        ru: "Брось письмо в ящик."
        source: { kind: authored }
      - pl: "Wrzucił monetę do automatu."
        ru: "Он бросил монету в автомат."
        source: { kind: authored }
      - pl: "Wrzucone do wody kamienie zniknęły bez śladu."
        ru: "Брошенные в воду камни исчезли бесследно."
        source: { kind: authored }
  - id: slip-on
    ru: "разг. накинуть (одежду); закинуть (еду)"
    examples:
      - pl: "Wrzucił na siebie kurtkę i wybiegł."
        ru: "Он накинул куртку и выбежал."
        source: { kind: authored }
      - pl: "Wrzuciła coś na ząb i pobiegła dalej."
        ru: "Она перекусила на ходу и побежала дальше."
        source: { kind: authored }
  - id: gear
    ru: "wrzucić bieg — включить передачу"
    examples:
      - pl: "Wrzuć wreszcie drugi bieg."
        ru: "Включи наконец вторую передачу."
        source: { kind: authored }
      - pl: "Wrzucił wsteczny i zawrócił."
        ru: "Он включил заднюю и развернулся."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ЧЕСТНО О КОРНЕ: родственника у rzucić в русском НЕТ. «Бросить» идёт от совсем другого корня, и опереться тут не на что — глагол придётся запомнить напрямую. Зато приставка прозрачна: w- это русское «в-», значит wrzucić — «бросить ВНУТРЬ». Из того же гнезда wyrzucić «выбросить», odrzucić «отбросить», porzucić «бросить, покинуть»." }
  - { kind: government, text: "ВАЖНОЕ РАСХОЖДЕНИЕ В ПАДЕЖЕ. Бросают ЧТО — винительный, как по-русски. Но «куда» строится иначе: польский берёт DO с РОДИТЕЛЬНЫМ — wrzucić list DO skrzynki, monetę DO automatu, — тогда как русский говорит «в ящик», «в автомат», то есть «в» с винительным. Предлог do при движении внутрь — общая черта польского, и здесь она особенно заметна." }
  - { kind: usage, text: "Вид совершенный, несовершенная пара — wrzucać. Страдательное причастие по правилу для -ić: wrzucony, wrzuceni, как zatrudniony и zaprowadzony. Разговорных употреблений много: wrzucić coś na siebie «накинуть», wrzucić zdjęcie do sieci «выложить фото в сеть», wrzucić bieg «включить передачу»." }
  - { kind: register, text: "Оборот wrzucić wszystko do jednego worka значит «свалить всё в одну кучу», то есть не различать разного, — и русская идиома тут почти дословная. А wrzuć na luz — разговорное «расслабься», буквально «включи нейтралку»." }
collocations:
  - { pl: "wrzucić list do skrzynki", ru: "бросить письмо в ящик" }
  - { pl: "wrzucić bieg", ru: "включить передачу" }
  - { pl: "wrzucić do jednego worka", ru: "свалить в одну кучу" }
family:
  - { pl: "rzucić", ru: "бросить", relation: root, id: rzucic }
  - { pl: "wrzucać", ru: "бросать внутрь", relation: aspect }
  - { pl: "wyrzucić", ru: "выбросить", relation: derived, id: wyrzucic }
etymology: "Приставка w- «в» плюс rzucić «бросить». Приставка отвечает русской «в-», а вот корень у rzucić свой: он восходит к праславянскому *rjutiti и русскому «бросить» не родня — эти слова лишь совпали по смыслу. Из того же польского гнезда rzut «бросок», wyrzucić «выбросить», porzucić «покинуть»."
memory: "wrzucić — «бросить внутрь»: приставка w- это русское «в-». Но корень родства с «бросить» не имеет, так что слово запоминается напрямую. Падеж обязательно: wrzucić list DO skrzynki — родительный, а не винительный, как в русском «в ящик»."
idioms:
  - { pl: "wrzucić wszystko do jednego worka", ru: "свалить всё в одну кучу" }
  - { pl: "wrzuć na luz", ru: "расслабься" }
