# review
id: klasa
format: 2
lemma: "klasa"
rank: 771
pos: noun
pron: { cyr: "кля́са" }
senses:
  - id: school-class
    ru: "класс (группа учеников)"
    examples:
      - pl: "Nasza klasa składa się z 40 chłopców."
        ru: "Наш класс состоит из 40 мальчиков."
        source: { kind: tatoeba, id: 352112 }
      - pl: "W tej klasie jest 40 uczniów."
        ru: "В этом классе 40 учеников."
        source: { kind: tatoeba, id: 531863 }
      - pl: "Jesteśmy z nią w jednej klasie."
        ru: "Мы с ней в одном классе."
        source: { kind: tatoeba, id: 403561 }
  - id: classroom
    ru: "класс (помещение)"
    examples:
      - pl: "Klasa jest pusta."
        ru: "Класс пуст."
        source: { kind: translated, id: 11335493 }
      - pl: "Posprzątajcie klasę."
        ru: "Уберите класс."
        source: { kind: translated, id: 522833 }
      - pl: "Gdzie jest klasa Toma?"
        ru: "Где класс Тома?"
        source: { kind: translated, id: 556038 }
  - id: social-class
    ru: "klasa średnia — средний класс"
    examples:
      - pl: "Należeli do klasy średniej."
        ru: "Они принадлежали к среднему классу."
        source: { kind: tatoeba, id: 7886529 }
      - pl: "Pogardza ludźmi z niższych klas społecznych."
        ru: "Он презирает людей из низших слоёв."
        source: { kind: translated, id: 956786 }
      - pl: "Klasa robotnicza bardzo się zmieniła."
        ru: "Рабочий класс сильно изменился."
        source: { kind: authored }
  - id: quality
    ru: "класс, уровень качества"
    examples:
      - pl: "Leciała do Bostonu klasą biznes."
        ru: "Она летела в Бостон бизнес-классом."
        source: { kind: translated, id: 7180725 }
      - pl: "To pierwsza klasa!"
        ru: "Это высший класс!"
        source: { kind: authored }
      - pl: "On ma klasę."
        ru: "У него есть класс."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Слово покрывает сразу несколько значений: класс как группа учеников (nasza klasa), класс как помещение (posprzątajcie klasę), общественный класс (klasa średnia «средний класс») и уровень качества (pierwsza klasa, klasa biznes)." }
  - { kind: usage, text: "Разговорное mieć klasę значит «держать марку, иметь класс»: On ma klasę." }
  - { kind: government, text: "w klasie «в классе» — предложный падеж; przed klasą «перед классом» — творительный; kolega z klasy «одноклассник» — родительный." }
  - { kind: usage, text: "Родня вся от латинского classis «разряд»: klasowy «классный, классовый», klasyczny «классический», klasyfikacja «классификация»." }
collocations:
  - { pl: "w klasie", ru: "в классе" }
  - { pl: "kolega z klasy", ru: "одноклассник" }
  - { pl: "klasa średnia", ru: "средний класс" }
  - { pl: "klasa biznes", ru: "бизнес-класс" }
family:
  - { pl: "klasowy", ru: "классный, классовый", relation: derived }
  - { pl: "klasyczny", ru: "классический", relation: derived }
  - { pl: "klasyfikacja", ru: "классификация", relation: derived }
etymology: "Из латинского classis «разряд, отряд» — то же заимствование, что русский «класс»."
memory: "klasa — «класс», но значений у слова больше, чем кажется: и группа учеников (nasza klasa), и само помещение (posprzątajcie klasę), и общественный класс (klasa średnia), и уровень качества (pierwsza klasa, klasa biznes). А разговорное mieć klasę значит «держать марку»."
idioms:
  - { pl: "klasa średnia", ru: "средний класс" }
  - { pl: "pierwsza klasa", ru: "высший класс" }
  - { pl: "mieć klasę", ru: "быть на высоте, держаться достойно" }
formExamplesSkip:
  - { form: "klaso", reason: "звательный падеж у этого существительного не употребляется" }
