# review
id: szukac
format: 2
lemma: "szukać"
rank: 210
pos: verb
aspect: imperf
pron: { cyr: "шу́каць" }
senses:
  - id: look-for
    ru: "искать (кого-либо, что-либо) — с родительным падежом"
    note: "В польском всегда родительный: szukam pracy, szukam kluczy."
    examples:
      - pl: "Szukam ołówka."
        ru: "Я ищу карандаш."
        source: { kind: tatoeba, id: 8457921 }
      - pl: "Szukamy jej."
        ru: "Мы её ищем."
        source: { kind: tatoeba, id: 4719298 }
      - pl: "Szuka go policja."
        ru: "Его ищет полиция."
        source: { kind: tatoeba, id: 6328343 }
  - id: search
    ru: "искать, разыскивать; подыскивать"
    examples:
      - pl: "Co szukasz?"
        ru: "Что ты ищешь?"
        source: { kind: tatoeba, id: 2403037 }
      - pl: "Szukasz nas?"
        ru: "Ты нас ищешь?"
        source: { kind: tatoeba, id: 8766222 }
      - pl: "Szukałem pana."
        ru: "Я вас искал."
        source: { kind: tatoeba, id: 722343 }
notes:
  - { kind: government, text: "szukać требует родительного падежа: szukam pracy «ищу работу», szukam kluczy «ищу ключи». Русский здесь чаще ставит винительный." }
  - { kind: usage, text: "Совершенный вид — poszukać или znaleźć «найти»: Szukałem i znalazłem." }
  - { kind: usage, text: "szukać w internecie — «искать в интернете»; существительное — poszukiwanie «поиск»." }
collocations:
  - { pl: "szukać pracy", ru: "искать работу" }
  - { pl: "szukać kluczy", ru: "искать ключи" }
  - { pl: "kto szuka, ten znajdzie", ru: "кто ищет, тот найдёт" }
  - { pl: "szukać w internecie", ru: "искать в интернете" }
etymology: "Праславянское *šukati или заимствование из средневерхненемецкого suochen «искать»; в русском прямого родственника нет."
memory: "Главное отличие от русского — падеж: szukać требует родительного. Szukam pracy «Ищу работу», szukam kluczy «Ищу ключи»."
idioms:
  - { pl: "kto szuka, ten znajdzie", ru: "кто ищет, тот найдёт" }
  - { pl: "szukać dziury w całym", ru: "придираться к мелочам" }
  - { pl: "szukać igły w stogu siana", ru: "искать иголку в стоге сена" }
