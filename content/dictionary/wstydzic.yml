# review
id: wstydzic
format: 2
lemma: "wstydzić"
rank: 1910
pos: verb
pron: { cyr: "фсты́дзиць" }
senses:
  - id: be-ashamed
    ru: "стыдиться, стесняться (wstydzić się czegoś)"
    examples:
      - pl: "Wstydzę się tego do dziś."
        ru: "Мне стыдно за это до сих пор."
        source: { kind: authored }
      - pl: "Nie wstydź się, mów głośniej."
        ru: "Не стесняйся, говори громче."
        source: { kind: authored }
      - pl: "Wstydziła się własnego akcentu."
        ru: "Она стыдилась своего выговора."
        source: { kind: authored }
  - id: shame
    ru: "стыдить кого-л."
    examples:
      - pl: "Nie wstydź dziecka przy ludziach."
        ru: "Не стыди ребёнка при людях."
        source: { kind: authored }
      - pl: "Wstydzono go publicznie."
        ru: "Его стыдили прилюдно."
        source: { kind: authored }
  - id: shamed
    ru: "wstydzony — пристыженный"
    examples:
      - pl: "Wstydzony przy wszystkich, wyszedł bez słowa."
        ru: "Пристыженный при всех, он вышел без слова."
        source: { kind: authored }
      - pl: "Wstydzeni uczniowie milczeli."
        ru: "Пристыженные ученики молчали."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ПОЛЬСКОЕ СЛОВО ШИРЕ РУССКОГО. Wstydzić się покрывает сразу и «стыдиться», и «СТЕСНЯТЬСЯ». Nie wstydź się значит чаще всего «не стесняйся» — ободрение робкому, а вовсе не упрёк. Русский развёл эти смыслы по двум глаголам, польский держит в одном, и понять, какой из них перед вами, помогает только обстановка." }
  - { kind: government, text: "Стыдятся ЧЕГО — родительный, как и по-русски: wstydzić się swojego akcentu, biedy, błędu. За кого — za с творительным: wstydzić się za brata «стыдиться за брата». Переходное wstydzić kogoś берёт винительный: nie wstydź dziecka." }
  - { kind: usage, text: "Возвратное wstydzić się — обычное, повседневное. Переходное wstydzić kogoś «стыдить» встречается заметно реже и звучит книжно; в живой речи скажут zawstydzać. Отсюда и страдательные формы wstydzony: они существуют, но принадлежат этому более редкому переходному употреблению." }
  - { kind: pronunciation, text: "Начальное w перед глухим s оглушается, поэтому wstydzić читается «фсты́дзиць», а не «всты...». Так же ведут себя wstać «фстаць» и wszystko «фшистко». Повелительное пишется с мягким знаком-чертой: wstydź się." }
collocations:
  - { pl: "wstydź się!", ru: "стыдись!" }
  - { pl: "nie ma się czego wstydzić", ru: "нечего стыдиться" }
  - { pl: "wstydzić się za kogoś", ru: "стыдиться за кого-л." }
family:
  - { pl: "wstyd", ru: "стыд", relation: root, id: wstyd }
  - { pl: "wstydliwy", ru: "стыдливый, застенчивый", relation: derived }
  - { pl: "bezwstydny", ru: "бесстыдный", relation: antonym }
etymology: "От wstyd «стыд» — это ровно русское слово, только с приросшим в начале w. Праславянское *studъ связано с корнем «стужа, студить»: стыд понимался как холод, который обдаёт провинившегося. Русское «стыд» и «студёный» потому и похожи. Отсюда же wstydliwy «стыдливый» и bezwstydny «бесстыдный»."
memory: "wstydzić się — «стыдиться», от wstyd «стыд» (то же слово с приставным w). Падеж родной: wstydzić się czegoś, родительный. Но помните, что польское слово шире: nie wstydź się чаще значит «не стесняйся»."
idioms:
  - { pl: "wstydź się!", ru: "стыдись!" }
  - { pl: "nie ma się czego wstydzić", ru: "нечего стыдиться" }
