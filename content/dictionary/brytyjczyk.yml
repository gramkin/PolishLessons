notes:
  - { kind: false-friend, text: "BRYTYJCZYK — «британец», житель Великобритании вообще. Англичанин — ANGLIK, шотландец — SZKOT, валлиец — WALIJCZYK. Русское «британец» и польское BRYTYJCZYK совпадают по смыслу, но суффикс другой: -CZYK, тот же, что в AUSTRALIJCZYK и KANADYJCZYK." }
  - { kind: usage, text: "Пишется с большой буквы; прилагательное BRYTYJSKI — с маленькой. Женская форма — BRYTYJKA. Во множественном K чередуется с C: BRYTYJCZYCY." }
  - { kind: government, text: "Мужской личный род: винительный равен родительному, ZNAM TEGO BRYTYJCZYKA. «Он британец» — ON JEST BRYTYJCZYKIEM, с творительным." }
  - { kind: pronunciation, text: "Читается «брыты́йчык»: Y — «ы», J — «й», CZ — твёрдое «ч». Ударение на предпоследнем слоге. BRYTYJCZYCY — «брытыйчы́цы»." }
  - { kind: register, text: "Нейтральное слово. В разговоре часто ANGLIK о любом британце, но шотландцы и валлийцы этого не любят." }
collocations:
  - { pl: "być Brytyjczykiem", ru: "быть британцем" }
  - { pl: "typowy Brytyjczyk", ru: "типичный британец" }
  - { pl: "Brytyjczycy i Amerykanie", ru: "британцы и американцы" }
family:
  - { pl: "brytyjski", ru: "британский", relation: derived, id: brytyjski }
  - { pl: "Anglia", ru: "Англия", relation: root, id: anglia }
  - { pl: "Amerykanin", ru: "американец", relation: root, id: amerykanin }
etymology: "От BRYTANIA, латинского BRITANNIA, через прилагательное BRYTYJSKI с суффиксом -CZYK, как в AUSTRALIJCZYK и KANADYJCZYK."
memory: "Brytyjczyk — британец: Brytyjczycy jeżdżą po lewej. Англичанин — Anglik. On jest Brytyjczykiem — творительный."
