# review
id: maly
format: 2
lemma: "mały"
rank: 139
pos: adj
pron: { cyr: "ма́лы" }
senses:
  - id: small
    ru: "маленький, небольшой (по размеру)"
    examples:
      - pl: "To mała stacja."
        ru: "Это маленькая станция."
        source: { kind: tatoeba, id: 13788497 }
      - pl: "Książka jest mała."
        ru: "Книга маленькая."
        source: { kind: tatoeba, id: 625415 }
      - pl: "Holandia to mały kraj."
        ru: "Голландия — маленькая страна."
        source: { kind: tatoeba, id: 355256 }
  - id: young
    ru: "маленький, младший (о человеке)"
    examples:
      - pl: "On jest mały i słaby."
        ru: "Он маленький и слабый."
        source: { kind: tatoeba, id: 675708 }
      - pl: "Które zwierzę jest małe?"
        ru: "Какое животное маленькое?"
        source: { kind: tatoeba, id: 940967 }
      - pl: "Mam małego syna."
        ru: "У меня маленький сын."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Степени сравнения супплетивные: mały — mniejszy — najmniejszy, как в русском «маленький — меньше — самый маленький»." }
  - { kind: usage, text: "mały palec — «мизинец»; małe piwo — «пустяк»; mniejsza o to — «неважно»." }
collocations:
  - { pl: "mały palec", ru: "мизинец" }
  - { pl: "od małego", ru: "с детства" }
  - { pl: "mniejsza o to", ru: "неважно" }
  - { pl: "w małym stopniu", ru: "в малой степени" }
etymology: "Праславянское *malъ — то же слово, что русское «малый»; степени сравнения супплетивные, от другого корня (mniejszy, как русское «меньше»)."
memory: "Цепочка неправильная, как и в русском: mały — mniejszy — najmniejszy. Запомните mniejsza o to «неважно» и małe piwo «пустяк»."
idioms:
  - { pl: "małe piwo", ru: "пустяк, ерунда" }
  - { pl: "mieć w małym palcu", ru: "знать назубок" }
  - { pl: "bez mała", ru: "без малого" }
