etymology: "Через латинское HISTORIA из греческого, где слово значило «расспрашивание, узнавание», а потом рассказ о узнанном. Русская «история» пришла тем же путём, поэтому корень общий и узнаётся сразу. Разошлись языки только в суффиксе: польский взял латинское -ICUS и получил -ICZNY, русский — греческое и получил «-ический». Это соответствие стоит запомнить раз навсегда, оно работает на сотнях слов."
memory: "Исторический, корень тот же, что в «истории». Читается «хисторы́чны», где h даёт «х», а y — «ы». Суффикс -iczny равен русскому «-ический». Главное различение: historyczny это «относящийся к истории», а наш «исторический памятник», старинное здание, по-польски zabytek. Формы historyczni нет: историков называют historycy."
idioms:
  - { pl: "powieść historyczna", ru: "исторический роман" }
formExamplesSkip:
  - { form: "historyczni", reason: "именительный множественного для мужчин-людей; прилагательное относительное и людей не описывает, историков называют historycy" }
