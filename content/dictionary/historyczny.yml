notes:
  - { kind: false-friend, text: "Русское «исторический» шире польского. HISTORYCZNY значит «относящийся к истории»: FAKT HISTORYCZNY, POWIEŚĆ HISTORYCZNA. А вот наш «исторический памятник», то есть старинное здание под охраной, по-польски ZABYTEK или BUDYNEK ZABYTKOWY, и слово HISTORYCZNY здесь не годится. Запомните заодно, что HISTORIA по-польски значит и «история» как наука, и просто «случай, рассказ»." }
  - { kind: usage, text: "В таблице одиннадцать форм, но живых десять. Одиннадцатая — HISTORYCZNI, именительный множественного для мужчин-людей, и её не употребляют: прилагательное относительное, оно описывает факт, событие или книгу, а не человека. Историков называют HISTORYCY, существительным. Примеров к этой форме в карточке поэтому нет. Суффикс -ICZNY отвечает русскому «-ический»." }
  - { kind: government, text: "В историческом центре — W CENTRUM HISTORYCZNYM, местный падеж, и заметьте, что само CENTRUM в единственном числе не склоняется: меняется только прилагательное. Без исторического фона — BEZ TŁA HISTORYCZNEGO, родительный. Прилагательное стоит после существительного: WYDARZENIE HISTORYCZNE, POWIEŚĆ HISTORYCZNA, FAKT HISTORYCZNY." }
  - { kind: pronunciation, text: "Читается «хисторы́чны», четыре слога, ударение на предпоследнем. Буква H даёт «х». Буква Y даёт «ы», поэтому третий слог это «ры», а не «ри». Сочетание CZ даёт «ч». В женском роде HISTORYCZNA это «хисторы́чна», в среднем HISTORYCZNE — «хисторы́чнэ», с «э» на конце." }
  - { kind: register, text: "Слово книжное и газетное. В туризме это CENTRUM HISTORYCZNE «исторический центр», и так написано на каждой табличке в Кракове. В литературе — POWIEŚĆ HISTORYCZNA, жанр в Польше очень почитаемый. В новостях говорят CHWILA HISTORYCZNA и MOMENT HISTORYCZNY о событии, которое запомнят, и употребляют эти слова ровно так же свободно, как и мы." }
collocations:
