etymology: "Два праславянских глагола, которые польский склеил, а русский развёл, — тот же случай, что в семье PAŚĆ, но на другом корне. Первый: *sъlati «слать, посылать», с настоящим на *sъl-, откуда русское «слать — шлю» и польское SŁAĆ — ŚLĘ. Второй: *stьlati «стлать, расстилать», откуда русское «стлать — стелю» и польское SŁAĆ — ŚCIELĘ. В русском инфинитивы остались разными, «слать» и «стлать», и спутать их нельзя. В польском оба дали одно SŁAĆ, потому что начальное сочетание упростилось, и различие ушло целиком в основу настоящего времени: ŚL- против ŚCIEL-. Отсюда и существительные: POSŁANIE значит и «послание», и «постель», смотря от какого глагола считать."
memory: "Два глагола, один инфинитив: pośl-/posł- «послать» (poślę, poślij), pościel- «постелить» (pościelę, pościel). Ударение на приставке, «по́суаць». За чем послали — предлог po: posłać PO lekarza."
idioms:
  - { pl: "posłać po lekarza", ru: "послать за врачом" }
  - { pl: "jak sobie pościelesz, tak się wyśpisz", ru: "как постелешь, так и выспишься" }
formExamplesSkip:
  - { form: "pościeleni", reason: "POŚCIELIĆ управляет винительным падежом того, что стелют — ŁÓŻKO, KANAPĘ, — а человек, которому стелют, стоит в дательном: POŚCIELIĆ KOMUŚ. Поэтому страдательное причастие мужско-личного множественного числа, которое предполагает людей в роли прямого дополнения, у этого глагола грамматически невозможно: нельзя быть «постеленным». Формы POŚCIELONY, POŚCIELONA и POŚCIELONE согласуются с постелью и написаны, а POŚCIELENI живёт только в таблице склонения." }
