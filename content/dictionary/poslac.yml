notes:
  - { kind: usage, text: "Снова два глагола под одним инфинитивом, как в семье PAŚĆ. Основа POŚL-/POSŁ- значит «послать»: POŚLĘ, POŚLESZ, POŚLIJ, POSŁAŁ, POSŁANY. Основа POŚCIEL- значит «постелить»: POŚCIELĘ, POŚCIELESZ, POŚCIEL, POŚCIELONY. Разница видна сразу, как только глагол изменился. У второго глагола в этой таблице нет прошедшего времени и условного наклонения — их берут от соседнего инфинитива POŚCIELIĆ, откуда POŚCIELIŁ, POŚCIELIŁBY. Поэтому форм здесь 53 плюс 25, а не 53 плюс 53." }
  - { kind: pronunciation, text: "Читается «по́суаць», с ударением на приставке: слово двусложное, а польское ударение предпоследнее. Формы с ś мягкие: POŚLĘ — «по́сьлэн», POŚLIJ — «по́сьлий». У глагола постели сочетание ŚCIEL звучит «сьцель»: POŚCIEL — «по́сьцель», POŚCIELĘ — «посьце́лэн», и ударение там уже на втором слоге, потому что слово стало трёхсложным. Деепричастие POSŁAWSZY — «посуа́фшы», где w перед s оглушается." }
  - { kind: government, text: "Глагол посылания переходный и двухместный. Кого послали — винительный: POSŁAĆ DZIECKO. За чем послали — предлог PO с винительным: POSŁAĆ PO LEKARZA, POSŁAĆ PO CHLEB, буквально «послать по врача». Кому послали — дательный без предлога: POSŁAĆ KOMUŚ LIST. Куда — предлоги DO или NA: POSŁAĆ DO SZKOŁY, POSŁAĆ NA STACJĘ. Глагол постели тоже переходный: POŚCIELIĆ ŁÓŻKO, с винительным." }
  - { kind: false-friend, text: "Русское «послать» отвечает первому значению точно, вплоть до управления: «послать за врачом» — POSŁAĆ PO LEKARZA. Но второго значения у русского глагола нет: «послать кровать» сказать нельзя, по-русски это «постелить». Любопытно, что сама пара глаголов в русском тоже есть, только инфинитивы у неё разные: «слать» с настоящим «шлю» и «стлать» с настоящим «стелю». Польский свёл оба инфинитива в один SŁAĆ, оставив основы различными, ŚL- и ŚCIEL-. То есть русский сохранил различие там, где польский его стёр, — ровно наоборот, чем кажется на первый взгляд." }
