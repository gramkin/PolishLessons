# review
id: utrudnic
format: 2
lemma: "utrudnić"
rank: 2593
pos: verb
pron: { cyr: "утру́дниць" }
senses:
  - id: make-difficult
    ru: "затруднить, усложнить"
    examples:
      - pl: "Deszcz utrudni nam przejazd."
        ru: "Дождь затруднит нам проезд."
        source: { kind: authored }
      - pl: "Śnieg utrudnił dojazd do wsi."
        ru: "Снег затруднил проезд в деревню."
        source: { kind: authored }
      - pl: "Dostęp do budynku jest utrudniony."
        ru: "Доступ в здание затруднён."
        source: { kind: authored }
  - id: hinder
    ru: "помешать, создать помехи"
    examples:
      - pl: "Utrudnił nam pracę swoimi pytaniami."
        ru: "Он усложнил нам работу своими вопросами."
        source: { kind: authored }
      - pl: "Utrudniono nam dostęp do dokumentów."
        ru: "Нам затруднили доступ к документам."
        source: { kind: authored }
notes:
  - { kind: government, text: "utrudnić coś komuś: затрудняемое — в ВИНИТЕЛЬНОМ падеже, человек — в ДАТЕЛЬНОМ. Utrudnił nam pracę «он усложнил нам работу», utrudnić komuś życie «усложнить кому-л. жизнь». Русское «затруднить» строится так же." }
  - { kind: government, text: "В винительном падеже при этом глаголе стоит всегда отвлечённое: życie, dostęp, ruch, oddech, procedura — но не человек. Поэтому мужсколичное причастие utrudnieni остаётся без употребления: «затруднённых людей» не бывает, а человек, которому помешали, стоит в дательном и в подлежащее не повышается. Остальные формы причастия обычны: dostęp utrudniony, widoczność utrudniona." }
  - { kind: false-friend, text: "Корень тот же, что в русском «труд»: польское trudny «трудный» и trud «тягота, усилие». Но объём разошёлся — русское «труд» в обычном значении «работа» по-польски praca, а не trud. Польское trud сохранило только смысл «тягота, хлопоты», как в zadać sobie trud «дать себе труд»." }
  - { kind: usage, text: "Совершенный вид; несовершенный — utrudniać. Антоним — ułatwić «облегчить». Отглагольное существительное utrudnienie живёт самостоятельно и значит «помеха»: utrudnienia w ruchu «помехи в движении» — обычная фраза в сводках о дорогах." }
collocations:
  - { pl: "utrudnić komuś życie", ru: "усложнить кому-л. жизнь" }
  - { pl: "utrudnić dostęp", ru: "затруднить доступ" }
  - { pl: "utrudnienia w ruchu", ru: "помехи в движении" }
family:
  - { pl: "utrudniać", ru: "затруднять", relation: aspect }
  - { pl: "trudny", ru: "трудный", relation: root, id: trudny }
  - { pl: "ułatwić", ru: "облегчить", relation: antonym, id: ulatwic }
  - { pl: "utrudnienie", ru: "помеха, затруднение", relation: derived }
etymology: "Приставка u- и прилагательное trudny «трудный», от существительного trud «тягота, усилие». Корень праславянский, и русское «труд», «трудный», «затруднить» — прямые родственники. Польский построил глагол с приставкой u-, русский с за-, но исходная мысль одна: сделать трудным."
memory: "utrudnić coś komuś: вещь в винительном, человек в дательном — utrudnić komuś życie. Корень тот же, что в русском «трудный». Антоним — ułatwić «облегчить», а utrudnienia w ruchu значит «помехи в движении»."
idioms:
  - { pl: "utrudniać komuś życie", ru: "усложнять кому-л. жизнь" }
  - { pl: "utrudnienia w ruchu", ru: "помехи в движении (в дорожных сводках)" }
formExamplesSkip:
  - { form: "utrudnieni", reason: "Страдательное причастие мужского лица от utrudniony. В винительном падеже при utrudnić стоит всегда отвлечённое — życie, dostęp, ruch, oddech, procedura, — а человек, которому затрудняют, стоит в дательном и в подлежащее не повышается. Повышать в мужсколичную форму нечего: «затруднённых людей» не бывает. Остальные формы причастия при этом вполне обычны (dostęp utrudniony, widoczność utrudniona)." }
