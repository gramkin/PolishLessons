etymology: "Из праславянского *tręsti — то же слово, что русское «трясти», и соответствие полное, включая мену гласной. Русский держит «тряс» в мужском роде против «трясла, трясло, трясли», польский держит TRZĄSŁ против TRZĘSŁA, TRZĘSŁO, TRZĘŚLI. Там, где русский пишет я, польский пишет ą в закрытом слоге и ę в открытом, но это одна и та же древняя носовая гласная. Из гнезда вышли TRZĘSIENIE «тряска», TRZĘSAWISKO «трясина» и POTRZĄSNĄĆ «потрясти»."
memory: "«Трясти» и есть trząść, вплоть до мены гласной: trząsł как «тряс», trzęsła как «трясла». Повелительное законно в двух видах, trząś и trzęś. А «землетрясение» — это два слова: trzęsienie ziemi."
idioms:
  - { pl: "trzęsienie ziemi", ru: "землетрясение" }
  - { pl: "trząść portkami", ru: "трусить, дрожать от страха" }
