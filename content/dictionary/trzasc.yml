notes:
  - { kind: usage, text: "Шестьдесят шесть форм — на три больше, чем положено несовершенному переходному глаголу, и причина в повелительном наклонении: у него здесь двойной набор. Законны обе формы, TRZĄŚ и TRZĘŚ, а за ними TRZĄŚCIE с TRZĘŚCIE и TRZĄŚMY с TRZĘŚMY. Шестьдесят три плюс три и дают шестьдесят шесть. Доплеты такого рода в польском редки, но настоящие: словарь уже встречал их у BAGAŻY при BAGAŻÓW и у BANI при BAŃ." }
  - { kind: pronunciation, text: "Основа меняет гласную по положению, и это та самая мена, что в UJĄŁ при UJĘŁA и WCIĄGNĄŁ при WCIĄGNĘŁA. Перед согласным в закрытом слоге стоит ą: TRZĄSŁ, TRZĄŚĆ. В открытом слоге и перед гласной — ę: TRZĘSĘ, TRZĘSIE, TRZĘSŁA, TRZĘSŁO, TRZĘŚLI. Обратите внимание на прошедшее время: мужской род единственного даёт TRZĄSŁ с ą, а все остальные формы — TRZĘSŁA, TRZĘSŁO, TRZĘSŁY, TRZĘŚLI — берут ę, потому что слог открывается." }
  - { kind: pronunciation, text: "Вторая мена — согласная. Основа держит s перед гласной заднего ряда и ą: TRZĘSĘ, TRZĘSĄ, TRZĄSŁ. Перед i она смягчается в si: TRZĘSIE, TRZĘSIESZ, TRZĘSIEMY. А на конце слова и перед согласным становится ś: TRZĄŚ, TRZĘŚ, TRZĘŚLI, TRZĄŚĆ. Та же картина, что у NIEŚĆ при NIESIE и NIEŚ. Страдательное причастие даёт TRZĘSIONY с o, но мужская личная форма множественного — TRZĘSIENI с e: мена из карточки KARMIĆ, касающаяся всех причастий на -ony." }
  - { kind: usage, text: "Отглагольное существительное застыло в составе одного оборота, который знать обязательно: TRZĘSIENIE ZIEMI значит «землетрясение». По-польски это два слова, по-русски одно, и русскому легко забыть второе: TRZĘSIENIE само по себе — просто «тряска». Разговорное TRZĄŚĆ PORTKAMI буквально «трясти штанами», а значит «трусить, бояться». И возвратное TRZĄŚĆ SIĘ — «трястись»: TRZĄŚĆ SIĘ ZE STRACHU, TRZĄŚĆ SIĘ Z ZIMNA." }
  - { kind: government, text: "Два управления и разный смысл. С винительным — трясти предмет целиком: TRZĄSŁ STÓŁ «он тряс стол». С творительным — трясти частью, размахивать: TRZĄSŁ GŁOWĄ «он тряс головой», TRZĄSŁ GAŁĘZIAMI «он тряс ветвями». Русский различает так же: «трясти стол» и «трясти головой», так что переносить можно прямо. Возвратное TRZĄŚĆ SIĘ берёт предлог Z с родительным для причины: ZE STRACHU, Z ZIMNA, Z WŚCIEKŁOŚCI." }
collocations:
  - { pl: "trząść głową", ru: "трясти головой" }
  - { pl: "trząść się ze strachu", ru: "трястись от страха" }
