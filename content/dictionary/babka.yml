notes:
  - { kind: false-friend, text: "BABKA — не ласковая «бабушка». Ласково — BABCIA: KOCHAM BABCIĘ. BABKA о бабушке звучит книжно или официально, в родословных и рассказах о предках. Пасхальный кулич — BABKA WIELKANOCNA." }
  - { kind: register, text: "В разговоре BABKA — «тётка, девушка», часто с одобрением: FAJNA BABKA, «классная женщина». Пренебрежительно — BABA. Обратиться так к незнакомой женщине грубо." }
  - { kind: usage, text: "Женский род. Множественное — BABKI, родительный — BABEK с беглым E. В дательном и местном K переходит в C: BABCE. Звательный BABKO почти не используется." }
  - { kind: government, text: "По бабушке — PO BABCE: PO с местным, «в наследство от». Испечь бабу — UPIEC BABKĘ, винительный. Бабушка по отцу — BABKA ZE STRONY OJCA." }
collocations:
  - { pl: "babka wielkanocna", ru: "пасхальная баба, кулич" }
  - { pl: "babka ze strony matki", ru: "бабушка по матери" }
  - { pl: "fajna babka", ru: "классная женщина" }
family:
  - { pl: "babcia", ru: "бабушка (ласк.)", relation: root, id: babcia }
  - { pl: "baba", ru: "баба, тётка", relation: root, id: baba }
  - { pl: "prababka", ru: "прабабушка", relation: derived }
etymology: "От BABA «старая женщина, бабушка» с уменьшительным -KA. Русское «бабка», «бабушка» того же корня; польская выпечка BABKA названа по высокой форме, похожей на юбку."
memory: "Babka — бабушка (в родословной), баба-кулич и «тётка» в разговоре. Ласково — babcia. Babka wielkanocna — пасхальная баба. Читается «ба́пка»."
idioms:
  - { pl: "babka na dwoje wróżyła", ru: "бабушка надвое сказала" }
formExamplesSkip:
  - { form: "babko", reason: "звательный почти не употребляется; к бабушке обращаются BABCIU" }
