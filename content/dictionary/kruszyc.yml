# review
id: kruszyc
format: 2
lemma: "kruszyć"
rank: 6046
pos: verb
aspect: imperf
pron: { cyr: "кру́шыць" }
senses:
  - id: crumble
    ru: "крошить, дробить, измельчать"
    examples:
      - pl: "Babcia kruszy chleb dla ptaków."
        ru: "Бабушка крошит хлеб для птиц."
        source: { kind: authored }
      - pl: "Maszyna kruszy skały na żwir."
        ru: "Машина дробит камни в щебень."
        source: { kind: authored }
      - pl: "Kruszyła ciastko w palcach ze zdenerwowania."
        ru: "От волнения она крошила печенье в пальцах."
        source: { kind: authored }
  - id: crumble-itself
    ru: "kruszyć się — крошиться, рассыпаться, осыпаться"
    examples:
      - pl: "Moje zęby się kruszą."
        ru: "У меня крошатся зубы."
        source: { kind: translated, id: 3743857 }
      - pl: "Zobaczcie, pod naciskiem buta już się kruszy."
        ru: "Смотрите, под нажимом ботинка уже крошится."
        source: { kind: authored }
  - id: break-down
    ru: "перен. сокрушать, ломать (сопротивление, лёд в отношениях)"
    examples:
      - pl: "Jego uśmiech kruszył lody w każdym towarzystwie."
        ru: "Его улыбка растапливала лёд в любой компании."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "KRUSZYĆ звучит как «крушить», но значит прежде всего «крошить»: kruszyć chleb — «крошить хлеб», а не «крушить». Значение «сокрушать» есть, но переносное и книжное. Русское «крушить» (ломать в щепки) — DEMOLOWAĆ, ROZWALAĆ." }
  - { kind: usage, text: "Несовершенный вид; совершенные — SKRUSZYĆ, POKRUSZYĆ, ROZKRUSZYĆ. Очень частое KRUSZYĆ SIĘ, «крошиться»: tynk się kruszy, «штукатурка осыпается», chleb się kruszy. Идиома KRUSZYĆ KOPIE O COŚ — «ломать копья из-за чего-то»." }
  - { kind: pronunciation, text: "«кру́шыць»: SZ — твёрдое «ш», Y — «ы», конечное Ć — «ць». Ударение на первом слоге: KRU-szyć." }
  - { kind: register, text: "Нейтральное, бытовое и техническое (kruszarka, «дробилка»). Переносное «kruszyć opór», «сокрушать сопротивление» — книжное." }
collocations:
  - { pl: "kruszyć chleb", ru: "крошить хлеб" }
  - { pl: "kruszyć się", ru: "крошиться, осыпаться" }
  - { pl: "kruszyć kopie", ru: "ломать копья" }
  - { pl: "kruszyć lody", ru: "растапливать лёд (в отношениях)" }
family:
  - { pl: "kruchy", ru: "хрупкий, рассыпчатый", relation: root }
  - { pl: "okruch", ru: "крошка", relation: root }
  - { pl: "pokruszyć", ru: "раскрошить", relation: aspect }
etymology: "Праславянское *krušiti, от *kruxъ, «кусок, обломок», того же корня, что русское «крошить», «крушить», «крошка» и польское OKRUCH, «крошка», KRUCHY, «хрупкий». В польском главным осталось «мелкое» значение — крошить, а в русском разошлись «крошить» и «крушить»."
memory: "Kruszyć — КРОШИТЬ, а не крушить: kruszę chleb. Kruszy się — крошится, осыпается. Kruchy — хрупкий, okruch — крошка. Kruszyć kopie — ломать копья."
idioms:
  - { pl: "kruszyć kopie o coś", ru: "ломать копья из-за чего-то" }
formExamplesSkip:
  - { form: "kruszeni", reason: "мужско-личная форма страдательного причастия: крошат и дробят вещи, а не людей" }
