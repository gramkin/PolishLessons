# review
id: wysluchac
format: 2
lemma: "wysłuchać"
rank: 2431
pos: verb
aspect: perf
pron: { cyr: "высу́хаць" }
senses:
  - id: hear-out
    ru: "выслушать"
    examples:
      - pl: "Tomek wysłuchał uważnie kazania księdza."
        ru: "Том внимательно слушал проповедь священника."
        source: { kind: tatoeba, id: 10076394 }
      - pl: "Wysłuchała tego chłopaka."
        ru: "Она выслушала этого парня."
        source: { kind: tatoeba, id: 416753 }
      - pl: "Proszę, wysłuchaj mnie."
        ru: "Пожалуйста, выслушай меня."
        source: { kind: translated, id: 676732 }
  - id: answer-prayer
    ru: "услышать, внять (о молитве, просьбе)"
    examples:
      - pl: "Moje modlitwy zostały wysłuchane."
        ru: "Мои молитвы были услышаны."
        source: { kind: translated, id: 4090902 }
      - pl: "Wysłuchasz mojej prośby?"
        ru: "Ты внемлешь моей просьбе?"
        source: { kind: translated, id: 6312622 }
notes:
  - { kind: government, text: "Винительный падеж для лица — wysłuchać kogoś «выслушать кого-л.», но РОДИТЕЛЬНЫЙ для того, что слушают: wysłuchać opinii, wysłuchać wykładu. Различие тонкое и важное." }
  - { kind: false-friend, text: "wy- + słuchać «слушать», которое уже есть в словаре. Русское «выслушать» собрано ровно так же." }
  - { kind: usage, text: "В религиозном смысле — «внять»: modlitwy zostały wysłuchane «молитвы были услышаны»." }
  - { kind: usage, text: "Юридическая формула Niech będzie wysłuchana i druga strona — это латинское audiatur et altera pars «да будет выслушана и другая сторона»." }
collocations:
  - { pl: "wysłuchać kogoś", ru: "выслушать кого-л." }
  - { pl: "wysłuchać opinii", ru: "выслушать мнение" }
etymology: "wy- + słuchać «слушать»; русское «выслушать» собрано так же."
memory: "wysłuchać — «выслушать». Падежи расходятся: лицо в ВИНИТЕЛЬНОМ (wysłuchać kogoś), а то, что слушают, в РОДИТЕЛЬНОМ (wysłuchać opinii)."
idioms:
  - { pl: "wysłuchać kogoś", ru: "выслушать кого-л." }
  - { pl: "wysłuchać opinii", ru: "выслушать мнение" }
