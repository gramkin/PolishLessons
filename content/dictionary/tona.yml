notes:
  - { kind: false-friend, text: "TONA — «тонна», с одним N. Не путайте с TON — «тон, тональность»: MÓWIĆ PODNIESIONYM TONEM, «говорить на повышенных тонах». Родительный множественного от TONA тоже звучит TON: DZIESIĘĆ TON, «десять тонн»." }
  - { kind: usage, text: "Девять форм, женский род. После 2, 3, 4 — TONY: DWIE TONY. После 5 и больше — TON: PIĘĆ TON. В разговоре TONY — «уйма»: TONY PAPIERÓW." }
  - { kind: government, text: "Тонна чего — родительный: TONA STALI. За тонну — ZA TONĘ, винительный. Весить тонну — WAŻYĆ TONĘ, тоже винительный." }
  - { kind: pronunciation, text: "Читается «то́на», ударение на первом слоге. Одно N, в отличие от русского «тонна»." }
collocations:
