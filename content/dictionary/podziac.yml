notes:
  - { kind: usage, text: "Это слово живёт почти только в вопросах и почти только с SIĘ. GDZIE SIĘ PODZIAŁY MOJE OKULARY? — «куда подевались мои очки?», и русский строит фразу теми же частями. Невозвратное PODZIAĆ COŚ встречается реже и звучит чуть старомодно: NIE WIEM, GDZIE PODZIAŁEM KLUCZE. А несовершенная пара PODZIEWAĆ SIĘ употребляется о людях: GDZIE SIĘ PODZIEWAŁEŚ? — «где ты пропадал?»." }
  - { kind: false-friend, text: "Корень тот же, что в русских «деть», «девать», «одежда», и праславянское *děti значило «кладть, помещать». Польский сохранил его в DZIAĆ SIĘ «происходить» — CO SIĘ DZIEJE? значит «что происходит?», и это одна из самых частых фраз в языке. То есть у одного корня два совершенно разных современных смысла: PODZIAĆ SIĘ «подеваться» и DZIAĆ SIĘ «происходить». Русскому помогает только первый, второй приходится брать отдельно." }
  - { kind: government, text: "Что — винительный: PODZIAĆ KLUCZE, OKULARY. Где — наречие GDZIEŚ или вопрос GDZIE: GDZIE SIĘ PODZIAŁ? Возвратное PODZIAĆ SIĘ идёт без дополнения вовсе, подлежащее — то, что пропало. Отрицание при невозвратном берёт родительный, как всегда: NIE PODZIAŁEM ŻADNYCH KLUCZY. Обратите внимание, что в прошедшем времени основа -DZIA-, а в будущем -DZIEJ-: PODZIEJĘ, PODZIEJESZ." }
  - { kind: pronunciation, text: "Основа меняется между временами: инфинитив PODZIAĆ и прошедшее PODZIAŁ с -DZIA-, но будущее PODZIEJĘ, PODZIEJESZ, PODZIEJE с -DZIEJ-. Сочетание DZI читается мягко, «дзь», так что PODZIAĆ звучит «по́дзяць», а PODZIEJĘ — «подзе́е». Ударение на предпоследнем слоге везде, кроме условных форм на -byśmy и -byście." }
collocations:
  - { pl: "gdzie się podziały", ru: "куда подевались" }
  - { pl: "gdzie się podziewałeś", ru: "где ты пропадал" }
  - { pl: "co się dzieje", ru: "что происходит" }
family:
  - { pl: "podziewać", ru: "девать, пропадать", relation: aspect }
  - { pl: "dziać się", ru: "происходить", relation: root, id: dziac }
  - { pl: "odzież", ru: "одежда", relation: derived }
etymology: "Приставка po- и DZIAĆ, из праславянского *děti «кладть, помещать» — того же корня, что русские «деть», «девать», «одежда», «надежда». Исходное значение видно лучше всего в «одежда»: то, что надето, положено на себя. Польский развил корень в двух направлениях: PODZIAĆ SIĘ «подеваться, пропасть» — где потерянная вещь как бы сама себя куда-то положила, — и DZIAĆ SIĘ «происходить», от той же мысли о том, что нечто «кладётся» в мир. Отсюда ODZIEŻ «одежда» и DZIEJE «история, деяния»."
memory: "Корень тот же, что «деть» и «одежда». Самая нужная фраза — gdzie się podziały? «куда подевались?». И от того же корня co się dzieje? «что происходит?»."
idioms:
  - { pl: "gdzie się podziały", ru: "куда подевались" }
  - { pl: "co się dzieje", ru: "что происходит" }
