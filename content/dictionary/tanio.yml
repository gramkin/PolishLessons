# review
id: tanio
format: 2
lemma: "tanio"
rank: 2587
pos: adv
pron: { cyr: "та́ньо" }
senses:
  - id: cheaply
    ru: "дёшево, недорого"
    examples:
      - pl: "Kupiłem tę książkę taniej."
        ru: "Я купил эту книгу дешевле."
        source: { kind: translated, id: 951178 }
      - pl: "Taniej się nie da."
        ru: "Дешевле нельзя."
        source: { kind: translated, id: 8665151 }
      - pl: "Kupili dom tanio, bo wymagał remontu."
        ru: "Дом они купили дёшево, потому что он требовал ремонта."
        source: { kind: authored }
      - pl: "Tu można zjeść tanio i dobrze."
        ru: "Здесь можно поесть дёшево и вкусно."
        source: { kind: authored }
      - pl: "Bilety poszły tanio."
        ru: "Билеты ушли дёшево."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Наречие от tani «дешёвый». Степени taniej и najtaniej в живой речи встречаются чаще самой формы tanio." }
  - { kind: usage, text: "Переносно — «легко, без потерь»: tanio się wykupił «он легко отделался»." }
  - { kind: government, text: "Неизменяемое наречие; при глаголах покупки и продажи — kupić tanio, sprzedać tanio." }
  - { kind: false-friend, text: "Прилагательное tani значит «недорогой»; в смысле «пошлый, низкопробный» чаще говорят tandetny." }
collocations:
  - { pl: "kupić tanio", ru: "купить дёшево" }
  - { pl: "taniej nie będzie", ru: "дешевле не будет" }
  - { pl: "najtaniej w mieście", ru: "дешевле всего в городе" }
family:
  - { pl: "tani", ru: "дешёвый", relation: root }
  - { pl: "potanieć", ru: "подешеветь", relation: derived }
etymology: "От прилагательного tani «дешёвый», праславянского по происхождению. Прямого русского соответствия у этого корня нет, поэтому слово приходится запоминать отдельно — зато степени taniej и najtaniej образуются совершенно правильно."
memory: "tanio — «дёшево», и чаще всего попадается в степенях: taniej «дешевле», najtaniej «дешевле всего». Готовая реплика продавца: taniej się nie da."
idioms:
  - { pl: "taniej się nie da", ru: "дешевле нельзя" }
  - { pl: "tanio się wykupić", ru: "легко отделаться" }
