etymology: "От DUCH «дух», от праславянского корня, давшего русские «дух», «душа», «дышать», «воздух». Связь дыхания и духа в славянских языках прямая и древняя, и в польском она видна так же ясно: DUCH, DUSZA, ODDYCHAĆ «дышать». Разделение на DUCHOWY и DUCHOWNY сложилось в средневековье, когда понадобилось отличать внутреннюю жизнь человека от сословия церковнослужителей. Русский такого разделения не завёл и обходится одним прилагательным."
memory: "Одна буква решает всё: duchowy это «духовный» о внутренней жизни, duchowny это «духовный» о церкви, а как существительное просто «священник». Русский на оба случая держит одно слово, поэтому ошибиться легко. Мужско-личная форма duchowi живая, duchowi przywódcy, но совпадает с дательным падежом слова duch «духу». Корень общий с русским «духом», «душой» и «дышать». Читается «духо́вы», ch даёт «х»."
idioms:
