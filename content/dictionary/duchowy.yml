notes:
  - { kind: false-friend, text: "Две формы отличаются одной буквой, а значат разное. DUCHOWY это «духовный» о внутренней жизни, о духе: ŻYCIE DUCHOWE, ROZWÓJ DUCHOWY. DUCHOWNY это «духовный» в церковном смысле, то есть относящийся к духовенству, а как существительное — священник: OSOBA DUCHOWNA «духовное лицо», DUCHOWNY WSZEDŁ DO ZAKRYSTII «священник вошёл в ризницу». Русский обходится одним словом на оба случая, поэтому промахнуться почти неизбежно." }
  - { kind: usage, text: "Одиннадцать форм. Мужско-личная форма множественного числа DUCHOWI, с переходом W в WI, и она вполне живая: DUCHOWI PRZYWÓDCY «духовные лидеры», DUCHOWI OJCOWIE «духовные отцы». Здесь подстерегает вторая ловушка: DUCHOWI это ещё и дательный падеж существительного DUCH «духу». Различает только согласование. Степеней сравнения у прилагательного практически нет, оно относительное." }
  - { kind: government, text: "В сфере, в области — предлог W с местным падежом: W SFERZE DUCHOWEJ, W ŻYCIU DUCHOWYM. Прилагательное в устойчивых сочетаниях обычно идёт после существительного: OJCIEC DUCHOWY, PRZEWODNIK DUCHOWY, ROZWÓJ DUCHOWY. О потребностях — предлог O с местным падежом: MÓWIĆ O POTRZEBACH DUCHOWYCH, и русский строит оборот так же." }
  - { kind: pronunciation, text: "Читается «духо́вы», три слога, ударение на втором. Сочетание CH даёт «х», ровно как в русском «духе», и никакого придыхания тут не нужно. Конечное Y даёт «ы», поэтому слово кончается на «вы», а не «вый». В женской форме DUCHOWA слышно «духо́ва», в мужско-личной DUCHOWI — «духо́ви», где WI даёт мягкое «ви»." }
  - { kind: register, text: "Слово книжное, частое в религиозном, педагогическом и психологическом языке: ŻYCIE DUCHOWE «духовная жизнь», ROZWÓJ DUCHOWY «духовное развитие», OJCIEC DUCHOWY «духовный отец», ĆWICZENIA DUCHOWE «духовные упражнения», то есть реколлекции. В светском разговоре о внутренней жизни чаще скажут PSYCHICZNY или WEWNĘTRZNY, а DUCHOWY оставят для разговора о вере и о смысле." }
collocations:
