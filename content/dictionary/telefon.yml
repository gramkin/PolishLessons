# review
id: telefon
format: 2
lemma: "telefon"
rank: 288
pos: noun
pron: { cyr: "теле́фон" }
senses:
  - id: device
    ru: "телефон (аппарат)"
    examples:
      - pl: "Czyj to telefon?"
        ru: "Чей это телефон?"
        source: { kind: tatoeba, id: 3460668 }
      - pl: "Telefon jest na stole."
        ru: "Телефон на столе."
        source: { kind: tatoeba, id: 3655839 }
      - pl: "Muszę naładować telefon."
        ru: "Мне нужно зарядить телефон."
        source: { kind: tatoeba, id: 3605023 }
  - id: call
    ru: "телефон (звонок, разговор)"
    note: "Był do ciebie telefon значит «Тебе звонили»."
    examples:
      - pl: "Rozmawiają przez telefon."
        ru: "Они говорят по телефону."
        source: { kind: tatoeba, id: 6017175 }
      - pl: "Telefon znowu zadzwonił."
        ru: "Телефон снова зазвонил."
        source: { kind: tatoeba, id: 4148617 }
      - pl: "Zapisałeś numer telefonu?"
        ru: "Ты записал номер телефона?"
        source: { kind: tatoeba, id: 372408 }
notes:
  - { kind: usage, text: "telefon значит и «аппарат», и «звонок»: Był do ciebie telefon «Тебе звонили», Mam telefon od mamy «Мне звонит мама»." }
  - { kind: usage, text: "Говорят przez telefon — «по телефону»: Rozmawiamy przez telefon." }
  - { kind: usage, text: "numer telefonu — «номер телефона»; telefon komórkowy, сокращённо komórka — «мобильный»." }
collocations:
  - { pl: "przez telefon", ru: "по телефону" }
  - { pl: "numer telefonu", ru: "номер телефона" }
  - { pl: "telefon komórkowy", ru: "мобильный телефон" }
  - { pl: "odebrać telefon", ru: "взять трубку" }
etymology: "Через французское téléphone из греческого τῆλε «далеко» и φωνή «звук» — «звук издалека»."
memory: "telefon — и «аппарат», и «звонок»: Był do ciebie telefon значит «Тебе звонили». А говорят przez telefon — «по телефону»."
idioms:
  - { pl: "wisieć na telefonie", ru: "висеть на телефоне" }
  - { pl: "numer telefonu", ru: "номер телефона" }
  - { pl: "odebrać telefon", ru: "взять трубку" }
formExamplesSkip:
  - { form: "telefonie", cell: "Звательный", reason: "звательный падеж: для неодушевлённого существительного он практически не употребляется" }
  - { form: "telefony", cell: "Звательный", reason: "звательный падеж: для неодушевлённого существительного он практически не употребляется" }
