notes:
  - { kind: false-friend, text: "Самая опасная карточка из этого гнезда. POPEŁNIAĆ выглядит как русское «пополнять», но значит «совершать» — и только о плохом. Русское «пополнять» по-польски UZUPEŁNIAĆ: uzupełniać zapasy, uzupełniać wiedzę. Так что POPEŁNIŁ BŁĄD — это «совершил ошибку», а никак не «пополнил» что-то. Корень у двух слов действительно один, PEŁNY «полный», но приставки развели их в разные стороны: po- дало «довести до конца, исполнить», uzu- дало «добавить до полноты»." }
  - { kind: usage, text: "Второе ограничение, которого в русском нет: POPEŁNIAĆ берёт только дурные дополнения. Говорят POPEŁNIĆ BŁĄD, POMYŁKĘ, PRZESTĘPSTWO, ZBRODNIĘ, GRZECH, GAFĘ, SAMOBÓJSTWO — ошибку, промах, преступление, злодеяние, грех, бестактность, самоубийство. А вот русское «совершать» нейтрально и берёт любое дополнение: «совершить подвиг», «совершить покупку», «совершить открытие». По-польски так нельзя: подвиг DOKONUJE SIĘ, покупку ROBI SIĘ, открытие DOKONUJE SIĘ. Если дополнение хорошее, глагол нужен другой." }
  - { kind: usage, text: "Основа одна на все шестьдесят три формы: POPEŁNIAM, POPEŁNIA, POPEŁNIAJĄ, POPEŁNIAŁ, POPEŁNIANY, POPEŁNIAJĄCY. Ещё одно подтверждение, что глаголы на -AĆ основы не двоят, в отличие от глаголов с основой на ś, ź, ść, źdź, как ZŁOŚCIĆ со своим ZŁOSZCZĘ. Повелительное POPEŁNIAJ получается из третьего лица POPEŁNIA прибавлением -j — двадцать восьмое подтверждение правила из карточки KARMIĆ. Совершенная пара POPEŁNIĆ, и она встречается чаще несовершенной, потому что ошибку обычно совершают один раз." }
  - { kind: government, text: "Управление как в русском: POPEŁNIAĆ COŚ в винительном — popełniać błędy, popełniać przestępstwa. В страдательном обороте дополнение становится подлежащим: BŁĄD ZOSTAŁ POPEŁNIONY «ошибка была совершена», и обратите внимание на причастие POPEŁNIONY от совершенного вида при POPEŁNIANY от несовершенного. Безличное POPEŁNIANO BŁĘDY значит «ошибки допускали» без указания, кто именно, и в этом польский точнее русского." }
collocations:
  - { pl: "popełniać błąd", ru: "совершать ошибку" }
  - { pl: "popełniać przestępstwo", ru: "совершать преступление" }
  - { pl: "popełniać gafę", ru: "допускать бестактность" }
family:
