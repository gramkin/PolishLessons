etymology: "Приставка po- и PEŁNIĆ «исполнять», от PEŁNY «полный», из праславянского *plnъ — то же, что русское «полный». Исходно «довести до полноты, исполнить», откуда и нынешнее «совершить». Русское «пополнять» выросло из того же корня с той же приставкой, но пошло за буквальной полнотой, а польское слово ушло в сторону поступка, да ещё и сузилось до поступка дурного. Родственники в русском: «полный», «исполнять», «восполнять», «пополнять»."
memory: "«Пополнять» — ловушка: popełniać значит «совершать», и только плохое: błąd, przestępstwo, gafę. Русское «пополнять» — это uzupełniać."
idioms:
  - { pl: "popełnić gafę", ru: "допустить бестактность, сесть в лужу" }
  - { pl: "popełnić samobójstwo", ru: "совершить самоубийство" }
formExamplesSkip:
  - { form: "popełniani", reason: "Страдательное причастие мужского лично-множественного числа требует, чтобы дополнением были люди, а POPEŁNIAĆ берёт только названия дурных поступков — błąd, grzech, przestępstwo, gafę. Людей не совершают, поэтому форма есть в таблице, но употребить её не в чем. PoliMorf строит её механически от основы." }
