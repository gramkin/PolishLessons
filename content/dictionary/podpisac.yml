# review
id: podpisac
format: 2
lemma: "podpisać"
rank: 897
pos: verb
aspect: perf
pron: { cyr: "потпи́саць" }
senses:
  - id: sign
    ru: "подписать (документ, договор)"
    examples:
      - pl: "Chcę podpisać umowy."
        ru: "Я хочу подписать договоры."
        source: { kind: translated, id: 3977818 }
      - pl: "Prezydent podpisał ustawę."
        ru: "Президент подписал закон."
        source: { kind: translated, id: 7051866 }
      - pl: "Tom podpisał rachunek."
        ru: "Том подписал счёт."
        source: { kind: translated, id: 8798755 }
  - id: sign-oneself
    ru: "podpisać się — расписаться"
    examples:
      - pl: "Czy może pan tu podpisać?"
        ru: "Не могли бы вы расписаться здесь?"
        source: { kind: translated, id: 589871 }
      - pl: "Nie potrafi się nawet podpisać."
        ru: "Он даже расписаться не может."
        source: { kind: translated, id: 351492 }
      - pl: "Każdy się podpisał."
        ru: "Каждый расписался."
        source: { kind: translated, id: 10596054 }
  - id: signed
    ru: "podpisany — подписанный"
    examples:
      - pl: "List nie był podpisany."
        ru: "Письмо не было подписано."
        source: { kind: translated, id: 8522942 }
      - pl: "Traktat został podpisany."
        ru: "Договор был подписан."
        source: { kind: translated, id: 6441422 }
      - pl: "Proszę upewnić się, że podpisano i zapieczętowano dokument."
        ru: "Пожалуйста, убедитесь, что документ подписан и скреплён печатью."
        source: { kind: translated, id: 1110143 }
notes:
  - { kind: usage, text: "Разбирается прозрачно: pod- + pisać «писать». Русское «подписать» собрано точно так же, морфема в морфему." }
  - { kind: government, text: "podpisać się POD czymś — «подписаться под чем-то», предлог pod с творительным: podpisać się pod protestem «подписаться под протестом»." }
  - { kind: usage, text: "Возвратное podpisać się значит «расписаться, поставить подпись»: Nie potrafi się nawet podpisać «Он даже расписаться не умеет»." }
  - { kind: usage, text: "Несовершенный вид — podpisywać. Существительное podpis значит «подпись», а podpisanie — «подписание»." }
collocations:
  - { pl: "podpisać umowę", ru: "подписать договор" }
  - { pl: "podpisać się", ru: "расписаться" }
  - { pl: "proszę tu podpisać", ru: "распишитесь здесь" }
  - { pl: "podpisać kontrakt", ru: "подписать контракт" }
family:
  - { pl: "pisać", ru: "писать", relation: root, id: pisac }
  - { pl: "podpis", ru: "подпись", relation: derived }
  - { pl: "podpisywać", ru: "подписывать", relation: aspect }
etymology: "Приставка pod- + pisać «писать». Русское «подписать» собрано точно так же, морфема в морфему, поэтому слово запоминается сразу."
memory: "podpisać — «подписать»: podpisać umowę. Возвратное podpisać się значит «расписаться»: Proszę tu podpisać. А подписаться ПОД чем-то — podpisać się POD czymś, с предлогом pod и творительным."
idioms:
  - { pl: "podpisać umowę", ru: "подписать договор" }
  - { pl: "proszę tu podpisać", ru: "распишитесь здесь" }
  - { pl: "podpisać się obiema rękami", ru: "подписаться обеими руками" }
