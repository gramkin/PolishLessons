# review
id: duch
format: 2
lemma: "duch"
rank: 608
pos: noun
pron: { cyr: "дух" }
senses:
  - id: ghost
    ru: "дух, призрак, привидение"
    examples:
      - pl: "Jesteś blady jak duch."
        ru: "Ты бледный как привидение."
        source: { kind: tatoeba, id: 3604786 }
      - pl: "Mówi się, że w tym domu mieszka zły duch."
        ru: "Говорят, в этом доме живёт злой дух."
        source: { kind: tatoeba, id: 12569836 }
      - pl: "Czy kiedykolwiek widziałeś ducha?"
        ru: "Ты когда-нибудь видел привидение?"
        source: { kind: tatoeba, id: 5550604 }
  - id: spirit
    ru: "дух, душа; настрой"
    examples:
      - pl: "W Imię Ojca i Syna, i Ducha Świętego."
        ru: "Во имя Отца и Сына и Святого Духа."
        source: { kind: tatoeba, id: 4926397 }
      - pl: "Dobre wiadomości podniosły go na duchu."
        ru: "Хорошие новости приободрили его."
        source: { kind: translated, id: 983382 }
      - pl: "Ale pan tak myślisz w głębi ducha."
        ru: "Но вы так думаете в глубине души."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Праславянское *duxъ от корня «дуть, дышать» — отсюда же dech «дыхание» и oddychać «дышать». Русский «дух» — то же самое слово с тем же двойным смыслом." }
  - { kind: usage, text: "w duchu — «про себя, в душе»: Żołnierz zwymyślał w duchu pogodę." }
  - { kind: usage, text: "podnieść kogoś na duchu — «приободрить кого-то»; iść z duchem czasu — «идти в ногу со временем»." }
  - { kind: usage, text: "Обратите внимание на одушевлённость: винительный совпадает с родительным — widzieć ducha «видеть привидение»." }
collocations:
  - { pl: "w duchu", ru: "про себя" }
  - { pl: "podnieść na duchu", ru: "приободрить" }
  - { pl: "iść z duchem czasu", ru: "идти в ногу со временем" }
  - { pl: "Duch Święty", ru: "Святой Дух" }
etymology: "Праславянское *duxъ от индоевропейского корня «дуть, веять»; отсюда же dech «дыхание» и oddychać «дышать». Русский «дух» — то же самое слово."
memory: "duch — «дух» во всех смыслах сразу: и привидение, и душа, и настрой. Корень тот же, что в dech «дыхание»: дух — это буквально дуновение. Запомните w duchu «про себя», podnieść na duchu «приободрить» и iść z duchem czasu «идти в ногу со временем»."
idioms:
  - { pl: "w duchu", ru: "про себя" }
  - { pl: "podnieść na duchu", ru: "приободрить" }
  - { pl: "iść z duchem czasu", ru: "идти в ногу со временем" }
