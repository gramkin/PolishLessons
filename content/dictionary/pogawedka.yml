notes:
  - { kind: false-friend, text: "POGAWĘDKA — «беседа, болтовня», лёгкий дружеский разговор. От GAWĘDA — «рассказ, сказ». Серьёзный разговор — ROZMOWA, сплетни — PLOTKI." }
  - { kind: usage, text: "Девять форм, женский род. В дательном и местном K переходит в C: W POGAWĘDCE. Родительный множественного — POGAWĘDEK. Звательный POGAWĘDKO не употребляется." }
