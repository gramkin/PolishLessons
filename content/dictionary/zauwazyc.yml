# review
id: zauwazyc
format: 2
lemma: "zauważyć"
rank: 593
pos: verb
aspect: perf
pron: { cyr: "зауважы́ць" }
senses:
  - id: notice
    ru: "заметить, увидеть"
    examples:
      - pl: "Zauważyłem."
        ru: "Я заметил."
        source: { kind: tatoeba, id: 4734161 }
      - pl: "Zauważyła w oddali łódź wiosłową."
        ru: "Она заметила вдали вёсельную лодку."
        source: { kind: translated, id: 6534380 }
      - pl: "Tom zauważył wzór."
        ru: "Том заметил закономерность."
        source: { kind: translated, id: 5225307 }
  - id: remark
    ru: "заметить, сделать замечание (сказать)"
    note: "Второе значение — речевое: zauważył, że… «он заметил, что…»."
    examples:
      - pl: "Moja mama zauważyła, że moje stopy nie są czyste."
        ru: "Мама заметила, что у меня ноги грязные."
        source: { kind: translated, id: 13797645 }
      - pl: "Faktem jest, ze ona nie zauważyła różnicy."
        ru: "Дело в том, что она не заметила разницы."
        source: { kind: translated, id: 2825943 }
      - pl: "Nawet dziecko by zauważyło różnicę."
        ru: "Даже ребенок заметил бы разницу."
        source: { kind: tatoeba, id: 13787756 }
notes:
  - { kind: usage, text: "Два значения, как и в русском: увидеть глазами (zauważyć kogoś w tłumie) и сказать (zauważył, że się spóźniamy)." }
  - { kind: usage, text: "Формы zauważę, zauważysz, zauważy — БУДУЩЕЕ время: глагол совершенного вида. Несовершенный — zauważać." }
  - { kind: usage, text: "Разбирается по частям: za- + uważać «считать, обращать внимание». Отсюда же uwaga «внимание; замечание» и uważny «внимательный»." }
  - { kind: usage, text: "Оборот godny zauważenia значит «достойный внимания», а dać się zauważyć — «дать себя заметить, обратить на себя внимание»." }
collocations:
  - { pl: "zauważyć błąd", ru: "заметить ошибку" }
  - { pl: "nie zauważyć różnicy", ru: "не заметить разницы" }
  - { pl: "godny zauważenia", ru: "достойный внимания" }
  - { pl: "dać się zauważyć", ru: "обратить на себя внимание" }
family:
  - { pl: "zauważać", ru: "замечать", relation: derived }
  - { pl: "uwaga", ru: "внимание, замечание", relation: derived, id: uwaga }
  - { pl: "uważać", ru: "считать, быть внимательным", relation: derived, id: uwazac }
  - { pl: "zauważalny", ru: "заметный", relation: derived }
etymology: "Приставка za- плюс uważać «обращать внимание, считать», от waga «вес, внимание». Буквально «взвесить взглядом». Отсюда же uwaga «внимание; замечание» и uważny «внимательный»."
memory: "zauważyć — «заметить», и оба русских смысла на месте: увидеть глазами (zauważyć kogoś w tłumie) и сказать (zauważył, że się spóźniamy). Формы zauważę, zauważysz — будущее время, несовершенный вид — zauważać. Гнездо прозрачно: uwaga «внимание» и «замечание» одновременно, uważać «считать; быть внимательным», zauważalny «заметный». Полезные обороты: godny zauważenia «достойный внимания», dać się zauważyć «обратить на себя внимание»."
idioms:
  - { pl: "godny zauważenia", ru: "достойный внимания" }
  - { pl: "dać się zauważyć", ru: "обратить на себя внимание" }
  - { pl: "nie zauważyć różnicy", ru: "не заметить разницы" }
