# review
id: zrezygnowac
format: 2
lemma: "zrezygnować"
rank: 1933
pos: verb
aspect: perf
pron: { cyr: "зрэзыгно́ваць" }
senses:
  - id: resign
    ru: "уйти в отставку, отказаться от должности"
    examples:
      - pl: "Zrezygnował."
        ru: "Он ушёл в отставку."
        source: { kind: translated, id: 10557835 }
      - pl: "Tom zrezygnował."
        ru: "Том ушёл в отставку."
        source: { kind: translated, id: 5636933 }
      - pl: "Zrezygnował z urzędu."
        ru: "Он ушёл с должности."
        source: { kind: translated, id: 442853 }
      - pl: "Zrezygnował ze stanowiska ministra."
        ru: "Он отказался от поста министра."
        source: { kind: translated, id: 899584 }
      - pl: "Zrezygnowałem."
        ru: "Я ушёл в отставку."
        source: { kind: tatoeba, id: 8608458 }
      - pl: "Zrezygnował z powodów zdrowotnych."
        ru: "Он ушёл по состоянию здоровья."
        source: { kind: translated, id: 578014 }
  - id: give-up
    ru: "отказаться от чего-либо, бросить"
    examples:
      - pl: "Zrezygnowała ze szkoły."
        ru: "Она бросила школу."
        source: { kind: translated, id: 502924 }
      - pl: "Zrezygnowałem ze śniadania."
        ru: "Я отказался от завтрака."
        source: { kind: translated, id: 9050228 }
      - pl: "Zrezygnuj z takich pomysłów."
        ru: "Откажись от таких мыслей."
        source: { kind: translated, id: 2146242 }
notes:
  - { kind: government, text: "Отказаться от чего-либо — zrezygnować z czegoś, с родительным падежом: zrezygnowała z pracy «она отказалась от работы»." }
  - { kind: usage, text: "Без дополнения значит «уйти в отставку, сдаться»: Musisz zrezygnować «Тебе придётся уйти»." }
  - { kind: usage, text: "Заимствование из латыни через немецкий, поэтому узнаётся русским «резигнация», хотя в русском это слово редкое и книжное." }
collocations:
  - { pl: "zrezygnować z pracy", ru: "уйти с работы" }
  - { pl: "zrezygnować z pomysłu", ru: "отказаться от замысла" }
  - { pl: "musisz zrezygnować", ru: "тебе придётся отказаться" }
etymology: "Из латинского resignare «отказываться, слагать с себя» через немецкий resignieren. Русское «резигнация» — то же заимствование, но в русском оно редкое и книжное."
memory: "zrezygnować z czegoś — «отказаться от чего-то», обязательно с родительным падежом: zrezygnowała z pracy. Без дополнения значит «уйти в отставку»."
idioms:
