  - { form: "płakaniem", reason: "отглагольного существительного от płakać нет; «плач» — это płacz" }
  - { form: "płakaniu", reason: "отглагольного существительного от płakać нет; «плач» — это płacz" }
  - { form: "płakano", reason: "безличной формы у этого глагола нет: плачет всегда кто-то конкретный" }
