# review
id: plakac
format: 2
lemma: "płakać"
rank: 799
pos: verb
aspect: imperf
pron: { cyr: "пуа́каць" }
senses:
  - id: cry
    ru: "плакать"
    examples:
      - pl: "Eliza płacze."
        ru: "Элайза плачет."
        source: { kind: tatoeba, id: 1357097 }
      - pl: "Tom płakał."
        ru: "Том плакал."
        source: { kind: tatoeba, id: 5629949 }
      - pl: "Nigdy nie płaczę."
        ru: "Я никогда не плачу."
        source: { kind: tatoeba, id: 7891489 }
  - id: dont-cry
    ru: "Nie płacz — Не плачь"
    examples:
      - pl: "Nie płacz."
        ru: "Не плачь."
        source: { kind: tatoeba, id: 959747 }
      - pl: "Czemu płaczesz?"
        ru: "Почему ты плачешь?"
        source: { kind: translated, id: 951360 }
      - pl: "Płaczesz?"
        ru: "Ты плачешь?"
        source: { kind: translated, id: 5705222 }
  - id: cried
    ru: "płakała całą noc — она плакала всю ночь"
    examples:
      - pl: "Płakała całą noc."
        ru: "Она рыдала всю ночь."
        source: { kind: tatoeba, id: 352530 }
      - pl: "Płakała i płakała, lecz nikt nie przyszedł jej pocieszyć."
        ru: "Она плакала и плакала, но никто не пришёл, чтобы её утешить."
        source: { kind: tatoeba, id: 775968 }
      - pl: "Bolało, ale nie płakałem."
        ru: "Было больно, но я не плакал."
        source: { kind: tatoeba, id: 8665152 }
  - id: idioms
    ru: "płakać nad rozlanym mlekiem — плакать над пролитым молоком"
    note: "Идиома переносится дословно."
    examples:
      - pl: "Zaczął płakać."
        ru: "Он начал плакать."
        source: { kind: tatoeba, id: 1348383 }
      - pl: "Będziesz płakać."
        ru: "Ты будешь плакать."
        source: { kind: tatoeba, id: 12960432 }
      - pl: "Nie ma co płakać nad rozlanym mlekiem."
        ru: "Нечего плакать над пролитым молоком."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Две идиомы переносятся почти дословно: płakać nad rozlanym mlekiem «плакать над пролитым молоком» и płakać rzewnymi łzami «плакать горькими слезами». Чисто польское — płakać jak bóbr, буквально «плакать как бобр», то есть рыдать навзрыд." }
  - { kind: false-friend, text: "Форма płacz — это и повелительное «плачь», и существительное «плач». Usłyszała jego płacz значит «Она услышала его плач», а не «Плачь!»." }
  - { kind: government, text: "płakać nad czymś «плакать над чем-то» — творительный; płakać z powodu czegoś «плакать из-за чего-то» — родительный; płakać po kimś «оплакивать кого-то»." }
  - { kind: usage, text: "Существительное — płacz «плач», а отглагольное płakanie практически не употребляется. Совершенный вид — zapłakać «заплакать», rozpłakać się «расплакаться»." }
collocations:
  - { pl: "nie płacz", ru: "не плачь" }
  - { pl: "płakać nad rozlanym mlekiem", ru: "плакать над пролитым молоком" }
  - { pl: "płakać jak bóbr", ru: "рыдать навзрыд" }
  - { pl: "zacząć płakać", ru: "начать плакать" }
family:
  - { pl: "płacz", ru: "плач", relation: derived }
  - { pl: "zapłakać", ru: "заплакать", relation: aspect }
  - { pl: "rozpłakać się", ru: "расплакаться", relation: root }
  - { pl: "łza", ru: "слеза", relation: root }
etymology: "Праславянское *plakati — то же слово, что русское «плакать»; изначально корень значил «бить, ударять», отсюда и «оплакивать, бить себя в грудь»."
memory: "płakać — «плакать», слово то же самое. Две идиомы переносятся почти дословно: płakać nad rozlanym mlekiem «плакать над пролитым молоком» и płakać rzewnymi łzami «плакать горькими слезами». А чисто польское płakać jak bóbr буквально значит «плакать как бобр», то есть рыдать навзрыд. Следите за формой płacz: это и «плачь!», и существительное «плач»."
idioms:
  - { pl: "płakać nad rozlanym mlekiem", ru: "плакать над пролитым молоком" }
  - { pl: "płakać jak bóbr", ru: "рыдать навзрыд" }
  - { pl: "nie płacz", ru: "не плачь" }
formExamplesSkip:
