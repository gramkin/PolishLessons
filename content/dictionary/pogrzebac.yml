  - { pl: "pogrzeb", ru: "похороны", relation: derived, id: pogrzeb }
etymology: "Приставка po- и GRZEBAĆ «рыть, копать», из праславянского *grebti — тот же корень, что русские «гребу», «грести», «гребень», «погребать». Исходное значение «разрывать землю», откуда и «хоронить». Из гнезда вышли GRÓB «могила», POGRZEB «похороны», GRABIE «грабли», GRZEBIEŃ «гребень». Обратите внимание на GRÓB с ó в закрытом слоге при GROBU в родительном — та же мена, что в WZÓR при WZORU."
memory: "grzebać — это «грести, рыть», отсюда и «похоронить». Но grób значит «могила», а русский «гроб» — это trumna. И pogrzeb — «похороны»."
