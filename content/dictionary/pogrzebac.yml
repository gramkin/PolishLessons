notes:
  - { kind: false-friend, text: "В этом гнезде лежит ловушка, и серьёзная. GRÓB по-польски значит «могила», а не «гроб»: русский «гроб» — это TRUMNA. Отсюда POGRZEB — «похороны», а не «погребение» в узком смысле, и CMENTARZ полон GROBÓW, то есть могил. Корень же общий с русским: GRZEBAĆ родственно «гребу», «грести», «гребень», из праславянского *grebti «рыть, копать». Так что буквально похоронить значит «зарыть», и русское «погребать» того же корня — только русский «гроб» ушёл от могилы к ящику." }
  - { kind: usage, text: "Повелительное POGRZEB совпадает по форме с существительным POGRZEB «похороны», и это не случайность, а чистое совпадение двух разных слов: глагольная форма выходит из третьего лица POGRZEBIE отбрасыванием -ie, а существительное образовано от того же корня независимо. В живой речи путаницы не бывает, потому что падеж и окружение разводят их сразу: POGRZEB W SZUFLADZIE — «поройся в ящике», а POGRZEB BYŁ W PIĄTEK — «похороны были в пятницу»." }
  - { kind: pronunciation, text: "Повелительное POGRZEB — ещё одна проверка правила, исправленного в партии 259. Третье лицо POGRZEBIE, отбрасываем -ie, остаётся POGRZEB. Основа кончается на -b, и польское слово такой основой закончиться может, поэтому никакого -ij не вставляется. Сравните с WALNĄĆ, где основа WALN- словом кончиться не может и выходит WALNIJ. А первое лицо даёт POGRZEBIĘ, с мягким b перед -ę, как PODWIOZĘ при PODWIEŹĆ." }
  - { kind: government, text: "В первом значении переходный: POGRZEBAĆ KOGOŚ в винительном — pogrzebali go, pogrzebano ją. Переносно берёт в дополнение надежды и планы: TEN WYROK POGRZEBAŁ WSZYSTKIE NADZIEJE, ровно как русское «похоронил все надежды». Во втором значении непереходный и берёт предлог W с предложным: POGRZEBAĆ W PAPIERACH, W SZUFLADZIE, W PAMIĘCI — «порыться в бумагах, в ящике, в памяти». Русский берёт здесь тот же предлог «в», так что управление переносится. Несовершенная пара к первому значению — GRZEBAĆ." }
collocations:
  - { pl: "pogrzebać na cmentarzu", ru: "похоронить на кладбище" }
  - { pl: "pogrzebać nadzieje", ru: "похоронить надежды" }
  - { pl: "pogrzebać w papierach", ru: "порыться в бумагах" }
family:
