# review
id: kazac
format: 2
lemma: "kazać"
rank: 428
pos: verb
aspect: imperf
pron: { cyr: "ка́заць" }
senses:
  - id: order
    ru: "велеть, приказать (кому-то что-то сделать)"
    examples:
      - pl: "Tom kazał mi być cicho."
        ru: "Том сказал мне, чтобы я сидел тихо."
        source: { kind: tatoeba, id: 10115718 }
      - pl: "Kazał mi czekać."
        ru: "Он велел мне ждать."
        source: { kind: translated, id: 8766061 }
      - pl: "Kazali jej iść."
        ru: "Они велели ей идти."
        source: { kind: translated, id: 718968 }
  - id: sermon
    ru: "kazanie — проповедь; в переносном смысле «нотация»"
    examples:
      - pl: "Pastor wygłosił piękne kazanie."
        ru: "Пастор произнёс прекрасную проповедь."
        source: { kind: translated, id: 4820988 }
      - pl: "Ojciec palnął mi kazanie za palenie."
        ru: "Отец прочитал мне нотацию за курение."
        source: { kind: translated, id: 1112119 }
      - pl: "To nie jest kazanie."
        ru: "Это не нотация."
        source: { kind: translated, id: 13915156 }
notes:
  - { kind: usage, text: "Конструкция — дательный падеж плюс инфинитив: kazać komuś coś zrobić. Kazał mi czekać «Он велел мне ждать»." }
  - { kind: false-friend, text: "Не путайте с русским «казаться». Польское kazać — это «приказывать»: тот же корень, что в «приказать», «сказать», «показать». Ср. pokazać «показать», wskazać «указать»." }
  - { kind: usage, text: "Отглагольное существительное kazanie значит «проповедь»: wygłosić kazanie «произнести проповедь». В переносном смысле — «нотация»: palnąć komuś kazanie «прочитать кому-то нотацию»." }
  - { kind: usage, text: "Очень частая формула вежливости и упрёка: Nie każ mi czekać! «Не заставляй меня ждать!», Robię, co mi każą «Делаю, что велят»." }
collocations:
  - { pl: "kazać komuś czekać", ru: "заставить кого-то ждать" }
  - { pl: "wygłosić kazanie", ru: "произнести проповедь" }
  - { pl: "nie każ mi czekać", ru: "не заставляй меня ждать" }
  - { pl: "robić, co każą", ru: "делать, что велят" }
etymology: "Праславянское *kazati «показывать, говорить». Русские «сказать», «показать», «приказать» — то же гнездо; польский сохранил за бесприставочным глаголом значение «приказывать»."
memory: "kazać — «велеть», то есть русское «приказать» без приставки. Корень тот же, что в «сказать» и «показать»: pokazać «показать», wskazać «указать». Строится с дательным и инфинитивом: Kazał mi czekać «Он велел мне ждать». А kazanie — «проповедь», и заодно «нотация»: palnąć komuś kazanie."
idioms:
  - { pl: "nie każ mi czekać", ru: "не заставляй меня ждать" }
  - { pl: "prawić kazanie", ru: "читать нотацию" }
  - { pl: "robię, co mi każą", ru: "делаю, что велят" }
