# review
id: wypelniac
format: 2
lemma: "wypełniać"
rank: 3930
pos: verb
pron: { cyr: "выпе́уняць" }
senses:
  - id: fill
    ru: "заполнять, наполнять"
    examples:
      - pl: "Wypełniam formularz online."
        ru: "Я заполняю анкету онлайн."
        source: { kind: authored }
      - pl: "Zapach kawy wypełnia kuchnię."
        ru: "Запах кофе наполняет кухню."
        source: { kind: authored }
      - pl: "Kelner wypełnia kieliszki winem."
        ru: "Официант наполняет бокалы вином."
        source: { kind: authored }
  - id: fulfil
    ru: "выполнять (обязанности, обещания)"
    examples:
      - pl: "Sumiennie wypełnia swoje obowiązki."
        ru: "Он добросовестно выполняет свои обязанности."
        source: { kind: authored }
      - pl: "Nie zawsze wypełniamy obietnice."
        ru: "Мы не всегда выполняем обещания."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "WYPEŁNIAĆ — «заполнять, наполнять», а также «выполнять» (обязанности, волю). Русское «выполнять» в смысле «делать» — WYKONYWAĆ; WYPEŁNIAĆ — именно об обязанностях, договорах, обещаниях: WYPEŁNIAĆ OBOWIĄZKI. Анкету по-польски тоже заполняют: WYPEŁNIAĆ FORMULARZ." }
  - { kind: usage, text: "Несовершенный вид; совершенный — WYPEŁNIĆ. Спряжение на -AM: WYPEŁNIAM, WYPEŁNIASZ, WYPEŁNIAJĄ. Мужско-личное страдательное WYPEŁNIANI в карточку не включено." }
  - { kind: government, text: "Что — винительный: WYPEŁNIAĆ ANKIETĘ. Чем — творительный: WYPEŁNIAĆ BUTELKĘ WODĄ, WYPEŁNIAĆ CZAS PRACĄ. Чью волю — родительный: WYPEŁNIAĆ WOLĘ OJCA." }
  - { kind: pronunciation, text: "Читается «выпе́уняць»: Ł — «у», NIA — «ня». Ударение на предпоследнем слоге. WYPEŁNIAM — «выпе́уням»." }
  - { kind: register, text: "Нейтральное слово. Об анкетах — бытовое, об обязанностях и завещании — официальное." }
collocations:
  - { pl: "wypełniać formularz", ru: "заполнять анкету" }
  - { pl: "wypełniać obowiązki", ru: "выполнять обязанности" }
  - { pl: "wypełniać czas", ru: "заполнять время" }
family:
  - { pl: "wypełnić", ru: "заполнить, выполнить", relation: aspect, id: wypelnic }
  - { pl: "pełny", ru: "полный", relation: root, id: pelny }
  - { pl: "formularz", ru: "анкета, бланк", relation: root }
etymology: "Приставка WY- плюс PEŁNIĆ «наполнять», от PEŁNY «полный», праславянское *pьlnъ, как русское «полный», «выполнять»."
memory: "Wypełniać — заполнять, выполнять: wypełniam formularz; wypełnia obowiązki. От pełny — «полный»."
