# review
id: odkupic
format: 2
lemma: "odkupić"
rank: 5135
pos: verb
pron: { cyr: "отку́пиць" }
senses:
  - id: buy-from
    ru: "купить (у кого-то), выкупить"
    examples:
      - pl: "Odkupiłem od sąsiada stary samochód."
        ru: "Я купил у соседа старую машину."
        source: { kind: authored }
      - pl: "Muzeum odkupiło obraz od kolekcjonera."
        ru: "Музей выкупил картину у коллекционера."
        source: { kind: authored }
      - pl: "Odkupię ci tę książkę, jeśli chcesz."
        ru: "Я куплю у тебя эту книгу, если хочешь."
        source: { kind: authored }
  - id: atone
    ru: "искупить (вину, грехи)"
    examples:
      - pl: "Chciał odkupić swoje winy."
        ru: "Он хотел искупить свою вину."
        source: { kind: authored }
      - pl: "Chrystus odkupił ludzkość."
        ru: "Христос искупил человечество."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ODKUPIĆ — не «откупиться» взяткой. Главное значение — «купить у кого-то, выкупить»: ODKUPIĆ OD KOGOŚ MIESZKANIE. Второе — «искупить»: ODKUPIĆ WINY. «Откупиться» по-польски — WYKUPIĆ SIĘ, а «откуп, выкуп» — OKUP. ODKUPICIEL — «Искупитель»." }
  - { kind: usage, text: "Пятьдесят три формы — подпись переходного глагола совершенного вида: страдательное ODKUPIONY и деепричастие ODKUPIWSZY. Повелительное ODKUP. Видовой партнёр — ODKUPYWAĆ. ODKUPIENIE — «искупление» в религиозном смысле." }
  - { kind: government, text: "Что у кого — винительный и OD с родительным: ODKUPIĆ AUTO OD BRATA. За сколько — ZA с винительным: ODKUPIĆ ZA PÓŁ CENY. Вину чем — творительный: ODKUPIĆ WINĘ PRACĄ." }
  - { kind: pronunciation, text: "Читается «отку́пиць», три слога, ударение на предпоследнем. D перед K оглушается в «т». PI — мягкое «пи», конечное Ć — «ць». ODKUP — «о́ткуп»." }
  - { kind: register, text: "«Купить у кого-то» — нейтральное бытовое и деловое: ODKUPIĆ UDZIAŁY, «выкупить доли». «Искупить» — книжное и религиозное. Дорогое ODKUPIENIE GRZECHÓW — в проповедях." }
collocations:
  - { pl: "odkupić od kogoś", ru: "купить у кого-то" }
  - { pl: "odkupić winy", ru: "искупить вину" }
  - { pl: "odkupić udziały", ru: "выкупить доли" }
family:
  - { pl: "kupić", ru: "купить", relation: root, id: kupic }
  - { pl: "odkupiciel", ru: "искупитель", relation: derived }
  - { pl: "okup", ru: "выкуп", relation: root }
etymology: "Приставка OD- «от-» плюс KUPIĆ «купить», праславянское *kupiti, то же, что русское «купить». Значение «искупить» — калька церковной латыни REDIMERE «выкупить обратно»."
memory: "Odkupić — купить у кого-то: odkupić auto od brata. Odkupić winy — искупить вину. Откупиться — wykupić się. Odkupiciel — Искупитель. Читается «отку́пиць»."
idioms:
  - { pl: "odkupić swoje winy", ru: "искупить свою вину" }
