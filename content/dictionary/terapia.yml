# review
id: terapia
format: 2
lemma: "terapia"
rank: 1864
pos: noun
pron: { cyr: "тэра́пья" }
senses:
  - id: therapy
    ru: "терапия, лечение"
    examples:
      - pl: "Potrzebujesz terapii."
        ru: "Тебе нужна терапия."
        source: { kind: translated, id: 8706335 }
      - pl: "Myślę, że powinien pójść na terapię."
        ru: "Думаю, ему стоит пойти на терапию."
        source: { kind: translated, id: 11700928 }
      - pl: "Mimo terapii, wcale nie czuła się lepiej."
        ru: "Несмотря на терапию, ей совсем не стало лучше."
        source: { kind: translated, id: 923189 }
  - id: therapy-course
    ru: "терапия (курс лечения)"
    examples:
      - pl: "Na szczęście terapia była tylko nieskuteczna, a nie szkodliwa."
        ru: "К счастью, терапия была лишь неэффективной, а не вредной."
        source: { kind: translated, id: 840267 }
      - pl: "Ile będę musiał zapłacić do zakończenia terapii?"
        ru: "Сколько мне придётся заплатить до конца терапии?"
        source: { kind: translated, id: 924524 }
notes:
  - { kind: usage, text: "Слово покрывает и медицинское лечение, и психотерапию: pójść na terapię «пойти на терапию» обычно значит именно психотерапию." }
  - { kind: government, text: "На терапию — na terapię (винительный падеж); после терапии — po terapii (предложный)." }
  - { kind: usage, text: "Корпус даёт слово скупо: пять примеров на десять форм, поэтому часть примеров в карточке составлена." }
  - { kind: false-friend, text: "Слово то же, что русское «терапия», из греческого therapeia «уход, лечение»." }
