# review
id: wyzbywac
format: 2
lemma: "wyzbywać"
rank: 5937
pos: verb
aspect: imperf
pron: { cyr: "вызбы́ваць" }
senses:
  - id: rid
    ru: "избавляться, освобождаться (от привычки, страха, иллюзий)"
    note: "wyzbywać się + родительный"
    examples:
      - pl: "Powoli wyzbywam się złych nawyków."
        ru: "Я постепенно избавляюсь от вредных привычек."
        source: { kind: authored }
      - pl: "Z wiekiem człowiek wyzbywa się złudzeń."
        ru: "С возрастом человек избавляется от иллюзий."
        source: { kind: authored }
      - pl: "Dzieci szybko wyzbywają się wstydu."
        ru: "Дети быстро перестают стесняться."
        source: { kind: authored }
  - id: part
    ru: "расставаться, отказываться (от имущества, вещей)"
    examples:
      - pl: "Starsza pani wyzbywała się mebli po kolei."
        ru: "Пожилая дама расставалась с мебелью предмет за предметом."
        source: { kind: authored }
      - pl: "Firma wyzbywa się nierentownych sklepów."
        ru: "Фирма избавляется от нерентабельных магазинов."
        source: { kind: authored }
notes:
  - { kind: government, text: "Только с SIĘ и родительным падежом: WYZBYWAĆ SIĘ CZEGOŚ — WYZBYWAĆ SIĘ STRACHU, ZŁUDZEŃ. Не «od czegoś», как подсказывает русское «избавляться от». Страдательного причастия нет." }
  - { kind: usage, text: "Несовершенный вид; совершенный — WYZBYĆ SIĘ: WYZBĘDĘ SIĘ, WYZBYŁ SIĘ. Близкий и более бытовой синоним — POZBYWAĆ SIĘ; WYZBYWAĆ SIĘ книжнее и чаще говорится о чертах характера, чувствах, имуществе." }
  - { kind: false-friend, text: "Родственно русскому «избывать, избыть» (избыть горе), а не «избивать». Корень — BYĆ «быть»." }
collocations:
  - { pl: "wyzbywać się złudzeń", ru: "расставаться с иллюзиями" }
  - { pl: "wyzbywać się nawyków", ru: "избавляться от привычек" }
  - { pl: "wyzbywać się majątku", ru: "распродавать имущество" }
  - { pl: "wyzbywać się strachu", ru: "избавляться от страха" }
family:
  - { pl: "wyzbyć", ru: "избавиться (wyzbyć się)", relation: aspect }
  - { pl: "pozbyć", ru: "избавиться (pozbyć się)", relation: root, id: pozbyc }
  - { pl: "zbywać", ru: "сбывать; отделываться", relation: root }
  - { pl: "być", ru: "быть", relation: root }
etymology: "Приставка WY- плюс ZBYWAĆ, от ZBYĆ «сбыть, избыть»; в основе BYĆ «быть», как в русском «избывать»."
memory: "Wyzbywać się — «избывать»: что-то было (być), а теперь его из себя вы-водишь, wy-."
idioms:
  - { pl: "wyzbywać się resztek godności", ru: "терять остатки достоинства" }
