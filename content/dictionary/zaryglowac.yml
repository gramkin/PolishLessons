# review
id: zaryglowac
format: 2
lemma: "zaryglować"
rank: 2022
pos: verb
aspect: perf
pron: { cyr: "зарыгло́ваць" }
senses:
  - id: bolt
    ru: "запереть на засов"
    examples:
      - pl: "Zarygluj drzwi."
        ru: "Запри дверь на засов."
        source: { kind: translated, id: 12232777 }
      - pl: "Musisz zaryglować bramę."
        ru: "Ты должен запереть ворота на засов."
        source: { kind: authored }
      - pl: "Zaryglowali wszystkie wejścia."
        ru: "Они заперли на засов все входы."
        source: { kind: authored }
      - pl: "Drzwi były zaryglowane od środka."
        ru: "Дверь была заперта на засов изнутри."
        source: { kind: authored }
      - pl: "Zaryglował okno."
        ru: "Он запер окно на засов."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Совершенный вид; несовершенный — ryglować." }
  - { kind: usage, text: "Значит именно «запереть на засов», а не просто «закрыть» — для этого есть zamknąć." }
  - { kind: false-friend, text: "Не «отрегулировать»! Корень — rygiel «засов», из немецкого Riegel." }
  - { kind: government, text: "Прямое дополнение в винительном: zaryglować drzwi «запереть дверь на засов»." }
collocations:
  - { pl: "zaryglować drzwi", ru: "запереть дверь на засов" }
etymology: "От rygiel «засов», заимствованного из немецкого Riegel."
memory: "zaryglować — «запереть на засов», от rygiel «засов» (нем. Riegel). Не путайте с «регулировать»: это про засов, а не про настройку."
idioms:
  - { pl: "zaryglować drzwi", ru: "запереть дверь на засов" }
