# review
id: poznac
format: 2
lemma: "poznać"
rank: 248
pos: verb
aspect: perf
pron: { cyr: "по́знаць" }
senses:
  - id: meet
    ru: "познакомиться с кем-либо"
    note: "Miło mi cię poznać — «Приятно познакомиться»."
    examples:
      - pl: "Miło mi Cię poznać."
        ru: "Рад с Вами познакомиться."
        source: { kind: tatoeba, id: 457339 }
      - pl: "Dan poznał Lindę w kościele."
        ru: "Дэн познакомился с Линдой в церкви."
        source: { kind: tatoeba, id: 3997727 }
      - pl: "Kiedy poznałeś rodzinę Toma?"
        ru: "Когда ты познакомился с семьёй Тома?"
        source: { kind: tatoeba, id: 2403012 }
  - id: find-out
    ru: "узнать, познать (правду, тайну); узнать в лицо"
    examples:
      - pl: "Chcesz poznać tajemnicę?"
        ru: "Хочешь узнать секрет?"
        source: { kind: tatoeba, id: 3457078 }
      - pl: "Wkrótce po tym, poznaliśmy prawdę."
        ru: "Вскоре мы узнали правду."
        source: { kind: tatoeba, id: 2145567 }
      - pl: "Poznałem się z nią przez przyjaciela."
        ru: "Я познакомился с ней через друга."
        source: { kind: tatoeba, id: 3752582 }
notes:
  - { kind: usage, text: "poznać kogoś чаще всего значит «познакомиться с кем-то», а не «познать»: Miło mi cię poznać «Приятно познакомиться», Poznałem ją wczoraj «Я познакомился с ней вчера»." }
  - { kind: usage, text: "Второе значение — «узнать в лицо»: Nie poznałem cię «Я тебя не узнал», Nikt jej nie pozna w tej masce." }
  - { kind: usage, text: "Несовершенный вид — poznawać. Возвратное poznać się z kimś тоже значит «познакомиться»." }
  - { kind: false-friend, text: "Осторожно с формами poznania и poznaniu: так же выглядят падежи города Poznań. Mieszka w Poznaniu — «живёт в Познани», а не «в познании»." }
collocations:
  - { pl: "miło mi cię poznać", ru: "приятно познакомиться" }
  - { pl: "poznać prawdę", ru: "узнать правду" }
  - { pl: "poznać kogoś", ru: "познакомиться с кем-то" }
  - { pl: "nie poznałem cię", ru: "я тебя не узнал" }
etymology: "Из po- + znać «знать», праславянское *znati; ср. русские «познать», «узнать», «знать»."
memory: "Miło mi cię poznać — «Приятно познакомиться». poznać покрывает и «познакомиться», и «узнать в лицо»: Nie poznałem cię «Я тебя не узнал». А poznaniu может быть и падежом города Poznań."
idioms:
  - { pl: "miło mi cię poznać", ru: "приятно познакомиться" }
  - { pl: "poznać na własnej skórze", ru: "узнать на собственной шкуре" }
  - { pl: "poznać się na kimś", ru: "раскусить кого-то" }
