# review
id: cudowny
format: 2
lemma: "cudowny"
rank: 971
pos: adj
pron: { cyr: "цудо́вны" }
senses:
  - id: wonderful
    ru: "чудесный, замечательный"
    examples:
      - pl: "To cudowny pomysł!"
        ru: "Это чудесная идея!"
        source: { kind: translated, id: 365704 }
      - pl: "To cudowna kobieta."
        ru: "Это чудесная женщина."
        source: { kind: translated, id: 2210692 }
      - pl: "To jest cudowne."
        ru: "Это чудесно."
        source: { kind: translated, id: 3749997 }
  - id: prodigy
    ru: "cudowne dziecko — вундеркинд"
    examples:
      - pl: "Jesteś cudownym dzieckiem?"
        ru: "Ты вундеркинд?"
        source: { kind: translated, id: 2127853 }
      - pl: "Był cudownym dzieckiem."
        ru: "Он был вундеркиндом."
        source: { kind: authored }
      - pl: "Cudowne dziecko grało Chopina w wieku pięciu lat."
        ru: "Вундеркинд играл Шопена в пять лет."
        source: { kind: authored }
  - id: miraculous
    ru: "чудотворный, чудесный (о чуде)"
    examples:
      - pl: "To cudowny obraz w klasztorze."
        ru: "Это чудотворная икона в монастыре."
        source: { kind: authored }
      - pl: "Nie ma cudownego lekarstwa na starość."
        ru: "Чудесного лекарства от старости нет."
        source: { kind: authored }
      - pl: "Wierzy w cudowne uzdrowienia."
        ru: "Он верит в чудесные исцеления."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Слово образовано от cud «чудо» — ровно как русское «чудесный» от «чудо». Наречие — cudownie «чудесно»." }
  - { kind: usage, text: "cudowne dziecko — «вундеркинд», буквально «чудесный ребёнок». Русское слово взято из немецкого, польское собрано из своих частей." }
  - { kind: usage, text: "Второе значение — «чудотворный»: cudowny obraz «чудотворная икона», cudowne uzdrowienie «чудесное исцеление»." }
  - { kind: usage, text: "Степени сравнения в живой речи почти не встречаются: вместо cudowniejszy говорят bardziej cudowny или просто wspanialszy." }
collocations:
  - { pl: "cudowne dziecko", ru: "вундеркинд" }
  - { pl: "cudowny pomysł", ru: "чудесная идея" }
  - { pl: "cudowna pogoda", ru: "чудесная погода" }
