  - { pl: "cudownie", ru: "чудесно", relation: derived }
  - { pl: "cudotwórca", ru: "чудотворец", relation: derived }
etymology: "От cud «чудо», праславянское *čudo — то же слово, что русское «чудо». Прилагательное собрано ровно как русское «чудесный»: корень плюс суффикс."
memory: "cudowny — «чудесный», от cud «чудо», как и в русском. Запомните cudowne dziecko «вундеркинд» и второе значение «чудотворный»: cudowny obraz — это икона, а не просто красивая картина."
