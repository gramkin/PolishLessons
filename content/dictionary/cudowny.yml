notes:
  - { kind: usage, text: "Слово образовано от cud «чудо» — ровно как русское «чудесный» от «чудо». Наречие — cudownie «чудесно»." }
  - { kind: usage, text: "cudowne dziecko — «вундеркинд», буквально «чудесный ребёнок». Русское слово взято из немецкого, польское собрано из своих частей." }
  - { kind: usage, text: "Второе значение — «чудотворный»: cudowny obraz «чудотворная икона», cudowne uzdrowienie «чудесное исцеление»." }
  - { kind: usage, text: "Степени сравнения в живой речи почти не встречаются: вместо cudowniejszy говорят bardziej cudowny или просто wspanialszy." }
collocations:
  - { pl: "cudowne dziecko", ru: "вундеркинд" }
  - { pl: "cudowny pomysł", ru: "чудесная идея" }
