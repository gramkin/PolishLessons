etymology: "Из итальянского BANDITO «объявленный вне закона», причастия от BANDIRE «изгонять, объявлять указом», а то — от германского BANN «указ, запрет», того же корня, что немецкое BANN и английское BAN. Исходное значение было юридическим: бандит есть человек, поставленный указом вне закона, и лишь потом слово стало значить разбойника. Оба языка получили его из итальянского через немецкий и французский, но польский взял форму с окончанием -A, как брал её у ARTYSTA и TURYSTA, и подчинил своему женскому склонению; русский отбросил гласный и получил обычное мужское слово. Отсюда вся разница в парадигме при полном совпадении смысла."
memory: "То же слово, что русский «бандит», от итальянского bandito «объявленный вне закона», от германского bann «указ» — родня английскому ban. Но польский сохранил конечное -a, и слово попало в класс specjalista и artysta: в единственном числе склоняется по женскому образцу (bandyty, bandycie, bandytę), во множественном по мужскому (bandyci), прилагательные всегда мужские. Звучит «банды́та», с «ы» и ударением на втором слоге. Jednoręki bandyta — игровой автомат, как и по-русски."
idioms:
  - { pl: "jednoręki bandyta", ru: "однорукий бандит, игровой автомат" }
