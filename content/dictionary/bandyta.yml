notes:
  - { kind: false-friend, text: "Значение совпадает с русским «бандитом», и расходится только конечный гласный — но расходится закономерно. Польский сохранил итальянское окончание -A, которое русский отбросил, и потому слово попало в тот же класс, что SPECJALISTA, ARTYSTA и TURYSTA: мужской род при женском склонении в единственном числе. Сравните: русские «бандит», «артист», «турист» — и польские BANDYTA, ARTYSTA, TURYSTA. Выражение JEDNORĘKI BANDYTA об игровом автомате отвечает русскому «однорукому бандиту» слово в слово, и образ в двух языках один." }
  - { kind: usage, text: "Одиннадцать форм, мужской род. В единственном числе склонение женского образца: BANDYTY, BANDYCIE, BANDYTĘ, BANDYTĄ, BANDYTO. Во множественном — мужское: BANDYCI, BANDYTÓW, BANDYTOM. Прилагательные всегда мужские: NIEBEZPIECZNY BANDYTA, и ошибка в роде слышна сразу. Переход T в мягкое виден дважды: в дательном и местном BANDYCIE и в именительном множественного BANDYCI. Винительный единственного имеет собственное окончание -Ę, как у женских слов, а не равен родительному." }
  - { kind: pronunciation, text: "Читается «банды́та», три слога, ударение на втором. Буква Y даёт «ы», поэтому второй слог звучит «ды», а не «ди» — это главное отличие от русского «банди́та», где и гласный другой, и ударение на последнем слоге. В форме BANDYCIE сочетание CIE даёт мягкое «це»: «банды́це». В форме BANDYCI слышно «банды́ци». В форме BANDYTÓW буква Ó читается как «у», а конечное W оглушается: «банды́туф»." }
  - { kind: register, text: "Слово нейтральное и газетное, в исторических текстах частое. Устойчивые сочетания: NAPAD BANDYTÓW «нападение бандитов», BANDA BANDYTÓW, JEDNORĘKI BANDYTA. В речи о политике слово употребляют как резкую брань, и тогда оно звучит сильнее русского «бандита». Производные: BANDYCKI «бандитский», BANDYTYZM «бандитизм». Слово BANDA означает шайку и совершенно обиходно, а вот BANDYTKA о женщине почти не употребляется — скажут описательно." }
