# review
id: nadzieja
format: 2
lemma: "nadzieja"
rank: 238
pos: noun
pron: { cyr: "надзе́я" }
senses:
  - id: hope
    ru: "надежда"
    examples:
      - pl: "Mam taką nadzieję."
        ru: "Есть у меня такая надежда."
        source: { kind: tatoeba, id: 540641 }
      - pl: "On nigdy nie traci nadziei."
        ru: "Он никогда не теряет надежду."
        source: { kind: tatoeba, id: 348731 }
      - pl: "Nie ma dla mnie nadziei."
        ru: "Для меня нет никакой надежды."
        source: { kind: tatoeba, id: 6327952 }
  - id: to-hope
    ru: "mieć nadzieję — надеяться"
    note: "Отдельного глагола «надеяться» в польском нет: говорят mam nadzieję, że…"
    examples:
      - pl: "Mam nadzieję, że to działa."
        ru: "Надеюсь, он сработает."
        source: { kind: tatoeba, id: 11492451 }
      - pl: "Mam nadzieję, że się zgodzisz."
        ru: "Надеюсь, что ты согласишься."
        source: { kind: tatoeba, id: 6327951 }
      - pl: "Czy jest nadzieja na zbawienie?"
        ru: "Есть ли надежда на спасение?"
        source: { kind: tatoeba, id: 2493383 }
notes:
  - { kind: usage, text: "Главное: русскому «надеюсь» отвечает оборот Mam nadzieję, że… — буквально «имею надежду, что…». Это одна из самых частых фраз в языке." }
  - { kind: usage, text: "После отрицания — родительный падеж: Nie trać nadziei «Не теряй надежды»." }
  - { kind: usage, text: "być przy nadziei — устаревший оборот «быть беременной»." }
collocations:
  - { pl: "mieć nadzieję", ru: "надеяться" }
  - { pl: "stracić nadzieję", ru: "потерять надежду" }
  - { pl: "nadzieja na coś", ru: "надежда на что-то" }
  - { pl: "ostatnia nadzieja", ru: "последняя надежда" }
etymology: "Из na- + праславянское *dedi̯ǫ «класть, ставить»: надежда — это то, что «положено» впереди; русское «надежда» — та же модель со старославянским -жд-."
memory: "Глагола «надеяться» в польском нет — есть оборот: Mam nadzieję, że przyjdziesz «Надеюсь, что придёшь». Запомните его целиком."
idioms:
  - { pl: "mieć nadzieję", ru: "надеяться" }
  - { pl: "stracić nadzieję", ru: "потерять надежду" }
  - { pl: "przy nadziei", ru: "в положении, беременна" }
formExamplesSkip:
  - { form: "nadziejo", reason: "звательный падеж встречается только в стихах и молитвах" }
