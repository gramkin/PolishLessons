# review
id: pamietac
format: 2
lemma: "pamiętać"
rank: 167
pos: verb
aspect: imperf
pron: { cyr: "памё́нтаць" }
senses:
  - id: remember
    ru: "помнить (что-либо, кого-либо)"
    examples:
      - pl: "Wszystko pamiętam."
        ru: "Я всё помню."
        source: { kind: tatoeba, id: 1648774 }
      - pl: "Pamiętasz Toma?"
        ru: "Помнишь Тома?"
        source: { kind: tatoeba, id: 6488498 }
      - pl: "Pamiętam takie tramwaje."
        ru: "Я помню такие трамваи."
        source: { kind: tatoeba, id: 10137719 }
  - id: keep-in-mind
    ru: "помнить о чём-либо, не забывать"
    note: "pamiętać o czymś — с предлогом o и предложным падежом, как в русском."
    examples:
      - pl: "Pamiętajcie o tym."
        ru: "Помните об этом."
        source: { kind: tatoeba, id: 6320203 }
      - pl: "Pamiętasz?"
        ru: "Помнишь?"
        source: { kind: tatoeba, id: 369450 }
      - pl: "Pamiętasz tamten dzień?"
        ru: "Помнишь тот день?"
        source: { kind: tatoeba, id: 3070693 }
notes:
  - { kind: government, text: "Два управления, как в русском: pamiętać coś «помнить что-то» (винительный) и pamiętać o czymś «помнить о чём-то» (o + предложный)." }
  - { kind: usage, text: "Совершенный вид — zapamiętać «запомнить»: Zapamiętaj ten adres «Запомни этот адрес»." }
  - { kind: usage, text: "Pamiętaj! значит «Помни!», а Nie pamiętam — «Не помню»." }
collocations:
  - { pl: "pamiętać o czymś", ru: "помнить о чём-то" }
  - { pl: "nie pamiętam", ru: "не помню" }
  - { pl: "o ile pamiętam", ru: "насколько я помню" }
  - { pl: "pamiętaj!", ru: "помни!" }
etymology: "От pamięć «память» с суффиксом -ać; то же слово, что русское «память, помнить» — корень общий."
memory: "Два управления, как в русском: pamiętać coś «помнить что-то» и pamiętać o czymś «помнить о чём-то». «Запомнить» — zapamiętać."
idioms:
  - { pl: "o ile pamiętam", ru: "насколько я помню" }
  - { pl: "pamiętać jak przez mgłę", ru: "помнить как в тумане" }
  - { pl: "pamiętaj o mnie", ru: "помни обо мне" }
