# review
id: zastrzezenie
format: 2
lemma: "zastrzeżenie"
rank: 6065
pos: noun
pron: { cyr: "застшэжэ́не" }
senses:
  - id: objection
    ru: "возражение, претензия, замечание"
    examples:
      - pl: "Nie mam do tego żadnych zastrzeżeń."
        ru: "У меня к этому нет никаких претензий."
        source: { kind: translated, id: 3082112 }
      - pl: "Jeśli o mnie chodzi, nie mam zastrzeżeń."
        ru: "Что до меня, у меня нет возражений."
        source: { kind: translated, id: 616289 }
      - pl: "Wynajem tego pokoju jest drogi, ale poza tym nie mam zastrzeżeń."
        ru: "Аренда этой комнаты дорогая, но в остальном у меня нет претензий."
        source: { kind: translated, id: 695752 }
  - id: reservation
    ru: "оговорка, условие"
    examples:
      - pl: "Zgodził się, ale z jednym zastrzeżeniem."
        ru: "Он согласился, но с одной оговоркой."
        source: { kind: authored }
      - pl: "Umowa zawiera zastrzeżenie o poufności."
        ru: "Договор содержит оговорку о конфиденциальности."
        source: { kind: authored }
  - id: reserving
    ru: "блокировка (карты, документа); закрепление права"
    examples:
      - pl: "Bank przyjął zastrzeżenie skradzionej karty."
        ru: "Банк принял заявку на блокировку украденной карты."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Главное значение — «претензия, возражение»: MIEĆ ZASTRZEŻENIA DO CZEGOŚ, «иметь претензии к чему-то», BEZ ZASTRZEŻEŃ, «безоговорочно». Второе — «оговорка»: z zastrzeżeniem, że…, «с оговоркой, что…». Отглагольное от ZASTRZEC, «оговорить, закрепить»: WSZELKIE PRAWA ZASTRZEŻONE — «все права защищены»." }
  - { kind: government, text: "Претензии к чему — DO + родительный: zastrzeżenia do projektu, do pracy, а не «к» с дательным. Отсутствие — родительный: nie mam zastrzeżeń." }
  - { kind: pronunciation, text: "«застшэжэ́не»: RZ после T оглушается в «ш», а Ż — твёрдое «ж». Ударение на предпоследнем слоге ŻE. В родительном множественного — ZASTRZEŻEŃ, «застшэ́жэнь»." }
  - { kind: register, text: "Нейтральное и деловое: на работе, в отзывах, в договорах. Разговорное «претензии» по-польски — тоже zastrzeżenia или pretensje; PRETENSJE эмоциональнее: mieć do kogoś pretensje, «быть в обиде на кого-то»." }
collocations:
  - { pl: "mieć zastrzeżenia do czegoś", ru: "иметь претензии к чему-то" }
  - { pl: "bez zastrzeżeń", ru: "безоговорочно, без претензий" }
  - { pl: "z zastrzeżeniem, że", ru: "с оговоркой, что" }
  - { pl: "zgłosić zastrzeżenia", ru: "высказать возражения" }
family:
  - { pl: "zastrzec", ru: "оговорить, закрепить за собой", relation: root }
  - { pl: "zastrzeżony", ru: "защищённый, зарезервированный", relation: derived }
etymology: "От ZASTRZEC, «оговорить», из ZA- и STRZEC, «стеречь», того же корня, что русское «стеречь», «остерегаться». ZASTRZEŻENIE — буквально «то, чем себя обезопасили»: оговорка, охраняющая интересы, а отсюда и возражение."
memory: "Zastrzeżenie — от za-strzec, «застеречь»: оговорка и претензия. Nie mam zastrzeżeń — претензий нет. Bez zastrzeżeń — безоговорочно. Претензии DO czegoś."
idioms:
  - { pl: "bez zastrzeżeń", ru: "безоговорочно, полностью" }
