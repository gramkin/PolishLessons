notes:
  - { kind: false-friend, text: "ОДНО СЛОВО НА ДОПРОС И НА ПРОСЛУШИВАНИЕ. Przesłuchanie собрано из prze- и słuchać, то есть буквально «прослушивание», и это значение у него есть: przesłuchanie do roli — кастинг. Но первое и самое частое — ДОПРОС: przesłuchanie świadka, przesłuchanie podejrzanego. Русский держит для этого два разных слова, польский обходится одним, и различает их только контекст." }
  - { kind: usage, text: "Родительный множественного — przesłuchań, с мягким ń и без окончания. Так ведут себя все отглагольные существительные на -anie и -enie: zebranie даёт zebrań, spotkanie — spotkań, powiadomienie — powiadomień. Форм у таких слов восемь, а не десять: именительный совпадает с винительным, а родительный единственного — с именительным множественного." }
  - { kind: pronunciation, text: "Четыре слога, ударение на предпоследнем: prze-słu-CHA-nie, «пшэсуха́не». rz после p звучит как ш, ł как короткое у, ch как х." }
collocations:
  - { pl: "przesłuchanie świadka", ru: "допрос свидетеля" }
  - { pl: "iść na przesłuchanie", ru: "идти на прослушивание" }
  - { pl: "protokół przesłuchania", ru: "протокол допроса" }
family:
  - { pl: "przesłuchać", ru: "допросить; прослушать", relation: aspect, id: przesluchac }
  - { pl: "słuchać", ru: "слушать", relation: root, id: sluchac }
  - { pl: "wysłuchać", ru: "выслушать", relation: derived, id: wysluchac }
etymology: "Приставка prze- плюс słuchać «слушать», от того же корня, что русские «слушать» и «слух». Русское «прослушивание» собрано ровно так же, и в значении кастинга слова совпадают. Значение «допрос» выросло уже в польском: допрашивать значит выслушивать по порядку. Отсюда przesłuchać, wysłuchać и posłuch."
memory: "przesłuchanie — это и «допрос», и «прослушивание». Корень знакомый: słuchać это «слушать», и русское «прослушивание» собрано из тех же частей. Только в польском то же слово работает и в полиции: przesłuchanie świadka."
idioms:
