# review
id: wirus
format: 2
lemma: "wirus"
rank: 1808
pos: noun
pron: { cyr: "ви́рус" }
senses:
  - id: virus-bio
    ru: "вирус (биологический)"
    examples:
      - pl: "Wirus zaczyna mutować."
        ru: "Вирус начинает мутировать."
        source: { kind: translated, id: 8524335 }
      - pl: "Krąży nowy wirus grypy."
        ru: "Ходит новый вирус гриппа."
        source: { kind: translated, id: 4328205 }
      - pl: "Wirus dostał się do organizmu przez nos."
        ru: "Вирус попал в организм через нос."
        source: { kind: translated, id: 11517533 }
  - id: virus-computer
    ru: "вирус (компьютерный)"
    examples:
      - pl: "Wirus zainfekował komputer Toma."
        ru: "Вирус заразил компьютер Тома."
        source: { kind: translated, id: 12470618 }
      - pl: "Komputer ma wirusa."
        ru: "У компьютера вирус."
        source: { kind: translated, id: 12189345 }
      - pl: "Jak chronić komputer przed wirusami?"
        ru: "Как защитить компьютер от вирусов?"
        source: { kind: translated, id: 3766234 }
notes:
  - { kind: usage, text: "Одно слово покрывает оба значения, как и русское «вирус»: wirus grypy «вирус гриппа», wirus komputerowy «компьютерный вирус»." }
  - { kind: government, text: "Заразиться вирусом — zarazić się wirusem (творительный падеж); защита от вирусов — ochrona przed wirusami." }
  - { kind: usage, text: "В разговорной речи винительный падеж часто совпадает с родительным: mieć wirusa «иметь вирус», как у одушевлённых." }
  - { kind: false-friend, text: "Слово заимствовано из латыни обоими языками и совпадает почти во всём, включая ударение на первом слоге." }
collocations:
  - { pl: "wirus grypy", ru: "вирус гриппа" }
  - { pl: "wirus komputerowy", ru: "компьютерный вирус" }
  - { pl: "zarazić się wirusem", ru: "заразиться вирусом" }
family:
  - { pl: "wirusowy", ru: "вирусный", relation: root }
  - { pl: "antywirus", ru: "антивирус", relation: root }
  - { pl: "choroba", ru: "болезнь", relation: root, id: choroba }
etymology: "Из латинского virus «яд, слизь», заимствованного обоими языками в XIX веке. Русское «вирус» — то же слово с тем же ударением."
memory: "wirus — «вирус», и биологический, и компьютерный: wirus grypy, wirus komputerowy. Заразиться — zarazić się wirusem, творительный падеж."
idioms:
  - { pl: "wirus komputerowy", ru: "компьютерный вирус" }
  - { pl: "wirus grypy", ru: "вирус гриппа" }
  - { pl: "zarazić się wirusem", ru: "заразиться вирусом" }
