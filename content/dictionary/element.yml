notes:
  - { kind: pronunciation, text: "Предложный падеж — W ELEMENCIE, с переходом t в ci. Твёрдое t перед окончанием -e в польском не удерживается никогда: brat — o bracie, student — o studencie, kot — o kocie, świat — na świecie. Русскому тут подсказки нет, у нас «в элементе» и «о брате» звучат с обычным т, и форма с ci кажется чужой, пока не заметишь правило." }
  - { kind: usage, text: "Родительный — ELEMENTU, с окончанием -u, как у большинства неодушевлённых мужских с отвлечённым значением. В разговорной речи у слова есть ещё пренебрежительное значение: PODEJRZANY ELEMENT — это подозрительная личность, причём говорят так и о человеке, и о компании людей. Русское «элемент» в этом смысле тоже встречается, но звучит заметно старомоднее." }
collocations:
  - { pl: "element konstrukcji", ru: "элемент конструкции" }
  - { pl: "element zaskoczenia", ru: "элемент неожиданности" }
  - { pl: "podstawowy element", ru: "основной элемент" }
family:
  - { pl: "elementarny", ru: "элементарный", relation: derived }
  - { pl: "elementarz", ru: "букварь", relation: derived }
  - { pl: "elementarnie", ru: "элементарно", relation: derived }
etymology: "Из латинского elementum «первооснова, стихия», слова самого по себе тёмного происхождения. Оба языка взяли его из учёной латыни и сохранили значение составной части. Любопытно производное: польский ELEMENTARZ — это букварь, то есть книга первооснов, а русский для той же книги выбрал первую букву азбуки."
memory: "Предложный с мягким ci: w elemencie, как o bracie и o studencie. Твёрдое t перед -e не живёт."
