        ru: "Я человек."
        source: { kind: tatoeba, id: 951230 }
  - id: person
    ru: "человек, кто-то; люди (мн. ч. ludzie)"
    examples:
      - pl: "Nie znam tego człowieka."
        ru: "Я не знаю этого человека."
        source: { kind: tatoeba, id: 12567519 }
      - pl: "Na ulicy było wielu ludzi."
        ru: "На улице было много людей."
        source: { kind: tatoeba, id: 3410639 }
      - pl: "Ludzie to ludzie."
        ru: "Люди есть люди."
        source: { kind: tatoeba, id: 13715721 }
notes:
  - { kind: usage, text: "Множественное число супплетивное: człowiek → ludzie, ludzi, ludźmi — ровно как русское «человек → люди, людьми»." }
collocations:
  - { pl: "młody człowiek", ru: "молодой человек" }
  - { pl: "dobry człowiek", ru: "хороший человек" }
etymology: "Общеславянское *čelověkъ; слово есть только в славянских языках, и русское «человек» — то же самое."
memory: "Множественное число берётся от другого корня, как и в русском: człowiek → ludzie («человек → люди»). Запомните формы ludzi «людей» и ludźmi «людьми»."
idioms:
  - { pl: "człowiek czynu", ru: "человек дела" }
  - { pl: "wyjść na ludzi", ru: "выбиться в люди" }
  - { pl: "człowiek człowiekowi wilkiem", ru: "человек человеку волк" }
