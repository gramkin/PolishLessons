lemma: "wędlina"
rank: 5449
pos: noun
pron: { cyr: "вэндли́на" }
senses:
  - id: cold-cuts
    ru: "колбасные изделия, мясная нарезка"
    examples:
      - pl: "Kupiłem wędlinę na kanapki."
        ru: "Я купил колбасу на бутерброды."
        source: { kind: authored }
      - pl: "Ta wędlina jest świeża."
        ru: "Эта колбаса свежая."
        source: { kind: authored }
      - pl: "W sklepie brakuje wędliny."
        ru: "В магазине не хватает колбасных изделий."
        source: { kind: authored }
  - id: smoked-meat
    ru: "копчёности"
    examples:
      - pl: "Na stole leżały wędliny i sery."
        ru: "На столе лежали копчёности и сыры."
        source: { kind: authored }
      - pl: "Sami robią wędliny."
        ru: "Они сами делают копчёности."
        source: { kind: authored }
notes:
  - { kind: government, text: "Женский род. Во множественном числе wędliny значит «мясные деликатесы, копчёности» как категория товара." }
  - { kind: false-friend, text: "Точного русского однословного соответствия нет: это собирательное название для колбас, ветчины и копчёностей — того, что лежит в отделе «мясная гастрономия»." }
  - { kind: usage, text: "Корень wędzić «коптить», поэтому в основе слова именно копчение." }
  - { kind: usage, text: "В корпусе слово не встречается, поэтому все примеры составлены вручную." }
collocations:
  - { pl: "świeża wędlina", ru: "свежая колбаса" }
  - { pl: "wędliny i sery", ru: "копчёности и сыры" }
etymology: "От wędzić «коптить»; слово описывает именно копчёные мясные изделия."
memory: "wędlina — собирательное «колбасы и копчёности», от wędzić «коптить». Одного русского слова для этого нет."
idioms:
  - { pl: "wędliny i sery", ru: "копчёности и сыры" }
formExamplesSkip:
  - { form: "wędlino", reason: "звательная форма живёт там, где есть к кому обратиться: к человеку, к родине, к судьбе. К этому слову обращаться не к кому, и в речи такой формы не услышишь" }
