notes:
  - { kind: government, text: "Женский род. Во множественном числе wędliny значит «мясные деликатесы, копчёности» как категория товара." }
  - { kind: false-friend, text: "Точного русского однословного соответствия нет: это собирательное название для колбас, ветчины и копчёностей — того, что лежит в отделе «мясная гастрономия»." }
  - { kind: usage, text: "Корень wędzić «коптить», поэтому в основе слова именно копчение." }
  - { kind: usage, text: "В корпусе слово не встречается, поэтому все примеры составлены вручную." }
