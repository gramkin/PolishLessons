# review
id: dzielic
format: 2
lemma: "dzielić"
rank: 1570
pos: verb
pron: { cyr: "дзе́лиць" }
senses:
  - id: divide
    ru: "делить (на части)"
    examples:
      - pl: "Rzeka dzieli miasto na dwie części."
        ru: "Река делит город на две части."
        source: { kind: authored }
      - pl: "Dzielimy koszty na trzech."
        ru: "Мы делим расходы на троих."
        source: { kind: authored }
      - pl: "Dzielono ziemię między synów."
        ru: "Землю делили между сыновьями."
        source: { kind: authored }
  - id: share
    ru: "делить с кем-л., делиться"
    examples:
      - pl: "Dzielę pokój z bratem."
        ru: "Я делю комнату с братом."
        source: { kind: authored }
      - pl: "Chętnie dzielę się tym, co mam."
        ru: "Я охотно делюсь тем, что имею."
        source: { kind: authored }
  - id: separate
    ru: "разделять (о различиях, расстоянии)"
    examples:
      - pl: "Dzieli nas dziesięć lat."
        ru: "Нас разделяет десять лет."
        source: { kind: authored }
      - pl: "Dzielące nas różnice są drobne."
        ru: "Разделяющие нас различия мелкие."
        source: { kind: authored }
  - id: arithmetic
    ru: "dzielenie — деление (арифметика)"
    examples:
      - pl: "Dzielenie uczymy się w drugiej klasie."
        ru: "Делению мы учимся во втором классе."
        source: { kind: authored }
      - pl: "Dzielenie przez zero jest niemożliwe."
        ru: "Деление на ноль невозможно."
        source: { kind: authored }
notes:
  - { kind: government, text: "Три разные схемы, и одна расходится с русским. Делить НА части — na z винительным, как по-русски: dzielić na części. Делиться чем-то с кем-то — dzielić się CZYMŚ Z KIMŚ, тоже как по-русски. Но в АРИФМЕТИКЕ поляки делят PRZEZ: dziesięć dzielone przez dwa, тогда как по-русски «десять делить НА два». Предлог приходится менять." }
  - { kind: false-friend, text: "Ловушки в значении нет: dzielić — то же праславянское *děliti, что русское «делить», и из того же гнезда dział «отдел», podział «раздел», dola «доля». Совершенная пара — podzielić, у которой своя карточка." }
  - { kind: usage, text: "Третье значение, «разделять», часто идёт без подлежащего-человека: dzieli nas wiek «нас разделяет возраст», niewiele go dzieliło od zwycięstwa «немного отделяло его от победы». Это обычный польский оборот, и калькировать его русским «делить» нельзя — нужно «разделять, отделять»." }
  - { kind: pronunciation, text: "Вид несовершенный, поэтому у глагола ЕСТЬ причастия настоящего времени (uprawiający, dzielący) и деепричастие на -ąc (uprawiając, dzieląc), но НЕТ формы на -wszy: она бывает только у совершенного вида. По этому признаку вид можно узнать прямо по списку форм." }
collocations:
  - { pl: "dzielić na części", ru: "делить на части" }
  - { pl: "dzielić się czymś", ru: "делиться чем-л." }
  - { pl: "dzielić pokój z kimś", ru: "делить комнату с кем-л." }
family:
  - { pl: "podzielić", ru: "поделить, разделить", relation: aspect, id: podzielic }
  - { pl: "dział", ru: "отдел, раздел", relation: root }
  - { pl: "dzielny", ru: "храбрый, расторопный", relation: derived }
etymology: "Праславянское *děliti, от *dělъ «часть, доля» — то же слово, что русское «делить», и из того же гнезда «доля», «отдел», «предел». Польский развил на нём и dzielny «храбрый» (изначально «способный, дельный»), что русскому уху уже не подсказывает ничего, зато dział и podział соответствуют «отделу» и «разделу» точно."
memory: "dzielić — «делить», то же праславянское слово. Запомните арифметику: по-польски делят PRZEZ (dzielone przez dwa), а по-русски «на». И оборот dzieli nas wiek значит «нас разделяет возраст»."
idioms:
  - { pl: "dziel i rządź", ru: "разделяй и властвуй" }
  - { pl: "dzielić włos na czworo", ru: "придираться к мелочам" }
