# review
id: trasa
format: 2
lemma: "trasa"
rank: 2057
pos: noun
pron: { cyr: "тра́са" }
senses:
  - id: route
    ru: "маршрут, трасса"
    examples:
      - pl: "To jest najszybsza trasa."
        ru: "Это самый быстрый маршрут."
        source: { kind: translated, id: 12247468 }
      - pl: "Czy to jest bezpośrednia trasa?"
        ru: "Это прямой маршрут?"
        source: { kind: translated, id: 12247467 }
      - pl: "Ta trasa poprowadzi cię do stacji."
        ru: "Этот маршрут выведет тебя к вокзалу."
        source: { kind: translated, id: 12247486 }
      - pl: "Którą trasą pojechał?"
        ru: "Каким маршрутом он поехал?"
        source: { kind: translated, id: 12247470 }
      - pl: "Zaplanowałam naszą trasę."
        ru: "Я спланировала наш маршрут."
        source: { kind: translated, id: 12247466 }
      - pl: "Do jakich miejsc prowadzi ta trasa?"
        ru: "В какие места ведёт этот маршрут?"
        source: { kind: translated, id: 612964 }
  - id: on-tour
    ru: "в дороге, на гастролях (w trasie)"
    examples:
      - pl: "Wkrótce powinniśmy być znowu w trasie."
        ru: "Скоро мы снова должны быть в пути."
        source: { kind: translated, id: 3931699 }
      - pl: "Nasz zespół był w trasie przez trzy miesiące."
        ru: "Наша группа была на гастролях три месяца."
        source: { kind: translated, id: 3931700 }
      - pl: "Doszło dziś do zderzenia na trasie 66."
        ru: "Сегодня на трассе 66 произошло столкновение."
        source: { kind: translated, id: 936288 }
notes:
  - { kind: usage, text: "Оборот być w trasie значит «быть в пути», а у музыкантов — «быть на гастролях»." }
  - { kind: usage, text: "Ехать каким-либо маршрутом — jechać trasą, с творительным падежом: pojadę najkrótszą trasą." }
  - { kind: usage, text: "Рядом с карточкой droga: droga — дорога вообще, trasa — проложенный маршрут или магистраль." }
collocations:
  - { pl: "w trasie", ru: "в пути, на гастролях" }
  - { pl: "najkrótsza trasa", ru: "кратчайший маршрут" }
  - { pl: "zmienić trasę", ru: "изменить маршрут" }
etymology: "Из французского trace «след, черта» через немецкий Trasse. Русское «трасса» — то же заимствование, поэтому слова совпадают и по звучанию, и по смыслу."
memory: "trasa — «маршрут, трасса». Ехать маршрутом — творительный: pojadę najkrótszą trasą. А być w trasie — «быть в пути» или «на гастролях»."
idioms:
  - { pl: "w trasie", ru: "в пути, на гастролях" }
  - { pl: "najkrótsza trasa", ru: "кратчайший маршрут" }
  - { pl: "zmienić trasę", ru: "изменить маршрут" }
