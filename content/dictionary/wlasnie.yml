# review
id: wlasnie
format: 2
lemma: "właśnie"
rank: 118
pos: adv
pron: { cyr: "вла́сьне" }
senses:
  - id: exactly
    ru: "именно, вот именно (подтверждение)"
    examples:
      - pl: "Właśnie!"
        ru: "Именно!"
        source: { kind: tatoeba, id: 525772 }
      - pl: "Właśnie o to mi chodzi."
        ru: "Именно это я и имею в виду."
        source: { kind: authored }
      - pl: "Właśnie dlatego wyszedłem."
        ru: "Именно поэтому я ушёл."
        source: { kind: authored }
  - id: just-now
    ru: "только что, как раз сейчас"
    note: "С прошедшим временем — «только что», с настоящим — «как раз»."
    examples:
      - pl: "Właśnie wstałem."
        ru: "Я только что встал."
        source: { kind: tatoeba, id: 1355008 }
      - pl: "Właśnie ugryzł mnie komar."
        ru: "Меня только что укусил комар."
        source: { kind: tatoeba, id: 451081 }
      - pl: "Właśnie zostałem dziadkiem."
        ru: "Я только что стал дедушкой."
        source: { kind: tatoeba, id: 8664425 }
notes:
  - { kind: usage, text: "Перевод зависит от времени глагола: Właśnie wstałem «Я только что встал», но Właśnie robię kolację «Я как раз готовлю ужин»." }
  - { kind: usage, text: "Отдельное Właśnie! — согласие: «Вот именно!». Właśnie że tak — упрямое «а вот и да»." }
collocations:
  - { pl: "no właśnie", ru: "вот именно" }
  - { pl: "właśnie dlatego", ru: "именно поэтому" }
  - { pl: "właśnie teraz", ru: "как раз сейчас" }
etymology: "От własny «собственный»: исходно «в собственном смысле, собственно» — отсюда значение «именно»."
memory: "Три перевода по контексту: «именно» (Właśnie!), «только что» (Właśnie wstałem) и «как раз» (Właśnie robię kolację). Родственно własny — ср. русское «собственно говоря»."
idioms:
  - { pl: "no właśnie", ru: "вот именно" }
  - { pl: "właśnie że tak", ru: "а вот и да" }
  - { pl: "właśnie miałem to zrobić", ru: "я как раз собирался это сделать" }
formExamples:
  - form: "właśnie"
    pl: "Właśnie robię kolację."
    ru: "Я как раз готовлю ужин."
    source: { kind: tatoeba, id: 6109618 }
  - form: "właśnie"
    pl: "Właśnie ją odprowadziliśmy."
    ru: "Мы только что её проводили."
    source: { kind: tatoeba, id: 350119 }
  - form: "właśnie"
    pl: "Właśnie wszystko usunąłem."
    ru: "Я только что всё удалил."
    source: { kind: tatoeba, id: 13785396 }
