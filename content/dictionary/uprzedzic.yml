# review
id: uprzedzic
format: 2
lemma: "uprzedzić"
rank: 4493
pos: verb
pron: { cyr: "упшэ́дзиць" }
senses:
  - id: warn
    ru: "предупредить (заранее)"
    examples:
      - pl: "Uprzedź mnie, jeśli się spóźnisz."
        ru: "Предупреди меня, если опоздаешь."
        source: { kind: authored }
      - pl: "Nikt nas nie uprzedził o remoncie."
        ru: "Никто не предупредил нас о ремонте."
        source: { kind: authored }
      - pl: "Lekarz uprzedził, że będzie bolało."
        ru: "Врач предупредил, что будет больно."
        source: { kind: authored }
  - id: forestall
    ru: "опередить; настроить против (uprzedzić się — предубедиться)"
    examples:
      - pl: "Uprzedził moje pytanie."
        ru: "Он опередил мой вопрос."
        source: { kind: authored }
      - pl: "Uprzedziła się do niego po pierwszym spotkaniu."
        ru: "После первой встречи у неё сложилось к нему предубеждение."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "UPRZEDZIĆ — «предупредить», и русскому «упредить» родственно: оба значат «опередить». Но польское главное — «предупредить заранее»: UPRZEDŹ MNIE. UPRZEDZENIA — «предрассудки, предубеждения»: MIEĆ UPRZEDZENIA DO KOGOŚ. «Предупредить об опасности» с угрозой — OSTRZEC." }
  - { kind: usage, text: "Пятьдесят три формы — подпись переходного глагола совершенного вида: страдательное UPRZEDZONY и деепричастие UPRZEDZIWSZY. UPRZEDZONY — ещё и «предубеждённый»: JEST DO MNIE UPRZEDZONY. Чередование DZ → DZ: UPRZEDZĘ, UPRZEDZĄ. Видовой партнёр — UPRZEDZAĆ." }
  - { kind: government, text: "Кого — винительный, о чём — O с местным: UPRZEDZIĆ KOGOŚ O ZMIANIE. С придаточным — ŻE: UPRZEDZIĆ, ŻE. Предубеждение к кому — DO с родительным: UPRZEDZIĆ SIĘ DO SĄSIADÓW." }
  - { kind: pronunciation, text: "Читается «упшэ́дзиць», три слога, ударение на предпоследнем. PRZ — «пш», E — «э», DZI — мягкое «дзи». Конечное Ć — «ць». UPRZEDŹ — «у́пшэдзь»." }
  - { kind: register, text: "Вежливое и нейтральное слово: UPRZEDZAM, ŻE — частая формула в объявлениях и разговорах. UPRZEDZENIA RASOWE — «расовые предрассудки» — книжное. Опасность — OSTRZEC, OSTRZEŻENIE." }
collocations:
  - { pl: "uprzedzić o zmianie", ru: "предупредить об изменении" }
  - { pl: "uprzedzić czyjeś pytanie", ru: "опередить чей-то вопрос" }
  - { pl: "mieć uprzedzenia", ru: "иметь предубеждения" }
family:
  - { pl: "uprzedzać", ru: "предупреждать", relation: aspect }
  - { pl: "przed", ru: "перед", relation: root, id: przed }
  - { pl: "ostrzec", ru: "предостеречь", relation: root, id: ostrzec }
etymology: "Приставка U- плюс PRZEDZIĆ, от PRZED «перед»: буквально «стать впереди». Русское «упредить» — то же слово; «предупредить» строится с двумя приставками."
memory: "Uprzedzić — предупредить заранее: uprzedź mnie. Uprzedził moje pytanie — опередил. Uprzedzenia — предрассудки. Опасность — ostrzec. Читается «упшэ́дзиць»."
idioms:
  - { pl: "uprzedzić fakty", ru: "забегать вперёд" }
