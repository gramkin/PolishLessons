# review
id: fakt
format: 2
lemma: "fakt"
rank: 772
pos: noun
pron: { cyr: "факт" }
senses:
  - id: fact
    ru: "факт, то, что действительно произошло"
    examples:
      - pl: "To fakt."
        ru: "Это факт."
        source: { kind: tatoeba, id: 5369956 }
      - pl: "Ten fakt dowodzi jej niewinności."
        ru: "Этот факт доказывает её невиновность."
        source: { kind: tatoeba, id: 726656 }
      - pl: "Ten fakt nie może zostać zapomniany."
        ru: "Этот факт не должен быть забыт."
        source: { kind: tatoeba, id: 1181224 }
  - id: the-facts
    ru: "факты, действительное положение дел"
    examples:
      - pl: "Fakty nie przestaną istnieć z powodu ich ignorowania."
        ru: "Факты не исчезают из-за того, что их игнорируют."
        source: { kind: tatoeba, id: 874443 }
      - pl: "A jednak sam fakt może się wydać błahy."
        ru: "И всё же сам факт может показаться пустяковым."
        source: { kind: authored }
      - pl: "Lecz fakty są faktami."
        ru: "Но факты есть факты."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Латинское factum «сделанное», от facere «делать». Русское «факт» — то же заимствование, поэтому слово узнаётся сразу." }
  - { kind: usage, text: "Faktem jest, że… — «Дело в том, что…», очень частый зачин." }
  - { kind: usage, text: "stawiać kogoś przed faktem dokonanym — «ставить перед свершившимся фактом»." }
  - { kind: usage, text: "nagi fakt и goły fakt оба значат «голый факт», то есть без объяснений и оценок." }
collocations:
  - { pl: "faktem jest, że", ru: "дело в том, что" }
  - { pl: "fakt dokonany", ru: "свершившийся факт" }
  - { pl: "stawić czoła faktom", ru: "взглянуть фактам в лицо" }
  - { pl: "nagi fakt", ru: "голый факт" }
etymology: "Латинское factum «сделанное», от facere «делать». Русское «факт» — то же самое заимствование."
memory: "fakt — «факт», слово международное и потому лёгкое. Стоит запомнить три оборота: Faktem jest, że… «Дело в том, что…», fakt dokonany «свершившийся факт» (stawiać kogoś przed faktem dokonanym) и stawić czoła faktom «взглянуть фактам в лицо»."
idioms:
  - { pl: "faktem jest, że", ru: "дело в том, что" }
  - { pl: "fakt dokonany", ru: "свершившийся факт" }
  - { pl: "stawić czoła faktom", ru: "взглянуть фактам в лицо" }
formExamplesSkip:
  - { form: "fakcie", cell: "Звательный", reason: "звательный падеж: для неодушевлённого существительного он практически не употребляется" }
