# review
id: mamusia
format: 2
lemma: "mamusia"
rank: 1280
pos: noun
pron: { cyr: "маму́ся" }
senses:
  - id: mummy
    ru: "мамочка (ласкательное от mama)"
    examples:
      - pl: "Mamusia płakała."
        ru: "Мамочка плакала."
        source: { kind: translated, id: 6160700 }
      - pl: "Mamusia pracuje."
        ru: "Мамочка работает."
        source: { kind: translated, id: 7184654 }
      - pl: "Gdzie jest moja mamusia?"
        ru: "Где моя мамочка?"
        source: { kind: translated, id: 3872105 }
  - id: childs-speech
    ru: "в детской речи и в обращении"
    examples:
      - pl: "To twoja mamusia?"
        ru: "Это твоя мамочка?"
        source: { kind: translated, id: 7184633 }
      - pl: "Pomogłem mamusi w kuchni."
        ru: "Я помог мамочке на кухне."
        source: { kind: translated, id: 3687206 }
      - pl: "Seler mi nie smakuje, ale muszę go jeść, gdyż moja mamusia ciągle powtarza, że jest warzywem pełnym witamin."
        ru: "Сельдерей мне не нравится, но я должен его есть, ведь мамочка всё время повторяет, что это овощ."
        source: { kind: translated, id: 10905010 }
notes:
  - { kind: register, text: "Ласкательная форма от mama «мама», как русское «мамочка». Звучит по-детски или очень тепло; нейтральное слово — mama, официальное — matka." }
  - { kind: usage, text: "Ряд уменьшительных длинный: mama, mamusia, mamunia, mamcia. Все они мягче и теплее исходного." }
  - { kind: usage, text: "Звательный падеж — Mamusiu!: Mamusiu, chodź tu! «Мамочка, иди сюда!»." }
  - { kind: pronunciation, text: "si звучит мягко, «сь»: маму́ся. Ударение на предпоследний слог." }
collocations:
  - { pl: "moja mamusia", ru: "моя мамочка" }
  - { pl: "kochana mamusia", ru: "любимая мамочка" }
  - { pl: "mamusiu", ru: "мамочка (обращение)" }
etymology: "Уменьшительное от mama с суффиксом -usia, тем же, что в tatuś. Русское «мамочка» построено тем же способом, только с другим суффиксом."
memory: "mamusia — «мамочка», ласкательное от mama. Звательный падеж — Mamusiu! Ряд уменьшительных длинный: mama, mamusia, mamunia. Нейтральное слово — mama, официальное — matka."
