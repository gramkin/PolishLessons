# review
id: czyj
format: 2
lemma: "czyj"
rank: 1635
pos: pron
pron: { cyr: "чый" }
senses:
  - id: whose
    ru: "чей (вопрос о владельце)"
    examples:
      - pl: "Czyj to ołówek?"
        ru: "Чей это карандаш?"
        source: { kind: tatoeba, id: 709266 }
      - pl: "Czyja kolej?"
        ru: "Чья очередь?"
        source: { kind: tatoeba, id: 12569825 }
      - pl: "Czyje to piwo?"
        ru: "Чьё это пиво?"
        source: { kind: tatoeba, id: 4869587 }
  - id: whose-embedded
    ru: "чей (в придаточном вопросе)"
    examples:
      - pl: "Wiesz, czyje to książki?"
        ru: "Ты знаешь, чьи это книжки?"
        source: { kind: tatoeba, id: 13045921 }
      - pl: "Po czyjej jesteś stronie?"
        ru: "На чьей ты стороне?"
        source: { kind: tatoeba, id: 3749802 }
      - pl: "Czyim synem jesteś?"
        ru: "Чей ты сын?"
        source: { kind: translated, id: 2196538 }
notes:
  - { kind: usage, text: "Склоняется как прилагательное и согласуется с предметом, а не с владельцем: czyja książka «чья книга», czyje auto «чья машина» — ровно как русское «чей»." }
  - { kind: usage, text: "Чаще всего в обороте Czyj to jest…? или коротко Czyj to…?: Czyj to rower? «Чей это велосипед?»" }
  - { kind: government, text: "После предлога падеж задаёт предлог: po czyjej stronie «на чьей стороне», z czyim psem «с чьей собакой»." }
  - { kind: false-friend, text: "Не путайте czyj «чей» с czy «ли, разве»: Czy to twoje? значит «Это твоё?», а Czyje to? — «Чьё это?»" }
collocations:
  - { pl: "czyj to?", ru: "чей это?" }
  - { pl: "czyja kolej", ru: "чья очередь" }
  - { pl: "po czyjej stronie", ru: "на чьей стороне" }
family:
  - { pl: "kto", ru: "кто", relation: root, id: kto }
  - { pl: "mój", ru: "мой", relation: root, id: moj }
  - { pl: "twój", ru: "твой", relation: root, id: twoj }
etymology: "Праславянское *čьjь — то же слово, что русское «чей», и склоняется оно так же."
memory: "czyj — «чей», и ведёт себя точно как русское: согласуется с предметом (czyja książka, czyje auto), а не с владельцем. Не путайте с czy «ли»."
idioms:
