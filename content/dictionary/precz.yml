etymology: "От праславянского *perčь «поперёк, против» — того же корня, что PRZECZYĆ «отрицать» и русское «прочь», «перечить». Изначально «в сторону, наперекор»."
memory: "Precz — прочь: precz stąd! В лозунгах precz z + творительный — «долой»: precz z wojną!"
idioms:
