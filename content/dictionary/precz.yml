# review
id: precz
format: 2
lemma: "precz"
rank: 3991
pos: interj
pron: { cyr: "прэч" }
senses:
  - id: away
    ru: "прочь!, вон!"
    examples:
      - pl: "Precz stąd!"
        ru: "Прочь отсюда!"
        source: { kind: authored }
      - pl: "Precz z moich oczu!"
        ru: "Прочь с глаз моих!"
        source: { kind: authored }
      - pl: "Idź precz!"
        ru: "Иди прочь!"
        source: { kind: authored }
  - id: down-with
    ru: "PRECZ Z — долой (лозунг)"
    examples:
      - pl: "Precz z wojną!"
        ru: "Долой войну!"
        source: { kind: authored }
      - pl: "Demonstranci krzyczeli: „Precz z rządem!”."
        ru: "Демонстранты кричали: «Долой правительство!»."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "PRECZ — «прочь», это одно и то же слово. Но в лозунгах PRECZ Z плюс творительный значит «долой»: PRECZ Z KOMUNĄ «долой коммуну». Русское «прочь с» звучит иначе, поэтому переводить надо «долой»." }
  - { kind: usage, text: "Неизменяемое слово. Употребляется как восклицание и как наречие при глаголах движения: IŚĆ PRECZ, ODEJŚĆ PRECZ, PRZEGNAĆ PRECZ «прогнать прочь». В быту чаще WYNOCHA! или IDŹ SOBIE!" }
  - { kind: government, text: "PRECZ Z плюс творительный: PRECZ Z WOJNĄ, PRECZ Z NIM. Откуда — Z или OD с родительным: PRECZ OD DRZWI «прочь от двери», PRECZ STĄD «прочь отсюда»." }
  - { kind: pronunciation, text: "Читается «прэч», один слог: E — «э», CZ — твёрдое «ч»." }
  - { kind: register, text: "Книжное, патетическое или шутливое слово. В лозунгах — нормальное; в быту звучит театрально: PRECZ, KOCIE! «брысь, кот!»." }
collocations:
