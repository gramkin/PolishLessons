notes:
  - { kind: pronunciation, text: "ДВА СУФФИКСА ВТОРИЧНОГО НЕСОВЕРШЕННОГО ВИДА, И НАСТОЯЩЕЕ ВРЕМЯ У НИХ РАЗНОЕ. Глаголы на -awać теряют -wa- и берут -aj-: podawać даёт podaję, podajesz; так же dawać — daję, wstawać — wstaję, sprzedawać — sprzedaję. Глаголы на -ywać и -ować берут -uj-: zatrzymywać даёт zatrzymuję, pracować — pracuję. Зная окончание неопределённой формы, настоящее время можно построить не угадывая." }
  - { kind: false-friend, text: "ЧЕСТНОЕ ПРЕДУПРЕЖДЕНИЕ: приставка совпадает, корень НЕТ. Zatrzymać похоже на «задержать» и значит то же самое, но польское trzymać «держать» и русское «держать» — РАЗНЫЕ корни, лишь случайно сошедшиеся по смыслу. Опереться на родной язык здесь не выйдет: trzymać придётся выучить отдельно. Зато приставка za- работает ровно как русская «за-»." }
  - { kind: government, text: "Задерживают КОГО или ЧТО — винительный: zatrzymać samochód, przechodnia, złodzieja. Возвратное zatrzymać się значит «остановиться», и место идёт через w или na с ПРЕДЛОЖНЫМ: zatrzymać się w hotelu, na stacji. Оборот zatrzymać się w hotelu совпадает с русским «остановиться в гостинице» до мелочей." }
  - { kind: usage, text: "Вид несовершенный, совершенная пара — zatrzymać: policja zatrzymywała samochody przez godzinę «полиция останавливала машины час», но zatrzymała jeden samochód «остановила одну машину». Существительное zatrzymanie — юридический термин «задержание»." }
  - { kind: register, text: "Proszę się zatrzymać — обычная формула полицейского и контролёра, вежливая и твёрдая. А zatrzymać coś dla siebie значит «оставить себе», без всякого оттенка кражи: zatrzymaj resztę «оставь сдачу себе»." }
collocations:
  - { pl: "zatrzymać się w hotelu", ru: "остановиться в гостинице" }
  - { pl: "proszę się zatrzymać", ru: "прошу остановиться" }
  - { pl: "zatrzymaj resztę", ru: "оставь сдачу себе" }
family:
  - { pl: "zatrzymać", ru: "остановить, задержать", relation: aspect, id: zatrzymac }
  - { pl: "trzymać", ru: "держать", relation: root, id: trzymac }
  - { pl: "zatrzymanie", ru: "задержание", relation: derived }
etymology: "Приставка za- плюс trzymać «держать». Сложение в точности повторяет русское «за-держать», и значение то же, но корни у trzymać и «держать» разные: сходство здесь смысловое, а не родственное. Отсюда zatrzymanie «задержание» и przytrzymać «придержать»."
memory: "zatrzymywać — «останавливать, задерживать». Настоящее время по типу -ywać: zatrzymuję, zatrzymujesz. И не ищите родства: trzymać значит «держать», но русскому «держать» оно не родня — совпадение только по смыслу."
idioms:
  - { pl: "zatrzymać się w hotelu", ru: "остановиться в гостинице" }
  - { pl: "zatrzymaj to dla siebie", ru: "оставь это при себе" }
