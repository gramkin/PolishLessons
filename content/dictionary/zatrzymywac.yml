  - id: detain
    ru: "задерживать (о полиции)"
    examples:
      - pl: "Zatrzymywano go już dwa razy."
        ru: "Его задерживали уже дважды."
        source: { kind: authored }
      - pl: "Zatrzymywani przechodnie pokazywali dokumenty."
        ru: "Задерживаемые прохожие показывали документы."
        source: { kind: authored }
  - id: keep
    ru: "оставлять себе, удерживать"
    examples:
      - pl: "Zatrzymuję zdjęcia na pamiątkę."
        ru: "Я оставляю фотографии на память."
        source: { kind: authored }
      - pl: "Zatrzymywanie cudzych rzeczy to kradzież."
        ru: "Удержание чужих вещей — кража."
