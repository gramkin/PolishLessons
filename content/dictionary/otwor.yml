notes:
  - { kind: false-friend, text: "Слово собрано от OTWIERAĆ «открывать»: отверстие это «то, что открыто». Русское «отверстие» устроено точно так же, от «отверзать», только глагол этот у нас давно ушёл в книги, и родство перестало быть слышным. В польском же OTWIERAĆ живёт каждый день: OTWÓRZ DRZWI значит «открой дверь». Отсюда и всё гнездо: OTWARTY «открытый», OTWARCIE «открытие», GODZINY OTWARCIA «часы работы»." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. В основе чередование Ó и O: OTWÓR, но OTWORU, OTWOREM, OTWORZE. Ó стоит только в той форме, где слог последний, и уходит, едва появляется окончание. Так же устроены MIÓD при MIODU и STÓŁ при STOŁU. В местном падеже R переходит в RZ: W OTWORZE." }
  - { kind: government, text: "Отверстие в чём-то — OTWÓR W CZYMŚ, местный падеж: OTWÓR W ŚCIANIE, OTWÓR W DACHU. Через отверстие — PRZEZ OTWÓR, предлог PRZEZ с винительным, как и по-русски «через». Просверлить отверстие — WYWIERCIĆ OTWÓR, винительный без предлога. В отверстии — W OTWORZE, местный с переходом R в RZ." }
  - { kind: pronunciation, text: "Читается «о́тфур», два слога, ударение на первом. Буква W после T оглушается и звучит «ф», поэтому получается «тф», а не «тв». Буква Ó даёт «у», отсюда «фур». В косвенных падежах Ó исчезает: OTWORU звучит «отво́ру», и W там уже не оглушается, потому что дальше идёт гласная." }
  - { kind: register, text: "Слово нейтральное и техническое. В строительстве это OTWÓR OKIENNY «оконный проём» и OTWÓR DRZWIOWY «дверной проём». В быту — OTWORY WENTYLACYJNE, которые чистят раз в год. В анатомии тоже своё: OTWÓR NOSOWY. Слово всегда про пустое место, через которое что-то проходит, и в этом оно уже совсем русское." }
collocations:
  - { pl: "otwór w ścianie", ru: "отверстие в стене" }
  - { pl: "wywiercić otwór", ru: "просверлить отверстие" }
  - { pl: "otwory wentylacyjne", ru: "вентиляционные отверстия" }
family:
  - { pl: "otwierać", ru: "открывать", relation: root, id: otwierac }
  - { pl: "otwarty", ru: "открытый", relation: derived }
  - { pl: "otwarcie", ru: "открытие", relation: derived }
etymology: "От глагола OTWIERAĆ «открывать», праславянского и того же, что русское «отворять» и «отверзать». Отверстие это буквально «открытое место». Русское слово собрано из тех же частей, только от книжного «отверзать», и потому родство у нас почти не чувствуется, а в польском оно на поверхности: OTWÓR стоит рядом с OTWÓRZ, «открой». Из того же гнезда идут OTWARTY и OTWARCIE."
memory: "Отверстие, проём, от otwierac «открывать» — то есть «открытое место». Наше «отверстие» собрано так же, от «отверзать», но тот глагол ушёл в книги, а польский otwierac живёт каждый день. Читается «о́тфур»: w после t оглушается в «ф», а o с черточкой даёт «у». Чередование как у miod: otwor, но otworu. В местном падеже r переходит в rz: w otworze."
idioms:
  - { pl: "otwór okienny", ru: "оконный проём" }
