notes:
  - { kind: false-friend, text: "Русское «ценный» по-польски бывает CENNY и WARTOŚCIOWY. CENNY чаще о дорогих вещах и времени: CENNY CZAS, CENNA BIŻUTERIA. WARTOŚCIOWY — о том, что имеет ценность по сути: WARTOŚCIOWA KSIĄŻKA, WARTOŚCIOWY CZŁOWIEK, WARTOŚCIOWE BIAŁKO, «полноценный белок». Ценные бумаги — PAPIERY WARTOŚCIOWE." }
  - { kind: usage, text: "Полная парадигма с простыми степенями: WARTOŚCIOWY, WARTOŚCIOWSZY, NAJWARTOŚCIOWSZY. Мужское-личное: WARTOŚCIOWI, WARTOŚCIOWSI, NAJWARTOŚCIOWSI — о ценных работниках, игроках." }
  - { kind: government, text: "Ценный для кого-то — WARTOŚCIOWY DLA KOGOŚ, DLA с родительным. Ставится и до, и после существительного: WARTOŚCIOWY PREZENT, PAPIERY WARTOŚCIOWE." }
  - { kind: pronunciation, text: "Читается «вартосьцьо́вы», четыре слога, ударение на предпоследнем. ŚCI — мягкое «сьць», CIO — «цьо». Сравните с WARTOŚĆ «ва́ртосьць»." }
  - { kind: register, text: "Нейтральное слово, частое в экономике, диетологии и рецензиях: PAPIERY WARTOŚCIOWE, WARTOŚCIOWE ŚNIADANIE, WARTOŚCIOWA LEKTURA. О человеке — серьёзная похвала." }
collocations:
  - { pl: "papiery wartościowe", ru: "ценные бумаги" }
  - { pl: "wartościowa rada", ru: "ценный совет" }
  - { pl: "wartościowe jedzenie", ru: "полезная, питательная еда" }
family:
  - { pl: "wartość", ru: "ценность, стоимость", relation: root, id: wartosc }
  - { pl: "cenny", ru: "ценный", relation: root, id: cenny }
  - { pl: "bezwartościowy", ru: "ничего не стоящий", relation: derived }
etymology: "От WARTOŚĆ «ценность», а то от WART «стоящий», заимствованного из средневерхненемецкого wert, «ценный». Современное немецкое Wert — «ценность». Польский оформил немецкий корень славянскими суффиксами: WART-OŚĆ, WARTOŚCI-OWY."
memory: "Wartościowy — ценный: wartościowy obraz, wartościowa rada; и достойный: wartościowy człowiek. Papiery wartościowe — ценные бумаги. Wartościowszy, najwartościowszy. Читается «вартосьцьо́вы»."
idioms:
  - { pl: "papiery wartościowe", ru: "ценные бумаги" }
