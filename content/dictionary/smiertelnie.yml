etymology: "От ŚMIERTELNY, а то — от ŚMIERĆ «смерть». Польское Ś на месте русского «с»: ŚMIERĆ — «смерть». Корень тот же, что в UMRZEĆ «умереть»."
memory: "Śmiertelnie — смертельно: śmiertelnie ranny, śmiertelnie nudny. Śmiertelnie poważnie — совершенно серьёзно. Читается «сьмерте́льне»."
