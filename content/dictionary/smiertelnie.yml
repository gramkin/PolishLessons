notes:
  - { kind: false-friend, text: "ŚMIERTELNIE — «смертельно», перевод прямой, и как усилитель тоже: ŚMIERTELNIE NUDNY, «смертельно скучный». Особый оборот — ŚMIERTELNIE POWAŻNIE, «совершенно серьёзно», без всякой угрозы жизни." }
  - { kind: usage, text: "Наречие. Формы сравнения формально есть, но на практике не употребляются. Чаще всего стоит перед прилагательным или причастием: ŚMIERTELNIE RANNY, ŚMIERTELNIE ZMĘCZONY." }
  - { kind: government, text: "Наречие ничем не управляет. Прилагательное ŚMIERTELNY значит и «смертельный», и «смертный»: ŚMIERTELNY WYPADEK, «несчастный случай со смертельным исходом», ZWYKŁY ŚMIERTELNIK, «простой смертный»." }
  - { kind: pronunciation, text: "Читается «сьмерте́льне», ударение на предпоследнем слоге. ŚMIE — «сьме», TE — твёрдое «тэ», L перед N мягкое." }
