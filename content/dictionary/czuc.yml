# review
id: czuc
format: 2
lemma: "czuć"
rank: 134
pos: verb
aspect: imperf
pron: { cyr: "чуць" }
senses:
  - id: feel-self
    ru: "czuć się — чувствовать себя (как)"
    note: "О самочувствии всегда с się: Jak się czujesz? «Как ты себя чувствуешь?»"
    examples:
      - pl: "Jak się czujesz?"
        ru: "Как ты себя чувствуешь?"
        source: { kind: tatoeba, id: 1109960 }
      - pl: "Dziś czuję się dobrze."
        ru: "Сегодня я хорошо себя чувствую."
        source: { kind: tatoeba, id: 597663 }
      - pl: "Marnie się czuję."
        ru: "Я плохо себя чувствую."
        source: { kind: tatoeba, id: 1772604 }
  - id: sense
    ru: "чувствовать, ощущать (что-либо)"
    examples:
      - pl: "Czuję zapach benzyny."
        ru: "Я чувствую запах бензина."
        source: { kind: tatoeba, id: 3366034 }
      - pl: "Czułam się jak idiotka."
        ru: "Я чувствовала себя идиоткой."
        source: { kind: tatoeba, id: 2765418 }
      - pl: "Czuję zimno w nogach."
        ru: "Я чувствую холод в ногах."
        source: { kind: authored }
  - id: smell
    ru: "пахнуть (безлично, с творительным падежом)"
    note: "Безличный оборот: Czuć dymem «Пахнет дымом» — деятеля нет, существительное в творительном."
    examples:
      - pl: "Czuć tu dymem."
        ru: "Здесь пахнет дымом."
        source: { kind: authored }
      - pl: "Od niego czuć perfumami."
        ru: "От него пахнет духами."
        source: { kind: authored }
      - pl: "W kuchni czuć świeżym chlebem."
        ru: "На кухне пахнет свежим хлебом."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Без się глагол значит «ощущать что-то»: Czuję zapach «Чувствую запах». С się — о самочувствии: Czuję się dobrze." }
  - { kind: government, text: "В безличном обороте о запахе существительное стоит в творительном падеже: Czuć gazem «Пахнет газом»." }
  - { kind: usage, text: "Совершенный вид — poczuć: Poczułem ból «Я почувствовал боль»." }
collocations:
  - { pl: "czuć się dobrze", ru: "хорошо себя чувствовать" }
  - { pl: "czuć zapach", ru: "чувствовать запах" }
  - { pl: "czuć się winnym", ru: "чувствовать себя виноватым" }
  - { pl: "dać się we znaki", ru: "дать о себе знать" }
etymology: "Праславянское *čuti «воспринимать»; тот же корень, что в русском «чуять» и «чувство», а также в польском czuwać «бодрствовать»."
memory: "Без się — «чувствовать что-то» (Czuję zapach), с się — «чувствовать себя» (Czuję się dobrze). И третий оборот, безличный: Czuć dymem «Пахнет дымом», с творительным падежом."
idioms:
  - { pl: "czuć coś przez skórę", ru: "чувствовать нутром" }
  - { pl: "czuć miętę do kogoś", ru: "быть неравнодушным к кому-то" }
  - { pl: "czuć się jak ryba w wodzie", ru: "чувствовать себя как рыба в воде" }
