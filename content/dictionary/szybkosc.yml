notes:
  - { kind: false-friend, text: "Русское «скорость» разошлось в польском на два слова, и выбирать между ними приходится по области. PRĘDKOŚĆ — слово дорожное и физическое: OGRANICZENIE PRĘDKOŚCI «ограничение скорости», PRZEKROCZYĆ PRĘDKOŚĆ «превысить скорость», и в физике это вектор. SZYBKOŚĆ шире и говорит о темпе вообще: SZYBKOŚĆ REAKCJI, SZYBKOŚĆ ŚWIATŁA, SZYBKOŚĆ PISANIA. В быту их часто путают и сами поляки, но на знаке у дороги всегда стоит PRĘDKOŚĆ." }
  - { kind: usage, text: "Шесть форм, обычный разряд женских существительных на -OŚĆ, суффикс отвечает русскому -ОСТЬ. Множественное число употребляется, когда речь о разных измеренных величинах: SZYBKOŚCI OBU POCIĄGÓW «скорости оба поездов». Прилагательное SZYBKI «быстрый» и наречие SZYBKO «быстро» в живой речи встречаются гораздо чаще самого существительного: SZYBKO значит «быстро» и слышится постоянно, а SZYBKOŚĆ остаётся техническим." }
  - { kind: government, text: "С какой скоростью — предлог Z с творительным: Z DUŻĄ SZYBKOŚCIĄ «с большой скоростью», как и по-русски. Скорость чего — родительный без предлога: SZYBKOŚĆ REAKCJI, SZYBKOŚĆ ŚWIATŁA. В чём измеряется — предлог W с местным падежом: W KILOMETRACH NA GODZINĘ. Прилагательное SZYBKI управления не имеет, но в сравнении берёт предлог OD с родительным: SZYBSZY OD ŚWIATŁA «быстрее света», где русский обходится родительным без предлога." }
  - { kind: pronunciation, text: "Читается «шы́бкосьчь», два слога, ударение на первом. Сочетание SZ даёт твёрдое «ш», а Y — «ы», поэтому начало слова «шы», и чтение «шибкость» через «и» будет неточным. Буква B перед K оглушается и звучит почти как «п», так что слышно «шыпкосьчь», хотя пишется B. Конец, -ŚĆ, это два мягких звука подряд, «сьчь». В наречии SZYBKO слышно «шы́бко»." }
  - { kind: register, text: "Слово техническое и нейтральное. Частые обороты: SZYBKOŚĆ ŚWIATŁA «скорость света», SZYBKOŚĆ REAKCJI «скорость реакции», Z DUŻĄ SZYBKOŚCIĄ «с большой скоростью», SZYBKOŚĆ POBIERANIA «скорость загрузки». В разговоре вместо существительного почти всегда скажут наречием: JEDŹ SZYBKO «едь быстро», SZYBCIEJ «быстрее». А на дорожных знаках и в правилах стоит только PRĘDKOŚĆ, и это стоит запомнить отдельно." }
