etymology: "От прилагательного SZYBKI «быстрый», от праславянского *šibъkъ, связанного с глаголом со значением «метать, бросать». У этого корня есть русские родственники, только они отошли на край языка: диалектное «шибкий» и наречие «шибко» в смысле «очень, быстро», а также «шибать», «ушиб» и, что неожиданно, «ошибка», то есть промах при броске. Польский оставил этот корень главным словом для быстроты, а русский заменил его на «быстрый» и сохранил старый только в словах с побочными значениями. Суффикс -OŚĆ при этом отвечает русскому -ОСТЬ."
memory: "Русская «скорость» делится на два польских слова: prędkość на дорожном знаке и в физике как вектор, szybkość о темпе вообще, szybkość reakcji. Корень szybki имеет русскую родню, но на краю языка: диалектное «шибко», а также «ушиб» и «ошибка», то есть промах при броске. Читается «шы́бкосьчь», где sz это «ш», y это «ы», а b перед k оглушается. В живой речи чаще нужно наречие szybko «быстро»."
