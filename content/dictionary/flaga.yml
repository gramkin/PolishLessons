etymology: "Из немецкого FLAGGE, и женский род польского слова идёт прямо оттуда. Немецкое слово, в свою очередь, пришло из нидерландского VLAG, а дальше его происхождение спорно: обычно его связывают с глаголом со значением «развеваться, хлопать». Русский «флаг» взят из нидерландского при Петре, напрямую с флота, и получил мужской род. Поэтому одно и то же слово в двух языках разошлось по родам, и это чистый след двух разных дорог заимствования, а не какого-либо правила. Польское SZTANDAR «знамя» пришло отдельно, из немецкого STANDARTE, и означает не то же: знамя воинское или организации, тогда как FLAGA есть флаг государственный или сигнальный."
memory: "Женского рода, в отличие от русского «флага»: ta flaga, polska flaga, biało-czerwona flaga. Причина в дороге заимствования: польский из немецкого Flagge, женского, а русский из нидерландского vlag. В дательном и местном g переходит в dz: na fladze, как w skardze и w usłudze. Знамя воинское — sztandar, другое слово."
idioms:
