notes:
  - { kind: false-friend, text: "Расхождение не в значении, а в роде, и для русского оно неожиданно: польская FLAGA — женского рода, а русский «флаг» — мужского. Поэтому по-польски говорят TA FLAGA, BIAŁO-CZERWONA FLAGA, и согласование всюду женское. Причина в пути заимствования: польский взял слово из немецкого FLAGGE, женского рода, а русский из голландского VLAG через мужскую форму. Поэтому фраза «польский флаг» будет POLSKA FLAGA, а не POLSKI FLAG, и ошибка в роде здесь слышна сразу." }
  - { kind: pronunciation, text: "Читается «фла́га», ударение на первом слоге из двух. Буква L мягкая, как всегда в польском, поэтому первый слог ближе к «фля», чем к «фла», хотя в транскрипции мы пишем «фла». Главное в карточке — дательный и местный падеж FLADZE, где G переходит в DZ: «фла́дзе». Это то же чередование, что в SKARGA и SKARDZE, USŁUGA и USŁUDZE, и в этой партии оно встречается дважды." }
  - { kind: government, text: "Женский род на -A, склонение правильное. Винительный на -Ę: WYWIESIĆ FLAGĘ «вывесить флаг». Под флагом — предлог POD с творительным: POD FLAGĄ, и русский строит это так же. Чей флаг — родительный без предлога или прилагательное: FLAGA POLSKI и FLAGA POLSKA означают одно, но второе частотнее. При отрицании винительный уходит в родительный: NIE WYWIESILI FLAGI. Родительный множественного FLAG без вставной гласной." }
  - { kind: usage, text: "Устойчивые сочетания: FLAGA NARODOWA «государственный флаг», FLAGA BIAŁO-CZERWONA, так в Польше называют собственный флаг по цветам, DZIEŃ FLAGI «день флага», отмечаемый второго мая. Вывешивание описывают глаголом WYWIESIĆ, спускание — OPUŚCIĆ: OPUŚCIĆ FLAGĘ DO POŁOWY MASZTU «опустить флаг до половины». Переносное употребление то же, что в русском: ISTNIEĆ POD FLAGĄ CZEGOŚ, PŁYWAĆ POD OBCĄ FLAGĄ «плавать под чужим флагом»." }
