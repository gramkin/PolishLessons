pron: { cyr: "дрэ́птаць" }
senses:
  - id: toddle
    ru: "семенить, идти мелкими шагами"
    examples:
      - pl: "Dziecko drepce obok matki."
        ru: "Ребёнок семенит рядом с матерью."
        source: { kind: authored }
      - pl: "Staruszka drepce do sklepu po bułki."
        ru: "Старушка семенит в магазин за булками."
        source: { kind: authored }
  - id: shift-about
    ru: "топтаться (на месте, от холода или нетерпения)"
    examples:
      - pl: "Drepcemy w miejscu na mrozie."
        ru: "Мы топчемся на месте на морозе."
        source: { kind: authored }
      - pl: "Ludzie drepczą przed kasą."
        ru: "Люди топчутся перед кассой."
        source: { kind: authored }
  - id: patter
    ru: "семенить, трусить (о животных, птицах)"
    examples:
      - pl: "Kurczaki dreptają po trawie."
        ru: "Цыплята семенят по траве."
        source: { kind: authored }
      - pl: "Pies drepta przy nodze gospodarza."
        ru: "Собака семенит у ноги хозяина."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Самая заметная особенность этого глагола — ТРИ равноправные основы настоящего времени: drepta- (dreptam, dreptasz, drepta), drepc- (drepcę, drepcesz, drepce) и drepcz- (drepczę, drepczesz, drepcze). Все три засвидетельствованы: PoliMorf даёт drepce и drepcze одну и ту же помету fin:sg:ter:imperf от одного и того же dreptać. У каждой основы свои повелительные формы (dreptaj / drepc / drepcz) и своё действительное причастие. Отсюда и необычно большая парадигма — 92 формы." }
  - { kind: government, text: "Глагол НЕПЕРЕХОДНЫЙ: винительного дополнения у него нет вовсе (семенят куда-то или по чему-то, но не «что-то»). Поэтому во всей парадигме нет ни одного страдательного причастия — ни dreptany, ни dreptani. Это не пропуск в словаре, а следствие управления; есть только действительные причастия dreptający, drepcący, drepczący." }
  - { kind: register, text: "Слово выразительное и бытовое, с оттенком умиления или легкой насмешки: так говорят о ребёнке, о старушке, о курице. В официальном тексте его не встретишь; нейтральные замены — iść drobnymi krokami, przestępować z nogi na nogę." }
  - { kind: false-friend, text: "Прямого русского родственника у этого корня нет, опереться не на что — слово приходится запоминать целиком. По смыслу ему отвечают русские «семенить», «топтаться» и «трусить» (о животном), но ни одно из них не родственно польскому." }
collocations:
  - { pl: "dreptać w miejscu", ru: "топтаться на месте" }
  - { pl: "dreptać za kimś", ru: "семенить за кем-л." }
  - { pl: "dreptać obok wózka", ru: "семенить рядом с коляской" }
family:
  - { pl: "podreptać", ru: "посеменить, потопать", relation: aspect }
  - { pl: "dreptanie", ru: "топтание, семенящие шаги", relation: derived }
etymology: "Глагол выразительный (экспрессивный), передающий частые мелкие шаги самим своим звучанием. Надёжной праславянской реконструкции для него привести нельзя, и русского родственника у корня нет. Показательно, что он так и не остановился на одной основе настоящего времени: три параллельные основы — drepta-, drepc- и drepcz- — как раз типичны для слов такого, звукоподражательного происхождения."
memory: "dreptać — «семенить, топтаться мелкими шагами». Запоминать надо не корень (родственника в русском нет), а парадигму: три равноправные основы настоящего времени — dreptam, drepcę и drepczę. И выражение dreptać w miejscu значит буквально то же, что русское «топтаться на месте»."
idioms:
  - { pl: "dreptać w miejscu", ru: "топтаться на месте, не двигаться вперёд" }
  - { pl: "dreptać za kimś jak cień", ru: "семенить за кем-л. как тень" }
