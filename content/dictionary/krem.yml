# review
id: krem
format: 2
lemma: "krem"
rank: 4461
pos: noun
pron: { cyr: "крэм" }
senses:
  - id: cosmetic
    ru: "крем (косметический)"
    examples:
      - pl: "Posmaruj ręce kremem."
        ru: "Намажь руки кремом."
        source: { kind: authored }
      - pl: "Ten krem chroni skórę przed słońcem."
        ru: "Этот крем защищает кожу от солнца."
        source: { kind: authored }
      - pl: "Kupiłam krem na noc."
        ru: "Я купила ночной крем."
        source: { kind: authored }
  - id: culinary
    ru: "крем (кондитерский); крем-суп"
    examples:
      - pl: "Tort przełożony jest kremem czekoladowym."
        ru: "Торт прослоен шоколадным кремом."
        source: { kind: authored }
      - pl: "Na obiad był krem z dyni."
        ru: "На обед был тыквенный крем-суп."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "KREM — «крем» и в косметике, и в кондитерской. Но в меню KREM Z DYNI, KREM Z BROKUŁÓW — это не десерт, а суп-пюре. Сливки — ŚMIETANKA, а не KREM." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Родительный — KREMU, местный — W KREMIE. Для чего крем — DO с родительным: KREM DO RĄK, KREM DO TWARZY." }
  - { kind: government, text: "Намазать кремом — POSMAROWAĆ KREMEM, творительный без предлога. Крем для рук — KREM DO RĄK, DO с родительным, а не «для». Крем от солнца — KREM Z FILTREM." }
  - { kind: pronunciation, text: "Читается «крэм», один слог. RE — твёрдое «рэ»." }
collocations:
  - { pl: "krem do rąk", ru: "крем для рук" }
  - { pl: "krem z filtrem", ru: "солнцезащитный крем" }
  - { pl: "krem z dyni", ru: "тыквенный крем-суп" }
family:
  - { pl: "kremowy", ru: "кремовый", relation: derived }
  - { pl: "kremówka", ru: "кремувка (пирожное с кремом)", relation: derived }
  - { pl: "kremik", ru: "кремик", relation: derived }
etymology: "Из французского слова со значением «сливки, крем». Русское «крем» — из того же источника. Знаменитая KREMÓWKA — слоёное пирожное с кремом, любимое лакомство папы Иоанна Павла II."
memory: "Krem — крем; krem z dyni — тыквенный суп-пюре. Читается «крэм». Krem do rąk — крем для рук (do!). Kremówka — пирожное с кремом."
idioms:
  - { pl: "śmietanka towarzyska", ru: "сливки общества" }
