# review
id: przeciag
format: 2
lemma: "przeciąg"
rank: 4300
pos: noun
pron: { cyr: "пшэ́цёнк" }
senses:
  - id: draught
    ru: "сквозняк"
    examples:
      - pl: "Zamknij okno, bo jest przeciąg."
        ru: "Закрой окно, сквозняк."
        source: { kind: authored }
      - pl: "Od przeciągu bolą mnie plecy."
        ru: "От сквозняка у меня болит спина."
        source: { kind: authored }
      - pl: "Przeciąg trzasnął drzwiami."
        ru: "Сквозняк хлопнул дверью."
        source: { kind: authored }
  - id: span
    ru: "промежуток (в обороте W PRZECIĄGU, разг.)"
    examples:
      - pl: "W przeciągu tygodnia wszystko się wyjaśni."
        ru: "В течение недели всё прояснится."
        source: { kind: authored }
      - pl: "Zrobił to w przeciągu godziny."
        ru: "Он сделал это в течение часа."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "PRZECIĄG — «сквозняк»: то, что «тянет» через комнату, от CIĄGNĄĆ «тянуть». Во втором значении слово спорное: W PRZECIĄGU TYGODNIA, «в течение недели», говорят очень часто, но нормативные словари советуют W CIĄGU TYGODNIA. Понимать надо оба, а писать лучше W CIĄGU." }
  - { kind: usage, text: "Девять форм, мужской род, неодушевлённое. Родительный и местный совпадают: PRZECIĄGU. Во множественном PRZECIĄGI — «сквозняки»: W TYM DOMU SĄ CIĄGŁE PRZECIĄGI." }
  - { kind: government, text: "На сквозняке — W PRZECIĄGU, местный: NIE SIEDŹ W PRZECIĄGU. От сквозняка — OD PRZECIĄGU, родительный. Боятся сквозняков с родительным: BAĆ SIĘ PRZECIĄGÓW." }
  - { kind: pronunciation, text: "Читается «пшэ́цёнк», два слога, ударение на первом. PRZ даёт «пш»: R после P оглушается. Ą перед G звучит «он», а конечное G оглушается в «к». В форме PRZECIĄGU: «пшэцё́нгу»." }
  - { kind: register, text: "W PRZECIĄGU в значении «в течение» — разговорное и газетное, пуристы его не любят. Значение «сквозняк» нейтральное и бытовое: польские бабушки боятся сквозняков не меньше русских." }
collocations:
  - { pl: "robić przeciąg", ru: "устраивать сквозняк" }
  - { pl: "silny przeciąg", ru: "сильный сквозняк" }
  - { pl: "w przeciągu roku", ru: "в течение года" }
family:
  - { pl: "ciągnąć", ru: "тянуть", relation: root, id: ciagnac }
  - { pl: "przeciągnąć", ru: "протянуть; затянуть", relation: derived }
  - { pl: "przeciągły", ru: "протяжный", relation: derived }
etymology: "От PRZECIĄGAĆ «протягивать»: сквозняк «протягивает» воздух через комнату. Корень CIĄG- тот же, что в русском «тянуть», с носовым на месте «я»: CIĄGNĄĆ и «тянуть», как MIĘSO и «мясо»."
memory: "Przeciąg — сквозняк, от ciągnąć «тянуть». Читается «пшэ́цёнк». Nie siedź w przeciągu — не сиди на сквозняке. W przeciągu tygodnia — в течение недели, но правильнее w ciągu."
idioms:
  - { pl: "w przeciągu", ru: "в течение (разг.)" }
  - { pl: "siedzieć w przeciągu", ru: "сидеть на сквозняке" }
