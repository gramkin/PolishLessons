notes:
  - { kind: usage, text: "ЭТО СЛОВО НЕ СКЛОНЯЕТСЯ ВОВСЕ — ОДНА ФОРМА НА ВСЕ ПАДЕЖИ. Emu выглядит одинаково в именительном, родительном и предложном: emu, pióra emu, o emu. Так же ведут себя заимствования на неударные гласные: kakadu, boa, jury, menu, tabu, kiwi. Падеж узнаётся только по предлогу и согласованию." }
  - { kind: false-friend, text: "Русское «эму» ведёт себя точно так же — не склоняется, и род у него тоже средний. Это одно из редких мест, где обоим языкам ничего не надо запоминать отдельно. Но по-польски прилагательное обязательно показывает род: TO emu, małe emu, а не ten." }
  - { kind: pronunciation, text: "Два слога, ударение на первом: E-mu. Польское e открытое, как русское э: «э́му». Слово не меняется, поэтому и ударение всегда на месте." }
collocations:
