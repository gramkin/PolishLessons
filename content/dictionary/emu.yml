etymology: "Из английского emu, а то, вероятно, из португальского ema «страус, журавль». В Австралию слово принесли европейцы, и оттуда оно разошлось по языкам. В польский и русский попало одинаково поздно и в обоих осталось несклоняемым."
memory: "emu — «эму», и это слово не склоняется совсем: одна форма на все падежи, как kakadu, jury и menu. Род средний: TO emu, małe emu."
