        ru: "Восхищавший всех, он остался скромным."
        source: { kind: authored }
  - id: gaze-at
    ru: "любоваться, разглядывать"
    examples:
      - pl: "Podziwiali widok z tarasu."
        ru: "Они любовались видом с террасы."
        source: { kind: authored }
      - pl: "Turyści podziwiają zamek od rana."
        ru: "Туристы любуются замком с утра."
        source: { kind: authored }
  - id: admiration
    ru: "любование, восхищение (отглаг.)"
    examples:
      - pl: "Podziwianie obrazów zajęło im godzinę."
        ru: "Любование картинами заняло у них час."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ЭТО НЕ «ПОДИВИТЬСЯ», А «ВОСХИЩАТЬСЯ». Podziwiać значит восхищаться и любоваться: podziwiam widok. Удивляться — это DZIWIĆ SIĘ: dziwię się, że przyszedł. Корень общий с русским «див-», но разошёлся дальше некуда: польское DZIWNY значит «странный», а русское «дивный» — «прекрасный». Один корень, противоположные оценки." }
  - { kind: government, text: "УПРАВЛЕНИЕ РАСХОДИТСЯ, И ЭТО ЛОВИТ ПОСТОЯННО. Podziwiać требует ВИНИТЕЛЬНОГО: podziwiam widok, podziwiam ją, podziwiam twoją odwagę. Русское «восхищаться» берёт творительный: «восхищаюсь видом». Поэтому дословный перевод с русского даёт ошибку в падеже, и оборот надо перестраивать." }
  - { kind: usage, text: "Вид несовершенный, и формы это подтверждают: есть PODZIWIAJĄC «любуясь» и причастие PODZIWIAJĄCY «любующийся», а деепричастия на -wszy нет. Сравни с powiesić в этой же паре карточек, где всё наоборот. Существительное PODZIW значит «восхищение»: godny podziwu — «достойный восхищения»." }
collocations:
  - { pl: "podziwiać widok", ru: "любоваться видом" }
  - { pl: "godny podziwu", ru: "достойный восхищения" }
  - { pl: "podziwiać czyjąś odwagę", ru: "восхищаться чьей-л. смелостью" }
family:
  - { pl: "podziw", ru: "восхищение", relation: derived }
  - { pl: "dziwić", ru: "удивлять", relation: root }
  - { pl: "dziwny", ru: "странный", relation: root, id: dziwny }
etymology: "Приставка po- и dziwiać, от dziw «диво, чудо», из праславянского *divъ. Тот же корень в русских «диво», «дивиться» и «удивить». Польский развил из него восхищение (podziw) и странность (dziwny), русский — удивление и красоту («дивный»), так что оценки разошлись."
memory: "podziwiać — «восхищаться, любоваться», а «удивляться» будет dziwić się. И падеж другой: podziwiam WIDOK, винительный, тогда как русский говорит «восхищаюсь видом». Помни ещё, что dziwny значит «странный», а не «дивный»."
idioms:
  - { pl: "godny podziwu", ru: "достойный восхищения" }
  - { pl: "podziwiać z daleka", ru: "любоваться издалека" }
