pos: noun
pron: { cyr: "но́та" }
senses:
  - id: note
    ru: "нота (дипломатическая), официальная записка"
    examples:
      - pl: "Ministerstwo wysłało notę protestacyjną."
        ru: "Министерство направило ноту протеста."
        source: { kind: authored }
      - pl: "Ambasador wręczył notę."
        ru: "Посол вручил ноту."
        source: { kind: authored }
      - pl: "W nocie dyplomatycznej zażądano wyjaśnień."
        ru: "В дипломатической ноте потребовали объяснений."
        source: { kind: authored }
  - id: score
    ru: "оценка, балл (судей); примечание"
    examples:
      - pl: "Łyżwiarka dostała wysoką notę od sędziów."
        ru: "Фигуристка получила высокую оценку судей."
        source: { kind: authored }
      - pl: "Na końcu książki jest nota o autorze."
        ru: "В конце книги есть справка об авторе."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "NOTA — не музыкальная «нота»! Нота в музыке — NUTA. NOTA — «дипломатическая нота», «оценка судей» и «примечание»: NOTA BIOGRAFICZNA. Конспект, запись — NOTATKA." }
  - { kind: usage, text: "Девять форм, женский род. В местном T переходит в C: W NOCIE. Родительный множественного — NOT. Звательный NOTO не употребляется." }
  - { kind: government, text: "Вручить ноту — WRĘCZYĆ NOTĘ, винительный. Нота протеста — NOTA PROTESTACYJNA. Получить оценку — DOSTAĆ NOTĘ." }
  - { kind: pronunciation, text: "Читается «но́та», ударение на первом слоге. NOCIE — «но́це»." }
collocations:
  - { pl: "nota dyplomatyczna", ru: "дипломатическая нота" }
  - { pl: "nota biograficzna", ru: "биографическая справка" }
  - { pl: "wysoka nota", ru: "высокая оценка" }
family:
  - { pl: "nuta", ru: "нота (муз.)", relation: root }
  - { pl: "notatka", ru: "запись, заметка", relation: derived, id: notatka }
  - { pl: "ocena", ru: "оценка", relation: root, id: ocena }
etymology: "Из латинского NOTA «знак, пометка». Польское различает NOTA «записка» и NUTA «музыкальная нота»."
