  - form: "smakowałby"
    pl: "Bez soli rosół smakowałby nijak."
    ru: "Без соли бульон был бы никакой на вкус."
    source: { kind: authored }
  - form: "smakowało"
    pl: "Smakowało mi to."
    ru: "Мне это понравилось."
    source: { kind: translated, id: 10634694 }
