formExamples:
  - form: "smakować"
    pl: "Spróbuj tego wina, czy ci będzie smakować."
    ru: "Попробуй это вино, понравится ли оно тебе."
    source: { kind: translated, id: 880458 }
  - form: "smakować"
    pl: "Zupa zaczyna smakować lepiej."
    ru: "Суп начинает казаться вкуснее."
    source: { kind: authored }
  - form: "smakować"
    pl: "To musi smakować wyśmienicie."
    ru: "Это должно быть очень вкусно."
    source: { kind: authored }
  - form: "smakował"
