    pl: "Ta zupa smakowałaby lepiej z pieprzem."
    ru: "Этот суп был бы вкуснее с перцем."
    source: { kind: authored }
  - form: "smakowałaby"
    pl: "Kawa smakowałaby ci, gdyby była świeża."
    ru: "Кофе тебе понравился бы, будь он свежим."
    source: { kind: authored }
  - form: "smakowałaby"
    pl: "Bez cukru herbata smakowałaby inaczej."
