# review
id: smakowac
format: 2
lemma: "smakować"
rank: 1939
pos: verb
aspect: imperf
pron: { cyr: "смако́ваць" }
senses:
  - id: taste-good
    ru: "быть вкусным, нравиться (о еде)"
    examples:
      - pl: "Czy smakuje?"
        ru: "Вкусно?"
        source: { kind: tatoeba, id: 8511347 }
      - pl: "Smakuje wyśmienicie."
        ru: "Очень вкусно."
        source: { kind: translated, id: 351940 }
      - pl: "Woda dobrze smakuje."
        ru: "Вода вкусная."
        source: { kind: translated, id: 1409774 }
      - pl: "Mięso źle smakuje."
        ru: "Мясо невкусное."
        source: { kind: translated, id: 3884212 }
      - pl: "To mleko dziwnie smakuje."
        ru: "У этого молока странный вкус."
        source: { kind: tatoeba, id: 1002730 }
      - pl: "Smakowało mi to."
        ru: "Мне это понравилось."
        source: { kind: translated, id: 10634694 }
  - id: taste-to-someone
    ru: "с дательным: кому-либо вкусно"
    examples:
      - pl: "Smakuje ci tofu?"
        ru: "Тебе нравится тофу?"
        source: { kind: translated, id: 3411067 }
      - pl: "Nie smakowała mi ta kawa."
        ru: "Мне не понравился этот кофе."
        source: { kind: translated, id: 736813 }
      - pl: "Parówki z musztardą naprawdę dobrze mi smakują."
        ru: "Сосиски с горчицей мне очень нравятся."
        source: { kind: translated, id: 11749588 }
notes:
  - { kind: government, text: "Будущее время дано только в третьем лице: подлежащее у smakować — еда, а человек стоит в дательном (zupa będzie smakowała dzieciom). Форм вроде będę smakować живой язык не знает — они попадаются лишь в старых текстах, где глагол был переходным («Ustami smakujemy, jemy i pijemy»). Мужско-личной формы będą smakowali тоже нет: подлежащим не может быть группа людей." }
  - { kind: government, text: "Главное отличие от русского: тот, кому вкусно, стоит в дательном падеже, а подлежащее — сама еда. Smakuje ci tofu? буквально «Тофу тебе вкусит?», то есть «Тебе нравится тофу?»." }
  - { kind: usage, text: "Прошедшее время согласуется с едой, а не с человеком: Nie smakowała mi ta kawa «Мне не понравился этот кофе», где smakowała — женский род по слову kawa." }
  - { kind: usage, text: "Короткое Smakuje? значит «Вкусно?» — обычный вопрос за столом." }
  - { kind: usage, text: "Существительное того же корня — smak «вкус», прилагательное smaczny «вкусный»." }
  - { kind: government, text: "Раз подлежащее — еда, у глагола нет ни форм первого и второго лица (smakuję, smakowałem), ни мужско-личных (smakowali): человек при нём всегда в дательном. Нет и страдательного причастия, потому что глагол непереходный." }
  - { kind: usage, text: "Формы вроде smakowanie или smakuj относятся к переходному «смаковать, пробовать» — употреблению устаревшему. Сегодня о дегустации скажут degustacja, а «попробуй» будет spróbuj." }
collocations:
  - { pl: "smakuje ci?", ru: "тебе нравится?" }
  - { pl: "dobrze smakuje", ru: "вкусно" }
  - { pl: "smakowało mi", ru: "мне понравилось" }
etymology: "От smak «вкус», заимствованного из средневерхненемецкого smac. Русское «смак» и «смаковать» — то же самое слово, пришедшее через польский."
memory: "Запомните падеж: не «я люблю», а «мне вкусит». Smakuje ci tofu? «Тебе нравится тофу?», Smakowało mi «Мне понравилось». Подлежащее — еда, человек в дательном."
idioms:
  - { pl: "smakuje ci?", ru: "тебе нравится?" }
  - { pl: "smakowało mi", ru: "мне понравилось" }
  - { pl: "dobrze smakuje", ru: "вкусно" }
