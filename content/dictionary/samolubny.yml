notes:
  - { kind: false-friend, text: "Опасная пара для русского: SAMOLUBNY звучит как «самолюбивый», но значит «эгоистичный, себялюбивый». Русское «самолюбивый» — это гордый, обидчивый, болезненно переживающий за свою честь, и по-польски это AMBITNY или DRAŻLIWY. Польский SAMOLUBNY думает только о себе и не делится, русский самолюбивый обижается на критику." }
  - { kind: usage, text: "Сравнивается описательно: BARDZIEJ SAMOLUBNY. Все одиннадцать форм живые. Форма для мужчин-людей SAMOLUBNI частая: SAMOLUBNI LUDZIE, SAMOLUBNI POLITYCY. Синоним EGOISTYCZNY звучит чуть книжнее, а существительное — EGOISTA или SAMOLUB." }
  - { kind: government, text: "Эгоистичный по отношению к кому-то — SAMOLUBNY WOBEC KOGOŚ, WOBEC с родительным, или W STOSUNKU DO KOGOŚ. Само прилагательное падежа не требует." }
  - { kind: pronunciation, text: "Читается «самолю́бны», четыре слога, ударение на предпоследнем. LU даёт мягкое «лю», как в LUBIĆ «лю́бить». Оба A и O чёткие, без аканья: «са-мо»." }
  - { kind: register, text: "Нейтральное слово, но с явным осуждением. В разговоре его часто заменяют на EGOISTA: TY EGOISTO! В детской речи SAMOLUB — «жадина». SAMOLUBNY GEN, «эгоистичный ген», — польское название книги Докинза." }
collocations:
  - { pl: "samolubne zachowanie", ru: "эгоистичное поведение" }
  - { pl: "samolubny gen", ru: "эгоистичный ген" }
  - { pl: "samolubne motywy", ru: "корыстные мотивы" }
family:
  - { pl: "lubić", ru: "любить, нравиться", relation: root, id: lubic }
  - { pl: "samolub", ru: "эгоист, себялюбец", relation: derived }
