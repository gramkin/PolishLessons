etymology: "Сложение SAM «сам» и LUBIĆ «любить»: «любящий самого себя». Русское «самолюбивый» собрано из тех же частей, но значение развело их в разные стороны: польское слово ушло к эгоизму, русское к гордости. Классический пример ложного друга, где совпадает каждая морфема, но не смысл."
memory: "Samolubny — не «самолюбивый», а эгоистичный: думает только о себе. Русский самолюбивый — обидчивый, по-польски ambitny. Читается «самолю́бны»."
idioms:
  - { pl: "samolubny gen", ru: "эгоистичный ген" }
