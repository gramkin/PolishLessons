notes:
  - { kind: false-friend, text: "Русский читает это слово как «отчёт», и ошибается. Отчёт по-польски SPRAWOZDANIE. А ODCZYT это либо публичная лекция, доклад, который WYGŁASZA SIĘ перед слушателями, либо показание прибора: ODCZYT LICZNIKA, ODCZYT Z CZUJNIKA. Оба смысла от глагола ODCZYTAĆ «прочитать, считать». Любопытно, что и наш «отчёт» собран из тех же частей, от и честь-читать, только пошёл в сторону бухгалтерии." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. В местном падеже T переходит в CI: ODCZYT, но NA ODCZYCIE. Так же устроены PRZYSTANEK и SUFIT. Беглых гласных в основе нет. Множественное ODCZYTY чаще всего значит показания приборов, а в значении лекций употребляется, когда речь о целом цикле." }
  - { kind: government, text: "Прочитать доклад — WYGŁOSIĆ ODCZYT, винительный без предлога, и глагол здесь именно WYGŁOSIĆ, дословно «огласить». На докладе — NA ODCZYCIE, местный падеж. Показание счётчика — ODCZYT LICZNIKA, родительный без предлога. Показание с датчика — ODCZYT Z CZUJNIKA, предлог Z с родительным." }
  - { kind: pronunciation, text: "Читается «о́тчыт», два слога, ударение на первом. Буква D перед CZ оглушается и звучит «т», поэтому начало слова это «отч», а не «одч». Буква Y даёт «ы». В местном падеже ODCZYCIE сочетание CIE даёт мягкое «це»: «отчы́це»." }
  - { kind: register, text: "В значении лекции слово чуть старомодное и торжественное: ODCZYT устраивают в библиотеке или в обществе, и WYGŁOSIĆ ODCZYT звучит солиднее, чем просто рассказать. В технике и в быту второй смысл совершенно обиходен: ODCZYT LICZNIKA снимает инкассент, ODCZYT Z CZUJNIKA смотрит мастер. Путаницы не бывает, потому что контекст всегда ясен." }
collocations:
  - { pl: "odczyt licznika", ru: "показание счётчика" }
  - { pl: "odczyt z czujnika", ru: "показание датчика" }
  - { pl: "na odczycie", ru: "на докладе" }
family:
  - { pl: "czytać", ru: "читать", relation: root, id: czytac }
  - { pl: "odczytać", ru: "прочитать; считать показания", relation: root }
  - { pl: "czytnik", ru: "считыватель", relation: derived }
etymology: "От глагола ODCZYTAĆ, от приставки OD- и CZYTAĆ «читать», слова праславянского и того же, что русское «читать». Русский «отчёт» собран из тех же двух частей, но закрепился за счетоводством, а польский ODCZYT остался при чтении: читают доклад перед людьми и читают показание со счётчика. Один и тот же состав, два разных дела, и отсюда вся путаница."
memory: "Не «отчёт», а доклад или показание прибора: отчёт по-польски sprawozdanie. Оба смысла от odczytac «прочитать, считать»: wyglosic odczyt это «прочитать доклад», odczyt licznika — «показание счётчика». Читается «о́тчыт», где d перед cz оглушается в «т». В местном падеже t переходит в ci: na odczycie."
idioms:
  - { pl: "wygłosić odczyt", ru: "прочитать доклад" }
