notes:
  - { kind: false-friend, text: "Русскому глазу слышится «сварить» или «сварной», но варка здесь ни при чём. ZWARTY — бывшее причастие от ZEWRZEĆ «сомкнуть, стиснуть» (несовершенный вид ZWIERAĆ), и значит «сомкнутый, плотный». В польском есть омонимичный глагол WRZEĆ «кипеть», что запутывает ещё больше, но ZWARTY к кипению не относится. От того же ZEWRZEĆ идёт ZWARCIE, «короткое замыкание» в электрике и «схватка» в боксе." }
  - { kind: usage, text: "Главный образ слова — нет промежутков. Отсюда ZWARTY TŁUM «плотная толпа», ZWARTA ZABUDOWA «плотная застройка», ZWARTY SZYK «сомкнутый строй». Перенесённое на текст, оно значит «сжатый, без воды»: ZWARTY STYL. О человеке говорят ZWARTA SYLWETKA, «плотная, крепкая фигура». Степеней на -SZY в живой речи почти нет, поэтому форм одиннадцать." }
  - { kind: usage, text: "Устойчивое выражение ZWARCI I GOTOWI — «в полной готовности», буквально «сомкнутые и готовые». Оно пришло из военного языка, но теперь звучит и в быту: перед поездкой, экзаменом, матчем. Форма ZWARCI в нём — мужско-личное множественное число, поэтому о группе женщин говорят ZWARTE I GOTOWE." }
  - { kind: pronunciation, text: "«зва́рты»: ударение на первом слоге, Y на конце звучит как «ы». Сочетание ZW в начале звонкое, как в русском «зв», и не оглушается, потому что за ним гласный. Во множественном мужско-личном T чередуется с мягким C: ZWARTY, но ZWARCI, как WARTY и WARCI." }
