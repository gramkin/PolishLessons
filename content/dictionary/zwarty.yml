family:
  - { pl: "zewrzeć", ru: "сомкнуть, стиснуть", relation: root }
  - { pl: "zwierać", ru: "смыкать, сжимать", relation: root }
  - { pl: "zwarcie", ru: "короткое замыкание; схватка", relation: derived }
etymology: "Бывшее страдательное причастие от глагола zewrzeć «сомкнуть, замкнуть» (несовершенный вид zwierać). Корень тот же, что в русских «затворить» и «отворить», то есть со значением «запирать, смыкать»."
memory: "zwarty — это «сомкнутый»: zwarty szyk, «сомкнутый строй». Не путать со «сварить». Перед делом говорят zwarci i gotowi — «собранные и готовые»."
idioms:
