etymology: "От прилагательного PUBLICZNY, заимствованного из латинского PUBLICUS «общественный», которое само восходит к POPULUS «народ». Польский взял слово через латынь канцелярии и школы ещё в средние века, русский — позже и через западные языки, поэтому корень в двух языках один, а суффиксы разошлись в работе. Польское -OŚĆ и русское -ОСТЬ происходят от одного праславянского -ostь и обычно строят имя свойства: WOLNOŚĆ, MIŁOŚĆ, GODNOŚĆ. Но в части слов польский употребил его для собирательного значения, назвав не свойство, а множество людей, обладающих им: PUBLICZNOŚĆ — это те, кто составляет публику. Такое же смещение видно в SŁUŻBA, которое значит и службу, и прислугу."
memory: "Выглядит как «публичность», значит «публика». Открытость по-польски jawność, а publiczność — это зал, зрители. Суффикс -ość обычно даёт свойство, но здесь дал собирательное имя людей, как służba «прислуга». Глагол при нём единственного числа: publiczność biła brawo. Шесть форм, publiczności делает четыре падежа. И прилагательное publiczny значит «государственный»: szkoła publiczna это обычная школа."
