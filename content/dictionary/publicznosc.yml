notes:
  - { kind: false-friend, text: "Слово выглядит как русская «публичность», а значит «публика». Русская «публичность» — свойство: открытость, доступность для всех, и по-польски это JAWNOŚĆ или PUBLICZNY CHARAKTER. Польская PUBLICZNOŚĆ — собрание людей: зрители в зале, слушатели, посетители. Поэтому PRZED PUBLICZNOŚCIĄ значит «перед публикой», а не «перед публичностью», и перепутать их легко, потому что суффикс -OŚĆ обычно образует именно свойство. Здесь он образовал собирательное имя, как в MŁODZIEŻ и SŁUŻBA. Запомнить проще через зал: PUBLICZNOŚĆ — это те, кто сидит и смотрит." }
  - { kind: usage, text: "Шесть форм, как у всех слов на -OŚĆ. Форма PUBLICZNOŚCI покрывает родительный, дательный и местный единственного и родительный множественного сразу. Слово собирательное, и потому глагол при нём стоит в единственном числе: PUBLICZNOŚĆ BIŁA BRAWO, буквально «публика била в ладоши» — ровно как по-русски. Множественное число PUBLICZNOŚCI употребляется редко и только когда речь о разных аудиториях: публике столичной и провинциальной, вечерней и утренней. В обычном рассказе о спектакле множественное не нужно и звучит книжно." }
  - { kind: pronunciation, text: "Читается «публи́чносьць», четыре слога, ударение на предпоследнем. Буквосочетание CZ даёт твёрдое «ч». Конечное -ŚĆ — те же два мягких звука, что в GODNOŚĆ: «сьць». В форме PUBLICZNOŚCI сочетание ŚCI звучит «сьци», и ударение сдвигается вправо: «публично́сьци». В форме PUBLICZNOŚCIĄ последнее Ą даёт «он». Начальное PU произносится твёрдо и коротко, без растягивания, в отличие от русского «пу» в «публике»." }
  - { kind: register, text: "Слово нейтральное, частое в театре, на концерте, в спорте и в телевидении. Устойчивые обороты: GRAĆ DLA PUBLICZNOŚCI «играть на публику», то есть работать на эффект; NA OCZACH PUBLICZNOŚCI «на глазах у публики»; PUBLICZNOŚĆ ZGOTOWAŁA OWACJĘ «публика устроила овацию». Для телезрителей говорят WIDZOWIE, для слушателей радио SŁUCHACZE, и PUBLICZNOŚĆ в этих случаях звучит слишком залом. Прилагательное PUBLICZNY значит «общественный, государственный»: SZKOŁA PUBLICZNA — это обычная государственная школа, а вовсе не публичное заведение." }
