# review
id: jezioro
format: 2
lemma: "jezioro"
rank: 1849
pos: noun
pron: { cyr: "ези́оро" }
senses:
  - id: lake
    ru: "озеро"
    examples:
      - pl: "Jezioro znowu zamarzło."
        ru: "Озеро снова замёрзло."
        source: { kind: translated, id: 9417309 }
      - pl: "Dlaczego jezioro jest różowe?"
        ru: "Почему озеро розовое?"
        source: { kind: tatoeba, id: 13464832 }
      - pl: "To jezioro nie jest głębokie. Jest płytkie."
        ru: "Это озеро не глубокое. Оно мелкое."
        source: { kind: tatoeba, id: 12678784 }
  - id: at-lake
    ru: "озеро (на озере, к озеру, у озера)"
    examples:
      - pl: "Jedziemy jutro rowerem nad jezioro."
        ru: "Завтра мы поедем на велосипеде к озеру."
        source: { kind: tatoeba, id: 3284065 }
      - pl: "Mój dom jest nad jeziorem."
        ru: "Мой дом у озера."
        source: { kind: translated, id: 1100598 }
      - pl: "Lubię pływać w jeziorze."
        ru: "Я люблю плавать в озере."
        source: { kind: translated, id: 13067824 }
notes:
  - { kind: government, text: "Где — w jeziorze «в озере» (внутри воды) и na jeziorze «на озере» (на поверхности); у озера — nad jeziorem (творительный), куда — nad jezioro (винительный)." }
  - { kind: usage, text: "Предлог nad с озером значит «у, около»: dom nad jeziorem «дом у озера», pojechać nad jezioro «поехать на озеро»." }
  - { kind: usage, text: "Множественное jezior в родительном: w Finlandii jest wiele jezior «в Финляндии много озёр»." }
  - { kind: false-friend, text: "Слово то же, что русское «озеро», только польское начинается на je-: jezioro. Так же ведут себя jesień «осень» и jeden «один»." }
collocations:
  - { pl: "nad jeziorem", ru: "у озера" }
  - { pl: "w jeziorze", ru: "в озере" }
  - { pl: "pojechać nad jezioro", ru: "поехать на озеро" }
family:
  - { pl: "jeziorko", ru: "озерцо", relation: root }
  - { pl: "morze", ru: "море", relation: root, id: morze }
  - { pl: "rzeka", ru: "река", relation: root, id: rzeka }
etymology: "Праславянское *ezero — то же слово, что русское «озеро»; польское je- на месте русского «о-», как в jesień «осень»."
memory: "jezioro — «озеро». У озера — nad jeziorem, поехать на озеро — nad jezioro, плавать в озере — w jeziorze. Узнать легко: je- на месте русского «о-»."
