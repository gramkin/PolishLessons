# review
id: ty
format: 2
lemma: "ty"
rank: 14
pos: pron
pron: { cyr: "ты" }
senses:
  - id: you
    ru: "ты"
    examples:
      - pl: "A ty?"
        ru: "А ты?"
        source: { kind: tatoeba, id: 756951 }
      - pl: "Ty pierwszy."
        ru: "Ты первый."
        source: { kind: tatoeba, id: 2830002 }
  - id: you-obj
    ru: "тебя, тебе, тобой (косвенные падежи)"
    examples:
      - pl: "Kocham cię."
        ru: "Я люблю тебя!"
        source: { kind: tatoeba, id: 348818 }
      - pl: "Pomogę ci."
        ru: "Я тебе помогу."
        source: { kind: tatoeba, id: 818010 }
      - pl: "Myślę o tobie."
        ru: "Я думаю о тебе."
        source: { kind: tatoeba, id: 355505 }
notes:
  - { kind: usage, text: "Краткие ci и cię безударны и стоят внутри фразы; полные tobie и ciebie — в начале и после предлога: Pomogę ci, но Tobie pomogę." }
collocations:
  - { pl: "dla ciebie", ru: "для тебя" }
  - { pl: "z tobą", ru: "с тобой" }
  - { pl: "u ciebie", ru: "у тебя" }
etymology: "Праславянское *ty̑, из праиндоевропейского *túh₂ — то же слово, что русское «ты»."
memory: "Две пары форм, короткая и длинная: ci/tobie «тебе», cię/ciebie «тебя». Длинная обязательна после предлога (do ciebie) и под ударением, короткая — в обычном порядке слов (Kocham cię)."
idioms:
  - { pl: "być na ty", ru: "быть на «ты»" }
  - { pl: "mówić komuś na ty", ru: "обращаться к кому-то на «ты»" }
formExamplesSkip:
  - { form: "te", reason: "Форма te принадлежит указательному местоимению ten («эти»), а не ty; в эту парадигму она попала из-за совпадения основ в словаре форм." }
