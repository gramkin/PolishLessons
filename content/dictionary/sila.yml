# review
id: sila
format: 2
lemma: "siła"
rank: 474
pos: noun
pron: { cyr: "сьи́уа" }
senses:
  - id: strength
    ru: "сила"
    examples:
      - pl: "W jedności siła."
        ru: "В единстве сила."
        source: { kind: translated, id: 2175740 }
      - pl: "Wojna to pokój. Wolność to niewola. Ignorancja to siła."
        ru: "Война — это мир. Свобода — это рабство. Незнание — сила."
        source: { kind: tatoeba, id: 1421997 }
      - pl: "Mądrość jest siłą."
        ru: "Мудрость — это сила."
        source: { kind: translated, id: 12887132 }
  - id: energy
    ru: "силы (физические, запас сил)"
    examples:
      - pl: "Biegł z całych sił."
        ru: "Он бежал во всю прыть."
        source: { kind: tatoeba, id: 661292 }
      - pl: "Nie mam siły."
        ru: "У меня нет сил."
        source: { kind: translated, id: 10202699 }
      - pl: "Opadłem z sił."
        ru: "Я выбился из сил."
        source: { kind: translated, id: 606077 }
notes:
  - { kind: usage, text: "Обороты совпадают с русскими: z całych sił «изо всех сил», nie mam siły «у меня нет сил», opaść z sił «выбиться из сил»." }
  - { kind: usage, text: "Творительный siłą значит «силой, насильно»: wziąć siłą «взять силой», siłą rzeczy «в силу вещей»." }
  - { kind: usage, text: "siła wyższa — «форс-мажор», буквально «высшая сила»; siła robocza — «рабочая сила»." }
  - { kind: usage, text: "Множественное siły значит ещё и «войска»: siły zbrojne «вооружённые силы»." }
collocations:
  - { pl: "z całych sił", ru: "изо всех сил" }
  - { pl: "nie mam siły", ru: "у меня нет сил" }
  - { pl: "siła wyższa", ru: "форс-мажор" }
  - { pl: "siły zbrojne", ru: "вооружённые силы" }
etymology: "Праславянское *sila; русское «сила» — то же самое слово, без изменений в корне."
memory: "siła — «сила», слово совпадает с русским, и обороты тоже: z całych sił «изо всех сил», nie mam siły «нет сил». А во множественном siły значит ещё и «войска»."
idioms:
  - { pl: "w jedności siła", ru: "в единстве сила" }
  - { pl: "z całych sił", ru: "изо всех сил" }
  - { pl: "siła wyższa", ru: "форс-мажор" }
