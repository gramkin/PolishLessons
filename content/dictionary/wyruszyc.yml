# review
id: wyruszyc
format: 2
lemma: "wyruszyć"
rank: 3662
pos: verb
pron: { cyr: "выру́шыць" }
senses:
  - id: set-out
    ru: "отправиться в путь, выступить"
    examples:
      - pl: "Wyruszyliśmy o świcie."
        ru: "Мы отправились в путь на рассвете."
        source: { kind: authored }
      - pl: "Wyprawa wyruszy w góry jutro."
        ru: "Экспедиция выступит в горы завтра."
        source: { kind: authored }
      - pl: "Wojsko wyruszyło na wschód."
        ru: "Войско выступило на восток."
        source: { kind: authored }
  - id: start-moving
    ru: "тронуться, двинуться (о поезде, колонне)"
    examples:
      - pl: "Pociąg wyruszył punktualnie."
        ru: "Поезд тронулся точно по расписанию."
        source: { kind: authored }
      - pl: "Kolumna samochodów wyruszyła spod ratusza."
        ru: "Колонна машин двинулась от ратуши."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "WYRUSZYĆ — не «выручить» и не «разрушить», хотя звучит похоже. Корень тот же, что в RUSZYĆ — «двинуть, тронуть», RUSZAĆ SIĘ — «шевелиться». WYRUSZYĆ — «тронуться в путь»: WYRUSZYĆ W DROGĘ. Выручить — POMÓC, WYBAWIĆ; разрушить — ZNISZCZYĆ, ZBURZYĆ." }
  - { kind: usage, text: "Сорок две формы: глагол совершенного вида и непереходный, поэтому страдательного причастия нет, а деепричастие WYRUSZYWSZY — «отправившись» — есть. Безличное WYRUSZONO — «отправились, выступили» без подлежащего. Видовой партнёр — WYRUSZAĆ: CO RANO WYRUSZAMY O SZÓSTEJ." }
  - { kind: government, text: "Куда — W или NA с винительным: WYRUSZYĆ W DROGĘ, W GÓRY, NA WYPRAWĘ, NA WOJNĘ. В какой город — DO: WYRUSZYĆ DO KRAKOWA. Откуда — Z или SPOD с родительным: WYRUSZYĆ Z DOMU, SPOD SZKOŁY. За чем — PO с винительным: WYRUSZYĆ PO POMOC." }
  - { kind: pronunciation, text: "Читается «выру́шыць», три слога, ударение на предпоследнем. SZ твёрдое, поэтому «шы», а не «ши». Конечное Ć — мягкое «ць». В будущем WYRUSZĘ — «выру́шэ», WYRUSZĄ — «выру́шон»." }
  - { kind: register, text: "Слово нейтральное, но с оттенком торжественности и приключения: так говорят о походах, экспедициях, войске, паломниках. О простой поездке на работу проще WYJECHAĆ или WYJŚĆ: WYSZEDŁEM Z DOMU O ÓSMEJ." }
collocations:
  - { pl: "wyruszyć w drogę", ru: "отправиться в путь" }
  - { pl: "wyruszyć na wyprawę", ru: "отправиться в экспедицию" }
  - { pl: "wyruszyć o świcie", ru: "выступить на рассвете" }
family:
  - { pl: "wyruszac", ru: "отправляться в путь", relation: aspect }
  - { pl: "ruszyc", ru: "тронуться, двинуть", relation: root, id: ruszyc }
  - { pl: "ruszac", ru: "трогать, двигать", relation: root, id: ruszac }
etymology: "Приставка WY- «вы-, наружу» плюс RUSZYĆ «двинуть, тронуть», от праславянского *rušiti. В русском этот корень остался в «рушить», «разрушить» — то есть «сдвинуть с места так, что упадёт». В польском значение осталось у движения: RUSZYĆ — «двинуться»."
memory: "Wyruszyć — отправиться в путь: wyruszyć w drogę, na wyprawę, o świcie. От ruszyć — тронуться. Не «выручить»! Несовершенный — wyruszać. Читается «выру́шыць»."
idioms:
  - { pl: "wyruszyć w świat", ru: "отправиться странствовать по свету" }
