notes:
  - { kind: false-friend, text: "Три ловушки подряд, и все три стоят внимания. STAN CYWILNY это не «гражданское состояние», а «семейное положение»: женат, замужем, холост. ŚLUB CYWILNY это роспись в загсе, в противоположность венчанию ŚLUB KOŚCIELNY, а вовсе не русский «гражданский брак», который по-польски KONKUBINAT. И наконец гражданская война это WOJNA DOMOWA, буквально «домашняя», и сказать WOJNA CYWILNA нельзя." }
  - { kind: usage, text: "Одиннадцать форм, относительное прилагательное, степеней сравнения нет. Мужско-личная форма множественного числа CYWILNI обиходна: CYWILNI PRACOWNICY «гражданские сотрудники», CYWILNI EKSPERCI. Существительное того же корня CYWIL означает штатского, невоенного человека, и в армейской речи оно звучит постоянно. От него же идёт CYWILIZACJA, так что гнездо здесь широкое и связное." }
  - { kind: government, text: "В загсе — URZĄD STANU CYWILNEGO, сокращённо USC, и предлог W с местным падежом: W URZĘDZIE STANU CYWILNEGO. Вступить в брак — WZIĄĆ ŚLUB, винительный без предлога, а каким он будет, скажет прилагательное: WZIĄĆ ŚLUB CYWILNY. В гражданском праве — W PRAWIE CYWILNYM, предлог W с местным падежом. Подать в гражданский суд — PODAĆ DO SĄDU CYWILNEGO, предлог DO с родительным." }
  - { kind: pronunciation, text: "Читается «цыви́лны», четыре слога, ударение на втором. Начало выдаёт русского чаще всего: C даёт «ц», а Y даёт «ы», значит «цы», а не «ци». Польское L не такое твёрдое, как русское «л», но в этом словаре оно передаётся через «л», поэтому середина слова это «вил». Конечное Y снова даёт «ы». В мужско-личной форме CYWILNI слышно «цыви́лни»." }
  - { kind: register, text: "Слово нейтральное, из языка права, армии и учреждений: PRAWO CYWILNE «гражданское право», KODEKS CYWILNY «гражданский кодекс», OBRONA CYWILNA «гражданская оборона», LUDNOŚĆ CYWILNA «гражданское население», ODPOWIEDZIALNOŚĆ CYWILNA «гражданская ответственность», которую в страховании сокращают до OC и произносят по буквам. Этот последний ярлык виден на каждом польском полисе автострахования." }
