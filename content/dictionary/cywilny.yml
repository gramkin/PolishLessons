etymology: "Из латинского CIVILIS «гражданский», от CIVIS «гражданин», через средневековую латынь юристов. Русский взял то же слово и в том же значении, поэтому «гражданский» и CYWILNY совпадают в праве и в армии. Разошлись они в готовых оборотах: польский закрепил STAN CYWILNY за семейным положением, а ŚLUB CYWILNY за светской регистрацией брака. Из того же латинского корня в польском выросли CYWIL «штатский» и CYWILIZACJA, так что всё гнездо держится на слове «гражданин»."
memory: "Корень латинский и общий с русским «гражданским», но готовые обороты разошлись, и промахнуться легко трижды. Stan cywilny это семейное положение, а не «гражданское состояние». Ślub cywilny это роспись в загсе, противоположность венчанию, а не сожительство, которое по-польски konkubinat. Гражданская война это wojna domowa. Читается «цыви́лны»: c даёт «ц», y даёт «ы», значит «цы», а не «ци»."
idioms:
