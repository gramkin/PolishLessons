notes:
  - { kind: false-friend, text: "Русская «лавка» значит и скамейку, и небольшой магазин. Польская ŁAWKA — только скамейка, и ничего больше. А магазин по-польски SKLEP, и вот тут вторая ловушка, из самых известных: SKLEP это магазин, а наш «склеп» по-польски KRYPTA. Так что IDĘ DO SKLEPU значит «иду в магазин», а не что-нибудь мрачное." }
  - { kind: usage, text: "Десять форм, женский род, уменьшительное от ŁAWA «скамья». В дательном и местном падежах K переходит в C: ŁAWKA, но NA ŁAWCE. В родительном множественного появляется беглое E: ŁAWEK. Самая частая форма — местный NA ŁAWCE, потому что на скамейке чаще всего сидят." }
  - { kind: government, text: "На скамейке — NA ŁAWCE, местный падеж. А «на скамейку», если садятся, — NA ŁAWKĘ, винительный: SIADŁ NA ŁAWKĘ. Различайте движение и место. Со школьной скамьи — OD SZKOLNEJ ŁAWKI, предлог OD с родительным, и оборот этот значит «с детских лет». Под скамейкой — POD ŁAWKĄ, творительный." }
  - { kind: pronunciation, text: "Читается «уа́фка», два слога, ударение на первом. Буква Ł даёт «у», и слово начинается прямо с «уа», без всякого «л» — для русского уха это самое неожиданное. Буква W перед K оглушается и звучит «ф», поэтому получается «фка», а не «вка». В форме ŁAWCE то же оглушение: «уа́фце»." }
  - { kind: register, text: "Слово нейтральное и повседневное. В парке это просто ŁAWKA, в школе — ŁAWKA SZKOLNA, и ŁAWKA в классе значит ещё и парту. В спорте ŁAWKA REZERWOWYCH это «скамейка запасных», и выражение живёт и в переносном смысле, о том, кого не выпускают на поле. Народных заседателей в суде называют ŁAWNICY, от того же корня." }
collocations:
