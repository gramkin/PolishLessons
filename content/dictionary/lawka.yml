etymology: "Уменьшительное от ŁAWA «скамья», слова праславянского и того же, что русская «лава» и «лавка». У нас слово пошло дальше и стало означать ещё и мелкий магазин: товар выкладывали на лавку, и лавка дала название всей торговле. Польский этого шага не сделал и держит ŁAWKA только за мебелью, а для магазина у него своё слово, SKLEP. Отсюда и расхождение."
memory: "Скамейка, и только она: русская «лавка» значит ещё и магазин, а по-польски магазин это sklep — не путать с нашим «склепом», который по-польски krypta. Читается «уа́фка»: l со штрихом даёт «у», а w перед k оглушается в «ф». В местном падеже k переходит в c: na lawce. Запомните od szkolnej lawki — «со школьной скамьи»."
idioms:
  - { pl: "ławka rezerwowych", ru: "скамейка запасных" }
