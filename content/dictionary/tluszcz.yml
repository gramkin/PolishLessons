notes:
  - { kind: false-friend, text: "Главная ловушка в гнезде: TŁUSTY значит «жирный», а не «толстый». TŁUSTE MLEKO — жирное молоко, TŁUSTA PLAMA — жирное пятно, а «толстый» по-польски GRUBY. TŁUSTY и «толстый» — один корень, но значения разошлись. TŁUSTY CZWARTEK — последний четверг перед постом, когда вся Польша ест пончики." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Родительный — TŁUSZCZU. В родительном множественного две формы, TŁUSZCZÓW и TŁUSZCZY, обе правильные. Множественное число говорит о видах жиров: TŁUSZCZE NASYCONE — «насыщенные жиры»." }
  - { kind: government, text: "Жарить на жиру — SMAŻYĆ NA TŁUSZCZU, местный после NA. Без жира — BEZ TŁUSZCZU, родительный. Обрастать жирком — OBRASTAĆ W TŁUSZCZ, винительный после W, или OBRASTAĆ TŁUSZCZEM, творительный." }
  - { kind: pronunciation, text: "Читается «туушч», один слог. Ł звучит как короткое «у», поэтому начало слова почти «тву». Сочетание SZCZ даёт «шч», как в DESZCZ «дэшч». Русское «щ» вместо «шч» — частая ошибка." }
  - { kind: register, text: "Слово нейтральное, кулинарное и медицинское. OBRASTAĆ W TŁUSZCZ говорят о человеке, который разбогател и обленился, с осуждением, как наше «обрастать жирком»." }
collocations:
  - { pl: "tłuszcz zwierzęcy", ru: "животный жир" }
  - { pl: "tłuszcz roślinny", ru: "растительный жир" }
  - { pl: "spalać tłuszcz", ru: "сжигать жир" }
family:
  - { pl: "tłusty", ru: "жирный", relation: derived }
  - { pl: "tluszczyk", ru: "жирок", relation: derived }
  - { pl: "odtluszczony", ru: "обезжиренный", relation: derived }
etymology: "Слово праславянское, от того же корня, что русское «толстый». Польское TŁ- на месте русского «тол-» — полногласие, как GŁOWA и «голова». В польском корень ушёл к значению «жир», в русском — к «толщине»."
memory: "Tłuszcz — «жир», читается «туушч». Tłusty — жирный, а не толстый: толстый по-польски gruby. Корень один с «толстый», через полногласие, как głowa и «голова». Mleko odtłuszczone — обезжиренное молоко. Obrastać w tłuszcz — обрастать жирком."
idioms:
  - { pl: "obrastać w tłuszcz", ru: "обрастать жирком" }
