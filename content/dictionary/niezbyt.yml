# review
id: niezbyt
format: 2
lemma: "niezbyt"
rank: 1919
pos: adv
pron: { cyr: "не́збыт" }
senses:
  - id: not-very
    ru: "не очень, не слишком"
    examples:
      - pl: "Niezbyt dobrze się czuję."
        ru: "Я не слишком хорошо себя чувствую."
        source: { kind: tatoeba, id: 3604796 }
      - pl: "Niezbyt lubię Toma."
        ru: "Я не очень люблю Тома."
        source: { kind: translated, id: 4953352 }
      - pl: "Niezbyt dobrze cię rozumiem."
        ru: "Я не очень хорошо тебя понимаю."
        source: { kind: translated, id: 7151428 }
  - id: not-much
    ru: "не особенно (с глаголом)"
    examples:
      - pl: "Niezbyt mnie to martwi."
        ru: "Меня это не очень беспокоит."
        source: { kind: translated, id: 6371540 }
      - pl: "Niezbyt ufam tłumaczeniom."
        ru: "Я не очень доверяю переводам."
        source: { kind: translated, id: 364248 }
      - pl: "Chleb, który kupiłem w supermarkecie, jest niezbyt smaczny."
        ru: "Хлеб, который я купил в супермаркете, не очень вкусный."
        source: { kind: tatoeba, id: 12624940 }
notes:
  - { kind: usage, text: "Пишется слитно: niezbyt, а не nie zbyt. Это смягчённое отрицание — «не очень», а не «совсем не»." }
  - { kind: usage, text: "Стоит перед тем словом, которое смягчает: niezbyt dobrze «не очень хорошо», niezbyt lubię «не очень люблю»." }
  - { kind: false-friend, text: "zbyt само по себе значит «слишком»: zbyt dużo «слишком много». Отрицание niezbyt переворачивает это в «не очень»." }
  - { kind: usage, text: "Более разговорные синонимы — nie bardzo и nieszczególnie." }
collocations:
  - { pl: "niezbyt dobrze", ru: "не очень хорошо" }
  - { pl: "niezbyt lubię", ru: "не очень люблю" }
  - { pl: "niezbyt daleko", ru: "не очень далеко" }
family:
  - { pl: "zbyt", ru: "слишком", relation: root, id: zbyt }
  - { pl: "bardzo", ru: "очень", relation: root, id: bardzo }
etymology: "Отрицание nie плюс zbyt «слишком»: буквально «не слишком». Русское «не очень» построено тем же способом."
memory: "niezbyt — «не очень», смягчённое отрицание, пишется слитно. Само zbyt значит «слишком»: zbyt dużo «слишком много»."
idioms:
  - { pl: "niezbyt dobrze", ru: "не очень хорошо" }
  - { pl: "niezbyt daleko", ru: "не очень далеко" }
  - { pl: "niezbyt mądre", ru: "не очень умно" }
