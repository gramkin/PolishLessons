# review
id: szewski
format: 2
lemma: "szewski"
rank: 5876
pos: adj
pron: { cyr: "шэ́фски" }
senses:
  - id: shoemakers
    ru: "сапожный, сапожничий"
    examples:
      - pl: "Ojciec prowadził szewską pracownię."
        ru: "Отец держал сапожную мастерскую."
        source: { kind: authored }
      - pl: "Warsztat szewski mieścił się w piwnicy."
        ru: "Сапожная мастерская располагалась в подвале."
        source: { kind: authored }
      - pl: "Szewskie narzędzia leżały na stole."
        ru: "Сапожные инструменты лежали на столе."
        source: { kind: authored }
  - id: idiomatic
    ru: "в оборотах: szewska pasja «бешенство», szewski poniedziałek «прогул в понедельник»"
    examples:
      - pl: "Na widok bałaganu wpadł w szewską pasję."
        ru: "При виде беспорядка он пришёл в бешенство."
        source: { kind: authored }
      - pl: "Wczoraj zrobił sobie szewski poniedziałek."
        ru: "Вчера он устроил себе прогул в понедельник."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Прилагательное образовано от SZEWC, а SZEWC — это «сапожник», а не «швец». Русское «швец» значит «портной», и тому, кто его знает, легко ошибиться. Польский портной — KRAWIEC. Корень у обоих слов общий, «шить» (SZYĆ), но польский язык отдал его тому, кто шьёт обувь. Отсюда SZEWSKI «сапожный»: WARSZTAT SZEWSKI, NÓŻ SZEWSKI, KLEJ SZEWSKI." }
  - { kind: usage, text: "Два живых оборота встречаются чаще, чем само прямое значение. SZEWSKA PASJA — «бешенство, лютая злость»: SZEWSKA PASJA MNIE BIERZE «меня бешенство берёт», WPAŚĆ W SZEWSKĄ PASJĘ «прийти в ярость». Слово PASJA здесь значит «гнев», а не «страсть». SZEWSKI PONIEDZIAŁEK — прогул в понедельник после воскресного застолья, по старой репутации ремесленников." }
  - { kind: pronunciation, text: "«шэ́фски»: W перед глухим S оглушается в «ф». Во множественном мужско-личном SK переходит в SC: SZEWSCY, «шэ́фсцы». Это то же чередование, что в POLSKI → POLSCY." }
collocations:
  - { pl: "warsztat szewski", ru: "сапожная мастерская" }
  - { pl: "nóż szewski", ru: "сапожный нож" }
  - { pl: "rzemiosło szewskie", ru: "сапожное ремесло" }
family:
  - { pl: "szewc", ru: "сапожник", relation: root }
  - { pl: "szewstwo", ru: "сапожное ремесло", relation: derived }
  - { pl: "szew", ru: "шов", relation: root, id: szew }
etymology: "Образовано от szewc «сапожник» с суффиксом -ski. Само szewc восходит к тому же корню, что szyć «шить» и русские «шить», «швец», «шов»."
memory: "Szewc шьёт сапоги, krawiec — одежду. А когда szewca что-то выводит из себя, это szewska pasja, «бешенство»."
idioms:
  - { pl: "szewska pasja", ru: "бешенство, лютая злость" }
  - { pl: "szewski poniedziałek", ru: "прогул в понедельник" }
