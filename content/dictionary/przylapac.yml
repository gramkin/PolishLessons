etymology: "Приставка PRZY- плюс ŁAPAĆ, а тот — от ŁAPA «лапа», праславянское *lapa, то же слово, что русская «лапа». Исходный образ прямой: взять лапой, сцапать. Русский знает и корень, и образ, но распорядился ими иначе: «лапать» осталось при грубом и переносном значении, а для нейтральной ловли язык взял «ловить» от *loviti, откуда и «лов», и «ловушка». Польский, напротив, сделал ŁAPAĆ своим главным глаголом ловли, оставив ŁOWIĆ охоте и рыбалке: ŁOWIĆ RYBY, но ŁAPAĆ TAKSÓWKĘ. Приставка PRZY- здесь означает застигнуть на месте, подойдя вплотную, как в PRZYŁAPAĆ и PRZYŁĄCZYĆ."
memory: "Корень знаком: łapać от łapa «лапа», то есть «взять лапой». Но по-польски это нейтральный глагол ловли — łapać taksówkę «ловить такси», — тогда как русское «лапать» осталось грубым, а для ловли русский взял «ловить». Управление заучивать целиком: przyłapać kogoś na czymś, винительный плюс na с местным. Na gorącym uczynku значит «с поличным». Пятьдесят три формы — подпись переходного глагола совершенного вида: настоящего времени нет, przyłapię это будущее."
