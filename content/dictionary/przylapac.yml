notes:
  - { kind: false-friend, text: "Опереться на русский глагол нельзя: «прилапать» значит совсем не то и звучит грубо. Польское PRZYŁAPAĆ образовано от ŁAPAĆ «ловить, хватать», а то — от ŁAPA «лапа», и тут корень русскому знаком. Разница в судьбе слова: по-польски ŁAPAĆ это обычный, нейтральный глагол для ловли, а русское «лапать» осталось при грубом значении, и для ловли русский взял другой корень — «ловить», «поймать». Поэтому ŁAPAĆ TAKSÓWKĘ значит «ловить такси», ŁAPAĆ ODDECH — «ловить дыхание», и ничего развязного в этом нет." }
  - { kind: government, text: "Главное в этом глаголе — управление. PRZYŁAPAĆ KOGOŚ NA CZYMŚ: лицо в винительном, а то, за чем застали, с предлогом NA и в местном падеже. PRZYŁAPAĆ UCZNIA NA ŚCIĄGANIU «застать ученика за списыванием», PRZYŁAPAĆ KOGOŚ NA KŁAMSTWIE «уличить во лжи». Русский в этом месте употребляет два разных оборота — «застать за чем-то» с творительным и «поймать на чём-то» с предложным, — и выбрать нужно по смыслу. Устойчивое NA GORĄCYM UCZYNKU отвечает русскому «с поличным» и буквально значит «на горячем деле»." }
  - { kind: usage, text: "Пятьдесят три формы: это подпись переходного глагола совершенного вида. Сорок две формы основного спряжения, плюс деепричастие прошедшего времени PRZYŁAPAWSZY, которое бывает только у совершенного вида, плюс одиннадцать форм страдательного причастия PRZYŁAPANY. Настоящего времени у совершенного вида нет вовсе: PRZYŁAPIĘ, PRZYŁAPIESZ значат будущее. Несовершенный партнёр — PRZYŁAPYWAĆ, и у него, наоборот, есть настоящее и причастие на -ĄCY. В основе чередование: PRZYŁAPAĆ, но PRZYŁAPIĘ с мягким P." }
  - { kind: pronunciation, text: "Читается «пшыуа́пачь», четыре слога, ударение на третьем. Начальное PRZ звучит как «пш», потому что звонкое RZ оглушается после глухого P — то же в PRZEZ и PRZEMOWA. Буква Y даёт «ы», а Ł — «у» неслоговое, поэтому второй слог сливается с третьим в «уа». Конечное -Ć это мягкое «чь». В форме PRZYŁAPIĘ слышно «пшыуа́пен», с носовым Ę на конце. В форме PRZYŁAPAWSZY звучит «пшыуапа́фшы»." }
  - { kind: register, text: "Глагол нейтральный и очень употребительный, с лёгким оттенком неловкости: застают обычно за чем-то, чего делать не следовало. Устойчивые сочетания: PRZYŁAPAĆ NA GORĄCYM UCZYNKU, PRZYŁAPAĆ NA KŁAMSTWIE, PRZYŁAPAĆ SIĘ NA CZYMŚ — последнее возвратное и значит «поймать себя на чём-то», о собственной мысли или привычке, и встречается очень часто. Существительное от глагола — PRZYŁAPANIE, но в живой речи его почти не употребляют, предпочитая придаточное предложение." }
