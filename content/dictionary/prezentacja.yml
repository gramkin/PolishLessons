# review
id: prezentacja
format: 2
lemma: "prezentacja"
rank: 4397
pos: noun
pron: { cyr: "прэзэнта́цья" }
senses:
  - id: presentation
    ru: "презентация, доклад со слайдами"
    examples:
      - pl: "Przygotowałem prezentację na spotkanie."
        ru: "Я подготовил презентацию к встрече."
        source: { kind: authored }
      - pl: "Jej prezentacja zrobiła wrażenie."
        ru: "Её презентация произвела впечатление."
        source: { kind: authored }
      - pl: "Prezentacja trwała pół godziny."
        ru: "Презентация длилась полчаса."
        source: { kind: authored }
  - id: introduction
    ru: "представление, показ (продукта, участников)"
    examples:
      - pl: "Prezentacja nowego modelu odbędzie się w Paryżu."
        ru: "Презентация новой модели пройдёт в Париже."
        source: { kind: authored }
      - pl: "Po prezentacji drużyn zaczął się mecz."
        ru: "После представления команд начался матч."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "PREZENTACJA — «презентация» и «представление»: PREZENTACJA ZAWODNIKÓW, «представление игроков». Не путайте с PREZENT — «подарок». Представлять, презентовать — PREZENTOWAĆ." }
  - { kind: usage, text: "Женский род. Родительный, дательный и местный — PREZENTACJI. Множественное — PREZENTACJE. Звательный и архаичное PREZENTACYJ не используем." }
  - { kind: government, text: "Презентация чего — родительный: PREZENTACJA PROJEKTU. Сделать презентацию — ZROBIĆ PREZENTACJĘ, винительный. На презентации — NA PREZENTACJI, местный." }
  - { kind: pronunciation, text: "Читается «прэзэнта́цья»: PRE и ZE — твёрдые «прэ», «зэ». Ударение на предпоследнем слоге." }
collocations:
  - { pl: "przygotować prezentację", ru: "подготовить презентацию" }
  - { pl: "prezentacja projektu", ru: "презентация проекта" }
  - { pl: "slajdy prezentacji", ru: "слайды презентации" }
family:
  - { pl: "prezentować", ru: "представлять, презентовать", relation: derived }
  - { pl: "pokaz", ru: "показ", relation: root }
  - { pl: "wykład", ru: "лекция", relation: root, id: wyklad }
etymology: "Из латинского PRAESENTATIO «представление», от PRAESENS «присутствующий». Тот же корень, что в PREZENT «подарок»."
memory: "Prezentacja — презентация, а prezent — подарок. Przygotować prezentację — подготовить презентацию. Читается «прэзэнта́цья»."
idioms:
  - { pl: "prezentacja multimedialna", ru: "мультимедийная презентация" }
formExamplesSkip:
