# review
id: zdjac
format: 2
lemma: "zdjąć"
rank: 449
pos: verb
aspect: perf
pron: { cyr: "здёнць" }
senses:
  - id: take-off
    ru: "снять (одежду, предмет)"
    examples:
      - pl: "Proszę zdjąć buty."
        ru: "Снимите, пожалуйста, обувь."
        source: { kind: translated, id: 3313344 }
      - pl: "Zdjął okulary."
        ru: "Он снял очки."
        source: { kind: translated, id: 357706 }
      - pl: "Zdjęła płaszcz."
        ru: "Она сняла пальто."
        source: { kind: translated, id: 768722 }
  - id: photo
    ru: "zdjęcie — отглагольное существительное, ставшее словом «фотография»"
    examples:
      - pl: "Zdjęcie jest czarno-białe."
        ru: "Фотография чёрно-белая."
        source: { kind: tatoeba, id: 6056658 }
      - pl: "Pokazał tobie zdjęcie?"
        ru: "Он показал тебе фотографию?"
        source: { kind: tatoeba, id: 3696314 }
      - pl: "Czy znacie chłopca na tym zdjęciu?"
        ru: "Знаете ли вы мальчика на этом снимке?"
        source: { kind: tatoeba, id: 6313064 }
notes:
  - { kind: usage, text: "Основа будущего времени неправильная: инфинитив zdjąć, но zdejmę, zdejmiesz, zdejmie. Повелительное — zdejmij." }
  - { kind: false-friend, text: "zdjęcie буквально значит «снятие» — и именно так стало словом «фотография», ровно как русское «снимок». Robić zdjęcia — «фотографировать»." }
  - { kind: usage, text: "Внутри сидит старый глагол jąć «брать» — тот же корень, что в wziąć, zająć, pojąć. z- + jąć = «снять, изъять»." }
  - { kind: usage, text: "Несовершенный вид — zdejmować: Zdejmuję płaszcz «Я снимаю пальто», но Zdjąłem płaszcz «Я снял пальто»." }
collocations:
  - { pl: "zdjąć buty", ru: "снять обувь" }
  - { pl: "robić zdjęcia", ru: "фотографировать" }
  - { pl: "na zdjęciu", ru: "на фотографии" }
  - { pl: "zdjąć płaszcz", ru: "снять пальто" }
etymology: "Из z- + jąć «брать» — того же корня, что wziąć, zająć, pojąć; русское «изъять, снять» устроено так же. Отглагольное существительное zdjęcie «снятие» закрепилось в значении «фотография»."
memory: "zdjąć — «снять», а внутри старый глагол jąć «брать», как в wziąć. Запомните неправильное будущее: zdjąć, но zdejmę, zdejmiesz. И лучший мост к русскому — zdjęcie: буквально «снятие», а значит «фотография», ровно как русский «снимок» от «снимать»."
idioms:
  - { pl: "zdjąć komuś kamień z serca", ru: "снять камень с души" }
  - { pl: "robić zdjęcia", ru: "фотографировать" }
  - { pl: "zdjąć mundur", ru: "снять мундир, уйти со службы" }
