notes:
  - { kind: usage, text: "Предложный падеж с чередованием m → mie: w tłumie «в толпе», самая частая форма после именительного." }
  - { kind: usage, text: "Оборот człowiek z tłumu значит «человек из толпы», то есть обыкновенный, ничем не выделяющийся." }
  - { kind: pronunciation, text: "ł читается как «у» краткое, поэтому tłum звучит примерно как «туум», а не «тлум»." }
collocations:
  - { pl: "w tłumie", ru: "в толпе" }
  - { pl: "tłum ludzi", ru: "толпа людей" }
  - { pl: "zniknąć w tłumie", ru: "исчезнуть в толпе" }
etymology: "Праславянское *tьlpa, того же корня, что русское «толпа». Польское ł на месте русского полногласия: tłum против «толп-»."
memory: "tłum — «толпа», читается «туум». Чаще всего встречается в предложном: w tłumie «в толпе», zniknąć w tłumie «исчезнуть в толпе»."
