  - id: in-crowd
    ru: "в толпе, из толпы"
    examples:
      - pl: "Zgubiłem go w tłumie."
        ru: "Я потерял его в толпе."
        source: { kind: translated, id: 359201 }
      - pl: "Zgubiliśmy Jima w tłumie."
        ru: "Мы потеряли Джима в толпе."
        source: { kind: tatoeba, id: 11264094 }
      - pl: "Szybko zniknął w tłumie."
        ru: "Он быстро исчез в толпе."
