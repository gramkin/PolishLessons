# review
id: ostry
format: 2
lemma: "ostry"
rank: 1217
pos: adj
pron: { cyr: "о́стры" }
senses:
  - id: sharp
    ru: "острый (нож, зубы, край)"
    examples:
      - pl: "Nóż nie jest ostry."
        ru: "Нож не острый."
        source: { kind: tatoeba, id: 584830 }
      - pl: "Mój nóż jest ostry."
        ru: "Мой нож острый."
        source: { kind: tatoeba, id: 2585163 }
      - pl: "Zęby lwa są ostre."
        ru: "Зубы льва острые."
        source: { kind: translated, id: 1716761 }
  - id: spicy
    ru: "острый (о еде)"
    examples:
      - pl: "Tom lubi ostre curry."
        ru: "Том любит острое карри."
        source: { kind: translated, id: 565279 }
      - pl: "To curry jest za ostre."
        ru: "Это карри слишком острое."
        source: { kind: translated, id: 10584755 }
      - pl: "Nie powinieneś jeść niczego ostrego."
        ru: "Тебе не следует есть ничего острого."
        source: { kind: translated, id: 3407417 }
  - id: intense
    ru: "острый, резкий, жёсткий (боль, критика, зима)"
    examples:
      - pl: "Poczuła w piersi ostry ból."
        ru: "Она почувствовала острую боль в груди."
        source: { kind: translated, id: 2282337 }
      - pl: "Poczułem nagle ostry ból w żołądku."
        ru: "Я вдруг почувствовал острую боль в желудке."
        source: { kind: translated, id: 925847 }
      - pl: "Jeśli to zrobisz, narazisz się na ostrą krytykę."
        ru: "Если ты это сделаешь, навлечёшь на себя острую критику."
        source: { kind: translated, id: 351990 }
notes:
  - { kind: usage, text: "Ostry покрывает все русские «острые» сразу: нож, еда, боль, критика, угол. Как и в русском, одно слово на все эти смыслы." }
  - { kind: usage, text: "Ostry dyżur — «неотложка», дежурная больница, принимающая экстренных больных." }
  - { kind: usage, text: "О зиме и конкуренции значит «суровый, жёсткий»: ostra zima «суровая зима», ostra konkurencja «жёсткая конкуренция»." }
  - { kind: pronunciation, text: "Сравнительная степень — ostrzejszy, с чередованием r в rz. Превосходная — najostrzejszy." }
collocations:
  - { pl: "ostry nóż", ru: "острый нож" }
  - { pl: "ostre jedzenie", ru: "острая еда" }
  - { pl: "ostry ból", ru: "острая боль" }
  - { pl: "ostra zima", ru: "суровая зима" }
etymology: "Праславянское *ostrъ — то же слово, что русское «острый». Из того же гнезда «остриё» и «острота»."
memory: "ostry — «острый» во всех смыслах сразу: нож, еда, боль, критика, зима. Сравнительная степень ostrzejszy, с чередованием r в rz. И запомните ostry dyżur «неотложка»."
idioms:
  - { pl: "ostry jak brzytwa", ru: "острый как бритва" }
  - { pl: "ostry dyżur", ru: "неотложка, приёмный покой" }
  - { pl: "ostry język", ru: "острый язык" }
formExamplesSkip:
  - { form: "ostrych", cell: "Винительный", reason: "винительный падеж мужско-личного множественного числа от этого слова почти не употребляется" }
