# review
id: meczacy
format: 2
lemma: "męczący"
rank: 5748
pos: adj
pron: { cyr: "мэнчо́нцы" }
senses:
  - id: tiring
    ru: "утомительный, изматывающий (физически)"
    examples:
      - pl: "Trening był męczący, ale krótki."
        ru: "Тренировка была изматывающей, но короткой."
        source: { kind: authored }
      - pl: "Męczący kaszel nie dawał mu spać."
        ru: "Изнуряющий кашель не давал ему спать."
        source: { kind: authored }
      - pl: "To najbardziej męczący odcinek trasy."
        ru: "Это самый утомительный участок маршрута."
        source: { kind: authored }
  - id: tiresome
    ru: "надоедливый, утомительный (психически)"
    examples:
      - pl: "Męcząca rozmowa trwała dwie godziny."
        ru: "Утомительный разговор длился два часа."
        source: { kind: authored }
      - pl: "Bywa męczący, kiedy się upiera."
        ru: "Он бывает утомительным, когда упирается."
        source: { kind: authored }
notes:
  - { kind: government, text: "Действительное причастие от męczyć, застывшее как прилагательное: męczący, męcząca, męczące. Степени передают аналитически — bardziej męczący, najbardziej męczący." }
  - { kind: usage, text: "И о физической нагрузке (męczący trening), и о человеке или разговоре (męcząca rozmowa)." }
  - { kind: usage, text: "Частое: męczący kaszel «изнуряющий кашель», męcząca praca «изматывающая работа»." }
  - { kind: false-friend, text: "Корень тот же, что в русских «мучить» и «мука», но męczący значит «утомительный», а не «мучительный»: последнее по-польски bolesny или dręczący." }
collocations:
  - { pl: "męczący kaszel", ru: "изнуряющий кашель" }
  - { pl: "męcząca praca", ru: "изматывающая работа" }
  - { pl: "męcząca rozmowa", ru: "утомительный разговор" }
family:
  - { pl: "męczyć", ru: "мучить, утомлять", relation: root }
  - { pl: "zmęczenie", ru: "усталость", relation: derived, id: zmeczenie }
etymology: "Действительное причастие настоящего времени от męczyć «мучить, утомлять», закрепившееся как прилагательное. Корень тот же, что в русских «мучить» и «мука», но польское слово мягче по смыслу: оно про утомление, а не про страдание."
memory: "męczący — «утомительный», причастие от męczyć, ставшее прилагательным. Степени только аналитические: bardziej męczący."
idioms:
