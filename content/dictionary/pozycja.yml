        ru: "Том никогда не играл на позиции центрального."
        source: { kind: translated, id: 8617841 }
  - id: status
    ru: "pozycja społeczna — общественное положение"
    examples:
      - pl: "Znasz jego pozycję w firmie?"
        ru: "Ты знаешь его положение в фирме?"
        source: { kind: translated, id: 951402 }
      - pl: "Czy jesteś zadowolony z twojej pozycji w firmie?"
        ru: "Ты доволен своим положением в фирме?"
        source: { kind: translated, id: 722311 }
      - pl: "Luksusowy samochód to symbol pozycji społecznej."
        ru: "Роскошный автомобиль — символ общественного положения."
        source: { kind: translated, id: 981796 }
  - id: item
    ru: "пункт, строка (в списке, меню, счёте)"
    note: "Значения «пункт списка» у русской «позиции» почти нет."
    examples:
      - pl: "Odtłuszczone mleko jest czternastą pozycją na mojej liście zakupów."
        ru: "Обезжиренное молоко — четырнадцатый пункт в моём списке покупок."
        source: { kind: translated, id: 12053412 }
      - pl: "To ostatnia pozycja w menu."
        ru: "Это последний пункт в меню."
        source: { kind: authored }
      - pl: "Sprawdź trzecią pozycję na liście."
        ru: "Проверь третий пункт в списке."
        source: { kind: authored }
notes:
  - { kind: usage, text: "pozycja społeczna — «общественное положение», устойчивое сочетание: symbol pozycji społecznej." }
  - { kind: usage, text: "Третье значение русскому уху непривычно: «пункт, строка» в списке, меню или счёте. Pozycja na liście «пункт в списке»." }
  - { kind: usage, text: "pozycja leżąca, stojąca, siedząca — «положение лёжа, стоя, сидя»: strzelał z pozycji leżącej." }
  - { kind: usage, text: "Слово латинское, из positio «положение», как и русская «позиция», поэтому первые два значения совпадают полностью." }
collocations:
  - { pl: "pozycja społeczna", ru: "общественное положение" }
  - { pl: "pozycja leżąca", ru: "положение лёжа" }
  - { pl: "pozycja na liście", ru: "пункт в списке" }
  - { pl: "zająć pozycję", ru: "занять позицию" }
family:
  - { pl: "pozycjonować", ru: "позиционировать", relation: derived }
etymology: "Из латинского positio «положение» — тем же путём, что и русская «позиция». Первые два значения совпадают, третье польский развил самостоятельно."
memory: "pozycja — «позиция, положение», как в русском. Но есть третье значение, которого русский почти не знает: «пункт» в списке или меню — pozycja na liście. И запомните pozycja społeczna."
idioms:
  - { pl: "pozycja społeczna", ru: "общественное положение" }
  - { pl: "pozycja leżąca", ru: "положение лёжа" }
  - { pl: "zająć pozycję", ru: "занять позицию" }
formExamplesSkip:
