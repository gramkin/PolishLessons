# review
id: pozycja
format: 2
lemma: "pozycja"
rank: 995
pos: noun
pron: { cyr: "позы́цья" }
senses:
  - id: position
    ru: "позиция, положение, поза"
    examples:
      - pl: "Jaka jest najlepsza pozycja do spania?"
        ru: "Какая поза лучше всего для сна?"
        source: { kind: translated, id: 3713588 }
      - pl: "Wystrzelił z pozycji leżącej."
        ru: "Он выстрелил из положения лёжа."
        source: { kind: translated, id: 8652404 }
