notes:
  - { kind: false-friend, text: "СУЩЕСТВИТЕЛЬНОЕ POLITYKA, КАК И РУССКАЯ «ПОЛИТИКА», ЗНАЧИТ ДВА РАЗНЫХ. Это и политика государства, и курс, принятый организацией: polityka firmy «политика фирмы», polityka cenowa «ценовая политика». Английский различает politics и policy, а польский и русский обходятся одним словом — тут они совпадают." }
  - { kind: usage, text: "Мужско-личная форма множественного — POLITYCZNI: polityczni przeciwnicy, komentatorzy polityczni. Человек, занимающийся политикой, — POLITYK, и это слово мужского рода; о женщине говорят pani polityk или polityczka, причём вторая форма ещё спорная." }
  - { kind: pronunciation, text: "Четыре слога, ударение на предпоследнем: po-li-TYCZ-ny. Li звучит мягко, cz как ч, y как ы: «політы́чны». Женская форма polityczna — «політы́чна»." }
collocations:
  - { pl: "partia polityczna", ru: "политическая партия" }
  - { pl: "poprawność polityczna", ru: "политкорректность" }
  - { pl: "więzień polityczny", ru: "политзаключённый" }
family:
  - { pl: "polityka", ru: "политика", relation: root, id: polityka }
  - { pl: "polityk", ru: "политик", relation: derived }
  - { pl: "partia", ru: "партия", relation: root }
etymology: "Из греческого politikos «гражданский, государственный», от polis «город-государство». Через латинское politicus слово разошлось по Европе и дало русское «политический». Корень polis виден в «полиции», «политике» и «метрополии»."
memory: "polityczny — «политический», мужско-личная форма polityczni. И запомни, что polityka, как и русская «политика», значит и государственную политику, и курс фирмы — английский тут делит на politics и policy, а мы нет."
idioms:
  - { pl: "poprawność polityczna", ru: "политкорректность" }
  - { pl: "azyl polityczny", ru: "политическое убежище" }
