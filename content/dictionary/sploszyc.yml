# review
id: sploszyc
format: 2
lemma: "spłoszyć"
rank: 2235
pos: verb
aspect: perf
pron: { cyr: "спуо́шиць" }
senses:
  - id: startle
    ru: "спугнуть, вспугнуть"
    examples:
      - pl: "Spłoszył ptaki hałasem."
        ru: "Он спугнул птиц шумом."
        source: { kind: authored }
      - pl: "Nie spłosz sarny."
        ru: "Не спугни косулю."
        source: { kind: authored }
      - pl: "Światło spłoszyło zwierzę."
        ru: "Свет спугнул зверя."
        source: { kind: authored }
  - id: take-fright
    ru: "испугаться, шарахнуться (spłoszyć się)"
    examples:
      - pl: "Koń spłoszył się przy moście."
        ru: "Конь шарахнулся у моста."
        source: { kind: authored }
      - pl: "Spłoszyła się jak sarna."
        ru: "Она вспорхнула как косуля."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Прежде всего о животных и птицах: спугнуть с места. О людях — с оттенком робости." }
  - { kind: government, text: "Винительный падеж: spłoszyć ptaki. С się значит «испугаться, шарахнуться»." }
  - { kind: false-friend, text: "Корень płochy «пугливый, ветреный»; ср. русское «плохой», но значение разошлось: польское płochy это про робость, а не про качество." }
  - { kind: usage, text: "Несовершенный вид — płoszyć. В корпусе слово не встречается, поэтому все примеры составлены вручную." }
collocations:
  - { pl: "spłoszyć ptaki", ru: "спугнуть птиц" }
etymology: "От płochy «пугливый»; ср. русское «плохой», хотя значение разошлось."
memory: "spłoszyć — «спугнуть», чаще всего птицу или зверя. С się — «шарахнуться». Несовершенный вид — płoszyć."
idioms:
  - { pl: "spłoszyć ptaki", ru: "спугнуть птиц" }
