notes:
  - { kind: usage, text: "РОДИТЕЛЬНЫЙ МНОЖЕСТВЕННОГО У ЭТОГО СЛОВА ДВОЙНОЙ. Правильны обе формы: GARAŻY и GARAŻÓW, и обе встречаются в живой речи. Так же ведут себя płaszcz (płaszczy и płaszczów) и model (modeli и modelów). Это общее свойство основ на мягкий или шипящий согласный." }
  - { kind: pronunciation, text: "Два слога, ударение на первом: GA-raż. Конечное ż оглушается до ш, поэтому слово звучит «га́раш». В родительном garażu слышно звонкое ж: «гара́жу»." }
  - { kind: false-friend, text: "Слово пришло в оба языка из французского garage и значит одно и то же, так что подвоха в смысле нет. Расходится только род в употреблении предлогов: по-польски говорят W garażu «в гараже» и DO garażu «в гараж», где русский в первом случае тоже «в», а во втором — «в» с винительным. Запоминай пару w/do." }
collocations:
  - { pl: "w garażu", ru: "в гараже" }
  - { pl: "do garażu", ru: "в гараж" }
  - { pl: "garaż podziemny", ru: "подземный гараж" }
family:
  - { pl: "samochód", ru: "автомобиль", relation: root, id: samochod }
  - { pl: "parking", ru: "парковка", relation: root, id: parking }
  - { pl: "warsztat", ru: "мастерская", relation: root }
etymology: "Из французского garage «стоянка, укрытие», от garer «ставить под укрытие, отводить в сторону», слова германского происхождения. То же слово дало русский «гараж» и английское garage. Корень родствен немецкому wahren «хранить»."
memory: "garaż — «гараж», и главное тут форма: родительный множественного двойной, garaży и garażów, обе правильны. Конечное ż оглушается, слово звучит «гараш»."
idioms:
  - { pl: "zespół z garażu", ru: "гаражная группа" }
  - { pl: "garaż podziemny", ru: "подземная парковка" }
