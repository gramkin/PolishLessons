notes:
  - { kind: false-friend, text: "Корень тут обманчиво знакомый. Польское WITAĆ происходит от праславянского *vitati «жить, обитать», и приветствие WITAJ значило буквально пожелание жить — как русское «здравствуй» пожелание здоровья. Русский родственник у корня есть, но смысл у него ушёл далеко: «витать» теперь значит «парить, носиться в воздухе», и к приветствию отношения не имеет. Так что опираться на слух нельзя: WITAM — это «приветствую», а не «витаю»." }
  - { kind: usage, text: "WITAM — самое обиходное приветствие в польском, уместное там, где русский скажет «здравствуйте», и особенно частое в письмах и по телефону. Но внимание на вид: приветствуют обычно несовершенным WITAĆ (WITAM PAŃSTWA), а совершенное POWITAĆ описывает уже состоявшуюся встречу — POWITAŁ NAS NA PROGU. Существительное POWITANIE значит «приветствие, встреча», и NA POWITANIE — «при встрече, в знак приветствия»." }
  - { kind: government, text: "Кого — винительный без предлога: POWITAĆ GOŚCI, DELEGACJĘ, KOGOŚ. Чем — творительный без предлога: POWITAĆ CHLEBEM I SOLĄ, BRAWAMI, MILCZENIEM. Это стоит отметить: русский тут вставляет предлог во втором значении — «встретить с облегчением», — а польский говорит и Z ULGĄ с предлогом, и просто BRAWAMI без него. Где — предлог NA с местным: NA PROGU, NA LOTNISKU, NA DWORCU." }
  - { kind: pronunciation, text: "Основа оканчивается на -ITA-, и настоящее время у него на -AM, как у CZYTAĆ: POWITAM, POWITASZ, POWITA. Это не класс на -OWAĆ, несмотря на похожий вид начала слова: приставка po- и корень WITA- случайно дают на письме сочетание, напоминающее -OWA-. Сравните с партией про SPAKOWAĆ и POCHOWAĆ, где ровно такая же ловушка решалась тем же способом: смотреть на корень, а не на хвост." }
collocations:
  - { pl: "powitać gości", ru: "встретить гостей" }
  - { pl: "powitać chlebem i solą", ru: "встретить хлебом и солью" }
  - { pl: "na powitanie", ru: "при встрече, в знак приветствия" }
family:
  - { pl: "witać", ru: "приветствовать", relation: aspect, id: witac }
  - { pl: "powitanie", ru: "приветствие, встреча", relation: derived }
  - { pl: "witaj", ru: "привет, добро пожаловать", relation: derived }
etymology: "Приставка po- и WITAĆ, из праславянского *vitati «жить, обитать, гостить». Приветствие в этом корне — пожелание жить и здравствовать, устроенное точно так же, как русское «здравствуй»: не описание, а пожелание. Русский унаследовал тот же корень в слове «витать», но смысл в нём сместился к «парить, носиться», а приветствие русский построил на другом корне. Польский же сохранил исходное значение именно в приветствии, откуда WITAJ, WITAM, POWITANIE и гостеприимное NIECH BĘDZIE POWITANY."
memory: "witać не связано с русским «витать» по смыслу: корень значил «жить», и witaj — пожелание жить, как «здравствуй» — пожелание здоровья. А powitam, не powituję: основа wita-, а не -ować."
idioms:
  - { pl: "powitać chlebem i solą", ru: "встретить хлебом и солью" }
  - { pl: "na powitanie", ru: "при встрече, в знак приветствия" }
