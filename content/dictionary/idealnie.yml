# review
id: idealnie
format: 2
lemma: "idealnie"
rank: 1935
pos: adv
pron: { cyr: "идэа́льне" }
senses:
  - id: perfectly
    ru: "идеально, отлично"
    examples:
      - pl: "Idealnie!"
        ru: "Идеально!"
        source: { kind: translated, id: 8608362 }
      - pl: "Pasuje idealnie."
        ru: "Подходит идеально."
        source: { kind: translated, id: 766092 }
      - pl: "Teraz jest idealnie."
        ru: "Теперь идеально."
        source: { kind: translated, id: 8429272 }
  - id: perfectly-fit
    ru: "идеально (подходить, понимать)"
    examples:
      - pl: "Te spodnie pasują na mnie idealnie."
        ru: "Эти брюки сидят на мне идеально."
        source: { kind: translated, id: 832615 }
      - pl: "Idealnie go rozumiem."
        ru: "Я его отлично понимаю."
        source: { kind: translated, id: 577402 }
      - pl: "Koszula, którą mi dałeś, pasuje idealnie."
        ru: "Рубашка, которую ты мне дал, сидит идеально."
        source: { kind: translated, id: 3853625 }
notes:
  - { kind: usage, text: "Степени сравнения idealniej и najidealniej образуются, но идеал по смыслу абсолютен, поэтому формы звучат нарочито; в нейтральной речи говорят просто idealnie или bardziej odpowiedni. То же самое с oczywistszy." }
  - { kind: usage, text: "Чаще всего про одежду и совпадения: pasuje idealnie «подходит идеально», pasować idealnie — самое частое сочетание." }
  - { kind: usage, text: "Само по себе Idealnie! работает как восклицание «Отлично!», «То что надо!»." }
  - { kind: false-friend, text: "Слово совпадает с русским «идеально», но в разговоре поляки чаще скажут świetnie или doskonale «отлично»." }
  - { kind: usage, text: "Прилагательное — idealny «идеальный»; сравнительная и превосходная степени наречия почти не употребляются." }
collocations:
  - { pl: "pasuje idealnie", ru: "подходит идеально" }
  - { pl: "idealnie czysty", ru: "идеально чистый" }
  - { pl: "idealnie!", ru: "отлично!" }
family:
  - { pl: "idealny", ru: "идеальный", relation: root, id: idealny }
  - { pl: "ideał", ru: "идеал", relation: root }
  - { pl: "doskonale", ru: "отлично", relation: root, id: doskonale }
etymology: "От idealny «идеальный», из греческого idea через латынь. Русское «идеально» пришло тем же путём."
memory: "idealnie — «идеально»: pasuje idealnie «подходит идеально». Само по себе Idealnie! значит «Отлично!». Прилагательное — idealny."
idioms:
