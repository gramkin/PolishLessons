notes:
  - { kind: usage, text: "Корень слова стоит разобрать целиком, потому что тут польский и русский сделали одно и то же разными средствами. SAMOCHÓD — это сложение SAMO- «само-» и CHÓD «ход», то есть буквально «самоход». Русский для той же вещи взял греко-латинское «автомобиль», где autos значит «сам», а mobilis «движимый», — то есть кальку того же понятия, но из чужих корней. Польский собрал слово из своих. Русский, кстати, тот же состав знает: «самоход» и «самоходка» существуют, только значение у них узкое, военное." }
  - { kind: pronunciation, text: "В существительном SAMOCHÓD стоит ó, а в прилагательном SAMOCHODOWY — обычное o. Причина позиционная: в samochód слог закрывается согласным и гласная удлиняется, а прилагательное образовано от открытой основы samochodu, где удлинения нет. Сравните с карточкой ŚWIĄTECZNY, где вышло наоборот: там прилагательное взяло огласовку закрытого слога (świąt) и сохранило ą. Значит производное слово наследует ту основу, к которой прицепился суффикс, и гласная в нём следует из этой основы, а не из именительного падежа." }
  - { kind: usage, text: "Форм одиннадцать, степеней сравнения нет: десятое такое прилагательное в словаре после fizyczny, miejscowy, kredytowy, sądowy, włoski, brytyjski, podstawowy, świąteczny и letni, которое отличалось мягкой основой и десятью формами. Здесь основа твёрдая, и мужская личная форма множественного отдельная — SAMOCHODOWI, хотя говорить так приходится редко: о людях это прилагательное почти не употребляется." }
