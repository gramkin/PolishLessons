etymology: "От SAMOCHÓD, сложения SAMO- и CHÓD «ход», из праславянского *xodъ — того же корня, что русское «ход» и «ходить». Слово появилось на рубеже девятнадцатого и двадцатого веков, когда понадобилось назвать новую вещь, и польский сложил название из своих корней, а русский взял готовое европейское «автомобиль». Значение у обоих одно и то же, буквально «самодвижущийся», и разница только в том, чьи корни пошли в дело."
memory: "samochód — буквально «самоход», где русский взял «автомобиль». И ó только в samochód: прилагательное от открытой основы, отсюда samochodowy с простым o."
