notes:
  - { kind: register, text: "Книжное слово, обычное в официальных и научных текстах. В разговоре проще: CZY TO JEST PRAWIDŁOWE? «это правильно?»" }
  - { kind: usage, text: "Два значения: «правильность» (PRAWIDŁOWOŚĆ DANYCH) и «закономерность» (PRAWIDŁOWOŚCI ROZWOJU). Антоним NIEPRAWIDŁOWOŚĆ — «нарушение», чаще во множественном: WYKRYTO NIEPRAWIDŁOWOŚCI «выявлены нарушения»." }
  - { kind: pronunciation, text: "Читается «правидуо́восьць»: Ł — «у», не «л». Ударение на предпоследнем слоге." }
collocations:
  - { pl: "sprawdzić prawidłowość", ru: "проверить правильность" }
  - { pl: "prawidłowość działania", ru: "правильность работы" }
  - { pl: "prawidłowości rozwoju", ru: "закономерности развития" }
family:
  - { pl: "prawidłowy", ru: "правильный", relation: root, id: prawidlowy }
  - { pl: "prawidłowo", ru: "правильно", relation: root }
  - { pl: "prawidło", ru: "колодка; (устар.) правило", relation: root }
  - { pl: "nieprawidłowość", ru: "нарушение, неправильность", relation: antonym }
synonyms: ["reguła", "zasada", "poprawność"]
etymology: "От PRAWIDŁOWY «правильный» с суффиксом -OŚĆ; в основе PRAWIDŁO «правило», того же корня, что PRAWO и русские «право», «правило»."
memory: "Prawidłowość — правильность; во втором значении — закономерность: то, что идёт по правилу (prawidło)."
