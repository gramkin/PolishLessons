# review
id: dziewiec
format: 2
lemma: "dziewięć"
rank: 1853
pos: num
pron: { cyr: "дзе́венць" }
senses:
  - id: nine
    ru: "девять"
    examples:
      - pl: "Spałem dziewięć godzin."
        ru: "Я спал девять часов."
        source: { kind: translated, id: 350813 }
      - pl: "Ile to dziewięć minus sześć?"
        ru: "Сколько будет девять минус шесть?"
        source: { kind: translated, id: 524734 }
      - pl: "Jeden, dwa, trzy, cztery, pięć, sześć, siedem, osiem, dziewięć, dziesięć."
        ru: "Один, два, три, четыре, пять, шесть, семь, восемь, девять, десять."
        source: { kind: tatoeba, id: 1465638 }
  - id: nine-more
    ru: "девять (в счёте, в возрасте)"
    examples:
      - pl: "Mam osiemdziesiąt dziewięć lat."
        ru: "Мне восемьдесят девять лет."
        source: { kind: translated, id: 11302421 }
      - pl: "Naliczyłem dziewięć - to znaczy, że jednej brakuje."
        ru: "Я насчитал девять - значит, одной не хватает."
        source: { kind: tatoeba, id: 13084378 }
      - pl: "Jedna trzecia z dziewięciu to trzy."
        ru: "Одна треть от девяти — это три."
        source: { kind: translated, id: 5647767 }
notes:
  - { kind: government, text: "После dziewięć существительное стоит в родительном падеже множественного числа: dziewięć godzin «девять часов», dziewięć lat «девять лет» — точно как в русском." }
  - { kind: usage, text: "Форма dziewięciu употребляется с мужскими лицами и в косвенных падежах: pierwiastek z dziewięciu «корень из девяти»." }
  - { kind: usage, text: "Собирательная форма dziewięcioro считает смешанные группы и детей: dziewięcioro dzieci «девятеро детей»." }
  - { kind: false-friend, text: "Слово то же, что русское «девять», только польское начинается с dzie-: dziewięć, dziesięć, dziewiąty." }
collocations:
  - { pl: "dziewięć godzin", ru: "девять часов" }
  - { pl: "dziewięć lat", ru: "девять лет" }
  - { pl: "dziewięcioro dzieci", ru: "девятеро детей" }
family:
  - { pl: "dziewiąty", ru: "девятый", relation: root }
  - { pl: "dziesięć", ru: "десять", relation: root, id: dziesiec }
  - { pl: "osiem", ru: "восемь", relation: root, id: osiem }
etymology: "Праславянское *devętь — то же слово, что русское «девять»; польское dzie- на месте русского «де-», как в dziesięć «десять»."
memory: "dziewięć — «девять», и управляет так же: dziewięć godzin, родительный падеж множественного числа. С мужскими лицами — dziewięciu."
