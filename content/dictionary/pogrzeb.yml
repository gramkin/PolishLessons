pos: noun
pron: { cyr: "по́гжэп" }
senses:
  - id: funeral
    ru: "похороны"
    examples:
      - pl: "Pogrzeb jest jutro."
        ru: "Похороны завтра."
        source: { kind: translated, id: 5954514 }
      - pl: "Pogrzeb był wczoraj."
        ru: "Похороны были вчера."
        source: { kind: translated, id: 8954587 }
      - pl: "Nie przychodź na mój pogrzeb."
        ru: "Не приходи на мои похороны."
        source: { kind: translated, id: 6305415 }
      - pl: "Pogrzeb Toma będzie w ten weekend."
        ru: "Похороны Тома будут в эти выходные."
        source: { kind: translated, id: 3300332 }
      - pl: "Bierzemy udział w pogrzebie."
        ru: "Мы участвуем в похоронах."
        source: { kind: translated, id: 881982 }
      - pl: "Nie byłem na jego pogrzebie."
        ru: "Я не был на его похоронах."
        source: { kind: translated, id: 3427555 }
  - id: funerals-general
    ru: "похороны как обряд вообще"
    examples:
      - pl: "Nienawidzę pogrzebów."
        ru: "Я ненавижу похороны."
        source: { kind: translated, id: 8388751 }
      - pl: "Zawsze chodź na pogrzeby innych bo inaczej oni nie przyjdą na twój."
        ru: "Всегда ходи на чужие похороны, иначе они не придут на твои."
        source: { kind: translated, id: 8745910 }
notes:
  - { kind: usage, text: "В польском это существительное мужского рода единственного числа: pogrzeb jest jutro «похороны завтра», буквально «похорон есть завтра». В русском слово только множественное." }
  - { kind: usage, text: "Предложный падеж — na pogrzebie «на похоронах»: byłem na pogrzebie «я был на похоронах»." }
  - { kind: false-friend, text: "Не путайте с формой глагола pogrzebać: pogrzeb в значении «покопайся» — это повелительное наклонение, совсем другое слово по употреблению." }
  - { kind: false-friend, text: "Русское «похороны» существует только во множественном числе, а польское pogrzeb — обычное единственное: jeden pogrzeb, do pogrzebu, przed pogrzebem. Множественное pogrzeby значит «несколько разных похорон»." }
collocations:
  - { pl: "pogrzeb jest jutro", ru: "похороны завтра" }
  - { pl: "na pogrzebie", ru: "на похоронах" }
  - { pl: "pójść na pogrzeb", ru: "пойти на похороны" }
etymology: "От po- + grzebać «копать, рыть», того же корня, что русское «грести» и «погребать». Русское «погребение» — прямой двойник этого слова."
memory: "pogrzeb — «похороны», но по-польски это единственное число мужского рода: Pogrzeb jest jutro. На похоронах — na pogrzebie."
idioms:
  - { pl: "na pogrzebie", ru: "на похоронах" }
  - { pl: "pójść na pogrzeb", ru: "пойти на похороны" }
  - { pl: "pogrzeb jest jutro", ru: "похороны завтра" }
formExamplesSkip:
