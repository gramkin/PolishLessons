  - id: arched
    ru: "сводчатый (причастие sklepiony)"
    examples:
      - pl: "Sklepiona sala robi wrażenie."
        ru: "Сводчатый зал производит впечатление."
        source: { kind: authored }
      - pl: "Wszedł pod sklepiony strop."
        ru: "Он вошёл под сводчатый потолок."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Специальный архитектурный глагол. В живой речи встречается почти исключительно причастие sklepiony «сводчатый»." }
  - { kind: false-friend, text: "Главная ловушка: sklep в современном польском значит «магазин», но корень тут другой по смыслу — sklepienie «свод». Исторически магазин и был сводчатым подвалом." }
  - { kind: government, text: "Винительный падеж; несовершенный вид — sklepiać." }
  - { kind: usage, text: "В корпусе для этого глагола нет ни одного примера: все совпадения приходятся на существительное sklep «магазин», у которого своя карточка." }
  - { kind: government, text: "Страдательное причастие описывает постройку: sklepiony strop, sala sklepiona łukiem. Мужско-личной формы sklepieni нет — сводом перекрывают здание, а не людей." }
collocations:
  - { pl: "sklepiony strop", ru: "сводчатый потолок" }
  - { pl: "sklepienie kościoła", ru: "свод костёла" }
etymology: "От sklepienie «свод», к klepać «сбивать, складывать»; исторически магазин sklep и был сводчатым подвалом."
memory: "sklepić — «возводить свод». Ловушка: sklep сегодня значит «магазин», а родственное sklepienie — «свод». Живёт в основном причастие sklepiony «сводчатый»."
idioms:
  - { pl: "sklepiony strop", ru: "сводчатый потолок" }
formExamplesSkip:
  - { form: "sklep", reason: "форма омонима: в корпусе sklep — это существительное «магазин», у него своя карточка" }
  - { form: "sklepieni", reason: "винительное дополнение у глагола — постройка: sklepić kaplicę, sklepić nawę, sklepić strop. Человека сводом не перекрывают, поэтому мужско-личной формы страдательного причастия у глагола нет, хотя sklepiony strop и sklepiona sala совершенно обычны" }
