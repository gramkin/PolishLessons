# review
id: federalny
format: 2
lemma: "federalny"
rank: 1743
pos: adj
pron: { cyr: "фэдэра́льны" }
senses:
  - id: federation
    ru: "федеральный, федеративный (о государстве)"
    examples:
      - pl: "Jestem z Rzeczpospolitej Polskiej, a ty z Republiki Federalnej Niemiec."
        ru: "Я из Республики Польша, а ты из Федеративной Республики Германия."
        source: { kind: translated, id: 5229151 }
      - pl: "Udało się przetłumaczyć oficjalny tekst hymnu narodowego Republiki Federalnej Niemiec (trzecą strofę \"pieśni Niemców\") na tatarkski język bez znaczącego zniekształcenia treści i ducha."
        ru: "Удалось перевести официальный текст гимна Федеративной Республики Германия."
        source: { kind: translated, id: 3284938 }
      - pl: "Niemcy są państwem federalnym."
        ru: "Германия — федеративное государство."
        source: { kind: authored }
  - id: federal-body
    ru: "федеральный (об органах власти, учреждениях)"
    examples:
      - pl: "Tom został skazany na trzy lata w wiezieniu federalnym."
        ru: "Тома приговорили к трём годам в федеральной тюрьме."
        source: { kind: translated, id: 6155632 }
      - pl: "To jest sprawa federalna."
        ru: "Это федеральное дело."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Слово книжное и почти всегда стоит при названиях: Republika Federalna Niemiec «ФРГ», więzienie federalne «федеральная тюрьма», policja federalna «федеральная полиция»." }
  - { kind: usage, text: "Существительное — federacja «федерация»; Польша не федерация, поэтому слово чаще всего про Германию и США." }
  - { kind: government, text: "Склоняется как обычное прилагательное и согласуется с существительным: federalna policja, federalnego sądu, w federalnym więzieniu." }
  - { kind: false-friend, text: "Русское «федеральный» и «федеративный» по-польски одно слово — federalny." }
