id: warga
format: 2
lemma: "warga"
rank: 5359
pos: noun
pron: { cyr: "ва́рга" }
senses:
  - id: lip
    ru: "губа"
    examples:
      - pl: "Przygryzła dolną wargę."
        ru: "Она прикусила нижнюю губу."
        source: { kind: authored }
      - pl: "Ma spierzchnięte wargi."
        ru: "У него обветренные губы."
        source: { kind: authored }
      - pl: "Na górnej wardze ma bliznę."
        ru: "На верхней губе у него шрам."
        source: { kind: authored }
      - pl: "Wargi zaczęły jej drżeć."
        ru: "Её губы задрожали."
        source: { kind: authored }
      - pl: "Rozciął sobie wargę o szklankę."
        ru: "Он рассёк себе губу о стакан."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "WARGA — анатомическая «губа», чаще одна: GÓRNA WARGA, DOLNA WARGA. О губах как о рте в целом говорят USTA: UMALOWAĆ USTA, «накрасить губы», POCAŁOWAĆ W USTA, «поцеловать в губы»." }
  - { kind: usage, text: "Девять живых форм, женский род. В дательном и местном G переходит в DZ: NA WARDZE. Родительный множественного — WARG. Звательный не даётся." }
  - { kind: government, text: "Прикусить губу — PRZYGRYŹĆ WARGĘ, винительный. На губе — NA WARDZE, местный. Заячья губа — ZAJĘCZA WARGA." }
  - { kind: pronunciation, text: "Читается «ва́рга», ударение на первом слоге. В форме WARDZE: «ва́рдзэ»." }
collocations:
  - { pl: "dolna warga", ru: "нижняя губа" }
  - { pl: "przygryźć wargę", ru: "прикусить губу" }
  - { pl: "spierzchnięte wargi", ru: "обветренные губы" }
family:
  - { pl: "wargowy", ru: "губной", relation: derived }
  - { pl: "zajęcza warga", ru: "заячья губа", relation: derived }
  - { pl: "usta", ru: "рот, губы", relation: root, id: usta }
etymology: "Старое славянское слово для губы; в русском на его месте «губа». Польский употребляет WARGA анатомически, а USTA — для рта и губ в обиходе."
memory: "Warga — губа (анатомически): dolna warga — нижняя губа. Губы как рот — usta. Читается «ва́рга». Na wardze — на губе (g→dz)."
idioms:
  - { pl: "zagryźć wargi", ru: "закусить губы, сдержаться" }
formExamplesSkip:
