notes:
  - { kind: usage, text: "Женский род на -ość, как wolność и miłość. Родительный, дательный и предложный совпадают — rzeczywistości." }
  - { kind: usage, text: "w rzeczywistości — «на самом деле, в действительности», очень частый оборот: W rzeczywistości on był przestępcą." }
  - { kind: usage, text: "stać się rzeczywistością — «стать реальностью, сбыться» о мечте: Moje marzenie stało się rzeczywistością." }
  - { kind: false-friend, text: "Корень слова — rzecz «вещь, дело», а вовсе не «речь», хотя это одно и то же праславянское слово. Русская «речь» и польское rzecz разошлись по значению, и путать их нельзя." }
collocations:
  - { pl: "w rzeczywistości", ru: "на самом деле" }
  - { pl: "stać się rzeczywistością", ru: "стать реальностью" }
  - { pl: "rzeczywistość wirtualna", ru: "виртуальная реальность" }
etymology: "От rzeczywisty «действительный», а то — от rzecz «вещь» (праславянское *rěčь, то же слово, что русская «речь»). Русская «действительность» собрана от «действовать», поэтому образ в двух языках разный."
memory: "rzeczywistość — «действительность, реальность», от rzecz «вещь». Главный оборот — w rzeczywistości «на самом деле». И запомните ловушку корня: rzecz значит «вещь», а не «речь», хотя слово этимологически то же самое."
idioms:
