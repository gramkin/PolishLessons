# review
id: przemoc
format: 2
lemma: "przemoc"
rank: 1803
pos: noun
pron: { cyr: "пшэ́моц" }
senses:
  - id: violence
    ru: "насилие"
    examples:
      - pl: "Co znaczy przemoc?"
        ru: "Что значит насилие?"
        source: { kind: translated, id: 11519764 }
      - pl: "Przemoc to rak naszego społeczeństwa."
        ru: "Насилие — рак нашего общества."
        source: { kind: translated, id: 362074 }
      - pl: "Krew i przemoc ich fascynuje."
        ru: "Кровь и насилие их завораживают."
        source: { kind: translated, id: 1801392 }
  - id: against-violence
    ru: "насилие (отвращение, применение)"
    examples:
      - pl: "Brzydzę się przemocą."
        ru: "Мне отвратительно насилие."
        source: { kind: translated, id: 3850195 }
      - pl: "Nie lubimy przemocy."
        ru: "Мы не любим насилие."
        source: { kind: translated, id: 2282444 }
      - pl: "Musiał odwołać się do przemocy."
        ru: "Ему пришлось прибегнуть к насилию."
        source: { kind: translated, id: 840253 }
notes:
  - { kind: government, text: "Прибегнуть к насилию — odwołać się do przemocy или uciec się do przemocy, с родительным падежом после do." }
  - { kind: usage, text: "przemoc domowa — «домашнее насилие», стандартный термин; przemoc w telewizji — «насилие на телевидении»." }
  - { kind: usage, text: "Слово женского рода и не имеет обычного множественного числа, как и русское «насилие»." }
  - { kind: false-friend, text: "Образовано от przemóc «пересилить», приставка prze- плюс moc «сила, мощь»: буквально «пересиливание». Русское «насилие» построено от «сила» — тот же образ." }
collocations:
  - { pl: "przemoc domowa", ru: "домашнее насилие" }
  - { pl: "uciec się do przemocy", ru: "прибегнуть к насилию" }
  - { pl: "bez przemocy", ru: "без насилия" }
family:
  - { pl: "przemóc", ru: "пересилить", relation: root }
  - { pl: "moc", ru: "сила, мощь", relation: root }
  - { pl: "siła", ru: "сила", relation: root, id: sila }
etymology: "Приставка prze- «пере-» плюс moc «сила, мощь»: буквально «пересиливание». Русское «насилие» построено от «сила» — образ тот же."
memory: "przemoc — «насилие», женского рода: ta przemoc. Прибегнуть к насилию — uciec się do przemocy, родительный падеж. Домашнее насилие — przemoc domowa."
