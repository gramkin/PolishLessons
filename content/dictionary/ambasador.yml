notes:
  - { kind: false-friend, text: "Русское «посол» и польское AMBASADOR не похожи вовсе: русское слово от «посылать», польское — из западноевропейских языков. Угадать нельзя, зато запомнить легко через AMBASADA «посольство», где корень тот же. Осторожнее с новым русским употреблением: в русском появилось слово «амбассадор» в значении лица, представляющего бренд, и в этом узком смысле оно польскому AMBASADOR MARKI действительно отвечает. Но в дипломатии русский говорит только «посол», и перевести AMBASADOR FRANCJI как «амбассадор Франции» нельзя. Пишется польское слово с одной S, в отличие от нового русского с двумя." }
  - { kind: government, text: "Мужской род, одушевлённое, лицо. Винительный равен родительному: WIDZIELI AMBASADORA. Местный и звательный AMBASADORZE, с чередованием R в RZ. Самое интересное — именительный множественного: у этого слова их два, AMBASADOROWIE и AMBASADORZY, и оба нормативны. Форма на -OWIE звучит более официально и чаще встречается в дипломатическом языке, форма на -RZY обычнее в газетной речи. Так ведут себя многие названия должностей на -OR: PROFESOROWIE и PROFESORZY, SENATOROWIE и SENATORZY. Чей посол — родительный: AMBASADOR POLSKI." }
  - { kind: pronunciation, text: "Читается «амбаса́дор», ударение на предпоследнем слоге из четырёх. Одна S читается как «с», и удваивать её не нужно. Конечное R звучит ясно. В местном падеже AMBASADORZE сочетание RZ даёт «ж»: «амбасадо́же», и ударение сдвигается на предпоследний слог, то есть на четвёртый из пяти. В именительном множественного AMBASADORZY слышно «амбасадо́жы», а в AMBASADOROWIE — «амбасадоро́ве», где ударение опять на предпоследнем." }
  - { kind: usage, text: "Частотные сочетания: AMBASADOR POLSKI W NIEMCZECH, AMBASADOR NADZWYCZAJNY I PEŁNOMOCNY «посол чрезвычайный и полномочный», WEZWAĆ AMBASADORA «вызвать посла», AMBASADA «посольство». Женская форма AMBASADORKA употребляется в значении представительницы дела или бренда, а о дипломате обычно говорят PANI AMBASADOR, оставляя слово неизменным. Прилагательное AMBASADORSKI означает «посольский». В переносном смысле AMBASADOR CZEGOŚ это тот, кто чему-то служит лицом, и оборот этот в польском вполне обиходный." }
