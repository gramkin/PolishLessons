etymology: "Через французское AMBASSADEUR из итальянского AMBASCIATORE, а оно из латинизированного AMBACTIA «поручение, служба», восходящего к галльскому AMBACTUS «посланный вокруг» — из AMBI- «вокруг» и корня со значением «гнать, вести». То есть исходно это тот, кого отправили с поручением, и смысл совпадает с русским «послом», только корень взят из другого языка: русский построил слово от «посылать», польский заимствовал готовое. Из того же источника AMBASADA «посольство» и во всех западноевропейских языках EMBASSY, AMBASSADE, AMBASCIATA. Польский упростил удвоенную S французского написания, как делает почти всегда, и потому пишется AMBASADOR, а не ambassador."
memory: "Посол, но слово западное: ambasador, ambasada, и русской подсказки нет — «посол» от «посылать». Одна S, в отличие от нового русского «амбассадора», который годится только для бренда: ambasador marki — «представитель бренда», но ambasador Francji — только «посол». Два именительных множественного, ambasadorowie и ambasadorzy, оба правильные, как profesorowie и profesorzy. Местный ambasadorze с r→rz."
