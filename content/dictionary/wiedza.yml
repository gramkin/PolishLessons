# review
id: wiedza
format: 2
lemma: "wiedza"
rank: 1494
pos: noun
pron: { cyr: "ве́дза" }
senses:
  - id: knowledge
    ru: "знание, знания"
    examples:
      - pl: "Wiedza to potęga."
        ru: "Знание — сила."
        source: { kind: translated, id: 919776 }
      - pl: "Wiedzę zyskujemy tylko poprzez naukę."
        ru: "Знания мы получаем только через учёбу."
        source: { kind: translated, id: 351935 }
      - pl: "Ona ma małą wiedzę z fizyki."
        ru: "У неё небольшие познания в физике."
        source: { kind: translated, id: 2970086 }
  - id: awareness
    ru: "ведома, осведомлённость (bez wiedzy)"
    examples:
      - pl: "Anna wzięła ślub bez wiedzy rodziców."
        ru: "Анна вышла замуж без ведома родителей."
        source: { kind: translated, id: 366034 }
      - pl: "Wedle mojej wiedzy, on jest winny."
        ru: "Насколько мне известно, он виновен."
        source: { kind: translated, id: 525666 }
notes:
  - { kind: false-friend, text: "Формы wiedzą и wiedz в корпусе почти всегда принадлежат глаголу wiedzieć «знать», который уже есть карточкой: Wszyscy to wiedzą «Все это знают», Wiedz, że… «Знай, что…». К существительному они отношения не имеют." }
  - { kind: usage, text: "Женский род, неисчисляемое: wiedza, wiedzy, wiedzę. Множественного в обычной речи нет." }
  - { kind: government, text: "bez wiedzy kogoś — «без ведома кого-либо», с родительным: bez wiedzy rodziców. Wedle mojej wiedzy — «насколько мне известно»." }
  - { kind: usage, text: "Рядом стоят wiedzieć «знать (факт)», znać «знать (быть знакомым)» и nauka «наука, учёба» — все три уже есть карточками." }
collocations:
  - { pl: "wiedza to potęga", ru: "знание — сила" }
  - { pl: "bez wiedzy", ru: "без ведома" }
  - { pl: "zdobywać wiedzę", ru: "получать знания" }
etymology: "От wiedzieć «знать» (праславянское *věděti). Русские «ведать», «ведение» и «невежда» того же корня, поэтому bez wiedzy буквально значит «без ведома»."
memory: "wiedza — «знание», от wiedzieć «знать», как русское «ведать». Главная трудность — формы: wiedzą и wiedz почти всегда принадлежат глаголу. Wszyscy to wiedzą это «Все это знают». А bez wiedzy буквально «без ведома»."
