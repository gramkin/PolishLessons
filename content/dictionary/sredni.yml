  - { pl: "średnia temperatura", ru: "средняя температура" }
family:
  - { pl: "środek", ru: "середина; средство", relation: root, id: srodek }
  - { pl: "średnia", ru: "среднее; средний балл", relation: derived }
  - { pl: "średniowiecze", ru: "средневековье", relation: derived }
  - { pl: "bezpośredni", ru: "непосредственный, прямой", relation: derived, id: bezposredni }
etymology: "От того же корня, что środek «середина» и приставка śród-, из праславянского *serd-, давшего русские «середина», «средний» и «сердце». Русское «средний» — церковнославянская огласовка того же слова, польское — своя. Отсюда średnio «в среднем», średnia «среднее», średniowiecze «средневековье» и bezpośredni «непосредственный»."
memory: "średni — «средний», совпадение полное. Запомните две мелочи: форм десять, а не одиннадцать, потому что основа мягкая и średni служит сразу мужскому единственному и мужско-личному множественному, как tani; и разговорный оттенок «так себе» — film był średni."
