# review
id: sredni
format: 2
lemma: "średni"
rank: 2135
pos: adj
pron: { cyr: "сьрэ́дни" }
senses:
  - id: average-size
    ru: "средний (по размеру, уровню)"
    examples:
      - pl: "Jest średniego wzrostu."
        ru: "Он среднего роста."
        source: { kind: authored }
      - pl: "To firma średniej wielkości."
        ru: "Это фирма средних размеров."
        source: { kind: authored }
  - id: mean
    ru: "средний (арифметическое среднее); średnia — среднее, средний балл"
    examples:
      - pl: "Średnia temperatura w lipcu to dwadzieścia stopni."
        ru: "Средняя температура в июле — двадцать градусов."
        source: { kind: authored }
      - pl: "Ma najwyższą średnią w klasie."
        ru: "У него самый высокий средний балл в классе."
        source: { kind: authored }
  - id: mediocre
    ru: "разг. посредственный, так себе"
    examples:
      - pl: "Film był średni, ale aktorzy dobrzy."
        ru: "Фильм был так себе, но актёры хорошие."
        source: { kind: authored }
      - pl: "Wyniki były średnie, nic więcej."
        ru: "Результаты были средние, не более."
        source: { kind: authored }
notes:
  - { kind: usage, text: "ПОЧЕМУ ФОРМ ДЕСЯТЬ, А НЕ ОДИННАДЦАТЬ. Основа мягкая, и мужской род единственного числа совпадает с мужско-личным множественным: średni uczeń и średni uczniowie — одна и та же форма. Ровно та же особенность у tani и у bezpośredni, которое и вовсе этот же корень с приставкой. Степеней сравнения у średni нет, так что таблица на этом и заканчивается." }
  - { kind: false-friend, text: "Со «средним» совпадает полностью, вплоть до производных: szkoła średnia «средняя школа», wiek średni — и «средние века», и «средний возраст», średnia krajowa «средняя зарплата по стране». Отличие одно, разговорное: film był średni значит «фильм так себе», а на вопрос Jak leci? ответ Średnio переводится как «не очень». Русское прилагательное такого оттенка почти не знает." }
  - { kind: pronunciation, text: "ś звучит как сь: «сьрэ́дни», ударение на предпоследнем слоге. Там, где в русском твёрдое с перед р, в польском стоит мягкое ś — то же самое в środek «середина», środa «среда» и śródmieście «центр города»." }
collocations:
  - { pl: "średni wiek", ru: "средний возраст" }
