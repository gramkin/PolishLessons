notes:
  - { kind: usage, text: "МУЖСКОЕ СУЩЕСТВИТЕЛЬНОЕ, А СКЛОНЯЕТСЯ КАК ЖЕНСКОЕ. В единственном числе SPRAWCA, SPRAWCY, SPRAWCĘ, SPRAWCĄ идут по женскому образцу, но согласуется слово по-мужски: TEN sprawca, GŁÓWNY sprawca, sprawca ZBIEGŁ. Во множественном же родительный берёт мужское окончание -ów: SPRAWCÓW, а не «sprawc». Тот же класс: kierowca, kolega, artysta, mężczyzna. Русское «виновник» склоняется обычно, так что эта смешанная модель — чистая польская черта, и путаница в согласовании выдаёт иностранца сразу." }
  - { kind: usage, text: "Форма SPRAWCY работает за три падежа единственного числа — родительный, дательный и предложный — и вдобавок за именительный множественного. Различает их только контекст: szukają sprawcy «ищут виновного» против sprawcy uciekli «виновные сбежали»." }
  - { kind: false-friend, text: "Корень не тот, что у русского «виновник». SPRAWCA идёт от SPRAWIĆ «вызвать, причинить» и SPRAWA «дело», а наше слово — от «вины». Поэтому WINA по-польски тоже есть и значит «вина», но виновника от неё не образуют: не «winnik», а именно sprawca. В протоколах встретишь SPRAWCA WYPADKU, SPRAWCA SZKODY." }
collocations:
  - { pl: "sprawca wypadku", ru: "виновник аварии" }
  - { pl: "ustalić sprawcę", ru: "установить виновного" }
  - { pl: "nieznany sprawca", ru: "неустановленное лицо" }
family:
  - { pl: "sprawić", ru: "вызвать, причинить", relation: root, id: sprawic }
  - { pl: "sprawa", ru: "дело", relation: root, id: sprawa }
  - { pl: "ofiara", ru: "жертва", relation: antonym, id: ofiara }
etymology: "От sprawić «сделать, вызвать», из sprawa «дело», корень *prav- тот же, что в prawy «правый» и poprawić. Русский на этом месте взял «вину»: виновник — тот, на ком вина. Поляк назвал его по действию: тот, кто дело сделал. Отсюда и бесстрастность слова, удобная для протокола."
memory: "Мужское слово с женским склонением: ten sprawca, но sprawcę, sprawcą. Во множественном родительный мужской — sprawców. И форма sprawcy одна на три падежа плюс именительный множественного."
idioms:
