notes:
  - { kind: usage, text: "Это второе слово латинского разряда на -UM после TERYTORIUM, и ведёт оно себя точно так же: в единственном числе не склоняется вовсе. Одна форма ARCHIWUM стоит во всех шести падежах: ARCHIWUM MIEŚCI SIĘ в именительном, DO ARCHIWUM в родительном, W ARCHIWUM в предложном. Склоняется только множественное: ARCHIWA, ARCHIWÓW, ARCHIWOM, ARCHIWAMI, ARCHIWACH. Отсюда шесть форм вместо десяти. Весь разряд: MUZEUM, LICEUM, GIMNAZJUM, AKWARIUM, CENTRUM, STUDIUM, STYPENDIUM." }
  - { kind: false-friend, text: "Русское «архив» мужского рода и склоняется полностью, польское ARCHIWUM среднего рода и в единственном числе неизменно. Поэтому «в архиве» и «из архива» по-польски различаются только предлогом: W ARCHIWUM и Z ARCHIWUM, само слово не меняется. Это же касается и соседей по разряду: W MUZEUM значит и «в музее», и в родительном «музея», и русскому кажется, что форма пропущена. Она не пропущена, её просто нет." }
  - { kind: government, text: "Куда — предлог DO с родительным, то есть с той же неизменной формой: ODDAĆ DO ARCHIWUM «сдать в архив». Где — предлог W: W ARCHIWUM. Откуда — Z: WYCIĄGNĄĆ Z ARCHIWUM «вытащить из архива». Чей архив — родительный следующего слова: ARCHIWUM MIASTA «архив города». Во множественном числе падежи работают обычным порядком: MIĘDZY ARCHIWAMI с творительным, W ARCHIWACH с предложным." }
  - { kind: pronunciation, text: "Читается «архи́вум», три слога, ударение на предпоследнем. Сочетание CH даёт «х», как в русском. Буква W перед U звучит как «в». Окончание -UM здесь отдельный слог, «вум», и это отличает слово от TERYTORIUM, где -IUM сливается в один слог «рьюм». Во множественном ARCHIWA слышно «архи́ва», ударение остаётся на том же слоге." }
  - { kind: register, text: "Слово нейтральное и книжное: учреждения, история, делопроизводство, а в новом значении и техника. Частые обороты: ARCHIWUM PAŃSTWOWE «государственный архив», ODDAĆ DO ARCHIWUM «сдать в архив», ARCHIWUM ZAKŁADOWE «ведомственный архив», а в компьютерном смысле SPAKOWAĆ DO ARCHIWUM «упаковать в архив». Прилагательное ARCHIWALNY значит «архивный»: MATERIAŁY ARCHIWALNE. Слово ARCHIWISTA означает «архивист»." }
