etymology: "Из латинского ARCHIVUM, а в латынь из греческого ARCHEION «присутственное место», от ARCHE «начало, власть». В русский слово пришло из того же источника, но через западноевропейские языки, и получило мужской род и обычное склонение. Польский взял латинскую форму целиком, вместе со средним родом и неизменностью единственного числа, и так же поступил со всем разрядом слов на -UM. Поэтому различие между языками здесь не в значении и не в корне, а только в том, насколько глубоко слово вошло в своё склонение."
memory: "Второй случай латинского разряда на -um после terytorium, и правило то же: в единственном числе слово не склоняется, одна форма archiwum на все шесть падежей, w archiwum и do archiwum. Склоняется только множественное, archiwa, archiwów. Весь разряд: muzeum, liceum, akwarium, centrum, stypendium. Русское «архив» мужского рода и склоняется полностью, польское среднего и неизменно. Читается «архи́вум», где -um отдельный слог."
