    ru: "После сбрасывания снега они сделали перерыв."
    source: { kind: authored }
  - form: "zrzucaniu"
    pl: "O zrzucaniu winy na innych już rozmawialiśmy."
    ru: "О сваливании вины на других мы уже говорили."
    source: { kind: authored }
  - form: "zrzucaniu"
    pl: "W zrzucaniu liści nie ma nic dziwnego."
    ru: "В сбрасывании листьев нет ничего странного."
    source: { kind: authored }
  - form: "zrzucany"
    pl: "Śnieg jest zrzucany z dachu."
    ru: "Снег сбрасывают с крыши."
    source: { kind: authored }
  - form: "zrzucany"
    pl: "Ciężar zrzucany na jednego jest za duży."
    ru: "Груз, сваливаемый на одного, слишком велик."
    source: { kind: authored }
  - form: "zrzucany"
    pl: "Sprzęt był zrzucany na spadochronie."
    ru: "Снаряжение сбрасывали на парашюте."
    source: { kind: authored }
  - form: "zrzucanych"
    pl: "Nie ma tu paczek zrzucanych z samolotu."
    ru: "Здесь нет посылок, сбрасываемых с самолёта."
    source: { kind: authored }
  - form: "zrzucanych"
    pl: "Wśród ulotek zrzucanych nocą była i ta."
    ru: "Среди листовок, сбрасываемых ночью, была и эта."
    source: { kind: authored }
  - form: "zrzucanych"
    pl: "Liczba zrzucanych obowiązków rośnie."
    ru: "Число сваливаемых обязанностей растёт."
    source: { kind: authored }
  - form: "zrzucanym"
    pl: "W śniegu zrzucanym z dachu nie ma nic groźnego."
    ru: "В снеге, сбрасываемом с крыши, нет ничего опасного."
    source: { kind: authored }
  - form: "zrzucanym"
    pl: "Paczkom zrzucanym na spadochronach nic się nie stało."
    ru: "С посылками, сброшенными на парашютах, ничего не случилось."
    source: { kind: authored }
  - form: "zrzucanym"
    pl: "Z ciężarem zrzucanym na jednego nikt nie wygra."
    ru: "С грузом, сваливаемым на одного, никто не справится."
    source: { kind: authored }
  - form: "zrzucanymi"
    pl: "Zajmujemy się paczkami zrzucanymi z samolotu."
    ru: "Мы занимаемся посылками, сбрасываемыми с самолёта."
    source: { kind: authored }
  - form: "zrzucanymi"
    pl: "Między obowiązkami zrzucanymi a własnymi jest różnica."
    ru: "Между сваливаемыми и своими обязанностями есть разница."
    source: { kind: authored }
  - form: "zrzucanymi"
    pl: "Z liśćmi zrzucanymi jesienią jest dużo pracy."
    ru: "С листьями, сбрасываемыми осенью, много работы."
    source: { kind: authored }
  - form: "zrzucasz"
    pl: "Zrzucasz winę na innych."
    ru: "Ты сваливаешь вину на других."
    source: { kind: authored }
  - form: "zrzucasz"
    pl: "Czemu zrzucasz to na mnie?"
    ru: "Почему ты сваливаешь это на меня?"
    source: { kind: authored }
  - form: "zrzucasz"
    pl: "Zrzucasz kurtkę na krzesło."
    ru: "Ты бросаешь куртку на стул."
    source: { kind: authored }
