# review
id: zrzucac
format: 2
lemma: "zrzucać"
rank: 2087
pos: verb
aspect: imperf
pron: { cyr: "зжу́цаць" }
senses:
  - id: shift-blame
    ru: "сваливать (вину, ответственность)"
    examples:
      - pl: "John zrzuca winę na innych."
        ru: "Джон сваливает вину на других."
        source: { kind: translated, id: 775967 }
      - pl: "Nie zrzucaj winy na mnie!"
        ru: "Не сваливай вину на меня!"
        source: { kind: translated, id: 2252172 }
      - pl: "Wioślarz zrzuca winę na wiosło."
        ru: "Гребец сваливает вину на весло."
        source: { kind: translated, id: 3108195 }
  - id: throw-off
    ru: "сбрасывать (с себя)"
    examples:
      - pl: "Rosnąc wąż zrzuca skórę dwa do czterech razy w ciągu roku, poprzez pocieranie się o twardą powierzchnię."
        ru: "Растущая змея сбрасывает кожу от двух до четырёх раз в год."
        source: { kind: translated, id: 6156318 }
      - pl: "Zrzuca płaszcz i siada."
        ru: "Он сбрасывает пальто и садится."
        source: { kind: authored }
notes:
  - { kind: government, text: "Вину сваливают через na с винительным: zrzucać winę na kogoś «сваливать вину на кого-л.» — ровно как в русском." }
  - { kind: usage, text: "Совершенный вид — zrzucić." }
  - { kind: false-friend, text: "Корень rzucać «бросать» — ср. русское «рушить», «ринуться». Приставка z- означает движение вниз или прочь." }
  - { kind: usage, text: "Ещё одно частое употребление — о весе: zrzucać kilogramy «сбрасывать килограммы»." }
collocations:
  - { pl: "zrzucać winę", ru: "сваливать вину" }
  - { pl: "zrzucać kilogramy", ru: "сбрасывать килограммы" }
etymology: "z- + rzucać «бросать»; приставка указывает движение вниз или прочь, как русское «с-» в «сбросить»."
memory: "zrzucać — «сбрасывать» и «сваливать». Главный оборот zrzucać winę na kogoś «сваливать вину на кого-л.», с na и винительным, как в русском. Совершенный вид — zrzucić."
idioms:
  - { pl: "zrzucać winę", ru: "сваливать вину" }
