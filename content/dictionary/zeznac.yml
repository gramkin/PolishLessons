etymology: "Приставка Z- и глагол ZNAĆ «знать», то есть буквально «сделать известным, довести до знания». Корень общий с русским «знать», а построение совпадает с русским «сознаться», где та же приставка съ- присоединена к той же основе. Любопытно, насколько по-разному разошлись результаты: польское ZEZNAĆ стало судебным «дать показания», русское «сознаться» — признанием вины, а русское «сознание» ушло в сторону психики, тогда как польское ZEZNANIE осталось при суде и при налоговой декларации. Для русского «сознания» польский построил отдельное слово ŚWIADOMOŚĆ, от ŚWIADOMY, и там корень уже другой — тот же, что в ŚWIADEK «свидетель» и русском «сведать», «свидетель». Так один корень дал в двух языках четыре разных слова, и ни одно не переводится в другое напрямую."
memory: "Совершенный вид: zeznam — «дам показания», будущее, а не настоящее; настоящее у несовершенного zeznawać. Zeznanie — «показание» и «декларация», но не «сознание»: сознание — świadomość. Собрано как русское «сознаться», z- плюс znać, но значения разошлись; признать вину — przyznać się. Управление: zeznać prawdę в винительном, zeznać przeciwko komuś с дательным, pod przysięgą. Деепричастие только zeznawszy."
idioms:
  - { pl: "złożyć zeznanie", ru: "дать показание" }
  - { pl: "odmówić zeznań", ru: "отказаться от показаний" }
formExamplesSkip:
  - { form: "zeznani", reason: "Страдательное причастие мужского лица множественного числа. Дополнением у этого глагола бывает только содержание показаний — ZEZNAĆ PRAWDĘ, ZEZNAĆ, ŻE DRZWI BYŁY OTWARTE — а человек прямым дополнением тут не бывает никогда: против кого-то показывают с предлогом, ZEZNAĆ PRZECIWKO KOMUŚ. Поэтому у мужско-личной страдательной формы нет и не может быть подлежащего: некого поставить в именительный. Остальные формы причастия в карточке есть с примерами: WERSJA ZEZNANA PRZEZ ŚWIADKA, OKOLICZNOŚCI ZEZNANE POD PRZYSIĘGĄ. То же ограничение отмечено на карточке несовершенного вида при форме ZEZNAWANI." }
