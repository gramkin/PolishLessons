notes:
  - { kind: false-friend, text: "Самая дорогая ловушка этой карточки — отглагольное существительное. ZEZNANIE значит «показание», а не «сознание»: ZŁOŻYĆ ZEZNANIE «дать показание», ODMÓWIĆ ZEZNAŃ «отказаться от показаний». Русское «сознание» по-польски ŚWIADOMOŚĆ, от ŚWIADOMY «сознающий». При этом собраны оба слова одинаково, из приставки и корня «знать»: польское ZEZNAĆ и русское «сознаться» это одно и то же построение, Z- плюс ZNAĆ. Разошлись они по значениям — поляк «сознал» в суде, то есть сообщил, а русский «сознался», то есть признал вину; для признания вины польский берёт PRZYZNAĆ SIĘ. Ещё одно значение, повседневное: ZEZNANIE PODATKOWE это «налоговая декларация»." }
  - { kind: government, text: "Совершенный вид, и отсюда главное: формы ZEZNAM, ZEZNASZ, ZEZNA, ZEZNAMY, ZEZNACIE, ZEZNAJĄ это будущее время, а не настоящее. ZEZNAM значит «я дам показания», а не «я даю показания»; для настоящего нужен несовершенный ZEZNAWAĆ с его ZEZNAJĘ. Повелительное ZEZNAJ принадлежит совершенному, а ZEZNAWAJ несовершенному. Управление: содержание показаний в винительном, ZEZNAĆ PRAWDĘ, или союзом, ZEZNAĆ, ŻE DRZWI BYŁY OTWARTE Против кого показывают — предлог PRZECIWKO с дательным: ZEZNAĆ PRZECIWKO WSPÓLNIKOWI. Обстоятельства — предлог POD с творительным: POD PRZYSIĘGĄ." }
  - { kind: pronunciation, text: "Читается «зэ́знаць», ударение на предпоследнем слоге, то есть на первом из двух. Начальное ZE звучит «зэ», без смягчения, и на стыке приставки с корнем оба Z произносятся раздельно, «з-з», а не одним долгим звуком. Конечное -Ć это мягкое «ць», как во всех инфинитивах. В причастии ZEZNAWSZY сочетание WSZ читается «фш» с оглушением: «зэзна́фшы». В формах прошедшего времени Ł даёт «у»: ZEZNAŁ звучит «зэ́знау», а не «зэзнал», и это обычное место ошибки." }
  - { kind: usage, text: "Слово юридическое и за пределами суда, полиции и налоговой встречается редко — именно там оно и набирает частотность. Полезные обороты целиком: ZŁOŻYĆ ZEZNANIE «дать показание», ZEZNAWAĆ POD PRZYSIĘGĄ «показывать под присягой», ODMÓWIĆ ZEZNAŃ «отказаться от показаний», PRAWO ODMOWY ZEZNAŃ «право отказа от показаний». Рядом стоят три глагола с тем же корнем, и смешивать их нельзя: PRZYZNAĆ SIĘ «признаться, признать вину», WYZNAĆ «признаться в чувствах, исповедать», UZNAĆ «признать, счесть». Деепричастие у совершенного вида только прошедшего времени, ZEZNAWSZY; формы на -ĄC принадлежат несовершенному ZEZNAJĄC." }
