notes:
  - { kind: false-friend, text: "Само слово прозрачно: GNIAZDO это «гнездо», корень общий. Ловушка сидит в уменьшительном. GNIAZDKO это в первую очередь не «гнёздышко», а «розетка»: WŁÓŻ WTYCZKĘ DO GNIAZDKA значит «вставь вилку в розетку». Русский назвал розетку по сходству с украшением-розеткой и связи с гнездом не видит, а поляк увидел в ней углубление, куда что-то вкладывают." }
  - { kind: usage, text: "Девять форм, средний род. В местном падеже происходит заметное смягчение: GNIAZDO, но W GNIEŹDZIE, где ZD переходит в ŹDZI, а A в E. Русское «гнездо — в гнезде» ничего подобного не знает, и эту форму приходится запомнить отдельно. Родительный множественного GNIAZD без окончания. Множественное GNIAZDA значит и птичьи гнёзда, и электрические розетки." }
  - { kind: government, text: "В гнездо — предлог DO с родительным: WŁOŻYĆ DO GNIAZDA, тогда как русский говорит «в гнездо», с винительным. Это обычное расхождение: польский для вкладывания берёт DO. В гнезде — предлог W с местным падежом: W GNIEŹDZIE. Вить гнездо — WIĆ GNIAZDO, винительный без предлога, как и по-русски." }
  - { kind: pronunciation, text: "Читается «гня́здо», два слога, ударение на первом. Сочетание GNIA даёт «гня», в один приём. В местном падеже GNIEŹDZIE звучит «гне́зьдзе»: сначала мягкое «не», потом Ź даёт «зь», а DZI даёт слитное «дзь». Три мягких звука подряд делают форму непохожей на исходную, и узнать в ней GNIAZDO с первого раза трудно." }
  - { kind: register, text: "Слово нейтральное в обоих значениях: PTASIE GNIAZDO «птичье гнездо», BOCIANIE GNIAZDO «аистиное гнездо», которое в Польше видно на каждом втором столбе. Переносное GNIAZDO RODZINNE это «родное гнездо», о доме, где человек вырос, и звучит оно тепло. В технике GNIAZDO это разъём любого рода, а в быту розетку почти всегда называют уменьшительным GNIAZDKO." }
