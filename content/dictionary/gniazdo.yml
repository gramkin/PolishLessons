etymology: "Праславянское слово, то же, что русское «гнездо», и значение за тысячу лет не сдвинулось. Корень тот же, что в литовском и в латинском NIDUS, и восходит он к древнему названию места, где садятся птицы. Электрический смысл появился в двадцатом веке и в обоих языках независимо: поляк увидел в розетке углубление, гнездо, а русский — форму цветка, розетку. Переносное GNIAZDO RODZINNE общеславянское и старое."
memory: "Слово то же, что русское «гнездо», и прямое значение совпадает. Но уменьшительное обманывает: gniazdko это «розетка», а не «гнёздышко», и włóż wtyczkę do gniazdka значит «вставь вилку в розетку». Местный падеж меняет слово до неузнаваемости: w gnieździe, «гне́зьдзе», три мягких звука подряд. Управление расходится: włożyć do gniazda, родительный, где русский берёт винительный."
idioms:
