# review
id: spadac
format: 2
lemma: "spadać"
rank: 764
pos: verb
aspect: imperf
pron: { cyr: "спа́даць" }
senses:
  - id: fall
    ru: "падать, опадать"
    examples:
      - pl: "W październiku zaczynają spadać liście."
        ru: "В октябре начинают падать листья."
        source: { kind: tatoeba, id: 5487881 }
      - pl: "Liście już spadają z drzew."
        ru: "Листья уже опадают с деревьев."
        source: { kind: tatoeba, id: 6849525 }
      - pl: "Liście spadają powoli."
        ru: "Листья падают медленно."
        source: { kind: translated, id: 4558048 }
  - id: drop
    ru: "снижаться, падать (о ценах, температуре)"
    examples:
      - pl: "Spada."
        ru: "Падает."
        source: { kind: translated, id: 10598420 }
      - pl: "Temperatura gwałtownie spada."
        ru: "Температура резко падает."
        source: { kind: authored }
      - pl: "Ceny spadają z miesiąca na miesiąc."
        ru: "Цены падают из месяца в месяц."
        source: { kind: authored }
  - id: shooting-star
    ru: "spadająca gwiazda — падающая звезда"
    examples:
      - pl: "Właśnie zobaczyłem spadającą gwiazdę."
        ru: "Я только что видел падающую звезду."
        source: { kind: tatoeba, id: 1591782 }
      - pl: "O, spadająca gwiazda!"
        ru: "О, падающая звезда!"
        source: { kind: translated, id: 732973 }
      - pl: "Spadająca gwiazda przecięła niebo."
        ru: "Падающая звезда прочертила небо."
        source: { kind: translated, id: 951181 }
  - id: go-away
    ru: "Spadaj! — Проваливай!"
    note: "Грубовато, но печатно."
    examples:
      - pl: "Spadaj stąd!"
        ru: "Проваливай отсюда!"
        source: { kind: tatoeba, id: 5909111 }
      - pl: "Spadaj!"
        ru: "Проваливай!"
        source: { kind: translated, id: 623563 }
      - pl: "Muszę spadać."
        ru: "Мне пора сваливать."
        source: { kind: translated, id: 7610590 }
notes:
  - { kind: register, text: "Spadaj! значит «Проваливай!» — грубовато, но не непристойно: так отшивают назойливого. А Muszę spadać «Мне пора сваливать» говорят о себе, и это просто разговорно." }
  - { kind: government, text: "Откуда падать — z с родительным: spadać z drzewa, spadać z drabiny. До какого уровня — do с родительным: ceny spadły do zera." }
  - { kind: usage, text: "kamień spadł mi z serca — «камень с души свалился»: идиома совпадает с русской дословно." }
  - { kind: usage, text: "Существительное spadek совмещает два значения сразу: «падение» (spadek cen) и «наследство» (dostać spadek). Совершенный вид глагола — spaść." }
collocations:
  - { pl: "spadać z drzewa", ru: "падать с дерева" }
  - { pl: "spadająca gwiazda", ru: "падающая звезда" }
  - { pl: "ceny spadają", ru: "цены падают" }
  - { pl: "Spadaj!", ru: "Проваливай!" }
family:
  - { pl: "spaść", ru: "упасть", relation: aspect }
  - { pl: "padać", ru: "падать", relation: root }
  - { pl: "spadek", ru: "падение; наследство", relation: derived }
  - { pl: "upadek", ru: "падение", relation: derived }
etymology: "s- + padać «падать», праславянское *pasti — то же слово, что русские «падать» и «упасть»."
memory: "spadać — «падать», от padać, как русское «с-падать». Две вещи возьмите отдельно. Spadaj! значит «Проваливай!» — грубовато, но печатно, а Muszę spadać — «мне пора сваливать». И существительное spadek совмещает два значения сразу: «падение» (spadek cen) и «наследство» (dostać spadek)."
idioms:
  - { pl: "Spadaj!", ru: "Проваливай!" }
  - { pl: "spadająca gwiazda", ru: "падающая звезда" }
  - { pl: "kamień spadł mi z serca", ru: "камень с души свалился" }
formExamplesSkip:
  - { form: "spadano", reason: "безличной формы у этого глагола нет: падают сами, безличное «падалось» не употребляется" }
