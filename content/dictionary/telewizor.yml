notes:
  - { kind: false-friend, text: "ПРЕДМЕТ ТОТ ЖЕ, НО ПРЕДЛОГ ДРУГОЙ. По-русски передачу показывают «ПО телевизору»; по-польски — W TELEWIZJI, то есть «в телевидении», и слово telewizor там вовсе не появляется. Mówili o tym w telewizji «об этом говорили по телевизору». Telewizor это только сам ящик: кусок мебели, который можно выключить." }
  - { kind: pronunciation, text: "ПРЕДЛОЖНЫЙ ПАДЕЖ МЕНЯЕТ R НА RZ: W TELEWIZORZE. Это общее правило для основ на r, и в словаре оно встречается уже в четвёртый раз: aktor — aktorze, rozmiar — rozmiarze, spacer — spacerze, garnitur — garniturze. Rz читается как ж: «тэлевизо́же»." }
  - { kind: usage, text: "Телевидение как явление — telewizja, канал — kanał или program, пульт — pilot. Осторожно с последним: pilot значит и «пульт», и «лётчик», и «гид». Оборот leci w telewizji «идёт по телевизору» употребляется о передаче, а nie ma nic w telewizji — «по телевизору ничего нет»." }
collocations:
  - { pl: "włączyć telewizor", ru: "включить телевизор" }
  - { pl: "przed telewizorem", ru: "перед телевизором" }
  - { pl: "w telewizji", ru: "по телевизору" }
family:
  - { pl: "telewizja", ru: "телевидение", relation: derived, id: telewizja }
  - { pl: "pilot", ru: "пульт; лётчик", relation: derived, id: pilot }
  - { pl: "radio", ru: "радио", relation: root, id: radio }
etymology: "Из греческого tele «далеко» и латинского visor «смотрящий», от videre «видеть» — слово собрано в двадцатом веке из двух древних языков сразу. В польский и в русский оно пришло одновременно и в одной форме. Тот же tele- стоит в telefon, telegram и teleskop."
memory: "telewizor — «телевизор», сам прибор. Но передачи идут не «по телевизору», а W TELEWIZJI: mówili o tym w telewizji. Предложный падеж смягчает r в rz: w telewizorze, как w garniturze."
idioms:
  - { pl: "w telewizji", ru: "по телевизору" }
  - { pl: "siedzieć przed telewizorem", ru: "сидеть перед телевизором" }
