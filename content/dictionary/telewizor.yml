# review
id: telewizor
format: 2
lemma: "telewizor"
rank: 2319
pos: noun
pron: { cyr: "тэлеви́зор" }
senses:
  - id: tv-set
    ru: "телевизор"
    examples:
      - pl: "Telewizor stoi w rogu pokoju."
        ru: "Телевизор стоит в углу комнаты."
        source: { kind: authored }
      - pl: "Wyłącz telewizor, idziemy spać."
        ru: "Выключи телевизор, идём спать."
        source: { kind: authored }
  - id: watching
    ru: "телевизор (как занятие)"
    examples:
      - pl: "Cały wieczór siedzi przed telewizorem."
        ru: "Весь вечер он сидит перед телевизором."
        source: { kind: authored }
      - pl: "Dzieci oglądają za dużo telewizora."
        ru: "Дети смотрят слишком много телевизора."
