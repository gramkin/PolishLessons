notes:
  - { kind: usage, text: "ПОЛЬСКИЙ РАЗВОДИТ СУЩЕСТВИТЕЛЬНОЕ И НАРЕЧИЕ ТАМ, ГДЕ РУССКИЙ БЕРЁТ ОДНО СЛОВО. RANEK — существительное «утро»: ranek był mroźny. RANO — наречие «утром»: wstaję rano. Русское «утро» и «утром» различаются падежом одного слова, а по-польски это два разных слова, и путать их нельзя." }
  - { kind: usage, text: "Беглое e выпадает: ranek, но RANKA, rankowi, rankiem. Так же ведут себя dodatek, wózek и pocałunek. А вот -ik и -yk гласную сохраняют: stolik, stolika. Форма RANKU служит и предложным, и звательным падежом." }
  - { kind: pronunciation, text: "Два слога, ударение на первом: RA-nek. Польское e открытое, как русское э: «ра́нэк». В формах без e слышно «ра́нка», «ра́нкем»." }
collocations:
  - { pl: "wczesnym rankiem", ru: "ранним утром" }
  - { pl: "od ranka", ru: "с утра" }
  - { pl: "pogodny ranek", ru: "ясное утро" }
family:
  - { pl: "rano", ru: "утром", relation: root, id: rano }
  - { pl: "poranek", ru: "утро, утренник", relation: root }
  - { pl: "wieczór", ru: "вечер", relation: antonym, id: wieczor }
etymology: "От того же корня, что rano «утром», из праславянского *rano «рано, утро» — родственного русским «рано» и «ранний». Суффикс -ek сделал из наречия существительное. Отсюда и poranek, и poranny «утренний»."
memory: "ranek — «утро» как существительное, а «утром» будет rano, наречие: два разных слова там, где русский берёт одно. Беглое e выпадает: ranek, но ranka, rankiem."
idioms:
