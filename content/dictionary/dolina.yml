notes:
  - { kind: false-friend, text: "Один из самых безопасных случаев: DOLINA это «долина», слово за слово. Оба идут от праславянского *dolъ «низ, яма», и оба языка построили имя одинаково, с суффиксом -ИНА. Запоминать нечего, зато стоит заметить родню. Польское DÓŁ значит «низ» или «яма»: W DÓŁ «вниз», NA DOLE «внизу», DÓŁ W ZIEMI «яма в земле». В этом слове видно чередование O и Ó: DÓŁ, но DOLINA, DOLNY, DOLINY — Ó появляется только в закрытом слоге, когда за гласной нет гласной. Русский в «доле» и «долине» сохранил O без изменений, так что чередование здесь чисто польское. Прилагательное DOLNY значит «нижний»: DOLNA WARGA «нижняя губа», DOLNY ŚLĄSK «Нижняя Силезия»." }
  - { kind: government, text: "Женский род. Чего долина — родительный: DOLINA RZEKI, DOLINA WISŁY, DOLINA POTOKU. «В долине» — предлог W с местным: W DOLINIE. «Долиной» о движении по ней — творительный без предлога: DOLINĄ SZŁA DROGA «долиной шла дорога», и это употребление для русского уха непривычно, потому что по-русски скорее скажут «по долине». «Вниз» и «внизу» строятся от DÓŁ, а не от DOLINA: W DÓŁ, NA DOLE, Z DOŁU. Частотные сочетания: GÓRSKA DOLINA «горная долина», ŻYZNA DOLINA «плодородная долина»." }
  - { kind: usage, text: "Склонение самое обычное для женских слов на -A, с единственным чередованием: перед окончанием -E в дательном и местном единственного N смягчается, и получается DOLINIE, а не DOLINE. Так же у всех основ на N: ŚCIANA даёт ŚCIANIE, ŻONA даёт ŻONIE, WIOSNA даёт WIOŚNIE. Родительный множественного — DOLIN, с нулевым окончанием и без вставной гласной. Форма DOLINY покрывает родительный единственного вместе с именительным и винительным множественного — три позиции одной формой, как у большинства существительных этого типа." }
  - { kind: pronunciation, text: "Читается «доли́на», три слога, ударение на предпоследнем. Оба O произносятся полно, как «о»: первый слог звучит «до», а не «да», и это главное отличие от русского произношения, где безударное O переходит в «а». В дательном и местном DOLINIE сочетание NIE даёт мягкое «не»: «доли́не». В родительном множественного DOLIN слогов два, ударение на первом: «до́лин». В родственном DÓŁ буква Ó читается «у», а Ł — «у» неслоговое, так что слово звучит примерно как «дуу»." }
