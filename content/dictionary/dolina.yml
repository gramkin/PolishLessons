etymology: "От праславянского *dolъ «низ, низина, яма», от которого русские «дол», «долина», «подол», «доле» в старом смысле «ниже». Суффикс -INA в обоих языках образует названия пространств и мест, так что DOLINA и «долина» собраны из одинаковых частей и значат одинаковое. Польский, в отличие от русского, сохранил и само исходное слово в живом употреблении: DÓŁ это «низ» и «яма», и от него идут W DÓŁ «вниз», NA DOLE «внизу», DOLNY «нижний». Русский «дол» остался только в книжном и поэтическом языке, а бытовые значения разошлись по словам «низ», «яма», «внизу». Чередование O и Ó в польской паре DÓŁ и DOLINY объясняется историей долгих гласных: старое долгое o в закрытом слоге дало Ó, в открытом осталось O. Русский этого удлинения не знал, поэтому пишет «дол» и «долина» с одной и той же гласной."
memory: "dolina — это «долина», слово за слово, из общего *dolъ. Польский сохранил и само исходное слово: dół «низ, яма», отсюда w dół «вниз», na dole «внизу», dolny «нижний». В паре видно чисто польское чередование: dół в закрытом слоге, но doliny и dolny — в открытом. Дательный и местный смягчают n: dolinie. Движение по долине передаётся творительным без предлога: doliną szła droga."
