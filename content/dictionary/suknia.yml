notes:
  - { kind: false-friend, text: "SUKNIA — ЭТО ПЛАТЬЕ, А НЕ «СУКНО». Русское «сукно» — плотная шерстяная ткань, и по-польски это SUKNO, средний род. А SUKNIA, женский род, значит нарядное длинное платье. Слова родственные: платье когда-то и шили из сукна. Повседневное платье поляк назовёт уменьшительным SUKIENKA, а suknia звучит торжественно — ślubna, balowa, wieczorowa." }
  - { kind: pronunciation, text: "Родительный множественного — SUKIEN, с беглым e между k и n, которого в основе нет: sukni- плюс нулевое окончание. Тот же механизм в matka — matek и miasteczko — miasteczek. А форма SUKNI работает сразу за родительный, дательный и предложный единственного." }
collocations:
  - { pl: "suknia ślubna", ru: "свадебное платье" }
  - { pl: "suknia balowa", ru: "бальное платье" }
  - { pl: "w długiej sukni", ru: "в длинном платье" }
family:
  - { pl: "sukienka", ru: "платье (повседневное)", relation: derived }
  - { pl: "sukno", ru: "сукно", relation: root }
  - { pl: "spódnica", ru: "юбка", relation: root }
etymology: "От SUKNO, из праславянского *sukno «ткань», того же слова, что русское «сукно», а оно от *sukati «сучить, прясть». Платье назвали по материалу: suknia — буквально «сукнянка», сшитое из сукна. Русский сохранил только название ткани, а для одежды взял «платье» от «плат»."
memory: "suknia — это платье, а «сукно» будет sukno, средний род. Повседневное платье чаще sukienka, а suknia — нарядное: ślubna, balowa. И родительный множественного с беглым e: kilka sukien."
idioms:
