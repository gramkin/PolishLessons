# review
id: mieszac
format: 2
lemma: "mieszać"
rank: 1739
pos: verb
pron: { cyr: "ме́шаць" }
senses:
  - id: stir
    ru: "мешать, размешивать, смешивать"
    examples:
      - pl: "Miesza zupę drewnianą łyżką."
        ru: "Он мешает суп деревянной ложкой."
        source: { kind: authored }
      - pl: "Mieszaj, żeby się nie przypaliło."
        ru: "Мешай, чтобы не подгорело."
        source: { kind: authored }
      - pl: "Cement mieszano ręcznie."
        ru: "Цемент мешали вручную."
        source: { kind: authored }
  - id: confuse
    ru: "путать (одно с другим)"
    examples:
      - pl: "Mieszam te dwa imiona od lat."
        ru: "Я путаю эти два имени годами."
        source: { kind: authored }
      - pl: "Mieszają fakty z opiniami."
        ru: "Они путают факты с мнениями."
        source: { kind: authored }
  - id: interfere
    ru: "mieszać się do czegoś — вмешиваться во что-л."
    examples:
      - pl: "Do waszych spraw się nie mieszam."
        ru: "В ваши дела я не вмешиваюсь."
        source: { kind: authored }
      - pl: "Nie mieszaj się do tego."
        ru: "Не вмешивайся в это."
        source: { kind: authored }
  - id: mixed
    ru: "mieszany — смешанный"
    examples:
      - pl: "Chór mieszany wystąpił na koniec."
        ru: "Смешанный хор выступил в конце."
        source: { kind: authored }
      - pl: "Mieszane uczucia towarzyszyły mu do końca."
        ru: "Смешанные чувства сопровождали его до конца."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "САМАЯ частая ошибка русскоязычных в польском. Русское «мешать» значит ДВЕ вещи: «размешивать» и «препятствовать». Польское mieszać значит ТОЛЬКО первое. «Мешать кому-то» по-польски — przeszkadzać komuś, и никак иначе. Поэтому nie mieszaj mi значит «не размешивай мне», а вовсе не «не мешай мне». Фраза при этом грамматически безупречна, так что поправлять вас никто не станет — ошибку надо знать заранее." }
  - { kind: government, text: "Три схемы. Мешать ЧТО — винительный: mieszać zupę. Смешивать с чем — Z с ТВОРИТЕЛЬНЫМ: mieszać wapno z piaskiem; так же и «путать с»: mieszać fakty z plotkami, mieszać kogoś z kimś. А вмешиваться — DO czegoś с РОДИТЕЛЬНЫМ: mieszać się do polityki, тогда как по-русски «вмешиваться В политику», в винительном." }
  - { kind: usage, text: "Причастие mieszany значит «смешанный» и живёт самостоятельно: chór mieszany «смешанный хор», małżeństwo mieszane «смешанный брак», mieszane uczucia «смешанные чувства». Совершенные пары разные по смыслу: zmieszać «смешать», pomieszać «перепутать», wmieszać się «вмешаться»." }
collocations:
  - { pl: "mieszać zupę", ru: "мешать суп" }
  - { pl: "mieszać się do czegoś", ru: "вмешиваться во что-л." }
  - { pl: "mieszane uczucia", ru: "смешанные чувства" }
family:
  - { pl: "zmieszać", ru: "смешать", relation: aspect }
  - { pl: "mieszanka", ru: "смесь", relation: derived }
  - { pl: "przeszkadzać", ru: "мешать, препятствовать", relation: derived, id: przeszkadzac }
etymology: "Праславянское *měšati «смешивать» — то же слово, что русское «мешать», и из того же гнезда «смесь», «месить», «помеха». Расхождение возникло позже: русский развил у глагола второе значение, «препятствовать» (через образ «вмешиваться, путаться под ногами»), а польский оставил это другому слову — przeszkadzać. Отсюда и ловушка."
memory: "mieszać — только «размешивать, смешивать, путать», НО НЕ «препятствовать». «Мешать кому-то» это przeszkadzać komuś. И вмешиваются DO czegoś в родительном, а не «в» с винительным."
