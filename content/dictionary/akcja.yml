  - { form: "akcją", reason: "творительный падеж единственного числа в живой речи почти не встречается" }
  - { form: "akcjom", reason: "дательный падеж множественного числа встречается крайне редко" }
  - { form: "akcjo", reason: "звательный падеж: к акции не обращаются, форма не употребляется" }
  - { form: "akcyj", reason: "устаревший родительный падеж множественного числа: современная форма — akcji" }
