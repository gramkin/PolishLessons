  - id: overlook
    ru: "не заметить, просмотреть (человека, деталь)"
    examples:
      - pl: "Przegapili go na rozmowie i teraz żałują."
        ru: "Они просмотрели его на собеседовании и теперь жалеют."
        source: { kind: authored }
      - pl: "Przegapieni kandydaci trafili do konkurencji."
        ru: "Просмотренные кандидаты ушли к конкурентам."
        source: { kind: authored }
  - id: oversight
    ru: "przegapienie — недосмотр, оплошность"
    examples:
      - pl: "Przegapienie terminu kosztowało nas kontrakt."
        ru: "Пропуск срока стоил нам контракта."
        source: { kind: authored }
      - pl: "Po przegapieniu okazji było już za późno."
        ru: "После того как возможность прозевали, было уже поздно."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Соответствие здесь не случайное, а по образу. Prze- плюс gapić значит «пропустить, стоя с разинутым ртом» — и русский построил «ПРОЗЕВАТЬ» от «зевать» в точности так же. Оба языка выразили одну мысль: вещь прошла мимо, пока ты глазел. Поэтому przegapić и «прозевать» запоминаются вместе, а заодно и само gapić się." }
  - { kind: government, text: "Прозевают ЧТО — винительный: przegapić przystanek, termin, okazję. Дополнением бывает и человек, когда речь о недосмотре: przegapili dobrego kandydata «они просмотрели хорошего кандидата». Предлога не нужно, расхождений с русским нет." }
  - { kind: usage, text: "Вид совершенный, и в этом вся соль: gapić się описывает само глазение, а przegapić — его последствие. Несовершенная пара почти не употребляется, так что приставочный глагол стоит особняком. Разговорно, но вполне прилично: przegapić можно сказать и начальнику." }
  - { kind: pronunciation, text: "ЗАПОМНИТЕ ПАРУ ЦЕЛИКОМ, и русский поможет. Gapić się значит «таращиться, разинув рот», а приставочное przegapić — «прозевать, пропустить». Русский построил «прозевать» от «зевать» точно тем же приёмом: ты упустил вещь, потому что стоял с открытым ртом. Один образ, два языка, одна логика — и два слова запоминаются сразу." }
collocations:
  - { pl: "przegapić przystanek", ru: "прозевать остановку" }
  - { pl: "przegapić okazję", ru: "упустить возможность" }
  - { pl: "przegapić termin", ru: "пропустить срок" }
family:
  - { pl: "gapić", ru: "таращиться, глазеть", relation: root }
  - { pl: "gapa", ru: "разиня, зевака", relation: root }
  - { pl: "przeoczyć", ru: "не заметить, упустить из виду", relation: derived }
etymology: "Приставка prze- плюс gapić «глазеть», от gapa «разиня». Буквально — «проглазеть», то есть упустить, пока смотрел с разинутым ртом. Русское «прозевать» от «зевать» построено по той же схеме и с тем же образом, так что слово узнаётся не по корню, а по способу мысли. Близкое по смыслу przeoczyć собрано так же, но от oko «глаз»."
memory: "przegapić — «прозевать, пропустить», prze- + gapić «глазеть». Русский сделал то же самое из «зевать»: «прозевать». Один образ — вещь ушла, пока ты стоял с открытым ртом. Запоминайте вместе с gapić się."
idioms:
