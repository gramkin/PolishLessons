# review
id: dolar
format: 2
lemma: "dolar"
rank: 539
pos: noun
pron: { cyr: "до́лар" }
senses:
  - id: dollar
    ru: "доллар"
    note: "Jeden dolar to sto centów «Один доллар — это сто центов»."
    examples:
      - pl: "Znalazłam na ulicy dolara."
        ru: "Я нашла на улице доллар."
        source: { kind: tatoeba, id: 8285888 }
      - pl: "Jeden dolar to sto centów."
        ru: "Один доллар — это сто центов."
        source: { kind: translated, id: 812283 }
      - pl: "Dolar ustabilizował się po zniżce."
        ru: "Доллар стабилизировался после снижения."
        source: { kind: translated, id: 6319667 }
  - id: counting
    ru: "с числительными: dwa dolary, pięć dolarów"
    note: "Форма зависит от числительного ровно как в русском."
    examples:
      - pl: "Dam ci pięć dolarów."
        ru: "Я дам тебе пять долларов."
        source: { kind: tatoeba, id: 591531 }
      - pl: "Jestem winny ci dziesięć dolarów."
        ru: "Я должен тебе десять долларов."
        source: { kind: tatoeba, id: 591634 }
      - pl: "Tom dał mi trzydzieści dolarów."
        ru: "Том дал мне тридцать долларов."
        source: { kind: tatoeba, id: 3926305 }
notes:
  - { kind: government, text: "Форма после числительного работает по тому же правилу, что в русском: jeden dolar, dwa/trzy/cztery dolary, pięć dolarów «пять долларов»." }
  - { kind: usage, text: "Цена идёт с za и винительным: kupiłem ten długopis za dwa dolary «я купил эту ручку за два доллара»." }
  - { kind: usage, text: "Обмен строится с na и винительным: wymienić jeny na dolary «обменять иены на доллары»." }
  - { kind: usage, text: "Разговорное pół dolara — «полдоллара»." }
collocations:
  - { pl: "pięć dolarów", ru: "пять долларов" }
  - { pl: "za dwa dolary", ru: "за два доллара" }
  - { pl: "wymienić na dolary", ru: "обменять на доллары" }
  - { pl: "milion dolarów", ru: "миллион долларов" }
family:
  - { pl: "dolarowy", ru: "долларовый", relation: derived }
  - { pl: "cent", ru: "цент", relation: root }
etymology: "Из немецкого Taler, сокращения от Joachimsthaler, через английское dollar — то же слово, что русские «талер» и «доллар»."
memory: "dolar склоняется как обычное мужское неодушевлённое, а с числительными ведёт себя ровно по русскому правилу: jeden dolar, dwa dolary, pięć dolarów. Цена идёт с za и винительным: kupiłem za dwa dolary. Обмен — wymienić coś na dolary, снова na с винительным."
idioms:
  - { pl: "pięć dolarów", ru: "пять долларов" }
  - { pl: "za dwa dolary", ru: "за два доллара" }
  - { pl: "wymienić na dolary", ru: "обменять на доллары" }
formExamplesSkip:
  - { form: "dolarze", cell: "Звательный", reason: "звательный падеж: к деньгам не обращаются, одушевлённость здесь только грамматическая" }
  - { form: "dolary", cell: "Звательный", reason: "звательный падеж: к предмету или понятию не обращаются" }
