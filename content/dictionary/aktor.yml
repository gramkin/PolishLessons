notes:
  - { kind: false-friend, text: "Слово общее, из латыни, и значение то же. Расходится только женский род: по-русски «актриса», от французского actrice, а по-польски aktorka, обычным польским суффиксом -ka. Так что «актриса» это aktorka, и никак иначе. Переносное употребление совпадает дословно: z niego niezły aktor — ровно русское «он тот ещё актёр»." }
  - { kind: pronunciation, text: "ЛОВУШКА В ПРЕДЛОЖНОМ ПАДЕЖЕ. r переходит в rz: aktor, но o aktorze — «о акто́жэ». То же чередование, что rozmiar → o rozmiarze. Именительный множественного тоже с rz, но с другим окончанием: aktorzy. Две формы различает один последний звук, aktorze и aktorzy, и спутать их легко." }
  - { kind: usage, text: "Существительное мужско-личное: именительный множественного aktorzy, винительный совпадает с родительным — widzę aktorów. Прилагательное aktorski «актёрский», профессия в целом aktorstwo, а женский род aktorka." }
collocations:
  - { pl: "zostać aktorem", ru: "стать актёром" }
  - { pl: "aktor teatralny", ru: "театральный актёр" }
  - { pl: "aktor drugoplanowy", ru: "актёр второго плана" }
family:
  - { pl: "aktorka", ru: "актриса", relation: derived }
  - { pl: "aktorski", ru: "актёрский", relation: derived }
  - { pl: "akcja", ru: "действие, акция", relation: root, id: akcja }
  - { pl: "aktywny", ru: "активный", relation: root }
etymology: "Из латинского actor «действующий, исполнитель», от agere «действовать, вести». В русский слово пришло через французское acteur, оттого там ударение на конце; польский взял его прямо из латыни, с ударением на первом слоге. От того же корня akcja «действие, акция», aktywny, akt и aktualny."
memory: "aktor — «актёр», слово общее. Запомните предложный падеж: o aktorze, с переходом r в rz, и не спутайте его с множественным aktorzy. И женский род: aktorka, а не «актриса»."
idioms:
  - { pl: "z niego niezły aktor", ru: "он тот ещё актёр" }
  - { pl: "aktor drugoplanowy", ru: "актёр второго плана" }
