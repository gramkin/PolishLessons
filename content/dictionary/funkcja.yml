notes:
  - { kind: false-friend, text: "FUNKCJA — и «функция», и «должность»: PEŁNIĆ FUNKCJĘ DYREKTORA, «занимать должность директора». Ловушка рядом: FUNKCJONARIUSZ — не «функционер», а «сотрудник полиции, служащий силовых структур»." }
  - { kind: usage, text: "Восемь живых форм, женский род на -CJA. Родительный, дательный и местный — FUNKCJI. Архаичная форма FUNKCYJ и звательный не даются." }
  - { kind: government, text: "Занимать должность — PEŁNIĆ FUNKCJĘ, и родительный: FUNKCJĘ PREZESA. Уйти с поста — ZREZYGNOWAĆ Z FUNKCJI. Выполнять функцию чего — PEŁNIĆ FUNKCJĘ, и родительный." }
  - { kind: pronunciation, text: "Читается «фу́нкцья», ударение на первом слоге. CJA — «цья»." }
collocations:
  - { pl: "pełnić funkcję", ru: "выполнять функцию; занимать должность" }
  - { pl: "funkcja prezesa", ru: "должность председателя" }
  - { pl: "nowa funkcja", ru: "новая функция" }
family:
  - { pl: "funkcjonować", ru: "функционировать", relation: derived }
  - { pl: "funkcjonariusz", ru: "сотрудник полиции, служащий", relation: derived, id: funkcjonariusz }
  - { pl: "funkcjonalny", ru: "функциональный", relation: derived }
etymology: "Из латинского слова со значением «исполнение, обязанность». Отсюда в польском и «функция», и «должность»."
memory: "Funkcja — функция и должность: pełnić funkcję dyrektora. Читается «фу́нкцья». Funkcjonariusz — полицейский, не «функционер»."
idioms:
  - { pl: "pełniący obowiązki", ru: "исполняющий обязанности" }
