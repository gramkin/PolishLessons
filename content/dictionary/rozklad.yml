notes:
  - { kind: false-friend, text: "Русский «расклад» звучит разговорно и значит «положение дел», так что переводить им польское слово нельзя. ROZKŁAD идёт от ROZŁOŻYĆ «разложить» и расходится от этого образа в две стороны. Первая бытовая: ROZKŁAD JAZDY это «расписание», рейсы, разложенные по времени, а ROZKŁAD DNIA — «распорядок дня». Вторая мрачная: ROZKŁAD это разложение и распад, и тела, и государства." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. В местном падеже D переходит в DZI: ROZKŁAD, но W ROZKŁADZIE. Оба значения живут в одном слове, и путаницы не возникает, потому что первое почти всегда идёт с определением: ROZKŁAD JAZDY, ROZKŁAD ZAJĘĆ, ROZKŁAD DNIA. Второе стоит само или с родительным: ROZKŁAD CIAŁA." }
  - { kind: government, text: "Расписание чего-либо — ROZKŁAD CZEGOŚ, родительный без предлога: ROZKŁAD JAZDY, буквально «расписание езды». В расписании — W ROZKŁADZIE, предлог W с местным падежом. Держаться распорядка — TRZYMAĆ SIĘ ROZKŁADU, родительный после TRZYMAĆ SIĘ, тогда как русский говорит «держаться распорядка» тоже родительным, так что схема совпадает." }
  - { kind: pronunciation, text: "Читается «ро́скуат», два слога, ударение на первом, и в этом слове сразу три польские перемены. Z перед глухим K оглушается до «с». Ł даёт «у». Конечное D оглушается до «т». В итоге от написания остаётся мало: «роскуат». В местном падеже ROZKŁADZIE оглушения конечного согласного уже нет, и слышно «роскуа́дзе», с мягким «дзе»." }
  - { kind: register, text: "Первое значение совершенно ежедневное: ROZKŁAD JAZDY висит на каждой остановке и в каждом поезде, ROZKŁAD ZAJĘĆ — в каждой школе. Второе книжное и мрачное, из медицины, химии и публицистики: ROZKŁAD ORGANICZNY, ROZKŁAD MORALNY, ROZKŁAD PAŃSTWA. Спутать их трудно: первое почти всегда с определением, второе чаще само." }
