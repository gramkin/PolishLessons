etymology: "От ROZŁOŻYĆ «разложить», из приставки ROZ- и корня, давшего русские «класть», «кладу», «склад». Образ один и тот же: разложить на части. Отсюда и расписание, где рейсы разложены по часам, и разложение, где на части распадается вещество или государство. Русский от того же корня произвёл «расклад», но оставил его в разговорной речи и в значении положения дел, так что совпадения не вышло."
memory: "От rozłożyć «разложить», и от этого образа два расходящихся значения. Бытовое: rozkład jazdy это «расписание», буквально «расписание езды», а rozkład dnia — «распорядок дня». Книжное: rozkład это разложение и распад. Русский «расклад» разговорный и значит иное, так что переводить им нельзя. Читается «ро́скуат»: z оглушается перед k, ł даёт «у», конечное d даёт «т»."
