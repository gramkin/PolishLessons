# review
id: policja
format: 2
lemma: "policja"
rank: 291
pos: noun
pron: { cyr: "поли́цья" }
senses:
  - id: police
    ru: "полиция"
    examples:
      - pl: "Policja jest tutaj."
        ru: "Полиция здесь."
        source: { kind: tatoeba, id: 3853031 }
      - pl: "Szuka go policja."
        ru: "Его ищет полиция."
        source: { kind: tatoeba, id: 6328343 }
      - pl: "Dlaczego jest tu policja?"
        ru: "Почему здесь полиция?"
        source: { kind: tatoeba, id: 6554247 }
  - id: police-acting
    ru: "полиция (в действии)"
    examples:
      - pl: "Policja aresztowała go za kradzież."
        ru: "Полиция арестовала его за кражу."
        source: { kind: tatoeba, id: 591362 }
      - pl: "Tom wie, że policja go podejrzewa."
        ru: "Том знает, что полиция подозревает его."
        source: { kind: tatoeba, id: 3960499 }
      - pl: "Szybkie przybycie policji zaskoczyło nas."
        ru: "Быстрый приезд полиции был для нас сюрпризом."
        source: { kind: tatoeba, id: 1003433 }
notes:
  - { kind: usage, text: "Слово женского рода единственного числа и обозначает всю службу: Policja jest tutaj «Полиция здесь», а не «полиции здесь»." }
  - { kind: usage, text: "zadzwonić na policję — «вызвать полицию»; iść na policję — «идти в полицию»; zgłosić na policję — «заявить в полицию»." }
  - { kind: usage, text: "policjant — «полицейский», policjantka — «женщина-полицейский»; komisariat — «отделение»." }
collocations:
  - { pl: "zadzwonić na policję", ru: "вызвать полицию" }
  - { pl: "iść na policję", ru: "идти в полицию" }
  - { pl: "policja drogowa", ru: "дорожная полиция" }
  - { pl: "uciekać przed policją", ru: "убегать от полиции" }
etymology: "Из латинского politia, а то — из греческого πολιτεία «государственное устройство»; в русский слово пришло тем же путём."
memory: "policja — «полиция», женского рода и в единственном числе: Policja jest tutaj. Вызывают её так: Zadzwoń na policję!"
idioms:
  - { pl: "wpaść w łapy policji", ru: "попасть в лапы полиции" }
  - { pl: "oddać się w ręce policji", ru: "сдаться полиции" }
  - { pl: "uciekać przed policją", ru: "убегать от полиции" }
formExamplesSkip:
  - { form: "policjo", reason: "звательный падеж от этого слова в живой речи не употребляется" }
  - { form: "policyj", reason: "устаревшая форма родительного множественного; современная — policji" }
