etymology: "Из латинского STIPENDIUM «жалованье, плата», от STIPS «мелкая монета» и PENDERE «взвешивать, платить»; первоначально так называли солдатское жалованье. В русский слово пришло из того же источника и через те же западные языки, но получило женский род и полное склонение, а польский сохранил латинскую форму целиком, вместе со средним родом и неизменностью единственного числа. Так же он поступил со всем разрядом на -UM: MUZEUM, LICEUM, TERYTORIUM, ARCHIWUM, CENTRUM. Из того же латинского гнезда слово PENSJA, тоже о плате."
memory: "Третий случай латинского разряда на -um после terytorium и archiwum, и правило то же: в единственном числе слово не склоняется, одна форма stypendium на все шесть падежей, bez stypendium, o stypendium. Склоняется только множественное, stypendia, stypendiów. Русская «стипендия» женского рода и склоняется полностью. Читается «стыпэ́ндьюм», через «ы», и окончание -ium одним слогом. Получателя называют stypendysta."
