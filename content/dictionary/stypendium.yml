notes:
  - { kind: usage, text: "Это третье слово латинского разряда на -UM в нашем словаре, после TERYTORIUM и ARCHIWUM, и правило подтверждается: в единственном числе оно не склоняется вовсе. Одна форма STYPENDIUM стоит во всех шести падежах: STYPENDIUM WYNOSI в именительном, BEZ STYPENDIUM в родительном, O STYPENDIUM в предложном. Склоняется только множественное: STYPENDIA, STYPENDIÓW, STYPENDIOM, STYPENDIAMI, STYPENDIACH. Отсюда шесть форм вместо десяти." }
  - { kind: false-friend, text: "Русская «стипендия» женского рода и склоняется полностью, польское STYPENDIUM среднего рода и в единственном числе неизменно, так что «без стипендии» будет BEZ STYPENDIUM, без всякого окончания. Есть и смысловая разница: в Польше STYPENDIUM чаще всего назначают за успехи или по нужде, как отдельную награду, а обычную выплату всем студентам такой системы нет. Поэтому фраза DOSTAŁ STYPENDIUM значит «ему дали стипендию», то есть он её добился, а не получил автоматически." }
  - { kind: government, text: "Ходатайствовать о стипендии — STARAĆ SIĘ O STYPENDIUM, предлог O с винительным, который для этого слова совпадает с именительным. Получить — DOSTAĆ STYPENDIUM, винительный. За что — предлог ZA с винительным: STYPENDIUM ZA WYNIKI W NAUCE «стипендия за успехи в учёбе». Вид стипендии передаётся прилагательным: STYPENDIUM NAUKOWE, SOCJALNE, SPORTOWE, и предлога здесь не нужно." }
  - { kind: pronunciation, text: "Читается «стыпэ́ндьюм», четыре слога, ударение на предпоследнем. Буква Y звучит как «ы», поэтому начало слова «сты», а не «сти». Буква E читается как «э». Окончание -IUM произносится слитно, «дьюм», одним слогом, как в TERYTORIUM. Во множественном STYPENDIA слышно «стыпэ́ндья», тоже слитно, и ударение остаётся на том же слоге." }
  - { kind: register, text: "Слово официальное, из языка вузов и ведомств. Частые обороты: STYPENDIUM NAUKOWE «научная стипендия», STYPENDIUM SOCJALNE «социальная стипендия», STYPENDIUM REKTORA «стипендия ректора», STARAĆ SIĘ O STYPENDIUM «ходатайствовать о стипендии», WNIOSEK O STYPENDIUM «заявление на стипендию». Человека, получающего стипендию, называют STYPENDYSTA, и это слово тоже часто попадается в объявлениях и в документах." }
