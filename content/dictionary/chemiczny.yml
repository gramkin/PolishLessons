etymology: "Через латинское CHEMIA из арабского, где слово восходит к названию искусства превращения веществ, а то, возможно, к древнему имени Египта. Русское «химия» пришло тем же путём, поэтому корень общий и узнаётся без усилий. Разница только в суффиксе: польский взял латинское -ICUS и получил -ICZNY, русский — греческое -ИКОС и получил «-ический». Запомнив это соответствие, вы сразу прочитаете сотни польских слов на -ICZNY."
memory: "Химический, и корень узнаётся сразу, потому что «химия» в оба языка пришла одним путём через латынь из арабского. Запоминать стоит два сочетания: pralnia chemiczna это «химчистка», двумя словами, и bron chemiczna «химическое оружие». Читается «хэми́чны», где ch даёт «х». Формы chemiczni нет: о людях так не говорят, химиков называют chemicy. Суффикс -iczny равен русскому «-ический»."
idioms:
  - { pl: "broń chemiczna", ru: "химическое оружие" }
formExamplesSkip:
