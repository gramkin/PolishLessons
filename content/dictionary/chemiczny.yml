notes:
  - { kind: false-friend, text: "Корень узнаётся сразу, но два сочетания переводятся не по частям. PRALNIA CHEMICZNA это «химчистка»: русский сжал два слова в одно, поляк оставил оба. А разговорное CHEMIA о людях значит то же, что у нас: «между ними есть химия», MIĘDZY NIMI JEST CHEMIA. Зато CHEMICZNY о человеке не говорят никогда, и формы для мужчин-людей у слова нет." }
  - { kind: usage, text: "В таблице одиннадцать форм, но живых десять. Одиннадцатая — CHEMICZNI, именительный множественного для мужчин-людей, и её не употребляют: прилагательное относительное, оно называет свойство вещества, а не человека. Химиков называют CHEMICY, существительным. Примеров к этой форме в карточке поэтому нет. Суффикс -ICZNY прямо отвечает русскому «-ический»." }
  - { kind: government, text: "Порядок слов в закреплённых названиях — существительное, потом прилагательное: PIERWIASTEK CHEMICZNY, REAKCJA CHEMICZNA, PRALNIA CHEMICZNA, BROŃ CHEMICZNA. Отдать в химчистку — ODDAĆ DO PRALNI CHEMICZNEJ, предлог DO с родительным, где русский скажет «в химчистку», с винительным. В химической реакции — W REAKCJI CHEMICZNEJ, местный падеж." }
  - { kind: pronunciation, text: "Читается «хэми́чны», три слога, ударение на предпоследнем. Сочетание CH даёт «х», и это важно: не «ч» и не «к». Буква E после него даёт «э», поэтому первый слог это «хэ». Сочетание CZ даёт «ч», а конечная Y — «ы». В женском роде CHEMICZNA это «хэми́чна», в среднем CHEMICZNE — «хэми́чнэ»." }
  - { kind: register, text: "Слово нейтральное, из языка школы, промышленности и инструкций. В быту чаще всего встречается в PRALNIA CHEMICZNA «химчистка» и ŚRODEK CHEMICZNY «химическое средство». В новостях — BROŃ CHEMICZNA и ZAKŁAD CHEMICZNY «химический завод». На этикетках стоит SKŁAD CHEMICZNY «химический состав», и это сочетание стоит узнавать с первого взгляда." }
