notes:
  - { kind: false-friend, text: "Русского однокоренного слова нет, и это главное предупреждение: URLOP пришёл из немецкого URLAUB «отпуск, разрешение уйти», а русский «отпуск» построен от своего «отпустить». Поэтому угадать слово нельзя. Кроме того польский различает то, что русский держит в одном слове: URLOP — это отпуск с работы, а школьные и студенческие каникулы — WAKACJE, всегда во множественном числе. Сказать URLOP о летних каникулах школьника неверно, и наоборот, работник в отпуске не говорит WAKACJE, хотя в разговоре это и встречается." }
  - { kind: usage, text: "Виды отпуска различаются прилагательным, и этот набор стоит выучить блоком, потому что он частотен в быту и в документах: URLOP WYPOCZYNKOWY «ежегодный оплачиваемый отпуск», URLOP MACIERZYŃSKI «декретный», URLOP OJCOWSKI «отцовский», URLOP BEZPŁATNY «за свой счёт», URLOP NA ŻĄDANIE «отпуск по требованию», это польская особенность: четыре дня в году, которые работник может взять без согласования. Глагол — BRAĆ URLOP «брать отпуск», и состояние — BYĆ NA URLOPIE «быть в отпуске»." }
  - { kind: pronunciation, text: "Читается «у́рлоп», ударение на первом слоге из двух. Конечное P глухое, как в русском. Буква L мягкая, как всегда в польском, поэтому второй слог звучит «льоп», но на слух это ближе к «лоп» с лёгким смягчением. В местном падеже URLOPIE согласная P смягчается перед -IE и звучит «пе»: «урло́пе», и ударение переезжает на второй слог, потому что слогов стало три. Пару URLOP и URLOPIE стоит проговорить вместе." }
  - { kind: government, text: "Мужской род, неодушевлённое. Винительный равен именительному: WZIĄŁ URLOP. Нахождение в отпуске — предлог NA с местным: NA URLOPIE «в отпуске», и здесь польский берёт NA, где русский говорит «в»: это расхождение надо запомнить. Уход в отпуск — NA с винительным: POJECHAĆ NA URLOP. Родительный на -U: BEZ URLOPU, и при отрицании винительный уходит туда же: NIE WZIĄŁ URLOPU." }
collocations:
  - { pl: "urlop wypoczynkowy", ru: "ежегодный оплачиваемый отпуск" }
