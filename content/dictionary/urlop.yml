etymology: "Из немецкого URLAUB «отпуск», которое само от средневерхненемецкого URLOUP «разрешение уйти», от глагола ERLAUBEN «разрешать». То есть исходно это не отдых, а позволение отсутствовать, и военный оттенок в слове держался долго: отпуск солдата. Польский взял слово вместе с немецкой военной и канцелярской лексикой, как и RATUNEK, и оставил при нём трудовое значение. Русский построил своё слово от «отпустить», то есть на том же образе разрешённого отсутствия, но из своего материала. Получается полное совпадение мотивировки при полном расхождении формы, и это стоит знать: понятие угадывается, слово нет."
memory: "Из немецкого Urlaub, родни в русском нет. Отпуск с работы — urlop, а школьные каникулы — wakacje, всегда во множественном. В отпуске — na urlopie, с предлогом NA, где русский говорит «в». Польская особенность — urlop na żądanie, четыре дня в году без согласования. В местном p смягчается: urlopie."
idioms:
  - { pl: "być na urlopie", ru: "быть в отпуске" }
  - { pl: "urlop na żądanie", ru: "отпуск по требованию" }
