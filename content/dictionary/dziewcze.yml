    examples:
      - pl: "Pieśń o dziewczęciu znad rzeki."
        ru: "Песня о деве с реки."
        source: { kind: authored }
      - pl: "Dziewczęta szły łąką ze śpiewem."
        ru: "Девушки шли лугом с песней."
        source: { kind: authored }
  - id: young-girls
    ru: "девочки, девушки (о группе)"
    examples:
      - pl: "Dziewcząt było więcej niż chłopców."
        ru: "Девочек было больше, чем мальчиков."
        source: { kind: authored }
notes:
  - { kind: usage, text: "СУЩЕСТВИТЕЛЬНОЕ СРЕДНЕГО РОДА О ЧЕЛОВЕКЕ ЖЕНСКОГО ПОЛА — ЭТО НОРМА, А НЕ ОШИБКА. Dziewczę среднего рода, поэтому ладne dziewczę, а не ładna. То же у niemowlę «младенец» и książę «князь». Согласование идёт по грамматическому роду, а не по смыслу." }
  - { kind: register, text: "Слово книжное и слегка архаичное: в живой речи говорят dziewczyna или dziewczynka. Dziewczę встречается в песнях, стихах и стилизации под старину. Зато множественное DZIEWCZĘTA совершенно обиходно и служит обычным множественным к dziewczyna: chłopcy i dziewczęta." }
  - { kind: pronunciation, text: "Два слога, ударение на первом в единственном: DZIEW-czę. Dzi читается как мягкое дзь, cz как ч, конечное ę как короткое э: «дзе́вчэ». Во множественном ударение на предпоследнем: dziew-CZĘ-ta." }
collocations:
  - { pl: "chłopcy i dziewczęta", ru: "мальчики и девочки" }
  - { pl: "młode dziewczę", ru: "юная девушка" }
  - { pl: "wiejskie dziewczę", ru: "деревенская девушка" }
family:
  - { pl: "dziewczyna", ru: "девушка", relation: root, id: dziewczyna }
  - { pl: "dziewczynka", ru: "девочка", relation: derived, id: dziewczynka }
  - { pl: "chłopiec", ru: "мальчик", relation: antonym, id: chlopiec }
etymology: "От праславянского *děva «дева» с уменьшительным суффиксом -ę, тем же, что в zwierzę и cielę. Корень тот же, что в русском «дева», «девочка». Суффикс изначально означал детёныша, отсюда средний род."
memory: "dziewczę — «девушка», но среднего рода: ładne dziewczę. Склоняется как zwierzę и cielę, через вставку -ęci-: dziewczęcia, dziewczęciu. Единственное книжное, множественное dziewczęta — обычное."
idioms:
  - { pl: "dziewczę na wydaniu", ru: "девушка на выданье" }
  - { pl: "chłopcy i dziewczęta", ru: "ребята, молодёжь" }
