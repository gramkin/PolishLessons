etymology: "От seks, то есть английского sex и латинского sexus «пол», плюс исконно польский суффикс -owny, тот же, что в wygodny и wartościowy. Вышел гибрид: английский корень на польском суффиксе. Рядом живёт seksualny, пришедшее прямо из латыни через научный язык, — и именно оно отвечает русскому «сексуальный» в техническом смысле."
memory: "seksowny — «сексапильный, привлекательный», и путать его с seksualny нельзя: второе значит «половой» и живёт в оборотах вроде edukacja seksualna. Русское «сексуальный» покрывает оба. А парадигма здесь образцовая: тридцать три формы, полный набор со степенями сравнения."
