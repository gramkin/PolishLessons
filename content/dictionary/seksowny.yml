notes:
  - { kind: false-friend, text: "РУССКИЙ ОБХОДИТСЯ ОДНИМ СЛОВОМ, ПОЛЬСКИЙ ДЕЛИТ ЕГО НАДВОЕ. Русское «сексуальный» значит и «привлекательный», и «относящийся к полу». В польском это два разных прилагательных, и перепутать их неловко. Seksowny — только «сексапильный, привлекательный»: seksowny głos, seksowna sukienka. А seksualny — термин: życie seksualne «половая жизнь», edukacja seksualna «половое воспитание», orientacja seksualna. Сказать edukacja seksowna нельзя." }
  - { kind: usage, text: "ПОЛНАЯ ПАРАДИГМА ГРАДУИРУЕМОГО ПРИЛАГАТЕЛЬНОГО — ТРИДЦАТЬ ТРИ ФОРМЫ. Одиннадцать в положительной степени, одиннадцать в сравнительной (seksowniejszy) и одиннадцать в превосходной (najseksowniejszy). Сравните: у kosmiczny и przeciwny всего одиннадцать, потому что относительные прилагательные не сравниваются, а у średni десять из-за мягкой основы. Эти три числа — 33, 11 и 10 — покрывают почти все польские прилагательные." }
  - { kind: pronunciation, text: "Три слога, ударение на предпоследнем: sek-SOW-ny, «сэксо́вны». В сравнительной степени слогов прибавляется, и ударение послушно едет вправо: sek-sow-NIEJ-szy, «сэксовне́йшы»." }
  - { kind: register, text: "Слово разговорное, но вполне приличное: его печатают в журналах и произносят в рекламе. Переносное употребление касается чего угодно броского: seksowne hasło, seksowna oferta. Наречие seksownie значит «сексуально, эффектно»." }
