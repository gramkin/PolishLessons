etymology: "Сложено из старого указательного местоимения ÓW «тот» и CZAS «время» с суффиксом -ESNY: «относящийся к тому времени». Так же построено наречие WÓWCZAS «тогда», из W ÓW CZAS «в тот час»."
memory: "WÓWCZAS — «тогда», ÓWCZESNY — «тогдашний»: ÓW значит «тот», CZAS — «время». ÓWCZESNY PREZYDENT — «тогдашний президент», а нынешний — OBECNY."
