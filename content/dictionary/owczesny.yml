notes:
  - { kind: usage, text: "ÓWCZESNY — точное соответствие русскому «тогдашний»: время уже названо в разговоре, и слово отсылает к нему. Противоположность — OBECNY или DZISIEJSZY «нынешний»: ÓWCZESNY PREZYDENT — «тогдашний президент», OBECNY PREZYDENT — «нынешний». Слово книжное, частое в истории, журналистике и биографиях; в разговоре проще сказать TAMTEN или Z TAMTYCH CZASÓW. Не сравнивается, поэтому форм одиннадцать. Мужско-личное множественное — ÓWCZEŚNI: S перед NI смягчается в Ś, как в CIASNY — CIAŚNI." }
  - { kind: pronunciation, text: "Читается «уфчэ́сны»: Ó — «у», W перед глухим CZ оглушается в «ф», CZ — твёрдое «ч». Ударение на предпоследнем слоге. В форме ÓWCZEŚNI появляется мягкое «сь»: «уфчэ́сьни»." }
  - { kind: false-friend, text: "Начальное ÓW не связано с «овца» и не родня «вчера». ÓW — старое польское указательное местоимение «тот», которое сохранилось в книжной речи (OWA KOBIETA «та самая женщина») и в двух словах на каждый день: WÓWCZAS «тогда» (буквально «в тот час») и ÓWCZESNY «тогдашний»." }
