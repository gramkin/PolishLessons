notes:
  - { kind: false-friend, text: "Русское «яблоко» и польское jabłko — одно слово. Но читается оно «я́пко»: сочетание bł в беглой речи упрощается, звука «у» от ł тут не слышно." }
  - { kind: government, text: "Средний род: to jabłko, tego jabłka. Родительный мн. — jabłek." }
  - { kind: usage, text: "Wielkie Jabłko — «Большое Яблоко», прозвище Нью-Йорка; в корпусе оно есть." }
  - { kind: usage, text: "Adam’s apple по-польски jabłko Adama; сорт — jabłko deserowe." }
collocations:
  - { pl: "sok jabłkowy", ru: "яблочный сок" }
  - { pl: "ciasto z jabłkami", ru: "пирог с яблоками" }
etymology: "Праславянское *ablъko; русское «яблоко» — то же слово."
memory: "jabłko — «яблоко», но читается «я́пко»: bł упрощается, звука у не слышно. Родительный мн. — jabłek."
idioms:
  - { pl: "ciasto z jabłkami", ru: "пирог с яблоками" }
