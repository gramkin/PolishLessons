etymology: "Из приставки Z- (в виде Ś- перед мягким) и корня *tęgnǫti «тянуть», того же, что русское «тянуть» и «тяга». Гнездо в польском широкое и прозрачное для русскоязычного: CIĄGNĄĆ «тянуть», POCIĄG «поезд», буквально «то, что тянут», CIĄG «тяга» и «последовательность», WYCIĄG «вытяжка, подъёмник». Буквальное значение ŚCIĄGAĆ — «стянуть вниз, снять», и оно совпадает с русским «стягивать». Два новых значения выросли из этого образа в двадцатом веке. Школьное «списывать» — от стягивания текста к себе, украдкой, и оттуда ŚCIĄGA «шпаргалка». Компьютерное «скачивать» — калька английского DOWNLOAD, где польский выбрал «стягивать сверху вниз», а русский — «качать», из жаргона связистов. Одна метафора, два разных перевода одного английского слова."
memory: "Корень ciąg = русское «тяг»: ciągnąć «тянуть», pociąg «поезд». Буквально ściągać это «стягивать, снимать» (ściągać buty). Но два главных современных значения свои: «скачивать файл» (ściągać plik z internetu) и «списывать на экзамене», откуда ściąga «шпаргалка». Русский берёт для них другие корни — «качать» и «списывать». Управление: откуда — z + родительный, у кого списывать — od + родительный. Звук ŚCI это «сьць», не «сти» и не «щи»."
