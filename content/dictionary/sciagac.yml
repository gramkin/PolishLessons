notes:
  - { kind: false-friend, text: "Корень CIĄG — это русское «тяг»: CIĄGNĄĆ «тянуть», POCIĄG «поезд», то есть «то, что тянут», CIĄG «тяга, последовательность». Поэтому ŚCIĄGAĆ буквально «стягивать», и это значение есть: ŚCIĄGAĆ BUTY «снимать обувь», ŚCIĄGAĆ PLAKAT «снимать плакат». Но два главных современных значения русскому не отвечают вовсе. Первое — компьютерное: ŚCIĄGAĆ PLIK значит «скачивать файл», и это обычное слово, не жаргон. Второе — школьное: ŚCIĄGAĆ NA EGZAMINIE значит «списывать», а существительное ŚCIĄGA — это «шпаргалка». Русский в обоих случаях берёт другие корни, «качать» и «списывать»." }
  - { kind: usage, text: "Несовершенный вид, переходный, шестьдесят три формы: сорок две от глагола, десять от действительного причастия ŚCIĄGAJĄCY, одиннадцать от страдательного ŚCIĄGANY. Совершенная пара — ŚCIĄGNĄĆ, с носовым и без -A-: ŚCIĄGAM против ŚCIĄGNĘ. В школьном значении употребляется и без дополнения: ON ŚCIĄGA «он списывает». Существительные делят значения между собой: ŚCIĄGA «шпаргалка», ŚCIĄGACZ «резинка на свитере», ŚCIĄGNIĘCIE «снятие, скачивание». Возвратное ŚCIĄGAĆ SIĘ значит «стягиваться, сходиться»: CHMURY SIĘ ŚCIĄGAJĄ «тучи сходятся»." }
  - { kind: government, text: "Переходный: снимать что — винительный без предлога, ŚCIĄGAĆ BUTY, CZAPKĘ, PLAKAT. Откуда — предлог Z с родительным: ŚCIĄGAĆ ZE ŚCIANY, Z GŁOWY, Z INTERNETU, и русское «с чего-то» совпадает. В компьютерном значении тоже Z: ŚCIĄGAĆ Z SERWERA, Z NIEZNANYCH STRON. В школьном значении — предлог OD с родительным для источника: ŚCIĄGAĆ OD KOLEGI «списывать у товарища», где русский говорит «у кого-то», тоже с родительным. Отрицание переводит дополнение в родительный: NIE ŚCIĄGAJ TEGO PLIKU." }
  - { kind: pronunciation, text: "Читается «сьцё́нгаць», ударение на первом слоге. Начальное ŚCI это два мягких звука подряд, «сьць», и русскому их приходится осваивать отдельно: не «сти» и не «щи», а именно «сьць». Носовое Ą перед G даёт «он». Конечное Ć — мягкое «ць». В совершенном виде ŚCIĄGNĄĆ два носовых подряд: «сьцёнгно́нць». В существительном ŚCIĄGA два слога, ударение на первом: «сьцё́нга»." }
