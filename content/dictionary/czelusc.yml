notes:
  - { kind: false-friend, text: "CZELUŚĆ похожа на русское «челюсть» и родственна ему, но значит «бездна, глубокая тёмная пасть». Русская «челюсть» по-польски — SZCZĘKA." }
  - { kind: register, text: "Слово книжное, в разговоре звучит шутливо: W CZELUŚCIACH SZAFY — «в недрах шкафа». В обычной речи говорят PRZEPAŚĆ (пропасть) или GŁĘBINA." }
  - { kind: usage, text: "Женский род на мягкий согласный, как KOŚĆ: родительный, дательный и предложный — CZELUŚCI. Во множественном две формы именительного: CZELUŚCI и CZELUŚCIE; часто именно множественное: W CZELUŚCIACH." }
  - { kind: pronunciation, text: "ŚĆ читается «сьць», L перед U — обычное «л»: «чэ́лусьць»." }
