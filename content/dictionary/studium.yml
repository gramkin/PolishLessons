# review
id: studium
format: 2
lemma: "studium"
rank: 2160
pos: noun
pron: { cyr: "сту́дьюм" }
senses:
  - id: studies
    ru: "учёба в вузе (во множественном: studia)"
    examples:
      - pl: "Oszczędzam pieniądze na studia za granicą."
        ru: "Я коплю деньги на учёбу за границей."
        source: { kind: tatoeba, id: 3051077 }
      - pl: "Ona przerwała studia."
        ru: "Она бросила учёбу."
        source: { kind: translated, id: 8276567 }
      - pl: "Po ukończeniu studiów wrócił na wieś."
        ru: "После окончания учёбы он вернулся в деревню."
        source: { kind: tatoeba, id: 3657093 }
  - id: study
    ru: "исследование, очерк (единственное число)"
    examples:
      - pl: "Poświęcała czas studiom nad muzyką."
        ru: "Она посвящала время занятиям музыкой."
        source: { kind: translated, id: 359128 }
      - pl: "Jest świeżo po studiach."
        ru: "Он только что окончил университет."
        source: { kind: translated, id: 2139039 }
notes:
  - { kind: government, text: "Главная особенность: во множественном числе studia значит «учёба в вузе», и именно так слово употребляется чаще всего. Единственное studium — это «исследование, очерк, этюд»." }
  - { kind: usage, text: "iść na studia «поступать в вуз», skończyć studia «окончить вуз», po studiach «после вуза»." }
  - { kind: false-friend, text: "Не «студия» в смысле мастерской или телестудии — та будет studio, среднего рода и несклоняемое." }
  - { kind: usage, text: "Средний род, латинское склонение: studium, studia, studiów." }
collocations:
  - { pl: "iść na studia", ru: "поступать в вуз" }
  - { pl: "skończyć studia", ru: "окончить вуз" }
etymology: "Из латинского studium «усердие, занятие»; русское «студия» и «студент» — из того же корня."
memory: "studium в единственном числе значит «исследование, очерк», а во множественном studia — «учёба в вузе», и так оно встречается чаще. Мастерская или телестудия — это studio."
idioms:
  - { pl: "iść na studia", ru: "поступать в вуз" }
  - { pl: "skończyć studia", ru: "окончить вуз" }
