# review
id: pa
format: 2
lemma: "pa"
rank: 795
pos: interj
pron: { cyr: "па" }
senses:
  - id: bye
    ru: "пока! (фамильярное прощание)"
    examples:
      - pl: "Pa!"
        ru: "Пока!"
        source: { kind: translated, id: 709902 }
      - pl: "Pa, Tom."
        ru: "Пока, Том."
        source: { kind: translated, id: 12360262 }
      - pl: "Pa, do jutra!"
        ru: "Пока, до завтра!"
        source: { kind: authored }
  - id: pa-pa
    ru: "Pa pa! — пока-пока!"
    examples:
      - pl: "Pa pa!"
        ru: "Пока-пока!"
        source: { kind: translated, id: 8620933 }
      - pl: "Pa-pa!"
        ru: "Пока-пока!"
        source: { kind: translated, id: 13778295 }
      - pl: "Pa pa, dzieci!"
        ru: "Пока-пока, дети!"
        source: { kind: authored }
  - id: register
    ru: "pa — для своих; do widzenia — для остальных"
    note: "Ровно как русская пара «пока» / «до свидания»."
    examples:
      - pl: "Kolegom mówimy pa."
        ru: "Приятелям говорим «пока»."
        source: { kind: authored }
      - pl: "Szefowi nie mówi się pa."
        ru: "Начальнику «пока» не говорят."
        source: { kind: authored }
      - pl: "Pa, kochanie."
        ru: "Пока, дорогая."
        source: { kind: authored }
  - id: to-children
    ru: "в обращении к детям"
    examples:
      - pl: "Zrób pa pa rączką."
        ru: "Помаши ручкой «пока-пока»."
        source: { kind: authored }
      - pl: "Powiedz babci pa."
        ru: "Скажи бабушке «пока»."
        source: { kind: authored }
      - pl: "Pa, śpij dobrze."
        ru: "Пока, спи спокойно."
        source: { kind: authored }
notes:
  - { kind: register, text: "pa — фамильярное «пока», для друзей, детей и близких. Начальнику или незнакомому говорят do widzenia. Пара pa / do widzenia работает ровно как русская «пока» / «до свидания»." }
  - { kind: usage, text: "Часто удваивается: Pa pa! или Pa-pa!, особенно когда обращаются к детям." }
  - { kind: usage, text: "Слово не изменяется вовсе и стоит отдельной репликой." }
  - { kind: usage, text: "Другие прощания по возрастанию официальности: pa и na razie «пока», trzymaj się «бывай», do zobaczenia «до встречи», do widzenia «до свидания». Cześć работает в обе стороны — и «привет», и «пока»." }
