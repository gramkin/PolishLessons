etymology: "Из праславянского *ljudъ — того же слова, что русские «люд» и «люди». Дальняя родня — немецкое Leute, а исходный корень означал «расти, народиться». Отсюда ludzie «люди», ludowy «народный», ludność «население», ludzki «человеческий» и ludzkość «человечество»."
memory: "lud — «народ», и это русский «люд», только не разговорный, а самый обычный. Запомните подвох падежа: w ludzie значит «в народе», хотя само ludzie — это «люди». И на конце оглушение: «лут»."
