        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Польское lud — это русский «люд», но в полном праве. В русском «люд» стало собирательным и слегка старомодным: «рабочий люд», «честной люд», а обычное слово — «народ». В польском ровно наоборот: lud нейтрально и стоит там, где русский скажет «народ» — prosty lud, ludy słowiańskie, Wiosna Ludów «Весна народов»." }
  - { kind: pronunciation, text: "ЛОВУШКА С ФОРМОЙ ludzie. В предложном падеже d смягчается в dzi: w ludzie значит «в народе». Но ludzie — это ещё и «люди», именительный множественного от człowiek, слово в сотни раз более частое. Одна форма, два разных слова: различать помогает предлог и согласование. Само lud звучит «лут» — конечное d оглушается." }
  - { kind: usage, text: "Множественное ludy значит «народы» как этнические общности: ludy Syberii, ludy koczownicze, ludy słowiańskie. Для «людей» в обычном смысле служит ludzie, у которого единственное число супплетивное — człowiek «человек». Так что lud и ludzie — разные слова, а не одно в двух числах." }
