etymology: "От JAPONIA, через латинское IAPONIA и португальское JAPÃO, а то — из китайского чтения названия страны, которое по-японски звучит NIHON или NIPPON, «происхождение солнца». Суффикс -SKI образует в польском относительные прилагательные от названий мест и народов и отвечает русскому -СКИЙ один к одному: JAPOŃSKI и «японский», POLSKI и «польский». Разошлись языки только в орфографии: польский закрепил большую букву за существительным и маленькую за прилагательным, а русский обходится маленькой в обоих случаях. Чередование -SKI и -SCY в мужском личном множественном восходит ко второй палатализации, тому же процессу, который дал C на месте K в DZIWACY и POLACY."
memory: "Мужской личный множественного: japońscy, с переходом -ski в -scy — и так у всех прилагательных на -ski (polski/polscy, rosyjski/rosyjscy). Орфография зеркальна русской: существительное с большой (Japończyk, Rosjanin), прилагательное с маленькой (japoński, rosyjski); русский не пишет с большой ни одного. «По-японски» — po japońsku, с особой формой на -u, которой в таблице прилагательного нет."
