notes:
  - { kind: usage, text: "В мужском личном именительном множественного сочетание -SKI переходит в -SCY: JAPOŃSCY, а не «japońskie» и не «japońscy» с твёрдым с. Это правило охватывает все прилагательные на -SKI, которых в польском сотни: POLSKI даёт POLSCY, ROSYJSKI — ROSYJSCY, WIEJSKI — WIEJSCY, MIEJSKI — MIEJSCY. Запомнив один случай, получаете весь разряд. Для вещей и для женского рода форма другая: JAPOŃSKIE SAMOCHODY, JAPOŃSKA KUCHNIA. Прилагательное относительное, степеней сравнения не образует, поэтому форм одиннадцать." }
  - { kind: false-friend, text: "Ловушка не в значении, а в орфографии, и она зеркальна русской. Польский пишет с большой буквы существительные, обозначающие людей по национальности, и с маленькой — прилагательные от них: JAPOŃCZYK «японец», но JĘZYK JAPOŃSKI; ROSJANIN, но ROSYJSKI; POLAK, но POLSKI. Русский не пишет с большой ни того, ни другого. Поэтому ошибка идёт в одну сторону: русскоязычный пишет japończyk с маленькой, а это неверно. Названия стран, разумеется, с большой: JAPONIA. Названия языков — с маленькой, как и в русском." }
  - { kind: government, text: "Согласуется с существительным в роде, числе и падеже. Частотные сочетания: JĘZYK JAPOŃSKI «японский язык», KUCHNIA JAPOŃSKA, SAMOCHÓD JAPOŃSKI, KULTURA JAPOŃSKA. «По-японски» передаётся наречием PO JAPOŃSKU, с предлогом PO и особой формой на -U: MÓWI PO JAPOŃSKU «он говорит по-японски». Эта конструкция работает со всеми языками: PO POLSKU, PO ROSYJSKU, и её стоит выучить отдельно, потому что форма на -U не входит в обычную таблицу прилагательного." }
  - { kind: pronunciation, text: "Читается «япо́ньски», три слога, ударение на предпоследнем. Буква J в начале даёт «й», так что первый слог звучит «я». Буква Ń это мягкое «нь», произносимое отчётливо перед S. Сочетание SK твёрдое. Конечное -I даёт «и». В мужском личном множественном JAPOŃSCY сочетание SC читается «сц»: «япо́ньсцы», и на слух разница с JAPOŃSKI очевидна. В наречии PO JAPOŃSKU конечное -U звучит «у»." }
