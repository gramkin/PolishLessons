etymology: "От MIASTO «город», из праславянского *město «место». И вот здесь лежит расхождение, которое стоит знать: в польском слово сузилось до города, а общее значение «место» взяло на себя MIEJSCE, тогда как русский оставил «место» в общем смысле, а для города взял слово «город», от «городить, огораживать». Поэтому польское MIASTO и русское «место» — одно слово с разошедшимися значениями, и прилагательное MIEJSKI буквально значит «местный», а понимается как «городской». Чередование ST и JSK в основе — обычное польское: MIASTO, но MIEJSKI и W MIEŚCIE."
memory: "От miasto «город», а то — то же слово, что русское «место»: польский сузил его до города, а общее значение отдал miejsce. Относительное, степеней нет, одиннадцать форм. Мужско-личное множественное miejscy, с переходом sk в sc, как polski и polscy. Mieszczański значит «мещанский» и в нейтральном сословном смысле тоже."
