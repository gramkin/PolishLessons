notes:
  - { kind: usage, text: "Относительное прилагательное: степеней сравнения нет, и одиннадцать форм в таблице, как у TELEFONICZNY, HANDLOWY, PRAWNY и KOBIECY. Разделение с русским полезно отметить: MIEJSKI покрывает и «городской» в смысле места, и «муниципальный» в смысле принадлежности городу, тогда да русский второе значение передаёт отдельным словом. URZĄD MIEJSKI есть городская управа, SPÓŁKA MIEJSKA — муниципальное предприятие, MIESZKANIE MIEJSKIE — квартира из городского фонда. Прилагательное к «горожанину» другое: MIESZCZAŃSKI, и оно несёт ещё и исторический смысл, «бюргерский»." }
  - { kind: pronunciation, text: "Читается «ме́йски», ударение на первом слоге из двух. Сочетание MIE даёт «ме» с мягким m, а JS произносится слитно, «йс». Главное в карточке — мужско-личная форма множественного MIEJSCY: там сочетание SK переходит в SC и смягчается, «ме́йсцы». Это обязательное чередование у прилагательных на -SKI: POLSKI и POLSCY, WIEJSKI и WIEJSCY, MIEJSKI и MIEJSCY. Форма MIEJSKI для мужчин во множественном невозможна." }
  - { kind: government, text: "Прилагательное согласуется с существительным и ничем не управляет. В официальных названиях стоит после существительного и пишется со строчной, если это не часть собственного имени: URZĄD MIEJSKI, RADA MIEJSKA, STRAŻ MIEJSKA «городская стража, муниципальная полиция». Последнее стоит знать: STRAŻ MIEJSKA есть отдельная от полиции служба, занимающаяся порядком в городе, и русского точного соответствия у неё нет. Существительное — MIASTO «город», а горожанин — MIESZCZANIN." }
  - { kind: false-friend, text: "Ловушки в значении нет, зато есть в однокоренных словах. MIEJSKI значит «городской», но MIESZCZAŃSKI, от MIESZCZANIN «горожанин, бюргер», значит «мещанский» в обоих смыслах: и сословном, историческом, и оценочном, о вкусах. Русское «мещанский» сохранило только второй, неодобрительный. Поэтому KULTURA MIESZCZAŃSKA в польской книге по истории — нейтральное обозначение городской сословной культуры, а не упрёк, и переводить его русским «мещанским» нужно с осторожностью." }
