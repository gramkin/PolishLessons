# review
id: burza
format: 2
lemma: "burza"
rank: 1844
pos: noun
pron: { cyr: "бу́жа" }
senses:
  - id: storm
    ru: "гроза, буря"
    examples:
      - pl: "Idzie burza."
        ru: "Идёт гроза."
        source: { kind: translated, id: 840182 }
      - pl: "Będzie burza."
        ru: "Будет гроза."
        source: { kind: translated, id: 3761558 }
      - pl: "Burza ucichła."
        ru: "Буря стихла."
        source: { kind: tatoeba, id: 6320183 }
      - pl: "Nadchodzi burza."
        ru: "Приближается гроза."
        source: { kind: translated, id: 5065062 }
      - pl: "Złapała nas burza."
        ru: "Нас застала гроза."
        source: { kind: translated, id: 933510 }
      - pl: "Naprawdę boję się burzy."
        ru: "Я очень боюсь грозы."
        source: { kind: translated, id: 2303410 }
  - id: storm-effects
    ru: "о последствиях грозы"
    examples:
      - pl: "Dach został uszkodzony podczas burzy."
        ru: "Крыша была повреждена штормом."
        source: { kind: tatoeba, id: 363024 }
      - pl: "Spóźniliśmy się z powodu burzy."
        ru: "Мы опоздали из-за шторма."
        source: { kind: tatoeba, id: 904475 }
      - pl: "Łódka zatonęła w czasie burzy."
        ru: "Лодка затонула во время грозы."
        source: { kind: translated, id: 722267 }
notes:
  - { kind: false-friend, text: "Основное значение — русское «гроза», а не «буря»: burza z piorunami «гроза с молниями». Буря на море — sztorm." }
  - { kind: usage, text: "Осторожно с омонимией: формы burzą и burzę совпадают с глаголом burzyć «сносить, разрушать». Trzęsienia ziemi burzą budynki значит «землетрясения разрушают здания» и к грозе отношения не имеет." }
  - { kind: usage, text: "burza mózgów — «мозговой штурм», калька английского brainstorming." }
  - { kind: usage, text: "Поговорка Kto sieje wiatr, zbiera burzę — «Кто сеет ветер, пожнёт бурю»." }
collocations:
  - { pl: "idzie burza", ru: "идёт гроза" }
  - { pl: "burza z piorunami", ru: "гроза с молниями" }
  - { pl: "cisza przed burzą", ru: "затишье перед бурей" }
etymology: "Праславянское *burja. Русское «буря» — то же самое слово, но в польском оно сместилось к значению «гроза», а морская буря называется sztorm."
memory: "burza — прежде всего «гроза»: Idzie burza «Идёт гроза». Морская буря — sztorm. И помните burza mózgów «мозговой штурм»."
idioms:
  - { pl: "burza mózgów", ru: "мозговой штурм" }
  - { pl: "cisza przed burzą", ru: "затишье перед бурей" }
  - { pl: "kto sieje wiatr, zbiera burzę", ru: "кто сеет ветер, пожнёт бурю" }
