etymology: "Приставка ZA- плюс WALIĆ, от праславянского *valiti «валить, катить». Русский сохранил и глагол, и всё гнездо: «валить», «вал», «обвал», «завал», «свалка», «повалить». Польское гнездо такое же широкое — WALIĆ, ZAWALIĆ, OBALIĆ, ZWALIĆ, WAŁ, — но значения разошлись в двух местах, и оба стоит знать. Простое WALIĆ сдвинулось к удару: бить, колотить, хлестать. А существительное ZAWAŁ ушло в медицину и значит «инфаркт», потому что сердечный сосуд при нём именно заваливается, закупоривается. Русский «завал» остался при земле и камнях."
memory: "Корень тот же, что в «валить», и второе значение совпадает с русским разговорным точно: zawalić egzamin это «завалить экзамен». Но два слова гнезда обманывают. Zawał значит «инфаркт», а не «завал»: zawał serca. И само walić значит прежде всего «бить, колотить» — walić w drzwi «колотить в дверь». Ещё обороты: zawalony robotą «завален работой», dach się zawalił «крыша обрушилась»."
idioms:
