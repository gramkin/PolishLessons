notes:
  - { kind: false-friend, text: "Самое важное предупреждение на этой карточке касается существительного. Польское ZAWAŁ значит «инфаркт», а не «завал»: ZAWAŁ SERCA это сердечный приступ, и услышать это слово можно в любой больнице. Русский «завал» по-польски будет ZATOR или ZWAŁY. Второе предупреждение про сам корень: WALIĆ значит прежде всего «бить, колотить», а не «валить». WALIĆ W DRZWI это «колотить в дверь», WALI DESZCZ — «дождь хлещет». А OBALIĆ значит «свергнуть» или «опровергнуть»: OBALIĆ RZĄD, OBALIĆ TEORIĘ." }
  - { kind: usage, text: "Второе значение совпадает с русским разговорным полностью: ZAWALIĆ EGZAMIN это ровно «завалить экзамен», а ZAWALIĆ SPRAWĘ — «завалить дело». Такие полные совпадения в разговорном слое редки, и этим стоит пользоваться. Возвратное ZAWALIĆ SIĘ значит «обрушиться»: DACH SIĘ ZAWALIŁ «крыша обрушилась». Причастие ZAWALONY работает как прилагательное и даёт самый ходовой оборот: ZAWALONY ROBOTĄ «завален работой», и русский говорит так же. Пятьдесят три формы — подпись переходного глагола совершенного вида." }
  - { kind: government, text: "Схема первая: ZAWALIĆ COŚ CZYMŚ — винительный на место и творительный на то, чем заваливают. ZAWALILI KORYTARZ PUDŁAMI совпадает с русским «завалили коридор коробками» падеж в падеж. Схема вторая проще: ZAWALIĆ COŚ, один винительный — ZAWALIĆ EGZAMIN, ZAWALIĆ TERMIN «просрочить». Причастие берёт творительный: ZAWALONY ROBOTĄ, ZAWALONY PAPIERAMI. Возвратное ZAWALIĆ SIĘ дополнения не требует вовсе." }
  - { kind: pronunciation, text: "Читается «зава́личь», три слога, ударение на предпоследнем. Буква W звучит как «в», буква L перед I мягкая, как русское «ль». Конечное Ć мягкое, «чь». В существительном ZAWAŁ буква Ł даёт «у», поэтому слышно «за́вау», и это сильно отличается от русского «завал»; разница в последнем звуке помогает не спутать слова. В причастии ZAWALONY слышно «завалё́ны»." }
  - { kind: register, text: "Первое значение нейтральное, второе разговорное, но очень живое, особенно в студенческой речи: ZAWALIŁEM SESJĘ «я завалил сессию». Оборот ZAWALONY ROBOTĄ слышен в любом офисе. Возвратное ZAWALIĆ SIĘ о постройке нейтрально и годится для новостей: ZAWALIŁ SIĘ MOST. Медицинское ZAWAŁ стоит особняком и разговорности не имеет. Для «загромоздить» есть и нейтральное ZASTAWIĆ, а для «просрочить» — SPÓŹNIĆ SIĘ Z CZYMŚ." }
