# review
id: zona
format: 2
lemma: "żona"
rank: 226
pos: noun
pron: { cyr: "жо́на" }
senses:
  - id: wife
    ru: "жена, супруга"
    examples:
      - pl: "Ona jest moją żoną."
        ru: "Она моя жена."
        source: { kind: tatoeba, id: 2630829 }
      - pl: "To moja żona, Edyta."
        ru: "Это моя жена Эдита."
        source: { kind: tatoeba, id: 722440 }
      - pl: "Moja żona jest lekarzem."
        ru: "Моя жена — врач."
        source: { kind: tatoeba, id: 675374 }
  - id: wife-of
    ru: "жена (при описании, в оборотах)"
    examples:
      - pl: "Ona jest żoną Alaina."
        ru: "Она супруга Алэна."
        source: { kind: tatoeba, id: 524724 }
      - pl: "Jorgen kocha swoją żonę."
        ru: "Йорген любит свою жену."
        source: { kind: tatoeba, id: 3049338 }
      - pl: "Jego żona jest Francuską."
        ru: "Его жена - француженка."
        source: { kind: tatoeba, id: 2732812 }
notes:
  - { kind: false-friend, text: "żona значит только «супруга». «Женщина» по-польски kobieta, хотя праславянское *žena значило именно «женщина» — как когда-то и русское «жена»." }
  - { kind: usage, text: "Пара: żona «жена» — mąż «муж». wyjść za mąż «выйти замуж» (о женщине), ożenić się «жениться» (о мужчине)." }
collocations:
  - { pl: "moja żona", ru: "моя жена" }
  - { pl: "była żona", ru: "бывшая жена" }
  - { pl: "żona i mąż", ru: "жена и муж" }
  - { pl: "wziąć za żonę", ru: "взять в жёны" }
etymology: "Праславянское *žena «женщина, супруга»; то же слово, что русское «жена», а по индоевропейскому корню родственно греческому «гинекология»."
memory: "żona — только «супруга»; «женщина» — kobieta. И пара глаголов разная: wyjść za mąż о женщине, ożenić się о мужчине."
idioms:
  - { pl: "dobra żona – mężowi korona", ru: "хорошая жена — мужу корона" }
  - { pl: "wziąć za żonę", ru: "взять в жёны" }
  - { pl: "była żona", ru: "бывшая жена" }
formExamplesSkip:
  - { form: "żono", reason: "звательный падеж встречается только в стилизованной речи: к жене обращаются по имени" }
formExamples:
  - form: "żon"
    pl: "Arystoteles utrzymywał, że kobiety mają mniej zębów niż mężczyźni. Choć był żonaty dwukrotnie, nigdy nie wpadł na to, by zweryfikować swoje stwierdzenie przez oględziny ust swoich żon."
    ru: "Аристотель утверждал, что у женщин меньше зубов, чем у мужчин. Хоть он и был дважды женат, ему ни разу не пришло в голову проверить это утверждение, посмотрев во рту у своей жены."
    source: { kind: tatoeba, id: 969833 }
  - form: "żon"
    pl: "W tej wsi wiele żon pracuje w mieście."
    ru: "В этой деревне многие жёны работают в городе."
