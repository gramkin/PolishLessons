# review
id: inspektor
format: 2
lemma: "inspektor"
rank: 2022
pos: noun
pron: { cyr: "инспэ́ктор" }
senses:
  - id: inspector
    ru: "инспектор, проверяющий"
    examples:
      - pl: "Inspektor obiecał zająć się tą sprawą natychmiast."
        ru: "Инспектор пообещал немедленно заняться этим делом."
        source: { kind: translated, id: 856145 }
      - pl: "Obecnie pracuję jako inspektor w organizacji rządowej."
        ru: "Сейчас я работаю инспектором в государственной организации."
        source: { kind: translated, id: 880231 }
      - pl: "Inspektor natychmiast skrupulatnie spisał jego zeznania."
        ru: "Инспектор тут же тщательно записал его показания."
        source: { kind: translated, id: 751495 }
      - pl: "Inspektor przyszedł skontrolować dokumenty."
        ru: "Инспектор пришёл проверить документы."
        source: { kind: authored }
      - pl: "Rozmawiałem wczoraj z inspektorem."
        ru: "Вчера я говорил с инспектором."
        source: { kind: authored }
      - pl: "Inspektorzy sprawdzili całą halę."
        ru: "Инспекторы проверили весь цех."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Слово совпадает с русским «инспектор» и по значению, и по звучанию: оба из латинского inspector «наблюдатель»." }
  - { kind: usage, text: "Второе значение — офицерское звание в полиции: inspektor Policji. В британских детективах так переводят inspector." }
  - { kind: usage, text: "Мужское лицо, поэтому именительный множественного — inspektorzy, с чередованием r → rz." }
  - { kind: government, text: "У слова два именительных множественного: обычное inspektorzy и более официальное, старшее inspektorowie. Окончание -owie выражает почтение, поэтому с названиями профессий сочетается, а с бранными словами нет." }
collocations:
  - { pl: "inspektor pracy", ru: "инспектор труда" }
  - { pl: "inspektor policji", ru: "инспектор полиции" }
  - { pl: "pracować jako inspektor", ru: "работать инспектором" }
etymology: "Из латинского inspector «наблюдатель, смотритель», от inspicere «осматривать». Русское «инспектор» — то же заимствование, пришедшее тем же путём."
memory: "inspektor — «инспектор», слово-близнец русского. Во множественном числе для лиц — inspektorzy, с чередованием r на rz."
idioms:
  - { pl: "inspektor pracy", ru: "инспектор труда" }
  - { pl: "inspektor policji", ru: "инспектор полиции" }
  - { pl: "pracować jako inspektor", ru: "работать инспектором" }
