notes:
  - { kind: false-friend, text: "Русская «корова» и польское krowa — одно слово; различие только в полногласии: русское «оро», польское «ро». Тот же ряд: broda/борода, brzeg/берег." }
  - { kind: government, text: "Женский род: ta krowa, tej krowy. Доить корову — doić krowę, винительный." }
  - { kind: usage, text: "Оборот wytłumaczyć jak krowie na rowie значит «объяснить на пальцах», буквально «как корове на канаве»." }
  - { kind: usage, text: "Прилагательное krowi: krowie mleko «коровье молоко»." }
collocations:
  - { pl: "doić krowę", ru: "доить корову" }
  - { pl: "krowie mleko", ru: "коровье молоко" }
etymology: "Праславянское *korva; русская «корова» — то же слово, только с полногласием."
memory: "krowa — «корова». Полногласие отличает языки: krowa/корова, broda/борода, brzeg/берег. Оборот jak krowie na rowie — «на пальцах»."
idioms:
  - { pl: "doić krowę", ru: "доить корову" }
