# review
id: studio
format: 2
lemma: "studio"
rank: 1290
pos: noun
pron: { cyr: "сту́дьо" }
senses:
  - id: studies
    ru: "studia — учёба в вузе, высшее образование (только множественное)"
    note: "Именно это значение вы встретите почти всегда: в корпусе тридцать примеров на «учёбу» и один на «студию»."
    examples:
      - pl: "Chcę iść na studia."
        ru: "Я хочу поступить в университет."
        source: { kind: translated, id: 728431 }
      - pl: "Po ukończeniu studiów wrócił na wieś."
        ru: "После окончания учёбы он вернулся в деревню."
        source: { kind: tatoeba, id: 3657093 }
      - pl: "Jest na drugim roku studiów."
        ru: "Он на втором курсе."
        source: { kind: translated, id: 5105382 }
  - id: studio-room
    ru: "studio — студия (телевизионная, звукозаписи, художественная)"
    examples:
      - pl: "Gra została stworzona przez zagraniczne studio."
        ru: "Игра была создана зарубежной студией."
        source: { kind: translated, id: 6207820 }
      - pl: "To jest studio telewizyjne."
        ru: "Это телевизионная студия."
        source: { kind: authored }
      - pl: "Nowe studio nagraniowe otwarto w centrum."
        ru: "Новую студию звукозаписи открыли в центре."
        source: { kind: authored }
  - id: research
    ru: "studia nad czymś — исследования, изучение чего-либо"
    examples:
      - pl: "Chcę poświęcić się studiom nad historią."
        ru: "Я хочу посвятить себя изучению истории."
        source: { kind: translated, id: 771903 }
      - pl: "Poświęcała czas studiom nad muzyką."
        ru: "Она посвящала время занятиям музыкой."
        source: { kind: translated, id: 359128 }
      - pl: "Prowadzi studia nad językiem polskim."
        ru: "Он ведёт исследования по польскому языку."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Внимание: почти всё, что встретится в речи, — это studia «учёба в вузе», слово только во множественном числе. Единственное studio значит «студия»." }
  - { kind: false-friend, text: "Русское «студия» покрывает лишь одно из двух значений. Polskie studia — это высшее образование, а не «студии»: Chcę iść na studia «Я хочу поступить в университет»." }
  - { kind: government, text: "studia nad czymś значит «исследования чего-либо»: studia nad historią «исследования по истории»." }
  - { kind: usage, text: "Запомните связку предлогов: iść na studia «поступать в вуз», być na studiach «учиться в вузе», po studiach «после окончания вуза», rok studiów «курс»." }
collocations:
  - { pl: "iść na studia", ru: "поступить в университет" }
  - { pl: "na studiach", ru: "в университете, на учёбе" }
  - { pl: "po studiach", ru: "после окончания вуза" }
  - { pl: "rok studiów", ru: "курс (год обучения)" }
etymology: "Из латинского studium «усердие, занятие» — от него же русские «студия», «студент» и «штудировать». Польский развёл два слова внутри одной парадигмы: множественное studia «учёба» и единственное studio «студия»."
memory: "Два слова в одной парадигме. Множественное studia — это «учёба в вузе»: iść na studia, po studiach, rok studiów. Единственное studio — «студия»: studio telewizyjne. В живой речи почти всегда встретится множественное."
idioms:
  - { pl: "iść na studia", ru: "поступить в университет" }
  - { pl: "świeżo po studiach", ru: "только что окончив вуз" }
  - { pl: "studia wyższe", ru: "высшее образование" }
formExamplesSkip:
  - { form: "studia", cell: "Звательный", reason: "звательный падеж: к предмету или понятию не обращаются" }
