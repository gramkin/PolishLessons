notes:
  - { kind: false-friend, text: "Русское «отлёглый» не существует, а «отдалённый» польский передаёт словом ODLEGŁY, от ODLEGŁOŚĆ, «расстояние». Синоним DALEKI проще и частотнее. ODLEGŁY звучит чуть книжно и точно: ODLEGŁY O DWA KILOMETRY, «находящийся в двух километрах»." }
  - { kind: usage, text: "Полная парадигма: ODLEGŁY, ODLEGLEJSZY, NAJODLEGLEJSZY, с чередованием Ł на L в степенях. Мужское-личное: ODLEGLI, ODLEGLEJSI, NAJODLEGLEJSI — о дальних родственниках: ODLEGLI KREWNI." }
  - { kind: government, text: "Удалённый на какое-то расстояние — ODLEGŁY O + винительный: ODLEGŁY O PIĘĆ KILOMETRÓW. Удалённый от чего-то — ODLEGŁY OD + родительный: ODLEGŁY OD MIASTA. Русское «в пяти километрах» польский строит с O." }
  - { kind: pronunciation, text: "Читается «одлэ́гуы», три слога, ударение на предпоследнем. D перед L звонкое, LE — «лэ», Ł — «у». В ODLEGLEJSZY: «одлэгле́йшы»." }
  - { kind: register, text: "Книжное и нейтральное слово, частое в географии, астрономии и истории: ODLEGŁE KRAJE, ODLEGŁA PRZESZŁOŚĆ. В разговоре проще DALEKI." }
collocations:
  - { pl: "odległy krewny", ru: "дальний родственник" }
  - { pl: "odległa przeszłość", ru: "далёкое прошлое" }
  - { pl: "odległy o kilometr", ru: "в километре отсюда" }
family:
  - { pl: "odległość", ru: "расстояние", relation: derived, id: odleglosc }
  - { pl: "daleki", ru: "далёкий", relation: root, id: daleki }
  - { pl: "odlegle", ru: "отдалённо", relation: derived }
etymology: "Причастие от старого ODLEC, «отлечь, отойти», от LEC, «лечь». Отдалённое — то, что «отлегло» в сторону. Русское «отлегло», «отлегло от сердца» — тот же глагол, но значение другое."
memory: "Odległy — отдалённый, далёкий: odległa wioska, odległy krewny. Odległy o kilometr — в километре. Odległość — расстояние. Odleglejszy — ł→l. Читается «одлэ́гуы»."
idioms:
  - { pl: "odległa przeszłość", ru: "далёкое прошлое" }
