      - pl: "To odległa przeszłość."
        ru: "Это далёкое прошлое."
        source: { kind: authored }
      - pl: "Najodleglejsza galaktyka jest miliardy lat świetlnych stąd."
        ru: "Самая далёкая галактика в миллиардах световых лет отсюда."
        source: { kind: authored }
  - id: remote-relation
    ru: "отдалённый, дальний (о родстве, сходстве)"
    examples:
      - pl: "To mój odległy krewny."
        ru: "Это мой дальний родственник."
