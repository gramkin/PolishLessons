notes:
  - { kind: usage, text: "Суффикс этого слова стоит выучить как целое правило, потому что он покрывает сотни слов. Польскому -YCZNY отвечает русское -ический почти без исключений: ELEKTRYCZNY — «электрический», FIZYCZNY — «физический», TECHNICZNY — «технический», LOGICZNY — «логический», HISTORYCZNY — «исторический», PRAKTYCZNY — «практический». Соответствие это пришло из греческого -ikos через латынь в оба языка сразу, и запомнив мену -yczny на -ический, вы получаете готовый перевод для целого разряда книжных прилагательных." }
  - { kind: usage, text: "Существительное при таком прилагательном кончается на -YKA: ELEKTRYKA, FIZYKA, TECHNIKA, LOGIKA. Пара -yka и -yczny в польском работает как правильное чередование, и со стороны она выглядит как переход k в cz — тот же, что в исконных rok и ROCZNY, ręka и RĘCZNY, mrok и MROCZNY из карточки MROCZNY. Строго говоря, это два греческих суффикса, пришедших готовыми, а не живая мена, но вести себя они стали одинаково, и предсказывать по ним можно смело." }
  - { kind: usage, text: "Форм одиннадцать, степеней сравнения нет: одиннадцатое такое прилагательное в словаре. Слово относит к разряду, а не измеряет качество, и «более электрическим» ничто быть не может. Мужская личная форма множественного ELEKTRYCZNI существует, потому что основа твёрдая, но встречается редко: о людях это прилагательное почти не говорят, и в живой речи она попадается только в оборотах вроде monterzy elektryczni." }
