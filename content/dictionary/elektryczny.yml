etymology: "Через латинское electricus из греческого ELEKTRON «янтарь»: именно натёртый янтарь притягивал соломинки, и от его имени назвали всё явление. Русское «электрический» пришло тем же путём и из того же греческого корня, так что слова совпадают и по происхождению, и по суффиксу — только польский оформил его как -yczny, а русский как -ический."
memory: "Польское -yczny отвечает русскому -ический: elektryczny, fizyczny, techniczny, logiczny. Существительное при нём на -yka: elektryka. Одиннадцать форм, степеней нет."
