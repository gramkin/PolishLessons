notes:
  - { kind: false-friend, text: "РОДИТЕЛЬНЫЙ МНОЖЕСТВЕННОГО СОВПАДАЕТ С НАРЕЧИЕМ «ТАМ». Форма TAM значит и «плотин» (nie ma tu tam), и «там» (jest tam). Различает только синтаксис: после отрицания и счёта это существительное, в остальных случаях наречие. Русскому тут опереться не на что, потому что «там» у нас только наречие." }
  - { kind: usage, text: "Дательный и предложный — TAMIE, с мягким mi: na tamie. Оборот POSTAWIĆ TAMĘ CZEMUŚ значит «поставить заслон чему-то», с дательным, и употребляется чаще в переносном смысле, чем в прямом. Слово женского рода: ta tama, wysoka tama." }
  - { kind: pronunciation, text: "Два слога, ударение на первом: TA-ma. Оба a открытые, ясные: «та́ма». Предложный tamie звучит «та́ме», с мягким ми, и от наречия tam отличается на слух сразу." }
collocations:
  - { pl: "postawić tamę", ru: "поставить заслон" }
  - { pl: "tama na rzece", ru: "плотина на реке" }
  - { pl: "tama pękła", ru: "плотину прорвало" }
family:
  - { pl: "zapora", ru: "плотина, преграда", relation: root }
  - { pl: "rzeka", ru: "река", relation: root, id: rzeka }
  - { pl: "most", ru: "мост", relation: root, id: most }
etymology: "Из немецкого Damm «плотина, насыпь», родственного английскому dam. Русский взял то же германское слово через голландский как «дамбу», поэтому формы разошлись: польский сохранил короткое tama, русский — «дамбу». Со славянским «там» родства нет, сходство случайное."
memory: "tama — «плотина», женского рода, из немецкого Damm, как русская «дамба». Родительный множественного — tam, и он совпадает с наречием «там»: различай по контексту. Оборот postawić tamę czemuś значит «поставить заслон»."
idioms:
  - { pl: "postawić tamę czemuś", ru: "поставить заслон чему-л." }
  - { pl: "tama pękła", ru: "плотину прорвало" }
