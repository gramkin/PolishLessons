# review
id: zabytek
format: 2
lemma: "zabytek"
rank: 5920
pos: noun
pron: { cyr: "забы́тэк" }
senses:
  - id: monument
    ru: "памятник истории, архитектуры; историческая достопримечательность"
    examples:
      - pl: "Podczas podróży po Europie odwiedziliśmy wiele pięknych miast i zabytków."
        ru: "Во время путешествия по Европе мы посетили много красивых городов и памятников старины."
        source: { kind: tatoeba, id: 12453958 }
      - pl: "Wiele osób odwiedza ten zabytek."
        ru: "Многие посещают этот памятник."
        source: { kind: translated, id: 734297 }
      - pl: "Chciałbym jutro zwiedzić najsłynniejsze zabytki Londynu."
        ru: "Я хотел бы завтра осмотреть самые знаменитые достопримечательности Лондона."
        source: { kind: translated, id: 404010 }
      - pl: "Ten stół to bezcenny zabytek."
        ru: "Этот стол — бесценный антиквариат."
        source: { kind: translated, id: 2680411 }
  - id: relic
    ru: "старьё, древность (шутл. об устаревшей вещи)"
    examples:
      - pl: "Jego samochód to zabytek, aż dziw, że jeszcze jeździ."
        ru: "Его машина — древность, удивительно, что ещё ездит."
        source: { kind: authored }
      - pl: "Wyrzuć ten telefon, to już zabytek."
        ru: "Выброси этот телефон, это уже антиквариат."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ZABYTEK не связан с «забытым»: это памятник старины — старинное здание, костёл, замок, предмет, охраняемый как историческая ценность. Памятник-статуя на площади — POMNIK. «Достопримечательности» в путеводителе — чаще всего ZABYTKI." }
  - { kind: usage, text: "Мужской род, неодушевлённый: ZWIEDZAĆ ZABYTEK (винительный = именительный). Беглое E: ZABYTEK → ZABYTKU, ZABYTKI. Творительный ZABYTKIEM — после K пишется I." }
  - { kind: usage, text: "Устойчивые сочетания из официального языка: OCHRONA ZABYTKÓW — охрана памятников, KONSERWATOR ZABYTKÓW — реставратор, служба охраны памятников, REJESTR ZABYTKÓW — реестр памятников." }
collocations:
  - { pl: "zwiedzać zabytki", ru: "осматривать достопримечательности" }
  - { pl: "ochrona zabytków", ru: "охрана памятников" }
  - { pl: "zabytek architektury", ru: "памятник архитектуры" }
  - { pl: "konserwator zabytków", ru: "реставратор, охрана памятников" }
family:
  - { pl: "zabytkowy", ru: "старинный, исторический", relation: derived }
  - { pl: "muzeum", ru: "музей", relation: root, id: muzeum }
  - { pl: "historia", ru: "история", relation: root, id: historia }
  - { pl: "zamek", ru: "замок", relation: root, id: zamek }
synonyms: ["pamiątka przeszłości"]
etymology: "От старопольского глагола ZABYĆ «остаться, сохраниться»: ZABYTEK — то, что осталось от прошлого."
memory: "Zabytek — не «забытое», а памятник старины, который как раз помнят. Zwiedzać zabytki — осматривать достопримечательности."
idioms:
