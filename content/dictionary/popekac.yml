notes:
  - { kind: usage, text: "Совершенный вид к PĘKAĆ «трескаться, лопаться»; однократное — PĘKNĄĆ «треснуть, лопнуть». Приставка PO- значит «по очереди, многие, по всей поверхности»: POPĘKAŁY SZYBY — полопались все стёкла, POPĘKAŁ LÓD — лёд пошёл трещинами. Подлежащее поэтому чаще во множественном числе." }
  - { kind: usage, text: "Глагол непереходный, но причастие POPĘKANY живёт как прилагательное «потрескавшийся»: POPĘKANE RĘCE, POPĘKANY TYNK. Мужско-личной формы POPĘKANI в карточке нет: трескаются вещи, а не люди. Настоящего времени нет: POPĘKA — будущее «потрескается»." }
  - { kind: pronunciation, text: "Ę перед K читается как «эн»: POPĘKAĆ — «попэ́нкаць», POPĘKAŁY — «попэнка́уы». Ударение на предпоследнем слоге." }
  - { kind: register, text: "Формы первого и второго лица живут в разговорных оборотах POPĘKAĆ ZE ŚMIECHU «лопнуть со смеху» и Z ZAZDROŚCI «от зависти»." }
