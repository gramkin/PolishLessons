notes:
  - { kind: false-friend, text: "SCHRONIENIE — «укрытие, приют» как защита. Бомбоубежище — SCHRON, приют для животных — SCHRONISKO, туристический приют в горах — тоже SCHRONISKO. Политическое убежище — AZYL." }
  - { kind: usage, text: "Средний род, отглагольное от SCHRONIĆ SIĘ. Учим единственное: SCHRONIENIE, SCHRONIENIA, SCHRONIENIU, SCHRONIENIEM." }
  - { kind: government, text: "Искать укрытие — SZUKAĆ SCHRONIENIA, родительный. Укрытие от чего — SCHRONIENIE PRZED и творительный. Дать приют — DAĆ SCHRONIENIE, винительный." }
  - { kind: pronunciation, text: "Читается «схроне́не»: SCH — «сх», NIE — «не». Ударение на предпоследнем слоге." }
collocations:
