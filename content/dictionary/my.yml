etymology: "Праславянское *my̑, из праиндоевропейского *mes — то же слово, что русское «мы»."
memory: "Падежи почти русские: nas «нас», nam «нам», nami «нами». Отличие в другом — местоимение при глаголе обычно опускают: Jesteśmy w domu, а не My jesteśmy."
