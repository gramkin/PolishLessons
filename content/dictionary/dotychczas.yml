# review
id: dotychczas
format: 2
lemma: "dotychczas"
rank: 5414
pos: adv
pron: { cyr: "доты́хчас" }
senses:
  - id: so-far
    ru: "до сих пор, до настоящего момента"
    examples:
      - pl: "Dotychczas nie było żadnych problemów."
        ru: "До сих пор никаких проблем не было."
        source: { kind: translated, id: 7891497 }
      - pl: "Dotychczas wykonałeś dobrą robotę."
        ru: "До сих пор ты делал хорошую работу."
        source: { kind: translated, id: 3313669 }
      - pl: "Dotychczas nie mieliśmy z tym żadnych problemów."
        ru: "До сих пор у нас с этим не было никаких проблем."
        source: { kind: translated, id: 3757053 }
  - id: until-now
    ru: "пока что, прежде (в сравнении с «теперь»)"
    examples:
      - pl: "Teraz patrzę na życie inaczej niż dotychczas."
        ru: "Теперь я смотрю на жизнь иначе, чем прежде."
        source: { kind: translated, id: 967027 }
      - pl: "To najlepszy wynik jak dotychczas."
        ru: "Это лучший результат на данный момент."
        source: { kind: translated, id: 728526 }
      - pl: "Dwa tygodnie minęło od jego ucieczki, a dotychczas nikt go nie widział."
        ru: "Прошло две недели с его побега, а до сих пор никто его не видел."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Слово буквально складывается из do + tych + czas «до этих пор». Русское «до сих пор» устроено точно так же." }
  - { kind: usage, text: "jak dotychczas — «пока что, на данный момент»: To najlepszy wynik jak dotychczas." }
  - { kind: usage, text: "Синонимы — dotąd и do tej pory; dotychczas чуть официальнее." }
  - { kind: usage, text: "Часто в отрицании: dotychczas nie… «до сих пор не…»." }
