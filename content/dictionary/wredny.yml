notes:
  - { kind: false-friend, text: "Ловушка в половину слова. Русское «вредный» значит и «вредящий здоровью», и «с дурным характером». Польское WREDNY — только второе: противный, злобный, подлый. Вредный для здоровья по-польски SZKODLIWY: PALENIE JEST SZKODLIWE. Скажете PALENIE JEST WREDNE — выйдет «курение противное», как о капризном человеке." }
  - { kind: usage, text: "Полная парадигма: WREDNY, WREDNIEJSZY, NAJWREDNIEJSZY. Все степени разговорные и вполне живые: NAJWREDNIEJSZY NAUCZYCIEL W SZKOLE. Форма для мужчин-людей во всех трёх: WREDNI, WREDNIEJSI, NAJWREDNIEJSI. Существительное — WREDOTA, «вредина»." }
  - { kind: government, text: "Вредный с кем-то — WREDNY DLA KOGOŚ, DLA с родительным: BYŁ DLA NIEJ WREDNY. Реже — WOBEC KOGOŚ. Русское «вредный к кому» с дательным здесь не работает." }
  - { kind: pronunciation, text: "Читается «врэ́дны», два слога, ударение на первом. W перед R звонкое «в», RE — твёрдое «рэ», D перед N звонкое. В WREDNIEJSZY: «врэдне́йшы»." }
  - { kind: register, text: "Разговорное, эмоциональное слово, в официальной речи неуместно. Среди друзей WREDNY бывает почти ласковым: TY WREDNA MAŁPO!, «ах ты вредина!». О погоде и обстоятельствах — просто «мерзкий»." }
