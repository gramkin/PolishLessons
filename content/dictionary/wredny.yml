etymology: "Польское WREDNY заимствовано из русского или украинского «вредный», скорее всего в девятнадцатом веке, и попало в разговорную речь. Само «вред» — общеславянское *vredъ, «рана, повреждение»; по-польски от него старое WRZÓD, «нарыв, язва». В польском слово потеряло значение «наносящий ущерб» и оставило себе только скверный характер."
memory: "Wredny — вредный характером, противный: wredna baba, wredny szef. А вредный для здоровья — szkodliwy! Wredniejszy, najwredniejszy. Читается «врэ́дны»."
idioms:
  - { pl: "wredna małpa", ru: "вредина, зараза (о женщине, разг.)" }
