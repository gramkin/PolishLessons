# review
id: okej
format: 2
lemma: "okej"
rank: 742
pos: adj
pron: { cyr: "о́кей" }
senses:
  - id: agree
    ru: "окей, ладно (согласие в начале реплики)"
    examples:
      - pl: "Okej, wygrałeś."
        ru: "Окей, ты выиграл."
        source: { kind: tatoeba, id: 12470248 }
      - pl: "Okej."
        ru: "Окей."
        source: { kind: translated, id: 12211763 }
      - pl: "Okej, daj mi prowadzić."
        ru: "Ладно, дай мне повести."
        source: { kind: translated, id: 10471614 }
  - id: fine
    ru: "być okej — быть в порядке (в роли сказуемого)"
    note: "Слово не склоняется и не согласуется."
    examples:
      - pl: "Między nami wszystko okej?"
        ru: "Между нами всё нормально?"
        source: { kind: translated, id: 4328056 }
      - pl: "Wyglądam okej?"
        ru: "Я нормально выгляжу?"
        source: { kind: translated, id: 5968902 }
      - pl: "Wszystko jest okej."
        ru: "Всё в порядке."
        source: { kind: authored }
  - id: permission
    ru: "czy to okej…? — ничего, если…?"
    examples:
      - pl: "Czy to okej, jeśli przyjdę później?"
        ru: "Ничего, если я приду позже?"
        source: { kind: authored }
      - pl: "Okej, zrobię to."
        ru: "Ладно, я это сделаю."
        source: { kind: authored }
      - pl: "Okej, umowa stoi."
        ru: "Окей, договорились."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Слово не склоняется вовсе: одна форма okej на все случаи, без рода, числа и падежа." }
  - { kind: usage, text: "Работает двояко: как междометие в начале реплики (Okej, zrobię to «Ладно, я сделаю») и как сказуемое (Wszystko okej «Всё в порядке», Wyglądam okej? «Я нормально выгляжу?»)." }
  - { kind: register, text: "Разговорное слово. В официальном письме лучше dobrze, w porządku или zgoda." }
  - { kind: usage, text: "Записывают по-разному: okej, OK, ok. Форма okej — это полонизированная запись английского OK по произношению." }
collocations:
  - { pl: "wszystko okej", ru: "всё в порядке" }
  - { pl: "czy to okej?", ru: "ничего, если?" }
  - { pl: "okej, zgoda", ru: "окей, договорились" }
family:
  - { pl: "dobrze", ru: "хорошо", relation: root }
  - { pl: "w porządku", ru: "в порядке", relation: root }
  - { pl: "zgoda", ru: "согласие", relation: root }
etymology: "Английское OK, записанное по польскому произношению — okej. Русское «окей» — то же заимствование, только кириллицей."
memory: "okej — это английское OK, записанное по-польски. Слово не склоняется вовсе и работает двояко: как «ладно» в начале реплики (Okej, zrobię to) и как «в порядке» в роли сказуемого (Wszystko okej? Wyglądam okej?). В официальной речи вместо него лучше dobrze или w porządku."
idioms:
