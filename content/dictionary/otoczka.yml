# review
id: otoczka
format: 2
lemma: "otoczka"
rank: 5754
pos: noun
pron: { cyr: "ото́чка" }
senses:
  - id: membrane
    ru: "оболочка (биол., анат.)"
    examples:
      - pl: "Otoczka mielinowa chroni włókno nerwowe."
        ru: "Миелиновая оболочка защищает нервное волокно."
        source: { kind: authored }
      - pl: "Komórki mają własne otoczki."
        ru: "У клеток есть собственные оболочки."
        source: { kind: authored }
  - id: coating
    ru: "оболочка, покрытие"
    examples:
      - pl: "Wokół tabletki jest cienka otoczka."
        ru: "Вокруг таблетки тонкая оболочка."
        source: { kind: authored }
      - pl: "Nasiono pokryte jest twardą otoczką."
        ru: "Семя покрыто твёрдой оболочкой."
        source: { kind: authored }
  - id: aura
    ru: "перен. ореол, налёт"
    examples:
      - pl: "Narosła wokół niego otoczka legendy."
        ru: "Вокруг него наросла оболочка легенды."
        source: { kind: authored }
      - pl: "Nadali tej historii otoczkę sensacji."
        ru: "Этой истории придали налёт сенсации."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Существительное женского рода, склоняется как любое слово на -ka: otoczka, otoczki, otoczce, otoczkę, otoczką. В дательном и предложном падеже k переходит в c: w otoczce, dzięki otoczce." }
  - { kind: usage, text: "Звательная форма otoczko у неодушевлённого существительного возможна только в поэтическом обращении (апострофе): «Otoczko tajemnicy, kiedy pękniesz?». В обычной речи она не употребляется." }
  - { kind: false-friend, text: "Русское «оболочка» построено по той же логике, что польское otoczka: оба слова называют то, что обволакивает или окружает предмет. Но корни разные — польское слово идёт от otoczyć «окружить», а не от «волочь», так что внешнего сходства между ними нет." }
collocations:
  - { pl: "otoczka mielinowa", ru: "миелиновая оболочка" }
  - { pl: "otoczka tajemnicy", ru: "ореол тайны" }
family:
  - { pl: "otoczyć", ru: "окружить", relation: root }
  - { pl: "otoczenie", ru: "окружение, среда", relation: derived }
etymology: "Образовано от глагола otoczyć «окружить» — буквально «то, что окружает». Корень toczyć «катить, точить» родствен русскому «точить»; приставка o- даёт значение «вокруг», как в «обточить». Из того же гнезда otoczenie «окружение, среда»."
memory: "otoczka — то, что окружает: от otoczyć «окружить». Русское «оболочка» устроено по той же мысли, только от другого корня. В дательном и предложном otoczce, с чередованием k → c."
idioms:
  - { pl: "otoczka tajemnicy", ru: "ореол тайны" }
  - { pl: "otoczka sławy", ru: "ореол славы" }
