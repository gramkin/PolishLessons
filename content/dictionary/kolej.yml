  - { pl: "kolejowy", ru: "железнодорожный", relation: derived }
etymology: "От koło «колесо, круг» — буквально «то, что чередуется, идёт по кругу». Отсюда сразу и «очередь», и «железная дорога». Русская «колея» — родственное слово с третьим значением."
memory: "kolej — женского рода и значит две вещи сразу: «железная дорога» и «очередь». Twoja kolej «твоя очередь», po kolei «по очереди». Очередь как строй людей — kolejka, а русская «колея» — koleina."
