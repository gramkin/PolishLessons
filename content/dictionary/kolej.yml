  - id: in-turn
    ru: "po kolei — по очереди, по порядку"
    examples:
      - pl: "Śpiewali po kolei na scenie."
        ru: "Они пели на сцене по очереди."
        source: { kind: translated, id: 352487 }
      - pl: "Spotkam się z wszystkimi po kolei."
        ru: "Я встречусь со всеми по очереди."
        source: { kind: translated, id: 361074 }
  - id: railway
    ru: "железная дорога"
    examples:
      - pl: "Kolej łączy oba miasta."
        ru: "Железная дорога соединяет оба города."
        source: { kind: authored }
      - pl: "Pracuje na kolei."
        ru: "Он работает на железной дороге."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Женский род на согласный: ta kolej, tej kolei. Родительный и предложный совпадают — kolei." }
  - { kind: false-friend, text: "Два значения сразу: «железная дорога» и «очередь». А русская «колея» — это другое слово, koleina." }
  - { kind: usage, text: "Twoja kolej «твоя очередь», po kolei «по очереди, по порядку». Очередь как строй людей — это kolejka." }
  - { kind: usage, text: "koleje losu значит «превратности судьбы» — буквально «чередования судьбы»." }
collocations:
  - { pl: "po kolei", ru: "по очереди" }
  - { pl: "twoja kolej", ru: "твоя очередь" }
  - { pl: "kolej żelazna", ru: "железная дорога" }
  - { pl: "koleje losu", ru: "превратности судьбы" }
family:
  - { pl: "kolejny", ru: "очередной, следующий", relation: derived, id: kolejny }
  - { pl: "kolejka", ru: "очередь; узкоколейка", relation: derived }
  - { pl: "kolejowy", ru: "железнодорожный", relation: derived }
etymology: "От koło «колесо, круг» — буквально «то, что чередуется, идёт по кругу». Отсюда сразу и «очередь», и «железная дорога». Русская «колея» — родственное слово с третьим значением."
memory: "kolej — женского рода и значит две вещи сразу: «железная дорога» и «очередь». Twoja kolej «твоя очередь», po kolei «по очереди». Очередь как строй людей — kolejka, а русская «колея» — koleina."
idioms:
