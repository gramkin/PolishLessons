        ru: "Он работает на железной дороге."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Женский род на согласный: ta kolej, tej kolei. Родительный и предложный совпадают — kolei." }
  - { kind: false-friend, text: "Два значения сразу: «железная дорога» и «очередь». А русская «колея» — это другое слово, koleina." }
  - { kind: usage, text: "Twoja kolej «твоя очередь», po kolei «по очереди, по порядку». Очередь как строй людей — это kolejka." }
  - { kind: usage, text: "koleje losu значит «превратности судьбы» — буквально «чередования судьбы»." }
collocations:
