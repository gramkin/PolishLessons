# review
id: kierowca
format: 2
lemma: "kierowca"
rank: 1422
pos: noun
pron: { cyr: "керо́фца" }
senses:
  - id: driver
    ru: "водитель, шофёр"
    examples:
      - pl: "Jestem kierowcą Toma."
        ru: "Я водитель Тома."
        source: { kind: tatoeba, id: 6155106 }
      - pl: "Kierowca przyspieszył."
        ru: "Водитель прибавил скорость."
        source: { kind: translated, id: 11111496 }
      - pl: "Tom to odpowiedzialny kierowca."
        ru: "Том — ответственный водитель."
        source: { kind: translated, id: 982768 }
  - id: professional
    ru: "водитель по профессии"
    examples:
      - pl: "Jestem kierowcą ciężarówki."
        ru: "Я водитель грузовика."
        source: { kind: tatoeba, id: 8506818 }
      - pl: "Został kierowcą taksówki."
        ru: "Он стал водителем такси."
        source: { kind: translated, id: 9686178 }
notes:
  - { kind: usage, text: "Мужской род, но склоняется по женскому образцу на -a: kierowca, kierowcy, kierowcę, kierowcą. Так же ведут себя mężczyzna, kolega, poeta." }
  - { kind: false-friend, text: "kierowca — «водитель», а kierownik — «руководитель, начальник». Оба от kierować «править, управлять», но путать их нельзя: kierownik sklepu «заведующий магазином»." }
  - { kind: government, text: "В именной части сказуемого нужен творительный: Jestem kierowcą «Я водитель», Został kierowcą taksówki «Он стал водителем такси»." }
  - { kind: usage, text: "Слово не меняется по полу: Ona jest dobrym kierowcą «Она хороший водитель». Формы kierowczyni в обиходе нет." }
collocations:
  - { pl: "kierowca autobusu", ru: "водитель автобуса" }
  - { pl: "kierowca ciężarówki", ru: "водитель грузовика" }
  - { pl: "prawo jazdy", ru: "водительские права" }
etymology: "От kierować «править, управлять»; суффикс -ca образует имя деятеля, как в sprzedawca «продавец» и wykonawca «исполнитель»."
memory: "kierowca — «водитель». Слово мужского рода, а склоняется по-женски: kierowcy, kierowcę, kierowcą — как kolega и mężczyzna. Главное — не путать с kierownik «начальник». И запомните творительный после być: Jestem kierowcą."
idioms:
  - { pl: "niedzielny kierowca", ru: "воскресный водитель, неумеха за рулём" }
  - { pl: "kierowca ciężarówki", ru: "водитель грузовика" }
  - { pl: "kierowca autobusu", ru: "водитель автобуса" }
