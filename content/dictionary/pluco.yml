  - id: lungs
    ru: "płuca — лёгкие (парный орган)"
    examples:
      - pl: "Zapalenie płuc trwało trzy tygodnie."
        ru: "Воспаление лёгких длилось три недели."
        source: { kind: authored }
      - pl: "Nabrał powietrza w płuca."
        ru: "Он набрал воздуха в лёгкие."
        source: { kind: authored }
      - pl: "Krzyknął na całe płuca."
        ru: "Он крикнул во всю грудь."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ДВА ЯЗЫКА НАЗВАЛИ ЭТОТ ОРГАН ПО ОДНОЙ И ТОЙ ЖЕ ПРИЧИНЕ, НО РАЗНЫМИ СЛОВАМИ. Польское płuco восходит к корню со значением «плыть, держаться на воде»: лёгкие не тонут. Русский заметил ровно то же самое, но назвал орган «лёгким» — потому что он лёгкий. Наблюдение одно, слова разные, и опереться на звучание не выйдет. Зато обороты совпадают: zapalenie płuc это «воспаление лёгких», а na całe płuca — «во всю грудь»." }
  - { kind: usage, text: "В единственном числе płuco говорят, когда речь об одном из двух: lewe płuco, prawe płuco. Во всех прочих случаях слово стоит во множественном — płuca, как и русские «лёгкие». Родительный множественного — голая основа płuc, без окончания: zapalenie płuc, rak płuc." }
  - { kind: pronunciation, text: "ł звучит как короткое у и сливается со следующим u, поэтому слово звучит «пу́цо», в два слога, с ударением на первом. Во множественном числе так же: płuca — «пу́ца»." }
collocations:
  - { pl: "zapalenie płuc", ru: "воспаление лёгких" }
  - { pl: "na całe płuca", ru: "во всю грудь, во весь голос" }
  - { pl: "lewe płuco", ru: "левое лёгкое" }
family:
  - { pl: "płucny", ru: "лёгочный", relation: derived }
  - { pl: "płukać", ru: "полоскать", relation: root }
etymology: "Из праславянского корня со значением «плыть, держаться на воде»: лёгкие, брошенные в воду, не тонут, и древние это знали. Русский пришёл к тому же наблюдению с другой стороны и назвал орган «лёгким» — лёгкое, потому что не тяжёлое. Отсюда польское płucny «лёгочный» и płucoserce в медицинской терминологии."
memory: "płuco — «лёгкое», и родства с русским словом нет: поляки назвали орган от «плыть» (лёгкие не тонут), а русские — от «лёгкий» (не тяжёлые). Наблюдение одно, слова разные. Зато обороты совпадают: zapalenie płuc и na całe płuca."
idioms:
  - { pl: "na całe płuca", ru: "во всю грудь, во весь голос" }
  - { pl: "zapalenie płuc", ru: "воспаление лёгких" }
