notes:
  - { kind: government, text: "Женский род: ta trawa, tej trawy. Лежать на траве — leżeć NA trawie, предложный падеж." }
  - { kind: false-friend, text: "Прямая родня русской «траве», корень тот же. Но глагол trawić значит «переваривать», а не «травить» — вот это ловушка." }
  - { kind: usage, text: "Разговорное trawa значит «травка» в смысле марихуаны: nie palę trawy." }
  - { kind: usage, text: "Оборот mowa-trawa — «пустая болтовня», буквально «речь-трава». Пословица Sąsiad ma zawsze zieloną trawę «У соседа трава всегда зеленее»." }
collocations:
  - { pl: "leżeć na trawie", ru: "лежать на траве" }
  - { pl: "kosić trawę", ru: "косить траву" }
  - { pl: "mowa-trawa", ru: "пустая болтовня" }
etymology: "Праславянское *trava; русская «трава» — то же слово."
memory: "trawa — «трава», прямая родня русскому слову. Но trawić значит «переваривать», а не «травить». Разговорно trawa — ещё и «травка»."
idioms:
  - { pl: "mowa-trawa", ru: "пустая болтовня" }
  - { pl: "kosić trawę", ru: "косить траву" }
formExamplesSkip:
  - { form: "trawo", reason: "звательная форма, а trawa — это трава. Обращаться к ней некому, поэтому форма остаётся только в таблице склонения" }
