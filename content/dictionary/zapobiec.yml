notes:
  - { kind: government, text: "Самое важное в этом глаголе — падеж, и он расходится с русским полностью. ZAPOBIEC требует дательного: ZAPOBIEC WYPADKOWI, ZAPOBIEC CHOROBIE, ZAPOBIEC KATASTROFIE. Русский же говорит «предотвратить аварию», винительным. Поэтому фразу нельзя переводить слово в слово: надо помнить, что по-польски предотвращают чему-то, а не что-то. Та же модель у несовершенного ZAPOBIEGAĆ CZEMUŚ. Прямого дополнения в винительном у этого глагола не бывает вовсе, и страдательного причастия поэтому тоже нет." }
  - { kind: usage, text: "Сорок три формы, и лишняя против обычных сорока двух объясняется не ошибкой, а настоящим раздвоением: у глагола два инфинитива, ZAPOBIEC и ZAPOBIEGNĄĆ, и оба литературны. Первый употребительнее, второй звучит чуть книжнее, но встречается и в словарях, и в печати. Личные формы будущего времени строятся от второй основы: ZAPOBIEGNĘ, ZAPOBIEGNIESZ, ZAPOBIEGNIE. Деепричастие — ZAPOBIEGŁSZY, с сочетанием ŁSZ, которое образуется у основ на согласный. Отглагольное существительное ZAPOBIEGNIĘCIE редкое; для профилактики в ходу ZAPOBIEGANIE." }
  - { kind: false-friend, text: "Корень здесь тот же, что в BIEC «бежать», и образ прозрачен: приставки ZA- и PO- вместе дают «забежать вперёд», то есть опередить беду. Русский пришёл к той же мысли в глаголе «предупредить», где «пред-» тоже указывает на опережение. Прилагательное ZAPOBIEGLIWY значит «предусмотрительный, запасливый» и к бегу уже никак не отсылает. Осторожнее с существительным ZAPOBIEGANIE: оно значит «профилактика», а не «бег», и в медицинских текстах встречается на каждой странице." }
  - { kind: pronunciation, text: "Читается «запо́бец», три слога, ударение на предпоследнем. Сочетание IE даёт мягкое «е», поэтому слышно «бе», а не «бие». Конечное C здесь без хвостика и читается как твёрдое «ц» — именно этим первый инфинитив отличается от второго: ZAPOBIEC звучит «запо́бец», а ZAPOBIEGNĄĆ с мягким Ć на конце — «запобегно́нчь». Разница слышна отчётливо, и путать две основы не стоит." }
  - { kind: register, text: "Слово книжное и официальное, частое в медицине, технике и юридических текстах: ZAPOBIEC CHOROBIE, ZAPOBIEC POŻAROWI, ZAPOBIEC STRATOM. Существительное ZAPOBIEGANIE означает профилактику: ZAPOBIEGANIE CHOROBOM, ZAPOBIEGANIE PRZESTĘPCZOŚCI. В разговорной речи вместо него скажут проще: NIE DOPUŚCIĆ DO CZEGOŚ «не допустить чего-то». Прилагательное ZAPOBIEGLIWY хвалит хозяйственность: ZAPOBIEGLIWA GOSPODYNI «запасливая хозяйка»." }
