etymology: "Две приставки, ZA- и PO-, плюс BIEC, от праславянского *běgti «бежать». Образ в основе прозрачный: забежать вперёд, опередить, встать на пути у беды раньше, чем она случится. Русский сохранил корень полностью — «бежать», «бег», «беглец», «побег», — но для этой мысли построил другое слово, «предупредить», где опережение выражено приставкой «пред-». Получается, что два языка пришли к одному понятию одинаковым способом, через идею опережения, но из разного материала: польский из бега, русский из предшествования. От того же корня идут ZBIEC «сбежать», WYBIEG «выгул, уловка» и BIEGŁY «сведущий, эксперт»."
memory: "Корень тот же, что в biec «бежать», и смысл буквально «забежать вперёд беды»; русский пришёл к той же мысли через «пред-» в «предупредить». Главное и трудное — падеж: zapobiec czemuś, дательный, тогда как русский говорит «предотвратить что-то», винительным. Прямого дополнения у глагола не бывает, поэтому нет и страдательного причастия. И помнить, что у него два инфинитива: zapobiec и zapobiegnąć, оба правильные."
