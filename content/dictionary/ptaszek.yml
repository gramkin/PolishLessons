notes:
  - { kind: false-friend, text: "PTASZEK — «птичка», уменьшительное от PTAK. Но и «галочка» в анкете: POSTAWIĆ PTASZKA. Ласково о ребёнке — MÓJ PTASZKU, «моя птичка». Ранняя пташка — RANNY PTASZEK." }
