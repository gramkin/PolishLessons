notes:
  - { kind: false-friend, text: "PRZYRZĄDZAĆ — «готовить (блюдо, напиток)», а не «наряжать» и не «приряжать». Родственное PRZYRZĄD значит «прибор, инструмент»: PRZYRZĄD POMIAROWY «измерительный прибор»." }
  - { kind: usage, text: "Несовершенный вид; совершенный — PRZYRZĄDZIĆ. Спряжение на -AM: PRZYRZĄDZAM, PRZYRZĄDZASZ, PRZYRZĄDZAJĄ. GOTOWAĆ — «готовить, варить» вообще, PRZYRZĄDZAĆ — приготовить конкретное блюдо по рецепту; слово чуть книжнее, его любят кулинарные книги и меню. Мужско-личное страдательное PRZYRZĄDZANI в карточку не включено: готовят блюда, а не людей." }
  - { kind: government, text: "Что — винительный: PRZYRZĄDZAĆ RYBĘ. Для кого — дательный: PRZYRZĄDZAĆ DZIECIOM OBIAD. Из чего — Z + родительный: Z WARZYW. Как — NA + винительный: NA PARZE «на пару», NA OSTRO «по-острому»." }
  - { kind: pronunciation, text: "Читается «пшыжо́ндзаць»: PRZ — «пш», RZĄ — «жон», DZ — одно звонкое «дз». Ударение на предпоследнем слоге." }
collocations:
  - { pl: "przyrządzać posiłki", ru: "готовить еду" }
  - { pl: "przyrządzać rybę na parze", ru: "готовить рыбу на пару" }
  - { pl: "przyrządzać drinki", ru: "смешивать коктейли" }
family:
  - { pl: "przyrządzić", ru: "приготовить", relation: aspect }
  - { pl: "przyrząd", ru: "прибор, инструмент", relation: root }
  - { pl: "przyrządzanie", ru: "приготовление", relation: derived }
  - { pl: "rząd", ru: "ряд; правительство", relation: root }
etymology: "Приставка PRZY- плюс корень RZĄD «ряд, порядок» — тот же, что в русских «ряд», «наряд», «снаряжать». Первоначальный смысл — «приводить в порядок, снаряжать»."
memory: "Przyrządzać — приготовить «по ряду», по порядку рецепта: przyrządzam rybę na parze."
idioms:
  - { pl: "przyrządzać coś na ostro", ru: "готовить что-то по-острому" }
formExamplesSkip:
  - { form: "przyrządzani", reason: "мужско-личная форма страдательного причастия: готовят блюда и напитки, а не людей" }
