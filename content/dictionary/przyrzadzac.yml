        ru: "Шеф-повар готовит рыбу на пару."
        source: { kind: authored }
  - id: mix
    ru: "смешивать, составлять (напиток, лекарство, мазь)"
    examples:
      - pl: "Barman przyrządzał drinki z wielką wprawą."
        ru: "Бармен смешивал коктейли с большим мастерством."
