pron: { cyr: "пшыжо́ндзаць" }
senses:
  - id: cook
    ru: "готовить, приготавливать (блюдо)"
    examples:
      - pl: "Moja matka świetnie przyrządzała ziemniaki."
        ru: "Моя мама замечательно готовила картошку."
