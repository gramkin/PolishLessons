# review
id: mozliwosc
format: 2
lemma: "możliwość"
rank: 918
pos: noun
pron: { cyr: "можли́восьць" }
senses:
  - id: possibility
    ru: "возможность, вероятность"
    examples:
      - pl: "Jest możliwość, że Tom się spóźni."
        ru: "Есть вероятность, что Том опоздает."
        source: { kind: tatoeba, id: 1059706 }
      - pl: "Miałem możliwość pojechać za granicę."
        ru: "У меня была возможность поехать за границу."
        source: { kind: tatoeba, id: 362912 }
      - pl: "Jest taka możliwość."
        ru: "Такая возможность есть."
        source: { kind: translated, id: 11488195 }
  - id: capacity
    ru: "możliwości — возможности, силы, способности"
    note: "Во множественном числе слово значит «силы, способности»."
    examples:
      - pl: "Chętnie ci pomogę, w miarę możliwości."
        ru: "С удовольствием тебе помогу, в меру моих сил."
        source: { kind: tatoeba, id: 720297 }
      - pl: "Zrozumienie tej książki przekracza moje możliwości."
        ru: "Понять эту книгу свыше моих сил."
        source: { kind: tatoeba, id: 766208 }
      - pl: "To człowiek o niemałych możliwościach."
        ru: "Это человек немалых возможностей."
        source: { kind: translated, id: 368100 }
  - id: no-way
    ru: "nie ma możliwości — не может быть, никак"
    examples:
      - pl: "Nie ma możliwości, by o tym wiedziała."
        ru: "Не может быть, чтобы она об этом знала."
        source: { kind: tatoeba, id: 359310 }
      - pl: "Nie ma możliwości, żeby zdążył."
        ru: "Он никак не мог успеть."
        source: { kind: authored }
      - pl: "Dostałem możliwość wyboru."
        ru: "Мне дали возможность выбора."
        source: { kind: authored }
notes:
  - { kind: usage, text: "w miarę możliwości — «по мере возможности, по силам»; nie ma możliwości, by… — «не может быть, чтобы…»." }
  - { kind: usage, text: "Во множественном числе możliwości значит «возможности, силы»: przekracza moje możliwości «это выше моих сил»." }
  - { kind: usage, text: "Прилагательное — możliwy «возможный», наречие można «можно». Последнее особенно частое: Czy można? «Можно?»." }
  - { kind: pronunciation, text: "Сочетание -ść на конце читается мягко: «можливошьць». Ударение на предпоследнем слоге." }
collocations:
  - { pl: "w miarę możliwości", ru: "по мере возможности" }
  - { pl: "nie ma możliwości", ru: "никак, исключено" }
  - { pl: "dać możliwość", ru: "дать возможность" }
  - { pl: "moje możliwości", ru: "мои возможности" }
family:
  - { pl: "możliwy", ru: "возможный", relation: root, id: mozliwy }
  - { pl: "można", ru: "можно", relation: derived }
  - { pl: "móc", ru: "мочь", relation: root }
etymology: "От możliwy «возможный», от móc «мочь». Русское «возможность» собрано от того же глагола, так что слова соответствуют друг другу буквально."
memory: "możliwość — «возможность», от móc «мочь», как и в русском. Во множественном числе значит «силы, способности»: przekracza moje możliwości «это выше моих сил». Запомните w miarę możliwości «по мере возможности» и nie ma możliwości, by… «не может быть, чтобы…»."
idioms:
  - { pl: "w miarę możliwości", ru: "по мере возможности" }
  - { pl: "nie ma możliwości", ru: "никак, исключено" }
  - { pl: "dać możliwość", ru: "дать возможность" }
