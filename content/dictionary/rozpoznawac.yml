etymology: "Из двух приставок, ROZ- и PO-, на корне *znati «знать», том же, что русское «знать». Русское «распознавать» собрано точно так же, из «раз-», «по-» и «знавать», и это один из немногих случаев, когда сложное приставочное слово совпадает в двух языках целиком, деталь за деталью. Приставка ROZ- означает здесь разделение: распознать — значит отделить одно от другого и назвать. Из того же корня польский построил широкое гнездо: ZNAĆ «знать», POZNAĆ «познакомиться», UZNAĆ «признать», PRZYZNAĆ «признать, присвоить», WYZNAĆ «исповедать, признаться», ZNANY «известный», ZNAJOMY «знакомый». Медицинское значение «диагноз» у существительного ROZPOZNANIE — калька латинского DIAGNOSIS, буквально «различение», и польский перевёл этот смысл своим корнем, тогда как русский оставил греческое слово."
memory: "Собирается из знакомых частей буквально: roz- = «раз-», po- = «по-», znać = «знать», отсюда rozpoznawać = «распознавать». Полное совпадение сборки — редкость, стоит запомнить. Два расхождения: существительное rozpoznanie значит ещё и «диагноз» (postawić rozpoznanie), а в суде rozpoznawać sprawę значит «рассматривать дело». И не путать с poznać: poznać kogoś это «познакомиться», rozpoznać kogoś — «узнать знакомого». Звук: roz- перед глухим даёт «рос», и о не редуцируется — «роспозна́ваць»."
idioms:
