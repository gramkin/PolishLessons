notes:
  - { kind: false-friend, text: "Слово собирается из знакомых частей: приставка ROZ- отвечает русскому «раз-», корень ZNAĆ — русскому «знать», и ROZPOZNAWAĆ строится как «распознавать», с той же двойной приставкой ROZ- плюс PO-. Такое полное совпадение в польском редкость, и его стоит отметить. Расхождение одно, зато важное: существительное ROZPOZNANIE значит и «распознавание», и — в медицине — «диагноз». POSTAWIĆ ROZPOZNANIE значит «поставить диагноз», а слово DIAGNOZA в польском тоже есть, но в истории болезни чаще стоит ROZPOZNANIE. Русский развёл эти два понятия по разным словам, польский оставил одно." }
  - { kind: usage, text: "Несовершенный вид, переходный, шестьдесят три формы: сорок две от глагола, десять от действительного причастия ROZPOZNAJĄCY, одиннадцать от страдательного ROZPOZNAWANY. Совершенная пара — ROZPOZNAĆ, и в ней нет вставного -WA-: ROZPOZNAWAM против ROZPOZNAM. Это та же модель, что DAWAĆ и DAĆ, POZNAWAĆ и POZNAĆ. Рядом живёт простое POZNAWAĆ «знакомиться, узнавать впервые», и разница практическая: POZNAĆ KOGOŚ значит «познакомиться с кем-то», а ROZPOZNAĆ KOGOŚ — «узнать того, кого уже знал». Путать их нельзя: POZNAŁEM GO WCZORAJ это «я с ним вчера познакомился»." }
  - { kind: government, text: "Переходный: узнавать кого или что — винительный без предлога, ROZPOZNAWAĆ GŁOS, PISMO, SPRAWCĘ. По чему — предлог PO с местным: ROZPOZNAWAĆ PO GŁOSIE, PO CHODZIE, PO PISMIE, и русское управление то же, «узнавать по голосу». Отрицание требует родительного: NIE ROZPOZNAJĘ TEGO PISMA. В юридическом языке глагол имеет особое значение «рассматривать дело»: SĄD ROZPOZNAJE SPRAWĘ, и здесь по-русски нужно именно «рассматривать», а не «распознавать». В медицине — ROZPOZNAWAĆ CHOROBĘ U KOGOŚ, с предлогом U и родительным." }
  - { kind: pronunciation, text: "Читается «роспозна́ваць», пять слогов, ударение на предпоследнем. Приставка ROZ- перед глухим P оглушается и звучит «рос»: не «розпознавать». Буква O в обоих первых слогах это «о», без редукции, которая обязательна в русском: по-польски слышно «рос-поз-», а не «рас-паз-». Это общее правило: польские гласные не ослабляются вне ударения. Конечное Ć — мягкое «ць». В совершенном виде ROZPOZNAĆ четыре слога, ударение на предпоследнем: «роспозна́ць»." }
