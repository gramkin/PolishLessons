# review
id: przerazac
format: 2
lemma: "przerażać"
rank: 1466
pos: verb
aspect: imperf
pron: { cyr: "пшэжа́жаць" }
senses:
  - id: frighten
    ru: "пугать, ужасать"
    examples:
      - pl: "To mnie przeraża."
        ru: "Это меня пугает."
        source: { kind: translated, id: 12058176 }
      - pl: "Przerażasz mnie."
        ru: "Ты меня пугаешь."
        source: { kind: translated, id: 1541606 }
      - pl: "Pająki mnie przerażają."
        ru: "Пауки меня пугают."
        source: { kind: translated, id: 10467928 }
  - id: frightening
    ru: "przerażający — пугающий, страшный"
    examples:
      - pl: "To przerażające."
        ru: "Это страшно."
        source: { kind: translated, id: 7710685 }
      - pl: "Zmiana jest przerażająca."
        ru: "Перемены пугают."
        source: { kind: translated, id: 4735397 }
notes:
  - { kind: usage, text: "Несовершенный вид к przerazić. В речи чаще самого глагола встречается причастие: przerażający «страшный», To przerażające «Это страшно»." }
  - { kind: government, text: "przerażać kogo, винительный: To mnie przeraża «Это меня пугает»." }
  - { kind: usage, text: "Гнездо слова: przerażenie «ужас», przerażony «в ужасе», straszny «страшный»." }
  - { kind: false-friend, text: "Различайте przerażać «пугать кого-то» и bać się «бояться самому». Русские «пугать» и «пугаться» разводятся так же." }
collocations:
  - { pl: "to przerażające", ru: "это страшно" }
  - { pl: "przerażający widok", ru: "пугающее зрелище" }
  - { pl: "przerażać kogoś", ru: "пугать кого-либо" }
etymology: "Приставка prze- и razić «поражать, бить» (праславянское *raziti). Русское «поражать» того же корня, а «ужасать» собрано иначе."
memory: "przerażać — «пугать, ужасать»: To mnie przeraża «Это меня пугает». Но в речи чаще попадается причастие: przerażający «страшный», To przerażające «Это страшно»."
idioms:
  - { pl: "to przerażające", ru: "это страшно" }
  - { pl: "przerażający widok", ru: "пугающее зрелище" }
  - { pl: "przerażać kogoś", ru: "пугать кого-либо" }
