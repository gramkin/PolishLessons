notes:
  - { kind: false-friend, text: "РУССКИЙ КОГНАТ ЕСТЬ, НО ЗНАЧИТ СОВСЕМ ДРУГОЕ. Pobyt собран из po- и byt, от być «быть», и значит «пребывание»: pobyt w szpitalu. Русское «быт» от того же корня, но значит повседневную жизнь, уклад, а по-польски это życie codzienne. И польское BYT само по себе значит «бытие, существование», а не «быт»." }
  - { kind: usage, text: "Два оборота из жизни иностранца в Польше стоит знать наизусть. KARTA POBYTU — вид на жительство, документ. POZWOLENIE NA POBYT — разрешение на проживание, и предлог там na с винительным. Предложный падеж — w POBYCIE, с переходом t→ci, как в przedmiot → przedmiocie." }
  - { kind: pronunciation, text: "Два слога, ударение на первом: PO-byt. Y читается как русское ы, конечное t глухое: «по́быт». Форма pobycie звучит «побы́це», с мягким ц." }
collocations:
  - { pl: "karta pobytu", ru: "вид на жительство" }
  - { pl: "pobyt czasowy", ru: "временное пребывание" }
  - { pl: "podczas pobytu", ru: "во время пребывания" }
family:
  - { pl: "być", ru: "быть", relation: root, id: byc }
  - { pl: "byt", ru: "бытие, существование", relation: root }
  - { pl: "wyjazd", ru: "отъезд", relation: antonym, id: wyjazd }
etymology: "Приставка po- и byt, отглагольное от być «быть», из праславянского *byti — того же корня, что русское «быть» и «быт». Русский закрепил «быт» за повседневным уклитом, а польский оставил byt при философском «бытии», отдав пребывание слову pobyt."
memory: "pobyt — «пребывание», от być «быть». Не путай с русским «бытом»: уклад жизни по-польски życie codzienne, а byt значит «бытие». Запомни karta pobytu — вид на жительство."
idioms:
  - { pl: "karta pobytu", ru: "вид на жительство" }
  - { pl: "miejsce stałego pobytu", ru: "место постоянного проживания" }
