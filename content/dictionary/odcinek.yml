# review
id: odcinek
format: 2
lemma: "odcinek"
rank: 1497
pos: noun
pron: { cyr: "отчи́нэк" }
senses:
  - id: episode
    ru: "серия, выпуск"
    examples:
      - pl: "Widziałem tylko pierwszy odcinek."
        ru: "Я видел только первую серию."
        source: { kind: tatoeba, id: 3233975 }
      - pl: "Nowy odcinek był świetny."
        ru: "Новая серия была отличная."
        source: { kind: translated, id: 10470373 }
      - pl: "Który odcinek z sezonu drugiego jest twoim ulubionym?"
        ru: "Какая серия второго сезона твоя любимая?"
        source: { kind: translated, id: 4169803 }
  - id: segment
    ru: "отрезок, участок"
    examples:
      - pl: "Ten odcinek autostrady ma zostać rozszerzony do trzech pasów."
        ru: "Этот участок автострады должен быть расширен до трёх полос."
        source: { kind: translated, id: 10987351 }
      - pl: "Na tym odcinku drogi są roboty."
        ru: "На этом участке дороги ремонт."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Беглое e: odcinek, но odcinka, odcinki, odcinkiem. Так же ведут себя dzwonek и warunek." }
  - { kind: usage, text: "Главное современное значение — «серия» сериала: nowy odcinek «новая серия»." }
  - { kind: usage, text: "Второе — «отрезок, участок»: odcinek drogi «участок дороги»; в геометрии это «отрезок»." }
  - { kind: usage, text: "От odciąć «отрезать»: буквально «отрезанный кусок». Русский «отрезок» собран точно так же." }
collocations:
  - { pl: "nowy odcinek", ru: "новая серия" }
  - { pl: "odcinek drogi", ru: "участок дороги" }
  - { pl: "ostatni odcinek", ru: "последняя серия" }
etymology: "От odciąć «отрезать» (od- плюс ciąć «резать»). Русский «отрезок» собран из тех же частей, и геометрическое значение у обоих совпадает."
memory: "odcinek — «серия» сериала и «отрезок, участок». Собрано как русское «отрезок»: od- плюс ciąć «резать». Беглое e: odcinek, но odcinka."
idioms:
  - { pl: "nowy odcinek", ru: "новая серия" }
  - { pl: "odcinek drogi", ru: "участок дороги" }
  - { pl: "ostatni odcinek", ru: "последняя серия" }
