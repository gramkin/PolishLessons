        ru: "Лагерь окружала колючая проволока."
        source: { kind: authored }
  - id: needle
    ru: "спица для вязания (мн.: DRUTY)"
    examples:
      - pl: "Babcia robi na drutach."
        ru: "Бабушка вяжет на спицах."
        source: { kind: authored }
      - pl: "Kupiłam nowe druty i włóczkę."
        ru: "Я купила новые спицы и пряжу."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "DRUT — «проволока», а не «прут». Прут — PRĘT. Провод, кабель — PRZEWÓD, KABEL. DRUTY — ещё и «спицы»: ROBIĆ NA DRUTACH — «вязать на спицах»." }
  - { kind: usage, text: "Мужской род, неодушевлённое. Родительный — DRUTU; форма DRUTA — разговорная, её не учим. В местном T переходит в C: NA DRUCIE." }
  - { kind: government, text: "Из проволоки — Z DRUTU, родительный. Вязать на спицах — ROBIĆ NA DRUTACH, местный. Колючая проволока — DRUT KOLCZASTY." }
  - { kind: pronunciation, text: "Читается «друт», один слог. В DRUCIE — «дру́це»: CI — мягкое «ць»." }
collocations:
  - { pl: "drut kolczasty", ru: "колючая проволока" }
  - { pl: "robić na drutach", ru: "вязать на спицах" }
  - { pl: "kawałek drutu", ru: "кусок проволоки" }
