  - { pl: "przewód", ru: "провод", relation: root, id: przewod }
etymology: "Из немецкого DRAHT «проволока», от DREHEN «крутить»: проволоку тянули и скручивали."
memory: "Drut — проволока, а не прут. Drut kolczasty — колючая проволока. Robić na drutach — вязать на спицах. Читается «друт»."
