senses:
  - id: hideous
    ru: "отвратительный, мерзкий, уродливый"
    examples:
      - pl: "To ohydny budynek z betonu."
        ru: "Это уродливое здание из бетона."
        source: { kind: authored }
      - pl: "W kuchni był ohydny zapach."
        ru: "На кухне стоял мерзкий запах."
        source: { kind: authored }
      - pl: "To najohydniejszy obraz w muzeum."
        ru: "Это самая уродливая картина в музее."
        source: { kind: authored }
  - id: heinous
    ru: "гнусный, омерзительный (о поступке)"
    examples:
      - pl: "To ohydna zbrodnia."
        ru: "Это гнусное преступление."
        source: { kind: authored }
      - pl: "Jego zachowanie było ohydne."
        ru: "Его поведение было омерзительным."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Русскому OHYDNY ничего не подсказывает: «охидный» в русском нет. Это «отвратительный, мерзкий», и о виде, и о вкусе, и о поступке. Синонимы: OBRZYDLIWY, «противный», чуть мягче, и WSTRĘTNY, «гадкий». OHYDA — «мерзость», о чём-то уродливом: TA RZEŹBA TO OHYDA." }
  - { kind: usage, text: "Полная парадигма: OHYDNY, OHYDNIEJSZY, NAJOHYDNIEJSZY. Все степени живые в эмоциональной речи. Мужское-личное: OHYDNI, OHYDNIEJSI, NAJOHYDNIEJSI — о мерзких людях." }
  - { kind: government, text: "Отвратительный для кого-то — OHYDNY DLA KOGOŚ, DLA с родительным. На вкус — OHYDNY W SMAKU, W с местным. Наречие OHYDNIE — «отвратительно»: OHYDNIE WYGLĄDA, OHYDNIE PACHNIE." }
  - { kind: pronunciation, text: "Читается «охы́дны», три слога, ударение на предпоследнем. H — как «х», HY — «хы». В OHYDNIEJSZY: «охыдне́йшы»." }
  - { kind: register, text: "Сильное, эмоциональное слово из разговорной речи и критики. О еде, архитектуре, моде — разговорно и резко. О преступлении — книжно и с осуждением." }
collocations:
  - { pl: "ohydny zapach", ru: "мерзкий запах" }
  - { pl: "ohydna zbrodnia", ru: "гнусное преступление" }
  - { pl: "ohydny w smaku", ru: "мерзкий на вкус" }
family:
  - { pl: "ohyda", ru: "мерзость, уродство", relation: root }
  - { pl: "obrzydliwy", ru: "противный, отвратительный", relation: root, id: obrzydliwy }
  - { pl: "wstrętny", ru: "гадкий", relation: root, id: wstretny }
etymology: "Из чешского ohyzdný, «уродливый», от ohyzda, «уродство», вероятно, через старопольское. Происхождение чешского корня спорно. В польском слово упростилось до OHYDNY и стало сильнее «некрасивого»: это уже «омерзительный»."
memory: "Ohydny — мерзкий, уродливый: ohydny zapach, ohydny budynek, ohydna zbrodnia. Ohyda — мерзость. Ohydniejszy, najohydniejszy. Читается «охы́дны»."
idioms:
  - { pl: "ohydny w smaku", ru: "мерзкий на вкус" }
