# review
id: katastrofa
format: 2
lemma: "katastrofa"
rank: 1858
pos: noun
pron: { cyr: "катастро́фа" }
senses:
  - id: disaster
    ru: "катастрофа, крушение"
    examples:
      - pl: "To była katastrofa."
        ru: "Это была катастрофа."
        source: { kind: translated, id: 8772574 }
      - pl: "Według wiadomości telewizyjnych, w Indiach miała miejsce katastrofa samolotu."
        ru: "По телевизионным новостям, в Индии произошла авиакатастрофа."
        source: { kind: translated, id: 1351194 }
      - pl: "Wypadek zamienił się w katastrofę."
        ru: "Авария превратилась в катастрофу."
        source: { kind: translated, id: 944235 }
  - id: in-disaster
    ru: "катастрофа (погибнуть, пережить)"
    examples:
      - pl: "W katastrofie lotniczej zginęło 200 osób."
        ru: "В авиакатастрофе погибло 200 человек."
        source: { kind: translated, id: 758397 }
      - pl: "W katastrofie zginęli wszyscy pasażerowie."
        ru: "В катастрофе погибли все пассажиры."
        source: { kind: translated, id: 364626 }
      - pl: "Płakała z radości, kiedy usłyszała, że jej syn przeżył katastrofę samolotu."
        ru: "Она заплакала от радости, когда услышала, что ее сын выжил в авиакатастрофе."
        source: { kind: tatoeba, id: 350027 }
notes:
  - { kind: government, text: "Погибнуть в катастрофе — zginąć w katastrofie (предложный падеж); пережить катастрофу — przeżyć katastrofę (винительный)." }
  - { kind: usage, text: "katastrofa lotnicza — «авиакатастрофа», самое частое сочетание в корпусе; katastrofa naturalna — «стихийное бедствие»." }
  - { kind: usage, text: "Разговорно слово значит просто «кошмар, ужас»: twoje całe życie to kompletna katastrofa." }
  - { kind: false-friend, text: "Слово то же, что русское «катастрофа», из греческого; значения совпадают полностью." }
collocations:
  - { pl: "katastrofa lotnicza", ru: "авиакатастрофа" }
  - { pl: "zginąć w katastrofie", ru: "погибнуть в катастрофе" }
  - { pl: "przeżyć katastrofę", ru: "пережить катастрофу" }
family:
  - { pl: "katastrofalny", ru: "катастрофический", relation: root }
  - { pl: "wypadek", ru: "авария, случай", relation: root, id: wypadek }
etymology: "Из греческого katastrophē «переворот, развязка» через западные языки; русское «катастрофа» пришло тем же путём."
memory: "katastrofa — «катастрофа»: katastrofa lotnicza «авиакатастрофа», zginąć w katastrofie. Разговорно значит просто «кошмар»."
