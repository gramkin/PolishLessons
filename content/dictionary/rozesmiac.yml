# review
id: rozesmiac
format: 2
lemma: "roześmiać"
rank: 5474
pos: verb
aspect: perf
pron: { cyr: "розэ́сьмяць" }
senses:
  - id: burst-laughing
    ru: "рассмеяться (roześmiać się)"
    examples:
      - pl: "Tom roześmiał się."
        ru: "Том рассмеялся."
        source: { kind: translated, id: 5629841 }
      - pl: "Studenci roześmiali się."
        ru: "Студенты рассмеялись."
        source: { kind: translated, id: 10597990 }
      - pl: "Nie mogłem się nie roześmiać po jej żarcie."
        ru: "Я не мог не рассмеяться после её шутки."
        source: { kind: translated, id: 416495 }
  - id: make-laugh
    ru: "рассмешить (кого-л.)"
    examples:
      - pl: "Sprawiłam, że nawet Tom się roześmiał."
        ru: "Я добилась того, что даже Том рассмеялся."
        source: { kind: translated, id: 7893837 }
      - pl: "Miałem ochotę roześmiać się, ale nie odważyłem się."
        ru: "Мне хотелось рассмеяться, но я не решился."
        source: { kind: translated, id: 3656290 }
notes:
  - { kind: usage, text: "Почти всегда с się: roześmiać się «рассмеяться». Без się глагол в живой речи не встречается." }
  - { kind: government, text: "Непереходный в возвратной форме. Чтобы сказать «рассмешить кого-то», берут другой глагол — rozśmieszyć." }
  - { kind: false-friend, text: "Корень śmiać się «смеяться» — ср. русское «смеяться», «смех». Приставка roz- та же, что в русском «рас-»." }
  - { kind: usage, text: "Причастие roześmiany значит «смеющийся, весёлый»: roześmiana twarz «смеющееся лицо»." }
  - { kind: usage, text: "Отглагольного существительного у глагола нет: roześmianie в текстах не встречается, вместо него говорят śmiech или wybuch śmiechu. А вот roześmiany — обычное прилагательное: roześmiana twarz, roześmiani ludzie." }
collocations:
  - { pl: "roześmiać się głośno", ru: "громко рассмеяться" }
  - { pl: "roześmiana twarz", ru: "смеющееся лицо" }
etymology: "roz- + śmiać się «смеяться», праславянское *smьjati; ср. русское «смеяться», «рассмеяться»."
memory: "roześmiać się — «рассмеяться», почти всегда с się. Корень śmiać się = русское «смеяться», приставка roz- = «рас-». Причастие roześmiany «смеющийся»."
idioms:
  - { pl: "roześmiać się głośno", ru: "громко рассмеяться" }
formExamplesSkip:
