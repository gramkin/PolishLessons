pron: { cyr: "леню́шэк" }
senses:
  - id: lazybones
    ru: "лентяйчик, ленивец (ласково)"
    examples:
      - pl: "Wstawaj, leniuszku!"
        ru: "Вставай, лентяйчик!"
        source: { kind: authored }
      - pl: "Mój kot to leniuszek."
        ru: "Мой кот — лентяйчик."
        source: { kind: authored }
      - pl: "Z ciebie taki leniuszek."
        ru: "Ну и лентяйчик же ты."
        source: { kind: authored }
  - id: sleepyhead
    ru: "сонюшка, лежебока (шутливо)"
    examples:
      - pl: "Leniuszek spał do południa."
        ru: "Лежебока спал до полудня."
        source: { kind: authored }
      - pl: "Nasz leniuszek znowu nie wstał."
        ru: "Наш лежебока опять не встал."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Двойное уменьшительное: leń «лентяй» даёт leniuch, а тот — leniuszek. Каждая ступень мягче предыдущей." }
  - { kind: false-friend, text: "Слово ласковое, а не бранное: так говорят ребёнку или коту. Настоящий упрёк — leń." }
  - { kind: government, text: "Мужской; звательная форма leniuszku используется как обращение." }
  - { kind: usage, text: "В корпусе слово не встречается, поэтому все примеры составлены вручную." }
collocations:
  - { pl: "mały leniuszek", ru: "маленький лентяйчик" }
etymology: "Двойное уменьшительное от leń «лентяй» через leniuch; ср. русское «лень», «ленивый»."
memory: "leniuszek — ласковое «лентяйчик». Ступени такие: leń «лентяй» → leniuch → leniuszek, и каждая мягче предыдущей."
idioms:
  - { pl: "mały leniuszek", ru: "маленький лентяйчик" }
