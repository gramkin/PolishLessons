# review
id: poczta
format: 2
lemma: "poczta"
rank: 1931
pos: noun
pron: { cyr: "по́чта" }
senses:
  - id: post-office
    ru: "почта (учреждение, здание)"
    examples:
      - pl: "To poczta, a to bank."
        ru: "Это почта, а то - банк."
        source: { kind: tatoeba, id: 353936 }
      - pl: "Przepraszam, gdzie jest poczta?"
        ru: "Извините, где почта?"
        source: { kind: translated, id: 930153 }
      - pl: "Pracuję na poczcie."
        ru: "Я работаю на почте."
        source: { kind: translated, id: 8630130 }
  - id: mail
    ru: "почта (корреспонденция); почтой"
    examples:
      - pl: "Masz pocztę."
        ru: "Тебе письмо."
        source: { kind: translated, id: 10602671 }
      - pl: "Czy wyślesz to pocztą?"
        ru: "Ты пошлёшь это почтой?"
        source: { kind: tatoeba, id: 356343 }
      - pl: "Wysyłam książkę pocztą."
        ru: "Я отправляю книгу почтой."
        source: { kind: translated, id: 766154 }
notes:
  - { kind: government, text: "На почте — na poczcie (предложный падеж), на почту — na pocztę (винительный): idę na pocztę «я иду на почту»." }
  - { kind: usage, text: "Чем — pocztą, творительный падеж: wysłać pocztą «отправить почтой», pocztą lotniczą «авиапочтой»." }
  - { kind: usage, text: "poczta elektroniczna — «электронная почта»; в разговоре чаще говорят mejl или mail." }
  - { kind: usage, text: "poczta pantoflowa — «сарафанное радио», буквально «тапочная почта»." }
collocations:
  - { pl: "na poczcie", ru: "на почте" }
  - { pl: "wysłać pocztą", ru: "отправить почтой" }
  - { pl: "poczta elektroniczna", ru: "электронная почта" }
family:
  - { pl: "pocztowy", ru: "почтовый", relation: root }
  - { pl: "pocztówka", ru: "открытка", relation: root }
  - { pl: "list", ru: "письмо", relation: root, id: list }
etymology: "Из итальянского posta через немецкий — тем же путём, что русское «почта». Слова совпадают полностью."
memory: "poczta — и учреждение, и корреспонденция: idę na pocztę «иду на почту», wysłać pocztą «отправить почтой». Электронная — poczta elektroniczna."
idioms:
  - { pl: "poczta elektroniczna", ru: "электронная почта" }
  - { pl: "poczta pantoflowa", ru: "сарафанное радио" }
  - { pl: "wysłać pocztą", ru: "отправить почтой" }
