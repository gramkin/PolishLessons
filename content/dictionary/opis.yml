notes:
  - { kind: false-friend, text: "OPIS — «описание», а не «опись». Опись имущества — SPIS или INWENTARZ. Должностная инструкция — OPIS STANOWISKA." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Родительный — OPISU, местный — W OPISIE. Глагол — OPISAĆ, «описать»." }
  - { kind: government, text: "Описание чего — родительный: OPIS SYTUACJI. Соответствует описанию — JEST ZGODNY Z OPISEM, творительный. В описании — W OPISIE." }
  - { kind: pronunciation, text: "Читается «о́пис», ударение на первом слоге. SIE в местном падеже — «се»: W OPISIE, «во пи́се»." }
collocations:
  - { pl: "krótki opis", ru: "краткое описание" }
  - { pl: "zgodnie z opisem", ru: "согласно описанию" }
  - { pl: "opis produktu", ru: "описание товара" }
family:
  - { pl: "opisać", ru: "описать", relation: root, id: opisac }
  - { pl: "opisywać", ru: "описывать", relation: root }
  - { pl: "pisać", ru: "писать", relation: root, id: pisac }
etymology: "От OPISAĆ «описать», а то — от PISAĆ «писать». Русское «описание» — тот же корень, но польский обошёлся без суффикса."
memory: "Opis — описание, а не «опись» (spis). Читается «о́пис». Zgodny z opisem — соответствует описанию. Nie do opisania — неописуемо."
idioms:
  - { pl: "nie do opisania", ru: "не передать словами, неописуемо" }
