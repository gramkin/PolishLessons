# review
id: szybki
format: 2
lemma: "szybki"
rank: 465
pos: adj
pron: { cyr: "шы́пки" }
senses:
  - id: fast
    ru: "быстрый"
    note: "Степени: szybki — szybszy — najszybszy."
    examples:
      - pl: "On jest bardzo szybki."
        ru: "Он очень быстрый."
        source: { kind: tatoeba, id: 770006 }
      - pl: "Moja kotka jest bardzo szybka."
        ru: "Моя кошка очень быстрая."
        source: { kind: translated, id: 1583707 }
      - pl: "Szybkie przybycie policji zaskoczyło nas."
        ru: "Быстрый приезд полиции был для нас сюрпризом."
        source: { kind: tatoeba, id: 1003433 }
  - id: faster
    ru: "szybszy — быстрее (сравнительная)"
    note: "Сравнение: szybszy ode mnie или szybszy niż ja — оба живые."
    examples:
      - pl: "Tom jest szybszy ode mnie."
        ru: "Том быстрее меня."
        source: { kind: translated, id: 6602759 }
      - pl: "Tomás jest szybszy, niż myślisz."
        ru: "Томаш быстрее, чем ты думаешь."
        source: { kind: translated, id: 10740907 }
      - pl: "Odrzutowce są znacznie szybsze od samolotów śmigłowych."
        ru: "Реактивные самолёты значительно быстрее винтовых."
        source: { kind: translated, id: 732881 }
  - id: fastest
    ru: "najszybszy — самый быстрый"
    note: "najszybszy sposób «самый быстрый способ»."
    examples:
      - pl: "To jest najszybszy pociąg świata."
        ru: "Это самый быстрый поезд в мире."
        source: { kind: translated, id: 1865325 }
      - pl: "Latanie to najszybszy sposób podróżowania."
        ru: "Полёт — самый быстрый способ путешествовать."
        source: { kind: translated, id: 3367823 }
      - pl: "To jest najszybsza trasa."
        ru: "Это самый быстрый маршрут."
        source: { kind: translated, id: 12247468 }
notes:
  - { kind: usage, text: "Степени правильные: szybki — szybszy — najszybszy. Мужское личное во множественном: szybcy, szybsi, najszybsi." }
  - { kind: government, text: "Сравнение строится двумя способами: szybszy ode mnie (od с родительным) и szybszy niż ja — оба живые, как русские «быстрее меня» и «быстрее, чем я»." }
  - { kind: usage, text: "Наречие идёт своим рядом: szybko «быстро», szybciej «быстрее», najszybciej «быстрее всего»." }
  - { kind: usage, text: "Частые сочетания: szybka odpowiedź «быстрый ответ», szybka jazda «быстрая езда», szybkie danie «блюдо быстрого приготовления»." }
collocations:
  - { pl: "szybka odpowiedź", ru: "быстрый ответ" }
  - { pl: "najszybszy sposób", ru: "самый быстрый способ" }
  - { pl: "szybciej niż", ru: "быстрее чем" }
  - { pl: "szybka jazda", ru: "быстрая езда" }
family:
