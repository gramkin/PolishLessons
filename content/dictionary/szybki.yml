  - { pl: "szybkość", ru: "скорость", relation: derived }
  - { pl: "przyspieszyć", ru: "ускорить", relation: derived }
etymology: "От праславянского *šybъkъ «быстрый, стремительный» — родственно русскому областному «шибкий» в значении «быстрый»."
memory: "szybki — «быстрый», степени правильные: szybki — szybszy — najszybszy, а мужское личное множественное — szybcy, szybsi, najszybsi. Сравнение строится двумя способами: szybszy ode mnie с od и родительным, либо szybszy niż ja — оба живые, ровно как русские «быстрее меня» и «быстрее, чем я». Наречие идёт своим рядом: szybko, szybciej, najszybciej."
idioms:
