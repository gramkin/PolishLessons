etymology: "От MIEJSCE, из праславянского *město «место». Любопытно, что от этого же слова польский произвёл и MIASTO «город»: средневековые переводчики передали немецкое Stadt, у которого было оба значения, вторым из них. Русское «место» сохранило исходный смысл в одиночку, а польский получил пару, где одно слово держит место, а другое — город."
memory: "Корень тот же, что в miejsce «место». Но MIASTO — это «город», а не «место»: jadę do miasta значит «еду в город»."
