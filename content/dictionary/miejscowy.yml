notes:
  - { kind: false-friend, text: "Корень этого прилагательного — MIEJSCE «место», и вот здесь кроется одна из самых дорогих ошибок. Польское MIASTO означает «город», а вовсе не «место», хотя оба слова выросли из праславянского *město. Польский развёл их: miejsce осталось местом, а miasto ушло в город, калькой с немецкого Stadt. Русский глаз читает «miasto» как «место» и спотыкается в самом обычном предложении: jadę do miasta — это «еду в город»." }
  - { kind: usage, text: "Форм одиннадцать, степеней сравнения нет: предмет либо здешний, либо нет, более местным он не бывает. Это тот же разряд, что fizyczny, и противоположность słoneczny с его тридцатью тремя формами. Мужская личная форма при этом работает как существительное: MIEJSCOWI значит «местные жители», ровно как у нас." }
