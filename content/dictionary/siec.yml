# review
id: siec
format: 2
lemma: "sieć"
rank: 1473
pos: noun
pron: { cyr: "сець" }
senses:
  - id: net
    ru: "сеть (рыболовная), паутина"
    examples:
      - pl: "Zarzucił sieci."
        ru: "Он забросил сети."
        source: { kind: translated, id: 766135 }
      - pl: "Ptaki mają gniazda, pająki mają sieci, a ludzie mają przyjaźń."
        ru: "У птиц есть гнёзда, у пауков — сети, а у людей — дружба."
        source: { kind: tatoeba, id: 6305530 }
      - pl: "Pająki tkają sieci."
        ru: "Пауки ткут паутину."
        source: { kind: translated, id: 8760742 }
  - id: network
    ru: "сеть (компьютерная, торговая, транспортная); интернет"
    examples:
      - pl: "Nie mogłam się połączyć z siecią."
        ru: "Я не смогла подключиться к сети."
        source: { kind: translated, id: 12229091 }
      - pl: "Ostatnio sieć dziwnie się zachowuje."
        ru: "В последнее время сеть ведёт себя странно."
        source: { kind: translated, id: 6308412 }
      - pl: "Zazwyczaj nie kupuję rzeczy w sieci."
        ru: "Обычно я не покупаю вещи в сети."
        source: { kind: translated, id: 4725218 }
notes:
  - { kind: usage, text: "Женский род на мягкий -ć: sieć, sieci, siecią. Родительный, дательный и предложный совпадают — sieci." }
  - { kind: usage, text: "Одно слово покрывает всё: сеть рыболовная, паучья, компьютерная и торговая. w sieci значит «в интернете»: kupować w sieci." }
  - { kind: usage, text: "Ходовые сочетания: sieć handlowa «торговая сеть», sieć komórkowa «сотовая сеть», sieć kolejowa «железнодорожная сеть»." }
  - { kind: usage, text: "Для паутины есть и отдельное слово pajęczyna, но sieć в этом значении тоже обычна: Pająki tkają sieci." }
collocations:
  - { pl: "w sieci", ru: "в интернете" }
  - { pl: "sieć handlowa", ru: "торговая сеть" }
  - { pl: "zarzucić sieci", ru: "забросить сети" }
etymology: "Праславянское *sětь — то же самое слово, что русская «сеть». Совпадение полное, включая новое значение «интернет»."
memory: "sieć — «сеть» во всех смыслах сразу: рыболовная, паучья, компьютерная, торговая. Женский род на мягкий согласный: w sieci «в сети, в интернете». Русское слово то же самое."
idioms:
  - { pl: "w sieci", ru: "в интернете" }
  - { pl: "sieć handlowa", ru: "торговая сеть" }
  - { pl: "wpaść w sieci", ru: "попасть в сети" }
