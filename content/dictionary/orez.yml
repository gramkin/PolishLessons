lemma: "oręż"
rank: 2351
pos: noun
pron: { cyr: "о́рэнш" }
senses:
  - id: weapon
    ru: "оружие (книжное, высокое)"
    examples:
      - pl: "Dobra pamięć to jego oręż."
        ru: "Хорошая память — его оружие."
        source: { kind: translated, id: 982358 }
      - pl: "Oręż spoczywał na ścianie."
        ru: "Оружие покоилось на стене."
        source: { kind: authored }
      - pl: "Chwycili za oręż."
        ru: "Они взялись за оружие."
        source: { kind: authored }
  - id: means
    ru: "орудие, средство (переносно)"
    examples:
      - pl: "Słowo bywa groźnym orężem."
        ru: "Слово бывает грозным оружием."
        source: { kind: authored }
      - pl: "Prawda to jego jedyny oręż."
        ru: "Правда — его единственное оружие."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Слово высокое и книжное. Обычное «оружие» — broń, которое уже есть в словаре; oręż встретится в поэзии, истории и публицистике." }
  - { kind: government, text: "Мужской неодушевлённый; родительный — oręża. Взяться за оружие — chwycić za oręż, винительный после za." }
  - { kind: false-friend, text: "Родственно русскому «оружие» и «оружейник» — тот же праславянский корень, только в польском он остался книжным, а в русском стал обиходным." }
  - { kind: usage, text: "Переносно — о любом средстве борьбы: oręż propagandy «оружие пропаганды»." }
collocations:
  - { pl: "chwycić za oręż", ru: "взяться за оружие" }
  - { pl: "potężny oręż", ru: "могучее оружие" }
etymology: "Праславянский корень, общий с русским «оружие»; в польском слово осталось книжным."
memory: "oręż — высокое «оружие»; в обычной речи скажут broń. Родня русскому «оружие», но стилистически выше."
