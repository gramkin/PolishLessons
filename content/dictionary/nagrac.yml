# review
id: nagrac
format: 2
lemma: "nagrać"
rank: 1656
pos: verb
aspect: perf
pron: { cyr: "на́граць" }
senses:
  - id: record
    ru: "записать (звук, видео)"
    examples:
      - pl: "Nagraj to."
        ru: "Запиши это."
        source: { kind: translated, id: 10596335 }
      - pl: "Nagrałem mecz rugby."
        ru: "Я записал матч по регби."
        source: { kind: translated, id: 840280 }
      - pl: "Nagrałeś tamten koncert?"
        ru: "Ты записал тот концерт?"
        source: { kind: translated, id: 4516586 }
  - id: recording
    ru: "запись (nagranie)"
    examples:
      - pl: "To nagranie jest nudne."
        ru: "Эта запись скучная."
        source: { kind: translated, id: 753807 }
      - pl: "Proszę posłuchać nagrania."
        ru: "Послушайте, пожалуйста, запись."
        source: { kind: translated, id: 2427650 }
      - pl: "Wyślę Ci nagranie z moim głosem."
        ru: "Я пришлю тебе запись с моим голосом."
        source: { kind: translated, id: 3496387 }
notes:
  - { kind: government, text: "Требует винительного падежа: nagrać koncert «записать концерт», nagrać wiadomość «записать сообщение»." }
  - { kind: usage, text: "Несовершенный вид — nagrywać. Существительное nagranie значит «запись» и встречается в корпусе чаще самого глагола." }
  - { kind: usage, text: "Причастие nagrany — «записанный»: wywiad był nagrany na wideo «интервью было записано на видео»." }
  - { kind: usage, text: "Образовано от grać «играть» с приставкой na-: исходно «наиграть», записать сыгранное." }
collocations:
  - { pl: "nagrać wiadomość", ru: "записать сообщение" }
  - { pl: "nagranie wideo", ru: "видеозапись" }
  - { pl: "posłuchać nagrania", ru: "послушать запись" }
etymology: "Приставка na- + grać «играть», праславянское *grati. Русское «записать» построено от «писать» — метафора другая, но польское слово прозрачно: «наиграть» на носитель."
memory: "nagrać = «записать» (звук, видео), винительный падеж. Несовершенный вид — nagrywać, а существительное nagranie «запись» встречается даже чаще глагола."
idioms:
  - { pl: "nagrać wiadomość", ru: "записать сообщение" }
  - { pl: "nagranie wideo", ru: "видеозапись" }
  - { pl: "posłuchać nagrania", ru: "послушать запись" }
