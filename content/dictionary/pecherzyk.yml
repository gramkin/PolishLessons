notes:
  - { kind: government, text: "Мужской неодушевлённый: pęcherzyk, pęcherzyka, pęcherzyku. Уменьшительное от pęcherz «пузырь, волдырь»." }
  - { kind: usage, text: "Медицинские термины: pęcherzyk żółciowy «жёлчный пузырь», pęcherzyki płucne «альвеолы», pęcherzyk jajnikowy «яичниковый фолликул»." }
  - { kind: usage, text: "В быту — о пузырьках газа: pęcherzyki w wodzie mineralnej." }
  - { kind: false-friend, text: "Русское «пузырёк» в смысле «флакон» по-польски будет fiolka или buteleczka, но не pęcherzyk." }
collocations:
  - { pl: "pęcherzyk żółciowy", ru: "жёлчный пузырь" }
  - { pl: "pęcherzyk powietrza", ru: "пузырёк воздуха" }
  - { pl: "pęcherzyki płucne", ru: "альвеолы" }
family:
  - { pl: "pęcherz", ru: "пузырь, волдырь", relation: root }
  - { pl: "pęcherzowy", ru: "пузырный", relation: derived }
etymology: "Уменьшительное от pęcherz «пузырь, волдырь» с суффиксом -yk; от того же корня прилагательное pęcherzowy. Польское слово покрывает и пузырьки газа, и анатомические мешочки — от жёлчного пузыря до лёгочных альвеол."
memory: "pęcherzyk — уменьшительное от pęcherz: и пузырёк газа, и анатомический мешочек. Pęcherzyk żółciowy это «жёлчный пузырь», а pęcherzyki płucne — «альвеолы»."
