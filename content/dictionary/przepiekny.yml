  - { pl: "piękno", ru: "красота", relation: derived, id: piekno }
etymology: "От PIĘKNY «красивый» с усилительной приставкой PRZE-. У PIĘKNY нет прямого русского соответствия: это западнославянское слово, ему родственно чешское pěkný. Приставка PRZE- соответствует русскому «пре-» в «прекрасный»."
memory: "Przepiękny — прекрасный, очень красивый: przepiękny widok, przepiękna sukienka. Prze- усиливает, как русское пре- в «прекрасный». Читается «пшэпе́нкны»."
idioms:
  - { pl: "przepiękna sprawa", ru: "чудесное дело, прекрасная вещь" }
