notes:
  - { kind: false-friend, text: "PRZEPIĘKNY — не «перекрасивый» в смысле «слишком», а «очень красивый». Польская приставка PRZE- при прилагательных усиливает, как русское «пре-» в «прекрасный», «премилый»: PRZEPIĘKNY, PRZEMIŁY, PRZEŚLICZNY. Не путайте с PRZE- при глаголах, где оно значит «пере-»: PRZEJŚĆ — «перейти»." }
  - { kind: usage, text: "Степеней сравнения нет: это уже превосходная степень по смыслу, и NAJPRZEPIĘKNIEJSZY звучит как ошибка. Все одиннадцать форм живые. Форма для мужчин-людей PRZEPIĘKNI встречается редко, но возможна: BYLI PRZEPIĘKNI W TYCH STROJACH, «они были прекрасны в этих нарядах»." }
  - { kind: government, text: "Обычно стоит перед существительным: PRZEPIĘKNY WIDOK, PRZEPIĘKNA KOBIETA. Может быть и сказуемым: WIDOK JEST PRZEPIĘKNY. Падежных требований нет. Наречие PRZEPIĘKNIE, «прекрасно»." }
  - { kind: pronunciation, text: "Читается «пшэпе́нкны», три слога, ударение на предпоследнем. PRZE даёт «пшэ»: RZ после глухого P оглушается. Ę перед K звучит «эн», и выходит «пе́нк», как в PIĘKNY «пе́нкны»." }
  - { kind: register, text: "Эмоциональное, восторженное слово, частое в разговоре, особенно у женщин и в отзывах: PRZEPIĘKNE ZDJĘCIE!, PRZEPIĘKNA SUKIENKA! В официальном тексте его заменят на WSPANIAŁY или просто PIĘKNY." }
collocations:
