# review
id: wyprowadzic
format: 2
lemma: "wyprowadzić"
rank: 2048
pos: verb
pron: { cyr: "выпрова́дзиць" }
senses:
  - id: lead-out
    ru: "вывести (кого-л. откуда-л.)"
    examples:
      - pl: "Wyprowadził psa przed szóstą."
        ru: "Он вывел собаку до шести."
        source: { kind: authored }
      - pl: "Strażacy wyprowadzili wszystkich z budynku."
        ru: "Пожарные вывели всех из здания."
        source: { kind: authored }
      - pl: "Wyprowadzono konie ze stajni."
        ru: "Лошадей вывели из конюшни."
        source: { kind: authored }
  - id: move-out
    ru: "wyprowadzić się — съехать, выехать (из жилья)"
    examples:
      - pl: "Wyprowadzili się w zeszłym miesiącu."
        ru: "Они съехали в прошлом месяце."
        source: { kind: authored }
      - pl: "Wyprowadzę się, gdy znajdę coś tańszego."
        ru: "Я съеду, когда найду что-нибудь дешевле."
        source: { kind: authored }
  - id: derive
    ru: "вывести (заключение, формулу)"
    examples:
      - pl: "Wyprowadził z tego ciekawy wniosek."
        ru: "Он вывел из этого любопытный вывод."
        source: { kind: authored }
      - pl: "Wyprowadzony wzór okazał się błędny."
        ru: "Выведенная формула оказалась ошибочной."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ТРИ ГЛАГОЛА ОДНОГО КОРНЯ, И РУССКИЙ РАЗВОДИТ ИХ ИНАЧЕ. Wprowadzić się — «въехать» (в квартиру), wyprowadzić się — «СЪЕХАТЬ», przeprowadzić się — «ПЕРЕЕХАТЬ». Все три от prowadzić «вести», и запоминать их стоит вместе: приставка указывает направление, как в русских «въехать — съехать — переехать», только корень другой." }
  - { kind: government, text: "Выводят КОГО ОТКУДА — винительный плюс z с РОДИТЕЛЬНЫМ: wyprowadzić psa z domu, ludzi z budynku. Совпадает с русским «вывести из». Возвратное wyprowadzić się идёт с z (wyprowadzić się z mieszkania) или do (wyprowadzić się do innego miasta)." }
  - { kind: usage, text: "Вид совершенный, несовершенная пара — wyprowadzać. Страдательное причастие по правилу для -ić: wyprowadzony, wyprowadzeni, как zaprowadzony. Третье значение, «вывести формулу или вывод», в науке и в споре звучит совершенно обычно." }
  - { kind: register, text: "Два оборота нужны постоянно. Wyprowadzić kogoś z równowagi — «вывести кого-то из равновесия», слово в слово как по-русски. А wyprowadzić kogoś w pole значит «обвести вокруг пальца, одурачить» — образ другой, смысл тот же." }
collocations:
  - { pl: "wyprowadzić psa", ru: "вывести собаку" }
  - { pl: "wyprowadzić się z mieszkania", ru: "съехать с квартиры" }
  - { pl: "wyprowadzić z równowagi", ru: "вывести из равновесия" }
family:
  - { pl: "prowadzić", ru: "вести", relation: root, id: prowadzic }
  - { pl: "zaprowadzić", ru: "отвести; навести", relation: derived, id: zaprowadzic }
  - { pl: "wyprowadzać", ru: "выводить", relation: aspect }
etymology: "Приставка wy- «вы-» плюс prowadzić «вести», от корня *vod-, того же, что в русских «водить» и «вести». Сложение буквально повторяет русское «вы-вести». Отсюда wyprowadzka «переезд, выезд» и весь ряд направлений: wprowadzić, wyprowadzić, przeprowadzić."
memory: "wyprowadzić — «вывести», wy- плюс prowadzić. Запоминайте тройку целиком: wprowadzić się «въехать», wyprowadzić się «СЪЕХАТЬ», przeprowadzić się «переехать». И оборот wyprowadzić z równowagi — слово в слово русский."
idioms:
  - { pl: "wyprowadzić kogoś z równowagi", ru: "вывести кого-л. из равновесия" }
  - { pl: "wyprowadzić kogoś w pole", ru: "обвести вокруг пальца" }
