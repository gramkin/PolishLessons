notes:
  - { kind: false-friend, text: "Русский «морг» пришёл из французского и родни у нас не имеет вовсе. Польское KOSTNICA построено от KOŚĆ «кость»: это, дословно, «костное место». Корень держит и всё гнездо: KOSTNY «костный», KOŚCISTY «костлявый». А в старых костёлах KOSTNICA значит оссуарий, часовню с уложенными костями, и это и есть исходный смысл слова, из которого потом вырос больничный." }
  - { kind: usage, text: "Десять форм, женский род, основа на -CA, как у TĘTNICA и PRZECZNICA. Родительный, дательный и местный единственного числа совпадают: все три дают KOSTNICY. В родительном множественного окончания нет: KOSTNIC. Суффикс -NICA здесь называет место, и по тому же образцу построены PRZECZNICA и KIEROWNICA." }
  - { kind: government, text: "В морг — DO KOSTNICY, предлог DO с родительным, тогда как русский скажет «в морг», с винительным. В морге — W KOSTNICY, местный падеж, и форма та же самая, что и после DO: различает их только предлог. Рядом с моргом — OBOK KOSTNICY, тоже родительный. Эту пару стоит запомнить вместе." }
  - { kind: pronunciation, text: "Читается «костни́ца», три слога, ударение на предпоследнем. Скопление STN произносится полностью, все три согласных: «кост-ни». Сочетание NI перед гласной даёт мягкое «ни». Конечная A звучит обычным «а». Для русского уха слово почти своё, только с другим суффиксом." }
  - { kind: register, text: "Слово официальное, из языка больницы и полиции: KOSTNICA SZPITALNA, KOSTNICA MIEJSKA. В обиходной речи его избегают и говорят описательно. Второе значение историческое и туристическое: KOSTNICE при старых костёлах показывают приезжим, и самая известная в Чехии, в Седлеце, по-польски тоже называется KOSTNICA." }
