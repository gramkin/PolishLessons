etymology: "От KOŚĆ «кость», слова праславянского и того же, что русская «кость», с суффиксом -NICA, который называет место: KOSTNICA это «место костей». Так же построены PRZECZNICA, улица поперёк, и TĘTNICA, та, что пульсирует. Русский на это место взял чужое слово, французское «морг», и потому родства у него ни с чем нет, тогда как польское слово прозрачно насквозь."
memory: "Морг, но слово своё и прозрачное: kostnica от kosc «кость», то есть «костное место», с суффиксом -nica, который называет место, как в przecznica. Наш «морг» французский и родни не имеет. Читается «костни́ца», все три согласных в stn выговариваются. Запомните падежи: do kostnicy значит «в морг», а w kostnicy — «в морге», форма одна, различает предлог."
