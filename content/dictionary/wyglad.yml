notes:
  - { kind: false-friend, text: "КОРЕНЬ ТОТ ЖЕ, ЧТО В РУССКОМ «ГЛЯДЕТЬ». Wygląd от wyglądać «выглядеть», а glądać отвечает русскому «глядеть»: оба от праславянского *ględati. Русское «выглядеть» построено из тех же частей, так что глагол узнаётся сразу. Существительного «выгляд» в русском нет — переводить надо словом «внешность» или «вид»." }
  - { kind: pronunciation, text: "ПРЕДЛОЖНЫЙ ПАДЕЖ СМЯГЧАЕТ D В DZI: W WYGLĄDZIE. Тот же ряд уже встречался в naród — w narodzie, ogród — w ogrodzie, metoda — w metodzie. Носовое ą перед d звучит как «он», а конечное d оглушается: «вы́глонт», но «выгло́ндзе»." }
  - { kind: usage, text: "Глагол wyglądać двузначен: wyglądać na zmęczonego «выглядеть усталым» и wyglądać przez okno «выглядывать в окно». Оборот z wyglądu значит «на вид»: z wyglądu ma czterdzieści lat. Прилагательное — нет, вместо него говорят zewnętrzny или opisowo." }
collocations:
  - { pl: "z wyglądu", ru: "на вид" }
  - { pl: "zmienić wygląd", ru: "изменить внешность" }
  - { pl: "sądzić po wyglądzie", ru: "судить по внешности" }
family:
  - { pl: "wyglądać", ru: "выглядеть; выглядывать", relation: root, id: wygladac }
  - { pl: "glądać", ru: "глядеть (в сложных словах)", relation: root }
  - { pl: "spojrzenie", ru: "взгляд", relation: derived }
etymology: "От wyglądać, приставка wy- плюс -glądać, из праславянского *ględati «смотреть» — того же корня, что русские «глядеть», «взгляд», «оглядеть». Отсюда wygląd, oglądać «смотреть», przeglądać «просматривать», zaglądać «заглядывать» и przegląd «обзор»."
memory: "wygląd — «внешность, вид», от wyglądać «выглядеть», а корень тот же, что в русском «ГЛЯДЕТЬ». Существительного «выгляд» по-русски нет. Предложный смягчает d: w wyglądzie, как w narodzie."
idioms:
