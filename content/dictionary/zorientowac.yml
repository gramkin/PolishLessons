notes:
  - { kind: government, text: "После четырёх карточек подряд, где управление расходилось с русским, здесь наконец совпадение — и его стоит отметить именно поэтому. ZORIENTOWAĆ SIĘ W CZYMŚ берёт предлог W с предложным падежом, ровно как русское «сориентироваться в чём-то»: ZORIENTOWAĆ SIĘ W SYTUACJI, W TERENIE, W PRZEPISACH. Переносить можно прямо, ничего не меняя. Вывод из всей серии один: управление надо проверять по карточке, а не гадать — иногда оно совпадает, иногда нет, и предсказать это по смыслу нельзя." }
  - { kind: usage, text: "Чаще всего глагол стоит с SIĘ и значит «понять, сообразить», причём с оттенком внезапности: ZORIENTOWAŁEM SIĘ, ŻE значит «я сообразил, что» или «до меня дошло, что». Без SIĘ он переходный и значит «сориентировать кого-то, ввести в курс»: ZORIENTUJ NOWEGO PRACOWNIKA. Поэтому в карточке есть и страдательные причастия: ZORIENTOWANY ZESPÓŁ — «сориентированная команда». А вот существительное ORIENTACJA русскому знакомо и значит то же." }
  - { kind: pronunciation, text: "Третий глагол класса на -OWAĆ в словаре, после DOPILNOWAĆ и DOPASOWAĆ, и ведёт себя точно так же: в настоящем времени -owa- сменяется на -uj-, то есть ZORIENTUJĘ, ZORIENTUJESZ, ZORIENTUJE, ZORIENTUJĄ, повелительное ZORIENTUJ. Прошедшее время и причастия держат -owa-: ZORIENTOWAŁ, ZORIENTOWANY, ZORIENTOWANIE. Класс этот в польском очень большой, потому что через него входят почти все заимствованные глаголы." }
  - { kind: usage, text: "Пятьдесят три формы — совершенный переходный: сорок одна основная, одиннадцать страдательных причастий и деепричастие ZORIENTOWAWSZY. Приставка z- здесь чисто видовая, как в русском «сориентировать» при «ориентировать»: несовершенная пара ORIENTOWAĆ значит то же самое, только о действии в ходу. Слово пришло в польский из западных языков через латинское oriens «восток» — ориентироваться значило изначально «найти, где восток»." }
collocations:
  - { pl: "zorientować się w sytuacji", ru: "сориентироваться в обстановке" }
  - { pl: "zorientować się, że", ru: "сообразить, что" }
  - { pl: "zorientować kogoś", ru: "ввести кого-либо в курс" }
family:
  - { pl: "orientować", ru: "ориентировать", relation: aspect }
  - { pl: "orientacja", ru: "ориентация, ориентирование", relation: derived }
  - { pl: "zorientowanie", ru: "ориентированность", relation: derived }
etymology: "Приставка z- и ORIENTOWAĆ, из западноевропейских языков, от латинского oriens «восходящий, восток»: сориентироваться значило найти, где восток, и уже оттуда — понять, где находишься. Русское «ориентироваться» пришло тем же путём и из того же источника, поэтому слова совпадают и по смыслу, и по управлению. Приставка z- тут чисто видовая, как в русском «сориентировать» при «ориентировать»."
memory: "Как русское «сориентироваться», вплоть до управления: zorientować się W sytuacji, «в обстановке». Редкий случай, когда предлог и падеж переносятся без поправок."
idioms:
