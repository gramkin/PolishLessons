etymology: "От BRĄZ «бронза», которое польский взял из итальянского BRONZO через французский, как и русский. Дальше языки разошлись. Польский назвал металлом сам цвет и вытеснил этим словом прежние названия коричневого, так что сегодня BRĄZOWY — основное слово для этого цвета, а о металле говорят по контексту. Русский сохранил «бронзовый» только за металлом и оттенком загара, а для цвета взял «коричневый» — от «корицы», по пряности. Получилась пара, где слова общего происхождения называют разное: польское BRĄZOWY покрывает то, что русский делит между «коричневым» и «бронзовым». Суффикс -OWY, образующий прилагательные от существительных, отвечает русскому -ОВЫЙ буквально: BRĄZOWY и «бронзовый», DOMOWY и «домовый», WODNY рядом с WODOWY показывает, что выбор суффикса иногда расходится."
memory: "Польское brązowy — это прежде всего «коричневый», и лишь во вторую очередь «бронзовый»: brązowy płaszcz — коричневое пальто, brązowe oczy — карие глаза, и только brązowy medal — бронзовая медаль. Слова «коричневый» в польском нет вообще, поэтому цвет приходится называть металлом. Одиннадцать форм, степеней сравнения нет: «коричневее» будет bardziej brązowy. Наречие — na brązowo."
