notes:
  - { kind: false-friend, text: "Главная ловушка этого слова. BRĄZOWY в обычной речи значит «коричневый», а не «бронзовый»: BRĄZOWY PŁASZCZ это коричневое пальто, BRĄZOWE OCZY это карие глаза, BRĄZOWY CHLEB это чёрный хлеб. Русское «бронзовый» в польском остаётся только там, где речь о металле и о спортивной награде: BRĄZOWY MEDAL, BRĄZOWA FIGURA. То есть польское слово шире русского: оно покрыло весь коричневый цвет, потому что назвать коричневый цвет по металлу — обычный путь, тот же, что в русском «бронзовый загар». Обратная ошибка опаснее: описывая коричневую куртку по-польски, русскоязычный ищет слово вроде KORICZNIEWY, а его нет вовсе." }
  - { kind: usage, text: "Одиннадцать форм, и это полный набор так называемого относительного прилагательного: сравнительной и превосходной степени у него нет, потому что цвет либо есть, либо нет. Если нужно сказать «коричневее», польский строит это аналитически, через BARDZIEJ: BARDZIEJ BRĄZOWY, NAJBARDZIEJ BRĄZOWY, в точности как русское «более коричневый». Одиннадцать форм — это шесть падежей в двух родах плюс мужское-личное множественное BRĄZOWI, которое у неодушевлённого цвета встречается редко, но в наборе есть. Наречие от этого прилагательного — NA BRĄZOWO: OPALIĆ SIĘ NA BRĄZOWO, POMALOWAĆ NA BRĄZOWO." }
  - { kind: pronunciation, text: "Читается «бронзо́вы», три слога, ударение на предпоследнем. Носовое Ą перед Z даёт «он», как и в KRĄŻYĆ или WĄSY: не «бранзовы» и не «бразовы». Буква Y в конце это «ы», поэтому слово кончается на «вы», а не на «вый»: в польском нет долгого окончания -ЫЙ, и это общее правило для всех прилагательных мужского рода. В форме BRĄZOWĄ носовое Ą на конце звучит как «он» с ослабленным носовым: «бронзо́вон»." }
  - { kind: stress, text: "Ударение в польском всегда на предпоследнем слоге, и у прилагательных это особенно заметно, потому что оно переезжает при изменении слова. BRĄZOWY — «бронзо́вы», ударение на ZO. BRĄZOWEGO — «бронзо́вэго», ударение по-прежнему на ZO, потому что слог предпоследний. BRĄZOWYMI — «бронзовы́ми», и теперь ударение сместилось на WY. Русский так не делает: в «кори́чневыми» ударение стоит на корне во всех формах. Поэтому в длинных формах польского прилагательного нужно каждый раз пересчитывать слоги от конца." }
