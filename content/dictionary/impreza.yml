# review
id: impreza
format: 2
lemma: "impreza"
rank: 647
pos: noun
pron: { cyr: "импрэ́за" }
senses:
  - id: party
    ru: "вечеринка"
    note: "na imprezie «на вечеринке», na imprezę «на вечеринку»."
    examples:
      - pl: "Impreza była sukcesem."
        ru: "Вечеринка удалась."
        source: { kind: translated, id: 3525138 }
      - pl: "Widziałem ją na imprezie."
        ru: "Я видел её на вечеринке."
        source: { kind: tatoeba, id: 2146168 }
      - pl: "Będziesz na imprezie?"
        ru: "Ты будешь на вечеринке?"
        source: { kind: translated, id: 534114 }
  - id: event
    ru: "мероприятие (спортивное, культурное)"
    note: "Одно польское слово покрывает оба русских."
    examples:
      - pl: "Dajemy im możliwość organizacji własnych imprez."
        ru: "Мы даём им возможность устраивать собственные мероприятия."
        source: { kind: translated, id: 11164733 }
      - pl: "To największa impreza sportowa w kraju."
        ru: "Это крупнейшее спортивное мероприятие в стране."
        source: { kind: authored }
      - pl: "Impreza kulturalna trwała trzy dni."
        ru: "Культурное мероприятие длилось три дня."
        source: { kind: authored }
  - id: throw-a-party
    ru: "urządzić imprezę — устроить вечеринку"
    examples:
      - pl: "Zorganizuje imprezę."
        ru: "Он устроит вечеринку."
        source: { kind: translated, id: 2903787 }
      - pl: "Zaczynajmy imprezę."
        ru: "Начнём вечеринку."
        source: { kind: translated, id: 550662 }
      - pl: "Mieliśmy małą imprezę."
        ru: "У нас была маленькая вечеринка."
        source: { kind: translated, id: 3070707 }
notes:
  - { kind: usage, text: "Слово покрывает сразу два русских: и «вечеринка» (Byłem na imprezie), и «мероприятие» (impreza sportowa, impreza kulturalna). Решает контекст." }
  - { kind: government, text: "«На вечеринке» — na с предложным: na imprezie. «На вечеринку» — na с винительным: na imprezę. Различие ровно как в русском." }
  - { kind: usage, text: "Разговорный глагол imprezować значит «тусоваться, гулять»: lubi imprezować." }
  - { kind: usage, text: "Родительный множественного — imprez, без окончания: nienawidzę imprez «ненавижу вечеринки»." }
collocations:
  - { pl: "na imprezie", ru: "на вечеринке" }
  - { pl: "impreza sportowa", ru: "спортивное мероприятие" }
  - { pl: "urządzić imprezę", ru: "устроить вечеринку" }
  - { pl: "iść na imprezę", ru: "идти на вечеринку" }
family:
  - { pl: "imprezować", ru: "тусоваться", relation: derived }
  - { pl: "impresario", ru: "импресарио", relation: root }
  - { pl: "przyjęcie", ru: "приём", relation: root }
etymology: "Из итальянского impresa «предприятие, начинание» через немецкий — тот же корень, что в слове «импресарио»."
memory: "impreza — это сразу и «вечеринка», и «мероприятие»: Byłem na imprezie «Я был на вечеринке», но impreza sportowa — «спортивное мероприятие», и различает их только контекст. Падежи совпадают с русскими: na imprezie с предложным, na imprezę с винительным. Родительный множественного без окончания — nienawidzę imprez. А разговорное imprezować значит «тусоваться»."
idioms:
  - { pl: "na imprezie", ru: "на вечеринке" }
  - { pl: "impreza sportowa", ru: "спортивное мероприятие" }
  - { pl: "urządzić imprezę", ru: "устроить вечеринку" }
formExamplesSkip:
  - { form: "imprezo", reason: "звательный падеж отвлечённого существительного: по-польски к вечеринке не обращаются, форма остаётся только в таблице" }
