notes:
  - { kind: false-friend, text: "DYPLOM — «диплом», через Y. Выпускная работа — PRACA DYPLOMOWA. Аттестат школы — ŚWIADECTWO, сертификат курсов — CERTYFIKAT. Дипломат — DYPLOMATA, другое слово." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Родительный — DYPLOMU. В местном M смягчается: W DYPLOMIE." }
