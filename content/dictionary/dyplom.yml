etymology: "Из греческого DIPLŌMA «сложенный вдвое лист». Отсюда же «дипломат» — тот, кто носит грамоты. Русское «диплом» — то же слово."
memory: "Dyplom — диплом, через y; praca dyplomowa — дипломная работа. Świadectwo — школьный аттестат. Читается «ды́плом»."
