# review
id: gosc
format: 2
lemma: "gość"
rank: 373
pos: noun
pron: { cyr: "госьць" }
senses:
  - id: guest
    ru: "гость"
    examples:
      - pl: "Idę do przyjaciółek w gości."
        ru: "Я схожу в гости к подругам."
        source: { kind: tatoeba, id: 13785270 }
      - pl: "Nie lubię nieproszonych gości."
        ru: "Я не люблю незваных гостей."
        source: { kind: tatoeba, id: 13084380 }
      - pl: "Goście przyszli o siódmej."
        ru: "Гости пришли в семь."
        source: { kind: authored }
  - id: guy
    ru: "тип, парень, чувак (разговорное)"
    note: "Очень частое разговорное значение, никак не связанное с гостями."
    examples:
      - pl: "Uwielbiam tego gościa."
        ru: "Обожаю этого типа."
        source: { kind: translated, id: 6554058 }
      - pl: "Nieprzyjemny gość."
        ru: "Неприятный тип."
        source: { kind: translated, id: 13640111 }
      - pl: "Tom to jest fajny gościu."
        ru: "Том классный парень."
        source: { kind: translated, id: 8530024 }
notes:
  - { kind: usage, text: "iść w gości — «идти в гости», mieć gości — «принимать гостей», nieproszony gość — «незваный гость»." }
  - { kind: register, text: "В разговорной речи gość значит просто «тип, парень»: fajny gość «классный парень». Обращение gościu! — «чувак!»." }
  - { kind: usage, text: "Творительный множественного — gośćmi: Jesteśmy gośćmi «Мы гости»." }
collocations:
  - { pl: "nieproszony gość", ru: "незваный гость" }
  - { pl: "iść w gości", ru: "идти в гости" }
  - { pl: "fajny gość", ru: "классный парень" }
  - { pl: "mieć gości", ru: "принимать гостей" }
etymology: "Праславянское *gostь — то же слово, что русское «гость»; родственно латинскому hostis и немецкому Gast."
memory: "gość — «гость», но в разговоре ещё и «тип, чувак»: fajny gość «классный парень». А идут именно w gości."
idioms:
  - { pl: "gość w dom, Bóg w dom", ru: "гость в дом — Бог в дом" }
  - { pl: "nieproszony gość", ru: "незваный гость" }
  - { pl: "iść w gości", ru: "идти в гости" }
