# review
id: marzyc
format: 2
lemma: "marzyć"
rank: 1312
pos: verb
aspect: imperf
pron: { cyr: "ма́жыць" }
senses:
  - id: dream-of
    ru: "marzyć o czymś — мечтать о чём-то"
    examples:
      - pl: "Marzę o tobie."
        ru: "Я мечтаю о тебе."
        source: { kind: translated, id: 13272784 }
      - pl: "Marzę o tym by zostać nauczycielką."
        ru: "Я мечтаю стать учительницей."
        source: { kind: translated, id: 605459 }
      - pl: "On marzy o zostaniu astronautą."
        ru: "Он мечтает стать космонавтом."
        source: { kind: translated, id: 4300008 }
  - id: dream-noun
    ru: "marzenie — мечта"
    examples:
      - pl: "Mam marzenie."
        ru: "У меня есть мечта."
        source: { kind: tatoeba, id: 350112 }
      - pl: "Moje marzenie się spełniło."
        ru: "Моя мечта сбылась."
        source: { kind: tatoeba, id: 5572700 }
      - pl: "Moim marzeniem jest zostać pilotem."
        ru: "Моя мечта - стать пилотом."
        source: { kind: tatoeba, id: 3743798 }
  - id: dreams
    ru: "marzenia — мечты"
    examples:
      - pl: "Marzenia się spełniają."
        ru: "Мечты сбываются."
        source: { kind: translated, id: 393329 }
      - pl: "Marzenia nie zawsze się spełniają."
        ru: "Мечты не всегда сбываются."
        source: { kind: translated, id: 641841 }
      - pl: "Tom nie chce porzucić swojego marzenia o zostaniu astronautą."
        ru: "Том не желает отказываться от своей мечты стать космонавтом."
        source: { kind: tatoeba, id: 2798522 }
notes:
  - { kind: government, text: "marzyć o czymś «мечтать о чём-то» — предлог o с предложным падежом, ровно как в русском." }
  - { kind: usage, text: "Отглагольное существительное marzenie «мечта» встречается даже чаще самого глагола: marzenie się spełniło «мечта сбылась»." }
  - { kind: usage, text: "Вид несовершенный; совершенный — pomarzyć «помечтать». Мечтатель — marzyciel." }
  - { kind: usage, text: "Идиома marzyć o niebieskich migdałach значит «витать в облаках» — она уже встречалась на карточке niebieski." }
collocations:
  - { pl: "marzyć o czymś", ru: "мечтать о чём-то" }
  - { pl: "marzenie się spełniło", ru: "мечта сбылась" }
  - { pl: "spełnić marzenie", ru: "исполнить мечту" }
etymology: "Праславянское *mariti «грезить», от *mara «морок, призрак». Русские «марево» и «мара» — то же гнездо."
memory: "marzyć o czymś — «мечтать о чём-то», с предлогом o и предложным падежом, как в русском. Существительное marzenie «мечта» даже частотнее глагола. Корень тот же, что в русском «марево»."
idioms:
  - { pl: "marzenie się spełniło", ru: "мечта сбылась" }
  - { pl: "marzyć o czymś", ru: "мечтать о чём-то" }
  - { pl: "marzyć o niebieskich migdałach", ru: "витать в облаках" }
