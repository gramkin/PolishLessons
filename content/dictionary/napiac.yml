notes:
  - { kind: pronunciation, text: "Основа ведёт себя резче, чем у других глаголов на -ĄĆ. Инфинитив NAPIĄĆ, но личные формы идут от другой основы: NAPNĘ, NAPNIESZ, NAPNIE, NAPNĄ — гласная выпадает вовсе. Прошедшее держит ą только в мужском единственном, NAPIĄŁ, а дальше ę: NAPIĘŁA, NAPIĘLI, NAPIĘŁY — то же правило, что у WPŁYNĄĆ, OMINĄĆ и PŁONĄĆ из предыдущих партий. Повелительное NAPNIJ с -IJ, потому что остаток основы NAPN- слово закрыть не может: ровно случай из карточки KARMIĆ." }
  - { kind: false-friend, text: "Корень PIĄĆ русскому знаком плохо, зато производное — отлично. NAPIĘCIE значит и «натяжение», и «напряжение» в двух смыслах: душевное (NAPIĘCIE W POKOJU — «напряжение в комнате») и электрическое (NAPIĘCIE 230 WOLTÓW — то, что написано на каждой розетке). Русское «напряжение» покрывает то же поле, так что существительное переносится целиком, хотя глагол NAPIĄĆ опознать труднее. Сам PIĄĆ SIĘ значит «взбираться»: PIĄŁ SIĘ PO SKAŁACH." }
  - { kind: government, text: "Что — винительный: NAPIĄĆ LINĘ, STRUNĘ, MIĘŚNIE, ŁUK. Между чем — предлог MIĘDZY с творительным: MIĘDZY DWOMA DRZEWAMI. Возвратное NAPIĄĆ SIĘ значит «напрячься», о человеке и о верёвке: LINA NAPIĘŁA SIĘ I PĘKŁA. В переносном смысле употребляется чаще причастие и существительное, чем сам глагол: ATMOSFERA BYŁA NAPIĘTA, NAPIĘTY GRAFIK — «напряжённый график»." }
  - { kind: usage, text: "Несовершенная пара — NAPINAĆ, и в ней основа снова другая: NAPINAM, NAPINASZ. Самые частые употребления — не глагольные: NAPIĘTY значит «натянутый» и «напряжённый» (NAPIĘTE STOSUNKI «напряжённые отношения», NAPIĘTY TERMIN «сжатый срок»), а NAPIĘCIE идёт и в технике, и в разговоре о людях. Так что учить стоит прежде всего причастие и существительное, а глагол — следом." }
collocations:
  - { pl: "napiąć linę", ru: "натянуть верёвку" }
  - { pl: "napięte stosunki", ru: "напряжённые отношения" }
  - { pl: "napięcie 230 woltów", ru: "напряжение 230 вольт" }
family:
  - { pl: "napinać", ru: "натягивать, напрягать", relation: aspect }
  - { pl: "napięcie", ru: "натяжение; напряжение", relation: derived, id: napiecie }
  - { pl: "piąć się", ru: "взбираться", relation: root }
etymology: "Приставка na- и PIĄĆ, из праславянского *pęti «натягивать, растягивать» — того же корня, что русские «пять» в смысле «натягивать» (ср. «распять», «запятая», «пяльцы») и «путы». Связь видна лучше всего через «распять»: это буквально «растянуть». Польский сохранил глагол живым, PIĄĆ SIĘ «взбираться», и построил на нём NAPIĄĆ, NAPINAĆ, NAPIĘCIE, а русский оставил корень почти только в приставочных словах. Отсюда и то, что NAPIĘCIE узнаётся сразу, а NAPIĄĆ — нет."
memory: "Корень виден через «распять» — это «растянуть». А самое нужное здесь не глагол, а napięcie: и «натяжение», и «напряжение», включая 230 вольт на розетке."
idioms:
