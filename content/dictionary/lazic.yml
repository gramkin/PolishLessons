# review
id: lazic
format: 2
lemma: "łazić"
rank: 5777
pos: verb
pron: { cyr: "уа́зиць" }
senses:
  - id: traipse
    ru: "разг. шляться, бродить, таскаться (без дела)"
    examples:
      - pl: "Gdzie ty łazisz całymi dniami?"
        ru: "Где ты шатаешься целыми днями?"
        source: { kind: authored }
      - pl: "Łazimy po tym mieście od godziny."
        ru: "Мы шатаемся по этому городу уже час."
        source: { kind: authored }
  - id: climb
    ru: "лазить, карабкаться (по чему-л.)"
    examples:
      - pl: "Dziecko łazi po drzewach od rana."
        ru: "Ребёнок лазит по деревьям с утра."
        source: { kind: authored }
      - pl: "W wakacje łazimy po górach."
        ru: "На каникулах мы лазим по горам."
        source: { kind: authored }
  - id: crawl
    ru: "ползать (о насекомых, о ребёнке)"
    examples:
      - pl: "Mrówki łażą po stole."
        ru: "Муравьи ползают по столу."
        source: { kind: authored }
      - pl: "Dziecko łaziło po podłodze na czworakach."
        ru: "Ребёнок ползал по полу на четвереньках."
        source: { kind: authored }
notes:
  - { kind: usage, text: "łazić — неопределённый (многократный) глагол движения, пара к определённому leźć, как chodzić к iść. łazić описывает хождение вообще или повторяющееся, leźć — одно конкретное движение в один конкретный раз: łażę po mieście «я брожу по городу», но lezę na górę «я лезу на гору». Это не видовая пара: оба глагола несовершенного вида." }
  - { kind: register, text: "Разговорное и обычно пренебрежительное. Нейтральный глагол — chodzić; łazić добавляет оттенок «шляться, таскаться без дела». «Gdzie łazisz?» звучит резко, с упрёком, а «Gdzie chodzisz?» — нейтрально. В письменной и официальной речи łazić не употребляют." }
  - { kind: government, text: "łazić po czymś — предложный падеж: łazić po górach, po mieście, po drzewach, po dachu. Отдельная конструкция łazić za kimś «таскаться за кем-л.» требует za с творительным." }
  - { kind: false-friend, text: "Русское «лазить» — прямой родственник, но объём значений разошёлся. Польское łazić в быту прежде всего «шляться, бродить пешком», и только потом «карабкаться»; для карабканья по-польски вернее wspinać się. Поэтому «łazi po mieście» — это не «лазит по городу», а «шатается по городу»." }
collocations:
  - { pl: "łazić po górach", ru: "ходить в горы, лазить по горам" }
  - { pl: "łazić po sklepach", ru: "таскаться по магазинам" }
  - { pl: "łazić za kimś", ru: "таскаться за кем-л." }
family:
  - { pl: "leźć", ru: "лезть (определённый глагол движения)", relation: root }
  - { pl: "łazik", ru: "бродяга; вездеход, марсоход", relation: derived }
  - { pl: "łażenie", ru: "шатание, хождение", relation: derived }
  - { pl: "włazić", ru: "влезать, забираться", relation: derived }
  - { pl: "wyłazić", ru: "вылезать", relation: derived }
etymology: "Праславянское *laziti, от того же корня, что русское «лазить» и «лаз». Исходное значение — «двигаться ползком по поверхности»; польский развил из него «ходить без цели, шляться», сохранив и старое «карабкаться». От того же корня образовано łazik — и «бродяга», и «вездеход»: именно так по-польски называется марсоход, łazik marsjański."
memory: "łazić — прямой родственник русского «лазить», но в живой речи значит прежде всего «шляться, бродить»: «Gdzie łazisz?» — «Где тебя носит?». Нейтральный глагол — chodzić. А łazik — одновременно бродяга и марсоход."
idioms:
  - { pl: "łazić za kimś jak cień", ru: "ходить за кем-л. как тень" }
  - { pl: "Gdzie łazisz?", ru: "Где тебя носит? (разг., с упрёком)" }
