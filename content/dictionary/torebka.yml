# review
id: torebka
format: 2
lemma: "torebka"
rank: 1975
pos: noun
pron: { cyr: "торэ́пка" }
senses:
  - id: handbag
    ru: "сумочка, дамская сумка"
    examples:
      - pl: "Czyja to torebka?"
        ru: "Чья это сумочка?"
        source: { kind: translated, id: 8722939 }
      - pl: "To jest moja torebka."
        ru: "Это моя сумочка."
        source: { kind: translated, id: 11119137 }
      - pl: "Ukradziono jej torebkę."
        ru: "У неё украли сумочку."
        source: { kind: translated, id: 368108 }
      - pl: "Kto wziął moją torebkę?"
        ru: "Кто взял мою сумочку?"
        source: { kind: translated, id: 6635762 }
      - pl: "Wyjęła coś z torebki."
        ru: "Она достала что-то из сумочки."
        source: { kind: translated, id: 930132 }
      - pl: "Znaleźliśmy ukradzioną torebkę w tych krzakach."
        ru: "Мы нашли украденную сумку в этих кустах."
        source: { kind: tatoeba, id: 366091 }
  - id: packet
    ru: "пакет, пакетик"
    examples:
      - pl: "Papierowa torebka jest lepsza dla środowiska niż te z tworzyw sztucznych."
        ru: "Бумажный пакет лучше для окружающей среды, чем пакеты из пластика."
        source: { kind: translated, id: 10283995 }
      - pl: "Nie powinienem był jeść całej torebki czipsów."
        ru: "Не надо было съедать целый пакет чипсов."
        source: { kind: translated, id: 968884 }
notes:
  - { kind: false-friend, text: "torebka — не «коробка». Это уменьшительное от torba «сумка»: torba — сумка вообще, torebka — дамская сумочка или бумажный пакетик." }
  - { kind: usage, text: "Второе значение — «пакетик»: torebka herbaty «пакетик чая», plastikowa torebka «пластиковый пакет»." }
  - { kind: usage, text: "Предложный падеж — w torebce «в сумочке», с чередованием k → c." }
collocations:
  - { pl: "w torebce", ru: "в сумочке" }
  - { pl: "torebka herbaty", ru: "пакетик чая" }
  - { pl: "skórzana torebka", ru: "кожаная сумочка" }
etymology: "Уменьшительное от torba «сумка» с суффиксом -ka. Русское «торба» — то же самое слово, но в русском оно устарело и сузилось до мешка для корма."
memory: "torba — сумка вообще, torebka — дамская сумочка. И ещё «пакетик»: torebka herbaty «пакетик чая»."
idioms:
  - { pl: "torebka herbaty", ru: "пакетик чая" }
  - { pl: "w torebce", ru: "в сумочке" }
  - { pl: "plastikowa torebka", ru: "пластиковый пакет" }
formExamplesSkip:
  - { form: "torebki", cell: "Звательный", reason: "звательный падеж: к предмету или понятию не обращаются" }
