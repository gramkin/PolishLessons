# review
id: wyjezdzac
format: 2
lemma: "wyjeżdżać"
rank: 1371
pos: verb
aspect: imperf
aspectPair: wyjechac
pron: { cyr: "вые́жджаць" }
senses:
  - id: depart
    ru: "уезжать, отправляться"
    examples:
      - pl: "Niedługo wyjeżdżam za granicę."
        ru: "Скоро я уезжаю за границу."
        source: { kind: tatoeba, id: 6156383 }
      - pl: "Jutro wyjeżdżam do Paryża."
        ru: "Завтра я уезжаю в Париж."
        source: { kind: translated, id: 559234 }
      - pl: "Wyjeżdżamy stąd."
        ru: "Мы уезжаем отсюда."
        source: { kind: translated, id: 3038419 }
  - id: travel
    ru: "выезжать (регулярно, за границу)"
    examples:
      - pl: "Mój ojciec czasami wyjeżdża za granicę."
        ru: "Мой отец иногда выезжает за границу."
        source: { kind: tatoeba, id: 592011 }
      - pl: "Jak często wyjeżdżasz za granicę?"
        ru: "Как часто ты ездишь за границу?"
        source: { kind: tatoeba, id: 3846746 }
notes:
  - { kind: usage, text: "Несовершенный вид к wyjechać. Wyjeżdżam jutro — настоящее время в значении будущего, ровно как русское «я уезжаю завтра»." }
  - { kind: government, text: "wyjeżdżać z czegoś «уезжать откуда-то» и do czegoś «уезжать куда-то», оба с родительным: wyjeżdżam z Warszawy do Krakowa. «За границу» — za granicę, с винительным." }
  - { kind: usage, text: "Только о поездке на транспорте. Уйти пешком — wychodzić, wyjść." }
  - { kind: false-friend, text: "Различайте приставки: wyjeżdżać «уезжать», przyjeżdżać «приезжать», odjeżdżać «отходить, отъезжать» (о поезде, автобусе)." }
collocations:
  - { pl: "wyjeżdżać za granicę", ru: "уезжать за границу" }
  - { pl: "wyjeżdżać na wakacje", ru: "уезжать в отпуск" }
  - { pl: "wyjeżdżać jutro", ru: "уезжать завтра" }
etymology: "Приставка wy- «вы-» и jeżdżać, многократная основа от jechać «ехать» (праславянское *jexati). Русское «выезжать» собрано из тех же частей."
memory: "wyjeżdżać — «уезжать»: wy- «вы-» плюс jechać «ехать». Совершенный вид — wyjechać. Запомните управление: wyjeżdżam z Warszawy do Krakowa, но za granicę с винительным. И только о транспорте — пешком уходят wychodzić."
idioms:
  - { pl: "wyjeżdżać za granicę", ru: "уезжать за границу" }
  - { pl: "wyjeżdżać na wakacje", ru: "уезжать в отпуск" }
  - { pl: "wyjeżdżać z czymś", ru: "некстати завести речь о чём-то" }
