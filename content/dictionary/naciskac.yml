notes:
  - { kind: government, text: "Два значения — два управления, и это главное, что надо запомнить. Физическое нажатие идёт с прямым винительным: NACISKAĆ KLAMKĘ, GUZIK, PEDAŁ. А давление на человека требует предлога NA с винительным: NACISKAĆ NA KOGOŚ, NA RZĄD, NA ŚWIADKA. Русский в первом случае чаще вставляет предлог — «нажимать НА кнопку», — а поляк обходится без него, так что NACISKAJ GUZIK звучит для русского уха неполно. Во втором же случае предлог есть в обоих языках." }
  - { kind: false-friend, text: "Корень тот же, что в русских «тиски» и «тискать»: праславянское *tisk-, польское CISNĄĆ «жать, давить». Но поведение слов разошлось. Польское CISNĄĆ значит и «жать» (BUTY CISNĄ — «ботинки жмут»), и «бросить» в разговорной речи. А русское «тискать» ушло в сторону объятий и возни, и подставлять его тут нельзя. Зато существительное NACISK — «нажим, давление» — ложится на русское слово точно, в том числе переносно: POD NACISKIEM OPINII PUBLICZNEJ." }
  - { kind: usage, text: "Совершенная пара — NACISNĄĆ, для однократного нажатия: NACISNĄŁ GUZIK I DRZWI SIĘ OTWARŁY. Несовершенное NACISKAĆ описывает либо длящееся нажатие, либо повторяющееся давление, и во втором значении почти всегда стоит именно несовершенный вид: NACISKALI NA NIEGO TYDZIEŃ. Отсюда и существительное NACISK, и оборот WYWIERAĆ NACISK «оказывать давление», который в официальной речи вытесняет сам глагол." }
  - { kind: pronunciation, text: "Основа на -SKA- с настоящим на -AM, как у CZYTAĆ: NACISKAM, NACISKASZ, NACISKA. Сочетание CI читается мягко, «ци» с мягким ц, а не «ки»: всё слово звучит «нацы́скаць». Ударение на предпоследнем слоге во всех формах, кроме условных на -byśmy и -byście, где оно уходит на третий слог от конца: naciskaliBYŚmy." }
collocations:
  - { pl: "naciskać guzik", ru: "нажимать кнопку" }
  - { pl: "naciskać na kogoś", ru: "давить на кого-то" }
