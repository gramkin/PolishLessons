  - { pl: "cisnąć", ru: "жать, давить", relation: root }
  - { pl: "nacisk", ru: "нажим, давление", relation: derived }
etymology: "Приставка na- и CISKAĆ, многократная форма от CISNĄĆ, из праславянского *tisk- «жать, сдавливать» — того же корня, что русские «тиски», «тискать», «стискивать». Приставка na- указывает направление усилия сверху или извне, отсюда и «нажимать», и переносное «давить на кого-то»: обе метафоры в польском и русском одинаковы, потому что обе выросли из одного и того же физического образа. От этого же корня NACISK «нажим» и CIŚNIENIE «давление» — последнее и в медицинском смысле, о кровяном давлении."
memory: "Корень тот же, что в «тиски». Физически — без предлога: naciskaj guzik. На человека — с предлогом: naciskać na kogoś. И nacisk значит «нажим, давление»."
idioms:
