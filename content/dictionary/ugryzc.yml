notes:
  - { kind: pronunciation, text: "ОСНОВА ПОКАЗЫВАЕТ ТРИ ОБЛИКА: Z, Ź И ZI. Инфинитив UGRYŹĆ и повелительное UGRYŹ идут с мягким ź; прошедшее UGRYZŁ — с твёрдым z, но мужско-личное UGRYŹLI снова мягкое; будущее даёт UGRYZĘ с твёрдым и UGRYZIESZ, UGRYZIE с мягким zi; причастие — UGRYZIONY. Это богаче, чем чередование dz/dź у poprowadzić, и единственный способ с ним справиться — запоминать формы группами, а не выводить одну из другой." }
  - { kind: false-friend, text: "Польский GRYŹĆ покрывает и «грызть», и «кусать», которые русский держит порознь. Pies gryzie значит «собака кусается», а не «грызёт»; myszy gryzą kable — «мыши грызут провода». Совершенный UGRYŹĆ отвечает нашему «укусить» и «откусить». Для укуса насекомого поляк чаще возьмёт другой корень: UKĄSZENIE komara, а UGRYZIENIE скорее о собаке." }
  - { kind: usage, text: "Запомни оборот NIE WIEDZIEĆ, Z KTÓREJ STRONY TO UGRYŹĆ — «не знать, с какой стороны к этому подступиться». Образ буквальный: не поймёшь, откуда откусить. Рядом UGRYŹĆ SIĘ W JĘZYK «прикусить язык», то есть смолчать, — тут русский и польский совпадают полностью." }
collocations:
  - { pl: "ugryźć kanapkę", ru: "откусить бутерброд" }
  - { pl: "ugryzienie psa", ru: "укус собаки" }
  - { pl: "ugryźć się w język", ru: "прикусить язык" }
family:
  - { pl: "gryźć", ru: "грызть, кусать (несов.)", relation: aspect }
  - { pl: "gryzoń", ru: "грызун", relation: root }
  - { pl: "zagryźć", ru: "загрызть", relation: root }
etymology: "Приставка u- и gryźć, из праславянского *gryzti — то же слово, что русское «грызть». Совпадение полное и в корне, и в чередованиях: наши «грызу», «грызёт», «грыз» перестраивают основу похожим образом. Отсюда же польский gryzoń «грызун» и наше «грызун», построенные одним суффиксом от одного корня."
memory: "Основа ходит между z, ź и zi: ugryźć, но ugryzł, но ugryźli, но ugryziony. И помни, что gryźć значит и «грызть», и «кусать»: pies gryzie — это «собака кусается»."
idioms:
  - { pl: "nie wiedzieć, z której strony to ugryźć", ru: "не знать, с какой стороны к этому подступиться" }
  - { pl: "ugryźć się w język", ru: "прикусить язык, смолчать" }
