# review
id: normalny
format: 2
lemma: "normalny"
rank: 944
pos: adj
pron: { cyr: "норма́льны" }
senses:
  - id: normal
    ru: "нормальный, обычный"
    examples:
      - pl: "To nie jest normalne!"
        ru: "Это ненормально."
        source: { kind: tatoeba, id: 1110268 }
      - pl: "On uważa to za normalne."
        ru: "Он считает это нормальным."
        source: { kind: tatoeba, id: 13472097 }
      - pl: "Jesteś normalny."
        ru: "Ты нормальный."
        source: { kind: translated, id: 5665164 }
  - id: ordinary
    ru: "обыкновенный, рядовой (о людях и вещах)"
    examples:
      - pl: "To normalni ludzie."
        ru: "Это нормальные люди."
        source: { kind: translated, id: 13335422 }
      - pl: "Tom jest normalnym nastolatkiem."
        ru: "Том нормальный подросток."
        source: { kind: translated, id: 10567259 }
      - pl: "Nie znajdziesz tego słowa w normalnym słowniku."
        ru: "Ты не найдёшь этого слова в обычном словаре."
        source: { kind: translated, id: 4046739 }
  - id: regular
    ru: "обычный, стандартный (о сорте, условиях)"
    examples:
      - pl: "Normalna benzyna, do pełna poproszę."
        ru: "Обычного бензина, полный бак, пожалуйста."
        source: { kind: translated, id: 732901 }
      - pl: "W normalnych warunkach on wstaje o szóstej."
        ru: "В обычных условиях он встаёт в шесть."
        source: { kind: translated, id: 597928 }
      - pl: "Jej gorączka spadła do normalnego poziomu."
        ru: "Её температура упала до нормального уровня."
        source: { kind: translated, id: 836449 }
notes:
  - { kind: usage, text: "Слово совпадает с русским «нормальный», но у него шире бытовой оттенок «обычный, рядовой»: normalna benzyna «обычный бензин», w normalnych warunkach «в обычных условиях»." }
  - { kind: usage, text: "Наречие normalnie значит не только «нормально», но и в разговоре «просто, реально»: Normalnie nie mogłem uwierzyć «Я просто не мог поверить»." }
  - { kind: usage, text: "Степеней сравнения у слова нет: «нормальный» либо да, либо нет. Если надо, говорят bardziej normalny, но звучит это необычно." }
  - { kind: usage, text: "Существительное — norma «норма», отрицание — nienormalny «ненормальный»." }
collocations:
  - { pl: "to normalne", ru: "это нормально" }
  - { pl: "normalny człowiek", ru: "нормальный человек" }
  - { pl: "w normalnych warunkach", ru: "в обычных условиях" }
  - { pl: "normalnie", ru: "нормально; просто" }
family:
  - { pl: "norma", ru: "норма", relation: root }
  - { pl: "normalnie", ru: "нормально", relation: derived }
  - { pl: "nienormalny", ru: "ненормальный", relation: antonym }
etymology: "Через французское normal из латинского norma «угольник, правило». Русское «нормальный» — то же заимствование."
memory: "normalny — «нормальный», но по-польски у слова шире бытовой оттенок «обычный, рядовой»: normalna benzyna «обычный бензин». Степеней сравнения нет: нормальным либо являются, либо нет. А наречие normalnie в разговоре значит ещё и «просто, реально»."
idioms:
