  - id: wipe
    ru: "влажная салфетка (CHUSTECZKA NAWILŻANA)"
    examples:
      - pl: "Wytarła dziecku buzię chusteczką nawilżaną."
        ru: "Она вытерла ребёнку лицо влажной салфеткой."
