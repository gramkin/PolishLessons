notes:
  - { kind: false-friend, text: "CHUSTECZKA — «платочек», от CHUSTA «платок, шаль». С русским «хвост» не связано. Бумажный платок — CHUSTECZKA HIGIENICZNA, а салфетка на столе — SERWETKA, не CHUSTECZKA." }
  - { kind: usage, text: "Девять форм, женский род. Двойное уменьшительное: CHUSTA, CHUSTKA, CHUSTECZKA. Перед E K переходит в C: W CHUSTECZCE. Родительный множественного — CHUSTECZEK. Звательного падежа у вещи нет." }
  - { kind: government, text: "Вытереть платком — WYTRZEĆ CHUSTECZKĄ, творительный без предлога. Высморкаться в платок — WYDMUCHAĆ NOS W CHUSTECZKĘ, W с винительным. Пачка платков — PACZKA CHUSTECZEK, родительный." }
  - { kind: pronunciation, text: "Читается «хустэ́чка», ударение на предпоследнем слоге. CH — «х», TE — твёрдое «тэ», CZ — «ч»." }
  - { kind: register, text: "Обиходное слово. В магазине на упаковке пишут CHUSTECZKI HIGIENICZNE и CHUSTECZKI NAWILŻANE. Платок на голову — CHUSTKA или CHUSTA." }
collocations:
  - { pl: "chusteczka higieniczna", ru: "бумажный платок" }
  - { pl: "chusteczki nawilżane", ru: "влажные салфетки" }
  - { pl: "paczka chusteczek", ru: "пачка платков" }
family:
  - { pl: "chusta", ru: "платок, шаль", relation: root }
  - { pl: "chustka", ru: "платок", relation: root }
  - { pl: "chustka do nosa", ru: "носовой платок", relation: root }
etymology: "От CHUSTA «платок, кусок ткани», общего с украинским «хустка». Суффиксы -K- и -ECZK- дают двойное уменьшительное, как в русском «платок — платочек»."
memory: "Chusteczka — платочек: chusta, chustka, chusteczka. Читается «хустэ́чка». Chusteczki higieniczne — бумажные платки, nawilżane — влажные салфетки."
idioms:
  - { pl: "machać chusteczką na pożegnanie", ru: "махать платочком на прощание" }
formExamplesSkip:
