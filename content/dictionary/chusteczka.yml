# review
id: chusteczka
format: 2
lemma: "chusteczka"
rank: 4793
pos: noun
pron: { cyr: "хустэ́чка" }
senses:
  - id: handkerchief
    ru: "носовой платок; бумажный платочек"
    examples:
      - pl: "Daj mi chusteczkę, proszę."
        ru: "Дай мне, пожалуйста, платок."
        source: { kind: authored }
      - pl: "Wydmuchał nos w chusteczkę."
        ru: "Он высморкался в платок."
        source: { kind: authored }
