etymology: "От SREBRO «серебро», и это то же праславянское слово, что русское. Различие только в гласных внутри корня: восточнославянские языки вставили между согласными полные гласные и получили «серебро», а польский сохранил старую короткую форму SREBRO. Такое же соотношение видно в целом ряду частых слов: BRZEG и «берег», MLEKO и «молоко», ZŁOTO и «золото», GŁOWA и «голова». Русский и сам помнит короткие варианты в книжном слое, «брег», «млеко», «злато», «сребро», так что это не чужая форма, а своя же старшая. Из того же гнезда SREBRZYĆ «серебрить» и SREBRZYSTY."
memory: "Относительное прилагательное, одиннадцать форм, степеней нет: серебряным нельзя быть в большей мере. Для оттенка есть srebrzysty «серебристый», у него степени есть. Правило дороже слова: где в русском -ере- или -оло-, в польском гласной нет, srebro и «серебро», brzeg и «берег», mleko и «молоко». Читается «срэ́брны», четыре согласных подряд, без «е» внутри. Знать srebrne gody «серебряная свадьба» и srebrni «серебряные призёры»."
idioms:
