notes:
  - { kind: usage, text: "Одиннадцать форм и ни одной степени сравнения, и это снова грамматический знак: прилагательное относительное, оно говорит, из чего вещь сделана. Серебряным нельзя быть в большей или меньшей мере, как нельзя быть более деревянным. Если нужно сказать о цвете с оттенком, берут другое слово, SREBRZYSTY «серебристый», и у него степени есть. Мужско-личная форма множественного SREBRNI живёт в спорте и значит «серебряные призёры»: SREBRNI Z TEGO TURNIEJU." }
  - { kind: pronunciation, text: "Читается «срэ́брны», два слога, ударение на первом. Трудность чисто артикуляционная: четыре согласных подряд в середине слова, SREBR, без всякой гласной между Б и Р. Русскому проще произнести, если не вставлять «е»: не «серебрный», а «срэбрны». Буква E читается как «э». В существительном SREBRO слышно «срэ́бро», и это тот же случай. Сравните с русским, где между теми же согласными стоят два «е»: «серебро»." }
  - { kind: false-friend, text: "Ловушка не в значении, а в непривычном виде слова, и за ней стоит правило. Там, где в русском корне звучит -ЕРЕ- или -ОЛО-, в польском гласной нет вовсе: SREBRO и «серебро», BRZEG и «берег», MLEKO и «молоко», GŁOWA и «голова», ZŁOTO и «золото». Это не выпадение звука в польском, а наоборот: восточнославянские языки развили полногласие, а польский сохранил старую короткую форму. Русский её тоже помнит в книжных словах: «сребролюбие», «брег», «млеко», «злато»." }
  - { kind: register, text: "Слово нейтральное. Частые обороты: SREBRNY MEDAL «серебряная медаль», SREBRNE GODY «серебряная свадьба», то есть двадцать пять лет брака, SREBRNY EKRAN «серебряный экран» о кино, SREBRNA MONETA. О седине говорят мягко и книжно: SREBRNE NITKI WE WŁOSACH «серебряные нити в волосах». Прилагательное SREBRZYSTY употребляется о блеске и оттенке: SREBRZYSTY POŁYSK «серебристый блеск»." }
  - { kind: government, text: "Падежом прилагательное не управляет и просто согласуется с существительным в роде, числе и падеже. Стоит заметить только форму предлога: перед словом, начинающимся на S с согласной, предлог Z превращается в ZE, поэтому ZE SREBRNĄ TACĄ «с серебряным подносом» и ZE SREBRNYMI SZTUĆCAMI, а не «z srebrną». То же правило дало ZE WSTĘPEM и ZE ZŁEM, и срабатывает оно по звуку, а не по букве." }
