notes:
  - { kind: pronunciation, text: "Родительный множественного — PUSTYŃ, с мягким ń на конце и нулевым окончанием. Русская «пустынь» выглядит и звучит почти так же, только у нас это отдельное слово со значением монашеского уединения. Форма PUSTYNI при этом работает за родительный, дательный и предложный единственного: do pustyni, ku pustyni, o pustyni." }
  - { kind: usage, text: "Предлог при этом слове не тот, что по-русски. «В пустыне» будет NA PUSTYNI, с предлогом na и предложным падежом, а не «w pustyni». Так же na wsi «в деревне», na Ukrainie «на Украине». Польский выбирает na для открытых пространств, и пустыня для него именно такое." }
collocations:
  - { pl: "na pustyni", ru: "в пустыне" }
  - { pl: "przez pustynię", ru: "через пустыню" }
  - { pl: "pustynia lodowa", ru: "ледяная пустыня" }
family:
  - { pl: "pusty", ru: "пустой", relation: root, id: pusty }
  - { pl: "pustka", ru: "пустота", relation: root }
  - { pl: "pustelnik", ru: "отшельник", relation: root }
etymology: "От PUSTY «пустой», из праславянского *pustъ — того же слова, что русское «пустой». Наша «пустыня» собрана теми же частями и тем же суффиксом, так что слова совпадают целиком. Из того же гнезда польские pustka «пустота» и pustelnik «отшельник», а у нас «пустошь» и «пустынь» — место, куда уходили за пустотой."
memory: "Главное — предлог: NA pustyni, а не «w pustyni», как na wsi. И родительный множественного с мягким ń: kilka pustyń."
idioms:
  - { pl: "głos wołającego na pustyni", ru: "глас вопиющего в пустыне" }
  - { pl: "kulturalna pustynia", ru: "культурная пустыня" }
