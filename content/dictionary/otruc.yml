# review
id: otruc
format: 2
lemma: "otruć"
rank: 5056
pos: verb
pron: { cyr: "о́труць" }
senses:
  - id: poison
    ru: "отравить"
    examples:
      - pl: "Próbowała go otruć."
        ru: "Она пыталась его отравить."
        source: { kind: authored }
      - pl: "Ktoś otruł psa sąsiadów."
        ru: "Кто-то отравил собаку соседей."
        source: { kind: authored }
      - pl: "Fabryka otruła rzekę."
        ru: "Фабрика отравила реку."
        source: { kind: authored }
  - id: get-poisoned
    ru: "с SIĘ — отравиться"
    examples:
      - pl: "Otruł się grzybami."
        ru: "Он отравился грибами."
        source: { kind: authored }
      - pl: "Dziecko otruło się lekami babci."
        ru: "Ребёнок отравился бабушкиными лекарствами."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "OTRUĆ — «отравить», как в русском. Но бытовое «отравиться едой» поляки чаще говорят ZATRUĆ SIĘ: ZATRUŁEM SIĘ RYBĄ. OTRUĆ SIĘ звучит тяжелее — о серьёзном или смертельном отравлении. «Отрава» — TRUCIZNA, крысиная — TRUTKA." }
  - { kind: usage, text: "Пятьдесят три формы. Страдательное OTRUTY — «отравленный», OTRUCI — о людях. Спряжение: OTRUJĘ, OTRUJESZ, повелительное OTRUJ. Несовершенный вид — TRUĆ." }
  - { kind: government, text: "Кого или что — винительный: OTRUĆ SZCZURY. Чем — творительный: OTRUĆ ARSZENIKIEM, OTRUĆ SIĘ GRZYBAMI. Ради чего — DLA с родительным: OTRUĆ DLA SPADKU." }
  - { kind: pronunciation, text: "Читается «о́труць», ударение на первом слоге. OTRUJĘ — «отру́е», OTRUŁ — «о́труу»: Ł — «у»." }
  - { kind: register, text: "Нейтральное слово, частое в детективах и криминальной хронике. TRUĆ KOMUŚ без приставки — разговорное «ныть, доставать»: NIE TRUJ MI!" }
collocations:
  - { pl: "otruć szczury", ru: "отравить крыс" }
  - { pl: "otruć się grzybami", ru: "отравиться грибами" }
  - { pl: "otruć arszenikiem", ru: "отравить мышьяком" }
family:
  - { pl: "trucizna", ru: "яд, отрава", relation: derived, id: trucizna }
  - { pl: "truć", ru: "травить; разг. ныть", relation: root }
  - { pl: "zatruć", ru: "отравить, заразить ядом", relation: derived, id: zatruc }
etymology: "Приставка O- плюс TRUĆ «травить», праславянское *truti «изнурять, травить». Русское «отрава», «травить» — от другого корня, от слова «трава»."
memory: "Otruć — отравить: ktoś otruł psa. Otruć się grzybami — отравиться грибами. Trucizna — яд. Читается «о́труць»."
idioms:
  - { pl: "truć komuś", ru: "ныть, доставать кого-то, капать на мозги" }
