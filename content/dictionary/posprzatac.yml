# review
id: posprzatac
format: 2
lemma: "posprzątać"
rank: 2491
pos: verb
pron: { cyr: "поспшо́нтаць" }
senses:
  - id: tidy-up
    ru: "убрать, навести порядок"
    examples:
      - pl: "Posprzątam po obiedzie."
        ru: "Я уберу после обеда."
        source: { kind: authored }
      - pl: "Posprzątała całe mieszkanie."
        ru: "Она убрала всю квартиру."
        source: { kind: authored }
  - id: clear-away
    ru: "убрать (со стола, после гостей)"
    examples:
      - pl: "Posprzątaj ze stołu."
        ru: "Убери со стола."
        source: { kind: authored }
      - pl: "Po gościach posprzątali do północy."
        ru: "После гостей они убрали до полуночи."
        source: { kind: authored }
  - id: result
    ru: "убранный (о результате)"
    examples:
      - pl: "Posprzątane mieszkanie wyglądało obco."
        ru: "Убранная квартира выглядела непривычно."
        source: { kind: authored }
notes:
  - { kind: usage, text: "У СОВЕРШЕННОГО ВИДА НЕТ НАСТОЯЩЕГО ВРЕМЕНИ, И ЭТО ГЛАВНОЕ ЗДЕСЬ. POSPRZĄTAM значит «я УБЕРУ», а не «я убираю»; posprząta — «он уберёт». Формы выглядят как настоящее время, но означают будущее — ровно как русское «уберу» против «убираю». Настоящее даёт только несовершенный SPRZĄTAM «убираю»." }
  - { kind: usage, text: "Вид видно и по нефинитным формам, и тут всё зеркально по отношению к sprzątać. У posprzątać есть POSPRZĄTAWSZY «убрав», деепричастие прошедшего, а форм на -ąc и -ący нет совсем. У sprzątać наоборот: есть sprzątając и sprzątający, а -wszy отсутствует." }
  - { kind: false-friend, text: "Приставка po- здесь не значит «немного», как в poczytać «почитать». Она чистый показатель вида и даёт завершённость: posprzątać — убрать до конца, с результатом. Русский строит эту пару иначе, через смену корня: «убирать» и «убрать», так что соответствия приставок искать не стоит." }
collocations:
  - { pl: "posprzątać mieszkanie", ru: "убрать квартиру" }
  - { pl: "posprzątać po sobie", ru: "убрать за собой" }
  - { pl: "posprzątane mieszkanie", ru: "убранная квартира" }
family:
  - { pl: "sprzątać", ru: "убирать (несов.)", relation: aspect }
  - { pl: "porządek", ru: "порядок", relation: root, id: porzadek }
  - { pl: "bałagan", ru: "беспорядок", relation: antonym, id: balagan }
etymology: "Приставка po- и sprzątać, из праславянского *prętati «прибирать, укладывать» — того же корня, что русские «прятать» и «опрятный». Po- здесь чистый видовой показатель завершённости. Русская совершенная пара к «убирать» строится без приставки, через «убрать»."
memory: "posprzątać — «убрать», совершенный вид. Запомни главное: posprzątam значит «уберу», будущее, потому что у совершенного вида настоящего нет. И формы зеркальны: есть posprzątawszy, нет posprzątając."
idioms:
  - { pl: "posprzątać po kimś", ru: "убрать за кем-л." }
  - { pl: "posprzątać na gwałt", ru: "убрать наскоро" }
formExamplesSkip:
  - { form: "posprzątani", reason: "Мужско-личная форма страдательного причастия образуется по общему правилу, но глагол управляет названиями помещений и предметов, а не лиц: убирают комнату, двор, со стола, но не человека. Подлежащего, с которым эта форма могла бы согласоваться, в языке не возникает." }
