# review
id: miejsce
format: 2
lemma: "miejsce"
rank: 117
pos: noun
pron: { cyr: "ме́йсце" }
senses:
  - id: space
    ru: "место, пространство (сколько есть места)"
    examples:
      - pl: "Nie ma tutaj miejsca."
        ru: "Здесь нет места."
        source: { kind: tatoeba, id: 4716850 }
      - pl: "Stół nie zajmuje dużo miejsca."
        ru: "Стол не занимает много места."
        source: { kind: tatoeba, id: 3850101 }
      - pl: "Zostaw miejsce pomiędzy liniami."
        ru: "Оставь место между линиями."
        source: { kind: tatoeba, id: 1353789 }
  - id: seat
    ru: "место (сиденье, позиция, точка)"
    examples:
      - pl: "Czy to miejsce jest zajęte?"
        ru: "Это место занято?"
        source: { kind: tatoeba, id: 6328194 }
      - pl: "Proszę, zajmij swoje miejsce."
        ru: "Пожалуйста, займи своё место."
        source: { kind: tatoeba, id: 6014694 }
      - pl: "Zarezerwuj miejsce zawczasu."
        ru: "Забронируй место заранее."
        source: { kind: tatoeba, id: 652772 }
notes:
  - { kind: usage, text: "mieć miejsce — «иметь место, происходить»: Wypadek miał miejsce wczoraj." }
  - { kind: usage, text: "na miejscu — «на месте»; z miejsca — «сразу, с ходу»: Zgodził się z miejsca." }
  - { kind: usage, text: "Средний род: to miejsce, te miejsca. В родительном множественном — miejsc, без окончания." }
collocations:
  - { pl: "mieć miejsce", ru: "происходить" }
  - { pl: "miejsce pracy", ru: "место работы" }
  - { pl: "wolne miejsce", ru: "свободное место" }
  - { pl: "na miejscu", ru: "на месте" }
etymology: "Праславянское *město с уменьшительным суффиксом; то же слово, что русское «место»."
memory: "Средний род: to miejsce, te miejsca, а родительный множественного — короткое miejsc. Две связки на каждый день: mieć miejsce «происходить» и z miejsca «сразу»."
idioms:
  - { pl: "mieć miejsce", ru: "иметь место, происходить" }
  - { pl: "z miejsca", ru: "сразу, с ходу" }
  - { pl: "miejsce pamięci", ru: "мемориал" }
