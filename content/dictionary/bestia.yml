  - { pl: "piękna i bestia", ru: "красавица и чудовище" }
etymology: "Из латинского bestia «зверь». Русская «бестия» — то же заимствование, но в русском оно сохранило только переносное, бранное значение."
memory: "bestia — «зверь, чудовище», слово книжное. В переносном смысле — «бестия»: cwana bestia «хитрая бестия»."
