senses:
  - id: beast
    ru: "зверь, чудовище"
    examples:
      - pl: "Bestia zaczęła go atakować."
        ru: "Зверь начал на него нападать."
        source: { kind: translated, id: 12054989 }
      - pl: "Jestem bestią."
        ru: "Я зверь."
        source: { kind: translated, id: 6598833 }
      - pl: "Ta bestia nie boi się ludzi."
        ru: "Этот зверь не боится людей."
        source: { kind: authored }
      - pl: "W lesie grasowała jakaś bestia."
        ru: "В лесу рыскал какой-то зверь."
        source: { kind: authored }
      - pl: "Bestia zniknęła w ciemności."
        ru: "Зверь исчез в темноте."
        source: { kind: authored }
      - pl: "Opowieść o pięknej i bestii znają wszyscy."
        ru: "Сказку о красавице и чудовище знают все."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Второе значение — бранное «бестия, негодяй» о человеке, как и в русском: cwana bestia «хитрая бестия»." }
  - { kind: usage, text: "Рядом с карточками zwierzę «животное» и potwór «чудовище»: zwierzę нейтрально, bestia и potwór подчёркивают опасность." }
  - { kind: usage, text: "Слово книжное и встречается в сказках и переносных оборотах, а не в бытовой речи." }
collocations:
