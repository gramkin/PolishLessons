# review
id: mozliwy
format: 2
lemma: "możliwy"
rank: 462
pos: adj
pron: { cyr: "можли́вы" }
senses:
  - id: possible
    ru: "возможный"
    examples:
      - pl: "Czy inny świat jest możliwy?"
        ru: "Возможен ли другой мир?"
        source: { kind: translated, id: 10470325 }
      - pl: "Porażka jest możliwa."
        ru: "Поражение возможно."
        source: { kind: translated, id: 4156270 }
      - pl: "Czy możliwy jest odbiór osobisty?"
        ru: "Возможен ли личный приём?"
        source: { kind: translated, id: 3799097 }
  - id: impersonal
    ru: "możliwe — возможно (безлично)"
    note: "Средний род работает самостоятельно, как русское «возможно»."
    examples:
      - pl: "Całkiem możliwe."
        ru: "Вполне возможно."
        source: { kind: tatoeba, id: 5508378 }
      - pl: "Jak to możliwe?"
        ru: "Как это возможно?"
        source: { kind: tatoeba, id: 2145934 }
      - pl: "Jak to jest możliwe?"
        ru: "Как это возможно?"
        source: { kind: tatoeba, id: 3433060 }
  - id: able-to-be
    ru: "możliwy DO czegoś — поддающийся, такой, что можно"
    note: "Русский передаёт это суффиксом -им-/-ем-."
    examples:
      - pl: "Jesteś możliwy do zastąpienia."
        ru: "Ты заменим."
        source: { kind: translated, id: 5665363 }
      - pl: "W Polsce ,,6\" to najlepsza możliwa do zdobycia ocena w szkole."
        ru: "В Польше \"6\" - лучшая оценка, которую можно получить в школе."
        source: { kind: tatoeba, id: 10831979 }
      - pl: "Zero absolutne jest najniższą możliwą temperaturą."
        ru: "Абсолютный ноль — самая низкая возможная температура."
        source: { kind: translated, id: 2379978 }
notes:
  - { kind: usage, text: "Средний род możliwe живёт самостоятельной жизнью как безличное «возможно»: Jak to możliwe? «Как это возможно?», Całkiem możliwe «Вполне возможно». Именно поэтому możliwe так часто встречается отдельно, хотя собственной леммой не является — это форма вот этого прилагательного." }
  - { kind: government, text: "Оборот możliwy DO czegoś значит «поддающийся, такой, что его можно»: możliwy do zastąpienia «заменимый», ocena możliwa do zdobycia «оценка, которую можно получить». Русский передаёт это суффиксом -им-/-ем-." }
  - { kind: usage, text: "Степеней сравнения у слова нет: что-то либо возможно, либо нет. Вместо «более возможный» говорят bardziej prawdopodobny «более вероятный»." }
  - { kind: usage, text: "Наречие — możliwie «по возможности» (możliwie szybko), существительное — możliwość «возможность» (w miarę możliwości «по мере возможности»)." }
collocations:
  - { pl: "Jak to możliwe?", ru: "Как это возможно?" }
  - { pl: "możliwy do zastąpienia", ru: "заменимый" }
  - { pl: "w miarę możliwości", ru: "по мере возможности" }
  - { pl: "możliwie szybko", ru: "по возможности быстро" }
family:
  - { pl: "móc", ru: "мочь", relation: root }
  - { pl: "możliwość", ru: "возможность", relation: derived }
  - { pl: "możliwie", ru: "по возможности", relation: derived }
  - { pl: "niemożliwy", ru: "невозможный", relation: derived }
etymology: "От móc «мочь», праславянское *mogti — то же слово, что русское «мочь». możliwy построено как русское «возможный»: корень «мочь» плюс суффикс."
memory: "możliwy — «возможный», от móc «мочь», ровно как русское «возможный» от «мочь». Запомнить стоит две вещи. Первая: средний род możliwe живёт самостоятельно как безличное «возможно» — Jak to możliwe?, Całkiem możliwe. Вторая: оборот możliwy DO czegoś передаёт русский суффикс -им-: możliwy do zastąpienia «заменимый». Степеней сравнения у слова нет — возможное не бывает «более возможным»."
idioms:
  - { pl: "Jak to możliwe?", ru: "Как это возможно?" }
  - { pl: "możliwy do zastąpienia", ru: "заменимый" }
  - { pl: "w miarę możliwości", ru: "по мере возможности" }
