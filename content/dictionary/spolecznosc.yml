etymology: "От SPOŁECZNY «общественный», а то — от SPÓŁ «вместе», из праславянского гнезда, которое дало и WSPÓLNY «общий», и SPÓŁKA «товарищество». Суффикс -ość отвечает русскому -ость. Русская «общественность» собрана точно так же, но от другого корня — от «общего», — поэтому слова узнаются не по корню, а по устройству: прилагательное плюс суффикс отвлечённости."
memory: "Шесть форм, как у osobowość: społeczności за восемь падежных мест. Весь разряд на -ość склоняется так же. И не путать со społeczeństwo «общество в целом»."
