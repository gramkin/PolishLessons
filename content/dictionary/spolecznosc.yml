notes:
  - { kind: usage, text: "Форм шесть, и расклад тот же, что у OSOBOWOŚĆ из партии 231: одна форма SPOŁECZNOŚCI делает восемь работ — родительный, дательный, местный и звательный единственного плюс именительный, винительный, родительный и звательный множественного. Это третье слово на -OŚĆ в словаре, и теперь правило можно считать твёрдым: все отвлечённые существительные женского рода на -ość склоняются одинаково и всегда в шесть форм. Их в языке сотни — wolność, miłość, możliwość, ciekawość, — и выучить надо один образец." }
  - { kind: usage, text: "Суффиксу -OŚĆ отвечает русское -ость или -ность, и соответствие почти механическое: wolność — «вольность», możliwość — «возможность», wilgotność — «влажность». Само SPOŁECZNOŚĆ собрано как русская «общественность» — от прилагательного со значением «общий» плюс суффикс отвлечённости, — только корни у прилагательных разные: польское SPOŁECZNY идёт от SPÓŁ «вместе», того же гнезда, что WSPÓLNY «общий», а русское «общественный» от «общего»." }
  - { kind: usage, text: "Польский различает два слова там, где русский часто обходится одним. SPOŁECZNOŚĆ — это конкретная общность людей: społeczność lokalna «местное сообщество», społeczność akademicka, społeczność międzynarodowa. А общество как целое, как устройство страны, называется SPOŁECZEŃSTWO. Сказать społeczeństwo lokalne нельзя, как и społeczność polska в значении «польское общество». Разница примерно та же, что между русскими «сообществом» и «обществом»." }
