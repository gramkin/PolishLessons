notes:
  - { kind: false-friend, text: "Русское «оценить» делает две работы сразу: определить стоимость и признать достоинство. Польский их разделил. OCENIAĆ и OCENIĆ значат «оценивать» холодно — измерить, определить величину, поставить отметку, вынести суждение. А «оценить по достоинству, быть благодарным» — это другой глагол, DOCENIĆ: DOCENIAM TWOJĄ POMOC «я ценю твою помощь». Разница слышна: OCENIAM TWOJĄ POMOC прозвучит как «я выношу оценку твоей помощи», то есть холодно и свысока, и вместо благодарности получится экспертиза. Отсюда правило: о стоимости и отметках OCENIAĆ, о благодарности DOCENIAĆ." }
  - { kind: usage, text: "Несовершенный вид, переходный, шестьдесят три формы: сорок две от глагола, десять от действительного причастия OCENIAJĄCY, одиннадцать от страдательного OCENIANY. Совершенная пара — OCENIĆ. Существительное OCENA значит и «оценка» вообще, и школьную отметку: DOSTAĆ DOBRĄ OCENĘ «получить хорошую отметку», и в этом значении оно встречается чаще всего. Отглагольное OCENIANIE — это процесс выставления оценок, и в школьных документах оно термин: OCENIANIE KSZTAŁTUJĄCE «формирующее оценивание». Приставочные дают отдельные слова: DOCENIĆ «оценить по достоинству», NIEDOCENIAĆ «недооценивать», PRZECENIAĆ «переоценивать»." }
  - { kind: government, text: "Переходный: оценивать что — винительный без предлога, OCENIAĆ SZKODY, OCENIAĆ PRACĘ, OCENIAĆ SYTUACJĘ. Во сколько — предлог NA с винительным: OCENIAM STRATY NA DWA TYSIĄCE «оцениваю убытки в две тысячи», и здесь русский предлог «в» отвечает польскому NA, что стоит запомнить отдельно. По чему судить — предлог PO с местным: OCENIAĆ PO UBRANIU, OCENIAĆ PO PIERWSZYM WRAŻENIU, как русское «судить по одежде». Отрицание требует родительного: NIE OCENIAM TEGO. Возвратное OCENIAĆ SIĘ значит «оцениваться» и в школьном языке «оценивать себя»." }
  - { kind: pronunciation, text: "Читается «оцэ́няць», три слога, ударение на предпоследнем. Буква C это «ц», и сочетание CE звучит «цэ», твёрдо: не «це». Буквосочетание NI перед гласным даёт мягкое «нь», поэтому NIAĆ звучит «няць». Конечное Ć — мягкое «ць». В формах настоящего времени ударение остаётся предпоследним, но слогов становится больше: OCENIAM это «оце́ням», OCENIAJĄ — «оценя́йон» с носовым на конце. В страдательном причастии OCENIANY четыре слога: «оценя́ны»." }
collocations:
  - { pl: "oceniać sytuację", ru: "оценивать ситуацию" }
  - { pl: "dostać ocenę", ru: "получить отметку" }
  - { pl: "oceniać po ubraniu", ru: "судить по одежде" }
family:
  - { pl: "cena", ru: "цена", relation: root, id: cena }
  - { pl: "ocena", ru: "оценка; отметка", relation: root, id: ocena }
  - { pl: "ocenić", ru: "оценить", relation: aspect }
  - { pl: "docenić", ru: "оценить по достоинству", relation: root }
etymology: "От CENA, из праславянского *cěna, того же слова, что русская «цена», с приставкой O-, означающей охват предмета со всех сторон: оценить значит обойти вещь кругом и назвать ей цену. Русское «оценить» устроено так же, из «о-» и «цены», так что здесь языки совпадают буквально. Разошлись они в дальнейшем развитии. Русский позволил «оценить» значить и благодарное признание, а польский закрепил это за приставкой DO-, получив DOCENIĆ, где DO- добавляет идею доведения до должного уровня. Рядом живут PRZECENIĆ «переоценить» с приставкой PRZE-, отвечающей русскому «пере-», и NIEDOCENIĆ «недооценить» с двойным отрицательным наращением. Весь ряд строится одинаково в обоих языках, кроме одной клетки, и ровно эта клетка — DOCENIĆ — чаще всего остаётся незанятой у русскоязычных."
memory: "Корень cena = «цена», и ocena «оценка» читается сразу. Но главное в карточке — различие, которого нет в русском: oceniać это оценивать холодно (стоимость, отметку, ситуацию), а «ценить, быть благодарным» — это docenić. Doceniam twoją pomoc — «ценю твою помощь»; oceniam twoją pomoc прозвучит как экспертиза. Сумму вводит предлог na с винительным: oceniam straty na dwa tysiące. Судить по чему-то — po с местным: oceniać po ubraniu."
