etymology: "Из праславянского *dymъ, того же корня, что русский «дым», литовское dūmai и латинское fumus — все от индоевропейского *dʰuh₂mós «дым, пар», от глагола со значением «дымиться, клубиться». Родня тут широкая и узнаваемая: латинское fumus дало «парфюм» и «фумигацию», а польское и русское слова не разошлись между собой ни на звук."
memory: "Полное совпадение с русским, вплоть до пословицы: nie ma dymu bez ognia. Родительный dymu, но местный dymie — не как pliku."
