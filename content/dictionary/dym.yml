notes:
  - { kind: usage, text: "Это слово даёт русскому почти бесплатную находку: DYM и «дым» — одно и то же слово, из праславянского *dymъ, без всяких превращений, и даже пословица совпадает дословно — NIE MA DYMU BEZ OGNIA, «нет дыма без огня». Таких полных совпадений немного, и их стоит замечать: там, где польское слово читается как русское без поправок, учить нечего, достаточно запомнить падежные окончания." }
  - { kind: usage, text: "Родительный падеж DYMU с окончанием -u, как у PLIKU из этой же партии, но местный расходится: DYMIE с окончанием -e и смягчением m в mi. У plik местный тоже -u, и потому родительный с местным там слились в одну форму, а здесь они разные — отсюда у dym десять форм, а у plik девять. Одно и то же окончание родительного, разные окончания местного." }
  - { kind: usage, text: "Множественное число у слова живое и означает не «много дыма», а отдельные струи или выбросы: dymy z kominów «дымы из труб», dymy przemysłowe «промышленные дымы». Русский так тоже умеет, но реже, и в разговоре предпочтёт единственное. Отдельно стоит выражение PUŚCIĆ Z DYMEM — «сжечь дотла», буквально «пустить с дымом»; русское «пустить дымом» так не говорится." }
