# review
id: wpierw
format: 2
lemma: "wpierw"
rank: 4905
pos: adv
pron: { cyr: "фперф" }
senses:
  - id: first
    ru: "сперва, сначала"
    examples:
      - pl: "Wpierw przeczytaj instrukcję."
        ru: "Сперва прочитай инструкцию."
        source: { kind: authored }
      - pl: "Musimy wpierw znaleźć mieszkanie."
        ru: "Сначала нам нужно найти квартиру."
        source: { kind: authored }
      - pl: "Zanim zdecydujesz, wpierw się zastanów."
        ru: "Прежде чем решать, сперва подумай."
        source: { kind: authored }
      - pl: "Wpierw przyszedł list, a potem on sam."
        ru: "Сперва пришло письмо, а потом и он сам."
        source: { kind: authored }
      - pl: "Trzeba wpierw zapłacić, a dopiero potem wejść."
        ru: "Сначала нужно заплатить, а уж потом входить."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "WPIERW — «сперва», с тем же корнем, что русское «сперва» и «впервые». В обычной речи чаще говорят NAJPIERW. WPIERW звучит немного книжно или по-старинному." }
  - { kind: usage, text: "Наречие, одна форма. Обычно в паре с A POTEM, «а потом»: WPIERW OBIAD, A POTEM SPACER. Не путать с PO RAZ PIERWSZY, «впервые»." }
  - { kind: government, text: "Наречие ничем не управляет. Стоит перед глаголом или в начале фразы." }
  - { kind: pronunciation, text: "Читается «фперф», один слог. W перед глухим P оглушается в «ф», конечное W — тоже «ф». IE — «е»." }
  - { kind: register, text: "Слово книжное и немного старомодное; в живой речи его вытеснило NAJPIERW." }
collocations:
  - { pl: "wpierw zjedz", ru: "сперва поешь" }
  - { pl: "wpierw pomyśl", ru: "сначала подумай" }
  - { pl: "wpierw musisz", ru: "сначала тебе нужно" }
family:
  - { pl: "pierwszy", ru: "первый", relation: root, id: pierwszy }
  - { pl: "najpierw", ru: "сначала", relation: root, id: najpierw }
  - { pl: "pierwotny", ru: "первоначальный", relation: root }
etymology: "W + старое PIERW «сперва», от корня PIERW- «первый». Русские «сперва», «впервые», «первый» — тот же корень."
memory: "Wpierw — сперва (= najpierw): wpierw zjedz, potem deser. Читается «фперф». Pierwszy — первый."
idioms:
  - { pl: "pierwsze koty za płoty", ru: "первый блин комом" }
formExamples:
  - form: "wpierw"
    pl: "Wpierw zjedz obiad, potem deser."
    ru: "Сперва съешь обед, потом десерт."
    source: { kind: authored }
  - form: "wpierw"
    pl: "Musisz wpierw zapytać ojca."
    ru: "Сначала тебе нужно спросить отца."
    source: { kind: authored }
  - form: "wpierw"
    pl: "Pomyśl wpierw, a potem mów."
    ru: "Сперва подумай, а потом говори."
    source: { kind: authored }
