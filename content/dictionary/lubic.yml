# review
id: lubic
format: 2
lemma: "lubić"
rank: 123
pos: verb
aspect: imperf
pron: { cyr: "лю́биць" }
senses:
  - id: like-things
    ru: "любить, нравиться (о вкусах и занятиях)"
    note: "Русское «я люблю мороженое» — это Lubię lody: lubić значит «нравиться», а не глубокое чувство."
    examples:
      - pl: "Lubię psy."
        ru: "Я люблю собак."
        source: { kind: tatoeba, id: 352922 }
      - pl: "Lubię czytać."
        ru: "Я люблю читать."
        source: { kind: tatoeba, id: 599052 }
      - pl: "Lubisz śnieg?"
        ru: "Ты любишь снег?"
        source: { kind: tatoeba, id: 742422 }
  - id: like-people
    ru: "нравиться, быть симпатичным (о людях)"
    examples:
      - pl: "Lubię twoją siostrę."
        ru: "Мне нравится твоя сестра."
        source: { kind: authored }
      - pl: "Wszyscy ją lubią."
        ru: "Она всем нравится."
        source: { kind: authored }
      - pl: "Nie lubię go."
        ru: "Он мне не нравится."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "lubić — «нравиться», kochać — «любить». Kocham cię говорят близкому человеку, а Lubię cię значит «ты мне симпатичен»." }
  - { kind: government, text: "lubić требует винительного падежа, как русское «любить что-то»: Lubię muzykę. С инфинитивом — Lubię czytać «Люблю читать»." }
  - { kind: usage, text: "Страдательное причастие lubiany значит «любимый всеми, популярный»: Tom jest lubiany «Тома любят»." }
collocations:
  - { pl: "lubić kogoś", ru: "симпатизировать кому-то" }
  - { pl: "lubię czytać", ru: "люблю читать" }
  - { pl: "nie lubię", ru: "я не люблю" }
  - { pl: "co kto lubi", ru: "кому что нравится" }
etymology: "Праславянское *ľubiti — то же слово, что русское «любить»; родственны также lubo и польское luby «милый»."
memory: "Ловушка: lubić — это «нравиться», а «любить» — kochać. Lubię lody «Я люблю мороженое», но Kocham cię «Я тебя люблю». А lubiany значит «любимый всеми, популярный»."
idioms:
  - { pl: "co kto lubi", ru: "кому что нравится" }
  - { pl: "nie lubić się", ru: "недолюбливать друг друга" }
  - { pl: "lubić jak psy dziada w ciasnej ulicy", ru: "любить как собака палку" }
