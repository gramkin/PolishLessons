# review
id: dokad
format: 2
lemma: "dokąd"
rank: 504
pos: adv
pron: { cyr: "до́конт" }
senses:
  - id: where-to
    ru: "куда"
    examples:
      - pl: "Dokąd ona poszła?"
        ru: "Куда она пошла?"
        source: { kind: tatoeba, id: 6154742 }
      - pl: "Dokąd kursuje tramwaj trójka?"
        ru: "Куда идёт трамвай номер три?"
        source: { kind: tatoeba, id: 10138176 }
      - pl: "Tom nie powiedział mi, dokąd idzie."
        ru: "Том не сказал мне, куда идёт."
        source: { kind: tatoeba, id: 3579334 }
  - id: indirect
    ru: "куда (в косвенном вопросе)"
    examples:
      - pl: "Zapytałem, dokąd iść."
        ru: "Я спросил, куда идти."
        source: { kind: tatoeba, id: 722382 }
      - pl: "Powiedział mi, dokąd pójść."
        ru: "Он сказал мне, куда идти."
        source: { kind: tatoeba, id: 2147210 }
      - pl: "Nie wiem, dokąd iść."
        ru: "Я не знаю, куда идти."
        source: { kind: authored }
notes:
  - { kind: usage, text: "dokąd спрашивает о направлении и составляет пару с gdzie «где»: Gdzie jesteś? «Где ты?», но Dokąd idziesz? «Куда ты идёшь?»" }
  - { kind: usage, text: "В разговорной речи dokąd часто вытесняется формой gdzie: Gdzie idziesz? слышно постоянно, хотя строго это «где»." }
  - { kind: usage, text: "Слово собрано из do + kąd; русское «куда» того же корня." }
  - { kind: usage, text: "Есть и временное значение «пока»: dokąd żyję «пока я жив», но для этого чаще берут dopóki." }
collocations:
  - { pl: "dokąd idziesz?", ru: "куда ты идёшь?" }
  - { pl: "nie wiem dokąd", ru: "не знаю куда" }
  - { pl: "dokąd dalej?", ru: "куда дальше?" }
etymology: "Из do + kąd, праславянское *kǫdě. Русское «куда» — то же самое слово."
memory: "dokąd — «куда», вопрос о направлении и пара к gdzie «где». Внутри kąd, родня русскому «куда». В разговоре вместо dokąd часто говорят просто gdzie."
idioms:
  - { pl: "dokąd idziesz?", ru: "куда ты идёшь?" }
  - { pl: "nie wiem dokąd", ru: "не знаю куда" }
  - { pl: "dokąd oczy poniosą", ru: "куда глаза глядят" }
