# review
id: zupelnie
format: 2
lemma: "zupełnie"
rank: 704
pos: adv
pron: { cyr: "зупэ́уне" }
senses:
  - id: completely
    ru: "совершенно, совсем, полностью"
    examples:
      - pl: "Była zupełnie naga."
        ru: "Она была совершенно обнажена."
        source: { kind: tatoeba, id: 2309763 }
      - pl: "On pisze zupełnie nieczytelnie."
        ru: "Он пишет совершенно неразборчиво."
        source: { kind: tatoeba, id: 350113 }
      - pl: "Wydaje się to zupełnie niemożliwe."
        ru: "Это кажется совершенно невозможным."
        source: { kind: tatoeba, id: 10115730 }
  - id: not-at-all
    ru: "совсем не (с отрицанием)"
    examples:
      - pl: "On zupełnie nie ogląda telewizji."
        ru: "Он совсем не смотрит телевизор."
        source: { kind: tatoeba, id: 1080671 }
      - pl: "On zupełnie nie boi się węży."
        ru: "Он совсем не боится змей."
        source: { kind: tatoeba, id: 363822 }
      - pl: "Udawałem, że ta wiadomość jest mi zupełnie obojętna."
        ru: "Я делал вид, что эта новость мне совершенно безразлична."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Внутри сидит pełny «полный»: zupełny значит «полный, совершенный». Русское «вполне» построено от того же образа полноты." }
  - { kind: usage, text: "zupełnie nie — «совсем не»: On zupełnie nie ogląda telewizji «Он совсем не смотрит телевизор»." }
  - { kind: usage, text: "Синонимы całkiem, kompletnie, całkowicie. całkiem вдобавок умеет смягчать («довольно»), а zupełnie только усиливает." }
  - { kind: usage, text: "Превосходная степень najzupełniej звучит книжно и означает «совершенно, в полной мере»." }
collocations:
  - { pl: "zupełnie nie", ru: "совсем не" }
  - { pl: "zupełnie inny", ru: "совершенно другой" }
  - { pl: "zupełnie sam", ru: "совсем один" }
  - { pl: "najzupełniej", ru: "совершенно" }
etymology: "Наречие от zupełny «полный, совершенный», внутри которого pełny «полный». Русское «вполне» построено от того же образа полноты."
memory: "zupełnie — «совершенно, совсем», от zupełny «полный», а внутри pełny «полный», как русское «вполне» от «полного». Запомните частое zupełnie nie «совсем не». В отличие от całkiem, это слово только усиливает и никогда не смягчает."
idioms:
  - { pl: "zupełnie nie", ru: "совсем не" }
  - { pl: "zupełnie inny", ru: "совершенно другой" }
  - { pl: "najzupełniej", ru: "совершенно" }
