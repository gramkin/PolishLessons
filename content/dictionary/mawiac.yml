# review
id: mawiac
format: 2
lemma: "mawiać"
rank: 3985
pos: verb
pron: { cyr: "ма́вяць" }
senses:
  - id: used-to-say
    ru: "говаривать, иметь обыкновение говорить"
    examples:
      - pl: "Jak mawiał mój dziadek, cierpliwość popłaca."
        ru: "Как говаривал мой дед, терпение окупается."
        source: { kind: authored }
      - pl: "Mama często mawiała, że czas leczy rany."
        ru: "Мама часто говорила, что время лечит раны."
        source: { kind: authored }
      - pl: "Jak to mawiają, co nagle, to po diable."
        ru: "Как говорится, поспешишь — людей насмешишь."
        source: { kind: authored }
  - id: as-they-say
    ru: "JAK MAWIAJĄ — как говорят, как говорится"
    examples:
      - pl: "Jak mawiają Anglicy, czas to pieniądz."
        ru: "Как говорят англичане, время — деньги."
        source: { kind: authored }
      - pl: "Jak się mawia, nie ma tego złego, co by na dobre nie wyszło."
        ru: "Как говорится, нет худа без добра."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "MAWIAĆ — «говаривать», многократный глагол от MÓWIĆ. Русское «говаривать» звучит старомодно, а польское MAWIAĆ живое: его постоянно слышишь в оборотах JAK MAWIAŁ, JAK MAWIAJĄ. Это не «махать» (MACHAĆ)." }
  - { kind: usage, text: "Многократный глагол: говорит о привычке, а не о единичном высказывании. Живые формы — настоящее (JAK MAWIAJĄ) и прошедшее (JAK MAWIAŁ OJCIEC). Условное наклонение, повелительное, причастия и отглагольное существительное не употребляются и в карточку не включены." }
  - { kind: government, text: "Что — придаточное с ŻE или прямая речь: MAWIAŁ, ŻE CZAS TO PIENIĄDZ. Кому — дательный: MAWIAŁ NAM. Безлично — JAK SIĘ MAWIA «как говорится»." }
  - { kind: pronunciation, text: "Читается «ма́вяць»: WIA — «вя», ударение на первом слоге. MAWIAŁ — «ма́вяу»." }
  - { kind: register, text: "Нейтрально-разговорное слово, особенно в пересказе чужих слов и пословиц. Чуть тёплое и ностальгическое: так вспоминают родителей и учителей." }
collocations:
  - { pl: "jak mawiał mój ojciec", ru: "как говаривал мой отец" }
  - { pl: "jak mawiają", ru: "как говорят" }
  - { pl: "jak się mawia", ru: "как говорится" }
family:
