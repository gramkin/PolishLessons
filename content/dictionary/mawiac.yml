etymology: "Многократное образование от MÓWIĆ «говорить» с чередованием Ó → A, как в BYWAĆ от BYĆ или JADAĆ от JEŚĆ. Русские «говаривать», «бывать», «едать» — та же модель."
memory: "Mawiać — говаривать: jak mawiał dziadek. Многократный глагол от mówić, как bywać от być."
idioms:
