# review
id: wszelaki
format: 2
lemma: "wszelaki"
rank: 5771
pos: adj
pron: { cyr: "вшеля́ки" }
senses:
  - id: every-kind
    ru: "всякий, разный, всевозможный"
    examples:
      - pl: "Sklep oferuje wszelakie towary."
        ru: "Магазин предлагает всевозможные товары."
        source: { kind: authored }
      - pl: "Spotkał tam ludzi wszelakiego pokroju."
        ru: "Он встретил там людей всякого рода."
        source: { kind: authored }
      - pl: "Wszelaki sprzęt można wypożyczyć na miejscu."
        ru: "Всякое снаряжение можно взять напрокат на месте."
        source: { kind: authored }
  - id: all-manner
    ru: "всяческий (в книжном, усиленном смысле)"
    examples:
      - pl: "Zebrali wszelaką pomoc, jaką się dało."
        ru: "Они собрали всяческую помощь, какую смогли."
        source: { kind: authored }
      - pl: "Wszelaka nadzieja wydawała się stracona."
        ru: "Всякая надежда казалась потерянной."
        source: { kind: authored }
notes:
  - { kind: government, text: "Местоименное прилагательное: wszelaki, wszelaka, wszelakie. Степеней не имеет — это количественное определение, а не признак." }
  - { kind: usage, text: "Книжный и выразительный вариант слова wszelki «всякий»; в обиходе чаще говорят wszelki или różny." }
  - { kind: usage, text: "Часто в устойчивых оборотах: wszelakiego rodzaju «всякого рода», wszelaką ceną «любой ценой»." }
  - { kind: false-friend, text: "Ближайшее русское соответствие — «всякий, всяческий». Польское wszelaki звучит книжнее, чем нейтральное wszelki." }
collocations:
  - { pl: "wszelakiego rodzaju", ru: "всякого рода" }
  - { pl: "wszelakie towary", ru: "всевозможные товары" }
  - { pl: "wszelaka pomoc", ru: "всяческая помощь" }
family:
