etymology: "Расширенный вариант местоименного прилагательного wszelki «всякий» с суффиксом -aki. Русское «всякий» — ближайшее соответствие, но польское wszelaki книжнее и выразительнее."
memory: "wszelaki — «всякий, всевозможный», книжный вариант слова wszelki. Степеней не имеет: это количество, а не качество."
idioms:
