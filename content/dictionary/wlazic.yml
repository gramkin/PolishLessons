# review
id: wlazic
format: 2
lemma: "włazić"
rank: 3441
pos: verb
pron: { cyr: "вуа́зиць" }
senses:
  - id: climb-in
    ru: "залезать, влезать (разг.)"
    examples:
      - pl: "Kot włazi na szafę."
        ru: "Кот залезает на шкаф."
        source: { kind: authored }
      - pl: "Dzieci włażą na drzewa."
        ru: "Дети лазают по деревьям."
        source: { kind: authored }
      - pl: "Właź do samochodu, jedziemy!"
        ru: "Залезай в машину, поехали!"
        source: { kind: authored }
  - id: intrude
    ru: "лезть, вторгаться (куда не просят)"
    examples:
      - pl: "Nie właź mi w drogę."
        ru: "Не лезь мне под ноги."
        source: { kind: authored }
      - pl: "Wszędzie włazi bez pukania."
        ru: "Он везде вваливается без стука."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "WŁAZIĆ — разговорное «лезть, залезать», а не нейтральное «входить» (WCHODZIĆ). Совпадает с русским «влезать», включая переносное: WŁAZIĆ KOMUŚ W DROGĘ «лезть под ноги», WŁAZIĆ Z BUTAMI W CZYJEŚ ŻYCIE «бесцеремонно лезть в чужую жизнь». Люк — WŁAZ." }
  - { kind: usage, text: "Несовершенный вид; совершенный — WLEŹĆ. Спряжение: WŁAŻĘ, WŁAZISZ, WŁAŻĄ — Z чередуется с Ż в первом лице и третьем множественного. Повелительное — WŁAŹ! Безличное WŁAŻONO в карточку не включено." }
  - { kind: government, text: "Куда внутрь — DO с родительным: WŁAZIĆ DO SZAFY. Куда наверх — NA с винительным: WŁAZIĆ NA DACH. Под что — POD с винительным: WŁAZIĆ POD ŁÓŻKO. Кому куда — дательный: WŁAZIĆ KOMUŚ W PARADĘ «мешать»." }
  - { kind: pronunciation, text: "Читается «вуа́зиць»: Ł — «у», ZI — мягкое «зи». Ударение на предпоследнем слоге. WŁAŻĘ — «вуа́жэ», WŁAŹ — «вуась»." }
  - { kind: register, text: "Разговорное, чуть грубоватое слово. Нейтрально — WCHODZIĆ, WSPINAĆ SIĘ." }
collocations:
  - { pl: "włazić na drzewo", ru: "лазить на дерево" }
  - { pl: "włazić komuś w drogę", ru: "лезть кому-то под ноги" }
  - { pl: "włazić z butami w czyjeś życie", ru: "бесцеремонно лезть в чужую жизнь" }
family:
  - { pl: "wleźć", ru: "влезть", relation: aspect }
  - { pl: "wchodzić", ru: "входить", relation: root, id: wchodzic }
  - { pl: "łazić", ru: "лазить, шататься", relation: root, id: lazic }
etymology: "Приставка W- плюс ŁAZIĆ «ползать, лазить», праславянское *laziti, как русское «лазить», «влезать». Польское Ł отвечает русскому Л."
memory: "Włazić — лезть, залезать: kot włazi na szafę. Właź! — залезай! Włazić komuś w drogę — лезть под ноги."
idioms:
  - { pl: "włazić komuś w paradę", ru: "мешать кому-то, путаться под ногами" }
formExamplesSkip:
