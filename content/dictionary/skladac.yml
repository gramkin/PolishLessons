# review
id: skladac
format: 2
lemma: "składać"
rank: 1713
pos: verb
aspect: imperf
aspectPair: zlozyc
pron: { cyr: "скуа́даць" }
senses:
  - id: consist
    ru: "składać się z — состоять из"
    examples:
      - pl: "Ta opera składa się z pięciu aktów."
        ru: "Эта опера состоит из пяти актов."
        source: { kind: tatoeba, id: 3286167 }
      - pl: "Nasza klasa składa się z 40 chłopców."
        ru: "Наш класс состоит из 40 мальчиков."
        source: { kind: tatoeba, id: 352112 }
      - pl: "Drużyna piłkarska składa się z jedenastu graczy."
        ru: "Футбольная команда состоит из одиннадцати игроков."
        source: { kind: tatoeba, id: 2809318 }
      - pl: "Cząsteczka amoniaku składa się z czterech atomów."
        ru: "Молекула аммиака состоит из четырёх атомов."
        source: { kind: tatoeba, id: 4454606 }
      - pl: "Stany Zjednoczone składają się z 50 stanów."
        ru: "Соединённые Штаты состоят из пятидесяти штатов."
        source: { kind: translated, id: 367741 }
      - pl: "Wszystkie organizmy składają się z komórek."
        ru: "Все организмы состоят из клеток."
        source: { kind: translated, id: 4514863 }
  - id: submit
    ru: "подавать, приносить (заявление, показания, обещание)"
    examples:
      - pl: "Proszę składać aplikacje na piśmie."
        ru: "Подавайте заявления в письменном виде."
        source: { kind: translated, id: 733077 }
      - pl: "Świadkowie muszą składać zeznania pod przysięgą."
        ru: "Свидетели должны давать показания под присягой."
        source: { kind: translated, id: 7334691 }
      - pl: "Składam wypowiedzenie."
        ru: "Я подаю заявление об увольнении."
        source: { kind: translated, id: 8608778 }
  - id: fold
    ru: "складывать, сворачивать; собирать из частей"
    examples:
      - pl: "Składamy flagę po święcie."
        ru: "Мы складываем флаг после праздника."
        source: { kind: translated, id: 13064507 }
      - pl: "Przez ponad tydzień składałem model statku."
        ru: "Больше недели я собирал модель корабля."
        source: { kind: translated, id: 362006 }
      - pl: "Nie składam im koszul."
        ru: "Я не складываю им рубашки."
        source: { kind: translated, id: 13387518 }
notes:
  - { kind: usage, text: "Самое частое употребление — возвратное składać się z czegoś «состоять из чего-либо», с родительным падежом. Именно оно даёт слову его частотность." }
  - { kind: usage, text: "Несовершенный вид к złożyć. О птицах и рептилиях składać jaja значит «откладывать яйца»." }
  - { kind: usage, text: "В канцелярском языке składać wniosek «подавать заявление», składać zeznania «давать показания», składać życzenia «поздравлять»." }
  - { kind: usage, text: "Безличное tak się składa значит «так уж выходит, так совпало»." }
  - { kind: government, text: "Все три значения берут дополнением вещь: składać wniosek, składać krzesło, składać jaja. Человека этот глагол дополнением не принимает, поэтому мужско-личной формы страдательного причастия у него нет." }
collocations:
  - { pl: "składać się z", ru: "состоять из" }
  - { pl: "składać wniosek", ru: "подавать заявление" }
  - { pl: "składać jaja", ru: "откладывать яйца" }
etymology: "Из s- + kładać, многократной формы от kłaść «класть». Русское «складывать» собрано ровно так же, от «класть», поэтому и значения совпадают почти во всём."
memory: "Главное для этого глагола — оборот składać się z czegoś «состоять из чего-либо»: Drużyna składa się z jedenastu graczy. Остальные значения — «складывать» и «подавать заявление»."
idioms:
  - { pl: "składać się z", ru: "состоять из" }
  - { pl: "tak się składa", ru: "так уж выходит" }
  - { pl: "składać życzenia", ru: "поздравлять" }
formExamplesSkip:
  - { form: "składani", reason: "все три значения этой карточки берут дополнением вещь: składać wniosek «подавать заявление», składać krzesło «складывать стул», składać jaja «нести яйца». Человека so składać нельзя, поэтому мужско-личного страдательного причастия глагол здесь не даёт" }
