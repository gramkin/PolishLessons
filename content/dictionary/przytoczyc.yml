notes:
  - { kind: government, text: "Винительный падеж: przytoczyć przykład «привести пример», przytoczyć cytat «привести цитату»." }
  - { kind: false-friend, text: "Корень toczyć «катить», у которого уже есть карточка: привести довод — значит «подкатить» его к разговору. Русское «привести» держит образ ведения, польское — катания." }
  - { kind: usage, text: "Книжное и академическое слово; в разговоре скажут podać przykład." }
  - { kind: usage, text: "Несовершенный вид — przytaczać." }
collocations:
  - { pl: "przytoczyć przykład", ru: "привести пример" }
  - { pl: "przytoczyć cytat", ru: "привести цитату" }
etymology: "przy- + toczyć «катить»: довод как бы подкатывают к разговору. Ср. русское «привести», где образ ведения."
memory: "przytoczyć — «привести» пример или цитату, слово книжное. Корень toczyć «катить». Несовершенный вид — przytaczać."
idioms:
  - { pl: "przytoczyć przykład", ru: "привести пример" }
