# review
id: przytoczyc
format: 2
lemma: "przytoczyć"
rank: 5604
pos: verb
aspect: perf
pron: { cyr: "пшыто́чыць" }
senses:
  - id: cite
    ru: "привести (пример, цитату)"
    examples:
      - pl: "Przytoczę wam jeszcze jeden przykład."
        ru: "Я приведу вам ещё один пример."
        source: { kind: tatoeba, id: 8658854 }
      - pl: "Przytoczę panu jeszcze jeden przykład."
        ru: "Я приведу вам ещё один пример."
        source: { kind: tatoeba, id: 8658856 }
      - pl: "Przytoczę pani jeszcze jeden przykład."
        ru: "Я приведу вам ещё один пример."
        source: { kind: tatoeba, id: 8658859 }
  - id: quote
    ru: "процитировать, сослаться"
    examples:
      - pl: "Przytoczył słowa poety."
        ru: "Он привёл слова поэта."
        source: { kind: authored }
      - pl: "Przytoczono dane z raportu."
        ru: "Привели данные из отчёта."
        source: { kind: authored }
notes:
  - { kind: government, text: "Винительный падеж: przytoczyć przykład «привести пример», przytoczyć cytat «привести цитату»." }
  - { kind: false-friend, text: "Корень toczyć «катить», у которого уже есть карточка: привести довод — значит «подкатить» его к разговору. Русское «привести» держит образ ведения, польское — катания." }
  - { kind: usage, text: "Книжное и академическое слово; в разговоре скажут podać przykład." }
  - { kind: usage, text: "Несовершенный вид — przytaczać." }
collocations:
  - { pl: "przytoczyć przykład", ru: "привести пример" }
  - { pl: "przytoczyć cytat", ru: "привести цитату" }
etymology: "przy- + toczyć «катить»: довод как бы подкатывают к разговору. Ср. русское «привести», где образ ведения."
memory: "przytoczyć — «привести» пример или цитату, слово книжное. Корень toczyć «катить». Несовершенный вид — przytaczać."
idioms:
  - { pl: "przytoczyć przykład", ru: "привести пример" }
formExamplesSkip:
  - { form: "przytoczeni", reason: "страдательное причастие мужского лица, а приводят пример, цитату или данные: примечание к карточке даёт przytoczyć przykład, przytoczyć cytat. Человека не приводят в этом смысле, поэтому формы нет" }
