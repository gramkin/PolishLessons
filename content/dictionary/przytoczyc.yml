        ru: "Я приведу вам ещё один пример."
        source: { kind: tatoeba, id: 8658859 }
  - id: quote
    ru: "процитировать, сослаться"
    examples:
      - pl: "Przytoczył słowa poety."
        ru: "Он привёл слова поэта."
        source: { kind: authored }
      - pl: "Przytoczono dane z raportu."
        ru: "Привели данные из отчёта."
