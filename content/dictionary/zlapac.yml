# review
id: zlapac
format: 2
lemma: "złapać"
rank: 420
pos: verb
aspect: perf
pron: { cyr: "зуа́паць" }
senses:
  - id: catch
    ru: "поймать, схватить"
    examples:
      - pl: "Złapałem mysz."
        ru: "Я поймал мышь."
        source: { kind: tatoeba, id: 5879317 }
      - pl: "Spróbuję złapać tego królika."
        ru: "Я попробую поймать этого кролика."
        source: { kind: tatoeba, id: 7164852 }
      - pl: "On złapał mnie za rękę."
        ru: "Он взял меня за руку."
        source: { kind: tatoeba, id: 3660791 }
  - id: catch-cold
    ru: "подхватить (болезнь); успеть на (транспорт)"
    examples:
      - pl: "Złapałem okropne przeziębienie."
        ru: "Я схватил ужасную простуду."
        source: { kind: tatoeba, id: 624775 }
      - pl: "Dwa dni temu złapałem przeziębienie."
        ru: "Два дня назад я подхватил простуду."
        source: { kind: tatoeba, id: 2250188 }
      - pl: "Pospiesz się, to złapiesz autobus."
        ru: "Поторопись, и успеешь на автобус."
        source: { kind: translated, id: 355491 }
notes:
  - { kind: usage, text: "Совершенный вид к łapać. Основа будущего меняется: złapać, но złapię, złapiesz, złapie." }
  - { kind: usage, text: "Хватают za + винительный, как в русском: złapać kogoś za rękę «схватить кого-то за руку»." }
  - { kind: false-friend, text: "Два употребления надо запомнить отдельно: złapać przeziębienie «подхватить простуду» и złapać autobus «успеть на автобус». Во втором случае по-русски «ловить» не говорят." }
  - { kind: usage, text: "Внутри сидит łapa «лапа»: złapać буквально «взять лапой». Русское «лапа» — то же слово." }
collocations:
  - { pl: "złapać autobus", ru: "успеть на автобус" }
  - { pl: "złapać przeziębienie", ru: "подхватить простуду" }
  - { pl: "złapać za rękę", ru: "схватить за руку" }
  - { pl: "złapać oddech", ru: "перевести дух" }
etymology: "Из z- + łapać, от łapa «лапа» — буквально «взять лапой». Русское «лапа» и «лапать» — то же гнездо."
memory: "złapać — «поймать», и внутри сидит łapa «лапа»: буквально «взять лапой». Основа будущего меняется: złapać, но złapię, złapiesz. Два употребления запомните отдельно: złapać przeziębienie «подхватить простуду» и złapać autobus «успеть на автобус». А поговорка kto ściga dwa zające, nie złapie żadnego — это ровно «за двумя зайцами погонишься»."
idioms:
  - { pl: "złapać na gorącym uczynku", ru: "поймать с поличным" }
  - { pl: "kto ściga dwa zające, nie złapie żadnego", ru: "за двумя зайцами погонишься — ни одного не поймаешь" }
  - { pl: "złapać oddech", ru: "перевести дух" }
