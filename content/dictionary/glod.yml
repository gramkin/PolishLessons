notes:
  - { kind: false-friend, text: "ДВА ЗАКОНА В ОДНОМ СЛОВЕ. Первый — полногласие: польское gło- отвечает русскому «голо-», как в głowa при «голове» и głos при «голосе», поэтому głód это «голод». Второй — чередование o и ó в закрытом слоге: в именительном głód с чертой, но в косвенных падежах głodu, głodem, бо слог открывается. Та же пара, что rósł при rosła и zastanów при zastanowić." }
  - { kind: government, text: "В переносном значении голод бывает ЧЕГО — родительный: głód wiedzy, głód wrażeń, głód sukcesu. Русский в этих случаях чаще скажет «жажда знаний», а не «голод знаний», так что перевод придётся менять. В прямом смысле слово идёт само: czuć głód, umrzeć z głodu." }
  - { kind: usage, text: "Из того же гнезда głodny «голодный», głodować «голодать», zagłodzić «уморить голодом». Обиходное być głodnym — «быть голодным», а разговорное jeść na głodniaka значит «есть на голодный желудок». Устойчиво klęska głodu — «голод» как стихийное бедствие." }
  - { kind: stress, text: "Слово односложное, поэтому ударение падать некуда: «гуут», где ł читается как «у», а ó тоже как «у». В косвенных падежах появляется второй слог и ударение встаёт на него: głodu — «гуо́ду», głodem — «гуо́дэм»." }
collocations:
  - { pl: "umrzeć z głodu", ru: "умереть с голоду" }
  - { pl: "klęska głodu", ru: "голод (бедствие)" }
  - { pl: "głód wiedzy", ru: "жажда знаний" }
family:
  - { pl: "głodny", ru: "голодный", relation: derived, id: glodny }
  - { pl: "głodować", ru: "голодать", relation: derived }
  - { pl: "głowa", ru: "голова", relation: root, id: glowa }
etymology: "Общеславянское слово, то же, что русский «голод». Разница только в полногласии: русский развил «оло», польский обошёлся «ło» — отсюда пары głód/«голод», głowa/«голова», głos/«голос», złoto/«золото». Из того же гнезда głodny, głodować и zagłodzić."
memory: "głód — «голод», и gło- отвечает русскому «голо-» (głowa «голова», głos «голос»). Следите за чертой: głód в именительном, но głodu, głodem — в косвенных, где слог открывается."
idioms:
