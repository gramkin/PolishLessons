  - id: in-shoes
    ru: "w butach — в обуви"
    examples:
      - pl: "On śpi w butach."
        ru: "Он спит в обуви."
        source: { kind: tatoeba, id: 7960505 }
      - pl: "Zwykle chodzę w czarnych butach."
        ru: "Я обычно хожу в чёрных туфлях."
        source: { kind: translated, id: 7105887 }
      - pl: "Chodzą bez butów."
        ru: "Они ходят без обуви."
        source: { kind: translated, id: 723977 }
  - id: idioms
    ru: "głupi jak but, kot w butach"
    examples:
      - pl: "Mam kamień w bucie."
        ru: "У меня камень в ботинке."
        source: { kind: translated, id: 1561259 }
      - pl: "Jest głupi jak but."
        ru: "Он глуп как пробка."
        source: { kind: authored }
      - pl: "Kot w butach to znana bajka."
        ru: "«Кот в сапогах» — известная сказка."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Главное о слове: but в единственном числе — это один ботинок. Обувь вообще поляк называет множественным buty: Kup nowe buty «Купи новую обувь». Русское «обувь» — собирательное единственное, польское buty — множественное." }
  - { kind: usage, text: "Идиомы яркие: głupi jak but — «глуп как пробка», буквально «глуп как ботинок»; kot w butach — «Кот в сапогах»; nie kiwnąć palcem w bucie — «палец о палец не ударить»." }
  - { kind: government, text: "w butach «в обуви» — предложный падеж; bez butów «без обуви» — родительный; zdjąć buty «снять обувь» — винительный." }
  - { kind: usage, text: "Родня: obuwie «обувь» (слово более книжное), obuć «обуть», bucik «ботиночек». Rozmiar buta — «размер обуви»." }
collocations:
  - { pl: "nowe buty", ru: "новая обувь" }
  - { pl: "zdjąć buty", ru: "снять обувь" }
  - { pl: "w butach", ru: "в обуви" }
  - { pl: "rozmiar buta", ru: "размер обуви" }
family:
  - { pl: "obuwie", ru: "обувь", relation: derived }
  - { pl: "obuć", ru: "обуть", relation: root }
  - { pl: "bucik", ru: "ботиночек", relation: derived }
etymology: "Через старочешское bot из старофранцузского bot (ср. французское botte «сапог»); польская форма подстроилась под obuć, obuwie."
memory: "but — это один ботинок, а обувь вообще поляк называет множественным buty: Kup nowe buty «Купи новую обувь». К этому и надо привыкнуть — там, где русский берёт собирательное единственное, польский берёт множественное. А из идиом возьмите głupi jak but: буквально «глуп как ботинок», то есть «глуп как пробка»."
idioms:
  - { pl: "głupi jak but", ru: "глуп как пробка" }
  - { pl: "kot w butach", ru: "кот в сапогах" }
  - { pl: "nie kiwnąć palcem w bucie", ru: "палец о палец не ударить" }
