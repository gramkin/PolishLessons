etymology: "От SZEF, из французского CHEF «глава», восходящего к латинскому caput «голова» — тому же корню, что «капитан» и «капитал». Женскую пару дал польский суффикс -owa, который изначально значил принадлежность: szefowa — «шефова», то есть жена шефа, как krawcowa была женой портного. Со временем суффикс стал делать названия должностей, и слово получило второй, нынешний смысл, не потеряв первого."
memory: "Существительное с окончаниями прилагательного: szefowej, szefową, szefowymi. Выбивается только звательный szefowo. Суффикс -owa раньше значил «жена такого-то»."
