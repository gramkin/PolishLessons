notes:
  - { kind: usage, text: "Слово числится существительным, а склоняется как прилагательное: SZEFOWEJ в родительном, дательном и местном — как DOBREJ, SZEFOWĄ в винительном и творительном — как DOBRĄ, дальше SZEFOWE, SZEFOWYCH, SZEFOWYM, SZEFOWYMI. Отсюда и всего восемь форм: прилагательное складывает падежи плотнее, чем существительное. Это зеркало к KREWNY, где словарь пометил слово и прилагательным, и существительным сразу; здесь помета только существительная, а окончания всё равно прилагательные." }
  - { kind: usage, text: "Одно окончание в этом ряду выбивается: звательный SZEFOWO. Прилагательное дало бы szefowa, как dobra, а здесь стоит -o, то есть обычное существительное звательное, как ŻONO, SIOSTRO. Получается склонение-гибрид: семь окончаний прилагательных и одно существительное. Обращение PANI SZEFOWO звучит совершенно нормально и в разговоре частотно." }
  - { kind: usage, text: "Суффикс -owa делает женское название из мужского: szef — SZEFOWA, król — KRÓLOWA, krawiec — KRAWCOWA. Исторически он значил «жена такого-то», и этот смысл у szefowa в разговоре жив до сих пор: по контексту слово может означать и начальницу, и жену шефа. Русский тот же суффикс сохранил только в фамилиях — Иванова, Петрова — и для званий не употребляет вовсе, а женские названия строит другими: «начальница», «руководительница»." }
