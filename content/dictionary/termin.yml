# review
id: termin
format: 2
lemma: "termin"
rank: 2521
pos: noun
pron: { cyr: "тэ́рмін" }
senses:
  - id: deadline
    ru: "срок, дата сдачи"
    examples:
      - pl: "Termin mija w piątek."
        ru: "Срок истекает в пятницу."
        source: { kind: authored }
      - pl: "Oddał pracę w terminie."
        ru: "Он сдал работу в срок."
        source: { kind: authored }
  - id: appointment
    ru: "запись, назначенное время"
    examples:
      - pl: "Umówiliśmy termin na wtorek."
        ru: "Мы назначили время на вторник."
        source: { kind: authored }
      - pl: "Mam termin u lekarza o drugiej."
        ru: "У меня запись к врачу на два."
        source: { kind: authored }
  - id: technical-term
    ru: "термин (специальное слово)"
    examples:
      - pl: "To termin prawniczy, nie potoczny."
        ru: "Это юридический термин, а не разговорное слово."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ПО-ПОЛЬСКИ ЭТО ПРЕЖДЕ ВСЕГО СРОК, А НЕ ТЕРМИН. TERMIN значит «срок, дата, назначенное время»: termin oddania «срок сдачи», w terminie «в срок», mam termin u lekarza «у меня запись к врачу». Русское «термин» покрывает только третье, редкое значение. Услышав termin, думай сначала о календаре, а не о словаре." }
  - { kind: usage, text: "Обороты стоит знать готовыми: DOTRZYMAĆ TERMINU «соблюсти срок», с родительным; W TERMINIE «в срок»; PRZED TERMINEM «досрочно»; UMÓWIĆ TERMIN «назначить время». Предложный — w TERMINIE, с мягким ni. Прилагательное terminowy значит «срочный, в срок», а nieterminowy — «несвоевременный»." }
  - { kind: pronunciation, text: "Два слога, ударение на первом: TER-min. Польское e открытое, как русское э, mi мягкое: «тэ́рмін». Предложный terminie звучит «тэрмı́не»." }
collocations:
  - { pl: "w terminie", ru: "в срок" }
  - { pl: "dotrzymać terminu", ru: "соблюсти срок" }
  - { pl: "umówić termin", ru: "назначить время" }
family:
  - { pl: "terminowy", ru: "срочный, в срок", relation: derived }
  - { pl: "data", ru: "дата", relation: root, id: data }
  - { pl: "czas", ru: "время", relation: root, id: czas }
etymology: "Из латинского terminus «граница, предел», откуда и «терминал», и «термин». Польский удержал исходное значение границы во времени, то есть срока, а значение «специальное слово» пришло позже и осталось второстепенным. Русский взял из латыни только второе."
memory: "termin — это в первую очередь «срок» или «запись»: mam termin u lekarza. Значение «термин» в польском редкое. Запомни w terminie «в срок» и dotrzymać terminu с родительным."
idioms:
  - { pl: "w ostatnim terminie", ru: "в последний срок" }
  - { pl: "przed terminem", ru: "досрочно" }
