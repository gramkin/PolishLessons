notes:
  - { kind: false-friend, text: "Два языка назвали отдых от разных образов, и это стоит заметить. Польское ODPOCZYNEK идёт от ODPOCZĄĆ, то есть от корня покоя: тот же корень в POKÓJ «покой» и в русских «почить» и «опочивальня». Русский же «отдых» собран от «дышать»: отдохнуть значит отдышаться. Поляк, отдыхая, успокаивается, русский переводит дух. Поэтому ODPOCZYNEK так легко ложится и на вечный покой, тогда как русский «отдых» туда не годится вовсе." }
  - { kind: usage, text: "Девять форм, мужской род, неодушевлённое. Беглое E выпадает во всех косвенных падежах: ODPOCZYNEK, но ODPOCZYNKU, ODPOCZYNKOWI, ODPOCZYNKIEM. Множественное число живое и означает отдельные передышки в пути: KRÓTKIE ODPOCZYNKI «короткие привалы». Рядом стоит почти равнозначное WYPOCZYNEK, которое чаще говорят об отпуске, тогда как ODPOCZYNEK это отдых вообще." }
  - { kind: government, text: "День отдыха — родительный без предлога: DZIEŃ ODPOCZYNKU. После отдыха — предлог PO с местным падежом: PO ODPOCZYNKU. Без отдыха — предлог BEZ с родительным: BEZ ODPOCZYNKU. Отдыхать от чего-либо — ODPOCZYWAĆ OD с родительным: ODPOCZYWAĆ OD PRACY, в точности как русское «отдыхать от работы». Заслуживать отдыха по-польски значит ZASŁUŻYĆ NA ODPOCZYNEK, с предлогом NA и винительным." }
  - { kind: pronunciation, text: "Читается «отпочы́нэк», четыре слога, ударение на третьем. Две вещи меняются против написания. Первая: D перед глухим P оглушается, поэтому OD- звучит «от», и слышно «отпо», а не «одпо». Вторая: CZ даёт «ч», а Y сразу за ним даёт «ы», поэтому середина слова это «чы», сочетание, которого русский не ждёт. В ODPOCZYNKU ударение переходит на «чы́н», оставаясь на предпоследнем слоге." }
  - { kind: register, text: "Слово нейтральное и повседневное: CHWILA ODPOCZYNKU «минутка отдыха», ZASŁUŻONY ODPOCZYNEK «заслуженный отдых», DZIEŃ ODPOCZYNKU. Отдельно стоит церковный пласт: WIECZNY ODPOCZYNEK это начало заупокойной молитвы, которую в Польше знают все, и выражение узнаётся мгновенно. Поэтому в разговоре о смерти слово звучит иначе, чем в разговоре об отпуске, и путать эти два регистра не стоит." }
