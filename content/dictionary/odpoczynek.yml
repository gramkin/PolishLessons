etymology: "От глагола ODPOCZĄĆ, от праславянского корня со значением покоя, успокоения: того же корня POKÓJ «покой» и русские «почить», «опочивальня», «покой». Русское «отдых» построено совсем иначе, от «дышать»: отдохнуть это перевести дух. Два языка, стало быть, разошлись в самом образе: один видит в отдыхе успокоение, другой восстановленное дыхание. Из общего корня понятно и то, почему ODPOCZYNEK годится для вечного покоя, а «отдых» туда не ложится."
memory: "Образ другой, чем в русском: odpoczynek идёт от корня покоя, того же, что в pokój «покой» и в «почить», а русский «отдых» построен от «дышать». Поляк, отдыхая, успокаивается, русский переводит дух. Поэтому wieczny odpoczynek это «вечный покой», начало заупокойной молитвы, и слово покрывает оба смысла сразу. Читается «отпочы́нэк»: d перед p оглушается, а cz плюс y дают неожиданное «чы»."
idioms:
  - { pl: "wieczny odpoczynek", ru: "вечный покой" }
