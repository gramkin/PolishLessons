# review
id: konczyc
format: 2
lemma: "kończyć"
rank: 646
pos: verb
aspect: imperf
aspectPair: skonczyc
pron: { cyr: "ко́нчыць" }
senses:
  - id: finish
    ru: "кончать, заканчивать"
    examples:
      - pl: "Czas kończyć pracę."
        ru: "Пора заканчивать работу."
        source: { kind: translated, id: 365129 }
      - pl: "Na dziś już kończymy."
        ru: "На сегодня заканчиваем."
        source: { kind: translated, id: 608994 }
      - pl: "A której godzinie kończysz?"
        ru: "Во сколько ты заканчиваешь?"
        source: { kind: translated, id: 3680497 }
  - id: end-itself
    ru: "kończyć się — кончаться, подходить к концу"
    examples:
      - pl: "Kampania kończy się w poniedziałek."
        ru: "Кампания заканчивается в понедельник."
        source: { kind: tatoeba, id: 6155029 }
      - pl: "Świat się kończy."
        ru: "Мир кончается."
        source: { kind: translated, id: 2372601 }
      - pl: "Czas się kończył."
        ru: "Время кончалось."
        source: { kind: translated, id: 5414493 }
  - id: run-out
    ru: "kończą się komuś — у кого-л. кончается (дательный)"
    note: "Kończą nam się pieniądze «У нас кончаются деньги»."
    examples:
      - pl: "Kończą się nam zapasy."
        ru: "У нас заканчиваются запасы."
        source: { kind: translated, id: 3460696 }
      - pl: "Kończą nam się pieniądze."
        ru: "У нас кончаются деньги."
        source: { kind: translated, id: 11149031 }
      - pl: "Kończyło nam się paliwo, a co gorsza - zaczął padać gęsty śnieg."
        ru: "У нас кончалось топливо, а хуже того — повалил густой снег."
        source: { kind: translated, id: 676813 }
  - id: turn-age
    ru: "kończyć lata — исполняться (о возрасте)"
    note: "Dziś mój syn kończy cztery lata."
    examples:
      - pl: "Dziś mój syn kończy cztery lata."
        ru: "Сегодня моему сыну исполняется четыре года."
        source: { kind: tatoeba, id: 1772603 }
      - pl: "Jutro kończę 14 lat."
        ru: "Завтра мне исполняется четырнадцать."
        source: { kind: translated, id: 366583 }
      - pl: "Tom powiedział mi, że w tym roku kończysz szkołę."
        ru: "Том сказал мне, что ты в этом году заканчиваешь школу."
        source: { kind: translated, id: 4716855 }
notes:
  - { kind: government, text: "Очень частая безличная конструкция: kończą się KOMUŚ czegoś — дательный лица плюс именительный вещи. Kończą nam się pieniądze «У нас кончаются деньги», kończy mi się czas." }
  - { kind: usage, text: "Возвратное kończyć się значит «кончаться»: kampania kończy się w poniedziałek." }
  - { kind: usage, text: "О возрасте — «исполняться»: dziś mój syn kończy cztery lata «сегодня сыну исполняется четыре». Русский берёт здесь другой глагол." }
  - { kind: usage, text: "Совершенный вид — skończyć: kończył długo, w końcu skończył." }
collocations:
  - { pl: "kończyć pracę", ru: "заканчивать работу" }
  - { pl: "kończy się", ru: "кончается" }
  - { pl: "kończą nam się pieniądze", ru: "у нас кончаются деньги" }
  - { pl: "kończyć szkołę", ru: "заканчивать школу" }
family:
  - { pl: "skończyć", ru: "закончить", relation: aspect }
  - { pl: "koniec", ru: "конец", relation: root }
  - { pl: "zakończenie", ru: "окончание", relation: derived }
etymology: "От koniec «конец», праславянское *konь — то же гнездо, что русские «конец», «кончать» и «искони»."
memory: "kończyć — «кончать, заканчивать», совершенный вид skończyć. Самое полезное здесь — безличный оборот: kończą się KOMUŚ czegoś, дательный лица плюс именительный вещи. Kończą nam się pieniądze «У нас кончаются деньги», kończy mi się czas. И отдельно запомните возрастное значение: dziś mój syn kończy cztery lata «сегодня сыну исполняется четыре» — русский берёт здесь совсем другой глагол."
idioms:
