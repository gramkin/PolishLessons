etymology: "От KRAJ, от праславянского слова со значением края, предела, того же, что русский «край». Дальше пути разошлись: польский перешёл от края к тому, что внутри этих краёв, и получил «страну», а русский оставил и кромку, и область. Из того же корня вышло KRAJOBRAZ «пейзаж», буквально «образ края», слово прозрачное и красивое. Соседнее ZAGRANICZNY, от GRANICA, занимает ровно противоположный полюс: то, что за пределами страны."
memory: "Всё держится на одном: kraj это «страна», а не «край». W jakim kraju mieszkasz? значит «в какой стране живёшь». Поэтому krajowy это «внутренний, отечественный»: rynek krajowy, lot krajowy, produkcja krajowa. Русский «край» как область это region, как кромка это brzeg. Мужско-личная форма krajowi совпадает с дательным падежом слова kraj. Читается «крайо́вы», а само kraj звучит в точности как русское «край»."
idioms:
  - { pl: "Armia Krajowa", ru: "Армия Крайова, подпольная армия времён войны" }
