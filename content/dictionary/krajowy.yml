notes:
  - { kind: false-friend, text: "Существительное, от которого образовано это прилагательное, один из самых коварных ложных друзей: KRAJ по-польски значит «страна», а не «край». Вопрос W JAKIM KRAJU MIESZKASZ? означает «в какой стране ты живёшь». Русский «край» в смысле области по-польски будет REGION или WOJEWÓDZTWO, а в смысле кромки — BRZEG или SKRAJ. Отсюда и KRAJOWY: не «краевой», а «внутренний, отечественный, общегосударственный»." }
  - { kind: usage, text: "Одиннадцать форм, относительное прилагательное, степеней сравнения нет. Мужско-личная форма множественного числа KRAJOWI обиходна в экономических текстах: KRAJOWI PRODUCENCI «отечественные производители», KRAJOWI PRZEWOŹNICY. Та же форма KRAJOWI служит дательным падежом существительного KRAJ «стране», и различает их только согласование: KRAJOWI PRODUCENCI против POMÓC KRAJOWI «помочь стране»." }
  - { kind: government, text: "На внутреннем рынке — предлог NA с местным падежом: NA RYNKU KRAJOWYM. Во внутреннем праве — W PRAWIE KRAJOWYM, предлог W с местным. Прилагательное в устойчивых сочетаниях почти всегда стоит после существительного: RYNEK KRAJOWY, LOT KRAJOWY, DROGA KRAJOWA. Исключение составляют закрепившиеся имена собственные с обратным порядком: ARMIA KRAJOWA, где порядок давно застыл." }
  - { kind: pronunciation, text: "Читается «крайо́вы», три слога, ударение на втором. Буква J даёт «й», поэтому сочетание AJO звучит «айо», в два приёма. Конечное Y даёт «ы». В существительном KRAJ слышно «край», совершенно как русское слово, и именно это сходство сбивает с толку: звучит одинаково, значит разное. В мужско-личной форме KRAJOWI слышно «крайо́ви»." }
  - { kind: register, text: "Слово нейтральное, из языка экономики, транспорта и права: RYNEK KRAJOWY, PRODUKCJA KRAJOWA «отечественное производство», POŁĄCZENIA KRAJOWE «внутренние рейсы», DROGA KRAJOWA «дорога государственного значения», которую на указателях обозначают буквами DK и номером. Отдельно и с большой буквы стоит ARMIA KRAJOWA, подпольная армия времён войны, которую в Польше сокращают до AK и знают все." }
