notes:
  - { kind: usage, text: "ЕЩЁ ОДНО МУЖСКОЕ СУЩЕСТВИТЕЛЬНОЕ С ЖЕНСКИМ СКЛОНЕНИЕМ. Zdrajca, zdrajcy, zdrajcę, zdrajcą — окончания женские, хотя речь о мужчине: ten zdrajca. Тот же разряд, что zwycięzca, kierowca, kolega, mężczyzna, poeta. Суффикс -ca вообще тянет за собой это склонение." }
  - { kind: false-friend, text: "РУССКОГО ОДНОКОРЕННОГО СЛОВА НЕТ. Zdrada «измена, предательство» и zdradzić «предать» в русском соответствия не имеют: там «измена» от «менять». Украинское «зрада» — то же слово, что польское, и по нему корень легче узнать. Этимологи связывают zdrada со старым rada «совет»: предать значило дать пагубный совет." }
  - { kind: pronunciation, text: "Два слога, ударение на первом: ZDRAJ-ca. Начальная группа zdr произносится слитно, j как й, c как ц: «здра́йца». Звательный падеж zdrajco звучит в упрёке: ty zdrajco!" }
collocations:
  - { pl: "zdrajca ojczyzny", ru: "предатель родины" }
  - { pl: "nazwać kogoś zdrajcą", ru: "назвать кого-л. предателем" }
  - { pl: "ty zdrajco", ru: "ты предатель" }
family:
  - { pl: "zdrada", ru: "измена, предательство", relation: root }
  - { pl: "zdradzić", ru: "предать, изменить", relation: derived, id: zdradzic }
  - { pl: "wierny", ru: "верный", relation: antonym }
etymology: "От zdradzić «предать», от zdrada. Корень связывают со старым rada «совет», пришедшим из германских языков: предательство понималось как дурной совет, уводящий в беду. В русском это гнездо не прижилось — там «измена», от «менять», — зато в украинском «зрада» то же самое слово. Суффикс -ca называет лицо и приносит женское склонение."
memory: "zdrajca — «предатель», мужского рода, но склоняется по-женски: zdrajcy, zdrajcę, zdrajcą — как zwycięzca и kolega. Русской родни у корня нет: «измена» от другого слова, зато украинская «зрада» — то же самое."
idioms:
  - { pl: "zdrajca ojczyzny", ru: "предатель родины" }
  - { pl: "ty zdrajco!", ru: "ты предатель!" }
