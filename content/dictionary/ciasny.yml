pos: adj
pron: { cyr: "ця́сны" }
senses:
  - id: tight
    ru: "тесный, узкий (о помещении, одежде)"
    examples:
      - pl: "Mieszkamy w ciasnym mieszkaniu."
        ru: "Мы живём в тесной квартире."
        source: { kind: authored }
      - pl: "Te spodnie są za ciasne."
        ru: "Эти брюки слишком тесные."
        source: { kind: authored }
      - pl: "To najciaśniejsza uliczka w mieście."
        ru: "Это самая узкая улочка в городе."
        source: { kind: authored }
  - id: narrow-minded
    ru: "ограниченный, узкий (о взглядах)"
    examples:
      - pl: "Ma ciasne poglądy na świat."
        ru: "У него узкие взгляды на мир."
        source: { kind: authored }
      - pl: "Nie bądź taki ciasny w myśleniu."
        ru: "Не будь таким ограниченным."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Русское «тесный» по-польски — CIASNY, и корень у них разный: польское CIASNY от CIEŚNIĆ, «теснить», с тем же C на месте русского Т, что в CIEŃ — «тень». Узкая улица — WĄSKA ULICA, а «тесная квартира» — CIASNE MIESZKANIE. О дружбе русское «тесный» — BLISKI, а не CIASNY: BLISKA PRZYJAŹŃ." }
  - { kind: usage, text: "Полная парадигма: CIASNY, CIAŚNIEJSZY, NAJCIAŚNIEJSZY, с чередованием S на Ś перед -NIEJSZY. Мужское-личное: CIAŚNI, CIAŚNIEJSI, NAJCIAŚNIEJSI — о людях с узкими взглядами." }
  - { kind: government, text: "Тесно кому-то — KOMUŚ JEST CIASNO, наречие с дательным. Тесный в плечах — CIASNY W RAMIONACH, W с местным. В сравнении — NIŻ или OD с родительным." }
  - { kind: pronunciation, text: "Читается «ця́сны», два слога, ударение на первом. CIA — мягкое «ця». В CIAŚNIEJSZY: «цясьне́йшы», S становится мягким «сь»." }
  - { kind: register, text: "Нейтральное слово. О жилье — частое и чуть жалобное: CIASNE M2, «тесная двушка». О взглядах — осуждающее: CIASNY UMYSŁ, «ограниченный ум». В футболе CIASNE KRYCIE — «плотная опека»." }
collocations:
  - { pl: "ciasne mieszkanie", ru: "тесная квартира" }
  - { pl: "ciasne buty", ru: "тесная обувь" }
  - { pl: "ciasny umysł", ru: "ограниченный ум" }
family:
  - { pl: "ciasno", ru: "тесно", relation: derived }
  - { pl: "wąski", ru: "узкий", relation: root }
  - { pl: "luźny", ru: "свободный, просторный", relation: root }
etymology: "Общеславянское *těsnъ, того же, что русское «тесный». Польское CIA на месте русского «те» — обычное: перед мягкой гласной Т превращается в Ć, а Ě даёт IA. Так же CIASTO — «тесто»."
memory: "Ciasny — тесный: ciasne mieszkanie, ciasne buty. И ограниченный: ciasny umysł. Ciaśniejszy — s→ś. Близкая дружба — bliska, не ciasna. Читается «ця́сны»."
idioms:
  - { pl: "ciasny umysł", ru: "ограниченный ум" }
