id: dziesiatka
format: 2
lemma: "dziesiątka"
rank: 4333
pos: noun
pron: { cyr: "дзесё́нтка" }
senses:
  - id: ten
    ru: "десятка (цифра, номер трамвая, купюра)"
    examples:
      - pl: "Wsiadłem do dziesiątki i pojechałem do centrum."
        ru: "Я сел на десятку и поехал в центр."
        source: { kind: authored }
      - pl: "Masz dziesiątkę? Brakuje mi na bilet."
        ru: "Есть десятка? Мне не хватает на билет."
        source: { kind: authored }
      - pl: "Na koszulce miał dużą dziesiątkę."
        ru: "На футболке у него была большая десятка."
        source: { kind: authored }
  - id: bullseye-dozens
    ru: "десятка мишени; десятки (мн., много)"
    examples:
      - pl: "Trafił w sam środek tarczy, w dziesiątkę."
        ru: "Он попал в самый центр мишени, в десятку."
        source: { kind: authored }
      - pl: "Dziesiątki ludzi czekały przed sklepem."
        ru: "Десятки людей ждали у магазина."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Десять форм в таблице, женский род. Как все числовые существительные на -KA — JEDYNKA, DWÓJKA, TRÓJKA, PIĄTKA, — DZIESIĄTKA обозначает и цифру, и номер трамвая или автобуса, и купюру в десять злотых. В дательном и местном падежах K переходит в C: DZIESIĄTCE. Звательная форма на практике не нужна." }
  - { kind: false-friend, text: "STRZAŁ W DZIESIĄTKĘ, «выстрел в десятку», — наше «в яблочко», об удачном решении: TEN PREZENT TO STRZAŁ W DZIESIĄTKĘ. Множественное DZIESIĄTKI, «десятки», значит просто «много»: DZIESIĄTKI RAZY — «десятки раз»." }
  - { kind: government, text: "Сесть на десятку — WSIĄŚĆ DO DZIESIĄTKI, DO с родительным: поляк садится «в» трамвай. Попасть в десятку — TRAFIĆ W DZIESIĄTKĘ, W с винительным. Десятки чего-то — DZIESIĄTKI CZEGOŚ: DZIESIĄTKI LAT." }
  - { kind: pronunciation, text: "Читается «дзесё́нтка», три слога, ударение на втором. DZIE даёт «дзе», а SIĄ перед T — «сён», как в PIĄTKA «пё́нтка». В форме DZIESIĄTCE: «дзесё́нтце»." }
collocations:
  - { pl: "trafić w dziesiątkę", ru: "попасть в десятку" }
  - { pl: "pierwsza dziesiątka", ru: "первая десятка" }
  - { pl: "dziesiątki lat", ru: "десятки лет" }
family:
  - { pl: "dziesięć", ru: "десять", relation: root, id: dziesiec }
  - { pl: "dziesiąty", ru: "десятый", relation: derived }
  - { pl: "dziesietny", ru: "десятичный", relation: derived }
etymology: "От DZIESIĘĆ «десять», праславянского числительного, общего с русским. Польское DZ на месте русского «д» перед мягким гласным — обычное соответствие: DZIEŃ и «день». А носовые Ę и Ą стоят там, где в русском «я»: DZIESIĘĆ и «десять», PIĘĆ и «пять»."
memory: "Dziesiątka — десятка: цифра, трамвай, купюра. Читается «дзесё́нтка». Wsiąść do dziesiątki — сесть на десятку. Strzał w dziesiątkę — в яблочко. Dziesiątki lat — десятки лет."
idioms:
  - { pl: "strzał w dziesiątkę", ru: "попадание в яблочко" }
formExamplesSkip:
  - { form: "dziesiątko", reason: "звательная форма; к числу или трамваю не обращаются" }
