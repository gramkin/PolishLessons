# review
id: zarowno
format: 2
lemma: "zarówno"
rank: 3484
pos: adv
pron: { cyr: "зару́вно" }
senses:
  - id: both
    ru: "как X, так и Y (ZARÓWNO X, JAK I Y)"
    examples:
      - pl: "Zarówno ja, jak i moja żona lubimy góry."
        ru: "И я, и моя жена любим горы."
        source: { kind: authored }
      - pl: "Zaprosiliśmy zarówno przyjaciół, jak i sąsiadów."
        ru: "Мы пригласили как друзей, так и соседей."
        source: { kind: authored }
      - pl: "Książka jest ciekawa zarówno dla studentów, jak i dla nauczycieli."
        ru: "Книга интересна как студентам, так и преподавателям."
        source: { kind: authored }
      - pl: "Zarówno latem, jak i zimą jest tu pięknie."
        ru: "И летом, и зимой здесь красиво."
        source: { kind: authored }
      - pl: "Ceni go zarówno szef, jak i koledzy."
        ru: "Его ценят и начальник, и коллеги."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ZARÓWNO — не «заровно» и не «поровну». Слово живёт только в паре ZARÓWNO X, JAK I Y — «как X, так и Y». Поровну — PO RÓWNO или PO RÓWNI, одинаково — JEDNAKOWO." }
  - { kind: usage, text: "Наречие, одна форма, без степеней. Вторая часть обязательна: ZARÓWNO X, JAK I Y. Перед JAK I ставится запятая: ZARÓWNO DZIECI, JAK I DOROŚLI. Сокращать до одного ZARÓWNO нельзя." }
  - { kind: government, text: "Само слово ничем не управляет, но обе части должны быть одного вида: два существительных в одном падеже, два предложных оборота, два наречия. Сказуемое при двух подлежащих обычно ставят во множественном: ZARÓWNO JA, JAK I ŻONA LUBIMY GÓRY." }
  - { kind: pronunciation, text: "Читается «зару́вно», ударение на предпоследнем слоге. Ó — «у», W перед N звонкое «в»." }
collocations:
  - { pl: "zarówno ty, jak i ja", ru: "и ты, и я" }
  - { pl: "zarówno w pracy, jak i w domu", ru: "как на работе, так и дома" }
  - { pl: "zarówno dzieci, jak i dorośli", ru: "и дети, и взрослые" }
family:
  - { pl: "równo", ru: "ровно, одинаково", relation: root }
  - { pl: "równy", ru: "ровный, равный", relation: root, id: rowny }
  - { pl: "równie", ru: "столь же, так же", relation: root, id: rownie }
etymology: "ZA + RÓWNO «ровно, наравне»: исходно «наравне, одинаково». Польское RÓ на месте русского «ро», «ра»: RÓWNY — «ровный» и «равный» сразу."
memory: "Zarówno X, jak i Y — как X, так и Y; запятая перед jak i. Читается «зару́вно». От równo «ровно, наравне»."
idioms:
  - { pl: "jak równy z równym", ru: "на равных" }
formExamples:
  - form: "zarówno"
    pl: "Film podoba się zarówno dzieciom, jak i dorosłym."
    ru: "Фильм нравится как детям, так и взрослым."
    source: { kind: authored }
  - form: "zarówno"
    pl: "W pracy i w domu jest zarówno spokojny, jak i cierpliwy."
    ru: "И на работе, и дома он спокоен и терпелив."
    source: { kind: authored }
  - form: "zarówno"
    pl: "Mówi zarówno po polsku, jak i po rosyjsku."
    ru: "Он говорит и по-польски, и по-русски."
    source: { kind: authored }
