# review
id: farmer
format: 2
lemma: "farmer"
rank: 4654
pos: noun
pron: { cyr: "фа́рмэр" }
senses:
  - id: farmer
    ru: "фермер (в Америке, на Западе)"
    examples:
      - pl: "Farmer z Teksasu hoduje bydło."
        ru: "Фермер из Техаса разводит скот."
        source: { kind: authored }
      - pl: "Farmerzy protestowali przeciw niskim cenom."
        ru: "Фермеры протестовали против низких цен."
        source: { kind: authored }
      - pl: "W filmie gra amerykańskiego farmera."
        ru: "В фильме он играет американского фермера."
        source: { kind: authored }
  - id: owner
    ru: "фермер, владелец крупного хозяйства"
    examples:
      - pl: "Został farmerem po przeprowadzce na wieś."
        ru: "Переехав в деревню, он стал фермером."
        source: { kind: authored }
      - pl: "Farmer kupił nowy traktor."
        ru: "Фермер купил новый трактор."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "FARMER — «фермер», но в Польше о своих крестьянах так говорят редко: польский земледелец — ROLNIK, а хозяйство — GOSPODARSTWO. FARMER звучит по-американски или о крупном современном хозяйстве. Ферма — FARMA; птицеферма — FERMA DROBIU." }
  - { kind: usage, text: "Десять форм, мужской род, лицо. Множественное — FARMERZY: R переходит в RZ. Местный и звательный — FARMERZE." }
  - { kind: government, text: "Стать фермером — ZOSTAĆ FARMEREM, творительный. Купить у фермера — KUPIĆ OD FARMERA, родительный. Рынок фермеров — TARG FARMERÓW." }
  - { kind: pronunciation, text: "Читается «фа́рмэр», ударение на первом слоге. ME — твёрдое «мэ». FARMERZY — «фармэ́жы»." }
collocations:
  - { pl: "amerykański farmer", ru: "американский фермер" }
  - { pl: "targ farmerów", ru: "фермерский рынок" }
  - { pl: "zostać farmerem", ru: "стать фермером" }
family:
  - { pl: "rolnik", ru: "земледелец, фермер", relation: root }
  - { pl: "farma", ru: "ферма", relation: root, id: farma }
  - { pl: "gospodarstwo", ru: "хозяйство", relation: root }
etymology: "Из английского FARMER, от FARM «ферма». Русское «фермер» — то же слово, взятое раньше и через «е»."
memory: "Farmer — фермер, чаще американский. Польский крестьянин — rolnik. Farmerzy — фермеры. Читается «фа́рмэр»."
idioms:
  - { pl: "targ farmerski", ru: "фермерский рынок" }
