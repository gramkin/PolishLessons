id: schadzka
format: 2
lemma: "schadzka"
rank: 5551
pos: noun
pron: { cyr: "сха́дзка" }
senses:
  - id: tryst
    ru: "тайное свидание, встреча влюблённых"
    examples:
      - pl: "A więc to była schadzka umówiona."
        ru: "Значит, это было условленное свидание."
        source: { kind: authored }
      - pl: "Umówili się na schadzkę o zmierzchu."
        ru: "Они условились о свидании в сумерках."
        source: { kind: authored }
      - pl: "Schadzka nie doszła do skutku."
        ru: "Свидание не состоялось."
        source: { kind: authored }
  - id: secret-meeting
    ru: "тайная встреча вообще"
    examples:
      - pl: "Zgrzyt klucza świadczył o wyjściu na schadzkę."
        ru: "Скрип ключа говорил о выходе на тайную встречу."
        source: { kind: authored }
      - pl: "To była schadzka spiskowców."
        ru: "Это была тайная встреча заговорщиков."
        source: { kind: authored }
      - pl: "Nikt nie wiedział o tej schadzce."
        ru: "Никто не знал об этой встрече."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Слово от schadzać się «сходиться, тайком встречаться», от chodzić «ходить». Русское «сходка» построено от того же образа схождения." }
  - { kind: register, text: "Книжное и слегка старомодное; в современной речи скажут potajemne spotkanie или просто randka «свидание»." }
  - { kind: usage, text: "Чаще всего о свидании влюблённых, но годится и для любой тайной встречи: schadzka spiskowców." }
  - { kind: usage, text: "Примеров в корпусе Tatoeba нет, поэтому все предложения составлены вручную и ждут проверки." }
collocations:
  - { pl: "umówić się na schadzkę", ru: "условиться о свидании" }
  - { pl: "potajemna schadzka", ru: "тайное свидание" }
  - { pl: "randka", ru: "свидание" }
etymology: "От schadzać się «сходиться, тайком встречаться», от chodzić «ходить». Русская «сходка» построена от того же образа схождения."
memory: "schadzka — «тайное свидание», от schadzać się «сходиться»: тот же образ, что в русской «сходке». Слово книжное и слегка старомодное — в современной речи скажут randka «свидание» или potajemne spotkanie. Годится и для встречи заговорщиков, не только влюблённых."
idioms:
  - { pl: "umówić się na schadzkę", ru: "условиться о свидании" }
  - { pl: "potajemna schadzka", ru: "тайное свидание" }
