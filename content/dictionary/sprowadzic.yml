# review
id: sprowadzic
format: 2
lemma: "sprowadzić"
rank: 1005
pos: verb
aspect: perf
pron: { cyr: "спрова́дзиць" }
senses:
  - id: bring
    ru: "привести, привезти, доставить"
    examples:
      - pl: "Sprowadzę pomoc."
        ru: "Я приведу помощь."
        source: { kind: translated, id: 8766034 }
      - pl: "Pójdę i sprowadzę ci lekarza."
        ru: "Я схожу и приведу тебе врача."
        source: { kind: translated, id: 973127 }
      - pl: "Sprowadź pomoc!"
        ru: "Приведи помощь!"
        source: { kind: translated, id: 8652434 }
  - id: bring-upon
    ru: "навлечь (беду, гнев)"
    examples:
      - pl: "To sprowadzi nieszczęście na twoją rodzinę."
        ru: "Это навлечёт несчастье на твою семью."
        source: { kind: translated, id: 511566 }
      - pl: "Sprowadzili gniew Boga na swoich wrogów."
        ru: "Они навлекли гнев Бога на своих врагов."
        source: { kind: translated, id: 3687215 }
  - id: down-to-earth
    ru: "sprowadzić na ziemię — спустить с небес на землю"
    examples:
      - pl: "Muszę cię sprowadzić na ziemię."
        ru: "Я должен спустить вас с облаков на землю."
        source: { kind: tatoeba, id: 1085690 }
      - pl: "Sprowadziło mnie to na ziemię."
        ru: "Это меня отрезвило."
        source: { kind: translated, id: 13655344 }
notes:
  - { kind: government, text: "sprowadzić kogoś — винительный падеж; а sprowadzić coś NA kogoś «навлечь что-то на кого-то» — предлог na с винительным." }
  - { kind: usage, text: "Совершенный вид; несовершенный — sprowadzać. Приставка s- плюс prowadzić «вести»." }
  - { kind: usage, text: "Второе значение — «импортировать, выписать»: sprowadzić towar z zagranicy «привезти товар из-за границы»." }
  - { kind: usage, text: "sprowadzić kogoś na ziemię «спустить кого-то с небес на землю» и sprowadzić na złą drogę «сбить с пути» — переносные обороты, совпадающие с русскими." }
collocations:
  - { pl: "sprowadzić pomoc", ru: "привести помощь" }
  - { pl: "sprowadzić na ziemię", ru: "спустить с небес на землю" }
  - { pl: "sprowadzić kłopoty", ru: "навлечь неприятности" }
family:
  - { pl: "sprowadzać", ru: "приводить (несовершенный вид)", relation: aspect }
  - { pl: "prowadzić", ru: "вести", relation: root, id: prowadzic }
etymology: "Приставка s- плюс prowadzić «вести» — буквально «свести, привести». Русское «привести» собрано так же, только с приставкой «при-»."
memory: "sprowadzić — «привести, привезти»: sprowadzić pomoc, sprowadzić lekarza. Второе значение — «навлечь»: sprowadzić kłopoty na kogoś. А sprowadzić na ziemię значит «спустить с небес на землю»."
idioms:
  - { pl: "sprowadzić pomoc", ru: "привести помощь" }
  - { pl: "sprowadzić na ziemię", ru: "спустить с небес на землю" }
formExamplesSkip:
  - { form: "sprowadziwszy", reason: "книжное деепричастие прошедшего времени; в живой речи не употребляется" }
