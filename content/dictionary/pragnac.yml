# review
id: pragnac
format: 2
lemma: "pragnąć"
rank: 932
pos: verb
aspect: imperf
pron: { cyr: "пра́гнонць" }
senses:
  - id: desire
    ru: "жаждать, страстно желать (родительный)"
    note: "Требует родительного падежа, как и русское «жаждать»."
    examples:
      - pl: "Tom pragnie miłości."
        ru: "Том жаждет любви."
        source: { kind: tatoeba, id: 8664050 }
      - pl: "Cały świat pragnie pokoju."
        ru: "Весь мир желает мира."
        source: { kind: tatoeba, id: 6154983 }
      - pl: "Oni pragną pokoju."
        ru: "Они жаждут мира."
        source: { kind: translated, id: 742539 }
  - id: wish-to
    ru: "pragnąć + инфинитив — желать сделать что-л."
    examples:
      - pl: "Pragnę cię zobaczyć."
        ru: "Я жажду тебя увидеть."
        source: { kind: translated, id: 608203 }
      - pl: "Pragnę zobaczyć Rzym."
        ru: "Я мечтаю увидеть Рим."
        source: { kind: translated, id: 3498219 }
      - pl: "Dam ci wszystko czego pragniesz."
        ru: "Я дам тебе всё, чего ты пожелаешь."
        source: { kind: translated, id: 4441324 }
  - id: longed
    ru: "о сильном желании в прошлом"
    examples:
      - pl: "Pragnął śmierci."
        ru: "Он жаждал смерти."
        source: { kind: translated, id: 982422 }
      - pl: "Tom pragnął zemsty."
        ru: "Том жаждал мести."
        source: { kind: translated, id: 9679371 }
      - pl: "Bardzo pragnęła objechać świat dookoła."
        ru: "Она очень хотела объехать весь свет."
        source: { kind: translated, id: 924631 }
notes:
  - { kind: government, text: "Глагол требует родительного падежа: pragnąć pokoju «жаждать мира», pragnąć miłości «жаждать любви». Русское «жаждать» ведёт себя так же." }
  - { kind: register, text: "Слово сильное и книжное: это не «хотеть», а «жаждать, страстно желать». Обычное «хотеть» — chcieć." }
  - { kind: usage, text: "С инфинитивом значит «желать сделать»: Pragnę cię zobaczyć «Я жажду тебя увидеть». В официальных письмах Pragnę poinformować… «Имею честь сообщить…»." }
  - { kind: usage, text: "Существительное pragnienie значит и «желание», и «жажду» в прямом смысле: gasić pragnienie «утолять жажду»." }
collocations:
  - { pl: "pragnąć pokoju", ru: "жаждать мира" }
  - { pl: "czego pragniesz?", ru: "чего ты желаешь?" }
  - { pl: "pragnienie", ru: "желание; жажда" }
  - { pl: "pragnąć jak kania dżdżu", ru: "ждать как манны небесной" }
family:
  - { pl: "pragnienie", ru: "желание, жажда", relation: derived }
  - { pl: "spragniony", ru: "жаждущий", relation: derived }
  - { pl: "chcieć", ru: "хотеть", relation: root }
etymology: "Праславянское *pragnǫti «жаждать, испытывать жажду». Отсюда же pragnienie «жажда»; русское «жаждать» другого корня, но смысловой ход тот же — от телесной жажды к желанию."
memory: "pragnąć — «жаждать, страстно желать», слово сильное и книжное: обычное «хотеть» это chcieć. Требует родительного падежа: pragnąć pokoju. Существительное pragnienie значит и «желание», и «жажду»: gasić pragnienie «утолять жажду»."
idioms:
  - { pl: "pragnąć pokoju", ru: "жаждать мира" }
  - { pl: "czego pragniesz?", ru: "чего ты желаешь?" }
  - { pl: "gasić pragnienie", ru: "утолять жажду" }
