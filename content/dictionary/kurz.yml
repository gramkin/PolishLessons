senses:
  - id: dust
    ru: "пыль"
    examples:
      - pl: "Na półkach leży gruba warstwa kurzu."
        ru: "На полках лежит толстый слой пыли."
        source: { kind: authored }
      - pl: "Mam alergię na kurz."
