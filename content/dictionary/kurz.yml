  - id: dust-cloud
    ru: "клубы пыли (на дороге, в бою)"
    examples:
      - pl: "Za samochodem unosił się tuman kurzu."
        ru: "За машиной поднималось облако пыли."
        source: { kind: authored }
      - pl: "Kurz bitwy jeszcze nie opadł."
        ru: "Пыль сражения ещё не улеглась."
