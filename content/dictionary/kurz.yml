notes:
  - { kind: false-friend, text: "KURZ — «пыль», и с курами, KURY, не связан. Пыль вытирают во множественном: ŚCIERAĆ KURZE — «вытирать пыль». Глагол KURZYĆ — «пылить», а разговорно и «курить»: от дыма до пыли один шаг. Пылесос — ODKURZACZ, буквально «обеспыливатель», а пылесосить — ODKURZAĆ." }
  - { kind: usage, text: "Девять форм в таблице, мужской род, неодушевлённое. Обычно в единственном: KURZ, KURZU, KURZEM. Из множественного живёт только оборот ŚCIERAĆ KURZE, «вытирать пыль»; остальные формы множественного не нужны." }
  - { kind: government, text: "Слой пыли — WARSTWA KURZU, родительный. Покрытый пылью — POKRYTY KURZEM, творительный. Аллергия на пыль — ALERGIA NA KURZ, NA с винительным." }
  - { kind: pronunciation, text: "Читается «куш», один слог: RZ на конце оглушается в «ш». В косвенных формах RZ звонкое: KURZU — «ку́жу»." }
  - { kind: register, text: "ZBIERAĆ KURZ, «собирать пыль», — «пылиться» о ненужной вещи: TA KSIĄŻKA TYLKO ZBIERA KURZ. GDY OPADNIE KURZ — «когда уляжется пыль», после скандала или ссоры." }
collocations:
  - { pl: "warstwa kurzu", ru: "слой пыли" }
  - { pl: "ścierać kurze", ru: "вытирать пыль" }
  - { pl: "alergia na kurz", ru: "аллергия на пыль" }
family:
  - { pl: "kurzyć", ru: "пылить; курить (разг.)", relation: derived }
  - { pl: "odkurzacz", ru: "пылесос", relation: derived }
  - { pl: "zakurzony", ru: "пыльный, запылённый", relation: derived }
etymology: "От глагола KURZYĆ «дымить, пылить», праславянского корня, общего с русскими «курить» и «курево»: и дым, и пыль поднимаются клубами. Отсюда же польское KURZYĆ в значении «курить»."
memory: "Kurz — пыль: warstwa kurzu. Читается «куш». Ścierać kurze — вытирать пыль. Odkurzacz — пылесос. Kurzyć — пылить и курить. Zbierać kurz — пылиться."
idioms:
  - { pl: "zbierać kurz", ru: "пылиться" }
  - { pl: "gdy opadnie kurz", ru: "когда уляжется пыль" }
