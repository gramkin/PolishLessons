notes:
  - { kind: usage, text: "У СУЩЕСТВИТЕЛЬНЫХ НА -JA ДВА РОДИТЕЛЬНЫХ МНОЖЕСТВЕННОГО: KONFERENCJI И KONFERENCYJ. Первая форма сегодняшняя, вторая книжная и старая, из довоенных документов. То же удвоение у komisja (komisji / komisyj), obsesja, partia, konsekwencja — целый класс заимствований на -ja ведёт себя одинаково. Запоминать стоит современную, а -yj просто узнавать в старых текстах." }
  - { kind: usage, text: "Форма KONFERENCJI делает сразу четыре работы: родительный, дательный и предложный единственного плюс родительный множественного. Русская «конференции» тоже многозначна, но иначе — у нас она покрывает ещё и именительный множественного, а по-польски там konferencje. Падеж здесь определяется только предлогом и глаголом." }
  - { kind: government, text: "На конференции — NA KONFERENCJI, предложный, как и в русском. Но осторожно с глаголами: BRAĆ UDZIAŁ W KONFERENCJI «участвовать в конференции» идёт с предлогом w, а UCZESTNICZYĆ W KONFERENCJI — так же. Зато «выступать на конференции» это wystąpić NA konferencji. Предлог меняется вместе с глаголом, не вместе со смыслом." }
collocations:
  - { pl: "konferencja prasowa", ru: "пресс-конференция" }
  - { pl: "wziąć udział w konferencji", ru: "принять участие в конференции" }
  - { pl: "zwołać konferencję", ru: "созвать конференцию" }
family:
  - { pl: "konferencyjny", ru: "конференционный", relation: derived }
  - { pl: "konferować", ru: "совещаться", relation: root }
  - { pl: "komisja", ru: "комиссия", relation: root, id: komisja }
etymology: "Из латинского conferentia «собеседование», от conferre «сносить вместе, сопоставлять». И русский, и польский взяли слово через латынь научных кругов, поэтому они совпадают до корня; расходится только окончание — латинское -tia дало польское -cja и русское -ция. Тот же ряд: komisja — «комиссия», obsesja — «обсессия», tradycja — «традиция»."
memory: "Родительный множественного имеет два вида: современное KONFERENCJI и старое KONFERENCYJ. И помни, что konferencji — это ещё и родительный, дательный и предложный единственного; падеж подскажет только предлог."
idioms:
