etymology: "Из греческого SEIRĒN — морские девы, заманивавшие моряков пением. Отсюда и звуковая сирена: она тоже «зовёт» громко."
memory: "Syrena — сирена и русалка. Syrenka warszawska — символ Варшавы. Jechać na syrenie — ехать с сиреной. Читается «сыре́на»."
