notes:
  - { kind: false-friend, text: "SYRENA — и «сирена», и «русалка»! Варшавская русалка с мечом и щитом — SYRENKA WARSZAWSKA, герб столицы. Русалка из славянских поверий — RUSAŁKA, но это лесная и речная нечисть, а не морская дева. SYRENA — ещё и марка старого польского автомобиля." }
  - { kind: usage, text: "Девять форм, женский род. В местном N смягчается: NA SYRENIE. Уменьшительное SYRENKA — «русалочка». Звательный SYRENO не учим." }
  - { kind: government, text: "Ехать с сиреной — JECHAĆ NA SYRENIE, местный. Звук сирены — DŹWIĘK SYRENY, родительный. Включить сирену — WŁĄCZYĆ SYRENĘ." }
  - { kind: pronunciation, text: "Читается «сыре́на»: SY — твёрдое «сы», ударение на предпоследнем слоге. SYRENIE — «сыре́не»." }
