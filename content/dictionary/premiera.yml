etymology: "Из французского слова со значением «первая»: первое представление. От того же корня PREMIER, «первый министр»."
memory: "Premiera — премьера; premier — премьер-министр. Читается «прэмье́ра». Na premierze — на премьере. Premiera telefonu — выход телефона."
