notes:
  - { kind: false-friend, text: "PREMIERA — «премьера», а PREMIER — «премьер-министр». Ловушка в том, что родительный множественного от PREMIERA тоже PREMIER: KILKA PREMIER, «несколько премьер». Отличить помогает только контекст." }
  - { kind: usage, text: "Девять живых форм, женский род. В местном падеже R переходит в RZ: NA PREMIERZE. Звательный не даётся. О новом фильме, книге, телефоне, игре — тоже PREMIERA." }
  - { kind: government, text: "На премьере — NA PREMIERZE, местный. На премьеру — NA PREMIERĘ, винительный. Премьера чего — родительный: PREMIERA FILMU, PREMIERA KSIĄŻKI." }
  - { kind: pronunciation, text: "Читается «прэмье́ра», ударение на предпоследнем слоге. RE — твёрдое «рэ», MIE — «мье»." }
collocations:
  - { pl: "premiera filmu", ru: "премьера фильма" }
  - { pl: "uroczysta premiera", ru: "торжественная премьера" }
  - { pl: "premiera nowego modelu", ru: "выход новой модели" }
