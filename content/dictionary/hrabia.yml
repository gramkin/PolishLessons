# review
id: hrabia
format: 2
lemma: "hrabia"
rank: 3741
pos: noun
pron: { cyr: "хра́бя" }
senses:
  - id: count
    ru: "граф (титул)"
    examples:
      - pl: "Hrabia mieszkał w pałacu nad jeziorem."
        ru: "Граф жил во дворце у озера."
        source: { kind: authored }
      - pl: "Panie hrabio, goście już czekają."
        ru: "Господин граф, гости уже ждут."
        source: { kind: authored }
      - pl: "Pałac należał do hrabiego Potockiego."
        ru: "Дворец принадлежал графу Потоцкому."
        source: { kind: authored }
  - id: aristocrat
    ru: "барин, аристократ (ирон.)"
    examples:
      - pl: "Zachowuje się jak hrabia, a nie ma grosza."
        ru: "Ведёт себя как граф, а у самого ни гроша."
        source: { kind: authored }
      - pl: "Co, hrabia sam nie umie zrobić herbaty?"
        ru: "Что, его сиятельство сам не умеет сделать чай?"
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "HRABIA — «граф», титул. Польское GRAF — это «граф» в математике, а не титул. Графиня — HRABINA, графство — HRABSTWO." }
  - { kind: usage, text: "Склонение смешанное: в единственном одни формы как у существительного на -A (HRABIA, HRABIĄ, HRABIO), другие как у прилагательного (HRABIEGO, HRABIEMU, HRABIM). Есть и краткие HRABI. Множественное — HRABIOWIE, HRABIÓW." }
  - { kind: government, text: "Дворец графа — PAŁAC HRABIEGO, родительный. Обращение — PANIE HRABIO, звательный. О графе — O HRABIM или O HRABI, местный." }
  - { kind: pronunciation, text: "Читается «хра́бя»: H — «х», BIA — мягкое «бя». Ударение на первом слоге. HRABIEGO — «храбе́го», HRABIOWIE — «храбьо́ве»." }
collocations:
  - { pl: "pan hrabia", ru: "господин граф" }
  - { pl: "tytuł hrabiego", ru: "графский титул" }
  - { pl: "pałac hrabiego", ru: "графский дворец" }
family:
  - { pl: "hrabina", ru: "графиня", relation: derived }
  - { pl: "hrabstwo", ru: "графство", relation: derived, id: hrabstwo }
  - { pl: "arystokrata", ru: "аристократ", relation: root }
etymology: "Из чешского HRABĚ, а оно из древневерхненемецкого GRAVIO, отсюда же немецкое GRAF и русское «граф». H на месте Г — чешская черта."
memory: "Hrabia — граф. Panie hrabio! — господин граф! Hrabina — графиня. Pałac hrabiego — графский дворец. Читается «хра́бя»."
idioms:
  - { pl: "hrabia Monte Christo", ru: "граф Монте-Кристо" }
