notes:
  - { kind: usage, text: "ИМЕНИТЕЛЬНЫЙ МНОЖЕСТВЕННОГО — PASAŻEROWIE, А НЕ «PASAŻERY». Окончание -owie польский держит для мужчин, особенно почтенных или названных по роли: profesorowie, ministrowie, synowie, panowie. Русское «пассажиры» никакой подсказки не даёт, и соблазн сказать «pasażery» велик — а это окончание в польском годится только для неодушевлённых." }
  - { kind: pronunciation, text: "В предложном и звательном падежах r переходит в rz: PASAŻERZE. То же чередование в aktor — aktorze, doktor — doktorze, rower — rowerze. Русское «пассажире» основу не трогает, так что эту мягкость надо держать в голове отдельно." }
  - { kind: usage, text: "Существительное одушевлённое и мужское, поэтому винительный падеж совпадает с родительным: widzę pasażerA. Во множественном то же самое: widzę pasażerÓW. Это общее правило для мужских одушевлённых, и здесь польский с русским полностью сходятся." }
collocations:
  - { pl: "pasażer na gapę", ru: "безбилетник, заяц" }
  - { pl: "pasażerowie lotu", ru: "пассажиры рейса" }
  - { pl: "zabrać pasażera", ru: "взять пассажира" }
family:
  - { pl: "pasażerski", ru: "пассажирский", relation: derived }
  - { pl: "pasaż", ru: "пассаж, галерея", relation: root }
  - { pl: "kierowca", ru: "водитель", relation: antonym, id: kierowca }
etymology: "Из французского passager «проезжий, проходящий», от passer «проходить», пришедшего через немецкий. Русский «пассажир» взял то же слово той же дорогой, поэтому корень совпадает буква в букву. Родственное польское pasaż «пассаж, крытая галерея» показывает исходный смысл корня: место, где проходят."
memory: "Множественное — PASAŻEROWIE, с окончанием -owie для людей, а не «pasażery». И предложный с мягким rz: o pasażerze, как o aktorze."
idioms:
  - { pl: "pasażer na gapę", ru: "безбилетник, заяц" }
  - { pl: "milczący pasażer", ru: "молчаливый попутчик" }
