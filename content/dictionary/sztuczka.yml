# review
id: sztuczka
format: 2
lemma: "sztuczka"
rank: 1718
pos: noun
pron: { cyr: "шту́чка" }
senses:
  - id: trick
    ru: "фокус, трюк"
    examples:
      - pl: "To sztuczka."
        ru: "Это фокус."
        source: { kind: translated, id: 8314385 }
      - pl: "Chcesz zobaczyć sztuczkę?"
        ru: "Хочешь увидеть фокус?"
        source: { kind: translated, id: 4837811 }
