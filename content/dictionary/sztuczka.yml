  - id: ruse
    ru: "уловка, хитрость"
    examples:
      - pl: "To stara sztuczka."
        ru: "Это старый трюк."
        source: { kind: translated, id: 369101 }
      - pl: "Policja odkryła ich sztuczki."
        ru: "Полиция раскрыла их уловки."
        source: { kind: translated, id: 4725777 }
notes:
  - { kind: false-friend, text: "sztuczka — уменьшительное от sztuka, но значит не «штучка», а «фокус, трюк, уловка». Само sztuka — это «искусство», «штука» и «пьеса»." }
  - { kind: usage, text: "magiczna sztuczka — «фокус»; sztuczki karciane — «карточные фокусы»." }
  - { kind: usage, text: "Во множественном числе часто «уловки, хитрости»: odkryli ich sztuczki «раскрыли их уловки»." }
  - { kind: usage, text: "Пословица: Starego psa nie nauczy się nowych sztuczek — «старую собаку новым трюкам не научишь»." }
collocations:
  - { pl: "magiczna sztuczka", ru: "фокус" }
  - { pl: "stara sztuczka", ru: "старый трюк" }
  - { pl: "sztuczki karciane", ru: "карточные фокусы" }
family:
  - { pl: "sztuka", ru: "искусство, штука, пьеса", relation: root, id: sztuka }
  - { pl: "sztuczny", ru: "искусственный", relation: root }
etymology: "Уменьшительное от sztuka, заимствованного из немецкого Stück «кусок, штука». Русское «штука» — то же немецкое слово, но значение «фокус» развилось только в польском."
memory: "sztuczka — не «штучка», а «фокус, трюк, уловка»: magiczna sztuczka «фокус», stara sztuczka «старый трюк». Большое слово sztuka значит «искусство»."
idioms:
  - { pl: "stara sztuczka", ru: "старый трюк" }
  - { pl: "magiczna sztuczka", ru: "фокус" }
  - { pl: "nie ucz starego psa nowych sztuczek", ru: "старую собаку новым трюкам не научишь" }
formExamplesSkip:
  - { form: "sztuczko", reason: "звательная форма, в корпусе примеров нет" }
