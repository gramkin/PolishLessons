notes:
  - { kind: false-friend, text: "TRZYDZIEŚCI — «тридцать»: TRZY + DZIEŚCI, «три десятка». Окончание -DZIEŚCI, а не -DZIEŚCIA, как в DWADZIEŚCIA: с двадцатью и с тридцатью-сорока польский поступает по-разному. О мужчинах — TRZYDZIESTU." }
  - { kind: usage, text: "Косвенные падежи — TRZYDZIESTU, творительный — TRZYDZIESTOMA. TRZYDZIESTU — ещё и счёт мужчин. Собирательное TRZYDZIEŚCIORO — для детей и смешанных групп. TRZYDZIESTO- — первая часть сложных слов: TRZYDZIESTOLETNI." }
  - { kind: government, text: "Требует родительного множественного: TRZYDZIEŚCI DNI, TRZYDZIEŚCI ZŁOTYCH. Глагол в прошедшем — средний род: MINĘŁO TRZYDZIEŚCI LAT. С единицей: TRZYDZIEŚCI JEDEN, TRZYDZIEŚCI DWA." }
  - { kind: pronunciation, text: "Читается «тшыдзе́сьци»: TRZ — «тш», DZIE — «дзе», ŚCI — «сьци». Ударение на предпоследнем слоге. TRZYDZIESTU — «тшыдзе́сту»." }
  - { kind: register, text: "Нейтральное слово. TRZYDZIESTKA — разговорное «тридцатник» о возрасте: STUKNĘŁA MU TRZYDZIESTKA «ему стукнуло тридцать»." }
collocations:
