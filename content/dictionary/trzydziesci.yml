etymology: "Праславянское *tri desęti «три десятка», как русское «тридцать». Польский сохранил старое окончание множественного -I: TRZYDZIEŚCI."
memory: "Trzydzieści — «три десятки»: trzydzieści lat. Не trzydzieścia! О мужчинах — trzydziestu, о детях — trzydzieścioro."
idioms:
  - { pl: "stuknęła mu trzydziestka", ru: "ему стукнуло тридцать" }
