notes:
  - { kind: false-friend, text: "MIESZANKA — «смесь», от MIESZAĆ «мешать, смешивать». Это не «мешанина»: беспорядок по-польски BAŁAGAN или MISZMASZ. MIESZANKA STUDENCKA, «студенческая смесь», — это орехи с изюмом." }
  - { kind: usage, text: "Девять форм, женский род. Перед E K переходит в C: W MIESZANCE. Родительный множественного — MIESZANEK, с беглым E. Звательного падежа у вещи нет." }
  - { kind: government, text: "Смесь чего — родительный, как в русском: MIESZANKA STRACHU I CIEKAWOŚCI, «смесь страха и любопытства». Из смеси — Z MIESZANKI. Посыпать смесью — POSYPAĆ MIESZANKĄ, творительный." }
  - { kind: pronunciation, text: "Читается «меша́нка», ударение на предпоследнем слоге. MIE — «ме», как в MIESZAĆ «ме́шаць». SZ — твёрдое «ш»." }
  - { kind: register, text: "Слово нейтральное: на кухне, в магазине, в технике. В переносном смысле — о людях, стилях и чувствах: WYBUCHOWA MIESZANKA, «гремучая смесь»." }
collocations:
