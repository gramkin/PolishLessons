etymology: "От MIESZAĆ «мешать» с суффиксом -ANKA, как PISANKA от PISAĆ. Польскому IE соответствует русское «е»: MIESZAĆ — «мешать», MIESZANKA — «смесь»."
memory: "Mieszanka — смесь, от mieszać «мешать». Читается «меша́нка». Mieszanka studencka — орехи с изюмом. Wybuchowa mieszanka — гремучая смесь."
idioms:
  - { pl: "wybuchowa mieszanka", ru: "гремучая смесь" }
