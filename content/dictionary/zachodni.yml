notes:
  - { kind: false-friend, text: "ZACHÓD, КАК И WSCHÓD, ЗНАЧИТ СРАЗУ ДВЕ ВЕЩИ. Это и «запад», и «закат»: zachód słońca — «закат солнца». Симметрия полная: wschód это «восток» и «восход». Русский в каждой паре пользуется двумя словами, польский одним, и обе стороны света названы по движению солнца." }
  - { kind: usage, text: "Прилагательное мягкой основы, поэтому форм у него десять, а не одиннадцать: zachodni служит и мужским единственным, и мужско-личным множественным — zachodni sąsiad и zachodni sąsiedzi. Точно так же устроено wschodni. Глагол ZACHODZIĆ значит «заходить» и «заходить о солнце»." }
  - { kind: pronunciation, text: "Три слога, ударение на предпоследнем: za-CHO-dni. Ch читается как х, dni как мягкое днь: «захо́дні». В отличие от wschodni, начального оглушения здесь нет." }
collocations:
  - { pl: "Europa Zachodnia", ru: "Западная Европа" }
  - { pl: "zachód słońca", ru: "закат солнца" }
  - { pl: "granica zachodnia", ru: "западная граница" }
family:
  - { pl: "zachód", ru: "запад; закат", relation: root, id: zachod }
  - { pl: "wschodni", ru: "восточный", relation: antonym, id: wschodni }
  - { pl: "zachodzić", ru: "заходить", relation: root }
etymology: "От zachód «запад, закат», из za- и корня chod-, того же, что в chodzić «ходить» и русском «заход». Сторона света названа по заходу солнца, ровно как wschód по восходу. Русский развёл эти смыслы на «запад» и «заход», а польский оставил одно слово."
memory: "zachodni — «западный», от zachód, которое значит и «запад», и «закат» — в точности как wschód значит «восток» и «восход». Прилагательное мягкой основы: десять форм, zachodni и в единственном, и в мужско-личном множественном."
idioms:
