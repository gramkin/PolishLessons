etymology: "Праславянское *xvatiti «схватить», от которого русские «хватать», «схватить», «хватка», «охапка». Польский развил ту же основу с гласной Y: CHWYCIĆ при несовершенном CHWYTAĆ, и чередование Y с A здесь такое же, как в русском «схватить» и «схватывать». Начальное CH- отвечает русскому Х- закономерно, без исключений: CHWYT и «хват», CHMURA и «хмурый», CHLEB и «хлеб». Существительное CHWILA «минута, мгновение» того же гнезда не является: оно восходит к другому корню со значением «время, срок», хотя созвучие сбивает с толку."
memory: "Корень тот же, что в «хватать»: chwycić za rękę «схватить за руку», chwycić byka za rogi «взять быка за рога». Но русское «хватит» в смысле достаточности сюда не переводится — это wystarczy. Произношение: chw звучит как «хф», потому что w после глухого ch оглушается, отсюда «хфы́чичь» и «хфи́ля» для chwila. Возвратное chwycić się требует родительного: chwyciła się poręczy."
idioms:
