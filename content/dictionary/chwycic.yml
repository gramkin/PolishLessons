notes:
  - { kind: false-friend, text: "Корень тот же, что в русском «хватать», и в прямом значении оба языка совпадают: CHWYCIĆ ZA RĘKĘ это «схватить за руку». Но русское «хватить» умеет ещё значить «быть достаточным» — «хватит!», «денег не хватило», — и вот этого у польского CHWYCIĆ нет совсем. Достаточность по-польски выражают WYSTARCZYĆ и STARCZYĆ: WYSTARCZY «хватит, достаточно», NIE STARCZYŁO PIENIĘDZY «денег не хватило». Сказать по-польски NIE CHWYCIŁO PIENIĘDZY нельзя, это бессмыслица." }
  - { kind: pronunciation, text: "Читается «хфы́чичь». Главная ловушка — сочетание CHW: звонкое W после глухого CH оглушается и звучит как «ф», поэтому CHWYCIĆ это «хфы́чичь», а знаменитое CHWILA — «хфи́ля». Писать «хв» привычно по русскому образцу, но слышно именно «хф». Буква Y даёт звук между русскими «ы» и «и», ближе к «ы». Конечное Ć мягкое, «чь». В страдательном причастии CHWYCONY слышно «хфыцо́ны»: перед O буква C читается как «ц», а не как «ч»." }
  - { kind: government, text: "Прямое дополнение в винительном: CHWYCIĆ LINĘ, CHWYCIĆ WALIZKĘ. Часть тела, за которую хватают, идёт с предлогом ZA и винительным — ровно как по-русски: CHWYCIĆ KOGOŚ ZA RĘKĘ «схватить кого-то за руку», CHWYCIĆ ZA GARDŁO «схватить за горло». Оборот CHWYCIĆ ZA COŚ без лица значит «взяться за что-то, приняться»: CHWYCIĆ ZA BROŃ «взяться за оружие», CHWYCIĆ ZA ŁOPATY «взяться за лопаты». Возвратное CHWYCIĆ SIĘ CZEGOŚ требует родительного: CHWYCIŁA SIĘ PORĘCZY «она схватилась за перила», и здесь падежи расходятся — русский просит «за» с винительным." }
  - { kind: usage, text: "Несовершенный партнёр — CHWYTAĆ, и пара строится как русская «хватать» и «схватить». Переносные значения стоит знать отдельно: KLEJ CHWYCIŁ «клей схватился», MRÓZ CHWYCIŁ «ударил мороз», а про удачную идею говорят POMYSŁ CHWYCIŁ «задумка пошла, сработала». Пятьдесят три формы — подпись переходного глагола совершенного вида. В повелительном наклонении основа смягчается: CHWYĆ, CHWYĆMY, CHWYĆCIE." }
  - { kind: register, text: "Слово нейтральное и очень частотное. Устойчивые обороты почти все имеют русский двойник: CHWYCIĆ BYKA ZA ROGI «взять быка за рога», CHWYCIĆ SIĘ ZA GŁOWĘ «схватиться за голову», CHWYCIĆ KOGOŚ NA GORĄCYM UCZYNKU «поймать с поличным». Родственные слова широко в ходу: CHWYT «хватка, приём», UCHWYT «ручка, рукоятка», CHWYTLIWY «цепкий, броский». Существительное CHWYT в спорте и в споре значит «приём»: ZAKAZANY CHWYT «запрещённый приём»." }
