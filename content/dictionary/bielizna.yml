notes:
  - { kind: pronunciation, text: "Дательный и предложный — BIELIŹNIE, со смягчением zn в źn. Это второе слово такого рода в словаре после trucizna — truciźnie, и правило то же: все основы на -zna смягчаются одинаково, ojczyzna — ojczyźnie, blizna — bliźnie. Русский здесь ничего не смягчает, поэтому форму приходится ставить сознательно." }
  - { kind: usage, text: "Слово собрано ровно так же, как русское «бельё»: от BIAŁY «белый», потому что холст был белым. Совпадение полное, вплоть до мысли. Но делят языки по-разному: польская BIELIZNA по умолчанию нижнее бельё, а постельное называют bielizna pościelowa или просто POŚCIEL. Сказать о постели одно слово bielizna можно, только когда из разговора ясно, о чём речь." }
