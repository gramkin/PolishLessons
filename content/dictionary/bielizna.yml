  - { pl: "bielić", ru: "белить", relation: root }
  - { pl: "bieliźniany", ru: "бельевой", relation: derived }
etymology: "От BIAŁY «белый», с суффиксом -izna, который в польском образует названия веществ и совокупностей: trucizna, ojczyzna, starszyzna. Русское «бельё» построено от того же прилагательного и по той же причине — холст отбеливали, и ткань называли по цвету. Это один из тех случаев, где два языка независимо пришли к одному слову."
memory: "Предложный смягчается: w BIELIŹNIE, как w truciźnie. А корень тот же, что у нас: bielizna от biały, «бельё» от «белого»."
