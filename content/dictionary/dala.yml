# review
id: dala
format: 2
lemma: "dala"
rank: 1300
pos: part
pron: { cyr: "да́ля" }
senses:
  - id: keep-away
    ru: "z dala od czegoś — подальше от чего-то"
    examples:
      - pl: "Trzymaj się z dala od tego durnia."
        ru: "Держись от этого дурака подальше."
        source: { kind: tatoeba, id: 13784950 }
      - pl: "Trzymaj się z dala ode mnie."
        ru: "Держись от меня подальше."
        source: { kind: translated, id: 563617 }
      - pl: "Trzymaj zapałki z dala od dzieci."
        ru: "Держи спички подальше от детей."
        source: { kind: translated, id: 925902 }
  - id: at-a-distance
    ru: "z dala — в стороне, поодаль"
    examples:
      - pl: "Powinieneś był się trzymać z dala."
        ru: "Тебе следовало держаться в стороне."
        source: { kind: translated, id: 3520317 }
      - pl: "Trzymam się z dala od szaleńców."
        ru: "Я держусь подальше от сумасшедших."
        source: { kind: translated, id: 13859778 }
      - pl: "Trzymaj się z dala od złego towarzystwa."
        ru: "Держись подальше от дурной компании."
        source: { kind: translated, id: 639708 }
notes:
  - { kind: usage, text: "Слово существует практически только в обороте z dala «поодаль, подальше». Самостоятельным существительным оно не бывает." }
  - { kind: government, text: "z dala od czegoś «подальше от чего-то» — предлог od с родительным падежом: z dala od dzieci." }
  - { kind: usage, text: "Главная конструкция — trzymać się z dala od czegoś «держаться подальше от чего-то». Именно в ней слово и встречается." }
  - { kind: pronunciation, text: "l перед a мягкое: да́ля. Родственное daleko «далеко» звучит «дале́ко»." }
collocations:
  - { pl: "z dala od", ru: "подальше от" }
  - { pl: "trzymać się z dala", ru: "держаться подальше" }
  - { pl: "z dala od dzieci", ru: "подальше от детей" }
etymology: "Застывший родительный падеж от dal «даль», из праславянского *dalь. Русское «издали» и «вдали» образованы от того же слова тем же способом."
memory: "dala живёт практически только в обороте z dala «поодаль, подальше»: trzymać się z dala od czegoś «держаться подальше от чего-то». Корень тот же, что в русской «дали» и «далеко»."
idioms:
  - { pl: "z dala od", ru: "подальше от" }
  - { pl: "trzymać się z dala", ru: "держаться подальше" }
  - { pl: "z dala od dzieci", ru: "подальше от детей" }
