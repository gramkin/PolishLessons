# review
id: dziewczyna
format: 2
lemma: "dziewczyna"
rank: 158
pos: noun
pron: { cyr: "дзефчы́на" }
senses:
  - id: girl
    ru: "девушка, девочка"
    examples:
      - pl: "Dziewczyna ją lubi."
        ru: "Девушка её любит."
        source: { kind: tatoeba, id: 13785884 }
      - pl: "Dziewczyna boi się psów."
        ru: "Девочка боится собак."
        source: { kind: tatoeba, id: 4921607 }
      - pl: "To bardzo miła dziewczyna."
        ru: "Она очень милая девушка."
        source: { kind: tatoeba, id: 10747405 }
  - id: girlfriend
    ru: "девушка (подруга, возлюбленная)"
    examples:
      - pl: "Tom miał wiele dziewczyn."
        ru: "У Тома было много девушек."
        source: { kind: tatoeba, id: 3432929 }
      - pl: "Znam tę dziewczynę."
        ru: "Я знаю эту девушку."
        source: { kind: tatoeba, id: 360968 }
      - pl: "To moja dziewczyna."
        ru: "Это моя девушка."
        source: { kind: authored }
notes:
  - { kind: usage, text: "dziewczyna — и «девушка» вообще, и «девушка» в значении подруги: moja dziewczyna «моя девушка»." }
  - { kind: usage, text: "О маленькой девочке чаще говорят dziewczynka; dziewczyna — уже подросток и старше." }
collocations:
  - { pl: "moja dziewczyna", ru: "моя девушка" }
  - { pl: "młoda dziewczyna", ru: "молодая девушка" }
  - { pl: "ładna dziewczyna", ru: "красивая девушка" }
etymology: "От dziewa «дева» с суффиксом -czyna; тот же корень, что в русских «дева» и «девушка»."
memory: "Три ступени: dziewczynka «девочка», dziewczyna «девушка», kobieta «женщина». И moja dziewczyna значит «моя девушка» в смысле подруги — как в русском."
idioms:
  - { pl: "dziewczyna do towarzystwa", ru: "компаньонка" }
  - { pl: "swoja dziewczyna", ru: "своя в доску" }
  - { pl: "dziewczyna z sąsiedztwa", ru: "девушка по соседству" }
