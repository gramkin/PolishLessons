etymology: "Приставка pod- и PISAĆ «писать», из праславянского *pisati — того же корня, что русское «писать», и в родстве с латинским pingere «изображать», откуда «пигмент» и «пиктура». Слово собрано в точности как русская «подпись», морфема за морфемой, и расходятся языки только в роде: польский сделал отглагольное существительное мужским, русский — женским, и так же разошлась вся группа napis, zapis, opis."
memory: "Мужского рода, в отличие от русской «подписи»: ten podpis był. И так же napis, zapis — все мужские."
idioms:
