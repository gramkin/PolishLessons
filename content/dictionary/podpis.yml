notes:
  - { kind: false-friend, text: "Ловушка в роде, и она касается целой группы слов. Русская «подпись» женского рода, польский PODPIS — мужского: PODPIS BYŁ NIECZYTELNY, MÓJ PODPIS, TEN PODPIS. Русскому глазу окончание подсказывает женский род, потому что русские слова на -ись женские все до одного, и согласование срывается автоматически. Группа же такая: podpis при «подписи», NAPIS при «надписи», ZAPIS при «записи» — по-польски все мужские, по-русски все женские. Выучив одно, получаете три." }
  - { kind: usage, text: "Местный падеж — PODPISIE: твёрдое s смягчается перед окончанием -e, как в stresie и rasie. Родительный — PODPISU с окончанием -u, как pliku, dymu и produktu, а не -a, как zegara из этой же партии. Напомню, что выбор между -a и -u у мужских неодушевлённых лексический: по виду слова его не вычислить, и обе формы приходится помнить за словом." }
  - { kind: pronunciation, text: "Произносится «по́тпис»: d перед глухим p оглушается в t. Это общее правило польской фонетики, и русский делает то же самое в «подпись», где тоже звучит «потпись», — так что переучивать нечего, достаточно знать, что написание d сохраняется, хотя слышится t. Приставка POD- ведёт себя так всегда: podpisać, podkreślić, podchodzić." }
