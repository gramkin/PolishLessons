  - id: pesticide
    ru: "отрава, ядохимикат"
    examples:
      - pl: "Trucizna na szczury stoi w szopie."
        ru: "Крысиный яд стоит в сарае."
        source: { kind: authored }
      - pl: "Kupił truciznę na krety."
        ru: "Он купил яд от кротов."
        source: { kind: authored }
notes:
  - { kind: pronunciation, text: "Дательный и предложный — TRUCIŹNIE, где zn смягчается в źn. Это общее правило для основ на -zna: bielizna — bieliźnie, ojczyzna — ojczyźnie, blizna — bliźnie. Русскому здесь подсказки нет, у нас «в отчизне» никакого смягчения не происходит, и форма с ź выглядит неожиданно." }
  - { kind: usage, text: "Польский делит то, что русский называет одним словом. TRUCIZNA — это яд как вещество, которым травят: trucizna na szczury, podać truciznę. JAD — яд животного, змеи или осы: jad żmii, jad pszczeli. Русский «яд» покрывает оба случая, и выбрать польское слово можно только по источнику. Любопытно, что польское jad и наш «яд» — одно слово, из праславянского *ědъ, того же корня, что «еда»: яд когда-то был просто тем, что съедено." }
collocations:
  - { pl: "podać truciznę", ru: "дать яд" }
  - { pl: "śmiertelna trucizna", ru: "смертельный яд" }
  - { pl: "trucizna na szczury", ru: "крысиный яд" }
family:
  - { pl: "truć", ru: "травить, отравлять", relation: root }
  - { pl: "otruć", ru: "отравить", relation: derived }
  - { pl: "trujący", ru: "ядовитый", relation: derived }
etymology: "От глагола TRUĆ «травить, отравлять», с суффиксом -izna, который в польском образует названия веществ и свойств: bielizna, ojczyzna, starszyzna. Русский для этого понятия взял другие слова — «яд» и «отраву», — так что совпадения тут нет, зато суффикс -izna узнаётся легко: он тот же, что в нашей «отчизне»."
memory: "Предложный смягчается: w TRUCIŹNIE, как w bieliźnie. И яд животного — это не trucizna, а jad."
idioms:
  - { pl: "sączyć truciznę", ru: "источать яд, злословить" }
  - { pl: "trucizna na szczury", ru: "крысиный яд" }
