rank: 2703
pos: noun
pron: { cyr: "труци́зна" }
senses:
  - id: poison
    ru: "яд, отрава"
    examples:
      - pl: "Trucizna działała powoli."
        ru: "Яд действовал медленно."
        source: { kind: authored }
      - pl: "Podał truciznę w herbacie."
        ru: "Он подал яд в чае."
        source: { kind: authored }
