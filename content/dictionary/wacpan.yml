# review
id: wacpan
format: 2
lemma: "waćpan"
rank: 5842
pos: noun
pron: { cyr: "ва́цьпан" }
senses:
  - id: sir
    ru: "ваша милость, сударь (уст. вежливое обращение шляхты)"
    examples:
      - pl: "Waćpan chyba raczy żartować!"
        ru: "Ваша милость, верно, изволит шутить!"
        source: { kind: authored }
      - pl: "Czego waćpan sobie życzy?"
        ru: "Чего угодно вашей милости?"
        source: { kind: authored }
      - pl: "Proszę waćpana do stołu."
        ru: "Прошу вашу милость к столу."
        source: { kind: authored }
  - id: ironic
    ru: "сударь (сегодня шутл. или ирон.)"
    examples:
      - pl: "- Wielmożny panie, jest pan imperialistą! - Waćpan zaś jest trollem!"
        ru: "— Ясновельможный пан, вы империалист! — А ваша милость — тролль!"
        source: { kind: translated, id: 1350793 }
      - pl: "A waćpan to niby kto, żeby mnie pouczać?"
        ru: "А вы, сударь, кто такой, чтобы меня поучать?"
        source: { kind: authored }
notes:
  - { kind: register, text: "Устаревшее слово, обращение шляхтича к равному в XVII–XVIII веках; его хорошо знают по романам Сенкевича («Трилогия»). Сегодня звучит только в исторических текстах, на сцене или в шутку, с оттенком старомодной церемонности." }
  - { kind: usage, text: "Как и современное PAN, WAĆPAN требует глагола в третьем лице: WAĆPAN RACZY ŻARTOWAĆ «ваша милость изволит шутить», а не *WAĆPAN RACZYSZ. При прямом обращении употребляется звательный WAĆPANIE. Женские пары — WAĆPANI «сударыня» и WAĆPANNA «барышня»." }
  - { kind: pronunciation, text: "Читается «ва́цьпан»: Ć — мягкое «ць», ударение на первом слоге. Во множественном WAĆPANOWIE — «вацьпано́вье»." }
collocations:
  - { pl: "waćpan raczy", ru: "ваша милость изволит" }
  - { pl: "proszę waćpana", ru: "прошу вашу милость" }
  - { pl: "waćpan wybaczy", ru: "простите, ваша милость" }
family:
  - { pl: "pan", ru: "господин, пан", relation: root, id: pan }
  - { pl: "waszmość", ru: "ваша милость", relation: root }
  - { pl: "waćpani", ru: "сударыня", relation: derived }
  - { pl: "waćpanna", ru: "барышня", relation: derived }
etymology: "Сокращение от WASZMOŚĆ PAN, а WASZMOŚĆ, в свою очередь, сжато из WASZA MIŁOŚĆ «ваша милость»."
memory: "Waćpan = wa(szmość) + pan, «ваша милость пан». Глагол — в третьем лице, как с pan: waćpan raczy żartować."
idioms:
  - { pl: "waćpan raczy żartować", ru: "ваша милость изволит шутить (о явной нелепости)" }
formExamples:
