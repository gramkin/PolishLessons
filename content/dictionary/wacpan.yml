  - form: "waćpana"
    pl: "Nie widziałem waćpana od wiosny."
    ru: "Я не видел вашей милости с весны."
    source: { kind: authored }
  - form: "waćpana"
    pl: "Pan hetman prosi waćpana do namiotu."
