# review
id: mebel
format: 2
lemma: "mebel"
rank: 3802
pos: noun
pron: { cyr: "мэ́бэль" }
senses:
  - id: piece
    ru: "предмет мебели"
    examples:
      - pl: "Szafa to największy mebel w pokoju."
        ru: "Шкаф — самый большой предмет мебели в комнате."
        source: { kind: authored }
      - pl: "Ten stolik to mój ulubiony mebel."
        ru: "Этот столик — мой любимый предмет мебели."
        source: { kind: authored }
      - pl: "Każdy mebel trzeba było wnieść na czwarte piętro."
        ru: "Каждый предмет мебели пришлось заносить на пятый этаж."
        source: { kind: authored }
  - id: furniture
    ru: "мебель (MEBLE, мн.)"
    examples:
      - pl: "Meble kuchenne zamówiliśmy na wymiar."
        ru: "Кухонную мебель мы заказали по размерам."
        source: { kind: authored }
      - pl: "Ile kosztowały te meble?"
        ru: "Сколько стоила эта мебель?"
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "MEBEL — это один предмет: стол, шкаф, кресло. Русская «мебель» как совокупность — польское множественное MEBLE: KUPILIŚMY NOWE MEBLE, «мы купили новую мебель». Говорить NOWY MEBEL о всей обстановке нельзя." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Беглое E: MEBEL, но MEBLA, MEBLE. Родительный множественного — MEBLI. Глаголы при MEBLE стоят во множественном: MEBLE PRZYJADĄ W PIĄTEK." }
  - { kind: government, text: "Мебель для чего — DO с родительным: MEBLE DO KUCHNI, MEBLE DO SYPIALNI. Обставить мебелью — UMEBLOWAĆ, творительный: UMEBLOWANY STARYMI MEBLAMI." }
  - { kind: pronunciation, text: "Читается «мэ́бэль», ударение на первом слоге. ME и BE твёрдые: «мэ», «бэ». В форме MEBLE: «мэ́блэ»." }
collocations:
  - { pl: "nowe meble", ru: "новая мебель" }
  - { pl: "meble kuchenne", ru: "кухонная мебель" }
  - { pl: "sklep meblowy", ru: "мебельный магазин" }
family:
  - { pl: "meblowy", ru: "мебельный", relation: derived }
  - { pl: "umeblować", ru: "обставить мебелью", relation: derived }
  - { pl: "umeblowanie", ru: "обстановка, мебель", relation: derived }
etymology: "Из французского слова со значением «движимое имущество», через немецкий. Исходно латинское «подвижный»: мебель — то, что можно передвинуть, в отличие от дома. Русская «мебель» — из того же источника."
memory: "Mebel — один предмет мебели; meble — мебель. Читается «мэ́бэль». Kupiliśmy nowe meble — мы купили новую мебель. Umeblować — обставить."
idioms:
  - { pl: "należeć do inwentarza", ru: "быть частью обстановки (шутл., о человеке)" }
