# review
id: numer
format: 2
lemma: "numer"
rank: 369
pos: noun
pron: { cyr: "ну́мэр" }
senses:
  - id: number
    ru: "номер (телефона, дома, комнаты)"
    examples:
      - pl: "Zapisałeś numer telefonu?"
        ru: "Ты записал номер телефона?"
        source: { kind: tatoeba, id: 372408 }
      - pl: "Jaki jest numer pańskiego pokoju?"
        ru: "Какой номер вашей комнаты?"
        source: { kind: tatoeba, id: 366664 }
      - pl: "Mieszkam w domu numer trzy na ulicy Zamenhofa."
        ru: "Я живу в доме номер три на улице Заменгофа."
        source: { kind: tatoeba, id: 13785900 }
  - id: issue-trick
    ru: "номер (издания); разговорное — выходка, фокус"
    examples:
      - pl: "Dokąd kursuje tramwaj numer trzy?"
        ru: "Куда идёт трамвай номер три?"
        source: { kind: tatoeba, id: 10138175 }
      - pl: "Chciałem do ciebie zadzwonić, ale nie miałem twojego numeru."
        ru: "Я хотел тебе позвонить, но у меня не было твоего номера."
        source: { kind: tatoeba, id: 3428060 }
      - pl: "Jaki jest twój nowy numer telefonu?"
        ru: "Какой у тебя новый номер телефона?"
        source: { kind: tatoeba, id: 4834436 }
notes:
  - { kind: usage, text: "numer telefonu — «номер телефона», numer domu — «номер дома», numer pokoju — «номер комнаты»." }
  - { kind: usage, text: "Второе значение — «номер журнала»: w tym numerze «в этом номере»." }
  - { kind: register, text: "Разговорное Co to za numery? значит «Что это за фокусы?» — о выходках, а не о цифрах." }
  - { kind: usage, text: "wykręcić numer — «набрать номер» (о старом дисковом телефоне)." }
collocations:
  - { pl: "numer telefonu", ru: "номер телефона" }
  - { pl: "numer domu", ru: "номер дома" }
  - { pl: "wykręcić numer", ru: "набрать номер" }
  - { pl: "co to za numery", ru: "что за фокусы" }
etymology: "Из латинского numerus «число»; в русский «номер» пришёл тем же путём, через немецкое посредство."
memory: "numer — «номер» во всех смыслах: телефона, дома, журнала. А разговорное Co to za numery? значит «Что это за фокусы?»."
idioms:
  - { pl: "wykręcić numer", ru: "набрать номер" }
  - { pl: "numer telefonu", ru: "номер телефона" }
  - { pl: "być tylko numerem", ru: "быть просто номером" }
