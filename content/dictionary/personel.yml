etymology: "Из французского PERSONNEL «личный состав», от PERSONNE «лицо, человек», а то — из латинского persona, которое сначала значило театральную маску. Русский «персонал» пришёл тем же путём и в то же время, так что слова совпадают. Отсюда же «персона», «персонаж» и польское personalia «личные данные» — все от одной латинской маски."
memory: "Форма personelu за три падежа. Множественное personele есть и значит персонал нескольких учреждений порознь — по-русски так не скажешь."
