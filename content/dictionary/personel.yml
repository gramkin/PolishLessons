notes:
  - { kind: usage, text: "Слово собирательное, но множественное число у него есть, и это для русского неожиданно. PERSONELE — именительный множественного, PERSONELI — родительный. Смысл у таких форм один возможный: несколько отдельных коллективов, персонал нескольких учреждений порознь. PERSONELE OBU SZPITALI значит «персонал обеих больниц», причём как два отдельных состава. Русское «персонал» так не употребляется: приходится оставлять единственное и говорить «персонал двух больниц»." }
  - { kind: usage, text: "Форма PERSONELU служит родительным, местным и звательным падежом сразу — та же тройная работа, что у PLACU из этой же партии и у PLIKU, NAPOJU, BAGAŻU. Основа кончается на l, то есть мягкая, и окончание -u в родительном для неё обычно. Множественное при этом берёт -e: personele, как place, bagaże, grosze." }
  - { kind: usage, text: "Род у слова мужской неодушевлённый, хотя обозначает оно людей. Грамматика идёт за словом, а не за тем, что оно значит, поэтому согласование будет неодушевлённым: PERSONEL ZEBRAŁ SIĘ, а не zebrali się. Русский поступает точно так же со своим «персоналом» — «персонал собрался», — так что ошибиться трудно, но помнить стоит: в польском это касается всех собирательных названий людей, вроде tłum или zespół." }
