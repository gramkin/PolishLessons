# review
id: zwyknac
format: 2
lemma: "zwyknąć"
rank: 2287
pos: verb
aspect: imperf
pron: { cyr: "звы́кнонць" }
senses:
  - id: used-to
    ru: "иметь обыкновение (zwykł + инфинитив)"
    examples:
      - pl: "Mój ojciec zwykł wstawać o szóstej, nawet zimą."
        ru: "Мой отец имел обыкновение вставать в шесть, даже зимой."
        source: { kind: translated, id: 352455 }
      - pl: "Zwykł pracować codziennie dwie godziny w ogrodzie."
        ru: "Он имел обыкновение работать в саду по два часа в день."
        source: { kind: translated, id: 940917 }
      - pl: "Zwykłem wcześnie wstawać."
        ru: "Я имел обыкновение рано вставать."
        source: { kind: translated, id: 2287209 }
  - id: habit
    ru: "привыкнуть, повадиться"
    examples:
      - pl: "Nie zwykłem kłamać."
        ru: "Я не имею обыкновения лгать."
        source: { kind: translated, id: 2833586 }
      - pl: "Zwykłam grać z nim w sobotę w tenisa."
        ru: "Я имела обыкновение играть с ним в теннис по субботам."
        source: { kind: translated, id: 2155346 }
notes:
  - { kind: usage, text: "Раздел «Будущее время» пуст не по недосмотру: форм zwyknę, zwykniesz, zwyknie в языке нет, как нет и повелительного zwyknij. Глагол живёт прошедшим временем с инфинитивом — zwykł wstawać — и этим исчерпывается." }
  - { kind: government, text: "Парадигма дефектная: живёт практически только прошедшее время плюс инфинитив — zwykł wstawać «имел обыкновение вставать». Настоящего времени у глагола нет." }
  - { kind: false-friend, text: "Русского однословного соответствия нет: zwykł передаётся оборотом «имел обыкновение» или «бывало». Английское used to — ближайший аналог." }
  - { kind: usage, text: "Осторожно с омонимией: zwykły, zwykła, zwykli — это ещё и формы прилагательного zwykły «обычный, простой», и в корпусе они встречаются именно так." }
  - { kind: usage, text: "Совершенного вида нет; родственное przywyknąć значит «привыкнуть»." }
collocations:
  - { pl: "zwykł mawiać", ru: "имел обыкновение говорить" }
etymology: "Праславянское *vyknǫti «привыкать»; ср. русское «привыкнуть», «обычай», «навык»."
memory: "zwyknąć живёт в прошедшем: zwykł wstawać «имел обыкновение вставать». Настоящего времени нет. Осторожно: zwykły, zwykła — это ещё и прилагательное «обычный»."
idioms:
  - { pl: "zwykł mawiać", ru: "имел обыкновение говорить" }
