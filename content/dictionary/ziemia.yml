# review
id: ziemia
format: 2
lemma: "ziemia"
rank: 329
pos: noun
pron: { cyr: "зе́мя" }
senses:
  - id: ground
    ru: "земля (почва, поверхность)"
    examples:
      - pl: "Na ziemi leży kamień."
        ru: "На земле лежит камень."
        source: { kind: tatoeba, id: 781569 }
      - pl: "Ziemia jest pokryta lasami."
        ru: "Земля покрыта лесами."
        source: { kind: tatoeba, id: 1169895 }
      - pl: "Ziemia jest pokryta śniegiem."
        ru: "Земля покрыта снегом."
        source: { kind: tatoeba, id: 6157423 }
  - id: earth-land
    ru: "Земля (планета); земля, край"
    note: "С большой буквы Ziemia — планета, с маленькой — почва или край."
    examples:
      - pl: "Ziemia krąży wokół Słońca."
        ru: "Земной шар вращается вокруг Солнца."
        source: { kind: tatoeba, id: 709318 }
      - pl: "Mam dużo ziemi."
        ru: "У меня много земли."
        source: { kind: tatoeba, id: 404061 }
      - pl: "Cały cukier spadł na ziemię."
        ru: "Весь сахар упал на землю."
        source: { kind: tatoeba, id: 715934 }
notes:
  - { kind: usage, text: "Планета пишется с большой буквы: Ziemia krąży wokół Słońca. Почва и край — с маленькой." }
  - { kind: usage, text: "Предлоги: na ziemi «на земле», na ziemię «на землю», pod ziemią «под землёй»." }
  - { kind: usage, text: "Во множественном ziemie значит «земли, края»: Inne ziemie, inne obyczaje «Другие земли — другие обычаи»." }
collocations:
  - { pl: "na ziemi", ru: "на земле" }
  - { pl: "pod ziemią", ru: "под землёй" }
  - { pl: "upaść na ziemię", ru: "упасть на землю" }
  - { pl: "trzęsienie ziemi", ru: "землетрясение" }
etymology: "Праславянское *zemja из праиндоевропейского *dhģhem- «земля»; то же слово, что русское «земля»."
memory: "ziemia — «земля» во всех смыслах: почва, край и планета (с большой буквы Ziemia). Падает na ziemię, лежит na ziemi, метро ходит pod ziemią."
idioms:
  - { pl: "sól ziemi", ru: "соль земли" }
  - { pl: "raj na ziemi", ru: "рай на земле" }
  - { pl: "być jak niebo i ziemia", ru: "быть как небо и земля" }
