# review
id: przypadek
format: 2
lemma: "przypadek"
rank: 580
pos: noun
pron: { cyr: "пшыпа́дэк" }
senses:
  - id: case
    ru: "случай"
    note: "w przypadku czegoś «в случае чего-либо» — с родительным."
    examples:
      - pl: "To pojedynczy przypadek."
        ru: "Это единичный случай."
        source: { kind: tatoeba, id: 3078155 }
      - pl: "W ich przypadku była to miłość od pierwszego wejrzenia."
        ru: "В их случае это была любовь с первого взгляда."
        source: { kind: tatoeba, id: 696440 }
      - pl: "W przypadku nieudanego podejścia, odchodzimy w automacie."
        ru: "В случае неудачного захода, уходим на автомате."
        source: { kind: tatoeba, id: 1736693 }
  - id: chance
    ru: "случайность, совпадение"
    note: "Przypadek? Nie wydaje mi się «Совпадение? Не думаю»."
    examples:
      - pl: "Przypadek? Nie wydaje mi się."
        ru: "Совпадение? Не думаю."
        source: { kind: tatoeba, id: 10696842 }
      - pl: "Nasze spotkanie było czystym przypadkiem."
        ru: "Наша встреча была чистой случайностью."
        source: { kind: tatoeba, id: 4725228 }
      - pl: "To odkrycie jest dziełem przypadku."
        ru: "Это открытие — дело случая."
        source: { kind: translated, id: 831735 }
  - id: by-chance
    ru: "przypadkiem — случайно"
    note: "Творительный падеж работает как наречие."
    examples:
      - pl: "Znalazłem tę restaurację przypadkiem."
        ru: "Я случайно нашёл этот ресторан."
        source: { kind: tatoeba, id: 361003 }
      - pl: "Spotkałem ją przypadkiem w pociągu."
        ru: "Я случайно встретил её в поезде."
        source: { kind: tatoeba, id: 5492395 }
      - pl: "Czy to nie jest przypadkiem mięso wołowe?"
        ru: "Это, случайно, не говядина?"
        source: { kind: tatoeba, id: 3744916 }
notes:
  - { kind: government, text: "w przypadku czegoś — «в случае чего-либо», с родительным: w przypadku awarii «в случае аварии». Указательное — w tym przypadku «в этом случае»." }
  - { kind: usage, text: "Творительный przypadkiem значит «случайно»: spotkałem ją przypadkiem «я случайно её встретил». В вопросе смягчает: Czy to nie jest przypadkiem…? «Это, случайно, не…?»" }
  - { kind: usage, text: "Второе значение — грамматический «падеж»: przypadki w języku polskim «падежи в польском языке»." }
  - { kind: usage, text: "Наречие — przypadkiem или przypadkowo «случайно»; прилагательное — przypadkowy «случайный»." }
collocations:
  - { pl: "w przypadku", ru: "в случае" }
  - { pl: "przypadkiem", ru: "случайно" }
  - { pl: "w tym przypadku", ru: "в этом случае" }
  - { pl: "dzieło przypadku", ru: "дело случая" }
family:
  - { pl: "przypadkowy", ru: "случайный", relation: derived }
  - { pl: "przypaść", ru: "прийтись", relation: root }
  - { pl: "przypadkowo", ru: "случайно", relation: derived }
etymology: "От przypaść «прийтись, выпасть» — буквально «то, что выпало»; русское «случай» от «случиться» устроено тем же образом, как и латинское casus от cadere «падать»."
memory: "przypadek — «случай», и у него три хода. Первый: w przypadku czegoś «в случае чего-либо», с родительным, а указательно — w tym przypadku. Второй: «случайность, совпадение» — Przypadek? Nie wydaje mi się. Третий самый полезный: творительный przypadkiem работает как наречие «случайно» — spotkałem ją przypadkiem. И четвёртое, для грамматики: przypadek это ещё и «падеж»."
idioms:
  - { pl: "w przypadku", ru: "в случае" }
  - { pl: "przypadkiem", ru: "случайно" }
  - { pl: "dzieło przypadku", ru: "дело случая" }
formExamplesSkip:
  - { form: "przypadku", cell: "Звательный", reason: "звательный падеж: для неодушевлённого существительного он практически не употребляется" }
