# review
id: odpowiedziec
format: 2
lemma: "odpowiedzieć"
rank: 708
pos: verb
aspect: perf
pron: { cyr: "отпове́дзець" }
senses:
  - id: answer
    ru: "ответить"
    examples:
      - pl: "Możesz odpowiedzieć?"
        ru: "Ты можешь ответить?"
        source: { kind: tatoeba, id: 2405994 }
      - pl: "Nie wiem, co odpowiedzieć."
        ru: "Я не знаю, что ответить."
        source: { kind: tatoeba, id: 3031881 }
      - pl: "Odpowiedz na pytanie."
        ru: "Ответь на вопрос."
        source: { kind: tatoeba, id: 349045 }
  - id: answer-na
    ru: "odpowiedzieć NA coś — ответить на что-л. (винительный)"
    note: "Управление совпадает с русским."
    examples:
      - pl: "Odpowiedziałem na wszystkie pytania Toma."
        ru: "Я ответил на все вопросы Тома."
        source: { kind: tatoeba, id: 4104429 }
      - pl: "Jeszcze nie odpowiedziałeś na moje pytanie."
        ru: "Ты ещё не ответил на мой вопрос."
        source: { kind: tatoeba, id: 3680403 }
      - pl: "Odpowiedzcie, kiedy usłyszycie swoje imię."
        ru: "Отвечайте, когда услышите своё имя."
        source: { kind: translated, id: 352863 }
  - id: reply-that
    ru: "odpowiedzieć, że… — ответить, что…"
    examples:
      - pl: "Odpowiedział, że umie świetnie pływać."
        ru: "Он ответил, что умеет хорошо плавать."
        source: { kind: tatoeba, id: 350808 }
      - pl: "Odpowiedział uśmiechem."
        ru: "Он ответил улыбкой."
        source: { kind: tatoeba, id: 4685044 }
      - pl: "I co ona odpowiedziała?"
        ru: "И что ответила она?"
        source: { kind: tatoeba, id: 13633137 }
  - id: future
    ru: "odpowiem — отвечу"
    examples:
      - pl: "Odpowiem w ciągu trzech dni."
        ru: "Я отвечу в течение трёх дней."
        source: { kind: tatoeba, id: 670387 }
      - pl: "Zaraz ci odpowiem."
        ru: "Сейчас тебе отвечу."
        source: { kind: translated, id: 900904 }
      - pl: "Zanim odpowiemy, dobrze się zastanówmy."
        ru: "Прежде чем ответить, хорошо подумаем."
        source: { kind: translated, id: 645045 }
notes:
  - { kind: government, text: "odpowiedzieć NA coś — с винительным падежом: odpowiedzieć na pytanie «ответить на вопрос», odpowiedzieć na list «ответить на письмо». Русское управление то же самое." }
  - { kind: usage, text: "Слово разбирается прозрачно: od- + powiedzieć «сказать», и спрягается так же — odpowiem, odpowiesz, odpowie, odpowiemy, odpowiecie, a в третьем лице множественного odpowiedzą." }
  - { kind: usage, text: "Несовершенный вид odpowiadać умеет больше совершенного: odpowiadać za coś «отвечать за что-то» и odpowiadać komuś «подходить кому-то» — To mi odpowiada «Меня это устраивает»." }
  - { kind: usage, text: "Существительное — odpowiedź «ответ», женского рода: dać odpowiedź, bez odpowiedzi, brak odpowiedzi." }
collocations:
  - { pl: "odpowiedzieć na pytanie", ru: "ответить на вопрос" }
  - { pl: "odpowiedzieć na list", ru: "ответить на письмо" }
  - { pl: "odpowiedzieć twierdząco", ru: "ответить утвердительно" }
  - { pl: "bez odpowiedzi", ru: "без ответа" }
family:
  - { pl: "odpowiadać", ru: "отвечать", relation: aspect }
  - { pl: "odpowiedź", ru: "ответ", relation: derived }
  - { pl: "powiedzieć", ru: "сказать", relation: root }
  - { pl: "odpowiedzialny", ru: "ответственный", relation: derived }
etymology: "od- + powiedzieć «сказать», от wiedzieć «знать». Русское «ответить» собрано похожим образом — от корня «вет» («совет», «привет»)."
memory: "odpowiedzieć разбирается прозрачно: od- + powiedzieć, и спрягается точно так же — odpowiem, odpowiesz, odpowie, а в третьем лице множественного odpowiedzą. Управление совпадает с русским: odpowiedzieć NA pytanie. А несовершенный вид odpowiadać умеет больше: odpowiadać za coś «отвечать за что-то» и To mi odpowiada «Меня это устраивает»."
idioms:
  - { pl: "odpowiedzieć na pytanie", ru: "ответить на вопрос" }
  - { pl: "odpowiedzieć odmownie", ru: "ответить отказом" }
  - { pl: "nie odpowiedzieć ani słowem", ru: "не ответить ни словом" }
formExamplesSkip:
  - { form: "odpowiedzenia", reason: "отглагольного существительного от odpowiedzieć нет; «ответ» — это odpowiedź" }
  - { form: "odpowiedzenie", reason: "отглагольного существительного от odpowiedzieć нет; «ответ» — это odpowiedź" }
  - { form: "odpowiedzeniem", reason: "отглагольного существительного от odpowiedzieć нет; «ответ» — это odpowiedź" }
  - { form: "odpowiedzeniu", reason: "отглагольного существительного от odpowiedzieć нет; «ответ» — это odpowiedź" }
