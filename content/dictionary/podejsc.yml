# review
id: podejsc
format: 2
lemma: "podejść"
rank: 947
pos: verb
aspect: perf
pron: { cyr: "подэ́йщць" }
senses:
  - id: approach
    ru: "подойти (к кому-л., чему-л.)"
    examples:
      - pl: "Podszedł do niej."
        ru: "Он подошёл к ней."
        source: { kind: translated, id: 568247 }
      - pl: "Podszedł do mnie."
        ru: "Он подошёл ко мне."
        source: { kind: translated, id: 611627 }
      - pl: "Wstała i podeszła do okna."
        ru: "Она встала и подошла к окну."
        source: { kind: translated, id: 840269 }
  - id: come-closer
    ru: "podejdź! — подойди!"
    examples:
      - pl: "Podejdź."
        ru: "Подойди."
        source: { kind: translated, id: 12359752 }
      - pl: "Podejdź bliżej."
        ru: "Подойди ближе."
        source: { kind: translated, id: 6327931 }
      - pl: "Proszę tu podejść."
        ru: "Подойдите, пожалуйста, сюда."
        source: { kind: translated, id: 11624902 }
  - id: approach-noun
    ru: "podejście — подход; попытка, заход"
    note: "Существительное значит и «подход» к делу, и «попытку»."
    examples:
      - pl: "To jest nowe podejście."
        ru: "Это новый подход."
        source: { kind: tatoeba, id: 9532932 }
      - pl: "Ona ma podejście do dzieci."
        ru: "У неё есть подход к детям."
        source: { kind: translated, id: 751561 }
      - pl: "Udało mi się za pierwszym podejściem."
        ru: "Мне удалось с первой попытки."
        source: { kind: translated, id: 9805801 }
notes:
  - { kind: government, text: "podejść DO kogoś «подойти к кому-то» — родительный после do, а не дательный: podszedł do niej «он подошёл к ней». Русский требует дательного с предлогом «к»." }
  - { kind: usage, text: "Несовершенный вид — podchodzić. Прошедшее мужского рода нерегулярно, с беглым e: podszedł, podszedłem — как zszedł от zejść." }
  - { kind: usage, text: "Существительное podejście значит и «подход» к задаче (nowe podejście «новый подход»), и «попытку, заход»: za pierwszym podejściem «с первой попытки»." }
  - { kind: usage, text: "mieć podejście do kogoś — «уметь найти подход к кому-то»: Ona ma podejście do dzieci." }
collocations:
  - { pl: "podejdź bliżej", ru: "подойди ближе" }
  - { pl: "podejść do kogoś", ru: "подойти к кому-то" }
  - { pl: "nowe podejście", ru: "новый подход" }
  - { pl: "za pierwszym podejściem", ru: "с первой попытки" }
family:
  - { pl: "podchodzić", ru: "подходить", relation: aspect }
  - { pl: "iść", ru: "идти", relation: root, id: isc }
  - { pl: "podejście", ru: "подход", relation: derived }
etymology: "Из pod- + iść «идти», с беглым e в прошедшем: podszedł. Русское «подойти» собрано ровно так же."
memory: "podejść — «подойти», но управление другое: podejść DO kogoś, с родительным, а не с дательным, как в русском «подойти к кому-то». Прошедшее мужского рода нерегулярно: podszedł. Существительное podejście значит и «подход», и «попытку»."
idioms:
  - { pl: "podejdź bliżej", ru: "подойди ближе" }
  - { pl: "nowe podejście", ru: "новый подход" }
  - { pl: "za pierwszym podejściem", ru: "с первой попытки" }
