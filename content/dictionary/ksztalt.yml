# review
id: ksztalt
format: 2
lemma: "kształt"
rank: 2015
pos: noun
pron: { cyr: "кштаут" }
senses:
  - id: shape
    ru: "форма, очертание"
    examples:
      - pl: "Ziemia ma kształt pomarańczy."
        ru: "Земля имеет форму апельсина."
        source: { kind: translated, id: 356988 }
      - pl: "Ziemia ma kształt piłki."
        ru: "Земля имеет форму мяча."
        source: { kind: translated, id: 12334708 }
      - pl: "Ta skała ma kształt zwierzęcia."
        ru: "Эта скала имеет форму животного."
        source: { kind: translated, id: 361671 }
  - id: form
    ru: "вид, облик (в каком-л. виде)"
    examples:
      - pl: "Dziadek utworzył firmę w obecnym kształcie."
        ru: "Дед создал фирму в её нынешнем виде."
        source: { kind: translated, id: 366569 }
      - pl: "Ta chmura jest w kształcie ryby."
        ru: "Это облако в форме рыбы."
        source: { kind: translated, id: 1830366 }
notes:
  - { kind: government, text: "w kształcie czegoś «в форме чего-л.» и mieć kształt czegoś «иметь форму чего-л.» — оба с родительным падежом." }
  - { kind: usage, text: "nabierać kształtów «обретать очертания, вырисовываться» — очень частый оборот, в том числе о планах и замыслах." }
  - { kind: false-friend, text: "Устаревшее русское «кшталт» («на кшталт чего-то») заимствовано как раз отсюда, но обычное значение польского слова — просто «форма»." }
  - { kind: usage, text: "Родственные: kształtować «формировать», kształcić «обучать», wykształcenie «образование»." }
collocations:
  - { pl: "w kształcie", ru: "в форме" }
  - { pl: "nabierać kształtów", ru: "обретать очертания" }
etymology: "Из немецкого Gestalt «форма, облик». В русский то же слово попало как устаревшее «кшталт»."
memory: "kształt — «форма», из немецкого Gestalt. Запомните два оборота: w kształcie ryby «в форме рыбы» и nabierać kształtów «обретать очертания»."
idioms:
