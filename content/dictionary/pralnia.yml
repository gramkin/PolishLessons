etymology: "От глагола PRAĆ, слова праславянского со значением «бить, колотить»: бельё когда-то стирали, колотя его о камни у реки. Русский помнит этот корень в «прачке» и «прачечной», но обиходным словом сделал «стирать». А образ битья в польском жив до сих пор: SPRAĆ KOGOŚ значит «отлупить кого-то», и это тот же глагол. Так что прачечная и трёпка — одно слово."
memory: "Прачечная, от prac «стирать» — корень наш, но полузабытый: мы помним его в «прачке» и «прачечной», а говорим «стирать». Читается «пра́льня», где l перед n даёт «ль». Отдать в прачечную — oddac do pralni, с предлогом do, а не «в». В родне: pralka это стиральная машина. И первое значение корня — «бить»: sprac kogos значит «отлупить»."
idioms:
  - { pl: "pralnia pieniędzy", ru: "прачечная для отмывания денег" }
