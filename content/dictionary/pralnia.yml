notes:
  - { kind: false-friend, text: "Корень тут наш, только полузабытый. PRAĆ значит «стирать», и русский этот корень помнит в «прачке» и в «прачечной», но в живой речи заменил его на «стирать». У поляков PRAĆ осталось обычным словом. И запомните PRALKA — это стиральная машина, одним словом вместо наших двух. А PRANIE значит и «стирка», и само бельё, которое стирают." }
  - { kind: usage, text: "Десять форм, женский род, мягкая основа на -NIA, как у LATARNIA. Родительный, дательный и местный единственного числа совпадают: все три дают PRALNI, и та же форма служит родительным множественного. Рядом есть книжный вариант PRALŃ. Звательный PRALNIO встречается только в шутку или в стихах." }
  - { kind: government, text: "Отдать в прачечную — ODDAĆ DO PRALNI, предлог DO с родительным, где русский скажет «в прачечную», с винительным. Это обычное польское расхождение: DO там, где у нас «в». В прачечной — W PRALNI, местный падеж. Над прачечной — NAD PRALNIĄ, творительный. Обратите внимание, что DO PRALNI и W PRALNI выглядят одинаково, а падежи разные." }
  - { kind: pronunciation, text: "Читается «пра́льня», три слога, ударение на первом. Буква L перед согласной N звучит как «ль», поэтому середина слова это «аль». Сочетание NIA даёт «ня», то есть N здесь мягкое. В форме PRALNIĄ носовой на конце звучит «он»: «пра́льнён», а PRALŃ оканчивается мягким «нь»." }
  - { kind: register, text: "Слово нейтральное и бытовое. PRALNIA CHEMICZNA это «химчистка», и так написано на вывеске; PRALNIA SAMOOBSŁUGOWA — прачечная самообслуживания. А PRALNIA PIENIĘDZY это уже из языка новостей и суда: отмывание денег поляк называет PRANIE PIENIĘDZY, дословно «стирка денег», и образ этот в обоих языках одинаков." }
