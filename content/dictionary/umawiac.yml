# review
id: umawiac
format: 2
lemma: "umawiać"
rank: 2208
pos: verb
pron: { cyr: "ума́вяць" }
senses:
  - id: arrange
    ru: "договариваться, условливаться"
    examples:
      - pl: "Umawiamy się na kawę w czwartek."
        ru: "Мы договариваемся о кофе в четверг."
        source: { kind: authored }
      - pl: "Umawiali terminy na kwartał naprzód."
        ru: "Они согласовывали сроки на квартал вперёд."
        source: { kind: authored }
  - id: book
    ru: "записывать (на приём)"
    examples:
      - pl: "Sekretarka umawia pacjentów od rana."
        ru: "Секретарь записывает пациентов с утра."
        source: { kind: authored }
      - pl: "Wizyty umawia się przez internet."
        ru: "На приём записываются через интернет."
        source: { kind: authored }
  - id: date
    ru: "umawiać się z kimś — встречаться (романтически)"
    examples:
      - pl: "Umawia się z nią od pół roku."
        ru: "Он встречается с ней полгода."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Корень тот же, что в pomówić и mówić, то есть русское «молвить» без л. Но глагола для «договариваться» русский от него не построил: там и «договариваться», и «уговариваться» идут от «говорить». Польский же собрал всё гнездо: umawiać się «договариваться», umówiony «условленный» и, главное, umowa — «ДОГОВОР». Это слово встретится вам в первый же рабочий день." }
  - { kind: government, text: "Договариваются С КЕМ — z с творительным: umawiać się z kolegą. А вот о чём или на когда — na с ВИНИТЕЛЬНЫМ: umawiać się na kawę, na jutro, na siódmą. Русский здесь скажет «договориться о встрече», с предложным, так что и предлог, и падеж другие: по-польски umawiać się NA spotkanie." }
  - { kind: usage, text: "Вид несовершенный, пара — umówić. Третье значение чисто разговорное и очень частое: umawiać się z kimś значит «встречаться» в романтическом смысле. Без się глагол значит «записывать кого-то»: umawiać pacjentów, umawiać klientów на конкретное время." }
  - { kind: pronunciation, text: "Четыре слога, ударение на предпоследнем: u-ma-WIAĆ, «ума́вяць». wi перед гласной читается мягко. Настоящее время по простому правилу -ać: umawiam, umawiasz, как czytam и mam." }
collocations:
  - { pl: "umawiać się na kawę", ru: "договариваться о кофе" }
  - { pl: "umawiać wizytę", ru: "записываться на приём" }
  - { pl: "umawiać się z kimś", ru: "встречаться с кем-л." }
family:
  - { pl: "umówić", ru: "договориться", relation: aspect, id: umowic }
  - { pl: "umowa", ru: "договор", relation: derived, id: umowa }
  - { pl: "mówić", ru: "говорить", relation: root, id: mowic }
  - { pl: "umówiony", ru: "условленный", relation: derived }
etymology: "Приставка u- плюс mawiać, итератив от mówić «говорить», из праславянского *mъlviti — того же корня, что русское «молвить». Русский построил «договариваться» от другого глагола, «говорить», так что идея совпадает, а корень нет. Отсюда umówić, umowa «договор», umówiony и nieumówiony."
memory: "umawiać się — «договариваться», и корень тот же, что в mówić, то есть «молвить». Главное, что из него выросло, — umowa «договор». А падеж не тот, которого ждёшь: umawiać się NA coś, с винительным, а не «о чём-то»."
idioms:
