pos: noun
pron: { cyr: "страх" }
senses:
  - id: fear
    ru: "страх"
    examples:
      - pl: "Strach ma wielkie oczy."
        ru: "У страха глаза велики."
        source: { kind: tatoeba, id: 1188690 }
      - pl: "Zbladłeś ze strachu."
        ru: "Ты побледнел от страха."
        source: { kind: tatoeba, id: 3460166 }
