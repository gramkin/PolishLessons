        ru: "Это пугало уже не пугает птиц."
        source: { kind: authored }
  - id: from-fear
    ru: "ze strachu — от страха"
    examples:
      - pl: "Zbladł ze strachu."
        ru: "Он побледнел от страха."
        source: { kind: translated, id: 2217030 }
      - pl: "On drży ze strachu na sam widok psa."
        ru: "Он дрожит от страха уже от вида собаки."
        source: { kind: tatoeba, id: 513485 }
notes:
  - { kind: government, text: "ze strachu «от страха» — предлог z с родительным падежом, а не «от», как в русском: Zbladł ze strachu «Он побледнел от страха»." }
  - { kind: government, text: "strach przed czymś «страх перед чем-то» — предлог przed с творительным, здесь польский и русский совпадают." }
  - { kind: false-friend, text: "strach na wróble — это «пугало», буквально «страх на воробьёв». Отдельного слова вроде русского «пугало» в польском нет." }
  - { kind: usage, text: "Безличное strach значит «страшно»: Strach pomyśleć «Страшно подумать»." }
