        ru: "Они могут побороть свой страх."
        source: { kind: translated, id: 2587151 }
  - id: scarecrow
    ru: "strach na wróble — пугало"
    examples:
      - pl: "Na polu stoi strach na wróble."
        ru: "В поле стоит пугало."
        source: { kind: authored }
      - pl: "Ten strach nie odstrasza już ptaków."
        ru: "Это пугало уже не пугает птиц."
        source: { kind: authored }
  - id: from-fear
    ru: "ze strachu — от страха"
    examples:
      - pl: "Zbladł ze strachu."
        ru: "Он побледнел от страха."
        source: { kind: translated, id: 2217030 }
      - pl: "On drży ze strachu na sam widok psa."
        ru: "Он дрожит от страха уже от вида собаки."
        source: { kind: tatoeba, id: 513485 }
notes:
  - { kind: government, text: "ze strachu «от страха» — предлог z с родительным падежом, а не «от», как в русском: Zbladł ze strachu «Он побледнел от страха»." }
  - { kind: government, text: "strach przed czymś «страх перед чем-то» — предлог przed с творительным, здесь польский и русский совпадают." }
  - { kind: false-friend, text: "strach na wróble — это «пугало», буквально «страх на воробьёв». Отдельного слова вроде русского «пугало» в польском нет." }
  - { kind: usage, text: "Безличное strach значит «страшно»: Strach pomyśleć «Страшно подумать»." }
collocations:
  - { pl: "ze strachu", ru: "от страха" }
  - { pl: "strach przed", ru: "страх перед" }
  - { pl: "strach na wróble", ru: "пугало" }
  - { pl: "paniczny strach", ru: "панический страх" }
family:
  - { pl: "bać się", ru: "бояться", relation: root, id: bac }
  - { pl: "straszny", ru: "страшный", relation: derived, id: straszny }
  - { pl: "straszyć", ru: "пугать", relation: derived }
etymology: "Праславянское *strachъ — то же слово, что русский «страх», без изменений в значении."
memory: "strach — «страх», мужской род. Главное запомнить оборот ze strachu «от страха»: предлог z с родительным, а не «от». И strach na wróble значит «пугало»."
idioms:
  - { pl: "strach ma wielkie oczy", ru: "у страха глаза велики" }
  - { pl: "najeść się strachu", ru: "натерпеться страху" }
  - { pl: "strachy na Lachy", ru: "пустые страшилки" }
formExamplesSkip:
