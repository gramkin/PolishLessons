notes:
  - { kind: pronunciation, text: "Основа меняется трижды, и все три мены русскому знакомы. Согласная: ź перед согласным и на конце — PODWIEŹĆ, PODWIEŹ, PODWIEŹLI, — но z перед гласной заднего ряда: PODWIOZĘ, PODWIOZĄ, PODWIOZŁA. Гласная: e перед i — PODWIEZIE, PODWIEZIESZ, — но o перед твёрдой — PODWIOZĘ, PODWIOZŁA. И третья, самая польская: o удлиняется в ó в закрытом слоге, откуда PODWIÓZŁ при PODWIOZŁA. Та же мена, что в WZÓR при WZORU и SAMOCHÓD при SAMOCHODOWY." }
  - { kind: usage, text: "Повелительное PODWIEŹ стоит отметить особо: именно оно заставило исправить карточку KARMIĆ в партии 259. Там было сказано, что окончание -ie переходит в -ij, и по этому правилу вышло бы небывалое PODWIEZIJ. На деле от третьего лица PODWIEZIE отбрасывается -ie, остаётся PODWIEZ-, и поскольку такой основой польское слово закончиться может, она просто смягчается: PODWIEŹ. Правило теперь сформулировано через основу, а не через окончание, и проверено на двух тысячах с лишним глаголов." }
  - { kind: usage, text: "Четыре формы в карточке пропущены, и не из-за корпуса, а потому, что в таблице их нет в правильном виде. Генератор черновиков строит мужской род единственного числа от основы с o: PODWIOZŁ и условные PODWIOZŁBY, PODWIOZŁBYM, PODWIOZŁBYŚ. Таких форм в польском не бывает — в закрытом слоге стоит ó, то есть PODWIÓZŁ и PODWIÓZŁBY. Сама PODWIÓZŁ в таблице есть и в карточке стоит, а вот правильных условных в таблице нет вовсе, поэтому мужское единственное условное здесь отсутствует. Женский, средний и множественный при этом совершенно правильны: PODWIOZŁA, PODWIOZŁO, PODWIOZŁY, PODWIOZŁABY — там за ł идёт гласная, и слог открывается." }
  - { kind: government, text: "Управление как в русском: PODWIEŹĆ KOGOŚ в винительном плюс предлог направления — DO DWORCA, POD DOM, NA LOTNISKO. Вежливая просьба звучит CZY MOŻESZ MNIE PODWIEŹĆ? — «можешь меня подвезти?». Различайте три польских глагола там, где русский берёт три своих: WIEŹĆ — везти на чём-то, NIEŚĆ — нести в руках, PROWADZIĆ — вести за руку. Деление ровно то же, что в русском, так что ошибиться трудно. Несовершенная пара — PODWOZIĆ." }
