etymology: "Приставка pod- и WIEŹĆ «везти», из праславянского *vezti — то же слово, что русское «везти». Соответствие полное, включая приставку: польское PODWIEŹĆ и русское «подвезти» собраны из одних и тех же частей. Из гнезда вышли WÓZ «воз, машина», WOZIĆ «возить», PODWÓZKA «подвоз, попутка», PRZEWÓZ «перевоз». Обратите внимание на WÓZ с ó в закрытом слоге при WOZU в родительном — та же мена, что в самом глаголе."
memory: "podwieźć — это «подвезти», часть за частью. Три мены в основе: ź перед согласным, z перед твёрдой гласной, ó в закрытом слоге (podwiózł при podwiozła)."
idioms:
  - { pl: "czy możesz mnie podwieźć?", ru: "можешь меня подвезти?" }
  - { pl: "podwieźć kogoś pod sam dom", ru: "подвезти кого-либо к самому дому" }
formExamplesSkip:
  - { form: "podwiozł", reason: "Такой формы в польском нет: в закрытом слоге стоит ó, то есть PODWIÓZŁ. Генератор черновиков строит мужской род единственного числа от основы с o, не применяя удлинения. Правильная форма PODWIÓZŁ в таблице есть и в карточке приведена." }
  - { form: "podwiozłby", reason: "Такой формы нет по той же причине: правильное условное мужского рода — PODWIÓZŁBY, с ó, потому что частица -by слог не открывает. В таблице черновика этой правильной формы нет вовсе, поэтому мужское единственное условное в карточке отсутствует. Женские, средние и множественные условные при этом правильны и приведены: PODWIOZŁABY, PODWIOZŁOBY, PODWIOZŁYBY — там за ł идёт гласная." }
  - { form: "podwiozłbym", reason: "То же: правильная форма PODWIÓZŁBYM, с ó в закрытом слоге. В таблице её нет, а приведённую строить нельзя." }
  - { form: "podwiozłbyś", reason: "То же: правильная форма PODWIÓZŁBYŚ, с ó в закрытом слоге. В таблице её нет, а приведённую строить нельзя." }
