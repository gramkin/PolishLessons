etymology: "Из латинского CRIMINALIS, от CRIMEN «обвинение, преступление», и в оба языка слово пришло одним и тем же книжным путём, через латынь учёных и юристов. Поэтому польское KRYMINALNY и русское «криминальный» звучат почти одинаково. Разошлись не прилагательные, а существительные: русский оставил «криминал» при отвлечённом смысле преступности, а польский увёл KRYMINAŁ в две совсем бытовые области, в детективный жанр и в тюрьму. Такой сдвиг от отвлечённого к предметному в разговорной речи обычен. Из того же латинского корня KRYMINALISTYKA и KRYMINALISTA."
memory: "Главное — не путать с юридическим термином: «уголовный» в законе это karny, kodeks karny, prawo karne. Kryminalny это язык полиции и газет, policja kryminalna «уголовный розыск», и название жанра, powieść kryminalna «детектив». Существительное kryminał значит две разговорные вещи: детектив и тюрьма, czytam kryminał это «читаю детектив». Мужско-личное kryminalni работает само и значит сотрудников угро. Читается «крымина́льны», с «ы» в начале."
idioms:
