notes:
  - { kind: false-friend, text: "Самое важное здесь — то, чего это слово НЕ значит. Юридический термин «уголовный» по-польски не KRYMINALNY, а KARNY: KODEKS KARNY это «уголовный кодекс», PRAWO KARNE «уголовное право», ODPOWIEDZIALNOŚĆ KARNA «уголовная ответственность», SPRAWA KARNA «уголовное дело» в процессуальном смысле. KRYMINALNY живёт в языке полиции и газет: POLICJA KRYMINALNA «уголовный розыск», WYDZIAŁ KRYMINALNY «уголовный отдел». Перепутать их в документе значит написать бессмыслицу." }
  - { kind: usage, text: "Одиннадцать форм, степеней сравнения нет: прилагательное относительное. Мужско-личная форма KRYMINALNI работает самостоятельно, без существительного, и означает сотрудников уголовного розыска: PRZYJECHALI KRYMINALNI — «приехали из угро». Это профессиональный и газетный сокращённый оборот, ровно как русское «приехали из убойного». Во втором значении прилагательное называет жанр и стоит после существительного: POWIEŚĆ KRYMINALNA, FILM KRYMINALNY." }
  - { kind: register, text: "Существительное того же гнезда стоит знать отдельно, потому что оно очень частое и имеет два разговорных значения. KRYMINAŁ — это, во-первых, детектив, книга или фильм: CZYTAM KRYMINAŁ значит «я читаю детектив», а не «я читаю криминал». Во-вторых, это тюрьма: SIEDZIAŁ W KRYMINALE «он сидел в тюрьме». Русское «криминал» в смысле преступности по-польски будет PRZESTĘPCZOŚĆ. Частые обороты: POLICJA KRYMINALNA, SPRAWA KRYMINALNA, LITERATURA KRYMINALNA." }
  - { kind: pronunciation, text: "Читается «крымина́льны», пять слогов, ударение на предпоследнем. Первая Y звучит как «ы», поэтому начало слова «кры», а не «кри», и это та же разница, что в CYRK «цырк». Буква L перед N звучит мягко, «ль». Конечное Y снова «ы». В существительном KRYMINAŁ последняя буква Ł даёт «у»: слышно «крымина́у», а не «криминал»." }
  - { kind: government, text: "Прилагательное падежом не управляет и только согласуется. Для характеристики дела употребляют оборот с предлогом O и местным падежом: SPRAWA O CHARAKTERZE KRYMINALNYM «дело криминального характера». Отрицательная конструкция NIE MA W TYM NIC KRYMINALNEGO «в этом нет ничего криминального» требует родительного после NIC, и это общее польское правило: NIC плюс родительный, как в NIC NOWEGO «ничего нового»." }
