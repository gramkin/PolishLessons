# review
id: rzadzacy
format: 2
lemma: "rządzący"
rank: 5950
pos: adj
pron: { cyr: "жондзо́нцы" }
senses:
  - id: ruling
    ru: "правящий (партия, коалиция, элита)"
    examples:
      - pl: "Partia rządząca nie ma właściwie żadnego programu."
        ru: "У правящей партии, по сути, нет никакой программы."
        source: { kind: translated, id: 11264377 }
      - pl: "Opozycja ostro krytykuje partię rządzącą."
        ru: "Оппозиция резко критикует правящую партию."
        source: { kind: authored }
  - id: those-in-power
    ru: "власть, власть имущие (во множественном числе, как существительное)"
    examples:
      - pl: "Rządzący obiecują obniżkę podatków."
        ru: "Власти обещают снизить налоги."
        source: { kind: authored }
      - pl: "Zaufanie do rządzących spadło."
        ru: "Доверие к власти упало."
        source: { kind: authored }
  - id: governing
    ru: "управляющий, определяющий (о законах, правилах)"
    examples:
      - pl: "Nie znamy praw rządzących tym światem."
        ru: "Мы не знаем законов, управляющих этим миром."
        source: { kind: authored }
notes:
  - { kind: usage, text: "По происхождению это причастие от RZĄDZIĆ «править, управлять», ставшее прилагательным: PARTIA RZĄDZĄCA «правящая партия», KOALICJA RZĄDZĄCA, ELITY RZĄDZĄCE. Во множественном числе оно часто работает как существительное: RZĄDZĄCY значит «власть, власть имущие», ZAUFANIE DO RZĄDZĄCYCH «доверие к власти». Степеней сравнения нет." }
  - { kind: usage, text: "Форм десять, а не одиннадцать: мужско-личное множественное число совпадает с мужским единственным. RZĄDZĄCY OBÓZ «правящий лагерь» и RZĄDZĄCY POLITYCY «правящие политики» пишутся одинаково, различает их только существительное и глагол. Так устроены все причастия на -ĄCY." }
  - { kind: government, text: "Сохраняет управление глагола: RZĄDZIĆ + творительный, как и в русском «править страной». PRAWA RZĄDZĄCE RYNKIEM «законы, управляющие рынком», KRÓL RZĄDZĄCY KRAJEM «король, правящий страной». В сочетании PARTIA RZĄDZĄCA прилагательное обычно стоит после существительного, как термин." }
  - { kind: pronunciation, text: "Читается «жондзо́нцы»: RZ — «ж», оба Ą перед DZ и C звучат как «он». Ударение на предпоследнем слоге. Носовые здесь не тянутся, а распадаются на гласную и «н», как в русском «жонглёр»." }
collocations:
  - { pl: "partia rządząca", ru: "правящая партия" }
  - { pl: "koalicja rządząca", ru: "правящая коалиция" }
  - { pl: "obóz rządzący", ru: "правящий лагерь" }
  - { pl: "elity rządzące", ru: "правящие элиты" }
family:
  - { pl: "rządzić", ru: "править, управлять", relation: root, id: rzadzic }
  - { pl: "rząd", ru: "правительство; ряд", relation: root, id: rzad }
  - { pl: "rządowy", ru: "правительственный", relation: root, id: rzadowy }
synonyms: ["panujący", "władza"]
etymology: "Действительное причастие настоящего времени от RZĄDZIĆ «править». Глагол образован от RZĄD «порядок, ряд», того же корня, что русские «ряд», «рядить», «порядок»: править значило «наводить порядок»."
memory: "Rząd — правительство, rządzić — править, rządzący — правящий: partia rządząca. А rządzący во множественном — просто «власть»."
idioms:
