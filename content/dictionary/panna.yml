# review
id: panna
format: 2
lemma: "panna"
rank: 452
pos: noun
pron: { cyr: "па́нна" }
senses:
  - id: young-woman
    ru: "девушка, барышня; незамужняя женщина"
    examples:
      - pl: "Kim jest ta ładna panna?"
        ru: "Кто эта красивая девушка?"
        source: { kind: translated, id: 2239442 }
      - pl: "Panna Kowalska czeka w gabinecie."
        ru: "Госпожа Ковальская ждёт в кабинете."
        source: { kind: authored }
      - pl: "Jest jeszcze panną."
        ru: "Она ещё не замужем."
        source: { kind: authored }
  - id: bride
    ru: "panna młoda — невеста"
    examples:
      - pl: "A oto i panna młoda!"
        ru: "А вот и невеста!"
        source: { kind: translated, id: 362831 }
      - pl: "To ojciec panny młodej."
        ru: "Это отец невесты."
        source: { kind: translated, id: 521317 }
      - pl: "Będziesz piękną panną młodą."
        ru: "Ты будешь красивой невестой."
        source: { kind: translated, id: 4820996 }
notes:
  - { kind: usage, text: "Младшее звено вежливой триады: pan «господин», pani «госпожа», panna «барышня, незамужняя»." }
  - { kind: usage, text: "panna młoda — это «невеста» на свадьбе, а pan młody — «жених». Буквально «молодая» и «молодой», как русские «молодые»." }
  - { kind: false-friend, text: "Как обращение panna сегодня звучит устарело и даже снисходительно. Ко взрослой женщине обращаются pani, независимо от того, замужем она или нет." }
  - { kind: usage, text: "В документах panna — это отметка о семейном положении «не замужем», как kawaler у мужчин." }
collocations:
  - { pl: "panna młoda", ru: "невеста" }
  - { pl: "stara panna", ru: "старая дева" }
  - { pl: "panna na wydaniu", ru: "девушка на выданье" }
  - { pl: "panna Kowalska", ru: "госпожа Ковальская" }
etymology: "Уменьшительное от pani; корень тот же, что в pan, — праславянское *gъpanъ. Русское «пан» и «панна» заимствованы как раз из польского."
memory: "panna — «барышня, незамужняя девушка», младшее звено триады pan — pani — panna. Главное, что стоит запомнить: panna młoda — это «невеста», а pan młody — «жених», буквально «молодая» и «молодой», как русские «молодые» на свадьбе. Само обращение panna сегодня звучит устарело: ко взрослой женщине обращайтесь pani."
idioms:
  - { pl: "panna młoda", ru: "невеста" }
  - { pl: "panna na wydaniu", ru: "девушка на выданье" }
  - { pl: "stara panna", ru: "старая дева" }
