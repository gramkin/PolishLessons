# review
id: patrzec
format: 2
lemma: "patrzeć"
rank: 306
pos: verb
aspect: imperf
pron: { cyr: "па́тшець" }
senses:
  - id: look
    ru: "смотреть, глядеть"
    examples:
      - pl: "Patrz."
        ru: "Смотри."
        source: { kind: tatoeba, id: 6160580 }
      - pl: "Patrz pod nogi."
        ru: "Смотри под ноги."
        source: { kind: tatoeba, id: 5377648 }
      - pl: "Patrz mi w oczy."
        ru: "Смотри мне в глаза."
        source: { kind: tatoeba, id: 970443 }
  - id: look-at
    ru: "смотреть на что-либо; обрати внимание"
    examples:
      - pl: "Patrz, on idzie."
        ru: "Смотри, он идёт."
        source: { kind: tatoeba, id: 524703 }
      - pl: "Patrz, śnieg pada!"
        ru: "Смотри, снег идёт!"
        source: { kind: tatoeba, id: 8108754 }
      - pl: "Nie patrz na nią!"
        ru: "Не смотри на неё!"
        source: { kind: tatoeba, id: 2298820 }
notes:
  - { kind: usage, text: "Управление: patrzeć na coś «смотреть на что-то» (винительный), patrzeć w oczy «смотреть в глаза», patrzeć pod nogi «смотреть под ноги»." }
  - { kind: usage, text: "У глагола два ряда прошедшего времени: современный patrzył, patrzyła и устаревший patrzał, patrzała. В живой речи говорят patrzył." }
  - { kind: usage, text: "Совершенный вид — spojrzeć или popatrzeć: Spójrz! «Посмотри!»" }
  - { kind: usage, text: "Patrz! в разговоре значит «Смотри!, Гляди!», а jak się patrzy — «как надо, что надо»." }
collocations:
  - { pl: "patrzeć na coś", ru: "смотреть на что-то" }
  - { pl: "patrz pod nogi", ru: "смотри под ноги" }
  - { pl: "patrzeć w oczy", ru: "смотреть в глаза" }
  - { pl: "patrzeć w przyszłość", ru: "смотреть в будущее" }
etymology: "Праславянское *patriti «смотреть, наблюдать»; в русском ближайшая родня — «патрон» в старом смысле «смотрящий за», а обычное соответствие — «смотреть»."
memory: "patrzeć — «смотреть»: patrzeć na coś, patrzeć w oczy. У глагола два прошедших ряда: современный patrzył и устаревший patrzał. Совершенный вид — spojrzeć."
idioms:
  - { pl: "jak się patrzy", ru: "как надо, что надо" }
  - { pl: "patrzeć jak cielę na malowane wrota", ru: "смотреть как баран на новые ворота" }
  - { pl: "patrzeć w przyszłość", ru: "смотреть в будущее" }
