# review
id: martwic
format: 2
lemma: "martwić"
rank: 260
pos: verb
aspect: imperf
pron: { cyr: "ма́ртфиць" }
senses:
  - id: worry
    ru: "martwić się — беспокоиться, волноваться"
    note: "Беспокоятся с предлогом o и винительным: martwić się o kogoś."
    examples:
      - pl: "Nie ma się o co martwić."
        ru: "Беспокоиться не о чем."
        source: { kind: tatoeba, id: 589675 }
      - pl: "Nie martwcie się, jesteście bezpieczni."
        ru: "Не беспокойтесь, вы в безопасности."
        source: { kind: tatoeba, id: 2077376 }
      - pl: "Tak naprawdę nie martwię się aż tak o pogodę."
        ru: "Честно говоря, меня погода особо не беспокоит."
        source: { kind: tatoeba, id: 8949282 }
  - id: trouble
    ru: "martwić kogoś — огорчать, тревожить кого-либо"
    examples:
      - pl: "Ta sprawa mnie martwi."
        ru: "Это дело меня беспокоит."
        source: { kind: authored }
      - pl: "Nie chcę cię martwić."
        ru: "Я не хочу тебя огорчать."
        source: { kind: authored }
      - pl: "Często martwił matkę."
        ru: "Он часто огорчал мать."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Nie martw się! «Не волнуйся!» — одна из самых частых фраз языка; во множественном Nie martwcie się!" }
  - { kind: usage, text: "Управление: martwić się o kogoś / o coś — предлог o с винительным падежом: Martwię się o ciebie «Я за тебя беспокоюсь»." }
  - { kind: false-friend, text: "Осторожно с формой martwi: это и «беспокоит» (от martwić), и «мёртвые» (от прилагательного martwy). Корень общий: огорчать — значит умерщвлять радость." }
  - { kind: usage, text: "Совершенный вид — zmartwić: Zmartwiła mnie ta wiadomość «Эта новость меня огорчила»." }
collocations:
  - { pl: "nie martw się", ru: "не волнуйся" }
  - { pl: "martwić się o kogoś", ru: "беспокоиться о ком-то" }
  - { pl: "nie ma się o co martwić", ru: "не о чем беспокоиться" }
  - { pl: "przestań się martwić", ru: "перестань волноваться" }
etymology: "От martwy «мёртвый», праславянское *mьrtvъ; martwić буквально «умерщвлять» — отсюда «огорчать, тревожить». Тот же корень, что в русских «мёртвый», «смерть»."
memory: "Nie martw się! — «Не волнуйся!». Беспокоятся с предлогом o: martwię się o ciebie. И осторожно: martwi значит и «беспокоит», и «мёртвые» — от martwy."
idioms:
  - { pl: "nie martw się", ru: "не волнуйся" }
  - { pl: "nie ma się o co martwić", ru: "не о чем беспокоиться" }
  - { pl: "nie chcę cię martwić, ale", ru: "не хочу тебя огорчать, но" }
