# review
id: zabierac
format: 2
lemma: "zabierać"
rank: 642
pos: verb
aspect: imperf
aspectPair: zabrac
pron: { cyr: "забе́раць" }
senses:
  - id: take-along
    ru: "забирать, брать с собой"
    note: "Совершенный вид — zabrać."
    examples:
      - pl: "Zabieram Toma ze sobą do Australii."
        ru: "Я беру Тома с собой в Австралию."
        source: { kind: translated, id: 12044189 }
      - pl: "Uciekł, zabierając diament."
        ru: "Он сбежал, забрав бриллиант."
        source: { kind: translated, id: 522785 }
      - pl: "Wyprowadziła się, zabierając cały dobytek."
        ru: "Она съехала, забрав всё имущество."
        source: { kind: translated, id: 522864 }
  - id: take-to
    ru: "отвозить, водить (кого-л. куда-л.)"
    note: "Направление — do с родительным: do szkoły, do zoo."
    examples:
      - pl: "Zabieram cię do szkoły."
        ru: "Я везу тебя в школу."
        source: { kind: translated, id: 4716940 }
      - pl: "Często zabiera swoje dzieci do zoo."
        ru: "Он часто водит своих детей в зоопарк."
        source: { kind: translated, id: 2680434 }
      - pl: "Dokąd zabierają Toma?"
        ru: "Куда везут Тома?"
        source: { kind: translated, id: 3610717 }
  - id: take-up
    ru: "занимать, вмещать (место, время)"
    note: "Ile to zabiera miejsca? «Сколько это занимает места?»"
    examples:
      - pl: "Ten mikrobus zabiera 25 pasażerów."
        ru: "Этот микроавтобус вмещает двадцать пять пассажиров."
        source: { kind: translated, id: 771869 }
      - pl: "Ile to zabiera miejsca?"
        ru: "Сколько это занимает места?"
        source: { kind: translated, id: 3922739 }
      - pl: "Ta praca zabiera mi cały dzień."
        ru: "Эта работа отнимает у меня весь день."
        source: { kind: authored }
  - id: get-out
    ru: "Zabieraj się stąd! — Убирайся отсюда!"
    note: "Резко, но обиходно; Zabieraj łapy! «Убери руки!»"
    examples:
      - pl: "Zabieraj się stąd!"
        ru: "Убирайся отсюда!"
        source: { kind: translated, id: 516437 }
      - pl: "Zabieraj łapę."
        ru: "Убери лапу."
        source: { kind: translated, id: 12062296 }
      - pl: "Zabieraj te łapy."
        ru: "Убери эти лапы."
        source: { kind: translated, id: 6554146 }
notes:
  - { kind: government, text: "zabierać kogoś lub coś — винительный, а направление идёт через do с родительным: zabieram cię do szkoły, zabiera dzieci do zoo." }
  - { kind: usage, text: "Второе значение — «вмещать, занимать»: Ten mikrobus zabiera 25 pasażerów «Этот микроавтобус вмещает 25 пассажиров», Ile to zabiera miejsca?" }
  - { kind: usage, text: "Повелительное звучит резко и очень обиходно: Zabieraj się stąd! «Убирайся отсюда!», Zabieraj łapy! «Убери руки!»" }
  - { kind: usage, text: "Устойчивое zabierać głos значит «брать слово» на собрании: Kto zabierał głos?" }
  - { kind: usage, text: "Совершенный вид — zabrać: zabierał długo, w końcu zabrał." }
collocations:
  - { pl: "zabierać czas", ru: "отнимать время" }
  - { pl: "zabierać głos", ru: "брать слово" }
  - { pl: "Zabieraj się stąd!", ru: "Убирайся отсюда!" }
  - { pl: "zabierać do szkoły", ru: "отвозить в школу" }
family:
  - { pl: "zabrać", ru: "забрать", relation: aspect }
  - { pl: "brać", ru: "брать", relation: root }
  - { pl: "zabieranie", ru: "забирание", relation: derived }
etymology: "Приставка za- плюс bierać, многократное от brać «брать», праславянское *bьrati — то же слово, что русские «брать» и «забирать»."
memory: "zabierać — «забирать, брать с собой», и разбирается прозрачно: za- плюс brać. Держите в голове три работы. Первая — везти кого-то: zabieram cię do szkoły. Вторая — вмещать или занимать: Ten mikrobus zabiera 25 pasażerów, Ile to zabiera miejsca? Третья — резкое Zabieraj się stąd! «Убирайся отсюда!». И отдельно запомните zabierać głos «брать слово». Совершенный вид — zabrać."
idioms:
  - { pl: "zabierać czas", ru: "отнимать время" }
  - { pl: "zabierać głos", ru: "брать слово" }
  - { pl: "Zabieraj się stąd!", ru: "Убирайся отсюда!" }
