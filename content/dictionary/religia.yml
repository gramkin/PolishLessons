notes:
  - { kind: usage, text: "Слово принадлежит к классу существительных на -IA после согласной, и этот класс даёт форму, которая русского сбивает: в родительном, дательном и местном падеже единственного числа буква I удваивается — RELIGII. То есть «нет религии» будет NIE MA RELIGII, «о религии» — O RELIGII, «религии» в дательном — RELIGII, и все три падежа выглядят одинаково. То же устройство у BIBLIA и BIBLII, STRATEGIA и STRATEGII, HISTORIA и HISTORII. В именительном множественного -IE: RELIGIE. А родительный множественного RELIGIJ — форма старая, книжная; в современной речи чаще скажут RELIGII и там тоже." }
  - { kind: pronunciation, text: "Читается «рэли́гя», ударение на предпоследнем слоге. Сочетание GIA даёт «гя», с мягким g, а не «гиа» в два слога: слово трёхсложное, RE-LI-GIA. В родительном RELIGII двойная I читается как долгое «и»: «рэли́гии», и слогов становится четыре. Начальное RE звучит «рэ», без смягчения, потому что польское E никогда не смягчает предыдущую согласную." }
  - { kind: government, text: "Женский род на -A. Винительный на -Ę: WYBRAŁ RELIGIĘ. Предмет в школе требует предлога NA с винительным, когда речь о посещении: CHODZIĆ NA RELIGIĘ «ходить на религию», и NA RELIGII с местным, когда речь о том, что происходит на уроке: NA RELIGII CZYTALI PRZYPOWIEŚCI. Принадлежность к вере вводится конструкцией WYZNAWAĆ RELIGIĘ «исповедовать религию», а свобода вероисповедания — WOLNOŚĆ RELIGII или WOLNOŚĆ WYZNANIA, причём второе в юридических текстах частее." }
  - { kind: register, text: "Нейтральное слово, одинаково пригодное для газеты, учебника и разговора. Рядом с ним живёт WYZNANIE «вероисповедание, конфессия», и оно уместнее, когда речь о принадлежности человека: JAKIEGO JEST WYZNANIA? «какого он вероисповедания?». Прилагательное RELIGIJNY значит и «религиозный» о человеке, и «вероисповедный» о праздниках и войнах: WOJNY RELIGIJNE. Наречие RELIGIJNIE в разговоре получило переносный смысл — «неукоснительно, свято»: RELIGIJNIE PRZESTRZEGA DIETY «он свято соблюдает диету»." }
