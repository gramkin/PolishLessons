etymology: "Из латинского RELIGIO, и русское «религия» пришло оттуда же, так что слова совпадают. А вот что означал латинский корень, спорили ещё сами римляне, и спор стоит знать. Цицерон выводил слово из RELEGERE «перечитывать, тщательно перебирать»: религия как добросовестное исполнение обряда. Лактанций возражал и выводил из RELIGARE «связывать заново»: религия как связь человека с божеством. Сегодня принято второе объяснение, и образ связи вошёл в оба языка через переводы. Корень LIG- тот же, что в LIGATURA и в польском LIGA, а приставка RE- значит «назад, вновь». Так что буквально RELIGIA — «воссоединение», и этот смысл полезен для памяти больше, чем любой словарный перевод."
memory: "Класс на -ia: в родительном, дательном и местном двойное i — religii, как biblii и historii. Родительный множественного religij — старая книжная форма. Читается «рэли́гя», gia даёт «гя» одним слогом. От латинского religare «связывать заново»: религия как связь."
