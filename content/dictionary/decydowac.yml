# review
id: decydowac
format: 2
lemma: "decydować"
rank: 2031
pos: verb
pron: { cyr: "дэцыдо́ваць" }
senses:
  - id: decide
    ru: "решать (decydować o czymś)"
    examples:
      - pl: "To on decyduje o wszystkim."
        ru: "Это он решает всё."
        source: { kind: authored }
      - pl: "Decydowali o tym przez dwa tygodnie."
        ru: "Они решали это две недели."
        source: { kind: authored }
      - pl: "O wyniku decydują ostatnie minuty."
        ru: "Исход решают последние минуты."
        source: { kind: authored }
  - id: resolve
    ru: "decydować się na coś — решаться на что-л."
    examples:
      - pl: "Długo decydował się na operację."
        ru: "Он долго решался на операцию."
        source: { kind: authored }
      - pl: "Nie decyduj się pochopnie."
        ru: "Не решайся сгоряча."
        source: { kind: authored }
  - id: decisive
    ru: "decydujący — решающий"
    examples:
      - pl: "To był decydujący moment meczu."
        ru: "Это был решающий момент матча."
        source: { kind: authored }
      - pl: "Jego głos okazał się decydujący."
        ru: "Его голос оказался решающим."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "РЕДКИЙ СЛУЧАЙ: русской опоры здесь НЕТ. Польский взял латинское decidere (через французский и немецкий), а русский в этом месте обошёлся своим «решать». Поэтому decydować и decyzja запоминаются напрямую, без подсказки от родного языка, — зато они узнаваемы всякому, кто знает английское decide или французское décider." }
  - { kind: government, text: "ГЛАВНОЕ, ЧТО НУЖНО ЗАПОМНИТЬ. Решают О чём — предлог o с ПРЕДЛОЖНЫМ: decydować o wyniku, o przyszłości, o wszystkim. Русский чаще ставит прямое дополнение («решать вопрос»), поэтому предлог легко потерять. Возвратное decydować się NA coś — «решаться НА что-то» — наоборот, совпадает с русским полностью." }
  - { kind: usage, text: "Вид несовершенный, совершенная пара — zdecydować. Причастие decydujący «решающий» живёт самостоятельно и встречается постоянно: decydujący moment, decydujący głos, decydująca rola. Настоящее время по правилу -ować: decyduję, decydujesz." }
  - { kind: register, text: "ПОЧЕМУ ОДИННАДЦАТЬ ФОРМ ПРОПУЩЕНО. Дополнение стоит в предложной группе (o czymś, na coś), винительного при глаголе нет, а значит превращать в подлежащее нечего — страдательного причастия вроде decydowany не существует. То же правило уже отмечено у podróżować, współpracować, skorzystać и opiekować się." }
collocations:
  - { pl: "decydować o czymś", ru: "решать что-л." }
  - { pl: "decydować się na coś", ru: "решаться на что-л." }
  - { pl: "decydujący moment", ru: "решающий момент" }
family:
  - { pl: "decyzja", ru: "решение", relation: root, id: decyzja }
  - { pl: "zdecydować", ru: "решить", relation: aspect, id: zdecydowac }
  - { pl: "decydujący", ru: "решающий", relation: derived }
etymology: "Из латинского decidere «отсекать, решать», пришедшего в польский через французский décider и немецкий. Русский этого заимствования в глаголе не принял и пользуется своим «решать», поэтому пара decydować/«решать» родством не связана. Отсюда decyzja «решение», decydent «лицо, принимающее решения» и decydujący «решающий»."
memory: "decydować — «решать», слово латинское, и русского родственника у него нет: запоминайте напрямую. Падеж обязателен: decydować O czymś, предложный. Зато decydować się NA coś совпадает с русским «решаться на»."
idioms:
  - { pl: "decydujący głos", ru: "решающий голос" }
  - { pl: "o wszystkim decyduje przypadek", ru: "всё решает случай" }
