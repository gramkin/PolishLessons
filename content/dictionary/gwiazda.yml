# review
id: gwiazda
format: 2
lemma: "gwiazda"
rank: 678
pos: noun
pron: { cyr: "гвя́зда" }
senses:
  - id: star
    ru: "звезда (небесное тело)"
    examples:
      - pl: "We wszechświecie są miliardy gwiazd."
        ru: "Во Вселенной миллиарды звёзд."
        source: { kind: tatoeba, id: 3629651 }
      - pl: "Tamta gwiazda widoczna jest gołym okiem."
        ru: "Эта звезда видна невооружённым глазом."
        source: { kind: tatoeba, id: 1353070 }
      - pl: "Gwiazdy są niepomiernie daleko."
        ru: "Звёзды неизмеримо далеко."
        source: { kind: tatoeba, id: 3460188 }
  - id: celebrity
    ru: "звезда (знаменитость)"
    note: "Оба значения совпадают с русскими."
    examples:
      - pl: "Elvis Presley był gwiazdą rocka."
        ru: "Элвис Пресли был рок-звездой."
        source: { kind: translated, id: 982937 }
      - pl: "Ona chce być gwiazdą."
        ru: "Она хочет быть звездой."
        source: { kind: translated, id: 12562295 }
      - pl: "Została gwiazdą filmową."
        ru: "Она стала кинозвездой."
        source: { kind: authored }
  - id: shooting-star
    ru: "spadająca gwiazda — падающая звезда"
    examples:
      - pl: "O, spadająca gwiazda!"
        ru: "О, падающая звезда!"
        source: { kind: translated, id: 732973 }
      - pl: "Właśnie zobaczyłem spadającą gwiazdę."
        ru: "Я только что видел падающую звезду."
        source: { kind: tatoeba, id: 1591782 }
      - pl: "Spadająca gwiazda przecięła niebo."
        ru: "Падающая звезда прочертила небо."
        source: { kind: translated, id: 951181 }
notes:
  - { kind: usage, text: "Оба значения совпадают с русскими: и небесное тело, и знаменитость — gwiazda rocka «рок-звезда», gwiazda filmowa «кинозвезда»." }
  - { kind: usage, text: "Звуковое соответствие регулярное: польское gw- отвечает русскому зв-, как в gwiazda — «звезда»." }
  - { kind: usage, text: "Чередование в дательном и предложном: gwiazda, но o gwieździe — a переходит в e, а zd в źdź." }
  - { kind: usage, text: "Родня: gwiazdozbiór «созвездие», gwiaździsty «звёздный», gwiazdka «звёздочка», а в разговоре Gwiazdka — «Рождество»." }
collocations:
  - { pl: "spadająca gwiazda", ru: "падающая звезда" }
  - { pl: "gwiazda rocka", ru: "рок-звезда" }
  - { pl: "o gwieździe", ru: "о звезде" }
  - { pl: "gwiazdozbiór", ru: "созвездие" }
family:
  - { pl: "gwiazdozbiór", ru: "созвездие", relation: derived }
  - { pl: "gwiazdka", ru: "звёздочка; Рождество", relation: derived }
  - { pl: "gwiaździsty", ru: "звёздный", relation: derived }
etymology: "Праславянское *gvězda — то же слово, что русское «звезда». Польское gw- регулярно отвечает русскому зв-."
memory: "gwiazda — «звезда», и оба значения те же, что в русском: и небесное тело, и знаменитость — gwiazda rocka. Звуковое соответствие регулярное: польское gw- отвечает русскому зв-. Следите за чередованием в предложном: gwiazda, но o gwieździe. И запомните gwiazdka — это и «звёздочка», и разговорное название Рождества."
idioms:
  - { pl: "spadająca gwiazda", ru: "падающая звезда" }
  - { pl: "gwiazda rocka", ru: "рок-звезда" }
  - { pl: "gwiazdozbiór", ru: "созвездие" }
