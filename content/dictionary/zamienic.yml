# review
id: zamienic
format: 2
lemma: "zamienić"
rank: 1903
pos: verb
aspect: perf
pron: { cyr: "заме́ниць" }
senses:
  - id: exchange
    ru: "обменять, поменять"
    examples:
      - pl: "Proszę mi to zamienić."
        ru: "Поменяйте мне это, пожалуйста."
        source: { kind: translated, id: 352737 }
      - pl: "Zamienił swoją krowę na dwa konie."
        ru: "Он обменял свою корову на двух лошадей."
        source: { kind: translated, id: 352849 }
      - pl: "Scott najpierw zamienił zegarek na książkę, a potem książkę na pieniądze."
        ru: "Скотт сначала обменял часы на книгу, а потом книгу на деньги."
        source: { kind: translated, id: 826525 }
      - pl: "Zamieńmy się miejscami."
        ru: "Давайте поменяемся местами."
        source: { kind: translated, id: 1353098 }
      - pl: "Tom zamienił się miejscami z Mary."
        ru: "Том поменялся местами с Мэри."
        source: { kind: translated, id: 3711187 }
      - pl: "Zamieniłbyś się ze mną na miejsca?"
        ru: "Ты бы поменялся со мной местами?"
        source: { kind: translated, id: 603217 }
  - id: turn-into
    ru: "превратить, превратиться во что-либо"
    examples:
      - pl: "Jezus zamienił wodę w wino."
        ru: "Иисус превратил воду в вино."
        source: { kind: translated, id: 13064125 }
      - pl: "Woda zamarzła i zamieniła się w lód."
        ru: "Вода замёрзла и превратилась в лёд."
        source: { kind: translated, id: 11749893 }
      - pl: "Dyskusja w końcu zamieniła się w kłótnię."
        ru: "Дискуссия в конце концов превратилась в ссору."
        source: { kind: translated, id: 728586 }
  - id: have-a-word
    ru: "перекинуться словом"
    examples:
      - pl: "Musimy zamienić słówko."
        ru: "Нам нужно перекинуться словечком."
        source: { kind: translated, id: 4359906 }
      - pl: "Chcę zamienić z tobą słowo."
        ru: "Я хочу перемолвиться с тобой словом."
        source: { kind: translated, id: 6603149 }
      - pl: "Chciałbym zamienić z tobą dwa słowa."
        ru: "Я хотел бы сказать тебе пару слов."
        source: { kind: translated, id: 966854 }
notes:
  - { kind: false-friend, text: "Не путайте с карточкой zmienić «изменить». zmienić — сделать другим (zmienić zdanie «передумать»), zamienić — обменять одно на другое или превратить во что-то." }
  - { kind: government, text: "Обмен строится с предлогом na и винительным: zamienić krowę na konie «обменять корову на лошадей»." }
  - { kind: usage, text: "Возвратное zamienić się w coś значит «превратиться во что-то»: zamienił się w żabę «он превратился в лягушку»." }
  - { kind: usage, text: "Идиома zamienić się w słuch — «превратиться в слух», то есть приготовиться внимательно слушать." }
  - { kind: usage, text: "Обычное отглагольное существительное здесь — zamiana «обмен, замена». Форма zamienienie возможна, но встречается редко и звучит книжно." }
collocations:
  - { pl: "zamienić się miejscami", ru: "поменяться местами" }
  - { pl: "zamienić słowo", ru: "перекинуться словом" }
  - { pl: "zamienić się w", ru: "превратиться в" }
etymology: "za- + mienić «менять», от праславянского *měna «мена». Русское «заменить» — то же самое слово, но значения разошлись: польское zamienić чаще «обменять» и «превратить», чем «заменить»."
memory: "Различайте пару: zmienić — «изменить» (zmienić zdanie «передумать»), zamienić — «обменять» (zamienić się miejscami «поменяться местами») и «превратить» (zamienił wodę w wino)."
idioms:
  - { pl: "zamienić się miejscami", ru: "поменяться местами" }
  - { pl: "zamienić się w słuch", ru: "превратиться в слух" }
  - { pl: "zamienił stryjek siekierkę na kijek", ru: "променял дядюшка топор на палку" }
