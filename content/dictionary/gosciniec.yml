# review
id: gosciniec
format: 2
lemma: "gościniec"
rank: 5488
pos: noun
pron: { cyr: "госьци́нец" }
senses:
  - id: highroad
    ru: "большак, проезжая дорога (устаревшее)"
    examples:
      - pl: "Gościniec prowadził do miasta."
        ru: "Большак вёл в город."
        source: { kind: authored }
      - pl: "Szli gościńcem przez pola."
        ru: "Они шли большаком через поля."
        source: { kind: authored }
      - pl: "Przy gościńcu stała karczma."
        ru: "У дороги стоял трактир."
        source: { kind: authored }
  - id: gift
    ru: "гостинец, подарок с дороги"
    examples:
      - pl: "Przywiózł dzieciom gościniec."
        ru: "Он привёз детям гостинец."
        source: { kind: authored }
      - pl: "Dostałam gościniec od babci."
        ru: "Я получила гостинец от бабушки."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Два значения, и оба устаревающие: старая проезжая дорога и подарок, привезённый гостем." }
  - { kind: false-friend, text: "Русское «гостинец» сохранило только второе значение — подарок. Польское держит оба, и дорожное даже первым." }
  - { kind: government, text: "Мужской неодушевлённый; беглое e: gościniec, но gościńca." }
  - { kind: usage, text: "Корень gość «гость», который уже есть в словаре. В корпусе слово не встречается, поэтому все примеры составлены вручную." }
collocations:
  - { pl: "przywieźć gościniec", ru: "привезти гостинец" }
etymology: "От gość «гость»: и дорога, по которой приезжают гости, и подарок, который они привозят. Русское «гостинец» сохранило лишь второе."
memory: "gościniec — «большак» и «гостинец» сразу, от gość «гость». Русское слово оставило только подарок, польское держит оба значения."
idioms:
  - { pl: "przywieźć gościniec", ru: "привезти гостинец" }
