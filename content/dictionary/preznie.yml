  - { pl: "sprężyna", ru: "пружина", relation: root }
etymology: "От прилагательного PRĘŻNY «упругий; энергичный», а оно — от глагола PRĘŻYĆ «напрягать, выгибать»."
memory: "prężnie — как sprężyna, пружина: с упругой силой. Firma prężnie się rozwija — фирма растёт, как распрямлённая пружина."
