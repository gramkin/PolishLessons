notes:
  - { kind: false-friend, text: "PRĘŻNIE не имеет отношения к русскому «прежде»: это «динамично, энергично». Корень тот же, что в SPRĘŻYNA «пружина» — упругая сила." }
  - { kind: usage, text: "Чаще всего с глаголами ROZWIJAĆ SIĘ «развиваться» и DZIAŁAĆ «работать, действовать»: PRĘŻNIE DZIAŁAJĄCA FIRMA «успешно работающая фирма». Сравнительная степень PRĘŻNIEJ, превосходная NAJPRĘŻNIEJ." }
  - { kind: pronunciation, text: "Ę перед Ż звучит носовым «эу̃»: «прэ́у̃жне». Ударение на первый слог." }
collocations:
  - { pl: "prężnie się rozwijać", ru: "бурно развиваться" }
  - { pl: "prężnie działać", ru: "активно работать" }
