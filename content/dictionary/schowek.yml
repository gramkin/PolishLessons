notes:
  - { kind: false-friend, text: "SCHOWEK — «место, куда прячут», от SCHOWAĆ «спрятать». Это и тайник, и кладовка, и бардачок в машине, и отсек для багажа. В компьютере SCHOWEK — буфер обмена: SKOPIUJ DO SCHOWKA. Камера хранения на вокзале — PRZECHOWALNIA BAGAŻU." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Беглое E: SCHOWEK, но SCHOWKA. Родительный — SCHOWKA, с окончанием -A." }
  - { kind: government, text: "В бардачке — W SCHOWKU, местный. В буфер обмена — DO SCHOWKA, DO с родительным. Отделение для чего-то — SCHOWEK NA COŚ, NA с винительным: SCHOWEK NA NARZĘDZIA." }
  - { kind: pronunciation, text: "Читается «схо́вэк», два слога, ударение на первом. S и CH произносятся раздельно: «сх». В формах без беглого E буква W стоит перед K и оглушается: SCHOWKA — «схо́фка»." }
collocations:
  - { pl: "schowek w samochodzie", ru: "бардачок" }
  - { pl: "schowek na narzędzia", ru: "ящик для инструментов" }
  - { pl: "schowek bagażowy", ru: "багажный отсек" }
family:
  - { pl: "chować", ru: "прятать", relation: root, id: chowac }
  - { pl: "schować", ru: "спрятать", relation: derived, id: schowac }
  - { pl: "przechowalnia", ru: "камера хранения", relation: derived }
etymology: "От SCHOWAĆ «спрятать», а тот — от CHOWAĆ «прятать; растить». Русским «ховать» и «схрон» он родня, но русский оставил этот корень диалектам, а в польском он главный: CHOWAĆ значит «прятать»."
memory: "Schowek — тайник, кладовка, бардачок, буфер обмена. Читается «схо́вэк», а schowka — «схо́фка». От schować — спрятать. Skopiuj do schowka — скопируй в буфер."
idioms:
  - { pl: "schowek na rękawiczki", ru: "бардачок (букв. отделение для перчаток)" }
  - { pl: "skopiować do schowka", ru: "скопировать в буфер обмена" }
