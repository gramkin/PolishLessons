# review
id: straszny
format: 2
lemma: "straszny"
rank: 665
pos: adj
pron: { cyr: "стра́шны" }
senses:
  - id: terrible
    ru: "страшный, ужасный"
    examples:
      - pl: "Ból był straszny."
        ru: "Боль была ужасная."
        source: { kind: tatoeba, id: 354672 }
      - pl: "Miałem straszny sen."
        ru: "Мне приснился страшный сон."
        source: { kind: translated, id: 349425 }
      - pl: "To była straszna tragedia."
        ru: "Это была страшная трагедия."
        source: { kind: translated, id: 2263214 }
  - id: intensifier
    ru: "ужасный (как усилитель)"
    note: "straszny tchórz «ужасный трус» — так же, как русское «ужасный»."
    examples:
      - pl: "Jest strasznym tchórzem."
        ru: "Он ужасный трус."
        source: { kind: translated, id: 2139125 }
      - pl: "Miałam wczoraj straszną migrenę."
        ru: "У меня вчера была страшная мигрень."
        source: { kind: tatoeba, id: 6406053 }
      - pl: "Ona jest straszną chwalipiętą."
        ru: "Она ужасная хвастунья."
        source: { kind: translated, id: 418342 }
  - id: something-terrible
    ru: "coś strasznego — нечто ужасное"
    examples:
      - pl: "Stało się coś strasznego."
        ru: "Случилось нечто ужасное."
        source: { kind: translated, id: 2263218 }
      - pl: "Coś strasznego musiało się stać."
        ru: "Должно быть, случилось что-то ужасное."
        source: { kind: translated, id: 5985109 }
      - pl: "Chcę tylko wyjechać z tego strasznego miejsca."
        ru: "Я хочу только уехать из этого ужасного места."
        source: { kind: translated, id: 744074 }
  - id: most-terrible
    ru: "najstraszniejszy — самый страшный"
    examples:
      - pl: "Trzęsienie ziemi to rzecz najstraszniejsza."
        ru: "Землетрясение — самое страшное, что бывает."
        source: { kind: translated, id: 1614925 }
      - pl: "Najstraszniejszą rzeczą w życiu jest niepewność."
        ru: "Самое страшное в жизни — неизвестность."
        source: { kind: translated, id: 969932 }
      - pl: "Nie ma nic straszniejszego niż trzęsienie ziemi."
        ru: "Нет ничего страшнее землетрясения."
        source: { kind: translated, id: 362499 }
notes:
  - { kind: usage, text: "Кроме прямого «страшный» слово свободно работает усилителем, ровно как русское «ужасный»: straszny tchórz «ужасный трус», straszna migrena, w strasznym stanie." }
  - { kind: usage, text: "Оборот coś strasznego «нечто ужасное» очень частотен: Stało się coś strasznego." }
  - { kind: usage, text: "Степени правильные: straszny — straszniejszy — najstraszniejszy; мужское личное множественное — straszni." }
  - { kind: usage, text: "Наречие strasznie тоже усиливает: strasznie zimno «ужасно холодно», strasznie się cieszę." }
  - { kind: usage, text: "Родня: strach «страх», straszyć «пугать», przestraszyć się «испугаться»." }
collocations:
  - { pl: "coś strasznego", ru: "нечто ужасное" }
  - { pl: "straszny tchórz", ru: "ужасный трус" }
  - { pl: "strasznie zimno", ru: "ужасно холодно" }
  - { pl: "straszny sen", ru: "страшный сон" }
family:
  - { pl: "strach", ru: "страх", relation: root }
  - { pl: "straszyć", ru: "пугать", relation: derived }
  - { pl: "strasznie", ru: "ужасно", relation: derived }
etymology: "От strach «страх», праславянское *strachъ — то же слово, что русские «страх» и «страшный»."
memory: "straszny — «страшный», и корень тот же, что в русском: strach «страх». Кроме прямого значения слово свободно работает усилителем, ровно как русское «ужасный»: straszny tchórz «ужасный трус», straszna migrena, w strasznym stanie. Степени правильные, мужское личное множественное — straszni. Наречие strasznie тоже усиливает: strasznie zimno «ужасно холодно»."
idioms:
  - { pl: "coś strasznego", ru: "нечто ужасное" }
  - { pl: "straszny tchórz", ru: "ужасный трус" }
  - { pl: "strasznie zimno", ru: "ужасно холодно" }
