notes:
  - { kind: false-friend, text: "Русская «лестница» годится и на ступени в доме, и на приставную. Польский их развёл: SCHODY это лестница в здании, та, по которой ходят внутри, а DRABINA — приставная, та, которую носят с собой. Поэтому WEJŚĆ PO SCHODACH и WEJŚĆ PO DRABINIE — два совсем разных действия. А по-украински «драбина» значит в точности то же, что по-польски, и кто знает украинский, узнает слово сразу." }
  - { kind: usage, text: "Десять форм, женский род. В дательном и местном падежах получается DRABINIE, с мягким «н». В родительном множественного окончания нет: DRABIN. Уменьшительное DRABINKA значит и небольшую стремянку, и шведскую стенку в спортзале. Прилагательное DRABINIASTY живёт в сочетании WÓZ DRABINIASTY — так называли телегу с лестничными боками." }
  - { kind: government, text: "По лестнице — PO DRABINIE, местный падеж после PO, как и в русском «по лестнице». Приставить лестницу к стене — OPRZEĆ DRABINĘ O ŚCIANĘ, винительный дважды: сперва у лестницы, потом после предлога O. Без лестницы — BEZ DRABINY, родительный. Упасть с лестницы — SPAŚĆ Z DRABINY, тоже родительный после Z." }
  - { kind: pronunciation, text: "Читается «драби́на», три слога, ударение на предпоследнем. Сочетание DR произносится слитно, без гласной между согласными. Буква I после B смягчает её и читается сама: получается «би». Трудных мест в слове нет, и для русского уха оно одно из самых легких в этом разделе словаря." }
  - { kind: register, text: "Слово нейтральное и хозяйственное: DRABINA DREWNIANA, DRABINA ALUMINIOWA, DRABINA SZNUROWA «верёвочная лестница». У пожарных это DRABINA STRAŻACKA. Переносное DRABINA SPOŁECZNA «социальная лестница» вполне книжное и частое в газетах, и строится оно так же, как у нас, с тем же образом подъёма по ступеням." }
collocations:
  - { pl: "wejść po drabinie", ru: "подняться по лестнице" }
  - { pl: "oprzeć drabinę", ru: "приставить лестницу" }
  - { pl: "drabina sznurowa", ru: "верёвочная лестница" }
family:
  - { pl: "drabinka", ru: "стремянка; шведская стенка", relation: derived }
  - { pl: "drabiniasty", ru: "лестничный (о телеге с боками)", relation: derived }
  - { pl: "drabinowy", ru: "лестничный", relation: derived }
etymology: "Слово общее у польского с украинским, где оно звучит «драбина» и значит то же самое; дальше его происхождение спорно, и языковеды возводят его то к германским, то к собственным корням. Любопытнее тут русское слово: «лестница» идёт от «лезть», то есть названа по действию, а не по виду. Так один предмет получил в двух языках имена по разным признакам: у нас по тому, что по нему лезут, у поляков по чему-то иному и забытому."
memory: "Приставная лестница, и только она: лестница в доме это schody, и путать их нельзя, потому что wejsc po schodach и wejsc po drabinie — разные действия. Читается «драби́на», без трудных мест. По-украински «драбина» значит то же, так что узнать слово легко. По лестнице — po drabinie, с местным падежом. Уменьшительное drabinka это ещё и шведская стенка."
idioms:
  - { pl: "drabina społeczna", ru: "социальная лестница" }
