# review
id: bomba
format: 2
lemma: "bomba"
rank: 903
pos: noun
pron: { cyr: "бо́мба" }
senses:
  - id: bomb
    ru: "бомба"
    examples:
      - pl: "Bomba została podłożona."
        ru: "Бомбу заложили."
        source: { kind: translated, id: 5230038 }
      - pl: "Tom myślał, że to była bomba."
        ru: "Том думал, что это бомба."
        source: { kind: translated, id: 5222248 }
      - pl: "Ta bomba może zabić dużo ludzi."
        ru: "Эта бомба может убить много людей."
        source: { kind: translated, id: 10568117 }
  - id: defuse
    ru: "rozbroić bombę — обезвредить бомбу"
    examples:
      - pl: "Pomyślnie rozbroili bombę."
        ru: "Они успешно обезвредили бомбу."
        source: { kind: translated, id: 12046657 }
      - pl: "Czy możesz rozbroić bombę?"
        ru: "Ты можешь обезвредить бомбу?"
        source: { kind: translated, id: 13680821 }
      - pl: "Wkrótce zamierzamy zdetonować bombę."
        ru: "Скоро мы собираемся взорвать бомбу."
        source: { kind: translated, id: 8756083 }
  - id: great
    ru: "Bomba! — Класс! (разговорное одобрение)"
    note: "Разговорное значение, которого в русском у «бомбы» до недавнего времени не было."
    examples:
      - pl: "Bomba! Świetnie to wymyśliłeś."
        ru: "Класс! Отлично придумал."
        source: { kind: authored }
      - pl: "Impreza była bomba."
        ru: "Вечеринка была — класс."
        source: { kind: authored }
      - pl: "Wpadł jak bomba z nowiną."
        ru: "Он влетел как бомба с новостью."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Основное значение совпадает с русским: bomba atomowa «атомная бомба», podłożyć bombę «заложить бомбу», rozbroić bombę «обезвредить бомбу»." }
  - { kind: usage, text: "В разговорной речи Bomba! значит «Класс!, Здорово!» — одобрительный возглас. Прилагательное bombowy тоже бывает похвалой: bombowy pomysł «отличная идея»." }
  - { kind: usage, text: "wpaść jak bomba — «влететь как вихрь, ворваться»: о человеке, который врывается с новостью или без предупреждения." }
  - { kind: pronunciation, text: "Читается ровно как русское «бомба», ударение на первом слоге." }
collocations:
  - { pl: "bomba atomowa", ru: "атомная бомба" }
  - { pl: "podłożyć bombę", ru: "заложить бомбу" }
  - { pl: "rozbroić bombę", ru: "обезвредить бомбу" }
  - { pl: "wpaść jak bomba", ru: "ворваться" }
family:
  - { pl: "bombowy", ru: "бомбовый, отличный", relation: derived }
  - { pl: "bombardować", ru: "бомбить", relation: derived }
etymology: "Через французское bombe из итальянского bomba, а то из латинского bombus «гул», из греческого βόμβος. Русское «бомба» — то же заимствование."
memory: "bomba — «бомба», слово международное и ловушек не содержит. Но запомните разговорное Bomba! «Класс!» и оборот wpaść jak bomba «ворваться, влететь вихрем». Прилагательное bombowy тоже бывает похвалой."
idioms:
