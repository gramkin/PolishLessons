# review
id: zabic
format: 2
lemma: "zabić"
rank: 110
pos: verb
aspect: perf
pron: { cyr: "за́биць" }
senses:
  - id: kill
    ru: "убить"
    examples:
      - pl: "Chciałeś mnie zabić?"
        ru: "Ты хотел меня убить?"
        source: { kind: tatoeba, id: 8675007 }
      - pl: "Tom ich zabił."
        ru: "Том их убил."
        source: { kind: tatoeba, id: 6696773 }
      - pl: "Wiesz, kto zabił Toma?"
        ru: "Ты знаешь, кто убил Тома?"
        source: { kind: tatoeba, id: 3859058 }
  - id: killed
    ru: "в страдательных оборотах: быть убитым"
    examples:
      - pl: "On został zabity mieczem."
        ru: "Он был убит мечом."
        source: { kind: tatoeba, id: 8671670 }
      - pl: "Spał jak zabity."
        ru: "Он спал как убитый."
        source: { kind: tatoeba, id: 2809336 }
notes:
  - { kind: usage, text: "Видовая пара: zabijać «убивать» — zabić «убить»." }
  - { kind: usage, text: "Оборот zabić czas значит «убить время», как в русском." }
collocations:
  - { pl: "zabić czas", ru: "убить время" }
  - { pl: "spać jak zabity", ru: "спать как убитый" }
etymology: "Приставочное от bić «бить» с приставкой za-; ср. русское «забить» и «убить» — та же модель «бить» + приставка."
memory: "Устроено как русское «убить»: приставка плюс «бить» (bić). Видовая пара — zabijać/zabić. И тот же образный оборот, что в русском: zabić czas «убить время», spać jak zabity «спать как убитый»."
idioms:
  - { pl: "zabić czas", ru: "убить время" }
  - { pl: "spać jak zabity", ru: "спать как убитый" }
  - { pl: "zabić kurę znoszącą złote jajka", ru: "убить курицу, несущую золотые яйца" }
