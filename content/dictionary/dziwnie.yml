# review
id: dziwnie
format: 2
lemma: "dziwnie"
rank: 1392
pos: adv
pron: { cyr: "дзи́вне" }
senses:
  - id: strangely
    ru: "странно, необычно"
    examples:
      - pl: "Jak dziwnie."
        ru: "Как странно."
        source: { kind: tatoeba, id: 5909115 }
      - pl: "On dziwnie mówi."
        ru: "Он странно говорит."
        source: { kind: translated, id: 1859746 }
      - pl: "Jego historia brzmi dziwnie."
        ru: "Его история звучит странно."
        source: { kind: translated, id: 3897603 }
  - id: smell-taste
    ru: "о вкусе и запахе: странно"
    examples:
      - pl: "To mleko dziwnie smakuje."
        ru: "У этого молока странный вкус."
        source: { kind: tatoeba, id: 1002730 }
      - pl: "Dziwnie pachniesz."
        ru: "От тебя странно пахнет."
        source: { kind: translated, id: 956735 }
      - pl: "Nie wyglądam dziwnie?"
        ru: "Я не выгляжу странно?"
        source: { kind: translated, id: 8608762 }
notes:
  - { kind: usage, text: "Jak dziwnie! — готовая реплика «Как странно!». Само dziwnie стоит при глаголе: dziwnie pachnie «странно пахнет»." }
  - { kind: usage, text: "Прилагательное — dziwny «странный», карточка уже есть. Существительное — dziwak «чудак»." }
  - { kind: usage, text: "Оборот dziwnie się czuję значит «мне как-то не по себе»." }
  - { kind: pronunciation, text: "dzi звучит мягко, как «дзи»: дзи́вне. Ударение на первый слог." }
collocations:
  - { pl: "jak dziwnie", ru: "как странно" }
  - { pl: "dziwnie pachnie", ru: "странно пахнет" }
  - { pl: "dziwnie się czuję", ru: "мне не по себе" }
etymology: "От dziwny «странный», из праславянского *divъ «диво, чудо». Русские «диво» и «дивный» — то же гнездо, только значение разошлось."
memory: "dziwnie — «странно». Jak dziwnie! значит «Как странно!». Прилагательное — dziwny. Корень тот же, что в русском «диво», но польское dziwny значит именно «странный», а не «чудесный»."
