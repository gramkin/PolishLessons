etymology: "Заимствовано из немецкого, ср. SPEICHER «амбар, склад», которое восходит к латинскому SPICARIUM «хранилище колосьев», от SPICA «колос». Старая польская форма — ŚPICHLERZ."
memory: "Spichlerz — «амбар», где хранят колосья: латинское spica «колос» спряталось внутри. Spichlerz Europy — житница Европы."
idioms:
  - { pl: "spichlerz Europy", ru: "житница Европы" }
