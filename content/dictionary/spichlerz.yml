notes:
  - { kind: pronunciation, text: "Читается «спи́хлеш»: CH — «х», L перед E мягкое, конечное RZ оглушается в «ш». Ударение на первом слоге." }
  - { kind: usage, text: "Мужской род, неодушевлённый: винительный совпадает с именительным — ZBUDOWAĆ SPICHLERZ. В родительном множественного две формы, SPICHLERZY и SPICHLERZÓW, обе правильны. Звательный SPICHLERZU совпадает с предложным. Есть и короткий вариант SPICHRZ — в названиях: WYSPA SPICHRZÓW в Гданьске." }
  - { kind: usage, text: "В переносном смысле SPICHLERZ — «житница», плодородный край, кормящий других: SPICHLERZ EUROPY. Употребляется с творительным после BYĆ: BYŁ SPICHLERZEM KRAJU." }
