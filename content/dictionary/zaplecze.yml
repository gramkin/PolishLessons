etymology: "Сложено из приставки ZA- и основы PLEC-, от PLECY «спина», и буквально означает «то, что за спиной». Слово PLECY идёт от праславянского корня, давшего русское «плечи», но значения разошлись: польский увёл его на всю спину, а русский оставил на плечах, и для спины взял отдельное слово «спина». Отсюда и расхождение, из-за которого PLECY нельзя переводить как «плечи». Из того же гнезда PLECAK «рюкзак», носимое на спине, и ZAPLECZE, помещение за спиной торгового зала."
memory: "Корень обманчив: plecy по-польски значит «спина», а не «плечи», плечи это ramiona. Отсюда zaplecze это буквально «то, что за спиной»: подсобка, а в переносном смысле база и опора, zaplecze polityczne. Из того же корня plecak «рюкзак». Поправить предлог: na zapleczu с местным падежом, где русский говорит «в подсобке». Устойчивый оборот mieć zaplecze значит «иметь опору». Читается «запле́че», где cz это «ч»."
