notes:
  - { kind: false-friend, text: "За этим словом стоит ловушка, на которую попадается каждый русскоязычный. PLECY по-польски — это «спина», а не «плечи»: BOLĄ MNIE PLECY значит «у меня болит спина». Плечи называются RAMIONA. Слово PLECY при этом существует только во множественном числе, как русские «плечи», что путает ещё сильнее. Отсюда и ZAPLECZE: буквально «то, что за спиной», тыл, задняя часть. Из того же корня PLECAK «рюкзак», то есть носимое на спине." }
  - { kind: usage, text: "Восемь форм, средний род, родительный множественного ZAPLECZY. Первое значение бытовое и очень частое: любое служебное помещение за торговым залом или за кухней называется ZAPLECZE, и надпись на двери читается просто. Второе значение переносное и газетное: ZAPLECZE POLITYCZNE, ZAPLECZE FINANSOWE, ZAPLECZE NAUKOWE — всё это опора, за счёт которой кто-то держится. Русский во втором случае скажет «база», «поддержка» или «тыл», смотря по контексту." }
  - { kind: government, text: "В подсобке — предлог NA с местным падежом: NA ZAPLECZU, и это важно, потому что русский говорит «в подсобке», с предлогом «в». В подсобку — DO ZAPLECZA, предлог DO с родительным. Чья база — родительный без предлога: ZAPLECZE PARTII. Иметь поддержку — MIEĆ ZAPLECZE, винительный без предлога, и оборот этот устойчивый: MA MOCNE ZAPLECZE значит «у него прочная опора»." }
  - { kind: pronunciation, text: "Читается «запле́че», три слога, ударение на втором. Сочетание CZ даёт твёрдое «ч», а конечное E читается как «э», так что слово кончается на «че». Буква L перед E звучит мягко. В слове PLECY слышно «пле́цы», с твёрдым «ц», потому что там C без следующего Z. Это полезное различие: CZ даёт «ч», а одиночное C всегда «ц»." }
  - { kind: register, text: "В прямом значении слово обиходное, в переносном газетное. Частые обороты: NA ZAPLECZU «в подсобке», ZAPLECZE KUCHENNE «кухонная подсобка», ZAPLECZE POLITYCZNE «политическая база», MIEĆ ZAPLECZE «иметь опору», ZAPLECZE SOCJALNE «бытовые помещения» в документах о стройке. Прилагательное ZAPLECZOWY значит «подсобный»: POMIESZCZENIA ZAPLECZOWE. В переносном смысле слово всегда звучит одобрительно: иметь ZAPLECZE значит быть не одному." }
