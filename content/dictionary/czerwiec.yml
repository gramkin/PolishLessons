etymology: "От названия насекомого CZERWIEC, польской кошенили, из которой веками добывали багряную краску. Собирали её в июне, и месяц получил имя по промыслу. Тот же корень дал CZERWONY «красный», и русское «червонный» ему прямая родня, как и «червец», название того же насекомого. Русский для месяца взял латинское JUNIUS, по имени богини Юноны, и связь с цветом потерялась. Украинское «червень» сохранило польский образ полностью."
memory: "Четвёртый славянский месяц, и имя у него от насекомого: czerwiec это польская кошениль, из которой делали красную краску, и собирали её в июне. Тот же корень в czerwony «красный», а по-русски он знаком по «червонному» и «червецу». Украинское «червень» такое же. Парадигма привычная: беглое e выпадает, czerwiec, но czerwca. Читается «че́рвец»: cz даёт «ч», а конечное c даёт «ц»."
idioms:
  - { pl: "Poznański Czerwiec", ru: "Познаньский июнь, рабочие протесты 1956 года" }
