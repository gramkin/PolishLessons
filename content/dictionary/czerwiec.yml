notes:
  - { kind: false-friend, text: "Четвёртый славянский месяц в этом словаре, и название у него неожиданное. CZERWIEC назван по насекомому: CZERWIEC POLSKI, польская кошениль, которую собирали именно в июне ради красной краски. Тот же корень сидит в CZERWONY «красный». Русскому он знаком дважды: «червец» это то самое насекомое, а «червонный» значит красный. Название месяца у нас латинское, от имени Юноны, а украинское «червень» устроено как польское." }
  - { kind: usage, text: "Десять форм, мужской род, и парадигма уже знакомая: беглое E исчезает в косвенных падежах, CZERWIEC, но CZERWCA, CZERWCEM, CZERWCU. Это четвёртый месяц на этом образце после KWIECIEŃ, SIERPIEŃ и GRUDZIEŃ, так что схему можно считать выученной. Отличие от них одно: здесь нет мягкого Ń на конце, слово кончается на твёрдое C, поэтому и формы выходят чуть проще." }
  - { kind: government, text: "В каком месяце — предлог W с местным падежом: W CZERWCU «в июне». До и от — DO и OD с родительным: DO CZERWCA, OD CZERWCA. Дата идёт родительным без предлога: PIERWSZEGO CZERWCA «первого июня». В конце июня — POD KONIEC CZERWCA, предлог POD с родительным, тогда как русский говорит «в конце» с предложным." }
  - { kind: pronunciation, text: "Читается «че́рвец», два слога, ударение на первом. Сочетание CZ даёт «ч», а конечное C даёт «ц», так что слово начинается и кончается разными шипящими и свистящими, и путать их нельзя. Сочетание WIE даёт мягкое «ве». В родительном CZERWCA беглое E выпадает, и слышно «че́рвца», три согласных подряд, что для русского уха непривычно, но выговаривается легко." }
  - { kind: register, text: "Слово нейтральное и ежедневное. Частые обороты: W CZERWCU, POD KONIEC CZERWCA, CZERWCOWY PORANEK «июньское утро». Первого июня в Польше, как и в России, отмечают DZIEŃ DZIECKA. Отдельно стоит исторический слой: POZNAŃSKI CZERWIEC или просто CZERWIEC 1956 означает рабочие протесты в Познани и их подавление, и этот оборот поляк узнаёт сразу, как и GRUDZIEŃ 1970." }
