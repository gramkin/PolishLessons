# review
id: denny
format: 2
lemma: "denny"
rank: 4406
pos: adj
pron: { cyr: "дэ́нны" }
senses:
  - id: lousy
    ru: "отстойный, никудышный (разг.)"
    examples:
      - pl: "Ten film był denny."
        ru: "Этот фильм был отстойный."
        source: { kind: authored }
      - pl: "Co za denny pomysł!"
        ru: "Что за дурацкая идея!"
        source: { kind: authored }
      - pl: "Impreza była denna, wyszliśmy po godzinie."
        ru: "Вечеринка была отстойная, мы ушли через час."
        source: { kind: authored }
  - id: bottom
    ru: "донный (относящийся ко дну водоёма)"
    examples:
      - pl: "Ryby denne żerują przy dnie."
        ru: "Донные рыбы кормятся у дна."
        source: { kind: authored }
      - pl: "Rybak zarzucił sieć denną."
        ru: "Рыбак забросил донную сеть."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "DENNY не «денной» и не про деньги и дни: дневной — DZIENNY, денежный — PIENIĘŻNY. DENNY — от DNO, «дно»: OSAD DENNY, «донный осадок». В разговоре — оценка «отстой»: TO DNO! — «это отстой», а DENNY FILM — «отстойный фильм»." }
  - { kind: usage, text: "Одиннадцать форм без степеней. В разговорном значении чаще сказуемое: BYŁO DENNIE, FILM JEST DENNY. Форма для мужчин-людей — о людях в той же оценке: DENNI AKTORZY, «бездарные актёры». Наречие DENNIE — «отстойно»." }
  - { kind: government, text: "В прямом значении стоит после существительного, как термин: FAUNA DENNA, SIEĆ DENNA, OSAD DENNY. В оценочном — перед ним или сказуемым: DENNY ŻART, ŻART BYŁ DENNY." }
  - { kind: pronunciation, text: "Читается «дэ́нны», два слога, ударение на первом. D перед E твёрдое, «дэ», не «де». Двойное N тянется." }
  - { kind: register, text: "Разговорное значение — молодёжное и грубоватое, в официальной речи его нет; там говорят SŁABY, KIEPSKI. Прямое значение — термин биологии и рыболовства." }
collocations:
  - { pl: "denny film", ru: "отстойный фильм" }
  - { pl: "ryby denne", ru: "донные рыбы" }
  - { pl: "osad denny", ru: "донный осадок" }
family:
  - { pl: "dno", ru: "дно; отстой (разг.)", relation: root, id: dno }
  - { pl: "dennie", ru: "отстойно (разг.)", relation: derived }
  - { pl: "kiepski", ru: "плохой, неважный (разг.)", relation: root }
etymology: "От DNO «дно», того же корня, что русское «дно», «донный». Оценочное значение пришло из разговорного TO DNO — «ниже некуда»."
memory: "Denny — от dno: донный, а в разговоре «отстойный». Denny film — отстойный фильм, to dno — это отстой. Дневной — dzienny! Читается «дэ́нны»."
idioms:
  - { pl: "sięgnąć dna", ru: "опуститься на самое дно" }
