# review
id: usunac
format: 2
lemma: "usunąć"
rank: 1746
pos: verb
aspect: perf
pron: { cyr: "усу́нонць" }
senses:
  - id: delete
    ru: "удалить (файл, запись, комментарий)"
    examples:
      - pl: "Proszę usunąć ten plik."
        ru: "Пожалуйста, удали этот файл."
        source: { kind: translated, id: 5930858 }
      - pl: "Usuń ten komentarz."
        ru: "Удали этот комментарий."
        source: { kind: tatoeba, id: 5437826 }
      - pl: "Usuń niepotrzebne pliki aby zwolnić pamięć."
        ru: "Удали ненужные файлы, чтобы освободить память."
        source: { kind: tatoeba, id: 12889065 }
  - id: remove
    ru: "убрать, удалить (предмет, орган, человека)"
    examples:
      - pl: "Dentysta usunął jej zepsuty ząb."
        ru: "Дантист удалил ей больной зуб."
        source: { kind: translated, id: 498410 }
      - pl: "Chirurg usunął pacjentowi wyrostek."
        ru: "Хирург удалил пациенту аппендикс."
        source: { kind: translated, id: 1021808 }
      - pl: "Został usunięty z naszego klubu."
        ru: "Его исключили из нашего клуба."
        source: { kind: translated, id: 768688 }
notes:
  - { kind: usage, text: "Совершенный вид; несовершенный — usuwać. Это основное слово для «удалить» в компьютерном смысле." }
  - { kind: government, text: "Удалить что-то — usunąć coś (винительный падеж); удалить откуда-то — usunąć z czegoś (родительный с z): usunąć z klubu, usunąć z urzędu." }
  - { kind: usage, text: "Повелительное usuń очень частотно в инструкциях: usuń niepotrzebne pliki «удали ненужные файлы»." }
  - { kind: false-friend, text: "Русское «усунуть» не существует, хотя корень тот же, что в «сунуть»: польское usunąć значит именно «убрать прочь»." }
collocations:
  - { pl: "usunąć plik", ru: "удалить файл" }
  - { pl: "usunąć ząb", ru: "удалить зуб" }
  - { pl: "usunąć z listy", ru: "удалить из списка" }
family:
  - { pl: "usuwać", ru: "удалять", relation: root }
  - { pl: "usunięcie", ru: "удаление", relation: root }
etymology: "Приставка u- «прочь» плюс sunąć «двигать, сунуть»: буквально «отодвинуть прочь». Корень тот же, что в русском «сунуть»."
memory: "usunąć — «удалить»: usuń plik «удали файл», usunąć ząb «удалить зуб». Несовершенный вид — usuwać. Откуда — z czegoś: usunięty z klubu."
