# review
id: brak
format: 2
lemma: "brak"
rank: 655
pos: noun
pron: { cyr: "брак" }
senses:
  - id: impersonal
    ru: "brak komuś czegoś — кому-л. не хватает чего-л."
    note: "Безличный оборот: дательный лица плюс родительный вещи."
    examples:
      - pl: "Brak mi słów."
        ru: "У меня нет слов."
        source: { kind: tatoeba, id: 351502 }
      - pl: "Brak mi pieniędzy."
        ru: "У меня недостаточно денег."
        source: { kind: tatoeba, id: 768680 }
      - pl: "Brak ci do mnie cierpliwości."
        ru: "У тебя не хватает терпения на меня."
        source: { kind: tatoeba, id: 351501 }
  - id: lack
    ru: "нехватка, отсутствие"
    note: "z braku czegoś «из-за нехватки чего-либо»."
    examples:
      - pl: "Brak wiadomości jest dobrą wiadomością."
        ru: "Отсутствие новостей - хорошая новость."
        source: { kind: tatoeba, id: 589647 }
      - pl: "Ciemność jest brakiem światła."
        ru: "Темнота — это отсутствие света."
        source: { kind: translated, id: 2212288 }
      - pl: "Rośliny zmarniały z braku wody."
        ru: "Растения зачахли из-за нехватки воды."
        source: { kind: translated, id: 356434 }
  - id: shortages
    ru: "braki — перебои, нехватки; недостатки, изъяны"
    note: "Во множественном слово работает двояко."
    examples:
      - pl: "Braki wody są spowodowane pogodą."
        ru: "Перебои с водой вызваны погодой."
        source: { kind: translated, id: 538540 }
      - pl: "W roku 1994 wystąpiły w Japonii braki wody i ryżu."
        ru: "В 1994 году в Японии были перебои с водой и рисом."
        source: { kind: translated, id: 369088 }
      - pl: "Był tak zaślepiony miłością, że nie widział jej braków."
        ru: "Он был так ослеплён любовью, что не видел её недостатков."
        source: { kind: translated, id: 753826 }
notes:
  - { kind: government, text: "Главная конструкция безличная: brak плюс дательный лица плюс родительный вещи. Brak mi słów «У меня нет слов», Brak mi pieniędzy «Мне не хватает денег». Русский строит точно так же — «не хватает кому чего»." }
  - { kind: false-friend, text: "Осторожно: польское brak никогда не значит «брак, женитьба» — супружество по-польски małżeństwo. Совпадает только значение «изъян, негодность»." }
  - { kind: usage, text: "Оборот z braku czegoś значит «из-за нехватки, за неимением»: usechł z braku wody, oblał egzamin z braku przygotowania." }
  - { kind: usage, text: "Во множественном braki покрывает и «перебои» (braki wody), и «недостатки, изъяны» (nie widział jej braków)." }
  - { kind: usage, text: "Глагол того же гнезда — brakować «не хватать»: brakuje mi czasu «мне не хватает времени»." }
collocations:
  - { pl: "Brak mi słów", ru: "У меня нет слов" }
  - { pl: "z braku czegoś", ru: "из-за нехватки чего-либо" }
  - { pl: "braki wody", ru: "перебои с водой" }
  - { pl: "brakować", ru: "не хватать" }
family:
  - { pl: "brakować", ru: "не хватать", relation: derived }
  - { pl: "brakujący", ru: "недостающий", relation: derived }
  - { pl: "małżeństwo", ru: "брак, супружество", relation: root }
etymology: "Из немецкого Brack «негодный товар, отбраковка» — то же заимствование, что русское «брак» в смысле «изъян». Русское «брак» как женитьба — совсем другое слово, от «брать»."
memory: "brak — «нехватка, отсутствие», и чаще всего вы встретите его в безличном обороте: brak плюс дательный плюс родительный — Brak mi słów «У меня нет слов». Оборот z braku czegoś значит «из-за нехватки». Во множественном braki это и «перебои» (braki wody), и «недостатки». И запомните ложного друга: польское brak никогда не значит «женитьба» — супружество это małżeństwo."
idioms:
