# review
id: uratowac
format: 2
lemma: "uratować"
rank: 502
pos: verb
aspect: perf
pron: { cyr: "урато́ваць" }
senses:
  - id: save
    ru: "спасти (кого-л., что-л. — винительный)"
    note: "uratować komuś życie «спасти кому-либо жизнь»: человек в дательном, życie в винительном."
    examples:
      - pl: "Możemy uratować Toma?"
        ru: "Мы можем спасти Тома?"
        source: { kind: tatoeba, id: 2405988 }
      - pl: "Lekarz uratował mi życie."
        ru: "Доктор спас мою жизнь."
        source: { kind: tatoeba, id: 362481 }
      - pl: "Ryzykował życiem, by ją uratować."
        ru: "Он рисковал жизнью, чтобы спасти её."
        source: { kind: tatoeba, id: 364812 }
  - id: saved
    ru: "zostać uratowanym — быть спасённым"
    note: "Страдательный оборот с przez и винительным: uratowany przez przechodnia."
    examples:
      - pl: "Tom został uratowany przez przechodnia."
        ru: "Том был спасен прохожим."
        source: { kind: tatoeba, id: 5239853 }
      - pl: "Obaj mężczyźni zostali uratowani."
        ru: "Оба мужчины были спасены."
        source: { kind: tatoeba, id: 6396835 }
      - pl: "Zostaliśmy uratowani przez strażaków."
        ru: "Нас спасли пожарные."
        source: { kind: translated, id: 12888027 }
  - id: save-oneself
    ru: "uratować się — спастись"
    note: "С się: uratowałem się dzięki temu «благодаря этому я спасся»."
    examples:
      - pl: "Uratowałem się dzięki temu."
        ru: "Благодаря этому я спасся."
        source: { kind: translated, id: 1170324 }
      - pl: "Uratowałam się dzięki temu."
        ru: "Благодаря этому я спаслась."
        source: { kind: translated, id: 1170325 }
      - pl: "Jesteśmy uratowani."
        ru: "Мы спасены."
        source: { kind: translated, id: 8745295 }
notes:
  - { kind: government, text: "uratować komuś życie — человек стоит в дательном, а życie в винительном: lekarz uratował mi życie «врач спас мне жизнь». Русский строит так же." }
  - { kind: usage, text: "Несовершенный вид — ratować: ratuje «спасает», uratował «спас»." }
  - { kind: usage, text: "Страдательный оборот очень частый: został uratowany przez przechodnia «его спас прохожий», где деятель идёт с przez и винительным." }
  - { kind: usage, text: "С się значит «спастись»: uratowałem się dzięki temu. Отсюда же ratunek «спасение» и krzyk ratunku «крик о помощи»." }
collocations:
  - { pl: "uratować komuś życie", ru: "спасти кому-либо жизнь" }
  - { pl: "uratować się", ru: "спастись" }
  - { pl: "został uratowany", ru: "был спасён" }
  - { pl: "nie do uratowania", ru: "спасти невозможно" }
family:
  - { pl: "ratować", ru: "спасать", relation: root }
  - { pl: "ratunek", ru: "спасение", relation: derived }
  - { pl: "ratownik", ru: "спасатель", relation: derived }
etymology: "Приставка u- плюс ratować, заимствованного из немецкого retten «спасать». Русское «ратовать» — другое слово, родственное «рати», и с польским ratować не связано."
memory: "uratować — «спасти», совершенный вид к ratować. Оборот uratować komuś życie строится ровно как русский: человек в дательном, жизнь в винительном — lekarz uratował mi życie «врач спас мне жизнь». Очень частый страдательный вариант: został uratowany przez przechodnia «его спас прохожий», где деятель идёт с przez и винительным. С się — «спастись». Существительное — ratunek «спасение»."
idioms:
  - { pl: "uratować komuś życie", ru: "спасти кому-либо жизнь" }
  - { pl: "został uratowany", ru: "был спасён" }
  - { pl: "nie do uratowania", ru: "спасти невозможно" }
