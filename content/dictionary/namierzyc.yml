notes:
  - { kind: false-friend, text: "Корень прозрачен, а слово в целом — нет. Na- плюс mierzyć «мерить», праславянское *měriti, то же, что русские «мерить» и «измерить». Но современное значение одним русским словом не передать: в зависимости от контекста это «запеленговать» (сигнал), «засечь» (цель) или разговорное «вычислить» (человека). Выбирать приходится каждый раз заново." }
  - { kind: government, text: "Засекают КОГО и ЧТО — винительный: namierzyć telefon, namierzyć sprawcę. А по какому признаку — предлог PO с ПРЕДЛОЖНЫМ: namierzyć PO numerze, PO adresie IP, PO karcie płatniczej. Русский здесь берёт дательный («по номеру»), так что падеж меняется, хотя предлог тот же." }
  - { kind: register, text: "Слово современное и слегка техническое: оно пришло с радиопеленгацией, а теперь говорится о телефонах, картах и адресах IP. В разговорной речи namierzyć kogoś значит просто «вычислить, найти» — без всякой техники: namierzyłem go na Facebooku. В официальном языке служб это нейтральный термин." }
  - { kind: pronunciation, text: "Причастие идёт по образцу -ony/-eni, уже выведенному на соседних карточках: глаголы на -ić и -yć дают zbliżony — zbliżeni, namierzony — namierzeni, как zatrudniony — zatrudnieni. Отдельно запоминать не нужно: класс причастия предсказуем по инфинитиву." }
collocations:
  - { pl: "namierzyć telefon", ru: "запеленговать телефон" }
  - { pl: "namierzyć sygnał", ru: "засечь сигнал" }
  - { pl: "namierzyć po numerze", ru: "вычислить по номеру" }
family:
  - { pl: "mierzyć", ru: "мерить, измерять", relation: root }
  - { pl: "namierzać", ru: "засекать, пеленговать", relation: aspect }
  - { pl: "pomiar", ru: "измерение", relation: derived }
etymology: "Приставка na- плюс mierzyć «мерить», от праславянского *měriti — того же корня, что русские «мерить», «измерить», «мера». Исходный образ — «навести меру на что-то», то есть определить направление и расстояние; отсюда старое значение пеленгации и современное «вычислить по сигналу». Из того же гнезда miara «мера» и pomiar «измерение»."
memory: "namierzyć — «засечь, запеленговать, вычислить», от mierzyć «мерить». Одного русского соответствия нет: сигнал пеленгуют, цель засекают, человека вычисляют. И предлог: namierzyć PO numerze с предложным, не с дательным."
idioms:
  - { pl: "namierzyć po numerze", ru: "вычислить по номеру" }
  - { pl: "dać się namierzyć", ru: "дать себя засечь" }
