# review
id: konto
format: 2
lemma: "konto"
rank: 1454
pos: noun
pron: { cyr: "ко́нто" }
senses:
  - id: bank-account
    ru: "счёт в банке"
    examples:
      - pl: "Nie mam konta w banku."
        ru: "У меня нет счёта в банке."
        source: { kind: tatoeba, id: 12955875 }
      - pl: "Otwórz konto."
        ru: "Открой счёт."
        source: { kind: translated, id: 3744086 }
      - pl: "Wyciągnął z konta 100 dolarów."
        ru: "Он снял со счёта сто долларов."
        source: { kind: translated, id: 350826 }
  - id: online-account
    ru: "аккаунт, учётная запись"
    examples:
      - pl: "Mam konto na Facebooku."
        ru: "У меня есть аккаунт в Фейсбуке."
        source: { kind: translated, id: 497368 }
      - pl: "Jest problem z moim kontem."
        ru: "С моим аккаунтом проблема."
        source: { kind: translated, id: 6305457 }
notes:
  - { kind: false-friend, text: "Одно польское слово на два русских: konto bankowe «банковский счёт» и konto na Facebooku «аккаунт в Фейсбуке». Русский различает «счёт» и «аккаунт», польский обходится одним словом." }
  - { kind: usage, text: "Средний род. Предложный — na koncie «на счёте»." }
  - { kind: usage, text: "Ходовые обороты: otworzyć konto «открыть счёт», zamknąć konto «закрыть счёт», stan konta «состояние счёта»." }
  - { kind: usage, text: "Переносно — mieć coś na swoim koncie «иметь что-то на своём счету», о достижениях." }
collocations:
  - { pl: "konto bankowe", ru: "банковский счёт" }
  - { pl: "otworzyć konto", ru: "открыть счёт" }
  - { pl: "na koncie", ru: "на счёте" }
etymology: "Через немецкое Konto из итальянского conto «счёт», восходящего к латинскому computare «считать». Русский «счёт» — своё слово, поэтому совпадает только значение."
memory: "konto — и «счёт» в банке, и «аккаунт» в интернете: русский для этого держит два слова, польский обходится одним. Предложный — na koncie. Otworzyć konto «открыть счёт», zamknąć konto «закрыть»."
idioms:
  - { pl: "mieć czyste konto", ru: "иметь чистую репутацию" }
  - { pl: "na własne konto", ru: "на свой страх и риск" }
  - { pl: "stan konta", ru: "состояние счёта" }
formExamplesSkip:
  - { form: "konta", cell: "Звательный", reason: "звательный падеж: к предмету или понятию не обращаются" }
