# review
id: znacznie
format: 2
lemma: "znacznie"
rank: 1674
pos: adv
pron: { cyr: "зна́чне" }
senses:
  - id: much-more
    ru: "значительно, гораздо (при сравнении)"
    examples:
      - pl: "To znacznie ciekawsze."
        ru: "Это намного интереснее."
        source: { kind: tatoeba, id: 8428497 }
      - pl: "Chiny są znacznie większe od Japonii."
        ru: "Китай гораздо больше Японии."
        source: { kind: tatoeba, id: 403571 }
      - pl: "On jest znacznie mądrzejszy ode mnie."
        ru: "Он намного умнее меня."
        source: { kind: tatoeba, id: 2176447 }
  - id: considerably
    ru: "значительно, намного"
    examples:
      - pl: "Chciałbym znacznie więcej."
        ru: "Я хотел бы значительно больше."
        source: { kind: translated, id: 363609 }
      - pl: "Wyglądasz znacznie lepiej."
        ru: "Ты выглядишь значительно лучше."
        source: { kind: translated, id: 7000001 }
      - pl: "Teraz w jeziorze jest znacznie więcej wody niż kiedyś."
        ru: "Сейчас в озере гораздо больше воды, чем раньше."
        source: { kind: tatoeba, id: 552593 }
notes:
  - { kind: usage, text: "Наречие почти всегда стоит перед сравнительной степенью: znacznie lepiej «значительно лучше», znacznie większy «значительно больше». Само по себе оно почти не употребляется." }
  - { kind: usage, text: "Синонимы — o wiele и dużo: o wiele lepiej и znacznie lepiej значат одно и то же." }
  - { kind: usage, text: "Образовано от znaczny «значительный», которое в свою очередь от znak «знак»." }
  - { kind: usage, text: "Степени сравнения znaczniej и najznaczniej есть в парадигме, но в корпусе не встречаются." }
collocations:
  - { pl: "znacznie lepiej", ru: "значительно лучше" }
  - { pl: "znacznie więcej", ru: "значительно больше" }
  - { pl: "znacznie większy", ru: "значительно больший" }
etymology: "От znaczny «значительный», а то — от znak «знак», праславянское *znakъ. Русское «значительно» построено от того же корня «знак — значить», так что слова параллельны."
memory: "znacznie = «значительно, гораздо», и почти всегда перед сравнительной степенью: znacznie lepiej «значительно лучше». Синонимы — o wiele и dużo."
idioms:
