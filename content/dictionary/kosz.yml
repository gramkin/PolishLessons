  - { pl: "koszyczek", ru: "корзиночка", relation: derived }
etymology: "Из праславянского *košь «плетёная корзина». В русском этот корень сохранился в «кошёлке», «кошеле» и «кошельке» — все они когда-то означали плетёную или сшитую ёмкость, а «кошелёк» уменьшил её до кармана. Польский оставил слово при корзине и развил до урны и баскетбольного кольца."
memory: "Родительный множественного двойной: koszy и koszów, обе формы правильные. А dać komuś kosza — это отказать, и только с родительным."
idioms:
  - { pl: "dać komuś kosza", ru: "отказать, дать от ворот поворот" }
  - { pl: "wylądować w koszu", ru: "отправиться в мусорку" }
