notes:
  - { kind: usage, text: "Родительный множественного имеет две равноправные формы: KOSZY и KOSZÓW. Обе литературные, обе живые, выбирать можно свободно. Это не то же самое, что tragedii и tragedyj, где вторая форма книжная и устарелая: здесь колеблется исконное слово, и колебание обычно для мужских основ на -sz, -cz, -rz." }
  - { kind: usage, text: "Значений три, и все ходовые: корзина (kosz grzybów), урна или мусорное ведро (kosz na śmieci) и баскетбольная корзина (rzucić do kosza). Отсюда же название игры — KOSZYKÓWKA. Отдельно стоит оборот DAĆ KOMUŚ KOSZA: это отказать ухажёру, и родительный там обязателен, kosza, а не kosz." }
