etymology: "Из латинского CIVILIS «гражданский», от CIVIS «гражданин», через немецкое и французское посредство. Польский взял прилагательное CYWILNY, а затем сократил его до существительного CYWIL, назвав человека по признаку — приём обычный, тот же самый дал WOJSKOWY и SŁUŻBOWY в роли существительных. Русский заимствовал ту же латинскую основу, но иначе: у него есть «цивильный», «цивилизация», «цивилист», а существительного для человека не получилось, и его место заняло исконное «штатский» — от немецкого STAAT через «штат», то есть «состоящий при гражданском штате». Так одно понятие получило в двух языках слова из разных источников при одинаковой исходной мысли."
memory: "Русского «цивиля» нет: cywil это штатский, гражданское лицо, а w cywilu значит «на гражданке» или «в штатском». Из латинского civilis «гражданский», от civis «гражданин»; русский взял ту же основу в «цивилизацию», а для человека приспособил немецкое «штатский». Нужное сразу по приезде: stan cywilny это семейное положение, urząd stanu cywilnego — загс. Множественное cywile, и два родительных: cywilów и cywili."
idioms:
