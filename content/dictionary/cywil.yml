notes:
  - { kind: false-friend, text: "Русского существительного «цивиль» нет, и слово приходится переводить описательно: CYWIL это штатский, гражданское лицо, человек не в военной форме. Устойчивое W CYWILU значит «на гражданке» или «в штатском», смотря по контексту, а DO CYWILA — «на гражданку», то есть из армии. Отдельно стоит прилагательное CYWILNY: оно значит «гражданский» и входит в выражения, которые приезжему нужны сразу. STAN CYWILNY это семейное положение, а URZĄD STANU CYWILNEGO — загс, где регистрируют браки. SŁUŻBA CYWILNA значит государственную гражданскую службу." }
  - { kind: usage, text: "Одиннадцать форм, мужской род, одушевлённое лицо. Именительный множественного — CYWILE, по общему образцу для слов на мягкий L. Родительных множественного два, и оба правильны: CYWILÓW и CYWILI, причём первое чаще в газетном языке, а второе звучит немного книжнее; выбирать можно свободно. Винительный единственного равен родительному, CYWILA. Местный и звательный единственного — CYWILU, и в сочетании с предлогом W эта форма дала устойчивое выражение W CYWILU, которое по частоте давно обогнало все остальные." }
  - { kind: pronunciation, text: "Читается «цы́виль», два слога, ударение на первом. Буква Y даёт «ы», а не «и», поэтому первый слог звучит «цы», как в русском «цыган». Буква C это «ц», W перед гласной — «в». Конечное L по-польски заметно мягче русского твёрдого «л», и в транскрипции передаётся как «ль». В форме CYWILA слышно «цыви́ля», в форме CYWILEM — «цыви́лем». В форме CYWILÓW буква Ó даёт «у», а конечное W оглушается: «цыви́луф»." }
  - { kind: register, text: "Слово нейтральное, но пришло из военного обихода и там же чаще всего звучит. В армии CYWIL говорят и о постороннем человеке, и, слегка насмешливо, о новобранце, который ещё не привык к службе. В газетном языке CYWILE означает мирное население: OFIARY WŚRÓD CYWILÓW «жертвы среди гражданских». Выражение PO CYWILNEMU значит «в штатском»: POLICJANT PO CYWILNEMU. Женского соответствия у слова нет, и о женщине тоже скажут CYWIL или, описательно, OSOBA CYWILNA." }
