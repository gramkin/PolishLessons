notes:
  - { kind: false-friend, text: "Ловушка на слух, и для русского она почти неизбежна: KIT читается «кит» и значит «замазка», а не морское животное. Русский «кит» по-польски WIELORYB, слово совсем другого вида. Запомнить помогает то, что польское слово пришло из немецкого KITT «замазка», а русский «кит» — из греческого KETOS. То есть одинаково они звучат по чистой случайности, родства никакого. Если в польском тексте речь о море, а на странице стоит KIT, значит это всё-таки замазка — или вздор." }
  - { kind: usage, text: "Второе значение разговорное и живёт почти только в одном выражении: WCISKAĆ KOMUŚ KIT, буквально «вдавливать кому-то замазку», то есть врать, рассказывать небылицы. Русские соответствия — «вешать лапшу на уши», «заливать». Оборот этот частый и вполне обиходный, грубым не считается. Само слово в этом значении не склоняется свободно: говорят WCIŚNIJ KIT, NIE WCISKAJ KITU, но множественного числа в нём не употребляют, хотя формы в таблице есть." }
  - { kind: pronunciation, text: "Читается «кит», в один слог, ровно как русское слово для морского животного, — и именно поэтому стоит быть внимательным. Конечное t остаётся глухим. В косвенных падежах появляется второй слог и ударение падает на него по общему правилу предпоследнего слога: KITU — «ки́ту», KITEM — «ки́тэм». В предложном падеже KICIE сочетание ci даёт мягкое «ч»: «ки́че»." }
  - { kind: government, text: "Для чего замазка — предлог DO с родительным: KIT DO OKIEN, KIT DO SZYB. Русский говорит «замазка для окон», тоже с родительным, но с предлогом «для», так что сам падеж совпадает. В разговорном значении оборот требует дательного для лица и винительного для вещи: WCISKAĆ KOMUŚ KIT. При отрицании винительный меняется на родительный, как всегда в польском: NIE WCISKAJ MI KITU, а не KIT." }
collocations:
  - { pl: "kit do okien", ru: "замазка для окон" }
  - { pl: "wciskać komuś kit", ru: "вешать лапшу на уши" }
  - { pl: "kit wysechł", ru: "замазка высохла" }
family:
  - { pl: "kitować", ru: "замазывать, шпатлевать", relation: derived }
