  - { pl: "szyba", ru: "стекло (оконное)", relation: root, id: szyba }
etymology: "Из немецкого KITT «замазка, мастика», пришедшего в польский вместе со стекольным и столярным ремеслом, вероятно в средние века. Русский «кит» к этому слову отношения не имеет: он идёт из греческого KETOS «морское чудовище» через церковнославянский, и совпадение звучания случайно. Переносное значение, «вздор», выросло из образа выражения WCISKAĆ KIT: замазку вдавливают в щель, чтобы скрыть её, — и так же словами замазывают правду. Русский для той же мысли выбрал лапшу и уши, образ другой, а приём тот же."
memory: "KIT — это «замазка», а не «кит»: морское животное по-польски wieloryb. Звучат одинаково по случайности, корни разные. Разговорный оборот: wciskać komuś kit «вешать лапшу на уши», при отрицании — nie wciskaj mi kitu, с родительным."
idioms:
  - { pl: "wciskać komuś kit", ru: "вешать лапшу на уши, заливать" }
  - { pl: "kit do okien", ru: "оконная замазка" }
