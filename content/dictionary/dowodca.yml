# review
id: dowodca
format: 2
lemma: "dowódca"
rank: 1593
pos: noun
pron: { cyr: "дову́дца" }
senses:
  - id: commander
    ru: "командир"
    examples:
      - pl: "Dowódca wystawił swoich ludzi na ogień."
        ru: "Командир подставил своих людей под огонь."
        source: { kind: translated, id: 730528 }
      - pl: "Dowódca naszego pułku jest dla swoich żołnierzy jak dobry ojciec."
        ru: "Командир нашего полка для своих солдат как добрый отец."
        source: { kind: translated, id: 6905556 }
      - pl: "Załoga musi być posłuszna dowódcy statku."
        ru: "Экипаж должен подчиняться командиру судна."
        source: { kind: translated, id: 441204 }
  - id: orders
    ru: "командир (о приказах и подчинении)"
    examples:
      - pl: "Nie mogę ignorować rozkazów mojego dowódcy."
        ru: "Я не могу игнорировать приказы своего командира."
        source: { kind: translated, id: 4869414 }
      - pl: "Dowódco, pokład gotowy do lądowania."
        ru: "Командир, борт готов к посадке."
        source: { kind: tatoeba, id: 1736704 }
notes:
  - { kind: usage, text: "Существительное мужского рода, но склоняется по женскому типу на -a: dowódca, dowódcy, dowódcą — как kolega или mężczyzna." }
  - { kind: usage, text: "Звательная форма dowódco используется в уставном обращении: Dowódco, pokład gotowy «Командир, борт готов»." }
  - { kind: usage, text: "Глагол — dowodzić «командовать» с творительным падежом: dowodzić statkiem «командовать судном»." }
  - { kind: usage, text: "Отличайте от kapitan «капитан» (звание) — dowódca это должность, командующий." }
collocations:
  - { pl: "dowódca statku", ru: "командир судна" }
  - { pl: "rozkaz dowódcy", ru: "приказ командира" }
  - { pl: "być dowódcą", ru: "быть командиром" }
etymology: "От dowodzić «командовать» (do- + wodzić «водить») с суффиксом деятеля -ca. Русское «командир» — заимствование, но польское слово прозрачно: «тот, кто ведёт»."
memory: "dowódca = «командир», буквально «тот, кто ведёт» (от wodzić «водить»). Слово мужского рода, но склоняется по женскому типу на -a: dowódcy, dowódcą. Обращение — dowódco!"
idioms:
