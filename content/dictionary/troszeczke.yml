# review
id: troszeczke
format: 2
lemma: "troszeczkę"
rank: 4046
pos: adv
pron: { cyr: "трошэ́чкэ" }
senses:
  - id: a-tiny-bit
    ru: "чуточку, капельку (о количестве)"
    examples:
      - pl: "Dodaj troszeczkę soli."
        ru: "Добавь чуточку соли."
        source: { kind: authored }
      - pl: "Zostało tylko troszeczkę mleka."
        ru: "Осталось совсем капелька молока."
        source: { kind: authored }
      - pl: "Zjem troszeczkę, tylko na spróbowanie."
        ru: "Я съем чуточку, только попробовать."
        source: { kind: authored }
  - id: slightly
    ru: "чуть-чуть, немножко (о степени)"
    examples:
      - pl: "Mówisz troszeczkę za szybko."
        ru: "Ты говоришь чуть-чуть быстровато."
        source: { kind: authored }
      - pl: "Troszeczkę się boję."
        ru: "Мне немножко страшно."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "TROSZECZKĘ — двойное уменьшительное от TROCHĘ «немного»: TROCHĘ, TROSZKĘ, TROSZECZKĘ, как в русском «немного — немножко — немножечко». Похоже на украинское «трошки», а в русском такого корня нет." }
  - { kind: usage, text: "Наречие, одна форма. Два значения: количество, TROSZECZKĘ CUKRU, и степень, TROSZECZKĘ ZMĘCZONY. Носовое Ę на конце — след старого винительного падежа." }
  - { kind: government, text: "При существительном требует родительного падежа, как русское «чуточку»: TROSZECZKĘ WODY, TROSZECZKĘ CZASU." }
  - { kind: pronunciation, text: "Читается «трошэ́чкэ», ударение на предпоследнем слоге. SZ — «ш», конечное Ę в беглой речи звучит как «э»." }
  - { kind: register, text: "Слово ласковое и разговорное: с детьми, в семье, в просьбах. В нейтральной речи — TROCHĘ." }
collocations:
  - { pl: "troszeczkę cukru", ru: "чуточку сахара" }
  - { pl: "troszeczkę za dużo", ru: "чуть-чуть многовато" }
  - { pl: "jeszcze troszeczkę", ru: "ещё чуточку" }
family:
  - { pl: "trochę", ru: "немного", relation: root, id: troche }
  - { pl: "troszkę", ru: "немножко", relation: root, id: troszke }
  - { pl: "ani trochę", ru: "ни капельки", relation: root }
etymology: "От TROCHĘ — застывшего винительного падежа старого TROCHA «крошка, кусочек». Суффиксы -SZK- и -ECZK- дают ласковое уменьшительное, как русское «-ечк-» в «немножечко»."
memory: "Troszeczkę — чуточку: trochę, troszkę, troszeczkę. Читается «трошэ́чкэ». Troszeczkę soli — чуточку соли."
idioms:
  - { pl: "ani trochę", ru: "ни капельки" }
