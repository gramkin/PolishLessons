notes:
  - { kind: false-friend, text: "Ловушки в значении нет: PSYCHIATRYCZNY — «психиатрический». Ловушка в соседе: PSYCHICZNY — «психический», о душевном состоянии: ZDROWIE PSYCHICZNE, CHOROBA PSYCHICZNA. PSYCHIATRYCZNY — о врачебной науке и учреждениях: SZPITAL PSYCHIATRYCZNY, LECZENIE PSYCHIATRYCZNE. Болезнь психическая, а больница психиатрическая — как и по-русски." }
  - { kind: usage, text: "Относительное прилагательное, степеней сравнения нет, все одиннадцать форм живые. Форма для мужчин-людей PSYCHIATRYCZNI используется в медицинских текстах: PACJENCI PSYCHIATRYCZNI, «психиатрические пациенты». Русское -ический здесь, как обычно, польское -yczny после R." }
  - { kind: government, text: "Ставится после существительного: SZPITAL PSYCHIATRYCZNY, BADANIE PSYCHIATRYCZNE, OPIEKA PSYCHIATRYCZNA. Лечиться у психиатра — LECZYĆ SIĘ PSYCHIATRYCZNIE, наречием, или CHODZIĆ DO PSYCHIATRY, DO с родительным." }
  - { kind: pronunciation, text: "Читается «псыхятры́чны», четыре слога, ударение на предпоследнем. PSY начинается с твёрдого «псы», без русского «и»: PSYCHIATRA «псыхя́тра». CHIA даёт «хя», а TRY — твёрдое «тры»." }
  - { kind: register, text: "Нейтральный медицинский и юридический термин. В разговоре больницу называют грубо PSYCHIATRYK или WARIATKOWO, и оба слова обидны. Вежливо — SZPITAL PSYCHIATRYCZNY или просто SZPITAL." }
collocations:
  - { pl: "szpital psychiatryczny", ru: "психиатрическая больница" }
  - { pl: "badanie psychiatryczne", ru: "психиатрическое обследование, экспертиза" }
  - { pl: "opieka psychiatryczna", ru: "психиатрическая помощь" }
family:
  - { pl: "psychiatra", ru: "психиатр", relation: root, id: psychiatra }
  - { pl: "psychiatria", ru: "психиатрия", relation: root }
  - { pl: "psychiczny", ru: "психический", relation: root, id: psychiczny }
etymology: "От PSYCHIATRIA, из греческих psychḗ «душа» и iatreía «лечение», то есть «врачевание души». Слово придумал немецкий врач Иоганн Рейль в 1808 году. Русское «психиатрический» и польское PSYCHIATRYCZNY пришли одним путём, только суффиксы разные: -ическ- и -yczn-."
memory: "Psychiatryczny — психиатрический: szpital psychiatryczny, badanie psychiatryczne. А «психический» — psychiczny. Читается «псыхятры́чны», через твёрдое «псы»."
idioms:
  - { pl: "szpital psychiatryczny", ru: "психиатрическая больница, «психушка»" }
