  - { pl: "Ameryka", ru: "Америка", relation: root, id: ameryka }
etymology: "Аббревиатура английского United States of America, заимствованная целиком. По-польски её читают по буквам, но с польскими названиями самих букв."
memory: "USA не склоняется: jadę do USA, mieszkam w USA — форма одна на все падежи, падеж показывает предлог. Глагол при этом во множественном числе: USA są republiką. Читается по буквам: у-эс-а."
