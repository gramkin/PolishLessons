# review
id: usa
format: 2
lemma: "USA"
rank: 1694
pos: noun
pron: { cyr: "уэса́" }
senses:
  - id: country
    ru: "США, Соединённые Штаты Америки"
    examples:
      - pl: "Jutro jadę do USA."
        ru: "Завтра я еду в США."
        source: { kind: tatoeba, id: 3460274 }
      - pl: "Ona wyjechała do USA."
        ru: "Она уехала в США."
        source: { kind: tatoeba, id: 598253 }
      - pl: "USA są republiką."
        ru: "США — это республика."
        source: { kind: translated, id: 921717 }
  - id: in-usa
    ru: "в США, из США (форма не меняется)"
    examples:
      - pl: "W USA jest ruch prawostronny."
        ru: "В США движение правостороннее."
        source: { kind: tatoeba, id: 982364 }
      - pl: "Jestem obywatelem USA."
        ru: "Я гражданин США."
        source: { kind: translated, id: 9382952 }
      - pl: "Chciałbym jechać do USA."
        ru: "Я хотел бы поехать в США."
        source: { kind: translated, id: 524423 }
notes:
  - { kind: usage, text: "Слово не склоняется: do USA, w USA, z USA — форма всегда одна, падеж показывает только предлог." }
  - { kind: government, text: "Согласуется со множественным числом: USA są republiką «США — республика», как и русское «США являются»." }
  - { kind: pronunciation, text: "Читается по буквам: u-es-a, с ударением на последнем слоге. Русское «США» читается «сэ-шэ-а» — буквы те же, чтение разное." }
  - { kind: usage, text: "Полное название — Stany Zjednoczone «Соединённые Штаты»; разговорно говорят просто Stany: jadę do Stanów «еду в Штаты»." }
collocations:
  - { pl: "do USA", ru: "в США" }
  - { pl: "w USA", ru: "в США" }
  - { pl: "obywatel USA", ru: "гражданин США" }
family:
