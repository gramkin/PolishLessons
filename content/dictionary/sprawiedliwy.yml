# review
id: sprawiedliwy
format: 2
lemma: "sprawiedliwy"
rank: 3780
pos: adj
pron: { cyr: "справедли́вы" }
senses:
  - id: fair
    ru: "справедливый (о человеке, решении)"
    examples:
      - pl: "Sędzia był surowy, ale sprawiedliwy."
        ru: "Судья был строгим, но справедливым."
        source: { kind: authored }
      - pl: "To nie jest sprawiedliwy podział."
        ru: "Это несправедливый раздел."
        source: { kind: authored }
      - pl: "Chcemy sprawiedliwszego systemu podatkowego."
        ru: "Мы хотим более справедливой налоговой системы."
        source: { kind: authored }
  - id: righteous
    ru: "праведный (в религии, истории)"
    examples:
      - pl: "Sprawiedliwy wśród Narodów Świata to tytuł dla ratujących Żydów."
        ru: "Праведник народов мира — звание для спасавших евреев."
        source: { kind: authored }
      - pl: "Bóg nagradza sprawiedliwych."
        ru: "Бог вознаграждает праведных."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Совпадение с русским «справедливый» почти полное, и это родственные слова. Особое значение — SPRAWIEDLIWY WŚRÓD NARODÓW ŚWIATA, «Праведник народов мира»: так в Польше называют тех, кто во время войны спасал евреев. Таких поляков больше, чем людей любой другой национальности, и слово SPRAWIEDLIWY здесь звучит торжественно." }
  - { kind: usage, text: "Полная парадигма с простыми степенями без -IEJ-: SPRAWIEDLIWY, SPRAWIEDLIWSZY, NAJSPRAWIEDLIWSZY. Форма для мужчин-людей во всех трёх: SPRAWIEDLIWI, SPRAWIEDLIWSI, NAJSPRAWIEDLIWSI. Обратите внимание: в сравнительной степени W стоит прямо перед SZ, без вставной гласной." }
  - { kind: government, text: "Справедливый к кому-то — SPRAWIEDLIWY DLA KOGOŚ или WOBEC KOGOŚ, с родительным: BYĆ SPRAWIEDLIWYM WOBEC DZIECI. Русское «справедлив к кому» с дательным здесь не работает." }
  - { kind: pronunciation, text: "Читается «справедли́вы», четыре слога, ударение на предпоследнем. WIE — «ве», DLI — мягкое «дли». В SPRAWIEDLIWSZY: «справедли́вшы», W оглушается перед SZ." }
  - { kind: register, text: "Нейтральное слово, от бытового TO NIESPRAWIEDLIWE!, «это нечестно!», до юридического и религиозного. В детской речи вместо него чаще говорят FAIR или UCZCIWY. PRAWO I SPRAWIEDLIWOŚĆ — название крупной польской партии." }
collocations:
  - { pl: "sprawiedliwy wyrok", ru: "справедливый приговор" }
  - { pl: "sprawiedliwy podział", ru: "справедливый раздел" }
  - { pl: "Sprawiedliwy wśród Narodów Świata", ru: "Праведник народов мира" }
family:
  - { pl: "sprawiedliwość", ru: "справедливость", relation: derived, id: sprawiedliwosc }
  - { pl: "niesprawiedliwy", ru: "несправедливый", relation: derived, id: niesprawiedliwy }
  - { pl: "prawo", ru: "право, закон", relation: root, id: prawo }
etymology: "От старого SPRAWIEDLIWY, «исправный, праведный», от корня PRAW-, того же, что в PRAWO «право, закон» и PRAWDA «правда». Русское «справедливый» собрано из тех же частей: С-ПРАВ-ЕДЛИВ-. Это одно общеславянское слово, дошедшее до обоих языков почти без изменений."
memory: "Sprawiedliwy — справедливый: sprawiedliwy sędzia, sprawiedliwy wyrok. Sprawiedliwszy, najsprawiedliwszy — без -iej-. Sprawiedliwy wśród Narodów Świata — Праведник народов мира. Читается «справедли́вы»."
idioms:
  - { pl: "sprawiedliwości stało się zadość", ru: "справедливость восторжествовала" }
