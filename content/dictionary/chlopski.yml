notes:
  - { kind: false-friend, text: "CHŁOP — это «крестьянин» или, разговорно, «мужик», а не «хлопец». Мальчик по-польски CHŁOPIEC, парень CHŁOPAK, и оба слова того же корня, но CHŁOPSKI относится только к CHŁOP: CHŁOPSKA RODZINA «крестьянская семья», CHŁOPSKI SYN «крестьянский сын». С хлопком слово тоже не связано: хлопковый по-польски BAWEŁNIANY." }
  - { kind: usage, text: "Самый частый оборот — NA CHŁOPSKI ROZUM «по здравому смыслу, если рассуждать просто». Им вводят житейский довод без теорий: NA CHŁOPSKI ROZUM TO NIE MA SENSU «по здравому смыслу в этом нет смысла». В исторических текстах CHŁOPSKI нейтрально значит «крестьянский»: POWSTANIE CHŁOPSKIE «крестьянское восстание», а в литературе есть целое направление, LITERATURA CHŁOPSKA." }
  - { kind: pronunciation, text: "«хуо́пски»: Ł звучит как короткое «у», и начало слова читается «хуо», а не «хло». Во множественном мужско-личном SK переходит в SC: CHŁOPSCY, «хуо́псцы», как POLSKI → POLSCY." }
collocations:
  - { pl: "chłopska rodzina", ru: "крестьянская семья" }
  - { pl: "chłopski syn", ru: "крестьянский сын" }
  - { pl: "powstanie chłopskie", ru: "крестьянское восстание" }
family:
  - { pl: "chłop", ru: "крестьянин; мужик", relation: root, id: chlop }
  - { pl: "chłopstwo", ru: "крестьянство", relation: derived }
  - { pl: "chłopak", ru: "парень", relation: root, id: chlopak }
etymology: "Образовано от chłop «крестьянин» с суффиксом -ski. Chłop — общеславянское слово, родственное русскому «холоп»: в русском оно стало означать зависимого слугу, а в польском — крестьянина и вообще взрослого мужчину."
memory: "Chłop — это русский «холоп», только в польском он остался крестьянином. Chłopski — «крестьянский», а na chłopski rozum — «по здравому смыслу», так, как рассудил бы простой мужик."
idioms:
  - { pl: "na chłopski rozum", ru: "по здравому смыслу" }
