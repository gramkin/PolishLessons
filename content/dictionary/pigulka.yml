  - { pl: "apteka", ru: "аптека", relation: root }
etymology: "Из латинского PILULA «шарик», уменьшительного от PILA «мяч»: лекарство катали в шарики, отсюда и название. Русская «пилюля» сохранила латинские l почти без изменений. Польское слово прошло через старую форму PIGUŁA, в которой на месте второго l появилось g, — переход необычный, и словари объясняют его по-разному, чаще всего влиянием соседних согласных. Твёрдо можно сказать лишь то, что корень тот же латинский, а g в польском слове вторично. Конечное -KA — обычное уменьшительное, добавленное уже на польской почве."
memory: "Не «пилюля» по стилю, а «таблетка»: PIGUŁKA — слово обиходное. ł даёт «у», поэтому «пигу́ука». От чего таблетка — через NA с винительным: pigułka NA ból głowy. И coś w pigułce значит «в двух словах»."
idioms:
