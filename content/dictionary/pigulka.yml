notes:
  - { kind: false-friend, text: "Оттенок перевёрнут, и это главное. Русское «пилюля» — слово устарелое и слегка насмешливое, в аптеке его не услышишь. Польское PIGUŁKA, наоборот, совершенно обиходное: так говорят и врач, и больной, и это первое слово для таблетки. Русскому нейтральному «таблетка» отвечает и PIGUŁKA, и TABLETKA, причём второе чуть официальнее. Так что переводить PIGUŁKA словом «пилюля» почти всегда неверно по стилю: нужна «таблетка»." }
  - { kind: usage, text: "Два значения различает только контекст. Общее — любая таблетка: PIGUŁKA NA BÓL GŁOWY, PIGUŁKA NASENNA. Особое — противозачаточная, и в этом смысле слово употребляется без всякого определения: BIERZE PIGUŁKI значит именно это. Есть и переносное выражение COŚ W PIGUŁCE — «в сжатом виде, в двух словах»: WIEDZA W PIGUŁCE, HISTORIA POLSKI W PIGUŁCE. Русский говорит «в двух словах» или «вкратце», образа пилюли там нет." }
  - { kind: pronunciation, text: "Читается «пигу́ука», в три слога, с ударением на предпоследнем. Буква ł даёт «у», и поскольку перед ней уже стоит u, получается долгое «уу»: PIGUŁKA — «пигу-у-ка». Это та же передача, что в ARTYKUŁ «арты́куу». В предложном падеже PIGUŁCE — «пигу́уце», где k переходит в c перед окончанием -E, как MATKA даёт MATCE." }
  - { kind: government, text: "Что принять — винительный падеж: ZAŻYĆ PIGUŁKĘ, WZIĄĆ PIGUŁKĘ. От чего — предлог NA с винительным: PIGUŁKA NA BÓL GŁOWY, PIGUŁKA NA KASZEL, буквально «таблетка на боль». Русский тут требует родительного с предлогом «от»: «таблетка от головной боли», так что конструкцию нужно перестраивать. Родительный множественного — PIGUŁEK, с беглым e, как MATKA даёт MATEK." }
collocations:
  - { pl: "zażyć pigułkę", ru: "принять таблетку" }
  - { pl: "pigułka na ból głowy", ru: "таблетка от головной боли" }
