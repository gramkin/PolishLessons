# review
id: jutro
format: 2
lemma: "jutro"
rank: 274
pos: noun
pron: { cyr: "ю́тро" }
senses:
  - id: tomorrow
    ru: "завтра"
    examples:
      - pl: "Przyjdę jutro."
        ru: "Я приду завтра."
        source: { kind: tatoeba, id: 3680580 }
      - pl: "Jutro go zapytam."
        ru: "Завтра я его спрошу."
        source: { kind: tatoeba, id: 975961 }
      - pl: "Jutro będzie gorąco."
        ru: "Завтра будет жарко."
        source: { kind: tatoeba, id: 528077 }
  - id: the-morrow
    ru: "завтрашний день, будущее (как существительное)"
    examples:
      - pl: "Do jutra."
        ru: "До завтра."
        source: { kind: tatoeba, id: 6154754 }
      - pl: "Jutro mam urodziny."
        ru: "Завтра — мой день рождения."
        source: { kind: tatoeba, id: 3460275 }
      - pl: "Jutro będzie piątek."
        ru: "Завтра пятница."
        source: { kind: tatoeba, id: 4451254 }
notes:
  - { kind: false-friend, text: "Главная ловушка: jutro — «завтра», а «утро» по-польски rano. Слова одного корня: завтрашний день начинается с утра, но значения разошлись." }
  - { kind: usage, text: "jutro бывает и существительным: lepsze jutro «лучшее завтра», Co z jutrem? «Как насчёт завтра?»" }
  - { kind: usage, text: "pojutrze значит «послезавтра», wczoraj — «вчера», do jutra — «до завтра» (и как прощание)." }
collocations:
  - { pl: "do jutra", ru: "до завтра" }
  - { pl: "jutro rano", ru: "завтра утром" }
  - { pl: "lepsze jutro", ru: "лучшее завтра" }
  - { pl: "od jutra", ru: "с завтрашнего дня" }
etymology: "Праславянское *(j)utro «утро» — то же слово, что русское «утро»; в польском значение сдвинулось на «завтра», а «утро» стало rano."
memory: "jutro — «завтра», а «утро» — rano. Слова одного корня: завтрашний день начинается с утра, но значения разошлись."
idioms:
  - { pl: "do jutra", ru: "до завтра" }
  - { pl: "lepsze jutro", ru: "лучшее завтра" }
  - { pl: "dzisiaj bal, jutro żal", ru: "сегодня бал, завтра жаль" }
