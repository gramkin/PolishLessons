# review
id: wieczny
format: 2
lemma: "wieczny"
rank: 2737
pos: adj
pron: { cyr: "ве́чны" }
senses:
  - id: eternal
    ru: "вечный"
    examples:
      - pl: "Wieczna zmarzlina sięga stu metrów."
        ru: "Вечная мерзлота достигает ста метров."
        source: { kind: authored }
      - pl: "Nie ma nic wiecznego."
        ru: "Нет ничего вечного."
        source: { kind: authored }
      - pl: "Wieczne pytania nie mają odpowiedzi."
        ru: "Вечные вопросы не имеют ответов."
        source: { kind: authored }
  - id: perpetual
    ru: "вечный, беспрестанный"
    examples:
      - pl: "Wieczny student skończył studia po dziesięciu latach."
        ru: "Вечный студент закончил учёбу через десять лет."
        source: { kind: authored }
      - pl: "Nie znoszę wiecznych narzekań."
        ru: "Терпеть не могу вечных жалоб."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Форм одиннадцать, и степеней нет уже по четвёртой причине. Fizyczny относит к разряду, mokry не образовал синтетических степеней, zagubiony — причастие, а здесь дело в самом значении: вечное не бывает более вечным, сравнение тут бессмысленно. Такие прилагательные называют абсолютными, и в их числе martwy «мёртвый», pierwszy «первый», bosy «босой»." }
  - { kind: usage, text: "Два оборота стоит запомнить целиком. WIECZNE PIÓRO — это перьевая ручка, буквально «вечное пером», и никакого отношения к вечности здесь нет, просто чернила не надо подливать каждый раз. WIECZNY STUDENT — вечный студент, тот, кто учится без конца, и образ совпадает с русским полностью." }
collocations:
  - { pl: "wieczny student", ru: "вечный студент" }
  - { pl: "wieczne pióro", ru: "перьевая ручка" }
  - { pl: "wieczna zmarzlina", ru: "вечная мерзлота" }
family:
  - { pl: "wiek", ru: "век", relation: root, id: wiek }
  - { pl: "wieczność", ru: "вечность", relation: derived }
  - { pl: "wiecznie", ru: "вечно", relation: derived }
etymology: "От WIEK «век», из праславянского *věkъ — то же слово, что русский «век». Прилагательное построено тем же суффиксом, что и наше «вечный», так что wieczny и «вечный» — одно образование. Отсюда же wieczność «вечность» и наречие wiecznie «вечно», и вся семья переносится напрямую."
memory: "Степеней нет потому, что вечное не градуируется. И wieczne pióro — это перьевая ручка, а не что-то про вечность."
idioms:
