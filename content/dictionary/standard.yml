# review
id: standard
format: 2
lemma: "standard"
rank: 4829
pos: noun
pron: { cyr: "ста́ндарт" }
senses:
  - id: standard
    ru: "стандарт, норма"
    examples:
      - pl: "Hotel spełnia europejskie standardy."
        ru: "Отель соответствует европейским стандартам."
        source: { kind: authored }
      - pl: "To nowy standard w branży."
        ru: "Это новый стандарт в отрасли."
        source: { kind: authored }
      - pl: "Standardy bezpieczeństwa są bardzo wysokie."
        ru: "Стандарты безопасности очень высокие."
        source: { kind: authored }
  - id: quality
    ru: "уровень, класс (жилья, услуг)"
    examples:
      - pl: "Mieszkanie ma wysoki standard."
        ru: "Квартира высокого класса."
        source: { kind: authored }
      - pl: "Standard życia w kraju wzrósł."
        ru: "Уровень жизни в стране вырос."
        source: { kind: authored }
  - id: jazz
    ru: "стандарт (в джазе)"
    examples:
      - pl: "Zespół zagrał kilka jazzowych standardów."
        ru: "Группа сыграла несколько джазовых стандартов."
        source: { kind: authored }
      - pl: "Ta piosenka stała się standardem."
        ru: "Эта песня стала стандартом."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "STANDARD — «стандарт», но часто и «уровень, класс»: MIESZKANIE O WYSOKIM STANDARDZIE — «квартира с хорошим ремонтом». STANDARD ŻYCIA — «уровень жизни». Стандартный — STANDARDOWY." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Родительный — STANDARDU. В местном D переходит в DZ: W STANDARDZIE." }
  - { kind: government, text: "Соответствовать стандартам — SPEŁNIAĆ STANDARDY, винительный. Высокого класса — O WYSOKIM STANDARDZIE, O с местным. Ниже стандарта — PONIŻEJ STANDARDU." }
  - { kind: pronunciation, text: "Читается «ста́ндарт», ударение на первом слоге. Конечное D оглушается в «т». STANDARDZIE — «станда́рдзе»." }
collocations:
  - { pl: "wysoki standard", ru: "высокий уровень, высокий класс" }
  - { pl: "standard życia", ru: "уровень жизни" }
  - { pl: "spełniać standardy", ru: "соответствовать стандартам" }
family:
  - { pl: "standardowy", ru: "стандартный", relation: derived }
  - { pl: "norma", ru: "норма", relation: root, id: norma }
  - { pl: "poziom", ru: "уровень", relation: root, id: poziom }
etymology: "Из английского STANDARD «знамя, образец», от старофранцузского ESTANDART «знамя». Знамя — то, на что равняются."
memory: "Standard — стандарт и класс: wysoki standard — высокий класс. Standard życia — уровень жизни. Читается «ста́ндарт»."
idioms:
  - { pl: "podwójne standardy", ru: "двойные стандарты" }
