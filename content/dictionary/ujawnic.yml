# review
id: ujawnic
format: 2
lemma: "ujawnić"
rank: 2407
pos: verb
pron: { cyr: "уя́вніць" }
senses:
  - id: reveal
    ru: "раскрыть, выдать (тайну, имя)"
    examples:
      - pl: "Ujawnił nazwiska wszystkich uczestników."
        ru: "Он раскрыл имена всех участников."
        source: { kind: authored }
      - pl: "Nie ujawnię źródła informacji."
        ru: "Я не раскрою источник информации."
        source: { kind: authored }
  - id: disclose
    ru: "обнародовать, предать гласности"
    examples:
      - pl: "Dane ujawniono w piątek."
        ru: "Данные обнародовали в пятницу."
        source: { kind: authored }
      - pl: "Ujawnienie raportu wywołało burzę."
        ru: "Публикация отчёта вызвала бурю."
        source: { kind: authored }
  - id: come-to-light
    ru: "обнаружиться, проявиться"
    examples:
      - pl: "Błąd ujawnił się dopiero po latach."
        ru: "Ошибка обнаружилась только спустя годы."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ОДИН ПОЛЬСКИЙ ГЛАГОЛ НА ТРИ РУССКИХ. Ujawnić значит и «раскрыть» (ujawnić tajemnicę), и «выявить» (ujawnić błąd), и «обнародовать» (ujawnić dane). Русский разводит эти случаи тремя словами, так что переводить надо по дополнению. Корень общий: JAWNY — «явный», и оборот WYJŚĆ NA JAW отвечает русскому «выйти наружу»." }
  - { kind: usage, text: "Возвратное UJAWNIĆ SIĘ значит «обнаружиться, проявиться», о дефекте или болезни: wada ujawniła się po roku. Существительное UJAWNIENIE — «раскрытие, обнародование»: ujawnienie danych. А наречие JAWNIE значит «открыто, в открытую», в противоположность skrycie." }
  - { kind: usage, text: "Вид совершенный: есть UJAWNIWSZY, форм на -ąc и -ący нет, несовершенная пара — UJAWNIAĆ. Повелительное — UJAWNIJ, с -ij, как у всех глаголов на -nić: ujawnij, ujawnijcie, ujawnijmy." }
collocations:
  - { pl: "ujawnić tajemnicę", ru: "раскрыть тайну" }
  - { pl: "wyjść na jaw", ru: "выйти наружу" }
  - { pl: "ujawnienie danych", ru: "раскрытие данных" }
family:
  - { pl: "ujawniać", ru: "раскрывать (несов.)", relation: aspect }
  - { pl: "jawny", ru: "явный, открытый", relation: root }
  - { pl: "ukryć", ru: "скрыть", relation: antonym, id: ukryc }
etymology: "Приставка u- и jawny «явный», из праславянского *javъ — того же корня, что русские «явный», «явь», «наяву» и «выявить». Русский предпочёл для этого действия приставку вы-, польский — u-, поэтому слова и расходятся на слух при общем корне."
memory: "ujawnić — «раскрыть, выявить, обнародовать»: три русских слова на один польский глагол. Корень jawny — это «явный», а wyjść na jaw значит «выйти наружу». Повелительное на -ij: ujawnij."
idioms:
  - { pl: "wyjść na jaw", ru: "обнаружиться, выйти наружу" }
  - { pl: "ujawnić karty", ru: "раскрыть карты" }
