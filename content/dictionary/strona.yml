# review
id: strona
format: 2
lemma: "strona"
rank: 230
pos: noun
pron: { cyr: "стро́на" }
senses:
  - id: page
    ru: "страница"
    examples:
      - pl: "Przewróć stronę."
        ru: "Переверни страницу."
        source: { kind: tatoeba, id: 6328153 }
      - pl: "Przewróćcie stronę."
        ru: "Переверните страницу."
        source: { kind: tatoeba, id: 6328154 }
      - pl: "Ta książka ma dużo stron."
        ru: "В этой книге много страниц."
        source: { kind: tatoeba, id: 3460747 }
  - id: side
    ru: "сторона"
    examples:
      - pl: "Po czyjej jesteś stronie?"
        ru: "На чьей ты стороне?"
        source: { kind: tatoeba, id: 3749802 }
      - pl: "Jak miło z twojej strony!"
        ru: "Как мило с твоей стороны!"
        source: { kind: tatoeba, id: 3605034 }
      - pl: "Nie jestem po ich stronie."
        ru: "Я не на их стороне."
        source: { kind: tatoeba, id: 13627136 }
notes:
  - { kind: false-friend, text: "strona — это «страница» и «сторона», но не «страна». Страна по-польски kraj или państwo." }
  - { kind: usage, text: "z jednej strony… z drugiej strony — «с одной стороны… с другой стороны»." }
  - { kind: usage, text: "strona internetowa значит «сайт»; strona główna — «главная страница»." }
collocations:
  - { pl: "strona internetowa", ru: "сайт" }
  - { pl: "mocna strona", ru: "сильная сторона" }
  - { pl: "z drugiej strony", ru: "с другой стороны" }
  - { pl: "po czyjejś stronie", ru: "на чьей-то стороне" }
etymology: "Праславянское *storna; русское «сторона» — с полногласием, а «страна» пришло из старославянского. Польский сохранил одну форму на оба значения."
memory: "strona — «страница» и «сторона», но никогда не «страна»: страна — это kraj. Польский без полногласия: strona ↔ сторона."
idioms:
  - { pl: "z drugiej strony", ru: "с другой стороны" }
  - { pl: "mocna strona", ru: "сильная сторона" }
  - { pl: "wziąć na stronę", ru: "отвести в сторонку" }
