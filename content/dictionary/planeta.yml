  - id: other
    ru: "z innej planety — с другой планеты"
    examples:
      - pl: "Jestem z innej planety."
        ru: "Я с другой планеты."
        source: { kind: tatoeba, id: 5397512 }
      - pl: "Zawsze chciałem odwiedzić inną planetę."
        ru: "Я всегда хотел побывать на другой планете."
        source: { kind: tatoeba, id: 13785269 }
      - pl: "Czy na innych planetach są oceany?"
        ru: "На других планетах есть океаны?"
        source: { kind: tatoeba, id: 6696212 }
notes:
  - { kind: usage, text: "Предложный падеж — na planecie «на планете»: Żyjemy na planecie Ziemia. Русский тоже требует предлога na." }
  - { kind: usage, text: "После być планета стоит в творительном: Mars jest planetą «Марс — планета», Pluton nie jest planetą." }
  - { kind: usage, text: "Родительный множественного — planet без окончания: dziewięć planet «девять планет»." }
  - { kind: pronunciation, text: "Польское l мягче русского «л»: получается «пляне́та», а не «плане́та»." }
collocations:
  - { pl: "nasza planeta", ru: "наша планета" }
  - { pl: "z innej planety", ru: "с другой планеты" }
  - { pl: "na planecie", ru: "на планете" }
  - { pl: "Czerwona Planeta", ru: "Красная планета" }
family:
  - { pl: "planetarny", ru: "планетарный", relation: derived }
  - { pl: "planetarium", ru: "планетарий", relation: derived }
etymology: "Из латинского planeta, а то из греческого πλανάω «блуждаю»: планеты — «блуждающие светила», в отличие от неподвижных звёзд. Русское «планета» — то же заимствование."
memory: "planeta — «планета», слово международное и ловушек не содержит. Запомните управление: na planecie «на планете», а после być — творительный: Mars jest planetą. И помните про мягкое l: «пляне́та»."
idioms:
  - { pl: "nasza planeta", ru: "наша планета" }
  - { pl: "z innej planety", ru: "с другой планеты" }
  - { pl: "Czerwona Planeta", ru: "Красная планета" }
formExamplesSkip:
