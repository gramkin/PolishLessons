    ru: "nasza planeta — наша планета, Земля"
    examples:
      - pl: "Planeta jest kolebką rozumu, ale nie można wiecznie żyć w kolebce."
        ru: "Планета есть колыбель разума, но нельзя вечно жить в колыбели."
        source: { kind: tatoeba, id: 10796218 }
      - pl: "Musimy dbać o naszą planetę, Ziemię."
