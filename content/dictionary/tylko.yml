etymology: "Из праславянского *tolь с суффиксом -ko; то же образование, что русское «только»."
memory: "Полное соответствие русскому «только», включая tylko co «только что» и jak tylko «как только». В разговорной речи часто заменяется на jedynie в письменном стиле."
