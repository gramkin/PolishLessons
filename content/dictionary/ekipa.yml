# review
id: ekipa
format: 2
lemma: "ekipa"
rank: 1590
pos: noun
pron: { cyr: "эки́па" }
senses:
  - id: team
    ru: "бригада, группа, команда"
    examples:
      - pl: "Ekipa poszukiwawcza była kierowana przez Toma."
        ru: "Поисковой группой руководил Том."
        source: { kind: translated, id: 4884253 }
      - pl: "Goście byli obsługiwani przez ekipę dobrze wyszkolonych młodych ludzi."
        ru: "Гостей обслуживала команда хорошо обученных молодых людей."
        source: { kind: translated, id: 504769 }
      - pl: "Śpiewali aż do przybycia ekipy ratunkowej."
        ru: "Они пели до прибытия спасательной группы."
        source: { kind: translated, id: 368112 }
  - id: crew
    ru: "разговорное: компания, свои"
    examples:
      - pl: "To zgrana ekipa."
        ru: "Это сплочённая команда."
        source: { kind: authored }
      - pl: "Idziemy całą ekipą."
        ru: "Мы идём всей компанией."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Люди с общей задачей: ekipa ratunkowa «спасательная группа», ekipa remontowa «ремонтная бригада», ekipa filmowa «съёмочная группа»." }
  - { kind: register, text: "Разговорно — просто «наши, компания»: Idziemy całą ekipą." }
  - { kind: false-friend, text: "ekipa — это не «экипаж». Экипаж самолёта или судна по-польски załoga." }
  - { kind: usage, text: "Рядом стоят drużyna «спортивная команда» и zespół «коллектив, ансамбль», обе уже есть карточками." }
collocations:
  - { pl: "ekipa ratunkowa", ru: "спасательная группа" }
  - { pl: "ekipa filmowa", ru: "съёмочная группа" }
  - { pl: "cała ekipa", ru: "вся компания" }
etymology: "Из французского équipe «команда». Русский «экипаж» идёт от родственного équipage, но значения разошлись, и польское ekipa — это именно люди, а не транспорт."
memory: "ekipa — «бригада, группа, команда»: ekipa ratunkowa, ekipa filmowa. Разговорно — «наши, компания». А «экипаж» самолёта это załoga, не ekipa."
idioms:
  - { pl: "ekipa ratunkowa", ru: "спасательная группа" }
  - { pl: "ekipa filmowa", ru: "съёмочная группа" }
  - { pl: "cała ekipa", ru: "вся компания" }
formExamplesSkip:
