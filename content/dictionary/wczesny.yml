notes:
  - { kind: false-friend, text: "НА «ВЧЕРА» СЛОВО ПОХОЖЕ, НО РОДСТВА НЕТ. Wczoraj «вчера» восходит к wieczór «вечер», а wczesny — к czas «время»: ранний значит «вовремя, загодя». Два разных корня, случайно сблизившихся в звучании. Отсюда же wczasy — «отпуск, каникулы», слово, которого русский не ждёт." }
  - { kind: pronunciation, text: "Два слога, ударение на первом: WCZES-ny. Начальное w перед głuchym cz оглушается: «фчэ́сны». В сравнительной степени и в мужско-личном множественном s смягчается в ś: wcześniejszy «фчэшне́йшы», wcześni «фчэ́шни»." }
  - { kind: usage, text: "Наречие wcześnie «рано», сравнительная wcześniej «раньше, прежде», превосходная najwcześniej «самое раннее». Пара с późno полная: wcześniej czy później «рано или поздно». Отглагольное wyprzedzić «опередить», существительное wcześniak «недоношенный ребёнок»." }
  - { kind: register, text: "Нейтрально, парадигма полная в тридцать три формы, как у późny и odważny. Сравнительная степень wcześniejszy часто значит не «более ранний», а «ПРЕЖНИЙ, предыдущий»: wcześniejsza umowa «прежний договор», и это значение встречается чаще буквального." }
collocations:
  - { pl: "wczesna wiosna", ru: "ранняя весна" }
  - { pl: "wcześniej czy później", ru: "рано или поздно" }
  - { pl: "najwcześniej o szóstej", ru: "самое раннее в шесть" }
family:
  - { pl: "wcześnie", ru: "рано", relation: derived, id: wczesnie }
  - { pl: "czas", ru: "время", relation: root, id: czas }
  - { pl: "wczasy", ru: "отпуск, каникулы", relation: derived }
  - { pl: "późny", ru: "поздний", relation: antonym, id: pozny }
etymology: "От оборота w czas «вовремя, загодя», от czas «время» — того же слова, что русский «час», только польское czas сохранило широкий смысл «время», а русское сузилось до часа. Ранний буквально значит «успевший ко времени». Отсюда wcześnie, wczasy «отпуск», wczesnośredniowieczny и przedwczesny «преждевременный»."
memory: "wczesny — «ранний», и корень тут czas «ВРЕМЯ»: ранний значит «вовремя, загодя». С wczoraj «вчера» слово не связано: то от wieczór. А wcześniej значит и «раньше», и «прежде», в пару к później."
idioms:
  - { pl: "wcześniej czy później", ru: "рано или поздно" }
  - { pl: "kto rano wstaje, temu Pan Bóg daje", ru: "кто рано встаёт, тому Бог подаёт" }
