notes:
  - { kind: false-friend, text: "Русское «побочный» отвечает польскому точно и собрано из тех же частей: оба от названия бока, BOK и «бок». Расходятся только приставки: поляк взял U-, русский «по-». Запомните заодно существительное UBOCZE и оборот NA UBOCZU «в стороне, на отшибе» — одним словом по-русски не скажешь. И не путайте UBOCZNY с OBOCZNY: второе слово языковедческое и значит «вариантный»." }
  - { kind: usage, text: "В таблице одиннадцать форм, но живых десять. Одиннадцатая — UBOCZNI, именительный множественного для мужчин-людей, и её не употребляют: прилагательное относительное, оно описывает следствие или предмет, а не человека. Примеров к этой форме в карточке поэтому нет. В закреплённых сочетаниях прилагательное стоит после существительного: SKUTEK UBOCZNY, DZIAŁANIE UBOCZNE, PRODUKT UBOCZNY." }
  - { kind: government, text: "Порядок слов в главном сочетании закреплён: SKUTEK UBOCZNY, и переставить нельзя. В побочном действии — W DZIAŁANIU UBOCZNYM, местный падеж. Без побочного эффекта — BEZ SKUTKU UBOCZNEGO, предлог BEZ с родительным. А родственное NA UBOCZU требует местного падежа: MIESZKA NA UBOCZU значит «живёт на отшибе», и это сочетание стоит выучить целиком." }
  - { kind: pronunciation, text: "Читается «убо́чны», три слога, ударение на предпоследнем. Сочетание CZ даёт «ч», поэтому середина слова это «боч». Конечная Y даёт «ы», и слово кончается на «ны», а не на «ный». В женском роде UBOCZNA это «убо́чна», в среднем UBOCZNE — «убо́чнэ», а UBOCZNĄ звучит «убо́чнон», с носовым на конце." }
  - { kind: register, text: "Чаще всего слово встречается в медицине и в аптеке: DZIAŁANIA UBOCZNE напечатаны на каждой инструкции к лекарству, и это первое, что ищут в ней поляки. В производстве говорят PRODUKT UBOCZNY, в разговоре о книге или фильме — WĄTEK UBOCZNY «побочная линия». Во всех случаях слово нейтральное и книжным не выглядит." }
