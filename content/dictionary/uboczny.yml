etymology: "От приставки U- и BOK «бок», слова праславянского и того же, что русский «бок». Образ прямой: то, что идёт сбоку, а не по главной линии. Русское «побочный» собрано точно так же, только с приставкой «по-», поэтому слова узнают друг друга сразу. Из того же гнезда — POBOCZE «обочина», буквально «то, что по боку», и UBOCZE, глухое место в стороне от дороги."
memory: "Побочный, и собрано как русское слово: от bok «бок», только с приставкой u- вместо «по-». Главное сочетание — skutek uboczny «побочный эффект», и на каждой польской инструкции к лекарству стоит dzialania uboczne. Читается «убо́чны». Стоит прихватить и родню: pobocze это «обочина», а na uboczu — «в стороне, на отшибе», одним русским словом не передать."
idioms:
