# review
id: teren
format: 2
lemma: "teren"
rank: 1082
pos: noun
pron: { cyr: "тэ́рэн" }
senses:
  - id: area
    ru: "местность, территория, участок"
    examples:
      - pl: "Policja otoczyła teren."
        ru: "Полиция оцепила территорию."
        source: { kind: translated, id: 8627673 }
      - pl: "Na tym terenie rzadko pada śnieg."
        ru: "В этой местности редко идёт снег."
        source: { kind: translated, id: 3127310 }
      - pl: "Wszyscy żołnierze mieli mapę tego terenu."
        ru: "У всех солдат была карта этой местности."
        source: { kind: translated, id: 744232 }
  - id: premises
    ru: "na terenie — на территории (учреждения)"
    examples:
      - pl: "Na terenie szkoły nie wolno palić."
        ru: "На территории школы нельзя курить."
        source: { kind: translated, id: 691927 }
      - pl: "Na terenie fabryki jest stołówka."
        ru: "На территории завода есть столовая."
        source: { kind: authored }
  - id: field
    ru: "w terenie — на местности, в полевых условиях; сфера деятельности"
    examples:
      - pl: "Jakie masz doświadczenie w terenie?"
        ru: "Какой у тебя опыт работы на местности?"
        source: { kind: translated, id: 8617857 }
      - pl: "To nie jest mój teren."
        ru: "Это не моя сфера."
        source: { kind: authored }
notes:
  - { kind: government, text: "na terenie czegoś «на территории чего-то» — предлог na с предложным падежом: na terenie szkoły, na terenie lotniska." }
  - { kind: usage, text: "w terenie значит «на местности, в полевых условиях» — о работе вне офиса: praca w terenie «работа в полях»." }
  - { kind: usage, text: "Множественное tereny обычно значит «земли, угодья, участки»: tereny zielone «зелёные зоны», tereny budowlane «участки под застройку»." }
  - { kind: false-friend, text: "teren — это «местность, территория», а не «район города». Район города — dzielnica." }
collocations:
  - { pl: "na terenie", ru: "на территории" }
  - { pl: "w terenie", ru: "на местности" }
  - { pl: "tereny zielone", ru: "зелёные зоны" }
family:
  - { pl: "terenowy", ru: "полевой; внедорожный", relation: derived }
etymology: "Через французское terrain из латинского terra «земля» — тот же корень, что в русских «терраса» и «территория»."
memory: "teren — «местность, территория». Держите в голове два оборота: na terenie czegoś «на территории чего-то» (na terenie szkoły) и w terenie «на местности, в полевых условиях». Множественное tereny — «земли, участки», а район города это dzielnica."
idioms:
  - { pl: "na własnym terenie", ru: "на своей территории" }
  - { pl: "w terenie", ru: "на местности" }
