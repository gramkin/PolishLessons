notes:
  - { kind: false-friend, text: "ГЛАВНАЯ ловушка: zakaz — это ЗАПРЕТ, а не заказ. Заказ по-польски zamówienie. Корень kazać «велеть» с приставкой za-." }
  - { kind: government, text: "Мужской неодушевлённый; родительный — zakazu. Запрет на что-л. — zakaz czegoś, с родительным: zakaz palenia «запрет курения»." }
  - { kind: usage, text: "На табличках слово стоит первым: Zakaz palenia, Zakaz wstępu, Zakaz parkowania — это готовые надписи, которые видишь на улице." }
  - { kind: usage, text: "Глагол zakazać «запретить»; прилагательное zakazany «запрещённый»." }
collocations:
  - { pl: "zakaz palenia", ru: "курение запрещено" }
  - { pl: "zakaz wstępu", ru: "вход воспрещён" }
etymology: "za- + kazać «велеть»; русский «заказ» — то же слово, но значение разошлось."
