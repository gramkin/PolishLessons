notes:
  - { kind: false-friend, text: "Ловушки нет совсем — наоборот, подарок. Kraść это русское «красть», и совпадает даже основа настоящего времени: kradnę, kradniesz, kradnie против «краду, крадёшь, крадёт». Оба языка вставляют в настоящем одно и то же -dn- / -д-, которого нет в инфинитиве. Как и в паре piec — «печь», правило можно не учить, а узнать." }
  - { kind: usage, text: "Корень принимает ЧЕТЫРЕ облика в одной парадигме, и это главная трудность: kraść в инфинитиве, kradn- в настоящем и повелительном (kradnę, kradnij), kradł- в прошедшем (kradł, kradli), kradzi- в страдательном и безличном (kradziony, kradziono). Отдельно заметьте: обычное существительное для «кражи» — kradzież, а kradzenie обозначает само занятие." }
  - { kind: government, text: "Крадут ЧТО — винительный: kraść rower. А У КОГО — ДАТЕЛЬНЫЙ без предлога: kradł MI pieniądze, kradną NAM prąd. Русский здесь берёт предлог «у» с родительным («крал у меня деньги»), так что конструкцию надо перестроить: по-польски обворованный стоит в дательном." }
  - { kind: register, text: "Слово нейтральное, прямое. Совершенная пара — ukraść. Мужско-личная форма страдательного причастия kradzeni существует потому, что дополнением бывает и человек: о похищениях и работорговле пишут kradzione dzieci, kradzeni ludzie." }
collocations:
  - { pl: "kraść prąd", ru: "воровать электричество" }
  - { pl: "kradziony rower", ru: "краденый велосипед" }
  - { pl: "kradzione nie tuczy", ru: "краденое не впрок" }
family:
  - { pl: "ukraść", ru: "украсть", relation: aspect, id: ukrasc }
  - { pl: "kradzież", ru: "кража", relation: derived, id: kradziez }
  - { pl: "złodziej", ru: "вор", relation: derived, id: zlodziej }
etymology: "Праславянское *krasti — то же слово, что русское «красть», с тем же чередованием в настоящем времени: *kradnǫ дало польское kradnę и русское «краду». Из того же гнезда kradzież «кража», ukradkiem «украдкой» и русские «кража», «украдкой». Совпадение полное, вплоть до приставочных производных."
memory: "kraść — «красть», и настоящее время тоже совпадает: kradnę как «краду». Учить надо не значение, а четыре облика корня: kraść, kradnę, kradł, kradziony. И падеж: крадут MI, в дательном, а не «у меня»."
idioms:
  - { pl: "kradzione nie tuczy", ru: "краденое не впрок" }
  - { pl: "kraść na potęgę", ru: "красть напропалую" }
