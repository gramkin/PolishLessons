etymology: "От SZYK «строй, порядок», из немецкого Schick «порядок, вид», пришедшего в польский через ремесленную и военную речь. Исходно SZYKOWAĆ значило «выстраивать, приводить в порядок», откуда нынешнее «готовить, собирать». Русское «шиковать» идёт из того же немецкого гнезда, но через французское chic и значит совсем другое — «жить на широкую ногу». Из польского гнезда вышли SZYKOWNY «элегантный», SZYK WYRAZÓW «порядок слов», SZYK BOJOWY «боевой строй»."
memory: "Не «шиковать», а «готовить, собирать»: szykuj się — «собирайся». Корень тот же, что в szyk wyrazów — «порядок слов»."
idioms:
  - { pl: "szykuj się", ru: "собирайся, готовься" }
  - { pl: "szyk wyrazów", ru: "порядок слов" }
