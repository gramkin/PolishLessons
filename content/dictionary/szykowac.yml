notes:
  - { kind: false-friend, text: "Русское «шиковать» сюда не годится совсем, а похожесть обманчива. SZYKOWAĆ значит «готовить, собирать», а SZYKOWAĆ SIĘ — «готовиться, собираться». Русское же «шиковать» означает «жить на широкую ногу, сорить деньгами», и к польскому глаголу отношения не имеет. Корень у SZYKOWAĆ другой: это SZYK «строй, порядок», из немецкого Schick, и глагол значит буквально «приводить в порядок». Отсюда и SZYKOWNY — «элегантный, со вкусом», где русское сходство со «шиком» уже не случайно." }
  - { kind: usage, text: "Существительное SZYK стоит знать отдельно, потому что для изучающего язык оно рабочее: SZYK WYRAZÓW — это «порядок слов». SZYK PRZESTAWNY, SWOBODNY SZYK — всё это о строении фразы. Второе значение военное: SZYK BOJOWY — «боевой строй», и отсюда идёт сам глагол, когда-то «строить, выстраивать». Так что SZYKOWAĆ и SZYK WYRAZÓW — одно гнездо, хотя связь на первый взгляд не видна." }
  - { kind: usage, text: "В живой речи глагол почти всегда стоит с SIĘ и значит «собираться»: SZYKUJ SIĘ, WYCHODZIMY — «собирайся, выходим». Без SIĘ он переходный и значит «готовить» что-то для кого-то: SZYKOWAĆ OBIAD, SZYKOWAĆ POKOJE, SZYKOWAĆ DZIECI DO SZKOŁY. Рядом стоит PRZYGOTOWAĆ, которое звучит чуть официальнее, а SZYKOWAĆ — по-домашнему. Шестьдесят три формы: несовершенный переходный, полный набор." }
  - { kind: government, text: "Для цели — предлог DO с родительным или NA с винительным: SZYKOWAĆ SIĘ DO WYJAZDU, DO EGZAMINU, но SZYKOWAĆ POKOJE NA PRZYJAZD GOŚCI. Русский берёт здесь «к» с дательным — «готовиться к поездке», — так что меняются и предлог, и падеж. Для кого готовят — предлог DLA с родительным: SZYKUJĘ OBIAD DLA RODZINY. Глагол из класса на -OWAĆ: в настоящем -owa- сменяется на -uj-, то есть SZYKUJĘ, SZYKUJE, SZYKUJĄ, повелительное SZYKUJ." }
collocations:
