id: wypas
format: 2
lemma: "wypas"
rank: 6019
pos: noun
pron: { cyr: "вы́пас" }
senses:
  - id: grazing
    ru: "выпас (скота)"
    examples:
      - pl: "Wypas owiec to tradycja górali."
        ru: "Выпас овец — традиция горцев."
        source: { kind: authored }
      - pl: "Krowy wróciły z wypasu wieczorem."
        ru: "Коровы вернулись с выпаса вечером."
        source: { kind: authored }
  - id: luxury
    ru: "шик, что-то крутое и дорогое (сленг)"
    examples:
      - pl: "Ale wypas, masz nowy samochód!"
        ru: "Вот это шик, у тебя новая машина!"
        source: { kind: authored }
      - pl: "Hotel był na wypasie."
        ru: "Отель был шикарный."
        source: { kind: authored }
      - pl: "Kupił komputer, full wypas."
        ru: "Он купил компьютер — полный фарш."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Первое значение совпадает с русским «выпас». Но в сленге WYPAS — «шик, крутизна»: ALE WYPAS! «вот это круто!». Русскому уху это неожиданно." }
  - { kind: usage, text: "Сленговое значение живёт в двух оборотах: NA WYPASIE «шикарный, по высшему разряду» (MIESZKANIE NA WYPASIE) и FULL WYPAS «полный фарш, всё включено». Прилагательные: WYPASIONY, WYPAŚNY «навороченный»." }
  - { kind: pronunciation, text: "Читается «вы́пас»: Y — «ы». Ударение на первом слоге." }
collocations:
  - { pl: "wypas owiec", ru: "выпас овец" }
  - { pl: "na wypasie", ru: "шикарный, по высшему разряду" }
  - { pl: "full wypas", ru: "полный фарш" }
  - { pl: "zakaz wypasu", ru: "запрет на выпас" }
family:
