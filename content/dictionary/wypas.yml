  - { pl: "wypasiony", ru: "навороченный, крутой", relation: derived }
  - { pl: "wypaśny", ru: "шикарный", relation: derived }
  - { pl: "pasterz", ru: "пастух", relation: root }
etymology: "От глагола WYPASAĆ «выпасать». Сленговое «шик» связано с WYPASIONY, WYPAŚNY — буквально «откормленный», в сленге «навороченный»."
memory: "Wypas — выпас, как в русском. Но в сленге full wypas — «полный фарш»: всё по максимуму, как у откормленной коровы."
idioms:
