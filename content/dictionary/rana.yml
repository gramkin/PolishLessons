# review
id: rana
format: 2
lemma: "rana"
rank: 538
pos: noun
pron: { cyr: "ра́на" }
senses:
  - id: wound
    ru: "рана"
    note: "opatrzyć ranę «перевязать рану»; umrzeć z powodu ran «умереть от ран»."
    examples:
      - pl: "Rana się zagoiła."
        ru: "Рана зажила."
        source: { kind: translated, id: 10599112 }
      - pl: "Rana zaczęła krwawić."
        ru: "Рана начала кровоточить."
        source: { kind: translated, id: 10599132 }
      - pl: "Obwiązała ranę bandażem."
        ru: "Она перевязала рану бинтом."
        source: { kind: translated, id: 350115 }
  - id: wound-fig
    ru: "рана (переносно, о душевной боли)"
    note: "rozdrapywać stare rany «бередить старые раны»."
    examples:
      - pl: "Czas leczy rany."
        ru: "Время всё лечит."
        source: { kind: tatoeba, id: 349383 }
      - pl: "Rozdrapywać stare rany."
        ru: "Бередить старые раны."
        source: { kind: translated, id: 6590989 }
      - pl: "Jego rany krwawiły."
        ru: "Его раны кровоточили."
        source: { kind: translated, id: 765688 }
notes:
  - { kind: false-friend, text: "Не путайте rana «рана» с rano «утро; утром». Обороты od rana и z rana значат «с утра» и к ране отношения не имеют — это формы другого слова." }
  - { kind: usage, text: "Восклицание O rany! и Rany boskie! значит «О боже!» — застывшая формула, а не слово «раны» в прямом смысле." }
  - { kind: government, text: "«Умереть от ран» — umrzeć z powodu ran, с предлогом z powodu и родительным; «перевязать рану» — opatrzyć ranę, винительный." }
  - { kind: usage, text: "Однокоренные: ranić «ранить», ranny «раненый», zranić «поранить»." }
collocations:
  - { pl: "opatrzyć ranę", ru: "перевязать рану" }
  - { pl: "głęboka rana", ru: "глубокая рана" }
  - { pl: "rana się goi", ru: "рана заживает" }
  - { pl: "rozdrapywać stare rany", ru: "бередить старые раны" }
family:
  - { pl: "ranić", ru: "ранить", relation: derived }
  - { pl: "ranny", ru: "раненый", relation: derived }
  - { pl: "zranić", ru: "поранить", relation: derived }
etymology: "От праславянского *rana — то же слово, что русское «рана»."
memory: "rana — «рана», и слово то же, что русское. Но рядом стоит ловушка: rano — это «утро» и «утром», а обороты od rana и z rana значат «с утра», а вовсе не «от раны». И восклицание O rany! или Rany boskie! — это «О боже!», застывшая формула. Глагол — ranić «ранить», раненый — ranny."
idioms:
  - { pl: "rozdrapywać stare rany", ru: "бередить старые раны" }
  - { pl: "Czas leczy rany", ru: "Время лечит раны" }
  - { pl: "O rany!", ru: "О боже!" }
formExamplesSkip:
  - { form: "rano", reason: "это форма слова rano «утро», а не существительного rana: все примеры в корпусе — обороты od rana и z rana «с утра»" }
