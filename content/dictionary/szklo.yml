notes:
  - { kind: pronunciation, text: "Читается «шкуо», и это одно из самых непривычных слов для русского уха. Сочетание SZK даёт «шк», а Ł — «у», поэтому получается «шкуо», без всякого «л» и без гласной между Ш и К. Слово двусложное: ШКУ-О, с ударением на первом слоге. В местном падеже SZKLE буква Ł переходит в мягкое L и звучит «шкле» — то же чередование, что в REGUŁA и REGULE, SZKOŁA и SZKOLE. В родительном множественного SZKIEŁ появляется вставное IE: «шкеу»." }
  - { kind: false-friend, text: "Со смыслом всё совпадает, а вот со формой — нет, и начальные согласные стоит рассмотреть отдельно. Русское «стекло» начинается на СТ-, польское SZKŁO — на ШК-. Это не искажение, а закономерный результат: праславянское *stьklo потеряло в польском гласную между С и Т, после чего СТ упростилось в Ш-К. Поэтому похожести на слух почти нет, и слово нужно заучивать как новое, хотя по происхождению оно то же самое. Отдельно запомните, что оконное стекло — SZYBA, а не SZKŁO: SZKŁO — это материал и изделия из него, а SZYBA — конкретное вставленное стекло." }
  - { kind: usage, text: "Разделение между SZKŁO и SZYBA — главное практическое следствие карточки. SZKŁO значит материал: ZE SZKŁA «из стекла», HUTA SZKŁA «стекольный завод», SZKŁO POWIĘKSZAJĄCE «увеличительное стекло». SZYBA — это стекло в окне, в двери, в машине: WYBITA SZYBA «разбитое стекло». Множественное число SZKŁA часто значит «очки» в разговорной речи, а также осколки: POTŁUCZONE SZKŁA «битые стёкла». Прилагательное — SZKLANY «стеклянный», и от него SZKLANKA «стакан», буквально «стеклянка»." }
  - { kind: government, text: "Средний род на -O, склонение правильное. Материал вводится предлогом Z с родительным: ZE SZKŁA «из стекла», и предлог здесь приобретает лишнюю гласную, ZE вместо Z, потому что следом идёт группа согласных — правило чисто фонетическое, как в ZE SZKOŁY. Именительный, винительный и звательный единственного совпадают в SZKŁO, а родительный единственного и именительный множественного — в SZKŁA, поэтому в таблице девять форм, та же картина, что у KINO в этой же партии." }
