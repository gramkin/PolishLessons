etymology: "Из праславянского *stьklo, а то — заимствование из готского STIKLS «кубок, чаша». То есть слово пришло к славянам вместе с самой вещью, от германских соседей, и дало русское «стекло», польское SZKŁO, чешское SKLO. Расхождение в начале слова объясняется выпадением сверхкраткого ь: русский развернул его в полную гласную и получил «стекло», а польский гласную потерял, оставив СТ-К, которое затем упростилось до SZK-. Поэтому родство слышно плохо, а на письме видно: та же согласная К, та же Л, тот же порядок. Готское STIKLS, в свою очередь, связано со значением «колоть, втыкать» — кубок на острой ножке, — и тот же корень стоит за немецким STECHEN."
memory: "То же слово, что «стекло», но польский потерял гласную: *stьklo дало szkło, читается «шкуо», без «л» и без гласной между ш и к. Оконное стекло — szyba, а szkło — материал и изделия. В местном ł переходит в мягкое l: w szkle, как w regule. Из готского stikls «кубок»."
