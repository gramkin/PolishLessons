# review
id: jezyk
format: 2
lemma: "język"
rank: 1085
pos: noun
pron: { cyr: "е́нзык" }
senses:
  - id: organ
    ru: "язык (орган во рту)"
    examples:
      - pl: "Trzymaj język za zębami."
        ru: "Держи язык за зубами."
        source: { kind: translated, id: 406210 }
      - pl: "Pokazał nauczycielowi język."
        ru: "Он показал учителю язык."
        source: { kind: tatoeba, id: 3704157 }
      - pl: "Pokazał język swojemu nauczycielowi."
        ru: "Он показал язык своему учителю."
        source: { kind: translated, id: 775919 }
  - id: speech
    ru: "язык (речь, система общения)"
    examples:
      - pl: "Nasz język ojczysty to japoński."
        ru: "Наш родной язык - японский."
        source: { kind: tatoeba, id: 12564185 }
      - pl: "Gramatyka języka polskiego jest trudna."
        ru: "Грамматика польского языка сложная."
        source: { kind: tatoeba, id: 11150467 }
      - pl: "Angielski jest językiem globalnym."
        ru: "Английский — всемирный язык."
        source: { kind: tatoeba, id: 3656702 }
  - id: command
    ru: "владение языком: mówić w jakimś języku"
    examples:
      - pl: "On potrafi mówić w pięciu językach."
        ru: "Он может говорить на пяти языках."
        source: { kind: tatoeba, id: 3697780 }
      - pl: "Ten tłumacz włada pięcioma językami."
        ru: "Этот переводчик владеет пятью языками."
        source: { kind: tatoeba, id: 948005 }
notes:
  - { kind: government, text: "«Говорить на языке» строится двумя способами: mówić w języku polskim — предлог w с предложным падежом, или mówić polskim językiem — творительный без предлога. Проще всего сказать mówić po polsku." }
  - { kind: usage, text: "Как и в русском, слово значит и орган во рту, и речь: język ojczysty «родной язык», język obcy «иностранный язык»." }
  - { kind: usage, text: "Названия языков — прилагательные: język polski, język rosyjski. Само слово język при этом часто опускают: Uczę się polskiego." }
  - { kind: usage, text: "być na językach значит «быть у всех на устах», а ciągnąć kogoś za język — «тянуть за язык, выпытывать». Обороты совпадают с русскими." }
collocations:
  - { pl: "język polski", ru: "польский язык" }
  - { pl: "język ojczysty", ru: "родной язык" }
  - { pl: "język obcy", ru: "иностранный язык" }
  - { pl: "mówić w języku", ru: "говорить на языке" }
family:
  - { pl: "językowy", ru: "языковой", relation: derived }
  - { pl: "języczek", ru: "язычок", relation: derived }
  - { pl: "językoznawstwo", ru: "языкознание", relation: derived }
etymology: "Праславянское *języky — то же слово, что русский «язык», и с тем же двойным значением: орган во рту и речь. Начальное j- в польском сохранилось, в русском отпало."
memory: "język — «язык» в обоих смыслах сразу, как и в русском. Но «говорить на языке» строится иначе: mówić w języku polskim (предложный) или mówić polskim językiem (творительный). Проще сказать mówić po polsku."
idioms:
  - { pl: "trzymać język za zębami", ru: "держать язык за зубами" }
  - { pl: "być na językach", ru: "быть у всех на устах" }
  - { pl: "ciągnąć za język", ru: "тянуть за язык" }
formExamplesSkip:
  - { form: "językom", reason: "в корпусе нет примеров: дательный падеж множественного числа у этого слова редок" }
  - { form: "językowi", reason: "в корпусе нет примеров: дательный падеж единственного числа у этого слова редок" }
