notes:
  - { kind: false-friend, text: "Слово то же, что русский «гриб», и прямое значение совпадает полностью. Расходится объём: польский GRZYB означает ещё и плесень на стене, ту самую сырость, которую у нас называют отдельным словом. GRZYB NA ŚCIANIE это не выросший в доме боровик, а именно плесень. Третье употребление разговорное и обидное: STARY GRZYB значит «старый гриб», то есть дряхлый человек, и русский говорит так же." }
  - { kind: usage, text: "Одиннадцать форм, мужской род. Любопытна форма GRZYBOWIE, старое множественное число на -OWIE, то же, что в PANOWIE и SYNOWIE: когда-то его употребляли и о грибах, сегодня осталось обычное GRZYBY, а GRZYBOWIE звучит архаично. Винительный единственного GRZYBA совпадает с родительным, потому что грибы в польском трактуются как одушевлённые." }
  - { kind: government, text: "За грибами — предлог NA с винительным множественного: IŚĆ NA GRZYBY, тогда как русский говорит «за грибами», с творительным. Это расхождение частое и заметное: поляк идёт NA GRZYBY, NA ZAKUPY, NA RYBY, всюду NA с винительным. Суп из грибов — ZUPA Z GRZYBÓW, предлог Z с родительным. Расти как грибы после дождя — ROSNĄĆ JAK GRZYBY PO DESZCZU." }
  - { kind: pronunciation, text: "Читается «гжып», один слог, и от написания остаётся мало. Сочетание RZ даёт «ж», поэтому начало звучит «гж», а не «гр». Буква Y даёт «ы». Конечное B оглушается до «п». В местном падеже GRZYBIE оглушения нет, и слышно «гжы́бе», с мягким «бе». Во множественном GRZYBY звучит «гжы́бы»." }
  - { kind: register, text: "Слово нейтральное и для Польши совершенно особое: сбор грибов это национальное занятие, и каждый поляк знает десяток названий. GRZYB JADALNY «съедобный гриб», GRZYB TRUJĄCY «ядовитый», ZBIERAĆ GRZYBY, IŚĆ NA GRZYBY. Оборот ROSNĄĆ JAK GRZYBY PO DESZCZU говорят о новостройках и о фирмах, ровно как по-русски. STARY GRZYB звучит пренебрежительно." }
