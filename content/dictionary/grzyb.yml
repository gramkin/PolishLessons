etymology: "Праславянское слово, то же, что русский «гриб», и значение за тысячу лет почти не сдвинулось. Этимология самого корня спорна: его связывают то с «горбом», по форме шляпки, то с корнем, означавшим нечто скользкое. Польский расширил слово на плесень, потому что и то и другое грибы в биологическом смысле, и язык это почувствовал раньше науки. Русский для плесени взял отдельное слово, от «плеснуть»."
memory: "То же слово, что русский «гриб», но шире: polski grzyb это ещё и плесень на стене. Разговорное stary grzyb совпадает с русским «старым грибом». Управление расходится заметно: идти за грибами по-польски iść na grzyby, предлог na с винительным, как na zakupy и na ryby. Читается «гжып»: rz даёт «ж», конечное b оглушается. Старое множественное grzybowie звучит сегодня архаично."
idioms:
  - { pl: "rosnąć jak grzyby po deszczu", ru: "расти как грибы после дождя" }
