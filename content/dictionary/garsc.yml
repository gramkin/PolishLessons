etymology: "Из праславянского *gъrstь, от того же корня, что русская «горсть» и глагол «горнуть, сгребать». Польский развил начальное сочетание в GAR-, русский в ГОР-, и это регулярное расхождение при слабом гласном в первом слоге. Конечное -ŚĆ здесь не суффикс отвлечённости, как в WOLNOŚĆ или PRYWATNOŚĆ, а часть древней основы: именно поэтому у слова есть полноценный именительный множественного GARŚCIE, которого отвлечённые существительные того же вида не имеют. Выражение WZIĄĆ SIĘ W GARŚĆ построено на образе собирания себя в кулак, и русское «взять себя в руки» выражает ту же мысль через руку, а не через горсть."
memory: "Прямая пара к «горсти», с регулярным расхождением gar- против гор-. Семь форм, а не шесть, как у слов на -ość: лишняя — именительный множественного garście, потому что слово конкретное, а не отвлечённое. Форма garści покрывает родительный, дательный, местный единственного и родительный множественного. Два частых оборота: wziąć się w garść «взять себя в руки» и trzymać w garści «держать в руках»."
