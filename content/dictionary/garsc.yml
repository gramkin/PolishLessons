notes:
  - { kind: false-friend, text: "Прямое соответствие русской «горсти», и даже чередование то же: польское GARŚĆ и русская «горсть» идут от одного праславянского корня, где был носовой; польский дал GAR-, русский ГОР-. Значения совпадают полностью, включая переносное: GARŚĆ LUDZI это «горстка людей». Запомнить стоит два оборота, которых в русском нет в таком виде. TRZYMAĆ KOGOŚ W GARŚCI значит «держать кого-то в руках», то есть иметь над ним власть; а WZIĄĆ SIĘ W GARŚĆ — «взять себя в руки», собраться. Последнее по-русски строится с «руками», а по-польски именно с горстью, и это одно из самых частых польских выражений." }
  - { kind: usage, text: "У этого слова семь форм, и это ровно на одну больше, чем у существительных на -OŚĆ, у которых их шесть. Причина в именительном множественного: GARŚĆ образует отдельную форму GARŚCIE, потому что это конкретное существительное и горстей может быть много, тогда как PRYWATNOŚĆ и ZNAJOMOŚĆ — отвлечённые, и у них именительный множественного совпадает с формой на -I. Остальное устроено так же: форма GARŚCI покрывает родительный, дательный и местный единственного, а также родительный множественного. Запомнив шесть форм на -OŚĆ, достаточно добавить GARŚCIE, и склонение готово." }
  - { kind: government, text: "Женский род. Чего горсть — родительный: GARŚĆ ORZECHÓW, GARŚĆ SOLI, GARŚĆ LUDZI. «В горсти» — предлог W с местным: W GARŚCI. Частотные обороты: TRZYMAĆ W GARŚCI «держать в руках, иметь власть», WZIĄĆ SIĘ W GARŚĆ «взять себя в руки» — здесь винительный, потому что есть движение; PEŁNA GARŚĆ «полная горсть». Счётное употребление: DWIE GARŚCIE MĄKI «две горсти муки». Уменьшительное GARSTKA употребительнее самого слова, когда речь о людях: GARSTKA ZWOLENNIKÓW." }
  - { kind: pronunciation, text: "Читается «гарсьць», один слог, и в нём три согласных на конце: Ś даёт «сь», Ć — «ць», и произносятся они слитно, без гласной между ними. Буква G всегда твёрдая, «г». В родительном GARŚCI слогов два, ударение на первом: «га́рсьци». В именительном множественного GARŚCIE слышно «га́рсьце». Сочетание ŚC перед гласной остаётся мягким в обеих формах, и эта мягкость — главное, что отличает польское слово от русского «горсть», где на конце твёрдое «т» с мягким знаком." }
