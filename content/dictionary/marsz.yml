pos: noun
pron: { cyr: "марш" }
senses:
  - id: march
    ru: "марш, поход, долгая ходьба"
    examples:
      - pl: "Po długim marszu żołnierze odpoczywali."
        ru: "После долгого марша солдаты отдыхали."
        source: { kind: authored }
      - pl: "Codzienny marsz dobrze robi na serce."
        ru: "Ежедневная ходьба полезна для сердца."
        source: { kind: authored }
      - pl: "Ulicami przeszedł marsz protestu."
        ru: "По улицам прошёл марш протеста."
        source: { kind: authored }
  - id: music
    ru: "марш (музыка)"
    examples:
      - pl: "Orkiestra zagrała marsza."
        ru: "Оркестр сыграл марш."
        source: { kind: authored }
      - pl: "Marsz Mendelssohna gra się na ślubach."
        ru: "Марш Мендельсона играют на свадьбах."
        source: { kind: authored }
  - id: command
    ru: "марш! (команда)"
    examples:
      - pl: "Marsz do łóżka!"
        ru: "Марш в кровать!"
        source: { kind: authored }
      - pl: "Marsz do domu, ale już!"
        ru: "Марш домой, живо!"
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "MARSZ — «марш» во всех смыслах: шествие, музыка и команда MARSZ DO DOMU! Родительный различается: о ходьбе — MARSZU (PO MARSZU), о музыке — MARSZA (ZAGRAĆ MARSZA). Спортивная ходьба — CHÓD SPORTOWY." }
  - { kind: usage, text: "Мужской род, неодушевлённое. Две формы родительного: MARSZU — шествие, MARSZA — мелодия, и тогда винительный тоже MARSZA. Множественное — MARSZE, MARSZÓW." }
  - { kind: government, text: "Марш протеста — MARSZ PROTESTU, родительный. Идти маршем — IŚĆ MARSZEM, творительный. Марш в комнату — MARSZ DO POKOJU, DO с родительным." }
  - { kind: pronunciation, text: "Читается «марш», один слог. RZ на конце — глухое «ш»." }
collocations:
  - { pl: "marsz protestu", ru: "марш протеста" }
  - { pl: "marsz żałobny", ru: "похоронный марш" }
  - { pl: "szybki marsz", ru: "быстрая ходьба" }
family:
  - { pl: "maszerować", ru: "маршировать", relation: derived }
  - { pl: "spacer", ru: "прогулка", relation: root, id: spacer }
  - { pl: "demonstracja", ru: "демонстрация", relation: root }
etymology: "Из французского MARCHE, от MARCHER «шагать». Русское «марш» пришло тем же путём."
memory: "Marsz — марш: шествие (marszu), музыка (marsza) и команда «марш!». Marsz do łóżka! — марш в кровать! Читается «марш»."
idioms:
