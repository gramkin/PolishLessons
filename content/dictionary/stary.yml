# review
id: stary
format: 2
lemma: "stary"
rank: 157
pos: adj
pron: { cyr: "ста́ры" }
senses:
  - id: aged
    ru: "старый (о возрасте живого существа)"
    examples:
      - pl: "Jest stary."
        ru: "Он старый."
        source: { kind: tatoeba, id: 364555 }
      - pl: "Tom jest taki stary."
        ru: "Том такой старый."
        source: { kind: tatoeba, id: 6553635 }
      - pl: "Koń stary, ale zdrowy."
        ru: "Конь старый, но здоровый."
        source: { kind: tatoeba, id: 5909117 }
  - id: old
    ru: "старый, давний (не новый)"
    examples:
      - pl: "Te książki są stare."
        ru: "Эти книги старые."
        source: { kind: tatoeba, id: 6154752 }
      - pl: "Ten chleb jest stary."
        ru: "Этот хлеб старый."
        source: { kind: tatoeba, id: 4953530 }
      - pl: "Mieszkamy w starym domu."
        ru: "Мы живём в старом доме."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Сравнительная форма starszy значит и «старше», и «пожилой»: starsi ludzie «пожилые люди», starsza pani «пожилая дама»." }
  - { kind: usage, text: "po staremu — «по-старому, как прежде»: Wszystko po staremu." }
  - { kind: register, text: "В разговорной речи stary! — обращение вроде русского «старик, чувак», а stary может значить «отец»." }
collocations:
  - { pl: "stary dom", ru: "старый дом" }
  - { pl: "starszy brat", ru: "старший брат" }
  - { pl: "po staremu", ru: "по-старому" }
  - { pl: "stare dzieje", ru: "дела давно минувших дней" }
etymology: "Праславянское *starъ — то же слово, что русское «старый»; родственно stać «стоять» (исходно «устоявшийся»)."
memory: "stary — starszy — najstarszy. Но starszy значит и «старше», и «пожилой»: starsza pani «пожилая дама». А разговорное stary! — «старик, чувак»."
idioms:
  - { pl: "stary, ale jary", ru: "стар, да удал" }
  - { pl: "człowiek starej daty", ru: "человек старой закалки" }
  - { pl: "stary kawaler", ru: "старый холостяк" }
