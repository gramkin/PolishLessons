      - pl: "Jest spore prawdopodobieństwo, że podatki zostaną podniesione."
        ru: "Есть немалая вероятность, что налоги поднимут."
        source: { kind: translated, id: 3857490 }
  - id: amount
    ru: "изрядное количество, порядочный кусок"
    examples:
      - pl: "Tom zostawił na stoliku spory napiwek."
        ru: "Том оставил на столике изрядные чаевые."
        source: { kind: translated, id: 3992315 }
      - pl: "Mieliśmy sporą publiczność."
        ru: "У нас была немалая публика."
        source: { kind: translated, id: 357414 }
      - pl: "Moja ciotka odziedziczyła sporą posiadłość."
        ru: "Моя тётя унаследовала немалое поместье."
        source: { kind: translated, id: 363677 }
notes:
  - { kind: false-friend, text: "Русское «спорый» значит «быстрый, успешный» («работа спорится»), а польское spory — «немалый по размеру». Корень общий, значения разошлись." }
  - { kind: false-friend, text: "Форма spory совпадает с множественным числом существительного spór «спор»: gorące spory — это «горячие споры», существительное, а spory problem — «изрядная проблема», прилагательное. Различает только строй фразы." }
  - { kind: usage, text: "Самые частые сочетания — spora szansa «немалый шанс» и spore prawdopodobieństwo «изрядная вероятность»." }
  - { kind: usage, text: "Степеней сравнения слово не образует: вместо них берут większy «больший». Родственное наречие sporo значит «довольно много»: sporo czasu «довольно много времени»." }
collocations:
  - { pl: "spora szansa", ru: "немалый шанс" }
  - { pl: "spory problem", ru: "изрядная проблема" }
  - { pl: "spore miasto", ru: "немаленький город" }
  - { pl: "sporo czasu", ru: "довольно много времени" }
family:
  - { pl: "sporo", ru: "довольно много, немало", relation: derived }
etymology: "Праславянское *sporъ «обильный, спорый» — тот же корень, что в русском «спорый» и «спориться». Но значения разошлись: поляк говорит о размере, русский — о скорости."
memory: "spory — «немалый, изрядный»: spory problem, spora szansa. Два подвоха сразу: это не русское «спорый» (быстрый), и форма spory совпадает с множественным числом слова spór «спор»."
idioms:
  - { pl: "spora szansa", ru: "немалый шанс" }
  - { pl: "spory kawałek", ru: "изрядный кусок" }
  - { pl: "sporo czasu", ru: "довольно много времени" }
formExamplesSkip:
