  - id: chance
    ru: "spora szansa — немалый шанс, изрядная вероятность"
    examples:
      - pl: "Jest spora szansa, że przyjdzie."
        ru: "Есть немалый шанс, что он придёт."
        source: { kind: translated, id: 3847907 }
      - pl: "Jest spora szansa, że ma dziewczynę."
        ru: "Есть немалый шанс, что у него есть девушка."
