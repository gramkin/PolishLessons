  - id: show-off
    ru: "покрасоваться, щегольнуть (чтобы впечатлить)"
    examples:
      - pl: "Kupił drogie auto, żeby zaimponować sąsiadom."
        ru: "Он купил дорогую машину, чтобы покрасоваться перед соседями."
