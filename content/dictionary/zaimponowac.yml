        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ZAIMPONOWAĆ — «произвести впечатление», от IMPONOWAĆ, «импонировать». Русское «импонировать» книжное, польское — обычное: ZAIMPONOWAŁ MI. Управление — дательный лица, творительный причины: ZAIMPONOWAĆ KOMUŚ ODWAGĄ, «впечатлить кого-то смелостью», без предлога «на»." }
  - { kind: usage, text: "Сорок две формы: глагол совершенного вида с дательным, а не винительным, поэтому страдательного причастия нет; есть деепричастие ZAIMPONOWAWSZY и безличное ZAIMPONOWANO. Спряжение на -UJĘ: ZAIMPONUJĘ, ZAIMPONUJESZ. Видовой партнёр — IMPONOWAĆ." }
  - { kind: government, text: "Кому — дательный: ZAIMPONOWAĆ DZIEWCZYNIE, SZEFOWI. Чем — творительный без предлога: WIEDZĄ, SIŁĄ, POCZUCIEM HUMORU. Русскому «на кого» здесь отвечает дательный." }
  - { kind: pronunciation, text: "Читается «заимпоно́ваць», пять слогов, ударение на предпоследнем. ZA и IM раздельно: «за-им». Конечное Ć — «ць». ZAIMPONUJĘ — «заимпону́е»." }
  - { kind: register, text: "Нейтральное разговорное слово. Прилагательное IMPONUJĄCY — «впечатляющий»: IMPONUJĄCY WYNIK. Ироничное: CHCIAŁ ZAIMPONOWAĆ, A WYSZŁO JAK ZAWSZE, «хотел впечатлить, а вышло как всегда»." }
collocations:
  - { pl: "zaimponować komuś wiedzą", ru: "впечатлить кого-то знаниями" }
  - { pl: "chcieć zaimponować", ru: "хотеть произвести впечатление" }
  - { pl: "zaimponować odwagą", ru: "впечатлить смелостью" }
family:
  - { pl: "imponować", ru: "импонировать, впечатлять", relation: aspect }
  - { pl: "imponujący", ru: "впечатляющий", relation: derived, id: imponujacy }
  - { pl: "zrobić wrażenie", ru: "произвести впечатление", relation: root }
etymology: "Приставка ZA- плюс IMPONOWAĆ, через немецкое IMPONIEREN из латинского IMPONERE «возлагать, внушать». То же слово, что русское «импонировать»."
memory: "Zaimponować — впечатлить: zaimponował mi wiedzą (дательный + творительный, без «на»!). Imponujący — впечатляющий. Читается «заимпоно́ваць»."
idioms:
