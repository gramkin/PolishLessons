etymology: "От ROZSĄDEK «здравый смысл», составленного из приставки ROZ- и корня SĄD, который значит и «суд», и «суждение». Тот же корень в русских «суд», «судить», «рассудок», и из праславянского *sǫdъ. Буквально ROZSĄDEK — «разбор, различение», способность разделить верное и неверное, а ROZSĄDNY — тот, кто этой способностью наделён. Русский «рассудок» собран из тех же частей и значит почти то же, но прилагательное от него, «рассудочный», пошло в сторону холодной умственности, тогда как польское осталось при житейском благоразумии. Носовая ą в польском соответствует русскому у в «суд»: это закономерный исход праславянского *ǫ."
memory: "От rozsądek «здравый смысл», не от rozsądzić «рассудить». Значит «благоразумный», а не «рассудочный»: слово обиходное и одобрительное. Степени правильные: rozsądniejszy, najrozsądniejszy. Носовая ą перед d звучит «он»: «розсо́ндны»."
idioms:
