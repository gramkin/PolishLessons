notes:
  - { kind: false-friend, text: "Корень обманывает дважды. Во-первых, ROZSĄDNY — это «разумный, благоразумный», а не «рассудочный» и не «рассудительный»: по-русски «рассудочный» звучит книжно и чуть холодно, тогда как ROZSĄDNY совершенно обиходно и всегда одобрительно. Во-вторых, рядом стоит глагол ROZSĄDZIĆ «рассудить, разрешить спор», от которого прилагательного ROZSĄDNY не образуется: оно идёт от существительного ROZSĄDEK «здравый смысл». Так что ROZSĄDNY — тот, у кого есть ROZSĄDEK, а не тот, кто кого-то рассудил." }
  - { kind: pronunciation, text: "Читается «розсо́ндны», с ударением на предпоследнем слоге. Главное место — носовая ą, которая перед d звучит как «он»: SĄD даёт «сонт», ROZSĄDNY даёт «розсо́ндны». Приставка ROZ перед глухим s не оглушается полностью, но на слух z приближается к «с», отсюда «розс». Мужско-личная форма ROZSĄDNI звучит «розсо́ндни», с мягким ni." }
  - { kind: usage, text: "Степени сравнения образуются правильно, суффиксом: ROZSĄDNY, ROZSĄDNIEJSZY, NAJROZSĄDNIEJSZY, как и у всех прилагательных на -NY. Это тот же класс, что POPULARNY, и противоположность SZEROKI с его усечённой основой. Два значения различает предмет: о человеке — «благоразумный», о цене, решении, сроке — «разумный, умеренный». Во втором значении слово очень частое в объявлениях и переговорах: ROZSĄDNA CENA, ROZSĄDNY TERMIN. Наречие — ROZSĄDNIE." }
  - { kind: government, text: "Прилагательное согласуется с существительным и управления не имеет. Устойчивые сочетания стоит запомнить: W ROZSĄDNYCH GRANICACH «в разумных пределах», ROZSĄDNA CENA, ROZSĄDNY KOMPROMIS. При сравнении — OD с родительным или NIŻ: ROZSĄDNIEJSZY OD BRATA, ROZSĄDNIEJSZY NIŻ BRAT. В повелительном обороте слово ставится в краткой предикативной роли: BĄDŹ ROZSĄDNY, где прилагательное согласуется с подразумеваемым подлежащим." }
