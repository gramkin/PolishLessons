# review
id: montownia
format: 2
lemma: "montownia"
rank: 5935
pos: noun
pron: { cyr: "монто́вня" }
senses:
  - id: plant
    ru: "сборочный завод, сборочный цех"
    examples:
      - pl: "Pracuje w montowni samochodów."
        ru: "Он работает на заводе по сборке автомобилей."
        source: { kind: authored }
      - pl: "Firma otworzyła nową montownię pod Poznaniem."
        ru: "Фирма открыла новый сборочный завод под Познанью."
        source: { kind: authored }
      - pl: "W montowni składa się telewizory z gotowych części."
        ru: "На сборочном заводе телевизоры собирают из готовых деталей."
        source: { kind: authored }
  - id: figurative
    ru: "сборочный цех (о стране или экономике без своих разработок, пренебр.)"
    examples:
      - pl: "Polska nie może być tylko montownią Europy."
        ru: "Польша не может быть лишь сборочным цехом Европы."
        source: { kind: authored }
      - pl: "Kraj zamienił się w montownię zachodnich koncernów."
        ru: "Страна превратилась в сборочный цех западных концернов."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Суффикс -OWNIA/-ARNIA называет место, где что-то делают: PIEKARNIA «пекарня», KAWIARNIA «кафе», MONTOWNIA «место, где собирают». Глагол MONTOWAĆ — «собирать, устанавливать», а не только «монтировать»." }
  - { kind: usage, text: "Женский род на -NIA: родительный, дательный и предложный единственного, а также родительный множественного — MONTOWNI. Звательный MONTOWNIO не употребляется." }
  - { kind: pronunciation, text: "Читается «монто́вня»: NI перед гласной — мягкое «нь», ударение на предпоследнем слоге." }
collocations:
  - { pl: "montownia samochodów", ru: "автосборочный завод" }
  - { pl: "pracować w montowni", ru: "работать на сборке" }
  - { pl: "otworzyć montownię", ru: "открыть сборочный завод" }
family:
  - { pl: "montować", ru: "собирать, устанавливать", relation: root }
  - { pl: "montaż", ru: "сборка, монтаж", relation: root }
  - { pl: "monter", ru: "сборщик, монтажник", relation: root }
etymology: "От MONTOWAĆ «собирать» (через немецкий из французского MONTER) с суффиксом места -OWNIA."
memory: "Montować — собирать; montownia — место, где собирают. Как piekarnia — где пекут."
idioms:
  - { pl: "montownia Europy", ru: "сборочный цех Европы (о стране с дешёвым трудом)" }
formExamplesSkip:
