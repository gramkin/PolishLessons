# review
id: obserwowac
format: 2
lemma: "obserwować"
rank: 969
pos: verb
aspect: imperf
pron: { cyr: "обсэрво́ваць" }
senses:
  - id: watch
    ru: "наблюдать за кем-то, следить"
    examples:
      - pl: "Tom cię obserwuje."
        ru: "Том за тобой наблюдает."
        source: { kind: translated, id: 5505091 }
      - pl: "Lubię obserwować pająki."
        ru: "Я люблю наблюдать за пауками."
        source: { kind: translated, id: 10468155 }
      - pl: "Tom obserwował Mary."
        ru: "Том наблюдал за Мэри."
        source: { kind: translated, id: 8166667 }
  - id: be-watched
    ru: "być obserwowanym — быть под наблюдением"
    examples:
      - pl: "Obserwują mnie."
        ru: "За мной наблюдают."
        source: { kind: translated, id: 8950094 }
      - pl: "Czułem się obserwowany."
        ru: "Я чувствовал, что за мной наблюдают."
        source: { kind: translated, id: 982577 }
  - id: birds
    ru: "obserwowanie ptaków — наблюдение за птицами"
    examples:
      - pl: "Tom lubi obserwować ptaki."
        ru: "Том любит наблюдать за птицами."
        source: { kind: translated, id: 6157360 }
      - pl: "Uwielbiam obserwowanie ptaków."
        ru: "Я обожаю наблюдать за птицами."
        source: { kind: translated, id: 5966613 }
notes:
  - { kind: government, text: "Главное отличие от русского — падеж: obserwować kogoś, винительный без предлога. Русское «наблюдать ЗА кем-то» требует творительного с предлогом. Obserwuję cię «Я за тобой наблюдаю»." }
  - { kind: usage, text: "Несовершенный вид; совершенный — zaobserwować «подметить, зафиксировать»." }
  - { kind: usage, text: "Отглагольное obserwowanie значит «наблюдение» как занятие, а obserwacja — «наблюдение» как результат или медицинский надзор." }
  - { kind: usage, text: "Заимствовано из латыни через немецкий, как и русское «обсервация»; но в польском это обычное повседневное слово." }
collocations:
  - { pl: "obserwować kogoś", ru: "наблюдать за кем-то" }
  - { pl: "obserwować ptaki", ru: "наблюдать за птицами" }
  - { pl: "być obserwowanym", ru: "быть под наблюдением" }
family:
  - { pl: "zaobserwować", ru: "подметить, зафиксировать", relation: aspect }
  - { pl: "obserwacja", ru: "наблюдение", relation: derived }
  - { pl: "obserwator", ru: "наблюдатель", relation: derived }
etymology: "Через немецкое observieren из латинского observare «наблюдать, соблюдать». Русская «обсервация» — то же слово, но у нас оно осталось книжным, а в польском стало обиходным."
memory: "obserwować — «наблюдать», и падеж другой: obserwować kogoś, винительный без предлога, а по-русски «наблюдать ЗА кем-то», творительный. Obserwuję cię «Я за тобой наблюдаю»."
idioms:
  - { pl: "obserwować ptaki", ru: "наблюдать за птицами" }
  - { pl: "być obserwowanym", ru: "быть под наблюдением" }
