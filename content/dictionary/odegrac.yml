# review
id: odegrac
format: 2
lemma: "odegrać"
rank: 5357
pos: verb
pron: { cyr: "одэ́граць" }
senses:
  - id: role
    ru: "сыграть (роль, в т.ч. переносно)"
    examples:
      - pl: "Odegrał ważną rolę w historii miasta."
        ru: "Он сыграл важную роль в истории города."
        source: { kind: authored }
      - pl: "Pogoda odegrała tu kluczową rolę."
        ru: "Погода сыграла здесь ключевую роль."
        source: { kind: authored }
      - pl: "Aktorka świetnie odegrała scenę kłótni."
        ru: "Актриса прекрасно сыграла сцену ссоры."
        source: { kind: authored }
  - id: perform
    ru: "исполнить (мелодию, гимн); разыграть (сцену)"
    examples:
      - pl: "Orkiestra odegrała hymn narodowy."
        ru: "Оркестр исполнил государственный гимн."
        source: { kind: authored }
      - pl: "Dzieci odegrały przedstawienie dla rodziców."
        ru: "Дети разыграли спектакль для родителей."
        source: { kind: authored }
  - id: revenge
    ru: "с SIĘ — отыграться, отомстить"
    examples:
      - pl: "Drużyna odegrała się w rewanżu."
        ru: "Команда отыгралась в ответном матче."
        source: { kind: authored }
      - pl: "Odegram się na nim za tę zniewagę."
        ru: "Я отомщу ему за это оскорбление."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ODEGRAĆ — не «отыграть» в смысле «доиграть до конца», а «сыграть, исполнить»: ODEGRAĆ ROLĘ. Русское «играть роль» в настоящем — ODGRYWAĆ ROLĘ. Просто «сыграть в игру» — ZAGRAĆ: ZAGRAĆ W SZACHY, а не ODEGRAĆ." }
  - { kind: usage, text: "Пятьдесят две формы: страдательное ODEGRANY — о ролях, сценах и мелодиях; форма для мужчин-людей ODEGRANI в карточку не включена. Спряжение как у GRAĆ: ODEGRAM, ODEGRASZ. Несовершенный вид — ODGRYWAĆ. С SIĘ — «отыграться» в игре и «отомстить»." }
  - { kind: government, text: "Что — винительный: ODEGRAĆ ROLĘ, ODEGRAĆ MELODIĘ. С SIĘ — на ком: NA с предложным: ODEGRAĆ SIĘ NA KIMŚ. За что — ZA с винительным: ODEGRAĆ SIĘ ZA PORAŻKĘ." }
  - { kind: pronunciation, text: "Читается «одэ́граць», ударение на предпоследнем слоге. Между D и E нет мягкости: «одэ», а не «оде». ODEGRAM — «одэ́грам»." }
  - { kind: register, text: "ODEGRAĆ ROLĘ — устойчиво и нейтрально, в газетах и учебниках. ODEGRAĆ SIĘ в смысле «отомстить» — разговорное. ODEGRAĆ KOMEDIĘ — «разыграть комедию», то есть притвориться." }
collocations:
  - { pl: "odegrać rolę", ru: "сыграть роль" }
  - { pl: "odegrać hymn", ru: "исполнить гимн" }
  - { pl: "odegrać się na kimś", ru: "отыграться на ком-то, отомстить" }
family:
  - { pl: "grać", ru: "играть", relation: root, id: grac }
  - { pl: "zagrać", ru: "сыграть", relation: derived, id: zagrac }
  - { pl: "odgrywać", ru: "играть (роль), исполнять", relation: aspect }
etymology: "Приставка OD- плюс GRAĆ «играть», праславянское *jьgrati. Русское «отыграть», «отыграться» — то же строение; значение «исполнить роль» польское."
memory: "Odegrać rolę — сыграть роль: pogoda odegrała kluczową rolę. Odegrać się — отыграться, отомстить. Читается «одэ́граць»."
idioms:
  - { pl: "odegrać komedię", ru: "разыграть комедию, притвориться" }
formExamplesSkip:
  - { form: "odegrani", reason: "людей не «исполняют»: формы для мужчин-людей нет" }
