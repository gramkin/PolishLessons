notes:
  - { kind: government, text: "Женский род на -ość: ta młodość, tej młodości. В молодости — w młodości, предложный падеж." }
  - { kind: false-friend, text: "От młody «молодой». Русское «молодость» — то же слово, но польское потеряло полногласие: мо-ло-дость → mło-dość, и ł читается как у." }
  - { kind: usage, text: "Fontanna młodości — «источник молодости», как и в русском." }
  - { kind: usage, text: "Родственные: młodzież «молодёжь», młodzieniec «юноша», odmłodzić «омолодить»." }
collocations:
  - { pl: "w młodości", ru: "в молодости" }
  - { pl: "fontanna młodości", ru: "источник молодости" }
etymology: "От młody «молодой»; русское «молодость» — то же слово, но с полногласием."
memory: "młodość — «молодость», читается «муо́досьць». В молодости — w młodości. Родня: młodzież «молодёжь»."
