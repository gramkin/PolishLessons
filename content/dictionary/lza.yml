notes:
  - { kind: false-friend, text: "Русская «слеза» и польское łza — одно слово, но польское потеряло начальное с- и звучит «уза». Узнать его на слух трудно." }
  - { kind: government, text: "Женский род: ta łza, tej łzy. Родительный мн. — łez, без окончания." }
  - { kind: usage, text: "Do łez «до слёз»: poruszony do łez «растроган до слёз». We łzach «в слезах» — с удлинённым предлогом we." }
  - { kind: usage, text: "Выражение wybuchnąć łzami значит «разрыдаться», буквально «взорваться слезами»." }
collocations:
  - { pl: "do łez", ru: "до слёз" }
  - { pl: "we łzach", ru: "в слезах" }
etymology: "Праславянское *slъza; русская «слеза» — то же слово, но польское потеряло начальное с-."
memory: "łza — «слеза», читается «уза». Родительный мн. — łez. Обороты: do łez «до слёз», we łzach «в слезах», с удлинённым we."
idioms:
  - { pl: "do łez", ru: "до слёз" }
  - { pl: "we łzach", ru: "в слезах" }
formExamplesSkip:
  - { form: "łzo", reason: "звательная форма, а łza — это слеза. Обращаться к ней некому, поэтому форма остаётся только в таблице склонения" }
