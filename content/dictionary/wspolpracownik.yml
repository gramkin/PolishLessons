notes:
  - { kind: usage, text: "Слово собрано из тех же частей, что русское «сотрудник», но из другого материала. Приставка WSPÓŁ- отвечает русской «со-», а основа PRACOWNIK значит «работник», от PRACA «работа». Получается «со-работник», тогда как русский взял корень «труд» и сделал «сотрудник». Существительное мужское личное, поэтому винительный множественного совпадает с родительным: WIDZIAŁEM WSPÓŁPRACOWNIKÓW. В именительном множественного K меняется на C: WSPÓŁPRACOWNICY, и это то же чередование, что в PRACOWNIK и PRACOWNICY." }
  - { kind: pronunciation, text: "Это слово — хорошая проверка сразу трёх правил, и все три сидят в первом слоге. Буква W перед глухой S оглушается и звучит как «ф». Буква Ó читается как «у». Буква Ł тоже даёт «у». В итоге WSPÓŁ звучит «фспуу», с двумя «у» подряд, и ничего похожего на русское «вспол» здесь нет. Дальше идёт PRACOWNIK, то есть «працо́вник», с ударением на предпоследнем слоге всего слова. Целиком получается «фспуупрацо́вник»." }
  - { kind: government, text: "Чей сотрудник — родительный падеж без предлога: WSPÓŁPRACOWNIK MINISTRA «сотрудник министра», WSPÓŁPRACOWNIK PISMA «сотрудник журнала». Глагол того же гнезда WSPÓŁPRACOWAĆ управляет предлогом Z с творительным: WSPÓŁPRACUJĘ Z NIMI OD LAT «я сотрудничаю с ними годами», и это совпадает с русским полностью. Отдельно стоит WSPÓŁPRACA «сотрудничество», которое в том же обороте берёт тот же предлог: WSPÓŁPRACA Z ZAGRANICĄ." }
  - { kind: register, text: "В нейтральном употреблении это обычное слово из кадровых документов и вежливой речи, примерно как русское «сотрудник». Но в разговоре о временах Польской Народной Республики оно получило отдельное, тяжёлое значение: WSPÓŁPRACOWNIK SŁUŻBY BEZPIECZEŃSTWA означает человека, доносившего на других, и в таком контексте слово звучит как обвинение. Поэтому фразу BYŁ WSPÓŁPRACOWNIKIEM без уточнения чьим в историческом разговоре понимают однозначно. В обычной конторе этой тени у слова нет." }
  - { kind: false-friend, text: "Корень PRACA стоит запомнить отдельно, потому что русского родственника у него нет: «работа» по-польски ROBOTA, и это слово в польском тоже есть, но звучит разговорно, примерно как русское «работёнка». Нейтральное слово — PRACA: IDĘ DO PRACY «я иду на работу», SZUKAM PRACY «я ищу работу». Соответственно PRACOWNIK это «работник», PRACODAWCA «работодатель», а BEZROBOCIE, уже от ROBOTA, значит «безработица»." }
