etymology: "Сложено из приставки WSPÓŁ- и слова PRACOWNIK. Польская приставка тяжелее русской «со-»: она выросла из сочетания предлога S и слова PÓŁ, то есть буквально означает участие в половине дела, долю в общем. Русский в тех же случаях обходится одной согласной, «со-», и строит «сотрудник», «соучастник», «соавтор». Основа идёт от PRACA «работа», слова, у которого прямого русского соответствия нет: русский на то же понятие взял «труд» и «работу». Отсюда и вся разница устройства: одно и то же понятие, со-работник и сотрудник, собрано из разных половин."
memory: "Собрано как русское «сотрудник», но из другого материала: współ- это «со-», а pracownik это «работник», от praca «работа». Русский взял корень «труд», польский корень «праца». Читается «фспуупрацо́вник», и первый слог стоит разобрать: w перед глухой даёт «ф», ó даёт «у», ł тоже «у», отсюда «фспуу». Управление глагола совпадает с русским: współpracować Z kimś. И знать второй, тяжёлый смысл: współpracownik SB означает доносчика."
