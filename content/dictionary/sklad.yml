notes:
  - { kind: false-friend, text: "SKŁAD — и «состав», и «склад». Чаще «состав»: SKŁAD DRUŻYNY, SKŁAD CHEMICZNY, W SKŁADZIE, «в составе». Большой склад товаров обычно MAGAZYN, а SKŁAD — небольшой: SKŁAD WĘGLA, SKŁAD BUDOWLANY." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Родительный — SKŁADU. В местном падеже D переходит в DZ: W SKŁADZIE." }
  - { kind: government, text: "Входить в состав — WCHODZIĆ W SKŁAD, и родительный: W SKŁAD RZĄDU. В составе — W SKŁADZIE. Состав чего — родительный: SKŁAD PRODUKTU." }
  - { kind: pronunciation, text: "Читается «скуат», один слог. Ł — краткое «у», конечное D оглушается в «т»." }
collocations:
  - { pl: "skład drużyny", ru: "состав команды" }
  - { pl: "wchodzić w skład", ru: "входить в состав" }
  - { pl: "skład budowlany", ru: "строительный склад" }
family:
  - { pl: "składać", ru: "складывать; составлять", relation: root, id: skladac }
  - { pl: "składnik", ru: "ингредиент, компонент", relation: root }
  - { pl: "złożyć", ru: "сложить", relation: root, id: zlozyc }
etymology: "От SKŁADAĆ «складывать, составлять»: состав — то, из чего сложено, склад — место, куда складывают. Русское «склад» того же корня."
memory: "Skład — состав и склад: w składzie — в составе. Читается «скуат». Magazyn — большой склад. Do ładu i składu — в порядок."
idioms:
  - { pl: "doprowadzić do ładu i składu", ru: "привести в порядок" }
