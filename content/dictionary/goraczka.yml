id: goraczka
format: 2
lemma: "gorączka"
rank: 2763
pos: noun
pron: { cyr: "горо́нчка" }
senses:
  - id: fever
    ru: "температура, жар"
    examples:
      - pl: "Gorączka spadła dopiero nad ranem."
        ru: "Температура спала только к утру."
        source: { kind: authored }
      - pl: "Mam gorączkę od wczoraj."
        ru: "У меня температура с вчера."
        source: { kind: authored }
      - pl: "Leżał z gorączką przez cztery dni."
        ru: "Он лежал с температурой четыре дня."
        source: { kind: authored }
  - id: frenzy
    ru: "лихорадка, горячка"
    examples:
      - pl: "Gorączka złota przyciągnęła tysiące."
        ru: "Золотая лихорадка привлекла тысячи."
        source: { kind: authored }
      - pl: "W gorączce mówił rzeczy bez sensu."
        ru: "В жару он говорил бессмысленные вещи."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Это повседневное слово для повышенной температуры: MAM GORĄCZKĘ значит «у меня температура», zbić gorączkę — «сбить температуру». Русская «горячка» — то же самое слово от того же корня, gorący и «горячий», но у нас оно ушло в спешку и бред, а медицинский смысл отдан «температуре» и «жару». Так что родство есть, а употребление разошлось: по-русски «у меня горячка» звучит либо устарело, либо о спешке." }
  - { kind: pronunciation, text: "Дательный и предложный — GORĄCZCE, с переходом k в c, родительный множественного — GORĄCZEK, с беглой e. Это четвёртое слово такого вида после kostka, kulka и szafka, и правило для уменьшительных на -ka можно считать общим. Носовое ą перед cz читается как «он»: «горо́нчка»." }
collocations:
  - { pl: "mieć gorączkę", ru: "температурить, иметь высокую температуру" }
  - { pl: "zbić gorączkę", ru: "сбить температуру" }
  - { pl: "gorączka złota", ru: "золотая лихорадка" }
family:
  - { pl: "gorący", ru: "горячий", relation: root, id: goracy }
  - { pl: "gorąco", ru: "жарко", relation: derived }
  - { pl: "rozgorączkowany", ru: "лихорадочный", relation: derived }
etymology: "От GORĄCY «горячий», из праславянского *gorěti «гореть», с тем же суффиксом -ka. Русская «горячка» собрана из тех же частей, и первоначально оба слова значили одно — жар в теле. Польский на этом значении остался, а русский передал его «температуре» и оставил «горячке» переносный смысл спешки и помрачения."
memory: "«У меня температура» по-польски MAM GORĄCZKĘ. Слово то же, что наша «горячка», только у нас оно сдвинулось в спешку."
idioms:
  - { pl: "gorączka złota", ru: "золотая лихорадка" }
  - { pl: "mieć gorączkę", ru: "температурить, иметь высокую температуру" }
