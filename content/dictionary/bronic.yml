# review
id: bronic
format: 2
lemma: "bronić"
rank: 418
pos: verb
aspect: imperf
pron: { cyr: "бро́ниць" }
senses:
  - id: defend
    ru: "защищать, оборонять (кого-что — родительный падеж!)"
    examples:
      - pl: "Martino stanął po stronie Rimy i bronił jej."
        ru: "Мартино встал на сторону Римы и защищал её."
        source: { kind: tatoeba, id: 12524367 }
      - pl: "Każdy obywatel Węgier jest zobowiązany bronić ojczyzny."
        ru: "Каждый гражданин Венгрии обязан защищать родину."
        source: { kind: tatoeba, id: 12624936 }
      - pl: "Bronili kraju przed wrogami."
        ru: "Они защищали страну от врагов."
        source: { kind: translated, id: 826588 }
  - id: defend-self
    ru: "защищаться, отбиваться (bronić się)"
    examples:
      - pl: "Muszę się bronić."
        ru: "Мне надо защищаться."
        source: { kind: translated, id: 8770939 }
      - pl: "Broń się!"
        ru: "Защищайся!"
        source: { kind: translated, id: 8750906 }
      - pl: "Bronię się przed zarzutami."
        ru: "Я защищаюсь от обвинений."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Главная ловушка падежа: bronić требует родительного, а русское «защищать» — винительного. bronić ojczyzny «защищать родину», bronić swojego zdania «отстаивать своё мнение» — но не bronić ojczyznę." }
  - { kind: usage, text: "Защищаются przed czymś — с творительным: bronić się przed zarzutami «защищаться от обвинений»." }
  - { kind: false-friend, text: "Форма broń — это и существительное «оружие», и повелительное «защищай»: Do broni! «К оружию!», но Broń się! «Защищайся!» То же и с broni, bronią." }
  - { kind: usage, text: "Корень тот же, что в broń «оружие», и в русских «оборона», «броня», «бороться»." }
collocations:
  - { pl: "bronić ojczyzny", ru: "защищать родину" }
  - { pl: "bronić się", ru: "защищаться" }
  - { pl: "bronić swojego zdania", ru: "отстаивать своё мнение" }
  - { pl: "broń Boże", ru: "упаси Боже" }
etymology: "Праславянское *borniti, от *borna «защита, ограда». Русские родственники — «оборона», «броня», «бороться»; польское broń «оружие» — то же гнездо."
memory: "bronić — «защищать», одного корня с русскими «оборона» и «броня». Две вещи запомнить. Падеж: bronić требует родительного — bronić ojczyzny «защищать родину», а не ojczyznę. И омонимия с оружием: broń — это и «оружие», и «защищай», так что Do broni! значит «К оружию!», а Broń się! — «Защищайся!»"
idioms:
  - { pl: "broń Boże", ru: "упаси Боже" }
  - { pl: "żywią i bronią", ru: "кормят и защищают" }
  - { pl: "bronić się rękami i nogami", ru: "отбиваться руками и ногами" }
