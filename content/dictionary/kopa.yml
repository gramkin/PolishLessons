notes:
  - { kind: false-friend, text: "Редкий случай, когда русскому достаётся сразу два ключа. Первый: KOPA SIANA это «копна сена», и русская «копна» того же корня, только с лишним суффиксом. Второй ключ исторический: KOPA это ещё и старая единица счёта, шестьдесят штук, и ровно такая же «копа» была в западнорусских землях, где считали копами грошей. Так что слово не нужно заучивать: нужно вспомнить «копну» и старинную «копу»." }
  - { kind: usage, text: "Одиннадцать форм, женский род. Любопытнее всего два родительных множественного: обычное KOP и старое KÓP, с чередованием O в Ó. Оба встречаются, но KOP сегодня частотнее. В дательном и местном падеже единственного числа P переходит в PI: KOPA, но NA KOPIE. Эта форма совпадает сразу с двумя чужими: KOPIE это и «копия» в дательном, и «он копает» от KOPAĆ, так что различает только контекст." }
  - { kind: government, text: "На копне — предлог NA с местным падежом: NA KOPIE SIANA. Под копной — предлог POD с творительным: POD KOPĄ. Считать копами — предлог NA с винительным множественного: KUPOWAĆ NA KOPY, и эта конструкция с NA для единиц счёта в польском обычна, как SPRZEDAWAĆ NA SZTUKI «продавать поштучно». Копна чего-либо — родительный без предлога: KOPA SIANA." }
  - { kind: pronunciation, text: "Читается «ко́па», два слога, ударение на первом, в точности как русское слово «копа». В форме KOPIE сочетание PIE даёт мягкое «пе», и слышно «ко́пе». Старая форма родительного множественного KÓP произносится «куп», потому что Ó в польском всегда читается как «у»: написание сохраняет память о древнем долгом O, а звучит оно «у». Обычное KOP звучит «коп»." }
  - { kind: register, text: "Слово деревенское и слегка старомодное, живое там, где ещё косят и сушат сено: KOPA SIANA, UKŁADAĆ KOPY «складывать копны». Значение шестидесяти штук сегодня историческое и встречается в старых счетах и в поговорках, хотя на деревенском рынке «копу яиц» ещё помнят. В городской речи слово почти не звучит, зато в литературе о деревне оно обычно, и узнать его стоит хотя бы ради чтения." }
