etymology: "От праславянского корня KOP-, того же, что в KOPAĆ «копать»: копна это то, что сгребли и сложили, как и KOPIEC «курган» это насыпанный холм. Русская «копна» собрана от того же корня, с суффиксом -Н-, поэтому слова прямые родственники. Значение шестидесяти штук появилось в средневековой торговле и держалось в Польше и в западнорусских землях одинаково: «копа грошей» в старых документах это те же шестьдесят монет, что польская KOPA."
memory: "Два ключа сразу, и оба русские. Kopa siana это «копна сена», и «копна» того же корня, от «копать»: сгребённое и сложенное. А kopa как шестьдесят штук это та самая старинная «копа», которой считали гроши. Два родительных множественного: обычное kop и старое kóp, причём ó читается как «у», то есть «куп». В местном падеже p переходит в pi: na kopie, что совпадает и с «копией», и с «он копает»."
idioms:
