# review
id: zaczynac
format: 2
lemma: "zaczynać"
rank: 299
pos: verb
aspect: imperf
pron: { cyr: "зачы́наць" }
senses:
  - id: begin
    ru: "начинать"
    examples:
      - pl: "Zaczynam."
        ru: "Я начинаю."
        source: { kind: tatoeba, id: 352984 }
      - pl: "Zaczynamy?"
        ru: "Мы начинаем?"
        source: { kind: tatoeba, id: 531646 }
      - pl: "Kiedy on zaczyna?"
        ru: "Когда он начинает?"
        source: { kind: tatoeba, id: 4899804 }
  - id: begin-self
    ru: "zaczynać się — начинаться"
    examples:
      - pl: "Znowu się zaczyna."
        ru: "Это снова начинается."
        source: { kind: tatoeba, id: 6542025 }
      - pl: "Wakacje zaczynają się w lipcu."
        ru: "Каникулы начинаются в июле."
        source: { kind: tatoeba, id: 12564132 }
      - pl: "Zaczynasz mnie irytować."
        ru: "Ты начинаешь меня раздражать."
        source: { kind: tatoeba, id: 5956181 }
notes:
  - { kind: usage, text: "Возвратное zaczynać się значит «начинаться»: Wakacje zaczynają się w lipcu «Каникулы начинаются в июле»." }
  - { kind: usage, text: "Совершенный вид — zacząć: Zacząłem wczoraj «Я начал вчера»." }
  - { kind: usage, text: "С инфинитивом значит «начинать делать»: Zaczynam rozumieć «Я начинаю понимать», Zaczyna padać «Начинается дождь»." }
  - { kind: usage, text: "Корень czynić «делать» — тот же, что в русских «чинить», «починить», «зачин»." }
collocations:
  - { pl: "zaczynać od", ru: "начинать с" }
  - { pl: "zaczyna się", ru: "начинается" }
  - { pl: "zaczynam rozumieć", ru: "я начинаю понимать" }
  - { pl: "czas zaczynać", ru: "пора начинать" }
etymology: "Из za- + czynić «делать», праславянское *činiti; то же гнездо, что русские «чинить», «починить», «зачин»."
memory: "zaczynać — «начинать», сов. zacząć. Возвратное zaczynać się значит «начинаться»: Wakacje zaczynają się w lipcu."
idioms:
  - { pl: "zaczynają się schody", ru: "начинаются трудности" }
  - { pl: "zaczynać od zera", ru: "начинать с нуля" }
  - { pl: "co się źle zaczyna, to się dobrze kończy", ru: "что плохо начинается, то хорошо кончается" }
