# review
id: uznac
format: 2
lemma: "uznać"
rank: 1141
pos: verb
aspect: perf
pron: { cyr: "у́знаць" }
senses:
  - id: consider
    ru: "счесть, решить, посчитать"
    examples:
      - pl: "Uznał, że mądrzej jest milczeć."
        ru: "Он счёл, что умнее промолчать."
        source: { kind: translated, id: 712434 }
      - pl: "Uznałem, że najlepiej milczeć."
        ru: "Я счёл, что лучше промолчать."
        source: { kind: translated, id: 722228 }
      - pl: "Posługiwanie się ogniem można uznać za największy wynalazek człowieka."
        ru: "Использование огня можно считать величайшим изобретением человека."
        source: { kind: translated, id: 10806792 }
  - id: find-guilty
    ru: "uznać za winnego — признать виновным"
    examples:
      - pl: "Sędzia uznał aresztanta za winnego."
        ru: "Судья признал арестованного виновным."
        source: { kind: translated, id: 2211948 }
      - pl: "Tom został uznany za winnego."
        ru: "Том был признан виновным."
        source: { kind: translated, id: 3857371 }
      - pl: "Słyszałem że uznali ją za winną."
        ru: "Я слышал, её признали виновной."
        source: { kind: tatoeba, id: 12501747 }
  - id: recognition
    ru: "uznany — признанный; uznanie — признание"
    examples:
      - pl: "Jest uznanym specjalistą w tej dziedzinie."
        ru: "Он признанный специалист в этой области."
        source: { kind: translated, id: 581336 }
      - pl: "Chcielibyśmy ci to dać jako wyraz uznania."
        ru: "Мы хотели бы дать тебе это в знак признания."
        source: { kind: translated, id: 1352176 }
notes:
  - { kind: government, text: "Ключевая конструкция: uznać kogoś ZA kogoś — предлог za с винительным. Uznać kogoś za winnego «признать виновным», uznać coś za błąd «счесть ошибкой». По-русски здесь творительный или «за» с винительным." }
  - { kind: usage, text: "Очень часто значит просто «решить, счесть»: Uznał, że lepiej milczeć «Он решил, что лучше промолчать» — с союзом że." }
  - { kind: usage, text: "Несовершенный вид — uznawać. Отглагольное uznanie значит «признание»: wyraz uznania «знак признания»." }
  - { kind: usage, text: "Оборот według własnego uznania значит «по собственному усмотрению»." }
collocations:
  - { pl: "uznać za winnego", ru: "признать виновным" }
  - { pl: "uznać za konieczne", ru: "счесть необходимым" }
  - { pl: "uznany specjalista", ru: "признанный специалист" }
  - { pl: "wyraz uznania", ru: "знак признания" }
family:
  - { pl: "uznawać", ru: "признавать (несовершенный вид)", relation: aspect }
  - { pl: "znać", ru: "знать", relation: root, id: znac }
  - { pl: "uznanie", ru: "признание", relation: derived }
etymology: "Приставка u- плюс znać «знать» — буквально «признать за что-то, опознать». Русское «признать» собрано из того же «знать», только с приставкой «при-»."
memory: "uznać — «счесть, признать», и главное тут конструкция: uznać kogoś ZA kogoś, предлог za с винительным. Uznać za winnego «признать виновным». А с союзом że слово значит просто «решить»."
idioms:
  - { pl: "uznać za winnego", ru: "признать виновным" }
  - { pl: "według własnego uznania", ru: "по собственному усмотрению" }
formExamplesSkip:
  - { form: "uznawszy", reason: "книжное деепричастие прошедшего времени; в живой речи не употребляется" }
