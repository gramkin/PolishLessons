formExamples:
  - form: "uzna"
    pl: "Ona chyba nie uzna mojego wyjaśnienia."
    ru: "Она, наверное, не примет моего объяснения."
    source: { kind: translated, id: 529952 }
  - form: "uzna"
    pl: "On rzuca się na wszystko, co uzna za interesujące."
    ru: "Он бросается на всё, что сочтёт интересным."
    source: { kind: translated, id: 440470 }
  - form: "uzna"
    pl: "Sąd uzna to za dowód."
    ru: "Суд сочтёт это доказательством."
    source: { kind: authored }
  - form: "uznać"
    pl: "Wreszcie musiano uznać jego prawa."
    ru: "Наконец пришлось признать его права."
    source: { kind: translated, id: 2310528 }
  - form: "uznać"
    pl: "Posługiwanie się ogniem można uznać za największy wynalazek człowieka."
    ru: "Использование огня можно считать величайшим изобретением человека."
    source: { kind: translated, id: 10806792 }
  - form: "uznać"
    pl: "Trudno to uznać za przypadek."
    ru: "Это трудно счесть случайностью."
    source: { kind: authored }
  - form: "uznali"
    pl: "Słyszałem że uznali ją za winną."
    ru: "Я слышал, её признали виновной."
    source: { kind: tatoeba, id: 12501747 }
  - form: "uznali"
    pl: "Przysięgli uznali mężczyznę za winnego morderstwa."
    ru: "Присяжные признали мужчину виновным в убийстве."
    source: { kind: translated, id: 7886497 }
  - form: "uznali"
    pl: "Mieszkańcy wioski uznali go za wyrozumiałego."
    ru: "Жители деревни сочли его снисходительным."
    source: { kind: translated, id: 713531 }
  - form: "uznaliśmy"
    pl: "Uznaliśmy to sprawozdanie za nieprawdziwe."
    ru: "Мы сочли этот отчёт недостоверным."
    source: { kind: translated, id: 358014 }
  - form: "uznaliśmy"
    pl: "Uznaliśmy, że rozsądne będzie nie kontyuować wycieczki."
    ru: "Мы решили, что разумнее не продолжать поездку."
    source: { kind: translated, id: 827422 }
  - form: "uznaliśmy"
    pl: "Uznaliśmy to za błąd."
    ru: "Мы сочли это ошибкой."
    source: { kind: authored }
  - form: "uznał"
    pl: "Uznał, że mądrzej jest milczeć."
    ru: "Он счёл, что умнее промолчать."
    source: { kind: translated, id: 712434 }
  - form: "uznał"
    pl: "Sędzia uznał aresztanta za winnego."
    ru: "Судья признал арестованного виновным."
    source: { kind: translated, id: 2211948 }
  - form: "uznał"
    pl: "Tom chciał zadać pytanie, ale uznał, że nie warto."
    ru: "Том хотел задать вопрос, но решил, что не стоит."
    source: { kind: tatoeba, id: 4716841 }
  - form: "uznała"
    pl: "Ostatnia osoba, której opowiedziałem mój pomysł, uznała mnie za wariata."
    ru: "Последний человек, которому я рассказал свою идею, решил, что я сумасшедший."
    source: { kind: tatoeba, id: 351497 }
  - form: "uznała"
    pl: "Ostatnia osoba, której opowiedziałem o swoim pomyśle uznała mnie za wariata."
    ru: "Последний человек, которому я рассказал о своей идее, счёл меня сумасшедшим."
    source: { kind: translated, id: 10544195 }
  - form: "uznała"
    pl: "Uznała to za komplement."
    ru: "Она сочла это комплиментом."
    source: { kind: authored }
  - form: "uznałem"
    pl: "Uznałem, że najlepiej milczeć."
    ru: "Я счёл, что лучше промолчать."
    source: { kind: translated, id: 722228 }
  - form: "uznałem"
    pl: "Uznałem twoje milczenie za zgodę."
    ru: "Я счёл твоё молчание согласием."
    source: { kind: translated, id: 1350362 }
  - form: "uznałem"
    pl: "Uznałem go za bystrego chłopaka."
    ru: "Я счёл его смышлёным парнем."
    source: { kind: translated, id: 823272 }
  - form: "uznały"
    pl: "Polska była jednym z pierwszych krajów, które uznały Republikę Turcji."
    ru: "Польша была одной из первых стран, признавших Турецкую Республику."
    source: { kind: translated, id: 921550 }
  - form: "uznały"
    pl: "Sądy uznały tę praktykę za legalną."
    ru: "Суды признали эту практику законной."
    source: { kind: authored }
  - form: "uznały"
    pl: "Obie strony uznały umowę."
    ru: "Обе стороны признали договор."
    source: { kind: authored }
  - form: "uznana"
    pl: "Dopiero kiedy ta koncepcja będzie formalnie uznana, będzie można zacząć myśleć o zmianach."
    ru: "Только когда эта концепция будет официально признана, можно будет думать об изменениях."
    source: { kind: translated, id: 2310519 }
  - form: "uznana"
    pl: "Ta metoda została uznana za skuteczną."
