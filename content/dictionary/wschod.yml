notes:
  - { kind: false-friend, text: "wschód значит и «восток», и «восход»: na wschodzie «на востоке», wschód słońca «восход солнца». Парное zachód точно так же покрывает «запад» и «закат»." }
  - { kind: government, text: "Где — na wschodzie (предложный падеж); куда — na wschód (винительный): mieszka na wschodzie, jedzie na wschód." }
  - { kind: usage, text: "Bliski Wschód «Ближний Восток» и Daleki Wschód «Дальний Восток» пишутся с прописной буквы." }
  - { kind: usage, text: "Глагол — wschodzić «восходить, всходить»: słońce wschodzi na wschodzie." }
collocations:
  - { pl: "wschód słońca", ru: "восход солнца" }
  - { pl: "na wschodzie", ru: "на востоке" }
  - { pl: "Bliski Wschód", ru: "Ближний Восток" }
family:
  - { pl: "zachód", ru: "запад, закат", relation: root, id: zachod }
  - { pl: "wschodzić", ru: "восходить, всходить", relation: root }
  - { pl: "wschodni", ru: "восточный", relation: root }
etymology: "Приставка w- + -schód от schodzić «сходить»: «то, откуда солнце всходит». Русское «восход» собрано теми же кирпичами — «воз-» и «ход»."
memory: "wschód — сразу и «восток», и «восход»: słońce wschodzi na wschodzie. Пара к нему — zachód «запад» и «закат». Куда — na wschód, где — na wschodzie."
