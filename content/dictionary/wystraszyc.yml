# review
id: wystraszyc
format: 2
lemma: "wystraszyć"
rank: 2083
pos: verb
aspect: perf
pron: { cyr: "выстра́шиць" }
senses:
  - id: frighten
    ru: "испугать, напугать"
    examples:
      - pl: "Wystraszył dziewczynkę magicznymi sztuczkami."
        ru: "Он напугал девочку фокусами."
        source: { kind: translated, id: 736895 }
      - pl: "Głos Toma mnie wystraszył."
        ru: "Голос Тома меня напугал."
        source: { kind: translated, id: 13341683 }
      - pl: "Wystraszyła go śmiertelnie."
        ru: "Она напугала его до смерти."
        source: { kind: translated, id: 832806 }
  - id: get-scared
    ru: "испугаться (wystraszyć się)"
    examples:
      - pl: "Wystraszyła się, gdy usłyszała wiadomości."
        ru: "Она испугалась, когда услышала новости."
        source: { kind: translated, id: 7970852 }
      - pl: "Dzieci wystraszyły się gromu."
        ru: "Дети испугались грома."
        source: { kind: translated, id: 701567 }
notes:
  - { kind: government, text: "Переходный: wystraszyć kogoś «напугать кого-л.», винительный. С się становится «испугаться», и тогда чего — родительный: wystraszyć się gromu." }
  - { kind: usage, text: "Причастие wystraszony «испуганный» очень частотно: wyglądał na wystraszonego «он выглядел испуганным»." }
  - { kind: false-friend, text: "Корень strach «страх» — ср. русское «страх», «страшить». Приставка wy- даёт завершённость." }
  - { kind: usage, text: "Несовершенный вид — straszyć «пугать»." }
collocations:
  - { pl: "wystraszyć kogoś", ru: "напугать кого-л." }
  - { pl: "wystraszyć się", ru: "испугаться" }
etymology: "wy- + straszyć «пугать», от strach «страх»; ср. русское «страх», «устрашить»."
memory: "wystraszyć — «напугать», совершенный вид к straszyć. С się переворачивается в «испугаться», и тогда причина стоит в родительном: wystraszyć się gromu."
idioms:
  - { pl: "wystraszyć kogoś", ru: "напугать кого-л." }
  - { pl: "wystraszyć się", ru: "испугаться" }
