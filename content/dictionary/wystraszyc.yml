formExamples:
  - form: "wystraszona"
    pl: "Wystraszona biedronka odleci z ręki, która ją trzyma."
    ru: "Испуганная божья коровка улетит с руки, которая её держит."
    source: { kind: translated, id: 12227371 }
  - form: "wystraszona"
    pl: "Była wystraszona hałasem."
    ru: "Она была напугана шумом."
    source: { kind: authored }
  - form: "wystraszona"
    pl: "Wystraszona dziewczynka zamilkła."
    ru: "Испуганная девочка замолчала."
    source: { kind: authored }
  - form: "wystraszonego"
    pl: "Mężczyzna niosący teczkę wyglądał na wystraszonego."
    ru: "Мужчина с портфелем выглядел испуганным."
    source: { kind: translated, id: 12189433 }
  - form: "wystraszonego"
    pl: "Widziałem wystraszonego psa."
    ru: "Я видел испуганную собаку."
    source: { kind: authored }
  - form: "wystraszonego"
    pl: "Nie poznałem wystraszonego chłopca."
    ru: "Я не узнал испуганного мальчика."
    source: { kind: authored }
  - form: "wystraszony"
    pl: "Tom przyznał, że był wystraszony."
    ru: "Том признал, что был напуган."
    source: { kind: translated, id: 3602841 }
  - form: "wystraszony"
    pl: "Wystraszony kot uciekł."
    ru: "Испуганный кот убежал."
    source: { kind: authored }
  - form: "wystraszony"
    pl: "Byłem wystraszony i zmęczony."
    ru: "Я был напуган и устал."
    source: { kind: authored }
  - form: "wystraszyć"
    pl: "Łatwo mnie wystraszyć."
    ru: "Меня легко напугать."
    source: { kind: translated, id: 4327727 }
  - form: "wystraszyć"
    pl: "Nie chcę wystraszyć dzieci."
    ru: "Я не хочу напугать детей."
    source: { kind: translated, id: 11443584 }
  - form: "wystraszyć"
    pl: "Nie chciałem cię wystraszyć."
    ru: "Я не хотел тебя напугать."
    source: { kind: authored }
  - form: "wystraszył"
    pl: "Wystraszył dziewczynkę magicznymi sztuczkami."
    ru: "Он напугал девочку фокусами."
    source: { kind: translated, id: 736895 }
  - form: "wystraszył"
    pl: "Głos Toma mnie wystraszył."
    ru: "Голос Тома меня напугал."
    source: { kind: translated, id: 13341683 }
  - form: "wystraszył"
    pl: "Hałas go w nocy wystraszył."
    ru: "Ночью его напугал шум."
    source: { kind: translated, id: 3899460 }
  - form: "wystraszyła"
    pl: "Wystraszyła go śmiertelnie."
    ru: "Она напугала его до смерти."
    source: { kind: translated, id: 832806 }
  - form: "wystraszyła"
    pl: "Wystraszyła napastnika głośnym krzykiem."
    ru: "Она отпугнула нападавшего громким криком."
    source: { kind: translated, id: 919931 }
  - form: "wystraszyła"
    pl: "Wystraszyła się, gdy usłyszała wiadomości."
    ru: "Она испугалась, когда услышала новости."
    source: { kind: translated, id: 7970852 }
  - form: "wystraszyłeś"
    pl: "Prawdopodobnie wystraszyłeś Toma."
    ru: "Ты, вероятно, напугал Тома."
    source: { kind: translated, id: 3686920 }
  - form: "wystraszyłeś"
    pl: "Wystraszyłeś mnie!"
    ru: "Ты меня напугал!"
    source: { kind: authored }
  - form: "wystraszyłeś"
    pl: "Wystraszyłeś wszystkich gości."
    ru: "Ты напугал всех гостей."
    source: { kind: authored }
  - form: "wystraszyło"
    pl: "Sądzę, że coś go wystraszyło."
    ru: "Думаю, что-то его напугало."
    source: { kind: translated, id: 4328247 }
  - form: "wystraszyło"
    pl: "Wystraszyło mnie to na śmierć."
    ru: "Это напугало меня до смерти."
    source: { kind: translated, id: 13661871 }
  - form: "wystraszyło"
    pl: "Wystraszyło nas nagłe światło."
    ru: "Нас напугал внезапный свет."
    source: { kind: authored }
  - form: "wystraszyły"
    pl: "Dzieci wystraszyły się gromu."
    ru: "Дети испугались грома."
    source: { kind: translated, id: 701567 }
  - form: "wystraszyły"
    pl: "Odgłosy dochodzące z dżungli wystraszyły badaczy."
    ru: "Звуки из джунглей напугали исследователей."
    source: { kind: translated, id: 2679473 }
  - form: "wystraszyły"
    pl: "Konie wystraszyły się burzy."
    ru: "Кони испугались грозы."
    source: { kind: authored }
  - form: "wystraszysz"
    pl: "Nie rób hałasu, bo wystraszysz ptactwo."
    ru: "Не шуми, а то распугаешь птиц."
    source: { kind: translated, id: 12188828 }
  - form: "wystraszysz"
    pl: "Wystraszysz dziecko tym krzykiem."
    ru: "Ты напугаешь ребёнка этим криком."
    source: { kind: authored }
  - form: "wystraszysz"
    pl: "Nikogo tym nie wystraszysz."
    ru: "Этим ты никого не напугаешь."
    source: { kind: authored }
