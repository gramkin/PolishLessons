notes:
  - { kind: false-friend, text: "OBWÓD — то, что «обводит» предмет кругом: окружность, обхват. OBWÓD W PASIE — обхват талии, OBWÓD KOŁA — длина окружности. В электрике это цепь: OBWÓD ELEKTRYCZNY. А OBWODNICA, от того же корня, — объездная дорога вокруг города: JEDŹ OBWODNICĄ — «поезжай по объездной»." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Ó в корне чередуется с O: OBWÓD, но OBWODU, OBWODZIE, как OGRÓD и OGRODU. В местном падеже D смягчается в DZ: W OBWODZIE." }
  - { kind: government, text: "В обхвате — W OBWODZIE, местный: DRZEWO MA DWA METRY W OBWODZIE. Обхват чего-то — OBWÓD CZEGOŚ, родительный. Ехать по объездной — JECHAĆ OBWODNICĄ, творительный." }
  - { kind: pronunciation, text: "Читается «о́бвут», два слога, ударение на первом. Ó — «у», конечное D оглушается в «т», как в OGRÓD «о́грут». В форме OBWODZIE: «обво́дзе»." }
collocations:
  - { pl: "obwód koła", ru: "длина окружности" }
  - { pl: "obwód w pasie", ru: "обхват талии" }
  - { pl: "obwód elektryczny", ru: "электрическая цепь" }
family:
  - { pl: "obwieść", ru: "обвести", relation: root }
  - { pl: "obwodnica", ru: "объездная дорога", relation: derived }
  - { pl: "obwodowy", ru: "окружной; периферический", relation: derived }
etymology: "От OBWIEŚĆ, OBWODZIĆ «обвести»: приставка OB- и корень того же глагола, что русское «водить». Так OBWÓD — «то, чем обведено», а OBWODNICA — «дорога, которой объезжают»."
memory: "Obwód — окружность, обхват; в электрике — цепь. Читается «о́бвут». Obwód w pasie — обхват талии. Obwodnica — объездная дорога. Obwód wyborczy — избирательный участок."
idioms:
  - { pl: "obwód wyborczy", ru: "избирательный участок" }
  - { pl: "zamknąć obwód", ru: "замкнуть цепь" }
