# review
id: wiele
format: 2
lemma: "wiele"
rank: 162
pos: num
pron: { cyr: "ве́ле" }
senses:
  - id: many
    ru: "много, многие (+ родительный падеж)"
    examples:
      - pl: "Mam wiele książek."
        ru: "У меня много книг."
        source: { kind: tatoeba, id: 2184599 }
      - pl: "Masz wiele problemów."
        ru: "У тебя много проблем."
        source: { kind: tatoeba, id: 12719875 }
      - pl: "Ma wiele zainteresowań."
        ru: "У него много увлечений."
        source: { kind: tatoeba, id: 2146673 }
  - id: many-people
    ru: "wielu — много (о лицах мужского пола)"
    note: "О мужчинах и смешанных группах — wielu: wielu ludzi, wielu przyjaciół."
    examples:
      - pl: "Masz wielu przyjaciół?"
        ru: "У тебя много друзей?"
        source: { kind: tatoeba, id: 982801 }
      - pl: "Tom miał wielu wrogów."
        ru: "У Тома было много врагов."
        source: { kind: tatoeba, id: 4716968 }
      - pl: "Tomasz ma wielu fanów."
        ru: "У Тома много фанатов."
        source: { kind: tatoeba, id: 12955514 }
notes:
  - { kind: government, text: "wiele требует родительного падежа: wiele książek, wiele czasu — как русское «много книг»." }
  - { kind: usage, text: "wiele книжнее, dużo разговорнее; о мужских лицах употребляется форма wielu." }
  - { kind: usage, text: "o wiele значит «намного»: o wiele lepiej «намного лучше»." }
collocations:
  - { pl: "o wiele", ru: "намного" }
  - { pl: "wiele razy", ru: "много раз" }
  - { pl: "wielu ludzi", ru: "много людей" }
  - { pl: "tak wiele", ru: "так много" }
etymology: "Праславянское *velь, тот же корень, что в wielki «великий»; русское «много» образовано иначе, но «велий, великий» — родня."
memory: "wiele + родительный падеж, а о мужчинах — wielu: wiele książek, но wielu ludzi. И запомните o wiele «намного»."
idioms:
  - { pl: "o wiele lepiej", ru: "намного лучше" }
  - { pl: "wiele hałasu o nic", ru: "много шума из ничего" }
  - { pl: "pozostawiać wiele do życzenia", ru: "оставлять желать лучшего" }
formExamplesSkip:
  - { form: "wiela", reason: "форма из морфологического словаря; в языке употребляются только wiele, wielu и wieloma" }
  - { form: "wielą", reason: "форма из морфологического словаря; в языке употребляются только wiele, wielu и wieloma" }
  - { form: "wielo", reason: "форма из морфологического словаря; в языке употребляются только wiele, wielu и wieloma" }
