collocations:
  - { pl: "agencja reklamowa", ru: "рекламное агентство" }
  - { pl: "agencja prasowa", ru: "информационное агентство" }
  - { pl: "pracować w agencji", ru: "работать в агентстве" }
etymology: "Из латинского agere «делать, действовать» через agens «действующий». Русское «агентство» пришло от того же корня, поэтому слова узнаются сразу."
memory: "agencja — «агентство»: agencja reklamowa, agencja prasowa. Работать в агентстве — pracować w agencji, предложный падеж."
idioms:
  - { pl: "agencja reklamowa", ru: "рекламное агентство" }
  - { pl: "agencja prasowa", ru: "информационное агентство" }
  - { pl: "agencja pracy", ru: "кадровое агентство" }
formExamplesSkip:
