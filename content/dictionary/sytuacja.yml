# review
id: sytuacja
format: 2
lemma: "sytuacja"
rank: 509
pos: noun
pron: { cyr: "сытуа́цья" }
senses:
  - id: situation
    ru: "ситуация, положение"
    examples:
      - pl: "Sytuacja jest poważna."
        ru: "Ситуация серьёзная."
        source: { kind: translated, id: 1448108 }
      - pl: "Nie mogę narzekać na swoją sytuację."
        ru: "Я не могу жаловаться на свою ситуацию."
        source: { kind: tatoeba, id: 6137524 }
      - pl: "W takiej sytuacji bardzo trudno zachować twarz."
        ru: "В такой ситуации очень трудно сохранить лицо."
        source: { kind: tatoeba, id: 13784967 }
  - id: circumstances
    ru: "обстоятельства, условия"
    examples:
      - pl: "Humor czasem pomaga w takich sytuacjach."
        ru: "Юмор иногда помогает в таких ситуациях."
        source: { kind: tatoeba, id: 3743933 }
      - pl: "W takich sytuacjach najlepiej zachować spokój."
        ru: "В таких ситуациях лучше всего сохранять спокойствие."
        source: { kind: translated, id: 982389 }
      - pl: "On nie umie sobie radzić z trudnymi sytuacjami."
        ru: "Он не умеет справляться с трудными ситуациями."
        source: { kind: translated, id: 355888 }
notes:
  - { kind: usage, text: "Запомните общее правило: польскому -cja отвечает русское -ция. sytuacja — ситуация, informacja — информация, stacja — станция, lekcja — лекция." }
  - { kind: usage, text: "Ударение в польском всегда на предпоследнем слоге: sytuAcja, sytuAcji. В русском — на «а» в середине, так что место ударения совпадает не всегда." }
  - { kind: usage, text: "Частые обороты: w tej sytuacji «при таком положении дел», pan sytuacji «хозяин положения», sytuacja patowa «патовая ситуация»." }
  - { kind: usage, text: "Звательная форма sytuacjo существует, но встречается только в книжной и риторической речи." }
collocations:
  - { pl: "trudna sytuacja", ru: "трудная ситуация" }
  - { pl: "w tej sytuacji", ru: "при таком положении" }
  - { pl: "pan sytuacji", ru: "хозяин положения" }
  - { pl: "sytuacja patowa", ru: "патовая ситуация" }
etymology: "Латинское situatio «расположение», от situs «место»; в польский пришло через французский и немецкий. Русское «ситуация» — то же самое заимствование."
memory: "sytuacja — «ситуация», и это слово удобно тем, что открывает целое правило: польское -cja отвечает русскому -ция. sytuacja — ситуация, informacja — информация, stacja — станция, lekcja — лекция, policja — полиция. Запомните пару оборотов: w tej sytuacji «при таком положении дел» и pan sytuacji «хозяин положения»."
idioms:
  - { pl: "sytuacja patowa", ru: "патовая ситуация" }
  - { pl: "pan sytuacji", ru: "хозяин положения" }
  - { pl: "w tej sytuacji", ru: "при таком положении дел" }
formExamplesSkip:
  - { form: "sytuacyj", reason: "архаичная форма родительного множественного: в современном языке используется sytuacji, примеров в корпусе нет" }
