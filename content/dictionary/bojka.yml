etymology: "От BÓJ «бой», и далее от BIĆ «бить», из праславянского *bojь и *biti — того же корня, что русские «бой», «бить», «боец», «побоище». Суффикс -KA здесь уменьшительно-конкретизирующий: BÓJ есть бой как событие крупное, военное, а BÓJKA — его бытовой, мелкий вариант, драка. Русский от того же корня построил «драку» иначе, от «драть», и потому соответствия в словах нет, хотя понятие одно. Зато внутри польского гнездо держится прозрачно и широко: BIĆ, BÓJ, BÓJKA, BOISKO, POBICIE, и чередование I и Ó в нём то же, что в парах PIĆ и NAPÓJ, WIĆ и ROZWÓJ."
memory: "Не «бойка»! bójka — это драка, читается «бу́йка», ó даёт «у». Корень тот же, что в bić и bój, и к нему же относится boisko «место, где бьют». В законе bójka противопоставлена pobicie: в драке бьют все, при побоях — одна сторона. В дательном и местном k переходит в c: w bójce."
