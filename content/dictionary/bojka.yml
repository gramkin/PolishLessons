notes:
  - { kind: false-friend, text: "Русская «бойка» и польская BÓJKA — не одно и то же, хотя корень общий. BÓJKA значит «драка, потасовка»: двое или больше бьют друг друга. Русское слово «бойка» в обиходной речи почти не употребляется, а где употребляется, значит совсем другое — например, бойку масла. Русский перевод здесь только «драка». Зато корень узнаётся сразу: BIĆ «бить», BÓJ «бой», BÓJKA «драка», и к тому же гнезду принадлежит BOISKO «игровая площадка», карточка которого объясняет, что это буквально «место, где бьют». Три слова от одного корня, и все три о разном." }
  - { kind: usage, text: "В юридическом языке слово точное и противопоставлено другому: BÓJKA есть схватка, в которой все участники и бьют, и получают, а POBICIE — нападение, где одна сторона бьёт, а другая только терпит. Кодекс различает их, и наказание разное. В обиходной речи этого различения не делают. Устойчивые сочетания: WDAĆ SIĘ W BÓJKĘ «ввязаться в драку», UDZIAŁ W BÓJCE «участие в драке», DOSZŁO DO BÓJKI «дело дошло до драки»." }
  - { kind: pronunciation, text: "Читается «бу́йка», ударение на первом слоге из двух. Буква Ó даёт «у», поэтому не «бойка», а «бу́йка» — и это сразу отделяет слово от русского созвучия. В дательном и местном падеже BÓJCE согласная K переходит в C: «бу́йце». Это то же чередование, что в CZWÓRKA и CZWÓRCE, ODZNAKA и ODZNACE. В родительном множественного BÓJEK появляется вставная гласная E, как в DESKA и DESEK." }
  - { kind: government, text: "Женский род на -A, склонение правильное. Винительный на -Ę: WDAŁ SIĘ W BÓJKĘ, с предлогом W и винительным. Участие в драке — предлог W с местным: UDZIAŁ W BÓJCE. Начало события описывается безличным DOSZŁO DO с родительным: DOSZŁO DO BÓJKI «произошла драка», и этот оборот в польской прессе стандартен для любых происшествий. При отрицании винительный уходит в родительный: NIE wdał się w BÓJKI." }
