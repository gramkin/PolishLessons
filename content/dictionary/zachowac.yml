# review
id: zachowac
format: 2
lemma: "zachować"
rank: 670
pos: verb
aspect: perf
pron: { cyr: "захо́ваць" }
senses:
  - id: behave
    ru: "zachować się — вести себя"
    note: "Русский берёт здесь другой глагол."
    examples:
      - pl: "Wspaniale się zachował."
        ru: "Он прекрасно себя вёл."
        source: { kind: translated, id: 358814 }
      - pl: "Zachował się głupio."
        ru: "Он повёл себя глупо."
        source: { kind: translated, id: 2417194 }
      - pl: "Zachowała się dość głupio."
        ru: "Она повела себя довольно глупо."
        source: { kind: translated, id: 440653 }
  - id: keep
    ru: "сохранить (спокойствие, тайну, лицо)"
    examples:
      - pl: "Musimy zachować spokój."
        ru: "Мы должны сохранять спокойствие."
        source: { kind: tatoeba, id: 3049815 }
      - pl: "Tom po prostu próbuje zachować twarz."
        ru: "Том просто пытается сохранить лицо."
        source: { kind: tatoeba, id: 7053931 }
      - pl: "Zachowaj tajemnicę."
        ru: "Сохрани тайну."
        source: { kind: translated, id: 10606391 }
  - id: behaviour
    ru: "zachowanie — поведение"
    note: "Существительное значит именно «поведение», а не «сохранение»."
    examples:
      - pl: "Jego zachowanie było dziwne i niepokojące."
        ru: "Его поведение было странным и беспокойным."
        source: { kind: tatoeba, id: 3744913 }
      - pl: "Musisz poprawić swoje zachowanie."
        ru: "Тебе надо исправить своё поведение."
        source: { kind: translated, id: 366240 }
      - pl: "Syn wstydzi się swego zachowania."
        ru: "Сын стыдится своего поведения."
        source: { kind: translated, id: 734296 }
  - id: preserved
    ru: "zachowany — сохранившийся"
    examples:
      - pl: "W jego labolatorium było zachowanych ponad tysiąc notatników."
        ru: "В его лаборатории сохранилось больше тысячи тетрадей."
        source: { kind: translated, id: 676716 }
      - pl: "Rękopis zachowany w całości trafił do muzeum."
        ru: "Рукопись, сохранившаяся целиком, попала в музей."
        source: { kind: authored }
      - pl: "Zamek jest dobrze zachowany."
        ru: "Замок хорошо сохранился."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Два главных значения, которые русский разводит на разные глаголы. Без się — «сохранить»: zachować spokój, zachować twarz «сохранить лицо», zachować tajemnicę. С się — «вести себя»: zachował się głupio «он повёл себя глупо»." }
  - { kind: usage, text: "Отглагольное существительное zachowanie значит именно «поведение»: Jego zachowanie było dziwne, popraw swoje zachowanie. «Сохранение» будет zachowanie czegoś только в специальном контексте." }
  - { kind: usage, text: "Несовершенный вид — zachowywać: zachowywał spokój do końca." }
  - { kind: usage, text: "Страдательное zachowany значит «сохранившийся»: zachowany w dobrym stanie." }
collocations:
  - { pl: "zachować spokój", ru: "сохранять спокойствие" }
  - { pl: "zachować twarz", ru: "сохранить лицо" }
  - { pl: "zachować się źle", ru: "плохо себя вести" }
  - { pl: "zachowanie", ru: "поведение" }
family:
  - { pl: "zachowywać", ru: "сохранять", relation: aspect }
  - { pl: "chować", ru: "прятать, хранить", relation: root }
  - { pl: "zachowanie", ru: "поведение", relation: derived }
etymology: "Приставка za- плюс chować «прятать, хранить», праславянское *chovati — то же гнездо, что русские «ховать», «хоронить» и «сохранить»."
memory: "zachować работает двояко, и русский разводит эти смыслы на разные глаголы. Без się это «сохранить»: zachować spokój, zachować twarz, zachować tajemnicę. А с się — «вести себя»: zachował się głupio «повёл себя глупо», wspaniale się zachował. Отсюда и существительное: zachowanie — это «поведение», а не «сохранение». Несовершенный вид — zachowywać."
idioms:
  - { pl: "zachować spokój", ru: "сохранять спокойствие" }
  - { pl: "zachować twarz", ru: "сохранить лицо" }
  - { pl: "zachować się źle", ru: "плохо себя вести" }
