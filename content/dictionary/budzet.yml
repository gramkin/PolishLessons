notes:
  - { kind: false-friend, text: "BUDŻET — «бюджет», но без «ю»: пишется BUDŻET и читается «бу́джэт». Русское «бюджетник» по-польски — PRACOWNIK BUDŻETÓWKI или PRACOWNIK SFERY BUDŻETOWEJ." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Родительный — BUDŻETU, в местном T переходит в C: W BUDŻECIE." }
  - { kind: government, text: "Бюджет на что-то — BUDŻET NA COŚ, NA с винительным: BUDŻET NA REKLAMĘ. Уложиться в бюджет — ZMIEŚCIĆ SIĘ W BUDŻECIE, W с местным." }
  - { kind: pronunciation, text: "Читается «бу́джэт», ударение на первом слоге. DŻ — один звук, твёрдое «дж», и E после него тоже твёрдое: «джэ»." }
collocations:
