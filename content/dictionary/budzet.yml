etymology: "Из английского, а туда — из французского слова со значением «кошелёк, сумочка». Русское «бюджет» пришло из того же источника, но через французское произношение."
memory: "Budżet — бюджет, читается «бу́джэт», без «ю». Zmieścić się w budżecie — уложиться в бюджет. Budżet na wakacje — деньги на отпуск."
