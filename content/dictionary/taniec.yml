# review
id: taniec
format: 2
lemma: "taniec"
rank: 1370
pos: noun
pron: { cyr: "та́нец" }
senses:
  - id: dance
    ru: "танец (как действие и как искусство)"
    examples:
      - pl: "Pojechała do Los Angeles, żeby uczyć się tańca."
        ru: "Она уехала в Лос-Анджелес учиться танцевать."
        source: { kind: tatoeba, id: 525389 }
      - pl: "Taniec to jest moje hobby."
        ru: "Танец — моё хобби."
        source: { kind: translated, id: 880272 }
      - pl: "Moim ulubionym tańcem jest tango."
        ru: "Мой любимый танец — танго."
        source: { kind: translated, id: 457399 }
  - id: dance-party
    ru: "во множественном числе — танцы, танцевальный вечер"
    examples:
      - pl: "W piątek będą tańce."
        ru: "В пятницу будут танцы."
        source: { kind: translated, id: 915036 }
      - pl: "Ona lubi chodzić ze znajomymi na tańce."
        ru: "Она любит ходить с друзьями на танцы."
        source: { kind: translated, id: 836952 }
notes:
  - { kind: usage, text: "Беглое e: оно есть только в именительном и винительном единственного числа — taniec, но tańca, tańcowi, tańcem, w tańcu. Так же ведёт себя ojciec — ojca." }
  - { kind: usage, text: "Множественное tańce чаще значит не «танцы» как жанр, а «танцевальный вечер»: iść na tańce «пойти на танцы», W piątek będą tańce." }
  - { kind: usage, text: "Соседи по гнезду: tańczyć «танцевать», tancerz и tancerka «танцор, танцовщица», taneczny «танцевальный»." }
  - { kind: pronunciation, text: "В косвенных формах ń смягчает: tańca читается «та́ньца», w tańcu — «в та́ньцу»." }
collocations:
  - { pl: "lekcje tańca", ru: "уроки танцев" }
  - { pl: "iść na tańce", ru: "пойти на танцы" }
  - { pl: "taniec ludowy", ru: "народный танец" }
etymology: "Из немецкого Tanz, пришедшего в польский через чешское посредство; русское «танец» — то же самое германское слово, взятое через польский. Поэтому корни совпадают буквально."
memory: "taniec — «танец», но e беглое: taniec, а дальше tańca, tańcem, w tańcu — ровно как ojciec и ojca. И помните, что множественное tańce чаще всего значит «танцевальный вечер»: idziemy na tańce «идём на танцы»."
idioms:
  - { pl: "do tańca i do różańca", ru: "и швец, и жнец, и на дуде игрец" }
  - { pl: "taniec świętego Wita", ru: "пляска святого Витта" }
  - { pl: "taniec śmierci", ru: "пляска смерти" }
