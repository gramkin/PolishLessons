# review
id: potezny
format: 2
lemma: "potężny"
rank: 1960
pos: adj
pron: { cyr: "потэ́нжны" }
senses:
  - id: powerful
    ru: "могучий, мощный"
    examples:
      - pl: "Jest potężny."
        ru: "Он могуч."
        source: { kind: translated, id: 10605224 }
      - pl: "Był bogaty. Był potężny. Był królem."
        ru: "Он был богат. Он был могуч. Он был королём."
        source: { kind: translated, id: 2916809 }
      - pl: "Jesteśmy potężni."
        ru: "Мы могучи."
        source: { kind: translated, id: 11661475 }
      - pl: "Japonia stała się potężnym narodem."
        ru: "Япония стала могучим государством."
        source: { kind: translated, id: 3084456 }
      - pl: "Wyobraźnia jest bardzo potężnym narzędziem."
        ru: "Воображение — очень мощный инструмент."
        source: { kind: translated, id: 4436808 }
      - pl: "Mamy potężne narzędzie."
        ru: "У нас мощный инструмент."
        source: { kind: translated, id: 3100407 }
  - id: huge
    ru: "огромный, громадный"
    examples:
      - pl: "Zbliża się potężny tajfun."
        ru: "Приближается мощный тайфун."
        source: { kind: translated, id: 652417 }
      - pl: "Burza przewróciła potężne drzewo."
        ru: "Буря повалила огромное дерево."
        source: { kind: translated, id: 739249 }
      - pl: "To trzęsienie ziemi wywołało potężne tsunami."
        ru: "Это землетрясение вызвало огромное цунами."
        source: { kind: translated, id: 368903 }
notes:
  - { kind: usage, text: "Рядом с карточками silny и mocny: silny — сильный физически, mocny — крепкий, potężny — могучий, внушительный по размеру или влиянию." }
  - { kind: usage, text: "Сравнительная степень — potężniejszy, превосходная — najpotężniejszy «самый могущественный»." }
  - { kind: usage, text: "Часто о стихиях и явлениях: potężne trzęsienie ziemi «мощное землетрясение», potężna burza «сильная гроза»." }
collocations:
  - { pl: "potężny tajfun", ru: "мощный тайфун" }
  - { pl: "potężne trzęsienie ziemi", ru: "мощное землетрясение" }
  - { pl: "najpotężniejszy", ru: "самый могущественный" }
etymology: "От potęga «мощь, могущество», в основе — moc «сила». Русское «могучий» и польское potężny идут от одного праславянского корня *mog-, но через разные производные."
memory: "potężny — «могучий, мощный»: potężny tajfun, potężne trzęsienie ziemi. Сильнее, чем silny «сильный» и mocny «крепкий»."
