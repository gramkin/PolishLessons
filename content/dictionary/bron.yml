# review
id: bron
format: 2
lemma: "broń"
rank: 417
pos: noun
pron: { cyr: "бронь" }
senses:
  - id: weapon
    ru: "оружие"
    examples:
      - pl: "Karate to sztuka walki bez broni."
        ru: "Карате — это боевое искусство без оружия."
        source: { kind: translated, id: 1355012 }
      - pl: "Nie mam broni."
        ru: "У меня нет оружия."
        source: { kind: authored }
      - pl: "Policja znalazła broń."
        ru: "Полиция нашла оружие."
        source: { kind: authored }
  - id: figurative
    ru: "оружие (в переносном смысле)"
    examples:
      - pl: "Moją bronią jest ironia i sarkazm."
        ru: "Моё оружие - ирония и сарказм."
        source: { kind: tatoeba, id: 13430350 }
      - pl: "Śmiech to najlepsza broń."
        ru: "Смех — лучшее оружие."
        source: { kind: authored }
      - pl: "Słowo bywa ostrą bronią."
        ru: "Слово бывает острым оружием."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "broń — это не «броня», а «оружие». Корень общий («бороться»), но значения разошлись: у поляков это то, чем нападают, у русских — то, чем защищаются." }
  - { kind: false-friend, text: "Форма broń — ещё и повелительное наклонение глагола bronić «защищать». Broń palna — «огнестрельное оружие», а Broń się! — «Защищайся!». Различает только контекст." }
  - { kind: usage, text: "Слово женского рода и склоняется как kość: broń, broni, bronią. Множественное число bronie употребляется о видах оружия." }
  - { kind: usage, text: "Broń Boże! — «Боже упаси!». Здесь broń всё-таки глагол: буквально «защити, Боже»." }
collocations:
  - { pl: "broń palna", ru: "огнестрельное оружие" }
  - { pl: "nosić broń", ru: "носить оружие" }
  - { pl: "bez broni", ru: "без оружия" }
  - { pl: "Broń Boże!", ru: "Боже упаси!" }
etymology: "Праславянское *borňь от *borti «бороться». Русское «броня» — то же самое слово, но значения разошлись: у поляков это то, чем нападают, у русских — то, чем защищаются."
memory: "broń — «оружие», а не «броня», хотя слово одно и то же: общий корень «бороться». И держите в голове второго жильца этой формы: Broń! от bronić значит «Защищай!». Отсюда же Broń Boże! — «Боже упаси!»."
idioms:
  - { pl: "złożyć broń", ru: "сложить оружие, сдаться" }
  - { pl: "do broni!", ru: "к оружию!" }
  - { pl: "Broń Boże!", ru: "Боже упаси!" }
