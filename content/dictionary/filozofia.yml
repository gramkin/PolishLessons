etymology: "Из греческого: «любовь к мудрости». Польский передаёт греческое С как Z, поэтому FILOZOFIA, но ударение, как и в русском, на предпоследнем."
memory: "Filozofia — философия, с Z: «филозо́фья». To żadna filozofia — дело нехитрое. Egzamin z filozofii — экзамен по философии."
