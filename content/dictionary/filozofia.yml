notes:
  - { kind: false-friend, text: "FILOZOFIA — «философия», но с Z: «филозо́фья». Разговорное TO ŻADNA FILOZOFIA значит «невелика премудрость, дело нехитрое». Философ — FILOZOF." }
  - { kind: usage, text: "Восемь живых форм, женский род на -IA. Родительный, дательный и местный — FILOZOFII. Во множественном — о разных учениях: FILOZOFIE WSCHODU. Архаичная форма FILOZOFIJ и звательный не даются." }
  - { kind: government, text: "Изучать философию — STUDIOWAĆ FILOZOFIĘ, винительный. Книга по философии — KSIĄŻKA Z FILOZOFII, Z с родительным, где в русском «по» с дательным. Философия жизни — FILOZOFIA ŻYCIA." }
  - { kind: pronunciation, text: "Читается «филозо́фья», ударение на предпоследнем слоге. Z вместо русского «с», FIA — «фья»." }
