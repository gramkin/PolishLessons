# review
id: list
format: 2
lemma: "list"
rank: 1108
pos: noun
pron: { cyr: "лист" }
senses:
  - id: letter
    ru: "письмо"
    examples:
      - pl: "Czytam list."
        ru: "Я читаю письмо."
        source: { kind: tatoeba, id: 12655232 }
      - pl: "Napisałem list."
        ru: "Я написал письмо."
        source: { kind: tatoeba, id: 2146669 }
      - pl: "Muszę napisać list."
        ru: "Мне надо написать письмо."
        source: { kind: tatoeba, id: 529750 }
  - id: write
    ru: "писать, отправлять письма"
    examples:
      - pl: "Kto napisał te dwa listy?"
        ru: "Кто написал эти два письма?"
        source: { kind: tatoeba, id: 588396 }
      - pl: "Nie pisz do mnie takich długich listów."
        ru: "Не пиши мне таких длинных писем."
        source: { kind: tatoeba, id: 1783757 }
  - id: kinds
    ru: "виды писем: list polecony, list gończy"
    examples:
      - pl: "Wysłałem list polecony."
        ru: "Я отправил заказное письмо."
        source: { kind: authored }
      - pl: "Za nim rozesłano list gończy."
        ru: "За ним разослали ориентировку."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "list значит только «письмо». Лист бумаги — это kartka, лист дерева — liść, а список — lista. Четыре разных слова там, где русский обходится двумя." }
  - { kind: usage, text: "Часть форм совпадает со словом lista «список»: listy это и «письма» (от list), и «списка» (от lista); listach и listami общие для обоих. Различает только контекст." }
  - { kind: usage, text: "Мужской род неодушевлённый: ten list, tego listu, tym listem." }
  - { kind: usage, text: "Устойчивые виды: list polecony «заказное письмо», list gończy «ориентировка на розыск», list motywacyjny «сопроводительное письмо»." }
collocations:
  - { pl: "napisać list", ru: "написать письмо" }
  - { pl: "wysłać list", ru: "отправить письмо" }
  - { pl: "list polecony", ru: "заказное письмо" }
  - { pl: "list gończy", ru: "ориентировка" }
family:
  - { pl: "listonosz", ru: "почтальон", relation: derived }
  - { pl: "listowny", ru: "письменный", relation: derived }
etymology: "Праславянское *listъ «лист» — то же слово, что русский «лист». Значение «письмо» выросло из «листа бумаги», а сам лист дерева получил отдельное слово liść. Русский пошёл другим путём: «письмо» от «писать»."
memory: "list — это «письмо», а не «лист». Лист бумаги будет kartka, лист дерева — liść, а список — lista. И помните про совпадение форм: listy это и «письма», и «списка»."
idioms:
  - { pl: "list polecony", ru: "заказное письмо" }
  - { pl: "list gończy", ru: "ориентировка, розыск" }
  - { pl: "napisać list", ru: "написать письмо" }
