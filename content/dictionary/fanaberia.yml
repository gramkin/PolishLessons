notes:
  - { kind: false-friend, text: "В русском есть разговорное «фанаберия» — «спесь, чванство». Польское FANABERIA — не спесь, а каприз, прихоть: TO NIE FANABERIA «это не прихоть»." }
  - { kind: register, text: "Слово разговорное, с иронией или осуждением. Часто во множественном: MIEĆ FANABERIE «капризничать, иметь причуды»." }
  - { kind: usage, text: "Женский род на -IA: родительный, дательный и местный — FANABERII (два I). Звательный FANABERIO и устаревший родительный множественного FANABERYJ не употребляются." }
collocations:
