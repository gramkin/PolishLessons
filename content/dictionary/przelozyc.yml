notes:
  - { kind: usage, text: "Три значения на один глагол, и русскому все три знакомы — только по разным словам. Первое буквальное: PRZEŁOŻYĆ KSIĄŻKI — «переложить книги». Второе о времени: PRZEŁOŻYĆ SPOTKANIE NA PIĄTEK — «перенести встречу на пятницу», и здесь русский берёт уже «перенести», а не «переложить». Третье книжное: PRZEŁOŻYĆ NA POLSKI — «перевести на польский», хотя в живой речи чаще говорят TŁUMACZYĆ. Отсюда и существительное PRZEKŁAD «перевод», рядом с TŁUMACZENIE." }
  - { kind: false-friend, text: "Страдательное причастие застыло как название должности, и прочитать его по-русски буквально — верный способ ошибиться. PRZEŁOŻONY значит «начальник, руководитель»: MÓJ PRZEŁOŻONY KAZAŁ MI ZOSTAĆ — «мой начальник велел мне остаться». Русский глаз читает «переложенный», а речь о том, кто «поставлен над», ровно как русское «начальник» от «начало». Женская форма PRZEŁOŻONA — «настоятельница» в монастыре или «заведующая». Причастие в прямом смысле при этом тоже живо: KSIĄŻKI PRZEŁOŻONE NA PÓŁKĘ." }
  - { kind: pronunciation, text: "Повелительное PRZEŁÓŻ показывает польскую мену гласной в чистом виде. Берём третье лицо PRZEŁOŻY, отбрасываем -y, остаётся PRZEŁOŻ — и слог закрывается, а в закрытом слоге o удлиняется в ó: PRZEŁÓŻ. То же в PRZEŁÓŻMY и PRZEŁÓŻCIE. Эта мена уже встречалась в словаре у ROBI при RÓB, у WZÓR при WZORU и у PODWIÓZŁ при PODWIOZŁA. А во всех формах, где за ż идёт гласная, стоит обычное o: PRZEŁOŻYŁ, PRZEŁOŻONY, PRZEŁOŻENIE." }
  - { kind: government, text: "Для перемещения — предлог направления: PRZEŁOŻYĆ COŚ NA COŚ или DO CZEGOŚ, przełożyć na półkę, przełożyć do teczki. Для времени — только NA с винительным: PRZEŁOŻYĆ NA PIĄTEK, PRZEŁOŻYĆ NA PÓŹNIEJ. Можно и о сроке: PRZEŁOŻONO O TYDZIEŃ «перенесли на неделю», и здесь польский берёт O с винительным там, где русский берёт «на». Для перевода — NA с названием языка: NA POLSKI, NA ROSYJSKI. Несовершенная пара — PRZEKŁADAĆ." }
collocations:
  - { pl: "przełożyć spotkanie", ru: "перенести встречу" }
