etymology: "Приставка prze- и ŁOŻYĆ, старая многократная форма от KŁAŚĆ «класть», из праславянского *ложити — то же, что русское «ложить» в «переложить», «положить», «отложить». Соответствие с русским полное по частям: prze- это «пере-», -łożyć это «-ложить». Гнездо большое: PRZEKŁAD «перевод», PRZEŁOŻONY «начальник», ODŁOŻYĆ «отложить», POŁOŻYĆ «положить», ZAŁOŻYĆ «основать». Значение «перевести» выросло из «переложить на другой язык», и русское «переложение» о вольном переводе сохранило ту же картинку."
memory: "prze- плюс -łożyć: «переложить» часть за частью. Но przełożyć spotkanie — это «перенести», а przełożony — не «переложенный», а «начальник»."
idioms:
