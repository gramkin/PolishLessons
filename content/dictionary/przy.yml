# review
id: przy
format: 2
lemma: "przy"
rank: 166
pos: prep
pron: { cyr: "пши" }
senses:
  - id: near
    ru: "у, возле, рядом с (+ предложный падеж)"
    examples:
      - pl: "To drzewo rośnie przy jej domu."
        ru: "Это дерево растёт рядом с её домом."
        source: { kind: tatoeba, id: 2176465 }
      - pl: "Zawsze mam przy sobie butelkę wody mineralnej."
        ru: "У меня всегда с собой бутылка минеральной воды."
        source: { kind: tatoeba, id: 5397986 }
      - pl: "Co oznacza wykrzyknik przy zdaniach?"
        ru: "Что обозначает восклицательный знак возле предложений?"
        source: { kind: tatoeba, id: 4450371 }
  - id: during
    ru: "при (об обстоятельствах и условиях)"
    examples:
      - pl: "Przy produkcji papieru zużywa się dużo drewna."
        ru: "При изготовлении бумаги используется много древесины."
        source: { kind: tatoeba, id: 768717 }
      - pl: "Nauczyciel powiedział nam, że woda wrze przy 100 stopniach."
        ru: "Наш учитель сказал, что вода кипит при ста градусах по Цельсию."
        source: { kind: tatoeba, id: 362839 }
      - pl: "Zaproponowałem jej pomoc przy pracy domowej."
        ru: "Я предложил помочь ей с домашними заданиями."
        source: { kind: tatoeba, id: 959784 }
notes:
  - { kind: government, text: "przy требует предложного падежа — как русское «при»: przy oknie, przy stole, przy mnie." }
  - { kind: usage, text: "Перевод зависит от контекста: przy oknie «у окна», przy stole «за столом», przy mnie «при мне», przy pracy «за работой»." }
  - { kind: usage, text: "przy okazji значит «кстати, заодно»; przy tym — «при этом»." }
collocations:
  - { pl: "przy okazji", ru: "кстати" }
  - { pl: "przy stole", ru: "за столом" }
  - { pl: "przy sobie", ru: "при себе" }
  - { pl: "przy tym", ru: "при этом" }
etymology: "Праславянское *pri — то же слово, что русское «при»; совпадает и падеж, и основное значение."
memory: "przy + предложный, как русское «при». Но переводится по-разному: przy oknie «у окна», przy stole «за столом», przy mnie «при мне»."
