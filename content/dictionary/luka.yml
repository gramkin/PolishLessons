# review
id: luka
format: 2
lemma: "luka"
rank: 4102
pos: noun
pron: { cyr: "лу́ка" }
senses:
  - id: gap
    ru: "пробел, брешь, пропуск"
    examples:
      - pl: "W jego wiedzy jest wiele luk."
        ru: "В его знаниях много пробелов."
        source: { kind: authored }
      - pl: "Przez lukę w płocie wszedł pies."
        ru: "Через дыру в заборе пролезла собака."
        source: { kind: authored }
      - pl: "Mam lukę w pamięci z tamtego wieczoru."
        ru: "У меня провал в памяти с того вечера."
        source: { kind: authored }
  - id: loophole
    ru: "лазейка (в законе, системе)"
    examples:
      - pl: "Wykorzystał lukę w prawie."
        ru: "Он воспользовался лазейкой в законе."
        source: { kind: authored }
      - pl: "Hakerzy znaleźli lukę w systemie."
        ru: "Хакеры нашли уязвимость в системе."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "LUKA — «пробел, брешь, лазейка», а не «лука». Лук для стрельбы — ŁUK, репчатый лук — CEBULA. LUKA PRAWNA — «лазейка в законе», LUKA W ZABEZPIECZENIACH — «уязвимость»." }
  - { kind: usage, text: "Девять живых форм, женский род. Перед E K переходит в C: W LUCE. Родительный множественного — LUK. Звательный не даётся." }
  - { kind: government, text: "Пробел в чём — LUKA W, и местный: LUKA W WIEDZY, W PRAWIE. Заполнить пробел — WYPEŁNIĆ LUKĘ, винительный." }
  - { kind: pronunciation, text: "Читается «лу́ка», ударение на первом слоге. LU — «лу»." }
collocations:
  - { pl: "luka w prawie", ru: "лазейка в законе" }
  - { pl: "wypełnić lukę", ru: "заполнить пробел" }
  - { pl: "luka w pamięci", ru: "провал в памяти" }
family:
  - { pl: "luka prawna", ru: "лазейка в законе", relation: derived }
  - { pl: "luka pokoleniowa", ru: "разрыв между поколениями", relation: derived }
  - { pl: "luka w zabezpieczeniach", ru: "уязвимость", relation: derived }
etymology: "Из немецкого слова со значением «дыра, пробел». В русском этого слова нет, а «лука» — совсем другое."
memory: "Luka — пробел, брешь, лазейка; łuk — лук для стрельбы. Читается «лу́ка». Luka w prawie — лазейка в законе."
idioms:
  - { pl: "wypełnić lukę", ru: "заполнить пробел" }
