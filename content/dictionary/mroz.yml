        source: { kind: translated, id: 744161 }
notes:
  - { kind: false-friend, text: "Русский «мороз» и польское mróz — одно слово; различие в полногласии и в ó: mróz читается «мрус», с оглушением на конце." }
  - { kind: government, text: "Мужской неодушевлённый; родительный — mrozu, с чередованием ó/o: mróz, но mrozu." }
  - { kind: usage, text: "Морозы во множественном: mrozy «морозы», как и в русском." }
  - { kind: usage, text: "Родственные: mrozić «морозить», zamrażarka «морозильник», mroźny «морозный»." }
collocations:
  - { pl: "siarczysty mróz", ru: "трескучий мороз" }
  - { pl: "mrozy", ru: "морозы" }
etymology: "Праславянское *morzъ; русский «мороз» — то же слово, с полногласием."
memory: "mróz — «мороз», читается «мрус». Чередование ó/o: mróz, но mrozu. Морозы — mrozy, как и в русском."
