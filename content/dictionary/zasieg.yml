# review
id: zasieg
format: 2
lemma: "zasięg"
rank: 1678
pos: noun
pron: { cyr: "за́сенк" }
senses:
  - id: reach
    ru: "досягаемость, предел досягаемости"
    examples:
      - pl: "Odłóż ten nóż poza zasięg dzieci."
        ru: "Убери этот нож вне досягаемости детей."
        source: { kind: translated, id: 952083 }
      - pl: "Usunęła wszystkie lekarstwa poza zasięg dzieci."
        ru: "Она убрала все лекарства вне досягаемости детей."
        source: { kind: translated, id: 358938 }
      - pl: "Połóż zapałki poza zasięgiem dzieci."
        ru: "Положи спички вне досягаемости детей."
        source: { kind: translated, id: 365709 }
  - id: within-range
    ru: "w zasięgu — в пределах досягаемости"
    examples:
      - pl: "Myślę, że jest w twoim zasięgu."
        ru: "Думаю, это в пределах твоих возможностей."
        source: { kind: translated, id: 735956 }
      - pl: "Statek pojawił się w zasięgu wzroku."
        ru: "Судно появилось в поле зрения."
        source: { kind: translated, id: 676789 }
      - pl: "Sekretarka zawsze jest w zasięgu głosu."
        ru: "Секретарь всегда в пределах слышимости."
        source: { kind: translated, id: 367044 }
notes:
  - { kind: usage, text: "poza zasięgiem — «вне досягаемости», w zasięgu — «в пределах досягаемости». Обе формы застывшие и очень частотны." }
  - { kind: usage, text: "w zasięgu wzroku — «в поле зрения», w zasięgu głosu — «в пределах слышимости», w zasięgu ręki — «под рукой»." }
  - { kind: usage, text: "Современное значение — «зона приёма связи»: nie ma zasięgu «нет сети»." }
  - { kind: usage, text: "Образовано от zasięgnąć «достичь, простереться»; корень тот же, что в sięgać «тянуться, доставать»." }
collocations:
  - { pl: "poza zasięgiem", ru: "вне досягаемости" }
  - { pl: "w zasięgu wzroku", ru: "в поле зрения" }
  - { pl: "nie ma zasięgu", ru: "нет сети" }
etymology: "От zasięgnąć «достичь», в основе sięgać «тянуться, доставать». Русская «досягаемость» построена от «досягать» — тот же корень *sęg-, так что слова прямо родственны."
memory: "zasięg = «досягаемость, дальность». Держите две застывшие формы: poza zasięgiem «вне досягаемости» и w zasięgu «в пределах досягаемости» — в том числе w zasięgu wzroku «в поле зрения»."
