        source: { kind: authored }
notes:
  - { kind: usage, text: "Пара приставок делает здесь то, на что русскому нужны два разных глагола. WSIĄŚĆ значит «сесть, войти» в транспорт, WYSIĄŚĆ — «выйти» из него, и корень у них один. По-русски же говорят «сесть в автобус», но «выйти из автобуса» — два корня вместо одного. Так что польский тут проще: запомнив SIĄŚĆ «сесть», вы получаете обе половины пары. Отсюда же PRZESIĄŚĆ SIĘ — «пересесть», сделать пересадку." }
  - { kind: pronunciation, text: "Основа меняется заметно, и мена эта русскому знакома из других глаголов. В инфинитиве и повелительном стоит мягкое ś или dź: WYSIĄŚĆ, WYSIĄDŹ. В настоящем времени — dz: WYSIĄDĘ, WYSIĄDZIESZ, WYSIĄDZIE. В прошедшем — простое d, и при этом гласная ą сменяется на a: WYSIADŁ, WYSIADŁA. А в мужской личной форме множественного вместо a появляется e: WYSIEDLI при WYSIADŁY. Та же мена a на e, что в NIÓSŁ при NIEŚLI." }
  - { kind: usage, text: "Разговорное значение встречается не реже основного, и русскому оно понятно сразу: SILNIK WYSIADŁ — «двигатель сдох», KOMPUTER WYSIADŁ — «компьютер отказал», NERKI WYSIADŁY — «почки сдали». То есть всё, что перестало работать, по-польски «вышло». Русское «высесть» такого смысла не имеет и вообще не употребляется, так что переносить тут нечего — надо запомнить." }
  - { kind: government, text: "Берёт предлог Z с родительным: WYSIĄŚĆ Z AUTOBUSU, Z POCIĄGU, Z SAMOCHODU — ровно как русское «выйти из автобуса». Место выхода идёт с предлогом NA и предложным: WYSIĄŚĆ NA NASTĘPNYM PRZYSTANKU. Сорок две формы — совершенный непереходный, самая малая клетка таблицы: сорок одна основная форма и деепричастие WYSIADŁSZY. Отглагольное существительное при этом строится от основы, которой у инфинитива нет вовсе: WYSIĄDNIĘCIE, как если бы глагол звучал WYSIĄDNĄĆ. Такого слова в польском нет, а существительное от него есть." }
collocations:
  - { pl: "wysiąść z autobusu", ru: "выйти из автобуса" }
  - { pl: "wysiąść na przystanku", ru: "выйти на остановке" }
  - { pl: "silnik wysiadł", ru: "двигатель сдох" }
family:
  - { pl: "wsiąść", ru: "сесть, войти (в транспорт)", relation: antonym, id: wsiasc }
  - { pl: "wysiadać", ru: "выходить (из транспорта)", relation: aspect }
  - { pl: "siąść", ru: "сесть", relation: root }
etymology: "Приставка wy- и SIĄŚĆ «сесть», из праславянского *sěsti — то же слово, что русское «сесть». Приставочная пара WSIĄŚĆ и WYSIĄŚĆ делит вход и выход одним корнем, тогда как русский берёт «сесть в» и «выйти из». Из гнезда вышли PRZESIĄŚĆ SIĘ «пересесть», POSIEDZIEĆ «посидеть», SIEDZIEĆ «сидеть», SIEDZENIE «сиденье»."
memory: "Один корень на вход и выход: wsiąść «сесть в», wysiąść «выйти из». И запомните разговорное: silnik wysiadł — «двигатель сдох»."
idioms:
