# review
id: ponadto
format: 2
lemma: "ponadto"
rank: 4930
pos: part
pron: { cyr: "пона́тто" }
senses:
  - id: moreover
    ru: "кроме того, к тому же"
    examples:
      - pl: "Mieszkanie jest duże i jasne, ponadto ma balkon."
        ru: "Квартира большая и светлая, к тому же с балконом."
        source: { kind: authored }
      - pl: "Ponadto należy złożyć wniosek do końca miesiąca."
        ru: "Кроме того, заявление нужно подать до конца месяца."
        source: { kind: authored }
      - pl: "Spóźnił się, a ponadto nie przeprosił."
        ru: "Он опоздал, да ещё и не извинился."
        source: { kind: authored }
      - pl: "Firma oferuje dobrą pensję, ponadto prywatną opiekę medyczną."
        ru: "Фирма предлагает хорошую зарплату, а кроме того, частную медицинскую страховку."
        source: { kind: authored }
      - pl: "W programie jest ponadto wycieczka do Krakowa."
        ru: "Кроме того, в программе есть экскурсия в Краков."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "PONADTO — «кроме того», а не «понад то». PONAD отдельно значит «над, свыше, более»: PONAD STO OSÓB, «более ста человек». PONADTO — «сверх того», слитно." }
  - { kind: usage, text: "Одна форма. Добавляет ещё один довод или пункт к перечню. Часто с союзом A: A PONADTO, «а кроме того». Запятая после PONADTO не нужна: PONADTO NALEŻY PAMIĘTAĆ O TERMINIE." }
  - { kind: government, text: "Слово ничем не управляет. Не путайте с предлогом PONAD, который требует винительного или творительного: PONAD MIARĘ, «сверх меры»; PONAD CHMURAMI, «над облаками»." }
  - { kind: pronunciation, text: "Читается «пона́тто», ударение на предпоследнем слоге. D перед T оглушается и сливается с ним в долгое «тт»." }
  - { kind: register, text: "Слово книжное и официальное: письма, отчёты, объявления. В разговоре говорят POZA TYM, OPRÓCZ TEGO или DO TEGO." }
collocations:
  - { pl: "a ponadto", ru: "а кроме того" }
  - { pl: "ponadto warto dodać", ru: "кроме того, стоит добавить" }
  - { pl: "ponadto należy", ru: "кроме того, следует" }
family:
  - { pl: "ponad", ru: "над, свыше, более", relation: root, id: ponad }
  - { pl: "nad", ru: "над", relation: root, id: nad }
  - { pl: "ponadczasowy", ru: "вневременный", relation: derived }
etymology: "Слияние PONAD «сверх» и TO «то»: «сверх того». Русское «сверх того» построено так же, только с другим предлогом."
memory: "Ponadto — кроме того, сверх того: ponad + to. Читается «пона́тто». Ponad sto — более ста. В разговоре — poza tym."
idioms:
  - { pl: "ponad wszystko", ru: "превыше всего" }
formExamples:
  - form: "ponadto"
    pl: "Hotel jest tani, a ponadto blisko plaży."
    ru: "Гостиница дешёвая и к тому же рядом с пляжем."
    source: { kind: authored }
  - form: "ponadto"
    pl: "Ponadto zapomniał wziąć dokumenty."
    ru: "Кроме того, он забыл взять документы."
    source: { kind: authored }
  - form: "ponadto"
    pl: "Kandydat zna angielski, ponadto mówi po niemiecku."
    ru: "Кандидат знает английский и, кроме того, говорит по-немецки."
    source: { kind: authored }
