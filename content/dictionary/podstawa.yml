# review
id: podstawa
format: 2
lemma: "podstawa"
rank: 1378
pos: noun
pron: { cyr: "потста́ва" }
senses:
  - id: base
    ru: "основа, основание, подставка"
    examples:
      - pl: "Dobry początek to podstawa."
        ru: "Хорошее начало — это основа."
        source: { kind: translated, id: 6729753 }
      - pl: "Matematyka jest podstawą wszelkiej dokładnej wiedzy o zjawiskach naturalnych."
        ru: "Математика — основа всякого точного знания о природных явлениях."
        source: { kind: translated, id: 10776717 }
  - id: grounds
    ru: "основание, повод (na podstawie — на основании)"
    examples:
      - pl: "Nie ma żadnych podstaw do skargi."
        ru: "Нет никаких оснований для жалобы."
        source: { kind: tatoeba, id: 8664057 }
      - pl: "Na jakiej podstawie tak sądzisz?"
        ru: "На каком основании ты так считаешь?"
        source: { kind: translated, id: 731994 }
  - id: basics
    ru: "во множественном числе podstawy — основы, азы"
    examples:
      - pl: "Tata zna podstawy łaciny."
        ru: "Папа знает основы латыни."
        source: { kind: translated, id: 366046 }
      - pl: "Znam podstawy francuskiego."
        ru: "Я знаю основы французского."
        source: { kind: translated, id: 4837536 }
notes:
  - { kind: government, text: "na podstawie czegoś — «на основании чего-либо, судя по чему-либо»: sądzić na podstawie wyglądu «судить по внешности». Один из самых частых оборотов официального языка." }
  - { kind: usage, text: "Множественное podstawy значит «основы, азы»: podstawy francuskiego «основы французского». А podstawy do czegoś — «основания для чего-либо»." }
  - { kind: usage, text: "od podstaw — «с нуля, с самых основ»: zmienić się od podstaw «измениться до основания»." }
  - { kind: false-friend, text: "Форма podstaw — это не только родительный множественного от podstawa, но и повелительное наклонение глагола podstawić «подставить»: Podstaw dłoń «Подставь ладонь». Смотрите на контекст." }
collocations:
  - { pl: "na podstawie", ru: "на основании" }
  - { pl: "od podstaw", ru: "с нуля" }
  - { pl: "podstawy języka", ru: "основы языка" }
etymology: "Приставка pod- «под» и корень staw- от stawiać «ставить»: буквально «то, что подставлено». Русские «подставка» и «основание» собраны тем же способом."
memory: "podstawa — «основа, основание». Держите в голове оборот na podstawie czegoś «на основании чего-либо»: Nie osądzaj na podstawie wyglądu. Множественное podstawy — это «азы»: podstawy francuskiego. И помните, что podstaw бывает и приказом «подставь»."
idioms:
  - { pl: "na podstawie", ru: "на основании" }
  - { pl: "od podstaw", ru: "с нуля, с самых основ" }
  - { pl: "praca u podstaw", ru: "работа на низовом уровне" }
formExamplesSkip:
