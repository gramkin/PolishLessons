  - { pl: "stawiać", ru: "ставить", relation: root, id: stawiac }
etymology: "От ZESTAWIĆ «составить, сопоставить»: приставка ze- и STAWIĆ «ставить», из праславянского *staviti — того же корня, что русское «ставить». Набор понят как то, что составлено вместе, поставлено рядом. Русский «состав» собран из тех же морфем и того же корня, но пошёл к содержимому и к поезду, а комплект назвал заимствованиями «набор» и «комплект»."
memory: "Местный zestawie: w даёт wi — последний согласный в таблице смягчений перед -e. И это «набор», а не «состав»: состав смеси — skład."
