notes:
  - { kind: usage, text: "Местный и звательный — ZESTAWIE: w переходит в мягкое, которое перед гласной пишется wi. Этим слово добавляет ещё один согласный в таблицу смягчений перед окончанием -e, которую словарь собирал по частям: t даёт ć, d даёт dź, s даёт ś, r даёт rz, k даёт c, g даёт dz, ch даёт sz, n даёт ń, m даёт mi, w даёт wi. Список этим не исчерпан: так же ведут себя b (szyba — szybie), p (mapa — mapie), f (szafa — szafie), z (blizna — bliźnie) и ł, дающее l (szkoła — szkole). Но само правило исключений не знает: перед -e твёрдых согласных в польском не остаётся вообще." }
  - { kind: usage, text: "Родительный единственного — ZESTAWU с окончанием -u. Напомню расклад: у мужских неодушевлённых выбор между -a и -u лексический и по виду слова не вычисляется, а PORANEK из этой же партии показывает, что бывают и слова с двумя родительными сразу. Здесь выбор однозначный, дублета нет." }
  - { kind: false-friend, text: "Слово собрано из тех же частей, что русский «состав»: приставка z- отвечает русской «со-», а корень staw- — русскому «став-». Но значения разошлись. Польское ZESTAW — это набор, комплект предметов: zestaw narzędzi, zestaw obiadowy, zestaw głośników. Русский «состав» значит либо содержимое смеси, либо железнодорожный поезд, и ни то ни другое по-польски zestawem не назовут: содержимое будет SKŁAD, а поезд — SKŁAD POCIĄGU или просто POCIĄG." }
