etymology: "Из немецкого SCHLAG «удар», а также «просека, прорубленная в лесу дорога»: тропу буквально прорубали. Из польского слово ушло к соседям, и украинское «шлях» это как раз польское SZLAK, а в южнорусских говорах «шлях» означает большую дорогу. Тот же немецкий корень сидит в SZLABAN «шлагбаум», от SCHLAGBAUM, где BAUM это «бревно»: опускаемое бревно поперёк дороги. Русский «шлак» к этому ряду не относится вовсе, он из другого немецкого слова, SCHLACKE."
memory: "Ловушка в звучании: szlak читается «шлак», но значит путь, маршрут, тропу, а не отход плавки (тот будет żużel). Совпадение случайное, из двух разных немецких слов. Настоящая родня ближе, чем кажется: украинское «шлях» заимствовано из польского szlak, и тот же немецкий корень в szlaban «шлагбаум». Управление: iść szlakiem, творительный без предлога, где русский говорит «идти по тропе»."
idioms:
  - { pl: "przetrzeć szlak", ru: "проложить дорогу, стать первопроходцем" }
