notes:
  - { kind: false-friend, text: "Звучит в точности как русский «шлак», а значит совсем другое: путь, маршрут, тропу. Сходство случайное, слова пришли из разных немецких источников: SZLAK из SCHLAG «удар, прорубленная просека», а русский «шлак» из SCHLACKE «окалина». Отходы плавки по-польски ŻUŻEL. Зато у SZLAK есть настоящая родня в русском: украинское «шлях» заимствовано как раз из польского, и в южнорусских говорах «шлях» это большая дорога, как в «Чумацком шляхе»." }
  - { kind: usage, text: "Девять форм, мужской род, неодушевлённое, поэтому винительный совпадает с именительным. Родительный и местный падежи единственного числа совпали в SZLAKU: ZEJŚĆ ZE SZLAKU «сойти с маршрута» и NA SZLAKU «на маршруте» различаются только предлогом. Множественное SZLAKI обычное и частое, особенно в горах, где у каждого маршрута есть цвет." }
  - { kind: government, text: "На маршруте — предлог NA с местным падежом: NA SZLAKU. Идти маршрутом — творительный без предлога: IŚĆ SZLAKIEM, тогда как русский вставляет предлог, «идти по тропе». Сойти с маршрута — ZEJŚĆ ZE SZLAKU, предлог Z с родительным, причём перед SZ он удлиняется до ZE. Проложить дорогу — PRZETRZEĆ SZLAK, винительный без предлога." }
  - { kind: pronunciation, text: "Читается «шлак», один слог. Сочетание SZ даёт «ш», а L здесь обычное твёрдое «л», не Ł, так что получается именно «шлак», а не «шляк». В формах с мягким окончанием ничего не меняется: SZLAKIEM звучит «шля́кем», где KIE даёт мягкое «ке». Произнося это слово, стоит помнить, что для русского уха оно прозвучит как название отхода плавки, хотя речь идёт о тропе." }
  - { kind: register, text: "Слово нейтральное и очень частое в горах и в туризме: SZLAK TURYSTYCZNY «туристический маршрут», SZLAK CZERWONY «красный маршрут», ZNAKOWANY SZLAK «маркированная тропа». В историческом языке SZLAK HANDLOWY «торговый путь» и SZLAK BURSZTYNOWY «Янтарный путь». Переносное PRZETRZEĆ SZLAK значит «проложить дорогу другим», и говорят так о первопроходцах в любом деле, не только в горах." }
