pos: verb
pron: { cyr: "набра́ць" }
senses:
  - id: scoop
    ru: "набрать (воды, воздуха)"
    examples:
      - pl: "Nabrał wody do wiadra."
        ru: "Он набрал воды в ведро."
        source: { kind: authored }
      - pl: "Nabierz powietrza i nurkuj."
