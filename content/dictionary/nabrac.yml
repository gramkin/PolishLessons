        source: { kind: authored }
  - id: deceive
    ru: "обмануть, надуть"
    examples:
      - pl: "Nabrali mnie na stare sztuczki."
        ru: "Меня надули на старых уловках."
        source: { kind: authored }
      - pl: "Dał się nabrać jak dziecko."
        ru: "Он дал себя обмануть как ребёнок."
        source: { kind: authored }
  - id: acquire
    ru: "набраться (сил, опыта, смелости)"
    examples:
      - pl: "Nabrał wprawy po roku pracy."
        ru: "Он набрался навыка через год работы."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "У ЭТОГО ГЛАГОЛА ЕСТЬ ЗНАЧЕНИЕ, КОТОРОГО У РУССКОГО «НАБРАТЬ» НЕТ ВОВСЕ. NABRAĆ KOGOŚ значит «обмануть, надуть»: nabrali mnie, dałem się nabrać «меня надули, я попался». Это одно из самых частых употреблений слова в разговоре. Русское «набрать» в таком смысле сказать нельзя, нужен другой глагол — «надуть», «провести»." }
  - { kind: government, text: "ТАМ, ГДЕ РУССКИЙ ТРЕБУЕТ ВОЗВРАТНОСТИ, ПОЛЬСКИЙ ОБХОДИТСЯ БЕЗ НЕЁ. Nabrać sił, nabrać wprawy, nabrać odwagi — без się, тогда как русский говорит «набраться сил, опыта, смелости». Дополнение при этом в родительном падеже, как и по-русски. А вот оборот nabrać wody w usta совпал с русским «набрать в рот воды» буквально, вместе со значением «замолчать»." }
  - { kind: usage, text: "Основа чередуется bior-/bierz-, как у простого brać: NABIORĘ, но NABIERZESZ, NABIERZE, NABIORĄ. Русское «набрать» ведёт себя так же: «наберу» против «наберёшь». Вид совершенный: есть nabrawszy, форм на -ąc и -ący нет, несовершенная пара — nabierać." }
collocations:
  - { pl: "nabrać sił", ru: "набраться сил" }
  - { pl: "dać się nabrać", ru: "дать себя обмануть" }
  - { pl: "nabrać wody w usta", ru: "набрать в рот воды" }
family:
  - { pl: "nabierać", ru: "набирать (несов.)", relation: aspect, id: nabierac }
  - { pl: "brać", ru: "брать", relation: root, id: brac }
  - { pl: "oszukać", ru: "обмануть", relation: root, id: oszukac }
etymology: "Приставка na- и brać, из праславянского *bьrati — того же корня, что русские «брать», «беру» и «набрать». Чередование bior-/bierz- отвечает русскому «беру»/«берёшь». Значение «обмануть» развилось из образа «забрать своё, объегорить», и русскому оно не передалось."
memory: "nabrać — «набрать», но ещё и «обмануть»: dał się nabrać значит «он попался». И помни про возвратность: nabrać sił без się, хотя по-русски «набраться сил». Основа чередуется: nabiorę, но nabierzesz."
idioms:
  - { pl: "dać się nabrać", ru: "попасться на обман" }
  - { pl: "nabrać wody w usta", ru: "набрать в рот воды, замолчать" }
