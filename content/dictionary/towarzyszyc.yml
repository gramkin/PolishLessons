etymology: "От TOWARZYSZ «товарищ, спутник», а то от TOWAR, из тюркского TAVAR «скот, имущество», пришедшего в славянские языки через торговлю. Первоначальный смысл прозрачен: товарищ — тот, с кем вместе идут с товаром, спутник в купеческом пути. Русское «товарищ» того же происхождения и строения, с суффиксом -ИЩ, и это одно из немногих слов, где польский и русский сохранили и корень, и модель. Дальше языки разошлись в производных: польское TOWARZYSTWO стало значить «общество» и «компания», а TOWARZYSKI — «общительный», тогда как русское «товарищество» ушло в юридическую сферу. Глагол TOWARZYSZYĆ образован от существительного и потому управляет дательным: быть кому-то товарищем. Русский для того же понятия взял «сопровождать», от «провожать», и получил винительное управление — отсюда и расхождение, которое приходится заучивать."
memory: "Корень как в русском «товарище»: towarzysz «спутник», towarzystwo «общество, компания», towar «товар». Но главное — падеж: towarzyszyć KOMUŚ, дательный, тогда как русское «сопровождать» требует винительного. Towarzyszyć kogoś сказать нельзя. Помогает перевод через «сопутствовать», который в русском тоже дательный. Совершенного вида нет — для однократного говорят odprowadzić. Пятьдесят две формы: страдательного причастия нет, потому что нет винительного дополнения. И ловушка: towarzyski значит «общительный»."
