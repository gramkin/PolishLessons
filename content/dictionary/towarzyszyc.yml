notes:
  - { kind: government, text: "Главное в этой карточке — падеж. Польское TOWARZYSZYĆ требует дательного: TOWARZYSZYĆ KOMUŚ, TOWARZYSZYĆ BABCI, TOWARZYSZYĆ REFORMIE. Русское «сопровождать» требует винительного: «сопровождать бабушку». Поэтому сказать TOWARZYSZYĆ KOGOŚ нельзя, и ошибка эта у русскоязычных почти автоматическая. Запомнить помогает перевод через «сопутствовать», который в русском тоже управляет дательным: «сопутствовать реформе». Во втором значении подлежащим обычно выступает обстоятельство: REFORMIE TOWARZYSZYŁY PROTESTY, где по-русски естественнее сказать «реформу сопровождали протесты», с обратным порядком." }
  - { kind: false-friend, text: "Корень тот же, что в русском «товарищ»: польское TOWARZYSZ значит «товарищ, спутник», TOWARZYSTWO — «общество, компания», TOWARZYSKI — «общительный». Слово восходит к TOWAR, и первоначальный смысл — тот, с кем вместе везут товар, то есть спутник в торговом пути. Русское «товарищ» того же происхождения. Ловушка в производных: TOWARZYSTWO это не «товарищество» в юридическом смысле, а прежде всего «общество» и «компания» — DOBRE TOWARZYSTWO «хорошая компания», TOWARZYSTWO UBEZPIECZENIOWE «страховое общество». А TOWARZYSKI значит «общительный», не «товарищеский»." }
  - { kind: usage, text: "Несовершенный вид, пятьдесят две формы: сорок две от глагола и десять от действительного причастия TOWARZYSZĄCY. Страдательного причастия нет, и это прямое следствие управления: глагол требует дательного, а страдательное причастие предполагает винительное дополнение, которого здесь быть не может. Совершенного вида у глагола нет вовсе — сопровождение длится, а не завершается, — и для однократного действия говорят ODPROWADZIĆ «проводить», PÓJŚĆ Z KIMŚ «пойти с кем-то». Причастие TOWARZYSZĄCY очень частотно в официальном языке: OKOLICZNOŚCI TOWARZYSZĄCE «сопутствующие обстоятельства», OBJAWY TOWARZYSZĄCE «сопутствующие симптомы»." }
  - { kind: pronunciation, text: "Читается «товажы́шыць», четыре слога, ударение на предпоследнем. Буква O в первом слоге звучит отчётливо, без редукции: «то», а не «та». Буквосочетание RZ даёт «ж». Буква Y это «ы», поэтому третий слог звучит «шы». Конечное Ć — мягкое «ць». В причастии TOWARZYSZĄCY пять слогов, носовое Ą перед C даёт «он»: «товажышо́нцы». В существительном TOWARZYSZ ударение на предпоследнем слоге: «това́жыш»." }
