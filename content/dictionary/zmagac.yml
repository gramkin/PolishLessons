# review
id: zmagac
format: 2
lemma: "zmagać"
rank: 5931
pos: verb
aspect: imperf
pron: { cyr: "зма́гаць" }
senses:
  - id: struggle
    ru: "бороться, справляться (с болезнью, трудностями, проблемой)"
    note: "только zmagać się z + творительный"
    examples:
      - pl: "Rosja zmaga się z poważnymi trudnościami finansowymi."
        ru: "Россия борется с серьёзными финансовыми трудностями."
        source: { kind: translated, id: 1571151 }
      - pl: "Młoda kobieta z sercem przepełnionym nadzieją zmagała się z ciężką chorobą."
        ru: "Молодая женщина с сердцем, полным надежды, боролась с тяжёлой болезнью."
        source: { kind: translated, id: 1630723 }
      - pl: "Od tygodnia zmagam się z przeziębieniem."
        ru: "Уже неделю я борюсь с простудой."
        source: { kind: authored }
  - id: contend
    ru: "сражаться, состязаться (с противником, стихией)"
    examples:
      - pl: "Rybacy zmagali się z burzą całą noc."
        ru: "Рыбаки всю ночь боролись со штормом."
        source: { kind: authored }
      - pl: "Nasza drużyna zmaga się dziś z mistrzem kraju."
        ru: "Наша команда сегодня сражается с чемпионом страны."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Глагол употребляется только с SIĘ: ZMAGAĆ SIĘ Z CZYMŚ. Несовершенный вид без пары. Страдательного причастия нет: бороться можно с чем-то, но «zmaganego» ничего не бывает, поэтому эти формы в карточку не включены." }
  - { kind: government, text: "С кем, с чем — Z + творительный, как в русском «бороться с»: ZMAGAĆ SIĘ Z CHOROBĄ, Z PROBLEMAMI, Z ŻYWIOŁEM." }
  - { kind: register, text: "Книжнее, чем WALCZYĆ: так пишут о долгой, изматывающей борьбе — с болезнью, кризисом, стихией. Существительное ZMAGANIA (мн. ч.) — «борьба» и «соревнования»: ZMAGANIA OLIMPIJSKIE." }
  - { kind: false-friend, text: "Не путайте с ZMAGAZYNOWAĆ «складировать» и с русским «смочь». ZMAGAĆ SIĘ — «бороться, биться»." }
collocations:
  - { pl: "zmagać się z chorobą", ru: "бороться с болезнью" }
  - { pl: "zmagać się z problemami", ru: "справляться с проблемами" }
  - { pl: "zmagać się z żywiołem", ru: "бороться со стихией" }
  - { pl: "zmagania sportowe", ru: "спортивные состязания" }
family:
  - { pl: "zmagania", ru: "борьба; состязания", relation: derived }
  - { pl: "zmóc", ru: "одолеть, сломить", relation: root }
  - { pl: "walczyć", ru: "бороться", relation: root, id: walczyc }
  - { pl: "walka", ru: "борьба", relation: root, id: walka }
etymology: "Итератив к ZMÓC «одолеть», как POMAGAĆ к POMÓC; корень тот же, что в MÓC «мочь» и MOC «сила»."
memory: "Zmagać się — мериться силой (moc): zmagam się z chorobą, как будто пытаюсь её «смочь», одолеть."
idioms:
  - { pl: "zmagać się z losem", ru: "бороться с судьбой" }
  - { pl: "zmagać się z samym sobą", ru: "бороться с самим собой" }
