notes:
  - { kind: government, text: "Совершенный вид, несовершенный — SPŁACAĆ. Отсюда главное: SPŁACĘ, SPŁACISZ, SPŁACI это будущее время, «выплачу», а не «выплачиваю». Что выплачивают — винительный без предлога: SPŁACIĆ DŁUG, SPŁACIĆ KREDYT. Кого — тоже винительный, когда речь о кредиторе: SPŁACIĆ WIERZYCIELI. Чем или из чего — предлог Z с родительным: SPŁACIĆ ZE SPRZEDAŻY MIESZKANIA. Как — предлог W с местным: SPŁACIĆ W RATACH «выплатить в рассрочку». Страдательное причастие имеет чередование: SPŁACONY в мужском роде единственного, но SPŁACENI в мужском лице множественного, с O, переходящим в E." }
  - { kind: false-friend, text: "Корень прозрачен: PŁACIĆ это «платить», и приставка S- отвечает русской с-. Трудность не в корне, а в том, что на нём сидят четыре приставки, и русские соответствия у них перекрываются не полностью. SPŁACIĆ значит погасить долг или кредит, выплатить до конца. ZAPŁACIĆ значит заплатить за что-то, разово: ZAPŁACIĆ ZA BILET. OPŁACIĆ значит оплатить, покрыть взнос или услугу: OPŁACIĆ CZYNSZ. WYPŁACIĆ значит выдать деньги кому-то: WYPŁACIĆ PENSJĘ. Русские «заплатить», «оплатить» и «выплатить» ложатся на эти четыре не один к одному, и выбирать надо по тому, что именно происходит с деньгами: гасится долг, покрывается цена, оплачивается взнос или выдаётся сумма." }
  - { kind: pronunciation, text: "Читается «спуа́циць», ударение на предпоследнем слоге из двух. Сочетание SPŁ даёт «спу»: буква Ł звучит как «у», и три согласных подряд здесь нет, потому что Ł гласноподобна. Конечное -Ć мягкое, «ць». В страдательном причастии SPŁACONY слышно «спуацо́ны», три слога, ударение на предпоследнем. В форме SPŁACENI — «спуаце́ни». В деепричастии SPŁACIWSZY сочетание WSZ оглушается в «фш»: «спуаци́фшы»." }
  - { kind: usage, text: "Частотные сочетания: SPŁACIĆ KREDYT, SPŁACIĆ DŁUG, SPŁACIĆ RATĘ, SPŁACIĆ W RATACH «выплатить в рассрочку», SPŁACIĆ PRZED TERMINEM «погасить досрочно», SPŁACIĆ DO OSTATNIEGO GROSZA. Существительное SPŁATA означает выплату и входит в оборот HARMONOGRAM SPŁAT «график платежей». Переносное употребление встречается в книжной речи: SPŁACIĆ DŁUG WDZIĘCZNOŚCI «отдать долг благодарности». Несовершенный вид SPŁACAĆ употребляется о процессе: SPŁACAM KREDYT OD DZIESIĘCIU LAT «я выплачиваю кредит десять лет»." }
