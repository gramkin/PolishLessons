etymology: "Приставка S- и глагол PŁACIĆ «платить», из праславянского *platiti, а оно — от *platъ «кусок полотна, ткань». Это одна из тех этимологий, которые объясняют само понятие: платили когда-то полотном, и слово для платежа выросло из слова для ткани. Русский сохранил ту же пару целиком: «платить» и «плат», «платок», «платье» — всё от одного корня, и связь между оплатой и тканью видна до сих пор, хотя уже не чувствуется. Польский даёт PŁACIĆ и PŁÓTNO «полотно», PŁAT «пласт, лоскут». Чередование O и E в страдательном причастии, SPŁACONY против SPŁACENI, восходит к древнему различию твёрдого и мягкого окружения и работает у целого класса глаголов: ZROBIONY и ZROBIENI, KUPIONY и KUPIENI."
memory: "Корень как в русском «платить», и оба от *platъ «кусок ткани»: платили полотном, отсюда и «плат», «платок», «платье». Совершенный вид: spłacę значит «выплачу», а не «выплачиваю»; процесс — spłacać. Четыре приставки делят смысл: spłacić — погасить долг, zapłacić — заплатить за что-то, opłacić — оплатить взнос, wypłacić — выдать деньги. В причастии o переходит в e: spłacony, но spłaceni, как zrobiony и zrobieni."
