# review
id: osadzic
format: 2
lemma: "osądzić"
rank: 2214
pos: verb
aspect: perf
pron: { cyr: "осо́ндзиць" }
senses:
  - id: judge
    ru: "судить, вынести суждение"
    examples:
      - pl: "Musisz osądzić tę sprawę bezstronnie."
        ru: "Ты должен судить это дело беспристрастно."
        source: { kind: translated, id: 909247 }
      - pl: "Osądź sam!"
        ru: "Суди сам!"
        source: { kind: translated, id: 6626998 }
      - pl: "Trudno osądzić, kto miał rację."
        ru: "Трудно судить, кто был прав."
        source: { kind: authored }
  - id: misjudge
    ru: "рассудить, составить мнение о ком-л."
    examples:
      - pl: "Źle Cię osądziłam."
        ru: "Я плохо о тебе подумала."
        source: { kind: translated, id: 5221604 }
      - pl: "Źle Cię osądziłem."
        ru: "Я плохо о тебе подумал."
        source: { kind: translated, id: 5221603 }
notes:
  - { kind: false-friend, text: "Идентификатор карточки вводит в заблуждение: латиница стирает носовую ą, и osądzić «судить» выглядит как osadzić «посадить, поселить». Это разные слова — ср. пару posądzenie и posadzenie." }
  - { kind: government, text: "Винительный падеж: osądzić sprawę «рассудить дело», osądzić kogoś «судить кого-л.»." }
  - { kind: usage, text: "Корень sąd «суд, суждение», от которого и sądzić «судить, полагать», уже есть в словаре." }
  - { kind: usage, text: "Źle cię osądziłem «я плохо о тебе подумал» — частая формула извинения." }
collocations:
  - { pl: "osądzić sprawę", ru: "рассудить дело" }
  - { pl: "osądź sam", ru: "суди сам" }
etymology: "o- + sądzić «судить», от sąd «суд, суждение»; ср. русское «осудить», «рассудить»."
memory: "osądzić — «судить, рассудить», от sąd «суд». Не путайте с osadzić «посадить, поселить»: в латинице носовая ą пропадает и слова сливаются, как в паре posądzenie/posadzenie."
