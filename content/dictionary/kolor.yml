# review
id: kolor
format: 2
lemma: "kolor"
rank: 1230
pos: noun
pron: { cyr: "ко́лор" }
senses:
  - id: colour
    ru: "цвет"
    examples:
      - pl: "Zielony to mój ulubiony kolor."
        ru: "Зелёный - мой любимый цвет."
        source: { kind: tatoeba, id: 1111422 }
      - pl: "Nie podoba mi się kolor."
        ru: "Мне не нравится цвет."
        source: { kind: tatoeba, id: 12476559 }
      - pl: "Mój ulubiony kolor to czerwony."
        ru: "Мой любимый цвет - красный."
        source: { kind: tatoeba, id: 6405968 }
  - id: what-colour
    ru: "jakiego koloru — какого цвета (родительный падеж)"
    examples:
      - pl: "Jakiego koloru są jej oczy?"
        ru: "Какого цвета её глаза?"
        source: { kind: tatoeba, id: 11264118 }
      - pl: "Jakiego koloru jest pomarańcza?"
        ru: "Какого цвета апельсин?"
        source: { kind: tatoeba, id: 2832456 }
      - pl: "Jakiego koloru samochód ona sobie kupiła?"
        ru: "Какого цвета автомобиль она себе купила?"
        source: { kind: tatoeba, id: 1583737 }
  - id: in-colour
    ru: "w kolorze — такого-то цвета"
    examples:
      - pl: "A jest może w innym kolorze?"
        ru: "А есть, может быть, другого цвета?"
        source: { kind: translated, id: 832693 }
      - pl: "Czy macie tą koszulę w kolorze czarnym?"
        ru: "У вас есть эта рубашка чёрного цвета?"
        source: { kind: translated, id: 575091 }
      - pl: "Nie oceniaj ludzi po kolorze skóry."
        ru: "Не суди людей по цвету кожи."
        source: { kind: translated, id: 364094 }
notes:
  - { kind: government, text: "«Какого цвета?» — jakiego koloru, родительный падеж. «В каком цвете» — w kolorze, предложный: w kolorze czarnym «чёрного цвета»." }
  - { kind: usage, text: "Ulubiony kolor «любимый цвет» — одна из первых фраз в разговоре о вкусах." }
  - { kind: usage, text: "Kolor значит ещё и карточную масть, а kolory во множественном — «краски, цвета» вообще." }
  - { kind: false-friend, text: "Русская «краска» как вещество — farba, а не kolor: farba do włosów «краска для волос»." }
collocations:
  - { pl: "ulubiony kolor", ru: "любимый цвет" }
  - { pl: "jakiego koloru", ru: "какого цвета" }
  - { pl: "w kolorze", ru: "такого-то цвета" }
  - { pl: "kolor skóry", ru: "цвет кожи" }
etymology: "Из латинского color «цвет» через немецкий. Русский «колер» — то же заимствование, только оно осталось в узком, малярном смысле."
memory: "kolor — «цвет». Два оборота обязательны: jakiego koloru? «какого цвета?» (родительный) и w kolorze czarnym «чёрного цвета» (предложный). А «краска» как вещество — farba, не kolor."
idioms:
  - { pl: "jakiego koloru?", ru: "какого цвета?" }
  - { pl: "ulubiony kolor", ru: "любимый цвет" }
  - { pl: "kolor skóry", ru: "цвет кожи" }
