# review
id: kolega
format: 2
lemma: "kolega"
rank: 570
pos: noun
pron: { cyr: "коле́га" }
senses:
  - id: friend
    ru: "товарищ, приятель"
    note: "Главное значение — не «коллега», а «приятель»."
    examples:
      - pl: "Jak ma na imię twój nowy kolega?"
        ru: "Как зовут твоего нового друга?"
        source: { kind: tatoeba, id: 5926108 }
      - pl: "Mam kolegę w Bostonie."
        ru: "У меня есть друг в Бостоне."
        source: { kind: translated, id: 3828425 }
      - pl: "Jesteś moim najlepszym kolegą."
        ru: "Ты мой лучший друг."
        source: { kind: translated, id: 13582147 }
  - id: classmate
    ru: "kolega z klasy — одноклассник; kolega z pracy — сослуживец"
    note: "Уточняют добавкой z klasy, z pracy, ze studiów."
    examples:
      - pl: "Jesteśmy kolegami z klasy."
        ru: "Мы одноклассники."
        source: { kind: tatoeba, id: 588384 }
      - pl: "Ona przyjaźni się ze wszystkimi kolegami z klasy."
        ru: "Она дружит со всеми одноклассниками."
        source: { kind: tatoeba, id: 360503 }
      - pl: "To kolega z pracy."
        ru: "Это коллега с работы."
        source: { kind: translated, id: 365590 }
  - id: address
    ru: "kolego! — обращение «друг!», «приятель!»"
    note: "Звательный падеж живёт в разговоре."
    examples:
      - pl: "Dzięki, kolego!"
        ru: "Спасибо, друг!"
        source: { kind: translated, id: 12232678 }
      - pl: "Kolego, masz chwilę?"
        ru: "Друг, есть минутка?"
        source: { kind: authored }
      - pl: "Nie martw się, kolego."
        ru: "Не переживай, приятель."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Ложный друг: польское kolega — прежде всего «товарищ, приятель», а не только «коллега». Русское «коллега» точнее передаётся как kolega z pracy." }
  - { kind: usage, text: "Уточняющие сочетания: kolega z klasy «одноклассник», kolega z pracy «сослуживец», kolega ze studiów «однокурсник»." }
  - { kind: government, text: "Склоняется как существительное на -a (kolegi, kolegę, kolegą), но согласуется по мужскому роду: mój dobry kolega. Личное множественное — koledzy." }
  - { kind: usage, text: "Женский род — koleżanka. Звательный kolego живёт в обращении: Dzięki, kolego!" }
collocations:
  - { pl: "kolega z klasy", ru: "одноклассник" }
  - { pl: "kolega z pracy", ru: "сослуживец" }
  - { pl: "mój kolega", ru: "мой приятель" }
  - { pl: "koledzy ze studiów", ru: "однокурсники" }
family:
  - { pl: "koleżanka", ru: "подруга, коллега (женщина)", relation: derived }
  - { pl: "koleżeński", ru: "товарищеский", relation: derived }
  - { pl: "kolegium", ru: "коллегия", relation: root }
etymology: "Из латинского collega «сотоварищ по должности» через немецкое Kollege — то же слово, что русское «коллега», но значение в польском гораздо шире."
memory: "kolega — ложный друг: это прежде всего «товарищ, приятель», а не только «коллега». Уточняют добавкой: kolega z klasy «одноклассник», kolega z pracy «сослуживец», kolega ze studiów «однокурсник». Склоняется слово как женское на -a — kolegi, kolegę, kolegą, — но согласуется по мужскому роду: mój dobry kolega. Личное множественное — koledzy, женский род — koleżanka."
idioms:
  - { pl: "kolega z klasy", ru: "одноклассник" }
  - { pl: "kolega z pracy", ru: "сослуживец" }
  - { pl: "Dzięki, kolego!", ru: "Спасибо, друг!" }
