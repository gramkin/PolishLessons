notes:
  - { kind: usage, text: "ДВА РОДИТЕЛЬНЫХ МНОЖЕСТВЕННОГО: KOMISARZY И KOMISARZÓW. Современная форма — komisarzy, а komisarzów звучит архаично и встречается в старых документах. Это уже знакомое удвоение: так же garaży и garażów, symboli и symbolów. Основы на мягкий или шипящий согласный колеблются между нулевым -y и мужским -ów, и выбор решает не грамматика, а эпоха и регистр." }
  - { kind: pronunciation, text: "Конечное rz оглушается: komisarz звучит примерно «коми́саш», как lekarz «ле́каш» и pisarz «пи́саш». Но в косвенных падежах звонкость возвращается, потому что rz оказывается перед гласным: komisarza, komisarzem. Звательная форма — KOMISARZU, и в обращении она живая: panie komisarzu." }
collocations:
  - { pl: "komisarz wyborczy", ru: "избирательный комиссар" }
  - { pl: "panie komisarzu", ru: "господин комиссар" }
  - { pl: "komisarz policji", ru: "комиссар полиции" }
family:
  - { pl: "komisja", ru: "комиссия", relation: root, id: komisja }
  - { pl: "komisariat", ru: "комиссариат, отделение полиции", relation: root }
  - { pl: "komisaryczny", ru: "комиссарский, временный", relation: derived }
etymology: "Из латинского commissarius «уполномоченный», от committere «поручать». Русский «комиссар» пришёл той же дорогой, поэтому корень общий; суффикс деятеля -arz в польском отвечает латинскому -arius и нашему -арь, как в lekarz «лекарь» и pisarz «писарь». Из того же гнезда komisja «комиссия» и komisariat."
memory: "Родительный множественного двойной: современное komisarzy и старое komisarzów. И помни про оглушение: komisarz звучит «коми́саш», но komisarza уже со звонким ж."
idioms:
  - { pl: "panie komisarzu", ru: "господин комиссар" }
  - { pl: "zarząd komisaryczny", ru: "внешнее управление" }
