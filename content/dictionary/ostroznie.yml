notes:
  - { kind: usage, text: "Ostrożnie! как отдельная реплика значит «Осторожно!» — предупреждение об опасности." }
  - { kind: government, text: "ostrożnie z czymś «осторожно с чем-то» — предлог z с творительным падежом: ostrożnie z ogniem." }
  - { kind: usage, text: "Прилагательное — ostrożny «осторожный», сравнительная степень наречия — ostrożniej." }
  - { kind: usage, text: "Синоним — uważnie «внимательно», но ostrożnie подчёркивает именно опасность." }
collocations:
  - { pl: "jedź ostrożnie", ru: "езжай осторожно" }
  - { pl: "ostrożnie z ogniem", ru: "осторожно с огнём" }
  - { pl: "bardzo ostrożnie", ru: "очень осторожно" }
etymology: "От ostrożny, а тот от ostrog «частокол, укрепление»: осторожный — буквально «держащийся за оградой». Русское «осторожный» от «сторожить» рисует ту же картинку."
memory: "ostrożnie — «осторожно». Отдельной репликой Ostrożnie! значит «Осторожно!». С предметом опасности — предлог z и творительный: ostrożnie z ogniem. Прилагательное — ostrożny."
