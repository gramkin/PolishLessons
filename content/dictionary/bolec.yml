# review
id: bolec
format: 2
lemma: "boleć"
rank: 512
pos: verb
aspect: imperf
pron: { cyr: "бо́лець" }
senses:
  - id: hurt
    ru: "болеть (о части тела)"
    examples:
      - pl: "Boli mnie głowa."
        ru: "У меня голова болит."
        source: { kind: tatoeba, id: 349454 }
      - pl: "Boli mnie noga."
        ru: "У меня болит нога."
        source: { kind: tatoeba, id: 1605844 }
      - pl: "Bolą ją plecy."
        ru: "У неё болит спина."
        source: { kind: tatoeba, id: 3743792 }
  - id: pain
    ru: "быть больным, причинять боль (в том числе переносно)"
    examples:
      - pl: "To bolało."
        ru: "Это было больно."
        source: { kind: translated, id: 10599079 }
      - pl: "Nie będzie bolało."
        ru: "Больно не будет."
        source: { kind: translated, id: 627096 }
      - pl: "Bolała go ta strata."
        ru: "Эта потеря его ранила."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Главное — конструкция: болит не человек, а часть тела, а человек стоит в винительном падеже. Boli mnie głowa — буквально «болит меня голова», по-русски «у меня болит голова»." }
  - { kind: false-friend, text: "Русское «болеть» покрывает два смысла, польское — только один. boleć — это «причинять боль», а «быть больным, хворать» — это chorować: Choruję na grypę «Я болею гриппом»." }
  - { kind: usage, text: "Глагол живёт только в третьем лице: boli, bolą, bolało. Формы вроде «я болю» невозможны ни в польском, ни в русском." }
  - { kind: usage, text: "Причастие bolący значит «больной, ноющий»: bolące plecy «больная спина», mimo bolącej nogi «несмотря на больную ногу». А bolący temat — «больная тема»." }
collocations:
  - { pl: "boli mnie głowa", ru: "у меня болит голова" }
  - { pl: "bolą mnie plecy", ru: "у меня болит спина" }
  - { pl: "to boli", ru: "это больно" }
  - { pl: "bolący temat", ru: "больная тема" }
etymology: "От ból «боль», праславянское *bolь. Русские «боль» и «болеть» — то же самое гнездо."
memory: "boleć — «болеть» в смысле «причинять боль», от ból «боль». Две вещи обязательны. Конструкция: болит не человек, а часть тела, а человек стоит в винительном — Boli mnie głowa, буквально «болит меня голова». И различайте два русских «болеть»: boleć — это про боль, а «хворать» — chorować. Глагол живёт только в третьем лице."
idioms:
  - { pl: "boli mnie głowa", ru: "у меня болит голова" }
  - { pl: "od przybytku głowa nie boli", ru: "кашу маслом не испортишь" }
  - { pl: "niech cię głowa o to nie boli", ru: "пусть у тебя об этом голова не болит" }
