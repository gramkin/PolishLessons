id: finanse
format: 2
lemma: "finanse"
rank: 4551
pos: noun
pron: { cyr: "фина́нсэ" }
senses:
  - id: finances
    ru: "финансы (государства, фирмы)"
    examples:
      - pl: "Minister finansów przedstawił budżet."
        ru: "Министр финансов представил бюджет."
        source: { kind: authored }
      - pl: "Finanse publiczne są w złym stanie."
        ru: "Государственные финансы в плохом состоянии."
        source: { kind: authored }
      - pl: "Zajmuje się finansami firmy."
        ru: "Он занимается финансами фирмы."
        source: { kind: authored }
  - id: money-matters
    ru: "денежные дела, бюджет (личный)"
    examples:
      - pl: "Moje finanse nie pozwalają na wakacje."
        ru: "Мои финансы не позволяют поехать в отпуск."
        source: { kind: authored }
      - pl: "Musimy uporządkować domowe finanse."
        ru: "Нам надо навести порядок в семейном бюджете."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Пять форм, только множественное число, как по-русски «финансы». Родительный — FINANSÓW: MINISTERSTWO FINANSÓW. Глагол во множественном: FINANSE SIĘ POPRAWIŁY." }
  - { kind: false-friend, text: "Слово то же, что русское «финансы», и значения совпадают. В разговоре FINANSE — и личные «денежные дела»: JAK TWOJE FINANSE? — «как у тебя с деньгами?». Прилагательное FINANSOWY, «финансовый», и глагол FINANSOWAĆ, «финансировать», тоже совпадают с русскими." }
  - { kind: government, text: "Министр финансов — MINISTER FINANSÓW, родительный. Заниматься финансами — ZAJMOWAĆ SIĘ FINANSAMI, творительный. Разбираться в финансах — ZNAĆ SIĘ NA FINANSACH, NA с местным." }
  - { kind: pronunciation, text: "Читается «фина́нсэ», три слога, ударение на втором, как и у нас. Конечное E твёрдое, «э». В родительном FINANSÓW: «фина́нсуф»." }
  - { kind: register, text: "Слово деловое: FINANSE PUBLICZNE — государственные финансы, FINANSE OSOBISTE — личные финансы. В обиходе о деньгах говорят и проще: KASA, PIENIĄDZE." }
collocations:
  - { pl: "finanse publiczne", ru: "государственные финансы" }
  - { pl: "domowe finanse", ru: "семейный бюджет" }
  - { pl: "stan finansów", ru: "финансовое положение" }
family:
  - { pl: "finansowy", ru: "финансовый", relation: derived, id: finansowy }
  - { pl: "finansowac", ru: "финансировать", relation: derived }
  - { pl: "finansista", ru: "финансист", relation: derived }
etymology: "Из французского FINANCES, от старого глагола со значением «завершать, расплачиваться». В польский и русский слово пришло тем же путём, поэтому совпадает и по форме, и по смыслу."
memory: "Finanse — финансы, только во множественном. Читается «фина́нсэ». Minister finansów — министр финансов. Jak twoje finanse? — как у тебя с деньгами? Finansować — финансировать."
idioms:
