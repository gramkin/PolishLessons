  - id: rebellion
    ru: "протест, внутреннее несогласие; бунтарство"
    examples:
      - pl: "Nastolatki przechodzą okres buntu."
        ru: "Подростки переживают период бунтарства."
        source: { kind: authored }
      - pl: "W jego słowach słychać było bunt."
        ru: "В его словах слышался протест."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "BUNT — «бунт», и слово то же. Тонкость в употреблении: польский BUNT часто говорят о внутреннем протесте, особенно подростков: OKRES BUNTU — «период бунтарства», «переходный возраст». Глагол — BUNTOWAĆ SIĘ, «бунтовать»: BUNTUJE SIĘ PRZECIWKO RODZICOM." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. В местном падеже T переходит в CI: W BUNCIE. Родительный — BUNTU." }
  - { kind: government, text: "Бунт против кого-то — BUNT PRZECIWKO KOMUŚ, дательный после PRZECIWKO. Поднять бунт — WZNIECIĆ BUNT, винительный. В знак протеста — NA ZNAK BUNTU, родительный." }
  - { kind: pronunciation, text: "Читается «бунт», один слог, как по-русски. В местном падеже BUNCIE T смягчается: «бу́нце»." }
  - { kind: register, text: "BUNT NA POKŁADZIE, «бунт на борту», шутливо говорят о любом неповиновении: дети не хотят спать — BUNT NA POKŁADZIE! В истории и газетах это нейтральное слово для восстания небольшого масштаба." }
collocations:
  - { pl: "bunt młodzieńczy", ru: "юношеский бунт" }
  - { pl: "stłumić bunt", ru: "подавить бунт" }
  - { pl: "bunt przeciwko władzy", ru: "бунт против власти" }
family:
  - { pl: "buntowac", ru: "бунтовать (buntować się)", relation: derived }
  - { pl: "buntownik", ru: "бунтарь, мятежник", relation: derived }
  - { pl: "zbuntowany", ru: "взбунтовавшийся, бунтарский", relation: derived }
etymology: "Из немецкого BUND «союз»: в польском слово сменило смысл с «союза» на «заговор» и «мятеж». Русский «бунт» взят именно из польского, поэтому слова совпадают."
memory: "Bunt — бунт: bunt na pokładzie, stłumić bunt. Читается «бунт». Okres buntu — бунтарский возраст. Buntować się — бунтовать. Русский «бунт» пришёл как раз из польского."
idioms:
