senses:
  - id: revolt
    ru: "бунт, мятеж"
    examples:
      - pl: "Na statku wybuchł bunt."
        ru: "На корабле вспыхнул бунт."
        source: { kind: authored }
      - pl: "Wojsko stłumiło bunt."
        ru: "Армия подавила мятеж."
        source: { kind: authored }
      - pl: "Bunt więźniów trwał trzy dni."
        ru: "Бунт заключённых длился три дня."
