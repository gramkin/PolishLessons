        ru: "Критики глумились над его книгой."
        source: { kind: authored }
notes:
  - { kind: government, text: "Всегда с się и с предлогом nad + ТВОРИТЕЛЬНЫЙ падеж: pastwić się nad kimś. Русское «издеваться» берёт над + творительный точно так же." }
  - { kind: usage, text: "Формы без się не существует — глагол только возвратный." }
  - { kind: false-friend, text: "Корень pastwa «добыча, жертва», сохранившийся в обороте paść pastwą «стать добычей». К слову «паства» в церковном смысле отношения не имеет, хотя корень общий — «пасти»." }
  - { kind: usage, text: "В корпусе глагол не встречается, поэтому все примеры составлены вручную." }
  - { kind: government, text: "Повелительное наклонение — pastw się, как martw się: формы pastwij нет." }
collocations:
  - { pl: "pastwić się nad kimś", ru: "издеваться над кем-л." }
etymology: "От pastwa «добыча, жертва» (ср. paść pastwą «стать добычей»), в конечном счёте от paść «пасти»."
memory: "pastwić się nad kimś — «издеваться над кем-л.», с nad и творительным, как в русском. Глагол только возвратный: без się его не бывает."
