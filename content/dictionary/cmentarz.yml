etymology: "Из латинского церковного COEMETERIUM, а то — из греческого KOIMETERION «спальня, место сна», от глагола KOIMAO «укладывать спать». Образ прямой и утешительный: умершие не погребены, а уложены спать до пробуждения, и раннее христианство выбрало это слово намеренно. Польский получил его через латынь костёла и стянул до CMENTARZ, потеряв начальный слог, как потерял его и в OŁTARZ от ALTARE. Русский в этом месте взял своё слово, «кладбище», от «класть» — и образ там другой, не сон, а положение в землю. Так два языка назвали одно место, один по надежде, другой по действию."
memory: "Угадать нельзя: латинское coemeterium из греческого koimeterion «спальня, место сна» — умершие уложены спать. Русское «кладбище» построено по другому образу, от «класть». Польский стянул слово, потеряв начальный слог, как в ołtarz от altare. Начало произносится слитно, «цм», а конечное rz оглушается в «ш»: «цмэ́нташ». Предлог na, как и по-русски: na cmentarzu. Два родительных множественного: cmentarzy и старое cmentarzów."
