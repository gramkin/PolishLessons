notes:
  - { kind: false-friend, text: "Русского слова с таким корнем нет, и угадать его невозможно: «кладбище» построено от «класть», то есть по действию погребения, а CMENTARZ пришёл из латыни и означает совсем другой образ. Трудность и в звучании: начальное сочетание CM- для русского уха непривычно, и хочется вставить гласный, но произносить надо слитно. Полезно запомнить и соседние слова: GRÓB «могила», NAGROBEK «надгробие», POGRZEB «похороны», ZNICZ — лампада, которую ставят на могиле. Последнее слово особенно нужно в начале ноября, когда вся страна едет на кладбища." }
  - { kind: usage, text: "Одиннадцать форм, мужской род, неодушевлённое. Местный и звательный единственного — CMENTARZU, с окончанием -U, потому что основа кончается на шипящий RZ. Родительных множественного два: современное CMENTARZY и старое CMENTARZÓW, оба правильны, как у PORYWACZY и PORYWACZÓW из предыдущей партии. Предлог при слове — NA, а не W: идут NA CMENTARZ и бывают NA CMENTARZU, точно так же, как по-русски «на кладбище». Винительный равен именительному." }
  - { kind: pronunciation, text: "Читается «цмэ́нташ», два слога, ударение на первом. Начальное CM произносится слитно, без вставного гласного: «цм». Буква E даёт «э». Буквосочетание RZ в конце слова оглушается и звучит как «ш», а не «ж», поэтому именительный кончается на «таш». В косвенных формах звонкость возвращается: CMENTARZA читается «цмэнта́жа», CMENTARZU — «цмэнта́жу», CMENTARZE — «цмэнта́же»." }
  - { kind: register, text: "Слово нейтральное. Устойчивые сочетания: CMENTARZ KOMUNALNY «городское кладбище», CMENTARZ PARAFIALNY, CMENTARZ WOJSKOWY, CISZA JAK NA CMENTARZU «тишина как на кладбище». Первого ноября, в день Всех Святых, кладбища в Польше освещены тысячами лампад, и день этот называется WSZYSTKICH ŚWIĘTYCH; оборот IŚĆ NA GROBY значит именно это посещение. Переносное CMENTARZYSKO означает место, усеянное останками или обломками: CMENTARZYSKO SAMOCHODÓW «автомобильная свалка»." }
