# review
id: zamiar
format: 2
lemma: "zamiar"
rank: 650
pos: noun
pron: { cyr: "за́мяр" }
senses:
  - id: intend
    ru: "mieć zamiar — собираться, намереваться"
    note: "Самый обиходный способ сказать «собираюсь что-то сделать»."
    examples:
      - pl: "Miałem zamiar ciebie zapytać."
        ru: "Я собирался тебя спросить."
        source: { kind: tatoeba, id: 12681810 }
      - pl: "Mam zamiar spróbować."
        ru: "Я собираюсь попробовать."
        source: { kind: translated, id: 4735506 }
      - pl: "Miałem zamiar tam iść."
        ru: "Я собирался туда пойти."
        source: { kind: translated, id: 531956 }
  - id: no-intention
    ru: "nie mieć zamiaru — не намереваться (с родительным)"
    note: "При отрицании существительное уходит в родительный."
    examples:
      - pl: "Nie miałem takiego zamiaru."
        ru: "У меня не было такого намерения."
        source: { kind: translated, id: 1112138 }
      - pl: "Nie mamy zamiaru przegrać."
        ru: "Мы не намерены проигрывать."
        source: { kind: translated, id: 4940404 }
      - pl: "Nie mam takiego zamiaru."
        ru: "У меня нет такого намерения."
        source: { kind: translated, id: 6553788 }
  - id: intentions
    ru: "zamiary — намерения"
    note: "prawdziwe zamiary «истинные намерения»."
    examples:
      - pl: "Jakie są prawdziwe zamiary Toma?"
        ru: "Каковы истинные намерения Тома?"
        source: { kind: translated, id: 3602922 }
      - pl: "Poznałem jego prawdziwe zamiary dopiero kiedy go spotkałem."
        ru: "Я узнал его истинные намерения, только когда встретил его."
        source: { kind: translated, id: 842094 }
      - pl: "Jestem pewny, że Marko nie ma złych zamiarów względem ciebie."
        ru: "Я уверен, что у Марко нет дурных намерений по отношению к тебе."
        source: { kind: translated, id: 2830206 }
notes:
  - { kind: government, text: "Главный оборот — mieć zamiar плюс инфинитив: Mam zamiar spróbować «Я собираюсь попробовать». Это обиходнее, чем zamierzać." }
  - { kind: government, text: "При отрицании существительное тянет родительный: Nie mam zamiaru «Я не намерен», Nie mamy zamiaru przegrać." }
  - { kind: usage, text: "С предлогом z получается «с намерением»: przyszedł z zamiarem kupienia prezentu «он пришёл с намерением купить подарок»." }
  - { kind: usage, text: "Пословица Mierz siły na zamiary — буквально «соизмеряй силы с намерениями», по-русски «по одёжке протягивай ножки»." }
collocations:
  - { pl: "mieć zamiar", ru: "собираться, намереваться" }
  - { pl: "nie mam zamiaru", ru: "я не намерен" }
  - { pl: "z zamiarem", ru: "с намерением" }
  - { pl: "prawdziwe zamiary", ru: "истинные намерения" }
family:
  - { pl: "zamierzać", ru: "намереваться", relation: derived }
  - { pl: "mierzyć", ru: "мерить", relation: root }
  - { pl: "zamierzenie", ru: "замысел", relation: derived }
etymology: "От zamierzać «намереваться», а то от mierzyć «мерить» — то же гнездо, что русские «мера», «намерение» и «замер»."
memory: "zamiar — «намерение», и запоминать его надо сразу с оборотом: mieć zamiar плюс инфинитив, Mam zamiar spróbować «Я собираюсь попробовать». При отрицании существительное уходит в родительный: Nie mam zamiaru. С предлогом z получается «с намерением»: z zamiarem kupienia prezentu. Корень тот же, что в русском «намерение», — от «мерить»."
idioms:
  - { pl: "mieć zamiar", ru: "собираться, намереваться" }
  - { pl: "nie mam zamiaru", ru: "я не намерен" }
  - { pl: "Mierz siły na zamiary", ru: "По одёжке протягивай ножки" }
formExamplesSkip:
  - { form: "zamiarze", cell: "Звательный", reason: "звательный падеж: для неодушевлённого существительного он практически не употребляется" }
