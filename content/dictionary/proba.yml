# review
id: proba
format: 2
lemma: "próba"
rank: 966
pos: noun
pron: { cyr: "пру́ба" }
senses:
  - id: attempt
    ru: "попытка"
    examples:
      - pl: "Próba nie powiodła się."
        ru: "Попытка не удалась."
        source: { kind: translated, id: 3630976 }
      - pl: "Ta próba zakończyła się porażką."
        ru: "Эта попытка закончилась провалом."
        source: { kind: translated, id: 915159 }
      - pl: "Sami podjął pierwszą próbę."
        ru: "Сами предпринял первую попытку."
        source: { kind: translated, id: 12041077 }
  - id: rehearsal
    ru: "репетиция"
    note: "Значение, которого у русской «пробы» нет: próba — это репетиция спектакля или концерта."
    examples:
      - pl: "Próba jest dzisiaj."
        ru: "Репетиция сегодня."
        source: { kind: translated, id: 11470906 }
      - pl: "Nie mogę iść na próbę bez partytury."
        ru: "Я не могу идти на репетицию без партитуры."
        source: { kind: translated, id: 11484393 }
      - pl: "Próba generalna jest w piątek."
        ru: "Генеральная репетиция в пятницу."
        source: { kind: authored }
  - id: test
    ru: "проба, испытание, выборка"
    examples:
      - pl: "Praca poety przetrwała próbę czasu."
        ru: "Работа поэта выдержала испытание временем."
        source: { kind: translated, id: 10472304 }
      - pl: "Zrobił sobie próbę tuberkulinową."
        ru: "Он сделал себе туберкулиновую пробу."
        source: { kind: translated, id: 643783 }
      - pl: "Sondaż był oparty na próbie osób dorosłych."
        ru: "Опрос был основан на выборке взрослых людей."
        source: { kind: translated, id: 2770375 }
notes:
  - { kind: false-friend, text: "Русская «проба» — это только образец или испытание. У польского próba главное значение другое: «попытка». Podjął próbę значит «он предпринял попытку», а не «взял пробу»." }
  - { kind: usage, text: "Второе неожиданное значение — «репетиция»: Próba jest dzisiaj «Репетиция сегодня», próba generalna «генеральная репетиция», iść na próbę «идти на репетицию»." }
  - { kind: usage, text: "С глаголом podjąć: podjąć próbę czegoś «предпринять попытку чего-то», с родительным падежом. Próba samobójcza — «попытка самоубийства»." }
  - { kind: usage, text: "Значение «проба, испытание» сохраняется в устойчивом przetrwać próbę czasu «выдержать испытание временем» и в metoda prób i błędów «метод проб и ошибок»." }
collocations:
  - { pl: "podjąć próbę", ru: "предпринять попытку" }
  - { pl: "próba generalna", ru: "генеральная репетиция" }
  - { pl: "próba czasu", ru: "испытание временем" }
  - { pl: "próba samobójcza", ru: "попытка самоубийства" }
family:
  - { pl: "próbować", ru: "пробовать, пытаться", relation: root, id: probowac }
  - { pl: "wypróbować", ru: "испытать, опробовать", relation: derived }
  - { pl: "spróbować", ru: "попробовать", relation: derived }
etymology: "Через немецкий из латинского probare «испытывать, проверять» — того же источника, что и русская «проба». Но в польском слово ушло от «образца» к «попытке», а затем и к «репетиции»."
memory: "próba — это прежде всего «попытка», а не «проба»: podjąć próbę «предпринять попытку». Второе значение русскому уху вообще незнакомо — «репетиция»: Próba jest dzisiaj. И только третьим идёт привычная «проба, испытание»: próba czasu."
idioms:
  - { pl: "metoda prób i błędów", ru: "метод проб и ошибок" }
  - { pl: "przetrwać próbę czasu", ru: "выдержать испытание временем" }
  - { pl: "próba generalna", ru: "генеральная репетиция" }
formExamplesSkip:
  - { form: "próbo", reason: "звательный падеж: к попытке не обращаются, форма не употребляется" }
  - { form: "próby", cell: "Звательный", reason: "звательный падеж: к предмету или понятию не обращаются" }
