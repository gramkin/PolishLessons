# review
id: agent
format: 2
lemma: "agent"
rank: 546
pos: noun
pron: { cyr: "а́гэнт" }
senses:
  - id: representative
    ru: "агент, представитель"
    note: "agent nieruchomości «риелтор», agent ubezpieczeniowy «страховой агент»."
    examples:
      - pl: "Jest agentem nieruchomości."
        ru: "Он агент по недвижимости."
        source: { kind: translated, id: 12450194 }
      - pl: "W razie nagłego wypadku skontaktuj się z moim agentem."
        ru: "В случае крайней необходимости свяжись с моим агентом."
        source: { kind: translated, id: 868025 }
      - pl: "Agent ubezpieczeniowy przyszedł po podpis."
        ru: "Страховой агент пришёл за подписью."
        source: { kind: authored }
  - id: secret-agent
    ru: "агент (секретный, специальный)"
    note: "agenci specjalni «спецагенты»."
    examples:
      - pl: "Agenci specjalni chronią go przed atakiem."
        ru: "Специальные агенты защищают его от нападения."
        source: { kind: translated, id: 448845 }
      - pl: "Pod jakim imieniem pracowałeś jako agent?"
        ru: "Под каким именем ты работал агентом?"
        source: { kind: translated, id: 1208088 }
      - pl: "Agent działał pod przykrywką."
        ru: "Агент работал под прикрытием."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Личное мужское множественное — agenci: agenci specjalni. Слово в польском почти всегда о человеке." }
  - { kind: false-friend, text: "Русское «агент» в значении «вещество, средство» по-польски будет środek или czynnik, а не agent: środek czyszczący «чистящее средство»." }
  - { kind: usage, text: "Частые сочетания: agent nieruchomości «риелтор», agent ubezpieczeniowy «страховой агент», agent celny «таможенный агент»." }
  - { kind: usage, text: "Женский род — agentka; отвлечённое существительное — agencja «агентство»." }
collocations:
  - { pl: "agent nieruchomości", ru: "агент по недвижимости" }
  - { pl: "agent specjalny", ru: "спецагент" }
  - { pl: "agent ubezpieczeniowy", ru: "страховой агент" }
  - { pl: "agencja pracy", ru: "кадровое агентство" }
family:
  - { pl: "agencja", ru: "агентство", relation: derived }
  - { pl: "agentka", ru: "агент (женщина)", relation: derived }
etymology: "Из латинского agens «действующий» через немецкое Agent — то же слово, что русское «агент»."
memory: "agent — «агент», и в польском это почти всегда человек: agent nieruchomości «риелтор», agent ubezpieczeniowy «страховой агент», agenci specjalni «спецагенты». Личное множественное — agenci. А вот русский «агент» в смысле вещества или средства по-польски будет środek либо czynnik. Женский род — agentka, агентство — agencja."
idioms:
  - { pl: "agent nieruchomości", ru: "агент по недвижимости" }
  - { pl: "agent specjalny", ru: "спецагент" }
  - { pl: "agent ubezpieczeniowy", ru: "страховой агент" }
