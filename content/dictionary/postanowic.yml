# review
id: postanowic
format: 2
lemma: "postanowić"
rank: 1266
pos: verb
aspect: perf
pron: { cyr: "постано́виць" }
senses:
  - id: decide
    ru: "решить, принять решение"
    examples:
      - pl: "Postanowił spróbować."
        ru: "Он решил попробовать."
        source: { kind: translated, id: 538537 }
      - pl: "Postanowił zostać lekarzem."
        ru: "Он решил стать врачом."
        source: { kind: translated, id: 368414 }
      - pl: "Postanowił odłożyć swój odjazd."
        ru: "Он решил отложить свой отъезд."
        source: { kind: tatoeba, id: 351438 }
  - id: decide-together
    ru: "о совместном решении"
    examples:
      - pl: "Tom i Mary postanowili się pobrać."
        ru: "Том и Мэри решили пожениться."
        source: { kind: translated, id: 13661880 }
      - pl: "Postanowiliśmy przyjąć twój pomysł."
        ru: "Мы решили принять твою идею."
        source: { kind: translated, id: 540100 }
      - pl: "Postanowiliście?"
        ru: "Вы решили?"
        source: { kind: tatoeba, id: 1735674 }
  - id: settled
    ru: "postanowione — решено"
    examples:
      - pl: "Postanowione."
        ru: "Решено."
        source: { kind: translated, id: 818008 }
      - pl: "Nic nie jest postanowione."
        ru: "Ничего не решено."
        source: { kind: translated, id: 4957014 }
      - pl: "Musimy postanowić, kiedy wyruszamy."
        ru: "Мы должны решить, когда выезжаем."
        source: { kind: translated, id: 358892 }
notes:
  - { kind: government, text: "postanowić coś zrobić «решить что-то сделать» — с инфинитивом: Postanowił zostać lekarzem. С придаточным — postanowić, że…" }
  - { kind: usage, text: "Postanowione! «Решено!» — готовая реплика, которой закрывают обсуждение." }
  - { kind: usage, text: "Вид совершенный; несовершенный — postanawiać. Существительное postanowienie значит «решение, постановление»." }
  - { kind: usage, text: "Близкий синоним — zdecydować «решить». Postanowić чуть книжнее и подчёркивает твёрдость намерения." }
collocations:
  - { pl: "postanowić coś zrobić", ru: "решить что-то сделать" }
  - { pl: "postanowione", ru: "решено" }
  - { pl: "postanowienie sądu", ru: "постановление суда" }
etymology: "Приставка po- и stanowić «устанавливать», от stać «стоять». Русское «постановить» собрано ровно теми же частями."
memory: "postanowić — «решить», обычно с инфинитивом: Postanowił zostać lekarzem. Готовая реплика Postanowione! значит «Решено!». Несовершенный вид — postanawiać, существительное — postanowienie."
idioms:
  - { pl: "postanowione", ru: "решено" }
  - { pl: "postanowić coś zrobić", ru: "решить что-то сделать" }
  - { pl: "postanowienie sądu", ru: "постановление суда" }
formExamplesSkip:
  - { form: "postanowieni", reason: "страдательное причастие мужского лица требует человека в винительном падеже, а postanowić человека дополнением не берёт: он управляет инфинитивом или придаточным с że — postanowił zostać lekarzem, postanowili, że zostaną. Поэтому postanowiony говорят о сроке, сумме, разделе имущества (w postanowionym terminie), но не о людях" }
