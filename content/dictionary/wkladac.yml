notes:
  - { kind: false-friend, text: "Одно польское слово отвечает двум русским, и второе значение для русскоговорящего неожиданно. WKŁADAĆ это и «вкладывать, вставлять», и «надевать». WKŁADAĆ LIST DO KOPERTY — вкладывать; WKŁADAĆ PŁASZCZ, WKŁADAĆ BUTY — надевать. По-русски об одежде говорят «надевать», и калька «вкладывать пальто» звучит бессмысленно, а по-польски это единственный обычный способ. Слова UBIERAĆ в этом случае брать нельзя: UBIERAĆ значит «одевать кого-то», UBIERAĆ DZIECKO, а об отдельном предмете одежды говорят WKŁADAĆ. Это одна из самых частых ошибок русскоговорящих в польском быту." }
  - { kind: government, text: "Несовершенный вид, совершенный — WŁOŻYĆ. Что вкладывают — винительный: WKŁADAĆ LIST, WKŁADAĆ PŁASZCZ. Куда — предлог DO с родительным: DO KOPERTY, DO SZUFLADY, или NA с винительным, когда речь о поверхности: WKŁADAĆ NA GŁOWĘ. Шестьдесят три формы, и это на десять больше, чем у совершенного вида: лишние десять — действительное причастие WKŁADAJĄCY, которое бывает только у несовершенных глаголов. У WŁOŻYĆ его нет вовсе, зато деепричастие у него прошедшего времени, WŁOŻYWSZY, тогда как здесь только настоящего, WKŁADAJĄC." }
  - { kind: pronunciation, text: "Читается «фкуа́даць», ударение на предпоследнем слоге из двух. Начальное W перед глухим K оглушается в «ф», а Ł даёт «у», поэтому начало слова звучит «фкуа» — для русского это самое трудное место, потому что на письме видно WKŁ, а слышно три совсем других звука. Конечное -Ć мягкое, «ць». В действительном причастии WKŁADAJĄCY буква Ą перед C звучит «он»: «фкуадайо́нцы». В деепричастии WKŁADAJĄC — «фкуада́йонц»." }
  - { kind: usage, text: "Частотные сочетания: WKŁADAĆ PŁASZCZ, WKŁADAĆ BUTY, WKŁADAĆ OKULARY «надевать очки», WKŁADAĆ DO KOPERTY, WKŁADAĆ WYSIŁEK W COŚ «прилагать усилия к чему-то», WKŁADAĆ SERCE W PRACĘ «вкладывать душу в работу». Существительное WKŁAD означает вклад в обоих смыслах, денежный и переносный: WKŁAD BANKOWY, WKŁAD W NAUKĘ. Рядом стоит WKŁADKA «вкладка, вкладыш». Совершенный вид WŁOŻYĆ уже есть в словаре, как и KŁAŚĆ, от которого всё гнездо идёт." }
