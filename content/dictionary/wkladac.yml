etymology: "Приставка W- и основа -KŁADAĆ, многократная от KŁAŚĆ «класть», из праславянского *klasti. Корень русскому знаком целиком: «класть», «кладу», «клад», «вкладывать». И приём тот же: от основного глагола образуется многократная основа вставкой -A-, KŁAŚĆ даёт KŁADAĆ, и с приставкой выходит WKŁADAĆ — ровно как русское «класть» даёт «кладывать» и затем «вкладывать». Так что слово можно не запоминать, а собрать, и собранное окажется верным по форме. Неверным окажется только значение: русское «вкладывать» не покрывает одежду, а польское покрывает. Из того же гнезда идут WKŁAD «вклад», WKŁADKA «вкладыш», SKŁAD «склад, состав», ZAKŁAD «предприятие, пари» — последнее для русского особенно неочевидно."
memory: "Собирается как русское «вкладывать»: w- плюс многократная основа от kłaść «класть», с вставкой -a-, как «класть — кладывать». Но значит ещё и «надевать»: wkładać płaszcz, wkładać buty — об отдельном предмете одежды только так, а ubierać значит «одевать кого-то». Шестьдесят три формы против пятидесяти трёх у совершенного włożyć: лишние десять — действительное причастие wkładający, которого у совершенного вида не бывает."
