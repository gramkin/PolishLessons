# review
id: popsuc
format: 2
lemma: "popsuć"
rank: 4431
pos: verb
pron: { cyr: "по́псуць" }
senses:
  - id: break
    ru: "сломать, испортить (вещь)"
    examples:
      - pl: "Dziecko popsuło zabawkę."
        ru: "Ребёнок сломал игрушку."
        source: { kind: authored }
      - pl: "Kto popsuł drukarkę?"
        ru: "Кто сломал принтер?"
        source: { kind: authored }
      - pl: "Popsuł mi się telefon."
        ru: "У меня сломался телефон."
        source: { kind: authored }
  - id: spoil
    ru: "испортить (настроение, праздник); испортиться (popsuć się)"
    examples:
      - pl: "Deszcz popsuł nam piknik."
        ru: "Дождь испортил нам пикник."
        source: { kind: authored }
      - pl: "Mleko się popsuło."
        ru: "Молоко испортилось."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "POPSUĆ — разговорный двойник ZEPSUĆ: оба значат «сломать, испортить». POPSUĆ чуть мягче и бытовее: POPSUŁ MI SIĘ ZEGAREK." }
  - { kind: usage, text: "Пятьдесят две формы: страдательное POPSUTY — о вещах, «сломанный, испорченный»; форма для мужчин-людей POPSUCI в карточку не включена — об избалованных людях говорят ZEPSUCI. Спряжение: POPSUJĘ, POPSUJESZ, повелительное POPSUJ. Видовой партнёр — PSUĆ." }
  - { kind: government, text: "Что — винительный, кому — дательный: POPSUĆ KOMUŚ HUMOR, ZABAWĘ. Возвратное POPSUĆ SIĘ — «сломаться, испортиться» с дательным владельца: POPSUŁ MI SIĘ SAMOCHÓD, «у меня сломалась машина»." }
  - { kind: pronunciation, text: "Читается «по́псуць», два слога, ударение на первом. PS — «пс», без гласной между. Конечное Ć — «ць». POPSUJĘ — «попсу́е»." }
  - { kind: register, text: "Разговорное бытовое слово. В литературной речи чаще ZEPSUĆ. Устойчивые: POPSUĆ KOMUŚ HUMOR, POPSUĆ ATMOSFERĘ, POPSUĆ NIESPODZIANKĘ, «испортить сюрприз»." }
collocations:
  - { pl: "popsuć humor", ru: "испортить настроение" }
  - { pl: "popsuł się telefon", ru: "сломался телефон" }
  - { pl: "popsuć niespodziankę", ru: "испортить сюрприз" }
family:
  - { pl: "psuć", ru: "портить", relation: aspect, id: psuc }
  - { pl: "zepsuć", ru: "сломать, испортить", relation: root, id: zepsuc }
  - { pl: "popsuty", ru: "сломанный", relation: derived }
etymology: "Приставка PO- плюс PSUĆ «портить». Происхождение PSUĆ спорно; в русском прямого родственника нет. Приставки PO- и ZE- дают два почти равных совершенных глагола."
memory: "Popsuć — сломать, испортить: popsuć zabawkę, humor, piknik. Popsuł mi się telefon — у меня сломался телефон. Mleko się popsuło — испортилось. Читается «по́псуць»."
idioms:
  - { pl: "popsuć komuś szyki", ru: "спутать кому-то карты" }
formExamplesSkip:
