notes:
  - { kind: false-friend, text: "Русскому «огульный» польское OGÓLNY созвучно, и корень тот же: OGÓŁ, «совокупность, все». Но русское «огульный» значит «без разбора, скопом»: «огульная критика». Польское OGÓLNY — нейтральное «общий»: OGÓLNA LICZBA, OGÓLNE ZASADY. Обратная ловушка: «общий» о совместном — WSPÓLNY, а не OGÓLNY: WSPÓLNY POKÓJ, «общая комната»." }
  - { kind: usage, text: "Полная парадигма: OGÓLNY, OGÓLNIEJSZY, NAJOGÓLNIEJSZY. Степени живые в значении «абстрактный»: BARDZIEJ OGÓLNE PYTANIE, OGÓLNIEJSZA TEORIA. Формы для мужчин-людей OGÓLNI и производные в карточку не включены: людей «общими» не называют." }
  - { kind: government, text: "В общем — OGÓLNIE, наречием, или W OGÓLE, «вообще». Ставится и до, и после существительного: OGÓLNA ZASADA, WRAŻENIE OGÓLNE. LICEUM OGÓLNOKSZTAŁCĄCE — «общеобразовательный лицей»." }
  - { kind: pronunciation, text: "Читается «огу́льны», три слога, ударение на предпоследнем. Ó — «у», L перед N мягкая. Сравните с OGÓLNIE «огу́льне»." }
  - { kind: register, text: "Нейтральное слово, частое в официальной и научной речи: OGÓLNE WARUNKI, «общие условия», CZĘŚĆ OGÓLNA, «общая часть». WIEDZA OGÓLNA — «эрудиция, общие знания»." }
collocations:
  - { pl: "ogólna liczba", ru: "общее число" }
  - { pl: "ogólne warunki", ru: "общие условия" }
  - { pl: "wiedza ogólna", ru: "общие знания, эрудиция" }
family:
  - { pl: "ogół", ru: "совокупность, все", relation: root, id: ogol }
  - { pl: "ogólnie", ru: "в общем, вообще", relation: derived, id: ogolnie }
  - { pl: "ogólnokształcący", ru: "общеобразовательный", relation: derived }
etymology: "От OGÓŁ «совокупность, всё целиком». Родственно русскому старому «огул» — «гуртом, оптом», откуда «огульный». В русском слово ушло к «без разбора», в польском осталось нейтральным «общим»."
memory: "Ogólny — общий: ogólna liczba, ogólne zasady, wiedza ogólna. Не «огульный»! Общий о совместном — wspólny. Ogólniejszy, najogólniejszy. Читается «огу́льны»."
idioms:
  - { pl: "w ogóle", ru: "вообще" }
formExamplesSkip:
