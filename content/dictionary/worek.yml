# review
id: worek
format: 2
lemma: "worek"
rank: 2189
pos: noun
pron: { cyr: "во́рэк" }
senses:
  - id: sack
    ru: "мешок"
    examples:
      - pl: "Worek z mąką waży pięćdziesiąt kilo."
        ru: "Мешок с мукой весит пятьдесят кило."
        source: { kind: authored }
      - pl: "Wsypał ziemniaki do worka."
        ru: "Он насыпал картошку в мешок."
        source: { kind: authored }
  - id: bag
    ru: "мешок, пакет (мусорный, строительный)"
    examples:
      - pl: "Kup worki na śmieci."
        ru: "Купи мусорные мешки."
        source: { kind: authored }
      - pl: "Worek na gruz pęka w szwach."
        ru: "Мешок для строймусора трещит по швам."
        source: { kind: authored }
  - id: under-eyes
    ru: "worki pod oczami — мешки под глазами"
    examples:
      - pl: "Ma worki pod oczami po nocnej zmianie."
        ru: "У него мешки под глазами после ночной смены."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Прозрачного русского родственника нет: «мешок» идёт от совсем другого корня, и опереться на звучание не выйдет. Зато опереться можно на идиомы, и они совпадают дословно. Kupować kota w worku — это «покупать кота в мешке», а worki pod oczami — «мешки под глазами». Оба оборота в польском такие же живые, как в русском." }
  - { kind: pronunciation, text: "БЕГЛОЕ E, И ОНО ИСЧЕЗАЕТ. В именительном worek, но дальше e пропадает: worka, workowi, workiem, worki. Точно так же ведёт себя domek со своим domku. Русский «мешок» теряет о похожим образом, в «мешка», так что механизм знаком, просто звук другой." }
  - { kind: usage, text: "Увеличительная форма wór значит большой мешок, куль; уменьшительная woreczek — мешочек, в том числе медицинский: woreczek żółciowy «жёлчный пузырь». Прилагательное workowaty значит «мешковатый», о плохо сидящей одежде, ровно как в русском." }
collocations:
  - { pl: "worek na śmieci", ru: "мусорный мешок" }
  - { pl: "worek z piaskiem", ru: "мешок с песком" }
  - { pl: "worki pod oczami", ru: "мешки под глазами" }
family:
  - { pl: "wór", ru: "большой мешок, куль", relation: root }
  - { pl: "woreczek", ru: "мешочек", relation: derived }
  - { pl: "workowaty", ru: "мешковатый", relation: derived }
etymology: "От wór «большой мешок», восходящего к корню со значением «запирать, завязывать» — по-видимому, тому же, что в русских «затвор» и «отворить». Русское «мешок» образовано от другого корня, поэтому слова не похожи. Внутри польского гнездо прозрачно: wór, worek, woreczek, workowaty."
memory: "worek — «мешок», и родства с русским словом здесь нет. Зато две идиомы совпадают дословно: kupować kota w worku «покупать кота в мешке» и worki pod oczami «мешки под глазами». И беглое e: worek, но worka, как domek даёт domku."
idioms:
  - { pl: "kupować kota w worku", ru: "покупать кота в мешке" }
  - { pl: "worki pod oczami", ru: "мешки под глазами" }
