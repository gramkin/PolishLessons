family:
  - { pl: "wsiadać", ru: "садиться (несов.)", relation: aspect, id: wsiadac }
  - { pl: "siąść", ru: "сесть", relation: root }
  - { pl: "usiąść", ru: "сесть, присесть", relation: root, id: usiasc }
  - { pl: "wysiąść", ru: "выйти, сойти", relation: antonym }
etymology: "Приставка w- «в» и siąść, из праславянского *sěsti — то же слово, что русское «сесть». Носовой ą взялся из настоящего времени: праславянское *sędǫ дало и польское siądę, и русское «сяду» — формы буквально одного происхождения. Разница в том, что польский потом протащил этот носовой обратно в инфинитив (siąść), а русский оставил «сесть» без него."
memory: "wsiądę — это «сяду», будущее время, а не «сажусь». И после do всегда родительный: wsiąść do pociągu, do autobusu, do taksówki — никогда «do pociąg». Зато na с винительным, как по-русски: wsiąść na rower."
idioms:
  - { pl: "wsiąść na kogoś", ru: "наехать на кого-л., отчитать (разг.)" }
  - { pl: "wsiąść do odjeżdżającego pociągu", ru: "вскочить в уходящий поезд, успеть в последний момент" }
