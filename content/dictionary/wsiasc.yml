notes:
  - { kind: government, text: "ГЛАВНОЕ: WSIĄŚĆ DO CZEGOŚ — РОДИТЕЛЬНЫЙ ПАДЕЖ. Русское «сесть в поезд» ставит винительный, польское wsiąść DO pociągU — родительный, потому что предлог do другого падежа не знает: do pociągu, do autobusu, do samochodu, do taksówki. Ошибка «wsiąść do pociąg» — самая частая у русских." }
  - { kind: government, text: "А вот NA идёт с винительным, как и в русском: wsiąść NA rower, NA konia, NA motor, NA prom. Деление по смыслу то же, что у нас: внутрь закрытого салона — do, верхом или по трапу — na. Так что запоминать надо не выбор предлога, а падеж после do." }
  - { kind: usage, text: "Глагол совершенного вида, и форма WSIĄDĘ значит «сяду», будущее, а не «сажусь». Настоящего времени у него нет вовсе; «сажусь» — это несовершенный WSIADAĆ. Есть деепричастие WSIADŁSZY «сев», но нет форм на -ąc. Страдательного причастия тоже нет: глагол непереходный, отсюда всего 42 формы." }
  - { kind: usage, text: "Основа перебирает три вида: инфинитив WSIĄŚĆ с носовым и мягким -ść, будущее WSIĄDĘ, WSIĄDZIE с d, прошедшее WSIADŁ, WSIEDLI уже без носового и с чередованием a/e. Русское «сесть — сяду — сел» тасует основу ровно так же. Отглагольное существительное WSIĄDNIĘCIE на -nięcie при инфинитиве на -ść выглядит странно, но словарь форм подтверждает: это форма именно глагола wsiąść, отдельного wsiądnąć в языке нет." }
collocations:
  - { pl: "wsiąść do pociągu", ru: "сесть в поезд" }
  - { pl: "wsiąść na rower", ru: "сесть на велосипед" }
