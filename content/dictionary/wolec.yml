# review
id: wolec
format: 2
lemma: "woleć"
rank: 511
pos: verb
aspect: imperf
pron: { cyr: "во́лець" }
senses:
  - id: prefer
    ru: "предпочитать"
    examples:
      - pl: "Wolę angielski."
        ru: "Я предпочитаю английский."
        source: { kind: tatoeba, id: 2144058 }
      - pl: "Wolę kawę od herbaty."
        ru: "Предпочитаю чаю кофе."
        source: { kind: tatoeba, id: 415231 }
      - pl: "Ona woli piwo od wina."
        ru: "Она любит пиво больше, чем вино."
        source: { kind: tatoeba, id: 495073 }
  - id: would-rather
    ru: "предпочитать (в вопросах и с инфинитивом)"
    examples:
      - pl: "Wolisz kapitalizm czy socjalizm?"
        ru: "Предпочитаешь капитализм или социализм?"
        source: { kind: tatoeba, id: 1866780 }
      - pl: "Wolałbym zostać."
        ru: "Я предпочёл бы остаться."
        source: { kind: translated, id: 8507451 }
      - pl: "Jedni wolą morze, inni góry."
        ru: "Одни предпочитают море, другие — горы."
        source: { kind: tatoeba, id: 733096 }
notes:
  - { kind: false-friend, text: "Управление не такое, как в русском: предпочитают X od Y — с предлогом od и родительным, а не дательным. Wolę kawę od herbaty «Предпочитаю кофе чаю»." }
  - { kind: usage, text: "Второй вариант той же конструкции — wolę X niż Y: Wolałabym zostać w domu niż iść na ryby." }
  - { kind: usage, text: "Условное wolałbym «я бы предпочёл» — самая вежливая форма отказа: Wolałbym zostać." }
  - { kind: false-friend, text: "Не путайте woli «предпочитает» с woli — родительным от wola «воля». Tom zrobił to wbrew swojej woli — здесь это существительное «воля»." }
collocations:
  - { pl: "wolę kawę od herbaty", ru: "предпочитаю кофе чаю" }
  - { pl: "wolałbym nie", ru: "я бы предпочёл не" }
  - { pl: "co wolisz?", ru: "что ты предпочитаешь?" }
  - { pl: "wolę zostać", ru: "я предпочитаю остаться" }
etymology: "Праславянское *volěti «предпочитать», от *volja «воля». Русские «воля» и «изволить» — то же гнездо: предпочесть значит склонить волю."
memory: "woleć — «предпочитать», и корень тот же, что в русской «воле»: предпочесть значит склонить волю. Главное — управление: предпочитают X od Y, с предлогом и родительным, а не дательным. Wolę kawę od herbaty «Предпочитаю кофе чаю». А условное wolałbym «я бы предпочёл» — самая вежливая форма отказа."
idioms:
  - { pl: "co kogo boli, o tym mówić woli", ru: "у кого что болит, тот о том и говорит" }
  - { pl: "wolałbym nie", ru: "я бы предпочёл не" }
  - { pl: "wolę nie wiedzieć", ru: "предпочитаю не знать" }
