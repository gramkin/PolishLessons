# review
id: wyjasniac
format: 2
lemma: "wyjaśniać"
rank: 2445
pos: verb
pron: { cyr: "выя́щняць" }
senses:
  - id: explain
    ru: "объяснять"
    examples:
      - pl: "Nauczyciel wyjaśniał zadanie po raz trzeci."
