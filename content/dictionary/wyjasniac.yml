        source: { kind: authored }
      - pl: "Wyjaśniam ci to ostatni raz."
        ru: "Я объясняю тебе это последний раз."
        source: { kind: authored }
  - id: clarify
    ru: "выяснять, прояснять"
    examples:
      - pl: "Policja wyjaśnia okoliczności wypadku."
        ru: "Полиция выясняет обстоятельства аварии."
        source: { kind: authored }
      - pl: "Sprawa wyjaśniała się powoli."
        ru: "Дело выяснялось медленно."
        source: { kind: authored }
  - id: explanation
    ru: "объяснение, выяснение (отглаг.)"
    examples:
      - pl: "Wyjaśnianie zajęło pół godziny."
        ru: "Объяснение заняло полчаса."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ОДНО ПОЛЬСКОЕ СЛОВО ПОКРЫВАЕТ ДВА РУССКИХ. По частям wyjaśniać это wy- плюс jasny «ясный», то есть точное соответствие русскому «выяснять». Но польский глагол значит ещё и «объяснять»: nauczyciel wyjaśnia zadanie. Русский делит эти два смысла на «выяснять» и «объяснять», поэтому переводить надо по контексту, глядя, кто кому что проясняет." }
  - { kind: usage, text: "Рядом живёт TŁUMACZYĆ, и оно тоже значит «объяснять»: tłumaczę ci to od godziny. При этом tłumaczyć — ещё и «переводить» с языка на язык. Так что «объяснить» можно сказать двумя глаголами, а «перевести» — только одним. Управление обычное: wyjaśniać COŚ KOMUŚ, винительный плюс дательный, как по-русски." }
  - { kind: usage, text: "Вид несовершенный: есть WYJAŚNIAJĄC «объясняя» и причастие WYJAŚNIAJĄCY, а деепричастия на -wszy нет. Совершенная пара — WYJAŚNIĆ: wyjaśniam «объясняю», wyjaśnię «объясню». Существительное wyjaśnienie значит «объяснение» и «разъяснение»." }
collocations:
  - { pl: "wyjaśniać zadanie", ru: "объяснять задание" }
  - { pl: "wyjaśniać okoliczności", ru: "выяснять обстоятельства" }
  - { pl: "wyjaśniać nieporozumienie", ru: "выяснять недоразумение" }
family:
  - { pl: "wyjaśnić", ru: "объяснить (сов.)", relation: aspect, id: wyjasnic }
  - { pl: "jasny", ru: "ясный, светлый", relation: root, id: jasny }
  - { pl: "tłumaczyć", ru: "объяснять; переводить", relation: root, id: tlumaczyc }
etymology: "Приставка wy- и jasny «ясный», из праславянского *jasnъ. Русские «ясный», «выяснить» и «объяснить» — тот же корень, и польское слово собрано ровно как «выяснять». Отсюда jaśnieć «сиять» и wyjaśnienie «объяснение»."
memory: "wyjaśniać — и «объяснять», и «выяснять»: одно польское слово на два русских. По частям это wy- плюс jasny «ясный», как «выяснять». Несовершенный вид: wyjaśniając есть, -wszy нет, совершенная пара wyjaśnić."
idioms:
  - { pl: "wyjaśniać nieporozumienie", ru: "выяснять недоразумение" }
  - { pl: "sprawa się wyjaśnia", ru: "дело проясняется" }
formExamplesSkip:
  - { form: "wyjaśniani", reason: "Мужско-личная форма страдательного причастия образуется по общему правилу, но глагол управляет названиями дел, причин и обстоятельств, а не лиц: выясняют сомнения, обстоятельства, недоразумение, но не человека. Подлежащего, с которым эта форма могла бы согласоваться, в языке не возникает." }
