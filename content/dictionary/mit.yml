pos: noun
pron: { cyr: "мит" }
senses:
  - id: myth
    ru: "миф (сказание)"
    examples:
      - pl: "Grecki mit opowiada o Prometeuszu."
        ru: "Греческий миф рассказывает о Прометее."
        source: { kind: authored }
      - pl: "Dzieci czytają mity greckie."
        ru: "Дети читают греческие мифы."
        source: { kind: authored }
      - pl: "W micie bohater pokonuje potwora."
        ru: "В мифе герой побеждает чудовище."
        source: { kind: authored }
  - id: misconception
    ru: "миф, заблуждение"
    examples:
      - pl: "To mit, że złota rybka pamięta tylko trzy sekundy."
        ru: "Это миф, что золотая рыбка помнит только три секунды."
        source: { kind: authored }
      - pl: "Obalił kilka mitów o zdrowiu."
        ru: "Он развенчал несколько мифов о здоровье."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "MIT — «миф», читается «мит», с T. Мифология — MITOLOGIA. Развенчать миф — OBALIĆ MIT. Легенда — LEGENDA, сказка — BAŚŃ, BAJKA." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Родительный — MITU. В местном T переходит в C: W MICIE." }
  - { kind: government, text: "Миф о чём — MIT O и местный: MIT O STWORZENIU ŚWIATA. Развенчать миф — OBALIĆ MIT, винительный. Согласно мифу — WEDŁUG MITU." }
  - { kind: pronunciation, text: "Читается «мит», один слог. MICIE — «ми́це»." }
collocations:
  - { pl: "mit grecki", ru: "греческий миф" }
  - { pl: "obalić mit", ru: "развенчать миф" }
  - { pl: "miejski mit", ru: "городская легенда" }
family:
  - { pl: "mitologia", ru: "мифология", relation: derived }
  - { pl: "legenda", ru: "легенда", relation: root, id: legenda }
  - { pl: "bajka", ru: "сказка", relation: root, id: bajka }
etymology: "Из греческого MYTHOS «слово, рассказ». Польское T на месте греческого TH, русское Ф — на его же месте."
memory: "Mit — миф, читается «мит». Obalić mit — развенчать миф. W micie — в мифе."
