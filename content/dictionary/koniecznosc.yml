# review
id: koniecznosc
format: 2
lemma: "konieczność"
rank: 2457
pos: noun
pron: { cyr: "коне́чносьць" }
senses:
  - id: necessity
    ru: "необходимость, нужда"
    examples:
      - pl: "Podkreślaliśmy konieczność współpracy z jego strony."
        ru: "Мы подчёркивали необходимость сотрудничества с его стороны."
        source: { kind: translated, id: 731905 }
      - pl: "Nienawidzimy przemocy, ale uznajemy jej konieczność w imię ładu i porządku."
        ru: "Мы ненавидим насилие, но признаём его необходимость во имя порядка."
        source: { kind: translated, id: 742518 }
      - pl: "Dzisiaj małżeństwo nie jest już dla kobiety koniecznością."
        ru: "Сегодня брак для женщины уже не является необходимостью."
        source: { kind: translated, id: 352241 }
  - id: in-case-of
    ru: "нужда (в обороте w razie konieczności)"
    examples:
      - pl: "Jego żona z konieczności poszła do pracy."
        ru: "Его жена по необходимости пошла работать."
        source: { kind: translated, id: 730586 }
      - pl: "W razie konieczności rozbierz to na części."
        ru: "В случае необходимости разбери это на части."
        source: { kind: translated, id: 6406260 }
notes:
  - { kind: government, text: "Женский род на -ość: ta konieczność, tej konieczności. Все такие слова женские." }
  - { kind: usage, text: "Запомните два оборота целиком: z konieczności «по необходимости, поневоле» и w razie konieczności «в случае необходимости»." }
  - { kind: false-friend, text: "От konieczny «необходимый», которое уже есть в словаре. Не от «конец»: сходство с русским «конечный» обманчиво." }
  - { kind: usage, text: "Творительный koniecznością нужен после być: jest koniecznością «является необходимостью»." }
collocations:
  - { pl: "z konieczności", ru: "по необходимости" }
  - { pl: "w razie konieczności", ru: "в случае необходимости" }
etymology: "От konieczny «необходимый». Суффикс -ość образует отвлечённые существительные, как русское -ость."
memory: "konieczność — «необходимость», женского рода, как все слова на -ość. Два оборота наизусть: z konieczności «поневоле» и w razie konieczności «в случае чего»."
idioms:
  - { pl: "z konieczności", ru: "по необходимости" }
  - { pl: "w razie konieczności", ru: "в случае необходимости" }
