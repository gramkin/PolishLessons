# review
id: najpierw
format: 2
lemma: "najpierw"
rank: 480
pos: adv
pron: { cyr: "на́йперф" }
senses:
  - id: first
    ru: "сначала, сперва"
    examples:
      - pl: "Najpierw pomaluj sufit."
        ru: "Сначала покрась потолок."
        source: { kind: tatoeba, id: 10468712 }
      - pl: "Chciałam najpierw pokazać tobie."
        ru: "Я хотела сперва показать тебе."
        source: { kind: tatoeba, id: 13660066 }
      - pl: "Najpierw zjedz, potem idź."
        ru: "Сначала поешь, потом иди."
        source: { kind: authored }
  - id: order
    ru: "сначала, в первую очередь (о порядке)"
    examples:
      - pl: "Długopis został wynaleziony w roku 1938 przez dwóch braci, Węgrów, i wszedł do sprzedaży najpierw w Argentynie."
        ru: "Шариковая ручка была изобретена в 1938 году двумя братьями-венграми, а в продаже она впервые появилась в Аргентине."
        source: { kind: tatoeba, id: 1002722 }
      - pl: "Najpierw pomyśl, potem mów."
        ru: "Сначала подумай, потом говори."
        source: { kind: authored }
      - pl: "Najpierw ty, potem ja."
        ru: "Сначала ты, потом я."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Ходовая пара najpierw… potem — «сначала… потом»: Najpierw zjedz, potem idź." }
  - { kind: usage, text: "Слово — застывшая превосходная степень от pierwszy «первый», сокращение от najpierwej: буквально «самое первое»." }
  - { kind: false-friend, text: "Не путайте najpierw «сначала» с po pierwsze «во-первых»: второе вводит перечисление доводов, а не порядок действий." }
  - { kind: usage, text: "Близкий синоним — na początku «в начале»; najpierw чаще о последовательности действий." }
collocations:
  - { pl: "najpierw... potem", ru: "сначала... потом" }
  - { pl: "co najpierw?", ru: "что сначала?" }
  - { pl: "najpierw obowiązki", ru: "сначала дела" }
etymology: "Сокращение от najpierwej — превосходной степени прилагательного pierwszy «первый». Буквально «самое первое»."
memory: "najpierw — «сначала, сперва», и внутри сидит pierwszy «первый». Запоминайте парой: najpierw… potem «сначала… потом»."
idioms:
