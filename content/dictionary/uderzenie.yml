  - id: attack
    ru: "удар, стремительное наступление (военное)"
    examples:
      - pl: "Wojsko przygotowało uderzenie na miasto."
        ru: "Армия подготовила удар по городу."
        source: { kind: authored }
      - pl: "Uderzenie wyprzedzające zaskoczyło wroga."
        ru: "Упреждающий удар застал врага врасплох."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Русское «удар» в медицинском смысле — это не UDERZENIE, а UDAR: UDAR MÓZGU «инсульт», UDAR SŁONECZNY «солнечный удар». UDERZENIE — только физический удар, толчок, стук или военный удар. Удар судьбы чаще передают через CIOS: CIOS LOSU." }
  - { kind: government, text: "Куда бьют — W + винительный: UDERZENIE W GŁOWĘ «удар по голове», где русский берёт «по» с дательным. Обо что ударяются — O + винительный: UDERZENIE O ŚCIANĘ. Военный удар по кому-то — NA + винительный: UDERZENIE NA MIASTO." }
  - { kind: usage, text: "Отглагольное существительное от UDERZYĆ «ударить», средний род на -ENIE. Восемь форм: в единственном UDERZENIE, UDERZENIA, UDERZENIU, UDERZENIEM; родительный множественного — UDERZEŃ. Устойчивые сочетания: UDERZENIE PIORUNA «удар молнии», UDERZENIE SERCA «удар сердца», UDERZENIA GORĄCA «приливы жара»." }
  - { kind: pronunciation, text: "Читается «удэже́не»: RZ звучит как «ж», NIE — как «не». Ударение на предпоследнем слоге, в родительном множественного UDERZEŃ — «удэ́жэнь»." }
collocations:
  - { pl: "uderzenie pioruna", ru: "удар молнии" }
  - { pl: "silne uderzenie", ru: "сильный удар" }
  - { pl: "uderzenie w głowę", ru: "удар по голове" }
  - { pl: "uderzenia serca", ru: "удары сердца" }
family:
  - { pl: "uderzyć", ru: "ударить", relation: root, id: uderzyc }
  - { pl: "uderzać", ru: "ударять", relation: root, id: uderzac }
  - { pl: "cios", ru: "удар", relation: root, id: cios }
  - { pl: "uderzeniowy", ru: "ударный", relation: derived }
etymology: "Отглагольное существительное от UDERZYĆ: приставка U- и старый корень *der- «бить, драть», тот же, что в русском «ударить» и «удар»."
memory: "Uderzenie — «удар»: от uderzyć «ударить», как русское «удар» от «ударить». Но инсульт — udar, а не uderzenie. Uderzenie pioruna — удар молнии."
idioms:
  - { pl: "uderzenie pioruna", ru: "удар молнии; как гром среди ясного неба" }
  - { pl: "uderzenia gorąca", ru: "приливы жара" }
