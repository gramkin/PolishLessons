      - pl: "Drużyna z Oksfordu była przekonana o swoim zwycięstwie."
        ru: "Команда из Оксфорда была уверена в своей победе."
        source: { kind: tatoeba, id: 675519 }
notes:
  - { kind: government, text: "Одержать победу — odnieść zwycięstwo (винительный падеж); быть уверенным в победе — być pewnym zwycięstwa (родительный)." }
  - { kind: usage, text: "mieć zwycięstwo w kieszeni — «победа в кармане», о деле решённом; выражение совпадает с русским." }
  - { kind: usage, text: "pyrrusowe zwycięstwo — «пиррова победа», победа ценой слишком больших потерь." }
  - { kind: false-friend, text: "Слово собрано из zwyciężyć «победить», того же корня, что русское «победа» через «выиграть у противника»; узнать его помогает zwycięzca «победитель»." }
collocations:
  - { pl: "odnieść zwycięstwo", ru: "одержать победу" }
  - { pl: "pewny zwycięstwa", ru: "уверенный в победе" }
  - { pl: "łatwe zwycięstwo", ru: "лёгкая победа" }
family:
  - { pl: "zwyciężyć", ru: "победить", relation: root }
