  - { pl: "wygrać", ru: "выиграть", relation: root, id: wygrac }
etymology: "От zwyciężyć «победить», приставка z- плюс корень «вязать, одолевать». Русское «победа» построено от «беда», то есть «одоление беды», — образ другой."
memory: "zwycięstwo — «победа»: odnieść zwycięstwo «одержать победу», pewny zwycięstwa «уверенный в победе». Победитель — zwycięzca."
