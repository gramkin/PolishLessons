  - id: victory-of
    ru: "победа (чья-либо, уверенность в ней)"
    examples:
      - pl: "Jestem pewien jego zwycięstwa."
        ru: "Я уверен в его победе."
        source: { kind: tatoeba, id: 777756 }
      - pl: "Wszyscy cieszyli się z jej zwycięstwa."
        ru: "Все радовались её победе."
