# review
id: zwyciestwo
format: 2
lemma: "zwycięstwo"
rank: 1730
pos: noun
pron: { cyr: "звыце́нстфо" }
senses:
  - id: victory
    ru: "победа"
    examples:
      - pl: "Odnieśli zwycięstwo."
        ru: "Они одержали победу."
        source: { kind: tatoeba, id: 1603988 }
      - pl: "To łatwe zwycięstwo."
        ru: "Это лёгкая победа."
        source: { kind: tatoeba, id: 547980 }
      - pl: "Zwycięstwo albo śmierć!"
        ru: "Победа или смерть!"
        source: { kind: tatoeba, id: 6067370 }
  - id: victory-of
    ru: "победа (чья-либо, уверенность в ней)"
    examples:
      - pl: "Jestem pewien jego zwycięstwa."
        ru: "Я уверен в его победе."
        source: { kind: tatoeba, id: 777756 }
      - pl: "Wszyscy cieszyli się z jej zwycięstwa."
        ru: "Все радовались её победе."
        source: { kind: tatoeba, id: 9417683 }
      - pl: "Drużyna z Oksfordu była przekonana o swoim zwycięstwie."
        ru: "Команда из Оксфорда была уверена в своей победе."
        source: { kind: tatoeba, id: 675519 }
notes:
  - { kind: government, text: "Одержать победу — odnieść zwycięstwo (винительный падеж); быть уверенным в победе — być pewnym zwycięstwa (родительный)." }
  - { kind: usage, text: "mieć zwycięstwo w kieszeni — «победа в кармане», о деле решённом; выражение совпадает с русским." }
  - { kind: usage, text: "pyrrusowe zwycięstwo — «пиррова победа», победа ценой слишком больших потерь." }
  - { kind: false-friend, text: "Слово собрано из zwyciężyć «победить», того же корня, что русское «победа» через «выиграть у противника»; узнать его помогает zwycięzca «победитель»." }
collocations:
  - { pl: "odnieść zwycięstwo", ru: "одержать победу" }
  - { pl: "pewny zwycięstwa", ru: "уверенный в победе" }
  - { pl: "łatwe zwycięstwo", ru: "лёгкая победа" }
family:
  - { pl: "zwyciężyć", ru: "победить", relation: root }
  - { pl: "zwycięzca", ru: "победитель", relation: root }
  - { pl: "wygrać", ru: "выиграть", relation: root, id: wygrac }
etymology: "От zwyciężyć «победить», приставка z- плюс корень «вязать, одолевать». Русское «победа» построено от «беда», то есть «одоление беды», — образ другой."
memory: "zwycięstwo — «победа»: odnieść zwycięstwo «одержать победу», pewny zwycięstwa «уверенный в победе». Победитель — zwycięzca."
idioms:
  - { pl: "odnieść zwycięstwo", ru: "одержать победу" }
  - { pl: "pyrrusowe zwycięstwo", ru: "пиррова победа" }
  - { pl: "mieć zwycięstwo w kieszeni", ru: "победа в кармане" }
