  - form: "ogólnie"
    pl: "Ogólnie jestem zadowolony."
    ru: "В целом я доволен."
    source: { kind: authored }
  - form: "ogólnie"
    pl: "To ogólnie znany fakt."
    ru: "Это общеизвестный факт."
