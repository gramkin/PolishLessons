# review
id: ogolnie
format: 2
lemma: "ogólnie"
rank: 4995
pos: adv
pron: { cyr: "огу́льне" }
senses:
  - id: generally
    ru: "в общем, в целом"
    examples:
      - pl: "Ogólnie było miło."
        ru: "В целом было приятно."
        source: { kind: authored }
      - pl: "Jak tam ogólnie u ciebie?"
        ru: "Как у тебя вообще дела?"
        source: { kind: authored }
      - pl: "Ogólnie się zgadzam, ale mam kilka uwag."
        ru: "В целом я согласен, но есть пара замечаний."
        source: { kind: authored }
  - id: commonly
    ru: "обще-, всеми, повсеместно"
    examples:
      - pl: "Ta zasada jest ogólnie przyjęta."
        ru: "Это правило общепринято."
        source: { kind: authored }
      - pl: "Park jest ogólnie dostępny."
        ru: "Парк общедоступен."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "OGÓLNIE — «в общем», а вовсе не «огульно», хотя звучит похоже. Русское «огульно», «без разбора» по-польски — BEZ WYJĄTKU или HURTEM. OGÓLNIE MÓWIĄC — «вообще говоря»." }
  - { kind: usage, text: "Наречие со степенями: OGÓLNIE, OGÓLNIEJ, NAJOGÓLNIEJ. Превосходная живёт в устойчивом обороте NAJOGÓLNIEJ MÓWIĄC, «если совсем обобщить». С причастиями даёт русские сложные слова на «обще-»: OGÓLNIE ZNANY, «общеизвестный»." }
  - { kind: government, text: "Наречие ничем не управляет. Противоположность — SZCZEGÓŁOWO, «подробно», или KONKRETNIE, «конкретно»." }
  - { kind: pronunciation, text: "Читается «огу́льне», ударение на предпоследнем слоге. Ó — «у», L перед N мягкое." }
collocations:
  - { pl: "ogólnie mówiąc", ru: "вообще говоря" }
  - { pl: "ogólnie znany", ru: "общеизвестный" }
  - { pl: "ogólnie dostępny", ru: "общедоступный" }
family:
  - { pl: "ogólny", ru: "общий", relation: root }
  - { pl: "ogół", ru: "совокупность; все, общество", relation: root, id: ogol }
  - { pl: "ogółem", ru: "всего, в итоге", relation: root }
etymology: "От OGÓLNY «общий», а то — от OGÓŁ «целое, совокупность»: OGÓŁ SPOŁECZEŃSTWA, «всё общество». Ó и O чередуются: OGÓŁ, OGÓŁU."
memory: "Ogólnie — в общем, не «огульно». Читается «огу́льне». Ogólnie mówiąc — вообще говоря. Ogólnie znany — общеизвестный."
idioms:
  - { pl: "ogólnie rzecz biorąc", ru: "в общем и целом" }
