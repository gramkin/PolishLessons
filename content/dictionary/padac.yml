      - pl: "Już przestało padać."
        ru: "Дождь уже перестал."
        source: { kind: tatoeba, id: 3702200 }
  - id: rain-with-subject
    ru: "идти (с названным подлежащим: deszcz, śnieg)"
    examples:
      - pl: "Deszcz pada."
        ru: "Идёт дождь."
        source: { kind: tatoeba, id: 349034 }
      - pl: "Padał śnieg."
        ru: "Шёл снег."
        source: { kind: tatoeba, id: 3759904 }
