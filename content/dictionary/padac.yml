        source: { kind: tatoeba, id: 360236 }
  - id: fall
    ru: "падать"
    examples:
      - pl: "Padając, zranił sobie lewą nogę."
        ru: "Падая, он поранил левую ногу."
        source: { kind: translated, id: 356548 }
      - pl: "Padali jak muchy."
        ru: "Они падали как мухи."
        source: { kind: translated, id: 8617777 }
  - id: collapse
    ru: "валиться с ног, изнемогать"
    examples:
      - pl: "Dosłownie padam z nóg ze zmęczenia."
        ru: "Я буквально валился с ног от усталости."
        source: { kind: tatoeba, id: 12470138 }
      - pl: "Padam z nóg!"
        ru: "Я валюсь с ног!"
        source: { kind: translated, id: 8608273 }
      - pl: "Padam na pysk."
        ru: "Я падаю с ног."
        source: { kind: translated, id: 10593848 }
notes:
  - { kind: usage, text: "Будущее время об осадках — тоже без подлежащего: Jutro będzie padać «Завтра будет дождь». Подлежащее добавляют, только когда важно, что именно идёт: będzie padał śnieg, będzie padała mżawka." }
  - { kind: usage, text: "ГЛАВНОЕ: о погоде поляк говорит БЕЗ подлежащего. Pada. — «Идёт дождь». Русскому нужно подлежащее («дождь»), польскому — нет. Ошибка «Deszcz idzie» выдаёт русскоговорящего с головой." }
  - { kind: usage, text: "Подлежащее добавляют, только когда важно, что именно идёт: Pada śnieg «Идёт снег», Pada deszcz «Идёт дождь». Само по себе Pada. всегда значит дождь." }
  - { kind: government, text: "В прошедшем времени безличная форма среднего рода: Padało «Шёл дождь», Wczoraj padało «Вчера шёл дождь». С подлежащим — согласование: padał śnieg, padała mżawka." }
  - { kind: false-friend, text: "Глагол «идти» о дожде по-польски не работает: осадки именно «падают». Зато русское «падать» и польское padać — одно слово, и в прямом значении совпадают полностью." }
  - { kind: usage, text: "Совершенный вид к «упасть» — upaść или paść; у «пошёл дождь» совершенного вида нет, говорят zaczęło padać «начался дождь»." }
  - { kind: usage, text: "Падать жертвой — padać ofiarą czegoś, с творительным падежом." }
collocations:
  - { pl: "pada deszcz", ru: "идёт дождь" }
  - { pl: "pada śnieg", ru: "идёт снег" }
  - { pl: "padać z nóg", ru: "валиться с ног" }
  - { pl: "padać ofiarą", ru: "становиться жертвой" }
etymology: "Праславянское *padati; русское «падать» — то же слово. Значение «идти» об осадках развилось из образа падения с неба."
memory: "padać — и «падать», и «идти» о дожде. Запомните главное: о погоде поляк обходится БЕЗ подлежащего — Pada. значит «Идёт дождь», а Padało — «Шёл дождь». Подлежащее добавляют, только чтобы уточнить: pada śnieg. И не говорите «Deszcz idzie» — осадки в польском падают, а не идут."
idioms:
  - { pl: "padać z nóg", ru: "валиться с ног" }
  - { pl: "padać jak muchy", ru: "мереть как мухи" }
  - { pl: "padać ofiarą", ru: "становиться жертвой" }
