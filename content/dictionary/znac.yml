# review
id: znac
format: 2
depth: deep
lemma: "znać"
rank: 105
pos: verb
aspect: imperf
pron: { cyr: "знаць" }
senses:
  - id: know-someone
    ru: "знать, быть знакомым (с кем-л.)"
    examples:
      - pl: "Znam go."
        ru: "Я знаю его."
        source: { kind: tatoeba, id: 561584 }
      - pl: "On zna Mary."
        ru: "Он знает Мэри."
        source: { kind: tatoeba, id: 3375603 }
      - pl: "Znasz ich?"
        ru: "Ты их знаешь?"
        source: { kind: tatoeba, id: 1862057 }
  - id: know-something
    ru: "знать (язык, ответ, дело)"
    examples:
      - pl: "Tom chciał znać prawdę."
        ru: "Том хотел знать правду."
        source: { kind: tatoeba, id: 5369949 }
      - pl: "Tom znał rosyjski lepiej niż angielski."
        ru: "Том русский знал лучше, чем английский."
        source: { kind: tatoeba, id: 10768443 }
  - id: be-expert
    ru: "znać się na czymś — разбираться в чём-либо"
    examples:
      - pl: "Nie znam się na tym."
        ru: "Я в этом не разбираюсь."
        source: { kind: authored }
      - pl: "On zna się na komputerach."
        ru: "Он разбирается в компьютерах."
        source: { kind: authored }
      - pl: "Znamy się od lat."
        ru: "Мы знакомы много лет."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "znać — быть знакомым с кем-то или чем-то, wiedzieć — знать факт: Znam Tomka, ale nie wiem, gdzie mieszka." }
  - { kind: usage, text: "Оборот dać znać значит «дать знать, сообщить»." }
  - { kind: usage, text: "Возвратное znać się меняет смысл дважды: znamy się «мы знакомы друг с другом», но znać się na czymś «разбираться в чём-то». Это один из самых заметных сдвигов, которые даёт się." }
  - { kind: government, text: "znać требует прямого дополнения в винительном: znam ten film. При отрицании — родительный: nie znam tego filmu." }
collocations:
  - { pl: "dać znać", ru: "дать знать" }
  - { pl: "znać na pamięć", ru: "знать наизусть" }
  - { pl: "znać jak własną kieszeń", ru: "знать как свои пять пальцев" }
etymology: "Праславянское *znati — то же слово, что русское «знать»; отсюда же znak «знак» и znajomy «знакомый»."
memory: "Пара, которой в русском нет: znać — быть знакомым с кем-то или чем-то, wiedzieć — знать факт. Znam Tomka, ale nie wiem, gdzie mieszka. Отсюда же znajomy «знакомый» и dać znać «дать знать»."
idioms:
  - { pl: "dać znać", ru: "дать знать" }
  - { pl: "znać jak własną kieszeń", ru: "знать как свои пять пальцев" }
  - { pl: "nie znać umiaru", ru: "не знать меры" }
