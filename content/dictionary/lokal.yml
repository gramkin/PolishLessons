# review
id: lokal
format: 2
lemma: "lokal"
rank: 3961
pos: noun
pron: { cyr: "ло́каль" }
senses:
  - id: venue
    ru: "заведение (кафе, бар, ресторан)"
    examples:
      - pl: "Ten lokal jest otwarty do późna."
        ru: "Это заведение работает допоздна."
        source: { kind: authored }
      - pl: "Spotkajmy się w jakimś lokalu w centrum."
        ru: "Давай встретимся в каком-нибудь кафе в центре."
        source: { kind: authored }
      - pl: "Właściciel lokalu wyprosił pijanych gości."
        ru: "Хозяин заведения выпроводил пьяных гостей."
        source: { kind: authored }
  - id: premises
    ru: "помещение; квартира (юр.)"
    examples:
      - pl: "Wynajmujemy lokal na parterze."
        ru: "Мы снимаем помещение на первом этаже."
        source: { kind: authored }
      - pl: "Lokal mieszkalny ma sześćdziesiąt metrów."
        ru: "Жилое помещение площадью шестьдесят метров."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "LOKAL — «заведение» или «помещение», а не «местный»: «местный» — LOKALNY. Ещё ловушка рядом: LOKATOR — «жилец, квартиросъёмщик», а не «локатор». LOKAL WYBORCZY — «избирательный участок»." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Родительный — LOKALU. Во множественном — LOKALE, в родительном две формы: LOKALI и LOKALÓW." }
  - { kind: government, text: "В заведении — W LOKALU, местный. Помещение под магазин — LOKAL POD SKLEP, POD с винительным. Помещение на первом этаже — LOKAL NA PARTERZE." }
  - { kind: pronunciation, text: "Читается «ло́каль», ударение на первом слоге. Конечное L — «ль»." }
collocations:
  - { pl: "lokal gastronomiczny", ru: "заведение общепита" }
  - { pl: "lokal wyborczy", ru: "избирательный участок" }
  - { pl: "lokal mieszkalny", ru: "жилое помещение" }
family:
  - { pl: "lokalny", ru: "местный", relation: root, id: lokalny }
  - { pl: "lokator", ru: "жилец, квартиросъёмщик", relation: root }
  - { pl: "lokalizacja", ru: "местоположение", relation: root, id: lokalizacja }
etymology: "Из латыни, от слова LOCUS «место». В польском LOKAL стал «помещением», а потом и «заведением»."
memory: "Lokal — заведение, помещение; lokalny — местный; lokator — жилец. Читается «ло́каль». Lokal wyborczy — избирательный участок."
idioms:
