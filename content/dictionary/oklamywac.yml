        source: { kind: authored }
notes:
  - { kind: government, text: "ПРИСТАВКА МЕНЯЕТ УПРАВЛЕНИЕ: KŁAMAĆ БЕЗ ДОПОЛНЕНИЯ, OKŁAMYWAĆ KOGOŚ С ВИНИТЕЛЬНЫМ. Голое kłamać значит просто «лгать» и дополнения не берёт: on kłamie «он лжёт». А okłamywać требует прямого дополнения-человека: okłamywać matkę, okłamywać klientów. Русский тут разводит два глагола — «лгать кому-л.» с дательным и «обманывать кого-л.» с винительным; польскому соответствует второй, и дательного после okłamywać не бывает." }
  - { kind: usage, text: "Инфинитив на -YWAĆ, а настоящее время на -UJĘ: okłamywać, но okłamuję, okłamujesz, okłamuje. Это общее правило для всего класса (pokazywać — pokazuję, zapisywać — zapisuję), и русское «обманывать — обманываю», где суффикс не трогают, сбивает с толку. Формы «okłamywam» не существует." }
  - { kind: register, text: "У польского есть и прямой родственник русского «лгать» — глагол ŁGAĆ, с тем же корнем. Но в польском он грубый, почти бранный: łgarz «лгун, брехло». Нейтральное слово — KŁAMAĆ, и именно его ставят там, где русский скажет «лгать». Корень kłam- русскому незнаком вовсе, зато живёт в чешском и словацком." }
collocations:
  - { pl: "okłamywać kogoś", ru: "обманывать кого-л." }
  - { pl: "okłamywać samego siebie", ru: "обманывать самого себя" }
  - { pl: "okłamywać w żywe oczy", ru: "врать в глаза" }
family:
  - { pl: "okłamać", ru: "обмануть (сов.)", relation: aspect, id: oklamac }
  - { pl: "kłamać", ru: "лгать", relation: root, id: klamac }
  - { pl: "kłamstwo", ru: "ложь", relation: root, id: klamstwo }
etymology: "Приставка o- и kłamać, из праславянского *klamati «лгать, обманывать». Корень в русском не сохранился — у нас на этом месте «ложь» и «обман», — зато он живёт в чешском klam и словацком klamat. Приставка o- здесь та же, что в «обмануть»: она обводит объект кругом, и от этого глагол становится переходным."
memory: "okłamywać, но okłamuję — суффикс -ywa- в настоящем времени уступает место -uj-, формы «okłamywam» нет. И запомни разницу: kłamać «лгать» дополнения не берёт, а okłamywać требует винительного: okłamywać matkę, а не «matce»."
idioms:
