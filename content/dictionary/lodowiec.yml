# review
id: lodowiec
format: 2
lemma: "lodowiec"
rank: 6054
pos: noun
pron: { cyr: "лодо́вьец" }
senses:
  - id: glacier
    ru: "ледник"
    examples:
      - pl: "Lodowiec przesuwa się powoli."
        ru: "Ледник движется медленно."
        source: { kind: translated, id: 13561535 }
      - pl: "Lodowiec porusza się, choć bardzo wolno."
        ru: "Ледник движется, хотя и очень медленно."
        source: { kind: translated, id: 899580 }
      - pl: "Płyniemy dalej, zbliżając się do ogromnego lodowca."
        ru: "Мы плывём дальше, приближаясь к огромному леднику."
        source: { kind: authored }
  - id: loon
    ru: "полярная гагара (птица; полностью nur lodowiec)"
    examples:
      - pl: "Nur lodowiec gniazduje na jeziorach Islandii."
        ru: "Полярная гагара гнездится на озёрах Исландии."
        source: { kind: authored }
      - pl: "Głos lodowca niesie się nocą daleko po wodzie."
        ru: "Крик гагары ночью разносится далеко по воде."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "LODOWIEC — «ледник», массив льда в горах или у полюса. Русское «ледник» в значении «погреб для льда», «холодильник» по-польски — LODÓWKA или LODOWNIA. А LODOWISKO — «каток»." }
  - { kind: usage, text: "Беглое E: lodowiec, но lodowca, lodowcem, lodowce. Мужской неодушевлённый: винительный равен именительному — widzę lodowiec. В географии: lodowiec górski, «горный ледник», lodowiec szelfowy, «шельфовый ледник», epoka lodowcowa, «ледниковый период»." }
  - { kind: pronunciation, text: "Читается «лодо́вьец», ударение на предпоследнем слоге; когда E выпадает, ударение остаётся на O: lodowca — «лодо́фца», W перед C оглушается." }
  - { kind: register, text: "Нейтральное слово, обычное в новостях о климате: lodowce topnieją, «ледники тают». В разговоре о туристической поездке — lodowiec так же нейтрален, как русское «ледник»." }
collocations:
  - { pl: "topnienie lodowców", ru: "таяние ледников" }
  - { pl: "czoło lodowca", ru: "край ледника" }
  - { pl: "epoka lodowcowa", ru: "ледниковый период" }
  - { pl: "lodowiec górski", ru: "горный ледник" }
family:
  - { pl: "lód", ru: "лёд", relation: root, id: lod }
  - { pl: "lodowcowy", ru: "ледниковый", relation: derived }
  - { pl: "lodowaty", ru: "ледяной", relation: derived }
etymology: "От LÓD, «лёд», праславянского *ledъ, с суффиксами -OW- и -IEC, как в русском «ледовый». В русском то же понятие назвали «ледником», польский образовал слово с суффиксом -IEC, как KUPIEC, «купец», — с тем же беглым E."
memory: "Lodowiec — ледник, от lód. Беглое e: lodowca, lodowce. Ледник-погреб — lodówka, каток — lodowisko. Lodowce topnieją — ледники тают."
idioms:
  - { pl: "epoka lodowcowa", ru: "ледниковый период" }
