# review
id: jednostka
format: 2
lemma: "jednostka"
rank: 1273
pos: noun
pron: { cyr: "едно́стка" }
senses:
  - id: unit
    ru: "единица (измерения)"
    examples:
      - pl: "Metr jest podstawową jednostką miary."
        ru: "Метр — основная единица измерения."
        source: { kind: translated, id: 4512706 }
      - pl: "Kilogram jest podstawową jednostką miary."
        ru: "Килограмм — основная единица измерения."
        source: { kind: translated, id: 4512732 }
      - pl: "Jakie są jednostki czasu?"
        ru: "Какие есть единицы времени?"
        source: { kind: translated, id: 760253 }
  - id: individual
    ru: "личность, индивид — в противопоставлении обществу"
    examples:
      - pl: "Społeczeństwo wywiera wielki wpływ na jednostkę."
        ru: "Общество оказывает большое влияние на личность."
        source: { kind: translated, id: 368107 }
      - pl: "Musimy szanować prawa jednostki."
        ru: "Мы должны уважать права личности."
        source: { kind: translated, id: 9852983 }
      - pl: "Społeczeństwo istnieje dla dobra jednostki."
        ru: "Общество существует для блага личности."
        source: { kind: translated, id: 925898 }
notes:
  - { kind: usage, text: "Два далёких значения в одном слове: «единица измерения» (jednostka miary) и «личность, индивид» в противопоставлении обществу (prawa jednostki «права личности»)." }
  - { kind: usage, text: "Третье значение — «подразделение, часть учреждения»: jednostka wojskowa «воинская часть», jednostka organizacyjna «структурное подразделение»." }
  - { kind: government, text: "prawa jednostki «права личности» — родительный падеж. А wpływ na jednostkę «влияние на личность» — предлог na с винительным." }
  - { kind: pronunciation, text: "Начальное je- звучит как «е», ударение на предпоследний слог: едно́стка." }
collocations:
  - { pl: "jednostka miary", ru: "единица измерения" }
  - { pl: "prawa jednostki", ru: "права личности" }
  - { pl: "jednostka wojskowa", ru: "воинская часть" }
etymology: "От jeden «один»: буквально «единица». Русская «единица» собрана точно так же, от «един»."
memory: "jednostka — и «единица измерения» (jednostka miary), и «личность» в противопоставлении обществу (prawa jednostki). Третье значение — «подразделение»: jednostka wojskowa. От jeden «один», как русская «единица» от «един»."
