notes:
  - { kind: false-friend, text: "Русскому SZEREGOWY не подсказывает «рядовой», хотя это то же самое: SZEREG — «ряд, шеренга». SZEREGOWY ŻOŁNIERZ — «рядовой солдат», и как существительное SZEREGOWY — воинское звание «рядовой»: SZEREGOWY KOWALSKI. DOM SZEREGOWY — дом в ряду одинаковых, сблокированных, по-русски «таунхаус». Русское «рядовой» в смысле «обычный» — тоже SZEREGOWY: SZEREGOWY OBYWATEL." }
  - { kind: usage, text: "Степеней сравнения нет. Все одиннадцать форм живые. Форма для мужчин-людей SZEREGOWI частая: SZEREGOWI PRACOWNICY, SZEREGOWI ŻOŁNIERZE, SZEREGOWI CZŁONKOWIE. Как существительное SZEREGOWY склоняется как прилагательное: SZEREGOWEGO, SZEREGOWEMU." }
  - { kind: government, text: "В значении «рядовой» ставится перед существительным: SZEREGOWY PRACOWNIK. В названии типа дома — после: DOM SZEREGOWY, ZABUDOWA SZEREGOWA. Падежных требований нет." }
  - { kind: pronunciation, text: "Читается «шерэго́вы», четыре слога, ударение на предпоследнем. SZ — твёрдое «ш», RE — твёрдое «рэ», GO — «го». Сравните с SZEREG «ше́рэк»: там конечное G оглушается в «к»." }
  - { kind: register, text: "Нейтральное слово. В армии SZEREGOWY — официальное звание. О работнике SZEREGOWY звучит без пренебрежения, но с оттенком «простой, не из начальства». DOM SZEREGOWY, или разговорно SZEREGOWIEC, — мечта многих польских семей из пригородов." }
