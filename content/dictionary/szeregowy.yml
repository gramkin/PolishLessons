etymology: "От SZEREG «ряд, шеренга», заимствованного из венгерского sereg «войско». Русское «шеренга», по-видимому, пришло через польский из того же источника. Рядовой — тот, кто стоит в строю, а не перед ним."
memory: "Szeregowy — рядовой: szeregowy pracownik, szeregowy żołnierz. И dom szeregowy — таунхаус. От szereg — ряд, шеренга. Читается «шерэго́вы»."
