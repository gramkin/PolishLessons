# review
id: dowodzic
format: 2
lemma: "dowodzić"
rank: 1458
pos: verb
aspect: imperf
pron: { cyr: "дово́дзиць" }
senses:
  - id: command
    ru: "командовать, руководить"
    examples:
      - pl: "Kto dowodzi?"
        ru: "Кто командует?"
        source: { kind: translated, id: 10235286 }
      - pl: "Kapitan dowodzi statkiem i załogą."
        ru: "Капитан командует судном и экипажем."
        source: { kind: translated, id: 360426 }
      - pl: "Ktoś musi dowodzić."
        ru: "Кто-то должен командовать."
        source: { kind: translated, id: 6313607 }
  - id: prove
    ru: "доказывать, служить доказательством"
    examples:
      - pl: "Ten fakt dowodzi jej niewinności."
        ru: "Этот факт доказывает её невиновность."
        source: { kind: tatoeba, id: 726656 }
      - pl: "Wszystkie fakty dowodzą tej hipotezy."
        ru: "Все факты доказывают эту гипотезу."
        source: { kind: translated, id: 502062 }
notes:
  - { kind: government, text: "Падеж разводит два значения: dowodzić czym (творительный) — «командовать чем-то» (dowodzić statkiem), а dowodzić czego (родительный) — «доказывать что-то» (dowodzi jej niewinności)." }
  - { kind: usage, text: "Только несовершенный вид. Для однократного «доказать» есть udowodnić." }
  - { kind: usage, text: "Отглагольное существительное dowodzenie значит «командование»: przejąć dowodzenie." }
  - { kind: usage, text: "Гнездо слова: dowód «доказательство», dowódca «командир», udowodnić «доказать»." }
collocations:
  - { pl: "dowodzić oddziałem", ru: "командовать отрядом" }
  - { pl: "przejąć dowodzenie", ru: "принять командование" }
  - { pl: "to dowodzi czegoś", ru: "это что-то доказывает" }
etymology: "Приставка do- и wodzić «водить» (праславянское *voditi). Русское «доводить» — то же слово, но значения разошлись: польское dowodzić это «вести войско», отсюда «командовать»."
memory: "dowodzić — и «командовать», и «доказывать». Разницу задаёт падеж: dowodzić statkiem «командовать судном» (творительный), но dowodzić niewinności «доказывать невиновность» (родительный). Существительное dowodzenie — «командование»."
idioms:
  - { pl: "przejąć dowodzenie", ru: "принять командование" }
  - { pl: "dowodzić oddziałem", ru: "командовать отрядом" }
  - { pl: "fakty dowodzą", ru: "факты доказывают" }
