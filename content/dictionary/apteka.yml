notes:
  - { kind: false-friend, text: "Слово совпадает с русским, и оборот тоже: JAK W APTECE значит «как в аптеке», то есть точно и аккуратно. Но различается, что там продают. Польская APTEKA торгует только лекарствами, а косметика, мыло и шампунь — в DROGERIA. Попросить в аптеке крем для рук можно, но посмотрят с удивлением. У нас же аптека давно торгует и тем и другим." }
  - { kind: usage, text: "Десять форм, женский род. В дательном и местном падежах K переходит в C: APTEKA, но W APTECE. В родительном множественного окончания нет вовсе: APTEK. Уменьшительное APTECZKA значит «аптечка», то есть ящик с бинтами, и его держат в машине по закону. Самая частая форма — местный W APTECE." }
  - { kind: government, text: "В аптеке — W APTECE, местный падеж. А «в аптеку» — DO APTEKI, предлог DO с родительным, где русский скажет «в аптеку», с винительным. Это обычное польское расхождение: DO там, где у нас «в». Из аптеки — Z APTEKI, тоже родительный. Запомните эту пару: W APTECE значит быть внутри, DO APTEKI — идти туда." }
  - { kind: pronunciation, text: "Читается «аптэ́ка», три слога, ударение на предпоследнем. Буква E после T даёт «э», а не «е»: по-польски это «аптэ́ка», тогда как по-русски мы говорим «апте́ка», с мягким «те». Так же читаются TEREN «тэ́рэн» и TEMAT «тэ́мат». В форме APTECE сочетание CE даёт «це»: «аптэ́це»." }
  - { kind: register, text: "Слово нейтральное и совершенно необходимое. На вывеске написано APTEKA, а ниже часто APTEKA CAŁODOBOWA «круглосуточная» или APTEKA DYŻURNA «дежурная». Оборот JAK W APTECE живой и частый, о порядке на полке, в бумагах и в голове. Аптекаря называют APTEKARZ, а провизора — FARMACEUTA." }
collocations:
  - { pl: "apteka dyżurna", ru: "дежурная аптека" }
  - { pl: "w aptece", ru: "в аптеке" }
  - { pl: "apteka całodobowa", ru: "круглосуточная аптека" }
family:
