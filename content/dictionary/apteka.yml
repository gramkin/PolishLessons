  - { pl: "apteczka", ru: "аптечка", relation: derived }
  - { pl: "aptekarski", ru: "аптекарский", relation: derived }
etymology: "Из греческого слова, означавшего «склад, кладовая», через латынь и немецкий. Русская «аптека» пришла тем же путём, поэтому слова совпадают почти буквой в букву. Любопытно, что греческий корень значил просто место, куда что-то откладывают, безо всякой связи с лекарствами: аптека это «отложенное на потом». Из того же гнезда идут APTEKARZ и APTECZKA, где -ECZKA обычное уменьшительное."
memory: "Аптека, слово общее с русским, и оборот тоже: jak w aptece — «как в аптеке», то есть образцовый порядок. Читается «аптэ́ка», где e после t даёт «э», не «е». Запомните падежи: w aptece значит «в аптеке», а do apteki — «в аптеку», с предлогом do. И помните, что косметику в польской аптеке не купишь: за ней идут в drogeria."
idioms:
  - { pl: "jak w aptece", ru: "как в аптеке, образцовый порядок" }
