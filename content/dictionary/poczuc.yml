senses:
  - id: feel
    ru: "почувствовать (что-л. — винительный)"
    note: "Совершенный вид к czuć: czuję «чувствую», poczułem «почувствовал»."
    examples:
      - pl: "Poczułem pragnienie."
        ru: "Я почувствовал жажду."
        source: { kind: translated, id: 7969945 }
      - pl: "Poczułem nagły ból głowy."
        ru: "Я почувствовал внезапную головную боль."
        source: { kind: translated, id: 360127 }
      - pl: "Poczuł ulgę, gdy jego matka zmarła."
        ru: "Он испытал облегчение, когда умерла его мать."
        source: { kind: tatoeba, id: 12333867 }
  - id: feel-self
    ru: "poczuć się — почувствовать себя (каким-л.)"
    note: "Самая частая конструкция: poczuć się lepiej «почувствовать себя лучше»."
    examples:
      - pl: "Jeśli zażyjesz to lekarstwo, poczujesz się lepiej."
        ru: "Если примешь это лекарство, почувствуешь себя лучше."
        source: { kind: translated, id: 357230 }
      - pl: "Poczuł się źle."
        ru: "Он почувствовал себя плохо."
        source: { kind: translated, id: 524599 }
      - pl: "Poczuła się uwięziona."
        ru: "Она почувствовала себя в ловушке."
        source: { kind: translated, id: 12454775 }
  - id: sense
    ru: "poczucie — чувство, ощущение"
    note: "Отглагольное существительное живёт своей жизнью: poczucie humoru «чувство юмора»."
    examples:
      - pl: "Szkoda, że on nie ma poczucia humoru."
        ru: "Жаль, что у него нет чувства юмора."
        source: { kind: tatoeba, id: 458059 }
      - pl: "Zupełnie zatracił poczucie obowiązku."
        ru: "Он совершенно утратил чувство долга."
        source: { kind: translated, id: 359191 }
      - pl: "Ludzie szanują ludzi z wysokim poczuciem wartości."
        ru: "Люди уважают тех, у кого есть чувство собственного достоинства."
        source: { kind: translated, id: 8881785 }
notes:
  - { kind: usage, text: "Несовершенный вид — czuć: czuję «чувствую», poczułem «почувствовал»." }
  - { kind: government, text: "poczuć się сочетается с наречием или с творительным: poczuć się lepiej «почувствовать себя лучше», poczuć się urażonym «почувствовать себя обиженным»." }
  - { kind: usage, text: "Существительное poczucie давно живёт отдельно и значит «чувство, ощущение»: poczucie humoru «чувство юмора», poczucie obowiązku «чувство долга», poczucie winy «чувство вины»." }
  - { kind: usage, text: "Страдательное причастие (poczuty) морфология образует, но живой язык его не употребляет — отсюда пропуски в таблице форм." }
