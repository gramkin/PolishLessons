etymology: "Приставка po- плюс czuć «чувствовать», от праславянского *čuti «слышать, чувствовать» — родственно русским «чуять» и «чувствовать»."
memory: "poczuć — совершенный вид к czuć: czuję «чувствую», poczułem «почувствовал». Чаще всего оно идёт с się и словом состояния: poczujesz się lepiej «тебе станет лучше». А существительное poczucie давно живёт отдельно и значит «чувство»: poczucie humoru «чувство юмора», poczucie winy «чувство вины». Корень тот же, что в русском «чуять»."
