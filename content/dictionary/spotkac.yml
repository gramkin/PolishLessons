# review
id: spotkac
format: 2
lemma: "spotkać"
rank: 169
pos: verb
aspect: perf
pron: { cyr: "спо́ткаць" }
senses:
  - id: meet
    ru: "встретить (кого-либо)"
    note: "spotkać kogoś — винительный падеж, без предлога."
    examples:
      - pl: "Spotkałem go po pracy."
        ru: "Я встретил его после работы."
        source: { kind: tatoeba, id: 4950451 }
      - pl: "Spotkałem wczoraj Marię."
        ru: "Вчера я встретил Марию."
        source: { kind: tatoeba, id: 821056 }
      - pl: "Spotkałam go w styczniu."
        ru: "Я встретила его в январе."
        source: { kind: tatoeba, id: 6360119 }
  - id: meet-up
    ru: "spotkać się z kimś — встретиться с кем-либо"
    examples:
      - pl: "Spotkajmy się o piątej."
        ru: "Встретимся в пять."
        source: { kind: tatoeba, id: 5336675 }
      - pl: "Chce się z tobą spotkać."
        ru: "Он хочет с тобой встретиться."
        source: { kind: tatoeba, id: 3460733 }
      - pl: "Spotkałeś go już?"
        ru: "Ты уже встретил его?"
        source: { kind: tatoeba, id: 1474339 }
notes:
  - { kind: government, text: "Два управления, как в русском: spotkać kogoś «встретить кого-то» (винительный) и spotkać się z kimś «встретиться с кем-то» (z + творительный)." }
  - { kind: usage, text: "Несовершенный вид — spotykać: Spotykam go co dzień «Встречаю его каждый день»." }
  - { kind: usage, text: "Безличный оборот spotkało go nieszczęście значит «его постигло несчастье». Существительное — spotkanie «встреча»." }
collocations:
  - { pl: "spotkać kogoś", ru: "встретить кого-то" }
  - { pl: "spotkać się z kimś", ru: "встретиться с кем-то" }
  - { pl: "miło cię spotkać", ru: "приятно тебя встретить" }
  - { pl: "do zobaczenia", ru: "до встречи" }
etymology: "Из s- + po- + tkać «ткнуть, наткнуться»: буквально «наткнуться на кого-то». Русское «встретить» образовано от другого корня."
memory: "Два управления, как в русском: spotkać kogoś «встретить кого-то» и spotkać się z kimś «встретиться с кем-то». Существительное — spotkanie «встреча»."
idioms:
  - { pl: "co ma kogo spotkać, to go nie minie", ru: "чему быть, того не миновать" }
  - { pl: "spotkać się w pół drogi", ru: "пойти навстречу друг другу" }
  - { pl: "spotkanie po latach", ru: "встреча спустя годы" }
