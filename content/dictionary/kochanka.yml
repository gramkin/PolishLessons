etymology: "От глагола KOCHAĆ «любить» с суффиксами -AN- и -KA. Сам глагол в русском литературном языке соответствия не имеет: «кохать» известно по говорам и по украинскому «кохати», а общеславянского корня здесь, по-видимому, нет — слово считают выразительным по происхождению, из тех, что возникли в живой речи и разошлись по западным и южным славянам. Польский построил на нём целое гнездо: KOCHAĆ, KOCHANIE, KOCHANEK, KOCHANKA, UKOCHANY, а русский тот же участок смысла покрывает корнем «люб-»: «любить», «любимый», «любовник», «любовница». Поэтому родства искать не стоит, а запоминать нужно весь ряд сразу."
memory: "Осторожно: kochanka значит «любовница», положение, а не чувство, и ласковым обращением не является. Украинское «кохана» подсказывает неверно: любимая по-польски ukochana, а ласковое обращение — kochanie, одинаковое для всех. Падежи как у серии на -ka: kochance с меной k→c, kochanek с беглым e — и эта форма в точности равна мужскому kochanek «любовник», так что различает только согласование."
idioms:
  - { pl: "ukochana osoba", ru: "любимый человек" }
