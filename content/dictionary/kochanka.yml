notes:
  - { kind: false-friend, text: "Здесь нужна осторожность, потому что ошибка обидна. Польское KOCHANKA значит именно любовницу, женщину в связи вне брака, и ласковым обращением оно не является. Украинское «кохана» и русское поэтическое «коханая» значат «любимая», и носитель, опираясь на них, легко скажет KOCHANA в смысле «любимая» — но по-польски KOCHANA это обычное «дорогая», приемлемое в письме и между близкими, а KOCHANKA уже совсем другое. Любимую, возлюбленную называют UKOCHANA или NAJUKOCHAŃSZA, а в быту просто KOCHANIE, то есть «дорогой» и «дорогая» без различия рода." }
  - { kind: usage, text: "Десять форм, женский род. Дательный и местный единственного — KOCHANCE, с меной K в C; родительный множественного — KOCHANEK, с беглым E. И вот любопытное совпадение: форма KOCHANEK в точности равна именительному единственного мужского слова KOCHANEK «любовник». То есть BEZ KOCHANEK значит «без любовниц», а TEN KOCHANEK — «этот любовник», и различает их только род согласования. Такие совпадения в польском нередки и снимаются прилагательным или глаголом." }
  - { kind: pronunciation, text: "Читается «коха́нка», три слога, ударение на втором. Буквосочетание CH даёт «х», как в русском. Буква A в обоих открытых слогах чистая. В форме KOCHANCE сочетание NC читается «нц»: «коха́нце». В форме KOCHANEK беглое E произносится отчётливо: «коха́нэк». В форме KOCHANKĄ последнее Ą даёт «он»: «коха́нкон». В форме KOCHANKĘ конечное Ę звучит как чистое «э»." }
  - { kind: register, text: "Слово нейтральное по форме и тяжёлое по смыслу: оно называет положение, а не чувство, и в разговоре о живых людях звучит жёстко. В литературе и исторической хронике оно обычно: KOCHANKA KRÓLA, DAWNA KOCHANKA. Мужское соответствие KOCHANEK. Для влюблённой пары без осуждения есть слова PARTNER и PARTNERKA, для возлюбленной — UKOCHANA. Ласковое KOCHANIE употребляется ко всем и всегда, от супруга до ребёнка, и переводится как «дорогой», «милая», смотря по лицу." }
