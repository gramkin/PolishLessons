# review
id: spiac
format: 2
lemma: "spiąć"
rank: 4937
pos: verb
pron: { cyr: "спёнць" }
senses:
  - id: fasten
    ru: "скрепить, сколоть, застегнуть вместе"
    examples:
      - pl: "Spięła włosy spinką."
        ru: "Она заколола волосы заколкой."
        source: { kind: authored }
      - pl: "Spiął kartki zszywaczem."
        ru: "Он скрепил листы степлером."
        source: { kind: authored }
      - pl: "Zepnij te dokumenty razem."
        ru: "Скрепи эти документы вместе."
        source: { kind: authored }
  - id: brace
    ru: "с SIĘ — напрячься, собраться с силами"
    examples:
      - pl: "Spiął się i zdał egzamin."
        ru: "Он собрался и сдал экзамен."
        source: { kind: authored }
      - pl: "Na widok szefa cała się spięła."
        ru: "При виде шефа она вся напряглась."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "SPIĄĆ — «скрепить», а не «спать». «Спать» — SPAĆ, «уснуть» — ZASNĄĆ. Одно Ą отличает слова: SPIĄĆ звучит «спёнць», SPAĆ — «спаць»." }
  - { kind: usage, text: "Пятьдесят три формы. Будущее время на ZE-: ZEPNĘ, ZEPNIESZ, повелительное ZEPNIJ. Страдательное SPIĘTY — частое прилагательное «напряжённый, зажатый»: BYŁ SPIĘTY PRZED ROZMOWĄ. Отглагольное SPIĘCIE — ещё и «короткое замыкание» и «стычка». Несовершенный вид — SPINAĆ." }
  - { kind: government, text: "Что — винительный: SPIĄĆ WŁOSY. Чем — творительный: SPIĄĆ SPINACZEM, AGRAFKĄ. С чем — Z с творительным: SPIĄĆ JEDNĄ KARTKĘ Z DRUGĄ. Коня — OSTROGAMI «пришпорить»." }
  - { kind: pronunciation, text: "SPIĄĆ — один слог, «спёнць»: IĄ — «ён», конечное Ć — «ць». ZEPNĘ — «зэ́пнэ», SPIĘTY — «спе́нты»." }
  - { kind: register, text: "В прямом смысле — нейтральное, бытовое. SPIĄĆ SIĘ «собраться» и SPIĘTY «напряжённый» — разговорные и очень частые. SPIĄĆ BUDŻET — газетное «свести бюджет»." }
collocations:
  - { pl: "spiąć włosy", ru: "заколоть волосы" }
  - { pl: "spiąć kartki", ru: "скрепить листы" }
  - { pl: "spiąć się przed egzaminem", ru: "собраться перед экзаменом" }
family:
  - { pl: "zapiąć", ru: "застегнуть", relation: derived, id: zapiac }
  - { pl: "spinacz", ru: "скрепка", relation: derived }
  - { pl: "spinka", ru: "заколка; запонка", relation: derived }
etymology: "Приставка S- «с-» плюс PIĄĆ «натягивать», праславянское *pęti, *pьnǫ. Русское «распять», «запятая», «препятствие» — из того же корня."
memory: "Spiąć — скрепить: spięła włosy. Spiąć się — собраться. Spięty — напряжённый. Будущее: zepnę. Читается «спёнць»."
