# review
id: kwatera
format: 2
lemma: "kwatera"
rank: 3225
pos: noun
pron: { cyr: "квате́ра" }
senses:
  - id: lodging
    ru: "съёмное жильё, комната"
    examples:
      - pl: "Szukamy kwatery na noc."
        ru: "Мы ищем жильё на ночь."
        source: { kind: authored }
      - pl: "Wynajęli kwaterę przy plaży."
        ru: "Они сняли жильё у пляжа."
        source: { kind: authored }
      - pl: "Kwatera była tania i czysta."
        ru: "Жильё было дешёвым и чистым."
        source: { kind: authored }
  - id: quarters
    ru: "квартира, расположение (военное); штаб"
    examples:
      - pl: "Główna kwatera mieści się w Brukseli."
        ru: "Главная штаб-квартира находится в Брюсселе."
        source: { kind: authored }
      - pl: "Żołnierze wrócili do kwatery."
        ru: "Солдаты вернулись на квартиру."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Это не обычная «квартира»! Жилая квартира по-польски mieszkanie, а kwatera — съёмная комната или военная квартира." }
  - { kind: usage, text: "kwatera prywatna «частное жильё» — то, что сдают туристам; kwatera główna «штаб-квартира»." }
  - { kind: government, text: "Женский род: ta kwatera, tej kwatery." }
  - { kind: usage, text: "В корпусе слово почти не встречается, поэтому все примеры здесь составлены вручную." }
collocations:
  - { pl: "kwatera prywatna", ru: "частное жильё" }
  - { pl: "kwatera główna", ru: "штаб-квартира" }
etymology: "Из немецкого Quartier, восходящего к латинскому quartarius «четверть»; русское «квартира» пришло из того же источника."
memory: "kwatera — «съёмное жильё» или военная «квартира», но не жилая квартира: та называется mieszkanie. Источник тот же, что у русского «квартира»."
idioms:
  - { pl: "kwatera główna", ru: "штаб-квартира" }
formExamplesSkip:
  - { form: "kwatero", reason: "звательная форма у неодушевлённого существительного практически не употребляется: обращаются к человеку или, в поэзии, к родине, но не к съёмной комнате" }
