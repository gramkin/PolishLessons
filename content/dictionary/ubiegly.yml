# review
id: ubiegly
format: 2
lemma: "ubiegły"
rank: 4512
pos: adj
pron: { cyr: "убе́гуы" }
senses:
  - id: last
    ru: "прошлый, минувший"
    examples:
      - pl: "Ubiegłej nocy miał miejsce wybuch w fabryce fajerwerków."
        ru: "Прошлой ночью произошёл взрыв на заводе по производству фейерверков."
        source: { kind: tatoeba, id: 837845 }
      - pl: "Ile wydałeś w ubiegłym tygodniu?"
        ru: "Сколько ты потратил на прошлой неделе?"
        source: { kind: translated, id: 961060 }
      - pl: "Rzucił palenie w ubiegłym roku."
        ru: "Он бросил курить в прошлом году."
        source: { kind: translated, id: 1059668 }
  - id: previous
    ru: "прошедший (о периоде)"
    examples:
      - pl: "Mieszkała z nami od ubiegłego lata."
        ru: "Она жила с нами с прошлого лета."
        source: { kind: translated, id: 511586 }
      - pl: "To w tej sali mieliśmy zebranie w ubiegły piątek."
        ru: "Именно в этом зале у нас было собрание в прошлую пятницу."
        source: { kind: translated, id: 765784 }
notes:
  - { kind: usage, text: "Книжнее, чем zeszły, но значит то же: w ubiegłym roku и w zeszłym roku оба «в прошлом году». В официальных текстах предпочитают ubiegły." }
  - { kind: false-friend, text: "Причастие от ubiec «опередить, истечь»: буквально «убежавший». Русское «прошлый» от «пройти» держит тот же образ движения." }
  - { kind: government, text: "Обычное прилагательное; чаще всего в предложном падеже: w ubiegłym tygodniu, w ubiegłą niedzielę." }
  - { kind: usage, text: "Антоним — przyszły «будущий», нейтральный вариант — zeszły." }
collocations:
  - { pl: "w ubiegłym roku", ru: "в прошлом году" }
  - { pl: "ubiegłej nocy", ru: "прошлой ночью" }
etymology: "Причастие от ubiec «опередить, истечь»; русское «прошлый» от «пройти» построено на том же образе движения."
memory: "ubiegły — «прошлый», книжнее чем zeszły, но значит то же. Чаще всего в предложном: w ubiegłym roku «в прошлом году»."
idioms:
  - { pl: "w ubiegłym roku", ru: "в прошлом году" }
formExamplesSkip:
  - { form: "ubiegli", reason: "мужско-личная форма множественного числа, а ubiegły говорится о времени: ubiegły rok, ubiegła zima, ubiegłe lato. Человек не бывает «прошлым», поэтому формы ubiegli в текстах нет" }
