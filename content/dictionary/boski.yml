# review
id: boski
format: 2
lemma: "boski"
rank: 1097
pos: adj
pron: { cyr: "бо́ски" }
senses:
  - id: divine
    ru: "божий, божественный; относящийся к Богу"
    examples:
      - pl: "Niezbadane są wyroki boskie."
        ru: "Неисповедимы пути Господни."
        source: { kind: translated, id: 13669979 }
      - pl: "Boska inteligencja działa we wszystkim."
        ru: "Божественный разум действует во всём."
        source: { kind: translated, id: 12941043 }
      - pl: "Na szczęście opatrzność boska była po mojej stronie."
        ru: "К счастью, божественное провидение было на моей стороне."
        source: { kind: translated, id: 10571127 }
  - id: wonderful
    ru: "божественный, чудесный, дивный (разговорное — о чём-то прекрасном)"
    note: "Как и русское «божественный» о торте или погоде: оценка, а не религия."
    examples:
      - pl: "Ta zupa jest boska!"
        ru: "Этот суп божественный!"
        source: { kind: authored }
      - pl: "Miałaś boski pomysł."
        ru: "У тебя была чудесная идея."
        source: { kind: authored }
      - pl: "Pogoda była wczoraj boska."
        ru: "Погода вчера была дивная."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Степеней сравнения нет: это относительное прилагательное от Bóg «Бог». Усиливают наречием — zupełnie boski." }
  - { kind: usage, text: "Разговорное значение «чудесный» очень живое и совпадает с русским: boska zupa «божественный суп», boski pomysł «чудесная идея»." }
  - { kind: usage, text: "Формы женского рода почти сливаются с устойчивыми восклицаниями: na miłość boską!, na litość boską! — «ради бога!», «помилуйте!». Их стоит выучить целиком." }
  - { kind: usage, text: "С большой буквы — в именах собственных и религиозных терминах: Boska Komedia «Божественная комедия», Opatrzność Boska «Божий промысел»." }
collocations:
  - { pl: "na miłość boską!", ru: "ради бога!" }
  - { pl: "opatrzność boska", ru: "божий промысел" }
  - { pl: "Boska Komedia", ru: "Божественная комедия" }
  - { pl: "rany boskie!", ru: "господи!" }
family:
  - { pl: "Bóg", ru: "Бог", relation: derived, id: bog }
  - { pl: "boskość", ru: "божественность", relation: derived }
  - { pl: "bosko", ru: "божественно", relation: derived }
etymology: "От Bóg «Бог» (праславянское *bogъ) — то же слово, что русское «божий, божеский». Суффикс -ski тот же, что в polski, wiejski: «относящийся к»."
memory: "boski — «божий, божественный», прозрачно от Bóg. Степеней сравнения нет: это относительное прилагательное. Разговорное значение совпадает с русским до мелочей: boska zupa «божественный суп», boski pomysł «чудесная идея». Отдельно выучите восклицания, они очень частые и всегда в одной форме: na miłość boską! и na litość boską! «ради бога!», rany boskie! «господи!»."
idioms:
  - { pl: "na miłość boską!", ru: "ради бога!" }
  - { pl: "na litość boską!", ru: "ради всего святого!, побойся Бога!" }
  - { pl: "rany boskie!", ru: "господи!" }
