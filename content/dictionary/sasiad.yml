notes:
  - { kind: usage, text: "Лично-мужское множественное — sąsiedzi, с двойным чередованием a→e и d→dz: Co pomyślą sąsiedzi? Родительный множественного — sąsiadów." }
  - { kind: usage, text: "Женский род — sąsiadka «соседка», прилагательное — sąsiedni «соседний»." }
  - { kind: government, text: "В именной части сказуемого нужен творительный: Jest moim sąsiadem «Он мой сосед»." }
