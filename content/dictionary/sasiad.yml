etymology: "Приставка są- (та же, что в sąd «суд») и корень от siedzieć «сидеть»: буквально «тот, кто сидит рядом». Русский «сосед» собран из тех же частей."
memory: "sąsiad — «сосед», и собран так же, как русское слово: «рядом сидящий». Главное — множественное sąsiedzi с двойным чередованием a→e и d→dz. Женский род — sąsiadka."
