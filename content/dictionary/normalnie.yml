# review
id: normalnie
format: 2
lemma: "normalnie"
rank: 1766
pos: adv
pron: { cyr: "норма́льне" }
senses:
  - id: normally
    ru: "нормально, обычным образом"
    examples:
      - pl: "Widzę normalnie."
        ru: "Я вижу нормально."
        source: { kind: translated, id: 624956 }
      - pl: "Oddychaj normalnie."
        ru: "Дыши нормально."
        source: { kind: translated, id: 8511868 }
      - pl: "Zachowuj się normalnie."
        ru: "Веди себя нормально."
        source: { kind: translated, id: 12336107 }
  - id: usually
    ru: "обычно, как правило"
    examples:
      - pl: "Normalnie wstaję o szóstej rano."
        ru: "Обычно я встаю в шесть утра."
        source: { kind: translated, id: 1840234 }
      - pl: "To dziecko dorosło normalnie."
        ru: "Этот ребёнок рос нормально."
        source: { kind: translated, id: 9679456 }
      - pl: "Wyglądam normalnie?"
        ru: "Я нормально выгляжу?"
        source: { kind: translated, id: 5968903 }
notes:
  - { kind: usage, text: "Два значения: «нормально, как надо» (oddychaj normalnie) и «обычно, как правило» (normalnie wstaję o szóstej)." }
  - { kind: usage, text: "Разговорно normalnie работает как усилитель: normalnie nie mogę uwierzyć «я просто не могу поверить»." }
  - { kind: false-friend, text: "В значении «обычно» надёжнее zwykle: zwykle wstaję o szóstej. Normalnie в этом смысле разговорнее." }
  - { kind: usage, text: "Прилагательное — normalny «нормальный»; превосходная степень najnormalniej входит в оборот najnormalniej w świecie «самым обычным образом»." }
collocations:
