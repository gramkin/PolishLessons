etymology: "От normalny «нормальный», из латинского norma «угольник, правило». Русское «нормально» пришло тем же путём."
memory: "normalnie — и «нормально, как надо» (oddychaj normalnie), и «обычно» (normalnie wstaję o szóstej). Во втором значении надёжнее сказать zwykle."
