# review
id: siegnac
format: 2
lemma: "sięgnąć"
rank: 4649
pos: verb
pron: { cyr: "сье́нгнонць" }
senses:
  - id: reach-for
    ru: "потянуться (за чем-то), взять"
    examples:
      - pl: "Sięgnął po książkę z półki."
        ru: "Он потянулся за книгой на полке."
        source: { kind: authored }
      - pl: "Sięgnij do szuflady po nożyczki."
        ru: "Достань из ящика ножницы."
        source: { kind: authored }
      - pl: "Nie mogę sięgnąć do górnej półki."
        ru: "Я не могу дотянуться до верхней полки."
        source: { kind: authored }
  - id: resort-to
    ru: "прибегнуть (к средствам); обратиться (памятью)"
    examples:
      - pl: "Rząd sięgnął po rezerwy."
        ru: "Правительство прибегло к резервам."
        source: { kind: authored }
      - pl: "Sięgnęła pamięcią do dzieciństwa."
        ru: "Она вернулась мыслями в детство."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "SIĘGNĄĆ похоже на «сесть» из-за SIĘ, но к возвратности отношения не имеет: SIĘG- — корень, «доставать, достигать», русское «досягать», «досягаемость». SIĘGNĄĆ PO COŚ — «потянуться за чем-то»; переносно — «прибегнуть»: SIĘGNĄĆ PO PRZEMOC, «прибегнуть к насилию». SIĘGNĄĆ GŁĘBIEJ — «копнуть глубже»." }
  - { kind: usage, text: "Сорок две формы: глагол совершенного вида и непереходный, страдательного причастия нет; есть деепричастие SIĘGNĄWSZY и безличное SIĘGNIĘTO. Чередование: SIĘGNĄŁ, но SIĘGNĘŁA. Видовой партнёр — SIĘGAĆ: WODA SIĘGAŁA DO KOLAN, «вода доходила до колен»." }
  - { kind: government, text: "За чем — PO с винительным: SIĘGNĄĆ PO TELEFON, PO NAGRODĘ. До чего — DO с родительным: SIĘGNĄĆ DO KIESZENI, DO SUFITU. Памятью — творительный: SIĘGNĄĆ PAMIĘCIĄ." }
  - { kind: pronunciation, text: "Читается «сье́нгнонць», два слога, ударение на первом. SIĘ — «сье» с носовым «эн» перед G, Ą перед Ć — «он». SIĘGNĄŁ — «сье́нгноу»." }
  - { kind: register, text: "Нейтральное слово. Спортивное SIĘGNĄĆ PO ZŁOTO, PO MISTRZOSTWO — «завоевать золото, чемпионство». Книжное SIĘGNĄĆ PAMIĘCIĄ, SIĘGNĄĆ DO ŹRÓDEŁ — «обратиться к источникам»." }
collocations:
  - { pl: "sięgnąć po książkę", ru: "потянуться за книгой" }
  - { pl: "sięgnąć po złoto", ru: "завоевать золото" }
  - { pl: "sięgnąć pamięcią", ru: "вспомнить, вернуться мыслями" }
family:
  - { pl: "sięgać", ru: "доставать, доходить", relation: aspect, id: siegac }
  - { pl: "zasięg", ru: "досягаемость; зона покрытия", relation: derived }
  - { pl: "osiągnąć", ru: "достичь", relation: root, id: osiagnac }
etymology: "От праславянского *sęgnǫti «протянуть руку, достать», того же корня, что русское «досягать», «присяга», «посягать». Носовое Ę в польском на месте русского «я»."
memory: "Sięgnąć — потянуться, достать: sięgnąć po książkę, do szuflady. Sięgnąć po złoto — завоевать. Zasięg — зона покрытия. Корень как в «досягать». Читается «сье́нгнонць»."
idioms:
  - { pl: "sięgnąć dna", ru: "опуститься на самое дно" }
