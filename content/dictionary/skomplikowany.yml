notes:
  - { kind: usage, text: "Причастие от skomplikować «усложнить», ставшее прилагательным. Синоним — złożony «составной, сложный»." }
  - { kind: false-friend, text: "Отличайте от trudny «трудный»: skomplikowany — о внутреннем устройстве («состоит из многих частей»), trudny — о том, что даётся тяжело." }
  - { kind: usage, text: "To skomplikowane — «Это сложно», частый разговорный ответ, в том числе об отношениях." }
  - { kind: usage, text: "Заимствование из латинского complicare «свёртывать, запутывать» — то же, что русское «комплицированный» нет, но «компликация» и «комплекс» из того же гнезда." }
collocations:
  - { pl: "to skomplikowane", ru: "это сложно" }
  - { pl: "skomplikowana maszyna", ru: "сложная машина" }
  - { pl: "skomplikowany problem", ru: "сложная задача" }
etymology: "Из латинского complicare «свёртывать, запутывать» через европейские языки. Русское «сложный» — славянское слово от «сложить», но метафора та же: нечто, сложенное из многих частей."
memory: "skomplikowany = «сложный» в смысле «состоящий из многих частей, запутанный». Отличайте от trudny «трудный»: trudny о том, что даётся тяжело. Частый ответ — To skomplikowane «Это сложно»."
idioms:
