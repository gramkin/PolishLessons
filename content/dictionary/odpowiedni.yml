# review
id: odpowiedni
format: 2
lemma: "odpowiedni"
rank: 857
pos: adj
pron: { cyr: "отпове́дни" }
senses:
  - id: suitable
    ru: "подходящий, надлежащий"
    examples:
      - pl: "Czy to odpowiedni moment?"
        ru: "Это подходящий момент?"
        source: { kind: translated, id: 8620909 }
      - pl: "On jest odpowiedni do tej pracy."
        ru: "Он подходит для этой работы."
        source: { kind: translated, id: 718961 }
      - pl: "To lekarstwo będzie odpowiednie dla pana."
        ru: "Это лекарство вам подойдёт."
        source: { kind: translated, id: 645056 }
  - id: right-one
    ru: "о поиске нужного: znaleźć odpowiedniego «найти подходящего»"
    examples:
      - pl: "Próbowała znaleźć odpowiedniego mężczyznę."
        ru: "Она пыталась найти подходящего мужчину."
        source: { kind: translated, id: 12453627 }
      - pl: "Nie mógł znaleźć odpowiednich słów."
        ru: "Он не мог найти подходящих слов."
        source: { kind: translated, id: 768675 }
      - pl: "Co muszę zrobić, aby znaleźć odpowiednią dla siebie pracę?"
        ru: "Что мне нужно сделать, чтобы найти подходящую для себя работу?"
        source: { kind: translated, id: 7610602 }
  - id: proper
    ru: "надлежащий, должный (о мере, сроке, уровне)"
    examples:
      - pl: "Dokonałem płatności w odpowiednim terminie."
        ru: "Я произвёл платёж в надлежащий срок."
        source: { kind: translated, id: 3456905 }
      - pl: "Zadaniem elektrowni jest utrzymanie odpowiedniego napięcia."
        ru: "Задача электростанции — поддерживать надлежащее напряжение."
        source: { kind: translated, id: 13223357 }
      - pl: "Ten pokój jest odpowiedniej wielkości."
        ru: "Эта комната подходящего размера."
        source: { kind: translated, id: 2697688 }
notes:
  - { kind: usage, text: "Степень сравнения образуется аналитически: bardziej odpowiedni «более подходящий», najbardziej odpowiedni «самый подходящий». Формы odpowiedniejszy в живой речи почти не встречаются, хотя превосходная najodpowiedniejszy иногда попадается: On jest najodpowiedniejszy do tej pracy." }
  - { kind: government, text: "odpowiedni DO czegoś «подходящий для чего-то» — родительный после do; odpowiedni DLA kogoś «подходящий кому-то» — тоже родительный." }
  - { kind: false-friend, text: "Не путайте с odpowiedź «ответ» и odpowiadać «отвечать»: корень один (powiedzieć «сказать»), но odpowiedni значит именно «подходящий», а не «ответный»." }
  - { kind: usage, text: "Наречие — odpowiednio «соответственно, должным образом»: Zachowuj się odpowiednio." }
collocations:
  - { pl: "odpowiedni moment", ru: "подходящий момент" }
  - { pl: "odpowiedni do pracy", ru: "подходящий для работы" }
  - { pl: "odpowiednie słowa", ru: "подходящие слова" }
  - { pl: "w odpowiednim czasie", ru: "в нужное время" }
family:
  - { pl: "odpowiedź", ru: "ответ", relation: root }
  - { pl: "odpowiadać", ru: "отвечать", relation: root }
  - { pl: "odpowiednio", ru: "соответственно", relation: derived }
  - { pl: "powiedzieć", ru: "сказать", relation: root }
etymology: "Из od- + powiedzieć «сказать» — тот же корень, что в odpowiedź «ответ». Исходно «соответствующий, отвечающий чему-то», отсюда и нынешнее «подходящий»."
memory: "odpowiedni — «подходящий, надлежащий». Корень тот же, что у odpowiedź «ответ», и это помогает: подходящее — то, что «отвечает» задаче. Управление: odpowiedni do pracy, odpowiedni dla dziecka. Степени сравнения книжные, в речи говорят bardziej odpowiedni."
idioms:
