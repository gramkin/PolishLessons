# review
id: niemozliwy
format: 2
lemma: "niemożliwy"
rank: 720
pos: adj
pron: { cyr: "неможли́вы" }
senses:
  - id: impossible
    ru: "невозможный"
    examples:
      - pl: "To niemożliwe!"
        ru: "Это невозможно!"
        source: { kind: tatoeba, id: 349183 }
      - pl: "To prawie niemożliwe."
        ru: "Это почти невозможно."
        source: { kind: tatoeba, id: 3435094 }
      - pl: "Wydaje się to zupełnie niemożliwe."
        ru: "Это кажется совершенно невозможным."
        source: { kind: tatoeba, id: 10115730 }
  - id: the-impossible
    ru: "niemożliwe — невозможное (как существительное)"
    examples:
      - pl: "Dokonaliśmy niemożliwego."
        ru: "Мы совершили невозможное."
        source: { kind: translated, id: 3756976 }
      - pl: "Ona oczekuje niemożliwego."
        ru: "Она ожидает невозможного."
        source: { kind: translated, id: 1452284 }
      - pl: "Wymagasz ode mnie niemożliwego."
        ru: "Ты требуешь от меня невозможного."
        source: { kind: translated, id: 611639 }
  - id: unbearable
    ru: "Jesteś niemożliwy! — Ты невыносим!"
    note: "О человеке, а не о задаче."
    examples:
      - pl: "Jesteś niemożliwy."
        ru: "Ты невыносим."
        source: { kind: translated, id: 5665217 }
      - pl: "Jesteś niemożliwy!"
        ru: "Ты невыносим!"
        source: { kind: translated, id: 8774240 }
      - pl: "Tom jest niemożliwy."
        ru: "Том невыносим."
        source: { kind: translated, id: 8773768 }
  - id: predicate
    ru: "niemożliwym jest… — невозможно… (книжный оборот)"
    examples:
      - pl: "Niemożliwym jest nauczenie się angielskiego w miesiąc."
        ru: "Выучить английский за месяц невозможно."
        source: { kind: translated, id: 2838154 }
      - pl: "Próbowała podnieść pudło ale okazało się to niemożliwym."
        ru: "Она пыталась поднять коробку, но это оказалось невозможным."
        source: { kind: translated, id: 591834 }
      - pl: "Niemożliwym było wymyślenie naprawdę satysfakcjonującego rozwiązania."
        ru: "Невозможно было придумать по-настоящему удовлетворительное решение."
        source: { kind: translated, id: 7428868 }
notes:
  - { kind: usage, text: "Степеней сравнения нет: niemożliwszy не говорят — невозможное не бывает «более невозможным». Точно так же ведёт себя и możliwy." }
  - { kind: usage, text: "Живое разговорное значение о человеке: Jesteś niemożliwy! — это «Ты невыносим!», а вовсе не «ты невозможен»." }
  - { kind: usage, text: "Средний род работает как существительное: dokonać niemożliwego «совершить невозможное», żądać niemożliwego «требовать невозможного»." }
  - { kind: usage, text: "Книжный оборот ставит слово в творительный: Niemożliwym jest nauczenie się angielskiego w miesiąc. В разговоре проще — To niemożliwe." }
collocations:
  - { pl: "To niemożliwe!", ru: "Это невозможно!" }
  - { pl: "dokonać niemożliwego", ru: "совершить невозможное" }
  - { pl: "żądać niemożliwego", ru: "требовать невозможного" }
  - { pl: "nie ma rzeczy niemożliwych", ru: "нет ничего невозможного" }
family:
  - { pl: "możliwy", ru: "возможный", relation: root }
  - { pl: "móc", ru: "мочь", relation: root }
  - { pl: "niemożliwość", ru: "невозможность", relation: derived }
etymology: "Приставка nie- плюс możliwy «возможный», от móc «мочь» — та же сборка, что русское «не-воз-можный»."
memory: "niemożliwy собран как русское слово: nie- + możliwy от móc «мочь». Степеней у него нет — niemożliwszy сказать нельзя. Зато есть живое разговорное значение о человеке: Jesteś niemożliwy! значит «Ты невыносим!». А средний род работает существительным: dokonać niemożliwego «совершить невозможное»."
idioms:
  - { pl: "To niemożliwe!", ru: "Это невозможно!" }
  - { pl: "dokonać niemożliwego", ru: "совершить невозможное" }
  - { pl: "nie ma rzeczy niemożliwych", ru: "нет ничего невозможного" }
