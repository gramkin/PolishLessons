# review
id: pomoc
format: 2
lemma: "pomóc"
rank: 119
pos: verb
aspect: perf
pron: { cyr: "по́муц" }
senses:
  - id: help-someone
    ru: "помочь (кому-либо)"
    note: "Управление как в русском: pomóc komuś — дательный падеж."
    examples:
      - pl: "Pomóż mi!"
        ru: "Помоги мне!"
        source: { kind: tatoeba, id: 1180480 }
      - pl: "Pomogę ci."
        ru: "Я тебе помогу."
        source: { kind: tatoeba, id: 818010 }
      - pl: "Mogę ci pomóc."
        ru: "Я могу тебе помочь."
        source: { kind: tatoeba, id: 3230868 }
  - id: work
    ru: "помочь (о средстве, о поступке — дать результат)"
    examples:
      - pl: "Ten lek pomógł mi na ból głowy."
        ru: "Это лекарство помогло мне от головной боли."
        source: { kind: authored }
      - pl: "Nic nie pomogło."
        ru: "Ничто не помогло."
        source: { kind: authored }
      - pl: "Ta rozmowa bardzo pomogła."
        ru: "Этот разговор очень помог."
        source: { kind: authored }
notes:
  - { kind: government, text: "pomóc komuś — дательный падеж, как в русском: Pomóż mi «Помоги мне». А «помочь в чём-то» — pomóc w czymś: pomóc w pracy." }
  - { kind: usage, text: "Будущее время образуется от другой основы: pomogę, pomożesz, pomoże — как русское «помогу, поможешь»." }
  - { kind: usage, text: "Несовершенный вид — pomagać: Pomagam mamie co dzień «Помогаю маме каждый день». Крик о помощи — Pomocy!" }
collocations:
  - { pl: "pomóc komuś", ru: "помочь кому-то" }
  - { pl: "pomóc w pracy", ru: "помочь в работе" }
  - { pl: "pomocy!", ru: "на помощь!" }
  - { pl: "czy mogę pomóc?", ru: "могу я помочь?" }
etymology: "Приставка po- + móc; ср. русское «помочь» (по + мочь). Отсюда и существительное pomoc «помощь»."
memory: "pomóc komuś — дательный падеж, как в русском. Будущее от другой основы: pomogę, pomożesz, pomoże. А крик о помощи — Pomocy!"
idioms:
  - { pl: "pomocy!", ru: "на помощь!" }
  - { pl: "pomóc komuś stanąć na nogi", ru: "помочь встать на ноги" }
  - { pl: "ręka rękę myje", ru: "рука руку моет" }
formExamplesSkip:
  - { form: "pomogł", reason: "в литературном языке форма мужского рода — pomógł, с ó" }
  - { form: "pomożono", reason: "безличная форма от pomóc почти не встречается; вместо неё говорят pomagano" }
  - { form: "pomożenia", reason: "отглагольное существительное не употребляется: в этом значении используется pomoc" }
  - { form: "pomożenie", reason: "отглагольное существительное не употребляется: в этом значении используется pomoc" }
  - { form: "pomożeniem", reason: "отглагольное существительное не употребляется: в этом значении используется pomoc" }
  - { form: "pomożeniu", reason: "отглагольное существительное не употребляется: в этом значении используется pomoc" }
