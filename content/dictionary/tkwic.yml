notes:
  - { kind: usage, text: "Пятьдесят две формы, и состав их объясняется двумя независимыми обстоятельствами. Общее ядро у польских глаголов — сорок одна форма: инфинитив, шесть личных, три повелительных, пять прошедших и восемь слитных, тринадцать условных, четыре отглагольного существительного и одна безличная на -no. Дальше решает вид: несовершенный, как здесь, получает действительное причастие (TKWIĄCY, TKWIĄCA и так далее, десять форм) и деепричастие на -ąc (TKWIĄC). Совершенный получает вместо них страдательное причастие и деепричастие на -wszy — у ZYSKAĆ это zyskany и zyskawszy, и форм там пятьдесят три." }
  - { kind: usage, text: "Второе обстоятельство — переходность, и её надо отличать от вида. Страдательного причастия у TKWIĆ нет вовсе, и не потому, что он несовершенный, а потому, что он непереходный: нельзя «быть торчимым». У переходного несовершенного глагола были бы оба причастия сразу. Так что раньше выведенная арифметика — пятьдесят две формы вместо шестидесяти трёх у troszczyć, odzywać и przemówić — измеряла именно переходность, а не вид. Вид отвечает за пару -ąc против -wszy, переходность за наличие страдательного причастия." }
  - { kind: government, text: "Глагол требует предложного падежа с предлогом W: TKWIĆ W CZYMŚ. Отсюда tkwić w korku «стоять в пробке», tkwić w domu «сидеть дома», tkwić w błędzie «пребывать в заблуждении», tkwić w przeszłości «жить прошлым». Русский на это место ставит разные глаголы — торчать, сидеть, стоять, пребывать, застрять, — и выбирать приходится по предмету: гвоздь торчит, человек сидит, машина стоит." }
  - { kind: usage, text: "Второе значение отвлечённое и очень частотное: W CZYM TKWI PROBLEM значит «в чём загвоздка, в чём суть дела», а PRZYCZYNA TKWI W CZYMŚ — «причина заключается в чём-то». Выражение это стоит заучить целиком, потому что по-русски здесь работает совсем другой глагол. От того же корня идёт приставочный UTKWIĆ, и UTKWIĆ WZROK значит «вперить взгляд»." }
collocations:
  - { pl: "tkwić w korku", ru: "стоять в пробке" }
  - { pl: "tkwić w błędzie", ru: "пребывать в заблуждении" }
  - { pl: "w czym tkwi problem", ru: "в чём загвоздка" }
family:
  - { pl: "utkwić", ru: "вперить; застрять", relation: aspect }
etymology: "Из праславянского *tъkvěti, связанного с *tъknǫti «ткнуть» — того же корня, что русские «ткнуть», «тыкать» и «втыкать». Смысл прозрачен: воткнутое остаётся торчать, и из «быть воткнутым» вышло «торчать, сидеть, застрять». Русский от этого корня глагола состояния не образовал и обходится разными словами по предмету, тогда как польский держит одно на все случаи."
memory: "Пятьдесят две формы: нет страдательного причастия, потому что глагол непереходный, зато есть действительное и tkwiąc. Управление: tkwić W czymś. И w czym tkwi problem — «в чём загвоздка»."
