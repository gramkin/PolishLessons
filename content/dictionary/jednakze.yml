etymology: "Из JEDNAK, а то — от JEDEN «один» с древним наречным расширением -AK, то есть исходно «одним образом, одинаково»; значение «однако» выросло из идеи «при всём том, одинаково», как и в русском. К этому добавлена усилительная частица -ŻE, та же, что в польских IDŹŻE «иди же» и CZEMUŻ «почему же», и родственная русскому «же». Русское «однако» собрано из тех же частей тем же способом: «одна» плюс наречное «-ко», а «однако же» добавляет ту же частицу. Два языка независимо построили одно служебное слово из числительного «один» — случай, когда совпадает не корень, а сам ход мысли."
memory: "Книжный вариант jednak, ровно как русское «однако же» рядом с «однако». Частица -że усиливает и утяжеляет; в разговоре говорите jednak. Пишется слитно, в отличие от русского «однако же»."
idioms:
