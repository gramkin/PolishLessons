notes:
  - { kind: usage, text: "Книжное слово. В обычном разговоре поляк скажет JEDNAK или ALE, а JEDNAKŻE приберёт для письменной речи — для статьи, договора, официального письма. Смысл у JEDNAK и JEDNAKŻE один и тот же, разница только в весе: частица -ŻE усиливает и утяжеляет. Поэтому в живой речи JEDNAKŻE звучит либо очень официально, либо нарочито торжественно. Начинающему достаточно узнавать это слово при чтении; говорить лучше JEDNAK." }
  - { kind: pronunciation, text: "Читается «една́кже», ударение на предпоследнем слоге, то есть на NAK. Начальное je — это «е», как в русском «ель», а не «йэ» раздельно. Сочетание kż звучит слитно, «кж», без гласной между согласными: не «ка-же», а «накже». Слово неизменяемое, других форм у него нет." }
  - { kind: false-friend, text: "Не ловушка, а подарок: польское слово построено ровно так же, как русское. JEDNAK плюс усилительная частица -ŻE — это в точности русское «однако» плюс «же», то есть «однако же». И значение совпадает, и оттенок книжности совпадает, и даже порядок частей тот же. Запоминать нужно только написание: по-польски частица пишется слитно с основой, JEDNAKŻE, тогда как русское «однако же» пишется раздельно." }
  - { kind: government, text: "Частица на падежи не влияет и ничем не управляет. Стоит либо в начале предложения, либо после запятой перед той частью, которую противопоставляет: PRÓBOWALI, JEDNAKŻE BEZ SKUTKU. В отличие от союза ALE, JEDNAKŻE может стоять и не на первом месте в своей части: NIKT JEDNAKŻE NIE ODPOWIEDZIAŁ — «однако никто не ответил». Запятая перед JEDNAKŻE ставится всегда, когда оно соединяет две части предложения." }
