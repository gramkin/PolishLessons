notes:
  - { kind: false-friend, text: "Значение совпадает с русским «десертом» полностью, и подвоха в смысле нет. Расхождение в одной форме, и она частотная: местный падеж DESERZE, с чередованием R в RZ, читается «дэ́сэже» и на слух совсем не похож на DESER. То же чередование было в GITARZE, CIĘŻARZE, AMBASADORZE, PASTORZE — это общее правило для основ на -R, и заимствованные слова ему подчиняются наравне со своими. Второе, мелкое: главный оборот NA DESER идёт с винительным, как и русское «на десерт», а вот W DESERZE «в десерте» уже с местным." }
  - { kind: government, text: "Мужской род, неодушевлённое. Винительный равен именительному: PODAĆ DESER. Родительный на -U: BEZ DESERU, DO DESERU. Местный DESERZE, с чередованием R в RZ. На что подают — предлог NA с винительным: NA DESER BYŁY GRUSZKI. Из чего сделан — предлог Z с родительным: DESER Z MALIN. Родительный множественного DESERÓW. Обратите внимание, что в меню слово часто стоит во множественном как название раздела: DESERY." }
  - { kind: pronunciation, text: "Читается «дэ́сэр», ударение на предпоследнем слоге из двух. Оба E звучат как чистое «э», без смягчения предшествующего согласного — для русского это требует усилия, потому что русский на этом месте смягчает. Одна S произносится как «с», а не «з». В местном падеже DESERZE сочетание RZ даёт «ж»: «дэсэ́же», три слога, ударение на предпоследнем. В родительном множественного DESERÓW слышно «дэсэ́руф»." }
  - { kind: usage, text: "Частотные сочетания: NA DESER «на десерт», DESER LODOWY «мороженое как десерт», DESER DNIA «десерт дня» в меню, KARTA DESERÓW «десертное меню», ZOSTAWIĆ NA DESER — и последнее употребляется переносно, о самом приятном или самом трудном, оставленном на конец, ровно как русское «оставить на десерт». Прилагательное DESEROWY относится к посуде и приборам: ŁYŻECZKA DESEROWA «десертная ложечка», WINO DESEROWE «десертное вино». Уменьшительного слово не имеет." }
