etymology: "Из французского DESSERT, от глагола DESSERVIR «убирать со стола», из DES- «раз-» и SERVIR «подавать» — то есть буквально «то, что подают после уборки со стола». Этимология эта прямо описывает обычай: сладкое выносили, когда основные блюда и скатерть уже убрали. Русский «десерт» пришёл из того же французского слова и в то же время, восемнадцатый век, поэтому значения совпадают. Корень SERVIR знаком по словам SERWIS и «сервис», SERWETKA и «салфетка» через то же гнездо, SERWOWAĆ «подавать». Польский упростил удвоенную S французского написания, как поступает почти всегда с удвоениями в заимствованиях."
memory: "Как русский «десерт», и ловушка одна, зато частая: местный — deserze, с r→rz, читается «дэсэже». То же чередование, что в gitarze и pastorze: общее правило для основ на -r, и заимствования ему подчиняются. Na deser — винительный, как в русском; w deserze — местный. Из французского dessert, от desservir «убирать со стола»: сладкое подавали, когда стол уже убрали."
idioms:
