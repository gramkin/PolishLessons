# review
id: gaszcz
format: 2
lemma: "gąszcz"
rank: 5993
pos: noun
pron: { cyr: "гоу̃шч" }
senses:
  - id: thicket
    ru: "чаща, заросли"
    examples:
      - pl: "Żadne zwierzątko nie mogło wejść do tego leśnego gąszczu."
        ru: "Ни один зверёк не мог пробраться в эту лесную чащу."
        source: { kind: translated, id: 2309420 }
      - pl: "Ścieżka zniknęła w gąszczu krzaków."
        ru: "Тропинка исчезла в зарослях кустов."
        source: { kind: authored }
      - pl: "Sarna ukryła się w gąszczu."
        ru: "Косуля спряталась в чаще."
        source: { kind: authored }
  - id: tangle
    ru: "дебри, нагромождение (чего-либо)"
    examples:
      - pl: "Trudno się połapać w gąszczu przepisów."
        ru: "Трудно разобраться в дебрях правил."
        source: { kind: authored }
      - pl: "W gąszczu informacji łatwo przeoczyć najważniejsze."
        ru: "В потоке информации легко упустить самое важное."
        source: { kind: authored }
notes:
  - { kind: usage, text: "GĄSZCZ — мужской род, хотя русские «чаща» и «гуща» женского: TEN GĄSZCZ, W GĘSTYM GĄSZCZU. Родительный единственного — GĄSZCZU; во множественном две формы родительного: GĄSZCZÓW (чаще) и GĄSZCZY." }
  - { kind: false-friend, text: "Похоже на русское «гуща», но значит не осадок и не середину толпы, а густые заросли. Переносно — запутанное множество: GĄSZCZ PRZEPISÓW «дебри законов», GĄSZCZ ULICZEK «лабиринт улочек»." }
  - { kind: pronunciation, text: "Читается «гоу̃шч»: Ą перед SZ — носовое «оу̃», SZCZ — как русское «щ», только твёрже, «шч»." }
collocations:
  - { pl: "leśny gąszcz", ru: "лесная чаща" }
  - { pl: "gąszcz przepisów", ru: "дебри законов и правил" }
  - { pl: "przedzierać się przez gąszcz", ru: "продираться сквозь заросли" }
family:
  - { pl: "gęsty", ru: "густой", relation: root }
  - { pl: "gęsto", ru: "густо", relation: root, id: gesto }
  - { pl: "zagęścić", ru: "сгустить, уплотнить", relation: root }
synonyms: ["gęstwina", "zarośla"]
etymology: "Того же корня, что GĘSTY «густой»; родственно русским «густой» и «гуща»."
memory: "Gąszcz — то, что густо (gęsto) заросло: чаща. Gąszcz przepisów — дебри законов."
idioms:
  - { pl: "gąszcz przepisów", ru: "дебри законов, бюрократический лабиринт" }
