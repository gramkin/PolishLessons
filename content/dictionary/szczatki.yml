notes:
  - { kind: false-friend, text: "SZCZĄTKI — «останки» и «обломки», только во множественном. Не «щётки»: щётка — SZCZOTKA. Тело умершего — ZWŁOKI, остатки еды — RESZTKI." }
  - { kind: usage, text: "Pluralia tantum: пять форм. Родительный — SZCZĄTKÓW. Единственное SZCZĄTEK — «осколок, остаток» — встречается редко." }
  - { kind: government, text: "Останки кого — родительный: SZCZĄTKI ŻOŁNIERZY. Обнаружить останки — ODNALEŹĆ SZCZĄTKI, винительный. Среди обломков — WŚRÓD SZCZĄTKÓW." }
  - { kind: pronunciation, text: "Читается «шчо́нтки»: SZCZ — «шч», Ą перед T — «он». Ударение на первом слоге." }
