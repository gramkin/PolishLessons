# review
id: zalatwic
format: 2
lemma: "załatwić"
rank: 427
pos: verb
aspect: perf
pron: { cyr: "зауа́твиць" }
senses:
  - id: settle
    ru: "уладить, устроить, сделать (дело)"
    examples:
      - pl: "Możesz to załatwić?"
        ru: "Ты можешь это уладить?"
        source: { kind: translated, id: 8539850 }
      - pl: "Załatw to jutro!"
        ru: "Уладь это завтра!"
        source: { kind: translated, id: 6882269 }
      - pl: "Mam kilka spraw do załatwienia."
        ru: "Мне нужно уладить несколько дел."
        source: { kind: tatoeba, id: 623617 }
  - id: obtain
    ru: "достать, раздобыть (по знакомству)"
    examples:
      - pl: "Załatwię ci bilety."
        ru: "Я достану тебе билеты."
        source: { kind: authored }
      - pl: "Załatwił mi pracę."
        ru: "Он устроил мне работу."
        source: { kind: authored }
      - pl: "Załatwione?"
        ru: "Улажено?"
        source: { kind: translated, id: 2825823 }
notes:
  - { kind: usage, text: "Основное значение — «уладить, оформить»: załatwić sprawę «уладить дело», mieć sprawy do załatwienia «иметь дела»." }
  - { kind: usage, text: "Очень польское второе значение — «достать, устроить по знакомству»: Załatwił mi pracę «Он устроил мне работу», Załatwię ci bilety «Я достану тебе билеты»." }
  - { kind: usage, text: "Załatwione! — готовая реплика «Готово! Сделано!», ответ на просьбу." }
  - { kind: false-friend, text: "Грубое załatwić kogoś значит «разделаться с кем-то», а вовсе не «обслужить». В нейтральном смысле «обслужить клиента» — obsłużyć klienta." }
collocations:
  - { pl: "załatwić sprawę", ru: "уладить дело" }
  - { pl: "załatwione!", ru: "готово!" }
  - { pl: "sprawy do załatwienia", ru: "дела, которые надо уладить" }
  - { pl: "załatwić bilety", ru: "достать билеты" }
etymology: "Из za- + łatwić, от łatwy «лёгкий» (праславянское *latvъ) — буквально «сделать лёгким, разрешить». Русское «улаживать» построено по тому же принципу, только от корня «лад»."
memory: "załatwić вырастает из łatwy «лёгкий»: буквально «сделать лёгким», то есть «уладить». Это одно из самых бытовых польских слов: załatwić sprawę «уладить дело», mieć sprawy do załatwienia «иметь дела», Załatwione! «Готово!» И запомните второе, очень польское значение — «достать по знакомству»: Załatwił mi pracę «Он устроил мне работу»."
idioms:
  - { pl: "załatwione!", ru: "готово!" }
  - { pl: "załatwić sprawę", ru: "уладить дело" }
  - { pl: "mieć sprawy do załatwienia", ru: "иметь дела" }
