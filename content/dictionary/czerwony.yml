        ru: "Красное знамя развевалось над площадью."
        source: { kind: authored }
  - id: idioms
    ru: "czerwony jak burak, Czerwony Kapturek"
    note: "Сравнение разошлось с русским."
    examples:
      - pl: "Wilk zjadł Czerwonego Kapturka. Myśliwy zastrzelił wilka."
        ru: "Волк съел Красную Шапочку. Охотник застрелил волка."
        source: { kind: tatoeba, id: 4108354 }
      - pl: "Masz czerwoną twarz."
        ru: "У тебя лицо красное."
        source: { kind: tatoeba, id: 905944 }
      - pl: "Zrobił się czerwony jak burak."
        ru: "Он стал красный как свёкла."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Этимология общая с русским, и она неожиданная: czerwony идёт от czerw «червь», потому что красную краску добывали из червеца. Русское «червонный» — из того же гнезда." }
  - { kind: usage, text: "Степени сравнения у цвета образуются аналитически: bardziej czerwony «более красный», najbardziej czerwony «самый красный». Синтетические czerwieńszy и najczerwieńszy на бумаге есть, но в живой речи их практически нет." }
  - { kind: false-friend, text: "Сравнение разошлось: поляк краснеет jak burak «как свёкла», а русский — «как рак». Значение одно, картинка разная." }
  - { kind: usage, text: "Устойчивые с большой буквы: Czerwony Kapturek «Красная Шапочка», Czerwony Krzyż «Красный Крест», Armia Czerwona «Красная армия». И ходовое przejechać na czerwonym «проехать на красный»." }
collocations:
  - { pl: "czerwone wino", ru: "красное вино" }
  - { pl: "Czerwony Krzyż", ru: "Красный Крест" }
  - { pl: "na czerwonym świetle", ru: "на красный свет" }
  - { pl: "czerwony jak burak", ru: "красный как свёкла" }
family:
  - { pl: "czerwień", ru: "красный цвет", relation: derived }
  - { pl: "czerwienić się", ru: "краснеть", relation: derived }
  - { pl: "czerw", ru: "червь", relation: root }
etymology: "От czerw «червь»: красную краску добывали из червеца. Русские «червонный» и «червь» — из того же гнезда."
memory: "czerwony — «красный», и этимология у него общая с русским «червонным»: оба от «червя», потому что красную краску добывали из насекомых. Степени образуются аналитически — bardziej czerwony. А сравнение разошлось: поляк краснеет jak burak «как свёкла», русский — «как рак»."
idioms:
  - { pl: "czerwony jak burak", ru: "красный как свёкла" }
  - { pl: "Czerwony Kapturek", ru: "Красная Шапочка" }
  - { pl: "przejechać na czerwonym", ru: "проехать на красный" }
