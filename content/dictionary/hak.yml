notes:
  - { kind: false-friend, text: "Польское HAK — это наш морской «гак», то есть крюк, только у поляков слово самое обычное. В разговоре у него второй смысл: MIEĆ HAKA NA KOGOŚ значит «иметь компромат на кого-то», буквально «иметь крюк, за который можно подцепить». Уменьшительное HACZYK значит и «крючок», и «подвох»: GDZIE JEST HACZYK? — «в чём подвох?». А Z HAKIEM совпадает с нашим «с гаком»: DWA KILOMETRY Z HAKIEM — «два километра с гаком»." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. В родительном HAKA, в местном HAKU. В обороте MIEĆ HAKA винительный звучит как родительный, HAKA, а не HAK: так разговорный польский поступает с частью неодушевлённых слов, как в MIEĆ PECHA или ZJEŚĆ BANANA. Когда речь о самом крюке, винительный обычный: WBIĆ HAK W ŚCIANĘ." }
  - { kind: government, text: "Компромат на кого-то — HAK NA KOGOŚ, предлог NA с винительным. Висеть на крюке — WISIEĆ NA HAKU, местный падеж. Повесить на крюк — POWIESIĆ NA HAKU, тоже местный, хотя по-русски здесь винительный. Снять с крюка — ZDJĄĆ Z HAKA, родительный." }
  - { kind: pronunciation, text: "Читается «хак», один слог. Буква H даёт «х», так же как сочетание CH. Конечное K звучит как написано. В форме HAKIEM сочетание KIE смягчает «к»: «ха́кем»." }
  - { kind: register, text: "В прямом смысле слово нейтральное: HAK HOLOWNICZY у машины, HAKI WSPINACZKOWE у альпиниста, HAKI в мясной лавке. В переносном смысле, MIEĆ HAKA или SZUKAĆ HAKA, оно разговорное и газетное, о политиках и начальниках." }
