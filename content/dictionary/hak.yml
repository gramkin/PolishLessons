etymology: "Из немецкого HAKEN «крюк». Русский «гак» — то же германское слово, пришедшее через голландский вместе с морским делом. Поэтому польский HAK и русский «гак» по сути одно слово, но у поляков оно стало обиходным, а у нас осталось почти только у моряков. Совпадает и выражение: польское Z HAKIEM значит то же, что наше «с гаком»."
memory: "Hak — это наш «гак», то есть крюк. Mieć haka na kogoś — иметь на кого-то компромат, буквально крюк, за который подцепить. Haczyk — крючок и подвох: gdzie jest haczyk? А z hakiem — ровно «с гаком». Читается «хак»."
idioms:
