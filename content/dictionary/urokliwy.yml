# review
id: urokliwy
format: 2
lemma: "urokliwy"
rank: 5959
pos: adj
pron: { cyr: "урокли́вы" }
senses:
  - id: charming-place
    ru: "очаровательный, прелестный (о месте, городке, виде)"
    examples:
      - pl: "Zatrzymaliśmy się w urokliwym pensjonacie nad morzem."
        ru: "Мы остановились в очаровательном пансионате у моря."
        source: { kind: translated, id: 12470584 }
      - pl: "Mieszkamy w urokliwej dzielnicy Krakowa."
        ru: "Мы живём в очаровательном районе Кракова."
        source: { kind: authored }
      - pl: "To jedno z najurokliwszych miast w Europie."
        ru: "Это один из самых очаровательных городов Европы."
        source: { kind: authored }
  - id: charming-person
    ru: "обаятельный, милый (о человеке, улыбке, чертах)"
    examples:
      - pl: "Gospodarze byli urokliwi i bardzo gościnni."
        ru: "Хозяева были обаятельными и очень гостеприимными."
        source: { kind: authored }
      - pl: "Dziecko miało urokliwe dołeczki w policzkach."
        ru: "У ребёнка были очаровательные ямочки на щеках."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Корень UROK русский читатель принимает за «урок», но UROK значит «очарование, прелесть»: MA SWÓJ UROK «в этом есть своя прелесть». «Урок» по-польски LEKCJA. От этого корня два прилагательных с одним смыслом: UROCZY и UROKLIWY, оба «очаровательный». Второе особенно любят путеводители и объявления: UROKLIWE MIASTECZKO, UROKLIWY ZAKĄTEK." }
  - { kind: register, text: "Слово немного книжное и «туристическое»: в живом разговоре о человеке чаще скажут UROCZY или SYMPATYCZNY, а UROKLIWY оставят для мест, улочек, домиков, видов. О людях оно тоже встречается, с оттенком умиления: UROKLIWI STARUSZKOWIE «милые старички»." }
  - { kind: usage, text: "Тридцать три формы — одиннадцать клеток в трёх степенях: UROKLIWY, UROKLIWSZY «очаровательнее», NAJUROKLIWSZY «самый очаровательный». Степени образуются регулярно, через -SZY и NAJ-, а описательные BARDZIEJ UROKLIWY, NAJBARDZIEJ UROKLIWY звучат так же нормально." }
  - { kind: pronunciation, text: "Читается «урокли́вы», ударение на предпоследнем слоге LI. В сравнительной степени W перед SZ оглушается: UROKLIWSZY звучит «урокли́фшы»." }
collocations:
  - { pl: "urokliwe miasteczko", ru: "очаровательный городок" }
  - { pl: "urokliwy zakątek", ru: "очаровательный уголок" }
  - { pl: "urokliwa uliczka", ru: "очаровательная улочка" }
family:
  - { pl: "urok", ru: "очарование, прелесть", relation: root, id: urok }
  - { pl: "uroczy", ru: "очаровательный", relation: root }
  - { pl: "urokliwie", ru: "очаровательно", relation: derived }
synonyms: ["uroczy", "malowniczy", "czarujący"]
etymology: "Образовано от UROK «очарование, прелесть». Старшее значение этого слова — «чары, сглаз»: RZUCIĆ UROK значит «сглазить, околдовать»."
memory: "Urok — не «урок», а «прелесть», и urokliwy — полный прелести, очаровательный: urokliwe miasteczko. Урок по-польски lekcja."
