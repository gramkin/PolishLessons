notes:
  - { kind: usage, text: "ТА ЖЕ СИСТЕМА, ЧТО В РУССКОМ, ЗАУЧИВАТЬ ЗАНОВО НЕ НАДО. Польский различает определённые и неопределённые глаголы движения: jechać «ехать» и jeździć «ездить». Приставочные пары строятся из них ровно так же, как русские: от jechać получается совершенный przyjechać «приехать», от jeździć — несовершенный przyjeżdżać «приезжать». Сравните «ехать → приехать», «ездить → приезжать». Глагол непереходный, приезжают сами, винительного дополнения нет — поэтому страдательного причастия не бывает, только действительное przyjeżdżający, как у znikać и podróżować." }
  - { kind: government, text: "Приезжают КУДА — do с родительным, если речь о месте внутри: przyjeżdżać do Krakowa, do domu, do rodziców. Для мероприятий и открытых мест — na с винительным: przyjeżdżać na wesele, na dworzec. Откуда — z с родительным: przyjeżdżać z Gdańska. Чем — творительный без предлога: przyjeżdżać pociągiem, samochodem. Все четыре модели совпадают с русскими." }
  - { kind: pronunciation, text: "Самое трудное здесь не грамматика, а стык żdż. Слово звучит «пшыйе́жджаць», ударение на je. Сочетание возникает из чередования zd и żdż: jeździć даёт jeżdżę и przyjeżdżam, как русское «ездить» даёт «езжу». В русском на этом месте «зж» — тоже не самый лёгкий звук, так что трудность знакомая." }
