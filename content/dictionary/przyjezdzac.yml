etymology: "Приставка przy- плюс jeżdżać, итератив от jechać «ехать». Русское «приезжать» собрано из тех же частей тем же способом: при- плюс «-езжать». Совпадает и чередование основы: jeździć даёт jeżdżę, как «ездить» даёт «езжу». Отсюда przyjazd «приезд», wyjeżdżać «уезжать», objeżdżać «объезжать», zjeżdżać «съезжать»."
memory: "przyjeżdżać — «приезжать», и устроено оно в точности как русское слово: przy- плюс итератив от «ехать». Видовая пара привычная: przyjechać совершенный, przyjeżdżać несовершенный, как «приехать» и «приезжать». Трудность одна — выговорить żdż: «пшыйе́жджаць»."
idioms:
