# review
id: zabawa
format: 2
lemma: "zabawa"
rank: 656
pos: noun
pron: { cyr: "заба́ва" }
senses:
  - id: fun
    ru: "веселье, забава"
    note: "Miłej zabawy! «Хорошо повеселиться!» — родительный без глагола."
    examples:
      - pl: "Ależ zabawa!"
        ru: "Ну и веселье!"
        source: { kind: translated, id: 909178 }
      - pl: "Miłej zabawy."
        ru: "Приятного веселья."
        source: { kind: translated, id: 547709 }
      - pl: "Dobrej zabawy!"
        ru: "Хорошо повеселиться!"
        source: { kind: translated, id: 12449377 }
  - id: party
    ru: "вечеринка, гулянье"
    note: "zabawa kostiumowa «костюмированная вечеринка»."
    examples:
      - pl: "Zostaliśmy zaproszeni na zabawę kostiumową."
        ru: "Нас пригласили на костюмированную вечеринку."
        source: { kind: translated, id: 2403041 }
      - pl: "Mieliśmy dobrą zabawę ostatniej nocy."
        ru: "Вчера вечером мы хорошо повеселились."
        source: { kind: translated, id: 2380155 }
      - pl: "Zepsułeś wszystkich zabawę."
        ru: "Ты всем испортил веселье."
        source: { kind: translated, id: 3686930 }
  - id: play
    ru: "игра (детская): towarzysz zabaw «товарищ по играм»"
    note: "Осторожно: zabaw — ещё и повелительное от zabawić «развлеки»."
    examples:
      - pl: "Brak mu towarzysza zabaw."
        ru: "Ему не хватает товарища по играм."
        source: { kind: translated, id: 403192 }
      - pl: "Byłem sam, nie miałem towarzysza zabaw."
        ru: "Я был один, у меня не было товарища по играм."
        source: { kind: translated, id: 645031 }
      - pl: "Dzieci pochłonięte były zabawą."
        ru: "Дети были поглощены игрой."
        source: { kind: translated, id: 365670 }
notes:
  - { kind: usage, text: "Главный оборот — пожелание в родительном падеже без глагола: Miłej zabawy! или Dobrej zabawy! «Хорошо повеселиться!», устроено ровно как «Приятного аппетита!»." }
  - { kind: false-friend, text: "Не «забава» книжного русского, а обычное живое «веселье, вечеринка»: Ale zabawa! «Вот это веселье!»" }
  - { kind: usage, text: "Омонимия, о которой стоит знать: zabaw — это и родительный множественного от zabawa «забав», и повелительное наклонение от zabawić «развлеки». Zabaw gości! значит «Развлеки гостей!», а не «забав гостей»." }
  - { kind: usage, text: "Родня: bawić się «играть, веселиться», bawić kogoś «развлекать», zabawka «игрушка», zabawny «забавный»." }
collocations:
  - { pl: "Miłej zabawy!", ru: "хорошо повеселиться!" }
  - { pl: "towarzysz zabaw", ru: "товарищ по играм" }
  - { pl: "zabawa kostiumowa", ru: "костюмированная вечеринка" }
  - { pl: "dobra zabawa", ru: "хорошее веселье" }
family:
  - { pl: "bawić się", ru: "играть, веселиться", relation: root }
  - { pl: "zabawka", ru: "игрушка", relation: derived }
  - { pl: "zabawny", ru: "забавный", relation: derived }
etymology: "От bawić «развлекать», праславянское *baviti — тот же корень, что в русских «забава», «забавный» и «бавиться»."
memory: "zabawa — «веселье, вечеринка», и корень тот же, что в русской «забаве». Первым делом выучите пожелание, оно стоит в родительном падеже без всякого глагола: Miłej zabawy! «Хорошо повеселиться!» — ровно как «Приятного аппетита!». И держите в голове омоним: zabaw это и «забав» (родительный множественного), и «развлеки!» — повелительное от zabawić."
idioms:
  - { pl: "Miłej zabawy!", ru: "хорошо повеселиться!" }
  - { pl: "towarzysz zabaw", ru: "товарищ по играм" }
  - { pl: "Ale zabawa!", ru: "вот это веселье! (часто ирон.)" }
formExamplesSkip:
  - { form: "zabawo", reason: "звательный падеж отвлечённого существительного: по-польски к веселью не обращаются, форма остаётся только в таблице" }
