# review
id: podpalic
format: 2
lemma: "podpalić"
rank: 4360
pos: verb
pron: { cyr: "потпа́лиць" }
senses:
  - id: set-fire
    ru: "поджечь"
    examples:
      - pl: "Ktoś podpalił stodołę."
        ru: "Кто-то поджёг сарай."
        source: { kind: authored }
      - pl: "Chuligani podpalili samochód."
        ru: "Хулиганы подожгли машину."
        source: { kind: authored }
      - pl: "Podpaliła list i patrzyła, jak płonie."
        ru: "Она подожгла письмо и смотрела, как оно горит."
        source: { kind: authored }
  - id: fire-up
    ru: "раззадорить, завести (разг.)"
    examples:
      - pl: "Trener podpalił drużynę przed finałem."
        ru: "Тренер завёл команду перед финалом."
        source: { kind: authored }
      - pl: "Jego przemówienie podpaliło tłum."
        ru: "Его речь распалила толпу."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "PODPALIĆ — «поджечь», точное соответствие. Но «зажечь» свечу или сигарету — ZAPALIĆ, а «пригорело» на сковороде — PRZYPALIĆ: PRZYPALIŁEM KOTLETY. PODPALIĆ всегда о намеренном огне, часто преступном: PODPALACZ — «поджигатель»." }
  - { kind: usage, text: "Пятьдесят три формы — подпись переходного глагола совершенного вида: страдательное PODPALONY и деепричастие PODPALIWSZY. Видовой партнёр — PODPALAĆ. Разговорное PODPALONY — ещё и «заведённый, на взводе»: KIBICE SĄ PODPALENI." }
  - { kind: government, text: "Что — винительный: PODPALIĆ DOM, LAS, OGNISKO. Чем — творительный: PODPALIĆ ZAPAŁKĄ, BENZYNĄ. Возвратное PODPALIĆ SIĘ — «поджечь себя» или разг. «загореться идеей»." }
  - { kind: pronunciation, text: "Читается «потпа́лиць», три слога, ударение на предпоследнем. D перед P оглушается в «т». L перед I мягкое, конечное Ć — «ць». Повелительное PODPAL — «по́тпаль»." }
  - { kind: register, text: "Нейтральное слово хроники происшествий: PODPALENIE — «поджог». Прямое «разжечь костёр» тоже PODPALIĆ OGNISKO, по-домашнему. Переносное «завести» — разговорное, спортивное." }
collocations:
  - { pl: "podpalić dom", ru: "поджечь дом" }
  - { pl: "podpalić ognisko", ru: "разжечь костёр" }
  - { pl: "celowe podpalenie", ru: "умышленный поджог" }
family:
  - { pl: "podpalac", ru: "поджигать", relation: aspect }
  - { pl: "palić", ru: "жечь; курить", relation: root, id: palic }
  - { pl: "zapalić", ru: "зажечь", relation: root, id: zapalic }
etymology: "Приставка POD- «под-» плюс PALIĆ «жечь», праславянское *paliti, то же, что русское «палить», «опалить». Поджечь — «подпалить снизу»."
memory: "Podpalić — поджечь: podpalić dom, podpalić ognisko. Зажечь свечу — zapalić! Пригорело — przypaliło się. Podpalenie — поджог. Читается «потпа́лиць»."
idioms:
  - { pl: "podpalić atmosferę", ru: "накалить атмосферу" }
