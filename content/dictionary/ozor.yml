# review
id: ozor
format: 2
lemma: "ozór"
rank: 2394
pos: noun
pron: { cyr: "о́зур" }
senses:
  - id: tongue-animal
    ru: "язык (животного, как еда)"
    examples:
      - pl: "Ozór wołowy gotuje się długo."
        ru: "Говяжий язык варится долго."
        source: { kind: authored }
      - pl: "Kupiła ozór na obiad."
        ru: "Она купила язык на обед."
        source: { kind: authored }
      - pl: "Pies wywiesił ozór."
        ru: "Собака высунула язык."
        source: { kind: authored }
  - id: tongue-rude
    ru: "язык (о человеке — грубо, бранно)"
    examples:
      - pl: "Trzymaj ozór za zębami."
        ru: "Держи язык за зубами."
        source: { kind: authored }
      - pl: "Ma za długi ozór."
        ru: "У него слишком длинный язык."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Про человека ozór — слово грубое. Нейтральное «язык» во рту — język, которое уже есть в словаре; ozór уместен о животных и о еде." }
  - { kind: false-friend, text: "Родня русскому «озеро»? Нет — корень другой; ozór восходит к праславянскому *jęzorъ, усиленной форме от того же корня, что и język." }
  - { kind: government, text: "Мужской неодушевлённый; родительный — ozora. Чередование ó/o: ozór, но ozora." }
  - { kind: usage, text: "Оборот trzymać ozór za zębami «держать язык за зубами» — грубоватый вариант обычного trzymać język za zębami. В корпусе слово не встречается, примеры составлены вручную." }
collocations:
  - { pl: "ozór wołowy", ru: "говяжий язык" }
  - { pl: "trzymać ozór za zębami", ru: "держать язык за зубами" }
etymology: "Праславянское *jęzorъ, усиленная форма того же корня, что и język «язык»."
memory: "ozór — «язык» животного или как еда; о человеке это грубо. Нейтральное слово — język. Чередование: ozór, но ozora."
idioms:
  - { pl: "ozór wołowy", ru: "говяжий язык" }
