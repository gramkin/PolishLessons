# review
id: zabojstwo
format: 2
lemma: "zabójstwo"
rank: 1054
pos: noun
pron: { cyr: "забу́йство" }
senses:
  - id: murder
    ru: "убийство"
    examples:
      - pl: "Zabójstwo karane jest śmiercią."
        ru: "Убийство карается смертью."
        source: { kind: tatoeba, id: 1002587 }
      - pl: "Jest winny zabójstwa."
        ru: "Он виновен в убийстве."
        source: { kind: translated, id: 691948 }
      - pl: "Był oskarżony o zabójstwo."
        ru: "Его обвинили в убийстве."
        source: { kind: translated, id: 3706665 }
      - pl: "Policja zaczęła badać sprawę zabójstwa."
        ru: "Полиция начала расследовать дело об убийстве."
        source: { kind: translated, id: 676855 }
      - pl: "Sąd oczyścił go z zarzutu zabójstwa."
        ru: "Суд снял с него обвинение в убийстве."
        source: { kind: translated, id: 5065018 }
      - pl: "Został wmieszany w zabójstwo."
        ru: "Он оказался замешан в убийстве."
        source: { kind: translated, id: 814193 }
notes:
  - { kind: government, text: "oskarżyć kogoś o zabójstwo «обвинить кого-то в убийстве» — предлог o с винительным падежом, а не предложный, как в русском. А «виновен в убийстве» — winny zabójstwa, родительный без предлога." }
  - { kind: usage, text: "zabójstwo — юридический термин «убийство». Более сильное слово об умышленном убийстве — morderstwo, а убийца — zabójca или morderca." }
  - { kind: usage, text: "Средний род: to zabójstwo, tego zabójstwa. Собрано из zabójca + -stwo — суффикс отвлечённых существительных, как в królestwo «королевство»." }
  - { kind: usage, text: "Множественное число zabójstwa употребляется в статистике и сводках: seria zabójstw «серия убийств»." }
collocations:
  - { pl: "oskarżyć o zabójstwo", ru: "обвинить в убийстве" }
  - { pl: "winny zabójstwa", ru: "виновный в убийстве" }
  - { pl: "sprawa zabójstwa", ru: "дело об убийстве" }
  - { pl: "usiłowanie zabójstwa", ru: "покушение на убийство" }
family:
  - { pl: "zabójca", ru: "убийца", relation: root, id: zabojca }
  - { pl: "zabić", ru: "убить", relation: root, id: zabic }
  - { pl: "zabójczy", ru: "убийственный", relation: derived }
etymology: "Из zabójca «убийца» + суффикс -stwo, как русское «убийство» от «убить». Корень тот же, что в zabić «убить» и в русском «бить»."
memory: "zabójstwo — «убийство», средний род: to zabójstwo. Главное отличие от русского в управлении: oskarżyć o zabójstwo «обвинить в убийстве» — предлог o с винительным, а winny zabójstwa «виновен в убийстве» — родительный без предлога."
idioms:
  - { pl: "zabójstwo z premedytacją", ru: "умышленное убийство" }
  - { pl: "usiłowanie zabójstwa", ru: "покушение на убийство" }
