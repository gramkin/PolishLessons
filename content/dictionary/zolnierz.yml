# review
id: zolnierz
format: 2
lemma: "żołnierz"
rank: 783
pos: noun
pron: { cyr: "жо́унеш" }
senses:
  - id: soldier
    ru: "солдат"
    examples:
      - pl: "Ten żołnierz poświęcił własne życie by ratować przyjaciela."
        ru: "Солдат пожертвовал собственной жизнью, чтобы спасти друга."
        source: { kind: tatoeba, id: 608822 }
      - pl: "Dzielny żołnierz."
        ru: "Храбрый солдат."
        source: { kind: translated, id: 3744861 }
      - pl: "Żołnierz dał mi wody."
        ru: "Солдат дал мне воды."
        source: { kind: translated, id: 1360022 }
  - id: soldiers
    ru: "żołnierze — солдаты"
    examples:
      - pl: "Żołnierze są gotowi do walki."
        ru: "Солдаты готовы к бою."
        source: { kind: tatoeba, id: 3279886 }
      - pl: "Żołnierze nie mogli zrobić nic aż do wiosny."
        ru: "Солдаты не могли ничего сделать до весны."
        source: { kind: tatoeba, id: 982514 }
      - pl: "Żołnierze zginęli."
        ru: "Солдаты погибли."
        source: { kind: translated, id: 10542850 }
  - id: be-soldier
    ru: "być żołnierzem — быть солдатом (творительный)"
    examples:
      - pl: "Był żołnierzem w czasie wojny."
        ru: "Он был солдатом во время войны."
        source: { kind: tatoeba, id: 1110168 }
      - pl: "Chcę być żołnierzem."
        ru: "Я хочу быть солдатом."
        source: { kind: translated, id: 10601587 }
      - pl: "Nie jestem żołnierzem."
        ru: "Я не солдат."
        source: { kind: translated, id: 7128897 }
  - id: many
    ru: "wielu żołnierzy — много солдат (родительный)"
    examples:
      - pl: "Poległo tu wielu żołnierzy."
        ru: "Здесь полегло много солдат."
        source: { kind: translated, id: 4735270 }
      - pl: "To najdzielniejszy z żołnierzy."
        ru: "Это храбрейший из солдат."
        source: { kind: translated, id: 367809 }
      - pl: "Trzech innych żołnierzy zostało rannych."
        ru: "Трое других солдат были ранены."
        source: { kind: translated, id: 10599139 }
notes:
  - { kind: usage, text: "Этимология неожиданная: żołnierz пришло из немецкого Söldner «наёмник», от Sold «жалованье». Солдат — буквально «тот, кому платят». Русское «солдат» устроено так же, только пришло через итальянское soldato от soldo «монета»." }
  - { kind: government, text: "być żołnierzem «быть солдатом» — творительный падеж; wielu żołnierzy «много солдат» — родительный." }
  - { kind: usage, text: "Grób Nieznanego Żołnierza — «Могила Неизвестного Солдата», название совпадает с русским." }
  - { kind: usage, text: "Звательный żołnierzu живёт в командах и обращениях — в отличие от неодушевлённых существительных, у которых звательный не употребляется." }
collocations:
  - { pl: "być żołnierzem", ru: "быть солдатом" }
  - { pl: "dzielny żołnierz", ru: "храбрый солдат" }
  - { pl: "Grób Nieznanego Żołnierza", ru: "Могила Неизвестного Солдата" }
  - { pl: "wielu żołnierzy", ru: "много солдат" }
family:
  - { pl: "wojsko", ru: "войско", relation: root }
  - { pl: "wojna", ru: "война", relation: root }
  - { pl: "służba", ru: "служба", relation: root }
  - { pl: "oficer", ru: "офицер", relation: root }
etymology: "Из немецкого Söldner «наёмник», от Sold «жалованье»; отсюда же белорусское «жаўнер». Русское «солдат» — тот же ход, но через итальянское soldato от soldo «монета»."
memory: "żołnierz — «солдат», но пришло слово не из латыни, а из немецкого Söldner «наёмник», от Sold «жалованье»: солдат буквально «тот, кому платят». Русское «солдат» устроено точно так же, только через итальянское soldato от soldo «монета». Управление: być żołnierzem — творительный падеж."
idioms:
  - { pl: "Grób Nieznanego Żołnierza", ru: "Могила Неизвестного Солдата" }
  - { pl: "być żołnierzem", ru: "быть солдатом" }
  - { pl: "dzielny żołnierz", ru: "храбрый солдат" }
formExamplesSkip:
  - { form: "żołnierzów", reason: "устаревший вариант родительного множественного; современная форма — żołnierzy" }
