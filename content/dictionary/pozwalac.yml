# review
id: pozwalac
format: 2
lemma: "pozwalać"
rank: 1067
pos: verb
aspect: imperf
aspectPair: pozwolic
pron: { cyr: "позва́лаць" }
senses:
  - id: allow
    ru: "разрешать, позволять (кому-то что-то)"
    examples:
      - pl: "Nie pozwalam na spanie w klasie."
        ru: "Я не разрешаю спать в классе."
        source: { kind: tatoeba, id: 1453507 }
      - pl: "Pozwalają tutaj parkować."
        ru: "Здесь разрешают парковаться."
        source: { kind: translated, id: 3870865 }
      - pl: "Nie pozwalaj im tego robić."
        ru: "Не разрешай им это делать."
        source: { kind: translated, id: 6554037 }
  - id: enable
    ru: "давать возможность, позволять (о вещи, средстве)"
    examples:
      - pl: "Jest strona, która pozwala łatwo porównać ceny."
        ru: "Есть сайт, который позволяет легко сравнить цены."
        source: { kind: tatoeba, id: 4719251 }
      - pl: "Komputer pozwala zaoszczędzić czas."
        ru: "Компьютер позволяет сэкономить время."
        source: { kind: translated, id: 5933043 }
  - id: afford
    ru: "pozwalać sobie na coś — позволять себе что-то"
    examples:
      - pl: "Nie możesz sobie pozwalać na zaniedbywanie zdrowia."
        ru: "Ты не можешь позволять себе запускать здоровье."
        source: { kind: translated, id: 3382421 }
      - pl: "Nie pozwalam sobie na słodycze."
        ru: "Я не позволяю себе сладкое."
        source: { kind: authored }
notes:
  - { kind: government, text: "Два управления: pozwalać komuś na coś «разрешать кому-то что-то» — дательный плюс na с винительным, и pozwalać komuś coś zrobić — дательный плюс инфинитив. Русское «разрешать» второй конструкции не знает." }
  - { kind: usage, text: "Несовершенный вид к pozwolić «разрешить, позволить»." }
  - { kind: usage, text: "pozwalać sobie na coś «позволять себе что-то» — и о деньгах, и о поведении: Nie mogę sobie na to pozwolić «Я не могу себе этого позволить»." }
  - { kind: usage, text: "Вежливая формула Pozwoli pan? «Разрешите?» — при этом чаще берут совершенный вид pozwolić, а не pozwalać." }
collocations:
  - { pl: "pozwalać sobie na coś", ru: "позволять себе что-то" }
  - { pl: "nie pozwalać", ru: "не разрешать" }
  - { pl: "pozwalać komuś na coś", ru: "разрешать кому-то что-то" }
family:
  - { pl: "pozwolić", ru: "разрешить, позволить", relation: aspect, id: pozwolic }
  - { pl: "pozwolenie", ru: "разрешение", relation: derived }
  - { pl: "dozwolony", ru: "разрешённый, дозволенный", relation: derived }
etymology: "Приставка po- плюс корень, родственный wola «воля» и wolno «можно». Русское «позволять» собрано из тех же частей и от того же корня «воля»."
memory: "pozwalać — «разрешать, позволять», несовершенный вид к pozwolić. Два управления: pozwalać komuś na coś (дательный плюс na с винительным) и pozwalać komuś coś zrobić — с инфинитивом, чего русское «разрешать» не умеет."
idioms:
  - { pl: "pozwalać sobie na coś", ru: "позволять себе что-то" }
  - { pl: "nie pozwalać dojść do słowa", ru: "не давать слова сказать" }
