# review
id: zlozyc
format: 2
lemma: "złożyć"
rank: 1092
pos: verb
aspect: perf
pron: { cyr: "зуо́жыць" }
senses:
  - id: submit
    ru: "подать (заявление, жалобу, отчёт)"
    examples:
      - pl: "Złożył rezygnację."
        ru: "Он подал в отставку."
        source: { kind: translated, id: 746105 }
      - pl: "Tom złożył podanie o wizę."
        ru: "Том подал заявление на визу."
        source: { kind: translated, id: 3863281 }
      - pl: "Możemy złożyć zamówienie?"
        ru: "Можем сделать заказ?"
        source: { kind: translated, id: 3603004 }
  - id: fold
    ru: "сложить (пополам, зонт), собрать"
    examples:
      - pl: "Złóż mapę i idź prosto."
        ru: "Сложи карту и иди прямо."
        source: { kind: translated, id: 13030185 }
      - pl: "Złożyliśmy parasole i zaczęliśmy biec."
        ru: "Мы сложили зонты и побежали."
        source: { kind: translated, id: 12085345 }
  - id: complex
    ru: "złożony — сложный, составной"
    examples:
      - pl: "To złożony problem."
        ru: "Это сложная проблема."
        source: { kind: translated, id: 7881194 }
      - pl: "USA złożone są z 50 stanów."
        ru: "США состоят из пятидесяти штатов."
        source: { kind: translated, id: 921718 }
notes:
  - { kind: government, text: "Главное неочевидное значение — «подать»: złożyć wniosek «подать заявление», złożyć skargę «подать жалобу», złożyć rezygnację «подать в отставку». Русское «сложить» так не употребляется." }
  - { kind: usage, text: "Несовершенный вид — składać. Отсюда же składać się z czegoś «состоять из чего-то»." }
  - { kind: usage, text: "Причастие złożony работает как прилагательное «сложный, составной»: złożony problem, słowo złożone «сложное слово»." }
  - { kind: usage, text: "Оборот tak się złożyło, że значит «так вышло, что»: Tak się złożyło, że byłam blisko." }
collocations:
  - { pl: "złożyć wniosek", ru: "подать заявление" }
  - { pl: "złożyć skargę", ru: "подать жалобу" }
  - { pl: "złożyć rezygnację", ru: "подать в отставку" }
  - { pl: "złożyć życzenia", ru: "поздравить" }
family:
  - { pl: "składać", ru: "складывать, подавать (несовершенный вид)", relation: aspect }
  - { pl: "skład", ru: "состав", relation: root }
  - { pl: "złożony", ru: "сложный, составной", relation: derived }
etymology: "Приставка z- плюс łożyć, того же корня, что kłaść «класть» — буквально «сложить вместе». Русское «сложить» собрано так же, но значение «подать документ» развилось только в польском."
memory: "złożyć — не только «сложить», но и «подать»: złożyć wniosek «подать заявление», złożyć skargę «подать жалобу», złożyć rezygnację «подать в отставку». А причастие złożony значит «сложный, составной»."
idioms:
