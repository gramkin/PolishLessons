# review
id: publiczny
format: 2
lemma: "publiczny"
rank: 1488
pos: adj
pron: { cyr: "публи́чны" }
senses:
  - id: public
    ru: "общественный, государственный"
    examples:
      - pl: "Biblioteki publiczne uznajemy za podstawowe prawo obywatelskie."
        ru: "Публичные библиотеки мы считаем основным гражданским правом."
        source: { kind: translated, id: 1356608 }
      - pl: "Czy korzystasz ze środków transportu publicznego?"
        ru: "Ты пользуешься общественным транспортом?"
        source: { kind: translated, id: 12105843 }
      - pl: "Ukradł publiczne pieniądze."
        ru: "Он украл общественные деньги."
        source: { kind: translated, id: 639843 }
  - id: in-public
    ru: "публичный, открытый, при свидетелях"
    examples:
      - pl: "Nie rób scen w miejscu publicznym."
        ru: "Не устраивай сцен в общественном месте."
        source: { kind: translated, id: 3545500 }
      - pl: "Nie przywykłem do publicznych wystąpień."
        ru: "Я не привык к публичным выступлениям."
        source: { kind: translated, id: 348939 }
notes:
  - { kind: false-friend, text: "szkoła publiczna — это «государственная школа», а не «публичная»; opinia publiczna — «общественное мнение». Русское «публичный» заметно уже польского." }
  - { kind: usage, text: "Антоним — prywatny «частный», уже есть карточкой: szkoła publiczna против szkoła prywatna." }
  - { kind: usage, text: "Ходовые сочетания: transport publiczny «общественный транспорт», miejsce publiczne «общественное место», fundusze publiczne «общественные средства»." }
  - { kind: register, text: "dom publiczny значит «публичный дом», так что сочетания со словом стоит строить внимательно." }
collocations:
  - { pl: "opinia publiczna", ru: "общественное мнение" }
  - { pl: "transport publiczny", ru: "общественный транспорт" }
  - { pl: "miejsce publiczne", ru: "общественное место" }
etymology: "Из латинского publicus «общественный, народный» через европейские языки. Русское «публичный» пришло тем же путём, но польское слово шире и покрывает ещё и «государственный»."
memory: "publiczny — «общественный, публичный, государственный» сразу. szkoła publiczna это «государственная школа», transport publiczny «общественный транспорт». Антоним — prywatny."
idioms:
  - { pl: "opinia publiczna", ru: "общественное мнение" }
  - { pl: "transport publiczny", ru: "общественный транспорт" }
  - { pl: "publiczna tajemnica", ru: "секрет Полишинеля" }
formExamplesSkip:
