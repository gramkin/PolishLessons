notes:
  - { kind: false-friend, text: "Русский «забег» и польское ZABIEG построены одинаково — приставка ZA- и корень бега, — а значат совершенно разное. Русский «забег» это состязание в беге, и по-польски он называется BIEG или WYŚCIG. Польское ZABIEG значит медицинскую процедуру или операцию: ZABIEG CHIRURGICZNY, ZABIEG POD NARKOZĄ, и в больнице это слово слышишь постоянно. Второе значение — хлопоты, старания, ходатайство: ZABIEGI O POSADĘ «хлопоты о должности». Глагол ZABIEGAĆ O COŚ значит «добиваться чего-то», и от него второе значение прямо происходит." }
  - { kind: usage, text: "Девять форм, мужской род, неодушевлённое. Местный единственного — ZABIEGU, с окончанием -U, потому что основа кончается на заднеязычный G; по тому же правилу идут PASKU и OŚRODKU. Родительный единственного тоже ZABIEGU, и две формы совпадают, различаясь только предлогом: DO ZABIEGU родительный, PO ZABIEGU местный. Винительный равен именительному. Во втором значении слово употребляется почти только во множественном: ZABIEGI O COŚ, с предлогом O и винительным. Медицинское управление: ZABIEG NA CZYMŚ или ZABIEG CZEGOŚ, смотря по органу." }
  - { kind: pronunciation, text: "Читается «за́бек», два слога, ударение на первом. Буквосочетание IE даёт «е» с мягким B, поэтому середина звучит «бе», а не «бье». Конечное G оглушается в «к», и потому именительный звучит «за́бек», а не «за́бег». В форме ZABIEGU звонкое G возвращается: «забе́гу». В форме ZABIEGIEM слышно «забе́гем». В форме ZABIEGÓW буква Ó даёт «у», а конечное W оглушается: «забе́гуф»." }
  - { kind: register, text: "Слово нейтральное и очень частое в медицинском обиходе: ZABIEG, DROBNY ZABIEG, ZABIEG PLANOWY, SALA ZABIEGOWA «процедурная». Между ZABIEG и OPERACJA есть разница в тяжести: операцией называют вмешательство серьёзное и с разрезом, процедурой — всё остальное, и в разговоре с врачом это различие слышно. Во втором значении слово книжное и чуть ироническое: ZABIEGI DYPLOMATYCZNE, ZABIEGI O WZGLĘDY. Есть и третье, специальное употребление — ZABIEG STYLISTYCZNY, то есть приём в тексте, и его проходят в школе." }
