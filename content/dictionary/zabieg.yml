etymology: "Приставка ZA- плюс корень *běg- «бежать», тот же, что в русском «бег» и «забег». Разошлись языки на образе. Русский понял приставку буквально, как бег на отрезок, и получил состязание. Польский пошёл за переносным значением глагола ZABIEGAĆ O COŚ — «обегать всех ради чего-то, хлопотать», и слово стало означать хлопоты; русский знает ровно ту же метафору в выражениях «бегать по инстанциям» и «обивать пороги», но существительного из неё не сделал. Медицинское значение младше остальных и выросло из общего смысла «действие, манипуляция»: сначала так называли любое вмешательство врача, затем закрепили за всем, что проще операции."
memory: "Строится как русский «забег» — za- + корень бега, — но значит процедуру или операцию: zabieg chirurgiczny. Состязание в беге это bieg или wyścig. Второе значение, хлопоты, идёт от глагола zabiegać o coś «добиваться», то есть обегать всех ради чего-то; русский знает эту метафору как «бегать по инстанциям». Местный zabiegu на -u, как pasku и ośrodku. Конечное g оглушается, слово звучит «за́бек»."
idioms:
  - { pl: "zabieg chirurgiczny", ru: "хирургическая операция" }
