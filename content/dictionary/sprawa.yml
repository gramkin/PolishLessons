# review
id: sprawa
format: 2
lemma: "sprawa"
rank: 115
pos: noun
pron: { cyr: "спра́ва" }
senses:
  - id: matter
    ru: "дело, вопрос (то, чем занимаются или о чём речь)"
    examples:
      - pl: "Nie twoja sprawa."
        ru: "Не твоё дело."
        source: { kind: tatoeba, id: 567240 }
      - pl: "To jest sprawa niezwykłej wagi."
        ru: "Это дело необычайной важности."
        source: { kind: tatoeba, id: 11318568 }
      - pl: "Mam kilka spraw do załatwienia."
        ru: "Мне нужно уладить несколько дел."
        source: { kind: tatoeba, id: 623617 }
  - id: case
    ru: "дело (судебное), разбирательство"
    examples:
      - pl: "Nie złożę sprawy do sądu."
        ru: "Я не буду подавать в суд."
        source: { kind: tatoeba, id: 3841291 }
      - pl: "Badamy tą sprawę."
        ru: "Мы расследуем этот инцидент."
        source: { kind: tatoeba, id: 13782758 }
      - pl: "Sąd rozpatrzy sprawę w przyszłym tygodniu."
        ru: "Суд рассмотрит дело на следующей неделе."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "sprawa — «дело», а не «справа». Русское «справа» по-польски po prawej stronie." }
  - { kind: usage, text: "w sprawie значит «по вопросу, по поводу»: Dzwonię w sprawie mieszkania «Звоню по поводу квартиры»." }
  - { kind: usage, text: "Работа как занятие — praca; sprawa — это вопрос, случай или судебное дело." }
collocations:
  - { pl: "w sprawie", ru: "по вопросу, по поводу" }
  - { pl: "załatwić sprawę", ru: "уладить дело" }
  - { pl: "sprawa sądowa", ru: "судебное дело" }
  - { pl: "nie twoja sprawa", ru: "не твоё дело" }
etymology: "От sprawić «устроить, сделать»; корень тот же, что в prawo и prawy — ср. русское «справить, справиться с делом»."
memory: "sprawa — «дело» в смысле вопроса или случая (Nie twoja sprawa! «Не твоё дело!»), а работа — praca. С русским «справа» ничего общего: «справа» по-польски po prawej."
idioms:
  - { pl: "jasna sprawa", ru: "ясное дело" }
  - { pl: "stawiać sprawę na ostrzu noża", ru: "ставить вопрос ребром" }
  - { pl: "słoń a sprawa polska", ru: "о своём, о наболевшем" }
formExamplesSkip:
  - { form: "sprawo", reason: "звательный падеж от отвлечённого существительного в живой речи не встречается" }
