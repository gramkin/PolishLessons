    ru: "неограниченный (о власти), абсолютный (в науке)"
    examples:
      - pl: "Król miał władzę absolutną."
        ru: "У короля была абсолютная власть."
        source: { kind: authored }
      - pl: "Zero absolutne to minus 273 stopnie."
        ru: "Абсолютный ноль — это минус 273 градуса."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Значения те же, что у русского «абсолютный», но польское слово намного чаще служит простым усилителем: ABSOLUTNY HIT, ABSOLUTNY GENIUSZ, ABSOLUTNA KATASTROFA. Русский тут скажет «настоящий», «полный», «просто». А «абсолютный слух» — SŁUCH ABSOLUTNY, совпадает с русским." }
  - { kind: usage, text: "Степеней сравнения нет: абсолютное не бывает более абсолютным. Все одиннадцать форм живые. Форма для мужчин-людей ABSOLUTNI встречается в истории — ABSOLUTNI WŁADCY, «абсолютные монархи», и в спорте: ABSOLUTNI MISTRZOWIE. Наречие ABSOLUTNIE, «абсолютно», в разговоре ещё частотнее прилагательного." }
  - { kind: government, text: "В значении усилителя прилагательное стоит перед существительным: ABSOLUTNY HIT, ABSOLUTNA CISZA. В терминах — после: WŁADZA ABSOLUTNA, ZERO ABSOLUTNE, SŁUCH ABSOLUTNY. Требований к падежу нет." }
  - { kind: pronunciation, text: "Читается «абсолю́тны», четыре слога, ударение на предпоследнем. LU даёт мягкое «лю», как в русском. Конечное -TNY произносится плотно, без гласной между T и N: «-тны»." }
  - { kind: register, text: "Нейтральное, но с книжным оттенком в терминах и с разговорным — в роли усилителя. Молодёжь говорит ABSOLUTNY TOP или ABSOLUTNY MUST-HAVE, и это уже рекламный стиль. В истории MONARCHIA ABSOLUTNA — стандартный термин." }
collocations:
  - { pl: "władza absolutna", ru: "абсолютная власть" }
  - { pl: "absolutna cisza", ru: "абсолютная тишина" }
