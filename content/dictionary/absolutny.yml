etymology: "Из латинского absolutus, «освобождённый, завершённый», причастия от absolvere «развязывать, освобождать». Абсолютное — то, что ничем не связано и ни от чего не зависит. От того же глагола русское «абсолютный» и польское ABSOLWENT, «выпускник»: тот, кого «отпустили», закончив учёбу."
memory: "Absolutny — абсолютный, полный: absolutna cisza, władza absolutna. Часто просто усилитель: absolutny hit — настоящий хит. Родня absolwent — выпускник, «отпущенный». Читается «абсолю́тны»."
idioms:
  - { pl: "zero absolutne", ru: "абсолютный ноль; полная бездарность (разг.)" }
