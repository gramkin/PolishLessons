notes:
  - { kind: false-friend, text: "Корень общий с русским «крутить»: ZAKRĘT от ZAKRĘCIĆ, а русский «поворот» построен от «ворота», то есть от поворачивания. Образы разные: поляк видит в повороте закручивание, русский — разворот. Из того же гнезда идёт очень полезное слово ZAKRĘTKA, то есть крышка, которую закручивают, на бутылке или на банке. В русском «закрутка» так не говорят, и это слово приходится просто выучить." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Носовое Ę держится во всех падежах. В местном падеже T переходит в CI: ZAKRĘT, но NA ZAKRĘCIE. Переносное значение, о трудном положении, работает только с предлогом NA и местным падежом: BYĆ NA ZAKRĘCIE, и почти всегда о человеке или о фирме, а не о вещи." }
  - { kind: government, text: "На повороте — предлог NA с местным падежом: NA ZAKRĘCIE. За поворотом — ZA ZAKRĘTEM, предлог ZA с творительным. Перед поворотом — PRZED ZAKRĘTEM, тоже творительный. Входить в поворот — BRAĆ ZAKRĘT, винительный без предлога, тогда как русский говорит «входить в поворот», с предлогом. Быть в трудном положении — BYĆ NA ZAKRĘCIE, снова NA с местным." }
  - { kind: pronunciation, text: "Читается «закре́нт», два слога, ударение на втором. Носовое Ę перед T даёт «эн», как и в POTĘGA «поте́нга». Конечное T звучит глухо. В местном падеже ZAKRĘCIE сочетание CIE даёт мягкое «це», и слышно «закре́нце». В родственном ZAKRĘCIĆ конечное Ć мягкое: «закре́нциць»." }
  - { kind: register, text: "Прямое значение нейтральное и дорожное: OSTRY ZAKRĘT «крутой поворот», ZAKRĘT W PRAWO, ZNAK OSTRZEGAJĄCY PRZED ZAKRĘTEM. Переносное разговорное и очень живое: BYĆ NA ZAKRĘCIE значит переживать трудный период, в работе, в деньгах или в жизни вообще. Русский в этом месте скажет «на перепутье» или «в сложном положении», но образа поворота не употребит." }
collocations:
  - { pl: "ostry zakręt", ru: "крутой поворот" }
  - { pl: "brać zakręt", ru: "входить в поворот" }
  - { pl: "za zakrętem", ru: "за поворотом" }
family:
  - { pl: "zakręcić", ru: "закрутить, завернуть", relation: root }
  - { pl: "kręcić", ru: "крутить, вертеть", relation: root, id: krecic }
  - { pl: "zakrętka", ru: "крышка, пробка", relation: derived }
etymology: "От ZAKRĘCIĆ «закрутить», от KRĘCIĆ, от праславянского корня, давшего русские «крутить», «круча» и «крутой». Носовое Ę отвечает русскому У, как в WĘZEŁ и «узле». Русский для изгиба дороги взял другой корень, от «ворота» и «вертеть», и получил «поворот». Из польского гнезда вышла ZAKRĘTKA «крышка», слово ежедневное, и ZAKRĘT как изгиб чего угодно: дороги, реки, кишки."
memory: "Корень общий с русским «крутить», и поляк видит поворот как закручивание, а русский как поворачивание. Отсюда же ежедневное zakrętka «крышка», та, что закручивается. Носовое ę отвечает русскому у, как в węzeł и «узле». Переносное значение живое: być na zakręcie значит переживать трудный период, а по-русски это «на перепутье». В местном падеже na zakręcie."
idioms:
  - { pl: "być na zakręcie", ru: "быть на перепутье, в трудном положении" }
