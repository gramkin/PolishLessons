# review
id: poklocic
format: 2
lemma: "pokłócić"
rank: 4236
pos: verb
pron: { cyr: "поку́циць" }
senses:
  - id: quarrel
    ru: "с SIĘ — поссориться"
    examples:
      - pl: "Pokłócił się z żoną o pieniądze."
        ru: "Он поссорился с женой из-за денег."
        source: { kind: authored }
      - pl: "Pokłóciła się z siostrą."
        ru: "Она поссорилась с сестрой."
        source: { kind: authored }
      - pl: "Pokłócili się o politykę."
        ru: "Они поссорились из-за политики."
        source: { kind: authored }
  - id: set-at-odds
    ru: "поссорить (кого-то с кем-то)"
    examples:
      - pl: "Pokłócił mnie z przyjacielem."
        ru: "Он поссорил меня с другом."
        source: { kind: authored }
      - pl: "Takie tematy pokłócą każdą rodzinę."
        ru: "Такие темы перессорят любую семью."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "POKŁÓCIĆ SIĘ — «поссориться», а не «поколотить». «Поколотить» — POBIĆ. Ссора — KŁÓTNIA. POKŁÓCENI — «в ссоре»: SĄ POKŁÓCENI OD LAT «они в ссоре уже много лет»." }
  - { kind: usage, text: "Пятьдесят три формы. Почти всегда с SIĘ: POKŁÓCIĆ SIĘ. Страдательное POKŁÓCONY живёт как прилагательное «в ссоре». Будущее: POKŁÓCĘ SIĘ, POKŁÓCISZ SIĘ; повелительное POKŁÓĆ — обычно с отрицанием. Несовершенный вид — KŁÓCIĆ SIĘ." }
  - { kind: government, text: "С кем — Z с творительным: POKŁÓCIĆ SIĘ Z BRATEM. Из-за чего — O с винительным: O PIENIĄDZE, O SPADEK. Кого с кем — POKŁÓCIĆ KOGOŚ Z KIMŚ." }
  - { kind: pronunciation, text: "Читается «поку́циць»: ŁÓ — «у», CI — «ци», ударение на предпоследнем слоге. POKŁÓCĘ — «поку́цэ»." }
  - { kind: register, text: "Нейтральное и разговорное. POKŁÓCIĆ SIĘ NA ŚMIERĆ I ŻYCIE — разговорное «разругаться насмерть». В официальной речи — POSPRZECZAĆ SIĘ, POPADAĆ W KONFLIKT." }
collocations:
  - { pl: "pokłócić się z kimś", ru: "поссориться с кем-то" }
  - { pl: "pokłócić się o pieniądze", ru: "поссориться из-за денег" }
  - { pl: "być pokłóconym", ru: "быть в ссоре" }
family:
  - { pl: "kłócić", ru: "ссорить; с SIĘ — ссориться", relation: root, id: klocic }
  - { pl: "kłótnia", ru: "ссора", relation: derived, id: klotnia }
  - { pl: "pogodzić", ru: "помирить", relation: antonym, id: pogodzic }
etymology: "Приставка PO- плюс KŁÓCIĆ «мутить, ссорить», праславянское *klǫtiti «мутить, взбалтывать»: ссора — это «взбаламученные» отношения."
memory: "Pokłócić się — поссориться: pokłócił się z żoną. Pokłóceni — в ссоре. Kłótnia — ссора. Читается «поку́циць»."
idioms:
  - { pl: "pokłócić się na śmierć i życie", ru: "разругаться насмерть" }
