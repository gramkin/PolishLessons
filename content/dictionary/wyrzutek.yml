notes:
  - { kind: government, text: "Мужской ЛИЧНЫЙ род: мн. ч. wyrzutkowie или wyrzutki, родительный мн. wyrzutków. Изгой общества — wyrzutek społeczeństwa, с родительным." }
  - { kind: false-friend, text: "От wyrzucić «выбросить», которое уже есть в словаре. Буквально «выброшенный». Русский «изгой» — от «гоить, изгоить», образ изгнания, а не выбрасывания." }
  - { kind: usage, text: "Не путайте с wyrzut «упрёк» и wyrzuty sumienia «угрызения совести» — тот же корень, но другое слово." }
  - { kind: usage, text: "В корпусе слово не встречается, поэтому все примеры составлены вручную." }
collocations:
  - { pl: "wyrzutek społeczeństwa", ru: "изгой общества" }
etymology: "От wyrzucić «выбросить» — буквально «выброшенный». Русский «изгой» — от «изгоить», образ изгнания."
memory: "wyrzutek — «изгой», буквально «выброшенный», от wyrzucić. Не путайте с wyrzut «упрёк» и wyrzuty sumienia «угрызения совести»."
idioms:
  - { pl: "wyrzutek społeczeństwa", ru: "изгой общества" }
