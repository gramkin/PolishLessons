# review
id: odnosnie
format: 2
lemma: "odnośnie"
rank: 2326
pos: adv
pron: { cyr: "одно́щне" }
senses:
  - id: regarding
    ru: "относительно, касательно"
    examples:
      - pl: "Odnośnie do pańskiego pisma — odpowiemy w piątek."
        ru: "Относительно вашего письма — ответим в пятницу."
        source: { kind: authored }
      - pl: "Mam pytanie odnośnie do terminu."
        ru: "У меня вопрос относительно срока."
        source: { kind: authored }
  - id: as-for
    ru: "что касается"
    examples:
      - pl: "Odnośnie do kosztów, decyzja zapadnie później."
        ru: "Что касается расходов, решение будет позже."
        source: { kind: authored }
      - pl: "Zgłoszono uwagi odnośnie do projektu."
        ru: "Поступили замечания относительно проекта."
        source: { kind: authored }
  - id: concerning
    ru: "по поводу"
    examples:
      - pl: "Dzwonię odnośnie do ogłoszenia."
        ru: "Я звоню по поводу объявления."
        source: { kind: authored }
notes:
  - { kind: government, text: "ГЛАВНАЯ ТРУДНОСТЬ СЛОВА — ПРЕДЛОГ DO, КОТОРОГО РУССКИЙ НЕ ЖДЁТ. Норма требует odnośnie DO czegoś: odnośnie do sprawy, odnośnie do pisma. Оборот без do, прямо с родительным — odnośnie sprawy — слышится постоянно, но считается ошибкой. Виновато как раз сходство с русским «относительно чего-л.», где никакого предлога не нужно." }
  - { kind: register, text: "Слово канцелярское и в живой речи звучит тяжело. В разговоре вместо него говорят co do czegoś «что до», jeśli chodzi o «если говорить о» или просто w sprawie «по делу». В письме к учреждению odnośnie do уместно, в письме другу — нет." }
  - { kind: false-friend, text: "Ловушки в значении нет: odnośnie и «относительно» совпадают. Ловушка в происхождении: слово образовано от odnosić się do «относиться к», и предлог do в нём как бы остался от глагола. Русское «относительно» потеряло свой предлог, польское сохранило." }
  - { kind: pronunciation, text: "Четыре слога, ударение на предпоследнем: od-no-ŚNIE — точнее od-NO-śnie. Ś читается как щ, ni как нь: «одно́щне». Слово не изменяется." }
collocations:
  - { pl: "odnośnie do sprawy", ru: "относительно дела" }
  - { pl: "odnośnie do pisma", ru: "относительно письма" }
  - { pl: "uwagi odnośnie do projektu", ru: "замечания по проекту" }
family:
  - { pl: "odnosić się", ru: "относиться", relation: root }
  - { pl: "co do", ru: "что до, относительно", relation: derived }
  - { pl: "w sprawie", ru: "по делу", relation: derived }
etymology: "От odnosić się do czegoś «относиться к чему-л.», приставка od- плюс nosić «носить» — тот же корень, что русские «носить» и «относиться». Наречие застыло из глагольного оборота вместе с предлогом do, которым глагол управлял. Отсюда и норма odnośnie do, странная на первый взгляд."
memory: "odnośnie — «относительно», но требует предлога DO: odnośnie do sprawy. Без do — частая ошибка, вызванная как раз русским «относительно чего-л.». Слово канцелярское; в разговоре говорят co do или jeśli chodzi o."
idioms:
  - { pl: "odnośnie do powyższego", ru: "в связи с вышеизложенным" }
  - { pl: "jeśli chodzi o", ru: "что касается" }
formExamples:
  - form: "odnośnie"
    pl: "Mam pytanie odnośnie do terminu."
    ru: "У меня вопрос относительно срока."
    source: { kind: authored }
  - form: "odnośnie"
    pl: "Zgłoszono uwagi odnośnie do projektu."
    ru: "Поступили замечания относительно проекта."
    source: { kind: authored }
  - form: "odnośnie"
    pl: "Dzwonię odnośnie do ogłoszenia w gazecie."
    ru: "Я звоню по поводу объявления в газете."
    source: { kind: authored }
