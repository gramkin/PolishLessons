# review
id: oprocz
format: 2
lemma: "oprócz"
rank: 1350
pos: prep
pron: { cyr: "о́пруч" }
senses:
  - id: except
    ru: "кроме, за исключением (с родительным падежом)"
    examples:
      - pl: "Nie ma nikogo innego oprócz ciebie."
        ru: "Для меня не существует никого, кроме тебя."
        source: { kind: tatoeba, id: 13784857 }
      - pl: "Nie ma żadnych przyjaciół oprócz mnie."
        ru: "У него нет друзей, кроме меня."
        source: { kind: tatoeba, id: 1110163 }
      - pl: "Nikt oprócz ciebie nie umie robić takiej smacznej sałatki."
        ru: "Никто, кроме тебя, не умеет готовить такой вкусный салат."
        source: { kind: tatoeba, id: 1584346 }
  - id: besides
    ru: "кроме того, вдобавок"
    examples:
      - pl: "Co wiecie oprócz tego?"
        ru: "Что еще вам известно?"
        source: { kind: tatoeba, id: 7730307 }
      - pl: "Oprócz tego ona ma ładnego kota."
        ru: "А еще у нее есть красивый кот."
        source: { kind: tatoeba, id: 7730331 }
      - pl: "Jill jest inteligentna i oprócz tego miła."
        ru: "Джилл умна и к тому же симпатична."
        source: { kind: tatoeba, id: 7730335 }
notes:
  - { kind: government, text: "Предлог требует родительного падежа: oprócz ciebie «кроме тебя», oprócz mnie «кроме меня»." }
  - { kind: usage, text: "Oprócz tego — «кроме того, вдобавок», готовый связующий оборот в начале предложения." }
  - { kind: usage, text: "Синонимы — poza «помимо» и z wyjątkiem «за исключением». Oprócz самый обиходный из трёх." }
  - { kind: pronunciation, text: "ó звучит как «у», а конечное cz как «ч»: о́пруч. Ударение на первый слог." }
collocations:
  - { pl: "oprócz tego", ru: "кроме того" }
  - { pl: "oprócz ciebie", ru: "кроме тебя" }
  - { pl: "nikt oprócz", ru: "никто кроме" }
etymology: "Из o и procz «прочь, помимо», того же корня, что русское «прочий» и «кроме прочего». Русское «кроме» — другое слово, но значение то же."
memory: "oprócz — «кроме», с родительным падежом: oprócz ciebie. Oprócz tego значит «кроме того, вдобавок». Синонимы — poza и z wyjątkiem. ó звучит как «у»: о́пруч."
idioms:
