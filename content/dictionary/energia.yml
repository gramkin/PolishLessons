notes:
  - { kind: usage, text: "Женский род на -ia. Родительный, дательный и предложный совпадают и пишутся с двумя i: energii." }
  - { kind: false-friend, text: "Различайте два прилагательных: energetyczny «энергетический» — о ресурсе, а energiczny «энергичный» — о человеке." }
  - { kind: usage, text: "energia jądrowa и energia atomowa — оба значат «атомная энергия»; energia słoneczna «солнечная»." }
  - { kind: usage, text: "pełen energii «полон энергии» — родительный падеж после pełen, как и в русском." }
collocations:
  - { pl: "energia jądrowa", ru: "атомная энергия" }
  - { pl: "energia słoneczna", ru: "солнечная энергия" }
  - { pl: "pełen energii", ru: "полон энергии" }
  - { pl: "źródło energii", ru: "источник энергии" }
family:
  - { pl: "energetyczny", ru: "энергетический", relation: derived }
  - { pl: "energiczny", ru: "энергичный", relation: derived }
etymology: "Через немецкое Energie и французское énergie из греческого energeia «действие, деятельность». Русская «энергия» — то же заимствование."
memory: "energia — «энергия», женский род. Родительный пишется с двумя i: energii. И не путайте energetyczny «энергетический» (о ресурсе) с energiczny «энергичный» (о человеке)."
idioms:
  - { pl: "wulkan energii", ru: "фонтан энергии" }
  - { pl: "pełen energii", ru: "полон энергии" }
formExamplesSkip:
  - { form: "energij", reason: "устаревший вариант родительного падежа множественного числа; нормой является energii" }
  - { form: "energio", reason: "звательный падеж у этого слова в живой речи не употребляется" }
