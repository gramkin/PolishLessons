notes:
  - { kind: usage, text: "Самое полезное в этом глаголе — образец спряжения. Инфинитив на -OWAĆ, а личные формы на -UJ-: ZMARNOWAĆ, но ZMARNUJĘ, ZMARNUJESZ, ZMARNUJĄ. Русскому это знакомо до мелочей, потому что у нас ровно то же: «рисовать» и «рисую», «танцевать» и «танцую», «требовать» и «требую». Правило переносится целиком и сразу открывает сотни польских глаголов: PRACOWAĆ и PRACUJĘ, KUPOWAĆ и KUPUJĘ, DZIĘKOWAĆ и DZIĘKUJĘ. Пятьдесят три формы — обычная подпись переходного глагола совершенного вида." }
  - { kind: false-friend, text: "Созвучие с русским «замарать» обманчиво: ZMARNOWAĆ значит «потратить впустую, загубить», а не «запачкать». Испачкать по-польски — POBRUDZIĆ или ZABRUDZIĆ. Корень здесь другой: он сидит в прилагательном MARNY «жалкий, ничтожный» и в наречии MARNIE «плохо, скверно». Говорят MARNY WYNIK «жалкий результат», MARNIE TO WYGLĄDA «выглядит это неважно». Полезно знать и MARNOTRAWNY «расточительный»: SYN MARNOTRAWNY это евангельский «блудный сын», который по-польски назван именно расточителем." }
  - { kind: government, text: "Прямое дополнение в винительном: ZMARNOWAĆ CZAS, ZMARNOWAĆ PIENIĄDZE, ZMARNOWAĆ SZANSĘ. То, на что потрачено впустую, вводится предлогом NA с винительным, как и по-русски: ZMARNOWAĆ PÓŁ DNIA NA FORMALNOŚCI «потратить полдня на формальности». Возвратное ZMARNOWAĆ SIĘ означает «пропасть даром, загубить себя»: ZMARNOWAŁ SIĘ W TEJ FIRMIE «он загубил себя в этой фирме». Отдельно стоит оборот PÓJŚĆ NA MARNE «пойти прахом», где корень виден в чистом виде." }
  - { kind: pronunciation, text: "Читается «змарно́вачь», ударение на предпоследнем слоге. Начальное ZM звучит слитно и звонко, без гласной между согласными, что для русского уха требует привычки. В личных формах ударение переезжает вместе с основой: ZMARNUJĘ это «змарну́е», ZMARNUJESZ — «змарну́еш». Конечное Ć мягкое, «чь». В страдательном причастии ZMARNOWANY слышно «змарнова́ны»." }
  - { kind: register, text: "Слово нейтральное и очень ходовое, одинаково уместное в разговоре и в статье. Самые частые сочетания: ZMARNOWAĆ CZAS «потерять время», ZMARNOWAĆ OKAZJĘ «упустить случай», ZMARNOWAĆ ŻYCIE «загубить жизнь», ZMARNOWANA SZANSA «упущенный шанс». Про еду говорят ZMARNOWAĆ JEDZENIE «испортить, перевести продукты». Несовершенный партнёр MARNOWAĆ описывает процесс: MARNUJESZ CZAS «ты тратишь время зря», и это обычный упрёк." }
