etymology: "Приставка Z- плюс MARNOWAĆ, от прилагательного MARNY «тщетный, ничтожный», восходящего к праславянскому *marьnъ. Корень связан с *mara — «призрак, наваждение, нечто кажущееся»: то, что лишь мерещится, оказывается пустым, а оттуда уже недалеко до «напрасного» и «никчёмного». Русский сохранил сам корень в словах «марево» — мираж, дрожащий обман зрения, — и в областном «мара» со значением «призрак». Прилагательное же пошло у нас другим путём, и для «тщетного» мы говорим «напрасный». Польский, наоборот, сделал MARNY повседневным словом и построил на нём целое гнездо: MARNIE, MARNOTRAWNY, PÓJŚĆ NA MARNE."
memory: "Главное здесь — образец спряжения: инфинитив на -ować, а личные формы на -uj-, zmarnować но zmarnuję. Это ровно русское «рисовать» и «рисую», и правило открывает сразу pracować, kupować, dziękować. Значение — «потратить впустую, упустить», а не «замарать»: испачкать это pobrudzić. Корень виден в marny «жалкий» и в syn marnotrawny, где «блудный сын» назван расточителем."
idioms:
  - { pl: "pójść na marne", ru: "пойти прахом, пропасть даром" }
