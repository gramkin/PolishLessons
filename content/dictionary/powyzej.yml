id: powyzej
format: 2
lemma: "powyżej"
rank: 4895
pos: adv
pron: { cyr: "повы́жэй" }
senses:
  - id: above
    ru: "выше, свыше (чего-то)"
    examples:
      - pl: "Dzieci powyżej siedmiu lat płacą za bilet."
        ru: "Дети старше семи лет платят за билет."
        source: { kind: authored }
      - pl: "Mieszkamy powyżej poziomu morza."
        ru: "Мы живём выше уровня моря."
        source: { kind: authored }
      - pl: "Ceny są powyżej średniej."
        ru: "Цены выше среднего."
        source: { kind: authored }
  - id: above-in-text
    ru: "выше (в тексте)"
    examples:
      - pl: "Jak napisałem powyżej, termin mija w piątek."
        ru: "Как я написал выше, срок истекает в пятницу."
        source: { kind: authored }
      - pl: "Adres podano powyżej."
        ru: "Адрес указан выше."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "POWYŻEJ — просто «выше», хотя приставка PO- делает его похожим на русское «повыше». С возрастом переводится «старше»: POWYŻEJ 18 LAT, «старше восемнадцати». Противоположность — PONIŻEJ, «ниже»." }
  - { kind: usage, text: "Одна форма. Работает предлогом, POWYŻEJ ZERA, и наречием, ADRES PODANO POWYŻEJ. В деловых письмах: JAK POWYŻEJ, «как указано выше». Обычное сравнение «выше» — WYŻEJ: SKOCZ WYŻEJ." }
  - { kind: government, text: "Как предлог требует родительного падежа: POWYŻEJ KOLAN, POWYŻEJ NORMY, POWYŻEJ TRZYDZIESTU STOPNI. В русском «выше» в этом значении тоже требует родительного." }
  - { kind: pronunciation, text: "Читается «повы́жэй», ударение на предпоследнем слоге. Y — «ы», ŻE — твёрдое «жэ»." }
collocations:
  - { pl: "powyżej zera", ru: "выше нуля" }
  - { pl: "jak powyżej", ru: "как указано выше" }
  - { pl: "powyżej normy", ru: "выше нормы" }
family:
