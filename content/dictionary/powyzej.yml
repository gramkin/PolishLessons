  - { pl: "wyżej", ru: "выше", relation: root }
  - { pl: "wyżyna", ru: "возвышенность", relation: root }
etymology: "PO + WYŻEJ «выше», сравнительной степени от WYSOKO. Ż из S, как в русском «высокий — выше»: WYSOKI — WYŻSZY."
memory: "Powyżej — выше (чего): powyżej zera, powyżej 18 lat — старше 18. Читается «повы́жэй». Poniżej — ниже. Jak powyżej — как указано выше."
idioms:
