# review
id: ciezarowka
format: 2
lemma: "ciężarówka"
rank: 1410
pos: noun
pron: { cyr: "ценжару́фка" }
senses:
  - id: truck
    ru: "грузовик"
    examples:
      - pl: "Ale wielka ciężarówka!"
        ru: "Какой большой грузовик!"
        source: { kind: tatoeba, id: 2972814 }
      - pl: "Na środku drogi stoi ciężarówka."
        ru: "Посреди дороги стоит грузовик."
        source: { kind: tatoeba, id: 751840 }
      - pl: "O mało nie potrąciła mnie ciężarówka."
        ru: "Меня чуть не сбил грузовик."
        source: { kind: tatoeba, id: 1605863 }
  - id: driver
    ru: "kierowca ciężarówki — водитель грузовика"
    examples:
      - pl: "Jestem kierowcą ciężarówki."
        ru: "Я водитель грузовика."
        source: { kind: tatoeba, id: 8506818 }
      - pl: "Tom jest kierowcą ciężarówki."
        ru: "Том — водитель грузовика."
        source: { kind: translated, id: 4657075 }
      - pl: "Tom był kierowcą ciężarówek zanim został kierowcą wyścigowym."
        ru: "Том был водителем грузовиков, прежде чем стал гонщиком."
        source: { kind: translated, id: 6729282 }
  - id: by-truck
    ru: "ciężarówką — на грузовике (творительный)"
    examples:
      - pl: "Pojechał ciężarówką do Dallas."
        ru: "Он поехал на грузовике в Даллас."
        source: { kind: translated, id: 10479904 }
      - pl: "On jest w drugiej ciężarówce."
        ru: "Он в другом грузовике."
        source: { kind: tatoeba, id: 933154 }
      - pl: "Załaduję towar na ciężarówkę."
        ru: "Я загружу товар на грузовик."
        source: { kind: translated, id: 12720914 }
notes:
  - { kind: government, text: "jechać ciężarówką «ехать на грузовике» — творительный падеж без предлога, как и с autobusem." }
  - { kind: usage, text: "Kierowca ciężarówki — «водитель грузовика», родительный падеж." }
  - { kind: usage, text: "Слово прозрачно разбирается: ciężar «тяжесть, груз» плюс суффикс -ówka. Буквально «грузовая»." }
  - { kind: pronunciation, text: "ę звучит как «эн», ó как «у», а w перед k оглушается: ценжару́фка." }
collocations:
  - { pl: "kierowca ciężarówki", ru: "водитель грузовика" }
  - { pl: "jechać ciężarówką", ru: "ехать на грузовике" }
  - { pl: "załadować ciężarówkę", ru: "загрузить грузовик" }
etymology: "Из ciężar «тяжесть, груз» и суффикса -ówka: буквально «грузовая». Русский «грузовик» собран тем же способом, от «груза»."
memory: "ciężarówka — «грузовик», буквально «грузовая», от ciężar «груз». Ехать на нём — творительный без предлога: jechać ciężarówką. Водитель — kierowca ciężarówki."
idioms:
  - { pl: "kierowca ciężarówki", ru: "водитель грузовика" }
  - { pl: "jechać ciężarówką", ru: "ехать на грузовике" }
  - { pl: "załadować ciężarówkę", ru: "загрузить грузовик" }
formExamplesSkip:
  - { form: "ciężarówko", reason: "звательный падеж: для неодушевлённого существительного он практически не употребляется" }
