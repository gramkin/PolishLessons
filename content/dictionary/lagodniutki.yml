notes:
  - { kind: register, text: "Это не отдельное слово, а ласкательно-усилительная форма от ŁAGODNY «мягкий, кроткий». Суффикс -UTKI работает как русские «-еньк-» и «-ёхоньк-»: MALUTKI «маленький», CIENIUTKI «тоненький», KRÓCIUTKI «коротенький». Слово разговорное и тёплое: так говорят о детях, о домашних животных, о погоде. Часто с усмешкой: человек, который только что кричал, а теперь стал ŁAGODNIUTKI JAK BARANEK, «тише воды, ниже травы». В официальном тексте такое слово неуместно, там нужен ŁAGODNY." }
  - { kind: usage, text: "Степеней сравнения у таких форм нет: они уже сами по себе выражают высокую степень признака, поэтому таблица из одиннадцати форм. Склоняется как любое прилагательное на -KI: ŁAGODNIUTKI, ŁAGODNIUTKA, ŁAGODNIUTKIE, ŁAGODNIUTKIEGO. В мужско-личном множественном числе K переходит в C: ŁAGODNIUTCY, как WYSOCY от WYSOKI и MALUTCY от MALUTKI." }
  - { kind: pronunciation, text: "Читается «уагодню́тки», ударение на предпоследнем слоге. Начальная Ł звучит как русское краткое «у», не как «л», и это главная трудность для русского уха. Сочетание NI перед гласной даёт мягкое «нь»: NIU звучит как «ню». В форме ŁAGODNIUTCY сочетание TC читается почти как долгое «ц»: «уагодню́тцы»." }
