etymology: "Уменьшительно-усилительная форма от ŁAGODNY «мягкий, кроткий», образованная суффиксом -UTKI, как MALUTKI от MAŁY и CIENIUTKI от CIENKI. Такие формы польский язык образует от многих качественных прилагательных, особенно в разговорной и детской речи."
memory: "ŁAGODNY «кроткий» + -UTKI «-еньк-» = ŁAGODNIUTKI «кротенький, смирненький». Как MALUTKI «маленький». Главная фраза: ŁAGODNIUTKI JAK BARANEK «смирный, как ягнёнок»."
