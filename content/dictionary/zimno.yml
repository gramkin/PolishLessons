notes:
  - { kind: false-friend, text: "ZIMNO — и наречие «холодно» (JEST ZIMNO), и существительное «холод»: DRŻEĆ Z ZIMNA, «дрожать от холода». Мороз — MRÓZ, прохлада — CHŁÓD. Простуда — PRZEZIĘBIENIE, а не «холод»." }
  - { kind: usage, text: "Как существительное — средний род. Учим единственное: ZIMNO, ZIMNA, ZIMNU, ZIMNEM, ZIMNIE. Формы ZIMNA, ZIMNEM совпадают с формами прилагательного ZIMNY." }
  - { kind: government, text: "От холода — Z ZIMNA, родительный: TRZĄŚĆ SIĘ Z ZIMNA. На холоде — NA ZIMNIE, местный. Защищать от холода — CHRONIĆ PRZED ZIMNEM, творительный." }
  - { kind: pronunciation, text: "Читается «зи́мно», ударение на первом слоге. ZIMNIE — «зи́мне»." }
