# review
id: gonic
format: 2
lemma: "gonić"
rank: 2805
pos: verb
pron: { cyr: "го́ниць" }
senses:
  - id: chase
    ru: "гнать, гнаться за, преследовать"
    examples:
      - pl: "Pies goni kota po podwórku."
        ru: "Собака гонит кота по двору."
        source: { kind: authored }
      - pl: "Psy goniły zająca po polu."
        ru: "Собаки гнали зайца по полю."
        source: { kind: authored }
  - id: press
    ru: "поджимать, торопить (о времени, сроках)"
    examples:
      - pl: "Czas nas goni."
        ru: "Время нас поджимает."
        source: { kind: authored }
      - pl: "Gonimy terminy od tygodnia."
        ru: "Мы гонимся за сроками уже неделю."
        source: { kind: authored }
  - id: chase-after
    ru: "гоняться за (успехом, модой, деньгами)"
    examples:
      - pl: "Nie gonię za pieniędzmi."
        ru: "Я не гонюсь за деньгами."
        source: { kind: authored }
      - pl: "Goniąc za sukcesem, zapomniał o rodzinie."
        ru: "Гонясь за успехом, он забыл о семье."
        source: { kind: authored }
notes:
  - { kind: government, text: "gonić kogoś, coś — ВИНИТЕЛЬНЫЙ падеж без предлога: gonić kota, gonić autobus. В переносном значении появляется предлог: gonić za czymś «гнаться за чем-л.» (gonić za modą, za sławą). Дополнением свободно бывает человек, поэтому мужсколичное gonieni вполне обычно." }
  - { kind: usage, text: "Несовершенный вид; совершенные приставочные — dogonić «догнать», pogonić «погнать». Возвратное gonić się значит «гоняться друг за другом»: dzieci gonią się po trawniku." }
  - { kind: false-friend, text: "Корень тот же, что в русском «гнать» и «гонять», от праславянского *goniti. Значение почти совпадает, но в польском этот глагол гораздо чаще значит просто «бежать за чем-то»: gonię autobus — это «я бегу за автобусом», а не «я гоню автобус»." }
  - { kind: register, text: "Оборот gonić w piętkę (буквально «гнать в пятку») значит «нести чушь, выживать из ума» и звучит насмешливо. Понять его из составных частей нельзя — это чистая идиома." }
collocations:
  - { pl: "gonić autobus", ru: "бежать за автобусом" }
  - { pl: "gonić za modą", ru: "гнаться за модой" }
  - { pl: "czas goni", ru: "время поджимает" }
family:
  - { pl: "dogonić", ru: "догнать", relation: aspect }
  - { pl: "gonitwa", ru: "погоня, гонка", relation: derived }
  - { pl: "goniec", ru: "гонец, курьер", relation: derived }
etymology: "Праславянское *goniti, многократный глагол к *gъnati. Русские «гнать» и «гонять» — прямые родственники, и «погоня» отвечает польскому pogoń. Из того же гнезда goniec «гонец, курьер» и gonitwa «гонка, скачки»."
memory: "gonić — «гнать, гнаться», корень как в русском «гонять». Но в быту это чаще «бежать за чем-то»: gonię autobus «бегу за автобусом». За чем-то абстрактным — через za: gonić za modą."
idioms:
  - { pl: "gonić w piętkę", ru: "нести чушь, выживать из ума" }
  - { pl: "czas goni", ru: "время поджимает" }
