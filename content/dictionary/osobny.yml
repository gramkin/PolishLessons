notes:
  - { kind: false-friend, text: "Вот одна из самых обманчивых пар во всём словаре. OSOBNY значит «отдельный», а не «особый». Наше «особый» по-польски SZCZEGÓLNY или SPECJALNY. Рядом стоят ещё два слова той же родни: OSOBA это просто «человек, лицо», нейтрально, без нашего пренебрежительного оттенка в «особе», а OSOBISTY значит «личный». Три слова и три ловушки, и все три из одного корня." }
  - { kind: usage, text: "В таблице одиннадцать форм, но живых десять. Одиннадцатая — OSOBNI, именительный множественного для мужчин-людей, и её не употребляют: слово говорит о раздельности помещений, счетов и вопросов, а о людях так не скажешь. Там, где по-русски хочется сказать «отдельные люди», поляк перестроит фразу: OSOBNE OSOBY или KAŻDY Z OSOBNA. Примеров к этой форме в карточке поэтому нет." }
  - { kind: government, text: "Обратите внимание на порядок слов: это прилагательное качественное, и оно обычно стоит ПЕРЕД существительным — OSOBNY POKÓJ, OSOBNE WEJŚCIE, OSOBNA SPRAWA. Этим оно отличается от относительных вроде WÓZ BOJOWY или KONTO BANKOWE, где прилагательное идёт после. Запомните и наречный оборот Z OSOBNA — «по отдельности»: KAŻDY Z OSOBNA значит «каждый по отдельности»." }
  - { kind: pronunciation, text: "Читается «осо́бны», три слога, ударение на предпоследнем. Буква B перед N не оглушается, поэтому середина слова это «соб», а не «соп». Конечная Y даёт «ы», и слово кончается на «ны». В женском роде OSOBNA это «осо́бна», в среднем OSOBNE — «осо́бнэ», с «э» на конце, а OSOBNĄ звучит «осо́бнон»." }
  - { kind: register, text: "Слово нейтральное и очень частое, из обиходной речи и из объявлений. В объявлениях о жилье постоянно встречается OSOBNE WEJŚCIE «отдельный вход», в ресторане просят OSOBNY RACHUNEK «отдельный счёт». А оборот TO OSOBNA SPRAWA значит «это отдельный разговор» и употребляется, когда тему хотят отложить, ровно как и у нас." }
