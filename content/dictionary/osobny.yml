etymology: "От OSOBA, а то — от праславянского сочетания приставки O- с местоимением «себя»: буквально «тот, кто сам по себе». Из того же корня выросли и русские «особь», «особый», «обособленный». Вот где спрятана разгадка ловушки: слово в двух языках собрано одинаково, но смыслы разошлись. Поляк удержал первое значение, «сам по себе, отдельный», а русский сдвинулся к «не такой, как прочие», то есть к «особому»."
memory: "Значит «отдельный», а не «особый» — это главное. Наше «особый» по-польски szczegolny. Слово собрано как русское «особый», от «о» плюс «себя», то есть «сам по себе», но смыслы разошлись: поляк удержал раздельность, русский ушёл к необычности. Читается «осо́бны». Прилагательное качественное, поэтому стоит перед существительным: osobne wejscie, osobny rachunek. И запомните z osobna «по отдельности»."
idioms:
  - { pl: "to osobna sprawa", ru: "это отдельный разговор" }
formExamplesSkip:
