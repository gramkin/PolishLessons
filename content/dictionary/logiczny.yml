  - { pl: "logiczne wyjaśnienie", ru: "логичное объяснение" }
etymology: "Из греческого λόγος через латынь, как и русское «логичный»."
memory: "logiczny — «логичный». Оборот To logiczne «Это логично» стоит в среднем роде. Превосходная степень двоякая: najbardziej logiczny и najlogiczniejszy."
