        ru: "Поэзия не обязательно логична."
        source: { kind: translated, id: 4694970 }
  - id: reasonable
    ru: "последовательный, разумный"
    examples:
      - pl: "Esperanto jest najbardziej logicznym językiem świata."
        ru: "Эсперанто — самый логичный язык в мире."
