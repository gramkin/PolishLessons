notes:
  - { kind: government, text: "Обычное прилагательное; наречие — logicznie, отрицание пишется слитно: nielogiczny." }
  - { kind: false-friend, text: "Из греческого через латынь, как и русское «логичный». Значение совпадает полностью." }
  - { kind: usage, text: "To logiczne «Это логично» — безличный оборот со средним родом, очень частый в разговоре." }
  - { kind: usage, text: "Превосходная степень образуется двояко: najbardziej logiczny и najlogiczniejszy, оба встречаются." }
