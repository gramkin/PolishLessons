# review
id: logiczny
format: 2
lemma: "logiczny"
rank: 2373
pos: adj
pron: { cyr: "логи́чны" }
senses:
  - id: logical
    ru: "логичный, логический"
    examples:
      - pl: "To logiczne."
        ru: "Это логично."
        source: { kind: translated, id: 8543051 }
      - pl: "To nie jest logiczne."
        ru: "Это нелогично."
        source: { kind: translated, id: 10584490 }
