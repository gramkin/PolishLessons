etymology: "Приставка PRZE- «пере-» плюс KRACZAĆ, итератив от KROCZYĆ «шагать», от KROK «шаг»; буквально «перешагивать»."
memory: "Przekraczać — перешагивать: krok «шаг» через границу, через норму, через закон."
