notes:
  - { kind: usage, text: "Несовершенный вид; совершенный — PRZEKROCZYĆ. Одно слово покрывает три русских глагола: «пересекать» (PRZEKRACZAĆ GRANICĘ), «превышать» (PRZEKRACZAĆ PRĘDKOŚĆ) и «переступать, нарушать» (PRZEKRACZAĆ PRAWO, UPRAWNIENIA)." }
  - { kind: government, text: "Прямое дополнение в винительном: PRZEKRACZAĆ GRANICĘ, NORMĘ. После отрицания — родительный: NIE PRZEKRACZAJ PRĘDKOŚCI. Мужско-личное страдательное PRZEKRACZANI в карточку не включено: пересекают и превышают что-то, а не людей." }
  - { kind: false-friend, text: "Не «перекрашивать»: корень тот же, что в KROK «шаг» и KROCZYĆ «шагать». PRZEKRACZAĆ — буквально «перешагивать»; «перекрашивать» по-польски PRZEMALOWYWAĆ." }
  - { kind: pronunciation, text: "PRZE- читается «пшэ», CZ — «ч»: «пшэкра́чаць». Ударение на предпоследнем слоге: PRZEKRACZAM — «пшэкра́чам»." }
collocations:
