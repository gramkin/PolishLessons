notes:
  - { kind: usage, text: "Слово женского рода на мягкий согласный: kość, kości, kością. Родительный множественного тоже kości." }
  - { kind: usage, text: "Do szpiku kości — «до мозга костей», совпадает с русским дословно." }
  - { kind: usage, text: "Kości zostały rzucone — «жребий брошен», латинское alea iacta est. В этом значении kość значит «игральная кость»." }
  - { kind: usage, text: "Ещё одно современное значение — «микросхема, чип»: kość pamięci «микросхема памяти»." }
collocations:
  - { pl: "do szpiku kości", ru: "до мозга костей" }
  - { pl: "złamać kość", ru: "сломать кость" }
  - { pl: "kości zostały rzucone", ru: "жребий брошен" }
etymology: "Праславянское *kostь из праиндоевропейского *h₃ost- — то же слово, что русская «кость», латинское os и греческое osteon."
memory: "kość — «кость», женского рода на мягкий согласный: kość, kości, kością. Do szpiku kości значит «до мозга костей», а kości zostały rzucone — «жребий брошен». Современное значение — ещё и «чип»."
idioms:
  - { pl: "do szpiku kości", ru: "до мозга костей" }
  - { pl: "kości zostały rzucone", ru: "жребий брошен" }
  - { pl: "kość niezgody", ru: "яблоко раздора" }
