notes:
  - { kind: false-friend, text: "Прилагательное отвечает русскому «боевой», и корень тот же: BÓJ это наш «бой», и оба слова идут от глагола «бить», BIĆ. Разница в употреблении существительного. По-польски сражение обычно BITWA, а BÓJ — слово книжное и слегка торжественное. И запомните BOJÓWKA: это не «боёвка» в нашем смысле, а вооружённая группа, дружина при партии, слово из истории и из газет." }
  - { kind: usage, text: "В таблице одиннадцать форм, но живых десять. Одиннадцатая — BOJOWI, именительный множественного для мужчин-людей, и её не употребляют: прилагательное относительное, оно описывает машину, задание или настрой, а не человека. Бойцов называют BOJOWNICY или TOWARZYSZE BRONI, существительными. Примеров к этой форме в карточке поэтому нет." }
  - { kind: government, text: "В боевой готовности — W GOTOWOŚCI BOJOWEJ, местный падеж. Привести в боевую готовность — POSTAWIĆ W STAN GOTOWOŚCI BOJOWEJ, где STAN стоит в винительном, а GOTOWOŚCI BOJOWEJ — в родительном. Выполнить боевое задание — WYKONAĆ ZADANIE BOJOWE, винительный без предлога. Прилагательное стоит после существительного: WÓZ BOJOWY, ZADANIE BOJOWE." }
  - { kind: pronunciation, text: "Читается «бойо́вы», три слога, ударение на предпоследнем. Буква J даёт «й», и середина слова это «йо», то есть BO-JO-WY звучит «бо-йо-вы». Конечная Y даёт «ы». В женском роде BOJOWA это «бойо́ва», в среднем BOJOWE — «бойо́вэ», а BOJOWĄ звучит «бойо́вон», с носовым на конце." }
  - { kind: register, text: "Слово военное и газетное. В армии это WÓZ BOJOWY «боевая машина», ZADANIE BOJOWE, GOTOWOŚĆ BOJOWA, AMUNICJA BOJOWA «боевые патроны» в противоположность учебным. В переносном смысле слово живое и вполне мирное: NASTRÓJ BOJOWY значит «боевой настрой», а BYĆ W BOJOWYM NASTROJU можно сказать и про человека перед экзаменом." }
