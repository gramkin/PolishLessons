etymology: "От BÓJ «бой», а то — от глагола BIĆ «бить», в точности как русский «бой» от «бить». Постройка одна и та же в обоих языках, и узнать слово легко. Обратите внимание на чередование в корне: BÓJ с Ó, но BOJOWY и BOJU с простым O, потому что Ó в польском стоит обычно в последнем слоге и уходит, когда слог перестаёт быть последним. То же видно в MIÓD и MIODOWY."
memory: "Боевой, от boj «бой», а тот — от bic «бить», как и у нас. Читается «бойо́вы», где j даёт «й». Запомните чередование: boj с o под черточкой, но bojowy и boju с простым o, ровно как miod и miodowy. В гнезде два слова не для догадки: bitwa это обычное название сражения, а boj книжное, и bojowka — вооружённая дружина при партии."
idioms:
