# review
id: ulubiony
format: 2
lemma: "ulubiony"
rank: 983
pos: adj
pron: { cyr: "улюбё́ны" }
senses:
  - id: favourite
    ru: "любимый, излюбленный"
    examples:
      - pl: "Zielony to mój ulubiony kolor."
        ru: "Зелёный — мой любимый цвет."
        source: { kind: translated, id: 1111422 }
      - pl: "To moja ulubiona piosenka."
        ru: "Это моя любимая песня."
        source: { kind: translated, id: 353976 }
      - pl: "To moje ulubione krzesło."
        ru: "Это мой любимый стул."
        source: { kind: translated, id: 558273 }
  - id: question
    ru: "Jaki jest twój ulubiony…? — Какой твой любимый…?"
    examples:
      - pl: "Jaki jest twój ulubiony deser?"
        ru: "Какой твой любимый десерт?"
        source: { kind: translated, id: 4090939 }
      - pl: "Jaki jest twój ulubiony napój?"
        ru: "Какой твой любимый напиток?"
        source: { kind: translated, id: 4091082 }
      - pl: "Kto jest twoim ulubionym graczem?"
        ru: "Кто твой любимый игрок?"
        source: { kind: translated, id: 4963064 }
  - id: one-of
    ru: "jeden z moich ulubionych — один из моих любимых"
    examples:
      - pl: "To jedna z moich ulubionych książek."
        ru: "Это одна из моих любимых книг."
        source: { kind: translated, id: 2774734 }
      - pl: "Stephen King to jeden z moich ulubionych pisarzy."
        ru: "Стивен Кинг — один из моих любимых писателей."
        source: { kind: translated, id: 13426903 }
      - pl: "Krewetki to jedna z moich ulubionych potraw."
        ru: "Креветки — одно из моих любимых блюд."
        source: { kind: translated, id: 997707 }
notes:
  - { kind: false-friend, text: "ulubiony значит «любимый» только о вещах и занятиях: ulubiony kolor, ulubiona piosenka. О человеке, которого любят, говорят kochany или ukochany — сказать ulubiona żona нельзя." }
  - { kind: usage, text: "Самый частый оборот — вопрос Jaki jest twój ulubiony…? «Какой твой любимый…?». Ответ строят через to: Mój ulubiony kolor to czerwony." }
  - { kind: usage, text: "jeden z moich ulubionych «один из моих любимых» — с родительным падежом множественного числа." }
  - { kind: usage, text: "Степени сравнения слово не образует: любимое не бывает «более любимым». Формы вроде ulubieńszy в живой речи не встречаются." }
collocations:
  - { pl: "ulubiony kolor", ru: "любимый цвет" }
  - { pl: "ulubiona piosenka", ru: "любимая песня" }
  - { pl: "ulubione danie", ru: "любимое блюдо" }
  - { pl: "jeden z ulubionych", ru: "один из любимых" }
family:
  - { pl: "lubić", ru: "любить, нравиться", relation: root }
  - { pl: "ulubieniec", ru: "любимчик", relation: derived }
etymology: "От lubić «любить, нравиться» с приставкой u-. Русское «любимый» идёт от того же праславянского корня *ljub-, так что слова родня."
memory: "ulubiony — «любимый», но только о вещах: ulubiony kolor, ulubiona piosenka. О человеке так не говорят — там kochany. Главный оборот: Jaki jest twój ulubiony…?"
