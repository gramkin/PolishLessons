# review
id: ubranie
format: 2
lemma: "ubranie"
rank: 1783
pos: noun
pron: { cyr: "убра́не" }
senses:
  - id: clothes
    ru: "одежда"
    examples:
      - pl: "Moje ubranie jest szare."
        ru: "Моя одежда серая."
        source: { kind: tatoeba, id: 831850 }
      - pl: "Zmień ubranie."
        ru: "Смени одежду."
        source: { kind: translated, id: 8621018 }
      - pl: "Ona zawsze kupuje drogie ubrania."
        ru: "Она всегда покупает дорогую одежду."
        source: { kind: tatoeba, id: 2983812 }
  - id: clothes-plural
    ru: "одежда, вещи (во множественном)"
    examples:
      - pl: "Wydaję na ubrania mniej niż moja siostra."
        ru: "Я трачу меньше денег на одежду, чем моя сестра."
        source: { kind: tatoeba, id: 363548 }
      - pl: "Chłopcy zrzucili ubrania i pobiegli do rzeki."
        ru: "Мальчики скинули одежду и побежали к реке."
        source: { kind: tatoeba, id: 2493572 }
      - pl: "Mam dużo ubrań."
        ru: "У меня много одежды."
        source: { kind: translated, id: 6670168 }
notes:
  - { kind: usage, text: "Единственное ubranie значит «одежда» вообще или один костюм; множественное ubrania — «вещи, предметы одежды». Русское «одежда» множественного не имеет." }
  - { kind: government, text: "В одежде — w ubraniu (предложный падеж): wskoczył do wody w ubraniu «он прыгнул в воду одетым»." }
  - { kind: usage, text: "Слово образовано от глагола ubrać «одеть» — буквально «то, во что одеваются», и заодно значит само действие одевания: pomogła córce w ubraniu się." }
  - { kind: false-friend, text: "Костюм-тройка по-польски тоже ubranie или garnitur; а «убранство» по-русски — это совсем другое, wystrój." }
collocations:
  - { pl: "zmienić ubranie", ru: "сменить одежду" }
  - { pl: "w ubraniu", ru: "в одежде" }
  - { pl: "dużo ubrań", ru: "много одежды" }
family:
  - { pl: "ubrać", ru: "одеть", relation: root, id: ubrac }
  - { pl: "ubierać się", ru: "одеваться", relation: root }
  - { pl: "koszula", ru: "рубашка", relation: root, id: koszula }
etymology: "Отглагольное существительное от ubrać «одеть» — буквально «то, во что одеваются». Русское «одежда» построено от «одеть» точно так же."
memory: "ubranie — «одежда». Во множественном ubrania значит «вещи, предметы одежды»: mam dużo ubrań «у меня много одежды». В одежде — w ubraniu."
idioms:
  - { pl: "zmienić ubranie", ru: "сменить одежду" }
  - { pl: "w ubraniu", ru: "в одежде" }
  - { pl: "dużo ubrań", ru: "много одежды" }
