# review
id: odnalezc
format: 2
lemma: "odnaleźć"
rank: 867
pos: verb
aspect: perf
pron: { cyr: "одна́лесьць" }
senses:
  - id: find
    ru: "отыскать, найти (пропавшее)"
    examples:
      - pl: "Muszę ją odnaleźć."
        ru: "Я должен её найти."
        source: { kind: translated, id: 1673891 }
      - pl: "Odnalazł swoich rodziców."
        ru: "Он отыскал своих родителей."
        source: { kind: translated, id: 527062 }
      - pl: "W końcu odnalazł swego zaginionego brata."
        ru: "В конце концов он нашёл своего пропавшего брата."
        source: { kind: translated, id: 535454 }
  - id: be-found
    ru: "odnaleźć się — найтись"
    examples:
      - pl: "Zaginione dziecko odnalazło się po dwóch dniach."
        ru: "Пропавший ребёнок нашёлся через два дня."
        source: { kind: translated, id: 361748 }
      - pl: "Wciąż nie porzucała nadziei, że jej pies odnajdzie się żywy."
        ru: "Она всё ещё не теряла надежды, что её пёс найдётся живым."
        source: { kind: translated, id: 403154 }
      - pl: "Kiedy odnalazłem swoją tożsamość, życie nabrało sensu."
        ru: "Когда я обрёл своё истинное «я», жизнь наполнилась смыслом."
        source: { kind: translated, id: 830443 }
  - id: finding
    ru: "odnalezienie — нахождение, обнаружение"
    examples:
      - pl: "Wielka Niedźwiedzica jest łatwa do odnalezienia."
        ru: "Большую Медведицу легко найти."
        source: { kind: translated, id: 1618169 }
      - pl: "Przeszukaliśmy las w celu odnalezienia zaginionego dziecka."
        ru: "Мы обыскали лес в поисках пропавшего ребёнка."
        source: { kind: translated, id: 12470392 }
      - pl: "Pieniędzy nigdy nie odnaleziono."
        ru: "Деньги так и не нашли."
        source: { kind: translated, id: 13684061 }
notes:
  - { kind: usage, text: "Простое «найти» — znaleźć; odnaleźć значит «отыскать то, что пропало или потерялось»: odnalazł zaginionego brata." }
  - { kind: usage, text: "Основа меняется трижды: инфинитив odnaleźć, будущее odnajdę, odnajdzie, прошедшее odnalazł, причастие odnaleziony. Эти четыре вида корня надо запомнить вместе." }
  - { kind: usage, text: "Возвратное odnaleźć się значит «найтись»: Dziecko się odnalazło. В переносном смысле — «найти себя»: odnalazł się w nowej pracy «нашёл себя на новой работе»." }
  - { kind: usage, text: "Несовершенный вид — odnajdywać. Отглагольное существительное odnalezienie значит «нахождение»: w celu odnalezienia «с целью найти»." }
collocations:
  - { pl: "odnaleźć się", ru: "найтись; освоиться (на новом месте)" }
  - { pl: "odnaleźć drogę", ru: "найти дорогу" }
  - { pl: "odnalezienie zaginionego", ru: "нахождение пропавшего" }
  - { pl: "nigdy nie odnaleziono", ru: "так и не нашли" }
family:
  - { pl: "znaleźć", ru: "найти", relation: root }
  - { pl: "odnajdywać", ru: "отыскивать", relation: aspect }
  - { pl: "odnalezienie", ru: "нахождение", relation: derived }
etymology: "Приставка od- + naleźć, старое «найти» (ср. znaleźć). Русское «найти» и «обрести» передают оба оттенка: отыскать пропавшее и обрести своё."
memory: "odnaleźć — «отыскать» именно то, что пропало; просто «найти» будет znaleźć. Запомните четыре вида основы: odnaleźć, odnajdę, odnalazł, odnaleziony. А odnaleźć się — это «найтись» и «найти себя»."
idioms:
  - { pl: "odnaleźć się", ru: "найтись; освоиться (на новом месте)" }
  - { pl: "nigdy nie odnaleziono", ru: "так и не нашли" }
  - { pl: "odnaleźć się w nowej pracy", ru: "найти себя на новой работе" }
formExamplesSkip:
  - { form: "odnaleź", reason: "нестандартный вариант повелительного наклонения: в современном языке говорят odnajdź" }
  - { form: "odnaleźcie", reason: "нестандартный вариант повелительного наклонения: в современном языке говорят odnajdźcie" }
  - { form: "odnaleźmy", reason: "нестандартный вариант повелительного наклонения: в современном языке говорят odnajdźmy" }
