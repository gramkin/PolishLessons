notes:
  - { kind: pronunciation, text: "Дательный и предложный — ATMOSFERZE, с переходом r в rz. К этому месту правило уже можно считать твёрдым: teatr — w teatrze, nora — w norze, wzór — we wzorze, atmosfera — w atmosferze. Любая основа на r перед окончанием -e отдаёт это r в rz, независимо от рода и от того, своё слово или заимствованное." }
  - { kind: usage, text: "Родительный множественного — ATMOSFER, без окончания, как strzała — strzał. Множественное число тут не пустая форма: atmosfery — это и атмосферы разных планет, и единицы давления, ciśnienie pięciu atmosfer. Переносное значение совпадает с русским полностью: atmosfera w zespole, napięta atmosfera, rozładować atmosferę." }
collocations:
  - { pl: "miła atmosfera", ru: "приятная атмосфера" }
  - { pl: "napięta atmosfera", ru: "напряжённая атмосфера" }
  - { pl: "atmosfera ziemska", ru: "земная атмосфера" }
family:
  - { pl: "atmosferyczny", ru: "атмосферный", relation: derived }
  - { pl: "sfera", ru: "сфера", relation: root }
  - { pl: "stratosfera", ru: "стратосфера", relation: root }
etymology: "Из греческих atmós «пар, испарение» и sphaira «шар»: буквально «шар из пара». Слово научное, собрано в Новое время и разошлось по языкам одинаково, поэтому русская «атмосфера» и польская atmosfera совпадают и по смыслу, и по роду. Второй корень виден в sfera и stratosfera, первый — в редком atmosferyczny."
memory: "Предложный с rz: w atmosferze, как w teatrze и w norze. Родительный множественного без окончания: pięć atmosfer."
idioms:
  - { pl: "rozładować atmosferę", ru: "разрядить атмосферу" }
  - { pl: "atmosfera nie do zniesienia", ru: "невыносимая атмосфера" }
