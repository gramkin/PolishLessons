etymology: "От mały, из праславянского *malъ — того же слова, что русское «малый», родственного латинскому malus в старом значении «недостаточный». Суффикс -utki образует ласкательные прилагательные и восходит к той же основе, что -utki в cichutki и bielutki. Отсюда malutki, maleńki, malusieńki."
memory: "malutki — «крошечный», от mały «маленький». Суффикс -utki работает как русское -енький и вполне продуктивен: cichutki «тихонький», króciutki «коротенький», bielutki «беленький». Степеней сравнения нет."
