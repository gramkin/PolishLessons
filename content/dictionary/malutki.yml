notes:
  - { kind: usage, text: "СУФФИКС -UTKI ДЕЛАЕТ ИЗ ПРИЛАГАТЕЛЬНОГО УМЕНЬШИТЕЛЬНОЕ — И ОН ПРОДУКТИВЕН. Mały даёт malutki, cichy — cichutki «тихонький», krótki — króciutki «коротенький», słodki — słodziutki «сладенький», biały — bielutki «беленький». Русский делает то же суффиксом -енький, но польский идёт дальше: maleńki, malusieńki, maciupeńki — ступеней умилённости тут больше, чем в русском." }
  - { kind: false-friend, text: "Прозрачно для русского уха: mały это «малый», malutki — «малюсенький». Ловушки нет, но стоит помнить, что mały в польском — обычное слово для «маленький», тогда как русское «малый» звучит книжно или значит «парень». Повседневное русское «маленький» отвечает именно польскому mały." }
  - { kind: register, text: "Степеней сравнения нет: слово само по себе уже уменьшительное, сравнивать его не с чем. Отсюда одиннадцать форм. Регистр тёплый, разговорный; в обращении к ребёнку или о ребёнке звучит ласково, в описании предмета — просто «очень маленький»." }
  - { kind: pronunciation, text: "Три слога, ударение на предпоследнем: ma-LUT-ki. Ki на конце мягкое: «малу́тки». Мужско-личное множественное меняет k на c: malutcy — «малу́тцы»." }
collocations:
