etymology: "От прилагательного GODNY «достойный», а оно — от праславянского корня *god- «подходящее время, то, что годится». Корень этот русскому знаком насквозь: «годный», «годиться», «угодить», «выгода» и само слово «год» того же гнезда — год был сначала подходящим сроком, а потом мерой времени. Разошлись языки на значении: русский удержал корень при идее пригодности, а польский развил его в сторону достоинства — достойным стал тот, кто годится, кто подходит по качествам. Суффикс -OŚĆ отвечает русскому -ОСТЬ буква в букву, поэтому слово читается как «годность» и тем сильнее обманывает. Та же пара суффиксов связывает WOLNOŚĆ и «вольность», MIŁOŚĆ и «милость», и в каждом случае проверять значение нужно отдельно."
memory: "Форма та же, что у русской «годности», корень тот же (*god-, как в «годиться, выгода, год»), а значение другое: достоинство человека. Пригодность по-польски przydatność, срок годности — termin przydatności. И третье значение на месте: в окошке учреждения pańska godność значит «ваша фамилия». Склонение самое экономное: шесть форм, из них godności делает сразу четыре падежа. Конец -ść читается «сьць», двумя мягкими звуками."
