notes:
  - { kind: false-friend, text: "Русское «годность» и польское GODNOŚĆ построены из одного корня одинаковым способом, а значат разное, и это редкий случай полного расхождения при полном сходстве формы. Русская «годность» — пригодность, срок службы: «срок годности». Польская GODNOŚĆ — достоинство человека, то, что нельзя отнять. Русскому понятию отвечает польское PRZYDATNOŚĆ, а «срок годности» на упаковке называется TERMIN PRZYDATNOŚCI DO SPOŻYCIA. Обратно: польское GODNOŚĆ по-русски всегда «достоинство». Есть и третье значение, неожиданное для приезжего: в учреждении вопрос о GODNOŚĆ означает вопрос о фамилии, вежливый и слегка старомодный." }
  - { kind: usage, text: "Шесть форм — весь набор для слов на -OŚĆ, и это самый экономный тип польского склонения. Форма GODNOŚCI одна покрывает родительный, дательный и местный единственного, а заодно родительный множественного и звательный: BEZ GODNOŚCI, W GODNOŚCI, PEŁEN GODNOŚCI. Форма GODNOŚĆ служит и именительным, и винительным, причём и в единственном, и во множественном числе. Отдельные окончания есть только у творительного единственного GODNOŚCIĄ и у трёх форм множественного: GODNOŚCIOM, GODNOŚCIAMI, GODNOŚCIACH. Множественное употребляется почти только во втором значении, о санах." }
  - { kind: pronunciation, text: "Читается «го́дносьць», два слога, ударение на первом. Главное — конечное -ŚĆ: это два мягких звука подряд, «сь» и «ць», и по-русски такого сочетания нет. Приблизительно оно звучит как в слове «гвоздь», если произнести конец особенно мягко. В форме GODNOŚCI сочетание ŚCI даёт «сьци»: «годно́сьци». В форме GODNOŚCIĄ последнее Ą звучит «он»: «годно́сьцён». Ударение во всех формах остаётся предпоследним и потому переезжает вправо вместе с окончанием." }
  - { kind: register, text: "В первом значении слово высокое, но вполне обиходное: о нём говорят в законах, в проповедях и в обычном разговоре о самоуважении. Устойчивые обороты: GODNOŚĆ OSOBISTA «личное достоинство», POCZUCIE GODNOŚCI «чувство собственного достоинства», Z GODNOŚCIĄ «с достоинством», URAZIĆ CZYJĄŚ GODNOŚĆ «задеть чьё-то достоинство». Второе значение, о санах, книжное и историческое. Третье, о фамилии, живёт в формуле PAŃSKA GODNOŚĆ и звучит учтиво и старомодно; в обычной речи спрашивают просто NAZWISKO." }
