notes:
  - { kind: false-friend, text: "ZAPROJEKTOWAĆ — «спроектировать», и русскому слову оно соответствует почти точно. Но польское шире: о дизайне одежды, логотипа, мебели тоже ZAPROJEKTOWAĆ, где по-русски «придумать дизайн, разработать». Русское «проект» в значении «план, замысел» — PROJEKT, а «прожектёр» — FANTASTA, не PROJEKTANT. PROJEKTANT — «дизайнер, проектировщик»." }
  - { kind: usage, text: "Пятьдесят три формы — подпись переходного глагола совершенного вида: страдательное ZAPROJEKTOWANY и деепричастие ZAPROJEKTOWAWSZY. Спряжение на -UJĘ: ZAPROJEKTUJĘ, ZAPROJEKTUJESZ, ZAPROJEKTUJĄ. Видовой партнёр — PROJEKTOWAĆ: ON PROJEKTUJE MOSTY." }
  - { kind: government, text: "Что — винительный: ZAPROJEKTOWAĆ DOM, OGRÓD, KOLEKCJĘ. Для кого — DLA с родительным: ZAPROJEKTOWAĆ DLA KLIENTA. Пассив с przez: ZAPROJEKTOWANY PRZEZ ARCHITEKTA. С отрицанием — родительный: NIKT NIE ZAPROJEKTOWAŁ TAKIEGO MOSTU." }
  - { kind: pronunciation, text: "Читается «запроекто́ваць», пять слогов, ударение на предпоследнем. J после O — «е» без отдельного «й»: «проек». W перед A — «в». Будущее ZAPROJEKTUJĘ — «запроекту́е»." }
  - { kind: register, text: "Нейтральное профессиональное слово архитекторов, инженеров, дизайнеров, программистов. В быту о своих планах проще ZAPLANOWAĆ: ZAPLANOWAŁEM WAKACJE, не ZAPROJEKTOWAŁEM." }
collocations:
  - { pl: "zaprojektować dom", ru: "спроектировать дом" }
  - { pl: "zaprojektować kolekcję", ru: "разработать коллекцию" }
  - { pl: "zaprojektowany przez architekta", ru: "спроектированный архитектором" }
family:
  - { pl: "projektowac", ru: "проектировать", relation: aspect }
  - { pl: "projekt", ru: "проект", relation: root, id: projekt }
  - { pl: "projektant", ru: "дизайнер, проектировщик", relation: derived }
etymology: "Приставка ZA- плюс PROJEKTOWAĆ, от PROJEKT, из латинского PROIECTUM «выброшенное вперёд», от PROICERE «бросать вперёд». То же слово, что русское «проект», «проектировать»."
memory: "Zaprojektować — спроектировать, придумать дизайн: zaprojektować dom, suknię, logo. Projektant — дизайнер. Свои планы — zaplanować. Читается «запроекто́ваць»."
idioms:
