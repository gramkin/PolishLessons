notes:
  - { kind: false-friend, text: "Самое важное на карточке: ни одна форма этого слова не принадлежит ему одному. WOLE — это средний род и значит «зоб», но та же буква в букву форма есть у WOLA «воля» в именительном множественного, у WÓŁ «вол» в предложном и звательном, и у прилагательного WOLI «воловий». Форма WOLA — это и родительный падеж от WOLE, и именительный от WOLA «воля». Форма WOLI — родительный множественного от WOLE, но ещё и третье лицо от глагола WOLEĆ «предпочитать», и падежи от WOLA. Поэтому русский, увидев WOLE, почти наверняка прочтёт «воля», а это неверно: «воля» по-польски WOLA, а «зоб» — WOLE." }
  - { kind: usage, text: "Различить эти слова можно только по согласованию и по смыслу фразы, никогда по самой форме. Средний род выдают прилагательные и глаголы: WOLE BYŁO WIDOCZNE — средний род, значит «зоб»; WOLA BYŁY SILNE — множественное число женского рода, значит «воли». Если рядом стоит медицинское слово, TARCZYCA, JOD, OPERACJA, речь о зобе. Если рядом ptak, gołąb, ziarno — о птичьем зобе. Если же фраза о решимости и желании, это уже другое слово, WOLA." }
  - { kind: pronunciation, text: "Читается «во́ле», в два слога, с ударением на первом. Конечное e даёт «э» в большинстве позиций, но здесь, в окончании среднего рода, принято передавать его как «е»: «во́ле». Предложный падеж — W WOLU, «в во́лу». Никаких трудных сочетаний в слове нет, и это как раз осложняет дело: трудность у него не в звуках, а в том, что оно звучит в точности как форма трёх других слов." }
  - { kind: government, text: "Существительное среднего рода, своего управления не имеет и ведёт себя как POLE или MORZE. Где — предлог W с предложным: W WOLU. У кого — предлог U с родительным: U PTAKÓW, U PACJENTA. В медицинских текстах обычны определения: WOLE GUZKOWE «узловой зоб», WOLE ENDEMICZNE «эндемический зоб», WOLE TARCZYCOWE. Родительный множественного — WOLI, и именно эта форма чаще всего путается с глаголом WOLEĆ." }
etymology: "Происхождение слова не вполне ясно, и выдумывать здесь нечего. Его связывают с праславянским корнем со значением вздутия или наполненности — зоб и есть вздутие на шее, а у птицы ещё и мешок, который наполняется, — но надёжной цепочки нет. Что можно сказать твёрдо, так это отрицательное: совпадение с WOLA «воля» и с WÓŁ «вол» случайно, этимологического родства между ними нет. Одинаковый вид форм — результат того, что разные корни попали в одни и те же окончания, а не следствие общего происхождения."
memory: "Средний род, значит «зоб», а не «воля»: «воля» — это WOLA. Все восемь форм совпадают с формами других слов: wola, woli, wole, wolach, wolami, wolom есть у WOLA «воля», WÓŁ «вол», прилагательного WOLI и глагола WOLEĆ. Различать только по согласованию и смыслу."
