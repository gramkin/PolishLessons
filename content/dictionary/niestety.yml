notes:
  - { kind: usage, text: "niestety — вводное слово, всегда отделяется запятой в середине фразы, но в начале запятая необязательна: Niestety, nie mogę «К сожалению, не могу» и Niestety nie zdążyłem «К сожалению, я не успел»." }
  - { kind: usage, text: "Может быть самостоятельной репликой: — Przyjdziesz? — Niestety. «— Придёшь? — Увы.»" }
  - { kind: usage, text: "Противоположность — na szczęście «к счастью». Пара встречается и в одной фразе: Niestety, a może na szczęście, nie." }
  - { kind: usage, text: "Слово прозрачно разбирается: nie + stety, где stety — застывшая форма старого stety «к счастью», сегодня отдельно не употребляющаяся." }
collocations:
