etymology: "Сращение nie + stety, где stety — старое наречие «к счастью», сегодня самостоятельно не употребляющееся. Буквально «не к счастью», ровно как русское «к сожалению» строится от «жаль»."
memory: "niestety — «к сожалению, увы». Вводное слово: Niestety, nie mogę ci pomóc. Может стоять и одно, как реплика: — Przyjdziesz? — Niestety. Разбирается оно прозрачно: nie + stety, то есть «не к счастью»; само stety в живом языке не осталось, а его место занял оборот na szczęście «к счастью» — прямая противоположность niestety."
