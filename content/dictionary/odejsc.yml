# review
id: odejsc
format: 2
lemma: "odejść"
rank: 302
pos: verb
aspect: perf
pron: { cyr: "оде́йщць" }
senses:
  - id: leave
    ru: "уйти, отойти"
    note: "В прошедшем времени основа меняется: odszedłem, odeszłam, odeszli."
    examples:
      - pl: "Odszedłem na chwilę."
        ru: "Я отошёл ненадолго."
        source: { kind: tatoeba, id: 3476651 }
      - pl: "Odszedłem na pięć minut."
        ru: "Я отошёл на пять минут."
        source: { kind: tatoeba, id: 3476654 }
      - pl: "Po prostu pozwól Tomowi odejść."
        ru: "Просто разреши Тому уйти."
        source: { kind: tatoeba, id: 8763037 }
  - id: depart
    ru: "уйти насовсем, покинуть"
    examples:
      - pl: "On powiedział nam, że powinniśmy odejść natychmiast."
        ru: "Он сказал, что нам следует уйти немедленно."
        source: { kind: tatoeba, id: 3656737 }
      - pl: "Odszedł z pracy w zeszłym roku."
        ru: "Он ушёл с работы в прошлом году."
        source: { kind: authored }
      - pl: "Proszę, nie odejdź teraz."
        ru: "Пожалуйста, не уходи сейчас."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Прошедшее время надо выучить целиком: odszedłem «я ушёл», odeszłam «я ушла», odszedł «он ушёл», odeszła «она ушла», odeszli «они ушли». Основа odejś- превращается в odszed-/odesz-." }
  - { kind: usage, text: "Несовершенный вид — odchodzić: Odchodzę «Я ухожу»." }
  - { kind: usage, text: "odejść od czegoś — «отойти от чего-то»; odejść z pracy — «уйти с работы»." }
  - { kind: register, text: "В мягкой речи odejść значит «скончаться»: Odeszła w nocy «Она скончалась ночью»." }
collocations:
  - { pl: "odejść z pracy", ru: "уйти с работы" }
  - { pl: "odejdź!", ru: "уйди!" }
  - { pl: "odejść na chwilę", ru: "отойти на минуту" }
  - { pl: "czas odejść", ru: "пора уходить" }
etymology: "Из od- + iść «идти»; ср. русское «отойти». В прошедшем времени всплывает старый корень: odszedł — как русское «шёл»."
memory: "odejść — «уйти», и прошедшее надо выучить целиком: odszedłem «я ушёл», odeszłam «я ушла», odeszli «они ушли». Основа меняется так же, как у wejść."
idioms:
  - { pl: "odejść z kwitkiem", ru: "уйти ни с чем" }
  - { pl: "odejść z pracy", ru: "уйти с работы" }
  - { pl: "czas odejść", ru: "пора уходить" }
