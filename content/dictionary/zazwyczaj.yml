# review
id: zazwyczaj
format: 2
lemma: "zazwyczaj"
rank: 1479
pos: adv
pron: { cyr: "зазвы́чай" }
senses:
  - id: usually
    ru: "обычно, как правило"
    examples:
      - pl: "Zazwyczaj to dobry znak."
        ru: "Обычно это хороший знак."
        source: { kind: tatoeba, id: 4716912 }
      - pl: "Zazwyczaj idę do domu o czwartej."
        ru: "Обычно я иду домой в четыре."
        source: { kind: tatoeba, id: 531872 }
      - pl: "Wilki zazwyczaj nie atakują ludzi."
        ru: "Обычно волки не нападают на людей."
        source: { kind: tatoeba, id: 1987751 }
  - id: than-usual
    ru: "в сравнениях — чем обычно"
    examples:
      - pl: "Dziś jest trochę cieplej niż zazwyczaj."
        ru: "Сегодня немного теплее обычного."
        source: { kind: tatoeba, id: 4940276 }
      - pl: "Jakiej wyszukiwarki używasz zazwyczaj?"
        ru: "Каким поисковиком ты обычно пользуешься?"
        source: { kind: tatoeba, id: 6134532 }
notes:
  - { kind: usage, text: "Синоним zwykle «обычно», который уже есть карточкой. Zazwyczaj чуть книжнее и длиннее, но употребляются они одинаково." }
  - { kind: usage, text: "niż zazwyczaj — «чем обычно»: Dziś jest trochę cieplej niż zazwyczaj." }
  - { kind: usage, text: "Разбирается прозрачно: za плюс zwyczaj «обычай», буквально «по обычаю». Русское «обычно» собрано так же." }
  - { kind: usage, text: "Обычное место в предложении — перед глаголом или в самом начале: Zazwyczaj wcześnie wstawał." }
collocations:
  - { pl: "jak zazwyczaj", ru: "как обычно" }
  - { pl: "niż zazwyczaj", ru: "чем обычно" }
  - { pl: "zazwyczaj bywa", ru: "обычно бывает" }
etymology: "Из za и zwyczaj «обычай» (праславянское *vyknǫti «привыкать»). Русское «обычно» собрано из того же корня — от «обычая»."
memory: "zazwyczaj — «обычно», и разбирается насквозь: za плюс zwyczaj «обычай», как русское «обычно» от «обычая». Синоним zwykle. И оборот niż zazwyczaj «чем обычно»."
idioms:
