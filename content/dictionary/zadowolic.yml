# review
id: zadowolic
format: 2
lemma: "zadowolić"
rank: 1924
pos: verb
aspect: perf
pron: { cyr: "задово́лиць" }
senses:
  - id: satisfy
    ru: "удовлетворить, угодить"
    examples:
      - pl: "Trudno go zadowolić."
        ru: "Ему трудно угодить."
        source: { kind: translated, id: 363614 }
      - pl: "Nie sposób zadowolić Toma."
        ru: "Тому невозможно угодить."
        source: { kind: translated, id: 3698060 }
      - pl: "Nie sposób zadowolić wszystkich."
        ru: "Всем угодить невозможно."
        source: { kind: translated, id: 361767 }
      - pl: "On chciałby wszystkich zadowolić."
        ru: "Он хотел бы всем угодить."
        source: { kind: translated, id: 415302 }
      - pl: "Nie ważne jak bardzo ona starała się, nie mogła go zadowolić."
        ru: "Она как ни старалась, не могла ему угодить."
        source: { kind: tatoeba, id: 3656741 }
      - pl: "Wynik go zadowoli."
        ru: "Результат его удовлетворит."
        source: { kind: translated, id: 773942 }
  - id: satisfy-need
    ru: "удовлетворить (потребность); устроить"
    examples:
      - pl: "Jabłko tymczasowo zadowoliło mój głód."
        ru: "Яблоко временно утолило мой голод."
        source: { kind: translated, id: 1111629 }
      - pl: "Ta wiadomość nas zadowoliła."
        ru: "Эта новость нас порадовала."
        source: { kind: translated, id: 3050365 }
      - pl: "Nic oprócz pełnych przeprosin nie zadowoli Toma."
        ru: "Ничто, кроме полных извинений, не удовлетворит Тома."
        source: { kind: translated, id: 11581377 }
notes:
  - { kind: usage, text: "Совершенный вид к zadowalać. Возвратное zadowolić się czymś значит «удовольствоваться чем-либо»." }
  - { kind: usage, text: "Прилагательное того же корня — zadowolony «довольный», у него своя карточка. Большая часть примеров в корпусе относится именно к прилагательному, а не к глаголу." }
  - { kind: usage, text: "Трудно угодить — trudno kogoś zadowolić, с винительным падежом лица." }
  - { kind: government, text: "Повелительное наклонение сохраняет ó во всех трёх формах: zadowól, zadowólmy, zadowólcie — как pozwól, pozwólmy, pozwólcie. Это не то чередование, что в stół и stoły: там перед окончанием ó переходит в o, а в повелительном остаётся." }
collocations:
  - { pl: "trudno go zadowolić", ru: "ему трудно угодить" }
  - { pl: "zadowolić wszystkich", ru: "угодить всем" }
  - { pl: "zadowolić się czymś", ru: "удовольствоваться чем-либо" }
etymology: "От za- + dowolić, от dowolny «произвольный, по желанию», в основе — wola «воля». Буквально «сделать по чьей-то воле», отсюда и «угодить»."
memory: "zadowolić — «угодить, удовлетворить»: trudno go zadowolić «ему трудно угодить». Прилагательное zadowolony «довольный» встречается ещё чаще самого глагола."
