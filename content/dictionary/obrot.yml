# review
id: obrot
format: 2
lemma: "obrót"
rank: 2212
pos: noun
pron: { cyr: "о́брут" }
senses:
  - id: turn-of-events
    ru: "поворот (событий)"
    examples:
      - pl: "Nieoczekiwany obrót wydarzeń zaszokował widzów."
        ru: "Неожиданный поворот событий шокировал зрителей."
        source: { kind: tatoeba, id: 2495941 }
      - pl: "Nieoczekiwany obrót wydarzeń zaskoczył wszystkich."
        ru: "Неожиданный поворот событий всех удивил."
        source: { kind: translated, id: 460947 }
  - id: rotation
    ru: "оборот, вращение"
    examples:
      - pl: "Planeta Saturn kończy swój obrót w ciągu trzydziestu lat."
        ru: "Планета Сатурн завершает свой оборот за тридцать лет."
        source: { kind: translated, id: 12353561 }
      - pl: "Wszystkie wytwórnie pracują na pełnych obrotach."
        ru: "Все заводы работают на полных оборотах."
        source: { kind: translated, id: 368158 }
      - pl: "Wzrastałem naukami Mistrza z każdym obrotem sfer niebieskich, aż poczułem się Ponad."
        ru: "С каждым оборотом небесных сфер я возрастал в учении Мастера."
        source: { kind: translated, id: 13789724 }
notes:
  - { kind: usage, text: "Три круга значений: физический оборот (obrót Saturna), поворот событий (obrót wydarzeń) и экономический оборот (obroty firmy «обороты фирмы»)." }
  - { kind: government, text: "Мужской неодушевлённый; чередование ó/o: obrót, но obrotu, obroty." }
  - { kind: usage, text: "na pełnych obrotach «на полных оборотах» работает и буквально о моторе, и переносно о человеке или фирме — ровно как в русском." }
  - { kind: false-friend, text: "Корень obracać «вращать, поворачивать»; ср. русское «оборот», «обращать»." }
collocations:
  - { pl: "obrót wydarzeń", ru: "поворот событий" }
  - { pl: "na pełnych obrotach", ru: "на полных оборотах" }
etymology: "От obracać «вращать, поворачивать»; ср. русское «оборот», «обращать»."
memory: "obrót — и «оборот» колеса, и «поворот» событий, и «оборот» фирмы. Чередование ó/o: obrót, но obrotu. Запомните na pełnych obrotach."
idioms:
  - { pl: "obrót wydarzeń", ru: "поворот событий" }
  - { pl: "na pełnych obrotach", ru: "на полных оборотах" }
