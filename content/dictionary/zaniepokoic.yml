# review
id: zaniepokoic
format: 2
lemma: "zaniepokoić"
rank: 2142
pos: verb
aspect: perf
pron: { cyr: "занепоко́иць" }
senses:
  - id: alarm
    ru: "встревожить, обеспокоить"
    examples:
      - pl: "Kartagińczycy zaniepokoili się, gdy to zobaczyli."
        ru: "Карфагеняне встревожились, когда это увидели."
        source: { kind: translated, id: 12323814 }
      - pl: "Byli zaniepokojeni tą wiadomością."
        ru: "Они были встревожены этой новостью."
        source: { kind: translated, id: 349345 }
      - pl: "Byłem zaniepokojony stanem twojego zdrowia."
        ru: "Я был обеспокоен состоянием твоего здоровья."
        source: { kind: translated, id: 603041 }
  - id: worried
    ru: "обеспокоенный (причастие zaniepokojony)"
    examples:
      - pl: "Jesteśmy zaniepokojeni."
        ru: "Мы обеспокоены."
        source: { kind: translated, id: 8762894 }
      - pl: "Byliśmy zaniepokojeni o dziadka i babcie."
        ru: "Мы беспокоились за дедушку и бабушку."
        source: { kind: translated, id: 683794 }
notes:
  - { kind: government, text: "Чем встревожен — творительный падеж: zaniepokojony wiadomością «встревоженный новостью». За кого — o с винительным: zaniepokojeni o dziadka." }
  - { kind: usage, text: "В живой речи чаще встречается причастие zaniepokojony «обеспокоенный», чем личные формы глагола." }
  - { kind: false-friend, text: "Корень pokój, у которого два значения — «покой» и «комната». Здесь работает первое: niepokój «беспокойство», как в русском." }
  - { kind: usage, text: "Несовершенный вид — niepokoić. Возвратное zaniepokoić się «встревожиться»." }
collocations:
  - { pl: "zaniepokojony o kogoś", ru: "обеспокоенный за кого-л." }
  - { pl: "budzić niepokój", ru: "вызывать беспокойство" }
etymology: "za- + niepokoić «беспокоить», от niepokój «беспокойство», от pokój «покой»; ср. русское «беспокоить», «покой»."
memory: "zaniepokoić — «встревожить». Чаще всего встречается причастие zaniepokojony «обеспокоенный». Корень pokój здесь значит «покой», а не «комната»."
idioms:
  - { pl: "zaniepokojony o kogoś", ru: "обеспокоенный за кого-л." }
