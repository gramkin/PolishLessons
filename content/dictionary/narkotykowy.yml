notes:
  - { kind: false-friend, text: "Русский строит такие слова приставкой «нарко-»: «наркобизнес», «наркобарон», «наркокартель». Польский ставит прилагательное после существительного: BIZNES NARKOTYKOWY, BARON NARKOTYKOWY, KARTEL NARKOTYKOWY. Русскому «наркотический» в медицинском смысле соответствует скорее NARKOTYCZNY: ŚRODEK NARKOTYCZNY. NARKOTYKOWY — о торговле, преступности и зависимости." }
  - { kind: usage, text: "Относительное прилагательное, степеней сравнения нет, все одиннадцать форм живые. Форма для мужчин-людей NARKOTYKOWI нужна в криминальных новостях: BARONOWIE NARKOTYKOWI, «наркобароны», и это устойчивое сочетание." }
  - { kind: government, text: "Обычно после существительного: GANG NARKOTYKOWY, HANDEL NARKOTYKOWY, PRZEMYT NARKOTYKOWY. Зависимость от наркотиков — UZALEŻNIENIE OD NARKOTYKÓW, OD с родительным существительного; прилагательного тут нет." }
  - { kind: pronunciation, text: "Читается «наркоты́ковы», пять слогов, ударение на предпоследнем. TY даёт твёрдое «ты», без смягчения. Сравните с NARKOTYK «нарко́тык»: в прилагательном ударение сдвигается к концу, как всегда в польском." }
  - { kind: register, text: "Слово газетное и полицейское, его слышно в криминальной хронике. В разговоре наркотики называют DRAGI, а о человеке на наркотиках говорят NAĆPANY. У этих слов прилагательного на -OWY нет." }
