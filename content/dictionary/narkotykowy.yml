etymology: "От NARKOTYK, а оно от греческого nárkōsis, «оцепенение, онемение». Изначально слово было медицинским: так называли средства, усыпляющие боль. Русское «наркотик» и «наркоз» — из того же греческого корня. Польский суффикс -OWY превратил медицинский термин в криминальный: NARKOTYKOWY — о торговле, а не о лечении."
memory: "Narkotykowy — нарко-: gang narkotykowy — наркобанда, baron narkotykowy — наркобарон. Русская приставка, польское прилагательное после слова. Читается «наркоты́ковы»."
