etymology: "Из греческого TECHNE «искусство, ремесло, умение» через латынь и немецкий, и в русский слово пришло тем же путём, поэтому гнёзда почти совпадают. Различаются только окончания, и различаются они регулярно: греческое -IKOS дало в польском -YCZNY, а в русском -ИЧЕСКИЙ, тогда как существительное на -IKE дало польское -YKA и русское -ИКА. Отсюда ряды, которые стоит держать вместе: TECHNIKA и «техника», TECHNICZNY и «технический», FIZYKA и «физика», FIZYCZNY и «физический». Исходное греческое значение умения живёт в польском TECHNIKA как «приём, способ»."
memory: "Слово подтверждает два правила сразу: -yczny это русское -ический, techniczny и «технический», а -yka это -ика, technika и «техника». Знать эти два соответствия выгоднее, чем знать само слово. Две формулы на каждый день: przerwa techniczna «технический перерыв» на табличке и z przyczyn technicznych «по техническим причинам», с родительным вместо русского дательного. И одна поправка на ударение: technika по-польски «тэ́хника», с ударением на первом слоге."
