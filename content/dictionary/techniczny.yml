notes:
  - { kind: usage, text: "Это слово удобно тем, что подтверждает сразу два правила соответствий, и выучив их, русскоязычный получает целый пласт слов без словаря. Первое: польское -YCZNY отвечает русскому -ИЧЕСКИЙ, отсюда TECHNICZNY и «технический», KLASYCZNY и «классический», LOGICZNY и «логический». Второе: польское -YKA отвечает русскому -ИКА, отсюда TECHNIKA и «техника», FIZYKA и «физика», MUZYKA и «музыка». Одиннадцать форм, степеней сравнения нет: прилагательное относительное." }
  - { kind: false-friend, text: "Гнездо этого слова почти целиком совпадает с русским, и расходится оно в двух точках. TECHNIK значит «техник», TECHNIKUM — «техникум», но польское TECHNIKUM входит в систему среднего образования и кончается профессиональным экзаменом, тогда как русский «техникум» ближе к среднему специальному. POLITECHNIKA же это не школа, а университет: STUDIUJĘ NA POLITECHNICE значит «я учусь в политехническом университете». И отдельно: TECHNIKA значит не только «техника» как оборудование, но и «приём, способ», TECHNIKA MALOWANIA «техника живописи»." }
  - { kind: government, text: "Прилагательное только согласуется. Запомнить стоит одну формулу, которая висит на каждой второй двери в Польше: Z PRZYCZYN TECHNICZNYCH, предлог Z с родительным множественного, то есть «по техническим причинам». Русский ставит здесь предлог «по» с дательным, так что падеж приходится менять целиком. Вторая частая формула — PRZERWA TECHNICZNA без всякого предлога, просто на табличке, и означает она, что заведение закрыто на короткое время." }
  - { kind: pronunciation, text: "Читается «техни́чны», три слога, ударение на предпоследнем. Сочетание CH даёт «х», как в русском, поэтому начало слова звучит знакомо. Сочетание CZ даёт твёрдое «ч». Конечное Y — это «ы», и в этом вся разница с русским словом: не «технични», а «технични» через «ы», то есть «техни́чны». В существительном TECHNIKA ударение падает на первый слог: «тэ́хника», а не «техни́ка», как по-русски, и это стоит заметить отдельно." }
  - { kind: register, text: "Слово нейтральное и очень частое в быту, потому что им описывают всякую поломку и всякий перерыв. Частые обороты: PRZERWA TECHNICZNA «технический перерыв», USTERKA TECHNICZNA «техническая неисправность», DANE TECHNICZNE «технические данные», OBSŁUGA TECHNICZNA и WSPARCIE TECHNICZNE «техподдержка», Z PRZYCZYN TECHNICZNYCH. Мужско-личная форма TECHNICZNI употребляется о персонале: PRACOWNICY TECHNICZNI «технические работники»." }
