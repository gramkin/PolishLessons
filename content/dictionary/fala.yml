# review
id: fala
format: 2
lemma: "fala"
rank: 1702
pos: noun
pron: { cyr: "фа́ля" }
senses:
  - id: wave
    ru: "волна (на воде)"
    examples:
      - pl: "Fale są wysokie."
        ru: "Волны высокие."
        source: { kind: translated, id: 1410527 }
      - pl: "Fale najczęściej są powodowane przez wiatr."
        ru: "Волны чаще всего вызываются ветром."
        source: { kind: tatoeba, id: 6696196 }
      - pl: "Wielka fala przewróciła jego kajak."
        ru: "Большая волна перевернула его каяк."
        source: { kind: translated, id: 10775152 }
  - id: wave-physics
    ru: "волна (физическая, радиоволна)"
    examples:
      - pl: "Światło zachowuje się albo jak fala, albo jak wiązka cząsteczek."
        ru: "Свет ведёт себя либо как волна, либо как поток частиц."
        source: { kind: translated, id: 9137227 }
      - pl: "Nadajemy na tej samej fali."
        ru: "Мы на одной волне."
        source: { kind: translated, id: 13654144 }
  - id: wave-surge
    ru: "волна, наплыв (жары, холода, людей)"
    examples:
      - pl: "Do stolicy nadchodzi zimna fala."
        ru: "В столицу идёт волна холода."
        source: { kind: translated, id: 10776824 }
      - pl: "Przewiduje się intensywną falę upałów."
        ru: "Ожидается сильная волна жары."
        source: { kind: translated, id: 10775154 }
notes:
  - { kind: usage, text: "Одно слово покрывает всё: волну на воде, физическую волну и наплыв — fala upałów «волна жары», fala uchodźców «волна беженцев»." }
  - { kind: usage, text: "nadawać na tej samej fali — «быть на одной волне», ровно как по-русски; fale radiowe — «радиоволны»." }
  - { kind: government, text: "Где — na falach «на волнах» (предложный), по чему — po falach «по волнам»." }
  - { kind: false-friend, text: "Общего корня с русским «волна» у слова нет, оно заимствованное, так что fala приходится запоминать отдельно." }
collocations:
  - { pl: "fala upałów", ru: "волна жары" }
  - { pl: "na tej samej fali", ru: "на одной волне" }
  - { pl: "fale radiowe", ru: "радиоволны" }
family:
  - { pl: "falować", ru: "волноваться, колыхаться", relation: root }
  - { pl: "falisty", ru: "волнистый", relation: root }
etymology: "Заимствованное слово со значением «волна». Русское «волна» — другого корня, поэтому узнать fala по родству не получится."
memory: "fala — «волна»: и на воде, и радиоволна, и наплыв (fala upałów «волна жары»). Nadajemy na tej samej fali — «мы на одной волне»."
idioms:
  - { pl: "na fali", ru: "на волне, на подъёме" }
  - { pl: "na tej samej fali", ru: "на одной волне" }
  - { pl: "fala upałów", ru: "волна жары" }
