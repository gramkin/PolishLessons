# review
id: ocknac
format: 2
lemma: "ocknąć"
rank: 6082
pos: verb
aspect: perf
pron: { cyr: "о́цкноньць" }
senses:
  - id: come-to
    ru: "ocknąć się — очнуться, прийти в себя (после сна, обморока, наркоза)"
    note: "Глагол употребляется только с się."
    examples:
      - pl: "Podróżny zemdlał z głodu, ale się szybko ocknął."
        ru: "Путник упал в обморок от голода, но быстро очнулся."
        source: { kind: translated, id: 717353 }
      - pl: "Ocknęła się w szpitalu i nic nie pamiętała."
        ru: "Она очнулась в больнице и ничего не помнила."
        source: { kind: authored }
      - pl: "Pacjent ocknie się za godzinę."
        ru: "Пациент придёт в себя через час."
        source: { kind: authored }
  - id: snap-out
    ru: "перен. опомниться, очнуться (от задумчивости, иллюзий, бездействия)"
    examples:
      - pl: "Ocknij się, to nie jest dobry pomysł!"
        ru: "Опомнись, это плохая идея!"
        source: { kind: authored }
      - pl: "Ocknął się z zamyślenia, gdy ktoś zapukał."
        ru: "Он очнулся от задумчивости, когда кто-то постучал."
        source: { kind: authored }
      - pl: "Rząd ocknął się dopiero po wyborach."
        ru: "Правительство спохватилось только после выборов."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Только с SIĘ: OCKNĄŁ SIĘ, OCKNIJ SIĘ! Объекта у глагола нет, поэтому страдательного причастия OCKNIĘTY не бывает. Парного несовершенного вида в живом языке почти нет: «приходить в себя» — BUDZIĆ SIĘ или DOCHODZIĆ DO SIEBIE." }
  - { kind: government, text: "Откуда — Z с родительным: OCKNĄĆ SIĘ ZE SNU, Z OMDLENIA, Z ZAMYŚLENIA. Где — W с предложным: OCKNĄĆ SIĘ W SZPITALU." }
  - { kind: pronunciation, text: "CK читается «цк»: «о́цкноньць». Ą перед Ł — просто «о»: OCKNĄŁ — «о́цкноу»; в OCKNĘŁA ударение сдвигается: «оцкнэ́уа». OCKNĘ — «о́цкнэ»." }
  - { kind: register, text: "Нейтрально-книжное слово, частое в прозе. В разговоре проще OBUDZIĆ SIĘ или OPRZYTOMNIEĆ; но окрик OCKNIJ SIĘ! — «очнись!, опомнись!» — вполне разговорный." }
collocations:
  - { pl: "ocknąć się ze snu", ru: "очнуться ото сна" }
  - { pl: "ocknąć się z omdlenia", ru: "прийти в себя после обморока" }
  - { pl: "ocknąć się z zamyślenia", ru: "очнуться от задумчивости" }
  - { pl: "ocknąć się w szpitalu", ru: "очнуться в больнице" }
  - { pl: "ocknąć się za późno", ru: "спохватиться слишком поздно" }
family:
  - { pl: "obudzić", ru: "разбудить (obudzić się — проснуться)", relation: root, id: obudzic }
  - { pl: "przytomność", ru: "сознание", relation: root, id: przytomnosc }
  - { pl: "zemdleć", ru: "упасть в обморок", relation: antonym, id: zemdlec }
synonyms: ["oprzytomnieć", "obudzić się", "dojść do siebie"]
etymology: "Родственно русскому «очнуться»: префикс O-, корень, который связывают с CZUĆ «чувствовать» (ср. CUCIĆ «приводить в чувство»), и суффикс -НУ- однократного действия. Как именно сложилось сочетание -CK-, толкуют по-разному."
memory: "OCKNĄĆ SIĘ — польское «очнуться»: o-CK-NĄ-ć się ≈ о-ЧНУ-ться. Ocknij się! — очнись!"
idioms:
  - { pl: "ocknąć się z ręką w nocniku", ru: "спохватиться, когда уже поздно (букв. очнуться с рукой в ночном горшке)" }
  - { pl: "Ocknij się!", ru: "Очнись! Опомнись!" }
