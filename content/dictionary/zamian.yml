        ru: "Взамен я покажу вам окрестности."
        source: { kind: translated, id: 3191190 }
notes:
  - { kind: usage, text: "Слово-окаменелость: живёт только в обороте w zamian «взамен» и w zamian za coś «в обмен на что-л.». Отдельно zamian не употребляется." }
  - { kind: government, text: "В обороте w zamian za требуется ВИНИТЕЛЬНЫЙ падеж: w zamian za pomoc «в обмен на помощь»." }
  - { kind: false-friend, text: "От zamiana «обмен» и zamienić «обменять», которое уже есть в словаре. Русское «взамен» собрано тем же способом: «в» + «замена»." }
  - { kind: usage, text: "Синонимы оборота: w zastępstwie «вместо», za to «зато». Обычное существительное «обмен» — zamiana." }
collocations:
  - { pl: "w zamian", ru: "взамен" }
  - { pl: "w zamian za coś", ru: "в обмен на что-л." }
