id: ja
format: 2
lemma: "ja"
rank: 7
pos: pron
pron: { cyr: "я" }
senses:
  - id: i
    ru: "я"
    examples:
      - pl: "Ja!"
        ru: "Я!"
        source: { kind: tatoeba, id: 6160605 }
      - pl: "Ja zapłacę."
        ru: "Я заплачу."
