# review
id: gratis
format: 2
lemma: "gratis"
rank: 6075
pos: adv
pron: { cyr: "гра́тис" }
senses:
  - id: free-of-charge
    ru: "бесплатно, даром — в придачу к покупке или в подарок"
    examples:
      - pl: "To jest gratis."
        ru: "Это бесплатно."
        source: { kind: translated, id: 532109 }
      - pl: "Do każdego telefonu etui dostaje pan gratis."
        ru: "К каждому телефону вы получаете чехол бесплатно."
        source: { kind: authored }
      - pl: "Przy zakupie dwóch książek trzecią dają gratis."
        ru: "При покупке двух книг третью дают даром."
        source: { kind: authored }
  - id: freebie
    ru: "(разг., как существительное) подарок к покупке, бонус"
    examples:
      - pl: "Do gazety dołączono gratis: płytę z filmem."
        ru: "К газете приложили подарок — диск с фильмом."
        source: { kind: authored }
      - pl: "Ten długopis to gratis od firmy."
        ru: "Эта ручка — подарок от фирмы."
        source: { kind: authored }
      - pl: "Kawa jest w cenie, a ciastko gratis."
        ru: "Кофе входит в цену, а пирожное — бесплатно."
        source: { kind: authored }
notes:
  - { kind: usage, text: "GRATIS — «бесплатно», но с оттенком торговли: так говорят о том, что дают в придачу к покупке или в рекламных целях (dostać gratis, «получить бесплатно»; trzecia sztuka gratis, «третья штука в подарок»). В быту чаще ZA DARMO, в официальном языке — BEZPŁATNIE или NIEODPŁATNIE (wstęp bezpłatny, «вход свободный»). Русское «гратис» почти не употребляется, поэтому ближе всего — «бесплатно», «даром», «в подарок»." }
  - { kind: government, text: "Неизменяемое слово. Как наречие стоит при глаголе, обычно после дополнения: dostać coś gratis, dawać gratis. В разговорной речи — ещё и существительное мужского рода, «подарок к покупке», и тогда склоняется: gratis, gratisu, мн. ч. GRATISY (do zamówienia dorzucili gratisy, «к заказу добавили подарки»), уменьшительное GRATISIK. Прилагательное — GRATISOWY: gratisowa próbka, «бесплатный пробник»." }
  - { kind: pronunciation, text: "«гра́тис», ударение на первом слоге, как в латыни. TI здесь читается как русское «ти», а не как польское CI («ць»): в заимствованиях польский пишет TI именно для этого звука." }
collocations:
  - { pl: "dostać coś gratis", ru: "получить что-то бесплатно" }
  - { pl: "dorzucić coś gratis", ru: "добавить что-то в подарок" }
  - { pl: "trzecia sztuka gratis", ru: "третья штука в подарок" }
  - { pl: "dostawa gratis", ru: "бесплатная доставка" }
family:
  - { pl: "gratisowy", ru: "бесплатный, подарочный", relation: derived }
  - { pl: "gratisik", ru: "подарочек к покупке", relation: derived }
etymology: "Из латыни: GRATIS — «даром, из милости», сокращение от GRATIIS, творительного падежа множественного числа от GRATIA, «благодарность, милость», — буквально «за одно спасибо». Отсюда же польские GRATULOWAĆ, «поздравлять», и GRACJA, «грация», а в русском — «грация» и «грациозный»."
memory: "Gratia — «спасибо» по-латыни (итальянское grazie): gratis — «за спасибо», то есть даром."
idioms:
  - { pl: "nie ma nic za darmo", ru: "ничего не бывает бесплатно" }
  - { pl: "za darmo to i ocet słodki", ru: "на халяву и уксус сладкий" }
formExamples:
  - form: "gratis"
    pl: "To jest gratis."
    ru: "Это бесплатно."
    source: { kind: translated, id: 532109 }
  - form: "gratis"
    pl: "Fryzjer obciął mi włosy, a modelowanie zrobił gratis."
    ru: "Парикмахер подстриг меня, а укладку сделал бесплатно."
    source: { kind: authored }
  - form: "gratis"
    pl: "Przy zamówieniu powyżej stu złotych dostawa jest gratis."
    ru: "При заказе дороже ста злотых доставка бесплатная."
    source: { kind: authored }
