etymology: "Из o + koło «круг», буквально «вокруг». Русское «около» собрано ровно так же, от «коло» — старого названия круга."
memory: "około — «около, приблизительно», и требует родительного падежа: około godziny, około piątej. Но только о количестве и времени: «около дома» в пространственном смысле будет koło domu или obok domu. Формы у слова одна — это предлог."
