# review
id: realny
format: 2
lemma: "realny"
rank: 4585
pos: adj
pron: { cyr: "реа́льны" }
senses:
  - id: real
    ru: "реальный, действительный, настоящий"
    examples:
      - pl: "To realne zagrożenie, a nie fikcja."
        ru: "Это реальная угроза, а не выдумка."
        source: { kind: authored }
      - pl: "Realny wzrost płac wyniósł dwa procent."
        ru: "Реальный рост зарплат составил два процента."
        source: { kind: authored }
      - pl: "To najrealniejszy scenariusz."
        ru: "Это самый реальный сценарий."
        source: { kind: authored }
  - id: feasible
    ru: "осуществимый, выполнимый, реалистичный"
    examples:
      - pl: "Czy ten termin jest realny?"
        ru: "Реален ли этот срок?"
        source: { kind: authored }
      - pl: "Mamy realne szanse na zwycięstwo."
        ru: "У нас есть реальные шансы на победу."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Совпадение с русским «реальный» почти полное. Тонкость: «реалистичный» о человеке по-польски — REALISTA или REALISTYCZNY, а REALNY о людях почти не говорят. В экономике REALNY противопоставлен NOMINALNY: REALNA WARTOŚĆ, «реальная стоимость»." }
  - { kind: usage, text: "Полная парадигма: REALNY, REALNIEJSZY, NAJREALNIEJSZY. Степени — в значении «осуществимый»: REALNIEJSZY PLAN, NAJREALNIEJSZA OPCJA. Мужское-личное: REALNI, REALNIEJSI, NAJREALNIEJSI — о кандидатах, у которых есть реальные шансы." }
  - { kind: government, text: "Реальный для кого-то — REALNY DLA KOGOŚ, DLA с родительным. Реальный в срок — REALNY DO + родительный: REALNY DO WYKONANIA, «выполнимый». Наречие REALNIE — «реально, на деле»." }
  - { kind: pronunciation, text: "Читается «реа́льны», три слога, ударение на предпоследнем. E и A произносятся раздельно: «ре-а». L перед N мягкая. В REALNIEJSZY: «реальне́йшы»." }
  - { kind: register, text: "Нейтральное слово, частое в экономике, политике и планировании. В молодёжной речи REALNIE — «реально, по-настоящему»: REALNIE SIĘ BOJĘ, «я реально боюсь»." }
collocations:
  - { pl: "realne zagrożenie", ru: "реальная угроза" }
  - { pl: "realne szanse", ru: "реальные шансы" }
  - { pl: "realny termin", ru: "реальный срок" }
family:
  - { pl: "realnie", ru: "реально", relation: derived }
  - { pl: "rzeczywisty", ru: "действительный", relation: root }
  - { pl: "realista", ru: "реалист", relation: derived }
etymology: "Из позднелатинского realis, «вещественный», от res «вещь». Реальное — относящееся к вещам, а не к словам. Польское RZECZYWISTY, «действительный», собрано по той же логике своими силами: от RZECZ, «вещь»."
memory: "Realny — реальный; осуществимый: realne zagrożenie, realny termin, realne szanse. Realniejszy, najrealniejszy. Своё слово — rzeczywisty, от rzecz. Читается «реа́льны»."
idioms:
  - { pl: "realne szanse", ru: "реальные шансы" }
