etymology: "От ŻYCIE «жизнь», отглагольного существительного от ŻYĆ «жить», из праславянского *žiti — того же корня, что русские «жить», «жизнь», «живот» в старом значении «жизнь». Суффикс -OWY относительный и крайне продуктивный, он же в DOMOWY, PAŃSTWOWY, HANDLOWY, и даёт значение «относящийся к». Поэтому ŻYCIOWY буквально «относящийся к жизни», и первое значение прямо отсюда. Второе, «практичный», развилось позже и по понятному пути: тот, кто знает жизнь, умеет в ней устроиться. Русский от того же корня построил «жизненный», но этого второго шага не сделал, и потому значение «практичный» для русского в слове не читается."
memory: "Второе значение русский не угадает: o человеке życiowy значит «практичный, знающий жизнь» — człowiek życiowy это похвала. В первом значении совпадает: doświadczenie życiowe, poziom życiowy «уровень жизни». Расходы на жизнь — koszty utrzymania, не życiowe. Суффикс -owy относительный, как в domowy и handlowy."
