notes:
  - { kind: false-friend, text: "Второе значение русский не угадает, и оно частотно. О человеке ŻYCIOWY значит не «жизненный», а «практичный, знающий жизнь, умеющий устроиться»: TO CZŁOWIEK ŻYCIOWY есть похвала, примерно «он человек толковый, с житейской смёткой». Русское «жизненный человек» так не звучит и вообще не употребляется. То же со советом: RADA ŻYCIOWA есть житейский, практичный совет, а не «жизненный». В первом значении слова совпадают: DECYZJA ŻYCIOWA «жизненное решение», DOŚWIADCZENIE ŻYCIOWE «жизненный опыт», POZIOM ŻYCIOWY «уровень жизни»." }
  - { kind: usage, text: "Относительное по происхождению, но во втором значении слово стало качественным, и потому степени сравнения у него возможны именно там: BARDZIEJ ŻYCIOWY «более практичный». В первом значении степеней нет, как у всех относительных. В таблице одиннадцать форм, без градуированных степеней, и это соответствует первому, основному значению. Устойчивые сочетания: POZIOM ŻYCIOWY «уровень жизни», расходы на жизнь называются KOSZTY UTRZYMANIA, и это стоит запомнить отдельно." }
  - { kind: pronunciation, text: "Читается «жычё́вы», ударение на предпоследнем слоге. Начальное Ż даёт «ж», буква Y — «ы», а сочетание CIO читается «чё», одним слогом с мягким c. Слово трёхсложное: ŻY-CIO-WY. В женской форме ŻYCIOWA ударение остаётся на том же слоге: «жычё́ва». Корневое ŻYCIE произносится «жы́че», и его стоит проговорить рядом, чтобы закрепить чтение CIE и CIO." }
  - { kind: government, text: "Прилагательное согласуется с существительным и ничем не управляет. В первом значении обычно стоит после существительного: DOŚWIADCZENIE ŻYCIOWE, POZIOM ŻYCIOWY, DECYZJA ŻYCIOWA, и такой порядок закрепился в устойчивых выражениях. Во втором значении, о человеке, оно стоит после существительного тоже: CZŁOWIEK ŻYCIOWY. Существительное — ŻYCIE «жизнь», глагол ŻYĆ «жить», наречие от прилагательного не образуется, и вместо него говорят PRAKTYCZNIE или Z DOŚWIADCZENIA." }
