notes:
  - { kind: government, text: "Женский род: ta Rosja, tej Rosji. Из России — z Rosji, с родительным. В России — w Rosji, предложный." }
  - { kind: false-friend, text: "Пишется с одной s и читается «Ро́сья»: сочетание sj даёт мягкое сь + я. Русское «Россия» с двумя с — польское написание короче." }
  - { kind: usage, text: "Прилагательное — rosyjski «русский, российский», у него своя карточка. Житель — Rosjanin, Rosjanka." }
  - { kind: usage, text: "Пишется с большой буквы, как и все названия стран." }
  - { kind: usage, text: "Название страны живёт в единственном числе: формы множественного числа вроде Rosje или Rosjom в обычной речи не встречаются. Множественное возможно лишь как риторическая фигура о разделённой стране — по образцу dwie Polski «две Польши»." }
collocations:
  - { pl: "w Rosji", ru: "в России" }
  - { pl: "z Rosji", ru: "из России" }
etymology: "От латинского Russia; польское написание с одной s."
memory: "Rosja — «Россия», читается «Ро́сья»: sj даёт сь + я. В России — w Rosji, из России — z Rosji. Прилагательное — rosyjski."
idioms:
  - { pl: "w Rosji", ru: "в России" }
