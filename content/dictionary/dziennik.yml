  - { pl: "dzienny", ru: "дневной", relation: derived }
etymology: "От DZIEŃ, из праславянского *dьnь — то же слово, что русский «день», — с суффиксом -nik, тем же, что в «дневнике». Слово собрано в двух языках одинаково, но польский потом отдал его газете: ежедневное издание и есть dziennik, и от этого значения пошёл dziennikarz «журналист». Русский такого расширения не сделал и назвал газетчика от «журнала», слова французского."
memory: "Четыре смысла: дневник, газета, новости, школьный журнал. Отсюда dziennikarz — журналист. А в местном k не смягчается: w dzienniku, не как w klinice."
