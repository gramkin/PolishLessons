notes:
  - { kind: usage, text: "Местный падеж — DZIENNIKU, и k остаётся нетронутым. Рядом в этой же партии стоит KLINICE, где тот же k перешёл в c. Согласный один и тот же, разница только в окончании: мужской род берёт в местном -u, женский в дательном и местном -e, и смягчает именно -e. Это подтверждает то, что в прошлой партии показала пара kostce и ciastku: причина мены не в согласном и не в роде самом по себе, а в гласной, которая за ним стоит." }
  - { kind: false-friend, text: "Русский «дневник» — только тетрадь с записями. Польский DZIENNIK значит ещё и «ежедневная газета» (Dziennik Polski), и «выпуск новостей» по телевидению, и «школьный журнал». Четыре смысла против одного, и расходятся они далеко: главное производное DZIENNIKARZ значит «журналист», а не «тот, кто ведёт дневник», потому что выросло из газетного значения, а не из тетрадного." }
  - { kind: usage, text: "Основа при словообразовании меняется: DZIEŃ даёт DZIENN-, где ń твердеет в n, а e остаётся на месте. Русский построил «дневник» из того же «дня» и тем же суффиксом, но беглое e выбросил: дн-евник. Одно слово, один суффикс, противоположное обращение с гласной — и польская форма оказывается ближе к исходному «дню», чем русская." }
collocations:
  - { pl: "prowadzić dziennik", ru: "вести дневник" }
