notes:
  - { kind: false-friend, text: "SKŁADNIK — «ингредиент, компонент», а не «складчик» и не «склад». Склад — MAGAZYN, состав (продукта) — SKŁAD: SKŁAD PRODUKTU. Рецепт — PRZEPIS." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Родительный — SKŁADNIKA, с -A. Множественное — SKŁADNIKI." }
  - { kind: government, text: "Ингредиенты для чего — SKŁADNIKI NA и винительный: SKŁADNIKI NA CIASTO. Составная часть чего — родительный: SKŁADNIK DIETY." }
  - { kind: pronunciation, text: "Читается «скуа́дник»: Ł — «у», как в SKŁADAĆ. Ударение на первом слоге." }
collocations:
  - { pl: "składniki na ciasto", ru: "ингредиенты для теста" }
  - { pl: "naturalne składniki", ru: "натуральные ингредиенты" }
