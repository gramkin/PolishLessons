lemma: "spadkobierca"
rank: 2006
pos: noun
pron: { cyr: "спадкобе́рца" }
senses:
  - id: heir
    ru: "наследник"
    examples:
      - pl: "Spadkobierca musi zapłacić podatek."
        ru: "Наследник должен заплатить налог."
        source: { kind: authored }
      - pl: "Jest jedynym spadkobiercą majątku."
        ru: "Он единственный наследник имущества."
        source: { kind: authored }
      - pl: "Kto jest spadkobiercą zmarłego?"
        ru: "Кто наследник умершего?"
        source: { kind: authored }
      - pl: "Znaleziono wszystkich spadkobierców."
        ru: "Нашли всех наследников."
        source: { kind: authored }
  - id: successor
    ru: "наследник, преемник (в переносном смысле)"
    examples:
      - pl: "Anglicy są spadkobiercami wolności."
        ru: "Англичане — наследники свободы."
        source: { kind: translated, id: 12331176 }
notes:
  - { kind: government, text: "Мужской род, но в единственном числе склоняется по женскому типу: spadkobierca, spadkobiercy, spadkobiercę — как kolega или kierowca." }
  - { kind: usage, text: "Женская форма — spadkobierczyni." }
  - { kind: false-friend, text: "Здесь spadek не «падение», а «наследство»; в польском у слова spadek есть оба значения." }
  - { kind: usage, text: "Юридический термин, но употребляется и в обычной речи, и переносно: spadkobiercy tradycji «наследники традиции»." }
collocations:
  - { pl: "jedyny spadkobierca", ru: "единственный наследник" }
  - { pl: "spadkobierca ustawowy", ru: "наследник по закону" }
etymology: "От spadek «наследство» (буквально «то, что упало» — от spaść «упасть») и brać «брать»: «берущий наследство»."
memory: "spadkobierca = «наследник»: spadek «наследство» + brać «брать». Главная ловушка — склонение: род мужской, а окончания женские, как у kolega."
