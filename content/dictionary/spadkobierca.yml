  - { kind: government, text: "Слово мужского рода, но склоняется по женскому образцу: spadkobierca, spadkobiercy, spadkobiercę, spadkobiercą — как kolega и poeta. Во множественном оно снова мужско-личное: spadkobiercy, spadkobierców." }
