notes:
  - { kind: false-friend, text: "Слово английское и значит то же, что русское «рок» в музыкальном смысле. Но у русского есть вторая «рок» — судьба, рок висит над героем. Это совсем другое слово, родственное «речи» и «пророку», и к музыке отношения не имеет. В польском такой двусмысленности нет: судьба это los или przeznaczenie, а rock только музыка." }
  - { kind: pronunciation, text: "Слово сохранило английское написание, но читается по-польски: «рок», один слог. В косвенных падежах появляется второй: rocka — «ро́ка», rockiem — «ро́кем». Склоняется как обычное мужское существительное." }
  - { kind: usage, text: "Прилагательное rockowy: zespół rockowy, muzyka rockowa, koncert rockowy. Множественное rocki употребляется разговорно, о конкретных рок-композициях. Rockman значит «рокер», а рокер-мотоциклист — это motocyklista." }
collocations:
  - { pl: "muzyka rockowa", ru: "рок-музыка" }
  - { pl: "zespół rockowy", ru: "рок-группа" }
  - { pl: "słuchać rocka", ru: "слушать рок" }
family:
  - { pl: "rockowy", ru: "роковый, рок-", relation: derived }
  - { pl: "rockman", ru: "рокер", relation: derived }
etymology: "Из английского rock, сокращения от rock and roll, буквально «качаться и крутиться». В русский слово пришло тем же путём и в то же время. Исконное русское «рок» в смысле судьбы с ним никак не связано: оно от того же корня, что «речь» и «пророк». Отсюда rockowy, rockman и punkrock."
memory: "rock — это только музыка. Русский «рок» двусмыслен: судьба и музыка — разные слова, случайно совпавшие. По-польски судьба это los. И пишется слово по-английски, а склоняется по-польски: rocka, rockiem."
idioms:
  - { pl: "muzyka rockowa", ru: "рок-музыка" }
  - { pl: "zespół rockowy", ru: "рок-группа" }
formExamplesSkip:
  - { form: "rocku", cell: "Звательный", reason: "звательный падеж: для неодушевлённого существительного он практически не употребляется" }
