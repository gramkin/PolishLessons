# review
id: pewnosc
format: 2
lemma: "pewność"
rank: 584
pos: noun
pron: { cyr: "пэ́вносць" }
senses:
  - id: certainty
    ru: "уверенность, определённость"
    note: "mieć pewność «быть уверенным», nie mam pewności «я не уверен»."
    examples:
      - pl: "Nie mam pewności."
        ru: "Я не уверен."
        source: { kind: translated, id: 1614928 }
      - pl: "Można mieć pewność?"
        ru: "Можно быть уверенным?"
        source: { kind: translated, id: 8770396 }
      - pl: "Nie ma pewności, że wartość akcji wzrośnie."
        ru: "Нет уверенности, что стоимость акций вырастет."
        source: { kind: translated, id: 2679953 }
  - id: self-confidence
    ru: "pewność siebie — уверенность в себе"
    note: "Буквально «уверенность себя», с возвратным местоимением."
    examples:
      - pl: "Poczuł nagły przypływ pewności siebie."
        ru: "Он почувствовал внезапный прилив уверенности в себе."
        source: { kind: translated, id: 1348731 }
      - pl: "Straciłem całą swoją pewność siebie."
        ru: "Я потерял всю свою уверенность в себе."
        source: { kind: translated, id: 4169752 }
      - pl: "Skąd bierzesz taką pewność siebie?"
        ru: "Откуда у тебя такая уверенность в себе?"
        source: { kind: translated, id: 3589830 }
  - id: surely
    ru: "z pewnością — наверняка, несомненно"
    note: "Творительный работает как наречие."
    examples:
      - pl: "Tak, z pewnością."
        ru: "Стопудово."
        source: { kind: tatoeba, id: 10115257 }
      - pl: "Z pewnością."
        ru: "Несомненно."
        source: { kind: translated, id: 1351691 }
      - pl: "Z pewnością się zaziębił."
        ru: "Он наверняка простудился."
        source: { kind: translated, id: 418320 }
notes:
  - { kind: government, text: "Творительный z pewnością работает как наречие «наверняка, несомненно»: z pewnością się zaziębił." }
  - { kind: usage, text: "pewność siebie — «уверенность в себе», дословно «уверенность себя»; stracić pewność siebie «потерять уверенность в себе»." }
  - { kind: usage, text: "Существительное неисчисляемое — множественного числа у него нет." }
  - { kind: usage, text: "Прилагательное — pewny «уверенный; некий»: jestem pewny «я уверен», pewien człowiek «некий человек»." }
collocations:
  - { pl: "z pewnością", ru: "наверняка" }
  - { pl: "pewność siebie", ru: "уверенность в себе" }
  - { pl: "mieć pewność", ru: "быть уверенным" }
  - { pl: "nie mam pewności", ru: "я не уверен" }
family:
  - { pl: "pewny", ru: "уверенный; некий", relation: root }
  - { pl: "pewnie", ru: "наверное", relation: derived }
  - { pl: "upewnić się", ru: "убедиться", relation: derived }
etymology: "От pewny «уверенный», праславянское *pъvati «доверять, надеяться» — тот же корень, что в русском «уповать»."
memory: "pewność — «уверенность», и два оборота стоит запомнить целиком. Первый: z pewnością, творительный падеж в роли наречия — «наверняка, несомненно». Второй: pewność siebie «уверенность в себе», дословно «уверенность себя». Слово неисчисляемое, множественного числа у него нет. Прилагательное pewny значит и «уверенный», и «некий»: pewien człowiek «некий человек»."
idioms:
