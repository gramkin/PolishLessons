notes:
  - { kind: false-friend, text: "ANTENA — «антенна», но с одним N. Главное отличие: NA ANTENIE значит «в эфире». Эфирное время — CZAS ANTENOWY, сойти с эфира — ZEJŚĆ Z ANTENY." }
  - { kind: usage, text: "Девять живых форм, женский род. В местном падеже N перед IE смягчается: NA ANTENIE. Звательный не даётся." }
  - { kind: government, text: "На антенне и в эфире — NA ANTENIE, местный. Выйти в эфир — WEJŚĆ NA ANTENĘ, винительный. Антенна на крыше — ANTENA NA DACHU." }
  - { kind: pronunciation, text: "Читается «антэ́на», ударение на предпоследнем слоге. TE — твёрдое «тэ», одно N." }
