etymology: "Из латинского слова, которым называли корабельную рею, а позже — усики насекомых. Русское «антенна» — из того же источника, но с двумя Н."
memory: "Antena — антенна, одно N. Na antenie — в эфире. Czas antenowy — эфирное время. Zejść z anteny — сойти с эфира."
