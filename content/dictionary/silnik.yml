        source: { kind: authored }
notes:
  - { kind: usage, text: "Образовано от siła «сила» суффиксом -nik: буквально «то, что даёт силу». Русское «двигатель» построено от «двигать» — другая метафора." }
  - { kind: false-friend, text: "Русское «мотор» в польском тоже есть, но motor чаще значит «мотоцикл»; двигатель — именно silnik." }
  - { kind: usage, text: "Устойчиво: uruchomić silnik «завести двигатель», wyłączyć silnik «выключить двигатель», silnik zgasł «двигатель заглох»." }
  - { kind: usage, text: "Второе значение — компьютерный «движок»: silnik wyszukiwarki «поисковый движок», silnik gry «игровой движок»." }
collocations:
  - { pl: "uruchomić silnik", ru: "завести двигатель" }
  - { pl: "wyłączyć silnik", ru: "выключить двигатель" }
  - { pl: "silnik wyszukiwarki", ru: "поисковый движок" }
etymology: "От siła «сила» с суффиксом -nik, который обозначает орудие (как в czajnik «чайник», budzik «будильник»). Русская «сила» — то же праславянское слово, так что корень узнаётся сразу."
memory: "silnik = «двигатель, мотор», буквально «силовик»: от siła «сила». А motor по-польски чаще «мотоцикл», так что не путайте. Второе значение — компьютерный «движок»: silnik gry."
