family:
  - { pl: "status społeczny", ru: "социальный статус", relation: derived }
  - { pl: "status quo", ru: "существующее положение", relation: derived }
  - { pl: "statut", ru: "устав", relation: root }
etymology: "Из латинского слова со значением «положение, состояние», от «стоять». Того же корня STATUT, «устав»."
memory: "Status — статус; statut — устав! Читается «ста́тус». Status społeczny — социальный статус. Status quo — существующее положение."
