notes:
  - { kind: false-friend, text: "STATUS — «статус, положение», перевод прямой. Ловушка в соседнем слове: STATUT — это «устав»: STATUT SZKOŁY, STATUT SPÓŁKI. STATUS QUO — «существующее положение»." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Родительный — STATUSU, местный — W STATUSIE." }
