        source: { kind: authored }
notes:
  - { kind: usage, text: "Форм одиннадцать, степеней сравнения нет: дело либо судебное, либо нет, более судебным оно не бывает. Это четвёртое такое прилагательное рядом с fizyczny, miejscowy и kredytowy, и причина та же — слово относит к разряду, а не измеряет качество." }
  - { kind: false-friend, text: "Корень обманчив шире, чем кажется. SĄD — это и «суд», и «суждение, мнение»: mój sąd o tej sprawie значит «моё мнение об этом деле». А глагол SĄDZIĆ чаще всего означает вовсе не «судить», а «полагать, думать»: SĄDZĘ, ŻE TAK значит «я думаю, что да». Русский, тянущийся к «судить», будет понят, но повседневного смысла не поймает, а он здесь главный." }
  - { kind: pronunciation, text: "Форма SĄDOWI двусмысленна: это и мужская личная форма множественного этого прилагательного — biegli sądowi, — и дательный единственного существительного SĄD: przyglądał się sądowi. Разводит их только контекст, как и в паре technika, где родительный от «техника» совпал с именительным «техники»." }
collocations:
  - { pl: "postępowanie sądowe", ru: "судебное производство" }
  - { pl: "wyrok sądowy", ru: "судебное решение" }
  - { pl: "biegły sądowy", ru: "судебный эксперт" }
family:
  - { pl: "sąd", ru: "суд; мнение", relation: root, id: sad }
  - { pl: "sądzić", ru: "судить; полагать", relation: root, id: sadzic }
  - { pl: "sędzia", ru: "судья", relation: derived, id: sedzia }
etymology: "От SĄD, из праславянского *sǫdъ — то же слово, что русский «суд», от корня *sǫd- «ставить вместе, решать». Русский оставил за словом только разбирательство, а польский удержал и второе, более старое значение: суждение, мнение. Отсюда и sądzić, которое по-польски значит прежде всего «полагать», и sąd o czymś — взгляд на что-то."
memory: "Одиннадцать форм, степеней нет: разряд. А корень шире русского — sądzić значит «полагать», и sąd бывает «мнением»."
