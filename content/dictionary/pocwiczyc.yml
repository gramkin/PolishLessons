# review
id: pocwiczyc
format: 2
lemma: "poćwiczyć"
rank: 2089
pos: verb
aspect: perf
aspectPair: cwiczyc
pron: { cyr: "поцьви́чиць" }
senses:
  - id: practise
    ru: "позаниматься, потренироваться"
    examples:
      - pl: "Potrzebujesz poćwiczyć gramatykę."
        ru: "Тебе нужно позаниматься грамматикой."
        source: { kind: translated, id: 846296 }
      - pl: "Teraz idź poćwiczyć."
        ru: "А теперь иди потренируйся."
        source: { kind: translated, id: 2680560 }
      - pl: "Poćwiczmy."
        ru: "Давай позанимаемся."
        source: { kind: translated, id: 9038871 }
  - id: train
    ru: "поупражняться (на инструменте, в зале)"
    examples:
      - pl: "Tom może przyjść do mnie i poćwiczyć na moim pianinie, jeśli chce."
        ru: "Том может прийти ко мне и поиграть на моём пианино, если захочет."
        source: { kind: translated, id: 4818021 }
      - pl: "Chcę poćwiczyć przed egzaminem."
        ru: "Я хочу позаниматься перед экзаменом."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Приставка po- даёт значение «немного, некоторое время»: poćwiczyć — это не «натренироваться», а «позаниматься какое-то время»." }
  - { kind: government, text: "Винительный падеж для предмета занятий (poćwiczyć gramatykę) или na с предложным для инструмента (poćwiczyć na pianinie)." }
  - { kind: usage, text: "Несовершенный вид — ćwiczyć «заниматься, упражняться»." }
  - { kind: false-friend, text: "Корень ćwiczyć не связан с русским «чувствовать». Существительное ćwiczenie значит «упражнение»." }
collocations:
  - { pl: "poćwiczyć gramatykę", ru: "позаниматься грамматикой" }
etymology: "po- + ćwiczyć «упражняться»; приставка po- здесь значит «немного, некоторое время», как русское «по-» в «позаниматься»."
memory: "poćwiczyć — «позаниматься немного», от ćwiczyć. Приставка po- задаёт небольшую порцию действия, ровно как русское «по-» в «почитать», «поработать»."
idioms:
  - { pl: "poćwiczyć gramatykę", ru: "позаниматься грамматикой" }
