# review
id: zaczekac
format: 2
lemma: "zaczekać"
rank: 423
pos: verb
aspect: perf
pron: { cyr: "зачэ́каць" }
senses:
  - id: wait
    ru: "подождать"
    examples:
      - pl: "Zaczekaj na mnie."
        ru: "Подожди меня."
        source: { kind: tatoeba, id: 6327925 }
      - pl: "Zaczekaj, ktoś puka do drzwi."
        ru: "Подожди, кто-то в дверь стучит."
        source: { kind: tatoeba, id: 3531583 }
      - pl: "Proszę na mnie zaczekać!"
        ru: "Подождите меня!"
        source: { kind: tatoeba, id: 12698436 }
  - id: wait-q
    ru: "подождать (в вопросах и предложениях)"
    examples:
      - pl: "Zaczekasz na mnie?"
        ru: "Подождёшь меня?"
        source: { kind: tatoeba, id: 6327926 }
      - pl: "Zaczekajcie na mnie!"
        ru: "Подождите меня!"
        source: { kind: tatoeba, id: 12698435 }
      - pl: "Mogę zaczekać."
        ru: "Я могу подождать."
        source: { kind: translated, id: 9561034 }
notes:
  - { kind: usage, text: "zaczekać и poczekać — полные синонимы «подождать». Разница только в приставке, и обе формы одинаково обиходны." }
  - { kind: usage, text: "Ждут кого-то с предлогом na и винительным падежом: Zaczekaj na mnie «Подожди меня»." }
  - { kind: usage, text: "Несовершенный вид — czekać: Czekam «Я жду», но Zaczekam «Я подожду»." }
  - { kind: usage, text: "Вежливая формула — Proszę zaczekać «Подождите, пожалуйста»." }
collocations:
  - { pl: "zaczekaj na mnie", ru: "подожди меня" }
  - { pl: "proszę zaczekać", ru: "подождите, пожалуйста" }
  - { pl: "zaczekaj chwilę", ru: "подожди минутку" }
etymology: "Из za- + czekać; праславянское *čekati родственно русскому «чаять» (ожидать) — отсюда же «нечаянно», то есть «неожиданно»."
memory: "zaczekać — «подождать», полный синоним poczekać: приставка разная, смысл один. Ждут с предлогом na: Zaczekaj na mnie. А корень тот же, что в русском «чаять»."
idioms:
  - { pl: "zaczekaj chwilę", ru: "подожди минутку" }
  - { pl: "proszę zaczekać", ru: "подождите, пожалуйста" }
  - { pl: "zaczekać na kogoś", ru: "подождать кого-либо" }
