id: ustanek
format: 2
lemma: "ustanek"
rank: 2311
pos: noun
pron: { cyr: "уста́нэк" }
senses:
  - id: respite
    ru: "передышка, остановка (в обороте bez ustanku)"
    examples:
      - pl: "Padało bez ustanku."
        ru: "Дождь шёл без остановки."
        source: { kind: authored }
      - pl: "Mówił bez ustanku przez godzinę."
        ru: "Он говорил без умолку целый час."
        source: { kind: authored }
      - pl: "Telefon dzwonił bez ustanku."
        ru: "Телефон звонил без умолку."
        source: { kind: authored }
  - id: pause
    ru: "перерыв, остановка (вне оборота — редко)"
    examples:
      - pl: "Pracowali bez ustanku do rana."
        ru: "Они работали без передышки до утра."
        source: { kind: authored }
      - pl: "Wiatr wiał bez ustanku."
        ru: "Ветер дул не переставая."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Слово-окаменелость: живёт практически только в обороте bez ustanku «без умолку, без остановки». Отдельно ustanek вы не услышите." }
  - { kind: government, text: "В обороте — родительный падеж после bez: bez ustanku." }
  - { kind: false-friend, text: "От ustać «прекратиться, перестать». Не от «устать»: польское ustać значит «остановиться», а не «утомиться»." }
  - { kind: usage, text: "Синонимы того же оборота: bez przerwy, nieustannie, bez końca. Прилагательное nieustanny «беспрестанный» из той же семьи и встречается куда чаще." }
collocations:
  - { pl: "bez ustanku", ru: "без умолку, без остановки" }
etymology: "От ustać «прекратиться, перестать»; родня — nieustanny «беспрестанный»."
memory: "ustanek — слово-окаменелость: живёт только в обороте bez ustanku «без умолку». Корень ustać «прекратиться», а вовсе не русское «устать»."
