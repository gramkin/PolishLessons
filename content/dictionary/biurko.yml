notes:
  - { kind: false-friend, text: "biurko — это именно письменный стол, а biuro — «офис, контора». Слова однокоренные, но путать их нельзя: pracuję w biurze «работаю в офисе», siedzę przy biurku «сижу за столом»." }
  - { kind: government, text: "«На столе» — na biurku (предложный), «под столом» — pod biurkiem (творительный), «за столом» — przy biurku." }
  - { kind: usage, text: "Обеденный стол — это stół; biurko только письменный, рабочий." }
  - { kind: usage, text: "Существительное среднего рода: biurko, biurka, biurku." }
collocations:
  - { pl: "na biurku", ru: "на столе" }
  - { pl: "pod biurkiem", ru: "под столом" }
  - { pl: "siedzieć przy biurku", ru: "сидеть за столом" }
etymology: "Уменьшительное от biuro «бюро, контора», из французского bureau — исходно «сукно», которым покрывали стол. Русское «бюро» пришло из того же источника, но письменный стол по-русски так не называют."
memory: "biurko = «письменный стол», а biuro = «офис». Слова однокоренные, и в этом ловушка: siedzę przy biurku «сижу за столом», но pracuję w biurze «работаю в офисе». Обеденный стол — stół."
idioms:
  - { pl: "na biurku", ru: "на столе" }
  - { pl: "pod biurkiem", ru: "под столом" }
  - { pl: "siedzieć przy biurku", ru: "сидеть за столом" }
formExamplesSkip:
