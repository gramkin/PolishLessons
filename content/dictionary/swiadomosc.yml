notes:
  - { kind: pronunciation, text: "Форм всего шесть, и одна делает почти всю работу: ŚWIADOMOŚCI — это родительный, дательный и предложный единственного плюс именительный, винительный и родительный множественного. Так устроены женские слова на -ść, уже знакомые по korzyść — korzyści. Запоминать нужно не падежи, а три оставшихся окончания: -ą, -om, -ami, -ach." }
  - { kind: usage, text: "Существительное образовано от ŚWIADOMY, у которого в словаре уже записана краткая форма świadom. Обороты совпадают с русскими почти дословно: STRACIĆ ŚWIADOMOŚĆ — «потерять сознание», ODZYSKAĆ ŚWIADOMOŚĆ — «прийти в себя», MIEĆ ŚWIADOMOŚĆ CZEGOŚ — «осознавать что-то», с родительным падежом." }
collocations:
  - { pl: "stracić świadomość", ru: "потерять сознание" }
  - { pl: "odzyskać świadomość", ru: "прийти в себя" }
  - { pl: "świadomość społeczna", ru: "общественное сознание" }
