  - { pl: "nieświadomość", ru: "бессознательное", relation: antonym }
etymology: "От ŚWIADOMY, из праславянского *sъvědomъ, где корень *věd- «ведать, знать» — тот же, что в русских «ведать» и «сведения». Суффикс -ość отвечает нашему -ость, так что świadomość и «сознание» собраны по-разному: польский от «ведающего», русский от «знающего себя». Из того же гнезда świadek «свидетель» и świadectwo «свидетельство»."
memory: "Шесть форм, и ŚWIADOMOŚCI закрывает шесть падежей — как korzyści. А корень тот же, что в «ведать»."
