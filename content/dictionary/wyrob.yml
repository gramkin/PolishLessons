lemma: "wyrób"
rank: 5971
pos: noun
pron: { cyr: "вы́руп" }
senses:
  - id: product
    ru: "изделие, продукт (часто мн.: wyroby — изделия, продукция)"
    examples:
      - { pl: "On zbierał zabytkowe wyroby ceramiczne.", ru: "Он собирал старинные керамические изделия.", source: { kind: translated, id: 2902540 } }
      - { pl: "Wiele wyrobów importuje się do Turcji z Polski.", ru: "Многие изделия ввозят в Турцию из Польши.", source: { kind: translated, id: 921598 } }
      - { pl: "Sklep sprzedaje wyroby ze skóry.", ru: "Магазин продаёт кожаные изделия.", source: { kind: authored } }
  - id: making
    ru: "изготовление, производство"
    examples:
      - { pl: "Sztuka wyrobu takich drewnianych cebrów zupełnie już zanikła.", ru: "Искусство изготовления таких деревянных вёдер уже совершенно утеряно.", source: { kind: tatoeba, id: 744170 } }
      - { pl: "To ciasta jej wyrobu.", ru: "Это пироги её собственного приготовления.", source: { kind: translated, id: 751580 } }
      - { pl: "Sąsiadka zajmuje się wyrobem świec.", ru: "Соседка занимается изготовлением свечей.", source: { kind: authored } }
notes:
  - { kind: false-friend, text: "WYRÓB — не «выработка» и не «вырубка». Это «изделие» (WYROBY Z DREWNA — изделия из дерева) или «изготовление» (WYRÓB SERA — производство сыра). Вырубка леса — WYCINKA." }
  - { kind: usage, text: "Ó есть только в именительном и винительном: WYRÓB, но WYROBU, WYROBY — как STÓŁ, STOŁU. В значении «изделия» чаще множественное: WYROBY CUKIERNICZE, WYROBY Z METALU. На вывесках WYRÓB WŁASNY — «собственного производства»." }
  - { kind: pronunciation, text: "Конечное B оглушается, Ó читается как «у»: «вы́руп». В остальных формах B звонкое: WYROBU «выро́бу»." }
collocations:
  - { pl: "wyroby ze skóry", ru: "кожаные изделия" }
  - { pl: "wyroby cukiernicze", ru: "кондитерские изделия" }
  - { pl: "wyrób własny", ru: "собственное производство" }
  - { pl: "wyroby tytoniowe", ru: "табачные изделия" }
family:
  - { pl: "wyrobić", ru: "изготовить; выработать", relation: root }
  - { pl: "wyrabiać", ru: "изготавливать; вырабатывать", relation: root }
  - { pl: "robić", ru: "делать", relation: root, id: robic }
synonyms: ["produkt", "artykuł"]
etymology: "От глагола WYROBIĆ «изготовить», в основе — ROBIĆ «делать». Корень тот же, что в русском «работа»."
memory: "Wyrób — то, что вы-роблено, сделано: изделие. Wyroby ze skóry — кожаные изделия. Не вырубка!"
idioms:
  - { pl: "wyrób czekoladopodobny", ru: "«шоколадоподобное изделие» — ирон. о дешёвой подделке (выражение времён ПНР)" }
