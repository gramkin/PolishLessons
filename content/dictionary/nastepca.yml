# review
id: nastepca
format: 2
lemma: "następca"
rank: 5392
pos: noun
pron: { cyr: "насте́мпца" }
senses:
  - id: successor
    ru: "преемник"
    examples:
      - pl: "Dyrektor odchodzi i szuka następcy."
        ru: "Директор уходит и ищет преемника."
        source: { kind: authored }
      - pl: "Jego następca zmienił wszystkie zasady."
        ru: "Его преемник изменил все правила."
        source: { kind: authored }
      - pl: "Był godnym następcą swojego mistrza."
        ru: "Он был достойным преемником своего учителя."
        source: { kind: authored }
  - id: heir
    ru: "наследник (престола)"
    examples:
      - pl: "Książę jest następcą tronu."
        ru: "Принц — наследник престола."
        source: { kind: authored }
      - pl: "Królowa urodziła następcę."
        ru: "Королева родила наследника."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "NASTĘPCA — «преемник», тот, кто следует за кем-то, от NASTĄPIĆ «последовать». Тот же корень в NASTĘPNY «следующий». Наследник имущества — SPADKOBIERCA, а NASTĘPCA TRONU — «наследник престола»." }
  - { kind: usage, text: "Девять форм. Слово мужского рода, но в единственном числе склоняется как женское на -A: NASTĘPCĘ, NASTĘPCĄ, NASTĘPCY. Так же склоняются KIEROWCA, SPRZEDAWCA, OBROŃCA. Во множественном — мужские личные формы: NASTĘPCY, NASTĘPCÓW. Женщина — NASTĘPCZYNI." }
  - { kind: government, text: "Чей преемник — родительный: NASTĘPCA PREZESA. Назначить преемника — WYZNACZYĆ NASTĘPCĘ, винительный. Преемник на посту — NASTĘPCA NA STANOWISKU, NA с местным." }
  - { kind: pronunciation, text: "Читается «насте́мпца», ударение на предпоследнем слоге. Ę перед P звучит «эм», как в NASTĘPNY «насте́мпны»." }
  - { kind: register, text: "Слово нейтральное, слегка официальное: о должностях, бизнесе, монархиях. В спорте и искусстве часто хвалебное: GODNY NASTĘPCA." }
collocations:
  - { pl: "następca tronu", ru: "наследник престола" }
  - { pl: "wyznaczyć następcę", ru: "назначить преемника" }
  - { pl: "godny następca", ru: "достойный преемник" }
family:
  - { pl: "następny", ru: "следующий", relation: root, id: nastepny }
  - { pl: "nastąpić", ru: "последовать, наступить", relation: root, id: nastapic }
  - { pl: "następstwo", ru: "последствие; преемственность", relation: derived }
etymology: "От NASTĘPOWAĆ, NASTĄPIĆ «следовать за кем-то», от STĄPAĆ «ступать». Польские Ą и Ę отвечают русскому «у»: STĄPAĆ — «ступать». Преемник — тот, кто ступает следом."
memory: "Następca — преемник: тот, кто następuje, идёт следом. Читается «насте́мпца». Następca tronu — наследник престола. Następny — следующий."
idioms:
  - { pl: "w następstwie czegoś", ru: "вследствие чего-то" }
