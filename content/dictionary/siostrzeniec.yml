etymology: "От SIOSTRA «сестра»: перед E твёрдое R смягчается в RZ, поэтому TR даёт TRZ. Пара по брату — BRATANEK, от BRAT."
memory: "Siostrzeniec — сын сестры, bratanek — сын брата. Читается «сьостшэ́нец». Siostrzeńca — племянника. Siostrzenica — дочь сестры."
