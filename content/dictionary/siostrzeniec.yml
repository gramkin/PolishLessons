notes:
  - { kind: false-friend, text: "Русское «племянник» по-польски делится надвое: SIOSTRZENIEC — сын сестры, BRATANEK — сын брата. Пара по женской линии — SIOSTRZENICA, «дочь сестры»." }
  - { kind: usage, text: "Одиннадцать форм, мужской род, лицо. Беглое E и N перед C становится Ń: SIOSTRZENIEC, но SIOSTRZEŃCA, SIOSTRZEŃCY. Звательный двойной: книжный SIOSTRZEŃCZE и разговорный SIOSTRZEŃCU." }
  - { kind: government, text: "Чей племянник — родительный: SIOSTRZENIEC MOJEJ ŻONY. Быть чьим-то племянником — BYĆ CZYIMŚ SIOSTRZEŃCEM, творительный." }
  - { kind: pronunciation, text: "Читается «сьостшэ́нец», ударение на предпоследнем слоге. TRZ — «тш». В форме SIOSTRZEŃCA: «сьостшэ́ньца»." }
collocations:
