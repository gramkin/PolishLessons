# review
id: spowodowac
format: 2
lemma: "spowodować"
rank: 1380
pos: verb
aspect: perf
pron: { cyr: "споводо́ваць" }
senses:
  - id: cause
    ru: "вызвать, стать причиной, причинить"
    examples:
      - pl: "Kto spowodował wypadek?"
        ru: "Кто стал причиной аварии?"
        source: { kind: translated, id: 3846778 }
      - pl: "Mała iskra może spowodować wielki pożar."
        ru: "Малая искра может вызвать большой пожар."
        source: { kind: translated, id: 1463268 }
      - pl: "Tajfun spowodował straszliwe szkody."
        ru: "Тайфун вызвал страшный ущерб."
        source: { kind: translated, id: 919233 }
  - id: caused-by
    ru: "быть вызванным (в страдательном обороте)"
    examples:
      - pl: "Jego wczorajsza nieobecność była spowodowana zaziębieniem."
        ru: "Его вчерашнее отсутствие было вызвано простудой."
        source: { kind: translated, id: 951214 }
      - pl: "Jak okiem sięgnąć, wszędzie widać szkody spowodowane trzęsieniem ziemi."
        ru: "Насколько хватает глаз, везде видны разрушения, вызванные землетрясением."
        source: { kind: translated, id: 997616 }
      - pl: "Braki wody są spowodowane pogodą."
        ru: "Нехватка воды вызвана погодой."
        source: { kind: translated, id: 538540 }
notes:
  - { kind: government, text: "spowodować требует винительного падежа: spowodować wypadek «стать причиной аварии»." }
  - { kind: usage, text: "Страдательный оборот строится с przez: spowodowana przez wiewiórkę «вызванная белкой». Причастие spowodowany склоняется как прилагательное." }
  - { kind: usage, text: "Несовершенный вид — powodować. Отглагольное существительное spowodowanie «причинение» звучит канцелярски: spowodowanie wypadku." }
  - { kind: false-friend, text: "Польское powód значит «причина», а не «повод»: z tego powodu «по этой причине». Отсюда и spowodować — «стать причиной»." }
collocations:
  - { pl: "spowodować wypadek", ru: "стать причиной аварии" }
  - { pl: "spowodować szkody", ru: "причинить ущерб" }
  - { pl: "spowodowany przez", ru: "вызванный кем-чем" }
etymology: "Приставка s- + powodować, от powód «причина» (корень тот же, что в wieść, wodzić «вести, водить»). Русское «повод» — то же гнездо, но значения разошлись: польское powód — «причина», русское «повод» — скорее «предлог»."
memory: "spowodować = «вызвать, стать причиной», винительный падеж: spowodować wypadek. Несовершенный вид — powodować, страдательный оборот — spowodowany przez «вызванный кем-чем». Осторожно: powód по-польски «причина», а не «повод»."
idioms:
  - { pl: "spowodować wypadek", ru: "стать причиной аварии" }
  - { pl: "spowodowany przez", ru: "вызванный чем-либо" }
  - { pl: "spowodować szkody", ru: "причинить ущерб" }
formExamplesSkip:
  - { form: "spowodowani", reason: "форма мужского лица требует, чтобы прямым дополнением был человек, а spowodować берёт в дополнение событие или последствие: wypadek, pożar, szkody, opóźnienie. Человека нельзя «вызвать», поэтому spowodowany склоняется только о вещах и событиях: szkody spowodowane burzą, wypadek spowodowany mgłą" }
