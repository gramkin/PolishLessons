etymology: "Отглагольное существительное от PRAĆ, от праславянского корня со значением «бить, колотить»: бельё стирали, колотя его о камень или вальком. Тот же корень был и в русском, глагол «прать», и хотя сам глагол вышел из употребления, его производные живы: «прачка» и «прачечная». Так что польское PRALNIA и русская «прачечная» — одно слово, а польское PRAĆ и русское «стирать» — разные, потому что русский заменил глагол. Исходный образ битья объясняет и разговорное польское значение PRAĆ «колотить, бить кого-то»."
memory: "Корень узнаётся не по глаголу, а по «прачке»: польское prać значит «стирать», а русское «прать» ушло, оставив «прачку» и «прачечную». Польское pralnia и есть «прачечная». Одно слово на два русских: pranie это и «стирка», zrobić pranie, и «бельё», pranie wisi na balkonie. Два переносных оборота совпадают с русскими: pranie pieniędzy «отмывание денег» и pranie mózgu «промывание мозгов». Читается «пра́не», два слога."
