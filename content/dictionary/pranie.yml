notes:
  - { kind: false-friend, text: "Корень этого слова русскому знаком не по глаголу, а по профессии. Польское PRAĆ значит «стирать», и это обычное повседневное слово. В русском тот же корень был, но ушёл: «прать» сохранилось разве что в словарях, зато от него остались «прачка» и «прачечная». То есть польское PRALNIA «прачечная» и русская «прачечная» — одно и то же слово, а вот глаголы разошлись: русский взял «стирать». Увидев PRAĆ, стоит вспомнить «прачку», и смысл станет ясен сразу." }
  - { kind: usage, text: "Это отглагольное существительное от PRAĆ, и у него два совсем бытовых значения. Первое — сам процесс: ZROBIĆ PRANIE значит «постирать», и это самая частая форма. Второе — то, что стирают или уже выстирали, то есть бельё: PRANIE WISI NA BALKONIE «бельё висит на балконе», POSKŁADAĆ PRANIE «сложить бельё». Русский для этих двух вещей берёт два слова, «стирка» и «бельё», а польский обходится одним. Восемь форм, родительный множественного PRAŃ." }
  - { kind: government, text: "Для стирки — предлог DO с родительным: PROSZEK DO PRANIA «стиральный порошок», PŁYN DO PRANIA. Отмывание чего — родительный без предлога: PRANIE PIENIĘDZY «отмывание денег», PRANIE MÓZGU «промывание мозгов». В стирке — предлог W с местным падежом: SKURCZYŁO SIĘ W PRANIU «село при стирке». Глагол PRAĆ управляет винительным: PRAĆ KOSZULE, а в разговорном смысле «бить» требует того же падежа." }
  - { kind: pronunciation, text: "Читается «пра́не», два слога, ударение на первом. Сочетание NIE даёт мягкое «не», где I только знак мягкости, а не отдельный гласный, поэтому слогов два, а не три. В родительном PRANIA слышно «пра́ня». В глаголе PRAĆ конечное Ć мягкое, «прачь», и это не то же самое, что PRACĘ «работу», где C твёрдое. Разница на слух невелика, а смысл меняется полностью." }
  - { kind: register, text: "Слово бытовое и очень частое. Частые обороты: ZROBIĆ PRANIE «постирать», NASTAWIĆ PRANIE «поставить стирку», WYWIESIĆ PRANIE «вывесить бельё», PROSZEK DO PRANIA «стиральный порошок». В переносных значениях слово газетное: PRANIE PIENIĘDZY «отмывание денег» и PRANIE MÓZGU «промывание мозгов», оба совпадают с русскими оборотами полностью. Производные: PRALKA «стиральная машина», PRALNIA «прачечная»." }
