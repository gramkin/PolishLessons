etymology: "Из немецкого Zucker, а оно из итальянского zucchero, из арабского sukkar, восходящего к санскритскому śarkarā «крупинки, песок». Русское «сахар» пришло из того же арабского корня, но через греческое sakkharon, поэтому слова так разошлись. Отсюда cukierek и cukrzyca."
memory: "cukier — «сахар», и на нём сразу два правила: беглое e выпадает (cukru), а в предложном r даёт rz (w cukrze). Корень тот же, что у «сахара», только польский взял его через немецкий Zucker, а русский через греческий."
idioms:
