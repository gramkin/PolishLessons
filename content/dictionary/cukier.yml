notes:
  - { kind: usage, text: "ДВА ЗНАКОМЫХ ПРАВИЛА В ОДНОМ КОРОТКОМ СЛОВЕ. Первое: беглое e выпадает, cukier, но CUKRU, cukrem, cukrowi. Второе: в предложном r переходит в rz — w CUKRZE. Так же ведут себя wiatr → wietrze и minister → ministrze, только там ещё и -owie во множественном." }
  - { kind: false-friend, text: "Слова в двух языках не похожи, потому что пришли разными путями из одного источника. Исходник — арабское sukkar, а то из санскритского śarkarā «песок, крупинки». В польский слово попало через немецкое Zucker, а в русский через греческое sakkharon, откуда «сахар». Общий предок, разные посредники." }
  - { kind: pronunciation, text: "Два слога, ударение на первом: CU-kier. Польское c читается как ц, ki как мягкое кє: «цу́кєр». В формах без e звучит «цу́кру», «цу́крэм», а предложный — «цу́кшэ», с оглушением rz." }
