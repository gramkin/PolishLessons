# review
id: policyjny
format: 2
lemma: "policyjny"
rank: 2575
pos: adj
pron: { cyr: "полицы́йны" }
senses:
  - id: of-police
    ru: "полицейский (относящийся к полиции)"
    examples:
      - pl: "Policyjne psy szukały narkotyków na lotnisku."
        ru: "Полицейские собаки искали наркотики в аэропорту."
        source: { kind: translated, id: 6207831 }
      - pl: "Radiowóz policyjny stanął przed bramą."
        ru: "Полицейская машина остановилась перед воротами."
        source: { kind: authored }
      - pl: "Prowadzą policyjne śledztwo."
        ru: "Ведётся полицейское расследование."
        source: { kind: authored }
  - id: curfew-state
    ru: "в устойчивых оборотах: комендантский час, полицейское государство"
    examples:
      - pl: "W mieście wprowadzono godzinę policyjną."
        ru: "В городе ввели комендантский час."
        source: { kind: authored }
      - pl: "Nazwali to państwem policyjnym."
        ru: "Это назвали полицейским государством."
        source: { kind: authored }
notes:
  - { kind: government, text: "Относительное прилагательное от policja: policyjny, policyjna, policyjne. Степеней сравнения не имеет — называет разряд, а не признак." }
  - { kind: false-friend, text: "godzina policyjna значит «комендантский час», а не «полицейский час». Это один из самых частых промахов при переводе." }
  - { kind: usage, text: "Устойчивое państwo policyjne «полицейское государство» совпадает с русским." }
  - { kind: usage, text: "О самом сотруднике говорят policjant, а не policyjny: прилагательное определяет вещи и действия, а не людей по профессии." }
collocations:
  - { pl: "godzina policyjna", ru: "комендантский час" }
  - { pl: "państwo policyjne", ru: "полицейское государство" }
  - { pl: "radiowóz policyjny", ru: "полицейская машина" }
family:
  - { pl: "policja", ru: "полиция", relation: root, id: policja }
  - { pl: "policjant", ru: "полицейский (человек)", relation: derived, id: policjant }
etymology: "От policja с суффиксом -ny. Само policja пришло через латинское politia из греческого politeia «государственное устройство» — тот же путь, что у русского «полиция»."
memory: "policyjny — «полицейский» о вещах и действиях; о человеке говорят policjant. Главная ловушка: godzina policyjna это «комендантский час»."
idioms:
  - { pl: "godzina policyjna", ru: "комендантский час" }
