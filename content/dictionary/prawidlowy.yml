# review
id: prawidlowy
format: 2
lemma: "prawidłowy"
rank: 4153
pos: adj
pron: { cyr: "правидуо́вы" }
senses:
  - id: correct
    ru: "правильный, верный"
    examples:
      - pl: "To prawidłowa odpowiedź."
        ru: "Это правильный ответ."
        source: { kind: authored }
      - pl: "Zaznacz prawidłowe zdanie."
        ru: "Отметь правильное предложение."
        source: { kind: authored }
      - pl: "Wpisz prawidłowy kod pocztowy."
        ru: "Введи правильный почтовый индекс."
        source: { kind: authored }
  - id: normal
    ru: "нормальный, соответствующий норме"
    examples:
      - pl: "Ciśnienie jest prawidłowe."
        ru: "Давление нормальное."
        source: { kind: authored }
      - pl: "Dziecko rozwija się w prawidłowym tempie."
        ru: "Ребёнок развивается в нормальном темпе."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "PRAWIDŁOWY — «правильный» по правилу: PRAWIDŁOWA ODPOWIEDŹ, PRAWIDŁOWY WYNIK. Русское «правый» в смысле «правота» — RACJA: MASZ RACJĘ. А польское PRAWY — «правый» по стороне и «честный»: PRAWY CZŁOWIEK. Слово «правильный» о человеке, «положительный» — PORZĄDNY, а не PRAWIDŁOWY." }
  - { kind: usage, text: "Десять форм без степеней и без формы для мужчин-людей: о людях PRAWIDŁOWY не говорят. Синоним — POPRAWNY, «корректный»: POPRAWNA ODPOWIEDŹ. В медицине PRAWIDŁOWY — «в норме»: WYNIKI SĄ PRAWIDŁOWE. Наречие — PRAWIDŁOWO." }
  - { kind: government, text: "Сказуемым — в именительном: ODPOWIEDŹ JEST PRAWIDŁOWA. В сравнении с правилом — ZGODNY Z, а не PRAWIDŁOWY: ZGODNY Z PRZEPISAMI." }
  - { kind: pronunciation, text: "Читается «правидуо́вы», четыре слога, ударение на предпоследнем. Ł звучит как короткое «у», W перед гласной звонкое. Наречие PRAWIDŁOWO — «правидуо́во»." }
  - { kind: register, text: "Нейтральное слово школьных тестов, бланков и анализов. В разговоре чаще DOBRY: DOBRA ODPOWIEDŹ, или DOBRZE: ZROBIŁEŚ TO DOBRZE." }
collocations:
  - { pl: "prawidłowa odpowiedź", ru: "правильный ответ" }
  - { pl: "prawidłowy wynik", ru: "нормальный результат (анализа)" }
  - { pl: "prawidłowe ciśnienie", ru: "нормальное давление" }
family:
  - { pl: "prawidło", ru: "правило; колодка для обуви", relation: root }
  - { pl: "prawidłowo", ru: "правильно", relation: derived }
  - { pl: "nieprawidłowy", ru: "неправильный, ненормальный", relation: derived }
etymology: "От PRAWIDŁO, старого слова для «правило» и «колодки», по которой выпрямляют обувь. Корень PRAW- тот же, что в русском «правило», «править», «право»."
memory: "Prawidłowy — правильный, в норме. Prawidłowa odpowiedź, ciśnienie jest prawidłowe. От prawidło — «правило». Читается «правидуо́вы»."
idioms:
  - { pl: "w prawidłowy sposób", ru: "как положено" }
