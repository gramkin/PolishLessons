notes:
  - { kind: false-friend, text: "Слово прямо отвечает русскому «пот», от праславянского *potъ. Но есть ловушка в одной форме: творительный падеж potem совпадает по написанию с наречием potem «потом, затем», а это совсем другое слово, со своей отдельной словарной статьёй. В живой речи их различает контекст: mokry potem «мокрый от пота», но a co potem? «а что потом?»." }
  - { kind: usage, text: "Предложный падеж — pocie, с чередованием t → ć: w pocie czoła. Множественное poty значит не «много пота», а «потливость, испарина»: zimne poty, nocne poty." }
  - { kind: government, text: "Запомните управление: oblewać się potem (творительный), mokry od potu (родительный с предлогом od), w pocie czoła (предложный). Русские соответствия строятся теми же предлогами." }
