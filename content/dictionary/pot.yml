etymology: "Праславянское *potъ, от того же корня, что глагол *potiti «потеть». Русское «пот» — прямой родственник, и оборот w pocie czoła дословно отвечает русскому «в поте лица». Из того же гнезда pocić się «потеть» и spocony «вспотевший»."
memory: "pot — русское «пот», слово в слово. Две вещи на заметку: предложный pocie (t → ć), и форма potem «потом» по написанию совпадает с наречием, у которого своя карточка."
