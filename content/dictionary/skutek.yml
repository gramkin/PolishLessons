# review
id: skutek
format: 2
lemma: "skutek"
rank: 2131
pos: noun
pron: { cyr: "ску́тэк" }
senses:
  - id: result
    ru: "последствие, результат"
    examples:
      - pl: "Opowiedziała o skutkach swojej nieostrożności."
        ru: "Она рассказала о результате своей беспечности."
        source: { kind: tatoeba, id: 640297 }
      - pl: "Jego uwagi odniosły skutek przeciwny."
        ru: "Его замечания возымели обратное действие."
        source: { kind: translated, id: 352747 }
      - pl: "Skutki są odwracalne."
        ru: "Последствия обратимы."
        source: { kind: translated, id: 12239953 }
  - id: side-effect
    ru: "действие, эффект (в том числе побочный)"
    examples:
      - pl: "To lekarstwo nie ma szkodliwych skutków ubocznych."
        ru: "У этого лекарства нет вредных побочных действий."
        source: { kind: tatoeba, id: 980247 }
      - pl: "Jakie są skutki uboczne?"
        ru: "Какие побочные эффекты?"
        source: { kind: translated, id: 8771229 }
notes:
  - { kind: government, text: "Два устойчивых оборота с разными предлогами: na skutek czegoś «вследствие чего-л.» (родительный) и bez skutku «безрезультатно»." }
  - { kind: usage, text: "skutki uboczne «побочные эффекты» — стандартный медицинский термин." }
  - { kind: false-friend, text: "Не «скука» и не «сутки». Корень skutek от kuć? Нет: слово родственно глаголу skutkować «действовать, давать эффект»." }
  - { kind: usage, text: "dojść do skutku «состояться, осуществиться» — о планах и переговорах." }
collocations:
  - { pl: "na skutek", ru: "вследствие" }
  - { pl: "bez skutku", ru: "безрезультатно" }
  - { pl: "skutki uboczne", ru: "побочные эффекты" }
etymology: "От skutkować «действовать, давать эффект», праславянское *skutъ «край, подол» в переносном развитии «итог»."
memory: "skutek — «последствие, результат». Три оборота стоит выучить целиком: na skutek «вследствие», bez skutku «безрезультатно», skutki uboczne «побочные эффекты»."
idioms:
  - { pl: "na skutek", ru: "вследствие" }
  - { pl: "bez skutku", ru: "безрезультатно" }
  - { pl: "dojść do skutku", ru: "состояться" }
