# review
id: moralny
format: 2
lemma: "moralny"
rank: 4550
pos: adj
pron: { cyr: "мора́льны" }
senses:
  - id: moral
    ru: "моральный, нравственный"
    examples:
      - pl: "To kwestia moralna, nie prawna."
        ru: "Это вопрос моральный, а не юридический."
        source: { kind: authored }
      - pl: "Jest bardzo moralnym człowiekiem."
        ru: "Он очень нравственный человек."
        source: { kind: authored }
      - pl: "Był najmoralniejszy z całej rodziny."
        ru: "Он был самым нравственным во всей семье."
        source: { kind: authored }
  - id: psychological-moral
    ru: "моральный (о поддержке, ущербе)"
    examples:
      - pl: "Dostał od nas wsparcie moralne."
        ru: "Он получил от нас моральную поддержку."
        source: { kind: authored }
      - pl: "Domaga się odszkodowania za szkody moralne."
        ru: "Он требует компенсации морального вреда."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Совпадение с русским «моральный» почти полное. Различие в одном термине: «моральный вред» по-польски чаще KRZYWDA, а не SZKODA MORALNA: ZADOŚĆUCZYNIENIE ZA KRZYWDĘ, «компенсация морального вреда». И ещё: MORAŁ — «мораль басни», а MORALNOŚĆ — «нравственность»." }
  - { kind: usage, text: "Полная парадигма: MORALNY, MORALNIEJSZY, NAJMORALNIEJSZY. Степени редки, чаще BARDZIEJ MORALNY. Мужское-личное: MORALNI, MORALNIEJSI, NAJMORALNIEJSI." }
  - { kind: government, text: "Ставится после существительного в терминах: WSPARCIE MORALNE, OBOWIĄZEK MORALNY, AUTORYTET MORALNY. Перед — в оценке человека: MORALNY CZŁOWIEK. Моральный долг — MORALNY OBOWIĄZEK." }
  - { kind: pronunciation, text: "Читается «мора́льны», три слога, ударение на предпоследнем. O чёткое, без аканья: «мо-ра́ль-ны». L перед N мягкая. В MORALNIEJSZY: «моральне́йшы»." }
  - { kind: register, text: "Нейтральное, книжное слово, частое в философии, праве и публицистике. AUTORYTET MORALNY — «моральный авторитет», о человеке, которому верят, как Иоанну Павлу II в Польше." }
collocations:
  - { pl: "wsparcie moralne", ru: "моральная поддержка" }
  - { pl: "obowiązek moralny", ru: "моральный долг" }
  - { pl: "autorytet moralny", ru: "моральный авторитет" }
family:
  - { pl: "moralność", ru: "нравственность", relation: derived }
  - { pl: "morał", ru: "мораль (басни)", relation: root }
  - { pl: "niemoralny", ru: "безнравственный", relation: derived }
etymology: "Из латинского moralis, «касающийся нравов», от mos, moris, «обычай, нрав». Цицерон перевёл им греческое ēthikós. Польское и русское слова пришли из латыни одним путём."
memory: "Moralny — моральный, нравственный: wsparcie moralne, obowiązek moralny. Morał — мораль басни. Moralniejszy, najmoralniejszy. Читается «мора́льны»."
idioms:
  - { pl: "autorytet moralny", ru: "моральный авторитет" }
