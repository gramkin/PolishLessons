notes:
  - { kind: false-friend, text: "Корень PŁYW- это русское «плыв», от «плыть». Поэтому WPŁYWAĆ буквально «вплывать», а существительное WPŁYW — «вплыв». Но значат они «влиять» и «влияние», и вот почему это интересно: русское «влияние» построено от «лить», от «вливать», а польское — от «плыть». Образ в обоих языках жидкостный, но жидкость ведёт себя по-разному: русский её вливает, поляк в неё вплывает. Запомнив это, учащийся больше не примет WPŁYW за «вплыв» или «наплыв», а WPŁYWOWY за «плавучий»: WPŁYWOWY CZŁOWIEK это «влиятельный человек». Прямое значение «вплывать» у глагола тоже есть, но только о судах и реках." }
  - { kind: government, text: "На что влиять — предлог NA с винительным: WPŁYWAĆ NA NASTRÓJ, NA DECYZJĘ, NA WYNIK. Русское управление точно такое же, «влиять на что», с винительным, так что здесь ошибиться трудно. Куда впадать или входить — предлог DO с родительным: WPŁYWAĆ DO BAŁTYKU, DO PORTU, и русский здесь расходится, потому что говорит «впадать В море» с винительным. Прямого дополнения глагол не принимает вовсе, он непереходный. Устойчивое POD WPŁYWEM с творительным значит «под влиянием»: POD WPŁYWEM ALKOHOLU, POD WPŁYWEM CHWILI." }
  - { kind: usage, text: "Несовершенный вид, непереходный, пятьдесят две формы: сорок две от глагола и десять от действительного причастия WPŁYWAJĄCY. Страдательного причастия нет: влияют на что-то, а не что-то, и винительного дополнения без предлога у глагола не бывает. Совершенная пара — WPŁYNĄĆ, с другой основой: WPŁYWA- в несовершенном, WPŁYN- в совершенном, сравните WPŁYWAM и WPŁYNĘ. Существительное WPŁYW «влияние» имеет и второе значение во множественном числе: WPŁYWY это «поступления, доходы», WPŁYWY Z PODATKÓW «налоговые поступления». Прилагательное WPŁYWOWY — «влиятельный»." }
  - { kind: pronunciation, text: "Читается «фпу́ываць», ударение на первом слоге. Начальное W перед глухим P оглушается и звучит «ф»: не «впуывать», а «фпуываць». Буква Ł это «у» неслоговое, как английское W, поэтому PŁY звучит «пуы», а не «пли»: это самая частая ошибка русскоязычных в таких словах. Буква Y это «ы». Конечное Ć — мягкое «ць». В совершенном виде WPŁYNĄĆ появляется носовое Ą: «фпуыно́нць». В существительном WPŁYW конечное W тоже оглушается: «фпуыф»." }
