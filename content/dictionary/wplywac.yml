etymology: "Из приставки W- и корня *plyti, *plynǫti «плыть, течь», того же, что русские «плыть», «плавать», «поток». Буквальное значение — «вплывать», и оно сохранилось о реках и судах. Переносное значение «влиять» развилось из образа жидкости, которая проникает внутрь и меняет содержимое, и русский пришёл к тому же через другой глагол: «влияние» от «вливать», от «лить». Два языка выбрали разные жидкостные глаголы для одной метафоры, и потому слова не похожи, хотя идея одна. Заметно это и в производных: польское WPŁYWY во множественном значит «поступления», то есть то, что втекает в казну, а русский для этого взял «поступление» от «ступать». Приставка W- отвечает русскому «в-» буквально, так что разбирается слово по частям без остатка: W- плюс «плыв» даёт «вплыв», а читать его надо как «влияние»."
memory: "Корень pływ- = «плыв», от «плыть», и wpływ буквально «вплыв» — но значит «влияние». Разница образов: русское «влияние» от «лить», польское от «плыть». Отсюда wpływowy «влиятельный», pod wpływem «под влиянием», wpływy «поступления, доходы». Управление: на что влиять — na + винительный, как в русском; но впадать и входить — do + родительный, тогда как русский говорит «впадает в море». Непереходный, 52 формы, страдательного причастия нет. И звук: ł это «у», поэтому wpływać звучит «фпу́ываць»."
