notes:
  - { kind: false-friend, text: "Названия у колодца в двух языках разные, и причина поучительна. Польская STUDNIA идёт от корня «студить»: колодец это «то, где холодно», и русский этот корень помнит в «стуже», «студёном» и «остудить». А само сооружение русский назвал по-другому, «колодцем», от «колоды», то есть от деревянного сруба. Польский назвал по воде, русский — по дереву." }
  - { kind: usage, text: "Десять форм, женский род, мягкая основа на -NIA, как у LATARNIA и PRALNIA. Родительный, дательный и местный единственного числа совпадают: все три дают STUDNI, и та же форма служит родительным множественного. Рядом есть старый вариант STUDZIEN, где D переходит в DZ, и он встречается в книгах и в документах." }
  - { kind: government, text: "Вода из колодца — WODA ZE STUDNI, предлог ZE с родительным, и заметьте, что перед скоплением согласных поляк говорит ZE, а не Z. Копать колодец — KOPAĆ STUDNIĘ, винительный без предлога. В колодце — W STUDNI, местный падеж. Над колодцем — NAD STUDNIĄ, творительный." }
  - { kind: pronunciation, text: "Читается «сту́дня», два слога, ударение на первом. Сочетание STU даёт «сту», а DNIA — «дня», с мягким «д» и «н» слитно. Никаких трудных мест в слове нет. В форме STUDZIEN сочетание DZIE даёт «дзе»: «сту́дзен», и это единственная форма, где основа меняется." }
  - { kind: register, text: "Слово нейтральное и деревенское по духу: STUDNIA KOPANA это колодец, выкопанный вручную, STUDNIA GŁĘBINOWA — пробуренный глубинный. В городе так называют и технический колодец, люк с крышкой, но чаще его зовут STUDZIENKA. Оборот STUDNIA BEZ DNA значит то же, что наша «бездонная бочка», только поляк видит здесь колодец, а мы бочку." }
