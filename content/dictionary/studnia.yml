etymology: "От праславянского корня со значением «холод», того же, что в русских «стужа», «студёный» и «студить». Колодец назвали по главному его свойству: там холодно и вода холодная. Русский этот корень сохранил в словах о холоде, а само сооружение назвал «колодцем», от «колоды», по деревянному срубу. Так два языка увидели в одном предмете разное: поляк — холод, русский — дерево."
memory: "Колодец, и корень в нём наш, только ушедший в другую сторону: studnia от того же корня, что «стужа» и «студить», то есть «место, где холодно». А русский назвал колодец по срубу, от «колоды». Читается «сту́дня». Родительный, дательный и местный единственного совпадают в studni. И запомните studnia bez dna — это наша «бездонная бочка», только у поляка колодец."
idioms:
  - { pl: "studnia bez dna", ru: "бездонная бочка" }
