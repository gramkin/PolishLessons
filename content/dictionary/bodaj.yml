    ru: "хотя бы (bodaj że)"
    examples:
      - pl: "Daj mi bodaj chwilę."
        ru: "Дай мне хотя бы минуту."
        source: { kind: authored }
      - pl: "Powiedz bodaj słowo."
        ru: "Скажи хотя бы слово."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Чаще всего смягчает превосходную степень: bodaj najlepszy «пожалуй, лучший». Говорящий не берёт на себя полной ответственности за оценку." }
  - { kind: usage, text: "Второе значение — «хотя бы», с оттенком просьбы о малом." }
  - { kind: false-friend, text: "Из bogdaj, стяжения оборота «дай Бог». В старых текстах встречается как пожелание или проклятие: bodaj cię!" }
