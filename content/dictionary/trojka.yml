# review
id: trojka
format: 2
lemma: "trójka"
rank: 1941
pos: noun
pron: { cyr: "тру́йка" }
senses:
  - id: three-people
    ru: "трое, троица (о людях)"
    examples:
      - pl: "Mam trójkę dzieci."
        ru: "У меня трое детей."
        source: { kind: translated, id: 3929677 }
      - pl: "Tom ma trójkę dzieci."
        ru: "У Тома трое детей."
        source: { kind: translated, id: 4829988 }
      - pl: "Cała trójka była ranna."
        ru: "Все трое были ранены."
        source: { kind: translated, id: 10599122 }
      - pl: "Ta trójka to jego córki."
        ru: "Эти трое — его дочери."
        source: { kind: translated, id: 2120198 }
      - pl: "Trójka dzieci bawi się w parku."
        ru: "Трое детей играют в парке."
        source: { kind: translated, id: 7558740 }
      - pl: "Tom jest ojcem trójki dzieci."
        ru: "Том — отец троих детей."
        source: { kind: translated, id: 1501947 }
  - id: number-three
    ru: "тройка: цифра, номер, школьная оценка"
    examples:
      - pl: "Dokąd kursuje tramwaj trójka?"
        ru: "Куда идёт трамвай номер три?"
        source: { kind: tatoeba, id: 10138176 }
      - pl: "Dlaczego dostałem trójkę?"
        ru: "Почему я получил тройку?"
        source: { kind: translated, id: 8539888 }
      - pl: "Mike jest najwyższy z całej trójki."
        ru: "Майк самый высокий из всех троих."
        source: { kind: translated, id: 898828 }
notes:
  - { kind: usage, text: "Главное употребление — счёт людей: trójka dzieci «трое детей», с родительным падежом. Это обычный способ сказать «трое» о смешанной или детской группе." }
  - { kind: usage, text: "Второе значение — школьная оценка «удовлетворительно», третье — номер маршрута: tramwaj trójka «трамвай номер три»." }
  - { kind: usage, text: "Рядом с карточками trzy «три» и trzeci «третий»: trójka — существительное, а не числительное." }
  - { kind: government, text: "ó держится во всём склонении: trójka, trójki, trójce, trójek. Гласная вставляется только в родительном множественного, но ó не меняется." }
  - { kind: usage, text: "Слово покрывает сразу несколько вещей: троих людей (szli trójkami), школьную оценку «три» (trójka z matematyki) и номер маршрута (pojechał trójką)." }
collocations:
  - { pl: "trójka dzieci", ru: "трое детей" }
  - { pl: "z tej trójki", ru: "из этих троих" }
  - { pl: "dostać trójkę", ru: "получить тройку" }
etymology: "От trzy «три», праславянское *troje. Русская «тройка» образована от того же корня и тем же суффиксом, но в польском слово гораздо чаще значит просто «трое»."
memory: "trójka — прежде всего «трое»: trójka dzieci «трое детей». И только потом «тройка» как оценка или номер маршрута."
idioms:
  - { pl: "trójka dzieci", ru: "трое детей" }
  - { pl: "dostać trójkę", ru: "получить тройку" }
  - { pl: "tramwaj trójka", ru: "трамвай номер три" }
formExamplesSkip:
