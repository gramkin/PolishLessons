notes:
  - { kind: false-friend, text: "Корень обманывает, и сильно. Польское WIELKI — это обычное повседневное «большой»: WIELKI DOM значит просто «большой дом», без всякой торжественности. Русское «великий» так не употребляется, оно всегда о величии. Отсюда и двойственность существительного: WIELKOŚĆ значит и «размер, величина», и «величие», и первое значение в живой речи гораздо частее. Русский развёл эти смыслы по двум словам, «величина» и «величие», так что при переводе нужно каждый раз решать, о чём речь. А русскому «великий» в польском отвечает WIELKI тоже, но чаще WSPANIAŁY или WYBITNY." }
  - { kind: pronunciation, text: "Читается «ве́лькосьць», с ударением на первом слоге, потому что слогов всего два. Конечное сочетание ść — то же мягкое «сьць», что в PAŚĆ и SAMOTNOŚĆ. Буква l здесь твёрдая, но перед k смягчается на слух до «ль». В косвенных падежах WIELKOŚCI звучит «ве́лькосьци», и ударение остаётся на первом слоге, хотя слогов стало три: предпоследним оказывается KOŚ." }
  - { kind: usage, text: "Суффикс -OŚĆ тот же, что в SAMOTNOŚĆ, и отвечает русскому «-ость»: от прилагательного WIELKI получается отвлечённое существительное женского рода. В значении размера слово употребляется и в единственном числе, и во множественном: WIELKOŚCI BUTÓW, WIELKOŚCI PLIKÓW. В значении величия множественное число почти не встречается. Готовые сочетания стоит заучить: W NATURALNEJ WIELKOŚCI «в натуральную величину», WIELKOŚĆ BUTA «размер обуви», RZĄD WIELKOŚCI «порядок величины»." }
  - { kind: government, text: "Чего размер — родительный падеж без предлога: WIELKOŚĆ POKOJU, WIELKOŚĆ PLIKU, WIELKOŚĆ BUTA. В каком размере — предлог W с предложным: W NATURALNEJ WIELKOŚCI. Родительный множественного — WIELKOŚCI, то есть совпадает с родительным единственного, и различать их приходится по согласованию: TEJ WIELKOŚCI против TYCH WIELKOŚCI. Это обычная черта существительных женского рода на -ŚĆ." }
