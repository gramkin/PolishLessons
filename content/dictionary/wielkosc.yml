etymology: "От прилагательного WIELKI, из праславянского *velikъ, откуда и русское «великий». Суффикс -OŚĆ продолжает праславянское *-ostь и отвечает русскому «-ость», образуя отвлечённые существительные женского рода: так же устроены SAMOTNOŚĆ, WOLNOŚĆ, RADOŚĆ. Любопытнее судьба корня. В русском «великий» сузилось до высокой оценки, а обычное «большой» взяло другое слово; польский же оставил WIELKI при обоих смыслах и потому получил существительное, которое значит сразу и измеримый размер, и неизмеримое величие. Одно слово там, где русскому нужны два."
memory: "Суффикс -OŚĆ как русское «-ость». Но корень шире: wielki — это обычное «большой», не только «великий». Поэтому wielkość — и «размер», и «величие», чаще первое. Читается «ве́лькосьць», ść как в paść. Размер обуви — wielkość buta."
