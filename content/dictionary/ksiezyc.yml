notes:
  - { kind: false-friend, text: "Ключевое отличие от русского: księżyc — только «луна» на небе, а «месяц» как отрезок времени — это miesiąc. Русское «месяц» покрывает оба смысла, польский их разводит." }
  - { kind: usage, text: "Мужской неодушевлённый: родительный księżyca, предложный na księżycu." }
  - { kind: usage, text: "С прописной буквы, когда речь о спутнике Земли как небесном теле (Księżyc), со строчной — в остальных случаях. В корпусе встречаются оба написания." }
  - { kind: usage, text: "Во множественном числе — «спутники» любой планеты: Mars ma dwa księżyce «У Марса два спутника»." }
collocations:
  - { pl: "pełnia księżyca", ru: "полнолуние" }
  - { pl: "na księżycu", ru: "на луне" }
  - { pl: "zaćmienie księżyca", ru: "лунное затмение" }
etymology: "Уменьшительное от książę «князь»: луну представляли молодым князем при короле-солнце. Русское «месяц» устроено совсем иначе, поэтому родства здесь нет."
memory: "księżyc — «луна», и главное — не путать с miesiąc «месяц (срок)». Русское «месяц» значит и то и другое, польский разводит: Księżyc świeci, но miesiąc trwa. Предложный — na księżycu."
idioms:
