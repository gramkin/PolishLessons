# review
id: zarobic
format: 2
lemma: "zarobić"
rank: 1520
pos: verb
aspect: perf
pron: { cyr: "заро́биць" }
senses:
  - id: earn
    ru: "заработать (деньги)"
    examples:
      - pl: "Chcę zarobić więcej pieniędzy."
        ru: "Я хочу заработать больше денег."
        source: { kind: tatoeba, id: 6328332 }
      - pl: "Chcesz zarobić dużo pieniędzy?"
        ru: "Хочешь заработать много денег?"
        source: { kind: translated, id: 11264394 }
      - pl: "Zrobi wszystko, by zarobić pieniądze."
        ru: "Он сделает всё, чтобы заработать деньги."
        source: { kind: tatoeba, id: 2176456 }
  - id: earned
    ru: "заработать (о сумме, о прибыли)"
    examples:
      - pl: "Zarobił dużo pieniędzy w Nowym Jorku i wrócił do rodzinnego miasteczka."
        ru: "Он заработал много денег в Нью-Йорке и вернулся в родной городок."
        source: { kind: translated, id: 723981 }
      - pl: "Obliczyła, że zarobiła 1500 dolarów."
        ru: "Она подсчитала, что заработала 1500 долларов."
        source: { kind: translated, id: 914972 }
      - pl: "Dopóki nie pracujesz, nic nie zarobisz."
        ru: "Пока не работаешь, ничего не заработаешь."
        source: { kind: translated, id: 2987282 }
notes:
  - { kind: usage, text: "Мужско-личной формы zarobieni не бывает: зарабатывают деньги, сумму, премию, а не людей, поэтому она оставлена без примеров. Причастие живёт при вещах: zarobione pieniądze «заработанные деньги», pensja zarobiona uczciwie." }
  - { kind: government, text: "Требует винительного падежа: zarobić pieniądze «заработать деньги», zarobić dużo «заработать много»." }
  - { kind: usage, text: "Несовершенный вид — zarabiać. Существительное zarobek значит «заработок», zarobki — «заработки, доходы»." }
  - { kind: false-friend, text: "Причастие zarobiony значит не только «заработанный», но и разговорное «замотанный, зашивающийся»: Zarobiony jestem «Я зашиваюсь»." }
  - { kind: usage, text: "Образовано от robić «делать» с приставкой za-, как русское «заработать» от «работать»." }
collocations:
  - { pl: "zarobić pieniądze", ru: "заработать деньги" }
  - { pl: "zarobić na życie", ru: "заработать на жизнь" }
  - { pl: "ile zarobili", ru: "сколько они заработали" }
etymology: "Приставка za- + robić «делать», праславянское *robiti. Русское «заработать» построено от «работать», и приставка та же: совпадает и строение, и значение."
memory: "zarobić = «заработать», винительный падеж: zarobić pieniądze. Несовершенный вид — zarabiać, существительное — zarobek «заработок». Осторожно: zarobiony разговорно значит «зашивающийся, занятый по горло»."
idioms:
  - { pl: "zarobić pieniądze", ru: "заработать деньги" }
  - { pl: "zarobić na życie", ru: "заработать на жизнь" }
  - { pl: "zarobiony jestem", ru: "я зашиваюсь" }
formExamplesSkip:
  - { form: "zarobieni", reason: "мужско-личной формы не бывает: зарабатывают деньги, сумму или премию, а не людей" }
