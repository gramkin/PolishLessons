# review
id: chodzic
format: 2
lemma: "chodzić"
rank: 66
pos: verb
aspect: imperf
pron: { cyr: "хо́дзиць" }
senses:
  - id: walk
    ru: "ходить (регулярно, туда-сюда)"
    examples:
      - pl: "Zawsze chodzę piechotą."
        ru: "Я всегда хожу пешком."
        source: { kind: tatoeba, id: 597670 }
      - pl: "Czy Tom może chodzić?"
        ru: "Том может ходить?"
        source: { kind: tatoeba, id: 2405976 }
      - pl: "Chłopiec nie chodził do kościoła."
        ru: "Мальчик не ходил в церковь."
        source: { kind: tatoeba, id: 11848010 }
  - id: be-about
    ru: "chodzi o… — речь идёт о…; работать (о механизме)"
    examples:
      - pl: "O co chodzi?"
        ru: "В чём дело?"
        source: { kind: tatoeba, id: 8608378 }
      - pl: "Zegar nie chodzi."
        ru: "Часы не работают."
        source: { kind: tatoeba, id: 357835 }
notes:
  - { kind: usage, text: "Пара с iść: chodzić — регулярное или разнонаправленное движение, iść — сейчас и в одну сторону. Chodzę do szkoły «хожу в школу», Idę do szkoły «иду в школу»." }
  - { kind: usage, text: "Безличное chodzi o… значит «речь идёт о…»: O co chodzi? «В чём дело?»." }
collocations:
  - { pl: "o co chodzi?", ru: "в чём дело?" }
  - { pl: "chodzić do szkoły", ru: "ходить в школу" }
  - { pl: "chodź tu", ru: "иди сюда" }
etymology: "Праславянское *choditi — то же слово, что русское «ходить»."
memory: "Пара к iść работает как в русском: chodzić — регулярно и туда-сюда, iść — сейчас и в одну сторону. Сверх того запомните два оборота: O co chodzi? «В чём дело?» и Chodź! «Иди сюда!»."
idioms:
  - { pl: "o co chodzi?", ru: "в чём дело?" }
  - { pl: "chodząca encyklopedia", ru: "ходячая энциклопедия" }
  - { pl: "chodzić na rzęsach", ru: "падать с ног от усталости" }
