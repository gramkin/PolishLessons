# review
id: kwiatek
format: 2
lemma: "kwiatek"
rank: 5046
pos: noun
pron: { cyr: "квя́тэк" }
senses:
  - id: flower
    ru: "цветок, цветочек"
    examples:
      - pl: "Dziecko zerwało kwiatek dla mamy."
        ru: "Ребёнок сорвал цветочек для мамы."
        source: { kind: authored }
      - pl: "Na parapecie stoi kwiatek w doniczce."
        ru: "На подоконнике стоит цветок в горшке."
        source: { kind: authored }
      - pl: "Kupił jej kwiatka na imieniny."
        ru: "Он купил ей цветок на именины."
        source: { kind: authored }
  - id: fine-mess
    ru: "хорошенькое дело (ирон., ŁADNE KWIATKI)"
    examples:
      - pl: "Ładne kwiatki, nikt nie zapłacił rachunku!"
        ru: "Хорошенькое дело, никто не оплатил счёт!"
        source: { kind: authored }
      - pl: "Ładne mi kwiatki!"
        ru: "Вот так номер!"
        source: { kind: authored }
notes:
  - { kind: usage, text: "Десять форм, мужской род. Беглое E: KWIATEK, но KWIATKA. В винительном две формы, KWIATEK и разговорная KWIATKA: KUPIĆ KWIATKA, как ZJEŚĆ BANANA. В быту KWIATEK — обычное слово для комнатного или садового цветка, без особой ласковости: PODLEWAĆ KWIATKI — поливать цветы." }
  - { kind: false-friend, text: "Главная находка в гнезде — KWIECIEŃ, «апрель»: месяц, когда всё цветёт. Магазин цветов — KWIACIARNIA, цветочница — KWIACIARKA. А ŁADNE KWIATKI, «красивые цветочки», говорят с иронией о неприятном сюрпризе: «хорошенькое дело»." }
  - { kind: government, text: "Цветок в горшке — KWIATEK W DONICZCE, местный. Поливать цветы — PODLEWAĆ KWIATKI, винительный. Как корове седло — PASOWAĆ JAK KWIATEK DO KOŻUCHA, буквально «как цветок к тулупу»." }
  - { kind: pronunciation, text: "Читается «квя́тэк», два слога, ударение на первом. Сочетание WIA сливается в «вя». В формах без беглого E: KWIATKA — «квя́тка»." }
  - { kind: register, text: "WĄCHAĆ KWIATKI OD SPODU, «нюхать цветочки снизу», — шутливо-мрачное «лежать в могиле». PASOWAĆ JAK KWIATEK DO KOŻUCHA — о чём-то совершенно неуместном, как наше «как корове седло»." }
collocations:
  - { pl: "kwiatek w doniczce", ru: "цветок в горшке" }
  - { pl: "podlewać kwiatki", ru: "поливать цветы" }
  - { pl: "zerwać kwiatek", ru: "сорвать цветок" }
family:
  - { pl: "kwiat", ru: "цветок", relation: root, id: kwiat }
  - { pl: "kwiaciarnia", ru: "цветочный магазин", relation: derived }
  - { pl: "kwiecień", ru: "апрель", relation: derived, id: kwiecien }
etymology: "Уменьшительное от KWIAT, праславянского слова, общего с русским «цвет». Польское KW на месте русского «цв» — обычное соответствие: KWIAT и «цвет». Отсюда и KWIECIEŃ, апрель, — как украинский «квітень»."
memory: "Kwiatek — цветок, цветочек: podlewać kwiatki. Читается «квя́тэк». Польское kw — русское «цв»: kwiat и «цвет», kwiecień — апрель. Pasować jak kwiatek do kożucha — как корове седло. Ładne kwiatki! — хорошенькое дело!"
idioms:
  - { pl: "pasować jak kwiatek do kożucha", ru: "как корове седло" }
  - { pl: "wąchać kwiatki od spodu", ru: "лежать в могиле" }
  - { pl: "ładne kwiatki", ru: "хорошенькое дело, ну и дела" }
