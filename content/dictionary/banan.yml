notes:
  - { kind: usage, text: "Десять форм, мужской род. В разговоре винительный звучит как родительный: ZJEŚĆ BANANA, KUPIĆ BANANA, хотя слово неодушевлённое. Так поляки поступают с частью названий мелких вещей мужского рода: ZJEŚĆ BANANA, ZAPALIĆ PAPIEROSA, DOSTAĆ MANDATA. Книжная форма ZJEŚĆ BANAN тоже правильна, но звучит реже." }
  - { kind: false-friend, text: "BANAN NA TWARZY, «банан на лице», — широкая улыбка: изгиб банана похож на рот, растянутый до ушей. MIEĆ BANANA NA TWARZY значит «сиять». А BANANOWA MŁODZIEŻ — не любители бананов, а «золотая молодёжь», дети богатых родителей: при социализме бананы были редкостью и доставались немногим." }
  - { kind: government, text: "Кожура от банана — SKÓRKA OD BANANA, OD с родительным, где у нас «банановая кожура». Гроздь бананов — KIŚĆ BANANÓW. Поскользнуться на кожуре — POŚLIZGNĄĆ SIĘ NA SKÓRCE OD BANANA." }
  - { kind: pronunciation, text: "Читается «ба́нан», два слога, ударение на первом, как всегда в польском двусложном слове. В русском ударение на втором, «бана́н», и по привычке его легко перенести." }
collocations:
  - { pl: "kiść bananów", ru: "гроздь бананов" }
  - { pl: "skórka od banana", ru: "банановая кожура" }
  - { pl: "dojrzały banan", ru: "спелый банан" }
family:
  - { pl: "bananowy", ru: "банановый", relation: derived }
  - { pl: "bananowiec", ru: "банановое дерево", relation: derived }
  - { pl: "bananek", ru: "бананчик", relation: derived }
etymology: "Из языков Западной Африки через португальский и испанский BANANA. В польский слово пришло вместе с самим фруктом и закрепилось в мужском роде, BANAN, как и в русском. Отличается только ударение, которое польский по своему правилу перенёс на первый слог."
memory: "Banan — «банан», но ударение на первом слоге: «ба́нан». В разговоре zjeść banana, с окончанием -a. Banan na twarzy — улыбка до ушей. Bananowa młodzież — золотая молодёжь. Skórka od banana — банановая кожура."
idioms:
  - { pl: "mieć banana na twarzy", ru: "улыбаться до ушей" }
  - { pl: "bananowa młodzież", ru: "золотая молодёжь" }
  - { pl: "republika bananowa", ru: "банановая республика" }
