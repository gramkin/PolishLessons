notes:
  - { kind: false-friend, text: "AUKCJA — «аукцион», но короче и женского рода: TA AUKCJA, NA AUKCJI. Торги, тендер — PRZETARG. Аукционный — AUKCYJNY: DOM AUKCYJNY, «аукционный дом»." }
  - { kind: usage, text: "Женский род. Родительный, дательный и местный — AUKCJI. Множественное — AUKCJE. Звательный и архаичное AUKCYJ не используем." }
  - { kind: government, text: "На аукционе — NA AUKCJI, NA с местным. Выставить на аукцион — WYSTAWIĆ NA AUKCJĘ, NA с винительным. Выиграть аукцион — WYGRAĆ AUKCJĘ." }
  - { kind: pronunciation, text: "Читается «а́укцья»: AU — дифтонг, как в AUTO, CJA — «цья». Ударение на первом слоге." }
collocations:
  - { pl: "dom aukcyjny", ru: "аукционный дом" }
  - { pl: "wystawić na aukcję", ru: "выставить на аукцион" }
  - { pl: "aukcja charytatywna", ru: "благотворительный аукцион" }
family:
  - { pl: "licytacja", ru: "торги, аукцион", relation: root }
