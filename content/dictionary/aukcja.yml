  - { pl: "sprzedaż", ru: "продажа", relation: root, id: sprzedaz }
etymology: "Из латинского AUCTIO «увеличение», от AUGERE «увеличивать»: цена растёт с каждой ставкой. Русское «аукцион» — от той же основы."
memory: "Aukcja — аукцион, женского рода. Na aukcji — на аукционе. Wystawić na aukcję — выставить на аукцион. Читается «а́укцья»."
idioms:
