# review
id: nikt
format: 2
lemma: "nikt"
rank: 131
pos: noun
pron: { cyr: "никт" }
senses:
  - id: nobody
    ru: "никто (подлежащее)"
    note: "Отрицание при глаголе обязательно, как в русском: Nikt nie wie."
    examples:
      - pl: "Nikt nie umarł."
        ru: "Никто не умер."
        source: { kind: tatoeba, id: 3516161 }
      - pl: "Nikt nie słucha."
        ru: "Никто не слушает."
        source: { kind: tatoeba, id: 5659980 }
      - pl: "Nikt nie rozumie."
        ru: "Никто не понимает."
        source: { kind: tatoeba, id: 5659962 }
  - id: oblique
    ru: "никого, никому, ни с кем (косвенные падежи)"
    examples:
      - pl: "Nie mam nikogo."
        ru: "У меня никого нет."
        source: { kind: tatoeba, id: 4006926 }
      - pl: "Nie ma tu nikogo."
        ru: "Здесь никого нет."
        source: { kind: tatoeba, id: 5508791 }
      - pl: "Tam nikogo nie ma."
        ru: "Там никого."
        source: { kind: tatoeba, id: 13633141 }
notes:
  - { kind: usage, text: "Двойное отрицание обязательно: Nikt nie przyszedł «Никто не пришёл». Без nie предложение неграмотно." }
  - { kind: usage, text: "Склонение короткое: nikt — nikogo — nikomu — (z) nikim. После предлога только косвенная форма: o nikim, z nikim." }
collocations:
  - { pl: "nikt inny", ru: "никто другой" }
  - { pl: "prawie nikt", ru: "почти никто" }
  - { pl: "nikt z nas", ru: "никто из нас" }
etymology: "Праславянское *nikъto — то же слово, что русское «никто»: ni- «ни» + kto «кто»."
memory: "Как в русском, отрицание двойное: Nikt nie wie «Никто не знает». Падежи короткие: nikt — nikogo — nikomu — z nikim."
idioms:
  - { pl: "nikt inny", ru: "никто другой" }
  - { pl: "nikt a nikt", ru: "ровным счётом никто" }
  - { pl: "jak nikt", ru: "как никто другой" }
