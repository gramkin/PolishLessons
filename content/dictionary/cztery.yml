senses:
  - id: four
    ru: "четыре"
    examples:
      - pl: "Mam cztery koty."
        ru: "У меня четыре кошки."
        source: { kind: tatoeba, id: 11318004 }
      - pl: "Śnieg padał cztery dni."
        ru: "Снег шёл четыре дня."
        source: { kind: tatoeba, id: 360236 }
      - pl: "Wojna trwała cztery lata."
        ru: "Война продолжалась четыре года."
        source: { kind: tatoeba, id: 3373931 }
  - id: four-collective
    ru: "четверо (собирательная форма czworo)"
    examples:
      - pl: "Pan Brown ma czworo dzieci."
        ru: "У господина Брауна четверо детей."
        source: { kind: translated, id: 2212437 }
      - pl: "Zarezerwowałem stolik dla czworga."
        ru: "Я забронировал столик на четверых."
        source: { kind: translated, id: 12187544 }
      - pl: "Przyszło czworo gości."
        ru: "Пришло четверо гостей."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Конструкция расходится с русской: после cztery существительное стоит в именительном падеже множественного числа — cztery koty, cztery lata. Русский же требует родительного единственного: «четыре кота»." }
  - { kind: usage, text: "Мужско-личная форма — czterej: czterej panowie «четверо господ». Косвенные падежи — czterech, czterem, czterema." }
  - { kind: usage, text: "Для детей и смешанных групп обязательна собирательная форма czworo: czworo dzieci «четверо детей», stolik dla czworga «столик на четверых»." }
  - { kind: usage, text: "cztery kąty — «свой угол, своё жильё»; dzielić włos na czworo — «придираться к мелочам»." }
collocations:
  - { pl: "cztery lata", ru: "четыре года" }
  - { pl: "czworo dzieci", ru: "четверо детей" }
  - { pl: "cztery kąty", ru: "свой угол" }
  - { pl: "dla czworga", ru: "на четверых" }
etymology: "Праславянское *četyre; русское «четыре» — то же самое слово."
memory: "cztery — «четыре», слово почти русское, но конструкция другая: cztery koty — именительный множественного, тогда как русский говорит «четыре кота» родительным. А о детях нужна собирательная форма czworo dzieci."
idioms:
  - { pl: "cztery kąty", ru: "свой угол, своё жильё" }
  - { pl: "dzielić włos na czworo", ru: "придираться к мелочам" }
  - { pl: "cztery kółka", ru: "машина, четыре колеса" }
formExamplesSkip:
  - { form: "cztero", reason: "это не самостоятельное слово, а связанная основа сложных слов (czteroletni, czterogodzinny); отдельно она не употребляется" }
