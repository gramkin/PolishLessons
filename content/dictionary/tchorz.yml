notes:
  - { kind: false-friend, text: "РОДСТВЕННИК ЕСТЬ, ПРОСТО РУССКИЙ ПОТЕРЯЛ У НЕГО НАЧАЛО. Польское tchórz и русский «хорь, хорёк» — одно и то же слово: праславянское *dъxorь, зверёк, названный по запаху, от того же корня, что dech «дыхание» и русские «дух», «дышать». Русский утратил начальное д-, польский сохранил его в виде tch-. Дальше языки разошлись: польский тем же словом назвал ещё и ТРУСА — по повадке зверька отбиваться вонью и убегать, — а в русском трус это «трус», слово совсем другое." }
  - { kind: usage, text: "Родительный множественного двойной: и tchórzy, и tchórzów, оба правильны. Такая же пара уже встречалась у kapelusz (kapeluszy и kapeluszów) и у sekcja (sekcji и sekcyj). Польский нередко держит в этом падеже два окончания сразу." }
  - { kind: pronunciation, text: "Один слог. ó звучит как у, rz как ж, но на конце слова оглушается до ш: «тхуш». В косвенных падежах звонкость возвращается и появляется второй слог: tchórza — «тху́жа»." }
collocations:
  - { pl: "podszyty tchórzem", ru: "трусоватый" }
