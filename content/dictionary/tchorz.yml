  - { pl: "tchórzostwo", ru: "трусость", relation: derived }
  - { pl: "tchórzyć", ru: "трусить", relation: derived }
  - { pl: "dech", ru: "дыхание", relation: root, id: dech }
etymology: "Из праславянского *dъxorь «вонючий зверёк», от корня, давшего dech «дыхание», duch, а в русском «дух», «дышать», «дохлый». Русское «хорь» — то же самое слово с утраченным начальным д-. Переносное «трус» выросло из повадки зверька: защищаясь, он испускает смрад и убегает. Отсюда tchórzliwy, tchórzostwo и tchórzyć."
memory: "tchórz — это и «хорёк», и «трус». Зверёк тот же, что русский «хорь», просто русский потерял начальное д-: *dъxorь дал и tchórz, и «хоря». А «трус» получился из него по запаху: хорёк отбивается вонью и убегает."
idioms:
  - { pl: "podszyty tchórzem", ru: "трусоватый" }
  - { pl: "tchórz obleciał kogoś", ru: "кто-л. струсил" }
