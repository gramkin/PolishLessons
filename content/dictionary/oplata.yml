etymology: "От PŁACIĆ «платить», слова праславянского и того же, что русское «платить». А корень в нём неожиданный: PŁAT значил «кусок ткани», и платили когда-то именно полотном. Отсюда и русские «плата», «платить» и «платок» — всё из одного корня, и ткань в нём первична. Приставка O- даёт здесь оттенок завершённости: OPŁATA это то, чем дело закрывают."
memory: "Не «оплата» как действие, а сама сумма: сбор, пошлина, плата. Oplata za prad это «плата за электричество». Читается «опуа́та», где l со штрихом даёт «у». В местном падеже t переходит в cie: o oplacie. Выучите to sie oplaca — «это выгодно». И корень общий с нашим «платить», а в основе его лежит plat «кусок ткани»: платили полотном, отсюда и «платок»."
idioms:
  - { pl: "opłata skarbowa", ru: "гербовый сбор" }
