notes:
  - { kind: false-friend, text: "Русская «оплата» это действие, сам процесс платежа. Польская OPŁATA — не действие, а сумма, которую надо заплатить: сбор, пошлина, плата. OPŁATA ZA PRĄD значит «плата за электричество», а не «оплата». Если нужно именно действие, поляк скажет ZAPŁATA или ZAPŁACENIE. И запомните оборот TO SIĘ OPŁACA — «это выгодно», буквально «это оплачивается»." }
  - { kind: usage, text: "Десять форм, женский род. В дательном и местном падежах T переходит в CIE: OPŁATA, но O OPŁACIE. В родительном множественного окончания нет: OPŁAT, и именно эта форма стоит в объявлениях BEZ OPŁAT «без сборов». Множественное OPŁATY употребляется очень часто, потому что сборов обычно несколько." }
  - { kind: government, text: "Плата за что-то — OPŁATA ZA COŚ, предлог ZA с винительным: OPŁATA ZA PRĄD, OPŁATA ZA WODĘ. Взять плату — POBRAĆ OPŁATĘ, винительный без предлога. Без сборов — BEZ OPŁAT, родительный множественного. А TO SIĘ OPŁACA требует только SIĘ и ничего больше, и переводить его надо «это выгодно»." }
  - { kind: pronunciation, text: "Читается «опуа́та», три слога, ударение на предпоследнем. Буква Ł даёт «у», поэтому второй слог это «уа», без всякого «л». В форме OPŁACIE сочетание CIE даёт мягкое «це»: «опуа́це». Буква P перед Ł не оглушается и звучит обычным «п»." }
  - { kind: register, text: "Слово канцелярское и повседневное сразу: в счётах, в объявлениях, в кассе. OPŁATA SKARBOWA это «гербовый сбор», который платят за справку в учреждении; OPŁATA ZA PRĄD и OPŁATA ZA WODĘ стоят в каждом квитке. BEZ OPŁAT написано там, где ничего платить не надо. А разговорное TO SIĘ NIE OPŁACA значит «это невыгодно»." }
collocations:
  - { pl: "opłata za prąd", ru: "плата за электричество" }
