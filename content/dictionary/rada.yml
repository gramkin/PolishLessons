# review
id: rada
format: 2
lemma: "rada"
rank: 337
pos: noun
pron: { cyr: "ра́да" }
senses:
  - id: advice
    ru: "совет, наставление"
    examples:
      - pl: "Potrzebuję rady."
        ru: "Мне нужен совет."
        source: { kind: tatoeba, id: 5468592 }
      - pl: "Potrzebuję dobrej rady."
        ru: "Мне нужен хороший совет."
        source: { kind: tatoeba, id: 597156 }
      - pl: "Powinieneś go spytać o radę."
        ru: "Тебе следует спросить у него совета."
        source: { kind: tatoeba, id: 2405803 }
  - id: cope-council
    ru: "dać sobie radę — справиться; rada — совет (орган)"
    examples:
      - pl: "Damy sobie jakoś radę bez ciebie."
        ru: "Как-нибудь без тебя обойдёмся."
        source: { kind: tatoeba, id: 6995419 }
      - pl: "Dałem mu kilka rad."
        ru: "Я дал ему несколько советов."
        source: { kind: tatoeba, id: 6014693 }
      - pl: "Potrzebujemy Twojej rady."
        ru: "Нам нужен твой совет."
        source: { kind: tatoeba, id: 525074 }
notes:
  - { kind: usage, text: "dać sobie radę значит «справиться»: Damy sobie radę «Мы справимся». Оборот очень частый, тот же, что в dawać sobie radę." }
  - { kind: usage, text: "Второе значение — «совет» как орган: rada miasta «городской совет», rada nadzorcza «наблюдательный совет». То же слово, что украинская «рада»." }
  - { kind: false-friend, text: "Родительный множественного rad совпадает с названием химического элемента rad «радий»: Kto odkrył rad? — это про элемент, а не про советы." }
collocations:
  - { pl: "dobra rada", ru: "хороший совет" }
  - { pl: "dać sobie radę", ru: "справиться" }
  - { pl: "prosić o radę", ru: "просить совета" }
  - { pl: "rada miasta", ru: "городской совет" }
etymology: "От radzić «советовать»; то же слово, что украинская «рада» и русское заимствование «рада»."
memory: "rada — и «совет» как наставление, и «совет» как орган: rada miasta. А dać sobie radę значит «справиться»."
idioms:
  - { pl: "dawać sobie radę", ru: "справляться" }
  - { pl: "dobra rada", ru: "хороший совет" }
  - { pl: "mądry przyjmie radę", ru: "умный примет совет" }
formExamplesSkip:
  - { form: "rado", reason: "звательный падеж от этого слова в живой речи не употребляется" }
