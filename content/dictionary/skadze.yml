# review
id: skadze
format: 2
lemma: "skądże"
rank: 2265
pos: adv
pron: { cyr: "ско́ндже" }
senses:
  - id: whence
    ru: "откуда же (усиленное skąd)"
    examples:
      - pl: "Skądże się tu wziąłeś?"
        ru: "Откуда же ты здесь взялся?"
        source: { kind: authored }
      - pl: "Skądże o tym wiesz?"
        ru: "Откуда же ты об этом знаешь?"
        source: { kind: authored }
      - pl: "Skądże mielibyśmy to wiedzieć?"
        ru: "Откуда же нам было это знать?"
        source: { kind: authored }
  - id: no-way
    ru: "да нет!, вовсе нет! (решительное отрицание)"
    examples:
      - pl: "Gdzie, skądże, przecież ta parasolka to stary rupieć jest."
        ru: "Да нет, ведь этот зонтик — старая рухлядь."
        source: { kind: translated, id: 13604517 }
      - pl: "Skądże! Nic podobnego."
        ru: "Да нет! Ничего подобного."
        source: { kind: authored }
      - pl: "Skądże znowu, wcale tak nie myślę."
        ru: "Да нет же, я вовсе так не думаю."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Это skąd «откуда» с усилительной частицей -że. Та же модель, что в otóż, czyżby, gdzież." }
  - { kind: false-friend, text: "Второе значение неожиданное: Skądże! как отдельная реплика значит не «откуда», а решительное «Да нет!», «Вовсе нет!»" }
  - { kind: usage, text: "Усиленный вариант — skądżeż; ещё сильнее звучит skądże znowu «да нет же»." }
  - { kind: register, text: "Слово разговорное и слегка старомодное, часто встречается в литературе XIX–XX веков." }
collocations:
  - { pl: "skądże!", ru: "да нет!" }
  - { pl: "skądże znowu", ru: "да нет же" }
  - { pl: "skąd", ru: "откуда" }
etymology: "Из skąd «откуда» с усилительной частицей -że. Та же модель, что в otóż, czyżby, gdzież."
memory: "skądże — это усиленное skąd «откуда». Но запомните второе значение: отдельной репликой Skądże! значит не «откуда», а решительное «Да нет!», «Вовсе нет!» Ещё сильнее — skądże znowu."
idioms:
