# review
id: komisariat
format: 2
lemma: "komisariat"
rank: 4606
pos: noun
pron: { cyr: "комиса́рьят" }
senses:
  - id: police-station
    ru: "отделение полиции, полицейский участок"
    examples:
      - pl: "Zgłosił kradzież na komisariacie."
        ru: "Он заявил о краже в отделении полиции."
        source: { kind: authored }
      - pl: "Komisariat jest czynny całą dobę."
        ru: "Отделение работает круглосуточно."
        source: { kind: authored }
      - pl: "Zabrali go na komisariat na przesłuchanie."
        ru: "Его забрали в участок на допрос."
        source: { kind: authored }
      - pl: "Najbliższy komisariat jest dwie ulice dalej."
        ru: "Ближайшее отделение полиции в двух кварталах."
        source: { kind: authored }
      - pl: "Na komisariacie spędził całą noc."
        ru: "Он провёл в участке всю ночь."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "KOMISARIAT — «отделение полиции», а не военный «комиссариат». Военкомат по-польски — WOJSKOWE CENTRUM REKRUTACJI, раньше WKU. KOMISARZ — звание полицейского, «комиссар»." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Родительный — KOMISARIATU, в местном T переходит в C: NA KOMISARIACIE." }
  - { kind: government, text: "В отделении — NA KOMISARIACIE, с NA, а не W. В отделение — NA KOMISARIAT, винительный. Отделение полиции — KOMISARIAT POLICJI." }
  - { kind: pronunciation, text: "Читается «комиса́рьят», ударение на предпоследнем слоге: RIAT — один слог «рьят»." }
collocations:
  - { pl: "komisariat policji", ru: "отделение полиции" }
  - { pl: "zgłosić się na komisariat", ru: "явиться в полицию" }
  - { pl: "na komisariacie", ru: "в отделении полиции" }
family:
  - { pl: "komisarz", ru: "комиссар (полиции)", relation: root, id: komisarz }
  - { pl: "komisarski", ru: "комиссарский", relation: derived }
  - { pl: "komisariat policji", ru: "отделение полиции", relation: derived }
etymology: "Из французского слова, образованного от «комиссар» — уполномоченный. В Польше так называют районное отделение полиции."
memory: "Komisariat — отделение полиции; na komisariacie — в отделении (na!). Читается «комиса́рьят». Komisarz — комиссар."
idioms:
  - { pl: "mieć coś na sumieniu", ru: "иметь что-то на совести" }
