etymology: "Уменьшительное от KRATA, а то из латинского CRATES «плетёнка, решётка», пришедшего через немецкий. Русская «решётка» идёт от «решето», то есть от сита, и корень совсем другой, хотя образ переплетённых прутьев тот же. Разговорное значение «через раз» выросло из картинки клетчатой ткани: чёрное, белое, чёрное, белое, то есть с пропусками. Эта метафора в русском не прижилась, и переводить её приходится описательно."
memory: "Уменьшительное от krata «решётка», слово латинского корня, не родственное русской «решётке». Запоминать надо два оборота. Za kratkami это «за решёткой», как по-русски. А w kratkę значит и «в клетку» о ткани и тетради, и, в разговоре, «через раз»: chodzić do pracy w kratkę. Образ взят от чередования клеток. В дательном и местном k переходит в c: w kratce. Читается «кра́тка»."
idioms:
  - { pl: "w kratkę", ru: "в клетку; через раз, с пропусками" }
