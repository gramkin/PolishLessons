notes:
  - { kind: false-friend, text: "Само слово уменьшительное от KRATA «решётка», и русский корень тут другой, но два оборота стоит выучить целиком. ZA KRATKAMI значит «за решёткой», то есть в тюрьме, ровно как по-русски. А вот W KRATKĘ двусмысленно: в прямом смысле это «в клетку», о ткани и бумаге, а в разговорном — «через раз, с пропусками»: CHODZIĆ DO PRACY W KRATKĘ значит ходить на работу то да, то нет. Второго значения русский не знает." }
  - { kind: usage, text: "Десять форм, женский род. В дательном и местном падеже единственного числа K переходит в C: KRATKA, но W KRATCE. Это то же чередование, что в MATKA — MATCE и NAUCZKA — NAUCZCE. Родительный множественного KRATEK с беглым E. Уменьшительность здесь настоящая, про размер: KRATA это решётка на окне, а KRATKA это клеточка в тетради или мелкая решётка в полу." }
  - { kind: government, text: "В клетку — предлог W с винительным: ZESZYT W KRATKĘ, KOSZULA W KRATKĘ. Это устойчивая конструкция для всякого узора: W PASKI «в полоску», W KROPKI «в горошек», всегда с винительным множественного или единственного. В клеточке — предлог W с местным падежом: W KRATCE. За решёткой — ZA KRATKAMI, предлог ZA с творительным, как и русский." }
  - { kind: pronunciation, text: "Читается «кра́тка», два слога, ударение на первом. Все звуки простые, и слово почти не отличается от того, как выглядит. В форме KRATCE сочетание TC произносится слитно, почти как одно «ц», и слышно «кра́тце». В родительном множественного KRATEK беглое E звучит отчётливо, «кра́тэк». В исходном KRATA ударение тоже на первом слоге." }
  - { kind: register, text: "Слово нейтральное и повседневное: ZESZYT W KRATKĘ покупает каждый школьник, KOSZULA W KRATKĘ это обычная рубашка в клетку, KRATKA ŚCIEKOWA это решётка водостока. Разговорное W KRATKĘ в значении «через раз» живёт в речи взрослых и слегка иронично: SPAŁEM W KRATKĘ значит «спал урывками». ZA KRATKAMI звучит газетно и означает тюрьму." }
