# review
id: odwrotnie
format: 2
lemma: "odwrotnie"
rank: 5235
pos: adv
pron: { cyr: "одвро́тне" }
senses:
  - id: conversely
    ru: "наоборот"
    examples:
      - pl: "Ja uważam odwrotnie."
        ru: "Я считаю наоборот."
        source: { kind: authored }
      - pl: "Dzieci uczą się od rodziców, i odwrotnie."
        ru: "Дети учатся у родителей, и наоборот."
        source: { kind: authored }
      - pl: "Zawsze robi odwrotnie, niż mu każą."
        ru: "Он всегда делает наоборот."
        source: { kind: authored }
  - id: backwards
    ru: "задом наперёд, наизнанку, вверх ногами"
    examples:
      - pl: "Założyła sweter odwrotnie, metką na wierzchu."
        ru: "Она надела свитер наизнанку, ярлыком наружу."
        source: { kind: authored }
      - pl: "Obraz powiesili odwrotnie."
        ru: "Картину повесили вверх ногами."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ODWROTNIE — «наоборот», а не русское «отвратно», хотя звучит похоже. «Отвратительно» по-польски — OBRZYDLIWIE. ODWROTNY — «обратный»: ODWROTNA STRONA, «оборотная сторона»." }
  - { kind: usage, text: "Наречие, одна форма, без степеней. Устойчивое I ODWROTNIE — «и наоборот». В ответе-возражении чаще говорят PRZECIWNIE или WRĘCZ PRZECIWNIE." }
  - { kind: government, text: "Наречие ничем не управляет. Сравнение вводится через NIŻ: ODWROTNIE, NIŻ MÓWIŁEŚ, «не так, как ты говорил, а наоборот»." }
  - { kind: pronunciation, text: "Читается «одвро́тне», ударение на предпоследнем слоге. D перед W звонкое, TNIE — «тне»." }
collocations:
  - { pl: "i odwrotnie", ru: "и наоборот" }
  - { pl: "zupełnie odwrotnie", ru: "совсем наоборот" }
  - { pl: "założyć odwrotnie", ru: "надеть наизнанку" }
family:
  - { pl: "odwrotny", ru: "обратный", relation: root }
  - { pl: "odwrócić", ru: "перевернуть, повернуть", relation: root, id: odwrocic }
  - { pl: "wrócić", ru: "вернуться", relation: root, id: wrocic }
etymology: "От ODWROTNY «обратный», а то — от ODWRÓCIĆ «повернуть обратно». Корень WRÓT-, WRAC- тот же, что в WRÓCIĆ «вернуться» и в русских «вернуть», «ворота», «поворот»."
memory: "Odwrotnie — наоборот, не «отвратно». Читается «одвро́тне». I odwrotnie — и наоборот. Założyć odwrotnie — надеть наизнанку."
idioms:
  - { pl: "do góry nogami", ru: "вверх ногами" }
formExamples:
  - form: "odwrotnie"
    pl: "Zrobił dokładnie odwrotnie."
    ru: "Он сделал ровно наоборот."
    source: { kind: authored }
  - form: "odwrotnie"
    pl: "Było zupełnie odwrotnie, niż mówiłeś."
    ru: "Всё было совсем не так, как ты говорил."
    source: { kind: authored }
  - form: "odwrotnie"
    pl: "Założyłeś koszulkę odwrotnie."
    ru: "Ты надел футболку наизнанку."
    source: { kind: authored }
