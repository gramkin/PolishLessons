senses:
  - id: open-air-museum
    ru: "скансен, этнографический музей под открытым небом"
    examples:
      - { pl: "Zwiedziliśmy skansen z drewnianymi chatami.", ru: "Мы осмотрели скансен с деревянными хатами.", source: { kind: authored } }
      - { pl: "W skansenie pokazują, jak dawniej pieczono chleb.", ru: "В скансене показывают, как раньше пекли хлеб.", source: { kind: authored } }
      - { pl: "Do skansenu przeniesiono stary drewniany kościółek.", ru: "В скансен перенесли старую деревянную церквушку.", source: { kind: authored } }
      - { pl: "Dzieciom najbardziej podobał się skansen.", ru: "Детям больше всего понравился скансен.", source: { kind: authored } }
  - id: relic
    ru: "музей древностей, пережиток (о чём-то отсталом)"
    note: "ирон."
    examples:
      - { pl: "Ta linia kolejowa to prawdziwy skansen techniki.", ru: "Эта железная дорога — настоящий музей техники.", source: { kind: authored } }
      - { pl: "Urząd wygląda jak skansen z czasów PRL-u.", ru: "Учреждение выглядит как музей времён ПНР.", source: { kind: authored } }
notes:
  - { kind: usage, text: "Мужской род, неодушевлённое: родительный SKANSENU, предложный W SKANSENIE. В Польше скансены есть почти в каждом регионе: собранные из деревень хаты, мельницы, костёлы." }
  - { kind: false-friend, text: "Русское «скансен» — редкий музейный термин; в обычной речи говорят «музей деревянного зодчества» или «музей под открытым небом». По-польски SKANSEN — обычное слово, им пользуются все." }
  - { kind: register, text: "В переносном смысле SKANSEN — иронично об отсталом месте или учреждении: TO NIE BIURO, TO SKANSEN — «это не офис, а музей древностей»." }
