# review
id: wciaz
format: 2
lemma: "wciąż"
rank: 304
pos: adv
pron: { cyr: "фчёнж" }
senses:
  - id: still
    ru: "всё ещё, по-прежнему"
    examples:
      - pl: "Tom jest wciąż u dziadka."
        ru: "Том всё ещё у своего деда."
        source: { kind: tatoeba, id: 13830846 }
      - pl: "Tom wciąż pracuje w Bostonie."
        ru: "Том всё ещё работает в Бостоне."
        source: { kind: tatoeba, id: 6733713 }
      - pl: "Dom pradziadka Toma wciąż stoi."
        ru: "Дом прадедушки Тома всё ещё стоит."
        source: { kind: tatoeba, id: 5377691 }
  - id: still-q
    ru: "всё ещё (в вопросах и отрицаниях)"
    examples:
      - pl: "Czy wciąż zbierasz znaczki?"
        ru: "Вы всё ещё коллекционируете почтовые марки?"
        source: { kind: tatoeba, id: 580589 }
      - pl: "Wciąż nie zapłacili czynszu."
        ru: "Они всё ещё не заплатили за аренду."
        source: { kind: tatoeba, id: 12069334 }
      - pl: "Ty wciąż ją kochasz, prawda?"
        ru: "Ты её всё ещё любишь, не так ли?"
        source: { kind: tatoeba, id: 12655220 }
notes:
  - { kind: usage, text: "Синонимы — nadal и ciągle; все три значат «всё ещё»: Wciąż czekam = Nadal czekam." }
  - { kind: usage, text: "wciąż jeszcze усиливает: «всё ещё до сих пор». Оборот stale i wciąż значит «постоянно»." }
  - { kind: usage, text: "Внутри спрятано ciąg «продолжение, тяга» — то, что тянется дальше." }
collocations:
  - { pl: "wciąż jeszcze", ru: "всё ещё" }
  - { pl: "wciąż nie", ru: "всё ещё не" }
  - { pl: "stale i wciąż", ru: "постоянно" }
  - { pl: "wciąż ten sam", ru: "всё тот же" }
etymology: "Из w + ciąg «продолжение, тяга»: то, что тянется дальше; ср. русские «течение», «тянуть»."
memory: "wciąż = nadal «всё ещё». Внутри спрятано ciąg «продолжение»: то, что тянется дальше."
idioms:
