notes:
  - { kind: false-friend, text: "Прилагательное, на котором всё построено, русскому незнакомо: ŁATWY значит «лёгкий, нетрудный», а прямого родственника в русском у него нет — мы говорим «лёгкий», от совсем другого корня. Поэтому опереться на знакомое слово не получится, зато мысль прозрачна: ZAŁATWIĆ SPRAWĘ значит буквально «сделать дело лёгким», то есть уладить его. Рядом живут ŁATWO «легко», ŁATWOŚĆ «легкость» и UŁATWIĆ «облегчить», и последнее слово ложится на русское «облегчить» морфема в морфему." }
  - { kind: register, text: "Это один из самых ходовых глаголов живой польской речи, и без него не обойтись в учреждении: ZAŁATWIAĆ SPRAWY, ZAŁATWIĆ FORMALNOŚCI, MAM DO ZAŁATWIENIA KILKA SPRAW «у меня несколько дел». Односложный ответ ZAŁATWIONE значит «готово, сделано». Второе значение, «достать по знакомству», принадлежит разговорной речи и несёт лёгкий оттенок обхода правил: ZAŁATWIŁ TO PO ZNAJOMOŚCI «устроил по знакомству». Есть и грубоватое ZAŁATWIĆ KOGOŚ — «разделаться с кем-то», и его стоит узнавать, но не употреблять." }
  - { kind: government, text: "Прямое дополнение в винительном: ZAŁATWIAĆ SPRAWY, ZAŁATWIAĆ FORMALNOŚCI. Во втором значении добавляется дательный лица: ZAŁATWIĆ KOMUŚ COŚ — ZAŁATWIŁ NAM BILETY, «достал нам билеты». Место действия идёт с W и предложным: ZAŁATWIAĆ COŚ W URZĘDZIE. Способ выражается предлогом PRZEZ с винительным: ZAŁATWIĆ COŚ PRZEZ TELEFON «решить по телефону», и здесь русский берёт просто «по» с дательным. Очень частотен оборот PO ZNAJOMOŚCI «по знакомству»." }
  - { kind: usage, text: "Шестьдесят три формы — подпись переходного глагола несовершенного вида, с действительным причастием на -ĄCY. Видовой партнёр — ZAŁATWIĆ, и чередование W перед I здесь обычное: ZAŁATWIAĆ при ZAŁATWIĆ. Разница видов работает ровно как в русском: ZAŁATWIAM SPRAWY значит «занимаюсь делами», процесс, а ZAŁATWIŁEM SPRAWĘ — «уладил дело», итог. Отглагольное существительное ZAŁATWIANIE обозначает хлопоты, а ZAŁATWIENIE — их успешный конец." }
  - { kind: pronunciation, text: "Читается «зауа́твячь», четыре слога, ударение на предпоследнем. Буква Ł звучит как «у», поэтому ZAŁ читается «зау», а не «зал», и это главная ловушка слова. Сочетание WIA даёт «вя», где I служит знаком мягкости. Конечное Ć мягкое, «чь». В формах настоящего времени слышно «зауа́твям», «зауа́твяш», и всюду сохраняется то же «у» на месте Ł." }
collocations:
