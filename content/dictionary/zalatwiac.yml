etymology: "Приставка ZA- плюс ŁATWIAĆ, от прилагательного ŁATWY «лёгкий». В старопольском оно звучало ŁACNY, и этот вид ближе к исходному; нынешнее ŁATWY получилось позже. Прямого русского соответствия у корня нет: русский для той же мысли взял «лёгкий», родственное литовскому и латинскому словам со значением малого веса, тогда как польский корень связан со значением удобства и доступности. Поэтому пара ZAŁATWIĆ и «уладить» совпадает по смыслу, но не по происхождению. Зато производное UŁATWIĆ ложится на русское «облегчить» морфема в морфему: приставка плюс основа со значением лёгкости."
memory: "Всё строится на прилагательном łatwy «лёгкий», у которого русского родственника нет: załatwić sprawę значит буквально «сделать дело лёгким». Без этого глагола в польском учреждении не обойтись: załatwiać sprawy, mam kilka spraw do załatwienia, а в ответ załatwione «готово». Главная ловушка в чтении: Ł звучит как «у», поэтому «зауа́твячь», а не «залатвячь». Второе значение разговорное — «достать по знакомству», po znajomości."
idioms:
  - { pl: "załatwić coś po znajomości", ru: "устроить что-то по знакомству" }
