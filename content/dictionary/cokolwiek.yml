# review
id: cokolwiek
format: 2
lemma: "cokolwiek"
rank: 425
pos: pron
pron: { cyr: "цоко́львек" }
senses:
  - id: anything
    ru: "что-нибудь, что-либо"
    examples:
      - pl: "Wkrótce będzie za ciemno, aby cokolwiek zobaczyć."
        ru: "Скоро будет слишком темно, чтобы что-нибудь увидеть."
        source: { kind: tatoeba, id: 6553731 }
      - pl: "Gdybym sam cokolwiek z tego rozumiał!"
        ru: "Если бы я сам хоть что-то понимал!"
        source: { kind: tatoeba, id: 13084394 }
      - pl: "Czy chcesz cokolwiek zjeść?"
        ru: "Хочешь что-нибудь поесть?"
        source: { kind: authored }
  - id: whatever
    ru: "что бы ни (в уступительных оборотах)"
    examples:
      - pl: "Cokolwiek się wydarzy, zawsze jestem po twojej stronie."
        ru: "Что бы ни случилось - я всегда на твоей стороне."
        source: { kind: tatoeba, id: 2145280 }
      - pl: "Cokolwiek powiesz, nie uwierzę."
        ru: "Что бы ты ни сказал, я не поверю."
        source: { kind: authored }
      - pl: "Cokolwiek zrobisz, będzie dobrze."
        ru: "Что бы ты ни сделал, будет хорошо."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Слово собрано из co «что» и частицы -kolwiek, которая делает местоимение неопределённым. Тот же приём работает дальше: ktokolwiek «кто-нибудь», gdziekolwiek «где-нибудь», jakkolwiek «как-нибудь»." }
  - { kind: usage, text: "Склоняется передняя часть, а -kolwiek остаётся приклеенной сзади: cokolwiek, czegokolwiek, czemukolwiek, czymkolwiek — ровно как co, czego, czemu, czym." }
  - { kind: usage, text: "В уступительном придаточном значит «что бы ни»: Cokolwiek się wydarzy «Что бы ни случилось»." }
  - { kind: usage, text: "В условных и отрицательных фразах отвечает русскому «хоть что-нибудь»: Gdybym cokolwiek z tego rozumiał «Если бы я хоть что-то из этого понимал»." }
collocations:
  - { pl: "cokolwiek się stanie", ru: "что бы ни случилось" }
  - { pl: "cokolwiek innego", ru: "что-нибудь другое" }
  - { pl: "prawie cokolwiek", ru: "почти что угодно" }
etymology: "Из co «что» и частицы -kolwiek, восходящей к старому kolwiek «сколько угодно». Русские «что-либо» и «что угодно» устроены тем же способом: местоимение плюс приклеенная частица."
memory: "cokolwiek — «что-нибудь» и «что бы ни». Это co «что» плюс частица -kolwiek, которая делает местоимение неопределённым; тем же приёмом получаются ktokolwiek «кто-нибудь» и gdziekolwiek «где-нибудь». По падежам меняется только передняя часть: czegokolwiek, czymkolwiek."
idioms:
  - { pl: "cokolwiek się stanie", ru: "что бы ни случилось" }
  - { pl: "cokolwiek powiesz po łacinie, brzmi mądrze", ru: "что ни скажи по-латыни, звучит умно" }
  - { pl: "cokolwiek by nie było", ru: "что бы там ни было" }
