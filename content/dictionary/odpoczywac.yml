etymology: "Из приставки OD- и корня *pokojь «покой», от праславянского *čiti «отдыхать, успокаиваться», того же, что в русском «покой», «почить», «успокоить». Польский построил на этом корне всё поле отдыха: ODPOCZYWAĆ «отдыхать», ODPOCZYNEK «отдых», SPOKÓJ «спокойствие», POKÓJ «комната» и «мир». Русский тот же корень сохранил в «покое» и «упокоении», но для обиходного отдыха взял другой образ — дыхание, и получил «отдыхать», «отдых», «передышку». Поэтому два языка описывают одно и то же состояние разными метафорами: польский через тишину, русский через восстановленное дыхание. Двойное значение польского POKÓJ — не случайная омонимия, а два развития одного смысла: комната как место, где человек в покое, и мир как покой между государствами. Русский для второго значения взял «мир», для первого «комнату», и связь распалась."
memory: "Польский строит «отдых» не от дыхания, а от покоя: od- + pocz-, тот же корень, что в pokój и spokój. Отсюда odpoczywać «отдыхать» и odpoczynek «отдых» (с беглым e: odpoczynku). Награда за это — pokój сразу в двух значениях, «комната» и «мир», оба из покоя. Непереходный, 52 формы: страдательного причастия нет, отдыхают сами. Совершенный вид меняет основу: odpoczywam, но odpocznę. Управление как в русском: po pracy, od hałasu. И формула niech odpoczywa w spokoju — «пусть покоится с миром»."
idioms:
