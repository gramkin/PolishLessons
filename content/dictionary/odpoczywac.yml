notes:
  - { kind: false-friend, text: "Русское «отдыхать» построено от «дыхания»: отдышаться, перевести дух. Польское ODPOCZYWAĆ построено на другом образе — на покое: приставка OD- и корень POCZ-, тот же, что в POKÓJ и SPOKÓJ, то есть русское «покой». Буквально это «выйти из усталости в покой». Поэтому ODPOCZYNEK значит «отдых», а однокоренные слова у польского и русского расходятся: «отдых» и «дыхание» в русском связаны, а в польском связаны «отдых» и «покой». Главная награда за это наблюдение — слово POKÓJ, у которого в польском два значения: «комната» и «мир». Оба из «покоя»: комната как место покоя, мир как состояние покоя между странами." }
  - { kind: usage, text: "Несовершенный вид, непереходный, пятьдесят две формы: сорок две от глагола и десять от действительного причастия ODPOCZYWAJĄCY. Страдательного причастия нет и быть не может, потому что отдыхают сами, а не кого-то. Совершенная пара — ODPOCZĄĆ, и в ней другая основа: ODPOCZYWA- в несовершенном, ODPOCZN- в совершенном, сравните ODPOCZYWAM и ODPOCZNĘ «отдохну». Существительное ODPOCZYNEK «отдых» имеет беглое E, которое исчезает в косвенных падежах: ODPOCZYNEK, но ODPOCZYNKU. Устойчивое NIECH ODPOCZYWA W SPOKOJU — это надгробная формула, точно соответствующая русской «пусть покоится с миром»." }
  - { kind: government, text: "Непереходный. После чего отдыхать — предлог PO с местным: ODPOCZYWAĆ PO PRACY, PO PODRÓŻY, PO OBIEDZIE, в точности как русское «отдыхать после работы». От чего — предлог OD с родительным: ODPOCZYWAĆ OD LUDZI, OD HAŁASU «отдыхать от людей, от шума». Где — обычные предлоги места: NAD MORZEM с творительным, W GÓRACH с местным, NA WSI с местным. Прямого дополнения глагол не принимает: сказать ODPOCZYWAĆ KOGOŚ нельзя, и если нужно дать отдых другому, говорят DAĆ KOMUŚ ODPOCZĄĆ или POZWOLIĆ KOMUŚ ODPOCZĄĆ." }
  - { kind: pronunciation, text: "Читается «отпочы́ваць», четыре слога, ударение на предпоследнем, то есть на CZY. Приставка OD перед глухим P оглушается и звучит «от»: не «одпочывать», а «отпочываць». Буквосочетание CZ даёт твёрдое «ч», буква Y — «ы», поэтому третий слог звучит «чы». Конечное Ć — мягкое «ць». В совершенном виде ODPOCZNĄĆ появляется носовое Ą: «отпочно́нць», и три согласных CZN идут подряд без гласного. В причастии ODPOCZYWAJĄCY шесть слогов, ударение по-прежнему предпоследнее: «отпочывайо́нцы»." }
