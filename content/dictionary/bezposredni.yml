notes:
  - { kind: false-friend, text: "СЛОВО СОБРАНО КАК РУССКОЕ, НО ХОДИТ ДАЛЬШЕ. Bez- плюс po- плюс średni «средний» — ровно то же, что «не-по-средственный» от «среднего». В значении «непосредственный начальник» (bezpośredni przełożony) языки совпадают. Но польское слово значит ещё и просто «ПРЯМОЙ»: bezpośredni pociąg — «прямой поезд», bezpośredni lot — «прямой рейс». По-русски «непосредственный поезд» не скажешь." }
  - { kind: usage, text: "Противоположность — pośredni «косвенный, промежуточный»: dowód bezpośredni «прямое доказательство» против dowód pośredni «косвенное». Из того же гнезда pośrednik «посредник» и pośrednictwo «посредничество». Наречие bezpośrednio значит «прямо, непосредственно»: zwrócić się bezpośrednio do dyrektora." }
  - { kind: pronunciation, text: "ТРИДЦАТЬ ДВЕ ФОРМЫ, А НЕ ТРИДЦАТЬ ТРИ, и причина знакомая: это прилагательное с МЯГКОЙ основой, у которого именительный мужского рода единственного числа совпадает с мужско-личным множественного — bezpośredni przełożony и bezpośredni przełożeni. Одна форма на две клетки, как у tani. Звонкое z перед p оглушается: «бэспосьре́дни»." }
  - { kind: register, text: "О человеке bezpośredni — это похвала: открытый, без церемоний, говорит прямо. Русское «непосредственный» о человеке звучит иначе — скорее о детской наивности. Ближе всего будет «прямой» или «открытый»." }
collocations:
  - { pl: "bezpośredni pociąg", ru: "прямой поезд" }
  - { pl: "bezpośredni przełożony", ru: "непосредственный начальник" }
  - { pl: "zwrócić się bezpośrednio", ru: "обратиться напрямую" }
family:
  - { pl: "średni", ru: "средний", relation: root }
  - { pl: "pośredni", ru: "косвенный, промежуточный", relation: antonym }
  - { pl: "bezpośrednio", ru: "прямо, непосредственно", relation: derived }
etymology: "Сложение bez- «без», po- и średni «средний»: буквально «без промежуточного звена». Русское «непосредственный» построено из тех же частей, только с «не-» вместо «без-». Отсюда pośredni «косвенный», pośrednik «посредник» и bezpośrednio «напрямую»."
memory: "bezpośredni — и «непосредственный» (bezpośredni przełożony), и просто «ПРЯМОЙ»: bezpośredni pociąg, bezpośredni lot. Собрано из bez + po + średni, как русское «не-по-средственный». Форм тридцать две: основа мягкая, как у tani."
