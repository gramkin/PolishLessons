# review
id: wycofywac
format: 2
lemma: "wycofywać"
rank: 3994
pos: verb
pron: { cyr: "выцофы́ваць" }
senses:
  - id: withdraw
    ru: "отзывать, изымать, выводить (войска, товар)"
    examples:
      - pl: "Firma wycofuje wadliwe produkty ze sklepów."
        ru: "Фирма отзывает бракованные товары из магазинов."
        source: { kind: authored }
      - pl: "Państwo wycofuje wojska z regionu."
        ru: "Государство выводит войска из региона."
        source: { kind: authored }
      - pl: "Wycofuję swoją propozycję."
        ru: "Я снимаю своё предложение."
        source: { kind: authored }
  - id: back-out
    ru: "отступать, выходить (WYCOFYWAĆ SIĘ); сдавать назад (о машине)"
    examples:
      - pl: "Inwestor wycofuje się z projektu."
        ru: "Инвестор выходит из проекта."
        source: { kind: authored }
      - pl: "Kierowca powoli wycofuje samochód z garażu."
        ru: "Водитель медленно выезжает задним ходом из гаража."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "WYCOFYWAĆ — «отзывать, выводить, изымать», а не «вычёркивать». С SIĘ — «отступать, выходить из дела»: WYCOFYWAĆ SIĘ Z ŻYCIA PUBLICZNEGO «уходить из публичной жизни». О машине — «сдавать назад»: WYCOFYWAĆ AUTO. Корень тот же, что COFAĆ «отодвигать назад»." }
  - { kind: usage, text: "Несовершенный вид; совершенный — WYCOFAĆ. Спряжение на -UJĘ: WYCOFUJĘ, WYCOFUJESZ, WYCOFUJĄ. Мужско-личное страдательное WYCOFYWANI — «выводимые»: о солдатах, игроках." }
  - { kind: government, text: "Что — винительный: WYCOFYWAĆ PRODUKT, SKARGĘ. Откуда — Z с родительным: Z RYNKU, Z GARAŻU. С SIĘ — Z с родительным: WYCOFYWAĆ SIĘ Z UMOWY." }
  - { kind: pronunciation, text: "Читается «выцофы́ваць»: C — «ц», Y — «ы». Ударение на предпоследнем слоге. WYCOFUJĘ — «выцофу́е»." }
  - { kind: register, text: "Нейтрально-официальное слово: экономика, политика, армия. В быту — о машине: WYCOFUJ, BO ZASTAWIASZ «сдай назад, ты загораживаешь»." }
collocations:
  - { pl: "wycofywać produkt z rynku", ru: "отзывать товар с рынка" }
  - { pl: "wycofywać się z umowy", ru: "выходить из договора" }
  - { pl: "wycofywać samochód", ru: "сдавать назад на машине" }
family:
  - { pl: "wycofać", ru: "отозвать, вывести", relation: aspect, id: wycofac }
  - { pl: "cofać", ru: "отодвигать назад, отменять", relation: root, id: cofac }
  - { pl: "odwrót", ru: "отступление", relation: root, id: odwrot }
etymology: "Приставка WY- плюс COFAĆ «двигать назад». Происхождение COFAĆ спорно: слово есть только в западнославянских языках, русского родственника у него нет."
memory: "Wycofywać — отзывать, выводить: firma wycofuje produkty. Wycofywać się — отступать, выходить из дела."
idioms:
  - { pl: "wycofywać się rakiem", ru: "пятиться назад, отступать раком" }
