# review
id: pozno
format: 2
lemma: "późno"
rank: 220
pos: adv
pron: { cyr: "пу́зьно" }
senses:
  - id: late
    ru: "поздно"
    examples:
      - pl: "Za późno."
        ru: "Слишком поздно."
        source: { kind: tatoeba, id: 524393 }
      - pl: "Jeszcze nie jest późno."
        ru: "Ещё не поздно."
        source: { kind: tatoeba, id: 4725614 }
      - pl: "Kto może dzwonić tak późno?"
        ru: "Кто может так поздно звонить?"
        source: { kind: tatoeba, id: 12698413 }
  - id: later
    ru: "później — позже; потом"
    note: "Слово покрывает и «позже», и «потом»: Zrobię to później."
    examples:
      - pl: "Może później."
        ru: "Может быть, попозже."
        source: { kind: tatoeba, id: 2607628 }
      - pl: "Zadzwoń do mnie później."
        ru: "Позвони мне позже."
        source: { kind: tatoeba, id: 351517 }
      - pl: "Kilka dni później umarł."
        ru: "Он умер несколькими днями позже."
        source: { kind: tatoeba, id: 13781659 }
notes:
  - { kind: usage, text: "później значит и «позже» (сравнение), и «потом» (в будущем): Później ci powiem «Потом тебе скажу»." }
  - { kind: usage, text: "najpóźniej — «самое позднее»: Przyjdź najpóźniej o szóstej." }
  - { kind: usage, text: "prędzej czy później — «рано или поздно»." }
collocations:
  - { pl: "za późno", ru: "слишком поздно" }
  - { pl: "później", ru: "позже, потом" }
  - { pl: "najpóźniej", ru: "самое позднее" }
  - { pl: "prędzej czy później", ru: "рано или поздно" }
etymology: "От późny «поздний»; то же слово, что русское «поздно», с характерным польским ó."
memory: "późno — później — najpóźniej. Но później значит ещё и «потом»: Później ci powiem. А najpóźniej — «самое позднее»."
idioms:
  - { pl: "lepiej późno niż wcale", ru: "лучше поздно, чем никогда" }
  - { pl: "prędzej czy później", ru: "рано или поздно" }
  - { pl: "kto późno przychodzi, sam sobie szkodzi", ru: "кто поздно приходит, тот сам себе вредит" }
