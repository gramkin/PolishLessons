# review
id: gdzies
format: 2
lemma: "gdzieś"
rank: 368
pos: adv
pron: { cyr: "гдзесь" }
senses:
  - id: somewhere
    ru: "где-то"
    examples:
      - pl: "Ona tutaj gdzieś mieszka."
        ru: "Она где-то здесь живёт."
        source: { kind: tatoeba, id: 6109609 }
      - pl: "Tomek jest gdzieś w domu."
        ru: "Том где-то в доме."
        source: { kind: tatoeba, id: 3655845 }
      - pl: "Gdzieś cię już widziałem."
        ru: "Я тебя где-то уже видел."
        source: { kind: tatoeba, id: 6109626 }
  - id: anywhere
    ru: "куда-то; где-нибудь"
    examples:
      - pl: "Czy jest tutaj gdzieś McDonald's?"
        ru: "Здесь где-нибудь есть Макдональдс?"
        source: { kind: tatoeba, id: 544806 }
      - pl: "Ropucha zniknęła gdzieś w ciemnych odmętach stawu."
        ru: "Жаба исчезла где-то в тёмных пучинах пруда."
        source: { kind: tatoeba, id: 12759356 }
      - pl: "\"Ił\" 2 razy odchodził i chybą gdzieś odlecieli."
        ru: "\"Ил\" два раза уходил, и, кажется, куда-то улетел."
        source: { kind: tatoeba, id: 1736270 }
notes:
  - { kind: usage, text: "Частица -ś делает вопросительное слово неопределённым, ровно как русское «-то»: gdzie «где» → gdzieś «где-то», kto → ktoś, kiedy → kiedyś." }
  - { kind: usage, text: "Одно слово покрывает и «где-то», и «куда-то»: mieszka gdzieś tutaj «живёт где-то здесь», zniknął gdzieś «исчез куда-то»." }
  - { kind: register, text: "mieć coś gdzieś — грубоватое «плевать на что-то»: Mam to gdzieś «Мне на это наплевать»." }
collocations:
  - { pl: "gdzieś tutaj", ru: "где-то здесь" }
  - { pl: "gdzieś indziej", ru: "где-то в другом месте" }
  - { pl: "mieć coś gdzieś", ru: "плевать на что-то" }
  - { pl: "gdzieś daleko", ru: "где-то далеко" }
etymology: "Из gdzie «где» и неопределённой частицы -ś; та же модель, что в русском «где-то»."
memory: "gdzieś — и «где-то», и «куда-то», от gdzie с частицей -ś, как русское «-то». А mieć coś gdzieś — грубоватое «плевать»."
idioms:
  - { pl: "gdzieś tutaj", ru: "где-то здесь" }
  - { pl: "mieć gdzieś", ru: "плевать" }
  - { pl: "gdzieś indziej", ru: "в другом месте" }
