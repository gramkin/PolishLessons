# review
id: tlusty
format: 2
lemma: "tłusty"
rank: 3787
pos: adj
pron: { cyr: "туу́сты" }
senses:
  - id: fatty
    ru: "жирный (о еде)"
    examples:
      - pl: "Nie jem tłustego mięsa."
        ru: "Я не ем жирного мяса."
        source: { kind: authored }
      - pl: "Ta zupa jest za tłusta."
        ru: "Этот суп слишком жирный."
        source: { kind: authored }
      - pl: "Kup mleko mniej tłuste."
        ru: "Купи молоко менее жирное."
        source: { kind: authored }
  - id: greasy
    ru: "жирный, засаленный (о коже, волосах, пятне)"
    examples:
      - pl: "Mam tłuste włosy."
        ru: "У меня жирные волосы."
        source: { kind: authored }
      - pl: "Na koszuli została tłusta plama."
        ru: "На рубашке осталось жирное пятно."
        source: { kind: authored }
  - id: fat
    ru: "толстый, упитанный (о человеке, животном; грубовато)"
    examples:
      - pl: "W chlewie leżała tłusta świnia."
        ru: "В хлеву лежала жирная свинья."
        source: { kind: authored }
      - pl: "Tłuści ludzie częściej chorują na serce."
        ru: "Тучные люди чаще болеют сердцем."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "TŁUSTY — «жирный», а не «толстый», хотя звучит похоже. О толстой книге или ветке — GRUBY: GRUBA KSIĄŻKA. О человеке TŁUSTY грубо, «жирный», вежливее GRUBY или PULCHNY, «пухлый». TŁUSTY CZWARTEK — «жирный четверг», день пончиков перед Великим постом." }
  - { kind: usage, text: "Полная парадигма: TŁUSTSZY, NAJTŁUSTSZY. Формы с -ŚCIEJSZY в карточку не включены — это редкий дублет. Формы для мужчин-людей: TŁUŚCI, TŁUSTSI — с чередованием ST→ŚC. Наречие — TŁUSTO: JEŚĆ TŁUSTO." }
  - { kind: government, text: "От чего — OD с родительным: PALCE TŁUSTE OD MASŁA, «пальцы жирные от масла». Сравнение — OD или NIŻ: TŁUSTSZY OD WIEPRZOWINY." }
  - { kind: pronunciation, text: "Читается «туу́сты», два слога, ударение на первом. Ł перед U сливается в долгое «уу». Сравнительная TŁUSTSZY — «туу́стшы», все согласные произносятся." }
  - { kind: register, text: "О еде и коже — нейтральное слово. О людях — грубое: TŁUSTY FACET звучит обидно. В переносном: TŁUSTE LATA — «тучные, сытые годы», TŁUSTY KĄSEK — «лакомый кусок», выгодное дело." }
