etymology: "Праславянское *tъlstъ «жирный, толстый»; русское «толстый» — то же слово, но в русском значение ушло к размеру, а в польском осталось у жира."
memory: "Tłusty — жирный: tłuste mięso, tłusta plama, tłuste włosy. Толстый — gruby! Tłusty czwartek — день пончиков. Читается «туу́сты»."
