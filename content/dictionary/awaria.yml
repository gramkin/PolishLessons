# review
id: awaria
format: 2
lemma: "awaria"
rank: 4735
pos: noun
pron: { cyr: "ава́рья" }
senses:
  - id: breakdown
    ru: "поломка, неисправность (техники)"
    examples:
      - pl: "Samochód miał awarię na autostradzie."
        ru: "Машина сломалась на автостраде."
        source: { kind: authored }
      - pl: "Awaria komputera opóźniła pracę."
        ru: "Поломка компьютера задержала работу."
        source: { kind: authored }
      - pl: "Serwis usunął awarię w godzinę."
        ru: "Сервис устранил неисправность за час."
        source: { kind: authored }
  - id: outage
    ru: "авария, отключение (света, воды)"
    examples:
      - pl: "Z powodu awarii nie ma prądu."
        ru: "Из-за аварии нет электричества."
        source: { kind: authored }
      - pl: "Awaria wodociągu zalała ulicę."
        ru: "Авария водопровода затопила улицу."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Польская AWARIA — не дорожная авария с пострадавшими: та по-польски WYPADEK. AWARIA — поломка, неисправность, отказ техники: AWARIA SAMOCHODU — машина сломалась, AWARIA PRĄDU — отключилось электричество. Прилагательное AWARYJNY — «аварийный», но и «запасной»: WYJŚCIE AWARYJNE — запасной выход, ŚWIATŁA AWARYJNE — аварийка." }
  - { kind: usage, text: "Десять форм в таблице, женский род. Родительный, дательный и местный единственного и родительный множественного совпадают: AWARII. Старинная форма AWARYJ и звательная AWARIO не нужны." }
  - { kind: government, text: "Из-за поломки — Z POWODU AWARII, родительный. Устранить поломку — USUNĄĆ AWARIĘ, винительный. У машины поломка — SAMOCHÓD MA AWARIĘ, буквально «машина имеет аварию»." }
  - { kind: pronunciation, text: "Читается «ава́рья», три слога, ударение на втором: RIA в конце сливается в «рья», как в HISTORIA «исто́рья». В форме AWARII: «ава́рьи»." }
collocations:
  - { pl: "awaria prądu", ru: "отключение электричества" }
  - { pl: "usunąć awarię", ru: "устранить неисправность" }
  - { pl: "poważna awaria", ru: "серьёзная авария" }
family:
  - { pl: "awaryjny", ru: "аварийный; запасной", relation: derived, id: awaryjny }
  - { pl: "awaryjnie", ru: "в аварийном порядке", relation: derived }
  - { pl: "awaryjność", ru: "ненадёжность, частота поломок", relation: derived }
etymology: "Из итальянского слова со значением «повреждение груза в пути», через немецкий. Русский взял то же слово, но сузил его до «аварии» с крушением; польский сохранил исходное «повреждение, поломка»."
memory: "Awaria — поломка, неисправность; авария с пострадавшими — wypadek. Читается «ава́рья». Awaria prądu — отключение света. Wyjście awaryjne — запасной выход, światła awaryjne — аварийка."
idioms:
  - { pl: "wyjście awaryjne", ru: "запасной выход" }
  - { pl: "światła awaryjne", ru: "аварийная сигнализация, аварийка" }
formExamplesSkip:
  - { form: "awaryj", reason: "архаичная форма родительного множественного; сейчас AWARII" }
  - { form: "awario", reason: "звательная форма; на практике не употребляется" }
