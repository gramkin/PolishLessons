format: 2
lemma: "polecić"
rank: 3094
pos: verb
pron: { cyr: "поле́циць" }
senses:
  - id: recommend
    ru: "порекомендовать, посоветовать"
    examples:
      - pl: "Poleciłbym tę książkę każdemu."
        ru: "Я порекомендовал бы эту книгу каждому."
        source: { kind: authored }
      - pl: "Polecił nam małą restaurację przy rynku."
        ru: "Он порекомендовал нам маленький ресторан у рынка."
        source: { kind: authored }
      - pl: "Tej firmy nie poleciłbym nikomu."
        ru: "Эту фирму я никому не порекомендовал бы."
        source: { kind: authored }
  - id: entrust
    ru: "поручить (кому-л. что-л.)"
    examples:
      - pl: "Polecił asystentowi przygotowanie raportu."
        ru: "Он поручил ассистенту подготовку отчёта."
        source: { kind: authored }
      - pl: "Polecono mi dopilnować terminu."
        ru: "Мне поручили проследить за сроком."
        source: { kind: authored }
notes:
  - { kind: usage, text: "POLECAM — одно из самых частых слов в живой речи, и оно стоит само по себе, как русское «рекомендую»: кто-то спрашивает о книге или кафе, вы отвечаете POLECAM! Отсюда же POLECENIE, у которого два значения: «поручение, распоряжение» (POLECENIE SŁUŻBOWE) и «рекомендация» (Z POLECENIA ZNAJOMEGO — «по рекомендации знакомого»). И отдельно стоит выучить LIST POLECONY: это не «рекомендованное письмо», а «ЗАКАЗНОЕ ПИСЬМО», то есть с уведомлением о вручении." }
  - { kind: government, text: "Рекомендовать что кому — винительный плюс дательный: POLECIĆ KOMUŚ KSIĄŻKĘ, RESTAURACJĘ. Порядок свободный, но дательный обычно идёт первым: POLECIŁ NAM RESTAURACJĘ. В значении поручения то же самое: POLECIĆ KOMUŚ COŚ, а при инфинитиве — POLECIŁ MI DOPILNOWAĆ TERMINU. Обратите внимание, что при отрицании дополнение переходит в родительный, как всегда: TEJ FIRMY NIE POLECAM." }
  - { kind: pronunciation, text: "Основа оканчивается на c, и в первом лице она переходит в что-то, чего русский не ждёт: POLECIĆ даёт POLECĘ, а не «полечу». Повелительное же — POLEĆ, с мягким ć на конце. Читается всё это «поле́циць», с мягким ц. Важно не спутать с LECIEĆ «лететь»: POLECĘ от POLECIĆ значит «порекомендую», а POLECĘ от POLECIEĆ значит «полечу» — формы совпадают, и различает их только смысл фразы." }
  - { kind: false-friend, text: "Сходство с русским «полечить» обманчиво: ничего медицинского в этом слове нет. POLECIĆ — это «порекомендовать» или «поручить», а «полечить» будет POLECZYĆ, от LECZYĆ «лечить». Две соседние буквы, два разных корня: LEC- в POLECIĆ и LECZ- в LECZYĆ. Гнездо первого — POLECENIE, ZLECIĆ «поручить», ZLECENIE «заказ, поручение»; гнездо второго — LEKARZ «врач», LEKARSTWO «лекарство», LECZENIE «лечение»." }
collocations:
  - { pl: "polecam", ru: "рекомендую" }
  - { pl: "list polecony", ru: "заказное письмо" }
  - { pl: "z polecenia", ru: "по рекомендации" }
family:
  - { pl: "polecać", ru: "рекомендовать", relation: aspect }
  - { pl: "polecenie", ru: "поручение; рекомендация", relation: derived, id: polecenie }
  - { pl: "zlecić", ru: "поручить, заказать", relation: root }
etymology: "Приставка po- и основа -LECIĆ, которая самостоятельно в современном польском не живёт, но видна в целом гнезде: POLECIĆ «поручить, порекомендовать», ZLECIĆ «поручить, заказать», ZLECENIE «заказ», POLECENIE «поручение». Русского однокоренного слова с этим значением нет, так что опереться на чутьё не получится — слово берётся целиком. Важно только не связывать его ни с LECIEĆ «лететь», ни с LECZYĆ «лечить»: сходство на письме случайное, и все три корня разные."
memory: "polecić — это «порекомендовать» или «поручить», а не «полечить» (то — poleczyć). Polecam! значит «рекомендую!», а list polecony — «заказное письмо»."
idioms:
  - { pl: "polecam", ru: "рекомендую" }
  - { pl: "list polecony", ru: "заказное письмо" }
