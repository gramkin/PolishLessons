notes:
  - { kind: false-friend, text: "От одного корня польский произвёл трёх разных людей и одну вещь, и путать их легко. KIEROWCA это «водитель», KIEROWNIK — «руководитель, начальник», KIEROWNICZKA — «начальница», а KIEROWNICA — «руль». Разница между KIEROWCA и KIEROWNIK особенно важна: сказать о начальнике KIEROWCA значит понизить его до шофёра. Существительное KIERUNEK значит «направление» и в географии, и в вузе: KIERUNEK STUDIÓW это «специальность»." }
  - { kind: government, text: "Схема первая: SKIEROWAĆ KOGOŚ DO KOGOŚ или DO CZEGOŚ, предлог DO с родительным. SKIEROWAŁ GO DO SPECJALISTY значит «направил его к специалисту», и здесь русский берёт «к» с дательным, так что предлог приходится менять. Схема вторая совпадает полностью: SKIEROWAĆ COŚ NA COŚ, предлог NA с винительным, как «направить что-то на что-то». В канцелярском языке частотно SKIEROWAĆ SPRAWĘ DO SĄDU «направить дело в суд», где русский ставит «в»." }
  - { kind: usage, text: "Глагол на -OWAĆ, и личные формы идут на -UJ-: SKIEROWAĆ, но SKIERUJĘ, SKIERUJESZ, SKIERUJĄ, как «рисовать» и «рисую». Видовой партнёр — KIEROWAĆ, и у него есть собственное значение «рулить, вести машину»: KIEROWAĆ SAMOCHODEM с творительным падежом. Пятьдесят три формы — подпись переходного глагола совершенного вида. Самое нужное производное — SKIEROWANIE, медицинское «направление»: SKIEROWANIE DO SPECJALISTY без него к врачу не попасть." }
  - { kind: pronunciation, text: "Читается «скеро́вачь», три слога, ударение на предпоследнем. Сочетание KIE даёт мягкое «ке», где I работает знаком мягкости, а не отдельным гласным, поэтому слышно «ске», а не «ские». То же в KIEROWCA «керо́вца» и KIERUNEK «керу́нэк». Конечное Ć мягкое, «чь». В личных формах ударение переезжает: SKIERUJĘ это «скеру́е»." }
  - { kind: register, text: "Слово нейтральное, но прочно связано с учреждениями: медициной, судом, кадровой службой. Частые сочетания: SKIEROWAĆ DO SZPITALA, SKIEROWAĆ NA BADANIA «направить на обследование», SKIEROWAĆ SPRAWĘ DO SĄDU, SKIEROWAĆ PYTANIE DO KOGOŚ «обратить вопрос к кому-то». В разговоре о движении глаз и света он тоже обычен: SKIEROWAĆ WZROK, SKIEROWAĆ LATARKĘ. Для простого «послать» есть POSŁAĆ и WYSŁAĆ, и подменять их этим глаголом не стоит." }
