etymology: "Приставка S- плюс KIEROWAĆ, а тот пришёл из немецкого: KEHREN значит «поворачивать», и от него же немецкое KEHRE «поворот». Польский взял корень в позднем Средневековье вместе с ремесленной и морской лексикой и построил на нём целое гнездо: KIERUNEK, KIEROWCA, KIEROWNIK, KIEROWNICA. Русского родственника у этого корня нет, и это полезно знать заранее: опереться на знакомое слово не получится. Русский для того же понятия взял свой корень, «направить» от «правый», где исходный образ — выпрямление, а не поворот. Два языка пришли к одному смыслу от противоположных образов."
memory: "Корень не славянский, а немецкий: kierować от KEHREN «поворачивать», и русского родственника у него нет, так что опереться не на что. Зато гнездо очень нужное: kierunek «направление», kierowca «водитель», kierownik «руководитель», kierownica «руль». Не путать kierowca и kierownik. Управление: skierować kogoś do kogoś, предлог do с родительным, где русский просит «к» с дательным. И знать skierowanie — медицинское «направление»."
idioms:
