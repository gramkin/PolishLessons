etymology: "Из латинского FRONS, родительный FRONTIS, «лоб, чело», через французское FRONT. Исходный образ телесный: лоб есть передняя, обращённая вперёд часть, и отсюда всё остальное — передняя сторона дома, передний край войска. Русское «фронт» пришло тем же путём, через немецкий и французский, в петровское время, и военное значение у обоих языков одно. Тот же латинский корень виден в KONFRONTACJA «конфронтация», буквально «лоб в лоб», и в AFRONT «оскорбление», то есть удар по лбу. Так что FRONT, KONFRONTACJA и AFRONT — одно гнездо, и во всех трёх речь о лбе, выставленном вперёд."
memory: "Кроме военного фронта значит ещё фасад: front kamienicy, wejście od frontu — по-русски тут нужен «фасад». Пара предлогов для сторон дома: od frontu и od podwórza. В местном t переходит в c: na froncie, шестой случай после monecie и instynkcie. От латинского frons «лоб» — передняя часть; отсюда же konfrontacja «лоб в лоб»."
