notes:
  - { kind: false-friend, text: "У польского слова есть значение, которого у русского «фронта» нет вовсе, и оно встречается в быту чаще военного. FRONT по-польски — это ещё и фасад, передняя сторона здания: FRONT KAMIENICY «фасад дома», WEJŚCIE OD FRONTU «вход с улицы, с фасада», MIESZKANIE OD FRONTU «квартира с видом на улицу», в отличие от OD PODWÓRZA. По-русски во всех этих случаях нужен «фасад» или «передняя сторона», а «фронт дома» звучит как ошибка. В военном же смысле слова совпадают полностью, и совпадает даже метеорологическое употребление: FRONT ATMOSFERYCZNY «атмосферный фронт»." }
  - { kind: pronunciation, text: "Читается «фронт», одним слогом, и совпадает с русским полностью. Внимания требует только местный падеж FRONCIE: там T перед -IE переходит в C и смягчается, «фро́нце». Это шестой случай одного и того же чередования в этом словаре, после MONECIE, PASZPORCIE, TORCIE, KASECIE и INSTYNKCIE, так что правило можно считать отработанным. Конечное T в именительном глухое и в том, и в другом языке." }
  - { kind: government, text: "Мужской род, неодушевлённое. Винительный равен именительному: PRZEŁAMALI FRONT. Родительный на -U: OD FRONTU, Z FRONTU. Местный на -IE: NA FRONCIE «на фронте», и предлог здесь NA, как и в русском. Сторона здания вводится предлогом OD с родительным: OD FRONTU «со стороны фасада», OD PODWÓRZA «со стороны двора» — эта пара предлогов работает для любых сторон дома и стоит запоминания целиком. При отрицании винительный уходит в родительный: NIE PRZEŁAMALI FRONTU." }
  - { kind: usage, text: "Три области употребления не смешиваются. Военная: FRONT WSCHODNI «восточный фронт», IŚĆ NA FRONT. Строительная: FRONT BUDYNKU, ELEWACJA FRONTOWA. Переносная: FRONT ROBÓT «фронт работ», и это калька, одинаковая в обоих языках, и FRONT WALKI Z INFLACJĄ в газетном стиле. Прилагательное FRONTOWY значит и «фронтовой», и «фасадный», и различает их только контекст: DRZWI FRONTOWE есть парадная дверь, а не военная." }
