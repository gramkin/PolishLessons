pos: noun
pron: { cyr: "дэба́та" }
senses:
  - id: debate
    ru: "дебаты"
    examples:
      - pl: "Debata prezydencka trwała dwie godziny."
        ru: "Президентские дебаты длились два часа."
        source: { kind: authored }
      - pl: "W Sejmie odbyła się debata o budżecie."
        ru: "В Сейме прошли дебаты о бюджете."
        source: { kind: authored }
      - pl: "Kandydaci spotkali się na debacie."
        ru: "Кандидаты встретились на дебатах."
        source: { kind: authored }
  - id: discussion
    ru: "дискуссия, обсуждение"
    examples:
      - pl: "W szkole zorganizowano debatę o ekologii."
        ru: "В школе организовали дискуссию об экологии."
        source: { kind: authored }
      - pl: "Publiczna debata na ten temat trwa od lat."
        ru: "Общественная дискуссия на эту тему идёт годами."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "DEBATA — «дебаты», но в единственном числе: TA DEBATA, DEBATA TELEWIZYJNA. Русское «дебаты» обычно во множественном. Спор — SPÓR, дискуссия — DYSKUSJA." }
  - { kind: usage, text: "Девять форм, женский род. В местном T переходит в C: W DEBACIE. Родительный множественного — DEBAT. Звательный DEBATO не употребляется." }
  - { kind: government, text: "Дебаты о чём — DEBATA O и местный: DEBATA O EDUKACJI. Участвовать в дебатах — WZIĄĆ UDZIAŁ W DEBACIE. Дебаты кандидатов — DEBATA KANDYDATÓW." }
  - { kind: pronunciation, text: "Читается «дэба́та»: DE — твёрдое «дэ». Ударение на предпоследнем слоге. DEBACIE — «дэба́це»." }
collocations:
  - { pl: "debata publiczna", ru: "общественная дискуссия" }
  - { pl: "debata telewizyjna", ru: "телевизионные дебаты" }
  - { pl: "debata o budżecie", ru: "дебаты о бюджете" }
family:
  - { pl: "dyskusja", ru: "дискуссия", relation: root, id: dyskusja }
  - { pl: "spór", ru: "спор", relation: root }
  - { pl: "debatować", ru: "дебатировать", relation: derived }
etymology: "Из французского DÉBAT, от DÉBATTRE «оспаривать». Русское «дебаты» — то же слово."
memory: "Debata — дебаты, в единственном числе: ta debata. W debacie — в дебатах. Читается «дэба́та»."
