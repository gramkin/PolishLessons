notes:
  - { kind: pronunciation, text: "Основа оканчивается на ść, и в личных формах она переходит в szcz: DOPUŚCIĆ, но DOPUSZCZĘ, DOPUSZCZĄ, и страдательное DOPUSZCZONY. Это как раз та мена, которую карточка ZŁOŚCIĆ сузила до основ на ś, ź, ść и źdź — DOPUŚCIĆ оказывается её членом, тогда как CHODZIĆ или PŁACIĆ к ней не относятся. Повелительное же DOPUŚĆ мены не знает, потому что окончание не добавляется. Читается всё это «допу́щциць», с ść как мягким щць." }
  - { kind: government, text: "Два значения — два совершенно разных управления, и путать их нельзя. Допустить кого-то куда-то: DOPUŚCIĆ KOGOŚ DO CZEGOŚ, винительный плюс DO с родительным — DO EGZAMINU, DO GŁOSU, DO DOKUMENTÓW. Не допустить, чтобы: NIE DOPUŚCIĆ DO TEGO, ŻEBY… А вот возвратное DOPUŚCIĆ SIĘ требует РОДИТЕЛЬНОГО и значит «совершить» о проступке: DOPUŚCIĆ SIĘ KRADZIEŻY, ZANIEDBANIA, ZDRADY. Русский в этом месте скажет просто «совершить» с винительным." }
  - { kind: false-friend, text: "Корень PUŚCIĆ — прямой двойник русского «пустить», и большинство приставочных слов совпадает: WYPUŚCIĆ «выпустить», WPUŚCIĆ «впустить», PRZEPUŚCIĆ «пропустить», DOPUŚCIĆ «допустить». Но одно расходится резко: OPUŚCIĆ значит не «опустить», а «ПОКИНУТЬ» или «ПРОПУСТИТЬ» — OPUŚCIŁ ŻONĘ «он оставил жену», OPUŚCIŁ DWIE LEKCJE «он пропустил два урока». «Опустить» же будет OBNIŻYĆ или SPUŚCIĆ." }
  - { kind: usage, text: "Несовершенная пара — DOPUSZCZAĆ, и в ней живёт частая формула DOPUSZCZAĆ MYŚL «допускать мысль». Отсюда же прилагательное DOPUSZCZALNY «допустимый» (DOPUSZCZALNA PRĘDKOŚĆ — «допустимая скорость») и существительное DOPUSZCZENIE «допуск». Возвратное значение почти целиком принадлежит юридическому языку: в приговорах и отчётах DOPUŚCIĆ SIĘ встречается постоянно, в быту — редко." }
collocations:
  - { pl: "dopuścić do egzaminu", ru: "допустить к экзамену" }
  - { pl: "dopuścić się kradzieży", ru: "совершить кражу" }
  - { pl: "dopuszczalna prędkość", ru: "допустимая скорость" }
family:
  - { pl: "dopuszczać", ru: "допускать", relation: aspect }
  - { pl: "puścić", ru: "пустить", relation: root, id: puscic }
  - { pl: "opuścić", ru: "покинуть; пропустить", relation: root, id: opuscic }
etymology: "Приставка do- «до-» и PUŚCIĆ, из праславянского *pustiti «пустить, отпустить» — то же слово, что русское «пустить», с тем же корнем, что в «пустой», «отпуск», «запустить». Гнездо в польском обширное и почти целиком читается по русскому ключу: WPUŚCIĆ, WYPUŚCIĆ, PRZEPUŚCIĆ, SPUŚCIĆ. Приставка do- означает доведение до некоторого предела, отсюда «допустить» — дать дойти до чего-то. Возвратное DOPUŚCIĆ SIĘ развилось иначе: дать себе дойти до проступка, то есть совершить его."
memory: "Корень тот же, что «пустить», и приставки совпадают — кроме одной: opuścić значит «покинуть», а не «опустить». А dopuścić się требует родительного: dopuścić się kradzieży."
idioms:
  - { pl: "nie dopuścić do tego, żeby", ru: "не допустить того, чтобы" }
  - { pl: "dopuścić się zaniedbania", ru: "совершить халатность" }
