# review
id: jezdzic
format: 2
lemma: "jeździć"
rank: 1142
pos: verb
aspect: imperf
pron: { cyr: "е́зьдзиць" }
senses:
  - id: travel
    ru: "ездить (регулярно, туда-сюда)"
    examples:
      - pl: "Mój tato szybko jeździ."
        ru: "Мой папа быстро ездит."
        source: { kind: tatoeba, id: 4726848 }
      - pl: "Jeżdżę do Hiroszimy trzy razy w miesiącu."
        ru: "Я езжу в Хиросиму три раза в месяц."
        source: { kind: tatoeba, id: 919589 }
      - pl: "Jeżdżę do pracy autobusem."
        ru: "Я езжу на работу на автобусе."
        source: { kind: tatoeba, id: 4101582 }
  - id: transport-runs
    ru: "ходить, курсировать (о транспорте)"
    examples:
      - pl: "Autobus jeździ co dziesięć minut."
        ru: "Автобус ходит каждые десять минут."
        source: { kind: tatoeba, id: 363716 }
      - pl: "Jak często jeżdżą autobusy?"
        ru: "Как часто ходят автобусы?"
        source: { kind: translated, id: 3846753 }
  - id: ride
    ru: "кататься: jeździć na nartach, konno, na rowerze"
    examples:
      - pl: "Lubię jeździć na nartach."
        ru: "Я люблю кататься на лыжах."
        source: { kind: tatoeba, id: 1353858 }
      - pl: "Ona nie umie jeździć na rowerze."
        ru: "Она не умеет ездить на велосипеде."
        source: { kind: tatoeba, id: 415334 }
notes:
  - { kind: usage, text: "Главное отличие от jechać: jechać — однонаправленное движение прямо сейчас, jeździć — регулярное или туда-обратно. Jadę do pracy «Еду на работу (сейчас)» против Jeżdżę do pracy autobusem «Езжу на работу автобусом (всегда)»." }
  - { kind: government, text: "Транспорт ставится в творительный падеж без предлога: jeździć autobusem, jeździć pociągiem, jeździć samochodem." }
  - { kind: usage, text: "О катании — с предлогом na и предложным: jeździć na nartach «кататься на лыжах», jeździć na rowerze «ездить на велосипеде». Верхом — просто jeździć konno." }
  - { kind: usage, text: "О транспорте глагол значит «ходить, курсировать»: Autobusy jeżdżą co dziesięć minut «Автобусы ходят каждые десять минут»." }
collocations:
  - { pl: "jeździć autobusem", ru: "ездить на автобусе" }
  - { pl: "jeździć na nartach", ru: "кататься на лыжах" }
  - { pl: "jeździć konno", ru: "ездить верхом" }
  - { pl: "jeździć na rowerze", ru: "ездить на велосипеде" }
family:
  - { pl: "jechać", ru: "ехать (однонаправленно)", relation: root, id: jechac }
  - { pl: "jazda", ru: "езда", relation: derived }
  - { pl: "jeździec", ru: "всадник", relation: derived }
etymology: "Праславянское *jězditi — то же слово, что русское «ездить», и с той же ролью: многократное движение рядом с однонаправленным jechać «ехать»."
memory: "jeździć — «ездить» регулярно или туда-обратно, в пару к jechać «ехать (сейчас)». Транспорт идёт в творительном без предлога: jeździć autobusem. А jeździć na nartach значит «кататься на лыжах»."
idioms:
  - { pl: "jeździć na nartach", ru: "кататься на лыжах" }
  - { pl: "jeździć konno", ru: "ездить верхом" }
formExamplesSkip:
  - { form: "jeździj", reason: "форма не нормативна: повелительное наклонение у глаголов на -dzić образуется усечением основы — jeźdź, и эта форма в карточке есть с примерами. Тот же образец у chodzić — chodź, chodźcie, chodźmy и у wodzić — wódź. Окончание -aj принадлежит глаголам на -ać (śpiewać — śpiewaj, czytać — czytaj) и к jeździć не подходит. Частота здесь ничего не подсказывает: ни в частотном списке на 50 тысяч слов, ни в корпусе польских предложений этого проекта нет ни одной из двух форм, так что основание — образец спряжения, а не подсчёт" }
