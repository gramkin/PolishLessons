# review
id: wybuch
format: 2
lemma: "wybuch"
rank: 1912
pos: noun
pron: { cyr: "вы́бух" }
senses:
  - id: explosion
    ru: "взрыв"
    examples:
      - pl: "Słyszeliśmy wybuch bomby."
        ru: "Мы слышали взрыв бомбы."
        source: { kind: authored }
      - pl: "Wybuch wstrząsnął ziemią."
        ru: "Взрыв потряс землю."
        source: { kind: authored }
      - pl: "W kopalni zdarzają się wybuchy metanu."
        ru: "В шахте случаются взрывы метана."
        source: { kind: authored }
  - id: outburst
    ru: "вспышка, взрыв (гнева, смеха); начало (войны)"
    examples:
      - pl: "Zareagował wybuchem gniewu."
        ru: "Он отреагировал вспышкой гнева."
        source: { kind: authored }
      - pl: "Wybuchy śmiechu dochodziły z sąsiedniego pokoju."
        ru: "Взрывы смеха доносились из соседней комнаты."
        source: { kind: authored }
notes:
  - { kind: government, text: "Чего именно взрыв — в РОДИТЕЛЬНОМ падеже: wybuch gazu, wybuch gniewu, wybuch wojny. Предлог не нужен." }
  - { kind: false-friend, text: "Самое важное: wybuch wojny значит НАЧАЛО войны, а не «взрыв войны». По-русски здесь говорят «начало» или «вспышка». Переводить этот оборот дословно нельзя, хотя во всех прочих значениях wybuch — обычный «взрыв»." }
  - { kind: usage, text: "Существительное от wybuchnąć «взорваться, разразиться». Прилагательное wybuchowy значит и «взрывчатый» (materiał wybuchowy), и «вспыльчивый» о человеке — как русское «взрывной»." }
collocations:
  - { pl: "wybuch gazu", ru: "взрыв газа" }
  - { pl: "wybuch gniewu", ru: "вспышка гнева" }
  - { pl: "wybuch wojny", ru: "начало войны" }
family:
  - { pl: "wybuchnąć", ru: "взорваться; разразиться", relation: root }
  - { pl: "wybuchowy", ru: "взрывчатый; вспыльчивый", relation: derived }
etymology: "Существительное от wybuchnąć, где корень buch- звукоподражательный: он передаёт глухой удар и вырывающийся наружу звук, как в buchać «вырываться, хлестать». Русское «бухать» того же звукоподражательного происхождения, хотя значения разошлись; «взрыв» же построено от совсем другого корня."
memory: "wybuch — «взрыв», от wybuchnąć; корень buch- звукоподражательный, как в русском «бухнуть». Чего взрыв — родительный: wybuch gazu. Но wybuch wojny это «начало войны», а не «взрыв»."
idioms:
  - { pl: "wybuch wojny", ru: "начало войны" }
  - { pl: "wybuch śmiechu", ru: "взрыв смеха" }
formExamplesSkip:
  - { form: "wybuchu", cell: "Звательный", reason: "звательный падеж: для неодушевлённого существительного он практически не употребляется" }
