        ru: "Документы сгорели вместе с офисом."
        source: { kind: authored }
  - id: blush
    ru: "вспыхнуть (от стыда), залиться краской"
    examples:
      - pl: "Spłonęła rumieńcem."
        ru: "Она залилась румянцем."
        source: { kind: authored }
      - pl: "Mało nie spłonąłem ze wstydu."
        ru: "Я чуть не сгорел со стыда."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "SPŁONĄĆ — «сгореть» о доме, лесе, вещах: DOM SPŁONĄŁ. О человеке, сгоревшем на солнце, — SPIEC SIĘ, OPALIĆ SIĘ ZA MOCNO. О лампочке — PRZEPALIĆ SIĘ. Переносное SPŁONĄĆ ZE WSTYDU и SPŁONĄĆ RUMIEŃCEM совпадают с русским «сгореть со стыда», «вспыхнуть»." }
  - { kind: usage, text: "Сорок одна форма из сорока двух: глагол совершенного вида и непереходный; страдательного причастия нет, а безличная форма SPŁONIĘTO в карточку не включена: огонь не бывает безличным действием людей. Деепричастие SPŁONĄWSZY книжное. Видовой партнёр — PŁONĄĆ, «гореть»." }
  - { kind: government, text: "Где — W с местным: W POŻARZE, W OGNIU. Отчего — OD с родительным: SPŁONĄĆ OD PIORUNA. От стыда — ZE WSTYDU, Z ZAŻENOWANIA; краской — творительным: SPŁONĄĆ RUMIEŃCEM." }
  - { kind: pronunciation, text: "Читается «спуо́нонць», два слога, ударение на первом. SPŁ — «спу»: Ł короткое «у», Ą перед Ć — «он». SPŁONĄŁ — «спуо́ноу», SPŁONĘŁA — «спуонэ́уа»." }
  - { kind: register, text: "Нейтральное слово хроники: SPŁONĄŁ BUDYNEK, SPŁONĘŁY HEKTARY LASU. Переносное «вспыхнуть» — литературное. SPŁONĄĆ NA STOSIE — «сгореть на костре», исторически." }
collocations:
  - { pl: "spłonąć doszczętnie", ru: "сгореть дотла" }
  - { pl: "spłonąć ze wstydu", ru: "сгореть со стыда" }
  - { pl: "spłonąć rumieńcem", ru: "залиться румянцем" }
family:
  - { pl: "płonąć", ru: "гореть, пылать", relation: aspect, id: plonac }
  - { pl: "spalić", ru: "сжечь", relation: root, id: spalic }
  - { pl: "pożar", ru: "пожар", relation: root, id: pozar }
etymology: "Приставка S- плюс PŁONĄĆ «гореть, пылать», праславянское *polnǫti, родственное русскому «пламя», «полыхать». Польское ŁO на месте русского «ла/оло»."
memory: "Spłonąć — сгореть: dom spłonął doszczętnie. Spłonąć ze wstydu — сгореть со стыда, spłonąć rumieńcem — вспыхнуть. На солнце — spiec się! Читается «спуо́нонць»."
idioms:
  - { pl: "spłonąć ze wstydu", ru: "сгореть со стыда" }
formExamplesSkip:
  - { form: "spłonięto", reason: "безличная форма от «сгореть» неестественна" }
