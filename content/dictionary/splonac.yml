pron: { cyr: "спуо́нонць" }
senses:
  - id: burn-down
    ru: "сгореть"
    examples:
      - pl: "Dom spłonął doszczętnie."
        ru: "Дом сгорел дотла."
        source: { kind: authored }
      - pl: "W pożarze spłonęło pół miasta."
