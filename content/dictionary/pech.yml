        ru: "После серии неудач он наконец выиграл."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Слово абстрактное, а грамматический род у него второй мужской, то есть одушевлённый. Отсюда главное следствие: винительный падеж совпадает с родительным, и будет PECHA, а не pech. Именно поэтому устойчивое выражение звучит MIEĆ PECHA «не повезти», и сказать mieć pech нельзя — форма просто не существует в этом значении. Польский обходится так с небольшой группой неодушевлённых слов, и pech из них самое употребительное." }
  - { kind: government, text: "Русский строит эту мысль безлично и вовсе без существительного: «мне не повезло», «ему не везёт». Польский же ставит обычное подлежащее и прямое дополнение: MIAŁEM PECHA, MASZ PECHA, ON MA PECHA. Переводить дословно в обе стороны не выйдет — приходится менять конструкцию целиком, а не подбирать слова. Есть и безличный польский оборот NIE POWIODŁO MI SIĘ, но он книжнее и в разговоре уступает mieć pecha." }
  - { kind: usage, text: "Родительный PECHA и местный PECHU расходятся, в отличие от PLIKU из партии 223, где родительный с местным слились. Сравнение полезное: у plik родительный взял -u и совпал с местным, у pech родительный взял -a по одушевлённому образцу, и формы остались разными. Множественное число PECHY тоже есть и означает отдельные неудачи, а не невезение в целом." }
collocations:
  - { pl: "mieć pecha", ru: "не повезти" }
  - { pl: "co za pech", ru: "вот незадача" }
  - { pl: "pech w miłości", ru: "неудача в любви" }
family:
  - { pl: "pechowy", ru: "незадачливый, злополучный", relation: derived }
  - { pl: "pechowiec", ru: "неудачник", relation: derived }
etymology: "Из немецкого PECH «смола, вар» — того же слова, что английское pitch. Значение «неудача» выросло из смолы, которой ловили птиц: попасть в смолу значило влипнуть, и в студенческом жаргоне девятнадцатого века слово стало значить невезение. Русский этого заимствования не взял вовсе и обходится безличным «не везёт», так что по звучанию pech не разгадать — родственного слова в русском просто нет."
memory: "Одушевлённый по грамматике, хотя смысл абстрактный: винительный pecha, отсюда mieć pecha. По-русски это безличное «не повезло», конструкция другая целиком."
idioms:
