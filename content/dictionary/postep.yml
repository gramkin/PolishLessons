# review
id: postep
format: 2
lemma: "postęp"
rank: 2197
pos: noun
pron: { cyr: "по́стэмп" }
senses:
  - id: progress
    ru: "прогресс"
    examples:
      - pl: "Postęp techniczny trudno zatrzymać."
        ru: "Технический прогресс трудно остановить."
