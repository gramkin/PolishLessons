notes:
  - { kind: false-friend, text: "Корень знакомый — po- плюс stęp-, тот же, что в stąpać «ступать» и wystąpić «выступить», — но русское слово от него другое. «Поступь» значит походку, а польское postęp это ПРОГРЕСС. Во множественном числе postępy значит «успехи»: robić postępy «делать успехи». Ни «поступь», ни «поступок» сюда не подходят." }
  - { kind: pronunciation, text: "ę перед p звучит как эм, а конечное p оглушается: postęp — «по́стэмп». Обратите внимание на чередование внутри гнезда: в postęp носовой передний, ę, а в stąpać задний, ą. Ровно та же пара в wystąpić и występ." }
  - { kind: usage, text: "Единственное число значит «прогресс» как явление, множественное — «успехи» конкретного человека: robić postępy w nauce, postępy ucznia. Прилагательное postępowy значит «прогрессивный», а глагол postępować — и «поступать», и «продвигаться»." }
collocations:
  - { pl: "postęp techniczny", ru: "технический прогресс" }
  - { pl: "robić postępy", ru: "делать успехи" }
  - { pl: "postęp choroby", ru: "развитие болезни" }
family:
  - { pl: "postępować", ru: "поступать; продвигаться", relation: derived, id: postepowac }
  - { pl: "postępowy", ru: "прогрессивный", relation: derived }
  - { pl: "stąpać", ru: "ступать", relation: root }
  - { pl: "wystąpić", ru: "выступить", relation: derived, id: wystapic }
etymology: "Приставка po- плюс корень stęp-/stąp-, от общеславянского *stop-, давшего русские «ступить» и «ступать». Польский развил его в сторону движения вперёд: postęp «прогресс», postępować «продвигаться». Русская «поступь» от того же корня, но осталась при походке. Отсюда postępowy и następstwo «последствие»."
memory: "postęp — «прогресс», а не «поступь», хотя корень тот же, что в stąpać. Во множественном числе значение другое: postępy это «успехи», robić postępy — делать успехи. И произношение с оглушением: «по́стэмп»."
idioms:
  - { pl: "robić postępy", ru: "делать успехи" }
  - { pl: "postęp techniczny", ru: "технический прогресс" }
