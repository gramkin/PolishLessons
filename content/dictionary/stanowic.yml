notes:
  - { kind: false-friend, text: "Самая опасная ловушка этой карточки: STANOWIĆ не значит «становиться». Русское «становиться» по-польски STAWAĆ SIĘ или ZOSTAWAĆ: ON STAJE SIĘ NERWOWY «он становится нервным». А STANOWIĆ значит «составлять, представлять собой»: KOBIETY STANOWIĄ POŁOWĘ ZESPOŁU «женщины составляют половину коллектива». Разница такая, что фраза понимается наоборот: TO STANOWI PROBLEM это «это представляет собой проблему», а не «это становится проблемой», которое было бы TO STAJE SIĘ PROBLEMEM. Проверка простая: после STANOWIĆ идёт винительный падеж того, чем предмет является, а после STAWAĆ SIĘ — творительный." }
  - { kind: usage, text: "Несовершенный вид, переходный, шестьдесят три формы: сорок две от глагола, десять от действительного причастия STANOWIĄCY, одиннадцать от страдательного STANOWIONY. Страдательное причастие в этом гнезде не книжная редкость, а юридический термин: PRAWO STANOWIONE значит «статутное, писаное право», в отличие от PRAWO ZWYCZAJOWE «обычного права». Совершенной пары у глагола в значении «составлять» нет вовсе, и это естественно: составлять половину чего-то — состояние, а не событие. Приставочные глаголы живут отдельной жизнью и совершенными парами к STANOWIĆ не являются: POSTANOWIĆ значит «решить, постановить», USTANOWIĆ — «учредить, установить»." }
  - { kind: government, text: "Переходный: что собой составляет — винительный без предлога, STANOWIĆ POŁOWĘ, STANOWIĆ PROBLEM, STANOWIĆ WYJĄTEK, STANOWIĆ ZAGROŻENIE. В юридическом языке вводит придаточное с ŻE: USTAWA STANOWI, ŻE TERMIN WYNOSI TRZYDZIEŚCI DNI «закон устанавливает, что срок составляет тридцать дней». С предлогом O и местным значит «определять, решать что-то»: STANOWIĆ O CZYMŚ, и отсюда важный оборот PRAWO DO STANOWIENIA O SOBIE «право распоряжаться собой, право на самоопределение». Отрицание требует родительного, как у всех переходных глаголов: NIE STANOWI PROBLEMU, а не NIE STANOWI PROBLEM." }
  - { kind: pronunciation, text: "Читается «стано́виць», три слога, ударение на предпоследнем. Сочетание WI даёт «ви», конечное Ć — мягкое «ць». Самое интересное в повелительной форме: STANÓW. Буква Ó читается как «у», а конечное W оглушается в «ф», так что форма звучит «стану́ф», хотя пишется через Ó и W. Это общее правило: Ó появляется в закрытом слоге там, где в других формах стоит O, сравните STANOWIĆ и STANÓW, MÓGŁ и MOGŁA. Формы STANÓWMY и STANÓWCIE сохраняют то же Ó, но W перед M и C озвончения не теряет: «стану́вмы», «стану́вце»." }
