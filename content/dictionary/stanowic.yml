etymology: "От STAN «состояние, положение», из праславянского *stanъ, и дальше от *stati «стать». Русский корень тот же: «стан», «становить», «становиться», «постановить», «установить». Разошлись языки в судьбе простого глагола. Польский сохранил беспрефиксное STANOWIĆ как живое и частое слово со значением «составлять, представлять собой», а русский беспрефиксное «становить» утратил почти целиком и держит его только под приставками: «постановить», «установить», «восстановить». Поэтому русскоязычный встречает в польском знакомый корень в непривычной роли и достраивает смысл по ближайшему русскому слову — «становиться», — получая ровно противоположное значение. Чередование O и Ó в повелительном STANÓW — обычное польское удлинение гласного в закрытом слоге, то же, что в MÓGŁ при MOGŁA и в STÓŁ при STOŁU."
memory: "Корень stan — русский «стан», и гнездо знакомое: postanowić «постановить», ustanowić «установить». Но беспрефиксное stanowić русский потерял, и отсюда главная ошибка: stanowić это НЕ «становиться», а «составлять, представлять собой». Kobiety stanowią połowę zespołu — «составляют половину». «Становиться» по-польски stawać się. Проверка по падежу: stanowić + винительный, stawać się + творительный. Страдательное причастие живёт в юридическом термине prawo stanowione «статутное право». Повелительное stanów звучит «стану́ф»: ó это «у», конечное w оглушается."
