etymology: "От прилагательного NIESAMOWITY, а то — отрицание старого SAMOWITY «обычный, естественный, сам собою такой», образованного от SAM. Значит, исходно NIESAMOWITY — «не естественный, не такой, как сам собою бывает», отсюда «жуткий, неправдоподобный». Положительное слово из языка ушло, и отрицание осталось без пары, как в русском «нелепый», где «лепый» уже не живёт. Дальше произошло обычное для усилителей ослабление: из «жуткого» вышло просто «очень», и теперь NIESAMOWICIE DOBRY значит всего лишь «очень хороший», без всякой жути."
memory: "Наречия в польском градуируются: niesamowicie — niesamowiciej — najniesamowiciej, окончаниями, а не словами «более» и «самый». И nie- здесь не отнимается: samowity давно умерло, как русское «лепый» в «нелепом». Читается «несамови́че», cie — это «че»."
idioms:
