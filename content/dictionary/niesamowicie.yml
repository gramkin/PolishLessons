notes:
  - { kind: usage, text: "Наречие, и у него есть три степени сравнения — это и есть главное, что стоит унести с карточки. Польские наречия градуируются так же, как прилагательные, только окончаниями на -IE и -IEJ: NIESAMOWICIE, NIESAMOWICIEJ, NAJNIESAMOWICIEJ. Русский в таких случаях обходится словами «более» и «самый», а польский меняет само наречие. Поэтому формы вроде NAJNIESAMOWICIEJ выглядят пугающе длинными, но строятся по простому правилу: NAJ- в начале, -IEJ в конце." }
  - { kind: false-friend, text: "Приставка NIE- обманывает. На вид слово разбирается как «не-самовито», и русский ищет корень SAMOWITY, чтобы отнять от него отрицание, — но SAMOWITY в современном польском не существует, оно умерло несколько веков назад, когда значило «обычный, естественный». Поэтому NIESAMOWITY и NIESAMOWICIE надо запоминать целиком, а не как отрицание: это не «не невероятно», а просто «невероятно». Отрицается слово обычным способом: NIE BYŁO NIESAMOWICIE GORĄCO." }
  - { kind: pronunciation, text: "Читается «несамови́че», в пять слогов, с ударением на предпоследнем, то есть на WI. Сочетание cie даёт мягкое «че»: не «ние-само-ви-ци-е», а «не-са-мо-ви́-че». Начальное nie звучит «не», одним слогом. В превосходной степени NAJNIESAMOWICIEJ ударение уходит на предпоследний слог всего слова, «найнесамови́чей», и слово остаётся одним целым, без паузы после NAJ." }
  - { kind: government, text: "Наречие ничем не управляет и падежей не требует. Стоит обычно перед тем словом, которое усиливает: NIESAMOWICIE GORĄCO, NIESAMOWICIE DOBRY, NIESAMOWICIE DUŻO. С глаголом ставится и перед ним, и после: NIESAMOWICIE SIĘ UCIESZYŁ или UCIESZYŁ SIĘ NIESAMOWICIE. В разговорной речи это один из самых частых усилителей, рядом с STRASZNIE и OKROPNIE, которые тоже значат «очень», хотя буквально означают «страшно» и «ужасно»." }
