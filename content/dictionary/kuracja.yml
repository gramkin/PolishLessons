notes:
  - { kind: government, text: "Женский род: kuracja, kuracji, kurację. Частые глаголы: przejść kurację, zalecić kurację, przerwać kurację." }
  - { kind: usage, text: "Не отдельный приём лекарства, а именно курс — последовательность процедур или приёмов." }
  - { kind: usage, text: "Отсюда kuracjusz «отдыхающий на курорте, пациент санатория» — слово, которого в русском нет." }
  - { kind: false-friend, text: "Существительного «курация» в русском нет. Однокоренные русские слова — «куратор» и «курировать», от того же латинского curare «заботиться»." }
collocations:
  - { pl: "przejść kurację", ru: "пройти курс лечения" }
  - { pl: "kuracja odchudzająca", ru: "курс похудения" }
  - { pl: "przerwać kurację", ru: "прервать лечение" }
family:
  - { pl: "kuracjusz", ru: "отдыхающий, пациент санатория", relation: derived }
  - { pl: "kuracyjny", ru: "лечебный, курортный", relation: derived }
etymology: "Через латинское curatio «попечение, лечение» от curare «заботиться». От того же корня русские «куратор» и «курировать», так что kuracja это «то, о чём заботятся»."
memory: "kuracja — именно курс лечения, а не одна процедура. Корень тот же, что в «куратор»: от латинского curare «заботиться»."
idioms:
  - { pl: "przejść kurację", ru: "пройти курс лечения" }
formExamplesSkip:
  - { form: "kuracyj", reason: "дореформенный родительный падеж множественного числа: до 1936 года на месте нынешнего -ii/-ji писали -yj после c, s, z. Нормой остаётся kuracji, а kuracyj встречается только в старых текстах. По этому же основанию отказано формам teoryj, racyj, seryj и reakcyj" }
