family:
  - { pl: "odprawic", ru: "отправить, отослать; отслужить", relation: root }
  - { pl: "sprawa", ru: "дело", relation: root, id: sprawa }
  - { pl: "wyprawa", ru: "поход, экспедиция", relation: root, id: wyprawa }
etymology: "От ODPRAWIĆ «отослать, совершить», из приставки OD- и корня PRAW-, того же, что в русских «править», «справить», «право». Из этого корня польский произвёл целое гнездо с разными приставками: SPRAWA «дело», WYPRAWA «поход», PRZEPRAWA «переправа», ODPRAWA «досмотр». Русский от того же корня построил своё гнездо, но приставки распределил иначе, и потому прямого соответствия у ODPRAWA нет ни одного."
memory: "Не «отправка»: odprawa это досмотр, оформление или совещание, а отправка груза будет wysyłka. И держитесь подальше от oprawy: oprawa, без d, это «оправа» очков или переплёт книги. Три живых значения: odprawa celna «таможенный досмотр», odprawa pieniężna «выходное пособие», odprawa poranna «утренний инструктаж». Читается «отпра́ва», d перед p оглушается до «т»."
idioms:
  - { pl: "odprawa celna", ru: "таможенный досмотр" }
