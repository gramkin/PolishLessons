notes:
  - { kind: false-friend, text: "Слово обманывает дважды. Во-первых, это не «отправка»: ODPRAWA это процедура, досмотр или оформление, а отправка груза будет WYSYŁKA. Во-вторых, от него на одну букву стоит OPRAWA, и это уже «оправа» очков или переплёт книги. ODPRAWA и OPRAWA различаются только буквой D, а значат совсем разное, и в речи их надо разводить твёрдо." }
  - { kind: usage, text: "Десять форм, женский род. В дательном и местном падеже единственного числа W переходит в WI: ODPRAWA, но NA ODPRAWIE. Слово держит сразу три значения, и все три обиходны: пограничный или таможенный досмотр, выходное пособие при увольнении и служебное совещание. Различает их только определение рядом: CELNA, PIENIĘŻNA, PORANNA." }
  - { kind: government, text: "На досмотре, на совещании — предлог NA с местным падежом: NA ODPRAWIE. Пройти досмотр — PRZEJŚĆ ODPRAWĘ, винительный без предлога, тогда как русский говорит «пройти через досмотр» или просто «пройти досмотр». Получить пособие — DOSTAĆ ODPRAWĘ, винительный. Перед досмотром — PRZED ODPRAWĄ, предлог PRZED с творительным." }
  - { kind: pronunciation, text: "Читается «отпра́ва», три слога, ударение на втором. Буква D перед глухим P оглушается и звучит как «т», поэтому начало слова это «от», а не «од»: то же правило, что в ODPOCZYNEK «отпочы́нэк». В местном падеже ODPRAWIE сочетание WIE даёт мягкое «ве», и слышно «отпра́ве»." }
  - { kind: register, text: "Слово нейтральное и в трёх кругах ежедневное. В аэропорту: ODPRAWA BILETOWO-BAGAŻOWA, то есть регистрация на рейс, и слово это звучит в каждом объявлении. В кадровом деле: ODPRAWA PIENIĘŻNA, пособие при сокращении, о котором говорит кодекс труда. В армии и в полиции: ODPRAWA PORANNA, утреннее совещание со постановкой задач." }
collocations:
  - { pl: "odprawa paszportowa", ru: "паспортный контроль" }
  - { pl: "odprawa pieniężna", ru: "выходное пособие" }
