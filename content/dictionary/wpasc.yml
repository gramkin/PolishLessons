# review
id: wpasc
format: 2
lemma: "wpaść"
rank: 461
pos: verb
aspect: perf
pron: { cyr: "фпа́сць" }
senses:
  - id: fall-into
    ru: "попасть, впасть (во что-то — винительный падеж)"
    examples:
      - pl: "Wpadł w długi."
        ru: "Он влез в долги."
        source: { kind: translated, id: 3452683 }
      - pl: "Mary wpadła w depresję poporodową."
        ru: "Мэри впала в послеродовую депрессию."
        source: { kind: tatoeba, id: 8665153 }
      - pl: "Coś mi wpadło do oka."
        ru: "Мне что-то попало в глаз."
        source: { kind: translated, id: 1476011 }
  - id: drop-by
    ru: "заскочить, забежать (в гости, по дороге)"
    examples:
      - pl: "Może wpadniesz do nas?"
        ru: "Почему ты не придешь навестить нас?"
        source: { kind: tatoeba, id: 351496 }
      - pl: "Po drodze do domu wpadnę na pocztę."
        ru: "По дороге домой зайду на почту."
        source: { kind: tatoeba, id: 348629 }
      - pl: "Wpadnij do mnie."
        ru: "Заскочи ко мне."
        source: { kind: translated, id: 6309219 }
notes:
  - { kind: usage, text: "wpaść w coś — с винительным, как в русском: wpaść w długi «влезть в долги», wpaść w szał «прийти в ярость», wpaść w panikę «впасть в панику»." }
  - { kind: usage, text: "Второе значение в разговоре даже частотнее первого: wpaść do kogoś — «заскочить к кому-то». Wpadnij do mnie! «Заскочи ко мне!»" }
  - { kind: false-friend, text: "wpaść na pomysł значит «придумать» — буквально «наткнуться на мысль», а wpaść na kogoś — «случайно встретить кого-то», а вовсе не «напасть»." }
  - { kind: usage, text: "Будущее время образуется от другой основы: инфинитив wpaść, но wpadnę, wpadniesz, wpadnie. Несовершенный вид — wpadać." }
collocations:
  - { pl: "wpaść w kłopoty", ru: "попасть в неприятности" }
  - { pl: "wpaść na pomysł", ru: "придумать" }
  - { pl: "wpadnij do mnie", ru: "заскочи ко мне" }
  - { pl: "wpaść w szał", ru: "прийти в ярость" }
etymology: "Из w- + paść «упасть»; русское «впасть» — то же самое слово, и падеж после него тот же винительный."
memory: "wpaść — это русское «впасть», и управление совпадает: wpaść w długi, w szał, w panikę. Но главное польское значение разговорное — «заскочить в гости»: Wpadnij do mnie! «Заскочи ко мне!» И запомните wpaść na pomysł «придумать», буквально «наткнуться на мысль». Будущее от другой основы: wpaść, но wpadnę."
idioms:
  - { pl: "wpaść jak śliwka w kompot", ru: "попасть как кур во щи" }
  - { pl: "wpaść na pomysł", ru: "придумать" }
  - { pl: "wpaść z deszczu pod rynnę", ru: "из огня да в полымя" }
