etymology: "От SIERP «серп», от праславянского *sьrpъ, того же слова, что русский «серп». Месяц назван по главной работе этого времени, по жатве серпом. Русский в этом месте взял латинское AUGUSTUS, имя императора, и связь с хозяйственным годом потерялась. Украинское «серпень» построено точно так же, как польское, а белорусское «жнівень» от жатвы, то есть по тому же признаку другим словом. Из того же корня SIERPOWY, которое в боксе означает удар по дуге, то есть хук."
memory: "Второй славянский месяц после kwiecień: sierpień это август, от sierp «серп», месяц жатвы, и украинское «серпень» устроено так же. Русское название латинское, от императора Августа, так что опереться можно только на «серп». Парадигма повторяет kwiecień: беглое e исчезает, sierpień но sierpnia. Читается «се́рпень», два слога. Знать исторический смысл: Sierpień 1980 и porozumienia sierpniowe это начало «Солидарности»."
