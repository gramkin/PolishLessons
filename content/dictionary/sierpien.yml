notes:
  - { kind: false-friend, text: "Как и KWIECIEŃ, это слово славянское там, где русское латинское. SIERPIEŃ назван от SIERP «серп»: месяц жатвы, когда работают серпом. Русский взял латинское имя AUGUSTUS, в честь императора, и потому родства между названиями нет. Мост снова через соседей: украинское «серпень» устроено точно так же, от серпа, а белорусское «жнівень» от жатвы, то есть по тому же признаку. Русский «серп» при этом совершенно знаком, и именно за него стоит зацепиться." }
  - { kind: usage, text: "Одиннадцать форм, мужской род, и парадигма повторяет KWIECIEŃ слово в слово. Беглое E исчезает в косвенных падежах: SIERPIEŃ, но SIERPNIA, SIERPNIEM, SIERPNIU. Мягкое Ń именительного переходит в обычное N. По той же схеме идут остальные месяцы на -EŃ: GRUDZIEŃ и GRUDNIA, WRZESIEŃ и WRZEŚNIA. Выучив одну парадигму, остальные получаешь даром, и это редкий случай, когда польская морфология экономит силы." }
  - { kind: government, text: "В каком месяце — предлог W с местным падежом: W SIERPNIU «в августе». До и от — предлоги DO и OD с родительным: DO SIERPNIA, OD SIERPNIA. Дата требует родительного без предлога: PIĄTEGO SIERPNIA «пятого августа», как и по-русски. Прилагательное SIERPNIOWY значит «августовский», и именно оно входит в исторический термин POROZUMIENIA SIERPNIOWE." }
  - { kind: pronunciation, text: "Читается «се́рпень», два слога, ударение на первом. Сочетание SIE даёт мягкое «се», где I только знак мягкости, поэтому слогов два, а не три. Конечное Ń — мягкое «нь». В косвенных падежах звучит иначе: SIERPNIA это «се́рпня», без беглого E и с обычным «н». В слове SIERP, от которого назван месяц, слышно «серп», совсем как по-русски." }
  - { kind: register, text: "Слово нейтральное и ежедневное. Частые обороты: W SIERPNIU «в августе», NA POCZĄTKU SIERPNIA «в начале августа», DO KOŃCA SIERPNIA «до конца августа». Отдельно стоит исторический пласт: SIERPIEŃ 1980 и POROZUMIENIA SIERPNIOWE означают забастовки и соглашения тысяча девятьсот восьмидесятого года, с которых началась «Солидарность», и для поляка это слово с большой буквы. Прилагательное того же корня, SIERPOWY, значит в боксе «хук»." }
