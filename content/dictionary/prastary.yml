# review
id: prastary
format: 2
lemma: "prastary"
rank: 6013
pos: adj
pron: { cyr: "праста́ры" }
senses:
  - id: ancient
    ru: "древний, стародавний"
    note: "о лесе, обычае, народе, постройке"
    examples:
      - pl: "Prastary dąb rośnie na środku wsi."
        ru: "Древний дуб растёт посреди деревни."
        source: { kind: authored }
      - pl: "To prastary zwyczaj, znany od średniowiecza."
        ru: "Это древний обычай, известный со Средневековья."
        source: { kind: authored }
      - pl: "Turyści zwiedzali prastarą twierdzę nad rzeką."
        ru: "Туристы осматривали древнюю крепость над рекой."
        source: { kind: authored }
  - id: very-old
    ru: "древний, допотопный"
    note: "шутливо о вещи"
    examples:
      - pl: "Mój prastary laptop znowu się zawiesił."
        ru: "Мой древний ноутбук опять завис."
        source: { kind: authored }
      - pl: "Wysiadł z prastarego auta ojca."
        ru: "Он вылез из допотопной машины отца."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Русскому глазу слово напоминает «престарелый», но значат они разное. «Престарелый» говорят о пожилом человеке, по-польски это W PODESZŁYM WIEKU или SĘDZIWY. PRASTARY же говорят о том, что существует с незапамятных времён: PRASTARY LAS «древний лес», PRASTARY OBYCZAJ «стародавний обычай», PRASTARE PIEŚNI «древние песни». О человеке так скажут только в сказке или в шутку." }
  - { kind: register, text: "Слово книжное и поэтическое, оно живёт в легендах, путеводителях и исторических текстах. В разговоре его берут для иронии: MÓJ PRASTARY TELEFON «мой допотопный телефон». Нейтральные соседи — STARODAWNY «стародавний» и STAROŻYTNY «античный, древний» о древнем мире." }
  - { kind: usage, text: "Приставка PRA- та же, что в PRADZIADEK «прадед» и PRABABCIA «прабабушка»: она отодвигает старость к самому началу. Степеней сравнения у слова нет, поэтому форм одиннадцать. Мужско-личное множественное число, как у STARY → STARZY, меняет R на RZ: PRASTARZY BOGOWIE «древние боги»." }
collocations:
  - { pl: "prastary obyczaj", ru: "древний обычай" }
  - { pl: "prastara puszcza", ru: "древняя пуща" }
  - { pl: "prastare drzewa", ru: "древние деревья" }
family:
  - { pl: "stary", ru: "старый", relation: root, id: stary }
  - { pl: "starożytny", ru: "древний, античный", relation: root, id: starozytny }
  - { pl: "starodawny", ru: "стародавний", relation: root }
synonyms: ["pradawny", "starodawny", "odwieczny"]
etymology: "Приставка PRA- (та же, что в PRADZIADEK «прадед» и в русских «прадед», «праязык») и STARY «старый»: буквально «пра-старый», старый с самых первых времён."
memory: "Prastary — «пра-старый», как pradziadek «прадед»: древний, с незапамятных времён. Не «престарелый»: о людях так не говорят, говорят о лесах, обычаях и легендах. В шутку — о старой вещи: mój prastary laptop."
idioms:
  - { pl: "od prastarych czasów", ru: "с незапамятных времён" }
