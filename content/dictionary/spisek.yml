      - pl: "Wykryto spisek na dworze."
        ru: "При дворе раскрыли заговор."
        source: { kind: authored }
      - pl: "To był spisek milczenia."
        ru: "Это был заговор молчания."
        source: { kind: authored }
notes:
  - { kind: government, text: "Участвовать в заговоре — brać udział w spisku, предложный падеж. Примкнуть — przystać do spisku, родительный после do." }
  - { kind: false-friend, text: "Корень spisać «записать, составить список»: заговорщики буквально «сговаривались списком». Русское «заговор» построено на образе речи, польское — на образе записи." }
  - { kind: government, text: "Мужской неодушевлённый; беглое e: spisek, но spisku." }
  - { kind: usage, text: "teoria spiskowa «теория заговора» — прилагательное от этого слова, не путать с spiski «спишский» из этой же партии." }
