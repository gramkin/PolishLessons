  - id: poet-instr
    ru: "поэт (быть поэтом — poetą)"
    examples:
      - pl: "Chcę być poetą."
        ru: "Я хочу быть поэтом."
        source: { kind: tatoeba, id: 6670450 }
      - pl: "On jest poetą."
        ru: "Он поэт."
        source: { kind: translated, id: 356405 }
notes:
  - { kind: government, text: "ГЛАВНОЕ: слово кончается на -a, но род МУЖСКОЙ. В единственном числе оно склоняется как женское (poeta, poety, poecie, poetę, poetą), а согласуется как мужское: ten poeta, dobry poeta, wybitny poeta." }
  - { kind: usage, text: "Множественное выдаёт мужской личный род: poeci «поэты», poetów, poetom. Окончание -i (а не -y) и есть признак того, что речь о мужчинах." }
  - { kind: false-friend, text: "В русском «поэт» кончается на согласную, поэтому ловушки нет. Польский же ставит русскоговорящего перед странной парой: женское склонение при мужском согласовании." }
  - { kind: usage, text: "Тот же тип: kolega, kierowca, mężczyzna, artysta, turysta. Женское соответствие — poetka." }
collocations:
  - { pl: "wybitny poeta", ru: "выдающийся поэт" }
  - { pl: "być poetą", ru: "быть поэтом" }
etymology: "Из греческого ποιητής через латынь, как и русское «поэт»."
memory: "poeta — «поэт»: кончается на -a, склоняется как женское, но род МУЖСКОЙ — ten wybitny poeta. Множественное poeci выдаёт мужской личный род."
idioms:
  - { pl: "być poetą", ru: "быть поэтом" }
