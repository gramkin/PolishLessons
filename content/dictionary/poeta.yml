pos: noun
pron: { cyr: "поэ́та" }
senses:
  - id: poet
    ru: "поэт"
    examples:
      - pl: "Allen to poeta."
        ru: "Аллен — поэт."
        source: { kind: translated, id: 357649 }
      - pl: "To urodzony poeta."
        ru: "Это прирождённый поэт."
        source: { kind: translated, id: 818772 }
      - pl: "Poeta napisał wiele wierszy."
        ru: "Поэт написал много стихов."
