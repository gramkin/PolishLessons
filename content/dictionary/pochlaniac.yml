# review
id: pochlaniac
format: 2
lemma: "pochłaniać"
rank: 2334
pos: verb
aspect: imperf
pron: { cyr: "похуа́няць" }
senses:
  - id: absorb
    ru: "поглощать, впитывать"
    examples:
      - pl: "Gąbka pochłania wodę."
        ru: "Губка поглощает воду."
        source: { kind: translated, id: 11111502 }
      - pl: "Drzewa wydzielają tlen i pochłaniają dwutlenek węgla."
        ru: "Деревья выделяют кислород и поглощают углекислый газ."
        source: { kind: translated, id: 1270108 }
      - pl: "Ciemne ściany pochłaniają światło."
        ru: "Тёмные стены поглощают свет."
        source: { kind: authored }
  - id: devour
    ru: "поглощать (время, силы); проглатывать (книги)"
    examples:
      - pl: "Badania naukowe pochłaniają wiele energii, ale są tego warte."
        ru: "Научные исследования поглощают много сил, но они того стоят."
        source: { kind: translated, id: 903343 }
      - pl: "Pochłaniam jeden kryminał za drugim."
        ru: "Я проглатываю один детектив за другим."
        source: { kind: translated, id: 6441586 }
notes:
  - { kind: government, text: "Винительный падеж: pochłaniać wodę, pochłaniać czas." }
  - { kind: false-friend, text: "От chłonąć «впитывать». Русское «хлынуть» звучит похоже, но значит обратное — стремительное вытекание, а не впитывание." }
  - { kind: usage, text: "О книгах и фильмах — «проглатывать»: pochłaniać powieści. О времени и деньгах — «съедать»: to pochłania mnóstwo czasu." }
  - { kind: usage, text: "Совершенный вид — pochłonąć. Причастие pochłonięty значит «поглощённый, увлечённый»: pochłonięty pracą." }
collocations:
  - { pl: "pochłaniać czas", ru: "поглощать время" }
  - { pl: "pochłaniać książki", ru: "проглатывать книги" }
etymology: "От chłonąć «впитывать». Русское «хлынуть» похоже по звучанию, но значит противоположное."
memory: "pochłaniać — «поглощать»: и воду, и время, и книги (pochłaniać powieści «проглатывать романы»). Совершенный вид — pochłonąć."
idioms:
  - { pl: "pochłaniać czas", ru: "поглощать время" }
  - { pl: "pochłaniać książki", ru: "проглатывать книги" }
