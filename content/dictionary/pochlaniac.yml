formExamples:
  - form: "pochłania"
    pl: "Gąbka pochłania wodę."
    ru: "Губка поглощает воду."
    source: { kind: translated, id: 11111502 }
  - form: "pochłania"
    pl: "Ta praca pochłania mnóstwo czasu."
    ru: "Эта работа поглощает уйму времени."
    source: { kind: authored }
  - form: "pochłania"
    pl: "Ciemny kolor pochłania światło."
    ru: "Тёмный цвет поглощает свет."
    source: { kind: authored }
  - form: "pochłaniają"
    pl: "Drzewa wydzielają tlen i pochłaniają dwutlenek węgla."
    ru: "Деревья выделяют кислород и поглощают углекислый газ."
    source: { kind: translated, id: 1270108 }
  - form: "pochłaniają"
    pl: "Badania naukowe pochłaniają wiele energii, ale są tego warte."
    ru: "Научные исследования поглощают много сил, но они того стоят."
    source: { kind: translated, id: 903343 }
  - form: "pochłaniają"
    pl: "Rośliny pochłaniają wodę z gleby."
    ru: "Растения поглощают воду из почвы."
    source: { kind: authored }
  - form: "pochłaniam"
    pl: "Pochłaniam jeden kryminał za drugim."
    ru: "Я проглатываю один детектив за другим."
    source: { kind: translated, id: 6441586 }
  - form: "pochłaniam"
    pl: "Pochłaniam książki nocami."
    ru: "Я проглатываю книги по ночам."
    source: { kind: authored }
  - form: "pochłaniam"
    pl: "Pochłaniam wszystko, co napisał."
    ru: "Я проглатываю всё, что он написал."
    source: { kind: authored }
