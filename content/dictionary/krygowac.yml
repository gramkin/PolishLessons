format: 2
lemma: "krygować"
rank: 5829
pos: verb
aspect: imperf
pron: { cyr: "крыго́ваць" }
senses:
  - id: be-coy
    ru: "ломаться, жеманиться, притворно отказываться"
    note: "Только с się: krygować się."
    examples:
      - pl: "Nie kryguj się, weź jeszcze kawałek ciasta."
        ru: "Не ломайся, возьми ещё кусочек пирога."
        source: { kind: authored }
      - pl: "Długo się krygowała, zanim zgodziła się zaśpiewać."
        ru: "Она долго ломалась, прежде чем согласилась спеть."
        source: { kind: authored }
      - pl: "Gość krygował się, ale w końcu zjadł dokładkę."
        ru: "Гость отнекивался, но в конце концов съел добавку."
        source: { kind: authored }
  - id: pose
    ru: "кокетничать, манерничать, рисоваться"
    examples:
      - pl: "Przed kamerą aktorka zaczęła się krygować."
        ru: "Перед камерой актриса начала кокетничать."
        source: { kind: authored }
      - pl: "Krygował się przed dziewczynami jak paw."
        ru: "Он красовался перед девушками, как павлин."
        source: { kind: authored }
      - pl: "Nie znoszę, kiedy ktoś się tak kryguje."
        ru: "Терпеть не могу, когда кто-то так манерничает."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Глагол употребляется только с SIĘ: KRYGOWAĆ SIĘ «ломаться, жеманиться». Самое частое употребление — повелительное NIE KRYGUJ SIĘ! «не ломайся!», когда человек из скромности или для вида отказывается от угощения, комплимента, просьбы спеть." }
  - { kind: false-friend, text: "Не путать с KRYĆ «прятать, крыть»: KRYGOWAĆ SIĘ с ним не связан. Русское «крыть» тут не подсказка." }
  - { kind: usage, text: "Несовершенный вид, спряжение на -UJĘ: KRYGUJĘ SIĘ, KRYGUJESZ SIĘ, KRYGUJĄ SIĘ. Страдательных причастий (KRYGOWANY) у возвратного глагола нет." }
  - { kind: register, text: "Разговорное слово с лёгкой иронией: так говорят о притворной скромности или манерности. Нейтральный синоним — WDZIĘCZYĆ SIĘ «кокетничать», для отказа из вежливости — DAĆ SIĘ PROSIĆ «заставлять себя упрашивать»." }
collocations:
  - { pl: "nie kryguj się", ru: "не ломайся, не стесняйся" }
  - { pl: "krygować się przed kimś", ru: "кокетничать перед кем-то" }
  - { pl: "krygować się jak panienka", ru: "жеманиться, как барышня" }
family:
  - { pl: "krygowanie", ru: "жеманство, ломание", relation: derived }
  - { pl: "wdzięczyć się", ru: "кокетничать, жеманиться", relation: root }
etymology: "Происхождение слова неясно. В современном языке оно живёт только как возвратный глагол KRYGOWAĆ SIĘ."
memory: "Nie kryguj się! — «не ломайся!»: гостю, который для вида отказывается от второго куска торта."
