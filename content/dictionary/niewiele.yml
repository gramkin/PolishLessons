# review
id: niewiele
format: 2
lemma: "niewiele"
rank: 1254
pos: num
pron: { cyr: "невье́ле" }
senses:
  - id: little
    ru: "немного, мало (о вещах)"
    examples:
      - pl: "To niewiele."
        ru: "Это немного."
        source: { kind: translated, id: 7002335 }
      - pl: "Mam niewiele książek."
        ru: "У меня мало книг."
        source: { kind: translated, id: 6157986 }
      - pl: "Ma niewiele pieniędzy."
        ru: "У него мало денег."
        source: { kind: translated, id: 531077 }
  - id: few-people
    ru: "niewielu — немногие (мужско-личная форма)"
    examples:
      - pl: "Niewielu tak myśli."
        ru: "Немногие так думают."
        source: { kind: translated, id: 610640 }
      - pl: "Niewiele kobiet zostaje matkami."
        ru: "Немногие женщины становятся матерями."
        source: { kind: tatoeba, id: 668685 }
      - pl: "Niewielu studentów rozumie łacinę."
        ru: "Немногие студенты понимают латынь."
        source: { kind: translated, id: 362548 }
notes:
  - { kind: usage, text: "Формы niewiela, niewielą и niewielo оставлены без примеров: таких слов нет. Склонение — niewiele (именительный и винительный), niewielu (мужско-личная форма и косвенные падежи), niewieloma (творительный). niewielo- бывает только первой частью сложных слов." }
  - { kind: government, text: "Как и wiele, требует родительного падежа: niewiele pieniędzy «мало денег», niewielu studentów «немногие студенты»." }
  - { kind: usage, text: "Форма niewielu — мужско-личная, о мужчинах и смешанных группах. Обо всём остальном — niewiele: niewiele kobiet, niewiele książek." }
  - { kind: usage, text: "Niewiele brakowało! значит «Чуть не случилось!», буквально «немного не хватало»." }
  - { kind: false-friend, text: "Отличайте от niewielki «небольшой»: это прилагательное, а niewiele — числительное." }
collocations:
  - { pl: "niewiele pieniędzy", ru: "мало денег" }
  - { pl: "niewielu ludzi", ru: "немного людей" }
  - { pl: "niewiele brakowało", ru: "чуть не случилось" }
etymology: "Отрицание nie плюс wiele «много» — ровно как русское «немного» из «не» и «много»."
memory: "niewiele — «немного, мало», с родительным падежом: niewiele pieniędzy. Мужско-личная форма — niewielu: niewielu studentów. И запомните оборот Niewiele brakowało! «Чуть не случилось!»."
idioms:
  - { pl: "niewiele brakowało", ru: "чуть не случилось" }
  - { pl: "niewiele się zmieniło", ru: "мало что изменилось" }
  - { pl: "niewielu ludzi", ru: "немного людей" }
