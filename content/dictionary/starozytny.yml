notes:
  - { kind: usage, text: "Слово указывает на древность не вообще, а на конкретную эпоху: Грецию, Рим, Египет, мир до средневековья. Просто очень старое по-польски будет DAWNY или PRASTARY, а starożytny zwyczaj слышится как обычай античных времён. Мужская личная форма работает как существительное: STAROŻYTNI значит «древние», античные авторы и народы, ровно как у нас." }
  - { kind: usage, text: "Форм тридцать три: одиннадцать на каждую из трёх степеней. Рядом в этой же подборке стоят zagubiony и mokry с одиннадцатью, и сравнение показывает, что число форм само по себе ничего не объясняет. У starożytny степени есть, потому что древность измерима: один слой бывает старше другого, и археологи так и говорят." }
