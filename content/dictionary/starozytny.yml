etymology: "Сложение двух корней: STARY «старый» и żyt- от ŻYĆ «жить», то есть «из давно прожитого». Русский построил для той же мысли «стародавний», тоже сложением, но из других частей. Существительное starożytność отвечает нашей «древности» и «античности» сразу, потому что польский не делит эти два понятия."
memory: "starożytny — про античность, а просто старое будет dawny. И starożytni без существительного значит «древние»."
