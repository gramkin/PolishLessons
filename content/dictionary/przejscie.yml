# review
id: przejscie
format: 2
lemma: "przejście"
rank: 6011
pos: noun
pron: { cyr: "пшэ́йсьце" }
senses:
  - id: passage
    ru: "переход, проход"
    examples:
      - pl: "Przejście dla pieszych jest tuż za rogiem."
        ru: "Пешеходный переход сразу за углом."
        source: { kind: authored }
      - pl: "Tłum zablokował przejście."
        ru: "Толпа перекрыла проход."
        source: { kind: translated, id: 12401015 }
      - pl: "Na przejściu granicznym stoi długa kolejka."
        ru: "На пограничном переходе стоит длинная очередь."
        source: { kind: authored }
  - id: transition
    ru: "переход (от одного к другому)"
    examples:
      - pl: "Przejście na emeryturę było dla niego trudne."
        ru: "Выход на пенсию дался ему тяжело."
        source: { kind: authored }
      - pl: "Przejście od teorii do praktyki zajęło rok."
        ru: "Переход от теории к практике занял год."
        source: { kind: authored }
  - id: ordeal
    ru: "тяжёлое испытание, пережитое"
    note: "обычно во множественном числе"
    examples:
      - pl: "Po takich przejściach trudno komuś zaufać."
        ru: "После таких испытаний трудно кому-то доверять."
        source: { kind: authored }
      - pl: "Ma za sobą ciężkie przejścia."
        ru: "У него за плечами тяжёлые испытания."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Родительный множественного PRZEJŚĆ совпадает с глаголом PRZEJŚĆ «перейти»: KILKA PRZEJŚĆ — «несколько переходов», CHCĘ PRZEJŚĆ — «хочу перейти». Различает только контекст." }
  - { kind: government, text: "Переход к чему-то новому — PRZEJŚCIE NA + винительный, как в русском «переход на»: PRZEJŚCIE NA EMERYTURĘ «выход на пенсию», NA DIETĘ «переход на диету». Переход от одного к другому — OD … DO …" }
  - { kind: false-friend, text: "KOBIETA PO PRZEJŚCIACH — не «женщина после переходов», а «женщина с тяжёлым прошлым»: во множественном числе PRZEJŚCIA — пережитые беды." }
  - { kind: pronunciation, text: "Читается «пшэ́йсьце»: RZ после P оглушается в «ш», ŚCI — мягкое «сьц». Ударение на первом слоге." }
collocations:
  - { pl: "przejście dla pieszych", ru: "пешеходный переход" }
  - { pl: "przejście graniczne", ru: "пограничный переход" }
  - { pl: "przejście podziemne", ru: "подземный переход" }
  - { pl: "przejście na emeryturę", ru: "выход на пенсию" }
family:
  - { pl: "przejść", ru: "перейти, пройти", relation: root, id: przejsc }
  - { pl: "przechodzić", ru: "переходить, проходить", relation: root, id: przechodzic }
  - { pl: "przechodzień", ru: "прохожий", relation: root }
  - { pl: "przejściowy", ru: "переходный, временный", relation: derived }
etymology: "Отглагольное существительное от PRZEJŚĆ «перейти»: приставка PRZE- (русская ПЕРЕ-) и IŚĆ «идти»."
memory: "Przejście — пере-йти-е, «переход». Przejście dla pieszych — пешеходный переход; po przejściach — после тяжёлых испытаний."
idioms:
  - { pl: "kobieta po przejściach", ru: "женщина с тяжёлым прошлым" }
