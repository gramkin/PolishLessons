# review
id: metalowy
format: 2
lemma: "metalowy"
rank: 4646
pos: adj
pron: { cyr: "мэтало́вы" }
senses:
  - id: of-metal
    ru: "металлический (из металла)"
    examples:
      - pl: "Na drzwiach wisiała metalowa tabliczka."
        ru: "На двери висела металлическая табличка."
        source: { kind: authored }
      - pl: "Wrzucił klucze do metalowego pudełka."
        ru: "Он бросил ключи в металлическую коробку."
        source: { kind: authored }
      - pl: "Kupiliśmy metalowe łóżko do pokoju gościnnego."
        ru: "Мы купили металлическую кровать в гостевую комнату."
        source: { kind: authored }
  - id: heavy-metal
    ru: "метал-, относящийся к музыке хеви-метал"
    examples:
      - pl: "Mój brat słucha tylko muzyki metalowej."
        ru: "Мой брат слушает только металл."
        source: { kind: authored }
      - pl: "W sobotę gra tu zespół metalowy z Norwegii."
        ru: "В субботу здесь играет метал-группа из Норвегии."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Русское «металлический» длиннее и имеет суффикс -ическ-, польское METALOWY — простой суффикс -OWY, как в DREWNIANY и SZKLANY рядом. Польское METALICZNY тоже есть, но это «металлический на вид или на звук»: METALICZNY GŁOS, METALICZNY LAKIER. Из металла — METALOWY, похож на металл — METALICZNY. И в польском одна L: METAL, METALOWY, а не «металл»." }
  - { kind: usage, text: "Относительное прилагательное, степеней сравнения нет. Все одиннадцать форм живые. Форма для мужчин-людей METALOWI встречается во втором значении: METALOWI MUZYCY, METALOWI FANI, то есть люди из метал-сцены. В первом значении она не нужна: из металла людей не делают." }
  - { kind: government, text: "Сорт ставят после существительного: DRUT METALOWY, KONSTRUKCJA METALOWA, ZESPÓŁ METALOWY. Перед существительным прилагательное встаёт, когда описывает: METALOWA SKRZYNKA, METALOWE DRZWI. Из металла — Z METALU, родительный: DRZWI Z METALU, то же самое, только длиннее." }
  - { kind: pronunciation, text: "Читается «мэтало́вы», четыре слога, ударение на предпоследнем. ME даёт твёрдое «мэ», как в METAL «мэ́тал». L здесь перед гласной, поэтому «л», а не «ль». Конечная Y — «ы»." }
  - { kind: register, text: "В первом значении слово нейтральное и техническое, его видно в инструкциях и на ценниках. Во втором оно разговорное, из речи меломанов: KONCERT METALOWY, METALOWA KAPELA. Слушателей метала по-польски зовут METALOWCY или METALE, и второе — уже чистый сленг." }
collocations:
  - { pl: "metalowa konstrukcja", ru: "металлическая конструкция" }
  - { pl: "zespół metalowy", ru: "метал-группа" }
  - { pl: "drut metalowy", ru: "металлическая проволока" }
family:
  - { pl: "metal", ru: "металл", relation: root, id: metal }
  - { pl: "metaliczny", ru: "металлический (на вид или звук)", relation: derived }
  - { pl: "metalowiec", ru: "металлист (рабочий или поклонник метала)", relation: derived }
etymology: "От METAL, через латинское metallum из греческого métallon, «рудник, шахта». Русское «металл» пришло тем же путём, но сохранило двойное L латыни, а польский его упростил. Музыкальное значение — калька с английского heavy metal семидесятых, и в нём польское METALOWY оказалось удобнее русского, которому пришлось занять «метал» с одной L."
memory: "Metalowy — из металла: metalowa skrzynka, metalowe drzwi. А похож на металл — metaliczny. В польском одна l: metal. И ещё metalowy — про музыку: zespół metalowy, metalowi muzycy."
idioms:
