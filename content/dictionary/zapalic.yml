pron: { cyr: "запа́лиць" }
senses:
  - id: light
    ru: "зажечь (свечу, спичку), включить свет"
    examples:
      - pl: "Zapal świece."
        ru: "Зажги свечи."
        source: { kind: tatoeba, id: 3657567 }
      - pl: "Zapal świecę."
        ru: "Зажги свечу."
        source: { kind: translated, id: 10468221 }
      - pl: "Zapalił świecę."
        ru: "Он зажёг свечу."
        source: { kind: translated, id: 6155999 }
      - pl: "Zapalił zapałkę."
        ru: "Он зажёг спичку."
        source: { kind: tatoeba, id: 563967 }
      - pl: "Proszę zapalić światło."
        ru: "Пожалуйста, включите свет."
        source: { kind: translated, id: 5902999 }
      - pl: "Zapaliłem światła."
        ru: "Я включил свет."
        source: { kind: translated, id: 363011 }
  - id: smoke
    ru: "закурить"
    examples:
      - pl: "Chcę zapalić."
        ru: "Хочу курить."
        source: { kind: tatoeba, id: 2493550 }
      - pl: "Czy mogę zapalić?"
        ru: "Можно мне закурить?"
        source: { kind: translated, id: 359149 }
      - pl: "Uległem pokusie i zapaliłem papierosa."
        ru: "Я поддался искушению и закурил сигарету."
        source: { kind: translated, id: 360998 }
  - id: inflammation
    ru: "zapalenie — воспаление"
    examples:
      - pl: "Mam zapalenie ucha."
        ru: "У меня воспаление уха."
        source: { kind: translated, id: 5890525 }
      - pl: "Tom umarł na zapalenie płuc."
        ru: "Том умер от воспаления лёгких."
        source: { kind: translated, id: 8672260 }
      - pl: "Mam zapalenie wyrostka robaczkowego."
        ru: "У меня воспаление аппендикса."
        source: { kind: translated, id: 1021815 }
notes:
  - { kind: usage, text: "Совершенный вид; несовершенная пара — zapalać. Карточка palić «курить, жечь» — другой глагол: zapalić значит именно «зажечь» или «закурить одну сигарету»." }
  - { kind: usage, text: "Отглагольное существительное zapalenie значит не «зажигание», а «воспаление»: zapalenie płuc «воспаление лёгких», zapalenie ucha «отит»." }
  - { kind: usage, text: "Прилагательное zapalony значит «заядлый»: zapalony kolekcjoner «заядлый коллекционер»." }
  - { kind: usage, text: "О свете и двигателе: zapalić światło «включить свет», zapalić samochód «завести машину»." }
collocations:
  - { pl: "zapalić świecę", ru: "зажечь свечу" }
  - { pl: "zapalić światło", ru: "включить свет" }
  - { pl: "zapalenie płuc", ru: "воспаление лёгких" }
etymology: "za- + palić «жечь», праславянское *paliti. Русское «запалить» — то же самое слово, но в русском оно просторечное, а в польском zapalić совершенно обиходно."
memory: "zapalić — «зажечь» и «закурить»: zapalić świecę, Mogę zapalić? А вот zapalenie — это не «зажигание», а «воспаление»: zapalenie płuc."
