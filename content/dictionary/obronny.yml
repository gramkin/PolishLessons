etymology: "От OBRONA «оборона», от BRONIĆ «защищать». Польское -RO- на месте русского «-оро-», как в BRONIĆ и «оборонять», GŁOWA и «голова»."
memory: "Obronny — оборонительный, защитный. Mur obronny, reakcja obronna. Защитная каска — kask ochronny! Читается «обро́нны»."
