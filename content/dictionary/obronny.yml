# review
id: obronny
format: 2
lemma: "obronny"
rank: 5347
pos: adj
pron: { cyr: "обро́нны" }
senses:
  - id: defensive
    ru: "оборонительный, защитный"
    examples:
      - pl: "Zamek otaczał mur obronny."
        ru: "Замок окружала оборонительная стена."
        source: { kind: authored }
      - pl: "Kraj zwiększył wydatki na cele obronne."
        ru: "Страна увеличила расходы на оборону."
        source: { kind: authored }
      - pl: "Zbudowano wieżę obronną."
        ru: "Построили оборонительную башню."
        source: { kind: authored }
  - id: protective
    ru: "защитный (о реакции, механизме)"
    examples:
      - pl: "Płacz to reakcja obronna."
        ru: "Плач — защитная реакция."
        source: { kind: authored }
      - pl: "Kolce to obronny mechanizm rośliny."
        ru: "Колючки — защитный механизм растения."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "OBRONNY и русское «оборонный» — одно слово: польское OBRONA соответствует «оборона», с выпавшим гласным. Но там, где по-русски «защитный», поляки тоже говорят OBRONNY: REAKCJA OBRONNA, MECHANIZM OBRONNY. «Защитный» о цвете или одежде — OCHRONNY: KASK OCHRONNY, «защитная каска»." }
  - { kind: usage, text: "Десять форм: без степеней и без формы для мужчин-людей, людей OBRONNYMI не называют. Защитник в спорте — OBROŃCA, а не прилагательное. В названиях: PRZEMYSŁ OBRONNY, «оборонная промышленность», MURY OBRONNE, «крепостные стены»." }
  - { kind: government, text: "Обычно стоит после существительного, как термин: MUR OBRONNY, SYSTEM OBRONNY, POSTAWA OBRONNA. Перед ним — реже и в книжной речи." }
  - { kind: pronunciation, text: "Читается «обро́нны», три слога, ударение на предпоследнем. Двойное N тянется, оба O ясные, без русского «а»." }
  - { kind: register, text: "Нейтральный термин военной истории, архитектуры, политики и психологии. В быту чаще встречается OBRONA и BRONIĆ SIĘ." }
collocations:
