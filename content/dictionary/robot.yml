# review
id: robot
format: 2
lemma: "robot"
rank: 1551
pos: noun
pron: { cyr: "ро́бот" }
senses:
  - id: machine
    ru: "робот"
    examples:
      - pl: "Robot uległ awarii."
        ru: "Робот вышел из строя."
        source: { kind: translated, id: 2049300 }
      - pl: "Robot może wykonać więcej pracy niż człowiek."
        ru: "Робот может выполнить больше работы, чем человек."
        source: { kind: translated, id: 1348859 }
      - pl: "Tom zbudował robota."
        ru: "Том построил робота."
        source: { kind: translated, id: 9678321 }
  - id: person
    ru: "робот (о бездушном, механическом человеке)"
    examples:
      - pl: "Chciałbym być robotem."
        ru: "Я хотел бы быть роботом."
        source: { kind: translated, id: 12044150 }
      - pl: "To pokazuje tylko, że nie jesteś robotem."
        ru: "Это лишь показывает, что ты не робот."
        source: { kind: translated, id: 3634721 }
notes:
  - { kind: false-friend, text: "Главная трудность не в значении, а в формах: robota, roboty и robocie почти всегда принадлежат другому слову — robota «работа». Dobra robota! это «Хорошая работа!», Do roboty! — «За работу!», и к роботам они отношения не имеют." }
  - { kind: usage, text: "Склоняется как одушевлённое: винительный совпадает с родительным — Tom zbudował robota, а не zbudował robot." }
  - { kind: usage, text: "Слово придумал чешский писатель Карел Чапек в пьесе R.U.R. в 1920 году. В русский оно пришло оттуда же, поэтому совпадает полностью." }
  - { kind: usage, text: "robot kuchenny — «кухонный комбайн», а вовсе не «кухонный робот»." }
collocations:
  - { pl: "zbudować robota", ru: "построить робота" }
  - { pl: "robot kuchenny", ru: "кухонный комбайн" }
  - { pl: "robot przemysłowy", ru: "промышленный робот" }
etymology: "Из чешского robot, придуманного Карелом Чапеком в 1920 году от robota «барщина, подневольный труд». Польское robota «работа» — то же самое славянское слово, отсюда и путаница форм."
memory: "robot — «робот», слово придумал Чапек. Главная трудность не в значении, а в формах: robota, roboty, robocie почти всегда принадлежат другому слову — robota «работа». Dobra robota! это «Хорошая работа!»."
idioms:
  - { pl: "robot kuchenny", ru: "кухонный комбайн" }
  - { pl: "robot przemysłowy", ru: "промышленный робот" }
  - { pl: "zbudować robota", ru: "построить робота" }
formExamplesSkip:
  - { form: "robocie", reason: "в корпусе эта форма почти всегда принадлежит существительному robota «работа» (Dobra robota!, Do roboty!, Mam dużo roboty), а не слову robot" }
  - { form: "roboty", reason: "в корпусе эта форма почти всегда принадлежит существительному robota «работа» (Dobra robota!, Do roboty!, Mam dużo roboty), а не слову robot" }
