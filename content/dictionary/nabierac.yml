# review
id: nabierac
format: 2
lemma: "nabierać"
rank: 2149
pos: verb
aspect: imperf
pron: { cyr: "набе́раць" }
senses:
  - id: take-on
    ru: "набирать, обретать (вес, смысл, скорость)"
    examples:
      - pl: "Tucznik nabiera wagi."
        ru: "Боров набирает вес."
        source: { kind: translated, id: 406206 }
      - pl: "Wszystko nabiera sensu."
        ru: "Всё обретает смысл."
        source: { kind: translated, id: 6547598 }
      - pl: "Z wiekiem nabieramy mądrości."
        ru: "С возрастом мы набираемся мудрости."
        source: { kind: translated, id: 12040242 }
  - id: fool
    ru: "разыгрывать, дурачить (кого-л.)"
    examples:
      - pl: "Nabierają cię."
        ru: "Тебя разыгрывают."
        source: { kind: translated, id: 923114 }
      - pl: "Kiedy nas chwalą, nabieramy pewności siebie."
        ru: "Когда нас хвалят, мы набираемся уверенности."
        source: { kind: translated, id: 538962 }
notes:
  - { kind: government, text: "Ловушка в падеже: nabierać czegoś «набираться чего-л.» требует РОДИТЕЛЬНОГО — nabierać wagi, nabierać pewności. Но nabierać kogoś «дурачить кого-л.» — винительный." }
  - { kind: usage, text: "Разговорное значение «разыгрывать» очень живое: Nabierają cię «Тебя разыгрывают»." }
  - { kind: usage, text: "Совершенный вид — nabrać." }
  - { kind: false-friend, text: "Корень brać «брать» — ср. русское «набирать», «набираться»." }
collocations:
  - { pl: "nabierać wagi", ru: "набирать вес" }
  - { pl: "nabierać sensu", ru: "обретать смысл" }
etymology: "na- + bierać, от brać «брать», праславянское *bьrati; ср. русское «набирать», «набираться»."
memory: "nabierać — «набирать, обретать», но с родительным падежом: nabierać wagi. А разговорное nabierać kogoś значит «дурачить», и там уже винительный. Совершенный вид — nabrać."
idioms:
  - { pl: "nabierać wagi", ru: "набирать вес" }
  - { pl: "nabierać kogoś", ru: "дурачить кого-л." }
