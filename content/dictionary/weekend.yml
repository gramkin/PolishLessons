# review
id: weekend
format: 2
lemma: "weekend"
rank: 1134
pos: noun
pron: { cyr: "уи́кенд" }
senses:
  - id: weekend
    ru: "выходные, конец недели"
    examples:
      - pl: "Mam już plany na weekend."
        ru: "У меня уже есть планы на выходные."
        source: { kind: tatoeba, id: 6406153 }
      - pl: "Spędziłem weekend z przyjaciółmi."
        ru: "Я провёл выходные с друзьями."
        source: { kind: tatoeba, id: 12678762 }
      - pl: "Uwielbiam weekendy!"
        ru: "Обожаю выходные!"
        source: { kind: translated, id: 13788362 }
  - id: wish
    ru: "Miłego weekendu! — хороших выходных!"
    examples:
      - pl: "Miłego weekendu!"
        ru: "Хороших выходных!"
        source: { kind: tatoeba, id: 832676 }
      - pl: "Wszystkim życzę miłego weekendu."
        ru: "Всем желаю хороших выходных."
        source: { kind: translated, id: 2809221 }
notes:
  - { kind: pronunciation, text: "Английское заимствование, читается «уикенд», но склоняется по-польски: weekendu, weekendem." }
  - { kind: government, text: "w weekend «в эти выходные» и w weekendy «по выходным» — оба с винительным падежом." }
  - { kind: false-friend, text: "Отдельного слова вроде русского «выходные» в польском нет: говорят weekend, а dni wolne значит скорее «свободные дни, отгулы»." }
  - { kind: usage, text: "Miłego weekendu! — стандартное пожелание в пятницу, отвечают Nawzajem! «Взаимно!»." }
collocations:
  - { pl: "w weekend", ru: "в выходные" }
  - { pl: "miłego weekendu", ru: "хороших выходных" }
  - { pl: "długi weekend", ru: "длинные выходные" }
  - { pl: "w weekendy", ru: "по выходным" }
family:
  - { pl: "weekendowy", ru: "выходной, уикендовый", relation: derived }
etymology: "Из английского weekend «конец недели». В русском то же заимствование есть («уик-энд»), но чаще говорят «выходные»; в польском прижилось именно заимствование."
memory: "weekend читается «уикенд» и значит субботу с воскресеньем. W weekend «в эти выходные», w weekendy «по выходным». Пятничное пожелание — Miłego weekendu!"
idioms:
  - { pl: "miłego weekendu", ru: "хороших выходных" }
  - { pl: "długi weekend", ru: "длинные выходные" }
