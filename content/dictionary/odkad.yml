# review
id: odkad
format: 2
lemma: "odkąd"
rank: 844
pos: adv
pron: { cyr: "о́тконт" }
senses:
  - id: since
    ru: "с тех пор как"
    examples:
      - pl: "Znam ją odkąd była dzieckiem."
        ru: "Я знаю её с тех пор, как она была ребёнком."
        source: { kind: translated, id: 3049202 }
      - pl: "Tom jest tutaj odkąd pamiętam."
        ru: "Том здесь с тех пор, как я себя помню."
        source: { kind: translated, id: 3649567 }
      - pl: "To już trzy lata, odkąd zmarł."
        ru: "Прошло уже три года с тех пор, как он умер."
        source: { kind: translated, id: 529963 }
  - id: how-long
    ru: "с каких пор (в вопросе)"
    examples:
      - pl: "Odkąd to cię interesuje?"
        ru: "С каких пор это тебя интересует?"
        source: { kind: authored }
      - pl: "Odkąd tu mieszkasz?"
        ru: "С каких пор ты здесь живёшь?"
        source: { kind: authored }
      - pl: "Odkąd on pali?"
        ru: "С каких пор он курит?"
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Главная ловушка: odkąd — это НЕ «откуда». Русскому «откуда» отвечает skąd: Skąd jesteś? «Откуда ты?». А odkąd всегда о времени: «с тех пор как, с каких пор»." }
  - { kind: usage, text: "Запомните тройку вопросительных слов на -kąd: skąd «откуда», dokąd «куда», odkąd «с каких пор». Пространство — у первых двух, время — у последнего." }
  - { kind: usage, text: "В придаточном odkąd вводит точку отсчёта: Znam ją, odkąd była dzieckiem. Перед ним обычно ставят запятую." }
  - { kind: usage, text: "Оборот To już trzy lata, odkąd... значит «Прошло уже три года с тех пор, как...»." }
collocations:
  - { pl: "odkąd pamiętam", ru: "сколько я себя помню" }
  - { pl: "odkąd to?", ru: "с каких это пор?" }
  - { pl: "odkąd tu jesteś", ru: "с каких пор ты здесь" }
family:
  - { pl: "skąd", ru: "откуда", relation: root }
  - { pl: "dokąd", ru: "куда", relation: root }
etymology: "Из od + kąd, из того же гнезда, что skąd «откуда» и dokąd «куда». Но приставка od- увела слово от пространства ко времени."
memory: "odkąd — «с тех пор как», и это ловушка: на «откуда» оно не отвечает, как бы ни было похоже. «Откуда» — это skąd, «куда» — dokąd, а odkąd всегда о времени: Znam ją, odkąd była dzieckiem."
