# review
id: troszke
format: 2
lemma: "troszkę"
rank: 2000
pos: adv
pron: { cyr: "тро́шкэн" }
senses:
  - id: a-little
    ru: "чуточку, самую малость"
    examples:
      - pl: "Jestem troszkę ciekawy."
        ru: "Мне чуточку любопытно."
        source: { kind: translated, id: 3992308 }
      - pl: "Troszkę za dużo wypiłem."
        ru: "Я выпил чуточку многовато."
        source: { kind: translated, id: 3610616 }
      - pl: "Jestem troszkę zazdrosny."
        ru: "Я чуточку завидую."
        source: { kind: translated, id: 4869420 }
      - pl: "Mówię troszkę po francusku."
        ru: "Я чуточку говорю по-французски."
        source: { kind: translated, id: 3295022 }
      - pl: "Proszę, mów troszkę wolniej."
        ru: "Пожалуйста, говори чуточку медленнее."
        source: { kind: translated, id: 4790352 }
      - pl: "Chyba troszkę się przeziębiłem."
        ru: "Кажется, я чуточку простудился."
        source: { kind: translated, id: 1985271 }
notes:
  - { kind: usage, text: "Уменьшительное от trochę «немного», у которого своя карточка. troszkę мягче и теплее: «чуточку», «самую малость»." }
  - { kind: usage, text: "Есть и дальнейшее уменьшительное troszeczkę — «совсем чуть-чуть»." }
  - { kind: usage, text: "Слово неизменяемое и обычно стоит перед тем, что определяет: troszkę wolniej «чуточку медленнее»." }
collocations:
  - { pl: "troszkę wolniej", ru: "чуточку медленнее" }
  - { pl: "troszkę za dużo", ru: "чуточку многовато" }
  - { pl: "jestem troszkę zmęczony", ru: "я чуточку устал" }
etymology: "Двойное уменьшительное от trocha «малость»: trochę, затем troszkę. Русское «чуточку» образовано точно так же, от «чуть» через «чуточка»."
memory: "troszkę — «чуточку», ласковое уменьшительное от trochę «немного». Есть и troszeczkę — «совсем чуть-чуть»."
idioms:
