# review
id: wybierac
format: 2
lemma: "wybierać"
rank: 818
pos: verb
aspect: imperf
aspectPair: wybrac
pron: { cyr: "выбе́раць" }
senses:
  - id: choose
    ru: "выбирать"
    examples:
      - pl: "Czasów się nie wybiera, w nich się żyje i umiera."
        ru: "Времена не выбирают, в них живут и умирают."
        source: { kind: tatoeba, id: 12117372 }
      - pl: "Wybieram ten."
        ru: "Я выбираю этот."
        source: { kind: translated, id: 712406 }
      - pl: "Który wybierasz?"
        ru: "Который ты выбираешь?"
        source: { kind: translated, id: 9679399 }
  - id: have-to-choose
    ru: "trzeba wybierać — приходится выбирать"
    examples:
      - pl: "Trzeba wybierać mniejsze zło."
        ru: "Приходится выбирать меньшее зло."
        source: { kind: translated, id: 2145462 }
      - pl: "Jeśli muszę wybierać, wezmę ten."
        ru: "Если придётся выбирать, я возьму этот."
        source: { kind: translated, id: 4455762 }
      - pl: "Wybieraj."
        ru: "Выбирай."
        source: { kind: translated, id: 6160613 }
  - id: set-out
    ru: "wybierać się — собираться (куда-л.)"
    note: "Не «выбирать себя», а «собираться в путь»."
    examples:
      - pl: "Plotka głosi, że wybierają się do Australii."
        ru: "Ходит слух, что они собираются в Австралию."
        source: { kind: translated, id: 823208 }
      - pl: "Wybieramy się jutro na piknik."
        ru: "Мы завтра собираемся на пикник."
        source: { kind: translated, id: 7164963 }
      - pl: "W czwartek wybieramy się na basen."
        ru: "В четверг мы собираемся в бассейн."
        source: { kind: translated, id: 1357150 }
  - id: elected
    ru: "wybierany — избираемый"
    examples:
      - pl: "Prezydent był wybierany na cztery lata."
        ru: "Президент избирался на четыре года."
        source: { kind: translated, id: 11517599 }
      - pl: "W niektórych krajach sędziowie wybierani są drogą kooptacji."
        ru: "В некоторых странах судей избирают путём кооптации."
        source: { kind: translated, id: 969869 }
      - pl: "W średniowiecznych Niemczech królów wybierano."
        ru: "В средневековой Германии королей избирали."
        source: { kind: translated, id: 13088892 }
notes:
  - { kind: usage, text: "С się глагол значит не «выбирать себя», а «собираться куда-то»: Wybieramy się na piknik «Мы собираемся на пикник», Wybierają się do Australii. Это едва ли не самое частое его употребление." }
  - { kind: government, text: "wybierać coś «выбирать что-то» — винительный; wybierać między czymś a czymś «выбирать между» — творительный; wybierać się DO или NA — родительный либо винительный по месту." }
  - { kind: usage, text: "Совершенный вид — wybrać: Wybieram ten «Я выбираю этот», но Wybrałem ten «Я выбрал этот»." }
  - { kind: usage, text: "Существительное — wybór «выбор», во множественном wybory «выборы». Причастие wybierany значит «избираемый»: prezydent wybierany na cztery lata." }
collocations:
  - { pl: "wybierać się na", ru: "собираться на" }
  - { pl: "trzeba wybierać", ru: "приходится выбирать" }
  - { pl: "wybierać między", ru: "выбирать между" }
  - { pl: "wybory", ru: "выборы" }
family:
  - { pl: "wybrać", ru: "выбрать", relation: aspect }
  - { pl: "wybór", ru: "выбор", relation: derived }
  - { pl: "wybory", ru: "выборы", relation: derived }
  - { pl: "brać", ru: "брать", relation: root }
etymology: "wy- + bierać, от brać «брать» — буквально «выбирать», ровно как русское «вы-бирать» от «брать»."
memory: "wybierać — «выбирать», от brać «брать», ровно как русское «вы-бирать». Но с się смысл уходит в сторону: wybierać się значит не «выбирать себя», а «собираться куда-то» — Wybieramy się na piknik «Мы собираемся на пикник». Это едва ли не самое частое употребление. Совершенный вид — wybrać, существительное — wybór, а во множественном wybory «выборы»."
idioms:
  - { pl: "wybierać się na", ru: "собираться на" }
  - { pl: "trzeba wybierać", ru: "приходится выбирать" }
  - { pl: "wybory", ru: "выборы" }
