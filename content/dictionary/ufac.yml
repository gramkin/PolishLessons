# review
id: ufac
format: 2
lemma: "ufać"
rank: 614
pos: verb
aspect: imperf
pron: { cyr: "у́фаць" }
senses:
  - id: trust-someone
    ru: "доверять кому-либо (ufać komuś — дательный без предлога)"
    note: "Управление совпадает с русским: дательный падеж и никакого предлога."
    examples:
      - pl: "Mój syn mi nie ufa."
        ru: "Мой сын мне не доверяет."
        source: { kind: tatoeba, id: 12567523 }
      - pl: "Ufasz Tomowi?"
        ru: "Ты доверяешь Тому?"
        source: { kind: tatoeba, id: 2399295 }
      - pl: "Jemu nie można ufać."
        ru: "Ему нельзя доверять."
        source: { kind: tatoeba, id: 571139 }
  - id: rely
    ru: "полагаться, верить (словам, людям)"
    examples:
      - pl: "Nie ufam gadułom."
        ru: "Я не доверяю болтунам."
        source: { kind: tatoeba, id: 4732075 }
      - pl: "On jest jedynym przyjacielem, któremu ufam."
        ru: "Он единственный друг, которому я доверяю."
        source: { kind: tatoeba, id: 1046128 }
      - pl: "Ufaj ludziom, ale nie bierz cukierków od nieznajomych."
        ru: "Доверяй людям, но не бери конфеты у незнакомцев."
        source: { kind: tatoeba, id: 12470027 }
notes:
  - { kind: government, text: "ufać komuś — дательный падеж без предлога, ровно как русское «доверять кому-то»: Ufam ci «Я тебе доверяю», Nie ufam nikomu «Я никому не доверяю». Предлог здесь не нужен." }
  - { kind: usage, text: "Совершенный вид — zaufać: Zaufaj mi «Доверься мне». Существительное — zaufanie «доверие», прилагательное ufny «доверчивый»." }
  - { kind: usage, text: "Рядом стоит wierzyć. wierzyć komuś — «верить кому-то», что он говорит правду; ufać komuś — «полагаться на кого-то», что он не подведёт. Часто взаимозаменимы, но ufać шире." }
  - { kind: usage, text: "Действительное причастие ufający значит «доверяющий, доверчивый»: człowiek ufający ludziom «человек, доверяющий людям». Страдательного причастия глагол не образует — доверяют кому-то, а не кого-то." }
collocations:
  - { pl: "ufać komuś", ru: "доверять кому-то" }
  - { pl: "nie ufam nikomu", ru: "я никому не доверяю" }
  - { pl: "ufaj mi", ru: "доверься мне" }
  - { pl: "można mu ufać", ru: "на него можно положиться" }
family:
  - { pl: "wierzyć", ru: "верить", relation: derived, id: wierzyc }
  - { pl: "zaufanie", ru: "доверие", relation: derived }
  - { pl: "zaufać", ru: "довериться", relation: derived }
  - { pl: "ufny", ru: "доверчивый", relation: derived }
etymology: "Праславянское *upъvati «уповать, надеяться» — то же слово, что русское «уповать». Через промежуточные *upwać и *upfać оно стянулось в ufać, а значение сместилось от «надеяться» к «доверять»."
memory: "ufać — «доверять», и управление то же, что в русском: дательный падеж без предлога. Ufam ci «Я тебе доверяю», Nie ufam nikomu «Никому не доверяю». Слово — родня русскому «уповать» (праславянское *upъvati), так что «полагаться» слышно в нём буквально. Совершенный вид — zaufać, существительное — zaufanie «доверие», прилагательное ufny «доверчивый». Рядом держите wierzyć: wierzyć komuś — «верить словам», ufać komuś — «полагаться на человека»."
idioms:
  - { pl: "ufaj, ale sprawdzaj", ru: "доверяй, но проверяй" }
  - { pl: "ślepo ufać", ru: "слепо доверять" }
  - { pl: "można mu ufać", ru: "на него можно положиться" }
