etymology: "Приставка u- и RZĄD «ряд, порядок», из праславянского *rędъ — то же слово, что русский «ряд». Ведомство понято как то, что расставлено по порядку, и отсюда же urzędnik «чиновник» и urzędowy «официальный». Русский пошёл от того же корня в другую сторону: «порядок», «наряд», «обряд», «урядник», — а само «уряд» в значении учреждения в литературном языке не удержалось."
memory: "ą только в urząd; откроется слог — станет ę: urzędu, urzędzie. Как wzór/wzoru, только другая пара букв. Корень — rząd «ряд»."
