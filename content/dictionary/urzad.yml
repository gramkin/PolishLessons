notes:
  - { kind: pronunciation, text: "Буква ą стоит только в именительном и винительном: URZĄD. Во всех остальных формах на её месте ę — urzędu, urzędem, urzędowi, urzędzie, urzędy. Причина позиционная: ą сидит в закрытом конечном слоге, а стоит слогу открыться, как появляется ę. Это тот же самый процесс, что ó в WZÓR против o в WZORU: в старопольском гласные в закрытом конечном слоге удлинялись, и долгие со временем дали ó и ą. Две разные пары букв, одно правило. Так же ведут себя ZĄB — ZĘBA и DĄB — DĘBU." }
  - { kind: usage, text: "В местном падеже происходят сразу две мены: ą переходит в ę и d переходит в dź — URZĄD даёт URZĘDZIE. Смягчение d перед окончанием -e парно тому t, которое даёт ć в asystencie и produkcie: у звонкого d напарник именно dź. Запомнить проще так: мена гласной идёт во всех косвенных падежах, а мена согласного — только там, где окончание -e." }
  - { kind: usage, text: "Корень тот же, что у RZĄD, а rząd по-польски значит и «ряд», и «правительство». Учреждение — это буквально то, что поставлено в ряд, приведено в порядок, и отсюда же urzędnik «чиновник». Русский от этого корня произвёл «ряд», «наряд», «порядок» и устаревшего «урядника», но слова «уряд» в значении ведомства не удержал, так что узнать urząd по русскому созвучию не получится — надо идти через «ряд»." }
