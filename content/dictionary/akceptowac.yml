# review
id: akceptowac
format: 2
lemma: "akceptować"
rank: 3866
pos: verb
pron: { cyr: "акцэпто́ваць" }
senses:
  - id: accept
    ru: "принимать, соглашаться (с чем-то)"
    examples:
      - pl: "Akceptuję twoją decyzję."
        ru: "Я принимаю твоё решение."
        source: { kind: authored }
      - pl: "Ten sklep akceptuje karty."
        ru: "Этот магазин принимает карты."
        source: { kind: authored }
      - pl: "Nie akceptujemy spóźnień."
        ru: "Мы не принимаем опозданий."
        source: { kind: authored }
  - id: tolerate
    ru: "принимать (кого-то таким, какой он есть)"
    examples:
      - pl: "Rodzice akceptują jego wybór."
        ru: "Родители принимают его выбор."
        source: { kind: authored }
      - pl: "Trudno akceptować siebie takim, jakim się jest."
        ru: "Трудно принимать себя таким, какой ты есть."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "AKCEPTOWAĆ — «принимать, одобрять», шире русского «акцептовать» (банковский термин). По-польски это обычное слово: AKCEPTUJĘ WARUNKI «принимаю условия», ON MNIE NIE AKCEPTUJE «он меня не принимает». Синоним — PRZYJMOWAĆ." }
  - { kind: usage, text: "Несовершенный вид; совершенный — ZAAKCEPTOWAĆ. Спряжение на -UJĘ: AKCEPTUJĘ, AKCEPTUJESZ, AKCEPTUJĄ. В интерфейсах — AKCEPTUJĘ REGULAMIN «принимаю условия»." }
  - { kind: government, text: "Что, кого — винительный: AKCEPTOWAĆ PROPOZYCJĘ, AKCEPTOWAĆ KOGOŚ. С отрицанием — родительный: NIE AKCEPTUJĘ KŁAMSTWA. Каким — творительный: AKCEPTOWAĆ KOGOŚ TAKIM, JAKI JEST." }
  - { kind: pronunciation, text: "Читается «акцэпто́ваць»: C — «ц», ударение на предпоследнем слоге. AKCEPTUJĘ — «акцэпту́е»." }
  - { kind: register, text: "Нейтрально-деловое слово: договоры, банки, интерфейсы. В быту — ZGADZAĆ SIĘ «соглашаться»." }
collocations:
  - { pl: "akceptować warunki", ru: "принимать условия" }
  - { pl: "akceptować kogoś takim, jaki jest", ru: "принимать кого-то таким, какой он есть" }
  - { pl: "akceptować płatności kartą", ru: "принимать оплату картой" }
family:
  - { pl: "zaakceptować", ru: "принять, одобрить", relation: aspect, id: zaakceptowac }
  - { pl: "akceptacja", ru: "принятие, одобрение", relation: derived }
  - { pl: "przyjmować", ru: "принимать", relation: root, id: przyjmowac }
etymology: "Из латинского ACCEPTARE «принимать», через немецкое и французское. Русское «акцепт», «акцептовать» — тот же корень, но в узком финансовом значении."
memory: "Akceptować — принимать: akceptuję twoją decyzję. Akceptuję regulamin — принимаю условия."
idioms:
  - { pl: "akceptować kogoś takim, jaki jest", ru: "принимать кого-то таким, какой он есть" }
