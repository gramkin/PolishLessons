# review
id: nadejsc
format: 2
lemma: "nadejść"
rank: 1170
pos: verb
aspect: perf
pron: { cyr: "на́дэйсьць" }
senses:
  - id: season
    ru: "наступить (о времени года, поре)"
    examples:
      - pl: "Nadszedł czas."
        ru: "Настало время."
        source: { kind: translated, id: 7960667 }
      - pl: "Nadeszła zima."
        ru: "Наступила зима."
        source: { kind: tatoeba, id: 10698009 }
      - pl: "Nadeszła jesień."
        ru: "Наступила осень."
        source: { kind: tatoeba, id: 10704029 }
  - id: come
    ru: "прийти, настать (о событии)"
    examples:
      - pl: "Niebawem nadejdzie wiosna."
        ru: "Скоро придёт весна."
        source: { kind: translated, id: 12562294 }
      - pl: "Kiedy nadejdzie koniec świata?"
        ru: "Когда наступит конец света?"
        source: { kind: translated, id: 1184617 }
      - pl: "Nadszedł wielki dzień."
        ru: "Настал великий день."
        source: { kind: translated, id: 6484380 }
  - id: time-to
    ru: "nadszedł czas, aby… — пришло время, чтобы…"
    examples:
      - pl: "Nadszedł czas, abyś powiedział jej prawdę."
        ru: "Пришло время, чтобы ты сказал ей правду."
        source: { kind: translated, id: 1857385 }
      - pl: "Nadszedł czas na sprzątnięcie ze stołu."
        ru: "Пришло время убрать со стола."
        source: { kind: translated, id: 2973322 }
      - pl: "Chyba nadszedł czas, abyśmy doszli do porozumienia."
        ru: "Кажется, пришло время нам договориться."
        source: { kind: translated, id: 12036188 }
notes:
  - { kind: usage, text: "Главное употребление — о времени и временах года: Nadeszła zima «Наступила зима», Nadszedł czas «Настало время»." }
  - { kind: government, text: "Конструкция nadszedł czas, aby… «пришло время, чтобы…» требует придаточного с aby или żeby." }
  - { kind: usage, text: "Вид совершенный; несовершенный — nadchodzić. Основа чередуется: nadejdzie в будущем, но nadszedł и nadeszła в прошедшем." }
  - { kind: pronunciation, text: "Конечное -ść звучит как «сьць», а ударение падает на первый слог: на́дэйсьць." }
collocations:
  - { pl: "nadszedł czas", ru: "настало время" }
  - { pl: "nadeszła zima", ru: "наступила зима" }
  - { pl: "z nadejściem wiosny", ru: "с приходом весны" }
etymology: "Приставка nad- и iść «идти». Буквально «надойти», а значение «наступить, настать» польский развил сам — примерно как русское «наступить» из «ступить»."
memory: "nadejść — «наступить, настать», о времени и временах года: Nadeszła zima, Nadszedł czas. Основа чередуется: будущее nadejdzie, прошедшее nadszedł и nadeszła. Несовершенный вид — nadchodzić."
idioms:
  - { pl: "nadszedł czas", ru: "настало время" }
  - { pl: "nadeszła pora", ru: "настала пора" }
  - { pl: "z nadejściem wiosny", ru: "с приходом весны" }
