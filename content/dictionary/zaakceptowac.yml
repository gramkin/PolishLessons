  - id: come-to-terms
    ru: "смириться, принять (факт, себя)"
    examples:
      - pl: "Nie umiał zaakceptować swojej choroby."
        ru: "Он не умел принять свою болезнь."
        source: { kind: authored }
      - pl: "Z czasem zaakceptowali jego decyzję."
        ru: "Со временем они приняли его решение."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "СЛОВО УЗНАВАЕМОЕ, НО ПЕРЕВОД ДРУГОЙ. Русское «акцептовать» существует, однако живёт только в банковском и юридическом языке: акцептовать вексель. Польское zaakceptować — слово совершенно повседневное и покрывает всё поле: zaakceptować warunki «принять условия», zaakceptować projekt «одобрить проект», zaakceptować siebie «принять себя». Переводить его надо как «принять», «одобрить», «согласиться» — но никогда как «акцептовать»." }
  - { kind: usage, text: "Вид совершенный, несовершенная пара — akceptować. Настоящее-будущее по уже знакомому правилу -ować: zaakceptuję, zaakceptujesz, zaakceptuje — тот же ряд, что pracuję, organizuję, zaplanuję. Причастие zaakceptowany живёт и самостоятельно, в смысле «принятый окружающими»: czuł się wreszcie zaakceptowany." }
  - { kind: pronunciation, text: "Две буквы a на стыке приставки и корня произносятся обе, в одну их не сливают: za-ak-cep-TO-wać, «заакцэпто́ваць». Ударение, как всегда, на предпоследнем слоге, и в формах настоящего времени оно переезжает: zaakceptuję — «заакцэпту́йэ»." }
  - { kind: government, text: "Принимают ЧТО — винительный падеж: zaakceptować warunki, propozycję, decyzję. Предложного дополнения у глагола нет, в отличие от русского «согласиться С чем-то». Поэтому «согласиться с предложением» переводится как zaakceptować propozycję, безо всякого предлога." }
collocations:
  - { pl: "zaakceptować warunki", ru: "принять условия" }
  - { pl: "zaakceptować projekt", ru: "одобрить проект" }
  - { pl: "zaakceptować siebie", ru: "принять себя" }
family:
  - { pl: "akceptować", ru: "принимать, одобрять", relation: aspect }
  - { pl: "akceptacja", ru: "принятие, одобрение", relation: derived }
  - { pl: "akceptowalny", ru: "приемлемый", relation: derived }
etymology: "Приставка za- плюс akceptować, из латинского acceptare «принимать», от capere «брать». Тем же латинским путём слово пришло и в русский, но закрепилось там в узком финансовом смысле, а в польском осталось общеупотребительным. Отсюда akceptacja «принятие, одобрение», akceptowalny «приемлемый» и nieakceptowalny."
memory: "zaakceptować — «принять, одобрить», а не «акцептовать»: русское слово осело при векселях, польское работает везде, вплоть до zaakceptować siebie. Две a подряд произносятся обе, а настоящее время идёт по правилу -ować: zaakceptuję."
