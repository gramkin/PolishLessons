# review
id: zaspiewac
format: 2
lemma: "zaśpiewać"
rank: 2354
pos: verb
pron: { cyr: "засьпе́ваць" }
senses:
  - id: sing
    ru: "спеть"
    examples:
      - pl: "Zaśpiewała kolędę przy stole."
        ru: "Она спела колядку за столом."
        source: { kind: authored }
      - pl: "Zaśpiewaj coś, prosimy."
        ru: "Спой что-нибудь, просим."
        source: { kind: authored }
      - pl: "Zaśpiewali hymn na stojąco."
        ru: "Они спели гимн стоя."
        source: { kind: authored }
  - id: strike-up
    ru: "запеть, затянуть"
    examples:
      - pl: "Ktoś zaśpiewał pierwszy i reszta podchwyciła."
        ru: "Кто-то запел первым, и остальные подхватили."
        source: { kind: authored }
      - pl: "Zaśpiewał tak głośno, że obudził sąsiadów."
        ru: "Он запел так громко, что разбудил соседей."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ŚPIEWAĆ И «ПЕТЬ» — ЭТО ОДНО СЛОВО, ХОТЯ НЕ ПОХОЖИ. Праславянское *pěti «петь» дало производное *sъpěvati, и как раз оно стало в польском основным: śpiewać, śpiew «пение», śpiewak «певец». Русский основным оставил простое «петь», но тот же самый *sъpěvati у нас тоже уцелел — в словах «спевка» и «спеться». То есть польское śpiewać это буквально наше «спевать»." }
  - { kind: usage, text: "Приставка za- делает здесь сразу две работы. Она переводит глагол в совершенный вид — «спеть», — и одновременно может означать начало: ZAŚPIEWAŁ переводится и как «спел», и как «запел», смотря по контексту. Ktoś zaśpiewał i reszta podchwyciła — здесь явно «запел». Несовершенная пара — ŚPIEWAĆ." }
  - { kind: pronunciation, text: "Начальное ś перед p — мягкое: śpiewać звучит примерно «сьпе́ваць», а не «спевать». Русскому уху хочется произнести твёрдое с, но именно мягкость отличает это слово. В приставочной форме то же самое: zaśpiewać — «засьпе́ваць»." }
collocations:
  - { pl: "zaśpiewać piosenkę", ru: "спеть песню" }
  - { pl: "zaśpiewać na głos", ru: "спеть вслух" }
  - { pl: "zaśpiewać sto lat", ru: "спеть поздравление имениннику" }
family:
  - { pl: "śpiewać", ru: "петь (несов.)", relation: aspect, id: spiewac }
  - { pl: "śpiew", ru: "пение", relation: root }
  - { pl: "śpiewak", ru: "певец", relation: root }
etymology: "Приставка za- и śpiewać, из праславянского *sъpěvati — производного от *pěti «петь». Русский пошёл по простому корню и получил «петь», «певец», «пение»; польский закрепил приставочный вариант, и у него śpiewać, śpiewak, śpiew. Но и в русском *sъpěvati никуда не делось: оно живёт в «спевке» хора и в выражении «спеться»."
memory: "śpiewać — это и есть наше «спевать», то же слово, что в «спевке»; просто у поляков приставочный вариант вытеснил простой. И не забывай мягкое сь в начале: «сьпе́ваць»."
idioms:
  - { pl: "zaśpiewać komuś sto lat", ru: "спеть имениннику поздравление" }
  - { pl: "zaśpiewać na całe gardło", ru: "спеть во всё горло" }
formExamplesSkip:
  - { form: "zaśpiewani", reason: "Мужско-личная форма страдательного причастия требует одушевлённого дополнения-человека, а zaśpiewać управляет только названиями того, что поют: piosenkę, kolędę, hymn, arię. Подлежащего для этой формы быть не может." }
