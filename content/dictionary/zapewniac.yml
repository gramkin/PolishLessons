        source: { kind: authored }
      - pl: "Zapewniano mnie, że termin jest pewny."
        ru: "Меня уверяли, что срок надёжный."
        source: { kind: authored }
  - id: provide
    ru: "обеспечивать (условия, безопасность)"
    examples:
      - pl: "Firma zapewnia nocleg i wyżywienie."
        ru: "Фирма обеспечивает ночлег и питание."
        source: { kind: authored }
      - pl: "Zapewniane warunki okazały się gorsze, niż obiecywano."
        ru: "Обеспечиваемые условия оказались хуже обещанного."
        source: { kind: authored }
  - id: assuring
    ru: "zapewnianie — заверения, обеспечение"
    examples:
      - pl: "Zapewnianie o dobrych chęciach nikogo już nie przekonuje."
        ru: "Заверения в добрых намерениях уже никого не убеждают."
        source: { kind: authored }
      - pl: "Po latach zapewniania o zmianach nikt nie wierzy."
        ru: "После лет заверений о переменах никто не верит."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "РУССКОЙ ОПОРЫ ПОЧТИ НЕТ: корень pewny «уверенный, надёжный» восходит к праславянскому *pъvati «уповать», от которого в русском осталось лишь книжное «уповать». Поэтому pewny, pewność, zapewniać приходится учить напрямую. Зато гнездо само по себе прозрачно и очень частотно: na pewno «наверняка», pewnie «наверное», zapewne «пожалуй»." }
  - { kind: government, text: "ДВЕ МОДЕЛИ, ОДНА РАСХОДИТСЯ. Уверяют кого В чём — по-польски O с ПРЕДЛОЖНЫМ: zapewniać kogoś O swojej niewinności, тогда как русский говорит «в невиновности». А «обеспечивать кому-то что-то» совпадает полностью: zapewniać komuś nocleg, bezpieczeństwo, dach nad głową — дательный плюс винительный." }
  - { kind: pronunciation, text: "ДВА ГЛАГОЛА НА -ać, А НАСТОЯЩЕЕ ВРЕМЯ РАЗНОЕ, и подсказка в самом окончании. Глаголы на -awać теряют -wa- и берут -aj-: poddawać даёт poddaję, poddajesz, как podawać — podaję и dawać — daję. Обычные же глаголы на -ać берут -am: zapewniać даёт zapewniam, zapewniasz, как czytać — czytam. Посмотрите на две буквы перед -ć, и спряжение известно заранее." }
  - { kind: usage, text: "Вид несовершенный, совершенная пара — zapewnić. Оборот zapewniam cię, że… — «уверяю тебя, что…» — ходовая вводная фраза, которую стоит запомнить целиком. Страдательное причастие zapewniany встречается в деловой речи: zapewniane warunki, zapewniana opieka." }
collocations:
  - { pl: "zapewniam cię, że", ru: "уверяю тебя, что" }
  - { pl: "zapewniać bezpieczeństwo", ru: "обеспечивать безопасность" }
  - { pl: "na pewno", ru: "наверняка" }
family:
  - { pl: "pewny", ru: "уверенный; надёжный", relation: root, id: pewny }
  - { pl: "zapewnić", ru: "заверить; обеспечить", relation: aspect, id: zapewnic }
  - { pl: "pewność", ru: "уверенность", relation: derived, id: pewnosc }
etymology: "Приставка za- плюс основа от pewny «уверенный», восходящая к праславянскому *pъvati «уповать, доверять». В русском этот корень почти вымер — остались книжное «уповать» и «упование», — поэтому родство есть, но опереться на него в речи нельзя. Зато польское гнездо огромно: pewność, na pewno, zapewne, upewnić się."
memory: "zapewniać — «уверять» и «обеспечивать». Падеж запомните отдельно: zapewniać kogoś O czymś, предложный с o, а не русское «в». Зато zapewniać komuś coś совпадает. И рядом na pewno — «наверняка», слово на каждый день."
idioms:
  - { pl: "zapewniam cię", ru: "уверяю тебя" }
  - { pl: "zapewnić sobie przyszłość", ru: "обеспечить себе будущее" }
