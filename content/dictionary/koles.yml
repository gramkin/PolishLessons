        source: { kind: translated, id: 11750117 }
      - pl: "Tom, mój współlokator to naprawdę spoko koleś."
        ru: "Том, мой сосед по квартире, реально классный мужик."
        source: { kind: translated, id: 11750133 }
      - pl: "Kolesia skazano za bezprawny handel lekami."
        ru: "Мужика осудили за незаконную торговлю лекарствами."
        source: { kind: translated, id: 13897026 }
      - pl: "Jakiś koleś pytał o ciebie."
        ru: "Какой-то мужик о тебе спрашивал."
        source: { kind: authored }
      - pl: "Przy barze stał wysoki koleś."
        ru: "У бара стоял высокий парень."
        source: { kind: authored }
  - id: mate
    ru: "кореш, приятель (в обращении)"
    examples:
      - pl: "Siema koleś, co słychać?"
        ru: "Привет, мужик, как дела?"
        source: { kind: authored }
      - pl: "Dzięki, koleś."
        ru: "Спасибо, кореш."
        source: { kind: authored }
notes:
  - { kind: register, text: "Разговорное, слегка фамильярное слово — «мужик, тип, парень». Не грубое, но в официальной речи неуместно." }
  - { kind: usage, text: "Образовано от kolega «приятель», однако значение сдвинулось: koleś — это не «коллега», а просто какой-то мужчина или, в дружеском обращении, «кореш»." }
  - { kind: usage, text: "Siema koleś! — фамильярное приветствие, «Привет, мужик!»." }
collocations:
  - { pl: "jakiś koleś", ru: "какой-то мужик" }
  - { pl: "siema koleś", ru: "привет, мужик" }
  - { pl: "miły koleś", ru: "славный малый" }
etymology: "От kolega «приятель» с разговорным суффиксом -ś. Русские «кореш» и «тип» передают тот же оттенок, но образованы иначе."
memory: "koleś — «мужик, тип», разговорное. От kolega, но значит уже не «коллега», а просто какого-то парня."
idioms:
