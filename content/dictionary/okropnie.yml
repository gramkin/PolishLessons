  - { pl: "okropność", ru: "ужас, мерзость", relation: derived }
etymology: "От прилагательного okropny «ужасный», которое старые словари связывают с okropić «обрызгать» — первоначально «обрызганный кровью», откуда «страшный». Русское «ужасно» прошло тот же путь от существительного к усилителю."
memory: "okropnie — «ужасно» в обоих смыслах: и «плохо» (wygląda okropnie), и «очень» (okropnie gorąco). Степени: okropniej, najokropniej."
idioms:
