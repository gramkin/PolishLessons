# review
id: okropnie
format: 2
lemma: "okropnie"
rank: 2566
pos: adv
pron: { cyr: "окро́пнье" }
senses:
  - id: badly
    ru: "ужасно, страшно, плохо"
    examples:
      - pl: "Wyglądam dziś okropnie."
        ru: "Я сегодня ужасно выгляжу."
        source: { kind: translated, id: 12567531 }
      - pl: "Zachował się okropnie."
        ru: "Он поступил ужасно."
        source: { kind: authored }
  - id: intensifier
    ru: "ужасно, страшно — как усилитель «очень»"
    examples:
      - pl: "Okropnie bolała go głowa."
        ru: "У него ужасно болела голова."
        source: { kind: translated, id: 6406054 }
      - pl: "Okropnie mi przykro."
        ru: "Мне ужасно жаль."
        source: { kind: authored }
      - pl: "Jest okropnie gorąco."
        ru: "Ужасно жарко."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Наречие от okropny «ужасный». Два употребления: оценка — «ужасно, плохо» — и усилитель «очень», ровно как в русском." }
  - { kind: usage, text: "В усилительной роли стоит перед тем словом, которое усиливает: okropnie gorąco, okropnie mi przykro." }
  - { kind: government, text: "Неизменяемое наречие; степени — okropniej, najokropniej." }
  - { kind: false-friend, text: "Созвучно русскому «окропить», но значит «ужасно», а не «обрызгать». Зато усилительное употребление совпадает: «ужасно вкусно» — okropnie dobre." }
collocations:
  - { pl: "okropnie mi przykro", ru: "мне ужасно жаль" }
  - { pl: "wyglądać okropnie", ru: "ужасно выглядеть" }
family:
