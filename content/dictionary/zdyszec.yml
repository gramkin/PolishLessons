# review
id: zdyszec
format: 2
lemma: "zdyszeć"
rank: 5595
pos: verb
aspect: perf
pron: { cyr: "зды́шэць" }
senses:
  - id: out-of-breath
    ru: "запыхаться (zdyszeć się)"
    examples:
      - pl: "Czemu jesteś tak zdyszany?"
        ru: "Почему ты так запыхался?"
        source: { kind: translated, id: 3314222 }
      - pl: "Zdyszał się po biegu."
        ru: "Он запыхался после бега."
        source: { kind: authored }
      - pl: "Zdyszeli się na schodach."
        ru: "Они запыхались на лестнице."
        source: { kind: authored }
  - id: panting
    ru: "запыхавшийся (причастие zdyszany)"
    examples:
      - pl: "Wpadł do pokoju zdyszany."
        ru: "Он влетел в комнату запыхавшийся."
        source: { kind: authored }
      - pl: "Mówiła zdyszanym głosem."
        ru: "Она говорила запыхавшимся голосом."
        source: { kind: authored }
notes:
  - { kind: usage, text: "В живой речи встречается почти только причастие zdyszany «запыхавшийся»; личные формы редки." }
  - { kind: government, text: "Возвратный: zdyszeć się. От чего — po с предложным: zdyszeć się po biegu." }
  - { kind: false-friend, text: "Корень dyszeć «дышать тяжело, пыхтеть»; ср. русское «дышать», «отдышаться»." }
  - { kind: usage, text: "Несовершенный вид — dyszeć. Существительное oddech «дыхание» уже есть в словаре." }
  - { kind: government, text: "Повелительного наклонения у глагола нет: запыхаться по приказу нельзя. Отглагольного существительного тоже — одышка по-польски zadyszka. Зато причастие zdyszany живёт как обычное прилагательное." }
collocations:
  - { pl: "zdyszany głos", ru: "запыхавшийся голос" }
etymology: "z- + dyszeć «тяжело дышать»; ср. русское «дышать», «отдышаться»."
memory: "zdyszeć się — «запыхаться», но в речи живёт прежде всего причастие zdyszany «запыхавшийся». Несовершенный вид — dyszeć."
idioms:
  - { pl: "zdyszany głos", ru: "запыхавшийся голос" }
