notes:
  - { kind: false-friend, text: "Русская «среда» — это два разных польских слова, и путать их нельзя. ŚRODA — день недели, ŚRODOWISKO — окружение. Общий у них только корень: среда недели потому так и названа, что стоит посередине, и по-польски, и по-русски одинаково. Но сказать W ŚRODĘ, имея в виду «в среде», нельзя — услышат «в среду», то есть про день. Окружение — всегда W ŚRODOWISKU." }
  - { kind: usage, text: "Дательный и местный — ŚRODOWISKU, с окончанием -u и без всякого смягчения k. Это четвёртый такой средний род после CIASTKU, и рядом по-прежнему стоит женское KLINICE, где то же k перешло в c. Решает не род, а последний согласный основы. Если он заднеязычный — k, g, ch, — то средний и мужской род уходят от окончания -e и берут в местном -u, оставляя согласный нетронутым: środowisku, ciastku, dzienniku, pliku. Если основа кончается иначе, местный берёт -e и согласный смягчается: piśmie, ogonie, dymie, urzędzie, produkcie. Женский же род берёт -e в дательном и местном всегда, и там заднеязычный смягчается тоже: klinice, lidze, musze." }
  - { kind: usage, text: "Форм восемь, потому что средний род складывает падежи плотнее других. ŚRODOWISKA — это и родительный единственного, и именительный с винительным множественного; ŚRODOWISKU — и дательный, и местный; а именительный с винительным в единственном у среднего рода совпадают всегда, как и во множественном. Отсюда и родительный множественного ŚRODOWISK голой основой, без окончания, как RAS и KLINIK из партии 221." }
