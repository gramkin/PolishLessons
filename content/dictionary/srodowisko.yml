etymology: "От ŚRODEK «середина», из праславянского *serd- «середина» — того же корня, что русские «середина» и «среда». Окружение понято как то, что лежит посередине, вокруг чего-то. От этого же корня и день недели: среда — середина недели, и оба языка назвали её одинаково. Разница в том, что русский оставил одно слово на оба смысла, а польский развёл их по двум: środa для дня, środowisko для окружения."
memory: "Русская «среда» — это два польских слова: środa (день) и środowisko (окружение). Местный środowisku с -u, k не смягчается."
