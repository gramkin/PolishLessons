# review
id: wczesnie
format: 2
lemma: "wcześnie"
rank: 285
pos: adv
pron: { cyr: "фчэ́сьне" }
senses:
  - id: early
    ru: "рано"
    examples:
      - pl: "Wcześnie wróciłem."
        ru: "Я скоро вернусь."
        source: { kind: tatoeba, id: 2145566 }
      - pl: "Zaczął wcześnie rano."
        ru: "Он начал рано утром."
        source: { kind: tatoeba, id: 6014697 }
      - pl: "Tom wstaje wcześnie rano."
        ru: "Том встаёт рано утром."
        source: { kind: tatoeba, id: 6030198 }
  - id: earlier
    ru: "wcześniej — раньше, ранее, прежде"
    examples:
      - pl: "Wcześniej był tu kościół."
        ru: "Раньше здесь была церковь."
        source: { kind: tatoeba, id: 3107604 }
      - pl: "Już zrobiłem to wcześniej."
        ru: "Я уже делал это ранее."
        source: { kind: tatoeba, id: 8343257 }
      - pl: "Przyszedłeś za wcześnie."
        ru: "Ты пришёл слишком рано."
        source: { kind: tatoeba, id: 977243 }
notes:
  - { kind: usage, text: "Степени: wcześnie — wcześniej — najwcześniej." }
  - { kind: usage, text: "wcześniej значит и «раньше по времени», и «прежде, до этого»: Wcześniej był tu kościół «Прежде здесь была церковь»." }
  - { kind: usage, text: "za wcześnie — «слишком рано»; jak najwcześniej — «как можно раньше»; wcześnie rano — «рано утром»." }
collocations:
  - { pl: "wcześnie rano", ru: "рано утром" }
  - { pl: "za wcześnie", ru: "слишком рано" }
  - { pl: "jak najwcześniej", ru: "как можно раньше" }
  - { pl: "wcześniej czy później", ru: "рано или поздно" }
etymology: "От прилагательного wczesny «ранний», праславянское *vьčesnъ."
memory: "Ступени: wcześnie — wcześniej — najwcześniej. И wcześniej значит не только «раньше по времени», но и «прежде, до этого»."
idioms:
