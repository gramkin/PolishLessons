notes:
  - { kind: usage, text: "РОДИТЕЛЬНЫЙ ЕДИНСТВЕННОГО — SOKU, А НЕ «SOKA». У польских неодушевлённых мужского рода родительный падеж бывает двух видов, на -a и на -u, и выбор приходится запоминать словом: soku, cukru, chleba, sera. Общего правила нет, есть только склонности: вещества и отвлечённые понятия чаще берут -u, а предметы со счётом — -a. Русское «сока» подсказки не даёт." }
  - { kind: pronunciation, text: "Форма SOKU работает сразу за два падежа — родительный и предложный: nie ma soku «нет сока» и w soku «в соку». Различает их только предлог. В дательном падеже отдельная форма — SOKOWI." }
collocations:
