  - { pl: "woda", ru: "вода", relation: root, id: woda }
etymology: "Из праславянского *sokъ — то же слово, что русское «сок», и значения совпадают целиком, включая растительный. Отсюда же польские soczysty «сочный» и sokowirówka «соковыжималка», построенная из «сок» и «вертеть», ровно по русской модели."
memory: "Родительный — SOKU, не «soka»: nie ma soku. Та же форма служит предложным: w soku. А дательный отдельный — sokowi."
idioms:
