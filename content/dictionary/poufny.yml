  - { pl: "poufność", ru: "конфиденциальность", relation: derived }
etymology: "От UFAĆ «доверять» с приставкой PO-, буквально «доверенный». Корень UF- родствен русскому «уповать», «упование»."
memory: "Poufny — конфиденциальный. Poufne dane, poufna rozmowa. От ufać — доверять. Читается «поу́фны», по-уф-ны."
idioms:
