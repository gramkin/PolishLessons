# review
id: poufny
format: 2
lemma: "poufny"
rank: 5327
pos: adj
pron: { cyr: "поу́фны" }
senses:
  - id: confidential
    ru: "конфиденциальный, секретный"
    examples:
      - pl: "To poufne informacje."
        ru: "Это конфиденциальная информация."
        source: { kind: authored }
      - pl: "Dokument ma klauzulę „poufne”."
        ru: "На документе гриф «конфиденциально»."
        source: { kind: authored }
      - pl: "Dane klientów są poufne."
        ru: "Данные клиентов конфиденциальны."
        source: { kind: authored }
  - id: private
    ru: "доверительный (о разговоре)"
    examples:
      - pl: "Odbyli poufną rozmowę."
        ru: "У них был доверительный разговор."
        source: { kind: authored }
      - pl: "Powiedział mi to w poufnym tonie."
        ru: "Он сказал мне это доверительным тоном."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "POUFNY не похож на русские слова, но корень знаком: UFAĆ — «доверять», как русское «уповать». POUFNY — «то, что доверено»: POUFNA ROZMOWA, POUFNE DANE. На документах: POUFNE — «конфиденциально», TAJNE — «секретно», ŚCIŚLE TAJNE — «совершенно секретно». Не путать с UFNY, «доверчивый»." }
  - { kind: usage, text: "Одиннадцать форм без степеней. Форма для мужчин-людей: POUFNI INFORMATORZY, «тайные осведомители». Наречие POUFNIE — «по секрету, между нами»: MÓWIĄC POUFNIE. Синоним в разговоре — MIĘDZY NAMI." }
  - { kind: government, text: "Для кого — DLA с родительным: POUFNE DLA ZARZĄDU. «Сохранять конфиденциальность» — ZACHOWAĆ POUFNOŚĆ. Стоит и перед, и после существительного: POUFNA NOTATKA, NOTATKA POUFNA." }
  - { kind: pronunciation, text: "Читается «поу́фны», три слога: PO-UF-NY, ударение на UF. O и U не сливаются в одно «у». Наречие POUFNIE — «поу́фне»." }
  - { kind: register, text: "Деловое и официальное слово: договоры, переписка, грифы. В живом разговоре чаще W ZAUFANIU или MIĘDZY NAMI: POWIEM CI W ZAUFANIU." }
collocations:
  - { pl: "poufne informacje", ru: "конфиденциальная информация" }
  - { pl: "poufna rozmowa", ru: "доверительный разговор" }
  - { pl: "ściśle poufne", ru: "строго конфиденциально" }
family:
  - { pl: "ufać", ru: "доверять", relation: root, id: ufac }
