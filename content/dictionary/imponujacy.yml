etymology: "От глагола IMPONOWAĆ, из латинского IMPONERE «накладывать, возлагать», собранного из IN- «на» и PONERE «класть, ставить». Исходный смысл был вещественным: наложить что-то на что-то, — а значение «внушать уважение» развилось через идею наложенного впечатления, того, что оставлено на зрителе. Тот же корень PONERE дал целое гнездо знакомых слов: KOMPONOWAĆ «составлять», PROPONOWAĆ «предлагать», EKSPOZYCJA «выставка», DEPOZYT «вклад», и во всех речь о том, что куда-то положено. Русское «импонировать» пришло из немецкого IMPONIEREN, то есть из того же латинского источника, но другой дорогой, и потому глагол в двух языках совпал, а причастие разошлось."
memory: "Переводить «впечатляющий», а не «импонирующий»: imponujący wynik — впечатляющий результат. А вот глагол совпадает, и управление тоже: imponować komuś, «импонировать кому-то», дательный в обоих языках. Степеней нет, говорят bardziej imponujący. Десять форм, как у przewodniczący: мужско-личное множественное совпадает с мужским единственного."
idioms:
