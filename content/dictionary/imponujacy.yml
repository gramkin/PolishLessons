notes:
  - { kind: false-friend, text: "Русское «импонирующий» существует, но употребляется редко и значит не то же самое, а польское IMPONUJĄCY совершенно обиходно и значит «впечатляющий, внушительный». Поэтому переводить его надо именно так: IMPONUJĄCY WYNIK есть «впечатляющий результат», а не «импонирующий». Зато глагол, от которого причастие образовано, переводится прямо: IMPONOWAĆ KOMUŚ значит «импонировать кому-то», и управление у него дательным падежом совпадает в двух языках полностью — ON MI IMPONUJE, «он мне импонирует». Так что глагол переносится, а причастие нет." }
  - { kind: usage, text: "Это причастие действительного залога от IMPONOWAĆ, и как прилагательное оно склоняется полностью, но степеней сравнения не образует: вместо IMPONUJĄCSZY скажут BARDZIEJ IMPONUJĄCY. Парадигма у него того же вида, что у PRZEWODNICZĄCY: десять форм, а не одиннадцать, потому что мужско-личная форма множественного совпадает с мужской единственного. Самые частые сочетания: IMPONUJĄCY DOROBEK, IMPONUJĄCA WIEDZA, IMPONUJĄCE TEMPO, IMPONUJĄCA POSTAWA." }
  - { kind: pronunciation, text: "Читается «импонуйо́нцы», ударение на предпоследнем слоге, то есть на -JĄ-. Носовая ą перед c даёт «он», как в SĄD и WĄTROBA, поэтому сочетание JĄC звучит «йонц». Слово длинное, пять слогов: IM-PO-NU-JĄ-CY. В женской форме IMPONUJĄCA ударение остаётся на том же слоге, «импонуйо́нца», а в формах с окончанием на два слога, как IMPONUJĄCEGO, оно переезжает вправо: «импонуйонцэ́го»." }
  - { kind: government, text: "Прилагательное согласуется с существительным и само ничем не управляет. Зато стоит запомнить управление его глагола, потому что оно совпадает с русским: IMPONOWAĆ требует дательного падежа лица — IMPONUJE MI JEGO SPOKÓJ «мне импонирует его спокойствие». Чем именно впечатляет, вводится творительным: IMPONOWAĆ WIEDZĄ «впечатлять знаниями». Степени сравнения описательные: BARDZIEJ IMPONUJĄCY, NAJBARDZIEJ IMPONUJĄCY, и это общее правило для причастий в роли прилагательных." }
