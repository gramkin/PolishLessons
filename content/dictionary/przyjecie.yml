# review
id: przyjecie
format: 2
lemma: "przyjęcie"
rank: 3501
pos: noun
pron: { cyr: "пшые́ньце" }
senses:
  - id: party
    ru: "приём, вечеринка"
    examples:
      - pl: "Wydał huczne przyjęcie."
        ru: "Он устроил шумный приём."
        source: { kind: translated, id: 354097 }
      - pl: "Przyjęcie było straszliwie nudne."
        ru: "Приём был ужасно скучным."
        source: { kind: translated, id: 817905 }
      - pl: "Poznaliśmy się na przyjęciu."
        ru: "Мы познакомились на приёме."
        source: { kind: translated, id: 711038 }
  - id: acceptance
    ru: "принятие, приём (лекарства, взятки, на работу)"
    examples:
      - pl: "Odmówił przyjęcia łapówki."
        ru: "Он отказался принять взятку."
        source: { kind: tatoeba, id: 814578 }
      - pl: "Po przyjęciu lekarstwa od razu zrobiło mi się lepiej."
        ru: "После приёма лекарства мне сразу стало легче."
        source: { kind: tatoeba, id: 12718621 }
notes:
  - { kind: usage, text: "Два значения: «приём, вечеринка» (самое частое) и «принятие» чего-либо — лекарства, взятки, на работу." }
  - { kind: usage, text: "В разговорной речи вечеринку чаще называют impreza; przyjęcie звучит чуть более официально." }
  - { kind: government, text: "Средний род: to przyjęcie, tego przyjęcia. От глагола przyjąć «принять»." }
  - { kind: false-friend, text: "Русское «приём» покрывает оба значения, так что здесь языки совпадают." }
collocations:
  - { pl: "wydać przyjęcie", ru: "устроить приём" }
  - { pl: "przyjęcie do pracy", ru: "приём на работу" }
etymology: "От przyjąć «принять» (przy- + jąć «взять»); русское «приём» образовано от «принять» тем же способом."
memory: "przyjęcie — и «приём, вечеринка», и «принятие». В разговорной речи вечеринка чаще impreza. Глагол — przyjąć «принять»."
idioms:
  - { pl: "wydać przyjęcie", ru: "устроить приём" }
  - { pl: "ciepłe przyjęcie", ru: "тёплый приём" }
