etymology: "Через немецкое PLATZ из латинского platea «улица, широкий проход», а то — из греческого plateia «широкая». Русский «плац» пришёл из того же немецкого источника, но закрепился за воинской площадкой и дальше не пошёл, тогда как польский оставил слову всю исходную широту: любое открытое место в городе есть plac. От того же латинского корня идут и «плато», и «платформа», и французское place."
memory: "Не «плац», а «площадь» и «площадка»: plac zabaw, plac budowy. Форма placu — родительный, местный и звательный сразу."
idioms:
