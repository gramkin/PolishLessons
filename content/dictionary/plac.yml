notes:
  - { kind: false-friend, text: "Звучит слово в точности как русский «плац», и это главная ловушка. Русское «плац» — только воинская площадка для строя и ничего больше. Польское PLAC — любая площадь и любая открытая площадка: PLAC ZAMKOWY «Замковая площадь», PLAC ZABAW «детская площадка», PLAC BUDOWY «стройплощадка», PLAC TARGOWY «рынок». Значение шире русского настолько, что переводить «плацем» почти всегда неверно; выбирайте «площадь», «площадка» или «участок» по контексту. И заметьте: «площадь» как мера поверхности — это совсем другое слово, POWIERZCHNIA." }
  - { kind: usage, text: "Форма PLACU работает за три падежа: родительный, местный и звательный. Такое совпадение уже встречалось у PLIK, NAPÓJ и BAGAŻ, но причина здесь иная. У plik основа твёрдая, и окончание -u в родительном было прихотью, которую приходилось запоминать. У plac основа мягкая, на c, а у мягких основ -u в родительном — выбор обычный, почти правило. Значит одна и та же картина возникает то по лексической случайности, то закономерно, и различать эти два случая полезно." }
  - { kind: usage, text: "Множественное число PLACE с окончанием -e, как у всех мягких мужских основ: plac — place, as grosz — grosze, bagaż — bagaże. Родительный множественного при этом PLACÓW, без дублета на -y. Сравните NAPÓJ с его двумя формами napoi и napojów: дублет, как сказано в карточке GROSZ, проверяется по каждому слову отдельно и по виду основы не угадывается." }
