etymology: "От HISZPANIA, из латинского HISPANIA, и необычный вид слова объясняется путём заимствования: польский взял его через средневековое немецкое посредство, где латинское начальное HI- дало H с последующим шипящим, отсюда HISZ-. Русский взял название из других языков и сохранил «Испанию» ближе к латинской форме. Поэтому два слова об одной стране выглядят совершенно разно, хотя источник один. Суффикс -SKI в польском образует прилагательные от названий стран и народов и крайне продуктивен: POLSKI, NIEMIECKI, WŁOSKI, HISZPAŃSKI, и во всех мужско-личное множественное даёт -SCY."
memory: "Название страны неузнаваемо для русского уха: Hiszpania, Hiszpan, hiszpański — проговорить тройкой. Названия языков в польском это прилагательные: uczyć się hiszpańskiego с родительным, znać hiszpański с винительным, а наречная форма особая, po hiszpańsku. Мужско-личное множественное hiszpańscy, с переходом sk в sc, как polscy и miejscy."
idioms:
