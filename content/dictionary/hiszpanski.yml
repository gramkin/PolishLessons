notes:
  - { kind: usage, text: "Названия языков в польском — это прилагательные, и употребляются они двумя способами, которые стоит различать. В роли существительного: UCZYĆ SIĘ HISZPAŃSKIEGO «учить испанский», с родительным, ZNAĆ HISZPAŃSKI, с винительным. И в наречной форме с предлогом PO: MÓWIĆ PO HISZPAŃSKU «говорить по-испански», где форма особая, на -U, и к склонению прилагательного не относится. Русский строит это так же: «по-испански», и перенос полный. Названия языков пишутся со строчной буквы, как и названия народов в прилагательной форме." }
  - { kind: pronunciation, text: "Читается «хишпа́ньски», ударение на предпоследнем слоге. Начальное H даёт «х», сочетание SZ — «ш», а Ń — мягкое «нь». Слово четырёхсложное: HISZ-PAŃ-SKI — точнее трёхсложное, HISZ-PAŃ-SKI. Мужско-личная форма множественного HISZPAŃSCY показывает переход SK в SC: «хишпа́ньсцы». Это то же обязательное чередование, что в MIEJSKI и MIEJSCY, POLSKI и POLSCY, и у всех прилагательных на -SKI оно одинаково." }
  - { kind: false-friend, text: "Ловушки в значении нет, но название страны стоит запомнить отдельно, потому что оно не похоже ни на русское, ни на само испанское: HISZPANIA. Начальное H и SZ в середине делают слово неузнаваемым для русского уха, хотя источник тот же, латинское HISPANIA. Испанец — HISZPAN, испанка — HISZPANKA. Ряд HISZPANIA, HISZPAN, HISZPAŃSKI стоит проговорить вместе, потому что по отдельности каждое из них для русскоязычного выглядит неожиданно." }
  - { kind: government, text: "Прилагательное согласуется с существительным и ничем не управляет. В роли названия языка ведёт себя как существительное мужского рода: HISZPAŃSKI JEST ŁATWIEJSZY, UCZĘ SIĘ HISZPAŃSKIEGO, ZNAM HISZPAŃSKI. Степеней сравнения нет, потому что прилагательное относительное: одиннадцать форм в таблице, как у MIEJSKI и PRAWNY. Наречная форма PO HISZPAŃSKU в парадигму не входит и образуется отдельно, суффиксом -U после предлога PO." }
