etymology: "От прилагательного PIĘKNY «красивый», слова праславянского, но такого, от которого в русском не осталось обиходного потомка: русский назвал красоту от корня «крас-», откуда «краса», «красивый», «прекрасный». Суффикс -OŚĆ при этом свой и отвечает русскому -ОСТЬ, так что устроено слово знакомо, а корень незнаком. Это один из тех случаев, когда два близких языка выбрали для самого обычного понятия совершенно разные слова. Из того же польского гнезда PIĘKNO, PIĘKNIE и UPIĘKSZYĆ «украсить»."
memory: "Польский делит русскую «красоту» на два слова: piękno среднего рода о красоте как понятии, piękno przyrody, и piękność женского рода о свойстве человека и в устойчивых оборотах, konkurs piękności, salon piękności. Второе значение, «красавица», сегодня звучит старомодно. Корень piękny русской родни не имеет, русский взял «крас-». Читается «пе́нкносьчь», где ę перед k даёт «эн». Не путать с pięć «пять», начало то же, а слова разные."
