notes:
  - { kind: usage, text: "Польский держит порознь то, что русский называет одним словом «красота». PIĘKNO, среднего рода, — это красота отвлечённая, как понятие: PIĘKNO PRZYRODY «красота природы», PIĘKNO MUZYKI. PIĘKNOŚĆ, женского рода, — это красота как свойство кого-то или прямо красавица: BYŁA PIĘKNOŚCIĄ «она была красавицей». В устойчивых оборотах стоит именно PIĘKNOŚĆ: KONKURS PIĘKNOŚCI, SALON PIĘKNOŚCI. Шесть форм, обычный разряд на -OŚĆ." }
  - { kind: false-friend, text: "У этого корня нет обиходного русского соответствия, и искать его не стоит: русский назвал красоту от «красы», а польский словом PIĘKNY, у которого в русском родни не осталось. Зато стоит запомнить соседа по звучанию: PIĘKNY «красивый» и PIĘĆ «пять» начинаются одинаково, но родства между ними нет никакого. И не путать PIĘKNOŚĆ с PIĘKNO: первое о человеке и в оборотах, второе о красоте как таковой." }
  - { kind: government, text: "Красота чего — родительный без предлога: PIĘKNOŚĆ TEGO MIEJSCA, PIĘKNO PRZYRODY, как и по-русски. В устойчивых сочетаниях слово само стоит в родительном: KONKURS PIĘKNOŚCI, SALON PIĘKNOŚCI, то есть «конкурс красоты», «салон красоты», и здесь схема совпадает. Быть красавицей — BYĆ PIĘKNOŚCIĄ, с творительным после BYĆ, тогда как русский говорит «была красавицей» тоже творительным, так что совпадает и это." }
  - { kind: pronunciation, text: "Читается «пе́нкносьчь», два слога, ударение на первом. Буква I после P только знак мягкости, а носовая Ę перед K звучит как «эн», поэтому начало слова «пенк». Конец, -ŚĆ, это два мягких звука подряд, «сьчь». В прилагательном PIĘKNY слышно «пе́нкны», а в наречии PIĘKNIE — «пе́нкне». Сравните с PIĘĆ «пять», которое звучит «пенчь»: начало то же, а конец совсем другой." }
  - { kind: register, text: "В первом значении слово нейтральное и живёт в названиях заведений и конкурсов. Частые обороты: KONKURS PIĘKNOŚCI «конкурс красоты», SALON PIĘKNOŚCI «салон красоты», INSTYTUT PIĘKNOŚCI. Во втором значении, о женщине, слово звучит либо старомодно и галантно, либо насмешливо, смотря по тону, и в современной речи его стоит употреблять осторожно. Нейтрально скажут PIĘKNA KOBIETA или просто ŁADNA." }
