etymology: "Приставка W- плюс PAKOWAĆ, заимствованное из немецкого PACKEN «паковать, укладывать». Слово разошлось по всей Европе из нижненемецких портов вместе с торговлей, и русский взял его тем же путём, дав «паковать», «пакет», «упаковка», «пачка». Поэтому польское PAKOWAĆ и русское «паковать» — не родня по происхождению, а попутчики по заимствованию, и совпадение у них полное именно потому, что источник один. Приставка же W- своя, славянская, и отвечает русской В-. Получается слово-гибрид: славянская приставка на германском корне, случай для польского совершенно обычный."
memory: "Корень заимствованный и русскому знакомый: pakować «паковать», paczka «пачка» и заодно «посылка», opakowanie «упаковка». Приставка w- это русская в-, но готового «впаковать» в русском нет, и переводить надо «запихнуть» или «втянуть». Спряжение на -uj-: wpakuję, wpakujesz. Слово разговорное и слегка небрежное, а живёт прежде всего в обороте wpakować się w kłopoty «влипнуть в неприятности»."
idioms:
  - { pl: "wpakować się w kłopoty", ru: "влипнуть в неприятности" }
