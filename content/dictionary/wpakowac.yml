notes:
  - { kind: register, text: "Слово разговорное и выразительное, с оттенком бесцеремонности: WPAKOWAĆ значит не просто положить, а запихнуть, не разбирая. Нейтральное «положить в» — это WŁOŻYĆ DO, а аккуратно сложить вещи — SPAKOWAĆ. Поэтому WPAKOWAŁ WSZYSTKO DO WALIZKI звучит с лёгкой укоризной. Особенно живы переносные обороты: WPAKOWAĆ SIĘ W KŁOPOTY «влипнуть в неприятности», WPAKOWAĆ KOGOŚ W DŁUGI «втянуть кого-то в долги», WPAKOWAĆ KOMUŚ KULKĘ «всадить кому-то пулю». В письменном тексте все они требуют осторожности." }
  - { kind: usage, text: "Глагол на -OWAĆ, и личные формы идут на -UJ-: WPAKOWAĆ, но WPAKUJĘ, WPAKUJESZ, WPAKUJĄ. Тот же образец, что в русском «паковать» и «пакую». Приставка W- отвечает русской В-, но подобрать русскую пару буквально не удастся: глагола «впаковать» в литературном языке нет, и переводить приходится словами «запихнуть», «впихнуть», «втянуть». Это обычное дело: приставка совпадает, а готового русского слова с ней нет. Пятьдесят три формы — подпись переходного глагола совершенного вида." }
  - { kind: government, text: "Прямое дополнение в винительном, направление через DO с родительным: WPAKOWAĆ COŚ DO WALIZKI, DO BAGAŻNIKA. В переносном значении направление идёт через W с винительным: WPAKOWAĆ KOGOŚ W KŁOPOTY, W DŁUGI, W TARAPATY. Разница предлогов здесь смысловая: DO о месте, W о положении, в которое попадают. Возвратное WPAKOWAĆ SIĘ значит «влезть, влипнуть» и берёт те же предлоги: WPAKOWALI SIĘ DO JEDNEGO AUTA и WPAKOWALI SIĘ W DŁUGI." }
  - { kind: pronunciation, text: "Читается «фпако́вачь», четыре слога, ударение на предпоследнем. Начальное W перед глухим P оглушается и звучит как «ф», поэтому слово начинается с «фпа», а не с «впа»; то же правило работало в WCISNĄĆ. Конечное Ć мягкое, «чь». В личных формах ударение переезжает вместе с основой: WPAKUJĘ это «фпаку́е». В причастии WPAKOWANY слышно «фпакова́ны»." }
  - { kind: false-friend, text: "Корень здесь не славянский, а заимствованный, и русскому он знаком: PAKOWAĆ это «паковать», PACZKA — «пачка» и «посылка», OPAKOWANIE — «упаковка». Оба языка взяли слово из немецкого PACKEN, так что родство тут по заимствованию, а не по происхождению. Ловушка в слове PACZKA: кроме пачки оно значит ещё и почтовую посылку, а в разговоре — компанию приятелей, PACZKA ZNAJOMYCH. Русское «пачка» ни того, ни другого не значит." }
