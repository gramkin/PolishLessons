notes:
  - { kind: false-friend, text: "Здесь польское и русское слово совпадают полностью: PRZYSIĘGA это «присяга», и даже построены они из одних и тех же частей. Приставка PRZY- отвечает русской «при-», а корень тот же, что в польском SIĘGAĆ «тянуться, достигать» и русском «сягать», сохранившемся в «досягаемый» и «посягать». То есть и поляк, и русский назвали клятву «притягиванием», прикосновением к святыне — метафора одна. Отсюда же PRZYSIĘGŁY «присяжный» и SĄD PRZYSIĘGŁYCH «суд присяжных». Ловушка не в значении, а в формах: родительный множественного PRZYSIĄG меняет Ę на Ą, а дательный и местный PRZYSIĘDZE меняет G на DZ." }
  - { kind: government, text: "Женский род. Частотные обороты: SKŁADAĆ PRZYSIĘGĘ «приносить присягу», ZŁOŻYĆ PRZYSIĘGĘ в совершенном виде, ZŁAMAĆ PRZYSIĘGĘ «нарушить присягу», DOCHOWAĆ PRZYSIĘGI «сохранить верность присяге» — последнее требует родительного, а не винительного. Предлог POD с творительным даёт POD PRZYSIĘGĄ «под присягой», и это стандартная формула в суде: ZEZNAWAĆ POD PRZYSIĘGĄ. Чего присяга касается, передаётся родительным: PRZYSIĘGA WIERNOŚCI, PRZYSIĘGA MAŁŻEŃSKA «брачная клятва»." }
  - { kind: usage, text: "В склонении два чередования, и оба типичны для польского. Первое: носовое Ę держится всюду, кроме родительного множественного, где появляется Ą — PRZYSIĘGA, PRZYSIĘGI, PRZYSIĘGĘ, но PRZYSIĄG. Это тот же обмен, что в ZĄB и ZĘBY, только в обратную сторону. Второе: перед окончанием -E заднее G смягчается в DZ, отсюда дательный и местный PRZYSIĘDZE, а не PRZYSIĘGIE. Такое G в DZ встречается постоянно: FLAGA и FLADZE, USŁUGA и USŁUDZE, RÓWNOWAGA и RÓWNOWADZE. Форма PRZYSIĘGI покрывает сразу три позиции: родительный единственного, именительный и винительный множественного." }
  - { kind: pronunciation, text: "Читается «пшисе́нга», три слога, ударение на предпоследнем. Сочетание PRZ в начале слова звучит глухо, «пш», а не «пж», потому что P оглушает следующий согласный. Носовое Ę перед G даёт «эн» с призвуком заднего н: SIĘ это «сен». В форме PRZYSIĘDZE сочетание DZ произносится как слитное «дз»: «пшисе́ндзе». В родительном множественного PRZYSIĄG носовое Ą перед G читается «он», а конечное G оглушается до «к»: «пшисё́нк»." }
