etymology: "Из приставки PRZY- и праславянского корня *sęg- «тянуться, достигать», от которого польское SIĘGAĆ и русское «сягать». Русская «присяга» построена из тех же двух частей — «при-» плюс «сягать», — и значит буквально то же самое: притягивание, прикосновение. За метафорой стоит древний обряд: присягающий касался рукой святыни, оружия или земли, и само касание делало слово обязательным. Корень виден в русском и за пределами присяги: «досягаемый», «посягать», «недосягаемый». В польском гнездо шире: SIĘGAĆ «тянуться», ZASIĘG «охват, радиус действия», DOSIĘGNĄĆ «достать». Суффикс -GA здесь не уменьшительный, а отглагольный, как в SKARGA от SKARŻYĆ. От того же слова образовано PRZYSIĘGŁY «присяжный», и SĄD PRZYSIĘGŁYCH отвечает русскому «суду присяжных» часть за частью."
memory: "То же слово, что «присяга», и собрано из тех же частей: przy- плюс корень sięgać «тянуться» — как «при-» плюс «сягать» в «посягать», «досягаемый». Клятва названа прикосновением к святыне. Трудность только в формах: родительный множественного przysiąg меняет ę на ą, дательный przysiędze меняет g на dz. Отсюда przysięgły «присяжный», sąd przysięgłych «суд присяжных»."
