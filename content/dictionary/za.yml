# review
id: za
format: 2
depth: deep
lemma: "za"
rank: 27
pos: prep
pron: { cyr: "за" }
senses:
  - id: behind
    ru: "за (где? за чем?), а также «через» о времени"
    examples:
      - pl: "Tęsknię za tobą."
        ru: "Грущу без тебя."
        source: { kind: tatoeba, id: 864109 }
      - pl: "Studiuję za granicą."
        ru: "Я учусь за границей."
        source: { kind: tatoeba, id: 531914 }
  - id: too
    ru: "слишком (перед прилагательным и наречием)"
    examples:
      - pl: "Za późno."
        ru: "Слишком поздно."
        source: { kind: tatoeba, id: 524393 }
      - pl: "Za drogo."
        ru: "Слишком дорого."
        source: { kind: authored }
  - id: for
    ru: "за (благодарность, плата)"
    examples:
      - pl: "Dziękuję za pomoc."
        ru: "Спасибо за помощь!"
        source: { kind: tatoeba, id: 751768 }
notes:
  - { kind: usage, text: "za перед прилагательным или наречием значит «слишком»: za mało «слишком мало», za dużo «слишком много»." }
  - { kind: government, text: "tęsknić za kimś «скучать по кому-то» — с творительным падежом, а не с «по»." }
  - { kind: government, text: "Благодарность и извинение идут с винительным: dziękuję za pomoc «спасибо за помощь», przepraszam za kłopot «извините за беспокойство»." }
  - { kind: false-friend, text: "za godzinę значит «через час», а не «за час». Чтобы сказать «за час» в смысле длительности, нужен винительный без предлога: zrobiłem to w godzinę." }
collocations:
  - { pl: "za darmo", ru: "бесплатно" }
  - { pl: "za granicą", ru: "за границей" }
  - { pl: "za chwilę", ru: "через минуту" }
etymology: "Праславянское *za — то же, что русское «за»."
memory: "Три ловушки разом: za mały значит «слишком маленький»; tęsknić za kimś — «скучать по кому-то»; za godzinę — «через час», а не «за час»."
idioms:
