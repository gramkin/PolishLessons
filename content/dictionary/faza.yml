etymology: "Из греческого PHASIS «появление, явление», от PHAINESTHAI «показываться, являться» — того же корня, что FANTASTYCZNY, разобранный в отдельной карточке, и что FOTOGRAFIA через PHOS «свет». Исходно слово было астрономическим и означало появление светила в определённом виде, отсюда FAZY KSIĘŻYCA, а значение «этап» наросло позже, по аналогии: этап есть вид, в котором процесс сейчас является. Русская «фаза» пришла той же дорогой, через латынь и научные тексты восемнадцатого века, поэтому слова совпадают до буквы и до значения."
memory: "Совпадает с русским полностью, включая все три круга употребления: проектная фаза, групповой этап, фаза в розетке, фазы луны. Расхождение одно, в управлении: przejść DO następnej fazy, с родительным, где русский берёт винительный. В дательном и местном z смягчается: w fazie. Корень тот же, что в fantastyczny: греческое phainesthai «являться»."
idioms:
  - { pl: "faza grupowa", ru: "групповой этап" }
  - { pl: "to tylko faza", ru: "это просто этап" }
