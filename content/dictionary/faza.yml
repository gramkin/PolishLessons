notes:
  - { kind: pronunciation, text: "Читается «фа́за», ударение на первом слоге из двух. Гласные открытые, без редукции, и слово звучит почти как русское. Главное в карточке — дательный и местный падеж FAZIE: там Z смягчается перед -IE и звучит «зе», то есть «фа́зе». Для русского это привычно, потому что и русский говорит «фазе», но в польском смягчение обязательно и на письме отмечено буквой I, которая сама слога не образует." }
  - { kind: usage, text: "Слово работает в трёх кругах, и все три совпадают с русскими. Общий: FAZA PROJEKTOWA «проектная фаза», FAZA WSTĘPNA «начальная фаза», PRZEJŚĆ DO NASTĘPNEJ FAZY. Спортивный: FAZA GRUPOWA «групповой этап», FAZA PUCHAROWA. Технический: FAZA в электрике, где польский электрик скажет SPRAWDZIĆ FAZĘ, и астрономический: FAZY KSIĘŻYCA. В разговоре встречается и оценочное употребление: TO TYLKO FAZA «это просто этап», о поведении подростка, и русский говорит так же." }
  - { kind: government, text: "Женский род на -A, склонение правильное. Винительный на -Ę: ZAKOŃCZYLI FAZĘ. Переход к следующему этапу — предлог DO с родительным: PRZEJŚĆ DO NASTĘPNEJ FAZY, и обратите внимание: русский скажет «перейти в следующую фазу», с винительным, а польский требует родительного после DO. Нахождение внутри этапа — W с местным: W TEJ FAZIE. При отрицании винительный уходит в родительный: NIE ZAKOŃCZYLI FAZY." }
  - { kind: false-friend, text: "Ложной дружбы нет: значения совпадают полностью, оба языка взяли слово из греческого через латынь и научную литературу. Отметить стоит только одно расхождение в управлении, уже разобранное выше: DO FAZY с родительным против русского «в фазу» с винительным. Это общая черта польского: после DO всегда родительный, и ошибка здесь выдаёт русскоязычного чаще, чем ошибки в самих словах." }
collocations:
  - { pl: "faza projektowa", ru: "проектная фаза" }
  - { pl: "faza grupowa", ru: "групповой этап" }
