# review
id: zartowac
format: 2
lemma: "żartować"
rank: 518
pos: verb
aspect: imperf
pron: { cyr: "жарто́ваць" }
senses:
  - id: joke
    ru: "шутить"
    note: "Совершенный вид — zażartować «пошутить»."
    examples:
      - pl: "On zawsze żartuje."
        ru: "Он всегда шутит."
        source: { kind: tatoeba, id: 632016 }
      - pl: "Tom nie żartuje."
        ru: "Том не шутит."
        source: { kind: tatoeba, id: 2570984 }
      - pl: "Myślałeś, że żartuję?"
        ru: "Ты думал, я шучу?"
        source: { kind: tatoeba, id: 10703093 }
  - id: mock
    ru: "żartować z kogoś — шутить, подшучивать над кем-л."
    note: "С предлогом z и родительным, где русский ставит «над» с творительным."
    examples:
      - pl: "Nieuprzejmie jest żartować z szefa przy ludziach."
        ru: "Невежливо шутить над начальником при людях."
        source: { kind: translated, id: 510090 }
      - pl: "Studenci bez przerwy żartowali z siebie nawzajem."
        ru: "Студенты без конца подшучивали друг над другом."
        source: { kind: translated, id: 933294 }
      - pl: "Nie żartuj sobie ze mnie!"
        ru: "Не издевайся надо мной!"
        source: { kind: translated, id: 590876 }
  - id: disbelief
    ru: "Żartujesz! — Шутишь!, Да ладно!"
    note: "Частая реакция на неожиданную новость."
    examples:
      - pl: "Żartujesz?!"
        ru: "Шутишь?!"
        source: { kind: translated, id: 502310 }
      - pl: "Nie żartuj."
        ru: "Не шути."
        source: { kind: tatoeba, id: 8621050 }
      - pl: "Żartujesz! Naprawdę tak powiedział?"
        ru: "Шутишь! Он правда так сказал?"
        source: { kind: authored }
notes:
  - { kind: government, text: "żartować z kogoś/czegoś — с предлогом z и родительным падежом: żartować z kolegi «шутить над товарищем». Русский ставит «над» с творительным, так что предлог приходится менять." }
  - { kind: usage, text: "С sobie оттенок злее: żartować sobie z kogoś — «насмехаться, издеваться»: Nie żartuj sobie ze mnie!" }
  - { kind: usage, text: "Żartujesz?! — обычная реакция «Шутишь?!», а Nie żartuj — «да ладно, не может быть»." }
  - { kind: usage, text: "Совершенный вид — zażartować «пошутить». Существительное — żart «шутка», чаще во множественном: żarty." }
collocations:
  - { pl: "żartować z kogoś", ru: "шутить над кем-либо" }
  - { pl: "Żartujesz?!", ru: "Шутишь?!" }
  - { pl: "tylko żartowałem", ru: "я просто пошутил" }
  - { pl: "żartować sobie z kogoś", ru: "насмехаться над кем-либо" }
family:
  - { pl: "żart", ru: "шутка", relation: root }
  - { pl: "zażartować", ru: "пошутить", relation: derived }
  - { pl: "żartobliwy", ru: "шутливый", relation: derived }
etymology: "От żart «шутка», заимствованного из немецкого Scherz. В украинский и белорусский слово пришло из польского — «жарт», а русского однокоренного нет."
memory: "żartować — «шутить», но управление другое: шутят z kogoś, с предлогом z и родительным, там где русский говорит «над кем-то»: żartować z kolegi. С sobie оттенок злее: Nie żartuj sobie ze mnie! «Не издевайся надо мной!». А Żartujesz?! — это просто «Шутишь?!». Совершенный вид — zażartować, существительное — żart, чаще во множественном: żarty."
idioms:
  - { pl: "Żartujesz?!", ru: "Шутишь?!" }
  - { pl: "żartować sobie z kogoś", ru: "насмехаться над кем-либо" }
  - { pl: "tylko żartowałem", ru: "я просто пошутил" }
