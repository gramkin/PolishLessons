notes:
  - { kind: government, text: "czuć zapach требует винительного: czuję zapach kawy «я чувствую запах кофе». А «не выношу запаха» — nie znoszę zapachu, родительный после отрицания." }
  - { kind: usage, text: "Глагол — pachnieć «пахнуть»: To ładnie pachnie «Это приятно пахнет»." }
  - { kind: usage, text: "Устойчиво: przyjemny zapach «приятный запах», nieprzyjemny zapach «неприятный запах», zapach perfum «запах духов»." }
  - { kind: usage, text: "Множественное zapachy значит «ароматы, отдушки»; в единственном это просто «запах»." }
collocations:
  - { pl: "czuć zapach", ru: "чувствовать запах" }
  - { pl: "przyjemny zapach", ru: "приятный запах" }
  - { pl: "zapach perfum", ru: "запах духов" }
etymology: "От pachnieć «пахнуть» с приставкой za-. Русское «запах» собрано ровно так же: за- + «пах-». Совпадение полное, включая приставку."
memory: "zapach = «запах», и слово собрано как русское: za- + pachnieć «пахнуть». Запомните падежи: czuję zapach kawy (винительный), но nie znoszę tego zapachu (родительный после отрицания)."
