# review
id: dusza
format: 2
lemma: "dusza"
rank: 694
pos: noun
pron: { cyr: "ду́ша" }
senses:
  - id: soul
    ru: "душа"
    examples:
      - pl: "Dusza ożywia ciało."
        ru: "Душа оживляет тело."
        source: { kind: translated, id: 352174 }
      - pl: "Dusza jest wieczna."
        ru: "Душа вечна."
        source: { kind: translated, id: 2493398 }
      - pl: "Dusza jest nieśmiertelna."
        ru: "Душа бессмертна."
        source: { kind: translated, id: 4049449 }
  - id: not-a-soul
    ru: "ani żywej duszy — ни одной живой души"
    note: "Идиома переносится дословно."
    examples:
      - pl: "Nie było tam żywej duszy."
        ru: "Там не было ни одной живой души."
        source: { kind: tatoeba, id: 350720 }
      - pl: "Na ulicy nie było widać ani jednej duszy."
        ru: "На улице не было видно ни души."
        source: { kind: tatoeba, id: 3460669 }
      - pl: "W domu nie było ani duszy."
        ru: "В доме не было ни души."
        source: { kind: authored }
  - id: kindred
    ru: "bratnia dusza, pokrewne dusze — родственная душа"
    examples:
      - pl: "Jesteśmy bratnimi duszami."
        ru: "Мы родственные души."
        source: { kind: translated, id: 12239955 }
      - pl: "Ty i ja to pokrewne dusze."
        ru: "Мы с тобой родственные души."
        source: { kind: translated, id: 13380183 }
      - pl: "Jesteś dusza towarzystwa."
        ru: "Ты душа компании."
        source: { kind: translated, id: 2178448 }
  - id: sell-soul
    ru: "sprzedać duszę — продать душу"
    examples:
      - pl: "Otwórz książkę, a ona otworzy twoją duszę."
        ru: "Открой книгу, и она откроет твою душу."
        source: { kind: tatoeba, id: 2148183 }
      - pl: "Sprzedał swoją duszę."
        ru: "Он продал свою душу."
        source: { kind: translated, id: 9677579 }
      - pl: "Ona ma łagodną duszę."
        ru: "У неё кроткая душа."
        source: { kind: translated, id: 355750 }
notes:
  - { kind: usage, text: "Идиомы совпадают с русскими почти дословно: ani żywej duszy «ни одной живой души», dusza towarzystwa «душа компании», bratnia dusza «родственная душа», sprzedać duszę «продать душу»." }
  - { kind: usage, text: "Одна не совпадает: z duszą na ramieniu — буквально «с душой на плече» — значит «с замиранием сердца, струхнув»." }
  - { kind: government, text: "«Ни души» требует родительного: nie było ani żywej duszy." }
  - { kind: usage, text: "Звательный duszo живёт в обращениях: duszo moja «душа моя»." }
collocations:
  - { pl: "ani żywej duszy", ru: "ни одной живой души" }
  - { pl: "dusza towarzystwa", ru: "душа компании" }
  - { pl: "bratnia dusza", ru: "родственная душа" }
  - { pl: "sprzedać duszę", ru: "продать душу" }
family:
  - { pl: "duch", ru: "дух", relation: root }
  - { pl: "duchowy", ru: "духовный", relation: derived }
  - { pl: "oddychać", ru: "дышать", relation: root }
etymology: "Праславянское *duša, от *duchъ «дух» — то же слово, что русское «душа», и та же связь с «дух» и «дышать»."
memory: "dusza — «душа», слово то же самое, и идиомы переносятся почти дословно: ani żywej duszy «ни одной живой души», dusza towarzystwa «душа компании», bratnia dusza «родственная душа», sprzedać duszę «продать душу». Одна не совпадает: z duszą na ramieniu значит «с замиранием сердца», а буквально — «с душой на плече»."
idioms:
  - { pl: "ani żywej duszy", ru: "ни одной живой души" }
  - { pl: "dusza towarzystwa", ru: "душа компании" }
  - { pl: "bratnia dusza", ru: "родственная душа" }
