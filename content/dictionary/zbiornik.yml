etymology: "От ZBIERAĆ «собирать», приставка Z- и корень *bьr-, тот же, что в русском «брать» и «собирать». Суффикс -NIK здесь образует вместилище, предмет, в котором что-то собирается, и в этом значении он работает во многих словах: CZAJNIK, KURNIK, SŁOWNIK. Русский знает тот же суффикс и ту же логику — «чайник», «курник», «словник», — но для ёмкости предпочёл заимствованный «резервуар», от французского RESERVOIR, и слово «сборник» оставил книгам. Так два языка, располагая одинаковыми средствами, развели суффикс и заимствование по разным предметам."
memory: "Не «сборник»: zbiornik это бак, резервуар, водохранилище, а сборник текстов называется zbiór — zbiór wierszy. Оба от zbierać «собирать», развёл их суффикс: -nik дал вместилище, как czajnik и kurnik. Читать в два слога: сочетание zbi это «збё», буква i только смягчает b. Местный zbiorniku на -u после k, родительный zbiornika на -a, как у всех устройств."
