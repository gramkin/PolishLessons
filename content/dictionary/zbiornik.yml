notes:
  - { kind: false-friend, text: "Опора на русский «сборник» уводит в сторону совершенно. Польское ZBIORNIK это ёмкость: бак, резервуар, водохранилище, цистерна. Сборник текстов называется ZBIÓR — ZBIÓR WIERSZY «сборник стихов», ZBIÓR OPOWIADAŃ, — или ANTOLOGIA, если составлен из разных авторов. Оба слова идут от одного глагола ZBIERAĆ «собирать», и потому похожи, но суффикс развёл их по разным предметам: -NIK дал вместилище, нулевой суффикс дал собрание. Русский в этом месте различает «сборник» и «резервуар», взяв второе слово из французского." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Местный единственного — ZBIORNIKU, с окончанием -U, потому что основа кончается на заднеязычный K: так же PASKU, KORKU, OŚRODKU. Родительный единственного — ZBIORNIKA, с окончанием -A: названия устройств и вместилищ берут именно его. Винительный равен именительному. Назначение выражается предлогом NA с винительным — ZBIORNIK NA WODĘ, ZBIORNIK NA DESZCZÓWKĘ, — а содержимое родительным: ZBIORNIK PALIWA, ZBIORNIK GAZU." }
  - { kind: pronunciation, text: "Читается «збё́рник», два слога, ударение на первом. Сочетание ZBI даёт «збё»: буква I здесь не гласная, а знак мягкости предыдущего B, и отдельного слога не образует — для русского уха это главная трудность, потому что хочется прочесть «зби-ор-ник» в три слога. Сочетание RN произносится слитно. В форме ZBIORNIKA слышно «збё́рника», в форме ZBIORNIKIEM — «збё́рникем», в форме ZBIORNIKÓW — «збё́рникуф»." }
  - { kind: register, text: "Слово нейтральное и техническое. Устойчивые сочетания: ZBIORNIK PALIWA, ZBIORNIK WODY, ZBIORNIK RETENCYJNY «водохранилище», ZBIORNIK NA DESZCZÓWKĘ. В географии ZBIORNIK WODNY означает всякий искусственный водоём, в отличие от JEZIORO, которое природное. В анатомии и в технике слово тоже на месте. Переносного употребления у него нет, и этим оно отличается от ZBIÓR, которое живёт и в математике: ZBIÓR LICZB «множество чисел»." }
