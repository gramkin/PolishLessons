etymology: "Из латинского AERA, которое означало число, отсчёт, а первоначально — медные жетоны для счёта, от AES «медь». Путь значения отсюда прямой: жетоны для счёта дали счёт вообще, счёт дал точку отсчёта лет, а точка отсчёта — целый период, от неё отмеряемый. Оба языка взяли слово из латыни позднего времени, через учёную книгу, и потому совпадение полное, вплоть до ударения. Любопытно, что ближайший родственник слова в русском — «эра» и больше ничего, тогда как исходное AES дало в европейских языках ещё и названия меди и бронзы. Польский держит при слове весь латинский ряд терминов хронологии: ERA, OKRES, EPOKA, и школа требует их различать."
memory: "Полное совпадение с русской «эрой», включая ударение: оба слова из латинского aera, означавшего сначала счётные медные жетоны, от aes «медь». Нужны прежде всего две формулы дат: nasza era, сокращённо n.e., и przed naszą erą, сокращённо p.n.e. Местный erze с меной r→rz, как komorze. Родительный множественного er без удлинения, в отличие от komór и przemów."
