notes:
  - { kind: false-friend, text: "Значение совпадает с русской «эрой» полностью, оба языка взяли слово из латыни. Запомнить стоит не смысл, а две формулы летосчисления, потому что без них не прочесть ни одной исторической даты. NASZA ERA отвечает русскому «наша эра» и сокращается как N.E. PRZED NASZĄ ERĄ — «до нашей эры», сокращается P.N.E. Обе формулы стоят в творительном падеже с предлогом PRZED, то есть буквально «перед нашей эрой», и это та же конструкция, что по-русски. В научных текстах встречается и нейтральное PRZED CHRYSTUSEM, но школьная норма именно P.N.E." }
  - { kind: usage, text: "Десять форм, женский род. Дательный и местный единственного — ERZE, где конечное R основы переходит в RZ перед окончанием -E: та же мена, что в KOMORZE рядом. Родительный множественного — ER, с нулевым окончанием и без удлинения гласной, в отличие от KOMÓR и PRZEMÓW: удлинение работает только там, где гласная стоит в закрытом слоге перед звонким согласным, а здесь слово кончается на R после одной гласной. Родительный единственного и именительный множественного — одна форма ERY." }
  - { kind: pronunciation, text: "Читается «э́ра», два слога, ударение на первом. Начальное E в польском всегда даёт «э», без всякого следа «йэ», и потому слово звучит точно как русская «эра». Буква R раскатистая. В форме ERZE буквосочетание RZ читается «ж»: «э́же», и эта форма на слух совсем не похожа на исходную — ту же картину дают KOMORZE и CZARZE. В форме ERĄ последнее Ą звучит «он»: «э́рон». В форме ERĘ конечное Ę даёт чистое «э»: «э́рэ»." }
  - { kind: register, text: "Слово книжное, но совершенно обиходное в школьном и газетном языке. Устойчивые сочетания: NOWA ERA, ERA LODOWCOWA «ледниковая эра», ERA PRZEMYSŁOWA, ERA CYFROWA, KONIEC PEWNEJ ERY «конец целой эпохи». В геологии ERA — строгий термин, выше периода и эпохи, и школьный курс требует различать ERA, OKRES, EPOKA. В переносном употреблении слово слегка торжественное: о смене руководства в клубе скажут KONIEC ERY, и это звучит с лёгкой иронией. Звательная форма ERO в живой речи не употребляется." }
