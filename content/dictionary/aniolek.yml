notes:
  - { kind: false-friend, text: "ANIOŁEK — «ангелочек», уменьшительное от ANIOŁ. Ангел-хранитель — ANIOŁ STRÓŻ. Ласково о ребёнке — ANIOŁEK, о девушке — ANIOŁ: JESTEŚ ANIOŁEM, «ты ангел»." }
  - { kind: usage, text: "Мужской род, одушевлённый: винительный ANIOŁKA. E беглое: ANIOŁEK, ANIOŁKA. Множественное — ANIOŁKI; форма ANIOŁKOWIE не используется." }
  - { kind: government, text: "Спать как ангелочек — SPAĆ JAK ANIOŁEK. Ангелочек на ёлке — ANIOŁEK NA CHOINCE. Быть ангелочком — BYĆ ANIOŁKIEM, творительный." }
  - { kind: pronunciation, text: "Читается «аньо́уэк»: NIO — «ньо», Ł — «у». Ударение на предпоследнем слоге." }
collocations:
  - { pl: "mały aniołek", ru: "маленький ангелочек" }
