# review
id: wprowadzic
format: 2
lemma: "wprowadzić"
rank: 1445
pos: verb
aspect: perf
pron: { cyr: "фпрова́дзиць" }
senses:
  - id: introduce
    ru: "ввести, внедрить, воплотить"
    examples:
      - pl: "Prezydent zawiesił konstytucję i wprowadził stan wojenny."
        ru: "Президент приостановил действие конституции и ввёл военное положение."
        source: { kind: tatoeba, id: 553598 }
      - pl: "Rząd musi wprowadzić to prawo."
        ru: "Правительство должно ввести этот закон."
        source: { kind: translated, id: 661281 }
      - pl: "Wprowadził plan w życie."
        ru: "Он воплотил план в жизнь."
        source: { kind: translated, id: 362553 }
  - id: enter-data
    ru: "ввести (данные, имя, номер)"
    examples:
      - pl: "Wprowadź swoje imię."
        ru: "Введи своё имя."
        source: { kind: translated, id: 12147424 }
      - pl: "Dane wprowadzono do komputera."
        ru: "Данные ввели в компьютер."
        source: { kind: translated, id: 909231 }
  - id: move-in
    ru: "wprowadzić się — въехать, вселиться"
    examples:
      - pl: "Kiedy mogę się wprowadzić?"
        ru: "Когда я могу въехать?"
        source: { kind: translated, id: 12040322 }
      - pl: "Wprowadzili się tu ostatnio."
        ru: "Они недавно сюда въехали."
        source: { kind: translated, id: 368389 }
notes:
  - { kind: usage, text: "Совершенный вид к wprowadzać. Глагол очень широкий: «ввести закон», «внести изменения», «ввести данные», «ввести человека в комнату»." }
  - { kind: usage, text: "С się значит «въехать, вселиться»: Kiedy mogę się wprowadzić? Противоположность — wyprowadzić się «съехать»." }
  - { kind: usage, text: "wprowadzić w błąd — «ввести в заблуждение», выражение совпадает с русским буквально." }
  - { kind: usage, text: "wprowadzić w życie — «воплотить в жизнь»: Wprowadził plan w życie." }
collocations:
  - { pl: "wprowadzić w błąd", ru: "ввести в заблуждение" }
  - { pl: "wprowadzić w życie", ru: "воплотить в жизнь" }
  - { pl: "wprowadzić się", ru: "въехать, вселиться" }
etymology: "Приставка w- и prowadzić «вести» (праславянское *voditi). Русское «ввести» собрано из тех же частей, и большинство значений совпадает."
memory: "wprowadzić — «ввести» в очень широком смысле: закон, изменения, данные, человека в комнату. А с się это «въехать, вселиться»: Kiedy mogę się wprowadzić? Противоположность — wyprowadzić się «съехать»."
idioms:
  - { pl: "wprowadzić w błąd", ru: "ввести в заблуждение" }
  - { pl: "wprowadzić w życie", ru: "воплотить в жизнь" }
  - { pl: "wprowadzić się", ru: "въехать, вселиться" }
