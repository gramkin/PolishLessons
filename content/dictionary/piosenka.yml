notes:
  - { kind: false-friend, text: "Главная ловушка: piosenka — это обычная «песня», а вовсе не «песенка». Уменьшительного оттенка в слове нет, хотя оно и собрано из pieśń + -ka. Русское «песенка» ему не равно." }
  - { kind: usage, text: "Торжественное, высокое «песнь» — это pieśń: pieśń narodowa «народная песнь». Обиходная эстрадная песня всегда piosenka." }
  - { kind: government, text: "śpiewać piosenkę «петь песню» — винительный падеж; słuchać piosenki «слушать песню» — родительный." }
  - { kind: usage, text: "Исполнитель — piosenkarz, piosenkarka «певец, певица» (об эстраде); оперный певец — śpiewak." }
collocations:
  - { pl: "ulubiona piosenka", ru: "любимая песня" }
  - { pl: "śpiewać piosenkę", ru: "петь песню" }
  - { pl: "słowa piosenki", ru: "слова песни" }
  - { pl: "piosenkarz", ru: "эстрадный певец" }
family:
  - { pl: "pieśń", ru: "песнь", relation: root }
  - { pl: "piosenkarz", ru: "эстрадный певец", relation: derived }
etymology: "От pieśń «песнь» с уменьшительным суффиксом -ka, но уменьшительность давно стёрлась: piosenka — нейтральное слово. Русское «песня» и польское pieśń — одного корня."
memory: "piosenka — это «песня», а не «песенка»: суффикс -ka в слове окаменел и ничего не уменьшает. Высокое «песнь» — pieśń, а обычная эстрадная песня всегда piosenka. Поёт её piosenkarz, а не śpiewak — тот поёт в опере."
idioms:
  - { pl: "ulubiona piosenka", ru: "любимая песня" }
  - { pl: "słowa piosenki", ru: "слова песни" }
  - { pl: "kto czyj chleb je, tego piosenkę śpiewa", ru: "кто платит, тот и заказывает музыку" }
formExamplesSkip:
  - { form: "piosenko", reason: "звательный падеж: к песне не обращаются, форма встречается разве что в стихах" }
