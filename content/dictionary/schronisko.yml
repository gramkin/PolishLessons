notes:
  - { kind: false-friend, text: "SCHRONISKO — «приют», место, где укрываются. Это и приют для бездомных животных, SCHRONISKO DLA ZWIERZĄT, и горная турбаза, SCHRONISKO GÓRSKIE, где туристы ночуют по пути, и молодёжный хостел. Русскому «схрон» оно родня, а ночлежка для людей без жилья — NOCLEGOWNIA." }
  - { kind: usage, text: "Восемь форм, средний род. Родительный множественного — SCHRONISK, без окончания. Дательный и местный совпадают: SCHRONISKU." }
  - { kind: government, text: "Из приюта — ZE SCHRONISKA, родительный; перед SCHR предлог Z получает E. В приюте — W SCHRONISKU, местный. Приют для кого-то — SCHRONISKO DLA KOGOŚ: DLA PSÓW." }
  - { kind: pronunciation, text: "Читается «схрони́ско», три слога, ударение на втором. S и CH произносятся раздельно, «сх». Суффикс -ISKO звучит как в LOTNISKO «лотни́ско»." }
  - { kind: register, text: "Горные SCHRONISKA — часть польской туристической традиции: простые домики с общими спальнями, горячим чаем и бигосом. В объявлениях пишут: PIES ZE SCHRONISKA SZUKA DOMU." }
collocations:
  - { pl: "schronisko młodzieżowe", ru: "молодёжный хостел" }
  - { pl: "adoptować ze schroniska", ru: "взять из приюта" }
  - { pl: "nocleg w schronisku", ru: "ночлег в приюте" }
family:
  - { pl: "chronić", ru: "охранять, защищать", relation: root, id: chronic }
  - { pl: "schronić", ru: "укрыться (schronić się)", relation: derived }
  - { pl: "schronienie", ru: "убежище, укрытие", relation: derived }
etymology: "От SCHRONIĆ SIĘ «укрыться», а тот от CHRONIĆ «охранять», праславянского глагола, общего с русским «хоронить» в старом значении «прятать, беречь». Суффикс -ISKO обозначает место, как в LOTNISKO и BOISKO."
memory: "Schronisko — приют: для животных и горный, для туристов. Читается «схрони́ско». Pies ze schroniska — собака из приюта. От chronić — охранять, родня русского «хоронить» в смысле «прятать»."
