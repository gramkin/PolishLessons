# review
id: widok
format: 2
lemma: "widok"
rank: 1210
pos: noun
pron: { cyr: "ви́док" }
senses:
  - id: view
    ru: "вид, панорама"
    examples:
      - pl: "Jaki piękny widok!"
        ru: "Какой прекрасный вид!"
        source: { kind: translated, id: 3961115 }
      - pl: "Widok ze szczytu tego budynku był wspaniały."
        ru: "Вид с вершины этого здания был великолепным."
        source: { kind: tatoeba, id: 1685315 }
      - pl: "Czy mają Państwo stolik z widokiem na ocean?"
        ru: "Есть ли у вас столик с видом на океан?"
        source: { kind: tatoeba, id: 983434 }
  - id: at-sight
    ru: "na widok czegoś — при виде чего-то"
    examples:
      - pl: "Zemdlała na widok krwi."
        ru: "При виде крови она упала в обморок."
        source: { kind: tatoeba, id: 2218919 }
      - pl: "Nie może znieść widoku krwi."
        ru: "Он не выносит вида крови."
        source: { kind: translated, id: 13812707 }
  - id: prospects
    ru: "widoki — виды, перспективы"
    examples:
      - pl: "Na jego sukces widoki są marne."
        ru: "Виды на его успех невелики."
        source: { kind: translated, id: 970288 }
      - pl: "On nie ma widoków na wyzdrowienie."
        ru: "У него нет видов на выздоровление."
        source: { kind: translated, id: 600299 }
notes:
  - { kind: government, text: "na widok czegoś «при виде чего-то» — предлог na с винительным падежом: Zemdlała na widok krwi «Она упала в обморок при виде крови»." }
  - { kind: usage, text: "Множественное widoki значит не только «виды, пейзажи», но и «виды, перспективы»: widoki na przyszłość «виды на будущее», nie ma widoków «нет никаких видов»." }
  - { kind: usage, text: "pokój z widokiem na morze «номер с видом на море» — предлог na с винительным, как в русском." }
  - { kind: usage, text: "Мужской род неодушевлённый: ten widok, tego widoku. Образовано от widzieć «видеть»." }
collocations:
  - { pl: "piękny widok", ru: "прекрасный вид" }
  - { pl: "na widok", ru: "при виде" }
  - { pl: "z widokiem na", ru: "с видом на" }
  - { pl: "widoki na przyszłość", ru: "виды на будущее" }
family:
  - { pl: "widzieć", ru: "видеть", relation: root, id: widziec }
  - { pl: "widokowy", ru: "видовой, смотровой", relation: derived }
etymology: "От widzieć «видеть» — ровно как русский «вид» от «видеть». Слова собраны одинаково и значат одно и то же."
memory: "widok — «вид», мужской род. Оборот na widok czegoś значит «при виде чего-то», с винительным. А множественное widoki — это и «пейзажи», и «перспективы»: widoki na przyszłość."
idioms:
  - { pl: "na widok", ru: "при виде" }
  - { pl: "widoki na przyszłość", ru: "виды на будущее" }
