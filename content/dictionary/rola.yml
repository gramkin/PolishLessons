# review
id: rola
format: 2
lemma: "rola"
rank: 1095
pos: noun
pron: { cyr: "ро́ля" }
senses:
  - id: function
    ru: "роль, функция"
    examples:
      - pl: "Cena nie gra roli."
        ru: "Цена не играет роли."
        source: { kind: translated, id: 780307 }
      - pl: "Japonia odgrywa kluczową rolę w gospodarce światowej."
        ru: "Япония играет ключевую роль в мировой экономике."
        source: { kind: translated, id: 599397 }
      - pl: "Rolą serca jest rozprowadzanie krwi."
        ru: "Роль сердца — разносить кровь."
        source: { kind: translated, id: 936173 }
  - id: acting
    ru: "роль (актёрская)"
    examples:
      - pl: "Tom grał rolę marynarza."
        ru: "Том играл роль моряка."
        source: { kind: translated, id: 12284318 }
      - pl: "Moja siostra zagrała główną rolę."
        ru: "Моя сестра сыграла главную роль."
        source: { kind: translated, id: 921387 }
      - pl: "Obsadzono go w roli Hamleta."
        ru: "Его взяли на роль Гамлета."
        source: { kind: translated, id: 3207166 }
notes:
  - { kind: usage, text: "Обороты те же, что в русском: grać rolę и odgrywać rolę «играть роль», nie gra roli «не играет роли»." }
  - { kind: false-friend, text: "У слова есть второе, старое значение — «пашня, поле». Оно почти вышло из живой речи, но осталось в производных: rolnik «фермер», rolnictwo «сельское хозяйство», rolny «сельскохозяйственный»." }
  - { kind: government, text: "w roli kogoś «в роли кого-то» — предложный падеж, как в русском: w roli Hamleta." }
  - { kind: usage, text: "Женский род: ta rola, tej roli. Родительный и предложный совпадают — roli." }
collocations:
  - { pl: "grać rolę", ru: "играть роль" }
  - { pl: "odgrywać rolę", ru: "играть роль" }
  - { pl: "nie gra roli", ru: "не играет роли" }
  - { pl: "główna rola", ru: "главная роль" }
family:
  - { pl: "rolnik", ru: "фермер, земледелец", relation: derived }
  - { pl: "rolnictwo", ru: "сельское хозяйство", relation: derived }
  - { pl: "rolny", ru: "сельскохозяйственный", relation: derived }
etymology: "В одном слове сошлись два разных: старое славянское rola «пашня» (отсюда rolnik «фермер») и заимствованное через французское rôle «роль» из латинского rotulus «свиток». Русская «роль» — только второе из них."
memory: "rola — «роль», и обороты те же, что в русском: grać rolę, nie gra roli. Но помните про второе, старое значение «пашня»: от него rolnik «фермер» и rolnictwo «сельское хозяйство»."
idioms:
  - { pl: "grać rolę", ru: "играть роль" }
  - { pl: "nie gra roli", ru: "не играет роли" }
  - { pl: "główna rola", ru: "главная роль" }
formExamplesSkip:
