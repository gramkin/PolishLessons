  - { form: "role", reason: "в корпусе нет примеров: множественное число у этого слова редко" }
  - { form: "rolo", reason: "звательный падеж у этого слова в живой речи не употребляется" }
  - { form: "rolom", reason: "в корпусе нет примеров: дательный падеж множественного числа у этого слова редок" }
  - { form: "ról", reason: "в корпусе нет примеров: родительный падеж множественного числа у этого слова редок" }
