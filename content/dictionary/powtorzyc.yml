# review
id: powtorzyc
format: 2
lemma: "powtórzyć"
rank: 1321
pos: verb
aspect: perf
aspectPair: powtarzac
pron: { cyr: "пофту́жыць" }
senses:
  - id: repeat
    ru: "повторить"
    examples:
      - pl: "Czy mógłbyś to powtórzyć?"
        ru: "Ты не мог бы повторить это?"
        source: { kind: tatoeba, id: 575004 }
      - pl: "Proszę powtórzyć."
        ru: "Пожалуйста, повторите."
        source: { kind: translated, id: 7078863 }
      - pl: "Powtórz!"
        ru: "Повтори!"
        source: { kind: translated, id: 8095890 }
  - id: repeat-words
    ru: "повторить слово, вопрос, ошибку"
    examples:
      - pl: "Tom powtórzył pytanie."
        ru: "Том повторил вопрос."
        source: { kind: translated, id: 3500576 }
      - pl: "Powtórzył ten sam błąd."
        ru: "Он повторил ту же ошибку."
        source: { kind: translated, id: 364906 }
      - pl: "Powtórzyłem jej ten wyraz kilkakrotnie."
        ru: "Я повторил ей это слово несколько раз."
        source: { kind: tatoeba, id: 702873 }
  - id: not-again
    ru: "to się nie powtórzy — это больше не повторится"
    examples:
      - pl: "To się już więcej nie powtórzy."
        ru: "Это больше не повторится."
        source: { kind: translated, id: 3741108 }
      - pl: "Tom obiecał, że to się nie powtórzy."
        ru: "Том обещал, что это не повторится."
        source: { kind: translated, id: 3492063 }
      - pl: "Musimy pamiętać o tej tragedii, aby się nie powtórzyła."
        ru: "Мы должны помнить об этой трагедии, чтобы она не повторилась."
        source: { kind: translated, id: 355985 }
notes:
  - { kind: government, text: "powtórzyć coś «повторить что-то» — винительный падеж. Возвратное powtórzyć się значит «повториться, случиться снова»." }
  - { kind: usage, text: "Proszę powtórzyć «Пожалуйста, повторите» — базовая фраза на уроке и при плохой связи." }
  - { kind: usage, text: "To się nie powtórzy «Это не повторится» — готовая формула извинения." }
  - { kind: usage, text: "Вид совершенный; несовершенный — powtarzać, карточка уже есть. Существительное — powtórzenie «повторение»." }
collocations:
  - { pl: "proszę powtórzyć", ru: "пожалуйста, повторите" }
  - { pl: "powtórzyć pytanie", ru: "повторить вопрос" }
  - { pl: "to się nie powtórzy", ru: "это не повторится" }
etymology: "Приставка po- и wtóry «второй»: буквально «сделать во второй раз». Русское «по-вторить» собрано ровно так же, от «вторый»."
memory: "powtórzyć — «повторить», от wtóry «второй»: буквально «сделать во второй раз», как русское «по-вторить». Возвратное powtórzyć się значит «повториться»: To się nie powtórzy. Несовершенный вид — powtarzać."
idioms:
  - { pl: "proszę powtórzyć", ru: "пожалуйста, повторите" }
  - { pl: "to się nie powtórzy", ru: "это не повторится" }
  - { pl: "powtórzyć błąd", ru: "повторить ошибку" }
