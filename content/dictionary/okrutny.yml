# review
id: okrutny
format: 2
lemma: "okrutny"
rank: 2350
pos: adj
pron: { cyr: "окру́тны" }
senses:
  - id: cruel
    ru: "жестокий"
    examples:
      - pl: "Okrutny władca nie znał litości."
        ru: "Жестокий правитель не знал жалости."
        source: { kind: authored }
      - pl: "To był okrutny żart."
        ru: "Это была жестокая шутка."
        source: { kind: authored }
  - id: harsh
    ru: "суровый, безжалостный (о судьбе, условиях)"
    examples:
      - pl: "Okrutna zima zabrała połowę stada."
        ru: "Суровая зима забрала половину стада."
        source: { kind: authored }
      - pl: "Los bywa okrutny."
        ru: "Судьба бывает жестока."
        source: { kind: authored }
  - id: awful
    ru: "ужасный (разг., усилительно)"
    examples:
      - pl: "Panuje tu okrutny bałagan."
        ru: "Здесь ужасный беспорядок."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "КОРЕНЬ ТОТ ЖЕ, ЧТО В РУССКОМ «КРУТОЙ». Okrutny восходит к праславянскому *krǫtъ «крутой, витой», от которого и русское «крутой». Русский сохранил и прямое значение, и переносное — «крутой нрав» это как раз суровый, тяжёлый характер. Польский от прямого значения отказался и оставил только переносное, доведя его до «жестокий»." }
  - { kind: usage, text: "Третье значение чисто разговорное и усилительное: okrutny bałagan, okrutnie zmęczony — ровно как русское «страшно устал» или «ужасный беспорядок». Никакой жестокости в нём нет. Наречие okrutnie работает так же: okrutnie drogi «ужасно дорогой»." }
  - { kind: pronunciation, text: "Три слога, ударение на предпоследнем: o-KRUT-ny. U читается как у, без всякого носового призвука: «окру́тны». В сравнительной степени ударение сдвигается: okrutniejszy — «окрутне́йшы»." }
  - { kind: register, text: "Степени сравнения обычные, отсюда полная парадигма в тридцать три формы. Существительное okrucieństwo «жестокость» частотно в юридическом языке: znęcanie się ze szczególnym okrucieństwem. Мужско-личное okrutni относится к людям: okrutni ludzie." }
collocations:
  - { pl: "okrutny los", ru: "жестокая судьба" }
  - { pl: "okrutna prawda", ru: "жестокая правда" }
  - { pl: "okrutnie zmęczony", ru: "ужасно усталый" }
family:
  - { pl: "okrucieństwo", ru: "жестокость", relation: derived }
  - { pl: "okrutnie", ru: "жестоко; ужасно", relation: derived, id: okrutnie }
  - { pl: "litościwy", ru: "милосердный", relation: antonym }
etymology: "Из праславянского *krǫtъ «крутой, скрученный» с приставкой o- — того же корня, что русские «крутой», «крутить», «крутой нрав». Исходно слово значило «суровый, жёсткий», как и русское выражение о характере; польский довёл его до «жестокий», а прямое значение крутизны отдал словам stromy и ostry. Отсюда okrucieństwo и okrutnik."
memory: "okrutny — «жестокий», и корень тут тот же, что в русском «КРУТОЙ»: вспомни «крутой нрав», то есть суровый. Разговорно слово усиливает: okrutnie zmęczony значит «ужасно усталый», без всякой жестокости."
idioms:
