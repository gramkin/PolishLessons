# review
id: zarejestrowac
format: 2
lemma: "zarejestrować"
rank: 4286
pos: verb
pron: { cyr: "зарэйэстро́ваць" }
senses:
  - id: register
    ru: "зарегистрировать; с SIĘ — зарегистрироваться, записаться"
    examples:
      - pl: "Zarejestrował firmę w Krakowie."
        ru: "Он зарегистрировал фирму в Кракове."
        source: { kind: authored }
      - pl: "Zarejestrowała się na portalu."
        ru: "Она зарегистрировалась на портале."
        source: { kind: authored }
      - pl: "Zarejestruj się na stronie, żeby kupić bilet."
        ru: "Зарегистрируйся на сайте, чтобы купить билет."
        source: { kind: authored }
  - id: record
    ru: "зафиксировать, записать (о приборе, камере)"
    examples:
      - pl: "Kamera zarejestrowała cały wypadek."
        ru: "Камера записала всю аварию."
        source: { kind: authored }
      - pl: "Naukowcy zarejestrowali nieznany sygnał."
        ru: "Учёные зафиксировали неизвестный сигнал."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ZAREJESTROWAĆ — «зарегистрировать», но и «зафиксировать» прибором: SEJSMOGRAF ZAREJESTROWAŁ WSTRZĄS. Записаться к врачу — ZAREJESTROWAĆ SIĘ DO LEKARZA; приёмная врача — REJESTRACJA." }
  - { kind: usage, text: "Пятьдесят три формы, включая ZAREJESTROWANI — «зарегистрированные»: ZAREJESTROWANI BEZROBOTNI. Спряжение на -UJĘ: ZAREJESTRUJĘ, ZAREJESTRUJESZ. Несовершенный вид — REJESTROWAĆ." }
  - { kind: government, text: "Что — винительный: ZAREJESTROWAĆ AUTO. Где — W с предложным: W URZĘDZIE; на чём — NA с предложным: NA STRONIE. К кому — DO с родительным: DO LEKARZA. На кого — NA с винительным: ZAREJESTROWAĆ AUTO NA ŻONĘ." }
  - { kind: pronunciation, text: "Читается «зарэйэстро́ваць»: RE — «рэ», JE — «йэ», ударение на предпоследнем слоге. ZAREJESTRUJĘ — «зарэйэстру́е»." }
  - { kind: register, text: "Официальное, канцелярское слово. В разговоре о враче часто ZAPISAĆ SIĘ. О камерах и приборах — нейтральное, газетное." }
collocations:
  - { pl: "zarejestrować samochód", ru: "зарегистрировать машину" }
  - { pl: "zarejestrować firmę", ru: "зарегистрировать фирму" }
  - { pl: "zarejestrować się do lekarza", ru: "записаться к врачу" }
family:
  - { pl: "rejestr", ru: "реестр, список", relation: root, id: rejestr }
  - { pl: "rejestracja", ru: "регистрация; регистратура", relation: derived }
  - { pl: "rejestrować", ru: "регистрировать", relation: aspect }
etymology: "Приставка ZA- плюс REJESTROWAĆ, от REJESTR «реестр», через немецкий из средневековой латыни registrum. Русское «регистрировать» — то же заимствование."
memory: "Zarejestrować — зарегистрировать: zarejestrował firmę. Kamera zarejestrowała — камера записала. Читается «зарэйэстро́ваць»."
idioms:
  - { pl: "zarejestrować się do lekarza", ru: "записаться на приём к врачу" }
