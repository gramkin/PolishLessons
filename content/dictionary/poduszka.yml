notes:
  - { kind: usage, text: "Слово совпадает с русским полностью: PODUSZKA и «подушка» — одно и то же, тот же корень, тот же уменьшительный облик, то же значение. Запоминать здесь нечего, и такие слова стоит отмечать отдельно, потому что они отдыхают среди ложных друзей. Замечу только, что привычное объяснение названия через «под ухо» — догадка, которую языковеды оспаривают, так что опираться на неё как на доказательство не стоит." }
  - { kind: usage, text: "Дательный и местный — PODUSZCE, с переходом k в c; родительный множественного — PODUSZEK, с беглым e. Пара эта у женских слов на -ka идёт вместе всегда, и в словаре она повторяется уже больше десяти раз: kostce и kostek, działce и działek, szklance и szklanek, bajce и bajek. Увидев окончание -ka, можно обе формы предсказать не задумываясь." }
  - { kind: false-friend, text: "Самое нужное сочетание называется в двух языках по-разному. Автомобильная подушка по-польски PODUSZKA POWIETRZNA, то есть «воздушная», а по-русски «подушка безопасности». Предмет один, определение разное, и перевести дословно не выйдет ни в ту, ни в другую сторону. Есть и переносное PODUSZKA FINANSOWA — «финансовая подушка», запас денег на случай беды, и здесь языки совпадают." }
collocations:
  - { pl: "poduszka powietrzna", ru: "подушка безопасности" }
  - { pl: "poszewka na poduszkę", ru: "наволочка на подушку" }
  - { pl: "spać na poduszce", ru: "спать на подушке" }
etymology: "Из праславянского *poduška — того же слова, что русская «подушка», с уменьшительным по виду суффиксом -ka. Значение и устройство у двух языков совпадают целиком. Привычное толкование «то, что под ухом» выглядит убедительно, но специалисты его оспаривают и выводят слово от корня со значением «надувать, пухнуть», так что в карточке оно приводится как догадка, а не как объяснение."
memory: "Полное совпадение с русским. Местный poduszce, родительный множественного poduszek. А автомобильная — poduszka POWIETRZNA, не «безопасности»."
idioms:
  - { pl: "poduszka powietrzna", ru: "подушка безопасности" }
  - { pl: "poduszka finansowa", ru: "финансовая подушка" }
