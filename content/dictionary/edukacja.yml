        ru: "Министр образования объявил о реформе."
        source: { kind: authored }
  - id: awareness
    ru: "просвещение (в какой-то области)"
    examples:
      - pl: "Edukacja seksualna budzi spory."
        ru: "Половое воспитание вызывает споры."
        source: { kind: authored }
      - pl: "Potrzebna jest edukacja ekologiczna."
        ru: "Нужно экологическое просвещение."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "EDUKACJA — «образование» как процесс и система: SYSTEM EDUKACJI. Образование как результат, диплом — WYKSZTAŁCENIE: MA WYŻSZE WYKSZTAŁCENIE, «у него высшее образование». Путать их — частая ошибка." }
  - { kind: usage, text: "Женский род. Учим единственное: EDUKACJA, EDUKACJI, EDUKACJĘ, EDUKACJĄ. Родительный, дательный и местный совпадают — EDUKACJI." }
  - { kind: government, text: "Министерство образования — MINISTERSTWO EDUKACJI, родительный. Вкладывать в образование — INWESTOWAĆ W EDUKACJĘ, W с винительным. Продолжать учёбу — KONTYNUOWAĆ EDUKACJĘ." }
  - { kind: pronunciation, text: "Читается «эдука́цья», ударение на предпоследнем слоге. CJA — «цья», как в RESTAURACJA." }
collocations:
  - { pl: "system edukacji", ru: "система образования" }
  - { pl: "edukacja domowa", ru: "домашнее обучение" }
  - { pl: "kontynuować edukację", ru: "продолжать учёбу" }
family:
