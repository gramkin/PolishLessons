etymology: "Из латинского EDUCATIO «воспитание», от EDUCARE «выводить, воспитывать». Тот же корень в английском EDUCATION."
memory: "Edukacja — образование как система, wykształcenie — образование как уровень. Ministerstwo Edukacji — министерство образования. Читается «эдука́цья»."
