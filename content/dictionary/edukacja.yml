# review
id: edukacja
format: 2
lemma: "edukacja"
rank: 4256
pos: noun
pron: { cyr: "эдука́цья" }
senses:
  - id: education
    ru: "образование, обучение"
    examples:
      - pl: "Edukacja w Polsce jest bezpłatna."
        ru: "Образование в Польше бесплатное."
        source: { kind: authored }
      - pl: "Rodzice dbają o edukację dzieci."
        ru: "Родители заботятся об образовании детей."
        source: { kind: authored }
