# review
id: paniusia
format: 2
lemma: "paniusia"
rank: 5328
pos: noun
pron: { cyr: "паню́ся" }
senses:
  - id: madam
    ru: "дамочка (пренебр., ирон.)"
    examples:
      - pl: "Jakaś paniusia wepchnęła się do kolejki."
        ru: "Какая-то дамочка влезла без очереди."
        source: { kind: authored }
      - pl: "Paniusia w futrze narzekała na obsługę."
        ru: "Дамочка в шубе жаловалась на обслуживание."
        source: { kind: authored }
      - pl: "Nie znoszę takich paniuś."
        ru: "Терпеть не могу таких дамочек."
        source: { kind: authored }
  - id: lady
    ru: "пани, барынька (шутл., с иронией)"
    examples:
      - pl: "Paniusia życzy sobie kawy?"
        ru: "Барыня желает кофе?"
        source: { kind: authored }
      - pl: "Zachowuje się jak paniusia z wyższych sfer."
        ru: "Она ведёт себя как барынька из высшего общества."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "PANIUSIA — уменьшительное от PANI, но не ласковое, а пренебрежительное: «дамочка, фифа». Вежливо — PANI. Обращаться к женщине PANIUSIU обидно." }
  - { kind: register, text: "Пренебрежительное и ироничное. Так говорят о капризной, высокомерной женщине. В лицо — грубость." }
  - { kind: usage, text: "Женский род. Звательный — PANIUSIU. Родительный множественного — PANIUŚ." }
  - { kind: pronunciation, text: "Читается «паню́ся»: NIU — «ню», SIA — «ся». Ударение на предпоследнем слоге." }
collocations:
  - { pl: "jakaś paniusia", ru: "какая-то дамочка" }
  - { pl: "paniusia w futrze", ru: "дамочка в шубе" }
  - { pl: "udawać paniusię", ru: "строить из себя барыню" }
family:
  - { pl: "pani", ru: "госпожа, пани", relation: root, id: pani }
  - { pl: "dama", ru: "дама", relation: root, id: dama }
  - { pl: "kobieta", ru: "женщина", relation: root, id: kobieta }
etymology: "Уменьшительное от PANI «госпожа» с суффиксом -USIA. Ироничный оттенок развился в разговорной речи."
memory: "Paniusia — дамочка, фифа (пренебр.). Jakaś paniusia — какая-то дамочка. Вежливо — pani. Читается «паню́ся»."
idioms:
  - { pl: "udawać paniusię", ru: "строить из себя барыню" }
