# review
id: piec-2
format: 2
lemma: "piec"
rank: 1526
pos: verb
pron: { cyr: "пець" }
senses:
  - id: bake
    ru: "печь (хлеб, пирог)"
    examples:
      - pl: "Piekę chleb co drugi dzień."
        ru: "Я пеку хлеб через день."
        source: { kind: authored }
      - pl: "Babcia piekła sernik w każdą niedzielę."
        ru: "Бабушка пекла творожник каждое воскресенье."
        source: { kind: authored }
      - pl: "Dawniej pieczono chleb raz w tygodniu."
        ru: "Прежде хлеб пекли раз в неделю."
        source: { kind: authored }
  - id: sting
    ru: "жечь, саднить (о боли, солнце)"
    examples:
      - pl: "Piecze mnie gardło."
        ru: "У меня саднит горло."
        source: { kind: authored }
      - pl: "Słońce piecze od rana."
        ru: "Солнце жжёт с утра."
        source: { kind: authored }
  - id: baking
    ru: "pieczenie — печение; жжение"
    examples:
      - pl: "Pieczenie chleba zajmuje całe przedpołudnie."
        ru: "Печение хлеба занимает всё утро."
        source: { kind: authored }
      - pl: "Pieczenie w żołądku nie ustępowało."
        ru: "Жжение в желудке не проходило."
        source: { kind: authored }
notes:
  - { kind: usage, text: "ГЛАВНОЕ, и это подарок для русскоязычного: чередование k/cz распределено в точности как в русском «пеку — печёшь». Польский даёт piekę, pieczesz, piecze, pieczemy, pieczecie, pieką — k только в первом лице единственного и в третьем множественного, cz во всех клетках между ними. Русский делает то же самое: пеку, печёшь, печёт, печём, печёте, пекут. Правило можно не учить, а просто узнать." }
  - { kind: false-friend, text: "Совпадение идёт ещё дальше. Польское piec — это и глагол «печь», и существительное «печь» (устройство), два разных слова с одинаковым написанием; русское «печь» ведёт себя точно так же. У существительного своя отдельная карточка. И pieczenie тоже двузначно, как русское «печение» и «жжение»: pieczenie chleba, но pieczenie w żołądku." }
  - { kind: government, text: "Печь ЧТО — винительный: piec chleb, piec ciasto. Во втором значении подлежащим служит источник жжения, а человек стоит в ВИНИТЕЛЬНОМ: piecze MNIE gardło, pieką MNIE oczy — буквально «жжёт меня горло». По-русски здесь обычно «у меня саднит горло», с родительным и предлогом, так что конструкцию надо перестроить." }
  - { kind: pronunciation, text: "Вид несовершенный, поэтому есть причастия настоящего времени (piekący) и деепричастие piekąc, но НЕТ формы на -wszy. Совершенная пара — upiec." }
collocations:
  - { pl: "piec chleb", ru: "печь хлеб" }
  - { pl: "słońce piecze", ru: "солнце жжёт" }
  - { pl: "pieczenie w żołądku", ru: "жжение в желудке" }
family:
  - { pl: "piec", ru: "печь (устройство)", relation: root, id: piec }
  - { pl: "piekarz", ru: "пекарь", relation: derived }
  - { pl: "upiec", ru: "испечь", relation: aspect }
etymology: "Праславянское *pekti «печь» — то же слово, что русское «печь», и с тем же чередованием k/č, которое оба языка сохранили в спряжении. Из этого гнезда польские piekarz «пекарь», piekarnia «пекарня», piec «печь (устройство)» и, через образ пекла, piekło «ад» — ровно как русское «пекло» рядом с «печь»."
memory: "piec — «печь», и глагол, и (отдельным словом) существительное, как в русском. Чередование учить не нужно: piekę/pieczesz распределено точно как «пеку/печёшь». Второе значение — «жечь, саднить»: piecze mnie gardło."
idioms:
  - { pl: "pieczone gołąbki nie przyjdą same do gąbki", ru: "без труда не вытащишь и рыбку из пруда" }
  - { pl: "piecze mnie w gardle", ru: "у меня саднит в горле" }
formExamplesSkip:
  - { form: "pieczeni", reason: "Мужско-личная форма страдательного причастия. В значении «печь» дополнением бывает только еда — хлеб, пирог, мясо, — но никогда человек, поэтому подлежащего для такого оборота нет. А в значении «жечь» польский берёт не это причастие, а приставочное spieczony: говорят spieczeni słońcem, не pieczeni słońcem. Ни одно из двух значений мужско-личной формы не даёт." }
