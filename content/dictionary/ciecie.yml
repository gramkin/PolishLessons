notes:
  - { kind: false-friend, text: "CIĘCIE — «разрез, надрез», от CIĄĆ, «резать». CESARSKIE CIĘCIE — «кесарево сечение». Во множественном CIĘCIA — «сокращения»: CIĘCIA ETATÓW, «сокращение штатов». Монтаж фильма — тоже CIĘCIE." }
  - { kind: usage, text: "Средний род, отглагольное. Родительный множественного — CIĘĆ. Ę перед Ć звучит «энь», «це́ньце»." }
  - { kind: government, text: "Кесарево сечение — CESARSKIE CIĘCIE. Сокращения в чём — CIĘCIA W и местный: CIĘCIA W BUDŻECIE." }
  - { kind: pronunciation, text: "Читается «це́ньце»: CIĘ — «цень», CIE — «це». Ударение на первом слоге." }
