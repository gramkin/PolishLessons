    ru: "быть в состоянии (часто с отрицанием)"
    examples:
      - pl: "Nie zdołasz złapać pociągu."
        ru: "Ты не успеешь на поезд."
        source: { kind: translated, id: 362408 }
      - pl: "W żaden sposób nie zdołam tego zrobić."
        ru: "Я никак не сумею это сделать."
        source: { kind: translated, id: 2970772 }
notes:
  - { kind: government, text: "Всегда с инфинитивом: zdołać coś zrobić. Самостоятельно, без второго глагола, не употребляется." }
  - { kind: false-friend, text: "От dołać, родственного doła «сила»; ср. русское «одолеть», «подолеть». Смысл «осилить» общий." }
  - { kind: usage, text: "Оттенок — «суметь несмотря на трудность», поэтому глагол особенно част с отрицанием: nie zdołał «не сумел»." }
  - { kind: usage, text: "Совершенный вид; несовершенной пары практически нет. Близкие по смыслу — zdążyć «успеть» и dać radę «справиться»." }
  - { kind: government, text: "Ни повелительного наклонения, ни отглагольного существительного: глагол называет удачный исход и всегда требует инфинитива." }
collocations:
  - { pl: "zdołać coś zrobić", ru: "суметь что-л. сделать" }
  - { pl: "nie zdołał", ru: "не сумел" }
etymology: "От dołać «осилить», родня русскому «одолеть»."
memory: "zdołać — «суметь», всегда с инфинитивом и с оттенком преодоления: nie zdołał «не сумел». Близкие — zdążyć «успеть» и dać radę «справиться»."
