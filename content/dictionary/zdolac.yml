formExamples:
  - form: "zdoła"
    pl: "Tom nie zdoła tego skończyć w godzinę."
    ru: "Том не сумеет закончить это за час."
    source: { kind: translated, id: 4241914 }
  - form: "zdoła"
    pl: "Któż zdoła policzyć, ile nóg ma krocionóg?"
    ru: "Кто же сумеет сосчитать, сколько ног у многоножки?"
    source: { kind: translated, id: 13785973 }
  - form: "zdoła"
    pl: "Jeden głupiec umie zadać więcej pytań, niż dziesięciu mędrców zdoła odpowiedzieć."
    ru: "Один глупец умеет задать больше вопросов, чем десять мудрецов сумеют ответить."
    source: { kind: translated, id: 558335 }
  - form: "zdołają"
    pl: "Tom i Mary powiedzieli Johnowi, że nie sądzili, że zdołają to powtórzyć."
    ru: "Том и Мэри сказали Джону, что не думали, что сумеют это повторить."
    source: { kind: translated, id: 9684282 }
  - form: "zdołają"
    pl: "Może zdołają zdążyć."
    ru: "Может, они сумеют успеть."
    source: { kind: authored }
  - form: "zdołają"
    pl: "Nie zdołają nas zatrzymać."
    ru: "Они не сумеют нас остановить."
    source: { kind: authored }
  - form: "zdołali"
    pl: "Producenci broni zdołali uniknąć odpowiedzialności za przestępstwa związane z użyciem broni."
    ru: "Производители оружия сумели избежать ответственности за преступления, связанные с его применением."
    source: { kind: translated, id: 936037 }
  - form: "zdołali"
    pl: "Zdołali dotrzeć przed nocą."
    ru: "Они сумели добраться до ночи."
    source: { kind: authored }
  - form: "zdołali"
    pl: "Nie zdołali jej przekonać."
    ru: "Они не сумели её убедить."
    source: { kind: authored }
  - form: "zdołaliby"
    pl: "Gdyby Rzymianie musieli uczyć się łaciny od początku, nie zdołaliby podbić świata."
    ru: "Если бы римлянам пришлось учить латынь с нуля, они не сумели бы покорить мир."
    source: { kind: translated, id: 1459951 }
  - form: "zdołaliby"
    pl: "Zdołaliby, gdyby chcieli."
    ru: "Они сумели бы, если бы захотели."
    source: { kind: authored }
  - form: "zdołaliby"
    pl: "Sami nie zdołaliby tego unieść."
    ru: "Сами они не сумели бы это поднять."
    source: { kind: authored }
  - form: "zdołaliśmy"
    pl: "Tylko dzięki tobie zdołaliśmy ukończyć tę pracę na czas."
    ru: "Только благодаря тебе мы сумели закончить эту работу вовремя."
    source: { kind: translated, id: 989366 }
  - form: "zdołaliśmy"
    pl: "Zdołaliśmy naprawić dach."
    ru: "Мы сумели починить крышу."
    source: { kind: authored }
  - form: "zdołaliśmy"
    pl: "Nie zdołaliśmy się dodzwonić."
    ru: "Мы не сумели дозвониться."
    source: { kind: authored }
  - form: "zdołał"
    pl: "Zdołał przeczytać tę książkę."
    ru: "Он сумел прочитать эту книгу."
    source: { kind: translated, id: 745347 }
  - form: "zdołał"
    pl: "Mike zdołał przenieść sam swoją walizkę."
    ru: "Майк сумел сам перенести свой чемодан."
    source: { kind: translated, id: 358832 }
  - form: "zdołał"
    pl: "Dobry lekarz zdołał wyleczyć córkę premiera."
    ru: "Хороший врач сумел вылечить дочь премьера."
    source: { kind: translated, id: 366574 }
  - form: "zdołała"
    pl: "Prawie połowa uczniów nie zdołała zdać egzaminu."
    ru: "Почти половина учеников не сумела сдать экзамен."
    source: { kind: translated, id: 10667413 }
  - form: "zdołała"
    pl: "Sophie, która była głodna, zjadła wszystko co zdołała pochwycić."
    ru: "Софи, которая была голодна, съела всё, что сумела ухватить."
    source: { kind: translated, id: 1259365 }
  - form: "zdołała"
    pl: "Nie zdołała się obudzić na czas."
    ru: "Она не сумела проснуться вовремя."
    source: { kind: authored }
  - form: "zdołałem"
    pl: "Ten kamień był tak ciężki, że nie zdołałem go podnieść."
    ru: "Этот камень был таким тяжёлым, что я не смог его поднять."
    source: { kind: tatoeba, id: 831851 }
  - form: "zdołałem"
    pl: "Zdołałem złapać ostatni pociąg."
    ru: "Я успел на последний поезд."
    source: { kind: translated, id: 361915 }
  - form: "zdołałem"
    pl: "Zdołałem zdobyć pierwszą nagrodę."
    ru: "Я сумел получить первую премию."
    source: { kind: translated, id: 410000 }
  - form: "zdołało"
    pl: "Państwo nie zdołało sprostać oczekiwaniom obywateli."
    ru: "Государство не сумело оправдать ожидания граждан."
    source: { kind: translated, id: 349099 }
  - form: "zdołało"
    pl: "Kilka osób zdołało uciec."
    ru: "Несколько человек сумели убежать."
    source: { kind: authored }
  - form: "zdołało"
    pl: "Nic nie zdołało go powstrzymać."
    ru: "Ничто не сумело его остановить."
    source: { kind: authored }
  - form: "zdołam"
    pl: "W żaden sposób nie zdołam tego zrobić."
    ru: "Я никак не сумею это сделать."
    source: { kind: translated, id: 2970772 }
  - form: "zdołam"
    pl: "Chyba nie zdołam nauczyć się grać na oboju."
    ru: "Я, пожалуй, не сумею научиться играть на гобое."
    source: { kind: translated, id: 965278 }
  - form: "zdołam"
    pl: "Nie wiem, czy zdołam przyjść."
    ru: "Не знаю, сумею ли я прийти."
    source: { kind: authored }
  - form: "zdołamy"
    pl: "Mało prawdopodobne, że zdołamy uciec z tego więzienia."
    ru: "Маловероятно, что нам удастся сбежать из этой тюрьмы."
    source: { kind: translated, id: 969032 }
  - form: "zdołamy"
    pl: "Wiem, że jest mało prawdopodobne, że zdołamy sprzedać to wszystko."
    ru: "Я знаю, что вряд ли мы сумеем продать всё это."
    source: { kind: translated, id: 966940 }
  - form: "zdołamy"
    pl: "Razem zdołamy więcej."
    ru: "Вместе мы сумеем больше."
    source: { kind: authored }
  - form: "zdołano"
    pl: "Na szczęście zdołano ugasić pożar, nim stał się poważny."
    ru: "К счастью, пожар сумели потушить, прежде чем он стал серьёзным."
    source: { kind: translated, id: 1002944 }
  - form: "zdołano"
    pl: "Zdołano uratować wszystkich."
    ru: "Сумели спасти всех."
    source: { kind: authored }
  - form: "zdołano"
    pl: "Nie zdołano ustalić przyczyny."
    ru: "Причину установить не сумели."
    source: { kind: authored }
  - form: "zdołasz"
    pl: "Nie zdołasz złapać pociągu."
    ru: "Ты не успеешь на поезд."
    source: { kind: translated, id: 362408 }
  - form: "zdołasz"
    pl: "Chyba nigdy nie zdołasz go przekonać, że nie ma racji."
    ru: "Ты, пожалуй, никогда не сумеешь убедить его, что он не прав."
    source: { kind: translated, id: 989536 }
  - form: "zdołasz"
    pl: "Czy zdołasz to unieść?"
    ru: "Ты сумеешь это поднять?"
    source: { kind: authored }
