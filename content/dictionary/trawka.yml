notes:
  - { kind: false-friend, text: "TRAWKA — «травка», уменьшительное от TRAWA, и, как в русском, разговорное «марихуана». Официально — MARIHUANA. Газон — TRAWNIK." }
  - { kind: register, text: "В значении «наркотик» — сленг. Нейтрально о траве в парке — TRAWA или TRAWKA, ласково." }
