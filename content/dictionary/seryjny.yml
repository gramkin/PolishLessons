etymology: "Из латинского SERIES «ряд, череда», от глагола SERERE «сплетать, нанизывать» — то есть вещи, нанизанные одна за другой, как бусины. Оттуда же русское «серия» и английское SERIES. В польский слово пришло через немецкий и французский в девятнадцатом веке вместе с фабричным производством, и прилагательное получило польский суффикс -YJNY, который регулярно образуется от существительных на -IA. Так что латинский корень в обоих языках один, а суффиксы разошлись: польское -YJNY против русского «-ийный»."
memory: "Суффиксное правило: русское «-ийный» — польское -YJNY. Seria → seryjny, awaria → awaryjny. Степеней сравнения нет. Осторожно: «серийный» о телесериале — не seryjny, а serialowy."
