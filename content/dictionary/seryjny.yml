notes:
  - { kind: pronunciation, text: "Третий суффикс в этой череде, и снова правило переводится напрямую. Там, где русский пишет «-ийный», польский пишет -YJNY: SERIA — SERYJNY «серия — серийный», AWARIA — AWARYJNY «авария — аварийный», LINIA — LINIJNY. Произносится «сэры́йны»: se читается твёрдо, как «сэ», y — это «ы», ударение на предпоследнем слоге. Сравните -ALNY в ORYGINALNY и BRUTALNY и -OWY в MIĘDZYNARODOWY: три разных латинских суффикса, и у каждого свой польский ответ." }
  - { kind: usage, text: "Прилагательное относительное: степеней сравнения нет, и это полная картина, а не урезанная, как у MIĘDZYNARODOWY. Нельзя сказать ни BARDZIEJ SERYJNY, ни NAJSERYJNIEJSZY — вещь либо серийная, либо нет. Первое значение техническое, о массовом выпуске: PRODUKCJA SERYJNA, NUMER SERYJNY, EGZEMPLARZ SERYJNY. Второе — о повторяющемся преступлении: SERYJNY MORDERCA, и здесь порядок слов обратный, прилагательное идёт перед существительным." }
  - { kind: false-friend, text: "Ловушка в соседних словах, а не в этом. SERIAL по-польски — «телесериал», а SERIA — и «серия» фильма, и «партия товара», и «очередь выстрелов». Но SERYJNY к телесериалам отношения не имеет: «серийный» о телесериале будет SERIALOWY. Так что NUMER SERYJNY «серийный номер» переводится буквально, а вот «серийный сезон» сказать нельзя. Ещё одно: польское SERYJNY не значит «заурядный», тогда как русское «серийный» иногда отдаёт этим оттенком." }
  - { kind: government, text: "Прилагательное согласуется с существительным и управления не имеет. Порядок слов зависит от значения и его стоит запомнить готовыми парами: в техническом смысле прилагательное идёт после существительного — NUMER SERYJNY, PRODUKCJA SERYJNA, WYPOSAŻENIE SERYJNE; в смысле повторяющегося преступления — перед ним: SERYJNY MORDERCA, SERYJNY PODPALACZ, SERYJNY OSZUST." }
