notes:
  - { kind: usage, text: "Совершенный вид; несовершенный — ODZWIERCIEDLAĆ «отражать», он встречается гораздо чаще: FILM ODZWIERCIEDLA RZECZYWISTOŚĆ. ODZWIERCIEDLĘ, ODZWIERCIEDLISZ — будущее время." }
  - { kind: false-friend, text: "Почти всегда в переносном смысле: «отразить, передать» мнения, настроения, факты. Зеркальное отражение — ODBIĆ SIĘ: TWARZ ODBIŁA SIĘ W LUSTRZE «лицо отразилось в зеркале»." }
  - { kind: government, text: "Что — винительный: ODZWIERCIEDLIĆ NASTROJE. В чём — W + предложный: ODZWIERCIEDLIĆ W RAPORCIE. С SIĘ: ODZWIERCIEDLIĆ SIĘ W CENACH «отразиться на ценах» — по-польски W, а не NA." }
  - { kind: pronunciation, text: "Длинное слово читается по слогам: OD-ZWIER-CIE-DLIĆ, «одзвьерцье́длиць». Повелительное наклонение двоякое: ODZWIERCIEDL и ODZWIERCIEDLIJ, обе формы правильны." }
