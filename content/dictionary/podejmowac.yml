# review
id: podejmowac
format: 2
lemma: "podejmować"
rank: 2572
pos: verb
pron: { cyr: "подеймова́ць" }
senses:
  - id: take-decision
    ru: "принимать (решение), предпринимать (шаги, попытки)"
    examples:
      - pl: "Zarząd podejmuje decyzje raz w miesiącu."
        ru: "Правление принимает решения раз в месяц."
        source: { kind: authored }
      - pl: "Podejmuję próbę jeszcze raz."
        ru: "Я предпринимаю попытку ещё раз."
        source: { kind: authored }
      - pl: "Nie podejmują żadnych kroków."
        ru: "Они не предпринимают никаких шагов."
        source: { kind: authored }
  - id: receive-guests
    ru: "принимать (гостей)"
    examples:
      - pl: "Gospodarz podejmuje gości w ogrodzie."
        ru: "Хозяин принимает гостей в саду."
        source: { kind: authored }
      - pl: "Goście podejmowani w ogrodzie byli zachwyceni."
        ru: "Гости, принимаемые в саду, были в восторге."
        source: { kind: authored }
notes:
  - { kind: government, text: "podejmować coś — ВИНИТЕЛЬНЫЙ падеж: podejmować decyzję, próbę, kroki, temat, gości. Дополнением свободно бывает человек, поэтому мужсколичное podejmowani вполне обычно: goście podejmowani jak rodzina." }
  - { kind: usage, text: "Несовершенный вид; совершенный — podjąć, и основа у него совсем другая: podejmować, но podjąć, podejmę, podjął. Это та же пара основ, что в jąć / brać: запоминать её надо целиком." }
  - { kind: false-friend, text: "Сочетания расходятся. Польское podjąć decyzję буквально «поднять решение», а русское — «принять решение»; оба языка выбрали глагол взятия, но разную приставку. Зато podejmować gości совпадает с русским «принимать гостей» в точности." }
  - { kind: usage, text: "Возвратное podejmować się czegoś значит «браться за что-л.» и требует РОДИТЕЛЬНОГО падежа: nie podejmuję się tego zadania «я не берусь за это задание»." }
collocations:
  - { pl: "podejmować decyzję", ru: "принимать решение" }
  - { pl: "podejmować gości", ru: "принимать гостей" }
  - { pl: "podejmować ryzyko", ru: "идти на риск" }
family:
  - { pl: "podjąć", ru: "принять, предпринять", relation: aspect, id: podjac }
  - { pl: "decyzja", ru: "решение", relation: derived, id: decyzja }
  - { pl: "podejmowanie", ru: "принятие, предпринимание", relation: derived }
etymology: "Приставка pod- и корень глагола jąć «взять», от праславянского *jęti. Этот корень живёт в русском в виде -ять: «взять», «принять», «занять», «изъять»; устаревшее «подъять» — прямое соответствие польскому podjąć. Отсюда и значения: поднять, взять на себя, принять."
memory: "podejmować / podjąć — «принимать, предпринимать», корень тот же, что в русских «взять», «принять» (праславянское *jęti). Основы разные, их надо помнить парой: podejmuję, но podjąłem. А с się и родительным — «браться за что-л.»."
idioms:
  - { pl: "podejmować decyzję", ru: "принимать решение" }
  - { pl: "podejmować się czegoś", ru: "браться за что-л." }
