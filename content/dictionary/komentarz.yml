notes:
  - { kind: false-friend, text: "Значение совпадает с русским «комментарием», а написание и форма расходятся сразу в двух местах. Первое: по-польски одна M, KOMENTARZ, по-русски две, «комментарий» — тот же случай, что KOLEKCJA против «коллекции» и DEPRESJA против «депрессии». Второе: польское слово мужского рода на -RZ, а русское на -ИЙ, и склоняются они по-разному. Третье и самое практичное: оборот BEZ KOMENTARZA стоит в единственном числе, тогда как русский говорит «без комментариев», во множественном. Поэтому дословный перевод BEZ KOMENTARZY возможен, но означает именно отсутствие нескольких комментариев, а не отказ высказаться." }
  - { kind: government, text: "Мужской род, неодушевлённое, с мягкой основой на -RZ. Винительный равен именительному: NAPISAĆ KOMENTARZ. Местный KOMENTARZU. У слова два родительных множественного, KOMENTARZY и KOMENTARZÓW, и оба нормативны: форма на -Y обычнее, на -ÓW чаще в счётных оборотах — так же колеблется TALERZ с его TALERZY и TALERZÓW. К чему комментарий — предлог DO с родительным: KOMENTARZ DO USTAWY, KOMENTARZ DO WIERSZA. Чей — родительный без предлога: KOMENTARZ REDAKCJI." }
  - { kind: pronunciation, text: "Читается «коме́нташ», ударение на предпоследнем слоге из трёх. Сочетание RZ на конце слова оглушается и звучит «ш», а не «ж»: «коменташ». В косвенных формах, где за RZ идёт гласная, слышно уже «ж»: KOMENTARZA «коме́нтажа», KOMENTARZU «коме́нтажу», KOMENTARZE «коме́нтаже». Это обычное для польского оглушение в конце слова, то же, что в TALERZ «талеш» и NÓŻ «нуш». Буква E во втором слоге звучит полным «э»." }
  - { kind: usage, text: "Частотные сочетания: BEZ KOMENTARZA «без комментариев», KOMENTARZ REDAKCJI, KOMENTARZ DO USTAWY, KOMENTARZ SPORTOWY «спортивный комментарий», ZAMKNĄĆ KOMENTARZE о интернет-дискуссии. В юридическом языке KOMENTARZ означает постатейный разбор закона и бывает названием книги: KOMENTARZ DO KODEKSU CYWILNEGO. Существительное KOMENTATOR означает комментатора, прилагательное KOMENTARSKI встречается редко. Глагол KOMENTOWAĆ «комментировать» принадлежит классу на -OWAĆ и спрягается с основой на -UJ-: KOMENTUJĘ." }
