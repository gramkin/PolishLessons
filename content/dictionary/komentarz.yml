etymology: "Из латинского COMMENTARIUS «записки, памятная книга», от COMMENTARI «обдумывать, излагать», а то от COMMINISCI «придумывать, припоминать», из корня *men- «думать» — того же, что в PAMIĘĆ и русской «памяти», в MYŚL и «мысли». Так что комментарий исходно это продуманное, записанное размышление, а не приписка на полях. Русский «комментарий» взят из того же латинского слова, но сохранил латинское окончание -IUS в виде -ИЙ, тогда как польский переделал его по своему образцу в -ARZ, по той же модели, что LEKARZ и PISARZ — хотя здесь -ARZ не славянский суффикс лица, а переработанное латинское окончание. Удвоенная M латинского COMMENTARIUS в польском упростилась, как упрощается почти всегда."
memory: "Одна M, в отличие от русского «комментария», и мужской род на -rz вместо -ий. Оборот bez komentarza стоит в единственном числе там, где русский говорит «без комментариев». Два родительных множественного, komentarzy и komentarzów, как у talerza. Конечное rz оглушается в «ш»: «коменташ», но в косвенных формах звучит «ж». Из латинского commentarius, от корня *men- «думать», того же, что в pamięć."
