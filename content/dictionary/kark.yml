etymology: "Из праславянского *karkъ «шея, загривок». В русском литературном языке слово не удержалось, зато живо в польском, чешском kark и в русских говорах. Поэтому опереться на русский тут не получится — kark приходится запоминать отдельно от «шеи»."
memory: "kark — задняя часть шеи, загривок, а szyja — шея спереди. Русское «шея» покрывает оба. Зато идиомы совпадают: siedzieć na karku, dać po karku, skręcić kark."
