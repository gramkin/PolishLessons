notes:
  - { kind: false-friend, text: "ПОЛЬСКИЙ РАЗЛИЧАЕТ ПЕРЕД И ЗАД ШЕИ, А РУССКИЙ ОДНИМ СЛОВОМ. SZYJA — это шея спереди и сбоку, та, которую обнимают и на которой висит шарф. KARK — задняя часть, загривок, затылок: boli mnie kark значит, что ломит именно сзади. По-русски и то и другое «шея», поэтому выбирать приходится по месту." }
  - { kind: usage, text: "Зато идиомы совпали почти полностью: SIEDZIEĆ KOMUŚ NA KARKU — «сидеть у кого-то на шее», DAĆ KOMUŚ PO KARKU — «дать по шее», SKRĘCIĆ KARK — «свернуть шею». Есть и своё: nadstawiać karku «подставлять голову, рисковать». Предложный — w karku, с твёрдым к." }
  - { kind: pronunciation, text: "Один слог: карк. Оба к твёрдые, r раскатистое: «карк». Предложный karku звучит «ка́рку», с ударением на первом слоге." }
collocations:
