  - id: medium-substance
    ru: "среда (физическая)"
    examples:
      - pl: "Dźwięk potrzebuje medium, żeby się rozchodzić."
        ru: "Звуку нужна среда, чтобы распространяться."
        source: { kind: authored }
notes:
  - { kind: usage, text: "ЕДИНСТВЕННОЕ ЧИСЛО НЕ СКЛОНЯЕТСЯ ВОВСЕ — И ТАК ВЕДЁТ СЕБЯ ЦЕЛЫЙ КЛАСС. Латинские существительные среднего рода на -um в единственном числе застыли: medium, muzeum, liceum, technikum, akwarium. Все падежи одинаковы: w muzeum, do muzeum, z muzeum. А множественное склоняется обычно: media, mediów, mediom, mediami, mediach. Отсюда и всего шесть форм вместо десяти." }
  - { kind: false-friend, text: "Русский развёл эти значения по разным словам: «медиа» несклоняемое, «медиум» спирит, «среда» физическая. Польское medium покрывает все три, и различает их только контекст. Самое частое — множественное media в значении СМИ: media donoszą, media społecznościowe." }
  - { kind: pronunciation, text: "Три слога, ударение на предпоследнем: ME-di-um, «мэ́дьюм». Во множественном числе ударение тоже на предпоследнем: media — «мэ́дья», mediami — «мэдья́ми»." }
collocations:
  - { pl: "media społecznościowe", ru: "социальные сети" }
  - { pl: "w mediach", ru: "в СМИ" }
  - { pl: "media publiczne", ru: "общественные СМИ" }
family:
  - { pl: "medialny", ru: "медийный", relation: derived }
  - { pl: "multimedia", ru: "мультимедиа", relation: derived }
etymology: "Из латинского medium «середина, посредствующее», от medius «средний». Через значение посредника слово и разошлось: посредник между мирами — спирит, посредник между событием и публикой — пресса, посредник для волны — физическая среда. В русский каждое значение пришло отдельно и получило своё слово."
memory: "medium — это и «СМИ» (во множественном media), и «медиум», и «среда». В единственном числе слово не склоняется вовсе, как muzeum и liceum: w medium, do medium. Склоняется только множественное."
idioms:
