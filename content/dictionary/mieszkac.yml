# review
id: mieszkac
format: 2
lemma: "mieszkać"
rank: 246
pos: verb
aspect: imperf
pron: { cyr: "ме́шкаць" }
senses:
  - id: live
    ru: "жить, проживать"
    note: "Это не «мешать» и не «мешкать» — это обычное «жить где-то»."
    examples:
      - pl: "Mieszkam u wuja."
        ru: "Я живу у дяди."
        source: { kind: tatoeba, id: 665855 }
      - pl: "Gdzie mieszkasz?"
        ru: "Где ты живёшь?"
        source: { kind: tatoeba, id: 353202 }
      - pl: "Mieszkam w mieście."
        ru: "Я живу в городе."
        source: { kind: tatoeba, id: 359195 }
  - id: reside
    ru: "жить (в каком-то месте, с кем-то)"
    examples:
      - pl: "Mieszkamy w domu."
        ru: "Мы живём в доме."
        source: { kind: tatoeba, id: 1896051 }
      - pl: "On mieszka w Tokio."
        ru: "Он живёт в Токио."
        source: { kind: tatoeba, id: 352185 }
      - pl: "Czy on tu mieszka?"
        ru: "Живёт ли он здесь?"
        source: { kind: tatoeba, id: 357873 }
notes:
  - { kind: false-friend, text: "mieszkać значит «жить, проживать», а не «мешать». Русское «мешкать» — действительно родственник: задерживаться где-то и значит там обитать, но в польском осталось только значение «жить»." }
  - { kind: usage, text: "Отсюда же mieszkanie — «квартира», одно из самых нужных бытовых слов." }
  - { kind: usage, text: "Управление: mieszkać w Warszawie «жить в Варшаве», но mieszkać na wsi «жить в деревне», mieszkać u kogoś «жить у кого-то»." }
  - { kind: usage, text: "Русскому «мешать» отвечают другие глаголы: przeszkadzać «мешать кому-то» и mieszać «смешивать, размешивать»." }
collocations:
  - { pl: "mieszkać w mieście", ru: "жить в городе" }
  - { pl: "mieszkać u kogoś", ru: "жить у кого-то" }
  - { pl: "gdzie mieszkasz?", ru: "где ты живёшь?" }
  - { pl: "mieszkać razem", ru: "жить вместе" }
etymology: "Праславянское *měšьkati «пребывать, задерживаться»; русское «мешкать» — тот же корень, но в польском осталось значение «жить, обитать»."
memory: "mieszkać — «жить, проживать», а не «мешать». Родня ему русское «мешкать»: задержаться где-то надолго и значит там жить. Отсюда mieszkanie — «квартира»."
idioms:
  - { pl: "mieszkać kątem", ru: "ютиться у кого-то" }
  - { pl: "mieszkać pod jednym dachem", ru: "жить под одной крышей" }
  - { pl: "gdzie mieszkasz?", ru: "где ты живёшь?" }
