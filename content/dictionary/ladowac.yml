# review
id: ladowac
format: 2
lemma: "lądować"
rank: 2587
pos: verb
pron: { cyr: "лёндо́ваць" }
senses:
  - id: land
    ru: "приземляться, садиться"
    examples:
      - pl: "Samolot ląduje za dziesięć minut."
        ru: "Самолёт садится через десять минут."
        source: { kind: authored }
      - pl: "Lądowaliśmy w gęstej mgle."
        ru: "Мы садились в густом тумане."
        source: { kind: authored }
      - pl: "Ptak wylądował na gałęzi, a potem lądował już tylko na dachu."
        ru: "Птица села на ветку, а потом садилась уже только на крышу."
        source: { kind: authored }
  - id: disembark
    ru: "высаживаться (о десанте)"
    examples:
      - pl: "Wojska lądowały o świcie."
        ru: "Войска высаживались на рассвете."
        source: { kind: authored }
  - id: end-up
    ru: "оказываться, попадать (разг.)"
    examples:
      - pl: "Ciągle ląduje w szpitalu z tym kolanem."
        ru: "Он постоянно оказывается в больнице с этим коленом."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Страдательного причастия нет: глагол непереходный, садится самолёт сам, а не кого-то сажают. Отсюда 52 формы вместо 63 — шестой случай в этом словаре после współczuć, zajrzeć, wpadać, patrzeć и występować. Безличное LĄDOWANO при этом есть: lądowano tu jeszcze w latach trzydziestych." }
  - { kind: usage, text: "Разговорное значение русскому знакомо по другому глаголу: LĄDOWAĆ W SZPITALU, W AREszcie, NA BRUKU — «оказываться, попадать» куда-то нежелательное. По-русски тут скажут «загреметь» или «очутиться», а буквальное «приземлиться в больнице» прозвучит шуткой. В совершенном виде чаще WYLĄDOWAĆ: wylądował w szpitalu." }
  - { kind: usage, text: "Корень — LĄD «суша, земля», слово в русском почти утраченное: родственная «ляда, лядина» осталась в диалектах со значением пустоши. Поэтому разложить lądować на части русскому не удастся, запоминать придётся целиком. Зато спряжение бесплатное: -ować даёт -uję, как «-ировать» даёт «-ирую»." }
collocations:
  - { pl: "lądować na lotnisku", ru: "садиться в аэропорту" }
  - { pl: "lądowanie awaryjne", ru: "аварийная посадка" }
  - { pl: "miękko lądować", ru: "мягко приземляться" }
family:
  - { pl: "wylądować", ru: "приземлиться (сов.)", relation: aspect, id: wyladowac }
  - { pl: "ląd", ru: "суша, земля", relation: root }
  - { pl: "lądowisko", ru: "посадочная площадка", relation: derived }
etymology: "От LĄD «суша», из праславянского *lędo «невозделанная земля, пустошь». В русском этот корень почти исчез: уцелели областные «ляда» и «лядина» в значении заброшенного поля. Польский же сделал из него обычное слово для суши в противоположность морю, а от него глагол «садиться на землю». Отсюда и lądowisko «посадочная площадка», и wylądować."
memory: "Корень ląd значит «суша», и русского опорного слова тут нет — запоминай целиком. Страдательного причастия у глагола не бывает: садится самолёт сам. И помни разговорное lądować w szpitalu — «загреметь в больницу»."
idioms:
  - { pl: "lądowanie awaryjne", ru: "аварийная посадка" }
  - { pl: "miękko wylądować", ru: "мягко приземлиться, выйти сухим из воды" }
