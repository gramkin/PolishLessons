# review
id: rozwalic
format: 2
lemma: "rozwalić"
rank: 1904
pos: verb
pron: { cyr: "розва́лиць" }
senses:
  - id: demolish
    ru: "развалить, разрушить"
    examples:
      - pl: "Rozwalili stary mur w jeden dzień."
        ru: "Они развалили старую стену за один день."
        source: { kind: authored }
      - pl: "Wiatr rozwalił stodołę."
        ru: "Ветер развалил сарай."
        source: { kind: authored }
      - pl: "Rozwalono cały barak."
        ru: "Весь барак снесли."
        source: { kind: authored }
  - id: smash
    ru: "разг. разбить, сломать"
    examples:
      - pl: "Rozwalił telefon o podłogę."
        ru: "Он разбил телефон об пол."
        source: { kind: authored }
      - pl: "Rozwalona szyba leżała na chodniku."
        ru: "Разбитое стекло лежало на тротуаре."
        source: { kind: authored }
  - id: sprawl
    ru: "rozwalić się — развалиться (сесть, разлечься)"
    examples:
      - pl: "Rozwalił się w fotelu i zasnął."
        ru: "Он развалился в кресле и заснул."
        source: { kind: authored }
      - pl: "Rozwalili się na trawie i nie chcieli wstawać."
        ru: "Они развалились на траве и не хотели вставать."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Слово разбирается по-русски без остатка: roz- это «раз-», walić — «валить», и вместе выходит ровно «развалить». Польское roz- и русское «раз-/рас-» соответствуют всегда: rozmowa — «разговор», rozdzielić — «разделить», rozbić — «разбить». Это одна из самых надёжных приставок для русскоговорящего." }
  - { kind: register, text: "А вот УПОТРЕБЛЕНИЕ шире русского, и это разговорный пласт. Rozwalić можно не только стену, но и телефон (разбить), систему (развалить), планы (сорвать), а rozwalić się — это «развалиться» в кресле. В грубой речи rozwalić kogoś значит «пристрелить». Нейтральные замены: zniszczyć «уничтожить», zburzyć «снести», stłuc «разбить»." }
  - { kind: government, text: "Разваливают ЧТО — винительный: rozwalić mur, telefon, plan. Обо что — o с винительным: rozwalić coś o podłogę. Возвратное rozwalić się значит «развалиться» и места не требует, но часто идёт с w плюс предложный: rozwalić się w fotelu." }
  - { kind: usage, text: "Вид совершенный, несовершенная пара — rozwalać: rozwalali mur przez tydzień «они разваливали стену неделю», но rozwalili go w jeden dzień «развалили за один день». Причастие rozwalony живёт самостоятельно: rozwalony dom, rozwalona szyba." }
collocations:
  - { pl: "rozwalić mur", ru: "развалить стену" }
  - { pl: "rozwalić się w fotelu", ru: "развалиться в кресле" }
  - { pl: "rozwalić plany", ru: "сорвать планы" }
family:
  - { pl: "rozwalać", ru: "разваливать", relation: aspect }
  - { pl: "walić", ru: "валить, бить", relation: root, id: walic }
  - { pl: "zburzyć", ru: "снести, разрушить", relation: derived }
etymology: "Приставка roz- плюс walić «валить», и русское «развалить» собрано из тех же двух частей. Соответствие приставок roz-/раз- сквозное: rozmowa — «разговор», rozbić — «разбить». Корень wal- тот же, что в русских «валить», «вал», «обвал»."
memory: "rozwalić — «развалить», разбирается по частям: roz- это «раз-», walić — «валить». Но польское слово ходит дальше русского и всё это по-разговорному: rozwalić telefon «разбить телефон», rozwalić się w fotelu «развалиться в кресле»."
idioms:
