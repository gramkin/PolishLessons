# review
id: zaniechac
format: 2
lemma: "zaniechać"
rank: 2291
pos: verb
aspect: perf
pron: { cyr: "заня́хаць" }
senses:
  - id: abandon
    ru: "отказаться от, прекратить"
    examples:
      - pl: "To jest tak trudne, że postanowiłem zaniechać dalszych prób."
        ru: "Это так трудно, что я решил прекратить дальнейшие попытки."
        source: { kind: translated, id: 1350404 }
      - pl: "Kevin zaniechał wyjazdu do Kanady."
        ru: "Кевин отказался от поездки в Канаду."
        source: { kind: translated, id: 919359 }
      - pl: "Zaniechaj tego!"
        ru: "Прекрати это!"
        source: { kind: translated, id: 8753490 }
  - id: omission
    ru: "отказ, бездействие (существительное zaniechanie)"
    examples:
      - pl: "Zaleca się całkowite zaniechanie kontaktowania się z buntownikami w przyszłości."
        ru: "Рекомендуется полностью прекратить контакты с мятежниками."
        source: { kind: translated, id: 12567548 }
      - pl: "Zaniechanie działania też jest decyzją."
        ru: "Бездействие — тоже решение."
        source: { kind: authored }
notes:
  - { kind: government, text: "Требует РОДИТЕЛЬНОГО падежа: zaniechać prób «прекратить попытки», zaniechać wyjazdu «отказаться от поездки». Русское «прекратить» берёт винительный." }
  - { kind: usage, text: "Книжное и официальное слово; в разговоре скажут przestać «перестать» или zrezygnować «отказаться»." }
  - { kind: false-friend, text: "Корень niechać «оставить, бросить», родственно niech «пусть»; ср. русское «нехай» в южных говорах." }
  - { kind: usage, text: "Существительное zaniechanie — юридический термин «бездействие», противопоставленный działanie." }
  - { kind: government, text: "Родительный падеж при этом глаголе не мешает страдательному причастию: zaniechana budowa, zaniechany projekt — обычные обороты, как poszukiwany od poszukiwać kogoś. Нет только мужско-личной формы: прекращают дело, а не человека." }
collocations:
  - { pl: "zaniechać prób", ru: "прекратить попытки" }
  - { pl: "zaniechanie działania", ru: "бездействие" }
etymology: "za- + niechać «оставить, бросить», родственно niech «пусть»; ср. южнорусское «нехай»."
memory: "zaniechać — «отказаться от, прекратить», и требует РОДИТЕЛЬНОГО падежа: zaniechać prób. Существительное zaniechanie — юридическое «бездействие»."
idioms:
  - { pl: "zaniechać prób", ru: "прекратить попытки" }
formExamplesSkip:
  - { form: "zaniechani", reason: "дополнение у глагола стоит в родительном падеже и обозначает действие: zaniechać prób, zaniechać wyjazdu, zaniechać sporu. Человека не «прекращают», поэтому мужско-личной формы страдательного причастия нет, хотя budowa zaniechana и projekt zaniechany przed laty совершенно обычны" }
