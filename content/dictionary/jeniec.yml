# review
id: jeniec
format: 2
lemma: "jeniec"
rank: 6012
pos: noun
pron: { cyr: "е́нец" }
senses:
  - id: prisoner
    ru: "пленный, военнопленный"
    examples:
      - pl: "Jeniec próbował uciec z obozu."
        ru: "Пленный пытался бежать из лагеря."
        source: { kind: authored }
      - pl: "Nie brać żadnych jeńców."
        ru: "Пленных не брать."
        source: { kind: translated, id: 12476520 }
      - pl: "Wzięli go do niewoli i odtąd był jeńcem."
        ru: "Его взяли в плен, и с тех пор он был пленным."
        source: { kind: authored }
      - pl: "Prawo nakazuje godnie traktować jeńców."
        ru: "Закон велит достойно обращаться с пленными."
        source: { kind: authored }
      - pl: "Jeńców przewieziono do obozu w górach."
        ru: "Пленных перевезли в лагерь в горах."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Беглое E: JENIEC → JEŃCA, JEŃCEM, мн. ч. JEŃCY. Перед C N смягчается в Ń. Слово мужско-личное, поэтому винительный совпадает с родительным: WZIĘLI JEŃCA, WZIĘLI JEŃCÓW." }
  - { kind: false-friend, text: "Польского PLENNY нет. «Плен» — NIEWOLA (WZIĄĆ DO NIEWOLI «взять в плен», BYĆ W NIEWOLI «быть в плену»), а «пленный» — JENIEC." }
  - { kind: pronunciation, text: "Читается «е́нец»: JE — как русское «е». В косвенных падежах мягкое «нь»: JEŃCA «е́ньца». Ударение на первом слоге." }
collocations:
  - { pl: "jeniec wojenny", ru: "военнопленный" }
  - { pl: "brać jeńców", ru: "брать пленных" }
  - { pl: "obóz jeniecki", ru: "лагерь для военнопленных" }
  - { pl: "wymiana jeńców", ru: "обмен пленными" }
family:
  - { pl: "jeniecki", ru: "относящийся к пленным", relation: derived }
  - { pl: "jeniectwo", ru: "плен, положение пленного", relation: derived }
  - { pl: "jąć", ru: "взять, начать (устар.)", relation: root }
synonyms: ["więzień", "niewolnik"]
etymology: "От старого глагола JĄĆ «взять, схватить»; тот же корень в русском «взять», «изъять». Пленный — буквально «взятый»."
memory: "Jeniec — «взятый» (от jąć, как русское взять): пленный. Jeniec wojenny — военнопленный."
idioms:
  - { pl: "nie brać jeńców", ru: "действовать беспощадно, пленных не брать" }
