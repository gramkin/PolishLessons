etymology: "Из французского слова, родственного глаголу «схватывать»: болезнь, которая хватает внезапно. Русское «грипп» — из того же источника, но мужского рода."
memory: "Grypa — грипп, женского рода: mam grypę. Читается «гры́па». Zachorować na grypę — заболеть гриппом. Przeziębienie — простуда."
