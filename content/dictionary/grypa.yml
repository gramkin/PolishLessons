notes:
  - { kind: false-friend, text: "GRYPA — «грипп», но женского рода: MAM GRYPĘ, «у меня грипп», TA GRYPA. Простуда — PRZEZIĘBIENIE, насморк — KATAR. Кишечный грипп — GRYPA ŻOŁĄDKOWA." }
  - { kind: usage, text: "Пять живых форм, только единственное число. Формы множественного и звательный не даются. В местном падеже P перед IE смягчается: PO GRYPIE." }
  - { kind: government, text: "Заболеть гриппом — ZACHOROWAĆ NA GRYPĘ, NA с винительным, где в русском творительный. Прививка от гриппа — SZCZEPIONKA NA GRYPĘ или PRZECIW GRYPIE." }
  - { kind: pronunciation, text: "Читается «гры́па», ударение на первом слоге. Y — «ы», одно P." }
collocations:
  - { pl: "zachorować na grypę", ru: "заболеть гриппом" }
