  - id: content
    ru: "материал (сведения, репортаж, учебный материал)"
    examples:
      - pl: "Ona zbiera materiał na książkę."
        ru: "Она собирает материал для книги."
        source: { kind: translated, id: 575402 }
      - pl: "Lepiej sam obejrzyj materiał."
        ru: "Лучше сам посмотри материал."
        source: { kind: translated, id: 365526 }
      - pl: "Jest mocno do tyłu z materiałem studiów."
        ru: "Он сильно отстал с материалом курса."
        source: { kind: translated, id: 766189 }
notes:
  - { kind: usage, text: "Три слоя значения: вещество (trwały materiał «прочный материал»), ткань (materiał na sukienkę «материал на платье») и содержание (materiał na książkę «материал для книги»)." }
  - { kind: government, text: "z materiału «из материала» — предлог z с родительным: uszyte z trwałego materiału." }
  - { kind: usage, text: "Во множественном materiały значит «принадлежности» и «материалы»: materiały biurowe «канцтовары», materiały budowlane «стройматериалы»." }
  - { kind: pronunciation, text: "Конечное ł звучит как «у», а -ia- как «-ья-»: матэрья́у." }
collocations:
  - { pl: "trwały materiał", ru: "прочный материал" }
  - { pl: "materiały budowlane", ru: "стройматериалы" }
  - { pl: "materiał na książkę", ru: "материал для книги" }
etymology: "Из латинского materia «вещество, древесина» через немецкий. Русский «материал» пришёл тем же путём."
memory: "materiał — и «материал», и «ткань», и «материал» в смысле сведений: materiał na książkę. Во множественном materiały значит «принадлежности»: materiały biurowe «канцтовары». Конечное ł звучит как «у»."
