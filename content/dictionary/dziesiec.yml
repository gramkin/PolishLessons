# review
id: dziesiec
format: 2
lemma: "dziesięć"
rank: 1092
pos: num
pron: { cyr: "дзе́сеньць" }
senses:
  - id: ten
    ru: "десять"
    examples:
      - pl: "On ma dziesięć krów."
        ru: "У него десять коров."
        source: { kind: translated, id: 8773328 }
      - pl: "Czekałem dziesięć minut."
        ru: "Я ждал десять минут."
        source: { kind: translated, id: 1350347 }
      - pl: "Dziesięć lat to długo."
        ru: "Десять лет — это долго."
        source: { kind: translated, id: 5975454 }
  - id: oblique
    ru: "dziesięciu — десяти (косвенные падежи и о мужчинах)"
    examples:
      - pl: "Zamknij oczy i policz do dziesięciu."
        ru: "Закрой глаза и сосчитай до десяти."
        source: { kind: translated, id: 526163 }
      - pl: "Znam go od dziesięciu lat."
        ru: "Я знаю его десять лет."
        source: { kind: translated, id: 3450021 }
      - pl: "Byłoby wspaniale, gdybym potrafił mówić w dziesięciu językach."
        ru: "Было бы здорово, если бы я мог говорить на десяти языках."
        source: { kind: translated, id: 526595 }
  - id: collective
    ru: "dziesięcioro — десятеро (собирательное)"
    note: "Особая форма для детей и смешанных групп; в русском ей отвечает «десятеро» или просто «десять»."
    examples:
      - pl: "Mają co najmniej dziesięcioro dzieci."
        ru: "У них не меньше десяти детей."
        source: { kind: translated, id: 13786632 }
      - pl: "Mam dziesięcioro dzieci."
        ru: "У меня десять детей."
        source: { kind: translated, id: 6360081 }
      - pl: "Było nas dziesięcioro."
        ru: "Нас было десятеро."
        source: { kind: translated, id: 12193835 }
notes:
  - { kind: government, text: "Числительное требует родительного падежа множественного числа: dziesięć minut «десять минут», dziesięć lat «десять лет». Русский устроен так же, начиная с пяти." }
  - { kind: usage, text: "Форма dziesięciu — это и косвенные падежи (do dziesięciu «до десяти»), и счёт мужчин: Było nas dziesięciu «Нас было десятеро (мужчин)»." }
  - { kind: usage, text: "Собирательное dziesięcioro употребляется с детьми, детёнышами и смешанными группами: dziesięcioro dzieci «десять детей», Było nas dziesięcioro «Нас было десятеро». Выбор формы зависит от состава группы, и в русском такого различения нет." }
  - { kind: usage, text: "Творительный — dziesięcioma: mówi dziesięcioma językami «говорит на десяти языках»." }
collocations:
  - { pl: "dziesięć minut", ru: "десять минут" }
  - { pl: "do dziesięciu", ru: "до десяти" }
  - { pl: "dziesięcioro dzieci", ru: "десять детей" }
  - { pl: "dziesięcioma językami", ru: "на десяти языках" }
family:
  - { pl: "dziesiąty", ru: "десятый", relation: derived }
  - { pl: "dziesiątka", ru: "десятка", relation: derived }
etymology: "Праславянское *desętь из праиндоевропейского *deḱṃ- — то же слово, что русское «десять» и латинское decem."
memory: "dziesięć — «десять», и требует родительного, как русское: dziesięć minut. Но есть форма, которой в русском нет: собирательное dziesięcioro для детей и смешанных групп — dziesięcioro dzieci. А о мужчинах говорят dziesięciu."
idioms:
  - { pl: "znać jak swoje dziesięć palców", ru: "знать как свои пять пальцев" }
  - { pl: "dziesięcioro dzieci", ru: "десять детей" }
  - { pl: "policz do dziesięciu", ru: "сосчитай до десяти" }
formExamplesSkip:
  - { form: "dziesięcio", reason: "не самостоятельная форма, а первая часть сложных слов: dziesięciodolarowy, dziesięciolecie" }
