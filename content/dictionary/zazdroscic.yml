notes:
  - { kind: government, text: "zazdrościć KOMUŚ CZEGOŚ: человек — в ДАТЕЛЬНОМ падеже, предмет зависти — в РОДИТЕЛЬНОМ. Zazdroszczę ci talentu. Русский ставит оба в дательный — «завидую твоему таланту», — так что падеж предмета приходится переучивать: нельзя сказать «zazdroszczę ci talentowi»." }
  - { kind: government, text: "Хотя винительного дополнения у глагола нет вовсе, страдательные причастия образуются свободно, включая мужсколичное zazdroszczeni: PoliMorf помечает их ppas:...:imperf:aff от zazdrościć. Повышается в подлежащее родительное дополнение — ровно как у zakazać. Поэтому zazdroszczony zawód «завидная профессия» вполне правильно." }
  - { kind: pronunciation, text: "Основа чередуется: ść переходит в szcz. Инфинитив zazdrościć, но zazdroszczę, zazdroszczą, zazdroszcząc, zazdroszczony. В повелительном наклонении остаётся ść с мягким знаком: zazdrość, zazdrośćmy, zazdrośćcie." }
  - { kind: false-friend, text: "Корень zazdrość — тот же, что в польском wzrok «зрение» и zerkać «поглядывать», от праславянского *zьrěti «смотреть». Русские родственники — «взор», «зреть», «зоркий». Любопытно, что русское «зависть» построено на другом корне зрения, от «видеть»: оба языка сделали зависть из подглядывания, но взяли для этого разные глаголы." }
collocations:
  - { pl: "zazdrościć komuś czegoś", ru: "завидовать кому-л. в чём-л." }
  - { pl: "nie ma czego zazdrościć", ru: "завидовать нечему" }
  - { pl: "zazdroszczona posada", ru: "завидная должность" }
family:
  - { pl: "pozazdrościć", ru: "позавидовать", relation: aspect }
  - { pl: "zazdrość", ru: "зависть", relation: derived }
  - { pl: "zazdrosny", ru: "завистливый; ревнивый", relation: derived, id: zazdrosny }
etymology: "Приставка za- и корень *zьr- «смотреть», тот же, что в польском wzrok «зрение», zerkać «поглядывать» и в русских «взор», «зреть», «зоркий». Исходный образ — косой взгляд на чужое. Русское «зависть» сделано по той же мысли, но от другого корня зрения, от «видеть». Из того же гнезда zazdrość «зависть» и zazdrosny «завистливый, ревнивый»."
memory: "zazdrościć KOMUŚ (дательный) CZEGOŚ (родительный): zazdroszczę ci talentu. Русский оба слова ставит в дательный, польский второе — в родительный. И не упустите чередование: zazdrościć, но zazdroszczę."
idioms:
  - { pl: "nie ma czego zazdrościć", ru: "завидовать нечему" }
  - { pl: "zazdrościć komuś szczęścia", ru: "завидовать чьему-л. счастью" }
