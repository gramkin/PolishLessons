pos: noun
pron: { cyr: "и́мпульс" }
senses:
  - id: impetus
    ru: "импульс, толчок, стимул"
    examples:
      - pl: "Ta rozmowa dała mi impuls do zmian."
        ru: "Этот разговор дал мне толчок к переменам."
        source: { kind: authored }
      - pl: "Inwestycja była impulsem dla regionu."
        ru: "Инвестиция дала импульс развитию региона."
        source: { kind: authored }
      - pl: "Potrzebujemy nowego impulsu."
        ru: "Нам нужен новый импульс."
        source: { kind: authored }
  - id: urge
    ru: "порыв, внезапное желание"
    examples:
      - pl: "Pod wpływem impulsu kupiła sukienkę."
        ru: "Поддавшись порыву, она купила платье."
        source: { kind: authored }
      - pl: "Działał pod wpływem impulsu."
        ru: "Он действовал под влиянием порыва."
        source: { kind: authored }
  - id: signal
    ru: "импульс (электрический, нервный)"
    examples:
      - pl: "Nerwy przesyłają impulsy do mózgu."
        ru: "Нервы передают импульсы в мозг."
        source: { kind: authored }
      - pl: "Urządzenie wysyła impuls co sekundę."
        ru: "Устройство посылает импульс каждую секунду."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "IMPULS — «импульс, толчок» и «порыв». В отличие от русского, часто о решении «под влиянием минуты»: POD WPŁYWEM IMPULSU. Импульсивный — IMPULSYWNY: ZAKUPY IMPULSYWNE, «импульсивные покупки»." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Родительный — IMPULSU. В местном S смягчается: W IMPULSIE." }
  - { kind: government, text: "Толчок к чему — IMPULS DO и родительный: IMPULS DO DZIAŁANIA. Под влиянием порыва — POD WPŁYWEM IMPULSU. Дать толчок — DAĆ IMPULS, винительный." }
  - { kind: pronunciation, text: "Читается «и́мпульс», ударение на первом слоге. L перед S — мягкое «ль»." }
collocations:
  - { pl: "dać impuls", ru: "дать толчок" }
  - { pl: "pod wpływem impulsu", ru: "под влиянием порыва" }
  - { pl: "impuls elektryczny", ru: "электрический импульс" }
family:
  - { pl: "impulsywny", ru: "импульсивный", relation: derived }
  - { pl: "bodziec", ru: "стимул, раздражитель", relation: root }
  - { pl: "motywacja", ru: "мотивация", relation: root }
etymology: "Из латинского IMPULSUS «толчок», от IMPELLERE «толкать». Русское «импульс» — то же слово."
memory: "Impuls — импульс, толчок и порыв. Pod wpływem impulsu — под влиянием минуты. Impulsywny — импульсивный. Читается «и́мпульс»."
idioms:
  - { pl: "pod wpływem impulsu", ru: "под влиянием минуты" }
