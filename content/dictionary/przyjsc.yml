# review
id: przyjsc
format: 2
lemma: "przyjść"
rank: 147
pos: verb
aspect: perf
pron: { cyr: "пшыйсьць" }
senses:
  - id: come
    ru: "прийти, явиться (о человеке)"
    examples:
      - pl: "Przyjdę."
        ru: "Я приду."
        source: { kind: tatoeba, id: 2659357 }
      - pl: "Przyjdę jutro."
        ru: "Я приду завтра."
        source: { kind: tatoeba, id: 3680580 }
      - pl: "Kto przyszedł?"
        ru: "Кто приходил?"
        source: { kind: tatoeba, id: 980779 }
  - id: arrive
    ru: "прийти, наступить (о времени, событии, мысли)"
    examples:
      - pl: "Przyszła wiosna."
        ru: "Пришла весна."
        source: { kind: authored }
      - pl: "Przyszedł czas na zmiany."
        ru: "Пришло время перемен."
        source: { kind: authored }
      - pl: "Przyszło mi to do głowy."
        ru: "Мне это пришло в голову."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Совершенный вид к przychodzić: Przychodzę tu co dzień «Прихожу сюда каждый день» — Przyszedłem wczoraj «Я пришёл вчера»." }
  - { kind: usage, text: "Направление: przyjść do kogoś «прийти к кому-то» (do + родительный), przyjść na coś «прийти на что-то» (na + винительный)." }
  - { kind: usage, text: "przyszło mi do głowy — «мне пришло в голову»; przyjść do siebie — «прийти в себя»." }
collocations:
  - { pl: "przyjść do domu", ru: "прийти домой" }
  - { pl: "przyjść na czas", ru: "прийти вовремя" }
  - { pl: "przyjść po kogoś", ru: "прийти за кем-то" }
  - { pl: "przyjść z pomocą", ru: "прийти на помощь" }
etymology: "Приставка przy- + iść — то же строение, что у русского «прийти» (при + идти); отсюда и чередование в прошедшем времени: przyszedł, как «пришёл»."
memory: "Основа меняется: przyjdę «приду», но przyszedłem «я пришёл» — ровно как русское «приду — пришёл». Запомните przyszło mi do głowy «мне пришло в голову»."
idioms:
  - { pl: "przyjść na świat", ru: "появиться на свет" }
  - { pl: "przyjść do siebie", ru: "прийти в себя" }
  - { pl: "przyszła koza do woza", ru: "пришла коза к возу" }
