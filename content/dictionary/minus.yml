      - pl: "Minus razy minus daje plus."
        ru: "Минус на минус даёт плюс."
        source: { kind: authored }
  - id: downside
    ru: "минус, недостаток"
    examples:
      - pl: "Największym minusem tego mieszkania jest hałas."
        ru: "Главный минус этой квартиры — шум."
        source: { kind: authored }
      - pl: "Każdy wybór ma plusy i minusy."
        ru: "У каждого выбора есть плюсы и минусы."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "MINUS — «минус», как в русском: и знак, и мороз, и недостаток. PLUSY I MINUSY — «плюсы и минусы». Оценка с минусом — CZWÓRKA Z MINUSEM, «четыре с минусом»." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Родительный — MINUSA. О температуре не склоняется: MINUS PIĘĆ STOPNI." }
  - { kind: government, text: "Оценка с минусом — Z MINUSEM, творительный. На минусе — NA MINUSIE, «в минусе» (о счёте). Минус чего — родительный: MINUS TEGO ROZWIĄZANIA." }
  - { kind: pronunciation, text: "Читается «ми́нус», ударение на первом слоге. MINUSIE — «мину́се»." }
collocations:
  - { pl: "plusy i minusy", ru: "плюсы и минусы" }
  - { pl: "być na minusie", ru: "быть в минусе" }
  - { pl: "z minusem", ru: "с минусом" }
family:
  - { pl: "plus", ru: "плюс", relation: root, id: plus }
  - { pl: "wada", ru: "недостаток", relation: root, id: wada }
  - { pl: "zaleta", ru: "достоинство", relation: root, id: zaleta }
etymology: "Из латинского MINUS «меньше». Русское «минус» — то же слово."
memory: "Minus — минус. Plusy i minusy — плюсы и минусы. Na minusie — в минусе. Читается «ми́нус»."
idioms:
  - { pl: "wyjść na minus", ru: "остаться в убытке" }
formExamplesSkip:
