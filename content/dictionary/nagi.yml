# review
id: nagi
format: 2
lemma: "nagi"
rank: 1689
pos: adj
pron: { cyr: "на́ги" }
senses:
  - id: naked
    ru: "голый, нагой (без одежды)"
    examples:
      - pl: "Byłem nagi."
        ru: "Я был голый."
        source: { kind: tatoeba, id: 12725602 }
      - pl: "Jestem nagi."
        ru: "Я голый."
        source: { kind: translated, id: 9376755 }
      - pl: "Tom jest nagi."
        ru: "Том голый."
        source: { kind: translated, id: 11570747 }
      - pl: "Jestem naga."
        ru: "Я голая."
        source: { kind: translated, id: 10626985 }
      - pl: "Kobieta jest naga."
        ru: "Женщина голая."
        source: { kind: translated, id: 11570775 }
      - pl: "Była zupełnie naga."
        ru: "Она была совершенно обнажена."
        source: { kind: tatoeba, id: 2309763 }
  - id: bare
    ru: "голый, лишённый покрова (о местности, предмете)"
    examples:
      - pl: "Wzgórze jest jest nagie, bez drzew."
        ru: "Холм голый, без деревьев."
        source: { kind: translated, id: 524676 }
      - pl: "Był boso z nagim torsem."
        ru: "Он был босиком и с голым торсом."
        source: { kind: translated, id: 9376626 }
      - pl: "Robotnicy byli nadzy do pasa."
        ru: "Рабочие были голыми до пояса."
        source: { kind: translated, id: 935217 }
notes:
  - { kind: usage, text: "Мужской род множественного числа для лиц — nadzy, а не nagi: robotnicy byli nadzy «рабочие были голые». Это личная форма." }
  - { kind: usage, text: "Устойчивое naga prawda — «голая правда», точный двойник русского выражения." }
  - { kind: usage, text: "Наречное сочетание rozebrać się do naga значит «раздеться догола»." }
  - { kind: false-friend, text: "Русское «нагой» звучит книжно и возвышенно, а польское nagi — обычное нейтральное слово, ближе к русскому «голый»." }
  - { kind: usage, text: "Переносное употребление такое же, как в русском: naga prawda «голая правда», nagie fakty «голые факты», nagie skały «голые скалы»." }
collocations:
  - { pl: "naga prawda", ru: "голая правда" }
  - { pl: "do naga", ru: "догола" }
  - { pl: "nagi tors", ru: "голый торс" }
etymology: "Праславянское *nagъ — то же слово, что русское «нагой» и «голый» в значении «нагой». Совпадение полное, только в русском оно звучит книжнее."
memory: "nagi — «голый», обычное нейтральное слово. Помните особую личную форму множественного числа: nadzy, а не nagi. И naga prawda — «голая правда»."
idioms:
  - { pl: "naga prawda", ru: "голая правда" }
  - { pl: "do naga", ru: "догола" }
  - { pl: "król jest nagi", ru: "а король-то голый" }
