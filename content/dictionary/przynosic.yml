# review
id: przynosic
format: 2
lemma: "przynosić"
rank: 1843
pos: verb
aspect: imperf
aspectPair: przyniesc
pron: { cyr: "пшыно́сиць" }
senses:
  - id: bring
    ru: "приносить (в руках)"
    examples:
      - pl: "Ona przynosi ser."
        ru: "Она приносит сыр."
        source: { kind: translated, id: 11665963 }
      - pl: "Dzieci przynosi bocian."
        ru: "Детей приносит аист."
        source: { kind: tatoeba, id: 12227365 }
      - pl: "Nie musisz przynosić obiadu."
        ru: "Тебе не нужно приносить обед."
        source: { kind: translated, id: 735668 }
  - id: bring-luck
    ru: "приносить (счастье, убытки, несчастье)"
    examples:
      - pl: "Rób to, co przynosi ci radość."
        ru: "Делай вещи, которые приносят тебе радость."
        source: { kind: tatoeba, id: 13225501 }
      - pl: "Wojna zawsze przynosi nieszczęście."
        ru: "Война всегда приносит несчастье."
        source: { kind: tatoeba, id: 10559683 }
      - pl: "Pieniądze nie zawsze przynoszą szczęście."
        ru: "Деньги не всегда приносят счастье."
        source: { kind: translated, id: 355454 }
notes:
  - { kind: usage, text: "Пара по виду: przynosić (несовершенный) — przynieść (совершенный)." }
  - { kind: false-friend, text: "Важное различие: przynosić — приносить в руках, а przywozić — привозить на транспорте. Русский различает их так же: «принести» и «привезти»." }
  - { kind: usage, text: "Слово обслуживает и отвлечённое: przynosić szczęście «приносить счастье», przynosić straty «приносить убытки», przynosić wstyd «позорить»." }
  - { kind: government, text: "Приносить что-то кому-то — przynosić coś komuś (винительный плюс дательный)." }
  - { kind: government, text: "Глагол берёт дополнением предмет или отвлечённое понятие: przynosić kwiaty, przynosić straty, przynosić szczęście. О человеке так не говорят — его вносят, wnosić, — поэтому мужско-личной формы страдательного причастия у przynosić нет." }
collocations:
  - { pl: "przynosić szczęście", ru: "приносить счастье" }
  - { pl: "przynosić straty", ru: "приносить убытки" }
  - { pl: "przynosić wstyd", ru: "позорить" }
family:
  - { pl: "przynieść", ru: "принести", relation: aspect, id: przyniesc }
  - { pl: "przywieźć", ru: "привезти", relation: root, id: przywiezc }
  - { pl: "nosić", ru: "носить", relation: root, id: nosic }
etymology: "Приставка przy- плюс nosić «носить» — то же слово, что русское «приносить». Совпадает и состав, и значение."
memory: "przynosić — «приносить» в руках; привозить на транспорте — przywozić. Совершенный вид — przynieść. И przynosić szczęście «приносить счастье»."
idioms:
