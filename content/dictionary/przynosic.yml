    ru: "Отдай предпочтение письму, которое приносят утром."
    source: { kind: authored }
  - form: "przynoszono"
    pl: "Przynoszono nam obiad do pokoju."
    ru: "Обед нам приносили в комнату."
    source: { kind: authored }
  - form: "przynoszono"
    pl: "Kwiaty przynoszono co tydzień."
    ru: "Цветы приносили каждую неделю."
    source: { kind: authored }
  - form: "przynoszono"
    pl: "Przynoszono same złe wieści."
    ru: "Приносили одни дурные вести."
    source: { kind: authored }
  - form: "przynoszony"
    pl: "Chleb przynoszony ze wsi smakuje inaczej."
    ru: "Хлеб, который приносят из деревни, на вкус другой."
    source: { kind: authored }
  - form: "przynoszony"
    pl: "List przynoszony rano leżał na progu."
    ru: "Письмо, которое приносят утром, лежало на пороге."
    source: { kind: authored }
  - form: "przynoszony"
    pl: "Zysk przynoszony przez sklep był niewielki."
    ru: "Прибыль, приносимая магазином, была невелика."
    source: { kind: authored }
  - form: "przynoszonych"
    pl: "Nie ma tu rzeczy przynoszonych z domu."
    ru: "Здесь нет вещей, принесённых из дома."
    source: { kind: authored }
  - form: "przynoszonych"
    pl: "Wśród kwiatów przynoszonych co tydzień były róże."
    ru: "Среди цветов, которые приносили каждую неделю, были розы."
    source: { kind: authored }
  - form: "przynoszonych"
    pl: "Liczba listów przynoszonych rano spadła."
    ru: "Число писем, приносимых утром, упало."
    source: { kind: authored }
  - form: "przynoszonym"
    pl: "W chlebie przynoszonym ze wsi jest inny smak."
    ru: "В хлебе, который приносят из деревни, другой вкус."
    source: { kind: authored }
  - form: "przynoszonym"
    pl: "Kwiatom przynoszonym co tydzień nikt się nie dziwi."
    ru: "Цветам, которые приносят каждую неделю, никто не удивляется."
    source: { kind: authored }
  - form: "przynoszonym"
    pl: "Z jedzeniem przynoszonym z domu nie ma problemu."
    ru: "С едой, принесённой из дома, проблем нет."
    source: { kind: authored }
  - form: "przynoszonymi"
    pl: "Zajmujemy się rzeczami przynoszonymi z domu."
    ru: "Мы занимаемся вещами, принесёнными из дома."
    source: { kind: authored }
  - form: "przynoszonymi"
    pl: "Między kwiatami przynoszonymi a kupowanymi jest różnica."
    ru: "Между цветами принесёнными и купленными есть разница."
    source: { kind: authored }
  - form: "przynoszonymi"
    pl: "Z wieściami przynoszonymi z miasta trzeba ostrożnie."
    ru: "С вестями, приносимыми из города, надо осторожно."
    source: { kind: authored }
  - form: "przynoś"
    pl: "Nie przynoś już więcej wstydu."
    ru: "Не приноси больше стыда."
    source: { kind: translated, id: 1630733 }
