# review
id: rozwinac
format: 2
lemma: "rozwinąć"
rank: 4254
pos: verb
pron: { cyr: "розви́нонць" }
senses:
  - id: unroll
    ru: "развернуть, раскрутить (свёрток, рулон)"
    examples:
      - pl: "Rozwinął prezent z papieru."
        ru: "Он развернул подарок."
        source: { kind: authored }
      - pl: "Rozwinęła mapę na kolanach."
        ru: "Она развернула карту на коленях."
        source: { kind: authored }
      - pl: "Kibice rozwiną wielki transparent."
        ru: "Болельщики развернут огромный транспарант."
        source: { kind: authored }
  - id: develop
    ru: "развить; с SIĘ — развиться"
    examples:
      - pl: "Rozwinął firmę w międzynarodową korporację."
        ru: "Он развил фирму в международную корпорацию."
        source: { kind: authored }
      - pl: "Rozwinęła talent muzyczny."
        ru: "Она развила музыкальный талант."
        source: { kind: authored }
      - pl: "Dziecko rozwinęło się prawidłowo."
        ru: "Ребёнок развился нормально."
        source: { kind: authored }
  - id: expand
    ru: "развернуть (мысль), расшифровать (сокращение); набрать (скорость)"
    examples:
      - pl: "Musisz rozwinąć tę myśl w wypracowaniu."
        ru: "В сочинении тебе нужно развернуть эту мысль."
        source: { kind: authored }
      - pl: "Pociąg rozwinął prędkość dwustu kilometrów na godzinę."
        ru: "Поезд разогнался до двухсот километров в час."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ROZWINĄĆ — «развернуть (свёрток)» и «развить»: ROZWINĄĆ FIRMĘ. Но «развернуть машину» — ZAWRÓCIĆ, «развернуть газету» — ROZŁOŻYĆ. ROZWINĄĆ SKRÓT — «расшифровать сокращение»." }
  - { kind: usage, text: "Пятьдесят три формы, включая ROZWINIĘCI — «развитые». ROZWINIĘTY — частое прилагательное: KRAJ ROZWINIĘTY «развитая страна». Будущее: ROZWINĘ, ROZWINIESZ, повелительное ROZWIŃ. Несовершенный вид — ROZWIJAĆ." }
  - { kind: government, text: "Что — винительный: ROZWINĄĆ DYWAN, TALENT. До какой скорости — родительный: ROZWINĄĆ PRĘDKOŚĆ STU KILOMETRÓW. С SIĘ — W с винительным: ROZWINĄĆ SIĘ W DUŻĄ FIRMĘ." }
  - { kind: pronunciation, text: "Читается «розви́нонць»: конечное ĄĆ — «онць», ударение на предпоследнем слоге. ROZWINĘ — «розви́нэ», ROZWIŃ — «ро́звинь»." }
  - { kind: register, text: "Нейтральное слово. ROZWINĄĆ SKRZYDŁA — книжное, образное «расправить крылья». ROZWINĄĆ DZIAŁALNOŚĆ — деловое." }
collocations:
  - { pl: "rozwinąć firmę", ru: "развить фирму" }
  - { pl: "rozwinąć mapę", ru: "развернуть карту" }
  - { pl: "rozwinąć skrót", ru: "расшифровать сокращение" }
family:
  - { pl: "rozwój", ru: "развитие", relation: derived, id: rozwoj }
  - { pl: "zwinąć", ru: "свернуть", relation: antonym }
  - { pl: "rozwijać", ru: "развивать; разворачивать", relation: aspect }
etymology: "Приставка ROZ- «раз-» плюс корень WIN- «вить», праславянское *viti. Буквально — «развить свёрнутое». Русское «развить», «развитие» — то же гнездо."
memory: "Rozwinąć — развернуть: rozwinął prezent. Развить: rozwinęła talent. Rozwinąć skrzydła — расправить крылья. Читается «розви́нонць»."
idioms:
  - { pl: "rozwinąć skrzydła", ru: "расправить крылья, раскрыться" }
