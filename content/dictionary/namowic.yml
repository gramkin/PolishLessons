notes:
  - { kind: false-friend, text: "Корень здесь русскому знаком, но в неожиданном виде. MÓWIĆ — самое будничное польское слово со значением «говорить», а восходит оно к праславянскому *mъlviti, то есть к русскому «молвить». В русском «молвить» давно отдало место «говорить» и держится только в стихах и сказках, в польском же оно и есть обычное слово. Та же пара видна в существительных: польское MOWA «речь» и русское «молва» — одно слово, разошедшееся в значении. Переводить NAMÓWIĆ как «намолвить» нельзя: по-русски это «уговорить»." }
  - { kind: pronunciation, text: "Читается «наму́вичь»: Ó всегда звучит как «у», а не как «о», поэтому MÓWIĆ это «му́вичь». Ударение на предпоследнем слоге, здесь на MÓ. Само Ó в этом корне — след исчезнувшего Ł: древнее MOŁWIĆ потеряло Ł, и гласная перед ним удлинилась, дав Ó. Поэтому русское «молва» и польское MOWA различаются ровно на этот звук. В формах прошедшего времени Ł звучит как «у»: NAMÓWIŁEM это «наму́виуэм»." }
  - { kind: government, text: "Самая частая схема — NAMÓWIĆ KOGOŚ NA COŚ: винительный на лицо и предлог NA с винительным на дело. NAMÓWIŁ MNIE NA WYJAZD «уговорил меня на поездку», как по-русски. Вторая схема — придаточное с ŻEBY: NAMÓWIŁA NAS, ŻEBYŚMY ZOSTALI. Здесь важно, что после ŻEBY польский ставит форму прошедшего времени, а личное окончание прирастает к самому союзу: ŻEBYŚMY ZOSTALI, ŻEBYŚ POSZEDŁ. Русский строит так же — «чтобы мы остались», «чтобы ты пошёл», — только окончание остаётся на глаголе. Есть и вариант NAMÓWIĆ KOGOŚ DO CZEGOŚ с родительным." }
  - { kind: usage, text: "Несовершенный партнёр — NAMAWIAĆ, и чередование Ó и A в корне тут закономерно: та же мена видна в паре ZAPROSIĆ и ZAPRASZAĆ. Пятьдесят три формы — обычная подпись переходного глагола совершенного вида: деепричастие NAMÓWIWSZY и полное страдательное причастие NAMÓWIONY. Глагол предполагает успех: если уговаривали, но не уговорили, нужен несовершенный вид, NAMAWIALI GO DŁUGO. Русский различает так же — «уговаривали» против «уговорили»." }
  - { kind: register, text: "Слово нейтральное, одинаково уместное в разговоре и в письме. Самый живой оборот — DAĆ SIĘ NAMÓWIĆ «дать себя уговорить, поддаться на уговоры»: DAŁEM SIĘ NAMÓWIĆ NA KAWĘ. Рядом стоит NAMOWA «уговоры, подстрекательство», чаще во множественном: ZA NAMOWĄ KOLEGÓW «по наущению приятелей». Оттенка принуждения в глаголе нет: заставить — это ZMUSIĆ, и путать их не стоит." }
collocations:
  - { pl: "namówić kogoś na coś", ru: "уговорить кого-то на что-то" }
  - { pl: "dać się namówić", ru: "дать себя уговорить" }
