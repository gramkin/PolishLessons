etymology: "Приставка NA- плюс MÓWIĆ, а тот восходит к праславянскому *mъlviti «молвить, говорить». Русский сохранил и глагол «молвить», и существительное «молва», но отодвинул их в высокий и устарелый слой; польский, наоборот, сделал MÓWIĆ главным словом для «говорить», а «говорить» в польском — GADAĆ, слово заметно более простецкое. Польское MOWA отвечает русской «молве» звук в звук, если учесть, что Ł перед W исчезло, удлинив гласную: MOŁWA дало MOWA, а в глаголе MOŁWIĆ дало MÓWIĆ. Отсюда и Ó, которое читается «у», и всё гнездо: WYMOWA «произношение», ROZMOWA «разговор», UMOWA «договор»."
memory: "Корень тот же, что в русском «молвить»: mówić «говорить», mowa «речь» — ровно «молва». Разница в том, что в русском это слова высокие и редкие, а в польском самые обычные. Ó читается как «у»: «наму́вичь». Управление запоминается парой схем: namówić kogoś na coś «уговорить кого-то на что-то» и namówić kogoś, żeby coś zrobił «уговорить кого-то, чтобы он что-то сделал», где после żeby идёт форма прошедшего времени, а окончание сидит на самом союзе: żebyśmy zostali."
idioms:
  - { pl: "dać się namówić", ru: "дать себя уговорить, поддаться на уговоры" }
