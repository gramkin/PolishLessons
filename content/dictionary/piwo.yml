# review
id: piwo
format: 2
lemma: "piwo"
rank: 865
pos: noun
pron: { cyr: "пи́во" }
senses:
  - id: beer
    ru: "пиво"
    examples:
      - pl: "Piję piwo."
        ru: "Я пью пиво."
        source: { kind: tatoeba, id: 2374404 }
      - pl: "Piliśmy piwo."
        ru: "Мы пили пиво."
        source: { kind: tatoeba, id: 6406087 }
      - pl: "Czyje to piwo?"
        ru: "Чьё это пиво?"
        source: { kind: tatoeba, id: 4869587 }
  - id: kinds
    ru: "о сортах и порциях пива"
    examples:
      - pl: "Próbowałeś japońskiego piwa?"
        ru: "Ты пробовал японское пиво?"
        source: { kind: tatoeba, id: 2143166 }
      - pl: "Niemcy są znane ze swojego piwa."
        ru: "Германия известна своим пивом."
        source: { kind: tatoeba, id: 5975459 }
      - pl: "Tom otworzył półlitrową butelkę piwa."
        ru: "Том открыл полулитровую бутылку пива."
        source: { kind: tatoeba, id: 2495825 }
  - id: several
    ru: "kilka piw — несколько кружек пива"
    note: "Во множественном числе слово считает порции, как русское «два пива»."
    examples:
      - pl: "Wypiłem kilka piw na odwagę."
        ru: "Я выпил несколько кружек пива для храбрости."
        source: { kind: translated, id: 3141044 }
      - pl: "Poszedł do baru wypić kilka piw."
        ru: "Он пошёл в бар выпить несколько кружек пива."
        source: { kind: translated, id: 7053952 }
      - pl: "Wypełnimy żołądki piwem i ziemniakami."
        ru: "Мы набьём животы пивом и картошкой."
        source: { kind: translated, id: 13838849 }
notes:
  - { kind: usage, text: "Множественное число piwa, piw считает порции: kilka piw «несколько кружек пива», dwa piwa «два пива». Русский разговорный язык делает то же самое." }
  - { kind: usage, text: "małe piwo — «пустяк, мелочь»: To małe piwo «Это ерунда». Ничего общего с размером кружки." }
  - { kind: usage, text: "nawarzyć piwa — «заварить кашу, натворить дел»: Nawarzyłeś piwa, to musisz je teraz wypić «Заварил кашу — сам и расхлёбывай»." }
  - { kind: usage, text: "Родственные слова прозрачны: piwnica «погреб» (изначально место, где держали пиво), browar «пивоварня», piwko «пивко»." }
collocations:
  - { pl: "pić piwo", ru: "пить пиво" }
  - { pl: "kufel piwa", ru: "кружка пива" }
  - { pl: "małe piwo", ru: "пустяк" }
  - { pl: "nawarzyć piwa", ru: "заварить кашу" }
family:
  - { pl: "pić", ru: "пить", relation: root }
  - { pl: "piwnica", ru: "погреб", relation: derived }
  - { pl: "browar", ru: "пивоварня", relation: derived }
etymology: "Праславянское *pivo от *piti «пить» — буквально «питьё». Русское «пиво» то же самое слово, и когда-то в обоих языках оно значило любой напиток."
memory: "piwo — «пиво», слово родное и совпадает с русским полностью: внутри сидит pić «пить». Во множественном числе считает порции: kilka piw «несколько кружек». Запомните два оборота: małe piwo «пустяк» и nawarzyć piwa «заварить кашу»."
idioms:
  - { pl: "małe piwo", ru: "пустяк, ерунда" }
  - { pl: "nawarzyć piwa", ru: "заварить кашу" }
  - { pl: "kufel piwa", ru: "кружка пива" }
