# review
id: kochac
format: 2
lemma: "kochać"
rank: 101
pos: verb
aspect: imperf
pron: { cyr: "ко́хаць" }
senses:
  - id: love
    ru: "любить (человека)"
    examples:
      - pl: "Kocham cię."
        ru: "Я люблю тебя!"
        source: { kind: tatoeba, id: 348818 }
      - pl: "Kochasz mnie?"
        ru: "Ты меня любишь?"
        source: { kind: tatoeba, id: 1115020 }
      - pl: "On ją kocha."
        ru: "Он ее любит."
        source: { kind: tatoeba, id: 348633 }
  - id: adore
    ru: "любить, обожать (занятие, вещь)"
    examples:
      - pl: "Kocham naturę."
        ru: "Я люблю природу."
        source: { kind: tatoeba, id: 1409819 }
      - pl: "Ann kocha czekoladę."
        ru: "Энн любит шоколад."
        source: { kind: tatoeba, id: 567472 }
notes:
  - { kind: usage, text: "kochać — о глубоком чувстве; «нравиться» передаётся глаголом lubić: Lubię kawę, ale kocham ciebie." }
  - { kind: usage, text: "Возвратное kochać się значит «любить друг друга» или «быть влюблённым»: Kochają się od lat." }
collocations:
  - { pl: "kocham cię", ru: "я тебя люблю" }
  - { pl: "kochać się w kimś", ru: "быть влюблённым в кого-то" }
  - { pl: "kochany", ru: "любимый, милый" }
etymology: "Праславянское *kochati «холить, любить»; русское «любить» — другой корень, а вот «кохать» сохранилось в украинском и в южнорусских говорах."
memory: "В отличие от русского, где один глагол «любить» покрывает всё, польский различает kochać (глубокое чувство) и lubić («нравиться»): Lubię kawę, ale kocham ciebie. Обращение kochanie значит «дорогой, дорогая»."
idioms:
  - { pl: "kocham cię", ru: "я тебя люблю" }
  - { pl: "kochać się w kimś", ru: "быть влюблённым в кого-то" }
  - { pl: "jak babcię kocham", ru: "честное слово" }
