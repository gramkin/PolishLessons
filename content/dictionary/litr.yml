notes:
  - { kind: false-friend, text: "LITR — «литр», как в русском. После 2, 3, 4 — LITRY, после 5 и больше — LITRÓW. Пол-литра — PÓŁ LITRA, полтора — PÓŁTORA LITRA. Разговорное PÓŁ LITRA часто значит «бутылка водки»." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Родительный — LITRA, с -A. В местном R переходит в RZ: W LITRZE." }
  - { kind: government, text: "Литр чего — родительный: LITR SOKU. За литр — ZA LITR, винительный. По литру — PO LITRZE, местный." }
  - { kind: pronunciation, text: "Читается «литр», один слог. LITRZE — «ли́тшэ»: TRZ звучит как «тш»." }
