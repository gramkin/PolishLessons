etymology: "NA + PRZECIW «против» + суффикс -KO. PRZECIW — родня русского «против»: место напротив — то, что «против» тебя."
memory: "Naprzeciwko — напротив (где): naprzeciwko poczty. «Напротив, наоборот» — przeciwnie. Читается «напшэци́фко». Z naprzeciwka — из дома напротив."
idioms:
