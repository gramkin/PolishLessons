notes:
  - { kind: false-friend, text: "NAPRZECIWKO — только пространственное «напротив». Русское «напротив» в смысле «наоборот» по-польски — PRZECIWNIE или WRĘCZ PRZECIWNIE. «Ты устал? — Напротив!» — JESTEŚ ZMĘCZONY? PRZECIWNIE!" }
  - { kind: usage, text: "Одна форма. Работает предлогом, NAPRZECIWKO DOMU, и наречием: MIESZKA NAPRZECIWKO. Короткий вариант NAPRZECIW — то же самое, чуть книжнее. Соседи напротив — SĄSIEDZI Z NAPRZECIWKA." }
  - { kind: government, text: "Предлог требует родительного падежа, как и русское «напротив»: NAPRZECIWKO SZKOŁY, NAPRZECIWKO MNIE. Друг напротив друга — NAPRZECIWKO SIEBIE." }
  - { kind: pronunciation, text: "Читается «напшэци́фко», ударение на предпоследнем слоге. PRZ — «пш», CI — «ци», W перед K оглушается в «ф»." }
collocations:
