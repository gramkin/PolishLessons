  - id: english-adj
    ru: "английский (относящийся к Англии)"
    examples:
      - pl: "Czy to nie jest angielska książka?"
        ru: "Разве это не английская книга?"
        source: { kind: translated, id: 570952 }
      - pl: "Izaak Niuton był angielskim fizykiem."
        ru: "Исаак Ньютон был английским физиком."
        source: { kind: tatoeba, id: 3464134 }
      - pl: "Tom lubi czytać literaturę angielską."
        ru: "Том любит читать английскую литературу."
        source: { kind: translated, id: 4917175 }
notes:
  - { kind: usage, text: "Как и в русском, прилагательное работает существительным для языка: angielski «английский язык», uczyć się angielskiego «учить английский»." }
  - { kind: government, text: "uczyć się angielskiego требует родительного падежа. А «говорить по-английски» — mówić po angielsku, наречная форма." }
  - { kind: usage, text: "Nauczyciel angielskiego — «учитель английского». «По-английски» всегда po angielsku, не angielsko." }
  - { kind: usage, text: "Идиома wyjść po angielsku значит «уйти не прощаясь» — по-русски говорят «уйти по-английски»." }
collocations:
  - { pl: "uczyć się angielskiego", ru: "учить английский" }
  - { pl: "po angielsku", ru: "по-английски" }
  - { pl: "nauczyciel angielskiego", ru: "учитель английского" }
etymology: "От Anglia «Англия» с суффиксом -ski. Русское «английский» построено тем же способом."
memory: "angielski — и «английский» как прилагательное, и «английский язык» как существительное: uczyć się angielskiego, с родительным. А «по-английски» будет po angielsku. И wyjść po angielsku значит «уйти не прощаясь»."
idioms:
  - { pl: "po angielsku", ru: "по-английски" }
  - { pl: "uczyć się angielskiego", ru: "учить английский" }
  - { pl: "wyjść po angielsku", ru: "уйти не прощаясь" }
