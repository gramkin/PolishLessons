# review
id: technologia
format: 2
lemma: "technologia"
rank: 1971
pos: noun
pron: { cyr: "тэхноло́гя" }
senses:
  - id: technology
    ru: "технология, техника"
    examples:
      - pl: "Technologia jest przerażająca."
        ru: "Технология пугает."
        source: { kind: translated, id: 10782521 }
      - pl: "Technologia jest cały czas rozwijana."
        ru: "Технология развивается постоянно."
        source: { kind: translated, id: 3745051 }
      - pl: "Nowoczesna technologia uczyniła nasze życia wygodniejszymi."
        ru: "Современная технология сделала нашу жизнь удобнее."
        source: { kind: translated, id: 8948718 }
      - pl: "Technologia nie ma sensu, jeśli nie służy ludzkości."
        ru: "Технология не имеет смысла, если не служит человечеству."
        source: { kind: translated, id: 502002 }
      - pl: "Żyjemy w erze technologii."
        ru: "Мы живём в эпоху технологий."
        source: { kind: translated, id: 840191 }
      - pl: "W tym samolocie zastosowano nową technologię."
        ru: "В этом самолёте применена новая технология."
        source: { kind: translated, id: 2516376 }
  - id: technologies
    ru: "технологии (во множественном); отрасль"
    examples:
      - pl: "Projektujemy technologie dla zwykłych ludzi."
        ru: "Мы проектируем технологии для обычных людей."
        source: { kind: translated, id: 2006341 }
      - pl: "Nowoczesne technologie mogą być bardzo pomocne w tworzeniu nowych miejsc pracy."
        ru: "Современные технологии могут очень помочь в создании новых рабочих мест."
        source: { kind: translated, id: 608588 }
      - pl: "Wraz z poprawą technologii medycznej, ludzie żyją dłużej."
        ru: "С улучшением медицинских технологий люди живут дольше."
        source: { kind: translated, id: 11136319 }
notes:
  - { kind: usage, text: "Слово совпадает с русским «технология» и по форме, и по значению: оба из греческого technē «искусство, ремесло» и logos «слово, учение»." }
  - { kind: usage, text: "Женский род на -ia: technologia, technologii, technologię. Родительный и предложный совпадают — technologii." }
  - { kind: usage, text: "Частые сочетания: nowoczesna technologia «современная технология», era technologii «эпоха технологий», nowe technologie «новые технологии»." }
  - { kind: government, text: "Родительный падеж множественного числа — technologii. Архаичная форма technologij относится к тому же ряду, что agencyj и reakcyj: после g, k, l пишется -ij, после c, s, z — -yj, и то и другое только в старых текстах." }
collocations:
  - { pl: "nowoczesna technologia", ru: "современная технология" }
  - { pl: "era technologii", ru: "эпоха технологий" }
  - { pl: "nowe technologie", ru: "новые технологии" }
etymology: "Из греческого technē «искусство, ремесло» и logos «слово, учение», через латынь и немецкий. Русская «технология» — то же заимствование тем же путём, поэтому слова совпадают."
memory: "technologia — «технология», слово-близнец русского. Женский род на -ia: родительный и предложный совпадают в форме technologii."
idioms:
  - { pl: "nowoczesna technologia", ru: "современная технология" }
  - { pl: "era technologii", ru: "эпоха технологий" }
  - { pl: "nowe technologie", ru: "новые технологии" }
formExamplesSkip:
  - { form: "technologij", reason: "архаичный родительный падеж множественного числа; в современном языке говорят technologii. Окончание -ij (после g, k, l) и его пара -yj (после c, s, z) встречаются только в старых текстах" }
