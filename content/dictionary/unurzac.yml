# review
id: unurzac
format: 2
lemma: "unurzać"
rank: 5795
pos: verb
aspect: perf
pron: { cyr: "уну́жаць" }
senses:
  - id: smear
    ru: "вывалять, вымазать, обмакнуть (в грязи, крови, муке)"
    examples:
      - pl: "Pies unurzał się w błocie."
        ru: "Собака вывалялась в грязи."
        source: { kind: authored }
      - pl: "Koszula była unurzana we krwi."
        ru: "Рубашка была вся в крови."
        source: { kind: authored }
      - pl: "Unurzaj kotlet w jajku, potem w bułce."
        ru: "Обмакни котлету в яйцо, потом в сухари."
        source: { kind: authored }
  - id: wallow
    ru: "с SIĘ, перен. — погрязнуть (в роскоши, во лжи)"
    examples:
      - pl: "Miasto unurzało się w luksusie i grzechu."
        ru: "Город погряз в роскоши и грехе."
        source: { kind: authored }
      - pl: "Nie unurzajmy się w kłamstwach."
        ru: "Давайте не погрязнем во лжи."
        source: { kind: authored }
notes:
  - { kind: register, text: "Слово книжное и редкое. Чаще всего встречается причастие UNURZANY: UNURZANY WE KRWI «весь в крови», UNURZANY W BŁOCIE «вывалянный в грязи». В быту говорят UBRUDZIĆ SIĘ «испачкаться», а на кухне — OBTOCZYĆ «обвалять», MACZAĆ «макать»." }
  - { kind: usage, text: "Совершенный вид; несовершенный — NURZAĆ «погружать, окунать». Будущее спрягается на -AM, как настоящее у глаголов на -AĆ: UNURZAM, UNURZASZ, UNURZAJĄ. Не путать с ZANURZYĆ «погрузить» — тот только «окунуть», без значения «вымазать»." }
  - { kind: government, text: "Во что — W + предложный: UNURZAĆ W BŁOCIE, W MĄCE; с кровью — WE KRWI. Что — винительный: UNURZAĆ KOTLET W JAJKU." }
  - { kind: pronunciation, text: "Читается «уну́жаць»: RZ — «ж», ударение на предпоследнем слоге. UNURZANY — «унужа́ны»." }
collocations:
  - { pl: "unurzany we krwi", ru: "весь в крови, обагрённый кровью" }
  - { pl: "unurzać w błocie", ru: "вывалять в грязи" }
  - { pl: "unurzać w mące", ru: "обвалять в муке" }
family:
  - { pl: "nurzać", ru: "окунать, погружать", relation: aspect }
  - { pl: "zanurzyć", ru: "погрузить, окунуть", relation: root }
  - { pl: "nurek", ru: "ныряльщик, водолаз", relation: root }
etymology: "Приставка U- плюс NURZAĆ «окунать, погружать»; от того же корня NUREK «ныряльщик» и ZANURZYĆ «погрузить»."
memory: "Unurzać — окунуть по уши: pies unurzał się w błocie. Nurek «ныряльщик» тоже окунается с головой."
idioms:
  - { pl: "unurzany we krwi", ru: "обагрённый кровью, весь в крови" }
