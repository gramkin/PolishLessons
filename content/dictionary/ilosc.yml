# review
id: ilosc
format: 2
lemma: "ilość"
rank: 1444
pos: noun
pron: { cyr: "и́лосць" }
senses:
  - id: quantity
    ru: "количество"
    examples:
      - pl: "Większa ilość nie zawsze oznacza gorszą jakość."
        ru: "Большое количество не всегда значит плохое качество."
        source: { kind: tatoeba, id: 12692421 }
      - pl: "Wolę jakość niż ilość."
        ru: "Я предпочитаю качество количеству."
        source: { kind: translated, id: 4668573 }
      - pl: "Rolnictwo zużywa duże ilości wody."
        ru: "Сельское хозяйство потребляет большое количество воды."
        source: { kind: translated, id: 970280 }
  - id: number-of
    ru: "число, множество (в оборотах)"
    examples:
      - pl: "Jest ich niezliczona ilość."
        ru: "Их несметное количество."
        source: { kind: translated, id: 927151 }
      - pl: "Pomogła mi niezliczoną ilość razy."
        ru: "Она помогла мне бессчётное количество раз."
        source: { kind: translated, id: 7962597 }
notes:
  - { kind: usage, text: "Женский род на -ość, как wolność и rzeczywistość. Родительный, дательный и предложный совпадают — ilości." }
  - { kind: false-friend, text: "Строгая норма требует ilość для неисчисляемого (ilość wody «количество воды») и liczba для исчисляемого (liczba osób «число людей»). В живой речи ilość вытесняет liczba, но в письменной работе это считается ошибкой." }
  - { kind: usage, text: "ilość и jakość — «количество» и «качество»: Wolę jakość niż ilość." }
  - { kind: usage, text: "niezliczona ilość — «несметное количество», устойчивое сочетание." }
collocations:
  - { pl: "duża ilość", ru: "большое количество" }
  - { pl: "niezliczona ilość", ru: "несметное количество" }
  - { pl: "ilość i jakość", ru: "количество и качество" }
etymology: "От ile «сколько» с суффиксом -ość, образующим отвлечённые существительные. Русское «количество» собрано ровно так же — от старого «колико, сколько»."
memory: "ilość — «количество», от ile «сколько», ровно как русское «количество» от «сколько». Женский род на -ość: dużo ilości. И помните строгую норму: ilość для неисчисляемого, liczba для исчисляемого."
idioms:
  - { pl: "niezliczona ilość", ru: "несметное количество" }
  - { pl: "w dużych ilościach", ru: "в больших количествах" }
  - { pl: "ilość i jakość", ru: "количество и качество" }
