# review
id: uwolnic
format: 2
lemma: "uwolnić"
rank: 1424
pos: verb
aspect: perf
pron: { cyr: "уво́льниць" }
senses:
  - id: release
    ru: "освободить, выпустить на свободу"
    examples:
      - pl: "Uwolnij zwierzęta z klatki."
        ru: "Освободи зверей из клетки."
        source: { kind: tatoeba, id: 2008941 }
      - pl: "Tom uwolnił ptaka."
        ru: "Том выпустил птицу."
        source: { kind: translated, id: 4258093 }
      - pl: "Lincoln uwolnił niewolników."
        ru: "Линкольн освободил рабов."
        source: { kind: translated, id: 611774 }
  - id: free-oneself
    ru: "uwolnić się — освободиться, избавиться, вырваться"
    examples:
      - pl: "Próbował się od niej uwolnić."
        ru: "Он пытался от неё освободиться."
        source: { kind: translated, id: 9684337 }
      - pl: "Nie mogę się od niej uwolnić."
        ru: "Я не могу от неё избавиться."
        source: { kind: translated, id: 4920706 }
notes:
  - { kind: false-friend, text: "Главная ловушка для русского: uwolnić — это «освободить», а НЕ «уволить». «Уволить с работы» по-польски zwolnić z pracy. Разница только в приставке u-/z-." }
  - { kind: usage, text: "Совершенный вид к uwalniać. От wolny «свободный» и wolność «свобода»." }
  - { kind: government, text: "uwolnić kogo (винительный) od czego или z czego: uwolnić ptaka z klatki «выпустить птицу из клетки», uwolnić od strachu «избавить от страха»." }
  - { kind: usage, text: "Безличная форма uwolniono «освободили» очень частотна в новостях: Zakładników uwolniono." }
collocations:
  - { pl: "uwolnić zakładników", ru: "освободить заложников" }
  - { pl: "uwolnić się od czegoś", ru: "избавиться от чего-либо" }
  - { pl: "uwolnić z klatki", ru: "выпустить из клетки" }
etymology: "Приставка u- и wolny «свободный» (праславянское *volja «воля»). Русская «воля» того же корня, но русское «уволить» ушло в сторону «отпустить с работы», а польское uwolnić осталось при значении «освободить»."
memory: "uwolnić — «освободить», от wolny «свободный». Главная ловушка для русского: это НЕ «уволить». «Уволить с работы» — zwolnić z pracy. С się значит «избавиться»: Nie mogę się od niej uwolnić."
idioms:
  - { pl: "uwolnić się od czegoś", ru: "избавиться от чего-либо" }
  - { pl: "uwolnić zakładników", ru: "освободить заложников" }
  - { pl: "uwolnić od zarzutów", ru: "снять обвинения" }
formExamplesSkip:
  - { form: "uwolniwszy", reason: "книжное деепричастие, в корпусе примеров нет" }
