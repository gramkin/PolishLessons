pos: noun
pron: { cyr: "рут" }
senses:
  - id: clan
    ru: "род, династия, знатная семья"
    examples:
      - pl: "Pochodzi ze starego rodu szlacheckiego."
        ru: "Он происходит из старого шляхетского рода."
        source: { kind: authored }
      - pl: "Ród Piastów rządził Polską przez wieki."
        ru: "Род Пястов правил Польшей веками."
        source: { kind: authored }
      - pl: "Zamek należał do rodu Radziwiłłów."
        ru: "Замок принадлежал роду Радзивиллов."
        source: { kind: authored }
  - id: origin
    ru: "происхождение (в выражении rodem z)"
    examples:
      - pl: "Jest rodem z Wilna."
        ru: "Он родом из Вильнюса."
        source: { kind: authored }
      - pl: "Mój dziadek był rodem z gór."
        ru: "Мой дед был родом с гор."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "RÓD — «род» в смысле семьи и династии: RÓD KRÓLEWSKI, STARY RÓD. Но грамматический род — RODZAJ: RODZAJ MĘSKI, «мужской род». «Род занятий» — тоже RODZAJ: RODZAJ PRACY. И «роды» у женщины — PORÓD, а не RODY: RODY — просто множественное от RÓD." }
  - { kind: usage, text: "Мужской род, неодушевлённое. Ó в именительном RÓD чередуется с O во всех остальных формах: RODU, RODEM, RODY. В местном D смягчается: W RODZIE. Творительный RODEM застыл в выражении RODEM Z, «родом из»." }
  - { kind: government, text: "«Родом из» — RODEM Z с родительным: RODEM Z POZNANIA. «Из рода» — Z RODU: KSIĄŻĘ Z RODU JAGIELLONÓW. Чей род — родительный: RÓD KOWALSKICH." }
  - { kind: pronunciation, text: "Читается «рут»: Ó — «у», конечное D оглушается в «т». В других формах O ясное: RODU — «ро́ду», RODZIE — «ро́дзе», с мягким «дзь»." }
  - { kind: register, text: "Слово книжное и историческое: династии, шляхта, легенды. В быту о своей семье говорят RODZINA. Устойчивое RÓD LUDZKI — «род людской» — торжественное." }
collocations:
  - { pl: "stary ród", ru: "старинный род" }
  - { pl: "rodem z", ru: "родом из" }
  - { pl: "ród ludzki", ru: "род людской" }
family:
  - { pl: "rodzina", ru: "семья", relation: derived, id: rodzina }
  - { pl: "rodzaj", ru: "род (грамматический); вид", relation: derived, id: rodzaj }
  - { pl: "urodzić", ru: "родить", relation: root, id: urodzic }
etymology: "Праславянское *rodъ «род, рождение», то же слово, что русское «род». Польское Ó в RÓD — удлинённое O перед звонким согласным в конце слова, как в BÓG и WÓZ."
memory: "Ród — род, династия: stary ród, ród Piastów. Rodem z Krakowa — родом из Кракова. Грамматический род — rodzaj! Читается «рут»."
idioms:
  - { pl: "rodem z", ru: "родом из" }
formExamplesSkip:
  - { form: "rodzie", cell: "Звательный", reason: "звательный падеж: для неодушевлённого существительного он практически не употребляется" }
