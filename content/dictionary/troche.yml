# review
id: troche
format: 2
lemma: "trochę"
rank: 136
pos: num
pron: { cyr: "тро́хэ" }
senses:
  - id: quantity
    ru: "немного, чуть-чуть (+ родительный падеж)"
    examples:
      - pl: "Dodaj trochę mleka."
        ru: "Добавь немного молока."
        source: { kind: tatoeba, id: 760299 }
      - pl: "Masz trochę pieniędzy?"
        ru: "У тебя есть немного денег?"
        source: { kind: tatoeba, id: 362894 }
      - pl: "Ona ma trochę książek."
        ru: "У неё мало книг."
        source: { kind: tatoeba, id: 936282 }
  - id: degree
    ru: "немного, слегка (о действии и признаке)"
    examples:
      - pl: "Trochę mnie głowa boli."
        ru: "У меня небольшая головная боль."
        source: { kind: tatoeba, id: 1002582 }
      - pl: "Mówię trochę po japońsku."
        ru: "Я немного говорю по-японски."
        source: { kind: tatoeba, id: 440717 }
      - pl: "Trochę się dziś przejadłem."
        ru: "Я сегодня немного переел."
        source: { kind: tatoeba, id: 3603523 }
notes:
  - { kind: government, text: "trochę требует родительного падежа: trochę wody, trochę czasu, trochę pieniędzy — как русское «немного»." }
  - { kind: usage, text: "ani trochę — «нисколько», po trochu — «понемногу», trochę za dużo — «многовато»." }
collocations:
  - { pl: "trochę czasu", ru: "немного времени" }
  - { pl: "ani trochę", ru: "нисколько" }
  - { pl: "po trochu", ru: "понемногу" }
etymology: "Праславянское *trocha «крошка»; родственно польскому drobina. В русском ближайший отголосок — южное «трошки»."
memory: "trochę + родительный: trochę wody, trochę czasu. Две связки на каждый день: ani trochę «нисколько» и po trochu «понемногу»."
idioms:
  - { pl: "ani trochę", ru: "нисколько" }
  - { pl: "po trochu", ru: "понемногу" }
  - { pl: "trochę za dużo", ru: "многовато" }
