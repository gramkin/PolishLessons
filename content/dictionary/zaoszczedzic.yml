        ru: "Эта дорога сэкономит нам час."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ZAOSZCZĘDZIĆ — «сэкономить», от OSZCZĘDZAĆ, «экономить, беречь». Русскому «пощадить» соответствует OSZCZĘDZIĆ: OSZCZĘDZIĆ KOGOŚ. ZAOSZCZĘDZIĆ KOMUŚ COŚ — «избавить кого-то от чего-то»: ZAOSZCZĘDŹ MI TEGO, «избавь меня от этого», с родительным." }
  - { kind: usage, text: "Пятьдесят две формы: страдательное ZAOSZCZĘDZONY — о деньгах и времени, «сэкономленный»; форма для мужчин-людей ZAOSZCZĘDZENI в карточку не включена. Деепричастие ZAOSZCZĘDZIWSZY. Повелительное ZAOSZCZĘDŹ. Видовой партнёр — OSZCZĘDZAĆ." }
  - { kind: government, text: "Что — винительный: ZAOSZCZĘDZIĆ PIENIĄDZE, CZAS. На что копить — NA с винительным: ZAOSZCZĘDZIĆ NA SAMOCHÓD. На чём — NA с местным: ZAOSZCZĘDZIĆ NA PRĄDZIE. Избавить от — дательный лица и родительный вещи: ZAOSZCZĘDZIĆ KOMUŚ KŁOPOTU." }
  - { kind: pronunciation, text: "Читается «заошчэ́ндзиць», четыре слога: ZA-O-SZCZĘ-DZIĆ, ударение на SZCZĘ. Ę перед DZ — «эн», DZI — «дзи». Конечное Ć — «ць»." }
  - { kind: register, text: "Нейтральное бытовое слово о деньгах и времени. Книжное ZAOSZCZĘDZIĆ KOMUŚ CIERPIEŃ — «избавить от страданий». В разговоре о накоплениях: ODŁOŻYĆ PIENIĄDZE." }
collocations:
  - { pl: "zaoszczędzić pieniądze", ru: "сэкономить деньги" }
  - { pl: "zaoszczędzić czas", ru: "сэкономить время" }
  - { pl: "zaoszczędzić na samochód", ru: "накопить на машину" }
family:
  - { pl: "oszczędzać", ru: "экономить, беречь", relation: aspect }
  - { pl: "oszczędność", ru: "экономия, сбережения", relation: derived }
  - { pl: "oszczędny", ru: "экономный", relation: derived }
etymology: "Приставка ZA- плюс OSZCZĘDZIĆ «пощадить, сберечь», от праславянского *ščęditi, того же корня, что русское «щадить», «пощада». Польское SZCZĘ на месте русского «ща»."
memory: "Zaoszczędzić — сэкономить: pieniądze, czas, na rower. Zaoszczędź mi szczegółów — избавь от подробностей. Корень как в «щадить». Читается «заошчэ́ндзиць»."
