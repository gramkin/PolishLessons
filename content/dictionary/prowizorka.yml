# review
id: prowizorka
format: 2
lemma: "prowizorka"
rank: 5779
pos: noun
pron: { cyr: "провизо́рка" }
senses:
  - id: makeshift
    ru: "времянка, временная поделка на скорую руку"
    examples:
      - pl: "Ten most to tylko prowizorka."
        ru: "Этот мост — просто времянка."
        source: { kind: authored }
      - pl: "Naprawa kranu była prowizorką, znowu cieknie."
        ru: "Кран починили на скорую руку, он опять течёт."
        source: { kind: authored }
      - pl: "Zamiast drzwi wisiała prowizorka z koca."
        ru: "Вместо двери висела времянка из одеяла."
        source: { kind: authored }
  - id: temporariness
    ru: "временщина, временное положение дел"
    examples:
      - pl: "Żyjemy w ciągłej prowizorce."
        ru: "Мы живём в постоянной временщине."
        source: { kind: authored }
      - pl: "Mam dość tej prowizorki w biurze."
        ru: "Мне надоела эта временщина в офисе."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "PROWIZORKA — «времянка, временное решение на скорую руку», а не «провизия» (это PROWIANT) и не «провизор». Связано с прилагательным PROWIZORYCZNY «временный, импровизированный». По-русски ближе всего «времянка» или «тяп-ляп»." }
  - { kind: register, text: "Слово разговорное и обычно неодобрительное: так называют то, что сделали наспех и не собираются переделывать. Нейтрально — ROZWIĄZANIE TYMCZASOWE «временное решение»." }
  - { kind: usage, text: "Девять живых форм, женский род. Перед E K переходит в C: W PROWIZORCE. Родительный множественного с беглым E — PROWIZOREK. Звательный PROWIZORKO не употребляется." }
collocations:
  - { pl: "zwykła prowizorka", ru: "обычная времянка" }
  - { pl: "żyć w prowizorce", ru: "жить во временщине" }
  - { pl: "zrobić prowizorkę", ru: "сделать на скорую руку" }
family:
  - { pl: "prowizoryczny", ru: "временный, импровизированный", relation: derived }
  - { pl: "prowizorycznie", ru: "временно, на скорую руку", relation: derived, id: prowizorycznie }
  - { pl: "tymczasowy", ru: "временный", relation: root, id: tymczasowy }
etymology: "Через PROWIZORYCZNY из латинского provisorius «предварительный, заготовленный заранее». Того же латинского корня, что русское «провизия», но значение разошлось."
memory: "Prowizorka — времянка, сделано на скорую руку. Nie ma nic trwalszego niż prowizorka: нет ничего более постоянного, чем временное."
idioms:
  - { pl: "nie ma nic trwalszego niż prowizorka", ru: "нет ничего более постоянного, чем временное" }
formExamplesSkip:
  - { form: "prowizorko", reason: "звательный от названия вещи не употребляется" }
