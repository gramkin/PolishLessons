# review
id: podroz
format: 2
lemma: "podróż"
rank: 827
pos: noun
pron: { cyr: "по́друш" }
senses:
  - id: journey
    ru: "путешествие, поездка"
    examples:
      - pl: "Życie to podróż."
        ru: "Жизнь - это путешествие."
        source: { kind: tatoeba, id: 3783024 }
      - pl: "Życie jest niczym podróż."
        ru: "Жизнь - словно путешествие."
        source: { kind: tatoeba, id: 1133647 }
      - pl: "Lubię podróże."
        ru: "Я люблю путешествия."
        source: { kind: translated, id: 410033 }
  - id: honeymoon
    ru: "podróż poślubna — свадебное путешествие"
    examples:
      - pl: "Na podróż poślubną pojechali do Włoch."
        ru: "В свадебное путешествие они поехали в Италию."
        source: { kind: tatoeba, id: 6305568 }
      - pl: "Życie jest podróżą do domu."
        ru: "Жизнь — это путешествие домой."
        source: { kind: translated, id: 2831811 }
      - pl: "Przed podróżą ściąłem włosy."
        ru: "Перед поездкой я подстригся."
        source: { kind: translated, id: 3051111 }
  - id: from-journey
    ru: "z podróży — из поездки (родительный)"
    examples:
      - pl: "Wskutek tajfunu rodzice wrócili dzień wcześniej z podróży."
        ru: "Из-за тайфуна родители вернулись из путешествия на день раньше."
        source: { kind: tatoeba, id: 997662 }
      - pl: "Podczas podróży po Europie odwiedziliśmy wiele pięknych miast i zabytków."
        ru: "Во время путешествия по Европе мы посетили много красивых городов и памятников старины."
        source: { kind: tatoeba, id: 12453958 }
      - pl: "W czasie podróży do Włoch zwiedził kilka miast słynnych ze swego piękna, jak na przykład Neapol czy Florencję."
        ru: "Во время своей поездки по Италии он посетил несколько городов, прославившихся их красотой, таких, например, как Неаполь или Флоренция."
        source: { kind: tatoeba, id: 711036 }
  - id: journeys
    ru: "podróże — путешествия"
    examples:
      - pl: "\"Podróże Guliwera\" zostały napisane przez słynnego angielskiego pisarza."
        ru: "\"Путешествия Гулливера\" были написаны известным английским писателем."
        source: { kind: tatoeba, id: 610239 }
      - pl: "Lubisz podróże?"
        ru: "Ты любишь путешествия?"
        source: { kind: translated, id: 6328140 }
      - pl: "Podróże kształcą."
        ru: "Путешествия просвещают."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Слово разбирается прозрачно: po + droga «дорога», буквально «по дороге». Русское «путешествие» от «путь» собрано по той же логике, только от другого корня." }
  - { kind: government, text: "w podróż «в путешествие» — винительный; z podróży «из поездки» — родительный; w podróży «в пути» — предложный; przed podróżą «перед поездкой» — творительный." }
  - { kind: usage, text: "Podróże kształcą — «Путешествия просвещают», ходовая поговорка." }
  - { kind: usage, text: "Ходовые сочетания: podróż poślubna «свадебное путешествие», podróż służbowa «командировка», biuro podróży «турагентство»." }
collocations:
  - { pl: "podróż poślubna", ru: "свадебное путешествие" }
  - { pl: "podróż służbowa", ru: "командировка" }
  - { pl: "z podróży", ru: "из поездки" }
  - { pl: "biuro podróży", ru: "турагентство" }
family:
  - { pl: "droga", ru: "дорога", relation: root }
  - { pl: "podróżować", ru: "путешествовать", relation: derived }
  - { pl: "podróżnik", ru: "путешественник", relation: derived }
  - { pl: "wyjazd", ru: "отъезд", relation: root }
etymology: "po + droga «дорога» — буквально «по дороге». Русское «путешествие» от «путь» собрано по той же логике."
memory: "podróż — «путешествие», и разбирается оно прозрачно: po + droga, буквально «по дороге», как русское «путешествие» от «пути». Управление меняется по смыслу: w podróż «в путешествие» с винительным, z podróży «из поездки» с родительным, w podróży «в пути» с предложным. И поговорка: Podróże kształcą."
idioms:
  - { pl: "podróż poślubna", ru: "свадебное путешествие" }
  - { pl: "podróż służbowa", ru: "командировка" }
  - { pl: "Podróże kształcą", ru: "путешествия просвещают" }
formExamplesSkip:
