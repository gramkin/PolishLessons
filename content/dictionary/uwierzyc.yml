# review
id: uwierzyc
format: 2
lemma: "uwierzyć"
rank: 360
pos: verb
aspect: perf
aspectPair: wierzyc
pron: { cyr: "уве́жыць" }
senses:
  - id: believe-someone
    ru: "поверить кому-либо"
    examples:
      - pl: "On nie uwierzył Maryi."
        ru: "Он не поверил Мэри."
        source: { kind: tatoeba, id: 13360937 }
      - pl: "I kto ci teraz uwierzy?"
        ru: "И кто тебе теперь поверит?"
        source: { kind: tatoeba, id: 1348798 }
      - pl: "Uwierzcie mi, chcę wam pomóc."
        ru: "Поверьте мне, я хочу вам помочь."
        source: { kind: tatoeba, id: 13660065 }
  - id: believe-in
    ru: "поверить во что-либо"
    examples:
      - pl: "Nie mogłem uwierzyć w to co się działo."
        ru: "Я не мог поверить в то, что происходило."
        source: { kind: tatoeba, id: 3421142 }
      - pl: "Tylko nienormalny by w coś takiego uwierzył."
        ru: "В это только ненормальный поверил бы."
        source: { kind: tatoeba, id: 13785921 }
      - pl: "Znam was od półtorej godziny, a Tomka całe życie. Komu myślisz że uwierzę?"
        ru: "Я Вас знаю полтора часа, а Тома - всю жизнь. Как Вы думаете, кому я поверю?"
        source: { kind: tatoeba, id: 13787754 }
notes:
  - { kind: usage, text: "Совершенный вид к wierzyć, и управление то же: uwierzyć komuś «поверить кому-то» (дательный) и uwierzyć w coś «поверить во что-то» (винительный)." }
  - { kind: usage, text: "Uwierz mi — «Поверь мне»; nie mogę w to uwierzyć — «не могу в это поверить»." }
  - { kind: usage, text: "nie do uwierzenia — «невероятно», как готовое восклицание." }
collocations:
  - { pl: "uwierz mi", ru: "поверь мне" }
  - { pl: "nie do uwierzenia", ru: "невероятно" }
  - { pl: "trudno uwierzyć", ru: "трудно поверить" }
  - { pl: "uwierzyć w siebie", ru: "поверить в себя" }
etymology: "Из u- + wierzyć, от wiara «вера», праславянское *věra; то же гнездо, что русские «вера», «поверить»."
memory: "uwierzyć — совершенный вид к wierzyć, и управление то же: uwierzyć komuś и uwierzyć w coś. А Nie do uwierzenia! значит «Невероятно!»."
idioms:
  - { pl: "uwierz mi", ru: "поверь мне" }
  - { pl: "nie do uwierzenia", ru: "невероятно" }
  - { pl: "uwierzyć w kogoś", ru: "поверить в кого-то" }
