# review
id: pieniadz
format: 2
lemma: "pieniądz"
rank: 195
pos: noun
pron: { cyr: "пе́нёндз" }
senses:
  - id: money
    ru: "деньги (обычно во множественном: pieniądze)"
    examples:
      - pl: "To są pieniądze."
        ru: "Это деньги."
        source: { kind: tatoeba, id: 12832979 }
      - pl: "Nie mamy pieniędzy."
        ru: "У нас нет денег."
        source: { kind: tatoeba, id: 2403096 }
      - pl: "Brak mi pieniędzy."
        ru: "У меня недостаточно денег."
        source: { kind: tatoeba, id: 768680 }
  - id: coin
    ru: "деньга, денежная единица (единственное число)"
    note: "В отличие от русского, у слова есть и единственное число."
    examples:
      - pl: "Pieniądz nie śmierdzi."
        ru: "Деньги не пахнут."
        source: { kind: tatoeba, id: 369697 }
      - pl: "To stary pieniądz z dziewiętnastego wieku."
        ru: "Это старая монета девятнадцатого века."
        source: { kind: authored }
      - pl: "Pieniądz rządzi światem."
        ru: "Деньги правят миром."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Русское «деньги» существует только во множественном числе, а польское слово имеет и единственное: pieniądz «денежная единица». В быту говорят pieniądze." }
  - { kind: usage, text: "Родительный множественного — pieniędzy: Nie mam pieniędzy «У меня нет денег»." }
  - { kind: usage, text: "zarabiać pieniądze — «зарабатывать деньги»; wydawać pieniądze — «тратить деньги»." }
collocations:
  - { pl: "nie mam pieniędzy", ru: "у меня нет денег" }
  - { pl: "zarabiać pieniądze", ru: "зарабатывать деньги" }
  - { pl: "duże pieniądze", ru: "большие деньги" }
  - { pl: "czas to pieniądz", ru: "время — деньги" }
etymology: "Праславянское *pěnędzь, заимствованное из древнегерманского *panningaz (ср. немецкое Pfennig); в русском тот же корень дал устаревшее «пенязь»."
memory: "В отличие от русского, слово имеет единственное число: pieniądz «денежная единица». Обычные «деньги» — pieniądze, а «нет денег» — nie ma pieniędzy."
idioms:
  - { pl: "czas to pieniądz", ru: "время — деньги" }
  - { pl: "spać na pieniądzach", ru: "купаться в деньгах" }
  - { pl: "wyrzucać pieniądze w błoto", ru: "бросать деньги на ветер" }
formExamplesSkip:
  - { form: "pieniądzu", cell: "Звательный", reason: "звательный падеж: для неодушевлённого существительного он практически не употребляется" }
