# review
id: hulac
format: 2
lemma: "hulać"
rank: 2273
pos: verb
aspect: imperf
pron: { cyr: "ху́ляць" }
senses:
  - id: revel
    ru: "гулять, кутить"
    examples:
      - pl: "Hulali do białego rana."
        ru: "Они гуляли до белого утра."
        source: { kind: authored }
      - pl: "Lubi hulać na weselach."
        ru: "Он любит кутить на свадьбах."
        source: { kind: authored }
      - pl: "Hulamy, póki młodzi."
        ru: "Гуляем, пока молоды."
        source: { kind: authored }
  - id: howl
    ru: "гулять, свистеть (о ветре)"
    examples:
      - pl: "Wiatr hulał po pustych ulicach."
        ru: "Ветер гулял по пустым улицам."
        source: { kind: authored }
      - pl: "Po strychu hulał przeciąg."
        ru: "По чердаку гулял сквозняк."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Два употребления: о людях — «кутить, веселиться», о ветре — «гулять, свистеть». Оба совпадают с русским «гулять»." }
  - { kind: false-friend, text: "Русское «гулять» в нейтральном смысле «ходить» — это spacerować. hulać всегда о размашистом веселье." }
  - { kind: government, text: "Непереходный; где — po с предложным." }
  - { kind: usage, text: "Отсюда hulanka «гулянка» и поговорка Hulaj dusza, piekła nie ma «Гуляй душа, ада нет». В корпусе слово не встречается." }
collocations:
  - { pl: "hulaj dusza", ru: "гуляй душа" }
  - { pl: "wiatr hula", ru: "ветер гуляет" }
etymology: "Вероятно звукоподражательное; ср. русское «гулять», «гульба»."
memory: "hulać — «кутить», а о ветре «гулять, свистеть». Нейтральное «гулять пешком» — spacerować. Отсюда поговорка Hulaj dusza, piekła nie ma."
idioms:
  - { pl: "hulaj dusza", ru: "гуляй душа" }
