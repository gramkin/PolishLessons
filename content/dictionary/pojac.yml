# review
id: pojac
format: 2
lemma: "pojąć"
rank: 994
pos: verb
aspect: perf
pron: { cyr: "по́йонць" }
senses:
  - id: grasp
    ru: "постичь, понять (книжное)"
    examples:
      - pl: "Niełatwo pojąć jego teorię."
        ru: "Его теорию нелегко постичь."
        source: { kind: translated, id: 966863 }
      - pl: "Ten inteligentny chłopak pojął zasady geometrii."
        ru: "Этот смышлёный мальчик постиг основы геометрии."
        source: { kind: translated, id: 921645 }
      - pl: "Pojmiesz wartość czasu dopiero wtedy, gdy ci go zabraknie."
        ru: "Ты поймёшь цену времени только тогда, когда его тебе не хватит."
        source: { kind: translated, id: 1007431 }
  - id: cannot-grasp
    ru: "nie móc pojąć — не мочь взять в толк"
    examples:
      - pl: "Trudno mi pojąć kryptowalutę."
        ru: "Мне трудно понять криптовалюту."
        source: { kind: translated, id: 12147069 }
      - pl: "Nie mogliśmy pojąć jej logiki."
        ru: "Мы не могли постичь её логику."
        source: { kind: translated, id: 3752521 }
      - pl: "Musiało upłynąć sporo lat, abym w pełni pojął znaczenie nauczania Mistrza."
        ru: "Должно быть, прошло немало лет, прежде чем я вполне постиг смысл учения Мастера."
        source: { kind: translated, id: 13786686 }
  - id: take-wife
    ru: "pojąć za żonę — взять в жёны (устаревшее)"
    note: "Старое значение «взять»: оно и объясняет странные формы будущего pojmę, pojmiesz."
    examples:
      - pl: "Pojął ją za żonę."
        ru: "Он взял её в жёны."
        source: { kind: authored }
      - pl: "Pojmę cię za żonę."
        ru: "Я возьму тебя в жёны."
        source: { kind: authored }
      - pl: "Pojął za żonę córkę sąsiada."
        ru: "Он взял в жёны дочь соседа."
        source: { kind: authored }
notes:
  - { kind: register, text: "Книжный глагол. В обычной речи «понять» — это zrozumieć. Pojąć звучит возвышенно и чаще всего встречается в отрицании: nie mogę pojąć «не могу взять в толк»." }
  - { kind: usage, text: "Будущее время нерегулярное: основа меняется с poję- на pojm-, отсюда pojmę, pojmiesz, pojmie. То же гнездо, что у pojmować «постигать»." }
  - { kind: usage, text: "Отглагольное существительное pojęcie «понятие» отделилось настолько, что живёт своей жизнью и разобрано в отдельной карточке: Nie mam pojęcia «Понятия не имею»." }
  - { kind: usage, text: "Старое значение «взять» сохранилось в обороте pojąć za żonę «взять в жёны» — его можно встретить в литературе и церковном языке." }
collocations:
  - { pl: "nie mogę pojąć", ru: "не могу взять в толк" }
  - { pl: "trudno pojąć", ru: "трудно постичь" }
  - { pl: "pojąć sens", ru: "постичь смысл" }
  - { pl: "pojąć za żonę", ru: "взять в жёны" }
family:
  - { pl: "pojmować", ru: "постигать", relation: aspect }
  - { pl: "pojęcie", ru: "понятие", relation: derived, id: pojecie }
  - { pl: "pojętny", ru: "понятливый", relation: derived }
etymology: "Приставка po- + jąć «взять», праславянское *jęti. Буквально «взять умом» — русское «понять» собрано ровно из тех же частей, это прямые родственники."
memory: "pojąć — книжное «постичь», буквально «взять умом»: po- + jąć, как русское «понять». В живой речи говорят zrozumieć, а pojąć чаще в отрицании: nie mogę pojąć. Будущее нерегулярное: pojmę, pojmiesz."
idioms:
  - { pl: "nie mogę pojąć", ru: "не могу взять в толк" }
  - { pl: "nie do pojęcia", ru: "уму непостижимо" }
  - { pl: "pojąć za żonę", ru: "взять в жёны" }
formExamplesSkip:
  - { form: "pojęcie", reason: "отглагольное существительное «понятие» давно отделилось от глагола и разобрано в отдельной карточке (ранг 701)" }
  - { form: "pojęcia", reason: "отглагольное существительное «понятие» разобрано в отдельной карточке: там же оборот nie mam pojęcia" }
  - { form: "pojęciem", reason: "отглагольное существительное «понятие» разобрано в отдельной карточке (ранг 701)" }
  - { form: "pojęciu", reason: "отглагольное существительное «понятие» разобрано в отдельной карточке (ранг 701)" }
  - { form: "pojęci", reason: "мужско-личная форма страдательного причастия: постигают мысль или смысл, а не людей, поэтому форма не употребляется" }
