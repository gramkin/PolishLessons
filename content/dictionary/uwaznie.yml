# review
id: uwaznie
format: 2
lemma: "uważnie"
rank: 2561
pos: adv
pron: { cyr: "ува́жне" }
senses:
  - id: attentively
    ru: "внимательно"
    examples:
      - pl: "Słuchał uważnie, nie przerywając."
        ru: "Он слушал внимательно, не перебивая."
        source: { kind: authored }
      - pl: "Przeczytaj uważnie całą umowę."
        ru: "Прочитай внимательно весь договор."
        source: { kind: authored }
      - pl: "Uważnie obejrzała każdą stronę."
        ru: "Она внимательно осмотрела каждую страницу."
        source: { kind: authored }
  - id: carefully
    ru: "осторожно, аккуратно"
    examples:
      - pl: "Niósł pudło uważnie, żeby nic nie stłuc."
        ru: "Он нёс коробку осторожно, чтобы ничего не разбить."
        source: { kind: authored }
      - pl: "Stąpaj uważniej, tu jest ślisko."
        ru: "Ступай осторожнее, тут скользко."
        source: { kind: authored }
notes:
  - { kind: usage, text: "У НАРЕЧИЯ ВСЕГО ТРИ ФОРМЫ, И ЭТО ВСЯ ПАРАДИГМА. UWAŻNIE, UWAŻNIEJ, NAJUWAŻNIEJ — положительная, сравнительная и превосходная степень, и больше наречие ни по чему не изменяется: ни по родам, ни по числам, ни по падежам. Русское «внимательно — внимательнее — внимательнее всего» устроено так же, только превосходная у нас описательная, а у поляка своя форма с приставкой naj-." }
  - { kind: usage, text: "Прилагательное, от которого наречие образовано, — UWAŻNY «внимательный», а глагол в этом гнезде двузначен. UWAŻAĆ значит и «считать, полагать» (uważam, że masz rację «я считаю, что ты прав»), и «быть осторожным» (uważaj! «осторожно!»). Второе значение русскому «уважать» совсем чуждо, а именно на него похоже слово по виду." }
  - { kind: false-friend, text: "UWAŻAĆ — НЕ «УВАЖАТЬ». Похожи до обмана, но «уважать» по-польски SZANOWAĆ, а uważać значит «считать» или «беречься». Наречие uważnie идёт за вторым смыслом: внимательно, с осторожностью. Запомнить легко через окрик UWAŻAJ! — это «осторожно!», а никак не «уважай!»." }
collocations:
  - { pl: "słuchać uważnie", ru: "слушать внимательно" }
  - { pl: "czytać uważnie", ru: "читать внимательно" }
  - { pl: "patrzeć uważniej", ru: "смотреть внимательнее" }
family:
  - { pl: "uważny", ru: "внимательный", relation: root }
  - { pl: "uważać", ru: "считать; беречься", relation: root, id: uwazac }
  - { pl: "uwaga", ru: "внимание; замечание", relation: root, id: uwaga }
etymology: "От uważny, а то от UWAGA «внимание», где корень тот же, что в русском «важный», «вага» — праславянское *vaga «вес». Обратить внимание значило когда-то «придать вес». Отсюда и польское uważać «считать»: взвешивать в уме. Русское «уважать» выросло из того же корня, но пошло к почтению, а польское — к вниманию и осторожности."
memory: "Три формы и всё: uważnie, uważniej, najuważniej. И не путай корень: uważać это «считать» или «беречься», а «уважать» будет szanować. Окрик Uważaj! значит «осторожно!»."
idioms:
  - { pl: "uważaj na siebie", ru: "береги себя" }
  - { pl: "słuchać jednym uchem, a patrzeć uważnie", ru: "слушать вполуха, но смотреть в оба" }
