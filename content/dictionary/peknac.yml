        ru: "Я сейчас лопну от гордости."
        source: { kind: authored }
notes:
  - { kind: usage, text: "В прошедшем времени суффикс -ną- выпадает: PĘKŁ, pękła, pękło, pękli, pękły. Формы «pęknął» не существует. Сравните с przesunąć, где суффикс остаётся: przesunął, przesunęła. Оба глагола на -nąć, а прошедшее устроено по-разному, и предсказать это по инфинитиву нельзя. То же касается деепричастия: здесь PĘKŁSZY, а там przesunąwszy." }
  - { kind: usage, text: "Глагол непереходный: трескается сам предмет, а не кто-то его трескает. Поэтому PĘKNIĘTY — не страдательное причастие, а результативное прилагательное: pęknięta rura, pęknięty ekran. По-русски здесь стоит действительное причастие «треснувший», «лопнувший», а не «треснутый». Польский на -ty передаёт результат состояния, и это один из немногих случаев, когда непереходный глагол такую форму всё-таки имеет." }
  - { kind: register, text: "О людях этот глагол говорят в переносном смысле, и очень часто: PĘKNĄĆ ZE ŚMIECHU «лопнуть со смеху», pęknąć z zazdrości, pęknąć z dumy, pęknąć z ciekawości. Именно поэтому у него живут все личные формы — pękłam, pękliśmy, pęknę. Разговорное pęknięty о человеке значит «чокнутый»: on jest lekko pęknięty." }
collocations:
  - { pl: "pęknąć ze śmiechu", ru: "лопнуть со смеху" }
  - { pl: "pęknięta rura", ru: "лопнувшая труба" }
  - { pl: "pęknąć z zazdrości", ru: "лопнуть от зависти" }
family:
  - { pl: "pękać", ru: "трескаться", relation: aspect }
  - { pl: "pęknięcie", ru: "трещина", relation: derived }
  - { pl: "pękaty", ru: "пузатый", relation: derived }
etymology: "Корень звукоподражательный, праславянский *pęk- — попытка передать звук лопающегося и трескающегося. От него же польские pękać, pęknięcie «трещина» и pękaty «пузатый», то есть раздутый до предела. Русский построил своё слово тем же способом, но от другого звука: «лопнуть» подражает хлопку. Два языка пришли к одному значению одинаковым путём, выбрав разные шумы."
memory: "Прошедшее без -ną-: pękł, а не «pęknął» — в отличие от przesunął. И о человеке только переносно: pęknąć ze śmiechu."
idioms:
  - { pl: "pęknąć ze śmiechu", ru: "лопнуть со смеху" }
  - { pl: "serce pęka", ru: "сердце разрывается" }
formExamplesSkip:
  - { form: "pęknięto", reason: "Безличная форма на -to подразумевает невысказанного деятеля-человека: zrobiono, powiedziano. У pęknąć деятеля нет вовсе — это непереходный глагол изменения состояния, единственный участник которого сам предмет, который трескается. Подавлять в такой конструкции нечего, поэтому осмысленного предложения с этой формой не построить." }
