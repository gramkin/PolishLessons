        source: { kind: authored }
  - id: burst
    ru: "лопнуть (от смеха, зависти, гордости)"
    examples:
      - pl: "Pękł ze śmiechu, kiedy usłyszał tę historię."
        ru: "Он лопнул со смеху, когда услышал эту историю."
