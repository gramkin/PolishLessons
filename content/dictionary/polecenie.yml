  - id: command-computer
    ru: "команда (компьютерная); рекомендация"
    examples:
      - pl: "Pokazać ci użyteczne ukryte polecenie?"
        ru: "Показать тебе полезную скрытую команду?"
        source: { kind: translated, id: 442896 }
      - pl: "Muszę się podporządkować jego poleceniu."
        ru: "Я должен подчиниться его распоряжению."
        source: { kind: translated, id: 364805 }
notes:
  - { kind: government, text: "По распоряжению кого-л. — na polecenie kogoś, с родительным. Выполнять распоряжения — wykonywać polecenia, винительный." }
  - { kind: false-friend, text: "От polecić «поручить, порекомендовать», корень lecieć? Нет — корень тот же, что в zlecenie «поручение». Отсюда второе значение: list polecający «рекомендательное письмо», а list polecony — «заказное письмо»." }
  - { kind: usage, text: "В технике polecenie значит «команда»: wiersz poleceń «командная строка»." }
  - { kind: usage, text: "Средний род: to polecenie, tego polecenia. Родительный мн. — poleceń." }
collocations:
  - { pl: "wykonywać polecenia", ru: "выполнять распоряжения" }
  - { pl: "na polecenie kogoś", ru: "по распоряжению кого-л." }
etymology: "От polecić «поручить, порекомендовать»; родня zlecenie «поручение»."
memory: "polecenie — «распоряжение», а в технике «команда»: wiersz poleceń «командная строка». По распоряжению — na polecenie kogoś, с родительным."
