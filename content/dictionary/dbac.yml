# review
id: dbac
format: 2
lemma: "dbać"
rank: 1245
pos: verb
aspect: imperf
pron: { cyr: "дбаць" }
senses:
  - id: care-for
    ru: "заботиться о ком-то или чём-то — dbać o coś"
    examples:
      - pl: "Ona dba o moje zdrowie."
        ru: "Она заботится о моём здоровье."
        source: { kind: translated, id: 892371 }
      - pl: "Należy dbać o siebie."
        ru: "Нужно заботиться о себе."
        source: { kind: translated, id: 635073 }
      - pl: "Trzeba dbać o zdrowie."
        ru: "Нужно заботиться о здоровье."
        source: { kind: translated, id: 959266 }
  - id: not-care
    ru: "nie dbać o coś — быть безразличным к чему-то"
    examples:
      - pl: "Nie dbam o sławę."
        ru: "Мне нет дела до славы."
        source: { kind: translated, id: 891806 }
      - pl: "Nie dbam o to co ludzie mówią."
        ru: "Мне нет дела до того, что говорят люди."
        source: { kind: translated, id: 892373 }
      - pl: "Mój ojciec zupełnie nie dba o pieniądze."
        ru: "Мой отец совершенно не думает о деньгах."
        source: { kind: translated, id: 1353369 }
  - id: take-care
    ru: "dbaj o siebie — береги себя"
    examples:
      - pl: "Dbaj o siebie."
        ru: "Береги себя."
        source: { kind: translated, id: 561580 }
      - pl: "Dbaj o zdrowie."
        ru: "Береги здоровье."
        source: { kind: translated, id: 12360187 }
      - pl: "Obiecuję, że będę o ciebie dbał."
        ru: "Обещаю, что буду о тебе заботиться."
        source: { kind: translated, id: 967045 }
notes:
  - { kind: government, text: "dbać o coś «заботиться о чём-то» — предлог o с винительным падежом. Это главное, что стоит запомнить: o zdrowie, o siebie, o dzieci." }
  - { kind: usage, text: "С отрицанием значение смещается: nie dbam o to значит «мне это безразлично», а не «я не забочусь»." }
  - { kind: usage, text: "Dbaj o siebie! — обычное прощание, «Береги себя!»." }
  - { kind: usage, text: "Вид несовершенный; совершенный — zadbać. Отглагольное существительное — dbanie «забота», рядом стоит dbałość «заботливость»." }
collocations:
  - { pl: "dbać o siebie", ru: "заботиться о себе" }
  - { pl: "dbać o zdrowie", ru: "заботиться о здоровье" }
  - { pl: "nie dbać o coś", ru: "быть безразличным к чему-то" }
etymology: "Праславянское *dъbati «заботиться». Прямого русского родственника у слова нет, зато есть чешское dbát с тем же значением."
memory: "dbać o coś — «заботиться о чём-то», всегда с предлогом o и винительным: dbać o zdrowie. С отрицанием смысл меняется: nie dbam o to «мне это безразлично». И запомните прощание Dbaj o siebie! «Береги себя!»."
idioms:
  - { pl: "dbaj o siebie", ru: "береги себя" }
  - { pl: "dbać o zdrowie", ru: "заботиться о здоровье" }
  - { pl: "nie dbać o nic", ru: "ни о чём не заботиться" }
