# review
id: jak-sie-masz
format: 2
lemma: "jak się masz?"
rank: 5719
pos: interj
pron: { cyr: "як сье маш" }
senses:
  - id: how-are-you
    ru: "как дела?, как поживаешь?"
    examples:
      - pl: "Cześć, jak się masz?"
        ru: "Привет, как дела?"
        source: { kind: authored }
      - pl: "Jak się masz po tej chorobie?"
        ru: "Как ты после этой болезни?"
        source: { kind: authored }
      - pl: "Zapytał, jak się masz."
        ru: "Он спросил, как у тебя дела."
        source: { kind: authored }
      - pl: "Jak się masz, stary przyjacielu?"
        ru: "Как поживаешь, старый друг?"
        source: { kind: authored }
      - pl: "Nie zapytał nawet, jak się masz."
        ru: "Он даже не спросил, как у тебя дела."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Вопрос на «ты». Вежливая форма — jak się pan ma? или jak się pani ma?" }
  - { kind: usage, text: "Буквально «как себя имеешь»: mieć się значит «поживать, чувствовать себя» — возвратной конструкции такого рода в русском нет." }
  - { kind: government, text: "Глагол mieć с się и наречием jak. Клитика się обычно идёт перед глаголом, но может уходить и в конец: jak się masz или jak masz się." }
  - { kind: false-friend, text: "Это не «как ты имеешь»: в обороте mieć się глагол значит «чувствовать себя», а дословный перевод сбивает с толку." }
collocations:
  - { pl: "jak się masz?", ru: "как дела?" }
  - { pl: "jak się pan ma?", ru: "как вы поживаете? (вежливо)" }
family:
  - { pl: "mieć", ru: "иметь", relation: root }
  - { pl: "mieć się", ru: "поживать, чувствовать себя", relation: derived }
etymology: "Старая формула «как себя имеешь»: jak «как», się «себя» и masz — второе лицо от mieć «иметь». Та же конструкция лежит в немецком wie geht es dir и французском comment ca va."
memory: "jak się masz? — буквально «как себя имеешь?». Польский спрашивает о самочувствии через mieć się, а не через «быть», как русское «как дела»."
idioms:
  - { pl: "jak się masz?", ru: "как дела?" }
