# review
id: obejsc
format: 2
lemma: "obejść"
rank: 4659
pos: verb
pron: { cyr: "о́бэйсьць" }
senses:
  - id: walk-around
    ru: "обойти (кругом)"
    examples:
      - pl: "Obeszliśmy jezioro dookoła."
        ru: "Мы обошли озеро кругом."
        source: { kind: authored }
      - pl: "Obszedł dom i zajrzał przez okno."
        ru: "Он обошёл дом и заглянул в окно."
        source: { kind: authored }
      - pl: "Obejdź kałużę, bo zamoczysz buty."
        ru: "Обойди лужу, а то промочишь ботинки."
        source: { kind: authored }
  - id: circumvent
    ru: "обойти (запрет, правило)"
    examples:
      - pl: "Próbował obejść przepisy."
        ru: "Он пытался обойти правила."
        source: { kind: authored }
      - pl: "Firma obeszła zakaz przez zagraniczną spółkę."
        ru: "Фирма обошла запрет через иностранную компанию."
        source: { kind: authored }
  - id: do-without
    ru: "с SIĘ — обойтись (без чего-то); обойтись (с кем-то)"
    examples:
      - pl: "Obejdę się bez kawy."
        ru: "Я обойдусь без кофе."
        source: { kind: authored }
      - pl: "Obeszła się z nim bardzo łagodnie."
        ru: "Она обошлась с ним очень мягко."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "OBEJŚĆ — «обойти», как в русском, и OBEJŚĆ SIĘ — «обойтись»: OBEJŚĆ SIĘ BEZ POMOCY. Но несовершенное OBCHODZIĆ ещё значит «праздновать» и «касаться»: CO CIĘ TO OBCHODZI? — «тебе какое дело?»." }
  - { kind: usage, text: "Сорок одна форма. Прошедшее с E-вставкой: OBSZEDŁ, но OBESZŁA, OBESZLI. Будущее: OBEJDĘ, OBEJDZIESZ, повелительное OBEJDŹ. OBEJŚCIE — ещё и «двор, усадьба», и «обходной путь». Несовершенный вид — OBCHODZIĆ." }
  - { kind: government, text: "Что — винительный: OBEJŚĆ DOM, PRZEPISY. С SIĘ — BEZ с родительным: OBEJŚĆ SIĘ BEZ SAMOCHODU; с кем — Z с творительным: OBEJŚĆ SIĘ Z KIMŚ ŹLE." }
  - { kind: pronunciation, text: "Читается «о́бэйсьць»: JŚĆ — «йсьць», ударение на первом слоге. OBEJDĘ — «обэ́йдэ», OBSZEDŁ — «о́бшэду»." }
  - { kind: register, text: "Нейтральное слово. OBEJŚĆ PRZEPISY — газетное, с оттенком хитрости. OBEJDZIE SIĘ! — разговорное «обойдётся!», то есть «не получишь»." }
collocations:
  - { pl: "obejść jezioro", ru: "обойти озеро" }
  - { pl: "obejść przepisy", ru: "обойти правила" }
  - { pl: "obejść się bez czegoś", ru: "обойтись без чего-то" }
family:
  - { pl: "iść", ru: "идти", relation: root, id: isc }
  - { pl: "rozejść", ru: "разойтись", relation: derived, id: rozejsc }
  - { pl: "obchodzić", ru: "обходить; праздновать", relation: aspect, id: obchodzic }
etymology: "Приставка OB- «об-» плюс IŚĆ «идти», праславянское *jьti. Русское «обойти», «обойтись» — то же строение и почти те же значения."
memory: "Obejść — обойти: obeszliśmy jezioro. Obejść przepisy — обойти правила. Obejść się bez — обойтись без. Читается «о́бэйсьць»."
idioms:
  - { pl: "obejdzie się!", ru: "обойдёшься!, перебьёшься!" }
