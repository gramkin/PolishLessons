  - id: ashes
    ru: "прах, пепелище"
    examples:
      - pl: "Szkoła spaliła się na popiół."
        ru: "Школа сгорела дотла."
        source: { kind: translated, id: 2246857 }
      - pl: "Bugenwilla rośnie, czekając, aż popioły mojego ciała przemienią się w kwiaty."
        ru: "Бугенвиллея растёт, ожидая, когда прах моего тела превратится в цветы."
        source: { kind: translated, id: 12314803 }
notes:
  - { kind: government, text: "Мужской неодушевлённый; родительный — popiołu. Обратите внимание на чередование ó/o: popiół, но popiołu." }
  - { kind: false-friend, text: "Русское «пепел» и польское popiół — родственники, но в польском появилась приставка po-. Корень тот же, что в «палить», «пепелище»." }
  - { kind: usage, text: "Spalić się na popiół «сгореть дотла» — устойчивый оборот, буквально «сгореть в пепел»." }
  - { kind: usage, text: "Środa Popielcowa «Пепельная среда» — начало Великого поста; от того же корня popielniczka «пепельница»." }
