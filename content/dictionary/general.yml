etymology: "Из латинского generalis «главный, старший»: средневековый capitaneus generalis — «главный капитан». Русское «генерал» пришло тем же путём."
memory: "generał — «генерал». Звание называют творительным: był generałem. А конечное ł звучит как русское «у»: гэнэра́у."
