lemma: "generał"
rank: 1022
pos: noun
pron: { cyr: "гэнэра́у" }
senses:
  - id: general
    ru: "генерал"
    examples:
      - pl: "Generał dokonał przeglądu wojsk."
        ru: "Генерал провёл смотр войск."
        source: { kind: translated, id: 1348724 }
      - pl: "Generał wydał rozkaz ataku na miasto."
        ru: "Генерал отдал приказ атаковать город."
        source: { kind: translated, id: 737282 }
      - pl: "Generał jest wysoko postawionym oficerem."
        ru: "Генерал — высокопоставленный офицер."
        source: { kind: translated, id: 12450179 }
  - id: rank
    ru: "stopień generała — звание генерала"
    examples:
      - pl: "Osiągnął stopień generała."
        ru: "Он достиг звания генерала."
        source: { kind: translated, id: 12450173 }
      - pl: "Został awansowany na generała."
        ru: "Его произвели в генералы."
        source: { kind: translated, id: 511560 }
      - pl: "W czasie II wojny światowej był generałem."
        ru: "Во время Второй мировой войны он был генералом."
        source: { kind: translated, id: 352856 }
  - id: orders
    ru: "generał rozkazał — генерал приказал"
    examples:
      - pl: "Generał skoncentrował wojska w Paryżu."
        ru: "Генерал сосредоточил войска в Париже."
        source: { kind: translated, id: 1349205 }
      - pl: "Generał rozkazał mu stawić się w dowództwie."
        ru: "Генерал приказал ему явиться в штаб."
        source: { kind: translated, id: 440429 }
      - pl: "Generał wydał nowy rozkaz."
        ru: "Генерал отдал новый приказ."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Звание называют творительным падежом: był generałem «он был генералом», został generałem «стал генералом»." }
  - { kind: usage, text: "awansować na generała «получить звание генерала» — предлог na с винительным, как и в русском «произвести в генералы»." }
  - { kind: usage, text: "Из латинского generalis «главный, старший»: в средневековых армиях capitaneus generalis был «главным капитаном»." }
  - { kind: usage, text: "Конечное ł произносится как русское «у» в слове «пауза»: generał звучит примерно как «гэнэра́у»." }
collocations:
  - { pl: "zostać generałem", ru: "стать генералом" }
