notes:
  - { kind: pronunciation, text: "Гласная e в последнем слоге беглая: CZWARTEK, но CZWARTKU, czwartkiem, czwartki. Она держится только там, где за ней нет окончания. Тот же механизм работает в piątek — piątku, wtorek — wtorku и marzec — marca, так что все названия дней и месяцев на -ek и -ec ведут себя одинаково." }
  - { kind: usage, text: "На вопрос «когда» ставится винительный с предлогом w: W CZWARTEK, и форма совпадает с именительным. Это совпадает с русским «в четверг», так что тут подвоха нет. Регулярность выражается множественным, тоже винительным: W CZWARTKI значит «по четвергам», а не «в четверги»." }
collocations:
  - { pl: "w czwartek", ru: "в четверг" }
  - { pl: "w każdy czwartek", ru: "каждый четверг" }
  - { pl: "do czwartku", ru: "до четверга" }
family:
  - { pl: "czwarty", ru: "четвёртый", relation: root, id: czwarty }
  - { pl: "cztery", ru: "четыре", relation: root, id: cztery }
  - { pl: "czwartkowy", ru: "четверговый", relation: derived }
etymology: "От CZWARTY «четвёртый»: четвёртый день недели, если считать с понедельника. Русский «четверг» построен ровно так же, от «четвёртый», и оба слова восходят к праславянскому *četvrьtъkъ. Совпадает и счёт: в обоих языках неделя начинается с понедельника, поэтому четвёртым днём оказывается один и тот же."
memory: "Беглая e: czwartek, но do czwartku. А «по четвергам» будет w czwartki, винительный множественного."
idioms:
  - { pl: "tłusty czwartek", ru: "жирный четверг, день пончиков" }
  - { pl: "Wielki Czwartek", ru: "Великий четверг" }
