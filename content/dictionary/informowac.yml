notes:
  - { kind: government, text: "Кого — винительный, о чём — предлог O с МЕСТНЫМ падежом: INFORMOWAĆ KOGOŚ O CZYMŚ. Русский строит так же, с предлогом «о» и предложным падежом, так что конструкция переносится целиком: INFORMUJEMY PAŃSTWA O ZMIANIE — «сообщаем вам об изменении». Вместо предлога бывает союз ŻE: INFORMUJĘ, ŻE TERMIN MINĄŁ. А вот обычная ошибка — поставить дательный по образцу «сообщать кому-то»: по-польски нужен винительный, INFORMOWAĆ KOGOŚ, а не KOMU." }
  - { kind: pronunciation, text: "Глагол класса на -OWAĆ, и настоящее время у него на -UJ-: INFORMOWAĆ даёт INFORMUJĘ, INFORMUJESZ, INFORMUJE, INFORMUJĄ. Правило то же, что в карточке SPAKOWAĆ, и для заимствованных глаголов оно особенно полезно, потому что их в польском много: TELEFONOWAĆ, ORGANIZOWAĆ, KONTROLOWAĆ — все ведут себя одинаково. Русскому помогает своё «-овать» даёт «-ую»: «информировать» — «информирую»." }
  - { kind: false-friend, text: "Слово заимствованное и значение у него то же, но форма чуть иная, и на письме это ловит: по-польски INFORMOWAĆ, без -ир-, тогда как русский говорит «информИРовать». Так же устроен целый ряд: ORGANIZOWAĆ против «организовать», KONTROLOWAĆ против «контролировать», REZERWOWAĆ против «резервировать». Правило простое: там, где русский вставляет -ир-/-изир-, польский обходится без него." }
  - { kind: usage, text: "Совершенная пара — POINFORMOWAĆ, и она нужна для однократного извещения: POINFORMOWAŁEM GO WCZORAJ. Несовершенное INFORMOWAĆ описывает либо повторяющееся, либо длящееся сообщение, и именно оно стоит в официальных формулах: UPRZEJMIE INFORMUJEMY, ŻE… — «любезно сообщаем, что…». Существительное INFORMACJA значит и «информация», и «справочная»: INFORMACJA KOLEJOWA — «железнодорожная справочная»." }
collocations:
  - { pl: "informować kogoś o czymś", ru: "информировать кого-то о чём-то" }
  - { pl: "uprzejmie informujemy", ru: "любезно сообщаем" }
  - { pl: "informacja kolejowa", ru: "железнодорожная справочная" }
family:
  - { pl: "poinformować", ru: "сообщить, известить", relation: aspect, id: poinformowac }
  - { pl: "informacja", ru: "информация; справочная", relation: derived, id: informacja }
  - { pl: "informator", ru: "справочник; информатор", relation: derived }
etymology: "Из латинского INFORMARE «придавать форму, наставлять», от FORMA — через западноевропейские языки, в польский скорее всего через немецкий и французский. Русский взял то же слово, но в форме с -ир-, по немецкому образцу на -ieren: «информировать». Польский же присоединил свой родной суффикс -OWAĆ, и получилось INFORMOWAĆ. Эта разница касается не одного слова, а всего разряда заимствованных глаголов, и запомнить её стоит один раз: польскому -OWAĆ отвечает русское -ировать."
memory: "Польский обходится без -ир-: informować, organizować, kontrolować — против «информировать», «организовать», «контролировать». И управление как в русском: informować kogoś o czymś."
idioms:
  - { pl: "uprzejmie informujemy", ru: "любезно сообщаем (официальная формула)" }
  - { pl: "informacja kolejowa", ru: "железнодорожная справочная" }
