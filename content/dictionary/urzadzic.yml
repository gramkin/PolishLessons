# review
id: urzadzic
format: 2
lemma: "urządzić"
rank: 1982
pos: verb
aspect: perf
pron: { cyr: "ужо́ндзиць" }
senses:
  - id: organise
    ru: "устроить, организовать (мероприятие)"
    examples:
      - pl: "Poszli urządzić piknik nad jeziorem."
        ru: "Они пошли устроить пикник у озера."
        source: { kind: translated, id: 525400 }
      - pl: "Zamierzają urządzić imprezę dla Sam."
        ru: "Они собираются устроить вечеринку для Сэм."
        source: { kind: translated, id: 2979615 }
      - pl: "Przyjaciele urządzili mi obchody urodzin."
        ru: "Друзья устроили мне празднование дня рождения."
        source: { kind: translated, id: 415356 }
      - pl: "Urządziliśmy przyjęcie z okazji jego 70. urodzin."
        ru: "Мы устроили приём по случаю его семидесятилетия."
        source: { kind: translated, id: 760359 }
      - pl: "On urządził imprezę w zeszły tydzień."
        ru: "Он устроил вечеринку на прошлой неделе."
        source: { kind: translated, id: 12904928 }
      - pl: "Urządziła mu piekło."
        ru: "Она устроила ему ад."
        source: { kind: tatoeba, id: 1459953 }
  - id: furnish
    ru: "обустроить, обставить"
    examples:
      - pl: "Mieszkanie zostało urządzone w stylu wiktoriańskim."
        ru: "Квартира была обставлена в викторианском стиле."
        source: { kind: translated, id: 3584743 }
      - pl: "Urządziłeś się już w nowym domu?"
        ru: "Ты уже обустроился в новом доме?"
        source: { kind: translated, id: 364542 }
      - pl: "Musiałem wyjechać z Warszawy i urządzić się gdzieś indziej."
        ru: "Мне пришлось уехать из Варшавы и устроиться где-то ещё."
        source: { kind: translated, id: 1846213 }
  - id: device
    ru: "urządzenie — устройство, прибор"
    examples:
      - pl: "Urządzenie jest zepsute."
        ru: "Прибор сломан."
        source: { kind: translated, id: 366124 }
      - pl: "Kto wynalazł to urządzenie?"
        ru: "Кто изобрёл это устройство?"
        source: { kind: translated, id: 983332 }
      - pl: "To urządzenie produkuje elektryczność."
        ru: "Это устройство производит электричество."
        source: { kind: translated, id: 355815 }
notes:
  - { kind: usage, text: "Совершенный вид. Несовершенная пара urządzać в реестрах отсутствует, поэтому в карточке она только упомянута." }
  - { kind: usage, text: "Отглагольное существительное urządzenie значит «устройство, прибор», а не «устройство» в смысле организации: to urządzenie jest zepsute «этот прибор сломан»." }
  - { kind: usage, text: "Возвратное urządzić się значит «обустроиться, устроиться на новом месте»." }
  - { kind: usage, text: "Разговорное urządzić komuś piekło — «устроить кому-то ад», ровно как по-русски." }
collocations:
  - { pl: "urządzić przyjęcie", ru: "устроить приём" }
  - { pl: "urządzić się", ru: "обустроиться" }
  - { pl: "urządzenie jest zepsute", ru: "прибор сломан" }
etymology: "u- + rządzić «править, управлять», от rząd «ряд, порядок». Русское «устроить» собрано от другого корня, но с той же приставкой и той же идеей приведения в порядок."
memory: "urządzić — «устроить» и «обставить»: urządzić przyjęcie, urządzić mieszkanie. А urządzenie — это «прибор, устройство», вещь."
idioms:
  - { pl: "urządzić przyjęcie", ru: "устроить приём" }
  - { pl: "urządzić się", ru: "обустроиться" }
  - { pl: "urządzić komuś piekło", ru: "устроить кому-то ад" }
