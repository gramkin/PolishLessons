notes:
  - { kind: usage, text: "Согласный t переходит в ć дважды: PRODUCENCIE в местном и звательном, PRODUCENCI в мужской личной форме множественного. Так же ведут себя KOMENDANT и ASYSTENT, и у всех слов на -ent эта пара форм устроена одинаково. Запоминать их стоит вместе: звательная нужна в обращении, множественная — в любом тексте о промышленности." }
  - { kind: usage, text: "У слова есть уничижительная форма PRODUCENTY, отличная от обычной множественной PRODUCENCI, и теперь по этой категории можно сказать правило. Уничижительная форма берёт окончание не мужское личное: у komendant это -ty при -ci, у muzyk это -ki при -cy, у producent это -ty при -ci — всюду она отдельная. А у dziennikarz, ochroniarz и rodzic мужская личная форма сама кончается на -e, и уничижительная сливается с ней в одном написании. То есть форма всегда одна и та же по способу, а совпадает она или нет, зависит от того, чем кончается обычное множественное." }
  - { kind: false-friend, text: "Русский делит это слово на два, польский — нет. PRODUCENT значит и «производитель» — producent mebli, producent samochodów, — и «продюсер» фильма или сериала. Русское «продуцент» существует, но живёт в биологии и о людях не говорится вовсе, так что подставлять его нельзя. Выбор перевода подсказывает только область: завод и товар дают «производителя», кино и музыка — «продюсера»." }
collocations:
  - { pl: "producent samochodów", ru: "производитель автомобилей" }
  - { pl: "producent filmowy", ru: "кинопродюсер" }
