family:
  - { pl: "produkt", ru: "продукт, товар", relation: root, id: produkt }
  - { pl: "produkować", ru: "производить", relation: root }
  - { pl: "produkcja", ru: "производство", relation: derived }
etymology: "Из латинского PRODUCENS, причастия от producere «выводить вперёд» — того же глагола, что дал PRODUKT и PRODUKCJA, разобранные в партии 224. Русский взял из того же корня «продукт», «продукцию» и «продуцента», но человека у станка назвал по-своему — «производителем», калькой с латыни, а человека при кино — «продюсером», уже через английское producer. Польский обошёлся одним словом на оба случая."
memory: "Два русских слова в одном: и производитель, и продюсер. t даёт ć дважды: producencie, producenci. А уничижительное producenty отдельно от producenci."
