# review
id: otworzyc
format: 2
lemma: "otworzyć"
rank: 281
pos: verb
aspect: perf
pron: { cyr: "отво́жыць" }
senses:
  - id: open
    ru: "открыть (дверь, окно, глаза)"
    examples:
      - pl: "Otwórz drzwi."
        ru: "Открой дверь."
        source: { kind: tatoeba, id: 6602603 }
      - pl: "Otwórz oczy."
        ru: "Открой глаза."
        source: { kind: tatoeba, id: 359961 }
      - pl: "Muszę otworzyć okno."
        ru: "Я должен открыть окно."
        source: { kind: tatoeba, id: 589685 }
  - id: opened
    ru: "открыть (заведение, тетрадь); otworzyć się — открыться"
    note: "Причастие otwarty значит «открытый»: Sklep jest otwarty."
    examples:
      - pl: "Drzwi były otwarte."
        ru: "Дверь была открыта."
        source: { kind: tatoeba, id: 3802823 }
      - pl: "Otwórzcie zeszyty."
        ru: "Откройте тетради."
        source: { kind: tatoeba, id: 2290017 }
      - pl: "Otworzyła drzwi."
        ru: "Она открыла дверь."
        source: { kind: tatoeba, id: 998634 }
notes:
  - { kind: usage, text: "У глагола два прошедших времени: обычное otworzył и книжное, более старое otwarł. В живой речи говорят otworzył." }
  - { kind: usage, text: "Причастие — otwarty «открытый», а не otworzony: Sklep jest otwarty, drzwi są otwarte. Форма otworzony встречается редко." }
  - { kind: usage, text: "Несовершенный вид — otwierać: Otwieram sklep o ósmej." }
  - { kind: usage, text: "Корень -wrzeć тот же, что в русских «отворить», «затворить», «дверь»." }
collocations:
  - { pl: "otworzyć drzwi", ru: "открыть дверь" }
  - { pl: "otworzyć oczy", ru: "открыть глаза" }
  - { pl: "sklep jest otwarty", ru: "магазин открыт" }
  - { pl: "otworzyć okno", ru: "открыть окно" }
etymology: "Из старопольского otewrzeć, где корень -wrzeć «запирать, затворять»; тот же корень, что в русских «отворить», «затворить», «дверь»."
memory: "otworzyć — «открыть», и у него два прошедших: обычное otworzył и книжное otwarł. А причастие — otwarty «открытый»: Sklep jest otwarty."
idioms:
  - { pl: "otworzyć oczy", ru: "открыть глаза" }
  - { pl: "otworzyć swoje serce", ru: "открыть своё сердце" }
  - { pl: "z otwartymi ramionami", ru: "с распростёртыми объятиями" }
