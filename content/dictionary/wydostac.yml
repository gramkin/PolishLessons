# review
id: wydostac
format: 2
lemma: "wydostać"
rank: 1186
pos: verb
aspect: perf
pron: { cyr: "выдо́стаць" }
senses:
  - id: get-out
    ru: "wydostać się — выбраться, выйти"
    examples:
      - pl: "Nie mogłem się wydostać."
        ru: "Я не мог выбраться."
        source: { kind: translated, id: 3034137 }
      - pl: "Tom wydostał się z więzienia."
        ru: "Том выбрался из тюрьмы."
        source: { kind: translated, id: 3100194 }
      - pl: "Potrzebuję twojej pomocy, żeby się stąd wydostać."
        ru: "Мне нужна твоя помощь, чтобы отсюда выбраться."
        source: { kind: translated, id: 4179296 }
  - id: extract
    ru: "вытащить, извлечь кого-то откуда-то"
    examples:
      - pl: "Odważny strażak wydostał młodą kobietę z płonącego domu."
        ru: "Отважный пожарный вытащил молодую женщину из горящего дома."
        source: { kind: translated, id: 2246726 }
      - pl: "Dym wydostał się przez komin."
        ru: "Дым выходил через трубу."
        source: { kind: translated, id: 4769083 }
  - id: how-out
    ru: "jak się stąd wydostaniemy — как нам отсюда выбраться"
    examples:
      - pl: "Jak się stąd wydostaniemy?"
        ru: "Как мы отсюда выберемся?"
        source: { kind: translated, id: 3990236 }
      - pl: "Myślałem, że nigdy nie wydostaniemy się żywi z płonącego budynku."
        ru: "Я думал, мы никогда не выберемся живыми из горящего здания."
        source: { kind: translated, id: 3786137 }
notes:
  - { kind: usage, text: "Почти всегда идёт с się: wydostać się «выбраться». Без się глагол значит «вытащить, извлечь кого-то»." }
  - { kind: government, text: "wydostać się Z czegoś «выбраться из чего-то» — предлог z с родительным падежом, как в русском." }
  - { kind: usage, text: "Совершенный вид; несовершенный — wydostawać się. Приставка wy- плюс dostać «достать, получить»." }
  - { kind: usage, text: "О дыме, воде и газе глагол значит «выходить наружу, просачиваться»: Dym wydostał się przez komin." }
collocations:
  - { pl: "wydostać się stąd", ru: "выбраться отсюда" }
  - { pl: "wydostać się z więzienia", ru: "выбраться из тюрьмы" }
  - { pl: "wydostać kogoś", ru: "вытащить кого-то" }
family:
  - { pl: "wydostawać", ru: "выбираться (несовершенный вид)", relation: aspect }
  - { pl: "dostać", ru: "достать, получить", relation: root, id: dostac }
etymology: "Приставка wy- плюс dostać «достать, получить» — буквально «выдостать». Русское «выбраться» собрано от «брать», но приставка та же."
memory: "wydostać się — «выбраться», почти всегда с się и с предлогом z: wydostać się z więzienia. Без się глагол значит «вытащить кого-то», а о дыме и воде — «выходить наружу»."
idioms:
  - { pl: "wydostać się stąd", ru: "выбраться отсюда" }
  - { pl: "wydostać kogoś", ru: "вытащить кого-то" }
