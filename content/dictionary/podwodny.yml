  - { pl: "nadwodny", ru: "надводный", relation: derived }
etymology: "Сложение из приставки POD- и WODA, слова праславянского и того же, что русская «вода». Постройка прозрачна в обоих языках и совпадает до последней части, поэтому слово узнаётся без усилий. Из того же гнезда идут WODNY «водный» и NADWODNY «надводный», собранные так же просто. Вся трудность здесь не в прилагательном, а в существительном при нём: поляк ставит рядом OKRĘT, корабль, там где русский говорит «лодка»."
memory: "Подводный, и собрано точно как русское слово: pod плюс woda. Главное — запомнить сочетание okret podwodny, то есть «подводный корабль»: поляк называет её кораблём, потому что okret это военный корабль. Lodz podwodna тоже говорят, и это ближе к русскому. Читается «подво́дны». Не путайте слитное podwodny с раздельным pod woda «под водой», где творительный падеж."
idioms:
  - { pl: "okręt podwodny", ru: "подводная лодка" }
formExamplesSkip:
  - { form: "podwodni", reason: "именительный множественного для мужчин-людей; прилагательное относительное и людей не описывает, водолазов называют nurkowie" }
