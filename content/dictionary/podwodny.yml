notes:
  - { kind: false-friend, text: "Само прилагательное отвечает русскому «подводный» точно, частями: POD и WODA. Расходятся языки в названии лодки. По-польски говорят OKRĘT PODWODNY, то есть «подводный корабль», потому что OKRĘT это военный корабль, а не лодка. Форма ŁÓDŹ PODWODNA тоже существует и ближе к русскому, но в официальной речи и в новостях звучит именно OKRĘT PODWODNY." }
  - { kind: usage, text: "В таблице одиннадцать форм, но живых десять. Одиннадцатая — PODWODNI, именительный множественного для мужчин-людей, и её не употребляют: прилагательное относительное, оно описывает предмет или работу, а не человека. Водолазов называют NURKOWIE, существительным. Примеров к этой форме в карточке поэтому нет. Прилагательное стоит после существительного: OKRĘT PODWODNY, ŚWIAT PODWODNY." }
  - { kind: government, text: "Различайте слитное прилагательное и раздельное сочетание: PODWODNY это «подводный», а POD WODĄ, в два слова, значит «под водой», с творительным падежом. В подводном мире — W ŚWIECIE PODWODNYM, местный падеж, и обратите внимание, что ŚWIAT даёт ŚWIECIE, с чередованием. Без подводного снаряжения — BEZ SPRZĘTU PODWODNEGO, предлог BEZ с родительным." }
  - { kind: pronunciation, text: "Читается «подво́дны», три слога, ударение на предпоследнем. Буква D перед W не оглушается, поэтому начало слова это «подв», а не «потв». Конечная Y даёт «ы», и слово кончается на «ны». В женском роде PODWODNA это «подво́дна», в среднем PODWODNE — «подво́днэ», а PODWODNĄ звучит «подво́днон»." }
  - { kind: register, text: "Слово нейтральное, из языка новостей, географии и спорта. В новостях это OKRĘT PODWODNY, в передачах о природе — ŚWIAT PODWODNY и JASKINIA PODWODNA. У водолазов — PRACE PODWODNE и SPRZĘT PODWODNY. В технике говорят KABEL PODWODNY о кабеле по дну моря и TUNEL PODWODNY о туннеле под водой." }
collocations:
  - { pl: "świat podwodny", ru: "подводный мир" }
