# review
id: suma
format: 2
lemma: "suma"
rank: 1324
pos: noun
pron: { cyr: "су́ма" }
senses:
  - id: sum
    ru: "сумма, итог"
    examples:
      - pl: "Suma osiągnęła 10 dolarów."
        ru: "Сумма достигла десяти долларов."
        source: { kind: translated, id: 737222 }
      - pl: "Suma zawiera podatek."
        ru: "Сумма включает налог."
        source: { kind: translated, id: 1648781 }
      - pl: "Łączna suma sięga 2 tys. dolarów."
        ru: "Общая сумма достигает двух тысяч долларов."
        source: { kind: translated, id: 929327 }
  - id: amount
    ru: "сумма денег"
    examples:
      - pl: "Wpłacił dużą sumę."
        ru: "Он внёс крупную сумму."
        source: { kind: translated, id: 613034 }
      - pl: "Tomek odziedziczył dużą sumę pieniędzy."
        ru: "Томек унаследовал крупную сумму денег."
        source: { kind: translated, id: 8901632 }
      - pl: "Skąd wziąłeś tak pokaźną sumę pieniędzy?"
        ru: "Откуда ты взял такую внушительную сумму денег?"
        source: { kind: translated, id: 674671 }
  - id: in-sum
    ru: "w sumie — в общем, в итоге, всего"
    examples:
      - pl: "Ile to jest w sumie?"
        ru: "Сколько это всего?"
        source: { kind: translated, id: 8501558 }
      - pl: "Mamy w sumie tylko sto euro."
        ru: "У нас всего только сто евро."
        source: { kind: translated, id: 2309779 }
      - pl: "On jest w sumie dżentelmenem."
        ru: "Он, в общем-то, джентльмен."
        source: { kind: translated, id: 744097 }
notes:
  - { kind: usage, text: "W sumie — «в общем, в итоге, всего». Один из самых частых оборотов языка: Ile to jest w sumie? «Сколько это всего?»" }
  - { kind: usage, text: "Разговорно w sumie значит ещё и «в общем-то, пожалуй»: W sumie to nie chciałem «Я, в общем-то, и не хотел»." }
  - { kind: false-friend, text: "Форма sumo в текстах — это японская борьба сумо, а не звательный падеж от suma." }
  - { kind: usage, text: "Четвёртое значение слова — католическая месса: suma «главная воскресная месса»." }
collocations:
  - { pl: "w sumie", ru: "в общем, всего" }
  - { pl: "duża suma", ru: "крупная сумма" }
  - { pl: "suma pieniędzy", ru: "сумма денег" }
etymology: "Из латинского summa «высшая, итоговая величина», от summus «высший». Русская «сумма» пришла тем же путём."
memory: "suma — «сумма». Но чаще всего встретится оборот w sumie «в общем, всего»: Ile to jest w sumie? Разговорно он значит ещё «в общем-то». Осторожно: sumo в текстах — японская борьба."
idioms:
  - { pl: "w sumie", ru: "в общем, всего" }
  - { pl: "duża suma", ru: "крупная сумма" }
  - { pl: "suma pieniędzy", ru: "сумма денег" }
