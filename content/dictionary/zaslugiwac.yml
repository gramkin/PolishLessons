# review
id: zaslugiwac
format: 2
lemma: "zasługiwać"
rank: 1114
pos: verb
aspect: imperf
pron: { cyr: "заслуги́ваць" }
senses:
  - id: deserve
    ru: "заслуживать"
    examples:
      - pl: "Tom na to zasługuje."
        ru: "Том этого заслуживает."
        source: { kind: translated, id: 3972645 }
      - pl: "Zasługują na coś lepszego."
        ru: "Они заслуживают лучшего."
        source: { kind: tatoeba, id: 3084469 }
      - pl: "Zasługujesz na nagrodę."
        ru: "Ты заслуживаешь награды."
        source: { kind: translated, id: 589381 }
  - id: respect
    ru: "zasługiwać na szacunek — заслуживать уважения"
    examples:
      - pl: "Ten polityk zasługuje na szacunek."
        ru: "Этот политик заслуживает уважения."
        source: { kind: translated, id: 368967 }
      - pl: "Starsi ludzie zasługują na szacunek."
        ru: "Пожилые люди заслуживают уважения."
        source: { kind: translated, id: 4827984 }
  - id: past
    ru: "заслуживал, был достоин (прошедшее время)"
    examples:
      - pl: "Tom zasługiwał na karę, którą otrzymał."
        ru: "Том заслуживал наказания, которое получил."
        source: { kind: translated, id: 13616101 }
      - pl: "Mary nie zasługiwała na twoje zaufanie."
        ru: "Мэри не заслуживала твоего доверия."
        source: { kind: translated, id: 9686072 }
notes:
  - { kind: government, text: "Главное отличие от русского — падеж: zasługiwać NA coś, предлог na с винительным. Русское «заслуживать уважения» идёт с родительным без предлога, польское — zasługiwać na szacunek." }
  - { kind: usage, text: "Несовершенный вид к zasłużyć. Корень — służyć «служить», как и в русском «за-служивать»." }
  - { kind: usage, text: "Инфинитив zasługiwać в корпусе почти не встречается: слово живёт в личных формах — zasługuje, zasługujesz, zasługują." }
  - { kind: usage, text: "Производное zasłużony значит «заслуженный», а zasługa — «заслуга»." }
collocations:
  - { pl: "zasługiwać na szacunek", ru: "заслуживать уважения" }
  - { pl: "zasługiwać na uwagę", ru: "заслуживать внимания" }
  - { pl: "zasługiwać na karę", ru: "заслуживать наказания" }
family:
  - { pl: "zasłużyć", ru: "заслужить", relation: aspect }
  - { pl: "zasługa", ru: "заслуга", relation: root }
  - { pl: "zasłużony", ru: "заслуженный", relation: derived }
etymology: "Приставка za- плюс służyć «служить» — «выслужить, заработать». Русское «заслуживать» собрано ровно из тех же частей."
memory: "zasługiwać — «заслуживать», но падеж другой: zasługiwać NA coś, предлог na с винительным. По-русски «заслуживать уважения» — родительный, по-польски zasługiwać na szacunek."
idioms:
