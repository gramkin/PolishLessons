etymology: "От DOWODZIĆ, а то от WODZIĆ «водить», с приставкой DO-; корень тот же, что в русских «водить», «вождь», «воевода». Исходный смысл — довести до конца, и из него выросли оба современных значения: довести войско до цели, то есть командовать, и довести мысль до вывода, то есть доказать. Русский развёл эти смыслы по разным корням, оставив «вождя» и «воеводу» при водительстве, а доказательство построив от «казать», то есть показывать. Поэтому польское гнездо кажется русскоязычному противоречивым: DOWODZIĆ BRYGADĄ и DOWODZIĆ SWOJEJ RACJI — один глагол в двух далёких значениях, различаемых только падежом. Суффикс -TWO в DOWÓDZTWO отвечает русскому -СТВО и образует названия учреждений и состояний."
memory: "Корень wódz = русский «вождь», и dowodzić значит «командовать» — но тот же глагол значит «доказывать». Отсюда dowód «доказательство» и dowód osobisty «удостоверение личности». Русский «довод» это argument, а не dowód. Суффикс -two = русское -ство (państwo, małżeństwo), родительный множественного без окончания: dowództw. Управление: objąć dowództwo (винительный), pod dowództwem (творительный), а глагол dowodzić brygadą — творительный, но dowodzić racji — родительный."
