notes:
  - { kind: false-friend, text: "Корень WÓDZ — это русский «вождь», и глагол DOWODZIĆ значит «командовать». Но тот же глагол значит и «доказывать», и в этом вся соль гнезда: DOWÓD по-польски «доказательство», DOWODY W SPRAWIE «доказательства по делу», DOWÓD OSOBISTY — «удостоверение личности», то есть документ, которым доказывают, кто ты. Русский построил «доказательство» от «казать», польский — от «вести»: доказать значит провести мысль от начала до конца. Поэтому DOWÓD нельзя читать как «довод» в русском смысле: русский «довод» это ARGUMENT, а польское DOWÓD — именно доказательство или документ." }
  - { kind: usage, text: "Девять форм, средний род, существительное на -TWO. Суффикс этот отвечает русскому -СТВО буквально: DOWÓDZTWO и «командование» по смыслу, но по строению — как MAŁŻEŃSTWO и «супружество», PAŃSTWO и «государство». Родительный множественного без окончания: DOWÓDZTW, с беглым нулём, как PAŃSTW и MAŁŻEŃSTW. Местный единственного — DOWÓDZTWIE. Слово двузначно и в единственном числе: может означать и саму власть командовать, и орган, который её осуществляет, — как русское «командование». Множественное употребляется только во втором значении, о нескольких штабах." }
  - { kind: government, text: "Принять командование — объект в винительном: OBJĄĆ DOWÓDZTWO. Под чьим командованием — предлог POD с творительным: POD DOWÓDZTWEM GENERAŁA, и русское управление то же. Передать командование кому — дательный: ODDAĆ DOWÓDZTWO OFICEROWI. Откуда пришёл приказ — предлог Z с родительным: Z DOWÓDZTWA OKRĘGU. Производный глагол DOWODZIĆ требует творительного в значении «командовать»: DOWODZIĆ BRYGADĄ, тогда как в значении «доказывать» он берёт винительный или придаточное с ŻE: DOWODZIĆ SWOJEJ RACJI, DOWODZIĆ, ŻE SIĘ MYLĄ." }
  - { kind: pronunciation, text: "Читается «дову́цтво», три слога, ударение на предпоследнем. Буква Ó читается как «у»: не «довоцтво», а «довуцтво» — та же буква, что в CÓRKA и MÓGŁ. Сочетание DZT произносится как «цт»: звонкое DZ оглушается перед глухим T, и вставлять между ними гласный нельзя. Конечное O — чистое «о». В местном падеже DOWÓDZTWIE сочетание TWIE даёт «тве»: «дову́цтве». В родительном множественного DOWÓDZTW слово кончается четырьмя согласными подряд: «дову́цтф»." }
collocations:
