# review
id: oprzec
format: 2
lemma: "oprzeć"
rank: 2013
pos: verb
aspect: perf
pron: { cyr: "о́пшэць" }
senses:
  - id: lean
    ru: "опереть, прислонить; опереться"
    examples:
      - pl: "Oparł się na łokciach."
        ru: "Он опёрся на локти."
        source: { kind: translated, id: 919199 }
      - pl: "Tom oparł się o ścianę."
        ru: "Том прислонился к стене."
        source: { kind: translated, id: 3961065 }
      - pl: "Oprzyj drabinę o ścianę."
        ru: "Прислони лестницу к стене."
        source: { kind: translated, id: 393335 }
  - id: base
    ru: "основать на чём-л. (обычно причастие oparty)"
    examples:
      - pl: "Ustawy oparte są na konstytucji."
        ru: "Законы основываются на конституции."
        source: { kind: tatoeba, id: 8669053 }
      - pl: "Ta opowieść jest oparta na faktach."
        ru: "Этот рассказ основан на фактах."
        source: { kind: translated, id: 936195 }
  - id: resist
    ru: "устоять, не поддаться (oprzeć się czemuś)"
    examples:
      - pl: "Nie mogłem się oprzeć."
        ru: "Я не мог устоять."
        source: { kind: translated, id: 2467068 }
notes:
  - { kind: usage, text: "Будущее время: oprę, oprzesz, oprze, oprzemy, oprzecie, oprą — глагол спрягается как przeć (prę, przesz, prze, prą). Повелительное — oprzyj, пожелательное — niech oprze, niech oprą." }
  - { kind: usage, text: "Совершенный вид; несовершенный — opierać." }
  - { kind: government, text: "Три разных управления: oprzeć coś o coś «прислонить что-л. к чему-л.» (винительный), oprzeć się na czymś «опереться на что-л.» (предложный), oprzeć się czemuś «устоять перед чем-л.» (дательный)." }
  - { kind: usage, text: "Причастие oparty «основанный» встречается чаще самого глагола: oparty na faktach «основанный на фактах»." }
  - { kind: false-friend, text: "Корень тот же, что в русском «опереть», «опора», «упереться»." }
  - { kind: government, text: "Основы у глагола две, и они не смешиваются: oprz- даёт будущее время и повелительное (oprę, oprzesz, oprzyj), а прошедшее строится на oparł- (oparł, oparła, oparli). Отглагольное существительное — oparcie, а не oprzenie." }
collocations:
  - { pl: "oprzeć się na", ru: "опереться на" }
  - { pl: "oparty na faktach", ru: "основанный на фактах" }
etymology: "o- + przeć «переть, давить»; ср. русское «опереть», «опора», «упереться»."
memory: "oprzeć — «опереть» и «устоять» сразу. Запомните три управления: oprzeć coś o coś (прислонить к), oprzeć się na czymś (опереться на), oprzeć się czemuś (устоять перед). Несовершенный вид — opierać."
idioms:
  - { pl: "nie móc się oprzeć", ru: "не устоять" }
  - { pl: "oparty na faktach", ru: "основанный на фактах" }
