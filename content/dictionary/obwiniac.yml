notes:
  - { kind: government, text: "Самое важное — управление, и оно расходится с русским. По-польски OBWINIAĆ KOGOŚ O COŚ: винительный падеж на человеке и предлог O с винительным на провинности. OBWINIAŁ MNIE O KŁAMSTWO значит «он обвинял меня во лжи». Русский же берёт предлог «в» с предложным падежом: «обвинять в краже» — OBWINIAĆ O KRADZIEŻ. Второй вариант, тоже живой: OBWINIAĆ KOGOŚ ZA COŚ, ближе к «винить за». Запомнить проще всего так: русское «в» здесь всегда становится польским O." }
  - { kind: usage, text: "Три слова на одно русское «обвинять», и они не взаимозаменяемы. WINIĆ — самое простое, бытовое: WINIĘ SIEBIE «виню себя». OBWINIAĆ — то же бытовое обвинение, но весомее, часто в разборе, на работе, в семье. OSKARŻAĆ — слово суда и прокурора, формальное обвинение. Отсюда и два существительных, оба застывшие как названия лиц: OBWINIONY — тот, кого привлекли в дисциплинарном или административном деле, а OSKARŻONY — подсудимый. Путать их в документе нельзя." }
  - { kind: usage, text: "Шестьдесят три формы, несовершенный переходный, и в отличие от POPEŁNIAĆ из прошлой партии здесь все одиннадцать страдательных причастий живые — включая мужскую личную форму множественного OBWINIANI. Причина простая: страдательному залогу нужно дополнение в винительном, и у OBWINIAĆ оно есть, да ещё и обозначает людей. Нельзя «совершить человека», зато обвинить человека можно. Основа одна на все формы: OBWINIAM, OBWINIA, OBWINIAJĄ, OBWINIAŁ, OBWINIANY." }
  - { kind: false-friend, text: "Корень общий с русским, а вот одна его ветка уводит далеко. WINA — это «вина», WINNY — «виновный», NIEWINNY — «невинный», всё как ожидается. Но тот же корень дал POWINIEN «должен»: исходно «виноват, обязан уплатить», откуда «обязан» и затем просто «должен». Так что POWINIENEM TO ZROBIĆ значит «я должен это сделать», а не «я виноват». Русское «повинность» и устаревшее «повинен» сохранили ту же связку, так что мостик есть, просто неочевидный." }
collocations:
  - { pl: "obwiniać kogoś o coś", ru: "обвинять кого-либо в чём-либо" }
  - { pl: "obwiniać siebie", ru: "винить себя" }
  - { pl: "obwiniać za wszystko", ru: "винить во всём" }
family:
  - { pl: "obwinić", ru: "обвинить", relation: aspect }
  - { pl: "wina", ru: "вина", relation: root, id: wina }
  - { pl: "winny", ru: "виновный", relation: derived, id: winny }
etymology: "Приставка ob- и WINA «вина», из праславянского *vina — то же слово, что русская «вина». Буквально «обложить виной, вменить вину кругом», и приставка ob- тут ровно та же, что в русском «обвинять». Гнездо большое и русскому понятное: WINIĆ «винить», ZAWINIĆ «провиниться», WINNY «виновный», NIEWINNY «невинный», PRZEWINIENIE «провинность». Из того же корня вышло и POWINIEN «должен», через значение «обязан уплатить виной»."
memory: "Русское «в» становится польским O: обвинять В краже — obwiniać O kradzież. А oskarżać — это суд, obwiniać — разбор на работе или в семье."
idioms:
