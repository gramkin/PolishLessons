# review
id: zdawac
format: 2
lemma: "zdawać"
rank: 755
pos: verb
aspect: imperf
pron: { cyr: "зда́ваць" }
senses:
  - id: realise
    ru: "zdawać sobie sprawę — отдавать себе отчёт, осознавать"
    note: "Самая частая конструкция с этим глаголом. Дословно «сдавать себе отчёт»."
    examples:
      - pl: "Zdaję sobie z tego sprawę."
        ru: "Я отдаю себе в этом отчёт."
        source: { kind: translated, id: 10586110 }
      - pl: "Zdajesz sobie sprawę z tego, że to głupota?"
        ru: "Ты отдаёшь себе отчёт, что это глупость?"
        source: { kind: translated, id: 6159632 }
      - pl: "Nie zdajesz sobie sprawy, jak się martwiłem."
        ru: "Ты не представляешь, как я волновался."
        source: { kind: translated, id: 768807 }
  - id: seem
    ru: "zdaje się — кажется; zdawać się być — казаться"
    note: "Безлично: zdaje się, że… «кажется, что…»."
    examples:
      - pl: "Zdaje się, że jest teraz bogaty."
        ru: "Кажется, он сейчас богат."
        source: { kind: tatoeba, id: 10747484 }
      - pl: "Żaba zdawała się martwą."
        ru: "Лягушка казалась мёртвой."
        source: { kind: tatoeba, id: 12759323 }
      - pl: "Zdaje się, że masz rację."
        ru: "Кажется, ты прав."
        source: { kind: translated, id: 627698 }
  - id: take-exam
    ru: "сдавать (экзамен)"
    note: "Несовершенный вид: zdawać egzamin «сдавать экзамен», совершенный zdać «сдать»."
    examples:
      - pl: "Zdawałem wczoraj egzamin."
        ru: "Я вчера сдавал экзамен."
        source: { kind: translated, id: 820859 }
      - pl: "Zdawaliśmy egzamin po angielsku."
        ru: "Мы сдавали экзамен по-английски."
        source: { kind: translated, id: 904479 }
      - pl: "Zdawałeś egzamin z matmy?"
        ru: "Ты сдавал экзамен по математике?"
        source: { kind: translated, id: 6541763 }
notes:
  - { kind: usage, text: "zdawać sobie sprawę z czegoś — «отдавать себе отчёт в чём-то», с предлогом z и родительным. Оборот очень частый: nie zdawałem sobie sprawy «я не представлял»." }
  - { kind: usage, text: "Безличное zdaje się «кажется» и zdawać się być «казаться» — второе по частоте употребление: Zdaje się, że masz rację." }
  - { kind: usage, text: "В значении «сдавать экзамен» вид различает результат: zdawać egzamin «сдавать», zdać egzamin «сдать». Русский различает так же." }
  - { kind: usage, text: "Ещё одно значение — «полагаться»: zdaję się na ciebie «я полагаюсь на тебя», с предлогом na и винительным." }
collocations:
  - { pl: "zdawać sobie sprawę", ru: "отдавать себе отчёт" }
  - { pl: "zdaje się", ru: "кажется" }
  - { pl: "zdawać egzamin", ru: "сдавать экзамен" }
  - { pl: "zdać się na kogoś", ru: "положиться на кого-то" }
family:
  - { pl: "zdać", ru: "сдать", relation: derived }
  - { pl: "zdanie", ru: "предложение; мнение", relation: derived }
  - { pl: "dawać", ru: "давать", relation: root }
etymology: "Приставка z- плюс dawać «давать», от праславянского *dati — то же слово, что русское «сдавать». Отсюда же zdanie «предложение; мнение»."
memory: "zdawać — «сдавать», но в живой речи чаще всего звучит в двух оборотах. Первый: zdawać sobie sprawę z czegoś «отдавать себе отчёт в чём-то» — дословно «сдавать себе отчёт», с z и родительным. Второй: безличное zdaje się «кажется» и zdawać się być «казаться». Собственно «сдавать экзамен» — третье по частоте: zdawać egzamin, а «сдать» будет zdać, ровно как в русском вид различает результат. И ещё zdać się na kogoś «положиться на кого-то»."
idioms:
  - { pl: "zdawać sobie sprawę", ru: "отдавать себе отчёт" }
  - { pl: "zdaje się", ru: "кажется" }
  - { pl: "zdać egzamin", ru: "сдать экзамен" }
