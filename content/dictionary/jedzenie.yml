etymology: "Отглагольное существительное от jeść «есть» — праславянского глагола, совпадающего с русским «есть». Суффикс -enie тот же, что русское «-ение», поэтому jedzenie это буквально «ядение»."
memory: "jedzenie — и «еда», и «приём пищи», ровно как в русском. От jeść плюс -enie: «ядение». Coś do jedzenia — «что-нибудь поесть»."
