notes:
  - { kind: government, text: "Средний род, отглагольное существительное от jeść: jedzenie, jedzenia, jedzeniu. После отрицания — родительный: nie ma jedzenia «еды нет»." }
  - { kind: usage, text: "Два значения, как у русского «еда»: сама пища (dobre jedzenie) и действие (przed jedzeniem «перед едой»)." }
  - { kind: usage, text: "Оборот coś do jedzenia «что-нибудь поесть» строится с do и родительным падежом." }
  - { kind: false-friend, text: "Суффикс -enie соответствует русскому «-ение», так что jedzenie буквально «ядение» — но переводится обычным словом «еда»." }
