# review
id: klocic
format: 2
lemma: "kłócić"
rank: 1778
pos: verb
pron: { cyr: "ку́циць" }
senses:
  - id: quarrel
    ru: "kłócić się — ссориться"
    examples:
      - pl: "Kłócę się z nim o drobiazgi."
        ru: "Я ссорюсь с ним из-за пустяков."
        source: { kind: authored }
      - pl: "Kłócili się o spadek dwa lata."
        ru: "Они ссорились из-за наследства два года."
        source: { kind: authored }
      - pl: "Nie kłóćcie się przy stole."
        ru: "Не ссорьтесь за столом."
        source: { kind: authored }
  - id: set-at-odds
    ru: "ссорить (кого-л. с кем-л.)"
    examples:
      - pl: "Kłócił braci przez lata."
        ru: "Он годами ссорил братьев."
        source: { kind: authored }
      - pl: "Kłóceni od dziecka bracia przestali rozmawiać."
        ru: "Поссоренные с детства братья перестали разговаривать."
        source: { kind: authored }
  - id: contradict
    ru: "kłócić się z czymś — противоречить чему-л."
    examples:
      - pl: "To kłóci się z faktami."
        ru: "Это противоречит фактам."
        source: { kind: authored }
      - pl: "Te dane kłócą się z raportem."
        ru: "Эти данные противоречат отчёту."
        source: { kind: authored }
notes:
  - { kind: government, text: "Две схемы, и обе стоит выучить целиком. Ссорить КОГО С КЕМ — винительный плюс z с творительным: kłócić brata Z siostrą. Ссориться С КЕМ ИЗ-ЗА ЧЕГО — z с творительным плюс O с ВИНИТЕЛЬНЫМ: kłócić się z nim O pieniądze. Вот это o и есть расхождение: по-русски ссорятся «ИЗ-ЗА денег», с предлогом «из-за» и родительным, а по-польски — o pieniądze, в винительном." }
  - { kind: usage, text: "Возвратная форма употребляется несравненно чаще прямой: kłócić się «ссориться» слышно постоянно, а kłócić kogoś «ссорить кого-то» — редко и обычно с упрёком. Поэтому и повелительные формы живут в возвратном виде: nie kłóćcie się. Обычное существительное для «ссоры» — kłótnia, а kłócenie называет само действие, стравливание людей." }
  - { kind: false-friend, text: "Прозрачного русского родственника у корня нет. Слово идёт от праславянского значения «взбалтывать, мутить»: сперва мутили воду, потом — отношения между людьми, отсюда «ссорить». Третье значение растёт из того же образа: если два утверждения «мутят» друг друга, значит противоречат. Подбирать похожее русское слово не стоит — его нет." }
collocations:
  - { pl: "kłócić się o pieniądze", ru: "ссориться из-за денег" }
  - { pl: "kłócić się z faktami", ru: "противоречить фактам" }
  - { pl: "kłócić kogoś z kimś", ru: "ссорить кого-л. с кем-л." }
family:
  - { pl: "kłótnia", ru: "ссора", relation: derived }
  - { pl: "pokłócić", ru: "поссорить", relation: aspect }
  - { pl: "kłótliwy", ru: "склочный, вздорный", relation: derived }
etymology: "Праславянский корень со значением «взбалтывать, мутить». Исходно мутили воду, затем — отношения: «мутить между людьми» и дало «ссорить». Из того же образа третье значение: два показания, которые друг друга мутят, противоречат друг другу. Прямого русского соответствия корень не имеет, зато производные прозрачны: kłótnia «ссора», kłótliwy «склочный»."
memory: "kłócić się — «ссориться», и возвратная форма главная: прямое kłócić kogoś значит «ссорить». Запомните предлог: ссорятся O pieniądze, в винительном, а не «из-за денег». И третий смысл: to się kłóci z faktami — «это противоречит фактам»."
idioms:
  - { pl: "kłócić się o byle co", ru: "ссориться из-за всякой ерунды" }
  - { pl: "to się kłóci z faktami", ru: "это противоречит фактам" }
