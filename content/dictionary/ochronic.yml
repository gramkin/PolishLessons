# review
id: ochronic
format: 2
lemma: "ochronić"
rank: 2205
pos: verb
pron: { cyr: "охро́ниць" }
senses:
  - id: shield
    ru: "защитить, уберечь"
    examples:
      - pl: "Parasol ochronił nas przed deszczem."
        ru: "Зонт защитил нас от дождя."
        source: { kind: authored }
      - pl: "Chciał ochronić dzieci przed prawdą."
        ru: "Он хотел уберечь детей от правды."
        source: { kind: authored }
  - id: preserve
    ru: "сохранить, сберечь"
    examples:
      - pl: "Ochronili stare drzewa przed wycinką."
        ru: "Они уберегли старые деревья от вырубки."
        source: { kind: authored }
      - pl: "Ustawa ma ochronić zabytki."
        ru: "Закон должен защитить памятники."
        source: { kind: authored }
      - pl: "Nic ich nie ochroniło przed mrozem."
        ru: "Ничто не защитило их от мороза."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "КОРЕНЬ ЗНАКОМЫЙ, ПРОСТО БЕЗ ПОЛНОГЛАСИЯ. Ochronić построено на chronić, а оно восходит к праславянскому *xorniti — тому самому корню, что дал русские «хранить» и «хоронить». Польское chron- против русского хорон-/хран- это обычное соответствие, уже знакомое по głowa/голова и droga/дорога. Значения разошлись: польское chronić значит «защищать», русское «хранить» — «беречь, держать». Зато существительное совпадает начисто: ochrona это «охрана», а ochroniarz — «охранник»." }
  - { kind: government, text: "Защищают КОГО — винительный падеж: ochronić dzieci, dom, zabytki. ОТ ЧЕГО — przed с ТВОРИТЕЛЬНЫМ: ochronić przed deszczem, przed mrozem, przed krytyką. Русский ставит здесь «от» с родительным, «защитить от дождя», так что падеж другой — przed deszczem. Ровно та же модель, что у ostrzegać przed czymś." }
  - { kind: usage, text: "Вид совершенный, несовершенная пара — chronić. Страдательное причастие ochroniony образовано по правилу «-ić даёт -ony», а мужско-личное множественное даёт ochronieni, как pomówieni и budzeni. Отглагольное существительное ochronienie встречается реже, чем простое ochrona «охрана, защита»." }
  - { kind: pronunciation, text: "ch звучит как х: «охро́ниць», ударение на предпоследнем слоге. В повелительном наклонении от основы остаётся только мягкость: ochroń, «о́хронь»." }
collocations:
  - { pl: "ochronić przed deszczem", ru: "защитить от дождя" }
  - { pl: "ochrona środowiska", ru: "охрана окружающей среды" }
  - { pl: "ochronić przed krytyką", ru: "оградить от критики" }
family:
  - { pl: "chronić", ru: "защищать, оберегать", relation: aspect, id: chronic }
  - { pl: "ochrona", ru: "охрана, защита", relation: derived, id: ochrona }
  - { pl: "ochroniarz", ru: "охранник", relation: derived }
  - { pl: "schronienie", ru: "укрытие, убежище", relation: derived }
etymology: "Приставка o- плюс chronić, из праславянского *xorniti «беречь, охранять». Русские продолжения того же корня — «хоронить» с полногласием и «хранить» в церковнославянской огласовке; польское chron- стоит без вставного гласного, как głowa против «головы». Отсюда ochrona «охрана», ochroniarz «охранник», schronienie «убежище» и schron «бункер»."
memory: "ochronić — «защитить, уберечь», и корень тот же, что в русских «хранить» и «хоронить», только без полногласия: chron- против хорон-. Существительное совпадает прямо: ochrona это «охрана». Падеж, однако, другой — ochronić przed czymś, с творительным, как и ostrzegać przed czymś."
idioms:
  - { pl: "ochronić przed deszczem", ru: "укрыть от дождя" }
  - { pl: "ochrona środowiska", ru: "охрана окружающей среды" }
