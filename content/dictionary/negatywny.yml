etymology: "Из латинского negativus, «отрицающий», от negare «отрицать, говорить нет». Прямой родственник — NEGACJA, «отрицание». А вот NEGOCJACJE, «переговоры», к нему не относятся, хотя и похожи: они от латинского negotium, «дело». Русское «негативный» пришло тем же путём, через французский."
memory: "Negatywny — и негативный, и отрицательный: negatywna opinia, negatywny wynik testu, negatywny bohater. Отрицательное число — ujemna. Читается «нэгаты́вны»."
idioms:
