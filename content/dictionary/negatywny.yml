notes:
  - { kind: false-friend, text: "Польское NEGATYWNY шире русского «негативный»: оно покрывает и русское «отрицательный». NEGATYWNA OPINIA — «отрицательный отзыв», NEGATYWNY WYNIK TESTU — «отрицательный результат теста», NEGATYWNY BOHATER — «отрицательный герой». Но в математике «отрицательное число» — LICZBA UJEMNA, а не NEGATYWNA: там своё слово." }
  - { kind: usage, text: "Сравнивается описательно: BARDZIEJ NEGATYWNY. Все одиннадцать форм живые. Форма для мужчин-людей NEGATYWNI нужна для героев книг и фильмов: NEGATYWNI BOHATEROWIE, «отрицательные персонажи». Противоположность — POZYTYWNY." }
  - { kind: government, text: "Негативно относиться к чему-то — BYĆ NEGATYWNIE NASTAWIONYM DO CZEGOŚ, DO с родительным. Негативный по отношению к кому-то — NEGATYWNY WOBEC KOGOŚ, WOBEC с родительным. Само прилагательное падежа не требует." }
  - { kind: pronunciation, text: "Читается «нэгаты́вны», четыре слога, ударение на предпоследнем. NE даёт твёрдое «нэ», TY — твёрдое «ты». Сравните с POZYTYWNY «позыты́вны»: те же суффикс и ударение." }
  - { kind: register, text: "Нейтральное слово, частое в журналистике, психологии и медицине. В разговоре скорее скажут ZŁY или SŁABY: ZŁA OPINIA, SŁABE RECENZJE. NEGATYWNY звучит чуть официальнее, но не канцелярски." }
