# review
id: podnosic
format: 2
lemma: "podnosić"
rank: 2625
pos: verb
pron: { cyr: "подно́сиць" }
senses:
  - id: lift
    ru: "поднимать"
    examples:
      - pl: "Dźwig podnosi kontener na statek."
        ru: "Кран поднимает контейнер на судно."
        source: { kind: authored }
      - pl: "Nie wolno podnosić tak ciężkich skrzyń."
        ru: "Нельзя поднимать такие тяжёлые ящики."
        source: { kind: authored }
      - pl: "Podnoszę rękę, kiedy chcę o coś zapytać."
        ru: "Я поднимаю руку, когда хочу о чём-то спросить."
        source: { kind: authored }
  - id: raise
    ru: "повышать (цены, голос)"
    examples:
      - pl: "Sklep podnosi ceny co miesiąc."
        ru: "Магазин повышает цены каждый месяц."
        source: { kind: authored }
      - pl: "Nie trzeba podnosić głosu, dobrze cię słyszę."
        ru: "Не надо повышать голос, я тебя хорошо слышу."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "PODNOSIĆ — это «поднимать», а не «подносить». Слова собраны из одинаковых частей, pod- и nosić, но разошлись: польское podnosić отрывает предмет от земли, русское «подносить» приближает его к кому-то. Русское «подносить» по-польски будет PODAWAĆ или PRZYNOSIĆ. Ошибка тем опаснее, что оба глагола уместны рядом с одним и тем же предметом." }
  - { kind: usage, text: "Вид несовершенный, пара к совершенному PODNIEŚĆ. Отсюда формы, которых у совершенного вида нет вовсе: действительное причастие PODNOSZĄCY, podnosząca, podnoszące с полным набором падежей, и деепричастие на -ąc — PODNOSZĄC. Зато нет формы на -wszy. Арифметика видна прямо в числе форм: у podnosić их 63, у совершенного umyć — 53, и разница ровно в этих одиннадцати." }
  - { kind: pronunciation, text: "В настоящем времени основа двоится: в первом лице единственного и третьем множественного стоит sz — PODNOSZĘ, PODNOSZĄ, а в середине парадигмы s — podnosisz, podnosi, podnosimy, podnosicie. Это обычное устройство глаголов на -ić. Повелительное наклонение мягкое: PODNOŚ, podnośmy, podnoście, с тем же ś, что в инфинитиве." }
collocations:
  - { pl: "podnosić rękę", ru: "поднимать руку" }
  - { pl: "podnosić ceny", ru: "повышать цены" }
  - { pl: "podnosić głos", ru: "повышать голос" }
family:
  - { pl: "podnieść", ru: "поднять", relation: aspect, id: podniesc }
  - { pl: "nosić", ru: "носить", relation: root, id: nosic }
  - { pl: "podnośnik", ru: "домкрат, подъёмник", relation: derived }
etymology: "Приставка pod- и глагол nosić, из праславянского *nositi — то же слово, что русское «носить». Части знакомые, а итог разный: польский увёл podnosić к движению вверх, русский оставил «подносить» при движении к кому-то. Русское «поднимать» собрано иначе, из «под» и старого «имать» «брать», поэтому совпадения тут и не могло быть."
memory: "podnosić — «поднимать», а «подносить» будет podawać. И причастие podnoszący бывает только у несовершенного вида, зато формы на -wszy у него нет."
idioms:
  - { pl: "podnosić na duchu", ru: "ободрять, поднимать дух" }
  - { pl: "podnosić larum", ru: "поднимать шум, бить тревогу" }
