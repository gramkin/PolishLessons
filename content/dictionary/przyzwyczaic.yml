# review
id: przyzwyczaic
format: 2
lemma: "przyzwyczaić"
rank: 2511
pos: verb
pron: { cyr: "пшызвыча́іць" }
senses:
  - id: accustom-someone
    ru: "приучить кого-л. к чему-л."
    examples:
      - pl: "Przyzwyczaił dzieci do porządku."
        ru: "Он приучил детей к порядку."
        source: { kind: authored }
      - pl: "Przyzwyczaj go do wczesnego wstawania."
        ru: "Приучи его рано вставать."
        source: { kind: authored }
  - id: get-used-to
    ru: "привыкнуть к чему-л."
    examples:
      - pl: "Przyzwyczaiłem się do nowego miasta."
        ru: "Я привык к новому городу."
        source: { kind: authored }
      - pl: "Trudno przyzwyczaić się do takiej ciszy."
        ru: "Трудно привыкнуть к такой тишине."
        source: { kind: authored }
  - id: habit
    ru: "привычка (отглаг.)"
    examples:
      - pl: "Przyzwyczajenie jest drugą naturą."
        ru: "Привычка — вторая натура."
        source: { kind: authored }
notes:
  - { kind: government, text: "ПРЕДЛОГ ДРУГОЙ, И ЭТО ГЛАВНОЕ. PRZYZWYCZAIĆ KOGOŚ DO CZEGOŚ — винительный на человека и DO плюс РОДИТЕЛЬНЫЙ на то, к чему приучают: przyzwyczaić dzieci DO porządku. Русский говорит «приучить к порядку», с дательным. То же у возвратного: przyzwyczaić się DO czegoś «привыкнуть к чему-то»." }
  - { kind: usage, text: "Корень здесь богатый и хорошо знакомый. ZWYCZAJ значит «обычай», NAWYK — «навык», а PRZYZWYCZAJENIE — «привычка». Все они из праславянского *vyk-, того же, что русские «обычай», «привычка», «навык» и «привыкнуть». Так что гнездо узнаётся целиком, хотя приставки разошлись." }
  - { kind: usage, text: "Основа меняет i на j между формами: инфинитив и прошедшее идут на przyzwyczai- (przyzwyczaił, przyzwyczaiłem), а страдательное причастие и существительное — на przyzwyczaj- (PRZYZWYCZAJONY, PRZYZWYCZAJENIE). Вид совершенный: есть przyzwyczaiwszy, форм на -ąc и -ący нет, несовершенная пара — przyzwyczajać." }
collocations:
  - { pl: "przyzwyczaić się do czegoś", ru: "привыкнуть к чему-л." }
  - { pl: "być przyzwyczajonym do", ru: "быть привыкшим к" }
  - { pl: "siła przyzwyczajenia", ru: "сила привычки" }
family:
  - { pl: "przyzwyczajać", ru: "приучать (несов.)", relation: aspect }
  - { pl: "zwyczaj", ru: "обычай", relation: root }
  - { pl: "nawyk", ru: "навык, привычка", relation: root }
etymology: "Приставки przy- и z- плюс корень wycz-/wyk-, из праславянского *vyknąti «привыкать». Тот же корень дал zwyczaj «обычай», nawyk «навык» и русские «обычай», «привычка», «навык», «привыкнуть». Приставки в двух языках разошлись, а гнездо осталось общим."
memory: "przyzwyczaić — «приучить», и предлог тут do с родительным: przyzwyczaić kogoś DO czegoś, а по-русски «к чему-то». Корень тот же, что в «обычае» и «привычке». Следи за основой: przyzwyczaił, но przyzwyczajony."
idioms:
  - { pl: "siła przyzwyczajenia", ru: "сила привычки" }
  - { pl: "przyzwyczajenie drugą naturą", ru: "привычка — вторая натура" }
