# review
id: smierc
format: 2
lemma: "śmierć"
rank: 236
pos: noun
pron: { cyr: "сьме́рьць" }
senses:
  - id: death
    ru: "смерть"
    examples:
      - pl: "Nie boję się śmierci."
        ru: "Я не боюсь смерти."
        source: { kind: tatoeba, id: 5256069 }
      - pl: "Sen to młodszy brat śmierci."
        ru: "Сон - младший брат смерти."
        source: { kind: tatoeba, id: 12470143 }
      - pl: "Przed śmiercią był niemal ślepy."
        ru: "Перед смертью он был почти слепым."
        source: { kind: tatoeba, id: 353147 }
  - id: death-sentence
    ru: "смерть (как возглас, как приговор)"
    examples:
      - pl: "Zwycięstwo albo śmierć!"
        ru: "Победа или смерть!"
        source: { kind: tatoeba, id: 6067370 }
      - pl: "Zabójstwo karane jest śmiercią."
        ru: "Убийство карается смертью."
        source: { kind: tatoeba, id: 1002587 }
      - pl: "Śmierć kolonializmowi!"
        ru: "Смерть колониализму!"
        source: { kind: tatoeba, id: 12678673 }
notes:
  - { kind: usage, text: "na śmierć значит «насмерть»: zamarzł na śmierć. А na śmierć i życie — «не на жизнь, а на смерть»." }
  - { kind: usage, text: "blady jak śmierć — «бледный как смерть», точное соответствие русскому выражению." }
  - { kind: usage, text: "Множественное число śmierci употребляется редко и только в официальном языке: «случаи смерти»." }
collocations:
  - { pl: "bać się śmierci", ru: "бояться смерти" }
  - { pl: "na śmierć", ru: "насмерть" }
  - { pl: "kara śmierci", ru: "смертная казнь" }
  - { pl: "przed śmiercią", ru: "перед смертью" }
etymology: "Праславянское *sъmьrtь — то же слово, что русская «смерть»; польское ś и ć соответствуют русским с и ть."
memory: "śmierć — «смерть» буква в букву. Запомните na śmierć «насмерть» и blady jak śmierć «бледный как смерть»."
idioms:
  - { pl: "blady jak śmierć", ru: "бледный как смерть" }
  - { pl: "na śmierć i życie", ru: "не на жизнь, а на смерть" }
  - { pl: "anioł śmierci", ru: "ангел смерти" }
