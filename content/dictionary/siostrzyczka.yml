notes:
  - { kind: false-friend, text: "SIOSTRZYCZKA — «сестрёнка», ласковое от SIOSTRA. Не путайте с SIOSTRZENICA — «племянница» (дочь сестры). Медсестра — PIELĘGNIARKA, в разговоре SIOSTRA." }
  - { kind: usage, text: "Девять форм, женский род. В дательном и местном K переходит в C: SIOSTRZYCZCE. Родительный множественного — SIOSTRZYCZEK. Звательный SIOSTRZYCZKO встречается редко." }
  - { kind: government, text: "Купить сестрёнке — KUPIĆ SIOSTRZYCZCE, дательный. Заботиться о сестрёнке — OPIEKOWAĆ SIĘ SIOSTRZYCZKĄ, творительный." }
  - { kind: pronunciation, text: "Читается «сьостшы́чка»: SIO — «сьо», STRZ — «стш», CZ — «ч». Ударение на предпоследнем слоге." }
