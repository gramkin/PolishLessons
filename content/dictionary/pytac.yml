# review
id: pytac
format: 2
lemma: "pytać"
rank: 225
pos: verb
aspect: imperf
pron: { cyr: "пы́таць" }
senses:
  - id: ask
    ru: "спрашивать"
    note: "Управление: pytać kogoś o coś — оба слова в винительном падеже."
    examples:
      - pl: "Dlaczego pytasz?"
        ru: "А почему Вы спрашиваете?"
        source: { kind: tatoeba, id: 349447 }
      - pl: "Lepiej nie pytać."
        ru: "Лучше не спрашивать."
        source: { kind: tatoeba, id: 6154859 }
      - pl: "On wstydzi się pytać."
        ru: "Ему стыдно спросить."
        source: { kind: tatoeba, id: 358901 }
  - id: question
    ru: "pytanie — вопрос"
    examples:
      - pl: "Marie ma pytanie."
        ru: "У Мэри есть вопрос."
        source: { kind: tatoeba, id: 8724996 }
      - pl: "To trudne pytanie."
        ru: "Это трудный вопрос."
        source: { kind: tatoeba, id: 4716849 }
      - pl: "Odpowiedz na pytanie."
        ru: "Ответь на вопрос."
        source: { kind: tatoeba, id: 349045 }
notes:
  - { kind: usage, text: "Управление отличается от русского: pytać o coś «спрашивать о чём-то» — с предлогом o и винительным падежом. Pytam o drogę «Спрашиваю дорогу», Pytał o ciebie «Он о тебе спрашивал»." }
  - { kind: usage, text: "Спрашивают кого-то в винительном падеже: Pytam cię «Я тебя спрашиваю», а не «тебе»." }
  - { kind: usage, text: "Совершенный вид — zapytać или spytać. Разговорный вариант pytać się значит то же самое." }
  - { kind: usage, text: "Существительное pytanie «вопрос»: zadać pytanie «задать вопрос», odpowiedzieć na pytanie «ответить на вопрос»." }
collocations:
  - { pl: "pytać o drogę", ru: "спрашивать дорогу" }
  - { pl: "zadać pytanie", ru: "задать вопрос" }
  - { pl: "dlaczego pytasz?", ru: "почему ты спрашиваешь?" }
  - { pl: "pytać o zgodę", ru: "спрашивать разрешения" }
etymology: "Праславянское *pytati «выспрашивать, дознаваться»; тот же корень, что в русских «пытать», «допытываться», «испытывать»."
memory: "pytać — «спрашивать», но управление другое: pytać o coś, с предлогом o и винительным падежом — Pytam o drogę. И спрашивают кого-то в винительном: Pytam cię."
idioms:
  - { pl: "kto pyta, nie błądzi", ru: "кто спрашивает, тот не заблудится" }
  - { pl: "pytać o drogę", ru: "спрашивать дорогу" }
  - { pl: "zadać pytanie", ru: "задать вопрос" }
