notes:
  - { kind: usage, text: "С большой буквы Bóg — христианский Бог, с маленькой bóg — божество." }
  - { kind: usage, text: "Звательный падеж — Boże: O Boże! «О Боже!»." }
collocations:
  - { pl: "dzięki Bogu", ru: "слава богу" }
  - { pl: "o Boże", ru: "о боже" }
  - { pl: "Boże Narodzenie", ru: "Рождество" }
etymology: "Праславянское *bogъ — то же слово, что русское «бог»; в основе индоиранский корень со значением «доля, достояние» (ср. «богатый»)."
memory: "В косвенных падежах ó чередуется с o: bóg — boga — bogu, как русское «бог — бога». Звательный падеж отдельный: Boże! Ударение всегда на первом слоге."
idioms:
