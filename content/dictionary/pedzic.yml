senses:
  - id: rush
    ru: "мчаться, нестись"
    examples:
      - pl: "Pewnego dnia będę pędzić jak wiatr."
        ru: "Однажды я побегу как ветер."
        source: { kind: tatoeba, id: 600719 }
      - pl: "Pędził na łeb na szyję."
        ru: "Он мчался сломя голову."
        source: { kind: translated, id: 900826 }
      - pl: "Klienci pędzili chodnikiem na zakupy."
        ru: "Покупатели мчались по тротуару за покупками."
        source: { kind: translated, id: 355440 }
  - id: drive
    ru: "гнать; вести (жизнь)"
    examples:
      - pl: "Chciałabym pędzić luksusowe życie."
        ru: "Я хотела бы вести роскошную жизнь."
        source: { kind: translated, id: 6313860 }
      - pl: "Nie pędź tak!"
        ru: "Не гони так!"
        source: { kind: translated, id: 8676554 }
notes:
  - { kind: usage, text: "Два направления смысла: непереходное «мчаться» и переходное «гнать» (скот, самогон)." }
  - { kind: usage, text: "pędzić życie «вести жизнь» — устойчивый оборот, где глагол теряет значение скорости." }
  - { kind: false-friend, text: "Праславянское *pǫditi «гнать»; ср. русское «понудить» и диалектное «пудить»." }
  - { kind: usage, text: "Существительное pęd значит и «стремительное движение», и «побег растения»." }
collocations:
  - { pl: "pędzić życie", ru: "вести жизнь" }
  - { pl: "pędzić na łeb na szyję", ru: "мчаться сломя голову" }
etymology: "Праславянское *pǫditi «гнать»; ср. русское «понудить», диалектное «пудить» «гнать»."
memory: "pędzić — «мчаться» и «гнать» сразу. Запомните pędzić życie «вести жизнь», где скорости уже нет, и pęd «стремительное движение»."
idioms:
  - { pl: "pędzić na łeb na szyję", ru: "мчаться сломя голову" }
  - { pl: "pędzić życie", ru: "вести жизнь" }
