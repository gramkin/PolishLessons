# review
id: wskoczyc
format: 2
lemma: "wskoczyć"
rank: 4458
pos: verb
pron: { cyr: "фско́чыць" }
senses:
  - id: jump-in
    ru: "вскочить, запрыгнуть (внутрь, на что-то)"
    examples:
      - pl: "Wskoczył do wody z mostu."
        ru: "Он прыгнул в воду с моста."
        source: { kind: authored }
      - pl: "Kot wskoczył na stół."
        ru: "Кот запрыгнул на стол."
        source: { kind: authored }
      - pl: "Wskocz do auta, podwiozę cię."
        ru: "Запрыгивай в машину, подвезу."
        source: { kind: authored }
  - id: pop-in
    ru: "заскочить (ненадолго); подменить (wskoczyć na czyjeś miejsce)"
    examples:
      - pl: "Wskoczę do sklepu po chleb."
        ru: "Я заскочу в магазин за хлебом."
        source: { kind: authored }
      - pl: "Wskoczył na miejsce chorego kolegi."
        ru: "Он подменил заболевшего коллегу."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "WSKOCZYĆ — не «вскочить с места»: вскочить на ноги — ZERWAĆ SIĘ, PODSKOCZYĆ. WSKOCZYĆ — «прыгнуть внутрь или наверх»: WSKOCZYĆ DO WODY, NA KONIA, DO TRAMWAJU. В разговоре — «заскочить»: WSKOCZĘ DO CIEBIE NA KAWĘ. WSKOCZYĆ NA CZYJEŚ MIEJSCE — «занять чьё-то место, подменить»." }
  - { kind: usage, text: "Сорок две формы: глагол совершенного вида и непереходный, страдательного причастия нет; есть деепричастие WSKOCZYWSZY и безличное WSKOCZONO. Видовой партнёр — WSKAKIWAĆ: WSKAKUJ!, «запрыгивай!», — частое приглашение в машину." }
  - { kind: government, text: "Куда внутрь — DO с родительным: DO WODY, DO AUTA, DO POCIĄGU. Наверх — NA с винительным: NA STÓŁ, NA KONIA, NA SCENĘ. К кому заскочить — DO с родительным лица: WSKOCZYĆ DO MAMY." }
  - { kind: pronunciation, text: "Читается «фско́чыць», два слога, ударение на первом. W перед S оглушается в «ф». CZ твёрдое — «чы». Конечное Ć — «ць»." }
  - { kind: register, text: "Разговорное и живое слово, особенно в значении «заскочить»: WSKOCZĘ NA CHWILĘ. Прыжок в воду — нейтрально. Книжное «вскочить в седло» — WSKOCZYĆ NA KONIA." }
collocations:
  - { pl: "wskoczyć do wody", ru: "прыгнуть в воду" }
  - { pl: "wskoczyć do sklepu", ru: "заскочить в магазин" }
  - { pl: "wskoczyć na czyjeś miejsce", ru: "занять чьё-то место" }
family:
  - { pl: "wskakiwać", ru: "запрыгивать, заскакивать", relation: aspect, id: wskakiwac }
  - { pl: "skoczyć", ru: "прыгнуть", relation: root, id: skoczyc }
  - { pl: "skakać", ru: "прыгать", relation: root, id: skakac }
etymology: "Приставка W- «в-» плюс SKOCZYĆ «прыгнуть», праславянское *skočiti, то же, что русское «скочить», «вскочить», «скакать»."
memory: "Wskoczyć — прыгнуть внутрь или наверх: do wody, na stół, do auta. Wskoczę do sklepu — заскочу. Вскочить на ноги — zerwać się! Читается «фско́чыць»."
idioms:
  - { pl: "wskoczyć w ostatniej chwili", ru: "вскочить в последний вагон" }
