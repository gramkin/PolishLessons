# review
id: komputer
format: 2
lemma: "komputer"
rank: 921
pos: noun
pron: { cyr: "компу́тэр" }
senses:
  - id: computer
    ru: "компьютер"
    examples:
      - pl: "Masz komputer?"
        ru: "У тебя есть компьютер?"
        source: { kind: tatoeba, id: 2341737 }
      - pl: "Komputer jest wyłączony."
        ru: "Компьютер выключен."
        source: { kind: tatoeba, id: 8110522 }
      - pl: "Komputery są bardzo użyteczne."
        ru: "Компьютеры очень полезны."
        source: { kind: tatoeba, id: 5932975 }
  - id: at-computer
    ru: "przy komputerze — за компьютером"
    examples:
      - pl: "Uczę się pisania na komputerze."
        ru: "Я учусь писать на компьютере."
        source: { kind: tatoeba, id: 542060 }
      - pl: "Siedzi przy komputerze."
        ru: "Он сидит за компьютером."
        source: { kind: translated, id: 9671426 }
      - pl: "Siedzi przed komputerem."
        ru: "Он сидит перед компьютером."
        source: { kind: translated, id: 9671427 }
  - id: know-about
    ru: "znać się na komputerach — разбираться в компьютерах"
    note: "После na — предложный падеж."
    examples:
      - pl: "Nie znam się zbytnio na komputerach."
        ru: "Я не особо разбираюсь в компьютерах."
        source: { kind: tatoeba, id: 5933116 }
      - pl: "On się zna na komputerach."
        ru: "Он разбирается в компьютерах."
        source: { kind: translated, id: 709308 }
      - pl: "Interesuję się komputerami."
        ru: "Я интересуюсь компьютерами."
        source: { kind: translated, id: 530455 }
notes:
  - { kind: government, text: "znać się NA komputerach «разбираться в компьютерах» — предложный падеж после na. А interesować się komputerami «интересоваться компьютерами» — творительный, как и в русском." }
  - { kind: usage, text: "Различайте przy komputerze «за компьютером» (сидит и работает) и przed komputerem «перед компьютером» (о положении в пространстве)." }
  - { kind: usage, text: "В разговоре часто говорят komp: Siedzi przy kompie. Прилагательное — komputerowy: gra komputerowa «компьютерная игра»." }
  - { kind: pronunciation, text: "Ударение на предпоследнем слоге, как всегда в польском: kom-PU-ter, а не «компьЮтер»." }
collocations:
  - { pl: "gra komputerowa", ru: "компьютерная игра" }
  - { pl: "przy komputerze", ru: "за компьютером" }
  - { pl: "znać się na komputerach", ru: "разбираться в компьютерах" }
  - { pl: "włączyć komputer", ru: "включить компьютер" }
family:
  - { pl: "komputerowy", ru: "компьютерный", relation: derived }
  - { pl: "komputerek", ru: "компьютерчик", relation: derived }
etymology: "Из английского computer, а то из латинского computare «считать». Русское «компьютер» — то же заимствование, разница только в ударении."
memory: "komputer — «компьютер», слово международное. Главное не ошибиться в ударении: по-польски kom-PU-ter, на предпоследнем слоге. Запомните znać się na komputerach «разбираться в компьютерах» — с предложным падежом, — и разговорное komp."
idioms:
  - { pl: "gra komputerowa", ru: "компьютерная игра" }
  - { pl: "przy komputerze", ru: "за компьютером" }
  - { pl: "znać się na komputerach", ru: "разбираться в компьютерах" }
