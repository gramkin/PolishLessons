# review
id: narzekac
format: 2
lemma: "narzekać"
rank: 2502
pos: verb
pron: { cyr: "нажэка́ць" }
senses:
  - id: complain
    ru: "жаловаться (на что-либо)"
    examples:
      - pl: "Wiecznie narzekasz."
        ru: "Вечно ты жалуешься."
        source: { kind: translated, id: 620836 }
      - pl: "Ludzie często narzekają na pogodę."
        ru: "Люди часто жалуются на погоду."
        source: { kind: translated, id: 734283 }
      - pl: "Nie mogę narzekać na swoją sytuację."
        ru: "Я не могу жаловаться на свою ситуацию."
        source: { kind: translated, id: 6137524 }
  - id: grumble
    ru: "ныть, ворчать (постоянно)"
    examples:
      - pl: "Oni wiecznie narzekają."
        ru: "Они вечно жалуются."
        source: { kind: translated, id: 744234 }
      - pl: "Ty zawsze narzekasz."
        ru: "Ты всегда жалуешься."
        source: { kind: translated, id: 582647 }
notes:
  - { kind: government, text: "Несовершенный вид. Предмет жалобы ставится с предлогом na и винительным падежом: narzekać na pogodę «жаловаться на погоду»." }
  - { kind: usage, text: "Оборот nie mogę narzekać «не могу пожаловаться» — обычный вежливый ответ на вопрос «как дела»." }
  - { kind: usage, text: "Совершенный вид — ponarzekać «пожаловаться немного»; отглагольное существительное narzekanie значит «нытьё»." }
  - { kind: false-friend, text: "Русское «нарекать» — то же самое слово по составу: на- плюс корень «рек-». Но значения разошлись полностью: польское narzekać это «жаловаться», а русское «нарекать» — «давать имя»." }
collocations:
  - { pl: "narzekać na pogodę", ru: "жаловаться на погоду" }
  - { pl: "nie mogę narzekać", ru: "не могу пожаловаться" }
  - { pl: "ciągłe narzekanie", ru: "постоянное нытьё" }
family:
  - { pl: "rzec", ru: "молвить, сказать", relation: root, id: rzec }
  - { pl: "narzekanie", ru: "нытьё, жалобы", relation: derived }
etymology: "Приставка na- плюс многократное -rzekać от rzec «молвить, сказать»: буквально «наговаривать». Русское «нарекать» собрано из тех же частей, но закрепилось на значении «давать имя», тогда как польское — на «жаловаться»."
memory: "narzekać — «жаловаться», всегда с предлогом na: narzekać na pogodę. Родственно русскому «нарекать», но значения разошлись: поляк жалуется, русский даёт имя."
idioms:
  - { pl: "nie mogę narzekać", ru: "не могу пожаловаться" }
