# review
id: kiepsko
format: 2
lemma: "kiepsko"
rank: 5821
pos: adv
pron: { cyr: "ке́пско" }
senses:
  - id: poorly
    ru: "плохо, слабо, неважно (о качестве, результате)"
    examples:
      - pl: "W naszej firmie kiepsko płacą."
        ru: "В нашей компании плохо платят."
        source: { kind: tatoeba, id: 745320 }
      - pl: "Kiepsko się spisałeś."
        ru: "Ты плохо справился."
        source: { kind: translated, id: 7960738 }
      - pl: "Mówię po angielsku dość kiepsko."
        ru: "Я говорю по-английски довольно слабо."
        source: { kind: authored }
  - id: unwell
    ru: "неважно, плохо (о самочувствии, положении дел)"
    examples:
      - pl: "Kiepsko dziś wyglądasz."
        ru: "Ты сегодня неважно выглядишь."
        source: { kind: authored }
      - pl: "Z pieniędzmi jest u nas kiepsko."
        ru: "С деньгами у нас туго."
        source: { kind: authored }
      - pl: "To kiepsko."
        ru: "Это плохо."
        source: { kind: translated, id: 12359771 }
notes:
  - { kind: usage, text: "KIEPSKO — наречие от KIEPSKI, мягче и разговорнее, чем ŹLE: «так себе, неважно». Два употребления: о качестве — KIEPSKO GRA «плохо играет», KIEPSKO PŁATNA PRACA «плохо оплачиваемая работа»; и о состоянии — CZUJĘ SIĘ KIEPSKO «мне нехорошо», Z NIM JEST KIEPSKO «дела у него плохи»." }
  - { kind: register, text: "Слово разговорное, но не грубое: его спокойно говорят врачу или коллеге. На вопрос JAK SIĘ CZUJESZ? ответ KIEPSKO звучит так же естественно, как русское «неважно». Сравнительную степень в речи обычно заменяют на GORZEJ «хуже»." }
  - { kind: pronunciation, text: "Читается «ке́пско»: KIE — мягкое «ке», без отдельного «и». Ударение на первом слоге." }
collocations:
  - { pl: "kiepsko się czuć", ru: "неважно себя чувствовать" }
  - { pl: "kiepsko wyglądać", ru: "неважно выглядеть" }
  - { pl: "kiepsko płatny", ru: "плохо оплачиваемый" }
family:
  - { pl: "kiepski", ru: "слабый, неважный", relation: root, id: kiepski }
  - { pl: "źle", ru: "плохо", relation: root, id: zle }
  - { pl: "dobrze", ru: "хорошо", relation: antonym, id: dobrze }
etymology: "Наречие от KIEPSKI, а прилагательное — от старого грубого слова KIEP. Сегодня эта связь не ощущается."
memory: "Kiepsko — «так себе, неважно». Jak się czujesz? — Kiepsko. Мягче, чем źle, и разговорнее."
idioms:
  - { pl: "z kimś jest kiepsko", ru: "чьи-то дела плохи" }
formExamples:
  - form: "kiepsko"
    pl: "W naszej firmie kiepsko płacą."
    ru: "В нашей компании плохо платят."
    source: { kind: tatoeba, id: 745320 }
  - form: "kiepsko"
    pl: "Kiepsko spałem tej nocy."
    ru: "Я плохо спал этой ночью."
    source: { kind: authored }
  - form: "kiepsko"
    pl: "Babcia czuje się ostatnio kiepsko."
    ru: "Бабушка в последнее время неважно себя чувствует."
    source: { kind: authored }
