id: wiesc
format: 2
lemma: "wieść"
rank: 808
pos: noun
pron: { cyr: "весьць" }
senses:
  - id: news
    ru: "весть, известие, новость"
    examples:
      - pl: "Mam wieści."
        ru: "У меня есть новости."
        source: { kind: translated, id: 3817530 }
      - pl: "Mam dobre wieści."
        ru: "У меня хорошие новости."
        source: { kind: translated, id: 4313986 }
      - pl: "Byli przygnębieni wieścią o jego śmierci."
        ru: "Они были подавлены вестью о его смерти."
        source: { kind: translated, id: 818728 }
  - id: rumour
    ru: "молва, слух; предание"
    note: "Оборот jak wieść niesie значит «как гласит молва»."
    examples:
      - pl: "Wieść szybko się rozniosła."
        ru: "Весть быстро разнеслась."
        source: { kind: translated, id: 6534090 }
      - pl: "Jak wieść niesie, zjadły go rekiny."
        ru: "Как гласит молва, его съели акулы."
        source: { kind: translated, id: 957037 }
      - pl: "Wieść o pożarze obiegła wieś."
        ru: "Весть о пожаре облетела деревню."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Женский род, третьего склонения (как noc, rzecz): ta wieść, tej wieści. Множественное wieści «новости» употребляется чаще единственного." }
  - { kind: false-friend, text: "Не путайте существительное wieść «весть» с одноимённым глаголом wieść «вести»: Wieść rozeszła się szybko «Весть быстро разнеслась», но wieść życie «вести жизнь»." }
  - { kind: usage, text: "Оборот jak wieść niesie — «как гласит молва». hiobowa wieść — «печальное известие», буквально «Иовова весть»." }
  - { kind: usage, text: "Русское «весть» — то же слово: праславянское *věstь от *věděti «знать», как и wiedzieć. Отсюда же wiadomość «известие»." }
collocations:
  - { pl: "dobre wieści", ru: "хорошие новости" }
  - { pl: "jak wieść niesie", ru: "как гласит молва" }
  - { pl: "hiobowa wieść", ru: "печальное известие" }
  - { pl: "wieść się rozeszła", ru: "весть разнеслась" }
family:
  - { pl: "wiadomość", ru: "известие, сообщение", relation: derived, id: wiadomosc }
  - { pl: "wiedzieć", ru: "знать", relation: root, id: wiedziec }
etymology: "Праславянское *věstь от *věděti «знать» — то же слово, что русское «весть». Отсюда же wiadomość «известие» и wiedzieć «знать»."
memory: "wieść — «весть, известие», женского рода третьего склонения, как noc и rzecz. В живой речи чаще звучит множественное wieści «новости»: dobre wieści, mam wieści. Осторожно с омонимом: существительное wieść «весть» пишется так же, как глагол wieść «вести» — Wieść się rozeszła «Весть разнеслась», но wieść życie «вести жизнь». Обороты: jak wieść niesie «как гласит молва», hiobowa wieść «печальное известие»."
idioms:
  - { pl: "jak wieść niesie", ru: "как гласит молва" }
  - { pl: "dobre wieści", ru: "хорошие новости" }
  - { pl: "hiobowa wieść", ru: "печальное известие" }
