notes:
  - { kind: false-friend, text: "Слово звучит похоже сразу на два русских и не значит ни одного из них. TROSKA это «забота» или «тревога», а русская «треска» — рыба, которая по-польски называется DORSZ. Русская «тоска» — тоже не она: по-польски это TĘSKNOTA или SMUTEK. Так что при встрече с TROSKA ни рыба, ни тоска не годятся. Глагол того же гнезда — TROSZCZYĆ SIĘ O KOGOŚ «заботиться о ком-то», прилагательное TROSKLIWY «заботливый», а наречие TROSKLIWIE. Любопытно, что русское «тревога» ближе всего по смыслу, но происхождения совсем другого." }
  - { kind: usage, text: "В дательном и местном единственного K переходит в C: TROSCE, как MATKA даёт MATCE и PUSZKA даёт PUSZCE. Родительный множественного — TROSK, с нулевым окончанием и без вставной гласной, потому что группа SK на конце выговаривается легко. Это третий вариант среди трёх слов на карточке: WIOSNA вставляет E и даёт WIOSEN, TRUMNA вставляет -IE- и даёт TRUMIEN, а TROSKA не вставляет ничего. Решает не окончание именительного, а то, какие согласные стоят перед ним, и потому форму надо запоминать вместе со словом." }
  - { kind: government, text: "Женский род. О ком или о чём забота — предлог O с винительным: TROSKA O DZIECI, TROSKA O ZDROWIE. Устойчивое W TROSCE O что-то значит «из заботы о чём-то» и стоит в начале официальных объявлений: W TROSCE O BEZPIECZEŃSTWO PASAŻERÓW. Глагол TROSZCZYĆ SIĘ требует того же предлога O с винительным: TROSZCZY SIĘ O MATKĘ. Частотные сочетания: PEŁEN TROSKI «полный заботы», Z TROSKĄ «с тревогой», CODZIENNE TROSKI «повседневные тревоги». Во множественном слово почти всегда значит «тревоги», а не «заботы»." }
  - { kind: pronunciation, text: "Читается «тро́ска», два слога, ударение на первом. Буква O произносится полно, как «о». Группа SK выговаривается слитно. В дательном и местном TROSCE сочетание SC даёт «сц»: «тро́сце». В родительном множественного TROSK слог один: «троск», и именно в этой форме слово ближе всего по звучанию к русской «треске», с которой его легко спутать на слух. Разница в первой гласной: по-польски «о», по-русски «е»." }
