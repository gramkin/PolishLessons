etymology: "Из праславянского *troska «забота, беспокойство», связанного с корнем, означавшим «трещать, ломать», откуда идея надломленности и тревоги. Русского прямого соответствия не сохранилось: ни «треска», ни «тоска» этому слову не родня, хотя обе звучат близко. «Треска» идёт от «тресковать, трещать» о сухой рыбе, а «тоска» — от праславянского *tъska, корня со значением «теснить», того же, что в «тискать» и «тесный». Так три похожих по звучанию слова оказались из трёх разных гнёзд, и совпадение чисто внешнее. Из польского гнезда идут TROSZCZYĆ SIĘ, TROSKLIWY и ZATROSKANY «озабоченный»."
memory: "Похоже на два русских слова и не значит ни одного: troska — «забота, тревога»; «треска» это dorsz, «тоска» это tęsknota. Все три из разных гнёзд, сходство чисто звуковое. Дательный и местный trosce с k→c. Родительный множественного trosk, нулевой, без вставки — тогда как wiosen вставляет e, а trumien вставляет -ie-. Глагол troszczyć się O kogoś, с винительным."
