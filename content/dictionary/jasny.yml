# review
id: jasny
format: 2
lemma: "jasny"
rank: 300
pos: adj
pron: { cyr: "я́сны" }
senses:
  - id: bright
    ru: "светлый, яркий"
    examples:
      - pl: "Zobacz, jak jasny jest księżyc!"
        ru: "Смотри, какая луна яркая!"
        source: { kind: tatoeba, id: 12902076 }
      - pl: "Był jasny, zimny dzień kwietniowy i zegary biły trzynastą."
        ru: "Это был яркий холодный апрельский день, и часы показывали час дня."
        source: { kind: tatoeba, id: 9534640 }
      - pl: "To było jak grom z jasnego nieba."
        ru: "Это было как гром среди ясного неба."
        source: { kind: tatoeba, id: 353886 }
  - id: clear
    ru: "ясный, понятный"
    examples:
      - pl: "Wszystko jasne?"
        ru: "Всё понятно?"
        source: { kind: tatoeba, id: 13785906 }
      - pl: "Było dla mnie jasne, że doznaliśmy druzgocącej klęski."
        ru: "Мне было ясно, что мы потерпели сокрушительную неудачу."
        source: { kind: tatoeba, id: 13546975 }
      - pl: "Sprawa jest jasna."
        ru: "Дело ясное."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Одно слово покрывает оба русских: «светлый» (jasne włosy «светлые волосы») и «ясный, понятный» (To jasne «Это понятно»)." }
  - { kind: usage, text: "Одинокое Jasne! в разговоре значит «Ясно!», «Конечно!» — частый способ согласиться." }
  - { kind: usage, text: "Степени: jasny — jaśniejszy — najjaśniejszy." }
  - { kind: register, text: "Jasna cholera! и do jasnej anielki — грубоватые восклицания досады; в вежливой речи их лучше избегать." }
collocations:
  - { pl: "jasne włosy", ru: "светлые волосы" }
  - { pl: "to jasne", ru: "это понятно" }
  - { pl: "jasny kolor", ru: "светлый цвет" }
  - { pl: "jak grom z jasnego nieba", ru: "как гром среди ясного неба" }
etymology: "Праславянское *jasnъ — то же слово, что русское «ясный»; значение «светлый» сохранилось в обоих языках, ср. «ясное небо»."
memory: "jasny — и «светлый», и «ясный»: jasne włosy «светлые волосы», To jasne «Это понятно». А одинокое Jasne! значит «Ясно!, Конечно!»."
idioms:
  - { pl: "jak grom z jasnego nieba", ru: "как гром среди ясного неба" }
  - { pl: "jasne włosy", ru: "светлые волосы" }
  - { pl: "to jasne", ru: "это понятно" }
