notes:
  - { kind: false-friend, text: "Значение то же, что у русского «бензина», а род другой, и это меняет всё согласование. Польская BENZYNA женского рода: DROGA BENZYNA «дорогой бензин», TA BENZYNA, BENZYNA ZDROŻAŁA. Русский «бензин» мужского рода, поэтому по-польски сказать «drogi benzyn» нельзя, как нельзя по-русски «дорогая бензина». Это то же расхождение, что у TEMPO, которое в польском среднего рода против русского мужского: польский приспосабливает род к окончанию слова, а окончание берёт из источника. «Неэтилированный» по-польски BEZOŁOWIOWA, от OŁÓW «свинец»." }
  - { kind: usage, text: "В дательном и местном падеже единственного числа N смягчается перед окончанием -IE: BENZYNIE. Так же у всех женских основ на N — ŚCIANA даёт ŚCIANIE, DOLINA даёт DOLINIE, KORONA даёт KORONIE. Родительный множественного — BENZYN, с нулевым окончанием. Множественное число у слова есть, хотя употребляется редко: о сортах топлива, BENZYNY BEZOŁOWIOWE. Форма BENZYNY покрывает родительный единственного вместе с именительным и винительным множественного, то есть три позиции одной формой." }
  - { kind: government, text: "Женский род. Чего бензин — обычно через прилагательное, а не родительный: BENZYNA BEZOŁOWIOWA «неэтилированный бензин», BENZYNA SILNIKOWA «автомобильный бензин». Частотные глаголы: ZATANKOWAĆ BENZYNĘ «заправить бензин», WLAĆ BENZYNY «налить бензина» — с родительным, когда речь о неопределённом количестве; SKOŃCZYŁA SIĘ BENZYNA «бензин кончился», и здесь подлежащее женского рода. Станция — STACJA BENZYNOWA, и прилагательное от нашего слова именно BENZYNOWY." }
  - { kind: pronunciation, text: "Читается «бэнзы́на», три слога, ударение на предпоследнем. Буква E в первом слоге даёт «э» без смягчения предшествующего согласного, поэтому начало звучит «бэн», а не «бен». Буква Y даёт «ы»: второй слог «зы», а не «зи». В дательном и местном BENZYNIE сочетание NIE даёт мягкое «не»: «бэнзы́не». В родительном множественного BENZYN слогов два, ударение переходит на первый: «бэ́нзын»." }
