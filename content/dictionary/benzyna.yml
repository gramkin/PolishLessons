etymology: "Из немецкого BENZIN, образованного химиком Эйльхардом Мичерлихом в девятнадцатом веке от названия бензойной смолы, BENZOE, которое пришло в европейские языки через арабское LUBAN JAWI «ладан яванский». Оба наших языка взяли слово из немецкого, но распорядились им по-разному: русский оставил конечный согласный и получил мужское «бензин», а польский добавил -A и отнёс слово к женскому роду, как делает с большинством существительных на -A. Это общее правило при заимствованиях: польский чаще приспосабливает форму слова к своей системе родов, русский чаще оставляет форму и приспосабливает род к ней. Из того же немецкого гнезда идут BENZEN «бензол» и BENZOESOWY «бензойный», и в них конечного -A нет, потому что это термины, а не бытовое слово."
memory: "Значение то же, род другой: польская benzyna женского рода — droga benzyna, benzyna zdrożała. Русский «бензин» мужского, поэтому «drogi benzyn» невозможно. То же расхождение у tempo, среднего против русского мужского. Дательный и местный benzynie: n смягчается, как ściana/ścianie. «Неэтилированный» — bezołowiowa, от ołów «свинец». Станция — stacja benzynowa."
