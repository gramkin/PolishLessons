# review
id: wysmienity
format: 2
lemma: "wyśmienity"
rank: 6076
pos: adj
pron: { cyr: "высьмьени́ты" }
senses:
  - id: delicious
    ru: "превосходный, отменный — прежде всего о еде и напитках"
    examples:
      - pl: "Jedzenie w tej nowej restauracji jest wyśmienite."
        ru: "Еда в этом новом ресторане превосходная."
        source: { kind: translated, id: 369030 }
      - pl: "Wszystko było wyśmienite."
        ru: "Всё было превосходно."
        source: { kind: translated, id: 13030332 }
      - pl: "Babcia upiekła wyśmienity sernik."
        ru: "Бабушка испекла отменный сырник."
        source: { kind: authored }
  - id: excellent
    ru: "великолепный, превосходный — о погоде, настроении, людях и их работе"
    examples:
      - pl: "Pogoda była wyśmienita."
        ru: "Погода была великолепная."
        source: { kind: translated, id: 531968 }
      - pl: "Był w wyśmienitym humorze."
        ru: "Он был в превосходном настроении."
        source: { kind: authored }
      - pl: "Aktorzy w tym spektaklu byli wyśmienici."
        ru: "Актёры в этом спектакле были великолепны."
        source: { kind: authored }
notes:
  - { kind: usage, text: "WYŚMIENITY — сильная похвала, «превосходный», «отменный». Его главная территория — еда и питьё: wyśmienita kolacja, wyśmienite wino; так в Польше хвалят угощение хозяев: Wszystko było wyśmienite! Рядом стоят ZNAKOMITY (нейтральнее, чаще о людях и их работе), DOSKONAŁY (о качестве), ŚWIETNY (разговорное «отличный») и PYSZNY (только о вкусе, «очень вкусный»). WYŚMIENITY шире PYSZNY: бывает и wyśmienita pogoda, и wyśmienity humor, и wyśmienici aktorzy." }
  - { kind: usage, text: "Степени — WYŚMIENITSZY, NAJWYŚMIENITSZY — существуют, но звучат книжно: само слово уже значит «лучше некуда». В разговоре чаще jeszcze lepszy, najlepszy или просто повтор: wyśmienity, naprawdę wyśmienity. Мужское-личное множественное — с чередованием T на C: WYŚMIENICI, но в степенях — WYŚMIENITSI, NAJWYŚMIENITSI." }
  - { kind: government, text: "Обычно стоит перед существительным (wyśmienity obiad) или после глагола BYĆ (obiad był wyśmienity). Сравнение — NIŻ или OD + родительный: wyśmienitszy niż zeszłoroczny, wyśmienitszy od pierwszego. Наречие — WYŚMIENICIE: smakuje wyśmienicie, «на вкус превосходно»; czuć się wyśmienicie, «чувствовать себя великолепно»." }
  - { kind: pronunciation, text: "«высьмьени́ты», ударение на предпоследнем слоге, -ni-. Ś — мягкое «сь», и M после него тоже мягкая: -śmie- — «сьмье». TY — твёрдое «ты»; в WYŚMIENICI — «высьмьени́ци», T перед I переходит в Ć." }
collocations:
  - { pl: "wyśmienity smak", ru: "превосходный вкус" }
  - { pl: "wyśmienita kuchnia", ru: "отменная кухня" }
  - { pl: "wyśmienite wino", ru: "превосходное вино" }
  - { pl: "wyśmienita pogoda", ru: "великолепная погода" }
family:
  - { pl: "wyśmienicie", ru: "превосходно, отменно", relation: derived }
  - { pl: "wyśmienitość", ru: "превосходство, отменность", relation: derived }
etymology: "Старое слово: прежде оно значило «выдающийся, знатный» и чаще говорилось о людях (так ещё бывает: wyśmienici doradcy, «превосходные советники»), а позже закрепилось главным образом за едой и питьём. Происхождение у этимологов спорное; приставка WY- здесь та же, что в WYBITNY («выдающийся») и WYBORNY («отборный»), — «выделяющийся из ряда»."
memory: "WY- как в wybitny, «выдающийся»: wyśmienity — выдающийся на тарелке. После обеда в гостях скажите хозяйке: Wszystko było wyśmienite!"
idioms:
