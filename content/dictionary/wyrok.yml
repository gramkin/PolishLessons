# review
id: wyrok
format: 2
lemma: "wyrok"
rank: 1930
pos: noun
pron: { cyr: "вы́рок" }
senses:
  - id: verdict
    ru: "приговор, решение суда"
    examples:
      - pl: "Zapadł wyrok."
        ru: "Приговор вынесен."
        source: { kind: authored }
      - pl: "Sąd ogłosił wyrok po godzinie."
        ru: "Суд объявил приговор через час."
        source: { kind: authored }
      - pl: "Sąd skazał go wyrokiem zaocznym."
        ru: "Суд приговорил его заочным приговором."
        source: { kind: authored }
  - id: doom
    ru: "перен. приговор, участь"
    examples:
      - pl: "Czekam na wyrok."
        ru: "Я жду приговора."
        source: { kind: authored }
      - pl: "Bali się surowych wyroków."
        ru: "Они боялись суровых приговоров."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Корень тот же, что в rzec «сказать», и слово буквально значит «изречённое». Русское «приговор» построено по той же мысли, но от «говорить» — оба языка назвали решение суда тем, что произнесено. Русские родственники польского rzec — «речь», «изречь», «нарекать»." }
  - { kind: government, text: "Запомните предлоги: wyrok W sprawie «приговор по делу» (предложный), wyrok NA kogoś «приговор кому-л.» (винительный), skazać kogoś WYROKIEM «приговорить приговором» (творительный). Глагол «вынести» здесь wydać: wydać wyrok." }
  - { kind: usage, text: "Различают wyrok skazujący «обвинительный приговор» и wyrok uniewinniający «оправдательный». В переносном смысле to wyrok значит «это приговор», о чём-то неотвратимом." }
collocations:
  - { pl: "wydać wyrok", ru: "вынести приговор" }
  - { pl: "wyrok sądu", ru: "приговор суда" }
  - { pl: "wyrok śmierci", ru: "смертный приговор" }
family:
  - { pl: "rzec", ru: "сказать, молвить", relation: root, id: rzec }
  - { pl: "wyrokować", ru: "судить, выносить решение", relation: derived }
etymology: "От wyrzec «изречь», то есть от корня rzec «сказать», который прямо отвечает русским «речь», «изречь», «нарекать». Приставка wy- даёт значение «произнести до конца, объявить». Русское «приговор» построено по той же логике, только от «говорить»."
memory: "wyrok — «приговор», буквально «изречённое»: корень rzec, как в русских «речь» и «изречь». Русское «приговор» сделано так же, но от «говорить». Выносят приговор — wydać wyrok."
idioms:
  - { pl: "wyrok śmierci", ru: "смертный приговор" }
  - { pl: "wydać wyrok", ru: "вынести приговор" }
