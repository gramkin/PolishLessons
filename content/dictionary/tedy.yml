# review
id: tedy
format: 2
lemma: "tędy"
rank: 938
pos: adv
pron: { cyr: "те́нды" }
senses:
  - id: this-way
    ru: "этой дорогой, сюда, здесь (о пути)"
    note: "Отвечает на вопрос «каким путём», а не «куда»."
    examples:
      - pl: "Tędy."
        ru: "Сюда."
        source: { kind: translated, id: 1104686 }
      - pl: "Idź tędy."
        ru: "Иди этой дорогой."
        source: { kind: translated, id: 8238397 }
      - pl: "Proszę tędy."
        ru: "Прошу сюда."
        source: { kind: translated, id: 1086465 }
  - id: wrong-way
    ru: "nie tędy droga — не тот путь, так дело не пойдёт"
    examples:
      - pl: "Nie tędy droga."
        ru: "Не тот путь."
        source: { kind: authored }
      - pl: "Krzykiem nie tędy droga."
        ru: "Криком делу не поможешь."
        source: { kind: authored }
      - pl: "Tędy i owędy, a końca nie widać."
        ru: "И так и сяк, а конца не видать."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Наречие отвечает на вопрос którędy? «каким путём?», а не dokąd? «куда?». Tędy значит «вот этой дорогой»: Proszę tędy «Прошу сюда»." }
  - { kind: usage, text: "Пара наречий: tędy «этим путём» и tamtędy «тем путём». Вопросительное — którędy." }
  - { kind: usage, text: "nie tędy droga — «не тот путь, так делу не помочь»: устойчивый оборот о неверном способе действия." }
  - { kind: usage, text: "Слово неизменяемое: форм у него нет. Не путайте с tedy — устаревшим вариантом więc «итак», который встречается только в старых текстах." }
collocations:
  - { pl: "proszę tędy", ru: "прошу сюда" }
  - { pl: "nie tędy droga", ru: "не тот путь" }
  - { pl: "tamtędy", ru: "тем путём" }
  - { pl: "którędy?", ru: "каким путём?" }
family:
  - { pl: "tamtędy", ru: "тем путём", relation: root }
  - { pl: "którędy", ru: "каким путём", relation: root }
etymology: "От указательного ten «этот» с наречным окончанием -ędy, тем же, что в tamtędy и którędy. Русское «туда» и «сюда» устроены иначе, поэтому пару приходится запоминать целиком."
memory: "tędy — «этой дорогой, сюда», и отвечает оно на вопрос którędy? «каким путём?», а не «куда?». Запомните тройку: tędy «этим путём», tamtędy «тем путём», którędy «каким путём». И оборот nie tędy droga «не тот путь»."
