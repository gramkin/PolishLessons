# review
id: kwiat
format: 2
lemma: "kwiat"
rank: 1219
pos: noun
pron: { cyr: "квят" }
senses:
  - id: flower
    ru: "цветок"
    examples:
      - pl: "Kwiat jest czerwony."
        ru: "Цветок красный."
        source: { kind: tatoeba, id: 2979230 }
      - pl: "Jaki piękny jest ten kwiat!"
        ru: "Какой красивый цветок!"
        source: { kind: tatoeba, id: 527747 }
      - pl: "Oto najpiękniejszy kwiat w ogrodzie."
        ru: "Это самый красивый цветок в саду."
        source: { kind: tatoeba, id: 2145985 }
  - id: flowers
    ru: "цветы как букет, подарок"
    examples:
      - pl: "Tom niósł bukiet kwiatów."
        ru: "Том нёс букет цветов."
        source: { kind: tatoeba, id: 2403190 }
      - pl: "Tom wysłał Marii bukiet kwiatów."
        ru: "Том прислал Марии букет цветов."
        source: { kind: tatoeba, id: 11111466 }
      - pl: "Gdzie kupiłeś kwiaty?"
        ru: "Где ты купил цветы?"
        source: { kind: tatoeba, id: 2060302 }
  - id: prime
    ru: "w kwiecie wieku — в расцвете лет"
    examples:
      - pl: "On jest w kwiecie wieku."
        ru: "Он в расцвете лет."
        source: { kind: translated, id: 2027385 }
      - pl: "Ona jest właśnie w kwiecie wieku."
        ru: "Она как раз в расцвете лет."
        source: { kind: translated, id: 730411 }
      - pl: "Ona ma 35 lat i jest w kwiecie wieku."
        ru: "Ей 35 лет, и она в расцвете лет."
        source: { kind: translated, id: 3079805 }
notes:
  - { kind: usage, text: "Kwiat значит и цветок на растении, и комнатное растение целиком: Zajmę się kwiatami — это скорее про горшки, чем про букет." }
  - { kind: government, text: "opiekować się kwiatami «ухаживать за цветами» требует творительного, а podlewać kwiaty «поливать цветы» — винительного." }
  - { kind: usage, text: "Предложный падеж kwiecie в живой речи встречается почти только в обороте w kwiecie wieku «в расцвете лет»." }
  - { kind: pronunciation, text: "kwi- звучит как «кви-», почти «квя-»: квят. Слово односложное, во множественном ударение падает на kwia-." }
collocations:
  - { pl: "bukiet kwiatów", ru: "букет цветов" }
  - { pl: "podlewać kwiaty", ru: "поливать цветы" }
  - { pl: "w kwiecie wieku", ru: "в расцвете лет" }
etymology: "Праславянское *květъ — то же слово, что русские «цвет» и «цветок». Польское kw- регулярно отвечает русскому цв-: kwiat «цвет», kwitnąć «цвести», kwiecień «апрель», месяц цветения."
memory: "kwiat — «цветок». Польское kw- регулярно отвечает русскому цв-: kwiat «цвет», kwitnąć «цвести», kwiecień «апрель». И запомните оборот w kwiecie wieku «в расцвете лет»."
idioms:
  - { pl: "bukiet kwiatów", ru: "букет цветов" }
  - { pl: "w kwiecie wieku", ru: "в расцвете лет" }
  - { pl: "kwiat paproci", ru: "цветок папоротника" }
formExamplesSkip:
  - { form: "kwiatowi", reason: "в корпусе нет примеров для этой формы" }
