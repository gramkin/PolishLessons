  - form: "ponad"
    pl: "Kocham Cię ponad wszystko na świecie."
    ru: "Я люблю тебя больше всего на свете."
    source: { kind: tatoeba, id: 1630777 }
  - form: "ponad"
    pl: "Ponad sześćdziesiąt osób zostało aresztowanych."
    ru: "Более шестидесяти человек было арестовано."
    source: { kind: tatoeba, id: 3657921 }
