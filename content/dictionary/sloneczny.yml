notes:
  - { kind: usage, text: "Тридцать три формы — это одиннадцать падежных форм, повторённых трижды: положительная степень słoneczny, сравнительная SŁONECZNIEJSZY и превосходная NAJSŁONECZNIEJSZY. Сравните с fizyczny, у которого форм только одиннадцать: он относит предмет к разряду, а не измеряет качество, и сравнивать там нечего. Солнечность же бывает больше и меньше, поэтому степени есть." }
  - { kind: pronunciation, text: "Мужская личная форма множественного смягчается во всех трёх степенях, но по-разному. В положительной n переходит в мягкое ń: SŁONECZNI. В сравнительной и превосходной смягчается уже sz, переходя в s: SŁONECZNIEJSI, NAJSŁONECZNIEJSI. Это та же мена, что в suchy — susi, и заметить её легче на слух, чем на письме." }
  - { kind: usage, text: "Превосходная степень строится одним словом, приставкой NAJ- к сравнительной: słoneczniejszy — najsłoneczniejszy. Русский в этом месте добавляет отдельное слово «самый», и соблазн сказать «najbardziej słoneczny» велик. Так говорят только с теми прилагательными, у которых своих степеней нет." }
collocations:
  - { pl: "słoneczny dzień", ru: "солнечный день" }
  - { pl: "strona słoneczna", ru: "солнечная сторона" }
  - { pl: "okulary słoneczne", ru: "солнечные очки" }
family:
  - { pl: "słońce", ru: "солнце", relation: root, id: slonce }
  - { pl: "słonecznik", ru: "подсолнух", relation: derived }
  - { pl: "słonecznie", ru: "солнечно", relation: derived }
etymology: "От SŁOŃCE, из праславянского *sъlnьce — того же слова, что русское «солнце». Прилагательное собрано тем же суффиксом, что и наше «солнечный», так что słoneczny и «солнечный» — это одно образование, разошедшееся только в написании. Отсюда же słonecznik «подсолнух», буквально «тянущийся к солнцу»."
memory: "Тридцать три формы — это одиннадцать на три степени, в отличие от fizyczny с его одиннадцатью. И превосходная степень одним словом: najsłoneczniejszy, а не «najbardziej słoneczny»."
idioms:
