etymology: "Сложено из PRAWDA «правда» и PODOBNY «подобный»: буквально «похожий на правду». Принято считать, что это перевод по частям с немецкого WAHRSCHEINLICH, где WAHR значит «правда», а SCHEINLICH «кажущийся»; польский взял немецкую постройку и собрал её из своих слов. Русский для того же понятия пошёл совсем другим путём и взял корень «вера»: «вероятный» это буквально «веру емлющий». А русское «правдоподобный», которое выглядит точным двойником польского слова, осталось при первоначальном узком смысле. Выходит, три языка назвали вероятность тремя разными образами: немецкий и польский через видимость правды, русский через веру."
memory: "Собрано из prawda и podobny, то есть ровно как русское «правдоподобный», но значит обычное «вероятный». Русское слово узкое и книжное, польское повседневное, и это вся разница. Начинать стоит не с прилагательного, а с наречий: prawdopodobnie «вероятно» и najprawdopodobniej «скорее всего». Две конструкции: jest prawdopodobne, że с изъявительным и mało prawdopodobne, żeby с прошедшим, та же разница, что между «что» и «чтобы». Существительное prawdopodobieństwo значит «вероятность»."
