notes:
  - { kind: false-friend, text: "Русское «правдоподобный» собрано из тех же самых частей, что и польское слово: правда плюс подобный, PRAWDA плюс PODOBNY. Но значения разошлись. Русское слово узкое и книжное: «похожий на правду», так говорят о рассказе или отговорке. Польское PRAWDOPODOBNY — это обычное повседневное «вероятный», и им описывают погоду, аварию, результат выборов. Поэтому PRAWDOPODOBNY WYNIK это «вероятный результат», а не «правдоподобный». Русскому «вероятный» в польском отвечает именно это слово, а не какое-нибудь производное от WIARA." }
  - { kind: usage, text: "Само прилагательное встречается реже, чем два его производных, и начинать лучше с них. Наречие PRAWDOPODOBNIE значит «вероятно, скорее всего» и слышится постоянно: PRAWDOPODOBNIE SIĘ SPÓŹNIĘ. Форма превосходной степени наречия NAJPRAWDOPODOBNIEJ — это ровно русское «скорее всего». Тридцать три формы прилагательного образуются регулярно, только N перед окончанием смягчается: PRAWDOPODOBNIEJSZY, а не «prawdopodobnejszy». Существительное PRAWDOPODOBIEŃSTWO значит «вероятность», в том числе математическую." }
  - { kind: government, text: "Чаще всего слово стоит в безличном обороте со средней формой и союзом ŻE: JEST PRAWDOPODOBNE, ŻE ZDĄŻYMY — «вероятно, что мы успеем». При отрицательном смысле вместо ŻE идёт ŻEBY с прошедшим временем: MAŁO PRAWDOPODOBNE, ŻEBY ZDĄŻYŁ «маловероятно, чтобы он успел», и это та же разница, что в русском между «что» и «чтобы». Степень задаётся наречиями MAŁO «мало», BARDZO «очень», WYSOCE «весьма», и MAŁO PRAWDOPODOBNE употребительнее, чем целое отрицание." }
  - { kind: pronunciation, text: "Читается «правдоподо́бны», пять слогов, ударение на предпоследнем, то есть на DOB. Слово длинное, но читается ровно по буквам, без неожиданностей: PRAW как «прав», DO как «до», PO как «по». Буква Y на конце — «ы». В наречии ударение сдвигается вместе со слогами: PRAWDOPODOBNIE звучит «правдоподо́бне», а NAJPRAWDOPODOBNIEJ — «найправдоподо́бней». В сравнительной степени слогов становится семь, и ударение снова падает на предпоследний: «правдоподобне́йшы»." }
  - { kind: register, text: "Слово нейтральное и одинаково уместно в отчёте, в прогнозе погоды и в разговоре. Частые обороты: MAŁO PRAWDOPODOBNE «маловероятно», BARDZO PRAWDOPODOBNE «очень вероятно», PRAWDOPODOBNA PRZYCZYNA «вероятная причина», RACHUNEK PRAWDOPODOBIEŃSTWA «теория вероятностей». В живой речи вместо длинного прилагательного часто говорят просто MOŻLIWE «возможно» или CHYBA «кажется», но в письменном языке PRAWDOPODOBNIE держится твёрдо." }
