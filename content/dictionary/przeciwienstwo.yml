notes:
  - { kind: usage, text: "Самое важное в карточке — оборот W PRZECIWIEŃSTWIE DO с родительным падежом, который значит «в отличие от» и в письменном польском встречается постоянно: W PRZECIWIEŃSTWIE DO BRATA, W PRZECIWIEŃSTWIE DO ZAPOWIEDZI. Русское «в противоположность» существует, но звучит книжно, и обычный перевод — «в отличие от». Это тот случай, когда дословный перевод понятен, но стилистически тяжелее оригинала. Кроме оборота слово употребляется прямо: BYĆ PRZECIWIEŃSTWEM KOGOŚ «быть противоположностью кого-то», с творительным." }
  - { kind: government, text: "Средний род на -O, и парадигма у него той же экономной формы, что у KINO, SZKŁO и BOISKO: именительный, винительный и звательный единственного совпадают в PRZECIWIEŃSTWO, а родительный единственного и именительный множественного — в PRZECIWIEŃSTWA. Отсюда девять форм, а не десять. Чего противоположность — родительный без предлога: PRZECIWIEŃSTWO ODWAGI. Кем быть — творительный: JEST PRZECIWIEŃSTWEM BRATA. В обороте W PRZECIWIEŃSTWIE DO падеж после DO всегда родительный." }
  - { kind: pronunciation, text: "Читается «пшэчиве́ньстфо», ударение на предпоследнем слоге, то есть на -WIEŃ-: PRZE-CI-WIEŃ-STWO. Начальное PRZE даёт «пшэ», CI — «чи», WIEŃ — «вень» с мягким н, а STWO на конце звучит «стфо», с оглушением W в «ф». Слово длинное и требует проговаривания по частям, но все его куски уже знакомы из других слов: PRZECIW «против», -EŃSTWO как в MAŁŻEŃSTWO «брак»." }
  - { kind: false-friend, text: "Значение совпадает с русской «противоположностью», и ловушки в смысле нет. Зато есть ловушка в выборе: польское PRZECIWIEŃSTWO и SPRZECZNOŚĆ делят то, что русский называет «противоречием». PRZECIWIEŃSTWO есть противоположность, два полюса одного свойства: PRZECIWIEŃSTWO CIEPŁA «противоположность тепла». SPRZECZNOŚĆ есть логическое противоречие, когда два утверждения не могут быть верны разом: SPRZECZNOŚĆ W ZEZNANIACH «противоречие в показаниях». Русское «противоречие» покрывает оба, и выбирать приходится по смыслу." }
