etymology: "От предлога PRZECIW «против», из праславянского *protivъ — того же, что русские «против», «противный», «напротив». Суффикс -EŃSTWO образует отвлечённые существительные от основ на мягкую согласную и знаком из MAŁŻEŃSTWO «брак», BEZPIECZEŃSTWO «безопасность», PIERWSZEŃSTWO «первенство, преимущество». То есть PRZECIWIEŃSTWO собрано совершенно прозрачно: «противность» как свойство быть напротив. Русская «противоположность» построена сложнее, из «противо» и «положить», то есть «положенное напротив», и в ней на одну ступень больше. Смысл один, но польское слово короче по строению, а русское по звучанию."
memory: "Главное — оборот w przeciwieństwie DO с родительным: «в отличие от». Девять форм, как у kino и boisko: przeciwieństwa служит родительному единственного и именительному множественного. Не путать со sprzeczność: przeciwieństwo — два полюса одного свойства, sprzeczność — логическое противоречие. Суффикс -eństwo как в małżeństwo и bezpieczeństwo."
idioms:
