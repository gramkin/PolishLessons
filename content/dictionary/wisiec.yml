  - form: "wisisz"
    pl: "Nic mi nie wisisz."
    ru: "Ты мне ничего не должен."
    source: { kind: authored }
  - form: "wiszą"
    pl: "Ciemne chmury wiszą nad miastem."
    ru: "Тёмные тучи висят над городом."
    source: { kind: translated, id: 13459485 }
  - form: "wiszą"
    pl: "Nad dwoma dużymi oknami wiszą jedwabne zasłony."
    ru: "Над двумя большими окнами висят шёлковые занавески."
    source: { kind: translated, id: 683328 }
  - form: "wiszą"
    pl: "Ubrania wiszą w szafie."
    ru: "Одежда висит в шкафу."
    source: { kind: authored }
  - form: "wiszące"
    pl: "Tom lubił patrzeć na obrazki wiszące na ścianach u Mary."
    ru: "Тому нравилось смотреть на картинки, висящие на стенах у Мэри."
    source: { kind: translated, id: 3652867 }
  - form: "wiszące"
    pl: "Wiszące kwiaty zdobią balkon."
    ru: "Висящие цветы украшают балкон."
    source: { kind: authored }
  - form: "wiszące"
    pl: "Lampy wiszące nad stołem są nowe."
    ru: "Лампы, висящие над столом, новые."
    source: { kind: authored }
  - form: "wiszący"
    pl: "Dłuższą chwilę patrzyłam na obraz wiszący na ścianie."
    ru: "Я долго смотрела на картину, висящую на стене."
    source: { kind: translated, id: 6300535 }
  - form: "wiszący"
