  - form: "wisi"
    pl: "Kalendarz wisi na ścianie."
    ru: "Календарь висит на стене."
    source: { kind: translated, id: 2805594 }
  - form: "wisiał"
    pl: "Ciemnobrązowy kapelusz wisiał na płocie."
    ru: "Тёмно-коричневая шляпа висела на заборе."
    source: { kind: translated, id: 1350342 }
  - form: "wisiał"
    pl: "Na ścianie wisiał portret starego mężczyzny."
    ru: "На стене висел портрет старого мужчины."
    source: { kind: translated, id: 1359961 }
  - form: "wisiał"
    pl: "Tam stał czarny stół i krzesła, a tu wisiał na ścianie zegar."
    ru: "Там стоял чёрный стол и стулья, а тут, на стене, висели часы."
    source: { kind: tatoeba, id: 11570720 }
  - form: "wisiały"
    pl: "Jego rysunki wisiały na ścianie."
    ru: "Его рисунки висели на стене."
    source: { kind: translated, id: 11259785 }
  - form: "wisiały"
    pl: "Krzesło było zbyt wysokie i zauważyłem, że moje nogi wisiały w powietrzu."
    ru: "Стул был слишком высокий, и я заметил, что мои ноги висели в воздухе."
    source: { kind: translated, id: 2189392 }
  - form: "wisiały"
    pl: "Klucze wisiały przy drzwiach."
    ru: "Ключи висели у двери."
    source: { kind: authored }
  - form: "wisieć"
    pl: "Co ma wisieć nie utonie."
    ru: "Чему быть, того не миновать."
    source: { kind: translated, id: 13662016 }
  - form: "wisieć"
    pl: "Co ma wisieć, nie utonie."
