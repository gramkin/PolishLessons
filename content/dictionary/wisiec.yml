# review
id: wisiec
format: 2
lemma: "wisieć"
rank: 1857
pos: verb
aspect: imperf
pron: { cyr: "ви́сець" }
senses:
  - id: hang
    ru: "висеть"
    examples:
      - pl: "Mapa wisi na ścianie."
        ru: "Карта висит на стене."
        source: { kind: translated, id: 2757120 }
      - pl: "Obraz wisi nad stołem."
        ru: "Картина висит над столом."
        source: { kind: translated, id: 716759 }
      - pl: "Drugie lustro wisi obok drzwi."
        ru: "Второе зеркало висит рядом с дверью."
        source: { kind: tatoeba, id: 1550617 }
  - id: owe
    ru: "быть должным (разг.)"
    examples:
      - pl: "Wisisz mi piwo."
        ru: "Ты должен мне пиво."
        source: { kind: translated, id: 3585648 }
      - pl: "Ile ci wiszę?"
        ru: "Сколько я тебе должен?"
        source: { kind: translated, id: 11669040 }
      - pl: "Wiszę jej dziesięć dolarów."
        ru: "Я должен ей десять долларов."
        source: { kind: translated, id: 6360065 }
notes:
  - { kind: false-friend, text: "Второе значение русскому уху неожиданно: wisieć komuś значит «быть должным кому-то». Wisisz mi piwo — «ты должен мне пиво», Ile ci wiszę? — «сколько я тебе должен?»" }
  - { kind: government, text: "Висеть на чём-то — wisieć na czymś (предложный падеж): wisi na ścianie. Быть должным кому-то — wisieć komuś (дательный)." }
  - { kind: usage, text: "wisieć na włosku — «висеть на волоске»; wisieć w powietrzu — «висеть в воздухе», о напряжении." }
  - { kind: usage, text: "Пословица Co ma wisieć, nie utonie — «Чему быть, того не миновать», буквально «кому висеть, тот не утонет»." }
collocations:
  - { pl: "wisieć na ścianie", ru: "висеть на стене" }
  - { pl: "wisieć na włosku", ru: "висеть на волоске" }
  - { pl: "ile ci wiszę", ru: "сколько я тебе должен" }
family:
  - { pl: "powiesić", ru: "повесить", relation: root }
  - { pl: "wisiorek", ru: "кулон", relation: root }
  - { pl: "leżeć", ru: "лежать", relation: root, id: lezec }
etymology: "Праславянское *viseti — то же слово, что русское «висеть». Значение «быть должным» развилось уже в польском: долг «висит» на человеке."
memory: "wisieć — «висеть»: wisi na ścianie. Но разговорно ещё и «быть должным»: Wisisz mi piwo «ты должен мне пиво», Ile ci wiszę? «сколько я тебе должен?»"
idioms:
  - { pl: "wisieć na włosku", ru: "висеть на волоске" }
  - { pl: "co ma wisieć, nie utonie", ru: "чему быть, того не миновать" }
  - { pl: "ile ci wiszę?", ru: "сколько я тебе должен?" }
