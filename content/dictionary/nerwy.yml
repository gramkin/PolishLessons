# review
id: nerwy
format: 2
lemma: "nerwy"
rank: 4682
pos: noun
pron: { cyr: "нэ́рвы" }
senses:
  - id: nerves
    ru: "нервы, нервное напряжение"
    examples:
      - pl: "Ten hałas działa mi na nerwy."
        ru: "Этот шум действует мне на нервы."
        source: { kind: authored }
      - pl: "Przed egzaminem puściły jej nerwy."
        ru: "Перед экзаменом у неё сдали нервы."
        source: { kind: authored }
      - pl: "Jest kłębkiem nerwów."
        ru: "Она — сплошной комок нервов."
        source: { kind: authored }
  - id: composure
    ru: "нервы, самообладание"
    examples:
      - pl: "Chirurg musi mieć mocne nerwy."
        ru: "У хирурга должны быть крепкие нервы."
        source: { kind: authored }
      - pl: "Trzymaj nerwy na wodzy."
        ru: "Держи себя в руках."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Пять форм, только множественное число в этой карточке; анатомический «нерв» — отдельное слово NERW. В значении «волнение, раздражение» слово всегда во множественном, как по-русски: NERWY MU PUŚCIŁY — «у него сдали нервы»." }
  - { kind: false-friend, text: "DENERWOWAĆ SIĘ — не что-то медицинское, а просто «нервничать, злиться»: NIE DENERWUJ SIĘ! — «не нервничай!». DENERWOWAĆ KOGOŚ — «раздражать, бесить»: TO MNIE DENERWUJE — «меня это бесит». NERWOWY — «нервный», и о человеке, и о ситуации." }
  - { kind: government, text: "Действовать на нервы — DZIAŁAĆ KOMUŚ NA NERWY, дательный и NA с винительным. Играть на нервах — GRAĆ NA NERWACH, местный. Комок нервов — KŁĘBEK NERWÓW, родительный." }
  - { kind: pronunciation, text: "Читается «нэ́рвы», два слога, ударение на первом. E после N твёрдое, «э». В родительном NERWÓW конечное W оглушается: «нэ́рвуф»." }
  - { kind: register, text: "Оборотов много, и почти все совпадают с русскими: STALOWE NERWY — «стальные нервы», WOJNA NERWÓW — «война нервов». TRZYMAĆ NERWY NA WODZY, «держать нервы на поводу», — «держать себя в руках»." }
collocations:
  - { pl: "stalowe nerwy", ru: "стальные нервы" }
  - { pl: "wojna nerwów", ru: "война нервов" }
  - { pl: "puściły mu nerwy", ru: "у него сдали нервы" }
family:
  - { pl: "nerw", ru: "нерв", relation: root, id: nerw }
  - { pl: "nerwowy", ru: "нервный", relation: derived, id: nerwowy }
  - { pl: "denerwowac", ru: "раздражать; нервничать (denerwować się)", relation: derived, id: denerwowac }
etymology: "Из латинского NERVUS «жила, сухожилие». В значении «нервная система» слово пришло в оба языка через медицинскую латынь, поэтому польские NERWY и русские «нервы» совпадают."
memory: "Nerwy — нервы: działać komuś na nerwy, kłębek nerwów. Читается «нэ́рвы». Puściły mu nerwy — у него сдали нервы. Denerwować się — нервничать; to mnie denerwuje — меня это бесит."
idioms:
  - { pl: "działać komuś na nerwy", ru: "действовать кому-то на нервы" }
  - { pl: "kłębek nerwów", ru: "комок нервов" }
  - { pl: "trzymać nerwy na wodzy", ru: "держать себя в руках" }
