# review
id: ni
format: 2
lemma: "ni"
rank: 2481
pos: conj
pron: { cyr: "ні" }
senses:
  - id: neither-nor
    ru: "ни... ни"
    examples:
      - pl: "Ni ryba ni mięso."
        ru: "Ни рыба ни мясо."
        source: { kind: authored }
      - pl: "Nie ma go ni w domu, ni w pracy."
        ru: "Нет его ни дома, ни на работе."
        source: { kind: authored }
  - id: out-of-nowhere
    ru: "ni stąd ni zowąd — ни с того ни с сего"
    examples:
      - pl: "Ni stąd, ni zowąd zaczął krzyczeć."
        ru: "Ни с того ни с сего он начал кричать."
        source: { kind: authored }
      - pl: "Zjawił się ni stąd, ni zowąd."
        ru: "Он появился ни с того ни с сего."
        source: { kind: authored }
  - id: not-a-word
    ru: "ни (усиление отрицания)"
    examples:
      - pl: "Ni słowa więcej."
        ru: "Ни слова больше."
        source: { kind: authored }
notes:
  - { kind: register, text: "В СОВРЕМЕННОЙ РЕЧИ ЭТО СЛОВО ПОЧТИ НЕ ЖИВЁТ САМО. Обычный польский союз «ни... ни» — ANI... ANI: ani w domu, ani w pracy. NI сохранилось в книжном стиле и в застывших оборотах: ni ryba ni mięso, ni stąd ni zowąd, ni z tego ni z owego. Строить с ним новые фразы не стоит, но узнавать надо." }
  - { kind: false-friend, text: "Русское «ни» — то же самое слово, и обороты совпали буквально. Ni ryba ni mięso это «ни рыба ни мясо», ni stąd ni zowąd — «ни с того ни с сего». Совпадение настолько полное, что эти выражения можно переводить слово в слово, чего с польскими идиомами почти не бывает." }
  - { kind: pronunciation, text: "Один слог: ні. Ni читается как мягкое нь с проскальзывающим и: «ні». В оборотах слово безударно и произносится слитно со следующим: «ні-ры́ба»." }
collocations:
  - { pl: "ni ryba ni mięso", ru: "ни рыба ни мясо" }
  - { pl: "ni stąd ni zowąd", ru: "ни с того ни с сего" }
  - { pl: "ni słowa", ru: "ни слова" }
family:
  - { pl: "ani", ru: "ни (обычная форма)", relation: root, id: ani }
  - { pl: "nie", ru: "не", relation: root, id: nie }
  - { pl: "oraz", ru: "и, а также", relation: antonym, id: oraz }
etymology: "Из праславянского *ni, того же, что русское «ни», сращения отрицания *ne и частицы *i «и». Польский позже усилил его до ani, добавив a-, и ani вытеснило простое ni из живой речи, оставив ему только устойчивые обороты."
memory: "ni — «ни», то же слово, что русское, но в живой речи его заменило ANI. Осталось в застывших оборотах, и они переводятся буквально: ni ryba ni mięso, ni stąd ni zowąd."
