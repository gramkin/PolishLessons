notes:
  - { kind: false-friend, text: "PAPIEŻ — только «Папа Римский». Папа-отец — TATA. Для поляков это слово прочно связано с Иоанном Павлом II, PAPIEŻ POLAK." }
  - { kind: usage, text: "Одиннадцать форм, мужской род, лицо. Во множественном — PAPIEŻE, в родительном множественного две формы: PAPIEŻY и PAPIEŻÓW. Местный и звательный — PAPIEŻU." }
  - { kind: government, text: "Аудиенция у Папы — AUDIENCJA U PAPIEŻA, U с родительным. Встреча с Папой — SPOTKANIE Z PAPIEŻEM. Избрать Папой — WYBRAĆ NA PAPIEŻA." }
  - { kind: pronunciation, text: "Читается «па́пеш», ударение на первом слоге. PIE — «пе», конечное Ż оглушается в «ш»." }
collocations:
  - { pl: "papież Polak", ru: "Папа-поляк" }
  - { pl: "wybór papieża", ru: "выборы Папы" }
  - { pl: "audiencja u papieża", ru: "аудиенция у Папы" }
family:
  - { pl: "papieski", ru: "папский", relation: derived }
  - { pl: "papiestwo", ru: "папство", relation: derived }
  - { pl: "papieżyca", ru: "папесса", relation: derived }
etymology: "Из латинского PAPA «отец» через чешский и древненемецкий. В польском слово закрепилось только за главой Католической церкви."
memory: "Papież — Папа Римский; tata — папа. Читается «па́пеш». Papież Polak — Иоанн Павел II. Bardziej papieski od papieża — святее Папы Римского."
idioms:
  - { pl: "być bardziej papieskim od papieża", ru: "быть святее Папы Римского" }
