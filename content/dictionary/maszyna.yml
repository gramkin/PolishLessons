# review
id: maszyna
format: 2
lemma: "maszyna"
rank: 1215
pos: noun
pron: { cyr: "машы́на" }
senses:
  - id: machine
    ru: "машина, механизм, станок"
    examples:
      - pl: "Maszyna nie działa."
        ru: "Машина не работает."
        source: { kind: translated, id: 1465611 }
      - pl: "Komputer to skomplikowana maszyna."
        ru: "Компьютер — сложная машина."
        source: { kind: translated, id: 440660 }
      - pl: "Ja sam naprawię tę maszynę."
        ru: "Я сам починю эту машину."
        source: { kind: translated, id: 1165273 }
  - id: typewriter
    ru: "pisać na maszynie — печатать на машинке"
    examples:
      - pl: "Potrafisz pisać na maszynie?"
        ru: "Умеешь печатать на машинке?"
        source: { kind: translated, id: 12351122 }
      - pl: "Potrafię pisać na maszynie 50 słów na minutę."
        ru: "Я умею печатать пятьдесят слов в минуту."
        source: { kind: translated, id: 525696 }
  - id: figurative
    ru: "машина (о человеке, системе)"
    examples:
      - pl: "Ludzkie ciało jest jakąś maszyną."
        ru: "Человеческое тело — своего рода машина."
        source: { kind: translated, id: 2849225 }
      - pl: "Mózg jest tylko skomplikowaną maszyną."
        ru: "Мозг — всего лишь сложная машина."
        source: { kind: translated, id: 526877 }
notes:
  - { kind: false-friend, text: "Главная ловушка: maszyna — это станок, механизм, а не автомобиль. Машина в смысле «автомобиль» по-польски samochód или разговорное wóz." }
  - { kind: usage, text: "pisać na maszynie значит «печатать на пишущей машинке» — оборот с предлогом na и предложным падежом." }
  - { kind: usage, text: "Женский род, склоняется как kobieta: maszyna, maszyny, maszynie, maszynę." }
  - { kind: usage, text: "maszyna do szycia «швейная машина», maszyna do pisania «пишущая машинка», pralka to не maszyna, а отдельное слово." }
collocations:
  - { pl: "maszyna do pisania", ru: "пишущая машинка" }
  - { pl: "pisać na maszynie", ru: "печатать на машинке" }
  - { pl: "maszyna do szycia", ru: "швейная машина" }
family:
  - { pl: "maszynowy", ru: "машинный", relation: derived }
  - { pl: "maszynista", ru: "машинист", relation: derived }
  - { pl: "samochód", ru: "автомобиль", relation: antonym, id: samochod }
etymology: "Через немецкое Maschine из латинского machina, а то из греческого mēchanē «орудие, приспособление». Русская «машина» — то же заимствование."
memory: "maszyna — «машина» в смысле станка или механизма, но не автомобиля: тот будет samochód. А pisać na maszynie значит «печатать на пишущей машинке»."
idioms:
  - { pl: "maszyna do pisania", ru: "пишущая машинка" }
  - { pl: "pisać na maszynie", ru: "печатать на машинке" }
formExamplesSkip:
  - { form: "maszyno", reason: "звательный падеж у этого слова в живой речи не употребляется" }
