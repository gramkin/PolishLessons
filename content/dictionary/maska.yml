# review
id: maska
format: 2
lemma: "maska"
rank: 1785
pos: noun
pron: { cyr: "ма́ска" }
senses:
  - id: mask
    ru: "маска"
    examples:
      - pl: "Załóż maskę."
        ru: "Надень маску."
        source: { kind: translated, id: 11015209 }
      - pl: "Nosiła maskę."
        ru: "Она носила маску."
        source: { kind: translated, id: 9348361 }
      - pl: "Dwóch mężczyzn w maskach obrabowało bank."
        ru: "Двое мужчин в масках ограбили банк."
        source: { kind: translated, id: 1353767 }
  - id: car-hood
    ru: "капот (автомобиля)"
    examples:
      - pl: "Otwórz maskę."
        ru: "Открой капот."
        source: { kind: translated, id: 5275525 }
      - pl: "Tom usiadł na masce swojego auta."
        ru: "Том сел на капот своей машины."
        source: { kind: translated, id: 3973774 }
  - id: facade
    ru: "маска (притворство)"
    examples:
      - pl: "Ukrywała smutek pod maską uśmiechu."
        ru: "Она скрывала грусть под маской улыбки."
        source: { kind: translated, id: 353922 }
notes:
  - { kind: false-friend, text: "Второе значение русскому уху неожиданно: maska — это ещё и «капот» автомобиля. Otwórz maskę значит «открой капот», а не «сними маску»." }
  - { kind: usage, text: "maska gazowa или maska przeciwgazowa — «противогаз»." }
  - { kind: usage, text: "zrzucić maskę — «сбросить маску», перестать притворяться." }
  - { kind: government, text: "Под маской — pod maską (творительный падеж): pod maską uśmiechu; на капоте — na masce (предложный)." }
collocations:
  - { pl: "założyć maskę", ru: "надеть маску" }
  - { pl: "maska gazowa", ru: "противогаз" }
  - { pl: "otworzyć maskę", ru: "открыть капот" }
family:
  - { pl: "maskować", ru: "маскировать", relation: root }
  - { pl: "maskotka", ru: "талисман", relation: root }
etymology: "Через французское masque из арабского; русское «маска» пришло тем же путём. Значение «капот» развилось уже в польском — по сходству с накладкой на лицо."
memory: "maska — «маска», но ещё и «капот» машины: otwórz maskę «открой капот», usiadł na masce «сел на капот». Противогаз — maska gazowa."
idioms:
  - { pl: "zrzucić maskę", ru: "сбросить маску" }
  - { pl: "maska gazowa", ru: "противогаз" }
  - { pl: "pod maską", ru: "под маской" }
