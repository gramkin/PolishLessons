  - id: car-hood
    ru: "капот (автомобиля)"
    examples:
      - pl: "Otwórz maskę."
        ru: "Открой капот."
        source: { kind: translated, id: 5275525 }
      - pl: "Tom usiadł na masce swojego auta."
        ru: "Том сел на капот своей машины."
