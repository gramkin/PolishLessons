notes:
  - { kind: false-friend, text: "ПОЛЬСКОЕ MUNDUR ШИРЕ РУССКОГО «МУНДИРА». У нас мундир — вещь парадная и слегка старомодная, а повседневное слово «форма»: военная форма, школьная форма. По-польски MUNDUR покрывает всё это разом: mundur wojskowy, mundur szkolny, mundur listonosza. Русское «форма» в этом смысле будет właśnie mundur, а польское FORMA значит «форма» как очертание или как состояние спортсмена." }
  - { kind: pronunciation, text: "Предложный падеж — MUNDURZE, с переходом r в rz. Это уже знакомое чередование: pasażer — pasażerze, procedura — procedurze, aktor — aktorze. Родительный единственного — MUNDURU, с окончанием -u, как soku и aresztu." }
collocations:
  - { pl: "mundur wojskowy", ru: "военная форма" }
  - { pl: "w mundurze", ru: "в форме" }
  - { pl: "mundur galowy", ru: "парадная форма" }
family:
  - { pl: "mundurowy", ru: "форменный; человек в форме", relation: derived }
  - { pl: "umundurowanie", ru: "обмундирование", relation: derived }
  - { pl: "cywil", ru: "штатский", relation: antonym }
etymology: "Из французского monture через немецкое Montur «снаряжение, обмундирование». Русский «мундир» пришёл той же дорогой в петровское время, поэтому слова совпадают до буквы. Разошлось употребление: у нас слово сузилось до парадного, а польское осталось общим названием служебной одежды. Отсюда же наше «обмундирование» и польское umundurowanie."
memory: "mundur — это любая форменная одежда, не только парадный мундир: mundur szkolny, mundur listonosza. А предложный мягкий: w mundurze, как w pasażerze."
idioms:
  - { pl: "w mundurze", ru: "в форме, при исполнении" }
  - { pl: "ziemniaki w mundurkach", ru: "картошка в мундире" }
formExamplesSkip:
  - { form: "mundurze", cell: "Звательный", reason: "звательный падеж: для неодушевлённого существительного он практически не употребляется" }
