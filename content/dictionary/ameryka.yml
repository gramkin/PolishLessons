# review
id: ameryka
format: 2
lemma: "Ameryka"
rank: 1470
pos: noun
pron: { cyr: "амэ́рыка" }
senses:
  - id: america
    ru: "Америка (континент и США)"
    examples:
      - pl: "Urodziłem się w Ameryce."
        ru: "Я родился в Америке."
        source: { kind: tatoeba, id: 1604670 }
      - pl: "Ameryka jest bardzo duża."
        ru: "Америка очень большая."
        source: { kind: translated, id: 557532 }
      - pl: "Oni przeprowadzają się do Ameryki Północnej."
        ru: "Они переезжают в Северную Америку."
        source: { kind: tatoeba, id: 13616090 }
  - id: discovery
    ru: "Америка в оборотах об открытии и поездках"
    examples:
      - pl: "Kolumb odkrył Amerykę."
        ru: "Колумб открыл Америку."
        source: { kind: translated, id: 10597676 }
      - pl: "Mówią, że wikingowie odkryli Amerykę jeszcze przed Kolumbem."
        ru: "Говорят, что викинги открыли Америку ещё до Колумба."
        source: { kind: tatoeba, id: 1863913 }
notes:
  - { kind: usage, text: "Два значения, как и в русском: континент (Ameryka Północna «Северная Америка») и США. Различает контекст." }
  - { kind: government, text: "Направление — do Ameryki, с родительным; местонахождение — w Ameryce, с предложным: Lecę do Ameryki, ale mieszkam w Ameryce." }
  - { kind: usage, text: "Житель — Amerykanin и Amerykanka, прилагательное — amerykański." }
  - { kind: usage, text: "odkrywać Amerykę — «открывать Америку», то есть объявлять очевидное. Выражение совпадает с русским полностью." }
collocations:
  - { pl: "w Ameryce", ru: "в Америке" }
  - { pl: "do Ameryki", ru: "в Америку" }
  - { pl: "Ameryka Północna", ru: "Северная Америка" }
etymology: "От имени Америго Веспуччи через латинскую форму Americus. Русская «Америка» пришла тем же путём, поэтому слова совпадают полностью."
memory: "Ameryka — «Америка», и континент, и США, ровно как в русском. Направление — do Ameryki, место — w Ameryce. А odkrywać Amerykę значит то же, что по-русски: объявлять очевидное."
idioms:
  - { pl: "odkrywać Amerykę", ru: "открывать Америку" }
  - { pl: "Ameryka Północna", ru: "Северная Америка" }
  - { pl: "wujek z Ameryki", ru: "дядюшка из Америки" }
