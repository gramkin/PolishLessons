# review
id: swiadek
format: 2
lemma: "świadek"
rank: 689
pos: noun
pron: { cyr: "сьвя́дэк" }
senses:
  - id: witness
    ru: "свидетель"
    note: "Беглое e: świadek, но świadka."
    examples:
      - pl: "Był jeden świadek."
        ru: "Был один свидетель."
        source: { kind: tatoeba, id: 3761551 }
      - pl: "Nasz jedyny świadek odmawia zeznań."
        ru: "Наш единственный свидетель отказывается давать показания."
        source: { kind: translated, id: 998711 }
      - pl: "Może świadek opisać, co się wydarzyło?"
        ru: "Может ли свидетель описать, что произошло?"
        source: { kind: translated, id: 959246 }
  - id: be-witness
    ru: "być świadkiem — быть свидетелем (творительный)"
    examples:
      - pl: "Bóg mi świadkiem, zrobiliśmy wszystko, co w naszej mocy."
        ru: "Бог свидетель, мы сделали всё, что могли."
        source: { kind: tatoeba, id: 3656727 }
      - pl: "Byłem świadkiem."
        ru: "Я был свидетелем."
        source: { kind: translated, id: 8500332 }
      - pl: "Była świadkiem przestępstwa."
        ru: "Она была свидетельницей преступления."
        source: { kind: translated, id: 731986 }
  - id: witnesses
    ru: "świadkowie — свидетели"
    examples:
      - pl: "Czy byli świadkowie?"
        ru: "Были ли свидетели?"
        source: { kind: translated, id: 8500258 }
      - pl: "Świadkowie muszą składać zeznania pod przysięgą."
        ru: "Свидетели должны давать показания под присягой."
        source: { kind: translated, id: 7334691 }
      - pl: "Nie ma świadków wypadku."
        ru: "Свидетелей происшествия нет."
        source: { kind: translated, id: 368996 }
notes:
  - { kind: usage, text: "Беглое e выпадает в косвенных падежах: świadek, но świadka, świadkowi, świadkiem." }
  - { kind: government, text: "«Быть свидетелем чего-то» — творительный плюс родительный: była świadkiem przestępstwa «она была свидетельницей преступления»." }
  - { kind: usage, text: "Мужское личное склонение: именительный множественного — świadkowie, а винительный совпадает с родительным (przekupić świadka)." }
  - { kind: usage, text: "Устойчивое Bóg mi świadkiem «Бог мне свидетель» — творительный без глагола. А Świadkowie Jehowy — «Свидетели Иеговы»." }
collocations:
  - { pl: "być świadkiem", ru: "быть свидетелем" }
  - { pl: "Bóg mi świadkiem", ru: "Бог мне свидетель" }
  - { pl: "naoczny świadek", ru: "очевидец" }
  - { pl: "zeznania świadków", ru: "показания свидетелей" }
family:
  - { pl: "świadczyć", ru: "свидетельствовать", relation: root }
  - { pl: "świadectwo", ru: "свидетельство", relation: derived }
  - { pl: "wiedzieć", ru: "знать", relation: root }
etymology: "От świadczyć «свидетельствовать», праславянский корень *věd- «ведать» — то же гнездо, что русские «ведать», «свидетель» и «совесть»."
memory: "świadek — «свидетель», и корень тот же, что в русском: от «ведать». Запомнить надо две вещи. Беглое e: świadek, но świadka, świadkowi. И творительный падеж в конструкции: być świadkiem, była świadkiem przestępstwa. Устойчивое Bóg mi świadkiem значит «Бог мне свидетель», а множественное — świadkowie."
idioms:
  - { pl: "być świadkiem", ru: "быть свидетелем" }
  - { pl: "Bóg mi świadkiem", ru: "Бог мне свидетель" }
  - { pl: "naoczny świadek", ru: "очевидец" }
