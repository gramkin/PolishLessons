# review
id: drzemka
format: 2
lemma: "drzemka"
rank: 5375
pos: noun
pron: { cyr: "джэ́мка" }
senses:
  - id: nap
    ru: "дрёма, короткий сон"
    examples:
      - pl: "Po obiedzie dziadek ucina sobie drzemkę."
        ru: "После обеда дед дремлет."
        source: { kind: authored }
      - pl: "Krótka drzemka dodaje energii."
        ru: "Короткий сон придаёт энергии."
        source: { kind: authored }
      - pl: "Obudził się z drzemki wypoczęty."
        ru: "Он проснулся после дрёмы отдохнувшим."
        source: { kind: authored }
  - id: snooze
    ru: "повтор сигнала будильника"
    examples:
      - pl: "Wcisnęła drzemkę i spała dalej."
        ru: "Она отложила будильник и спала дальше."
        source: { kind: authored }
      - pl: "Budzik ma funkcję drzemki."
        ru: "У будильника есть функция повтора сигнала."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "DRZEMKA — короткий сон, «дрёма»: UCIĄĆ SOBIE DRZEMKĘ — «вздремнуть», буквально «отрезать себе дрёмку». В телефоне и будильнике DRZEMKA — кнопка повтора сигнала, «ещё пять минут». Глагол DRZEMAĆ — «дремать», ZDRZEMNĄĆ SIĘ — «вздремнуть»." }
  - { kind: usage, text: "Десять форм в таблице, женский род. В дательном и местном падежах K переходит в C: PO DRZEMCE. В родительном множественного беглое E: DRZEMEK. Звательная форма не нужна." }
  - { kind: government, text: "Вздремнуть — UCIĄĆ SOBIE DRZEMKĘ, винительный. Проснуться после дрёмы — OBUDZIĆ SIĘ Z DRZEMKI, Z с родительным. Во время дрёмы — PODCZAS DRZEMKI, родительный." }
  - { kind: pronunciation, text: "Читается «джэ́мка», два слога, ударение на первом. DRZ даёт «дж», как в DRZEWO «джэ́во». В форме DRZEMCE: «джэ́мце»." }
collocations:
  - { pl: "krótka drzemka", ru: "короткий сон" }
  - { pl: "drzemka w ciągu dnia", ru: "дневной сон" }
  - { pl: "funkcja drzemki", ru: "функция повтора будильника" }
family:
  - { pl: "drzemać", ru: "дремать", relation: root }
  - { pl: "zdrzemnąć", ru: "вздремнуть (zdrzemnąć się)", relation: derived }
  - { pl: "drzemiący", ru: "дремлющий", relation: derived }
etymology: "От DRZEMAĆ «дремать», праславянского глагола, общего с русским. Польское DRZ на месте русского «др» перед мягким гласным — как в DRZEWO и «дерево», DRZWI и «двери»."
memory: "Drzemka — дрёма, короткий сон. Читается «джэ́мка». Uciąć sobie drzemkę — вздремнуть. В будильнике drzemka — повтор сигнала. От drzemać — дремать."
idioms:
  - { pl: "uciąć sobie drzemkę", ru: "вздремнуть" }
  - { pl: "poobiednia drzemka", ru: "послеобеденный сон" }
formExamplesSkip:
  - { form: "drzemko", reason: "звательная форма; к дрёме не обращаются" }
  - { form: "drzemki", cell: "Звательный", reason: "звательный падеж: к предмету или понятию не обращаются" }
