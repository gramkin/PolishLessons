# review
id: przywiazac
format: 2
lemma: "przywiązać"
rank: 4257
pos: verb
pron: { cyr: "пшывё́нзаць" }
senses:
  - id: tie
    ru: "привязать"
    examples:
      - pl: "Przywiązał psa do drzewa."
        ru: "Он привязал собаку к дереву."
        source: { kind: authored }
      - pl: "Przywiąż łódź mocnym węzłem."
        ru: "Привяжи лодку крепким узлом."
        source: { kind: authored }
      - pl: "Porywacze przywiązali go do krzesła."
        ru: "Похитители привязали его к стулу."
        source: { kind: authored }
  - id: attach
    ru: "с SIĘ — привязаться (душой)"
    examples:
      - pl: "Przywiązała się do kota."
        ru: "Она привязалась к коту."
        source: { kind: authored }
      - pl: "Dziecko szybko przywiąże się do niani."
        ru: "Ребёнок быстро привяжется к няне."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "PRZYWIĄZAĆ — «привязать», как в русском, и PRZYWIĄZAĆ SIĘ — «привязаться душой». Но «привязаться» в смысле «пристать, прицепиться» — PRZYCZEPIĆ SIĘ: PRZYCZEPIŁ SIĘ DO MNIE. PRZYWIĄZANIE — «привязанность»." }
  - { kind: usage, text: "Пятьдесят три формы. PRZYWIĄZANY — и «привязанный верёвкой», и «привязанный душой»: JEST PRZYWIĄZANY DO DOMU. Будущее с Ż: PRZYWIĄŻĘ, PRZYWIĄŻESZ, повелительное PRZYWIĄŻ. Несовершенный вид — PRZYWIĄZYWAĆ." }
  - { kind: government, text: "Что к чему — винительный и DO с родительным: PRZYWIĄZAĆ PSA DO PŁOTU. С SIĘ — DO с родительным: PRZYWIĄZAĆ SIĘ DO MIEJSCA. Чем — творительный: PRZYWIĄZAĆ SZNURKIEM." }
  - { kind: pronunciation, text: "Читается «пшывё́нзаць»: PRZ — «пш», IĄ перед Z — «ён». Ударение на предпоследнем слоге. PRZYWIĄŻĘ — «пшывё́нжэ»." }
  - { kind: register, text: "Нейтральное слово. PRZYWIĄZAĆ WAGĘ DO CZEGOŚ — книжное «придать значение»; чаще в несовершенном виде: PRZYWIĄZUJĘ DO TEGO WAGĘ." }
collocations:
  - { pl: "przywiązać psa", ru: "привязать собаку" }
  - { pl: "przywiązać się do kogoś", ru: "привязаться к кому-то" }
  - { pl: "przywiązać wagę do czegoś", ru: "придать значение чему-то" }
family:
  - { pl: "wiązać", ru: "вязать, связывать", relation: root, id: wiazac }
  - { pl: "nawiązać", ru: "установить (контакт)", relation: derived, id: nawiazac }
  - { pl: "przywiązanie", ru: "привязанность", relation: derived }
etymology: "Приставка PRZY- «при-» плюс WIĄZAĆ «вязать», праславянское *vęzati. Польское Ą соответствует русскому «я»: PRZYWIĄZAĆ — «привязать»."
memory: "Przywiązać — привязать: przywiązał psa do drzewa. Przywiązać się — привязаться душой. Przywiązanie — привязанность. Читается «пшывё́нзаць»."
idioms:
  - { pl: "przywiązać wagę do czegoś", ru: "придать значение чему-то" }
