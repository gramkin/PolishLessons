# review
id: mrugac
format: 2
lemma: "mrugać"
rank: 2096
pos: verb
aspect: imperf
pron: { cyr: "мру́гаць" }
senses:
  - id: wink
    ru: "подмигивать"
    examples:
      - pl: "Co to oznacza, gdy dziewczyna do ciebie mruga?"
        ru: "Что это значит, когда девушка тебе подмигивает?"
        source: { kind: translated, id: 5988578 }
      - pl: "Mrugał do mnie porozumiewawczo."
        ru: "Он заговорщически мне подмигивал."
        source: { kind: authored }
      - pl: "Nie mrugaj, to nie żart."
        ru: "Не подмигивай, это не шутка."
        source: { kind: authored }
  - id: blink
    ru: "моргать; мигать (о свете)"
    examples:
      - pl: "Mrugam, bo coś mi wpadło do oka."
        ru: "Я моргаю, потому что мне что-то попало в глаз."
        source: { kind: authored }
      - pl: "Światło mruga w ciemności."
        ru: "Свет мигает в темноте."
        source: { kind: authored }
notes:
  - { kind: government, text: "Подмигивают кому-л. через do с родительным: mrugać do kogoś — а не дательным, как в русском «подмигивать кому»." }
  - { kind: usage, text: "Одно слово покрывает и «моргать» (глазами), и «подмигивать» (кому-то), и «мигать» (о лампе)." }
  - { kind: usage, text: "Совершенный вид — mrugnąć «моргнуть, подмигнуть однократно»." }
  - { kind: false-friend, text: "Корень тот же, что в русском «моргать», только с перестановкой: mrug- против «морг-»." }
collocations:
  - { pl: "mrugać do kogoś", ru: "подмигивать кому-л." }
  - { pl: "mrugać oczami", ru: "моргать глазами" }
etymology: "Праславянское *mъrgati; ср. русское «моргать», «мигать» — тот же корень с перестановкой звуков."
memory: "mrugać — и «моргать», и «подмигивать», и «мигать». Ловушка в падеже: mrugać do kogoś, с do и родительным, а не с дательным, как в русском."
idioms:
  - { pl: "mrugać do kogoś", ru: "подмигивать кому-л." }
