# review
id: gospodarka
format: 2
lemma: "gospodarka"
rank: 5933
pos: noun
pron: { cyr: "господа́рка" }
senses:
  - id: economy
    ru: "экономика, народное хозяйство"
    examples:
      - pl: "Chińska gospodarka rośnie szybko."
        ru: "Китайская экономика быстро растёт."
        source: { kind: translated, id: 9679442 }
      - pl: "Handel pomaga naszej gospodarce."
        ru: "Торговля помогает нашей экономике."
        source: { kind: translated, id: 11564180 }
      - pl: "Strajk miał wpływ na gospodarkę kraju."
        ru: "Забастовка повлияла на экономику страны."
        source: { kind: translated, id: 919800 }
  - id: management
    ru: "хозяйствование, обращение с чем-либо"
    note: "с творительным падежом без предлога"
    examples:
      - pl: "Gospodarka odpadami w mieście jest źle zorganizowana."
        ru: "Обращение с отходами в городе плохо организовано."
        source: { kind: authored }
      - pl: "Rabunkowa gospodarka zniszczyła te lasy."
        ru: "Хищническое хозяйствование погубило эти леса."
        source: { kind: authored }
  - id: farm
    ru: "крестьянское хозяйство (разг.)"
    examples:
      - pl: "Syn został na gospodarce po ojcu."
        ru: "Сын остался на хозяйстве после отца."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "GOSPODARKA — не «хозяйка» (это GOSPODYNI), а экономика страны: POLSKA GOSPODARKA «польская экономика». Слово EKONOMIA тоже есть, но чаще называет науку: STUDIOWAĆ EKONOMIĘ «учиться на экономиста»." }
  - { kind: government, text: "В значении «ведение хозяйства, обращение с чем-то» требует творительного без предлога, как и глагол GOSPODAROWAĆ: GOSPODARKA ODPADAMI «обращение с отходами», GOSPODARKA WODNA «водное хозяйство»." }
  - { kind: usage, text: "Женский род, склоняется как RĘKA без особенностей: в дательном и предложном K переходит в C — W GOSPODARCE. В родительном множественного появляется беглое E: GOSPODAREK. Звательный GOSPODARKO не употребляется." }
collocations:
  - { pl: "gospodarka rynkowa", ru: "рыночная экономика" }
  - { pl: "rozwój gospodarki", ru: "развитие экономики" }
  - { pl: "gospodarka odpadami", ru: "обращение с отходами" }
  - { pl: "gospodarka światowa", ru: "мировая экономика" }
family:
  - { pl: "gospodarz", ru: "хозяин", relation: root, id: gospodarz }
  - { pl: "gospodarstwo", ru: "хозяйство, ферма", relation: root }
  - { pl: "gospodarczy", ru: "экономический, хозяйственный", relation: derived }
  - { pl: "gospodarować", ru: "хозяйствовать", relation: root }
synonyms: ["ekonomia"]
etymology: "Образовано от GOSPODARZ «хозяин», того же корня, что русские «господарь» и «господин»."
memory: "Gospodarka — хозяйство целой страны, экономика: в ней хозяйничает gospodarz. W gospodarce — в экономике, с переходом K в C."
idioms:
  - { pl: "gospodarka rabunkowa", ru: "хищническое хозяйствование" }
  - { pl: "gospodarka niedoborów", ru: "экономика дефицита" }
formExamplesSkip:
