notes:
  - { kind: false-friend, text: "Русские «беспорядки» (массовые волнения) — по-польски ZAMIESZKI. NIEPORZĄDKI во множественном — «непорядки, неразбериха» в делах и бумагах." }
  - { kind: register, text: "NIEPORZĄDEK — нейтральное, чуть книжное слово. В быту о комнате чаще говорят BAŁAGAN; грубее — BAJZEL." }
  - { kind: usage, text: "Мужской род, беглое E: NIEPORZĄDEK → NIEPORZĄDKU, NIEPORZĄDKI. NIE- здесь часть слова и пишется слитно. Устойчиво: PANUJE NIEPORZĄDEK «царит беспорядок»." }
  - { kind: pronunciation, text: "RZ после гласной — «ж», Ą перед D — «он»: «непожо́ндэк»." }
