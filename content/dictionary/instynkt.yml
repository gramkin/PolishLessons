notes:
  - { kind: pronunciation, text: "Читается «инсты́нкт», ударение на предпоследнем слоге. Гласная Y даёт русское «ы» и оставляет предыдущую согласную твёрдой: «сты», а не «сти». Это то же правило, что в DYSK «дыск» и SYSTEM «сы́стэм». Скопление согласных NKT на конце произносится полностью, без выпадения: «нкт». В местном падеже INSTYNKCIE согласная T переходит в C и смягчается: «инсты́нкце»." }
  - { kind: usage, text: "Местный падеж INSTYNKCIE даёт уже пятый случай одного и того же чередования в этом словаре: T переходит в C перед окончанием -IE, как в MONETA и MONECIE, PASZPORT и PASZPORCIE, TORT и TORCIE, KASETA и KASECIE. Правило можно считать выученным. Самые частые сочетания: INSTYNKT SAMOZACHOWAWCZY «инстинкт самосохранения», INSTYNKT MACIERZYŃSKI «материнский инстинкт», DZIAŁAĆ INSTYNKTOWNIE «действовать инстинктивно». Наречие — INSTYNKTOWNIE, прилагательное — INSTYNKTOWNY." }
  - { kind: government, text: "Мужской род, неодушевлённое. Винительный равен именительному: MIAŁ INSTYNKT. Родительный на -U: BEZ INSTYNKTU. Чем руководствоваться — глагол KIEROWAĆ SIĘ с творительным: KIEROWAĆ SIĘ INSTYNKTEM «руководствоваться инстинктом», и русский строит это так же. К чему инстинкт — родительный без предлога или прилагательное: INSTYNKT PRZETRWANIA «инстинкт выживания», INSTYNKT ŁOWCZY «охотничий инстинкт». При отрицании винительный уходит в родительный: NIE MIAŁ INSTYNKTU." }
  - { kind: false-friend, text: "Значение полностью совпадает с русским «инстинктом», и ловушки в смысле нет. Расхождение только в написании и чтении: польский ставит Y там, где русский пишет «и», и произносит её как «ы». Поэтому слово на слух кажется незнакомым, хотя на письме узнаётся сразу. Это общее свойство целого разряда заимствований, и INSTYNKT удобно запомнить вместе с ними: DYSK, DYSKUSJA, SYSTEM, DYSCYPLINA, FIZYKA — всюду Y и всюду «ы»." }
