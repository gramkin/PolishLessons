etymology: "Из латинского INSTINCTUS «побуждение, внушение», от INSTINGUERE «подстрекать, подгонять», которое собрано из приставки IN- и корня STINGUERE «колоть, жалить». То есть исходный образ — укол, которым подгоняют животное, и к тому же корню относится латинский STIMULUS «погонялка, остриё», давший «стимул». Греческий родственник STIZEIN «колоть» дал «стигму». Получается, что INSTYNKT, STYMULUS и STYGMAT — одно гнездо, и все три слова про укол: один подгоняет изнутри, другой извне, третий остаётся знаком на коже. Русское «инстинкт» пришло той же дорогой, через латынь научных текстов, поэтому значение совпадает полностью."
memory: "Пятый случай чередования t в c: w instynkcie, как na monecie, w paszporcie, na torcie, na kasecie. Буква y даёт «ы» и не смягчает: «инсты́нкт», как dysk и system. Руководствоваться — kierować się instynktem, творительный. От латинского instinguere «подгонять уколом», родня слову «стимул»."
