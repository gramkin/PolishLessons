# review
id: foremny
format: 2
lemma: "foremny"
rank: 2122
pos: adj
pron: { cyr: "форэ́мны" }
senses:
  - id: shapely
    ru: "стройный, ладный, правильной формы"
    examples:
      - pl: "Ma foremny kształt."
        ru: "У него правильная форма."
        source: { kind: authored }
      - pl: "To foremny bochenek chleba."
        ru: "Это ладный каравай хлеба."
        source: { kind: authored }
      - pl: "Foremny nos zdobi twarz."
        ru: "Правильный нос красит лицо."
        source: { kind: authored }
  - id: regular
    ru: "правильный (геометрический термин)"
    examples:
      - pl: "Sześcian to foremny wielościan."
        ru: "Куб — это правильный многогранник."
        source: { kind: authored }
      - pl: "Narysuj foremny pięciokąt."
        ru: "Нарисуй правильный пятиугольник."
        source: { kind: authored }
notes:
  - { kind: usage, text: "В обиходе — «ладный, стройный», в математике — «правильный»: wielościan foremny «правильный многогранник»." }
  - { kind: false-friend, text: "Не «форменный» в смысле «формальный». Корень forma «форма»: то, что имеет хорошую форму." }
  - { kind: government, text: "Обычное прилагательное; отрицательная пара — nieforemny «бесформенный, неуклюжий»." }
  - { kind: usage, text: "В корпусе слово не встречается, поэтому все примеры составлены вручную." }
  - { kind: government, text: "Сравнительная и превосходная степени обычны — foremniejszy bochenek, najforemniejsza bryła, — но мужско-личных форм foremni, foremniejsi, najforemniejsi не бывает: слово о форме предмета, а не о сложении человека." }
collocations:
  - { pl: "wielościan foremny", ru: "правильный многогранник" }
  - { pl: "foremny kształt", ru: "правильная форма" }
etymology: "От forma «форма», из латинского forma; русское «форма» — то же слово."
memory: "foremny — «ладный, правильной формы», от forma. В математике wielościan foremny «правильный многогранник». Антоним nieforemny «бесформенный»."
idioms:
  - { pl: "wielościan foremny", ru: "правильный многогранник" }
formExamplesSkip:
  - { form: "foremni", reason: "мужско-личная форма множественного числа, а foremny говорится о форме предмета: foremny kształt, foremny bochenek, foremny nos, wielościan foremny. О сложении человека по-польски говорят zgrabny или postawny, поэтому формы foremni в текстах не бывает" }
  - { form: "foremniejsi", reason: "мужско-личная форма множественного числа, а foremny говорится о форме предмета: foremny kształt, foremny bochenek, foremny nos, wielościan foremny. О сложении человека по-польски говорят zgrabny или postawny, поэтому нет и сравнительной степени foremniejsi" }
  - { form: "najforemniejsi", reason: "мужско-личная форма множественного числа, а foremny говорится о форме предмета: foremny kształt, foremny bochenek, foremny nos, wielościan foremny. О сложении человека по-польски говорят zgrabny или postawny, поэтому нет и превосходной степени najforemniejsi" }
