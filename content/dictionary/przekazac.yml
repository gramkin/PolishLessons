# review
id: przekazac
format: 2
lemma: "przekazać"
rank: 745
pos: verb
aspect: perf
pron: { cyr: "пшэка́заць" }
senses:
  - id: hand-over
    ru: "передать (что-л. кому-л.)"
    examples:
      - pl: "Czy mógłbyć przekazać Tomowi, że potrzebuję jego pomocy?"
        ru: "Ты бы мог передать Тому, что мне нужна его помощь?"
        source: { kind: tatoeba, id: 3400932 }
      - pl: "Przekazał całą wiedzę synowi."
        ru: "Он передал сыну все знания."
        source: { kind: translated, id: 366094 }
      - pl: "Kto ci przekazał te informacje?"
        ru: "Кто передал тебе эти сведения?"
        source: { kind: translated, id: 11272461 }
  - id: message
    ru: "przekazać wiadomość, pozdrowienia — передать сообщение, привет"
    examples:
      - pl: "Przekaż mu mikrofon!"
        ru: "Передай ему микрофон!"
        source: { kind: translated, id: 440710 }
      - pl: "Przekaż pozdrowienia rodzinie."
        ru: "Передай привет семье."
        source: { kind: translated, id: 768852 }
      - pl: "Przekażę mu to, kiedy wróci."
        ru: "Я передам ему это, когда он вернётся."
        source: { kind: translated, id: 3400925 }
  - id: donate
    ru: "передать, пожертвовать (имущество, средства)"
    examples:
      - pl: "Przekazała datek na Czerwony Krzyż."
        ru: "Она передала пожертвование Красному Кресту."
        source: { kind: translated, id: 933405 }
      - pl: "Kilkoro odważnych pasażerów złapało tego kieszonkowca i przekazało go policji."
        ru: "Несколько смелых пассажиров поймали карманника и передали его полиции."
        source: { kind: translated, id: 4134041 }
      - pl: "Przekazał majątek dzieciom."
        ru: "Он передал имущество детям."
        source: { kind: authored }
notes:
  - { kind: government, text: "przekazać coś komuś — винительный падеж на предмет и дательный на адресата: przekazał list sąsiadowi. Ровно как в русском «передать что кому»." }
  - { kind: usage, text: "Несовершенный вид — przekazywać: Przekazuję ci wiadomość «Я передаю тебе сообщение», но Przekazałem ci wiadomość «Я передал»." }
  - { kind: usage, text: "przekazać pozdrowienia — «передать привет», обиходная формула: Przekaż pozdrowienia rodzinie." }
  - { kind: usage, text: "Существительное przekaz значит «перевод» (денежный) и «послание»: przekaz pieniężny «денежный перевод»." }
collocations:
  - { pl: "przekazać wiadomość", ru: "передать сообщение" }
  - { pl: "przekazać pozdrowienia", ru: "передать привет" }
  - { pl: "przekazać sprawę", ru: "передать дело" }
  - { pl: "przekaz pieniężny", ru: "денежный перевод" }
family:
  - { pl: "przekazywać", ru: "передавать", relation: aspect }
  - { pl: "przekaz", ru: "перевод, послание", relation: derived }
  - { pl: "kazać", ru: "велеть", relation: root }
  - { pl: "pokazać", ru: "показать", relation: root }
etymology: "Из prze- + kazać «велеть», праславянское *kazati «показывать, говорить» — тот же корень, что в русских «сказать» и «показать»."
memory: "przekazać — «передать». Корень тот же, что в «сказать» и «показать»: kazać, pokazać, przekazać. Управление как в русском: przekazać coś komuś. Несовершенный вид — przekazywać, а существительное przekaz значит «денежный перевод»."
idioms:
  - { pl: "przekazać pozdrowienia", ru: "передать привет" }
  - { pl: "przekazać sprawę do sądu", ru: "передать дело в суд" }
  - { pl: "przekaz pieniężny", ru: "денежный перевод" }
