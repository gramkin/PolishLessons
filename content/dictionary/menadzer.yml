lemma: "menadżer"
rank: 4901
pos: noun
pron: { cyr: "мэна́джэр" }
senses:
  - id: manager
    ru: "менеджер, руководитель"
    examples:
      - pl: "Menadżer sklepu przyjął reklamację."
        ru: "Менеджер магазина принял жалобу."
        source: { kind: authored }
      - pl: "Pracuje jako menadżer projektu."
        ru: "Он работает менеджером проекта."
        source: { kind: authored }
      - pl: "Nowy menadżer zmienił zasady."
        ru: "Новый руководитель поменял правила."
        source: { kind: authored }
  - id: agent
    ru: "менеджер (артиста, спортсмена)"
    examples:
      - pl: "Menadżer zespołu negocjuje kontrakty."
        ru: "Менеджер группы ведёт переговоры по контрактам."
        source: { kind: authored }
      - pl: "Menadżerowie piłkarzy zarabiają miliony."
        ru: "Агенты футболистов зарабатывают миллионы."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "MENADŻER — «менеджер», с DŻ. Встречается и написание MENEDŻER — оба допустимы. Руководитель отдела — KIEROWNIK, начальник — SZEF. Менеджер по продажам — MENADŻER SPRZEDAŻY или KIEROWNIK DZIAŁU SPRZEDAŻY." }
  - { kind: usage, text: "Мужской род, лицо. Две формы множественного: MENADŻEROWIE — о профессии, MENADŻERZY — разговорнее. Местный и звательный — MENADŻERZE." }
  - { kind: government, text: "Работать менеджером — PRACOWAĆ JAKO MENADŻER или BYĆ MENADŻEREM, творительный. Менеджер чего — родительный: MENADŻER HOTELU." }
  - { kind: pronunciation, text: "Читается «мэна́джэр»: DŻ — «дж». Ударение на предпоследнем слоге. MENADŻERZE — «мэнаджэ́жэ»." }
collocations:
  - { pl: "menadżer projektu", ru: "менеджер проекта" }
  - { pl: "menadżer sprzedaży", ru: "менеджер по продажам" }
  - { pl: "menadżer zespołu", ru: "менеджер группы" }
family:
  - { pl: "kierownik", ru: "руководитель", relation: root, id: kierownik }
  - { pl: "szef", ru: "начальник", relation: root, id: szef }
  - { pl: "dyrektor", ru: "директор", relation: root, id: dyrektor }
etymology: "Из английского MANAGER, от MANAGE «управлять». Польское написание передаёт звучание через DŻ."
memory: "Menadżer — менеджер, через dż (или menedżer). Menadżer projektu — менеджер проекта. Читается «мэна́джэр»."
