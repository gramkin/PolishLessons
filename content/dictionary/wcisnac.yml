notes:
  - { kind: false-friend, text: "Корень CIS- отвечает русскому ТИС-: польское CISNĄĆ значит «жать, давить», а русские родственники — «тиснуть», «тискать», «тиски». Отсюда и CIŚNIENIE «давление», слово из каждой аптеки: CIŚNIENIE KRWI «кровяное давление». Соответствие это не единичное, а правило: польское CI- регулярно отвечает русскому ТИ- или ТЁ-, потому что в польском древнее мягкое Т перешло в Ć. Так получаются пары CICHY и «тихий», CIEPŁY и «тёплый», CIASTO и «тесто», CIEMNY и «тёмный». Узнав правило, читатель узнаёт десятки слов сразу." }
  - { kind: usage, text: "В будущем времени работает чередование S и Ś, и оно устроено неожиданно: мягкость появляется не везде. Первое лицо единственного числа и третье множественного сохраняют твёрдое S — WCISNĘ и WCISNĄ, — а все остальные формы смягчаются: WCIŚNIESZ, WCIŚNIE, WCIŚNIEMY, WCIŚNIECIE. Причина в гласном, который шёл за основой: перед носовыми Ę и Ą смягчения не было. Русский такого чередования здесь не знает, «втисну» и «втиснешь» одинаковы, так что запоминать польский ряд надо целиком. Пятьдесят три формы — подпись переходного глагола совершенного вида." }
  - { kind: government, text: "Прямое дополнение в винительном: WCISNĄĆ GUZIK, WCISNĄĆ HAMULEC. Направление вводится предлогом DO с родительным или W с винительным: WCISNĄĆ COŚ DO TORBY, WCISNĄĆ SIĘ W TŁUM. Возвратное WCISNĄĆ SIĘ значит «втиснуться, протиснуться»: WCISNĘLI SIĘ DO WAGONU. Разговорный оборот WCISNĄĆ KOMUŚ KIT означает «наговорить ерунды, впарить»: NIE WCISKAJ MI KITU «не вешай мне лапшу на уши», и это одно из самых частых выражений живой речи." }
  - { kind: pronunciation, text: "Читается «фчи́сьнончь», два слога, ударение на первом. Начальное W перед глухим C оглушается и звучит как «ф», поэтому слово начинается с «фчи», а не с «вчи»; это общее правило, и так же ведут себя WSZYSTKO «фшистко» и WTEDY «фтэды». Сочетание ŚN даёт мягкое «сьн». Носовое Ą перед Ć читается как «он». В формах с твёрдым S звучание другое: WCISNĘ это «фчи́снэн», без мягкости." }
  - { kind: register, text: "Слово нейтральное и очень бытовое. Частые сочетания: WCISNĄĆ GUZIK «нажать кнопку», WCISNĄĆ HAMULEC «нажать на тормоз», WCISNĄĆ SIĘ DO AUTOBUSU «втиснуться в автобус». Несовершенный партнёр WCISKAĆ описывает процесс и в разговорной речи живёт самостоятельно: NIE WCISKAJ «не заливай». Родственные слова широко в ходу: CISNĄĆ «жать», NACISK «нажим, давление», CIŚNIENIE «давление», WCISK «запрессовка» в технике." }
