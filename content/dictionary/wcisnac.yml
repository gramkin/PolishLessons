etymology: "Приставка W- плюс CISNĄĆ, от праславянского *tisknǫti «жать, давить». Русский сохранил корень в «тиснуть», «тискать» и в существительном «тиски», где исходное значение сжатия видно яснее всего. Польское начальное C вместо Т — закономерный итог смягчения: древнее мягкое Т перед передним гласным перешло в Ć, и это превращение затронуло весь словарь, дав CICHY при «тихом», CIEPŁY при «тёплом», CIAŁO при «теле». Поэтому пара CISNĄĆ и «тиснуть» выглядит далёкой, а на деле различается одним правилом. От того же корня идут CIŚNIENIE «давление», NACISK «нажим» и ZACISK «зажим»."
memory: "Корень тот же, что в «тиснуть» и «тисках»: cisnąć «жать», ciśnienie «давление». Польское ci- регулярно отвечает русскому ти- или тё-, и одно это правило открывает cichy «тихий», ciepły «тёплый», ciasto «тесто». В будущем времени чередование неровное: wcisnę и wcisną с твёрдым s, но wciśniesz, wciśnie, wciśniemy с мягким. И помнить разговорное wcisnąć komuś kit — «вешать лапшу на уши»."
idioms:
  - { pl: "wcisnąć komuś kit", ru: "вешать кому-то лапшу на уши" }
