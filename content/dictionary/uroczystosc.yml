notes:
  - { kind: false-friend, text: "UROCZYSTOŚĆ — «торжество», от UROCZYSTY «торжественный». Не путайте с UROCZY — «очаровательный»: UROCZA DZIEWCZYNA — «очаровательная девушка», а UROCZYSTY DZIEŃ — «торжественный день». На «урок» и «урочище» слово тоже не указывает." }
  - { kind: usage, text: "Шесть форм, женский род на -OŚĆ. Одна форма UROCZYSTOŚCI служит родительным, дательным и местным единственного и почти всем падежам множественного. Одно событие часто называют во множественном: UROCZYSTOŚCI POGRZEBOWE — «похороны», UROCZYSTOŚCI ROCZNICOWE — «юбилейные торжества»." }
  - { kind: government, text: "На торжестве — NA UROCZYSTOŚCI, местный с NA. Участвовать в торжестве — WZIĄĆ UDZIAŁ W UROCZYSTOŚCI. Торжественно — Z UROCZYSTOŚCIĄ или наречием UROCZYŚCIE." }
  - { kind: pronunciation, text: "Читается «урочы́стосьць», ударение на предпоследнем слоге. CZY — «чы», конечное ŚĆ — «сьць», как в RADOŚĆ «ра́досьць»." }
  - { kind: register, text: "Слово официальное и праздничное: церемонии, юбилеи, вручения наград. Вечеринка — IMPREZA, приём гостей — PRZYJĘCIE." }
collocations:
  - { pl: "uroczystość rodzinna", ru: "семейное торжество" }
  - { pl: "uroczystości pogrzebowe", ru: "похороны, траурная церемония" }
  - { pl: "uroczystość wręczenia nagród", ru: "церемония вручения наград" }
family:
  - { pl: "uroczysty", ru: "торжественный", relation: root }
  - { pl: "uroczyście", ru: "торжественно", relation: root }
  - { pl: "uroczy", ru: "очаровательный", relation: root, id: uroczy }
etymology: "От UROCZYSTY «торжественный» с суффиксом -OŚĆ. UROCZYSTY в старопольском значило «установленный, назначенный»: UROCZYSTY DZIEŃ — заранее назначенный праздничный день. Ср. русское «в урочный час»."
memory: "Uroczystość — торжество; uroczysty — торжественный, а uroczy — очаровательный. Читается «урочы́стосьць». Na uroczystości — на торжестве."
idioms:
  - { pl: "z wielką pompą", ru: "с большой помпой, пышно" }
