# review
id: gotowac
format: 2
lemma: "gotować"
rank: 1778
pos: verb
aspect: imperf
pron: { cyr: "гото́ваць" }
senses:
  - id: cook
    ru: "готовить (еду)"
    examples:
      - pl: "Chcę gotować."
        ru: "Я хочу готовить."
        source: { kind: tatoeba, id: 12890295 }
      - pl: "Czy Tom umie gotować?"
        ru: "Том умеет готовить?"
        source: { kind: tatoeba, id: 2405969 }
      - pl: "Mama nauczyła mnie gotować."
        ru: "Я научился готовить у своей матери."
        source: { kind: tatoeba, id: 13785408 }
  - id: boil
    ru: "варить, кипятить"
    examples:
      - pl: "Cebulę gotuje się szybciej niż ziemniaki."
        ru: "Лук готовится быстрее, чем картофель."
        source: { kind: tatoeba, id: 659718 }
      - pl: "Gotuj jajka dopóki są twarde."
        ru: "Вари яйца, пока не станут твёрдыми."
        source: { kind: translated, id: 5301898 }
      - pl: "Gotował się ze złości."
        ru: "Он кипел от злости."
        source: { kind: translated, id: 440691 }
notes:
  - { kind: usage, text: "Мужско-личной формы gotowani не бывает: варят еду, а не людей, поэтому она оставлена без примеров. Причастие живёт при вещах: gotowane ziemniaki «варёная картошка», woda gotowana." }
  - { kind: usage, text: "Совершенный вид — ugotować. Без приставки gotować значит «готовить вообще, заниматься готовкой»: lubię gotować «я люблю готовить»." }
  - { kind: false-friend, text: "Не путайте с русским «готовить» в смысле «подготавливать»: это przygotowywać. Gotować — только про еду и кипение." }
  - { kind: usage, text: "Возвратное gotować się значит «кипеть», в том числе переносно: gotował się ze złości «он кипел от злости»." }
  - { kind: usage, text: "Отглагольное существительное gotowanie «готовка» очень частотно: moje hobby to gotowanie." }
collocations:
  - { pl: "lubię gotować", ru: "я люблю готовить" }
  - { pl: "gotować obiad", ru: "готовить обед" }
  - { pl: "gotować się ze złości", ru: "кипеть от злости" }
family:
  - { pl: "ugotować", ru: "сварить, приготовить", relation: root }
  - { pl: "gotowanie", ru: "готовка", relation: root }
  - { pl: "kuchnia", ru: "кухня", relation: root, id: kuchnia }
etymology: "От gotowy «готовый»: буквально «делать готовым». Русское «готовить» построено от того же корня, но польское слово сузилось до еды и кипения."
memory: "gotować — «готовить еду» и «варить, кипятить»: lubię gotować, gotować obiad. «Подготавливать» — это przygotowywać, другое слово. Совершенный вид — ugotować."
idioms:
