etymology: "Из CHOĆ и частицы BY. CHOĆ продолжает старую форму, связанную с глаголом «хотеть»: исходно это было что-то вроде «хоть сколько захочешь», откуда и уступительное значение. Русское «хоть» прошло тот же путь от «хотя», причастной формы того же глагола, и «хотя бы» собрано из тех же двух частей. То есть два языка независимо сделали уступительную частицу из глагола желания — ход мысли понятный: уступая, мы допускаем нечто вопреки собственному хотению. Польский лишь записал сочетание слитно, а русский оставил раздельным."
memory: "Собрано как русское «хоть бы»: choć плюс by, но пишется слитно. При существительном — «хотя бы»: choćby raz. При глаголе — «даже если», и глагол ставится в прошедшем времени: choćby padało. Читается «хо́чьбы», ć — это «чь»."
