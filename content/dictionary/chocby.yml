notes:
  - { kind: false-friend, text: "Снова полное совпадение устройства, и это стоит заметить. Польское CHOĆBY собрано из CHOĆ «хоть» и частицы BY — то есть буквально русское «хоть бы», часть за частью, в том же порядке. И значения те же два: «хотя бы» о малом количестве, DAJ CHOĆBY ZŁOTÓWKĘ, и «даже если» об уступке, CHOĆBY PADAŁO. Разница только в написании: польский пишет слитно, русский раздельно. Рядом живёт CHOCIAŻBY, вариант подольше и чуть книжнее, с тем же смыслом." }
  - { kind: usage, text: "Два значения различаются тем, что стоит рядом. Если за CHOĆBY идёт существительное или числительное, это «хотя бы»: CHOĆBY RAZ, CHOĆBY NA CHWILĘ, CHOĆBY ZŁOTÓWKĘ. Если за ним идёт глагол, это «даже если», и глагол ставится в форме прошедшего времени, даже когда речь о будущем: CHOĆBY PADAŁO «даже если будет дождь», CHOĆBY GO PROSZONO. Эта форма прошедшего времени после CHOĆBY русскому непривычна, потому что по-русски говорят «хоть бы шёл дождь», и время там тоже не будущее, но совпадение здесь случайное, а правило стоит запомнить отдельно." }
  - { kind: pronunciation, text: "Читается «хо́чьбы», в два слога, с ударением на первом. Буква ć даёт мягкое «чь», поэтому не «хоцбы» и не «хотбы», а именно «хочьбы». Сочетание ćb произносится слитно, со смягчением на первом согласном. В варианте CHOCIAŻBY — «хочя́жбы», где ż даёт «ж», и ударение уходит на второй слог, потому что слогов стало три." }
  - { kind: government, text: "Частица на падежи не влияет. Запятая перед CHOĆBY ставится, когда оно вводит уступительную часть предложения: NIE USTĄPI, CHOĆBY GO PROSZONO. Когда же оно означает «хотя бы» и стоит при существительном, запятая не нужна: PRZYJDŹ CHOĆBY NA CHWILĘ. Это единственное пунктуационное различие между двумя значениями, и по нему их легко развести на письме." }
