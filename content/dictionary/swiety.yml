# review
id: swiety
format: 2
lemma: "święty"
rank: 654
pos: adj
pron: { cyr: "сьвье́нты" }
senses:
  - id: holy
    ru: "святой, священный"
    note: "Pismo Święte «Священное Писание», Duch Święty «Святой Дух»."
    examples:
      - pl: "To święte miejsce."
        ru: "Это святое место."
        source: { kind: translated, id: 12053406 }
      - pl: "Czytam Pismo Święte po raz pierwszy."
        ru: "Я впервые читаю Священное Писание."
        source: { kind: translated, id: 723812 }
      - pl: "Dla wielu ludzi w Indiach krowy są święte."
        ru: "Для многих людей в Индии коровы священны."
        source: { kind: translated, id: 12953692 }
  - id: saint
    ru: "святой (как существительное): święci «святые»"
    note: "Wszystkich Świętych — День Всех Святых, 1 ноября."
    examples:
      - pl: "Mój syn wierzy w Świętego Mikołaja."
        ru: "Мой сын верит в Деда Мороза."
        source: { kind: tatoeba, id: 1170326 }
      - pl: "W Imię Ojca i Syna, i Ducha Świętego."
        ru: "Во имя Отца и Сына и Святого Духа."
        source: { kind: tatoeba, id: 4926397 }
      - pl: "Jutro jest Wszystkich Świętych?"
        ru: "Завтра День Всех Святых?"
        source: { kind: translated, id: 3604259 }
  - id: absolute
    ru: "святой в переносном смысле: święta prawda, święty spokój"
    note: "Na Święty Nigdy «когда рак на горе свистнет»."
    examples:
      - pl: "Bo a jakże, on się poprawi. Na Święty Nigdy."
        ru: "Ага, он исправится. Когда рак на горе свистнет."
        source: { kind: tatoeba, id: 1188871 }
      - pl: "To święty człowiek."
        ru: "Это святой человек."
        source: { kind: translated, id: 357372 }
      - pl: "Nie jestem święty."
        ru: "Я не святой."
        source: { kind: translated, id: 8493037 }
notes:
  - { kind: false-friend, text: "Форма święta — главная ловушка карточки. Это не только «святая», но и отдельное существительное среднего рода во множественном числе: święto «праздник», święta «праздники». Idą święta значит «Приближаются праздники», а Święta с большой буквы — «Рождество»." }
  - { kind: usage, text: "Слово свободно работает как существительное: święty «святой», święci «святые», Wszystkich Świętych «День Всех Святых» (1 ноября)." }
  - { kind: usage, text: "Święty Mikołaj — это и святой Николай, и Дед Мороз: подарки дети ждут именно от него." }
  - { kind: usage, text: "Устойчивые сочетания: Pismo Święte «Священное Писание», Duch Święty «Святой Дух», święta prawda «святая правда», święty spokój «полный покой»." }
  - { kind: usage, text: "Превосходная степень вполне жива и звучит в титуле Najświętsza Maria Panna «Пресвятая Дева Мария», Najświętszy Sakrament «Святые Дары»." }
collocations:
  - { pl: "Pismo Święte", ru: "Священное Писание" }
  - { pl: "Święty Mikołaj", ru: "Дед Мороз" }
  - { pl: "święta prawda", ru: "святая правда" }
  - { pl: "Wszystkich Świętych", ru: "День Всех Святых" }
family:
  - { pl: "święto", ru: "праздник", relation: derived }
  - { pl: "świętość", ru: "святость", relation: derived }
  - { pl: "świętować", ru: "праздновать", relation: derived }
etymology: "Праславянское *svętъ — то же слово, что русское «святой». Польское ę стоит на месте русского «я»: święty — «святой», pięć — «пять», dziesięć — «десять»."
memory: "święty — «святой», и звуковое соответствие тут правильное: польское ę отвечает русскому «я», как в pięć «пять». Дальше начинается ловушка. Множественное święta — это уже не прилагательное, а существительное «праздники» (от święto): Idą święta значит «Приближаются праздники», а Święta с большой буквы — «Рождество». И запомните Święty Mikołaj: это одновременно святой Николай и Дед Мороз."
idioms:
  - { pl: "święta prawda", ru: "святая правда" }
  - { pl: "Święty Mikołaj", ru: "Дед Мороз" }
  - { pl: "na Święty Nigdy", ru: "когда рак на горе свистнет" }
  - { pl: "święty spokój", ru: "покой (чтобы никто не трогал)" }
