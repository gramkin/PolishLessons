# review
id: schwytac
format: 2
lemma: "schwytać"
rank: 2300
pos: verb
aspect: perf
pron: { cyr: "схвы́таць" }
senses:
  - id: catch
    ru: "поймать, схватить"
    examples:
      - pl: "Aby schwytać byka, należy wziąć go za rogi."
        ru: "Чтобы поймать быка, нужно взять его за рога."
        source: { kind: tatoeba, id: 831791 }
      - pl: "Schwytaliśmy tego złodzieja."
        ru: "Мы поймали этого вора."
        source: { kind: translated, id: 611698 }
      - pl: "On schwytał pająka."
        ru: "Он поймал паука."
        source: { kind: translated, id: 10468095 }
  - id: captured
    ru: "пойман, задержан (причастие schwytany)"
    examples:
      - pl: "Zbiegły przestępca wciąż nie został schwytany."
        ru: "Сбежавший преступник всё ещё не пойман."
        source: { kind: translated, id: 840233 }
      - pl: "Przestępca został schwytany na miejscu zbrodni."
        ru: "Преступник был схвачен на месте преступления."
        source: { kind: translated, id: 13561628 }
notes:
  - { kind: government, text: "Винительный падеж: schwytać złodzieja. Причастие schwytany «схваченный, пойманный» встречается в новостях чаще личных форм." }
  - { kind: false-friend, text: "Корень chwytać «хватать» — ср. русское «хватать», «схватить». Приставка s- та же." }
  - { kind: usage, text: "Безличное schwytano «поймали» — типичный газетный оборот: Mordercy jeszcze nie schwytano «Убийцу ещё не поймали»." }
  - { kind: usage, text: "Несовершенный вид — chwytać; более обиходное «поймать» — złapać." }
collocations:
  - { pl: "schwytać złodzieja", ru: "поймать вора" }
  - { pl: "schwytany na gorącym uczynku", ru: "пойманный с поличным" }
etymology: "s- + chwytać «хватать»; ср. русское «хватать», «схватить»."
memory: "schwytać — «поймать, схватить». В новостях чаще всего встречается причастие schwytany и безличное schwytano «поймали». Обиходное «поймать» — złapać."
