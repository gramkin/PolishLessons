notes:
  - { kind: false-friend, text: "Русского существительного с таким корнем нет, зато глагол знаком: POZEW происходит от POZWAĆ, а это буквально русское «позвать». Исходное значение прямое — вызвать в суд, и в старом праве так и говорили: позвать ответчика. Польский закрепил за существительным юридический смысл целиком, и сегодня POZEW это только исковое заявление. Русское «позвать» осталось при общем значении, а для документа взяло латинское «иск» из своего корня «искать». Поэтому опереться можно на глагол, но не на существительное: POZEW ни в каком контексте не переводится словом «позыв»." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Беглое E исчезает во всех косвенных формах: POZEW, но POZWU, POZWOWI, POZWEM, POZWIE — как в OŚRODEK и PASEK, только здесь выпадение задевает последний слог основы. Местный единственного — POZWIE, со смягчением W в WI перед окончанием -E. Родительный единственного — POZWU. Винительный равен именительному. Управление: POZEW PRZECIW KOMUŚ с дательным — POZEW PRZECIW FABRYCE, а подают его глаголом ZŁOŻYĆ или WNIEŚĆ POZEW." }
  - { kind: pronunciation, text: "Читается «по́зэф», два слога, ударение на первом. Буква Z звонкая, E даёт чистое «э» без смягчения предыдущего согласного, а конечное W оглушается в «ф». В косвенных формах беглое E пропадает и звонкость W возвращается: POZWU звучит «по́зву», POZWEM — «по́звэм», POZWIE — «по́зве» с мягким W. В форме POZWÓW буква Ó даёт «у», а конечное W снова оглушается: «по́звуф»." }
  - { kind: register, text: "Слово строго юридическое и канцелярское, но в газетном языке совершенно обиходное. Устойчивые сочетания: ZŁOŻYĆ POZEW «подать иск», WNIEŚĆ POZEW, POZEW ZBIOROWY «коллективный иск», POZEW O ROZWÓD «иск о разводе», POZEW O ZAPŁATĘ. Производные: POZWANY «ответчик», то есть тот, кого позвали в суд, и POWÓD «истец» — последнее слово совпадает по виду с POWÓD «причина», и различать их приходится по контексту. Переносного употребления у слова нет." }
