etymology: "От глагола POZWAĆ, то есть приставка PO- и корень *zъv-, тот же, что в русском «звать» и «позвать». Старое судопроизводство начиналось именно с зова: истец звал ответчика перед суд, и документ, которым звали, получил имя по действию. Русский прошёл ту же стадию — в древнерусском праве «позов» означал вызов в суд, — но слово вышло из употребления, и его место занял «иск», от «искать», то есть требовать своего через суд. Польский же сохранил POZEW и достроил вокруг него весь словарь процесса: POZWANY «ответчик», POZWAĆ DO SĄDU. Беглое E в именительном — обычное для суффикса -EW, как в LISTOPAD и в именах на -EW старого склонения."
memory: "Опора на глагол: pozew от pozwać, то есть «позвать» — в старом суде истец звал ответчика, и документ назвали по действию. В русском такое слово тоже было, «позов», но его вытеснил «иск». Отсюда и pozwany «ответчик». Беглое e пропадает всюду: pozew, но pozwu, pozwem, pozwie. Подают иск глаголом złożyć pozew. Звучит «по́зэф», с оглушением конечного w."
idioms:
  - { pl: "złożyć pozew", ru: "подать иск" }
formExamplesSkip:
