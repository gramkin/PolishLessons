  - id: game
    ru: "сервер (игровой, сообщества)"
    examples:
      - pl: "Gramy na polskim serwerze."
        ru: "Мы играем на польском сервере."
        source: { kind: authored }
      - pl: "Ten serwer gry jest zawsze przepełniony."
        ru: "Этот игровой сервер всегда переполнен."
