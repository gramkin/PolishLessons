notes:
  - { kind: false-friend, text: "SERWER — «сервер», как в русском, но через W: SERWER. Подача в теннисе — SERWIS, подавать — SERWOWAĆ, а подающий — SERWUJĄCY. SERWIS — ещё и «сервис, автосервис» и «сайт»: SERWIS INTERNETOWY." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Родительный — SERWERA, с -A, как у многих технических слов. В местном R переходит в RZ: NA SERWERZE." }
  - { kind: government, text: "На сервере — NA SERWERZE, NA с местным. Подключиться к серверу — POŁĄCZYĆ SIĘ Z SERWEREM, творительный. Сервер упал — SERWER PADŁ." }
  - { kind: pronunciation, text: "Читается «сэ́рвэр»: оба E — твёрдые «э», W — «в». Ударение на первом слоге. SERWERZE — «сэрвэ́жэ»." }
collocations:
  - { pl: "serwer padł", ru: "сервер упал" }
  - { pl: "na serwerze", ru: "на сервере" }
  - { pl: "serwer pocztowy", ru: "почтовый сервер" }
family:
  - { pl: "komputer", ru: "компьютер", relation: root, id: komputer }
  - { pl: "sieć", ru: "сеть", relation: root, id: siec }
  - { pl: "serwis", ru: "сервис; подача", relation: root }
etymology: "Из английского SERVER «тот, кто обслуживает», от SERVE «служить». Польское W передаёт английское V, как в SERWIS."
memory: "Serwer — сервер, через w. Na serwerze — на сервере. Serwer padł — сервер упал. Читается «сэ́рвэр»."
idioms:
  - { pl: "serwer padł", ru: "всё сломалось, система не работает" }
formExamplesSkip:
  - { form: "serwerze", cell: "Звательный", reason: "звательный падеж: для неодушевлённого существительного он практически не употребляется" }
