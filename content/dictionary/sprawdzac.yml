# review
id: sprawdzac
format: 2
lemma: "sprawdzać"
rank: 890
pos: verb
aspect: imperf
aspectPair: sprawdzic
pron: { cyr: "спра́вдзаць" }
senses:
  - id: check
    ru: "проверять"
    examples:
      - pl: "Tom mnie sprawdza."
        ru: "Том меня проверяет."
        source: { kind: translated, id: 12179006 }
      - pl: "Sprawdzaliśmy jego przeszłość."
        ru: "Мы проверяли его прошлое."
        source: { kind: translated, id: 356482 }
      - pl: "Co on sprawdzał?"
        ru: "Что он проверял?"
        source: { kind: translated, id: 9821357 }
  - id: check-mail
    ru: "sprawdzać pocztę — проверять почту"
    examples:
      - pl: "Jak sprawdzasz pocztę elektroniczną?"
        ru: "Как ты проверяешь электронную почту?"
        source: { kind: translated, id: 12069066 }
      - pl: "Jak często sprawdzasz swoją skrzynkę mailową?"
        ru: "Как часто ты проверяешь свой почтовый ящик?"
        source: { kind: translated, id: 2148170 }
      - pl: "Nie sprawdzam nigdy moich wiadomości."
        ru: "Я никогда не проверяю свои сообщения."
        source: { kind: translated, id: 10235330 }
  - id: prove-true
    ru: "sprawdzać się — оправдываться, сбываться"
    note: "Возвратная форма про прогнозы и методы: prognoza się sprawdziła «прогноз сбылся»."
    examples:
      - pl: "Prognoza się sprawdza."
        ru: "Прогноз сбывается."
        source: { kind: authored }
      - pl: "Ta metoda sprawdza się od lat."
        ru: "Этот метод оправдывает себя годами."
        source: { kind: authored }
      - pl: "Jego rady zawsze się sprawdzają."
        ru: "Его советы всегда оправдываются."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Корень слова — prawda «правда»: sprawdzić значит буквально «установить правду». Русское «проверить» построено от «веры», польское — от «правды»." }
  - { kind: usage, text: "Совершенный вид — sprawdzić. Sprawdzam «я проверяю» о привычке или о текущем действии, sprawdziłem «я проверил» о результате." }
  - { kind: usage, text: "Возвратное sprawdzać się значит «оправдываться, сбываться»: metoda się sprawdza «метод себя оправдывает», prognoza się sprawdziła «прогноз сбылся»." }
  - { kind: false-friend, text: "Не путайте sprawdzać «проверять» с созвучным sprawiać «доставлять, причинять». Корень у них общий — sprawa, но значения разошлись полностью." }
collocations:
  - { pl: "sprawdzać pocztę", ru: "проверять почту" }
  - { pl: "sprawdzać fakty", ru: "проверять факты" }
  - { pl: "sprawdzać się", ru: "оправдываться, сбываться" }
  - { pl: "sprawdzać dokumenty", ru: "проверять документы" }
family:
  - { pl: "sprawdzić", ru: "проверить", relation: aspect, id: sprawdzic }
  - { pl: "sprawa", ru: "дело", relation: root, id: sprawa }
  - { pl: "sprawdzian", ru: "контрольная работа", relation: derived }
etymology: "Из s- + prawdzić, от prawda «правда»: проверить значит установить правду. Русское «проверить» собрано от «веры» — та же мысль, но через другое слово."
memory: "sprawdzać — «проверять», и корень тут prawda: проверить значит установить правду. Совершенный вид — sprawdzić. А возвратное sprawdzać się значит «оправдываться, сбываться»: prognoza się sprawdziła."
idioms:
  - { pl: "sprawdzać fakty", ru: "проверять факты" }
  - { pl: "sprawdzić w praktyce", ru: "проверить на практике" }
  - { pl: "metoda się sprawdza", ru: "метод себя оправдывает" }
