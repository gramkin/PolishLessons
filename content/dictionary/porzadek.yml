lemma: "porządek"
rank: 105
pos: noun
pron: { cyr: "пожо́ндэк" }
senses:
  - id: order
    ru: "порядок, чистота"
    examples:
      - pl: "Porządek musi być."
        ru: "Порядок должен быть."
        source: { kind: tatoeba, id: 8347293 }
      - pl: "On zawsze ma porządek w pokoju."
        ru: "У него в комнате всегда порядок."
        source: { kind: tatoeba, id: 722147 }
      - pl: "Wszystko jest w porządku."
        ru: "Всё нормально."
        source: { kind: tatoeba, id: 12728696 }
  - id: sequence
    ru: "порядок, последовательность; w porządku — в порядке, ладно"
    examples:
      - pl: "Ustaw książki w porządku alfabetycznym."
        ru: "Расставь книги в алфавитном порядке."
        source: { kind: authored }
      - pl: "Pojedziemy taksówką, w porządku?"
        ru: "Поедем на такси, ладно?"
        source: { kind: tatoeba, id: 12950850 }
notes:
  - { kind: usage, text: "Самое частое употребление — w porządku «в порядке, ладно»: Wszystko w porządku?" }
  - { kind: usage, text: "Множественное porządki обычно значит «уборка»: robić porządki «убираться»." }
collocations:
  - { pl: "w porządku", ru: "в порядке, ладно" }
  - { pl: "zrobić porządek", ru: "навести порядок" }
  - { pl: "porządek dzienny", ru: "повестка дня" }
etymology: "От глагола rządzić «править» с приставкой po-; построено так же, как русское «порядок» (по + ряд)."
memory: "Держите в голове одно выражение — w porządku «в порядке, ладно»: это самый частый способ сказать «хорошо». А множественное porządki почти всегда значит «уборка»: robić porządki."
idioms:
  - { pl: "być w porządku", ru: "быть в порядке; быть порядочным (о человеке)" }
  - { pl: "na porządku dziennym", ru: "в порядке вещей" }
  - { pl: "porządek dzienny", ru: "повестка дня" }
formExamplesSkip:
  - { form: "porządku", cell: "Звательный", reason: "звательный падеж: для неодушевлённого существительного он практически не употребляется" }
