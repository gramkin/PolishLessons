notes:
  - { kind: pronunciation, text: "БЕГЛОЕ E ВЫПАДАЕТ ВО ВСЕХ КОСВЕННЫХ ПАДЕЖАХ. Dodatek даёт dodatku, dodatkiem, dodatki — e исчезает без следа. Так ведёт себя весь суффикс -ek: domek — domku, worek — worka, ogórek — ogórka. И ровно этим -ek отличается от -ik, который гласного не роняет: stolik — stolika." }
  - { kind: usage, text: "Оборот w dodatku — один из самых частых в разговорной речи и значит «вдобавок, к тому же»: zimno, a w dodatku pada. Рядом живёт na dodatek с тем же смыслом. Множественное dodatki значит и «приправы, добавки» (dodatki do potraw), и «аксессуары» (dodatki do ubrań)." }
  - { kind: false-friend, text: "Корень прозрачен: dodać «добавить» от dać «дать», как русское «додать», «добавить». Но русского существительного «додаток» нет, и перевод всякий раз разный: dodatek do gazety это «приложение», dodatek do pensji — «надбавка», dodatek do potrawy — «добавка», а dodatki do ubrania — «аксессуары»." }
collocations:
  - { pl: "w dodatku", ru: "вдобавок, к тому же" }
  - { pl: "dodatek do pensji", ru: "надбавка к зарплате" }
  - { pl: "dodatek mieszkaniowy", ru: "жилищное пособие" }
family:
  - { pl: "dodać", ru: "добавить", relation: root, id: dodac }
  - { pl: "dodatkowy", ru: "дополнительный", relation: derived, id: dodatkowy }
  - { pl: "dodawać", ru: "добавлять", relation: aspect }
etymology: "От dodać «добавить» — приставка do- плюс dać «дать», тот же корень, что в русских «дать» и «добавить». Суффикс -ek образует отглагольные существительные и несёт в себе беглое e, выпадающее при склонении. Отсюда dodatkowy, dodawanie и dodatni «положительный»."
memory: "dodatek — «добавка, дополнение, надбавка», от dodać «добавить». Беглое e выпадает: dodatku, dodatkiem — как domek, domku. И запомнить стоит оборот w dodatku «вдобавок, к тому же»: он слышится в разговоре постоянно."
idioms:
  - { pl: "w dodatku", ru: "вдобавок, к тому же" }
  - { pl: "dodatek do pensji", ru: "надбавка к зарплате" }
formExamplesSkip:
