# review
id: kod
format: 2
lemma: "kod"
rank: 1265
pos: noun
pron: { cyr: "кот" }
senses:
  - id: code-system
    ru: "код как система знаков; kod pocztowy «почтовый индекс»"
    examples:
      - pl: "Jaki jest twój kod pocztowy?"
        ru: "Какой у тебя почтовый индекс?"
        source: { kind: translated, id: 5488073 }
      - pl: "Nie zapomnij napisać kodu pocztowego."
        ru: "Не забудь написать почтовый индекс."
        source: { kind: translated, id: 7184999 }
      - pl: "Maszyna sortuje litery według kodu pocztowego."
        ru: "Машина сортирует письма по почтовому индексу."
        source: { kind: translated, id: 12013168 }
  - id: secret
    ru: "шифр, секретный код"
    examples:
      - pl: "Nie potrafię złamać tego kodu."
        ru: "Я не могу взломать этот код."
        source: { kind: translated, id: 7905684 }
      - pl: "Czy to jakiś rodzaj tajnego kodu?"
        ru: "Это какой-то тайный код?"
        source: { kind: translated, id: 13081141 }
      - pl: "Ona nie wyjawi kodu."
        ru: "Она не раскроет код."
        source: { kind: translated, id: 12954465 }
  - id: program
    ru: "программный код"
    examples:
      - pl: "Kod skompilowano w niecałą godzinę."
        ru: "Код скомпилировали меньше чем за час."
        source: { kind: translated, id: 11009504 }
      - pl: "Ten kod nie został napisany zbyt dobrze."
        ru: "Этот код написан не очень хорошо."
        source: { kind: translated, id: 10543667 }
      - pl: "Dzięki dodaniu komentarzy kod jest bardziej przejrzysty."
        ru: "Благодаря комментариям код стал понятнее."
        source: { kind: translated, id: 1133624 }
notes:
  - { kind: usage, text: "Kod pocztowy — «почтовый индекс», а не «почтовый код». Это самое частое сочетание в быту." }
  - { kind: usage, text: "Złamać kod «взломать код», kod kreskowy «штрихкод», kod dostępu «код доступа»." }
  - { kind: government, text: "według kodu «по коду» — предлог według требует родительного падежа." }
  - { kind: pronunciation, text: "Конечное d оглушается, и слово звучит «кот» — в точности как kot «кот». Различают их только написание и контекст." }
collocations:
  - { pl: "kod pocztowy", ru: "почтовый индекс" }
  - { pl: "kod kreskowy", ru: "штрихкод" }
  - { pl: "złamać kod", ru: "взломать код" }
etymology: "Из латинского codex «книга, свод» через французское code. Русский «код» пришёл тем же путём."
memory: "kod — «код», но kod pocztowy значит «почтовый индекс». Осторожно с произношением: конечное d оглушается, и слово звучит как kot «кот»."
