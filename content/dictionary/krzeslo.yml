  - id: on-chair
    ru: "стул (на стуле, под стулом, со стула)"
    examples:
      - pl: "Kot śpi na krześle."
        ru: "Кот спит на стуле."
        source: { kind: tatoeba, id: 360111 }
      - pl: "Jest pod krzesłem."
        ru: "Он под стулом."
        source: { kind: tatoeba, id: 4642252 }
      - pl: "Nagle wstał z krzesła."
        ru: "Внезапно он встал со стула."
        source: { kind: tatoeba, id: 3685306 }
notes:
  - { kind: government, text: "На стуле — na krześle (предложный падеж), под стулом — pod krzesłem (творительный), со стула — z krzesła (родительный)." }
  - { kind: usage, text: "Обратите внимание на чередование: krzesło, но na krześle — согласная смягчается в предложном падеже." }
  - { kind: false-friend, text: "krzesło — это стул со спинкой; кресло с подлокотниками называется fotel. Русское «кресло» звучит похоже на krzesło, но значит fotel — это ложный друг." }
  - { kind: usage, text: "krzesło elektryczne — «электрический стул»." }
collocations:
  - { pl: "na krześle", ru: "на стуле" }
  - { pl: "pod krzesłem", ru: "под стулом" }
  - { pl: "wstać z krzesła", ru: "встать со стула" }
family:
  - { pl: "krzesełko", ru: "стульчик", relation: root }
  - { pl: "fotel", ru: "кресло", relation: root }
  - { pl: "stół", ru: "стол", relation: root, id: stol }
etymology: "От krzesać «высекать, тесать»: первоначально тёсаная скамья. Русское «кресло» — то же слово, но в польском оно означает стул, а кресло будет fotel."
memory: "krzesło — «стул» со спинкой; кресло с подлокотниками — fotel. На стуле — na krześle, с чередованием согласной. Осторожно: русское «кресло» это fotel."
idioms:
  - { pl: "na krześle", ru: "на стуле" }
  - { pl: "wstać z krzesła", ru: "встать со стула" }
  - { pl: "krzesło elektryczne", ru: "электрический стул" }
