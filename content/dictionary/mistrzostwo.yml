notes:
  - { kind: false-friend, text: "Главное здесь в том, что число меняет значение. В единственном числе MISTRZOSTWO это мастерство, ровно как русское слово. Во множественном MISTRZOSTWA это чемпионат, и никакого «мастерства» там уже нет: MISTRZOSTWA ŚWIATA это «чемпионат мира», а не «мастерства мира». Русский для этого держит отдельное слово, «чемпионат», а польский обошёлся числом. Услышав MISTRZOSTWA, сразу думайте о соревновании." }
  - { kind: usage, text: "Девять форм, средний род, склонение как у слов на -STWO: PAŃSTWO, MIASTECZKO. Ловушка в том, что MISTRZOSTWA это одновременно родительный падеж единственного числа и именительный множественного, то есть и «мастерства», и «чемпионат». Различает только согласование: DO MISTRZOSTWA DOCHODZI SIĘ «до мастерства доходят», но MISTRZOSTWA SIĘ ZACZYNAJĄ «чемпионат начинается», с глаголом во множественном." }
  - { kind: government, text: "До мастерства — предлог DO с родительным: DOJŚĆ DO MISTRZOSTWA. На чемпионат и на чемпионате — предлог NA, но с разными падежами: JECHAĆ NA MISTRZOSTWA, винительный, и NA MISTRZOSTWACH, местный, то есть та же пара, что в русском «на чемпионат» и «на чемпионате». Завоевать звание — ZDOBYĆ MISTRZOSTWO, винительный без предлога." }
  - { kind: pronunciation, text: "Читается «мистшо́ство», три слога, ударение на втором. Сочетание TRZ даёт «тш», а не «тр» и не «ч»: это одно из самых характерных польских сочетаний, и в слове MISTRZ оно же. Конечное -STWO звучит «ство», как в русском. Во множественном MISTRZOSTWA ударение остаётся на том же слоге, «мистшо́ства», потому что оно всегда на предпоследнем." }
  - { kind: register, text: "Слово нейтральное и очень частое, прежде всего в спорте: MISTRZOSTWA ŚWIATA, MISTRZOSTWA EUROPY, MISTRZOSTWA POLSKI. В единственном числе оно звучит книжнее и говорит о высоком умении: MISTRZOSTWO W RZEMIOŚLE «мастерство в ремесле», DOJŚĆ DO MISTRZOSTWA. Само слово MISTRZ в польском шире русского «мастера»: это и мастер своего дела, и чемпион, и обращение к выдающемуся художнику." }
