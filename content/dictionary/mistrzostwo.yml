etymology: "От MISTRZ с суффиксом -OSTWO, дающим названия качеств и должностей, как в PAŃSTWO от PAN. Само MISTRZ пришло из немецкого MEISTER, а то из латинского MAGISTER «наставник», и русский «мастер» это ровно то же слово по той же дороге. Разошлось употребление: русский «мастер» остался при ремесле, а для победителя взял французское «чемпион». Польский же пустил MISTRZ и на ремесло, и на спорт, поэтому MISTRZOSTWA и означают чемпионат."
memory: "Число меняет значение: mistrzostwo в единственном это мастерство, mistrzostwa во множественном это чемпионат. Mistrzostwa świata это «чемпионат мира». Корень общий с русским «мастером», оба из немецкого Meister через латинское magister, но польский mistrz значит ещё и «чемпион», поэтому отдельного слова для чемпионата не понадобилось. Коварно совпадение mistrzostwa: это и родительный единственного, и именительный множественного. Читается «мистшо́ство», trz даёт «тш»."
idioms:
  - { pl: "mistrzostwa świata", ru: "чемпионат мира" }
