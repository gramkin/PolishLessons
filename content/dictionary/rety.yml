notes:
  - { kind: false-friend, text: "RETY — «батюшки!», «мамочки!». С русским «ретивый» не связано. Близкий синоним — O RANY или O MATKO." }
  - { kind: usage, text: "Неизменяемое междометие. Чаще всего в сочетании O RETY. Вариант RETYCH — уменьшительный, шутливый." }
  - { kind: government, text: "Ничем не управляет. Стоит в начале фразы, после него — запятая." }
  - { kind: pronunciation, text: "Читается «рэ́ты»: E — «э», Y — «ы». Ударение на первом слоге." }
  - { kind: register, text: "Разговорное, чуть старомодное и шутливое. Часто у детей и пожилых людей." }
collocations:
