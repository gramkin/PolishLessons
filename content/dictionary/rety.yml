etymology: "Из старопольского RETY или RATY — крика о помощи, связанного с RATOWAĆ «спасать» и немецким RETTEN «спасать». Сегодня это просто восклицание удивления."
memory: "Rety — батюшки!: o rety, która godzina? Изначально — крик «спасите», как немецкое retten."
