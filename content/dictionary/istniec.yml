# review
id: istniec
format: 2
lemma: "istnieć"
rank: 515
pos: verb
aspect: imperf
pron: { cyr: "и́стнець" }
senses:
  - id: exist
    ru: "существовать"
    examples:
      - pl: "Czy Bóg istnieje?"
        ru: "Существует ли Бог?"
        source: { kind: tatoeba, id: 4046787 }
      - pl: "Istnieje zagrożenie wojną."
        ru: "Существует угроза войны."
        source: { kind: tatoeba, id: 1002674 }
      - pl: "O ile mi wiadomo, takie słowo nie istnieje."
        ru: "Насколько я знаю, такого слова не существует."
        source: { kind: tatoeba, id: 2707304 }
  - id: existence
    ru: "быть, иметься; istnienie — существование"
    examples:
      - pl: "Wróżki istnieją tylko w bajkach."
        ru: "Феи бывают только в сказках."
        source: { kind: tatoeba, id: 9059397 }
      - pl: "Wierzę w istnienie kosmitów."
        ru: "Я верю в существование инопланетян."
        source: { kind: translated, id: 5961815 }
      - pl: "Jaki jest sens istnienia?"
        ru: "В чём смысл существования?"
        source: { kind: translated, id: 4145022 }
notes:
  - { kind: usage, text: "Личные формы (istnieję, będę istniał) грамматически правильны, но книжные и редкие: обычно istnieć говорят о вещах и явлениях, а не о говорящем. Примеры в будущем времени показывают именно этот книжный оттенок — «существовать в чьей-то памяти», «существовать для кого-то»." }
  - { kind: usage, text: "Безличное Istnieje... часто отвечает русскому «Существует, имеется...»: Istnieje zagrożenie wojną «Существует угроза войны»." }
  - { kind: usage, text: "Причастие istniejący значит «существующий, нынешний, действующий»: istniejący system «существующая система», istniejące przepisy «действующие правила»." }
  - { kind: usage, text: "Отглагольное существительное istnienie — «существование»: sens istnienia «смысл существования», przestać istnieć «перестать существовать»." }
  - { kind: usage, text: "Корень тот же, что в istota «существо» и в русской «истине»: праславянское *jьstъ значило «истинный, подлинный»." }
collocations:
  - { pl: "istnieje zagrożenie", ru: "существует угроза" }
  - { pl: "sens istnienia", ru: "смысл существования" }
  - { pl: "przestać istnieć", ru: "перестать существовать" }
  - { pl: "istniejący system", ru: "существующая система" }
etymology: "От istny «подлинный», праславянское *jьstъ «истинный». Русские «истина» и «истый» — то же гнездо; отсюда же польское istota «существо»."
memory: "istnieć — «существовать», и корень тот же, что в русской «истине»: праславянское *jьstъ значило «истинный, подлинный». Существовать — значит быть подлинным, отсюда же istota «существо». Запомните безличное Istnieje... «Существует, имеется...» и причастие istniejący «существующий, действующий»: istniejące przepisy «действующие правила»."
idioms:
  - { pl: "istnieje zagrożenie", ru: "существует угроза" }
  - { pl: "sens istnienia", ru: "смысл существования" }
  - { pl: "przestać istnieć", ru: "перестать существовать" }
formExamplesSkip:
  - { form: "istniano", reason: "безличная форма: глагол говорит о самом существовании и безличного употребления не допускает" }
  - { form: "istniej", reason: "повелительное наклонение: существовать нельзя приказать, поэтому таких форм в языке нет" }
  - { form: "istniejcie", reason: "повелительное наклонение: существовать нельзя приказать, поэтому таких форм в языке нет" }
  - { form: "istniejmy", reason: "повелительное наклонение: существовать нельзя приказать, поэтому таких форм в языке нет" }
