  - id: urgent
    ru: "срочный, экстренный"
    examples:
      - pl: "W nagłych wypadkach dzwoń pod ten numer."
        ru: "В экстренных случаях звони по этому номеру."
        source: { kind: authored }
      - pl: "Pomoc w nagłych przypadkach jest bezpłatna."
        ru: "Помощь в экстренных случаях бесплатна."
        source: { kind: authored }
      - pl: "To był nagły wypadek, nie planowana wizyta."
        ru: "Это был экстренный случай, а не плановый визит."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ОДИН ИЗ САМЫХ ОПАСНЫХ ЛОЖНЫХ ДРУЗЕЙ ВО ВСЁМ СПИСКЕ. Польское nagły значит «ВНЕЗАПНЫЙ» или «срочный»: nagła śmierć «внезапная смерть», nagły wypadek «экстренный случай». Русское «наглый» значит совсем другое — «дерзкий, бесцеремонный». А слово одно и то же: праславянское *naglъ значило именно «внезапный». Польский сохранил исходный смысл, русский прошёл путь «внезапный» — «опрометчивый» — «дерзкий». Про нахала сказать nagły нельзя: это bezczelny или wstrętny." }
  - { kind: usage, text: "Степеней сравнения у прилагательного нет — отсюда одиннадцать форм, как у kosmiczny и przeciwny. «Более внезапным» быть нельзя: событие либо внезапно, либо нет. Наречие nagle «вдруг, внезапно» встречается даже чаще самого прилагательного." }
  - { kind: pronunciation, text: "ł звучит как короткое у: nagły — «на́гуы», ударение на первом слоге из двух. В формах с гласной после ł звук держится: nagła — «на́гуа», nagłe — «на́гуэ»." }
collocations:
