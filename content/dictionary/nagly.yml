family:
  - { pl: "nagle", ru: "вдруг, внезапно", relation: derived, id: nagle }
  - { pl: "nagłość", ru: "внезапность", relation: derived }
  - { pl: "naglić", ru: "торопить, подгонять", relation: derived }
etymology: "Из праславянского *naglъ «внезапный, стремительный». Польский сохранил исходное значение, русский увёл слово в сторону: внезапный стал опрометчивым, а опрометчивый — дерзким, и получилось «наглый». Отсюда nagle «вдруг», nagłość «внезапность» и naglić «торопить»."
memory: "nagły — «внезапный, срочный», а НЕ «наглый». Слово одно и то же, праславянское, и значило оно как раз «внезапный»: польский смысл сохранил, русский сдвинул к дерзости. Нахал по-польски bezczelny, никак не nagły."
