# review
id: jakkolwiek
format: 2
lemma: "jakkolwiek"
rank: 4470
pos: conj
pron: { cyr: "якко́львек" }
senses:
  - id: however
    ru: "как бы ни, каким бы ни"
    examples:
      - pl: "Chcę ci pomóc, jakkolwiek mogę."
        ru: "Я хочу помочь тебе, как только могу."
        source: { kind: translated, id: 11015380 }
      - pl: "Jakkolwiek mały by nie był, chcę mój własny dom."
        ru: "Каким бы маленьким он ни был, я хочу свой собственный дом."
        source: { kind: translated, id: 2155281 }
      - pl: "Jakkolwiek się starał, nie zdążył."
        ru: "Как он ни старался, не успел."
        source: { kind: authored }
  - id: although
    ru: "хотя, впрочем (книжное)"
    examples:
      - pl: "Jakkolwiek to brzmi, to prawda."
        ru: "Как бы это ни звучало, это правда."
        source: { kind: authored }
      - pl: "Jakkolwiek jest trudno, nie poddamy się."
        ru: "Как бы ни было трудно, мы не сдадимся."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Уступительный оборот «как бы ни»: часто вместе с by nie — jakkolwiek mały by nie był «каким бы маленьким он ни был»." }
  - { kind: false-friend, text: "Частица -kolwiek — та же, что в ktokolwiek «кто угодно», cokolwiek «что угодно», gdziekolwiek «где угодно». Запомнив её один раз, узнаёте весь ряд." }
  - { kind: government, text: "Не изменяется." }
  - { kind: usage, text: "Книжное значение «хотя, впрочем» тоже живо, но в разговорной речи вместо него скажут chociaż." }
collocations:
  - { pl: "jakkolwiek by było", ru: "как бы то ни было" }
etymology: "jak «как» + частица -kolwiek; ср. ktokolwiek «кто угодно», cokolwiek «что угодно»."
memory: "jakkolwiek — «как бы ни». Частица -kolwiek даёт целый ряд: ktokolwiek, cokolwiek, gdziekolwiek, kiedykolwiek."
