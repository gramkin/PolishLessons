notes:
  - { kind: pronunciation, text: "Носовое Ę перед Ż звучит как носовое «эу̃»: SPRĘŻYSTY читается «спрэу̃жы́сты». Ż — твёрдое «ж», за ним Y как «ы». Ударение на предпоследнем слоге, на ŻY." }
  - { kind: usage, text: "Корень тот же, что в SPRĘŻYNA «пружина», и польское Ę здесь отвечает русскому У, как в RĘKA — «рука». Поэтому слово легко узнать: SPRĘŻYSTY — «пружинистый, упругий». В физике SPRĘŻYSTY значит «упругий»: CIAŁO SPRĘŻYSTE «упругое тело», ODKSZTAŁCENIE SPRĘŻYSTE «упругая деформация»." }
  - { kind: usage, text: "Сравнительная степень образуется через -SZY прямо от основы с ST: SPRĘŻYSTSZY, NAJSPRĘŻYSTSZY. Сочетание STSZ трудно выговорить, поэтому в речи часто говорят BARDZIEJ SPRĘŻYSTY. В мужско-личном множественном ST переходит в ŚC: SPRĘŻYŚCI, а в сравнительной степени — SPRĘŻYSTSI." }
