etymology: "От SPRĘŻYNA «пружина» и SPRĘŻAĆ «сжимать, напрягать»; это тот же славянский корень, что в русских «пружина», «напрягать» и «упругий»."
memory: "SPRĘŻYNA — пружина, значит SPRĘŻYSTY — пружинистый. Ę на месте русского У: ręka — рука, sprężyna — пружина."
