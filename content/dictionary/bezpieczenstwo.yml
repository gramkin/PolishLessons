etymology: "Из bez «без» + piecza «забота, попечение»: буквально «то, о чём не нужно печься». Русское «безопасность» построено от «опасности», но итог тот же."
memory: "bezpieczeństwo — «безопасность», и разбирается оно прозрачно: bez + piecza «забота». Самое частое сочетание — pas bezpieczeństwa «ремень безопасности». Прилагательное bezpieczny, наречие bezpiecznie."
