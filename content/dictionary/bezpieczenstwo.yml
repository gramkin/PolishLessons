notes:
  - { kind: usage, text: "Слово разбирается прозрачно: bez «без» + pieczeństwo от piecza «забота, попечение», то есть «состояние, когда заботиться не о чем». Русское «безопасность» собрано иначе, но смысл тот же." }
  - { kind: usage, text: "pas bezpieczeństwa — «ремень безопасности», самое частое сочетание: Proszę zapiąć pas bezpieczeństwa." }
  - { kind: government, text: "martwić się O czyjeś bezpieczeństwo «беспокоиться о чьей-то безопасности» — предлог o и винительный падеж." }
  - { kind: usage, text: "Прилагательное — bezpieczny «безопасный», наречие bezpiecznie. Множественного числа у слова практически нет." }
