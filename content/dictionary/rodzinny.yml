senses:
  - id: family
    ru: "семейный"
    examples:
      - pl: "Telewizja niszczy życie rodzinne."
        ru: "Телевидение разрушает семейную жизнь."
        source: { kind: translated, id: 350030 }
      - pl: "To jest rodzinny sekret."
        ru: "Это семейная тайна."
        source: { kind: translated, id: 2730508 }
      - pl: "Nagły wzrost cen wywiera presję na nasz rodzinny budżet."
        ru: "Резкое повышение цен оказывает давление на наш семейный бюджет."
        source: { kind: tatoeba, id: 3461185 }
  - id: home
    ru: "родной (о городе, краях, доме)"
    examples:
      - pl: "Moje rodzinne miasto leży nad morzem."
        ru: "Мой родной город находится у моря."
        source: { kind: tatoeba, id: 351354 }
      - pl: "Tom powrócił do swojego rodzinnego miasta."
        ru: "Том вернулся в свой родной город."
        source: { kind: translated, id: 531121 }
      - pl: "Chciałbym zobaczyć rodzinne strony."
        ru: "Я хотел бы увидеть родные края."
        source: { kind: translated, id: 758428 }
  - id: family-doctor
    ru: "семейный (врач, дело, традиции)"
    examples:
      - pl: "Powinieneś iść na wizytę do lekarza rodzinnego."
        ru: "Тебе надо бы срочно пойти на приём к своему семейному врачу."
        source: { kind: tatoeba, id: 3514241 }
      - pl: "Po śmierci ojca przejął rodzinny interes."
        ru: "После смерти отца он принял семейное дело."
        source: { kind: translated, id: 1351398 }
      - pl: "Musimy chronić rodzinne tradycje."
        ru: "Мы должны беречь семейные традиции."
        source: { kind: translated, id: 6172364 }
notes:
  - { kind: false-friend, text: "Два русских слова в одном польском: «семейный» (życie rodzinne) и «родной» о месте (miasto rodzinne «родной город»). Но «родной» о человеке будет bliski или kochany, не rodzinny." }
  - { kind: usage, text: "Lekarz rodzinny — «семейный врач», то есть терапевт по месту жительства." }
  - { kind: usage, text: "Strony rodzinne «родные края» и dom rodzinny «родительский дом» — устойчивые сочетания." }
  - { kind: usage, text: "Образовано от rodzina «семья», карточка уже есть." }
collocations:
  - { pl: "życie rodzinne", ru: "семейная жизнь" }
  - { pl: "miasto rodzinne", ru: "родной город" }
  - { pl: "lekarz rodzinny", ru: "семейный врач" }
  - { pl: "dom rodzinny", ru: "родительский дом" }
etymology: "От rodzina «семья», а та от rodzić «рождать», из праславянского *roditi. Русские «род», «родина» и «родить» — то же гнездо."
memory: "rodzinny — и «семейный» (życie rodzinne), и «родной» о месте (miasto rodzinne «родной город»). Но «родной» о человеке — это bliski, не rodzinny. И lekarz rodzinny значит «семейный врач»."
idioms:
