# review
id: idealny
format: 2
lemma: "idealny"
rank: 906
pos: adj
pron: { cyr: "идэа́льны" }
senses:
  - id: perfect
    ru: "идеальный, безупречный"
    examples:
      - pl: "Nikt nie jest idealny."
        ru: "Никто не идеален."
        source: { kind: tatoeba, id: 3864903 }
      - pl: "Żadna kultura nie jest idealna."
        ru: "Никакая культура не идеальна."
        source: { kind: tatoeba, id: 5982761 }
      - pl: "Świat nie jest idealny."
        ru: "Мир не идеален."
        source: { kind: translated, id: 3677229 }
  - id: ideal-for
    ru: "идеальный для кого-л., чего-л."
    examples:
      - pl: "Jesteśmy idealni dla siebie nawzajem."
        ru: "Мы идеальны друг для друга."
        source: { kind: translated, id: 13045993 }
      - pl: "Jesteś idealną dziewczyną."
        ru: "Ты идеальная девушка."
        source: { kind: translated, id: 3866149 }
      - pl: "Jesteś idealnym chłopakiem."
        ru: "Ты идеальный парень."
        source: { kind: translated, id: 3866150 }
  - id: turned-out
    ru: "okazał się idealny — оказался идеальным"
    examples:
      - pl: "Okazał się być idealnym mężem."
        ru: "Он оказался идеальным мужем."
        source: { kind: translated, id: 2246629 }
      - pl: "Dla Johna Sammy był idealnym śpiewakiem."
        ru: "Для Джона Сэмми был идеальным певцом."
        source: { kind: translated, id: 521205 }
      - pl: "Ziemia nie jest idealną kulą."
        ru: "Земля не идеальный шар."
        source: { kind: translated, id: 777781 }
notes:
  - { kind: usage, text: "Слово совпадает с русским «идеальный». Близкий синоним — doskonały «совершенный, превосходный», он звучит чуть книжнее." }
  - { kind: usage, text: "Степеней сравнения у слова нет: идеальное не бывает «идеальнее». Если очень нужно, говорят bardziej idealny, но это звучит как оговорка." }
  - { kind: usage, text: "Наречие — idealnie «идеально»: Pasuje idealnie «Подходит идеально». Существительное — ideał «идеал»." }
  - { kind: government, text: "idealny DLA kogoś «идеальный для кого-то» — родительный после dla; idealny DO czegoś «идеальный для чего-то» — тоже родительный: idealny do pracy." }
collocations:
  - { pl: "nikt nie jest idealny", ru: "никто не идеален" }
  - { pl: "idealny dla ciebie", ru: "идеальный для тебя" }
  - { pl: "pasuje idealnie", ru: "подходит идеально" }
  - { pl: "ideał", ru: "идеал" }
family:
  - { pl: "ideał", ru: "идеал", relation: root }
  - { pl: "idealnie", ru: "идеально", relation: derived }
  - { pl: "doskonały", ru: "совершенный", relation: root }
etymology: "Через французское idéal из греческого ἰδέα «образ, идея». Русское «идеальный» — то же заимствование."
memory: "idealny — «идеальный», слово международное и ловушек не содержит. Степеней сравнения у него нет: идеальное не бывает «идеальнее». Управление через dla или do: idealny dla ciebie, idealny do pracy. Наречие — idealnie."
idioms:
