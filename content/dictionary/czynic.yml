# review
id: czynic
format: 2
lemma: "czynić"
rank: 940
pos: verb
aspect: imperf
pron: { cyr: "чы́ниць" }
senses:
  - id: do
    ru: "делать, творить (книжное)"
    examples:
      - pl: "Trudno jest określać, co dobre, a co złe, ale należy to czynić."
        ru: "Нелегко решать, что правильно, а что нет, но это приходится делать."
        source: { kind: translated, id: 352004 }
      - pl: "Wszystko należy czynić starannie."
        ru: "Всё следует делать старательно."
        source: { kind: translated, id: 1356612 }
      - pl: "Pewne rodzaje pożywienia czynią nas spragnionymi."
        ru: "Некоторые виды пищи вызывают у нас жажду."
        source: { kind: translated, id: 749431 }
  - id: deal-with
    ru: "mieć do czynienia z — иметь дело с"
    note: "Самый частый оборот с этим глаголом в живой речи."
    examples:
      - pl: "Nie wiecie, z kim macie do czynienia!"
        ru: "Вы не знаете, с кем имеете дело!"
        source: { kind: translated, id: 4719265 }
      - pl: "Mam do czynienia z tym problemem."
        ru: "Я имею дело с этой проблемой."
        source: { kind: translated, id: 734107 }
      - pl: "Mamy do czynienia z poważnymi problemami w mieście."
        ru: "Мы имеем дело с серьёзными проблемами в городе."
        source: { kind: translated, id: 12454026 }
  - id: proverbs
    ru: "в пословицах: czynić cuda «творить чудеса»"
    examples:
      - pl: "Jedna jaskółka nie czyni wiosny."
        ru: "Одна ласточка весны не делает."
        source: { kind: translated, id: 592380 }
      - pl: "Wiara czyni cuda!"
        ru: "Вера творит чудеса!"
        source: { kind: translated, id: 1430399 }
      - pl: "Prawa ręka nie wie co czyni lewa."
        ru: "Правая рука не ведает, что творит левая."
        source: { kind: translated, id: 2148306 }
notes:
  - { kind: register, text: "Книжный, высокий глагол. В обычной речи «делать» — это robić. Czynić живёт в пословицах, в церковном и юридическом языке: Nie czyń drugiemu, co tobie niemiłe." }
  - { kind: government, text: "mieć do czynienia Z kimś, z czymś — «иметь дело с кем-то, с чем-то», предлог z с творительным. Это устойчивое выражение и главная причина выучить слово." }
  - { kind: usage, text: "czynić cuda «творить чудеса», czynić dobro «творить добро», czynić starania «прилагать старания», czynić postępy «делать успехи»." }
  - { kind: usage, text: "Совершенный вид — uczynić. Прошедшее время в живой речи почти вытеснено глаголом robić: чаще скажут robił, чем czynił." }
collocations:
  - { pl: "mieć do czynienia z", ru: "иметь дело с" }
  - { pl: "czynić cuda", ru: "творить чудеса" }
  - { pl: "czynić dobro", ru: "творить добро" }
  - { pl: "czynić starania", ru: "прилагать старания" }
family:
  - { pl: "uczynić", ru: "сделать, совершить", relation: aspect }
  - { pl: "czyn", ru: "поступок, деяние", relation: root }
  - { pl: "uczynek", ru: "поступок", relation: derived }
etymology: "Праславянское *činiti «делать, устраивать» — тот же корень, что в русских «учинить», «чин» и «причина». Значение «делать» русский отдал глаголу «делать», а поляк сохранил."
memory: "czynić — книжное «делать, творить»; в живой речи говорят robić. Учить его стоит ради оборота mieć do czynienia Z czymś «иметь дело с чем-то» и ради пословиц: Jedna jaskółka nie czyni wiosny."
idioms:
  - { pl: "jedna jaskółka nie czyni wiosny", ru: "одна ласточка весны не делает" }
  - { pl: "habit nie czyni mnicha", ru: "не всяк монах, на ком клобук" }
  - { pl: "mieć do czynienia z", ru: "иметь дело с" }
  - { pl: "czynić cuda", ru: "творить чудеса" }
