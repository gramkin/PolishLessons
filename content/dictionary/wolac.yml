        source: { kind: authored }
notes:
  - { kind: usage, text: "Самое полезное в этом слове — соответствие, которое открывает сразу целое гнездо. Там, где русский берёт зв- или зов-, польский очень часто берёт woł-. WOŁAĆ отвечает русскому «звать», ZAWOŁAĆ — «позвать», WYWOŁAĆ — «вызвать», ODWOŁAĆ — «отозвать, отменить», PRZYWOŁAĆ — «призвать, подозвать», POWOŁANIE — «призвание», ODWOŁANIE — «отзыв, апелляция». Приставки при этом те же самые, так что достаточно подставить woł- вместо зв-, и слово угадывается." }
  - { kind: false-friend, text: "Две оговорки к этому правилу. Первая: ZWAĆ в польском тоже есть и значит «звать, называть», но стоит он особняком — JAK SIĘ ZWIE? «как его звать?» звучит книжно, в живой речи говорят JAK SIĘ NAZYWA. Вторая важнее: ODWOŁAĆ значит не только «отозвать», но и «отменить», и в этом втором смысле оно встречается чаще — ODWOŁANO LEKCJE «занятия отменили», ODWOŁANO LOT «рейс отменили». Русское «отозвать» такого смысла не имеет." }
  - { kind: government, text: "В первом значении переходный, винительный: WOŁAĆ KOGOŚ — wołałem cię, wołano go. Есть и вариант с предлогом NA и винительным, и он значит «окликать, звать криком»: WOŁAĆ NA KOGOŚ. Во втором значении берёт предлог O с винительным: WOŁAĆ O POMOC, O POMSTĘ, O ROZSTRZYGNIĘCIE — «взывать о помощи, об отмщении», и русский берёт здесь «о» с предложным, так что предлог тот же, а падеж другой. Совершенная пара — ZAWOŁAĆ." }
  - { kind: usage, text: "Шестьдесят три формы — несовершенный переходный, полный набор: сорок одна основная форма, одиннадцать страдательных причастий, десять действительных и деепричастие WOŁAJĄC. Основа одна во всех формах, как у всех глаголов на -AĆ: WOŁAM, WOŁA, WOŁAJĄ, WOŁAŁ, WOŁANY. Повелительное WOŁAJ выходит из третьего лица WOŁA прибавлением -j. Отглагольное существительное WOŁANIE значит «зов, клич», а в переносном смысле — «призыв»." }
collocations:
  - { pl: "wołać o pomoc", ru: "взывать о помощи" }
  - { pl: "wołać kogoś po imieniu", ru: "звать кого-либо по имени" }
  - { pl: "wołanie o pomoc", ru: "зов о помощи" }
family:
  - { pl: "zawołać", ru: "позвать", relation: aspect, id: zawolac }
  - { pl: "wywołać", ru: "вызвать", relation: derived, id: wywolac }
  - { pl: "odwołać", ru: "отозвать, отменить", relation: derived, id: odwolac }
etymology: "Из праславянского *volati «кричать, звать», откуда и украинское «волати», и чешское volat. Русский этого глагола не сохранил, зато сохранил родственное «вопить» и книжное «воззвать» от другого корня, так что прямой пары в русском нет. Зато всё гнездо приставочных слов отвечает русским на зв-: ZAWOŁAĆ «позвать», WYWOŁAĆ «вызвать», ODWOŁAĆ «отозвать», PRZYWOŁAĆ «призвать», POWOŁANIE «призвание». Отсюда и WOŁANIE «зов», и WOŁACZ — звательный падеж."
memory: "Где русский берёт зв-, польский берёт woł-: wołać «звать», zawołać «позвать», wywołać «вызвать», odwołać «отозвать». Но odwołać чаще значит «отменить»."
idioms:
