# review
id: poprawic
format: 2
lemma: "poprawić"
rank: 2020
pos: verb
pron: { cyr: "попра́виць" }
senses:
  - id: correct
    ru: "исправить (ошибку, текст)"
    examples:
      - pl: "Poprawiła dwa błędy w zdaniu."
        ru: "Она исправила две ошибки в предложении."
        source: { kind: authored }
      - pl: "Poprawione wypracowania leżą na biurku."
        ru: "Исправленные сочинения лежат на столе."
        source: { kind: authored }
      - pl: "Popraw to, zanim oddasz."
        ru: "Исправь это, прежде чем сдавать."
        source: { kind: authored }
  - id: adjust
    ru: "поправить (одежду, волосы, подушку)"
    examples:
      - pl: "Poprawił krawat przed lustrem."
        ru: "Он поправил галстук перед зеркалом."
        source: { kind: authored }
      - pl: "Poprawiła włosy i weszła do sali."
        ru: "Она поправила волосы и вошла в зал."
        source: { kind: authored }
  - id: improve
    ru: "улучшить; poprawić się — улучшиться, исправиться"
    examples:
      - pl: "Poprawił wynik o dwie sekundy."
        ru: "Он улучшил результат на две секунды."
        source: { kind: authored }
      - pl: "Pogoda poprawiła się nad ranem."
        ru: "Погода улучшилась под утро."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ОСТОРОЖНО С ВОЗВРАТНОЙ ФОРМОЙ. Польское poprawić się значит «исправиться» (о поведении) или «улучшиться» (о погоде, настроении, оценках) — но НЕ «поправиться» в смысле «потолстеть». Прибавить в весе будет przytyć. Сказать o kimś, że się poprawił, — это похвала его поведению, а не замечание о фигуре." }
  - { kind: government, text: "Исправляют ЧТО — винительный: poprawić błąd, tekst, krawat, wynik. Возвратное poprawić się работает и о человеке (poprawił się po tej rozmowie «он исправился после того разговора»), и о положении дел (pogoda się poprawiła). Расхождений в падеже с русским нет." }
  - { kind: usage, text: "Вид совершенный, несовершенная пара — poprawiać. Страдательное причастие по правилу для -ić: poprawiony, poprawieni, как zatrudniony и zaprowadzony. Существительное poprawka значит и «поправка» к тексту, и «пересдача» экзамена — второе значение чисто школьное и очень частое." }
  - { kind: register, text: "Прилагательное poprawny от того же корня значит «правильный, корректный», а не «поправимый»: poprawna odpowiedź — «правильный ответ», poprawna polszczyzna — «правильный польский». Это слово пригодится на любом экзамене." }
collocations:
  - { pl: "poprawić błąd", ru: "исправить ошибку" }
  - { pl: "poprawić humor", ru: "поднять настроение" }
  - { pl: "poprawna odpowiedź", ru: "правильный ответ" }
family:
  - { pl: "prawy", ru: "правый", relation: root, id: prawy }
  - { pl: "poprawiać", ru: "исправлять, поправлять", relation: aspect }
  - { pl: "poprawka", ru: "поправка; пересдача", relation: derived }
etymology: "Приставка po- плюс prawić от prawy «правый, прямой» — ровно те же части, что в русском «по-править» от «правый». Исходный образ общий: сделать прямым, выпрямить. Отсюда poprawka «поправка», poprawny «правильный» и poprawczy «исправительный»."
memory: "poprawić — «исправить, поправить», разбирается как русское «по-править» от «правый». Но помните ловушку: poprawić się это «исправиться» или «улучшиться», а «поправиться» в смысле веса будет przytyć."
idioms:
  - { pl: "poprawić komuś humor", ru: "поднять кому-л. настроение" }
  - { pl: "zdawać poprawkę", ru: "пересдавать экзамен" }
