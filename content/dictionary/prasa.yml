# review
id: prasa
format: 2
lemma: "prasa"
rank: 1891
pos: noun
pron: { cyr: "пра́са" }
senses:
  - id: press-media
    ru: "пресса, печать"
    examples:
      - pl: "Prasa oszaleje na punkcie tej historii."
        ru: "Пресса сойдёт с ума от этой истории."
        source: { kind: translated, id: 11011672 }
      - pl: "Premier spotkał się z prasą."
        ru: "Премьер-министр встретился с прессой."
        source: { kind: translated, id: 10463735 }
      - pl: "On zwykle przed śniadaniem przegląda prasę."
        ru: "Он обычно просматривает прессу перед завтраком."
        source: { kind: translated, id: 836981 }
      - pl: "Oto wolność prasy."
        ru: "Вот она, свобода прессы."
        source: { kind: translated, id: 6046639 }
      - pl: "W kraju demokratycznym ważna jest wolność prasy."
        ru: "В демократической стране важна свобода прессы."
        source: { kind: translated, id: 1002720 }
      - pl: "Ta firma wydała oświadczenie dla prasy."
        ru: "Эта фирма выпустила заявление для прессы."
        source: { kind: translated, id: 1920861 }
  - id: press-machine
    ru: "пресс (машина)"
    examples:
      - pl: "Stara prasa drukarska stoi w muzeum."
        ru: "Старый печатный пресс стоит в музее."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Одно польское слово покрывает сразу два русских: prasa — это и «пресса», и «пресс» (машина). Какое значение имеется в виду, подсказывает контекст." }
  - { kind: usage, text: "Прилагательное — prasowy: konferencja prasowa «пресс-конференция», wolność prasy «свобода прессы»." }
  - { kind: usage, text: "Глагол того же корня prasować в быту значит «гладить утюгом» — утюг ведь тоже прижимает." }
  - { kind: usage, text: "Два значения расходятся в числе: prasa «печать, пресса» употребляется только в единственном числе, а множественное prasy принадлежит машине — prasy drukarskie «печатные прессы», prasy hydrauliczne." }
collocations:
  - { pl: "wolność prasy", ru: "свобода прессы" }
  - { pl: "konferencja prasowa", ru: "пресс-конференция" }
  - { pl: "czytać prasę", ru: "читать прессу" }
etymology: "Из латинского pressare «давить» через немецкое Presse. Русские «пресс» и «пресса» — то же самое слово: русский развёл два значения по двум словам, а польский оставил одно."
memory: "prasa — это и «пресса», и «пресс». А prasować — «гладить утюгом»: утюг ведь тоже прижимает."
idioms:
  - { pl: "wolność prasy", ru: "свобода прессы" }
  - { pl: "konferencja prasowa", ru: "пресс-конференция" }
  - { pl: "mieć dobrą prasę", ru: "пользоваться хорошей репутацией в прессе" }
formExamplesSkip:
  - { form: "praso", reason: "звательная форма, в корпусе примеров нет" }
