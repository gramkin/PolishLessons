  - { pl: "porównanie", ru: "сравнение", relation: derived }
  - { pl: "równać", ru: "ровнять, равнять", relation: root }
etymology: "Приставка po- плюс równać, от równy, из праславянского *orvьnъ — того же слова, что русские «ровный» и «равный». Русский развёл эти значения по двум словам, польский оставил одно: równy значит и ровный, и равный. Русское «сравнить» построено из тех же частей, но с приставкой с-. Отсюда porównanie, porównawczy, wyrównać и równocześnie."
memory: "porównać — «сравнить», и собрано из тех же частей: po- плюс równy, как русское с- плюс «равный». Два предлога: porównać Z czymś «сравнить с», porównać DO czegoś «уподобить». Русский обходится одним «с»."
idioms:
  - { pl: "w porównaniu z czymś", ru: "по сравнению с чем-л." }
  - { pl: "nie ma porównania", ru: "не идёт ни в какое сравнение" }
