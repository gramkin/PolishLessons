        source: { kind: authored }
  - id: liken
    ru: "сравнить, уподобить"
    examples:
      - pl: "Porównał miasto do mrowiska."
        ru: "Он сравнил город с муравейником."
        source: { kind: authored }
      - pl: "Krytyk porównał ją do młodej Szymborskiej."
        ru: "Критик сравнил её с молодой Шимборской."
        source: { kind: authored }
  - id: noun-comparison
    ru: "porównanie — сравнение"
    examples:
      - pl: "W porównaniu z zeszłym rokiem jest lepiej."
        ru: "По сравнению с прошлым годом лучше."
        source: { kind: authored }
notes:
  - { kind: government, text: "ДВА ПРЕДЛОГА, И ОНИ НЕ ВЗАИМОЗАМЕНИМЫ. Porównać coś Z czymś, с творительным, значит «сравнить на равных»: porównać ceny z zeszłorocznymi. Porównać coś DO czegoś, с родительным, значит «уподобить»: porównał ją do matki. Русский в обоих случаях говорит «сравнить с», поэтому выбор приходится делать заново." }
  - { kind: false-friend, text: "ОБА ЯЗЫКА СОБРАЛИ ЭТО СЛОВО ИЗ ОДНИХ ЧАСТЕЙ. Польское po- плюс równać «ровнять», от równy «равный, ровный»; русское с- плюс «равн-» в «сравнить». Корень один и тот же, различается только приставка. Так что równy это и «ровный», и «равный» — русский развёл их по двум словам, польский держит в одном." }
  - { kind: usage, text: "Вид совершенный, несовершенная пара — porównywać. Отсюда деепричастие porównawszy и отсутствие причастия настоящего времени. Существительное porównanie очень частотно в обороте w porównaniu z czymś «по сравнению с чем-л.», а прилагательное porównawczy значит «сравнительный»: analiza porównawcza." }
  - { kind: pronunciation, text: "Три слога, ударение на предпоследнем: po-RÓW-nać. Ó читается как у, w перед n остаётся звонким: «пору́внаць». В формах с окончанием ударение остаётся предпоследним: porównaliśmy — «порувнали́шмы»." }
collocations:
  - { pl: "porównać ceny", ru: "сравнить цены" }
  - { pl: "w porównaniu z", ru: "по сравнению с" }
