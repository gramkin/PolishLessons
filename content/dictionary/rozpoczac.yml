# review
id: rozpoczac
format: 2
lemma: "rozpocząć"
rank: 1538
pos: verb
aspect: perf
pron: { cyr: "розпо́чонць" }
senses:
  - id: begin-tr
    ru: "начать (что-либо)"
    examples:
      - pl: "Postanowił rozpocząć nowe życie."
        ru: "Он решил начать новую жизнь."
        source: { kind: translated, id: 2408651 }
      - pl: "Rozpoczął służbę w policji."
        ru: "Он начал службу в полиции."
        source: { kind: translated, id: 525324 }
      - pl: "Kiedy Justin Bieber rozpoczął karierę muzyczną, miał zaledwie 14 lat."
        ru: "Когда Джастин Бибер начал свою музыкальную карьеру, ему было четырнадцать лет."
        source: { kind: tatoeba, id: 478288 }
  - id: begin-intr
    ru: "начаться (с się)"
    examples:
      - pl: "Budowa powinna rozpocząć się w październiku."
        ru: "Строительство должно начаться в октябре."
        source: { kind: tatoeba, id: 10602898 }
      - pl: "Renesans rozpoczął się we Włoszech."
        ru: "Возрождение началось в Италии."
        source: { kind: tatoeba, id: 11570883 }
      - pl: "Budowa rozpoczęła się 20 października 2013 roku."
        ru: "Строительство началось 20 октября 2013 года."
        source: { kind: tatoeba, id: 8617640 }
notes:
  - { kind: usage, text: "Без się — «начать что-то» (rozpocząć pracę), с się — «начаться» (spotkanie się rozpoczęło). Та же пара, что у zacząć и zacząć się." }
  - { kind: usage, text: "rozpocząć звучит официальнее, чем zacząć: в объявлениях и документах обычно rozpocząć, в разговоре — zacząć." }
  - { kind: government, text: "Без się требует винительного падежа: rozpocząć naukę «начать учёбу», rozpocząć pracę «начать работу»." }
  - { kind: usage, text: "Несовершенный вид — rozpoczynać (się). Существительное rozpoczęcie значит «начало»: przed rozpoczęciem «перед началом»." }
collocations:
  - { pl: "rozpocząć pracę", ru: "начать работу" }
  - { pl: "rozpocząć się", ru: "начаться" }
  - { pl: "przed rozpoczęciem", ru: "перед началом" }
etymology: "Приставка roz- + począć «начать» (тот же корень, что в zacząć и początek «начало»), праславянское *čęti. Русское «начать» — то же гнездо, так что rozpocząć и «начать» родственны."
memory: "rozpocząć = «начать», а с się — «начаться»: spotkanie się rozpoczęło. Звучит официальнее, чем zacząć. Несовершенный вид — rozpoczynać, существительное — rozpoczęcie «начало»."
idioms:
  - { pl: "rozpocząć od zera", ru: "начать с нуля" }
  - { pl: "rozpocząć nowe życie", ru: "начать новую жизнь" }
  - { pl: "przed rozpoczęciem", ru: "перед началом" }
