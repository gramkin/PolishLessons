id: blahy
format: 2
lemma: "błahy"
rank: 5530
pos: adj
pron: { cyr: "буа́хы" }
senses:
  - id: trivial
    ru: "пустяковый, незначительный"
    examples:
      - pl: "To błahy problem."
        ru: "Это пустяковая проблема."
        source: { kind: translated, id: 2784719 }
      - pl: "Twoje zmartwienia są błahe przy moich."
        ru: "Твои заботы пустяковые по сравнению с моими."
        source: { kind: translated, id: 768763 }
      - pl: "To błahy powód do kłótni."
        ru: "Это пустяковый повод для ссоры."
        source: { kind: authored }
  - id: petty
    ru: "мелкий, ничтожный"
    examples:
      - pl: "Nie kłóćmy się o błahe sprawy."
        ru: "Не будем ссориться из-за мелочей."
        source: { kind: authored }
      - pl: "Sprawa wcale nie jest błaha."
        ru: "Дело вовсе не пустяковое."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Книжноватое слово; в разговорной речи скажут drobny «мелкий» или nieważny «неважный»." }
  - { kind: false-friend, text: "Не «благой»! Польское błahy значит «пустяковый», тогда как русское «благой» — «хороший, добрый». Слова созвучны, но смысл противоположный по окраске." }
  - { kind: government, text: "Обычное прилагательное; наречие — błaho, существительное — błahostka «пустяк»." }
  - { kind: usage, text: "Часто в отрицании: sprawa niebłaha «дело нешуточное»." }
  - { kind: government, text: "Сравнительная и превосходная степени обычны — błahszy powód, najbłahsza sprawa, — но мужско-личных форм не бывает: пустяковым бывает дело или повод, а не человек." }
collocations:
  - { pl: "błahy problem", ru: "пустяковая проблема" }
  - { pl: "błaha sprawa", ru: "пустяковое дело" }
etymology: "Праславянское *blahъ «слабый, negодный»; русское «благой» — то же слово, но значение разошлось в противоположную сторону."
memory: "błahy — «пустяковый», а вовсе не «благой». Созвучие с русским обманчиво: значения разошлись. Существительное — błahostka «пустяк»."
idioms:
  - { pl: "błaha sprawa", ru: "пустяковое дело" }
formExamplesSkip:
  - { form: "błahsi", reason: "мужско-личная форма множественного числа, а błahy говорится о деле, причине или поводе: błahy problem, błaha sprawa, błahy powód. О человеке так не говорят, поэтому нет и мужско-личной формы сравнительной степени" }
  - { form: "błazi", reason: "мужско-личная форма множественного числа, а błahy говорится о деле, причине или поводе: błahy problem, błaha sprawa, błahy powód. О человеке так не говорят, поэтому этой формы в текстах нет — тем более что и по виду она ближе к błazen «шут», чем к błahy" }
  - { form: "najbłahsi", reason: "мужско-личная форма множественного числа, а błahy говорится о деле, причине или поводе: błahy problem, błaha sprawa, błahy powód. О человеке так не говорят, поэтому нет и мужско-личной формы превосходной степени" }
