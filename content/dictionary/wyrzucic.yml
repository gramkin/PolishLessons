# review
id: wyrzucic
format: 2
lemma: "wyrzucić"
rank: 1048
pos: verb
aspect: perf
pron: { cyr: "выжу́циць" }
senses:
  - id: throw-out
    ru: "выбросить"
    examples:
      - pl: "Wyrzuć śmieci."
        ru: "Выброси мусор."
        source: { kind: translated, id: 3108261 }
      - pl: "Tom wyrzucił śmieci."
        ru: "Том выбросил мусор."
        source: { kind: translated, id: 2470057 }
      - pl: "Gdzie mogę to wyrzucić?"
        ru: "Где я могу это выбросить?"
        source: { kind: translated, id: 6154873 }
  - id: fire
    ru: "выгнать, уволить"
    examples:
      - pl: "Wczoraj wyrzucili mnie z pracy."
        ru: "Вчера меня выгнали с работы."
        source: { kind: translated, id: 6547831 }
      - pl: "Wyrzucili go za kradzież."
        ru: "Они выгнали его за кражу."
        source: { kind: translated, id: 367811 }
      - pl: "Jego syna wyrzucono ze szkoły."
        ru: "Его сына выгнали из школы."
        source: { kind: translated, id: 355317 }
  - id: thrown-out
    ru: "wyrzucony — выброшенный, уволенный"
    examples:
      - pl: "Tom zostanie wyrzucony z pracy."
        ru: "Тома уволят с работы."
        source: { kind: translated, id: 6603192 }
      - pl: "Pingwin został wyrzucony z grupy."
        ru: "Пингвина выгнали из группы."
        source: { kind: translated, id: 10468664 }
      - pl: "Jest dużo wyrzuconych plastikowych butelek wokół automatu."
        ru: "Вокруг автомата много выброшенных пластиковых бутылок."
        source: { kind: translated, id: 13563662 }
notes:
  - { kind: usage, text: "Два значения сразу: «выбросить» вещь и «выгнать, уволить» человека. Wyrzucić śmieci «выбросить мусор», но wyrzucili go z pracy «его уволили»." }
  - { kind: government, text: "wyrzucić kogoś Z czegoś — «выгнать откуда-то», предлог z с родительным: wyrzucić z pracy, wyrzucić ze szkoły." }
  - { kind: usage, text: "Несовершенный вид — wyrzucać. Отглагольное существительное wyrzucenie значит «удаление, исключение»." }
  - { kind: usage, text: "Разбирается прозрачно: wy- + rzucić «бросить». Русское «выбросить» устроено так же." }
collocations:
  - { pl: "wyrzucić śmieci", ru: "выбросить мусор" }
  - { pl: "wyrzucić z pracy", ru: "уволить с работы" }
  - { pl: "wyrzucić ze szkoły", ru: "выгнать из школы" }
  - { pl: "wyrzuć to", ru: "выброси это" }
family:
  - { pl: "wyrzucać", ru: "выбрасывать", relation: aspect }
  - { pl: "rzucić", ru: "бросить", relation: root }
  - { pl: "wyrzutek", ru: "изгой", relation: derived }
etymology: "Приставка wy- + rzucić «бросить». Русское «выбросить» собрано ровно так же, а «рушить»-«ручить» тут ни при чём: корень тот же, что в «бросок»."
memory: "wyrzucić — «выбросить», но и «выгнать, уволить»: wyrzucić śmieci «выбросить мусор», но wyrzucili go z pracy «его уволили». Управление одно: wyrzucić kogoś Z czegoś."
idioms:
  - { pl: "wyrzucić śmieci", ru: "выбросить мусор" }
  - { pl: "wyrzucić z pracy", ru: "уволить с работы" }
  - { pl: "wyrzucić ze szkoły", ru: "выгнать из школы" }
