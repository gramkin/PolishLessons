# review
id: posluchac
format: 2
lemma: "posłuchać"
rank: 286
pos: verb
aspect: perf
pron: { cyr: "посуу́хаць" }
senses:
  - id: listen
    ru: "послушать (кого-либо, что-либо)"
    note: "Требует родительного падежа: posłuchaj muzyki, posłuchaj mnie."
    examples:
      - pl: "Posłuchajcie mnie."
        ru: "Послушайте меня."
        source: { kind: tatoeba, id: 12478458 }
      - pl: "Proszę posłuchać."
        ru: "Послушайте, пожалуйста."
        source: { kind: translated, id: 8617622 }
      - pl: "Posłuchaj!"
        ru: "Послушай!"
        source: { kind: translated, id: 8498759 }
  - id: obey
    ru: "послушаться, последовать совету"
    examples:
      - pl: "Posłuchałbyś mojej rady, nie byłbyś teraz w tarapatach."
        ru: "Послушал бы ты моего совета, не был бы сейчас в беде."
        source: { kind: translated, id: 4725773 }
      - pl: "Posłuchałaś się swojej matki."
        ru: "Ты послушалась свою мать."
        source: { kind: translated, id: 9255825 }
      - pl: "Posłucham się twojej rady."
        ru: "Я последую твоему совету."
        source: { kind: translated, id: 4040997 }
notes:
  - { kind: usage, text: "Главная трудность — падеж: słuchać и posłuchać требуют родительного, а не винительного. Posłuchaj muzyki «Послушай музыку», Posłuchaj mnie «Послушай меня»." }
  - { kind: usage, text: "Второе значение — «послушаться»: posłuchać rodziców «послушаться родителей». Возвратное posłuchać się kogoś значит то же самое." }
  - { kind: usage, text: "Несовершенный вид — słuchać: Słucham muzyki codziennie." }
  - { kind: usage, text: "Słucham? в ответ по телефону значит «Алло?», а в разговоре — «Простите, что?»" }
collocations:
  - { pl: "posłuchaj mnie", ru: "послушай меня" }
  - { pl: "posłuchać rady", ru: "послушаться совета" }
  - { pl: "posłuchać muzyki", ru: "послушать музыку" }
  - { pl: "posłuchaj uważnie", ru: "послушай внимательно" }
etymology: "Из po- + słuchać, от słuch «слух», праславянское *sluxъ; то же гнездо, что русские «слух», «слушать», «слушаться»."
memory: "Главное — падеж: słuchać и posłuchać требуют родительного: Posłuchaj muzyki, Posłuchaj mnie. По-русски мы говорим «послушай музыку» в винительном."
idioms:
  - { pl: "posłuchaj mnie", ru: "послушай меня" }
  - { pl: "posłuchać rady", ru: "послушаться совета" }
  - { pl: "nie posłuchać nikogo", ru: "никого не послушаться" }
