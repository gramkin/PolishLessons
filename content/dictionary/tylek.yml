  - id: on-the-butt
    ru: "в оборотах о безделье и досаде"
    examples:
      - pl: "Jesteś wrzodem na tyłku!"
        ru: "Ты заноза в заднице!"
        source: { kind: translated, id: 10545310 }
      - pl: "Mrówka może ugryźć tyłek słonia, ale słoń nie może ugryźć tyłka mrówki."
        ru: "Муравей может укусить слона за зад, но слон не может укусить муравья за зад."
        source: { kind: translated, id: 10781124 }
notes:
  - { kind: register, text: "Разговорное, но заметно мягче, чем dupa: tyłek примерно соответствует русскому «попа», а dupa — «жопа». Именно tyłek говорят детям и в вежливой беседе." }
  - { kind: usage, text: "skopać komuś tyłek — «надрать кому-то задницу», обычная угроза в разговорной речи." }
  - { kind: usage, text: "wrzód na tyłku — «заноза в заднице», о надоедливом человеке." }
collocations:
  - { pl: "skopać komuś tyłek", ru: "надрать кому-то задницу" }
  - { pl: "siedzieć na tyłku", ru: "сидеть сложа руки, протирать штаны" }
  - { pl: "wrzód na tyłku", ru: "заноза в заднице" }
etymology: "Уменьшительное от tył «зад, задняя сторона» с суффиксом -ek. Русское «тыл» — то же слово, но в русском оно осталось военным и географическим."
memory: "tyłek — «попа», мягкий вариант; dupa — «жопа», грубый. От tył «зад», того же корня, что русский «тыл»."
idioms:
  - { pl: "skopać komuś tyłek", ru: "надрать кому-то задницу" }
  - { pl: "wrzód na tyłku", ru: "заноза в заднице" }
  - { pl: "siedzieć na tyłku", ru: "сидеть сложа руки, протирать штаны" }
