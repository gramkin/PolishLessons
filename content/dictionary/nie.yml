        ru: "Это не мой дом."
        source: { kind: authored }
  - id: tag-question
    ru: "в переспросе и в составе отрицательных ответов"
    examples:
      - pl: "Nie, siadaj."
        ru: "Нет, садись."
        source: { kind: tatoeba, id: 393097 }
      - pl: "Nie przegram!"
