notes:
  - { kind: usage, text: "С глаголами пишется раздельно (nie wiem), с прилагательными и наречиями слитно (niedobry, niedobrze) — как в русском." }
  - { kind: usage, text: "Двойное отрицание обязательно: Nikt nic nie wie «Никто ничего не знает»." }
  - { kind: government, text: "Отрицание переводит прямое дополнение из винительного в родительный: Mam czas → Nie mam czasu, Znam go → Nie znam go. В русском такого сдвига нет, и его пропускают чаще всего." }
  - { kind: usage, text: "Переспрос строится частицей prawda? или самим nie в конце: Idziesz, nie? «Ты идёшь, нет?». Ответ на отрицательный вопрос по-польски прямой: Nie lubisz? — Nie «Не любишь? — Нет (не люблю)»." }
collocations:
  - { pl: "nie ma", ru: "нет, не имеется" }
  - { pl: "już nie", ru: "больше не" }
  - { pl: "jeszcze nie", ru: "ещё не" }
etymology: "Праславянское *ne «не» — то же слово, что русское «не»; родственно литовскому ne и латинскому ne."
memory: "Совпадает с русским «не/нет», и двойное отрицание работает так же: Nikt nigdy nic nie mówi. Отдельно запомните безличное nie ma «нет, не имеется»: Nie ma go w domu «Его нет дома»."
idioms:
  - { pl: "nie ma sprawy", ru: "не за что, без проблем" }
  - { pl: "nie ma mowy", ru: "не может быть и речи" }
  - { pl: "no nie!", ru: "да ну!" }
