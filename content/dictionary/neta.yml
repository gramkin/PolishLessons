  - { kind: usage, text: "Женский род. В дательном и предложном T переходит в C: W NĘCIE, KU NĘCIE. Звательный NĘTO не употребляется." }
  - { kind: pronunciation, text: "Ę перед T читается «эн»: «нэ́нта»." }
