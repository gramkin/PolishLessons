# review
id: strzelic
format: 2
lemma: "strzelić"
rank: 1978
pos: verb
aspect: perf
aspectPair: strzelac
pron: { cyr: "стшэ́личь" }
senses:
  - id: shoot
    ru: "выстрелить"
    examples:
      - pl: "Stój albo strzelę."
        ru: "Стой, или я выстрелю."
        source: { kind: translated, id: 559522 }
      - pl: "Strzelił do mnie."
        ru: "Он в меня выстрелил."
        source: { kind: translated, id: 8633082 }
      - pl: "On strzelił pierwszy!"
        ru: "Он выстрелил первым!"
        source: { kind: translated, id: 9423676 }
      - pl: "Myśliwy strzelił do ptaka."
        ru: "Охотник выстрелил в птицу."
        source: { kind: tatoeba, id: 364105 }
      - pl: "Strzeliła do niego."
        ru: "Она в него выстрелила."
        source: { kind: translated, id: 11597524 }
      - pl: "Strzelił do krokodyla."
        ru: "Он выстрелил в крокодила."
        source: { kind: translated, id: 10469022 }
  - id: score
    ru: "забить (гол)"
    examples:
      - pl: "Tom strzelił gola."
        ru: "Том забил гол."
        source: { kind: translated, id: 3729012 }
      - pl: "Tom strzelił bramkę."
        ru: "Том забил мяч."
        source: { kind: translated, id: 3729011 }
      - pl: "Możesz raz strzelić."
        ru: "Можешь выстрелить один раз."
        source: { kind: translated, id: 8182267 }
notes:
  - { kind: usage, text: "Совершенный вид к strzelać, у которого своя карточка: strzela «стреляет» — strzeli «выстрелит»." }
  - { kind: usage, text: "В спорте значит «забить»: strzelić gola, strzelić bramkę — оба сочетания значат «забить гол»." }
  - { kind: usage, text: "Стрелять в кого-либо — strzelić do kogoś, с предлогом do и родительным падежом, а не «в» с винительным, как по-русски." }
  - { kind: usage, text: "Разговорное strzelić focha значит «надуться, обидеться», а co ci strzeliło do głowy — «что тебе взбрело в голову»." }
collocations:
  - { pl: "strzelić gola", ru: "забить гол" }
  - { pl: "strzelić do kogoś", ru: "выстрелить в кого-либо" }
  - { pl: "co ci strzeliło do głowy", ru: "что тебе взбрело в голову" }
etymology: "От strzała «стрела», праславянское *strěla. Русская «стрела» и «стрелять» — то же самое слово и тот же корень."
memory: "strzelić — «выстрелить», совершенный вид к strzelać. В футболе — «забить»: strzelić gola. Стреляют do kogoś, с предлогом do."
idioms:
  - { pl: "strzelić gola", ru: "забить гол" }
  - { pl: "strzelić do kogoś", ru: "выстрелить в кого-либо" }
  - { pl: "co ci strzeliło do głowy", ru: "что тебе взбрело в голову" }
