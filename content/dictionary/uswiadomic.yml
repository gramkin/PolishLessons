notes:
  - { kind: false-friend, text: "UŚWIADOMIĆ — от ŚWIADOMY, «сознательный», и русскому «осведомить» лишь созвучно. Самое частое — UŚWIADOMIĆ SOBIE, «осознать, понять»: UŚWIADOMIŁEM SOBIE, ŻE — дословно «дал себе знать». Русское «уведомить» официально — POWIADOMIĆ, ZAWIADOMIĆ. UŚWIADOMIĆ DZIECKO — ещё и «рассказать ребёнку о сексе»." }
  - { kind: usage, text: "Пятьдесят три формы — подпись переходного глагола совершенного вида: страдательное UŚWIADOMIONY, «осведомлённый, сознательный», и деепричастие UŚWIADOMIWSZY. Видовой партнёр — UŚWIADAMIAĆ: KAMPANIA UŚWIADAMIA LUDZIOM ZAGROŻENIA. Чередование: UŚWIADOMIĆ — UŚWIADAMIAĆ, O → A." }
  - { kind: government, text: "Две схемы. Кому что — дательный и винительный: UŚWIADOMIĆ KOMUŚ PROBLEM, и себе — UŚWIADOMIĆ SOBIE COŚ. Кого о чём — винительный и O с местным: UŚWIADOMIĆ KOGOŚ O RYZYKU. Придаточное — с ŻE: UŚWIADOMIĆ SOBIE, ŻE." }
  - { kind: pronunciation, text: "Читается «усьвядо́миць», четыре слога, ударение на предпоследнем. Ś перед W — мягкое «сь», IA — «я». MI — мягкое «ми», конечное Ć — «ць». Повелительное UŚWIADOM — «усьвя́дом»." }
  - { kind: register, text: "UŚWIADOMIĆ SOBIE — нейтральное и очень частое в рассказе о внезапном понимании. Значение «просветить» — из языка кампаний и публицистики: KAMPANIA UŚWIADAMIAJĄCA, «просветительская кампания»." }
collocations:
  - { pl: "uświadomić sobie", ru: "осознать" }
  - { pl: "uświadomić komuś problem", ru: "дать кому-то понять проблему" }
  - { pl: "w pełni uświadomiony", ru: "полностью осведомлённый" }
family:
  - { pl: "uswiadamiac", ru: "осознавать, просвещать", relation: aspect }
  - { pl: "świadomy", ru: "сознательный, осознанный", relation: root, id: swiadomy }
  - { pl: "świadomość", ru: "сознание, осознание", relation: root, id: swiadomosc }
etymology: "Приставка U- плюс ŚWIADOMIĆ, от ŚWIADOMY «знающий, сознательный», корень WIED- «ведать». Русское «сведомый», «осведомлённый» — тот же корень с иной приставкой."
memory: "Uświadomić sobie — осознать: uświadomiłem sobie, że jest późno. Uświadomić komuś coś — дать понять. Уведомить — powiadomić! От świadomy — сознательный. Читается «усьвядо́миць»."
idioms:
  - { pl: "uświadomić sobie prawdę", ru: "осознать правду" }
