etymology: "От существительного AWARIA, которое пришло через немецкий и итальянский от арабского слова со значением «изъян, повреждение товара». Торговый термин сперва означал порчу груза в пути, потом всякую поломку. Русская «авария» заимствована тем же путём и из того же источника, поэтому слова и похожи, но польское удержалось ближе к первоначальному смыслу повреждения, а русское сдвинулось к происшествию и столкновению. Отсюда и расхождение, из-за которого дорожное происшествие по-польски называется WYPADEK, буквально «выпадение, случай», а не AWARIA."
memory: "Относительное прилагательное, одиннадцать форм, степеней нет, как у zewnętrzny и srebrny. Главное за ним существительное: awaria это любая поломка, awaria prądu «отключение электричества», а дорожная авария это wypadek, не awaria. Запомнить таблички: wyjście awaryjne «аварийный выход», światła awaryjne «аварийка». И две формулы инструкций: w razie awarii и na wypadek awarii, обе с родительным. Читается «авары́йны», с двумя «ы»."
idioms:
