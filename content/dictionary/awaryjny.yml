notes:
  - { kind: false-friend, text: "Прилагательное узнаётся сразу, а вот существительное за ним стоит шире русского. AWARIA по-польски — любая поломка, а не только происшествие на дороге: AWARIA PRĄDU значит «отключение электричества», AWARIA WINDY «лифт сломался», AWARIA WODOCIĄGU «прорыв водопровода». Дорожная авария называется совсем другим словом, WYPADEK, и путать их дорого: MIAŁEM WYPADEK это «я попал в аварию», а MIAŁEM AWARIĘ — «у меня сломалась машина». Русское «авария» стоит посередине между обоими." }
  - { kind: usage, text: "Одиннадцать форм и ни одной степени сравнения: прилагательное относительное, оно приписывает предмет к назначению, и «более аварийным» быть нельзя. Это та же схема, что у ZEWNĘTRZNY, SREBRNY и ŚLUBNY. Мужско-личная форма AWARYJNI существует, но встречается редко, потому что слово описывает прежде всего оборудование, а не людей; если она и попадается, то о дежурных сменах и ремонтных бригадах. В терминах прилагательное обычно стоит после существительного: WYJŚCIE AWARYJNE, ŚWIATŁA AWARYJNE." }
  - { kind: register, text: "Слово техническое и указательное: таблички, инструкции, щитки, руководства. Частые обороты: WYJŚCIE AWARYJNE «аварийный выход», ŚWIATŁA AWARYJNE «аварийка», HAMULEC AWARYJNY «аварийный тормоз», ZASILANIE AWARYJNE «аварийное питание», TRYB AWARYJNY «аварийный режим». В переносном смысле WYJŚCIE AWARYJNE значит «путь к отступлению», как и русское «запасной выход». Наречие AWARYJNIE значит «в аварийном порядке»: WYLĄDOWAĆ AWARYJNIE «совершить аварийную посадку»." }
  - { kind: government, text: "Падежом прилагательное не управляет и только согласуется. Полезнее запомнить предлог при существительном: NA WYPADEK AWARII «на случай аварии», с родительным, и W RAZIE AWARII «в случае поломки», тоже с родительным. Оба оборота стоят на любой инструкции. Глагол, который с этим словом ходит чаще всего, — ZEPSUĆ SIĘ «сломаться»: WINDA SIĘ ZEPSUŁA звучит в быту чаще, чем JEST AWARIA WINDY, хотя значат они одно и то же." }
  - { kind: pronunciation, text: "Читается «авары́йны», четыре слога, ударение на предпоследнем. Буква Y звучит как «ы» дважды: в RYJ и на конце слова. Сочетание YJ даёт «ый», как в русских прилагательных, так что середина слова звучит почти по-русски. Буква W читается как «в», потому что стоит перед гласной. В существительном AWARIA ударение падает на второй слог: «ава́рья», а буква I перед A работает знаком мягкости, а не отдельным гласным." }
