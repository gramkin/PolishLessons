# review
id: zbrodnia
format: 2
lemma: "zbrodnia"
rank: 887
pos: noun
pron: { cyr: "збро́дня" }
senses:
  - id: crime
    ru: "тяжкое преступление, злодеяние"
    note: "Тяжелее, чем przestępstwo «преступление»."
    examples:
      - pl: "Kradzież to przestępstwo, napad na bank to zbrodnia."
        ru: "Кража — это правонарушение, а налёт на банк — тяжкое преступление."
        source: { kind: translated, id: 13871904 }
      - pl: "Zbrodnia nie popłaca."
        ru: "Преступление не окупается."
        source: { kind: translated, id: 10623504 }
      - pl: "Co doprowadziło cię do zbrodni?"
        ru: "Что довело тебя до преступления?"
        source: { kind: translated, id: 2250441 }
  - id: scene
    ru: "miejsce zbrodni, narzędzie zbrodni — место преступления, орудие убийства"
    examples:
      - pl: "To nie jest narzędzie zbrodni."
        ru: "Это не орудие убийства."
        source: { kind: translated, id: 4232345 }
      - pl: "Sami uciekł z miejsca zbrodni."
        ru: "Сами сбежал с места преступления."
        source: { kind: translated, id: 7183531 }
      - pl: "Tę zbrodnię karze się śmiercią."
        ru: "Это преступление карается смертью."
        source: { kind: translated, id: 2202337 }
  - id: figurative
    ru: "в переносном смысле: «это преступление»"
    examples:
      - pl: "Odcięcie skrzydeł orłu jest zbrodnią."
        ru: "Отрезать орлу крылья — преступление."
        source: { kind: translated, id: 12585394 }
      - pl: "Czy miłość do drugiej osoby jest zbrodnią?"
        ru: "Разве любить другого человека — преступление?"
        source: { kind: translated, id: 3450009 }
      - pl: "Nie mam nic wspólnego z tą zbrodnią."
        ru: "Я не имею с этим преступлением ничего общего."
        source: { kind: translated, id: 4768983 }
notes:
  - { kind: false-friend, text: "Различайте две ступени: przestępstwo — «преступление» вообще, zbrodnia — тяжкое, кровавое злодеяние. Корпус формулирует это прямо: Kradzież to przestępstwo, napad na bank to zbrodnia." }
  - { kind: usage, text: "Устойчивые сочетания: miejsce zbrodni «место преступления», narzędzie zbrodni «орудие убийства», zbrodnia wojenna «военное преступление»." }
  - { kind: usage, text: "Zbrodnia nie popłaca — «преступление не окупается», поговорка. Ещё говорят choć się kara wlecze, zbrodnia przed nią nie uciecze «от расплаты не уйдёшь»." }
  - { kind: usage, text: "Преступник — zbrodniarz, прилагательное — zbrodniczy «преступный». Роман Достоевского по-польски называется Zbrodnia i kara." }
collocations:
  - { pl: "miejsce zbrodni", ru: "место преступления" }
  - { pl: "narzędzie zbrodni", ru: "орудие убийства" }
  - { pl: "zbrodnia wojenna", ru: "военное преступление" }
  - { pl: "Zbrodnia i kara", ru: "Преступление и наказание" }
family:
  - { pl: "zbrodniarz", ru: "преступник, злодей", relation: derived }
  - { pl: "zbrodniczy", ru: "преступный", relation: derived }
etymology: "Старое славянское слово с приставкой z-; в русском прямого родственника нет, так что zbrodnia запоминается отдельно."
memory: "zbrodnia — не просто «преступление», а тяжкое злодеяние. Обычное преступление — przestępstwo, и корпус различает их прямо: Kradzież to przestępstwo, napad na bank to zbrodnia. Запомните miejsce zbrodni «место преступления» и название романа Достоевского — Zbrodnia i kara."
idioms:
  - { pl: "miejsce zbrodni", ru: "место преступления" }
  - { pl: "narzędzie zbrodni", ru: "орудие убийства" }
  - { pl: "zbrodnia nie popłaca", ru: "преступление не окупается" }
