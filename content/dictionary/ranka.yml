notes:
  - { kind: false-friend, text: "RANKA — «ранка», уменьшительное от RANA «рана». Но форма RANKA — ещё и родительный падеж от RANEK «утро»: Z SAMEGO RANKA «с самого утра», DO RANKA «до утра». Различает контекст; в частотных списках RANKA почти всегда «утро»." }
  - { kind: usage, text: "Женский род на -KA. Дательный и предложный — RANCE: K чередуется с C. Родительный множественного — RANEK, совпадает с RANEK «утро». Звательная форма в карточку не включена." }
  - { kind: government, text: "Где — NA с предложным: RANKA NA KOLANIE. От чего — PO с предложным: RANKA PO UKĄSZENIU. Чем промыть — творительный: PRZEMYĆ RANKĘ SPIRYTUSEM." }
  - { kind: pronunciation, text: "Читается «ра́нка», ударение на первом слоге. RANCE — «ра́нцэ»." }
  - { kind: register, text: "Нейтральное бытовое слово; в медицине — RANA, OTARCIE «ссадина», SKALECZENIE «порез»." }
collocations:
  - { pl: "mała ranka", ru: "маленькая ранка" }
  - { pl: "przemyć rankę", ru: "промыть ранку" }
  - { pl: "ranka się goi", ru: "ранка заживает" }
