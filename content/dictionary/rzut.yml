# review
id: rzut
format: 2
lemma: "rzut"
rank: 2469
pos: noun
pron: { cyr: "жут" }
senses:
  - id: glance
    ru: "взгляд (в обороте na pierwszy rzut oka)"
    examples:
      - pl: "Czy potrafisz, na pierwszy rzut oka, odróźnić jęczmień od pszenicy?"
        ru: "Ты можешь с первого взгляда отличить ячмень от пшеницы?"
        source: { kind: tatoeba, id: 1454784 }
      - pl: "Wyniki były oczywiste na pierwszy rzut oka."
        ru: "Результаты были очевидны с первого взгляда."
        source: { kind: translated, id: 529746 }
      - pl: "Na pierwszy rzut oka było widać, że ojciec nie czuje się najlepiej."
        ru: "С первого взгляда было видно, что отец чувствует себя неважно."
        source: { kind: translated, id: 736931 }
  - id: throw
    ru: "бросок, метание"
    examples:
      - pl: "Niech zdecyduje rzut monetą."
        ru: "Пусть решит бросок монеты."
        source: { kind: translated, id: 7960492 }
      - pl: "Zdecydujmy rzutem monetą."
        ru: "Решим бросанием монеты."
        source: { kind: translated, id: 355731 }
notes:
  - { kind: usage, text: "Самое частое употребление — оборот na pierwszy rzut oka «с первого взгляда», буквально «на первый бросок глаза». Русский бросает взгляд тем же образом." }
  - { kind: government, text: "Мужской неодушевлённый; родительный — rzutu. Бросанием монеты — rzutem monety, творительный падеж." }
  - { kind: false-friend, text: "От rzucić «бросить» и rzucać «бросать», которые уже есть в словаре." }
  - { kind: usage, text: "Разговорное o rzut beretem «рукой подать», буквально «на бросок берета». В спорте rzut karny «пенальти», rzut młotem «метание молота»." }
collocations:
  - { pl: "na pierwszy rzut oka", ru: "с первого взгляда" }
  - { pl: "rzut monetą", ru: "бросок монеты" }
etymology: "От rzucić «бросить»; оборот rzut oka повторяет русское «бросить взгляд»."
memory: "rzut — «бросок», но живёт прежде всего в обороте na pierwszy rzut oka «с первого взгляда». Родня — rzucić, rzucać."
idioms:
