# review
id: ukochany
format: 2
lemma: "ukochany"
rank: 1789
pos: adj
pron: { cyr: "укоха́ны" }
senses:
  - id: beloved
    ru: "любимый, возлюбленный"
    examples:
      - pl: "Ukochana, wróć do mnie!"
        ru: "Любимая, вернись ко мне!"
        source: { kind: translated, id: 956883 }
      - pl: "Jesteś moją ukochaną."
        ru: "Ты моя любимая."
        source: { kind: translated, id: 5221452 }
      - pl: "Jesteś moim ukochanym."
        ru: "Ты мой любимый."
        source: { kind: translated, id: 5221451 }
  - id: beloved-of
    ru: "любимый (о близких, о сыне, дочери)"
    examples:
      - pl: "Stracił ukochanego syna."
        ru: "Он потерял любимого сына."
        source: { kind: translated, id: 945802 }
      - pl: "Augusto jest moim najukochańszym synem."
        ru: "Аугусто — мой самый любимый сын."
        source: { kind: translated, id: 1060714 }
      - pl: "Maria jest moją pasierbicą, ale kocham ją tak, jakby była moją ukochaną córką."
        ru: "Мария моя падчерица, но я люблю её так, будто она моя любимая дочь."
        source: { kind: translated, id: 13074660 }
notes:
  - { kind: usage, text: "Формы ukochańsi не бывает: ukochany не градуируется — любимый он и есть любимый, «более любимым» не бывает. Поэтому она оставлена без примеров. Живая мужско-личная форма — ukochani: ukochani synowie «любимые сыновья»." }
  - { kind: usage, text: "Слово работает и как прилагательное, и как существительное: mój ukochany «мой любимый», moja ukochana «моя любимая»." }
  - { kind: false-friend, text: "Рядом живёт kochany «дорогой, милый» — более мягкое и частое обращение. ukochany сильнее: это тот, кого любят по-настоящему." }
  - { kind: usage, text: "Образовано от ukochać «полюбить» — причастие, ставшее прилагательным, как русское «любимый» от «любить»." }
  - { kind: government, text: "После być стоит в творительном падеже: jesteś moim ukochanym «ты мой любимый»." }
collocations:
  - { pl: "mój ukochany", ru: "мой любимый" }
  - { pl: "ukochana osoba", ru: "любимый человек" }
  - { pl: "ukochany syn", ru: "любимый сын" }
family:
  - { pl: "kochać", ru: "любить", relation: root, id: kochac }
  - { pl: "miłość", ru: "любовь", relation: root, id: milosc }
  - { pl: "ukochanie", ru: "любовь, привязанность", relation: root }
etymology: "Причастие от ukochać «полюбить», приставка u- плюс kochać «любить». Русское «любимый» образовано от «любить» ровно так же."
memory: "ukochany — «любимый», и прилагательное, и существительное: mój ukochany, moja ukochana. Более мягкое обращение — kochany «дорогой»."
idioms:
