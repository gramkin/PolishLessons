  - form: "ukochaną"
    pl: "Maria jest moją pasierbicą, ale kocham ją tak, jakby była moją ukochaną córką."
    ru: "Мария моя падчерица, но я люблю её так, будто она моя любимая дочь."
    source: { kind: translated, id: 13074660 }
  - form: "ukochaną"
    pl: "Jest też grupa mężczyzn, którzy swój pierwszy raz chcą przeżyć z ukochaną osobą i czekają na odpowiedni moment."
    ru: "Есть и группа мужчин, которые хотят пережить свой первый раз с любимым человеком."
    source: { kind: translated, id: 1759139 }
  - form: "ukochane"
    pl: "Ukochane dziecko dostaje najwięcej uwagi."
    ru: "Любимому ребёнку достаётся больше всего внимания."
    source: { kind: authored }
  - form: "ukochane"
    pl: "To jej ukochane miejsce nad rzeką."
    ru: "Это её любимое место у реки."
    source: { kind: authored }
  - form: "ukochane"
    pl: "Ukochane książki stoją osobno."
    ru: "Любимые книги стоят отдельно."
    source: { kind: authored }
  - form: "ukochanego"
    pl: "Stracił ukochanego syna."
    ru: "Он потерял любимого сына."
    source: { kind: translated, id: 945802 }
  - form: "ukochanego"
    pl: "Miała rozdarte serce, kiedy usłyszała o śmierci ukochanego."
    ru: "У неё разрывалось сердце, когда она услышала о смерти любимого."
    source: { kind: translated, id: 956884 }
  - form: "ukochanego"
    pl: "Wstanę, po mieście chodzić będę, wśród ulic i placów, szukać będę ukochanego mej duszy."
    ru: "Встану же я, пойду по городу, по улицам и площадям, и буду искать того, которого любит душа моя."
    source: { kind: tatoeba, id: 8580242 }
  - form: "ukochanej"
    pl: "Poeta wyraził płomienną miłość w stosunku do ukochanej kobiety."
    ru: "Поэт выразил пламенную любовь к любимой женщине."
    source: { kind: translated, id: 801978 }
  - form: "ukochanej"
    pl: "Napisał list do ukochanej."
    ru: "Он написал письмо любимой."
    source: { kind: authored }
  - form: "ukochanej"
    pl: "Nie ma nic droższego od ukochanej osoby."
    ru: "Нет ничего дороже любимого человека."
    source: { kind: authored }
  - form: "ukochanemu"
    pl: "Podarowała ukochanemu zegarek."
    ru: "Она подарила любимому часы."
    source: { kind: authored }
  - form: "ukochanemu"
    pl: "Przyjrzyj się temu ukochanemu przez wszystkich parkowi."
    ru: "Присмотрись к этому всеми любимому парку."
    source: { kind: authored }
  - form: "ukochanemu"
    pl: "Nie odmawiaj ukochanemu synowi pomocy."
    ru: "Не откажи любимому сыну в помощи."
    source: { kind: authored }
  - form: "ukochani"
    pl: "Ukochani synowie wrócili na święta."
    ru: "Любимые сыновья вернулись на праздники."
    source: { kind: authored }
  - form: "ukochani"
    pl: "Ukochani przez publiczność aktorzy grali za darmo."
    ru: "Любимые публикой актёры играли бесплатно."
    source: { kind: authored }
  - form: "ukochani"
    pl: "Ukochani wnukowie przyjechali z daleka."
    ru: "Любимые внуки приехали издалека."
    source: { kind: authored }
  - form: "ukochany"
    pl: "Wszystkiego najlepszego, mój prawnuku, mój ukochany książę! Masz dopiero 13 lat, rozkwitasz życiem, które twoja uprzywilejowana istota wie, jak przekształcić w wykwintną piosenkę. Niech Bóg cię błogosławi i chroni."
    ru: "Всего наилучшего, мой правнук, мой любимый князь!"
    source: { kind: translated, id: 13203557 }
  - form: "ukochany"
    pl: "To mój ukochany brat."
    ru: "Это мой любимый брат."
    source: { kind: authored }
  - form: "ukochany"
    pl: "Ukochany pies czekał przy drzwiach."
    ru: "Любимый пёс ждал у двери."
    source: { kind: authored }
  - form: "ukochanych"
    pl: "Nie ma tu jej ukochanych książek."
    ru: "Её любимых книг тут нет."
    source: { kind: authored }
  - form: "ukochanych"
    pl: "Wśród ukochanych miejsc wymienia ten park."
    ru: "Среди любимых мест он называет этот парк."
    source: { kind: authored }
  - form: "ukochanych"
    pl: "Z ukochanych płyt została połowa."
    ru: "От любимых пластинок осталась половина."
    source: { kind: authored }
  - form: "ukochanym"
    pl: "Jesteś moim ukochanym."
    ru: "Ты мой любимый."
    source: { kind: translated, id: 5221451 }
  - form: "ukochanym"
    pl: "Wszystkie troski dobrego ojca skupiają się na tym ukochanym dziecku."
    ru: "Все заботы хорошего отца сосредоточены на этом любимом ребёнке."
    source: { kind: translated, id: 13591464 }
  - form: "ukochanym"
    pl: "Jesteś moim ukochanym człowiekiem."
    ru: "Ты мой любимый человек."
    source: { kind: authored }
  - form: "ukochanymi"
    pl: "Otoczył się ukochanymi książkami."
    ru: "Он окружил себя любимыми книгами."
    source: { kind: authored }
  - form: "ukochanymi"
    pl: "Między ukochanymi a lubianymi miejscami jest różnica."
    ru: "Между любимыми и просто приятными местами есть разница."
    source: { kind: authored }
  - form: "ukochanymi"
    pl: "Pożegnał się z ukochanymi stronami rodzinnymi."
    ru: "Он простился с любимыми родными краями."
    source: { kind: authored }
