  - form: "najukochańszym"
    pl: "Był jej najukochańszym wnukiem."
    ru: "Он был её самым любимым внуком."
    source: { kind: authored }
  - form: "najukochańszym"
    pl: "Nazwała go najukochańszym przyjacielem."
    ru: "Она назвала его самым любимым другом."
    source: { kind: authored }
  - form: "ukochana"
    pl: "Ukochana, wróć do mnie!"
    ru: "Любимая, вернись ко мне!"
    source: { kind: translated, id: 956883 }
  - form: "ukochana"
    pl: "Moja ukochana czeka w domu."
    ru: "Моя любимая ждёт дома."
    source: { kind: authored }
  - form: "ukochana"
    pl: "To jego ukochana córka."
    ru: "Это его любимая дочь."
    source: { kind: authored }
  - form: "ukochaną"
    pl: "Jesteś moją ukochaną."
    ru: "Ты моя любимая."
