notes:
  - { kind: false-friend, text: "Корень GRA — это русская «игра», и гнездо читается без словаря: GRAĆ «играть», GRACZ «игрок», WYGRYWAĆ «выигрывать», PRZEGRYWAĆ «проигрывать». Разошлись приставки: там, где русский берёт «про-», польский берёт PRZE-, то есть «пере-». Поэтому PRZEGRYWAĆ выглядит как «перегрывать», а значит «проигрывать», и это надо просто принять: соответствие PRZE- и «про-» в польском встречается регулярно, сравните PRZEGRAĆ «проиграть» и PRZEPUŚCIĆ «пропустить». Второе значение русскому не отвечает вовсе: PRZEGRYWAĆ KASETĘ значит «переписывать, копировать запись», и здесь PRZE- работает как русское «пере-» в «переписывать»." }
  - { kind: usage, text: "Несовершенный вид, переходный, шестьдесят три формы: сорок две от глагола, десять от действительного причастия PRZEGRYWAJĄCY, одиннадцать от страдательного PRZEGRYWANY. Совершенная пара — PRZEGRAĆ, и в ней нет вставного -YWA-: PRZEGRYWAM против PRZEGRAM. Это регулярная модель: несовершенный вид на -YWAĆ при совершенном без него, как WYGRYWAĆ и WYGRAĆ, ZAPISYWAĆ и ZAPISAĆ. Существительное PRZEGRANA значит «проигрыш, поражение», а прилагательное PRZEGRANY — «проигранный» и о человеке «неудачник». Антоним во всём гнезде — WYGRYWAĆ, и приставки противопоставлены прозрачно: PRZE- против WY-." }
  - { kind: government, text: "Переходный: проигрывать что — винительный без предлога, PRZEGRYWAĆ MECZ, SPRAWĘ, PIENIĄDZE. Кому — предлог Z с творительным, и это главное расхождение с русским: PRZEGRYWAĆ Z KIMŚ значит «проигрывать кому-то», тогда как русский требует дательного без предлога. Сказать PRZEGRYWAĆ KOMUŚ нельзя. Во что — предлог W с местным: PRZEGRYWAĆ W KARTY, W SZACHY. Отрицание переводит дополнение в родительный: NIE PRZEGRYWAM MECZU. В значении «копировать» управление простое: PRZEGRYWAĆ COŚ NA COŚ, с предлогом NA и винительным." }
  - { kind: pronunciation, text: "Читается «пшэгры́ваць», четыре слога, ударение на предпоследнем. Приставка PRZE- звучит «пшэ», потому что RZ после глухого P оглушается в «ш» — то же правило, что в PRZEZ, TRZY и PRZERYWAĆ. Буква Y это «ы», поэтому третий слог звучит «ры». Конечное Ć — мягкое «ць». В совершенном виде PRZEGRAĆ слогов три и ударение на втором: «пшэгра́ць». В существительном PRZEGRANA ударение тоже предпоследнее: «пшэгра́на»." }
