etymology: "От GRAĆ, из праславянского *grati «играть», того же слова, что русское «играть», с приставкой PRZE-, отвечающей русскому «пере-» и в этом случае русскому «про-». Корень общий и прозрачный, расходится только выбор приставки: русский проигрывает, то есть теряет сквозь игру, а поляк «переигрывает» — доводит игру до конца не в свою пользу. Соответствие PRZE- и «про-» в польском регулярно и за пределами этого слова: PRZEPUŚCIĆ «пропустить», PRZEGAPIĆ «проглядеть», PRZESPAĆ «проспать». Второе значение, «копировать запись», выросло из того же PRZE- в смысле «перенести с одного носителя на другой», и русский здесь говорит «переписать», то есть пользуется той же приставкой. Существительное PRZEGRANA образовано от причастия, как русское «проигранная», и стало самостоятельным словом со значением «поражение»."
memory: "Корень gra = «игра», и гнездо знакомое: grać, gracz, wygrywać, przegrywać. Разница в приставке: польское prze- отвечает русскому «про-» (przepuścić «пропустить», przespać «проспать»), поэтому przegrywać значит «проигрывать», а не «перегрывать». Управление расходится: проигрывать кому-то это przegrywać Z KIMŚ с творительным, а не дательный. И второе значение — «переписывать запись»: przegrywać kasetę na komputer. Совершенный вид без -ywa-: przegrać, przegram."
