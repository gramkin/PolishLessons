notes:
  - { kind: false-friend, text: "Русское «детский» в польском распадается на два прилагательных, и выбор между ними меняет оценку. DZIECIĘCY — нейтральное: относящийся к детям, предназначенный для детей. POKÓJ DZIECIĘCY «детская комната», CHÓR DZIECIĘCY «детский хор», ODDZIAŁ DZIECIĘCY «детское отделение». DZIECINNY — то же по форме, но с осуждением: «детский» в смысле «незрелый, несерьёзный». DZIECINNE ZACHOWANIE значит «ребяческое поведение», и сказать так о больничном отделении нельзя. Русский различает это описательно, через «ребяческий» или интонацию, а польский закрепил разницу в двух словах, и путать их значит ошибаться в оценке." }
  - { kind: usage, text: "Прилагательное относительное, степеней сравнения не образует, и форм у него десять, а не одиннадцать: мужской личный именительный множественного совпадает с мужским именительным единственного, и там и там DZIECIĘCY. Такое совпадение обычно для прилагательных с мягкой основой — так же ведут себя STARCZY и EKSCYTUJĄCY. Носовое Ę в суффиксе не чередуется ни в одной форме. Суффикс -ĘCY исторически связан с древним словом DZIECIĘ «дитя», которое в современном языке вытеснено словом DZIECKO, но в прилагательном сохранилось." }
  - { kind: government, text: "Согласуется с существительным в роде, числе и падеже. Частотные сочетания: POKÓJ DZIECIĘCY «детская комната», WÓZEK DZIECIĘCY «детская коляска», CHÓR DZIECIĘCY, LITERATURA DZIECIĘCA «детская литература», PORAŻENIE DZIECIĘCE «детский паралич» — медицинский термин. Во втором значении: DZIECIĘCA CIEKAWOŚĆ «детское любопытство», DZIECIĘCA RADOŚĆ. Для оценочного смысла нужен другой корень: ZACHOWYWAĆ SIĘ DZIECINNIE «вести себя по-детски», и здесь уже наречие от DZIECINNY." }
  - { kind: pronunciation, text: "Читается «дзеце́нцы», три слога, ударение на предпоследнем. Сочетание DZI даёт мягкое «дзь», и первый слог звучит «дзе». Сочетание CIĘ — мягкое «це» с носовым призвуком, то есть «цен». Конечное -CY это «цы», с твёрдым ц и «ы». В форме DZIECIĘCĄ носовое Ą даёт «он»: «дзеце́нцон». В форме DZIECIĘCEGO слогов четыре, ударение на предпоследнем: «дзецен́цэго»." }
