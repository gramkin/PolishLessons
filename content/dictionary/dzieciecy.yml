etymology: "От DZIECIĘ «дитя», старой формы среднего рода с носовым, из праславянского *dětę; русское «дитя» — то же слово, и русское «дитяти» в косвенных падежах показывает тот же древний тип. В современном польском DZIECIĘ почти не употребляется, его место занял DZIECKO, но прилагательное DZIECIĘCY сохранило старую основу с носовым Ę, и потому выглядит сложнее, чем производное от DZIECKO. Второе прилагательное, DZIECINNY, образовано уже от DZIECINA, ласкательной формы, и оттенок ласки со временем перешёл в оттенок снисхождения. Русский обошёлся одним «детским» и передаёт оценку другими средствами; польский развёл два слова и закрепил за каждым свою область."
memory: "Русское «детский» в польском делится на два: dziecięcy нейтрально (pokój dziecięcy, chór dziecięcy), dziecinny с осуждением — «ребяческий, незрелый». Путать значит ошибаться в оценке. Форм десять, не одиннадцать: мужской личный множественного совпадает с единственным, как у starczy. В суффиксе сохранилось старое dziecię «дитя», которое вытеснено словом dziecko."
