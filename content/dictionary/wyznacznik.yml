# review
id: wyznacznik
format: 2
lemma: "wyznacznik"
rank: 5773
pos: noun
pron: { cyr: "вызна́чник" }
senses:
  - id: indicator
    ru: "показатель, определяющий признак"
    examples:
      - pl: "Wykształcenie jest wyznacznikiem statusu."
        ru: "Образование — показатель статуса."
        source: { kind: authored }
      - pl: "Cena nie jest wyznacznikiem jakości."
        ru: "Цена не показатель качества."
        source: { kind: authored }
      - pl: "Głównym wyznacznikiem stylu jest rytm."
        ru: "Главный признак стиля — ритм."
        source: { kind: authored }
  - id: determinant
    ru: "определитель (в математике)"
    examples:
      - pl: "Wyznacznik macierzy równa się zeru."
        ru: "Определитель матрицы равен нулю."
        source: { kind: authored }
      - pl: "Policzyli wyznacznik tej macierzy."
        ru: "Они вычислили определитель этой матрицы."
        source: { kind: authored }
notes:
  - { kind: government, text: "Мужской неодушевлённый: wyznacznik, wyznacznika, wyznaczniku. Образовано от wyznaczać «определять, задавать» суффиксом -nik." }
  - { kind: usage, text: "В обиходе — «показатель, признак»; в математике строгий термин «определитель»." }
  - { kind: usage, text: "Частая конструкция: być wyznacznikiem czegoś «быть показателем чего-либо»." }
  - { kind: false-friend, text: "В математике совпадает с русским «определителем», но в обычной речи переводится скорее «показатель»: wyznacznik jakości это «показатель качества»." }
collocations:
  - { pl: "wyznacznik jakości", ru: "показатель качества" }
  - { pl: "wyznacznik macierzy", ru: "определитель матрицы" }
  - { pl: "być wyznacznikiem", ru: "служить показателем" }
family:
  - { pl: "wyznaczać", ru: "определять, задавать", relation: root }
  - { pl: "wyznaczenie", ru: "определение, назначение", relation: derived }
etymology: "От wyznaczać «определять, задавать» с суффиксом -nik, который в польском образует названия орудий и признаков — как licznik «счётчик» или mianownik «именительный падеж». Русский математический «определитель» выражает то же понятие, но построен от другого глагола."
memory: "wyznacznik — «показатель, признак», а в математике «определитель». От wyznaczać плюс -nik, по той же модели, что licznik «счётчик»."
idioms:
  - { pl: "być wyznacznikiem", ru: "служить показателем" }
