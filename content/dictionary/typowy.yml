        ru: "Типовая квартира имеет пятьдесят метров."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Тридцать три формы, значит синтетические степени у слова есть: TYPOWSZY, NAJTYPOWSZY. Но в живой речи прилагательные на -owy предпочитают описательную степень — BARDZIEJ TYPOWY, NAJBARDZIEJ TYPOWY, — и синтетическая звучит книжно. Разница важная: морфологический словарь показывает, что система способна образовать, а не то, что говорят. Там, где степеней нет вовсе — как у wieczny или fizyczny с их одиннадцатью формами, — отказывается сама морфология, и это другое явление." }
  - { kind: usage, text: "Мужская личная форма множественного числа у трёх степеней разная, и в сравнительной происходит мена: TYPOWI в положительной, но TYPOWSI в сравнительной и NAJTYPOWSI в превосходной. Суффикс степени -sz- смягчается в -ś- перед окончанием -i. То же в starszy — STARSI, młodszy — MŁODSI, и в этой же партии kompletniejszy — KOMPLETNIEJSI. Правило без исключений: -szy во множественном мужском личном всегда даёт -si." }
  - { kind: false-friend, text: "Русский делит это понятие на два слова, польский — нет. TYPOWY значит и «типичный» (typowy przykład, typowa reakcja), и «типовой» (typowy projekt, typowe mieszkanie). Второе значение для русского уха неожиданно: «типовой проект» и «типичный проект» — вещи разные, а по-польски оба будут typowy projekt, и различает их только контекст." }
collocations:
  - { pl: "typowy przykład", ru: "типичный пример" }
  - { pl: "typowy przypadek", ru: "типичный случай" }
  - { pl: "typowy projekt", ru: "типовой проект" }
family:
  - { pl: "typ", ru: "тип", relation: root, id: typ }
  - { pl: "typowo", ru: "типично", relation: derived }
  - { pl: "nietypowy", ru: "нетипичный", relation: antonym }
etymology: "От TYP, через латынь из греческого typos «удар, оттиск, отпечаток», от typtō «бить». Отпечаток, оставленный ударом, стал образцом, а образец — типом. Русский «тип» и «типичный» пришли тем же путём и из того же источника, так что корень узнаётся сразу; разошлись языки только в том, что польский оставил одно прилагательное там, где русский завёл два — «типичный» и «типовой»."
memory: "Одно слово на два русских: и «типичный», и «типовой». А во множественном мужском личном -szy даёт -si: typowsi, не typowszi."
