# review
id: marzenie
format: 2
lemma: "marzenie"
rank: 1664
pos: noun
pron: { cyr: "маже́не" }
senses:
  - id: dream-wish
    ru: "мечта"
    examples:
      - pl: "Mam marzenie."
        ru: "У меня есть мечта."
        source: { kind: tatoeba, id: 350112 }
      - pl: "Marzenia się spełniają."
        ru: "Мечты сбываются."
        source: { kind: translated, id: 393329 }
      - pl: "Moje marzenie się spełniło."
        ru: "Моя мечта сбылась."
        source: { kind: tatoeba, id: 5572700 }
  - id: dream-goal
    ru: "мечта как цель"
    examples:
      - pl: "Moim marzeniem jest zostać pilotem."
        ru: "Моя мечта - стать пилотом."
        source: { kind: tatoeba, id: 3743798 }
      - pl: "Jej marzeniem jest zostać aktorką."
        ru: "Её мечта — стать актрисой."
        source: { kind: translated, id: 503801 }
      - pl: "Tom nie chce porzucić swojego marzenia o zostaniu astronautą."
        ru: "Том не желает отказываться от своей мечты стать космонавтом."
        source: { kind: tatoeba, id: 2798522 }
  - id: daydream
    ru: "грёзы, мечтания"
    examples:
      - pl: "W swoich marzeniach czuła się zawsze lepiej niż poza nimi, w rzeczywistości."
        ru: "В своих мечтах она всегда чувствовала себя лучше, чем вне их, в действительности."
        source: { kind: translated, id: 13426507 }
      - pl: "Nawet w najśmielszych marzeniach nie sądziłem, że coś takiego mogło by się wydarzyć."
        ru: "Даже в самых смелых мечтах я не думал, что подобное может произойти."
        source: { kind: translated, id: 3743355 }
notes:
  - { kind: usage, text: "marzenie — мечта наяву, а сон во время сна — sen. Русские «мечта» и «сон» разделены точно так же." }
  - { kind: usage, text: "Устойчиво: marzenie się spełniło «мечта сбылась», spełnienie marzeń «исполнение мечты», dom marzeń «дом мечты»." }
  - { kind: usage, text: "Образовано от marzyć «мечтать» суффиксом -enie, как czytać даёт czytanie. Это регулярный способ сделать существительное из глагола." }
  - { kind: government, text: "«Мечтать о чём-то» — marzyć o czymś с предложным падежом: marzenie o zostaniu astronautą «мечта стать космонавтом»." }
collocations:
  - { pl: "spełnić marzenie", ru: "исполнить мечту" }
  - { pl: "dom marzeń", ru: "дом мечты" }
  - { pl: "marzenie się spełniło", ru: "мечта сбылась" }
etymology: "От marzyć «мечтать», праславянское *marīti, связанное с *mara «морок, видение» — то же гнездо, что русские «марево» и «мара». Русское «мечта» идёт от другого корня, но общая идея видения та же."
memory: "marzenie = «мечта» (наяву), а sen — «сон». Собрано от marzyć «мечтать» суффиксом -enie. Главные обороты: marzenie się spełniło «мечта сбылась» и dom marzeń «дом мечты»."
idioms:
  - { pl: "spełnienie marzeń", ru: "исполнение мечты" }
  - { pl: "dom marzeń", ru: "дом мечты" }
  - { pl: "marzenie ściętej głowy", ru: "несбыточная мечта" }
