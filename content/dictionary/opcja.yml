# review
id: opcja
format: 2
lemma: "opcja"
rank: 1856
pos: noun
pron: { cyr: "о́пцья" }
senses:
  - id: option
    ru: "вариант, опция"
    examples:
      - pl: "Są trzy opcje."
        ru: "Есть три варианта."
        source: { kind: translated, id: 10604995 }
      - pl: "Jakie są opcje?"
        ru: "Какие есть варианты?"
        source: { kind: translated, id: 8800743 }
      - pl: "Masz dwie opcje."
        ru: "У тебя два варианта."
        source: { kind: translated, id: 9686771 }
  - id: choose-option
    ru: "вариант (выбрать, рассмотреть)"
    examples:
      - pl: "Możesz wybrać jedną z dwóch opcji."
        ru: "Ты можешь выбрать одну из двух опций."
        source: { kind: tatoeba, id: 7164745 }
      - pl: "Wskaż prawidłową opcję."
        ru: "Укажи правильный вариант."
        source: { kind: translated, id: 5143007 }
      - pl: "Musiałem to zrobić, nie było innej opcji."
        ru: "Мне пришлось это сделать, другого варианта не было."
        source: { kind: translated, id: 966962 }
notes:
  - { kind: government, text: "Выбрать один из вариантов — wybrać jedną z opcji (родительный с z): możesz wybrać jedną z dwóch opcji." }
  - { kind: usage, text: "Nie ma takiej opcji! — разговорная формула «Ни за что!», «Об этом не может быть и речи»." }
  - { kind: usage, text: "В технике слово значит «опция, настройка»: opcje programu «настройки программы»." }
  - { kind: false-friend, text: "Русское «опция» звучит технически, а польское opcja совершенно обычное слово для «варианта»: masz dwie opcje «у тебя два варианта»." }
collocations:
  - { pl: "mieć opcje", ru: "иметь варианты" }
  - { pl: "nie ma takiej opcji", ru: "ни за что" }
  - { pl: "wybrać opcję", ru: "выбрать вариант" }
family:
  - { pl: "opcjonalny", ru: "опциональный", relation: root }
  - { pl: "wybór", ru: "выбор", relation: root, id: wybor }
  - { pl: "możliwość", ru: "возможность", relation: root, id: mozliwosc }
etymology: "Из латинского optio «выбор» через западные языки; русская «опция» пришла тем же путём, но осталась технической, а польское слово стало повседневным."
memory: "opcja — «вариант»: masz dwie opcje «у тебя два варианта». Русское «опция» звучит технически, польское — обычное слово. И Nie ma takiej opcji! значит «Ни за что!»"
idioms:
  - { pl: "nie ma takiej opcji", ru: "ни за что" }
  - { pl: "mieć dwie opcje", ru: "иметь два варианта" }
  - { pl: "wybrać opcję", ru: "выбрать вариант" }
