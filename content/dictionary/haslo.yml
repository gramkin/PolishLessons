pos: noun
pron: { cyr: "ха́суо" }
senses:
  - id: password
    ru: "пароль"
    examples:
      - pl: "Hasło do konta trzeba zmieniać co miesiąc."
        ru: "Пароль от аккаунта надо менять каждый месяц."
        source: { kind: authored }
      - pl: "Nie pamiętam hasła do poczty."
        ru: "Я не помню пароль от почты."
        source: { kind: authored }
      - pl: "W haśle musi być cyfra i wielka litera."
        ru: "В пароле должны быть цифра и заглавная буква."
        source: { kind: authored }
  - id: slogan
    ru: "лозунг, девиз"
    examples:
      - pl: "Hasło wyborcze zmieściło się w trzech słowach."
        ru: "Предвыборный лозунг уместился в трёх словах."
        source: { kind: authored }
      - pl: "Pod tym hasłem zebrało się tysiąc osób."
        ru: "Под этим лозунгом собралась тысяча человек."
        source: { kind: authored }
notes:
  - { kind: pronunciation, text: "Одно слово показывает обе судьбы сочетания sł сразу. В предложном, где есть окончание -e, оно смягчается в śl: HAŚLE. В родительном множественного окончания нет, и ł остаётся твёрдым, зато между s и ł вставляется беглая e: HASEŁ. Сравните masło — maśle и zmysł — zmyśle: смягчение там то же, но беглой гласной нет, потому что нет и стечения согласных." }
  - { kind: usage, text: "Значений три, и русский передаёт их разными словами. HASŁO DO KONTA — это пароль, HASŁO WYBORCZE — лозунг, а HASŁO SŁOWNIKOWE — словарная статья, то есть заголовочное слово со всем, что к нему относится. Объединяет их исходная мысль: слово, о котором договорились заранее." }
collocations:
  - { pl: "hasło do konta", ru: "пароль от аккаунта" }
  - { pl: "zmienić hasło", ru: "сменить пароль" }
  - { pl: "hasło wyborcze", ru: "предвыборный лозунг" }
family:
  - { pl: "hasłowy", ru: "лозунговый", relation: derived }
  - { pl: "hasełko", ru: "словечко, короткий лозунг", relation: derived }
  - { pl: "hasłowo", ru: "тезисно, кратко", relation: derived }
etymology: "Слово западнославянское: чешское heslo, словацкое heslo, польское hasło. Происхождение спорное, но чаще всего его связывают с корнем *gad- «говорить», тот же, что в польском gadać, а начальное h вместо g выдаёт чешское посредство. Прямого соответствия в русском нет, и все три значения приходится запоминать заново."
memory: "Предложный смягчается: w HAŚLE, как w maśle. А родительный множественного твердеет и вставляет беглую e: HASEŁ."
idioms:
  - { pl: "pod hasłem", ru: "под лозунгом" }
  - { pl: "hasło przewodnie", ru: "девиз, лейтмотив" }
