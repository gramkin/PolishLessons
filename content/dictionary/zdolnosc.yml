# review
id: zdolnosc
format: 2
lemma: "zdolność"
rank: 1974
pos: noun
pron: { cyr: "здо́лносьць" }
senses:
  - id: ability
    ru: "способность (врождённая, потенциальная)"
    examples:
      - pl: "Mamy zdolność pamiętania."
        ru: "У нас есть способность помнить."
        source: { kind: translated, id: 368439 }
      - pl: "Człowiek ma zdolność mówienia."
        ru: "У человека есть способность говорить."
        source: { kind: translated, id: 645919 }
      - pl: "Koty mają zdolność widzenia w ciemności."
        ru: "У кошек есть способность видеть в темноте."
        source: { kind: translated, id: 1059806 }
      - pl: "Straciłeś zdolność koncentracji."
        ru: "Ты потерял способность концентрироваться."
        source: { kind: translated, id: 4133974 }
      - pl: "Podziwiam jego zdolność opanowywania sytuacji."
        ru: "Я восхищаюсь его способностью владеть ситуацией."
        source: { kind: translated, id: 364092 }
      - pl: "Kreatywność to zdolność do łączenia znanych elementów w niezwykły sposób."
        ru: "Креативность — это способность соединять известные элементы необычным образом."
        source: { kind: translated, id: 1225937 }
  - id: talents
    ru: "способности (к чему-либо)"
    examples:
      - pl: "Mam wiele zdolności."
        ru: "У меня много способностей."
        source: { kind: translated, id: 553167 }
      - pl: "Ona ma wrodzone zdolności artystyczne."
        ru: "У неё врождённые художественные способности."
        source: { kind: translated, id: 404432 }
      - pl: "On nie ma zdolności matematycznych."
        ru: "У него нет способностей к математике."
        source: { kind: tatoeba, id: 8661262 }
notes:
  - { kind: usage, text: "Отличие от umiejętność, у которого своя карточка: zdolność — врождённая способность или потенциал, umiejętność — навык, выработанный практикой." }
  - { kind: usage, text: "Способности к чему-либо выражаются прилагательным: zdolności matematyczne «математические способности», zdolności przywódcze «лидерские качества»." }
  - { kind: usage, text: "Существительное от zdolny «способный». Рядом стоит карточка talent «талант»." }
collocations:
  - { pl: "zdolność mówienia", ru: "способность говорить" }
  - { pl: "zdolności matematyczne", ru: "математические способности" }
  - { pl: "stracić zdolność", ru: "потерять способность" }
etymology: "От zdolny «способный», в основе — dola «доля, участь» и глагол zdołać «суметь». Русское «способность» построено от другого корня, но по той же модели: прилагательное плюс суффикс отвлечённости."
memory: "zdolność — врождённая способность: zdolności matematyczne. А приобретённый навык — umiejętność, у него своя карточка."
idioms:
  - { pl: "zdolność mówienia", ru: "способность говорить" }
  - { pl: "zdolności matematyczne", ru: "математические способности" }
  - { pl: "stracić zdolność", ru: "потерять способность" }
