# review
id: nazywac
format: 2
lemma: "nazywać"
rank: 222
pos: verb
aspect: imperf
pron: { cyr: "назы́ваць" }
senses:
  - id: call
    ru: "называть (кого-либо, что-либо)"
    examples:
      - pl: "Nazywam Boston domem."
        ru: "Я называю Бостон домом."
        source: { kind: tatoeba, id: 6441734 }
      - pl: "Nazywają nas Rosjanami."
        ru: "Они называют нас русскими."
        source: { kind: tatoeba, id: 3660639 }
      - pl: "Nazywamy to szczęściem."
        ru: "Мы называем это счастьем."
        source: { kind: authored }
  - id: be-called
    ru: "nazywać się — называться, зваться"
    note: "Jak się nazywasz? спрашивает фамилию или полное имя."
    examples:
      - pl: "Nazywam się Shmit."
        ru: "Моя фамилия Смит."
        source: { kind: tatoeba, id: 3481717 }
      - pl: "Jak się to nazywa?"
        ru: "Как это называется?"
        source: { kind: tatoeba, id: 8700020 }
      - pl: "Jak się nazywa ta ulica?"
        ru: "Как называется эта улица?"
        source: { kind: tatoeba, id: 351944 }
notes:
  - { kind: usage, text: "Главное различие: Jak się nazywasz? спрашивает фамилию или имя с фамилией, а Jak masz na imię? — только имя. Ответы тоже разные: Nazywam się Kowalski, но Mam na imię Jan." }
  - { kind: usage, text: "О вещах и местах говорят так же: Jak się nazywa ta ulica? «Как называется эта улица?»" }
  - { kind: usage, text: "Совершенный вид — nazwać: Nazwali syna Adamem «Они назвали сына Адамом»." }
  - { kind: usage, text: "Называя кем-то, ставят творительный падеж: nazywać kogoś kłamcą «называть кого-то лжецом»." }
collocations:
  - { pl: "jak się nazywasz?", ru: "как тебя зовут?" }
  - { pl: "nazywać się", ru: "называться" }
  - { pl: "tak zwany", ru: "так называемый" }
  - { pl: "nazywać rzeczy po imieniu", ru: "называть вещи своими именами" }
etymology: "Из na- + zywać, от zwać «звать» (праславянское *zъvati); ср. русские «называть» и «звать»."
memory: "Jak się nazywasz? спрашивает фамилию или полное имя, а Jak masz na imię? — только имя. Корень zwać — родня русскому «звать»."
idioms:
  - { pl: "nazywać rzeczy po imieniu", ru: "называть вещи своими именами" }
  - { pl: "jak się nazywasz?", ru: "как тебя зовут?" }
  - { pl: "tak zwany", ru: "так называемый" }
