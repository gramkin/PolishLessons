notes:
  - { kind: false-friend, text: "HAZARD — «азартные игры», а не «азарт». Азарт, задор — ZAPAŁ, EMOCJE, «азартный» о человеке — ZAPALONY. Игрок-лудоман — HAZARDZISTA, азартные игры — GRY HAZARDOWE." }
  - { kind: usage, text: "Пять живых форм, мужской род, неодушевлённое, только единственное число. Родительный — HAZARDU, в местном D переходит в DZ: W HAZARDZIE. Формы множественного не даются." }
  - { kind: government, text: "Зависимость от азартных игр — UZALEŻNIENIE OD HAZARDU, OD с родительным. Проиграть на азартных играх — PRZEGRAĆ W HAZARDZIE." }
  - { kind: pronunciation, text: "Читается «ха́зарт», ударение на первом слоге. H — «х», конечное D оглушается в «т»." }
collocations:
  - { pl: "uzależnienie od hazardu", ru: "игровая зависимость" }
  - { pl: "gry hazardowe", ru: "азартные игры" }
  - { pl: "czysty hazard", ru: "чистая авантюра" }
family:
  - { pl: "hazardzista", ru: "игрок, лудоман", relation: derived }
  - { pl: "hazardowy", ru: "азартный (об игре)", relation: derived }
  - { pl: "gry hazardowe", ru: "азартные игры", relation: derived }
etymology: "Из французского слова со значением «случай, риск», которое восходит к арабскому названию игральной кости. Русский «азарт» — то же слово, но оно ушло к значению «задор»."
memory: "Hazard — азартные игры, не «азарт» (zapał). Читается «ха́зарт». Hazardzista — игрок. Uzależnienie od hazardu — игровая зависимость."
