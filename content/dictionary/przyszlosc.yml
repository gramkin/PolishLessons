# review
id: przyszlosc
format: 2
lemma: "przyszłość"
rank: 629
pos: noun
pron: { cyr: "пшы́шуосьць" }
senses:
  - id: future
    ru: "будущее"
    note: "w przyszłości «в будущем» — предложный падеж."
    examples:
      - pl: "W przyszłości on chce być lekarzem."
        ru: "В будущем он хочет быть врачом."
        source: { kind: tatoeba, id: 3660779 }
      - pl: "Te zagadnienia zostaną rozwiązane w najbliższej przyszłości."
        ru: "Эти проблемы будут решены в ближайшем будущем."
        source: { kind: tatoeba, id: 1002577 }
      - pl: "Przyszłość ma wiele imion."
        ru: "У будущего есть несколько имен."
        source: { kind: tatoeba, id: 1838504 }
  - id: plans
    ru: "na przyszłość — на будущее"
    note: "plany na przyszłość «планы на будущее» — с na и винительным."
    examples:
      - pl: "Masz jakieś plany na przyszłość?"
        ru: "У тебя есть какие-нибудь планы на будущее?"
        source: { kind: tatoeba, id: 3746264 }
      - pl: "Szanujmy historię, ale patrzmy w przyszłość."
        ru: "Давайте чтить историю, но смотреть в будущее."
        source: { kind: tatoeba, id: 6302074 }
      - pl: "Od tego zależy moja przyszłość."
        ru: "От этого зависит моё будущее."
        source: { kind: tatoeba, id: 8666086 }
  - id: prospects
    ru: "будущее как перспектива"
    note: "nie mam przyszłości «у меня нет будущего»."
    examples:
      - pl: "Nie mam przyszłości."
        ru: "У меня нет будущего."
        source: { kind: translated, id: 8766281 }
      - pl: "Dzieci są naszą przyszłością."
        ru: "Дети — наше будущее."
        source: { kind: translated, id: 10618915 }
      - pl: "Musimy się zastanowić nad przyszłością."
        ru: "Нам надо подумать о будущем."
        source: { kind: translated, id: 3680010 }
notes:
  - { kind: government, text: "«В будущем» — w przyszłości с предложным; «на будущее» — na przyszłość с винительным; «о будущем» — nad przyszłością или o przyszłości." }
  - { kind: usage, text: "Существительное неисчисляемое: множественного числа в живой речи нет — отсюда пропуски в таблице форм." }
  - { kind: usage, text: "Слово прозрачно разбирается: przyszły «будущий» плюс -ość, как русское «будущность» от «будущий»." }
  - { kind: usage, text: "Рядом стоят przeszłość «прошлое» и teraźniejszość «настоящее» — весь ряд построен одинаково." }
collocations:
  - { pl: "w przyszłości", ru: "в будущем" }
  - { pl: "na przyszłość", ru: "на будущее" }
  - { pl: "plany na przyszłość", ru: "планы на будущее" }
  - { pl: "w najbliższej przyszłości", ru: "в ближайшем будущем" }
family:
  - { pl: "przyszły", ru: "будущий", relation: root }
  - { pl: "przeszłość", ru: "прошлое", relation: derived }
  - { pl: "teraźniejszość", ru: "настоящее", relation: derived }
etymology: "От przyszły «будущий», причастия от przyjść «прийти», плюс суффикс -ość — ровно как русская «будущность» от «будущий»."
memory: "przyszłość — «будущее», и падеж задаёт предлог: w przyszłości «в будущем» с предложным, но na przyszłość «на будущее» с винительным — plany na przyszłość. Слово неисчисляемое, множественного числа у него нет. И запомните весь ряд разом: przeszłość «прошлое», teraźniejszość «настоящее», przyszłość «будущее»."
idioms:
  - { pl: "w przyszłości", ru: "в будущем" }
  - { pl: "plany na przyszłość", ru: "планы на будущее" }
  - { pl: "w najbliższej przyszłości", ru: "в ближайшем будущем" }
