# review
id: przypuscic
format: 2
lemma: "przypuścić"
rank: 2318
pos: verb
aspect: perf
aspectPair: przypuszczac
pron: { cyr: "пшыпу́сьциць" }
senses:
  - id: suppose
    ru: "предположить, допустить"
    examples:
      - pl: "Przypuśćmy, że się wzbogacisz na wyścigach."
        ru: "Предположим, ты разбогатеешь на скачках."
        source: { kind: tatoeba, id: 359870 }
      - pl: "Przypuśćmy, że on tu jest."
        ru: "Предположим, что он здесь."
        source: { kind: translated, id: 358719 }
      - pl: "Przypuśćmy, że zostaniesz zwolniony, co zrobisz najpierw?"
        ru: "Предположим, тебя уволят, что ты сделаешь в первую очередь?"
        source: { kind: translated, id: 668972 }
  - id: assumption
    ru: "предположение (отглагольное przypuszczenie)"
    examples:
      - pl: "To tylko przypuszczenie."
        ru: "Это всего лишь предположение."
        source: { kind: translated, id: 3869218 }
      - pl: "Wynik potwierdził moje przypuszczenia."
        ru: "Результат подтвердил мои предположения."
        source: { kind: translated, id: 1353220 }
notes:
  - { kind: usage, text: "В живой речи почти всегда в форме przypuśćmy «предположим» — вводное слово, как русское «допустим»." }
  - { kind: government, text: "Предположить, что… — przypuścić, że…, с союзом że." }
  - { kind: false-friend, text: "Буквально «припустить», от puścić «пустить»: допустить мысль — значит впустить её. Русское «допустить» устроено так же." }
  - { kind: usage, text: "Отглагольное существительное przypuszczenie значит «предположение» и живёт своей жизнью: To tylko przypuszczenie «Это лишь предположение»." }
collocations:
  - { pl: "przypuśćmy, że…", ru: "предположим, что…" }
  - { pl: "to tylko przypuszczenie", ru: "это лишь предположение" }
etymology: "przy- + puścić «пустить»: допустить мысль — впустить её. Русское «допустить» собрано так же."
memory: "przypuścić — «предположить», но в речи вы услышите прежде всего przypuśćmy «предположим». Отглагольное przypuszczenie — «предположение». Несовершенный вид — przypuszczać."
idioms:
  - { pl: "przypuśćmy, że…", ru: "предположим, что…" }
