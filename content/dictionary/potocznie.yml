# review
id: potocznie
format: 2
lemma: "potocznie"
rank: 5999
pos: adv
pron: { cyr: "пото́чне" }
senses:
  - id: colloquially-called
    ru: "в просторечии, в обиходе (называть)"
    examples:
      - pl: "Bezpieczniki potocznie nazywa się korkami."
        ru: "Предохранители в просторечии называют пробками."
        source: { kind: authored }
      - pl: "Tę chorobę potocznie nazywamy grypą żołądkową."
        ru: "Эту болезнь в обиходе мы называем кишечным гриппом."
        source: { kind: authored }
      - pl: "Mówiąc potocznie, to był kompletny bałagan."
        ru: "Попросту говоря, это был полный бардак."
        source: { kind: authored }
  - id: informally
    ru: "разговорно, по-простому"
    examples:
      - pl: "Pisze potocznie, jakby rozmawiał z kolegą."
        ru: "Он пишет разговорным языком, будто беседует с приятелем."
        source: { kind: authored }
      - pl: "W pracy nie wypada mówić zbyt potocznie."
        ru: "На работе не принято говорить слишком по-простому."
        source: { kind: authored }
      - pl: "Wyjaśnij to potocznie, bez fachowych terminów."
        ru: "Объясни это по-простому, без специальных терминов."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Чаще всего встречается в обороте POTOCZNIE NAZYWANY «в просторечии называемый»: так объясняют, как предмет зовут в быту. Пометка «pot.» в польских словарях — это сокращение от POTOCZNY «разговорный»." }
  - { kind: false-friend, text: "Связь с русским «поток» есть, но значение другое: POTOCZNIE — не «потоком», а «разговорно, в обиходе». JĘZYK POTOCZNY — «разговорный язык»." }
  - { kind: usage, text: "Сравнительная степень — POTOCZNIEJ «проще, разговорнее», превосходная — NAJPOTOCZNIEJ; обе встречаются редко." }
collocations:
  - { pl: "potocznie nazywany", ru: "в просторечии называемый" }
  - { pl: "mówiąc potocznie", ru: "попросту говоря" }
  - { pl: "zbyt potocznie", ru: "слишком по-простому" }
family:
  - { pl: "potoczny", ru: "разговорный, обиходный", relation: derived }
  - { pl: "potoczność", ru: "обиходность, разговорность", relation: derived }
  - { pl: "toczyć", ru: "катить; вести (беседу)", relation: root, id: toczyc }
synonyms: ["pospolicie", "prosto", "nieformalnie"]
etymology: "От POTOCZNY «разговорный, обиходный», связанного с TOCZYĆ SIĘ «катиться, идти своим чередом». По мнению А. Баньковского, слово появилось в XVIII веке как перевод с французского."
memory: "Potocznie — «в обиходе», как то, что катится (toczy się) само собой каждый день. Potocznie nazywany — «в просторечии называемый»."
idioms:
  - { pl: "mówiąc potocznie", ru: "попросту говоря" }
