etymology: "От прилагательного ZŁY «злой, плохой», от праславянского *zъlъ, с суффиксом -OŚĆ, который отвечает русскому -ОСТЬ. Значит, ZŁOŚĆ и «злость» — одно и то же слово, собранное из одинаковых частей, и различаются они только тем, что польское Ł перешло в звук «у». Это общий случай для всего гнезда: ZŁO звучит «зуо», ZŁY — «зуы», ZŁOŚĆ — «зуосьчь», а по-русски во всех трёх слышно «зл». Увидев на письме Ł, русскоязычный узнаёт слово сразу, услышав — почти никогда."
memory: "То же слово, что «злость», и собрано так же: zły плюс суффикс -ość, который отвечает русскому -ость. Но читается «зуосьчь», потому что ł это «у», и на слух родство пропадает. Оборот переносится целиком: na złość значит «назло» и берёт дательный, na złość sąsiadowi. Поправка одна: złośliwy это «злобный, ехидный», а в медицине «злокачественный». Множественное złości употребляется о повторяющихся вспышках."
