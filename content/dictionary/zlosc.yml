notes:
  - { kind: false-friend, text: "Совпадение с русским здесь полное, и пользоваться им надо смело: ZŁOŚĆ это «злость», и даже оборот с предлогом совпадает. NA ZŁOŚĆ значит ровно «назло», и управляет дательным: ZROBIŁ TO NA ZŁOŚĆ SĄSIADOWI «он сделал это назло соседу». Поправка нужна только в одном месте: ZŁOŚLIWY это не «злостный», а «злобный, ехидный», о человеке или о замечании, а в медицине ещё и «злокачественный», GUZ ZŁOŚLIWY «злокачественная опухоль»." }
  - { kind: pronunciation, text: "Читается «зуосьчь», в один слог, и это главная трудность. Буква Ł даёт «у», а не «л», поэтому начало слова «зуо», а чтение «злость» будет ошибкой, хотя слово то же самое. Конечное -ŚĆ — два мягких звука подряд, «сьчь», слитно. В родительном ZŁOŚCI слогов становится два: «зуо́сьчи». То же правило в однокоренном ZŁO «зуо» и в прилагательном ZŁY «зуы»." }
  - { kind: government, text: "Из злости — предлог Z с родительным: ZE ZŁOŚCI, причём предлог принимает вид ZE перед словом на согласную с последующей согласной. Назло кому — NA ZŁOŚĆ с дательным, как и по-русски. Выместить на кого — WYŁADOWAĆ ZŁOŚĆ NA KIMŚ, предлог NA с предложным, тогда как русский ставит «на» с предложным тоже, так что схема совпадает. Сдержать — OPANOWAĆ ZŁOŚĆ, винительный, но при отрицании родительный: NIE MÓGŁ OPANOWAĆ ZŁOŚCI." }
  - { kind: usage, text: "Шесть форм, обычный разряд женских слов на -OŚĆ. Существительное отвлечённое, поэтому единственное число несёт почти всю работу. Множественное употребляется, когда речь о повторяющихся вспышках: ZŁOŚCI DZIECKA «вспышки злости у ребёнка», и в этом смысле оно совершенно обычно в языке воспитателей и психологов. Суффикс -OŚĆ отвечает русскому -ОСТЬ, а основа ZŁ- та же, что в ZŁY «злой, плохой» и ZŁO «зло»." }
  - { kind: register, text: "Слово нейтральное и повседневное. Частые обороты: ZE ZŁOŚCI «со злости», NA ZŁOŚĆ «назло», WYŁADOWAĆ ZŁOŚĆ «выместить злость», ZE ZŁOŚCIĄ «со злостью». Глагол ZŁOŚCIĆ SIĘ значит «злиться» и управляет предлогом NA с винительным: ZŁOŚCI SIĘ NA MNIE «он злится на меня», ровно как по-русски. Для сильного гнева есть отдельное слово GNIEW, которое звучит книжнее, примерно как русский «гнев»." }
