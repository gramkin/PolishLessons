etymology: "От UPRZEĆ SIĘ «упереться», от корня PRZEĆ, того же, что в русском «перёть, упираться». Образ в двух языках один: человек упёрся и не двигается, отсюда и «упрямый», и UPARTY. Польское причастие на -TY от этого глагола и стало прилагательным, как русское «упёртый» в разговорной речи — только в польском это нейтральное литературное слово, а в русском «упёртый» звучит грубо, и нейтральным остаётся «упрямый» от «упираться». Так два языка взяли одну метафору, но закрепили её в разных регистрах. Сравнительная степень на -SZY отвечает русскому -ЕЕ или -ЕЙ: UPARTSZY это «упрямее», и приставка NAJ- в превосходной степени — то же, что русское «самый», только слитно."
memory: "Корень как в русском «упираться»: uprzeć się «упереться» дало uparty, буквально «упёртый» — но в польском это нейтральное слово, а русское нейтральное — «упрямый». Важно не путать с wytrwały: uparty осуждает (о человеке), wytrwały хвалит. О предметах uparty = «упорный» без осуждения: uparty kaszel. Тридцать три формы — три степени по одиннадцать, naj- приставляется к сравнительной. И два чередования в одной парадигме: uparci (t→c) в положительной, upartsi (sz→s) в сравнительной."
