notes:
  - { kind: false-friend, text: "Русский различает «упрямый» и «упорный»: первое осуждает, второе хвалит. Польское UPARTY покрывает прежде всего первое — это упрямство, нежелание слушать: UPARTY JAK OSIOŁ. Для похвальной настойчивости у польского есть отдельное слово WYTRWAŁY «упорный, стойкий», и путать их не следует: WYTRWAŁY PRACOWNIK это ценный работник, UPARTY PRACOWNIK — тот, с кем трудно. Исключение — неодушевлённые предметы: UPARTY KASZEL, UPARTY DESZCZ, UPARTE PLOTKI переводятся русским «упорный» без всякого осуждения, потому что осуждать кашель не за что." }
  - { kind: usage, text: "Тридцать три формы — это три степени сравнения по одиннадцати форм каждая: положительная UPARTY, сравнительная UPARTSZY, превосходная NAJUPARTSZY. Превосходная образуется приставкой NAJ- прямо от сравнительной, и это правило без исключений: достаточно знать сравнительную форму. Наряду с синтетической формой употребляется аналитическая BARDZIEJ UPARTY, и в живой речи она даже чаще: UPARTSZY звучит книжно. Внутри парадигмы спрятан урок: мужское-личное множественное положительной степени UPARCI с переходом T в C, а сравнительной — UPARTSI с переходом SZ в S. Два разных чередования в одном слове." }
  - { kind: government, text: "Прилагательное не требует падежа, но живёт в устойчивых конструкциях. Сравнение через JAK с именительным: UPARTY JAK OSIOŁ, UPARTY JAK MUŁ, UPARTY JAK KOZA — польский предпочитает осла и мула, и это те же животные, что в русском. В чём упрям — предлог W с местным: UPARTY W SWOIM ZDANIU «упрямый в своём мнении». При сравнении степеней ставят OD с родительным или NIŻ с именительным: UPARTSZY OD BRATA, UPARTSZY NIŻ BRAT, и обе конструкции равноправны. Наречие — UPARCIE: UPARCIE MILCZEĆ «упорно молчать», UPARCIE POWTARZAĆ «упорно повторять»." }
  - { kind: pronunciation, text: "Читается «упа́рты», три слога, ударение на предпоследнем. Буква U это «у», R твёрдое, Y это «ы», поэтому конец слова звучит «ты», а не «тый». В мужском-личном множественном UPARCI сочетание CI даёт мягкое «ць»: «упа́рци». В сравнительной степени UPARTSZY подряд стоят T, S и Z: читается «упа́ртшы», где TSZ произносится как «тш», без гласного между согласными. В превосходной NAJUPARTSZY ударение переезжает на TSZ: «наюпа́ртшы», четыре слога." }
