etymology: "Праславянское *dъska, само заимствованное из латинского DISCUS, а то из греческого DISKOS «диск, круглая плита». От этого корня и польская DESKA, и русская «доска», и немецкое TISCH «стол», которое пошло от значения столешницы. Пара DESKA и «доска» показательна для истории звуков: на месте праславянского сверхкраткого ъ польский даёт E, а русский O. Та же разница видна в паре SEN и «сон», DZIEŃ и «день» против «дня», и она сквозная, а не случайная. Так что польское E в DESKA — не искажение русского O, а закономерный местный исход того же самого гласного."
memory: "Только деревянная доска! Классная доска — tablica, доска объявлений — tablica ogłoszeń, шахматная — szachownica. В местном k переходит в c: desce, как panice. В родительном множественного вставная гласная: desek, как «досок». Две идиомы: od deski do deski «от корки до корки» (книги переплетали в доски) и deska ratunku «последняя надежда»."
idioms:
