notes:
  - { kind: false-friend, text: "Русская «доска» шире польской DESKA, и на этом спотыкаются постоянно. DESKA — это только деревянная доска, плашка, половица. Школьная или классная доска, та, на которой пишут, по-польски TABLICA, и «доска объявлений» — TABLICA OGŁOSZEŃ, а «шахматная доска» — SZACHOWNICA. Сказать DESKA о школьной доске — ошибка, которую поляк заметит сразу. В обратную сторону проще: DESKA всегда переводится «доска», надо лишь помнить, что предметы с особым назначением получают в польском свои слова." }
  - { kind: pronunciation, text: "Читается «дэ́ска», ударение на первом слоге из двух. В местном и дательном падеже DESCE согласная K переходит в C: «дэ́сце». Это то же чередование, что в PANIKA и PANICE, PIGUŁKA и PIGUŁCE, MONETA и MONECIE. В родительном множественного DESEK появляется беглая гласная E между S и K, которой в именительном нет: DESKA, но DESEK. Русский делает то же самое в «доска» и «досок», так что вставка привычна." }
  - { kind: usage, text: "Два устойчивых выражения стоит выучить целиком. OD DESKI DO DESKI значит «от корки до корки», и образ тут буквальный: старые книги переплетали в деревянные доски, так что прочитать от доски до доски — прочитать всё. DESKA RATUNKU — «спасательная доска», то есть последняя надежда, соломинка; русский в этом месте хватается за соломинку, поляк за доску. Из бытового: DESKA DO KROJENIA «разделочная доска», DESKA DO PRASOWANIA «гладильная доска», DESKA SUROWA «необработанная доска», а DESKOROLKA «скейтборд» собрана из DESKA и ROLKA." }
  - { kind: government, text: "Женский род на -A, склонение правильное, винительный на -Ę: PRZYBIŁ DESKĘ. При отрицании винительный уходит в родительный: NIE PRZYBIŁ DESKI. Материал вводится предлогом Z с родительным: Z DESKI ZROBIŁ PÓŁKĘ «из доски он сделал полку». Назначение — предлог DO с родительным: DESKA DO KROJENIA, DESKA DO PRASOWANIA. Это важное отличие от русского, который тут обходится прилагательным или родительным без предлога: «разделочная доска», «доска для нарезки»." }
