    examples:
      - pl: "Rasa ludzka przetrwała gorsze czasy."
        ru: "Человеческий род переживал худшие времена."
        source: { kind: authored }
      - pl: "Dyskryminacja ze względu na rasę jest zakazana."
        ru: "Дискриминация по признаку расы запрещена."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Русская «раса» говорится только о людях, и притом редко. Польское RASA прежде всего значит «порода» и говорится о животных: pies rasy owczarek «собака породы овчарка», kot rasowy «породистый кот», konie czystej rasy «лошади чистой породы». Человеческое значение есть — rasa ludzka, — но в быту оно уступает собачьему и кошачьему с большим отрывом. Отдельного слова на месте русской «породы» у польского нет, и rasa закрывает оба смысла одна." }
  - { kind: usage, text: "Дательный и местный — RASIE: твёрдое s смягчается перед окончанием -e, как и в STRESIE из этой же партии. Изменение незаметное на слух для русского уха, но на письме обязательное: формы rasy с -e не бывает." }
  - { kind: usage, text: "Родительный множественного — RAS, чистая основа без окончания. Так же устроены kobiet, szkół, nóg: у женских слов на -a родительный множественного часто оказывается голым корнем, и это единственный падеж, где слово выглядит короче именительного." }
collocations:
  - { pl: "pies rasowy", ru: "породистая собака" }
  - { pl: "czystej rasy", ru: "чистой породы" }
  - { pl: "rasa psa", ru: "порода собаки" }
family:
  - { pl: "rasowy", ru: "породистый; расовый", relation: derived }
  - { pl: "rasizm", ru: "расизм", relation: derived }
etymology: "Через французское RACE из итальянского razza, происхождение которого спорно. Оба языка взяли слово из одного источника, но развели значения: русский оставил его за людьми, а для животных сохранил своё «порода», польский же отдал его животным, и человеческий смысл в нём почти стёрся. Один и тот же европеизм, две разные ниши."
memory: "Прежде всего «порода», а не «раса»: pies rasowy — породистая собака. Родительный множественного голый: ras."
idioms:
  - { pl: "czystej rasy", ru: "чистокровный" }
  - { pl: "rasa ludzka", ru: "человеческий род" }
