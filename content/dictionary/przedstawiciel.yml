notes:
  - { kind: false-friend, text: "PRZEDSTAWICIEL — «представитель», перевод прямой. Торговый агент — PRZEDSTAWICIEL HANDLOWY. Представительство фирмы — PRZEDSTAWICIELSTWO." }
  - { kind: usage, text: "Десять форм, мужской род, лицо. Во множественном — PRZEDSTAWICIELE, в родительном — PRZEDSTAWICIELI. Местный и звательный — PRZEDSTAWICIELU. Женщина — PRZEDSTAWICIELKA." }
