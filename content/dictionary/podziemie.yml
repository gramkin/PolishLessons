notes:
  - { kind: false-friend, text: "PODZIEMIE — «подполье» как организация. Подземные помещения, катакомбы — PODZIEMIA, во множественном. Подвал дома — PIWNICA, метро — METRO. Подпольщик — KONSPIRATOR." }
  - { kind: usage, text: "Средний род. Родительный — PODZIEMIA, местный — PODZIEMIU. Множественное PODZIEMIA, родительный PODZIEMI — о подземельях." }
  - { kind: government, text: "Уйти в подполье — ZEJŚĆ DO PODZIEMIA, DO с родительным. Действовать в подполье — DZIAŁAĆ W PODZIEMIU, местный." }
  - { kind: pronunciation, text: "Читается «подзе́ме»: DZIE — «дзе», MIE — «ме». Ударение на предпоследнем слоге." }
collocations:
