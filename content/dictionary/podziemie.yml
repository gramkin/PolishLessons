etymology: "POD «под» и ZIEMIA «земля»: то, что под землёй. Русское «подземелье» построено так же, а смысл «подполье» — польская калька."
memory: "Podziemie — подполье; podziemia — подземелья. Zejść do podziemia — уйти в подполье. Читается «подзе́ме»."
