# review
id: solidny
format: 2
lemma: "solidny"
rank: 4910
pos: adj
pron: { cyr: "соли́дны" }
senses:
  - id: sturdy
    ru: "прочный, добротный, основательный"
    examples:
      - pl: "To solidny stół z dębu."
        ru: "Это добротный стол из дуба."
        source: { kind: authored }
      - pl: "Dom ma solidne fundamenty."
        ru: "У дома прочный фундамент."
        source: { kind: authored }
      - pl: "To najsolidniejszy most w regionie."
        ru: "Это самый прочный мост в регионе."
        source: { kind: authored }
  - id: reliable
    ru: "надёжный, добросовестный (о человеке, фирме)"
    examples:
      - pl: "To solidna firma, polecam."
        ru: "Это надёжная фирма, рекомендую."
        source: { kind: authored }
      - pl: "Jest solidnym pracownikiem."
        ru: "Он добросовестный работник."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Русское «солидный» чаще значит «внушительный, почтенный»: «солидный господин», «солидная сумма». Польское SOLIDNY — прежде всего «прочный» и «добросовестный»: SOLIDNA ROBOTA, «добротная работа», SOLIDNY FACHOWIEC, «надёжный мастер». «Солидная сумма» по-польски тоже бывает SOLIDNA, но чаще POKAŹNA." }
  - { kind: usage, text: "Полная парадигма: SOLIDNY, SOLIDNIEJSZY, NAJSOLIDNIEJSZY. Все степени живые: SOLIDNIEJSZA KONSTRUKCJA. Мужское-личное: SOLIDNI, SOLIDNIEJSI, NAJSOLIDNIEJSI — о надёжных работниках и партнёрах." }
  - { kind: government, text: "Ставится и до, и после существительного: SOLIDNY PRACOWNIK, PRACA SOLIDNA. Надёжный в чём-то — SOLIDNY W + местный: SOLIDNY W INTERESACH. Наречие SOLIDNIE — «основательно, на совесть»." }
  - { kind: pronunciation, text: "Читается «соли́дны», три слога, ударение на предпоследнем. LI — мягкое «ли», DN — без гласной. В SOLIDNIEJSZY: «солидне́йшы»." }
  - { kind: register, text: "Нейтральное слово, похвала в быту и в деле: SOLIDNA ROBOTA, SOLIDNE WYKSZTAŁCENIE. Разговорное SOLIDNIE — «как следует»: SOLIDNIE SIĘ NAJADŁ, «он основательно наелся»." }
collocations:
  - { pl: "solidna firma", ru: "надёжная фирма" }
  - { pl: "solidna robota", ru: "добротная работа" }
  - { pl: "solidne podstawy", ru: "прочные основы" }
family:
  - { pl: "solidnie", ru: "основательно, на совесть", relation: derived }
  - { pl: "porządny", ru: "добротный, порядочный", relation: root, id: porzadny }
  - { pl: "trwały", ru: "прочный, долговечный", relation: root }
etymology: "Из латинского solidus, «плотный, цельный, прочный». Тот же корень в слове «солидарность» и в названии римской золотой монеты солид. Польский сохранил основное значение «прочный», а русский сдвинул слово к «почтенный»."
memory: "Solidny — прочный, добротный; надёжный: solidny stół, solidna firma, solidna robota. Не только «солидный»! Solidniejszy, najsolidniejszy. Читается «соли́дны»."
idioms:
  - { pl: "solidna robota", ru: "добротная работа, сделано на совесть" }
