notes:
  - { kind: usage, text: "Третье существительное на -ja с двойным родительным множественного: TRADYCJI и книжное TRADYCYJ, после konferencja и reputacja. Современная форма — tradycji, а -yj встречается в текстах межвоенных и старше. В единственном числе TRADYCJI покрывает родительный, дательный и предложный сразу, и различает их только предлог: bez tradycji, ku tradycji, o tradycji." }
  - { kind: usage, text: "ZGODNIE Z TRADYCJĄ — «согласно традиции», творительный после zgodnie z, как и в zgodnie z procedurą. Русское «согласно» требует дательного, так что падеж здесь расходится, хотя предлог переводится дословно. Прилагательное — TRADYCYJNY «традиционный»." }
collocations:
  - { pl: "zgodnie z tradycją", ru: "согласно традиции" }
  - { pl: "tradycja rodzinna", ru: "семейная традиция" }
  - { pl: "kultywować tradycję", ru: "хранить традицию" }
family:
  - { pl: "tradycyjny", ru: "традиционный", relation: derived }
  - { pl: "zwyczaj", ru: "обычай", relation: root }
  - { pl: "nowoczesność", ru: "современность", relation: antonym }
etymology: "Из латинского traditio «передача», от tradere «передавать». И русский, и польский взяли слово через книжную латынь, поэтому корень общий; разошлось лишь окончание — латинское -tio дало польское -cja и русское -ция, как в konferencja и «конференция»."
memory: "Родительный множественного двойной: современное TRADYCJI и старое TRADYCYJ. И падеж после zgodnie z — творительный: zgodnie z tradycją, а не с дательным, как у нас."
