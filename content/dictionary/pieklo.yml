# review
id: pieklo
format: 2
lemma: "piekło"
rank: 1289
pos: noun
pron: { cyr: "пе́куо" }
senses:
  - id: hell
    ru: "ад"
    examples:
      - pl: "Wojna to piekło."
        ru: "Война — это ад."
        source: { kind: translated, id: 7894303 }
      - pl: "Piekło to inni."
        ru: "Ад — это другие."
        source: { kind: translated, id: 966876 }
      - pl: "Będziesz się smażyć w piekle."
        ru: "Ты будешь жариться в аду."
        source: { kind: tatoeba, id: 6327742 }
  - id: to-hell
    ru: "do piekła — в ад"
    examples:
      - pl: "Nie pójdziesz do piekła."
        ru: "Ты не попадёшь в ад."
        source: { kind: tatoeba, id: 6015201 }
      - pl: "Droga do piekła wybrukowana jest dobrymi chęciami."
        ru: "Дорога в ад вымощена благими намерениями."
        source: { kind: translated, id: 2778329 }
      - pl: "Do piekła z tym!"
        ru: "К чёрту это!"
        source: { kind: translated, id: 11319034 }
  - id: living-hell
    ru: "ад на земле, невыносимая жизнь"
    examples:
      - pl: "Urządziła mu piekło."
        ru: "Она устроила ему ад."
        source: { kind: tatoeba, id: 1459953 }
      - pl: "Zrobił z mojego życia istne piekło."
        ru: "Он превратил мою жизнь в настоящий ад."
        source: { kind: translated, id: 3973781 }
      - pl: "To miejsce stało się piekłem na ziemi."
        ru: "Это место стало адом на земле."
        source: { kind: translated, id: 524097 }
notes:
  - { kind: usage, text: "Piekło — «ад» и буквально, и переносно: zrobić komuś piekło «устроить кому-то ад»." }
  - { kind: false-friend, text: "Осторожно: форма piekła часто оказывается прошедшим временем глагола piec «печь» — Piekła chleb «Она пекла хлеб». Различает только контекст." }
  - { kind: usage, text: "Пословица Droga do piekła wybrukowana jest dobrymi chęciami — та же, что русская «Дорога в ад вымощена благими намерениями»." }
  - { kind: pronunciation, text: "ł звучит как «у»: пе́куо. Ударение на первый слог." }
collocations:
  - { pl: "w piekle", ru: "в аду" }
  - { pl: "do piekła", ru: "в ад" }
  - { pl: "piekło na ziemi", ru: "ад на земле" }
etymology: "Праславянское *pьkъlъ «смола» — ад назван по смоле, в которой варятся грешники. Русское «пекло» — то же слово, и оно сохранило оба значения."
memory: "piekło — «ад», и русское «пекло» — то же самое слово, от праславянского «смола». Осторожно с формой piekła: чаще всего это прошедшее время глагола piec «печь», а не родительный падеж."
idioms:
  - { pl: "droga do piekła", ru: "дорога в ад" }
  - { pl: "piekło na ziemi", ru: "ад на земле" }
  - { pl: "do piekła z tym", ru: "к чёрту это" }
