# review
id: handlowac
format: 2
lemma: "handlować"
rank: 2448
pos: verb
aspect: imperf
pron: { cyr: "хандло́ваць" }
senses:
  - id: trade
    ru: "торговать (чем-л.)"
    examples:
      - pl: "On handluje whisky."
        ru: "Он торгует виски."
        source: { kind: translated, id: 1133675 }
      - pl: "On handluje ziarnem."
        ru: "Он торгует зерном."
        source: { kind: translated, id: 2185838 }
      - pl: "Handlują oprogramowaniem."
        ru: "Они торгуют программным обеспечением."
        source: { kind: translated, id: 980790 }
  - id: deal
    ru: "вести торговлю, заниматься торговлей"
    examples:
      - pl: "Handlować towarem z najwyższej półki."
        ru: "Торговать товаром высшего качества."
        source: { kind: translated, id: 365179 }
      - pl: "Handlują używanymi samochodami."
        ru: "Они торгуют подержанными автомобилями."
        source: { kind: authored }
notes:
  - { kind: government, text: "Требует творительного падежа: handlować czymś «торговать чем-л.» — ровно как в русском." }
  - { kind: usage, text: "Рядом стоят handel «торговля», handlowiec «торговец», handlowy «торговый»." }
  - { kind: false-friend, text: "Ничего общего с «хандрой» или «гандболом»: слово заимствовано из немецкого Handel «торговля»." }
  - { kind: usage, text: "Пары совершенного вида нет; для разового действия берут sprzedać «продать»." }
collocations:
  - { pl: "handlować czymś", ru: "торговать чем-л." }
  - { pl: "handlować bronią", ru: "торговать оружием" }
etymology: "Из немецкого handeln «торговать» через существительное handel «торговля». В старом русском то же слово встречалось как «гандель»."
memory: "handlować czymś — «торговать чем-л.», с творительным падежом, как в русском. Корень немецкий: Handel «торговля», отсюда же handel и handlowy «торговый»."
idioms:
  - { pl: "handlować bronią", ru: "торговать оружием" }
