        source: { kind: authored }
notes:
  - { kind: usage, text: "Число форм у польского глагола вычисляется из двух признаков, и теперь это можно сказать точно. Общее ядро — сорок одна форма. Дальше вид решает, какая пара достанется: совершенный берёт деепричастие на -wszy, несовершенный — действительное причастие и деепричастие на -ąc. Переходность решает отдельно, бывает ли страдательное причастие. Отсюда четыре возможности: сорок две формы у совершенного непереходного (przemówić, popracować), пятьдесят две у несовершенного непереходного (TKWIĆ), пятьдесят три у совершенного переходного — как здесь и как ZYSKAĆ с WCIĄGNĄĆ, — и шестьдесят три у несовершенного переходного (malować, karmić, nagrywać)." }
  - { kind: usage, text: "Страдательное причастие даёт одиннадцать форм, а действительное десять, и разница эта не случайна. У страдательного мужская личная форма множественного отдельная: PRZYŁĄCZENI. У действительного она совпадает с именительным единственного, как TKWIĄCY, и потому форм на одну меньше. Заметьте сразу и мену в самой этой форме: причастие PRZYŁĄCZONY стоит с o, а мужское личное множественное — PRZYŁĄCZENI, с e. Так ведут себя все причастия на -ony: zrobiony даёт zrobieni, zmieniony даёт zmienieni." }
  - { kind: usage, text: "Повелительное наклонение здесь без окончания вовсе: PRZYŁĄCZ. Это третий образец из трёх совершенных глаголов последних партий: ZYSKAĆ даёт ZYSKAJ, WCIĄGNĄĆ даёт WCIĄGNIJ, а PRZYŁĄCZYĆ даёт голую основу. Вид у всех один, значит решает спряжение, и форму приходится запоминать вместе с инфинитивом." }
  - { kind: government, text: "Управление требует предлога DO с родительным: PRZYŁĄCZYĆ COŚ DO CZEGOŚ — przyłączyć dom do sieci, przyłączyć wieś do gminy. С частицей SIĘ глагол значит «присоединиться» и управляет так же: PRZYŁĄCZYĆ SIĘ DO CZEGOŚ — do protestu, do rozmowy, do grupy. Русский в обоих случаях говорит «присоединить к» и «присоединиться к», так что предлог совпадает по смыслу, хотя падеж после него разный: у польского родительный, у русского дательный." }
collocations:
  - { pl: "przyłączyć do sieci", ru: "подключить к сети" }
  - { pl: "przyłączyć się do grupy", ru: "присоединиться к группе" }
  - { pl: "przyłączyć prąd", ru: "подключить электричество" }
family:
  - { pl: "łączyć", ru: "соединять", relation: root, id: laczyc }
  - { pl: "przyłączać", ru: "присоединять", relation: aspect }
etymology: "Приставка przy- и ŁĄCZYĆ «соединять», из праславянского *lǫčiti. Корень этот любопытен тем, что означал и соединение, и разделение, а направление задавала приставка: польское łączyć значит «соединять», а русское однокоренное «разлучить» — наоборот, «разделить». Из того же гнезда русское «получить». Так что родство есть, но подсказки в нём мало, и łączyć надёжнее запоминать через «соединять»."
memory: "Пятьдесят три формы: совершенный переходный. Повелительное без окончания — przyłącz. И причастие przyłączony, но мужское личное множественное przyłączeni, с e."
