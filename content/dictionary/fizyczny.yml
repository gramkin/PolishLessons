        ru: "Рабочие начинают смену в шесть."
        source: { kind: authored }
notes:
  - { kind: usage, text: "У этого прилагательного всего одиннадцать форм, а не тридцать три, как у dokładny или konkretny. Не хватает степеней сравнения: нет ни fizyczniejszy, ни najfizyczniejszy. Причина не в фонетике, а в значении: fizyczny не описывает качество, а относит предмет к разряду, как drewniany или miejski. Разряд не бывает сильнее или слабее, поэтому сравнивать нечего." }
  - { kind: pronunciation, text: "Мужская личная форма множественного — FIZYCZNI, и в ней n перед i читается мягко: «физы́чни». Это общее правило для прилагательных на -ny: dokładny — dokładni, spokojny — spokojni. Само y в польском звучит как русское «ы», так что fizyczny — это «физы́чны», с твёрдым ы в обоих слогах." }
collocations:
  - { pl: "wysiłek fizyczny", ru: "физическая нагрузка" }
  - { pl: "praca fizyczna", ru: "физический труд" }
  - { pl: "kontakt fizyczny", ru: "физический контакт" }
family:
  - { pl: "fizyka", ru: "физика", relation: root }
  - { pl: "fizycznie", ru: "физически", relation: derived }
  - { pl: "psychiczny", ru: "психический", relation: antonym }
etymology: "Из греческого physikós «природный», от phýsis «природа», через латинское physicus и научную латынь. Русское «физический» пришло тем же путём, поэтому корень узнаётся сразу. Польский добавил к нему своё прилагательное окончание -ny, как в konkretny и dokładny, и получил fizyczny с тем же -cz-, что и в fizyka."
memory: "Одиннадцать форм вместо тридцати трёх: степеней сравнения нет, потому что fizyczny относит к разряду, а не измеряет качество. А мужская личная форма мягкая: fizyczni."
idioms:
