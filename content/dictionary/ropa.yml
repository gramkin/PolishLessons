notes:
  - { kind: false-friend, text: "Одно польское слово покрывает две вещи, между которыми по-русски нет ничего общего: нефть и гной. Различает их только контекст и одно прилагательное. ROPA NAFTOWA — это нефть, и в экономических сводках её часто сокращают до одного слова ROPA: CENA ROPY значит «цена нефти». В медицинском тексте то же самое слово означает гной: ROPA Z RANY. Русскому ни одно из значений не подсказывает другого, поэтому запоминать приходится оба сразу, как два разных слова с одинаковым написанием." }
  - { kind: usage, text: "Существительное женского рода, десять падежных форм, включая звательный ROPO, который для такого слова звучит странно и в жизни не встречается. Родительный множественного ROP существует формально, но оба значения относятся к веществу, а вещество не считают, так что множественное число употребляется редко и только когда речь о сортах: ROPY Z RÓŻNYCH ZŁÓŻ «нефть из разных месторождений». Прилагательное ROPNY относится только ко второму значению: ROPNA RANA «гнойная рана»." }
  - { kind: government, text: "Откуда нефть или гной — предлог Z с родительным: ROPA Z ZŁOŻA, ROPA Z RANY. Цена чего — родительный без предлога: CENA ROPY, BARYŁKA ROPY, как и по-русски. Глагол ROPIEĆ «гноиться» непереходный и управления не имеет: RANA ROPIEJE. Существительное ROPOCIĄG «нефтепровод» устроено из тех же частей, что русское слово, только корень другой: ROPA плюс CIĄG «тяга», против «нефть» плюс «провод»." }
  - { kind: pronunciation, text: "Читается «ро́па», два слога, ударение на первом, и в этом слове нет ни одной ловушки: все буквы звучат как написаны. Буква O даёт чистое «о», без всякого носового оттенка. В родительном ROPY слышно «ро́пы», с «ы» на конце. В предложном ROPIE появляется мягкость: «ро́пе», потому что P перед I смягчается. Стоит отличать от похожего на вид ROPUCHA «жаба», которое к этому слову отношения не имеет." }
  - { kind: register, text: "В значении «нефть» слово газетное и биржевое и встречается ежедневно: CENA ROPY, ROPA BRENT, WYDOBYCIE ROPY «добыча нефти». В значении «гной» оно медицинское и бытовое одновременно, и русскому уху звучит грубее, чем есть: по-польски это обычное слово без всякого оттенка брезгливости. Отдельно стоит запомнить, что дизельное топливо в разговоре тоже называют ROPA: TANKUJĘ ROPĘ значит «я заправляю дизель», и на заправке это слышно постоянно." }
