etymology: "Праславянское слово со значением густой выделяющейся жидкости, откуда и медицинский смысл. Нефтяное значение молодое, девятнадцатого века: когда в Галиции начали добывать нефть, её назвали тем же словом, потому что она так же сочится из земли, как гной из раны. Русский пошёл совсем другим путём и взял восточное слово: «нефть» пришла через арабский из персидского. Получилось, что поляк назвал нефть по способу появления, своим древним словом, а русский по названию вещества, чужим. Из того же польского гнезда ROPNY, ROPIEĆ и ROPOCIĄG."
memory: "Два значения, не связанные для русского ничем: нефть и гной. В газете cena ropy это «цена нефти», в больнице ropa z rany это «гной из раны». Полное название нефти ropa naftowa, но в сводках её сокращают. Третье, разговорное: на заправке ropa значит дизельное топливо, tankuję ropę. Нефтяное значение молодое: нефть назвали так потому, что она сочится из земли, как гной из раны, а русский взял персидское слово «нефть». Читается «ро́па», без ловушек."
idioms:
