# review
id: rozwiklac
format: 2
lemma: "rozwikłać"
rank: 2425
pos: verb
aspect: perf
pron: { cyr: "розви́куаць" }
senses:
  - id: unravel
    ru: "распутать, разрешить (загадку, дело)"
    examples:
      - pl: "W końcu rozwikłał tę kwestię."
        ru: "В конце концов он распутал этот вопрос."
        source: { kind: translated, id: 3961151 }
      - pl: "Trudno mi było rozwikłać tę kwestię."
        ru: "Мне было трудно распутать этот вопрос."
        source: { kind: translated, id: 1450552 }
      - pl: "Rozwikłamy ten problem bez trudu."
        ru: "Мы распутаем эту задачу без труда."
        source: { kind: translated, id: 362520 }
  - id: untangle
    ru: "распутать (узел, нити)"
    examples:
      - pl: "Rozwikłał supeł na sznurku."
        ru: "Он распутал узел на верёвке."
        source: { kind: authored }
      - pl: "Trudno rozwikłać te nici."
        ru: "Эти нитки трудно распутать."
        source: { kind: authored }
notes:
  - { kind: government, text: "Винительный падеж: rozwikłać zagadkę «распутать загадку»." }
  - { kind: false-friend, text: "roz- + wikłać «запутывать», от wić «вить». Русское «распутать» — от «путать», образ тот же: нити и узлы." }
  - { kind: usage, text: "Чаще о загадках и делах, чем о настоящих нитках: rozwikłać zagadkę, rozwikłać sprawę." }
  - { kind: usage, text: "Несовершенный вид — rozwikływać, но он редок. Родственное zawikłany «запутанный»." }
collocations:
  - { pl: "rozwikłać zagadkę", ru: "распутать загадку" }
  - { pl: "rozwikłać sprawę", ru: "распутать дело" }
etymology: "roz- + wikłać «запутывать», от wić «вить»; русское «распутать» — тот же образ."
memory: "rozwikłać — «распутать», чаще загадку или дело, чем нитки: rozwikłać zagadkę. Родственное zawikłany «запутанный»."
