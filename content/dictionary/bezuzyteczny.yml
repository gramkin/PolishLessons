etymology: "Сложено из приставки BEZ- и прилагательного UŻYTECZNY, которое идёт от UŻYTEK «польза, употребление», а то — от UŻYĆ, сложенного из U- и ŻYĆ в старом значении «пользоваться, иметь в употреблении». Приставка BEZ- восходит к праславянскому *bez и отвечает русской «без-» без остатка. Русское «бесполезный» построено по той же схеме, но на другом корне, «пользе», которая сама идёт от *polьza, родственного польскому POLEPSZYĆ через корень «лучше». Так два языка выразили одну мысль одинаковой приставкой и разными корнями, и это типичный случай: приставки у них общие, корневые предпочтения расходятся. Орфографическое различие тоже заслуживает внимания: польский не отражает оглушения приставки на письме, русский отражает, отсюда «бес-» рядом с «без-»."
memory: "Приставка bez- в польском пишется всегда одинаково: bezużyteczny, bezpieczny, bezcenny, bezsenny — где русский меняет на «бес-». В произношении оглушение есть (bezpieczny звучит «бэспечны»), на письме нет. Корень другой: польский на użytek «польза, употребление», русский на «пользе». Значит, нужно помнить użyteczny «полезный» и użytkownik «пользователь». Степени только описательные: bardziej bezużyteczny."
