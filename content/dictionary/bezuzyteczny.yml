notes:
  - { kind: usage, text: "Приставка BEZ- в польском пишется всегда одинаково, независимо от того, какой согласный идёт дальше: BEZUŻYTECZNY, BEZPIECZNY, BEZCENNY, BEZSENNY, BEZKARNY. Русский же меняет её по звонкости: «безопасный», но «бесполезный», «бессонный», «бесценный». Это различие чисто орфографическое, и правило польского проще: писать всегда BEZ-. В произношении, правда, оглушение происходит и в польском — BEZPIECZNY звучит «бэспечны», — но на письме это никак не отражается. Отсюда практический вывод: русское слово на «бес-» при переносе в польский получает BEZ-, и проверять ничего не нужно." }
  - { kind: false-friend, text: "Приставка в обоих языках одна и та же, а корень разный. Польский построил слово на UŻYTEK «польза, употребление», от UŻYĆ «использовать»: BEZUŻYTECZNY буквально «без употребления». Русский построил на «пользе»: «бесполезный». Значения совпали полностью, корни нет, так что угадать слово по русскому нельзя — надо запомнить UŻYTECZNY «полезный» и UŻYTEK «польза». Рядом в гнезде POŻYTEK, тоже «польза», и UŻYTKOWNIK «пользователь» — последнее особенно пригодится, потому что встречается в любой программе. Антоним к нашему слову — UŻYTECZNY или PRZYDATNY «пригодный, полезный»." }
  - { kind: government, text: "Согласуется с существительным в роде, числе и падеже. Для кого или чего бесполезен — предлог DLA с родительным: BEZUŻYTECZNY DLA NAS, BEZUŻYTECZNY DLA SPRAWY. В чём бесполезен — W с местным: BEZUŻYTECZNY W PRAKTYCE «бесполезный на практике». Степени сравнения слово образует, потому что бесполезность бывает большей и меньшей, но в таблице форм их нет, и строятся они описательно: BARDZIEJ BEZUŻYTECZNY, NAJBARDZIEJ BEZUŻYTECZNY. Наречие — BEZUŻYTECZNIE." }
  - { kind: pronunciation, text: "Читается «бэзужытэ́чны», пять слогов, ударение на предпоследнем, то есть на TECZ. Буква E в первом слоге даёт «э». Буква Ż произносится как «ж», твёрдо. Буква Y даёт «ы», поэтому середина слова звучит «жы», а не «жи». Сочетание CZ это «ч». Конечное -NY снова с «ы». Обратите внимание, что на письме приставка остаётся BEZ-, но перед глухим согласным в других словах она произносится глухо: BEZPIECZNY читается «бэспе́чны»." }
