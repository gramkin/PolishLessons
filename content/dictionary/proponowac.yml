notes:
  - { kind: usage, text: "ВИДОВАЯ ПАРА К ZAPROPONOWAĆ — И РАЗНИЦА ВИДНА ПРЯМО В ТАБЛИЦЕ. У несовершенного proponować есть причастие настоящего времени proponujący и деепричастие proponując, но НЕТ формы на -wszy. У совершенного zaproponować всё наоборот: есть zaproponowawszy, нет причастия настоящего. Это общее правило польского вида, и две соседние карточки показывают его в чистом виде." }
  - { kind: false-friend, text: "Смысл совпадает с русским полностью, потому что «предложить» — поморфемный перевод латинского proponere: pro- стало «пред-», ponere стало «-ложить». Разница только в виде. Proponuję значит «предлагаю» прямо сейчас или вообще, zaproponowałem — «предложил» один раз и дело сделано." }
  - { kind: government, text: "Предлагают ЧТО — винительный: proponować cenę, pomoc, zmiany. КОМУ — дательный: proponuję ci, proponował klientom. Предложить СДЕЛАТЬ — через żeby с прошедшим временем: proponuję, żebyśmy wyszli. Оборот proponuję в начале фразы работает как вежливое «давайте»: proponuję przerwę." }
  - { kind: pronunciation, text: "Пять слогов, ударение на предпоследнем: pro-po-NO-wać. Все o чистые: «пропонова́ць». Осторожно с двумя близкими формами настоящего времени: proponuję «предлагаю» с носовым ę на конце и proponuje «предлагает» без него. На слух их различает только лёгкое «эн»." }
collocations:
  - { pl: "proponuję przerwę", ru: "предлагаю сделать перерыв" }
  - { pl: "proponować pomoc", ru: "предлагать помощь" }
  - { pl: "co proponujesz?", ru: "что ты предлагаешь?" }
family:
  - { pl: "zaproponować", ru: "предложить", relation: aspect, id: zaproponowac }
  - { pl: "propozycja", ru: "предложение", relation: derived, id: propozycja }
  - { pl: "odmawiać", ru: "отказывать", relation: antonym }
etymology: "Из латинского proponere «выставлять вперёд», из pro- «вперёд» и ponere «класть» — того же корня, что pozycja и depozyt. Русское «предлагать» переведено с него по частям. Польский суффикс -ować оформил заимствование как обычный глагол, отсюда и основа настоящего времени на -uj-."
memory: "proponować — «предлагать», несовершенный вид к zaproponować. Разница видна по формам: у несовершенного есть proponujący и proponując, у совершенного — zaproponowawszy. И следи за концом слова: proponuję «предлагаю», proponuje «предлагает»."
idioms:
  - { pl: "proponuję przerwę", ru: "предлагаю перерыв" }
  - { pl: "co proponujesz?", ru: "что предлагаешь?" }
