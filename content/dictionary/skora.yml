        ru: "Не дели шкуру неубитого медведя."
        source: { kind: translated, id: 991328 }
notes:
  - { kind: usage, text: "Женский род: ta skóra, tej skóry. В косвенных падежах ó сохраняется: skóry, skórze, skórę." }
  - { kind: false-friend, text: "Одно польское слово покрывает три русских: «кожа» на теле, «кожа, шкура» как материал и «кожура» у фрукта. Для кожуры есть и уменьшительное skórka." }
  - { kind: usage, text: "na własnej skórze «на собственной шкуре» — об опыте, который дался тяжело: Przekonał się na własnej skórze." }
  - { kind: usage, text: "wilk w owczej skórze «волк в овечьей шкуре» — оборот совпадает с русским слово в слово." }
collocations:
  - { pl: "kolor skóry", ru: "цвет кожи" }
  - { pl: "ze skóry", ru: "из кожи" }
  - { pl: "na własnej skórze", ru: "на собственной шкуре" }
  - { pl: "skóra i kości", ru: "кожа да кости" }
family:
  - { pl: "skórka", ru: "кожица, кожура, корочка", relation: derived }
  - { pl: "skórzany", ru: "кожаный", relation: derived }
  - { pl: "kora", ru: "кора", relation: root }
etymology: "Праславянское *skora «то, что срезают, снимают», от корня *(s)ker- «резать». Русские «шкура», «кора» и «скорняк» — того же корня."
memory: "skóra — одно слово на три русских: «кожа» на теле, «кожа, шкура» как материал и «кожура» у фрукта. Женский род, ó держится во всех падежах: skóry, skórze. Запомните na własnej skórze «на собственной шкуре»."
idioms:
  - { pl: "wilk w owczej skórze", ru: "волк в овечьей шкуре" }
  - { pl: "na własnej skórze", ru: "на собственной шкуре" }
  - { pl: "nie dziel skóry na niedźwiedziu", ru: "не дели шкуру неубитого медведя" }
