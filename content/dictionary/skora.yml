  - id: leather
    ru: "кожа (материал), шкура"
    examples:
      - pl: "Te buty są ze skóry."
        ru: "Эти ботинки из кожи."
        source: { kind: translated, id: 982778 }
      - pl: "Skóra to surowiec na buty."
        ru: "Кожа — сырьё для обуви."
        source: { kind: translated, id: 882885 }
  - id: hide
    ru: "шкура (о собственной жизни и безопасности)"
    examples:
      - pl: "Niech to odczują na własnej skórze."
        ru: "Пусть почувствуют это на собственной шкуре."
        source: { kind: translated, id: 13655490 }
