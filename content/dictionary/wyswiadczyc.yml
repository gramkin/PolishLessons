# review
id: wyswiadczyc
format: 2
lemma: "wyświadczyć"
rank: 4116
pos: verb
pron: { cyr: "высьвя́дчыць" }
senses:
  - id: favour
    ru: "оказать (услугу, любезность)"
    examples:
      - pl: "Wyświadczył mi ogromną przysługę."
        ru: "Он оказал мне огромную услугу."
        source: { kind: authored }
      - pl: "Wyświadcz mi przysługę i zamknij drzwi."
        ru: "Сделай одолжение, закрой дверь."
        source: { kind: authored }
