        ru: "Она любезно меня подвезла."
        source: { kind: authored }
  - id: render
    ru: "сделать (добро), оказать (помощь)"
    examples:
      - pl: "Wyświadczyła mu wiele dobrego."
        ru: "Она сделала ему много добра."
        source: { kind: authored }
      - pl: "Chętnie wyświadczymy pomoc sąsiadom."
        ru: "Мы охотно окажем помощь соседям."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "WYŚWIADCZYĆ — «оказать (услугу)», а не «засвидетельствовать». «Засвидетельствовать» — POŚWIADCZYĆ или ZAŚWIADCZYĆ. Без приставки ŚWIADCZYĆ — и «свидетельствовать», и «оказывать услуги»: ŚWIADCZYĆ USŁUGI." }
  - { kind: usage, text: "Пятьдесят две формы: страдательное WYŚWIADCZONY — об услугах; форма для мужчин-людей WYŚWIADCZENI в карточку не включена. Почти всегда с PRZYSŁUGA, GRZECZNOŚĆ, DOBRO. Будущее: WYŚWIADCZĘ, WYŚWIADCZYSZ, повелительное WYŚWIADCZ. Несовершенный вид — WYŚWIADCZAĆ." }
  - { kind: government, text: "Что — винительный, кому — дательный: WYŚWIADCZYĆ KOMUŚ PRZYSŁUGĘ. Себе — SOBIE: WYŚWIADCZ SOBIE PRZYSŁUGĘ «сделай себе одолжение»." }
  - { kind: pronunciation, text: "Читается «высьвя́дчыць»: ŚW — «сьв», DCZ — «дч», ударение на предпоследнем слоге. WYŚWIADCZĘ — «высьвя́дчэ»." }
  - { kind: register, text: "Чуть книжное и вежливое. В разговоре чаще ZROBIĆ KOMUŚ PRZYSŁUGĘ. WYŚWIADCZ MI GRZECZNOŚĆ — иронично-вежливое «будь так любезен»." }
collocations:
  - { pl: "wyświadczyć przysługę", ru: "оказать услугу" }
  - { pl: "wyświadczyć grzeczność", ru: "оказать любезность" }
  - { pl: "wyświadczyć dobro", ru: "сделать добро" }
family:
  - { pl: "świadczyć", ru: "свидетельствовать; оказывать", relation: root, id: swiadczyc }
  - { pl: "przysługa", ru: "услуга, одолжение", relation: derived, id: przysluga }
  - { pl: "wyświadczać", ru: "оказывать", relation: aspect }
etymology: "Приставка WY- плюс ŚWIADCZYĆ, от ŚWIADEK «свидетель», праславянское *sъvědъkъ, от *věděti «знать»: свидетель — тот, кто знает. Русское «свидетель», «ведать» — то же гнездо."
memory: "Wyświadczyć przysługę — оказать услугу. Niedźwiedzia przysługa — медвежья услуга. Читается «высьвя́дчыць»."
idioms:
  - { pl: "wyświadczyć komuś niedźwiedzią przysługę", ru: "оказать кому-то медвежью услугу" }
formExamplesSkip:
  - { form: "wyświadczeni", reason: "людей не «оказывают»: формы для мужчин-людей нет" }
