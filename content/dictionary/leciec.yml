# review
id: leciec
format: 2
lemma: "lecieć"
rank: 419
pos: verb
aspect: imperf
pron: { cyr: "ле́чець" }
senses:
  - id: fly
    ru: "лететь"
    examples:
      - pl: "Ptak leci."
        ru: "Птица летит."
        source: { kind: tatoeba, id: 2668667 }
      - pl: "Nad miastem leci samolot."
        ru: "Над городом летит самолёт."
        source: { kind: tatoeba, id: 912639 }
      - pl: "Samolot leci wysoko na niebie."
        ru: "Самолёт летит высоко в небе."
        source: { kind: tatoeba, id: 2185970 }
  - id: rush
    ru: "лететь, бежать, спешить (разговорное)"
    examples:
      - pl: "Muszę lecieć."
        ru: "Мне надо бежать."
        source: { kind: translated, id: 7610591 }
      - pl: "Lata szybko lecą."
        ru: "Годы пролетают быстро."
        source: { kind: tatoeba, id: 2146655 }
      - pl: "Chłopaki, lecę."
        ru: "Ребята, я побежал."
        source: { kind: translated, id: 402652 }
notes:
  - { kind: usage, text: "Пара latać / lecieć работает как русская «летать / лететь»: latać о повторяющемся движении, lecieć — об одном направлении. Это та же система, что iść и chodzić." }
  - { kind: usage, text: "Разговорное Muszę lecieć значит «Мне надо бежать», а вовсе не «лететь». Так же Lecę! — «Бегу!»." }
  - { kind: usage, text: "О времени — как в русском: Lata szybko lecą «Годы быстро летят»." }
  - { kind: usage, text: "lecieć na kogoś — разговорное «западать на кого-то»: Wciąż lecisz na Toma?" }
collocations:
  - { pl: "muszę lecieć", ru: "мне надо бежать" }
  - { pl: "lecieć samolotem", ru: "лететь самолётом" }
  - { pl: "czas leci", ru: "время летит" }
  - { pl: "lecieć na kogoś", ru: "западать на кого-то" }
etymology: "Праславянское *letěti; русское «лететь» — то же самое слово."
memory: "lecieć — «лететь», но в разговоре чаще «бежать, спешить»: Muszę lecieć значит «Мне надо бежать». Пара latać / lecieć устроена как русская «летать / лететь» и как iść при chodzić."
idioms:
  - { pl: "lecieć na złamanie karku", ru: "лететь сломя голову" }
  - { pl: "muszę lecieć", ru: "мне надо бежать" }
  - { pl: "lecieć na kogoś", ru: "западать на кого-то" }
