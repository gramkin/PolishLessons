# review
id: wylacznie
format: 2
lemma: "wyłącznie"
rank: 2590
pos: adv
pron: { cyr: "выуо́нчне" }
senses:
  - id: exclusively
    ru: "исключительно, только"
    examples:
      - pl: "Płacimy wyłącznie gotówką."
        ru: "Мы платим исключительно наличными."
        source: { kind: authored }
      - pl: "Wstęp wyłącznie dla pracowników."
        ru: "Вход только для сотрудников."
        source: { kind: authored }
      - pl: "Zajmuje się wyłącznie przekładem poezji."
        ru: "Он занимается исключительно переводом поэзии."
        source: { kind: authored }
  - id: solely
    ru: "единственно, не иначе как"
    examples:
      - pl: "Zawdzięcza to wyłącznie sobie."
        ru: "Он обязан этим единственно себе."
        source: { kind: authored }
      - pl: "Stało się tak wyłącznie z jego winy."
        ru: "Так вышло исключительно по его вине."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "РУССКОЕ «ИСКЛЮЧИТЕЛЬНО» УМЕЕТ БОЛЬШЕ, ЧЕМ ПОЛЬСКОЕ WYŁĄCZNIE. У нас это слово работает и как усилитель: «исключительно умный» значит «очень умный». Польское wyłącznie так не умеет никогда — оно значит только «единственно, и ничего кроме». Фраза wyłącznie mądry прозвучала бы как «умный и больше никакой». Для усиления поляк возьмёт WYJĄTKOWO: wyjątkowo mądry «исключительно умный»." }
  - { kind: usage, text: "Ближайший синоним — TYLKO «только», и в живой речи чаще говорят именно так. WYŁĄCZNIE звучит официальнее и стоит в объявлениях и договорах: wstęp wyłącznie dla pracowników, płatność wyłącznie przelewem. Оттенок тот же, что между русскими «только» и «исключительно»." }
  - { kind: usage, text: "Словарь форм даёт степени сравнения WYŁĄCZNIEJ и NAJWYŁĄCZNIEJ, но это формы бумажные: «исключительнее» плохо вяжется со смыслом, который и так предельный. Препятствие тут не грамматическое, а смысловое, поэтому формы существуют, а в речи их почти не встретишь. То же самое было с szczególniejszy." }
collocations:
  - { pl: "wyłącznie dla", ru: "исключительно для" }
  - { pl: "wyłącznie i jedynie", ru: "исключительно и только" }
  - { pl: "niemal wyłącznie", ru: "почти исключительно" }
family:
  - { pl: "wyłączny", ru: "исключительный", relation: root }
  - { pl: "wyłączyć", ru: "выключить, исключить", relation: root, id: wylaczyc }
  - { pl: "tylko", ru: "только", relation: root, id: tylko }
etymology: "От wyłączny «исключительный», а то от wyłączyć «выключить, исключить», из łączyć «соединять». Логика видна насквозь: исключительное — это то, из чего всё прочее выключено. Русское «исключительно» собрано ровно так же, от «исключить», но у нас слово успело набрать значение усилителя, а у поляков осталось при исходном смысле."
memory: "wyłącznie значит только «единственно, и ничего кроме» — усилителем оно не бывает. «Исключительно умный» будет wyjątkowo mądry, а не «wyłącznie mądry»."
idioms:
  - { pl: "wyłącznie i jedynie", ru: "исключительно и только" }
  - { pl: "do użytku wyłącznie wewnętrznego", ru: "исключительно для внутреннего пользования" }
