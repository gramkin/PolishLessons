notes:
  - { kind: pronunciation, text: "КРАЯ ПАРАДИГМЫ ВЕДУТ СЕБЯ ОСОБО, и это правило уже встречалось. В первом лице единственного и в третьем множественного стоит szcz: oczyszczę, oczyszczą. Во всех клетках между ними — ść: oczyścisz, oczyści, oczyścimy, oczyścicie. Та же картина у piec: piekę, pieką, но pieczesz. Русский делает похожее в «чистить — чищу»." }
  - { kind: false-friend, text: "Слово разбирается по-русски без остатка: o- это «о-», czysty — «чистый», значит oczyścić — «очистить». Из того же гнезда czyścić «чистить», czystość «чистота», oczyszczalnia «очистные сооружения». Опираться на родной язык тут можно полностью." }
  - { kind: government, text: "Очищают ЧТО — винительный: oczyścić buty, ranę, wodę. А вот ОТ чего — предлог Z с родительным, а не «od»: oczyścić kogoś Z zarzutów, oczyścić wodę Z zanieczyszczeń. Русский говорит «очистить ОТ», и это единственное расхождение, которое тут стоит запомнить." }
  - { kind: usage, text: "Вид совершенный, несовершенная пара — oczyszczać. Страдательное причастие по правилу для -ić: oczyszczony, oczyszczeni. Оборот oczyścić atmosferę значит «разрядить обстановку» и употребляется в точности как русский." }
collocations:
  - { pl: "oczyścić z zarzutów", ru: "снять обвинения" }
  - { pl: "oczyścić atmosferę", ru: "разрядить обстановку" }
  - { pl: "oczyścić ranę", ru: "очистить рану" }
family:
  - { pl: "czysty", ru: "чистый", relation: root, id: czysty }
  - { pl: "czyścić", ru: "чистить", relation: root }
  - { pl: "oczyszczać", ru: "очищать", relation: aspect }
etymology: "Приставка o- плюс czyścić от czysty «чистый» — те же части, что в русском «о-чистить» от «чистого». Чередование ść со szcz в первом лице и третьем множественного — обычное для таких глаголов: czyścić даёт czyszczę. Отсюда oczyszczalnia «очистные сооружения» и oczyszczenie «очищение»."
memory: "oczyścić — «очистить», по частям как по-русски: o- плюс czysty «чистый». Запомните два момента: ОТ чего — через Z с родительным (oczyścić z zarzutów), и чередование на краях парадигмы: oczyszczę, oczyszczą, но oczyścisz."
idioms:
  - { pl: "oczyścić atmosferę", ru: "разрядить обстановку" }
  - { pl: "oczyścić się z zarzutów", ru: "снять с себя обвинения" }
