# review
id: ocalec
format: 2
lemma: "ocaleć"
rank: 5811
pos: verb
aspect: perf
pron: { cyr: "оца́лець" }
senses:
  - id: survive
    ru: "уцелеть, выжить, спастись"
    examples:
      - pl: "Z całej rodziny ocalał tylko dziadek."
        ru: "Из всей семьи уцелел только дедушка."
        source: { kind: authored }
      - pl: "Wszyscy pasażerowie autobusu ocaleli."
        ru: "Все пассажиры автобуса выжили."
        source: { kind: authored }
      - pl: "Ocalałam tylko dzięki sąsiadom."
        ru: "Я спаслась только благодаря соседям."
        source: { kind: authored }
  - id: remain
    ru: "уцелеть, сохраниться (о зданиях, вещах)"
    examples:
      - pl: "Z miasta ocalało tylko kilka domów."
        ru: "От города уцелело лишь несколько домов."
        source: { kind: authored }
      - pl: "Stare mury ocalały mimo bombardowań."
        ru: "Старые стены уцелели, несмотря на бомбардировки."
        source: { kind: authored }
      - pl: "Z wojny ocalała tylko jedna fotografia."
        ru: "После войны уцелела лишь одна фотография."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "OCALEĆ — «уцелеть, выжить» самому, без дополнения. Не путать с OCALIĆ — «спасти» кого-то или что-то: OCALIŁ DZIECKO «он спас ребёнка», но DZIECKO OCALAŁO «ребёнок уцелел». Корень тот же, что в русском «целый» и «уцелеть»." }
  - { kind: government, text: "Откуда уцелел — Z + родительный: OCALEĆ Z WOJNY, Z POŻARU, Z KATASTROFY. По-русски здесь «в» или «после»: «уцелеть в катастрофе», «пережить войну». Книжное OCALEĆ OD ZAGŁADY — «спастись от гибели»." }
  - { kind: usage, text: "Совершенный вид, непереходный. Будущее на -EJĘ: OCALEJĘ, OCALEJESZ, OCALEJĄ. В прошедшем A и E чередуются, как в MIAŁ — MIELI: OCALAŁ, OCALAŁA, но OCALELI. Субстантивированное OCALALI — «уцелевшие, выжившие»." }
  - { kind: pronunciation, text: "Читается «оца́лець», ударение на предпоследнем слоге. Ł в прошедшем — «у»: OCALAŁ — «оца́лау», OCALAŁA — «оцала́уа»." }
collocations:
  - { pl: "ocaleć z katastrofy", ru: "уцелеть в катастрофе" }
  - { pl: "ocaleć z wojny", ru: "пережить войну" }
  - { pl: "ocaleć od zagłady", ru: "спастись от гибели" }
family:
  - { pl: "ocalić", ru: "спасти", relation: root, id: ocalic }
  - { pl: "cały", ru: "целый", relation: root, id: caly }
  - { pl: "ocalały", ru: "уцелевший; выживший", relation: derived }
  - { pl: "ocalenie", ru: "спасение", relation: derived }
etymology: "От CAŁY «целый»: праславянское *cělěti «становиться целым». Русское «уцелеть» образовано от того же корня."
memory: "Ocaleć — остаться целым: cały → ocaleć, как «целый» → «уцелеть»."
idioms:
  - { pl: "cudem ocaleć", ru: "чудом уцелеть" }
formExamplesSkip:
  - { form: "ocalano", reason: "безличная форма на -no предполагает действующего человека, а ocaleć — невольное «уцелеть»; в живом языке ocalano читается как безличная форма от ocalać «спасать»" }
