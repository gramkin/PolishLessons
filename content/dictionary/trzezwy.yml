        source: { kind: authored }
      - pl: "Był najtrzeźwiejszy z całego towarzystwa."
        ru: "Он был самым трезвым во всей компании."
        source: { kind: authored }
  - id: sober-minded
    ru: "трезвый, здравый (о взгляде, оценке)"
    examples:
      - pl: "Potrzebujemy trzeźwej oceny sytuacji."
        ru: "Нам нужна трезвая оценка ситуации."
        source: { kind: authored }
      - pl: "Ma trzeźwe spojrzenie na świat."
        ru: "У него трезвый взгляд на мир."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Совпадение с русским «трезвый» полное, в обоих смыслах. Разница в звучании: польское TRZ даёт «тш», и выходит «тше́зьвы». TRZEŹWY UMYSŁ — «трезвый ум», ZACHOWAĆ TRZEŹWOŚĆ UMYSŁU — «сохранить ясность ума». Протрезветь — WYTRZEŹWIEĆ." }
  - { kind: usage, text: "Полная парадигма: TRZEŹWY, TRZEŹWIEJSZY, NAJTRZEŹWIEJSZY. Мужское-личное: TRZEŹWI, TRZEŹWIEJSI, NAJTRZEŹWIEJSI. Степени чаще в переносном смысле: TRZEŹWIEJSZE SPOJRZENIE, «более трезвый взгляд»." }
  - { kind: government, text: "Быть трезвым — BYĆ TRZEŹWYM, творительный, или BYĆ TRZEŹWY, именительный: оба правильны. Наречие TRZEŹWO — «трезво»: MYŚLEĆ TRZEŹWO, OCENIAĆ TRZEŹWO." }
  - { kind: pronunciation, text: "Читается «тше́зьвы», два слога, ударение на первом. TRZ — «тш», Ź — мягкое «зь», W после него — «в». В TRZEŹWIEJSZY: «тшезьве́йшы»." }
  - { kind: register, text: "Нейтральное слово. В законе TRZEŹWOŚĆ — обязательное условие за рулём, и KONTROLA TRZEŹWOŚCI, «проверка на алкоголь», — частая фраза в новостях. В переносном смысле — похвала здравомыслию." }
collocations:
  - { pl: "trzeźwy umysł", ru: "трезвый ум" }
  - { pl: "trzeźwa ocena", ru: "трезвая оценка" }
  - { pl: "kontrola trzeźwości", ru: "проверка на алкоголь" }
family:
  - { pl: "trzeźwość", ru: "трезвость", relation: derived }
  - { pl: "wytrzeźwieć", ru: "протрезветь", relation: derived }
  - { pl: "pijany", ru: "пьяный", relation: root, id: pijany }
etymology: "Общеславянское *trězvъ, того же, что русское «трезвый». Польское RZ на месте русского «р» перед мягкой гласной и Ź на месте «з» — обычные соответствия. Переносное «здравый» развилось в обоих языках одинаково."
memory: "Trzeźwy — трезвый: kierowca był trzeźwy; trzeźwa ocena. Trzeźwiejszy, najtrzeźwiejszy. Kontrola trzeźwości — проверка на алкоголь. Читается «тше́зьвы»."
idioms:
  - { pl: "zachować trzeźwość umysłu", ru: "сохранить ясность ума" }
