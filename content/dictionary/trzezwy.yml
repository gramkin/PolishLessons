# review
id: trzezwy
format: 2
lemma: "trzeźwy"
rank: 4163
pos: adj
pron: { cyr: "тше́зьвы" }
senses:
  - id: sober
    ru: "трезвый (не пьяный)"
    examples:
      - pl: "Kierowca był trzeźwy."
        ru: "Водитель был трезвым."
        source: { kind: authored }
      - pl: "Jest trzeźwy od pięciu lat."
