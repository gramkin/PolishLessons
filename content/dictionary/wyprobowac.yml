# review
id: wyprobowac
format: 2
lemma: "wypróbować"
rank: 4982
pos: verb
pron: { cyr: "выпрубо́ваць" }
senses:
  - id: try-out
    ru: "опробовать, испытать (вещь, способ)"
    examples:
      - pl: "Wypróbowałem nowy przepis na sernik."
        ru: "Я опробовал новый рецепт сырника."
        source: { kind: authored }
      - pl: "Chcę wypróbować ten samochód przed zakupem."
        ru: "Я хочу испытать эту машину перед покупкой."
        source: { kind: authored }
      - pl: "Wypróbuj ten krem, jest świetny."
        ru: "Попробуй этот крем, он отличный."
        source: { kind: authored }
  - id: test-person
    ru: "испытать, проверить (человека, его качества)"
    examples:
      - pl: "Los wypróbował jego cierpliwość."
        ru: "Судьба испытала его терпение."
        source: { kind: authored }
      - pl: "Wypróbowała jego lojalność drobnym kłamstwem."
        ru: "Она проверила его верность маленькой ложью."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "WYPRÓBOWAĆ — «опробовать, испытать», а не просто «попробовать». «Попробовать что-то сделать» — SPRÓBOWAĆ: SPRÓBUJĘ ZDĄŻYĆ. «Попробовать на вкус» — тоже SPRÓBOWAĆ. WYPRÓBOWAĆ — проверить вещь или способ в деле." }
  - { kind: usage, text: "Пятьдесят три формы. Страдательное WYPRÓBOWANY — частое прилагательное «проверенный»: WYPRÓBOWANY PRZYJACIEL, WYPRÓBOWANA METODA. Спряжение на -UJĘ: WYPRÓBUJĘ, WYPRÓBUJESZ. Несовершенный вид — WYPRÓBOWYWAĆ, редкий; чаще говорят TESTOWAĆ." }
  - { kind: government, text: "Что — винительный: WYPRÓBOWAĆ NOWY TELEFON. На ком или на чём — NA с предложным: WYPRÓBOWAĆ LEK NA MYSZACH. В деле — W с предложным: WYPRÓBOWAĆ W PRAKTYCE." }
  - { kind: pronunciation, text: "Читается «выпрубо́ваць»: Ó — «у», ударение на предпоследнем слоге BO. WYPRÓBUJĘ — «выпрубу́е», WYPRÓBUJ — «выпру́буй»." }
  - { kind: register, text: "Нейтральное слово, бытовое и рекламное: WYPRÓBUJ ZA DARMO — «попробуй бесплатно». WYPRÓBOWANY в значении «надёжный» — тёплое, одобрительное: STARY, WYPRÓBOWANY SPOSÓB." }
collocations:
  - { pl: "wypróbować nowy przepis", ru: "опробовать новый рецепт" }
  - { pl: "wypróbować w praktyce", ru: "проверить на практике" }
  - { pl: "wypróbowany przyjaciel", ru: "проверенный друг" }
family:
  - { pl: "próbować", ru: "пробовать", relation: root, id: probowac }
  - { pl: "spróbować", ru: "попробовать", relation: derived, id: sprobowac }
  - { pl: "próba", ru: "проба, попытка; репетиция", relation: derived, id: proba }
etymology: "Приставка WY- плюс PRÓBOWAĆ «пробовать», от PRÓBA, заимствованного через немецкий из латинского probare «проверять». Русское «проба», «пробовать» — из того же источника."
memory: "Wypróbować — опробовать: wypróbowałem nowy przepis. Spróbować — попробовать. Wypróbowany przyjaciel — проверенный друг. Читается «выпрубо́ваць»."
idioms:
  - { pl: "stary, wypróbowany sposób", ru: "старый проверенный способ" }
