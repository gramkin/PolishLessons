formExamples:
  - form: "znajdować"
    pl: "Pod gruzami zniszczonych domów mogły znajdować się tysiące ciał."
    ru: "Под развалинами разрушенных домов могли находиться тысячи тел."
    source: { kind: translated, id: 13514145 }
  - form: "znajdować"
    pl: "Klucze powinny znajdować się w szufladzie."
    ru: "Ключи должны находиться в ящике."
    source: { kind: authored }
  - form: "znajdować"
    pl: "Trudno znajdować błędy we własnym tekście."
    ru: "Трудно находить ошибки в собственном тексте."
    source: { kind: authored }
  - form: "znajdował"
    pl: "Hotel znajdował się blisko jeziora."
    ru: "Отель находился недалеко от озера."
    source: { kind: translated, id: 1113006 }
  - form: "znajdował"
    pl: "Znajdował się tam sklep z zegarkami."
    ru: "Там находился магазин часов."
    source: { kind: translated, id: 7998971 }
  - form: "znajdował"
    pl: "Za następnym budynkiem znajdował się magazyn na zboże."
    ru: "За следующим зданием находился зерновой склад."
    source: { kind: translated, id: 6320373 }
  - form: "znajdowałem"
    pl: "Gdy się obudziłem, znajdowałem się w pozycji leżącej na podłodze."
    ru: "Когда я проснулся, я находился на полу в лежачем положении."
    source: { kind: translated, id: 585569 }
  - form: "znajdowałem"
    pl: "Znajdowałem się wtedy daleko od domu."
    ru: "Я находился тогда далеко от дома."
    source: { kind: authored }
  - form: "znajdowałem"
    pl: "Zawsze znajdowałem czas na czytanie."
    ru: "Я всегда находил время на чтение."
    source: { kind: authored }
  - form: "znajdowało"
    pl: "Czy wszystko, co należało do niego, znajdowało się w tej skrzyni?"
    ru: "Всё, что ему принадлежало, находилось в этом сундуке?"
    source: { kind: translated, id: 2279737 }
  - form: "znajdowało"
    pl: "Miasto znajdowało się nad rzeką."
    ru: "Город находился на реке."
    source: { kind: authored }
  - form: "znajdowało"
    pl: "W pudełku znajdowało się tylko zdjęcie."
    ru: "В коробке находилась только фотография."
    source: { kind: authored }
  - form: "znajdowały"
    pl: "W furgonetce znajdowały się trzy osoby."
    ru: "В фургоне находились три человека."
    source: { kind: translated, id: 12454454 }
  - form: "znajdowały"
    pl: "Dokumenty znajdowały się w sejfie."
    ru: "Документы находились в сейфе."
    source: { kind: authored }
  - form: "znajdowały"
    pl: "Sklepy znajdowały się na parterze."
    ru: "Магазины находились на первом этаже."
    source: { kind: authored }
  - form: "znajdowanie"
    pl: "Znajdowanie dobrego kursu językowego w internecie jest jak znajdowanie przysłowiowej igły w stogu siana."
    ru: "Найти хороший языковой курс в интернете — всё равно что искать пресловутую иголку в стоге сена."
    source: { kind: translated, id: 10483315 }
  - form: "znajdowanie"
    pl: "Znajdowanie błędów to jego praca."
    ru: "Находить ошибки — его работа."
    source: { kind: authored }
  - form: "znajdowanie"
    pl: "Znajdowanie wymówek nic nie da."
    ru: "Поиск отговорок ничего не даст."
    source: { kind: authored }
  - form: "znajdują"
    pl: "Toalety znajdują się na parterze."
    ru: "Туалеты находятся на первом этаже."
    source: { kind: translated, id: 8111617 }
  - form: "znajdują"
    pl: "Drzwi wyjściowe znajdują się po prawej stronie."
    ru: "Выход находится справа."
    source: { kind: translated, id: 12109127 }
  - form: "znajdują"
    pl: "Niewolnicy znajdują siłę w religii."
    ru: "Рабы находят силу в религии."
    source: { kind: translated, id: 368841 }
  - form: "znajdując"
    pl: "Miałeś szczęście, znajdując to."
    ru: "Тебе повезло, что ты это нашёл."
    source: { kind: translated, id: 3046744 }
  - form: "znajdując"
    pl: "Znajdując wolną chwilę, dzwonił do matki."
    ru: "Находя свободную минуту, он звонил матери."
    source: { kind: authored }
  - form: "znajdując"
    pl: "Nie znajdując odpowiedzi, zamilkł."
    ru: "Не находя ответа, он замолчал."
    source: { kind: authored }
  - form: "znajdująca"
    pl: "Wisła to rzeka znajdująca się w Polsce."
    ru: "Висла — река, находящаяся в Польше."
    source: { kind: translated, id: 7914447 }
  - form: "znajdująca"
    pl: "Apteka znajdująca się obok jest otwarta."
    ru: "Аптека, находящаяся рядом, открыта."
    source: { kind: authored }
  - form: "znajdująca"
    pl: "Szkoła znajdująca się w centrum jest nowa."
    ru: "Школа, находящаяся в центре, новая."
    source: { kind: authored }
  - form: "znajdujące"
    pl: "Drobinki łyszczyku znajdujące się w kamieniu migotały w blasku słońca."
    ru: "Крупинки слюды, находившиеся в камне, поблёскивали на солнце."
    source: { kind: translated, id: 12469804 }
  - form: "znajdujące"
    pl: "Sklepy znajdujące się przy rynku są drogie."
