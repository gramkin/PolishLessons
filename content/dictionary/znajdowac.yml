# review
id: znajdowac
format: 2
lemma: "znajdować"
rank: 1056
pos: verb
aspect: imperf
aspectPair: znalezc
pron: { cyr: "знайдо́ваць" }
senses:
  - id: located
    ru: "znajdować się — находиться, располагаться"
    note: "Самое частое употребление глагола: почти всегда с się."
    examples:
      - pl: "Gdzie znajduje się Mińsk?"
        ru: "Где находится Минск?"
        source: { kind: tatoeba, id: 3660580 }
      - pl: "Ogród znajduje się za domem."
        ru: "Сад находится за домом."
        source: { kind: tatoeba, id: 4453827 }
      - pl: "Kościół znajduje się w centrum wsi."
        ru: "Церковь находится в центре деревни."
        source: { kind: tatoeba, id: 3683325 }
  - id: find
    ru: "находить (несовершенный вид)"
    examples:
      - pl: "Nie znajduję słów potępienia."
        ru: "Я не нахожу слов осуждения."
        source: { kind: translated, id: 619585 }
      - pl: "Ilekroć czytam tę książkę, znajduję coś nowego."
        ru: "Каждый раз, когда я читаю эту книгу, я нахожу что-то новое."
        source: { kind: translated, id: 956849 }
      - pl: "Nadal znajduję wiele błędów w zdaniach."
        ru: "Я до сих пор нахожу много ошибок в предложениях."
        source: { kind: translated, id: 13015323 }
  - id: muster
    ru: "находить (время, силы, слова)"
    examples:
      - pl: "Jak znajdujesz czas na ćwiczenie?"
        ru: "Как ты находишь время на занятия?"
        source: { kind: translated, id: 2900798 }
      - pl: "Niewolnicy znajdują siłę w religii."
        ru: "Рабы находят силу в религии."
        source: { kind: translated, id: 368841 }
notes:
  - { kind: usage, text: "Несовершенный вид к znaleźć «найти». Сами формы образуются от другой основы: znaleźć — znajdę, но znajdować — znajduję." }
  - { kind: usage, text: "znajdować się «находиться» — главный оборот: Gdzie znajduje się dworzec? «Где находится вокзал?». Без się глагол значит «находить»." }
  - { kind: usage, text: "В разговорной речи вместо znajdować się чаще говорят просто być: Gdzie jest dworzec? Оборот с znajdować się звучит официальнее." }
  - { kind: false-friend, text: "jak znajdujesz coś? значит «как тебе это?, как ты это находишь?» — оценка, а не поиск: Jak znajdujesz nową pracę?" }
collocations:
  - { pl: "znajdować się", ru: "находиться" }
  - { pl: "znajdować czas", ru: "находить время" }
  - { pl: "nie znajdować słów", ru: "не находить слов" }
family:
  - { pl: "znaleźć", ru: "найти", relation: aspect, id: znalezc }
  - { pl: "znajomy", ru: "знакомый", relation: derived, id: znajomy }
  - { pl: "wynajdować", ru: "изобретать, выискивать", relation: derived }
etymology: "Несовершенный вид к znaleźć, от праславянского *jьti «идти» с приставкой na-: буквально «на-йти». Русское «находить» собрано из тех же частей, только с приставкой «на-» и корнем «ход»."
memory: "znajdować — несовершенный вид к znaleźć «найти», но с другой основой: znajduję, znajdujesz. Главное употребление — znajdować się «находиться»: Gdzie znajduje się dworzec? В разговоре чаще скажут просто Gdzie jest dworzec?"
idioms:
  - { pl: "znajdować się", ru: "находиться" }
  - { pl: "nie znajdować słów", ru: "не находить слов" }
  - { pl: "znajdować czas", ru: "находить время" }
