# review
id: kilkakrotnie
format: 2
lemma: "kilkakrotnie"
rank: 2163
pos: adv
pron: { cyr: "килькакро́тне" }
senses:
  - id: several-times
    ru: "несколько раз, неоднократно"
    examples:
      - pl: "Powtórzyłem jej ten wyraz kilkakrotnie."
        ru: "Я повторил ей это слово несколько раз."
        source: { kind: tatoeba, id: 702873 }
      - pl: "Potrząsnąłem kilkakrotnie głową."
        ru: "Я несколько раз покачал головой."
        source: { kind: translated, id: 511506 }
      - pl: "Ostrzegłem go kilkakrotnie."
        ru: "Я предупреждал его несколько раз."
        source: { kind: translated, id: 12040547 }
  - id: repeatedly
    ru: "многократно"
    examples:
      - pl: "Sprawdzałem to kilkakrotnie."
        ru: "Я проверял это несколько раз."
        source: { kind: authored }
      - pl: "Kilkakrotnie próbowała zadzwonić."
        ru: "Она несколько раз пыталась позвонить."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Собрано из kilka «несколько» и -krotnie «-кратно»: буквально «несколькократно». Тот же ряд даёт dwukrotnie «дважды», trzykrotnie «трижды», wielokrotnie «многократно»." }
  - { kind: false-friend, text: "Русского «несколькократно» не существует, поэтому переводить приходится оборотом «несколько раз»." }
  - { kind: government, text: "Не изменяется." }
  - { kind: usage, text: "Прилагательное kilkakrotny «неоднократный»." }
collocations:
  - { pl: "kilkakrotnie powtórzyć", ru: "несколько раз повторить" }
etymology: "kilka «несколько» + -krotnie «-кратно», от krotny «кратный»; ср. русское «двукратно», «многократно»."
memory: "kilkakrotnie — «несколько раз». Ряд с -krotnie регулярен: dwukrotnie, trzykrotnie, wielokrotnie. Русского «несколькократно» нет, отсюда оборот."
idioms:
  - { pl: "kilkakrotnie powtórzyć", ru: "несколько раз повторить" }
