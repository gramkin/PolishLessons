  - { pl: "radość", ru: "радость", relation: antonym, id: radosc }
etymology: "Из праславянского *sъmǫtъkъ, от корня *mǫt- «мутить». Печаль понята здесь как помутнение ясности, и из того же корня выросли русские «смута», «смутный» и «мутить». Любопытно, что этот образ в польском повторяется: kłótnia тоже идёт от kłócić «мутить». Два разных расстройства, душевное и внешнее, названы одинаково — через замутнение прозрачного."
memory: "Род мужской: TEN smutek, в отличие от нашей женской «грусти». И smutny — это «грустный», а не «смутный»."
idioms:
