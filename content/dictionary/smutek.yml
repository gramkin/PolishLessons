notes:
  - { kind: usage, text: "Слово мужского рода: TEN smutek, wielki smutek, smutek minął. Русские «грусть» и «печаль» женские, и согласование по привычке сбивается на «ta smutek». Это та же ловушка, что у teza, только в обратную сторону. Проверять удобно по прилагательному: głęboki smutek, а не «głęboka»." }
  - { kind: false-friend, text: "Прилагательное от этого слова — SMUTNY, и означает оно «грустный», а вовсе не «смутный». Русское «смутный» по-польски будет NIEJASNY или MGLISTY. Слова эти всё-таки родня: оба выросли из корня «мутить», но польский пошёл к печали, а русский к неясности. Smutne wspomnienie — это грустное воспоминание, а не смутное." }
  - { kind: pronunciation, text: "Гласная e беглая: SMUTEK, но SMUTKU, smutkiem, smutki. Держится она только в именительном, где за ней нет окончания. Точно так же ведут себя czwartek — czwartku и dodatek — dodatku, так что все существительные на -ek теряют эту e, как только падеж даёт окончание." }
collocations:
  - { pl: "ogarnął go smutek", ru: "его охватила грусть" }
