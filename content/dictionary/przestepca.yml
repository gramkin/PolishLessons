# review
id: przestepca
format: 2
lemma: "przestępca"
rank: 1907
pos: noun
pron: { cyr: "пшэстэ́мпца" }
senses:
  - id: criminal
    ru: "преступник"
    examples:
      - pl: "Przestępca uciekł z więzienia."
        ru: "Преступник сбежал из тюрьмы."
        source: { kind: tatoeba, id: 3460184 }
      - pl: "Ten przestępca był znany policji."
        ru: "Этот преступник был известен полиции."
        source: { kind: translated, id: 12905090 }
      - pl: "Przestępca wtopił się w tłum i zniknął."
        ru: "Преступник растворился в толпе и исчез."
        source: { kind: translated, id: 13561630 }
      - pl: "Policjant zauważył, że przestępca ucieka."
        ru: "Полицейский заметил, что преступник убегает."
        source: { kind: translated, id: 951229 }
      - pl: "Zbiegły przestępca wciąż nie został schwytany."
        ru: "Сбежавший преступник до сих пор не пойман."
        source: { kind: translated, id: 840233 }
      - pl: "Nie jestem przestępcą."
        ru: "Я не преступник."
        source: { kind: translated, id: 8578818 }
  - id: criminals-plural
    ru: "преступники"
    examples:
      - pl: "Polica ujęła przestępców."
        ru: "Полиция задержала преступников."
        source: { kind: translated, id: 1056791 }
      - pl: "Przestępcy nie wypuścili zakładników."
        ru: "Преступники не отпустили заложников."
        source: { kind: translated, id: 357228 }
      - pl: "Ludzie domagali się ukarania tego przestępcy."
        ru: "Люди требовали наказания этого преступника."
        source: { kind: translated, id: 502021 }
notes:
  - { kind: usage, text: "Рядом с карточкой przestępstwo «преступление»: przestępca — человек, przestępstwo — деяние. Оба от przestąpić «преступить»." }
  - { kind: usage, text: "Мужское лицо на -ca склоняется по женскому образцу в единственном числе: przestępca, przestępcy, przestępcę — как mężczyzna." }
  - { kind: usage, text: "Рядом стоят карточки zbrodnia «тяжкое преступление», złodziej «вор» и morderca «убийца»." }
collocations:
  - { pl: "zbiegły przestępca", ru: "сбежавший преступник" }
  - { pl: "ująć przestępcę", ru: "задержать преступника" }
  - { pl: "młodociany przestępca", ru: "несовершеннолетний преступник" }
etymology: "От przestąpić «преступить, переступить», prze- + stąpić. Русское «преступник» собрано ровно так же: «пре-» плюс «ступить»."
memory: "przestępca — «преступник», człowiek; а przestępstwo — «преступление», деяние. В единственном числе склоняется по женскому образцу: przestępcy, przestępcę."
idioms:
  - { pl: "zbiegły przestępca", ru: "сбежавший преступник" }
  - { pl: "ująć przestępcę", ru: "задержать преступника" }
  - { pl: "młodociany przestępca", ru: "несовершеннолетний преступник" }
