# review
id: podobienstwo
format: 2
lemma: "podobieństwo"
rank: 5124
pos: noun
pron: { cyr: "подобе́ньстфо" }
senses:
  - id: resemblance
    ru: "сходство"
    examples:
      - pl: "Rodzinne podobieństwo widać od razu."
        ru: "Семейное сходство видно сразу."
        source: { kind: authored }
      - pl: "Uderzyło mnie podobieństwo tych dwóch twarzy."
        ru: "Меня поразило сходство этих двух лиц."
        source: { kind: authored }
      - pl: "Podobieństwo do oryginału jest niewielkie."
        ru: "Сходство с оригиналом невелико."
        source: { kind: authored }
  - id: likeness
    ru: "подобие, образ"
    examples:
      - pl: "Bóg stworzył człowieka na swój obraz i podobieństwo."
        ru: "Бог создал человека по образу и подобию своему."
        source: { kind: authored }
      - pl: "Zbudował dom na podobieństwo starego dworu."
        ru: "Он построил дом по образцу старой усадьбы."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "PODOBIEŃSTWO — обычное «сходство», а не только книжное «подобие». Корень тот же, что в PODOBNY «похожий» и PODOBAĆ SIĘ «нравиться»: MI SIĘ PODOBA — «мне нравится». Русскому кажется, что это о подобии, а поляк слышит «похожесть»." }
  - { kind: usage, text: "Девять форм, средний род на -STWO. Родительный множественного — PODOBIEŃSTW, без окончания. Часто во множественном: PODOBIEŃSTWA I RÓŻNICE, «сходства и различия»." }
  - { kind: government, text: "Сходство с кем-то — PODOBIEŃSTWO DO KOGOŚ, DO с родительным, там где в русском «с»: PODOBIEŃSTWO DO OJCA. Сходство между — PODOBIEŃSTWO MIĘDZY X A Y. По подобию — NA PODOBIEŃSTWO, NA с винительным." }
  - { kind: pronunciation, text: "Читается «подобе́ньстфо», ударение на предпоследнем слоге. BIE — «бе», Ń перед S — «нь», W после T оглушается в «ф», как в TOWARZYSTWO «товажы́стфо»." }
  - { kind: register, text: "Слово нейтральное. Из титров фильмов знакома формула: WSZELKIE PODOBIEŃSTWO DO RZECZYWISTYCH OSÓB JEST PRZYPADKOWE." }
collocations:
  - { pl: "uderzające podobieństwo", ru: "поразительное сходство" }
  - { pl: "podobieństwo do ojca", ru: "сходство с отцом" }
  - { pl: "na obraz i podobieństwo", ru: "по образу и подобию" }
family:
  - { pl: "podobny", ru: "похожий", relation: root, id: podobny }
  - { pl: "podobać się", ru: "нравиться", relation: root, id: podobac }
  - { pl: "podobnie", ru: "похоже, так же", relation: root, id: podobnie }
etymology: "От PODOBNY «похожий» с суффиксом -IEŃSTWO. В основе старое DOBA «подходящая пора, мера», что и в русских «подобать», «удобный»: похожее — то, что подходит под ту же мерку."
memory: "Podobieństwo — сходство; podobny — похожий; podoba mi się — мне нравится. Читается «подобе́ньстфо». Podobieństwo do ojca — сходство с отцом."
idioms:
  - { pl: "wszelkie podobieństwo jest przypadkowe", ru: "любое сходство случайно" }
