# review
id: czyz
format: 2
lemma: "czyż"
rank: 866
pos: part
pron: { cyr: "чыш" }
senses:
  - id: rhetorical
    ru: "разве, неужели (в риторическом вопросе)"
    examples:
      - pl: "Wiesz coś o tym, czyż nie?"
        ru: "Ты что-то об этом знаешь, да?"
        source: { kind: tatoeba, id: 3607091 }
      - pl: "Czyż nie mam racji?"
        ru: "Разве я не прав?"
        source: { kind: translated, id: 357756 }
      - pl: "Czyż nie są cudowni?"
        ru: "Разве они не чудесны?"
        source: { kind: translated, id: 3664661 }
  - id: tag
    ru: "czyż nie? — не так ли?, правда же?"
    examples:
      - pl: "Czyż nie?"
        ru: "Разве нет?"
        source: { kind: translated, id: 6926402 }
      - pl: "Piękny dzień, czyż nie?"
        ru: "Прекрасный день, не правда ли?"
        source: { kind: authored }
      - pl: "Czyż to nie oczywiste?"
        ru: "Разве это не очевидно?"
        source: { kind: authored }
notes:
  - { kind: usage, text: "czyż — усиленный вариант вопросительной частицы czy. Обычный вопрос начинается с czy, а czyż добавляет риторический оттенок: Czy masz rację? «Ты прав?» — Czyż nie mam racji? «Разве я не прав?»." }
  - { kind: usage, text: "Почти всегда встречается вместе с отрицанием: czyż nie… Именно это сочетание отвечает русскому «разве не…»." }
  - { kind: register, text: "Слово книжное и слегка приподнятое. В обиходной речи скажут просто czy nie? или prawda?." }
  - { kind: false-friend, text: "Существительное czyż «чиж» (птица) пишется так же, но в живом языке почти не встречается: в корпусе все примеры до единого относятся к частице." }
collocations:
  - { pl: "czyż nie?", ru: "не так ли?" }
  - { pl: "czyż nie mam racji?", ru: "разве я не прав?" }
  - { pl: "czyż to nie oczywiste?", ru: "разве это не очевидно?" }
family:
  - { pl: "czy", ru: "ли, разве", relation: root }
etymology: "Из частицы czy с усилительной частицей -ż, той же, что в cóż и któż. Приём тот же, что в русском «разве» против «ли»."
memory: "czyż — это czy с усилением: не просто вопрос, а риторический. Почти всегда идёт с отрицанием: Czyż nie mam racji? «Разве я не прав?». Слово книжное, в разговоре скажут czy nie? или prawda?. И не путайте с птицей czyż «чиж» — она пишется так же, но встречается несравнимо реже."
idioms:
