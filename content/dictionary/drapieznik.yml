# review
id: drapieznik
format: 2
lemma: "drapieżnik"
rank: 6081
pos: noun
pron: { cyr: "драпье́жник" }
senses:
  - id: predator
    ru: "хищник (зверь, птица, рыба, которые охотятся на других животных)"
    examples:
      - pl: "Wilk jest drapieżnikiem."
        ru: "Волк — хищник."
        source: { kind: translated, id: 6156369 }
      - pl: "Lis to drapieżnik, który poluje głównie nocą."
        ru: "Лиса — хищник, который охотится в основном ночью."
        source: { kind: authored }
      - pl: "Duże drapieżniki potrzebują rozległych terytoriów."
        ru: "Крупным хищникам нужны обширные территории."
        source: { kind: authored }
  - id: ruthless
    ru: "(перен.) хищник — безжалостный человек или фирма, наживающиеся на слабых"
    examples:
      - pl: "Ten bankier to prawdziwy drapieżnik."
        ru: "Этот банкир — настоящий хищник."
        source: { kind: authored }
      - pl: "Ta firma to drapieżnik, który pożera mniejszych konkurentów."
        ru: "Эта фирма — хищник, пожирающий более мелких конкурентов."
        source: { kind: authored }
      - pl: "W polityce był bezwzględnym drapieżnikiem."
        ru: "В политике он был безжалостным хищником."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Одушевлённое существительное мужского рода: винительный единственного совпадает с родительным — zobaczyć drapieżnika «увидеть хищника». Во множественном числе это животное, а не лицо, поэтому DRAPIEŻNIKI, и винительный совпадает с именительным: obserwować drapieżniki «наблюдать хищников»." }
  - { kind: usage, text: "Прилагательное — DRAPIEŻNY «хищный»: zwierzę drapieżne, ptak drapieżny «хищная птица», ryba drapieżna. Переносно — «агрессивный, хищнический»: drapieżny kapitalizm, drapieżny uśmiech." }
  - { kind: government, text: "Охотиться на кого — POLOWAĆ NA + винительный: drapieżnik poluje na zające. Стать жертвой хищника — PAŚĆ OFIARĄ (или ŁUPEM) DRAPIEŻNIKA, с родительным. Защищаться от хищника — BRONIĆ SIĘ PRZED DRAPIEŻNIKIEM, с творительным." }
  - { kind: pronunciation, text: "«драпье́жник», ударение на предпоследнем слоге, -pie-. Ż всегда твёрдое, поэтому -żnik — «жник», без смягчения «ж». В формах с окончанием ударение сдвигается: drapieżnika — «драпьежни́ка», drapieżników — «драпьежни́куф»." }
collocations:
  - { pl: "duży drapieżnik", ru: "крупный хищник" }
  - { pl: "drapieżnik morski", ru: "морской хищник" }
