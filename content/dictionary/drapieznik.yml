family:
  - { pl: "drapieżny", ru: "хищный", relation: derived }
  - { pl: "drapieżność", ru: "хищность, хищнический нрав", relation: derived }
  - { pl: "drapać", ru: "царапать, чесать", relation: root }
  - { pl: "roślinożerca", ru: "травоядное животное", relation: antonym }
  - { pl: "ofiara", ru: "жертва", relation: antonym, id: ofiara }
etymology: "От прилагательного DRAPIEŻNY «хищный», а то — от старопольского DRAPIEŻ «грабёж, добыча», родственного глаголу DRAPAĆ «царапать, драть». Хищник буквально — тот, кто «дерёт» добычу; ср. русское «драть»."
memory: "DRAPIEŻNIK DRAPIE — хищник дерёт когтями: drapać — «царапать, драть». Кто дерёт добычу, тот и drapieżnik."
idioms:
  - { pl: "drapieżnik szczytowy", ru: "высший хищник (на вершине пищевой цепи)" }
  - { pl: "drapieżny kapitalizm", ru: "хищнический капитализм" }
