etymology: "Из праславянского *doba «подходящее время, пора», от корня *dob- «годиться, быть впору». Русский потерял само существительное, но корень в нём жив и очень частый: «удобный» — то, что впору, «подобный» — подходящий под образец, «надобно» — нужно, «способ» того же гнезда. Польский сохранил и существительное, и производные: PODOBNY «похожий», DOGODNY «удобный», SPOSÓB «способ». Поэтому слово не узнаётся на слух, хотя его корень русскоязычный знает прекрасно — он просто никогда не встречал его отдельно. Значение «сутки» развилось из «отрезка времени»: сначала любая пора, затем определённый круг времени, и наконец ровно двадцать четыре часа. Старое широкое значение осталось в обороте W DOBIE «в эпоху»."
memory: "Русского существительного «доба» нет, но корень знаком: он в «удобный, подобный, надобно» — праслав. *doba «подходящая пора». Значит «сутки», и считается в единственном числе: trzy doby = «трое суток», где русский обязан взять собирательное числительное. Второе значение книжное: w dobie internetu «в эпоху интернета». Родительный множественного dób с o→ó, читается «дуп». Норма расхода — na dobę, длительность — przez całą dobę."
