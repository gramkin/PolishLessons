notes:
  - { kind: false-friend, text: "В русском такого существительного нет вовсе: «доба» есть в украинском и белорусском, а русский говорит «сутки». Отсюда главная трудность — не смысл, а счёт. Русские «сутки» существуют только во множественном, и потому требуют собирательных числительных: «трое суток», «пятеро суток». Польская DOBA — обычное исчисляемое слово в единственном числе: JEDNA DOBA, TRZY DOBY, PIĘĆ DÓB. Поэтому TRZY DOBY переводится как «трое суток», а не «три сутки», и обратный перевод с русского требует перестройки всей числовой группы. Второе значение, «эпоха», русский передаёт совсем другим словом, и догадаться о нём нельзя." }
  - { kind: usage, text: "Десять форм, женский род. Родительный единственного и именительный множественного — одна форма DOBY. Дательный и местный единственного — DOBIE, и в местном с предлогом W эта форма чаще всего означает «в эпоху»: W DOBIE INTERNETU. Родительный множественного — DÓB, с удлинением O в Ó перед нулевым окончанием, как WDÓW и GŁÓW. Для обозначения нормы и расхода употребляется винительный с NA: DWA LITRY NA DOBĘ «два литра в сутки», а для длительности — PRZEZ CAŁĄ DOBĘ. Творительный множественного DOBAMI работает как наречие «сутками»." }
  - { kind: pronunciation, text: "Читается «до́ба», два слога, ударение на первом. Согласные твёрдые, никаких смягчений в основной форме нет. В форме DOBIE буквосочетание BIE даёт мягкое «бе»: «до́бе». В форме DOBĄ последнее Ą звучит «он»: «до́бон». Самая коварная форма — DÓB: Ó читается как «у», а конечное B оглушается в «п», и получается «дуп» — на слух ничего общего с исходным словом. Та же пара превращений работает в WDÓW, которое звучит «вдуф»." }
  - { kind: register, text: "В значении «сутки» слово нейтральное и повседневное: оно стоит в расписаниях, в счетах, в медицинских картах. Устойчивое DOBA HOTELOWA означает расчётные сутки в гостинице и встречается в любом польском отеле, поэтому приезжему его стоит узнавать. Оборот W DOBIE CZEGOŚ в значении «в эпоху» — книжный и публицистический, частый в заголовках. Наречное DOBAMI «сутками» разговорное и выразительное: SIEDZIAŁ TAM DOBAMI. Звательная форма DOBO в живой речи не встречается и возможна лишь в стихотворном обращении." }
