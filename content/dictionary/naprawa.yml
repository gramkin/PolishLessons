etymology: "Отглагольное существительное от NAPRAWIĆ, то есть NA- плюс PRAWY в праславянском значении *pravъ «прямой, правильный». Исходный смысл — «сделать снова правильным», и русский строит то же самое другими приставками: «исправить», «поправить», «направить». Именно поэтому слово так обманчиво звучит: корень общий с «правым» и «правдой», а значение ушло к починке. Та же логика в немецком RICHTIG и RICHTEN. Русское «ремонт» — позднее заимствование из французского REMONTER, и польский взял его тоже, но закрепил за домами и зданиями, оставив NAPRAWA вещам и механизмам. Так два языка разделили одно поле по-разному: русский по стилю, польский по предмету."
memory: "Слуховая ловушка: слышится «направо», значит «ремонт». «Направо» это na prawo, раздельно. Корень тот же, что в «правый, правда», но в смысле «правильный»: naprawić — «сделать снова правильным», как русское «исправить». Важное разделение: naprawa о вещи и механизме, remont о доме и квартире. Падеж: dative и locative naprawie с мягким w, родительный множественного napraw. На вывесках: naprawa obuwia."
