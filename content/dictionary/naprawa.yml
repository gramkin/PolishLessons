notes:
  - { kind: false-friend, text: "Ловушка здесь слуховая. Русскому слышится «направо», и это сбивает с толку: NAPRAWA значит «ремонт», а «направо» по-польски NA PRAWO, раздельно, или W PRAWO. Корень у польского слова действительно PRAWY, но в старом смысле «правильный», а не «правая сторона»: NAPRAWIĆ значит буквально «сделать снова правильным». Второе различие: русский «ремонт» в применении к дому и квартире по-польски будет REMONT, а NAPRAWA — о вещи, механизме, обуви, отношениях. Сказать NAPRAWA MIESZKANIA вместо REMONT MIESZKANIA — заметная ошибка." }
  - { kind: usage, text: "Десять форм, женский род. Основа на -W мягкая перед -E, и потому дательный и местный единственного — NAPRAWIE, с мягким W: PO NAPRAWIE, O NAPRAWIE. Родительный множественного — NAPRAW, с нулевым окончанием. Управление: NAPRAWA CZEGO в родительном — NAPRAWA DACHU, NAPRAWA BŁĘDU; а вещь отдают DO NAPRAWY, то есть в родительном с предлогом DO. Устойчивое W NAPRAWIE значит «в ремонте»: WINDA JEST W NAPRAWIE. Парный глагол — NAPRAWIAĆ и NAPRAWIĆ, и существительное образовано от совершенного." }
  - { kind: pronunciation, text: "Читается «напра́ва», три слога, ударение на втором, как в русском «направо» без последнего слога. Буква R твёрдая и раскатистая; сочетания RZ здесь нет, поэтому никакого «ж» не возникает — это важно, ведь похожее NAPRZÓD читается «напшу́т». В форме NAPRAWIE буквосочетание WIE даёт «ве» с мягким W: «напра́ве». В форме NAPRAWĄ последнее Ą звучит «он»: «напра́вон». В форме NAPRAW конечное W оглушается в «ф»: «напра́ф»." }
  - { kind: register, text: "Слово нейтральное и повседневное — на вывесках мастерских стоит NAPRAWA OBUWIA, NAPRAWA ROWERÓW, NAPRAWA TELEFONÓW. В переносном значении оно книжное и чаще публицистическое: NAPRAWA PAŃSTWA, NAPRAWA FINANSÓW — об исправлении положения, и в этом смысле слово несёт оттенок программы реформ. Звательная форма NAPRAWO в обычной речи не употребляется и возможна разве что в шутке. Уменьшительных слово не образует; близкое NAPRAWKA значит мелкую починку, а в школьном жаргоне — переэкзаменовку на осень." }
