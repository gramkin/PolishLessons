# review
id: autor
format: 2
lemma: "autor"
rank: 3988
pos: noun
pron: { cyr: "а́утор" }
senses:
  - id: author
    ru: "автор"
    examples:
      - pl: "Autor książki przyjechał na festiwal."
        ru: "Автор книги приехал на фестиваль."
        source: { kind: authored }
      - pl: "Jest autorem trzech powieści."
        ru: "Он автор трёх романов."
        source: { kind: authored }
      - pl: "Autor zdjęcia zdobył nagrodę."
        ru: "Автор фотографии получил премию."
        source: { kind: authored }
      - pl: "Autor podpisał mi egzemplarz."
        ru: "Автор подписал мне экземпляр."
        source: { kind: authored }
      - pl: "Prawa autora chroni ustawa."
        ru: "Права автора защищает закон."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "AUTOR — «автор», но читается «а́утор»: AU — это «ау», а не «ав». Так же AUTO «машина» — «а́уто». Женщина — AUTORKA. Авторские права — PRAWA AUTORSKIE." }
  - { kind: usage, text: "Десять форм, мужской род, лицо. Во множественном R переходит в RZ: AUTORZY. В местном тоже: O AUTORZE." }
  - { kind: government, text: "Автор чего — родительный: AUTOR KSIĄŻKI, AUTOR POMYSŁU. Быть автором — BYĆ AUTOREM, творительный. Встреча с автором — SPOTKANIE Z AUTOREM." }
  - { kind: pronunciation, text: "Читается «а́утор», ударение на первом слоге. AU — один слог «ау»." }
collocations:
  - { pl: "autor książki", ru: "автор книги" }
  - { pl: "spotkanie z autorem", ru: "встреча с автором" }
  - { pl: "prawa autorskie", ru: "авторские права" }
family:
  - { pl: "autorka", ru: "автор (о женщине)", relation: derived }
  - { pl: "autorski", ru: "авторский", relation: derived }
  - { pl: "autorstwo", ru: "авторство", relation: derived }
etymology: "Из латинского слова со значением «творец, зачинатель». Польский читает латинское AU как «ау», а русский — как «ав»."
memory: "Autor — автор, читается «а́утор». Autorzy — авторы. Prawa autorskie — авторские права. Mieć coś na koncie — иметь на счету."
idioms:
  - { pl: "mieć coś na koncie", ru: "иметь что-то на счету" }
