# review
id: smieszny
format: 2
lemma: "śmieszny"
rank: 920
pos: adj
pron: { cyr: "шме́шны" }
senses:
  - id: funny
    ru: "смешной, забавный"
    examples:
      - pl: "Śmieszne!"
        ru: "Смешно!"
        source: { kind: tatoeba, id: 1351896 }
      - pl: "To nie jest śmieszne."
        ru: "Это не смешно."
        source: { kind: tatoeba, id: 6328162 }
      - pl: "Opowiedział śmieszną historię."
        ru: "Он рассказал смешную историю."
        source: { kind: translated, id: 3398908 }
  - id: ridiculous
    ru: "смешной, нелепый (о человеке)"
    note: "О человеке слово чаще значит «нелепый», а не «весёлый»."
    examples:
      - pl: "Jesteś śmieszny."
        ru: "Ты смешон."
        source: { kind: translated, id: 5665353 }
      - pl: "Był Tom śmieszny?"
        ru: "Том был смешон?"
        source: { kind: translated, id: 8772654 }
      - pl: "W nim nie ma nic śmiesznego."
        ru: "В нём нет ничего смешного."
        source: { kind: translated, id: 440656 }
  - id: laughable
    ru: "śmieszne pieniądze — смешные деньги"
    examples:
      - pl: "Chcę wiedzieć co jest takiego śmiesznego."
        ru: "Хочу знать, что тут такого смешного."
        source: { kind: translated, id: 7868619 }
      - pl: "Jego opowieść była taka śmieszna, że wszyscy nie mogli się nie uśmiechać."
        ru: "Его рассказ был такой смешной, что все не могли не улыбаться."
        source: { kind: translated, id: 13423680 }
      - pl: "Zarabia śmieszne pieniądze."
        ru: "Он зарабатывает смешные деньги."
        source: { kind: authored }
notes:
  - { kind: usage, text: "О шутке или истории слово значит «смешной, забавный»: śmieszna historia. О человеке оно чаще значит «нелепый, жалкий»: Jesteś śmieszny «Ты смешон» — это упрёк, а не похвала. Русское «смешной» ведёт себя так же." }
  - { kind: usage, text: "Śmieszne! в ответ значит «Смешно!» — часто с иронией, как и To nie jest śmieszne «Это не смешно»." }
  - { kind: usage, text: "śmieszne pieniądze — «смешные деньги», то есть ничтожная сумма. Оборот совпадает с русским." }
  - { kind: usage, text: "Гнездо прозрачно: śmiać się «смеяться», śmiech «смех», rozśmieszyć «рассмешить». Всё совпадает с русским." }
collocations:
  - { pl: "śmieszna historia", ru: "смешная история" }
  - { pl: "to nie jest śmieszne", ru: "это не смешно" }
  - { pl: "śmieszne pieniądze", ru: "смешные деньги" }
  - { pl: "nic śmiesznego", ru: "ничего смешного" }
family:
  - { pl: "śmiać się", ru: "смеяться", relation: root }
  - { pl: "śmiech", ru: "смех", relation: root }
  - { pl: "rozśmieszyć", ru: "рассмешить", relation: derived }
etymology: "От śmiać się «смеяться», праславянское *smijati sę. Русское «смешной» — то же слово и тот же корень, что в «смех»."
memory: "śmieszny — «смешной», но с той же двойственностью, что в русском: о шутке это «забавный», а о человеке чаще «нелепый». Jesteś śmieszny — упрёк, а не похвала. Запомните śmieszne pieniądze «смешные деньги» и реплику Śmieszne!"
idioms:
  - { pl: "śmieszna historia", ru: "смешная история" }
  - { pl: "to nie jest śmieszne", ru: "это не смешно" }
  - { pl: "śmieszne pieniądze", ru: "смешные деньги" }
