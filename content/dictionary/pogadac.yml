# review
id: pogadac
format: 2
lemma: "pogadać"
rank: 499
pos: verb
aspect: perf
aspectPair: gadac
pron: { cyr: "пога́даць" }
senses:
  - id: talk
    ru: "поговорить, побеседовать"
    examples:
      - pl: "Masz chwilę, żeby pogadać?"
        ru: "У тебя есть минутка поговорить?"
        source: { kind: tatoeba, id: 12567470 }
      - pl: "Wróciłem, żeby pogadać z tobą."
        ru: "Я вернулся, чтобы поболтать с тобой."
        source: { kind: tatoeba, id: 6017155 }
      - pl: "Posłuchaj mojej rady i pogadaj z nią."
        ru: "Послушай моего совета и поговори с ней."
        source: { kind: translated, id: 3705086 }
  - id: chat
    ru: "поболтать (разговорное)"
    examples:
      - pl: "Pogadałem z Aki o ciuchach."
        ru: "Я поболтал с Аки о шмотках."
        source: { kind: tatoeba, id: 999164 }
      - pl: "W drodze do domu spotkałem Naomi i pogadaliśmy sobie."
        ru: "По дороге домой я встретил Наоми, и мы поболтали."
        source: { kind: translated, id: 530461 }
      - pl: "Może pogadamy przy herbacie?"
        ru: "Может, поболтаем за чаем?"
        source: { kind: translated, id: 957568 }
notes:
  - { kind: false-friend, text: "Внутри сидит gadać, и это ложный друг: польское gadać значит «болтать, говорить», а не «гадать»." }
  - { kind: usage, text: "Приставка po- даёт значение «немного, некоторое время», ровно как в русском «поговорить, поболтать»." }
  - { kind: usage, text: "Говорят z kimś — с творительным падежом: pogadać z nią «поговорить с ней», pogadać z Tomem." }
  - { kind: usage, text: "Слово разговорное. Нейтральный вариант — porozmawiać: на работе скорее скажут Możemy porozmawiać?" }
collocations:
  - { pl: "pogadać z kimś", ru: "поговорить с кем-то" }
  - { pl: "masz chwilę, żeby pogadać?", ru: "есть минутка поговорить?" }
  - { pl: "pogadajmy o tym", ru: "поговорим об этом" }
  - { pl: "mieć do pogadania", ru: "иметь о чём поговорить" }
etymology: "Из po- + gadać, праславянское *gadati «говорить, предполагать». Русское «гадать» того же корня, но значения разошлись: польское gadać — «болтать»."
memory: "pogadać — «поболтать, поговорить», разговорный вариант от porozmawiać. Приставка po- значит «немного, некоторое время», ровно как в русском «поговорить». Внутри сидит gadać, и это ложный друг: по-польски это «болтать», а не «гадать». Говорят z kimś, творительным: Pogadajmy o tym «Поговорим об этом»."
idioms:
  - { pl: "masz chwilę, żeby pogadać?", ru: "есть минутка поговорить?" }
  - { pl: "mamy sporo do pogadania", ru: "нам есть о чём поговорить" }
  - { pl: "pogadajmy o tym", ru: "поговорим об этом" }
