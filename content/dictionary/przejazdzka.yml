etymology: "От PRZEJAŻDŻAĆ SIĘ «кататься», многократной формы к PRZEJECHAĆ SIĘ, от JECHAĆ, из праславянского *jexati, того же корня, что русское «ехать». Приставка PRZE- отвечает русской «про-» и «пере-», а суффикс -KA образует название действия. Группа ŻDŻ возникла на стыке корня и многократного суффикса: там, где в JECHAĆ стоит CH, в многократной форме появляется ŻDŻ, и то же чередование видно в WOZIĆ рядом с WIEŹĆ. Русский для такого катания пользуется описательными оборотами или словом «прогулка», построенным совсем иначе, от «гулять». Поэтому опоры в родном языке у слова нет, и запоминать стоит вместе с глаголом PRZEJECHAĆ SIĘ, где возвратное SIĘ меняет смысл с «проехать» на «прокатиться»."
memory: "Польский различает то, что русский не различает: przejażdżka — катание для удовольствия (łodzią, konna), а деловая или дальняя поездка — podróż или wyjazd. На чём катаются — творительный без предлога: przejażdżka łodzią. Написание трудное: группа żdż из двух знаков, и перед глухим k она оглушается целиком. Дательный и местный przejażdżce с k→c, родительный множественного przejażdżek с беглой e."
idioms:
