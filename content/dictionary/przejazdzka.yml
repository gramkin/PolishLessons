notes:
  - { kind: false-friend, text: "Русское «поездка» покрывает и деловую дорогу, и прогулку, а польский различает. PRZEJAŻDŻKA — это катание для удовольствия, недолгое и без цели: PRZEJAŻDŻKA ŁODZIĄ «прогулка на лодке», PRZEJAŻDŻKA KONNA «конная прогулка». Деловая или дальняя поездка называется PODRÓŻ или WYJAZD: PODRÓŻ SŁUŻBOWA «служебная поездка». Сказать PRZEJAŻDŻKA о командировке нельзя. Слово образовано от PRZEJECHAĆ SIĘ «прокатиться», и возвратное SIĘ здесь существенно: PRZEJECHAĆ без него значит «переехать, проехать», в том числе задавить." }
  - { kind: usage, text: "В дательном и местном падеже единственного числа K переходит в C: PRZEJAŻDŻCE, как MATKA даёт MATCE. В родительном множественного появляется беглая гласная E: PRZEJAŻDŻEK. Оба хода стандартны для основ на -KA. Трудность слова не в склонении, а в написании: группа ŻDŻ состоит из двух разных знаков для близких звуков, Ż и DŻ, и перепутать их легко. Запомнить помогает исходный глагол JECHAĆ и приставочное PRZEJAŻDŻAĆ SIĘ, где та же группа стоит на том же месте." }
  - { kind: government, text: "Женский род. На чём прогулка — творительный без предлога: PRZEJAŻDŻKA ŁODZIĄ, PRZEJAŻDŻKA SAMOCHODEM, PRZEJAŻDŻKA ROWEREM. Это то же управление, что в русском «поездка на лодке», только по-польски без предлога. Где — предлог PO с местным: PRZEJAŻDŻKA PO MIEŚCIE «поездка по городу». Частотные глаголы: WYBRAĆ SIĘ NA PRZEJAŻDŻKĘ «отправиться на прогулку», ZAPROSIĆ NA PRZEJAŻDŻKĘ. Прилагательных от слова нет, и признак выражается существительным в творительном или прилагательным вида KONNA, ROWEROWA." }
  - { kind: pronunciation, text: "Читается «пшея́жджка», три слога, ударение на предпоследнем. Начальное PRZ звучит глухо, «пш». Группа ŻDŻ перед глухим K оглушается целиком, так что в беглой речи слышно скорее «штч», чем «ждж»: произносить её надо одним движением, не разделяя. Конечное -KA это «ка». В родительном множественного PRZEJAŻDŻEK появляется гласная, и звонкость частично возвращается: «пшея́жджэк». В дательном PRZEJAŻDŻCE снова оглушение перед C." }
