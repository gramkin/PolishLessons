formExamples:
  - form: "nadają"
    pl: "Te buty nie nadają się do biegania."
    ru: "Эти туфли не годятся для бега."
    source: { kind: translated, id: 742552 }
  - form: "nadają"
    pl: "Jakie zwierzęta najbardziej nadają się na zwierzątka dla dzieci?"
    ru: "Какие животные лучше всего подходят в питомцы для детей?"
    source: { kind: translated, id: 3334602 }
  - form: "nadają"
    pl: "Te deski nadają się na półki."
    ru: "Эти доски годятся для полок."
    source: { kind: authored }
  - form: "nadaje"
    pl: "Czy to się nadaje?"
    ru: "Это годится?"
    source: { kind: translated, id: 8739377 }
  - form: "nadaje"
    pl: "On nadaje się do tej pracy."
    ru: "Он подходит для этой работы."
    source: { kind: translated, id: 546921 }
  - form: "nadaje"
    pl: "Woda w tej fontannie nadaje się do picia."
    ru: "Вода в этом фонтане пригодна для питья."
    source: { kind: tatoeba, id: 7053967 }
  - form: "nadajecie"
    pl: "Jesteśmy pewni, że nadajecie się na to trudne stanowisko."
    ru: "Мы уверены, что вы подходите для этой трудной должности."
    source: { kind: translated, id: 368450 }
  - form: "nadajecie"
    pl: "Nadajecie się do tej roboty."
    ru: "Вы годитесь для этой работы."
    source: { kind: authored }
  - form: "nadajecie"
    pl: "Nadajecie program na żywo?"
    ru: "Вы транслируете программу вживую?"
    source: { kind: authored }
  - form: "nadajemy"
    pl: "Nadajemy na tej samej fali."
    ru: "Мы на одной волне."
    source: { kind: translated, id: 13654144 }
  - form: "nadajemy"
    pl: "Nadajemy z Warszawy."
    ru: "Мы вещаем из Варшавы."
    source: { kind: authored }
  - form: "nadajemy"
    pl: "Nadajemy dziecku imię po dziadku."
    ru: "Мы даём ребёнку имя в честь дедушки."
    source: { kind: authored }
  - form: "nadajesz"
    pl: "Państwo może odebrać Ci dzieci, jeśli stwierdzi, że nie nadajesz się na matkę."
    ru: "Государство может забрать у тебя детей, если решит, что ты не годишься в матери."
    source: { kind: translated, id: 10699689 }
  - form: "nadajesz"
    pl: "Nie nadajesz się do tej pracy."
    ru: "Ты не годишься для этой работы."
    source: { kind: authored }
  - form: "nadajesz"
    pl: "Nadajesz paczkę na poczcie?"
    ru: "Ты отправляешь посылку на почте?"
    source: { kind: authored }
  - form: "nadaję"
    pl: "Czy się nadaję?"
    ru: "Я гожусь?"
    source: { kind: translated, id: 8505728 }
  - form: "nadaję"
    pl: "Ja po prostu się do tego nie nadaję."
    ru: "Я просто для этого не гожусь."
    source: { kind: translated, id: 7151409 }
  - form: "nadaję"
    pl: "Nadaję temu statkowi nazwę „Queen Elizabeth”."
    ru: "Я даю этому кораблю имя «Королева Елизавета»."
    source: { kind: translated, id: 731899 }
  - form: "nadawano"
    pl: "Nadawano kawałki ze Stanów."
    ru: "Передавали отрывки из Штатов."
    source: { kind: translated, id: 742758 }
  - form: "nadawano"
    pl: "Nadawano to w każdą niedzielę."
    ru: "Это передавали каждое воскресенье."
    source: { kind: authored }
  - form: "nadawano"
    pl: "Kiedyś nadawano tu tylko radio."
    ru: "Когда-то здесь передавали только радио."
    source: { kind: authored }
  - form: "nadawany"
    pl: "Koncert był nadawany na żywo."
    ru: "Концерт транслировали вживую."
    source: { kind: translated, id: 12229264 }
  - form: "nadawany"
    pl: "Ten program jest nadawany co dwa tygodnie."
    ru: "Эта программа выходит раз в две недели."
    source: { kind: translated, id: 12229266 }
  - form: "nadawany"
    pl: "Mecz był nadawany na żywo."
    ru: "Матч транслировался вживую."
    source: { kind: authored }
