# review
id: nadawac
format: 2
lemma: "nadawać"
rank: 1808
pos: verb
aspect: imperf
pron: { cyr: "нада́ваць" }
senses:
  - id: be-suitable
    ru: "nadawać się — годиться, подходить"
    examples:
      - pl: "Czy to się nadaje?"
        ru: "Это годится?"
        source: { kind: translated, id: 8739377 }
      - pl: "On nadaje się do tej pracy."
        ru: "Он подходит для этой работы."
        source: { kind: translated, id: 546921 }
      - pl: "Woda w tej fontannie nadaje się do picia."
        ru: "Вода в этом фонтане пригодна для питья."
        source: { kind: tatoeba, id: 7053967 }
  - id: broadcast
    ru: "передавать, транслировать; отправлять"
    examples:
      - pl: "Koncert był nadawany na żywo."
        ru: "Концерт транслировали вживую."
        source: { kind: translated, id: 12229264 }
      - pl: "Chcę zobaczyć co w tej chwili jest nadawane w telewizji."
        ru: "Я хочу посмотреть, что сейчас идёт по телевизору."
        source: { kind: translated, id: 2063420 }
      - pl: "Nadaję temu statkowi nazwę „Queen Elizabeth”."
        ru: "Я даю этому кораблю имя «Королева Елизавета»."
        source: { kind: translated, id: 731899 }
notes:
  - { kind: false-friend, text: "В корпусе слово живёт прежде всего как возвратное nadawać się «годиться, подходить»: on nadaje się do tej pracy «он подходит для этой работы». Значение «передавать» встречается заметно реже." }
  - { kind: government, text: "Годиться для чего-то — nadawać się do czegoś (родительный с do) или na coś (винительный с na): nadaje się na to stanowisko." }
  - { kind: usage, text: "В значении «передавать» слово про радио и телевидение: program jest nadawany co dwa tygodnie. Отправить посылку — nadać paczkę." }
  - { kind: usage, text: "Безличная форма nadawano значит «передавали», без указания кто: nadawano kawałki ze Stanów." }
  - { kind: government, text: "Деепричастие от nadawać — nadając (несовершенный вид); формы на -wszy образуются только от совершенного вида." }
  - { kind: usage, text: "В обороте nadawać komuś coś «присваивать кому-то что-то» человек стоит в дательном падеже, а в винительном — само звание. Поэтому страдательный оборот строится о звании: tytuł nadawany z urzędu." }
collocations:
  - { pl: "nadawać się do czegoś", ru: "годиться для чего-либо" }
  - { pl: "nadawać program", ru: "транслировать программу" }
  - { pl: "nadać paczkę", ru: "отправить посылку" }
family:
  - { pl: "dawać", ru: "давать", relation: root, id: dawac }
  - { pl: "nadanie", ru: "присвоение, отправка", relation: root }
  - { pl: "wysyłać", ru: "отправлять", relation: root, id: wysylac }
etymology: "Приставка na- плюс dawać «давать». Русское «надавать» значит совсем другое, поэтому значения приходится запоминать отдельно."
memory: "nadawać в живой речи — прежде всего nadawać się «годиться»: nadaje się do tej pracy. Отдельно значит «транслировать» (program nadawany na żywo) и «давать имя»."
idioms:
  - { pl: "nadawać się do czegoś", ru: "годиться для чего-либо" }
  - { pl: "nadawać program", ru: "транслировать программу" }
  - { pl: "nadać paczkę", ru: "отправить посылку" }
