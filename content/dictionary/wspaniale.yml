# review
id: wspaniale
format: 2
lemma: "wspaniale"
rank: 658
pos: adv
pron: { cyr: "вспанья́ле" }
senses:
  - id: wonderfully
    ru: "великолепно, замечательно"
    note: "Чаще всего звучит отдельным восклицанием."
    examples:
      - pl: "Wspaniale."
        ru: "Прекрасно."
        source: { kind: tatoeba, id: 13782644 }
      - pl: "Wspaniale, że wróciłeś."
        ru: "Замечательно, что ты вернулся."
        source: { kind: tatoeba, id: 6015330 }
      - pl: "Wspaniale!"
        ru: "Замечательно!"
        source: { kind: translated, id: 6160561 }
  - id: would-be-great
    ru: "Byłoby wspaniale, gdyby… — Было бы замечательно, если бы…"
    note: "Частый способ высказать пожелание."
    examples:
      - pl: "Byłoby wspaniale, gdybym potrafił mówić w dziesięciu językach."
        ru: "Было бы классно, если бы я мог говорить на десяти языках."
        source: { kind: tatoeba, id: 526595 }
      - pl: "Byłoby wspaniale znów się spotkać."
        ru: "Было бы замечательно снова встретиться."
        source: { kind: authored }
      - pl: "Wspaniale się bawiliśmy."
        ru: "Мы замечательно провели время."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Чаще всего слово звучит отдельным восклицанием: Wspaniale! «Замечательно! Отлично!»" }
  - { kind: usage, text: "Прилагательное — wspaniały «великолепный»; наречие образовано правильно, на -e." }
  - { kind: usage, text: "Степени сравнения правильные: wspaniale — wspanialej — najwspanialej." }
  - { kind: usage, text: "Оборот пожелания: Byłoby wspaniale, gdyby… «Было бы замечательно, если бы…»." }
collocations:
  - { pl: "Wspaniale!", ru: "Замечательно!" }
  - { pl: "Byłoby wspaniale…", ru: "Было бы замечательно…" }
  - { pl: "wspaniały", ru: "великолепный" }
  - { pl: "wspaniale się bawić", ru: "замечательно проводить время" }
family:
  - { pl: "wspaniały", ru: "великолепный", relation: root }
  - { pl: "wspaniałość", ru: "великолепие", relation: derived }
  - { pl: "pan", ru: "господин", relation: root }
etymology: "От wspaniały «великолепный», связанного с pan «господин»: исходно «подобающий пану, величественный»."
memory: "wspaniale — «великолепно, замечательно», и чаще всего вы услышите его отдельным восклицанием: Wspaniale! Прилагательное — wspaniały, а корень у него неожиданный: pan «господин», то есть исходно «по-господски, величественно». Запомните и оборот пожелания: Byłoby wspaniale, gdyby…"
idioms:
  - { pl: "Wspaniale!", ru: "Замечательно!" }
  - { pl: "Byłoby wspaniale…", ru: "Было бы замечательно…" }
  - { pl: "wspaniale się bawić", ru: "замечательно проводить время" }
