etymology: "От ZA GRANICĄ «за границей», от GRANICA, слова общеславянского, того же, что русская «граница». Устройство польского слова повторяет русское «заграничный» часть в часть: приставка, корень, суффикс. Само GRANICA восходит к GRAŃ «грань, ребро», и русская «грань» ему прямая родня, так что за границей стоит образ края, межи. Любопытно, что польский из того же корня произвёл и существительное ZAGRANICA, и русский сделал ровно то же со своей «заграницей»."
memory: "Слово строится как русское «заграничный», часть в часть, и zagranica это «заграница». Но покрывает оно меньше: język obcy «иностранный язык» и obcokrajowiec «иностранец» идут от корня obcy «чужой», и сказать język zagraniczny нельзя. Zagraniczny остаётся при вещах, деньгах и делах государства. На письме различаются zagranica в одно слово и za granicą в два. Читается «заграни́чны»."
