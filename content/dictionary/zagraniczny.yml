notes:
  - { kind: false-friend, text: "Слово покрывает не всё, что русское «иностранный», и это главная ловушка. ZAGRANICZNY говорят о вещах, деньгах, поездках и делах государства: TOWAR ZAGRANICZNY, KAPITAŁ ZAGRANICZNY, POLITYKA ZAGRANICZNA. Но «иностранный язык» это JĘZYK OBCY, и никогда не JĘZYK ZAGRANICZNY, а «иностранец» это OBCOKRAJOWIEC или CUDZOZIEMIEC. Для языков и людей польский берёт корень OBCY «чужой», а ZAGRANICZNY оставляет тому, что приехало из-за границы." }
  - { kind: usage, text: "Одиннадцать форм, относительное прилагательное, степеней сравнения нет. Мужско-личная форма множественного числа ZAGRANICZNI вполне обиходна: ZAGRANICZNI GOŚCIE «иностранные гости», ZAGRANICZNI KORESPONDENCI «иностранные корреспонденты». Рядом стоит различение на письме: ZAGRANICA в одно слово это существительное «заграница», а ZA GRANICĄ в два слова это «за границей», обстоятельство места." }
  - { kind: government, text: "За границу и за границей — та самая пара, что в русском: JECHAĆ ZA GRANICĘ, предлог ZA с винительным, и MIESZKAĆ ZA GRANICĄ, предлог ZA с творительным. Направление берёт винительный, место творительный, ровно как по-русски. Из-за границы — Z ZAGRANICY, предлог Z с родительным. Само прилагательное в устойчивых сочетаниях стоит после существительного: HANDEL ZAGRANICZNY, SPRAWY ZAGRANICZNE." }
  - { kind: pronunciation, text: "Читается «заграни́чны», четыре слога, ударение на предпоследнем. Сочетание CZ даёт «ч», а следующее Y даёт «ы», поэтому конец звучит «чны», без мягкости. Начальное ZA- произносится отчётливо, как в русском «за-». В мужско-личной форме ZAGRANICZNI окончание смягчается и слышно «заграни́чни». Ударение во всех формах остаётся на предпоследнем слоге." }
  - { kind: register, text: "Слово нейтральное, из языка экономики, политики и газет: HANDEL ZAGRANICZNY «внешняя торговля», POLITYKA ZAGRANICZNA «внешняя политика», INWESTYCJE ZAGRANICZNE «иностранные инвестиции», MINISTERSTWO SPRAW ZAGRANICZNYCH, которое поляки сокращают до MSZ и произносят по буквам. В быту про поездку чаще скажут WYJAZD ZA GRANICĘ, в два слова, чем WYJAZD ZAGRANICZNY, хотя верно и то и другое." }
