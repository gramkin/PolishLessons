# review
id: ziom
format: 2
lemma: "ziom"
rank: 5272
pos: noun
pron: { cyr: "зьом" }
senses:
  - id: bro
    ru: "сленг кореш, братан, свой парень"
    examples:
      - pl: "Siema, ziom, co tam?"
        ru: "Здорово, братан, как дела?"
        source: { kind: authored }
      - pl: "To mój ziom z podwórka."
        ru: "Это мой кореш со двора."
        source: { kind: authored }
      - pl: "Ziomowie z osiedla zawsze mu pomogą."
        ru: "Пацаны с района всегда ему помогут."
        source: { kind: authored }
  - id: fellow-local
    ru: "сленг земляк, парень из того же района"
    examples:
      - pl: "Okazało się, że jest moim ziomem z Radomia."
        ru: "Оказалось, что он мой земляк из Радома."
        source: { kind: authored }
      - pl: "W Londynie spotkał ziomów z rodzinnego miasta."
        ru: "В Лондоне он встретил земляков из родного города."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Русское «земляк» и польское ZIOM — родня: ZIOM — сокращение от ZIOMEK, а то от ZIEMIA, «земля», то есть «из той же земли». Но ZIOM ушёл в молодёжный сленг и значит уже не «земляк», а «кореш, братан». Старое ZIOMEK, «земляк», звучит книжно и встречается в литературе." }
  - { kind: usage, text: "Мужской род, одушевлённое, мужское-личное: множественное ZIOMOWIE в форме для людей, но в живой речи чаще ZIOMY или ZIOMALE, с пренебрежительно-дружеским оттенком. Винительный совпадает с родительным: ZNAM TEGO ZIOMA. Как обращение — ZIOM без изменения: SIEMA, ZIOM!" }
  - { kind: government, text: "Кореш с района — ZIOM Z OSIEDLA, Z PODWÓRKA, Z с родительным. Чей кореш — MÓJ ZIOM, притяжательное местоимение. Падежных требований само существительное не имеет." }
  - { kind: pronunciation, text: "Читается «зьом», один слог. ZIO даёт мягкое «зьо», как в ZIEMIA «зе́мя». В ZIOMA: «зьо́ма», в ZIOMOWIE: «зьомо́ве»." }
  - { kind: register, text: "Чистый сленг, молодёжный и уличный, из рэпа и хип-хопа девяностых. В официальной речи неуместен. В переписке его сокращают до ZIOMUŚ или ZIOMEK. Ровесникам — нормально, учителю — нельзя." }
collocations:
  - { pl: "ziom z osiedla", ru: "кореш с района" }
  - { pl: "mój ziom", ru: "мой кореш" }
  - { pl: "siema, ziom", ru: "здорово, братан" }
family:
  - { pl: "ziemia", ru: "земля", relation: root, id: ziemia }
  - { pl: "ziomek", ru: "земляк", relation: derived }
  - { pl: "kumpel", ru: "приятель, кореш", relation: root, id: kumpel }
etymology: "Усечение от ZIOMEK «земляк», а то от ZIEMIA «земля» с тем же суффиксом, что в русском «земляк». В девяностые польский хип-хоп превратил ZIOMEK в ZIOM и сделал его словом для своих: «свой парень из того же района», как английское homie, «из того же дома»."
memory: "Ziom — сленг: кореш, братан. Siema, ziom! — здорово, братан! Из ziomek — земляк, от ziemia. Читается «зьом»."
idioms:
  - { pl: "siema, ziom", ru: "здорово, братан" }
