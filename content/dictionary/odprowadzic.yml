notes:
  - { kind: usage, text: "Приставок у этого корня столько же, сколько у русского «-водить», и расходятся они редко: PROWADZIĆ — «вести», WPROWADZIĆ — «ввести», WYPROWADZIĆ — «вывести», PRZEPROWADZIĆ — «провести», DOPROWADZIĆ — «довести», ODPROWADZIĆ — «отвести» и «проводить». Выучив одну приставку, остальные берёшь из русского почти без потерь. Внимания просит только PRZEPROWADZIĆ SIĘ — это «переехать» (о квартире), а не «перевестись»." }
  - { kind: government, text: "Кого — винительный, куда — предлог направления: ODPROWADZIĆ KOGOŚ NA DWORZEC, DO SZKOŁY, DO DOMU. Выбор между NA и DO тот же, что у остальных глаголов движения: NA DWORZEC, NA LOTNISKO, NA PRZYSTANEK, но DO SZKOŁY, DO DOMU, DO STAJNI. Русское «проводить до» отвечает польскому AŻ DO с родительным: ODPROWADZILI NAS AŻ DO FURTKI. В значении воды подлежащее — сама труба или канавка, а не человек: RURA ODPROWADZA WODĘ." }
  - { kind: pronunciation, text: "Основа оканчивается на dz, и по формам она играет dz против dź: ODPROWADZĘ, ODPROWADZISZ, ODPROWADZONY с твёрдым dz, а повелительное ODPROWADŹ и инфинитив ODPROWADZIĆ с мягким. Это не та мена, что разбиралась у ZŁOŚCIĆ: там основы на ś, ź, ść, źdź меняли согласный по существу (NOSZĘ при NOSIĆ), здесь же dz и dź — один и тот же согласный, записанный с мягким знаком и без. Так же ведут себя CHODZIĆ и PŁACIĆ." }
  - { kind: false-friend, text: "Русское «отводить» в переносных смыслах польским ODPROWADZIĆ не переводится. «Отвести взгляд» — это ODWRÓCIĆ WZROK, «отвести удар» — ODPARŁ CIOS, «отвести время на что-то» — PRZEZNACZYĆ CZAS. Польское ODPROWADZIĆ держится буквального: кого-то или что-то переместили из точки в точку, своими ногами или по трубе." }
collocations:
  - { pl: "odprowadzić na dworzec", ru: "проводить на вокзал" }
  - { pl: "odprowadzić dziecko do szkoły", ru: "проводить ребёнка в школу" }
  - { pl: "odprowadzać wodę", ru: "отводить воду" }
family:
  - { pl: "odprowadzać", ru: "провожать, отводить", relation: aspect }
  - { pl: "prowadzić", ru: "вести", relation: root, id: prowadzic }
  - { pl: "wyprowadzić", ru: "вывести", relation: root, id: wyprowadzic }
etymology: "Приставка od- «от» и PROWADZIĆ, из праславянского *vaditi «вести» — тот же корень, что в русских «водить», «вести», «повод», «вождь». Польская основа -WADZ- отвечает русской -вод- или -вед-, и всё гнездо читается по этому ключу: PROWADZIĆ «вести», PRZEWODNIK «проводник», WODZA «вожжа», DOWÓD «доказательство», то есть буквально «то, что доводит». Приставка od- делает то же, что русская «от-»: уводит от исходной точки, откуда и «отвести», и «проводить» — проводил, значит довёл до места и сам ушёл."
memory: "Польское -wadzić отвечает русскому -водить: prowadzić «вести», wprowadzić «ввести», wyprowadzić «вывести», odprowadzić «отвести». Приставки свои, корень почти свой."
idioms:
