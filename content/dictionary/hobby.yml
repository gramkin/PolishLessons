notes:
  - { kind: false-friend, text: "HOBBY — «хобби», как в русском. Синонимы: ZAINTERESOWANIA, «интересы», в анкетах и резюме, и PASJA — «страсть, увлечение»: MOJĄ PASJĄ JEST TANIEC." }
  - { kind: usage, text: "Средний род, не склоняется: TO HOBBY, MOJE HOBBY, O HOBBY, Z HOBBY. Множество хобби — те же HOBBY: MAM DWA HOBBY." }
  - { kind: government, text: "Заниматься хобби — ZAJMOWAĆ SIĘ HOBBY, творительный, форма та же. Моё хобби — фотография: MOIM HOBBY JEST FOTOGRAFIA, с творительным, или MOJE HOBBY TO FOTOGRAFIA." }
  - { kind: pronunciation, text: "Читается «хо́бби»: H — «х», двойное BB звучит чуть дольше одиночного. Ударение на первом слоге." }
collocations:
