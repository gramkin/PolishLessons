etymology: "Из английского HOBBY, сокращения от HOBBY-HORSE «игрушечная лошадка на палке»: любимое занятие, на которое «садятся верхом»."
memory: "Hobby — хобби, не склоняется: moje hobby, o hobby. Moim hobby jest taniec — моё хобби танцы. Читается «хо́бби»."
idioms:
