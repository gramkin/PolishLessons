# review
id: ktorys
format: 2
lemma: "któryś"
rank: 1174
pos: adj
pron: { cyr: "кту́рысь" }
senses:
  - id: some
    ru: "какой-то, один из (неопределённый)"
    examples:
      - pl: "Któryś z nas musi iść."
        ru: "Кто-то из нас должен пойти."
        source: { kind: translated, id: 3898921 }
      - pl: "Któryś z nas się myli - ty albo ja."
        ru: "Кто-то из нас ошибается — ты или я."
        source: { kind: translated, id: 733069 }
      - pl: "Podoba ci się któryś z tych obrazów?"
        ru: "Тебе нравится какая-нибудь из этих картин?"
        source: { kind: translated, id: 362822 }
  - id: one-day
    ru: "któregoś dnia — однажды, как-нибудь"
    examples:
      - pl: "Odwiedzę go któregoś dnia."
        ru: "Я навещу его как-нибудь на днях."
        source: { kind: translated, id: 663868 }
      - pl: "Któregoś dnia moje marzenie się spełni."
        ru: "Однажды моя мечта сбудется."
        source: { kind: translated, id: 602440 }
  - id: at-some
    ru: "w którymś momencie — в какой-то момент"
    examples:
      - pl: "Naprawdę muszę dzisiaj w którymś momencie porozmawiać z Tomem."
        ru: "Мне правда нужно сегодня в какой-то момент поговорить с Томом."
        source: { kind: translated, id: 4104380 }
      - pl: "Miłość jest wspaniałym uczuciem i rodzi się w każdym w którymś momencie jego życia."
        ru: "Любовь — прекрасное чувство, и она рождается в каждом в какой-то момент жизни."
        source: { kind: translated, id: 2160338 }
notes:
  - { kind: usage, text: "Это отдельное слово, а не форма который: któryś получается прибавлением частицы -ś к każdy падежной форме — któregoś, którymś, którejś. Карточка ktory к нему отношения не имеет." }
  - { kind: usage, text: "Значение — неопределённость: «какой-то, один из, неважно который». Ответ на вопрос który? «который?»." }
  - { kind: usage, text: "któregoś dnia — самый частый оборот, «однажды, как-нибудь на днях», и о прошлом, и о будущем." }
  - { kind: usage, text: "Частица -ś та же, что в ktoś «кто-то», coś «что-то», gdzieś «где-то»: она и делает слово неопределённым." }
collocations:
  - { pl: "któryś z nas", ru: "кто-то из нас" }
  - { pl: "któregoś dnia", ru: "однажды" }
  - { pl: "w którymś momencie", ru: "в какой-то момент" }
family:
  - { pl: "który", ru: "который", relation: root, id: ktory }
  - { pl: "ktoś", ru: "кто-то", relation: derived }
  - { pl: "coś", ru: "что-то", relation: derived, id: cos }
etymology: "Это który «который» плюс неопределённая частица -ś, та же, что в ktoś «кто-то» и coś «что-то». Русское «какой-то» собрано так же, только частица идёт отдельным словом."
memory: "któryś — «какой-то, один из». Частица -ś приклеивается к падежной форме: któregoś, którymś, którejś. Самый частый оборот — któregoś dnia «однажды, как-нибудь на днях»."
idioms:
  - { pl: "któregoś dnia", ru: "однажды" }
  - { pl: "któryś z nas", ru: "кто-то из нас" }
