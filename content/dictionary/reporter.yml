notes:
  - { kind: false-friend, text: "REPORTER — «репортёр», но без «ё»: «рэпо́ртэр». Репортаж — REPORTAŻ, с Ż на конце. Корреспондент за рубежом — KORESPONDENT." }
  - { kind: usage, text: "Десять форм, мужской род, лицо. Во множественном R переходит в RZ: REPORTERZY. В местном тоже: O REPORTERZE. Женщина — REPORTERKA." }
  - { kind: government, text: "Чей репортёр — родительный: REPORTER GAZETY, REPORTER TELEWIZJI. Ответить репортёрам — ODPOWIADAĆ REPORTEROM, дательный." }
  - { kind: pronunciation, text: "Читается «рэпо́ртэр», ударение на предпоследнем слоге. RE и TE твёрдые: «рэ», «тэ»." }
collocations:
  - { pl: "reporter telewizyjny", ru: "телерепортёр" }
  - { pl: "reporter wojenny", ru: "военный корреспондент" }
  - { pl: "tłum reporterów", ru: "толпа репортёров" }
family:
  - { pl: "reportaż", ru: "репортаж", relation: derived }
  - { pl: "reporterka", ru: "репортёрша", relation: derived }
  - { pl: "reporterski", ru: "репортёрский", relation: derived }
etymology: "Из английского, а туда — из латинского глагола со значением «приносить обратно, сообщать». Русское «репортёр» — из того же источника, но через французское произношение."
memory: "Reporter — репортёр, читается «рэпо́ртэр». Reporterzy — репортёры. Reportaż — репортаж. Reporter wojenny — военный корреспондент."
