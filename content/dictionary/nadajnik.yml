notes:
  - { kind: false-friend, text: "Само слово понятно, а вот глагол при нём делает сразу две работы, которые русский развёл. NADAWAĆ значит и «передавать» по радио, и «отправлять» по почте: NADAWAĆ PROGRAM — передавать программу, а NADAĆ LIST — отправить письмо. Поэтому и NADAWCA на конверте это «отправитель». Один польский глагол там, где у нас два, и запомнить это стоит сразу." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Основа не меняется, беглых гласных нет. Суффикс -NIK здесь делает название прибора от глагола, как и в CZAJNIK и в LICZNIK: NADAWAĆ даёт NADAJNIK, то есть «тот, что передаёт». Существительное NADANIE значит и передачу, и отправку, смотря по делу." }
  - { kind: government, text: "Мощность передатчика — MOC NADAJNIKA, родительный без предлога. В передатчике — W NADAJNIKU, местный падеж. Отправить письмо — NADAĆ LIST, винительный без предлога, и глагол тот же, что в передаче по радио. Радиус действия передатчика — ZASIĘG NADAJNIKA, тоже родительный." }
  - { kind: pronunciation, text: "Читается «нада́йник», три слога, ударение на предпоследнем. Буква J даёт «й», поэтому середина слова это «дай». Дальше идёт NI с мягким «н»: «ник». Трудных мест в слове нет, и для русского уха оно одно из самых простых в этом разделе." }
  - { kind: register, text: "Слово техническое и газетное. В новостях это NADAJNIK TELEWIZYJNY и NADAJNIK RADIOWY, обычно на горе или на башне. В разговоре о слежении — NADAJNIK как маячок, который крепят зверю на шею или прячут в машине. А на почте всё время слышно NADAWCA I ODBIORCA, «отправитель и получатель», и оба слова того же гнезда." }
collocations:
  - { pl: "moc nadajnika", ru: "мощность передатчика" }
  - { pl: "zasięg nadajnika", ru: "радиус действия передатчика" }
