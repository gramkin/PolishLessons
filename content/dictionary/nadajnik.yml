family:
  - { pl: "nadawać", ru: "передавать; отправлять", relation: root, id: nadawac }
  - { pl: "nadawca", ru: "отправитель", relation: derived }
  - { pl: "nadanie", ru: "передача; отправка", relation: derived }
etymology: "От глагола NADAWAĆ, от приставки NAD- и DAWAĆ «давать», слова праславянского и того же, что русское «давать». Передатчик это буквально «тот, кто подаёт наружу». Русский назвал прибор от «передать», то есть тем же образом, но с другой приставкой: у нас «пере-», у поляка NAD-. А дальше гнёзда разошлись: польское NADAWAĆ взяло на себя и почту, и радио, русское «передавать» почту не затронуло."
memory: "Передатчик, от nadawac. Главное тут глагол: nadawac значит и «передавать» по радио, и «отправлять» по почте, поэтому nadac list это «отправить письмо», а nadawca на конверте — «отправитель». Один глагол вместо наших двух. Читается «нада́йник», где j даёт «й». Суффикс -nik делает название прибора, как в licznik «счётчик»."
idioms:
  - { pl: "nadajnik radiowy", ru: "радиопередатчик" }
