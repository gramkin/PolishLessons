# review
id: ksiadz
format: 2
lemma: "ksiądz"
rank: 1632
pos: noun
pron: { cyr: "ксьонц" }
senses:
  - id: priest
    ru: "священник, ксёндз"
    examples:
      - pl: "Przyszedł ksiądz."
        ru: "Пришёл священник."
        source: { kind: translated, id: 10708098 }
      - pl: "Ten ksiądz odprawia mszę."
        ru: "Этот священник служит мессу."
        source: { kind: translated, id: 881984 }
      - pl: "Tomek wysłuchał uważnie kazania księdza."
        ru: "Том внимательно слушал проповедь священника."
        source: { kind: tatoeba, id: 10076394 }
  - id: be-priest
    ru: "быть священником, стать священником"
    examples:
      - pl: "Tom jest księdzem."
        ru: "Том священник."
        source: { kind: translated, id: 2679437 }
      - pl: "Tom przebrał się za księdza."
        ru: "Том переоделся священником."
        source: { kind: translated, id: 3051263 }
notes:
  - { kind: usage, text: "Склонение неправильное: единственное число ksiądz, księdza, księdzu, księdzem, а множественное берёт другой корень — księża, księży, księżom, księżmi." }
  - { kind: false-friend, text: "Русское «князь» и польское ksiądz — одно и то же старое слово. В польском оно закрепилось за духовным саном, а «князь» теперь książę." }
  - { kind: usage, text: "К священнику обращаются księże или proszę księdza; русское соответствие — «батюшка», «отец»." }
  - { kind: pronunciation, text: "Читается «кщёнц»: ksi даёт мягкое «кщ», ą — носовое «он», а конечное dz оглушается в «ц»." }
collocations:
  - { pl: "zostać księdzem", ru: "стать священником" }
  - { pl: "proszę księdza", ru: "отец (обращение)" }
  - { pl: "kazanie księdza", ru: "проповедь священника" }
family:
  - { pl: "książę", ru: "князь", relation: root }
  - { pl: "kościół", ru: "костёл, церковь", relation: root, id: kosciol }
  - { pl: "księżyc", ru: "луна", relation: root }
etymology: "Праславянское *kъnędzь — то же слово, что русское «князь». В польском значение сместилось к духовному сану, а для князя появилось książę."
memory: "ksiądz — «священник, ксёндз», и это то же слово, что русское «князь». Склонение ломаное: единственное księdza, множественное księża, księży, księżmi. Князь по-польски — książę."
idioms:
  - { pl: "nie ucz księdza pacierza", ru: "не учи учёного" }
  - { pl: "zostać księdzem", ru: "стать священником" }
  - { pl: "proszę księdza", ru: "отец (обращение к священнику)" }
