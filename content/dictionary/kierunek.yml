# review
id: kierunek
format: 2
lemma: "kierunek"
rank: 1334
pos: noun
pron: { cyr: "керу́нэк" }
senses:
  - id: direction
    ru: "направление"
    examples:
      - pl: "Szła w moim kierunku."
        ru: "Она шла в моём направлении."
        source: { kind: tatoeba, id: 6406040 }
      - pl: "Jaki jest kierunek wiatru?"
        ru: "Какое направление ветра?"
        source: { kind: translated, id: 11565850 }
      - pl: "Ten znak pokazuje kierunek ruchu."
        ru: "Этот знак показывает направление движения."
        source: { kind: translated, id: 960717 }
  - id: towards
    ru: "w kierunku czegoś — в сторону чего-то"
    examples:
      - pl: "Uciekał w kierunku lasu."
        ru: "Он убегал в сторону леса."
        source: { kind: translated, id: 525351 }
      - pl: "Poszedł w kierunku morza."
        ru: "Он пошёл в сторону моря."
        source: { kind: translated, id: 418319 }
      - pl: "Pasażerowie rzucili się w kierunku tylnego wyścia."
        ru: "Пассажиры бросились к заднему выходу."
        source: { kind: tatoeba, id: 365212 }
  - id: field
    ru: "kierunek studiów — направление обучения, специальность"
    examples:
      - pl: "Jakie kierunek zamierzasz studiować?"
        ru: "Какую специальность ты собираешься изучать?"
        source: { kind: translated, id: 355439 }
      - pl: "Tom planuje studiować biologię jako główny kierunek."
        ru: "Том планирует изучать биологию как основную специальность."
        source: { kind: translated, id: 5282711 }
      - pl: "Filozofia jest interesującym kierunkiem studiów."
        ru: "Философия — интересное направление обучения."
        source: { kind: translated, id: 8617834 }
notes:
  - { kind: government, text: "w kierunku czegoś «в сторону чего-то»: сам kierunek стоит в предложном, а зависимое слово в родительном — w kierunku lasu." }
  - { kind: usage, text: "Kierunek studiów — «направление обучения, специальность». Это ключевое слово в разговоре об университете." }
  - { kind: usage, text: "Pod kierunkiem kogoś значит «под руководством кого-то» — творительный падеж." }
  - { kind: pronunciation, text: "Основа чередуется: kierunek, но kierunku и kierunkiem, уже без e." }
collocations:
  - { pl: "w kierunku", ru: "в сторону" }
  - { pl: "kierunek studiów", ru: "специальность" }
  - { pl: "zmienić kierunek", ru: "сменить направление" }
etymology: "Из немецкого Kehrung «поворот». Русское «направление» — своё слово, от «править», но смысл тот же."
memory: "kierunek — «направление». Главный оборот — w kierunku czegoś «в сторону чего-то». А kierunek studiów значит «специальность» в университете. Основа чередуется: kierunek, но kierunku."
idioms:
  - { pl: "w kierunku", ru: "в сторону" }
  - { pl: "kierunek studiów", ru: "специальность" }
  - { pl: "pod kierunkiem", ru: "под руководством" }
