# review
id: zdac
format: 2
lemma: "zdać"
rank: 691
pos: verb
aspect: perf
aspectPair: zdawac
pron: { cyr: "здаць" }
senses:
  - id: pass-exam
    ru: "сдать (экзамен) — успешно"
    note: "Процесс сдачи — zdawać; zdać значит именно «сдать успешно»."
    examples:
      - pl: "Tom ma nadzieję, że zda egzamin."
        ru: "Том надеется, что сдаст экзамен."
        source: { kind: tatoeba, id: 10168317 }
      - pl: "Zdał egzamin."
        ru: "Он сдал экзамен."
        source: { kind: translated, id: 1657755 }
      - pl: "Cała klasa zdała egzamin."
        ru: "Весь класс сдал экзамен."
        source: { kind: translated, id: 1659891 }
  - id: realise
    ru: "zdać sobie sprawę z czegoś — осознать что-л."
    examples:
      - pl: "Nagle zdałem sobie sprawę, że wszystko w moim życiu nie było przypadkiem."
        ru: "Я вдруг поняла, что всё в моей жизни было не случайно."
        source: { kind: tatoeba, id: 3657320 }
      - pl: "Tom i Mary zdali sobie sprawę z tego, że nie mają wyboru."
        ru: "Том и Мэри осознали, что у них нет выбора."
        source: { kind: translated, id: 7960675 }
      - pl: "Zdałem sobie sprawę z błędu."
        ru: "Я осознал ошибку."
        source: { kind: authored }
  - id: dependent
    ru: "zdany na kogoś — предоставленный кому-л., зависящий от"
    examples:
      - pl: "Odtąd jesteś zdany na siebie."
        ru: "Отныне ты предоставлен сам себе."
        source: { kind: translated, id: 911558 }
      - pl: "Statek był zdany na łaskę i niełaskę morza."
        ru: "Корабль был отдан на милость моря."
        source: { kind: translated, id: 516499 }
      - pl: "Biedni ludzie zdani byli na łaskę okrutnego dyktatora."
        ru: "Бедняки были отданы на милость жестокого диктатора."
        source: { kind: translated, id: 1351118 }
  - id: rely
    ru: "zdać się na kogoś — положиться на кого-л."
    examples:
      - pl: "Zdaj się na mnie."
        ru: "Положись на меня."
        source: { kind: translated, id: 460716 }
      - pl: "Zdaj się na mój osąd."
        ru: "Положись на моё суждение."
        source: { kind: authored }
      - pl: "Zdali się na jego osąd."
        ru: "Они положились на его суждение."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Главная ловушка не в глаголе: формы zdanie, zdania, zdaniu, zdaniem совпадают с падежами существительного zdanie «предложение; мнение», и в тексте вам почти всегда попадётся именно оно — Dodaj nowe zdanie, W tym zdaniu brakuje kropki." }
  - { kind: usage, text: "Оборот moim zdaniem «по-моему, на мой взгляд» — один из самых частых в языке, и он тоже от существительного zdanie, а не от глагола." }
  - { kind: government, text: "zdać egzamin — винительный. Различайте вид: zdawać egzamin значит «сдавать» (процесс), zdać egzamin — «сдать успешно»." }
  - { kind: usage, text: "zdać sobie sprawę Z czegoś «осознать что-либо» — с предлогом z и родительным." }
  - { kind: usage, text: "Причастие zdany значит «предоставленный, зависящий»: jesteś zdany na siebie «ты предоставлен сам себе»." }
collocations:
  - { pl: "zdać egzamin", ru: "сдать экзамен" }
  - { pl: "zdać sobie sprawę", ru: "осознать" }
  - { pl: "moim zdaniem", ru: "по-моему" }
  - { pl: "zdany na siebie", ru: "предоставленный сам себе" }
family:
  - { pl: "zdawać", ru: "сдавать", relation: aspect }
  - { pl: "dać", ru: "дать", relation: root }
  - { pl: "zdanie", ru: "предложение; мнение", relation: derived }
etymology: "Приставка z- плюс dać «дать», праславянское *dati — то же слово, что русское «дать». «Сдать» собрано тем же способом."
memory: "zdać — «сдать», и собрано оно как русское: z- плюс dać. Главная ловушка не в самом глаголе: формы zdanie, zdania, zdaniu, zdaniem совпадают с падежами существительного zdanie «предложение; мнение», и в тексте вам почти всегда попадётся именно оно — moim zdaniem «по-моему». Из глагола выучите два оборота: zdać egzamin «сдать успешно» (процесс — zdawać) и zdać sobie sprawę Z czegoś «осознать что-либо»."
idioms:
  - { pl: "zdać egzamin", ru: "сдать экзамен" }
  - { pl: "zdać sobie sprawę", ru: "осознать" }
  - { pl: "moim zdaniem", ru: "по-моему" }
