        ru: "Зимние каникулы начинаются в середине февраля."
        source: { kind: authored }
  - id: fierce
    ru: "устар., книжн. лютый, суровый, жестокий"
    examples:
      - pl: "Nadeszła luta zima."
        ru: "Пришла лютая зима."
        source: { kind: authored }
      - pl: "Lute mrozy trwały cały miesiąc."
        ru: "Лютые морозы стояли целый месяц."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Русскому LUTY знаком: это «лютый». Месяц и назван по лютым морозам: LUTY — «лютый» месяц, февраль. Русский взял латинское «февраль» и потерял образ, а польский сохранил славянское название. Старое прилагательное LUTY, «суровый», живёт в книжной речи: LUTA ZIMA, LUTE MROZY." }
  - { kind: usage, text: "Главная особенность: месяц LUTY склоняется не как существительное, а как прилагательное мужского рода: LUTY, LUTEGO, LUTEMU, W LUTYM. В отличие от STYCZEŃ или MARZEC, у него нет форм на -A, -U, -IE. Женские и средние формы — LUTA, LUTE, LUTĄ, LUTEJ — принадлежат книжному «лютый»: LUTA ZIMA. Форма для мужчин-людей LUCI — архаизм из старой поэзии: LUCI WROGOWIE." }
  - { kind: government, text: "В феврале — W LUTYM, W с местным, совпадающим с творительным прилагательного. До февраля — DO LUTEGO, родительный. В датах — родительный: PIERWSZEGO LUTEGO, «первого февраля». С февраля — OD LUTEGO." }
  - { kind: pronunciation, text: "Читается «лю́ты», два слога, ударение на первом. LU — мягкое «лю», TY — твёрдое «ты». В LUTEGO: «люте́го», в W LUTYM: «ф лю́тым»." }
  - { kind: register, text: "Нейтральное название месяца. Прилагательное «лютый» — книжное, поэтическое, встречается в исторических романах и стихах. TŁUSTY CZWARTEK, «жирный четверг» перед постом, часто выпадает на LUTY, и поляки едят тогда пончики." }
collocations:
  - { pl: "w lutym", ru: "в феврале" }
  - { pl: "do końca lutego", ru: "до конца февраля" }
  - { pl: "luta zima", ru: "лютая зима (книжн.)" }
family:
