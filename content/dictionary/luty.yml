etymology: "От общеславянского *ljutъ, «лютый, свирепый», того же, что русское «лютый». Месяц назван по самым суровым морозам года. Украинское «лютий» — то же слово и тот же месяц. Русский взял латинское FEBRUARIUS, от FEBRUA, римского обряда очищения, и образ лютого холода в названии потерял."
memory: "Luty — февраль, но склоняется как прилагательное: w lutym, do lutego, pierwszego lutego. Назван по лютым морозам — русское «лютый». Luta zima — книжное «лютая зима». Читается «лю́ты»."
idioms:
  - { pl: "w lutym", ru: "в феврале" }
