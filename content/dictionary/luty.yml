pos: adj
pron: { cyr: "лю́ты" }
senses:
  - id: february
    ru: "февраль (склоняется как прилагательное)"
    examples:
      - pl: "Luty jest najkrótszym miesiącem roku."
        ru: "Февраль — самый короткий месяц года."
        source: { kind: authored }
      - pl: "Urodził się w lutym."
        ru: "Он родился в феврале."
        source: { kind: authored }
