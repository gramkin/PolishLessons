notes:
  - { kind: pronunciation, text: "Читается «пазно́кець», ударение на предпоследнем слоге. Сочетание KIE даёт мягкое «ке», а конечное Ć — «ць», и это та же мягкость, что в русском «ноготь» на конце. В косвенных падежах беглая гласная выпадает: PAZNOKIEĆ, но PAZNOKCIA «пазно́кця», где CI перед гласной читается «ць». То есть основа укорачивается ровно так же, как в русском «ноготь» и «ногтя»." }
  - { kind: usage, text: "Беглое IE — главная трудность и одновременно подарок. Оно есть только в именительном и винительном единственного числа: PAZNOKIEĆ. Во всех остальных формах его нет: PAZNOKCIA, PAZNOKCIOWI, PAZNOKCIEM, PAZNOKCIE, PAZNOKCI. Русский делает то же самое со своим «ноготь — ногтя — ногти», так что правило переносится без усилий, надо только не оставить IE там, где его быть не должно. Ухоженные ногти — PAZNOKCIE, маникюр — MANICURE или потолще по-польски: MALOWANIE PAZNOKCI." }
  - { kind: government, text: "Слово мужского рода, неодушевлённое: винительный равен именительному, ZŁAMAŁ PAZNOKIEĆ. Родительный единственного на -A: BEZ PAZNOKCIA. Родительный множественного — PAZNOKCI, без окончания, и он же стоит после счётных слов и при отрицании: NIE MA MOCNYCH PAZNOKCI. «Под ногтями» будет POD PAZNOKCIAMI с творительным, а не с местным, потому что предлог POD при ответе на вопрос «где» требует творительного — для русского это привычно: «под ногтями» тоже творительный." }
