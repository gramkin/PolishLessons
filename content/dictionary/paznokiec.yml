etymology: "То же слово, что русское «ноготь», но с приставкой, которой русский здесь не добавил. Праславянское *nogъtь дало русское «ноготь» и старопольское NOGIEĆ, а польский надстроил спереди приставку PA-, получив PAZNOGIEĆ, откуда и нынешнее PAZNOKIEĆ со вставным Z и с K вместо G. Приставка PA- в славянских языках означает нечто производное, побочное, похожее на основное: отсюда польское PAGÓREK «холмик» от GÓRA и русские «пасынок», «падчерица», «паводок». Так что буквально PAZNOKIEĆ — это «как бы ноготь», «ногтевидное». Сам корень *nogъtь связан со словом «нога»: когти и ногти назывались одним словом, и польское PAZUR «коготь» держится рядом по смыслу, хотя происходит от другого корня. Старая форма PAZNOGIEĆ в польском ещё фиксируется словарями как устаревшая."
memory: "То же, что «ноготь», только с приставкой pa-, как в «пасынок» и «паводок»: pa- плюс старое nogieć. Беглое ie живёт лишь в именительном: paznokieć, но paznokcia, paznokcie, paznokci — точно как «ноготь — ногтя — ногти». Читается «пазно́кець». «Под ногтями» — pod paznokciami, творительный."
