  - id: unknown
    ru: "незнакомый (как прилагательное)"
    examples:
      - pl: "Zobaczyłem nieznajomego mężczyznę."
        ru: "Я увидел незнакомого мужчину."
        source: { kind: authored }
      - pl: "Bądź uprzejmy dla nieznajomych."
        ru: "Будь вежлив с незнакомыми."
        source: { kind: translated, id: 940930 }
      - pl: "Obiecywałem sobie, że znajdę nieznajomego."
        ru: "Я обещал себе, что найду незнакомца."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Слово склоняется как прилагательное, хотя значит человека: nieznajomy, nieznajomego, nieznajomemu — как dobry, dobrego." }
  - { kind: usage, text: "Женский род — nieznajoma «незнакомка», множественное лично-мужское — nieznajomi." }
  - { kind: usage, text: "Внутри znajomy «знакомый», от znać «знать»; русское «незнакомый» построено точно так же." }
  - { kind: usage, text: "Частое предостережение: nie rozmawiaj z nieznajomymi «не разговаривай с незнакомыми»." }
collocations:
  - { pl: "obcy nieznajomy", ru: "чужой незнакомец" }
  - { pl: "nie ufać nieznajomym", ru: "не доверять незнакомцам" }
  - { pl: "znajomy", ru: "знакомый" }
etymology: "Из nie- + znajomy «знакомый», от znać «знать». Русское «незнакомый» собрано из тех же частей."
memory: "nieznajomy — «незнакомец», и собрано оно как русское «незнакомый»: nie + znajomy, от znać «знать». Главная особенность — склоняется как прилагательное, хотя обозначает человека: nieznajomego, nieznajomemu. Женский род — nieznajoma."
idioms:
