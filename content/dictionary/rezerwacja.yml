notes:
  - { kind: false-friend, text: "REZERWACJA — «бронь, бронирование» столика, номера, билета. «Резервация» индейцев и «заповедник» — REZERWAT. Забронировать — ZAREZERWOWAĆ." }
  - { kind: usage, text: "Восемь живых форм, женский род на -CJA. Родительный, дательный и местный — REZERWACJI. Архаичная форма REZERWACYJ и звательный не даются." }
  - { kind: government, text: "Бронь на чьё имя — REZERWACJA NA NAZWISKO, NA с винительным. Бронь на время — NA ÓSMĄ, «на восемь». Сделать бронь — ZROBIĆ REZERWACJĘ." }
  - { kind: pronunciation, text: "Читается «рэзэрва́цья», ударение на предпоследнем слоге. RE и ZE твёрдые, CJA — «цья»." }
collocations:
  - { pl: "zrobić rezerwację", ru: "забронировать" }
  - { pl: "rezerwacja stolika", ru: "бронирование столика" }
  - { pl: "odwołać rezerwację", ru: "отменить бронь" }
family:
  - { pl: "rezerwować", ru: "бронировать", relation: derived }
  - { pl: "zarezerwować", ru: "забронировать", relation: derived, id: zarezerwowac }
  - { pl: "rezerwat", ru: "заповедник; резервация", relation: root }
etymology: "Из латинского глагола со значением «сохранять, оставлять про запас». Русская «резервация» — того же корня, но значит другое."
memory: "Rezerwacja — бронь; rezerwat — заповедник, резервация. Читается «рэзэрва́цья». Rezerwacja na nazwisko — бронь на фамилию."
idioms:
  - { pl: "mieć coś w zanadrzu", ru: "иметь что-то в запасе" }
