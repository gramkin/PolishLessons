# review
id: potrzebny
format: 2
lemma: "potrzebny"
rank: 633
pos: adj
pron: { cyr: "потшэ́бны" }
senses:
  - id: needed
    ru: "нужный, необходимый"
    note: "potrzebny komuś: человек в дательном, вещь в именительном."
    examples:
      - pl: "Potrzebny mi lek na kaszel."
        ru: "Мне нужно лекарство от кашля."
        source: { kind: tatoeba, id: 821038 }
      - pl: "Potrzebna mi mąka."
        ru: "Мне нужна мука."
        source: { kind: tatoeba, id: 6441022 }
      - pl: "Czy on jest wam potrzebny?"
        ru: "Он вам нужен?"
        source: { kind: tatoeba, id: 3660733 }
  - id: no-longer
    ru: "nie jest potrzebny — не нужен"
    note: "При отрицании предмет остаётся в именительном."
    examples:
      - pl: "Nie byłeś mi potrzebny."
        ru: "Ты не был мне нужен."
        source: { kind: tatoeba, id: 5909095 }
      - pl: "Twoja pomoc nie jest już potrzebna."
        ru: "Твоя помощь больше не нужна."
        source: { kind: tatoeba, id: 7180291 }
      - pl: "Nie jesteśmy potrzebni."
        ru: "Мы не нужны."
        source: { kind: translated, id: 3086111 }
  - id: more-needed
    ru: "potrzebniejszy — нужнее"
    note: "Степени правильные: potrzebny — potrzebniejszy — najpotrzebniejszy."
    examples:
      - pl: "Przyjaciel jest potrzebniejszy niż ogień i woda."
        ru: "Друг нужнее огня и воды."
        source: { kind: translated, id: 3331670 }
      - pl: "Woda jest potrzebniejsza niż złoto."
        ru: "Вода нужнее золота."
        source: { kind: authored }
      - pl: "Ten lek okazał się potrzebniejszy."
        ru: "Это лекарство оказалось нужнее."
        source: { kind: authored }
notes:
  - { kind: government, text: "Главная конструкция совпадает с русской: potrzebny KOMUŚ — человек в дательном, а нужная вещь в именительном. Potrzebna mi mąka «Мне нужна мука», potrzebny mi lek «Мне нужно лекарство»." }
  - { kind: government, text: "А вот глагол от того же корня управляет иначе: potrzebuję mąki — родительный падеж. Пару potrzebny mi X / potrzebuję X-a стоит запомнить вместе." }
  - { kind: usage, text: "Степени правильные: potrzebny — potrzebniejszy — najpotrzebniejszy; мужское личное во множественном — potrzebni." }
  - { kind: usage, text: "Существительное — potrzeba «нужда, потребность»: w razie potrzeby «в случае необходимости»." }
collocations:
  - { pl: "potrzebny mi", ru: "мне нужен" }
  - { pl: "nie jest potrzebny", ru: "не нужен" }
  - { pl: "w razie potrzeby", ru: "в случае необходимости" }
  - { pl: "potrzebne dokumenty", ru: "нужные документы" }
family:
  - { pl: "potrzeba", ru: "нужда, потребность", relation: root }
  - { pl: "potrzebować", ru: "нуждаться", relation: derived }
  - { pl: "niepotrzebny", ru: "ненужный", relation: derived }
etymology: "От potrzeba «нужда», праславянское *po-trěba — тот же корень, что в русских «потребность», «требовать» и «треба»."
memory: "potrzebny — «нужный», и главная конструкция совпадает с русской: potrzebny KOMUŚ, человек в дательном, а нужная вещь в именительном — Potrzebna mi mąka «Мне нужна мука». Зато глагол от того же корня управляет иначе: potrzebuję mąki, родительный падеж. Эту пару — potrzebny mi X, но potrzebuję X-a — стоит запомнить вместе. Существительное — potrzeba: w razie potrzeby «в случае необходимости»."
idioms:
  - { pl: "potrzebny mi", ru: "мне нужен" }
  - { pl: "nie jest potrzebny", ru: "не нужен" }
  - { pl: "w razie potrzeby", ru: "в случае необходимости" }
