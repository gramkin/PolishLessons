notes:
  - { kind: government, text: "zakazać komuś czegoś: лицо — в ДАТЕЛЬНОМ падеже, запрещаемое — в РОДИТЕЛЬНОМ. Lekarz zakazał mu alkoholu «Врач запретил ему алкоголь». Винительного падежа этот глагол не берёт вовсе. Действие выражается либо отглагольным существительным в родительном (zakazał palenia), либо инфинитивом (zakazał mi palić)." }
  - { kind: false-friend, text: "Польское zakazać «запретить» и русское «заказать» сложены из одних и тех же частей — приставки за- и корня каз- — но значат совершенно разное. Так же расходятся и существительные: польское zakaz — это «запрет» (zakaz palenia «курение запрещено», zakaz wjazdu «въезд запрещён»), а русский «заказ» — это поручение, то, что заказали. Увидев в Польше табличку ZAKAZ, не ищите там приёма заказов." }
  - { kind: government, text: "Форма мужского лица zakazani существует, но только метонимически — о людях, чьи произведения под запретом: zakazani pisarze «запрещённые писатели», zakazani poeci. Запретить самого человека нельзя: «запретить кому-л. вход» — это zakazać komuś wstępu, где человек остаётся в дательном падеже." }
  - { kind: usage, text: "Совершенный вид; несовершенный — zakazywać. Страдательное причастие zakazany настолько прижилось, что живёт самостоятельным прилагательным: zakazany owoc «запретный плод», palenie zakazane «курение запрещено», wstęp zakazany «вход воспрещён»." }
collocations:
  - { pl: "zakazać komuś czegoś", ru: "запретить кому-л. что-л." }
  - { pl: "zakazać wstępu", ru: "запретить вход" }
  - { pl: "zakazany owoc", ru: "запретный плод" }
family:
  - { pl: "zakaz", ru: "запрет", relation: derived, id: zakaz }
  - { pl: "zakazywać", ru: "запрещать", relation: aspect }
  - { pl: "kazać", ru: "велеть, приказывать", relation: root, id: kazac }
  - { pl: "nakazać", ru: "предписать, велеть", relation: derived }
etymology: "Праславянское *kazati «показывать, указывать». От этого корня идут русские «казать», «показать», «указать», «приказать», «наказать» и польские kazać «велеть», rozkaz «приказ», nakaz «предписание», zakaz «запрет». Исходная мысль — именно указание: указать, чего делать нельзя, и значит запретить."
memory: "zakazać komuś czegoś: человек в дательном, запрет в родительном. И главное — zakaz это «запрет», а не «заказ»: табличка ZAKAZ PALENIA значит «курение запрещено»."
idioms:
