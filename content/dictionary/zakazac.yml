  - id: ban-officially
    ru: "запретить, наложить запрет (о властях, учреждении)"
    examples:
      - pl: "Władze zakażą handlu w niedzielę."
        ru: "Власти запретят торговлю по воскресеньям."
        source: { kind: authored }
