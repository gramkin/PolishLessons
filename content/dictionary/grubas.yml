# review
id: grubas
format: 2
lemma: "grubas"
rank: 4556
pos: noun
pron: { cyr: "гру́бас" }
senses:
  - id: fatso
    ru: "толстяк (разг.)"
    examples:
      - pl: "W szkole wołali na niego grubas."
        ru: "В школе его дразнили толстяком."
        source: { kind: authored }
      - pl: "Wesoły grubas zajął dwa miejsca w autobusie."
        ru: "Весёлый толстяк занял два места в автобусе."
        source: { kind: authored }
      - pl: "Mój kot to straszny grubas."
        ru: "Мой кот — ужасный толстяк."
        source: { kind: authored }
  - id: chubby
    ru: "толстячок (ласк., о ребёнке, животном)"
    examples:
      - pl: "Ale z niego słodki grubas!"
        ru: "Какой же он сладкий толстячок!"
        source: { kind: authored }
      - pl: "Nasz pies to mały grubas."
        ru: "Наша собака — маленький толстячок."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "GRUBAS — «толстяк», от GRUBY, «толстый». Не путайте с GRUBY = «грубый»: грубый — NIEGRZECZNY, CHAMSKI. Нейтрально о человеке — OSOBA Z NADWAGĄ." }
  - { kind: register, text: "О человеке — грубо и обидно, особенно в лицо. О животном или малыше — ласково. Вежливо — PULCHNY, «полный», или OTYŁY в медицине." }
  - { kind: usage, text: "Мужской род, одушевлённый. Множественное — GRUBASI: S смягчается. Местный и звательный — GRUBASIE." }
  - { kind: pronunciation, text: "Читается «гру́бас», ударение на первом слоге. GRUBASI — «груба́сьи»." }
collocations:
  - { pl: "wesoły grubas", ru: "весёлый толстяк" }
  - { pl: "mały grubas", ru: "толстячок" }
  - { pl: "stary grubas", ru: "старый толстяк" }
family:
  - { pl: "gruby", ru: "толстый", relation: root, id: gruby }
  - { pl: "otyły", ru: "тучный", relation: root }
  - { pl: "chudy", ru: "худой", relation: root }
etymology: "От GRUBY «толстый» с суффиксом -AS. Русское «грубый» — того же корня, но значение разошлось."
memory: "Grubas — толстяк; gruby — толстый, а не «грубый». О человеке обидно, о коте — ласково. Читается «гру́бас»."
idioms:
  - { pl: "gruba ryba", ru: "крупная рыба, важная персона" }
