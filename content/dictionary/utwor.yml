# review
id: utwor
format: 2
lemma: "utwór"
rank: 4908
pos: noun
pron: { cyr: "у́тфур" }
senses:
  - id: work
    ru: "произведение"
    examples:
      - pl: "To najważniejszy utwór polskiej poezji."
        ru: "Это важнейшее произведение польской поэзии."
        source: { kind: authored }
      - pl: "Orkiestra wykonała utwór na fortepian i smyczki."
        ru: "Оркестр исполнил произведение для фортепиано и струнных."
        source: { kind: authored }
      - pl: "Każdy utwór literacki ma swojego autora."
        ru: "У каждого литературного произведения есть автор."
        source: { kind: authored }
  - id: track
    ru: "трек, композиция, песня"
    examples:
      - pl: "Mój ulubiony utwór na tej płycie to trzeci."
        ru: "Моя любимая композиция на этом альбоме — третья."
        source: { kind: authored }
      - pl: "Puść jeszcze raz ten utwór!"
        ru: "Включи ещё раз этот трек!"
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "UTWÓR — «произведение», а не «утварь», хотя слова родственны: оба от «творить», по-польски TWORZYĆ. Домашняя утварь — SPRZĘT или NACZYNIA. В музыке UTWÓR — любая композиция, от сонаты до поп-песни на альбоме." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Ó в начальной форме, O в остальных: UTWÓR, UTWORU. В местном падеже R переходит в RZ: W UTWORZE." }
  - { kind: government, text: "Произведение для инструмента — UTWÓR NA FORTEPIAN, NA с винительным, где в русском «для». Чьё произведение — родительный: UTWÓR CHOPINA. Альбом из двенадцати треков — PŁYTA Z DWUNASTOMA UTWORAMI." }
  - { kind: pronunciation, text: "Читается «у́тфур», ударение на первом слоге. W после глухого T оглушается в «ф», Ó — «у»." }
  - { kind: register, text: "Слово нейтральное и юридическое: закон об авторском праве охраняет UTWORY. В разговоре о музыке говорят также KAWAŁEK, «вещь, трек», и PIOSENKA, «песня»." }
collocations:
  - { pl: "utwór muzyczny", ru: "музыкальное произведение" }
  - { pl: "utwór na fortepian", ru: "произведение для фортепиано" }
  - { pl: "utwór literacki", ru: "литературное произведение" }
family:
  - { pl: "tworzyć", ru: "творить, создавать", relation: root, id: tworzyc }
  - { pl: "twórca", ru: "творец, автор", relation: root }
  - { pl: "twórczość", ru: "творчество", relation: root }
etymology: "U- + TWÓR «творение», от TWORZYĆ «творить». Польское чередование Ó и O: TWÓR, TWORU, как WÓZ, WOZU. Тот же корень в русских «творение», «тварь», «утварь»."
memory: "Utwór — произведение, трек: от tworzyć «творить». Читается «у́тфур». Utwór na fortepian — произведение для фортепиано. Не путать с «утварью»."
idioms:
  - { pl: "na cały regulator", ru: "на полную громкость, на полную катушку" }
