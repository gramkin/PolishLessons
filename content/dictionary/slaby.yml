# review
id: slaby
format: 2
lemma: "słaby"
rank: 1039
pos: adj
pron: { cyr: "суа́бы" }
senses:
  - id: weak
    ru: "слабый"
    examples:
      - pl: "Byłem słaby."
        ru: "Я был слаб."
        source: { kind: translated, id: 10704035 }
      - pl: "On jest mały i słaby."
        ru: "Он маленький и слабый."
        source: { kind: translated, id: 675708 }
      - pl: "Byli słabi."
        ru: "Они были слабые."
        source: { kind: translated, id: 2679676 }
  - id: weak-side
    ru: "słabe strony — слабые стороны"
    examples:
      - pl: "Każdy ma swoje silne i słabe strony."
        ru: "У каждого есть свои сильные и слабые стороны."
        source: { kind: translated, id: 349061 }
      - pl: "Każdy ma swoje mocne i słabe strony."
        ru: "У каждого есть свои сильные и слабые стороны."
        source: { kind: translated, id: 3634722 }
      - pl: "Nie był świadom swych słabych stron."
        ru: "Он не осознавал своих слабых сторон."
        source: { kind: translated, id: 349340 }
  - id: weaker
    ru: "słabszy — слабее"
    examples:
      - pl: "Jen jest słabszy od dolara."
        ru: "Иена слабее доллара."
        source: { kind: translated, id: 367156 }
      - pl: "Z wiekiem stał się słabszy."
        ru: "С возрастом он стал слабее."
        source: { kind: translated, id: 3425212 }
      - pl: "Im jesteś starszy, tym pamięć słabsza."
        ru: "Чем ты старше, тем слабее память."
        source: { kind: translated, id: 983060 }
notes:
  - { kind: usage, text: "Прямая противоположность сразу двум карточкам: silny «сильный» о людях и ветре, mocny «крепкий» о кофе и материалах. Słaba kawa — «слабый кофе», słaby człowiek — «слабый человек»." }
  - { kind: usage, text: "słabe strony «слабые стороны» — устойчивое, в паре с mocne strony. Оба выражения совпадают с русскими." }
  - { kind: usage, text: "О здоровье говорят słabego zdrowia «слабого здоровья», с родительным падежом: Jest słabego zdrowia." }
  - { kind: usage, text: "Разговорно słaby значит ещё «плохой, никудышный»: słaby film «слабый фильм», słaba ocena «плохая оценка»." }
collocations:
  - { pl: "słabe strony", ru: "слабые стороны" }
  - { pl: "słaba kawa", ru: "слабый кофе" }
  - { pl: "słabego zdrowia", ru: "слабого здоровья" }
  - { pl: "słaby punkt", ru: "слабое место" }
family:
  - { pl: "silny", ru: "сильный", relation: antonym, id: silny }
  - { pl: "mocny", ru: "крепкий", relation: antonym, id: mocny }
  - { pl: "słabość", ru: "слабость", relation: derived }
etymology: "Праславянское *slabъ — то же слово, что русское «слабый», с тем же значением и без расхождений."
memory: "słaby — «слабый», и он противостоит сразу двум словам: silny «сильный» о людях и mocny «крепкий» о кофе. Słaba kawa, słaby człowiek. А słabe strony — «слабые стороны», как в русском."
idioms:
