notes:
  - { kind: register, text: "Это слово приподнятое, и в нём легко ошибиться регистром. По-польски о пожаре в быту скажут PALI SIĘ или COŚ SIĘ PALI: PALI SIĘ! — это крик «горим!». А PŁONĄĆ ближе к русскому «пылать»: оно годится для книги, для газетного заголовка, для стихов, но в бытовом разговоре звучит торжественно. Поэтому DOM PŁONIE встретишь в репортаже, а соседу крикнешь PALI SIĘ." }
  - { kind: false-friend, text: "Русского однокоренного глагола у PŁONĄĆ нет, зато есть однокоренные существительные, и через них слово запоминается. Корень тот же, что в русских «пламя» и «полымя», и в польском PŁOMIEŃ «пламя». То есть PŁONĄĆ буквально «пламенеть», и приподнятый тон у него именно оттуда. Русское «палить» и польское PALIĆ — это уже другой корень, хотя значения соседние: PALIĆ значит прежде всего «курить», как разобрано в карточке WYPALIĆ." }
  - { kind: government, text: "Чаще всего без дополнения: подлежащее — то, что горит. От чего горит человек — предлог Z с родительным или OD с родительным: PŁONĄĆ ZE WSTYDU, Z GNIEWU, Z MIŁOŚCI. Где — W или NA с местным: PŁONĄĆ W PIECU, NA PARAPECIE. Непереходный глагол, поэтому страдательных причастий нет вовсе, и форм пятьдесят две: сорок одна основная, десять форм действительного причастия PŁONĄCY и деепричастие PŁONĄC." }
  - { kind: pronunciation, text: "Класс на -ĄĆ, и мена ą/ę та же, что у WPŁYNĄĆ и OMINĄĆ: PŁONĄŁ с ą только в мужском единственном прошедшего, дальше всюду ę — PŁONĘŁA, PŁONĘŁO, PŁONĘLI, PŁONĘŁY. Начальное PŁ читается «пу», с ł как кратким у, так что весь инфинитив звучит «пуо́нонць». Повелительное PŁOŃ с мягким ń употребляется почти только в переносном смысле." }
collocations:
  - { pl: "płonąć ze wstydu", ru: "горѐть от стыда" }
  - { pl: "dom płonie", ru: "дом горит" }
  - { pl: "płonący las", ru: "горящий лес" }
family:
  - { pl: "palić się", ru: "гореть", relation: root, id: palic }
  - { pl: "płomień", ru: "пламя", relation: derived }
  - { pl: "spłonąć", ru: "сгореть", relation: root }
etymology: "Из праславянского *polnǫti «пылать», от корня *pol-, того же, что в русских «пламя» и «полымя», и в польском PŁOMIEŃ «пламя». Исходное значение — «становиться пламенем», и приподнятый тон слова идёт прямо оттуда: это не бытовое горение, а именно пламя. Русский глагол от этого корня не удержался, остались существительные, поэтому по чутью PŁONĄĆ не подставишь — зато через «пламя» и PŁOMIEŃ связь видна сразу. Переносное значение, о стыде и гневе, в обоих языках одно и то же и такое же старое: «горѐть от стыда» и PŁONĄĆ ZE WSTYDU."
memory: "płonąć — это «пылать», не бытовое «горит»: о пожаре соседу крикнешь pali się. Корень тот же, что в «пламя» и płomień."
idioms:
