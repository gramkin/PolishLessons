# review
id: okreslic
format: 2
lemma: "określić"
rank: 2003
pos: verb
aspect: perf
pron: { cyr: "окрэ́сьлиць" }
senses:
  - id: define
    ru: "определить, установить"
    examples:
      - pl: "Praktycznie nie mogłem określić, kto jest kim."
        ru: "Я практически не мог определить, кто есть кто."
        source: { kind: translated, id: 1801367 }
      - pl: "Nie określił jasno swego stanowiska."
        ru: "Он не определил ясно свою позицию."
        source: { kind: translated, id: 357277 }
      - pl: "Na formularzu zamówienia określić wielkość, kolor i typ."
        ru: "В бланке заказа укажите размер, цвет и тип."
        source: { kind: translated, id: 757223 }
  - id: specified
    ru: "определённый, заданный (о причастии określony)"
    examples:
      - pl: "Organizmy mają określoną długość życia."
        ru: "У организмов есть определённая продолжительность жизни."
        source: { kind: translated, id: 9679690 }
      - pl: "Nie ma określonych reguł co do ubioru."
        ru: "Нет определённых правил насчёт одежды."
        source: { kind: translated, id: 753887 }
  - id: label
    ru: "назвать, охарактеризовать (кого-л. как кого-л.)"
    examples:
      - pl: "Nauczyciel określił Tomcia jako niezapisaną tablicę."
        ru: "Учитель назвал Томека чистым листом."
        source: { kind: translated, id: 13769395 }
notes:
  - { kind: usage, text: "Совершенный вид; несовершенный — określać." }
  - { kind: government, text: "określić coś jako coś «определить что-л. как что-л.»: określił go jako geniusza." }
  - { kind: usage, text: "Причастие określony «определённый» очень частотно: w określonym terminie «в определённый срок», ściśle określony «строго определённый»." }
  - { kind: false-friend, text: "Не «окрестить». Корень — kreślić «чертить», от kreska «черта»: определить значит «очертить»." }
collocations:
  - { pl: "określić warunki", ru: "определить условия" }
  - { pl: "w określonym terminie", ru: "в определённый срок" }
etymology: "o- + kreślić «чертить», от kreska «черта»: «очертить границы» → «определить». Русское «определить» собрано похоже — «положить предел»."
memory: "określić — «определить», буквально «очертить» (kreska «черта»). Несовершенный вид — określać. Причастие określony «определённый» встречается ещё чаще самого глагола: w określonym terminie."
idioms:
  - { pl: "ściśle określony", ru: "строго определённый" }
  - { pl: "określić warunki", ru: "определить условия" }
