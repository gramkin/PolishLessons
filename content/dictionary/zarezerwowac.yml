# review
id: zarezerwowac
format: 2
lemma: "zarezerwować"
rank: 4324
pos: verb
pron: { cyr: "зарезерво́ваць" }
senses:
  - id: book
    ru: "забронировать, зарезервировать (столик, номер, билет)"
    examples:
      - pl: "Zarezerwuję stolik na ósmą."
        ru: "Я забронирую столик на восемь."
        source: { kind: authored }
      - pl: "Trzeba zarezerwować stolik z wyprzedzeniem."
        ru: "Надо забронировать столик заранее."
        source: { kind: authored }
      - pl: "Ten stolik jest już zarezerwowany."
        ru: "Этот столик уже забронирован."
        source: { kind: authored }
  - id: set-aside
    ru: "отложить, оставить (место, время, средства)"
    examples:
      - pl: "Zarezerwuj sobie trochę czasu."
        ru: "Оставь себе немного времени."
        source: { kind: authored }
      - pl: "Zarezerwowałem sobie wolny wieczór."
        ru: "Я оставил себе свободный вечер."
        source: { kind: authored }
notes:
  - { kind: government, text: "zarezerwować coś — ВИНИТЕЛЬНЫЙ падеж: zarezerwować stolik, pokój, bilety, salę. Дополнением может быть и человек, когда речь о его времени: zarezerwować fotografa, zarezerwować nianię «заказать фотографа, няню». Поэтому мужсколичная форма zarezerwowani тоже употребима — о заранее ангажированных людях." }
  - { kind: false-friend, text: "Польское rezerwacja значит «бронь, бронирование»: mam rezerwację — «у меня бронь». Русское «резервация» так не употребляется: оно значит отведённую территорию, индейскую резервацию, а бронь по-русски — «бронирование» или «бронь». Это одна из самых заметных ловушек в туристической лексике." }
  - { kind: usage, text: "Совершенный вид; несовершенный — rezerwować. Приставка za- даёт завершённость: rezerwuję pokój «я бронирую номер» — zarezerwuję pokój «я забронирую номер»." }
  - { kind: usage, text: "Не путайте zarezerwować «забронировать» и zamówić «заказать». Бронь придерживает место или время, заказ означает, что вещь или услугу уже заказали: zarezerwowałem stolik, ale jeszcze nic nie zamówiłem." }
collocations:
  - { pl: "zarezerwować stolik", ru: "забронировать столик" }
  - { pl: "zarezerwować pokój", ru: "забронировать номер" }
  - { pl: "mieć rezerwację", ru: "иметь бронь" }
family:
  - { pl: "rezerwować", ru: "бронировать", relation: aspect }
  - { pl: "rezerwacja", ru: "бронь, бронирование", relation: derived }
  - { pl: "rezerwa", ru: "резерв, запас", relation: root }
etymology: "Приставка za- и глагол rezerwować, заимствованный из западноевропейских языков: французское réserver и латинское reservare, то есть re- «назад» и servare «хранить, беречь». Тот же латинский корень дал «консервировать» и «обсерваторию». Русский построил своё слово из того же материала — «зарезервировать», — но в значении «бронь» предпочитает «бронировать»."
memory: "zarezerwować coś — забронировать, винительный падеж. Главная ловушка в однокоренном существительном: rezerwacja — это «бронь», а вовсе не «резервация». Mam rezerwację значит «у меня забронировано»."
idioms:
  - { pl: "mieć zarezerwowany stolik", ru: "иметь забронированный столик" }
  - { pl: "zarezerwować sobie czas", ru: "выделить, оставить себе время" }
