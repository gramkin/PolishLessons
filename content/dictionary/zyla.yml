notes:
  - { kind: false-friend, text: "Польская ŻYŁA прежде всего вена: укол в вену — ZASTRZYK DO ŻYŁY, взять кровь из вены — POBRAĆ KREW Z ŻYŁY. Русская «жила» чаще значит сухожилие или рудную жилу, а сухожилие по-польски ŚCIĘGNO. Слово ŻYŁKA тоже с подвохом: это и «жилка», и рыболовная леска, ŻYŁKA WĘDKARSKA, а MIEĆ ŻYŁKĘ DO HANDLU — «иметь коммерческую жилку». И не путайте с WENA: это не вена, а вдохновение." }
  - { kind: usage, text: "Десять форм, женский род. В дательном и местном падежах Ł переходит в L: ŻYŁA, но W ŻYLE. Родительный множественного — ŻYŁ, без окончания. Варикозное расширение вен называют ŻYLAKI, во множественном числе." }
  - { kind: government, text: "В вену — DO ŻYŁY, родительный после DO. Из вены — Z ŻYŁY, тоже родительный. В вене — W ŻYLE, местный, с переходом Ł в L. Надрываться на работе — WYPRUWAĆ SOBIE ŻYŁY, винительный множественного." }
  - { kind: pronunciation, text: "Читается «жы́уа», два слога, ударение на первом. Ż даёт «ж», и после него Y звучит как «ы». Ł произносится как короткое «у». В форме ŻYLE стоит обычное L: «жы́ле»." }
  - { kind: register, text: "В медицине слово нейтральное и частое: ŻYŁA SZYJNA, ŻYŁA WROTNA. В переносном смысле живут устойчивые обороты: ŻYŁA ZŁOTA о выгодном деле, WYPRUWAĆ SOBIE ŻYŁY о тяжёлом труде, MROZIĆ KREW W ŻYŁACH о страшном." }
collocations:
  - { pl: "żyła szyjna", ru: "яремная вена" }
  - { pl: "wstrzyknąć do żyły", ru: "ввести в вену" }
