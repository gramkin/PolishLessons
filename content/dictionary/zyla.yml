etymology: "Слово праславянское, общее с русским «жила». В польском главным стало значение «кровеносный сосуд», тогда как русский для вены взял латинское слово. Родственно литовскому GYSLA с тем же смыслом."
memory: "Żyła — это вена, а не сухожилие: укол в вену — zastrzyk do żyły. Читается «жы́уа», в местном падеже w żyle. Żyłka — жилка и рыболовная леска. Żyła złota — золотая жила. И не путайте с wena: это вдохновение."
idioms:
  - { pl: "żyła złota", ru: "золотая жила" }
  - { pl: "wypruwać sobie żyły", ru: "рвать жилы, надрываться" }
  - { pl: "mrozić krew w żyłach", ru: "леденить кровь в жилах" }
