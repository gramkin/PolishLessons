        source: { kind: tatoeba, id: 440524 }
  - id: fed-up
    ru: "уставший от чего-л., которому что-л. надоело"
    note: "Управление творительным без предлога: zmęczony pracą «уставший от работы»."
    examples:
      - pl: "Byli zmęczeni."
        ru: "Они были уставшими."
        source: { kind: tatoeba, id: 6541895 }
      - pl: "Jestem zmęczony tymi kłótniami."
        ru: "Я устал от этих ссор."
        source: { kind: authored }
      - pl: "Był zmęczony ciągłym czekaniem."
        ru: "Он устал от постоянного ожидания."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Это страдательное причастие от zmęczyć «утомить», работающее как прилагательное. «Я устал» по-польски — jestem zmęczony, буквально «я есть уставший»: связка обязательна, а форма меняется по роду (jestem zmęczona)." }
  - { kind: usage, text: "Управление своё: zmęczony czymś — творительный падеж без предлога. zmęczony pracą «уставший от работы», zmęczony podróżą «уставший от поездки»." }
  - { kind: false-friend, text: "Не путайте zmęczony и męczący. zmęczony — тот, кто устал; męczący — тот, кто утомляет других: męczący człowiek «утомительный человек»." }
  - { kind: usage, text: "Степеней сравнения у причастия нет: «более уставший» будет bardziej zmęczony." }
collocations:
  - { pl: "jestem zmęczony", ru: "я устал" }
  - { pl: "zmęczony pracą", ru: "уставший от работы" }
  - { pl: "zmęczona twarz", ru: "усталое лицо" }
  - { pl: "śmiertelnie zmęczony", ru: "смертельно уставший" }
family:
  - { pl: "zmęczyć", ru: "утомить", relation: derived }
  - { pl: "zmęczenie", ru: "усталость", relation: derived }
  - { pl: "męczyć", ru: "мучить, утомлять", relation: derived }
etymology: "Страдательное причастие от zmęczyć «утомить», в основе męka «мука, мучение» — та же праславянская основа, что в русском «мука» и «мучить». Буквально «измученный, доведённый до усталости»."
memory: "zmęczony — «уставший». Связка обязательна и род тоже: jestem zmęczony / jestem zmęczona. Управление своё — творительный без предлога: zmęczony pracą «уставший от работы», а не «od pracy». Степеней сравнения нет, только bardziej zmęczony. И не путайте с męczący: zmęczony тот, кто устал, męczący тот, кто утомляет других."
idioms:
  - { pl: "śmiertelnie zmęczony", ru: "смертельно уставший" }
  - { pl: "zmęczony jak pies", ru: "устал как собака" }
  - { pl: "mieć zmęczoną minę", ru: "выглядеть усталым" }
