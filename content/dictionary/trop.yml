# review
id: trop
format: 2
lemma: "trop"
rank: 2221
pos: noun
pron: { cyr: "троп" }
senses:
  - id: track
    ru: "след (зверя, человека)"
    examples:
      - pl: "Pies wziął trop i pobiegł."
        ru: "Собака взяла след и побежала."
        source: { kind: authored }
      - pl: "Tropy prowadziły prosto do lasu."
        ru: "Следы вели прямо в лес."
        source: { kind: authored }
  - id: lead
    ru: "след, зацепка (в расследовании)"
    examples:
      - pl: "Policja ma nowy trop."
        ru: "У полиции новый след."
        source: { kind: authored }
      - pl: "To był fałszywy trop."
        ru: "Это был ложный след."
        source: { kind: authored }
      - pl: "Byli na tropie od miesiąca."
        ru: "Они были на следу месяц."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Русская «тропа» — ближайшее по звучанию слово, и образ у них общий: протоптанная ногами дорожка. Но значения разошлись. Польское trop это СЛЕД, отпечаток, по которому идут: trop zwierzęcia, iść czyimś tropem, fałszywy trop. Русская «тропа» — сама дорожка, по-польски ścieżka. По-польски идут tropem, а по русской тропе ходят." }
  - { kind: usage, text: "Переносное значение, «зацепка в расследовании», такое же живое, как прямое: policja ma nowy trop, fałszywy trop, być na tropie. Глагол tropić значит «выслеживать», а tropiciel — «следопыт»." }
  - { kind: pronunciation, text: "Один слог, «троп». В предложном падеже p смягчается: na tropie — «на тро́пе». В многосложных формах ударение всегда на предпоследнем: tropami — «тропа́ми»." }
collocations:
  - { pl: "być na tropie", ru: "быть на следу" }
  - { pl: "fałszywy trop", ru: "ложный след" }
  - { pl: "iść czyimś tropem", ru: "идти по чьему-л. следу" }
family:
  - { pl: "tropić", ru: "выслеживать", relation: derived }
  - { pl: "tropiciel", ru: "следопыт", relation: derived }
  - { pl: "wytropić", ru: "выследить", relation: derived }
etymology: "Слово связано с корнем со значением «топать, ступать» — тем же, что в русских «топать» и «тропа». Образ прозрачен: и след, и тропа оставлены ногами. Но польское trop закрепилось за отпечатком, а русская «тропа» — за дорожкой. Отсюда tropić, tropiciel и wytropić."
memory: "trop — «след», а не «тропа». Образ общий, ноги оставляют и то и другое, но польское слово про отпечаток, а русское про дорожку; тропинка по-польски ścieżka. И переносно: policja ma nowy trop — «у полиции новая зацепка»."
idioms:
  - { pl: "być na tropie", ru: "быть на следу" }
  - { pl: "fałszywy trop", ru: "ложный след" }
