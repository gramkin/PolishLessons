        ru: "Его партнёрша подвернула лодыжку."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "TANCERKA — «танцовщица», женская форма от TANCERZ. Балерина — BALETNICA или TANCERKA BALETOWA. Бальные танцы — TAŃCE TOWARZYSKIE, партнёрша — PARTNERKA или TANCERKA." }
  - { kind: usage, text: "Девять форм, женский род. В дательном и местном K переходит в C: O TANCERCE. Родительный множественного — TANCEREK, с беглым E. Звательный TANCERKO не учим." }
  - { kind: government, text: "Стать танцовщицей — ZOSTAĆ TANCERKĄ, творительный. Танцевать с партнёршей — TAŃCZYĆ Z TANCERKĄ. Труппа танцовщиц — ZESPÓŁ TANCEREK." }
  - { kind: pronunciation, text: "Читается «танце́рка»: CE — «це», ударение на предпоследнем слоге. TANCERCE — «танце́рце»." }
collocations:
  - { pl: "tancerka baletowa", ru: "балерина" }
  - { pl: "profesjonalna tancerka", ru: "профессиональная танцовщица" }
  - { pl: "zostać tancerką", ru: "стать танцовщицей" }
family:
  - { pl: "tancerz", ru: "танцор", relation: root }
  - { pl: "taniec", ru: "танец", relation: root, id: taniec }
  - { pl: "tańczyć", ru: "танцевать", relation: root, id: tanczyc }
etymology: "От TANIEC «танец», а то — из средневерхненемецкого TANZ. Русское «танец» того же происхождения."
memory: "Tancerka — танцовщица; tancerz — танцор. Tancerka baletowa — балерина. Читается «танце́рка»."
idioms:
