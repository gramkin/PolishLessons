        ru: "Танцовщицы репетируют каждый день по шесть часов."
        source: { kind: authored }
  - id: partner
    ru: "партнёрша по танцам"
    examples:
      - pl: "Szukam tancerki na kurs salsy."
        ru: "Ищу партнёршу на курс сальсы."
