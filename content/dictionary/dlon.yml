  - { pl: "ręka", ru: "рука", relation: root }
etymology: "Праславянское *dolnь — то же слово, что русская «ладонь», только в русском согласные переставились местами: dolnь дало «долонь», а потом «ладонь»."
memory: "dłoń — «ладонь, кисть руки», женский род. Вся рука от плеча — это ręka, и польский их различает там, где русский обходится одним словом. Читается «дуонь»: ł даёт у."
idioms:
