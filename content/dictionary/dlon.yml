notes:
  - { kind: false-friend, text: "dłoń — это ладонь или кисть руки, а вся рука от плеча — ręka. Русское «рука» покрывает оба, польский различает." }
  - { kind: usage, text: "Женский род на мягкий согласный: ta dłoń, tej dłoni. Родительный и предложный совпадают — dłoni." }
  - { kind: usage, text: "uścisnąć dłoń «пожать руку» — стандартный оборот приветствия, буквально «сжать ладонь»." }
  - { kind: usage, text: "У творительного множественного два варианта: dłońmi и dłoniami. В живой речи чаще dłońmi." }
collocations:
  - { pl: "uścisnąć dłoń", ru: "пожать руку" }
  - { pl: "otworzyć dłoń", ru: "открыть ладонь" }
  - { pl: "jak na dłoni", ru: "как на ладони" }
  - { pl: "pomocna dłoń", ru: "рука помощи" }
family:
