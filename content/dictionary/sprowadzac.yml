        ru: "Мы ввозим из Австралии много вещей."
        source: { kind: translated, id: 3996409 }
      - pl: "Sprowadzamy części z Niemiec."
        ru: "Мы ввозим детали из Германии."
        source: { kind: authored }
  - id: bring-here
    ru: "приводить, сводиться (sprowadzać się)"
    examples:
      - pl: "Co cię sprowadza?"
        ru: "Что тебя привело?"
        source: { kind: translated, id: 9841201 }
      - pl: "Wszystko i tak sprowadza się do tego samego."
        ru: "Всё и так сводится к одному и тому же."
        source: { kind: translated, id: 771737 }
notes:
  - { kind: usage, text: "Co cię sprowadza? «Что тебя привело?» — стандартная вежливая формула при встрече, буквально «что тебя приводит»." }
  - { kind: government, text: "Ввозить откуда — z с родительным: sprowadzać z Brazylii. Сводиться к чему — się plus do с родительным: sprowadza się do tego samego." }
  - { kind: usage, text: "Совершенный вид — sprowadzić." }
  - { kind: false-friend, text: "Корень prowadzić «вести» — ср. русское «проводить», «привести»." }
collocations:
  - { pl: "co cię sprowadza?", ru: "что тебя привело?" }
  - { pl: "sprowadzać się do", ru: "сводиться к" }
etymology: "s- + prowadzić «вести»; ср. русское «сводить», «привести»."
memory: "sprowadzać — «ввозить, привозить», а с się «сводиться к». Запомните вежливое Co cię sprowadza? «Что тебя привело?». Совершенный вид — sprowadzić."
