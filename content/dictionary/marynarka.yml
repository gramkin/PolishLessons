notes:
  - { kind: false-friend, text: "ОДНО СЛОВО НА ПИДЖАК И НА ФЛОТ. Оба значения идут от латинского marinus «морской»: marynarka wojenna это «военно-морской флот», а marynarka без определения — обычный ПИДЖАК, тот, что висит на спинке стула. Второе выросло из морской куртки. Любопытно, что русский проделал тот же путь другой дорогой: «пиджак» пришёл из английского pea jacket, тоже морской одежды. Слова разные, история одна." }
  - { kind: pronunciation, text: "В дательном и предложном k переходит в c: marynarka, но w marynarce — «в марына́рцэ». То же чередование, что в paczka → w paczce и fabryka → w fabryce." }
  - { kind: usage, text: "Родительный множественного с беглым e: marynarek, как paczek и matek — без вставного e сочетание -rk- на конце не произнести. Глагол marynować «мариновать» приходится слову роднёй: маринад это буквально «морская вода», рассол." }
collocations:
  - { pl: "marynarka wojenna", ru: "военно-морской флот" }
  - { pl: "włożyć marynarkę", ru: "надеть пиджак" }
  - { pl: "marynarka handlowa", ru: "торговый флот" }
family:
  - { pl: "marynarz", ru: "моряк", relation: derived }
  - { pl: "marynarski", ru: "морской, матросский", relation: derived }
  - { pl: "marynować", ru: "мариновать", relation: derived }
etymology: "От латинского marinus «морской» через итальянский и французский. Значение «флот» прямое, а «пиджак» выросло из морской куртки. От того же латинского корня marynarz «моряк», marynarski и даже marynować «мариновать»: мариновать значит класть в рассол, то есть в «морскую воду»."
memory: "marynarka — это и «пиджак», и «флот»: marynarka wojenna военный флот, а просто marynarka на вешалке пиджак. Оба значения от латинского «морской». Падеж тот же, что у paczka: w marynarce, с переходом k в c."
idioms:
  - { pl: "marynarka wojenna", ru: "военно-морской флот" }
  - { pl: "włożyć marynarkę", ru: "надеть пиджак" }
