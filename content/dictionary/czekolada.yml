notes:
  - { kind: false-friend, text: "Ловушка в роде, и она обратна той, что в карточке PODPIS. Русский «шоколад» мужского рода, польская CZEKOLADA — женского, и согласование идёт женское во всём: TA CZEKOLADA, DOBRA CZEKOLADA, GORĄCA CZEKOLADA, CAŁA CZEKOLADA SIĘ ROZPUŚCIŁA. Русский по привычке скажет ten czekolad, и это слышно сразу. Причина расхождения простая и видна в самом слове: оба языка взяли испанское chocolate, но польский прибавил -a и получил женское слово, а русский отбросил конечную гласную и получил мужское." }
  - { kind: usage, text: "Дательный и местный — CZEKOLADZIE, с переходом d в dź, который перед гласной пишется dzi. Это четвёртый случай в словаре после URZĘDZIE, MODZIE и STADZIE. Родительный множественного — CZEKOLAD, голая основа без окончания, как blizn, ław и szyb. Форма эта значит не «шоколада вообще», а отдельные плитки по счёту: pięć czekolad — пять шоколадок." }
  - { kind: usage, text: "Слово покрывает больше, чем русский «шоколад». Оно значит и само вещество, и плитку как предмет (точнее будет TABLICZKA CZEKOLADY), и напиток — GORĄCA CZEKOLADA, то есть русский «горячий шоколад». Конфета же называется отдельным словом CZEKOLADKA, с уменьшительным суффиксом, и русская «шоколадка» ему соответствует только наполовину, потому что по-русски так называют и плитку." }
