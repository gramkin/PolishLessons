etymology: "Через испанское CHOCOLATE из языка науатль, где xocolātl значило примерно «горькая вода». Оба языка взяли слово из одного источника и почти одновременно, но приспособили по-своему: польский добавил окончание -a и слово стало женским, русский отбросил конечную гласную и получил мужское. Род здесь — целиком следствие того, как каждый язык подогнал чужое слово под свою грамматику."
memory: "Женского рода, в отличие от русского «шоколада»: ta czekolada. Местный czekoladzie — d даёт dzi. А конфета — это czekoladka."
