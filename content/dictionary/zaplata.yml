etymology: "От ZAPŁACIĆ «заплатить», с приставкой ZA- и корнем PŁAĆ-, из праславянского *platiti, а то от *platъ «кусок полотна». Этимология здесь та же, что у SPŁACIĆ на предыдущей карточке: платили когда-то тканью, и слово для платежа выросло из слова для полотна. Русская «плата» и «оплата» идут от того же корня и означают то же самое. А вот русская «заплата» принадлежит другому гнезду, от «латать» и «лата», и созвучие с польским ZAPŁATA чисто случайное — что делает эту пару особенно опасной, потому что обе выглядят как очевидные родственники и ими не являются. Польская латка называется ŁATA, и в ней виден тот самый русский корень."
memory: "Плата, а не «заплата»: русская заплата по-польски łata, от другого корня. Созвучие случайное, и это самая опасная разновидность ложного друга. Ł читается «у»: «запуа́та». Дательный и местный — zapłacie, с t→c, как kobieta — kobiecie. В деловом языке различать zapłata «плата за товар» и opłata «сбор, пошлина». Корень тот же, что в spłacić: от *platъ «кусок ткани»."
