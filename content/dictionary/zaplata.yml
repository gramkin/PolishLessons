notes:
  - { kind: false-friend, text: "Самая резкая ловушка этой карточки в созвучии с русским словом совсем другого значения. ZAPŁATA значит «плата, оплата»: ZAPŁATA ZA TOWAR, DOMAGAĆ SIĘ ZAPŁATY. Русская «заплата» — это латка на одежде, и по-польски она называется ŁATA. Слова звучат почти одинаково и не имеют общего значения, хотя корни разные: польское от PŁACIĆ «платить», русское от «латать». Поэтому BEZ ZAPŁATY это «без оплаты», а не «без заплаты». Русские соответствия выбираются по контексту: «плата» о сумме, «оплата» о действии, «расплата» о воздаянии." }
  - { kind: government, text: "Женский род на -TA, и дательный с местным единственного дают ZAPŁACIE, с чередованием T в C перед окончанием -E. Это то же правило, что в KOBIETA и KOBIECIE, GAZETA и GAZECIE, и оно идёт в один ряд с k→c у слов на -KA. За что платят — предлог ZA с винительным: ZAPŁATA ZA TOWAR, ZAPŁATA ZA PRACĘ. Кому — дательный: ZAPŁATA DLA WYKONAWCY через предлог DLA с родительным. Винительный на -Ę: OTRZYMAĆ ZAPŁATĘ. Родительный множественного ZAPŁAT, без окончания." }
  - { kind: pronunciation, text: "Читается «запуа́та», ударение на предпоследнем слоге из трёх. Буква Ł даёт «у», а не «л», и это главное место ошибки, потому что русское созвучие подсказывает «заплата». Сочетание PŁ звучит «пу», почти как один слог с гласной. В дательном и местном ZAPŁACIE буква T переходит в C и читается «ць»: «запуа́це». В родительном множественного ZAPŁAT два слога: «запуа́т»." }
  - { kind: usage, text: "Частотные сочетания: ZAPŁATA ZA TOWAR, TERMIN ZAPŁATY «срок оплаты», DOMAGAĆ SIĘ ZAPŁATY «требовать оплаты», BEZ ZAPŁATY, ZAPŁATA GOTÓWKĄ «оплата наличными». В счётах и договорах стоит именно ZAPŁATA, а не OPŁATA: второе означает сбор или пошлину, OPŁATA ZA PRZEJAZD «плата за проезд», OPŁATA SKARBOWA «государственная пошлина». Различение этих двух слов важно в деловом языке. Глагол ZAPŁACIĆ «заплатить» и его родственник SPŁACIĆ «погасить» уже есть в словаре." }
