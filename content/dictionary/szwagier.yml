id: szwagier
format: 2
lemma: "szwagier"
rank: 5087
pos: noun
pron: { cyr: "шва́гер" }
senses:
  - id: brother-in-law
    ru: "зять, шурин, деверь, свояк"
    examples:
      - pl: "Mój szwagier jest mechanikiem."
        ru: "Мой зять — механик."
        source: { kind: authored }
      - pl: "Na święta przyjechał szwagier z żoną."
        ru: "На праздники приехал шурин с женой."
        source: { kind: authored }
      - pl: "Pożyczyłem samochód od szwagra."
        ru: "Я одолжил машину у свояка."
        source: { kind: authored }
  - id: pal
    ru: "приятель, «братан» (разг.)"
    examples:
      - pl: "Siema, szwagier, co słychać?"
        ru: "Привет, братан, как дела?"
        source: { kind: authored }
      - pl: "Szwagier, pomożesz mi z meblami?"
        ru: "Братан, поможешь мне с мебелью?"
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "SZWAGIER — одно слово на все русские «зять, шурин, деверь, свояк»: муж сестры, брат жены, брат мужа, муж сестры жены. Польский не различает их. Женский вариант — SZWAGIERKA: «золовка, свояченица, невестка»." }
  - { kind: usage, text: "Десять форм, мужской род, лицо. E беглое: SZWAGIER, но SZWAGRA. Множественное — SZWAGROWIE. Местный и звательный — SZWAGRZE; в разговоре зовут и просто SZWAGIER." }
  - { kind: government, text: "У зятя — U SZWAGRA, родительный. Со свояком — ZE SZWAGREM, творительный. Помочь шурину — POMÓC SZWAGROWI, дательный." }
  - { kind: pronunciation, text: "Читается «шва́гер»: SZ — «ш», W — «в», GIER — «гер». Ударение на первом слоге. SZWAGRA — «шва́гра»." }
collocations:
  - { pl: "mój szwagier", ru: "мой зять, шурин" }
  - { pl: "szwagier i szwagierka", ru: "зять и золовка" }
  - { pl: "pożyczyć od szwagra", ru: "одолжить у свояка" }
family:
  - { pl: "szwagierka", ru: "золовка, свояченица", relation: derived }
  - { pl: "teściowa", ru: "тёща, свекровь", relation: root }
  - { pl: "brat", ru: "брат", relation: root, id: brat }
etymology: "Из немецкого SCHWAGER «зять, шурин». В русском такого общего слова нет, отсюда россыпь отдельных названий."
memory: "Szwagier — зять, шурин, деверь, свояк: одно слово на всех. Szwagierka — золовка. U szwagra — у зятя. Читается «шва́гер»."
idioms:
  - { pl: "siema, szwagier", ru: "здорово, братан (фамильярное приветствие)" }
