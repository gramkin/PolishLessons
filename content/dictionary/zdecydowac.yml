# review
id: zdecydowac
format: 2
lemma: "zdecydować"
rank: 527
pos: verb
aspect: perf
pron: { cyr: "здэцыдо́ваць" }
senses:
  - id: decide
    ru: "решить, принять решение"
    note: "zdecydować o czymś «решить что-либо», с предлогом o и предложным."
    examples:
      - pl: "Muszę zdecydować, co robić."
        ru: "Мне нужно решить, что делать."
        source: { kind: tatoeba, id: 4716821 }
      - pl: "Musisz zdecydować."
        ru: "Ты должен решить."
        source: { kind: translated, id: 8448605 }
      - pl: "Zdecydowaliśmy głosowaniem."
        ru: "Мы решили голосованием."
        source: { kind: translated, id: 359291 }
  - id: decide-to
    ru: "zdecydować się na coś — решиться на что-либо"
    note: "С się и предлогом na плюс винительный: zdecydować się na wyjazd."
    examples:
      - pl: "Zdecydował się wyjechać za granicę."
        ru: "Он решил уехать за границу."
        source: { kind: tatoeba, id: 575448 }
      - pl: "Zdecydowała się wyjść za Toma."
        ru: "Она решила выйти за Тома."
        source: { kind: tatoeba, id: 1454807 }
      - pl: "Zdecydowałeś się na wyjazd do Japonii?"
        ru: "Ты решил поехать в Японию?"
        source: { kind: translated, id: 3031627 }
  - id: determined
    ru: "zdecydowany — решительный; решившийся"
    note: "Причастие давно стало прилагательным: zdecydowana większość «подавляющее большинство»."
    examples:
      - pl: "Jest zdecydowany jechać do Anglii."
        ru: "Он твёрдо решил поехать в Англию."
        source: { kind: translated, id: 930176 }
      - pl: "Zdecydowana większość osób zgadza się na ten plan."
        ru: "Подавляющее большинство людей согласно с этим планом."
        source: { kind: translated, id: 3605046 }
      - pl: "Trudne czasy wymagają zdecydowanych działań."
        ru: "Трудные времена требуют решительных действий."
        source: { kind: translated, id: 1042215 }
notes:
  - { kind: government, text: "Две конструкции: zdecydować o czymś «решить что-либо» (предлог o, предложный падеж) и zdecydować się na coś «решиться на что-либо» (предлог na, винительный)." }
  - { kind: usage, text: "Несовершенный вид — decydować. Zdecydowałem się значит «я решился», а сам глагол без się — «я решил»." }
  - { kind: usage, text: "Причастие zdecydowany давно стало прилагательным «решительный; решившийся»: jestem zdecydowany «я решился», zdecydowana większość «подавляющее большинство»." }
  - { kind: usage, text: "Наречие zdecydowanie значит «безусловно, решительно» и в разговоре часто стоит отдельным словом: Zdecydowanie! «Безусловно!»" }
collocations:
  - { pl: "zdecydować się na coś", ru: "решиться на что-либо" }
  - { pl: "zdecydowana większość", ru: "подавляющее большинство" }
  - { pl: "zdecyduj się", ru: "решайся" }
  - { pl: "zdecydowanie!", ru: "безусловно!" }
family:
  - { pl: "decydować", ru: "решать", relation: root }
  - { pl: "decyzja", ru: "решение", relation: derived }
  - { pl: "zdecydowanie", ru: "решительность; безусловно", relation: derived }
etymology: "Приставка z- плюс decydować, из латинского decidere «отсекать, решать» через немецкое dezidieren — то же слово, что русское «децизия» в старых текстах и современное «решение» через decyzja."
memory: "zdecydować — «решить», и у него две конструкции: zdecydować o czymś «решить что-либо», с предлогом o и предложным падежом, и zdecydować się na coś «решиться на что-либо», с się, предлогом na и винительным. Несовершенный вид — decydować. Причастие zdecydowany давно стало прилагательным «решительный»: zdecydowana większość «подавляющее большинство», а наречие zdecydowanie в разговоре значит просто «безусловно»."
idioms:
  - { pl: "zdecydować się na coś", ru: "решиться на что-либо" }
  - { pl: "zdecydowana większość", ru: "подавляющее большинство" }
  - { pl: "Zdecydowanie!", ru: "Безусловно!" }
