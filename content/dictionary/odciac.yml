notes:
  - { kind: usage, text: "ТРИ основы в одной парадигме, и это главная трудность слова. В настоящем времени -ciąć уступает место -etn-: odciąć, но odetnę, odetniesz, odetnie, odetną; повелительное тоже odetnij. В прошедшем возвращается ci- с позиционным чередованием ą/ę: odciął в мужском единственном, но odcięła, odcięło, odcięli, odcięły во всех остальных. Причастие и существительное держат ę: odcięty, odcięcie." }
  - { kind: false-friend, text: "Прозрачна только приставка. Корень ciąć идёт от праславянского *tęti «рубить, резать», которое в современном русском не сохранилось (остались лишь устаревшие формы), поэтому подбирать похожее русское слово не стоит — его нет. Перевод выбирают по смыслу: «отрезать», «отсечь» или «отключить». Зато od- это в точности «от-»." }
  - { kind: government, text: "Отрезать ЧТО — винительный: odciąć gałąź, odciąć palec. Отрезать КОГО или ЧТО ОТ чего — od с РОДИТЕЛЬНЫМ: odciąć wieś OD drogi, odcięci OD świata. Возвратное odciąć się od czegoś значит «отгородиться, отмежеваться»." }
  - { kind: pronunciation, text: "Приставка od- отвечает русскому «от-» и несёт отделение или отказ: odciąć «отрезать», odrzucić «отвергнуть», odejść «отойти», odmówić «отказать». Это одна из самых прозрачных польских приставок для русскоязычного, и опираться на неё можно смело." }
collocations:
  - { pl: "odciąć prąd", ru: "отключить свет" }
  - { pl: "odcięty od świata", ru: "отрезанный от мира" }
  - { pl: "odciąć się od czegoś", ru: "отмежеваться от чего-л." }
family:
  - { pl: "ciąć", ru: "резать, рубить", relation: root }
  - { pl: "odcinek", ru: "отрезок; серия", relation: derived, id: odcinek }
  - { pl: "odcinać", ru: "отрезать, отсекать", relation: aspect }
etymology: "Приставка od- плюс ciąć, от праславянского *tęti «рубить». Корень в русском языке почти исчез — живы только устаревшие и диалектные следы, — поэтому прямого соответствия у польского ciąć нет, и честнее это сказать, чем подыскивать созвучие. Приставка же полностью совпадает с русским «от-», а из того же польского гнезда идут odcinek «отрезок» и wycinek «вырезка»."
memory: "odciąć — «отрезать, отсечь, отключить». Приставка od- это «от-», а вот корень ciąć русского родственника не имеет. Запоминать надо три основы: odetnę в настоящем, odciął в мужском прошедшем, odcięła во всех прочих."
idioms:
  - { pl: "odcięty od świata", ru: "отрезанный от мира" }
  - { pl: "odciąć się od przeszłości", ru: "отмежеваться от прошлого" }
