# review
id: maniak
format: 2
lemma: "maniak"
rank: 2173
pos: noun
pron: { cyr: "ма́няк" }
senses:
  - id: maniac
    ru: "маньяк, одержимый"
    examples:
      - pl: "Ten maniak jest zdolny do wszystkiego!"
        ru: "Этот маньяк способен на всё!"
        source: { kind: translated, id: 10495094 }
      - pl: "Policja szuka maniaka."
        ru: "Полиция ищет маньяка."
        source: { kind: authored }
      - pl: "To zwykły maniak, nie geniusz."
        ru: "Это обычный маньяк, а не гений."
        source: { kind: authored }
  - id: enthusiast
    ru: "фанат, помешанный (на чём-л.)"
    examples:
      - pl: "Jestem maniakiem telewizji."
        ru: "Я помешан на телевизоре."
        source: { kind: translated, id: 904571 }
      - pl: "On jest maniakiem grillowania."
        ru: "Он помешан на барбекю."
        source: { kind: translated, id: 2707548 }
notes:
  - { kind: government, text: "Чего именно маньяк — творительный падеж с быть: jest maniakiem telewizji «он помешан на телевизоре». Русский тут скажет «помешан на чём-то», с предложным." }
  - { kind: usage, text: "Второе значение куда мягче первого и вполне обиходно: maniak grillowania — это просто страстный любитель барбекю, без всякой угрозы." }
  - { kind: false-friend, text: "Первое значение совпадает с русским «маньяк», второе — нет: по-русски «маньяк кино» не скажут, скажут «фанат»." }
  - { kind: usage, text: "Мужской род; женская форма — maniaczka. Родительный — maniaka." }
collocations:
  - { pl: "maniak komputerowy", ru: "компьютерный фанат" }
  - { pl: "niebezpieczny maniak", ru: "опасный маньяк" }
etymology: "Из греческого mania «безумие, одержимость» через латынь; русское «маньяк» — то же слово."
memory: "maniak — и «маньяк», и безобидный «фанат»: maniak grillowania «помешанный на барбекю». Чем именно — творительным падежом: jest maniakiem czegoś."
