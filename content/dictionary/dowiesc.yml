# review
id: dowiesc
format: 2
lemma: "dowieść"
rank: 2472
pos: verb
aspect: perf
pron: { cyr: "до́весьць" }
senses:
  - id: prove
    ru: "доказать"
    examples:
      - pl: "Mogę tego dowieść."
        ru: "Я могу доказать это."
        source: { kind: tatoeba, id: 2495920 }
      - pl: "Mogę dowieść, że to zrobił Tom."
        ru: "Я могу доказать, что Том сделал это."
        source: { kind: tatoeba, id: 2495936 }
      - pl: "Czego to dowiodło?"
        ru: "Что это доказало?"
        source: { kind: translated, id: 3960457 }
  - id: demonstrate
    ru: "доказать, показать (об исследовании)"
    examples:
      - pl: "Słyszałem, że badania dowiodły, że mężczyźni bardziej kłamią niż kobiety."
        ru: "Я слышал, что исследования доказали: мужчины лгут больше, чем женщины."
        source: { kind: translated, id: 975864 }
      - pl: "Przed wszczęciem sprawy przeciwko Bartłomiejowi Z., prokuratura musiała wpierw dowieść jego poczytalności."
        ru: "Прежде чем возбудить дело против Бартломея З., прокуратуре пришлось сначала доказать его вменяемость."
        source: { kind: translated, id: 13604527 }
notes:
  - { kind: government, text: "Дополнение в РОДИТЕЛЬНОМ падеже: dowieść czegoś, dowieść swojej racji «доказать свою правоту». Русское «доказать что-то» берёт винительный — расхождение заметное." }
  - { kind: false-friend, text: "do- + wieść «вести»; буквально «довести». Слова dowód «доказательство» и dowodzić уже есть в словаре. Не путайте с dowiedzieć się «узнать» — это другой глагол, хотя формы похожи." }
  - { kind: usage, text: "Книжное и юридическое слово. В обычной речи «доказать» — udowodnić." }
  - { kind: usage, text: "Несовершенный вид — dowodzić, у которого есть и второе значение «командовать»." }
collocations:
  - { pl: "dowieść czegoś", ru: "доказать что-л." }
  - { pl: "dowieść swojej racji", ru: "доказать свою правоту" }
etymology: "do- + wieść «вести», буквально «довести»; родня dowód «доказательство»."
memory: "dowieść — книжное «доказать», с РОДИТЕЛЬНЫМ падежом: dowieść swojej racji. Обиходное «доказать» — udowodnić. Не путайте с dowiedzieć się «узнать»."
idioms:
  - { pl: "dowieść czegoś", ru: "доказать что-л." }
