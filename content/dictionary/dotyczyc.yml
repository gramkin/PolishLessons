# review
id: dotyczyc
format: 2
lemma: "dotyczyć"
rank: 1138
pos: verb
aspect: imperf
pron: { cyr: "доты́чыць" }
senses:
  - id: concern
    ru: "касаться, иметь отношение"
    examples:
      - pl: "To dotyczy was."
        ru: "Это касается вас."
        source: { kind: tatoeba, id: 6069714 }
      - pl: "To nas nie dotyczy."
        ru: "Это нас не касается."
        source: { kind: tatoeba, id: 6069716 }
      - pl: "Ta zasada dotyczy również ciebie."
        ru: "Это правило и тебя касается."
        source: { kind: tatoeba, id: 930070 }
  - id: be-about
    ru: "относиться к чему-либо, быть о чём-либо"
    examples:
      - pl: "Zmiany klimatu dotyczą nas wszystkich."
        ru: "Изменения климата касаются всех нас."
        source: { kind: translated, id: 11560134 }
      - pl: "Rozmowy będą dotyczyły problemu zanieczyszczeń."
        ru: "Переговоры будут касаться проблемы загрязнения."
        source: { kind: translated, id: 7886514 }
notes:
  - { kind: government, text: "Подлежащее у dotyczyć — дело, правило, вопрос, но не человек: to mnie nie dotyczy «это меня не касается». Поэтому форм 1-го и 2-го лица (dotyczę, dotyczysz) нет, а во множественном числе живёт только неличная форма będą dotyczyły: мужско-личной *będą dotyczyli не бывает, потому что подлежащим не может быть группа людей." }
  - { kind: government, text: "dotyczyć czego — родительный падеж, как и в русском «касаться чего»: To dotyczy ciebie «Это касается тебя»." }
  - { kind: false-friend, text: "Не путайте dotyczyć «касаться, иметь отношение» с dotykać «касаться рукой». Первое отвлечённое, второе физическое, и подменять их нельзя." }
  - { kind: usage, text: "Глагол только несовершенного вида; совершенной пары у него нет." }
  - { kind: usage, text: "Причастие dotyczący «касающийся» очень частотно в официальном языке: pytania dotyczące umowy «вопросы по договору». Русский тут чаще скажет «по» или «о»." }
collocations:
  - { pl: "to mnie nie dotyczy", ru: "это меня не касается" }
  - { pl: "dotyczyć sprawy", ru: "касаться дела" }
  - { pl: "pytania dotyczące czegoś", ru: "вопросы, касающиеся чего-либо" }
etymology: "Приставка do- и tyczyć «касаться, относиться», родственное tykać «тыкать, трогать». Польская пара dotykać и dotyczyć разошлась из одного корня: одна о руке, другая об отношении."
memory: "dotyczyć — «касаться» в переносном смысле: To mnie nie dotyczy «Это меня не касается». Падеж тот же, что в русском, — родительный. И главное: dotyczyć об отношении, а dotykać рукой. Корень один, смешивать нельзя."
idioms:
  - { pl: "to mnie nie dotyczy", ru: "это меня не касается" }
  - { pl: "sprawa dotycząca czegoś", ru: "дело, касающееся чего-либо" }
  - { pl: "co się tego dotyczy", ru: "что до этого" }
