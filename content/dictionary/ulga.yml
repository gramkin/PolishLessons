# review
id: ulga
format: 2
lemma: "ulga"
rank: 2591
pos: noun
pron: { cyr: "у́льга" }
senses:
  - id: relief
    ru: "облегчение (чувство)"
    examples:
      - pl: "Odetchnęli z ulgą, gdy wrócił."
        ru: "Они вздохнули с облегчением, когда он вернулся."
        source: { kind: authored }
      - pl: "Po zastrzyku poczuł wyraźną ulgę."
        ru: "После инъекции он почувствовал явное облегчение."
        source: { kind: authored }
      - pl: "Z ulgą zamknął za sobą drzwi."
        ru: "С облегчением он закрыл за собой дверь."
        source: { kind: authored }
  - id: allowance
    ru: "льгота, скидка (налоговая, тарифная)"
    examples:
      - pl: "Studentom przysługuje ulga na bilety."
        ru: "Студентам полагается льгота на билеты."
        source: { kind: authored }
      - pl: "Wprowadzili ulgę podatkową dla rodzin."
        ru: "Ввели налоговую льготу для семей."
        source: { kind: authored }
notes:
  - { kind: government, text: "Женский род: ulga, ulgi, uldze. В обороте odetchnąć z ulgą стоит творительный падеж." }
  - { kind: usage, text: "Одно польское слово покрывает два разных русских: «облегчение» как чувство и «льгота» как скидка. Выбирать перевод приходится по контексту." }
  - { kind: usage, text: "Частое: odetchnąć z ulgą, poczuć ulgę, ulga podatkowa, bilet ulgowy." }
  - { kind: false-friend, text: "Прилагательное ulgowy значит «льготный», а не «облегчённый»: bilet ulgowy это «льготный билет»." }
collocations:
  - { pl: "odetchnąć z ulgą", ru: "вздохнуть с облегчением" }
  - { pl: "ulga podatkowa", ru: "налоговая льгота" }
  - { pl: "bilet ulgowy", ru: "льготный билет" }
family:
  - { pl: "ulżyć", ru: "облегчить", relation: root }
  - { pl: "ulgowy", ru: "льготный", relation: derived }
etymology: "От глагола ulżyć «облегчить», образованного от lekki «лёгкий»: облегчение — это то, что делает ношу легче. Русские «облегчение» и «льгота» выражают ту же мысль двумя разными словами там, где польский обходится одним."
memory: "ulga — одно слово на два русских: «облегчение» (odetchnąć z ulgą) и «льгота» (ulga podatkowa). От ulżyć «облегчить», от lekki «лёгкий»."
idioms:
  - { pl: "odetchnąć z ulgą", ru: "вздохнуть с облегчением" }
  - { pl: "ulga podatkowa", ru: "налоговая льгота" }
