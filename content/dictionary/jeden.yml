# review
id: jeden
format: 2
lemma: "jeden"
rank: 72
pos: adj
pron: { cyr: "е́дэн" }
senses:
  - id: one
    ru: "один, одна, одно"
    examples:
      - pl: "Był jeden świadek."
        ru: "Был один свидетель."
        source: { kind: tatoeba, id: 3761551 }
      - pl: "Jedna wdowa miała dwie córki."
        ru: "У одной вдовы было две дочери."
        source: { kind: tatoeba, id: 1168615 }
      - pl: "Wszystko mi jedno."
        ru: "Мне всё равно."
        source: { kind: tatoeba, id: 716803 }
  - id: a-certain
    ru: "один (некий); jedni… inni — одни… другие"
    examples:
      - pl: "Jedni wolą morze, inni góry."
        ru: "Одни предпочитают море, другие — горы."
        source: { kind: tatoeba, id: 733096 }
      - pl: "Tom jest jednym z moich pacjentów."
        ru: "Том - один из моих пациентов."
        source: { kind: tatoeba, id: 8716839 }
notes:
  - { kind: usage, text: "Склоняется как прилагательное и согласуется с существительным: jeden dzień, jedna noc, jedno okno." }
  - { kind: usage, text: "Оборот wszystko jedno значит «всё равно»." }
collocations:
  - { pl: "wszystko jedno", ru: "всё равно" }
  - { pl: "jeden z", ru: "один из" }
  - { pl: "za jednym razem", ru: "за один раз" }
etymology: "Из праславянского *jedinъ («*edъ» + «*inъ») — то же слово, что русское «один»."
memory: "jeden ведёт себя как прилагательное: jedna książka, jedno okno. Во множественном числе появляется значение «одни»: jedni… inni «одни… другие». И помните wszystko jedno «всё равно»."
idioms:
  - { pl: "wszystko jedno", ru: "всё равно" }
  - { pl: "jak jeden mąż", ru: "как один" }
  - { pl: "jechać na jednym wózku", ru: "быть в одной лодке" }
