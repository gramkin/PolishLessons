# review
id: polaczyc
format: 2
lemma: "połączyć"
rank: 697
pos: verb
aspect: perf
pron: { cyr: "поуо́нчыць" }
senses:
  - id: join
    ru: "соединить, объединить"
    examples:
      - pl: "Oba kursy można połączyć."
        ru: "Оба курса можно объединить."
        source: { kind: translated, id: 7783319 }
      - pl: "Połączmy siły."
        ru: "Объединим силы."
        source: { kind: translated, id: 838921 }
      - pl: "Połączyli siły przy tym projekcie."
        ru: "Они объединили силы в этом проекте."
        source: { kind: translated, id: 921775 }
  - id: phone
    ru: "połączyć kogoś z kimś — соединить по телефону"
    note: "Обычная формула при звонке в учреждение."
    examples:
      - pl: "Połącz mnie proszę z szefem."
        ru: "Соедините меня, пожалуйста, с начальником."
        source: { kind: translated, id: 5591055 }
      - pl: "Proszę mnie połączyć z szefem."
        ru: "Прошу соединить меня с начальником."
        source: { kind: translated, id: 5591057 }
      - pl: "Połączysz mnie, proszę, z panem Smithem?"
        ru: "Вы соедините меня, пожалуйста, с господином Смитом?"
        source: { kind: translated, id: 3807845 }
  - id: connection
    ru: "połączenie — соединение, связь, сообщение"
    examples:
      - pl: "Nie ma połączenia."
        ru: "Связи нет."
        source: { kind: tatoeba, id: 13785993 }
      - pl: "Czy jest połączenie bezpośrednie z Warszawy do Berlina?"
        ru: "Есть ли прямое сообщение от Варшавы до Берлина?"
        source: { kind: tatoeba, id: 2363482 }
      - pl: "Och, połączenie się zerwało."
        ru: "Ох, связь оборвалась."
        source: { kind: translated, id: 551812 }
notes:
  - { kind: government, text: "połączyć coś Z czymś «соединить что-то с чем-то» — творительный падеж после z: Połączyła masło z cukrem." }
  - { kind: usage, text: "Телефонная формула: Połącz mnie z szefem «Соедини меня с начальником». Ответ Pomyłka значит «Вы ошиблись номером», а połączył się pan z niewłaściwym numerem — «вы соединились не с тем номером»." }
  - { kind: usage, text: "Существительное połączenie значит сразу «соединение», «телефонный звонок» и «сообщение, рейс»: połączenie bezpośrednie «прямое сообщение», nie ma połączenia «нет связи»." }
  - { kind: usage, text: "Несовершенный вид — łączyć. С się глагол значит «объединиться, слиться»: Dwa kluby połączyły się w jeden." }
collocations:
  - { pl: "połączyć siły", ru: "объединить силы" }
  - { pl: "połącz mnie z", ru: "соедини меня с" }
  - { pl: "połączenie bezpośrednie", ru: "прямое сообщение" }
  - { pl: "nie ma połączenia", ru: "нет связи" }
family:
  - { pl: "łączyć", ru: "соединять", relation: aspect }
  - { pl: "połączenie", ru: "соединение, связь", relation: derived }
  - { pl: "łącznik", ru: "связующее звено", relation: derived }
  - { pl: "rozłączyć", ru: "разъединить", relation: derived }
etymology: "Из po- + łączyć, праславянское *lǫčiti «соединять, разъединять». Тот же корень в русских «разлучить», «получить» и «случай» — родство неочевидное, но настоящее."
memory: "połączyć — «соединить, объединить». Корень тот же, что в русских «разлучить» и «случай». Управление через творительный: połączyć coś z czymś. Отдельно запомните телефонное Połącz mnie z szefem «Соедини меня с начальником» и существительное połączenie, которое значит и «связь», и «рейс»."
idioms:
