senses:
  - id: hush
    ru: "утихомирить, заставить замолчать"
    examples:
      - pl: "Nauczycielka uciszyła klasę jednym spojrzeniem."
        ru: "Учительница утихомирила класс одним взглядом."
        source: { kind: authored }
      - pl: "Ucisz dzieci, sąsiedzi śpią."
