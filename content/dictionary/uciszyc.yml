        source: { kind: authored }
      - pl: "Przewodniczący uciszył salę dzwonkiem."
        ru: "Председатель успокоил зал звонком."
        source: { kind: authored }
  - id: silence
    ru: "заставить молчать, замять (свидетеля, дело)"
    examples:
      - pl: "Próbowali uciszyć dziennikarza pozwami."
        ru: "Журналиста пытались заставить замолчать исками."
        source: { kind: authored }
      - pl: "Sprawę szybko uciszono."
        ru: "Дело быстро замяли."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "UCISZYĆ — от CICHY, «тихий», и русскому «утишить» родственно, но русское слово почти забыто. Обычный перевод — «утихомирить, успокоить, заставить замолчать». Русское «тушить» — GASIĆ, а «тишина» — CISZA. Возвратное UCISZYĆ SIĘ — «утихнуть»: WIATR SIĘ UCISZYŁ, SALA SIĘ UCISZYŁA." }
  - { kind: usage, text: "Пятьдесят три формы — подпись переходного глагола совершенного вида: страдательное UCISZONY, «утихомиренный», и деепричастие UCISZYWSZY. Видовой партнёр — UCISZAĆ: CIĄGLE UCISZAŁA BRATA. В повелительном UCISZ — частая просьба о тишине." }
  - { kind: government, text: "Кого — винительный: UCISZYĆ DZIECI, UCISZYĆ TŁUM. Чем — творительный без предлога: UCISZYĆ GESTEM, SPOJRZENIEM, DZWONKIEM. С отрицанием — родительный: NIE UCISZYŁ TŁUMU." }
  - { kind: pronunciation, text: "Читается «уци́шыць», три слога, ударение на предпоследнем. CI — мягкое «ци», SZ твёрдое — «шы». Конечное Ć — «ць». Повелительное UCISZ — «у́циш», с твёрдым «ш» на конце." }
  - { kind: register, text: "Нейтральный глагол: в школе, на собраниях, в семье. Значение «заставить замолчать» о свидетеле, журналисте, критике — из политики и детективов, с оттенком угрозы: UCISZYĆ ŚWIADKA." }
collocations:
  - { pl: "uciszyć salę", ru: "успокоить зал" }
  - { pl: "uciszyć dzieci", ru: "утихомирить детей" }
  - { pl: "uciszyć świadka", ru: "заставить свидетеля замолчать" }
family:
  - { pl: "uciszac", ru: "утихомиривать", relation: aspect }
  - { pl: "cichy", ru: "тихий", relation: root, id: cichy }
  - { pl: "cisza", ru: "тишина", relation: root, id: cisza }
etymology: "Приставка U- плюс CISZYĆ, от CICHY «тихий», праславянское *tichъ, то же, что русское «тихий». Польское CI на месте русского «ти» — обычное смягчение T перед I; CH перед суффиксом переходит в SZ, как в русском «тихий — тише»."
memory: "Uciszyć — утихомирить, заставить замолчать: uciszyć klasę, ucisz dzieci! От cichy — тихий, cisza — тишина. Uciszyć się — утихнуть. Читается «уци́шыць»."
idioms:
  - { pl: "uciszyć sumienie", ru: "заглушить совесть" }
