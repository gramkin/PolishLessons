notes:
  - { kind: false-friend, text: "LOGIKA — «логика», перевод прямой. Ловушка в формах: LOGIK — это и родительный множественного, и «логик», специалист. А «логично» — LOGICZNIE." }
  - { kind: usage, text: "Девять живых форм, женский род. Перед E K переходит в C: W LOGICE. Ударение по норме на третьем слоге от конца, как в MATEMATYKA и MUZYKA. Звательный не даётся." }
