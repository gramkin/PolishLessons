etymology: "Из греческого слова, образованного от «слово, разум». Русская «логика» — то же слово, и ударение в обоих языках на первом слоге."
memory: "Logika — логика, «ло́гика». W tym nie ma logiki — в этом нет логики. Wbrew logice — вопреки логике. Logicznie — логично."
