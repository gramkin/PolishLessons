  - id: attributive
    ru: "отличный, классный (перед существительным, без согласования)"
    examples:
      - pl: "To był super pomysł."
        ru: "Это была супер-идея."
        source: { kind: authored }
      - pl: "Mamy super nauczycielkę."
        ru: "У нас классная учительница."
        source: { kind: authored }
      - pl: "Kupił super samochód."
        ru: "Он купил классную машину."
        source: { kind: authored }
notes:
  - { kind: usage, text: "super не склоняется: одна форма на все роды, числа и падежи — super pomysł, super nauczycielka, z super samochodem." }
  - { kind: usage, text: "Работает сразу в трёх ролях: сказуемым (To super «Это супер»), определением (super pomysł) и наречием (Super się bawiłem «Я отлично провёл время»)." }
  - { kind: false-friend, text: "В польском super куда употребительнее русского «супер» и звучит нейтральнее. В официальной речи его всё же заменяют на świetny или wspaniały." }
  - { kind: usage, text: "Перед существительным пишется раздельно: super pomysł. Но в устоявшихся сложениях слитно: supermarket, superbohater." }
collocations:
  - { pl: "to super!", ru: "это супер!" }
  - { pl: "super pomysł", ru: "отличная идея" }
  - { pl: "czuć się super", ru: "чувствовать себя отлично" }
  - { pl: "super sprawa", ru: "отличное дело" }
etymology: "Латинское super «над, сверх». В польский пришло через интернациональную лексику — тем же путём, что и русское «супер»."
memory: "super — «супер, классно», слово международное, но в польском оно работает шире русского: и сказуемым (To super), и определением (super pomysł «отличная идея»), и наречием (Super się bawiłem). Главное — оно не склоняется: одна форма на все роды и падежи. Перед существительным пишется раздельно, а в сложениях слитно: supermarket."
