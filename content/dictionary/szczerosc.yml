notes:
  - { kind: false-friend, text: "У этого корня нет соответствия в литературном русском, и опереться на знакомое слово не получится, зато есть прямой мост через украинский. Польское SZCZERY значит «искренний», и это ровно украинское «щирий» и белорусское «шчыры»; русский на то же понятие взял «искренний», слово другого корня. Кто знает украинское «щиро дякую», узнает польское SZCZERZE DZIĘKUJĘ сразу. И не путать SZCZERY с HOJNY: «щедрый» по-польски HOJNY, а SZCZERY о щедрости не говорит." }
  - { kind: pronunciation, text: "Читается «шчэ́росьчь», два слога, ударение на первом. Сочетание SZCZ — это два звука подряд, «ш» и «ч», и вместе они дают примерно русское «щ», только произнесённое раздельно: «шч». Такое же начало в SZCZOTKA «щётка» и SZCZĘŚCIE «счастье». Буква E читается как «э». Конец слова, -ŚĆ, это два мягких звука подряд, «сьчь». В наречии SZCZERZE слышно «шчэ́же», потому что RZ даёт «ж»." }
  - { kind: government, text: "Искренность перед кем — предлог WOBEC с родительным: SZCZEROŚĆ WOBEC SIEBIE «искренность с самим собой», тогда как русский ставит предлог «с» и творительный. Со всей искренностью — Z CAŁĄ SZCZEROŚCIĄ, предлог Z с творительным, и здесь схема совпадает. Прилагательное SZCZERY управляет предлогом W с местным падежом: SZCZERY W OCENACH «искренний в оценках», а в усилении берёт предлог DO: SZCZERY DO BÓLU «искренний до боли»." }
  - { kind: usage, text: "Шесть форм, разряд женских существительных на -OŚĆ, суффикс отвечает русскому -ОСТЬ. Отвлечённое существительное, поэтому множественное число почти не нужно. Гораздо употребительнее наречие SZCZERZE «искренне, честно», и прежде всего в одном обороте: SZCZERZE MÓWIĄC значит «честно говоря», и это первое, что стоит выучить из всего гнезда. Отрицательная пара NIESZCZEROŚĆ значит «неискренность»." }
  - { kind: register, text: "Слово нейтральное, чуть книжное. Частые обороты: Z CAŁĄ SZCZEROŚCIĄ «со всей искренностью», SZCZERZE MÓWIĄC «честно говоря», SZCZEROŚĆ WOBEC SIEBIE «искренность с собой», SZCZERY DO BÓLU «искренний до боли». В живой речи существительное заменяют наречием почти всегда. Отдельно стоит запомнить, что SZCZERE POLE значит «чистое поле», открытое место без построек, и это застывший оборот с исходным значением корня, «чистый, подлинный»." }
