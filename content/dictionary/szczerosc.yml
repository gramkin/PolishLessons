etymology: "От прилагательного SZCZERY, от праславянского слова со значением «чистый, подлинный, без примеси». Исходный смысл сохранился в застывшем обороте SZCZERE POLE «чистое поле» и в SZCZERE ZŁOTO «чистое золото», то есть золото без примеси. Из чистоты вещества выросла чистота намерений, и слово стало значить «искренний». Русский литературный язык этот корень утратил, оставив его в говорах как «щирый», зато украинский и белорусский сохранили полностью: «щирий», «шчыры». Для русскоязычного это тот случай, когда ключ к польскому слову лежит в соседнем языке, а не в своём."
memory: "Корня этого в литературном русском нет, но есть прямой мост: польское szczery это украинское «щирий», и кто знает «щиро дякую», поймёт szczerze dziękuję. Исходный смысл корня — «чистый, без примеси», и он сохранился в szczere złoto «чистое золото» и szczere pole «чистое поле». Самое нужное из гнезда — наречие: szczerze mówiąc значит «честно говоря». Читается «шчэ́росьчь», где szcz это раздельные «ш» и «ч»."
