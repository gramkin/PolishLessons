notes:
  - { kind: government, text: "ГЛАВНОЕ: в единственном числе НЕ СКЛОНЯЕТСЯ — do muzeum, w muzeum, z muzeum, форма всегда одна. Меняется только множественное: muzea, muzeów, muzeach." }
  - { kind: false-friend, text: "Русский «музей» мужского рода, а польское muzeum — СРЕДНЕГО: to muzeum, tamto muzeum. Это типично для заимствований на -um: liceum, gimnazjum, centrum." }
  - { kind: usage, text: "В музей — do muzeum, с родительным по форме, хотя слово не меняется. В музее — w muzeum." }
  - { kind: usage, text: "Множественное образуется без -um: muzeum → muzea, как centrum → centra." }
collocations:
  - { pl: "do muzeum", ru: "в музей" }
  - { pl: "w muzeum", ru: "в музее" }
etymology: "Из латинского museum; в польском такие слова на -um среднего рода и в единственном числе не склоняются."
memory: "muzeum — «музей», но СРЕДНЕГО рода и в единственном числе НЕ склоняется: do muzeum, w muzeum. Множественное — muzea, muzeów."
idioms:
