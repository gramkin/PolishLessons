# review
id: ledwo
format: 2
lemma: "ledwo"
rank: 1806
pos: adv
pron: { cyr: "ле́дво" }
senses:
  - id: barely
    ru: "едва, с трудом"
    examples:
      - pl: "Ledwo idę."
        ru: "Я едва иду."
        source: { kind: translated, id: 1131601 }
      - pl: "Ledwo go znam."
        ru: "Я едва его знаю."
        source: { kind: translated, id: 3759827 }
      - pl: "Ledwo uniknął śmierci."
        ru: "Он едва избежал смерти."
        source: { kind: translated, id: 410742 }
  - id: just-barely
    ru: "едва (только), чуть было не"
    examples:
      - pl: "Ledwo zaczęłam."
        ru: "Я едва начала."
        source: { kind: translated, id: 6109679 }
      - pl: "Ledwo ocaleliśmy."
        ru: "Мы едва уцелели."
        source: { kind: translated, id: 2727016 }
      - pl: "Ten biedny kot był ledwo żywy z głodu."
        ru: "Этот бедный кот был почти мёртв от голода."
        source: { kind: tatoeba, id: 361037 }
notes:
  - { kind: usage, text: "Наречие не склоняется и стоит свободно, в отличие от rownie или indziej: Ledwo idę «Я едва иду», Ledwo go znam «Я едва его знаю»." }
  - { kind: usage, text: "Второе значение — временное «едва только, как только»: ledwo wszedł, zadzwonił telefon «едва он вошёл, зазвонил телефон»." }
  - { kind: usage, text: "ledwo żywy — «еле живой», устойчивое сочетание; ledwo co значит «только что»." }
  - { kind: usage, text: "Вариант ledwie значит то же самое и звучит чуть книжнее." }
collocations:
  - { pl: "ledwo żywy", ru: "еле живой" }
  - { pl: "ledwo go znam", ru: "я едва его знаю" }
  - { pl: "ledwo co", ru: "только что" }
etymology: "Праславянское *ledvě «едва, с трудом» — то же слово, что русское «едва»; различие лишь в начальном l-, утраченном в русском. Значение совпадает полностью."
memory: "ledwo = «едва, с трудом», и слово это прямой родственник русского «едва». Оно свободно стоит в предложении. Второе значение временное: ledwo wszedł «едва он вошёл»."
idioms:
  - { pl: "ledwo żywy", ru: "еле живой" }
  - { pl: "ledwo co", ru: "только что" }
  - { pl: "ledwo zdążyłem", ru: "я едва успел" }
