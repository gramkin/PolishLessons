senses:
  - id: five
    ru: "пять"
    examples:
      - pl: "Minęło pięć dni."
        ru: "Прошло пять дней."
        source: { kind: tatoeba, id: 13031759 }
      - pl: "Dam ci pięć dolarów."
        ru: "Я дам тебе пять долларов."
        source: { kind: tatoeba, id: 591531 }
      - pl: "To zajmie pięć sekund."
        ru: "Это займёт пять секунд."
        source: { kind: tatoeba, id: 11268995 }
  - id: five-collective
    ru: "пятеро (собирательная форма pięcioro)"
    examples:
      - pl: "Wychowała pięcioro dzieci."
        ru: "Она вырастила пятерых детей."
        source: { kind: tatoeba, id: 999422 }
      - pl: "On ma przynajmniej pięcioro dzieci."
        ru: "У него по меньшей мере пятеро детей."
        source: { kind: translated, id: 723793 }
      - pl: "Przyszło pięcioro gości."
        ru: "Пришло пятеро гостей."
        source: { kind: authored }
notes:
  - { kind: usage, text: "После pięć существительное идёт в родительном падеже множественного числа: pięć dni «пять дней», pięć minut «пять минут» — ровно как в русском." }
  - { kind: usage, text: "Для детей и смешанных групп обязательна собирательная форма pięcioro: pięcioro dzieci «пятеро детей». Её косвенные падежи — pięciorga, pięciorgiem, pięciorgu." }
  - { kind: usage, text: "Косвенный падеж самого числительного — pięciu: pięciu mężczyzn «пятеро мужчин», z pięcioma kolegami «с пятью товарищами»." }
  - { kind: usage, text: "Идиома znać jak swoje pięć palców совпадает с русской «знать как свои пять пальцев»." }
collocations:
  - { pl: "pięć minut", ru: "пять минут" }
  - { pl: "pięcioro dzieci", ru: "пятеро детей" }
  - { pl: "za pięć dwunasta", ru: "без пяти двенадцать" }
  - { pl: "pięciu mężczyzn", ru: "пятеро мужчин" }
etymology: "Праславянское *pętь, из праиндоевропейского *pénkʷe. Русское «пять» — то же слово, и носовой ę стоит ровно там, где русское «я»."
memory: "pięć — «пять», и носовой ę сидит там, где в русском «я». Главная новость для русского: о детях нужна особая собирательная форма pięcioro dzieci. А идиома совпадает полностью — znać jak swoje pięć palców."
idioms:
  - { pl: "znać jak swoje pięć palców", ru: "знать как свои пять пальцев" }
  - { pl: "mieć swoje pięć minut", ru: "иметь свои пять минут славы" }
  - { pl: "ni w pięć, ni w dziewięć", ru: "ни к селу ни к городу" }
formExamplesSkip:
  - { form: "pięcio", reason: "это не самостоятельное слово, а связанная основа сложных слов (pięcioletni, pięciogodzinny); отдельно она не употребляется" }
