# review
id: uciec
format: 2
lemma: "uciec"
rank: 425
pos: verb
aspect: perf
pron: { cyr: "у́цец" }
senses:
  - id: flee
    ru: "убежать, сбежать"
    examples:
      - pl: "Przestępca uciekł z więzienia."
        ru: "Преступник сбежал из тюрьмы."
        source: { kind: tatoeba, id: 3460184 }
      - pl: "Widząc policjanta, mężczyzna uciekł."
        ru: "Увидев полицейского, мужчина убежал."
        source: { kind: tatoeba, id: 742538 }
      - pl: "Obroża się zepsuła i pies uciekł."
        ru: "Ошейник сломался, и собака сбежала."
        source: { kind: tatoeba, id: 10747443 }
  - id: miss
    ru: "ускользнуть, уйти (о транспорте, о времени)"
    examples:
      - pl: "Boję się, że ucieknie mi autobus."
        ru: "Боюсь, что я опоздаю на автобус."
        source: { kind: translated, id: 2607637 }
      - pl: "Uciekł mi pociąg."
        ru: "Я опоздал на поезд."
        source: { kind: authored }
      - pl: "Uciekli?"
        ru: "Они сбежали?"
        source: { kind: tatoeba, id: 3605042 }
notes:
  - { kind: usage, text: "Прошедшее и будущее берут разные основы: uciekł «убежал», но ucieknie «убежит», ucieknę «убегу»." }
  - { kind: usage, text: "uciekł mi autobus значит «я опоздал на автобус» — буквально «автобус от меня убежал». Русский строит эту мысль наоборот." }
  - { kind: usage, text: "Несовершенный вид — uciekać: Uciekaj! «Беги!»" }
  - { kind: false-friend, text: "Неопределённая форма только одна — uciec. Формы ucieknąć не существует, хотя словарь форм её предлагает." }
collocations:
  - { pl: "uciec z więzienia", ru: "сбежать из тюрьмы" }
  - { pl: "uciekł mi autobus", ru: "я опоздал на автобус" }
  - { pl: "uciec przed kimś", ru: "убежать от кого-либо" }
etymology: "Из u- + ciec «течь» — буквально «утечь». Русское «утечь» это то же самое слово, и «убежать» поляки выразили через идею утекания."
memory: "uciec — «убежать», а буквально «утечь»: внутри ciec «течь». Основы разные: прошедшее uciekł, будущее ucieknie. И запомните перевёрнутую конструкцию uciekł mi autobus — «я опоздал на автобус»."
idioms:
  - { pl: "uciec spod nosa", ru: "убежать из-под носа" }
  - { pl: "uciekł mi autobus", ru: "я опоздал на автобус" }
  - { pl: "uciec grabarzowi spod łopaty", ru: "вырваться с того света" }
formExamplesSkip:
  - { form: "ucieknąć", reason: "неопределённая форма этого глагола — только uciec; в корпусе форма ucieknąć не встречается ни разу" }
