# review
id: romans
format: 2
lemma: "romans"
rank: 1695
pos: noun
pron: { cyr: "ро́манс" }
senses:
  - id: affair
    ru: "роман (любовная связь)"
    examples:
      - pl: "Ona ma romans z szefem."
        ru: "У неё роман с шефом."
        source: { kind: translated, id: 751866 }
      - pl: "Wiem, że masz romans."
        ru: "Я знаю, что у тебя роман."
        source: { kind: translated, id: 11266337 }
      - pl: "Miałeś romans."
        ru: "У тебя был роман."
        source: { kind: translated, id: 6547708 }
  - id: genre
    ru: "любовный роман (книга, фильм)"
    examples:
      - pl: "Dowiedziałem się, że Tom lubi romanse."
        ru: "Я узнал, что Том любит любовные романы."
        source: { kind: translated, id: 3099977 }
      - pl: "Moja trzynastoletnia córka lubi romanse filmowe."
        ru: "Моя тринадцатилетняя дочь любит романтические фильмы."
        source: { kind: translated, id: 997609 }
notes:
  - { kind: false-friend, text: "Главная ловушка: русский «роман» как книга — это по-польски powieść. Polskie romans — прежде всего любовная связь." }
  - { kind: government, text: "Роман с кем-то — romans z kimś (творительный падеж с z): ma romans z szefem." }
  - { kind: usage, text: "Как название жанра romans тоже существует — любовный роман, дамский роман. Но «Война и мир» — это powieść." }
  - { kind: usage, text: "Глагол — romansować «крутить роман»; прилагательное romantyczny «романтический»." }
collocations:
  - { pl: "mieć romans", ru: "иметь роман" }
  - { pl: "romans z szefem", ru: "роман с начальником" }
  - { pl: "skończyć romans", ru: "закончить роман" }
family:
