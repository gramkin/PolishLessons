  - { pl: "romantyczny", ru: "романтический", relation: root }
etymology: "Из французского roman через немецкий — то же слово, что русское «роман», но значения разошлись: по-польски это прежде всего любовная связь."
memory: "romans — это роман-связь, а не роман-книга. Книга — powieść. Mieć romans z kimś «иметь роман с кем-то»."
