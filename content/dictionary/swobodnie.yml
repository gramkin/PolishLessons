# review
id: swobodnie
format: 2
lemma: "swobodnie"
rank: 5245
pos: adv
pron: { cyr: "сфобо́дне" }
senses:
  - id: freely
    ru: "свободно, непринуждённо"
    examples:
      - pl: "Ptaki latają swobodnie."
        ru: "Птицы свободно летают."
        source: { kind: authored }
      - pl: "Możesz się tu swobodnie poruszać."
        ru: "Здесь ты можешь свободно передвигаться."
        source: { kind: authored }
      - pl: "Zachowywał się swobodnie, jakby był u siebie."
        ru: "Он вёл себя непринуждённо, как у себя дома."
        source: { kind: authored }
  - id: fluently
    ru: "свободно (о языке)"
    examples:
      - pl: "Swobodnie mówi po niemiecku."
        ru: "Он свободно говорит по-немецки."
        source: { kind: authored }
      - pl: "Po roku nauki czyta już swobodnie."
        ru: "После года учёбы он уже свободно читает."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "SWOBODNIE — «свободно», но польская SWOBODA — это скорее свобода движений и непринуждённость. Политическая «свобода» обычно — WOLNOŚĆ: WOLNOŚĆ SŁOWA. CZUĆ SIĘ SWOBODNIE — «чувствовать себя непринуждённо»." }
  - { kind: usage, text: "Наречие со степенями: SWOBODNIE, SWOBODNIEJ, NAJSWOBODNIEJ. О языке: MÓWIĆ SWOBODNIE PO POLSKU, «свободно говорить по-польски»." }
  - { kind: government, text: "Наречие ничем не управляет. Чаще всего при глаголах движения, речи и самочувствия: SWOBODNIE ODDYCHAĆ, SWOBODNIE MÓWIĆ, CZUĆ SIĘ SWOBODNIE." }
  - { kind: pronunciation, text: "Читается «сфобо́дне», ударение на предпоследнем слоге. W после глухого S оглушается в «ф». DNIE — «дне»." }
collocations:
  - { pl: "czuć się swobodnie", ru: "чувствовать себя непринуждённо" }
  - { pl: "mówić swobodnie po angielsku", ru: "свободно говорить по-английски" }
  - { pl: "swobodnie oddychać", ru: "свободно дышать" }
family:
  - { pl: "swoboda", ru: "свобода, непринуждённость", relation: root }
  - { pl: "swobodny", ru: "свободный, непринуждённый", relation: root, id: swobodny }
  - { pl: "swój", ru: "свой", relation: root, id: swoj }
etymology: "От SWOBODA, общеславянского слова, родственного SWÓJ «свой». Свободный — исходно «свой», член своего рода, а не чужак. Русская «свобода» — то же слово."
memory: "Swobodnie — свободно, непринуждённо: czuj się swobodnie. Читается «сфобо́дне». Mówi swobodnie po polsku. Wolność słowa — свобода слова."
idioms:
  - { pl: "mieć wolną rękę", ru: "иметь свободу действий" }
