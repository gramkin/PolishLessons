etymology: "Из средневерхненемецкого TRUHE «сундук, ящик», через старопольское TRUHNA; тот же немецкий корень дал современное TRUHE «сундук». Польский приспособил слово к своему склонению и закрепил за погребальным ящиком. Русское «гроб» происхождения славянского, от *grobъ, того же корня, что «гребу» и «погребать», то есть от копания; поэтому польское GRÓB и русский «гроб» — одно слово, но значения разошлись: по-польски это «могила», а не ящик. Получается перекрёстное распределение: для ящика польский взял немецкое слово, а славянское отдал яме, тогда как русский славянским словом назвал ящик, а для ямы взял «могилу» — слово тоже славянское, но другого корня."
memory: "Немецкое заимствование без русской опоры: trumna — «гроб», от truhe «сундук». А польское grób — родня русскому «гробу», но значит «могилу», не ящик: распределение перекрёстное. Родительный множественного trumien, со вставным -ie-, как panien и wojen; это третий вариант рядом с wiosen (вставная e) и trosk (без вставки). Gwóźdź do trumny — «гвоздь в крышку гроба»."
idioms:
