notes:
  - { kind: false-friend, text: "Русского однокоренного слова нет: TRUMNA пришла из немецкого и значит «гроб», а русское «гроб» — слово славянское, от того же корня, что «грабить» в старом смысле «копать». Поэтому опереться не на что, и слово надо запомнить целиком. Польский TRUP, кстати, значит «труп» и с TRUMNA не связан, хотя соседство звуков подсказывает иное. Для похоронного обряда понадобятся ещё POGRZEB «похороны», GRÓB «могила» — вот это слово как раз родня русскому «гробу», но значит «могилу», а не ящик, — и CMENTARZ «кладбище»." }
  - { kind: usage, text: "Родительный множественного — TRUMIEN, со вставным сочетанием -IE-, которое разбивает группу MN: не «trumn». Это третий способ в одной карточке: WIOSNA даёт WIOSEN с вставной E, TROSKA даёт TROSK без вставки вовсе, а TRUMNA даёт TRUMIEN с полным -IE-. Так же ведут себя PANNA с PANIEN и WOJNA с WOJEN. В дательном и местном единственного N просто смягчается перед -IE: TRUMNIE, без всякого чередования в основе. Форма TRUMNY покрывает родительный единственного вместе с именительным и винительным множественного." }
  - { kind: government, text: "Женский род. «В гробу» — предлог W с местным: W TRUMNIE. «В гроб» — W или DO: ZŁOŻYĆ DO TRUMNY «положить в гроб», с предлогом DO и родительным. Частотные глаголы: NIEŚĆ TRUMNĘ «несть гроб», ZAMKNĄĆ TRUMNĘ, ZŁOŻYĆ DO TRUMNY. Из чего сделан — предлог Z с родительным: TRUMNA Z DĘBU «гроб из дуба». Устойчивое переносное выражение GWÓŹDŹ DO TRUMNY значит «гвоздь в крышку гроба», то есть решающий удар, и совпадает с русским почти дословно." }
  - { kind: pronunciation, text: "Читается «тру́мна», два слога, ударение на первом. Буква U даёт «у». Группа MN выговаривается слитно, без гласной между м и н. В дательном и местном TRUMNIE сочетание NIE даёт мягкое «не»: «тру́мне». В родительном множественного TRUMIEN слогов два, и вставное -IE- читается «е»: «тру́мен», с мягким м перед ним. Разница между TRUMNIE и TRUMIEN слышна по месту мягкости: в первом случае мягкое н, во втором мягкое м." }
