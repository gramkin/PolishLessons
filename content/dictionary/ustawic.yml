# review
id: ustawic
format: 2
lemma: "ustawić"
rank: 1852
pos: verb
aspect: perf
pron: { cyr: "уста́виць" }
senses:
  - id: set-alarm
    ru: "поставить, настроить (будильник, прибор)"
    examples:
      - pl: "Przed pójściem spać ustawił budzik."
        ru: "Перед сном он поставил будильник."
        source: { kind: translated, id: 713465 }
      - pl: "Mój ojciec ustawił budzik na szóstą."
        ru: "Мой отец поставил будильник на шесть."
        source: { kind: translated, id: 3032478 }
      - pl: "Budzik jest ustawiony na piątą rano."
        ru: "Будильник заведён на пять утра."
        source: { kind: tatoeba, id: 3698088 }
  - id: arrange
    ru: "расставить, поставить; ustawić się — построиться"
    examples:
      - pl: "Ustawiliśmy książki według wielkości."
        ru: "Мы расставили книжки по размеру."
        source: { kind: tatoeba, id: 3663702 }
      - pl: "Matka ustawiła duży wazon na półce."
        ru: "Мать поставила большую вазу на полку."
        source: { kind: translated, id: 364665 }
      - pl: "Ustawcie się w dwóch szeregach."
        ru: "Постройтесь в две шеренги."
        source: { kind: translated, id: 12240083 }
notes:
  - { kind: usage, text: "ustawić budzik — «поставить будильник», самое частое сочетание в корпусе. Настроить прибор — тоже ustawić." }
  - { kind: usage, text: "Возвратное ustawić się значит «встать, построиться»: ustawcie się w dwóch szeregach, dzieci ustawiły się w kolejkę." }
  - { kind: government, text: "Поставить что-то куда-то — ustawić coś na czymś (предложный) или w czymś: ustawiła wazon na półce." }
  - { kind: usage, text: "Совершенный вид; несовершенный — ustawiać. Существительное ustawienie значит «расстановка» и «настройка»." }
collocations:
  - { pl: "ustawić budzik", ru: "поставить будильник" }
  - { pl: "ustawić się w kolejkę", ru: "встать в очередь" }
  - { pl: "ustawienia", ru: "настройки" }
family:
  - { pl: "ustawiać", ru: "расставлять", relation: root }
  - { pl: "postawić", ru: "поставить", relation: root, id: postawic }
  - { pl: "stawiać", ru: "ставить", relation: root, id: stawiac }
etymology: "Приставка u- плюс stawić «ставить» — то же слово, что русское «уставить». Значение «настроить» развилось уже в польском."
memory: "ustawić — «поставить, настроить»: ustawić budzik «поставить будильник». Возвратное ustawić się — «построиться»: ustawcie się w dwóch szeregach."
idioms:
  - { pl: "ustawić budzik", ru: "поставить будильник" }
  - { pl: "ustawić się w kolejkę", ru: "встать в очередь" }
  - { pl: "ustawić do pionu", ru: "приструнить" }
