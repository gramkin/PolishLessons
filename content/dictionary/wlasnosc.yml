  - { pl: "władza", ru: "власть", relation: root, id: wladza }
etymology: "От własny «собственный», восходящего к праславянскому корню со значением «владеть» — тому же, что в русских «власть», «волость» и «владеть». Польское wła- против русского вла- и воло- — обычное соответствие, как głowa против «головы». Значение сдвинулось от власти над вещью к собственности на неё. Отсюда właściciel «владелец», właściwość «свойство» и władza «власть»."
memory: "własność — «собственность», но во множественном числе ещё и «свойства»: własności chemiczne. Корень тот же, что в «власти» и «волости». И запомните весь класс: существительные на -ość дают ровно шесть форм, как wolność и miłość."
