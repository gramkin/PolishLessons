notes:
  - { kind: false-friend, text: "ВТОРОЕ ЗНАЧЕНИЕ РУССКИЙ ОТДАЁТ ДРУГОМУ СЛОВУ. Własność это «собственность» в юридическом смысле: własność prywatna, prawo własności, przejść na własność. Но во множественном числе własności значит ещё и «СВОЙСТВА»: własności chemiczne, własności lecznicze. Русский здесь непременно скажет «свойства», а не «собственности». Рядом живёт właściwość, которое значит только «свойство», без юридического оттенка." }
  - { kind: usage, text: "ВСЕГО ШЕСТЬ ФОРМ — И ТАК СКЛОНЯЮТСЯ ВСЕ СУЩЕСТВИТЕЛЬНЫЕ НА -OŚĆ. Их в польском сотни: wolność, miłość, radość, możliwość, wiadomość. Все они женского рода и дают один и тот же набор: własność, własności, własnością, własnościom, własnościami, własnościach. Выучив одну такую таблицу, вы получаете весь класс разом." }
  - { kind: pronunciation, text: "ł звучит как короткое у, ś как сь, конечное ć как ць: «вуа́сносьць». Ударение на предпоследнем слоге. В длинных формах оно уезжает вправо: własnościami — «вуасносьця́ми»." }
