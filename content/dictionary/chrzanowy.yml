senses:
  - id: horseradish
    ru: "хреновый (из хрена)"
    examples:
      - pl: "Sos chrzanowy pasuje do mięsa."
        ru: "Хреновый соус подходит к мясу."
        source: { kind: authored }
      - pl: "Kupiłem krem chrzanowy."
        ru: "Я купил хреновый крем."
        source: { kind: authored }
