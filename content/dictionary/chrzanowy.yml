lemma: "chrzanowy"
rank: 2195
pos: adj
pron: { cyr: "хшано́вы" }
senses:
  - id: horseradish
    ru: "хреновый (из хрена)"
    examples:
      - pl: "Sos chrzanowy pasuje do mięsa."
        ru: "Хреновый соус подходит к мясу."
        source: { kind: authored }
      - pl: "Kupiłem krem chrzanowy."
        ru: "Я купил хреновый крем."
        source: { kind: authored }
      - pl: "Chrzanowy smak jest ostry."
        ru: "Хреновый вкус острый."
        source: { kind: authored }
  - id: horseradish-dish
    ru: "хреновый (о блюде, приправе)"
    examples:
      - pl: "Podano zupę chrzanową."
        ru: "Подали хреновый суп."
        source: { kind: authored }
      - pl: "To tradycyjny sos chrzanowy."
        ru: "Это традиционный хреновый соус."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Русское «хреновый» в разговорной речи значит «плохой», а польское chrzanowy — только «из хрена», без всякой оценки. Оценочное значение у поляков даёт глагол chrzanić «нести вздор», но это другое слово." }
  - { kind: usage, text: "Прежде всего кулинарное: sos chrzanowy «хреновый соус» — непременная часть пасхального стола." }
  - { kind: government, text: "Обычное прилагательное от chrzan «хрен»." }
  - { kind: usage, text: "В корпусе слово не встречается, поэтому все примеры составлены вручную." }
collocations:
  - { pl: "sos chrzanowy", ru: "хреновый соус" }
  - { pl: "krem chrzanowy", ru: "хреновый крем" }
etymology: "От chrzan «хрен», праславянское *xrěnъ; русское «хрен» — то же слово."
memory: "chrzanowy — «из хрена», и только. Русское разговорное «хреновый» в смысле «плохой» сюда не переносится: для этого у поляков есть глагол chrzanić «нести вздор»."
idioms:
  - { pl: "sos chrzanowy", ru: "хреновый соус" }
formExamplesSkip:
  - { form: "chrzanowi", reason: "мужско-личная форма множественного числа, а chrzanowy — это «из хрена»: sos chrzanowy, zupa chrzanowa, pasta chrzanowa. О людях так не говорят, поэтому формы chrzanowi в текстах нет" }
