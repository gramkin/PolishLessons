# review
id: matura
format: 2
lemma: "matura"
rank: 5746
pos: noun
pron: { cyr: "мату́ра" }
senses:
  - id: exam
    ru: "выпускной экзамен в школе"
    examples:
      - pl: "Matura zaczyna się w maju."
        ru: "Выпускные экзамены начинаются в мае."
        source: { kind: authored }
      - pl: "Zdał maturę z wyróżnieniem."
        ru: "Он сдал выпускной экзамен с отличием."
        source: { kind: authored }
      - pl: "Matura z matematyki jest obowiązkowa."
        ru: "Экзамен по математике обязателен."
        source: { kind: authored }
  - id: certificate
    ru: "свидетельство о сдаче выпускного экзамена"
    examples:
      - pl: "Bez matury nie wejdziesz na studia."
        ru: "Без аттестата в вуз не поступишь."
        source: { kind: authored }
      - pl: "Pokazał maturę przy rekrutacji."
        ru: "Он показал аттестат при приёме."
        source: { kind: authored }
notes:
  - { kind: government, text: "Женский род: matura, matury, maturze. Частые глаголы: zdawać maturę «сдавать», zdać maturę «сдать», oblać maturę «провалить»." }
  - { kind: usage, text: "Экзамен после liceum или technikum, открывающий дорогу в вуз. Русского точного соответствия нет: ближе всего ЕГЭ вместе с аттестатом." }
  - { kind: usage, text: "Различают maturę pisemną «письменную» и ustną «устную», а также starą и nową maturę — по системе до и после реформы." }
  - { kind: false-friend, text: "Слова «матура» в русском нет, как нет и точного аналога самого экзамена: matura это сразу и испытание, и документ о его сдаче. Латинский корень mātūrus «зрелый» отдельным русским словом не закрепился, так что опереться на знакомое здесь не на что." }
collocations:
  - { pl: "zdać maturę", ru: "сдать выпускной экзамен" }
  - { pl: "matura z polskiego", ru: "экзамен по польскому" }
  - { pl: "po maturze", ru: "после выпускных экзаменов" }
family:
  - { pl: "maturalny", ru: "выпускной, относящийся к матуре", relation: derived }
  - { pl: "szkoła", ru: "школа", relation: root, id: szkola }
etymology: "Из латинского сокращения exāmina mātūra «экзамены зрелости» от mātūrus «зрелый, взрослый». То же самое слово — австрийская и швейцарская Matura; немецкое Abitur значит то же, но образовано от другого латинского корня, abiturire «собираться уходить»."
memory: "matura — выпускной экзамен, пропуск в вуз. От латинского mātūrus «зрелый»: экзамен на зрелость. Zdać maturę «сдать матуру»."
idioms:
  - { pl: "zdać maturę", ru: "сдать выпускной экзамен" }
