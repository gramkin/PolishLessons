# review
id: pojechac
format: 2
lemma: "pojechać"
rank: 443
pos: verb
aspect: perf
pron: { cyr: "пое́хаць" }
senses:
  - id: go
    ru: "поехать"
    examples:
      - pl: "Pojadę tramwajem."
        ru: "Я поеду на трамвае."
        source: { kind: tatoeba, id: 10138134 }
      - pl: "Pojadę do Bostonu z Tomem."
        ru: "Я поеду в Бостон с Томом."
        source: { kind: tatoeba, id: 6733710 }
      - pl: "Pojadę następnym autobusem."
        ru: "Я поеду следующим автобусом."
        source: { kind: tatoeba, id: 5377714 }
  - id: go-by
    ru: "поехать (на чём-либо — творительный падеж)"
    examples:
      - pl: "Pojechali metrem."
        ru: "Они поехали на метро."
        source: { kind: tatoeba, id: 1802142 }
      - pl: "Pojadę samochodem z Tomkiem."
        ru: "Я поеду с Томом на машине."
        source: { kind: tatoeba, id: 2269707 }
      - pl: "Pojadę trolejbusem."
        ru: "Я поеду на троллейбусе."
        source: { kind: tatoeba, id: 10138268 }
notes:
  - { kind: usage, text: "Будущее берёт совсем другую основу: pojadę, pojedziesz, pojedzie — при прошедшем pojechał." }
  - { kind: usage, text: "На чём поехали — творительный падеж без предлога: pojechać tramwajem «поехать на трамвае», pojechać samochodem «поехать на машине»." }
  - { kind: usage, text: "Повелительное наклонение — pojedź «поезжай», pojedźcie «поезжайте», pojedźmy «поедем»." }
  - { kind: usage, text: "Несовершенный вид — jechać. pojechać значит «поехать один раз», а не «ездить регулярно»." }
collocations:
  - { pl: "pojechać samochodem", ru: "поехать на машине" }
  - { pl: "pojechać na wakacje", ru: "поехать в отпуск" }
  - { pl: "pojedźmy", ru: "поедем" }
  - { pl: "pojechać do domu", ru: "поехать домой" }
etymology: "Из po- + jechać, праславянское *jexati; русское «поехать» собрано ровно из тех же частей."
memory: "pojechać — «поехать», слово буква в букву русское. Но будущее берёт другую основу: pojadę, pojedziesz. А на чём поехали, говорят простым творительным: pojechałem tramwajem."
idioms:
  - { pl: "pojechać po bandzie", ru: "перегнуть палку" }
  - { pl: "pojechać na wakacje", ru: "поехать в отпуск" }
  - { pl: "pojechać do domu", ru: "поехать домой" }
