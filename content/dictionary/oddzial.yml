# review
id: oddzial
format: 2
lemma: "oddział"
rank: 1296
pos: noun
pron: { cyr: "о́ддзяу" }
senses:
  - id: branch
    ru: "отделение, филиал (банка, фирмы)"
    examples:
      - pl: "Największy oddział tego banku znajduje się w Warszawie."
        ru: "Крупнейшее отделение этого банка находится в Варшаве."
        source: { kind: translated, id: 11692195 }
      - pl: "Tom jest dyrektorem oddziału."
        ru: "Том — директор отделения."
        source: { kind: translated, id: 7911140 }
      - pl: "Ich kolega został przeniesiony do zagranicznego oddziału firmy."
        ru: "Их коллегу перевели в зарубежное отделение фирмы."
        source: { kind: translated, id: 516502 }
  - id: ward
    ru: "отделение (больничное)"
    examples:
      - pl: "Została kierowniczką oddziału kardiologii w miejskim szpitalu."
        ru: "Она стала заведующей отделением кардиологии в городской больнице."
        source: { kind: translated, id: 10793812 }
      - pl: "Jestem najmłodsza w moim oddziale."
        ru: "Я самая младшая в своём отделении."
        source: { kind: translated, id: 10793798 }
      - pl: "Słyszałem, że zostałeś menadżerem oddziału w Sydney."
        ru: "Я слышал, что ты стал менеджером отделения в Сиднее."
        source: { kind: translated, id: 4785672 }
  - id: unit
    ru: "отряд, воинское подразделение"
    examples:
      - pl: "Nasz oddział zaatakował wroga."
        ru: "Наш отряд атаковал врага."
        source: { kind: translated, id: 8750852 }
      - pl: "Oddziały wojskowe wylądowały w Grecji."
        ru: "Воинские части высадились в Греции."
        source: { kind: translated, id: 1452381 }
      - pl: "Równolegle do formowania własnych oddziałów zaczęto działania pozoracyjne."
        ru: "Параллельно с формированием собственных отрядов начались отвлекающие действия."
        source: { kind: translated, id: 3743889 }
notes:
  - { kind: usage, text: "Одно слово на три русских: филиал банка, отделение больницы и воинский отряд. Контекст различает их безошибочно." }
  - { kind: government, text: "О больнице говорят na oddziale «в отделении», с предлогом na, но об отделении банка — w oddziale, с предлогом w." }
  - { kind: usage, text: "Родственные слова — oddzielić «отделить» и dział «отдел, раздел»." }
  - { kind: pronunciation, text: "Двойное dd произносится долго, а конечное ł звучит как «у»: о́ддзяу." }
collocations:
  - { pl: "oddział banku", ru: "отделение банка" }
  - { pl: "oddział szpitala", ru: "отделение больницы" }
  - { pl: "oddział wojskowy", ru: "воинское подразделение" }
etymology: "От oddzielić «отделить», из od- и dział «часть, раздел». Русское «отделение» собрано ровно теми же частями."
memory: "oddział — «отделение» во всех смыслах: филиал банка, больничное отделение и воинский отряд. Корень тот же, что в русских «отделить» и «отдел». Конечное ł звучит как «у»: о́ддзяу."
idioms:
