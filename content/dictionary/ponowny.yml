etymology: "От глагола PONOWIĆ «возобновить, сделать заново», а то от NOWY «новый». Повторное — это то, что сделано «по-новому», ещё раз. Русское «возобновить» собрано похоже, тоже от «новый»."
memory: "Ponowny — повторный: ponowna próba, ponowne uruchomienie (перезагрузка). От nowy. Ponownie — снова. Читается «поно́вны»."
