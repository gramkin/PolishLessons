notes:
  - { kind: false-friend, text: "POWTÓRNY и PONOWNY оба значат «повторный», и разница тонкая. PONOWNY — «ещё раз, снова»: PONOWNA PRÓBA, PONOWNE OTWARCIE. POWTÓRNY чаще о том, что сделано второй раз и иначе: POWTÓRNY EGZAMIN, «пересдача», POWTÓRNE MAŁŻEŃSTWO, «второй брак». С русским «поновлённый», «подновлённый», слово не связано: подновить по-польски ODNOWIĆ." }
  - { kind: usage, text: "Относительное прилагательное, степеней сравнения нет. Формы для мужчин-людей PONOWNI в карточке нет: повторными бывают попытки и выборы, а не люди. Остальные десять форм живые. Наречие PONOWNIE, «снова, повторно», ещё частотнее: PROSZĘ SPRÓBOWAĆ PONOWNIE, «попробуйте ещё раз»." }
  - { kind: government, text: "Ставится перед существительным: PONOWNE GŁOSOWANIE, PONOWNA ANALIZA. Чаще всего с отглагольными существительными на -NIE, -CIE: PONOWNE URUCHOMIENIE, «перезапуск», PONOWNE ROZPATRZENIE, «пересмотр». Падежных требований нет." }
  - { kind: pronunciation, text: "Читается «поно́вны», три слога, ударение на предпоследнем. Все O чёткие, без аканья. W перед N звонкое, «в». Сравните с PONOWNIE «поно́вне»." }
  - { kind: register, text: "Слово официальное, из документов, новостей и интерфейсов. PONOWNE URUCHOMIENIE — «перезагрузка» на экране компьютера. В разговоре чаще скажут JESZCZE RAZ: SPRÓBUJ JESZCZE RAZ, а прилагательное оставят для бумаг." }
