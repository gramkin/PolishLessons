    ru: "Он устал от ожидания."
    source: { kind: authored }
  - form: "poczekaniu"
    pl: "Po poczekaniu pół godziny wyszedł."
    ru: "Подождав полчаса, он ушёл."
    source: { kind: authored }
  - form: "poczekaniu"
    pl: "Mówimy o poczekaniu do jutra."
    ru: "Мы говорим о том, чтобы подождать до завтра."
    source: { kind: authored }
  - form: "poczekaniu"
    pl: "Dzięki poczekaniu uniknęliśmy korka."
    ru: "Благодаря тому что мы подождали, мы избежали пробки."
    source: { kind: authored }
  - form: "poczekano"
    pl: "Poczekano na wszystkich gości."
    ru: "Подождали всех гостей."
    source: { kind: authored }
  - form: "poczekano"
    pl: "Poczekano do rana."
    ru: "Подождали до утра."
    source: { kind: authored }
  - form: "poczekano"
    pl: "Z decyzją poczekano do poniedziałku."
    ru: "С решением подождали до понедельника."
    source: { kind: authored }
  - form: "poczekasz"
    pl: "Poczekasz na mnie jeszcze chwilkę?"
    ru: "Подождёшь меня ещё минутку?"
    source: { kind: tatoeba, id: 11741408 }
  - form: "poczekasz"
    pl: "Poczekasz na mnie?"
    ru: "Подождёшь меня?"
    source: { kind: translated, id: 3704138 }
  - form: "poczekasz"
    pl: "Poczekasz chwilę?"
    ru: "Подождёшь минутку?"
    source: { kind: authored }
  - form: "poczekawszy"
    pl: "Poczekawszy chwilę, wyszedł."
    ru: "Подождав минутку, он ушёл."
    source: { kind: authored }
  - form: "poczekawszy"
    pl: "Poczekawszy na wszystkich, ruszyli."
    ru: "Подождав всех, они тронулись."
    source: { kind: authored }
  - form: "poczekawszy"
    pl: "Poczekawszy do rana, zadzwonił."
