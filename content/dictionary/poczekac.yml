# review
id: poczekac
format: 2
lemma: "poczekać"
rank: 381
pos: verb
aspect: perf
aspectPair: czekac
pron: { cyr: "почэ́каць" }
senses:
  - id: wait
    ru: "подождать"
    examples:
      - pl: "Poczekaj tutaj."
        ru: "Подождите здесь."
        source: { kind: tatoeba, id: 3127363 }
      - pl: "Możesz poczekać?"
        ru: "Ты можешь подождать?"
        source: { kind: tatoeba, id: 2406021 }
      - pl: "Lepiej poczekaj tutaj."
        ru: "Лучше подожди здесь."
        source: { kind: tatoeba, id: 3664067 }
  - id: can-wait
    ru: "подождать, потерпеть (о деле, которое не срочно)"
    examples:
      - pl: "Czy to może poczekać?"
        ru: "Это может подождать?"
        source: { kind: tatoeba, id: 2405967 }
      - pl: "Będą musieli poczekać."
        ru: "Им придётся подождать."
        source: { kind: tatoeba, id: 6692596 }
      - pl: "Będziemy musieli poczekać."
        ru: "Нам придётся подождать."
        source: { kind: tatoeba, id: 5089033 }
notes:
  - { kind: usage, text: "Совершенный вид к czekać. Приставка po- добавляет оттенок «некоторое время», как русское «подождать» при «ждать»." }
  - { kind: usage, text: "Ждут кого-то с предлогом na и винительным падежом: Poczekam na ciebie «Я подожду тебя»." }
  - { kind: usage, text: "Czy to może poczekać? — «Это может подождать?», о деле, которое не горит." }
  - { kind: usage, text: "Poczekaj! — самое ходовое «Подожди!», а Poczekaj chwilę — «Подожди минутку»." }
collocations:
  - { pl: "poczekaj chwilę", ru: "подожди минутку" }
  - { pl: "poczekać na kogoś", ru: "подождать кого-либо" }
  - { pl: "to może poczekać", ru: "это может подождать" }
etymology: "Из po- + czekać; праславянское *čekati родственно русскому «чаять» (ожидать) — отсюда же «нечаянно», то есть «неожиданно»."
memory: "poczekać — «подождать», совершенный вид к czekać. Корень тот же, что в русском «чаять»: «нечаянно» значит «неожиданно». Ждут с предлогом na: Poczekam na ciebie."
idioms:
  - { pl: "poczekaj chwilę", ru: "подожди минутку" }
  - { pl: "to może poczekać", ru: "это может подождать" }
  - { pl: "kto czeka, ten się doczeka", ru: "кто ждёт, тот дождётся" }
