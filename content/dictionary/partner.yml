# review
id: partner
format: 2
lemma: "partner"
rank: 945
pos: noun
pron: { cyr: "па́ртнэр" }
senses:
  - id: partner
    ru: "партнёр (в деле, в паре)"
    examples:
      - pl: "Jestem twoim partnerem."
        ru: "Я твой партнёр."
        source: { kind: translated, id: 8763799 }
      - pl: "Tom jest moim partnerem."
        ru: "Том мой партнёр."
        source: { kind: translated, id: 3996307 }
      - pl: "Jego partner był onieśmielony jego wielkim sukcesem."
        ru: "Его партнёр был смущён его большим успехом."
        source: { kind: translated, id: 365233 }
  - id: business
    ru: "о деловых и государственных партнёрах"
    examples:
      - pl: "Jesteśmy partnerami."
        ru: "Мы партнёры."
        source: { kind: translated, id: 4735298 }
      - pl: "Algieria i Rosja są strategicznymi partnerami."
        ru: "Алжир и Россия — стратегические партнёры."
        source: { kind: translated, id: 13627091 }
      - pl: "Japonia i USA są dla siebie najważniejszymi partnerami handlowymi."
        ru: "Япония и США — важнейшие торговые партнёры друг для друга."
        source: { kind: translated, id: 448905 }
  - id: couple
    ru: "партнёр как спутник жизни"
    examples:
      - pl: "Zachowujemy się różnie, zależnie od partnera."
        ru: "Мы ведём себя по-разному в зависимости от партнёра."
        source: { kind: translated, id: 732950 }
      - pl: "Dla swej żony nie stanowi partnera do rozmowy."
        ru: "Для своей жены он не собеседник."
        source: { kind: translated, id: 756667 }
      - pl: "Mieszka z partnerem od roku."
        ru: "Она год живёт с партнёром."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Слово совпадает с русским «партнёр»: partner biznesowy «деловой партнёр», partner handlowy «торговый партнёр»." }
  - { kind: usage, text: "В разговоре о личной жизни partner и partnerka значат «спутник, спутница» — так говорят, когда не хотят уточнять, брак это или нет. По-русски всё чаще так же." }
  - { kind: government, text: "После być — творительный падеж: jestem twoim partnerem «я твой партнёр»." }
  - { kind: pronunciation, text: "Ударение на первом слоге: PART-ner, как и в русском." }
collocations:
  - { pl: "partner biznesowy", ru: "деловой партнёр" }
  - { pl: "partner handlowy", ru: "торговый партнёр" }
  - { pl: "jestem twoim partnerem", ru: "я твой партнёр" }
  - { pl: "partnerka", ru: "партнёрша" }
family:
  - { pl: "partnerka", ru: "партнёрша", relation: derived }
  - { pl: "partnerstwo", ru: "партнёрство", relation: derived }
  - { pl: "partnerski", ru: "партнёрский", relation: derived }
etymology: "Из английского partner, а то через французское parçonier из латинского pars «часть». Русское «партнёр» — то же заимствование."
memory: "partner — «партнёр», слово международное и ловушек не содержит. Годится и для дела (partner biznesowy), и для личной жизни: так говорят, когда не хотят уточнять, брак это или нет. После być — творительный: jestem twoim partnerem."
idioms:
  - { pl: "partner biznesowy", ru: "деловой партнёр" }
  - { pl: "partner handlowy", ru: "торговый партнёр" }
  - { pl: "partnerka", ru: "партнёрша" }
