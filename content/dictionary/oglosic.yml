# review
id: oglosic
format: 2
lemma: "ogłosić"
rank: 1821
pos: verb
pron: { cyr: "огуо́сиць" }
senses:
  - id: announce
    ru: "объявить, огласить"
    examples:
      - pl: "Ogłosił wyniki o piątej."
        ru: "Он объявил результаты в пять."
        source: { kind: authored }
      - pl: "Komisja ogłosi wyniki w piątek."
        ru: "Комиссия объявит результаты в пятницу."
        source: { kind: authored }
      - pl: "Wyniki ogłoszono w piątek."
        ru: "Результаты объявили в пятницу."
        source: { kind: authored }
  - id: declare-someone
    ru: "объявить кого-л. кем-л."
    examples:
      - pl: "Ogłoszono go zwycięzcą."
        ru: "Его объявили победителем."
        source: { kind: authored }
      - pl: "Ogłoszeni zwycięzcami zawodnicy weszli na podium."
        ru: "Объявленные победителями спортсмены вышли на подиум."
        source: { kind: authored }
  - id: notice
    ru: "ogłoszenie — объявление"
    examples:
      - pl: "Dał ogłoszenie w gazecie."
        ru: "Он дал объявление в газету."
        source: { kind: authored }
      - pl: "Przeczytał wszystkie ogłoszenia drobne."
        ru: "Он прочитал все мелкие объявления."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Переводите ogłosić как «ОБЪЯВИТЬ», а не «огласить». Русское «огласить» книжно и узко — оглашают приговор или волю собрания, — тогда как польское ogłosić совершенно обиходно: ogłosić wyniki, ogłosić nabór, ogłosić upadłość. Корень при этом общий: głos это «голос», и соответствие ol/оло уже знакомо по głosować (głos — «голос», głowa — «голова»)." }
  - { kind: usage, text: "Существительное ogłoszenie значит «ОБЪЯВЛЕНИЕ» и встречается постоянно: dać ogłoszenie «дать объявление», ogłoszenia drobne «мелкие объявления», tablica ogłoszeń «доска объявлений». Форма ogłoszenia служит и множественным числом этого существительного, и родительным единственного — различает контекст." }
  - { kind: government, text: "Объявляют ЧТО — винительный: ogłosić wyniki, ogłosić nabór. Объявляют КОГО КЕМ — винительный плюс ТВОРИТЕЛЬНЫЙ: ogłoszono go zwycięzcą, в точности как русское «объявили его победителем». Можно и целым придаточным: ogłosił, że rezygnuje." }
  - { kind: pronunciation, text: "Здесь снова работает правило краёв парадигмы: ogłoszę и ogłoszą идут с sz, а ogłosisz, ogłosi, ogłosimy, ogłosicie — с s. Первое лицо единственного и третье множественного держатся вместе против середины, как у więzić (więżę/więżą против więzisz) и zasnąć (zasnę/zasną против zaśniesz)." }
collocations:
  - { pl: "ogłosić wyniki", ru: "объявить результаты" }
  - { pl: "dać ogłoszenie", ru: "дать объявление" }
  - { pl: "ogłosić upadłość", ru: "объявить о банкротстве" }
family:
  - { pl: "głos", ru: "голос", relation: root, id: glos }
  - { pl: "ogłoszenie", ru: "объявление", relation: derived }
  - { pl: "głosić", ru: "возглашать, проповедовать", relation: root }
etymology: "Приставка o- плюс głosić «возглашать», от głos «голос», праславянское *golsъ. Русский «голос» — то же слово, и мена ol/оло здесь регулярна: głos при «голосе», głowa при «голове», złoto при «золоте». Русское «огласить» собрано из тех же частей, но осталось книжным, а польское ogłosić сделалось обиходным."
memory: "ogłosić — «объявить» (не книжное «огласить»), от głos «голос». Существительное ogłoszenie значит «объявление» — его вы встретите чаще глагола. И помните края парадигмы: ogłoszę, ogłoszą с sz, но ogłosisz с s."
idioms:
  - { pl: "dać ogłoszenie", ru: "дать объявление" }
  - { pl: "ogłosić upadłość", ru: "объявить о банкротстве" }
