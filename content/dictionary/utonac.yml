lemma: "utonąć"
rank: 4931
pos: verb
pron: { cyr: "уто́нонць" }
senses:
  - id: drown
    ru: "утонуть"
    examples:
      - pl: "Chłopiec utonął w rzece."
        ru: "Мальчик утонул в реке."
        source: { kind: authored }
      - pl: "Mało brakowało, a bym utonął."
        ru: "Ещё немного, и я бы утонул."
        source: { kind: authored }
      - pl: "Tego lata w jeziorze utonęło trzech turystów."
        ru: "Этим летом в озере утонули трое туристов."
        source: { kind: authored }
  - id: be-buried
    ru: "утонуть, погрязнуть (в бумагах, зелени, долгах)"
    examples:
      - pl: "Utonął w papierach."
        ru: "Он утонул в бумагах."
        source: { kind: authored }
      - pl: "Wieś utonęła w zieleni."
        ru: "Деревня утопала в зелени."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "UTONĄĆ — точное «утонуть» о человеке и животном. О корабле говорят ZATONĄĆ: STATEK ZATONĄŁ. «Утопить» — UTOPIĆ. Переносное совпадает: UTONĄĆ W DŁUGACH, W PAPIERACH. UTONĄĆ W CZYICHŚ OCZACH — «утонуть в чьих-то глазах», поэтически." }
  - { kind: usage, text: "Сорок одна форма из сорока двух: глагол совершенного вида и непереходный, страдательного причастия нет; деепричастие UTONĄWSZY книжное. Безличная форма UTONIĘTO в карточку не включена: несчастный случай не выражают безличной формой. Чередование: UTONĄŁ, но UTONĘŁA. Видовой партнёр — TONĄĆ." }
  - { kind: government, text: "Где — W с местным: UTONĄĆ W MORZU, W JEZIORZE. В переносном — тоже W: UTONĄĆ W PRACY, W MARZENIACH. «Чуть не утонул» — O MAŁO NIE UTONĄŁ, MAŁO BRAKOWAŁO, A BYM UTONĄŁ." }
  - { kind: pronunciation, text: "Читается «уто́нонць», три слога, ударение на предпоследнем. Ą перед Ć — «он». UTONĄŁ — «уто́ноу», UTONĘŁA — «утонэ́уа»." }
  - { kind: register, text: "Нейтральное слово новостей и быта: летом сводки сообщают, сколько людей UTONĘŁO. Переносное — разговорное и литературное. Пословица: TONĄCY BRZYTWY SIĘ CHWYTA — «утопающий хватается за соломинку»." }
collocations:
  - { pl: "utonąć w rzece", ru: "утонуть в реке" }
  - { pl: "utonąć w papierach", ru: "утонуть в бумагах" }
  - { pl: "utonąć w długach", ru: "погрязнуть в долгах" }
family:
  - { pl: "tonąć", ru: "тонуть", relation: aspect }
  - { pl: "utopić", ru: "утопить", relation: root }
  - { pl: "zatonąć", ru: "затонуть (о корабле)", relation: root }
etymology: "Приставка U- плюс TONĄĆ «тонуть», праславянское *tonǫti, то же, что русское «тонуть», «утонуть». Носовое Ą на месте русского «у»: TONĄĆ — «тонуть»."
memory: "Utonąć — утонуть: chłopiec utonął w rzece. Корабль — zatonąć! Utonąć w papierach — утонуть в бумагах. Tonący brzytwy się chwyta. Читается «уто́нонць»."
idioms:
  - { pl: "tonący brzytwy się chwyta", ru: "утопающий хватается за соломинку" }
formExamplesSkip:
