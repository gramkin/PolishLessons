# review
id: dotrzec
format: 2
lemma: "dotrzeć"
rank: 609
pos: verb
aspect: perf
pron: { cyr: "до́тшэць" }
senses:
  - id: reach
    ru: "добраться, дойти (do czegoś — родительный)"
    note: "dotrzeć do domu, do Warszawy, do celu."
    examples:
      - pl: "Dotarliśmy na szczyt góry."
        ru: "Мы добрались до вершины горы."
        source: { kind: translated, id: 525209 }
      - pl: "Nareszcie dotarliśmy do Anglii."
        ru: "Наконец мы добрались до Англии."
        source: { kind: translated, id: 6534329 }
      - pl: "Dotarli tam przed świtem."
        ru: "Они добрались туда до рассвета."
        source: { kind: translated, id: 771756 }
  - id: arrive
    ru: "прибыть, доехать"
    note: "Pociąg dotrze na dworzec przed południem."
    examples:
      - pl: "Ile czasu potrzeba aby dotrzeć z punktu A do punktu B?"
        ru: "Сколько времени требуется, чтобы добраться из пункта А в пункт Б?"
        source: { kind: tatoeba, id: 6109628 }
      - pl: "Pociąg dotrze na dworzec przed południem."
        ru: "Поезд прибудет на вокзал до полудня."
        source: { kind: translated, id: 733066 }
      - pl: "Czekamy, aż dotrze pizza."
        ru: "Мы ждём, пока привезут пиццу."
        source: { kind: translated, id: 10470372 }
  - id: sink-in
    ru: "дойти (о смысле): nie dotarło do mnie «до меня не дошло»"
    note: "Русский оборот устроен ровно так же."
    examples:
      - pl: "Nie dotarło do mnie, że on może zaprosić mnie na obiad."
        ru: "До меня не дошло, что он может пригласить меня на обед."
        source: { kind: translated, id: 863506 }
      - pl: "Wiadomości w końcu dotarły do mnie wczoraj wieczorem."
        ru: "Новости наконец дошли до меня вчера вечером."
        source: { kind: translated, id: 13797650 }
      - pl: "Negocjacje dotarły do martwego punktu."
        ru: "Переговоры зашли в тупик."
        source: { kind: translated, id: 3518420 }
  - id: run-in
    ru: "обкатать (двигатель, деталь) — исходное, буквальное значение"
    note: "dotarty silnik «обкатанный двигатель»: буквально «дотёртый»."
    examples:
      - pl: "Silnik jest już dotarty."
        ru: "Двигатель уже обкатан."
        source: { kind: authored }
      - pl: "Dotarte silniki zużywają mniej paliwa."
        ru: "Обкатанные двигатели расходуют меньше топлива."
        source: { kind: authored }
      - pl: "Dotarcie silnika trwa kilka tysięcy kilometrów."
        ru: "Обкатка двигателя длится несколько тысяч километров."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Две основы, и их надо держать вместе: будущее на -trze- (dotrę, dotrzesz, dotrze, dotrą), прошедшее на -tar- (dotarł, dotarła, dotarli). Тот же излом, что в trzeć «тереть» — tarł." }
  - { kind: government, text: "Цель идёт через do с родительным (dotrzeć do domu, do celu) или через na с винительным (dotrzeć na miejsce, na szczyt, na dworzec)." }
  - { kind: usage, text: "Несовершенный вид — docierać: docieraliśmy powoli." }
  - { kind: usage, text: "Переносное значение совпадает с русским: nie dotarło do mnie «до меня не дошло», wiadomość dotarła do nas «известие дошло до нас»." }
  - { kind: usage, text: "Отглагольное существительное — dotarcie: Ile potrwa dotarcie tam? «Сколько займёт дорога туда?»" }
collocations:
  - { pl: "dotrzeć do celu", ru: "добраться до цели" }
  - { pl: "dotrzeć na miejsce", ru: "добраться до места" }
  - { pl: "dotrzeć na czas", ru: "успеть вовремя" }
  - { pl: "nie dotarło do mnie", ru: "до меня не дошло" }
family:
  - { pl: "docierać", ru: "добираться", relation: aspect }
  - { pl: "trzeć", ru: "тереть", relation: root }
  - { pl: "dotarcie", ru: "прибытие; обкатка", relation: derived }
etymology: "Приставка do- плюс trzeć «тереть», праславянское *terti — то же слово, что русское «тереть». «Добраться» по-польски буквально «дотереться» до места; отсюда же dotarcie silnika «обкатка двигателя»."
memory: "dotrzeć — «добраться, дойти», и у него две основы, которые надо держать вместе: будущее dotrę, dotrzesz, dotrze, а прошедшее dotarł, dotarła, dotarli. Тот же излом, что в trzeć «тереть» — tarł, и это не случайность: dotrzeć буквально «дотереть» до места, а dotarty silnik до сих пор значит «обкатанный двигатель». Цель идёт через do с родительным или na с винительным. Переносное значение совпадает с русским точь-в-точь: nie dotarło do mnie «до меня не дошло»."
idioms:
  - { pl: "dotrzeć do celu", ru: "добраться до цели" }
  - { pl: "dotrzeć na czas", ru: "успеть вовремя" }
  - { pl: "nie dotarło do mnie", ru: "до меня не дошло" }
formExamplesSkip:
  - { form: "dotarci", reason: "страдательное причастие мужского лица: обкатывают деталь или двигатель, а не людей, поэтому такой формы в живом языке нет" }
