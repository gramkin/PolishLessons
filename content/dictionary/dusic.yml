# review
id: dusic
format: 2
lemma: "dusić"
rank: 4352
pos: verb
pron: { cyr: "ду́сиць" }
senses:
  - id: stew
    ru: "тушить (на кухне)"
    examples:
      - pl: "Duszę mięso z cebulą."
        ru: "Я тушу мясо с луком."
        source: { kind: authored }
      - pl: "Babcia dusi kapustę na obiad."
        ru: "Бабушка тушит капусту на обед."
        source: { kind: authored }
      - pl: "Warzywa trzeba dusić pod przykryciem."
        ru: "Овощи нужно тушить под крышкой."
        source: { kind: authored }
  - id: choke
    ru: "душить; DUSIĆ SIĘ — задыхаться; DUSIĆ W SOBIE — держать в себе"
    examples:
      - pl: "Dym dusi mnie w gardle."
        ru: "Дым душит меня в горле."
        source: { kind: authored }
      - pl: "Dusi w sobie złość."
        ru: "Он держит злость в себе."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "DUSIĆ — и «душить», и «тушить» на кухне. Второе значение — главная ловушка: DUSZONA KAPUSTA — «тушёная капуста», а не «задушенная». Русское «тушить» в смысле «гасить» — GASIĆ. С SIĘ — «задыхаться»: DUSZĘ SIĘ W TYM TŁUMIE." }
  - { kind: usage, text: "Несовершенный вид; совершенный — UDUSIĆ (задушить), UDUSIĆ SIĘ (задохнуться). Спряжение с чередованием S → SZ: DUSZĘ, DUSISZ, DUSZĄ; повелительное — DUŚ. Причастие DUSZONY — «тушёный», DUSZĄCY — «удушливый»." }
  - { kind: government, text: "Что тушить — винительный: DUSIĆ MIĘSO. В чём — W с предложным: DUSIĆ W WINIE. Кого душить — винительный: DUSIĆ KOGOŚ. От чего задыхаться — OD или Z с родительным: DUSIĆ SIĘ OD DYMU, ZE ŚMIECHU." }
  - { kind: pronunciation, text: "Читается «ду́сиць»: SI — мягкое «си», ударение на первом слоге. DUSZĘ — «ду́шэ», DUŚ — «дусь»." }
  - { kind: register, text: "В кулинарии — нейтральное и частое. О человеке — эмоциональное: DUSZĘ SIĘ W TEJ PRACY «я задыхаюсь на этой работе»." }
collocations:
  - { pl: "dusić mięso", ru: "тушить мясо" }
  - { pl: "dusić się od dymu", ru: "задыхаться от дыма" }
  - { pl: "dusić coś w sobie", ru: "держать что-то в себе" }
family:
  - { pl: "udusić", ru: "задушить; потушить", relation: aspect, id: udusic }
  - { pl: "oddychać", ru: "дышать", relation: root, id: oddychac }
  - { pl: "duszność", ru: "одышка, удушье", relation: derived }
etymology: "Праславянское *dusiti, связанное с *duchъ «дух, дыхание», как русское «душить», «удушье». Кулинарное значение — «держать под крышкой без воздуха»."
memory: "Dusić — тушить (на кухне) и душить: duszona kapusta — тушёная капуста! Dusić się — задыхаться."
idioms:
  - { pl: "dusić się we własnym sosie", ru: "вариться в собственном соку" }
