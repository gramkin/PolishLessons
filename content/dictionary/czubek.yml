# review
id: czubek
format: 2
lemma: "czubek"
rank: 4741
pos: noun
pron: { cyr: "чу́бэк" }
senses:
  - id: tip
    ru: "кончик, верхушка"
    examples:
      - pl: "Stanęła na czubkach palców."
        ru: "Она встала на цыпочки."
        source: { kind: authored }
      - pl: "Na czubku choinki świeciła gwiazda."
        ru: "На верхушке ёлки сияла звезда."
        source: { kind: authored }
      - pl: "Dotknął czubkiem buta kamienia."
        ru: "Он коснулся камня носком ботинка."
        source: { kind: authored }
  - id: crown
    ru: "макушка (головы)"
    examples:
      - pl: "Pocałował ją w czubek głowy."
        ru: "Он поцеловал её в макушку."
        source: { kind: authored }
      - pl: "Na czubku głowy ma łysinkę."
        ru: "На макушке у него лысинка."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Русский «чуб» — прядь волос надо лбом, а польский CZUB — хохол и вообще верх: CZUB DRZEWA. CZUBEK — кончик или верхушка чего угодно: носа, пальца, ёлки, ботинка. Отсюда и неожиданное CZUBIĆ SIĘ — «цапаться», буквально «таскать друг друга за чубы»." }
  - { kind: usage, text: "Одиннадцать форм в таблице, мужской род. Беглое E: CZUBEK, но CZUBKA. В винительном две формы, CZUBEK и разговорная CZUBKA. Личная форма множественного числа CZUBKOWIE к значению «кончик» не относится." }
  - { kind: government, text: "На цыпочках — NA CZUBKACH PALCÓW, буквально «на кончиках пальцев». С головы до пят — OD CZUBKA GŁOWY DO PIĘT, родительный после OD и DO. Вертится на языке — MIEĆ COŚ NA CZUBKU JĘZYKA, местный падеж." }
  - { kind: pronunciation, text: "Читается «чу́бэк», два слога, ударение на первом. CZ даёт «ч», а E после B звучит твёрдо, «э». В формах без беглого E буква B стоит перед K и оглушается: CZUBKA — «чу́пка»." }
collocations:
  - { pl: "czubek nosa", ru: "кончик носа" }
  - { pl: "czubek drzewa", ru: "верхушка дерева" }
  - { pl: "na czubku języka", ru: "на кончике языка" }
family:
  - { pl: "czub", ru: "хохол, чуб; верх", relation: root }
  - { pl: "czubaty", ru: "хохлатый", relation: derived }
  - { pl: "czubić", ru: "цапаться, ссориться (czubić się)", relation: derived }
etymology: "Слово праславянское, общее с русским и украинским «чуб». В польском значение расширилось от пряди волос до любого верха, а уменьшительное CZUBEK стало обычным словом для кончика."
memory: "Czubek — кончик, верхушка: czubek nosa, czubek drzewa. Читается «чу́бэк», а czubka — «чу́пка». Na czubkach palców — на цыпочках. Od czubka głowy do pięt — с головы до пят. Czubek góry lodowej — верхушка айсберга."
idioms:
  - { pl: "od czubka głowy do pięt", ru: "с головы до пят" }
  - { pl: "czubek góry lodowej", ru: "верхушка айсберга" }
  - { pl: "nie widzieć dalej niż czubek własnego nosa", ru: "не видеть дальше собственного носа" }
