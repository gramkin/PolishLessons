etymology: "От ŻAL «печаль, сожаление», от праславянского корня, давшего и русские «жаль», «жалеть», и ту самую «жалобу». Корень один, а итоги разошлись: русский закрепил за ним жалобу, то есть высказанное недовольство, а польский — траур, то есть переживание утраты. Оба смысла выросли из одного исходного, из боли и сожаления, и потому слова так похожи и так обманчивы одновременно."
memory: "Один из самых опасных ложных друзей: żałoba это «траур», а не «жалоба». Жалоба по-польски skarga. Корень общий с русским «жалью» и «жалеть», и именно он подсказывает верный смысл: żal «печаль», żałować «сожалеть». На слух слова разводит чтение: ż даёт «ж», ł даёт «у», и żałoba звучит «жауо́ба». Родительный множественного żałób, с чередованием o в ó."
idioms:
  - { pl: "żałoba narodowa", ru: "национальный траур" }
