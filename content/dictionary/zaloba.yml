notes:
  - { kind: false-friend, text: "Один из самых опасных ложных друзей в этом словаре. ŻAŁOBA это «траур», а не «жалоба». Русская жалоба, та, которую подают в суд или начальству, по-польски SKARGA. Созвучие почти полное, а смысл совсем иной: JEST W ŻAŁOBIE значит «она в трауре». Корень при этом общий, и он подсказывает правильно: ŻAL «печаль», ŻAŁOWAĆ «сожалеть», как русские «жаль» и «жалеть»." }
  - { kind: usage, text: "Десять форм, женский род. В дательном и местном падеже единственного числа B переходит в BI: ŻAŁOBA, но W ŻAŁOBIE. Родительный множественного ŻAŁÓB, с чередованием O в Ó, которое в польском обычно именно в этой форме: ŻAŁOBA — ŻAŁÓB, как GŁOWA — GŁÓW. Множественное число употребляют, когда речь о нескольких объявленных траурах." }
  - { kind: government, text: "Быть в трауре — BYĆ W ŻAŁOBIE, предлог W с местным падежом, как и по-русски. Траур по кому-либо — ŻAŁOBA PO KIMŚ, предлог PO с местным падежом, тогда как русский говорит «траур по кому-то» с дательным. Носить траур — NOSIĆ ŻAŁOBĘ, винительный без предлога. Объявить траур — OGŁOSIĆ ŻAŁOBĘ, тоже винительный." }
  - { kind: pronunciation, text: "Читается «жауо́ба», три слога, ударение на втором. Буква Ż даёт твёрдое «ж», а Ł даёт «у», поэтому середина слова звучит «уо», и на слух оно совсем не похоже на русскую «жалобу». Именно это различие и спасает от путаницы в речи, хотя на письме слова почти одинаковы. В местном падеже ŻAŁOBIE слышно «жауо́бе», с мягким «бе»." }
  - { kind: register, text: "Слово нейтральное и серьёзное: ŻAŁOBA NARODOWA объявляется распоряжением и означает опущенные до половины флаги и отменённые концерты. BYĆ W ŻAŁOBIE говорят о семье умершего, NOSIĆ ŻAŁOBĘ — о чёрной одежде, которую в Польше и сегодня носят по родителям месяцами. В психологии ŻAŁOBA это процесс переживания утраты, и слово звучит без всякой торжественности." }
collocations:
