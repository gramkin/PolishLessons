notes:
  - { kind: government, text: "Главное, что надо запомнить: этот глагол требует РОДИТЕЛЬНОГО падежа, а русский в том же месте берёт винительный. DOTRZYMAĆ SŁOWA, OBIETNICY, TERMINU, WARUNKÓW, TOWARZYSTWA, KROKU — везде родительный, тогда как по-русски «сдержать слово», «соблюсти срок» с винительным. Ошибка DOTRZYMAĆ SŁOWO звучит для поляка так же неправильно, как для русского «сдержать слова». Кому — дательный: DOTRZYMAĆ KOMUŚ TOWARZYSTWA." }
  - { kind: false-friend, text: "Корень TRZYM- отвечает русскому «держ-»: TRZYMAĆ — «держать», TRZYMAĆ SIĘ — «держаться». Но приставочные слова расходятся. DOTRZYMAĆ значит не «додержать», а именно «сдержать» — слово, обещание, срок. Русское «сдержать» по строению ближе к польскому ZATRZYMAĆ, а ZATRZYMAĆ значит «остановить, задержать»: ZATRZYMAJ SAMOCHÓD. Так что по частям слово не разбирается, его надо взять целиком вместе с родительным падежом." }
  - { kind: usage, text: "Три значения различаются дополнением, и все три в ходу. Обещание: DOTRZYMAĆ SŁOWA — самое частое, почти формула. Срок или условие: DOTRZYMAĆ TERMINU, WARUNKÓW — язык договоров. И общество: DOTRZYMAĆ KOMUŚ TOWARZYSTWA «составить кому-то компанию», DOTRZYMAĆ KROKU «не отстать», причём второе годится и в переносном смысле, о конкуренции. Несовершенная пара — DOTRZYMYWAĆ." }
  - { kind: pronunciation, text: "Основа на -YMA- с настоящим на -AM, как у CZYTAĆ: DOTRZYMAM, DOTRZYMASZ, DOTRZYMA. Сочетание TRZ читается «тш», одним движением, без гласной: всё слово звучит «дотшы́маць». Русскому помогает, что у него есть похожий стык в «отчим», только здесь он твёрже. Повелительное DOTRZYMAJ оканчивается на -AJ, от основы инфинитива." }
collocations:
  - { pl: "dotrzymać słowa", ru: "сдержать слово" }
  - { pl: "dotrzymać terminu", ru: "соблюсти срок" }
