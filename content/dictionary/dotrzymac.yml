  - { pl: "trzymać", ru: "держать", relation: root, id: trzymac }
  - { pl: "zatrzymać", ru: "остановить, задержать", relation: root, id: zatrzymac }
etymology: "Приставка do- «до-» и TRZYMAĆ, из праславянского *trimati, родственного русскому «держать» через общий корень *der-/*trim- с перестановкой. Польское гнездо широкое: TRZYMAĆ «держать», TRZYMAĆ SIĘ «держаться», ZATRZYMAĆ «остановить», UTRZYMAĆ «содержать, удержать», POWSTRZYMAĆ «удержать, сдержать». Приставка do- здесь значит «довести до конца», и отсюда DOTRZYMAĆ SŁOWA: додержать обещание до того срока, когда его надо исполнить. Русский выразил ту же мысль приставкой «с-», и получилось «сдержать»."
memory: "dotrzymać требует родительного: dotrzymać słowA, terminU, towarzystwA — не słowo. Русский тут берёт винительный, и это самая частая ошибка."
idioms:
  - { pl: "dotrzymać słowa", ru: "сдержать слово" }
  - { pl: "dotrzymać kroku", ru: "не отстать, идти в ногу" }
formExamplesSkip:
  - { form: "dotrzymani", reason: "Страдательное причастие мужского лица множественного числа. Дополнением у этого глагола бывает только обещание, срок, условие, общество или шаг — SŁOWA, TERMINU, WARUNKÓW, TOWARZYSTWA, KROKU, — и всегда в родительном падеже; человек прямым дополнением тут не бывает никогда. Значит у мужско-личной страдательной формы нет и не может быть подлежащего. Остальные формы причастия в карточке есть с примерами: DOTRZYMANE SŁOWO, DOTRZYMANY TERMIN, DOTRZYMANA OBIETNICA. Так же пропущены ZEZNAWANI и PRZELECIANI в прошлых партиях." }
