# review
id: zawodowiec
format: 2
lemma: "zawodowiec"
rank: 4752
pos: noun
pron: { cyr: "заводо́вец" }
senses:
  - id: professional
    ru: "профессионал"
    examples:
      - pl: "Ten mechanik to zawodowiec."
        ru: "Этот механик — профессионал."
        source: { kind: authored }
      - pl: "Zatrudnijmy zawodowca, a nie amatora."
        ru: "Давайте наймём профессионала, а не любителя."
        source: { kind: authored }
      - pl: "Zrobił to jak zawodowiec."
        ru: "Он сделал это как профессионал."
        source: { kind: authored }
  - id: pro-athlete
    ru: "спортсмен-профессионал"
    examples:
      - pl: "Został bokserem zawodowcem."
        ru: "Он стал боксёром-профессионалом."
        source: { kind: authored }
      - pl: "Na turnieju grają tylko zawodowcy."
        ru: "На турнире играют только профессионалы."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ZAWODOWIEC — от ZAWÓD «профессия», а не от «завода». Завод по-польски — FABRYKA или ZAKŁAD. ZAWÓD к тому же значит «разочарование»: SPRAWIĆ KOMUŚ ZAWÓD — «разочаровать». Противоположность ZAWODOWCA — AMATOR." }
  - { kind: usage, text: "Десять форм, мужской род, лицо. Беглое E: ZAWODOWIEC, но ZAWODOWCA, ZAWODOWCY. Местный и звательный совпадают: ZAWODOWCU. Женского парного слова нет, говорят PROFESJONALISTKA." }
  - { kind: government, text: "Профессионал в своей области — ZAWODOWIEC W SWOJEJ DZIEDZINIE, W с местным. Перейти в профессионалы — PRZEJŚĆ NA ZAWODOWSTWO. Оставь это профессионалам — ZOSTAW TO ZAWODOWCOM, дательный." }
  - { kind: pronunciation, text: "Читается «заводо́вец», ударение на предпоследнем слоге. WIE — «ве», конечное C — «ц». Все O читаются как «о», хотя в ZAWÓD «за́вут» Ó звучит «у»." }
  - { kind: register, text: "Слово нейтральное и хвалебное: TO PRAWDZIWY ZAWODOWIEC. Синонимы — PROFESJONALISTA и разговорное FACHOWIEC, «мастер, спец»." }
collocations:
  - { pl: "prawdziwy zawodowiec", ru: "настоящий профессионал" }
  - { pl: "liga zawodowców", ru: "профессиональная лига" }
  - { pl: "przejść na zawodowstwo", ru: "перейти в профессионалы" }
family:
  - { pl: "zawód", ru: "профессия; разочарование", relation: root, id: zawod }
  - { pl: "zawodowy", ru: "профессиональный", relation: root, id: zawodowy }
  - { pl: "zawody", ru: "соревнования", relation: root }
etymology: "От ZAWODOWY «профессиональный», а оно — от ZAWÓD «профессия». Исходно ZAWÓD — «состязание»: отсюда ZAWODY, «соревнования». O и Ó чередуются: ZAWÓD, ZAWODU, ZAWODOWIEC."
memory: "Zawodowiec — профессионал, от zawód «профессия», а не «завод». Читается «заводо́вец». Amator — любитель. Zostaw to zawodowcom — оставь это профессионалам."
idioms:
  - { pl: "zawodowiec w każdym calu", ru: "профессионал до мозга костей" }
