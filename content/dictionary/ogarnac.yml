        source: { kind: authored }
  - id: encompass
    ru: "охватить, объять (взглядом, умом)"
    examples:
      - pl: "Trudno ogarnąć tyle informacji."
        ru: "Трудно охватить столько информации."
        source: { kind: authored }
      - pl: "Nie da się tego ogarnąć wzrokiem."
        ru: "Этого не охватить взглядом."
        source: { kind: authored }
  - id: sort-out
    ru: "разг. прибрать; справиться, разобраться"
    examples:
      - pl: "Ogarnij się wreszcie."
        ru: "Возьми себя наконец в руки."
        source: { kind: authored }
      - pl: "Ogarnęłam mieszkanie przed świętami."
        ru: "Я прибрала квартиру перед праздниками."
        source: { kind: authored }
notes:
  - { kind: government, text: "ogarnąć coś, kogoś — ВИНИТЕЛЬНЫЙ падеж. Дополнением бывает и человек, когда его охватывает чувство: strach go ogarnął. Поэтому мужсколичное причастие ogarnięci совершенно обычно: ogarnięci paniką ludzie «охваченные паникой люди»." }
  - { kind: register, text: "Третье значение — разговорное и очень живое в современной речи: ogarnąć temat «разобраться в теме», ogarnąć pokój «прибрать комнату», ogarnij się «возьми себя в руки, приведи себя в порядок». В письменном и официальном языке так не пишут, но в быту слышно постоянно." }
  - { kind: usage, text: "Совершенный вид; несовершенный — ogarniać. Чередование ą/ę в прошедшем времени обязательно: ogarnął (он), но ogarnęła (она), ogarnęli, ogarnęły. Это обычная модель глаголов на -nąć." }
  - { kind: false-friend, text: "Корень тот же, что в польском garść и русском «горсть». Но русское «огорнуть» не существует, а «обнять» и «охватить» — это другие корни, так что опереться можно только на «горсть»: ogarnąć — как бы «забрать в пригоршню», отсюда и «охватить», и «прибрать»." }
collocations:
  - { pl: "ogarnął go strach", ru: "его охватил страх" }
  - { pl: "ogarnąć wzrokiem", ru: "охватить взглядом" }
  - { pl: "ogarnąć temat", ru: "разобраться в теме (разг.)" }
family:
  - { pl: "ogarniać", ru: "охватывать", relation: aspect }
  - { pl: "garnąć", ru: "сгребать, притягивать к себе", relation: root }
  - { pl: "garść", ru: "горсть", relation: root }
  - { pl: "zgarnąć", ru: "сгрести, забрать", relation: derived }
etymology: "Приставка o- «вокруг» и глагол garnąć. Праславянский корень *gъrn-/*gъr-, тот же, что в garść «горсть» — и это прямой родственник русского «горсть». Исходный образ — сгребание руками, захват в пригоршню; отсюда garnąć «сгребать, притягивать к себе» и целое гнездо приставочных: ogarnąć, zgarnąć, zagarnąć, przygarnąć. ogarnąć — буквально «обхватить со всех сторон», откуда и огонь, охватывающий дом, и страх, охватывающий человека, и разговорное «прибрать, осилить»."
memory: "ogarnąć — «охватить»: o- «вокруг» + garnąć, корень тот же, что в garść «горсть». Огонь, страх и паника ogarniają человека; а в разговорной речи ogarnij się значит «возьми себя в руки»."
idioms:
  - { pl: "ogarnij się", ru: "возьми себя в руки; приведи себя в порядок (разг.)" }
  - { pl: "nie mogę tego ogarnąć", ru: "не могу этого осилить, в голове не укладывается (разг.)" }
