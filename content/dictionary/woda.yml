notes:
  - { kind: usage, text: "Предложный падеж с чередованием d → dz: w wodzie «в воде», но do wody «в воду»." }
  - { kind: usage, text: "Множественное wody значит «воды» — моря, реки, минеральные воды." }
  - { kind: usage, text: "burza w szklance wody — «буря в стакане воды»; cicha woda — о тихом человеке, как русское «в тихом омуте»." }
collocations:
  - { pl: "w wodzie", ru: "в воде" }
  - { pl: "szklanka wody", ru: "стакан воды" }
  - { pl: "woda mineralna", ru: "минеральная вода" }
  - { pl: "pić wodę", ru: "пить воду" }
etymology: "Праславянское *voda из праиндоевропейского *wodr — то же слово, что русское «вода»; отсюда же английское water."
memory: "woda — «вода», буква в букву. Но в предложном падеже d чередуется с dz: w wodzie «в воде»."
idioms:
  - { pl: "burza w szklance wody", ru: "буря в стакане воды" }
  - { pl: "cicha woda", ru: "в тихом омуте черти водятся" }
  - { pl: "woda mineralna", ru: "минеральная вода" }
formExamplesSkip:
  - { form: "wodo", reason: "звательный падеж от этого слова в живой речи не употребляется" }
