# review
id: zespol
format: 2
lemma: "zespół"
rank: 677
pos: noun
pron: { cyr: "зэ́спуу" }
senses:
  - id: band
    ru: "группа (музыкальная)"
    note: "grać w zespole «играть в группе»."
    examples:
      - pl: "Gram w zespole."
        ru: "Я играю в группе."
        source: { kind: translated, id: 631086 }
      - pl: "Śpiewasz w zespole?"
        ru: "Ты поёшь в группе?"
        source: { kind: translated, id: 1366451 }
      - pl: "Uwielbiam ten zespół."
        ru: "Я обожаю эту группу."
        source: { kind: translated, id: 6170130 }
  - id: team
    ru: "команда, коллектив"
    examples:
      - pl: "Nasz zespół odniósł wielkie zwycięstwo."
        ru: "Наша команда одержала большую победу."
        source: { kind: tatoeba, id: 5975457 }
      - pl: "Nasz zespół przegrał."
        ru: "Наша команда проиграла."
        source: { kind: translated, id: 757634 }
      - pl: "Jesteś członkiem zespołu."
        ru: "Ты член команды."
        source: { kind: translated, id: 13030390 }
  - id: as-a-team
    ru: "zespołem — командой (творительный)"
    examples:
      - pl: "Nadal jesteśmy zespołem."
        ru: "Мы всё ещё команда."
        source: { kind: translated, id: 3778938 }
      - pl: "Najważniejsze, że jesteśmy zespołem."
        ru: "Главное, что мы команда."
        source: { kind: translated, id: 12132953 }
      - pl: "Nasz zespół toczył wyrównaną walkę z zespołem S."
        ru: "Наша команда вела равную борьбу с командой «С»."
        source: { kind: translated, id: 982416 }
notes:
  - { kind: usage, text: "Одно польское слово покрывает три русских: и музыкальную группу (grać w zespole), и спортивную команду (nasz zespół przegrał), и рабочий коллектив." }
  - { kind: usage, text: "В медицине zespół значит «синдром»: zespół Downa «синдром Дауна»." }
  - { kind: usage, text: "Беглое ó: в именительном zespół, но в косвенных падежах o — zespołu, w zespole, zespołem." }
  - { kind: usage, text: "Родня: zespołowy «коллективный», wspólny «общий», współpraca «сотрудничество»." }
collocations:
  - { pl: "grać w zespole", ru: "играть в группе" }
  - { pl: "nasz zespół", ru: "наша команда" }
  - { pl: "zespół Downa", ru: "синдром Дауна" }
  - { pl: "praca zespołowa", ru: "командная работа" }
family:
  - { pl: "zespołowy", ru: "коллективный", relation: derived }
  - { pl: "wspólny", ru: "общий", relation: root }
  - { pl: "drużyna", ru: "команда", relation: root }
etymology: "Из ze- плюс spół «совместность» — то же гнездо, что wspólny «общий» и społeczeństwo «общество»; по-русски ближе всего «сообща» и приставка «со-»."
memory: "zespół — одно слово там, где русский берёт три: и «группа» (grać w zespole), и «команда» (nasz zespół przegrał), и «коллектив». В медицине оно же значит «синдром»: zespół Downa. Следите за беглым ó: в именительном zespół, но zespołu, w zespole, zespołem."
idioms:
  - { pl: "grać w zespole", ru: "играть в группе" }
  - { pl: "nasz zespół", ru: "наша команда" }
  - { pl: "zespół Downa", ru: "синдром Дауна" }
