# review
id: ujsc
format: 2
lemma: "ujść"
rank: 3715
pos: verb
pron: { cyr: "у́йсьць" }
senses:
  - id: escape
    ru: "уйти, спастись, избежать"
    examples:
      - pl: "Uszedł z życiem z pożaru."
        ru: "Он спасся живым из пожара."
        source: { kind: authored }
      - pl: "Złodziej uszedł pogoni."
        ru: "Вор ушёл от погони."
        source: { kind: authored }
      - pl: "Nikt nie ujdzie przed sprawiedliwością."
        ru: "Никто не уйдёт от правосудия."
        source: { kind: authored }
  - id: go-unnoticed
    ru: "ускользнуть (от внимания); сойти с рук"
    examples:
      - pl: "Ten błąd uszedł mojej uwadze."
        ru: "Эта ошибка ускользнула от моего внимания."
        source: { kind: authored }
      - pl: "Nie myśl, że to ci ujdzie na sucho."
        ru: "Не думай, что это сойдёт тебе с рук."
        source: { kind: authored }
  - id: leak
    ru: "выйти, вытечь (о газе, воздухе)"
    examples:
      - pl: "Z opony uszło powietrze."
        ru: "Из шины вышел воздух."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "UJŚĆ — не просто «уйти»: уйти из дома — WYJŚĆ, уйти от кого-то — ODEJŚĆ. UJŚĆ — «уйти от опасности, ускользнуть»: UJŚĆ Z ŻYCIEM, UJŚĆ POGONI. Разговорное UJDZIE — «сойдёт, сгодится»: MOŻE BYĆ? — UJDZIE. А UJŚCIE RZEKI — «устье реки»: то место, куда река «уходит»." }
  - { kind: usage, text: "Сорок одна форма: совершенный вид, непереходный, без страдательного причастия и без безличной формы на -NO. Прошедшее нерегулярно: USZEDŁ, USZŁA, USZLI — как у WYJŚĆ, WYSZEDŁ. Деепричастие USZEDŁSZY — книжное. Видовой партнёр — UCHODZIĆ: UCHODZI ZA EKSPERTA, «слывёт экспертом»." }
  - { kind: government, text: "Чего избежать — родительный: UJŚĆ ŚMIERCI, UJŚĆ POGONI, UJŚĆ KARY. От чьего внимания — дательный: UJŚĆ CZYJEJŚ UWADZE. Сойти с рук — UJŚĆ NA SUCHO, UJŚĆ PŁAZEM, UJŚĆ BEZKARNIE, с дательным лица: TO MU NIE UJDZIE." }
  - { kind: pronunciation, text: "Читается «у́йсьць», два слога: U-JŚĆ, ударение на первом. J — «й», ŚĆ — два мягких: «сьць». USZEDŁ — «у́шэдуу» с коротким «у» на месте Ł. UJDZIE — «у́йдзе»." }
  - { kind: register, text: "Глагол нейтральный и книжный одновременно: UJŚĆ Z ŻYCIEM — в новостях, UJŚĆ UWADZE — в официальной речи. Разговорное UJDZIE и UJDZIE W TŁUMIE — «сойдёт, в толпе не заметят» — очень частые." }
collocations:
  - { pl: "ujść z życiem", ru: "спастись живым" }
  - { pl: "ujść uwadze", ru: "ускользнуть от внимания" }
  - { pl: "ujść na sucho", ru: "сойти с рук" }
family:
  - { pl: "uchodzić", ru: "уходить; слыть", relation: aspect, id: uchodzic }
  - { pl: "wyjść", ru: "выйти", relation: root, id: wyjsc }
  - { pl: "uchodźca", ru: "беженец", relation: derived }
etymology: "Приставка U- «у-, прочь» плюс IŚĆ «идти», того же корня, что русское «идти», «уйти». В прошедшем — основа SZED-, как в русском «шёл»: USZEDŁ и «ушёл». От того же глагола — UCHODŹCA, «беженец», буквально «уходящий»."
memory: "Ujść — уйти от опасности: ujść z życiem, ujść pogoni. Ujść uwadze — ускользнуть от внимания. Ujść na sucho — сойти с рук. Ujdzie — сойдёт! Ujście rzeki — устье. Читается «у́йсьць»."
idioms:
  - { pl: "ujdzie w tłumie", ru: "сойдёт, никто не заметит" }
