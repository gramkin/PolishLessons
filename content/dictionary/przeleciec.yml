notes:
  - { kind: usage, text: "Корень знакомый: LECIEĆ — «лететь», и приставки идут парами с русскими. PRZELECIEĆ — «перелететь, пролететь», PRZYLECIEĆ — «прилететь», ODLECIEĆ — «отлететь», WYLECIEĆ — «вылететь», POLECIEĆ — «полететь», DOLECIEĆ — «долететь». Расходится одна деталь: русское «пролететь» и «перелететь» польский берёт одним словом, а различает предлогом. NAD MIASTEM — пролетел над городом, не садясь; Z GAŁĘZI NA GAŁĄŹ — перелетел с ветки на ветку, то есть переместился." }
  - { kind: government, text: "Направление и путь — предлогами: PRZELECIEĆ NAD CZYMŚ с творительным (NAD MIASTEM, NAD MORZEM), PRZELECIEĆ Z CZEGOŚ NA COŚ (Z GAŁĘZI NA GAŁĄŹ), PRZELECIEĆ PRZEZ COŚ с винительным (PRZEZ CAŁY KRAJ). А вот пройденное расстояние берёт прямой винительный без предлога, и именно поэтому у этого непереходного по смыслу глагола есть страдательные причастия: PRZELECIEĆ TYSIĄC KILOMETRÓW, PRZELECIEĆ CAŁĄ TRASĘ. То же в русском: «пролетел тысячу километров»." }
  - { kind: pronunciation, text: "В прошедшем времени основа играет -eli против -ały по роду: PRZELECIELI с ie для мужского лица, PRZELECIAŁY с a для всего остального. Это обычное поведение глаголов на -EĆ: так же ведут себя WIDZIEĆ (WIDZIELI при WIDZIAŁY) и SŁYSZEĆ. В единственном числе мужское PRZELECIAŁ держит a, так что мена показывается только во множественном. И ещё одна мена, уже между разрядами: отглагольное существительное берёт мягкую основу — PRZELECENIE, PRZELECENIA, а страдательное причастие твёрдую на -IANY — PRZELECIANY, PRZELECIANA. Один глагол, две разные основы, и угадать одну по другой нельзя." }
  - { kind: register, text: "Одно предупреждение, без которого карточку выпускать нельзя. PRZELECIEĆ KOGOŚ — грубое просторечие с совсем другим, интимным смыслом, и сказать PRZELECIAŁEM GO, думая «я пролетел мимо него», значит сказать нечто совершенно иное. В нейтральной речи этот глагол берёт прямым дополнением только расстояние или путь: PRZELECIEĆ TYSIĄC KILOMETRÓW, PRZELECIEĆ CAŁĄ TRASĘ. Мимо человека пролетают с предлогом: PRZELECIEĆ OBOK KOGOŚ. Поэтому в карточке и нет формы PRZELECIANI — страдательное причастие мужского лица требует одушевлённого дополнения, а оно тут бывает только в том самом просторечии." }
