etymology: "Приставка prze- «пере-, про-» и LECIEĆ, из праславянского *letěti — тот же корень, что русские «лететь», «полёт», «лётчик». Соответствие полное, без сдвигов: польское LECIEĆ и русское «лететь», LOT и «полёт», SAMOLOT и «самолёт». Приставка prze- тоже двойник русской, и обе несут оба смысла сразу — «пере-» (сменить место) и «про-» (пройти насквозь или мимо), почему PRZELECIEĆ и отвечает то «перелететь», то «пролететь». От второго смысла и переносное о времени: оно не меняет места, а проходит мимо."
memory: "lecieć — «лететь», и дальше приставки свои: przylecieć «прилететь», odlecieć «отлететь», wylecieć «вылететь», przelecieć «пролететь». А czas przeleciał — «время пролетело», как по-русски."
idioms:
  - { pl: "czas przeleciał", ru: "время пролетело" }
  - { pl: "przelecieć wzrokiem", ru: "пробежать глазами" }
formExamplesSkip:
  - { form: "przeleciani", reason: "Страдательное причастие мужского лица множественного числа. Нейтральное PRZELECIEĆ берёт прямым дополнением только расстояние или путь — PRZELECIEĆ TYSIĄC KILOMETRÓW, CAŁĄ TRASĘ, — а это никогда не мужское лицо; мимо человека пролетают с предлогом, PRZELECIEĆ OBOK KOGOŚ. Одушевлённое дополнение глагол получает лишь в грубом просторечии, разобранном в примечании о регистре, и примеров такого рода карточка не даёт." }
