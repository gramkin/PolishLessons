etymology: "От глагола ZWARIOWAĆ «сойти с ума», а тот от существительного WARIAT «сумасшедший», пришедшего через латынь от VARIUS «переменчивый, разный». Образ прозрачен: безумие как непостоянство, переменчивость ума. Русский взял тот же латинский корень, но только в прямом смысле изменчивости: «варьировать», «вариант», «вариация», «вариативный». Получилось, что одно латинское слово дало в двух языках совершенно непохожие гнёзда, и польское WARIAT оказалось дальним родственником русского «варианта». Из того же польского гнезда WARIACTWO «безумие» и WARIACKI «безумный, сумасбродный»."
memory: "За словом стоит wariat «сумасшедший», и это не «вариант»: «вариант» по-польски wariant, с n. Оба от латинского varius «переменчивый», но русский взял корень только для изменчивости, а польский ещё и для безумия. Это причастие от zwariować, поэтому степеней сравнения нет, усиливают наречием, całkiem zwariowany. Второе значение держится на обороте na punkcie с родительным: zwariowany na punkcie piłki nożnej «помешанный на футболе»."
idioms:
  - { pl: "zwariowany na punkcie", ru: "помешанный на чём-то" }
