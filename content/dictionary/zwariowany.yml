notes:
  - { kind: false-friend, text: "За этим прилагательным стоит слово, которое обманывает русский глаз полностью: WARIAT значит «сумасшедший», а не «вариант». TEN WARIAT ZNOWU DZWONI — «этот сумасшедший снова звонит». «Вариант» по-польски WARIANT, и буква N отличает одно от другого. Оба слова пришли из одного латинского корня VARIUS «переменчивый», но разошлись: в русский он попал только как «варьировать» и «вариант», а польский взял его ещё и для безумия, через идею переменчивого, непостоянного ума. ZWARIOWAĆ значит «сойти с ума», а ZWARIOWANY — результат этого." }
  - { kind: usage, text: "Это страдательное причастие от ZWARIOWAĆ «сойти с ума», ставшее обычным прилагательным, и отсюда одиннадцать форм без степеней сравнения: у причастий их не бывает. Если нужно усилить, берут наречие: CAŁKIEM ZWARIOWANY «совсем сумасшедший». Второе значение держится на обороте NA PUNKCIE: ZWARIOWANY NA PUNKCIE CZEGOŚ значит «помешанный на чём-то», и без этого оборота слова «помешан на» по-польски не передать. Мужско-личная форма ZWARIOWANI совершенно обычна, потому что речь чаще всего именно о людях." }
  - { kind: government, text: "Главная конструкция одна, и запомнить её надо целиком: NA PUNKCIE плюс родительный падеж. ZWARIOWANY NA PUNKCIE PIŁKI NOŻNEJ — «помешанный на футболе», NA PUNKCIE PORZĄDKU — «на порядке». Буквально это «на пункте чего-то», и русский строит мысль иначе, через предлог «на» с предложным падежом. Тот же оборот работает с глаголом: ZWARIOWAĆ NA PUNKCIE KOGOŚ «помешаться на ком-то». В первом значении прилагательное управления не имеет и просто согласуется." }
  - { kind: pronunciation, text: "Читается «зварьова́ны», четыре слога, ударение на предпоследнем. Буква I в середине слова не гласная, а знак мягкости предыдущей R, поэтому слышно «рьо», а не «рио». Начальное ZW звучит звонко, «зв». В основе ZWARIOWAĆ ударение падает на предпоследний слог инфинитива: «зварьова́чь». Само существительное WARIAT читается «ва́рьят», с ударением на первом слоге." }
  - { kind: register, text: "Слово разговорное и чаще дружелюбное, чем обидное: им описывают затею, день, компанию, погоду. Частые обороты: ZWARIOWANY POMYSŁ «безумная идея», ZWARIOWANE LATA DZIEWIĘĆDZIESIĄTE «безумные девяностые», ZWARIOWANY NA PUNKCIE. Если нужно сказать о настоящей болезни, слово не годится: там будут CHORY PSYCHICZNIE или ZABURZONY. А вот существительное WARIAT в адрес человека звучит резко, почти как русское «психованный», и в лицо его лучше не говорить." }
