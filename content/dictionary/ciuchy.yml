# review
id: ciuchy
format: 2
lemma: "ciuchy"
rank: 2510
pos: noun
pron: { cyr: "цю́хы" }
senses:
  - id: clothes-colloquial
    ru: "шмотки, одежда (разг.)"
    examples:
      - pl: "Ciuchy walały się po całym pokoju."
        ru: "Шмотки валялись по всей комнате."
        source: { kind: authored }
      - pl: "Kupiła nowe ciuchy na wyprzedaży."
        ru: "Она купила новые шмотки на распродаже."
        source: { kind: authored }
  - id: secondhand
    ru: "вещи, шмотьё (о подержанной одежде)"
    examples:
      - pl: "Handluje ciuchami z drugiej ręki."
        ru: "Он торгует подержанной одеждой."
        source: { kind: authored }
      - pl: "W tych ciuchach wyglądasz młodziej."
        ru: "В этих шмотках ты выглядишь моложе."
        source: { kind: authored }
  - id: plural-only
    ru: "шмотки (только мн. ч.)"
    examples:
      - pl: "Nie mam już miejsca na tyle ciuchów."
        ru: "У меня уже нет места для стольких шмоток."
        source: { kind: authored }
notes:
  - { kind: usage, text: "ЭТО СЛОВО СУЩЕСТВУЕТ ТОЛЬКО ВО МНОЖЕСТВЕННОМ ЧИСЛЕ, И ФОРМ У НЕГО ПЯТЬ. Ciuchy, ciuchów, ciuchom, ciuchami, ciuchach — единственного числа в обиходе нет. Так же ведут себя przeprosiny, odwiedziny, finanse, drzwi и spodnie. Русские «шмотки» тоже обычно во множественном, так что привычка совпадает." }
  - { kind: register, text: "Слово разговорное и слегка пренебрежительное, как русские «шмотки». Нейтральное название одежды — UBRANIA, а вещь поштучно — ubranie. В магазине и в документе напишут ubrania, а дома скажут ciuchy. Отсюда ciuchland — магазин секонд-хенда." }
  - { kind: pronunciation, text: "Два слога, ударение на первом: CIU-chy. Ci читается как мягкое ць, ch как х, y как ы: «цю́хы». Родительный ciuchów звучит «цю́хуф», с ó как у и оглушением в конце." }
collocations:
  - { pl: "nowe ciuchy", ru: "новые шмотки" }
  - { pl: "ciuchy z drugiej ręki", ru: "одежда из вторых рук" }
  - { pl: "zabrać swoje ciuchy", ru: "забрать свои вещи" }
family:
  - { pl: "ubranie", ru: "одежда", relation: root, id: ubranie }
  - { pl: "spodnie", ru: "брюки", relation: root, id: spodnie }
  - { pl: "koszula", ru: "рубашка", relation: root, id: koszula }
etymology: "Слово разговорное, появилось в польском в двадцатом веке и прочно связалось с торговлей подержанной одеждой — отсюда и ciuchland. Происхождение самого ciuch надёжно не установлено; этимологи называют его словом экспрессивного, бытового происхождения, без ясных славянских родственников."
memory: "ciuchy — «шмотки», только во множественном числе, пять форм. Нейтральное слово — ubrania. Русское «шмотки» тоже почти всегда во множественном, так что привычка не меняется."
idioms:
  - { pl: "ciuchy z drugiej ręki", ru: "одежда из вторых рук" }
  - { pl: "nie mam w co się ubrać", ru: "нечего надеть" }
