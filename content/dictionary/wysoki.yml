# review
id: wysoki
format: 2
lemma: "wysoki"
rank: 383
pos: adj
pron: { cyr: "высо́ки" }
senses:
  - id: tall
    ru: "высокий (о росте, о предмете)"
    examples:
      - pl: "Mary jest wysoka."
        ru: "Мэри высокая."
        source: { kind: tatoeba, id: 553541 }
      - pl: "Mój ojciec jest wysoki."
        ru: "Мой отец высокий."
        source: { kind: tatoeba, id: 366684 }
      - pl: "Jaka wysoka góra!"
        ru: "Какая высокая гора!"
        source: { kind: tatoeba, id: 5369920 }
  - id: level
    ru: "высокий (о цене, уровне, качестве)"
    examples:
      - pl: "On ma wysoką pensję."
        ru: "У него высокая зарплата."
        source: { kind: translated, id: 351872 }
      - pl: "Artykuł jest wysokiej jakości."
        ru: "Статья высокого качества."
        source: { kind: translated, id: 393333 }
      - pl: "Ceny są za wysokie."
        ru: "Цены слишком высокие."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Степени сравнения меняют корень до неузнаваемости: wysoki → wyższy → najwyższy, ровно как русское «высокий → выше → высший»." }
  - { kind: usage, text: "najwyższy значит и «самый высокий», и «высший»: Sąd Najwyższy «Верховный суд», najwyższy czas «давно пора»." }
  - { kind: usage, text: "Мужско-личная форма множественного числа — wysocy: Czy są wysocy? «Они высокие?»" }
  - { kind: usage, text: "О цене, температуре и качестве тоже wysoki: wysoka cena, wysoka gorączka, wysoka jakość." }
collocations:
  - { pl: "wysoka cena", ru: "высокая цена" }
  - { pl: "wysoka jakość", ru: "высокое качество" }
  - { pl: "najwyższy czas", ru: "давно пора" }
  - { pl: "Sąd Najwyższy", ru: "Верховный суд" }
etymology: "Праславянское *vysokъ; русское «высокий» — то же самое слово, буква в букву."
memory: "wysoki — «высокий», слово совпадает с русским. Учить надо только степени сравнения: wysoki → wyższy → najwyższy, ровно как «высокий → выше → высший». И держите в памяти najwyższy czas — «давно пора»."
idioms:
  - { pl: "najwyższy czas", ru: "давно пора" }
  - { pl: "wysoki jak brzoza, a głupi jak koza", ru: "ростом с берёзу, а умом с козу" }
  - { pl: "wysokie C", ru: "верхнее до" }
