notes:
  - { kind: usage, text: "Между PIERŚCIEŃ и PIERŚCIONEK есть разделение труда. Pierścionek — это кольцо как украшение, обручальное или с камнем, то, что дарят. Pierścień крупнее и шире по смыслу: перстень с печаткой, кольцо Сатурна, годичное кольцо на срезе, уплотнительное кольцо в механизме. Русское «кольцо» покрывает всё это одним словом, поэтому выбирать приходится по предмету." }
  - { kind: pronunciation, text: "Основа мягкая насквозь, и это видно по родительному множественного: PIERŚCIENI, без окончания -ów, которое берут твёрдые основы вроде wzorów или koszów. Мягкий ń в именительном не выпадает, а переходит в ni перед гласной: pierścień — pierścienia — pierścieniem." }
collocations:
  - { pl: "pierścień z sygnetem", ru: "перстень с печаткой" }
  - { pl: "pierścienie Saturna", ru: "кольца Сатурна" }
  - { pl: "pierścień uszczelniający", ru: "уплотнительное кольцо" }
family:
  - { pl: "pierścionek", ru: "колечко, кольцо", relation: derived }
  - { pl: "pierścieniowy", ru: "кольцевой", relation: derived }
  - { pl: "naparstek", ru: "напёрсток", relation: root }
etymology: "Из праславянского *pьrstenь, от *pьrstъ «палец» — то же слово, что русский «перст». Оба языка сохранили этот древний корень именно здесь: польское pierścień и русский «перстень» буквально «то, что на пальце», хотя сам палец давно называется иначе, palec и «палец». Из того же корня польское naparstek и наш «напёрсток» — то, что надевают на перст."
memory: "Корень тот же, что в «персте»: pierścień — это «то, что на пальце». Основа мягкая, поэтому родительный множественного pierścieni, без -ów."
idioms:
