# review
id: przezyc
format: 2
lemma: "przeżyć"
rank: 674
pos: verb
aspect: perf
pron: { cyr: "пшэ́жыць" }
senses:
  - id: survive
    ru: "выжить, уцелеть"
    examples:
      - pl: "Człowiek nie przeżyje bez powietrza."
        ru: "Человек не выживет без воздуха."
        source: { kind: tatoeba, id: 946854 }
      - pl: "Wszyscy przeżyli."
        ru: "Все выжили."
        source: { kind: translated, id: 8571621 }
      - pl: "Nieliczni pasażerowie przeżyli katastrofę."
        ru: "Немногие пассажиры пережили катастрофу."
        source: { kind: translated, id: 352890 }
  - id: outlive
    ru: "пережить (кого-л. — прожить дольше)"
    examples:
      - pl: "Mój pradziadek przeżył mojego dziadka."
        ru: "Мой прадед пережил моего деда."
        source: { kind: tatoeba, id: 4197525 }
      - pl: "Mary przeżyła tu trzydzieści lat."
        ru: "Мэри прожила здесь тридцать лет."
        source: { kind: tatoeba, id: 3460231 }
      - pl: "Płakała z radości, kiedy usłyszała, że jej syn przeżył katastrofę samolotu."
        ru: "Она заплакала от радости, когда услышала, что ее сын выжил в авиакатастрофе."
        source: { kind: tatoeba, id: 350027 }
  - id: experience
    ru: "пережить, испытать"
    note: "Przeżyłem piękne chwile «Я пережил прекрасные минуты»."
    examples:
      - pl: "Przeżyłem piękne chwile."
        ru: "Я пережил прекрасные минуты."
        source: { kind: translated, id: 3696362 }
      - pl: "Przeżyła załamanie nerwowe."
        ru: "Она пережила нервный срыв."
        source: { kind: translated, id: 730428 }
      - pl: "W zeszłym roku na biegunie południowym przeżyłem straszne mrozy."
        ru: "В прошлом году на Южном полюсе я пережил страшные морозы."
        source: { kind: translated, id: 744161 }
  - id: experience-noun
    ru: "przeżycie — переживание; выживание"
    note: "walczyć o przeżycie «бороться за выживание»."
    examples:
      - pl: "Trzęsienie ziemi było strasznym przeżyciem."
        ru: "Землетрясение было страшным переживанием."
        source: { kind: translated, id: 6895109 }
      - pl: "Walczę o przeżycie."
        ru: "Я борюсь за выживание."
        source: { kind: translated, id: 516378 }
      - pl: "Jazda samochodem w tej zamieci była strasznym przeżyciem."
        ru: "Езда на машине в эту метель была страшным переживанием."
        source: { kind: translated, id: 922445 }
notes:
  - { kind: usage, text: "Три значения, и русский держит их в одном глаголе точно так же: «выжить» (wszyscy przeżyli), «прожить дольше кого-то» (przeżył mojego dziadka) и «испытать» (przeżyłem piękne chwile)." }
  - { kind: usage, text: "Отглагольное существительное przeżycie значит и «переживание, впечатление» (straszne przeżycie), и «выживание» (walczyć o przeżycie)." }
  - { kind: usage, text: "Несовершенный вид — przeżywać: przeżywał to bardzo długo." }
  - { kind: usage, text: "Разговорное Przeżyjesz! значит «Переживёшь! Ничего с тобой не случится»." }
collocations:
  - { pl: "walczyć o przeżycie", ru: "бороться за выживание" }
  - { pl: "Przeżyjesz!", ru: "Переживёшь!" }
  - { pl: "straszne przeżycie", ru: "страшное переживание" }
  - { pl: "przeżyć katastrofę", ru: "пережить катастрофу" }
family:
  - { pl: "przeżywać", ru: "переживать", relation: aspect }
  - { pl: "żyć", ru: "жить", relation: root }
  - { pl: "przeżycie", ru: "переживание", relation: derived }
etymology: "Приставка prze- плюс żyć «жить», праславянское *žiti — то же слово, что русское «жить». «Пережить» собрано тем же способом."
memory: "przeżyć — «пережить», и оба языка держат в одном глаголе три смысла: «выжить» (wszyscy przeżyli), «прожить дольше кого-то» (przeżył mojego dziadka) и «испытать» (przeżyłem piękne chwile). Существительное przeżycie значит и «переживание», и «выживание»: walczyć o przeżycie. А разговорное Przeżyjesz! — это ровно русское «Переживёшь!»."
idioms:
  - { pl: "walczyć o przeżycie", ru: "бороться за выживание" }
  - { pl: "Przeżyjesz!", ru: "Переживёшь!" }
  - { pl: "straszne przeżycie", ru: "страшное переживание" }
