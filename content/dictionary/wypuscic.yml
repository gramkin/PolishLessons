# review
id: wypuscic
format: 2
lemma: "wypuścić"
rank: 1041
pos: verb
aspect: perf
pron: { cyr: "выпу́сьциць" }
senses:
  - id: let-out
    ru: "выпустить (на волю)"
    examples:
      - pl: "Wypuść mnie."
        ru: "Выпусти меня."
        source: { kind: translated, id: 2785762 }
      - pl: "Otworzył klatkę i wypuścił ptaki."
        ru: "Он открыл клетку и выпустил птиц."
        source: { kind: translated, id: 418308 }
      - pl: "Chłopiec wypuścił ptaka z klatki."
        ru: "Мальчик выпустил птицу из клетки."
        source: { kind: translated, id: 597850 }
  - id: release
    ru: "wypuścić z więzienia — выпустить из тюрьмы"
    examples:
      - pl: "Toma wypuszczono z więzienia dwudziestego października."
        ru: "Тома выпустили из тюрьмы двадцатого октября."
        source: { kind: translated, id: 11264111 }
      - pl: "Więzień został wypuszczony wczoraj."
        ru: "Заключённого выпустили вчера."
        source: { kind: translated, id: 529519 }
      - pl: "Policjant wypuścił go z ostrzeżeniem."
        ru: "Полицейский отпустил его с предупреждением."
        source: { kind: translated, id: 696449 }
  - id: let-go
    ru: "выпустить (воздух, листья, добычу)"
    examples:
      - pl: "Wypuść powietrze."
        ru: "Выпусти воздух."
        source: { kind: translated, id: 12470459 }
      - pl: "Drzewa wypuściły liście."
        ru: "Деревья выпустили листья."
        source: { kind: translated, id: 360960 }
      - pl: "Pies nie chce wypuścić zdobyczy z zębów."
        ru: "Пёс не хочет выпускать из зубов добычу."
        source: { kind: translated, id: 13066694 }
notes:
  - { kind: usage, text: "Несовершенный вид — wypuszczać, и основа меняется: wypuścić, но wypuszczę, wypuszczą. Эту пару надо запомнить вместе." }
  - { kind: government, text: "wypuścić kogoś Z czegoś — «выпустить кого-то из чего-то», предлог z с родительным: wypuścić ptaka z klatki, wypuścić z więzienia." }
  - { kind: usage, text: "Wypuść mnie! — «Выпусти меня!», частая реплика. А wypuścić powietrze значит «выпустить воздух, выдохнуть»." }
  - { kind: usage, text: "О растениях: drzewa wypuściły liście «деревья выпустили листья», то есть распустились." }
collocations:
  - { pl: "wypuść mnie", ru: "выпусти меня" }
  - { pl: "wypuścić z więzienia", ru: "выпустить из тюрьмы" }
  - { pl: "wypuścić powietrze", ru: "выпустить воздух" }
  - { pl: "wypuścić ptaka", ru: "выпустить птицу" }
family:
  - { pl: "wypuszczać", ru: "выпускать", relation: aspect }
  - { pl: "puścić", ru: "пустить", relation: root }
  - { pl: "wypust", ru: "выпуск", relation: derived }
etymology: "Приставка wy- + puścić «пустить». Русское «выпустить» собрано ровно так же, морфема в морфему."
memory: "wypuścić — «выпустить»: Wypuść mnie! Несовершенный вид wypuszczać, и основа меняется — wypuszczę, wypuszczą. Управление: wypuścić kogoś Z czegoś, с предлогом z и родительным."
idioms:
