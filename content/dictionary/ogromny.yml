# review
id: ogromny
format: 2
lemma: "ogromny"
rank: 1118
pos: adj
pron: { cyr: "огро́мны" }
senses:
  - id: huge
    ru: "огромный"
    examples:
      - pl: "W centrum Kioto był ogromny korek."
        ru: "В центре Киото была огромная пробка."
        source: { kind: tatoeba, id: 1180609 }
      - pl: "Na ścianie siedziała ogromna mucha."
        ru: "На стене сидела огромная муха."
        source: { kind: tatoeba, id: 12478684 }
      - pl: "Porcje są ogromne."
        ru: "Порции огромные."
        source: { kind: tatoeba, id: 8095884 }
  - id: figurative
    ru: "огромный (об успехе, разнице, впечатлении)"
    examples:
      - pl: "Ten film był ogromnym sukcesem."
        ru: "Этот фильм имел огромный успех."
        source: { kind: translated, id: 7610461 }
      - pl: "Robicie ogromną robotę."
        ru: "Вы делаете большую работу."
        source: { kind: tatoeba, id: 6313099 }
  - id: people
    ru: "огромный, громадный (о человеке, животном)"
    examples:
      - pl: "Trzej ogromni mężczyźni zaatakowali go i okradli z pieniędzy."
        ru: "Трое огромных мужчин напали на него и отобрали деньги."
        source: { kind: translated, id: 3029862 }
      - pl: "Pająk był czarny, włochaty i ogromny."
        ru: "Паук был черным, волосатым и огромным."
        source: { kind: tatoeba, id: 8627576 }
notes:
  - { kind: usage, text: "Склоняется как обычное прилагательное: ogromny, ogromna, ogromne, ogromnego, ogromnym." }
  - { kind: usage, text: "Степени сравнения у этого прилагательного практически не образуются — значение и так предельное. Вместо ogromniejszy скажут jeszcze większy или olbrzymi." }
  - { kind: usage, text: "Соседи по смыслу: duży «большой» слабее, wielki «великий, большой» шире, olbrzymi и gigantyczny сильнее." }
  - { kind: usage, text: "ogromnymi krokami «огромными шагами» — и буквально, и о быстром развитии событий." }
collocations:
  - { pl: "ogromny sukces", ru: "огромный успех" }
  - { pl: "ogromna różnica", ru: "огромная разница" }
  - { pl: "ogromne wrażenie", ru: "огромное впечатление" }
  - { pl: "ogromnymi krokami", ru: "огромными шагами" }
family:
  - { pl: "ogrom", ru: "громада, огромность", relation: derived }
  - { pl: "grom", ru: "гром", relation: root }
etymology: "От приставки o- и grom «гром»: изначально «такой, что поражает как гром». Русское «огромный» собрано из тех же частей и тем же способом."
memory: "ogromny — «огромный», и слово буквально то же самое: o + grom, «как гром». Степеней сравнения почти не образует: значение и так предельное, вместо ogromniejszy скажут olbrzymi."
idioms:
  - { pl: "ogromnymi krokami", ru: "огромными шагами" }
  - { pl: "ogromne wrażenie", ru: "огромное впечатление" }
