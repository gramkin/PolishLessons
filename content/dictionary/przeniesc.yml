# review
id: przeniesc
format: 2
lemma: "przenieść"
rank: 865
pos: verb
aspect: perf
pron: { cyr: "пшэ́несьць" }
senses:
  - id: move
    ru: "перенести, переместить"
    examples:
      - pl: "Pomogłem mu przenieść stół."
        ru: "Я помог ему перенести стол."
        source: { kind: translated, id: 3759708 }
      - pl: "Mac pomógł mi przenieść odkurzacz."
        ru: "Мак помог мне перенести пылесос."
        source: { kind: translated, id: 364804 }
      - pl: "Sam nie przeniosę tej walizki."
        ru: "Один я этот чемодан не перенесу."
        source: { kind: translated, id: 364563 }
  - id: transfer
    ru: "перевести (на другое место работы)"
    examples:
      - pl: "Tom niedawno został przeniesiony do Australii."
        ru: "Тома недавно перевели в Австралию."
        source: { kind: translated, id: 12359833 }
      - pl: "Ich kolega został przeniesiony do zagranicznego oddziału firmy."
        ru: "Их коллегу перевели в зарубежный филиал фирмы."
        source: { kind: translated, id: 516502 }
      - pl: "Krzyż został przeniesiony do kościoła."
        ru: "Крест перенесли в церковь."
        source: { kind: translated, id: 526210 }
  - id: move-oneself
    ru: "przenieść się — переехать, перенестись"
    examples:
      - pl: "Musisz się przenieść."
        ru: "Тебе надо переехать."
        source: { kind: translated, id: 8807801 }
      - pl: "Tom chciałby się przenieść."
        ru: "Том хотел бы переехать."
        source: { kind: translated, id: 3662198 }
      - pl: "W ten sposób przenieśliśmy się w kolorowy świat fantazji."
        ru: "Так мы перенеслись в красочный мир фантазии."
        source: { kind: translated, id: 6156278 }
notes:
  - { kind: usage, text: "Основа меняется четыре раза: инфинитив przenieść, будущее przeniosę, przeniesie, прошедшее przeniósł, причастие przeniesiony. Их надо запомнить вместе." }
  - { kind: usage, text: "В мужском роде прошедшего времени пишется ó: przeniósł, przeniósłby. Во всех остальных лицах ó пропадает — przeniosła, przeniosło, przeniosłem." }
  - { kind: usage, text: "Возвратное przenieść się значит «переехать»: przenieść się do Warszawy. Переносно — «перенестись»: przenieśliśmy się w świat fantazji." }
  - { kind: usage, text: "Несовершенный вид — przenosić. Отглагольное существительное przeniesienie значит «перенос, перевод»." }
collocations:
  - { pl: "przenieść stół", ru: "перенести стол" }
  - { pl: "przenieść się", ru: "переехать" }
  - { pl: "przeniesiony do", ru: "переведённый в" }
  - { pl: "przenieść termin", ru: "перенести срок" }
family:
  - { pl: "przenosić", ru: "переносить", relation: aspect }
  - { pl: "nieść", ru: "нести", relation: root }
  - { pl: "przeniesienie", ru: "перенос, перевод", relation: derived }
etymology: "Приставка prze- + nieść «нести». Русское «перенести» собрано ровно так же: «пере-» плюс «нести», морфема в морфему."
memory: "przenieść — «перенести», и основа меняется четыре раза: przenieść, przeniosę, przeniósł, przeniesiony. В мужском роде прошедшего пишется ó — przeniósł, przeniósłby, — а в остальных лицах оно пропадает."
idioms:
  - { pl: "przenieść się", ru: "переехать" }
  - { pl: "przeniesiony do", ru: "переведённый в" }
  - { pl: "przenieść termin", ru: "перенести срок" }
