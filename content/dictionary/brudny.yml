etymology: "От brud «грязь», праславянское *brudъ. Русское «брудный» не сохранилось, но родственно диалектному «брудный, брудить» — в литературном русском на его месте «грязный»."
memory: "brudny = «грязный», от brud «грязь». Антоним — czysty. Переносно работает так же, как в русском: brudne pieniądze «грязные деньги», brudna robota «грязная работа»."
