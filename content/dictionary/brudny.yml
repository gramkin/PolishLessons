# review
id: brudny
format: 2
lemma: "brudny"
rank: 1601
pos: adj
pron: { cyr: "бру́дны" }
senses:
  - id: dirty
    ru: "грязный"
    examples:
      - pl: "Tom był brudny."
        ru: "Том был грязный."
        source: { kind: tatoeba, id: 3031857 }
      - pl: "Woda jest brudna."
        ru: "Вода грязная."
        source: { kind: translated, id: 10592531 }
      - pl: "Nóż jest brudny."
        ru: "Нож грязный."
        source: { kind: translated, id: 11581723 }
  - id: dirty-plural
    ru: "грязные (о предметах и людях)"
    examples:
      - pl: "Ulice są brudne."
        ru: "Улицы грязные."
        source: { kind: translated, id: 11581743 }
      - pl: "Byli brudni."
        ru: "Они были грязные."
        source: { kind: translated, id: 11581602 }
      - pl: "Zlew jest pełen brudnych naczyń."
        ru: "Раковина полна грязной посуды."
        source: { kind: tatoeba, id: 9532588 }
notes:
  - { kind: usage, text: "Антоним — czysty «чистый». Глагол «пачкать» — brudzić, «мыть» — myć." }
  - { kind: usage, text: "Переносное значение — «нечистый, грязный» в моральном смысле: brudne pieniądze «грязные деньги», brudny interes «грязное дело»." }
  - { kind: usage, text: "Сравнительная степень — brudniejszy, превосходная najbrudniejszy; в корпусе ни та, ни другая не встречаются." }
  - { kind: usage, text: "Лично-мужская форма множественного — brudni: Byli brudni «Они были грязные»." }
collocations:
  - { pl: "brudne pieniądze", ru: "грязные деньги" }
  - { pl: "brudna robota", ru: "грязная работа" }
  - { pl: "brudne naczynia", ru: "грязная посуда" }
etymology: "От brud «грязь», праславянское *brudъ. Русское «брудный» не сохранилось, но родственно диалектному «брудный, брудить» — в литературном русском на его месте «грязный»."
memory: "brudny = «грязный», от brud «грязь». Антоним — czysty. Переносно работает так же, как в русском: brudne pieniądze «грязные деньги», brudna robota «грязная работа»."
idioms:
  - { pl: "brudne pieniądze", ru: "грязные деньги" }
  - { pl: "brudna robota", ru: "грязная работа" }
  - { pl: "brudne naczynia", ru: "грязная посуда" }
