notes:
  - { kind: usage, text: "Антоним — czysty «чистый». Глагол «пачкать» — brudzić, «мыть» — myć." }
  - { kind: usage, text: "Переносное значение — «нечистый, грязный» в моральном смысле: brudne pieniądze «грязные деньги», brudny interes «грязное дело»." }
  - { kind: usage, text: "Сравнительная степень — brudniejszy, превосходная najbrudniejszy; в корпусе ни та, ни другая не встречаются." }
  - { kind: usage, text: "Лично-мужская форма множественного — brudni: Byli brudni «Они были грязные»." }
