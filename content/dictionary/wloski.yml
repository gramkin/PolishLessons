notes:
  - { kind: false-friend, text: "Самое важное про это слово: WŁOCHY — это Италия, а не что-либо о волосах. Корень германский: *walhaz, которым германцы звали романизированных соседей. От него же пошли WOŁOCH «валах», Валахия и английское WELSH «уэльский». Русский этот корень знает — «волохи», «валахи», — но Италию называет латинским именем, поэтому связь между włoski и Италией русскому уху ничем не подсказана, и догадаться по звучанию нельзя. Włoski to język — это «итальянский язык», а не «волосяной»." }
  - { kind: usage, text: "Мужская личная форма множественного — WŁOSCY: k переходит в c. Так же POLSKI даёт POLSCY, RUSKI даёт RUSCY, и у прилагательных на -ski это правило без исключений. Это та же мена k→c, что в klinice, но вызванная не окончанием -e, а окончанием мужского личного множественного, и она же стоит за существительными technicy и przeciwnicy. Один согласный, два разных окончания, один результат." }
  - { kind: usage, text: "Форм одиннадцать, степеней сравнения нет: слово относит к разряду, а не измеряет качество. Это пятое такое прилагательное после fizyczny, miejscowy, kredytowy и sądowy, и для названий по стране или народу иначе и быть не может — итальянским нельзя быть «более»." }
  - { kind: pronunciation, text: "У формы WŁOSKI три чтения, и корня в них два. Первое — прилагательное «итальянский». Второе — существительное «итальянский язык»: uczy się włoskiego, mówi po włosku, то есть прилагательное, ставшее существительным, как krewny. Третье к Италии не относится вовсе: это именительный множественного от WŁOSEK «волосок», от WŁOS «волос». Так что włoski na rękawie — это «волоски на рукаве», и различает их только смысл фразы." }
