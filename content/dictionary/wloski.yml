etymology: "От WŁOCHY «Италия», из праславянского *volxъ, заимствованного из германского *walhaz «кельт, романец». Германцы звали так всех романизированных соседей без разбора, и слово разошлось широко: польские Włochy «Италия», Wołoch «валах», историческая Валахия, английское Welsh «уэльский». Русский удержал корень только в «волохах» и «валахах», а для Италии взял латинское имя, так что два языка назвали одну страну словами разного происхождения."
memory: "Włochy — Италия, а не волосы. Włoscy с c, как polscy. И włoski — это ещё и «волоски», от włos."
