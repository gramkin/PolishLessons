# review
id: lobuziak
format: 2
lemma: "łobuziak"
rank: 5972
pos: noun
pron: { cyr: "уобу́зяк" }
senses:
  - id: rascal
    ru: "сорванец, проказник (о ребёнке; часто ласково)"
    examples:
      - { pl: "Ależ z ciebie łobuziak.", ru: "Ну ты и сорванец.", source: { kind: translated, id: 357064 } }
      - { pl: "Mój syn to straszny łobuziak.", ru: "Мой сын — страшный сорванец.", source: { kind: authored } }
      - { pl: "Łobuziak znowu wybił piłką szybę.", ru: "Сорванец опять разбил мячом стекло.", source: { kind: authored } }
  - id: hooligan
    ru: "хулиган, шпана (о подростке; неодобр.)"
    examples:
      - { pl: "Na podwórku zaczepiali go starsi łobuziacy.", ru: "Во дворе к нему приставали хулиганы постарше.", source: { kind: authored } }
      - { pl: "Policja złapała łobuziaków, którzy niszczyli ławki.", ru: "Полиция поймала хулиганов, которые ломали скамейки.", source: { kind: authored } }
notes:
  - { kind: usage, text: "ŁOBUZIAK — от ŁOBUZ «хулиган, негодяй», но суффикс -IAK смягчает слово: «сорванец, проказник». О своём ребёнке говорят с улыбкой: ALE Z CIEBIE ŁOBUZIAK!" }
  - { kind: usage, text: "Мужское лицо: во множественном K → C, как POLAK — POLACY: ŁOBUZIACY. Винительный совпадает с родительным: WIDZĘ ŁOBUZIAKA, WIDZĘ ŁOBUZIAKÓW." }
  - { kind: register, text: "Разговорное. О ребёнке — ласково, о подростке — неодобрительно. О взрослом мужчине — шутливо: STARY ŁOBUZIAK «старый проказник»." }
  - { kind: pronunciation, text: "Ł читается как «у», ZI перед гласной — мягкое «з»: «уобу́зяк». Звательный ŁOBUZIAKU совпадает с предложным." }
collocations:
  - { pl: "mały łobuziak", ru: "маленький сорванец" }
  - { pl: "ale z ciebie łobuziak", ru: "ну ты и сорванец" }
  - { pl: "łobuziacy z podwórka", ru: "дворовая шпана" }
family:
  - { pl: "łobuz", ru: "хулиган, негодяй", relation: root }
  - { pl: "łobuzerski", ru: "хулиганский, озорной", relation: derived }
  - { pl: "łobuzeria", ru: "хулиганьё, шпана", relation: derived }
synonyms: ["urwis", "psotnik", "chuligan"]
etymology: "Образовано от ŁOBUZ «хулиган, негодяй» с суффиксом -IAK, который делает слово мягче. Происхождение самого ŁOBUZ неясно."
memory: "Łobuz — хулиган, łobuziak — маленький хулиган, сорванец. Polak — Polacy, łobuziak — łobuziacy."
idioms:
  - { pl: "ale z ciebie łobuziak!", ru: "ну ты и сорванец!" }
formExamples:
