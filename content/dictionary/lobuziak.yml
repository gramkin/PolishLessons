  - { form: "łobuziaka", pl: "Od tego łobuziaka można się spodziewać wszystkiego.", ru: "От этого сорванца можно ожидать чего угодно.", source: { kind: authored } }
  - { form: "łobuziacy", pl: "Łobuziacy z sąsiedztwa przebili mi oponę.", ru: "Хулиганы из соседних домов прокололи мне шину.", source: { kind: authored } }
