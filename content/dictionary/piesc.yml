notes:
  - { kind: false-friend, text: "Три похожих слова стоят рядом, и спутать их легко. PIĘĆ значит «пять». PIĘŚĆ, с добавленным Ś, значит «кулак». PIEŚCIĆ, уже без носового, значит «ласкать». Разница на письме в одну букву, а на слух в мягкости и носовом: «пенчь», «пенсьчь», «пещичь». Четвёртое рядом — PIEŚŃ «песня», тоже близкое по виду. Проверять надо по смыслу: счёт, рука, нежность или музыка. Русскому все четыре слова покажутся вариантами одного, и это самая частая путаница в этом углу словаря." }
  - { kind: usage, text: "Шесть форм, женский род, склонение на мягкую согласную, без всякого суффикса: PIĘŚĆ, PIĘŚCI, PIĘŚCIĄ, PIĘŚCIOM, PIĘŚCIAMI, PIĘŚCIACH. По числу форм слово похоже на разряд на -OŚĆ, но суффикса здесь нет, корень сам кончается мягко. Множественное число совершенно обычно, потому что кулаков у человека два: ZACISKAĆ PIĘŚCI «сжимать кулаки». Форма PIĘŚCI работает и родительным единственного, и именительным множественного, как во всём этом склонении." }
  - { kind: government, text: "Чем ударить — творительный падеж без предлога: UDERZYĆ PIĘŚCIĄ, как и по-русски «ударить кулаком». Куда ударить — предлог W с винительным: UDERZYĆ PIĘŚCIĄ W STÓŁ «ударить кулаком по столу», и здесь русский ставит «по» с дательным, так что предлог и падеж приходится менять целиком. Драка на кулаках — WALKA NA PIĘŚCI, предлог NA с винительным. Сжимать — ZACISKAĆ PIĘŚCI, винительный." }
  - { kind: pronunciation, text: "Читается «пе́нсьчь», в один слог, и этот слог плотный. Буква I после P только знак мягкости, а носовая Ę перед Ś звучит как «эн». Дальше идут два мягких звука подряд, Ś и Ć, то есть «сьчь», без всякой гласной между ними. Чтение «пиесць» или «пьенсть» будет ошибкой. В родительном PIĘŚCI слогов становится два: «пе́нсьчи». Для сравнения, PIĘĆ «пять» звучит «пенчь», короче на один звук." }
  - { kind: register, text: "Слово нейтральное и обиходное. Частые обороты: UDERZYĆ PIĘŚCIĄ W STÓŁ «ударить кулаком по столу», и в переносном смысле это значит «проявить твёрдость», ровно как по-русски; ZACISKAĆ PIĘŚCI «сжимать кулаки»; WALKA NA PIĘŚCI «кулачный бой». Производное PIĘŚCIARZ значит «боксёр», а PIĘŚCIARSTWO — «бокс», и это обычные спортивные слова. Уменьшительное PIĄSTKA «кулачок» говорят о детской руке." }
