etymology: "От праславянского *pęstь, и у этого слова есть русский родственник, только не тот, что ожидаешь: это «пясть», часть руки между кистью и пальцами. Соответствие носового регулярно: польская Ę отвечает русскому «я», как в PIĘĆ и «пять», MIĘSO и «мясо», IMIĘ и «имя». Русский для кулака взял другое слово, «кулак», пришедшее из тюркских языков, а своё «пясть» оставил анатомам. Получилось, что поляк сохранил славянское название, а русский заменил его заимствованным, и родство слов видно только через медицинский термин."
memory: "Четыре похожих слова держать отдельно: pięć «пять», pięść «кулак», pieścić «ласкать», pieśń «песня». Русский родственник у pięść неожиданный: это «пясть», а «кулак» в русском заимствован из тюркских, так что славянское слово сохранил именно польский. Соответствие ę и я регулярно: pięć и «пять», mięso и «мясо». Поправить предлог: uderzyć pięścią W stół с винительным, где русский говорит «по столу». Читается «пе́нсьчь», одним плотным слогом."
