notes:
  - { kind: pronunciation, text: "Одно S, не два: STRES, хотя по-русски «стресс». Польский при заимствовании почти всегда упрощает двойной согласный, который русский сохраняет: klasa при «класс», agresja при «агрессия», adres при «адрес», stres при «стресс». Правило работает в одну сторону и экономит немало ошибок на письме: если в русском слове две одинаковые буквы подряд, в польском, скорее всего, одна." }
  - { kind: government, text: "Предлоги расходятся по падежам: W STRESIE «в стрессе» — местный, ZE STRESU «от стресса» — родительный, ZE STRESEM «со стрессом» — творительный. Обратите внимание на ZE вместо Z: перед скоплением st- польский удлиняет предлог, ровно как русский говорит «со стрессом», а не «с стрессом». Логика одна и та же." }
  - { kind: usage, text: "Местный падеж — STRESIE: твёрдое s смягчается перед окончанием -e. То же изменение в этой же партии у RASA — RASIE. Множественное число польский употребляет свободнее русского: codzienne stresy, stresy w pracy звучат совершенно обычно, тогда как по-русски «стрессы» отдают наукообразностью." }
collocations:
  - { pl: "w stresie", ru: "в стрессе" }
  - { pl: "ze stresu", ru: "от стресса" }
  - { pl: "poziom stresu", ru: "уровень стресса" }
family:
  - { pl: "stresować", ru: "нервировать", relation: derived }
  - { pl: "stresujący", ru: "стрессовый, нервный", relation: derived }
  - { pl: "zestresowany", ru: "на нервах", relation: derived }
etymology: "Из английского STRESS, пришедшего туда из старофранцузского estrece «теснота, стеснение», а в конечном счёте из латинского strictus «стянутый» — того же корня, что «стриктура». Русский и польский взяли слово почти одновременно и из одного источника, но русский удержал двойное s английского написания, а польский, как и во всех подобных заимствованиях, свёл его к одному."
memory: "Одно s, в отличие от русских двух: stres, как klasa при «класс». И предлог удлиняется: ze stresu, как «со стрессом»."
idioms:
