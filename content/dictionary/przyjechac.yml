# review
id: przyjechac
format: 2
lemma: "przyjechać"
rank: 402
pos: verb
aspect: perf
pron: { cyr: "пшые́хаць" }
senses:
  - id: arrive
    ru: "приехать"
    examples:
      - pl: "Samanta przyjechała."
        ru: "Саманта приехала."
        source: { kind: tatoeba, id: 745504 }
      - pl: "Przyjechał pan Smith."
        ru: "Приехал господин Смит."
        source: { kind: tatoeba, id: 12359882 }
      - pl: "Przyjechał samochodem."
        ru: "Он приехал на машине."
        source: { kind: tatoeba, id: 588406 }
  - id: arrive-how
    ru: "приехать (о времени и о способе)"
    examples:
      - pl: "Przyjechałam na czas."
        ru: "Я приехала вовремя."
        source: { kind: tatoeba, id: 10768401 }
      - pl: "Przyjechałam autobusem."
        ru: "Я приехала на автобусе."
        source: { kind: tatoeba, id: 3587164 }
      - pl: "Po coś tu przyjechał?"
        ru: "Зачем ты приехал сюда?"
        source: { kind: tatoeba, id: 924559 }
notes:
  - { kind: usage, text: "Будущее время берёт совсем другую основу: przyjadę, przyjedziesz, przyjedzie — как jechać даёт jadę, jedziesz. А прошедшее сохраняет -ech-: przyjechał." }
  - { kind: usage, text: "Повелительное наклонение — przyjedź «приезжай», przyjedźcie «приезжайте»." }
  - { kind: usage, text: "На чём приехали — творительный падеж без всякого предлога: przyjechał samochodem «приехал на машине», przyjechałam autobusem «я приехала на автобусе»." }
  - { kind: usage, text: "Несовершенный вид — przyjeżdżać. О приходе пешком говорят przyjść, а не przyjechać." }
collocations:
  - { pl: "przyjechać na czas", ru: "приехать вовремя" }
  - { pl: "przyjechać po kogoś", ru: "заехать за кем-либо" }
  - { pl: "przyjechać samochodem", ru: "приехать на машине" }
etymology: "Из przy- + jechać, праславянское *jexati; русское «ехать» — то же самое слово."
memory: "przyjechać — «приехать», но будущее берёт совсем другую основу: przyjadę, przyjedziesz — как jadę, jedziesz от jechać. А на чём приехали, говорят простым творительным без предлога: przyjechałem autobusem."
idioms:
  - { pl: "przyjechać na czas", ru: "приехать вовремя" }
  - { pl: "przyjedź do nas", ru: "приезжай к нам" }
  - { pl: "przyjechać po kogoś", ru: "заехать за кем-то" }
