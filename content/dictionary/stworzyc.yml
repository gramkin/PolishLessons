# review
id: stworzyc
format: 2
lemma: "stworzyć"
rank: 623
pos: verb
aspect: perf
pron: { cyr: "стфо́жыць" }
senses:
  - id: create
    ru: "создать, сотворить"
    examples:
      - pl: "Bóg stworzył wszechświat."
        ru: "Бог создал вселенную."
        source: { kind: tatoeba, id: 361314 }
      - pl: "Bóg stworzył świat w sześć dni."
        ru: "Бог сотворил мир за шесть дней."
        source: { kind: tatoeba, id: 513481 }
      - pl: "Bóg stworzył ziemię."
        ru: "Бог создал землю."
        source: { kind: translated, id: 919550 }
  - id: make
    ru: "создать, сделать (фирму, программу, проблему)"
    note: "Обычное современное значение: stworzyć firmę, stworzyć program."
    examples:
      - pl: "Nasza firma stworzyła flamaster piszący wszystkimi kolorami tęczy."
        ru: "Наша фирма создала фломастер, пишущий всеми цветами радуги."
        source: { kind: tatoeba, id: 6207686 }
      - pl: "Stworzyli rząd."
        ru: "Они создали правительство."
        source: { kind: translated, id: 826726 }
      - pl: "Sami sobie stworzyliśmy problemy."
        ru: "Мы сами создали себе проблемы."
        source: { kind: translated, id: 12037001 }
notes:
  - { kind: usage, text: "Формы stworzę, stworzysz, stworzy — это БУДУЩЕЕ время: глагол совершенного вида. Несовершенный вид — stwarzać или tworzyć: Tworzę nową stronę «Я создаю новый сайт»." }
  - { kind: false-friend, text: "Существительное stworzenie значит и «создание, сотворение» (stworzenie świata), и «существо, тварь» (dziwne stworzenie «странное существо»). Второе значение в живой речи встречается чаще." }
  - { kind: usage, text: "Страдательное причастие очень живое: stworzony przez kogoś «созданный кем-то», być stworzonym do czegoś «быть созданным для чего-то». Jesteś stworzona, by być kochaną." }
  - { kind: usage, text: "Гнездо прозрачно: twórca «творец, создатель», twórczość «творчество», stwórca «Создатель», tworzywo «материал». Русское «творить» — та же основа." }
collocations:
  - { pl: "stworzyć firmę", ru: "создать фирму" }
  - { pl: "stworzony przez", ru: "созданный кем-то" }
  - { pl: "stworzenie świata", ru: "сотворение мира" }
  - { pl: "być stworzonym do czegoś", ru: "быть созданным для чего-то" }
family:
  - { pl: "tworzyć", ru: "творить, создавать", relation: derived }
  - { pl: "twórca", ru: "творец, создатель", relation: derived }
  - { pl: "stworzenie", ru: "создание; существо", relation: derived }
etymology: "Приставка s- плюс tworzyć «творить, создавать», от праславянского *tvoriti — то же слово, что русское «творить». Отсюда twórca «творец» и stwórca «Создатель»."
memory: "stworzyć — «создать», совершенный вид от tworzyć. Как и у всех совершенных глаголов, stworzę, stworzysz, stworzy — это будущее время, а не настоящее. Гнездо прозрачно и совпадает с русским: tworzyć «творить», twórca «творец», twórczość «творчество». Одна ловушка: stworzenie значит и «сотворение» (stworzenie świata), и «существо» (dziwne stworzenie) — второе в живой речи чаще. Страдательное причастие очень употребительно: stworzony przez «созданный кем-то», być stworzonym do czegoś «быть созданным для чего-то»."
idioms:
  - { pl: "stworzenie świata", ru: "сотворение мира" }
  - { pl: "stworzony przez", ru: "созданный кем-то" }
  - { pl: "być stworzonym do czegoś", ru: "быть созданным для чего-то" }
