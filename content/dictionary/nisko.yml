notes:
  - { kind: government, text: "Наречие, три формы: NISKO, NIŻEJ, NAJNIŻEJ. Сравнительная и превосходная образованы не от NISK-, а от основы NIŻ-, и это супплетивизм — формы берутся от другого вида корня, как в русском «низко — ниже». Сравнение строится предлогом OD с родительным или союзом NIŻ: NIŻEJ OD DRUGIEJ PÓŁKI, NIŻEJ NIŻ WCZORAJ. Обратите внимание, что союз NIŻ и наречие NIŻEJ выглядят почти одинаково, и в одном предложении могут оказаться рядом: NIŻEJ NIŻ PRZEDTEM. Падежа и рода у наречия нет, поэтому форм только три." }
  - { kind: false-friend, text: "Значение совпадает с русским «низко», и в этом слове расхождений нет. Интересно сравнить его с противоположным: для «высоко» польский держит два наречия, WYSOKO о физической высоте и WYSOCE о степени, а для «низко» — только одно. NISKO обслуживает оба смысла: NISKO WISIAŁY CHMURY о высоте и NISKO CENIONY о мере. Так что асимметрия здесь на стороне польского, и русскоговорящему она на пользу: там, где с «высоко» приходится выбирать, с «низко» выбирать не нужно." }
  - { kind: pronunciation, text: "Читается «ни́ско», ударение на предпоследнем слоге из двух. Сочетание SK твёрдое, без смягчения. В сравнительной степени NIŻEJ буква Ż даёт «ж»: «ни́жэй», два слога, ударение на первом. В превосходной NAJNIŻEJ три слога и ударение на предпоследнем: «найни́жэй». Приставка NAJ- во всех превосходных степенях безударна, и ударение остаётся по общему правилу на предпоследнем слоге слова." }
  - { kind: usage, text: "Частотные сочетания: NISKO WISIEĆ, NISKO CENIONY «низко ценимый», NISKO SIĘ UKŁONIĆ «низко поклониться», NIŻEJ PODPISANY «нижеподписавшийся», PATRZ NIŻEJ «см. ниже». Последние два принадлежат канцелярскому и книжному языку и встречаются в документах постоянно. Оборот NAJNIŻEJ означает и «ниже всего», и в переносном смысле «по меньшей мере» — но в этом втором значении чаще берут CO NAJMNIEJ. Прилагательное NISKI значит и «низкий» о высоте, и «низкий» о звуке, и «подлый» о поступке, ровно как русское." }
