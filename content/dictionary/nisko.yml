etymology: "От прилагательного NISKI «низкий», из праславянского *nizъkъ, от предлога и приставки *nizъ «вниз» — того же, что русские «низ», «низкий», «снизу», «низина». Соответствие полное, и в польском тот же предлог сохранился в наречии W DÓŁ и в приставке NIZ- старых слов. Сравнительная основа NIŻ- возникла из *niz- перед мягким окончанием, по тому же правилу, что дало русское «ниже» из «низ-е»: согласная перед передним гласным смягчилась и перешла в шипящую. Поэтому супплетивизм здесь не каприз, а след закономерного чередования, и он одинаков в двух языках — «низко, ниже» и NISKO, NIŻEJ."
memory: "Совпадает с русским «низко», и в отличие от «высоко» здесь выбирать не приходится: польский держит два наречия для высоты, wysoko и wysoce, а для низа одно — nisko обслуживает и положение, и оценку. Степени супплетивные, от основы niż-: nisko, niżej, najniżej, ровно как «низко, ниже». Канцелярские обороты стоит знать: niżej podpisany «нижеподписавшийся», patrz niżej «см. ниже»."
