notes:
  - { kind: government, text: "Воздействие НА что-л. — oddziaływanie na coś, с винительным падежом." }
  - { kind: usage, text: "Отглагольное существительное от oddziaływać «воздействовать». В польском такие имена на -anie образуются почти от любого глагола и пишутся отдельным словом в словаре." }
  - { kind: false-friend, text: "Корень dział «часть, отдел» (ср. карточку oddział): воздействовать — значит «отделять, выделять действие» в сторону чего-то." }
  - { kind: usage, text: "Физический термин: oddziaływania fundamentalne «фундаментальные взаимодействия». В корпусе слово не встречается, поэтому все примеры составлены вручную." }
