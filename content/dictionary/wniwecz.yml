etymology: "Из предлога w и старого niwecz «ничто» (праславянское *ni + *veštь «ни вещи»), то есть буквально «в ничто». Русское «ничто» — то же гнездо."
memory: "wniwecz — «прахом, впустую», буквально «в ничто»: внутри старое niwecz «ничто», родня русскому «ничто». Слово книжное и живёт почти только в двух оборотах: obrócić wniwecz «обратить в прах» и pójść wniwecz «пойти прахом». В обычной речи скажут na marne."
