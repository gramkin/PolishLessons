      - pl: "Wojna obróciła miasto wniwecz."
        ru: "Война обратила город в прах."
        source: { kind: authored }
      - pl: "Pożar obrócił wniwecz dorobek całego życia."
        ru: "Пожар обратил в прах труд всей жизни."
        source: { kind: authored }
