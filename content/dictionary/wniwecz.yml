notes:
  - { kind: usage, text: "Внутри старое niwecz «ничто», поэтому буквально это «в ничто». Русское «ничто» — родственное слово." }
  - { kind: register, text: "Книжное и устаревающее. Живёт почти только в двух оборотах: obrócić wniwecz «обратить в прах» и pójść wniwecz «пойти прахом»." }
  - { kind: usage, text: "Нейтральные замены: na marne, na nic. Wszystko poszło na marne значит то же, но звучит обычнее." }
  - { kind: usage, text: "Слово не имеет примеров в корпусе Tatoeba, поэтому все примеры здесь составлены вручную и ждут проверки." }
