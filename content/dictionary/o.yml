# review
id: o
format: 2
depth: deep
lemma: "o"
rank: 19
pos: prep
pron: { cyr: "о" }
senses:
  - id: about
    ru: "о, об (о чём?) — с предложным падежом"
    examples:
      - pl: "O czym?"
        ru: "О чём?"
        source: { kind: tatoeba, id: 6160759 }
      - pl: "Myślę o tobie."
        ru: "Я думаю о тебе."
        source: { kind: tatoeba, id: 355505 }
      - pl: "O czym mówisz?"
        ru: "О чём ты?"
        source: { kind: tatoeba, id: 1599043 }
  - id: request
    ru: "о, за (с винительным: просить о чём-л.)"
    examples:
      - pl: "Proszę o uwagę."
        ru: "Прошу внимания."
        source: { kind: tatoeba, id: 908249 }
      - pl: "Pytam o drogę."
        ru: "Я спрашиваю дорогу."
        source: { kind: authored }
  - id: time
    ru: "в (о часах) — с предложным падежом"
    examples:
      - pl: "O której wstajesz?"
        ru: "Во сколько ты встаёшь?"
        source: { kind: tatoeba, id: 545054 }
      - pl: "Samolot odlatuje o 17:30."
        ru: "Вылет самолёта в 17:30."
        source: { kind: tatoeba, id: 998726 }
      - pl: "Spotkajmy się o piątej."
        ru: "Встретимся в пять."
        source: { kind: authored }
notes:
  - { kind: government, text: "Два падежа: o czym myślisz (предложный) «о чём думаешь», но prosić o pomoc (винительный) «просить о помощи»." }
  - { kind: usage, text: "Время всегда через o + предложный: o piątej «в пять», o północy «в полночь», o której? «во сколько?». Русское «в» с винительным здесь не работает." }
  - { kind: false-friend, text: "Просьба идёт с винительным, а не с предложным: proszę o sól «передайте соль», poproszę o rachunek «счёт, пожалуйста». По-русски «просить о» требует предложного, и это сбивает." }
  - { kind: usage, text: "Безличное chodzi o coś значит «речь идёт о чём-то», а o co chodzi? — «в чём дело?»." }
collocations:
  - { pl: "chodzi o", ru: "речь идёт о" }
  - { pl: "prosić o", ru: "просить о" }
  - { pl: "o co chodzi?", ru: "в чём дело?" }
etymology: "Праславянское *o(b) — то же, что русские «о» и «об»."
memory: "Ловушка в падеже: думать о ком-то — myśleć o kimś (предложный), но просить о помощи — prosić o pomoc (винительный). Ещё o задаёт время: o piątej «в пять часов»."
idioms:
  - { pl: "o co chodzi?", ru: "в чём дело?" }
  - { pl: "o mały włos", ru: "чуть было не" }
  - { pl: "o wilku mowa", ru: "лёгок на помине" }
