# review
id: laczyc
format: 2
lemma: "łączyć"
rank: 1486
pos: verb
aspect: imperf
aspectPair: polaczyc
pron: { cyr: "уо́нчыць" }
senses:
  - id: connect
    ru: "соединять, связывать, объединять"
    examples:
      - pl: "Kanał Panamski łączy Atlantyk z Pacyfikiem."
        ru: "Панамский канал соединяет Атлантику с Тихим океаном."
        source: { kind: translated, id: 765671 }
      - pl: "Muzyka łączy."
        ru: "Музыка объединяет."
        source: { kind: translated, id: 839162 }
      - pl: "Łączą ich wspólne interesy."
        ru: "Их объединяют общие интересы."
        source: { kind: translated, id: 1179744 }
  - id: combine
    ru: "сочетать, совмещать"
    examples:
      - pl: "Trzeba łączyć teorię z praktyką."
        ru: "Нужно соединять теорию с практикой."
        source: { kind: translated, id: 416759 }
      - pl: "Łączymy przyjemne z pożytecznym."
        ru: "Мы соединяем приятное с полезным."
        source: { kind: translated, id: 1456712 }
  - id: put-through
    ru: "соединять по телефону"
    examples:
      - pl: "Łączę pana z dyrektorem."
        ru: "Соединяю вас с директором."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Несовершенный вид к połączyć. С się — «соединяться, объединяться»: Proletariusze wszystkich krajów, łączcie się!" }
  - { kind: government, text: "łączyć coś z czymś — винительный и творительный с предлогом z: łączyć teorię z praktyką." }
  - { kind: usage, text: "Телефонное значение живо до сих пор: Łączę pana z dyrektorem «Соединяю вас с директором»." }
  - { kind: usage, text: "Корень тот же, что в włączyć «включить» и wyłączyć «выключить», — праславянское гнездо со значением «соединять»." }
collocations:
  - { pl: "łączyć siły", ru: "объединять силы" }
  - { pl: "łączyć teorię z praktyką", ru: "соединять теорию с практикой" }
  - { pl: "co nas łączy", ru: "что нас связывает" }
etymology: "Праславянское *lǫčiti «соединять»; тот же корень в русских «разлучить» и «случай», и в польских włączyć «включить», wyłączyć «выключить»."
memory: "łączyć — «соединять, связывать», и корень тот же, что в włączyć «включить» и в русском «разлучить». Совершенный вид — połączyć. Управление: łączyć coś z czymś."
idioms:
