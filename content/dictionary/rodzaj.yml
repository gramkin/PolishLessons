# review
id: rodzaj
format: 2
lemma: "rodzaj"
rank: 660
pos: noun
pron: { cyr: "ро́дзай" }
senses:
  - id: kind
    ru: "вид, род, сорт"
    examples:
      - pl: "Który rodzaj mąki wybrać?"
        ru: "Какой вид муки выбрать?"
        source: { kind: tatoeba, id: 6155981 }
      - pl: "Który rodzaj ryby jest zdrowszy: ryba morska czy słodkowodna?"
        ru: "Какая рыба полезнее: морская или пресноводная?"
        source: { kind: tatoeba, id: 13006901 }
      - pl: "To rodzaj chleba."
        ru: "Это вид хлеба."
        source: { kind: translated, id: 351522 }
  - id: what-kind
    ru: "jakiego rodzaju — какого рода, какой"
    note: "Буквально «какого рода»: Jakiego rodzaju muzyki słuchasz?"
    examples:
      - pl: "Jakiego rodzaju muzyki słuchasz?"
        ru: "Какую музыку ты слушаешь?"
        source: { kind: translated, id: 575397 }
      - pl: "Jakiego rodzaju pracy szukasz?"
        ru: "Какую работу ты ищешь?"
        source: { kind: translated, id: 6159837 }
      - pl: "Nie lubię tego rodzaju muzyki."
        ru: "Я не люблю такую музыку."
        source: { kind: translated, id: 527799 }
  - id: a-sort-of
    ru: "rodzajem — нечто вроде, своего рода"
    note: "Творительный передаёт русское «своего рода»."
    examples:
      - pl: "Fotograf jest rodzajem malarza."
        ru: "Фотограф — своего рода художник."
        source: { kind: translated, id: 11745003 }
      - pl: "Mafia jest rodzajem organizacji przestępczej."
        ru: "Мафия — своего рода преступная организация."
        source: { kind: translated, id: 1645338 }
      - pl: "\"Shiitake\" jest rodzajem grzyba."
        ru: "«Шиитаке» — это вид гриба."
        source: { kind: translated, id: 3398958 }
  - id: gender
    ru: "род (грамматический)"
    note: "rodzaj męski, żeński, nijaki — терминология совпадает с русской."
    examples:
      - pl: "To rzeczownik rodzaju męskiego."
        ru: "Это существительное мужского рода."
        source: { kind: authored }
      - pl: "W polskim są trzy rodzaje gramatyczne."
        ru: "В польском три грамматических рода."
        source: { kind: authored }
      - pl: "Jakiego rodzaju jest to słowo?"
        ru: "Какого рода это слово?"
        source: { kind: authored }
notes:
  - { kind: usage, text: "В грамматике rodzaj значит «род»: rodzaj męski «мужской», żeński «женский», nijaki «средний». Терминология совпадает с русской." }
  - { kind: government, text: "Оборот jakiego rodzaju значит «какого рода, какой»: Jakiego rodzaju muzyki słuchasz? — буквально «какого рода музыку слушаешь»." }
  - { kind: usage, text: "Творительный rodzajem передаёт «нечто вроде, своего рода»: Mafia jest rodzajem organizacji przestępczej." }
  - { kind: usage, text: "Родительный множественного двоякий: обычное rodzajów и редкое rodzai." }
collocations:
  - { pl: "jakiego rodzaju", ru: "какого рода" }
  - { pl: "rodzaj męski", ru: "мужской род" }
  - { pl: "tego rodzaju", ru: "такого рода" }
  - { pl: "różne rodzaje", ru: "разные виды" }
family:
  - { pl: "rodzić", ru: "рождать", relation: root }
  - { pl: "ród", ru: "род", relation: root }
  - { pl: "rodzina", ru: "семья", relation: derived }
etymology: "От rodzić «рождать», праславянское *rodъ — то же слово, что русские «род», «родить» и «народ»."
memory: "rodzaj — «вид, род», и корень тот же, что в русском «род». Работает оно в трёх местах. Просто «вид, сорт»: To rodzaj chleba. Грамматический род: rodzaj męski, żeński, nijaki — терминология совпадает с русской. И оборот jakiego rodzaju «какого рода»: Jakiego rodzaju muzyki słuchasz? Отдельно запомните творительный rodzajem «нечто вроде»: Mafia jest rodzajem organizacji przestępczej."
idioms:
  - { pl: "jakiego rodzaju", ru: "какого рода" }
  - { pl: "rodzaj męski", ru: "мужской род" }
  - { pl: "tego rodzaju", ru: "такого рода" }
formExamplesSkip:
  - { form: "rodzai", reason: "редкий вариант родительного множественного: обычная форма — rodzajów, и именно она встречается в живом языке" }
