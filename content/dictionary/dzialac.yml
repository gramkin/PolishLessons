# review
id: dzialac
format: 2
lemma: "działać"
rank: 371
pos: verb
aspect: imperf
pron: { cyr: "дзя́уаць" }
senses:
  - id: work
    ru: "работать, функционировать (о технике)"
    examples:
      - pl: "Telewizor nie działa."
        ru: "Телевизор не работает."
        source: { kind: tatoeba, id: 2632003 }
      - pl: "Ten komputer nie działa."
        ru: "Этот компьютер не работает."
        source: { kind: tatoeba, id: 12693858 }
      - pl: "Dlaczego winda nie działa?"
        ru: "Почему лифт не работает?"
        source: { kind: tatoeba, id: 3745223 }
  - id: act
    ru: "действовать, поступать"
    examples:
      - pl: "Trzeba działać!"
        ru: "Надо действовать!"
        source: { kind: tatoeba, id: 3744786 }
      - pl: "Działa jak powinno."
        ru: "Все работает как надо."
        source: { kind: tatoeba, id: 3429316 }
      - pl: "Mam nadzieję, że to działa."
        ru: "Надеюсь, он сработает."
        source: { kind: tatoeba, id: 11492451 }
notes:
  - { kind: false-friend, text: "Главная ловушка слова. О технике поляки говорят działać, а не pracować: Telewizor nie działa «Телевизор не работает». pracować — только о людях и о работе за деньги." }
  - { kind: false-friend, text: "Корень тот же, что в русском «делать» (праславянское *dělati), но значения разошлись: «делать» по-польски robić, а działać — это «действовать»." }
  - { kind: usage, text: "działać na nerwy — «действовать на нервы»: Działasz mi na nerwy «Ты действуешь мне на нервы»." }
  - { kind: usage, text: "Существительное działanie значит и «действие», и «работа устройства»: Objaśnił działanie tej maszyny «Он объяснил работу этой машины»." }
collocations:
  - { pl: "nie działa", ru: "не работает" }
  - { pl: "działać na nerwy", ru: "действовать на нервы" }
  - { pl: "trzeba działać", ru: "надо действовать" }
  - { pl: "podjąć działania", ru: "принять меры" }
etymology: "Праславянское *dělati «делать» — то же слово, что русское «делать». Но значения разошлись: польское działać стало «действовать» и «работать», а «делать» передаётся глаголом robić."
memory: "działać — «действовать», а про технику «работать»: Telewizor nie działa. Корень тот же, что в русском «делать», но не дайте себя обмануть — «делать» по-польски robić. И pracować говорят только о людях."
idioms:
  - { pl: "działać na nerwy", ru: "действовать на нервы" }
  - { pl: "działać jak płachta na byka", ru: "действовать как красная тряпка на быка" }
  - { pl: "działać na własną rękę", ru: "действовать самостоятельно, на свой страх и риск" }
