# review
id: styl
format: 2
lemma: "styl"
rank: 839
pos: noun
pron: { cyr: "стыль" }
senses:
  - id: manner
    ru: "стиль, манера"
    examples:
      - pl: "Autor ma piękny styl."
        ru: "У автора красивый стиль."
        source: { kind: tatoeba, id: 3460217 }
      - pl: "Ten autor ma doskonały styl."
        ru: "У этого автора превосходный стиль."
        source: { kind: translated, id: 351564 }
      - pl: "To nie w twoim stylu."
        ru: "Это не в твоём стиле."
        source: { kind: authored }
  - id: life
    ru: "styl życia — образ жизни"
    examples:
      - pl: "Dla starych ludzi zmienienie stylu życia jest trudne."
        ru: "Старым людям трудно изменить свой образ жизни."
        source: { kind: tatoeba, id: 2092136 }
      - pl: "Gordon interesuje się japońskim stylem życia."
        ru: "Гордон интересуется японским образом жизни."
        source: { kind: translated, id: 528948 }
      - pl: "Zmienił styl życia po chorobie."
        ru: "После болезни он изменил образ жизни."
        source: { kind: authored }
  - id: kinds
    ru: "о разновидностях: стили, направления"
    examples:
      - pl: "Jednym z uroków wielkiego miasta jest różnorodność stylów budownictwa, jakie można tam oglądać."
        ru: "Одна из прелестей большого города — разнообразие архитектурных стилей, которые там можно увидеть."
        source: { kind: translated, id: 921544 }
      - pl: "Style bywają bardzo różne."
        ru: "Стили бывают очень разными."
        source: { kind: authored }
      - pl: "Miesza style i wychodzi mu to świetnie."
        ru: "Он смешивает стили, и у него отлично получается."
        source: { kind: authored }
notes:
  - { kind: usage, text: "styl życia — «образ жизни», самое частое сочетание: zmienić styl życia, zdrowy styl życia." }
  - { kind: usage, text: "w czyimś stylu — «в чьём-то стиле»: To nie w twoim stylu «Это не в твоём стиле»." }
  - { kind: usage, text: "В спорте styl значит «стиль плавания»: styl klasyczny «брасс», styl dowolny «вольный стиль»." }
  - { kind: pronunciation, text: "Буква y читается как русское «ы», а l мягкое: получается «стыль», не «стил»." }
collocations:
  - { pl: "styl życia", ru: "образ жизни" }
  - { pl: "w twoim stylu", ru: "в твоём стиле" }
  - { pl: "zmienić styl", ru: "сменить стиль" }
  - { pl: "styl pisania", ru: "манера письма" }
family:
  - { pl: "stylowy", ru: "стильный", relation: derived }
  - { pl: "stylistyka", ru: "стилистика", relation: derived }
  - { pl: "stylista", ru: "стилист", relation: derived }
etymology: "Через французское style из латинского stylus «палочка для письма по восковой табличке», а та из греческого στῦλος «столб». Русское «стиль» — то же заимствование, поэтому слова совпадают."
memory: "styl — «стиль», слово заимствованное и с русским совпадает полностью, ловушек нет. Запомните два сочетания: styl życia «образ жизни» и w twoim stylu «в твоём стиле». В бассейне styl klasyczny — это брасс."
idioms:
  - { pl: "styl życia", ru: "образ жизни" }
  - { pl: "w twoim stylu", ru: "в твоём стиле" }
  - { pl: "styl klasyczny", ru: "брасс" }
