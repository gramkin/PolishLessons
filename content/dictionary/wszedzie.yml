etymology: "От того же корня, что wszystko «всё» — как русское «везде» связано с «весь»."
memory: "wszędzie — «везде», и корень тот же, что в wszystko «всё». Держите рядом тройку: wszędzie «везде», nigdzie «нигде», gdzieś «где-то», и помните про двойное отрицание — Nigdzie go nie ma. А пословица wszędzie dobrze, ale w domu najlepiej — это наше «в гостях хорошо, а дома лучше»."
