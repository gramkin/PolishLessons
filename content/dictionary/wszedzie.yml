# review
id: wszedzie
format: 2
lemma: "wszędzie"
rank: 773
pos: adv
pron: { cyr: "фшэ́ндзе" }
senses:
  - id: everywhere
    ru: "везде, повсюду"
    examples:
      - pl: "Szukałaś wszędzie?"
        ru: "Ты везде искала?"
        source: { kind: tatoeba, id: 12300798 }
      - pl: "Wszędzie cię szukam."
        ru: "Я везде тебя ищу."
        source: { kind: tatoeba, id: 12680474 }
      - pl: "Wszędzie były skrzynki."
        ru: "Повсюду были коробки."
        source: { kind: tatoeba, id: 13785406 }
  - id: search
    ru: "szukać wszędzie — искать везде"
    examples:
      - pl: "Szukałem wszędzie, ale nie znalazłem."
        ru: "Я искал везде, но не нашёл."
        source: { kind: authored }
      - pl: "Wszędzie go pełno."
        ru: "Он везде успевает."
        source: { kind: authored }
      - pl: "Pytałem wszędzie, gdzie się dało."
        ru: "Я спрашивал везде, где только можно."
        source: { kind: authored }
  - id: proverb
    ru: "wszędzie dobrze, ale w domu najlepiej"
    examples:
      - pl: "Wszędzie dobrze, ale w domu najlepiej."
        ru: "В гостях хорошо, а дома лучше."
        source: { kind: authored }
      - pl: "Kto wszędzie chce być, nigdzie nie jest."
        ru: "Кто везде хочет успеть, нигде не бывает."
        source: { kind: authored }
      - pl: "Bywał wszędzie i nigdzie."
        ru: "Он бывал везде и нигде."
        source: { kind: authored }
  - id: vs-nigdzie
    ru: "wszędzie «везде» ≠ nigdzie «нигде»"
    examples:
      - pl: "Szukałem wszędzie, a jego nigdzie nie ma."
        ru: "Я искал везде, а его нигде нет."
        source: { kind: authored }
      - pl: "Wszędzie pusto."
        ru: "Везде пусто."
        source: { kind: authored }
      - pl: "Prawie wszędzie już byliśmy."
        ru: "Почти везде мы уже были."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Держите рядом тройку наречий места: wszędzie «везде», nigdzie «нигде», gdzieś «где-то». Отрицание при этом двойное, как в русском: Nigdzie go nie ma «Его нигде нет»." }
  - { kind: usage, text: "Пословица wszędzie dobrze, ale w domu najlepiej — это наше «в гостях хорошо, а дома лучше»: мысль та же, картинка другая." }
  - { kind: usage, text: "kto wszędzie chce być, nigdzie nie jest — «кто везде хочет успеть, нигде не бывает»." }
  - { kind: pronunciation, text: "Начальное w перед глухим sz оглушается: слово звучит «фшэ́ндзе»." }
collocations:
  - { pl: "szukać wszędzie", ru: "искать везде" }
