pron: { cyr: "пшыбы́ваць" }
senses:
  - id: arrive
    ru: "прибывать (книжно)"
    examples:
      - pl: "Goście przybywają z całego świata."
        ru: "Гости прибывают со всего мира."
        source: { kind: authored }
