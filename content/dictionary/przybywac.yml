        ru: "В город прибывали купцы с Востока."
        source: { kind: authored }
  - id: increase
    ru: "прибавляться, становиться больше (безлично: PRZYBYWA + родительный)"
    examples:
      - pl: "Z roku na rok przybywa turystów."
        ru: "С каждым годом туристов становится больше."
        source: { kind: authored }
      - pl: "Przybywa mi siwych włosów."
        ru: "У меня прибавляется седых волос."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "PRZYBYWAĆ — «прибывать», совпадение полное, включая «прибывать» о количестве: PRZYBYWA WODY W RZECE «вода в реке прибывает». Но в быту о приезде говорят PRZYJEŻDŻAĆ, а PRZYBYWAĆ звучит официально или торжественно." }
  - { kind: usage, text: "Несовершенный вид; совершенный — PRZYBYĆ. Спряжение на -AM: PRZYBYWAM, PRZYBYWASZ, PRZYBYWAJĄ. Безличное PRZYBYWA с родительным — «становится больше»: PRZYBYWA PRACY. Повелительное и отглагольное существительное в карточку не включены." }
  - { kind: government, text: "Куда — DO с родительным или NA с винительным: PRZYBYWAĆ DO MIASTA, NA KONFERENCJĘ. Откуда — Z с родительным: Z ZAGRANICY. Чего прибывает — родительный: PRZYBYWA LUDZI, PRZYBYWA DNIA «день прибывает»." }
  - { kind: pronunciation, text: "Читается «пшыбы́ваць»: PRZ — «пш», Y — «ы». Ударение на предпоследнем слоге. PRZYBYWA — «пшыбы́ва»." }
  - { kind: register, text: "Книжное, официальное слово: новости, объявления, история. В разговоре — PRZYJEŻDŻAĆ, PRZYCHODZIĆ, а о количестве — ROBI SIĘ WIĘCEJ." }
collocations:
