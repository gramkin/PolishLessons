etymology: "Приставка PRZY- плюс BYWAĆ, многократное от BYĆ «быть»: «оказываться возле», «прибывать». Русское «прибывать» построено так же."
memory: "Przybywać — прибывать: goście przybywają. Przybywa turystów — туристов становится больше, с родительным."
