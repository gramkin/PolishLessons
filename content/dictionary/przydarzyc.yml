# review
id: przydarzyc
format: 2
lemma: "przydarzyć"
rank: 3812
pos: verb
pron: { cyr: "пшыда́жыць" }
senses:
  - id: happen-to
    ru: "приключиться, случиться (с кем-то)"
    examples:
      - pl: "Co ci się przydarzyło?"
        ru: "Что с тобой случилось?"
        source: { kind: authored }
      - pl: "Przydarzyła mi się dziwna historia."
        ru: "Со мной приключилась странная история."
        source: { kind: authored }
      - pl: "Każdemu może się przydarzyć błąd."
        ru: "Ошибиться может каждый."
        source: { kind: authored }
  - id: chance
    ru: "выпасть, подвернуться (о случае, возможности)"
    examples:
      - pl: "Przydarzyła mu się okazja do wyjazdu."
        ru: "Ему подвернулась возможность уехать."
        source: { kind: authored }
      - pl: "Rzadko przydarza się taka szansa, a jemu się przydarzyła."
        ru: "Такой шанс выпадает редко, а ему выпал."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "PRZYDARZYĆ SIĘ — «приключиться», а не «подарить» (PODAROWAĆ) и не «придавить» (PRZYGNIEŚĆ). Корень тот же, что в ZDARZYĆ SIĘ «случиться» и WYDARZENIE «событие»; к русскому «дар» он не ведёт." }
  - { kind: usage, text: "Употребляется только с SIĘ и почти только в третьем лице: PRZYDARZYŁO SIĘ, PRZYDARZYŁA SIĘ. Подлежащее — само событие, а не человек. Остальные формы в карточку не включены. Несовершенный вид — PRZYDARZAĆ SIĘ." }
  - { kind: government, text: "С кем случилось — дательный: PRZYDARZYŁO MI SIĘ «со мной случилось». По-русски нужен предлог «с» и творительный, по-польски — голый дательный. Что случилось — именительный: PRZYDARZYŁ SIĘ WYPADEK." }
  - { kind: pronunciation, text: "Читается «пшыда́жыць»: PRZ — «пш», RZ — «ж». Ударение на предпоследнем слоге. PRZYDARZYŁO — «пшыдажы́уо»." }
  - { kind: register, text: "Нейтральное слово, чуть живее, чем ZDARZYĆ SIĘ: оно подчёркивает, что случилось именно с кем-то. В рассказах и разговоре — частое." }
collocations:
  - { pl: "przydarzyć się komuś", ru: "приключиться с кем-то" }
  - { pl: "przydarzył się wypadek", ru: "произошёл несчастный случай" }
  - { pl: "to może się przydarzyć każdemu", ru: "это может случиться с каждым" }
family:
  - { pl: "zdarzyć", ru: "случиться", relation: root, id: zdarzyc }
  - { pl: "przydarzać", ru: "приключаться", relation: aspect }
  - { pl: "wydarzenie", ru: "событие", relation: root, id: wydarzenie }
etymology: "Приставка PRZY- плюс DARZYĆ SIĘ «удаваться, выпадать». Корень, вероятно, тот же, что в DAR «дар»: то, что выпало, «досталось» человеку. В современном языке эта связь уже не ощущается."
memory: "Przydarzyć się — приключиться: co ci się przydarzyło? «Что с тобой случилось?» Кому — дательный, без предлога."
idioms:
  - { pl: "przydarzyło się, co się przydarzyło", ru: "что случилось, то случилось" }
