etymology: "От MODEL с женским суффиксом -KA, а MODEL — из итальянского MODELLO, уменьшительного от латинского MODULUS «мерка», которое само уменьшительное от MODUS «мера». То есть модель это дважды уменьшенная мера: маленькая мерка, по которой делают большое. От того же MODUS идут «мода», «модус», «модуль» и «умеренность». Оба языка взяли слово из одного источника, но польский воспользовался своим суффиксом -KA, чтобы отделить женщину от предмета, а русский оставил одно слово на оба случая и различает их только по согласованию. Поэтому MODELKA переводится описательно, а «моделька» по-польски будет MODELIK."
memory: "Не «моделька»: польская modelka это женщина — манекенщица или натурщица, а маленькая модель называется modelik. Мужчина в той же роли model, и это же слово значит образец. Польский разводит суффиксом то, что русский держит в одном слове, и так же поступает со всеми занятиями: nauczycielka, lekarka. От латинского modulus «мерка», уменьшительного от modus — отсюда же мода и модуль. Падежи: modelce с меной k→c, modelek с беглым e."
