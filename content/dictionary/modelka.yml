notes:
  - { kind: false-friend, text: "Русская «моделька» — это маленькая модель, игрушечная машинка или макет, и слово это уменьшительное от предмета. Польская MODELKA означает женщину: манекенщицу на подиуме или натурщицу у художника. Мужчина в той же роли — MODEL, и это же слово значит образец и макет: MODEL SAMOLOTU «модель самолёта». То есть польский развёл по родам то, что русский держит в одном слове: «модель» по-русски и женщина, и предмет. Уменьшительное от предмета по-польски будет MODELIK, и именно оно отвечает русской «модельке»." }
  - { kind: usage, text: "Десять форм, женский род. Дательный и местный единственного — MODELCE, с меной K в C перед окончанием -E; родительный множественного — MODELEK, с беглым E. Слово образовано от MODEL суффиксом -KA, тем же, который даёт названия женщин по занятию: NAUCZYCIELKA, LEKARKA, DZIENNIKARKA. Этот способ в польском живой и обязательный там, где русский часто обходится мужской формой: по-русски «она врач», по-польски скорее ONA JEST LEKARKĄ. Управление: MODELKA CZEGOŚ в родительном — MODELKA DOMU MODY." }
  - { kind: pronunciation, text: "Читается «моде́лька», три слога, ударение на втором. Польское L перед E звучит мягче русского твёрдого «л», и в транскрипции передаётся как «ль». Буква E даёт «э», но после мягкого L слышится ближе к «е». В форме MODELCE сочетание LC читается «льц»: «моде́льце». В форме MODELEK беглое E произносится отчётливо: «моде́лек». В форме MODELKĄ последнее Ą даёт «он»: «моде́лькон»." }
  - { kind: register, text: "Слово нейтральное. Устойчивые сочетания: MODELKA NA WYBIEGU «модель на подиуме», ZOSTAĆ MODELKĄ, AGENCJA MODELEK «модельное агентство», SESJA ZDJĘCIOWA «фотосессия». В разговоре о живописи MODELKA значит натурщицу, и это значение старше первого. Переносно слово употребляют с лёгкой иронией о человеке, который слишком долго прихорашивается. Мужская пара MODEL в значении человека появилась в польском позже и до сих пор звучит менее привычно, чем женская." }
