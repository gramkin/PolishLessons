# review
id: eksplodowac
format: 2
lemma: "eksplodować"
rank: 4658
pos: verb
pron: { cyr: "эксплодо́ваць" }
senses:
  - id: explode
    ru: "взрываться"
    examples:
      - pl: "Bomba eksplodowała w centrum miasta."
        ru: "Бомба взорвалась в центре города."
        source: { kind: authored }
      - pl: "Butla z gazem może eksplodować."
        ru: "Газовый баллон может взорваться."
        source: { kind: authored }
      - pl: "Fajerwerki eksplodują nad rzeką."
        ru: "Над рекой взрываются фейерверки."
        source: { kind: authored }
  - id: burst
    ru: "взорваться (от гнева, смеха); резко вырасти"
    examples:
      - pl: "Zaraz eksploduję ze złości!"
        ru: "Я сейчас взорвусь от злости!"
        source: { kind: authored }
      - pl: "Ceny mieszkań eksplodowały."
        ru: "Цены на квартиры взлетели."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "EKSPLODOWAĆ — «взрываться», а не «эксплуатировать» (EKSPLOATOWAĆ). Звучит книжнее, чем WYBUCHNĄĆ; в новостях и технике говорят и так, и так. Переносно — о гневе, ценах, популярности: POPULARNOŚĆ EKSPLODOWAŁA." }
  - { kind: usage, text: "Двувидовой глагол: EKSPLODUJE значит и «взрывается», и «взорвётся». Спряжение на -UJĘ: EKSPLODUJĘ, EKSPLODUJESZ, EKSPLODUJĄ. Повелительное, безличное EKSPLODOWANO, деепричастие EKSPLODOWAWSZY и отглагольное существительное (вместо него — EKSPLOZJA) в карточку не включены." }
  - { kind: government, text: "Где — W с предложным: EKSPLODOWAĆ W SAMOCHODZIE. Отчего — Z с родительным: EKSPLODOWAĆ ZE ZŁOŚCI, ZE ŚMIECHU. Глагол непереходный: взорвать что-то — WYSADZIĆ." }
  - { kind: pronunciation, text: "Читается «эксплодо́ваць»: KS — «кс», ударение на предпоследнем слоге. EKSPLODUJE — «эксплоду́е»." }
  - { kind: register, text: "Нейтрально-книжное слово: новости, техника, наука. В разговоре чаще WYBUCHNĄĆ." }
collocations:
  - { pl: "bomba eksplodowała", ru: "бомба взорвалась" }
  - { pl: "eksplodować ze złości", ru: "взорваться от злости" }
  - { pl: "ceny eksplodowały", ru: "цены взлетели" }
family:
  - { pl: "eksplozja", ru: "взрыв", relation: derived }
  - { pl: "wybuchnąć", ru: "взорваться", relation: root, id: wybuchnac }
  - { pl: "wybuch", ru: "взрыв", relation: root, id: wybuch }
etymology: "Из латинского EXPLODERE «освистать, выгнать хлопками» через французское EXPLOSER. Значение «взрываться» появилось в XIX веке."
memory: "Eksplodować — взрываться: bomba eksplodowała. Не «эксплуатировать» (eksploatować)! Eksploduję ze złości — взорвусь от злости."
idioms:
  - { pl: "eksplodować śmiechem", ru: "взорваться смехом" }
