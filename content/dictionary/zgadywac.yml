notes:
  - { kind: false-friend, text: "КОРЕНЬ — РУССКОЕ «ГАДАТЬ», НО ПРОСТОЕ ПОЛЬСКОЕ СЛОВО УШЛО В СТОРОНУ. GADAĆ по-польски значит «болтать, трепаться», а не «гадать»: nie gadaj tyle «не болтай столько». Старый смысл сохранился только в приставочных: ZGADYWAĆ «угадывать», ZAGADKA «загадка». Так что zagadka и «загадка» совпали, а gadać и «гадать» разошлись полностью." }
  - { kind: usage, text: "ГЛАГОЛЫ НА -YWAĆ ДЕЛЯТ ОСНОВУ НАДВОЕ, И ЭТО НАДО ВИДЕТЬ. Настоящее время, повелительное и причастия идут на -UJ-: zgaduję, zgadujesz, zgaduj, zgadujący, zgadując. А прошедшее, страдательное и отглагольное существительное сохраняют -YWA-: zgadywał, zgadywany, zgadywanie. Путать эти две основы — частая ошибка." }
  - { kind: usage, text: "Вид несовершенный: есть zgadując и zgadujący, формы на -wszy нет. Совершенная пара — ZGADNĄĆ, и её повелительное звучит иначе: ZGADNIJ! «угадай!». Отсюда же zgadywanka «угадайка» и zagadka «загадка»." }
collocations:
  - { pl: "zgadywać zagadki", ru: "отгадывать загадки" }
  - { pl: "zgaduj dalej", ru: "угадывай дальше" }
  - { pl: "zgadywanie na chybił trafił", ru: "угадывание наугад" }
family:
  - { pl: "zgadnąć", ru: "угадать (сов.)", relation: aspect, id: zgadnac }
  - { pl: "zagadka", ru: "загадка", relation: derived, id: zagadka }
  - { pl: "gadać", ru: "болтать", relation: root, id: gadac }
etymology: "Из праславянского *gadati «предполагать, гадать», того же корня, что русские «гадать», «угадать» и «загадка». Польское gadać сместилось к болтовне, а исходный смысл удержали приставочные zgadywać и zagadka. Отсюда и zgadywanka."
memory: "zgadywać — «угадывать», и корень тот же, что в русском «гадать». Но осторожно: простое gadać значит «болтать». Основа делится: zgaduję в настоящем, zgadywał в прошедшем. Совершенное — zgadnąć, повелительное zgadnij."
idioms:
  - { pl: "zgadywać w ciemno", ru: "угадывать наугад" }
  - { pl: "nie każ mi zgadywać", ru: "не заставляй меня угадывать" }
