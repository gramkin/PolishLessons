notes:
  - { kind: false-friend, text: "FAJKA прежде всего трубка: DZIADEK PALI FAJKĘ. Но в разговоре у неё ещё два значения. FAJKA — сигарета: MASZ FAJKĘ? — «есть сигаретка?», WYJŚĆ NA FAJKĘ — «выйти покурить». И FAJKA — галочка в списке: POSTAWIĆ FAJKĘ. Отсюда ODFAJKOWAĆ — «отметить галочкой», а с иронией и «сделать для галочки»." }
  - { kind: usage, text: "Десять форм в таблице, женский род. В дательном и местном падежах K переходит в C: W FAJCE. В родительном множественного беглое E: FAJEK. Звательная форма на практике не нужна." }
  - { kind: government, text: "Курить трубку — PALIĆ FAJKĘ, винительный. Выйти покурить — WYJŚĆ NA FAJKĘ, NA с винительным. Табак в трубке — TYTOŃ W FAJCE, местный." }
  - { kind: pronunciation, text: "Читается «фа́йка», два слога, ударение на первом. J перед K даёт «й». В форме FAJCE: «фа́йце»." }
  - { kind: register, text: "Значение «трубка» нейтральное. «Сигарета» и «галочка» — разговорные: в официальной речи сигарета — PAPIEROS. FAJKA POKOJU — «трубка мира», в том числе в переносном смысле о примирении." }
collocations:
  - { pl: "palić fajkę", ru: "курить трубку" }
  - { pl: "nabić fajkę", ru: "набить трубку" }
  - { pl: "wyjść na fajkę", ru: "выйти покурить" }
family:
  - { pl: "fajeczka", ru: "трубочка", relation: derived }
  - { pl: "fajkowy", ru: "трубочный", relation: derived }
  - { pl: "odfajkować", ru: "отметить галочкой; сделать для галочки", relation: derived }
etymology: "Из немецкого слова со значением «дудка, трубка», через диалектные формы. Русскому «трубка» оно не родственно, поэтому запоминать его удобнее через три значения: трубка, сигарета, галочка."
memory: "Fajka — трубка: palić fajkę. В разговоре ещё сигарета (wyjść na fajkę) и галочка (postawić fajkę). Odfajkować — сделать для галочки. Читается «фа́йка». Fajka pokoju — трубка мира."
idioms:
  - { pl: "fajka pokoju", ru: "трубка мира" }
  - { pl: "zapalić fajkę pokoju", ru: "выкурить трубку мира, помириться" }
formExamplesSkip:
