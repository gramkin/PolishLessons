# review
id: ramie
format: 2
lemma: "ramię"
rank: 956
pos: noun
pron: { cyr: "ра́ме" }
senses:
  - id: shoulder
    ru: "плечо"
    examples:
      - pl: "Boli mnie lewe ramię."
        ru: "У меня болит левое плечо."
        source: { kind: tatoeba, id: 2224061 }
      - pl: "Moja mała córka lubi siedzieć na moich ramionach."
        ru: "Дочке нравится сидеть у меня на плечах."
        source: { kind: tatoeba, id: 4935774 }
      - pl: "Bolą mnie ramiona."
        ru: "У меня болят плечи."
        source: { kind: translated, id: 8446250 }
  - id: arm
    ru: "рука (от плеча); объятия"
    note: "В разговоре слово покрывает и плечо, и всю руку выше локтя."
    examples:
      - pl: "Ramię Toma musiało być amputowane."
        ru: "Рука Тома должна была быть ампутирована."
        source: { kind: tatoeba, id: 2912960 }
      - pl: "Jak jego ramię?"
        ru: "Как его рука?"
        source: { kind: tatoeba, id: 13785999 }
      - pl: "Zasnęła w jego ramionach."
        ru: "Она уснула в его объятиях."
        source: { kind: translated, id: 12470490 }
  - id: shrug
    ru: "wzruszyć ramionami — пожать плечами"
    examples:
      - pl: "Tom popatrzył na Mary i wzruszył ramionami."
        ru: "Том взглянул на Мэри и пожал плечами."
        source: { kind: tatoeba, id: 6534573 }
      - pl: "Wzruszyłem ramionami"
        ru: "Я пожал плечами."
        source: { kind: translated, id: 12360153 }
      - pl: "Włosy sięgają jej do ramion."
        ru: "Волосы доходят ей до плеч."
        source: { kind: translated, id: 8751098 }
notes:
  - { kind: usage, text: "Существительное среднего рода на -ę, и склоняется оно с наращением -eni-: ramię, ramienia, ramieniu, ramieniem. Так же ведут себя imię «имя» и zwierzę «животное»." }
  - { kind: usage, text: "Слово покрывает и «плечо», и «руку» выше локтя. Кисть руки — dłoń, вся рука целиком — ręka. Поэтому Boli mnie ramię может значить и «болит плечо», и «болит рука»." }
  - { kind: usage, text: "wzruszyć ramionami — «пожать плечами», буквально «шевельнуть плечами». Русский говорит «пожать», польский — «шевельнуть»." }
  - { kind: usage, text: "w ramionach — «в объятиях»: zasnęła w moich ramionach. А ramię w ramię значит «плечом к плечу»." }
collocations:
  - { pl: "wzruszyć ramionami", ru: "пожать плечами" }
  - { pl: "ramię w ramię", ru: "плечом к плечу" }
  - { pl: "w ramionach", ru: "в объятиях" }
  - { pl: "do ramion", ru: "до плеч" }
family:
  - { pl: "ręka", ru: "рука", relation: root, id: reka }
  - { pl: "naramiennik", ru: "наплечник", relation: derived }
  - { pl: "ramiączko", ru: "лямка", relation: derived }
etymology: "Праславянское *ormę «плечо». Русское «рамена» — устаревшее «плечи» — то же слово; в современном русском оно ушло, а в польском осталось обиходным."
memory: "ramię — «плечо», а в разговоре и «рука» выше локтя. Склоняется с наращением, как imię и zwierzę: ramię, ramienia, ramieniem. Запомните wzruszyć ramionami «пожать плечами» — по-польски плечами именно «шевелят»."
idioms:
  - { pl: "wzruszyć ramionami", ru: "пожать плечами" }
  - { pl: "ramię w ramię", ru: "плечом к плечу" }
  - { pl: "w ramionach", ru: "в объятиях" }
