# review
id: ogladac
format: 2
lemma: "oglądać"
rank: 540
pos: verb
aspect: imperf
pron: { cyr: "огло́ндаць" }
senses:
  - id: watch
    ru: "смотреть (телевизор, фильм)"
    note: "Дополнение в винительном без предлога: oglądam telewizję."
    examples:
      - pl: "On ogląda telewizję."
        ru: "Он смотрит телевизор."
        source: { kind: tatoeba, id: 529674 }
      - pl: "Oglądam telewizję."
        ru: "Я смотрю телевизор."
        source: { kind: tatoeba, id: 548231 }
      - pl: "Nie chcę oglądać telewizji."
        ru: "Я не хочу смотреть телевизор."
        source: { kind: tatoeba, id: 4716846 }
  - id: examine
    ru: "рассматривать, осматривать"
    note: "oglądać zdjęcia «рассматривать фотографии»."
    examples:
      - pl: "Oglądałem stare zdjęcia."
        ru: "Я рассматривал старые фотографии."
        source: { kind: translated, id: 361223 }
      - pl: "Oglądała kilka sukienek i wybrała najdroższą."
        ru: "Она осмотрела несколько платьев и выбрала самое дорогое."
        source: { kind: translated, id: 7875635 }
      - pl: "Dziś oglądałam bransolety."
        ru: "Сегодня я смотрела браслеты."
        source: { kind: translated, id: 2379968 }
  - id: viewing
    ru: "oglądanie — просмотр"
    note: "podczas oglądania telewizji «во время просмотра телевизора»."
    examples:
      - pl: "Moje hobby to wędkowanie i oglądanie telewizji."
        ru: "Мои хобби — рыбачить и смотреть телевизор."
        source: { kind: tatoeba, id: 2269734 }
      - pl: "Używam go podczas oglądania telewizji."
        ru: "Я пользуюсь им во время просмотра телевизора."
        source: { kind: translated, id: 712407 }
      - pl: "Jestem zmęczony oglądaniem telewizji."
        ru: "Я устал смотреть телевизор."
        source: { kind: translated, id: 613353 }
notes:
  - { kind: government, text: "oglądać coś — винительный падеж без предлога: oglądam telewizję. Этим оно отличается от patrzeć na coś «смотреть на что-то», где предлог na обязателен." }
  - { kind: usage, text: "Совершенный вид — obejrzeć: obejrzałem film «я посмотрел фильм»." }
  - { kind: usage, text: "С się значит «оглядываться»: nie oglądaj się za siebie «не оглядывайся назад»." }
  - { kind: usage, text: "Отглагольное существительное oglądanie «просмотр» очень частое: podczas oglądania telewizji." }
collocations:
  - { pl: "oglądać telewizję", ru: "смотреть телевизор" }
  - { pl: "oglądać film", ru: "смотреть фильм" }
  - { pl: "oglądać zdjęcia", ru: "рассматривать фотографии" }
  - { pl: "oglądać się za siebie", ru: "оглядываться назад" }
family:
  - { pl: "obejrzeć", ru: "посмотреть", relation: derived }
  - { pl: "spoglądać", ru: "поглядывать", relation: root }
  - { pl: "wzgląd", ru: "взгляд, соображение", relation: derived }
etymology: "Приставка ob- плюс glądać «глядеть», от праславянского *ględati — то же слово, что русское «глядеть»; отсюда же spoglądać «поглядывать» и wzgląd «взгляд»."
memory: "oglądać — «смотреть, рассматривать», и дополнение идёт в винительном без всякого предлога: oglądam telewizję, oglądał stare zdjęcia. Этим оно и отличается от patrzeć na coś, где предлог na обязателен: по-русски «смотреть» покрывает оба, так что предлог приходится держать в голове отдельно. Совершенный вид — obejrzeć, а с się глагол значит «оглядываться»: nie oglądaj się za siebie."
idioms:
  - { pl: "oglądać telewizję", ru: "смотреть телевизор" }
  - { pl: "oglądać zdjęcia", ru: "рассматривать фотографии" }
  - { pl: "oglądać się za siebie", ru: "оглядываться назад" }
