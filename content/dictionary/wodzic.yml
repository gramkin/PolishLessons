# review
id: wodzic
format: 2
lemma: "wodzić"
rank: 2281
pos: verb
aspect: imperf
aspectPair: wiesc
pron: { cyr: "во́дзиць" }
senses:
  - id: lead-around
    ru: "водить (многократно)"
    examples:
      - pl: "Starczy wodzenia mnie za nos!"
        ru: "Хватит водить меня за нос!"
        source: { kind: tatoeba, id: 2493645 }
      - pl: "Wodził wzrokiem za dziewczyną."
        ru: "Он водил взглядом за девушкой."
        source: { kind: translated, id: 2239277 }
      - pl: "Wodził palcem po mapie."
        ru: "Он водил пальцем по карте."
        source: { kind: authored }
  - id: by-the-nose
    ru: "водить за нос (wodzić za nos)"
    examples:
      - pl: "Wodzi go za nos od miesięcy."
        ru: "Она водит его за нос уже месяцы."
        source: { kind: authored }
      - pl: "Nie daj się wodzić za nos."
        ru: "Не давай водить себя за нос."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Многократный глагол к wieść «вести»: не одно движение, а повторяющееся или длительное — wodzić wzrokiem «водить взглядом», wodzić palcem «водить пальцем»." }
  - { kind: government, text: "Винительный падеж; по чему — po с предложным: wodzić palcem po mapie." }
  - { kind: false-friend, text: "wodzić za nos «водить за нос» совпадает с русским оборотом дословно, включая предлог." }
  - { kind: usage, text: "Пару ему составляет wieść «вести», у которого уже есть карточка." }
collocations:
  - { pl: "wodzić za nos", ru: "водить за нос" }
  - { pl: "wodzić wzrokiem", ru: "водить взглядом" }
etymology: "Многократное к wieść «вести», праславянское *voditi; ср. русское «водить», «вождь»."
memory: "wodzić — многократное «водить»: wodzić wzrokiem, wodzić palcem. Оборот wodzić za nos совпадает с русским дословно. Пара по виду — wieść."
idioms:
  - { pl: "wodzić za nos", ru: "водить за нос" }
