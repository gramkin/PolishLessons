  - { pl: "nieszczęście", ru: "несчастье", relation: root, id: nieszczescie }
etymology: "От SZCZĘŚLIWY, а то — от SZCZĘŚCIE «счастье». Польское Ę на месте русского «а», как CZĘŚĆ и «часть»: счастье — исходно «хорошая доля, часть»."
memory: "Szczęśliwie — счастливо и благополучно. Читается «шчэньсьли́ве». Szczęśliwej podróży! — Счастливого пути! Na szczęście — к счастью."
idioms:
  - { pl: "i żyli długo i szczęśliwie", ru: "и жили они долго и счастливо" }
