notes:
  - { kind: false-friend, text: "SZCZĘŚLIWIE — не только «счастливо», но и «благополучно»: SZCZĘŚLIWIE WYLĄDOWAĆ, «благополучно приземлиться». Пожелание «Счастливого пути!» — SZCZĘŚLIWEJ PODRÓŻY! Обычное «к счастью» — NA SZCZĘŚCIE." }
  - { kind: usage, text: "Наречие со степенями: SZCZĘŚLIWIE, SZCZĘŚLIWIEJ, NAJSZCZĘŚLIWIEJ. О самочувствии говорят прилагательным: CZUJĘ SIĘ SZCZĘŚLIWY, а не наречием." }
  - { kind: government, text: "Наречие ничем не управляет. В начале фразы работает как вводное: SZCZĘŚLIWIE NIKT NIE ZGINĄŁ, «к счастью, никто не погиб»." }
  - { kind: pronunciation, text: "Читается «шчэньсьли́ве», ударение на предпоследнем слоге. SZCZ — «шч», Ę перед Ś звучит «энь», ŚL — «сьл»." }
collocations:
  - { pl: "żyć długo i szczęśliwie", ru: "жить долго и счастливо" }
  - { pl: "szczęśliwie wrócić", ru: "благополучно вернуться" }
