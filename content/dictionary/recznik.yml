etymology: "От RĘKA «рука» и суффикса -NIK, то есть буквально «то, чем вытирают руки». Русский построил своё обиходное слово иначе: «полотенце» идёт от «полотно», то есть названо по материалу, а не по назначению. Зато у русского есть точный структурный двойник польского слова — «рушник», тоже от «руки», и в обрядовой речи он жив до сих пор. Так что польское название не экзотика, а та же модель, которая в русском осталась на втором плане. Сам корень совпадает полностью: праславянское *rǫka дало RĘKA и «руку», где польская носовая ę отвечает русскому у — то же соответствие, что в SĄD и «суде». Суффикс -NIK в польском исключительно productive и всюду означает предмет или человека по действию: CZAJNIK, SŁOWNIK, PRACOWNIK."
memory: "Не «ручник»! ręcznik — полотенце, а ручной тормоз — hamulec ręczny. Разбирается буквально: ręka плюс -nik, «то, чем вытирают руки»; русский двойник по строению — «рушник». Читается «рэ́нчник», ударение на первом слоге. Идиома rzucić ręcznik — «сдаться», из бокса."
idioms:
  - { pl: "rzucić ręcznik", ru: "сдаться, признать поражение" }
  - { pl: "ręcznik papierowy", ru: "бумажное полотенце" }
