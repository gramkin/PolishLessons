notes:
  - { kind: false-friend, text: "Созвучие с русским «ручник» обманчиво и ведёт прямо в аварию. Польское RĘCZNIK — это полотенце, и только. Русский «ручник», то есть ручной тормоз, по-польски HAMULEC RĘCZNY, а «ручная работа» — ROBOTA RĘCZNA. То есть прилагательное RĘCZNY действительно значит «ручной», но существительное RĘCZNIK ушло в сторону полотенца и в сторону тормоза не смотрит. Запомнить помогает буквальный разбор: RĘCZNIK — это «то, чем вытирают руки»." }
  - { kind: pronunciation, text: "Читается «рэ́нчник», с ударением на первом слоге из двух. Носовая ę перед cz сохраняет назальность и звучит «эн», как и в RĘKA «рэ́нка». Сочетание CZ даёт твёрдое «ч». Конечное K оглушать не нужно, оно и так глухое. В местном падеже RĘCZNIKU звучит «рэ́нчнику», ударение остаётся на первом слоге, потому что в польском оно всегда на предпоследнем, а слог тут добавляется в конец: «рэнчни́ку» было бы ошибкой." }
  - { kind: usage, text: "Виды полотенец различают прилагательным: RĘCZNIK KĄPIELOWY «банное», RĘCZNIK PAPIEROWY «бумажное», RĘCZNIK KUCHENNY «кухонное». Самое частое употребление — с глаголом WYTRZEĆ SIĘ и творительным падежом: WYTRZYJ SIĘ RĘCZNIKIEM. Идиома RZUCIĆ RĘCZNIK пришла из бокса, где секундант бросает полотенце на ринг, и значит в точности то же, что русское «бросить полотенце» или «сдаться»; русский чаще скажет «выбросить белый флаг», но боксёрский образ понятен и у нас." }
  - { kind: government, text: "Существительное мужского рода, неодушевлённое, поэтому винительный совпадает с именительным: WIDZĘ RĘCZNIK. Родительный на -A: NIE MA RĘCZNIKA. При отрицании винительный обязательно меняется на родительный, как всегда в польском: WZIĄŁ RĘCZNIK, но NIE WZIĄŁ RĘCZNIKA. Глагол UŻYĆ требует родительного: UŻYJ RĘCZNIKA PAPIEROWEGO. Местный падеж на -U, с предлогами W, NA, O, PO: NA RĘCZNIKU, O RĘCZNIKU." }
