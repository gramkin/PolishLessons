notes:
  - { kind: false-friend, text: "Корень общий и ведёт себя одинаково в обоих языках: PIES это «пёс», и беглое E выпадает точно так же, PIES — PSA, как «пёс» — «пса». Разница в том, какое слово главное. По-русски обычное название животного «собака», а «песий» звучит книжно и редко. По-польски же PIES это и есть обычное слово, а PSI совершенно обиходное прилагательное: PSIA BUDA, PSI WĘCH, PSIE ŁAPY." }
  - { kind: usage, text: "Десять форм, а не одиннадцать, потому что основа мягкая и мужско-личная форма множественного числа совпала с мужской единственного: и PSI WĘCH, и PSI OBROŃCY пишутся одинаково. Так же устроен целый разряд притяжательных прилагательных от названий животных: KOCI «кошачий», PTASI «птичий», WOLI «воловий», RYBI «рыбий». Выучив одно, вы получаете всю группу, включая её мягкое склонение." }
  - { kind: government, text: "В собачьей будке — предлог W с местным падежом: W PSIEJ BUDZIE. Прилагательное согласуется с существительным и стоит перед ним, как и положено качественному и притяжательному: PSI WĘCH, PSIA SIERŚĆ, PSIE ŁAPY. В обороте о плохой погоде работает уже не прилагательное, а существительное в творительном: POGODA POD PSEM, буквально «погода под псом»." }
  - { kind: pronunciation, text: "Читается «псьи», один слог. Сочетание SI даёт мягкое «сь» перед «и», поэтому звучит не «пси», а «псьи», с явно смягчённым S. То же в остальных формах: PSIA это «псья», PSIE это «псье», PSIM это «псьим». В самом PIES слышно «пес», с мягким P и обычным «е», а в родительном PSA беглое E исчезает и остаётся «пса», совсем как по-русски." }
  - { kind: register, text: "Прямое значение нейтральное и повседневное. Переносный пласт богатый и выразительный: PSIE ŻYCIE «собачья жизнь», POGODA POD PSEM «погода хуже некуда», ZEJŚĆ NA PSY «опуститься, прийти в упадок», PSIM SWĘDEM «каким-то чудом, непонятно как». Последние два оборота в разговоре слышны постоянно, и ни один из них не переводится дословно, так что запоминать их приходится целиком." }
