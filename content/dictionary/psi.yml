etymology: "От PIES, от праславянского слова, давшего и русского «пса». Слово древнее и общеславянское, а разошлись языки в том, какое название вышло на первое место: русский предпочёл «собаку», слово иранского происхождения, и оттеснил «пса» в разговорный и бранный угол, тогда как польский оставил PIES главным и нейтральным. Прилагательное PSI сохранило старый тип притяжательных на мягкую основу, тот же, что в KOCI и PTASI."
memory: "Корень общий с русским «псом», и беглое e ведёт себя так же: pies — psa, как «пёс» — «пса». Но по-польски pies это обычное слово для собаки, а не грубоватое, поэтому и psi «собачий» совершенно обиходно. Форм десять: мягкая основа слила мужскую единственного с мужско-личной множественного, как у koci, ptasi, rybi. Читается «псьи», где si даёт мягкое «сь». Обороты: psie życie, pogoda pod psem."
idioms:
  - { pl: "psie życie", ru: "собачья жизнь" }
