      - pl: "Osiągnęli niewiarygodną precyzję."
        ru: "Они достигли невероятной точности."
        source: { kind: authored }
  - id: untrustworthy
    ru: "недостоверный, не заслуживающий доверия"
    examples:
      - pl: "Niewiarygodny świadek szkodzi sprawie."
        ru: "Ненадёжный свидетель вредит делу."
        source: { kind: authored }
      - pl: "Sąd uznał zeznania za niewiarygodne."
        ru: "Суд счёл показания недостоверными."
        source: { kind: authored }
      - pl: "To niewiarygodne źródło, sprawdź gdzie indziej."
        ru: "Это недостоверный источник, проверь в другом месте."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ВТОРОЕ ЗНАЧЕНИЕ РУССКОМУ ПОЧТИ НЕЗНАКОМО. «Невероятный» по-русски значит «поразительный», и такое значение у niewiarygodny тоже есть. Но чаще всего оно значит «НЕДОСТОВЕРНЫЙ, не заслуживающий доверия»: niewiarygodny świadek это не «невероятный свидетель», а «ненадёжный». Подсказка в положительной форме: wiarygodny отвечает русскому «достоверный», и корень здесь не «вероятность», а «вера»." }
  - { kind: usage, text: "Слово составное: wiara «вера» плюс godny «достойный», буквально «достойный веры». Обратите внимание на godny: с русским «годным» оно схоже только по форме, а значит «достойный» — godny zaufania «достойный доверия», godny podziwu «достойный восхищения». Степеней сравнения у составного прилагательного нет, отсюда одиннадцать форм." }
  - { kind: pronunciation, text: "Пять слогов, ударение на предпоследнем: nie-wia-ry-GO-dny, «невярыго́дны». ni и wi перед гласными читаются мягко, y как ы." }
collocations:
  - { pl: "niewiarygodny świadek", ru: "ненадёжный свидетель" }
  - { pl: "niewiarygodne źródło", ru: "недостоверный источник" }
  - { pl: "niewiarygodny zbieg okoliczności", ru: "невероятное стечение обстоятельств" }
family:
  - { pl: "wiarygodny", ru: "достоверный, надёжный", relation: antonym }
  - { pl: "wiara", ru: "вера", relation: root, id: wiara }
  - { pl: "godny", ru: "достойный", relation: root }
  - { pl: "wiarygodność", ru: "достоверность", relation: derived }
etymology: "Отрицание nie- плюс wiarygodny, а то — сложение wiara «вера» и godny «достойный», буквально «достойный веры». Русское «достоверный» собрано по той же модели, только части переставлены: «достойный» и «вера». Отсюда wiarygodność «достоверность», niewiarygodność и наречие wiarygodnie."
memory: "niewiarygodny — чаще «НЕДОСТОВЕРНЫЙ», чем «невероятный»: niewiarygodny świadek это ненадёжный свидетель. Подсказка в составе: wiara плюс godny, «достойный веры». И помните, что godny значит «достойный», а не «годный»."
