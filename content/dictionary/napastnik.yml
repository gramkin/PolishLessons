notes:
  - { kind: false-friend, text: "NAPASTNIK — и футбольный «нападающий», и «налётчик» из криминальной хроники. Подвох в родственном NAPAŚĆ: это не «напасть, беда», а «нападение»: NAPAŚĆ NA BANK, «нападение на банк»." }
  - { kind: usage, text: "Десять форм, мужской род, лицо. Во множественном K переходит в C: NAPASTNICY. Творительный — NAPASTNIKIEM." }
  - { kind: government, text: "Нападавший на кого — NAPASTNIK, но само нападение — NAPAŚĆ NA, и винительный. Задержать нападавшего — ZATRZYMAĆ NAPASTNIKA." }
  - { kind: pronunciation, text: "Читается «напа́стник», ударение на предпоследнем слоге. STN — «стн», все звуки произносятся." }
collocations:
