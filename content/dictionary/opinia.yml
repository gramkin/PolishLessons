notes:
  - { kind: usage, text: "Форма opinij — устаревший родительный множественного; современная норма opinii (nie ma dwóch opinii «двух мнений быть не может»), поэтому opinij оставлена без примеров. Так у всех слов на -ja и -ia: lekcja — lekcji, stacja — stacji." }
  - { kind: usage, text: "Слово покрывает и «мнение», и «репутацию»: moja opinia «моё мнение», но dobra opinia «хорошая репутация»." }
  - { kind: usage, text: "opinia publiczna — «общественное мнение», устойчивое сочетание." }
  - { kind: false-friend, text: "Школьная оценка — это ocena, а не opinia; opinia — письменный отзыв или заключение специалиста." }
  - { kind: usage, text: "Форма opinij — архаичный вариант родительного множественного; современная форма — opinii, она же предложная: w mojej opinii «по моему мнению»." }
collocations:
  - { pl: "opinia publiczna", ru: "общественное мнение" }
  - { pl: "wyrazić opinię", ru: "выразить мнение" }
  - { pl: "dobra opinia", ru: "хорошая репутация" }
  - { pl: "zasięgnąć opinii", ru: "запросить мнение" }
etymology: "Из латинского opinio «мнение, предположение» (от opinari «полагать»). Заимствование общеевропейское: английское opinion, французское opinion, польское opinia."
memory: "opinia = и «мнение», и «репутация»: to moja opinia «это моё мнение», но ma dobrą opinię «у него хорошая репутация». Устойчиво — opinia publiczna «общественное мнение». Школьная оценка — это ocena, не opinia."
idioms:
  - { pl: "opinia publiczna", ru: "общественное мнение" }
  - { pl: "w mojej opinii", ru: "по моему мнению" }
  - { pl: "ilu ludzi, tyle opinii", ru: "сколько людей, столько мнений" }
formExamplesSkip:
