# review
id: upokorzyc
format: 2
lemma: "upokorzyć"
rank: 4255
pos: verb
pron: { cyr: "упоко́жыць" }
senses:
  - id: humiliate
    ru: "унизить"
    examples:
      - pl: "Upokorzył ją przy wszystkich."
        ru: "Он унизил её при всех."
        source: { kind: authored }
      - pl: "Ta porażka upokorzyła całą drużynę."
        ru: "Это поражение унизило всю команду."
        source: { kind: authored }
      - pl: "Nie pozwól się upokorzyć."
        ru: "Не позволяй себя унижать."
        source: { kind: authored }
  - id: abase
    ru: "с SIĘ — унизиться (перед кем-то)"
    examples:
      - pl: "Upokorzył się przed szefem, prosząc o pracę."
        ru: "Он унизился перед шефом, прося работу."
        source: { kind: authored }
      - pl: "Nie upokorzę się przed nim."
        ru: "Я не стану перед ним унижаться."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "UPOKORZYĆ — «унизить», а не «покорить» (ZDOBYĆ, PODBIĆ) и не «успокоить» (USPOKOIĆ). Корень — POKORA «смирение». UPOKORZENIE — «унижение»." }
  - { kind: usage, text: "Пятьдесят три формы. Повелительное с Ó: UPOKÓRZ, UPOKÓRZMY, UPOKÓRZCIE; варианты с O в карточку не включены. Будущее: UPOKORZĘ, UPOKORZYSZ. Несовершенный вид — UPOKARZAĆ." }
  - { kind: government, text: "Кого — винительный; чем — творительный: UPOKORZYĆ KOGOŚ ODMOWĄ. При ком — PRZY с предложным: PRZY WSZYSTKICH. С SIĘ — PRZED с творительным: UPOKORZYĆ SIĘ PRZED KIMŚ." }
  - { kind: pronunciation, text: "Читается «упоко́жыць»: RZY — «жы», ударение на предпоследнем слоге. UPOKORZĘ — «упоко́жэ», UPOKÓRZ — «упо́куш»." }
  - { kind: register, text: "Нейтральное, чуть книжное слово. В разговоре — PONIŻYĆ, OŚMIESZYĆ. UPOKORZENIE — частое в прессе и литературе." }
collocations:
  - { pl: "upokorzyć kogoś publicznie", ru: "унизить кого-то публично" }
  - { pl: "poczuć się upokorzonym", ru: "почувствовать себя униженным" }
  - { pl: "upokorzyć się przed kimś", ru: "унизиться перед кем-то" }
family:
  - { pl: "pokora", ru: "смирение, покорность", relation: root }
  - { pl: "pokorny", ru: "смиренный, покорный", relation: derived }
  - { pl: "upokarzać", ru: "унижать", relation: aspect }
etymology: "Приставка U- плюс POKORZYĆ «смирять», от POKORA «смирение», праславянское *pokora. Русское «покорный», «покорить» — то же гнездо, но польский глагол значит «унизить»."
memory: "Upokorzyć — унизить: upokorzył ją przy wszystkich. Upokorzenie — унижение. Не «покорить»! Читается «упоко́жыць»."
idioms:
  - { pl: "przełknąć upokorzenie", ru: "проглотить унижение" }
formExamplesSkip:
  - { form: "upokorz", reason: "вариант повелительного; основной — UPOKÓRZ" }
  - { form: "upokorzmy", reason: "вариант повелительного; основной — UPOKÓRZMY" }
  - { form: "upokorzcie", reason: "вариант повелительного; основной — UPOKÓRZCIE" }
