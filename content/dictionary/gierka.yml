# review
id: gierka
format: 2
lemma: "gierka"
rank: 5353
pos: noun
pron: { cyr: "ге́рка" }
senses:
  - id: game
    ru: "игра, партейка (разг.)"
    examples:
      - pl: "Zagrajmy jeszcze jedną gierkę w karty."
        ru: "Давай сыграем ещё партейку в карты."
        source: { kind: authored }
      - pl: "Na telefonie mam kilka gierek."
        ru: "У меня на телефоне несколько игрушек."
        source: { kind: authored }
      - pl: "To tylko prosta gierka dla dzieci."
        ru: "Это просто игра для детей."
        source: { kind: authored }
  - id: intrigue
    ru: "игры, интриги (мн.: GIERKI)"
    examples:
      - pl: "Nie bawię się w twoje gierki."
        ru: "Я не играю в твои игры."
        source: { kind: authored }
      - pl: "Polityczne gierki zmęczyły wyborców."
        ru: "Политические игры утомили избирателей."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "GIERKA — уменьшительное от GRA, «игра», с оттенком пренебрежения. Во множественном GIERKI — «интриги, хитрые ходы»: GIERKI POLITYCZNE. Игра на компьютере — GRA, мобильная игрушка — GIERKA." }
  - { kind: usage, text: "Девять форм, женский род. В дательном и местном K переходит в C: W GIERCE. Родительный множественного — GIEREK. Звательный GIERKO не употребляется." }
  - { kind: government, text: "Играть в игры кого — BAWIĆ SIĘ W CZYJEŚ GIERKI, винительный. Партейка во что — GIERKA W и винительный: GIERKA W KARTY." }
  - { kind: pronunciation, text: "Читается «ге́рка»: GIE — мягкое «ге». Ударение на первом слоге." }
collocations:
  - { pl: "gierka w karty", ru: "партейка в карты" }
  - { pl: "polityczne gierki", ru: "политические игры" }
  - { pl: "gierka na telefon", ru: "игра на телефоне" }
family:
  - { pl: "gra", ru: "игра", relation: root, id: gra }
  - { pl: "zabawa", ru: "забава", relation: root, id: zabawa }
  - { pl: "intryga", ru: "интрига", relation: root }
etymology: "Уменьшительное от GRA «игра» с суффиксом -KA. Русское «игра», «игрушка» — того же корня."
memory: "Gierka — партейка, игрушка; gierki — интриги. Nie bawię się w twoje gierki — я не играю в твои игры. Читается «ге́рка»."
idioms:
  - { pl: "bawić się w gierki", ru: "вести хитрую игру, интриговать" }
