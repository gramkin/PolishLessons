# review
id: zwrocic
format: 2
lemma: "zwrócić"
rank: 1405
pos: verb
aspect: perf
pron: { cyr: "звру́циць" }
senses:
  - id: return
    ru: "вернуть, возвратить"
    examples:
      - pl: "Musisz zwrócić tę książkę."
        ru: "Ты должен вернуть эту книгу."
        source: { kind: translated, id: 928176 }
      - pl: "Zwróciłem książki do biblioteki."
        ru: "Я вернул книги в библиотеку."
        source: { kind: translated, id: 705305 }
  - id: attention
    ru: "zwrócić uwagę — обратить внимание; сделать замечание"
    examples:
      - pl: "Zwróć uwagę!"
        ru: "Обрати внимание!"
        source: { kind: translated, id: 5944596 }
      - pl: "Co mam zrobić, żebyś zwrócił na mnie uwagę?"
        ru: "Что мне сделать, чтобы ты обратил на меня внимание?"
        source: { kind: tatoeba, id: 3786703 }
      - pl: "Nie zwrócił uwagi na moją radę."
        ru: "Он не обратил внимания на мой совет."
        source: { kind: translated, id: 547167 }
  - id: address
    ru: "zwrócić się — обратиться к кому-либо"
    examples:
      - pl: "Miękkim tonem zwrócił się do publiczności."
        ru: "Он обратился к публике мягким тоном."
        source: { kind: tatoeba, id: 3877999 }
      - pl: "Nie wiem, do kogo się zwrócić."
        ru: "Я не знаю, к кому обратиться."
        source: { kind: translated, id: 363132 }
notes:
  - { kind: usage, text: "Совершенный вид к zwracać." }
  - { kind: government, text: "zwrócić coś komuś — вернуть что-то кому-то: винительный вещи, дательный лица." }
  - { kind: false-friend, text: "Падеж меняет смысл целиком: zwrócić uwagę NA coś — «обратить внимание на что-то», но zwrócić uwagę KOMUŚ — «сделать кому-то замечание». Zwróciła uwagę dzieciom значит «Она сделала детям замечание», а не «обратила внимание на детей»." }
  - { kind: usage, text: "zwrócić się do kogoś — «обратиться к кому-то»: Zwróciłem się do niego o poradę «Я обратился к нему за советом»." }
collocations:
  - { pl: "zwrócić uwagę", ru: "обратить внимание" }
  - { pl: "zwrócić książkę", ru: "вернуть книгу" }
  - { pl: "zwrócić się do kogoś", ru: "обратиться к кому-либо" }
etymology: "Приставка z- и wrócić «вернуть» (праславянское *vortiti); русские «воротить» и «возвратить» — то же гнездо."
memory: "zwrócić — «вернуть», но чаще всего встречается в обороте zwrócić uwagę «обратить внимание». Тонкость, которую стоит запомнить: zwrócić uwagę NA coś — «обратить внимание на что-то», а zwrócić uwagę KOMUŚ — «сделать кому-то замечание»."
idioms:
  - { pl: "zwrócić uwagę", ru: "обратить внимание" }
  - { pl: "zwrócić się do kogoś", ru: "обратиться к кому-либо" }
  - { pl: "zwrócić honor", ru: "восстановить честь" }
