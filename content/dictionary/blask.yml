# review
id: blask
format: 2
lemma: "blask"
rank: 4041
pos: noun
pron: { cyr: "бласк" }
senses:
  - id: shine
    ru: "блеск, сияние, свет"
    examples:
      - pl: "Blask księżyca oświetlał drogę."
        ru: "Лунный свет освещал дорогу."
        source: { kind: authored }
      - pl: "Oślepił go blask reflektorów."
        ru: "Его ослепил свет фар."
        source: { kind: authored }
      - pl: "W jej oczach pojawił się blask."
        ru: "В её глазах появился блеск."
        source: { kind: authored }
  - id: splendour
    ru: "блеск, великолепие, слава"
    examples:
      - pl: "Miasto odzyskało dawny blask."
        ru: "Город вернул себе прежний блеск."
        source: { kind: authored }
      - pl: "Żył w blasku sławy."
        ru: "Он жил в лучах славы."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "BLASK — «блеск, сияние»: BLASK SŁOŃCA, BLASK KSIĘŻYCA, «лунный свет». Вспышка — BŁYSK, блестеть — BŁYSZCZEĆ, оба с Ł. В переносном смысле — «великолепие»: W BLASKU SŁAWY, «в лучах славы»." }
  - { kind: usage, text: "Девять форм, мужской род, неодушевлённое, без звательного. Родительный — BLASKU. Множественное редкое: BLASKI ZACHODU, «отсветы заката»." }
  - { kind: government, text: "При свете чего — W BLASKU, и родительный: W BLASKU ŚWIEC, «при свете свечей». Блеск чего — родительный: BLASK GWIAZD." }
  - { kind: pronunciation, text: "Читается «бласк», один слог. LA — твёрдое «ла»." }
collocations:
  - { pl: "blask księżyca", ru: "лунный свет" }
  - { pl: "w blasku świec", ru: "при свете свечей" }
  - { pl: "odzyskać blask", ru: "вернуть былой блеск" }
family:
  - { pl: "błysk", ru: "вспышка", relation: root }
  - { pl: "błyszczeć", ru: "блестеть", relation: root }
  - { pl: "blaski i cienie", ru: "плюсы и минусы, свет и тени", relation: derived }
etymology: "Общеславянское слово; русский «блеск» — то же самое. В польском корень разошёлся на BLASK и BŁYSK, BŁYSZCZEĆ."
memory: "Blask — блеск, сияние: blask księżyca — лунный свет. Читается «бласк». Blaski i cienie — плюсы и минусы. Błysk — вспышка."
idioms:
  - { pl: "blaski i cienie", ru: "светлые и тёмные стороны" }
