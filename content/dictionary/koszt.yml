# review
id: koszt
format: 2
lemma: "koszt"
rank: 1804
pos: noun
pron: { cyr: "кошт" }
senses:
  - id: cost
    ru: "расход, затраты, стоимость"
    examples:
      - pl: "Koszt jest większy niż zysk."
        ru: "Расход больше прибыли."
        source: { kind: translated, id: 12361623 }
      - pl: "Koszty nie grają roli."
        ru: "Расходы не играют роли."
        source: { kind: translated, id: 404443 }
      - pl: "Koszty utrzymania rosną."
        ru: "Расходы на жизнь растут."
        source: { kind: translated, id: 8760728 }
  - id: at-cost
    ru: "kosztem — ценой чего-либо; na koszt — за счёт"
    examples:
      - pl: "Uratował ją kosztem swojego własnego życia."
        ru: "Он спас её ценой своей собственной жизни."
        source: { kind: tatoeba, id: 600507 }
      - pl: "Kosztem swojego życia ocalił dziecko."
        ru: "Ценой своей жизни он спас ребёнка."
        source: { kind: translated, id: 689881 }
      - pl: "Napój na koszt firmy."
        ru: "Напиток за счёт заведения."
        source: { kind: translated, id: 701591 }
notes:
  - { kind: false-friend, text: "Самое важное: kosztem значит «ценой», а не «расходом»: uratował ją kosztem własnego życia «он спас её ценой собственной жизни»." }
  - { kind: usage, text: "na koszt firmy — «за счёт заведения»; na własny koszt — «за свой счёт»." }
  - { kind: government, text: "Расходы на что-то — koszty czegoś (родительный падеж): koszty podróży «расходы на поездку», koszty utrzymania «расходы на жизнь»." }
  - { kind: usage, text: "Во множественном числе koszty — обычное слово для «расходов»: ciąć koszty «резать расходы»." }
collocations:
  - { pl: "koszty utrzymania", ru: "расходы на жизнь" }
  - { pl: "na koszt firmy", ru: "за счёт заведения" }
  - { pl: "kosztem czegoś", ru: "ценой чего-либо" }
family:
  - { pl: "kosztować", ru: "стоить", relation: root, id: kosztowac }
  - { pl: "kosztowny", ru: "дорогостоящий", relation: root }
  - { pl: "cena", ru: "цена", relation: root, id: cena }
etymology: "Из немецкого Kosten «расходы»; русское «кошт» тоже было заимствовано, но устарело, оставшись лишь в обороте «на казённый кошт»."
memory: "koszt — «расход, затраты», во множественном koszty. Но kosztem значит «ценой»: kosztem własnego życia. А na koszt firmy — «за счёт заведения»."
idioms:
  - { pl: "kosztem czegoś", ru: "ценой чего-либо" }
  - { pl: "na koszt firmy", ru: "за счёт заведения" }
  - { pl: "koszty utrzymania", ru: "расходы на жизнь" }
