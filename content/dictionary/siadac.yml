# review
id: siadac
format: 2
lemma: "siadać"
rank: 985
pos: verb
aspect: imperf
aspectPair: usiasc
pron: { cyr: "ся́даць" }
senses:
  - id: sit-down
    ru: "садиться"
    examples:
      - pl: "Proszę siadać."
        ru: "Прошу садиться."
        source: { kind: translated, id: 362528 }
      - pl: "Możesz siadać gdzie chcesz."
        ru: "Можешь садиться где хочешь."
        source: { kind: translated, id: 927263 }
      - pl: "Na trawie nie wolno siadać."
        ru: "На траве сидеть нельзя."
        source: { kind: translated, id: 3743935 }
  - id: imperative
    ru: "Siadaj! — садись!, Proszę siadać — садитесь, пожалуйста"
    examples:
      - pl: "Nie, siadaj."
        ru: "Нет, садись."
        source: { kind: translated, id: 393097 }
      - pl: "Siadaj!"
        ru: "Садись!"
        source: { kind: translated, id: 3503075 }
      - pl: "Siadaj ze mną."
        ru: "Садись со мной."
        source: { kind: translated, id: 3495317 }
  - id: run-down
    ru: "садиться (о батарее, голосе, самолёте)"
    note: "Разговорное значение, ровно как русское «батарея садится»."
    examples:
      - pl: "Bateria mi siada."
        ru: "У меня садится батарея."
        source: { kind: authored }
      - pl: "Głos mi siada."
        ru: "У меня садится голос."
        source: { kind: authored }
      - pl: "Samolot siada na pasie."
        ru: "Самолёт садится на полосу."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Несовершенный вид; совершенный — usiąść. Siadaj! — это приглашение садиться, Usiądź! — требование сесть и результат." }
  - { kind: usage, text: "Proszę siadać — вежливое «садитесь, пожалуйста», буквально «прошу садиться». Одна из самых частых формул вежливости." }
  - { kind: government, text: "siadać DO stołu «садиться за стол», siadać NA krześle «садиться на стул», siadać PRZY oknie «садиться у окна». Предлог do с родительным, na и przy — с винительным и предложным." }
  - { kind: false-friend, text: "Не путайте siadać «садиться» (движение) с siedzieć «сидеть» (состояние). Различие ровно то же, что в русском, но корни похожи и формы легко смешать." }
collocations:
  - { pl: "proszę siadać", ru: "садитесь, пожалуйста" }
  - { pl: "siadać do stołu", ru: "садиться за стол" }
  - { pl: "siadać za kierownicą", ru: "садиться за руль" }
  - { pl: "bateria siada", ru: "батарея садится" }
family:
  - { pl: "usiąść", ru: "сесть", relation: aspect, id: usiasc }
  - { pl: "siedzieć", ru: "сидеть", relation: root, id: siedziec }
  - { pl: "posiedzenie", ru: "заседание", relation: derived }
etymology: "От того же корня, что siedzieć, праславянское *sědati. Русские «садиться» и «сидеть» устроены точно так же: одно чередование корня на двоих."
memory: "siadać — «садиться» (процесс), usiąść — «сесть» (результат). Proszę siadać «садитесь, пожалуйста» — формула вежливости. И держите пару siadać (движение) против siedzieć (состояние), как «садиться» и «сидеть»."
idioms:
