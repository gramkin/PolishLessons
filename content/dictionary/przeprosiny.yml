# review
id: przeprosiny
format: 2
lemma: "przeprosiny"
rank: 2268
pos: noun
pron: { cyr: "пшэпроси́ны" }
senses:
  - id: apology
    ru: "извинения"
    examples:
      - pl: "Przeprosiny przyjęła bez słowa."
        ru: "Извинения она приняла без слова."
        source: { kind: authored }
      - pl: "Czekam na przeprosiny od tygodnia."
        ru: "Я жду извинений неделю."
        source: { kind: authored }
  - id: public-apology
    ru: "публичные извинения"
    examples:
      - pl: "Sąd nakazał przeprosiny w gazecie."
        ru: "Суд обязал принести извинения в газете."
        source: { kind: authored }
      - pl: "Po przeprosinach sprawa ucichła."
        ru: "После извинений дело утихло."
        source: { kind: authored }
  - id: reconciliation
    ru: "примирение, сцена извинения"
    examples:
      - pl: "Przeprosiny odbyły się przy całej rodzinie."
        ru: "Примирение состоялось при всей семье."
        source: { kind: authored }
notes:
  - { kind: usage, text: "СЛОВО СУЩЕСТВУЕТ ТОЛЬКО ВО МНОЖЕСТВЕННОМ ЧИСЛЕ. Формы «przeprosina» не бывает, поэтому в таблице всего пять форм вместо десяти. Так устроен целый разряд польских слов: drzwi «дверь», spodnie «брюки», nożyczki «ножницы», urodziny «день рождения», imieniny «именины», wakacje «каникулы». Русское «извинение» спокойно имеет единственное, польское — нет." }
  - { kind: false-friend, text: "КОРЕНЬ НЕ ТОТ, КОТОРОГО ЖДЁШЬ. Русское «извинение» построено на «вине»: извинить значит снять вину. Польское przeprosiny — на глаголе prosić «ПРОСИТЬ»: przeprosić буквально «упросить, выпросить прощение». Отсюда и повседневное przepraszam «извините» — то есть «прошу прощения», хотя слова «прощение» в нём нет." }
  - { kind: pronunciation, text: "Четыре слога, ударение на предпоследнем: prze-pro-SI-ny. Группа prz звучит как «пш», si — как мягкое щи: «пшэпрощи́ны». В родительном падеже ударение смещается на второй слог: przeprosin — «пшэпро́син»." }
  - { kind: register, text: "Нейтрально, но слово весомее, чем przepraszam. Przepraszam говорят, задев кого-то в трамвае; przeprosiny — это уже поступок: złożyć przeprosiny «принести извинения», oficjalne przeprosiny. В суде встречается постоянно." }
collocations:
  - { pl: "złożyć przeprosiny", ru: "принести извинения" }
  - { pl: "oficjalne przeprosiny", ru: "официальные извинения" }
  - { pl: "czekać na przeprosiny", ru: "ждать извинений" }
family:
  - { pl: "przeprosić", ru: "извиниться", relation: root, id: przeprosic }
  - { pl: "przepraszać", ru: "извиняться", relation: aspect, id: przepraszac }
  - { pl: "prosić", ru: "просить", relation: root, id: prosic }
etymology: "От przeprosić, приставка prze- плюс prosić «просить», из праславянского *prositi — того же слова, что русское «просить». Извиниться значило упросить, выпросить прощение. Русский построил это понятие на другом корне, «вине»: «извинить». Отсюда przepraszam, przeprosiny, uprosić и prośba «просьба»."
memory: "przeprosiny — «извинения», и только во множественном: единственного у слова нет, как у drzwi и spodnie. Корень не «вина», а prosić «ПРОСИТЬ»: przepraszam буквально «упрашиваю»."
idioms:
  - { pl: "złożyć przeprosiny", ru: "принести извинения" }
  - { pl: "nie przyjąć przeprosin", ru: "не принять извинений" }
