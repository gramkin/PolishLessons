notes:
  - { kind: false-friend, text: "PIĘĆDZIESIĄT — «пятьдесят»: PIĘĆ + DZIESIĄT, «пять десятков». Строится как русское. Но косвенная форма — PIĘĆDZIESIĘCIU, с Ę: носовой гласный меняется, как в DZIESIĘĆ — DZIESIĘCIU." }
  - { kind: usage, text: "Косвенные падежи — PIĘĆDZIESIĘCIU, творительный — PIĘĆDZIESIĘCIOMA. PIĘĆDZIESIĘCIU — ещё и счёт мужчин. Собирательное PIĘĆDZIESIĘCIORO — для детей и смешанных групп. PIĘĆDZIESIĘCIO- — первая часть сложных слов: PIĘĆDZIESIĘCIOLECIE «пятидесятилетие»." }
  - { kind: government, text: "Требует родительного множественного: PIĘĆDZIESIĄT LAT, PIĘĆDZIESIĄT ZŁOTYCH. Глагол в прошедшем — средний род: MINĘŁO PIĘĆDZIESIĄT LAT." }
  - { kind: pronunciation, text: "Читается «пеньдзе́сёнт»: ĘĆ перед DZ — «энь», SIĄ — «сё» с носовым «н», конечное T звучит чётко. Ударение на предпоследнем слоге." }
  - { kind: register, text: "Нейтральное слово. PIĘĆDZIESIĄTKA — разговорное «полтинник» о возрасте или купюре: ROZMIENISZ PIĘĆDZIESIĄTKĘ? «разменяешь полтинник?»." }
