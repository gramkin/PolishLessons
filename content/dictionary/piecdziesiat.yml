etymology: "Праславянское *pętь desętъ «пять десятков», как русское «пятьдесят». Польское -DZIESIĄT — старый родительный множественного от «десять»."
memory: "Pięćdziesiąt — «пять десятков», как «пятьдесят». Косвенная форма — pięćdziesięciu, с Ę. Pięćdziesiątka — полтинник."
