# review
id: rzemieslniczo
format: 2
lemma: "rzemieślniczo"
rank: 5887
pos: adv
pron: { cyr: "жэмесьльни́чо" }
senses:
  - id: by-hand
    ru: "ремесленным способом, вручную"
    note: "в мастерской, не на фабрике"
    examples:
      - pl: "Ten chleb jest wypiekany rzemieślniczo."
        ru: "Этот хлеб выпекают ремесленным способом."
        source: { kind: authored }
      - pl: "Piwo warzone rzemieślniczo ma więcej smaku."
        ru: "У пива, сваренного по-ремесленному, больше вкуса."
        source: { kind: authored }
      - pl: "Buty zrobiono rzemieślniczo, w małym warsztacie."
        ru: "Обувь сделали вручную, в маленькой мастерской."
        source: { kind: authored }
  - id: mechanically
    ru: "ремесленнически, без вдохновения"
    note: "об искусстве, неодобрительно"
    examples:
      - pl: "Aktor zagrał poprawnie, ale tylko rzemieślniczo."
        ru: "Актёр сыграл правильно, но лишь ремесленно."
        source: { kind: authored }
      - pl: "Obraz jest namalowany rzemieślniczo, bez polotu."
        ru: "Картина написана ремесленнически, без полёта фантазии."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Наречие от RZEMIEŚLNICZY «ремесленный». О вещах — «вручную, в мастерской», в рекламе это похвала. Об искусстве — упрёк: «умело, но без души»." }
  - { kind: usage, text: "Чаще встречается само прилагательное: PIWO RZEMIEŚLNICZE «крафтовое пиво», CHLEB RZEMIEŚLNICZY «хлеб ручной выпечки»." }
  - { kind: pronunciation, text: "Читается «жэмесьльни́чо»: RZ — «ж», Ś — «сь», L перед согласным N — мягкое «ль». Ударение на NI." }
