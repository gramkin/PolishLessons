etymology: "Приставка DO- плюс STARCZAĆ, от основы, которая живёт в польском прежде всего в глаголе STARCZYĆ и WYSTARCZYĆ со значением «хватить, быть достаточным». Прямого русского соответствия у корня нет, и это стоит знать заранее: русское «доставлять» построено на «ставить», от образа поставленного на место, а польское DOSTARCZAĆ — на образе достаточности, доведения до нужной меры. Любопытно, что существительные при этом глаголе польский взял всё-таки от «ставить»: DOSTAWA и DOSTAWCA родственны DOSTAWIĆ. Получилось, что в одном смысловом поле работают два корня, и глагол с существительным оказались неродными."
memory: "Корень тот же, что в wystarczyć «хватить», и русского родственника у него нет: наше «доставлять» идёт от «ставить». Привязывать стоит к знакомому wystarczy «хватит». Любопытство на заметку: существительные dostawa «доставка» и dostawca «поставщик» идут от другого корня, от dostawić. Управление: dostarczać coś komuś совпадает с русским, но место доставки идёт через do с родительным — do domu, где русский говорит «на дом». И помнить, что dostać значит «получить», а не «достать»."
