notes:
  - { kind: false-friend, text: "Корень здесь тот же, что в WYSTARCZYĆ «хватить», и русского родственника у него нет: мы говорим «доставлять», от «ставить», то есть от совсем другого образа. Поэтому угадать слово нельзя, зато полезно связать его с уже знакомым WYSTARCZY «хватит». И есть отдельная ловушка рядом: польское DOSTAĆ значит «получить», а не «достать». DOSTAŁEM LIST переводится «я получил письмо»; русское «достать» в смысле «добыть» будет ZDOBYĆ или ZAŁATWIĆ." }
  - { kind: usage, text: "Любопытная особенность: действие этого глагола называют существительным от другого корня. От DOSTARCZAĆ правильно образуется DOSTARCZANIE, но в торговле и в быту говорят DOSTAWA «доставка» и DOSTAWCA «поставщик», а они идут от DOSTAWIĆ, то есть от «ставить». Так два разных корня поделили работу: глагол от одного, существительные от другого. Шестьдесят три формы — подпись переходного глагола несовершенного вида, с действительным причастием на -ĄCY. Видовой партнёр — DOSTARCZYĆ." }
  - { kind: government, text: "Основная схема: DOSTARCZAĆ COŚ KOMUŚ — винительный на товар и дательный на получателя, как по-русски. DOSTARCZAMY TOWAR KLIENTOM. Место доставки идёт через DO с родительным: DOSTARCZAĆ DO DOMU, DO SKLEPU, DO PORTIERNI, тогда как русский берёт «на» или «в» с винительным. Во втором значении часто появляется родительный частичный: DOSTARCZAĆ DOWODÓW, DOSTARCZAĆ ARGUMENTÓW — не DOWODY, а DOWODÓW, и эта особенность юридического языка стоит внимания." }
  - { kind: pronunciation, text: "Читается «достарча́чь», четыре слога, ударение на предпоследнем. Сочетание CZ даёт твёрдое «ч», а конечное Ć — мягкое «чь», так что в конце слова слышны два разных «ч» подряд. Буква R твёрдая и раскатистая. В формах настоящего времени звучит «достарча́м», «достарча́ш». В страдательном причастии DOSTARCZANY ударение остаётся на предпоследнем слоге: «достарча́ны»." }
  - { kind: register, text: "Слово нейтральное, с отчётливым торговым и канцелярским оттенком. Частые сочетания: DOSTARCZAĆ TOWAR, DOSTARCZAĆ PRZESYŁKI, DOSTAWA DO DOMU «доставка на дом», DARMOWA DOSTAWA «бесплатная доставка». В юридическом языке частотно DOSTARCZYĆ DOWODÓW «представить доказательства». В бытовой речи о еде скажут проще: ZAMÓWIĆ NA DOWÓZ. Прилагательное от существительного — DOSTAWCZY, как в SAMOCHÓD DOSTAWCZY «фургон, грузовичок»." }
