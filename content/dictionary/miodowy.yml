notes:
  - { kind: false-friend, text: "Прилагательное отвечает русскому «медовый» без всяких оговорок, и MIÓD это наш «мёд», слово праславянское. Ловушек две, и обе мелкие. Порядок слов: MIESIĄC MIODOWY, прилагательное после существительного, переставить нельзя. И напиток: «медовуха» по-польски MIÓD PITNY, буквально «питьевой мёд», а не какое-нибудь WINO MIODOWE." }
  - { kind: usage, text: "В таблице одиннадцать форм, но живых десять. Одиннадцатая — MIODOWI, именительный множественного для мужчин-людей, и её не употребляют: прилагательное относительное, оно описывает вкус, цвет или месяц, а не человека. Примеров к этой форме в карточке поэтому нет. Заметьте чередование в корне: MIÓD, но MIODU и MIODOWY, то есть Ó переходит в O, когда слог перестаёт быть последним." }
  - { kind: government, text: "В медовый месяц — W MIESIĄC MIODOWY, винительный, если речь о том, чтобы в него отправиться: POJECHALI W MIESIĄC MIODOWY. А «в медовом месяце» — W MIESIĄCU MIODOWYM, местный падеж. Это та же пара, что в TRAFIĆ W SEDNO против W SEDNIE: винительный при движении, местный без него. Без медового пирога — BEZ CIASTA MIODOWEGO, родительный." }
  - { kind: pronunciation, text: "Читается «мёдо́вы», три слога, ударение на предпоследнем. Сочетание MIO даёт «мё»: буква I здесь не читается отдельно, а только смягчает M. Конечная Y даёт «ы», поэтому слово кончается на «вы». В женском роде MIODOWA это «мёдо́ва», в среднем MIODOWE — «мёдо́вэ», а MIODOWĄ звучит «мёдо́вон»." }
  - { kind: register, text: "Слово нейтральное, чаще всего кухонное и бытовое. В кондитерской это CIASTO MIODOWE и PIERNIK MIODOWY, на столе — NALEWKA MIODOWA. О цвете говорят KOLOR MIODOWY и BARWA MIODOWA, особенно про дерево и про волосы. А MIESIĄC MIODOWY употребляется ровно как у нас, в том числе в переносном смысле, о недолгом согласии между кем угодно." }
