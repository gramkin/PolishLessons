etymology: "От MIÓD, слова праславянского и того же, что русский «мёд»; дальше оно родственно и английскому MEAD. Сочетание MIESIĄC MIODOWY оба языка получили одинаково, переведя по частям чужое выражение, поэтому «медовый месяц» и MIESIĄC MIODOWY совпадают до последнего слова — редкий случай, когда переводить ничего не приходится. В корне работает обычное польское чередование: MIÓD с Ó в последнем слоге, но MIODU и MIODOWY с O."
memory: "Медовый, от miod «мёд», и слово совпадает с русским полностью, включая miesiac miodowy «медовый месяц». Читается «мёдо́вы», где mio даёт «мё». Запомните чередование в корне: miod, но miodu и miodowy, то есть o с черточкой переходит в простое o, когда слог перестаёт быть последним. И «медовуха» по-польски miod pitny, «питьевой мёд»."
idioms:
  - { pl: "miesiąc miodowy", ru: "медовый месяц" }
formExamplesSkip:
  - { form: "miodowi", reason: "именительный множественного для мужчин-людей; прилагательное относительное и людей не описывает" }
