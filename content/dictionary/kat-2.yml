# review
id: kat-2
format: 2
lemma: "kat"
rank: 4433
pos: noun
pron: { cyr: "кат" }
senses:
  - id: executioner
    ru: "палач"
    examples:
      - pl: "Kat podniósł topór."
        ru: "Палач поднял топор."
        source: { kind: authored }
      - pl: "W średniowieczu kat był postacią budzącą strach."
        ru: "В Средневековье палач внушал страх."
        source: { kind: authored }
      - pl: "Skazańca prowadzono do kata."
        ru: "Осуждённого вели к палачу."
        source: { kind: authored }
  - id: tormentor
    ru: "мучитель, тиран"
    examples:
      - pl: "Ten szef to prawdziwy kat dla pracowników."
        ru: "Этот шеф — настоящий тиран для сотрудников."
        source: { kind: authored }
      - pl: "Ofiary rozpoznały swoich katów."
        ru: "Жертвы опознали своих мучителей."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "KAT — «палач», а не «кот» (KOT) и не «угол» (KĄT): на письме их различает только Ą. Русское «кат» в значении «палач» есть в южнорусских говорах и в украинском, но для русского читателя слово выглядит незнакомым." }
  - { kind: usage, text: "Мужской личный род: KACI во множественном, как CHŁOPI или STUDENCI. T чередуется с C: KACI, KACIE. Предложный и звательный — KACIE. Вариант KATU в карточку не включён." }
  - { kind: government, text: "Чей палач — родительный: KAT NARODU. Для кого — DLA с родительным: KAT DLA PODWŁADNYCH. Попасть в руки палача — WPAŚĆ W RĘCE KATA." }
  - { kind: pronunciation, text: "Читается «кат», один слог. Во множественном KACI — «ка́ци», CI — мягкое «ць». KATÓW — «ка́туф»: конечное W оглушается." }
  - { kind: register, text: "Нейтральное слово в истории; о людях — эмоционально-оценочное: KAT Z OŚWIĘCIMIA, KAT RODZINY. В книжном языке — образное: CZAS JEST KATEM." }
collocations:
  - { pl: "ręka kata", ru: "рука палача" }
  - { pl: "kat i ofiara", ru: "палач и жертва" }
  - { pl: "topór kata", ru: "топор палача" }
family:
  - { pl: "katować", ru: "истязать", relation: derived }
  - { pl: "katusze", ru: "муки, истязания", relation: derived }
  - { pl: "ofiara", ru: "жертва", relation: antonym, id: ofiara }
etymology: "Происхождение неясно. Слово известно со Средневековья в польском и чешском (KAT), отсюда же украинское «кат» — «палач». Надёжной этимологии нет."
memory: "Kat — палач: kat podniósł topór. Не kot и не kąt! Katować — истязать, katusze — муки."
idioms:
  - { pl: "jak kat", ru: "безжалостно, жестоко (букв. «как палач»)" }
  - { pl: "kat i ofiara w jednym", ru: "и палач, и жертва в одном лице" }
formExamplesSkip:
  - { form: "katu", reason: "редкий вариант; основные формы — KATOWI, KACIE" }
