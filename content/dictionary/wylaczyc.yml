  - form: "wyłączona"
    pl: "Z powodu problemów technicznych, funkcja wyszukiwania jest obecnie wyłączona."
    ru: "Из-за технических проблем поиск сейчас отключён."
    source: { kind: translated, id: 5485909 }
  - form: "wyłączona"
    pl: "Musimy napełnić wodą tyle wiader, ile się da, ponieważ woda ma być wyłączona."
    ru: "Нам нужно набрать воды в столько вёдер, сколько получится, потому что воду отключат."
    source: { kind: translated, id: 10150666 }
  - form: "wyłączone"
    pl: "Przed wyjściem proszę się upewnić, że światło jest wyłączone."
    ru: "Перед уходом убедитесь, пожалуйста, что свет выключен."
    source: { kind: translated, id: 730423 }
  - form: "wyłączone"
    pl: "Zanim wyjdziesz, upewnij się, że wszystkie światła są wyłączone."
