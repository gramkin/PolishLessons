# review
id: wylaczyc
format: 2
lemma: "wyłączyć"
rank: 1126
pos: verb
aspect: perf
pron: { cyr: "выуо́нчиць" }
senses:
  - id: turn-off
    ru: "выключить"
    examples:
      - pl: "Wyłącz radio."
        ru: "Выключи радио."
        source: { kind: translated, id: 364400 }
      - pl: "Tom wyłączył światło."
        ru: "Том выключил свет."
        source: { kind: tatoeba, id: 8108745 }
      - pl: "Nie zapomnij wyłączyć gaz."
        ru: "Не забудь выключить газ."
        source: { kind: tatoeba, id: 5416844 }
  - id: switched-off
    ru: "wyłączony — выключенный"
    examples:
      - pl: "Komputer jest wyłączony."
        ru: "Компьютер выключен."
        source: { kind: tatoeba, id: 8110522 }
      - pl: "Przed wyjściem proszę się upewnić, że światło jest wyłączone."
        ru: "Перед уходом убедитесь, пожалуйста, что свет выключен."
        source: { kind: translated, id: 730423 }
  - id: exclude
    ru: "исключить (из списка, из игры, из анализа)"
    examples:
      - pl: "Tom jest wyłączony z powodu grypy."
        ru: "Том выбыл из-за гриппа."
        source: { kind: translated, id: 4789066 }
      - pl: "Ten przypadek trzeba wyłączyć z analizy."
        ru: "Этот случай нужно исключить из анализа."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Антоним — włączyć «включить». Различаются одной приставкой: wy- «вы-» против w- «в-»." }
  - { kind: government, text: "wyłączyć coś — винительный падеж, как в русском. А «исключить из чего-то» — wyłączyć z czegoś, предлог z с родительным." }
  - { kind: usage, text: "Несовершенный вид — wyłączać. Отглагольное wyłączenie значит «выключение, отключение»." }
  - { kind: usage, text: "Родственное наречие wyłącznie значит «исключительно, только» — от того же корня łączyć «соединять»." }
collocations:
  - { pl: "wyłączyć światło", ru: "выключить свет" }
  - { pl: "wyłączyć telefon", ru: "выключить телефон" }
  - { pl: "wyłączyć z gry", ru: "исключить из игры" }
family:
  - { pl: "wyłączać", ru: "выключать (несовершенный вид)", relation: aspect }
  - { pl: "włączyć", ru: "включить", relation: antonym }
  - { pl: "wyłącznie", ru: "исключительно", relation: derived }
etymology: "Приставка wy- плюс łączyć «соединять» — буквально «разъединить». Русское «выключить» собрано от «ключа»: картинка другая, смысл тот же."
memory: "wyłączyć — «выключить», антоним włączyć «включить»: различаются одной приставкой. Второе значение — «исключить»: wyłączyć z gry, wyłączyć z analizy."
idioms:
  - { pl: "wyłączyć światło", ru: "выключить свет" }
  - { pl: "wyłączyć z gry", ru: "исключить из игры" }
formExamplesSkip:
  - { form: "wyłączywszy", reason: "книжное деепричастие прошедшего времени; в живой речи не употребляется" }
