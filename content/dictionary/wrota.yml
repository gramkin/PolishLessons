etymology: "Из праславянского *vorta, и это слово показывает одно из самых наглядных расхождений между русским и польским. Корень *ver- значил «запирать, затворять», и он же виден в русских «затвор», «ворот», «воротник», и в польском WIERZEJE, старом названии створок. Дальше сработал звуковой закон: в сочетании «согласная плюс or плюс согласная» русский развернул гласную в полногласие и получил «ворота», а польский переставил её и получил WROTA. Эта пара объясняет сразу целый ряд соответствий: GRÓD и «город», GŁOWA и «голова», KROWA и «корова», MLEKO и «молоко». Русские «врата», «глава», «млеко» — это церковнославянские формы, построенные по тому же принципу, что польские, и потому польское слово часто похоже именно на книжный русский вариант, а не на обиходный."
memory: "Только множественное число, как русские «ворота»: единственного нет. Похоже на книжное «врата», и не случайно — польский, как и церковнославянский, не дал полногласия: *vorta стало wrota, а по-русски «ворота». Тот же ряд: głowa и «голова», krowa и «корова», mleko и «молоко». Обычные ворота двора — brama, а wrota крупнее и торжественнее."
