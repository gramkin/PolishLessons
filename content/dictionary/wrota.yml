notes:
  - { kind: false-friend, text: "Русский узнает это слово сразу, но стоит знать, какое именно. WROTA соответствует русским «воротам», а по звучанию — церковнославянским «вратам», и разница между этими двумя русскими словами как раз и объясняет польскую форму. Праславянское *vorta дало в русском полногласие, «ворота», с гласной между В и Р; церковнославянский дал «врата», без неё; а польский, как и чешский, пошёл по второму пути и получил WROTA. Так что польское слово не ошибка и не книжность: это закономерная местная форма, и совпадение с торжественными «вратами» случайно по стилю, но закономерно по звуку." }
  - { kind: usage, text: "Слово существует только во множественном числе — это PLURALE TANTUM, как русские «ворота», «ножницы», «сани». Единственного числа у него нет вовсе, поэтому все пять форм карточки — множественные. Значение у него крупнее, чем у BRAMA: WROTA — это створчатые воротины амбара, крепости, шлюза, и в переносном смысле вход куда-то важный. Бытовые же ворота двора или стадиона — BRAMA, и футбольные тоже BRAMA, откуда BRAMKARZ «вратарь». Путать их не стоит: WROTA торжественнее и реже." }
  - { kind: government, text: "Поскольку слово только множественное, числительные с ним требуют собирательной формы: DWOJE WRÓT «две створки ворот», а не DWA WROTA — ровно как русское «двое ворот». Родительный множественного WRÓT показывает переход O в Ó в закрытом слоге, то же правило, что в WODA и WÓD, WĄTROBA и WĄTRÓB. Местный падеж — WE WROTACH, с предлогом WE вместо W, потому что следом идёт группа согласных: то же фонетическое правило, что в WE SZKLE и WE WTOREK." }
