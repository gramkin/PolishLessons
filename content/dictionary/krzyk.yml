etymology: "Праславянское *krikъ; русский «крик» — то же слово, rz отвечает русскому р."
memory: "krzyk — «крик», читается «кшык». Оборот ostatni krzyk mody совпадает с русским «последний крик моды». Глагол — krzyczeć."
