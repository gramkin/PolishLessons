    ru: "наступление (в обороте zajście w ciążę)"
    examples:
      - pl: "Miała problemy z zajściem w ciążę."
        ru: "У неё были проблемы с наступлением беременности."
        source: { kind: translated, id: 4658772 }
      - pl: "Zajście w ciążę bywa trudne."
        ru: "Забеременеть бывает трудно."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Два разошедшихся употребления: «происшествие, инцидент» и отглагольное zajście w ciążę «наступление беременности». Второе — обычный медицинский оборот." }
  - { kind: government, text: "Средний род: to zajście, tego zajścia." }
  - { kind: false-friend, text: "Отглагольное имя от zajść «зайти, произойти», у которого есть своя карточка. Русское «зайти» такого существительного не образует, поэтому соответствия приходится подбирать по смыслу." }
  - { kind: usage, text: "Синонимы для «происшествия»: incydent, wydarzenie. Для драки скорее bójka." }
collocations:
