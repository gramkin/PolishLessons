# review
id: tunel
format: 2
lemma: "tunel"
rank: 1802
pos: noun
pron: { cyr: "ту́нэль" }
senses:
  - id: tunnel
    ru: "туннель, тоннель"
    examples:
      - pl: "Nasz pociąg przejechał przez długi tunel."
        ru: "Наш поезд проехал через длинный туннель."
        source: { kind: tatoeba, id: 364642 }
      - pl: "Przebito tunel pod górą."
        ru: "Под горой пробили туннель."
        source: { kind: translated, id: 366800 }
      - pl: "Samochody jadą przez tunel."
        ru: "Машины едут через туннель."
        source: { kind: translated, id: 2256070 }
  - id: in-tunnel
    ru: "туннель (въехать, исчезнуть, свет в конце)"
    examples:
      - pl: "Zobaczyłem światło na końcu tunelu."
        ru: "Я увидел свет в конце туннеля."
        source: { kind: translated, id: 3806066 }
      - pl: "Tom zniknął w tunelu."
        ru: "Том исчез в туннеле."
        source: { kind: translated, id: 3717949 }
      - pl: "Wejdź do tunelu."
        ru: "Войди в туннель."
        source: { kind: translated, id: 12427368 }
notes:
  - { kind: usage, text: "światło na końcu tunelu — «свет в конце туннеля», выражение совпадает с русским целиком." }
  - { kind: government, text: "Через туннель — przez tunel (винительный падеж); в туннеле — w tunelu (предложный)." }
  - { kind: false-friend, text: "По-русски пишут и «туннель», и «тоннель»; по-польски единственное написание — tunel, с одним n." }
  - { kind: usage, text: "Слово мужского рода: ten tunel, długi tunel." }
collocations:
  - { pl: "przez tunel", ru: "через туннель" }
  - { pl: "w tunelu", ru: "в туннеле" }
  - { pl: "światło na końcu tunelu", ru: "свет в конце туннеля" }
family:
  - { pl: "tunelowy", ru: "туннельный", relation: root }
  - { pl: "most", ru: "мост", relation: root, id: most }
etymology: "Из английского tunnel через французский; русское «туннель» пришло тем же путём. По-польски пишется с одним n."
memory: "tunel — «туннель»: przez tunel «через туннель», w tunelu «в туннеле». Пишется с одним n, в отличие от русского «туннель»."
idioms:
  - { pl: "światło na końcu tunelu", ru: "свет в конце туннеля" }
  - { pl: "przez tunel", ru: "через туннель" }
  - { pl: "w tunelu", ru: "в туннеле" }
formExamplesSkip:
