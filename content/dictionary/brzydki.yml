# review
id: brzydki
format: 2
lemma: "brzydki"
rank: 2444
pos: adj
pron: { cyr: "бжы́дкі" }
senses:
  - id: ugly
    ru: "некрасивый, безобразный"
    examples:
      - pl: "Ten budynek jest naprawdę brzydki."
        ru: "Это здание правда некрасивое."
        source: { kind: authored }
      - pl: "Brzydkie kaczątko stało się łabędziem."
        ru: "Гадкий утёнок стал лебедем."
        source: { kind: authored }
  - id: bad-weather
    ru: "скверный, плохой (о погоде)"
    examples:
      - pl: "Pogoda jest dziś brzydka."
        ru: "Погода сегодня скверная."
        source: { kind: authored }
      - pl: "Brzydkiej pogody nie znoszę."
        ru: "Скверную погоду я не выношу."
        source: { kind: authored }
  - id: nasty
    ru: "нехороший, дурной (о словах, поступках)"
    examples:
      - pl: "Brzydkie słowa padły z obu stron."
        ru: "Нехорошие слова прозвучали с обеих сторон."
        source: { kind: authored }
notes:
  - { kind: usage, text: "СРАВНИТЕЛЬНАЯ СТЕПЕНЬ ВЫБРАСЫВАЕТ -K-. Brzydki даёт BRZYDSZY, а не brzydkiejszy. Так же ведут себя все прилагательные на -ki, -oki, -eki: bliski → bliższy, wysoki → wyższy, daleki → dalszy. Суффикс просто исчезает перед -szy, и это надо запомнить списком." }
  - { kind: pronunciation, text: "Два слога, ударение на первом: BRZYD-ki. Rz после b звучит как ж, y как русское ы: «бжы́дкі». Мужско-личные формы смягчаются по-разному: brzydcy звучит «бжы́дцы», а brzydsi — «бжы́дщі»." }
  - { kind: false-friend, text: "Польское brzydki о погоде значит «скверный, плохой», как русское «скверная погода», а не «некрасивая». И не путай с глаголом: BRZYDZIĆ SIĘ czymś значит «гнушаться чем-то», с творительным падежом. Русское «брезгливый» ему близко по смыслу, но brzydki само по себе про внешность, а не про отвращение." }
collocations:
  - { pl: "brzydkie kaczątko", ru: "гадкий утёнок" }
  - { pl: "brzydka pogoda", ru: "скверная погода" }
  - { pl: "brzydkie słowo", ru: "нехорошее слово" }
family:
  - { pl: "brzydzić się", ru: "гнушаться", relation: derived }
  - { pl: "obrzydliwy", ru: "отвратительный", relation: derived }
  - { pl: "ładny", ru: "красивый", relation: antonym, id: ladny }
etymology: "Из праславянского *bridъkъ «острый, едкий, горький». Тот же корень дал украинское «бридкий» «отвратительный» и русское диалектное «бридкий». Литературный русский предпочёл «безобразный» и «уродливый», так что совпадения на слух нет, хотя слово общее."
memory: "brzydki — «некрасивый», а о погоде «скверный». Главное правило: сравнительная выбрасывает -k-, выходит BRZYDSZY, как bliski → bliższy и wysoki → wyższy."
