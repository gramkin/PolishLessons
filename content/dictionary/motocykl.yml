notes:
  - { kind: false-friend, text: "MOTOCYKL — «мотоцикл», но с Y: «мото́цыкль». В разговоре его часто называют просто MOTOR. Мотороллер — SKUTER, мотоциклист — MOTOCYKLISTA." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое, но родительный на -A: MOTOCYKLA. Во множественном — MOTOCYKLE, в родительном — MOTOCYKLI." }
  - { kind: government, text: "Ехать на мотоцикле — JECHAĆ MOTOCYKLEM, творительный без предлога, или NA MOTOCYKLU, местный. Сесть на мотоцикл — WSIĄŚĆ NA MOTOCYKL, винительный." }
  - { kind: pronunciation, text: "Читается «мото́цыкль», ударение на предпоследнем слоге: CYKL — один слог. Y — «ы»." }
collocations:
  - { pl: "jeździć motocyklem", ru: "ездить на мотоцикле" }
  - { pl: "kask na motocykl", ru: "мотошлем" }
  - { pl: "zlot motocykli", ru: "слёт мотоциклистов" }
family:
  - { pl: "motor", ru: "мотоцикл (разг.); мотор", relation: root, id: motor }
  - { pl: "motocyklista", ru: "мотоциклист", relation: derived }
  - { pl: "motocyklowy", ru: "мотоциклетный", relation: derived }
etymology: "Сложение MOTO- «мотор» и CYKL «круг, колесо», из греческого слова «круг». Русское «мотоцикл» — то же слово, но польский пишет и произносит Y."
memory: "Motocykl — мотоцикл, читается «мото́цыкль»; в разговоре motor. Jechać motocyklem — ехать на мотоцикле. Skuter — мотороллер."
idioms:
