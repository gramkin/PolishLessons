# review
id: zanim
format: 2
lemma: "zanim"
rank: 258
pos: conj
pron: { cyr: "за́ним" }
senses:
  - id: before
    ru: "прежде чем, до того как"
    note: "После zanim идёт личная форма глагола, а не инфинитив."
    examples:
      - pl: "Zanim wejdziesz, zapukaj."
        ru: "Прежде чем войти, постучитесь."
        source: { kind: tatoeba, id: 2809353 }
      - pl: "Gdzie byłeś zanim tu przyszedłeś?"
        ru: "Где ты был до того, как пришёл сюда?"
        source: { kind: tatoeba, id: 6689540 }
      - pl: "Trzeba zawsze myśleć zanim się coś powie."
        ru: "Всегда следует думать, прежде чем говорить."
        source: { kind: tatoeba, id: 3660723 }
  - id: advice
    ru: "прежде чем (в советах и просьбах)"
    examples:
      - pl: "Zastanówcie się dobrze, zanim odpowiecie."
        ru: "Подумайте хорошенько, прежде чем ответить."
        source: { kind: tatoeba, id: 12624914 }
      - pl: "Byłem w Pjongjangu, zanim powstała Korea Północna."
        ru: "Я был в Пхеньяне до того, как возникла Северная Корея."
        source: { kind: tatoeba, id: 4730678 }
      - pl: "Niech pan dobrze się zastanowi, zanim pan odpowie."
        ru: "Подумайте хорошенько, прежде чем ответить."
        source: { kind: tatoeba, id: 12624916 }
notes:
  - { kind: usage, text: "Главное отличие от русского: zanim требует личной формы глагола. Zanim wejdziesz, zapukaj — буквально «прежде чем войдёшь, постучи», тогда как по-русски говорят «прежде чем войти»." }
  - { kind: usage, text: "Книжный синоним — nim: Nim się obejrzysz, będzie wiosna." }
  - { kind: usage, text: "Порядок свободный: придаточное с zanim может стоять и в начале, и в конце: Zapukaj, zanim wejdziesz." }
collocations:
  - { pl: "zanim wejdziesz", ru: "прежде чем войдёшь" }
  - { pl: "zanim będzie za późno", ru: "пока не поздно" }
  - { pl: "zanim się obejrzysz", ru: "не успеешь оглянуться" }
  - { pl: "pomyśl, zanim powiesz", ru: "подумай, прежде чем скажешь" }
etymology: "Из za + nim, творительного падежа местоимения on — буквально «за тем, как»."
memory: "zanim требует личной формы глагола, а не инфинитива: Zanim wejdziesz, zapukaj — «прежде чем войдёшь, постучи». По-русски мы сказали бы «прежде чем войти»."
