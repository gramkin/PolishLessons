# review
id: poprzysiegnac
format: 2
lemma: "poprzysięgnąć"
rank: 5670
pos: verb
aspect: perf
pron: { cyr: "попшысе́нгнонць" }
senses:
  - id: vow
    ru: "поклясться, дать зарок"
    examples:
      - pl: "Poprzysiągłem sobie nigdy już się do niej nie odzywać."
        ru: "Пообещал себе, что никогда не буду с ней разговаривать."
        source: { kind: tatoeba, id: 348640 }
      - pl: "Poprzysięgła nigdy więcej się do mnie nie odezwać."
        ru: "Она поклялась больше никогда со мной не заговаривать."
        source: { kind: translated, id: 977226 }
      - pl: "Tom poprzysiągł kiedyś się zemścić."
        ru: "Том когда-то поклялся отомстить."
        source: { kind: translated, id: 10999949 }
  - id: swear-revenge
    ru: "поклясться (отомстить, не делать чего-л.)"
    examples:
      - pl: "Poprzysięgli sobie wierność."
        ru: "Они поклялись друг другу в верности."
        source: { kind: authored }
      - pl: "Poprzysiągł, że nigdy nie wróci."
        ru: "Он поклялся, что никогда не вернётся."
        source: { kind: authored }
notes:
  - { kind: government, text: "Часто с sobie: poprzysiąc sobie, że… «дать себе зарок, что…». Поклясться отомстить — poprzysiąc zemstę, винительный падеж." }
  - { kind: false-friend, text: "po- + przysięgać «клясться», которое уже есть в словаре; корень sięgać «доставать, простираться». Русская «присяга» — прямая родня." }
  - { kind: usage, text: "Оттенок торжественный и книжный: это клятва себе или кому-то, а не обычное обещание. Обещать — obiecać." }
  - { kind: usage, text: "Формы двоятся: встречается и poprzysięgnąć, и poprzysiąc. Существительное — przysięga «присяга, клятва»." }
collocations:
  - { pl: "poprzysiąc zemstę", ru: "поклясться отомстить" }
  - { pl: "poprzysiąc sobie", ru: "дать себе зарок" }
etymology: "po- + przysięgać «клясться», корень sięgać; русская «присяга» — прямая родня."
memory: "poprzysiąc — торжественно «поклясться», часто себе: poprzysiąc sobie, że… Обычное «обещать» — obiecać. Существительное — przysięga."
idioms:
  - { pl: "poprzysiąc zemstę", ru: "поклясться отомстить" }
formExamplesSkip:
  - { form: "poprzysięgnięci", reason: "страдательное причастие мужского лица, а клятвой скрепляют молчание, месть, верность или союз: poprzysięgnąć wierność. Человека не клянут в этом смысле, поэтому формы нет" }
