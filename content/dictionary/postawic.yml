# review
id: postawic
format: 2
lemma: "postawić"
rank: 1072
pos: verb
aspect: perf
pron: { cyr: "поста́виць" }
senses:
  - id: put
    ru: "поставить (поместить)"
    examples:
      - pl: "Postawił pudełko na stole."
        ru: "Он поставил коробку на стол."
        source: { kind: translated, id: 732897 }
      - pl: "Postawiła talerz na stole."
        ru: "Она поставила тарелку на стол."
        source: { kind: translated, id: 751811 }
      - pl: "Postaw to gdzie chcesz."
        ru: "Поставь это где хочешь."
        source: { kind: translated, id: 484602 }
  - id: build
    ru: "построить, возвести"
    examples:
      - pl: "Postawili nowy dom przy lesie."
        ru: "Они построили новый дом у леса."
        source: { kind: authored }
      - pl: "Pomnik został postawiony w zeszłym roku."
        ru: "Памятник был поставлен в прошлом году."
        source: { kind: authored }
  - id: treat
    ru: "postawić komuś coś — угостить кого-то"
    examples:
      - pl: "Ja ci postawię."
        ru: "Я тебя угощу."
        source: { kind: translated, id: 569886 }
      - pl: "Postawił nam kilka drinków."
        ru: "Он угостил нас несколькими напитками."
        source: { kind: translated, id: 1920869 }
  - id: bet
    ru: "поставить (на кого-то, деньги); поставить вопрос"
    examples:
      - pl: "Postawiłem pięć funtów na tego konia."
        ru: "Я поставил пять фунтов на эту лошадь."
        source: { kind: translated, id: 511571 }
      - pl: "Postawię moje pytanie w inny sposób."
        ru: "Я поставлю свой вопрос иначе."
        source: { kind: translated, id: 10202689 }
notes:
  - { kind: government, text: "Падеж после na меняет смысл: postawić coś na stole «поставить что-то на столе» — предложный, а postawić na kogoś «сделать ставку на кого-то» — винительный." }
  - { kind: usage, text: "Совершенный вид к stawiać «ставить». Не путайте с парой stawać/stanąć «становиться, вставать» — это другой глагол." }
  - { kind: usage, text: "postawić komuś drinka, obiad, kawę значит «угостить кого-то»: Ja ci postawię «Я тебя угощу». У русского «поставить» такого значения нет." }
  - { kind: usage, text: "postawić się komuś значит «дать кому-то отпор»: Postaw się szefowi «Дай отпор начальнику»." }
collocations:
  - { pl: "postawić pytanie", ru: "поставить вопрос" }
  - { pl: "postawić na kogoś", ru: "сделать ставку на кого-то" }
  - { pl: "postawić komuś drinka", ru: "угостить кого-то" }
  - { pl: "postawić się komuś", ru: "дать отпор" }
family:
  - { pl: "stawiać", ru: "ставить (несовершенный вид)", relation: aspect }
  - { pl: "postawa", ru: "поза, позиция, отношение", relation: derived }
  - { pl: "stawka", ru: "ставка", relation: derived }
etymology: "Приставка po- плюс stawić, того же корня, что stać «стоять». Русское «поставить» собрано ровно так же, от «стоять»."
memory: "postawić — «поставить», совершенный вид к stawiać (не к stawać, это другой глагол). Следите за падежом после na: postawić coś na stole — предложный, но postawić na kogoś «сделать ставку» — винительный. И postawić komuś drinka значит «угостить»."
idioms:
  - { pl: "postawić kropkę nad i", ru: "поставить точку над i" }
  - { pl: "postawić wszystko na jedną kartę", ru: "поставить всё на одну карту" }
  - { pl: "postawić na nogi", ru: "поставить на ноги" }
