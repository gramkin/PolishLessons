# review
id: wesoly
format: 2
lemma: "wesoły"
rank: 1612
pos: adj
pron: { cyr: "вэсо́уы" }
senses:
  - id: cheerful
    ru: "весёлый, жизнерадостный"
    examples:
      - pl: "Ona jest zawsze wesoła."
        ru: "Она всегда весёлая."
        source: { kind: tatoeba, id: 8916606 }
      - pl: "On jest zawsze wesoły."
        ru: "Он всегда весёлый."
        source: { kind: tatoeba, id: 6477411 }
      - pl: "Dziś był wesoły."
        ru: "Сегодня он был весёлый."
        source: { kind: translated, id: 600052 }
  - id: greetings
    ru: "весёлый (в поздравлениях): Wesołych Świąt"
    examples:
      - pl: "Wesołych Świąt!"
        ru: "С праздником!"
        source: { kind: translated, id: 526592 }
      - pl: "Wesołego Dnia Kobiet!"
        ru: "С Восьмым марта!"
        source: { kind: tatoeba, id: 4960470 }
      - pl: "Wesołych świąt i szczęśliwego Nowego Roku!"
        ru: "Весёлого Рождества и счастливого Нового года!"
        source: { kind: translated, id: 2679998 }
notes:
  - { kind: usage, text: "Wesół — краткая форма прилагательного, она только предикативная: bądź wesół «будь весел». В польском таких кратких форм осталась горстка: zdrów, gotów, pełen, wart, ciekaw, świadom. Русскому здесь легко: это в точности «весел, здоров, готов», и употребляются они так же — только в сказуемом, не перед существительным." }
  - { kind: usage, text: "Wesołych Świąt! — главная праздничная формула, «С праздником!», на Рождество и Пасху. Родительный падеж здесь от пожелания: życzę wesołych świąt." }
  - { kind: usage, text: "wesołe miasteczko — «парк аттракционов», буквально «весёлый городок»." }
  - { kind: false-friend, text: "Слово то же, что русское «весёлый», только польское we- на месте русского «ве-»." }
  - { kind: usage, text: "Противоположность — smutny «грустный»; близкое по смыслу szczęśliwy значит «счастливый», а не «весёлый»." }
collocations:
  - { pl: "Wesołych Świąt", ru: "с праздником" }
  - { pl: "wesołe miasteczko", ru: "парк аттракционов" }
  - { pl: "wesoły człowiek", ru: "весёлый человек" }
family:
  - { pl: "wesoło", ru: "весело", relation: root }
  - { pl: "wesele", ru: "свадьба", relation: root }
  - { pl: "smutny", ru: "грустный", relation: root, id: smutny }
etymology: "Праславянское *veselъ — то же слово, что русское «весёлый». Отсюда же wesele «свадьба», то есть «веселье»."
memory: "wesoły — «весёлый». Главная формула — Wesołych Świąt! «С праздником!». А wesołe miasteczko — это «парк аттракционов»."
idioms:
  - { pl: "Wesołych Świąt", ru: "с праздником" }
  - { pl: "wesołe miasteczko", ru: "парк аттракционов" }
  - { pl: "wesoły jak szczygieł", ru: "весёлый как птичка" }
