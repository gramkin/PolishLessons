notes:
  - { kind: usage, text: "Wesołych Świąt! — главная праздничная формула, «С праздником!», на Рождество и Пасху. Родительный падеж здесь от пожелания: życzę wesołych świąt." }
  - { kind: usage, text: "wesołe miasteczko — «парк аттракционов», буквально «весёлый городок»." }
  - { kind: false-friend, text: "Слово то же, что русское «весёлый», только польское we- на месте русского «ве-»." }
  - { kind: usage, text: "Противоположность — smutny «грустный»; близкое по смыслу szczęśliwy значит «счастливый», а не «весёлый»." }
collocations:
