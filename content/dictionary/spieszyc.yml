# review
id: spieszyc
format: 2
lemma: "śpieszyć"
rank: 2387
pos: verb
aspect: imperf
pron: { cyr: "сьпе́шыць" }
senses:
  - id: hurry
    ru: "спешить, торопиться (śpieszyć się)"
    examples:
      - pl: "Wszyscy się śpieszą."
        ru: "Все спешат."
        source: { kind: tatoeba, id: 13229774 }
      - pl: "Tom się śpieszy."
        ru: "Том спешит."
        source: { kind: translated, id: 8761348 }
      - pl: "Śpieszysz się?"
        ru: "Ты спешишь?"
        source: { kind: translated, id: 1353375 }
  - id: no-hurry
    ru: "не спешить (с отрицанием)"
    examples:
      - pl: "Śpiesz się powoli."
        ru: "Торопись медленно."
        source: { kind: tatoeba, id: 5510999 }
      - pl: "Nie widzę powodu, żeby się śpieszyć."
        ru: "Я не вижу причины спешить."
        source: { kind: translated, id: 7164590 }
notes:
  - { kind: government, text: "Почти всегда с się. Безличная конструкция ставит лицо в ДАТЕЛЬНЫЙ падеж: śpieszy mi się «я спешу», nikomu się nie śpieszy «никто не спешит». Это не то же, что ja się śpieszę, хотя переводится одинаково." }
  - { kind: usage, text: "Поговорка Śpiesz się powoli «Торопись медленно» — польский вариант латинского festina lente." }
  - { kind: false-friend, text: "Пишется через ś: śpieszyć. Вариант spieszyć без диакритики тоже встречается и считается допустимым, отсюда и ASCII-идентификатор карточки." }
  - { kind: usage, text: "Совершенный вид — pośpieszyć się. Родственное pośpiech «спешка», прилагательное pośpieszny «скорый» (pociąg pośpieszny «скорый поезд»)." }
  - { kind: government, text: "Глагол идёт с się и не имеет прямого дополнения, поэтому страдательных причастий у него нет: формы вида śpieszony образованы генератором по ошибке." }
collocations:
  - { pl: "śpieszyć się", ru: "спешить" }
  - { pl: "śpieszy mi się", ru: "я спешу" }
  - { pl: "śpiesz się powoli", ru: "торопись медленно" }
etymology: "Праславянское *spěšiti, от *spěti «спеть, успевать»; русское «спешить» — то же слово."
memory: "śpieszyć się — «спешить». Запомните безличное śpieszy mi się «я спешу», с ДАТЕЛЬНЫМ падежом лица. И поговорку Śpiesz się powoli «Торопись медленно»."
idioms:
  - { pl: "śpieszy mi się", ru: "я спешу" }
  - { pl: "śpiesz się powoli", ru: "торопись медленно" }
