# review
id: pomylic
format: 2
lemma: "pomylić"
rank: 2032
pos: verb
pron: { cyr: "помы́лиць" }
senses:
  - id: mix-up
    ru: "перепутать (одно с другим)"
    examples:
      - pl: "Pomylił adresy i list poszedł nie tam."
        ru: "Он перепутал адреса, и письмо ушло не туда."
        source: { kind: authored }
      - pl: "Pomyliła sól z cukrem."
        ru: "Она перепутала соль с сахаром."
        source: { kind: authored }
      - pl: "Pomylono nazwiska w protokole."
        ru: "В протоколе перепутали фамилии."
        source: { kind: authored }
  - id: be-wrong
    ru: "pomylić się — ошибиться"
    examples:
      - pl: "Pomyliłem się w rachunkach."
        ru: "Я ошибся в расчётах."
        source: { kind: authored }
      - pl: "Każdy może się pomylić."
        ru: "Каждый может ошибиться."
        source: { kind: authored }
  - id: crazy
    ru: "разг. pomylony — чокнутый, спятивший"
    examples:
      - pl: "Ten pomylony sąsiad znowu hałasuje."
        ru: "Этот чокнутый сосед опять шумит."
        source: { kind: authored }
      - pl: "Masz pomylone pomysły."
        ru: "У тебя взбалмошные идеи."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ЗДЕСЬ РУССКОЙ ОПОРЫ НЕТ. Корень mylić с русским «мылить» не связан — созвучие случайное, и слово приходится запомнить напрямую. Зато гнездо прозрачно и всё пригодится: pomyłka «ошибка», mylny «ошибочный», omyłkowo «по ошибке». Pomyłka! в телефонной трубке значит «вы не туда попали»." }
  - { kind: government, text: "Путают ЧТО С ЧЕМ — z с ТВОРИТЕЛЬНЫМ, в точности как по-русски: pomylić sól z cukrem, pomylić kogoś z kimś innym. Возвратное pomylić się работает само: pomyliłem się, pomylił się w rachunkach. Расхождений нет ни в одной модели." }
  - { kind: register, text: "Причастие pomylony пошло своей дорогой и в разговоре значит «ЧОКНУТЫЙ»: pomylony facet — «чокнутый тип», masz pomylone pomysły — «у тебя взбалмошные затеи». Ту же судьбу прошло postrzelony. В прямом смысле pomylony значит просто «перепутанный»: pomylone kartki." }
  - { kind: usage, text: "Вид совершенный, несовершенная пара — mylić. Страдательное причастие по правилу для -ić: pomylony, pomyleni, как zatrudniony. Безличное pomylono обычно в канцелярской речи: pomylono nazwiska, pomylono daty." }
collocations:
  - { pl: "pomylić się w rachunkach", ru: "ошибиться в расчётах" }
  - { pl: "pomylić kogoś z kimś", ru: "перепутать кого-л. с кем-л." }
  - { pl: "pomyłka telefoniczna", ru: "ошибка номером" }
family:
  - { pl: "mylić", ru: "путать", relation: aspect, id: mylic }
  - { pl: "pomyłka", ru: "ошибка", relation: derived, id: pomylka }
  - { pl: "mylny", ru: "ошибочный", relation: derived }
etymology: "Приставка po- плюс mylić, от праславянского корня со значением «ошибочный, обманчивый». Русского потомка этот корень не оставил — там, где поляк говорит mylić się, русский берёт «ошибаться», слово другого происхождения. Зато внутри польского гнездо широкое: pomyłka, mylny, omyłka, zmylić «сбить с толку»."
memory: "pomylić — «перепутать», pomylić się — «ошибиться». Русского родственника у корня нет, запоминайте напрямую, но управление родное: pomylić coś Z czymś, творительный. И помните разговорное pomylony — «чокнутый»."
idioms:
  - { pl: "każdy może się pomylić", ru: "каждый может ошибиться" }
  - { pl: "pomyłka!", ru: "вы не туда попали!" }
