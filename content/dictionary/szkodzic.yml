formExamples:
  - form: "szkodzą"
    pl: "Niektóre leki nam szkodzą."
    ru: "Некоторые лекарства нам вредят."
    source: { kind: translated, id: 13391342 }
  - form: "szkodzą"
    pl: "Lubię mięso, ale jajka mi szkodzą."
    ru: "Я люблю мясо, но яйца мне вредят."
    source: { kind: translated, id: 924479 }
  - form: "szkodzą"
    pl: "Są takie lekarstwa, które nie tylko, że nie pomagają, ale wręcz szkodzą."
    ru: "Есть такие лекарства, которые не только не помогают, но прямо вредят."
    source: { kind: translated, id: 714922 }
  - form: "szkodzi"
    pl: "Nie szkodzi"
    ru: "Ничего страшного."
    source: { kind: translated, id: 5890536 }
  - form: "szkodzi"
    pl: "Palenie szkodzi zdrowiu."
    ru: "Курить вредно для здоровья."
    source: { kind: tatoeba, id: 598422 }
  - form: "szkodzi"
    pl: "Picie szkodzi zdrowiu."
    ru: "Питьё вредит здоровью."
    source: { kind: translated, id: 3127745 }
  - form: "szkodzić"
    pl: "Przede wszystkim - nie szkodzić."
    ru: "Прежде всего — не навредить."
    source: { kind: translated, id: 730523 }
  - form: "szkodzić"
    pl: "Tego typu pisma mogą szkodzić młodym ludziom."
    ru: "Такого рода издания могут вредить молодым людям."
    source: { kind: translated, id: 927260 }
  - form: "szkodzić"
    pl: "Nie chcę nikomu szkodzić."
    ru: "Я не хочу никому вредить."
    source: { kind: authored }
