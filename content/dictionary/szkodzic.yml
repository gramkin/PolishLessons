# review
id: szkodzic
format: 2
lemma: "szkodzić"
rank: 1655
pos: verb
aspect: imperf
pron: { cyr: "шко́дзиць" }
senses:
  - id: harm
    ru: "вредить"
    examples:
      - pl: "Palenie szkodzi zdrowiu."
        ru: "Курить вредно для здоровья."
        source: { kind: tatoeba, id: 598422 }
      - pl: "Palenie ci szkodzi."
        ru: "Курение тебе вредит."
        source: { kind: translated, id: 355501 }
      - pl: "Picie szkodzi zdrowiu."
        ru: "Питьё вредит здоровью."
        source: { kind: translated, id: 3127745 }
  - id: never-mind
    ru: "nie szkodzi — ничего страшного"
    examples:
      - pl: "Nie szkodzi"
        ru: "Ничего страшного."
        source: { kind: translated, id: 5890536 }
      - pl: "Nic nie szkodzi."
        ru: "Ничего страшного."
        source: { kind: translated, id: 623667 }
      - pl: "To szkodzi interesom."
        ru: "Это вредит делу."
        source: { kind: translated, id: 8610196 }
notes:
  - { kind: government, text: "Требует дательного падежа: palenie szkodzi zdrowiu «курение вредит здоровью», to mi szkodzi «это мне вредит». В русском тоже дательный — совпадает." }
  - { kind: usage, text: "Nie szkodzi! — вежливое «Ничего страшного!, Не беда!», ответ на извинение. Это самое частое употребление слова." }
  - { kind: usage, text: "Совершенный вид — zaszkodzić. Существительное szkoda значит «вред, ущерб», и оно же — «жаль»." }
  - { kind: usage, text: "На сигаретных пачках стоит Palenie szkodzi zdrowiu — «Курение вредит здоровью»." }
collocations:
  - { pl: "nie szkodzi", ru: "ничего страшного" }
  - { pl: "szkodzić zdrowiu", ru: "вредить здоровью" }
  - { pl: "palenie szkodzi", ru: "курение вредит" }
etymology: "От szkoda «вред, ущерб», заимствованного из германского (ср. немецкое Schaden). Русское «вредить» — от «вред», другой корень, но управление дательным падежом совпадает."
memory: "szkodzić = «вредить», дательный падеж: szkodzi zdrowiu «вредит здоровью». Но чаще всего вы услышите Nie szkodzi! — «Ничего страшного!». Совершенный вид — zaszkodzić."
idioms:
  - { pl: "nie szkodzi", ru: "ничего страшного" }
  - { pl: "szkodzić zdrowiu", ru: "вредить здоровью" }
  - { pl: "palenie szkodzi zdrowiu", ru: "курение вредит здоровью" }
