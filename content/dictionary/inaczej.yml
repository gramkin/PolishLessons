id: inaczej
format: 2
lemma: "inaczej"
rank: 481
pos: conj
pron: { cyr: "ина́чей" }
senses:
  - id: differently
    ru: "иначе, по-другому"
    examples:
      - pl: "Można to powiedzieć inaczej?"
        ru: "Можно сформулировать это по-другому?"
        source: { kind: tatoeba, id: 351396 }
      - pl: "Na twoim miejscu postąpiłbym inaczej."
        ru: "На твоём месте я бы поступил по-другому."
        source: { kind: tatoeba, id: 897799 }
      - pl: "Z wiekiem zacząłem inaczej patrzeć na różne sprawy."
        ru: "Я стал старше, поэтому я стал смотреть на вещи по-другому."
        source: { kind: tatoeba, id: 351536 }
  - id: otherwise
    ru: "иначе, а то (союз)"
    examples:
      - pl: "Zetnij to uschnięte drzewo, bo inaczej spadnie ci na dom."
        ru: "Повали это мёртвое дерево, иначе оно упадёт на твой дом."
        source: { kind: tatoeba, id: 933248 }
      - pl: "Pospiesz się, inaczej się spóźnimy."
        ru: "Поторопись, иначе мы опоздаем."
        source: { kind: authored }
      - pl: "Teraz jest bardzo niewiele lip w lasach, kiedyś było inaczej."
        ru: "Сейчас в лесах очень немного лип, когда-то было иначе."
        source: { kind: tatoeba, id: 3745134 }
notes:
  - { kind: usage, text: "Два употребления в одном слове: наречие «по-другому» (postąpiłbym inaczej) и союз «иначе, а то» (Pospiesz się, inaczej się spóźnimy)." }
  - { kind: usage, text: "inaczej mówiąc — «иначе говоря»; tak czy inaczej — «так или иначе»." }
  - { kind: usage, text: "Это сравнительная степень от inny «иной»: буквально «более по-другому»." }
  - { kind: usage, text: "Русское «иначе» — то же самое слово и тот же корень «иной», так что запоминать почти нечего." }
collocations:
