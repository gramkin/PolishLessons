etymology: "От DAMA «дама», из французского dame, а то от латинского domina «госпожа». В польском слово DAMA сохранило старый благородный оттенок, а прилагательное DAMSKI стало будничным и торговым. Русское «дамский» пошло в обратную сторону: осталось изящным и немного старомодным."
memory: "Damski — женский (для женщин): toaleta damska, buty damskie, fryzjer damski. Женственный — kobiecy. Противоположность — męski. Читается «да́мски»."
idioms:
  - { pl: "sprawy damsko-męskie", ru: "отношения между мужчиной и женщиной" }
