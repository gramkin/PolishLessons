notes:
  - { kind: false-friend, text: "Русское «женский» по-польски бывает двух видов. DAMSKI — для женщин как покупательниц: DAMSKIE BUTY, DAMSKA TOALETA, FRYZJER DAMSKI. KOBIECY — присущий женщине: KOBIECA INTUICJA, KOBIECY GŁOS. Русское «дамский» звучит старомодно, а польское DAMSKI — обычное слово с вывески магазина." }
  - { kind: usage, text: "Относительное прилагательное, степеней сравнения нет. Все одиннадцать форм живые. Форма для мужчин-людей DAMSCY нужна для профессий, работающих с женщинами: FRYZJERZY DAMSCY, KRAWCY DAMSCY. Чередование: SK перед I в мужском-личном даёт SC: DAMSKI, но DAMSCY." }
  - { kind: government, text: "Ставится после существительного в названиях: TOALETA DAMSKA, ODZIEŻ DAMSKA, FRYZJER DAMSKI. Перед существительным — в описаниях: DAMSKA TOREBKA, DAMSKI ZEGAREK. Падежных требований нет. Противоположность — MĘSKI." }
  - { kind: pronunciation, text: "Читается «да́мски», два слога, ударение на первом. SKI даёт «ски» с мягким «к», как в русском. В форме DAMSCY: «да́мсцы», с твёрдым «ц»." }
  - { kind: register, text: "Нейтральное бытовое слово, его видно на каждой двери туалета и в каждом магазине одежды. DAMSKO-MĘSKI, «женско-мужской», — шутливое о сложных отношениях: SPRAWY DAMSKO-MĘSKIE, «дела между мужчиной и женщиной»." }
collocations:
