rank: 2612
pos: verb
pron: { cyr: "рэпрэзэнто́ваць" }
senses:
  - id: represent
    ru: "представлять (кого-л., интересы)"
    examples:
      - pl: "Reprezentuje firmę w rozmowach z bankiem."
        ru: "Он представляет фирму в переговорах с банком."
        source: { kind: authored }
      - pl: "Adwokat reprezentował ją przez cały proces."
        ru: "Адвокат представлял её весь процесс."
        source: { kind: authored }
      - pl: "Kto nas będzie reprezentował na zebraniu?"
        ru: "Кто будет представлять нас на собрании?"
        source: { kind: authored }
  - id: embody
    ru: "представлять собой, олицетворять"
    examples:
      - pl: "Ten budynek reprezentuje styl międzywojenny."
        ru: "Это здание представляет межвоенный стиль."
        source: { kind: authored }
      - pl: "Reprezentują sobą poziom, jakiego tu nie widziano."
        ru: "Они представляют собой уровень, какого здесь не видели."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ОПАСНО НЕ САМО СЛОВО, А ЕГО РОДНЯ. REPREZENTACJA по-польски — это прежде всего СБОРНАЯ: reprezentacja Polski w piłce nożnej. Русская «репрезентация» — термин учёный и редкий, а сборную мы называем совсем иначе. Второе: REPREZENTACYJNY значит «парадный, представительский» — reprezentacyjny garnitur «парадный костюм», и это не «репрезентативный», который по-польски будет REPREZENTATYWNY." }
  - { kind: government, text: "Управление простое и совпадает с русским: REPREZENTOWAĆ KOGOŚ или COŚ, винительный без предлога — reprezentować firmę, kraj, interesy klienta. Русское «выступать от имени» требует оборота, а польский обходится прямым дополнением. Есть и отдельный оборот REPREZENTOWAĆ SOBĄ с творительным: reprezentować sobą wysoki poziom «представлять собой высокий уровень»." }
  - { kind: usage, text: "Спряжение даётся даром: -ować даёт -uję, как русское -ировать даёт -ирую. Reprezentować — reprezentuję, reprezentujesz. Вид несовершенный, поэтому reprezentuję значит «представляю», а не «представлю»; совершенного партнёра у глагола практически нет, и там, где нужен результат, берут другой глагол." }
collocations:
  - { pl: "reprezentować firmę", ru: "представлять фирму" }
  - { pl: "reprezentować interesy", ru: "представлять интересы" }
  - { pl: "reprezentacja Polski", ru: "сборная Польши" }
family:
  - { pl: "reprezentacja", ru: "сборная; представительство", relation: root }
  - { pl: "reprezentant", ru: "представитель", relation: root }
  - { pl: "reprezentacyjny", ru: "парадный, представительский", relation: derived }
etymology: "Из латинского repraesentare «являть, предъявлять», через французский и немецкий. Русский взял тот же корень, но оставил его в учёном слое: «репрезентация», «репрезентативный». Польский пустил слово в общий оборот и построил от него бытовое reprezentacja «сборная» — та, что представляет страну. Отсюда и расхождение, при полном совпадении корня."
memory: "Глагол совпадает с русским «представлять», а вот существительное — нет: reprezentacja Polski это «сборная Польши». И reprezentacyjny значит «парадный», а не «репрезентативный»."
idioms:
  - { pl: "reprezentacja Polski", ru: "сборная Польши" }
  - { pl: "reprezentować sobą wysoki poziom", ru: "представлять собой высокий уровень" }
