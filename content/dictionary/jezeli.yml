# review
id: jezeli
format: 2
lemma: "jeżeli"
rank: 396
pos: conj
pron: { cyr: "ежэ́ли" }
senses:
  - id: if
    ru: "если"
    examples:
      - pl: "Nie pójdziemy, jeżeli będzie padać."
        ru: "Мы не пойдём, если будет дождь."
        source: { kind: tatoeba, id: 3649428 }
      - pl: "Jeżeli nie masz tej książki, możesz ją kupić."
        ru: "Если у тебя нет этой книги, ты можешь её купить."
        source: { kind: tatoeba, id: 1463289 }
      - pl: "Jeżeli potrzebujesz przyjaciela, kup psa."
        ru: "Если тебе нужен друг, купи собаку."
        source: { kind: tatoeba, id: 12454570 }
  - id: supposing
    ru: "если (в рассуждении, в условии)"
    examples:
      - pl: "Jeżeli jutro jest poniedziałek, to dzisiaj jest niedziela."
        ru: "Если завтра понедельник, то сегодня воскресенье."
        source: { kind: tatoeba, id: 12453655 }
      - pl: "Jeżeli Bóg z nami, któż przeciwko nam?"
        ru: "Если Бог с нами, кто против нас?"
        source: { kind: tatoeba, id: 2244550 }
      - pl: "Jeżeli chcesz, pomogę."
        ru: "Если хочешь, я помогу."
        source: { kind: authored }
notes:
  - { kind: usage, text: "jeżeli и jeśli — полные синонимы «если». jeśli короче и в живой речи звучит чаще." }
  - { kind: usage, text: "Придаточное с jeżeli всегда отделяется запятой: Nie pójdziemy, jeżeli będzie padać." }
  - { kind: usage, text: "После jeżeli о будущем говорят будущим временем, а не настоящим: Jeżeli będzie padać «Если будет дождь»." }
  - { kind: false-friend, text: "Не путайте jeżeli «если» с żeby «чтобы» и с вопросительной частицей czy «ли»." }
collocations:
  - { pl: "jeżeli chodzi o", ru: "что касается" }
  - { pl: "jeżeli tak", ru: "если так" }
  - { pl: "jeżeli nie", ru: "если нет" }
  - { pl: "nawet jeżeli", ru: "даже если" }
etymology: "Из jest + że + li — буквально «есть ли так, что». Русское «если» собрано ровно из тех же кирпичей: «есть» + «ли»."
memory: "jeżeli — «если», и оно устроено в точности как русское слово: jest + że + li, то есть «есть ли». Русское «если» — это тоже «есть ли». Синоним jeśli короче и звучит чаще."
idioms:
  - { pl: "jeżeli chodzi o...", ru: "что касается..." }
  - { pl: "nawet jeżeli", ru: "даже если" }
  - { pl: "jeżeli nie teraz, to kiedy?", ru: "если не сейчас, то когда?" }
