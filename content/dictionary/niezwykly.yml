# review
id: niezwykly
format: 2
lemma: "niezwykły"
rank: 1552
pos: adj
pron: { cyr: "незвы́куы" }
senses:
  - id: unusual
    ru: "необычный, непривычный"
    examples:
      - pl: "To niezwykłe zjawisko."
        ru: "Это необычное явление."
        source: { kind: authored }
      - pl: "Zachował się w niezwykły sposób."
        ru: "Он повёл себя необычным образом."
        source: { kind: authored }
      - pl: "Niezwykłe rzeczy dzieją się nocą."
        ru: "Необычные вещи происходят ночью."
        source: { kind: authored }
  - id: remarkable
    ru: "необыкновенный, выдающийся"
    examples:
      - pl: "To jest sprawa niezwykłej wagi."
        ru: "Это дело необычайной важности."
        source: { kind: tatoeba, id: 11318568 }
      - pl: "To był niezwykły człowiek."
        ru: "Это был необыкновенный человек."
        source: { kind: authored }
      - pl: "Miała niezwykłą pamięć."
        ru: "У неё была необыкновенная память."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Слово разбирается по частям, как русское: nie- + zwykły «обычный» = «необычный». Зная zwykły, вы получаете niezwykły бесплатно." }
  - { kind: false-friend, text: "Пара наречий различается одной буквой и значит противоположное: zwykle «обычно», niezwykle «необычайно». Zwykle wstaję o siódmej «Обычно я встаю в семь», но niezwykle trudny «необычайно трудный»." }
  - { kind: usage, text: "Степени сравнения книжные и громоздкие (niezwyklejszy); в живой речи усиливают наречием — bardzo niezwykły." }
collocations:
  - { pl: "niezwykły człowiek", ru: "необыкновенный человек" }
  - { pl: "niezwykłe zjawisko", ru: "необычное явление" }
  - { pl: "sprawa niezwykłej wagi", ru: "дело необычайной важности" }
  - { pl: "niezwykle trudny", ru: "необычайно трудный" }
family:
  - { pl: "zwykły", ru: "обычный", relation: derived }
  - { pl: "niezwykle", ru: "необычайно", relation: derived }
  - { pl: "zwyczaj", ru: "обычай", relation: derived }
etymology: "Приставка nie- плюс zwykły «обычный», от zwyk-/zwyczaj «привычка, обычай» — та же основа, что в русских «привыкнуть» и «обычай». Буквально «непривычный»."
memory: "niezwykły — это просто nie- + zwykły «обычный», и разбирается так же, как русское «необычный». Выучите заодно пару наречий, различающихся одной буквой и значащих противоположное: zwykle «обычно» и niezwykle «необычайно». Сравнительные формы (niezwyklejszy) книжные — в живой речи говорят bardzo niezwykły."
idioms:
  - { pl: "niezwykłym zbiegiem okoliczności", ru: "по необычайному стечению обстоятельств" }
  - { pl: "nic niezwykłego", ru: "ничего необычного" }
  - { pl: "sprawa niezwykłej wagi", ru: "дело необычайной важности" }
