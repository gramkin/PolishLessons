notes:
  - { kind: usage, text: "В мужском личном именительном множественного R переходит в RZ: SZARZY, а не «szari». Это второе большое чередование в этой позиции рядом с -SKI и -SCY, и оно работает у всех прилагательных с основой на R: DOBRY даёт DOBRZY, STARY — STARZY, MĄDRY — MĄDRZY, CHORY — CHORZY. Для вещей и для женского рода ничего не меняется: SZARE DNI, SZARA MGŁA. Само прилагательное качественное, то есть степени сравнения у него есть, но строятся они от основы отдельно: SZARSZY, NAJSZARSZY, и в таблицу форм положительной степени они не входят, поэтому здесь одиннадцать форм." }
  - { kind: false-friend, text: "Значение совпадает с русским «серым», и в прямом смысле ошибиться негде. Расходятся устойчивые выражения. SZARA STREFA значит «теневая экономика», а не «серая зона»: по-русски «серая зона» — это нечто неопределённое, а по-польски речь именно о неучтённом обороте. SZARY CZŁOWIEK значит «обычный, рядовой человек», без оттенка скуки, который слышится в русском «серый человек»; это нейтральное выражение, часто в публицистике. SZARA EMINENCJA — «серый кардинал», и здесь языки совпадают. Наречие NA SZARO означает способ приготовления: KARP NA SZARO — традиционное польское блюдо." }
  - { kind: government, text: "Согласуется с существительным в роде, числе и падеже. Степени сравнения синтетические: SZARSZY «серее», NAJSZARSZY «самый серый», и наречие SZARO с формами SZARZEJ, NAJSZARZEJ. Частотные сочетания: SZARY DZIEŃ «серый день», SZARA MGŁA, SZARE WŁOSY «седые волосы» — обратите внимание, что для седины польский употребляет SIWY, а SZARE WŁOSY звучит скорее о цвете, чем о возрасте. Выражение SZARO-BURY значит «невзрачный, тускло-серый». Глагол SZARZEĆ значит «сереть, светать»." }
  - { kind: pronunciation, text: "Читается «ша́ры», два слога, ударение на первом. Сочетание SZ даёт «ш». Буква A произносится полно. Конечное -Y это «ы», а не «и». В мужском личном множественном SZARZY сочетание RZ даёт «ж»: «ша́жы», и это полностью меняет звучание слова, хотя написание отличается одной буквой. В форме SZARĄ носовое Ą читается «он»: «ша́рон». Сравните с SIWY «седой», которое звучит «си́вы» и к этому гнезду не относится." }
