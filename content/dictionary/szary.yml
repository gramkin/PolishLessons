etymology: "Из праславянского *šěrъ «серый», того же корня, что русское «серый» и старое «шерый» в некоторых говорах. Польский сохранил начальное Š, русский упростил его до «с», и это регулярное расхождение в словах с этим корнем. Чередование R и RZ в мужском личном множественном восходит ко второй палатализации: перед старым окончанием -i заднее r смягчилось и дало rz, отсюда SZARZY, DOBRZY, STARZY. Русский это чередование утратил и выровнял формы. Из того же гнезда идут SZARZEĆ «сереть, светать», SZARÓWKA «сумерки» и SZAROŚĆ «серость»; последнее образовано тем же суффиксом -OŚĆ, который отвечает русскому -ОСТЬ."
memory: "Мужской личный множественного szarzy, с r→rz — и так у всех основ на r: dobry/dobrzy, stary/starzy, mądry/mądrzy. Это второе большое чередование в этой позиции после -ski/-scy. Устойчивые выражения расходятся: szara strefa — «теневая экономика», szary człowiek — нейтрально «рядовой человек». Для седины нужно siwy, а не szary."
