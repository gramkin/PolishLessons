notes:
  - { kind: false-friend, text: "Значение совпадает с русским «финалом» полностью, и слова взяты из одного источника. Отличается только одно, зато это самое частое употребление: по-русски говорят «в финале», и по-польски тоже W FINALE, но форма местного падежа выглядит неожиданно — не FINAŁE, а FINALE, с обычным L вместо Ł. Для русскоязычного это главная трудность в слове, потому что остальные формы сохраняют Ł: FINAŁU, FINAŁEM, FINAŁY. Второе: концовка музыкального произведения тоже FINAŁ, а вот финал в смысле итога чаще называют ZAKOŃCZENIE." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Местный единственного — FINALE, и здесь работает правило, которое стоит запомнить отдельно: перед окончанием -E буква Ł переходит в L. То же самое видно в STOLE от STÓŁ, в SZKOLE от SZKOŁA и в KOŚCIELE от KOŚCIÓŁ. Правило объясняется просто: Ł это твёрдый согласный, а окончание -E требует мягкого, и мягкой парой к Ł служит именно L. Родительный единственного — FINAŁU. Винительный равен именительному. Управление: AWANSOWAĆ DO FINAŁU с родительным." }
  - { kind: pronunciation, text: "Читается «фи́нау», два слога, ударение на первом — в отличие от русского «фина́л». Буква Ł на конце даёт «у» неслоговое, поэтому слово кончается как бы на гласный. В форме FINAŁU слышно «фина́у», тоже с «у» в середине. А вот в форме FINALE буква L обычная, мягкая, и слово звучит «фина́ле» — на слух местный падеж резко отличается от остальных форм именно этим. В форме FINAŁÓW буква Ó даёт «у», а конечное W оглушается, и слово звучит «фина́уф»." }
  - { kind: register, text: "Слово нейтральное, частое в спорте, в музыке и в разговоре о книгах и фильмах. Устойчивые сочетания: FINAŁ PUCHARU «финал кубка», WIELKI FINAŁ, AWANSOWAĆ DO FINAŁU, PÓŁFINAŁ «полуфинал», ĆWIERĆFINAŁ «четвертьфинал». Выражение SZCZĘŚLIWY FINAŁ отвечает русскому «счастливому концу». Прилагательное FINAŁOWY употребляется широко: MECZ FINAŁOWY, SCENA FINAŁOWA. В музыке слово означает последнюю часть симфонии и пишется так же." }
