etymology: "Из латинского FINALIS «конечный», от FINIS «конец, предел», через итальянское музыкальное FINALE, которым называли последнюю часть сочинения. Из музыки слово перешло в театр, а оттуда в спорт, и этот путь прошли оба языка одинаково. От того же латинского корня идут «финиш», «финал», «дефиниция» и польские FINANSE, где исходное значение было «окончательный расчёт». Буква Ł на конце — след приспособления чужого слова к польскому строю: язык подставил своё твёрдое L там, где в латинском стояло обычное, а перед мягким окончанием -E оно закономерно вернулось к мягкому L, отчего и получилось W FINALE."
memory: "То же латинское finis «конец», что и в русском «финале», через итальянское музыкальное finale. Главное — неожиданный местный падеж: w finale, с обычным l вместо ł, потому что окончание -e требует мягкой основы, а мягкая пара к ł это l. То же в stole от stół и szkole от szkoła. Остальные формы сохраняют ł: finału, finałem. Ударение на первом слоге, «фи́нау»."
idioms:
  - { pl: "szczęśliwy finał", ru: "счастливый конец" }
