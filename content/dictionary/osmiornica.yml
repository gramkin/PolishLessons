        ru: "Коррупция опутала город, как спрут."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Женский род, хотя русский «осьминог» — мужского: DUŻA OŚMIORNICA «большой осьминог», OŚMIORNICA PŁYWAŁA «осьминог плавал». Склоняется как ULICA: в родительном, дательном и предложном единственного — OŚMIORNICY. Звательный OŚMIORNICO не употребляется." }
  - { kind: pronunciation, text: "Читается «осьмёрни́ца»: Ś — мягкое «сь», MIO — «мё», ударение на предпоследнем слоге NI." }
  - { kind: usage, text: "Как и русский «спрут», в переносном смысле — разветвлённая преступная сеть, которая всё опутала щупальцами (MACKI). Так в Польше назывался итальянский сериал о мафии LA PIOVRA." }
collocations:
  - { pl: "grillowana ośmiornica", ru: "осьминог на гриле" }
  - { pl: "macki ośmiornicy", ru: "щупальца осьминога" }
  - { pl: "mafijna ośmiornica", ru: "мафиозный спрут" }
family:
  - { pl: "osiem", ru: "восемь", relation: root, id: osiem }
synonyms:
  - "głowonóg"
etymology: "Образовано от числительного OSIEM «восемь» — по восьми щупальцам, как и русское «осьминог»."
memory: "Ośmiornica — от osiem «восемь», как «осьминог» от «осьми». Но по-польски она женского рода: ta ośmiornica."
idioms:
  - { pl: "macki ośmiornicy", ru: "щупальца спрута (о влиянии мафии, коррупции)" }
