id: kilo
format: 2
lemma: "kilo"
rank: 3636
pos: noun
pron: { cyr: "ки́ло" }
senses:
  - id: kilogram
    ru: "кило, килограмм"
    examples:
      - pl: "Ile kosztuje kilo truskawek?"
        ru: "Сколько стоит кило клубники?"
        source: { kind: authored }
      - pl: "Kup dwa kilo ziemniaków."
        ru: "Купи два кило картошки."
        source: { kind: authored }
      - pl: "Schudła pięć kilo."
        ru: "Она похудела на пять кило."
        source: { kind: authored }
      - pl: "Ta walizka waży dwadzieścia kilo."
        ru: "Этот чемодан весит двадцать кило."
        source: { kind: authored }
