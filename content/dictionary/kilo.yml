  - form: "kilo"
    pl: "Poproszę pół kilo sera."
    ru: "Мне полкило сыра, пожалуйста."
    source: { kind: authored }
  - form: "kilo"
    pl: "Przytyłem dwa kilo na wakacjach."
    ru: "За отпуск я поправился на два кило."
    source: { kind: authored }
