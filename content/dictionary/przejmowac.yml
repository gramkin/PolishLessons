# review
id: przejmowac
format: 2
lemma: "przejmować"
rank: 936
pos: verb
aspect: imperf
pron: { cyr: "пшэймо́ваць" }
senses:
  - id: worry
    ru: "przejmować się — переживать, беспокоиться"
    note: "Возвратная форма и есть самое частое употребление слова."
    examples:
      - pl: "Nie przejmuj się."
        ru: "Не обращай внимания."
        source: { kind: translated, id: 403048 }
      - pl: "Ona ani trochę się nie przejmuje."
        ru: "Она ничуть не переживает."
        source: { kind: translated, id: 438407 }
      - pl: "Nie ma się czym przejmować."
        ru: "Не о чем беспокоиться."
        source: { kind: translated, id: 2587266 }
  - id: take-over
    ru: "перенимать, принимать (дела, власть, фирму)"
    examples:
      - pl: "Przejmuję Toma."
        ru: "Я принимаю Тома."
        source: { kind: translated, id: 8727203 }
      - pl: "Teraz przejmujesz ty."
        ru: "Теперь принимаешь ты."
        source: { kind: translated, id: 8743471 }
      - pl: "Nowa firma przejmuje naszych klientów."
        ru: "Новая фирма перенимает наших клиентов."
        source: { kind: authored }
  - id: piercing
    ru: "przejmujący — пронизывающий, щемящий"
    examples:
      - pl: "Dziś rano był przejmujący mróz."
        ru: "Сегодня утром был пронизывающий мороз."
        source: { kind: translated, id: 735863 }
      - pl: "To był przejmujący widok."
        ru: "Это было щемящее зрелище."
        source: { kind: authored }
      - pl: "Usłyszeli przejmujący krzyk."
        ru: "Они услышали пронзительный крик."
        source: { kind: authored }
notes:
  - { kind: government, text: "przejmować się CZYMŚ — творительный падеж без предлога: Nie przejmuj się wynikami «Не переживай из-за результатов». Русский тут требует предлога «из-за» с родительным, польский обходится чистым творительным." }
  - { kind: usage, text: "Nie przejmuj się! — «Не переживай!», одна из самых частых утешительных реплик. Ещё говорят Nie ma się czym przejmować «Не о чем беспокоиться»." }
  - { kind: usage, text: "Без się глагол значит «перенимать, принимать»: przejmować władzę «перенимать власть», przejmować obowiązki «принимать обязанности», przejmować firmę «перенимать фирму»." }
  - { kind: usage, text: "Причастие przejmujący оторвалось от глагола и стало прилагательным «пронизывающий» (о морозе, ветре) и «щемящий, пронзительный» (о крике, сцене, истории)." }
collocations:
  - { pl: "nie przejmuj się!", ru: "не переживай!" }
  - { pl: "przejmować się czymś", ru: "переживать из-за чего-то" }
  - { pl: "przejmować władzę", ru: "перенимать власть" }
  - { pl: "przejmujący mróz", ru: "пронизывающий мороз" }
family:
  - { pl: "przejąć", ru: "перенять, принять", relation: aspect }
  - { pl: "jąć", ru: "взять, начать", relation: root }
  - { pl: "przejęcie", ru: "перенятие, поглощение", relation: derived }
etymology: "Приставка prze- + -jmować от праславянского *jęti «взять» — тот же корень, что в русских «взять, изымать, приём». Русское «перенимать» собрано ровно так же: «пере-» + «имать»."
memory: "Главное — возвратное przejmować się «переживать». Nie przejmuj się! «Не переживай!» — и запомните падеж: przejmować się CZYMŚ, чистый творительный, без всякого «из-за». Без się глагол значит «перенимать»: przejmować władzę."
idioms:
  - { pl: "nie przejmuj się!", ru: "не переживай!" }
  - { pl: "nie ma się czym przejmować", ru: "не о чем беспокоиться" }
  - { pl: "przejmować inicjatywę", ru: "перехватывать инициативу" }
