# review
id: chelpic
format: 2
lemma: "chełpić"
rank: 5960
pos: verb
aspect: imperf
pron: { cyr: "хэ́упиць" }
senses:
  - id: boast
    ru: "хвастаться, бахвалиться (чем-либо)"
    examples:
      - pl: "Tom chełpi się swoim nowym pojazdem."
        ru: "Том хвастается своей новой машиной."
        source: { kind: translated, id: 2827434 }
      - pl: "Chełpił się, że wygrał bez treningu."
        ru: "Он хвастался, что выиграл без тренировок."
        source: { kind: authored }
      - pl: "Nie chełp się cudzymi sukcesami."
        ru: "Не хвастайся чужими успехами."
        source: { kind: authored }
  - id: pride
    ru: "кичиться, гордиться (книжно, с оттенком осуждения)"
    examples:
      - pl: "Miasto chełpi się najstarszym ratuszem w kraju."
        ru: "Город гордится старейшей ратушей в стране."
        source: { kind: authored }
      - pl: "Szlachta chełpiła się swoim pochodzeniem."
        ru: "Шляхта кичилась своим происхождением."
        source: { kind: authored }
notes:
  - { kind: government, text: "Только с SIĘ, чем — творительный падеж, как в русском: CHEŁPIĆ SIĘ BOGACTWEM «хвастаться богатством». С придаточным — ŻE: CHEŁPI SIĘ, ŻE WSZYSTKO WIE." }
  - { kind: register, text: "Книжное слово с неодобрительным оттенком: «бахвалиться, кичиться». В разговоре говорят CHWALIĆ SIĘ или PRZECHWALAĆ SIĘ. Нейтрально о городе или фирме — «гордиться»: FIRMA CHEŁPI SIĘ JAKOŚCIĄ." }
  - { kind: pronunciation, text: "Читается «хэ́упиць»: CH — «х», Ł — «у», а не «л». Ударение на предпоследнем слоге: CHEŁPIĘ — «хэ́упье», CHEŁPLIWY — «хэупли́вы»." }
  - { kind: usage, text: "Несовершенный вид; совершенный POCHEŁPIĆ SIĘ встречается редко. Прилагательное CHEŁPLIWY — «хвастливый»." }
collocations:
  - { pl: "chełpić się sukcesami", ru: "хвастаться успехами" }
  - { pl: "chełpić się pochodzeniem", ru: "кичиться происхождением" }
  - { pl: "chełpić się bogactwem", ru: "бахвалиться богатством" }
family:
  - { pl: "chełpliwy", ru: "хвастливый", relation: derived }
  - { pl: "chełpliwość", ru: "хвастливость", relation: derived }
  - { pl: "chwalić", ru: "хвалить; chwalić się — хвастаться", relation: root, id: chwalic }
  - { pl: "przechwalać", ru: "перехваливать; przechwalać się — бахвалиться", relation: root }
etymology: "Старое польское слово с тем же значением; прямой русской параллели у него нет, происхождение корня спорно."
memory: "Chełpić się — хвастаться: представьте, как хвастун хлопает себя по груди — «хэуп!»."
idioms:
  - { pl: "nie ma się czym chełpić", ru: "нечем хвастаться" }
