# review
id: morzyc
format: 2
lemma: "morzyć"
rank: 2255
pos: verb
aspect: imperf
pron: { cyr: "мо́жыць" }
senses:
  - id: starve
    ru: "морить (голодом)"
    examples:
      - pl: "Morzyli jeńców głodem."
        ru: "Они морили пленных голодом."
        source: { kind: authored }
      - pl: "Nie wolno morzyć zwierząt głodem."
        ru: "Нельзя морить животных голодом."
        source: { kind: authored }
      - pl: "Morzył się głodem tygodniami."
        ru: "Он неделями морил себя голодом."
        source: { kind: authored }
  - id: overcome
    ru: "одолевать (о сне)"
    examples:
      - pl: "Morzy mnie sen."
        ru: "Меня одолевает сон."
        source: { kind: authored }
      - pl: "Morzył go sen po obiedzie."
        ru: "После обеда его одолевал сон."
        source: { kind: authored }
notes:
  - { kind: government, text: "Чем морят — творительный падеж: morzyć głodem «морить голодом», как в русском." }
  - { kind: usage, text: "Второе употребление безличное и очень живое: morzy mnie sen «меня клонит в сон», где подлежащее — сон, а человек в винительном." }
  - { kind: false-friend, text: "Корень mór «мор, чума», того же гнезда, что umrzeć «умереть»; ср. русское «морить», «мор». Со словом morze «море» связи нет, хотя формы похожи." }
  - { kind: usage, text: "В корпусе для этого глагола нет ни одного примера: все совпадения приходятся на mórz, родительный множественного от morze «море»." }
collocations:
  - { pl: "morzyć głodem", ru: "морить голодом" }
  - { pl: "morzy mnie sen", ru: "меня клонит в сон" }
etymology: "От mór «мор», того же гнезда, что umrzeć «умереть»; ср. русское «морить», «мор». С morze «море» не связано."
memory: "morzyć — «морить голодом» (с творительным) и безлично «одолевать»: morzy mnie sen «меня клонит в сон». Формы похожи на morze «море», но слова разные."
