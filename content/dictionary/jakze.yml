# review
id: jakze
format: 2
lemma: "jakże"
rank: 4317
pos: adv
pron: { cyr: "я́гже" }
senses:
  - id: how-emph
    ru: "как же (усиление восклицания)"
    examples:
      - pl: "Jakże to piękne!"
        ru: "Как же это красиво!"
        source: { kind: translated, id: 356408 }
      - pl: "Jakże jestem szczęśliwy!"
        ru: "Как же я счастлив!"
        source: { kind: translated, id: 365077 }
      - pl: "Jakże się cieszę, że to ty!"
        ru: "Как же я рад, что это ты!"
        source: { kind: authored }
  - id: of-course
    ru: "a jakże — а как же, конечно"
    examples:
      - pl: "Bo a jakże, on się poprawi. Na Święty Nigdy."
        ru: "Ага, он исправится. Когда рак на горе свистнет."
        source: { kind: translated, id: 1188871 }
      - pl: "Pomożesz? — A jakże!"
        ru: "Поможешь? — А как же!"
        source: { kind: authored }
      - pl: "Jakże mógłbym zapomnieć?"
        ru: "Как же я мог бы забыть?"
        source: { kind: authored }
notes:
  - { kind: usage, text: "Это jak «как» с усилительной частицей -że — та же семья, что gdzież, czegóż, skądże, otóż." }
  - { kind: usage, text: "Чаще всего усиливает восклицание: Jakże to piękne! «Как же это красиво!»" }
  - { kind: usage, text: "Готовая реплика a jakże! значит «а как же!», «конечно!» — согласие с оттенком «само собой»." }
  - { kind: usage, text: "В вопросе jakże звучит с упрёком или недоумением: Jakże mogłeś? «Как же ты мог?»" }
collocations:
  - { pl: "a jakże!", ru: "а как же!" }
  - { pl: "jakże to piękne!", ru: "как же это красиво!" }
  - { pl: "jakże mogłeś?", ru: "как же ты мог?" }
etymology: "Из jak «как» с усилительной частицей -że. Та же модель, что в gdzież, czegóż, skądże."
memory: "jakże — усиленное jak «как», из того же гнезда, что gdzież и czegóż. Чаще всего усиливает восклицание: Jakże to piękne! А готовая реплика A jakże! значит «А как же!», то есть «конечно»."
idioms:
  - { pl: "a jakże!", ru: "а как же!" }
  - { pl: "jakże mogłeś?", ru: "как же ты мог?" }
