# review
id: zmiescic
format: 2
lemma: "zmieścić"
rank: 5822
pos: verb
aspect: perf
pron: { cyr: "зме́сьциць" }
senses:
  - id: fit-in
    ru: "поместиться, уместиться (с się)"
    examples:
      - pl: "Czterdziestu ludzi się tu nie zmieści."
        ru: "Сорок человек здесь не поместятся."
        source: { kind: translated, id: 2138945 }
