        ru: "Чемодан не поместится в багажник."
        source: { kind: authored }
      - pl: "Wszyscy zmieścimy się w jednym samochodzie."
        ru: "Мы все поместимся в одной машине."
        source: { kind: authored }
  - id: fit-something
    ru: "уместить, вместить (что-либо куда-либо)"
    examples:
      - pl: "Zmieściłam wszystko w jednej walizce."
        ru: "Я уместила всё в один чемодан."
        source: { kind: authored }
      - pl: "Ta sala zmieści sto osób."
        ru: "Этот зал вместит сто человек."
        source: { kind: authored }
  - id: within-limit
    ru: "уложиться (в срок, сумму, объём; с się)"
    examples:
      - pl: "Proszę zmieścić się w 50 słowach."
        ru: "Пожалуйста, уложитесь в 50 слов."
        source: { kind: translated, id: 745356 }
      - pl: "Zmieściliśmy się w budżecie."
        ru: "Мы уложились в бюджет."
        source: { kind: authored }
notes:
  - { kind: government, text: "Чаще всего с SIĘ: куда — W + местный или DO + родительный: ZMIEŚCIĆ SIĘ W SZAFIE, ZMIEŚCIĆ SIĘ DO WALIZKI. Без SIĘ — переходный «уместить, вместить»: ZMIEŚCIĆ WSZYSTKO W JEDNEJ TORBIE, SALA ZMIEŚCI STO OSÓB." }
  - { kind: false-friend, text: "ZMIEŚCIĆ — «уместить, поместиться», а не русское «сместить». «Сместить» (сдвинуть) — PRZESUNĄĆ, «сместить с должности» — ODWOŁAĆ." }
  - { kind: usage, text: "Совершенный вид; несовершенный — MIEŚCIĆ (SIĘ). ŚĆ чередуется с SZCZ: ZMIESZCZĘ, ZMIESZCZĄ, ZMIESZCZONY. Повелительное ZMIEŚĆ SIĘ! совпадает по написанию с инфинитивом ZMIEŚĆ «смести (метлой)»." }
collocations:
  - { pl: "zmieścić się w limicie", ru: "уложиться в лимит" }
  - { pl: "zmieścić się w budżecie", ru: "уложиться в бюджет" }
  - { pl: "zmieścić się do walizki", ru: "поместиться в чемодан" }
  - { pl: "zmieścić wszystko", ru: "уместить всё" }
family:
  - { pl: "mieścić", ru: "вмещать; помещаться (с się)", relation: aspect }
  - { pl: "pomieścić", ru: "вместить", relation: root }
  - { pl: "miejsce", ru: "место", relation: root, id: miejsce }
  - { pl: "pomieszczenie", ru: "помещение", relation: root }
etymology: "Приставка Z- плюс MIEŚCIĆ «вмещать», того же корня, что MIEJSCE «место»; ср. русские «вместить», «поместить»."
memory: "Zmieścić — найти всему место (miejsce): zmieszczę się — «помещусь»."
idioms:
  - { pl: "zmieścić się w czasie", ru: "уложиться в срок, успеть вовремя" }
