# review
id: lis
format: 2
lemma: "lis"
rank: 1588
pos: noun
pron: { cyr: "лис" }
senses:
  - id: fox
    ru: "лиса, лис"
    examples:
      - pl: "Lis jest zwierzęciem dzikim."
        ru: "Лиса - дикое животное."
        source: { kind: tatoeba, id: 865611 }
      - pl: "Lis zabił gęś."
        ru: "Лиса убила гуся."
        source: { kind: translated, id: 10469414 }
      - pl: "Lis przeszedł przez drogę."
        ru: "Лиса перешла дорогу."
        source: { kind: translated, id: 3481854 }
  - id: cunning
    ru: "хитрец (о человеке)"
    examples:
      - pl: "Nie lubię go, bo jest chytry jak lis."
        ru: "Я его не люблю, потому что он хитёр как лис."
        source: { kind: translated, id: 2391298 }
      - pl: "Lis zmienia sierść, ale nie wady."
        ru: "Лиса меняет шерсть, но не пороки."
        source: { kind: translated, id: 2700933 }
notes:
  - { kind: usage, text: "Формы lisowie нет: множественное от lis — lisy. Окончание -owie берут только мужско-личные существительные, то есть слова о людях (pan — panowie, syn — synowie), а лиса одушевлённая, но не лицо. Переносное значение «хитрец» тоже ничего не меняет: о людях говорят stare lisy «старые лисы», а не stare lisowie." }
  - { kind: usage, text: "Мужской род: lis «лис», а самка — lisica. В русском обычно говорят «лиса» (женский), в польском по умолчанию lis." }
  - { kind: usage, text: "chytry jak lis — «хитрый как лис», ровно то же сравнение, что в русском." }
  - { kind: usage, text: "Переносно lis значит «хитрец»; farbowany lis — «перекрашенный лис», о том, кто сменил убеждения." }
  - { kind: usage, text: "Звательная форма lisie используется и в обращении: Lisie, możesz ufać «Лис, можешь доверять»." }
collocations:
  - { pl: "chytry jak lis", ru: "хитрый как лис" }
  - { pl: "polować na lisy", ru: "охотиться на лис" }
  - { pl: "farbowany lis", ru: "перекрашенный лис" }
etymology: "Праславянское *lisъ — то же слово, что русское «лис, лиса». Совпадает и переносное значение «хитрец», и сравнение chytry jak lis «хитрый как лис»."
memory: "lis = «лис, лиса», но в польском по умолчанию мужской род (самка — lisica), а в русском обычно «лиса». Сравнение то же самое: chytry jak lis «хитрый как лис»."
idioms:
  - { pl: "chytry jak lis", ru: "хитрый как лис" }
  - { pl: "polować na lisy", ru: "охотиться на лис" }
  - { pl: "farbowany lis", ru: "перекрашенный лис" }
formExamplesSkip:
  - { form: "lisowie", reason: "в корпусе нет примеров для этой формы" }
