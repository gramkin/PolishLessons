etymology: "Из греческого BIOS «жизнь» и LOGOS «слово, учение», через латынь и западноевропейские языки, и в русский слово пришло тем же путём. Поэтому корень совпадает полностью, а расходятся только окончания, и расходятся регулярно: греческое -IKOS дало в польском -ICZNY, а в русском -ИЧЕСКИЙ, тогда как -LOGIA в обоих языках осталось почти без изменений. Запомнив эту пару, русскоязычный разбирает без словаря целый разряд: GEOLOGICZNY, PSYCHOLOGICZNY, TECHNOLOGICZNY, и все они читаются через «чны» на конце."
memory: "Два правила в одном слове: -iczny отвечает русскому -ический, а -logia отвечает -логия. Отсюда biologiczny и «биологический», biologia и «биология», и так же geologia, psychologia. Одиннадцать форм, степеней нет, прилагательное относительное. В терминах оно стоит после существительного: nauki biologiczne, broń biologiczna. Читается «бьологи́чны», где bio это один слог, «бьо», а не «би-о». Приёмный родитель будет rodzic zastępczy."
