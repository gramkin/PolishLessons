notes:
  - { kind: usage, text: "Слово подтверждает два правила соответствий, которые вместе открывают целый пласт книжной лексики. Первое: польское -ICZNY отвечает русскому -ИЧЕСКИЙ, отсюда BIOLOGICZNY и «биологический», LOGICZNY и «логический», HISTORYCZNY и «исторический». Второе: польское -LOGIA отвечает русскому -ЛОГИЯ, отсюда BIOLOGIA и «биология», GEOLOGIA, PSYCHOLOGIA. Одиннадцать форм, степеней сравнения нет: прилагательное относительное, биологическим нельзя быть в большей мере." }
  - { kind: government, text: "Прилагательное только согласуется и падежом не управляет. В терминах оно почти всегда стоит после существительного: NAUKI BIOLOGICZNE, BROŃ BIOLOGICZNA, ZEGAR BIOLOGICZNY, OJCIEC BIOLOGICZNY. Это общее правило польской терминологии, уже знакомое по MUZYKA KLASYCZNA. В разговоре о родстве порядок тот же: MATKA BIOLOGICZNA «биологическая мать», в противопоставление MATKA ZASTĘPCZA «приёмная мать»." }
  - { kind: pronunciation, text: "Читается «бьологи́чны», пять слогов, ударение на предпоследнем. Буква I после B работает знаком мягкости, поэтому начало звучит «бьо», а не «би-о» в два слога. Сочетание GI даёт мягкое «ги». Сочетание CZ — твёрдое «ч», а конечное Y — «ы». В существительном BIOLOGIA слышно «бьоло́гя», и там ударение падает на третий слог от конца, потому что IA сливается в один." }
  - { kind: false-friend, text: "Ловушки в самом слове нет, зато есть в его ближайшем соседе по смыслу. Русское «биологический отец» и польское OJCIEC BIOLOGICZNY совпадают полностью, а вот приёмного родителя поляк назовёт RODZIC ZASTĘPCZY, буквально «заместительный», и слово ZASTĘPCZY стоит запомнить отдельно: оно значит «замещающий», а не «застенчивый». Отдельно: BIOLOGICZKA в школьном жаргоне значит «учительница биологии», и это слово разговорное." }
  - { kind: register, text: "Слово книжное и терминологическое, но два его сочетания совершенно бытовые. ZEGAR BIOLOGICZNY «биологические часы» говорят о возрасте и о сне, а RODZICE BIOLOGICZNI «биологические родители» — обычное слово в разговорах об усыновлении. Остальное принадлежит науке и документам: NAUKI BIOLOGICZNE, ODPADY BIOLOGICZNE «биологические отходы», BROŃ BIOLOGICZNA. Школьный предмет называется просто BIOLOGIA." }
