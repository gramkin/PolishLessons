# review
id: zanurzyc
format: 2
lemma: "zanurzyć"
rank: 6045
pos: verb
aspect: perf
pron: { cyr: "зану́жыць" }
senses:
  - id: dip
    ru: "окунуть, погрузить (w czymś — во что-л.)"
    examples:
      - pl: "Zanurzyłem palec w miodzie."
        ru: "Я окунул палец в мёд."
        source: { kind: translated, id: 4815425 }
      - pl: "Ptak zanurzył głowę w wodzie."
        ru: "Птица окунула голову в воду."
        source: { kind: translated, id: 12291760 }
      - pl: "Uczestnicy zanurzyli ręce w lodowatej wodzie."
        ru: "Участники погрузили руки в ледяную воду."
        source: { kind: translated, id: 13081734 }
  - id: immerse-oneself
    ru: "zanurzyć się — погрузиться, нырнуть; перен. углубиться (в чтение, мысли)"
    examples:
      - pl: "Łódź podwodna zanurzyła się na sto metrów."
        ru: "Подводная лодка погрузилась на сто метров."
        source: { kind: authored }
      - pl: "Zanurzyła się w lekturze i zapomniała o obiedzie."
        ru: "Она погрузилась в чтение и забыла об обеде."
        source: { kind: authored }
notes:
  - { kind: government, text: "Куда погружают — W + ПРЕДЛОЖНЫЙ, а не винительный, как в русском: zanurzyć palec w miodzie, «окунуть палец в мёд», zanurzyć się w wodzie. Польский мыслит результатом — палец оказывается в мёде. Так же перен.: zanurzyć się w myślach, w lekturze, «погрузиться в мысли, в чтение»." }
  - { kind: usage, text: "Совершенный вид, пара — ZANURZAĆ. Без SIĘ — погрузить что-то: ręce, głowę, łyżkę. С SIĘ — погрузиться самому: nurek, łódź podwodna, pływak. Причастие ZANURZONY, «погружённый»: zanurzony w myślach, «погружённый в мысли»." }
  - { kind: pronunciation, text: "«зану́жыць»: RZ — «ж», Y — «ы», конечное Ć — «ць». Ударение на предпоследнем слоге NU." }
  - { kind: register, text: "Нейтральное. В быту о коротком окунании чаще MACZAĆ, «макать»: maczać chleb w sosie; ZANURZYĆ — глубже и дольше." }
collocations:
  - { pl: "zanurzyć się w wodzie", ru: "погрузиться в воду" }
  - { pl: "zanurzyć się w myślach", ru: "погрузиться в мысли" }
  - { pl: "zanurzyć ręce", ru: "погрузить руки" }
  - { pl: "zanurzony w lekturze", ru: "погружённый в чтение" }
family:
  - { pl: "zanurzać", ru: "погружать", relation: aspect }
  - { pl: "nurek", ru: "водолаз, дайвер", relation: root }
  - { pl: "zanurzenie", ru: "погружение; осадка", relation: derived }
etymology: "От NURZAĆ, «окунать, купать», праславянского *nurъ, *noriti, того же корня, что русское «нырять», «нора» и польское NUREK, «водолаз». ZA- даёт совершенный вид и значение «целиком, с головой»."
memory: "Zanurzyć — от того же корня, что «нырять» и nurek, «водолаз». ВО ЧТО — w + предложный: zanurzyć palec w miodzie. Zanurzyć się w myślach — погрузиться в мысли."
idioms:
  - { pl: "zanurzyć się w myślach", ru: "погрузиться в свои мысли" }
