notes:
  - { kind: false-friend, text: "Здесь спрятан СИСТЕМНЫЙ закон, и он стоит больше самого слова. Польское wię- отвечает русскому у- в этом корне: więzień — «узник», więzy — «узы», węzeł — «узел», wiązać — «вязать». Носовой ę там, где русский даёт у. Узнав это соответствие, вы читаете целое гнездо слов без словаря — так же, как с законами -dł-/-л- (mydło — «мыло») и ę/у (mąż — «муж»)." }
  - { kind: usage, text: "Отглагольное существительное więzienie стало обычным названием ТЮРЬМЫ, и именно в этом значении встречается на каждом шагу: iść do więzienia, siedzieć w więzieniu. Помнить о связи с глаголом полезно: тюрьма — это место, где человека «держат в узах»." }
  - { kind: government, text: "Держат КОГО — винительный: więzić kogoś. Где — W с ПРЕДЛОЖНЫМ: więzić w piwnicy, w obozie. За что — ZA с винительным: więziony ZA wiersze. Все три схемы совпадают с русскими." }
  - { kind: pronunciation, text: "ПРАВИЛО, которое стоит усвоить один раз. В польском настоящем времени первое лицо единственного и третье лицо множественного ведут себя ОДИНАКОВО и отличаются от всех клеток между ними. Здесь: więżę и więżą с ж, но więzisz, więzi, więzimy, więzicie с зь; и zasnę, zasną с твёрдым s, но zaśniesz, zaśnie, zaśniemy, zaśniecie с сь. То же у piekę/pieką против pieczesz и wpuszczę/wpuszczą против wpuścisz. Края парадигмы держатся вместе против её середины." }
