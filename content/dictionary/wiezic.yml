  - { pl: "wiązać", ru: "вязать, связывать", relation: root }
etymology: "От więzy «узы», праславянское *vęzati «вязать». Русские «узы», «узник», «узел» и «вязать» — из того же гнезда, и соответствие регулярно: польский носовой ę отвечает русскому у. Отсюда węzeł при «узле», więzień при «узнике», wiązać при «вязать». Тюрьма, więzienie, буквально «место, где держат в узах»."
memory: "więzić — «держать в заключении», от więzy «узы». Запомните соответствие: польское wię- это русское у- (więzień — «узник», węzeł — «узел»). И więzienie значит «тюрьма» — именно так это слово и встречается чаще всего."
