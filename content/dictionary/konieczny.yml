formExamples:
  - form: "konieczna"
    pl: "Czy konieczna jest rezerwacja miejsca?"
    ru: "Необходима ли резервация места?"
    source: { kind: translated, id: 3712750 }
  - form: "konieczna"
    pl: "Żyzna ziemia jest konieczna dla rolnictwa."
    ru: "Плодородная земля необходима для сельского хозяйства."
    source: { kind: translated, id: 12438397 }
  - form: "konieczna"
    pl: "Konieczna jest wcześniejsza rezerwacja miejsca."
    ru: "Необходима предварительная резервация места."
    source: { kind: translated, id: 935233 }
  - form: "konieczną"
    pl: "I tak każdy obywatel odgrywa konieczną rolę."
    ru: "И так каждый гражданин играет необходимую роль."
    source: { kind: translated, id: 897753 }
  - form: "konieczną"
    pl: "Było bezwzględnie konieczną rzeczą, by Tomek interweniował osobiście."
    ru: "Было совершенно необходимо, чтобы Томек вмешался лично."
    source: { kind: translated, id: 11318566 }
  - form: "konieczną"
    pl: "Uznali tę zmianę za konieczną."
    ru: "Они сочли это изменение необходимым."
    source: { kind: authored }
  - form: "konieczne"
    pl: "Jest konieczne."
    ru: "Это необходимо."
    source: { kind: translated, id: 12449986 }
  - form: "konieczne"
    pl: "Czy to konieczne?"
    ru: "Это необходимо?"
    source: { kind: translated, id: 8496182 }
  - form: "konieczne"
    pl: "Czy to jest absolutnie konieczne?"
    ru: "Это абсолютно необходимо?"
    source: { kind: tatoeba, id: 5999401 }
  - form: "koniecznej"
    pl: "Podczas procesu utrzymywał, że działał w ramach obrony koniecznej, i został oczyszczony z zarzutów."
    ru: "Во время процесса он утверждал, что действовал в рамках необходимой обороны, и был оправдан."
    source: { kind: translated, id: 3749353 }
  - form: "koniecznej"
    pl: "Nie ma koniecznej potrzeby."
    ru: "Нет настоятельной необходимости."
    source: { kind: authored }
  - form: "koniecznej"
    pl: "Mówimy o koniecznej zmianie."
    ru: "Мы говорим о необходимом изменении."
    source: { kind: authored }
  - form: "konieczny"
    pl: "Tylko szkoda, że konieczny jest własny grób."
    ru: "Жаль только, что необходима собственная могила."
    source: { kind: translated, id: 2280685 }
  - form: "konieczny"
    pl: "Zaufanie jest uważane jako warunek konieczny miłości."
    ru: "Доверие считается необходимым условием любви."
    source: { kind: translated, id: 2250880 }
  - form: "konieczny"
    pl: "Jajko stanowi konieczny dodatek w wielu przepisach kulinarnych."
    ru: "Яйцо — необходимая добавка во многих кулинарных рецептах."
    source: { kind: translated, id: 989486 }
