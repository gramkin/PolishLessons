    pl: "Szukam sprzętu koniecznego do pracy."
    ru: "Я ищу оборудование, необходимое для работы."
    source: { kind: authored }
  - form: "koniecznego"
    pl: "Od remontu koniecznego od lat nie ma ucieczki."
    ru: "От ремонта, необходимого уже годы, не уйти."
    source: { kind: authored }
  - form: "koniecznej"
    cell: "Родительный"
    pl: "Podczas procesu utrzymywał, że działał w ramach obrony koniecznej, i został oczyszczony z zarzutów."
    ru: "Во время процесса он утверждал, что действовал в рамках необходимой обороны, и был оправдан."
    source: { kind: translated, id: 3749353 }
  - form: "koniecznej"
    cell: "Родительный"
