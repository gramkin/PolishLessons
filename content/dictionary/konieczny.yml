# review
id: konieczny
format: 2
lemma: "konieczny"
rank: 1867
pos: adj
pron: { cyr: "коне́чны" }
senses:
  - id: necessary
    ru: "необходимый, нужный"
    examples:
      - pl: "Jest konieczne."
        ru: "Это необходимо."
        source: { kind: translated, id: 12449986 }
      - pl: "Czy to konieczne?"
        ru: "Это необходимо?"
        source: { kind: translated, id: 8496182 }
      - pl: "Czy to jest absolutnie konieczne?"
        ru: "Это абсолютно необходимо?"
        source: { kind: tatoeba, id: 5999401 }
  - id: necessary-for
    ru: "необходимый для чего-либо"
    examples:
      - pl: "Żyzna ziemia jest konieczna dla rolnictwa."
        ru: "Плодородная земля необходима для сельского хозяйства."
        source: { kind: translated, id: 12438397 }
      - pl: "Konieczna jest wcześniejsza rezerwacja miejsca."
        ru: "Необходима предварительная резервация места."
        source: { kind: translated, id: 935233 }
      - pl: "Dla zdrowej demokracji konieczna jest rywalizacja dwóch partii."
        ru: "Для здоровой демократии необходимо соперничество двух партий."
        source: { kind: translated, id: 702926 }
notes:
  - { kind: government, text: "Необходимый для чего-то — konieczny dla czegoś (родительный с dla) или do czegoś: konieczny dla rolnictwa." }
  - { kind: usage, text: "Средний род konieczne работает безлично: To konieczne «Это необходимо», Czy to konieczne? «Это обязательно?»" }
  - { kind: usage, text: "warunek konieczny — «необходимое условие»; obrona konieczna — «необходимая оборона», юридический термин." }
  - { kind: false-friend, text: "Рядом живёт potrzebny «нужный». konieczny сильнее: без него нельзя обойтись вовсе." }
  - { kind: government, text: "Прилагательное называет безусловное свойство, поэтому степеней сравнения не образует: вещь либо konieczna, либо нет. При необходимости говорят bardziej konieczny." }
collocations:
  - { pl: "to konieczne", ru: "это необходимо" }
  - { pl: "warunek konieczny", ru: "необходимое условие" }
  - { pl: "obrona konieczna", ru: "необходимая оборона" }
family:
  - { pl: "konieczność", ru: "необходимость", relation: root }
  - { pl: "potrzebny", ru: "нужный", relation: root, id: potrzebny }
  - { pl: "koniec", ru: "конец", relation: root }
etymology: "От koniec «конец»: то, без чего дело не доводится до конца. Русское «необходимый» построено от «обойти» — то, чего не обойти."
memory: "konieczny — «необходимый», сильнее, чем potrzebny «нужный». Для чего — konieczny dla czegoś. Средний род работает безлично: To konieczne."
idioms:
  - { pl: "to konieczne", ru: "это необходимо" }
  - { pl: "warunek konieczny", ru: "необходимое условие" }
  - { pl: "obrona konieczna", ru: "необходимая оборона" }
