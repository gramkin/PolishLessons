  - form: "koniecznego"
    pl: "Nie ma tu nic koniecznego."
    ru: "Здесь нет ничего необходимого."
    source: { kind: authored }
  - form: "koniecznego"
    pl: "Szukam sprzętu koniecznego do pracy."
    ru: "Я ищу оборудование, необходимое для работы."
    source: { kind: authored }
  - form: "koniecznego"
    pl: "Od remontu koniecznego od lat nie ma ucieczki."
    ru: "От ремонта, необходимого уже годы, не уйти."
    source: { kind: authored }
  - form: "koniecznej"
    pl: "Podczas procesu utrzymywał, że działał w ramach obrony koniecznej, i został oczyszczony z zarzutów."
    ru: "Во время процесса он утверждал, что действовал в рамках необходимой обороны, и был оправдан."
    source: { kind: translated, id: 3749353 }
  - form: "koniecznej"
    pl: "Nie ma koniecznej potrzeby."
    ru: "Нет настоятельной необходимости."
    source: { kind: authored }
  - form: "koniecznej"
    pl: "Mówimy o koniecznej zmianie."
    ru: "Мы говорим о необходимом изменении."
    source: { kind: authored }
  - form: "koniecznemu"
    pl: "Koniecznemu remontowi nikt się nie sprzeciwi."
    ru: "Необходимому ремонту никто не воспротивится."
    source: { kind: authored }
  - form: "koniecznemu"
    pl: "Przyjrzyj się temu koniecznemu wydatkowi."
    ru: "Присмотрись к этому необходимому расходу."
    source: { kind: authored }
  - form: "koniecznemu"
    pl: "Daj pierwszeństwo koniecznemu zabiegowi."
    ru: "Отдай предпочтение необходимой операции."
    source: { kind: authored }
  - form: "konieczni"
    pl: "Do tej pracy konieczni są specjaliści."
    ru: "Для этой работы необходимы специалисты."
    source: { kind: authored }
  - form: "konieczni"
    pl: "Konieczni okazali się tłumacze."
    ru: "Необходимыми оказались переводчики."
    source: { kind: authored }
  - form: "konieczni"
    pl: "Na budowie konieczni są elektrycy."
    ru: "На стройке необходимы электрики."
    source: { kind: authored }
  - form: "konieczny"
    pl: "Tylko szkoda, że konieczny jest własny grób."
    ru: "Жаль только, что необходима собственная могила."
    source: { kind: translated, id: 2280685 }
  - form: "konieczny"
    pl: "Zaufanie jest uważane jako warunek konieczny miłości."
    ru: "Доверие считается необходимым условием любви."
    source: { kind: translated, id: 2250880 }
  - form: "konieczny"
    pl: "Jajko stanowi konieczny dodatek w wielu przepisach kulinarnych."
    ru: "Яйцо — необходимая добавка во многих кулинарных рецептах."
    source: { kind: translated, id: 989486 }
  - form: "koniecznych"
    pl: "Nie ma tu koniecznych narzędzi."
    ru: "Здесь нет необходимых инструментов."
    source: { kind: authored }
  - form: "koniecznych"
    pl: "Wśród koniecznych wydatków jest i ten."
    ru: "Среди необходимых расходов есть и этот."
    source: { kind: authored }
  - form: "koniecznych"
    pl: "Liczba koniecznych poprawek rośnie."
    ru: "Число необходимых поправок растёт."
    source: { kind: authored }
  - form: "koniecznym"
    pl: "W koniecznym zakresie remont wykonano."
    ru: "В необходимом объёме ремонт выполнили."
    source: { kind: authored }
  - form: "koniecznym"
    pl: "Koniecznym wydatkom nie da się zapobiec."
    ru: "Необходимых расходов не избежать."
    source: { kind: authored }
  - form: "koniecznym"
    pl: "Z koniecznym remontem dłużej nie zwlekaj."
    ru: "С необходимым ремонтом больше не тяни."
    source: { kind: authored }
  - form: "koniecznymi"
    pl: "Zajmujemy się koniecznymi poprawkami."
    ru: "Мы занимаемся необходимыми поправками."
    source: { kind: authored }
  - form: "koniecznymi"
    pl: "Między koniecznymi a pożądanymi zmianami jest różnica."
    ru: "Между необходимыми и желательными переменами есть разница."
    source: { kind: authored }
  - form: "koniecznymi"
    pl: "Z koniecznymi wydatkami trzeba się liczyć."
    ru: "С необходимыми расходами надо считаться."
    source: { kind: authored }
