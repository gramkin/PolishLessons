id: milion
format: 2
lemma: "milion"
rank: 506
pos: noun
pron: { cyr: "ми́льон" }
senses:
  - id: million
    ru: "миллион"
    examples:
      - pl: "Co byś zrobił gdybyś miał milion dolarów?"
        ru: "Если бы у тебя был миллион долларов, что бы ты сделал?"
        source: { kind: tatoeba, id: 3460219 }
      - pl: "W wojnie zginęło milion osób."
        ru: "На войне погиб миллион человек."
        source: { kind: translated, id: 3634748 }
      - pl: "Mam trzynaście milionów dolarów."
        ru: "У меня тринадцать миллионов долларов."
        source: { kind: translated, id: 12188795 }
  - id: millions
    ru: "миллионы: великое множество"
    examples:
      - pl: "Miliony ludzi straciło pracę."
        ru: "Миллионы людей потеряли работу."
        source: { kind: tatoeba, id: 3660922 }
      - pl: "W kosmosie są miliony gwiazd."
        ru: "В космосе миллионы звёзд."
        source: { kind: translated, id: 522736 }
      - pl: "Ostatni bóg zmarł miliony lat temu."
        ru: "Последний бог умер миллионы лет назад."
        source: { kind: translated, id: 11261095 }
notes:
  - { kind: usage, text: "После milion существительное стоит в родительном множественного, как в русском: milion dolarów «миллион долларов», milion osób «миллион человек»." }
  - { kind: usage, text: "pytanie za milion — «вопрос на миллион», то есть самый трудный и важный вопрос." }
  - { kind: usage, text: "Ударение всегда на предпоследнем слоге, поэтому оно сдвигается при склонении: MIlion, но milioNAmi, milioNAch." }
  - { kind: usage, text: "Разговорное miliony razy «миллион раз» — обычное преувеличение, как и в русском." }
collocations:
  - { pl: "milion dolarów", ru: "миллион долларов" }
  - { pl: "pytanie za milion", ru: "вопрос на миллион" }
  - { pl: "miliony ludzi", ru: "миллионы людей" }
  - { pl: "kilka milionów", ru: "несколько миллионов" }
etymology: "Французское million, из итальянского milione «большая тысяча», от латинского mille «тысяча». Русское «миллион» — то же заимствование."
memory: "milion — «миллион», слово международное, из итальянского milione «большая тысяча». Управление такое же, как в русском: после milion существительное идёт в родительном множественного — milion dolarów, milion osób. Ударение на предпоследнем слоге, поэтому при склонении оно сдвигается: MIlion, но milioNAmi."
idioms:
