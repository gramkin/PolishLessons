# review
id: wtedy
format: 2
lemma: "wtedy"
rank: 202
pos: adv
pron: { cyr: "фтэ́ды" }
senses:
  - id: then
    ru: "тогда, в тот момент"
    examples:
      - pl: "Co pan wtedy robił?"
        ru: "Что Вы тогда делали?"
        source: { kind: tatoeba, id: 659760 }
      - pl: "Już wtedy wiedziałem, kim będę."
        ru: "Я уже тогда знал, кем буду."
        source: { kind: tatoeba, id: 13084391 }
      - pl: "Wtedy na wyspie nikt nie mieszkał."
        ru: "Тогда на острове никто не жил."
        source: { kind: tatoeba, id: 744073 }
  - id: when-then
    ru: "тогда (в паре с kiedy: wtedy, kiedy…)"
    examples:
      - pl: "On krzyczy tylko wtedy, kiedy jest głodny."
        ru: "Он кричит только тогда, когда голоден."
        source: { kind: tatoeba, id: 2519064 }
      - pl: "On przyszedł właśnie wtedy, kiedy wychodziłem."
        ru: "Он пришел как раз, когда я уходил."
        source: { kind: tatoeba, id: 3660799 }
      - pl: "Pamiętam, że wtedy mnie to zdziwiło."
        ru: "Помнится, меня это тогда удивило."
        source: { kind: tatoeba, id: 13547151 }
notes:
  - { kind: usage, text: "wtedy указывает на момент времени. «Тогда» в значении «в таком случае» передаётся словом to: Nie chcesz? To nie idziemy." }
  - { kind: usage, text: "Пара wtedy, kiedy… отвечает русскому «тогда, когда…»: Przyjdę wtedy, kiedy skończę." }
collocations:
  - { pl: "od wtedy", ru: "с тех пор" }
  - { pl: "wtedy, kiedy", ru: "тогда, когда" }
  - { pl: "właśnie wtedy", ru: "как раз тогда" }
  - { pl: "dopiero wtedy", ru: "только тогда" }
etymology: "Из w + tedy «тем путём, в то время»; русское «тогда» образовано от того же указательного корня."
memory: "wtedy — «тогда» о моменте времени. А «тогда» в смысле «в таком случае» — это to: Nie chcesz? To nie idziemy."
idioms:
