# review
id: glownie
format: 2
lemma: "głównie"
rank: 2349
pos: adv
pron: { cyr: "гуу́вне" }
senses:
  - id: mainly
    ru: "главным образом, в основном"
    examples:
      - pl: "Mieszkają tu głównie studenci."
        ru: "Здесь живут в основном студенты."
        source: { kind: authored }
      - pl: "Zajmuje się głównie tłumaczeniami."
        ru: "Он занимается главным образом переводами."
        source: { kind: authored }
  - id: above-all
    ru: "прежде всего"
    examples:
      - pl: "Chodzi głównie o pieniądze."
        ru: "Речь идёт прежде всего о деньгах."
        source: { kind: authored }
      - pl: "Głównie dlatego się spóźnił."
        ru: "Главным образом поэтому он опоздал."
        source: { kind: authored }
  - id: chiefly
    ru: "преимущественно"
    examples:
      - pl: "Towar idzie głównie na eksport."
        ru: "Товар идёт преимущественно на экспорт."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ЦЕПОЧКА ТА ЖЕ, ЧТО В РУССКОМ, ЗВЕНО В ЗВЕНО. Głowa «голова» даёт główny «главный», а тот — głównie «главным образом»; по-русски «голова» даёт «главный», а тот — «главным образом». Разница только в том, что польский обошёлся одним наречием там, где русскому нужны два слова." }
  - { kind: usage, text: "Синонимы расходятся по оттенкам: przede wszystkim «прежде всего» ставит на первое место, przeważnie «преимущественно» говорит о большинстве случаев, głównie — о главной части. В начале фразы głównie звучит тяжеловато; чаще оно стоит перед тем словом, к которому относится." }
  - { kind: pronunciation, text: "Два слога, ударение на первом: GŁÓW-nie. Ó читается как у, ł — как краткое у, поэтому начало слова звучит почти как долгое «гуу»: «гуу́вне». W перед n остаётся звонким." }
  - { kind: register, text: "Нейтрально, частотно в письменной и устной речи. Формы główniej и najgłówniej существуют в таблице, но в живом языке почти не встречаются: «главнее» обычно говорят иначе — ważniejsze, przede wszystkim." }
collocations:
  - { pl: "głównie dlatego", ru: "главным образом поэтому" }
  - { pl: "chodzi głównie o", ru: "речь идёт прежде всего о" }
  - { pl: "głównie z powodu", ru: "в основном из-за" }
family:
  - { pl: "główny", ru: "главный", relation: root, id: glowny }
  - { pl: "głowa", ru: "голова", relation: root, id: glowa }
  - { pl: "przede wszystkim", ru: "прежде всего", relation: derived }
etymology: "От główny «главный», а тот — от głowa «голова», из праславянского *golva — того же слова, что русская «голова». Главное — то, что стоит во главе. Русская цепочка «голова — главный — главным образом» повторяет польскую звено в звено. Отсюда głównie, najgłówniej, nagłówek «заголовок»."
memory: "głównie — «главным образом», от główny «главный», от głowa «голова». Цепочка та же, что в русском. Читается с долгим у: «гуу́вне»."
idioms:
  - { pl: "chodzi głównie o to", ru: "дело прежде всего в том" }
  - { pl: "głównie z tego powodu", ru: "главным образом по этой причине" }
