# review
id: milo
format: 2
lemma: "miło"
rank: 3619
pos: adv
pron: { cyr: "ми́уо" }
senses:
  - id: pleasantly
    ru: "мило, приятно"
    examples:
      - pl: "Jak miło z twojej strony!"
        ru: "Как мило с твоей стороны!"
        source: { kind: translated, id: 3605034 }
      - pl: "To bardzo miło z twojej strony."
        ru: "Это очень мило с твоей стороны."
        source: { kind: translated, id: 557742 }
      - pl: "Miło ze strony Toma, że pożyczył Ci swój parasol."
        ru: "Мило со стороны Тома, что он одолжил тебе зонтик."
        source: { kind: translated, id: 10149461 }
  - id: pleasant-to
    ru: "в безличном обороте — приятно"
    examples:
      - pl: "Miło mi słyszeć pański głos."
        ru: "Приятно слышать ваш голос."
        source: { kind: translated, id: 5907098 }
      - pl: "Było nam bardzo miło."
        ru: "Нам было очень приятно."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Наречие от miły «милый». Две главные роли: оценка поступка — miło z twojej strony «мило с твоей стороны» — и безличное «приятно» с дательным: miło mi." }
  - { kind: usage, text: "Степени образуются правильно: milej «милее, приятнее», najmilej «приятнее всего»." }
  - { kind: government, text: "В безличном обороте лицо стоит в дательном падеже: miło mi, miło nam, było jej miło." }
  - { kind: false-friend, text: "Русское «мило» уже по значению: польское miło покрывает и «приятно», и «славно», и входит в формулу знакомства miło mi." }
collocations:
  - { pl: "miło mi", ru: "очень приятно" }
  - { pl: "miło z twojej strony", ru: "мило с твоей стороны" }
  - { pl: "było mi miło", ru: "мне было приятно" }
family:
  - { pl: "miły", ru: "милый, приятный", relation: root }
  - { pl: "milutki", ru: "премилый", relation: derived }
etymology: "Наречие от miły «милый» — праславянского слова, прямо совпадающего с русским «милый». Русское «мило» и польское miło соответствуют друг другу, но польское шире и значит ещё «приятно»."
memory: "miło — и «мило», и «приятно». В безличном обороте лицо идёт в дательном: miło mi «мне приятно». Степени: milej, najmilej."
idioms:
  - { pl: "miło mi", ru: "очень приятно" }
  - { pl: "miło z czyjejś strony", ru: "мило с чьей-то стороны" }
