notes:
  - { kind: usage, text: "Относительное прилагательное: степеней сравнения нет и быть не может, потому что договор не бывает «более торговым». Отсюда одиннадцать форм, а не тридцать три — ровно та же картина, что у TELEFONICZNY. Сочетания стоит выучить блоком, они частотны: CENTRUM HANDLOWE «торговый центр», UMOWA HANDLOWA, PRZEDSTAWICIEL HANDLOWY «торговый представитель», SZKOŁA HANDLOWA, BILANS HANDLOWY «торговый баланс». В повседневной речи CENTRUM HANDLOWE часто сокращают до GALERIA, и вывеску надо узнавать." }
  - { kind: pronunciation, text: "Читается «хандло́вы», ударение на предпоследнем слоге. Начальное H даёт «х», как и CH: в польском эти две буквы звучат одинаково, и различает их только правописание. Сочетание DL произносится слитно, без гласной между Д и Л. Конечное Y — русское «ы». Мужско-личная форма HANDLOWI звучит «хандло́ви», с мягким w перед i." }
  - { kind: government, text: "Прилагательное согласуется с существительным и само ничем не управляет. Образовано от существительного HANDEL «торговля» суффиксом -OWY, и при образовании беглая гласная E выпадает: HANDEL, но HANDLOWY, HANDLU, HANDLEM. Это та же механика, что в WYSIŁEK и WYSIŁKU. Предмет торговли при существительном вводится предлогом Z с творительным: HANDEL Z ZAGRANICĄ «торговля с заграницей», а отрасль — предлогом W с местным: HANDEL W INTERNECIE." }
  - { kind: false-friend, text: "Ловушки в значении нет, но есть в корне: HANDEL — это не «гандель» и ничего общего с русскими словами не имеет, потому что пришло из немецкого HANDEL «торговля», от HAND «рука» — торговля как передача из рук в руки. Русское «торговля» идёт от «торг», славянского корня, родственного польскому TARG «рынок, базар». Получается полезная пара: польское TARG отвечает русскому «торгу», а польский HANDEL русской «торговле», и слово с немецким корнем в польском оказалось главным, а славянское сузилось до рынка." }
