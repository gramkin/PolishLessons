etymology: "От HANDEL «торговля», заимствованного из немецкого HANDEL, которое само от HAND «рука» и глагола HANDELN «действовать, торговать»: исходный образ — передача товара из рук в руки. Слово пришло в польский в позднем средневековье, вместе с немецким городским правом и купеческими цехами, и вытеснило славянское обозначение в сторону рынка: TARG остался названием места и дня торга, а HANDEL стал названием занятия. Русский сохранил славянский корень в полном объёме: «торг», «торговля», «торговать», «торговец». Суффикс -OWY, которым собрано прилагательное, в польском исключительно част и всегда даёт относительное значение, без степеней сравнения: HANDLOWY, PAŃSTWOWY, DOMOWY."
memory: "Относительное прилагательное: степеней нет, отсюда одиннадцать форм, как у telefoniczny. От handel «торговля», а это немецкое Hand «рука» — товар из рук в руки. Славянский корень в польском сузился: targ значит «рынок», а не «торговлю». Беглое e выпадает: handel, но handlowy, handlu."
