etymology: "От dzienny «дневной», а то от DZIEŃ, из праславянского *dьnь — того же слова, что русский «день». Наречие образовано суффиксом -e, как и большинство польских наречий от прилагательных: dokładny — dokładnie, uważny — uważnie, dzienny — dziennie. Русский на этом месте пошёл другим путём и собрал предложный оборот «в день»."
memory: "Одна-единственная форма, степеней нет вовсе. И переводится оборотом, а не словом: dwa razy dziennie — «два раза в день»."
