notes:
  - { kind: usage, text: "У ЭТОГО НАРЕЧИЯ ВСЕГО ОДНА ФОРМА — И ЭТО ВСЯ ПАРАДИГМА. Ни сравнительной, ни превосходной степени у него нет: «ежедневнее» бессмысленно и по-польски, и по-русски. Сравни с uważnie и wyłącznie, у которых по три формы: там признак градуируется, здесь он просто считает сутки. Так что dziennie — самая короткая словарная статья, какая бывает." }
  - { kind: false-friend, text: "Переводится оно не словом, а оборотом: DZIENNIE — это русское «В ДЕНЬ». Слова «дневно» у нас нет, и калька невозможна. Dwa razy dziennie «два раза в день», raz dziennie «раз в день». Осторожно с соседями по гнезду: DZIENNY значит «дневной» (światło dzienne «дневной свет»), а DZIENNIK — и «дневник», и «газета», и «выпуск новостей»." }
