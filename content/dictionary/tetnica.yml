etymology: "От TĘTNO «пульс», слова звукоподражательного: корень передавал стук, биение. Артерию назвали по тому, что в ней чувствуется удар сердца. Русский своего слова на это не построил и взял греческое «артерия», от названия сосуда у древних врачей. Польский же греческое слово приберёг для улиц и дорог, и получилось редкое распределение: своё слово для тела, чужое для города."
memory: "Артерия, но слово своё, не греческое: tetnica от tetno «пульс», то есть «пульсирующая». А греческое arteria поляк отдал дорогам: arteria komunikacyjna это «транспортная артерия». Значит, про сосуд — tetnica, про улицу — arteria. Читается «тэнтни́ца», где e с хвостиком перед t даёт «эн». Прилагательное tetniczy: cisnienie tetnicze «артериальное давление»."
idioms:
