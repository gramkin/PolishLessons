notes:
  - { kind: false-friend, text: "Здесь языки поменялись словами, и это стоит запомнить. Русская «артерия» — греческое слово, и годится у нас и для сосуда, и для дороги: «транспортная артерия». Поляк для сосуда построил своё слово от TĘTNO «пульс»: TĘTNICA это «та, что пульсирует». А греческое ARTERIA он отдал дорогам: ARTERIA KOMUNIKACYJNA. Так что про сосуд говорят TĘTNICA, про улицу — ARTERIA, и путать их нельзя." }
  - { kind: usage, text: "Десять форм, женский род, основа на -CA. Родительный, дательный и местный единственного числа совпадают: все три дают TĘTNICY. В родительном множественного окончания нет: TĘTNIC. Носовой Ę держится во всех формах. Прилагательное TĘTNICZY значит «артериальный»: CIŚNIENIE TĘTNICZE — «артериальное давление»." }
  - { kind: government, text: "Прижать артерию — UCISKAĆ TĘTNICĘ, винительный без предлога. В артерии — W TĘTNICY, местный падеж. Разрыв артерии — PĘKNIĘCIE TĘTNICY, родительный. Между артерией и веной — MIĘDZY TĘTNICĄ A ŻYŁĄ, творительный после MIĘDZY, и заметьте, что второй член вводится через A, а не через I." }
  - { kind: pronunciation, text: "Читается «тэнтни́ца», четыре слога, ударение на предпоследнем. Носовой Ę перед T даёт «эн», поэтому начало слова это «тэнт». Дальше идёт NI с мягким «н»: «тни». В форме TĘTNICY конечное Y даёт «ы»: «тэнтни́цы». Трудность здесь в скоплении согласных «нтн», и его надо произносить полностью." }
  - { kind: register, text: "Слово медицинское, но известное каждому: TĘTNICA SZYJNA «шейная артерия», TĘTNICE WIEŃCOWE «коронарные артерии», TĘTNICA GŁÓWNA «главная артерия», то есть аорта. В обиходной речи встречается в разговоре о давлении: CIŚNIENIE TĘTNICZE. Существительное TĘTNO «пульс» и глагол TĘTNIĆ «пульсировать» того же корня и тоже вполне обиходны." }
