id: cos
format: 2
lemma: "coś"
rank: 41
pos: noun
pron: { cyr: "цось" }
senses:
  - id: something
    ru: "что-то, что-нибудь"
    examples:
      - pl: "Zrób coś!"
        ru: "Сделай что-нибудь!"
        source: { kind: tatoeba, id: 351458 }
      - pl: "Coś widzę."
        ru: "Я что-то вижу."
        source: { kind: tatoeba, id: 4735347 }
      - pl: "Słyszę coś."
        ru: "Я что-то слышу."
        source: { kind: tatoeba, id: 635807 }
  - id: anything
    ru: "что-нибудь (в вопросе)"
    examples:
      - pl: "Chciałeś czegoś?"
        ru: "Ты чего-то хотел?"
        source: { kind: tatoeba, id: 6328182 }
      - pl: "Napijesz się czegoś?"
        ru: "Выпьешь чего-нибудь?"
        source: { kind: tatoeba, id: 2146146 }
notes:
  - { kind: usage, text: "Склоняется как co с частицей -ś: czegoś, czemuś, czymś." }
  - { kind: false-friend, text: "czemuś в живой речи чаще значит «почему ты» (czemu + ś), а не «чему-то». Различайте по контексту." }
collocations:
  - { pl: "coś takiego", ru: "нечто подобное" }
  - { pl: "coś nowego", ru: "что-то новое" }
etymology: "Из co с частицей -ś (по происхождению — форма глагола «быть»): буквально «что-то есть»."
memory: "coś = «что-то», склоняется как co: czegoś, czemuś, czymś. Осторожно с czemuś: в разговоре это почти всегда «почему ты» (czemu + ś), а дательный падеж от coś встречается редко."
idioms:
  - { pl: "coś za coś", ru: "услуга за услугу, ничего даром" }
  - { pl: "coś na ząb", ru: "чего-нибудь перекусить" }
