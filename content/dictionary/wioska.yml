# review
id: wioska
format: 2
lemma: "wioska"
rank: 1604
pos: noun
pron: { cyr: "вё́ска" }
senses:
  - id: village
    ru: "деревня, деревушка"
    examples:
      - pl: "Nasza szkoła jest w tej wiosce."
        ru: "Наша школа находится в этой деревне."
        source: { kind: tatoeba, id: 713447 }
      - pl: "Dorastał w małej wiosce."
        ru: "Он вырос в маленькой деревне."
        source: { kind: translated, id: 716711 }
      - pl: "Urodziła się w małej wiosce."
        ru: "Она родилась в маленькой деревне."
        source: { kind: translated, id: 1594619 }
  - id: the-village
    ru: "деревня (как место и как целое)"
    examples:
      - pl: "Burza spustoszyła wioskę."
        ru: "Буря опустошила деревню."
        source: { kind: translated, id: 357906 }
      - pl: "Tornado zniszczyło całą wioskę."
        ru: "Торнадо уничтожило всю деревню."
        source: { kind: translated, id: 3051109 }
      - pl: "Ludzie mieszkali w wioskach."
        ru: "Люди жили в деревнях."
        source: { kind: tatoeba, id: 13225452 }
notes:
  - { kind: usage, text: "wioska — уменьшительное от wieś «деревня, село»; звучит теплее и меньше. Официальное слово — wieś." }
  - { kind: government, text: "«В деревне» — we wsi или w wiosce (предложный); «в деревню» — do wioski (родительный с do)." }
  - { kind: usage, text: "globalna wioska — «глобальная деревня», wioska olimpijska — «олимпийская деревня»." }
  - { kind: usage, text: "Существительное женского рода на -ka, родительный множественного — wiosek." }
collocations:
  - { pl: "mała wioska", ru: "маленькая деревня" }
  - { pl: "mieszkać w wiosce", ru: "жить в деревне" }
  - { pl: "globalna wioska", ru: "глобальная деревня" }
etymology: "Уменьшительное от wieś «деревня», праславянское *vьsь — то же слово, что старорусское «весь» (как в «по городам и весям»). Современное русское «деревня» — другой корень."
memory: "wioska = «деревня, деревушка», уменьшительное от wieś. Русская параллель к wieś — старое «весь» из выражения «по городам и весям». Падежи: w wiosce «в деревне», do wioski «в деревню»."
idioms:
  - { pl: "mała wioska", ru: "маленькая деревня" }
  - { pl: "globalna wioska", ru: "глобальная деревня" }
  - { pl: "wioska olimpijska", ru: "олимпийская деревня" }
