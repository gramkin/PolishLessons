# review
id: gacie
format: 2
lemma: "gacie"
rank: 4224
pos: noun
pron: { cyr: "га́це" }
senses:
  - id: underpants
    ru: "разг. трусы, подштанники"
    examples:
      - pl: "Stał w samych gaciach na balkonie."
        ru: "Он стоял на балконе в одних трусах."
        source: { kind: authored }
      - pl: "Zapomniał spakować gacie."
        ru: "Он забыл положить в сумку трусы."
        source: { kind: authored }
      - pl: "Kupił sobie nowe gacie w kratkę."
        ru: "Он купил себе новые трусы в клетку."
        source: { kind: authored }
  - id: trousers
    ru: "разг. штаны"
    examples:
      - pl: "Podarł gacie na płocie."
        ru: "Он порвал штаны о забор."
        source: { kind: authored }
      - pl: "Te gacie są na mnie za krótkie."
        ru: "Эти штаны мне коротки."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Русское «гачи» в диалектах значит «штанины», и польское GACIE — его родня. В литературном польском трусы — MAJTKI, брюки — SPODNIE, а GACIE — грубоватое разговорное слово для обоих, чаще для мужского белья." }
  - { kind: usage, text: "Только множественное число, как русские «трусы» и «штаны»: TE GACIE, родительный GACI, BEZ GACI. Одна пара — JEDNE GACIE, с собирательным JEDNE. Единственного числа у слова нет." }
  - { kind: government, text: "В одних трусах — W SAMYCH GACIACH, W с местным. Без трусов — BEZ GACI, родительный. Надеть трусы — WŁOŻYĆ GACIE, винительный." }
  - { kind: pronunciation, text: "Читается «га́це», два слога, ударение на первом. CIE даёт мягкое «це». В GACI: «га́ци», в GACIACH: «га́цях»." }
  - { kind: register, text: "Разговорное и грубоватое слово, мужское, деревенское или шутливое. При детях и в магазине говорят MAJTKI, BOKSERKI, SLIPY. Поговорка MIEĆ PEŁNE GACIE — грубое «наложить в штаны от страха»." }
collocations:
  - { pl: "w samych gaciach", ru: "в одних трусах" }
  - { pl: "nowe gacie", ru: "новые трусы" }
  - { pl: "bez gaci", ru: "без трусов" }
family:
  - { pl: "majtki", ru: "трусы", relation: root, id: majtki }
  - { pl: "spodnie", ru: "брюки, штаны", relation: root, id: spodnie }
  - { pl: "gatki", ru: "трусишки, штанишки", relation: derived }
etymology: "Общеславянское *gaťi, «штаны», родственное русскому диалектному «гачи» и украинскому «гачі», «штанины». Изначально слово значило вообще штаны, а в польском сползло к нижнему белью и к грубоватому регистру."
memory: "Gacie — разг. трусы или штаны, только мн. ч.: w samych gaciach, bez gaci. Вежливо — majtki, spodnie. Читается «га́це»."
idioms:
  - { pl: "mieć pełne gacie", ru: "наложить в штаны (от страха), груб." }
