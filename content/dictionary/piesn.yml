etymology: "От праславянского *pěsnь, то есть то же слово, что русская «песнь», и от того же корня, что ŚPIEWAĆ «петь» и русское «петь». Совпадение полное, включая высокий оттенок: и польское, и русское слово звучат торжественно, а для обычной песни оба языка завели производное. Русский взял уменьшительное «песенка» и слово «песня», польский пошёл дальше и сделал PIOSENKA, уменьшительное по форме, главным нейтральным словом. Так вышло, что высокое слово в обоих языках осталось одно, а бытовое разошлось."
memory: "Прямой родственник русской «песни», и оттенок тот же, высокий: pieśń это народная песня, песнопение, часть поэмы. Обычная песня из радио называется piosenka, и в живой речи это слово гораздо частее. Держать в памяти весь ряд похожих: pięć «пять», pięść «кулак», pieścić «ласкать», pieśń «песня». У pieśń носового нет, e обычное, читается «пе́сьнь» одним слогом с двумя мягкими согласными на конце."
