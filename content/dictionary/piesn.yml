notes:
  - { kind: false-friend, text: "Это четвёртое слово в тесном ряду похожих, и весь ряд стоит держать вместе: PIĘĆ «пять», PIĘŚĆ «кулак», PIEŚCIĆ «ласкать» и PIEŚŃ «песня». Различают их носовой гласный и конечные согласные: «пенчь», «пенсьчь», «пещичь», «песьнь». У PIEŚŃ носового нет вовсе, E здесь обычное. Русский родственник прямой: «песнь», и соответствие полное, включая книжный оттенок. А вот обычная песня по-польски называется иначе." }
  - { kind: register, text: "Это главное в карточке: PIEŚŃ — слово высокое. Так называют народную песню, церковное песнопение, гимн, часть поэмы. Обычная песня, та, что играет по радио, называется PIOSENKA, и это слово в живой речи встречается в сто раз чаще: ULUBIONA PIOSENKA «любимая песня», PIOSENKA Z RADIA. Сказать PIEŚŃ о попсовом хите можно только в шутку. Русский делит это поле так же, на «песнь» и «песню», только польское PIOSENKA по форме уменьшительное, а по смыслу нейтральное." }
  - { kind: usage, text: "Шесть форм, женский род, склонение на мягкую согласную, без всякого суффикса: PIEŚŃ, PIEŚNI, PIEŚNIĄ, PIEŚNIOM, PIEŚNIAMI, PIEŚNIACH. По числу форм слово похоже на разряд на -OŚĆ, но суффикса здесь нет, мягкая Ń принадлежит корню. Форма PIEŚNI работает и родительным единственного, и именительным множественного. Множественное число совершенно обычно: PIEŚNI LUDOWE «народные песни», и в названиях сборников оно стоит почти всегда." }
  - { kind: government, text: "Песнь о чём — предлог O с местным падежом: PIEŚŃ O ROLANDZIE «Песнь о Роланде», как и по-русски. Чья песня — родительный без предлога: PIEŚNI POWSTAŃCÓW «песни повстанцев». Петь — ŚPIEWAĆ PIEŚŃ, винительный, или с предлогом: ŚPIEWAĆ O CZYMŚ. Отдельно стоит глагол того же корня, ŚPIEWAĆ «петь», где начальное Ś появилось из приставки, и существительное ŚPIEW «пение»." }
  - { kind: pronunciation, text: "Читается «пе́сьнь», в один слог, и оба конечных согласных мягкие. Буква I после P только знак мягкости, а E обычное, не носовое, так что ничего похожего на «эн» здесь нет. Сочетание ŚŃ — это «сьнь», два мягких звука подряд, и произносятся они слитно. В родительном PIEŚNI слогов становится два: «пе́сьни». Для сравнения, PIĘŚĆ «кулак» звучит «пенсьчь», с носовым." }
