notes:
  - { kind: false-friend, text: "Ловушка не в самом слове, а в соседнем. Русское «анекдот» — это короткая смешная выдумка, и по-польски она называется DOWCIP или KAWAŁ. Польское же ANEGDOTA значит совсем другое: правдивая забавная история о настоящем человеке, обычно известном, — то, что по-русски скорее «байка» или «исторический анекдот» в старом смысле. Поэтому OPOWIEDZ ANEGDOTĘ — просьба рассказать случай из жизни, а не пошутить. Шутку просят так: OPOWIEDZ DOWCIP." }
  - { kind: usage, text: "Два значения различаются числом и сочетаниями. В значении «анекдот» слово исчисляемое: OPOWIEDZIEĆ DOWCIP, ZNAĆ DOWCIPY, DOWCIP O POLITYKACH. В значении «остроумие» оно неисчисляемое и стоит в единственном числе: MIEĆ DOWCIP, CIĘTY DOWCIP, BRAK DOWCIPU. Русский развёл эти смыслы по разным словам, «анекдот» и «остроумие», поэтому при переводе на польский выбор делается легко, а при переводе с польского нужно смотреть на число и на глагол." }
  - { kind: pronunciation, text: "Читается «до́фчип», в два слога, с ударением на первом. Разберём: w перед глухим c оглушается в «ф», сочетание ci даёт мягкое «чь», а конечное p остаётся «п». Поэтому не «довцип» и не «доуцип», а «до́фчип». В косвенных падежах звонкость w не возвращается, потому что следующий согласный остаётся глухим: DOWCIPU — «до́фчипу»." }
  - { kind: government, text: "О ком или о чём шутка — предлог O с предложным падежом: DOWCIP O TEŚCIOWEJ, DOWCIPY O POLITYKACH. Над чем смеются — предлог Z с родительным: ŚMIAĆ SIĘ Z DOWCIPU. Что сделать — винительный без предлога: OPOWIEDZIEĆ DOWCIP, ZNAĆ DOWCIP. Прилагательное DOWCIPNY значит «остроумный, смешной» и употребляется и о человеке, и о тексте." }
