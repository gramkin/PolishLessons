etymology: "Слово старое, польское, и значило оно сначала не шутку, а ум: в текстах шестнадцатого века DOWCIP — это сообразительность, остроумие в прямом смысле «острый ум». Значение «анекдот» развилось позже, уже из «остроумия»: сначала так назвали остроумную вещь, потом короткий смешной рассказ. Внутренний состав слова разбирается на приставку DO- и корень, который в современном языке самостоятельно не живёт, и этимологи связывают его с идеей быстрого схватывания, догадки. Русского родственника у слова нет, поэтому опереться на знакомое не получится — зато видно, как значение шло от ума к шутке, а не наоборот."
memory: "DOWCIP — это и «анекдот», и «остроумие». Русский «анекдот» — это DOWCIP или KAWAŁ, а польское ANEGDOTA значит правдивый забавный случай. Читается «до́фчип»: w перед c даёт «ф», ci — «чь». О ком шутка — через O с предложным."
