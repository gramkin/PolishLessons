notes:
  - { kind: pronunciation, text: "Гласная e в последнем слоге беглая: ŻOŁĄDEK, но ŻOŁĄDKA, żołądkiem, żołądki. Это то же устройство, что в czwartek — czwartku и smutek — smutku. Носовое ą при этом никуда не уходит и держится во всех формах — в отличие от krąg из этой же подборки, где ą сменяется на ę. Два слова с носовым в основе, два разных поведения." }
  - { kind: usage, text: "Устойчивые обороты совпадают с русскими почти дословно: NA CZCZY ŻOŁĄDEK — «на голодный желудок», MIEĆ MOCNY ŻOŁĄDEK — «иметь крепкий желудок», przewracać się w żołądku — «переворачиваться в желудке». Это редкий случай, когда целую группу выражений можно переносить напрямую, не проверяя." }
