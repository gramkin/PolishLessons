etymology: "Из праславянского *želǫdъkъ — то же слово, что русский «желудок». Носовой ǫ дал в польском ą, а в русском у, отсюда вся разница в облике. Корень тот же, что в «жёлудь» и польском żołądź: желудок назвали по форме, сравнив его с орешком дуба."
memory: "Беглая e: żołądek, но żołądka. А носовое ą держится везде, в отличие от krąg — kręgu."
