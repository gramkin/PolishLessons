etymology: "От праславянского *nitь, то есть то же слово, что русская «нить», и значение не сдвинулось ни на шаг. Различается только конец слова: праславянское мягкое Т в польском дало Ć, а в русском осталось «ть», отсюда NIĆ и «нить». Тот же переход виден в других парах: польское BYĆ при русском «быть», IŚĆ при «идти». Уменьшительное NITKA отвечает русской «нитке» буква в букву. А совпадение с NIC «ничего» чисто внешнее: то слово от другого корня, из NIE и старого указательного, и родства между ними нет никакого."
memory: "Одна чёрточка решает всё: nic без значка значит «ничего», nić с акутом значит «нить». На слух это «ниц» против «ничь». Слово то же, что русская «нить», и переход «ть» в ć регулярен, как в być и «быть». В быту чаще множественное: nici do szycia «нитки для шитья». Запомнить неправильный творительный множественного nićmi, а не «niciami». И оборот szyte grubymi nićmi значит ровно «шито белыми нитками»."
idioms:
  - { pl: "nić Ariadny", ru: "нить Ариадны" }
