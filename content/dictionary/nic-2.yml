notes:
  - { kind: false-friend, text: "Это самая коварная пара во всём польском словаре для русскоязычного, потому что различает её одна чёрточка. NIC, без значка, значит «ничего»: NIC NIE WIEM — «я ничего не знаю». NIĆ, с акутом над C, значит «нить». На слух разница есть, «ниц» против «нич», но на письме её легко не заметить, а смысл меняется полностью. Отсюда и две разные карточки в этом словаре. Запоминать проще по звуку: мягкое «чь» на конце — это нитка, твёрдое «ц» — это «ничего»." }
  - { kind: usage, text: "Шесть форм, женский род, склонение на мягкую согласную. Обратить внимание стоит на творительный множественного: NIĆMI, а не «niciami», и это одна из тех форм, которые просто заучивают. Множественное NICI в бытовой речи вытеснило единственное: за нитками в магазин идут за NICI, и спрашивают KŁĘBEK NICI «клубок ниток». Единственное число остаётся в переносных оборотах: NIĆ POROZUMIENIA, NIĆ ŻYCIA." }
  - { kind: government, text: "Чем шить — творительный без предлога: ZSZYĆ NICIĄ, как и по-русски «зашить ниткой». Нить чего — родительный без предлога: NIĆ POROZUMIENIA «нить взаимопонимания», NIĆ ARIADNY. Для чего нитки — предлог DO с родительным: NICI DO CEROWANIA «нитки для штопки», NICI DO SZYCIA. Русский в этом случае тоже ставит «для» с родительным, так что схема совпадает." }
  - { kind: pronunciation, text: "Читается «ничь», в один слог, с мягким «чь» на конце. Буква I здесь и гласная, и знак мягкости для C: сочетание Ć даёт именно «чь». Сравните с NIC «ничего», которое звучит «ниц», с твёрдым «ц» на конце. В родительном NICI слогов становится два: «ни́чи». В творительном множественного NIĆMI слышно «ни́чьми», и группа согласных произносится слитно." }
  - { kind: register, text: "Слово бытовое и книжное одновременно. В прямом значении оно живёт в разговорах о шитье: NICI DO SZYCIA, IGŁA I NIĆ «иголка с ниткой», NAWLEC NIĆ «вдеть нитку». В переносном идёт в высокий слой: NIĆ POROZUMIENIA «нить взаимопонимания», NIĆ ŻYCIA «нить жизни», NIĆ ARIADNY «нить Ариадны». Отдельно стоит оборот SZYTE GRUBYMI NIĆMI, буквально «шито толстыми нитками», и значит он ровно русское «шито белыми нитками», то есть грубо подделано." }
