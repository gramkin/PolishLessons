  - { pl: "zimna krew", ru: "хладнокровие" }
  - { pl: "błękitna krew", ru: "голубая кровь" }
etymology: "Праславянское *kry, винительный *krъvь: старый именительный kry держался до XV века, а современное krew пришло из винительного падежа — ровно как русское «кровь»."
memory: "krew — «кровь». Старый именительный был kry, а нынешнее krew пришло из винительного падежа, как и русское «кровь». Множественного числа у слова нет."
