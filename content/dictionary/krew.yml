notes:
  - { kind: usage, text: "Слово неисчисляемое: множественного числа в живом языке нет, как и у русского «кровь»." }
  - { kind: usage, text: "grupa krwi — «группа крови», oddać krew — «сдать кровь», z krwi i kości — «из плоти и крови»." }
  - { kind: usage, text: "błękitna krew — «голубая кровь»; zimna krew — «хладнокровие»: zachować zimną krew «сохранить хладнокровие»." }
collocations:
