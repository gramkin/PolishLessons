etymology: "Праславянское *to, из праиндоевропейского *tod — то же слово, что русское «то»."
memory: "to = «это» в роли связки (To prawda «Это правда») и «то» как указательное среднего рода. Отдельно держите в памяти temu «назад»: tydzień temu «неделю назад»."
