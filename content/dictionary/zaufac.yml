# review
id: zaufac
format: 2
lemma: "zaufać"
rank: 610
pos: verb
aspect: perf
pron: { cyr: "зау́фаць" }
senses:
  - id: trust
    ru: "довериться, доверять (кому-л. — дательный)"
    note: "zaufać komuś: Tomowi można zaufać."
    examples:
      - pl: "Można zaufać tym ludziom?"
        ru: "Этим людям можно доверять?"
        source: { kind: tatoeba, id: 10696035 }
      - pl: "Można mu zaufać."
        ru: "Ему можно доверять."
        source: { kind: translated, id: 352915 }
      - pl: "Zaufaj mi."
        ru: "Доверься мне."
        source: { kind: translated, id: 959203 }
  - id: trust-noun
    ru: "zaufanie — доверие"
    note: "mieć do kogoś zaufanie — с do и родительным, не с дательным."
    examples:
      - pl: "Mam do niego zaufanie."
        ru: "Я ему доверяю."
        source: { kind: translated, id: 3979116 }
      - pl: "Dziękuję za zaufanie!"
        ru: "Спасибо за доверие!"
        source: { kind: translated, id: 8655853 }
      - pl: "Stracono doń zaufanie."
        ru: "К нему утратили доверие."
        source: { kind: translated, id: 364061 }
  - id: trustworthy
    ru: "godny zaufania — достойный доверия, надёжный"
    note: "w zaufaniu значит «по секрету»."
    examples:
      - pl: "To człowiek godny zaufania."
        ru: "Это человек, достойный доверия."
        source: { kind: translated, id: 742342 }
      - pl: "Ryzykujesz utratę mojego zaufania."
        ru: "Ты рискуешь потерять моё доверие."
        source: { kind: translated, id: 596649 }
      - pl: "Powiem ci coś w zaufaniu."
        ru: "Скажу тебе кое-что по секрету."
        source: { kind: translated, id: 991216 }
notes:
  - { kind: government, text: "Глагол и существительное управляют по-разному, и это главное здесь: zaufać KOMUŚ — дательный (zaufaj mi), но mieć zaufanie DO kogoś — предлог do с родительным." }
  - { kind: usage, text: "Несовершенный вид — ufać. Совершенный zaufać значит «довериться однажды, решиться доверять»." }
  - { kind: usage, text: "godny zaufania — «надёжный, заслуживающий доверия»; stracić zaufanie — «потерять доверие»." }
  - { kind: usage, text: "w zaufaniu значит «по секрету»: powiem ci coś w zaufaniu." }
collocations:
  - { pl: "zaufać komuś", ru: "довериться кому-либо" }
  - { pl: "godny zaufania", ru: "достойный доверия" }
  - { pl: "mieć do kogoś zaufanie", ru: "доверять кому-либо" }
  - { pl: "w zaufaniu", ru: "по секрету" }
family:
  - { pl: "ufać", ru: "доверять", relation: root }
  - { pl: "zaufanie", ru: "доверие", relation: derived }
  - { pl: "nieufny", ru: "недоверчивый", relation: derived }
etymology: "Приставка za- плюс ufać «доверять», от праславянского *u-pъvati — тот же корень, что в русском «уповать»."
memory: "zaufać — «довериться», и глагол требует дательного: zaufaj mi, Tomowi można zaufać. Но существительное от того же корня управляет иначе: mieć zaufanie DO kogoś, с предлогом do и родительным. Эту пару стоит держать в голове вместе, потому что русский в обоих случаях обходится одним «доверять кому-то». Несовершенный вид — ufać, а godny zaufania значит «надёжный»."
idioms:
  - { pl: "zaufać komuś", ru: "довериться кому-либо" }
  - { pl: "godny zaufania", ru: "достойный доверия" }
  - { pl: "w zaufaniu", ru: "по секрету" }
