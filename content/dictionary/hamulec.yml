etymology: "От HAMOWAĆ, заимствованного из средневерхненемецкого HEMMEN «задерживать, препятствовать», родственного английскому HEM IN. Слово пришло в польский вместе с ремесленной и транспортной терминологией. Русский для того же понятия взял греческое TORMOS через византийское посредство, так что «тормоз» и HAMULEC не родственники вовсе. Тем любопытнее, что переносное значение внутренней сдержки развилось в обоих языках одинаково и независимо."
memory: "Ничего общего с русским «тормозом» по корню: hamulec идёт от hamować, а то из немецкого hemmen «сдерживать». Зато метафора совпала целиком, и stracić hamulce переводится дословно, «потерять тормоза». Управление расходится: поляк говорит nacisnąć hamulec, винительный без предлога, а русский «нажать на тормоз». Беглое e выпадает: hamulec, но hamulca. Читается «хаму́лец», h даёт «х»."
idioms:
  - { pl: "hamulec bezpieczeństwa", ru: "стоп-кран" }
formExamplesSkip:
