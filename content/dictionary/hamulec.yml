notes:
  - { kind: false-friend, text: "Корни тут разные, а переносный смысл один и тот же, и это редкая удача. Польское HAMULEC идёт от HAMOWAĆ, а то из немецкого HEMMEN «задерживать, сдерживать». Русский «тормоз» пришёл из греческого. Общего в словах нет ничего, зато метафора совпала полностью: STRACIĆ HAMULCE это «потерять тормоза», а HAMULCE MORALNE это «моральные тормоза». Переводить эти обороты можно дословно." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Беглое E выпадает во всех косвенных падежах: HAMULEC, но HAMULCA, HAMULCOWI, HAMULCEM. Это тот же образец, что у KUPIEC и KONIEC. Множественное HAMULCE употребляется и в прямом смысле, о тормозах машины, и в переносном, о внутренних сдержках, причём в переносном почти всегда во множественном числе." }
  - { kind: government, text: "Нажать на тормоз — NACISNĄĆ HAMULEC, винительный без предлога, тогда как русский вставляет предлог «на». Это расхождение стоит запомнить: поляк жмёт тормоз, а не на тормоз. Затянуть ручной тормоз — ZACIĄGNĄĆ HAMULEC RĘCZNY, тоже винительный. Без тормозов — BEZ HAMULCÓW, предлог BEZ с родительным множественного, и в переносном смысле это значит «без тормозов», как по-русски." }
  - { kind: pronunciation, text: "Читается «хаму́лец», три слога, ударение на втором. Буква H даёт «х», как и CH, без всякого придыхания. Конечное C даёт «ц». В косвенных падежах беглое E исчезает, и HAMULCA звучит «хаму́льца», где L перед согласной требует мягкого знака. Во множественном HAMULCE слышно «хаму́льце», с тем же мягким «ль»." }
  - { kind: register, text: "Слово нейтральное и повседневное, из языка водителей и механиков: HAMULEC RĘCZNY «ручной тормоз», HAMULCE TARCZOWE «дисковые тормоза», KLOCKI HAMULCOWE «тормозные колодки». В поезде над дверью висит HAMULEC BEZPIECZEŃSTWA, то есть стоп-кран. Переносное употребление живое и слегка осуждающее: CZŁOWIEK BEZ HAMULCÓW это тот, кто не знает удержу." }
