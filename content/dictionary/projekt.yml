# review
id: projekt
format: 2
lemma: "projekt"
rank: 1172
pos: noun
pron: { cyr: "про́ект" }
senses:
  - id: project
    ru: "проект, начинание"
    examples:
      - pl: "Projekt się posuwa."
        ru: "Проект продвигается."
        source: { kind: translated, id: 841649 }
      - pl: "To jest wielki projekt."
        ru: "Это большой проект."
        source: { kind: translated, id: 5014762 }
      - pl: "Firma anulowała projekt."
        ru: "Фирма отменила проект."
        source: { kind: translated, id: 6534319 }
  - id: work-on
    ru: "pracować nad projektem — работать над проектом"
    examples:
      - pl: "Pracuję nad dużym projektem."
        ru: "Я работаю над большим проектом."
        source: { kind: translated, id: 10236963 }
      - pl: "Pracowali wspólnie nad tym projektem."
        ru: "Они вместе работали над этим проектом."
        source: { kind: translated, id: 921774 }
  - id: bill
    ru: "projekt ustawy — законопроект; эскиз, чертёж"
    examples:
      - pl: "Jestem przeciwko projektowi ustawy."
        ru: "Я против законопроекта."
        source: { kind: translated, id: 12196496 }
      - pl: "Zrobili to według mojego projektu."
        ru: "Они сделали это по моему проекту."
        source: { kind: translated, id: 735413 }
notes:
  - { kind: government, text: "pracować NAD projektem «работать над проектом» — предлог nad с творительным, как в русском. А w projekcie значит «в проекте, в составе проекта»." }
  - { kind: usage, text: "projekt ustawy — «законопроект»: в политических новостях это самое частое сочетание со словом." }
  - { kind: usage, text: "Второе значение — «эскиз, чертёж, дизайн»: zrobić coś według projektu «сделать что-то по проекту»." }
  - { kind: usage, text: "Мужской род неодушевлённый: ten projekt, tego projektu, tym projektem." }
collocations:
  - { pl: "projekt ustawy", ru: "законопроект" }
  - { pl: "pracować nad projektem", ru: "работать над проектом" }
  - { pl: "wziąć udział w projekcie", ru: "участвовать в проекте" }
family:
  - { pl: "projektować", ru: "проектировать", relation: derived }
  - { pl: "projektant", ru: "дизайнер, проектировщик", relation: derived }
etymology: "Через немецкое Projekt и французское projet из латинского proiectus «выдвинутый вперёд». Русский «проект» — то же заимствование."
memory: "projekt — «проект», мужской род. Работают над ним pracować NAD projektem, творительный, как и по-русски. А projekt ustawy значит «законопроект»."
idioms:
  - { pl: "projekt ustawy", ru: "законопроект" }
  - { pl: "pracować nad projektem", ru: "работать над проектом" }
formExamplesSkip:
