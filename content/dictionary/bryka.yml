# review
id: bryka
format: 2
lemma: "bryka"
rank: 4129
pos: noun
pron: { cyr: "бры́ка" }
senses:
  - id: car
    ru: "сленг тачка (машина)"
    examples:
      - pl: "Ale bryka!"
        ru: "Вот это тачка!"
        source: { kind: authored }
      - pl: "Kupił nową brykę na kredyt."
        ru: "Он купил новую тачку в кредит."
        source: { kind: authored }
      - pl: "Ta bryka pali dwadzieścia litrów."
        ru: "Эта тачка жрёт двадцать литров."
        source: { kind: authored }
  - id: cart
    ru: "устар. телега, фургон"
    examples:
      - pl: "Chłopi wieźli siano na bryce."
        ru: "Крестьяне везли сено на телеге."
        source: { kind: authored }
      - pl: "Bryka zaprzężona w dwa konie stała przed karczmą."
        ru: "Телега, запряжённая парой лошадей, стояла перед корчмой."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Русскому BRYKA напоминает «брыкаться», но связи нет: польское BRYKAĆ, «брыкаться, скакать», и BRYKA, «телега», — разные слова. Старое значение «большая крытая телега» сохранилось в литературе, а в молодёжном сленге BRYKA — «тачка, машина», обычно хорошая или большая." }
  - { kind: usage, text: "Женский род, неодушевлённое. В местном и дательном K чередуется с C: NA BRYCE, BRYCE. Множественное BRYKI, родительный BRYK. Звательный BRYKO не употребляется." }
  - { kind: government, text: "Ехать на машине — JECHAĆ BRYKĄ, творительный без предлога. На телеге — NA BRYCE, NA с местным. Купить тачку — KUPIĆ BRYKĘ, винительный." }
  - { kind: pronunciation, text: "Читается «бры́ка», два слога, ударение на первом. BRY — твёрдое «бры», без русского «и». В местном NA BRYCE: «на бры́цэ»." }
  - { kind: register, text: "В значении «машина» — молодёжный и автомобильный сленг, с восхищением: WYPASIONA BRYKA, «шикарная тачка». В значении «телега» — устаревшее, из исторических романов. Нейтральное слово для машины — SAMOCHÓD или AUTO." }
collocations:
  - { pl: "nowa bryka", ru: "новая тачка" }
  - { pl: "wypasiona bryka", ru: "шикарная тачка" }
  - { pl: "jechać bryką", ru: "ехать на тачке" }
family:
  - { pl: "samochód", ru: "автомобиль", relation: root, id: samochod }
  - { pl: "auto", ru: "машина", relation: root, id: auto }
  - { pl: "bryczka", ru: "бричка, коляска", relation: derived }
etymology: "Из немецкого Brücke в значении «помост, площадка повозки» или из английского break, «открытый экипаж»: этимологи спорят. Уменьшительное BRYCZKA дало русское «бричка», так что русскому слово косвенно знакомо. Сленговое «машина» появилось во второй половине двадцатого века."
memory: "Bryka — сленг: тачка. Ale bryka! — вот это тачка! Устар. — телега, а bryczka — бричка. Na bryce — K→C. Читается «бры́ка»."
idioms:
  - { pl: "wypasiona bryka", ru: "шикарная тачка" }
formExamplesSkip:
  - { form: "bryko", reason: "звательный не употребляется" }
