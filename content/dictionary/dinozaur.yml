notes:
  - { kind: false-friend, text: "DINOZAUR — «динозавр», но с -ZAUR: AU читается как дифтонг «ау». В переносном смысле, как и в русском, — «пережиток, старомодный человек». Ящерица — JASZCZURKA." }
  - { kind: usage, text: "Десять форм, мужской род, одушевлённый: винительный DINOZAURA. Множественное — DINOZAURY. В местном R переходит в RZ: O DINOZAURZE." }
  - { kind: government, text: "Скелет динозавра — SZKIELET DINOZAURA, родительный. Эпоха динозавров — ERA DINOZAURÓW. Интересоваться динозаврами — INTERESOWAĆ SIĘ DINOZAURAMI." }
  - { kind: pronunciation, text: "Читается «дино́заур»: AU — дифтонг, один слог, поэтому ударение на NO. DINOZAURZE — «диноза́ужэ»." }
