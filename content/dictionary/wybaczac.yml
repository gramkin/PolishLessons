# review
id: wybaczac
format: 2
lemma: "wybaczać"
rank: 4064
pos: verb
pron: { cyr: "выба́чаць" }
senses:
  - id: forgive
    ru: "прощать"
    examples:
      - pl: "Matka zawsze wszystko mu wybacza."
        ru: "Мать всегда ему всё прощает."
        source: { kind: authored }
      - pl: "Nie wybaczam kłamstwa."
        ru: "Я не прощаю лжи."
        source: { kind: authored }
      - pl: "Łatwo wybaczać przyjaciołom."
        ru: "Друзьям прощать легко."
        source: { kind: authored }
  - id: excuse
    ru: "извинять, не держать зла"
    examples:
      - pl: "Wybaczam ci, ale nie rób tego więcej."
        ru: "Я тебя прощаю, но больше так не делай."
        source: { kind: authored }
      - pl: "Takich błędów się nie wybacza."
        ru: "Такие ошибки не прощают."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "WYBACZAĆ — «прощать», а не «выбачать» или «выбирать» (WYBIERAĆ). Синоним — PRZEBACZAĆ, он книжнее и чаще в религиозном контексте. WYBACZ! — «прости!», вежливое начало просьбы или отказа: WYBACZ, ALE NIE MOGĘ." }
  - { kind: usage, text: "Несовершенный вид; совершенный — WYBACZYĆ. Спряжение на -AM: WYBACZAM, WYBACZASZ, WYBACZAJĄ. Мужско-личное страдательное WYBACZANI в карточку не включено: прощают не людей, а их вины — человек стоит в дательном." }
  - { kind: government, text: "Кому — дательный, что — винительный: WYBACZAĆ KOMUŚ BŁĘDY. По-русски «прощать кого-то» — винительный, по-польски человек в дательном: WYBACZAM CI «я тебя прощаю». С отрицанием — родительный: NIE WYBACZA ZDRADY." }
  - { kind: pronunciation, text: "Читается «выба́чаць»: CZ — твёрдое «ч», ударение на предпоследнем слоге. WYBACZAM — «выба́чам»." }
  - { kind: register, text: "Нейтральное слово. WYBACZ — разговорное «прости», WYBACZ MI — серьёзное «прости меня». Официально — PRZEPRASZAM." }
collocations:
  - { pl: "wybaczać komuś błędy", ru: "прощать кому-то ошибки" }
  - { pl: "nie wybaczać zdrady", ru: "не прощать измены" }
  - { pl: "umieć wybaczać", ru: "уметь прощать" }
family:
  - { pl: "wybaczyć", ru: "простить", relation: aspect, id: wybaczyc }
  - { pl: "przepraszać", ru: "извиняться", relation: root, id: przepraszac }
  - { pl: "wina", ru: "вина", relation: root, id: wina }
etymology: "Приставка WY- плюс BACZYĆ «замечать, помнить», от BACZNY «внимательный»: буквально «перестать держать в памяти»."
memory: "Wybaczać komuś — прощать кого-то, с дательным: wybaczam ci. Wybacz! — прости!"
idioms:
  - { pl: "wybaczać, ale nie zapominać", ru: "прощать, но не забывать" }
formExamplesSkip:
  - { form: "wybaczani", reason: "мужско-личная форма: прощают вины, а человек стоит в дательном" }
