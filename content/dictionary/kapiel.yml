etymology: "От KĄPAĆ «купать», из праславянского *kąpati — того же корня, что русское «купать» и «купель». Польский оставил слову широкий смысл, купание и ванну, а русский развёл его по двум: обиходное «купание» от того же глагола и узкое «купель» о церковной чаше. Поэтому kąpiel узнаётся через «купать», но не через «купель»."
memory: "Семь форм, образец noc: kąpieli за четыре падежа плюс родительный множественного, а именительный множественного отдельный — kąpiele. И ą здесь корневое, стоит везде, не как в urząd."
