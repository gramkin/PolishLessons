notes:
  - { kind: usage, text: "Форм семь, и слово идёт по образцу NOC: KĄPIELI служит родительным, дательным, местным и звательным единственного, а заодно родительным множественного, тогда как именительный множественного отдельный — KĄPIELE. У MYŚL из партии 228 именительный множественного тоже достался форме myśli, и потому форм там всего шесть. Значит у мягких женских слов вопрос один: что даёт именительный множественного. Окончание -e даёт семь форм, окончание -i — шесть, и больше ничего выяснять не надо." }
  - { kind: pronunciation, text: "Буква ą стоит здесь во всех формах: KĄPIEL, KĄPIELI, KĄPIELĄ, KĄPIELE. Это ą корневое, и этим оно отличается от позиционного ą в URZĄD, которое держится только в закрытом конечном слоге и сменяется на ę, едва слог откроется: urzędu, urzędzie. Выходит, что ą ведёт себя в точности как ó, разобранное в карточках WZÓR и RÓŻOWY: бывает корневым, бывает позиционным, и проверяется одинаково — взглядом на косвенные формы." }
  - { kind: false-friend, text: "Корень тот же, что у русского «купать», но значения разошлись. Польская KĄPIEL — это купание или ванна в самом обычном смысле: BRAĆ KĄPIEL значит «принимать ванну». Русская же «купель» сузилась до церковной чаши для крещения, и подставлять её в перевод нельзя. Зато поговорка совпадает дословно: WYLAĆ DZIECKO Z KĄPIELĄ — «выплеснуть с водой и ребёнка»." }
collocations:
