# review
id: korzystac
format: 2
lemma: "korzystać"
rank: 2033
pos: verb
aspect: imperf
pron: { cyr: "кожы́стаць" }
senses:
  - id: use
    ru: "пользоваться (чем-л.)"
    examples:
      - pl: "Czy umiesz korzystać ze słownika?"
        ru: "Ты умеешь пользоваться словарём?"
        source: { kind: tatoeba, id: 3745267 }
      - pl: "Nie potrafię korzystać z nowych gadżetów."
        ru: "Я не умею пользоваться новыми гаджетами."
        source: { kind: tatoeba, id: 3745064 }
      - pl: "Uczniom nie wolno korzystać z tej toalety."
        ru: "Студенты не должны пользоваться этим туалетом."
        source: { kind: tatoeba, id: 599421 }
  - id: take-advantage
    ru: "пользоваться случаем, извлекать пользу"
    examples:
      - pl: "Korzystaj z różnych okazji."
        ru: "Пользуйся разными случаями."
        source: { kind: translated, id: 350157 }
      - pl: "Korzystam z każdej okazji, by zjeść coś włoskiego."
        ru: "Я пользуюсь каждым случаем, чтобы съесть что-нибудь итальянское."
        source: { kind: translated, id: 967015 }
notes:
  - { kind: government, text: "Главная ловушка: korzystać z czegoś требует предлога z с РОДИТЕЛЬНЫМ падежом, тогда как русское «пользоваться» — творительного. korzystać ze słownika «пользоваться словарём»." }
  - { kind: usage, text: "Совершенный вид — skorzystać." }
  - { kind: false-friend, text: "Корень korzyść «польза, выгода» — то же слово, что русское «корысть», но в польском без дурного оттенка." }
  - { kind: usage, text: "korzystając z okazji «пользуясь случаем» — устойчивый деепричастный оборот, частый в письмах и речах." }
collocations:
  - { pl: "korzystać z czegoś", ru: "пользоваться чем-л." }
  - { pl: "korzystając z okazji", ru: "пользуясь случаем" }
etymology: "От korzyść «польза, выгода», праславянское *koristь; русское «корысть» — то же слово, только значение разошлось."
memory: "korzystać z czegoś — «пользоваться чем-л.», но с предлогом z и РОДИТЕЛЬНЫМ падежом, а не с творительным, как в русском. Корень korzyść «польза» = русское «корысть», без дурного оттенка."
idioms:
  - { pl: "korzystając z okazji", ru: "пользуясь случаем" }
  - { pl: "korzystać z życia", ru: "наслаждаться жизнью" }
