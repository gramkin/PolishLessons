# review
id: puscic
format: 2
lemma: "puścić"
rank: 738
pos: verb
aspect: perf
pron: { cyr: "пу́сьциць" }
senses:
  - id: let-go
    ru: "отпустить, выпустить из рук"
    examples:
      - pl: "Puść go!"
        ru: "Отпусти его!"
        source: { kind: translated, id: 12058192 }
      - pl: "Tom nie chce mnie puścić."
        ru: "Том не хочет меня отпускать."
        source: { kind: translated, id: 10567286 }
      - pl: "Nie puszczę cię."
        ru: "Я тебя не отпущу."
        source: { kind: translated, id: 6553824 }
  - id: let-somewhere
    ru: "puścić kogoś gdzieś — пустить кого-л. куда-л."
    examples:
      - pl: "Nie mogę uwierzyć, że twoja mama cię tam puściła."
        ru: "Не верится, что твоя мама тебя туда пустила."
        source: { kind: translated, id: 5060741 }
      - pl: "Zdecydowaliśmy cię puścić."
        ru: "Мы решили тебя отпустить."
        source: { kind: translated, id: 3757036 }
      - pl: "Puśćmy dziś pracowników wcześniej do domu."
        ru: "Отпустим сегодня работников домой пораньше."
        source: { kind: translated, id: 2475872 }
  - id: play
    ru: "puścić muzykę, film — включить музыку, поставить фильм"
    examples:
      - pl: "Puśćmy latawiec."
        ru: "Запустим воздушного змея."
        source: { kind: translated, id: 563625 }
      - pl: "Puść muzykę."
        ru: "Включи музыку."
        source: { kind: authored }
      - pl: "Puścili film od początku."
        ru: "Они включили фильм с начала."
        source: { kind: authored }
  - id: idioms
    ru: "puścić oko «подмигнуть», puścić farbę «проболтаться»"
    examples:
      - pl: "Puściłem oko."
        ru: "Я подмигнул."
        source: { kind: translated, id: 12360113 }
      - pl: "Puściłeś farbę?"
        ru: "Ты проболтался?"
        source: { kind: translated, id: 13655285 }
      - pl: "Puściłam oczko."
        ru: "У меня спустилась петля."
        source: { kind: translated, id: 12360115 }
notes:
  - { kind: usage, text: "Основное значение — «отпустить, выпустить из рук»: Puść mnie! «Отпусти меня!». Отсюда же puścić kogoś «пустить кого-то куда-то»." }
  - { kind: usage, text: "Второе живое значение — «включить, запустить»: puścić muzykę «включить музыку», puścić film «поставить фильм», puścić latawiec «запустить воздушного змея»." }
  - { kind: usage, text: "Ходовые идиомы: puścić oko «подмигнуть», puścić farbę «проболтаться, расколоться», puścić coś mimo uszu «пропустить мимо ушей», puścić w niepamięć «предать забвению». А puścić oczko говорят о спустившейся петле на колготках." }
  - { kind: usage, text: "Корень тот же, что в русском «пустить», и приставочные совпадают: wypuścić «выпустить», dopuścić «допустить», opuścić «покинуть». Несовершенный вид — puszczać." }
collocations:
  - { pl: "puścić muzykę", ru: "включить музыку" }
  - { pl: "puścić oko", ru: "подмигнуть" }
  - { pl: "puścić farbę", ru: "проболтаться" }
  - { pl: "puścić mimo uszu", ru: "пропустить мимо ушей" }
family:
  - { pl: "puszczać", ru: "пускать", relation: aspect }
  - { pl: "wypuścić", ru: "выпустить", relation: root }
  - { pl: "opuścić", ru: "покинуть", relation: root }
  - { pl: "dopuścić", ru: "допустить", relation: root }
etymology: "Праславянское *pustiti, от *pustъ «пустой» — то же слово, что русское «пустить»."
memory: "puścić — «пустить, отпустить», слово то же самое, что русское, и приставочные совпадают: wypuścić «выпустить», dopuścić «допустить», opuścić «покинуть». Второе живое значение — «включить»: puścić muzykę, puścić film. А из идиом стоит взять puścić oko «подмигнуть», puścić farbę «проболтаться» и puścić coś mimo uszu «пропустить мимо ушей»."
idioms:
  - { pl: "puścić oko", ru: "подмигнуть" }
  - { pl: "puścić farbę", ru: "проболтаться" }
  - { pl: "puścić coś mimo uszu", ru: "пропустить мимо ушей" }
