notes:
  - { kind: usage, text: "Основа глагола меняется между инфинитивом и будущим до неузнаваемости: WYJĄĆ, но WYJMĘ, wyjmiesz, wyjmie, wyjmą. Так ведёт себя весь класс на -jąć: ująć — ujmę, zająć — zajmę, przyjąć — przyjmę, odjąć — odejmę. Выучив одну пару, получаешь всю группу, а она в польском многочисленная и частотная." }
  - { kind: pronunciation, text: "Русскому это чередование знакомо, и притом хорошо: «занять — займу», «принять — приму», «снять — сниму» устроены точно так же, через выпадение носового и появление м. Беда в одном месте: именно там, где польский говорит wyjąć, русский утратил корень целиком и получил «вынуть» — вы-ну-ть, без корня вовсе. Так что образец есть, но опереться на самое близкое по смыслу слово нельзя." }
  - { kind: usage, text: "Носовой гласный в прошедшем чередуется как у przesunąć: ą только в мужском роде единственного — WYJĄŁ, а дальше везде ę: wyjęła, wyjęło, wyjęli, wyjęły. Причастие и отглагольное существительное тоже берут ę: wyjęty, wyjęcie. Отдельно стоит оборот WYJĄĆ SPOD PRAWA — «объявить вне закона»." }
collocations:
  - { pl: "wyjąć z kieszeni", ru: "вынуть из кармана" }
  - { pl: "wyjąć z piekarnika", ru: "вынуть из печи" }
  - { pl: "wyjąć z kontekstu", ru: "вынуть из контекста" }
family:
  - { pl: "wyjmować", ru: "вынимать", relation: aspect }
  - { pl: "wyjęcie", ru: "извлечение", relation: derived }
  - { pl: "ująć", ru: "взять; изложить", relation: root }
etymology: "Приставка wy- и корень *jęti «взять», тот же, что в ująć, zająć, przyjąć. В русском этот корень жив в «изъять», «принять», «занять», и чередование там то же самое. Но «вынуть» пошло особым путём: корень из него выпал, и осталось вы-ну-ть, единственный русский глагол без корня. Польское wyjąć сохранило то, что мы потеряли."
memory: "Инфинитив wyjąć, а будущее wyjmę — как «занять, займу». И прошедшее с ą только в мужском: wyjął, но wyjęła."
idioms:
  - { pl: "wyjąć spod prawa", ru: "объявить вне закона" }
  - { pl: "wyjąć coś z kontekstu", ru: "выдернуть из контекста" }
