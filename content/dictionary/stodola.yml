notes:
  - { kind: false-friend, text: "STODOŁA — «амбар, гумно» для сена и зерна. Хлев для скота — OBORA, сарай для инструментов — SZOPA, курятник — KURNIK. Модные свадьбы в амбаре — WESELE W STODOLE." }
  - { kind: usage, text: "Девять форм, женский род. В местном Ł переходит в L: W STODOLE. Родительный множественного — STODÓŁ, с Ó. Звательный STODOŁO не употребляется." }
  - { kind: government, text: "В амбаре — W STODOLE, местный. В амбар — DO STODOŁY, родительный. За амбаром — ZA STODOŁĄ, творительный." }
  - { kind: pronunciation, text: "Читается «стодо́уа»: Ł — «у». Ударение на предпоследнем слоге. STODOLE — «стодо́ле»." }
collocations:
