etymology: "Старое западнославянское слово для хозяйственной постройки. В русском прямого соответствия нет: «амбар» взят из тюркских языков."
memory: "Stodoła — амбар для сена; хлев — obora, сарай — szopa. W stodole — в амбаре. Читается «стодо́уа»."
