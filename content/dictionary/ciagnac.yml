# review
id: ciagnac
format: 2
lemma: "ciągnąć"
rank: 1985
pos: verb
pron: { cyr: "цё́нгнонць" }
senses:
  - id: pull
    ru: "тянуть, тащить"
    examples:
      - pl: "Ciągnął walizkę po schodach."
        ru: "Он тащил чемодан по лестнице."
        source: { kind: authored }
      - pl: "Koń ciągnie wóz pod górę."
        ru: "Конь тянет воз в гору."
        source: { kind: authored }
      - pl: "Nie ciągnij mnie za rękaw."
        ru: "Не тяни меня за рукав."
        source: { kind: authored }
  - id: drag-on
    ru: "тянуться, длиться (ciągnąć się)"
    examples:
      - pl: "Sprawa ciągnie się od roku."
        ru: "Дело тянется год."
        source: { kind: authored }
      - pl: "Droga ciągnęła się bez końca."
        ru: "Дорога тянулась без конца."
        source: { kind: authored }
  - id: draw-to
    ru: "тянуть (влечь) — ciągnie kogoś do czegoś"
    examples:
      - pl: "Ciągnie go do domu."
        ru: "Его тянет домой."
        source: { kind: authored }
      - pl: "Od dziecka ciągnęło ją do muzyki."
        ru: "С детства её тянуло к музыке."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ЗВУКОВОЙ ЗАКОН С БОЛЬШОЙ ОТДАЧЕЙ: польское ci- отвечает русскому мягкому «т». Ciągnąć — «тянуть», ciało — «тело», cichy — «тихий», ciemny — «тёмный», ciepły — «тёплый», ciężki — «тяжкий». Причина в том, что праславянское мягкое t в польском перешло в ć. Встретив слово на ci-, подставьте русское на «тя-, те-, ти-, тё-»." }
  - { kind: pronunciation, text: "ДВА ПРАВИЛА СРАЗУ, ОБА УЖЕ ЗНАКОМЫЕ. Носовые чередуются в прошедшем: ciągnął с «он», но ciągnęła, ciągnęło, ciągnęli с «эн» — как płynął/płynęła. А страдательное причастие идёт по классу -nąć: ciągnięty, ciągnięci, как dorośnięty и zamknięty, а не «ciągniony»." }
  - { kind: government, text: "Тянут ЧТО — винительный: ciągnąć wóz, walizkę. Тянут ЗА что — za с винительным, как по-русски: ciągnąć za rękaw, za sznurek, za język. Безличный оборот влечения строится через винительный лица: ciągnie GO do domu «его тянет домой», ciągnęło JĄ do muzyki." }
  - { kind: usage, text: "Из этого же корня pociąg — и это «ПОЕЗД», буквально «то, что тянет». Но pociąg do czegoś значит уже «влечение к чему-то»: mieć pociąg do malarstwa. Одно слово на два смысла, оба выводятся из ciągnąć." }
collocations:
  - { pl: "ciągnąć za język", ru: "тянуть за язык" }
  - { pl: "ciągnie go do domu", ru: "его тянет домой" }
  - { pl: "ciągnąć losy", ru: "тянуть жребий" }
family:
  - { pl: "pociąg", ru: "поезд; влечение", relation: derived, id: pociag }
  - { pl: "ciągle", ru: "постоянно, всё время", relation: derived, id: ciagle }
  - { pl: "ciężki", ru: "тяжёлый", relation: root, id: ciezki }
etymology: "Праславянское *tęgnǫti дало польское ciągnąć и русское «тянуть» — это одно слово. Мягкое t перешло в польском в ć, отсюда разница в начале при полном родстве корня; та же пара видна в ciężki при «тяжком» и ciąża при «тяжести». Отсюда же pociąg «поезд» и ciąg «ряд, тяга»."
memory: "ciągnąć — «тянуть», и это буквально то же слово. Запомните закон: польское ci- отвечает русскому мягкому «т» — ciało «тело», cichy «тихий», ciepły «тёплый». А pociąg от того же корня значит «поезд»: то, что тянет."
idioms:
  - { pl: "ciągnąć kogoś za język", ru: "тянуть кого-л. за язык" }
  - { pl: "ciągnąć się w nieskończoność", ru: "тянуться без конца" }
