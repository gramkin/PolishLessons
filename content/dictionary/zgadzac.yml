# review
id: zgadzac
format: 2
lemma: "zgadzać"
rank: 388
pos: verb
aspect: imperf
pron: { cyr: "зга́дзаць" }
senses:
  - id: agree
    ru: "соглашаться (всегда с się)"
    examples:
      - pl: "Zgadzam się."
        ru: "Я согласен."
        source: { kind: tatoeba, id: 349105 }
      - pl: "Zgadzam się z nimi."
        ru: "Я с ними согласен."
        source: { kind: tatoeba, id: 13373838 }
      - pl: "Kategorycznie się z nią nie zgadzam."
        ru: "Я с ней в корне не согласен."
        source: { kind: tatoeba, id: 2493647 }
  - id: match
    ru: "сходиться, совпадать (о числах, фактах)"
    examples:
      - pl: "Zgadza się."
        ru: "Верно."
        source: { kind: translated, id: 1313417 }
      - pl: "Rachunki się nie zgadzają."
        ru: "Счета не сходятся."
        source: { kind: authored }
      - pl: "Tom się nie zgadza."
        ru: "Том не согласен."
        source: { kind: tatoeba, id: 12360235 }
notes:
  - { kind: usage, text: "Глагол практически всегда идёт с się: zgadzać się «соглашаться». Zgadzam się — самое частое польское «Я согласен»." }
  - { kind: usage, text: "Zgadza się! — отдельная реплика «Верно! Точно!», о совпадении фактов или чисел." }
  - { kind: usage, text: "Соглашаются с кем-то через z и творительный падеж: zgadzam się z tobą «я с тобой согласен»." }
  - { kind: usage, text: "Совершенный вид — zgodzić się. Отсюда же существительное zgoda «согласие» и реплика Zgoda! «Договорились!»" }
collocations:
  - { pl: "zgadzam się", ru: "я согласен" }
  - { pl: "zgadza się", ru: "верно, точно" }
  - { pl: "nie zgadzam się", ru: "я не согласен" }
  - { pl: "zgoda", ru: "согласие, договорились" }
etymology: "Из z- + godzić «мирить, прилаживать», от корня god- «пора, срок» — того же, что в русских «годиться», «угодить», «погода». Согласиться значит «прийтись впору»."
memory: "zgadzać się — «соглашаться», и почти всегда с się. Zgadzam się — «Я согласен», Zgadza się! — «Верно!». Внутри корень god-, как в русских «годиться» и «угодить»: согласиться значит прийтись впору."
idioms:
  - { pl: "zgadzam się", ru: "я согласен" }
  - { pl: "zgadza się!", ru: "верно!, точно!" }
  - { pl: "nie zgadzać się z czymś", ru: "не соглашаться с чем-либо" }
