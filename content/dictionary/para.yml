# review
id: para
format: 2
lemma: "para"
rank: 476
pos: noun
pron: { cyr: "па́ра" }
senses:
  - id: pair
    ru: "пара (двое, две вещи)"
    examples:
      - pl: "Kupiła dwie pary skarpetek."
        ru: "Она купила две пары носков."
        source: { kind: tatoeba, id: 365767 }
      - pl: "Są dobrą parą."
        ru: "Они хорошая пара."
        source: { kind: translated, id: 349013 }
      - pl: "Dobrana z nich para."
        ru: "Подобранная пара."
        source: { kind: translated, id: 5513649 }
  - id: steam
    ru: "пар (водяной)"
    examples:
      - pl: "Chmura to masa pary."
        ru: "Облако — это масса пара."
        source: { kind: translated, id: 11300567 }
      - pl: "Nad garnkiem unosi się para."
        ru: "Над кастрюлей поднимается пар."
        source: { kind: authored }
      - pl: "Lokomotywa ruszyła pod parą."
        ru: "Локомотив тронулся под парами."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Это два разных слова, случайно совпавших: para «пара» пришла из латинского par «равный», а para «пар» — праславянское, родня русским «пар» и «парить». Chmura to masa pary, но Są dobrą parą." }
  - { kind: usage, text: "Винительный parę в разговоре значит просто «несколько»: parę dni «несколько дней», parę razy «пару раз»." }
  - { kind: usage, text: "młoda para — «молодожёны»; iść w parze — «идти рука об руку»." }
  - { kind: usage, text: "nie do pary — «непарный, не под стать»: skarpetki nie do pary «непарные носки»." }
collocations:
  - { pl: "para butów", ru: "пара обуви" }
  - { pl: "młoda para", ru: "молодожёны" }
  - { pl: "parę dni", ru: "несколько дней" }
  - { pl: "iść w parze", ru: "идти рука об руку" }
etymology: "Два слова, случайно совпавших по звучанию: para «пара» — из латинского par «равный» через немецкий, а para «пар» — праславянское *para, то же, что русские «пар» и «парить»."
memory: "para — это сразу «пара» и «пар», два разных слова, сошедшихся в одном написании: «пара» из латинского par, а «пар» — родня русскому «парить». И запомните разговорное parę dni «несколько дней»."
idioms:
  - { pl: "młoda para", ru: "молодожёны" }
  - { pl: "iść w parze", ru: "идти рука об руку" }
  - { pl: "nie do pary", ru: "непарный, не под стать" }
