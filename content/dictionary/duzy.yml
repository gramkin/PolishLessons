# review
id: duzy
format: 2
lemma: "duży"
rank: 179
pos: adj
pron: { cyr: "ду́жы" }
senses:
  - id: big
    ru: "большой (по размеру)"
    examples:
      - pl: "Mam duży dom."
        ru: "У меня большой дом."
        source: { kind: tatoeba, id: 5956284 }
      - pl: "Mam dużego psa."
        ru: "У меня большая собака."
        source: { kind: tatoeba, id: 547169 }
      - pl: "On ma duże ręce."
        ru: "У него большие руки."
        source: { kind: tatoeba, id: 6154733 }
  - id: considerable
    ru: "большой, значительный (по количеству или степени)"
    examples:
      - pl: "Mamy duży problem."
        ru: "У нас большая проблема."
        source: { kind: tatoeba, id: 3070704 }
      - pl: "Mam duży nos."
        ru: "У меня большой нос."
        source: { kind: tatoeba, id: 8631927 }
      - pl: "Jaka duża książka!"
        ru: "Какая большая книга!"
        source: { kind: tatoeba, id: 3479807 }
notes:
  - { kind: usage, text: "duży говорит о размере, wielki добавляет оттенок значимости: duży dom «большой дом», wielki człowiek «великий человек»." }
  - { kind: usage, text: "Степени сравнения общие для обоих слов: większy, największy." }
  - { kind: usage, text: "duża litera — «заглавная буква»; duży pokój — «гостиная»." }
collocations:
  - { pl: "duży dom", ru: "большой дом" }
  - { pl: "duża litera", ru: "заглавная буква" }
  - { pl: "duże pieniądze", ru: "большие деньги" }
  - { pl: "za duży", ru: "слишком большой" }
etymology: "Северославянское *dužь «сильный, здоровый»; русский родственник — «дюжий». Значение «большой» развилось из «крепкий, обильный»."
memory: "duży — о размере, wielki — о значимости, но степень сравнения у них одна: większy, największy. А родственник в русском — «дюжий»."
idioms:
  - { pl: "duża litera", ru: "заглавная буква" }
  - { pl: "duży pokój", ru: "гостиная" }
  - { pl: "duże pieniądze", ru: "большие деньги" }
