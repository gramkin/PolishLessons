# review
id: pospieszyc
format: 2
lemma: "pospieszyć"
rank: 1507
pos: verb
aspect: perf
pron: { cyr: "поспе́шыць" }
senses:
  - id: hurry
    ru: "поторопиться, поспешить"
    examples:
      - pl: "Pospiesz się."
        ru: "Поторопись."
        source: { kind: translated, id: 355512 }
      - pl: "Muszę się pospieszyć!"
        ru: "Мне нужно поторопиться!"
        source: { kind: translated, id: 705310 }
      - pl: "Jeśli się pospieszysz, zdążysz."
        ru: "Если поторопишься, успеешь."
        source: { kind: translated, id: 360134 }
  - id: hasten-to
    ru: "поспешить куда-либо, к кому-либо"
    examples:
      - pl: "Najszybciej jak umiał pospieszył do drzwi."
        ru: "Как только мог быстро, он поспешил к двери."
        source: { kind: translated, id: 754590 }
      - pl: "Po skończeniu śniadania pospieszyłem do szkoły."
        ru: "Закончив завтрак, я поспешил в школу."
        source: { kind: translated, id: 1152508 }
notes:
  - { kind: usage, text: "Почти всегда с się: pospieszyć się «поторопиться». Pospiesz się! — одна из самых частых команд в языке." }
  - { kind: usage, text: "Допустимы обе записи — pospieszyć и pośpieszyć; словари считают их равноправными вариантами одного слова." }
  - { kind: government, text: "Без się значит «поспешить куда-то»: pospieszyć do drzwi «поспешить к двери», pospieszyć komuś z pomocą «поспешить кому-то на помощь»." }
  - { kind: usage, text: "Несовершенный вид — spieszyć się «спешить, торопиться»." }
collocations:
  - { pl: "pospiesz się", ru: "поторопись" }
  - { pl: "pospieszyć z pomocą", ru: "поспешить на помощь" }
  - { pl: "lepiej się pospieszmy", ru: "лучше поторопимся" }
etymology: "Приставка po- и spieszyć «спешить», от корня со значением «успех, спешка». Русские «спешить» и «успех» того же гнезда."
memory: "pospieszyć się — «поторопиться», и Pospiesz się! это самое частое употребление. Обе записи верны: pospieszyć и pośpieszyć. Корень тот же, что в русских «спешить» и «успех»."
idioms:
  - { pl: "pospiesz się", ru: "поторопись" }
  - { pl: "pospieszyć z pomocą", ru: "поспешить на помощь" }
  - { pl: "lepiej się pospieszmy", ru: "лучше поторопимся" }
