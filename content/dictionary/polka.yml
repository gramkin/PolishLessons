notes:
  - { kind: false-friend, text: "PÓŁKA — «полка», почти полное совпадение. Но в переносном смысле Z WYŻSZEJ PÓŁKI — «высокого класса, дорогой», Z NIŻSZEJ PÓŁKI — «подешевле». Это не «полка» в бане и не «полк»: полк — PUŁK. Полка в поезде — KUSZETKA или ŁÓŻKO." }
  - { kind: usage, text: "Женский род на -KA. Дательный и предложный — PÓŁCE: K чередуется с C. Родительный множественного — PÓŁEK со вставным E. Звательная форма PÓŁKO в карточку не включена: к полке не обращаются." }
  - { kind: government, text: "Где лежит — NA с предложным: NA PÓŁCE. Куда кладут — NA с винительным: POŁÓŻ NA PÓŁKĘ. С чем — Z с творительным: PÓŁKA Z KSIĄŻKAMI. Какого уровня — Z с родительным: Z GÓRNEJ PÓŁKI." }
  - { kind: pronunciation, text: "Читается «пу́ука»: Ó — «у», Ł — тоже «у», поэтому получается двойное «уу». Ударение на первом слоге. PÓŁCE — «пу́уцэ», PÓŁEK — «пу́уэк»." }
  - { kind: register, text: "Нейтральное бытовое слово. Оборот Z WYŻSZEJ PÓŁKI — разговорный и рекламный: GOŚCIE Z NAJWYŻSZEJ PÓŁKI «гости самого высокого ранга»." }
