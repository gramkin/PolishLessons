etymology: "Происхождение спорно. Польское PÓŁKA и русское «полка» — явно одно слово; его связывают то с PÓŁ «половина» (доска, разделяющая шкаф), то с древним заимствованием. Надёжной версии нет."
memory: "Półka — полка: książki na półce. Z wyższej półki — высокого класса. Полк — pułk, не путать."
idioms:
