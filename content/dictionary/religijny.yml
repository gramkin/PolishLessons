notes:
  - { kind: usage, text: "Слово полезно тем, что показывает целое правило соответствий. Польские существительные на -CJA отвечают русским на -ЦИЯ: RELIGIA и «религия», INFORMACJA и «информация», OPERACJA и «операция», STACJA и «станция». А прилагательные от них в польском кончаются на -CYJNY или -JNY, где русский ставит -ЦИОННЫЙ или -ОЗНЫЙ: INFORMACYJNY и «информационный», OPERACYJNY и «операционный», RELIGIJNY и «религиозный». Одиннадцать форм; в значении о человеке мера выражается наречием, BARDZO RELIGIJNY." }
  - { kind: false-friend, text: "Русское «религиозный» покрывает оба польских значения, а вот обратно переводить надо осторожнее. Человека верующего поляк чаще назовёт WIERZĄCY «верующий» или PRAKTYKUJĄCY «практикующий», а RELIGIJNY прозвучит чуть более отстранённо, как характеристика со стороны. Отдельно стоит RELIGIJNIE, которое значит не только «религиозно», но и «неукоснительно, свято»: PRZESTRZEGAŁ TEGO RELIGIJNIE — «он соблюдал это свято». Это переносное значение русскому слову не свойственно." }
  - { kind: government, text: "Прилагательное только согласуется. Запомнить стоит управление существительного: WIARA W BOGA «вера в Бога», предлог W с винительным, как по-русски. Принадлежность к вере выражается через WYZNANIE: JAKIEGO JEST WYZNANIA «какого он вероисповедания», родительный. Конституционный оборот WOLNOŚĆ RELIGIJNA употребляется без предлога, а рядом с ним стоит WOLNOŚĆ SUMIENIA «свобода совести», и в польских документах они идут парой." }
  - { kind: pronunciation, text: "Читается «религи́йны», четыре слога, ударение на предпоследнем, то есть на GIJ. Сочетание GI звучит мягко, «ги», а следующая J даёт «й», поэтому середина слова слышится как «гий». Конечное Y — это «ы». В существительном RELIGIA ударение падает на второй слог: «рели́гя», причём I перед A работает знаком мягкости, а не отдельным гласным, так что слогов там три, а не четыре." }
  - { kind: register, text: "Слово нейтральное, живёт в газетах, в документах и в разговорах о семье. Частые обороты: WOLNOŚĆ RELIGIJNA «свобода вероисповедания», ŚWIĘTA RELIGIJNE «религиозные праздники», WYCHOWANIE RELIGIJNE «религиозное воспитание», PRAKTYKI RELIGIJNE. В Польше школьный предмет называется RELIGIA, и фраза CHODZIĆ NA RELIGIĘ значит «ходить на уроки религии», а не «ходить в религию». Существительное RELIGIJNOŚĆ значит «религиозность»." }
