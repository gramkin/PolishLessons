etymology: "Из латинского RELIGIO, и оба языка взяли слово книжным путём, но приспособили по-разному, и в этом вся разница их вида. Польский построил прилагательное от своего же существительного RELIGIA, добавив суффикс -JNY, и получил RELIGIJNY. Русский взял латинское прилагательное RELIGIOSUS целиком и получил «религиозный». Отсюда правило, которое работает на целом разряде слов: там, где русский кончает на -ОЗНЫЙ или -ЦИОННЫЙ, польский кончает на -JNY или -CYJNY. Само латинское RELIGIO связывают с RELIGARE «связывать», то есть с идеей связи человека с божеством."
memory: "Выучить лучше правило, чем слово: польские -cja отвечают русским -ция, religia и «религия», informacja и «информация», а прилагательные от них кончаются на -jny и -cyjny там, где русский ставит -озный и -ционный, religijny и «религиозный», informacyjny и «информационный». О человеке поляк чаще скажет wierzący «верующий». И запомнить переносное religijnie «свято, неукоснительно». Читается «религи́йны», ударение на предпоследнем слоге."
