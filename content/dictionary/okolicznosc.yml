notes:
  - { kind: usage, text: "zbieg okoliczności «стечение обстоятельств» — самый частый оборот, и он же значит просто «совпадение»." }
  - { kind: government, text: "w tych okolicznościach «при этих обстоятельствах» — предложный падеж, как в русском." }
  - { kind: false-friend, text: "Корень okolica «окрестность»: обстоятельство — то, что вокруг дела. Русское «обстоятельство» от «обстоять» построено на том же образе." }
  - { kind: usage, text: "okoliczności łagodzące «смягчающие обстоятельства» — юридический термин, калька та же, что в русском." }
collocations:
  - { pl: "zbieg okoliczności", ru: "стечение обстоятельств" }
  - { pl: "w tych okolicznościach", ru: "при этих обстоятельствах" }
etymology: "От okoliczny «окрестный», от okolica «окрестность»; русское «обстоятельство» от «обстоять» построено на том же образе."
memory: "okoliczność — «обстоятельство», буквально «то, что вокруг». Запомните zbieg okoliczności «стечение обстоятельств», которое значит и просто «совпадение»."
