# review
id: wieczor
format: 2
lemma: "wieczór"
rank: 339
pos: noun
pron: { cyr: "ве́чур" }
senses:
  - id: evening
    ru: "вечер"
    examples:
      - pl: "Był wieczór."
        ru: "Был вечер."
        source: { kind: tatoeba, id: 822160 }
      - pl: "Wczoraj uczył się cały wieczór."
        ru: "Вчера он учился весь вечер."
        source: { kind: tatoeba, id: 924570 }
      - pl: "Tom lubi czytać wieczorami."
        ru: "Том любит читать по вечерам."
        source: { kind: tatoeba, id: 6030962 }
  - id: evening-phrases
    ru: "вечер (в приветствии и обороте wieczorem)"
    examples:
      - pl: "Dobry wieczór."
        ru: "Добрый вечер."
        source: { kind: tatoeba, id: 399614 }
      - pl: "Co robisz dziś wieczorem?"
        ru: "Что ты делаешь сегодня вечером?"
        source: { kind: tatoeba, id: 525570 }
      - pl: "Jesteś wolny dziś wieczorem?"
        ru: "Ты сегодня вечером свободен?"
        source: { kind: tatoeba, id: 442668 }
notes:
  - { kind: usage, text: "Dobry wieczór! — приветствие после наступления темноты; днём говорят Dzień dobry!" }
  - { kind: usage, text: "«Вечером» передаётся творительным падежом: wieczorem, dziś wieczorem «сегодня вечером», wieczorami «по вечерам»." }
  - { kind: usage, text: "wieczór kawalerski — «мальчишник», wieczór panieński — «девичник»." }
collocations:
  - { pl: "dobry wieczór", ru: "добрый вечер" }
  - { pl: "dziś wieczorem", ru: "сегодня вечером" }
  - { pl: "cały wieczór", ru: "весь вечер" }
  - { pl: "do wieczora", ru: "до вечера" }
etymology: "Праславянское *večerъ из праиндоевропейского *wekʷsperos — то же слово, что русское «вечер»."
memory: "wieczór — «вечер», а «вечером» передаётся творительным падежом: wieczorem. Приветствие Dobry wieczór! говорят, когда стемнело."
idioms:
  - { pl: "dobry wieczór", ru: "добрый вечер" }
  - { pl: "wieczór kawalerski", ru: "мальчишник" }
  - { pl: "do wieczora!", ru: "до вечера!" }
formExamples:
  - form: "wieczorach"
    pl: "W długich wieczorach czytaliśmy na głos."
    ru: "В долгие вечера мы читали вслух."
    source: { kind: authored }
  - form: "wieczorach"
    pl: "Mówiliśmy o zimowych wieczorach."
    ru: "Мы говорили о зимних вечерах."
    source: { kind: authored }
  - form: "wieczorach"
    pl: "W tych wieczorach było coś spokojnego."
    ru: "В этих вечерах было что-то спокойное."
    source: { kind: authored }
  - form: "wieczorami"
    pl: "Tom lubi czytać wieczorami."
    ru: "Том любит читать по вечерам."
    source: { kind: tatoeba, id: 6030962 }
  - form: "wieczorami"
    pl: "Nie wiem czemu, ale wieczorami czuję się najżywszy."
    ru: "Почему-то по ночам я бодрее."
    source: { kind: tatoeba, id: 351394 }
  - form: "wieczorami"
    pl: "Bardzo ciepło jest wieczorami."
    ru: "По вечерам очень тепло."
    source: { kind: translated, id: 354089 }
  - form: "wieczorem"
    pl: "Co robisz dziś wieczorem?"
    ru: "Что ты делаешь сегодня вечером?"
    source: { kind: tatoeba, id: 525570 }
  - form: "wieczorem"
    pl: "Jesteś wolny dziś wieczorem?"
    ru: "Ты сегодня вечером свободен?"
    source: { kind: tatoeba, id: 442668 }
  - form: "wieczorem"
    pl: "Jestem dziś wieczorem zajęta."
    ru: "Сегодня вечером я занята."
    source: { kind: tatoeba, id: 6320450 }
  - form: "wieczorom"
    pl: "Dzięki długim wieczorom zdążyliśmy dużo przeczytać."
