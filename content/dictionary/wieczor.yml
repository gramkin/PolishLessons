  - form: "wieczorowi"
    pl: "Przyjrzyj się temu wieczorowi z bliska."
    ru: "Присмотрись к этому вечеру вблизи."
    source: { kind: authored }
  - form: "wieczorowi"
    pl: "Ma się ku wieczorowi."
    ru: "Дело идёт к вечеру."
