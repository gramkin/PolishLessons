# review
id: restauracja
format: 2
lemma: "restauracja"
rank: 1271
pos: noun
pron: { cyr: "рэстаура́цья" }
senses:
  - id: restaurant
    ru: "ресторан"
    examples:
      - pl: "Oto restauracja, w której często jadam."
        ru: "Вот ресторан, в котором я часто ем."
        source: { kind: tatoeba, id: 725587 }
      - pl: "To najlepsza restauracja, jaką znam."
        ru: "Это лучший ресторан, который я знаю."
        source: { kind: translated, id: 361166 }
      - pl: "Ta restauracja jest zawsze pełna."
        ru: "Этот ресторан всегда полон."
        source: { kind: translated, id: 765805 }
  - id: to-from
    ru: "do restauracji, w restauracji — в ресторан, в ресторане"
    examples:
      - pl: "Idę do restauracji."
        ru: "Я иду в ресторан."
        source: { kind: translated, id: 2349196 }
      - pl: "Wyszła z restauracji."
        ru: "Она вышла из ресторана."
        source: { kind: translated, id: 734169 }
      - pl: "W tej restauracji nie wolno palić."
        ru: "В этом ресторане нельзя курить."
        source: { kind: tatoeba, id: 6689969 }
  - id: open
    ru: "открыть, найти ресторан"
    examples:
      - pl: "Chcesz otworzyć swoją restaurację?"
        ru: "Ты хочешь открыть свой ресторан?"
        source: { kind: tatoeba, id: 13206444 }
      - pl: "Uwielbiam tę restaurację."
        ru: "Я обожаю этот ресторан."
        source: { kind: translated, id: 12890369 }
      - pl: "Znaleźliśmy świetną restaurację."
        ru: "Мы нашли отличный ресторан."
        source: { kind: translated, id: 4258157 }
notes:
  - { kind: usage, text: "Форма restauracyj — устаревший родительный множественного; современная норма restauracji, поэтому restauracyj оставлена без примеров. Так у всех слов на -ja: stacja — stacji, telewizja — telewizji." }
  - { kind: government, text: "iść do restauracji «идти в ресторан» — предлог do с родительным. Jeść w restauracji «есть в ресторане» — предлог w с предложным." }
  - { kind: usage, text: "Второе значение — «реставрация»: и восстановление здания, и возвращение династии. В быту встречается почти только первое." }
  - { kind: usage, text: "Рядом стоят lokal «заведение» и bar mleczny «молочный бар» — дешёвая польская столовая." }
  - { kind: pronunciation, text: "Сочетание au читается в два звука, а конечное -ja как «-ья»: рэстаура́цья." }
collocations:
  - { pl: "iść do restauracji", ru: "идти в ресторан" }
  - { pl: "w restauracji", ru: "в ресторане" }
  - { pl: "otworzyć restaurację", ru: "открыть ресторан" }
etymology: "Из французского restauration «восстановление», от латинского restaurare «восстанавливать». Ресторан назван так потому, что «восстанавливал силы»."
memory: "restauracja — «ресторан», а заодно и «реставрация». Предлоги: idę do restauracji «иду в ресторан», jem w restauracji «ем в ресторане». Название буквально значит «восстановление сил»."
idioms:
  - { pl: "iść do restauracji", ru: "идти в ресторан" }
  - { pl: "w restauracji", ru: "в ресторане" }
  - { pl: "otworzyć restaurację", ru: "открыть ресторан" }
formExamplesSkip:
