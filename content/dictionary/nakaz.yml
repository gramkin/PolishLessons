pos: noun
pron: { cyr: "на́кас" }
senses:
  - id: warrant
    ru: "ордер, предписание"
    examples:
      - pl: "Macie nakaz rewizji?"
        ru: "У вас есть ордер на обыск?"
        source: { kind: translated, id: 3781431 }
      - pl: "Ma pan nakaz rewizji?"
        ru: "У вас есть ордер на обыск?"
        source: { kind: translated, id: 3781432 }
      - pl: "Otrzymaliśmy nakaz eksmisji."
        ru: "Мы получили предписание о выселении."
        source: { kind: translated, id: 525590 }
  - id: command
    ru: "веление, требование"
    examples:
      - pl: "To nakaz sumienia."
        ru: "Это веление совести."
        source: { kind: authored }
      - pl: "Nakaz jest jasny i nie podlega dyskusji."
        ru: "Предписание ясно и не подлежит обсуждению."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Юридический набор: nakaz rewizji «ордер на обыск», nakaz eksmisji «предписание о выселении», nakaz aresztowania «ордер на арест»." }
  - { kind: usage, text: "Слово редкое вне официальной речи: в корпусе всего три примера, и все в именительном падеже." }
  - { kind: usage, text: "Противоположность — zakaz «запрет»: nakaz велит сделать, zakaz запрещает. Пара различается только приставкой." }
  - { kind: usage, text: "Образовано от nakazać «приказать, предписать»; сравните rozkaz «приказ»." }
collocations:
  - { pl: "nakaz rewizji", ru: "ордер на обыск" }
  - { pl: "nakaz eksmisji", ru: "предписание о выселении" }
  - { pl: "nakaz sumienia", ru: "веление совести" }
etymology: "От nakazać «приказать, предписать» (na- + kazać «велеть»). Русское «наказ» — то же слово с тем же строением, только в русском оно значит «поручение», а в польском — официальное предписание."
memory: "nakaz = «ордер, предписание»: nakaz rewizji «ордер на обыск». Держите рядом пару: nakaz велит сделать, zakaz «запрет» запрещает — слова различаются одной приставкой."
