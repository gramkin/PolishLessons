        ru: "Дому нужен капитальный ремонт."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Совпадения с русским «генеральный» много: DYREKTOR GENERALNY, PRÓBA GENERALNA. Но есть и расхождения. «Капитальный ремонт» по-польски REMONT GENERALNY или KAPITALNY, а «генеральная уборка» — GENERALNE PORZĄDKI, во множественном числе. Наречие GENERALNIE в разговоре значит «в общем, вообще-то», и молодёжь вставляет его в каждую фразу: GENERALNIE TO NIE WIEM." }
  - { kind: usage, text: "Степеней сравнения нет. Все одиннадцать форм живые. Форма для мужчин-людей GENERALNI встречается в названиях должностей: DYREKTORZY GENERALNI, KONSULOWIE GENERALNI. Обратите внимание: прилагательное в должности пишется со строчной буквы, даже в титулах." }
  - { kind: government, text: "В названиях должностей и учреждений ставится после существительного: SEKRETARZ GENERALNY, DYREKCJA GENERALNA. В значении «полный» — перед: GENERALNY REMONT, GENERALNE PORZĄDKI. Падежных требований нет." }
  - { kind: pronunciation, text: "Читается «гэнэра́льны», четыре слога, ударение на предпоследнем. G и N перед E твёрдые: «гэ», «нэ». L перед N мягкая, «ль». Русское «генера́льный» ударяет тот же слог." }
  - { kind: register, text: "Слово официальное в названиях и обычное в быту в сочетании GENERALNE PORZĄDKI. Наречие GENERALNIE — разговорное слово-паразит, его стоит знать, но не злоупотреблять им: в серьёзной речи оно звучит небрежно." }
collocations:
  - { pl: "dyrektor generalny", ru: "генеральный директор" }
  - { pl: "generalne porządki", ru: "генеральная уборка" }
  - { pl: "próba generalna", ru: "генеральная репетиция" }
family:
  - { pl: "generał", ru: "генерал", relation: root, id: general }
  - { pl: "generalnie", ru: "в общем, вообще", relation: derived }
  - { pl: "ogólny", ru: "общий", relation: root }
etymology: "Из латинского generalis, «общий, относящийся к роду», от genus «род». Генеральное — то, что касается всего рода, целиком, отсюда «главный» и «полный». GENERAŁ, «генерал», — сокращение от «генеральный капитан», то есть «главный над всем войском». Своё польское слово для «общий» — OGÓLNY."
memory: "Generalny — генеральный, главный: dyrektor generalny. И полный: generalne porządki — генеральная уборка, generalny remont — капитальный ремонт. Generalnie — «в общем». Читается «гэнэра́льны»."
