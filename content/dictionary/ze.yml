notes:
  - { kind: usage, text: "Перед że всегда ставится запятая, как перед русским «что»." }
collocations:
  - { pl: "dlatego że", ru: "потому что" }
  - { pl: "mimo że", ru: "несмотря на то что" }
  - { pl: "tak że", ru: "так что" }
etymology: "Старопольское iże из праславянского *jьže; та же основа, что в русской частице «же»."
memory: "że — это союз «что», а co — вопросительное «что». Wiem, że pracujesz «Я знаю, что ты работаешь», но Co robisz? «Что ты делаешь?». Производное żeby значит «чтобы»."
idioms:
  - { pl: "że tak powiem", ru: "так сказать" }
  - { pl: "no i co z tego, że...", ru: "ну и что с того, что…" }
