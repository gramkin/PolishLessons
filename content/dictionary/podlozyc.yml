# review
id: podlozyc
format: 2
lemma: "podłożyć"
rank: 4148
pos: verb
pron: { cyr: "подуо́жыць" }
senses:
  - id: put-under
    ru: "подложить, подстелить"
    examples:
      - pl: "Podłożyła poduszkę pod głowę chorego."
        ru: "Она подложила подушку под голову больного."
        source: { kind: authored }
      - pl: "Podłóż gazetę, bo nabrudzisz."
        ru: "Подстели газету, а то испачкаешь."
        source: { kind: authored }
      - pl: "Podłożył rękę pod głowę i zasnął."
        ru: "Он подложил руку под голову и уснул."
        source: { kind: authored }
  - id: plant
    ru: "заложить (бомбу), подбросить; поджечь — PODŁOŻYĆ OGIEŃ"
    examples:
      - pl: "Podłożył bombę pod samochód."
        ru: "Он заложил бомбу под машину."
        source: { kind: authored }
      - pl: "Podłożyli ogień pod stodołę."
        ru: "Они подожгли сарай."
        source: { kind: authored }
  - id: dub
    ru: "наложить (звук, музыку), озвучить"
    examples:
      - pl: "Podłożyła głos pod postać księżniczki."
        ru: "Она озвучила принцессу."
        source: { kind: authored }
      - pl: "Studio podłożyło nową muzykę pod film."
        ru: "Студия наложила на фильм новую музыку."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "PODŁOŻYĆ — «подложить», и PODŁOŻYĆ KOMUŚ ŚWINIĘ значит то же, что русское «подложить свинью». Но PODŁOŻYĆ BOMBĘ — «заложить бомбу», PODŁOŻYĆ OGIEŃ — «поджечь», PODŁOŻYĆ GŁOS — «озвучить». PODŁOŻE — «основа, грунт»." }
  - { kind: usage, text: "Пятьдесят две формы: страдательное PODŁOŻONY — о вещах, бомбах, звуке; форма для мужчин-людей PODŁOŻENI в карточку не включена. Будущее: PODŁOŻĘ, PODŁOŻYSZ; повелительное с Ó: PODŁÓŻ. Несовершенный вид — PODKŁADAĆ." }
  - { kind: government, text: "Что подо что — винительный и POD с винительным: PODŁOŻYĆ PODUSZKĘ POD GŁOWĘ. Кому — дательный: PODŁOŻYĆ KOMUŚ ŚWINIĘ. Музыку к чему — POD с винительным: POD FILM." }
  - { kind: pronunciation, text: "Читается «подуо́жыць»: Ł — «у», ŻY — «жы», ударение на предпоследнем слоге. PODŁOŻĘ — «подуо́жэ», PODŁÓŻ — «по́дууш»." }
  - { kind: register, text: "В прямом смысле — нейтральное. PODŁOŻYĆ BOMBĘ, OGIEŃ — газетное. PODŁOŻYĆ ŚWINIĘ — разговорное." }
collocations:
  - { pl: "podłożyć poduszkę", ru: "подложить подушку" }
  - { pl: "podłożyć bombę", ru: "заложить бомбу" }
  - { pl: "podłożyć ogień", ru: "поджечь" }
family:
  - { pl: "położyć", ru: "положить", relation: root, id: polozyc }
  - { pl: "włożyć", ru: "вложить, надеть", relation: derived, id: wlozyc }
  - { pl: "podkładać", ru: "подкладывать", relation: aspect }
etymology: "Приставка POD- «под-» плюс ŁOŻYĆ «класть», праславянское *ložiti. Польское Ł на месте русского «л»: PODŁOŻYĆ — «подложить»."
memory: "Podłożyć — подложить: podłożyła poduszkę. Podłożyć bombę — заложить бомбу. Podłożyć komuś świnię — подложить свинью. Читается «подуо́жыць»."
idioms:
  - { pl: "podłożyć komuś świnię", ru: "подложить кому-то свинью" }
formExamplesSkip:
  - { form: "podłożeni", reason: "людей не подкладывают: формы для мужчин-людей нет" }
