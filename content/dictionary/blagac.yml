# review
id: blagac
format: 2
lemma: "błagać"
rank: 1192
pos: verb
aspect: imperf
pron: { cyr: "буа́гаць" }
senses:
  - id: beg
    ru: "умолять, упрашивать — błagać o coś"
    examples:
      - pl: "Tom błagał o jedzenie."
        ru: "Том умолял о еде."
        source: { kind: translated, id: 1590890 }
      - pl: "Tom błagał Mary o jeszcze jedną szansę."
        ru: "Том умолял Мэри дать ему ещё один шанс."
        source: { kind: translated, id: 12359914 }
      - pl: "Starszy człowiek błagał mnie o pieniądze."
        ru: "Пожилой человек умолял меня дать денег."
        source: { kind: translated, id: 3502809 }
  - id: beg-clause
    ru: "умолять, чтобы — с придаточным żeby или aby"
    examples:
      - pl: "Błagał mnie, abym go bronił."
        ru: "Он умолял меня защитить его."
        source: { kind: translated, id: 12353703 }
      - pl: "Tom błagał nas, żebyśmy zostali."
        ru: "Том умолял нас остаться."
        source: { kind: translated, id: 4122289 }
      - pl: "Tom błagał mnie, żebym nie robił mu krzywdy."
        ru: "Том умолял меня не причинять ему вреда."
        source: { kind: translated, id: 3294985 }
  - id: formula
    ru: "błagam! — умоляю!, ну пожалуйста! (готовая формула)"
    examples:
      - pl: "Błagam cię!"
        ru: "Умоляю тебя!"
        source: { kind: translated, id: 6729640 }
      - pl: "Błagam, nie mów mamie!"
        ru: "Умоляю, не говори маме!"
        source: { kind: translated, id: 9190636 }
      - pl: "Błagam o przebaczenie."
        ru: "Я молю о прощении."
        source: { kind: tatoeba, id: 11741396 }
notes:
  - { kind: government, text: "błagać o coś «умолять о чём-то» — предлог o с винительным падежом: błagać o pomoc, błagać o litość. С придаточным нужен союз żeby или aby: Błagał mnie, żebym został." }
  - { kind: usage, text: "Błagam! — готовая формула «умоляю!», «ну пожалуйста!». В живой речи это самая частая форма глагола." }
  - { kind: register, text: "Сильнее, чем prosić «просить»: błagać — отчаянная мольба. Обычная вежливая просьба — всегда prosić." }
  - { kind: usage, text: "Вид несовершенный. Совершенный — ubłagać «упросить, вымолить»: Ubłagałem go «Я его упросил»." }
collocations:
  - { pl: "błagać o pomoc", ru: "умолять о помощи" }
  - { pl: "błagać o litość", ru: "умолять о пощаде" }
  - { pl: "błagam cię", ru: "умоляю тебя" }
etymology: "Из старочешского blahati «ублажать, славить», родственного праславянскому *bolgъ «благой». Русские «благо» и «ублажать» — из того же гнезда: умолять значило «задабривать добрым словом»."
memory: "błagać — «умолять», сильнее чем prosić. Управление: błagać o coś с винительным, либо błagać, żeby… с придаточным. Самая частая форма — готовое błagam! «умоляю!». Совершенный вид — ubłagać, а корень тот же, что в русском «благо»."
idioms:
  - { pl: "błagam cię!", ru: "умоляю тебя!" }
  - { pl: "błagać o litość", ru: "умолять о пощаде" }
  - { pl: "błagać na kolanach", ru: "умолять на коленях" }
formExamplesSkip:
  - { form: "błagano", reason: "безличная форма прошедшего времени: в корпусе нет примеров" }
