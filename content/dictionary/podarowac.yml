notes:
  - { kind: false-friend, text: "PODAROWAĆ — «подарить», с русским совпадает полностью: PODAROWAĆ KWIATY. В отличие от DAROWAĆ, у которого есть значение «простить», PODAROWAĆ — только «подарить, отдать в дар». В быту так же часто говорят DAĆ W PREZENCIE или DAĆ NA URODZINY." }
  - { kind: usage, text: "Пятьдесят две формы: страдательное PODAROWANY — о вещах, «подаренный»; форма для мужчин-людей PODAROWANI в карточку не включена. Спряжение на -UJĘ: PODARUJĘ, PODARUJESZ. Пары по виду нет: несовершенный — DAROWAĆ или DAWAĆ W PREZENCIE." }
  - { kind: government, text: "Что кому — винительный и дательный: PODAROWAĆ MAMIE KWIATY. На что — NA с винительным: NA URODZINY, NA ŚLUB. В дар учреждению — дательный: PODAROWAĆ SZKOLE KSIĄŻKI." }
  - { kind: pronunciation, text: "Читается «подаро́ваць», четыре слога, ударение на предпоследнем. Конечное Ć — «ць». PODARUJĘ — «подару́е», PODARUJ — «пода́руй»." }
  - { kind: register, text: "Нейтральное и тёплое слово. Чуть торжественнее, чем DAĆ: PODAROWAŁ JEJ PIERŚCIONEK. О времени и жизни — литературное: PODAROWAĆ KOMUŚ SWÓJ CZAS." }
collocations:
  - { pl: "podarować kwiaty", ru: "подарить цветы" }
  - { pl: "podarować na urodziny", ru: "подарить на день рождения" }
  - { pl: "podarować drugą szansę", ru: "подарить второй шанс" }
family:
  - { pl: "darować", ru: "дарить; прощать", relation: root, id: darowac }
  - { pl: "podarunek", ru: "подарок", relation: derived }
  - { pl: "prezent", ru: "подарок", relation: root, id: prezent }
etymology: "Приставка PO- плюс DAROWAĆ «дарить», от DAR «дар», праславянское *darъ. Русское «подарить», «подарок» — то же гнездо."
memory: "Podarować — подарить: podarował mi książkę. Komuś coś — дательный + винительный. Podarunek — подарок. Читается «подаро́ваць»."
idioms:
